  - id: SI005
    publisher: Hopper
    title: Mission & Values
    url: https://hopper.com/culture/mission-values/page
    accessDate: '2026-10-17'
    accessStatus: ok
    stance: confirming
    sourceType: official
    reputationTier: high
    independence: company
    topics:
      - margin-philosophy
      - profitability
      - pricing
    keyQuote: >-
      There are two kinds of companies: those that work to charge more, and those that work to charge less. By working
      to make travel more affordable for everyone, Hopper will be the second. This is keyPercentage margins don’t matter
      — what actually matters are margin dollars (the dollars earned). Companies are not valued by their percentage
      margins, but by how many dollars they actually make and a multiple of that. This is why this works in concert and
      not in opposition with our objective to lower prices for our customers, as lower prices lead to more sales which
      lead to more margin dollars.
    canonical: SO008
  - id: SI006
    publisher: Hopper
    title: Culture Guide
    url: https://hopper.com/culture/culture-guide/page
    accessDate: '2026-10-17'
    accessStatus: ok
    stance: confirming
    sourceType: official
    reputationTier: high
    independence: company
    topics:
      - cost-structure
      - competition
      - margin-profile
    keyQuote: >-
      From Amazon we borrow a blueprint for speed, innovation and of course customer centricity. These principles work
      well for us because, just like Amazon, we operate a low-margin business that sells commodity inventory. Many
      highly successful tech companies offer completely unique products or services that customers have no choice but to
      purchase from them. For example, Google, Apple, Facebook, Netflix, Uber and Airbnb dominate because they offer
      products or services that have no other real competitive equivalent in the market. Amazon has always been an
      outlier because, since its foundation, most of its revenue has come from selling products that are readily
      available in thousands of other websites and retail stores. Even today, the vast majority of Amazon’s inventory is
      widely available everywhere. Hopper is in a similar situation: all of the flights and hotels that we sell can be
      booked in thousands of other places, including directly from the companies that provide them to us. In a category
      where there is literally no advantage to be gained from inventory, we can only differentiate through product
      innovation and extreme customer centricity.
    canonical: SP007
