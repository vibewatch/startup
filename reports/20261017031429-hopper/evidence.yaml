evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: Full current board roster, committee structure, observer rights, and any founder or investor control provisions.
    whyItMatters: >-
      Governance opacity makes it hard to assess key-person dependency, board independence, and who can force or block
      strategic outcomes.
    diligencePath: >-
      Request the current board deck, financing side letters, and corporate governance summary from management or the
      data room.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: funding-history
    missingEvidence: A reconciled financing ledger that shows every round, instrument, and cumulative capital raised.
    whyItMatters: >-
      Public summaries currently disagree on whether Hopper raised roughly $600 million by 2021 or only $175 million
      total, which directly affects dilution and valuation context.
    diligencePath: Obtain the cap table, round closing documents, and any investor update that reconciles cumulative proceeds.
    relatedQuestionRefs:
      - QO003
      - QO007
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited FY2024-FY2026 revenue, gross margin, EBITDA or cash-burn detail, partner concentration, and B2B versus
      consumer mix.
    whyItMatters: >-
      The company can be shown as scaled, but present-day profitability, liquidity, and concentration cannot be
      underwritten from the assigned public pool.
    diligencePath: Request audited financial statements, monthly operating KPIs, and top-partner concentration schedules.
    relatedQuestionRefs:
      - QO004
      - QO007
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: customer-scale
    missingEvidence: Current active customers, booked travelers, and named enterprise accounts or locations.
    whyItMatters: >-
      Downloads and brand recognition are weaker diligence anchors than active users, repeat bookers, and live partner
      count.
    diligencePath: Ask management for current customer, partner, and geographic operating metrics tied to the same reporting period.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: diligence-gap
    missingEvidence: Partner-level GMV, attach rate, take rate, renewal rate, and contribution margin by channel.
    whyItMatters: >-
      These metrics determine whether enterprise mix growth translates into durable, high-quality revenue or simply
      shifts volume into lower-share modular contracts.
    diligencePath: >-
      Request partner cohort disclosures or board materials that separate managed portal revenue from API and fintech
      revenue by major account.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: A source-backed SAM or SOM split by geography, buyer segment, and budget owner.
    whyItMatters: >-
      Without a constrained addressable-market view, valuation can drift toward generic travel-app TAM language rather
      than the narrower enterprise workflows Hopper actually monetizes.
    diligencePath: >-
      Rebuild market size from partner count, loyalty-program member bases, disclosed travel spend pools, and supplier
      attach assumptions for each buyer segment.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM001
      - TM002
      - TM003
  - type: missing-source
    severity: material
    topic: pricing-opacity
    missingEvidence: >-
      Public or diligenced enterprise pricing, take-rate, and discount structures for HTS contracts and fintech attach
      products.
    whyItMatters: >-
      Without commercial terms, the chapter can describe product shape but cannot prove whether Hopper wins on economics
      or simply on narrative differentiation.
    diligencePath: Request partner contracts, fee schedules, and win-loss notes against legacy OTA and internal-build alternatives.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: insourcing-risk
    missingEvidence: Partner-level retention, renewal, and insourcing data after large enterprise launches.
    whyItMatters: >-
      The moat depends on whether Hopper remains embedded after partners learn the workflow and decide which modules to
      keep in-house.
    diligencePath: Review partner renewal cohorts, module attach rates, and any post-launch scope reductions or insourcing decisions.
  - type: missing-source
    severity: material
    topic: independent-benchmark
    missingEvidence: >-
      Independent comparative benchmark on conversion lift, servicing quality, and trust outcomes versus major OTAs or
      direct channels.
    whyItMatters: >-
      Current evidence shows positioning and product breadth, but not a clean outside-in proof that Hopper's feature
      stack consistently outperforms substitute channels.
    diligencePath: >-
      Collect third-party case studies, partner A/B results, or procurement evaluations that compare Hopper against
      incumbent OTA and direct-booking options.
    relatedQuestionRefs:
      - QP003
      - QP008
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: >-
      Current cash balance, monthly burn, debt facilities, and management's runway view after the last disclosed primary
      financing.
    whyItMatters: Capital adequacy and financing dependency cannot be underwritten without current liquidity and burn data.
    diligencePath: >-
      Request the latest board deck or audited management accounts with cash, burn, debt, and a 12-18 month runway
      bridge.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Segment gross margin, take rate, attach rate, claims ratio, and customer acquisition payback for B2C bookings,
      fintech, and Hopper Cloud.
    whyItMatters: >-
      The public story suggests attractive attachment economics, but not whether those products create durable
      contribution margin after claims, support, rev share, and compliance.
    diligencePath: Request a segment-level P&L with take rates, attach, loss ratios, support cost, and CAC/payback by channel.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: revenue-recognition
    missingEvidence: >-
      Revenue mix and recognition policy across merchant bookings, agency bookings, fintech products, and Hopper Cloud
      contracts.
    whyItMatters: >-
      Mix and recognition determine how comparable Hopper's disclosed growth signals are to OTA or SaaS benchmarks and
      whether margin quality is overstated.
    diligencePath: >-
      Obtain the revenue-recognition memo and the latest segment bridge showing gross bookings, revenue, and gross
      profit by stream.
    relatedQuestionRefs:
      - QI001
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: missing-source
    severity: material
    topic: partner-concentration
    missingEvidence: Current partner concentration, renewal timing, and post-Capital One revenue exposure within Hopper Cloud.
    whyItMatters: >-
      B2B diversification is a core part of the thesis, but the thesis weakens materially if one or two partners
      dominate the economics.
    diligencePath: >-
      Request partner concentration by revenue and gross profit, including the top five counterparties and upcoming
      renewals.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: reliability-controls
    missingEvidence: Public uptime history, SLA terms, incident metrics, and postmortem evidence for HTS and partner APIs.
    whyItMatters: >-
      Hopper increasingly sells into bank, airline, and other partner workflows where availability and support
      discipline affect conversion, chargebacks, and contractual exposure.
    diligencePath: Request SLA packs, historical uptime and incident reports, escalation paths, and partner implementation reviews.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: security-compliance
    missingEvidence: Independent proof of security certifications, privacy controls, trust-center materials, or audit scope for HTS.
    whyItMatters: >-
      Enterprise travel-fintech distribution requires more than product breadth; without control evidence,
      implementation and procurement risk stay underwritten by management claims alone.
    diligencePath: >-
      Request SOC 2 or ISO scope, privacy/data-flow diagrams, trust-center artifacts, and completed customer security
      questionnaires.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: minor
    topic: developer-documentation
    missingEvidence: >-
      First-party API references, changelog discipline, versioning policy, and release notes that validate the public
      integration surface.
    whyItMatters: >-
      APIs.io shows evidence of a developer surface, but diligence still needs primary technical documentation to judge
      implementation friction and product maintenance quality.
    diligencePath: Request the current API reference, SDK repositories, version lifecycle policy, and partner-facing changelog.
    relatedQuestionRefs:
      - QE003
      - QE008
  - type: missing-source
    severity: material
    topic: retention-and-renewal
    missingEvidence: NRR, GRR, churn, repeat-booker cohorts, renewal rates, and contract length by channel.
    whyItMatters: >-
      Adoption proxies show reach and transaction volume, but they do not show whether customers stay, expand, or renew
      profitably.
    diligencePath: Request cohort retention data for the consumer app and renewal or expansion data for top HTS accounts.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU002
  - type: private-evidence-only
    severity: material
    topic: partner-concentration
    missingEvidence: Top-partner revenue share, Capital One exposure, and mix between consumer-app revenue and HTS revenue.
    whyItMatters: >-
      Public evidence identifies marquee partners, but it does not show whether a small number of enterprise accounts
      dominate economics.
    diligencePath: Obtain partner concentration schedules and contract summaries for the top HTS relationships.
    relatedTableRefs:
      - TU001
      - TU003
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-depth
    missingEvidence: Production status, booking volume, seat volume, or go-live dates for each named partner logo.
    whyItMatters: >-
      Public partner mentions are stronger on existence than on rollout depth, which limits conviction on expansion
      durability.
    diligencePath: Ask management for deployment-by-deployment status and reference calls for named HTS customers.
    relatedTableRefs:
      - TU003
  - type: stale
    severity: material
    topic: financial-visibility
    missingEvidence: Current audited 2024-2026 revenue mix, gross margin, EBITDA bridge, cash balance, and working-capital disclosures.
    whyItMatters: >-
      Without current audited statements, investors cannot size burn risk, partner concentration, or reserve capacity
      behind Hopper's fintech products.
    diligencePath: >-
      Request audited financial statements, partner revenue concentration, and monthly cash / margin bridge packs for
      the last 12-18 months.
    relatedQuestionRefs:
      - QR006
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: partner-concentration
    missingEvidence: >-
      Post-transition Capital One contract economics, API volume retention, and the revenue share of Hopper's next three
      largest B2B partners.
    whyItMatters: >-
      Capital One's move in-house is the most visible concentration event in the pool, but the financial impact cannot
      be sized from public sources alone.
    diligencePath: >-
      Obtain partner cohort revenue, contract terms, renewal dates, and migration plans for Capital One and the next
      largest API customers.
    relatedQuestionRefs:
      - QR003
      - QR004
    relatedTableRefs:
      - TR003
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-compliance
    missingEvidence: >-
      Full consent-order text, court-approval status, and post-settlement complaint / refund metrics for Hopper's add-on
      products.
    whyItMatters: >-
      The public risk register can rank the FTC matter, but it cannot yet confirm whether remediation is proving
      effective in live operations.
    diligencePath: >-
      Pull the court docket, current product terms, complaint-rate trendlines, and internal compliance attestations for
      fee-disclosure controls.
    relatedQuestionRefs:
      - QR001
      - QR002
      - QR007
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: current-financial-disclosure
    missingEvidence: >-
      Audited 2024-2026 net revenue, gross margin, EBITDA or operating loss, cash balance, and GMV-to-net-revenue
      bridge.
    whyItMatters: >-
      Without current audited economics, investors cannot translate Hopper's scale and attach metrics into a defendable
      valuation range or expected return.
    diligencePath: >-
      Request audited financial statements or a financing data room package with revenue-quality and margin bridge
      schedules.
    relatedQuestionRefs:
      - QV002
      - QV008
    relatedTableRefs:
      - TV001
      - TV003
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: >-
      Current cap table, liquidation preferences, debt or project-finance obligations, and any 2023-2026 primary or
      secondary valuation marks.
    whyItMatters: >-
      Entry discipline and downside math depend on preference overhang and whether the 2022 $5B marker still clears in
      live financing conditions.
    diligencePath: >-
      Obtain the latest financing documents, board-approved cap-table summary, and any recent secondary or internal mark
      materials.
    relatedQuestionRefs:
      - QV001
      - QV008
    relatedTableRefs:
      - TV001
      - TV003
  - type: conflicting-data
    severity: minor
    topic: third-party-tracker-quality
    missingEvidence: A reconciled funding and valuation history from reliable primary or independently sourced records.
    whyItMatters: >-
      Third-party trackers and profile pages can be stale or malformed, which creates false precision in valuation
      discussions.
    diligencePath: >-
      Reconcile public tracker data against company financing documents, regulator filings if any, and reputable
      financing coverage before using it in price setting.
    relatedQuestionRefs:
      - QV001
      - QV005
