schemaVersion: report-v2
artifact: customers
slug: hopper
runDate: 2026-10-17
company:
  name: Hopper
chapter:
  number: 6
  title: Customers
  summary: >-
    Hopper shows real customer reach in both its consumer app and HTS partner channel, with
    independent summaries pointing to 120M+ cumulative downloads, ~35M active users in 2023, and
    Capital One Travel as the flagship named partner deployment. The weakness is durability proof:
    the assigned evidence shows adoption and partner logos, but it does not publish NRR, churn,
    renewal, contract-length, or top-customer concentration metrics.
sections:
  - id: customer-surface
    title: Consumer app scale still anchors the customer base
    body: >-
      The clearest customer segmentation signal is that Hopper serves two distinct surfaces:
      individual travelers in the mobile app and enterprise partners through HTS. The consumer app
      remains the visible scale engine, with independent summaries placing cumulative downloads above
      120 million and active users at roughly 35 million in 2023. That is meaningful reach, but the
      evidence mixes cumulative installs, annual active users, and gross bookings, so the chapter
      should treat these as adoption proxies rather than direct retention proof. The company’s own
      mission language and product framing also show that Hopper is intentionally built around
      consumer savings and paid flexibility, which helps explain why add-ons matter to both user
      conversion and partner expansion.
    claimRefs: [CU001, CU002, CU003, CU009, CU012, CU014]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-trajectory
    title: Adoption is visible, but the metrics are not directly comparable
    body: >-
      Public adoption evidence is strongest on scale and transaction throughput. Independent
      summaries place 2023 gross bookings around $5.9 billion and describe Hopper’s fintech
      products as central to monetization, with 2022 add-on usage already above 60% of users in one
      summary and Hopper’s 2021 Series G release saying fintech represented a majority of revenue at
      that time. These are useful signals that the company has moved beyond logo collection into
      repeated transactional behavior. They still do not answer the harder durability questions,
      because downloads, bookings, and add-on attachment do not reveal churn, cohort retention, or
      partner renewals.
    claimRefs: [CU002, CU003, CU004, CU005, CU013, CU014]
    tableRefs: [TU002]
  - id: named-proof
    title: Named partner proof is real, but deployment depth is unevenly disclosed
    body: >-
      Hopper does have named adoption proof beyond generic customer counts. Capital One Travel is
      the most consistently corroborated HTS deployment in the assigned sources and is the best
      available example of a scaled partner use case. Hotelagio also cites AirAsia MOVE and
      Cloudbeds as newer HTS examples, while ElectroIQ lists partners such as Kayak, Marriott,
      Trip.com, and Amadeus. The analytical limitation is that most public mentions stop at launch
      or partner-list level. They rarely disclose booking volume, contract economics, renewal
      behavior, or whether each logo represents a broad production rollout versus a narrower feature
      integration.
    claimRefs: [CU006, CU007, CU008]
    tableRefs: [TU003]
  - id: durability-risk
    title: Durability and concentration risk remain more qualitative than quantified
    body: >-
      The assigned evidence suggests Hopper’s customer proposition is differentiated, but it also
      exposes the main risks. ShopBack’s 2026 review says Hopper is the merchant of record and notes
      that some users report refund friction when paid add-on coverage does not match their
      expectations; it also highlights that chain-hotel loyalty economics are weaker on OTA-style
      bookings. Hopper’s 2021 financing release shows the company invested heavily in support and
      automation after a surge in service demand, which is helpful but dated. Taken together, the
      chapter can underwrite real adoption and an evident land-and-expand motion, but not
      customer-quality durability in the way a growth investor would want without private retention
      and concentration data.
    claimRefs: [CU005, CU010, CU011, CU013]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale signal
      - Revenue or strategic value / gap
    rows:
      - - Consumer travel app
        - Individual traveler / traveler / traveler
        - Flight, hotel, rental-car booking with price prediction and paid flexibility
        - 120M+ cumulative downloads; ~35M active users in 2023
        - Main volume engine; public evidence does not disclose repeat-booker cohorts or churn
      - - Bank-card travel portal
        - Issuer partner / cardholder traveler / issuer partner
        - White-label travel portal with predictive pricing, Price Freeze, and rebooking protections
        - Capital One Travel is the flagship named HTS deployment since 2021
        - Strong marquee proof, but no disclosed revenue share or contract concentration
      - - Supplier and OTA partners
        - Airline, OTA, or travel-agency partner / partner end user / enterprise partner
        - Embed fintech ancillaries or agency content through Hopper Cloud or HTS
        - Partner channels cited across airlines, OTAs, and travel agencies
        - Expands distribution beyond the app; public deployment depth remains uneven
      - - Hospitality and travel-distribution ecosystem
        - Hospitality software or travel brand / hotel guest or traveler / partner enterprise
        - Flex products and travel-booking infrastructure for lodging or travel brands
        - Cloudbeds plus partner mentions including Marriott, Kayak, Trip.com, and Amadeus
        - Shows breadth, but many logos are mention-level rather than economics-level proof
    notes: >-
      Mixes cumulative downloads, annual actives, and named partner disclosures; null-like gaps are
      carried in the final column rather than converted into hard numbers.
    claimRefs: [CU001, CU006, CU007, CU008, CU009, CU014]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Cumulative downloads
        - 120M+
        - 2025-2026 summaries
        - Hotelagio; ElectroIQ
        - Medium
        - Large top-of-funnel consumer reach
        - Cumulative installs do not show actives or repeat users
      - - Annual active users
        - ~35M
        - "2023"
        - Hotelagio
        - Medium
        - Better usage proxy than downloads alone
        - Single secondary-source estimate
      - - Gross bookings
        - ~$5.9B
        - "2023"
        - Hotelagio; ElectroIQ
        - Medium
        - Significant transactional throughput
        - Gross bookings are not retention or revenue quality
      - - Fintech add-on usage
        - ">60% of users used at least one add-on"
        - "2022"
        - Hotelagio
        - Medium
        - Add-ons appear central to monetization and repeat-use design
        - Company-survey-derived statistic, not audited cohort data
      - - Customer-support self-serve resolution
        - 60% of requests resolved instantly
        - "2021"
        - Hopper Series G release
        - Medium
        - Suggests post-booking operations were scaled during recovery
        - Crisis-period service metric, not a current service-level disclosure
    notes: >-
      The table intentionally separates reach, activity, bookings, add-on attachment, and support
      operations because these metrics are not directly comparable denominators.
    claimRefs: [CU002, CU003, CU004, CU005, CU013, CU014]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer or partner
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome or strategic signal
      - Limitation
    rows:
      - - Capital One Travel
        - Bank-card issuer portal
        - Predictive pricing, Price Freeze, and rebooking protections through HTS
        - Production-like longstanding deployment
        - Best corroborated named partner proof in the assigned pool
        - Public sources do not disclose revenue share, renewal terms, or exclusivity
      - - AirAsia MOVE
        - Airline or travel-superapp channel
        - HTS fintech ancillaries for travel bookings
        - Publicly disclosed rollout
        - Shows Hopper can export add-ons outside North America
        - No public booking volume, go-live scale, or economics disclosed
      - - Cloudbeds
        - Hospitality software channel
        - CFAR-style flexibility product for lodging merchants
        - Publicly disclosed rollout
        - Indicates lodging-channel expansion beyond the Hopper app
        - No public hotel count, attach rate, or renewal data disclosed
      - - Kayak, Marriott, Trip.com, and Amadeus mentions
        - Travel distribution ecosystem
        - Partner-list references in secondary coverage
        - Partnership mention only
        - Suggests broader ecosystem awareness beyond one flagship portal
        - Public evidence does not separate current production use from historical or narrower tie-ups
    notes: >-
      Enumeration is partial and limited to named deployments or partner mentions surfaced in the
      assigned pool; public evidence is much stronger on existence than on contract economics or
      rollout depth.
    enumerationScope:
      coverage: partial
      basis: Publicly named customer or partner examples surfaced in the assigned pool for 2021-2026 customer evidence.
    claimRefs: [CU006, CU007, CU008]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Hopper’s journey combines app acquisition, paid flexibility, post-booking service, repeat-use prompts, and partner distribution loops.
    data:
      items:
        - label: Discover price opportunity
          actor: Consumer traveler
          channel: Mobile app
          touchpoints:
            - Price prediction and wait or buy prompts
            - App-led acquisition around savings
        - label: Book with flexibility
          actor: Consumer traveler
          channel: Mobile app checkout
          touchpoints:
            - Price Freeze and flexible cancellation sold at checkout
            - Fintech products are core monetization levers
        - label: Handle itinerary changes
          actor: Hopper support
          channel: In-app service flow
          touchpoints:
            - Hopper is merchant of record on app bookings
            - Self-serve support automation handled 60 percent of requests instantly in 2021
        - label: Encourage repeat use
          actor: Repeat traveler
          channel: App and rewards loop
          touchpoints:
            - Carrot Cash and savings framing support reuse
            - Long-term customer delight is explicit company messaging
        - label: Expand through HTS
          actor: Enterprise partner
          channel: White-label or embedded partner channel
          touchpoints:
            - Capital One Travel is the flagship named deployment
            - AirAsia MOVE and Cloudbeds show newer rollout paths
        - label: Expose diligence risk
          actor: Investor
          channel: Diligence follow-up
          touchpoints:
            - Public sources show adoption proof but not NRR or churn
            - Partner concentration is still qualitative rather than quantified
    claimRefs: [CU001, CU005, CU010, CU012, CU013]
callouts:
  - calloutType: strength
    title: Real adoption is visible on both sides of the platform
    body: >-
      Hopper is not relying on logo slides alone: the assigned sources show meaningful consumer
      scale, significant booking volume, and at least one well-corroborated enterprise deployment in
      Capital One Travel.
    claimRefs: [CU001, CU002, CU004, CU006]
  - calloutType: risk
    title: Durability evidence is still weaker than adoption evidence
    body: >-
      The public record in this pool does not publish NRR, churn, renewal, or top-customer exposure,
      while the main adverse evidence centers on service friction and OTA-style loyalty trade-offs.
    claimRefs: [CU010, CU011, CU013]
