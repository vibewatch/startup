            - "HTS Cars"
            - "HTS Packages"
            - "Loyalty portals"
          outputs:
            - "White-label booking experiences"
        - label: "Integration layer"
          detail: "Publicly cataloged OAuth2 REST APIs and SDKs are the clearest integration evidence in the assigned pool."
          modules:
            - "HTS Airline API v1.1"
            - "OpenAPI-generated SDKs"
            - "JavaScript hotel price-freeze integration"
          outputs:
            - "Embedded checkout components"
            - "Partner developer enablement"
        - label: "Partner experiences"
          detail: "Banks, airlines, and travel distributors appear to consume Hopper capabilities inside their own customer journeys."
          modules:
            - "RBC Avion Rewards Travel"
            - "Airline booking flows"
            - "Partner direct channels"
          outputs:
            - "Owned loyalty and travel surfaces"
        - label: "Trust and operating controls"
          detail: "Control layer is strategically critical but weakly documented in the public pool relative to commercial packaging."
          modules:
            - "Customer support"
            - "Fee disclosure controls"
            - "Security and privacy processes"
          outputs:
            - "Regulatory exposure if controls fail"
    claimRefs: ["CE002", "CE003", "CE004", "CE005", "CE009", "CE010"]
