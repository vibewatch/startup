      - ["Monetize hotel price volatility in partner experiences", "Partner wants lodging conversion or loyalty retention without building proprietary forecasting tools", "JavaScript hotel price-freeze integration and HTS lodging modules", "Public SDK surface suggests repeatable reuse of the core fintech logic", "Assigned pool lacks named customer proof and renewal data for this module"]
    notes: "Benefits are restricted to what the assigned sources state or strongly imply; missing operational metrics remain explicit limitations rather than inferred performance proof."
    claimRefs: ["CE001", "CE003", "CE005", "CE011", "CE012"]
  - id: "TE003"
    title: "Technology / operating architecture table"
    columns:
      - "Layer / process"
      - "Role"
      - "Dependency"
      - "Risk"
    rows:
      - ["Demand and pricing intelligence", "Transforms fare volatility and traveler intent into predictions and booking guidance", "Proprietary data science and experimentation loop", "Public pool does not expose forecast accuracy, retraining cadence, or failure cases"]
      - ["Ancillary decisioning and protection products", "Packages uncertainty-management products such as Price Freeze and CFAR", "Policy logic, partner checkout placement, and customer disclosure controls", "FTC scrutiny shows product disclosures and consent flows can fail materially"]
      - ["Partner API / SDK layer", "Exposes reusable integration points for airlines, banks, and other distributors", "OAuth2-secured API surface plus maintained SDKs", "No public first-party API docs, release discipline, or SLA evidence in assigned pool"]
      - ["Operational trust and enterprise controls", "Keeps partner experiences reliable and compliant after launch", "Status, support, security, privacy, and audit processes", "Assigned pool lacks public proof of uptime history, certifications, and control testing"]
    notes: "Architecture table mixes evidenced modules with explicit control gaps; null-proof areas are converted into diligence asks instead of assumed maturity."
    claimRefs: ["CE003", "CE007", "CE008", "CE009", "CE010"]
