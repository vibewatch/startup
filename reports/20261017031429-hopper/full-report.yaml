  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence indicates Hopper converts mobile and partner demand into booking margin, fintech fees, and B2B
      participation, with support and risk discipline determining whether that becomes durable margin dollars.
    data:
      nodes:
        - label: Demand acquisition
          detail: Mobile app demand, repeat alerts, and partner storefront traffic feed bookings.
          tone: positive
        - label: Core booking conversion
          detail: Flights, hotels, and cars generate commissions, markups, or affiliate economics.
          tone: positive
        - label: Fintech attachment
          detail: Price Freeze, cancellation, and disruption products add paid flexibility around each booking.
          tone: warning
        - label: Hopper Cloud reuse
          detail: The same pricing and protection stack is distributed through partners and white-label portals.
          tone: warning
        - label: Service and risk costs
          detail: Support, claims handling, rev share, compliance, and underwriting absorb a large share of delivery cost.
          tone: warning
        - label: Margin dollars
          detail: Economic quality depends on attach, loss ratios, partner mix, and whether remediation lowers monetization.
          tone: warning
      edges:
        - from: Demand acquisition
          to: Core booking conversion
          label: Traffic converts into booked travel
        - from: Core booking conversion
          to: Fintech attachment
          label: Base transaction creates attach surface
        - from: Fintech attachment
          to: Hopper Cloud reuse
          label: Products can also be distributed through partners
        - from: Hopper Cloud reuse
          to: Service and risk costs
          label: Growth adds support, rev-share, and underwriting obligations
        - from: Service and risk costs
          to: Margin dollars
          label: Net economics hinge on risk discipline and efficiency
    approximationNotes: >-
      This figure is a qualitative bridge, not a quantified waterfall. Retained sources describe the revenue path and
      cost drivers, but they do not disclose audited segment values.
    claimRefs:
      - CI001
      - CI002
      - CI006
      - CI008
      - CI012
      - CI014
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Assigned sources point to a layered model: consumer demand capture and fintech logic feed partner-facing APIs,
      white-label commerce modules, and embedded bank/airline experiences, while public control evidence remains thin.
    data:
      layers:
        - label: Traveler demand capture
          detail: >-
            Consumer app surfaces flights, hotels, rental cars, and homes while generating search, booking, and
            price-watch intent.
          modules:
            - Flights
            - Hotels
            - Rental cars
            - Homes
          outputs:
            - Search and booking demand
        - label: Pricing and protection logic
          detail: Price prediction and flexibility products turn volatility into a differentiated booking and ancillary layer.
          modules:
            - Price prediction
            - Price Freeze
            - Cancel For Any Reason
            - Disruption Guarantee
          outputs:
            - Booking-timing guidance
            - Ancillary monetization
        - label: Enterprise commerce modules
          detail: HTS packages travel inventory and related modules into reusable partner products.
          modules:
            - HTS Stays
            - HTS Cars
            - HTS Packages
            - Loyalty portals
          outputs:
            - White-label booking experiences
        - label: Integration layer
          detail: Publicly cataloged OAuth2 REST APIs and SDKs are the clearest integration evidence in the assigned pool.
          modules:
            - HTS Airline API v1.1
            - OpenAPI-generated SDKs
            - JavaScript hotel price-freeze integration
          outputs:
            - Embedded checkout components
            - Partner developer enablement
        - label: Partner experiences
          detail: >-
            Banks, airlines, and travel distributors appear to consume Hopper capabilities inside their own customer
            journeys.
          modules:
            - RBC Avion Rewards Travel
            - Airline booking flows
            - Partner direct channels
          outputs:
            - Owned loyalty and travel surfaces
        - label: Trust and operating controls
          detail: >-
            Control layer is strategically critical but weakly documented in the public pool relative to commercial
            packaging.
          modules:
            - Customer support
            - Fee disclosure controls
            - Security and privacy processes
          outputs:
            - Regulatory exposure if controls fail
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE005
      - CE009
      - CE010
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Hopper’s journey combines app acquisition, paid flexibility, post-booking service, repeat-use prompts, and partner
      distribution loops.
    data:
      items:
        - label: Discover price opportunity
          actor: Consumer traveler
          channel: Mobile app
          touchpoints:
            - Price prediction and wait or buy prompts
            - App-led acquisition around savings
        - label: Book with flexibility
          actor: Consumer traveler
          channel: Mobile app checkout
          touchpoints:
            - Price Freeze and flexible cancellation sold at checkout
            - Fintech products are core monetization levers
        - label: Handle itinerary changes
          actor: Hopper support
          channel: In-app service flow
          touchpoints:
            - Hopper is merchant of record on app bookings
            - Self-serve support automation handled 60 percent of requests instantly in 2021
        - label: Encourage repeat use
          actor: Repeat traveler
          channel: App and rewards loop
          touchpoints:
            - Carrot Cash and savings framing support reuse
            - Long-term customer delight is explicit company messaging
        - label: Expand through HTS
          actor: Enterprise partner
          channel: White-label or embedded partner channel
          touchpoints:
            - Capital One Travel is the flagship named deployment
            - AirAsia MOVE and Cloudbeds show newer rollout paths
        - label: Expose diligence risk
          actor: Investor
          channel: Diligence follow-up
          touchpoints:
            - Public sources show adoption proof but not NRR or churn
            - Partner concentration is still qualitative rather than quantified
    claimRefs:
      - CU001
      - CU005
      - CU010
      - CU012
      - CU013
