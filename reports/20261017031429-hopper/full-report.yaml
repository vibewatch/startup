        title: Control maturity remains the weakest public part of the story
        blocks:
          - type: paragraph
            body: >
              The clearest public control evidence in this pool is adverse, not reassuring. The FTC's 2026 case summary
              and legal commentary describe a $35 million settlement tied to hidden fees and misrepresentations around
              VIP Support and Price Freeze, which means Hopper's consumer-facing monetization and disclosure controls
