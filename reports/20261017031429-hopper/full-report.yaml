      - number: '3.4'
        title: Moat durability is execution-led, not structurally closed
        blocks:
          - type: paragraph
            body: >-
              The retained evidence supports a qualified moat rather than a locked market position. Hopper's own mission
              and culture pages argue that speed, experimentation, and customer obsession are the advantages that make
              its products hard to copy, and the 2026 product update suggests management is still executing on that
              playbook. But the same evidence base also shows why the moat can erode. The FTC settlement creates trust
              and regulatory baggage around fees and flexibility products, Fintech Byte explicitly flags regulatory and
              competitive risk, and Hospitality.today's insourcing signal implies partners may keep more economics and
              customer relationship control for themselves. The result is a company that can win on packaging and
              distribution today, but that must keep proving product lift faster than incumbents, direct channels, and
              partner-owned alternatives can catch up.
