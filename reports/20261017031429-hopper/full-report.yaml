      - number: '1.3'
        title: Capital, scale, and disclosure quality
        blocks:
          - type: paragraph
            body: >-
              Hopper's public growth story is strongest in historic fundraising and product-scaling disclosures, but
              current underwriting remains constrained by uneven transparency. The 2021 materials describe a company
              with fintech products already generating the majority of revenue and nearly $600 million of cumulative
              capital raised by the Series G; later third-party summaries still point to a $5 billion valuation marker
              and $500 million of reported 2023 revenue. At the same time, the same public-data vendor that preserves
              the valuation marker also compresses total funding to a single $175 million round, which is a direct
              signal that cap-table reconstruction from public profiles is unreliable here. For diligence purposes,
              scale is real, but present-day economics, partner concentration, and exact capitalization still need
              primary evidence rather than summary-site extrapolation.
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO012
              - CO013
              - CO014
              - CO015
              - CO016
      - number: '1.4'
        title: Milestone trajectory and partner-concentration risk
        blocks:
          - type: paragraph
            body: >-
              Hopper's milestone path shows a company that kept broadening product scope and financing options, then
              leaned harder into platform economics. The pitch-deck breakdown describes expansion from flight prediction
              into cars, fintech attach products, and enterprise APIs by 2021; the later award and scale markers show
              the brand and marketplace still had momentum after the pandemic rebound. The most important recent
              directional signal in the assigned pool, though, is not another consumer-product launch but Capital One's
              move to internalize more of the Hopper stack. If that interpretation is directionally right, it reinforces
              that Hopper's B2B strategy can create value but can also leave the company exposed when a major partner
              decides to absorb key software, talent, or economics in-house.
