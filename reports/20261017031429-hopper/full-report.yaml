      - number: '3.3'
        title: Pricing and switching power remain opaque
        blocks:
          - type: paragraph
            body: >-
              The competitive story is harder to underwrite on pricing than on features. Public retained sources
              describe Hopper's product scope and contract form, but they do not publish standardized list pricing for
              HTS contracts or for the fintech add-ons that matter to revenue quality. That matters because switching
              costs are a function of more than product breadth: partners weigh implementation effort, control over the
              loyalty or booking experience, supplier access, and whether they can multi-home or internalize parts of
              the stack over time. Hospitality.today explicitly notes that partners are beginning to bring parts of
              these platforms in-house. Combined with Hopper's own view that travel inventory is widely available
              elsewhere, the implication is that channel control and partner workflow embedment matter more than raw
              inventory access.
