      - number: '4.3'
        title: Capital needs are still opaque because funding uses are public but balance-sheet facts are not
        blocks:
          - type: paragraph
            body: >-
              The available financing announcement describes Hopper funding growth initiatives rather than giving
              investors a current balance-sheet snapshot. The Series G announcement said the proceeds would accelerate
              customer support, hiring, acqui-hires, new categories, and international expansion, which is consistent
              with a company spending behind service capacity and product breadth at that historical point. Public
              traction datapoints remain stale: one aggregator cites $500 million of annual revenue in November 2023 as
              the latest public figure it could identify, while the company's financing update highlighted rapid growth
              from a much earlier point in the recovery. What is missing is more important than what is present: no
              retained source discloses cash on hand, current burn, gross margin, EBITDA, segment revenue mix, or
              partner concentration. Without those numbers, the next-round trigger and runway cannot be underwritten
              confidently.
            claimRefs:
              - CI004
              - CI005
              - CI009
              - CI015
      - number: '4.4'
        title: The FTC settlement weakens revenue-quality confidence and raises diligence urgency
        blocks:
          - type: paragraph
            body: >-
              Hopper's most differentiated monetization layer is also the one facing the clearest adverse evidence in
              this refresh. The FTC case and legal commentary agree that Hopper accepted a $35 million settlement tied
              to hidden or pre-selected fees and misrepresentations around VIP Support and Price Freeze. Even if
              management characterizes the practices as outdated, the settlement still matters financially: it creates a
              cash obligation, increases disclosure and product-governance scrutiny, and may reduce conversion on
              protection products if clearer opt-ins or narrower marketing claims lower attach. That does not prove the
              revenue model is broken, but it does lower confidence in revenue quality until diligence can test current
              attachment rates, complaint rates, refund behavior, and the post-remediation economics of fintech
              products. Financially, Hopper looks innovative and potentially margin-accretive, but still too opaque for
              clean underwriting.
            claimRefs:
              - CI002
              - CI003
              - CI010
              - CI011
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Financial verdict
            body: >-
              Hopper appears to have built a differentiated ancillary-and-partner revenue engine, but the absence of
              current balance-sheet disclosure and the FTC-driven pressure on fee-based products keep this chapter at a
              diligence-blocker, not underwriting-ready, state.
            calloutType: recommendation
            claimRefs:
              - CI002
              - CI003
              - CI009
              - CI010
              - CI011
  - number: 5
    title: Product & Technology
    sections:
