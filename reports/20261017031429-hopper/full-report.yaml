  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Consumer app scale still anchors the customer base
        blocks:
          - type: paragraph
            body: >-
              The clearest customer segmentation signal is that Hopper serves two distinct surfaces: individual
              travelers in the mobile app and enterprise partners through HTS. The consumer app remains the visible
              scale engine, with independent summaries placing cumulative downloads above 120 million and active users
              at roughly 35 million in 2023. That is meaningful reach, but the evidence mixes cumulative installs,
              annual active users, and gross bookings, so the chapter should treat these as adoption proxies rather than
              direct retention proof. The company’s own mission language and product framing also show that Hopper is
              intentionally built around consumer savings and paid flexibility, which helps explain why add-ons matter
              to both user conversion and partner expansion.
