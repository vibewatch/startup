      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is clearer than the market-size map. The official Hopper Cloud materials say the company
              sells into travel providers and brands that want embedded fintech modules or a full white-label portal,
              while Hospitality.today's RBC coverage shows financial institutions using Hopper to turn loyalty programs
              into travel distribution channels. In those deals, the end user is the traveler, but the buyer and payer
              sit with the partner organization that owns the loyalty program, portal economics, and supplier
              relationships. Hopper's own consumer app still matters because it remains a testing and distribution
              surface, yet the monetization buyer has shifted toward enterprise channel owners rather than only the
              traveler making a one-off booking.
            claimRefs:
              - CM002
              - CM006
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
