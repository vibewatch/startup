          - type: callout
            title: The moat weakens if partners internalize the stack
            body: >-
              Hopper's own materials concede that travel inventory is widely available elsewhere, and Hospitality.today
              plus the FTC settlement show that partner insourcing and trust friction can narrow the edge from fintech
              packaging.
