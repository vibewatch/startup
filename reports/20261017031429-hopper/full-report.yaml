  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive set: startups matter less than scaled alternatives'
        blocks:
          - type: paragraph
            body: >-
              The retained evidence makes clear that Hopper's competitive set is broader than other travel apps.
              Tracxn's startup lens names Catch Frog AI and Aget24 as Hopper's top early-stage peers, while AskCyborg's
              broader OTA lens points to Expedia, Kayak, Skyscanner, and Booking.com as the more established comparison
              set. Hopper's own culture guide is more revealing about substitutes: it says the flights and hotels sold
              on Hopper can be booked in thousands of other places, including directly from suppliers. That pushes the
              real battlefield beyond app discovery into direct airline and hotel channels, partner-owned loyalty
              ecosystems, and internal build options. Even a lower-confidence Accio synthesis still ranks Hopper behind
              larger consumer platforms, which is directionally consistent with incumbents being the scale benchmark
              rather than the narrow startup peer set.
