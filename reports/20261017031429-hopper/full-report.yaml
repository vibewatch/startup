        title: Differentiation comes from product layering and embedded distribution
        blocks:
          - type: paragraph
            body: >-
              Hopper's defensible surface is not exclusive travel inventory; it is the way the company layers AI price
              prediction, flexibility fintech, and white-label distribution around commodity supply. Hospitality.today
              and Hopper's own 2021 financing release both show that the company sells more than a booking app: HTS and
