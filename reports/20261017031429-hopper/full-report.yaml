      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              The public record in the assigned pool shows a concentrated leadership picture rather than a fully
              transparent governance one. Lalonde remains the recurring center of gravity across company and third-party
              narratives, while AskCyborg identifies CTO Joost Ouwerkerk as the key technical counterweight. The
              clearest board-level change in the retained evidence is the addition of GPI Capital managing partner Khai
              Ha alongside the 2021 Series G, which suggests investor oversight at the growth-equity stage but does not
              reveal committee structure, control rights, or the full current roster. That leaves real key-person
              dependency: Hopper's product, financing story, and B2B platform narrative are all still tied to a small
              number of named executives and investors in the public materials.
