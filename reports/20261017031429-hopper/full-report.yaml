    summary: >-
      Layered lens showing how broad travel-fintech rhetoric narrows into realized Hopper scale, buyer concentration,
      and underwriting constraints.
    data:
      items:
        - label: Broad sector upside lens
          value: $200B annual consumer spend uplift
          note: Hopper's 2021 company-authored scenario for sector-wide fintech adoption
          tone: opportunity
        - label: Realized 2024 booking throughput
          value: $7.5B bookings
          note: External realized-scale lens rather than a TAM estimate
          tone: positive
        - label: Realized 2024 revenue
          value: $850M revenue
          note: Shows monetized scale already reached through Hopper's channels
          tone: positive
        - label: Enterprise channel concentration
          value: '>90% of revenue from enterprise partnerships'
          note: Reported by Hospitality.today for 2026
          tone: warning
        - label: Consumer reach remains meaningful
          value: 120+M lifetime downloads
          note: Shows the app still matters as a distribution and test surface
          tone: neutral
        - label: Partner insourcing constraint
          value: 150 Capital One travel employees transitioned
          note: Indicates sophisticated partners may internalize the front end while keeping modules
          tone: risk
    approximationNotes: >-
      Layer order reflects narrowing underwriting usefulness rather than arithmetic subtraction. Values use mixed units
      already disclosed in the tables and should be read as evidence lenses, not as additive market layers.
    claimRefs:
      - CM004
      - CM006
      - CM007
      - CM008
      - CM009
      - CM012
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal scores place Hopper furthest toward modular product depth, while direct channels and partner-owned builds
      rank highest on channel control.
    data:
      xAxis:
        label: Product differentiation depth
        min: 1
        max: 5
        low: Commodity inventory only
        high: Layered fintech + AI + white-label tooling
        description: Ordinal synthesis from retained evidence; higher values mean broader evidence-backed product differentiation.
        scale: ordinal
      yAxis:
        label: Channel control / distribution power
        min: 1
        max: 5
        low: Dependent on third-party channel
        high: Owns partner or supplier channel
        description: Ordinal synthesis from retained evidence; higher values mean stronger ownership of demand or workflow.
        scale: ordinal
      points:
        - label: Hopper
          x: 5
          'y': 4
          detail: >-
            Bundles price prediction, flexibility fintech, and HTS distribution, but still relies on partner and
            supplier relationships.
          claimRefs:
            - CP002
            - CP006
            - CP007
        - label: Startup peer set
          x: 2
          'y': 1
          detail: Tracxn's named startup peers are narrower and unfunded in the retained snapshot.
          claimRefs:
            - CP003
            - CP014
        - label: Generalist OTAs / metasearch
          x: 2
          'y': 4
          detail: Incumbents set the scale benchmark, but this retained pool does not show Hopper-like fintech bundling.
          claimRefs:
            - CP004
            - CP014
            - CP016
        - label: Legacy white-label OTA
          x: 3
          'y': 3
          detail: >-
            Hospitality.today shows this category can be displaced, but the retained evidence does not fully reveal its
