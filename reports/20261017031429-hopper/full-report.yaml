  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Scale and monetization evidence push Hopper onto the watchlist, but disclosure gaps and regulatory overhang keep
      the call at track.
    data:
      nodes:
        - id: scale
          label: Scale proof
          detail: 60M+ downloads, $500M reported 2023 revenue, and $1.5B deck sales metric show real market presence.
        - id: monetization
          label: Monetization engine
          detail: >-
            Fintech products are described as a majority or roughly two-thirds of revenue and as increasing spend per
            user.
        - id: distribution
          label: Distribution optionality
          detail: Hopper Cloud extends the thesis into partner APIs and white-label travel distribution.
        - id: disclosure
          label: Disclosure gap
          detail: >-
            Public evidence still lacks audited current margins, cash, GMV-to-net-revenue bridges, and preference-stack
            detail.
        - id: regulatory
          label: Regulatory overhang
          detail: The FTC settlement adds a fresh consumer-protection discount to valuation confidence.
        - id: decision
          label: Recommendation
          detail: Track with medium confidence, high risk, and a stretched valuation stance until price support improves.
      edges:
        - from: scale
          to: monetization
          label: supports interest
        - from: monetization
          to: distribution
          label: widens upside
        - from: distribution
          to: disclosure
          label: but needs proof
        - from: disclosure
          to: regulatory
          label: raises discount rate
        - from: regulatory
          to: decision
          label: limits entry call
    approximationNotes: Flow summarizes evidence relationships rather than a quantified valuation model.
    claimRefs:
      - CV003
      - CV004
      - CV007
      - CV010
      - CV015
      - CV016
