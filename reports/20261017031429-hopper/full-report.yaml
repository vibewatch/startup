  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              The strongest boundary evidence in this pool points to Hopper operating across two linked markets rather
              than a single OTA category. Company-issued pages describe Hopper as a global travel platform whose B2B
              division powers partner direct channels, while the 2021 growth-investment release framed Hopper Cloud as
              infrastructure that can distribute fintech products, agency content, and white-label portals to airlines,
              OTAs, metasearch companies, and travel agencies. Independent 2026 reporting sharpens the boundary further:
              the product is now sold into bank-led loyalty ecosystems where the partner owns the customer relationship,
              and the status-quo substitute is either an incumbent white-label travel provider or internal build on top
              of direct supplier relationships.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
          - type: table
            tableRef: TM001
