  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model is diversified, but public mix disclosure is directional rather than audited
        blocks:
          - type: paragraph
            body: >-
              The retained sources support a consistent description of Hopper's monetization stack. Independent profiles
              and the company's own financing announcement all describe a blend of travel-booking commissions, ancillary
              fintech fees, and B2B Hopper Cloud distribution. That matters because it separates Hopper from a pure OTA
              take-rate story: public evidence points to a model that tries to earn margin from volatility-management
              products and partner distribution, not just from base booking conversion. The strongest official signal is
              historical but important: Hopper said in a growth financing announcement that fintech offerings had become
              a majority of revenue, while an independent current profile says Price Freeze and Rebooking Guarantee
              account for 70% of air revenues. Those figures are not equivalent and should not be merged into one
              metric, but together they imply that ancillary attach is economically central.
            claimRefs:
