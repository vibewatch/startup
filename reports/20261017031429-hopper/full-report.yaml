      - number: '4.2'
        title: Margin path depends on attach, support efficiency, and disciplined risk pricing
        blocks:
          - type: paragraph
            body: >-
              Hopper's public materials frame the business as a low-margin inventory seller that must create margin
              dollars through product innovation and attachment, not through exclusive supply. The cost base described
              in the retained evidence fits that framing: data and cloud operations, customer support and claims
              handling, payment and fraud costs, partner revenue share, and the underwriting/compliance burden that
              comes with fintech-style protections. The company also disclosed that support operations had to scale
              materially after pandemic-era disruption, which reinforces that service delivery is an economic variable
              rather than a back-office footnote. For underwriting, the key takeaway is that Hopper may produce
              attractive contribution dollars when protection products attach and risk pricing holds, but there is no
              public gross-margin bridge showing how those gains net against claims, support, partner rev share, or
              compliance costs.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI014
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
