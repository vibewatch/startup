  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Hopper still reads as a late-stage private company whose core identity blends consumer travel booking with
              travel-fintech infrastructure. Third-party profiles tie the company to Frederic Lalonde's 2007 founding
              and place the operating footprint in Montreal, with Boston also cited in historical fundraising coverage.
              Current company-controlled surfaces emphasize a savings-first mission and present HTS/Hopper Cloud as the
              mechanism that extends Hopper beyond its own app into airline, bank, OTA, and agency workflows. That
              combination matters for the rest of the report because later adoption, customer concentration, and
              valuation questions all depend on whether Hopper is best underwritten as a mobile travel marketplace, a
              fintech-margin engine, or a B2B travel platform that now spans all three.
