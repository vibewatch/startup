      - number: '2.4'
        title: Adoption drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The demand driver in the pool is straightforward: Hopper pitches savings, flexibility, and
              conversion-improving fintech products, and independent reporting suggests those capabilities are valuable
              enough that banks want them embedded inside loyalty ecosystems. The key constraint is equally visible.
              Capital One's 2026 insourcing shows that large partners may continue buying Hopper APIs or fintech modules
              while internalizing the customer-facing platform, supplier relationships, and operating talent. That
              dynamic limits how much of the stack Hopper can permanently own and raises concentration risk around a few
              strategic partners. For valuation, that means market breadth alone is insufficient; diligence still needs
              proof of partner retention, attach rates, and the share of economics Hopper keeps once sophisticated
              customers move from outsourced portal to modular API consumption.
            claimRefs:
