      - number: '2.2'
        title: Sizing lenses and what they do not prove
        blocks:
          - type: paragraph
            body: >-
              This evidence pool supports multiple sizing lenses, but not a clean TAM/SAM/SOM stack. Hopper's own
              financing release offered a broad upside claim that industry-wide travel fintech adoption could add $200
              billion of annual consumer spend, which is useful as a directional market-expansion thesis but not as
              underwritten addressable revenue. An external statistics page offers a realized-scale lens by reporting
              $850 million of 2024 revenue, $7.5 billion of 2024 bookings, and 120+ million lifetime downloads. Those
              figures help size the commercial surface Hopper has already touched, yet they still do not isolate
              geography, attach rate, take rate, or segment-specific budgets. The result is a market that looks large
              and multi-channel, but remains weakly bounded for valuation work without better partner economics.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
