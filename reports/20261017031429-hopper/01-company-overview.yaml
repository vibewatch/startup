  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: governance
      missingEvidence: Full current board roster, committee structure, observer rights, and any founder or investor control provisions.
      whyItMatters: Governance opacity makes it hard to assess key-person dependency, board independence, and who can force or block strategic outcomes.
      diligencePath: Request the current board deck, financing side letters, and corporate governance summary from management or the data room.
      relatedQuestionRefs: [QO008]
      relatedTableRefs: [TO002, TO003]
    - type: conflicting-data
      severity: material
      topic: funding-history
      missingEvidence: A reconciled financing ledger that shows every round, instrument, and cumulative capital raised.
      whyItMatters: Public summaries currently disagree on whether Hopper raised roughly $600 million by 2021 or only $175 million total, which directly affects dilution and valuation context.
      diligencePath: Obtain the cap table, round closing documents, and any investor update that reconciles cumulative proceeds.
      relatedQuestionRefs: [QO003, QO007]
      relatedTableRefs: [TO001, TO003]
    - type: private-evidence-only
      severity: material
      topic: financial-disclosure
      missingEvidence: Audited FY2024-FY2026 revenue, gross margin, EBITDA or cash-burn detail, partner concentration, and B2B versus consumer mix.
      whyItMatters: The company can be shown as scaled, but present-day profitability, liquidity, and concentration cannot be underwritten from the assigned public pool.
      diligencePath: Request audited financial statements, monthly operating KPIs, and top-partner concentration schedules.
      relatedQuestionRefs: [QO004, QO007]
      relatedTableRefs: [TO001]
    - type: missing-source
      severity: minor
      topic: customer-scale
      missingEvidence: Current active customers, booked travelers, and named enterprise accounts or locations.
      whyItMatters: Downloads and brand recognition are weaker diligence anchors than active users, repeat bookers, and live partner count.
