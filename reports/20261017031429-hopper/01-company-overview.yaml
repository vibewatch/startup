schemaVersion: report-v2
artifact: company-overview
slug: hopper
runDate: 2026-10-17
company:
  name: Hopper
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Hopper is a founder-led Montreal travel fintech company that evolved from a
    consumer booking app into a B2B infrastructure platform through Hopper
    Cloud/HTS, with the last public valuation marker still at $5 billion from
    the February 2022 Series G. The assigned evidence pool supports real scale
    and product breadth, but it also leaves material diligence gaps around
    current board composition, audited economics, and even the cumulative
    capital raised because public summaries conflict.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      Hopper still reads as a late-stage private company whose core identity
      blends consumer travel booking with travel-fintech infrastructure.
      Third-party profiles tie the company to Frederic Lalonde's 2007 founding
      and place the operating footprint in Montreal, with Boston also cited in
      historical fundraising coverage. Current company-controlled surfaces
      emphasize a savings-first mission and present HTS/Hopper Cloud as the
      mechanism that extends Hopper beyond its own app into airline, bank, OTA,
      and agency workflows. That combination matters for the rest of the report
      because later adoption, customer concentration, and valuation questions
      all depend on whether Hopper is best underwritten as a mobile travel
      marketplace, a fintech-margin engine, or a B2B travel platform that now
      spans all three.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      The public record in the assigned pool shows a concentrated leadership
      picture rather than a fully transparent governance one. Lalonde remains
      the recurring center of gravity across company and third-party narratives,
      while AskCyborg identifies CTO Joost Ouwerkerk as the key technical
      counterweight. The clearest board-level change in the retained evidence is
      the addition of GPI Capital managing partner Khai Ha alongside the 2021
      Series G, which suggests investor oversight at the growth-equity stage but
      does not reveal committee structure, control rights, or the full current
      roster. That leaves real key-person dependency: Hopper's product,
      financing story, and B2B platform narrative are all still tied to a small
      number of named executives and investors in the public materials.
    claimRefs: [CO001, CO007, CO010]
    tableRefs: [TO002, TO003]
  - id: capital-scale-and-disclosure
    title: Capital, scale, and disclosure quality
    body: >-
      Hopper's public growth story is strongest in historic fundraising and
      product-scaling disclosures, but current underwriting remains constrained
      by uneven transparency. The 2021 materials describe a company with
      fintech products already generating the majority of revenue and nearly
      $600 million of cumulative capital raised by the Series G; later
      third-party summaries still point to a $5 billion valuation marker and
      $500 million of reported 2023 revenue. At the same time, the same
      public-data vendor that preserves the valuation marker also compresses
      total funding to a single $175 million round, which is a direct signal
      that cap-table reconstruction from public profiles is unreliable here.
      For diligence purposes, scale is real, but present-day economics, partner
      concentration, and exact capitalization still need primary evidence
      rather than summary-site extrapolation.
    claimRefs: [CO007, CO008, CO009, CO012, CO013, CO014, CO015, CO016]
  - id: milestone-trajectory-and-risk
    title: Milestone trajectory and partner-concentration risk
    body: >-
      Hopper's milestone path shows a company that kept broadening product
      scope and financing options, then leaned harder into platform economics.
      The pitch-deck breakdown describes expansion from flight prediction into
      cars, fintech attach products, and enterprise APIs by 2021; the later
      award and scale markers show the brand and marketplace still had momentum
      after the pandemic rebound. The most important recent directional signal
      in the assigned pool, though, is not another consumer-product launch but
      Capital One's move to internalize more of the Hopper stack. If that
      interpretation is directionally right, it reinforces that Hopper's B2B
      strategy can create value but can also leave the company exposed when a
      major partner decides to absorb key software, talent, or economics
      in-house.
    claimRefs: [CO004, CO005, CO006, CO009, CO011, CO012]
    figureRefs: [FO001]
tables:
  - id: TO001
    title: Snapshot KPI table
    columns:
      - Metric
      - Value / status
      - As of
      - Confidence
      - Gap / diligence ask
    rows:
      - [Stage, "Late-stage private travel fintech / travel infrastructure company", "2026-10-17", medium, "No newer priced financing or public-market mark is present in the assigned pool after the February 2022 valuation marker."]
      - [Valuation, "$5B private valuation", "February 2022", medium, "Need any later primary or secondary valuation evidence to refresh the mark."]
      - [Total raised, "Conflicting public totals: around $600M by Series G vs $175M in one data-vendor entry", "2021-2026", low, "Need cap table, financing ledger, or closing documents to reconcile cumulative capital raised."]
      - ["Revenue / run-rate", "$500M reported annual revenue; no verified 2025 or 2026 run-rate", "November 2023", medium, "Need audited FY2024-FY2026 revenue, gross margin, and B2B/B2C mix."]
      - [Customers, null, "2026-10-17", low, "Assigned sources support historical downloads and partner narratives, not current active customers, bookers, or enterprise accounts."]
      - [Headcount, "1,201 LinkedIn employees", "November 2025", low, "Need company-confirmed current headcount and functional split."]
      - [Locations, "Montreal headquarters; Boston and Montreal operations cited in fundraising coverage", "2021-2026", medium, "Need current office footprint and geographic employee distribution."]
    notes: Public summary sources conflict on total capital raised; null means the assigned pool does not verify a current customer metric.
    claimRefs: [CO002, CO008, CO013, CO014, CO015, CO016]
  - id: TO002
    title: Leadership and founder table
    columns:
      - Person
      - Role
      - Evidence-backed background
      - Founder-market fit or functional coverage
      - Key-person dependency
    rows:
      - ["Frederic Lalonde", "CEO and co-founder", "AskCyborg and GetLatka both identify Lalonde as founder and current CEO dating back to 2007.", "Founder continuity anchors strategy, brand, and financing narrative.", "High: the public record centers company identity and major milestones around Lalonde."]
      - ["Joost Ouwerkerk", CTO, "AskCyborg names Ouwerkerk as CTO in its leadership summary.", "Provides the clearest source-backed technical leadership marker in the assigned pool.", "Medium-high: technical bench depth beyond the named CTO is not visible in the retained evidence."]
      - ["Khai Ha", "GPI Capital board representative", "Hopper's Series G announcement says, \"We welcome Khai to the board\" alongside the new financing.", "Represents growth-equity oversight tied to the 2021 raise.", "Medium: current board size, committees, and independent-director mix are not public in this pool."]
    notes: Publicly retained sources identify only a partial leadership and board picture; they do not disclose the full current board or committee structure.
    enumerationScope:
      coverage: partial
      basis: Publicly retained sources identify founder, CTO, and one board addition, but not the full board roster, committee map, or succession bench.
    claimRefs: [CO001, CO007, CO010]
  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Role
      - Control or economic importance
      - Diligence ask
    rows:
      - ["Frederic Lalonde", "Founder / operator", "Still the clearest named decision-maker in public materials and therefore a likely control nexus for strategy and fundraising.", "Verify voting control, succession plan, and executive retention incentives."]
      - ["GPI Capital", "Series G lead investor", "Led the 2021 $175M Series G and added Khai Ha to the board.", "Confirm current ownership, pro rata rights, and any protective provisions."]
      - ["Capital One", "Strategic partner / concentration risk", "Earlier financing support evolved into a 2026 move to internalize software and talent, making this the clearest dependency in the pool.", "Quantify historical and current revenue concentration, contract terms, and transition obligations."]
      - ["Glade Brook / WestCap / Goldman Sachs Growth / Accomplice", "Growth-round syndicate", "Named Series G participants support the late-stage financing story, but public ownership percentages are not visible here.", "Map each investor's remaining position, board rights, and reserve capacity."]
      - ["HTS partner cohort (airlines, banks, OTAs, agencies)", "Distribution partners", "HTS positions Hopper as infrastructure for external sellers, so partner adoption drives platform economics even when counterparties are unnamed.", "Request top-partner GMV, margins, churn, and contract duration by cohort."]
    notes: This is a partial stakeholder map based on named investors and partner categories in the assigned public sources, not a full cap table or complete partner list.
    enumerationScope:
      coverage: partial
      basis: Table covers named founders, lead investors, and partner categories visible in assigned public sources, not the full cap table or full partner roster.
    claimRefs: [CO004, CO006, CO007, CO012, CO016]
