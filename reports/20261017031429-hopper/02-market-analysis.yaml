  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: diligence-gap
      missingEvidence: Partner-level GMV, attach rate, take rate, renewal rate, and contribution margin by channel.
      whyItMatters: These metrics determine whether enterprise mix growth translates into durable, high-quality revenue or simply shifts volume into lower-share modular contracts.
      diligencePath: Request partner cohort disclosures or board materials that separate managed portal revenue from API and fintech revenue by major account.
      relatedQuestionRefs: [QM008]
      relatedTableRefs: [TM002]
    - type: missing-source
      severity: material
      topic: market-sizing
      missingEvidence: A source-backed SAM or SOM split by geography, buyer segment, and budget owner.
      whyItMatters: Without a constrained addressable-market view, valuation can drift toward generic travel-app TAM language rather than the narrower enterprise workflows Hopper actually monetizes.
      diligencePath: Rebuild market size from partner count, loyalty-program member bases, disclosed travel spend pools, and supplier attach assumptions for each buyer segment.
      relatedQuestionRefs: [QM008]
      relatedTableRefs: [TM001, TM002, TM003]
