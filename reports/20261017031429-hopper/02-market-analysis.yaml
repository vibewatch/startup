      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - [Bank or loyalty platform, "Travel or loyalty executive", Traveler, "Partner institution and traveler for add-ons", "Partner-branded portal with embedded booking inventory and flexibility products", "Loyalty or travel P&L owner", "Increase cardholder engagement and monetization through travel retailing"]
      - [Travel provider or OTA, "Distribution or product leader", Traveler and call-center / servicing teams, "Travel brand operating budget", "White-label booking or fintech module inside an existing channel", "Distribution or e-commerce budget owner", "Raise conversion and attach-margin without building in-house"]
      - [Hopper-owned consumer app, Hopper product team, Traveler, Traveler, "Direct mobile booking with price prediction and add-on protections", "Hopper marketing and product budget", "Acquire users test products and seed future B2B features"]
      - [Large strategic partner transitioning in-house, "Partner product and platform team", Traveler, "Partner institution", "Internalized portal plus continued API / fintech supply from Hopper", "Platform or travel business budget owner", "Own customer experience and supplier economics while preserving specialized third-party modules"]
    notes: >-
      Buyer and payer roles differ by channel; in B2B deals the traveler is the end user but not
      always the economic buyer.
    claimRefs: [CM002, CM004, CM005, CM006, CM010]
figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      Layered lens showing how broad travel-fintech rhetoric narrows into realized Hopper scale,
      buyer concentration, and underwriting constraints.
    data:
      items:
        - label: Broad sector upside lens
          value: $200B annual consumer spend uplift
          note: Hopper's 2021 company-authored scenario for sector-wide fintech adoption
          tone: opportunity
        - label: Realized 2024 booking throughput
          value: $7.5B bookings
          note: External realized-scale lens rather than a TAM estimate
          tone: positive
        - label: Realized 2024 revenue
          value: $850M revenue
          note: Shows monetized scale already reached through Hopper's channels
          tone: positive
        - label: Enterprise channel concentration
          value: '>90% of revenue from enterprise partnerships'
          note: Reported by Hospitality.today for 2026
          tone: warning
        - label: Consumer reach remains meaningful
          value: 120+M lifetime downloads
          note: Shows the app still matters as a distribution and test surface
          tone: neutral
        - label: Partner insourcing constraint
          value: 150 Capital One travel employees transitioned
          note: Indicates sophisticated partners may internalize the front end while keeping modules
          tone: risk
    approximationNotes: >-
      Layer order reflects narrowing underwriting usefulness rather than arithmetic subtraction.
      Values use mixed units already disclosed in the tables and should be read as evidence lenses,
      not as additive market layers.
    claimRefs: [CM004, CM006, CM007, CM008, CM009, CM012]
