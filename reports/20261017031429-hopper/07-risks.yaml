  evidenceGaps:
    - type: stale
      severity: material
      topic: financial-visibility
      missingEvidence: Current audited 2024-2026 revenue mix, gross margin, EBITDA bridge, cash balance, and working-capital disclosures.
      whyItMatters: Without current audited statements, investors cannot size burn risk, partner concentration, or reserve capacity behind Hopper's fintech products.
      diligencePath: Request audited financial statements, partner revenue concentration, and monthly cash / margin bridge packs for the last 12-18 months.
      relatedQuestionRefs: [QR006]
      relatedTableRefs: [TR003]
    - type: missing-source
      severity: material
      topic: partner-concentration
      missingEvidence: Post-transition Capital One contract economics, API volume retention, and the revenue share of Hopper's next three largest B2B partners.
      whyItMatters: Capital One's move in-house is the most visible concentration event in the pool, but the financial impact cannot be sized from public sources alone.
      diligencePath: Obtain partner cohort revenue, contract terms, renewal dates, and migration plans for Capital One and the next largest API customers.
      relatedQuestionRefs: [QR003, QR004]
      relatedTableRefs: [TR003]
    - type: enumeration-incomplete
      severity: material
      topic: regulatory-compliance
      missingEvidence: Full consent-order text, court-approval status, and post-settlement complaint / refund metrics for Hopper's add-on products.
      whyItMatters: The public risk register can rank the FTC matter, but it cannot yet confirm whether remediation is proving effective in live operations.
      diligencePath: Pull the court docket, current product terms, complaint-rate trendlines, and internal compliance attestations for fee-disclosure controls.
      relatedQuestionRefs: [QR001, QR002, QR007]
      relatedTableRefs: [TR001]
