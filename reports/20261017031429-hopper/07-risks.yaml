    summary: >-
      The highest residual exposure clusters around consumer-protection compliance,
      partner concentration, and financial opacity rather than pure demand risk.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: FTC fee-disclosure recurrence
          values: [High, High, Medium, High]
        - label: Capital One / partner concentration
          values: [High, High, Low, High]
        - label: Customer-service and add-on fulfillment
          values: [Medium, Medium, Medium, Medium]
        - label: Fintech pricing / underwriting exposure
          values: [Medium, High, Low, Medium]
        - label: Financial disclosure opacity
          values: [High, Medium, Low, High]
        - label: Execution-control maturity
          values: [Medium, Medium, Low, Medium]
    approximationNotes: >-
      Heatmap values are analyst-assigned categorical rankings synthesized from the cited
      evidence rather than source-native scores or probabilities.
    claimRefs: [CR001, CR005, CR014, CR015, CR016]
callouts:
  - calloutType: risk
    title: Primary thesis-break triggers
    body: >-
      The thesis should be reconsidered if Hopper faces another consumer-protection action
      on present-day booking flows, if Capital One's shift to API-only materially reduces
      enterprise economics, or if the company needs fresh capital before it can disclose
      durable post-transition profitability.
    claimRefs: [CR001, CR005, CR014, CR015]
  - calloutType: insight
    title: Mitigation quality is uneven
    body: >-
      Hopper can point to remediation language, support automation, and positive EBITDA
      commentary, but the public evidence still does not disclose the controls, partner
      contracts, or audited financial detail needed to downgrade residual risk with
      confidence.
    claimRefs: [CR004, CR008, CR010, CR014, CR015]
