        - Medium
        - Medium
        - Medium
        - Medium because current SLA disclosure is limited
        - No recent response-time, CSAT, or backlog metrics in the pool
      - - Fintech pricing / underwriting losses
        - Hopper says it takes the financial risk when dynamically pricing fintech offerings
        - Medium
        - High
        - Low-medium
        - Medium-high without visibility into reserves, loss ratios, or reinsurance
        - No public disclosure on reserve policy, claim frequency, or counterparties
      - - Control maturity under a speed-biased experimentation culture
        - Hopper's culture page emphasizes rapid testing and decisions with incomplete information
        - Medium
        - Medium
        - Low
        - Medium because governance controls are not described at the same level of detail
        - No public control framework tying experimentation to compliance review
    notes: >-
      This register blends adverse reporting, company statements, and third-party review
      evidence; "security" remains a diligence gap because the assigned pool did not
