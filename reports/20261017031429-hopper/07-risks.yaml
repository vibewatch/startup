      - Counterparty / base
      - Role
      - Concentration
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Capital One Travel relationship
        - Capital One
        - Largest API client after managed-platform transition
        - High
        - API volumes or economics step down after insourcing
        - High
        - Hopper says Capital One remains its largest API client
        - High until post-transition volumes are visible
      - - B2B revenue mix
        - Large unnamed enterprise partners
        - Core revenue engine
        - High because Hopper says B2B is 90 percent of revenue
        - One or two partner changes materially compress growth or margins
        - High
        - Management says other large API clients exist
        - High because those customers and contracts are not disclosed
      - - Private capital and opaque financial reporting
        - Existing investors / future financing markets
        - Backstop for growth and balance-sheet flexibility
        - Medium
        - New capital is needed before audited profitability is proven
        - Medium-high
        - Prior capital raised and claimed recent positive EBITDA
        - Medium-high because public revenue, margin, and cash data remain stale or estimated
    notes: >-
      The public record supports concentration risk qualitatively, but not the exact
      post-Capital One revenue share, contract duration, or cash runway; investors should
      demand those figures directly.
    claimRefs: [CR005, CR006, CR007, CR008, CR013, CR014]
