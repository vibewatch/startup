schemaVersion: report-v2
artifact: risks
slug: hopper
runDate: 2026-10-17
company:
  name: Hopper
chapter:
  number: 7
  title: Risks
  summary: >-
    Hopper's risk stack is led by a realized U.S. consumer-protection event—the FTC's
    July 2026 settlement over hidden-fee and product-benefit allegations—and by partner
    concentration as Capital One moves its managed travel portal in-house while remaining
    Hopper's largest API client. Management can point to discontinued app practices,
    support automation, and recent positive EBITDA claims, but post-Capital One revenue
    mix, audited margins, and current liability economics remain under-disclosed.
sections:
  - id: consumer-protection-overhang
    title: Consumer-protection enforcement is the clearest near-term risk
    body: >-
      The biggest risk is no longer hypothetical: the FTC announced in July 2026 that
      Hopper agreed to pay $35 million and accept conduct restrictions after allegations
      that the app hid pre-selected Tip and VIP Support fees and overstated the benefits
      of VIP Support and Price Freeze. That matters for three reasons. First, it creates
      direct remediation, monitoring, and reputation costs around Hopper's consumer
      add-on model. Second, the complaint links at least part of the conduct to the
      FTC's Unfair and Deceptive Fees Rule for short-term lodging bookings since May 12,
      2025, which raises the bar for ongoing disclosure discipline. Third, even though
      Hopper told TechCrunch and Consumer Finance Monitor that the challenged practices
      were outdated, app-specific, and discontinued in mid-2023, the company still had
      to settle, so investors should underwrite compliance recurrence and customer-redress
      execution as live risks rather than historical noise.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: concentration-and-operations
    title: Partner concentration and service execution remain the operating pressure points
    body: >-
      Hopper's operating model still looks concentrated and somewhat brittle. BetaKit
      reported that Capital One is bringing the managed Capital One Travel platform
      in-house after four and a half years, with Hopper saying the partner shifts from
      managed platform to API client. That is a meaningful dependency because Hopper also
      told BetaKit that B2B now accounts for 90 percent of revenue, making the health of
      a small set of enterprise relationships strategically important even if Capital One
      remains a customer. On the consumer side, the public evidence bundle still shows
      friction around add-on fulfillment and service responsiveness: ShopBack describes
      refund disputes and peak-period response delays, while Hopper's own 2022 financing
      release says support demand had previously surged enough to require a 200 percent
      team expansion. The evidence points to a business with real product reach, but one
      where operational failure tends to surface at the same customer touchpoints that
      regulators have already scrutinized.
    claimRefs: [CR005, CR006, CR007, CR009, CR010, CR011, CR012]
    tableRefs: [TR002]
  - id: financial-opacity-and-kill-criteria
    title: Financial opacity keeps residual risk high despite management's profitability claims
    body: >-
      The hardest part of underwriting Hopper from the assigned pool is not identifying
      risks; it is sizing them. BetaKit says Hopper had roughly 400 core staff in 2026
      and had achieved positive EBITDA over the prior six months, but management declined
      to share current sales. GetLatka's profile surfaces a November 2023 reported
      revenue figure, a 2024 estimate, and LinkedIn-based 2025 headcount, which is
      useful for context but not a substitute for audited 2024-2026 financials or
      segment mix after the Capital One transition. Hopper's own 2022 Series G release
      also says its fintech offerings represented a majority of revenue and that the
      company takes the financial risk when pricing them, implying real underwriting and
      reserve exposure if assumptions break. The investment implication is straightforward:
      kill criteria should focus on any repeat consumer-protection action, visible
      deterioration in enterprise-partner volume after Capital One's insourcing, or a
      need for fresh capital before Hopper can prove durable profitability with cleaner
      disclosure.
    claimRefs: [CR008, CR009, CR013, CR014, CR015, CR016]
    tableRefs: [TR003]
