  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局：规模化替代方案比初创同行更重要
        blocks:
          - type: paragraph
            body: >-
              保留证据清楚表明，Hopper 的竞争范围比其他旅行应用更广。Tracxn 的初创视角把 Catch Frog AI 和 Aget24 列为 Hopper 的主要早期同行；AskCyborg 更宽泛的 OTA
              视角则指向 Expedia、Kayak、Skyscanner 和 Booking.com 等成熟比较对象。Hopper 自己的文化指南对替代方案说得更明白：Hopper
              上销售的航班和酒店，也能在数千个其他地方预订，包括直接向供应商购买。因此，真正的战场不只是应用发现，还包括航空公司和酒店直销渠道、合作伙伴自有的忠诚度生态，以及内部自建选项。即使可信度较低的 Accio
              综合分析也把 Hopper 排在更大型消费者平台之后，这与现有巨头是规模基准、而非狭义初创同行的判断一致。
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP014
              - CP016
