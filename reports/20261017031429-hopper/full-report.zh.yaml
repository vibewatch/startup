  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式多元，但公开结构披露偏方向性而非经审计
        blocks:
          - type: paragraph
            body: >-
              保留来源对 Hopper 的变现结构给出了相互一致的描述。独立资料和公司融资公告都提到旅行预订佣金、金融科技增值费和 B2B Hopper Cloud 分销的组合。这一点把 Hopper 与纯 OTA
              抽成模式区分开来：公开证据指向的模式，是靠波动管理产品和合作伙伴分销赚取利润，而不只是靠基础预订转化。最有力的官方信号虽然来自历史，却很关键：Hopper
              在成长融资公告中称金融科技产品已贡献大部分收入；独立的最新资料则称 Price Freeze 和 Rebooking Guarantee 占航空收入的
              70%。这两个数字并不等价，不能合并成一个指标，但它们共同说明增值服务附加在经济上居于核心位置。
