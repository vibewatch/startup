      - number: '2.2'
        title: 市场规模视角及其不能证明的事项
        blocks:
          - type: paragraph
            body: >-
              这组证据支持多个规模视角，但无法搭出清晰的 TAM/SAM/SOM。Hopper 自己的融资公告声称，全行业采用旅行金融科技可能增加 $200 billion
              的年度消费者支出。这个数字可作为市场扩张方向的论据，却不能直接当作可承销的目标收入。一个外部统计页面提供了已实现规模视角，报告 2024 年收入 $850 million、预订额 $7.5
              billion、累计下载量 120+ million。这些数字有助于衡量 Hopper
              已触达的商业范围，但仍无法拆出地域、附加率、抽成率或分部门预算。市场看起来足够大、渠道也足够多元，但没有更好的合作伙伴经济数据，估值所需的边界仍很模糊。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM012
