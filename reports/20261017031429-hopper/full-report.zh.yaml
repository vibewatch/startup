      - number: '1.3'
        title: 资本、规模与披露质量
        blocks:
          - type: paragraph
            body: >-
              Hopper 的公开增长故事最有力的部分，是历史融资和产品规模化披露；但透明度不均，当前投资评估仍受限制。2021 年材料称，金融科技产品当时已贡献大部分收入，截至 Series G 累计融资接近 $600
              million；后来的第三方摘要仍指向 $5 billion 估值和 2023 年报告收入 $500 million。与此同时，同一个保留该估值标记的公开数据供应商，却把总融资压缩成单笔 $175 million
              轮次。这直接说明，根据公开资料重建资本表在此处并不可靠。对尽调而言，规模确实存在，但当期经济模型、合作伙伴集中度和准确资本结构仍需要一手证据，不能靠摘要网站外推。
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO012
              - CO013
              - CO014
              - CO015
              - CO016
      - number: '1.4'
        title: 里程碑轨迹与合作伙伴集中度风险
        blocks:
          - type: paragraph
            body: >-
              Hopper 的里程碑轨迹显示，公司持续扩大产品范围和融资选择，随后更加依赖平台经济。融资演示文稿拆解显示，截至 2021 年，公司已从航班预测扩展到汽车、金融科技附加产品和企业
              API；后续奖项与规模指标表明，疫情反弹后品牌和市场仍有动能。不过，现有材料中最近最重要的方向性信号，不是又一次消费者产品发布，而是 Capital One 开始把更多 Hopper
              技术栈收归内部。如果这一解读方向正确，它既说明 Hopper 的 B2B 战略可以创造价值，也说明一旦大合作伙伴决定把关键软件、人才或经济收益内化，公司就会暴露在风险中。
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO009
              - CO011
              - CO012
