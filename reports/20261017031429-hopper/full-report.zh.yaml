        - from: Service and risk costs
          to: Margin dollars
          label: 净经济性取决于风险纪律和效率
    approximationNotes: 这张图是定性桥接，不是量化瀑布图。保留来源描述了收入路径和成本驱动因素，但没有披露经审计的分部数值。
    claimRefs:
      - CI001
      - CI002
      - CI006
      - CI008
      - CI012
      - CI014
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 指定来源指向一种分层模式：消费者需求捕获和金融科技逻辑为面向合作伙伴的 API、白标商业模块以及嵌入银行／航空公司的体验提供能力，但公开控制证据仍然薄弱。
    data:
      layers:
        - label: 旅客需求捕获
          detail: 消费者应用覆盖航班、酒店、租车和民宿，同时产生搜索、预订和价格关注意图。
          modules:
            - 航班
            - 酒店
            - 租车
            - 民宿
          outputs:
            - 搜索和预订需求
        - label: 定价与保障逻辑
          detail: 价格预测和灵活性产品将波动转化为差异化的预订及增值服务层。
          modules:
            - 价格预测
            - Price Freeze
            - Cancel For Any Reason
            - Disruption Guarantee
          outputs:
            - 预订时机建议
            - 增值服务变现
        - label: 企业商业模块
          detail: HTS 将旅游库存及相关模块打包成可复用的合作伙伴产品。
          modules:
            - HTS Stays
            - HTS Cars
            - HTS Packages
            - 忠诚度门户
          outputs:
            - 白标预订体验
        - label: 集成层
          detail: 公开列出的 OAuth2 REST API 和 SDK，是指定证据池中最清晰的集成证据。
          modules:
            - HTS Airline API v1.1
            - OpenAPI 生成的 SDK
            - JavaScript 酒店价格锁定集成
          outputs:
            - 嵌入式结账组件
            - 合作伙伴开发者支持
        - label: 合作伙伴体验
          detail: 银行、航空公司和旅游分销商似乎将 Hopper 的能力嵌入自身的客户旅程。
          modules:
            - RBC Avion Rewards Travel
            - 航空公司预订流程
            - 合作伙伴直营渠道
          outputs:
            - 自有忠诚度与旅游入口
        - label: 信任与运营控制
          detail: 相比商业打包能力，控制层虽具战略重要性，但在公开证据池中的记录较为薄弱。
          modules:
            - 客户支持
            - 费用披露控制
            - 安全与隐私流程
          outputs:
            - 控制失效时的监管风险
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE005
      - CE009
      - CE010
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Hopper 的旅程串起应用获客、付费灵活性、预订后服务、重复使用提醒和合作伙伴分发循环。
    data:
      items:
        - label: 发现价格机会
          actor: 消费者旅客
          channel: 移动应用
          touchpoints:
            - 价格预测及等待或购买提示
            - 围绕省钱价值由应用驱动获客
        - label: 灵活预订
          actor: 消费者旅客
          channel: 移动应用结账
          touchpoints:
            - 在结账时销售 Price Freeze 和灵活取消
            - 金融科技产品是核心变现杠杆
        - label: 处理行程变更
          actor: Hopper 客服
          channel: 应用内服务流程
          touchpoints:
            - Hopper 是应用订单的记录商户
            - 2021 年，自助客服自动化即时处理了 60% 的请求
        - label: 鼓励重复使用
          actor: 回头旅客
          channel: 应用与奖励循环
          touchpoints:
            - Carrot Cash 和省钱定位支持用户复用
            - 长期提升客户满意度是公司明确传达的信息
        - label: 通过 HTS 扩张
          actor: 企业合作伙伴
          channel: 白标或嵌入式合作伙伴渠道
          touchpoints:
            - Capital One Travel 是点名的旗舰部署
            - AirAsia MOVE 和 Cloudbeds 展示了较新的推出路径
        - label: 暴露尽调风险
          actor: 投资者
          channel: 尽调跟进
          touchpoints:
            - 公开来源显示了采用证据，但没有 NRR 或流失率
            - 合作伙伴集中度仍是定性判断，尚未量化
    claimRefs:
      - CU001
      - CU005
      - CU010
      - CU012
      - CU013
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 最高的剩余风险集中在消费者保护合规、合作伙伴集中度和财务不透明，而非单纯的需求风险。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余严重度
      rows:
        - label: FTC 费用披露问题再现
          values:
            - 高
            - 高
            - 中
            - 高
        - label: Capital One / 合作伙伴集中度
          values:
            - 高
            - 高
            - 低
            - 高
        - label: 客服与增值服务履约
          values:
            - 中
            - 中
            - 中
            - 中
        - label: 金融科技定价 / 承保风险
          values:
            - 中
            - 高
            - 低
            - 中
        - label: 财务披露不透明
          values:
            - 高
            - 中
            - 低
            - 高
        - label: 执行控制成熟度
          values:
            - 中
            - 中
            - 低
            - 中
    approximationNotes: 热力图数值是分析师根据引用证据综合得出的分类排名，不是来源原生评分或概率。
    claimRefs:
      - CR001
      - CR005
      - CR014
      - CR015
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 规模与变现证据让 Hopper 进入观察名单，但披露缺口和监管拖累使建议仍停留在持续跟踪。
    data:
      nodes:
        - id: scale
          label: 规模证明
          detail: 60M+ 次下载、2023 年披露收入 $500M，以及演示文稿中的 $1.5B 销售指标，都显示其确有市场存在感。
        - id: monetization
          label: 变现引擎
          detail: 金融科技产品被描述为占收入大头或约三分之二，并能提高每位用户的支出。
        - id: distribution
          label: 分发选择权
          detail: Hopper Cloud 将这一论点延伸到合作伙伴 API 和白标旅游分发。
        - id: disclosure
          label: 披露缺口
          detail: 公开证据仍缺少经审计的当前利润率、现金、GMV 到净收入的桥接，以及偏好栈细节。
        - id: regulatory
          label: 监管拖累
          detail: FTC 和解为估值信心增加了新的消费者保护折价。
        - id: decision
          label: 建议
          detail: 以中等信心、高风险持续跟踪；在价格支撑改善前，估值仍显得偏高。
      edges:
        - from: scale
          to: monetization
          label: 支持关注
        - from: monetization
          to: distribution
          label: 扩大上行空间
        - from: distribution
          to: disclosure
          label: 但需要证明
        - from: disclosure
          to: regulatory
          label: 提高折现率
        - from: regulatory
          to: decision
          label: 限制入场判断
    approximationNotes: 流程总结证据之间的关系，而非量化估值模型。
    claimRefs:
      - CV003
      - CV004
      - CV007
      - CV010
      - CV015
      - CV016
