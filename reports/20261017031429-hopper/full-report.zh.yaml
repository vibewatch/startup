  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              现有材料最有力的边界证据表明，Hopper 横跨两个相互连接的市场，而不是单一 OTA 类别。公司页面将 Hopper 描述为全球旅行平台，其 B2B 部门为合作伙伴直销渠道提供动力；2021 年成长投资公告则把
              Hopper Cloud 定义为基础设施，可向航空公司、OTA、元搜索公司和旅行社分发金融科技产品、代理商内容及白标门户。2026
              年独立报道进一步收窄了边界：如今产品被卖入由银行主导的忠诚度生态，客户关系由合作伙伴掌握；现状替代方案要么是现有白标旅行服务商，要么是基于直接供应商关系自行搭建。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
