      - number: '3.3'
        title: 定价与切换能力仍不透明
        blocks:
          - type: paragraph
            body: >-
              相比功能，定价更难评估。保留的公开来源描述了 Hopper 的产品范围和合同形式，却没有公布 HTS
              合同或影响收入质量的金融科技增值服务的标准价目。切换成本也不只取决于产品广度：合作伙伴会权衡实施工作量、对忠诚度或预订体验的控制、供应商接入，以及未来能否多平台部署或内化部分技术栈。Hospitality.today
              明确指出，合作伙伴开始把这类平台的一部分搬回内部。结合 Hopper 自己承认旅行库存在其他地方也广泛可得，真正重要的就不再是库存接入本身，而是渠道控制和嵌入合作伙伴工作流的程度。
            claimRefs:
              - CP005
              - CP007
              - CP008
              - CP009
              - CP012
