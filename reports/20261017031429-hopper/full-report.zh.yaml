chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司定位与商业模式
        blocks:
          - type: paragraph
            body: >-
              Hopper 仍是一家后期私有公司，核心定位把消费者旅行预订与旅行金融科技基础设施融在一起。第三方资料将公司追溯到 Frederic Lalonde 于 2007
              年创办，并将运营据点放在蒙特利尔；历史融资报道也提到波士顿。当前由公司控制的页面强调“先帮用户省钱”的使命，并把 HTS/Hopper Cloud 定义为把 Hopper 从自有应用延伸到航空公司、银行、OTA
              和旅行社工作流的机制。这一组合决定了本报告后续对采用、客户集中度和估值的判断：Hopper 究竟应被评估为移动旅行市场、金融科技利润引擎，还是如今三者兼具的 B2B 旅行平台。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO002
              - CO008
              - CO013
              - CO014
              - CO015
              - CO016
      - number: '1.2'
        title: 管理层与治理
        blocks:
          - type: paragraph
            body: >-
              现有公开记录呈现的是管理层高度集中的图景，而非完全透明的治理结构。公司和第三方叙事都反复以 Lalonde 为中心；AskCyborg 则把 CTO Joost Ouwerkerk
              认定为关键技术支柱。保留证据中最清晰的董事会变化，是 GPI Capital 管理合伙人 Khai Ha 随 2021 年 Series G
              加入董事会。这说明成长股权阶段存在投资人监督，但没有披露委员会结构、控制权或完整的现任成员名单。因此，关键人物依赖是真实风险：公开材料中的 Hopper 产品、融资故事和 B2B
              平台叙事，仍都系于少数被点名的高管和投资人。
            claimRefs:
              - CO001
              - CO007
              - CO010
