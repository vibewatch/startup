      - number: '3.4'
        title: 护城河靠执行维持，并非结构性封闭
        blocks:
          - type: paragraph
            body: >-
              保留证据支持的是有条件的护城河，而不是锁定的市场地位。Hopper 的使命和文化页面称，速度、试验和客户至上是让产品难以复制的优势；2026
              年产品更新也表明管理层仍在沿用这套打法。但同一证据基础也说明护城河为何会变薄。FTC 和解让费用及灵活性产品背上信任与监管包袱，Fintech Byte 明确提示监管和竞争风险，Hospitality.today
              关于内化的信号则意味着合作伙伴可能把更多经济收益和客户关系控制留在自己手中。因此，Hopper 今天可以靠产品打包和分销取胜，但必须持续证明产品提升速度快过巨头、直销渠道和合作伙伴自有方案的追赶。
            claimRefs:
