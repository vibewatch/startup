              - CM012
      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方地图比市场规模地图清晰。Hopper Cloud 官方材料称，公司向希望嵌入金融科技模块或完整白标门户的旅行服务商和品牌销售；Hospitality.today 对 RBC 的报道则显示，金融机构正在用
              Hopper 把忠诚度计划变成旅行分销渠道。在这类交易中，终端用户是旅行者，但买方和付款方是掌握忠诚度计划、门户经济和供应商关系的合作伙伴组织。Hopper
              自有消费者应用仍然重要，因为它既是测试面也是分销面；不过，变现买方已从一次性预订的旅行者，转向企业渠道所有者。
            claimRefs:
              - CM002
              - CM006
              - CM009
              - CM010
              - CM011
