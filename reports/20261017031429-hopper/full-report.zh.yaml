      - number: '4.3'
        title: 资本需求仍不透明：资金用途公开，资产负债表事实却没有
        blocks:
          - type: paragraph
            body: >-
              现有融资公告描述的是 Hopper 如何为增长计划提供资金，而不是给投资人一张当前资产负债表。Series G
              公告称，资金将用于加速客户支持、招聘、收购式招聘、新品类和国际扩张；这与公司在当时为服务能力和产品广度投入相符。公开 traction 指标仍然滞后：一家聚合网站称，2023 年 11 月年收入 $500
              million
              是它能找到的最新公开数字，而公司的融资更新强调复苏早期的快速增长。缺失的信息比已有信息更关键：没有保留来源披露现金余额、当前消耗、毛利率、EBITDA、分部门收入结构或合作伙伴集中度。没有这些数字，就无法有把握地评估下一轮融资触发条件和资金续航。
            claimRefs:
              - CI004
              - CI005
              - CI009
              - CI015
      - number: '4.4'
        title: FTC 和解削弱收入质量信心，也提高尽调紧迫性
        blocks:
          - type: paragraph
            body: >-
              Hopper 最具差异化的变现层，也是本次更新中面临最明确反向证据的部分。FTC 案件和法律评论都确认，Hopper 因隐藏或预选费用，以及围绕 VIP Support 和 Price Freeze
              的误导性表述，接受了 $35 million
              和解。即使管理层把这些做法描述为过时，和解仍有财务影响：它带来现金义务，增加披露和产品治理审查；如果更清晰的主动选择或更窄的营销表述压低附加率，也可能降低保障产品转化。这并不能证明收入模式已经失灵，但在尽调验证当前附加率、投诉率、退款行为和整改后的金融科技产品经济性之前，收入质量的可信度会下降。财务上，Hopper
              看起来创新且可能增厚利润，但仍过于不透明，无法进行干净的投资评估。
            claimRefs:
              - CI002
              - CI003
              - CI010
              - CI011
