      - number: '4.2'
        title: 利润率路径取决于附加率、支持效率与审慎定价
        blocks:
          - type: paragraph
            body: >-
              Hopper
              的公开材料把业务定义为低利润率库存销售商，必须靠产品创新和附加销售创造利润，而不是靠独家供给。保留证据描述的成本基础也符合这一判断：数据与云运营、客户支持和理赔处理、支付与欺诈成本、合作伙伴分成，以及金融科技保障服务带来的承保
              / 合规负担。公司还披露，疫情冲击后支持运营必须大幅扩张，这说明服务交付本身就是经济变量，不是后台注脚。对投资评估而言，关键是：保障产品成功附加且风险定价有效时，Hopper
              可能产生可观的贡献利润；但公开材料没有毛利桥，无法看出这些收益扣除理赔、支持、合作伙伴分成和合规成本后的结果。
            claimRefs:
