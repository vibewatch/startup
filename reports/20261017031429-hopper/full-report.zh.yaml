            body: >-
              最大风险已经不是假设：FTC 于 2026 年 7 月宣布，Hopper 因被指应用隐藏预选的 Tip 和 VIP Support 费用、夸大 VIP Support 和 Price Freeze
              的好处，同意支付 $35 million 并接受行为限制。这有三层影响。第一，它给 Hopper 的消费者增值服务模式带来直接整改、监控和声誉成本。第二，投诉将至少部分行为与 FTC 自 2025 年 5 月
              12 日起针对短期住宿预订的《不公平和欺骗性费用规则》联系起来，提高了持续披露纪律的门槛。第三，尽管 Hopper 对 TechCrunch 和 Consumer Finance Monitor
              称相关做法已过时、仅限特定应用且于 2023 年年中停止，公司仍必须和解。因此，投资人应把合规复发和客户补偿执行视为当前风险，而不是历史噪音。
