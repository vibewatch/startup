            body: >-
              乐观故事并不难找到。Hopper 自己的 Series G 公告称，金融科技产品已贡献大部分收入，运行率增长相较前一年达到 330%。PhocusWire
              的独立报道补充称，金融科技增值产品约占收入的三分之二，并将用户平均支出提高约 15%；这种由附加销售驱动的经济性，确实可能支撑高于纯旅行社的倍数。Startup Fundraising 对 2026
              年融资演示文稿的拆解还指向超过 60 million 的下载量和 $1.5B 年销售额；Hopper 通过 Hopper Cloud 的 B2B
              分销故事，则把规模化路径扩展到消费者应用之外。如果这些经济性在合作伙伴分销下能够持续，公司仍可主张更高的战略价值。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
