      - number: '3.2'
        title: 差异化来自产品叠加与嵌入式分销
        blocks:
          - type: paragraph
            body: >-
              Hopper 可守住的部分不是独家旅行库存，而是围绕标准化供给叠加 AI 价格预测、灵活性金融科技和白标分销的方式。Hospitality.today 和 Hopper 自己的 2021
              年融资公告都显示，公司卖的不只是预订应用：HTS 和 Hopper Cloud 为合作伙伴打包代理商内容与金融科技模块；RBC 项目则表明，Hopper 能在银行忠诚度体验中替代传统 OTA
              服务商。Fintech Byte 的 2026 年 HTS 更新进一步显示，Hopper 仍在通过酒店灵活性、重做后的商业流程和 AI 服务扩大产品范围。这一组合让 Hopper 的价值主张比纯 OTA
              或狭窄的价格追踪初创公司更模块化。
