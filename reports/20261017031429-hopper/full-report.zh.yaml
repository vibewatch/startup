      - number: '8.3'
        title: 什么阻碍投资评估
        blocks:
          - type: paragraph
            body: >-
              反方论点主要关乎证据质量和下行风险，而不是缺少雄心。Startup Fundraising 明确称，Hopper 的演示文稿没有拆分收入与总预订量，也没有提供盈利时间表；当前公开收入标记仍是 2023
              年报告数字加后续估算，而不是经审计的当期披露。2026 年 FTC 案件之所以重要，是因为在投资人需要相信金融科技附加服务经济性的同时，它把近期消费者保护和产品营销审查放进了评估档案。更不利于尽调的是，指定的一个
              Hopper 第三方市场数据页面抓取到了无关的 Reddit 融资文本，这提醒我们：聚合页面看似最新，却可能不可靠到无法支撑估值。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV015
      - number: '8.4'
        title: 情景、退出准备度与下一步要求
        blocks:
          - type: paragraph
            body: >-
              公开记录足以让 Hopper 留在积极关注名单上，但不足以给出不考虑价格的背书。基准情景是，Hopper
              在战略上仍有吸引力，未来也可能退出，但投资人需要当前经审计财务、更新后的估值发现和清晰的资本结构，才能把业务质量与预期回报联系起来。乐观情景需要证明 Hopper Cloud
              和金融科技承保能够扩大，同时不出现监管或合作伙伴集中度意外。悲观情景是，如果当前估值标记持续过时、FTC
              余波损害信任，或后续数据表明增长代理指标高估了真实净收入质量，未来估值持平或下降。因此，真正能改变决策的尽调要求非常具体：经审计经济数据、当前轮次或二级市场估值，以及优先权条款。
            claimRefs:
              - CV001
