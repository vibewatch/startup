  topStrengths:
    - Real consumer-plus-B2B distribution surface with Hopper Cloud / HTS.
    - Fintech attach and paid flexibility products broaden monetization beyond simple OTA commissions.
    - Scale evidence and historical growth markers show Hopper is a real platform, not a concept.
  topRisks:
    - Audited margins, cash, runway, and partner concentration remain opaque.
    - FTC settlement and disclosure scrutiny create trust and compliance overhang on fee-based products.
    - Major partner insourcing can compress economics even when the product remains in use.
  unresolvedGaps:
