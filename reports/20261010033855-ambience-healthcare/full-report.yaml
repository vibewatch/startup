  - id: TV001
    title: Recommendation summary table
    columns:
      - Metric / Dimension
      - Assessment
      - Supporting Benchmark
      - Decision Implication
    rows:
      - - Recommendation
        - Research-More
        - 16.1x-25.5x forward 2026 revenue multiple ($51M-$77M MVR projection)
        - Withhold growth-equity commitment until contract expansion and retention cohorts are verified under NDA.
      - - Confidence
        - Medium
        - Third-party estimates conflict between $30M and $64.1M ARR; 80% scheduled visit adoption validated
        - Diligence must reconcile recognized revenue against reported ARR run-rate.
      - - Risk Rating
        - High
