        title: Founders, Executive Leadership, and Governance Evolution
        blocks:
          - type: paragraph
            body: >-
              The company was established by co-founders Mike Ng and Nikhil Buduma, who established a dual leadership
              structure uniting clinical product strategy with machine learning research. In September 2025, Ambience
              executed a significant executive realignment: co-founder and former Chief Scientist Nikhil Buduma
              transitioned into the role of Chief Executive Officer, while founding CEO Mike Ng assumed the full-time
              role of President and Chairman of the Board. This restructuring reflected Ambience's increasing emphasis
              on deep model reasoning, longitudinal chart awareness, and complex inpatient clinical intelligence. To
              accelerate enterprise commercialization, Ambience appointed veteran healthcare executive Mike Valli in
              February 2026 to serve in a dual capacity as Chief Revenue Officer and Chief Value Officer, directly
              aligning contract economics with validated health-system ROI frameworks.
