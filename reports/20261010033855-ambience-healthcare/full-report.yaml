chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Founding, and Core Architecture
        blocks:
          - type: paragraph
            body: >-
              Ambience Healthcare was founded in 2020 by Mike Ng and Nikhil Buduma with corporate headquarters located
              in San Francisco, California. The company architected an enterprise-scale artificial intelligence
              operating platform designed specifically for complex health systems rather than solo medical practices or
              outpatient clinics. Unlike single-feature ambient scribe utilities that focus strictly on transcribing
              outpatient dialogues, Ambience connects clinical documentation, medical coding, and revenue integrity
              directly across electronic health record environments. Its technology spans more than one hundred medical
              specialties and operates continuously across ambulatory clinics, emergency departments, and acute
              inpatient facilities. By integrating natively with leading EHR systems including Epic and Oracle Cerner,
              Ambience seeks to alleviate severe clinician administrative burden while protecting hospital revenue
              integrity and documentation compliance at the point of care.
            claimRefs:
              - CO001
              - CO002
              - CO008
              - CO015
          - type: table
            tableRef: TO001
            claimRefs:
