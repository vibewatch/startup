        - Requires proof of defensive switching costs and expanding department breadth.
      - - Valuation Stance
        - Expensive
        - $1.24B-$1.3B Series C valuation represents top-decile private healthcare AI multiple
        - Downside protection is limited if public market AI multiple compression accelerates.
