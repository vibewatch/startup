      - number: '1.4'
        title: Platform Trajectory, Enterprise Deployments, and Operational Milestones
        blocks:
          - type: paragraph
            body: >-
              Ambience's operational expansion is anchored on major enterprise health system adoptions. Most
              prominently, Cleveland Clinic selected Ambience for an exclusive five-year enterprise contract spanning
              more than 80 specialties following a rigorous bake-off evaluating five competing AI scribe vendors. In
              early 2026, Houston Methodist announced an enterprise-wide rollout across its ambulatory, emergency, and
