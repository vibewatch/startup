              boundaries: Ambience intentionally does not serve solo practitioners, provides no self-serve signup, and
              maintains opaque, sales-negotiated enterprise pricing. Independent research from Manhattan Venture
              Research projects full-year 2026 revenue between $51 million and $77 million, underscoring that Ambience
              trades at a demanding forward valuation multiple requiring sustained enterprise execution.
