  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Risk
      - What Would Change the View
    rows:
      - - Clinical Workflow Moat
        - Integrated platform spanning scribing, coding, and CDI across 200+ specialties creates high switching costs.
        - EHR-native ambient listening or lower-cost scribes reach good-enough clinical documentation parity.
        - Audited clinician churn rate and verified contract renewal rates across mature health systems.
      - - Revenue Expansion
        - >-
          Expansion from outpatient into high-acuity inpatient CDI, nursing, and revenue integrity expands ACV per
          system.
        - Hospital budget tightening and extended healthcare sales cycles delay cross-department rollouts.
        - Evidence of multi-year contract expansion and rising net revenue retention within top 10 health systems.
      - - Market Differentiation
        - Demonstrated ROI exceeding 3x and superior documentation accuracy in competitive head-to-head bake-offs.
        - Commoditization from foundation model progress reduces willingness to pay premium per-clinician SaaS fees.
        - Independent clinical accuracy benchmark and third-party error-rate evaluation against Nuance and Abridge.
      - - Financing & Capital Discipline
        - >-
          Substantial balance sheet with $302M-$348M total raised provides multi-year runway to navigate hospital sales
          cycles.
        - >-
          Capital-intensive growth model with heavy hiring requirements could trigger dilutive down-round if growth
          decelerates.
        - >-
          Demonstration of path to operating cash flow breakeven without requiring additional equity rounds at
          compressed multiples.
    notes: Diligence triggers reflect critical criteria necessary to upgrade recommendation from research-more to buy.
    claimRefs:
      - CV004
      - CV008
      - CV009
      - CV013
