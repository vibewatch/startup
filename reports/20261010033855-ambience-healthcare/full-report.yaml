          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI004
              - CI005
              - CI006
      - number: '4.2'
        title: GTM and delivery economics
        blocks:
          - type: paragraph
            body: >-
              The commercial motion is oriented toward enterprise health systems, where adoption and measurable
              financial outcomes can support renewals and module expansion. Ambience says its software is used in 80% of
              visits and claims that Ardent receives three dollars of operating margin for every dollar spent; these are
              useful customer-value signals but remain company-issued rather than independently audited unit economics.
              The same official surface describes hands-on pilot design, onboarding, full-service change management,
              24/7 support, and forward-deployed research and development. Those activities imply meaningful
              implementation and service-delivery effort, but the public record does not quantify labor,
              model-inference, hosting, compliance-audit, or support costs. CAC, payback, gross margin, and net revenue
              retention therefore remain open rather than estimable from the assigned sources.
            claimRefs:
              - CI005
              - CI006
              - CI014
              - CI015
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI013
              - CI014
      - number: '4.3'
        title: Traction and financing evidence
        blocks:
          - type: paragraph
            body: >-
              Revenue evidence is directional and internally inconsistent. Manhattan Venture Research projects 2026
              revenue of $51.1 million to $76.7 million; Silicon Valley Invest Club separately reproduces a $64.1
              million reported revenue figure attributed to GetLatka and warns that public figures are limited and
              conflicting. Neither item establishes audited GAAP revenue, ARR, or a recurring run-rate denominator.
              Financing records also diverge. The company announcement describes a $243 million Series C, while
              QuantLogix and Forge list a $210 million Series C and publish different total-funding figures. Funding
              raised cannot be treated as cash on hand: none of the assigned evidence provides unrestricted cash,
              current burn, runway, debt, or project-finance obligations.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI011
              - CI012
              - CI013
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Revenue quality could improve if multi-module adoption and performance-linked contracts turn documented
              customer value into durable expansion, but the public record cannot demonstrate that outcome. The
              strongest positive signals are broad workflow coverage, high company-reported utilization, and an
              outcome-oriented commercial structure. The main adverse case is that enterprise pricing is opaque,
              health-system buying is concentrated, and lower-cost or EHR-native alternatives may pressure renewal
              economics. Underwriting should therefore avoid converting the available market estimates into ARR or
              assuming that historical funding provides a specific runway. Investment-grade diligence requires
              contract-level realized pricing, revenue recognition policy, customer concentration, cohort retention,
              contribution margin, inference and service costs, audited cash, monthly burn, debt, and the operational
              trigger for another financing round.
            claimRefs:
              - CI004
              - CI009
              - CI010
              - CI013
              - CI014
              - CI015
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Funding is not runway
            body: >-
              Public financing totals conflict, and none of the assigned evidence discloses current cash, burn, debt, or
              runway. Capital adequacy must remain an open diligence item rather than a modeled duration.
            calloutType: risk
            claimRefs:
              - CI011
              - CI012
              - CI013
          - type: callout
            title: Underwrite from contracts, not market estimates
            body: >-
              Request audited revenue, contract-level realized pricing, cohort retention, customer concentration, and
              contribution margin before treating the analyst revenue range as a recurring-revenue base.
            calloutType: recommendation
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Clinical Workflow Architecture and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Ambience Healthcare operates as an ambient clinical intelligence layer designed to integrate directly
              where clinical care happens rather than running as an external scribing utility. The platform listens to
              multi-party clinical encounters across ambulatory, emergency, and inpatient settings, automatically
              generating structured, specialty-tailored documentation in real time. Rather than relying on simple
              speech-to-text transcription, Ambience connects every stage of the clinical encounter—from pre-visit
              longitudinal chart synthesis through live conversation documentation to post-visit coding and revenue
              integrity. Across all healthcare settings, health systems mandate that licensed clinicians review, edit,
              and approve all AI-generated notes before they are committed to the legal electronic health record. This
              operating model preserves clinical accountability while returning charting time to providers.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE005
              - CE008
              - CE009
              - CE010
              - CE014
      - number: '5.2'
        title: Product Line Segmentation and Module Capabilities
        blocks:
          - type: paragraph
            body: >-
              The Ambience product portfolio is segmented across the complete patient care journey, comprising
              pre-visit, in-visit, and post-visit functional modules. Pre-visit tools include the Conditions Advisor and
              Patient Summary, which synthesize historical chart data, problem lists, and outside hospital records to
              surface potentially missed diagnoses. During the encounter, the Ambient Scribe captures clinical dialogue
              using real-time multi-speaker attribution to separate clinician, patient, family, and interpreter speech,
              with on-the-fly multilingual translation. Post-visit modules deliver automated clinical documentation
              integrity and coding validation, featuring the HCC Compliance Validator, ICD-10 Code Assist, and ED
              Medical Decision Making generators. Recent 2026 product expansion brought the launch of Chart Chat for
              Nursing, Nursing Summary, and Ambient Flowsheet Documentation, extending intelligence across inpatient
              nursing shifts.
