      - number: '5.3'
        title: EHR Integration, Technical Infrastructure, and Reliability
        blocks:
          - type: paragraph
            body: >-
              Ambience achieves seamless clinical adoption by embedding natively into core electronic health record
              platforms, avoiding toggling or separate hardware screens. The platform connects via SMART on FHIR and
              Ambient APIs directly within Epic Hyperspace and Haiku, writes into Cerner Millennium via REST and FHIR
              endpoints, and connects via Athenahealth's Marketplace. Enterprise deployments average four weeks with
              reported clinician utilization rates of approximately 80%. Under the hood, Ambience is powered by OpenAI
              foundation models utilizing reinforcement fine-tuning grounded in BMJ Best Practice medical knowledge. The
              cloud infrastructure runs across AWS and GCP environments utilizing Docker containers, Apache Kafka event
              streaming pipelines, and PostgreSQL databases, supported by a 15-minute service level agreement and
              real-time adoption metrics via the Impact Analytics Dashboard.
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE012
              - CE013
          - type: table
            tableRef: TE003
