companyProfile:
  summary: >-
    Ambience Healthcare is a growth-stage enterprise AI platform founded in 2020 and headquartered in San Francisco that
    automates clinical documentation, coding, and revenue-integrity workflows for large health systems. The company
    targets complex ambulatory, emergency, and inpatient care settings rather than self-serve clinicians, selling
    negotiated multi-year enterprise contracts with pricing tied to documented workflow and ROI outcomes. Its July 2025
    Series C valued the business at roughly $1.24B-$1.30B, leaving the company in a private-disclosed growth profile
    with continued diligence focus on retention, safety, and expansion depth.
