  - id: FE001
    title: Product architecture map
    type: stack
    summary: Six-layer architectural stack from physical ambient audio capture to enterprise EHR integration and compliance.
    data:
      layers:
        - label: 1. Ambient Capture & Diarization
          detail: >-
            Edge audio streaming, noise suppression, and real-time speaker diarization separating clinician, patient,
            caregiver, and interpreter voices
        - label: 2. Clinical Context & Ingestion Engine
          detail: >-
            Bi-directional SMART on FHIR pipeline extracting historical notes, lab results, active medication lists, and
            outside hospital records
        - label: 3. Frontier AI & Reasoning Core
          detail: >-
            OpenAI reinforcement fine-tuned foundation models with specialty-tuned clinical prompts and BMJ Best
            Practice medical knowledge grounding
        - label: 4. Clinical Workflow & Documentation Engine
          detail: >-
            Automated SOAP drafting, ED MDM generation, Chart Chat for Nursing, and layperson patient instruction
            synthesis
        - label: 5. Revenue Integrity & CDI Layer
          detail: >-
            Real-time ICD-10 code suggestion, HCC Compliance Validator enforcing CMS/MEAT rules, and E/M level
            optimization
        - label: 6. EHR Embedding & Security Foundation
          detail: >-
            Deep integration via Epic Toolbox/Haiku, Athena MDP, and Cerner Millennium backed by HIPAA-compliant AWS
            infrastructure and SOC 2 Type II controls
