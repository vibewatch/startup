        title: Capitalization History, Valuation, and Stakeholder Composition
        blocks:
          - type: paragraph
            body: >-
              Ambience Healthcare has secured substantial venture capital backing across successive institutional
              financing rounds since its October 2020 seed inception. In July 2025, the company announced a $243 million
              Series C financing round co-led by growth equity firm Oak HC/FT and venture firm Andreessen Horowitz, with
              participation from the OpenAI Startup Fund, Kleiner Perkins, and Optum Ventures. New institutional
              participants included Frist Cressey Ventures, Town Hall Ventures, Smash Capital, Georgian, and Founders
              Circle Capital. The Series C round established a post-money valuation between $1.24 billion and $1.30
              billion, reflecting a 223 percent valuation step-up according to independent private market research.
              Cumulative equity financing raised is reported at $302.59 million by Forge Global, with broader
              third-party estimates ranging up to $370 million.
