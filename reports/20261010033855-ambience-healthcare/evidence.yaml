evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-governance
    missingEvidence: >-
      Detailed capitalization table breaking down founding equity versus institutional preferred share classes,
      liquidation preferences, and employee option pools.
    whyItMatters: >-
      Understanding dilution, liquidation preferences, and founder control structures is essential for assessing
      governance rights and downside protections in late-stage private equity diligence.
    diligencePath: >-
      Request certified capitalization table and latest amended certificate of incorporation during formal management
      diligence.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: audited-arr-and-burn
    missingEvidence: >-
      Audited GAAP financial statements or verified recurring revenue (ARR) figures and cash burn metrics for fiscal
      2025 and 2026.
    whyItMatters: >-
      External estimates for 2026 revenue span a wide range ($51M to $77M), and true net revenue retention cannot be
      independently verified from public disclosures alone.
    diligencePath: Review audited financial statements and quarterly cohort retention schedules under non-disclosure agreement.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Verified eligible provider seats, health-system and EHR coverage, module attach rates, current contract values,
      retention, and implementation capacity for a company-specific SAM and SOM.
    whyItMatters: >-
      Without these inputs, broad overlapping market forecasts cannot establish the revenue pool Ambience can
      practically serve or obtain.
    diligencePath: >-
      Obtain anonymized contract cohorts, provider-seat deployment data, module-level pricing, renewal and expansion
      metrics, and the qualified enterprise pipeline.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: company-capture
    missingEvidence: A reconciled basis for Manhattan Venture Research's two different 2031 Ambience revenue ranges.
    whyItMatters: >-
      The inconsistent lower endpoints change the implied growth path and demonstrate that the estimates are unsuitable
      as precise valuation inputs.
    diligencePath: >-
      Request the analyst model, source assumptions, and written reconciliation of the summary and detailed forecast
      ranges.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: independent-validation
    missingEvidence: >-
      Independent, current cohort data for utilization, ROI, coding accuracy, retention, and realized outcomes across
      representative deployments.
    whyItMatters: >-
      Company-issued outcome claims do not establish category-wide adoption, transferability, or durable customer
      economics.
    diligencePath: >-
      Obtain health-system-authored evaluations with denominators and measurement periods, renewal data, and third-party
      benchmark methodology.
    relatedQuestionRefs:
      - QM010
  - type: missing-source
    severity: material
    topic: competitive-win-rates
    missingEvidence: >-
      Audited head-to-head win/loss rate data between Ambience Healthcare, Nuance DAX, and Abridge across enterprise
      health system RFPs.
    whyItMatters: >-
      While vendor disclosures cite flagship selections at Cleveland Clinic and MultiCare, aggregate win rates and
      displacement velocity against DAX remain undisclosed.
    diligencePath: Request customer procurement benchmarking data and blinded win-loss telemetry from enterprise sales leadership.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: clinical-accuracy-validation
    missingEvidence: >-
      Peer-reviewed published accuracy and clinical safety studies indexed in PubMed or comparable medical journals
      evaluating AutoScribe documentation.
    whyItMatters: >-
      Competitors like Nuance DAX have published validation studies in JAMIA, whereas Ambience relies solely on
      vendor-reported outcomes and private audits.
    diligencePath: Audit IRB-approved clinical study results from academic health system partners such as UCSF or Cleveland Clinic.
    relatedQuestionRefs:
      - QP007
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Gross margin, inference and hosting costs, implementation labor, CAC, payback, retention, and customer
      concentration.
    whyItMatters: These inputs determine whether usage and customer ROI translate into durable, scalable company economics.
    diligencePath: >-
      Review audited cohort P&Ls, cloud and model invoices, implementation time sheets, and customer-level ARR
      retention.
    relatedQuestionRefs:
      - QI004
      - QI008
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Audited revenue with period, accounting basis, recurring component, and a reconciliation to any ARR or run-rate
      metric.
    whyItMatters: >-
      The available analyst estimate and aggregator figure cannot be treated as the same metric or used as a
      recurring-revenue base.
    diligencePath: Obtain audited financial statements and management's revenue-to-ARR reconciliation by product and customer.
    relatedQuestionRefs:
      - QI005
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Current unrestricted cash, monthly burn, runway, debt obligations, planned use of funds, and next-round trigger.
    whyItMatters: Historical funding raised does not establish cash available or the duration of the company's financing capacity.
    diligencePath: >-
      Review bank statements, monthly cash-flow statements, debt documents, board financing plans, and the operating
      budget.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: minor
    topic: financing
    missingEvidence: >-
      Primary financing documents reconciling the reported $243 million and $210 million Series C amounts and total
      funding.
    whyItMatters: >-
      The discrepancy prevents a reliable financing baseline and may reflect different transaction scopes or data
      errors.
    diligencePath: >-
      Inspect the executed financing documents, capitalization table, cash proceeds schedule, and any secondary
      component.
    relatedQuestionRefs:
      - QI006
  - type: missing-source
    severity: material
    topic: clinical-accuracy-benchmarks
    missingEvidence: >-
      Controlled, multi-center prospective trial data measuring error, omission, and fabrication rates of AI-generated
      notes compared to board-certified clinician gold standards across diverse specialties.
    whyItMatters: >-
      Without peer-reviewed, independent error-rate benchmarking, health system buyers must rely on vendor-reported
      accuracy metrics and accept residual clinical and medico-legal liability.
    diligencePath: >-
      Request blinded internal audit reports and quality assurance data from existing large-scale health system
      deployments (e.g., Cleveland Clinic or Houston Methodist).
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE002
  - type: enumeration-incomplete
    severity: material
    topic: Private enterprise customer roster and revenue concentration
    missingEvidence: Complete customer roster detailing ARR contributions by account to determine top-customer revenue concentration.
    whyItMatters: >-
      Concentration in a few large systems like Cleveland Clinic and Ardent Health could expose Ambience to severe
      revenue shock if a marquee customer churns or re-evaluates.
    diligencePath: Request customer-level ARR schedule and top-10 customer concentration percentages during management diligence.
    relatedQuestionRefs:
      - QU005
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: Standardized outcome measurement and dollar-weighted net revenue retention
    missingEvidence: >-
      Audited financial disclosure of dollar-weighted net revenue retention (NRR) and contract-level churn rates across
      mature enterprise health system cohorts.
    whyItMatters: >-
      Reported logo renewal rates of 88%–96% mask whether expanding seat counts offset any account-level downsells or
      pilot rollbacks as health systems face budget constraints.
    diligencePath: Obtain historical cohort revenue schedules and dollar-based NRR breakdown from management during diligence.
  - type: missing-source
    severity: material
    topic: litigation-and-regulatory-enforcement
    missingEvidence: >-
      Direct confirmation from primary state licensing boards, PACER federal court docket searches, and HHS OCR
      enforcement records confirming the absence of unpublicized disputes or HIPAA compliance inquiries.
    whyItMatters: >-
      Public web searches show no active litigation or regulatory enforcement, but private settlements, preliminary
      inquiries, or pending state investigations would materially affect risk evaluation.
    diligencePath: >-
      Request litigation disclosure schedule, PACER search run, and HHS OCR compliance history directly from Ambience
      counsel.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-metrics
    missingEvidence: Exact ARR percentage contribution of top 3 health system customers and contract termination clauses.
    whyItMatters: >-
      High reliance on large health systems like Houston Methodist and Cleveland Clinic creates revenue vulnerability if
      a marquee customer pauses deployment or transitions to native EHR tools.
    diligencePath: Review customer revenue concentration schedule and renewal covenants under NDA during confirmatory diligence.
    relatedQuestionRefs:
      - QR003
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: nrr-expansion-retention
    missingEvidence: >-
      Audited health system cohort net revenue retention (NRR) and clinician seat expansion metrics across multi-year
      contracts.
    whyItMatters: >-
      Validating whether early multi-site rollouts expand beyond initial emergency/ambulatory departments into
      enterprise-wide deployments is critical to justifying forward revenue multiples exceeding 16x.
    diligencePath: Request customer cohort retention and expansion schedules directly under NDA during confirmatory due diligence.
  - type: conflicting-data
    severity: minor
    topic: revenue-growth-runrate
    missingEvidence: Reconciled fiscal year 2025 actual ARR and recognized revenue accounting statements.
    whyItMatters: >-
      Third-party estimates for 2025 revenue vary widely from $30 million to $64.1 million, affecting the baseline
      trajectory required to meet 2026 revenue targets.
    diligencePath: Inspect audited GAAP financial statements and current ARR billing records from company management.
