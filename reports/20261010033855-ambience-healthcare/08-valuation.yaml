        - "Capital-intensive growth model with heavy hiring requirements could trigger dilutive down-round if growth decelerates."
        - "Demonstration of path to operating cash flow breakeven without requiring additional equity rounds at compressed multiples."
    notes: "Diligence triggers reflect critical criteria necessary to upgrade recommendation from research-more to buy."
