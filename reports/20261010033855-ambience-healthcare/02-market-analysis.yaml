callouts:
  - calloutType: insight
    title: Outcome-Based Contracts Change the Proof Burden
    body: Performance incentive-based contracts can align Ambience with health-system financial outcomes, but they require agreed baselines, attribution rules, measurement periods, and auditable definitions of realized benefit. The structure is therefore both a commercialization lever and a diligence question rather than independent proof of ROI.
    claimRefs:
      - CM006
      - CM013
  - calloutType: risk
    title: Exact SAM and SOM Are Not Yet Supportable
    body: The available forecasts describe overlapping healthcare-AI, transcription, and CDI categories, while custom pricing and module packaging remain undisclosed. A defensible company-specific market model requires eligible provider seats, health-system and EHR coverage, attach rates, contract values, retention, implementation capacity, and independently verified revenue.
    claimRefs:
      - CM007
      - CM009
      - CM010
      - CM011
