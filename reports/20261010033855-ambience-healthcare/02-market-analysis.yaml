        - Specialty configuration, trust, and workflow change
      - - Inpatient and emergency documentation
        - Hospital clinical leadership and CMIO
        - Hospitalists, emergency clinicians, and nurses
        - Hospital operations and IT
        - One platform across settings and the hospital stay
        - Complex integration and higher-acuity review requirements
      - - Revenue integrity and CDI
        - CFO or revenue-cycle executive
        - Clinicians, CDI teams, and coders
