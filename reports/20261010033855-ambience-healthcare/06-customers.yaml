callouts:
  - calloutType: "strength"
    title: "Enterprise-Wide Health System Embed as a Competitive Moat"
    body: "Ambience Healthcare has differentiated itself from commodity ambient scribe point-solutions by securing five-year, multi-thousand-clinician enterprise contracts at institutions like Cleveland Clinic. By integrating documentation with inpatient clinical documentation integrity (CDI) and AAPC-verified coding compliance directly inside Epic and Cerner workflows, Ambience establishes deep institutional switching costs that deter replacement by basic transcription tools."
    claimRefs:
      - "CU004"
      - "CU005"
      - "CU008"
  - calloutType: "risk"
    title: "Thin Health System Margins and Outcome Accountability Friction"
    body: "Health systems operate on tight operating margins and face acute budget constraints, creating procurement friction for emerging AI software platforms. While The Ambience Standard mitigates buyer risk by tying commercial fees to measurable clinical and financial outcomes, it introduces operational complexity in metric standardization, baseline establishment, and contractual attribution across disparate hospital environments."
    claimRefs:
      - "CU010"
      - "CU011"
