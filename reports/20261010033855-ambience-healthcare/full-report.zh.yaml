      - number: '4.3'
        title: 业务牵引与融资证据
        blocks:
          - type: paragraph
            body: >-
              收入证据只有方向性，且内部不一致。Manhattan Venture Research 预计 2026 年收入为 $51.1 million-$76.7 million；Silicon Valley Invest
              Club 另行复述 GetLatka 归属的 $64.1 million 报告收入，并警告公开数字有限且相互冲突。两者都不能证明经过审计的 GAAP 收入、ARR
              或经常性收入运行率分母。融资记录也不一致：公司公告称 C 轮为 $243 million，而 QuantLogix 和 Forge 列出 $210 million C
              轮，并给出不同累计融资额。已融资金额不能视为手头现金：分配的证据没有提供无限制现金、当前烧钱、现金跑道、债务或项目融资义务。
            claimRefs:
