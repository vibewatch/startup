companyProfile:
  summary: >-
    Ambience Healthcare 是一家成长阶段的企业级 AI 平台，成立于 2020
    年，总部位于旧金山，为大型医疗系统自动化处理临床文档、编码和收入完整性流程。公司面向复杂的门诊、急诊和住院场景，而非自助式临床医生；它销售协商定价的多年期企业合同，价格与已记录的工作流和 ROI 结果挂钩。2025 年 7 月的 C
    轮融资将公司估值推至约 $1.24B-$1.30B，当前仍是私有、披露有限的成长型公司，尽调重点继续落在留存、安全和扩张深度上。
