      - number: '1.2'
        title: 创始人、高管领导层与治理演变
        blocks:
          - type: paragraph
            body: >-
              公司由 Mike Ng 和 Nikhil Buduma 共同创立，二人建立了将临床产品战略与机器学习研究结合的双核心领导结构。2025 年 9 月，Ambience 进行重大高管调整：联合创始人、前首席科学家
              Nikhil Buduma 出任 CEO，创始 CEO Mike Ng 则全职担任总裁兼董事会主席。这次重组也说明 Ambience
              对深层模型推理、纵向病历理解和复杂住院临床智能的更高重视。为加快企业商业化，公司于 2026 年 2 月任命资深医疗高管 Mike Valli，兼任首席营收官和首席价值官，把合同经济性直接对齐到经验证的医疗系统
              ROI 框架。
