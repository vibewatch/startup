  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创立与核心架构
        blocks:
          - type: paragraph
            body: >-
              Ambience Healthcare 于 2020 年由 Mike Ng 和 Nikhil Buduma
              创立，总部位于加州旧金山。公司搭建了企业级人工智能运营平台，专为复杂医疗系统设计，而非单人诊所或门诊机构。不同于只转录门诊对话的单功能环境记录工具，Ambience
              将临床文档、医疗编码和收入完整性直接串联到电子病历环境中。其技术覆盖逾 100 个医学专科，持续服务于门诊、急诊和急性住院场景。通过原生接入 Epic、Oracle Cerner 等主流 EHR
              系统，Ambience 试图减轻临床医生沉重的行政负担，同时在诊疗现场守住医院收入完整性和文档合规。
            claimRefs:
              - CO001
              - CO002
              - CO008
              - CO015
