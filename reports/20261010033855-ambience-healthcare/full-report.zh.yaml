      - number: '1.3'
        title: 资本化历史、估值与利益相关方构成
        blocks:
          - type: paragraph
            body: >-
              自 2020 年 10 月种子轮以来，Ambience Healthcare 在多轮机构融资中获得了大量风险资本支持。2025 年 7 月，公司宣布完成 $243 million C 轮融资，由成长型股权基金
              Oak HC/FT 与风险投资机构 Andreessen Horowitz 共同领投，OpenAI Startup Fund、Kleiner Perkins 和 Optum Ventures
              参投。新机构投资者包括 Frist Cressey Ventures、Town Hall Ventures、Smash Capital、Georgian 和 Founders Circle
              Capital。根据独立私募市场研究，C 轮将投后估值推至 $1.24 billion-$1.30 billion，较前轮上涨 223%。Forge Global 披露累计股权融资为 $302.59
              million，其他第三方估计最高达 $370 million。
