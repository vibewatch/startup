      - number: '4.4'
        title: 财务结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              如果多模块采用和结果挂钩的合同能把已记录的客户价值转化为持续扩张，收入质量可能改善，但公开记录无法证明这一结果。最强的正面信号是工作流覆盖广、公司报告的使用率高，以及结果导向的商业结构。主要负面情形是企业价格不透明、医疗系统采购集中，低成本或
              EHR 原生替代品可能挤压续约经济性。因此，投资判断不应把可得市场估计换算成
              ARR，也不应假设历史融资等于某个确定的现金跑道。达到投资级尽调仍需合同层面的实际价格、收入确认政策、客户集中度、队列留存、贡献利润、推理和服务成本、经审计现金、月度烧钱、债务，以及下一轮融资的运营触发条件。
            claimRefs:
              - CI004
              - CI009
              - CI010
              - CI013
              - CI014
              - CI015
