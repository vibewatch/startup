        - 昂贵
        - $1.24B-$1.3B 的 C 轮估值对应私营医疗 AI 公司的前十位倍数
        - 若公开市场 AI 倍数压缩加速，下行保护有限。
    notes: 评估采用 C 轮私募融资记录和 Manhattan Venture Research 远期收入预测的中点估算。
    claimRefs:
      - CV001
      - CV006
      - CV014
  - id: TV002
    title: 正论点 / 反论点表
    columns:
      - 支柱
      - 正论点
      - 反论点风险
      - 哪些情况会改变判断
    rows:
      - - 临床流程护城河
        - 覆盖 200 多个专科、贯通记录、编码和 CDI 的一体化平台，形成高转换成本。
        - 原生于 EHR 的环境式聆听工具或更便宜的记录工具，只要临床记录质量足够好。
        - 经审计的临床医生流失率，以及成熟医疗系统中经核实的合同续约率。
      - - 收入扩张
        - 从门诊扩展到高急重症住院 CDI、护理和收入完整性，提高每个系统的 ACV。
        - 医院预算收紧、医疗销售周期拉长，跨部门部署延迟。
        - 前十大医疗系统中多年合同扩展及净收入留存率上升的证据。
      - - 市场差异化
        - 竞争性正面评测中，已展示超过 3 倍的 ROI 和更高的记录准确率。
        - 基础模型进步带来商品化，降低客户为每名临床医生支付 SaaS 溢价的意愿。
        - 针对 Nuance 和 Abridge 的独立临床准确性基准及第三方错误率评估。
      - - 融资与资本纪律
        - 累计融资 $302M-$348M，充足的资产负债表为公司穿越医院销售周期提供多年资金续航。
        - 资本密集型增长模式需要大量招聘，若增长放缓，可能触发稀释性下轮融资。
        - 证明无需在倍数被压低时追加股权融资，也能实现经营现金流盈亏平衡。
    notes: 尽调触发条件反映将建议从继续研究升级为买入所需的关键标准。
    claimRefs:
      - CV004
      - CV008
      - CV009
      - CV013
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 收入预测
      - 假设倍数
      - 隐含估值
      - 概率信号
      - 下行 / 上行触发因素
    rows:
      - - 乐观情景
        - $77M (2026E) / $434M (2031E)
        - 远期收入倍数 20.0x
        - $1.54B (2026E) / $8.68B (2031E)
        - 25%
        - 医疗系统快速实现全企业部署，护理采用迅速，住院 CDI 收入扩大。
      - - 基准情景
        - $64M (2026E) / $353M (2031E)
        - 远期收入倍数 15.0x
        - $960M (2026E) / $5.29B (2031E)
        - 50%
        - 尽管竞争压力存在，企业仍稳步扩张，ACV 年增长温和，续约率保持稳定。
      - - 悲观情景
        - $40M (2026E) / $160M (2031E)
        - 远期收入倍数 8.0x
        - $320M (2026E) / $1.28B (2031E)
        - 25%
        - 医疗系统冻结预算，客户流失至捆绑式 EHR 模块，倍数严重收缩。
    notes: 收入预测和倍数基准源自 Manhattan Venture Research 模型；远期估值数据为估算值，受执行风险影响。
    claimRefs:
      - CV005
      - CV010
      - CV011
