  - id: FE001
    title: 产品架构图
    type: stack
    summary: 从物理环境式音频采集到企业 EHR 集成与合规的六层架构栈。
    data:
      layers:
        - label: 1. 环境式采集与说话人分离
          detail: 边缘音频流、降噪和实时说话人分离，将临床医生、患者、照护者和口译员的声音区分开
        - label: 2. 临床上下文与摄取引擎
          detail: 双向 SMART on FHIR 管道提取历史记录、实验室结果、当前用药清单和外院病历
        - label: 3. 前沿 AI 与推理核心
          detail: OpenAI 强化微调基础模型，配合专科调优的临床提示词，并以 BMJ Best Practice 医学知识作支撑
        - label: 4. 临床流程与记录引擎
          detail: 自动起草 SOAP、生成 ED MDM、为护理提供 Chart Chat，并综合生成面向普通人的患者指导
        - label: 5. 收入完整性与 CDI 层
          detail: 实时建议 ICD-10 编码，利用 HCC 合规验证器执行 CMS/MEAT 规则，并优化 E/M 级别
        - label: 6. EHR 嵌入与安全基础
          detail: 通过 Epic Toolbox/Haiku、Athena MDP 和 Cerner Millennium 深度集成，底层依托符合 HIPAA 的 AWS 基础设施和 SOC 2 Type II 控制
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE006
      - CE009
      - CE011
