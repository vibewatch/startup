      - number: '3.4'
        title: 转换成本、护城河持久性与替代威胁
        blocks:
          - type: paragraph
            body: >-
              Ambience Healthcare 的防御力来自对核心 EHR 系统的深度双向嵌入，包括 Epic Hyperspace、Haiku，以及写回 Oracle Health Cerner 的直接 API。替换
              Ambience 需要重做跨多个临床部门的复杂文档、排班同步和编码工作流，因此这些集成抬高了转换成本。不过，平台也面临明显结构性逆风。截至 2026 年 5 月的独立评估显示，Ambience 没有任何被
              PubMed 收录的同行评审临床验证研究，这相比 Nuance DAX 在 JAMIA 等期刊记录的准确率表现并不利。随着基础语言模型进步、主要 EHR 厂商开发原生环境文档工具，如果 EHR
              原生方案能以更低增量成本达到可接受的临床表现，Ambience 始终面临被商品化的威胁。
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
