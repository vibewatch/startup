company:
  name: "Ambience Healthcare"
chapter:
  number: 4
  title: "Financials"
  summary: "Public evidence supports an enterprise, multi-product revenue model with negotiated pricing and a new performance-linked contract structure, but it does not disclose realized pricing, audited revenue, gross margin, retention, burn, or runway. Third-party revenue and financing figures conflict, so the financial case remains a diligence thesis rather than an underwritable operating model."
sections:
  - id: "revenue-model-and-pricing"
    title: "Revenue model and pricing"
    body: >-
      Ambience appears to monetize an enterprise clinical-workflow platform rather
      than a stand-alone transcription utility. Its product surface spans
      pre-visit context, ambient documentation, coding, compliance, and post-visit
      workflows, creating several plausible expansion paths inside one health
      system. The company also announced performance-incentive contracts that tie
      compensation to measurable outcomes, adding a variable component to the
      conventional enterprise software model. No company-issued price list was
      found in the assigned evidence. A competitor-authored review says contracts
      are negotiated by system size, user count, and integration scope, and reports
      a $300 to $500-plus monthly price per provider. That range is an adverse
      market signal, not verified list or realized pricing, and must not be used as
      reported revenue.
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "gtm-and-delivery-economics"
    title: "GTM and delivery economics"
    body: >-
      The commercial motion is oriented toward enterprise health systems, where
      adoption and measurable financial outcomes can support renewals and module
      expansion. Ambience says its software is used in 80% of visits and claims
      that Ardent receives three dollars of operating margin for every dollar
      spent; these are useful customer-value signals but remain company-issued
      rather than independently audited unit economics. The same official surface
      describes hands-on pilot design, onboarding, full-service change management,
      24/7 support, and forward-deployed research and development. Those activities
      imply meaningful implementation and service-delivery effort, but the public
      record does not quantify labor, model-inference, hosting, compliance-audit,
      or support costs. CAC, payback, gross margin, and net revenue retention
      therefore remain open rather than estimable from the assigned sources.
    claimRefs:
      - "CI005"
      - "CI006"
      - "CI014"
      - "CI015"
      - "CI016"
    tableRefs:
      - "TI003"
  - id: "traction-and-financing-evidence"
    title: "Traction and financing evidence"
    body: >-
      Revenue evidence is directional and internally inconsistent. Manhattan
      Venture Research projects 2026 revenue of $51.1 million to $76.7 million;
      Silicon Valley Invest Club separately reproduces a $64.1 million reported
      revenue figure attributed to GetLatka and warns that public figures are
      limited and conflicting. Neither item establishes audited GAAP revenue, ARR,
      or a recurring run-rate denominator. Financing records also diverge. The
      company announcement describes a $243 million Series C, while QuantLogix and
      Forge list a $210 million Series C and publish different total-funding
      figures. Funding raised cannot be treated as cash on hand: none of the
      assigned evidence provides unrestricted cash, current burn, runway, debt,
      or project-finance obligations.
    claimRefs:
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI011"
      - "CI012"
      - "CI013"
  - id: "financial-verdict"
    title: "Financial verdict and diligence blockers"
    body: >-
      Revenue quality could improve if multi-module adoption and performance-linked
      contracts turn documented customer value into durable expansion, but the
      public record cannot demonstrate that outcome. The strongest positive
      signals are broad workflow coverage, high company-reported utilization, and
      an outcome-oriented commercial structure. The main adverse case is that
      enterprise pricing is opaque, health-system buying is concentrated, and
      lower-cost or EHR-native alternatives may pressure renewal economics.
      Underwriting should therefore avoid converting the available market estimates
      into ARR or assuming that historical funding provides a specific runway.
      Investment-grade diligence requires contract-level realized pricing, revenue
      recognition policy, customer concentration, cohort retention, contribution
      margin, inference and service costs, audited cash, monthly burn, debt, and
      the operational trigger for another financing round.
    claimRefs:
      - "CI004"
      - "CI009"
      - "CI010"
      - "CI013"
      - "CI014"
      - "CI015"
