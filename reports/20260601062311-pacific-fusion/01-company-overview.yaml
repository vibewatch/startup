callouts:
  - calloutType: strength
    title: "Industry-Leading Milestone-Based Financing Structure"
    body: >-
      The full commitment of $900M upfront with milestone-gated disbursement eliminates sequential
      fundraising risk and lets the technical team focus on execution milestones rather than
      investor relations. Phase I milestones were completed approximately seven months ahead of
      schedule (November 2024 vs. June 2025), demonstrating early execution credibility under this
      model and unlocking the next capital tranche.
    claimRefs: [CO005, CO007, CO026]
  - calloutType: risk
    title: "High Key-Person Concentration in Three Co-Founders"
    body: >-
      Eric Lander (CEO), Will Regan (President), and Keith LeChien (CTO) collectively represent
      the company's external credibility, milestone accountability structure, and core technical
      architecture. The loss of any of these three individuals could materially impair investor
      confidence, the milestone disbursement mechanism, or the technical program. Succession
      planning and bench depth below founder level are not publicly disclosed.
    claimRefs: [CO008, CO009, CO010]
  - calloutType: risk
    title: "Pre-Revenue with Multi-Decade Horizon to Commercial Product"
    body: >-
      Pacific Fusion has no publicly disclosed revenue, commercial customers, offtake agreements,
      or power purchase agreements. The pathway to commercial revenue requires achieving net
      facility gain by 2030, then developing and deploying a first commercial system by the
      mid-2030s — a 9–12 year horizon from founding. The milestone-based $900M structure reduces
      sequential funding risk but does not eliminate the possibility of tranche renegotiation if
