company:
  name: Pacific Fusion
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Pacific Fusion emerged from stealth in October 2024 with over $900 million in Series A funding
    led by General Catalyst — one of the largest fusion startup rounds on record — and a founding
    team combining big-science leadership (Eric Lander), energy-program execution (Will Regan),
    and pulsed-power engineering (Keith LeChien). The company is pursuing pulsed magnetic
    inertial confinement fusion with a modular impedance-matched Marx generator architecture,
    targeting net facility gain at its planned Albuquerque, New Mexico Demonstration System by
    2030 and the first U.S. commercial fusion system by the mid-2030s.
sections:
  - id: identity-and-mission
    title: Identity and Mission
    body: >-
      Pacific Fusion is a private U.S. fusion energy company founded in the summer of 2023 with
      the stated mission to "power the world with abundant, affordable, clean energy." It is
      headquartered in the San Francisco Bay Area and operates a network of California R&D
      campuses plus a planned Research and Manufacturing Campus in Albuquerque, New Mexico. The
      company classifies itself as pre-revenue and pre-commercial, working toward commercial
      fusion power on a decade-plus horizon.

      The company's near-term milestone is net facility gain — more fusion energy output than all
      stored energy input — by 2030, to be achieved with a purpose-built Demonstration System at
      the New Mexico campus. Its commercial product concept is a mass-manufacturable pulsed-power
      fusion system targeting delivery of the first U.S. commercial fusion system by the
      mid-2030s. Pacific Fusion's technical claims position its Demonstration System at 100-fold
      higher facility gain and 10-fold lower cost than the National Ignition Facility (NIF) at
      Lawrence Livermore National Laboratory — a claimed 1,000-fold leap in practical fusion
      performance.

      Pacific Fusion's founding in 2023 was directly catalyzed by two landmark scientific
      milestones: NIF's achievement of fusion ignition in December 2022, and the Sandia National
      Laboratories Z Machine's demonstration of the highest pulsed-magnetic fusion performance
      ever recorded. The company explicitly frames itself as the commercial vehicle for
      commercializing 50 years of U.S. national-laboratory investment in inertial confinement
      fusion and pulsed-power engineering.
    claimRefs: [CO001, CO002, CO003, CO004, CO018, CO019, CO020, CO034]
    tableRefs: [TO001]
    figureRefs: [FO002]
  - id: leadership-and-governance
    title: Leadership and Governance
    body: >-
      Pacific Fusion was co-founded by five individuals whose complementary expertise spans
      big-science program leadership, energy policy, pulsed-power engineering, deep-tech
      operations, and computational physics. Eric Lander, CEO and co-founder, is best known for
      co-leading the international Human Genome Project and served as Director of the White House
      Office of Science and Technology Policy and Presidential Science Advisor under President
      Biden. His public credibility and ability to attract institutional capital and government
      partnerships are central to the company's external positioning.

      Will Regan, President and co-founder, brings program management experience from ARPA-E
      (where he developed the Accelerating Low-Cost Plasma Heating and Assembly, or ALPHA,
      program) and Alphabet X (where he founded the Mineral agriculture-technology project).
      Keith LeChien, CTO and co-founder, was LLNL's lead for pulsed magnetic fusion and
      Director of Inertial Confinement Fusion at the National Nuclear Security Administration
      (NNSA). He is also a co-inventor of the impedance-matched Marx generator (IMG), the core
      technology underlying the company's pulser architecture.

      Carrie von Muench (COO and co-founder) and Leland Ellison (co-founder, Head of Simulation
      and Modelling, formerly a computational physicist at LLNL) complete the founding team.
      Senior technical hires include Nathan Meezan (Head of Target Design, 20+ years at LLNL
      on NIF target teams), Alex Zylstra (Head of Experiments, the principal NIF experimentalist
      who achieved ignition), and Sachin Desai (General Counsel, formerly at Helion). Governance
      includes three investor board seats: Hemant Taneja (General Catalyst), Eric Schmidt (former
      Google CEO), and Patrick Collison (Stripe co-founder). No independent board directors,
      scientific advisory board, or compensation structure have been publicly disclosed.
    claimRefs: [CO008, CO009, CO010, CO011, CO012, CO013, CO027, CO038]
    tableRefs: [TO002]
    figureRefs: [FO003]
  - id: funding-and-capital-structure
    title: Funding and Capital Structure
    body: >-
      Pacific Fusion announced its emergence from stealth on October 25, 2024 with a Series A
      of more than $900 million — one of the largest Series A rounds ever raised by a fusion
      energy company and among the largest deep-tech Series A rounds globally. The round was led
      by General Catalyst, with a syndicate including Breakthrough Energy Ventures, several
      prominent tech and finance individuals (Eric Schmidt, Patrick Collison, John Doerr, Ken
      Griffin, Mustafa Suleyman, Lachy Groom, Elad Gil, Richard Merkin, Reid Hoffman, Andrew
      Forrest), and institutional funds (Leitmotif, Lightspeed, Lowercarbon Capital, Trousdale
      Ventures, and others).

      The capital structure is distinctive: the full $900M was committed upfront but is disbursed
      in tranches as Pacific Fusion achieves predefined technical milestones. Will Regan (in a
      TechCrunch exclusive, April 2025) confirmed the company was "several months ahead of
      schedule," citing Phase I milestone completion in November 2024 — approximately seven
      months ahead of the original June 2025 target. Credit for the tranche model goes to
      investors at General Catalyst, CEO Eric Lander, and COO Carrie von Muench, all of whom
      were familiar with milestone-based financing from biotech.

      The approach is designed to mitigate fundraising distraction and maintain accountability.
      However, industry observers have noted the committed-but-unvested capital is effectively
      contingent, and the headline $900M figure may overstate what is unconditionally available
      to the company. Pacific Fusion has not disclosed a post-money valuation, consistent with
      pre-commercial deep-tech rounds of this structure.
    claimRefs: [CO005, CO006, CO007, CO026, CO028, CO036, CO037]
    tableRefs: [TO003]
  - id: footprint-and-operations
    title: Footprint and Operations
    body: >-
      Pacific Fusion operates a geographically distributed but strategically cohesive
      multi-site footprint. Its California R&D network — described as the company headquarters
      cluster — comprises three facilities: the Fremont Headquarters and Test Center (where
      first-of-a-kind fusion system components are built, tested, and optimized), the San Leandro
      Build Center (a 135,000-square-foot Manufacturing R&D facility ramping pulser module
      production), and the Livermore Collaboratory (focused on plasma simulation, target design,
      and proximity to LLNL). The California team grew by approximately three-fold over the year
      following the October 2024 launch, reaching over 110 employees in that state.

      For its Demonstration System, Pacific Fusion selected Albuquerque, New Mexico after a
      competitive site process that also included Livermore, California. The city of Albuquerque
      offered $776 million in Industrial Revenue Bonds providing a 20-year property tax abatement.
      The New Mexico Research and Manufacturing Campus, sited at Mesa del Sol adjacent to Sandia
      National Laboratories, will host the Demonstration System. A companion Build Center in Los
      Lunas, New Mexico, will manufacture system components. The total campus investment is
      described as approximately $1 billion, creating 200 permanent jobs and hundreds of
      construction roles.

      The distribution reflects deliberate logic: Bay Area campuses draw on Silicon Valley talent
      and capital networks; the Livermore Collaboratory leverages LLNL proximity; the New Mexico
      footprint benefits from adjacency to the Z Machine (Pacific Fusion's primary experimental
      platform) and favorable state incentives for large capital projects.
    claimRefs: [CO014, CO015, CO016, CO017, CO029]
  - id: technology-approach
    title: Technology Approach
    body: >-
      Pacific Fusion pursues pulsed magnetic inertial confinement fusion (ICF), a distinct path
      from laser-based ICF (as at NIF) and from magnetic confinement approaches (tokamaks,
      stellarators). The system compresses small deuterium-tritium fuel targets using fast-rising,
      high-current electrical pulses that generate a magnetic field squeezing and heating the
      fuel to fusion conditions in approximately 100 nanoseconds per shot. The process is
      designed to be repeatable — like a piston engine — enabling continuous power generation.

      The core engineering unit is the impedance-matched Marx generator (IMG), or pulser module,
      co-invented by Keith LeChien and first publicly demonstrated by LLNL in 2022. Each module
      has 32 stages, each comprising 10 bricks (a switch and two capacitors). The full
      Demonstration System will use approximately 156 such modules, together producing
      approximately 2 terawatts for 100 nanoseconds — roughly four times the average power of
      the U.S. electrical grid. The modular architecture supports mass manufacturing and
      "carbon copy" replication once a single module prototype is validated.

      A critical experimental result was published in February 2026: four shots at Sandia's
      Z Machine at 22 million amps and 120 nanoseconds validated a simplified plastic-and-aluminum
      target design that allows magnetic field diffusion into the target, eliminating the need for
      large, expensive external magnetic coils previously required in MagLIF-style approaches.
      The company characterized this as "dramatically simplifying the entire target-chamber
      architecture," enabling economically viable fusion power at scale.

      Pacific Fusion holds formal Cooperative Research and Development Agreements (CRADAs) with
      both Sandia National Laboratories and Lawrence Livermore National Laboratory. The LLNL
      CRADA, signed January 28, 2025, enables collaboration on NIF ignition physics and
      simulation validation. Target simulation work is additionally conducted with the Flash
      Center at the University of Rochester.
    claimRefs: [CO004, CO021, CO022, CO023, CO024, CO025, CO030, CO033]
  - id: milestones-and-progress
    title: Milestones and Progress
    body: >-
      Pacific Fusion has assembled a notable milestone record in fewer than three years since
      founding. The company completed Phase I milestones by November 2024 — roughly seven months
      ahead of the original June 2025 schedule — unlocking the next tranche of its Series A and
      enabling work to begin on a complete pulser module (IMG). Will Regan confirmed in a
      TechCrunch exclusive (April 2025) that the company had developed the necessary simulation
      models and built completed prototypes of bricks and stages, positioning it to "carbon copy"
      the full 156-module system once the complete module is validated.

      The company's Sandia CRADA yielded independently published experimental results in February
      2026, marking the first third-party corroboration of Pacific Fusion's simplified target
      concepts by a national laboratory partner. The LLNL CRADA established in January 2025
      extends access to NIF ignition physics and simulation validation tools.

      On the policy front, the DOE Fusion Science and Technology Roadmap (released October 2025)
      identified commercial fusion by the mid-2030s as a national strategic objective, aligned
      with Pacific Fusion's own timeline. The ADVANCE Act (July 2024) had already established a
      lighter regulatory framework for fusion under byproduct-material rules rather than fission
      reactor rules, reducing regulatory risk for near-term deployment. No adverse events,
      executive departures, lawsuits, or regulatory enforcement actions involving Pacific Fusion
      have been publicly disclosed as of the chapter run date.
    claimRefs: [CO026, CO031, CO032, CO035, CO038, CO039]
