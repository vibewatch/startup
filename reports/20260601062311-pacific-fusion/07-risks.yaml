  - - Shot economics
    - No credible path to affordable repeatable shots
    - Management cannot provide target-cost and cadence model
    - Treat commercialization case as science project, not energy asset
  - - Regulatory path
    - State / NRC path proves slower or more burdensome than assumed
    - Material change in licensing basis, waste path, or environmental burden
    - Increase risk discount and extend commercialization timeline
  - - Customer conversion
