chapter:
  number: 7
  title: Risks
  summary: 'Pacific Fusion''s risk profile is still dominated by first-of-a-kind technical execution: the company has credible component and simulation progress, but no public proof yet of a full pulser module, plant-duty-cycle reliability, or bankable commercial plant economics. Regulation is more favorable than for fission, but not risk-free—developers still bear the burden of building a safety case, handling tritium and activation products, navigating Agreement State variability, and absorbing deeper environmental scrutiny as facilities scale. Capital, people, and partner dependencies are also material: the $900M milestone-based round buys time, yet schedule slippage, module underperformance, or loss of early anchor users would quickly transmit into financing and valuation pressure.'
sections:
- id: regulatory-and-legal-risk
  title: Regulatory and legal risk
  body: 'Pacific Fusion benefits from a friendlier U.S. regulatory direction than a fission developer would face, but the framework is still evolving and it does not eliminate first-of-a-kind licensing risk. The core shift—already codified by the ADVANCE Act and elaborated by NRC rulemaking—is that fusion machines are being regulated under the byproduct-material framework rather than under fission-reactor rules. That lowers barriers, but it also means Pacific will need to carry a performance-based safety case around tritium control, radioactive material accounting, emergency procedures, waste handling, and decommissioning. Several legal analyses emphasize that the proposed rule gives flexibility while simultaneously shifting analytical burden to the developer.


    A second risk is regulatory variability. NRC commentary and law-firm analysis both point out that many early fusion facilities are likely to be licensed by Agreement States rather than directly by the NRC. That may create faster local pathways in supportive jurisdictions, but it also introduces uneven capability and process risk. A company building a billion-dollar demonstration campus cannot treat state-level licensing execution as an administrative detail. Pacific Fusion''s New Mexico build-out therefore faces not just a federal policy question, but a state-program readiness question tied to local politics, permitting, and environmental review.


    Finally, the framework remains incomplete in practice. The NRC proposed rulemaking and associated guidance point to open questions on tritium thresholds, waste disposal pathways for fusion-specific activation products, export-control boundaries, and the scale at which environmental review deepens. That makes Pacific''s legal/regulatory risk lower than a fission startup''s, but still materially above the level most generalist venture investors probably assume when they hear “lighter regulation.”'
