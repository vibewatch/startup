evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Post-money or current implied valuation of Pacific Fusion
    whyItMatters: >-
      Without a valuation, diligence cannot assess investor return expectations, price-to-milestones ratio, or dilution
      trajectory
    diligencePath: >-
      Request cap table and Series A term sheet from management; compare to contemporaneous fusion-company round
      valuations
    relatedQuestionRefs:
      - QO003
      - QO011
  - type: private-evidence-only
    severity: material
    topic: milestone-criteria
    missingEvidence: Specific milestone definitions and disbursement trigger amounts for each Series A tranche
    whyItMatters: >-
      The tranche structure is the core capital risk management mechanism; without milestone definitions, the capital
      commitment cannot be independently verified or stress-tested
    diligencePath: >-
      Request milestone schedule from management or General Catalyst; cross-check against Phase I completion
      announcement
    relatedQuestionRefs:
      - QO013
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: headcount
    missingEvidence: Total company headcount as of mid-2026 across all locations (California + New Mexico)
    whyItMatters: >-
      CA-only figure (110+) understates total scale; burn rate and operational capacity cannot be accurately assessed
      without total headcount
    diligencePath: Check LinkedIn employee count, company career page, or request from management
    relatedQuestionRefs:
      - QO010
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Board composition beyond three named investors; independent directors; scientific advisory board; compensation and
      equity structure
    whyItMatters: >-
