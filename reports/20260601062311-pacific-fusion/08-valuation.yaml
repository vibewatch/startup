chapter:
  number: 8
  title: Valuation
  summary: Pacific Fusion is clearly a high-quality frontier fusion platform, but public evidence does not support a precise price conclusion because the post-money valuation, cap table, tranche terms, and commercial plant economics remain undisclosed. The round size alone (> $900M) is impressive and places Pacific near the top of private fusion financing, yet peers with stronger customer proof or later-stage hardware milestones provide better anchors than Pacific itself does. The right public-market-style verdict is therefore not “cheap” or “expensive,” but “price not assessable from public evidence”; the investment call remains research-more unless diligence reveals an entry price and ownership structure that compensate for very high technical and commercialization risk.
sections:
- id: what-the-public-record-does-and-does-not-say
  title: What the public record does and does not say about price
  body: 'The most important valuation fact about Pacific Fusion is negative: no public source reviewed in this run disclosed a post-money valuation, ownership sold, liquidation preference stack, or other term-sheet details for the October 2024 Series A. Public coverage consistently reports the headline amount—more than $900 million, led by General Catalyst—and several sources note that the capital is committed upfront but released against milestones. That tells us Pacific Fusion entered the market with extraordinary financing scale, but not what price investors actually paid per point of ownership or what protections they received.


    That missing information matters even more because Pacific is pre-revenue and pre-commercial. There is no disclosed ARR, no offtake-backed backlog, and no power-plant cash-flow model to support a traditional valuation approach. In effect, any underwriting case today must price a bundle of scientific talent, milestone progress, platform optionality, and future commercial credibility rather than a live business. Public evidence can help rank Pacific relative to peers, but it cannot cleanly determine whether the Series A was fair, stretched, or investor-friendly without the cap table.


    The best public workaround is scenario math. If a >$900M round sold roughly 20% of the company, implied post-money valuation would be about $4.5B; at 25%, about $3.6B; at 30%, about $3.0B; and at 40%, about $2.25B. Those numbers are simple dilution arithmetic, not reported facts. They are useful only because they frame what diligence needs to learn next: if Pacific priced at the low end of that range, the risk/reward could still be arguable for a category-defining energy platform; if it priced at the high end without stronger customer proof or a validated full module, the round likely leaned more on narrative and scarcity than on underwriting fundamentals.'
