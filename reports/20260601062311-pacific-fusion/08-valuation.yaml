tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Field
  - Current view
  - Why
  - Decision implication
  rows:
  - - Recommendation
    - research-more
    - Price and structure remain undisclosed despite strong technical promise
    - Do not underwrite from headlines alone
  - - Confidence
    - medium
    - Company quality is clearer than pricing quality
    - Maintain active diligence but avoid false precision
  - - Risk rating
    - high
    - Full-module, commercialization, and capital risks remain unresolved
    - Use milestone gates rather than narrative-only conviction
  - - Valuation stance
    - unknown
    - No public post-money or ownership sold disclosed
    - Need term sheet / cap table before making a valuation call
  - - Overall score
    - 5.4 / 10
    - Elite ambition offset by severe pricing opacity and execution risk
    - Track closely rather than commit blindly
  notes: Summary table reflects public-evidence judgment, not an internal term-sheet review.
  claimRefs:
  - CV031
  - CV032
  - CV033
  - CV034
  - CV035
  - CV040
- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - Pacific could become a category-defining firm-power platform if its module architecture scales and its early scientific rigor converts into real facility performance.
    - Validated full module, clearer plant economics, and named anchor users would strengthen the thesis materially.
  - - The >$900M Series A gives Pacific more runway than most fusion startups and may let it outrun capital-market volatility.
    - Disclosure that capital access is more contingent than expected or that future capital is needed sooner would weaken the thesis.
  - - Macro electricity, AI, and industrial-decarbonization trends create a large long-term market if fusion works.
    - If alternative firm-power technologies capture those buyers first, the macro upside becomes less Pacific-specific.
  - - 'Anti-thesis: Pacific may be an outstanding science program purchased at an unattractive price with limited buyer proof.'
    - Low implied post-money, clean terms, and real counterparties would soften the anti-thesis.
  - - 'Anti-thesis: full-module and shot-economics risk may push commercialization well beyond public timelines.'
    - On-time full-module proof with credible cost assumptions would rebut this concern.
  notes: 'The table is deliberately price-sensitive: company quality and entry quality are treated separately.'
  claimRefs:
  - CV023
  - CV024
  - CV025
  - CV028
  - CV029
  - CV030
  - CV036
  - CV037
- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Full module works on schedule; early users become reference counterparties; implied post-money lands toward low-mid scenario range
    - Low-to-mid implied price on a platform with sector-leading science could support venture-style upside
    - Scale-up, waste, and buyer conversion still hard
    - Requires multiple near-term technical wins
  - - Base
    - Technical progress continues but no clean price discovery or customer proof emerges publicly
    - Public investors should remain in research-more mode because price cannot be justified from evidence
    - Narrative outruns underwriting, forcing patience
    - Most consistent with current public record
  - - Bear
    - Module or schedule slips; future financing becomes earlier or more dilutive; no buyers emerge
    - High implied price plus slippage creates poor forward return setup
    - Down-round / dilution / credibility loss
    - Always plausible in first-of-a-kind deep tech
  notes: Scenarios are underwriting frames, not forecasts.
  claimRefs:
  - CV028
  - CV029
  - CV030
- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Status / valuation signal
  - Relevance
  - Limitation
  rows:
  - - Pacific Fusion
    - '>$900M Series A'
    - Valuation undisclosed; milestone-based capital
    - Direct company under review
    - No ownership sold disclosed
  - - Commonwealth Fusion Systems
    - Funding scale
    - Raised $863M B2; almost $3B total; Google offtake
    - Best-financed and strongest commercial-proof U.S. peer
    - Later stage and different technical path
  - - Helion
    - Funding + customer proof
    - Raised $425M Series F; Nucor 500 MW plan + $35M investment
    - Useful benchmark for customer-backed fusion narrative
    - Different machine architecture and maturity
  - - TAE Technologies
    - Funding scale
    - Raised $150M latest round
    - Shows lower-end financing scale among leading peers
    - Customer proof less visible in this source set
  - - Zap Energy
    - Milestone proof
    - DOE approved pilot-plant preconceptual design milestone
    - Useful milestone benchmark for U.S. commercialization progress
    - No valuation anchor in this source set
  - - General Fusion
    - Demonstration + financing
    - LM26 demonstration path; $22M financing
    - Shows capital scarcity and milestone-dependence for peers
    - Different geography and financing environment
