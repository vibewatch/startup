companyProfile:
  summary: Pacific Fusion was founded in 2023 to commercialize pulsed magnetic inertial fusion using a modular impedance-matched Marx generator architecture. The company operates R&D and manufacturing-adjacent campuses in the San Francisco Bay Area and is building a Research and Manufacturing Campus in Albuquerque plus a Build Center in Los Lunas, New Mexico. Its near-term objective is to complete the first full Demonstration System pulser module and achieve net facility gain by 2030; its long-term objective is to deploy a first commercial U.S. fusion system in the mid-2030s. Public materials show unusually strong scientific disclosure for a private fusion company, but the business remains pre-revenue and commercial adoption remains prospective rather than proven.
