  productSummary: Pacific Fusion's core product path is a pulsed-power inertial fusion system built around modular impedance-matched Marx generator pulser modules, simplified disposable targets, and a Demonstration System that also supports external experiments through the Pacific Fusion Users Program. Near term, Pacific is effectively commercializing a development platform and high-energy-density facility; long term, it aims to sell firm zero-carbon power and potentially heat from commercial fusion plants.
  customerFocus: Near-term focus is on government, academic, and industrial external users of the Demonstration System; long-term focus is on utilities, hyperscalers, and heavy industry seeking firm zero-carbon power and heat.
  businessModel: Pre-revenue today. Near-term value capture is expected from strategic partnerships and possible facility-access relationships tied to the Demonstration System; long term the business model is sale of firm clean electricity and potentially heat from commercial fusion plants.
  stage: Series A / pre-commercial
