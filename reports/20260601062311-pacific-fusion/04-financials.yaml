callouts:
  - calloutType: strength
    title: Milestone Financing Protects Team Focus
    body: >-
      The upfront-committed, milestone-gated structure insulates Pacific Fusion's
      technical team from repeated fundraising cycles — a structural advantage over
      sequentially-funded fusion peers. Phase I completion seven months early demonstrates
      execution discipline and validates the capital model's incentive alignment.
    claimRefs: [CI002, CI003, CI004, CI005]

  - calloutType: risk
    title: Conditional Capital — Tranche Miss Risk Is Non-Zero
    body: >-
      The $900M headline figure is not unconditional cash. Industry observers note that a
      missed milestone could trigger renegotiation, making tranches beyond what has already
      been unlocked effectively contingent. This risk is structural to all milestone-based
      financing and increases as the company approaches technically harder milestones
      (net facility gain by 2030).
    claimRefs: [CI008, CI009, CI041]

  - calloutType: recommendation
    title: Priority Diligence Requests for Financial Underwriting
    body: >-
      To underwrite Pacific Fusion financially, diligence should focus on: (1) Series A
      term sheet and milestone schedule to assess capital sufficiency; (2) audited or
      management-reviewed financials for burn rate and cash position; (3) Demonstration
      System independent engineering cost estimate; (4) tritium supply plan and cost model;
      (5) Form D filing extraction from SEC Q4 2024 dataset for offering structure details.
    claimRefs: [CI024, CI025, CI026, CI047]

  - calloutType: insight
    title: Fusion Capital Intensity Far Exceeds Series A
    body: >-
      The FIA 2025 report's combined industry estimate of $77B+ needed for commercialization
      of all surveyed fusion companies illustrates the scale mismatch between current
      private raises and full commercial deployment. Pacific Fusion's $900M is historically
      large for a Series A but likely a fraction of total commercialization cost; government
      co-financing via DOE Title XVII loan guarantees and PPP frameworks will be structurally
      necessary.
    claimRefs: [CI036, CI040, CI041, CI043]

