      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion's architecture centers on impedance-matched Marx generator pulser modules that discharge
              fast, precisely timed bursts of electricity into a small disposable target. TechCrunch's April 2025
              description and Pacific Fusion's own technical updates describe each module as a repeating assembly of 32
              stages with 10 bricks per stage; each brick contains a switch and two capacitors. Roughly 156 modules, or
              about 150 in the later General Atomics collaboration description, are intended to work together to deliver
              about 2 terawatts for roughly 100 nanoseconds. The point of the modular design is not only high peak
              power, but manufacturability: management repeatedly says that once one full module works, the remaining
              fleet should be a replication and production problem rather than a fresh invention problem.


              On the target side, the company is trying to simplify the shot architecture relative to Sandia's
              traditional MagLIF approach. The February 2026 Sandia results show plastic-and-aluminum composite targets
              can let the magnetic field diffuse into the target without sacrificial external magnetic coils, removing a
              major cost and maintainability obstacle for a commercial machine that would need frequent repeat shots.
              Pacific Fusion also says validated FLASH-based simulation tools now let it design these targets with
              higher confidence, including pathways to eliminate not only external pre-magnetization hardware but
              eventually laser pre-heating as well.


              Operationally, Pacific Fusion is building around a distributed manufacturing-and-test model. Fremont is
              the first-of-a-kind test center; San Leandro is the manufacturing R&D build center; Livermore provides
              simulation and national-lab adjacency; Albuquerque and Los Lunas are intended to become the scale-up
              campus for the Demonstration System and component production. The April 2025 General Atomics announcement
              suggests the operating model extends beyond internal build capacity: GA is helping on engineering,
              prototype testing, scaling, cryogenics, operations, and target fabrication, implying Pacific Fusion will
              likely commercialize through a tightly integrated supply-and-partner ecosystem rather than through a
              purely vertically integrated stack.
