      - number: '3.2'
        title: Direct Competitor Profiles
        blocks:
          - type: paragraph
            body: >-
              Commonwealth Fusion Systems (CFS) is the largest and most capitalised private fusion company. Founded in
              2018 as an MIT spin-off, CFS has raised close to $3 billion in total capital, with its $863 million Series
              B2 in August 2025 being the largest deep-tech energy fundraise since its own $1.8 billion Series B in
              2021. CFS's SPARC demonstration tokamak is under construction in Devens, Massachusetts, targeting net
              fusion energy (Q>1) in 2027. SPARC uses high-temperature superconducting (HTS) magnets co-developed with
              MIT, manufactured in-house at CFS's Devens factory, creating a significant manufacturing moat. The
              follow-on ARC commercial power plant is planned for Chesterfield County, Virginia, targeting ~400 MW
              output in the early 2030s. Google has signed a power purchase agreement for 200 MW from ARC and has also
              increased its equity investment in CFS, making Google the sector's first commercial offtake customer for
              fusion. CFS also has a strategic partnership with Dominion Energy.

              Helion Energy, founded in 2013 and based in Everett, Washington, operates its seventh-generation Polaris
              prototype. In January 2025, Helion raised $425 million in an oversubscribed Series F that brought total
              invested capital above $1 billion and valued the company at $5.425 billion post-money. In January 2026,
              Polaris became the first privately developed fusion machine to demonstrate measurable deuterium-tritium
              (D-T) fusion and achieve plasma temperatures of 150 million degrees Celsius, breaking Helion's own
              industry record. Helion has the sector's deepest commercial traction: a 50 MW power purchase agreement
              with Microsoft (target 2028) and a 500 MW development agreement with Nucor targeting operations in the
              2030s. Construction on Orion, Helion's first commercial machine in Malaga, Washington, began in July 2025.
              Helion's Field-Reversed Configuration (FRC) approach targets direct electricity conversion, bypassing the
              steam turbine cycle used by most competitors.

              TAE Technologies, founded in 1998 and based in Foothill Ranch, California, has raised over $1.3 billion
              across more than eleven rounds. Its latest round of more than $150 million in 2025 included Google,
              Chevron Technology Ventures, and NEA. TAE's Norm research reactor demonstrated for the first time the
              formation of an FRC plasma using only neutral beam injection (NBI), a breakthrough that allowed TAE to
              shorten its roadmap by skipping the planned Copernicus device and moving directly to the Da Vinci
              prototype commercial power plant targeted for the early 2030s. TAE's hydrogen-boron (p-B11) fuel approach
              produces no neutrons and no long-lived radioactive waste but requires plasma temperatures roughly fifteen
              times higher than D-T fusion and has not been demonstrated at commercially relevant scale.

              Zap Energy, based in Everett, Washington, pursues a sheared-flow-stabilized Z-pinch that achieves plasma
              confinement through current-driven compression, eliminating superconducting magnets or laser systems
              entirely. In May 2026, the DOE approved Zap's preconceptual design milestone under the Milestone-Based
              Fusion Development Program, describing a plant capable of approximately 50 MW of net electrical output per
              module. Zap is also developing an integrated nuclear energy platform combining fission, fusion, and hybrid
              technologies—a broader technology hedge than pure-fusion players. No commercial offtake agreements have
              been disclosed.

              General Fusion, founded in 2002 and headquartered in Richmond, British Columbia, Canada, pursues
              Magnetized Target Fusion (MTF) using mechanical compression of a liquid-metal-lined plasma cavity. Its
              Lawson Machine 26 (LM26), the industry's first large-scale MTF demonstration machine, achieved first
              plasma in February 2025 and first plasma compression in April 2025. General Fusion raised US$22 million in
              August 2025—significantly smaller than peers—to advance LM26 toward a series of Lawson criterion
              milestones, with a first-of-a-kind plant targeting operations around 2035. The liquid metal wall serves
              triple duty: neutron shielding, tritium breeding, and heat extraction, avoiding expensive superconducting
              magnets.
