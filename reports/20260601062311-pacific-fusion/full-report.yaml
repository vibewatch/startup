  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Capital Structure and Milestone-Tranche Financing
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion emerged from stealth on October 25, 2024 with a Series A of more than $900 million led by
              General Catalyst — one of the largest Series A rounds ever raised by a fusion company and among the
              largest deep-tech Series A rounds globally. The round structure is distinctive: all capital is committed
              upfront to mitigate fundraising distraction, but it is disbursed in tranches as the company achieves
              predefined technical milestones. This model is borrowed from biotech milestone-based financing and was
              attributed by Will Regan to General Catalyst, CEO Eric Lander, and COO Carrie von Muench.

              General Catalyst articulated the rationale explicitly: "Capital is truly their lifeblood. For these
              businesses, frequent, piecemeal financings can misalign investors and management teams and expose
              companies to negative funding cycles." Pacific Fusion completed Phase I milestones in November 2024,
              approximately seven months ahead of the original June 2025 target, unlocking the next tranche to fund
              construction of a complete pulser module (IMG). Simon Woodruff of Fusion Advisory Services noted that
              milestone-based financing has become standard across leading fusion ventures, parallel to the DOE
              Milestone Program.

              However, the committed-but-unvested structure carries a material caveat: the headline $900M figure does
              not represent unconditionally available cash. Industry observers, including commentary in Fusion Energy
              Insights, have noted that a missed milestone could force renegotiations, and that the full $900M may
              overstate what is actually guaranteed to the company beyond already-unlocked tranches. Pacific Fusion has
              not disclosed a post-money valuation, individual tranche sizes, or the specific milestone triggers
              governing each disbursement — all of which are material to a capital adequacy assessment. No debt,
              convertible notes, project finance, or credit facilities have been publicly announced; the company appears
              exclusively equity-funded from the Series A.
