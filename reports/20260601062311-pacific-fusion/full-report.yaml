          - type: callout
            title: Pre-Revenue with Multi-Decade Horizon to Commercial Product
            body: >-
              Pacific Fusion has no publicly disclosed revenue, commercial customers, offtake agreements, or power
              purchase agreements. The pathway to commercial revenue requires achieving net facility gain by 2030, then
              developing and deploying a first commercial system by the mid-2030s — a 9–12 year horizon from founding.
              The milestone-based $900M structure reduces sequential funding risk but does not eliminate the possibility
              of tranche renegotiation if milestones are missed.
