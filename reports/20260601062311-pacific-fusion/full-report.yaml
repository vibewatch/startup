      - number: '3.3'
        title: Commercialization Traction and Customer Position
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion's commercial position is weaker than its direct fusion competitors on every measurable
              public dimension: no power purchase agreement, no disclosed offtake customer, and no commercial site
              selected. Its public-facing demand proof is the Users Program, an Expression of Interest process for
              external researchers and prospective industrial users that was launched in 2025. CFS and Helion, by
              contrast, have binding commercial relationships.

              CFS holds the largest disclosed fusion offtake: Google's PPA for at least 200 MW from the ARC plant in
              Virginia, tied to SPARC achieving Q>1. This makes Google simultaneously an investor, an R&D partner, and a
              committed off-taker—a uniquely reinforcing commercial structure. Helion has two commercial commitments:
              Microsoft's PPA for a 50 MW fusion facility targeting 2028 delivery, and Nucor's $35 million equity
              investment combined with a 500 MW development agreement to supply a steelmaking facility. These
              commitments span both the hyperscale data center and the industrial decarbonization segments that Pacific
              Fusion has also identified as core markets in its briefing materials.

              Timeline compression is a significant competitive variable. Pacific Fusion's Phase I milestones were
              completed in November 2024, ahead of schedule, which unlocked the next tranche of its Series A. CFS
              targets SPARC Q>1 by 2027 and ARC commercial power by the early 2030s. Helion targets Orion first
              electricity delivery in 2028. Pacific Fusion targets a net facility gain by 2030 and a first commercial
              system by the mid-2030s—placing Pacific approximately 3–5 years behind the commercial leaders. TAE targets
              Da Vinci commercial operation in the early 2030s. General Fusion targets a first-of-a-kind plant around
              2035, on par with Pacific Fusion.

              Pricing benchmarks are speculative across the sector: no fusion company has disclosed a contract price per
              MWh for future output. CFS's ARC has stated the goal of being "the lowest cost source of clean, firm power
              that can be deployed anywhere," but without a disclosed price. Natural gas CCGT currently sets a firm
              power baseline of roughly $40–80/MWh levelised cost in the United States, while SMR fission projects carry
              higher estimated levelised costs of $80–130/MWh but with carbon-free attributes. The comparison is
              inherently speculative given that no fusion plant is yet operational.
