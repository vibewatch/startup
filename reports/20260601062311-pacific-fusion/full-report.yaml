      - number: '8.3'
        title: Recommendation, price discipline, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The correct public recommendation for Pacific Fusion is research-more. That is not a negative judgment on
              the company; it is a valuation-discipline judgment. Pacific has one of the most credible founding teams in
              fusion, unusually transparent technical disclosures for a private company, meaningful Sandia and General
              Atomics proof points, and a financing round large enough to keep the program moving. Those are genuine
              strengths. However, there is still no public valuation anchor, no revenue model that can be stress-tested,
              and no commercial buyer proof of the kind some peers have already shown.


              That combination means investors should be willing to pay attention, not willing to underwrite blindly. If
              private diligence reveals a moderate implied post-money valuation, clean ownership, sensible preference
              terms, a believable full-module schedule, and credible early-user or buyer commitments, Pacific could
              merit a premium deep-tech entry. If diligence instead reveals a very high implied post-money, aggressive
              preference stack, or unresolved capital needs beyond the current round, then even an impressive science
              story may offer poor forward returns.


              Put differently: Pacific Fusion looks investable as a platform only if the price and structure compensate
              for the fact pattern that is still missing. Until then, the stance should remain price-sensitive and
              evidence-sensitive. The near-term watch items are clear: complete the first full pulser module, publish
              more plant-level economics and safety detail, surface named external users or counterparties, and disclose
              enough financing terms to convert the current narrative into an underwriting case.
