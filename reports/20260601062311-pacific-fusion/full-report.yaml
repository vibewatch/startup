  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: What the public record does and does not say about price
        blocks:
          - type: paragraph
            body: >-
              The most important valuation fact about Pacific Fusion is negative: no public source reviewed in this run
              disclosed a post-money valuation, ownership sold, liquidation preference stack, or other term-sheet
              details for the October 2024 Series A. Public coverage consistently reports the headline amount—more than
              $900 million, led by General Catalyst—and several sources note that the capital is committed upfront but
              released against milestones. That tells us Pacific Fusion entered the market with extraordinary financing
              scale, but not what price investors actually paid per point of ownership or what protections they
              received.


              That missing information matters even more because Pacific is pre-revenue and pre-commercial. There is no
              disclosed ARR, no offtake-backed backlog, and no power-plant cash-flow model to support a traditional
              valuation approach. In effect, any underwriting case today must price a bundle of scientific talent,
              milestone progress, platform optionality, and future commercial credibility rather than a live business.
              Public evidence can help rank Pacific relative to peers, but it cannot cleanly determine whether the
              Series A was fair, stretched, or investor-friendly without the cap table.


              The best public workaround is scenario math. If a >$900M round sold roughly 20% of the company, implied
              post-money valuation would be about $4.5B; at 25%, about $3.6B; at 30%, about $3.0B; and at 40%, about
              $2.25B. Those numbers are simple dilution arithmetic, not reported facts. They are useful only because
              they frame what diligence needs to learn next: if Pacific priced at the low end of that range, the
              risk/reward could still be arguable for a category-defining energy platform; if it priced at the high end
              without stronger customer proof or a validated full module, the round likely leaned more on narrative and
              scarcity than on underwriting fundamentals.
            claimRefs:
              - CV001
              - CV002
