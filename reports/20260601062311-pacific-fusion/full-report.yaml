        - Tailwind
        - Now–2030 (acute, accelerating)
        - >-
          Creates a buyer class with scale and urgency to sign long-term firm power PPAs at premium; validates
          end-market economics ahead of commercial deployment
        - Confirm at least 1–2 expressions of interest or LOIs from hyperscale operators via Users Program by 2027
      - - Industrial decarbonization mandates and carbon pricing
        - Tailwind
        - 2026–2035 (building)
        - >-
          Steel/cement/chemicals buyers face regulatory and commercial incentive to replace fossil heat with clean
          baseload; the >$250B/yr industrial decarbonization market validates buyer budgets
        - >-
          Verify green steel premium pricing durability and EU Carbon Border Adjustment Mechanism implementation
          timeline
      - - DOE Fusion S&T Roadmap (Build–Innovate–Grow)
        - Tailwind
        - Now–2035 (structural alignment)
        - >-
          Federal policy alignment with Pacific Fusion's mid-2030s commercial timeline; public infrastructure
          investments (national labs, supply chain) reduce private technical risk
        - Track DOE appropriations for Milestone-Based Fusion Development Program and FIRE Collaboratives annually
      - - NRC ADVANCE Act and proposed rulemaking
        - Tailwind
        - 2024–2027 (rulemaking in progress)
        - >-
          Byproduct-material framework reduces regulatory cost and timeline vs. fission-reactor licensing; NRC proposed
          rule Feb 2026 provides clarity for first license applications
        - >-
          Monitor NRC final rule finalization; confirm New Mexico site's Agreement State licensing strategy with NRC
          guidance
      - - Competing firm clean power technologies (advanced fission SMRs, geothermal, long-duration storage)
        - Headwind
        - 2030–2040 (concurrent deployment)
        - >-
          SMRs (NuScale, X-Energy) and enhanced geothermal may capture data center and industrial buyers before fusion
          reaches commercial scale; IEA projects renewables+nuclear at 50% of generation by 2030
        - >-
          Benchmark SMR delivery timelines and LCOE vs. Pacific Fusion's projected commercial unit economics; assess
          buyer lock-in risk
      - - Fusion timeline credibility and expert skepticism
        - Headwind
        - Ongoing
        - >-
          History of schedule slippage across the industry (Helion, CFS) reduces buyer willingness to sign binding
          long-term agreements before demonstrated net gain; MIT Tech Review documented expert skepticism
        - >-
          Require verified Phase II milestone completion before initiating commercial LOI conversations; publish
          third-party audit of milestone criteria
      - - Capital intensity and manufacturing scale-up risk
        - Headwind
        - 2027–2035
        - >-
          Each commercial site requires ~$1B+ CapEx before revenue; 156-module architecture needs proven
          mass-manufacturing yield at San Leandro Build Center; long capital payback period
        - >-
          Assess pulser module per-unit cost trajectory and defect rate at Build Center; confirm modular architecture
          cost roadmap
      - - Grid interconnection and permitting bottlenecks
