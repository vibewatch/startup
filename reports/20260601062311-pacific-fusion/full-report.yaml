            title: High Key-Person Concentration in Three Co-Founders
            body: >-
              Eric Lander (CEO), Will Regan (President), and Keith LeChien (CTO) collectively represent the company's
              external credibility, milestone accountability structure, and core technical architecture. The loss of any
              of these three individuals could materially impair investor confidence, the milestone disbursement
              mechanism, or the technical program. Succession planning and bench depth below founder level are not
              publicly disclosed.
            calloutType: risk
            claimRefs:
