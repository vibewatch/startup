      - number: '8.2'
        title: Comparable set and scenario analysis
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion's closest public comp anchors are not revenue multiples from mature power companies; they
              are milestone-adjusted comparisons against other private fusion developers plus the macro demand backdrop
              for firm clean power. On financing scale alone, Pacific sits in elite company. Commonwealth Fusion Systems
              announced an $863M Series B2 and says it has raised almost $3B to date; Helion announced a $425M Series F;
              TAE announced a $150M financing; General Fusion announced a much smaller $22M financing to support LM26.
              Pacific's >$900M round is therefore sector-leading at the early-round end of the market.


              But capital raised is only half the story. Some peers have stronger public commercial proof. CFS has a 200
              MW offtake from Google and a clearer SPARC-to-ARC path; Helion has a strategic industrial counterparty in
              Nucor plus a planned 500 MW deployment concept; Zap has a DOE-approved pilot-plant preconceptual design
              milestone; General Fusion is operating LM26 as a demonstration machine. Pacific, by contrast, has
              unusually strong public technical documentation and a large war chest, but no named power buyer, no
              full-module proof, and no disclosed commercial financing structure. That gap argues for a heavier
              valuation discount than the raw funding headline would suggest.


              The scenario lens therefore turns on milestone conversion. In a bull case, Pacific validates a full pulser
              module, converts the Users Program into credible early anchor relationships, and reveals terms that imply
              a manageable entry valuation. In a base case, the science continues to progress but the price remains
              undisclosed and customer proof remains thin, leaving the right answer as “keep diligencing, don't
              underwrite from headlines.” In a bear case, module performance or schedule slips and the next financing is
              priced down or becomes much more dilutive. Because public evidence does not yet resolve which branch will
              dominate, the valuation stance should remain unknown rather than falsely precise.
            claimRefs:
