  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Mission
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion is a private U.S. fusion energy company founded in the summer of 2023 with the stated
              mission to "power the world with abundant, affordable, clean energy." It is headquartered in the San
              Francisco Bay Area and operates a network of California R&D campuses plus a planned Research and
              Manufacturing Campus in Albuquerque, New Mexico. The company classifies itself as pre-revenue and
              pre-commercial, working toward commercial fusion power on a decade-plus horizon.

              The company's near-term milestone is net facility gain — more fusion energy output than all stored energy
              input — by 2030, to be achieved with a purpose-built Demonstration System at the New Mexico campus. Its
              commercial product concept is a mass-manufacturable pulsed-power fusion system targeting delivery of the
              first U.S. commercial fusion system by the mid-2030s. Pacific Fusion's technical claims position its
              Demonstration System at 100-fold higher facility gain and 10-fold lower cost than the National Ignition
              Facility (NIF) at Lawrence Livermore National Laboratory — a claimed 1,000-fold leap in practical fusion
              performance.

              Pacific Fusion's founding in 2023 was directly catalyzed by two landmark scientific milestones: NIF's
              achievement of fusion ignition in December 2022, and the Sandia National Laboratories Z Machine's
              demonstration of the highest pulsed-magnetic fusion performance ever recorded. The company explicitly
              frames itself as the commercial vehicle for commercializing 50 years of U.S. national-laboratory
              investment in inertial confinement fusion and pulsed-power engineering.
