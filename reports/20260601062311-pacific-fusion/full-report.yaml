      - number: '2.6'
        title: Pacific Fusion's Position in the Market Structure
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion enters the firm clean power market as a pre-commercial developer in the inertial
              confinement fusion (pulsed magnetic) subcategory — the most direct commercial descendant of the NIF
              ignition science at LLNL. This positions the company in a distinct technical niche from tokamak-based
              developers (Commonwealth Fusion Systems, TAE Technologies) and field-reversed configuration approaches
              (Helion Energy). The April 2025 NIF experiment at LLNL achieved a record 8.6 MJ of fusion energy output
              from 2.08 MJ of laser input — target gain greater than four — confirming the inertial fusion science
              lineage that underpins Pacific Fusion's approach. LLNL's LIFT initiative was created precisely to
              commercialize this science base.

              Analyst segmentation (The Business Research Company) identifies inertial confinement fusion as one of four
              major fusion market subcategories (alongside magnetic confinement, stellarators, and spheromaks), with
              pulsed-power ICF (Z-pinch family) being the closest technical analog to Pacific Fusion's approach. The
              near-term market structure is not winner-take-all: utility buyers, data center operators, and industrial
              customers will contract with whichever developer can deliver reliable, economically competitive baseload
              power first, and multiple fusion approaches may coexist in different market niches and geographies.

              LLNL researchers estimate that commercial fusion could increase global GDP by $68 trillion and create a
              trillion-dollar industry with new supply chains and workforce requirements — framing Pacific Fusion not as
              a niche energy technology but as a potential infrastructure-scale platform. The Users Program represents
              Pacific Fusion's first attempt to build a commercial demand pipeline ahead of net facility gain, targeting
              government agencies, AI companies, and industrial researchers who need access to the Demonstration System
              for pre-commercial research. Conversion of Users Program expressions of interest into binding research or
              offtake agreements before 2030 is the primary near-term commercial proof point.
