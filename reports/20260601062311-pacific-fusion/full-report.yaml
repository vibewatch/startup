      - number: '1.2'
        title: Leadership and Governance
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion was co-founded by five individuals whose complementary expertise spans big-science program
              leadership, energy policy, pulsed-power engineering, deep-tech operations, and computational physics. Eric
              Lander, CEO and co-founder, is best known for co-leading the international Human Genome Project and served
              as Director of the White House Office of Science and Technology Policy and Presidential Science Advisor
              under President Biden. His public credibility and ability to attract institutional capital and government
              partnerships are central to the company's external positioning.

              Will Regan, President and co-founder, brings program management experience from ARPA-E (where he developed
              the Accelerating Low-Cost Plasma Heating and Assembly, or ALPHA, program) and Alphabet X (where he founded
              the Mineral agriculture-technology project). Keith LeChien, CTO and co-founder, was LLNL's lead for pulsed
              magnetic fusion and Director of Inertial Confinement Fusion at the National Nuclear Security
              Administration (NNSA). He is also a co-inventor of the impedance-matched Marx generator (IMG), the core
              technology underlying the company's pulser architecture.

              Carrie von Muench (COO and co-founder) and Leland Ellison (co-founder, Head of Simulation and Modelling,
              formerly a computational physicist at LLNL) complete the founding team. Senior technical hires include
              Nathan Meezan (Head of Target Design, 20+ years at LLNL on NIF target teams), Alex Zylstra (Head of
              Experiments, the principal NIF experimentalist who achieved ignition), and Sachin Desai (General Counsel,
              formerly at Helion). Governance includes three investor board seats: Hemant Taneja (General Catalyst),
              Eric Schmidt (former Google CEO), and Patrick Collison (Stripe co-founder). No independent board
              directors, scientific advisory board, or compensation structure have been publicly disclosed.
