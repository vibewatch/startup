  - id: FM001
    title: Market sizing lens
    type: pyramid
    layout: standard
    summary: >-
      Four-layer TAM-to-SOM breakdown from the global firm clean power market to Pacific Fusion's near-term reachable
      revenue, based on IEA demand data and competitor analogs.
    data:
      items:
        - label: Global TAM — Firm clean power (electricity + industrial process heat) by mid-2030s
          description: >-
            Total global demand for always-on, carbon-free electricity and high-temperature industrial process heat;
            currently served by fossil fuels and legacy nuclear; IEA projects 33,600 TWh/yr total electricity demand by
            2030; fusion could address a multi-trillion-dollar/year opportunity at full commercial deployment scale
          value: $2–3T+/yr (projected at full commercial scale)
        - label: Advanced-economy SAM — New firm clean power demand to 2035 (AI, industrial electrification)
          description: >-
            Incremental always-on clean electricity and process heat demand in U.S., EU, and allied nations driven by AI
            data centers (945 TWh/yr by 2030), industrial decarbonization (>$250B/yr market), and energy security
            mandates; addressable by first-generation commercial fusion developers
          value: $300–600B/yr (analyst-estimated new load)
        - label: Validated analog demand — First-mover fusion buyers (2030–2035)
          description: >-
            Demand supported by confirmed commercial analogs: CFS-Google 200 MW PPA, Helion-Nucor 500 MW industrial
            plant; DOE national-security research pipeline via CRADAs; conservative extrapolation from current fusion
            buyer commitments
          value: $10–50B/yr (analog-supported)
        - label: Pacific Fusion SOM — First commercial system initial revenue potential (mid-2030s)
          description: >-
            Revenue from first commercial system and Users Program anchor contracts; constrained by demonstration
            capacity and single-site footprint at initial deployment; Pacific Fusion has no public revenue or signed
            commercial agreements as of run date
          value: < $1B/yr (initial; no public evidence)
    approximationNotes: >-
      TAM and SAM estimates are analyst-constrained projections derived from IEA Electricity 2026, Goldman Sachs data
      center research, and industrial decarbonization market reports; no fusion-specific commercial revenue exists. SOM
      is a conceptual bound, not a financial projection. All layers are estimates with wide confidence intervals.
