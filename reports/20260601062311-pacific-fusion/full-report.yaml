  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Full module miss
        - Material slip or repeated failure of first DS pulser module
        - Breaks replication thesis and undermines timeline credibility
        - Do not support premium valuation assumptions
      - - Economics still opaque
        - No credible target-cost / shot-cadence model after module proof
        - Science may work without investable business model
        - Keep recommendation at research-more or avoid
      - - Regulatory / financing burden rises
        - Developer obligations or capital needs prove heavier than assumed
        - Discount rate increases and timeline extends
        - Require lower entry price or step away
      - - No anchor users
        - No named external users or buyers as DS approaches commissioning
        - Commercial translation remains unproven
        - Treat Pacific as science-led option value, not commercial asset
      - - Aggressive cap-table terms
        - Term sheet reveals high implied valuation or investor-unfriendly preference stack
        - Return profile deteriorates even if technology is strong
        - Pass unless price resets
    notes: Kill triggers are framed as underwriting thresholds, not operational wish lists.
    claimRefs:
      - CV028
      - CV029
      - CV030
      - CV037
      - CV039
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Series A term sheet
        - Post-money valuation, ownership sold, liquidation preferences
        - Without price and structure there is no real valuation case
        - Request term sheet from company / lead investor
      - - Cap table
        - Current ownership, option pool, pro-rata and preference stack
        - Return modeling depends on cap-table reality
        - Request cap table and financing memos
      - - Tranche schedule
        - Milestone definitions and release mechanics
        - Contingent capital can tighten faster than headlines imply
        - Request milestone matrix and funding-release rules
      - - Full-module data
        - Acceptance criteria, reliability, and failure analysis
        - Key technical gate for commercialization
        - Request Phase II technical package
      - - Target / plant economics
        - Per-shot target cost, cadence, output, and plant assumptions
        - Needed for any serious price discipline
        - Request economics model and engineering assumptions
      - - Counterparties
        - Named users, access agreements, or power-buyer outreach
        - Commercial proof is a major missing anchor
        - Request pipeline and reference calls
    notes: These asks are prioritized by how much they would change the valuation call rather than by ease of collection.
    claimRefs:
      - CV038
      - CV039
