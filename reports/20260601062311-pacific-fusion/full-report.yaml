        title: Exhibits
        blocks:
          - type: callout
            title: Industry-Leading Milestone-Based Financing Structure
            body: >-
              The full commitment of $900M upfront with milestone-gated disbursement eliminates sequential fundraising
              risk and lets the technical team focus on execution milestones rather than investor relations. Phase I
              milestones were completed approximately seven months ahead of schedule (November 2024 vs. June 2025),
              demonstrating early execution credibility under this model and unlocking the next capital tranche.
            calloutType: strength
            claimRefs:
