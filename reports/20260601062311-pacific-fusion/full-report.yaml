      - number: '4.5'
        title: Financing Environment and Forward Capital Path
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion operates in a rapidly maturing fusion financing environment. The FIA 2025 Global Fusion
              Industry Report shows the global fusion industry has surpassed $9.7 billion in total investment, with more
              than $2.6 billion raised in 2024-2025 alone. The DOE Fusion Science and Technology Roadmap (October 2025)
              notes more than $9 billion in private investment already deployed, and its Build-Innovate-Grow strategy
              aligns commercial fusion goals with the mid-2030s, the same timeframe as Pacific Fusion's first commercial
              system target. The DOE Office of Energy Dominance Financing (EDF) administers $40 billion in IRA-backed
              loan guarantee authority for clean energy technologies under Title XVII and Section 1703, which fusion
              companies could access for commercialization financing with loan guarantees covering up to 80% of eligible
              project costs.

              Demand-side conditions are structurally supportive. Goldman Sachs Research forecasts global data center
              power demand to increase by up to 165% by decade's end. IEA projects global data center electricity
              consumption to exceed 945 TWh by 2030. U.S. electricity consumption is forecast to surpass all-time highs
              in 2025-2026. The global industrial decarbonization market is projected to exceed $250 billion annually by
              2030. These demand signals underpin investor confidence in clean baseload power sources including fusion —
              but Pacific Fusion's commercial product does not arrive until the mid-2030s, creating a long gap between
              the current financing environment and any revenue event.

              The FIA median fusion company respondent estimated needing an additional $700M to bring first plants
              online; combined industry-wide capital requirements exceed $77 billion. Pacific Fusion's $900M Series A —
              though large by deep-tech standards — likely falls short of total commercialization cost. Government
              co-investment (DOE loan programs, public-private partnerships), project-finance structures, or a Series B
              may be necessary before commercial deployment. Peer precedents include CFS's $863M Series B2 and Helion's
              $35M Nucor strategic investment alongside a commercial agreement.
