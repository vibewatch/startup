      - number: '6.3'
        title: Market validation versus Pacific’s proof gap
        blocks:
          - type: paragraph
            body: >-
              Broader market conditions support the idea that a future fusion customer base could exist. EIA and IEA
              sources point to re-accelerating electricity demand in the United States and globally, while Goldman Sachs
              and S&P Global both highlight AI and data-center growth as a major new source of firm-power demand.
              Industrial decarbonization research from Global Energy Monitor, the World Economic Forum, and
              ResearchAndMarkets likewise supports demand for high-availability clean energy in steel, heavy industry,
              and other hard-to-abate sectors. These are credible reasons to believe that if fusion becomes real, there
              should be buyers.


              But Pacific Fusion has not yet translated that macro demand story into named commercial proof. Two peers
              illustrate the gap. Commonwealth Fusion Systems announced a 200 MW clean-power offtake agreement with
              Google for ARC and said Google also increased its investment stake. Helion and Nucor announced a plan to
              develop a 500 MW fusion plant at a steel mill, accompanied by a $35 million strategic investment from
              Nucor, while Helion separately raised a $425 million Series F to scale commercialization after additional
              technical milestones. Whether those peer timelines prove realistic is debatable, but they show what
              stronger customer proof looks like: named counterparties, megawatt figures, strategic capital, and
              explicit commercial intent.


              Pacific Fusion is therefore best described as demand-adjacent rather than demand-proven. Its Users Program
              may become a useful bridge from research access to real customer relationships, but until the company
              discloses named external users, signed facility-access agreements, or eventual power buyers, durability
              and concentration analysis remains mostly a map of unresolved future dependencies. That pushes the
              customer verdict toward “early signal, not adoption.”
