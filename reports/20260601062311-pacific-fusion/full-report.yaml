  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: System definition and target use cases
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion is not selling a near-term reactor module or a software product. Its current product is a
              multi-stage development platform: first the Demonstration System (DS), then a commercial pulsed-power
              fusion plant that uses the same architecture at larger scale. In customer-workflow terms, the DS is
              designed to create ignition-scale high-energy-density conditions for Pacific Fusion's own
              commercialization program while also supporting external experiments through the Pacific Fusion Users
              Program. That makes the DS both an internal development asset and, before power sales begin, a specialized
              research and test facility for government, academic, and industrial users.


              The core user job for Pacific Fusion's eventual commercial plant is to deliver firm, zero-carbon power and
              potentially industrial heat using a system that avoids the size and complexity of giant laser facilities
              or superconducting tokamaks. The company argues that pulser-driven inertial confinement fusion can achieve
              higher practical gain at lower cost because fast electrical pulses and simple replaceable targets are more
              modular and manufacturable than laser drivers or large magnetic-confinement machines. Public materials are
              explicit that the DS is the intermediate proof point: if Pacific Fusion can show net facility gain and
              repeatable module performance, the same module design can be replicated into a commercial plant.


              The nearer-term non-power use case matters because it is one of the only public adoption surfaces
              available today. Pacific Fusion says the DS will be available for selective external use starting from
              commissioning, with applications spanning ignition-scale physics experiments, materials testing in intense
              neutron and photon environments, radiation-hardness testing, medical isotope work, and national-security
              experiments. That positioning broadens the platform's utility, but it also underscores that the company
              remains pre-revenue and pre-customer for electricity sales.
