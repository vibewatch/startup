      - number: '2.3'
        title: Demand Drivers — AI Infrastructure, Industrial Decarbonization, and Energy Security
        blocks:
          - type: paragraph
            body: >-
              Three structural forces define near-term demand pull for firm clean power, each creating distinct buyer
              populations with different budget ownership and adoption triggers.

              First, AI infrastructure expansion is creating an unprecedented continuous power load. Goldman Sachs
              Research estimates the current global data center market at approximately 55 GW and projects it will reach
              over 130 GW by 2030, with AI growing from 14% to 27% of total data center workload by 2027. U.S. data
              centers are expected to consume more electricity than all energy-intensive manufacturing combined by 2030.
              Electricity demand in advanced economies reversed a 15-year stagnation trend in 2024–2025; the U.S. and EU
              are now both on 2%+ annual growth trajectories driven primarily by digital infrastructure. Data centers
              require 24/7 uptime, low carbon credentials for corporate net-zero commitments, and are increasingly
              constrained by grid interconnection delays and permitting bottlenecks. Goldman Sachs estimates $720
              billion of grid investment may be needed through 2030 to support data center expansion — a constraint that
              creates demand for behind-the-meter firm power solutions.

              Second, industrial decarbonization pressure is creating structural demand for high-temperature clean
              process heat and reliable industrial electricity. Hard-to-abate sectors — steel, cement, aluminum, primary
              chemicals, aviation, and shipping — account for nearly 40% of global greenhouse gas emissions and face
              regulatory mandates requiring significant decarbonization. The global industrial decarbonization market is
              projected to exceed $250 billion annually by 2030. Electric arc furnace (EAF) steelmaking, growing rapidly
              as the low-carbon steel route, emits approximately 0.3 tonnes CO2 per tonne of steel versus 2.2 tonnes for
              blast furnace routes, but requires massive quantities of reliable clean electricity. The Nucor-Helion 500
              MW fusion plant collaboration — in which the largest U.S. steelmaker signed a deal to develop a fusion
              plant at one of its own mills — demonstrates that industrial buyers are actively seeking firm clean power
              beyond what renewables can deliver.

              Third, energy security and supply-chain resilience are increasingly framing firm clean power as a national
              security asset. The DOE's Build–Innovate–Grow strategy under President Trump's Executive Order Unleashing
              American Energy explicitly links commercial fusion to rebuilding U.S. energy dominance and domestic supply
              chains. The LLNL LIFT initiative was established to bridge national laboratory fusion science and the
              commercial sector, reflecting federal recognition that fusion's market development requires coordinated
              public-private investment.
