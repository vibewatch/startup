          accelerate demand for behind-the-meter firm power (favorable); net effect on Pacific Fusion depends on
          deployment model
        - >-
          Clarify whether Pacific Fusion's first commercial system is designed for grid-tied or behind-the-meter
          deployment, and assess interconnection queue risk for New Mexico site
