      - number: '2.4'
        title: Policy and Regulatory Backdrop
        blocks:
          - type: paragraph
            body: >-
              The policy and regulatory environment for commercial fusion has shifted materially in Pacific Fusion's
              favor during the 2024–2026 period, reducing a previously dominant structural risk.

              The most consequential change is the ADVANCE Act (enacted July 9, 2024), which formally codified fusion
              machines under the NRC's byproduct-material regulatory framework — the same proportionate regime applied
              to particle accelerators — rather than the heavier fission- reactor regulations. The NRC's decision,
              ratified by Congress, is grounded in the understanding that fusion machines do not rely on a
              self-sustaining chain reaction and produce substantially less radioactive waste than fission reactors.
              Agreement States have safely regulated fusion research and development systems under this framework for
              over 25 years.

              The NRC published a proposed rule on February 26, 2026, initiating a 90-day public comment period on a
              technology-neutral regulatory framework for fusion machines. The NRC's Vision and Strategy (Revision 1,
              January 7, 2026) establishes five regulatory principles — clarity, efficiency, independence, reliability,
              and openness — and three strategic focus areas: regulatory optimization, technical readiness, and
              partnership and coordination with DOE, NNSA, Agreement States, and international counterparts. The NRC is
              also pursuing a study on mass-production licensing frameworks for commercial fusion machine designs.

              On the executive and legislative side, the DOE Fusion Science and Technology Roadmap (October 2025)
              establishes the Build–Innovate–Grow strategy with input from over 600 researchers and industry
              stakeholders, explicitly targeting commercial fusion power delivery by the mid-2030s. The DOE Office of
              Energy Dominance Financing and the Title 17 clean energy loan guarantee program — with $40 billion in
              additional IRA-backed authority — provide potential capital access for qualifying fusion facility
              projects. The ARPA-E BETHE program has provided federal funding for low-cost fusion approaches including
              pulsed-power concepts. The policy environment as of the run date is strongly aligned with Pacific Fusion's
              commercial timeline.
            claimRefs:
              - CM019
              - CM020
              - CM021
              - CM022
              - CM023
              - CM024
      - number: '2.5'
        title: Adoption Constraints and Adverse Evidence
        blocks:
          - type: paragraph
            body: >-
              Against the demand tailwinds, Pacific Fusion faces material adoption constraints that any honest market
              forecast must incorporate.

              The most fundamental constraint is timeline credibility. Fusion companies have a documented history of
              optimistic schedule projection. MIT Technology Review coverage of Helion Energy in May 2023 reported that
              multiple independent nuclear experts questioned whether Helion's five-year commercial timeline was
              achievable, noting the company had not yet confirmed net energy gain from its device. While the critique
              was directed at Helion, the structural challenge — demonstrating net gain, proving an engineering concept,
              then scaling to commercial production, all on a decade timeline — applies to every fusion developer.
              Pacific Fusion's own commercialization path spans approximately 12 years from founding (2023) to first
              commercial system (mid-2030s), with the critical scientific milestone (net facility gain by 2030) still
              ahead.

              A second constraint is competition from maturing alternative technologies. The IEA projects renewables and
              nuclear will supply 50% of global electricity by 2030 (up from 42% in 2025). Advanced fission SMRs,
              enhanced geothermal, and long-duration storage are all approaching commercial deployment and may capture a
              significant share of firm clean power demand from data centers and industrial buyers before fusion reaches
              commercial scale. If these solutions prove technically and economically adequate, the addressable window
              for first-generation fusion may be narrower than the total firm clean power TAM suggests.

              A third constraint is the current complete absence of commercial proof for Pacific Fusion. The company has
              no revenue, no signed power purchase agreements, no binding commercial customer relationships, and no
              public evidence of buyer demand beyond the Users Program expression-of-interest process. All market sizing
              relevant to Pacific Fusion is prospective and depends on technical milestones being met and commercial
              demand materializing on a compatible timeline.
