  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Served Categories
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion's market is the global market for firm, dispatchable, always-on clean power at industrial
              scale — not the broader renewable energy market, not the fusion investment market, and not variable
              generation. The included spend is long-term capital expenditure and power procurement for baseload
              generation assets in applications where intermittency is economically unacceptable: AI hyperscale data
              centers, aluminum smelting, steel arc furnaces, electrolytic hydrogen production, semiconductor
              fabrication, and national security infrastructure. The excluded spend is variable renewable capacity (wind
              and solar without multi-day storage) and short-duration battery assets whose intermittent profiles
              disqualify them for these applications.

              The status-quo substitutes are natural gas combined-cycle (NGCC), fission nuclear, enhanced geothermal,
              and pumped-hydro storage — all of which are either carbon-intensive, geographically constrained, or unable
              to scale at the pace that AI and industrial electrification are demanding. Each of these substitutes has a
              material limitation Pacific Fusion is designed to address: NGCC is carbon-emitting; fission nuclear faces
              long permitting timelines and site constraints; geothermal is resource-constrained; pumped hydro is
              geographically bounded. None of them offer the modular, replicable, mass-manufacturable architecture that
              Pacific Fusion's impedance-matched Marx generator (IMG) approach targets.

              Adjacent markets that Pacific Fusion's materials identify as long-term use cases include electrolytic
              hydrogen production, seawater desalination, naval and defense power, and research applications — all
              high-power, reliability-critical applications that share the same buyer profile as the core data center
              and industrial market. These adjacent segments are not the primary near-term revenue focus but are
              represented in the Users Program expression-of-interest process.
