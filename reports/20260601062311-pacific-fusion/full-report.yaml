      - number: '1.5'
        title: Technology Approach
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion pursues pulsed magnetic inertial confinement fusion (ICF), a distinct path from laser-based
              ICF (as at NIF) and from magnetic confinement approaches (tokamaks, stellarators). The system compresses
              small deuterium-tritium fuel targets using fast-rising, high-current electrical pulses that generate a
              magnetic field squeezing and heating the fuel to fusion conditions in approximately 100 nanoseconds per
              shot. The process is designed to be repeatable — like a piston engine — enabling continuous power
              generation.

              The core engineering unit is the impedance-matched Marx generator (IMG), or pulser module, co-invented by
              Keith LeChien and first publicly demonstrated by LLNL in 2022. Each module has 32 stages, each comprising
              10 bricks (a switch and two capacitors). The full Demonstration System will use approximately 156 such
              modules, together producing approximately 2 terawatts for 100 nanoseconds — roughly four times the average
              power of the U.S. electrical grid. The modular architecture supports mass manufacturing and "carbon copy"
              replication once a single module prototype is validated.

              A critical experimental result was published in February 2026: four shots at Sandia's Z Machine at 22
              million amps and 120 nanoseconds validated a simplified plastic-and-aluminum target design that allows
              magnetic field diffusion into the target, eliminating the need for large, expensive external magnetic
              coils previously required in MagLIF-style approaches. The company characterized this as "dramatically
              simplifying the entire target-chamber architecture," enabling economically viable fusion power at scale.

              Pacific Fusion holds formal Cooperative Research and Development Agreements (CRADAs) with both Sandia
              National Laboratories and Lawrence Livermore National Laboratory. The LLNL CRADA, signed January 28, 2025,
              enables collaboration on NIF ignition physics and simulation validation. Target simulation work is
              additionally conducted with the Flash Center at the University of Rochester.
            claimRefs:
              - CO004
              - CO021
              - CO022
              - CO023
              - CO024
              - CO025
              - CO030
              - CO033
      - number: '1.6'
        title: Milestones and Progress
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion has assembled a notable milestone record in fewer than three years since founding. The
              company completed Phase I milestones by November 2024 — roughly seven months ahead of the original June
              2025 schedule — unlocking the next tranche of its Series A and enabling work to begin on a complete pulser
              module (IMG). Will Regan confirmed in a TechCrunch exclusive (April 2025) that the company had developed
              the necessary simulation models and built completed prototypes of bricks and stages, positioning it to
              "carbon copy" the full 156-module system once the complete module is validated.

              The company's Sandia CRADA yielded independently published experimental results in February 2026, marking
              the first third-party corroboration of Pacific Fusion's simplified target concepts by a national
              laboratory partner. The LLNL CRADA established in January 2025 extends access to NIF ignition physics and
              simulation validation tools.

              On the policy front, the DOE Fusion Science and Technology Roadmap (released October 2025) identified
              commercial fusion by the mid-2030s as a national strategic objective, aligned with Pacific Fusion's own
              timeline. The ADVANCE Act (July 2024) had already established a lighter regulatory framework for fusion
              under byproduct-material rules rather than fission reactor rules, reducing regulatory risk for near-term
              deployment. No adverse events, executive departures, lawsuits, or regulatory enforcement actions involving
              Pacific Fusion have been publicly disclosed as of the chapter run date.
