      - number: '4.2'
        title: Revenue Model and Monetization Path
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion is pre-revenue as of June 2026. No revenue, ARR, GMV, signed customer contracts, power
              purchase agreements, or commercial offtake arrangements have been publicly disclosed. The company's
              current-stage outputs are R&D milestones and experimental results, not commercial products or services.
              The company's founders' letter and public materials frame the company's mission as delivering clean energy
              to the grid — implying electricity sales ($/MWh) as the primary future revenue mechanism — but no pricing,
              contract structures, or target revenue per unit have been disclosed.

              Two secondary revenue paths are inferable from available materials. First, the company's emphasis on
              mass-manufacturable, modular pulser systems (each module fitting in a shipping container) raises the
              possibility of a hardware licensing or equipment sales revenue stream alongside power generation. Second,
              the Users Program / Expression of Interest process for external research users could generate early access
              fees or public co-funding contributions, though no terms or pricing have been disclosed. Neither path is
              confirmed; both are contingent on reaching technical milestones not yet achieved.

              The revenue recognition challenge specific to pre-commercial fusion is acute: unlike software or
              marketplace companies, Pacific Fusion has no list pricing, pilot customers, contract backlog, or signed
              letters of intent to anchor a revenue estimate. Forward revenue models for the mid-2030s timeframe depend
