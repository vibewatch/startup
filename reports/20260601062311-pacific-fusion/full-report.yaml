      - number: '4.4'
        title: Financial Disclosure Profile and Underwriting Blockers
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion's financial disclosure posture is consistent with a private pre-commercial deep-tech
              company: virtually no conventional financial metrics are publicly available. No gross margin, EBITDA, burn
              rate, cash on hand, or unit economics have been disclosed. Pitchbook's Pacific Fusion profile was
              access-blocked during this diligence run (Cloudflare rate-limiting), preventing independent verification
              of total raised or implied valuation from third-party aggregators. FusionXInvest's coverage is paywalled.
              No post-money valuation is publicly available, which is consistent with milestone-based, committed-upfront
              structures that do not establish a conventional VC price-setting event.

              Companies raising more than $1 million in an exempt offering under Regulation D must file a Form D notice
              with the SEC within 15 days of the first sale of securities. Pacific Fusion's October 2024 Series A
              closing would require such a filing; the company's Form D data would appear in the SEC's Q4 2024
              structured dataset. The SEC Form D Data Sets provide structured data from Notices of Exempt Offerings
              filed under Rule 504, Rule 506(b), and Rule 506(c) of Regulation D. These datasets (covering Q4 2024
              through Q1 2026) were fetched as part of this diligence, but the binary ZIP format requires further
              processing to extract Pacific Fusion's specific filing. The Form D would disclose issuer name, total
              offering amount, total amount sold to date, date of first sale, and exemption type, but would not reveal
              tranche structure, milestone schedule, or investor economics. Pacific Fusion has not filed for a public
              offering and operates under a private securities exemption, consistent with its pre-commercial stage.

              The structural underwriting challenge is compounded by the absence of any of the following: realized
              revenue, signed customer contracts, commercial pricing disclosed, independent engineering cost validation
              of the Demonstration System, tritium supply chain economics, or an independently audited financial
              statement. Every material financial metric relevant to a conventional diligence underwrite is either
              private, pre-commercial, or structurally unavailable at this stage.
