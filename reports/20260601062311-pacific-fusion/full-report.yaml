  - id: FI001
    title: Revenue Model Bridge — Customer Activity to Gross Revenue
    type: flow
    layout: standard
    summary: >-
      Illustrates the projected revenue conversion path from end-customer demand through power delivery to gross
      revenue; all nodes are pre-commercial as of June 2026.
    data:
      nodes:
        - id: end_customer
          label: End Customer
          detail: >-
            Utilities, data center operators, industrials seeking clean baseload power; no signed customers as of Jun
            2026
        - id: ppa_contract
          label: Power Purchase Agreement
          detail: $/MWh offtake contract — no PPAs or LOIs announced as of Jun 2026
        - id: fusion_plant
          label: Commercial Fusion Plant
          detail: 'Target: first U.S. commercial system mid-2030s; depends on Demonstration System success by 2030'
        - id: electricity_output
          label: Electricity Delivery
          detail: Revenue recognized on MWh delivered to grid; LCOE target undisclosed
        - id: gross_revenue
          label: Gross Revenue Line
          detail: >-
            MWh × contract price; fuel, tritium, O&M, and target consumables deducted for gross profit; no pricing
            disclosed
        - id: licensing_alt
          label: Technology Licensing (Alt)
          detail: 'Potential secondary stream: licensing modular IMG pulser tech; no terms disclosed'
    approximationNotes: >-
      All revenue nodes are prospective. Company is pre-revenue as of June 2026. No PPAs, customer contracts, or pricing
      has been disclosed. Revenue model structure inferred from company materials and peer precedents.
    claimRefs:
      - CI011
      - CI012
      - CI013
      - CI014
  - id: FI002
    title: Unit Economics Bridge — Inputs to Commercial Economics
    type: flow
    layout: standard
    summary: >-
      Maps the chain from system capital cost and fuel inputs to commercial unit economics; most nodes are structurally
      unavailable and marked with their data-quality label.
    data:
      nodes:
        - id: system_capex
          label: System CapEx (public)
          detail: >-
            Demonstration System: ~$1B campus (stated); commercial unit cost per MW undisclosed; company claims 10x
            lower cost than NIF
        - id: fuel_cost
          label: Fuel Cost D-T (unavailable)
          detail: >-
            Deuterium: commercially available; tritium supply chain and cost undisclosed; company claims 'vastly cheaper
            than fossil fuels'
        - id: opex
          label: Operating Expenses (unavailable)
          detail: >-
            Staff, target consumables, maintenance, grid interconnect; no public data; estimated multi-tens-of-$M/yr at
            current scale
        - id: capacity_factor
          label: Capacity Factor (unavailable)
          detail: Shot repetition rate and uptime unknown; pre-demonstration; critical for LCOE calculation
        - id: lcoe
          label: LCOE Target (unavailable)
          detail: >-
            Levelized cost of electricity; not yet estimable — structurally unavailable pre-demonstration; peer
            commercial targets range $50-100/MWh
    approximationNotes: >-
      Unit economics are structurally unavailable pre-demonstration. Company claims 10x lower cost than NIF (~$3.5B
      construction) and 100x higher facility gain, but provides no $/MWh or $/W figures. LCOE peer range ($50-100/MWh)
      is from public fusion industry targets, not Pacific Fusion-specific data.
    claimRefs:
      - CI022
      - CI023
      - CI024
      - CI047
