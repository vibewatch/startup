      - number: '1.4'
        title: Footprint and Operations
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion operates a geographically distributed but strategically cohesive multi-site footprint. Its
              California R&D network — described as the company headquarters cluster — comprises three facilities: the
              Fremont Headquarters and Test Center (where first-of-a-kind fusion system components are built, tested,
              and optimized), the San Leandro Build Center (a 135,000-square-foot Manufacturing R&D facility ramping
              pulser module production), and the Livermore Collaboratory (focused on plasma simulation, target design,
              and proximity to LLNL). The California team grew by approximately three-fold over the year following the
              October 2024 launch, reaching over 110 employees in that state.

              For its Demonstration System, Pacific Fusion selected Albuquerque, New Mexico after a competitive site
              process that also included Livermore, California. The city of Albuquerque offered $776 million in
              Industrial Revenue Bonds providing a 20-year property tax abatement. The New Mexico Research and
              Manufacturing Campus, sited at Mesa del Sol adjacent to Sandia National Laboratories, will host the
              Demonstration System. A companion Build Center in Los Lunas, New Mexico, will manufacture system
              components. The total campus investment is described as approximately $1 billion, creating 200 permanent
              jobs and hundreds of construction roles.

              The distribution reflects deliberate logic: Bay Area campuses draw on Silicon Valley talent and capital
              networks; the Livermore Collaboratory leverages LLNL proximity; the New Mexico footprint benefits from
              adjacency to the Z Machine (Pacific Fusion's primary experimental platform) and favorable state incentives
              for large capital projects.
