      - number: '2.2'
        title: Market Sizing and Investment Landscape
        blocks:
          - type: paragraph
            body: >-
              Sizing Pacific Fusion's addressable market requires a top-down demand lens triangulated against bottom-up
              investment signals and multiple analyst estimates, because no single fusion-specific commercial revenue
              projection is credible at this pre-commercial stage.

              The most credible near-term demand signal comes from electricity consumption data. The IEA projects global
              electricity demand will reach 33,600 TWh per year by 2030, up from 28,200 TWh in 2025 — adding
              approximately 1,100 TWh per year, nearly 60% more than the 700 TWh/yr added over 2015–2025. Within this
              growth, data centers are the fastest-accelerating segment: the IEA projects their annual electricity
              consumption will more than double to 945 TWh by 2030, equivalent to Japan's entire current power
              consumption. Goldman Sachs Research independently forecasts a 165% increase in data center power demand by
              2030 versus 2023, reaching over 130 GW of installed capacity. The U.S. Energy Information Administration
              confirmed the reversal of a two-decade U.S. flat-demand trend, projecting commercial-sector consumption
              (inclusive of data centers) growing at 2.6% per year.

              On the investment side, the Fusion Industry Association's 2025 annual survey documents cumulative private
              fusion investment surpassing $7 billion globally, with public funding growing 84% year-on-year to nearly
              $800 million in 2025 — confirming a structural escalation in capital commitment. The DOE Fusion S&T
              Roadmap announcement cites over $9 billion in private investment already advancing burning-plasma
              demonstrations. Industry analyst firm The Business Research Company estimates a broader "fusion energy
              market" at $288 billion in 2025 growing to $420 billion by 2030 at a 7.8% CAGR, though this figure
              reflects projected addressable energy production value at scale rather than current revenue. Contradictory
              estimates and methodology gaps are preserved in the sizing lens table.
