      - number: '7.2'
        title: Technical, operational, and dependency risk
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion's largest risk remains technical scale-up. Public evidence supports component-level
              progress, validated simulation tools, and a meaningful Sandia experiment that simplified target
              architecture, but none of that equals a working commercial plant. The critical unresolved jump is from
              validated bricks, stages, and target concepts to a reliable full pulser module and then to a synchronized
              bank of roughly 150-plus modules running a facility that can repeatedly hit net-gain conditions. That is a
              very large systems-integration step, and it is where many frontier hardware companies fail.


              Operational risk follows from the same gap. Pacific Fusion must stand up manufacturing and test capacity
              across Fremont, San Leandro, Albuquerque, and Los Lunas while coordinating key external partners such as
              Sandia, LLNL, the Flash Center, and General Atomics. The General Atomics collaboration is strategically
              helpful, but it also highlights dependence on external engineering, target-fabrication, and scale-up
              support. Construction and hiring plans in New Mexico suggest momentum, yet they also show how many
              schedule-critical workstreams have to advance in parallel before the Demonstration System becomes a real
              asset.


              Competitive risk compounds this. Commonwealth Fusion Systems, Helion, TAE, Zap Energy, and General Fusion
              are all pursuing different technical routes to the same prize. Some already have named commercial
              counterparties or more mature pilot narratives. Pacific Fusion's advantage is unusually strong public
              technical rigor for its age; its disadvantage is that the company still has to prove that rigor survives
              contact with plant-scale hardware. If the first full module misses spec or if target economics remain
              unattractive, peers with stronger commercial momentum could capture the narrative, talent, and capital
              first.
