      - number: '4.3'
        title: Cost Structure and Capital Intensity
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion's capital intensity is substantial even by fusion-industry standards. The company has
              committed to a $1 billion Research and Manufacturing Campus at Mesa del Sol in Albuquerque, New Mexico,
              which will house the Demonstration System targeting net facility gain by 2030. The groundbreaking is
              planned for the week of August 24-29, 2026. The campus will create 200 permanent jobs and hundreds of
              construction roles over a multi-year build-out. In parallel, the company operates five California
              facilities including a 135,000-square-foot San Leandro Build Center for pulser module manufacturing R&D, a
              Fremont Headquarters and Test Center, and a Livermore Collaboratory.

              California headcount grew approximately three-fold in the twelve months following the October 2024 stealth
              emergence, exceeding 110 employees. While no monthly burn rate has been disclosed, a multi-site R&D
              operation at this headcount and facility scale for a pulsed-power engineering effort implies
              multi-tens-of-millions-dollar annual expenditure, and the NM campus construction will drive additional
              capital deployment. The company claims its Demonstration System will achieve 10-fold lower cost than the
              NIF (estimated ~$3.5B construction cost), but no independent cost estimate has been published and no $/W
              or $/MWh figure has been disclosed.

              The cost structure includes both direct and indirect items for which no public data exists: tritium supply
              (small quantities per shot but a long-term supply challenge), target consumables (each fusion shot
              requires a new fuel cylinder), pulser module capital cost, and facility-level operating overhead. Pacific
              Fusion describes its fuel as "vastly cheaper than fossil fuels" but has not provided a cost model. On the
              capital side, the $776 million Industrial Revenue Bond offering from Albuquerque provides a 20-year
              property tax abatement — a real financial subsidy that reduces ongoing occupancy cost but does not offset
              construction capex.
