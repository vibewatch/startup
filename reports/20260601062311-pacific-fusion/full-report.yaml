      - number: '1.3'
        title: Funding and Capital Structure
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion announced its emergence from stealth on October 25, 2024 with a Series A of more than $900
              million — one of the largest Series A rounds ever raised by a fusion energy company and among the largest
              deep-tech Series A rounds globally. The round was led by General Catalyst, with a syndicate including
              Breakthrough Energy Ventures, several prominent tech and finance individuals (Eric Schmidt, Patrick
              Collison, John Doerr, Ken Griffin, Mustafa Suleyman, Lachy Groom, Elad Gil, Richard Merkin, Reid Hoffman,
              Andrew Forrest), and institutional funds (Leitmotif, Lightspeed, Lowercarbon Capital, Trousdale Ventures,
              and others).

              The capital structure is distinctive: the full $900M was committed upfront but is disbursed in tranches as
              Pacific Fusion achieves predefined technical milestones. Will Regan (in a TechCrunch exclusive, April
              2025) confirmed the company was "several months ahead of schedule," citing Phase I milestone completion in
              November 2024 — approximately seven months ahead of the original June 2025 target. Credit for the tranche
              model goes to investors at General Catalyst, CEO Eric Lander, and COO Carrie von Muench, all of whom were
              familiar with milestone-based financing from biotech.

              The approach is designed to mitigate fundraising distraction and maintain accountability. However,
              industry observers have noted the committed-but-unvested capital is effectively contingent, and the
              headline $900M figure may overstate what is unconditionally available to the company. Pacific Fusion has
              not disclosed a post-money valuation, consistent with pre-commercial deep-tech rounds of this structure.
            claimRefs:
