  - id: moat-durability
    title: Moat Durability and Competitive Risk
    body: >-
      Pacific Fusion's claimed competitive moats are: (1) its modular Marx generator architecture of
      ~156 identical pulser modules, which enables factory manufacturing and unit-cost learning curves;
      (2) formal CRADAs with LLNL and Sandia, providing access to classified and restricted technical
      data and national facility shots; (3) Sandia Z Machine experimental results that validated a
      simplified target design eliminating external magnetic coils, reducing system complexity; and
      (4) its positioning as the only private fusion company systematically building on both NIF ignition
      (LLNL pedigree) and Sandia Z/MagLIF advances.

      These moats are real but early. The most durable competitive advantages in the fusion sector today
      belong to CFS (HTS magnet manufacturing IP and in-house factory, ~$3B in capital scale, Google
      PPA as commercial anchor) and Helion (first private D-T fusion, Orion construction underway,
      Microsoft and Nucor as committed customers, direct electricity conversion). Pacific Fusion's
      modular architecture has not yet been demonstrated at scale, and its CRADA access, while
      valuable, is shared with other national-lab collaborators in the ecosystem.

      The capital concentration risk is the most acute structural threat: CFS's cumulative ~$3 billion
      dwarfs Pacific Fusion's $900 million, and CFS's oversubscribed Series B2 demonstrates continued
      investor confidence as milestones are hit. If CFS achieves Q>1 with SPARC in 2027 as planned,
      investor attention and anchor customer discussions could strongly consolidate around the tokamak
      approach, making it harder for Pacific Fusion to raise its next round at competitive terms.
      Helion's D-T demonstration in January 2026 similarly validates the FRC approach and creates a
      credibility asymmetry relative to Pacific Fusion's pre-ignition pulsed power program.

      TAE's hydrogen-boron fuel approach, if it can demonstrate viability, would offer unique regulatory
      and environmental advantages (essentially no neutrons, no tritium handling). However, achieving
      the required plasma temperatures (~1 billion°C for p-B11 vs ~100M°C for D-T) is a substantially
      harder physics problem and represents a higher-risk bet. General Fusion's capital position ($22M
      most recent raise) and timeline (2035 FOAK) suggest it is not a near-term competitive threat to
      Pacific Fusion's fundraising or customer pipeline, though its practical MTF approach is the most
      capital-efficient design in the peer set.

      The broader fusion ecosystem is still pre-commoditisation. No approach has yet achieved a
      repeatable, electricity-producing demonstration at commercial scale, which means technical
      differentiation claims from all players—including Pacific Fusion—are based on physics models
      and prototype benchmarks, not operating plant evidence. A historic pattern of timeline slippage,
      noted by independent fusion scientists, applies to every competitor equally and is the single
      most important systemic risk factor for any fusion investment.
