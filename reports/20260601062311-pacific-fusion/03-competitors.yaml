  - id: status-quo-alternatives
    title: Status-Quo Alternatives and Substitutes
    body: >-
      Pacific Fusion and all fusion competitors are ultimately competing against the incumbent energy
      technologies that utility buyers and industrial customers already know: natural gas combined-cycle
      (NGCC), nuclear fission including small modular reactors (SMRs), and renewables paired with
      long-duration storage. Understanding the substitution dynamics is essential for assessing whether
      any fusion company can win commercial contracts in the 2030–2040 procurement horizon.

      Natural gas remains the dominant marginal firm power option globally. Combined-cycle plants are
      dispatchable, fuel-flexible, and can be sited near load. Levelised cost of electricity for new
      NGCC in the United States is approximately $40–80/MWh, which sets the primary cost benchmark
      for fusion. Renewables with battery storage are increasingly cost-competitive for variable power
      but cannot yet reliably provide multi-day baseload without significant oversizing and storage
      costs. Enhanced geothermal and pumped hydro face geographic constraints. Fission-based SMRs are
      the most directly comparable substitute in terms of technology profile—dispatchable, zero-carbon,
      always-on—but carry multi-decade regulatory approval timelines (NuScale received NRC design
      approval in 2022 but its first customer cancelled in late 2023) and high capital intensity.

      Nuclear fission's regulatory and cost challenges create a structural window for fusion, but only
      if fusion can prove its commercialization timeline. The IEA's 2026 electricity outlook projects
      electricity demand growing substantially through 2030, driven by data centers, AI, EVs, and
      industrial electrification—exactly the demand segments Pacific Fusion and its peers are targeting.
      Substitution will depend on whether fusion can achieve commercial cost parity with NGCC (the
      primary benchmark), since clean-power premiums in data-center PPAs appear to be in the range of
      $10–30/MWh above NGCC. If fusion cannot reach that range in its first commercial plants, customer
      decisions will default to NGCC, SMRs, or large-scale geothermal.
    claimRefs:
