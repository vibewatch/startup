callouts:
  - calloutType: risk
    title: Capital Gap and CFS Milestone Risk
    body: >-
      CFS's cumulative ~$3 billion in capital and its SPARC Q>1 target in 2027 represent the single
      most acute competitive risk to Pacific Fusion's fundraising trajectory. If CFS achieves SPARC
      net energy as planned, investor attention and anchor customer PPAs could consolidate around the
      tokamak approach, creating a credibility gap that Pacific Fusion's 2030 facility-gain milestone
      may need to overcome before its next major fundraise. Pacific Fusion should track CFS milestone
      cadence quarterly.
    claimRefs:
      - CP002
      - CP025
      - CP027
      - CP038

  - calloutType: risk
    title: Helion Commercial Traction Lead
    body: >-
      Helion has the deepest commercial footprint of any fusion company: the first private D-T fusion
      demonstration, Orion construction underway, a Microsoft PPA for 50 MW in 2028, and a Nucor
      500 MW development agreement. This creates a potential market-segmentation risk for Pacific
      Fusion in the hyperscale data center and industrial decarbonization verticals—both of which
      Pacific Fusion has identified as core target markets. Pacific Fusion's Users Program and EOI
      process will need to convert to binding agreements to demonstrate competitive commercial momentum
      before the mid-2030s.
    claimRefs:
      - CP007
      - CP009
      - CP010
      - CP024
      - CP026

  - calloutType: strength
    title: Modular Architecture and National-Lab Pedigree as Moat
    body: >-
      Pacific Fusion's approximately 156 identical pulser modules and its formal CRADAs with LLNL
      and Sandia are genuine differentiators not replicated by any other private fusion company.
      The Sandia Z Machine shots that simplified the target by eliminating external magnetic coils
      represent a published scientific advance that reduces downstream engineering risk. These
      institutional relationships and the manufacturing-friendliness of the modular architecture
      are the strongest moat vectors available to Pacific Fusion in its current phase.
    claimRefs:
      - CP020
      - CP022
      - CP023

