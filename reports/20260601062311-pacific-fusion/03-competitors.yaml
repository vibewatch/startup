company:
  name: Pacific Fusion
chapter:
  number: 3
  title: Competitors
  summary: >-
    The private fusion sector has coalesced around five technically differentiated companies—CFS,
    Helion, TAE Technologies, Zap Energy, and General Fusion—each targeting commercial power in
    the 2027–2035 window with collectively more than $6 billion raised. Pacific Fusion occupies a
    distinct pulsed-power ICF lane, backed by national-lab partnerships and $900 million in Series
    A capital, but trails the field on customer offtake commitments, total capital, and commercial
    timeline by roughly three to five years. The competitive moat rests on modular manufacturability,
    CRADA relationships with LLNL and Sandia, and a Sandia Z Machine–validated target simplification—
    durable advantages that nonetheless require a 2030 facility-gain demonstration to remain credible
    against accelerating rivals.

sections:
  - id: landscape-overview
    title: Fusion Competitive Landscape
    body: >-
      Private fusion has entered a distinct commercialization phase. The Fusion Industry Association's
      2025 global industry report counted more than 40 active private fusion companies worldwide,
      with total private investment approaching $9 billion and government contributions growing 84%
      year-over-year to nearly $800 million. Five companies have emerged as primary direct competitors
      to Pacific Fusion for the firm, dispatchable, clean power market: Commonwealth Fusion Systems
      (CFS), Helion Energy, TAE Technologies, Zap Energy, and General Fusion. Each pursues a
      fundamentally different confinement physics, which creates both competitive differentiation and
      genuine uncertainty about which approach will prove commercially superior.

      Pacific Fusion sits in a field where capital concentration is high: CFS alone has raised close
      to $3 billion, roughly one-third of all private fusion capital ever invested, while Helion's
      $1 billion-plus raise at a $5.4 billion valuation makes it the sector's second-most-capitalised
      pure-play. Pacific Fusion's $900 million Series A is the third-largest single-company raise in
      the sector but carries milestone-gated release of tranches rather than unrestricted deployment.
      Status-quo alternatives—natural gas combined-cycle plants, small modular fission reactors, and
      renewables with storage—also represent real competition in the firm-power procurement decisions
      that fusion companies are ultimately trying to win. Any commercial fusion plant must deliver power
      at or below the $40–80/MWh levelised cost benchmark set by natural gas in the 2030s to displace
      the incumbent.

      The competitive analysis must hold one key tension: all fusion timelines are estimates backed by
      physics models and prototype results, not proven commercial operation. MIT climate experts and
      nuclear scientists have repeatedly noted that fusion timelines have historically slipped by
      five-to-ten years or more. That systemic pattern applies to every player in this analysis,
      including Pacific Fusion.
