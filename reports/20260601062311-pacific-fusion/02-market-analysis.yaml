callouts:
  - calloutType: strength
    title: "AI Power Demand Surge Creates Unprecedented Near-Term Market Pull"
    body: >-
      The convergence of AI infrastructure build-out, data center expansion, and industrial
      electrification is creating the most acute surge in firm clean power demand in decades. The
      IEA projects global data center electricity consumption will exceed 945 TWh by 2030 —
      double the 2024 level — while Goldman Sachs forecasts 165% data center power growth by 2030
      versus 2023. These buyers have the financial scale, net-zero commitments, and urgency to
      support long-term offtake agreements at premium prices. Pacific Fusion's mid-2030s commercial
      delivery timeline aligns with this demand curve if technical milestones hold, and the CFS-
      Google PPA demonstrates that hyperscale buyers will commit to fusion ahead of commercial
      delivery.
    claimRefs: [CM006, CM007, CM009, CM017]

  - calloutType: risk
    title: "Timeline Slippage and Competing Technologies Compress Pacific Fusion's Market Window"
    body: >-
      Independent nuclear experts have publicly questioned whether any fusion developer's
      five-year commercial timeline is credible, and advanced fission SMRs, enhanced geothermal,
      and long-duration storage are all targeting commercial deployment in the 2030s on
      overlapping timelines. The IEA projects renewables and nuclear will supply 50% of global
      electricity by 2030. If these technologies adequately serve data center and industrial
      firm power needs through the mid-2030s, the addressable first-generation window for Pacific
      Fusion could be narrower than the total TAM suggests. Pacific Fusion's first commercial
      system has no public buyer commitments, underscoring this risk.
    claimRefs: [CM025, CM026, CM027, CM028, CM035]

  - calloutType: insight
    title: "DOE–NRC Policy Alignment Enables Commercial Conversations Before Net Gain Is Demonstrated"
    body: >-
      The ADVANCE Act and the NRC's February 2026 proposed fusion machine rulemaking eliminate
      what was previously a dominant uncertainty — the regulatory pathway for commercial fusion.
      The DOE's Build–Innovate–Grow strategy, endorsed by over 600 stakeholders and framed under
      the current Administration's energy dominance agenda, provides the first explicit federal
      endorsement of a mid-2030s commercial fusion timeline. Together, these create a policy
      environment in which utility rate-case filings, buyer contracts, and project financing for
      fusion become structurally possible before net facility gain is demonstrated — a key
      condition for commercial momentum.
    claimRefs: [CM014, CM015, CM019, CM020, CM021, CM023]

  - calloutType: recommendation
    title: "Users Program EOI Conversion and NRC Rulemaking Are the Two Leading Market Indicators"
    body: >-
      The two most important leading indicators for Pacific Fusion's market traction are:
      (1) whether the Users Program expression of interest converts to signed research agreements
      or commercial LOIs from identifiable AI and industrial buyers before net facility gain (2030),
      and (2) whether the NRC finalizes the proposed fusion machine rule without materially
      adverse modifications that increase licensing cost or complexity. A finalized rule and at
      least one anchor buyer LOI before 2030 would substantially de-risk the commercial market
      story and support valuation upside.
    claimRefs: [CM019, CM020, CM021, CM025, CM029, CM030]

