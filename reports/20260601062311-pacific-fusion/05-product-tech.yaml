- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Key dependency
  - Principal risk
  rows:
  - - Capacitor + switch brick
    - Stores and releases electrical energy in each repeating unit
    - Supplier quality and switch timing precision
    - Timing error can undermine compression symmetry
  - - 32-stage IMG module
    - Aggregates bricks into container-scale pulser module
    - Full-module integration and thermal/mechanical robustness
    - First full module not yet publicly demonstrated
  - - ~150-156 module pulser bank
    - Delivers ~2 TW / 100 ns pulses into target chamber
    - Synchronized control across all modules
    - Scale-up from one module to plant-scale bank may introduce reliability losses
  - - Disposable fusion target
    - Contains fuel and creates required magnetic environment
    - Target fabrication and materials repeatability
    - Per-shot cost and manufacturability remain undisclosed
  - - Simulation and modeling stack
    - Designs targets and predicts facility behavior
    - Benchmark fidelity and experimental validation
    - Model error at plant scale could delay milestones
  - - Test + manufacturing campuses
    - Build, validate, and industrialize modules
    - Facilities ramp in Fremont, San Leandro, Albuquerque, Los Lunas
    - Site ramp or construction delays can block technology schedule
  notes: Architecture table summarizes public descriptions rather than a released engineering drawing.
