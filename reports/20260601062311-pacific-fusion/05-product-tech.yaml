tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Demonstration System (DS)
    - Pacific Fusion internal R&D; future external users
    - In design / site selected / commissioning later this decade
    - Only disclosed pulsed-power inertial fusion system of this scale with external-user program planned
    - Need full commissioning plan, shot cadence targets, and balance-of-plant specs
  - - IMG pulser module
    - Pacific Fusion engineering + future plant operations
    - Component-level validation complete; first full module is Phase II milestone
    - Container-scale, line-replaceable modular pulser concept designed for mass manufacture
    - Need full-module test data, maintenance interval, and manufacturing yield
  - - Target family (plastic + aluminum composite liners)
    - Pacific Fusion experiments team
    - Early experimental validation at Sandia Z Machine
    - Eliminates external magnetic coils and may simplify chamber economics
    - Need target cost per shot, manufacturing yield, and repeatability data
  - - FLASH-based simulation toolchain
    - Target-design and systems engineers
    - Peer-reviewed validation published; benchmarked across six cases
    - Unusually open private-company validation posture for ignition-scale modeling
    - Need direct comparison versus plant-scale experiments beyond benchmark set
  - - Pacific Fusion Users Program
    - Government, academic, and industrial researchers
    - EOI stage; external use planned with DS commissioning
    - Creates pre-power adoption surface and may improve facility design through early partner input
    - Need named users, signed access agreements, and revenue / utilization model
  notes: Statuses reflect public disclosures through the chapter run date; Pacific Fusion has not published commercial product specifications or contracted power-delivery terms.
