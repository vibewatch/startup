- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow / pain point
  - Pacific Fusion solution
  - Measurable benefit claimed
  - Limitation
  rows:
  - - Prove net facility gain
    - National-lab experiments prove physics but are not practical power plants
    - Build DS around modular pulsers and simplified targets
    - Targets net facility gain by 2030
    - No public proof yet that DS can reach shot economics or cadence
  - - Design ignition-scale targets
    - Legacy codes validated incrementally across many years at national labs
    - Use customized FLASH code validated against six benchmarks
    - Faster target iteration with published validation
    - Benchmarking is not the same as full plant validation
  - - Generate intense HED environment for researchers
    - Access to ignition-scale pulsed-power facilities is scarce
    - Offer DS time to external users through PFUP
    - 17 configurable target-area diagnostics and intense neutron / photon environment
    - No named users or signed allocations disclosed
  - - Manufacture repeatable power modules
    - Large bespoke fusion hardware is hard to scale
    - Use identical line-replaceable IMG modules assembled from mass-manufacturable components
    - Replication economics improve if first module works
    - Need module lifetime, cost, and QA data at production rate
  - - Simplify pulser-driven target architecture
    - Traditional MagLIF needs external coils and more shot-side hardware
    - Composite target creates internal magnetic field without external coils
    - Lower replaceable-hardware burden per shot
    - Need confirmation that simplification survives plant-scale repetition
  notes: Benefits are company-claimed unless supported by independent reporting or partner validation.
