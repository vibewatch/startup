  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: module-reliability
    missingEvidence: Full pulser module performance data, maintenance interval, and lifecycle reliability statistics
    whyItMatters: Commercial viability depends on repetition, maintainability, and synchronized reliability across roughly 150+ modules rather than on one-off component tests
    diligencePath: Request Phase II test reports, failure-mode analysis, and maintenance assumptions for the first complete module
    relatedQuestionRefs:
    - QE013
    - QE023
    - QE029
    relatedTableRefs:
    - TE003
    - TE004
  - type: private-evidence-only
    severity: material
    topic: target-economics
    missingEvidence: Target fabrication cost per shot, yield, and materials supply plan
    whyItMatters: Even if physics works, pulser-driven ICF remains uneconomic if disposable targets or chamber-side consumables cost more than the value of the energy released
    diligencePath: Request target bill of materials, manufacturing process, and per-shot cost assumptions under DS and commercial scenarios
    relatedQuestionRefs:
    - QE014
    - QE015
    - QE029
    relatedTableRefs:
    - TE001
    - TE002
  - type: missing-source
    severity: material
    topic: safety-case
    missingEvidence: Plant-level safety architecture, incident planning, and full facility quality management disclosures
    whyItMatters: A fusion power plant must clear licensing, worker-safety, and operational-quality hurdles well beyond scientific proof-of-concept
    diligencePath: Request preliminary safety analysis report, quality-management framework, and regulator engagement materials
    relatedQuestionRefs:
    - QE025
    - QE030
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: minor
    topic: cybersecurity
    missingEvidence: Public cybersecurity, controls-software assurance, or industrial control system governance disclosures
    whyItMatters: A plant-scale pulsed-power system will depend on tightly synchronized controls and diagnostics that create operational and cyber-safety exposures
