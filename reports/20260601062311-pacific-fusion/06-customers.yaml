chapter:
  number: 6
  title: Customers
  summary: 'Pacific Fusion does not yet have publicly disclosed electricity customers, offtake agreements, or signed utility partners; the strongest public adoption evidence is its Pacific Fusion Users Program, which invites industry, academic, and government partners to use the Demonstration System once commissioned. That means current customer analysis is really an analysis of demand surfaces, counterparties, and commercialization readiness rather than revenue traction. Relative to peers such as Commonwealth Fusion Systems and Helion, Pacific Fusion appears earlier in the customer-proof curve: strong technical ambition, but no named power buyer yet.'
sections:
- id: current-customer-status-and-demand-surfaces
  title: Current customer status and demand surfaces
  body: 'Pacific Fusion remains pre-commercial from a customer perspective. The company has not publicly disclosed a utility, hyperscaler, industrial offtaker, government power buyer, or signed power-purchase agreement for a future fusion plant. There is no public customer count, no disclosed contracted backlog for power sales, and no retention or renewal data. That absence matters because fusion companies often discuss commercial timelines long before there is verifiable buyer commitment.


    The strongest public adoption surface is instead the Pacific Fusion Users Program (PFUP). Pacific Fusion says the program will make its Demonstration System available for selective use by external partners and is already soliciting expressions of interest. The user-program materials and launch post identify three initial prospect pools—private industry, academia, and government—and describe use cases ranging from ignition-scale physics and diagnostics work to materials testing, radiation-hardness studies, medical isotope work, and national-security experimentation. The company also says the DS will eventually dedicate a portion of facility time to external experiments and that partner engagement before commissioning will shape facility design.


    In practical terms, Pacific Fusion is marketing access to a future research-and-test environment rather than selling electricity today. That is not unusual for a fusion company at this stage, but it means the customer chapter should be read as an assessment of latent demand and conversion readiness, not as evidence of product-market fit for a power plant. The distinction is important because many of the most exciting public surfaces around Pacific Fusion are ecosystem signals rather than booked revenue.'
