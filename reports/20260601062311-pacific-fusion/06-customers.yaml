tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Scale / strategic value
  - Gap
  rows:
  - - Government / national security
    - Federal agencies and labs; user may differ from payer
    - High-energy-density experiments, diagnostics, and national-security testing
    - Most plausible early anchor segment because Pacific names it directly
    - No named agencies, contracts, or budgets disclosed
  - - Academic / research
    - Universities, academic consortia, lab-affiliated researchers
    - Ignition-scale physics, diagnostics development, materials science
    - Good reference-quality segment if used by known institutions
    - No named universities or allocation process disclosed
  - - Industrial test users
    - Aerospace, materials, radiation-hardness, isotope or pulsed-power users
    - Qualification testing and non-power applications
    - Could create early non-power revenue before utility sales
    - No pricing, backlog, or named customers disclosed
  - - Future power buyers
    - Utilities, hyperscalers, heavy industry
    - Firm zero-carbon electricity or heat
    - Largest long-term TAM if technology works
    - No named buyer, PPA, or project developer disclosed
  - - Ecosystem partners
    - State/local government and regional stakeholders
    - Campus support, permitting, workforce, ecosystem building
    - Helpful for commercialization support but not revenue customers
    - Does not prove product adoption or payment willingness
  notes: Pacific Fusion has no named revenue customer publicly disclosed; segmentation therefore emphasizes prospective first users and counterparties rather than closed accounts.
