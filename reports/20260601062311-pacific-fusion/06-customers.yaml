  title: No named power buyer has been disclosed
  body: Pacific Fusion has credible technical ambition and a sensible early-user program, but none of the reviewed public sources identified a named utility, hyperscaler, industrial power buyer, or signed PPA. Until that changes, customer diligence remains focused on prospective demand rather than on actual commercial adoption.
