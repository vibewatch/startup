- id: who-might-use-pacific-first
  title: Who might use Pacific first
  body: 'Pacific Fusion''s most plausible first user segments are not retail power buyers; they are entities that can extract value from an intense pulsed-power environment before the company proves plant-scale economics. Public materials point first to government and national-security users, because Pacific explicitly says it expects U.S. government collaboration on national-security-relevant applications. Second are academic and national-lab-adjacent researchers interested in high-energy-density physics, diagnostics development, and materials science. Third are industrial users with niche but valuable testing needs such as radiation-hardness qualification, high-flux materials evaluation, or potentially medical-isotope-related work.


    The Albuquerque site choice reinforces that interpretation. Pacific Fusion is building the DS at Mesa del Sol near Sandia National Laboratories, while its new project website emphasizes both the Research and Manufacturing Campus and the Los Lunas Build Center. The August 2026 groundbreaking and Fusion Summit are framed as an ecosystem event tied to energy and national security rather than as a customer-launch ceremony. This does not prove demand by itself, but it suggests the company is trying to assemble a regional cluster of researchers, suppliers, policymakers, and future users around the facility before any electricity sales exist.


    The challenge is that none of these early-use cases yet prove durable commercial willingness to buy fusion-generated power. Access programs can demonstrate interest, help refine requirements, and create reference relationships, but they are still several steps removed from long-dated offtakes or recurring revenue. Pacific Fusion therefore has a segmentation story, but not yet a conversion story.'
