  topStrengths:
    - >-
      Founding team and senior technical bench combine national-lab credibility, large-program execution, and
      pulsed-power expertise that few private fusion startups can match.
    - >-
      Pacific has published a more detailed and better corroborated technical record than most private fusion peers at a
      similar age, including peer-reviewed simulation work and Sandia experiment data.
    - >-
      The more-than-$900M milestone-based Series A gives the company unusual early runway and reduces near-term
      fundraising distraction relative to most deep-tech startups.
  topRisks:
    - >-
      No public post-money valuation, ownership sold, or preference stack is disclosed, making price discipline
      impossible from public information alone.
    - >-
      The first full Demonstration System pulser module remains unproven publicly, and plant-scale repeat-shot economics
      are still unknown.
    - >-
      Commercial proof is thin: there is no named power buyer or disclosed offtake, and future commercialization likely
      requires additional capital and successful regulatory execution.
  unresolvedGaps:
    - Series A term sheet, cap table, ownership sold, and liquidation preferences remain undisclosed.
    - Full-module performance, target cost per shot, and plant economics are not public.
    - Named external users, anchor buyers, or bankable commercialization counterparties have not been disclosed.
    - Detailed safety-case, licensing, and environmental-review work products are not public.
