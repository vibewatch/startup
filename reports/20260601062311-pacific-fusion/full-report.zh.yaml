companyProfile:
  summary: >-
    Pacific Fusion 创立于 2023 年，目标是用模块化阻抗匹配 Marx 发生器架构，将脉冲磁惯性聚变商业化。公司在旧金山湾区运营研发和制造配套园区，并在新墨西哥州 Albuquerque 建设 Research and
    Manufacturing Campus，在 Los Lunas 建设 Build Center。短期目标是完成首个完整 Demonstration System 脉冲器模块，并在 2030 年前实现净设施增益；长期目标是在
    2030 年代中期部署首个美国商业聚变系统。公开材料显示，在民营聚变公司中，Pacific Fusion 的科学披露异常充分，但业务仍处于无收入阶段，商业采纳仍是预期而非已验证。
