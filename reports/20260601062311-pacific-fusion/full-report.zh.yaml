          - type: callout
            title: DOE–NRC 政策一致，让净增益验证前的商业谈判成为可能
            body: >-
              ADVANCE Act 和 NRC 2026 年 2 月拟议的聚变机器规则制定，消除了过去占主导地位的不确定性——商业聚变的监管路径。DOE 的 Build–Innovate–Grow 战略得到 600
              多名利益相关方认可，并被置于现任政府的能源主导议程下，首次给出联邦层面对 2030
              年代中期商业聚变时间表的明确背书。合在一起，这些因素创造了一个政策环境，使公用事业费率申请、买方合同和聚变项目融资在净设施增益证明之前就具备结构性可能——这是形成商业动能的关键条件。
