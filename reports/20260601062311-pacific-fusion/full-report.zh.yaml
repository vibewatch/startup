      items:
        - label: Series A 已承诺（2024 年 10 月）
          value: 900
        - label: Phase I — Brick 和 Stage 原型（2024 年 11 月）
          value: -75
        - label: Phase II — 完整 IMG 模块
          value: -175
        - label: 示范系统建设（NM，约 2025-2030）
          value: -550
        - label: 应急 / 运营储备
          value: -100
        - label: 余额 / 需要追加融资轮
          value: 0
    approximationNotes: >-
      所有分期金额均为估计；Pacific Fusion 只披露 Phase I 已完成、Phase II 资助完整 IMG 模块。示范系统成本来自管理层表述（园区总额约 $1B，含州政府资助部分）。 余额行反映 Series A
      覆盖范围之外，商业规模部署大概率还需要追加融资轮。
