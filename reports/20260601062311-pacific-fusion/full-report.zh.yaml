      - number: '1.6'
        title: 里程碑与进展
        blocks:
          - type: paragraph
            body: >-
              成立不到三年，Pacific Fusion 已积累一组值得关注的里程碑。公司在 2024 年 11 月完成 Phase I 里程碑，比原定 2025 年 6 月进度约提前七个月，从而解锁 Series A
              的下一笔资金，并启动完整脉冲器模块（IMG）工作。Will Regan 在 2025 年 4 月 TechCrunch 独家报道中确认，公司已经开发必要的仿真模型，并完成 brick
              和级的原型，等完整模块验证后即可「复制粘贴」全套 156 模块系统。

              公司的 Sandia CRADA 在 2026 年 2 月产出独立发表的实验结果，标志着国家实验室合作方首次为 Pacific Fusion 的简化靶概念提供第三方印证。2025 年 1 月建立的 LLNL
              CRADA 则扩展了公司对 NIF 点火物理和仿真验证工具的使用。

              政策层面，DOE Fusion Science and Technology Roadmap（2025 年 10 月发布）把 2030 年代中期实现商业聚变列为国家战略目标，与 Pacific Fusion
              自身时间表一致。ADVANCE Act（2024 年 7 月）此前已把聚变置于副产物材料规则下，而非裂变反应堆规则，建立更轻量的监管框架，降低近期部署的监管风险。截至本章生成日期，未有公开披露显示 Pacific
              Fusion 涉及负面事件、高管离职、诉讼或监管执法。
