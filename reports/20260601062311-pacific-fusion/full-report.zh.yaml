      - number: '7.3'
        title: 资本、人员与投资逻辑破裂风险
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion 的融资结构好过多数深科技初创公司能拿到的条件，但这不等于资本充足性已经去风险。 $900M Series A
              预先承诺，并按里程碑释放，降低了近期融资需求。与此同时，分期资本仍是有条件资本。 进度滑坡、模块测试失败或监管延迟，都可能放慢提款、改变投资人行为，或迫使重新谈判预期。
              同时，商业电站几乎肯定需要当前轮次之外的资本，无论来源是新股权、项目融资、战略资本，还是与 DOE 相关的融资。


              人员风险也异常集中。Pacific Fusion 的公开身份和执行模型，与 Eric Lander、Will Regan 和 Keith LeChien 紧密绑定：分别对应政治 /
              科学可信度、里程碑结构化执行，以及技术架构。Bay Area 和 New Mexico 的招聘足迹显示，公司正在建设人才梯队，但没有公开的继任或治理框架说明公司如何吸收创始人流失。
              这很重要，因为关键技术或政策面高管离开时，投资人对前沿能源公司的信心可能突然改变。


              最清晰的投资逻辑破裂触发器都是可衡量的。如果 Pacific 不能按期验证完整脉冲模块， 不能显示一条通向经济上可重复发次的可信路径，监管路径假设恶化，或 DS 调试前后没有严肃锚定用户出现，
              投资案例会快速削弱。反过来也成立：完整模块得到演示、安全论证更清晰、早期具名用户承诺出现， 都会显著压缩风险折价。但就目前而言，剩余风险暴露仍高，Pacific 更像一个「密切跟踪、深入尽调」的情形，
              而不是低方差承销案例。
