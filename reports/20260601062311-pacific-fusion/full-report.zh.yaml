  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 资本结构与里程碑分期融资
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion 于 2024 年 10 月 25 日结束隐身，宣布由 General Catalyst 领投、超过 $900 million 的 Series A——这是聚变公司史上最大规模的
              Series A 之一，也跻身全球最大深科技 Series A 之列。 这一轮结构很特殊：全部资本预先承诺，以降低融资分心，但会随着公司达成预设技术里程碑分期拨付。
              这个模式借鉴了生物技术行业的里程碑融资；Will Regan 称，设计来自 General Catalyst、CEO Eric Lander 和 COO Carrie von Muench。

              General Catalyst 明确说明了理由：「资本确实是这些公司的命脉。对这类企业来说，频繁、零碎的融资可能让投资人和管理团队错位， 也会让公司暴露在负向融资周期中。」Pacific Fusion 于
              2024 年 11 月完成 Phase I 里程碑， 比原定 2025 年 6 月目标提前约七个月，从而解锁下一笔资金，用于建造完整脉冲模块（IMG）。 Fusion Advisory Services 的
              Simon Woodruff 指出，里程碑融资已经成为领先聚变公司中的标准做法， 与 DOE Milestone Program 相互平行。

              但「已承诺、未释放」结构带有实质性限制：$900M 的名义数字并不等同于无条件可用现金。 包括 Fusion Energy Insights 评论在内的行业观察者指出，错过里程碑可能迫使重新谈判；
              已经解锁的分期之外，完整 $900M 可能高估了公司实际能拿到的保证金额。Pacific Fusion 未披露投后估值、
              单笔分期规模，或每次拨付对应的具体里程碑触发条件——这些对评估资本充足性都很关键。公司也没有公开宣布任何债务、 可转债、项目融资或信贷额度；从 Series A 看，它似乎完全由股权资金支持。
