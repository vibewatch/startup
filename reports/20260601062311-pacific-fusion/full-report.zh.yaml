      - number: '2.3'
        title: 需求驱动：AI 基础设施、工业脱碳与能源安全
        blocks:
          - type: paragraph
            body: >-
              三股结构性力量定义了近期对稳定清洁电力的需求拉力，每股力量都催生不同买方群体、预算归属和采用触发点。

              第一，AI 基础设施扩张正在创造前所未有的连续电力负荷。Goldman Sachs Research 估计，当前全球数据中心市场约为 55 GW，并预计到 2030 年超过 130 GW；AI
              在数据中心总工作负载中的占比将从 14% 升至 2027 年的 27%。到 2030 年，美国数据中心预计消耗的电力将超过所有能源密集型制造业之和。2024–2025 年，发达经济体电力需求结束 15
              年停滞；美国和欧盟目前都进入 2% 以上的年增长轨道，主要由数字基础设施驱动。数据中心需要 24/7 正常运行，需要低碳资质来满足企业净零承诺，同时越来越受电网并网延误和许可瓶颈限制。Goldman Sachs
              估计，到 2030 年可能需要 $720B 电网投资来支撑数据中心扩张——这一约束催生了表后稳定电力解决方案需求。

              第二，工业脱碳压力正在创造对高温清洁工艺热和可靠工业电力的结构性需求。钢铁、水泥、铝、基础化工、航空、航运等难减排行业占全球温室气体排放近 40%，并面对要求显著脱碳的监管指令。全球工业脱碳市场预计到 2030
              年每年超过 $250B。电弧炉（EAF）炼钢作为低碳钢路线增长很快，每吨钢排放约 0.3 吨 CO2，而高炉路线为 2.2 吨，但它需要大量可靠清洁电力。Nucor-Helion 500 MW
              聚变电站合作——美国最大钢企签署协议，在自有钢厂开发一座聚变电站——说明工业买方正在主动寻找可再生能源之外的稳定清洁电力。

              第三，能源安全和供应链韧性越来越把稳定清洁电力定义为国家安全资产。DOE 在 Trump 总统 Unleashing American Energy 行政令下提出的 Build–Innovate–Grow
              战略，明确把商业聚变与重建美国能源主导地位和国内供应链相连。LLNL LIFT 倡议旨在连接国家实验室聚变科学和商业部门，反映联邦层面已认识到，聚变市场发展需要协调的公私投资。
