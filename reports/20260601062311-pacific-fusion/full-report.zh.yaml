      - number: '4.4'
        title: 财务披露状况与承销障碍
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion 的财务披露姿态符合一家私营、前商业化深科技公司：几乎没有常规财务指标公开可得。 公司未披露毛利率、EBITDA、烧钱速度、账上现金或单位经济模型。本次尽调期间，Pitchbook 的
              Pacific Fusion 页面因访问受阻（Cloudflare 限速）无法查看，因而不能通过第三方聚合平台独立核验累计融资或隐含估值。 FusionXInvest
              的报道位于付费墙之后。没有公开的投后估值；这与里程碑融资、预先承诺资本的结构相符， 因为这类结构不会形成传统 VC 意义上的定价事件。

              根据 Regulation D，以豁免发行方式融资超过 $1 million 的公司，必须在首次出售证券后 15 天内向 SEC 提交 Form D 通知。Pacific Fusion 2024 年 10 月
              Series A 交割应当触发这项申报； 公司的 Form D 数据会出现在 SEC 2024 年第四季度结构化数据集中。SEC Form D Data Sets 提供根据 Regulation D 下 Rule
              504、Rule 506(b) 和 Rule 506(c) 提交的豁免发行通知结构化数据。 本次尽调已抓取覆盖 2024 年第四季度至 2026 年第一季度的数据集，但二进制 ZIP 格式还需要进一步处理，
              才能提取 Pacific Fusion 的具体申报。Form D 会披露发行人名称、总发行金额、截至目前已售金额、 首次销售日期和豁免类型，但不会披露分期结构、里程碑时间表或投资人经济条款。Pacific
              Fusion 未申请公开发行， 并在私募证券豁免下运营，这与其前商业化阶段一致。

              结构性承销难题还被以下缺失进一步放大：已实现收入、已签客户合同、已披露商业价格、Demonstration System
              的独立工程成本验证、氚供应链经济性，或经独立审计的财务报表。传统尽调承销需要的每一项重要财务指标， 在当前阶段要么是私密信息，要么尚未商业化，要么结构上不可得。
