            title: Users Program EOI 转化和 NRC 规则制定是两项领先市场指标
            body: >-
              Pacific Fusion 市场牵引的两个最重要领先指标是：（1）Users Program 的意向表达能否在净设施增益（2030 年）之前，转化为来自可识别 AI 和工业买方的已签研究协议或商业
              LOI；（2）NRC 能否最终确定拟议聚变机器规则，且不加入会显著增加许可成本或复杂度的不利修改。2030 年前规则落定，并至少拿到一个锚定买方 LOI，将大幅降低商业市场叙事风险，并支撑估值上行。
