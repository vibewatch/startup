      - number: '2.5'
        title: 采用约束与反向证据
        blocks:
          - type: paragraph
            body: >-
              在需求顺风之外，Pacific Fusion 仍面对实质采用约束，任何诚实的市场预测都必须纳入这些因素。

              最根本的约束是时间表可信度。聚变公司的乐观排期有明确历史记录。MIT Technology Review 在 2023 年 5 月关于 Helion Energy 的报道中称，多名独立核能专家质疑 Helion
              五年商业化时间表是否可实现，并指出该公司当时尚未确认其装置实现净能量增益。虽然批评指向
              Helion，但结构性挑战适用于每一家聚变开发商：先证明净增益，再证明工程概念，再扩大到商业生产，且都要在十年时间表内完成。Pacific Fusion 自身商业化路径从成立（2023
              年）到首个商业系统（2030 年代中期）约 12 年，关键科学里程碑（2030 年前实现净设施增益）仍在前方。

              第二个约束是替代技术日趋成熟。IEA 预计，到 2030 年，可再生能源和核电将供应全球 50% 电力（2025 年为 42%）。先进裂变
              SMR、增强型地热和长时储能都在接近商业部署，可能在聚变达到商业规模前，从数据中心和工业买方手中拿走相当一部分稳定清洁电力需求。如果这些方案在技术和经济上足够可行，第一代聚变可服务窗口可能小于总稳定清洁电力
              TAM 所暗示的空间。

              第三个约束是 Pacific Fusion 目前完全缺乏商业证明。公司没有收入，没有已签购电协议，没有有约束力的商业客户关系，也没有公开证据显示 Users Program 意向表达流程之外的买方需求。所有用于
              Pacific Fusion 的市场规模测算都是前瞻性的，取决于技术里程碑能否达成，以及商业需求能否按兼容时间表出现。
