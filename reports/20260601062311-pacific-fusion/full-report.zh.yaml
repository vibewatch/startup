      - number: '3.2'
        title: 直接竞争对手画像
        blocks:
          - type: paragraph
            body: >-
              Commonwealth Fusion Systems（CFS）是规模最大、资本化程度最高的民营聚变公司。CFS 于 2018 年从 MIT 分拆成立，累计融资接近 $3B；其 2025 年 8 月 $863M
              Series B2，是自 2021 年自身 $1.8B Series B 之后最大的深科技能源融资。CFS 的 SPARC 示范 tokamak 正在马萨诸塞州 Devens 建设，目标是在 2027
              年实现净聚变能量（Q>1）。SPARC 使用与 MIT 共同开发的高温超导（HTS）磁体，并由 CFS 在 Devens 工厂内部制造，形成显著制造护城河。后续 ARC 商业电站计划落地 Virginia 州
              Chesterfield County，目标在 2030 年代初输出约 400 MW。Google 已签署从 Virginia ARC 购买 200 MW 电力的购电协议，并增加对 CFS 的股权投资，使
              Google 成为该领域首个商业聚变承购客户。CFS 还与 Dominion Energy 建立战略合作。

              Helion Energy 成立于 2013 年，总部位于华盛顿州 Everett，运营第七代 Polaris 原型机。2025 年 1 月，Helion 完成超额认购的 $425M Series
              F，使总投入资本超过 $1B，投后估值达到 $5.425B。2026 年 1 月，Polaris 成为首个证明可测量氘氚（D-T）聚变、并实现 1.5 亿摄氏度等离子体温度的民营聚变机器，打破 Helion
              自身行业纪录。Helion 拥有全行业最深的商业牵引：与 Microsoft 签署 50 MW 购电协议（目标 2028 年），并与 Nucor 签署 500 MW 开发协议，目标在 2030
              年代运营。Helion 首台商业机器 Orion 已于 2025 年 7 月在华盛顿州 Malaga 开工建设。Helion 的 Field-Reversed
              Configuration（FRC）路线瞄准直接电力转换，绕开大多数竞争对手使用的蒸汽轮机循环。

              TAE Technologies 成立于 1998 年，总部位于加州 Foothill Ranch，已在十多轮融资中筹集超过 $1.3B。其 2025 年最新一轮超过 $150M，投资方包括
              Google、Chevron Technology Ventures 和 NEA。TAE 的 Norm 研究反应堆首次证明，仅靠中性束注入（NBI）即可形成 FRC 等离子体；这一突破让 TAE
              缩短路线图，跳过原计划的 Copernicus 装置，直接推进 Da Vinci 原型商业电站，目标在 2030 年代初建成。TAE
              的氢硼（p-B11）燃料路径不产生中子，也不产生长寿命放射性废物，但所需等离子体温度约为 D-T 聚变的十五倍，且尚未在商业相关规模上证明。

              Zap Energy 总部位于华盛顿州 Everett，采用剪切流稳定 Z-pinch，通过电流驱动压缩实现等离子体约束，完全不需要超导磁体或激光系统。2026 年 5 月，DOE 在
              Milestone-Based Fusion Development Program 下批准 Zap 的预概念设计里程碑，描述其电站每个模块可产生约 50 MW 净电力输出。Zap
              还在开发一个整合裂变、聚变和混合技术的核能平台——相比纯聚变玩家，这是更宽的技术对冲。公司未披露商业承购协议。

              General Fusion 成立于 2002 年，总部位于加拿大 British Columbia 省 Richmond，采用 Magnetized Target
              Fusion（MTF），通过机械压缩带液态金属衬里的等离子体腔体来实现聚变。其 Lawson Machine 26（LM26）是行业首台大型 MTF 示范机器，2025 年 2 月实现首次等离子体，2025 年
              4 月实现首次等离子体压缩。General Fusion 于 2025 年 8 月融资 US$22M——显著小于同行——用于推进 LM26 达成一系列 Lawson 判据里程碑，并以 2035
              年左右运营首台首创电站为目标。液态金属壁承担三重功能：中子屏蔽、氚增殖和热提取，从而避开昂贵的超导磁体。
