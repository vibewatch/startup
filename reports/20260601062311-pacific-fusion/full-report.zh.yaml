  - id: TV005
    title: 击穿投资逻辑与终止触发项表
    columns:
      - 触发项
      - 阈值
      - 如何击穿逻辑
      - 行动含义
    rows:
      - - 全模块失手
        - 首个 DS 脉冲器模块显著延期或反复失败
        - 击穿复制逻辑，并削弱时间线可信度
        - 不支持溢价估值假设
      - - 经济性仍不透明
        - 模块验证后仍没有可信靶体成本 / 打靶节奏模型
        - 科学可能跑通，但商业模式不具备可投资性
        - 建议维持继续研究或回避
      - - 监管 / 融资负担上升
        - 开发商义务或资本需求重于假设
        - 折现率上升，时间线拉长
        - 要求更低入场价格，或退出
      - - 没有锚定用户
        - DS 临近调试时仍没有具名外部用户或买家
        - 商业转化仍未验证
        - 将 Pacific 视为科学驱动的期权价值，而非商业资产
      - - 激进股权结构条款
        - 投资条款清单显示高隐含估值，或对投资人不友好的优先股堆叠
        - 即使技术很强，回报结构也会恶化
        - 除非价格重置，否则放弃
    notes: 终止触发项是投资判断阈值，不是运营愿望清单。
    claimRefs:
      - CV028
      - CV029
      - CV030
      - CV037
      - CV039
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - Series A 投资条款清单
        - 投后估值、出售股权比例、清算优先权
        - 没有价格和结构，就没有真正的估值判断
        - 向公司 / 领投方索取投资条款清单
      - - 股权结构表
        - 当前持股、期权池、按比例跟投权和优先股堆叠
        - 回报建模取决于真实股权结构
        - 索取股权结构表和融资备忘录
      - - 分期款时间表
        - 里程碑定义和释放机制
        - 附条件资本可能比新闻标题暗示的更快收紧
        - 索取里程碑矩阵和资金释放规则
      - - 全模块数据
        - 验收标准、可靠性和故障分析
        - 商业化的关键技术关口
        - 索取 Phase II 技术包
      - - 靶体 / 电厂经济性
        - 单发靶体成本、节奏、产出和电厂假设
        - 严肃定价纪律必须依赖它
        - 索取经济性模型和工程假设
      - - 交易对手
        - 具名用户、访问协议或电力买家触达
        - 商业验证是一个重大缺失锚点
        - 索取项目管线和客户访谈
    notes: 这些问题按对估值判断的改变幅度排序，而不是按收集难度排序。
    claimRefs:
      - CV038
      - CV039
