      - number: '6.2'
        title: 谁可能率先使用 Pacific
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion 最可能的首批用户并不是零售电力买方，而是在公司证明电站级经济性之前， 就能从强脉冲功率环境中获得价值的实体。公开材料首先指向政府和国家安全用户， 因为 Pacific
              明确表示，预计会在国家安全相关应用上与美国政府合作。第二类是关注高能量密度物理、 诊断开发和材料科学的学术界及国家实验室邻近研究者。第三类是有小众但高价值测试需求的工业用户，
              例如抗辐射资格验证、高通量材料评估，或潜在的医用同位素相关工作。


              Albuquerque 选址强化了这一判断。Pacific Fusion 正在 Sandia National Laboratories 附近的 Mesa del Sol 建设 DS，而新项目网站同时强调
              Research and Manufacturing Campus 和 Los Lunas Build Center。 2026 年 8 月的破土动工和 Fusion Summit
              被包装成与能源和国家安全相关的生态活动， 而不是客户发布仪式。这本身不能证明需求，但说明公司正在尝试在任何电力销售出现之前， 围绕设施聚合研究者、供应商、政策制定者和未来用户的区域集群。


              难点在于，这些早期用例还不能证明客户有持久的商业意愿购买聚变发电。访问项目可以展示兴趣、 帮助打磨需求、建立参考关系，但距离长期包销或经常性收入仍有数步之遥。因此 Pacific Fusion 有细分叙事，
              但还没有转化叙事。
