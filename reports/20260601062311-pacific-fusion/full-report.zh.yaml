  - id: FU001
    title: Pacific Fusion 早期客户旅程图
    type: journey-map
    layout: wide
    summary: 从潜在需求走到 Demonstration System 外部使用，大概率仍是一连串生态搭建动作，不是已经跑起来的销售漏斗。
    data:
      items:
        - label: 需求浮现
          detail: 政府、学术或工业用户发现自己需要极端 HED 环境、诊断能力，或未来稳定清洁电力。
          touchpoints:
            - AI / 电力需求增长
            - 国家安全 HED 工作
            - 工业脱碳需求
        - label: 认知建立
          detail: Pacific Fusion 通过 PFUP、项目场地信息和 New Mexico 生态活动推广 DS。
          touchpoints:
            - PFUP 公告
            - 用户网站
            - 奠基仪式与 Fusion Summit
        - label: EOI / 概念阶段
          detail: 潜在伙伴在设施调试投运前提交意向书，并与 Pacific Fusion 讨论技术需求。
          touchpoints:
            - EOI 受理
            - 伙伴讨论
            - 概念细化
        - label: 提案 / 配额
          detail: Pacific 称，后续征集提案时，会让实验安排匹配 DS 调试投运时间表。
          touchpoints:
            - 提案征集
            - 诊断规划
            - 设施排期
        - label: 外部实验
          detail: DS 投运后，一部分设施时间会分配给非 Pacific 实验。
          touchpoints:
            - 实验时段
            - 数据采集
            - 可引用成果
        - label: 商业拓展
          detail: 如果 Pacific 跑通经济性，成功用户可能转成标杆客户、战略伙伴，或未来购电方。
          touchpoints:
            - 标杆客户
            - 战略伙伴
            - 未来承购
