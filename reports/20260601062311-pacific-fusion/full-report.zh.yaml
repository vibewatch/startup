chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与使命
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion 是一家美国私营聚变能源公司，成立于 2023 年夏天，公开使命是「用充足、可负担、清洁的能源为世界供能」。公司总部位于旧金山湾区，运营一组加州研发园区，并计划在新墨西哥州
              Albuquerque 建设 Research and Manufacturing Campus。Pacific Fusion 将自身定位为尚无收入、尚未商业化的公司，目标是在十年以上周期内推进商业聚变发电。

              公司的短期里程碑是在 2030 年前实现净设施增益，即聚变能量输出超过全部储能输入；该目标将由新墨西哥园区专门建设的 Demonstration System
              承担。其商业产品构想是可规模化制造的脉冲功率聚变系统，目标是在 2030 年代中期交付美国首个商业聚变系统。Pacific Fusion 的技术主张是，其 Demonstration System 相比
              Lawrence Livermore National Laboratory 的 National Ignition Facility（NIF）设施增益高 100 倍、成本低 10 倍，合计声称实用聚变性能提升
              1,000 倍。

              Pacific Fusion 在 2023 年成立，直接受到两项标志性科学里程碑推动：NIF 在 2022 年 12 月实现聚变点火，以及 Sandia National Laboratories 的 Z
              Machine 创下脉冲磁聚变历史最高性能。公司明确把自己定位为商业化载体，承接美国国家实验室 50 年来在惯性约束聚变和脉冲功率工程上的投入。
