      - number: '4.3'
        title: 成本结构与资本强度
        blocks:
          - type: paragraph
            body: >-
              即便按聚变行业标准看，Pacific Fusion 的资本强度也很高。公司已承诺在 New Mexico 州 Albuquerque 的 Mesa del Sol 建设 $1 billion 的 Research
              and Manufacturing Campus，容纳以 2030 年实现设施级净增益为目标的 Demonstration System。 破土动工计划安排在 2026 年 8 月 24–29
              日这一周。园区将在多年建设期内创造 200 个长期岗位和数百个施工岗位。 与此同时，公司在 California 运营五处设施，包括用于脉冲模块制造研发的 135,000 平方英尺 San Leandro
              Build Center、Fremont Headquarters and Test Center，以及 Livermore Collaboratory。

              2024 年 10 月结束隐身后的十二个月内，California 员工数大约增长三倍，超过 110 人。虽然公司没有披露月度烧钱速度， 但一个多地点 R&D
              运营体系、这一级别员工数和设施规模，再叠加脉冲功率工程任务，意味着每年数千万美元级支出； New Mexico 园区建设还会推动额外资本投放。公司称其 Demonstration System 成本将比 NIF
              低 10 倍 （NIF 估计建设成本约 $3.5B），但没有独立成本估计发布，也没有披露 $/W 或 $/MWh 指标。

              成本结构还包括多项没有公开数据的直接和间接项目：氚供应（每次发次用量小，但长期供应是挑战）、 靶耗材（每次聚变发次都需要一个新的燃料筒）、脉冲模块资本成本，以及设施级运营开销。 Pacific Fusion
              称其燃料「远比化石燃料便宜」，但没有给出成本模型。在资本侧，Albuquerque 的 $776 million 工业收入债券发行提供了 20 年房产税减免——这是真实的财务补贴，
              可以降低持续占用成本，但不能抵消建设资本开支。
