      - number: '2.6'
        title: Pacific Fusion 在市场结构中的位置
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion 以尚未商业化开发商身份进入稳定清洁电力市场，所在子类别是惯性约束聚变（脉冲磁）——这是 LLNL 的 NIF 点火科学最直接的商业延伸。该定位让公司与基于 tokamak
              的开发商（Commonwealth Fusion Systems、TAE Technologies）以及场反位形路线（Helion Energy）处于不同技术生态位。2025 年 4 月，LLNL 的 NIF
              实验用 2.08 MJ 激光输入实现创纪录的 8.6 MJ 聚变能量输出——靶增益超过四——确认了支撑 Pacific Fusion 路线的惯性聚变科学谱系。LLNL 的 LIFT
              倡议正是为商业化这一科学基础而设。

              分析师分层（The Business Research Company）把惯性约束聚变列为四大聚变市场子类别之一（另外三类是磁约束、stellarator 和 spheromak），其中脉冲功率
              ICF（Z-pinch 家族）是与 Pacific Fusion
              路线最接近的技术类比。近期市场结构不是赢家通吃：公用事业买方、数据中心运营商和工业客户会与最早交付可靠、经济上有竞争力基荷电力的开发商签约，多种聚变路径也可能在不同市场生态位和地理区域共存。

              LLNL 研究人员估计，商业聚变可能让全球 GDP 增加 $68T，并创造一个万亿美元级产业，配套新供应链和劳动力需求——这把 Pacific Fusion 定义为潜在基础设施级平台，而非小众能源技术。Users
              Program 是 Pacific Fusion 在净设施增益之前建设商业需求管线的首次尝试，目标对象包括需要使用 Demonstration System 开展商业化前研究的政府机构、AI
              公司和工业研究人员。2030 年前将 Users Program 意向表达转化为有约束力的研究协议或承购协议，是近期最主要的商业证明点。
