  - id: FM001
    title: 市场规模测算视角
    type: pyramid
    layout: standard
    summary: 基于 IEA 需求数据和竞品类比，将全球稳定清洁电力市场拆成从 TAM 到 Pacific Fusion 近期可触达收入的四层结构。
    data:
      items:
        - label: 全球 TAM — 2030 年代中期的稳定清洁电力（电力 + 工业过程热）
          description: 全球对全天候无碳电力和高温工业过程热的总需求；当前由化石燃料和传统核电供给。IEA 预计 2030 年总用电需求为 33,600 TWh/yr；聚变如果实现全面商业化部署，理论上可切入每年数万亿美元级机会。
          value: $2–3T+/yr (projected at full commercial scale)
        - label: 发达经济体 SAM — 2035 年前新增稳定清洁电力需求（AI、工业电气化）
          description: 美国、欧盟及盟友国家的新增全天候清洁电力和过程热需求，来自 AI 数据中心（2030 年达到 945 TWh/yr）、工业脱碳（每年 >$250B 市场）和能源安全要求；第一代商业聚变开发商可触达。
          value: $300–600B/yr (analyst-estimated new load)
        - label: 已验证的类比需求 — 先行聚变买家（2030–2035）
          description: 已确认的商业类比支撑需求：CFS-Google 200 MW PPA、Helion-Nucor 500 MW 工业电站；DOE 通过 CRADA 形成国家安全研究管线； 基于当前聚变买家承诺做保守外推。
          value: $10–50B/yr (analog-supported)
        - label: Pacific Fusion SOM — 首套商业系统初始收入潜力（2030 年代中期）
          description: 来自首套商业系统和 Users Program 锚定合同的收入；初始部署受示范能力和单站点占地约束。截至运行日期，Pacific Fusion 没有公开收入，也没有已签商业协议。
          value: < $1B/yr (initial; no public evidence)
    approximationNotes: >-
      TAM 和 SAM 估计是分析师约束后的预测，来源包括 IEA Electricity 2026、Goldman Sachs 数据中心研究和工业脱碳市场报告；目前不存在聚变专项商业收入。 SOM
      是概念边界，不是财务预测。所有层级都是估计，置信区间很宽。
