      - number: '5.2'
        title: 架构与运行模式
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion 的架构以阻抗匹配的 Marx 发生器脉冲模块为中心，将快速、精确定时的电脉冲释放到小型一次性靶中。 TechCrunch 2025 年 4 月的描述和 Pacific Fusion
              自身技术更新称，每个模块由 32 级重复组件构成， 每级有 10 个 brick；每个 brick 包含一个开关和两个电容。公司计划让约 156 个模块协同工作； 后来 General Atomics
              合作公告中的说法约为 150 个模块，目标是在约 100 纳秒内输出约 2 太瓦。 模块化设计的重点不只是高峰值功率，也在于可制造性：管理层反复表示，只要一个完整模块跑通，
              剩余模块集群就应主要是复制和生产问题，而不是重新发明问题。


              在靶这端，公司试图相对 Sandia 传统 MagLIF 路线简化发次架构。2026 年 2 月 Sandia 结果显示，
              塑料-铝复合靶可以让磁场在没有一次性外部磁线圈的情况下扩散进靶体，从而去掉商业机器在频繁重复发次中面临的一大成本和可维护性障碍。 Pacific Fusion 还称，已经验证的 FLASH
              模拟工具现在让公司能更有把握地设计这些靶， 包括不仅取消外部预磁化硬件、最终也取消激光预加热的路径。


              运营上，Pacific Fusion 正围绕分布式制造与测试模型建设。Fremont 是首台套测试中心； San Leandro 是制造 R&D 建造中心；Livermore 提供模拟能力和国家实验室近场优势；
              Albuquerque 与 Los Lunas 计划成为 Demonstration System 和组件生产的放大园区。 2025 年 4 月 General Atomics
              公告显示，运营模式会延伸到内部建造能力之外：GA 正在协助工程、 原型测试、规模化、低温、运营和靶制造，这意味着 Pacific Fusion 很可能通过高度整合的供应与合作伙伴生态来商业化，
              而不是靠纯垂直一体化技术栈。
