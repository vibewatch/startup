  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              相比裂变开发商，Pacific Fusion 受益于更友好的美国监管方向，但框架仍在演进，也没有消除首台套许可风险。 核心变化——已由 ADVANCE Act 写入法律，并由 NRC
              规则制定进一步展开——是聚变机器正被纳入副产品材料框架监管， 而不是按裂变反应堆规则监管。这降低了门槛，但也意味着 Pacific 需要围绕氚控制、放射性物料核算、
              应急程序、废物处理和退役，承担一套基于性能的安全论证。多份法律分析强调，拟议规则给了灵活性， 同时也把分析负担转移给开发商。


              第二个风险是监管差异。NRC 评论和律所分析都指出，许多早期聚变设施可能由 Agreement States（协议州）许可， 而不是由 NRC
              直接许可。这可能在支持性司法辖区创造更快的本地路径，但也引入能力和流程不均的风险。 一家建设十亿美元演示园区的公司，不能把州级许可执行当成行政细节。Pacific Fusion 在 New Mexico
              的建设因此不只是联邦政策问题，也取决于州项目准备度，并与地方政治、许可和环境审查绑定。


              最后，框架在实践中仍不完整。NRC 拟议规则和相关指南指向若干未决问题：氚阈值、 聚变特有活化产物的废物处置路径、出口管制边界，以及环境审查在什么规模上加深。 因此，Pacific 的法律 /
              监管风险低于裂变初创公司，但仍显著高于多数通用型风险投资人在听到「监管更轻」时可能假设的水平。
