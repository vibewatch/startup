  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 聚变竞争格局
        blocks:
          - type: paragraph
            body: >-
              民营聚变已经进入清晰的商业化阶段。Fusion Industry Association 的 2025 年全球行业报告统计，全球活跃民营聚变公司超过 40 家，私人投资总额接近 $9B，政府出资同比增长
              84%，接近 $800M。五家公司是 Pacific Fusion 在稳定、可调度、清洁电力市场的主要直接竞争对手：Commonwealth Fusion Systems（CFS）、Helion
              Energy、TAE Technologies、Zap Energy 和 General Fusion。每家公司都采用根本不同的约束物理，这既带来竞争差异，也带来哪条路线最终商业上更优的真实不确定性。

              Pacific Fusion 所在赛道资本集中度很高：仅 CFS 就已融资接近 $3B，约占民营聚变历史总投资的三分之一；Helion 融资超过 $1B、估值
              $5.4B，是该领域第二大资本化纯聚变公司。Pacific Fusion 的 $900M Series A
              是该领域第三大单家公司融资，但资金按里程碑分批释放，而不是不受限制地部署。现状替代方案——天然气联合循环电站、小型模块化裂变反应堆、带储能的可再生能源——也构成真实竞争，因为聚变公司最终要赢的是稳定电力采购决策。到
              2030 年代，任何商业聚变电站要取代现有方案，都必须把电力成本压到天然气设定的 $40–80/MWh 平准化成本基准或以下。

              竞争分析必须保留一个关键张力：所有聚变时间表都是由物理模型和原型结果支撑的估计，而不是已验证的商业运营。MIT
              气候专家和核科学家多次指出，聚变时间表历史上经常滑坡五到十年甚至更久。这一系统性模式适用于本分析中的每一家公司，也包括 Pacific Fusion。
            claimRefs:
