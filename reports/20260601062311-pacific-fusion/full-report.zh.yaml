      - number: '3.3'
        title: 商业化牵引与客户位置
        blocks:
          - type: paragraph
            body: >-
              在每一个可公开衡量的维度上，Pacific Fusion 的商业位置都弱于直接聚变竞争对手：没有购电协议，没有披露承购客户，也没有选定商业场址。公司面向公众的需求证明是 Users Program，这是 2025
              年启动、面向外部研究人员和潜在工业用户的意向表达流程。相比之下，CFS 和 Helion 已有有约束力的商业关系。

              CFS 拥有已披露最大聚变承购：Google 从 Virginia ARC 电站购买至少 200 MW 的 PPA，条件与 SPARC 实现 Q>1 绑定。这让 Google
              同时成为投资人、研发合作方和已承诺承购方，形成一种独特的相互强化商业结构。Helion 有两项商业承诺：Microsoft 的 50 MW 聚变设施 PPA，目标 2028 年交付；Nucor 的 $35M
              股权投资，加上一项向钢铁制造设施供应 500 MW 的开发协议。这些承诺覆盖超大规模数据中心和工业脱碳两个板块，而 Pacific Fusion 也在简报材料中把它们列为核心市场。

              时间表压缩是重要竞争变量。Pacific Fusion 的 Phase I 里程碑已在 2024 年 11 月提前完成，解锁 Series A 下一笔资金。CFS 目标是 2027 年实现 SPARC
              Q>1，并在 2030 年代初交付 ARC 商业电力。Helion 目标是在 2028 年交付 Orion 首电。Pacific Fusion 目标是 2030 年实现净设施增益，并在 2030
              年代中期交付首个商业系统——大约比商业领先者晚 3–5 年。TAE 目标是在 2030 年代初让 Da Vinci 商业运营。General Fusion 目标是在 2035 年左右建成首台首创电站，与
              Pacific Fusion 相当。

              全行业定价基准都带有推测性：没有任何聚变公司披露未来电力输出的每 MWh 合同价格。CFS 的 ARC 表示目标是成为「可在任何地方部署的最低成本、清洁、稳定电力来源」，但未披露价格。天然气 CCGT
              目前在美国设定约 $40–80/MWh 平准化成本的稳定电力基线，而 SMR 裂变项目估计平准化成本更高，为 $80–130/MWh，但具备无碳属性。由于尚无聚变电站投入运营，这一比较天然具有推测性。
