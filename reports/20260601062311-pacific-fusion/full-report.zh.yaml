      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion 由五人共同创立，互补专长覆盖大科学项目领导、能源政策、脉冲功率工程、深科技运营和计算物理。Eric Lander 是 CEO 兼联合创始人，最知名的经历是共同领导国际 Human
              Genome Project，并在 Biden 总统任内担任白宫 Office of Science and Technology Policy
              主任和总统科学顾问。他的公众信誉，以及吸引机构资本和政府合作的能力，是公司外部定位的核心。

              Will Regan 是总裁兼联合创始人，拥有 ARPA-E 项目管理经验，曾开发 Accelerating Low-Cost Plasma Heating and Assembly（ALPHA）项目，也在
              Alphabet X 创立 Mineral 农业科技项目。Keith LeChien 是 CTO 兼联合创始人，曾任 LLNL 脉冲磁聚变负责人和 National Nuclear Security
              Administration（NNSA）惯性约束聚变主任。他也是阻抗匹配 Marx 发生器（IMG）的共同发明人，IMG 是公司脉冲器架构的核心技术。

              Carrie von Muench（COO 兼联合创始人）和 Leland Ellison（联合创始人、仿真与建模负责人，前 LLNL 计算物理学家）补齐创始团队。高级技术招聘包括 Nathan
              Meezan（靶设计负责人，在 LLNL 的 NIF 靶团队工作 20 多年）、Alex Zylstra（实验负责人，达成点火的 NIF 首席实验人员）和 Sachin Desai（总法律顾问，曾任职
              Helion）。治理层面有三名投资人董事：Hemant Taneja（General Catalyst）、Eric Schmidt（前 Google CEO）和 Patrick Collison（Stripe
              联合创始人）。独立董事、科学顾问委员会或薪酬结构均未公开披露。
