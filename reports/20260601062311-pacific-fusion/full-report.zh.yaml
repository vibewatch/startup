      - number: '2.4'
        title: 政策与监管背景
        blocks:
          - type: paragraph
            body: >-
              2024–2026 年间，商业聚变的政策和监管环境明显转向有利于 Pacific Fusion，降低了过去占主导地位的结构性风险。

              最关键的变化是 ADVANCE Act（2024 年 7 月 9 日生效）。该法正式把聚变机器纳入 NRC 的副产物材料监管框架——也就是适用于粒子加速器的同一比例化制度——而不是更重的裂变反应堆监管。NRC
              的决定经国会确认，基础在于聚变机器不依赖自维持链式反应，产生的放射性废物也显著少于裂变反应堆。25 年多来，Agreement States 一直在这一框架下安全监管聚变研发系统。

              NRC 于 2026 年 2 月 26 日发布拟议规则，就技术中立的聚变机器监管框架启动 90 天公众意见期。NRC 的 Vision and Strategy（Revision 1，2026 年 1 月 7
              日）确立五项监管原则——清晰、高效、独立、可靠、开放——以及三大战略重点：监管优化、技术准备，以及与 DOE、NNSA、Agreement States 和国际同行建立伙伴关系与协调。NRC
              还在研究商业聚变机器设计的规模化生产许可框架。

              行政和立法层面，DOE Fusion Science and Technology Roadmap（2025 年 10 月）在 600 多名研究人员和行业利益相关方参与下确立
              Build–Innovate–Grow 战略，明确瞄准 2030 年代中期交付商业聚变电力。DOE Office of Energy Dominance Financing 和 Title 17
              清洁能源贷款担保计划拥有 IRA 支持的额外 $40B 授权，可为符合条件的聚变设施项目提供潜在资本通道。ARPA-E BETHE
              项目已为低成本聚变路径提供联邦资金，其中包括脉冲功率概念。截至本次报告日期，政策环境与 Pacific Fusion 的商业时间表高度一致。
