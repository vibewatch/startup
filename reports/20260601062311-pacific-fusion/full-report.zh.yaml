      - number: '8.3'
        title: 建议、价格纪律与尽调问题清单
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion 的公开建议应为「继续研究」。这不是对公司的负面判断，而是估值纪律判断。Pacific 拥有聚变领域最可信的创始团队之一；作为私营公司，它的技术披露少见地透明；Sandia 和
              General Atomics 提供了有分量的验证，融资规模也足以让项目继续推进。这些都是真优势。不过，公开估值锚仍然缺失，可压力测试的收入模型还没有，商业买方验证也不及部分同行已经拿出的证据。


              这组事实意味着，投资人应该愿意跟踪，而不是盲目承销。如果私下尽调显示隐含投后估值适中、股权结构干净、优先权条款合理、完整模块排期可信，并且早期用户或买方承诺可靠，Pacific
              可能值得以深科技溢价切入。反过来，如果尽调发现隐含投后估值很高、优先股堆叠激进，或本轮之外仍有未解决资本需求，即便科学故事漂亮，远期回报也可能很差。


              换句话说：Pacific Fusion
              只有在价格和结构能补偿仍然缺失的事实链时，才像一个可投平台。在那之前，立场应保持对价格和证据都敏感。近期观察项很清楚：完成首个完整脉冲器模块，披露更多电厂层面经济性和安全细节，拿出具名外部用户或交易对手，并披露足够融资条款，把当前叙事转成可承销案例。
