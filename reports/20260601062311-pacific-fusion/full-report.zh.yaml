      - number: '8.2'
        title: 可比公司组与情景分析
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion 最接近的公开可比锚点，不是成熟电力公司的收入倍数，而是相对其他私营聚变开发商的里程碑调整比较， 再加上稳定清洁电力的宏观需求背景。仅按融资规模看，Pacific 已处于精英梯队。
              Commonwealth Fusion Systems 宣布 $863M Series B2，并称累计融资接近 $3B；Helion 宣布 $425M Series F； TAE 宣布 $150M
              融资；General Fusion 宣布规模小得多的 $22M 融资，用于支持 LM26。 因此，Pacific 的 >$900M 轮次在市场早期轮次一端处于行业领先。


              但已融资本身只讲了一半故事。有些同行公开商业证据更强。CFS 有来自 Google 的 200 MW 包销， 也有更清晰的 SPARC 到 ARC 路径；Helion 有 Nucor
              这个战略工业交易对手，以及规划中的 500 MW 部署概念；Zap 有 DOE 批准的试点电站预概念设计里程碑；General Fusion 正在运行 LM26 作为演示机器。 相比之下，Pacific
              拥有异常强的公开技术文档和充足弹药，但没有具名购电方、没有完整模块证明， 也没有披露商业融资结构。这一缺口意味着估值折价应比原始名义融资规模暗示的更重。


              因此，情景视角取决于里程碑转化。乐观情景下，Pacific 验证完整脉冲模块，把 Users Program 转化为可信的早期锚定关系，并披露能说明入场估值可控的条款。基准情景下，科学继续推进，
              但价格仍未披露、客户证据仍薄，正确答案是「继续尽调，不要按名义融资规模承销」。悲观情景下， 模块表现或进度滑坡，下一轮融资被定成降价轮，或稀释大幅加重。由于公开证据尚未判断哪条分支会占主导，
              估值立场应保持未知，而不是假装精确。
