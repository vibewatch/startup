  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 什么会改变判断
    rows:
      - - 如果模块架构能规模化，早期科学严谨性也能转成真实设施表现，Pacific 可能成为定义品类的稳定电力平台。
        - 全模块验证、发电厂经济性更清晰、具名锚定用户出现，会显著强化投资逻辑。
      - - '>$900M Series A 给 Pacific 的现金跑道长过多数聚变初创公司，可能让它跑赢资本市场波动。'
        - 如果披露显示资金获取比预期更有条件，或更早需要未来资本，投资逻辑会被削弱。
      - - 如果聚变跑通，电力、AI 和工业脱碳的宏观趋势会打开巨大的长期市场。
        - 如果其他稳定电力技术先拿下这些买家，宏观上行就不再那么属于 Pacific。
      - - 反向逻辑：Pacific 可能是一个出色科学项目，但买在不具吸引力的价格上，且买方验证有限。
        - 较低隐含投后估值、干净条款和真实交易对手会削弱反向逻辑。
      - - 反向逻辑：全模块和单发经济性风险可能把商业化推迟到公开时间线之后很久。
        - 按时完成全模块验证，并给出可信成本假设，可反驳这一担忧。
    notes: 本表刻意对价格敏感：公司质量和入场质量分开看。
    claimRefs:
      - CV023
      - CV024
      - CV025
      - CV028
      - CV029
      - CV030
      - CV036
      - CV037
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 全模块按计划跑通；早期用户成为可背书交易对手；隐含投后估值落在偏低至中等情景区间
        - 科学水平领跑行业的平台若隐含价格处于低到中等区间，可能支撑风投式上行空间
        - 规模化、废弃物和买方转化仍然很难
        - 需要近期拿下多个技术胜利
      - - 基准
        - 技术继续推进，但公开层面没有清晰价格发现或客户验证
        - 公开投资人应保持继续研究，因为现有证据无法支撑价格
        - 叙事跑在投资判断前面，只能保持耐心
        - 最符合当前公开记录
      - - 悲观
        - 模块或进度延误；未来融资提前或稀释更重；买家没有出现
        - 高隐含价格叠加延误，形成糟糕的前瞻回报结构
        - 下轮降价 / 稀释 / 可信度受损
        - 在首创型深科技中始终可能发生
    notes: 情景是投资判断框架，不是预测。
    claimRefs:
      - CV028
      - CV029
      - CV030
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 指标
      - 状态 / 估值信号
      - 参考意义
      - 局限
    rows:
      - - Pacific Fusion
        - '>$900M Series A 轮'
        - 估值未披露；资本按里程碑释放
        - 本次直接评估公司
        - 未披露出售股权比例
      - - Commonwealth Fusion Systems
        - 融资规模
        - B2 轮融资 $863M；累计近 $3B；Google 承购
        - 美国同业中融资最充分、商业验证最强
        - 阶段更靠后，技术路径不同
      - - Helion
        - 融资 + 客户验证
        - Series F 融资 $425M；Nucor 500 MW 计划 + $35M 投资
        - 可作为客户背书型聚变叙事的有用基准
        - 装置架构和成熟度不同
      - - TAE Technologies
        - 融资规模
        - 最新一轮融资 $150M
        - 显示头部同业中较低端的融资规模
        - 本组来源中客户验证不够可见
      - - Zap Energy
        - 里程碑验证
        - DOE 批准试点电厂预概念设计里程碑
        - 可作为美国商业化进展的里程碑基准
        - 本组来源中没有估值锚点
      - - General Fusion
        - 示范 + 融资
        - LM26 示范路径；$22M 融资
        - 显示同业的资本稀缺和里程碑依赖
        - 地理位置和融资环境不同
    enumerationScope:
      coverage: partial
      basis: >-
        Selected private fusion peers that provide financing-scale, milestone, or customer-proof anchors relevant to
        Pacific Fusion; valuation marks remain mostly undisclosed across the sector.
    notes: 这组可比对象按里程碑而非倍数选择，因为多数私有聚变公司不披露收入或估值标记。
    claimRefs:
