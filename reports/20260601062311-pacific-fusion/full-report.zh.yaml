      - number: '2.2'
        title: 市场规模与投资格局
        blocks:
          - type: paragraph
            body: >-
              测算 Pacific Fusion 的可服务市场，需要用自上而下的需求视角，交叉核对自下而上的投资信号和多组分析师估算；在当前尚未商业化阶段，单一聚变专项商业收入预测都不足够可信。

              最可信的近期需求信号来自电力消费数据。IEA 预计全球电力需求将在 2030 年达到每年 33,600 TWh，高于 2025 年的 28,200 TWh——每年新增约 1,100 TWh，较 2015–2025
              年新增的 700 TWh/yr 多近 60%。在这轮增长中，数据中心是加速最快的板块：IEA 预计其年用电量到 2030 年将不止翻倍至 945 TWh，相当于日本当前全部电力消费。Goldman Sachs
              Research 独立预测，到 2030 年，数据中心电力需求较 2023 年增长 165%，装机容量超过 130 GW。U.S. Energy Information Administration
              确认，美国延续二十年的需求平稳趋势已经反转，预计商业部门消费（包括数据中心）每年增长 2.6%。

              投资侧，Fusion Industry Association 的 2025 年度调查显示，全球民营聚变累计投资超过 $7B，公共资金在 2025 年同比增长 84%，接近
              $800M——确认资本承诺出现结构性升级。DOE Fusion S&T Roadmap 公告称，超过 $9B 私人投资已经在推进燃烧等离子体演示。行业分析机构 The Business Research
              Company 估计，更宽泛的「聚变能源市场」2025 年规模为 $288B，到 2030 年以 7.8% CAGR 增至
              $420B；但该数字反映的是规模化后可服务能源产值，而不是当前收入。互相矛盾的估算和方法缺口保留在规模测算视角表中。
