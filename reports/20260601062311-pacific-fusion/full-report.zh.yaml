      - number: '1.4'
        title: 布局与运营
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion 运营一个地理分散但战略上连贯的多站点网络。加州研发网络被公司描述为总部集群，由三处设施组成：Fremont Headquarters and Test
              Center（建造、测试和优化首创聚变系统组件）、San Leandro Build Center（一座 135,000 平方英尺的制造研发设施，正在提高脉冲器模块产量）和 Livermore
              Collaboratory（聚焦等离子体仿真、靶设计和贴近 LLNL）。2024 年 10 月发布后的一年里，加州团队约增长三倍，该州员工超过 110 人。

              为建设 Demonstration System，Pacific Fusion 经过竞争性选址后选择新墨西哥州 Albuquerque；候选地还包括加州 Livermore。Albuquerque 市提供
              $776M 的 Industrial Revenue Bonds，带来 20 年房产税减免。New Mexico Research and Manufacturing Campus 位于 Mesa del
              Sol，毗邻 Sandia National Laboratories，将承载 Demonstration System。配套的 Los Lunas Build Center 将制造系统组件。园区总投资约
              $1B，将创造 200 个永久岗位和数百个建设岗位。

              这套分布式布局有明确逻辑：湾区园区吸引 Silicon Valley 人才和资本网络；Livermore Collaboratory 借助 LLNL 邻近优势；新墨西哥布局则受益于靠近 Z
              Machine（Pacific Fusion 的主要实验平台），也享受该州对大型资本项目的有利激励。
