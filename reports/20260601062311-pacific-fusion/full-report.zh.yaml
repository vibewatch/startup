  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 系统定义与目标用例
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion 并不是在销售近期可交付的反应堆模块或软件产品。它当前的产品更像一个多阶段开发平台： 先是 Demonstration
              System（DS），再是使用同一架构、规模更大的商业脉冲功率聚变电站。 从客户工作流看，DS 旨在为 Pacific Fusion 自身商业化项目创造点火尺度的高能量密度条件， 同时通过 Pacific
              Fusion Users Program 支持外部实验。因此，DS 既是内部开发资产， 也是电力销售开始之前面向政府、学术和工业用户的专门研究与测试设施。


              Pacific Fusion 未来商业电站要完成的核心用户任务，是用一个避开巨型激光设施或超导托卡马克尺寸和复杂度的系统，
              提供稳定、零碳电力，并可能提供工业热。公司认为，脉冲发生器驱动的惯性约束聚变可以以更低成本实现更高实际增益， 因为快速电脉冲和简单可替换靶，比激光驱动器或大型磁约束机器更模块化、也更容易制造。公开材料明确写明，
              DS 是中间验证点：如果 Pacific Fusion 能证明设施级净增益和可重复的模块性能，同一模块设计就能复制进商业电站。


              近期的非电力用例很重要，因为这是今天少数已经公开的采用入口之一。Pacific Fusion 称， DS 从调试开始就会选择性向外部开放，用例包括点火尺度物理实验、强中子和光子环境下的材料测试、
              抗辐射测试、医用同位素工作，以及国家安全实验。这一定位扩大了平台用途， 但也凸显公司在电力销售上仍无收入、无客户。
