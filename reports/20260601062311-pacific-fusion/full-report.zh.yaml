      - number: '6.3'
        title: 市场验证与 Pacific 的证据缺口
        blocks:
          - type: paragraph
            body: >-
              更广泛的市场条件支持未来聚变客户群存在的判断。EIA 和 IEA 资料指向美国和全球电力需求重新加速； Goldman Sachs 与 S&P Global 都强调，AI
              和数据中心增长正在成为稳定电力需求的主要新增来源。 Global Energy Monitor、World Economic Forum 和 ResearchAndMarkets 的工业脱碳研究同样支持钢铁、
              重工业和其他难减排行业对高可用清洁能源的需求。若聚变真正落地，这些都是相信会有买方的可信理由。


              但 Pacific Fusion 尚未把宏观需求叙事转化为具名商业证据。两个同行展示了差距。 Commonwealth Fusion Systems 宣布与 Google 就 ARC 签署 200 MW
              清洁电力包销协议，并表示 Google 也增加了投资持股。Helion 与 Nucor 宣布计划在一家钢厂开发 500 MW 聚变电站，同时 Nucor 进行 $35 million 战略投资；Helion
              还在额外技术里程碑之后单独融资 $425 million Series F， 用于扩大商业化。同行时间表最终是否现实仍可争论，但它们展示了更强客户证据的样子： 具名交易对手、兆瓦数字、战略资本和明确商业意图。


              因此，Pacific Fusion 更适合被描述为靠近需求，而不是已经证明需求。Users Program 可能成为从研究访问走向真实客户关系的有用桥梁；
              但在公司披露具名外部用户、已签设施访问协议或未来购电方之前，客户耐久性和集中度分析主要还是未解决未来依赖的地图。 这会把客户结论推向「早期信号，不是采用」。
