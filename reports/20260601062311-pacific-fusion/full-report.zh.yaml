      - number: '3.4'
        title: 现状替代方案与替代品
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion 和所有聚变竞争者，最终都要同电力公司买方和工业客户已经熟悉的既有能源技术竞争： 天然气联合循环（NGCC）、包括小型模块化反应堆（SMR）在内的核裂变，以及配套长时储能的可再生能源。
              若要判断任何聚变公司能否在 2030–2040 年采购周期拿下商业合同，必须先看清这些替代关系如何发生。

              天然气仍是全球稳定电力的主流边际选择。联合循环电站可调度、燃料适配性强，也能建在负荷附近。 美国新建 NGCC 的平准化度电成本大约为 $40–80/MWh，这给聚变设下了主要成本标尺。
              配套电池的可再生能源在波动电力上越来越有成本竞争力，但若不大幅超配容量和储能，仍难以可靠提供跨日基荷。 增强型地热和抽水蓄能又受地理条件限制。按技术画像看，基于裂变的 SMR 是最直接的替代品——
              可调度、零碳、全天候——但监管审批往往拉到数十年尺度（NuScale 在 2022 年获得 NRC 设计批准， 但首个客户在 2023 年底取消），资本强度也高。

              核裂变的监管和成本难题给聚变打开了结构性窗口，但前提是聚变能证明自身商业化时间表。 IEA 2026 年电力展望预计，到 2030 年电力需求会大幅增长，数据中心、AI、EV 和工业电气化是主要驱动—— 这正是
              Pacific Fusion 及其同行瞄准的需求板块。替代能否发生，取决于聚变能否达到与 NGCC （首要基准）相当的商业成本，因为数据中心 PPA 中的清洁电力溢价看起来只比 NGCC 高
              $10–30/MWh。如果首批商业电站无法落入这个区间，客户决策会默认转向 NGCC、SMR 或大规模地热。
            claimRefs:
              - CP035
              - CP036
              - CP037
      - number: '3.5'
        title: 护城河持久性与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion 声称的竞争护城河包括：(1) 约 156 个相同脉冲模块组成的模块化 Marx 发生器架构， 可支持工厂化制造和单位成本学习曲线；(2) 与 LLNL 和 Sandia 签署正式
              CRADA 协议，可接触涉密和受限技术数据， 也能使用国家装置进行实验发次；(3) Sandia Z Machine 的实验结果验证了简化靶设计，可以去掉外部磁线圈、 降低系统复杂度；(4)
              公司把自己定位为唯一一家系统性同时承接 NIF 点火（LLNL 血统）和 Sandia Z/MagLIF 进展的私营聚变公司。

              这些护城河确实存在，但仍处早期。今天聚变行业最耐久的竞争优势属于 CFS（HTS 磁体制造 IP 和自有工厂、 约 $3B 资本规模、Google PPA 作为商业锚点）和 Helion（首个私营 D-T
              聚变、Orion 在建、 Microsoft 和 Nucor 作为已承诺客户、直接发电转换）。Pacific Fusion 的模块化架构尚未在规模上验证； CRADA
              访问权虽然有价值，但生态内其他国家实验室合作者也能分享类似资源。

              资本集中风险是最尖锐的结构性威胁：CFS 累计约 $3 billion，远高于 Pacific Fusion 的 $900 million， CFS 超额认购的 Series B2
              也显示，里程碑兑现后投资人信心仍在。如果 CFS 按计划在 2027 年用 SPARC 实现 Q>1，投资人注意力和锚定客户讨论可能迅速向托卡马克路线集中，使 Pacific Fusion
              更难以有竞争力的条款完成下一轮融资。 Helion 在 2026 年 1 月的 D-T 演示同样验证了 FRC 路线，相比 Pacific Fusion 尚未点火的脉冲功率项目， 也会制造可信度不对称。

              TAE 的氢-硼燃料路线如果能证明可行，将带来独特的监管和环境优势（基本没有中子，也无需处理氚）。 但达到所需等离子体温度（p-B11 约 1 billion°C，对比 D-T 约
              100M°C）是难得多的物理问题， 也意味着更高风险押注。General Fusion 的资本位置（最近一轮 $22M）和时间表（2035 年 FOAK） 表明，它短期内不会威胁 Pacific Fusion
              的融资或客户管线；不过，其务实的 MTF 路线是同行中资本效率最高的设计。

              更广泛的聚变生态仍处在商品化之前。没有任何路线已经在商业尺度跑出可重复、可发电的演示， 这意味着所有参与者——包括 Pacific Fusion——关于技术差异化的说法，都建立在物理模型和原型基准上，
              而不是运行电站证据上。独立聚变科学家指出的历史性时间表滑坡，对每个竞争者都同样适用， 也是任何聚变投资最重要的系统性风险因素。
