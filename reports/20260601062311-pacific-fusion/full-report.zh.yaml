            title: AI 电力需求激增，带来前所未有的近期市场拉力
            body: >-
              AI 基础设施建设、数据中心扩张和工业电气化交汇，正在制造数十年来最尖锐的稳定清洁电力需求激增。IEA 预计，到 2030 年全球数据中心用电量将超过 945 TWh——是 2024
              年水平的两倍——Goldman Sachs 则预测，到 2030 年数据中心电力需求较 2023 年增长
              165%。这些买方拥有财务规模、净零承诺和紧迫性，足以支撑溢价的长期承购协议。只要技术里程碑守住，Pacific Fusion 在 2030 年代中期交付商业系统的时间表就与这条需求曲线匹配；CFS-Google
              PPA 也证明，超大规模买方会在商业交付前承诺采购聚变电力。
            calloutType: strength
            claimRefs:
              - CM006
