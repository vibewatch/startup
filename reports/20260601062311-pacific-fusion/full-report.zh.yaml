  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 公开记录对价格说了什么、没说什么
        blocks:
          - type: paragraph
            body: >-
              关于 Pacific Fusion 估值，最重要的公开事实是一个缺失项：本次尽调审阅的公开来源没有披露 2024 年 10 月 Series A
              的投后估值、出售股权比例、清算优先权堆叠，或其他投资条款清单细节。公开报道一致给出名义 金额——超过 $900 million，由 General Catalyst
              领投——多家来源也指出，资本预先承诺，但按里程碑释放。 这说明 Pacific Fusion 以异常大的融资规模进入市场，但没有说明投资人每一个百分点所有权实际支付了什么价格， 也没有说明他们获得了哪些保护。


              由于 Pacific 仍无收入、未商业化，这一缺失更重要。公司没有披露 ARR，没有由包销支撑的在手合同， 也没有电站现金流模型来支持传统估值方法。实际上，今天任何承销案例定价的都是一组科学人才、
              里程碑进展、平台可选性和未来商业可信度，而不是一个已经运转的业务。公开证据有助于把 Pacific 放到同行中排序，但如果没有股权结构表，就无法清晰判断 Series A 是合理、偏高，还是对投资人友好。


              最好的公开替代方法是情景算术。如果一轮 >$900M 出售了公司约 20%，隐含投后估值约为 $4.5B； 如果出售 25%，约为 $3.6B；30% 时约为 $3.0B；40% 时约为
              $2.25B。这些数字只是简单稀释算术， 不是已报道事实。它们有用，只因为能框定下一步尽调需要弄清什么：如果 Pacific 定价处在区间低端， 对一个可能定义品类的能源平台来说，风险 /
              回报或许仍可争辩；如果定价处在高端， 却没有更强客户证据或已验证完整模块，那么这一轮很可能更多依赖叙事和稀缺性，而不是承销基本面。
