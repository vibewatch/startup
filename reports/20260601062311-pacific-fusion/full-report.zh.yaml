  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与服务类别
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion
              面向的是全球工业级、稳定、可调度、全天候清洁电力市场——不是更宽泛的可再生能源市场，不是聚变投资市场，也不是波动性发电。纳入测算的支出，是基荷发电资产的长期资本开支和电力采购，应用场景是间歇性在经济上不可接受的领域：AI
              超大规模数据中心、铝冶炼、钢铁电弧炉、电解制氢、半导体制造和国家安全基础设施。排除的支出包括波动性可再生容量（没有多日储能的风电和光伏）以及短时电池资产，因为其间歇曲线无法满足这些应用。

              现状替代方案包括天然气联合循环（NGCC）、裂变核电、增强型地热和抽水蓄能——它们要么碳强度高，要么受地理约束，要么无法按 AI 和工业电气化需要的速度扩张。Pacific Fusion
              的设计正是要解决这些替代方案各自的实质限制：NGCC 排放碳；裂变核电许可周期长、场址受限；地热受资源约束；抽水蓄能受地理边界限制。它们都不具备 Pacific Fusion 的阻抗匹配 Marx
              发生器（IMG）路线所瞄准的模块化、可复制、可规模化制造架构。

              Pacific Fusion
              材料提到的相邻长期用例包括电解制氢、海水淡化、海军和国防供能、研究应用——这些都是高功率、可靠性关键的应用，与核心数据中心和工业市场拥有相同买方画像。这些相邻板块不是近期主要收入重点，但出现在 Users
              Program 的意向表达流程中。
