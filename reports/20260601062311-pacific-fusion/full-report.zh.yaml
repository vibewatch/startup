      - number: '4.2'
        title: 收入模式与变现路径
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 6 月，Pacific Fusion 仍处于无收入阶段。公司没有公开披露收入、年经常性收入（ARR）、
              商品交易总额（GMV）、已签客户合同、购电协议或商业包销安排。当前阶段的产出是研发里程碑和实验结果， 不是商业产品或服务。公司创始人信和公开材料将使命表述为向电网提供清洁能源——这暗示电力销售（$/MWh）
              是未来主要收入机制——但公司未披露价格、合同结构或单位目标收入。

              从现有材料可以推断两条次级收入路径。第一，公司强调可大规模制造的模块化脉冲系统（每个模块可放入一个集装箱）， 这让硬件授权或设备销售有可能与发电并行。第二，面向外部研究用户的 Users Program /
              意向表达（EOI） 流程，可能产生早期访问费或公共共同资助贡献，不过公司未披露条款或价格。两条路径都未被确认； 两者都取决于尚未达成的技术里程碑。

              前商业化聚变特有的收入确认难题很尖锐：与软件或平台型公司不同，Pacific Fusion 没有标价、 试点客户、合同积压或已签意向书来锚定收入估计。2030 年代中期的前瞻收入模型，
              完全依赖尚未证明的技术里程碑、监管路径和电网接入条件。Helion（与 Microsoft 的 PPA）和 Commonwealth Fusion Systems（Series B2
              投资人承诺）的同行先例可以提供方向性参照， 但不能直接套用到 Pacific Fusion 的脉冲磁路线或时间表。
