      - number: '1.3'
        title: 融资与资本结构
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion 于 2024 年 10 月 25 日宣布结束隐身期，并披露超过 $900M 的 Series A 融资——这是聚变能源公司史上最大 A 轮之一，也是全球最大深科技 A 轮之一。该轮由
              General Catalyst 领投，投资联合体包括 Breakthrough Energy Ventures，多位知名科技和金融人士（Eric Schmidt、Patrick Collison、John
              Doerr、Ken Griffin、Mustafa Suleyman、Lachy Groom、Elad Gil、Richard Merkin、Reid Hoffman、Andrew
              Forrest），以及机构基金（Leitmotif、Lightspeed、Lowercarbon Capital、Trousdale Ventures 等）。

              资本结构很特别：完整 $900M 预先承诺，但 Pacific Fusion 只有达成预设技术里程碑后才分批拿到资金。Will Regan 在 2025 年 4 月 TechCrunch
              独家报道中确认，公司「提前数月」推进，理由是 Phase I 里程碑已在 2024 年 11 月完成——比原定 2025 年 6 月目标大约提前七个月。分批模式的设计功劳归于 General Catalyst
              的投资人、CEO Eric Lander 和 COO Carrie von Muench；三方都熟悉生物科技里的里程碑制融资。

              这种做法旨在降低连续融资对团队的干扰，并保持问责。但行业观察者指出，已承诺但未归属的资本本质上带有条件，$900M 的名义数字可能高估了公司可无条件动用的资金。Pacific Fusion
              未披露投后估值，这也符合此类尚未商业化深科技融资的惯例。
