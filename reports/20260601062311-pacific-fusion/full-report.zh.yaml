        - 顺风
        - 2026–2035（逐步增强）
        - 钢铁、水泥、化工买方面临监管和商业激励，需要用清洁基荷替代化石燃料热源；每年 >$250B/yr 的工业脱碳市场验证了买方预算
        - 核查绿色钢溢价定价能持续多久，以及 EU Carbon Border Adjustment Mechanism 的落地时间表
      - - DOE 聚变 S&T 路线图（Build–Innovate–Grow）
        - 顺风
        - 现在–2035（结构性同向）
        - 联邦政策与 Pacific Fusion 的 2030 年代中期商业化时间线同向；公共基础设施投资（国家实验室、供应链）降低私人技术风险
        - 每年跟踪 DOE 对 Milestone-Based Fusion Development Program 和 FIRE Collaboratives 的拨款
      - - NRC ADVANCE Act 与拟议规则制定
        - 顺风
        - 2024–2027（规则制定推进中）
        - 副产物材料框架相较裂变反应堆许可，降低监管成本并缩短时间线；NRC 2026 年 2 月拟议规则为首批许可申请提供更清晰路径
        - 跟踪 NRC 最终规则落定；按 NRC 指引确认新墨西哥州场址的 Agreement State 许可策略
