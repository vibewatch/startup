        title: 附录
        blocks:
          - type: callout
            title: 公开技术披露是真正差异化
            body: >-
              相比同阶段多数私营聚变同行，Pacific Fusion 把更多架构细节、经过基准校验的模拟工作和第三方实验数据放到了公开领域。
              这不能消除商业化风险，但能显著提高尽调质量，并增强外界对公司正在解决真实工程问题、而不是只依赖叙事的信心。
            calloutType: strength
            claimRefs:
              - CE021
              - CE022
