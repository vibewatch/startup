      - number: '7.2'
        title: 技术、运营与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion 最大的风险仍是技术放大。公开证据支持组件级进展、已验证的模拟工具，以及一次有意义的 Sandia 实验——它简化了靶架构——但这些都不等于一座可运行的商业电站。关键未解跨越在于：
              从已验证的 brick、stage 和靶概念，走向可靠的完整脉冲模块，再走向由大约 150 多个模块同步运行、 可反复打出净增益条件的设施。这是一个很大的系统集成台阶，许多前沿硬件公司都会折在这里。


              运营风险也来自同一缺口。Pacific Fusion 必须在 Fremont、San Leandro、Albuquerque 和 Los Lunas 建起制造和测试能力，同时协调
              Sandia、LLNL、Flash Center 和 General Atomics 等关键外部伙伴。 General Atomics 合作在战略上有帮助，但也凸显公司依赖外部工程、靶制造和规模化支持。 New
              Mexico 的建设和招聘计划显示出动能，也说明 Demonstration System 成为真实资产之前， 有多少对时间表关键的工作流必须并行推进。


              竞争风险又进一步叠加。Commonwealth Fusion Systems、Helion、TAE、Zap Energy 和 General Fusion
              都在用不同技术路线追逐同一个奖品。有些公司已经拥有具名商业交易对手，或更成熟的试点叙事。 Pacific Fusion
              的优势，是相对公司年龄异常强的公开技术严谨性；劣势是它仍需证明这种严谨性经得起电站级硬件考验。 如果第一个完整模块达不到规格，或靶经济性仍缺乏吸引力，商业动能更强的同行可能先拿走叙事、人才和资本。
