      - number: '4.5'
        title: 融资环境与后续资本路径
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion 所处的聚变融资环境正在快速成熟。FIA 2025 Global Fusion Industry Report 显示， 全球聚变行业累计投资已超过 $9.7 billion，仅
              2024–2025 年就融资超过 $2.6 billion。 DOE Fusion Science and Technology Roadmap（2025 年 10 月）指出，已有超过 $9 billion
              私人投资投入该领域； 其 Build-Innovate-Grow 战略把商业聚变目标对齐到 2030 年代中期，与 Pacific Fusion 首个商业系统目标处于同一时间框架。 DOE Office of
              Energy Dominance Financing（EDF）依据 Title XVII 和 Section 1703 管理 $40 billion IRA
              支持的清洁能源技术贷款担保权限；聚变公司可用其支持商业化融资，贷款担保最高覆盖合格项目成本的 80%。

              需求侧条件具有结构性支撑。Goldman Sachs Research 预测，到本十年末，全球数据中心电力需求最高可能增长 165%。 IEA 预计，到 2030 年，全球数据中心用电量将超过 945
              TWh。美国电力消费预计在 2025–2026 年超过历史高点。 全球工业脱碳市场预计到 2030 年每年超过 $250 billion。这些需求信号支撑了投资人对包括聚变在内的清洁基荷电源的信心—— 但
              Pacific Fusion 的商业产品要到 2030 年代中期才会出现，当前融资环境与任何收入事件之间存在很长空档。

              FIA 受访聚变公司的中位数估计，要让首批电站上线还需要额外 $700M；全行业合计资本需求超过 $77 billion。 Pacific Fusion 的 $900M Series A
              虽然按深科技标准很大，但很可能仍不足以覆盖总商业化成本。 商业部署前，政府共同投资（DOE 贷款项目、公私合作）、项目融资结构，或 Series B 可能不可避免。 同行先例包括 CFS 的 $863M
              Series B2，以及 Helion 在商业协议之外拿到的 $35M Nucor 战略投资。
