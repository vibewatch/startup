      - number: '1.5'
        title: 技术路径
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion 走的是脉冲磁惯性约束聚变（ICF）路线，不同于 NIF 代表的激光 ICF，也不同于 tokamak、stellarator
              等磁约束路线。系统用快速上升的大电流电脉冲压缩小型氘氚燃料靶，生成磁场，在每次约 100 纳秒的脉冲中挤压并加热燃料至聚变条件。流程设计成可重复运行，像活塞发动机一样，从而支撑连续发电。

              核心工程单元是阻抗匹配 Marx 发生器（IMG），即脉冲器模块，由 Keith LeChien 共同发明，并由 LLNL 在 2022 年首次公开演示。每个模块有 32 级，每级由 10 个 brick
              单元组成（一个开关和两个电容）。完整 Demonstration System 将使用约 156 个此类模块，合计在 100 纳秒内输出约 2
              太瓦——约为美国电网平均功率的四倍。模块化架构支持规模化制造；单个模块原型验证后，就可以「复制粘贴」扩展。

              2026 年 2 月，一项关键实验结果发表：Sandia 的 Z Machine 以 2,200 万安培和 120 纳秒完成四次脉冲实验，验证了简化的塑料铝靶设计。该设计允许磁场扩散进入靶体，取消了 MagLIF
              式路径过去需要的大型昂贵外部磁线圈。公司称这「大幅简化了整个靶室架构」，从而让规模化、经济可行的聚变发电成为可能。

              Pacific Fusion 与 Sandia National Laboratories 和 Lawrence Livermore National Laboratory 均签有正式 Cooperative
              Research and Development Agreements（CRADAs）。LLNL CRADA 于 2025 年 1 月 28 日签署，使双方能够围绕 NIF
              点火物理和仿真验证开展合作。靶仿真工作还与 University of Rochester 的 Flash Center 合作开展。
            claimRefs:
              - CO004
              - CO021
              - CO022
              - CO023
              - CO024
