              - CE031
  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 当前客户状态与需求入口
        blocks:
          - type: paragraph
            body: >-
              从客户角度看，Pacific Fusion 仍处于商业化之前。公司没有公开披露未来聚变电站的电力公司客户、 超大规模云厂商、工业包销方、政府购电方，或已签购电协议。公开信息中没有客户数量，
              没有已披露的电力销售合同 backlog，也没有留存或续约数据。这一缺失很重要， 因为聚变公司常常在可核验买方承诺出现很久之前，就开始讨论商业时间表。


              最强的公开采用入口反而是 Pacific Fusion Users Program（PFUP）。Pacific Fusion 称， 该项目会让外部伙伴选择性使用其 Demonstration
              System，并且已经在征集意向表达。 用户项目材料和发布文章识别了三类初始潜在用户池——私营行业、学术界和政府——并描述了从点火尺度物理、
              诊断工作到材料测试、抗辐射研究、医用同位素工作和国家安全实验的用例。公司还表示， DS 最终会把一部分设施时间分配给外部实验，调试前的伙伴互动也会影响设施设计。


              实际上，Pacific Fusion 今天营销的是未来研究与测试环境的访问权，而不是电力销售。 对一家处于这一阶段的聚变公司来说，这并不罕见，但也意味着客户章节应被解读为对潜在需求和转化准备度的评估，
              而不是电站产品市场匹配的证据。这一区分很重要，因为围绕 Pacific Fusion 的许多最令人兴奋的公开表面， 是生态信号，而不是已经入账的收入。
