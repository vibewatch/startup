              - CM017
          - type: callout
            title: 时间表滑坡和竞争技术压缩 Pacific Fusion 的市场窗口
            body: >-
              独立核能专家已公开质疑任何聚变开发商的五年商业化时间表是否可信；先进裂变 SMR、增强型地热和长时储能也都瞄准 2030 年代商业部署，时间线与聚变重叠。IEA 预计，到 2030 年可再生能源和核电将供应全球
              50% 电力。如果这些技术在 2030 年代中期前足以服务数据中心和工业稳定电力需求，Pacific Fusion 第一代系统可服务窗口可能小于总 TAM 所暗示的空间。Pacific Fusion
              的首个商业系统没有公开买方承诺，进一步凸显这一风险。
