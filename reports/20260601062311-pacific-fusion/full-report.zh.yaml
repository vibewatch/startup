        - 首个 DS 脉冲器模块未达规格或明显延期
        - 关键里程碑未达成，或复测反复失败
        - 暂停正向投资判断；重估时间线和资本模型
      - - 单发经济性
        - 看不到低成本、可重复打靶的可信路径
        - 管理层无法提供靶体成本和打靶节奏模型
        - 将商业化叙事视为科学项目，而非能源资产
      - - 监管路径
        - 州级 / NRC 路径比假设更慢或负担更重
        - 许可基础、废物处理路径或环境负担出现重大变化
        - 提高风险折扣，拉长商业化时间线
      - - 客户转化
        - DS 临近调试时仍没有具名严肃外部用户
        - 调试临近时没有可信锚定用户 / 买家
        - 将需求叙事视为未证实，并质疑后续融资
      - - 资本充足性
        - 分期款释放放慢，或比预期更早需要新资本
        - 里程碑失手，或核心技术验证前就启动融资
        - 预期稀释 / 估值压力，并收紧尽调
    notes: 这些是击穿投资逻辑的指标，不是通用运营 KPI。
    claimRefs:
      - CR029
      - CR035
      - CR036
      - CR037
      - CR038
      - CR039
      - CR040
  - id: TV001
    title: 建议摘要表
    columns:
      - 字段
      - 当前判断
      - 理由
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - 技术前景很强，但价格和条款结构仍未披露
        - 不要只凭新闻标题做投资判断
      - - 置信度
        - 中
        - 公司质量比定价质量更清楚
        - 保持主动尽调，但避免虚假精确
      - - 风险评级
        - 高
        - 全模块、商业化和资本风险仍未解决
        - 用里程碑关口，而不是只靠叙事信念
      - - 估值立场
        - unknown
        - 未公开投后估值或出售股权比例
        - 需要投资条款清单 / 股权结构表后才能判断估值
      - - 总体评分
        - 5.4 / 10
        - 顶级愿景被严重定价不透明和执行风险抵消
        - 密切跟踪，不要盲目下注
    notes: 摘要表反映的是基于公开证据的判断，不是内部投资条款清单审阅。
    claimRefs:
