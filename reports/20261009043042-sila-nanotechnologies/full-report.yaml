      - number: '7.3'
        title: Partner, Capital, and Concentration Exposure
        blocks:
          - type: paragraph
            body: >-
              Public disclosures identify Mercedes-Benz and Panasonic within five company-claimed supply agreements, but
              they do not provide contracted volumes, take-or-pay terms, program revenue, cancellation rights, or
              customer concentration. A 2026 market-data page reports a $300 million Series G, while Sila announces a
              conditional $1.4 billion loan commitment and its 2024 paper described a further $1.0 billion to $1.5
              billion Moses Lake investment plan. These figures are different measures: capital raised, conditional
              financing, and planned investment do not establish cash on hand or runway. The financing kill criterion is
              inability to satisfy loan conditions or fund the next ramp stage without materially adverse delay or
              dilution.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR009
              - CR010
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
