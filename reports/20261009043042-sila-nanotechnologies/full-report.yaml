      - number: '6.4'
        title: Customer-risk interpretation and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              The central customer risk is conversion, not access. Teardown explicitly distinguishes design wins from
              offtake and notes that automotive-scale revenue remains dependent on qualified material becoming recurring
              purchases. The evidence pool also contains two CaseStudies.com pages that returned only generic directory
              boilerplate, illustrating why search visibility cannot be treated as an independent deployment reference.
              Without contract-level backlog, shipment, renewal, and concentration data, an investor cannot determine
              whether five reported agreements diversify demand or conceal dependence on one or two programs. Diligence
              should therefore reconcile named agreements to binding minimum volumes, launch timing, cancellation
              rights, pricing, qualification status, and customer-level gross margin.
            claimRefs:
              - CU008
              - CU009
              - CU012
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: A shipped-product proof point exists
            body: >-
              WHOOP 4.0 is stronger evidence than a logo or pilot because the reviewed sources describe an actual 2021
              product launch and quantified device-level outcomes.
            calloutType: strength
            claimRefs:
              - CU002
              - CU003
          - type: callout
            title: Design wins are not demonstrated volume demand
            body: >-
              Qualification, supply agreements, and strategic-account activity do not reveal recurring orders, customer
              concentration, retention, or contract economics.
            calloutType: risk
            claimRefs:
              - CU008
              - CU009
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked Residual Risk Posture
        blocks:
          - type: paragraph
            body: >-
              Sila's risk profile is dominated by the transition from demonstrated material and consumer-device use to
              auto-scale production. An independent industry profile reports that Moses Lake opened in September 2025
              with initial material capacity for 20,000 to 50,000 EVs per year and much larger expansion potential,
              while a current company job repost describes first-of-its-kind manufacturing, commissioning, bulk-material
              handling, and startup work. Those disclosures support a high-impact execution risk, not a conclusion that
              a failure has occurred. The key monitor is stable, repeatable yield and unit cost at contracted quality;
              failure to evidence those metrics after ramp would materially weaken the scale thesis.
            claimRefs:
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR002
