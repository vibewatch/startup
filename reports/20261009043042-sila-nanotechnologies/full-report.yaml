      - number: '6.2'
        title: Adoption proof and commercial trajectory
        blocks:
          - type: paragraph
            body: >-
              Adoption evidence spans three different maturity levels that should not be conflated. WHOOP 4.0 is
              described as a 2021 commercial launch and therefore demonstrates product integration beyond a lab trial.
              Sila's 2024 white paper separately reported five customer supply agreements and qualification shipments to
              major global cell manufacturers, but did not provide contract values, shipment tonnage, utilization, or
              recurring purchase data. A later independent profile described direct work with OEMs, Panasonic, and
              Mercedes-Benz, while Sila's sales-software vendor described an extensive base of strategic accounts. These
              signals establish enterprise engagement, not conversion rates or durable production demand.
            claimRefs:
              - CU002
