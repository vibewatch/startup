              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Severe Capital Intensity and Hard-Tech Ramp Timelines
            body: >-
              Hard-tech battery materials startups face capital-intensive expansion demands and long gestation periods
              before high-margin revenue can fully materialize. Sila has committed over $1 billion to its Moses Lake
              facility, requiring ongoing capital access and successful milestone execution to draw against conditional
              loan commitments while absorbing heavy depreciation overhead.
            calloutType: risk
            claimRefs:
              - CI006
              - CI011
              - CI012
          - type: callout
            title: The Valuation Divergence and Pricing Opacity Dilemma
            body: >-
              Sila's private valuation markers exhibit meaningful divergence, spanning $2.33 billion in recent Series
              G/H secondary transactions to $3.3 billion in historical benchmark rounds. In the absence of disclosed
              top-line revenue, gross margins, or per-kilogram contracted pricing, private market valuation multiples
              remain unanchored by fundamental operating metrics.
            calloutType: insight
            claimRefs:
              - CI010
              - CI013
              - CI014
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Sila sells an enabling battery material rather than a finished battery system. Titan Silicon is described
              across company, industry-directory, and analyst sources as a silicon-carbon composite anode intended to
              replace conventional graphite. The buyer workflow therefore runs through cell manufacturers and OEM
              engineering teams: select the material, validate it in a target cell design, qualify performance and
              safety, and integrate production into a consumer-electronics, vehicle, or unmanned-system program. Sila
              also offers battery engineering support for design, prototyping, and optimization, which can reduce
              integration friction but makes the commercial outcome dependent on customer qualification. The strongest
              public deployment example remains WHOOP 4.0; Sila reports that partial graphite replacement delivered 17%
              higher energy density and a 33% smaller device, but those figures are company-issued rather than an
              independent test result.
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE012
              - CE014
              - CE015
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE004
              - CE008
              - CE009
              - CE012
          - type: table
            tableRef: TE002
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE010
              - CE011
              - CE012
              - CE014
      - number: '5.2'
        title: Architecture and integration model
        blocks:
          - type: paragraph
            body: >-
              The technical thesis combines a proprietary silicon-composite material with a drop-in integration model.
              ARPA-E's historical project record confirms that Sila pursued a proprietary silicon anode designed to use
              existing cell-assembly infrastructure, while Sila's 2024 paper says the material can enter existing
              factories without additional capital equipment or labor. That compatibility is strategically important
              because it places the main adoption burden on chemistry validation and manufacturing consistency rather
              than a wholesale cell-factory redesign. The public manufacturing description distinguishes batch
              production in Alameda from continuous processing, online diagnostics, precursor utilization, and material
              handling at Moses Lake. Sila's patent claim spans cell architectures, materials, components, and
              processes, suggesting that both material formulation and production know-how are intended parts of the
              moat.
            claimRefs:
              - CE003
              - CE007
              - CE008
              - CE011
              - CE013
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE007
              - CE008
              - CE011
              - CE012
              - CE013
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE002
              - CE003
              - CE008
              - CE012
              - CE013
      - number: '5.3'
        title: Commercial maturity and scaling evidence
        blocks:
          - type: paragraph
            body: >-
              Product maturity is uneven by application. Sila reported a first commercial product launch in 2021 and
              documented a consumer-device deployment, which is stronger evidence than a laboratory-only technology.
              Automotive maturity is later: Sila's 2024 document described qualification activity and a planned Moses
              Lake ramp, while Rust Belt Industrials subsequently reported that the plant opened in September 2025 with
              initial material capacity for 20,000 to 50,000 EVs per year. That third-party profile supports a
              transition from construction to operating infrastructure, but it does not disclose achieved output, yield,
              customer acceptance rates, or economics. The retained evidence therefore supports commercial availability
              and installed manufacturing capacity, not stable automotive-scale production or validated unit economics.
            claimRefs:
              - CE004
              - CE005
              - CE008
              - CE009
      - number: '5.4'
        title: Technical risk, quality, and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              The principal technical underwriting risk is the distance between claimed cell performance and
              independently reproducible production performance. Sila claims 20% to 40% higher energy density,
              graphite-like swelling, and long cycle life; an industry supplier listing also reports more than 2,000
              cycles. These are relevant design targets, but the retained sources do not provide a current independent
              test protocol, cell format, duty cycle, statistical sample, defect rate, or warranty record. Quality
              controls are described only at a high level, and the assigned evidence contains no public certification,
              environmental compliance package, cybersecurity surface, recall history, or field-failure disclosure.
              Diligence should therefore request customer qualification data, plant yield and control limits, safety
              test reports, and traceability procedures before treating the performance range as repeatable at
              automotive volume.
            claimRefs:
              - CE002
              - CE006
              - CE007
              - CE010
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercial proof is beyond the laboratory
            body: >-
              Sila reports a 2021 product launch and a deployed WHOOP 4.0 application, while an independent industry
              profile reports that Moses Lake opened in September 2025.
            calloutType: strength
            claimRefs:
              - CE004
              - CE005
              - CE009
          - type: callout
            title: Scale proof is not the same as qualified output
            body: >-
              Public sources identify facilities and performance claims but do not disclose current production yield,
              customer acceptance rates, field failures, or independently tested automotive-scale reliability.
            calloutType: risk
            claimRefs:
              - CE006
              - CE008
              - CE009
              - CE010
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer segments and strategic value
        blocks:
          - type: paragraph
            body: >-
              Sila sells an anode material into a multi-party battery value chain rather than directly to end consumers.
              The reviewed evidence identifies consumer-device OEMs, automotive OEMs, and cell manufacturers as the
              principal buying or qualification constituencies, with additional company positioning across flight,
              space, defense, data-center, and robotics applications. WHOOP provides the strongest public evidence that
              a device OEM incorporated Sila material into a launched product. Mercedes-Benz and Panasonic establish
              automotive and cell-manufacturer access, but the public record reviewed here does not disclose program
              revenue, purchase volumes, or the share of sales attributable to any segment. Those omissions prevent a
              revenue-weighted segmentation or concentration assessment.
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU013
