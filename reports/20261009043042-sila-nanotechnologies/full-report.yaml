    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              Independent company profiles place Sila Nanotechnologies' founding in 2011 and headquarters in Alameda,
              California. Sila describes itself as an advanced battery-technology company that develops and manufactures
              Titan Silicon, its silicon-carbon anode material for lithium-ion applications. The commercial model
              therefore depends on selling manufactured anode material rather than merely licensing research: the
              company says it combines U.S. intellectual property with domestic production and positions the material as
              a graphite replacement. The retained evidence establishes the product category and physical-production
              orientation, but it does not disclose current revenue, unit pricing, gross margin, or customer
              concentration. Those omissions prevent a public-data assessment of whether manufacturing scale has
              translated into durable commercial economics.
            claimRefs:
              - CO001
              - CO002
              - CO010
      - number: '1.2'
        title: Milestones and Operating Scale
        blocks:
          - type: paragraph
            body: >-
              Sila's public chronology shows a long commercialization cycle. Tracxn records early federal funding in
              2012 and later equity and grant events; Sila says its first product launched in 2021. The company reported
              that Moses Lake construction was completed and operations began in fall 2025, then announced $300 million
              of private equity in July 2026 to ramp Titan Silicon production and support a planned second expansion
              phase. This is tangible factory and financing progress, but the evidence does not verify production yield,
              shipped tonnage, utilization, or customer acceptance at automotive scale. The milestone sequence should
              therefore be read as evidence of technical and capital progression, not as proof of profitable volume
              production.
