  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Definitions, and Spend Scope
        blocks:
          - type: paragraph
            body: >
              Sila Nanotechnologies operates at the intersection of advanced battery materials, clean technology
              manufacturing, and critical supply chain onshoring. Specifically, Sila's primary commercial category is
              the production of silicon-carbon (Si/C) composite active anode materials (AAM) engineered as drop-in
              replacements for traditional graphite anodes in lithium-ion battery (LIB) cells. The market boundary
              includes direct merchant sales of engineered anode powders to automotive original equipment manufacturers
              (OEMs), battery cell manufacturers, and defense contractors. Included spend encompasses active anode
              material procurement, specialized cell qualification engineering services, and co-developed cell
              architecture testing.


              Conversely, the market boundary explicitly excludes downstream finished battery cell packaging, battery
              pack assembly for commercial grid-scale stationary storage, cathode active materials (such as lithium iron
              phosphate or high-nickel NMC chemistries), and unrefined raw metallurgical silicon. Substitute
              technologies include conventional synthetic graphite, natural spherical graphite, early-stage silicon
              oxide (SiOx) additives, and emerging solid-state battery electrolytes. By focusing exclusively on drop-in
              nano-composite powder compatible with standard slurry and roll-to-roll electrode coaters, Sila isolates
              the $100/kWh to $50/kWh cost-reduction vector in lithium-ion cell architectures without requiring
              gigafactories to rebuild basic cell manufacturing infrastructure.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Market Sizing, Demand Projections, and Trajectory
        blocks:
          - type: paragraph
            body: >
              Assessing the market size for silicon-dominant battery materials requires isolating global battery demand
              volumes from specialized anode component value pools. According to International Energy Agency (IEA) data,
              global battery demand expanded by over 35% in 2025, exceeding 1.5 TWh, with electric vehicles representing
              1.2 TWh of deployment (up approximately 30% year-over-year). Industry projections synthesized by the World
              Economic Forum and IEA indicate that annual battery deployment is projected to reach approximately 3 TWh
              by 2030 and 4 TWh by 2035 under current stated policy trajectories.


              Within this macro volume, the lithium-ion battery anode segment represents a critical value bottleneck.
              Third-party analyst data from Forge Global cites projections showing the specialized battery anode market
              expanding from $88.1 million in 2023 to $965 million by 2030. In terms of physical capacity requirements,
              the long-term replacement of conventional automotive propulsion across global fleets would necessitate
              upwards of 30,000 GWh (30 TWh) of annual battery production, with 2,000 GWh capable of supporting 100
              million electric vehicles. However, near-term addressable spend for premium silicon-carbon anodes remains
              constrained to luxury EV programs and performance devices willing to bear early-stage production price
              premiums.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
