              - CR010
              - CR013
              - CR015
      - number: '7.4'
        title: Mitigations, Monitoring Indicators, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Mitigation maturity is mixed. Formal conflict, reporting, HAZOP, change-management, and alarm-management
              processes are visible, and direct ownership of manufacturing process and tool-design IP can reduce
              licensing dependence. The technical record is less conclusive: Sila asserts independent validation and
              conventional-cell-equivalent life, while an external technical overview repeats performance claims without
              exposing underlying test protocols or datasets. Investors should monitor plant yield, scrap, qualification
              pass rates, customer launch timing, safety closeouts, and financing-condition completion. Thesis-break
              events are a material safety or regulatory action, repeated customer qualification failure, persistent
              uneconomic yield, loss of anchor programs, or inability to finance contracted production.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR011
              - CR012
              - CR013
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Financing evidence must be kept on three separate bases
            body: >-
              The $300 million Series G is reported capital raised, the $1.4 billion headline is a conditional loan
              commitment, and the $1.0 billion to $1.5 billion figure is a 2024 company investment plan. None is
              evidence of current unrestricted cash. Underwrite the ramp only after reviewing cash, committed draws,
              conditions precedent, covenants, construction obligations, and downside funding needs.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis for Sila Nanotechnologies rests on its foundational drop-in silicon-carbon
              (Si/C) composite anode technology, Titan Silicon, which replaces commodity synthetic and natural graphite
              to boost lithium-ion cell energy density by 20% to 40% and power density by up to 100%. By
              operationalizing the landmark Moses Lake manufacturing facility in September 2025 with initial output
              dedicated to 20,000 to 50,000 electric vehicles annually and a long-term roadmap targeting 2.5 million
              vehicles (up to 250 GWh), Sila has established an early domestic manufacturing presence. Furthermore,
              securing a conditional $1.4 billion federal loan commitment in August 2026 significantly mitigates capital
              expenditure constraints for Phase 2 scaling. Conversely, the anti-thesis centers on the total absence of
              disclosed commercial revenue run-rates, gross margin figures, and unit production costs at Moses Lake.
              Private capital markets reflect this profound uncertainty through divergent valuations, including reports
              of a $1 billion valuation haircut in 2024 down to $1.3 billion, conflicting secondary platform marks at
              $1.7 billion, and an unconfirmed $2.33B Series H capitalization carrying senior 1.5x liquidation
              preference overhang.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV009
              - CV010
              - CV014
      - number: '8.2'
        title: Capitalization Structure, Senior Preferences, and Valuation Dispersion
        blocks:
          - type: paragraph
            body: >-
              Sila has accumulated approximately $1.61 billion in total equity and grant funding across 16 private
              financing rounds through July 2026. The company completed a $375 million Series G financing in June 2024
              led by Sutter Hill Ventures and T. Rowe Price, which market trackers reported adjusted Sila's valuation
              down to approximately $1.3 billion from its prior peak of $3.3 billion set during the 2021 Series F. On
              July 21, 2026, Sila secured an additional $300 million private financing round led by Atreides Management
              and Sutter Hill Ventures, alongside Bessemer Venture Partners, Matrix Partners, 8VC, and T. Rowe Price.
              However, market reporting exhibits stark contradictions regarding round denomination and valuation marks:
              private tracker records cite the financing as an extension of Series G without a disclosed valuation,
              platform estimates by QuantLogix benchmark fair value at $1.7 billion based on round anchors, while
              pre-IPO tracker Forge Global catalogs the transaction as a Series H round at $16.42 per share,
              establishing a $2.33 billion post-money capitalization. Crucially, the Forge transaction record reveals a
              1.5x senior liquidation preference with an 8.0% dividend rate on the latest preferred class, creating
              substantial preference overhang that subordinates common shareholders and junior capital unless exit
              valuations comfortably exceed $2.5 billion.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV014
      - number: '8.3'
        title: Valuation Scenarios, Exit Readiness, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Evaluating Sila across bull, base, and bear operating cases illustrates that investment returns are highly
              sensitive to factory yield ramp schedules, automotive qualification cycles, and commercial pricing
              discipline rather than high-level technical claims. In the bull case, Moses Lake successfully achieves
              high operating yields, OEM partners Mercedes-Benz and Panasonic transition from sample qualification to
              binding volume purchase agreements, and Sila establishes an IPO valuation between $3.5 billion and $4.5
              billion. In the base case, automotive cell design transfers progress through standard multi-year
              qualification cycles, commercial revenues emerge gradually from consumer wearables and initial niche
              vehicle lines, and Sila sustains a private market mark between $1.7 billion and $2.3 billion. In the bear
              case, chemical engineering bottlenecks delay contract manufacturing execution, subsidized synthetic
              graphite prices compress anode pricing power, and the 1.5x preference stack forces a down-round or
              structured recapitalization under $1.3 billion. Given that no Form S-1 has been filed and public battery
              materials multiples have compressed, institutional investors should maintain a research-more stance,
              treating entry at marks above $1.5 billion with caution until Moses Lake factory yield and customer
              conversion unit economics are independently audited.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV009
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV007
              - CV008
              - CV009
              - CV012
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV008
              - CV009
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Disciplined Underwriting Required Amid Preference Overhang
            body: >-
              While Sila's factory opening at Moses Lake and federal loan support represent substantial technical
              milestones, prospective secondary buyers and late-stage investors must account for the 1.5x liquidation
              preference structure reported on recent preferred stock issuances. In a downside scenario or modest exit
              under $2.0 billion, the preferred stack absorbs disproportionate capital proceeds, leaving common shares
              and non-senior equity holders vulnerable.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV008
              - CV009
              - CV014
          - type: callout
            title: Market Valuation Divergence Highlights Information Asymmetry
            body: >-
              Private pricing estimates for Sila vary widely between $1.3 billion (post-Series G haircut reports), $1.7
              billion (round-anchored model estimates), and $2.33 billion (pre-IPO platform trade entries). This wide
              variance highlights significant private-market information asymmetry in the absence of an audited Form S-1
              filing, validating a track recommendation over aggressive capital allocation.
            calloutType: insight
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV013
