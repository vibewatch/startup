              - CU016
      - number: '6.3'
        title: Durability and expansion mechanics
        blocks:
          - type: paragraph
            body: >-
              The available sources suggest a long enterprise path from account mapping through technical qualification,
              supply agreement, product launch, and eventual volume expansion. Vizrm's vendor case study indicates that
              Sila maps complex buying centers across regions and uses those maps in account strategy meetings,
              consistent with a high-touch sale involving numerous stakeholders. Sila's own WHOOP account says
              validation to launch took ten months, while its automotive material was still described through
              qualification and supply agreements. No reviewed source reports renewal rates, repeat-order cohorts, NRR,
              GRR, churn, satisfaction, contract length, or realized land-and-expand economics, so durability remains
              unverified.
            claimRefs:
              - CU003
              - CU010
              - CU011
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
