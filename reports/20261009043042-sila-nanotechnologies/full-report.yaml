      - number: '7.2'
        title: Legal, Regulatory, and Process-Safety Controls
        blocks:
          - type: paragraph
            body: >-
              The available record shows controls but not their operating effectiveness. Sila's published conflict
              policy requires recurring disclosures, Compliance Committee review, and special reporting for DOE-funded
              work; its engineering recruitment also calls for HAZOP closure, Management of Change, safety-system
              design, and alarm management. These are relevant mitigations for federal-award and chemical-process risk.
              However, the assigned evidence includes no regulator docket, permit register, audit result, enforcement
              record, or current incident log. Accordingly, the analysis does not infer a clean compliance history from
              the absence of a retained adverse result. Closing diligence requires source-level permit, audit, and
              safety-closeout records.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR014
