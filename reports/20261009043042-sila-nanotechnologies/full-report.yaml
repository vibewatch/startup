    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation & Return Logic
      - Key Risks
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          Moses Lake hits 50k EV capacity; Mercedes-Benz launches series production; gross margin reaches 30%+; loan
          fully drawn.
        - $3.5B–$4.5B IPO valuation based on 15x–20x forward EV/EBITDA on high-margin specialized battery materials.
        - Automotive cell integration delays or emergence of competing solid-state battery alternatives.
        - 25% — OEM qualification design freezes and binding minimum-purchase off-take contracts announced.
      - - Base Case
        - >-
          Gradual Moses Lake production ramp; wearable anode sales continue; automotive commercial volume starts
          post-2027.
        - >-
          $1.7B–$2.3B valuation range; modest multiple expansion; returns constrained by preferred dividend and
          preference stack.
        - >-
          High cash burn during factory yield optimization requiring additional dilutive equity capital before
          break-even.
        - 50% — Consistent hiring of battery scaling engineers and steady execution on customer prototyping milestones.
      - - Bear Case
        - >-
          Manufacturing yield bottlenecks at Moses Lake; graphite commodity prices drop below $50/kWh; automotive OEM
          trials stall.
        - >-
          <$1.3B distressed valuation or structured recapitalization; 1.5x liquidation preference wipes out junior
          common equity.
        - >-
          Loss of DOE conditional loan commitment due to unmet technical benchmarks; customer defection to rival Si/C
          developers.
        - >-
          25% — Inability to secure follow-on financing without severe down-round terms and senior structural debt
          protections.
