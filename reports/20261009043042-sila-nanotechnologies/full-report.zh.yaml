  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Sila Nanotechnologies 的核心投资论点建立在基础性的直接替换型硅碳（Si/C）复合负极技术 Titan Silicon 上。该技术以普通合成石墨和天然石墨为替代品，使锂离子电芯能量密度提高
              20% 至 40%，功率密度最高提高 100%。Sila 于 2025 年 9 月将标志性的 Moses Lake 制造工厂投入运营，初始产出用于每年 20,000 至 50,000 辆电动汽车，长期路线图则瞄准
              2.5 million 辆汽车（最高 250 GWh），由此建立了早期本土制造存在。除此之外，2026 年 8 月获得有条件的 $1.4 billion
              联邦贷款承诺，显著缓解了第二阶段扩张的资本开支约束。反论点则集中在 Moses Lake 完全没有披露商业收入运行率、毛利率和单位生产成本。私人资本市场通过分歧估值反映了这种深度不确定性，包括据报道 2024
              年估值下砍 $1 billion 至 $1.3 billion、相互冲突的二级平台 $1.7 billion 估值，以及未经确认的 $2.33B Series H 资本化结构，其 1.5x 清算优先权形成了悬垂。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV009
              - CV010
              - CV014
      - number: '8.2'
        title: 资本化结构、优先权与估值分散
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 7 月，Sila 在 16 轮私人融资中累计获得约 $1.61 billion 股权和拨款。公司于 2024 年 6 月完成 $375 million Series G 融资，由 Sutter
              Hill Ventures 和 T. Rowe Price 领投；市场跟踪机构报告称，这使 Sila 的估值从 2021 年 Series F 期间达到的 $3.3 billion 峰值下调至约 $1.3
              billion。2026 年 7 月 21 日，Sila 又获得一轮 $300 million 私人融资，由 Atreides Management 和 Sutter Hill Ventures
              领投，Bessemer Venture Partners、Matrix Partners、8VC 和 T. Rowe Price 共同参与。不过，市场报道在轮次命名和估值标记上存在明显矛盾：私人跟踪记录称该融资是
              Series G 的延伸轮，但未披露估值；QuantLogix 的平台估计以轮次锚点为基础，将公允价值基准定为 $1.7 billion；而 IPO 前跟踪机构 Forge Global 将该交易列为
              Series H，价格为每股 $16.42，从而得出 $2.33 billion 的投后资本化。更关键的是，Forge 交易记录显示最新优先股类别带有 1.5x 清算优先权和 8.0%
              股息率，形成明显的优先权悬垂；除非退出估值舒适地超过 $2.5 billion，否则普通股股东和次级资本都处于劣后地位。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV014
      - number: '8.3'
        title: 估值情景、退出准备度与尽调要求
        blocks:
          - type: paragraph
            body: >-
              把 Sila 放进乐观、基准和悲观三种经营情景中评估，可以看出投资回报主要取决于工厂良率爬坡、汽车认证周期和商业定价纪律，而不是高层面的技术主张。乐观情景下，Moses Lake 成功实现较高运营良率，OEM
              合作方 Mercedes-Benz 和 Panasonic 从样品认证走向有约束力的批量采购协议，Sila 的 IPO 估值达到 $3.5 billion 至 $4.5
              billion。基准情景下，汽车电芯设计按标准的多年认证周期推进，消费级可穿戴设备和首批利基车型逐步贡献商业收入，Sila 的私募市场估值维持在 $1.7 billion 至 $2.3
              billion。悲观情景下，化学工程瓶颈拖慢代工执行，受补贴的合成石墨价格压缩负极定价权，1.5x 优先股堆叠迫使公司在低于 $1.3 billion 的估值下进行下轮融资或结构化资本重组。鉴于公司尚未提交
              Form S-1，且公开市场电池材料公司的估值倍数已经收缩，机构投资者应继续采取“继续研究”立场；在 Moses Lake 工厂良率和客户转化单元经济性经过独立审计前，对高于 $1.5 billion
              的入场估值保持谨慎。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV009
              - CV012
              - CV013
              - CV014
              - CV015
