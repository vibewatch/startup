      - number: '4.2'
        title: 成本结构、毛利率驱动因素与资本开支
        blocks:
          - type: paragraph
            body: >
              Sila 的成本结构受先进化学合成、高温热反应器运行和千兆瓦时级工厂摊销支配。Sila
              设计的合成平台采用全球大宗商品前体和大宗化学加工技术，而不是特殊化学原料，从而有望在规模化后与在位合成石墨实现成本平价。传统石墨负极锂离子电池包的成本下限接近 $100/kWh；通过将电芯能量密度提高 20% 至
              40%，并减少电解质、隔膜和封装等非活性材料的用量，Sila 模型显示电池包层面的成本有望接近 $50/kWh。


              不过，近期单位经济性面临明显毛利率压力，且工厂投产期间固定成本吸收不足。Sila 已对制造资产投入大量资本：其 Alameda 批量工厂年产能为 50 MWh，投资约 $200 million；未来五年
              Moses Lake 工厂扩建预计投入 $1.0 至 $1.5 billion。Moses Lake 能够受益于太平洋西北地区低成本水电和本地原材料供应商，但其初始 2 至 5 GWh 产能在扩展至最终 150
              至 250 GWh 目标前，还要承担显著的固定成本、良率调试和工艺认证负担。
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
