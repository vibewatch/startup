        blocks:
          - type: paragraph
            body: >-
              技术投资判断的主要风险，在于声称的电芯性能与可独立复现的生产性能之间存在距离。Sila 声称能量密度提升 20% 至 40%、膨胀表现类似石墨并拥有较长循环寿命；一家行业供应商名录还报告超过 2,000
              次循环。这些属于重要设计目标，但现有来源没有提供当前独立测试方案、电芯规格、工作循环、统计样本、缺陷率或保修记录。质量控制目前只有概括性描述，分配到的证据中没有公开认证、环境合规文件、网络安全攻击面、召回历史或现场失效披露。因此，在将该性能区间视为汽车规模下可重复表现之前，尽调应索取客户认证数据、工厂良率与控制限、安全测试报告和可追溯流程。
