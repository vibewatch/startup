        - Titan Silicon 作为石墨的即插即用替代品，可带来 20% 至 40% 的能量密度提升，功率密度最高提升 100%。
        - 独立电芯验证显示，在汽车规模下循环寿命严重衰减，或首圈容量出现不可逆损失。
      - - 制造与规模化
        - Moses Lake 设施已运营，初始产能可支持 20k 至 50k 辆 EV，并有 $1.4B 有条件贷款承诺支持。
        - 长时间停产、合成期间报废率大幅上升，或未能满足联邦贷款拨付契约。
      - - 商业合作
        - 已与 Mercedes-Benz、Panasonic 建立合作，并在 WHOOP 4.0 可穿戴设备中实现商业部署。
        - OEM 项目取消、认证延迟超过 24 个月，或客户转向成本更低的国产合成石墨。
      - - 估值与资本结构
        - 2026 年 7 月近期完成的 $300M 融资提供了流动性，帮助 Moses Lake 从爬坡过渡到汽车批量生产。
        - 披露没有惩罚性清算倍数且无负担的股权结构表，同时已出货负极粉体实现正毛利。
    notes: 将核心尽调支柱与可观察的证伪标准进行策略性比较。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV006
      - CV007
      - CV009
      - CV010
      - CV014
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值与回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观情景
        - Moses Lake 达到 50k 辆 EV 产能；Mercedes-Benz 启动量产；毛利率达到 30%+；贷款全部提款。
        - 基于高毛利特种电池材料 15x–20x 远期 EV/EBITDA，IPO 估值为 $3.5B–$4.5B。
        - 汽车电芯集成延迟，或竞争性固态电池替代方案出现。
        - 25% — OEM 认证设计冻结，并宣布具有约束力的最低采购承购合同。
      - - 基准情景
        - Moses Lake 逐步爬坡；可穿戴设备负极销售持续；汽车商业出货量在 2027 年之后启动。
        - $1.7B–$2.3B 估值区间；倍数温和扩张；优先股股息和优先股堆叠限制回报。
        - 工厂良率优化期间现金消耗高，在盈亏平衡前需要额外的稀释性股权资本。
        - 50% — 持续招聘电池规模化工程师，并稳定推进客户原型里程碑。
      - - 悲观情景
        - Moses Lake 出现制造良率瓶颈；石墨大宗商品价格降至 $50/kWh 以下；汽车 OEM 试验停滞。
        - 低于 $1.3B 的困境估值或结构化资本重组；1.5x 清算优先权抹掉次级普通股权益。
        - 因未达到技术基准而失去 DOE 有条件贷款承诺；客户转投竞争性的 Si/C 开发商。
        - 25% — 无法获得后续融资，除非接受大幅下调估值的条款和高级结构性债务保护。
    notes: 情景估算基于已报告的私募轮次（$1.3B 至 $2.33B）和电池材料行业倍数。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV007
      - CV008
      - CV009
      - CV012
      - CV014
