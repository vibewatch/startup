        title: 展示材料
        blocks:
          - type: callout
            title: 融资证据必须按三个不同口径区分
            body: >-
              $300 million Series G 是据报道已筹集的资本，$1.4 billion 是有条件贷款承诺，$1.0 billion 至 $1.5 billion 是公司 2024
              年投资计划。三者都不能证明当前拥有不受限制的现金。只有在审阅现金、已承诺提款、先决条件、契约、建设义务和下行情景融资需求后，才能将这轮爬坡计入投资判断。
            calloutType: risk
