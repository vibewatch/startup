              - CP004
              - CP005
              - CP007
      - number: '3.2'
        title: 材料架构与功能能力
        blocks:
          - type: paragraph
            body: >-
              硅负极开发商主要在四个技术维度上形成差异：体积膨胀管理、全电芯能量密度增益、循环寿命保持率，以及制造端直接替换兼容性。按重量计，硅理论上可储存多达石墨十倍的锂离子，但充电时膨胀幅度最高可达
              300%，若不加以控制，会导致机械粉化和固体电解质界面（SEI）持续劣化。Sila 通过专有的刚性微孔骨架在内部容纳硅膨胀，从而应对这一根本性衰减机制；在 Whoop 4.0
              等商业设备中，这一方案可将能量密度提高至多 20%，同时不牺牲循环寿命。Group14 则使用合成碳骨架容纳硅纳米颗粒（SCC55），实现与现有浆料混合产线相当的直接替换兼容性。相比之下，Amprius 和
              Enovix 等纯硅、纳米线开发商的初始质量能量密度更高（超过 400
              Wh/kg），但需要非标准电芯设计或定制机械封装，因此在标准圆柱或方形汽车电芯产线上的即时适用性受限，而直接替换型粉末的采用在这些产线上至关重要。
            claimRefs:
              - CP001
              - CP003
              - CP006
              - CP008
              - CP012
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
