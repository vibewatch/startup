              独立公司资料显示，Sila Nanotechnologies 成立于 2011 年，总部位于 California 州 Alameda。Sila
              将自己定位为先进电池技术公司，开发并制造用于锂离子电池的硅碳负极材料 Titan
              Silicon。因此，其商业模式依赖销售制造出来的负极材料，而不只是授权研究成果：公司称自己把美国知识产权与本土生产结合起来，并将该材料定位为石墨替代品。现有证据确认了产品类别和实体生产属性，但未披露当前收入、单价、毛利率或客户集中度。因此，无法仅凭公开数据判断制造规模是否已经转化为持久的商业经济性。
