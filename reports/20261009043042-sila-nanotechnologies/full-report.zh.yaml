      - number: '4.3'
        title: 资本充足性、现金续航与资本密集度
        blocks:
          - type: paragraph
            body: >
              Sila 能否保持资本充足，取决于充足的后期股权支持，以及有条件的联邦债务融资。横跨种子轮融资、拨款和后期股权融资的共 16 轮融资中，Sila 累计筹得 $1.61 billion 私人资本和非稀释性资本。继
              2021 年 1 月以 $3.3 billion 估值完成的 $600 million Series F，以及 2024 年 6 月的 $375 million Series G 之后，Sila 于 2026 年
              7 月又获得 $300 million 私人资本。这笔 Series G/H 延伸轮由 Sutter Hill Ventures 和 Atreides Management 共同领投，Bessemer
              Venture Partners、Matrix Partners、8VC 和 T. Rowe Price Associates 参与。Forge Global 和 Tracxn 的二级跟踪显示，按每股
              $16.42 计算的投后估值为 $2.33 billion，意味着相对 2021 年峰值估值有序下调。


              2026 年 7 月融资的主要用途，是加快 Moses Lake 第二阶段扩建和运营爬坡，以满足汽车商业交付计划。除股权资本外，Sila 还从美国政府获得一笔有条件的 $1.4 billion
              贷款承诺，用于扩大本土电池技术制造。尽管资本缓冲充足，Sila 仍暴露于严重的资本密集度风险。硬科技电池材料在收入实现前需要漫长的培育周期；与此同时，Sila
              必须满足里程碑契约才能提款，还要应对受大量补贴的亚洲负极生产商带来的外部价格竞争。
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: 财务尽调结论、估值背景与投资判断缺口
        blocks:
          - type: paragraph
            body: >
              对 Sila Nanotechnologies 的财务投资判断，呈现出技术验证极强与商业指标完全不透明之间的鲜明分化。一方面，Sila 已实现西方同行难以比拟的 Tier-1 商业验证：Alameda
              的生产线正在运行，与 Whoop 开展活跃的商业消费品出货，与 Mercedes-Benz 和 Panasonic 建立具有约束力的汽车合作关系，并获得前所未有的 $1.4 billion
              有条件联邦贷款承诺。其技术确实提供了一条打破中国石墨加工垄断的路径。


              另一方面，机构投资判断所需的关键财务输入仍完全未披露。Sila 的年度收入运行率、签约积压转化时间、实际每公斤粉末价格、毛利率门槛和现金消耗率均属非公开信息。二级平台估值从 $2.33 billion 到
              $3.3 billion 不等，反映出隐含收入倍数较高、不同私人市场之间分歧很大。在 Sila 实现 Moses Lake 稳态制造良率并通过 S-1
              注册声明披露经审计财务表现之前，股权投资判断必须将这项投资视为高资本开支的基础设施爬坡项目，并计入执行和定价波动风险。
