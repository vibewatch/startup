      - number: '7.2'
        title: 法律、监管与工艺安全控制
        blocks:
          - type: paragraph
            body: >-
              现有记录显示有控制措施，但不能证明其运营效果。Sila 发布的利益冲突政策要求定期披露、合规委员会审查，以及对 DOE 资助项目进行专项报告；其工程岗位招聘还要求完成
              HAZOP、变更管理、安全系统设计和报警管理。这些措施与联邦奖励和化学工艺风险的缓释相关。不过，分配到的证据没有监管机构案卷、许可登记册、审计结果、执法记录或当前事故日志。因此，分析不会因为保留材料中没有不利结果，就推断其合规历史良好。完成尽调需要取得许可、审计和安全收尾的源文件。
            claimRefs:
              - CR006
              - CR007
              - CR008
