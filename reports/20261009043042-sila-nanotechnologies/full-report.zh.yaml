      - number: '6.3'
        title: 持久性与扩张机制
        blocks:
          - type: paragraph
            body: >-
              现有来源显示，企业客户从账户梳理到技术认证、供货协议、产品上市，最终到规模扩张，需要经历漫长路径。供应商案例研究 Vizrm 表示，Sila
              会跨区域梳理复杂的购买中心，并在账户战略会议中使用这些地图，这与涉及众多利益相关方的高接触销售一致。Sila 自己关于 WHOOP 的客户案例称，从验证到上市耗时 10
              个月；而其汽车材料仍被描述为处于认证和供货协议阶段。没有审阅过的来源报告续约率、重复订单群组、NRR、GRR、流失率、满意度、合同期限或实际 land-and-expand 经济性，因此持久性仍未经验证。
            claimRefs:
              - CU003
              - CU010
              - CU011
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
