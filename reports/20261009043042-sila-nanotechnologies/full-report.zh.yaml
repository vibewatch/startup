      - number: '3.3'
        title: 商业化扩张、工厂经济性与定价动态
        blocks:
          - type: paragraph
            body: >-
              电池材料的商业差异化，本质上取决于资本开支效率、制造规模以及达到石墨成本平价的能力。Sila 于 2025 年末投产其位于 Washington 州 Moses Lake 的制造工厂第一阶段，为每年估计
              20,000 至 50,000 辆电动汽车提供初始本土负极产能；从长期看，该基地计划扩建至最多支持 2.5 million 辆汽车。工厂选址 Washington
              州，既能获得低成本可再生水电，也能接入本地前体供应链，相比同行形成有利成本结构，同时让西方 OEM 免受地缘政治供应风险影响。Sila 已与 Tier-1 电芯制造商 Panasonic 及汽车 OEM
              Mercedes-Benz 正式建立多年商业关系。不过，硅复合材料的定价显著高于成熟的中国合成石墨，后者交易价格低于每公斤 $10。新兴硅材料生产商必须证明，将电芯层面的能量密度提升 17% 至
              20%，能够通过减少每辆车所需的电芯数量、结构外壳和冷却基础设施，转化为电池包层面的净成本节省。
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
              - CP013
