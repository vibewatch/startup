              - CU015
              - CU016
      - number: '6.4'
        title: 客户风险解读与尽调重点
        blocks:
          - type: paragraph
            body: >-
              客户侧的核心风险是转化，而不是接触渠道。Teardown 明确区分设计获胜与承购，并指出汽车规模收入仍取决于经过认证的材料能否转化为重复采购。证据池中还有两个 CaseStudies.com
              页面只返回了通用目录模板，说明不能将搜索可见度视为独立部署参考。没有合同层面的积压订单、出货、续约和集中度数据，投资人无法判断五份已报告协议是在分散需求，还是掩盖对一两个项目的依赖。因此，尽调应将已点名协议与具有约束力的最低采购量、上市时间、取消权、价格、认证状态和客户层面的毛利率逐一核对。
            claimRefs:
              - CU008
              - CU009
              - CU012
              - CU016
      - number: '6.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 存在已出货产品的证明点
            body: WHOOP 4.0 比一个 logo 或试点更有说服力，因为审阅的来源描述了实际的 2021 年产品上市和量化的设备层面结果。
            calloutType: strength
