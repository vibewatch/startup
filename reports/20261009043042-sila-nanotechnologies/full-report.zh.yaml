      - number: '3.4'
        title: 壁垒持久性、切换成本与替代风险
        blocks:
          - type: paragraph
            body: >-
              汽车电池材料竞争优势的持久性，很大程度上依赖知识产权深度、客户认证壁垒，以及抵御潜在替代化学体系的能力。Sila 在全球拥有超过 250
              项已提交和待审专利，覆盖核心硅碳合成和颗粒形态，为快速跟进的材料合成商建立了强大障碍。更重要的是，汽车认证周期会给 OEM 带来高昂切换成本：在高产量汽车电芯中认证一种新的负极化学体系，通常需要 3 至 5
              年的全面热性能、日历寿命和碰撞安全验证。一旦 OEM 决定将 Titan Silicon 集成到某一车型平台（例如 Mercedes-Benz
              计划中的豪华电动车型），改用其他硅材料供应商就需要大规模重设计电芯并重新认证。未来 5 至 10 年的威胁包括 QuantumScape
              等开发商将固态锂金属电池商业化、低成本亚洲合成石墨生产商迅速扩产，以及大型电芯制造商为在内部获取材料利润而推进硅材料开发。
            claimRefs:
              - CP007
              - CP008
              - CP010
              - CP011
              - CP012
              - CP014
      - number: '3.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 石墨价格通缩与规模差距
            body: 中国在位的合成石墨和天然石墨生产商仍拥有以数 GWh 计的巨大成本优势。因此，硅复合材料供应商必须证明，电芯层面提升 17% 至 20% 的能量密度，足以抵消主流汽车平台更高的物料清单成本。
            calloutType: risk
            claimRefs:
              - CP008
              - CP013
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价机制与变现结构
        blocks:
          - type: paragraph
            body: >
              Sila Nanotechnologies 通过以商用材料规模供货为核心的多层商业模式，将其专有电池材料科学变现。核心商业产品 Titan Silicon
              是工程化硅碳（Si/C）复合粉末，直接销售给电池电芯制造商和汽车原始设备制造商（OEM）。Sila
              并非授权其化学合成技术或反应器设计知识产权，而是明确直接制造材料，以保留对工具设计、连续反应器合成和工艺控制参数的端到端专有控制。


              商业化分两层推进。首先，Sila 在高价值、价格不敏感的消费电子领域建立了切入点，为 Whoop 4.0 健身可穿戴设备等产品交付商业材料批次。在这一细分市场，Titan Silicon
              部分替代石墨，使体积能量密度提高 17%，设备体积缩小 33%。这个切入点证明了商业制造能力，并带来早期现金收入。其次，Sila 正扩展到汽车级全替代和部分替代石墨项目；与 Mercedes-Benz 和
              Panasonic 的供货协议约定了多 GWh 承购承诺。辅助收入来自电池工程服务，Sila 的工程师与电芯制造商直接合作，优化浆料配方、电解质兼容性和电芯循环动力学。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
