      - number: '7.3'
        title: 合作伙伴、资本与集中度风险
        blocks:
          - type: paragraph
            body: >-
              公开披露在五份公司自称的供货协议中点名 Mercedes-Benz 和 Panasonic，但没有提供合同数量、照付不议条款、项目收入、取消权或客户集中度。一个 2026 年市场数据页面报告 $300
              million Series G；Sila 则宣布了一笔有条件的 $1.4 billion 贷款承诺，其 2024 年论文还描述了额外 $1.0 billion 至 $1.5 billion 的 Moses
              Lake 投资计划。这些数字代表不同指标：已筹资本、有条件融资和计划投资都不能证明手头现金或续航。融资层面的失守标准，是无法满足贷款条件，或无法在出现重大不利延误或稀释的情况下为下一阶段爬坡提供资金。
            claimRefs:
