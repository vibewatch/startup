      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 面对优先权悬置，必须严谨评估
            body: >-
              虽然 Sila 在 Moses Lake 开厂并获得联邦贷款支持，都是重要的技术里程碑，但潜在的老股买家和后期投资者必须计入近期优先股发行中据报道存在的 1.5x 清算优先权安排。在下行情景或低于 $2.0
              billion 的温和退出情景下，优先权层会吸收不成比例的资本收益，使普通股和非优先级股东面临风险。
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV008
              - CV009
              - CV014
          - type: callout
            title: 市场估值分歧凸显信息不对称
            body: >-
              Sila 的私募定价估计差异很大：$1.3 billion（Series G 估值折损报告）、$1.7 billion（以融资轮为锚的模型估算）和 $2.33 billion（IPO
              前平台交易报价）。在缺少经审计 Form S-1 文件的情况下，这种巨大差异说明私募市场存在显著信息不对称，也支持继续跟踪，而不是激进配置资本。
            calloutType: insight
            claimRefs:
              - CV005
