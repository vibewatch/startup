              - CU016
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 排名后的剩余风险状况
        blocks:
          - type: paragraph
            body: >-
              Sila 的风险主要集中在从已证明的材料和消费设备应用转向汽车规模生产。独立行业资料称 Moses Lake 于 2025 年 9 月开业，初始材料产能每年支持 20,000 至 50,000
              辆电动车，扩建潜力更大；当前公司招聘信息则描述了首座同类制造、调试、大宗材料处理和启动工作。这些披露支持高影响执行风险，但不能据此断定已经发生失败。关键监测指标是达到合同质量要求的稳定、可重复良率和单位成本；爬坡后仍无法证明这些指标，将明显削弱规模化论点。
            claimRefs:
              - CR004
              - CR005
              - CR006
