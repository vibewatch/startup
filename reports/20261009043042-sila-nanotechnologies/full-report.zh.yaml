            body: >-
              产品成熟度因应用而异。Sila 报告称首款商业产品于 2021 年上市，并记录了一次消费设备部署，这比仅停留在实验室的技术更有说服力。汽车领域成熟得更晚：Sila 2024 年文件描述了认证活动和 Moses
