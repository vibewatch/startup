company:
  name: "Sila Nanotechnologies"
chapter:
  number: 8
  title: "Valuation"
  summary: "Sila Nanotechnologies combines established industrial proof at Moses Lake and key customer partnerships with severe valuation dispersion, ranging from a $1.3B Series G post-money mark to secondary marks of $1.7B and a $2.33B Series H capitalization. In the absence of audited commercial revenue, gross margins, and customer unit economics, the company warrants an evidence-sensitive research-more stance and disciplined pricing thresholds."
sections:
  - id: "investment-thesis-and-anti-thesis"
    title: "Investment Thesis and Anti-Thesis"
    body: "The core investment thesis for Sila Nanotechnologies rests on its foundational drop-in silicon-carbon (Si/C) composite anode technology, Titan Silicon, which replaces commodity synthetic and natural graphite to boost lithium-ion cell energy density by 20% to 40% and power density by up to 100%. By operationalizing the landmark Moses Lake manufacturing facility in September 2025 with initial output dedicated to 20,000 to 50,000 electric vehicles annually and a long-term roadmap targeting 2.5 million vehicles (up to 250 GWh), Sila has established an early domestic manufacturing presence. Furthermore, securing a conditional $1.4 billion federal loan commitment in August 2026 significantly mitigates capital expenditure constraints for Phase 2 scaling. Conversely, the anti-thesis centers on the total absence of disclosed commercial revenue run-rates, gross margin figures, and unit production costs at Moses Lake. Private capital markets reflect this profound uncertainty through divergent valuations, including reports of a $1 billion valuation haircut in 2024 down to $1.3 billion, conflicting secondary platform marks at $1.7 billion, and an unconfirmed $2.33B Series H capitalization carrying senior 1.5x liquidation preference overhang."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV009"
    tableRefs:
      - "TV002"
  - id: "capitalization-and-financing-context"
    title: "Capitalization Structure, Senior Preferences, and Valuation Dispersion"
    body: "Sila has accumulated approximately $1.61 billion in total equity and grant funding across 16 private financing rounds through July 2026. The company completed a $375 million Series G financing in June 2024 led by Sutter Hill Ventures and T. Rowe Price, which market trackers reported adjusted Sila's valuation down to approximately $1.3 billion from its prior peak of $3.3 billion set during the 2021 Series F. On July 21, 2026, Sila secured an additional $300 million private financing round led by Atreides Management and Sutter Hill Ventures, alongside Bessemer Venture Partners, Matrix Partners, 8VC, and T. Rowe Price. However, market reporting exhibits stark contradictions regarding round denomination and valuation marks: private tracker records cite the financing as an extension of Series G without a disclosed valuation, platform estimates by QuantLogix benchmark fair value at $1.7 billion based on round anchors, while pre-IPO tracker Forge Global catalogs the transaction as a Series H round at $16.42 per share, establishing a $2.33 billion post-money capitalization. Crucially, the Forge transaction record reveals a 1.5x senior liquidation preference with an 8.0% dividend rate on the latest preferred class, creating substantial preference overhang that subordinates common shareholders and junior capital unless exit valuations comfortably exceed $2.5 billion."
    claimRefs:
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV014"
    tableRefs:
      - "TV001"
  - id: "scenario-analysis-and-comparable-benchmarks"
    title: "Valuation Scenarios, Exit Readiness, and Diligence Asks"
    body: "Evaluating Sila across bull, base, and bear operating cases illustrates that investment returns are highly sensitive to factory yield ramp schedules, automotive qualification cycles, and commercial pricing discipline rather than high-level technical claims. In the bull case, Moses Lake successfully achieves high operating yields, OEM partners Mercedes-Benz and Panasonic transition from sample qualification to binding volume purchase agreements, and Sila establishes an IPO valuation between $3.5 billion and $4.5 billion. In the base case, automotive cell design transfers progress through standard multi-year qualification cycles, commercial revenues emerge gradually from consumer wearables and initial niche vehicle lines, and Sila sustains a private market mark between $1.7 billion and $2.3 billion. In the bear case, chemical engineering bottlenecks delay contract manufacturing execution, subsidized synthetic graphite prices compress anode pricing power, and the 1.5x preference stack forces a down-round or structured recapitalization under $1.3 billion. Given that no Form S-1 has been filed and public battery materials multiples have compressed, institutional investors should maintain a research-more stance, treating entry at marks above $1.5 billion with caution until Moses Lake factory yield and customer conversion unit economics are independently audited."
    claimRefs:
      - "CV001"
