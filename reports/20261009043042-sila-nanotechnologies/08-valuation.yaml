callouts:
  - calloutType: "recommendation"
    title: "Disciplined Underwriting Required Amid Preference Overhang"
    body: "While Sila's factory opening at Moses Lake and federal loan support represent substantial technical milestones, prospective secondary buyers and late-stage investors must account for the 1.5x liquidation preference structure reported on recent preferred stock issuances. In a downside scenario or modest exit under $2.0 billion, the preferred stack absorbs disproportionate capital proceeds, leaving common shares and non-senior equity holders vulnerable."
    claimRefs:
      - "CV004"
      - "CV008"
      - "CV009"
      - "CV014"
  - calloutType: "insight"
    title: "Market Valuation Divergence Highlights Information Asymmetry"
    body: "Private pricing estimates for Sila vary widely between $1.3 billion (post-Series G haircut reports), $1.7 billion (round-anchored model estimates), and $2.33 billion (pre-IPO platform trade entries). This wide variance highlights significant private-market information asymmetry in the absence of an audited Form S-1 filing, validating a track recommendation over aggressive capital allocation."
    claimRefs:
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV013"
