evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      A current board roster, fully diluted cap table, voting agreements, investor consent rights, and founder
      ownership.
    whyItMatters: >-
      Late-stage investor protections and board control can constrain strategic options despite continued founder
      operating roles.
    diligencePath: >-
      Request the amended certificate, board minutes, cap table, voting agreement, and investor-rights agreement in the
      data room.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: financing-classification
    missingEvidence: >-
      Primary financing documents confirming the July 2026 series designation, post-money valuation, share price, and
      preference stack.
    whyItMatters: >-
      Series designation and security terms determine seniority, dilution, and the reliability of the reported
      valuation.
    diligencePath: Review the July 2026 stock purchase agreement, amended charter, capitalization schedule, and closing statement.
    relatedQuestionRefs:
      - QO005
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: cover-metrics
    missingEvidence: >-
      Current revenue, gross margin, cash balance, debt usage, customer count, customer concentration, contracted
      backlog, and factory yield.
    whyItMatters: >-
      Funding raised is not cash available, and factory commissioning does not establish commercial throughput or
      profitable unit economics.
    diligencePath: >-
      Obtain audited financial statements, current management accounts, cash and debt schedules, customer-level backlog,
      and Moses Lake production reports.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: commercial-pricing
    missingEvidence: >-
      Disclosed price-per-kilogram contracts for Titan Silicon powder across tier-1 automotive and defense customer
      agreements.
    whyItMatters: >-
      Without volume pricing data, unit-level gross margin contribution and true cost competitiveness against Chinese
      synthetic graphite cannot be audited.
    diligencePath: Review future S-1 IPO filings, confidential customer master supply agreements, or benchmark pricing disclosures.
    relatedQuestionRefs:
      - QM006
  - type: missing-source
    severity: minor
    topic: long-term-degradation
    missingEvidence: >-
      Independent third-party multi-thousand-cycle degradation and swelling data across pouch and cylindrical cell form
      factors under extreme cold-weather and DC fast-charge conditions.
    whyItMatters: >-
      Automotive warranty liability depends heavily on calendar aging and particle volume expansion over a 10-year
      vehicle life.
    diligencePath: Obtain independent national laboratory testing benchmarks (e.g., Argonne or NREL cell cycling studies).
    relatedQuestionRefs:
      - QM005
  - type: private-evidence-only
    severity: material
    topic: competitor-pricing-data
    missingEvidence: >-
      Direct contracted per-kilogram or per-kWh supply pricing for Sila Titan Silicon and direct peer materials (Group14
      SCC55, Nexeon, Amprius) under automotive master supply agreements.
    whyItMatters: >-
      Without disclosed contracted pricing and volume discount schedules, precise cost-parity timelines against Chinese
      synthetic graphite cannot be independently modeled.
    diligencePath: >-
      Request confidential OEM procurement pricing benchmarks, bill-of-materials cost comparisons, or cell-level pack
      cost model under NDA.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: revenue-run-rate
    missingEvidence: >-
      Audited annual revenue run-rate and historical revenue growth across consumer electronics and automotive
      qualification shipments.
    whyItMatters: >-
      Top-line revenue scale is the core foundation for financial valuation, commercial traction verification, and
      enterprise multiple underwriting.
    diligencePath: >-
      Review future S-1 registration statements, confidential private placement memoranda, or audited financial
      statements.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-gross-margins
    missingEvidence: >-
      Realized per-kilogram powder sales price, manufacturing yield curves, and steady-state unit gross margins for
      Moses Lake Phase 1 production.
    whyItMatters: >-
      Gross margin sustainability dictates whether Titan Silicon can compete economically against subsidized Asian
      graphite competitors without ongoing cash subsidies.
    diligencePath: Examine customer master supply agreement pricing schedules and plant-level standard costing models.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: cash-burn-and-runway
    missingEvidence: >-
      Monthly net operating cash burn rate, current liquid cash balance, and detailed conditions precedent for drawdown
      of the $1.4B conditional loan.
    whyItMatters: Defines forward financing dependency and the exact timing and dilution risk of future equity rounds or IPO timing.
    diligencePath: >-
      Inspect treasury cash flow statements, capex milestone schedules, and Department of Energy/War loan agreement
      covenants.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: reliability
    missingEvidence: >-
      Independent cycle-life, fast-charge, swelling, and safety test reports with cell format, protocol, sample size,
      comparator, and full result distributions.
    whyItMatters: >-
      Company performance ranges cannot establish repeatability, warranty exposure, or application fitness without
      comparable test conditions.
    diligencePath: >-
      Obtain qualification reports from at least two cell or OEM customers and reproduce the key tests through an
      independent battery laboratory.
    relatedQuestionRefs:
      - QE007
      - QE010
  - type: private-evidence-only
    severity: material
    topic: manufacturing-scale
    missingEvidence: >-
      Current Moses Lake nameplate capacity, actual output, first-pass yield, scrap, equipment uptime, customer
      acceptance, and unit-cost data.
    whyItMatters: >-
      Facility opening and designed capacity do not demonstrate stable automotive-volume output or an economic
      manufacturing process.
    diligencePath: >-
      Review monthly plant operating data, control charts, batch genealogy, customer acceptance records, and a
      reconciled cost-of-goods bridge.
    relatedQuestionRefs:
      - QE009
      - QE010
    relatedTableRefs:
      - TE001
      - TE003
  - type: missing-source
    severity: material
    topic: quality-and-compliance
    missingEvidence: >-
      Public or customer-audited certifications, quality-management controls, environmental permits, traceability
      procedures, recall history, and field-failure reporting.
    whyItMatters: >-
      Material consistency and safety are gating requirements for automotive qualification and determine the cost of
      defects or recalls.
    diligencePath: >-
      Request certification schedules, audit findings, permit status, deviation logs, corrective-action records, and
      product-liability or recall summaries.
    relatedQuestionRefs:
      - QE007
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      Complete current customer and program list reconciling the five reported supply agreements to named
      counterparties, qualification stage, production status, and launch timing.
    whyItMatters: Three public names cannot establish the breadth, maturity, or diversification of the reported agreement base.
    diligencePath: >-
      Obtain the customer master list and program-status schedule, then confirm each production relationship directly
      with counterparties under confidentiality.
    relatedQuestionRefs:
      - QU001
      - QU010
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: >-
      Customer-level revenue, backlog, shipment volume, gross margin, renewal terms, cancellation rights, repeat orders,
      and top-one/top-five concentration for 2024 through year-to-date 2026.
    whyItMatters: >-
      Without contract and cohort data, neither demand durability nor exposure to a delayed or cancelled flagship
      program can be measured.
    diligencePath: >-
      Review executed agreements, invoices, shipment records, backlog aging, renewal history, and a
      customer-concentration bridge tied to audited or management accounts.
    relatedQuestionRefs:
      - QU008
      - QU009
  - type: private-evidence-only
    severity: material
    topic: automotive-offtake
    missingEvidence: >-
      Evidence that Mercedes-Benz, Panasonic, or another automotive program has passed qualification and entered binding
      recurring volume procurement.
    whyItMatters: >-
      Automotive-scale economics depend on converting design and qualification relationships into sustained purchases
      rather than one-time evaluation batches.
    diligencePath: >-
      Obtain customer-signed qualification approvals, binding purchase commitments, minimum annual volumes, shipment
      schedules, acceptance data, and launch-platform identifiers.
    relatedQuestionRefs:
      - QU010
  - type: private-evidence-only
    severity: material
    topic: manufacturing-scale
    missingEvidence: Current Moses Lake output, uptime, first-pass yield, scrap, qualification yield, and fully loaded unit cost.
    whyItMatters: >-
      These denominators determine whether the opened facility can meet customer quality and cost requirements at
      commercial scale.
    diligencePath: >-
      Review monthly operating dashboards, batch genealogy, quality-release data, scrap bridges, and customer acceptance
      records under NDA.
    relatedQuestionRefs:
      - QR001
      - QR003
    relatedTableRefs:
      - TR002
  - type: missing-source
    severity: material
    topic: regulatory-record
    missingEvidence: >-
      Primary regulator records covering permits, inspections, notices, enforcement, reportable incidents, and safety
      closeout at Moses Lake.
    whyItMatters: >-
      A company policy and job specification show intended controls but cannot establish compliance performance or
      incident absence.
    diligencePath: >-
      Obtain permit identifiers and search Washington, local, OSHA, EPA, and DOE records; reconcile results to company
      incident and audit logs.
    relatedQuestionRefs:
      - QR002
      - QR003
    relatedTableRefs:
      - TR001
      - TR002
  - type: private-evidence-only
    severity: material
    topic: customer-dependencies
    missingEvidence: >-
      Customer-level contracted volume, revenue, take-or-pay protection, qualification milestones, cancellation rights,
      and launch schedules.
    whyItMatters: >-
      Named counterparties and agreement counts do not quantify concentration, durability, or downside revenue
      protection.
    diligencePath: >-
      Inspect executed supply agreements, qualification scorecards, program schedules, backlog definitions, and
      customer-level revenue plans.
    relatedQuestionRefs:
      - QR004
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: conditional-financing
    missingEvidence: >-
      Loan counterparty, conditions precedent, covenants, draw schedule, funded amount, unrestricted cash, burn, and
      downside runway.
    whyItMatters: Funding raised, a conditional commitment, and planned investment cannot be combined into available liquidity.
    diligencePath: >-
      Review executed credit documents, condition tracker, bank statements, 24-month cash forecast, construction
      commitments, and downside funding plan.
    relatedQuestionRefs:
      - QR005
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: performance-validation
    missingEvidence: >-
      Current independent test reports with cell design, comparator, temperature, duty cycle, sample size, failure
      distribution, and raw durability results.
    whyItMatters: >-
      Company assertions and an overview article do not independently establish automotive performance under
      production-representative conditions.
    diligencePath: Commission third-party replication and obtain named laboratory reports plus customer qualification datasets.
    relatedQuestionRefs:
      - QR007
    relatedTableRefs:
      - TR002
