  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: reliability
      missingEvidence: >-
        Independent cycle-life, fast-charge, swelling, and safety test reports with cell
        format, protocol, sample size, comparator, and full result distributions.
      whyItMatters: >-
        Company performance ranges cannot establish repeatability, warranty exposure, or
        application fitness without comparable test conditions.
      diligencePath: >-
        Obtain qualification reports from at least two cell or OEM customers and reproduce
        the key tests through an independent battery laboratory.
      relatedQuestionRefs: [QE007, QE010]
    - type: private-evidence-only
      severity: material
      topic: manufacturing-scale
      missingEvidence: >-
        Current Moses Lake nameplate capacity, actual output, first-pass yield, scrap,
        equipment uptime, customer acceptance, and unit-cost data.
      whyItMatters: >-
        Facility opening and designed capacity do not demonstrate stable automotive-volume
        output or an economic manufacturing process.
      diligencePath: >-
        Review monthly plant operating data, control charts, batch genealogy, customer
        acceptance records, and a reconciled cost-of-goods bridge.
      relatedQuestionRefs: [QE009, QE010]
      relatedTableRefs: [TE001, TE003]
    - type: missing-source
      severity: material
      topic: quality-and-compliance
      missingEvidence: >-
        Public or customer-audited certifications, quality-management controls, environmental
        permits, traceability procedures, recall history, and field-failure reporting.
      whyItMatters: >-
        Material consistency and safety are gating requirements for automotive qualification
        and determine the cost of defects or recalls.
      diligencePath: >-
        Request certification schedules, audit findings, permit status, deviation logs,
        corrective-action records, and product-liability or recall summaries.
      relatedQuestionRefs: [QE007]
