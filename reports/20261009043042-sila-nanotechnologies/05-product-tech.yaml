    title: Titan Silicon product-to-production stack
    type: stack
    summary: >-
      The defensible product spans material IP, cell integration, qualification, and scaled
      manufacturing rather than a standalone powder specification.
    data:
      layers:
        - label: Material inputs
          items:
            - Global commodity precursors
            - Silicon-carbon composite feedstock
          detail: Public sources describe commodity inputs but not the qualified supplier set.
        - label: Proprietary material system
          items:
            - Titan Silicon particle design
            - Process and component IP
          detail: Sila reports patents across materials, components, processes, and cell architectures.
        - label: Cell integration
          items:
            - Battery engineering services
            - OEM and cell-maker qualification
          detail: The drop-in thesis still requires application-specific validation.
        - label: Customer qualification
          items:
            - Cell-format validation
            - Performance and safety acceptance
          detail: Public evidence confirms qualification activity but not acceptance distributions.
        - label: Manufacturing and release
          items:
            - Alameda batch production
            - Moses Lake continuous processing
          detail: Public evidence does not disclose current yield or release-control distributions.
        - label: Deployed applications
          items:
            - Consumer electronics
            - Automotive and unmanned-system programs
          detail: Consumer deployment is documented; automotive evidence remains at qualification and scale-up.
    approximationNotes: >-
      Conceptual operating stack based on public descriptions; sequence does not disclose
      Sila's proprietary process parameters or prove current production performance.
    claimRefs: [CE002, CE003, CE008, CE012, CE013]
