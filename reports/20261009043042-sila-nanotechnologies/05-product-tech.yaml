company:
  name: Sila Nanotechnologies
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Sila's product is Titan Silicon, a silicon-carbon anode material designed to replace
    graphite inside existing lithium-ion cell manufacturing, supplemented by battery
    engineering services. Consumer-device commercialization and the reported opening of
    Moses Lake establish meaningful maturity, but current production yield, field
    reliability, and independently verified performance remain material diligence gaps.
sections:
  - id: product-and-customer-workflow
    title: Product and customer workflow
    body: >-
      Sila sells an enabling battery material rather than a finished battery system. Titan
      Silicon is described across company, industry-directory, and analyst sources as a
      silicon-carbon composite anode intended to replace conventional graphite. The buyer
      workflow therefore runs through cell manufacturers and OEM engineering teams: select
      the material, validate it in a target cell design, qualify performance and safety, and
      integrate production into a consumer-electronics, vehicle, or unmanned-system program.
      Sila also offers battery engineering support for design, prototyping, and optimization,
      which can reduce integration friction but makes the commercial outcome dependent on
      customer qualification. The strongest public deployment example remains WHOOP 4.0;
      Sila reports that partial graphite replacement delivered 17% higher energy density and
      a 33% smaller device, but those figures are company-issued rather than an independent
      test result.
    claimRefs: [CE001, CE004, CE005, CE012, CE014, CE015]
    tableRefs: [TE001, TE002]
  - id: architecture-and-integration
    title: Architecture and integration model
    body: >-
      The technical thesis combines a proprietary silicon-composite material with a drop-in
      integration model. ARPA-E's historical project record confirms that Sila pursued a
      proprietary silicon anode designed to use existing cell-assembly infrastructure, while
      Sila's 2024 paper says the material can enter existing factories without additional
      capital equipment or labor. That compatibility is strategically important because it
      places the main adoption burden on chemistry validation and manufacturing consistency
      rather than a wholesale cell-factory redesign. The public manufacturing description
      distinguishes batch production in Alameda from continuous processing, online
      diagnostics, precursor utilization, and material handling at Moses Lake. Sila's patent
      claim spans cell architectures, materials, components, and processes, suggesting that
      both material formulation and production know-how are intended parts of the moat.
    claimRefs: [CE003, CE007, CE008, CE011, CE013]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-and-scale
    title: Commercial maturity and scaling evidence
    body: >-
      Product maturity is uneven by application. Sila reported a first commercial product
      launch in 2021 and documented a consumer-device deployment, which is stronger evidence
      than a laboratory-only technology. Automotive maturity is later: Sila's 2024 document
      described qualification activity and a planned Moses Lake ramp, while Rust Belt
      Industrials subsequently reported that the plant opened in September 2025 with initial
      material capacity for 20,000 to 50,000 EVs per year. That third-party profile supports
      a transition from construction to operating infrastructure, but it does not disclose
      achieved output, yield, customer acceptance rates, or economics. The retained evidence
      therefore supports commercial availability and installed manufacturing capacity, not
      stable automotive-scale production or validated unit economics.
    claimRefs: [CE004, CE005, CE008, CE009]
  - id: technical-risk-and-diligence
    title: Technical risk, quality, and diligence priorities
    body: >-
      The principal technical underwriting risk is the distance between claimed cell
      performance and independently reproducible production performance. Sila claims 20% to
      40% higher energy density, graphite-like swelling, and long cycle life; an industry
      supplier listing also reports more than 2,000 cycles. These are relevant design
      targets, but the retained sources do not provide a current independent test protocol,
      cell format, duty cycle, statistical sample, defect rate, or warranty record. Quality
      controls are described only at a high level, and the assigned evidence contains no
      public certification, environmental compliance package, cybersecurity surface, recall
      history, or field-failure disclosure. Diligence should therefore request customer
      qualification data, plant yield and control limits, safety test reports, and
      traceability procedures before treating the performance range as repeatable at
      automotive volume.
    claimRefs: [CE002, CE006, CE007, CE010]
callouts:
  - calloutType: strength
    title: Commercial proof is beyond the laboratory
    body: >-
      Sila reports a 2021 product launch and a deployed WHOOP 4.0 application, while an
      independent industry profile reports that Moses Lake opened in September 2025.
    claimRefs: [CE004, CE005, CE009]
  - calloutType: risk
    title: Scale proof is not the same as qualified output
    body: >-
      Public sources identify facilities and performance claims but do not disclose current
      production yield, customer acceptance rates, field failures, or independently tested
      automotive-scale reliability.
    claimRefs: [CE006, CE008, CE009, CE010]
