    claimRefs: [CE005, CE006, CE007, CE010, CE011, CE012, CE014]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role, Public evidence, Dependency, Principal risk]
    rows:
      - [Silicon-carbon composite, Replace graphite at the anode, Company and directory descriptions plus historical ARPA-E record, Stable material behavior through repeated cycling, Expansion side reactions and performance variance]
      - [Cell integration and qualification, Adapt material to target cell and application, Drop-in compatibility and battery engineering services, Cell-maker process control and OEM validation, Qualification time and customer-specific redesign]
      - [Material manufacturing, Produce consistent powder at commercial volume, Alameda batch process and Moses Lake continuous-process description, Precursor quality equipment uptime and online diagnostics, Yield defects scale-up stability and cost]
      - [Quality and release controls, Demonstrate safety life and repeatability before shipment, High-level company references to tight quality controls, Test methods traceability and customer acceptance criteria, No public control limits audit or field-failure dataset]
    notes: >-
      Architecture is reconstructed from reviewed public descriptions; detailed process
      parameters, control limits, and current operating metrics are private evidence gaps.
    claimRefs: [CE003, CE007, CE008, CE011, CE012, CE013]
