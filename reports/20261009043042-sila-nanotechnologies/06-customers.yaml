company:
  name: Sila Nanotechnologies
chapter:
  number: 6
  title: Customers
  summary: >-
    Public customer proof is real but narrow: WHOOP is the clearest shipped-product reference, while
    Mercedes-Benz and Panasonic are evidenced as supply or qualification relationships rather than
    disclosed volume production. The assigned evidence does not disclose retention, contract economics,
    customer concentration, or conversion of automotive design wins into recurring offtake.
sections:
  - id: customer-segments
    title: Buyer segments and strategic value
    body: >-
      Sila sells an anode material into a multi-party battery value chain rather than directly to end
      consumers. The reviewed evidence identifies consumer-device OEMs, automotive OEMs, and cell
      manufacturers as the principal buying or qualification constituencies, with additional company
      positioning across flight, space, defense, data-center, and robotics applications. WHOOP provides
      the strongest public evidence that a device OEM incorporated Sila material into a launched product.
      Mercedes-Benz and Panasonic establish automotive and cell-manufacturer access, but the public record
      reviewed here does not disclose program revenue, purchase volumes, or the share of sales attributable
      to any segment. Those omissions prevent a revenue-weighted segmentation or concentration assessment.
    claimRefs: [CU001, CU002, CU006, CU013, CU014]
    tableRefs: [TU001]
  - id: adoption-proof
    title: Adoption proof and commercial trajectory
    body: >-
      Adoption evidence spans three different maturity levels that should not be conflated. WHOOP 4.0 is
      described as a 2021 commercial launch and therefore demonstrates product integration beyond a lab
      trial. Sila's 2024 white paper separately reported five customer supply agreements and qualification
      shipments to major global cell manufacturers, but did not provide contract values, shipment tonnage,
      utilization, or recurring purchase data. A later independent profile described direct work with OEMs,
      Panasonic, and Mercedes-Benz, while Sila's sales-software vendor described an extensive base of
      strategic accounts. These signals establish enterprise engagement, not conversion rates or durable
      production demand.
    claimRefs: [CU002, CU003, CU004, CU005, CU006, CU007, CU010]
    tableRefs: [TU002, TU003]
  - id: durability-expansion
    title: Durability and expansion mechanics
    body: >-
      The available sources suggest a long enterprise path from account mapping through technical
      qualification, supply agreement, product launch, and eventual volume expansion. Vizrm's vendor case
      study indicates that Sila maps complex buying centers across regions and uses those maps in account
      strategy meetings, consistent with a high-touch sale involving numerous stakeholders. Sila's own
      WHOOP account says validation to launch took ten months, while its automotive material was still
      described through qualification and supply agreements. No reviewed source reports renewal rates,
      repeat-order cohorts, NRR, GRR, churn, satisfaction, contract length, or realized land-and-expand
      economics, so durability remains unverified.
    claimRefs: [CU003, CU010, CU011, CU015, CU016]
    figureRefs: [FU001]
  - id: customer-risk
    title: Customer-risk interpretation and diligence priorities
    body: >-
      The central customer risk is conversion, not access. Teardown explicitly distinguishes design wins
      from offtake and notes that automotive-scale revenue remains dependent on qualified material becoming
      recurring purchases. The evidence pool also contains two CaseStudies.com pages that returned only
      generic directory boilerplate, illustrating why search visibility cannot be treated as an independent
      deployment reference. Without contract-level backlog, shipment, renewal, and concentration data, an
      investor cannot determine whether five reported agreements diversify demand or conceal dependence on
      one or two programs. Diligence should therefore reconcile named agreements to binding minimum volumes,
      launch timing, cancellation rights, pricing, qualification status, and customer-level gross margin.
    claimRefs: [CU008, CU009, CU012, CU016]
tables:
