  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: >-
        Complete current customer and program list reconciling the five reported supply agreements to named
        counterparties, qualification stage, production status, and launch timing.
      whyItMatters: >-
        Three public names cannot establish the breadth, maturity, or diversification of the reported agreement base.
      diligencePath: >-
        Obtain the customer master list and program-status schedule, then confirm each production relationship
        directly with counterparties under confidentiality.
      relatedQuestionRefs: [QU001, QU010]
      relatedTableRefs: [TU003]
    - type: private-evidence-only
      severity: material
      topic: retention-and-concentration
      missingEvidence: >-
        Customer-level revenue, backlog, shipment volume, gross margin, renewal terms, cancellation rights,
        repeat orders, and top-one/top-five concentration for 2024 through year-to-date 2026.
      whyItMatters: >-
        Without contract and cohort data, neither demand durability nor exposure to a delayed or cancelled
        flagship program can be measured.
      diligencePath: >-
        Review executed agreements, invoices, shipment records, backlog aging, renewal history, and a
        customer-concentration bridge tied to audited or management accounts.
      relatedQuestionRefs: [QU008, QU009]
    - type: private-evidence-only
      severity: material
      topic: automotive-offtake
      missingEvidence: >-
        Evidence that Mercedes-Benz, Panasonic, or another automotive program has passed qualification and
        entered binding recurring volume procurement.
      whyItMatters: >-
        Automotive-scale economics depend on converting design and qualification relationships into sustained
        purchases rather than one-time evaluation batches.
      diligencePath: >-
        Obtain customer-signed qualification approvals, binding purchase commitments, minimum annual volumes,
        shipment schedules, acceptance data, and launch-platform identifiers.
      relatedQuestionRefs: [QU010]
