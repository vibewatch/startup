        - Mercedes-Benz named in a supply agreement and as an automotive relationship
        - Access to high-volume premium vehicle programs
        - No reviewed evidence of vehicle-level production volume or recurring offtake
      - - Cell manufacturers
        - Cell engineering, qualification, and procurement teams
        - Integrate anode material into lithium-ion cells
        - Panasonic named; Sila says qualification material reached major global cell makers
        - Channel into multiple downstream OEM platforms
        - No order quantity, conversion rate, pricing, or exclusivity terms
      - - Flight, space, defense, data centers, and robotics
