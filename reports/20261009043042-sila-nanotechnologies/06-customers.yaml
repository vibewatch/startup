        - Energy-dense batteries for constrained or high-performance applications
        - Application categories appear on Sila's site; no named customer in the reviewed pool
        - Potential diversification beyond wearables and EVs
        - No public deployment, customer count, or revenue contribution
    notes: >-
      Segments reflect the assigned source pool as of 2026-10-09; scale proof is not a revenue estimate,
      and null customer economics are treated as diligence gaps rather than inferred values.
    claimRefs: [CU001, CU002, CU004, CU005, CU006, CU013, CU014, CU016]
