        - No binding volume, launch vehicle, shipment, pricing, or renewal disclosure
      - - Panasonic
        - Cell manufacturer
        - Cell-level material optimization and qualification
        - Named supply agreement / qualification relationship
        - No customer-level production outcome disclosed in the reviewed pool
        - Company source plus independent profile
        - No production conversion, order quantity, exclusivity, or realized revenue disclosure
    notes: >-
      This is a partial enumeration limited to names substantiated in the assigned fetched sources; company
      statements identify five agreements but do not name every counterparty or disclose current contract status.
    enumerationScope:
      coverage: partial
      basis: Publicly named downstream relationships in the eight assigned fetched sources reviewed on 2026-10-09.
