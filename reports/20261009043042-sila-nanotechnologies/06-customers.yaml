figures:
  - id: FU001
    title: Evidence-based customer journey and expansion loop
    type: journey-map
    summary: >-
      The public record supports a long qualification sequence but provides no stage conversion rates or
      retention metrics.
    data:
      items:
        - label: Segment targeting
          detail: Select device, automotive, cell-manufacturer, or specialized application accounts.
          touchpoints:
            - Application positioning
            - Enterprise prospecting
        - label: Buying-center mapping
          detail: Identify engineering, procurement, program, and executive stakeholders across regions.
          touchpoints:
            - CRM account map
            - Account strategy meeting
        - label: Material validation
          detail: Customer tests material against cell and product requirements.
          touchpoints:
            - Qualification batch
            - Engineering review
        - label: Supply agreement
          detail: Relationship advances to commercial terms, though public minimum volumes are unavailable.
          touchpoints:
            - Contract negotiation
            - Program planning
        - label: Product launch
          detail: Material appears in a shipping product; WHOOP is the clearest public example.
          touchpoints:
            - Production integration
            - End-product release
        - label: Volume expansion
          detail: Repeat orders and additional programs would establish durability, but public evidence is absent.
          touchpoints:
            - Reorder
            - Additional platform
    approximationNotes: >-
      Conceptual sequence inferred from Sila's WHOOP account, supply-agreement disclosures, and Vizrm's
      account-planning case; no stage populations, conversion rates, or elapsed times beyond WHOOP's
      reported ten-month validation-to-launch period are available.
    claimRefs: [CU010, CU015, CU016]
callouts:
  - calloutType: strength
    title: A shipped-product proof point exists
    body: >-
      WHOOP 4.0 is stronger evidence than a logo or pilot because the reviewed sources describe an actual
      2021 product launch and quantified device-level outcomes.
    claimRefs: [CU002, CU003]
  - calloutType: risk
    title: Design wins are not demonstrated volume demand
    body: >-
      Qualification, supply agreements, and strategic-account activity do not reveal recurring orders,
      customer concentration, retention, or contract economics.
    claimRefs: [CU008, CU009, CU016]
