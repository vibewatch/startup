slug: sila-nanotechnologies
runDate: "2026-10-09"
company:
  name: Sila Nanotechnologies
chapter:
  number: 7
  title: Risks
  summary: >-
    The highest residual risks are manufacturing ramp execution, conditional financing,
    and dependence on a small set of disclosed customer programs. Public evidence shows
    formal safety and DOE-conflict controls, but it does not disclose current plant yield,
    customer concentration, independent durability results, or the conditions and funded
    availability of the announced loan commitment.
sections:
  - id: ranked-risk-posture
    title: Ranked Residual Risk Posture
    body: >-
      Sila's risk profile is dominated by the transition from demonstrated material and
      consumer-device use to auto-scale production. An independent industry profile reports
      that Moses Lake opened in September 2025 with initial material capacity for 20,000 to
      50,000 EVs per year and much larger expansion potential, while a current company job
      repost describes first-of-its-kind manufacturing, commissioning, bulk-material
      handling, and startup work. Those disclosures support a high-impact execution risk,
      not a conclusion that a failure has occurred. The key monitor is stable, repeatable
      yield and unit cost at contracted quality; failure to evidence those metrics after
      ramp would materially weaken the scale thesis.
    claimRefs:
      - CR004
      - CR005
      - CR006
    tableRefs:
      - TR002
    figureRefs:
      - FR001
  - id: legal-regulatory-and-safety
    title: Legal, Regulatory, and Process-Safety Controls
    body: >-
      The available record shows controls but not their operating effectiveness. Sila's
      published conflict policy requires recurring disclosures, Compliance Committee
      review, and special reporting for DOE-funded work; its engineering recruitment also
      calls for HAZOP closure, Management of Change, safety-system design, and alarm
      management. These are relevant mitigations for federal-award and chemical-process
      risk. However, the assigned evidence includes no regulator docket, permit register,
      audit result, enforcement record, or current incident log. Accordingly, the analysis
      does not infer a clean compliance history from the absence of a retained adverse
      result. Closing diligence requires source-level permit, audit, and safety-closeout
      records.
    claimRefs:
      - CR006
      - CR007
      - CR008
      - CR014
    tableRefs:
      - TR001
  - id: partner-capital-and-concentration
    title: Partner, Capital, and Concentration Exposure
    body: >-
      Public disclosures identify Mercedes-Benz and Panasonic within five company-claimed
      supply agreements, but they do not provide contracted volumes, take-or-pay terms,
      program revenue, cancellation rights, or customer concentration. A 2026 market-data
      page reports a $300 million Series G, while Sila announces a conditional $1.4 billion
      loan commitment and its 2024 paper described a further $1.0 billion to $1.5 billion
      Moses Lake investment plan. These figures are different measures: capital raised,
      conditional financing, and planned investment do not establish cash on hand or
      runway. The financing kill criterion is inability to satisfy loan conditions or fund
      the next ramp stage without materially adverse delay or dilution.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR009
      - CR010
      - CR015
    tableRefs:
      - TR003
  - id: mitigations-monitors-and-kill-criteria
    title: Mitigations, Monitoring Indicators, and Thesis-Break Triggers
    body: >-
      Mitigation maturity is mixed. Formal conflict, reporting, HAZOP, change-management,
      and alarm-management processes are visible, and direct ownership of manufacturing
      process and tool-design IP can reduce licensing dependence. The technical record is
      less conclusive: Sila asserts independent validation and conventional-cell-equivalent
      life, while an external technical overview repeats performance claims without
      exposing underlying test protocols or datasets. Investors should monitor plant yield,
      scrap, qualification pass rates, customer launch timing, safety closeouts, and
      financing-condition completion. Thesis-break events are a material safety or
      regulatory action, repeated customer qualification failure, persistent uneconomic
      yield, loss of anchor programs, or inability to finance contracted production.
    claimRefs:
      - CR006
      - CR007
      - CR008
      - CR011
      - CR012
      - CR013
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Rule, right, or exposure
      - Jurisdiction
      - Public status
      - Likelihood
      - Impact
      - Visible mitigation
      - Residual exposure
      - Diligence path
    rows:
      - - DOE financial-conflict obligations
        - United States federal awards
        - Company policy specifies disclosure, subrecipient, and reporting procedures; operating compliance is not public
        - Unknown
        - High
        - Compliance Committee review, annual disclosure, retrospective review, and mitigation reporting
        - Medium because audit results and award-level reports are unavailable
        - Obtain DOE award correspondence, FCOI reports, training logs, and audit findings
      - - Process safety and environmental compliance
        - Washington and applicable US standards
        - Engineering requirements reference NFPA, API, ASME, OSHA, HAZOP, and Management of Change; permit closeout is not public
        - Medium during commissioning
        - High
        - HAZOP closure, safety-system design, relief systems, alarm management, and MOC
        - High until commissioning and permit evidence is reviewed
        - Review permits, PHA and HAZOP closeout, OSHA logs, environmental notices, and emergency-response plans
      - - Patent ownership and freedom to operate
        - United States and international markets
        - An independent industry profile reports more than 250 patents filed and pending; enforceability and freedom to operate are untested here
        - Unknown
        - High
        - Company-claimed retention of process-control, equipment-design, and manufacturing IP
        - Medium because patent count does not establish claim scope or non-infringement
        - Commission patent-claim mapping, freedom-to-operate review, and challenge-history search
    notes: >-
      Partial public-evidence register, ordered by assessed impact. Likelihood, impact, and
      residual labels are analyst judgments based on the cited obligations and mitigations,
      not reported violations or measured incident frequencies.
    enumerationScope:
      coverage: partial
      basis: >-
        Public legal, federal-award, process-safety, and IP exposures identifiable in the
        eight successful sources allocated to this chapter as of 2026-10-09.
    claimRefs:
      - CR006
      - CR007
      - CR008
      - CR013
      - CR014
  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Likelihood
      - Impact
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - - Continuous-process scale-up misses stable yield or throughput
        - Medium
        - High
        - Developing; current hiring covers design through startup and initial operation
        - High
        - Current run-rate output, first-pass yield, scrap, uptime, and unit cost
      - - Bulk powder conveying, blending, screening, or packaging underperforms
        - Medium
        - High
        - Developing; specialist design, controls, and commissioning responsibilities are visible
        - Medium-high
        - Reliability history, bottleneck data, dust controls, and maintenance burden
      - - Automotive cell qualification misses durability or safety thresholds
        - Medium
        - High
        - Claimed advanced, but public independent test evidence is thin
        - High
        - Named lab protocol, cycle and calendar-life curves, swelling, and failure distributions
      - - Safety closeouts lag startup or a material event occurs
        - Unknown
        - High
        - Formal HAZOP, MOC, alarm, and safety-system processes are described
        - Medium-high
        - HAZOP action closure, incident history, regulator inspection results, and insurance claims
    notes: >-
      Qualitative risk rankings synthesize current commissioning signals and company
      performance claims. No assigned source reports plant-level failure frequencies, yield,
      current incident counts, or security-control testing.
    claimRefs:
      - CR004
      - CR005
      - CR006
      - CR011
      - CR012
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration evidence
      - Failure scenario
      - Impact
      - Visible mitigation
      - Residual exposure
    rows:
      - - Automotive and cell qualification
        - Mercedes-Benz, Panasonic, and undisclosed agreement counterparties
        - Customer and cell-integration programs
        - Five supply agreements are company-claimed; value and volume shares are undisclosed
        - Qualification delay, launch deferral, cancellation, or lower committed volume
        - High
        - Parallel qualification and multiple disclosed agreements
        - High until binding volumes, timing, and concentration are verified
      - - Conditional project financing
        - Undisclosed lender or federal program on the retained homepage
        - Conditional $1.4 billion loan commitment
        - Conditions, draw schedule, covenants, and funded availability are undisclosed
        - Conditions are not met or draws arrive after required construction spending
        - High
        - $300 million Series G reported in July 2026
        - High because funding raised is not proof of cash available for the full ramp
      - - Proprietary manufacturing execution
        - Sila-operated Alameda and Moses Lake facilities
        - Direct production, process control, and key equipment design
        - Company strategy emphasizes direct manufacturing rather than licensing
        - Facility, equipment, workforce, or process bottleneck constrains all programs
        - High
        - Two facilities and retained internal process and tool-design IP
        - Medium-high pending site redundancy, business-continuity, and qualified alternate-path evidence
    notes: >-
      Concentration is not quantified because no assigned source discloses revenue,
      contracted-volume, cash, or facility-output denominators. Financing values are kept
      separate by metric and do not imply liquidity.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR009
      - CR010
      - CR013
      - CR015
