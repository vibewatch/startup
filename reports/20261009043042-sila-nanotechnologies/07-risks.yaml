callouts:
  - calloutType: risk
    title: Financing evidence must be kept on three separate bases
    body: >-
      The $300 million Series G is reported capital raised, the $1.4 billion headline is a
      conditional loan commitment, and the $1.0 billion to $1.5 billion figure is a 2024
      company investment plan. None is evidence of current unrestricted cash. Underwrite
      the ramp only after reviewing cash, committed draws, conditions precedent, covenants,
      construction obligations, and downside funding needs.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR015
