callouts:
  - calloutType: "insight"
    title: "The Qualification Chasm in Automotive Battery Materials"
    body: "Securing commercial adoption for silicon anode technology requires traversing a multi-year qualification chasm. Unlike consumer electronics where Whoop achieved commercial deployment within 10 months, automotive OEMs demand 3 to 5 years of pre-production validation and multi-ton material deliveries before final supply contract execution. This dynamic forces advanced materials startups to finance capital-intensive GWh-scale factories in advance of firm offtake conversion."
    claimRefs:
      - "CM010"
      - "CM011"
      - "CM014"
  - calloutType: "risk"
    title: "Single-Point-of-Failure Vulnerability in Upstream Supply Chains"
    body: "China's control of more than 90% of global anode material processing and 80% of battery cell manufacturing creates an existential supply vulnerability for Western OEMs and defense contractors. While federal grants and conditional loan commitments aim to onshore capacity, U.S. domestic anode production is projected to satisfy only 25% of domestic demand by 2035, underscoring severe structural dependence on foreign supply chains."
    claimRefs:
      - "CM013"
      - "CM015"
