company:
  name: "Sila Nanotechnologies"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Sila is a 2011-founded, Alameda-headquartered battery-materials company commercializing Titan Silicon, a silicon-carbon anode material, with production ramping at Moses Lake after operations began in fall 2025. The July 2026 $300 million financing is well supported, but its series label, current valuation, complete governance rights, revenue, customers, and verified headcount remain partly dependent on third-party or private evidence."
sections:
  - id: "identity-and-business"
    title: "Identity and Business Model"
    body: "Independent company profiles place Sila Nanotechnologies' founding in 2011 and headquarters in Alameda, California. Sila describes itself as an advanced battery-technology company that develops and manufactures Titan Silicon, its silicon-carbon anode material for lithium-ion applications. The commercial model therefore depends on selling manufactured anode material rather than merely licensing research: the company says it combines U.S. intellectual property with domestic production and positions the material as a graphite replacement. The retained evidence establishes the product category and physical-production orientation, but it does not disclose current revenue, unit pricing, gross margin, or customer concentration. Those omissions prevent a public-data assessment of whether manufacturing scale has translated into durable commercial economics."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO010"
  - id: "milestones-and-scale"
    title: "Milestones and Operating Scale"
    body: "Sila's public chronology shows a long commercialization cycle. Tracxn records early federal funding in 2012 and later equity and grant events; Sila says its first product launched in 2021. The company reported that Moses Lake construction was completed and operations began in fall 2025, then announced $300 million of private equity in July 2026 to ramp Titan Silicon production and support a planned second expansion phase. This is tangible factory and financing progress, but the evidence does not verify production yield, shipped tonnage, utilization, or customer acceptance at automotive scale. The milestone sequence should therefore be read as evidence of technical and capital progression, not as proof of profitable volume production."
    claimRefs:
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
    tableRefs:
      - "TO001"
    figureRefs:
      - "FO001"
  - id: "leadership-and-governance"
    title: "Leadership and Governance"
    body: "Founder continuity is unusually visible in the operating team. Sila identifies Gene Berdichevsky as co-founder and chief executive, Gleb Yushin as co-founder and chief technology officer, and Alex Jacobs as co-founder and vice president of engineering. Their backgrounds span automotive battery engineering, materials science, and cell development, supporting founder-market fit across science and commercialization. Abbey Omokhodion and Chris Dougher add dedicated finance and manufacturing leadership as chief financial officer and chief operating officer. However, the allocated evidence does not provide authoritative current board appointments, voting rights, investor protective provisions, or founder ownership. The resulting governance gap is material because late-stage financing rights may constrain strategic decisions even when founders retain operating titles."
    claimRefs:
      - "CO011"
      - "CO012"
    tableRefs:
      - "TO002"
  - id: "capital-and-verification-boundaries"
    title: "Capital Base and Verification Boundaries"
    body: "Forge and Tracxn each report approximately $1.61 billion of cumulative funding, while Sila's own July 2026 release confirms only the latest $300 million private-equity raise and its named participants. Forge and Tracxn also report a $2.33 billion valuation for July 2026, but the official release does not disclose a valuation. More importantly, the databases disagree on the round label: Forge calls it Series H, Tracxn calls it Series G, and Sila uses neither label. The valuation should therefore remain a third-party estimate rather than an official company metric. Tracxn separately reports 431 employees as of August 31, 2026; no allocated official source corroborates that count. Revenue, cash availability, debt terms, customer count, and the complete preference stack remain open diligence items."
    claimRefs:
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
    tableRefs:
      - "TO003"
