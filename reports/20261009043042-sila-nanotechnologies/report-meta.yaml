  topStrengths:
    - Commercial factory progress is visible, including Moses Lake ramp activity and a substantial July 2026 financing.
    - >-
      The company has named customer and partner proof across consumer wearables, automotive OEMs, and cell
      manufacturers.
    - Founder continuity and technical leadership remain unusually strong for a late-stage battery materials company.
  topRisks:
    - Public revenue, gross margin, and unit-economics disclosure remains absent.
