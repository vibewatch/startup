companyProfile:
  summary: >-
    Sila Nanotechnologies is an Alameda-headquartered battery materials company founded in 2011 and led by its original
    technical founders. It develops and manufactures Titan Silicon, a silicon-carbon anode material for lithium-ion
    batteries, and has moved from consumer-device validation into a Moses Lake production ramp supported by a July 2026
    $300 million financing and a conditional $1.4 billion loan commitment. The public record confirms meaningful
    commercial and industrial progress, but revenue, margins, customer concentration, and current board control remain
    opaque.
