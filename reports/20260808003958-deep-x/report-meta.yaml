companyProfile:
  summary: DEEPX is a South Korean edge-AI semiconductor company founded in 2018 and based in Pangyo, Seongnam-si. The company
    builds low-power merchant AI accelerators, modules, and deployment-enabling software for robots, cameras, industrial computers,
    and other physical-AI endpoints. DX-M1 is in mass production, the partner stack is broadening quickly, and the first close
    of Series D set a reported $2.2 billion mark. The commercial story is credible, but public financial, governance, and
    customer-durability disclosure still trails the price.
  foundedDate: '2018-01-01'
  founders:
  - name: Lokwon Kim
    role: Founder & CEO
    background: Founder-CEO who remains the central public face of DEEPX strategy, product, and commercialization.
    claimRefs:
