  foundingLocation: Seongnam-si, Gyeonggi-do, South Korea
  headquarters: Pangyo, Seongnam-si, Gyeonggi-do, South Korea
  productSummary: DX-M1, DX-M1M, DX-H1 products, and the DXNN software stack target low-power inference across robots, smart
    cameras, industrial systems, and edge servers.
  customerFocus: Robotics OEMs, industrial and embedded-computing vendors, smart-camera and VMS vendors, distributors, and
    system integrators.
  businessModel: Fabless semiconductor sales of chips, modules, and cards, supported by software tooling and partner enablement
    to convert design wins into production deployments.
  stage: series-d
  fundingStatus: First close of Series D completed in August 2026 at a reported $2.2 billion valuation; the wider round remains
