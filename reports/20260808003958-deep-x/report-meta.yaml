  topStrengths:
  - DX-M1 is shipping into a widening partner and channel ecosystem rather than remaining a lab-only product.
  - DEEPX is positioned in a real physical-AI wedge where low-power local inference solves concrete problems.
  - Public pricing, orders, validations, and named partners make the commercialization story materially more tangible than
    average.
  - The company is building silicon, software, and ecosystem layers rather than a one-chip narrative.
  topRisks:
  - The $2.2 billion first-close valuation is hard to fully justify without better public margin and customer-quality disclosure.
  - Samsung concentration and DX-M2 roadmap ambition create real execution risk.
  - Open funding and reported pre-IPO contraction show that late-stage investor skepticism is already present.
  - Incumbent ecosystems remain a structural competitive threat even if DEEPX wins on power and form factor.
  unresolvedGaps:
  - Audited or prospectus-grade financial disclosure on gross margin, runway, and burn.
  - Repeat-order, retention, and concentration metrics by customer and channel.
  - Single authoritative financing history and current round target.
  - Independent benchmark and long-duration reliability evidence for the broader roadmap.
