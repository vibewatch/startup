sections:
- id: classes
  title: Direct peers, incumbents, and substitutes
  body: DEEPX competes from a merchant low-power edge-AI position against direct specialists, integrated incumbents, and system-level
    substitutes. This section focuses on direct peers, incumbents, and substitutes within the broader competitors question.
    Public sources repeatedly point to Hailo is the closest specialist peer. Public sources repeatedly point to Qualcomm,
    NXP, and NVIDIA are system-level incumbents. Public sources repeatedly point to Rockchip and Coral represent substitute
    paths. For DEEPX, the practical conclusion is that Hailo is the closest specialist peer should be interpreted in the context
    of physical-AI commercialization rather than abstract AI hype. For DEEPX, the practical conclusion is that Qualcomm, NXP,
    and NVIDIA are system-level incumbents should be interpreted in the context of physical-AI commercialization rather than
    abstract AI hype. The main caution is that not every public signal carries the same evidentiary weight, so the chapter
    distinguishes between official product or partner statements, independent reporting, and true unresolved gaps.
