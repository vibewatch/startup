  evidenceGaps:
  - type: missing-source
    severity: material
    topic: audited disclosure
    missingEvidence: Audited or prospectus-grade disclosure on margins, concentration, and board terms.
    whyItMatters: The public record is still too incomplete for full late-stage underwriting.
    diligencePath: Request banker-room materials or an IPO-ready package.
    relatedQuestionRefs:
    - QV022
  - type: private-evidence-only
    severity: material
    topic: enumeration coverage and customer durability
    missingEvidence: Repeat orders, retention, expansion by customer or channel, and complete rosters behind sampled tables.
    whyItMatters: Design wins and agreements are not the same as durable demand, and sampled enumeration tables may omit less-visible
      entities.
    diligencePath: Request repeat PO data, top-customer data, and full underlying enumerations for the sampled tables.
    relatedQuestionRefs:
    - QV023
    relatedTableRefs:
    - TV001
    - TV002
    - TV003
    - TV004
    - TV005
    - TV006
  - type: conflicting-data
    severity: material
    topic: capital structure
    missingEvidence: Single authoritative financing history and current round target.
    whyItMatters: PitchBook, Tracxn, and press reports do not fully align.
    diligencePath: Obtain company-confirmed round history and cap-table summary.
    relatedQuestionRefs:
    - QV024
  - type: stale
    severity: minor
    topic: independent validation
    missingEvidence: Independent benchmark and roadmap-validation package.
    whyItMatters: The most ambitious performance claims still rely heavily on company or partner materials.
    diligencePath: Request third-party benchmarking and roadmap milestone evidence.
    relatedQuestionRefs:
    - QV025
