sections:
- id: boundary
  title: Market boundary and included workloads
  body: DEEPX fits the physical-AI edge semiconductor market where power, heat, latency, and local inference matter more than
    hyperscale training throughput. This section focuses on market boundary and included workloads within the broader market-analysis
    question. Public sources repeatedly point to merchant edge inference rather than cloud training. Public sources repeatedly
    point to focus on robots, smart cameras, gateways, and industrial compute. Public sources repeatedly point to exclude
    broad cloud-AI spend from the practical wedge. For DEEPX, the practical conclusion is that merchant edge inference rather
    than cloud training should be interpreted in the context of physical-AI commercialization rather than abstract AI hype.
    For DEEPX, the practical conclusion is that focus on robots, smart cameras, gateways, and industrial compute should be
    interpreted in the context of physical-AI commercialization rather than abstract AI hype. The main caution is that not
    every public signal carries the same evidentiary weight, so the chapter distinguishes between official product or partner
    statements, independent reporting, and true unresolved gaps.
