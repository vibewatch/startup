companyProfile:
  summary: >-
    DEEPX 是一家韩国边缘 AI 半导体公司，2018 年成立，总部位于 Seongnam-si 的 Pangyo。公司面向机器人、摄像头、工业计算机和其他物理 AI 终端，打造低功耗商用 AI
    加速器、模组和支撑部署的软件。DX-M1 已进入量产，伙伴栈正快速扩张，Series D 首关据报把估值推到 $2.2 billion。商业叙事可信，但公开的财务、治理和客户持久性披露仍跟不上价格。
  foundedDate: '2018-01-01'
  founders:
    - name: Lokwon Kim
      role: 创始人兼 CEO
      background: 创始人兼 CEO，仍是 DEEPX 战略、产品和商业化对外叙事的核心人物。
      claimRefs:
        - CO003
  foundingLocation: Seongnam-si, Gyeonggi-do, South Korea
  headquarters: Pangyo, Seongnam-si, Gyeonggi-do, South Korea
  productSummary: DX-M1、DX-M1M、DX-H1 产品和 DXNN 软件栈，瞄准机器人、智能摄像头、工业系统和边缘服务器中的低功耗推理。
  customerFocus: 机器人 OEM、工业与嵌入式计算厂商、智能摄像头和 VMS 厂商、分销商以及系统集成商。
  businessModel: 作为 Fabless 半导体公司销售芯片、模组和板卡，并用软件工具和伙伴赋能把设计导入转成量产部署。
  stage: series-d
  fundingStatus: Series D 首关已于 2026 年 8 月完成，据报估值 $2.2 billion；更大一轮融资仍在进行，公开资料对最终规模和累计融资额说法不一。
