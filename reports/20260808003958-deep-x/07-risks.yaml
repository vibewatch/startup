  title: Top-ranked risk clusters
  body: The critical risks are foundry concentration, roadmap ambition, financing dependency, ecosystem competition, and limited
    public disclosure. This section focuses on top-ranked risk clusters within the broader risks question. Public sources
    repeatedly point to funding, roadmap, supply, ecosystem, and disclosure risks are interconnected. Public sources repeatedly
    point to one failure can transmit quickly into several other layers. Public sources repeatedly point to monitoring needs
    to be operational not rhetorical. For DEEPX, the practical conclusion is that funding, roadmap, supply, ecosystem, and
    disclosure risks are interconnected should be interpreted in the context of physical-AI commercialization rather than
    abstract AI hype. For DEEPX, the practical conclusion is that one failure can transmit quickly into several other layers
    should be interpreted in the context of physical-AI commercialization rather than abstract AI hype. The main caution is
    that not every public signal carries the same evidentiary weight, so the chapter distinguishes between official product
    or partner statements, independent reporting, and true unresolved gaps.
