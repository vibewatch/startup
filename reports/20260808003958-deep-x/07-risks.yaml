    public disclosure. This section focuses on regulatory, export, and supply-chain risk within the broader risks question.
    Public sources repeatedly point to Samsung concentration is the clearest structural exposure. Public sources repeatedly
    point to export controls and geopolitics can affect both supply and demand. Public sources repeatedly point to advanced-node
    transitions raise execution risk. For DEEPX, the practical conclusion is that Samsung concentration is the clearest structural
    exposure should be interpreted in the context of physical-AI commercialization rather than abstract AI hype. For DEEPX,
    the practical conclusion is that export controls and geopolitics can affect both supply and demand should be interpreted
    in the context of physical-AI commercialization rather than abstract AI hype. The main caution is that not every public
    signal carries the same evidentiary weight, so the chapter distinguishes between official product or partner statements,
