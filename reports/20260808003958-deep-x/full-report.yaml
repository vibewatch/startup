companyProfile:
  summary: >-
    DEEPX is a South Korean edge-AI semiconductor company founded in 2018 and based in Pangyo, Seongnam-si. The company
    builds low-power merchant AI accelerators, modules, and deployment-enabling software for robots, cameras, industrial
    computers, and other physical-AI endpoints. DX-M1 is in mass production, the partner stack is broadening quickly,
    and the first close of Series D set a reported $2.2 billion mark. The commercial story is credible, but public
    financial, governance, and customer-durability disclosure still trails the price.
  foundedDate: '2018-01-01'
  founders:
    - name: Lokwon Kim
      role: Founder & CEO
      background: Founder-CEO who remains the central public face of DEEPX strategy, product, and commercialization.
      claimRefs:
        - CO003
  foundingLocation: Seongnam-si, Gyeonggi-do, South Korea
  headquarters: Pangyo, Seongnam-si, Gyeonggi-do, South Korea
  productSummary: >-
    DX-M1, DX-M1M, DX-H1 products, and the DXNN software stack target low-power inference across robots, smart cameras,
    industrial systems, and edge servers.
  customerFocus: >-
    Robotics OEMs, industrial and embedded-computing vendors, smart-camera and VMS vendors, distributors, and system
    integrators.
  businessModel: >-
    Fabless semiconductor sales of chips, modules, and cards, supported by software tooling and partner enablement to
    convert design wins into production deployments.
  stage: series-d
  fundingStatus: >-
    First close of Series D completed in August 2026 at a reported $2.2 billion valuation; the wider round remains open
    and public sources disagree on final size and lifetime capital raised.
