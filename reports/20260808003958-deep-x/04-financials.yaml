- id: traction
  title: Traction and public metrics
  body: Commercial signals are credible, but public disclosure on margin, burn, concentration, and backlog quality remains
    incomplete. This section focuses on traction and public metrics within the broader financials question. Public sources
    repeatedly point to orders, validations, and revenue guidance all improved in 2026. Public sources repeatedly point to
    historic losses remain material on the last disclosed annual baseline. Public sources repeatedly point to commercial proof
    is real but not yet fully audited. For DEEPX, the practical conclusion is that orders, validations, and revenue guidance
    all improved in 2026 should be interpreted in the context of physical-AI commercialization rather than abstract AI hype.
    For DEEPX, the practical conclusion is that historic losses remain material on the last disclosed annual baseline should
    be interpreted in the context of physical-AI commercialization rather than abstract AI hype. The main caution is that
    not every public signal carries the same evidentiary weight, so the chapter distinguishes between official product or
    partner statements, independent reporting, and true unresolved gaps.
