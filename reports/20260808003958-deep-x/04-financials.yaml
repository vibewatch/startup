- id: capital
  title: Cost structure, burn, and capital adequacy
  body: Commercial signals are credible, but public disclosure on margin, burn, concentration, and backlog quality remains
    incomplete. This section focuses on cost structure, burn, and capital adequacy within the broader financials question.
    Public sources repeatedly point to advanced-node fabless scaling remains expensive. Public sources repeatedly point to
    open funding and a later IPO still matter. Public sources repeatedly point to DX-M2 raises both upside and funding needs.
    For DEEPX, the practical conclusion is that advanced-node fabless scaling remains expensive should be interpreted in the
    context of physical-AI commercialization rather than abstract AI hype. For DEEPX, the practical conclusion is that open
    funding and a later IPO still matter should be interpreted in the context of physical-AI commercialization rather than
    abstract AI hype. The main caution is that not every public signal carries the same evidentiary weight, so the chapter
    distinguishes between official product or partner statements, independent reporting, and true unresolved gaps.
