- id: verdict
  title: Financial verdict and missing disclosures
  body: Commercial signals are credible, but public disclosure on margin, burn, concentration, and backlog quality remains
    incomplete. This section focuses on financial verdict and missing disclosures within the broader financials question.
    Public sources repeatedly point to unit economics remain the weakest disclosed layer. Public sources repeatedly point
    to backlog quality and customer concentration are unresolved. Public sources repeatedly point to valuation-grade underwriting
    still needs audited detail. For DEEPX, the practical conclusion is that unit economics remain the weakest disclosed layer
    should be interpreted in the context of physical-AI commercialization rather than abstract AI hype. For DEEPX, the practical
    conclusion is that backlog quality and customer concentration are unresolved should be interpreted in the context of physical-AI
    commercialization rather than abstract AI hype. The main caution is that not every public signal carries the same evidentiary
    weight, so the chapter distinguishes between official product or partner statements, independent reporting, and true unresolved
    gaps.
