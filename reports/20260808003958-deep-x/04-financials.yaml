sections:
- id: model
  title: Revenue model and pricing
  body: Commercial signals are credible, but public disclosure on margin, burn, concentration, and backlog quality remains
    incomplete. This section focuses on revenue model and pricing within the broader financials question. Public sources repeatedly
    point to hardware sales anchor the model. Public sources repeatedly point to chips, modules, cards, and enablement create
    the monetization ladder. Public sources repeatedly point to public pricing exists but realized ASPs are still opaque.
    For DEEPX, the practical conclusion is that hardware sales anchor the model should be interpreted in the context of physical-AI
    commercialization rather than abstract AI hype. For DEEPX, the practical conclusion is that chips, modules, cards, and
    enablement create the monetization ladder should be interpreted in the context of physical-AI commercialization rather
    than abstract AI hype. The main caution is that not every public signal carries the same evidentiary weight, so the chapter
    distinguishes between official product or partner statements, independent reporting, and true unresolved gaps.
  claimRefs:
