  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: debt-covenants
    missingEvidence: Borrowing base, covenant thresholds, pricing, amortization, and collateral details for the Ares facility.
    whyItMatters: Debt can convert a policy or benchmark shock into liquidity stress, but the public record cannot quantify that stress path.
    diligencePath: Request full credit agreement and lender reporting package.
    relatedQuestionRefs:
    - QR014
    - QR038
  - type: missing-source
    severity: material
    topic: security-controls
    missingEvidence: Public SOC 2, HITRUST, incident-response documentation, status history, or uptime disclosures.
    whyItMatters: Healthcare workflow software touching patient data has meaningful cyber and reliability exposure.
    diligencePath: Request security-certification package, uptime history, and incident summaries from product/security leadership.
    relatedQuestionRefs:
    - QR017
    - QR037
  - type: private-evidence-only
    severity: material
    topic: concentration-and-retention
    missingEvidence: Top payer, top practice, top region, top channel, NRR, GRR, and churn data.
    whyItMatters: Outside investors cannot measure how fragile growth is to the loss of a few important relationships.
    diligencePath: Request concentration schedules and renewal cohorts by segment and geography.
    relatedQuestionRefs:
    - QR028
    - QR029
    - QR039
