- id: operational-partner-and-customer-risk
  title: Operational risk is mostly dependency risk disguised as workflow success
  body: 'Aledade''s strongest public proof stories also reveal its dependency map. The athenahealth, Surescripts, and Manifest MedEx case studies are valuable precisely because they show real deployment. But they also show that customer value depends on EHR compatibility, partner data feeds, ADT notifications, medication-history availability, and continued workflow trust. If those rails degrade, the customer may experience the failure as an Aledade problem even when the root cause sits with a partner.


    The public pack also leaves security and reliability questions open. There is strong evidence that Aledade has built useful workflow products, including Assist and the EHR overlay. There is not equally strong evidence on formal security certifications, public uptime history, or external model-validation metrics for AI-enabled clinical suggestions. That does not prove weakness, but it does mean investors must diligence those areas directly rather than assuming the customer case studies answer them.


    Customer risk is similarly asymmetric. Aledade has much better named proof than many private healthcare startups, yet the proof set is still curated toward success. Public churn, NRR, GRR, and concentration by payer or practice are absent. That makes the customer base look real, but its durability less measurable than its headline growth.'
