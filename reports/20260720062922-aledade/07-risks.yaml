- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - CMS downside-risk acceleration
    - Rule or benchmark change worsens cohort economics
    - Meaningful step-down in expected shared-savings margin for low-revenue ACO cohorts
    - Re-underwrite growth and practice-retention assumptions
  - - Debt stress
    - Borrowing cost or covenant headroom tightens
    - Need to amend facility, add collateral, or materially slow partner distributions
    - Move valuation stance more cautious and prioritize downside cases
  - - Compliance event
    - New government investigation or material coding allegation
    - Regulator intervention, reserve build, or negative audit trend
    - Raise risk rating and require compliance diligence refresh
  - - Customer durability
    - Retention or concentration metrics disappoint
    - Large payer/practice/channel loss or materially weak renewal cohorts
    - Cut conviction on growth durability
  - - Operational dependency failure
    - Material partner data or integration disruption
    - Workflow downtime, feed loss, or prolonged manual workaround
    - Reassess product resilience and partner concentration
  - - Leadership / execution slippage
    - Bench or staffing fails to support growth
    - Implementation backlog, rising activation delays, or key-person departure
    - Reduce confidence until capacity plan is proven
  notes: These kill criteria are chosen because they are monitorable and connect directly to revenue, financing, and valuation transmission.
