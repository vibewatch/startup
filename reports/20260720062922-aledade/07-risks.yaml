  figureRefs:
  - FR001
- id: regulatory-and-legal-risk
  title: Regulatory risk is active and legal risk is narrowed but not erased
  body: 'Regulatory risk is live, current, and central to the investment case. CMS is pushing physician-led ACOs toward downside risk faster, revising quality and attribution mechanics, and continuing to experiment with mandatory payment models such as TEAM and the Ambulatory Specialty Model. Even when individual changes appear manageable, the broader message is that Aledade cannot assume a static policy environment. The business grows by helping practices win under Medicare value-based-care rules, which means rule volatility is not background noise—it is part of the product environment.


    The 2026 physician-payment changes illustrate the duality. On one hand, qualifying APM participants benefit from a better update than nonparticipants and CMS rhetoric remains supportive of primary care. On the other hand, the same rule package includes efficiency adjustments, quality-measure changes, and a faster push toward risk. Aledade therefore benefits from policy support while simultaneously remaining exposed to policy recalibration.


    Legal risk is less severe than it looked when the whistleblower suit surfaced. Court records show DOJ declined to intervene, the main False Claims Act counts were dismissed, and the remaining private-party dispute later resolved. That narrows immediate legal downside. But the episode still matters because it underscores how quickly coding, risk adjustment, and compliance questions can become reputational risk in this category. The right conclusion is not that Aledade is in acute legal trouble today; it is that compliance sensitivity remains structurally high.'
