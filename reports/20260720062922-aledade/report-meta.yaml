coverageNotes: >-
  This report was produced on 2026-07-20 using publicly available sources only. Aledade is a private
  company. Public evidence supports a 2023 Series F of $260 million at a reported $3.5 billion
  valuation, a 2025 $500 million senior secured Ares facility expandable to $650 million, a 2025
  third-party revenue marker of roughly $1 billion with profitability, and a 2026 network footprint
  of more than 3,000 primary care partners caring for more than 3 million patients across 46 states
  and the District of Columbia. Public materials still do not provide audited financial statements,
  a full revenue-quality bridge, cap-table preference terms, debt draw and covenant details, NRR,
  GRR, churn, or concentration schedules.
