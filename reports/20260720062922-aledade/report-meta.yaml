summary:
  headline: >-
    Aledade looks like one of the strongest private physician-led value-based-care platforms, but the
    visible 2026 valuation still appears stretched relative to public comps once debt, policy risk,
    and disclosure gaps are considered.
  overallScore: 6.8
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: stretched
  keyMetrics:
    valuationUsdM: 3500
    revenueRunRateUsdM: 1000
    arrUsdM: 750
    revenueGrowthYoYPct: null
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 660
    customerCount: 3000
    headcount: null
  topStrengths:
    - >-
      Aledade shows rare proof quality for a private healthcare platform: national scale, named
      customer deployments, and measurable outcome stories tied to clinical workflow rather than logo
      theater.
    - >-
      The product now looks like a real operating system for physician-led value-based care,
      including Aledade Assist, in-EHR overlays, analytics, care management, and payer or health-
      system enablement surfaces.
    - >-
      The company appears strategically differentiated from full-risk clinic aggregators because it
      focuses on enabling independent practices rather than owning the entire downstream care asset.
    - >-
      Financing access remains meaningful: Aledade attracted a large Series F syndicate and later a
      sizable Ares facility, signaling external belief in continued scale and cash-generation
      potential.
  topRisks:
    - >-
      The business is deeply exposed to CMS rule design, MSSP benchmarking, physician-payment policy,
      and other Medicare value-based-care mechanics that can change faster than private investors can
      reprice their underwriting.
    - >-
      The 2025 senior secured Ares facility makes working-capital timing and leverage a first-order
      valuation issue, yet draw, covenant, pricing, and collateral details remain private.
    - >-
      Public customer proof is strong on success stories but still weak on true durability: there is
      no disclosed NRR, GRR, churn, contract-duration, or concentration data by payer, practice, or
      region.
    - >-
      The visible private valuation asks investors to pay a premium to most public comps before
      audited cash economics, retention quality, and cap-table seniority are available.
  unresolvedGaps:
    - Exact cap table, liquidation preferences, option dilution, and waterfall economics for new money.
    - Current draw, cost, covenant package, and amendment flexibility on the Ares credit facility.
    - Audited revenue mix, EBITDA, cash flow, and working-capital profile behind the $1B 2025 revenue marker.
    - NRR, GRR, churn, top-payer, top-practice, top-region, and contract-duration data.
    - Real secondary-market depth and whether the visible $3.5B private marker reflects genuine clearing prices.
