companyProfile:
  summary: >-
    Aledade is a Bethesda-based, founder-led value-based-care company founded in 2014 by Farzad
    Mostashari and Mat Kendall. The company organizes independent primary care practices, community
    health centers, and related provider groups into accountable-care structures, supplies workflow,
    analytics, and AI-assisted tools such as Aledade Assist, and shares in economic upside from
    better quality and lower cost performance. By 2026, Aledade said it served more than 3,000
    primary care partners caring for more than 3 million patients across 46 states and the District
    of Columbia. Public evidence shows real scale and operating proof, but the business remains
    private and under-disclosed on audited cash economics, debt usage, concentration, and retention.
  foundedDate: '2014-01-01'
  founders:
    - name: Farzad Mostashari
      role: Co-Founder & CEO
      background: >-
        Former National Coordinator for Health IT who led HITECH-era digital health policy and remains
        one of the best-known policy operators in value-based care.
      claimRefs:
        - CO004
        - CO048
    - name: Mat Kendall
      role: Co-Founder & President
      background: >-
        Former safety-net and public-health operator whose background includes the Indian Health Center
        of Santa Clara Valley and HHS Regional Extension Center work.
      claimRefs:
        - CO005
        - CO049
  foundingLocation: Bethesda, Maryland, United States
  headquarters: Bethesda, Maryland, United States
  productSummary: >-
    Aledade sells a physician-led accountable-care operating system: contract participation,
    benchmark and quality analytics, in-workflow care-gap and clinical-insight tools, care-management
    support, and payer or health-system enablement for value-based-care execution.
  customerFocus: >-
    Independent primary care practices are the anchor users and economic partners, with community
    health centers, FQHCs, health systems, hospitals, and health plans acting as additional customer
    segments or channel partners.
  businessModel: >-
    Aledade primarily monetizes by helping practices and partner organizations earn shared savings,
    quality bonuses, and value-based-care economics, while providing technology and operating support
    that embeds the company into day-to-day clinical workflows.
  stage: Late-stage private platform with 2023 Series F financing and 2025 large-scale debt capacity
  fundingStatus: >-
    Aledade raised a $260 million Series F in 2023 at a reported $3.5 billion valuation and later
    added a $500 million senior secured credit facility from Ares in 2025 that can expand to $650
    million.
