  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: competitive-win-rates
    missingEvidence: Comparable win/loss data, retention rates, and average contract size for Aledade, Privia, Pearl, and agilon.
    whyItMatters: Public websites describe positioning but do not reveal who actually wins in live procurement or renewal decisions.
    diligencePath: Ask management for competitive win-loss analysis, churn cohorts, and representative deal economics.
    relatedQuestionRefs:
    - QP024
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: Source-backed contract model and pricing detail for the major peer set beyond generic packaging language.
    whyItMatters: Without pricing evidence, it is hard to tell whether peers compete on ROI, breadth, or channel trust.
    diligencePath: Request sample contracts or customer-side procurement documents and interview brokers or consultants.
    relatedQuestionRefs:
    - QP024
  - type: missing-source
    severity: minor
    topic: likely-entrants
    missingEvidence: Current evidence on Optum, CVS-signify combinations, or other new entrants targeting independent-primary-care enablement specifically.
    whyItMatters: The next refresh could see vertical incumbents move more directly into Aledade's wedge.
    diligencePath: Run a fresh entrant sweep across payer and retail-health strategy pages in the next cycle.
    relatedQuestionRefs:
    - QP025
  - type: private-evidence-only
    severity: material
    topic: distribution-concentration
    missingEvidence: Aledade's channel mix by payer, broker, or practice-referral source versus competitor channels.
    whyItMatters: Distribution concentration determines how defensible scale really is against incumbents and public peers.
    diligencePath: Request internal funnel data by channel and compare it with peer disclosures in investor materials.
    relatedQuestionRefs:
    - QP024
  - type: conflicting-data
    severity: minor
    topic: peer-market-share
    missingEvidence: Consistent apples-to-apples scale metrics across partner platforms and clinic owners.
    whyItMatters: Patient lives, members, providers, clinics, and beneficiaries measure different things and can overstate or understate overlap.
    diligencePath: Normalize peer metrics by attributed beneficiary lives, physician practices, and geography before the next refresh.
    relatedQuestionRefs:
    - QP025
