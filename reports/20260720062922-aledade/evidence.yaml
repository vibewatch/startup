evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A current full board roster, shareholder rights matrix, and cap-table control terms.
    whyItMatters: >-
      Governance concentration and investor protections affect both underwriting control risk and refresh-readiness of
      the report.
    diligencePath: Request the latest board deck or corporate governance summary plus the current cap table from management.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: valuation-gap
    missingEvidence: A current post-2023 equity valuation or secondary pricing reference after the 2025 Ares facility.
    whyItMatters: Later valuation work should not treat the 2023 Series F mark as current without evidence that the price held.
    diligencePath: Ask management or lead investors for the latest 409A, secondary print, or board-approved valuation memo.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited 2025 revenue, EBITDA, cash, and debt-service metrics.
    whyItMatters: >-
      Company-overview confidence on scale is high, but capital adequacy and profitability quality remain partially
      dependent on interview reporting.
    diligencePath: Request audited financial statements or lender materials that reconcile reported revenue and profitability claims.
    relatedQuestionRefs:
      - QO011
      - QO012
  - type: missing-source
    severity: minor
    topic: headcount
    missingEvidence: A current exact employee count rather than a Top Workplace survey population proxy.
    whyItMatters: Headcount is a standard cover fact and a useful efficiency denominator for product and financial analysis.
    diligencePath: Request the latest HR census or payroll headcount snapshot with domestic versus international split.
    relatedQuestionRefs:
      - QO016
  - type: conflicting-data
    severity: minor
    topic: network-scale
    missingEvidence: >-
      A normalized bridge reconciling partners versus practices versus organizations across 2023, 2025, and 2026
      disclosures.
    whyItMatters: Aledade uses multiple population labels, which can create false metric drift across chapters if not normalized.
    diligencePath: >-
      Ask management for a definitional glossary and year-by-year bridge for practices, organizations, clinicians, and
      attributed lives.
    relatedQuestionRefs:
      - QO013
      - QO018
    relatedTableRefs:
      - TO001
      - TO004
  - type: private-evidence-only
    severity: material
    topic: line-of-business-mix
    missingEvidence: A payer-line breakout of Aledade's current attributed patients across MSSP, MA, Medicaid, and commercial programs.
    whyItMatters: >-
      The mix determines how exposed the company is to Medicare fee-for-service versus managed-care economics and
      renewal cycles.
    diligencePath: Request current patient and revenue mix by line of business from management or lenders' materials.
    relatedQuestionRefs:
      - QM021
  - type: missing-source
    severity: material
    topic: unaffiliated-practice-base
    missingEvidence: >-
      A defensible count of independent primary care groups still outside Aledade or similar platforms in the states
      where it operates.
    whyItMatters: Without the remaining independent-practice pool, SOM expansion claims are difficult to size.
    diligencePath: >-
      Combine CMS participant files, NPPES taxonomy filtering, and state primary-care association rosters to estimate
      remaining unaffiliated supply.
    relatedQuestionRefs:
      - QM022
  - type: missing-source
    severity: minor
    topic: ma-group-channel
    missingEvidence: >-
      Aledade-specific evidence on whether MA group-plan channels meaningfully contribute attributed lives or
      commercial-like expansion.
    whyItMatters: The KFF group-plan statistic shows channel size but not Aledade's actual capture of that segment.
    diligencePath: Ask management for employer-sponsored retiree or plan-sponsor case studies and attributable lives by channel.
    relatedQuestionRefs:
      - QM023
  - type: enumeration-incomplete
    severity: material
    topic: state-concentration
    missingEvidence: >-
      State-by-state Aledade share across MSSP and non-Medicare contracts, including concentration in any one plan or
