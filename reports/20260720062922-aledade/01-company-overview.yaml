    {
      "id": "milestones-validation-and-adverse-signals",
      "title": "Milestones, Third-Party Validation, and Adverse Signals",
      "body": "Aledade's milestone record supports a credible market-leadership narrative, but it also shows the normal diligence caveats of a scaled private healthcare company. From 2023 through 2026 the company moved from a 1,500-practice network with 2 million patients to more than 3,000 partners and more than 3 million patients, while also disclosing stronger quality and savings outputs. The 2025 public-benefit materials claimed more than $775 million of shared-savings payments in 2024, over $1 billion of total Medicare savings, and an average of roughly $390,000 per practice. KLAS added outside validation in 2026 with a 95.7 score and a reported 100% re-partner rate among interviewed clinicians. At the same time, the legal record shows that the company did face False Claims Act coding allegations, even though the main counts were dismissed and Aledade says DOJ declined to intervene. That combination matters: Aledade looks like a strong operator with unusually positive partner feedback, but it is large enough that legal scrutiny, metric-label drift, and private-market opacity should be treated as normal diligence work rather than as reasons to skip verification.",
