    {
      "id": "capital-trajectory-and-cover-metrics",
      "title": "Capital Trajectory, Revenue Markers, and Cover-Metric Reliability",
      "body": "Aledade's public capital story is unusually strong for a private company even though important cover metrics are still incomplete. The company disclosed a $260 million Series F in June 2023 led by Lightspeed and supported by blue-chip existing investors, and in December 2025 it added a $500 million senior secured credit facility from Ares that can expand to $650 million. The use of proceeds matters: the facility is framed less as distress financing and more as working-capital infrastructure that bridges Medicare payment timing and accelerates shared-savings distributions back to clinician partners. Public revenue markers have also improved. Aledade disclosed more than $475 million of 2022 revenue in the Series F announcement, and Fierce Healthcare reported the company hit $1 billion of revenue in 2025 and was already profitable. Even so, current valuation, audited 2025 EBITDA, exact cash balance, and net leverage remain undisclosed in the retained public pack. The right takeaway is that Aledade has real scale and capital access, but still behaves like a private company in how much underwriteable financial detail it exposes.",
