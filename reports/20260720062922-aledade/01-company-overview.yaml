  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Aledade enters mid-2026 as the largest independent-primary-care value-based care network in the U.S., with more than 3,000 partner organizations, over 3 million patient lives touched by value-based contracts, and a newly expanded $500 million credit facility on top of its 2023 Series F. Public evidence strongly supports market leadership, mission alignment, and recent operational momentum, but exact current valuation, audited 2025 financials, and a fully transparent governance map remain private."
  },
  "sections": [
    {
      "id": "identity-stage-and-scale",
      "title": "Identity, Stage, and Operating Scale",
      "body": "Aledade should be treated as a physician-led value-based primary care enablement platform rather than as a payer, a clinic roll-up, or a health system owner. Its official site describes a model built to help independent practices and community health centers stay autonomous while using technology, analytics, care management support, and payer contracting to earn more of their economics through value-based care. That identity is reinforced by 2026 scale disclosures showing more than 3,000 primary care partners, more than 3 million patients, and operations spanning 46 states plus the District of Columbia. Public materials also show a consistent mission through time: Aledade was founded in 2014, remains headquartered in Bethesda, and presents itself as a public benefit corporation that measures performance through both patient outcomes and practice sustainability. The reusable conclusion for later chapters is that Aledade is a late-stage, national, independent-primary-care infrastructure company with meaningful market share inside MSSP and expanding relevance across non-Medicare lines.",
