  topStrengths:
    - Aledade 给出了私营医疗平台少见的高质量证据：全国规模、具名客户落地，以及与临床工作流绑定的可量化结果，而不是 logo 展示。
    - 产品已像医生主导价值医疗的真正操作系统，覆盖 Aledade Assist、EHR 内叠加层、分析、护理管理，以及支付方或医疗系统赋能界面。
    - 公司相对全风险诊所聚合商有战略区隔：Aledade 赋能独立诊所，而不是把下游护理资产全部买下来。
    - 融资通道仍有分量：Aledade 拉到大型 Series F 财团，之后又拿到相当规模的 Ares 融资安排，说明外部资金仍相信其继续扩张和造血潜力。
  topRisks:
    - 业务深度暴露于 CMS 规则设计、MSSP 基准、医生支付政策等 Medicare 价值医疗机制；这些变量变动速度可能快过私募投资人的重估。
    - 2025 年 Ares senior secured facility 让营运资金节奏和杠杆成为估值一阶问题，但提款、契约、定价和抵押细节仍未公开。
    - 公开客户证据在成功案例上很强，但真正耐久性仍弱：公司没有披露 NRR、GRR、流失、合同期限，或按支付方、诊所、地区拆分的集中度数据。
    - 可见私募估值要求投资人在经审计现金经济、留存质量和股权结构优先级出现前，就支付高于多数上市可比公司的溢价。
  unresolvedGaps:
    - 完整股权结构表、清算优先权、期权稀释，以及新资金的 waterfall 经济。
    - Ares 信贷安排的当前提款、成本、契约组合和修订灵活性。
    - 支撑 2025 年 $1B 收入标记的经审计收入结构、EBITDA、现金流和营运资金画像。
    - NRR、GRR、流失、头部支付方、头部诊所、头部地区和合同期限数据。
    - 真实二级市场深度，以及可见的 $3.5B 私募标记是否代表真实成交价。
