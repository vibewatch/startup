      - number: '2.4'
        title: Growth drivers are real, but policy design and channel shift constrain upside
        blocks:
          - type: paragraph
            body: >-
              The strongest growth driver is that CMS is still actively broadening accountable-care participation rather
              than winding it down. Participation hit a new high in 2026, shared-savings dollars have compounded
              materially since program launch, and CMS is still adding new rails such as ACO PC Flex and LEAD. For
              Aledade specifically, the fact that low-revenue ACOs remain the majority of MSSP entrants is constructive
              because physician-led fragmentation is the company's historical wedge. Commercial alliances like CareFirst
              also suggest the company's market can expand outside pure Medicare fee-for-service when payers want to
              improve network performance without owning the physician operating layer themselves.


              The hardest constraint is that the market is still policy-designed. Benchmark formulas, risk tracks,
              participation thresholds, and methodology changes all come from CMS, not from vendor pricing freedom. ACO
              PC Flex exists because basic fee-for-service timing does not fund advanced primary care well enough on its
              own, which is positive for enablement vendors but also proof that market economics remain dependent on
              reimbursement design. KFF's 2026 Medicare Advantage analysis adds a second constraint: MA now covers most
              eligible Medicare beneficiaries and is already drawing sustained scrutiny because payments are higher than
              comparable traditional Medicare spending. That does not invalidate the value-based-care thesis, but it
              means Aledade cannot assume that managed-care expansion is a frictionless offset to MSSP concentration.


              The investment takeaway is therefore nuanced. The market is large enough, growing, and clearly important
              to CMS and payers. But it is not a clean software TAM. It is a regulated, multi-channel operating market
              where growth depends on primary-care fragmentation, payer appetite, and benchmark design staying favorable
              enough for independent practices to keep needing a partner like Aledade. The remaining diligence work
              should focus on line-of-business mix, remaining independent-practice supply, and unit economics rather
              than on proving the category exists.
