              record shows that the company did face False Claims Act coding allegations, even though the main counts
              were dismissed and Aledade says DOJ declined to intervene. That combination matters: Aledade looks like a
              strong operator with unusually positive partner feedback, but it is large enough that legal scrutiny,
              metric-label drift, and private-market opacity should be treated as normal diligence work rather than as
              reasons to skip verification.
