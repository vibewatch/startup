      - number: '3.4'
        title: Switching costs are real but not absolute, so moat durability depends on trust and execution
        blocks:
          - type: paragraph
            body: >-
              Aledade does benefit from switching costs, but they are moderate rather than absolute. Provider-enablement
              platforms embed themselves through data connections, governance processes, payer contracts, attribution
              logic, and care-management workflows. Replacing one partner with another is not trivial. Yet a practice
              can remain legally independent throughout the process, which limits hard lock-in. That keeps the door open
              for multi-homing and periodic re-competition, especially if a payer pushes an aligned solution or a
              practice wants broader capabilities.


              Owned-clinic competitors raise the switching bar because they are not just vendors; they are care-delivery
              environments. Moving patients and clinicians out of an Oak Street or ChenMed setting is categorically
              harder than changing an enablement partner. But those models also require more capital and more
              willingness from physicians to give up autonomy. That is where Aledade's moat has to be clearest:
              physician trust, benchmark know-how, distribution of savings back to practices, and an operating model
              strong enough to outperform internal build.


              The public evidence does not prove an impregnable moat. It proves a plausible one. Aledade looks
              advantaged when the buyer values independence, multi-payer contracting, and an external operating partner.
              It looks more vulnerable when the buyer prefers owned delivery, payer integration, or a much broader
              platform. The moat is therefore real but execution-contingent, not an automatic consequence of category
              leadership.
