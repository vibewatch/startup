  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Recommendation: track / research more because company quality exceeds price clarity'
        blocks:
          - type: paragraph
            body: >-
              Aledade has earned a stronger operating verdict than most private healthcare companies at its stage. The
              report now shows real network scale, credible product adoption, fresh customer outcome proof, and a risk
              profile dominated by policy and financing architecture rather than by lack of demand. That is exactly why
              valuation discipline matters. Investors are not deciding whether Aledade is a real company; they are
              deciding whether the current private price leaves enough room for error.


              The visible public markers suggest it does not. Aledade still appears to be framed around a roughly $3.5
              billion valuation in 2026, and the company added a large senior secured facility in 2025 that introduces
              leverage complexity without giving outside investors much covenant or draw transparency. Even generous
              revenue markers imply a valuation multiple that is above the closest public comp and far above the weaker
              public names in value-based care. That does not make Aledade unattractive. It makes the entry price
              demanding.


              The correct recommendation is therefore track / research more, not buy. At today's visible price,
              investors are paying for a premium outcome before they have premium disclosure on cash flow, retention,
              concentration, and debt usage. The company deserves continued diligence and could become very attractive
              with better proof or better pricing, but the current entry point is not obviously mispriced in the
              investor's favor.
            claimRefs:
              - CV001
              - CV002
              - CV012
              - CV017
              - CV018
