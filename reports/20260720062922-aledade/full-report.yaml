      - number: '3.3'
        title: Capability breadth, packaging, and distribution matter more publicly than exact price
        blocks:
          - type: paragraph
            body: >-
              Publicly observable differentiation in this category comes more from packaging and distribution than from
              list price. None of the retained competitor pages publish a clean rate card, so the right comparison is
              contract logic and delivery posture. Privia looks like a broad practice-enablement suite. agilon looks
              like a full-service senior-primary-care transformation model. Pearl looks like the most software-forward
              operating system for value-based-care providers. Waymark packages services through plan partnerships for
              Medicaid members. Oak Street and ChenMed package care as a direct patient service. Evolent packages
              specialty and payer solutions. Humana packages a value-based-care stack around a broader insurance
              ecosystem.


              Because price transparency is low, distribution power and proof points matter more. Public-company status
              helps Privia and agilon with visibility and capital-market credibility. Oak Street benefits from the scale
              umbrella of CVS even though the retained source here is the Oak Street site itself. Humana obviously
              brings payer distribution and network leverage. Evolent brings plan relationships and specialty breadth.
              Aledade still has real scale—3 million patients and 3,000 partners—but buyers comparing alternatives may
              overweight channel reach and breadth rather than raw partner count.


              This is why capability matrices need to separate what is known from what is unknown. Public pages support
              meaningful conclusions about model type, buyer path, and breadth, but they do not support false precision
              about pricing or retention. The practical lesson is that Aledade's sales story must stay legible even when
              buyers cannot or will not benchmark it against transparent price sheets.
