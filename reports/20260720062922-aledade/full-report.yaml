      - number: '2.2'
        title: Sizing lenses show a large but bounded market
        blocks:
          - type: paragraph
            body: >-
              The most useful size anchors are the accountable-care populations that CMS and KFF can actually count. CMS
              estimated 14.3 million Medicare beneficiaries would receive coordinated care through ACOs in 2026, while
              MSSP alone would cover 12.6 million people through 511 ACOs and more than 700,000 participating providers
              and organizations. Fast Facts also show a meaningful composition point: 64% of MSSP ACOs are low-revenue
              ACOs, which implies a market that still includes a wide physician-led long tail rather than only large
              integrated systems. For Aledade, that is a more relevant sizing lens than broad value-based-care rhetoric
              because physician-led fragmentation is what creates demand for an enablement partner.


              A second lens is adjacent Medicare channel size. KFF reports that Medicare Advantage already covers 35.2
              million people, or 55% of eligible Medicare beneficiaries, in 2026. That number is far larger than the ACO
              population and shows why a pure MSSP narrative is incomplete. If accountable primary-care vendors cannot
              extend into payer-sponsored or MA-linked contracts, they cap themselves inside the shrinking
              fee-for-service share of Medicare. Aledade's own press release avoids that trap by explicitly including
              MA, Medicaid, and commercial lines in its current footprint.


              A third lens is company-specific operating scale. Aledade moved from more than 1,500 independent practices
              and 2 million patients in 2023 to more than 3,000 partners and 3 million patients in 2026. That is still
              far smaller than the broader Medicare or MA universe, but it is large enough to show that the company
              already occupies a meaningful slice of the independent-primary-care market. The main unresolved sizing
              question is not whether the market is real; it is how much of the remaining independent-practice pool is
              still unaffiliated and economically attractive to win.
