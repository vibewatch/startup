  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization are tied to provider economics, not simple software seats
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports viewing Aledade as a value-based primary-care operating business rather than
              as a pure software vendor. Its role is to help independent practices and community-based providers succeed
              in shared-savings and other risk-bearing arrangements, and the financial consequences of that model show
              up in the retained sources. In 2023, third-party coverage tied the business to more than 150 value-based
              care contracts, more than 2 million patients, and more than $20 billion in total healthcare spending. The
              same coverage said Aledade generated more than $475 million of revenue in 2022, up more than 50% year over
              year, while serving more than 1 million MSSP patients and nearly 250,000 Medicare Advantage patients.
              Those disclosures imply that monetization was already broader than one government program and already
              scaled well beyond a pilot phase.


              The comparison to Privia is useful because its 2025 10-K makes explicit what Aledade still keeps private.
              Privia says physician-enablement revenue can come from four buckets: fee-for-service patient care and
              administration, per-member-per-month care-management fees, value-based-care revenue including capitated
              revenue and shared savings, and other services. That does not prove Aledade has the same mix, but it does
              provide a public template for how a scaled provider-enablement company can monetize. It also reinforces
              why a simple ARR framing is risky for Aledade: success-based settlements and payer-linked economics do not
              behave like subscription software.


              The practical implication is that Aledade's revenue quality is probably better than a one-time-services
              business but less clean than a classic SaaS model. It appears linked to recurring operating relationships
              and measured outcomes, yet the exact revenue mix, realized take rate, and accounting cadence remain
              undisclosed.
