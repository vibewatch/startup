      - number: '2.3'
        title: Buyers, users, and budget owners differ by channel
        blocks:
          - type: paragraph
            body: >-
              The buyer map is multi-sided because accountable-care platforms are bought through contracts, not just
              through software procurement. In provider-led MSSP arrangements, the ACO or accountable provider entity
              effectively owns the benchmark and shared-savings budget, while physicians, care managers, and practice
              administrators are the daily users. In payer-sponsored physician-enablement deals, the insurer often
              controls the budget and network strategy, while physician practices consume the operating support and
              tools. The CareFirst alliance makes that structure concrete: CareFirst framed the arrangement around lower
              cost trends and better outcomes for its members, while Aledade highlighted onsite practice support,
              analytics, and specialist resources for independent PCPs.


              This buyer split matters because adoption friction differs by segment. Provider-led ACOs care about
              benchmark management, attribution, and downside risk tolerance. Payers care about medical-loss trends,
              network performance, and contract breadth. Safety-net and rural channels care even more about cash flow
              and care-team capacity. CMS' 2026 participation data show that these segments are now real at scale, with
              ACO REACH including hundreds of FQHCs, Rural Health Clinics, and Critical Access Hospitals and Aledade
              itself operating across urban and rural communities.


              The implication for Aledade is that the serviceable market is not one homogeneous PCP bucket. It is a set
              of buyer/user pairs linked by the same value-based-primary-care operating problem but funded through
              different budgets and governed by different renewal criteria. That favors companies with contracting
              breadth and primary-care workflows rather than those that only sell point solutions.
            claimRefs:
