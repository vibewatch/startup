      - number: '8.3'
        title: Scenario work puts current pricing above base case and into low-bull territory
        blocks:
          - type: paragraph
            body: >-
              The least-wrong method here is multiple-based scenario analysis. Aledade does not disclose enough on
              sustained EBITDA, free cash flow, or cap-table mechanics to warrant a false-precision DCF or an equity
              waterfall built from guesses. Revenue-scale markers are good enough to support scenarios, especially when
              combined with public comp multiples and the known financing overhang.


              In the bull case, Aledade proves it is truly a $1.1 billion-plus, profitable, durable, physician-led
              platform and wins the right to trade at a premium to public comps despite being private. In the base case,
              the company is still strong, but investors eventually anchor it closer to public quality names rather than
              to a scarce-asset fantasy. In the bear case, policy or financing stress compresses both the revenue
              outlook and the multiple, and the private price can look far too high in hindsight.


              This framework puts the visible $3.5 billion valuation above the modeled base range and closer to the
              lower edge of a bull case. That is acceptable only if diligence uncovers unusually strong retention,
              limited leverage usage, and cash economics that are better than the market currently sees. Without that
              proof, the scenario work argues for patience rather than urgency.
            claimRefs:
