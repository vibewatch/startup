      - number: '5.4'
        title: Trust, quality, and public-signal gaps remain the main product risks
        blocks:
          - type: paragraph
            body: >-
              The main product risk is not that Aledade lacks a visible workflow story; it is that the public pack still
              leaves important trust and reliability questions unanswered. The retained sources do not surface formal
              security certifications, uptime reporting, or a public status surface for Aledade's core product modules.
              They also do not provide independent model-validation metrics for AI-generated summaries or suspected
              diagnoses. That means the product looks operationally promising but still partly marketing-mediated on the
              most technical trust questions.


              There is also a real dependency risk. Aledade's overlay model appears elegant precisely because it works
              inside existing EHRs, but that also means product durability depends on continued compatibility with those
              EHR environments, browser contexts, and upstream data feeds. The company itself highlights that activation
              is measured among compatible EHRs, which implies not every environment is equally ready. If overlays break
              or data feeds degrade, the user experience could deteriorate quickly because clinicians are counting on
              in-visit reliability.


              Finally, public developer signal is thin. A GitHub search does not reveal an obvious official open-source
              product surface, so outside observers must use hiring, partner integrations, and practitioner case studies
              as the best available technical proxies. That is workable for diligence, but it is weaker than having
              public docs, SDKs, or active developer communities.
