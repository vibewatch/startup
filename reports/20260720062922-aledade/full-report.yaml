  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments are multi-sided but anchor on independent primary care
        blocks:
          - type: paragraph
            body: >-
              Aledade's customer picture is more complex than a single buyer count. Health plans, health systems,
              community health centers, federally qualified health centers, hospitals, and independent practices all
              appear in the retained sources, but they do not play the same role. The clearest day-to-day users are
              primary care practices and their clinicians, while health plans and health systems often serve as channel
              sponsors, contracting counterparties, or strategic expansion partners. That distinction matters because
              Aledade's adoption proof usually lives at the practice level even when a larger institution shapes the
              commercial relationship.


              Scale evidence is strong. Aledade said in 2026 that it serves more than 3,000 primary care partners caring
              for more than 3 million patients across 46 states and the District of Columbia, after adding 700 new
              organizations for the 2026 performance year. The older Surescripts case study and 2023 funding coverage
              help show the trajectory behind that headline: 550 practices and 840,000 patients in one earlier proof
              point, more than 1,500 practices and more than 2 million patients by 2023, and then more than 3,000
              partners by 2026.


              That progression supports a real adoption story rather than a one-time marketing burst. It also reinforces
              that Aledade's strategic center of gravity remains independent primary care, even as its proof surfaces
              increasingly include health systems, payer channels, and community-provider organizations.
            claimRefs:
