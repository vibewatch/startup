        title: Public traction looks real, and public comps show what maturity could look like
        blocks:
          - type: paragraph
            body: >-
              Aledade's public traction markers are strong enough to take seriously. Fierce reported that the company
              reached $1 billion of revenue and was profitable in 2025, which is directionally consistent with the much
              earlier official disclosure of more than $475 million of 2022 revenue. Even if the later number is not
              backed by an audited public filing, the progression suggests real scaling rather than vanity activity.
              Public sources also show that management used the 2023 Series F not only to extend runway but to
              accelerate network growth, strategic health-plan alliances, technology investment, and acquisitions. That
              capital-allocation posture matters because it implies the company saw capability breadth and payer
              distribution as drivers of future monetization.


              Privia's 10-K provides a credible benchmark for what a mature physician-enablement platform can look like
              in public markets. In 2025 it reported $2.12 billion of revenue, $34.2 million of operating income, $22.9
              million of net income, $125.5 million of adjusted EBITDA, and $479.7 million of cash with no debt
              outstanding. Privia also explicitly describes its model as low invested capital with attractive margin
              opportunity. Aledade may not be directly comparable—its model appears more savings-linked and now more
              debt-backed—but the filing proves that the category can produce meaningful scale, profitability, and
              liquidity when execution works.


              The benchmark cuts both ways. Aledade benefits from the positive read-through that physician-enablement
              can be profitable. But it also looks less transparent and potentially more financing-intensive than the
              public benchmark because investors still lack audited Aledade statements, disclosed margins, and clear
              debt context.
