            body: >-
              Founder-market fit is one of the strongest parts of Aledade's company-overview evidence. Farzad Mostashari
              previously served as National Coordinator for Health IT and was deeply involved in HITECH and Meaningful
              Use, which matters because Aledade sells workflow change, data use, and payment-model execution into
              primary care rather than consumer software. Mat Kendall brings complementary operator experience from
              community health centers and federal primary-care enablement programs. More recent appointments show
              Aledade broadening the executive bench around commercialization, finance, product, analytics, and AI
              infrastructure. In 2025 and 2026 the company added Shawn Guertin and Joneigh Khaldun to the board, Oraida
