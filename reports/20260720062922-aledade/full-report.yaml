      - number: '4.4'
        title: Capital adequacy is a strength and a risk at the same time
        blocks:
          - type: paragraph
            body: >-
              Aledade plainly has capital access. The company raised $260 million of growth equity in 2023 and then
              added a $500 million expandable credit facility in 2025. That is not the pattern of a company shut out of
              capital markets. It suggests both investors and lenders believe the platform can continue scaling. Yet the
              form of financing matters. Growth equity supporting network expansion, strategic alliances, and M&A is
              normal for a high-growth healthcare platform. Large senior secured working-capital debt introduces a
              different kind of dependency: the business now has leverage and likely covenant or borrowing-base
              discipline even if those details are not public.


              That matters because the same public evidence that makes the debt understandable also makes it a diligence
              priority. If the facility is genuinely a flexible bridge for a high-performing, cash-generative model,
              then leverage may be manageable. If instead the company needs debt because revenue timing and service
              intensity structurally outpace cash collection, then the business is more fragile than revenue growth
              alone suggests. The current public pack cannot resolve that. It shows why the debt exists and what it
              supports, but not whether it is conservatively sized.


              The best current stance is therefore balanced. Aledade looks financially supported, not starved. But it
              also looks like a business whose scale still requires substantial financing coordination—first equity,
              then working-capital debt—to keep the machine running smoothly.
