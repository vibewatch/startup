    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Stage, and Operating Scale
        blocks:
          - type: paragraph
            body: >-
              Aledade should be treated as a physician-led value-based primary care enablement platform rather than as a
              payer, a clinic roll-up, or a health system owner. Its official site describes a model built to help
              independent practices and community health centers stay autonomous while using technology, analytics, care
              management support, and payer contracting to earn more of their economics through value-based care. That
              identity is reinforced by 2026 scale disclosures showing more than 3,000 primary care partners, more than
              3 million patients, and operations spanning 46 states plus the District of Columbia. Public materials also
              show a consistent mission through time: Aledade was founded in 2014, remains headquartered in Bethesda,
              and presents itself as a public benefit corporation that measures performance through both patient
              outcomes and practice sustainability. The reusable conclusion for later chapters is that Aledade is a
              late-stage, national, independent-primary-care infrastructure company with meaningful market share inside
              MSSP and expanding relevance across non-Medicare lines.
