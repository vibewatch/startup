  productSummary: >-
    Aledade sells a physician-led accountable-care operating system: contract participation, benchmark and quality
    analytics, in-workflow care-gap and clinical-insight tools, care-management support, and payer or health-system
    enablement for value-based-care execution.
  customerFocus: >-
    Independent primary care practices are the anchor users and economic partners, with community health centers, FQHCs,
    health systems, hospitals, and health plans acting as additional customer segments or channel partners.
  businessModel: >-
    Aledade primarily monetizes by helping practices and partner organizations earn shared savings, quality bonuses, and
    value-based-care economics, while providing technology and operating support that embeds the company into day-to-day
    clinical workflows.
