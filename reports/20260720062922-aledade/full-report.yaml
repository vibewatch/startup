  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Top risk is policy-and-financing interdependence, not product absence
        blocks:
          - type: paragraph
            body: >-
              Aledade's risk profile is unusual because its biggest threats do not start with whether the product works.
              Public evidence from the product and customer chapters suggests the operating model does work in
              production. The higher-order risk is that Aledade sits at the intersection of CMS rules, shared-savings
              math, practice economics, and a now-material debt facility. If any one of those layers weakens, the impact
              can cascade quickly into customer value, partner payouts, and financing comfort.


              That is why the core risk ranking starts with policy-and-financing interdependence. CMS is still actively
              revising MSSP rules, physician-payment methodology, quality scoring, and mandatory specialty/episode
              models. Meanwhile, Aledade has explicitly financed the timing gap between Medicare receipts and partner
              distributions with a large senior secured facility. Those two facts are individually manageable. Together,
              they create a transmission path from regulatory change to liquidity stress that investors should treat as
              the central risk architecture.


              The next tier of risk sits around partner dependence, security/reliability opacity, customer concentration
              opacity, and national-scale execution. None of these by itself looks thesis-breaking today, but they
              matter because they can amplify a policy shock rather than merely coexist with it. The legal tail from the
              whistleblower case is now smaller than it was in 2024, yet it still reinforces that Aledade operates in a
              compliance-sensitive corner of Medicare.
            claimRefs:
              - CR001
              - CR002
              - CR016
              - CR018
              - CR037
              - CR039
