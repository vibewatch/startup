companyProfile:
  summary: >-
    Aledade is a Bethesda-based, founder-led value-based-care company founded in 2014 by Farzad Mostashari and Mat
    Kendall. The company organizes independent primary care practices, community health centers, and related provider
    groups into accountable-care structures, supplies workflow, analytics, and AI-assisted tools such as Aledade Assist,
    and shares in economic upside from better quality and lower cost performance. By 2026, Aledade said it served more
    than 3,000 primary care partners caring for more than 3 million patients across 46 states and the District of
    Columbia. Public evidence shows real scale and operating proof, but the business remains private and under-disclosed
    on audited cash economics, debt usage, concentration, and retention.
  foundedDate: '2014-01-01'
  founders:
    - name: Farzad Mostashari
      role: Co-Founder & CEO
      background: >-
