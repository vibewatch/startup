        title: Milestones, Third-Party Validation, and Adverse Signals
        blocks:
          - type: paragraph
            body: >-
              Aledade's milestone record supports a credible market-leadership narrative, but it also shows the normal
              diligence caveats of a scaled private healthcare company. From 2023 through 2026 the company moved from a
              1,500-practice network with 2 million patients to more than 3,000 partners and more than 3 million
