  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Aledade should not be sized against all value-based care or all U.S. healthcare spending. The defensible
              boundary is narrower: value-based primary care operations for independent and community-based providers
              that need analytics, care-management workflows, payer contracting, and benchmark/risk execution. CMS'
              definitions of accountable care and risk-based arrangements matter here because they show the economic
              unit is not a software seat or an insurance premium; it is an accountable provider organization trying to
              improve quality while managing total cost of care against a benchmark. That is why Aledade looks more like
              an outsourced operating layer for physician-led accountable care than like a payer, clinic owner, or
              generic practice-management vendor.


              The included opportunity spans MSSP participation, adjacent Innovation Center accountable-care models, and
              payer-sponsored physician-enablement contracts in Medicare Advantage, Medicaid, and commercial
              populations. Aledade's own 2026 network release is explicit that the company already operates across all
              four rails. The obvious exclusions are also important. The market does not include all Medicare Advantage
              premium revenue, all capitated health-system economics, or specialty models that do not require an
              independent-primary-care enabler. That boundary sharply reduces the temptation to cite an undifferentiated
              multihundred-billion-dollar TAM without showing where Aledade can actually monetize.


              The main substitutes are the status quo of fragmented fee-for-service primary care, provider groups
              building ACO capability themselves, health-system-owned population-health teams, and payer-owned
              accountable-care platforms. Aledade only creates durable value if small and midsize physician groups need
              an external partner badly enough to share savings, workflow, and governance with it. The combination of
              CMS accountable-care expansion and continued fragmentation in independent primary care suggests that need
              remains real, but the market definition has to start from that operating problem rather than from broad
              healthcare spend.
            claimRefs:
