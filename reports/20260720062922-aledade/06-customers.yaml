- id: retention-satisfaction-and-expansion
  title: Retention proxies are positive, but true durability still is not public
  body: 'Public retention evidence is directionally good but incomplete. Aledade''s 2026 Best in KLAS release said interviewed clinicians showed a 100% re-partner rate, which is a powerful signal if representative, but it is still a sample-based satisfaction proxy rather than a full-company retention metric. Thought Industries adds another useful adoption proxy: on-demand learning cut time to first use of Aledade''s app by 20 days, 80% of badge earners reported high confidence, and 85% recommended the badges to colleagues. Those are encouraging customer-success markers, especially for a scaled network that had to replace in-person training with a more repeatable model.


    Expansion proof is easier to see than retention proof. Aledade''s growth from 550 practices to 1,500-plus and then to 3,000-plus partners shows land-and-expand in practice. The California case study shows geographic deepening through CAledade, while health-plan and health-system pages suggest Aledade can expand by segment and channel without changing its physician-led core positioning. That gives the customer base real breadth.


    What remains missing is the hard durability layer: NRR, GRR, churn, contract lengths, renewal cohorts, and revenue concentration by payer or practice. Until those appear, the best conclusion is that Aledade has strong adoption and satisfaction proxies but not yet public proof of customer economics over time.'
