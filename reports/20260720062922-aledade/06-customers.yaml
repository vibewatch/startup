  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, churn, renewal rates, contract length, and cohort retention by segment.
    whyItMatters: Public customer stories can validate adoption, but they cannot prove durability without cohort or renewal data.
    diligencePath: Request customer-cohort and renewal dashboards from revenue operations or finance.
    relatedQuestionRefs:
    - QU020
    - QU024
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Top-customer, top-payer, and top-channel concentration metrics.
    whyItMatters: Customer diversification and bargaining power cannot be judged from case studies alone.
    diligencePath: Obtain concentration schedules by payer, practice, health system, and revenue contribution.
    relatedQuestionRefs:
    - QU021
    - QU024
  - type: missing-source
    severity: minor
    topic: TU003 named-customer-coverage
    missingEvidence: Independent evidence on failed pilots, churned customers, or major customer complaints.
    whyItMatters: The current public proof set is dominated by success stories selected by Aledade or its partners.
    diligencePath: Search procurement records, customer review sites, and reference calls for negative deployment evidence.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: segment-economics
    missingEvidence: Revenue and margin by customer segment (independent practices, health systems, health plans, CHCs/FQHCs).
    whyItMatters: Strategic value by segment is still mostly inferred from workflow narratives and case-study visibility.
    diligencePath: Request segment P&L or contribution-margin views from management.
    relatedQuestionRefs:
    - QU002
    - QU018
  - type: missing-source
    severity: minor
    topic: contract-durations
    missingEvidence: Public contract-length or renewal-term evidence for payer and provider relationships.
    whyItMatters: Without duration terms, the durability of customer relationships stays qualitative.
    diligencePath: Ask for sample contract terms or anonymized customer-tenure distributions.
    relatedQuestionRefs:
    - QU024
acknowledgedWarnings:
- dimension: figureType
  reason: A true retention cohort figure would require time-bucket retention percentages such as GRR or NRR by year or quarter, and the retained public evidence only offers one-time satisfaction proxies rather than longitudinal retention series.
