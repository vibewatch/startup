- id: partner-dependence-and-adverse-evidence
  title: Partner dependence and success-story bias are the main customer risks
  body: 'The clearest customer risk is that Aledade''s public proof set is heavily partner-mediated. athenahealth, Surescripts, Manifest MedEx, SVB, Thought Industries, and Aledade itself all publish useful customer evidence, but those are still organizations with reasons to highlight success. Public evidence on churn, failed deployments, or top-customer tension is much thinner. That does not invalidate the good proofs; it just means the retained pack shows much more about how Aledade can succeed than about when customers leave or resist adoption.


    A second risk is channel and integration dependence. Many of Aledade''s strongest proofs rely on external data or ecosystem partners: pharmacy history from Surescripts, ADTs from Manifest MedEx, EHR workflow from athenahealth, and payer-facing programs for MA and MSSP. That dependency is probably normal for the business model, but it does mean that customer value partly rides on partner continuity and data quality. If those rails weaken, customer satisfaction could weaken with them.


    Finally, broad trust and compliance scrutiny in value-based care can still affect customer procurement even when a specific lawsuit or allegation does not stick. Aledade''s coding case was dismissed on the major counts, but prospective customers still live in a sector where compliance perception matters. The adverse customer question is therefore not that Aledade lacks happy users; it is whether the company can maintain customer momentum while the public record remains selective and partner-mediated.'
  claimRefs:
  - CU031
  - CU034
  - CU035
  - CU036
  - CU037
  tableRefs: []
  figureRefs: []
- id: customer-verdict
  title: 'Customer verdict: strong adoption and proof, incomplete durability disclosure'
  body: 'The customer verdict is positive. Aledade shows a large and growing installed base, increasingly fresh named deployments, and multiple examples where specific workflows appear tied to better outcomes or better economics for practices. That is much stronger than a customer chapter built only from homepage logos. The company also appears able to expand across segments—independent practices, community providers, health systems, and health plans—without abandoning its physician-led identity.


    At the same time, investors should not overread what the public pack can prove. The strongest evidence still comes from success stories and partner writeups; customer concentration, true contract durability, churn, and cohort renewal remain private. That means the adoption story is convincing, but the durability story is only partially proven.


    For diligence purposes, Aledade has passed the threshold of real customer proof. It has not yet passed the threshold of fully transparent customer economics or retention disclosure. That distinction should shape how much confidence investors place on the growth narrative versus the stickiness narrative.'
