    - Named system count undisclosed
  - - Health plans
    - 'Buyer/payer: insurer; users: practice and support teams'
    - Support independent PCP network performance and viability
    - strategically important but opaque
    - Can accelerate payer-channel expansion
    - Plan-level revenue concentration unknown
  - - Medicare Advantage / payer programs
    - Payer-led segment with practice-level users
