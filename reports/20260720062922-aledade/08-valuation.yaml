- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Debt stress surfaces
    - Facility amendment, covenant tightening, or heavy draw disclosure
    - Undermines margin-of-safety and magnifies policy risk
    - Move from track to avoid unless price resets
  - - CMS shifts hurt physician economics
    - Meaningful worsening in MSSP / payment assumptions for low-revenue ACOs
    - Base-case revenue and renewal assumptions weaken
    - Cut valuation range and raise risk rating
  - - Retention / concentration disappoints
    - Large payer or practice loss; weak renewal cohorts
    - Premium to public comps no longer justified
    - Downgrade thesis durability
  - - Cash-flow quality disappoints
    - Revenue growth not translating into partner-normalized cash generation
    - Multiple premium becomes untenable
    - Re-rate toward weaker public comp set
  - - Down-round or weak secondary clears appear
    - Price discovery moves below 2023/2026 visible marker
    - Confirms current private ask was too high
    - Reset entry discipline around new clears
  notes: The triggers are chosen because they change both valuation and confidence, not because they are merely headline negative.
