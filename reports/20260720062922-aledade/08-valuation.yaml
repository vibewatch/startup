- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Cap table and preferences
    - Liquidation stack, option pool, seniority, and preference waterfalls
    - Headline valuation can mislead on new-money economics
    - Finance team / counsel
  - - Debt agreement
    - Draw amount, pricing, covenants, collateral, amendment rights
    - Debt may change equity attractiveness materially
    - CFO / lender diligence
  - - Audited revenue quality
    - Bridge from ARR and shared savings to GAAP revenue and cash
    - Multiple-based view needs a real economic anchor
    - Finance / audit
  - - Retention and concentration
    - NRR, GRR, churn, top-payer and top-practice exposure
    - Premium multiple only works if durability is strong
    - Revenue ops / customer success
  - - Scenario support
    - Management plan for 2026-2028 growth, margin, and capital usage
    - Needed to test bull-case plausibility
    - CEO / CFO
  - - Exit readiness
    - IPO readiness, buyer landscape, governance, and reporting cadence
    - Determines whether upside can be realized on a reasonable timeline
    - CEO / board
  notes: These asks are narrow because the report already supports company quality; what remains is mostly price-and-structure diligence.
