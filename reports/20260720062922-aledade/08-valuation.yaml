    - Closest public operating analogue
    - Public market, profitable, and more transparent than Aledade
  - - agilon health
    - Public VBC comp
    - ~$2.17B market cap; ~$1.97B EV; ~0.34x EV/Sales
    - Shows downside of complexity and market skepticism
    - More full-risk and more distressed than Aledade
  - - Evolent Health
    - Public VBC / services comp
    - ~$654M market cap; ~$1.50B EV; ~0.79x EV/Sales
    - Shows how low the market can price complex healthcare services platforms
    - Business mix differs materially from Aledade
  - - Oak Street Health
    - Strategic M&A comp
    - Acquired by CVS for ~$10.6B EV in 2023
    - Shows strategic appetite for scaled primary-care assets
    - Owned-clinic model and control premium limit comparability
  - - Aledade preview markers
    - Private secondary / preview pages
    - ~$3.5B visible marker in 2026
    - Useful for anchoring the current ask
    - Preview-style sources are thinner than real transaction tape
  notes: 'The set is intentionally mixed: closest public comp, weaker public comps, strategic comp, and the current private marker investors are implicitly being asked to accept.'
