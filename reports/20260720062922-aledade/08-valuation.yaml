  - - 'Anti-thesis: price already discounts best-case execution'
    - Visible private valuation sits above public comp logic and near low-bull territory
    - A lower entry price or better disclosure would weaken this objection
  - - 'Anti-thesis: leverage and opacity reduce margin of safety'
    - Debt draw, covenants, preferences, and concentration remain private
    - Full credit docs and cap table could materially improve or worsen the picture
  notes: The anti-thesis is about entry discipline, not about denial that Aledade is a real and potentially valuable company.
