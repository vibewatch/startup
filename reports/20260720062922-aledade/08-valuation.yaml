- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Revenue > $1.1B, profitability holds, limited covenant stress, renewals strong, public comps rerate
    - ~4.0x-4.5x revenue; roughly $4.4B-$5.0B before debt/dilution adjustments
    - Execution or policy miss breaks premium
    - Possible but needs premium evidence
  - - Base
    - Revenue around $1.0B, growth continues, debt manageable, retention good but not extraordinary
    - ~2.5x-3.0x revenue; roughly $2.5B-$3.0B before debt/dilution adjustments
    - Current price still too full if disclosure stays limited
    - Most decision-useful default case
  - - Bear
    - Revenue $0.85B-$0.9B, CMS/payout pressure, debt concerns, customer durability less robust
    - ~1.5x-2.0x revenue; roughly $1.3B-$1.8B before debt/dilution adjustments
    - Compression plus leverage can hurt quickly
    - Not base, but plausible if two risks coincide
  notes: Ranges are enterprise-style heuristics and deliberately avoid pretending to know net debt, liquidation preference, or exact share count.
