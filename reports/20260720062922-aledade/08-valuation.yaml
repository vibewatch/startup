- id: public-comps-and-financing-context
  title: Public comps and financing context argue for caution on paying a premium
  body: 'The comp set is not perfect, but it is directional enough to matter. Privia is the closest operating analogue because it also centers on physician-partner enablement rather than on full clinic ownership or full-risk aggregation. Stock Analysis puts Privia at about 1.33x EV/Sales with roughly $2.98 billion of enterprise value and $2.25 billion of revenue. agilon and Evolent trade at much lower EV/Sales multiples, reflecting greater distress, complexity, or market skepticism. Oak Street''s $10.6 billion strategic sale shows that scaled primary-care platforms can attract large strategic premiums, but Oak Street owned clinics and sold with control value that Aledade does not automatically inherit.


    The key lesson is that public and strategic comps do not support an easy premium narrative. Aledade may deserve a premium to agilon and Evolent because its public evidence suggests cleaner economics and better physician alignment. But Privia already captures much of that premium-quality story in the public market, and it still trades far below Aledade''s implied private revenue multiple.


    Debt makes the comp gap harder to ignore. Aledade now has a large working-capital facility backing the business model, which means outside investors are underwriting not only a growth story but also a financing architecture whose precise draw and covenant profile remain private. That is a major reason to resist stretching the multiple just because the company looks like a category leader.'
