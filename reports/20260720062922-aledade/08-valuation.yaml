  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preferences
    missingEvidence: Current cap table, liquidation preferences, option dilution, and seniority structure.
    whyItMatters: Headline valuation can materially overstate entry attractiveness if preferences or dilution are heavy.
    diligencePath: Request full cap table and liquidation waterfall model.
    relatedQuestionRefs:
    - QV024
    - QV029
    - QV032
    - QV035
  - type: private-evidence-only
    severity: material
    topic: debt-draw-and-covenants
    missingEvidence: Current draw, cost, borrowing base, covenant thresholds, and amendment history on the Ares facility.
    whyItMatters: Debt can change an apparently fair enterprise valuation into a poor equity entry.
    diligencePath: Obtain full credit agreement, lender reporting, and draw history.
    relatedQuestionRefs:
    - QV005
    - QV024
    - QV031
  - type: private-evidence-only
    severity: material
    topic: audited-economics
    missingEvidence: Audited revenue mix, EBITDA, cash flow, and working-capital profile by year.
    whyItMatters: Aledade currently must be valued on coarse revenue markers rather than hard cash economics.
    diligencePath: Request audited financials and management bridge between ARR, GAAP revenue, and cash generation.
    relatedQuestionRefs:
    - QV004
    - QV034
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
