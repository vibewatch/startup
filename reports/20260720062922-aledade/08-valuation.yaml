company:
  name: Aledade
chapter:
  number: 8
  title: Valuation
  summary: 'Aledade looks like one of the stronger independent value-based-care enablement assets still private, but the visible 2026 price support remains only moderately attractive. Public comps—especially Privia—do not obviously justify paying a 3.5x-plus implied revenue multiple for a private company that now carries meaningful working-capital debt and still withholds key data on cash flow, leverage usage, cap-table seniority, retention, and concentration. The right call today is track / research more: attractive company, demanding price, clear diligence path.'
sections:
- id: recommendation-and-entry-discipline
  title: 'Recommendation: track / research more because company quality exceeds price clarity'
  body: 'Aledade has earned a stronger operating verdict than most private healthcare companies at its stage. The report now shows real network scale, credible product adoption, fresh customer outcome proof, and a risk profile dominated by policy and financing architecture rather than by lack of demand. That is exactly why valuation discipline matters. Investors are not deciding whether Aledade is a real company; they are deciding whether the current private price leaves enough room for error.


    The visible public markers suggest it does not. Aledade still appears to be framed around a roughly $3.5 billion valuation in 2026, and the company added a large senior secured facility in 2025 that introduces leverage complexity without giving outside investors much covenant or draw transparency. Even generous revenue markers imply a valuation multiple that is above the closest public comp and far above the weaker public names in value-based care. That does not make Aledade unattractive. It makes the entry price demanding.


    The correct recommendation is therefore track / research more, not buy. At today''s visible price, investors are paying for a premium outcome before they have premium disclosure on cash flow, retention, concentration, and debt usage. The company deserves continued diligence and could become very attractive with better proof or better pricing, but the current entry point is not obviously mispriced in the investor''s favor.'
