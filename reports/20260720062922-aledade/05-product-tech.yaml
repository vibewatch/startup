chapter:
  number: 5
  title: Product & Technology
  summary: Aledade's product now presents as a mature, workflow-embedded value-based-care operating system rather than a generic analytics promise. The strongest public proof comes from Aledade Assist, which Aledade says is live at more than 1,000 practices, activated at 85% of compatible EHR sites, and uses AI-enabled overlays to place patient-specific insights directly inside clinical workflow. The remaining diligence gaps are not about whether the product exists, but about external proof on security, uptime, model performance, and the limited public developer surface.
sections:
- id: product-definition-and-module-map
  title: Product definition and module map
  body: 'Aledade''s product should be understood as a technology-plus-services operating layer for value-based primary care, not as a single app. The clearest public module map now includes the Aledade App, Aledade Assist, patient engagement tools, prioritized patient worklists, quality reporting and management, expert coaching, and related support for payer and health-system workflows. The health-system and health-plan pages make this explicit by describing both software-like elements—actionable insights, data aggregation, point-of-care tools—and operational elements such as dedicated specialists, guidance, and workflow support.


    The product definition matters because it explains why Aledade can look different depending on the customer. For health plans, the offer includes data integration, workflow improvement, and support that helps practices stay viable and independent. For health systems, Aledade emphasizes a flexible ACO model, the ability to handle MSSP complexity, and point-of-care tools that fit inside existing clinical operations. For practices, the combination is more concrete: Assist and the App surface patient-specific insights, care gaps, and prioritized outreach opportunities directly where clinicians work.


    The result is a portfolio that looks more like an operating system for value-based primary care than like a narrow analytics widget. That breadth is a strength for workflow adoption, but it also means diligence has to separate mature deployed modules from broader service promises.'
