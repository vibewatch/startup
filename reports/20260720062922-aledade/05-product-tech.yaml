  evidenceGaps:
  - type: missing-source
    severity: material
    topic: security-controls
    missingEvidence: Public security-certification list, uptime history, and formal status documentation for Aledade's core product surfaces.
    whyItMatters: Trust and reliability are explicit parts of the chapter brief, but the retained pack does not show formal external proof.
    diligencePath: Request SOC 2 / HITRUST status, uptime reporting, and incident history from the security or product team.
    relatedQuestionRefs:
    - QE023
  - type: missing-source
    severity: material
    topic: api-and-extensibility
    missingEvidence: Public API docs, developer portal detail, or formal integration reference beyond case-study and marketplace evidence.
    whyItMatters: The company may be highly integrable in practice, but external developers cannot verify surface area from the retained public pack.
    diligencePath: Ask for API documentation, integration guides, or implementation references under NDA.
    relatedQuestionRefs:
    - QE021
    - QE024
  - type: private-evidence-only
    severity: material
    topic: model-performance
    missingEvidence: Independent model-performance data for AI summarization, suspected diagnoses, and care-gap detection.
    whyItMatters: Clinical trust depends on precision and false-positive behavior, not just on workflow fit.
    diligencePath: Review model validation studies, QA dashboards, and clinician override data.
    relatedQuestionRefs:
    - QE007
    - QE023
  - type: missing-source
    severity: minor
    topic: ehr-coverage
    missingEvidence: A public list of all supported EHRs and any feature parity differences across them.
    whyItMatters: Overlay breadth and compatibility are central to deployment durability.
    diligencePath: Request a current compatibility matrix and rollout roadmap.
    relatedQuestionRefs:
    - QE008
    - QE019
  - type: private-evidence-only
    severity: material
    topic: reliability
    missingEvidence: Installation-failure, uptime, and support-ticket metrics for Assist and related workflow tooling.
    whyItMatters: Public case studies can describe ease-of-use but not fleetwide operational reliability.
    diligencePath: Request internal reliability dashboards and implementation metrics.
    relatedQuestionRefs:
    - QE024
