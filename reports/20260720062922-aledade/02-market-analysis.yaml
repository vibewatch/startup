  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: line-of-business-mix
    missingEvidence: A payer-line breakout of Aledade's current attributed patients across MSSP, MA, Medicaid, and commercial programs.
    whyItMatters: The mix determines how exposed the company is to Medicare fee-for-service versus managed-care economics and renewal cycles.
    diligencePath: Request current patient and revenue mix by line of business from management or lenders' materials.
    relatedQuestionRefs:
    - QM021
  - type: missing-source
    severity: material
    topic: unaffiliated-practice-base
    missingEvidence: A defensible count of independent primary care groups still outside Aledade or similar platforms in the states where it operates.
    whyItMatters: Without the remaining independent-practice pool, SOM expansion claims are difficult to size.
    diligencePath: Combine CMS participant files, NPPES taxonomy filtering, and state primary-care association rosters to estimate remaining unaffiliated supply.
    relatedQuestionRefs:
    - QM022
  - type: missing-source
    severity: minor
    topic: ma-group-channel
    missingEvidence: Aledade-specific evidence on whether MA group-plan channels meaningfully contribute attributed lives or commercial-like expansion.
    whyItMatters: The KFF group-plan statistic shows channel size but not Aledade's actual capture of that segment.
    diligencePath: Ask management for employer-sponsored retiree or plan-sponsor case studies and attributable lives by channel.
    relatedQuestionRefs:
    - QM023
  - type: enumeration-incomplete
    severity: material
    topic: state-concentration
    missingEvidence: State-by-state Aledade share across MSSP and non-Medicare contracts, including concentration in any one plan or region.
    whyItMatters: Geographic concentration changes network resilience, competitive intensity, and regulatory exposure.
    diligencePath: Request state-level attributed lives and practice counts, then compare them against CMS ACO and payer market-share files.
    relatedQuestionRefs:
    - QM024
  - type: private-evidence-only
    severity: material
    topic: margin-structure
    missingEvidence: Gross-margin, care-management cost, and working-capital data for the ACO enablement model.
    whyItMatters: Market attractiveness depends on whether shared-savings timing and staffing intensity create structurally lower margins than software investors assume.
    diligencePath: Review lender materials, board decks, or audited operating metrics that show contribution margin by contract type.
    relatedQuestionRefs:
    - QM025
