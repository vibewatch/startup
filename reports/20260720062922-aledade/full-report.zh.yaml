      - number: '6.4'
        title: 合作伙伴依赖和成功案例偏差，是主要客户风险
        blocks:
          - type: paragraph
            body: >-
              最清晰的客户风险在于，Aledade 的公开证据集高度依赖合作伙伴中介。athenahealth、Surescripts、Manifest MedEx、SVB、Thought Industries 和
              Aledade 自身都发布了有用客户证据，但这些组织都有动力突出成功。关于流失、失败部署或头部客户紧张关系的公开证据薄得多。这并不推翻正面证据，只是说明现有证据包更多展示 Aledade
              如何成功，而不是客户何时离开或抗拒采纳。


              第二个风险是渠道和集成依赖。Aledade 许多最强证据都依赖外部数据或生态伙伴：Surescripts 的药房历史、Manifest MedEx 的 ADT、athenahealth 的 EHR
              工作流，以及面向 MA 和 MSSP 的付款方项目。这种依赖对商业模式来说可能正常，但也意味着客户价值部分压在伙伴连续性和数据质量上。如果这些轨道变弱，客户满意度也可能随之走弱。


              最后，即便某个具体诉讼或指控没有成立，价值医疗领域更广泛的信任和合规审查仍会影响客户采购。Aledade 的编码案主要诉项已被驳回，但潜在客户所处行业仍然高度看重合规感知。因此，反向客户问题不是 Aledade
              没有满意用户，而是公司能否在公开记录仍有选择性且由合作伙伴中介的情况下，维持客户势头。
            claimRefs:
              - CU031
              - CU034
              - CU035
              - CU036
              - CU037
      - number: '6.5'
        title: 客户结论：采纳和证据强，耐久性披露不足
        blocks:
          - type: paragraph
            body: >-
              客户结论偏正面。Aledade
              展示了庞大且增长中的部署基础，具名部署越来越新，也有多个例子显示具体工作流似乎连到了更好的结果或更好的诊所经济性。这远强于只靠官网标志搭出来的客户章节。公司看起来也能跨细分扩张——独立诊所、社区提供方、医疗系统和健康计划——同时不放弃医生主导身份。


              但投资者不应高估公开材料能证明的东西。最强证据仍来自成功案例和合作伙伴稿件；客户集中度、真实合同耐久性、流失和队列续约仍未公开。也就是说，采纳故事令人信服，但耐久性故事只被部分证明。


              就尽调而言，Aledade 已跨过真实客户证据门槛。它还没有跨过客户经济性或留存披露完全透明的门槛。这个区分应当决定投资者在增长叙事和粘性叙事之间分配多少信心。
            claimRefs:
