              Aledade 的里程碑记录支撑了可信的市场领导叙事，但也带有成规模私营医疗公司的常见尽调保留。2023 至 2026 年，公司从 1,500 家诊所、200 万患者的网络，扩至超过 3,000 个合作伙伴和
