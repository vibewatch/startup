  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块图谱
        blocks:
          - type: paragraph
            body: >-
              Aledade 的产品不是单一应用，而是一层面向价值基层医疗的“技术 + 服务”运营层。最清晰的公开模块图谱现在包括 Aledade App、Aledade
              Assist、患者互动工具、优先级患者工作清单、质量报告和管理、专家辅导，以及面向支付方和医疗系统工作流的相关支持。医疗系统和健康计划页面讲得很明白：产品既包含类似软件的元素——可行动洞察、数据聚合、诊疗现场
              工具——也包含专职专家、指导和工作流支持等运营元素。


              产品定义很重要，因为它解释了为什么 Aledade 在不同客户面前看起来不一样。对健康计划，方案包括数据整合、工作流改善，以及帮助诊所保持可行和独立的支持。对医疗系统，Aledade 强调灵活 ACO 模型、处理
              MSSP 复杂性的能力，以及能嵌入既有临床运营的诊疗现场工具。对诊所，组合更具体：Assist 和 App 在临床医生工作的地方直接浮出患者级洞察、照护缺口和优先触达机会。


              结果是，这个组合更像价值基层医疗操作系统，而不是狭窄的数据分析小组件。广度有利于工作流采用，但也意味着尽调必须把成熟落地模块和更宽的服务承诺拆开看。
