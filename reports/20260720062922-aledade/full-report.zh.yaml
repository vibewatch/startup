      - number: '3.2'
        title: 诊所所有者和支付方既有玩家把竞争场拉到直接同行之外
        blocks:
          - type: paragraph
            body: >-
              更大的竞争威胁来自用不同结构完成责任基层医疗任务的公司。Oak Street Health 和 ChenMed 都通过运营照护交付资产，而不是赋能外部诊所，来争夺老年人基层医疗经济性。Oak Street
              通过自有诊所销售直接 Medicare 基层和专科照护，ChenMed 则围绕个人医生关系和 24/7 可及性，销售高触达预防式 VIP 照护。这些模式不能与 Aledade
              即插即用，但当买方想要更紧的临床控制，或患者愿意迁移到新的照护交付环境时，它们可能更有吸引力。


              支付方和相邻服务既有玩家进一步扩大了战场。Evolent 不是 Aledade 的一对一替代品，但它面向健康计划的能力、专科照护广度和 4,000 万独立会员覆盖人群，给了它仅靠支付方分发就让 Aledade
              难以匹敌的触达。Humana 面向服务方的价值医疗中心显示，大型保险公司可以把教育、工具和人群洞察资源内化，而不是外包整个运营层。Waymark 又开出一条相邻赛道：通过健康计划伙伴和社区团队服务
              Medicaid 会员。这不是 Aledade 的核心细分，但说明支付方正在资助扎根社区的赋能模型，它们可能蚕食欠服务人群机会。


              结果是，竞争版图比直接赋能同行更宽。Aledade 不只和相似的伙伴平台竞争，还要面对买方选择诊所所有者、支付方自有能力栈或更广医疗成本平台的可能。
