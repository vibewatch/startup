      - number: '3.3'
        title: 能力广度、打包方式和分发，比精确价格更容易公开观察
        blocks:
          - type: paragraph
            body: >-
              这个品类中，公开可观察的差异化更多来自打包方式和分发，而不是标价。保留下来的竞争对手页面没有一家发布清晰价目表，所以正确比较对象是合同逻辑和交付姿态。Privia 像一套广义诊所赋能套件。agilon
              像全服务老年基层医疗转型模型。Pearl 像最软件化的价值医疗服务方操作系统。Waymark 通过健康计划合作伙伴为 Medicaid 会员打包服务。Oak Street 和 ChenMed
              把照护包装成直接患者服务。Evolent 打包专科和支付方解决方案。Humana 则围绕更大的保险生态打包价值医疗能力栈。


              由于价格透明度低，分发权力和证明点更重要。上市公司身份帮助 Privia 和 agilon 获得可见度和资本市场可信度。Oak Street 受益于 CVS 的规模伞，尽管这里保留的来源是 Oak Street
              自身网站。Humana 显然带来支付方分发和网络杠杆。Evolent 带来健康计划关系和专科广度。Aledade 仍有真实规模——300 万患者、3,000
              个合作伙伴——但买方比较替代方案时，可能更看重渠道触达和广度，而不是原始合作伙伴数量。


              因此，能力矩阵必须把已知和未知分开。公开页面足以支持关于模型类型、买方路径和广度的有意义结论，但不支持对价格或留存给出虚假精确度。实际教训是，即便买方不能或不愿拿透明价目表做基准，Aledade
              的销售故事也必须保持清楚可读。
