  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层多边，但核心仍是独立初级保健
        blocks:
          - type: paragraph
            body: >-
              Aledade
              的客户图谱比单一买方数量更复杂。健康计划、医疗系统、社区卫生中心、联邦合格健康中心、医院和独立诊所都出现在现有来源中，但角色并不相同。最清晰的日常用户是初级保健诊所及其临床医生；健康计划和医疗系统更多充当渠道赞助方、合同对手方或战略扩张伙伴。这个区分很重要，因为即便更大的机构塑造商业关系，Aledade
              的采纳证据通常仍落在诊所层面。


              规模证据很强。Aledade 在 2026 年称，公司服务超过 3,000 个初级保健合作伙伴，覆盖 46 个州和哥伦比亚特区的超过 3 million 名患者；公司还为 2026 绩效年度新增 700
              个组织。更早的 Surescripts 案例研究和 2023 年融资报道补上了这条轨迹：早期证据点是 550 家诊所和 840,000 名患者，2023 年达到超过 1,500 家诊所和超过 2 million
              名患者，2026 年再到超过 3,000 个合作伙伴。


              这条进展更像真实采纳，而不是一次性营销爆发。它也强化了一个判断：即便 Aledade 的证据表面越来越多地包含医疗系统、付款方渠道和社区提供方组织，公司战略重心仍是独立初级保健。
