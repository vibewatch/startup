      - number: '8.2'
        title: 公开可比公司和融资背景提示：为溢价买单要谨慎
        blocks:
          - type: paragraph
            body: >-
              可比公司集合并不完美，但方向性已经足够重要。Privia 是最接近的运营类比，因为它同样围绕医生伙伴赋能，而不是完整诊所所有权或全风险聚合。Stock Analysis 估算 Privia 的 EV/Sales
              约为 1.33x，企业价值约 $2.98B，收入约 $2.25B。agilon 和 Evolent 的 EV/Sales 倍数低得多，反映出更大困境、复杂性或市场怀疑。Oak Street 以 $10.6B
              战略出售，说明规模化初级保健平台能获得大型战略溢价；但 Oak Street 拥有诊所，出售时包含控制权价值，Aledade 不能自动继承。


              关键教训是，公开和战略可比公司并不支持轻松的溢价叙事。Aledade 可能值得相对 agilon 和 Evolent 享有溢价，因为公开证据显示其经济性更干净、医生协同更好。但 Privia
              已经在公开市场中反映了大量优质故事，即便如此，它的交易倍数仍远低于 Aledade 隐含私募收入倍数。


              债务让可比差距更难忽视。Aledade
              现在有一笔大型营运资本额度支撑商业模式，这意味着外部投资者承销的不只是增长故事，还有一个具体提款和契约条款画像仍然私有的融资架构。这是一个重要理由，不能只因为公司看起来像类别领导者，就拉伸倍数。
            claimRefs:
              - CV003
              - CV004
              - CV005
