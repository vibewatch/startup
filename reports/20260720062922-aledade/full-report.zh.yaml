  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接赋能同行是最接近的基准组
        blocks:
          - type: paragraph
            body: >-
              Aledade 并不与每一家价值医疗公司同等竞争。最接近的同行，是承诺帮助医生在承担风险或共享节余合同下取得成功、同时保持独立的平台。Privia
              是最清晰的上市基准，因为其首页以保留私人诊所模式、医生成功和面向诊所的一体化方案为主轴。Pearl 是最接近、软件色彩更重的私营快速跟随者，因为它明确打包价值医疗智能、财务建模、AI
              工作流自动化和面向服务方的激励对齐。agilon 也是重要直接竞争者，但姿态更聚焦老年人市场、风险强度更高。其公开信息围绕赋能基层医疗医生、让老年人照护远离 按服务付费的数量逻辑。


              这个直接集合很重要，因为它界定了买方决定是否使用外部运营伙伴时的真实对照。Aledade、Privia、Pearl，以及某种程度上的
              agilon，都在回答同一个问题：独立或医生主导组织想在价值支付下做成，但又不愿交出全部自主权。不过，它们的解法不同。Privia 看起来覆盖更广的诊所运营和专科触达。Pearl
              更轻、更偏软件，披露规模也明显更小。agilon 更集中在老年人风险经济性。这些差异说明，Aledade 的直接同行集窄于整个基层医疗版图，但产品和渠道两个轴上都有人争夺。


              竞争含义是：Aledade 必须持续赢在医生信任和运营经验上，而不只是押注品类存在。市场里已经有多个可信替代方案，可以服务那些希望保持独立、同时在价值合同下改善表现的服务方。
