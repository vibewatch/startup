      - number: '5.2'
        title: 工作流和架构围绕 EHR 内执行搭建
        blocks:
          - type: paragraph
            body: >-
              最强的公开产品证据集中在 Aledade Assist。Aledade 和第三方报道都把 Assist 描述为一个轻量叠加层：它铺在现有 EHR 工作流之上，大多数时候保持隐形，只有当 Aledade
              患者进入视野时，才实时浮出患者摘要、照护缺口提醒、疑似诊断和下一步指引。这个架构值得注意，因为它似乎把广泛数据摄入——理赔数据、EHR、实验室结果、药房数据流 和 HIE
              数据——与工作流内交付层结合起来，而不是强迫临床医生进入另一个门户。


              athenahealth 的伙伴证据强化了这幅图。My Doctor LLC 称，这个叠加层几乎不需要实施投入，也不打断工作流，却能建立顺畅的实时可见性。Aledade
              自己的案例研究补充说，部署可以通过简单浏览器扩展或桌面文件完成，产品使用微调视觉语言模型，把洞察对齐到不同 EHR 布局，而不依赖传统深度集成。Healthcare IT Today
              也独立以同样方式描述该产品，强调 Aledade 想让照护团队停止打印纸张或在多个应用之间切换。


              从架构看，这指向一个混合栈：数据聚合、AI 驱动洞察生成、EHR 叠加交付，以及帮助团队采取行动的服务层。它具体到足够可信，但公开文档深度仍达不到开发者平台级别。
