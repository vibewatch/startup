      - number: '7.2'
        title: 监管风险仍活跃，法律风险收窄但没有消失
        blocks:
          - type: paragraph
            body: >-
              监管风险仍然实时、当前且处在投资逻辑中心。CMS 正把医生主导的 ACO 更快推向下行风险，修订质量和归因机制，并继续试验 TEAM 和 Ambulatory Specialty Model
              等强制支付模型。即便单项变化看起来可管理，更大的信号是：Aledade 不能假设政策环境静止不动。公司的增长靠帮助诊所在 Medicare 价值医疗规则下获胜，因此规则波动不是背景噪音，而是产品环境的一部分。


              2026 年医生支付变化体现了这种双重性。一方面，合格 APM 参与者获得的支付更新好于非参与者，CMS
              话语也仍支持初级保健。另一方面，同一套规则包含效率调整、质量指标变化，以及更快推向风险的动作。因此，Aledade 受益于政策支持，同时也继续暴露在政策重新校准中。


              法律风险没有举报人诉讼浮出水面时看起来那么严重。法院记录显示，DOJ 拒绝介入，主要 False Claims Act
              诉项被驳回，剩余私人当事方纠纷后来也已解决。这缩小了即时法律下行。但这一事件仍重要，因为它凸显出：在这个类别里，编码、风险调整和合规问题能多快变成声誉风险。正确结论不是 Aledade
              今天有急性法律麻烦，而是合规敏感性在结构上仍然很高。
