  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: Aledade 的风险集中在 CMS 规则依赖、融资架构和合作伙伴介导的执行，而不是缺少产品市场证据。
    data:
      columns:
        - 发生可能性
        - 影响
        - 缓释成熟度
        - 剩余严重性
      rows:
        - label: MSSP 下行风险 / 基准变更
          values:
            - 高
            - 极高
            - 中
            - 高
        - label: 债务契约 / 再融资压力
          values:
            - 中高
            - 极高
            - 中低
            - 高
        - label: TEAM / 强制模式外溢
          values:
            - 中
            - 高
            - 中
            - 中高
        - label: 编码 / 合规尾部风险
          values:
            - 中
            - 中高
            - 中
            - 中
        - label: 合作伙伴数据 / 集成失败
          values:
            - 中高
            - 高
            - 中
            - 中高
        - label: 安全 / 可靠性不透明
          values:
            - 中
            - 高
