              与互操作性。这些动作支持一个判断：Aledade 正在为更大的支付方关系和技术野心更强的产品路线图做准备。仍缺的是完整且最新的公开董事会名单、股东权利图谱，以及私募融资轮或贷款人契约附带控制权的任何公开线索。
