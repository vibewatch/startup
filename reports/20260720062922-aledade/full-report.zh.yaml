  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式和变现绑定服务方经济性，而不是简单软件席位
        blocks:
          - type: paragraph
            body: >-
              公开证据支持把 Aledade 看作价值基层医疗运营公司，而不是纯软件供应商。它的角色是帮助独立诊所和社区型服务方在共享节余及其他风险承担安排中取得成功，这种模式的财务后果也体现在保留下来的来源里。2023
              年，第三方报道将公司与超过 150 个价值医疗合同、超过 200 万患者和超过 200 亿美元总医疗支出联系起来。同一报道称，Aledade 2022 年收入超过 4.75 亿美元，同比增长超过
              50%；当时服务超过 100 万 MSSP 患者和近 250,000 名 Medicare Advantage 患者。这些披露意味着，公司变现已经不止一个政府项目，也已远超试点阶段。


              与 Privia 的对比有用，因为其 2025 年 10-K 把 Aledade 仍保密的内容讲清楚了。Privia 称，医生赋能收入可以来自四个桶：按服务付费
              患者照护与管理、按会员按月的照护管理费、包括按人头付费收入和共享节余在内的价值医疗收入，以及其他服务。这不能证明 Aledade
              拥有相同组合，但提供了一个公开模板，说明成规模的服务方赋能公司可以如何变现。它也强化了为什么简单用 ARR 框架看 Aledade 有风险：按成效结算和支付方相关经济性，不像订阅软件那样运作。


              实际含义是：Aledade 的收入质量大概好过一次性服务业务，但不如经典 SaaS 模型干净。收入看起来与持续运营关系和可衡量结果绑定；但具体收入组合、实际抽成率和确认节奏仍未披露。
