      - number: '7.3'
        title: 运营风险主要是披着工作流成功外衣的依赖风险
        blocks:
          - type: paragraph
            body: >-
              Aledade 最强的公开证据故事，也暴露了它的依赖图谱。athenahealth、Surescripts 和 Manifest MedEx 案例研究有价值，正是因为它们展示了真实部署。但它们也说明，客户价值依赖
              EHR 兼容性、合作伙伴数据馈送、ADT 通知、用药史可得性和持续的工作流信任。如果这些轨道退化，即便根因在合作伙伴，客户也可能把失败体验为 Aledade 的问题。


              公开证据包也留下了安全和可靠性问题。强证据表明 Aledade 已经做出了有用的工作流产品，包括 Assist 和 EHR 覆盖层。但在正式安全认证、公开正常运行时间历史、AI
              临床建议的外部模型验证指标上，证据并不同样强。这并不能证明弱点，却意味着投资者必须直接尽调这些领域，而不能假设客户案例已经回答了它们。


              客户风险同样不对称。Aledade
              拥有的具名证据好于许多私营医疗创业公司，但证据集仍偏向成功。公开流失率、NRR、GRR，以及按付款方或诊所拆分的集中度都缺席。这让客户基础看起来真实，但其耐久性比头部增长更难衡量。
