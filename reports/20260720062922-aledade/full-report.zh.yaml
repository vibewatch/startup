companyProfile:
  summary: >-
    Aledade 是一家位于 Bethesda、由创始人主导的价值医疗公司，Farzad Mostashari 和 Mat Kendall 于 2014
    年创立。公司把独立基层医疗诊所、社区健康中心及相关服务方组织进责任医疗架构，提供工作流、数据分析和 AI 辅助工具（如 Aledade Assist），并在质量改善、成本降低带来的经济上行中分成。到 2026 年，Aledade
    称其服务超过 3,000 个基层医疗合作伙伴，照护 46 个州和哥伦比亚特区超过 300 万名患者。公开证据显示公司规模真实、运营已跑通，但它仍是私营公司，经审计现金经济性、债务使用、集中度和留存披露不足。
