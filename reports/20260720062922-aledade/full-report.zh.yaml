      - number: '2.2'
        title: 定量视角显示市场很大但有边界
        blocks:
          - type: paragraph
            body: >-
              最有用的规模锚点，是 CMS 和 KFF 真能数清的责任医疗人群。CMS 估计 2026 年将有 1,430 万名 Medicare 受益人通过 ACO 接受协同照护；仅 MSSP 就将通过 511 个 ACO
              以及超过 700,000 名参与服务方和组织覆盖 1,260 万人。Fast Facts 还给出一个重要结构点：64% 的 MSSP ACO 是低收入
              ACO，这意味着市场仍包含一条宽阔的医生主导长尾，而不只有大型整合系统。对 Aledade 来说，这比宽泛的价值医疗话术更相关，因为医生主导端的碎片化，正是赋能伙伴需求的来源。


              第二个视角是相邻的 Medicare 渠道规模。KFF 报告称，2026 年 Medicare Advantage 已覆盖 3,520 万人，占符合资格 Medicare 受益人的 55%。这个数字远大于 ACO
              人群，也说明只讲 MSSP 并不完整。如果责任基层医疗供应商无法延伸到支付方赞助或 MA 相关合同，就会把自己卡在 Medicare 按服务付费份额不断缩小的池子里。Aledade
              自己的新闻稿避开了这个陷阱，明确把 MA、Medicaid 和商业业务线纳入当前足迹。


              第三个视角是公司自身运营规模。Aledade 从 2023 年超过 1,500 家独立诊所、200 万患者，走到 2026 年超过 3,000 个合作伙伴、300 万患者。相对于更大的 Medicare 或 MA
              宇宙，这仍然不大；但规模已经足以说明，公司在独立基层医疗市场中占据了有意义的一块。未解的主要规模问题，不是市场是否真实，而是剩余独立诊所池里还有多少未结盟、且经济上值得争取的供给。
