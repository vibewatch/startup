  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              给 Aledade 做市场规模，不能拿全部价值医疗或全部美国医疗支出来套。可辩护的边界更窄：服务独立和社区型服务方的价值基层医疗运营，这些服务方需要分析、照护管理工作流、支付方签约，以及基准 / 风险执行。CMS
              对责任医疗和风险安排的定义在这里很关键，因为它们说明经济单位不是软件席位，也不是保险保费，而是一个责任医疗服务方组织，在基准约束下管理整体照护成本、同时改善质量。因此，Aledade
              更像医生主导责任医疗的外包运营层，而不是支付方、诊所所有者或通用诊所管理供应商。


              纳入的机会包括 MSSP 参与、相邻的 Innovation Center 责任医疗模型，以及 Medicare Advantage、Medicaid 和商业人群中的支付方赞助医生赋能合同。Aledade 自己的
              2026 年网络新闻稿明确表示，公司已经覆盖这四条轨道。明显的排除项同样重要。这个市场不包括全部 Medicare Advantage
              保费收入、全部按人头付费下的医疗系统经济收益，或不需要独立基层医疗赋能方的专科模型。这样的边界能大幅降低一个诱惑：引用一个没有差异化的数千亿美元 TAM，却不说明 Aledade 到底在哪里变现。


              主要替代方案包括碎片化按服务付费基层医疗的现状、服务方集团自建 ACO
              能力、医疗系统自有的人群健康团队，以及支付方自有的责任医疗平台。只有当中小医生集团足够需要外部伙伴，愿意与其分享节余、工作流和治理时，Aledade 才能创造持久价值。CMS
              扩大责任医疗、独立基层医疗仍然碎片化，这两点说明需求仍真实存在；但市场定义必须从这个运营问题出发，而不是从宽泛医疗支出出发。
