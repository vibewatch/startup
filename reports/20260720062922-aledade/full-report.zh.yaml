      - number: '3.4'
        title: 转换成本真实存在但并非绝对，护城河耐久性取决于信任与执行
        blocks:
          - type: paragraph
            body: >-
              Aledade
              确实受益于转换成本，但这种成本是中等的，不是绝对锁定。服务方赋能平台通过数据连接、治理流程、支付方合同、归因逻辑和照护管理工作流嵌入客户。把一个伙伴换成另一个并不简单。但诊所全程可以保持法律上的独立，这限制了硬锁定。多归属和定期重新竞标的大门仍然开着，尤其当支付方推送一个对齐方案，或诊所想要更广能力时。


              自有诊所竞争者抬高了转换门槛，因为它们不只是供应商，而是照护交付环境。把患者和临床医生从 Oak Street 或 ChenMed
              场景中迁出，和更换一个赋能伙伴不是一个难度等级。但这些模式也需要更多资本，并要求医生更愿意放弃自主权。Aledade
              的护城河必须在这里最清楚：医生信任、基准经验诀窍、把节余分配回诊所的能力，以及足够强、能跑赢内部自建的运营模型。


              公开证据没有证明护城河坚不可摧，只证明护城河有合理性。Aledade
              在买方重视独立性、多支付方签约和外部运营伙伴时显得有优势；当买方偏好自有交付、支付方整合或更宽平台时，则更脆弱。因此，护城河真实存在，但取决于执行，不是品类领导地位的自动结果。
