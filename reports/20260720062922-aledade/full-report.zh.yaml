      - number: '8.4'
        title: 最终结论：资产有吸引力，价格要求高，尽调路径清晰
        blocks:
          - type: paragraph
            body: >-
              最终结论很直接。Aledade
              看起来是仍未上市的独立价值医疗赋能资产中最强的一类。这支持继续关注。但当前可见估值要求投资者先为溢价故事付钱，而公司还没有在最关键投资变量上提供溢价证据：股权结构表、债务提款、队列耐久性、集中度，以及经审计的现金创造质量。


              这个缺口小到足以让公司保持可投，大到足以让价格谈不上诱人。投资者不需要一家完美公司才能成功投资；他们需要的是价格和证据之间有利的错配。眼下 Aledade 证据很强，价格支撑只是中等偏有利。


              因此，立场不是拒绝，而是有纪律地等待。若尽调弥合现金流和资产负债表缺口，且没有暴露集中度脆弱性，就上调判断；若政策、债务使用或客户耐久性看起来比公开叙事更差，就下调判断。在那之前，Aledade
              应留在活跃观察名单，而不是立即买入篮子。
