  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 首要风险是政策与融资相互依赖，而不是没有产品
        blocks:
          - type: paragraph
            body: >-
              Aledade 的风险画像不寻常，因为最大的威胁并不始于产品是否有效。产品和客户章节的公开证据显示，运营模型在生产环境中确实能跑。更高阶的风险在于，Aledade 站在 CMS
              规则、共享节省数学、诊所经济性和一笔已具实质规模的债务额度交汇处。任何一层变弱，都可能快速传导到客户价值、伙伴分配和融资舒适度。


              因此，核心风险排序从政策与融资相互依赖开始。CMS 仍在主动修订 MSSP 规则、医生支付方法、质量评分，以及强制性专科 / 事件模型。与此同时，Aledade 明确用一笔大型优先担保融资额度，弥合
              Medicare 回款和合作伙伴分配之间的时间差。这两个事实单独看都可管理；放在一起，就形成了从监管变化传导到流动性压力的路径，投资者应把它视为核心风险架构。


              下一层风险围绕合作伙伴依赖、安全 /
              可靠性不透明、客户集中度不透明和全国规模执行展开。今天单看任何一项，都不像会打穿投资逻辑；但它们重要，因为它们会放大政策冲击，而不只是与政策冲击并存。举报人案件留下的法律尾部风险已经小于 2024
              年，但它仍提醒投资者：Aledade 运营在 Medicare 中对合规高度敏感的一角。
