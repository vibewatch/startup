  - id: TV005
    title: 投资逻辑失效与叫停触发表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 债务压力浮现
        - 融资安排修订、契约收紧，或披露大额提款
        - 削弱安全边际，放大政策风险
        - 除非价格重设，否则从观察转为回避
      - - CMS 调整伤及医生经济性
        - MSSP / 支付假设对低收入 ACO 明显恶化
        - 基准情景收入和续约假设变弱
        - 下调估值区间，上调风险评级
      - - 留存 / 集中度不达预期
        - 大型付款方或诊所流失；续约队列表现弱
        - 相对上市可比公司的溢价不再站得住
        - 下调投资逻辑耐久性
      - - 现金流质量不达预期
        - 收入增长没有落到伙伴调整后的现金生成上
        - 倍数溢价难以维持
        - 向较弱上市可比组重估
      - - 降价轮或疲弱老股成交出现
        - 价格发现跌破 2023/2026 年可见标记
        - 证实当前私有市场要价过高
        - 围绕新成交重设入场纪律
    notes: 选择这些触发项，是因为它们同时改变估值和信心，而不只是负面标题。
    claimRefs:
      - CV015
      - CV016
      - CV034
      - CV040
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人 / 尽调路径
    rows:
      - - 股权结构表与优先权
        - 清算堆叠、期权池、优先级和优先权瀑布
        - 表面估值可能误导新钱经济性
        - 财务团队 / 法律顾问
      - - 债务协议
        - 提款金额、定价、契约、抵押品、修订权
        - 债务可能实质改变股权吸引力
        - CFO / 贷款方尽调
      - - 经审计收入质量
        - 从 ARR 和共享节省到 GAAP 收入与现金的桥接
        - 基于倍数的判断需要真实经济锚点
        - 财务 / 审计
      - - 留存与集中度
        - NRR、GRR、流失、最大付款方和最大诊所敞口
        - 只有耐久性强，溢价倍数才成立
        - 收入运营 / 客户成功
      - - 情景支撑
        - 管理层对 2026-2028 年增长、利润率和资本使用的计划
        - 用于检验乐观情景是否可信
        - CEO / CFO
      - - 退出准备度
        - IPO 准备度、买家版图、治理和报告节奏
        - 决定上行空间能否在合理时间内兑现
        - CEO / 董事会
    notes: 这些问题很窄，因为报告已能支撑公司质量；剩下主要是价格和结构尽调。
    claimRefs:
      - CV016
      - CV027
      - CV033
      - CV039
      - CV041
