      - number: '2.4'
        title: 增长驱动真实存在，但政策设计和渠道迁移限制上行空间
        blocks:
          - type: paragraph
            body: >-
              最强的增长驱动，是 CMS 仍在主动扩大责任医疗参与，而不是让它停摆。2026 年参与人数创下新高，共享节余美元数自项目启动以来大幅复合增长，CMS 也在增加 ACO PC Flex 和 LEAD 等新轨道。对
              Aledade 来说，低收入 ACO 仍占 MSSP 新进入者多数，是正面信号，因为医生主导的碎片化是公司的历史切入口。CareFirst
              这类商业联盟也说明，当支付方希望改善网络表现、但不想自己拥有医生运营层时，公司市场可以扩展到纯 Medicare 按服务付费之外。


              最硬的约束，是这个市场仍由政策设计。基准公式、风险轨道、参与门槛和方法变更都来自 CMS，而不是来自供应商自主定价。ACO PC Flex 的存在，正因为基础按服务付费
              的付款时点本身不足以资助高级基层医疗；这对赋能供应商是利好，但也证明市场经济性仍依赖报销设计。KFF 的 2026 年 Medicare Advantage 分析又增加了第二层约束：MA 已覆盖多数符合资格的
              Medicare 受益人，并且因为付款高于可比传统 Medicare 支出，正持续受到审查。这不推翻价值医疗论点，但意味着 Aledade 不能假设管理式医疗 扩张会无摩擦抵消 MSSP 集中度。


              因此，投资结论需要分层。市场足够大、仍在增长，而且对 CMS 和支付方都很重要。但它不是干净的软件
              TAM，而是一个受监管、多渠道的运营市场。增长取决于基层医疗碎片化、支付方胃口和基准设计是否保持足够有利，使独立诊所继续需要 Aledade
              这样的伙伴。后续尽调应聚焦业务线组合、剩余独立诊所供给和单元经济性，而不是继续证明品类存在。
