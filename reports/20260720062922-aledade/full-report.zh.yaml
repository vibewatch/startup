              在 2026 年给出外部验证：评分 95.7，且受访临床医生的重新合作率据报为 100%。与此同时，法律记录显示，公司确实面对过 False Claims Act 编码指控，尽管主要诉项已驳回，Aledade
              也称 DOJ 拒绝介入。这组事实很重要：Aledade 看起来是强运营商，合作伙伴反馈异常正面；但它的体量已经足够大，法律审视、指标口径漂移和私募市场不透明，都属于正常尽调工作，而不是跳过验证的理由。
