      - CR001
      - CR007
      - CR016
      - CR020
      - CR032
      - CR039
      - CR042
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 主风险链条从 CMS 和合规冲击出发，传导到诊所经济账、共享节省池、贷款人舒适度和估值。
    data:
      nodes:
        - id: n1
          label: CMS 规则 / 基准变更
        - id: n2
          label: 诊所经济账 / 下行风险负担
        - id: n3
          label: 共享节省池和合作伙伴分配
        - id: n4
          label: Aledade 收入和增长能力
        - id: n5
          label: 债务余量 / 贷款人舒适度
        - id: n6
          label: 估值和融资选择权
        - id: n7
          label: 合规事件 / 声誉冲击
        - id: n8
          label: 客户信任 / 合作伙伴意愿
      edges:
        - from: n1
          to: n2
          label: 规则改变成本、质量或基准算法
        - from: n2
          to: n3
          label: 诊所表现走弱会减少节省收益
        - from: n3
          to: n4
          label: 结算和分配下降冲击经济账
        - from: n4
          to: n5
          label: 现金生成影响契约舒适度
        - from: n5
          to: n6
          label: 债务压力压缩估值自由度
        - from: n7
          to: n8
          label: 调查可能削弱信任
        - from: n8
          to: n4
          label: 增长放慢或流失上升会伤及收入
    approximationNotes: DAG 聚焦公开证据中浮现的、经济影响最重大的传导路径。
    claimRefs:
      - CR015
      - CR018
      - CR037
      - CR038
      - CR042
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: Aledade 依赖监管方、贷款方、渠道和数据伙伴织成的网络，把工作流价值转成持久经济收益。
    data:
      nodes:
        - id: d1
          label: CMS / MSSP
        - id: d2
          label: Ares 授信
        - id: d3
          label: EHR 合作伙伴
        - id: d4
          label: 数据合作伙伴
        - id: d5
          label: 医保计划
        - id: d6
          label: 医疗系统
        - id: d7
          label: 诊所用户
        - id: d8
          label: Aledade 运营平台
      edges:
        - from: d1
          to: d8
          label: 规则定义节省收益和风险经济账
        - from: d2
          to: d8
          label: 信贷支持时点缺口和分配
        - from: d3
          to: d8
          label: 工作流集成层
        - from: d4
          to: d8
          label: 临床和利用数据流
        - from: d5
          to: d8
          label: 渠道 / 经济项目
        - from: d6
          to: d8
          label: 企业扩张关系
        - from: d8
          to: d7
          label: 产品、辅导与签约支持
        - from: d7
          to: d5
          label: 绩效影响支付方价值感知
    approximationNotes: 依赖关系来自具名的公开案例研究、融资披露和政策资料，而不是内部架构图。
    claimRefs:
      - CR019
      - CR027
      - CR028
      - CR034
      - CR037
  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 投资判断的主线是：公司质量过关后，价格和透明度还要过关；问题不在于 Aledade 有没有真实业务。
    data:
      nodes:
        - id: f1
          label: 大网络 + 真实产品 / 客户证据
        - id: f2
          label: 品类领先有可能成立
        - id: f3
          label: 可见私募定价仍约 $3.5B
        - id: f4
          label: 上市可比公司交易倍数更低
        - id: f5
          label: 债务与股权结构表不透明，压低安全边际
        - id: f6
          label: 投资建议 = 观察 / 继续研究
      edges:
        - from: f1
          to: f2
          label: 公司质量达标
        - from: f2
          to: f3
          label: 投资人转而问什么价格才合理
        - from: f3
          to: f4
          label: 可比公司对照削弱溢价理由
        - from: f4
          to: f5
          label: 不透明度拉大溢价缺口
        - from: f5
          to: f6
          label: 等更强证据或更好价格
    approximationNotes: 这条流程把完整报告压缩成 IC 讨论最相关的决策链。
    claimRefs:
      - CV017
      - CV028
      - CV029
      - CV037
      - CV038
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 如果投资人用上市公司 EV/Sales 区间锚定，而不是用稀缺资产乐观预期锚定，Aledade 当前估值的安全感会明显下降。
    data:
      items:
        - label: 悲观收入 $0.9B，按 1.5x
          value: 1.35
        - label: 悲观收入 $0.9B，按 2.0x
          value: 1.8
        - label: 基准收入 $1.0B，按 2.5x
          value: 2.5
        - label: 基准收入 $1.0B，按 3.0x
          value: 3
        - label: 乐观收入 $1.1B，按 4.0x
          value: 4.4
        - label: 乐观收入 $1.1B，按 4.5x
          value: 4.95
    approximationNotes: 柱形展示企业价值口径的情景锚点，单位为十亿美元，未做债务或清算优先权调整。
    claimRefs:
      - CV021
      - CV023
      - CV025
      - CV026
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 当前可见定价高于基准情景，只比真正的乐观情景略低。
    data:
      items:
        - label: 悲观
          low: 1.3
          mid: 1.55
          high: 1.8
        - label: 基准
          low: 2.5
          mid: 2.75
          high: 3
        - label: 可见标记
          low: 3.5
          mid: 3.5
          high: 3.5
        - label: 乐观
          low: 4.4
          mid: 4.7
          high: 5
    approximationNotes: 这些区间不是公开交易目标价，而是尽调阶段的估值经验锚。
    claimRefs:
      - CV023
      - CV025
      - CV026
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: Aledade 在市场和证据验证上得分较好，但估值支撑和证据完整性偏弱。
    data:
      items:
        - label: 市场吸引力
          value: 8
          max: 10
        - label: 客户 / 产品证据
          value: 8
          max: 10
        - label: 护城河 / 市场位置
          value: 7
          max: 10
        - label: 经济性可见度
          value: 5
          max: 10
        - label: 风险负担
          value: 4
          max: 10
        - label: 估值支撑
          value: 4
          max: 10
        - label: 证据完整性
          value: 5
          max: 10
    approximationNotes: 这些得分是供 IC 使用的内部综合评级，不是公司对外披露的指标。
    claimRefs:
      - CV018
      - CV019
      - CV028
      - CV029
      - CV037
      - CV038
