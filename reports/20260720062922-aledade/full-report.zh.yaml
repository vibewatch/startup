      - number: '8.3'
        title: 情景分析显示当前定价高于基准情景，落入低位乐观区间
        blocks:
          - type: paragraph
            body: >-
              这里最不容易错的方法，是基于倍数的情景分析。Aledade 没有披露足够的持续 EBITDA、自由现金流或股权结构机制，不足以支撑假精确的
              DCF，也不适合用猜测搭股权瀑布。收入规模标记已经足以支持情景，尤其是和公开可比倍数、已知融资压力放在一起时。


              乐观情景下，Aledade 证明自己真是一家超过
              $1.1B、盈利、耐久、医生主导的平台，并在仍是私营公司的情况下，赢得相对公开可比公司的溢价交易资格。基准情景下，公司仍然很强，但投资者最终会更接近公开优质公司来定锚，而不是定锚在稀缺资产想象上。悲观情景下，政策或融资压力同时压缩收入前景和倍数，事后看私募价格可能高得过分。


              这个框架把可见的 $3.5B
              估值放在模型基准区间之上，更接近乐观情景的低端。只有当尽调发现异常强的留存、有限的杠杆使用，以及好于市场当前所见的现金经济性时，这才可以接受。没有这些证据，情景分析支持耐心，而不是急迫行动。
            claimRefs:
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
              - CV025
