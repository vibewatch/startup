        - 需要拥有诊所，医生自主性更低
      - - ChenMed
        - 自营诊所替代方案
        - 私营、自营诊所老年照护模型
        - 需要高接触初级保健的老年人
        - VIP 私人医生关系和 24/7 访问
        - 资本密集，结构上不同于伙伴赋能
      - - Evolent
        - 相邻既有玩家
        - 上市、更宽的专科和付款方平台，覆盖 40M 唯一会员
