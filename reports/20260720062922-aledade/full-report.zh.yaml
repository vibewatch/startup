      - number: '2.3'
        title: 买方、用户和预算所有者因渠道而异
        blocks:
          - type: paragraph
            body: >-
              买方图谱是多边的，因为责任医疗平台靠合同购买，而不只是软件采购。在服务方主导的 MSSP 安排中，ACO
              或责任服务方实体实际上掌握基准和共享节余预算，医生、照护经理和诊所管理员才是日常用户。在支付方赞助的医生赋能交易中，保险公司往往控制预算和网络策略，医生诊所消耗运营支持和工具。CareFirst
              联盟把这种结构具象化：CareFirst 将合作定位在降低会员成本趋势、改善结果，Aledade 则强调面向独立 PCP 的现场诊所支持、分析和专科资源。


              这种买方分裂很重要，因为不同细分的采用摩擦不一样。服务方主导的 ACO 在乎基准管理、归因和下行风险承受力。支付方在乎医疗损失趋势、网络表现和合同广度。安全网和农村渠道更在乎现金流和照护团队容量。CMS 2026
              年参与数据表明，这些细分已经成规模：ACO REACH 覆盖数百家 FQHC、Rural Health Clinic 和 Critical Access Hospital，Aledade
              自身也横跨城市和农村社区。


              因此，Aledade 的可服务市场不是一个同质化 PCP 大桶，而是一组买方 /
              用户组合：它们都受同一个价值基层医疗运营问题牵引，但资金来自不同预算，续约标准也不同。这更有利于具备签约广度和基层医疗工作流的公司，而不是只卖点状方案的公司。
