  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Aledade 往往靠发起方或渠道关系赢单，但扩张前要先在诊所工作流和结果层面证明价值。
    data:
      nodes:
        - id: j1
          label: 医保计划 / 医疗系统 / 诊所探索 VBC 合作伙伴
        - id: j2
          label: 诊所或地区加入 Aledade 合约结构
        - id: j3
          label: 工作流工具和培训完成部署
        - id: j4
          label: 护理缺口、转诊过渡或质量工作流改善
        - id: j5
          label: 节省收益 / 星级 / 临床证明成为参考点
        - id: j6
          label: 随后进入地域或细分市场扩张
    approximationNotes: 该旅程图综合了支付方、区域和诊所层面具名证明中的案例；它是一般化模式，不是单一合约年表。
    claimRefs:
      - CU001
      - CU003
      - CU017
      - CU021
      - CU026
      - CU029
  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: wide
    summary: 公开客户证明显示，Aledade 的扩张循环从合作伙伴 / 渠道触达开始，进入生产部署，再到可衡量结果，随后扩大铺开。
    data:
      nodes:
        - id: f1
          label: 渠道或诊所兴趣
        - id: f2
          label: 合约 / ACO 参与开始
        - id: f3
          label: 工作流集成和培训上线
        - id: f4
          label: 具名结果出现
        - id: f5
          label: 参考证明质量增强
        - id: f6
          label: 网络扩张加速
      edges:
        - from: f1
          to: f2
          label: 支付方、系统或诊所选择 VBC 赋能路径
        - from: f2
          to: f3
          label: 工具、ADT 或覆盖层部署到日常工作中
        - from: f3
          to: f4
          label: 用药、高血压或转诊过渡指标改善
        - from: f4
          to: f5
          label: 案例研究和合作伙伴引语强化证明
        - from: f5
          to: f6
          label: 证明支持地域和细分市场扩张
    approximationNotes: 该流程基于已保留的具名案例，而不是单一公开漏斗统计。
    claimRefs:
      - CU008
      - CU009
      - CU012
      - CU014
      - CU017
      - CU021
      - CU029
  - id: FU003
    title: 客户验证矩阵
    type: matrix
    layout: wide
    summary: Aledade 在部署和结果上的公开证明强于留存和集中度证明。
    data:
      columns:
