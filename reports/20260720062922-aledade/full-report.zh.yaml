      - number: '6.3'
        title: 留存代理指标偏正面，但真正耐久性仍未公开
        blocks:
          - type: paragraph
            body: >-
              公开留存证据方向上不错，但并不完整。Aledade 的 2026 Best in KLAS 公告称，受访临床医生显示 100%
              继续合作率；若样本有代表性，这是一个强信号，但它仍是基于样本的满意度代理，而不是全公司留存指标。Thought Industries 还补充了一个有用的采纳代理：按需学习把 Aledade 应用首次使用时间缩短
              20 天，80% 徽章获得者报告信心很高，85% 会向同事推荐这些徽章。对于一个不得不用更可复制模型替代线下培训的规模化网络，这些都是鼓舞人心的客户成功标记。


              扩张证据比留存证据更容易看到。Aledade 从 550 家诊所增长到超过 1,500 家，再到超过 3,000 个合作伙伴，实际展示了先落地再扩张。加州案例研究显示了通过 CAledade
              的地域深耕；健康计划和医疗系统页面则表明，Aledade 可以在不改变医生主导核心定位的情况下，按细分和渠道扩张。这让客户基础具备真实宽度。


              缺失的是硬耐久层：NRR、GRR、流失率、合同期限、续约队列，以及按付款方或诊所拆分的收入集中度。在这些指标出现之前，最稳妥的结论是：Aledade 有强采纳和满意度代理，但还没有公开证明客户经济性能跨时间维持。
