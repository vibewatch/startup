        - 可把 VBC 工具打包进付款方关系
        - 对希望外部协同的独立诊所来说，中立性较弱
      - - 内部自建 / 本地 ACO 运营
        - 现状替代方案
        - 无需新增供应商
        - 较大集团或医疗系统支持的诊所
        - 不用让渡供应商分成，本地控制权完整
        - 通常运营杠杆更弱，学习曲线更慢
    notes: 这些行混合了直接可比、自营诊所替代、既有玩家和现状方案，因为买方能用结构不同的方式解决责任初级保健这项任务。
