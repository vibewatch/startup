        - 不要按明显便宜货承销；继续尽调，等待更好的披露或更好的进入条款
      - - 上调条件
        - 中
        - 若缺口关闭，则从高降至中
        - 若硬现金经济性支撑溢价，则具吸引力
        - 只有在尽调验证杠杆温和、续约强劲且盈利经审计后，才上调
      - - 下调条件
        - 中
        - 若触发则很高
        - 若下行证据坐实，则定价过高
        - 如果债务使用、CMS 敏感性或集中度比公开叙事暗示的更差，则下调
    notes: 该建议刻意对价格敏感：公司可以很强，但当前可见进入点仍只算中等吸引力。
    claimRefs:
      - CV017
      - CV018
      - CV019
      - CV033
      - CV034
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 重要性
      - 何种情况会改变判断
    rows:
      - - 投资逻辑：品类领先的医师主导型 VBC 支持平台
        - Aledade 在全国网络中已经拿出真实规模、产品采用和客户验证
        - 经审计的现金流质量和持久留存会进一步增强信心
      - - 投资逻辑：相对承压同行的溢价有理由
        - 相比 agilon 或更弱的上市 VBC 公司，Aledade 看起来更干净、激励更一致
        - 如果上市可比公司的疲弱主要来自同行自身问题，一定溢价合理
      - - 反向逻辑：价格已经反映最佳执行情景
        - 可见私募估值高于上市可比逻辑，接近乐观情景低端
        - 更低进入价或更好披露会削弱这个反对点
      - - 反向逻辑：杠杆和不透明压低安全边际
        - 债务提取、契约、优先权和集中度仍未公开
        - 完整信贷文件和股权结构表可能显著改善，也可能恶化判断
    notes: 反向逻辑针对的是入场纪律，不是否认 Aledade 是一家真实且可能很有价值的公司。
    claimRefs:
      - CV012
      - CV013
      - CV017
      - CV029
      - CV031
      - CV037
      - CV038
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 收入 > $1.1B，盈利能力守住，契约压力有限，续约强劲，上市可比公司重估
        - ~4.0x-4.5x 收入；债务 / 稀释调整前大约 $4.4B-$5.0B
        - 执行或政策失误会打破溢价
        - 可能，但需要溢价证据支撑
      - - 基准
        - 收入约 $1.0B，增长延续，债务可控，留存好但不算异常强
        - ~2.5x-3.0x 收入；债务 / 稀释调整前大约 $2.5B-$3.0B
        - 如果披露仍有限，当前价格仍偏满
        - 最有决策价值的默认情景
      - - 悲观
        - 收入 $0.85B-$0.9B，CMS / 支付压力、债务担忧、客户持久性不够扎实
        - ~1.5x-2.0x 收入；债务 / 稀释调整前大约 $1.3B-$1.8B
        - 倍数压缩叠加杠杆，伤害会很快显现
        - 不是基准情景，但若两个风险同时出现，也说得通
    notes: 区间是企业价值式启发法，刻意避免假装知道净债务、清算优先权或精确股数。
    claimRefs:
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
      - CV026
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    rows:
      - - Privia Health
        - 上市医生赋能可比公司
        - ~$3.39B 市值；~$2.98B EV；~1.33x EV/Sales
        - 最接近的上市运营参照
        - 上市公司、已盈利，透明度也高于 Aledade
      - - agilon health
        - 上市 VBC 可比公司
        - ~$2.17B 市值；~$1.97B EV；~0.34x EV/Sales
        - 显示复杂度和市场疑虑带来的下行空间
        - 全风险敞口更重，困境程度也高于 Aledade
      - - Evolent Health
        - 上市 VBC / 服务可比公司
        - ~$654M 市值；~$1.50B EV；~0.79x EV/Sales
        - 显示市场可以把复杂医疗服务平台压到多低的估值
        - 业务组合与 Aledade 有实质差异
      - - Oak Street Health
        - 战略并购可比案例
        - 2023 年被 CVS 以 ~$10.6B EV 收购
        - 显示战略买家愿意为规模化初级保健资产出价
        - 自营诊所模式和控制权溢价限制可比性
      - - Aledade 预览标记
        - 私有市场老股 / 预览页
        - 2026 年可见标记约 ~$3.5B
        - 可用于锚定当前要价
        - 预览页式来源比真实成交记录薄得多
    notes: 这组样本有意混合：最接近的上市可比公司、较弱的上市可比公司、战略并购可比案例，以及投资人被隐性要求接受的当前私有市场标记。
    enumerationScope:
      coverage: sample
      basis: >-
        This sample covers the most decision-useful public, strategic, and private-marker analogs for current
        underwriting, but it is not exhaustive across all VBC business models.
