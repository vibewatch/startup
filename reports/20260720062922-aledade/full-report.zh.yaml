            body: >-
              创始人-市场匹配是 Aledade 公司概览中最强的证据之一。Farzad Mostashari 曾任 National Coordinator for Health IT，深度参与 HITECH 和
              Meaningful Use；这一点很关键，因为 Aledade 卖给基层医疗的不是消费软件，而是工作流改变、数据使用和支付模式执行。Mat Kendall
