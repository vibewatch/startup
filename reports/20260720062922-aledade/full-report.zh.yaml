      - number: '1.3'
        title: 资本轨迹、收入指标与封面指标可靠性
        blocks:
          - type: paragraph
            body: >-
              Aledade 作为私营公司，公开资本故事异常强，但关键封面指标仍不完整。公司披露 2023 年 6 月完成 2.6 亿美元 Series F，由 Lightspeed 领投，蓝筹老股东参与；2025 年 12
              月又获得 Ares 提供的 5 亿美元优先担保信贷额度，可扩至 6.5 亿美元。资金用途很重要：公司把这笔额度描述为营运资本基础设施，用来桥接 Medicare
              付款时点，并加快把共享节余分配给临床合作伙伴；这更像运营周转支持，而不是困境融资。公开收入指标也在改善。Aledade 在 Series F 公告中披露 2022 年收入超过 4.75 亿美元，Fierce
              Healthcare 又报道公司 2025 年收入达到 10 亿美元且已经盈利。即便如此，现估值、经审计 2025 年
              EBITDA、确切现金余额和净杠杆，在保留下来的公开资料中仍未披露。正确结论是：Aledade 有真实规模和资本可得性，但在可承销财务细节披露上，仍按私营公司的方式行事。
