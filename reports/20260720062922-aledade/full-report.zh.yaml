      - number: '7.5'
        title: 风险结论：可投，但必须严密监控政策、债务和集中度
        blocks:
          - type: paragraph
            body: >-
              Aledade
              的整体风险图景可投，但不能随意。业务已经有足够的产品和客户证据，避开了最常见的创业风险——故事之下没有真实运营引擎。风险已经上移到政策设计、融资架构和跨伙伴执行。这比“没有产品”更好，但如果忽视，仍可能让投资者受到明显伤害。


              最重要的尽调姿态，是监控传导链，而不是只看孤立事件。监管变化危险，不只是因为它改了一条规则；只有当它压低诊所经济性、缩小共享节省、挤压伙伴分配，并进一步收紧债务余量时，危险才真正显现。同样，数据伙伴或安全问题最值得关注的时点，是它伤害工作流信任和续约行为时。


              因此，正确的投资判断既不能自满，也不该宿命。Aledade
              缩小了法律下行，搭出了真实缓释项，也展示了生产级客户结果，这些都值得肯定。但在把当前增长叙事视为压力下仍有韧性之前，投资者应要求公司明确回答契约条款、集中度、安全控制和队列耐久性。
