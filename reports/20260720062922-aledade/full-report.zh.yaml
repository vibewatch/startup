      - number: '4.2'
        title: 公开牵引力看起来真实，上市可比公司展示成熟形态
        blocks:
          - type: paragraph
            body: >-
              Aledade 的公开牵引力指标足够强，值得认真看待。Fierce 报道公司 2025 年收入达到 10 亿美元且已经盈利，这与更早官方披露的 2022 年收入超过 4.75 亿美元方向一致。即便 2025
              年数字没有经审计公开申报支持，增长轨迹仍指向真实扩张，而不是虚荣指标式活动。公开来源还显示，管理层使用 2023 年 Series
              F，不只是延长现金跑道，还用于加快网络增长、战略健康计划联盟、技术投入和收购。这种资本配置姿态很重要，因为它意味着公司把能力广度和支付方分发视为未来变现驱动。


              Privia 的 10-K 为成熟医生赋能平台在公开市场中的形态提供了可信基准。2025 年，Privia 报告收入 21.2 亿美元、运营利润 3,420 万美元、净利润 2,290 万美元、调整后
              EBITDA 1.255 亿美元，现金 4.797 亿美元且无未偿债务。Privia 也明确把自身模型描述为低投入资本、具备有吸引力的利润率机会。Aledade
              也许不能直接比较——其模型看起来更与节余挂钩，且现在更多由债务支持——但这份文件证明，只要执行到位，这个品类可以产生有意义的规模、盈利能力和流动性。


              这个基准两面切。Aledade 受益于正向外推信号：医生赋能可以盈利。但相较这个上市基准，Aledade 也更不透明，融资强度可能更高，因为投资者仍看不到经审计 Aledade 报表、披露利润率和清晰债务背景。
