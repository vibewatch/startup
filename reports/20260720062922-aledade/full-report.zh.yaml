chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、阶段与运营规模
        blocks:
          - type: paragraph
            body: >-
              看
              Aledade，不能把它当成支付方、诊所并购平台或医疗系统所有者；它更像一个由医生主导的价值基层医疗赋能平台。其官网描述的模式，是帮助独立诊所和社区健康中心保持自主，同时用技术、分析、照护管理支持和支付方签约，把更多经济收益通过价值医疗留在自己手里。2026
              年披露的规模进一步强化这一身份：超过 3,000 个基层医疗合作伙伴、超过 300 万名患者，业务覆盖 46 个州及哥伦比亚特区。公开材料还显示，公司的使命长期一致：Aledade 2014 年成立，总部仍在
              Bethesda，并以公益公司自居，用患者结果和诊所可持续性共同衡量表现。后文可复用的结论是：Aledade 已是后期、全国性、面向独立基层医疗的基础设施公司，在 MSSP 内拥有可观份额，并且在非
              Medicare 业务线上的重要性也在扩大。
