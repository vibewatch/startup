      - number: '3.5'
        title: 负面证据抬高了“独立优先”模型的门槛
        blocks:
          - type: paragraph
            body: >-
              本章最主要的负面证据是结构性的，不是丑闻驱动。相较独立优先的伙伴模式，诊所所有者和大型支付方可以打包更多资本、更紧照护控制和更广相邻服务。如果买方越来越偏好垂直整合或单一企业级供应商，Aledade
              的切入口会变窄。第二个负面信号是信息层面的：公开页面很少披露真实价格、留存或赢单率，因此渠道可及性和买方信任可能主导竞争决策，而外部很难观察。


              这并不说明 Aledade 弱。它说明品类领导本身还不够。公司仍需把医生自主权、签约深度和运营经验转化为买方在续约时能感受到的护城河。保留下来的公开证据支持一个判断：相较规模更小、软件更重的对手，Aledade
              拥有可信的直接同行优势；但证据也显示，买方可以通过支付方自有工具、诊所所有权、内部自建或更广平台供应商解决同一件事。


              底线是，Aledade
              在伙伴赋能这条赛道内看起来竞争位置不错，但这条赛道只是更大价值基层医疗战场的一部分。如果公司持续扩展分发和证据，这一点具备投资性；如果资本或控制力更强的竞争者继续压缩“赋能”和“自有照护交付”之间的区别，耐久性就会下降。
