- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Cash balance and monthly burn
    - Cannot judge runway or true dependence on debt
    - Request audited financial statements or monthly management accounts
  - - Debt covenants and interest cost
    - Cannot assess downside risk from the Ares facility
    - Obtain credit agreement and lender summary
  - - Revenue mix by program and stream
    - Cannot tell how recurring vs settlement-driven the business really is
    - Request revenue bridge by MSSP, MA, Medicaid, commercial, PMPM, and other services
  - - Gross margin by stream
    - Cannot judge operating leverage or service intensity
    - Request contribution-margin analysis and staffing cost allocation
  - - Take rate on shared savings / distributions
    - Cannot connect practice outcomes to company economics
    - Request contract waterfall examples
  - - Payer concentration and renewal exposure
    - Cannot assess diversification or bargaining power
    - Request top-ten payer / contract concentration schedule
  notes: These are not cosmetic missing fields; each one changes whether Aledade should be valued as a high-quality compounding platform or a more fragile services-heavy operator.
