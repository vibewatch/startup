  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: leverage-covenants
    missingEvidence: Net leverage, borrowing cost, amortization schedule, and covenant package for the Ares facility.
    whyItMatters: Debt can change downside risk materially even when revenue is growing and working-capital uses sound operationally justified.
    diligencePath: Request the credit agreement, lender deck, or management covenant summary.
    relatedQuestionRefs:
    - QI015
  - type: private-evidence-only
    severity: material
    topic: burn-and-runway
    missingEvidence: Cash balance, monthly burn or cash generation, and runway under current plan.
    whyItMatters: Without cash and burn, outside investors cannot judge whether the debt facility is optional flexibility or a necessary lifeline.
    diligencePath: Obtain audited statements or management financial package with cash flow statement detail.
    relatedQuestionRefs:
    - QI016
  - type: private-evidence-only
    severity: material
    topic: payer-concentration
    missingEvidence: Revenue concentration by payer, contract line, and top partner relationship.
    whyItMatters: Financial durability depends on whether any one payer, program, or contract family drives a disproportionate share of economics.
    diligencePath: Request top-ten payer and contract concentration tables from finance.
    relatedQuestionRefs:
    - QI019
  - type: private-evidence-only
    severity: material
    topic: take-rate
    missingEvidence: Aledade's realized share of shared savings, PMPM support fees, and ancillary service revenue by contract type.
    whyItMatters: This is the missing link between practice savings and company-level revenue or margin.
    diligencePath: Request contract economics or cohort-level unit-economics bridges.
    relatedQuestionRefs:
    - QI024
  - type: missing-source
    severity: minor
    topic: public-gaap-opacity
    missingEvidence: Aledade-published audited GAAP statements or formal investor materials comparable to public-company filings.
    whyItMatters: Current public evidence is selective and forces underwriting to lean on management-chosen metrics.
    diligencePath: Ask management whether lender or prospective-investor materials can be shared under NDA.
    relatedQuestionRefs:
    - QI015
    - QI016
    - QI024
