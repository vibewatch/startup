- id: financial-verdict-and-diligence-blockers
  title: 'Financial verdict: real scale, improving quality, but still too much opacity for clean underwriting'
  body: 'The strongest positive financial evidence is that Aledade has already reached real operating scale, has at least one strong third-party revenue/profitability marker for 2025, and continues to attract both equity and debt capital. The strongest negative evidence is that the company remains private and selective in what it discloses, while the addition of a very large working-capital facility proves that cash timing and financing coordination are central to the model. Taken together, the public evidence supports a view of Aledade as a scaled, increasingly credible value-based-care platform with improving revenue quality—but not as a business that can yet be underwritten with the precision of a public comp.


    The main diligence blockers are straightforward. Investors need audited financial statements, cash and burn, debt terms, line-of-business mix, and a contract-level unit-economics bridge that explains how savings, PMPM support, and service costs translate into company-level gross profit and EBITDA. They also need concentration data by payer and contract family. Without those, even a favorable high-level verdict must stay qualified.


    The final financial conclusion is therefore positive but cautious. Aledade looks better than a speculative story because the company has disclosed real revenue, real savings, and real financing depth. It still falls short of full underwriteability because margins, leverage, and true recurring economics remain mostly private.'
