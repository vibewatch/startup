  - CR024
  columns:
  - failure mode
  - why now
  - severity
  - mitigation maturity
  - residual exposure
  - diligence ask
  rows:
  - - AI note accuracy or compliance failure
    - Grow is rolling AI documentation across therapists and prescribers in 2026
    - High
    - Medium
    - Provider review is required, but public error-rate, override, and audit data are absent
    - Request AI quality dashboards, payer audit outcomes, and clinician override statistics by note type
  - - PHI ransomware or cyber breach
    - HHS OCR is actively settling healthcare ransomware cases and updating the Security Rule
    - Critical
    - Low-Medium
    - Grow centralizes scheduling, notes, billing, and identity data but has not publicly shown external security-governance evidence
    - Request security audits, incident history, tabletop results, and vendor-risk controls
  - - Documentation gating prevents invoice submission
    - Grow now requires notes on every invoice and EHR use for newer therapists
    - Medium-High
    - Medium
    - The control helps compliance but can also create billing bottlenecks when workflow or product issues arise
    - Request note-completion lag, invoice rejection rates, and provider churn tied to documentation friction
  - - Claim or payout delays from bad insurance data
    - Grow guarantees insurance payouts but says missing or incorrect data frequently delays processing
    - Medium
    - Medium
    - The platform still depends on clean eligibility, claim edits, and follow-up operations
    - Request aging buckets, denial rates, and top operational reasons for payment delay
  - - Human escalation quality on legal or ethical edge cases
    - Provider-review synthesis points to weak support on subpoenas and compliance questions
    - Medium
    - Low
    - Marketplace support failure can become a patient-safety or licensure issue for clinicians
    - Review escalation policies, SLA targets, and examples of complex-provider support tickets
  - - Automated cancellations or referral volatility
    - Public provider complaints describe payment-triggered cancellations and inconsistent referral flow
    - Medium
    - Low-Medium
    - Continuity-of-care and clinician trust can deteriorate if automation behaves unpredictably
    - Request cancellation logic, manual-override controls, and referral retention metrics by cohort
