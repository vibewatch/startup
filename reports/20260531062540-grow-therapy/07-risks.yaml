    - A fast-scaling network business can become bottlenecked around a small leadership core
    - Public materials still center heavily on Jake Cooper, Alan Ni, and the newly added CFO
    - Medium
    - High
    - Request full executive bench, succession plans, and delegated operating owners by growth initiative
  - - Finance-bench maturation only in 2026
    - Late institutionalization of finance raises planning and control risk at premium valuation
    - CFO role was newly created in April 2026
