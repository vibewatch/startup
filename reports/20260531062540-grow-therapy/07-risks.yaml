  columns:
  - risk
  - rule or case
  - likelihood
  - severity
  - current evidence
  - residual exposure
  rows:
  - - Parity-driven payer repricing or utilization tightening
    - MHPAEA statutory obligations remain while 2024 rule reconsideration proceeds
    - Medium-High
    - High
    - DOL paused enforcement of new 2024-rule portions, but Grow still operates inside denied-claim, medical-necessity, and parity-sensitive workflows
    - A payer response that narrows behavioral-health economics can break continuity and compress revenue at the same time
  - - Privacy or ad-tech enforcement
    - HIPAA obligations plus FTC BetterHelp precedent
    - Medium
    - High
    - Grow’s privacy notice still includes advertising and third-party data-sharing language for non-HIPAA site data; FTC already established mental-health enforcement precedent
    - Even compliant intent can be scrutinized if data flows, disclosures, or consent boundaries are weak
  - - Controlled-substance telemedicine rule reset
    - DEA/HHS temporary extension through 2026
    - Medium
    - High
    - Medication-management flexibilities remain temporary rather than permanent
    - Prescriber growth strategy can be disrupted by rule changes or tighter special-registration requirements
  - - Multi-state licensure and credentialing fragmentation
    - State licensure, payor-specific credentialing, and product availability by state
    - High
    - Medium-High
    - Grow’s rate tools and terms are explicitly state- and license-dependent
    - Scaling nationally still requires state-by-state operational upkeep
  - - Accessibility or digital-consumer litigation
    - Linda Slade v. Grow Care, Inc.
    - Low-Medium
    - Medium
    - A public accessibility complaint already exists against growtherapy.com
    - Even small consumer-facing legal matters can create remediation cost and distract product/compliance teams
  - - Administrative-services boundary challenge
    - Grow legal structure versus affiliated clinical groups
    - Low-Medium
    - Medium
    - Grow frames itself as non-clinical, but still sits inside documentation, contracting, scheduling, and payment workflows
    - A bad fact pattern could still pull the administrative layer into disputes over clinical, privacy, or billing responsibility
- id: TR002
  title: Operational / quality / security risk register
  notes: Severity and mitigation-maturity calls combine company workflow disclosures with public enforcement signals and provider-review synthesis; Grow has not disclosed incident rates, audit outcomes, or public security certifications.
  claimRefs:
  - CR011
  - CR012
  - CR013
  - CR016
