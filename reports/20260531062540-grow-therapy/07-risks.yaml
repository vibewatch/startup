  evidenceGaps:
  - type: missing-source
    severity: material
    topic: security-governance-gap
    missingEvidence: Public proof of SOC 2, ISO 27001, penetration-testing cadence, or a historical incident log for Grow.
    whyItMatters: Without external security-governance evidence, the diligence team cannot separate a mature PHI security program from a minimally disclosed one.
    diligencePath: Request a security diligence packet, most recent risk assessment, vendor-security architecture, and any third-party audit summaries.
    relatedQuestionRefs:
    - QR014
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: material
    topic: ai-validation
    missingEvidence: External validation metrics for AI-note accuracy, override rates, billing denial rates, and clinical quality review outcomes.
    whyItMatters: The company discloses workflow and pilot scale but not the operating metrics that would show whether AI documentation risk is shrinking or compounding.
    diligencePath: Ask for post-launch AI quality dashboards by note type, audit findings, and any insurer or compliance feedback tied to AI-generated documentation.
    relatedQuestionRefs:
    - QR017
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: payer-concentration
    missingEvidence: Top-payer revenue mix, renewal calendar, repricing protections, and rate-floor terms by plan or state.
    whyItMatters: The largest revenue and continuity risk in Grow’s model sits in payer behavior, yet public evidence does not show how concentrated or contractually protected the platform really is.
    diligencePath: Request payer concentration by revenue and sessions, contract renewal windows, repricing clauses, and any recent payer negotiations or rate reductions.
    relatedQuestionRefs:
    - QR001
    - QR003
    - QR025
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: valuation-quality
    missingEvidence: Audited definition of the cited $1 billion revenue figure plus gross margin, burn, cash, and runway data.
    whyItMatters: A private-company valuation can look conservative or stretched depending on whether the reported revenue is net revenue, throughput, or another KPI.
    diligencePath: Request audited or investor-grade financial statements, revenue-recognition policy, gross-to-net bridge, and 2026 budget versus actuals.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR004
  - type: missing-source
    severity: minor
    topic: legal-disputes
    missingEvidence: Underlying complaint detail and current posture for Grow litigation beyond the publicly visible accessibility docket summary.
    whyItMatters: Known public disputes show legal surface area, but the absence of detailed pleadings limits severity calibration for broader litigation exposure.
    diligencePath: Pull PACER or state-court complaints, defense filings, settlement terms if any, and internal remediation timelines for accessibility or privacy claims.
    relatedQuestionRefs:
    - QR008
    relatedTableRefs:
    - TR001
