- id: TR001
  title: Regulatory / legal risk register
  notes: Rows are severity-ranked public risk calls derived from Grow legal materials, DOL/HHS/DEA/FTC sources, and public litigation evidence; the company has not disclosed an internal regulatory risk register.
  enumerationScope:
    coverage: exhaustive
    basis: Material public regulatory and legal risks visible for Grow Therapy as of the 2026-05-31 run date across reimbursement, parity, telehealth, privacy, documentation, and public litigation.
