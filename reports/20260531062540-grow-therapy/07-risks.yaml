  - - Post-acquisition integration drag
    - Small tuck-ins can still absorb leadership and product attention
    - Behavioral Health Business cited neosync and Tenor Therapy acquisitions in 2025-2026
    - Medium
    - Medium
    - Review integration scorecards, codebase integration status, and whether acquired teams remain in seat
  - - Valuation and disclosure mismatch
    - A $3B valuation with limited public financial definition raises follow-on financing sensitivity
    - Public revenue commentary is broad, but audited definitions and margins are undisclosed
    - Medium
    - High
    - Request audited financial package, revenue-recognition detail, and downside operating plan
- id: TR005
  title: Mitigation and kill criteria table
  notes: Triggers and thresholds are analyst-designed monitoring markers grounded in public risk evidence; they are not company guidance and should be validated against diligence-room data before being used in an IC memo.
  claimRefs:
  - CR041
  - CR042
  - CR043
  - CR044
  - CR045
  - CR046
  - CR047
  - CR048
  columns:
  - risk
  - monitorable trigger
  - threshold or event
  - action implication
  rows:
  - - Payer repricing / continuity break
    - Network or reimbursement deterioration
    - Loss of a marquee payer relationship, or a repricing event that materially lowers provider payouts or breaks employer-to-insurance continuity in core markets
    - Pause underwriting or re-cut growth assumptions because Grow’s differentiator weakens at the same time supply economics do
  - - AI documentation compliance failure
    - Audit or complaint evidence
    - Meaningful payer recoupment, insurer remediation demand, or regulator inquiry tied to AI-generated notes or summaries
    - Escalate to product-compliance diligence immediately and treat AI expansion as a risk multiplier rather than a margin lever
  - - Privacy / cyber incident
    - Reportable breach or OCR action
    - A material PHI incident that triggers public notification, OCR complaint activity, or employer/payer remediation demands
    - Move risk rating up sharply because trust, compliance cost, and sales friction would compound simultaneously
  - - Provider-supply degradation
    - Network health deterioration
    - Sustained evidence that wait times rise, referral fill rates drop, or clinician complaints about cancellations, payouts, or support intensify
    - Assume weaker retention and slower revenue conversion until operational data prove otherwise
  - - Execution / funding miss
    - Capital-market or disclosure slippage
    - Follow-on financing below the prior valuation, or inability to explain the revenue basis behind the public $1B figure with investor-grade reporting
    - Treat valuation as stretched and require much tighter price discipline or deeper diligence
  - - Legal / accessibility / consumer-protection spillover
    - Pattern of new disputes
    - Multiple public legal actions or remediation orders around accessibility, privacy disclosures, or customer-facing workflow practices
    - Reassess compliance leadership, customer-ops controls, and whether legal surface area is scaling faster than governance maturity
