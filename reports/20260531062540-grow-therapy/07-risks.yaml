- id: mitigants-kill-criteria
  title: Mitigants, monitoring, and thesis-break criteria
  body: 'Grow is not unprotected. Public disclosures show several real mitigants: AI documentation is optional and clinician-reviewed, transcripts are not retained long-term, insurance payouts are guaranteed even if Grow later has to chase collection, and the employer product explicitly tries to reduce churn by keeping patients with the same provider when coverage can move onto insurance. The newly created CFO role is another practical mitigation because it adds financial process discipline at the same moment the company is widening its commercial scope.


    Still, none of those controls eliminate the core risk stack. Investor monitoring should stay focused on a handful of transmission channels: payer repricing that compresses provider economics, documentation or AI errors that show up in audits or complaints, privacy or ransomware events that trigger OCR or customer distrust, and competitive consolidation that raises the cost of winning employers, payers, and clinicians. The right framing for Grow is therefore not “high demand equals low risk.” The right framing is “high demand, but only if continuity, compliance, and provider trust remain intact under scale.”


    The kill criteria should be explicit. If Grow loses meaningful payer breadth, suffers a reportable privacy event, or cannot substantiate revenue quality and operating discipline against its valuation, the current bull case weakens quickly because the company’s differentiation rests on being a trusted, insurer-integrated operating layer rather than just another therapist directory.'
