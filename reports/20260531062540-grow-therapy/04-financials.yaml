- id: gaps-risks
  title: Diligence Blockers & Adverse Signals
  body: |-
    The biggest blocker is not demand; it is disclosure quality. Public evidence does not provide audited financial statements, a revenue-recognition memo, channel mix, gross margin, CAC, LTV, payer concentration, claims-denial rates, or cash-runway detail. That means even a seemingly modest 3x valuation-to-revenue frame is only valid under one interpretation of the revenue claim and could be badly misleading under another. The capital story is likewise incomplete because the newest round is not matched by a visible 2026 Form D in the sourced SEC history.

    The adverse surface is real, if still limited. Grow Care faced an accessibility lawsuit in 2023. The company also maintains a dispute workflow for unexpected charges and insurer-coverage disagreements, indicating billing friction is a live operational issue. An independent provider-review synthesis reports auto-cancellations, billing-ID confusion, inconsistent support, and referral volatility; those claims are low-confidence compared with filings, but they are directionally relevant because insurer-backed marketplaces depend on supply trust. Finally, public-comp filings from Talkspace show that reimbursement pressure and payer cost-cutting remain a genuine risk across insurance-linked behavioral-health models. Until management closes these data gaps under NDA, Grow's financial chapter remains investable only as a diligence continuation, not as a complete underwriting file.
