- id: revenue-pricing
  title: Revenue Model & Pricing Architecture
  body: |-
    Grow publicly positions itself as a three-sided infrastructure platform for patients, providers, and payors. The company bundles therapist matching, credentialing, billing, claims support, EHR, telehealth, and care-navigation workflows into a single operating model. On the consumer side, Grow says insured clients pay $21 on average per visit and that one in three pay nothing out of pocket; if insurance is unavailable, clients can choose cash. On the employer side, Grow explicitly says it charges for care delivered rather than taking a flat fee for every covered employee, which points to utilization-linked monetization rather than classic SaaS seat pricing.

    Those disclosures imply that Grow's revenue quality is more tightly tied to actual delivered care than to signed-but-unused capacity. That is a positive underwriting signal. The caveat is recognition ambiguity: the company has not published audited statements or a public memo that defines whether public revenue language reflects GAAP net revenue, gross claims throughput, or another KPI. That ambiguity matters because the same operating facts can support very different valuation conclusions depending on whether Grow is acting economically as a net-revenue intermediary or as a gross-billings organizer around provider care.
