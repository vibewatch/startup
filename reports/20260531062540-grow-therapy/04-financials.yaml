  evidenceGaps:
  - type: missing-source
    severity: material
    topic: series-d-filing
    missingEvidence: A 2026 Form D, cap table, or board-approved financing memo confirming exact legal entities, share count, and proceeds allocation for the Series D.
    whyItMatters: Without a public filing or equivalent primary document, the 2026 financing cannot be reconciled to SEC evidence the way earlier rounds can.
    diligencePath: Request the executed 2026 financing documents, board consents, and any filed or draft Form D materials from counsel.
    relatedQuestionRefs:
    - QI003
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: blocking
    topic: revenue-definition
    missingEvidence: Audited 2025 income statement and a finance memo defining whether the reported $1 billion figure is GAAP net revenue, gross claims throughput, or another internal KPI.
    whyItMatters: Valuation, gross margin, and revenue-quality conclusions change materially depending on whether the cited figure is net revenue or pass-through volume.
    diligencePath: Obtain audited 2025 financial statements plus the revenue-recognition policy and a reconciliation from management KPI revenue to GAAP revenue.
    relatedQuestionRefs:
    - QI009
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Provider payout rate, gross-margin waterfall, claims-denial rate, refund/chargeback rate, CAC, LTV, payback period, and cohort retention by payer and employer channel.
    whyItMatters: The public evidence is enough to frame scenarios, but not enough to underwrite sustainable contribution margin or sales efficiency.
    diligencePath: Request channel-level unit-economics cohorts, claims operations KPIs, and provider payout schedules for the last eight quarters.
    relatedQuestionRefs:
    - QI012
    - QI013
    - QI022
    - QI025
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Cash balance, monthly burn, working-capital dynamics, and any debt or covenant schedule.
    whyItMatters: Capital adequacy cannot be judged from total raised alone; investors need to know current liquidity and burn-to-growth efficiency.
    diligencePath: Request the latest monthly board package, cash bridge, runway model, and debt schedule.
    relatedQuestionRefs:
    - QI017
    - QI018
    - QI025
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: payer-employer-concentration
    missingEvidence: Top payer concentration, reimbursement by line of business, employer contract terms, implementation costs, and renewal/retention metrics.
    whyItMatters: A concentrated reimbursement base or low-utilization employer rollouts could compress margins even if top-line visit growth looks strong.
    diligencePath: Request top-10 payer and employer cohort analyses, contract summaries, and implementation-to-utilization conversion data.
    relatedQuestionRefs:
    - QI005
    - QI006
    - QI021
    - QI025
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: material
    topic: billing-friction
    missingEvidence: Internal dispute, refund, support-ticket, and provider churn data that quantify whether publicly visible complaints are isolated or systemic.
    whyItMatters: Supply-side dissatisfaction or elevated dispute rates can erode provider retention and reduce realized revenue quality.
    diligencePath: Request monthly support, dispute, and provider churn dashboards segmented by root cause and channel.
    relatedQuestionRefs:
    - QI022
    - QI025
    relatedTableRefs:
    - TI005
