    - No public evidence of a separate provider subscription fee; bundled support is emphasized instead
    - Appears bundled into overall economics
    - Any admin fee, service fee, or revenue-share schedule is private
    - Provider page
    - Grow looks less like seat-based SaaS and more like a reimbursement intermediary
