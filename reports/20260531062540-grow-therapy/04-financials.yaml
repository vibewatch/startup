- id: unit-economics
  title: Unit Economics Proxies & Public Comparable Benchmarks
  body: |-
    Public disclosure is sufficient to build only a top-down scenario, not a true unit-economic model. Using the company-spokesperson revenue statement of about $1 billion and Grow's disclosed seven million visits in 2025 implies roughly $143 of revenue per visit. Combined with the official $21 average client payment, that suggests payer or employer funding likely contributes roughly $122 per visit on average. That arithmetic is informative, but it is not definitive because the company has not defined what the $1 billion figure actually measures. If it is net revenue, the March 2026 valuation implies about 3x revenue. If it is gross claims throughput, the effective net multiple would be materially higher.

    Public comps help frame the range. Talkspace's payer-heavy model produced roughly 41-43% direct gross margin in 2025 through Q1 2026 and disclosed explicit session-based payer recognition plus PMPM/PPU enterprise contracts. Teladoc's BetterHelp shows the other end of the spectrum: large direct-to-consumer revenue, but heavy advertising intensity and declining paying users. Relative to those comparables, Grow looks structurally closer to a reimbursement and access facilitator than to a subscription or cash-pay mental-health app, but the actual take rate, provider payout ratio, and claims-denial economics remain private.
