- id: TI005
  title: Public Financial Gaps Table
  columns:
  - missing_private_metric
  - impact_on_underwriting
  - exact_diligence_path
  rows:
  - - Audited 2025 financial statements and revenue-recognition memo
    - Without this, the $1B figure cannot be mapped to GAAP revenue or valuation quality
    - Request audited 2025 statements, controller memo, and KPI-to-GAAP bridge
  - - Gross-margin and provider-payout waterfall
    - Impossible to judge contribution margin or operating leverage
    - Request gross margin by channel plus provider payout schedules and claims ops cost
  - - Cash, burn, runway, and working-capital bridge
    - Capital adequacy cannot be underwritten from total raised alone
    - Request latest board deck, monthly cash bridge, and 12-month operating plan
  - - Payer concentration and reimbursement by line of business
    - A concentrated payer base could hide pricing pressure and renewal risk
    - Request top-10 payer revenue share, reimbursement trends, and denial/write-off rates
  - - Employer and health-system contract economics
    - The 2026 expansion story cannot be modeled without contract shape and implementation cost
    - Request contract summaries, PMPM versus utilization mix, renewal terms, and go-live conversion
  - - Support, dispute, and provider-churn metrics
    - Anecdotal billing friction cannot be sized without internal operational data
    - Request monthly dispute volume, refund rates, provider churn, and root-cause analyses
  - - Claims-denial, refund, and bad-debt rates
    - Revenue quality can be overstated if realized collections differ materially from billed claims
    - Request historical collections cohorts, denial reasons, and refund/chargeback dashboards
  notes: Each gap is specific enough to route directly into a diligence request list. These are not optional polish items; they are the minimum data needed to convert public scenario work into an investable model.
