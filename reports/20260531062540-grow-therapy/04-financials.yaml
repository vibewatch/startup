    - Blended insurer payment and cash-pay rates are not disclosed
    - Grow homepage + Series D materials
    - Demand-side affordability appears strong, but payer-funded share dominates economics
  - - Employer contracts
    - Utilization-based pricing; Grow says it charges for care delivered, not a flat fee for all employees
    - Public positioning, not a signed contract term sheet
    - No disclosed PMPM, minimum commitment, or performance rebate schedule
    - Employer page + official Series D release
    - Supports revenue quality if utilization is real, but makes forecasting contract value impossible
  - - Health-plan reimbursement
    - Negotiated in-network economics across 125+ insurer partners
    - Realized reimbursement exists but no rate card is public
    - No average contracted reimbursement or denial rate by payer line
    - Payor page + 2026 coverage materials
    - Top-line volume is visible, but unit economics remain opaque
