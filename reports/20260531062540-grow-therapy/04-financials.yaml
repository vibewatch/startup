- id: TI001
  title: Revenue Streams Table
  columns:
  - stream
  - mechanism
  - unit
  - current_value_status
  - quality
  - diligence_ask
  rows:
  - - Payer-covered therapy and psychiatry visits
    - Grow matches clients, handles credentialing/billing, and participates in reimbursement-linked visit economics through insurer-backed care delivery.
    - visit / reimbursed claim
    - Core disclosed stream; 125+ insurers and 220M covered lives publicized
    - High revenue-quality signal because monetization is tied to delivered care, but net-vs-gross recognition is undisclosed
    - Request GAAP recognition policy, take rate, and provider payout waterfall by line of business
  - - Employer mental-health benefit program
    - Grow says employers can offer EAP-to-insurance continuity and that pricing is utilization-based rather than flat seat fees.
    - care delivered / utilization
    - Newly emphasized in 2026; no public contract counts or PMPM terms
    - Promising if sticky, but currently unproven and potentially implementation-heavy
    - Request signed employer contracts, utilization curves, renewal terms, and sales cycle data
  - - Health-system referral and coordination partnerships
    - Grow integrates with health systems such as Circle Medical to route screened patients into therapy and psychiatry workflows.
    - referred patient / visit
    - Strategic expansion area announced in 2026; economics not public
    - Potentially high-quality referral source, but commercialization model is undisclosed
    - Request partner economics, referral conversion, and implementation cost per health-system launch
  - - Cash-pay and out-of-network sessions
    - Homepage says clients can choose cash when insurance is unavailable; pricing is provider-specific.
    - session
    - Available but not quantified publicly
    - Likely non-core relative to insured visits; no public mix disclosure
    - Request cash-pay mix, average realized price, and contribution margin versus insured sessions
  - - Bundled provider infrastructure
    - Credentialing, claims support, directory marketing, EHR, telehealth, and AI documentation are offered as part of platform participation rather than public standalone software pricing.
    - bundled service layer
    - Visible product layer with no public standalone price card
    - Supports retention and differentiation, but standalone monetization is unconfirmed
    - Request whether any software or admin fees are recognized separately from visit economics
  notes: Official pages show utilization-linked care economics and bundled provider tooling; rows distinguish disclosed streams from plausible but still unpriced extensions, and unknown means no public revenue mix was found.
