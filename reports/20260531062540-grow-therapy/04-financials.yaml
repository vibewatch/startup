company:
  name: Grow Therapy
chapter:
  number: 4
  title: Financials
  letter: I
  summary: Grow Therapy's public financial story is unusually strong on scale but still incomplete on accounting. Official and independent 2026 sources support a $150M Series D, $328M total raised, roughly 26,000 providers, 125-plus insurer partners, 220M covered lives, and seven million visits in 2025; Behavioral Health Business also cited a company spokesperson saying revenue is about $1B, while Reuters-republished coverage put the valuation at $3B. The central underwriting blocker is that Grow has not publicly defined whether that $1B is GAAP net revenue or a broader throughput measure, and it does not disclose cash, burn, gross margin, or payer concentration.
sections:
- id: funding-scale
  title: Funding History & Public Scale
  body: |-
    Grow Therapy reached a new capital milestone in March 2026 with a $150 million Series D. Official company materials and multiple independent reports agree on the round size and on lifetime funding of $328 million, while Reuters-republished coverage places the post-money valuation at roughly $3 billion. Public scale disclosures around the same announcement were unusually strong for a private company: Grow said it has served more than two million people in five years, facilitated seven million visits in 2025, reached ten million lifetime therapy and medication-management appointments, built a 26,000-provider network, and partnered with 125-plus insurers covering roughly 220 million lives.

    The round history behind that headline is directionally clear but numerically messy. Official company narratives describe a $75 million Series B and an $88 million Series C, yet the SEC Form D evidence under Grow Care, Inc. shows lower individual offering amounts in 2022 and 2024. That mismatch does not disprove the announced totals, but it does mean historical financing should be treated as only partially reconciled from public primary sources. Notably, the Grow Care SEC browse page did not show a 2026 Form D as of the run date, so the newest round lacks a public SEC confirmation in this evidence set.
