- id: TI003
  title: Unit Economics Table
  columns:
  - metric
  - value_or_null
  - confidence
  - why_it_matters
  - diligence_ask
  rows:
  - - Company-spokesperson revenue
    - '1000'
    - Medium — single independent report
    - Sets the top line for every public valuation discussion
    - Obtain audited 2025 revenue and GAAP reconciliation for the cited $1B figure
  - - 2025 facilitated visits
    - '7000000'
    - High — repeated in official and media sources
    - Anchors throughput and per-visit arithmetic
    - Confirm whether visit count includes psychiatry, therapy, and no-show-adjusted encounters
  - - Implied revenue per visit
    - '143'
    - Low — arithmetic on a partially undefined revenue metric
    - Shows whether disclosed scale is directionally plausible relative to insurance-funded care
    - Clarify whether revenue is net or gross before using per-visit math in valuation work
  - - Average client paid per visit
    - '21'
    - High — official company disclosure
    - Supports the view that payer dollars fund most of the visit economics
    - Request average insurer reimbursement and employer-funded share per visit
  - - Implied payer or employer funding per visit
    - '122'
    - Low — derived from 143 minus 21
    - Illustrates the likely magnitude of non-member funding if the revenue figure is net
    - Request actual claim-level reimbursement averages by commercial, Medicare, Medicaid, and employer channels
  - - Talkspace direct gross margin proxy
    - 41.5 to 43.0%
    - Medium — public comp filings
    - Provides a public benchmark for payer-linked tele-mental-health delivery before sales and G&A
    - Benchmark Grow against comparable direct cost, not just top-line growth
  - - BetterHelp marketing intensity proxy
    - 116.8M ad spend on 218.4M Q1 2026 revenue
    - Medium — public comp filings
    - Shows how expensive direct-to-consumer mental-health acquisition can be relative to payer-led channels
    - Request Grow sales and marketing by payer, employer, and consumer channel
  - - Gross margin
    - null
    - Unavailable publicly
    - Required to judge contribution margin and scaling economics
    - Request gross margin by payer, employer, and cash-pay channel
  - - CAC / LTV / payback
    - null
    - Unavailable publicly
    - Needed to underwrite enterprise expansion efficiency and marketplace health
    - Request channel-level CAC, payback, provider acquisition cost, and cohort LTV
  notes: Numeric values are public disclosures or simple arithmetic. Null means the metric is not publicly disclosed and must be requested directly from management before underwriting.
