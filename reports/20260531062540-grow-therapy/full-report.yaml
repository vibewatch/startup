    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and business model
        blocks:
          - type: paragraph
            body: >-
              Grow Therapy was founded in October 2020 and is headquartered in New York City, with public location
              evidence pointing to 122 East 42nd Street while the careers page also references hubs in New York, San
              Francisco, and Seattle plus a remote team. The company describes itself as a mental-health platform that
              helps people find in-person or virtual therapy and psychiatric care while also providing the underlying
              administrative stack that lets independent clinicians accept insurance and run their practices. That
              two-sided model is the core of Grow's differentiation: on the consumer side it promises fast matching,
              broad insurance acceptance, and average out-of-pocket cost around $21 per visit; on the provider side it
              handles credentialing, claims, billing, EHR, telehealth, marketing, and care-coordination functions that
              would otherwise sit with small practices. By 2026 the company had widened that model into employer and
              health-system channels, creating a three-sided platform in which payors, employers, and referral partners
              all direct demand into the same provider network.
