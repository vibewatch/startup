  - id: TV005
    title: Thesis-Break and Trigger Table
    columns:
      - trigger
      - threshold_or_event
      - transmission_to_valuation
      - monitoring_signal
      - action_implication
    rows:
      - - Revenue-definition failure
        - >-
          Public or NDA diligence shows the reported $1B metric is materially closer to gross throughput than net
          revenue.
        - The implied multiple rerates sharply upward and current price discipline breaks.
        - Audited financials, KPI bridge, and controller memo.
        - Move from research-more to pass unless price resets materially.
      - - Broad payer repricing
        - Multiple major plans cut reimbursement or at-risk contracts underperform at scale.
        - Margin assumptions compress and public comp set shifts toward Teladoc-like pricing.
        - Renewal outcomes, take-rate data, and claims-denial trends.
        - Increase bear-case weight and require a valuation discount.
      - - Enterprise channel drag
        - Employer or health-system launches require heavy support spend without retention or utilization lift.
        - Strategic-premium argument disappears and growth looks service-heavy.
        - Employer cohort retention, implementation cost, and referral conversion data.
        - Re-underwrite Grow as a lower-multiple care-services company.
      - - Billing or compliance event
        - Complaint volumes, litigation, or privacy issues escalate into a measurable legal or regulatory problem.
        - Exit optionality narrows and public-market appetite for premium pricing falls.
        - Litigation updates, dispute dashboards, and compliance audit findings.
        - Pause investment until legal and operational exposure is quantified.
      - - Opaque late-stage terms
        - >-
          Cap-table review reveals heavy preference overhang, meaningful secondaries, or investor protections that
          cheapen the headline mark.
        - Effective entry economics for new investors are worse than the public valuation suggests.
        - Signed term sheet, pro forma ownership, and waterfall model.
        - Reprice using economic ownership and liquidation value, not headline post-money.
    notes: >-
      These are thesis-break conditions rather than background risks. Any one of them can change the correct valuation
      stance quickly even if demand and topline growth remain strong.
