  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: |2-
                              Grow Therapy's practical market is not “all behavioral health.” It is the narrower U.S. market for outpatient therapy, psychiatry, and medication management that can be routed through insurance and matched through a digital marketplace. The company's public surfaces emphasize insurance-covered therapy, medication support, direct booking, and mixed virtual or in-person care, which makes commercial, Medicare Advantage, Medicaid, and employer-sponsored coverage the relevant spending pools. That boundary matters because broad behavioral-health reports often include inpatient, residential, crisis, SUD-specific, hospital, and app-only revenue that does not map cleanly to Grow's workflow.

                              The status quo substitutes are also narrower than a generic “mental health market” label suggests. The clearest substitute is still cash-pay private practice, where patients buy individual sessions directly and clinicians avoid insurer paperwork. Adjacent but economically different substitutes include subscription teletherapy products, employer-funded EAP sessions, and higher-acuity community or residential programs. Grow competes by promising lower patient out-of-pocket costs, direct insurance verification, and an easier route for independent clinicians to join payor networks. That means included spend is insurance-backed outpatient mental healthcare, while excluded spend is anything that bypasses insurance or requires a substantially different clinical or reimbursement architecture.
                          
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM041
