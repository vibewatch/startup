  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Funding History & Public Scale
        blocks:
          - type: paragraph
            body: >-
              Grow Therapy reached a new capital milestone in March 2026 with a $150 million Series D. Official company
              materials and multiple independent reports agree on the round size and on lifetime funding of $328
              million, while Reuters-republished coverage places the post-money valuation at roughly $3 billion. Public
              scale disclosures around the same announcement were unusually strong for a private company: Grow said it
              has served more than two million people in five years, facilitated seven million visits in 2025, reached
              ten million lifetime therapy and medication-management appointments, built a 26,000-provider network, and
              partnered with 125-plus insurers covering roughly 220 million lives.


              The round history behind that headline is directionally clear but numerically messy. Official company
              narratives describe a $75 million Series B and an $88 million Series C, yet the SEC Form D evidence under
              Grow Care, Inc. shows lower individual offering amounts in 2022 and 2024. That mismatch does not disprove
              the announced totals, but it does mean historical financing should be treated as only partially reconciled
              from public primary sources. Notably, the Grow Care SEC browse page did not show a 2026 Form D as of the
              run date, so the newest round lacks a public SEC confirmation in this evidence set.
