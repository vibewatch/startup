        title: Provider acquisition engine and named customer proof
        blocks:
          - type: paragraph
            body: >-
              Grow’s customer story depends on continuously adding supply, because payer, employer, and health-system
              relationships only work if patients can actually find an in-network clinician quickly. The public provider
              pitch is therefore unusually detailed: Grow promises credentialing and payor enrollment, billing and
              claims support, EHR and telehealth tooling, weekly payment, free CE, clinical consultation, peer
              community, and distribution help through its own directory plus channels such as employer pathways and
              Zocdoc. Independent partner evidence from Verifiable reinforces that this is not just marketing copy: the
              credentialing case study says turnaround times fell from 60 to 120 days into under 30 days, with most
              providers approved within two weeks even while the company was onboarding more than 1,000 providers per
              month.


              Named customer and partner proof is real but still concentrated. Kaiser Permanente publicly directs
              members to Grow for in-network therapy within two days. Fierce Healthcare and official Grow materials
              identify Circle Medical as the first explicit health-system-style referral workflow, while Zocdoc publicly
              describes a booking integration for participating Grow clinicians. Those examples prove production
              relationships across payer, referral, and channel surfaces, but they also highlight a reference-quality
              constraint: the employer motion is heavily described and apparently strategic, yet this run did not
              surface public named employer customers or renewal data. That makes the proof set materially thinner than
