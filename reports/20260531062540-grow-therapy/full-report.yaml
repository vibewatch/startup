  - id: TV002
    title: Thesis / Anti-Thesis Table
    columns:
      - side
      - claim
      - supporting evidence
      - valuation implication
      - what would disprove it
    rows:
      - - Thesis
        - >-
          Grow has already reached real insurer-backed scale with 26,000 providers, 125-plus plans, and seven million
          2025 visits.
        - >-
          Official company pages, Reuters, and trade coverage repeat the same scale metrics with only minor wording
          variation.
        - Scale supports a strategic-infrastructure framing rather than a niche directory framing.
        - >-
          If those scale metrics are not stable cohorts or if they include low-quality activity, the premium narrative
          weakens.
      - - Thesis
        - Employer and health-system expansion broadens Grow beyond a single-channel therapist marketplace.
        - >-
          Official March 2026 materials, Fierce, and HLTH coverage all describe employer continuity and newer health-
          system or referral integrations.
        - Multi-entry-point access can justify higher retention and a larger terminal value if margins hold.
        - If enterprise implementations prove service-heavy or low-utilization, the expansion story stops adding value.
      - - Thesis
        - If the $1B metric is substantially net revenue, Grow's reported 2026 mark is only about 3.0x revenue.
        - The multiple follows directly from the reported $3B valuation and company-spokesperson revenue figure.
        - That puts Grow near the public takeout band instead of at a peak-cycle private premium.
        - The thesis fails if the $1B figure is gross claims throughput or otherwise not comparable to revenue.
      - - Anti-thesis
        - The revenue-definition gap is material enough that the headline multiple may be false precision.
        - No public source provides a GAAP bridge, take rate, or gross-to-net explanation for the $1B figure.
        - Hidden revenue-quality weakness could move the effective multiple from acceptable to expensive.
        - Audited statements and a KPI-to-GAAP memo would directly settle the issue.
      - - Anti-thesis
        - Reimbursement pressure is a demonstrated category risk for insurer-linked mental-health platforms.
        - >-
          Optum cut therapist rates on Alma and Headway in late 2024, showing how payer repricing can hit platform
          economics quickly.
        - A similar move against Grow would compress margin and force a lower multiple.
        - Grow needs to show diversified payer exposure and resilient renewal economics.
      - - Anti-thesis
        - Late-stage term opacity and public billing-friction signals reduce downside protection.
        - >-
          The 2026 Form D is missing from SEC browse results, and Grow also has BBB complaints and public litigation
          signals.
        - Investors may not actually be buying the headline valuation, and operational friction can cap premium exits.
        - Signed round documents, dispute metrics, and litigation detail would reduce this risk.
    notes: >-
      The thesis wins only conditionally. All three thesis rows can coexist with a fair current valuation, but each one
      depends on evidence that is still partly private or only company-defined.
