      - number: '2.5'
        title: Adoption Constraints, Contradictory Estimates, and Diligence Gaps
        blocks:
          - type: paragraph
            body: |2-
                              The same forces that create demand also cap adoption. HRSA says 137 million people live in mental-health shortage areas and that average behavioral-health waits run 48 days, while AAMC documents that more than half of U.S. counties have no practicing psychiatrists. Coverage also does not guarantee usable access: KFF documents weak psychiatrist network density, and AAMC points to meaningful out-of-network leakage in behavioral-health office visits. For Medicaid specifically, reimbursement remains a structural bottleneck because behavioral-health provider participation is weaker than in commercial or Medicare coverage and many states are slowing provider-rate increases. These constraints matter directly to Grow because its supply model depends on clinicians joining and staying in insurer networks.

                              The market-definition problem is the second major constraint. Broad public reports are internally consistent enough to prove that behavioral health is a large category, but not precise enough to isolate Grow's exact SAM. Even Grow's own public metrics—covered lives, clinicians, annual visits, and employer outcomes—stop short of disclosing therapy-versus-psychiatry mix, payer mix, take rate, or economics by line of business. That means a diligence team can conclude that the category is large, growing, and structurally supported, while also recognizing that precise valuation work still requires non-public claims, reimbursement, and cohort data. The contradiction is not that the market is small; it is that the public record is too coarse to size Grow's most investable slice with high precision.
                          
