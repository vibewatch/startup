              billing-identifier confusion. Those reports are lower-confidence than filings or regulator actions, but
              they are directionally important because Grow’s marketplace must retain clinician trust at the same time
              it expands payer and employer demand.


              Concentration risk is harder to measure than friction risk because disclosure is sparse. Fierce reports
              that payers are still Grow’s biggest partner, that the company works with 25 Medicaid plans, and that only
