  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      How Grow’s biggest risk channels flow into provider supply, patient continuity, revenue quality, and valuation
      support.
    approximationNotes: >-
      The map shows analyst-inferred causal links from disclosed business mechanics; it is not a management-approved
      process diagram.
    claimRefs:
      - CR021
      - CR022
      - CR024
      - CR025
      - CR026
      - CR045
      - CR048
    data:
      nodes:
        - id: N1
          label: Parity or payer repricing
          description: Plans tighten reimbursement, medical-necessity rules, or network behavior faster than Grow can offset.
        - id: N2
          label: Provider payout pressure
          description: >-
            Lower reimbursement quality or slower clean claims reduce the attractiveness of Grow economics for
            clinicians.
        - id: N3
          label: Network continuity erosion
          description: Provider availability or continuity breaks weaken the employer-to-insurance handoff promise.
        - id: N4
          label: Employer and payer trust loss
          description: Continuity failures, audit issues, or service friction make Grow less differentiated in buyer conversations.
        - id: N5
          label: Revenue quality pressure
          description: Visit volume, take-rate quality, and conversion assumptions all weaken at once.
        - id: N6
          label: Valuation compression risk
          description: A premium private valuation becomes harder to defend without clean revenue quality and operating proof.
      edges:
        - from: N1
          to: N2
          label: Repricing changes provider economics
        - from: N2
          to: N3
          label: Lower attractiveness reduces supply density or continuity
        - from: N3
          to: N4
          label: Buyer promise weakens when continuity breaks
        - from: N4
          to: N5
          label: Lower trust slows utilization and sales conversion
        - from: N5
          to: N6
          label: Softer quality of growth pressures multiple support
        - from: N1
          to: N5
          label: Reimbursement quality hits revenue directly
        - from: N3
          to: N5
          label: Lower provider availability cuts visit throughput
  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: >-
      The main partner and system dependencies that have to hold for Grow’s insurer-integrated marketplace to work at
      scale.
    approximationNotes: >-
      Dependencies are inferred from public product, legal, and partner disclosures; internal architecture and contract
      detail are not public.
    claimRefs:
      - CR006
      - CR008
      - CR019
      - CR021
      - CR030
      - CR039
      - CR040
    data:
      nodes:
        - id: D1
          label: Payer contracts and reimbursement rules
          description: Health-plan coverage, rate sheets, credentialing, and claims policies.
        - id: D2
          label: State licensure and credentialing
          description: Provider licensure footprint and state-specific operational eligibility.
        - id: D3
          label: Grow EHR and AI note stack
          description: Documentation workflows now attached directly to invoice submission.
        - id: D4
          label: HIPAA and security controls
          description: Privacy, cybersecurity, and OCR-sensitive PHI safeguards across the platform.
        - id: D5
          label: Employer and health-system partners
          description: Buyer and referral channels that depend on continuity and coordination.
        - id: D6
          label: Grow platform core
          description: Provider marketplace, scheduling, documentation, claims support, and continuity layer.
      edges:
        - from: D1
          to: D6
          label: Coverage and payment rules govern core economics
        - from: D2
          to: D6
          label: Supply density depends on who can legally practice where
        - from: D3
          to: D6
          label: Billing and compliance now depend on documentation tooling
        - from: D4
          to: D6
          label: PHI workflows require security and privacy integrity
        - from: D5
          to: D6
          label: Growth channels rely on referral and continuity success
        - from: D1
          to: D5
          label: Employer continuity promise depends on plan alignment
  - id: FV001
    title: Recommendation Logic
    type: flow
    layout: wide
    summary: >-
      Price-sensitive decision flow linking scale proof, revenue-definition ambiguity, comp frame, and downside risks to
      a research-more recommendation.
    data:
      nodes:
        - id: n1
          label: Scale proof
          value: 26k providers, 125+ plans, 7M 2025 visits, 2M+ people served
        - id: n2
          label: Headline pricing
          value: ~$3B reported mark and ~$1B revenue claim imply ~3.0x if revenue is net
        - id: n3
          label: Comp bracket
          value: Talkspace takeout ~3.6x revenue vs Teladoc ~0.59x EV/revenue
        - id: n4
          label: Opaque risks
          value: No 2026 Form D, unclear cap-table terms, billing friction, reimbursement pressure
        - id: n5
          label: Recommendation
          value: Research more at current mark; move to conditional buy only after revenue and term diligence
      edges:
        - from: n1
          to: n2
          label: Scale supports a real valuation case
        - from: n2
          to: n5
          label: Works only if revenue is comparable net revenue
        - from: n3
          to: n5
          label: Public comps say current mark is plausible but not obviously cheap
        - from: n4
          to: n5
          label: Missing disclosure blocks a clear buy
        - from: n1
          to: n3
          label: Operating scale must outrun comp imperfections
    approximationNotes: >-
      The flow reduces a multi-variable underwriting process to the four public-evidence gates that matter most at the
      current price.
    claimRefs:
      - CV008
      - CV009
      - CV023
      - CV024
      - CV032
      - CV037
      - CV055
  - id: FV002
    title: Valuation Sensitivity to Net-Revenue Interpretation
    type: bar
    layout: standard
    summary: >-
      Implied equity value at a constant 3.0x revenue multiple across alternative net-revenue interpretations of Grow's
      public $1B metric.
    data:
      items:
        - label: If net revenue is $300M
          value: 900
        - label: If net revenue is $500M
          value: 1500
        - label: If net revenue is $750M
          value: 2250
        - label: If net revenue is $1.0B
          value: 3000
        - label: If net revenue is $1.25B
          value: 3750
    approximationNotes: >-
      This figure does not assume different comp multiples; it isolates only the revenue-definition question. Values are
      in $M and use the same 3.0x multiple in every bar.
    claimRefs:
      - CV023
      - CV024
      - CV025
      - CV027
      - CV028
      - CV057
  - id: FV003
    title: Valuation / Return Range
    type: range
    layout: wide
    summary: >-
      Bear, base, and bull valuation ranges around Grow's reported current mark, with assumptions tied to revenue
      definition and channel quality.
    data:
      items:
        - label: Bear case
          low: 1200
          high: 1800
          unit: $M
          confidence: analyst estimate
          description: Revenue definition proves less favorable or reimbursement pressure broadens
        - label: Base case
          low: 2500
          high: 3500
          unit: $M
          confidence: analyst estimate
          description: Reported revenue is mostly net and newer channels are roughly margin-neutral to positive
        - label: Reported current mark
          low: 3000
          high: 3000
          unit: $M
          confidence: reported
          description: Reuters/BHB-reported March 2026 valuation
        - label: Bull case
          low: 4000
          high: 5500
          unit: $M
          confidence: analyst estimate
          description: Enterprise, payer, and health-system execution prove strategic-premium quality
    approximationNotes: >-
      Only the current mark is reported. Bear, base, and bull ranges are scenario constructions using the public comp
      set and unresolved revenue-quality questions.
    claimRefs:
      - CV003
      - CV024
      - CV025
      - CV052
      - CV053
      - CV054
      - CV056
      - CV057
      - CV058
      - CV059
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: Five decision-relevant metrics that summarize Grow's current valuation frame and the comp endpoints around it.
    data:
      items:
        - label: Reported valuation
          value: $3.0B
          note: Reuters and trade press on the March 2026 Series D
        - label: Reported revenue metric
          value: ~$1.0B
          note: Company-spokesperson figure; definition still unverified
        - label: Disclosed network scale
          value: 26k providers / 125+ plans / 220M lives
          note: Official Grow scale disclosures as of 2026
        - label: Closest public M&A anchor
          value: Talkspace ~3.6x
          note: UHS takeout EV of ~$835M on 2025 revenue of $228.9M
        - label: Public downside anchor
          value: Teladoc ~0.59x EV/revenue
          note: MarketScreener May 2026 valuation ratio
    approximationNotes: >-
      KPI panel mixes reported operating facts with public-market reference points. It is intentionally
      valuation-focused, not a company-overview dashboard.
    claimRefs:
      - CV003
      - CV023
      - CV024
      - CV029
      - CV032
      - CV037
      - CV056
