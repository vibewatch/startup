            body: >-
              Grow has become more explicit in 2026 about security and trust controls than many digital-mental-health
              peers, but the public package is still a trust-center summary rather than a deep assurance file. Reviewed
              pages disclose encryption in transit and at rest, role-based access controls, MFA, AWS hosting in the
              United States, annual penetration testing, HIPAA training, BAAs / DPAs, third-party HIPAA assessments, and
              AI processor zero-retention terms. Telehealth and AI consent flows also show concrete product controls:
              sessions are not stored, AI summarization is optional, transcription can be paused, and providers must
              approve anything sent to clients. Reliability evidence is mixed. Grow publishes troubleshooting steps and
              a provider-compensation policy for outage-related missed sessions, which suggests mature incident
              handling. But it does not publish a public status page, an uptime SLA, or a Grow-specific SOC 2 /
              HITRUST-style attestation on the reviewed pages. Independent reviews reinforce that product risk is mostly
              operational rather than purely feature-related: patients praise affordability and insurer handling but
              still report billing friction, while provider reviews describe real value from credentialing and built-in
              tools alongside complaints about auto-cancellations, support quality, and control over records or billing
              identity.
