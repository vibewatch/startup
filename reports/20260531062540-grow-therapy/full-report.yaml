        - >-
          Meaningful payer recoupment, insurer remediation demand, or regulator inquiry tied to AI-generated notes or
          summaries
        - >-
          Escalate to product-compliance diligence immediately and treat AI expansion as a risk multiplier rather than a
          margin lever
      - - Privacy / cyber incident
        - Reportable breach or OCR action
        - >-
          A material PHI incident that triggers public notification, OCR complaint activity, or employer/payer
          remediation demands
        - Move risk rating up sharply because trust, compliance cost, and sales friction would compound simultaneously
      - - Provider-supply degradation
        - Network health deterioration
        - >-
          Sustained evidence that wait times rise, referral fill rates drop, or clinician complaints about
          cancellations, payouts, or support intensify
        - Assume weaker retention and slower revenue conversion until operational data prove otherwise
      - - Execution / funding miss
