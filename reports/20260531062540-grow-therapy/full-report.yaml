    title: Comparable Valuation Table
    enumerationScope:
      coverage: partial
      basis: >-
        Representative 2024-2026 public and private references relevant to Grow's insurer-linked provider-enablement and
        behavioral-health platform model; terms are incomplete for some private transactions, so the set is directional
        rather than exhaustive.
    columns:
