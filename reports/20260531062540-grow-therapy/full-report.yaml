      - number: '3.3'
        title: >-
          Adjacent and substitute pressure comes from enterprise platforms, telehealth incumbents, and private-practice
          tools
        blocks:
          - type: paragraph
            body: >-
              Enterprise mental-health platforms are not one-for-one substitutes for Grow’s original provider
              marketplace, but they compete for the same budget, patient volume, and clinical supply. Spring Health and
              Lyra sell primarily to employers and other organizations rather than to individual practices; both
              highlight AI-enabled triage, coordinated care, and outcome accountability rather than simple directory
              access. Modern Health makes a similar pitch around a connected platform for employers, consultants, health
              plans, and channel partners. These companies matter because they can intercept demand at the
              employer-benefit layer before members ever use an insurer directory or a consumer marketplace, and because
              consolidation between enterprise distribution and provider infrastructure—most visibly Spring plus
              Alma—can shrink the difference between EAP and insurer-enabled therapy.


              BetterHelp, Talkspace, and Teladoc matter for a different reason: they can aggregate consumer attention at
              enormous scale, then add insurance and psychiatry over time. BetterHelp still looks structurally more
              consumer-centric than Grow, with a weekly subscription model, messaging, and selective insurance coverage.
              But retained sources show the Teladoc and BetterHelp complex is actively leaning on insurance expansion
              and broader mental-health bundles as a response to weakness in the cash-pay business. Talkspace’s retained
              business pages show the same hybridization from the other direction: employers, payers, government, and
              benefit consultants sit alongside a consumer product whose insured members often pay little or nothing.


              Software substitutes remain the lowest-cost path for independent practices that do not want a marketplace
              intermediary. SimplePractice and TherapyNotes are much cheaper than surrendering economics to a
              payer-enabled marketplace if a clinician can source patients independently, and both now include the core
              plumbing—billing, scheduling, notes, portals, telehealth, and add-on prescribing—that once differentiated
              enablement platforms more sharply. They do not eliminate payer complexity or supply demand, but they do
              cap how much premium a provider will tolerate for workflow alone.
