            body: >-
              The provider-side stack is the clearest evidence that Grow is building software infrastructure rather than
              just demand generation. After credentialing into Grow's group contracts, clinicians enter a portal that
              combines appointments, referrals, client charts, directory settings, invoicing, and earnings.
              Revenue-cycle documentation is unusually explicit: Grow says it handles insurance verification, claim
              submission, denial management, and payment collection, while surfacing expected payouts and dates in
              portal workflows. Telehealth is embedded rather than outsourced, with secure meeting links, attendance
              tracking, chat, screen sharing, live captioning, and tight coupling to notes and client records. Clinical
              workflow depth goes beyond generic teletherapy. Prescriber notes auto-fill fields from intake and prior
              documentation, telepsychiatry guidance explains how to manage external labwork when medication safety
              requires it, and measurement-informed care tools send recurring assessments and visualize progress over
              time. Care Coordination adds a human escalation path for higher levels of care and specialty referrals.
              Together these features make Grow look more like a lightweight mental-health OS for insurance-based
              private practice than a thin marketplace wrapper, but one that still leaves clinicians dependent on Grow's
              operational and compliance engine.
