      - number: '7.2'
        title: Clinical quality, AI documentation, and privacy/security risk
        blocks:
          - type: paragraph
            body: >-
              Grow’s operational model ties clinical workflows directly to billing and compliance. The platform requires
              every invoice to carry documentation, mandates Grow EHR usage for therapists onboarded after May 5, 2025,
              and now layers AI-generated note drafting into those workflows. That creates a real productivity
              advantage, but it also means the company has inserted itself deeper into the documentation chain than a
              simple referral marketplace. If note quality, consent capture, or audit support fails, the risk is not
              just UX disappointment; it can turn into denied claims, recoupments, or disputes over clinical
              responsibility.


              Grow’s mitigants are real but incomplete. The company says AI note products are optional, require mutual
              consent, do not retain raw transcripts long-term, and must be reviewed and approved by the clinician
              before submission. Those controls reduce the chance of fully automated errors. The underwriting problem is
              that public evidence still stops short of the metrics an investor would want: there is no external
              validation pack, no override-rate disclosure, and no public denial or audit data tied to AI-generated
              notes. Provider-review synthesis from 3Zebras also points to operational complaints around automated
              cancellations, weak escalation paths, and billing-identifier confusion—exactly the sorts of edge cases
              that matter when documentation, payments, and care continuity intersect.


              Privacy and cyber risk sit on top of that workflow complexity. Grow’s privacy notice still contemplates
              advertising and third-party data-sharing mechanics for non-HIPAA website data, while FTC action against
              BetterHelp shows that U.S. regulators will police sensitive mental-health data uses aggressively. HHS
              OCR’s 2026 ransomware settlements and Security Rule update agenda raise the baseline further: any
              PHI-heavy platform that centralizes notes, claims, scheduling, and payment events is a meaningful breach
              target whether or not it has yet disclosed a public incident.
