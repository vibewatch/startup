      - number: '7.3'
        title: Partner, continuity, and competitive-structure risk
        blocks:
          - type: paragraph
            body: >-
              Grow’s commercial model is tightly coupled to insurers and partner workflows. MedCity describes the
              company as getting paid when an in-network Grow provider sees a patient, while the employer page says the
              pitch to employers is continuity: when employer-funded sessions end, the member should keep the same
              provider through their health insurance. That is an attractive wedge because it lowers churn for both
              employers and patients. It also makes payer participation and network adequacy central dependencies. A
              plan repricing, benefit redesign, or narrower-coverage shift does not merely hit take rate; it can break
              the continuity promise that differentiates Grow in employer sales.


              The competitive landscape is also getting more concentrated at scale. Headway markets a much larger
              insurance-covered network than Grow, and Spring Health’s completed Alma combination says it now reaches
              more than 170 million lives across employers and health plans. Public-company comps show that both
              Talkspace and Teladoc/BetterHelp continue to operate at national scale across employer, payer, or direct
              channels. In other words, Grow is not competing against thin local practices anymore; it is competing
              against better-funded platforms that can spread credentialing, product, and referral costs across larger
              member or clinician bases.


              Partner expansion cuts both ways. Behavioral Health Business says Grow is pairing its Series D push with
              Circle Medical and broader health-system integration, which could deepen referral flow and prescriber
              coordination. But every added handoff between primary care, mental-health providers, payer rules, and
              employer benefits adds another place where data-sharing, licensure, benefit design, and documentation
              assumptions can fail. The market is rewarding breadth, but breadth is also raising Grow’s dependency load.
