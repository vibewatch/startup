  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer mix and adoption surfaces
        blocks:
          - type: paragraph
            body: >-
              Grow now operates as a multi-sided mental-health marketplace rather than a single direct-to-consumer
              funnel. Public materials show five economically relevant constituencies: self-directed patients who search
              and book care, independent therapists and prescribers who supply that care, payers that finance most
              covered visits, employers trying to bridge EAP benefits into insurance-backed continuity, and health
              systems or primary-care groups that want a cleaner referral path into therapy. The company’s own pages
              consistently frame payers as the established base, while employer and health-system offerings are
              presented as newer extensions built on the same provider and claims infrastructure.


              Adoption proof is strongest where Grow discloses access and scale, not where it discloses account
              economics. Official 2026 sources say the network spans 26,000-plus providers, 125-plus plans, and roughly
              220 million covered lives, with more than two million people served over five years, seven million visits
              in 2025, and ten million lifetime appointments. Customer-facing pages also make the experience legible:
              most clients start in about two days, employer members are promised fast matching and continuity into
              insurance, and payor-facing materials emphasize new-to-network supply and measurable quality controls. The
              missing denominator is revenue mix by segment, so the chapter can prove breadth and workflow, but not the
              exact share each channel contributes to gross profit or retention.
