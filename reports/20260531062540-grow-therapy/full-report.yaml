companyProfile:
  summary: |
    Grow Therapy is a New York-based mental-health platform founded in 2020 by Jake Cooper, Manoj
    Kanagaraj, and Alan Ni. The company combines an insurance-backed patient marketplace with a
    provider operating system that handles credentialing, payor enrollment, billing, claims,
    documentation, telehealth, and scheduling for therapists and psychiatric prescribers. Its March
    2026 Series D pushed total funding to $328 million and funded expansion beyond the core insurer
    and provider marketplace into employer, health-system, and primary-care referral channels.
