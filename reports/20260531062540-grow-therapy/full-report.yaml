              but still-limited value-based penetration. Meanwhile, named public proof remains concentrated in a small
              handful of relationships, and no public source retrieved in this run disclosed top-payer concentration,
              employer renewal rates, provider churn, or segment-level NRR/GRR. Investors therefore have evidence of
