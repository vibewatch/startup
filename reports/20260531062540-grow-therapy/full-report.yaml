              BetterHelp's own Q1 2026 revenue decline reinforces that behavioral-health demand does not automatically
              translate

              into premium public multiples.


              Private comps are directionally supportive but imperfect. Headway is the closest disclosed model comp: a
              provider-

              enablement and insurer-linked platform that raised $100 million at a $2.3 billion valuation in July 2024
              and said

              34,000 clinicians use the platform. Grow's reported 2026 mark is higher despite smaller disclosed
              clinician scale,

              which can be justified only if Grow's reported revenue is truly far ahead or if its enterprise expansion
              creates a

              broader strategic surface. Alma and Spring Health demonstrate ongoing category convergence but not a clean
              pricing

              benchmark because the 2026 transaction terms were undisclosed. Lyra's 2021 $4.6 billion peak remains
              useful only

              as a reminder that employer-led mental-health valuations were once far richer than today's public
              endpoints.
            claimRefs:
