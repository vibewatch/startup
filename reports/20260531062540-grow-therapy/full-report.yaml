      - number: '3.5'
        title: Moat durability depends more on channel control than on proprietary workflow features
        blocks:
          - type: paragraph
            body: >-
              Grow’s strongest durable claim is not simply that it has software or telehealth. The more defensible
              argument is that it connects multiple demand channels—consumer search, payor relationships, employer
              benefits, and health-system referrals—and can preserve continuity between them. That combination matters
              because many rivals are still strongest in only one layer: BetterHelp in consumer acquisition, Lyra and
              Spring in enterprise distribution, SimplePractice and TherapyNotes in software, and Optum in payer-owned
              navigation. Grow also has a visible supply-side asset in bringing providers into payor networks and in
              marketing itself as a clinician-supportive operating system rather than just an insurer directory.


              Still, the adverse evidence says this moat is not deeply entrenched. Payer leverage is real: Aetna cuts to
              Alma-contracted therapists and Optum-driven rate cuts hitting Alma and Headway show that platform
              economics can compress quickly when insurers reprice contracts. Multi-homing is real too: retained
              reporting documents therapists using Alma and Headway concurrently and keeping records outside platform
              systems. That means a large chunk of Grow’s provider value proposition is at risk of commoditization as
              claims handling, AI note-taking, credentialing help, and EHR features spread across rivals and cheaper
              substitutes.


              Convergence is the final risk. Spring plus Alma, Talkspace’s payor-heavy pivot, Teladoc’s insurance push
              inside BetterHelp, and Optum’s integrated employer behavioral-health stack all point in the same
              direction: the sector is moving toward broader platforms that combine access, triage, therapy, psychiatry,
              benefits design, and referral routing. If that becomes the norm, Grow’s next moat must come from
              measurable outcomes, employer and payor integrations, and continuity economics—not from basic provider
              tooling alone.
