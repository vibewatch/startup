  productSummary: |
    Grow Therapy sells two linked products: a consumer marketplace for in-network therapy and
    psychiatry, and a provider operating platform for independent clinicians. The clinician stack
    covers credentialing, payor enrollment, insurance verification, claims, invoicing, EHR,
    telehealth, documentation, and AI-assisted note workflows.
  customerFocus: |
    Patients seeking insurance-backed mental-health care, independent therapists and psychiatric
    prescribers, health plans, employers, and health systems or primary-care partners that need
    referral continuity into behavioral health.
  businessModel: |
    Grow is primarily paid when in-network providers deliver reimbursed care, with newer employer and
    health-system channels designed to add utilization and continuity rather than pure seat-based
    software revenue. The model blends marketplace demand generation, administrative enablement, and
    payer-linked transaction economics.
