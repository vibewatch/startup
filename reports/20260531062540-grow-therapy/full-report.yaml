  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, reimbursement, and licensure exposure
        blocks:
          - type: paragraph
            body: >-
              Grow sits inside a particularly regulated part of healthcare because it is not just a lead-gen directory.
              Its legal documents describe Grow Care as an administrative-services entity supporting affiliated “Grow
              Professionals,” while public operating pages show a 26,000+ clinician network spanning 125+ insurers,
              Medicare, Medicaid, all 50 states, and roughly 220 million covered lives. That combination means the
              company absorbs a wide surface area of state licensure rules, payer documentation rules, parity
              expectations, and telehealth policy changes even if the affiliated clinicians remain the direct care
              providers.


              The most important near-term policy risk is reimbursement behavior under mental-health parity. The
              Department of Labor says the 2024 MHPAEA final rule has 2025 and 2026 applicability dates, but agencies
              are currently not enforcing new portions while litigation proceeds plus an additional 18 months. That is
              not a clean risk release. Grow’s own billing FAQ still highlights denied claims, preauthorization issues,
              medical-necessity disputes, and network restrictions, meaning the platform remains exposed to
              parity-driven plan redesigns, claim edits, and utilization management choices even during the federal
              pause.


              State-by-state fragmentation also remains material. Grow’s payor-rate materials are filtered by payor,
              state, and license type; additional-state expansion depends on active licensure or a live application.
              Meanwhile, DEA and HHS only extended controlled-substance telemedicine flexibilities through the end of
              2026, keeping medication-management rules temporary rather than settled. Add a public
              digital-accessibility suit from 2023, and the takeaway is that Grow’s legal and reimbursement risk is
              live, diverse, and operational rather than hypothetical.
            claimRefs:
              - CR001
