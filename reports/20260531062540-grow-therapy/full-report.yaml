  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Patient and provider product surface
        blocks:
          - type: paragraph
            body: >-
              Grow Therapy's front door is a consumer search-and-book marketplace built around insurance, not cash-pay
              subscriptions. The patient path starts with state, care type, and insurance filters, then narrows by
              specialty, identity, and availability before instant or near-instant booking. Public materials
              consistently present both talk therapy and medication management as core offerings, with in-person and
              virtual modalities under one brand and a client portal / iPhone app for appointment management, secure
              messaging, forms, and between-session resources. The other half of the product is a provider operating
              system aimed at independent clinicians rather than employed staff. Grow markets this surface as the
              infrastructure that lets therapists and prescribers stay clinically autonomous while outsourcing
              credentialing, payor enrollment, billing, claims, documentation, and telehealth. That makes the company's
              real product closer to an insurance-native mental-health operating layer than a simple directory. The
              trade-off is that Grow becomes the workflow owner for onboarding, scheduling, reimbursement, and many
              patient touchpoints, which raises diligence questions about interoperability, control, and continuity when
              the platform is unavailable or a clinician leaves.
