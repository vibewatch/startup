          - type: callout
            title: Coverage expansion does not remove the supply and reimbursement bottleneck
            body: >-
              Parity, telehealth, and Medicaid expansions make the market more addressable, but they do not solve
              shortages, low public-payer participation, or weak real-world network density. For Grow, the main market
              risk is that covered demand grows faster than willing, sustainably reimbursed provider supply.
            calloutType: risk
            claimRefs:
