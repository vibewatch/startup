        title: Exhibits
        blocks:
          - type: callout
            title: >-
              Grow's real market is narrower than generic behavioral-health TAMs, but that narrower slice is still
              meaningful
            body: >-
              The best public evidence says the broad behavioral-health market is large, yet the relevant diligence move
              is to narrow it to insurer-backed outpatient therapy and psychiatry rather than repeat the broadest
              headline number. That narrower proxy is still large enough to matter, and Grow's disclosed covered lives,
              clinicians, and annual visits suggest real distribution inside it.
            calloutType: insight
