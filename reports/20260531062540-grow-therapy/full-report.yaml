      - - Teladoc / BetterHelp
        - Q1 2026 revenue $613.8M; BetterHelp segment $218.4M; market cap ~$1.37B
        - ~0.59x EV/revenue; market cap roughly 0.6x annualized revenue
        - Useful public downside anchor showing how virtual-care assets can compress in public markets.
