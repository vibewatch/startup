          - type: callout
            title: The Bull Case Requires Enterprise Channels to Improve Economics, Not Just Storytelling
            body: >-
              Employer and health-system expansion only deserves valuation upside if it increases continuity, retention,
              and payer relevance without creating a service-heavy implementation model. Volume alone is not enough; the
              newer channels have to improve quality of revenue.
            calloutType: assumption
