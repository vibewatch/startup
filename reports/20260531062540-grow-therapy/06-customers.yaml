    - Search, match, book, and continue therapy or medication management
    - How-it-works and homepage flows; app-store and review signals
    - Strong public patient-facing proof, but active-customer count by month is undisclosed
  - - Independent therapists and prescribers
    - 'Buyer: clinician deciding where to build practice; User: provider; Payer: Grow / payer reimbursement flow'
    - Credentialing, claims handling, referral generation, documentation, telehealth
    - Provider page; Verifiable case study; ChoosingTherapy provider review
    - Supply acquisition appears differentiated, but provider churn and cohort retention are undisclosed
  - - Health plans / payers
    - 'Buyer: payer network or behavioral-health leader; User: member + Grow operations; Payer: insurer'
    - In-network behavioral-health access, quality monitoring, and lower-friction claims-backed care
    - Payor page; 125+ plans and 220M lives; 25 Medicaid plans and Medicare presence
    - Most mature public segment, but contract economics and concentration remain private
  - - Employers / EAP sponsors
    - 'Buyer: benefits leader; User: employee + HR/benefits team; Payer: employer for EAP phase, then insurer'
    - Fast access plus continuity from employer-funded sessions into insurance-covered care
    - Employer page and 2026 funding materials emphasize EAP-to-insurance rollover
    - Strategically important but thin on named logos, renewals, and deployment counts
  - - Health systems / primary-care partners
    - 'Buyer: health-system or medical-group partner; User: physician team + patient; Payer: insurer or employer benefit'
    - Referral coordination from screening to therapy with context-sharing and follow-up
    - Circle Medical launch and Kaiser Permanente member pathway
    - Named proof exists, but only a small number of public references were retrieved
  notes: Segmentation is assembled from public product, partner, and news sources retrieved on 2026-05-31. Grow does not disclose revenue mix, contribution margin, or retention by segment.
