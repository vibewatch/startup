- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk / friction
  - Impact
  - Diligence path
  rows:
  - - EAP-to-insurance continuity
    - No named employer customers or renewal data retrieved
    - Could create strong land-and-expand behavior if real, but public proof is still thin
    - Request employer logos, launch cohorts, renewal rates, and transition-success metrics from EAP to insurance
  - - Provider credentialing engine
    - Provider acquisition looks strong, but provider churn and satisfaction disclosure are absent
    - Supply can scale faster than DIY credentialing, yet retention risk could still bottleneck growth
    - Request monthly active clinicians, churn, reactivation, and time-to-first-session cohorts
  - - Broad payer footprint
    - Top-payer concentration and commercial reimbursement mix are undisclosed
    - Volume looks diversified by count, but economics may still be concentrated
    - Request top-10 payer revenue mix, denial rates, repricing exposure, and contract duration
  - - Value-based payer contracts
    - Only 10 at-risk payer contracts and under 10% of total payer contracts
    - Suggests deeper quality-linked monetization is still early relative to total payer reach
    - Request outcomes tied to at-risk contracts and pipeline of additional value-based deals
  - - Health-system referrals
    - Circle Medical is named, but the public named health-system proof set is small
    - Health-system GTM may be promising but still reference-light
    - Request referral volume, conversion to completed session, and repeat-referral metrics by partner
  - - Marketplace support and billing operations
    - BBB, App Store, and editorial reviews still point to billing, support, and matching friction
    - Complaint drag can weaken patient trust and provider willingness to rely on the platform
    - Request complaint incidence, median resolution time, rematch rate, and fee-dispute outcomes
  - - Reference concentration
    - Named proof is concentrated in Kaiser Permanente, Circle Medical, and Zocdoc versus the much larger disclosed customer base
    - Raises selection-bias risk when underwriting durability from a curated sample
    - Request top-account list by payer, employer, and health-system revenue plus tenure and renewal status
  notes: Public evidence shows credible expansion mechanics, but not enough account-level disclosure exists to score concentration or durability with institutional confidence.
