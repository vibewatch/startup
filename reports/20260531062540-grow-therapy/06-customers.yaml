  evidenceGaps:
  - type: missing-source
    severity: material
    topic: employer-proof-gap
    missingEvidence: Named employer customers, deployment counts, and renewal outcomes for the new employer benefit program.
    whyItMatters: Employer expansion is a major 2026 thesis, but without named accounts or renewals it is hard to judge whether the product is already sticky or merely promising.
    diligencePath: Request the top employer launches since March 2026, including employee counts, utilization, renewal status, and EAP-to-insurance rollover rates.
    relatedQuestionRefs:
    - QU011
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: blocking
    topic: retention-gap
    missingEvidence: Segment-level NRR, GRR, logo churn, renewal cohorts, and contract duration across payer, employer, and health-system channels.
    whyItMatters: The chapter can prove adoption and satisfaction proxies, but not true durability or expansion economics.
    diligencePath: Request quarterly cohort tables for payers, employers, and providers plus definitions for retention metrics used internally.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: provider-retention-gap
    missingEvidence: Provider churn, active-clinician rates, referral concentration by clinician, and reactivation data.
    whyItMatters: Supply-side durability determines whether Grow can keep payer and employer promises as demand expands.
    diligencePath: Request monthly provider funnel data from sign-up to first session, 90-day retention, annual churn, and clinician NPS or complaint metrics.
    relatedQuestionRefs:
    - QU017
    relatedTableRefs:
    - TU004
    - TU005
  - type: private-evidence-only
    severity: blocking
    topic: concentration-gap
    missingEvidence: Top-payer, top-employer, and top-health-system concentration, plus revenue and visit mix by channel.
    whyItMatters: Breadth by partner count does not rule out economic concentration or channel dependency.
    diligencePath: Request top-10 counterparties by revenue, visits, and contribution margin, including contract length and termination terms.
    relatedQuestionRefs:
    - QU022
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: complaint-operations-gap
    missingEvidence: Internal rates for billing disputes, rematches, app incidents, support response time, and complaint resolution.
    whyItMatters: Public review surfaces show real friction, but investors cannot judge whether those issues are isolated or systemic.
    diligencePath: Request monthly complaint dashboards segmented by billing, matching, product, and provider-support issues, with close-time SLAs and refund outcomes.
    relatedQuestionRefs:
    - QU018
    - QU019
    relatedTableRefs:
    - TU004
    - TU005
