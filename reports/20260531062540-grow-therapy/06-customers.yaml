- id: FU002
  title: Adoption / deployment funnel
  type: flow
  layout: standard
  summary: 'Grow’s funnel is not just patient acquisition: provider credentialing feeds payer breadth, which then enables employer continuity and health-system referrals.'
  data:
    nodes:
    - id: provider-supply
      label: Recruit provider supply
      detail: Grow signs 1099 clinicians, helps with credentialing, and equips them with billing, scheduling, telehealth, and community support.
    - id: payer-enable
      label: Enable payer coverage
      detail: Grow expands plan participation and in-network availability so patients can use existing insurance.
    - id: patient-discovery
      label: Patient discovery / referral
      detail: Patients arrive through self-search, employer benefits, payer pathways, primary care, or Zocdoc.
    - id: match-book
      label: Match and book
      detail: Insurance, specialty, identity, availability, and modality filters push the user toward a first appointment.
    - id: first-session
      label: First completed session
      detail: Early speed and fit matter; official pages emphasize fast booking and first-session completion.
    - id: repeat-expand
      label: Repeat care / expansion
      detail: Continuation can happen through repeat sessions, EAP-to-insurance rollover, physician referrals, and deeper payer or employer integrations.
    edges:
    - from: provider-supply
      to: payer-enable
      label: Credentialed clinicians make payer breadth possible
    - from: payer-enable
      to: patient-discovery
      label: Coverage and affordability open more entry points
    - from: patient-discovery
      to: match-book
      label: Users filter for fit, network, and timing
    - from: match-book
      to: first-session
      label: Low-friction booking converts need into care
    - from: first-session
      to: repeat-expand
      label: Continuity and outcomes support repeat use and channel expansion
