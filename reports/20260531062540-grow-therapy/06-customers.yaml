- id: satisfaction-outcomes-and-repeat-usage
  title: Satisfaction, outcomes, and repeat-usage proxies
  body: |-
    Grow publishes more customer-experience and outcomes detail than most private tele-mental-health peers, but the evidence quality is mixed. Official 2026 materials claim that nine in ten clients would strongly recommend Grow, that the company’s NPS is 85, that more than 80% of members see clinically significant improvement, that 82% feel better since starting therapy, and that session-one to session-three retention is 75%. The employer page goes further by claiming 96% of members found an appropriate match at intake and 2.8 days from booking to the first completed session. These are meaningful signals because they speak to the marketplace’s hardest problems: matching quality, wait time, and continuity.

    Independent review surfaces partly corroborate the positive story while preserving real caution. Trustpilot shows a large 4.7-star review base, and Apple’s App Store shows a 4.8-star rating with thousands of ratings plus detailed positive comments on therapist fit, insurance setup, messaging, and convenience. At the same time, both app-store and editorial sources highlight fee surprises, audio or video glitches, insurance confusion, and support frustrations. The implication is that Grow appears genuinely useful to many patients, but public satisfaction evidence is still better at showing broad approval than at quantifying complaint incidence, refund rates, or long-term cohort durability by segment.
  claimRefs:
