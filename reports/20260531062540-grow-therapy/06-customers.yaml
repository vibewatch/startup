- id: complaints-friction-and-concentration-gaps
  title: Complaints, friction, and concentration gaps
  body: |-
    The adverse surface is not thesis-breaking, but it is consistent enough to matter. BBB complaint summaries point to billing and service issues; Healthline’s review also foregrounds billing, communication, and insurance disputes; and negative App Store comments complain about missed-appointment fees and technical problems. Provider-side adverse sources are sharper. Independent reviews from 3Zebras and Mentalzon both describe automated cancellations, inconsistent human support, legal-guidance ambiguity, and billing-identifier confusion. Those reports are lower-confidence than filings or regulator actions, but they are directionally important because Grow’s marketplace must retain clinician trust at the same time it expands payer and employer demand.

    Concentration risk is harder to measure than friction risk because disclosure is sparse. Fierce reports that payers are still Grow’s biggest partner, that the company works with 25 Medicaid plans, and that only 10 payer contracts are at risk, or under 10% of the total payer-contract base. That suggests payer breadth but still-limited value-based penetration. Meanwhile, named public proof remains concentrated in a small handful of relationships, and no public source retrieved in this run disclosed top-payer concentration, employer renewal rates, provider churn, or segment-level NRR/GRR. Investors therefore have evidence of live demand and workflow fit, but not enough to underwrite concentration or durability without management data.
