callouts:
  - calloutType: recommendation
    title: Headline Cheapness Depends Almost Entirely on Revenue Definition
    body: >-
      Grow's reported ~$3 billion valuation only looks comfortably rational if the public $1 billion figure is largely
      net revenue. If that figure is gross claims throughput or another non-GAAP operational KPI, the same headline mark
      becomes much harder to defend. This is why the recommendation stays at research-more despite otherwise strong scale
      evidence.
    claimRefs:
      - CV023
      - CV024
      - CV025
      - CV055
      - CV057

  - calloutType: insight
    title: Public Comp Endpoints Put Grow Between a 3.6x Takeout and a 0.6x Public Trading Multiple
    body: >-
      Talkspace's 2026 sale to UHS at about 3.6x revenue shows that scaled mental-health assets can still clear decent
      strategic multiples, while Teladoc's ~0.59x EV/revenue ratio shows how far public markets discount slower-growth
      or mixed-quality telehealth exposure. Grow sits between those endpoints until its revenue quality is better proved.
    claimRefs:
      - CV029
      - CV031
      - CV032
      - CV034
      - CV035
      - CV037
      - CV056

  - calloutType: risk
    title: Missing 2026 Form D and Round-Term Opacity Matter More Than the Headline Valuation Spread
    body: >-
      Investors can debate whether $3 billion is fair, but they still do not know whether the 2026 round included
      secondaries, senior preferences, or other protections that change the real economics. At this stage, hidden term
      complexity can matter more than a few turns of headline multiple difference.
    claimRefs:
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022

  - calloutType: assumption
    title: The Bull Case Requires Enterprise Channels to Improve Economics, Not Just Storytelling
    body: >-
      Employer and health-system expansion only deserves valuation upside if it increases continuity, retention, and
      payer relevance without creating a service-heavy implementation model. Volume alone is not enough; the newer
      channels have to improve quality of revenue.
    claimRefs:
      - CV013
      - CV014
      - CV015
      - CV052
      - CV054
      - CV059

