  - id: TV003
    title: Bull / Base / Bear Scenario Table
    columns:
      - scenario
      - core assumptions
      - valuation logic
      - range
      - implication versus current mark
    rows:
      - - Bull
        - >-
            The $1B metric is largely net revenue, employer and health-system channels increase continuity and lifetime
            value, and payer renewals stay stable despite more at-risk contracts.
        - >-
            A 4.0x-5.5x revenue-like outcome or equivalent strategic-control premium becomes credible as Grow proves a
            durable multi-channel infrastructure position.
        - $4.0B-$5.5B
        - >-
            1.3x-1.8x uplift from the reported current mark; likely requires another clean financing or strategic buyer
            interest.
      - - Base
        - >-
            The $1B figure is mostly net revenue, employer programs add moderate value, and reimbursement remains broadly
            stable with no major renewal shock.
        - >-
            A valuation around current levels remains supportable using late-stage growth pricing near public takeout
            precedents rather than peak private marks.
        - $2.5B-$3.5B
        - >-
            Roughly flat to modestly positive versus the current mark; acceptable but not obviously mispriced.
      - - Bear
        - >-
            The reported $1B figure overstates net revenue, payer rate pressure broadens, or enterprise channels create
            costly implementation drag before proving retention benefits.
        - >-
            The market would likely price Grow closer to distressed or low-quality virtual-care multiples than to premium
            provider-enablement peers.
        - $1.2B-$1.8B
        - >-
            Material down-round risk and weaker return protection for new investors.
    notes: >-
      These ranges are analyst estimates anchored to public comps, disclosed scale, and the unresolved revenue-definition
      question. They are not management guidance or audited valuation marks.
