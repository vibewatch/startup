  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: revenue-definition
      missingEvidence: Audited 2025 statements and a KPI-to-GAAP bridge for the reported $1 billion metric
      whyItMatters: The entire multiple discussion changes if the reported figure is gross throughput rather than net revenue
      diligencePath: Request audited financials, management KPI definitions, and controller sign-off on revenue recognition
      relatedQuestionRefs: [QV005, QV009, QV010, QV022, QV030]
    - type: missing-source
      severity: material
      topic: 2026-round-terms
      missingEvidence: 2026 Form D or equivalent legal financing documents plus cap-table and term-sheet detail
      whyItMatters: Late-stage preference, secondaries, and governance rights can make the effective investor price very different from the headline post-money valuation
      diligencePath: Obtain signed financing documents, counsel summary, and a post-closing cap table from the company
      relatedQuestionRefs: [QV006, QV027, QV030]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Gross margin, take rate, provider payout waterfall, and burn or runway data by channel
      whyItMatters: These metrics determine whether Grow should be valued like infrastructure software, care services, or something in between
      diligencePath: Request FP&A package, channel profitability analysis, and board cash-runway materials
      relatedQuestionRefs: [QV018, QV019, QV028]
    - type: private-evidence-only
      severity: material
      topic: payer-concentration
      missingEvidence: Top-10 payer concentration, renewal calendar, at-risk contract performance, and denial trends
      whyItMatters: Reimbursement shock is the clearest public downside path for an insurer-linked behavioral-health platform
      diligencePath: Request payer concentration deck, renewal schedule, and claims-ops KPIs from revenue operations
      relatedQuestionRefs: [QV021, QV025, QV029]
    - type: enumeration-incomplete
      severity: minor
      topic: comparable-set-TV004
      missingEvidence: A fully priced private comparable set with disclosed transaction terms for every major insurer-linked and employer-linked mental-health platform
      whyItMatters: TV004 is intentionally partial because Alma or Spring terms are undisclosed and 2026 private-market marks remain sparse outside Headway and Grow
      diligencePath: Supplement the table with private-market databases or management-shared comp decks if term-level comparables become available
      relatedTableRefs: [TV004]
    - type: conflicting-data
      severity: minor
      topic: visit-scale
      missingEvidence: A management reconciliation of seven million 2025 visits, ten million lifetime appointments, and ten million annual network visits
      whyItMatters: Scale credibility underpins revenue-per-visit math, enterprise ROI claims, and investor confidence in the operating story
      diligencePath: Ask management for metric definitions, counting rules, and the exact reporting period for each visit statistic
      relatedQuestionRefs: [QV003, QV026]
