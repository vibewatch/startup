  - id: diligence-downside
    title: What Has to Be True, Downside Risks, and Final Diligence Asks
    body: |-
      Three things have to be true for Grow's current price to work. First, the reported $1 billion metric has to map
      closely enough to net revenue that the company is not actually trading at a hidden high-single-digit or double-
      digit multiple. Second, payer renewals and at-risk contracts have to prove that Grow can push toward value-based
      arrangements without opening itself to broad reimbursement compression. Third, employer and health-system channels
      must improve lifetime value and referral continuity faster than they add implementation, compliance, and support
      costs. If those conditions hold, today's price could prove fair to slightly attractive for a late-stage strategic
      growth round.

      The downside is concentrated in exactly the areas public evidence leaves opaque. Grow already has external billing
      and insurance complaints, a public litigation signal, and no disclosed 2026 round terms. Adjacent platforms such
      as Alma and Headway have already faced Optum rate pressure, proving that insurer-linked mental-health economics can
      reprice suddenly. That combination — reimbursement sensitivity plus disclosure limits — is why the chapter stops at
      research-more rather than issuing a clean buy. The final diligence list is therefore not polish; it is the minimum
      evidence required to know whether the reported $3 billion mark is truly at market, quietly full, or actually too
      low for the scale Grow is now claiming.
