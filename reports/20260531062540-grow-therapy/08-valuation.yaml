  - id: scenarios
    title: Bull, Base, and Bear Outcomes
    body: |-
      The base case is not that Grow is cheap; it is that Grow can plausibly hold roughly its current valuation if
      several unproven assumptions turn out to be true together. The most important are that the public $1 billion
      metric is mostly net revenue, payer renewals remain stable enough to prevent a broad reimbursement reset, and the
      employer and health-system expansions increase retained utilization without requiring a margin-dilutive enterprise
      services layer. Under that frame, a valuation range centered around the current $3 billion mark is defensible and
      potentially modestly expandable.

      The bull case depends on channel quality, not just volume. If Grow's newer employer and primary-care referral
      pathways materially improve continuity of care, reinforce payer relationships, and maintain economics that look
      more like software-enabled infrastructure than service-heavy case management, the company could grow into a
      $4.0-$5.5 billion valuation range over the next 24-36 months. The bear case is more immediate and more plausible
      than the headline scale story suggests. If the $1 billion figure is closer to gross claims throughput than net
      revenue, or if reimbursement pressure similar to Optum's 2024 rate cuts hits Grow's insurer-linked model, the same
      business could look like a $1.2-$1.8 billion asset and face real down-round pressure. The scenario spread is wide
      because disclosure quality is still the binding variable.
