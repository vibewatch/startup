  - id: TV004
    title: Comparable Valuation Table
    enumerationScope:
      coverage: partial
      basis: >-
        Representative 2024-2026 public and private references relevant to Grow's insurer-linked provider-enablement and
        behavioral-health platform model; terms are incomplete for some private transactions, so the set is directional
        rather than exhaustive.
    columns:
      - comparable
      - disclosed metric
      - multiple_or_value
      - relevance
      - limitation
    rows:
      - - Talkspace / UHS
        - 2025 revenue $228.9M; 2026 takeout EV ~$835M
        - ~3.6x revenue takeout multiple
        - Closest disclosed public M&A benchmark for scaled digital mental-health delivery.
        - Talkspace mixes payor, employer, and consumer revenue and is not a provider-enablement platform.
      - - Teladoc / BetterHelp
        - Q1 2026 revenue $613.8M; BetterHelp segment $218.4M; market cap ~$1.37B
        - ~0.59x EV/revenue; market cap roughly 0.6x annualized revenue
        - Useful public downside anchor showing how virtual-care assets can compress in public markets.
        - Teladoc is diversified and BetterHelp is DTC-heavy, so the comp is structurally imperfect.
      - - Headway
        - July 2024 Series D; 34,000 clinicians; 40+ commercial plans
        - $2.3B private valuation
        - Closest disclosed private model comparable on insurer-enabled practice infrastructure.
        - Valuation is from mid-2024, not a 2026 mark, and revenue is undisclosed.
      - - Alma / Spring Health
        - 2026 acquisition of Alma by Spring Health; terms undisclosed
        - Strategic buyer appetite confirmed, pricing undisclosed
        - Shows category convergence between employer-sponsored and payer-linked mental-health infrastructure.
        - No transaction value or multiple was disclosed.
      - - Lyra Health
        - 2021 funding round; employer-led mental-health platform serving 20M+ people globally
        - $4.6B private valuation at 2021 peak
        - Demonstrates the upper bound once paid for scaled enterprise mental-health access.
        - Peak-cycle 2021 pricing is a weak direct anchor for 2026.
      - - Broader healthtech / behavioral-health benchmark
        - Public healthtech EV/revenue spans from sub-1x payer-like assets to 4x-6x diversified healthtech; large behavioral-health platforms can reach 9x-13x EBITDA
        - Broad benchmark band, not a single comp
        - Useful for stress-testing whether Grow is sitting inside or outside normal range assumptions.
        - Revenue and EBITDA bands are not interchangeable and must be matched to actual disclosed economics.
    notes: >-
      The comparable set mixes public trading comps, a public M&A takeout, and private reference points because no single
      public company perfectly matches Grow's payer-linked, provider-enablement, employer-bridge model.
