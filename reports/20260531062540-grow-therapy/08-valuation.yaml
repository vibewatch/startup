  - id: TV006
    title: Final Diligence Asks Table
    columns:
      - topic
      - missing evidence
      - why it matters
      - owner_or_path
      - decision impact
    rows:
      - - Revenue definition
        - Audited 2025 statements plus a KPI-to-GAAP bridge for the reported $1B figure
        - Determines whether Grow is trading near 3.0x revenue or at a much higher hidden multiple
        - CFO / controller diligence room
        - Highest-impact item; can change valuation stance immediately
      - - Cap table and round terms
        - 2026 term sheet, liquidation preferences, secondary mix, and board rights
        - Effective price can differ materially from headline post-money in late-stage rounds
        - Legal diligence and financing counsel
        - Needed to know whether new money is actually buying downside protection
      - - Payer concentration and renewal economics
        - Top-10 payer revenue share, renewal calendar, at-risk contract performance, and denial trends
        - Reimbursement sensitivity is the core downside variable for insurer-linked platforms
        - Commercial diligence plus revenue operations review
        - Governs bear-case probability and required discount
      - - Channel unit economics
        - Gross margin, provider payout waterfall, and implementation cost by payer, employer, and health-system channel
        - Needed to convert scale metrics into EBITDA-quality valuation logic
        - FP&A and operations data request
        - Determines whether FOCUS behavioral-health EBITDA bands are applicable
      - - Enterprise cohort proof
        - Employer and health-system contract counts, utilization curves, retention, and care-continuity outcomes
        - The bull case depends on these newer channels adding quality, not just story value
        - Enterprise sales / customer success diligence
        - Determines whether Grow deserves a strategic premium to direct mental-health comps
      - - Complaint and litigation exposure
        - Billing-dispute rates, refund trends, privacy incident history, and litigation summaries
        - Public adverse signals exist but are not yet sized well enough to model
        - Legal, compliance, and support-ops diligence
        - Can materially change downside weighting and exit readiness
    notes: >-
      These asks are the minimum package needed to move from public-evidence framing to investable valuation work. None is
      optional if the round is being considered at or near the reported current mark.
