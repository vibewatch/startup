  - id: financing-context
    title: Financing Context and Implied Multiple
    body: |-
      The latest financing is easy to state but harder to underwrite. Reuters, Grow's own blog, and multiple sector
      publications line up on a March 2026 $150 million Series D led by TCV and Goldman Sachs Alternatives, with total
      funding reaching $328 million and a reported valuation around $3 billion. Public operating commentary around that
      round shows employer and health-system expansion layered onto the original payer-and-provider model, which is a
      strategically relevant shift because it could increase referral density and retention if the channel economics are
      good. The same evidence pack also says Grow only charges employers for care delivered, not unused covered lives,
      which is directionally positive for revenue quality.

      The problem is that the round still lacks the public term transparency investors normally want at this stage.
      Grow's SEC browse page shows Form D activity in 2021, 2022, and 2024, but no visible 2026 Form D as of the run
      date. Historical Form D amounts also do not fully reconcile to announced Series A-C round sizes, so the public
      filing trail establishes real financing activity but not a clean round-by-round legal ledger. That leaves three
      material unanswered questions for valuation: whether the latest round included secondaries, what liquidation or
      participation terms sit above common, and whether the oft-cited $1 billion revenue figure is net revenue or a
      broader throughput metric. Until those are answered, the headline 3.0x implied multiple should be treated as a
      working hypothesis rather than a settled conclusion.
    claimRefs:
