tables:
  - id: TV001
    title: Recommendation Summary Table
    columns:
      - dimension
      - assessment
      - rationale
      - what changes the call
      - current implication
    rows:
      - - Recommendation
        - Research More
        - >-
            The reported mark can be defended only conditionally because the $1B revenue figure is still undefined and
            2026 round terms are not public.
        - Audited 2025 revenue definition, gross margin, and 2026 term stack.
        - Do not underwrite the round as a clean buy from public evidence alone.
      - - Confidence
        - Medium
        - >-
            Scale and financing facts are well corroborated, but the core valuation bridge depends on a company-defined
            revenue metric.
        - A GAAP bridge and payer-mix disclosure.
        - Public evidence supports a directional view, not a final IC decision.
      - - Risk rating
        - Medium-High
        - >-
            Reimbursement pressure, billing friction, litigation signal, and term opacity can all impair downside
            protection.
        - Proof that payer contracts renew and dispute rates are controlled.
        - The current mark needs downside diligence before price acceptance.
      - - Valuation stance
        - At market only if revenue is net; otherwise potentially full
        - >-
            A 3.0x headline multiple looks acceptable against Talkspace's takeout multiple, but only under the net-
            revenue interpretation.
        - A KPI-to-GAAP bridge plus take-rate disclosure.
        - Price discipline should be tied to revenue-definition evidence.
      - - Entry discipline
        - Terms matter as much as headline valuation
        - >-
            Missing 2026 Form D, preference, and secondary disclosure means effective investor economics may differ from
            the reported headline mark.
        - Signed term sheet, cap table, and waterfall model.
        - Treat the current price as provisional until terms are disclosed.
    notes: >-
      Recommendation is explicitly price-sensitive. The same company could screen as attractive or expensive depending on
      whether the reported $1B figure is net revenue or a broader throughput KPI and depending on undisclosed late-stage
      terms.
