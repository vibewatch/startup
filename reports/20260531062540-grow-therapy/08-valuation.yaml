slug: grow-therapy
runDate: '2026-05-31'
company:
  name: Grow Therapy
chapter:
  number: 8
  title: Valuation
  letter: V
  summary: >-
    Grow Therapy's March 2026 Series D set a reported ~$3 billion valuation on a business that now claims roughly $1
    billion of revenue, 26,000 providers, 125-plus insurers, and seven million visits in 2025. That headline looks
    roughly at market if the revenue figure is substantially net revenue, but the absence of a 2026 Form D, cap-table
    terms, and a public GAAP bridge means the effective entry price could be materially fuller than the headline 3.0x
    multiple suggests. Public comparables bracket the case between Talkspace's ~3.6x sale multiple and Teladoc's
    ~0.6x trading multiple, so the right recommendation is research-more with tight price discipline rather than an
    unconditional buy.

sections:
  - id: recommendation-thesis
    title: Recommendation, Thesis, and Anti-Thesis
    body: |-
      The valuation debate on Grow Therapy starts with one unusually strong fact pattern for a private mental-health
      company: the business publicly pairs a late-stage March 2026 financing with large operating disclosures. Grow and
      Reuters agree on a $150 million Series D and $328 million of total funding, while official and trade sources also
      point to 26,000 providers, 125-plus payer relationships, roughly 220 million covered lives, more than two
      million people served, and seven million visits in 2025. If the separately reported “about $1 billion” revenue
      figure is substantially net revenue, the reported ~$3 billion mark implies only about 3.0x revenue — a level that
      is not obviously stretched versus scaled behavioral-health or healthtech infrastructure comps.

      The anti-thesis is that the most important input is also the least well defined. Public evidence never explains
      whether the $1 billion figure is GAAP net revenue, gross claims throughput, or another KPI. That ambiguity is not
      cosmetic: a net-revenue interpretation makes Grow look around market, while a gross-throughput interpretation
      would imply a materially higher effective multiple. The same opacity applies to late-stage terms. SEC history does
      not yet show a 2026 Form D, and public sources do not disclose preference stack, secondaries, or governance terms.
      Add real reimbursement pressure in adjacent insurer-linked platforms plus billing-friction complaints, and the
      correct recommendation is research-more at the current mark, with a willingness to move to conditional buy only
      after revenue-definition and term diligence closes.
