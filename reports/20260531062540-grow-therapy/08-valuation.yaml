  - id: comparable-frame
    title: Public and Private Comparable Frame
    body: |-
      Public comps give Grow a real but not comfortable valuation bracket. On the positive side, Talkspace's 2026 sale
      to UHS at roughly $835 million enterprise value implies about 3.6x Talkspace's 2025 revenue, which is slightly
      above Grow's headline 3.0x multiple if Grow's $1 billion metric is net revenue. On the negative side, Teladoc's
      May 2026 market capitalization of roughly $1.37 billion and MarketScreener EV/revenue ratio around 0.59x show how
      far public markets can compress diversified virtual-care assets when growth slows or segment quality is mixed.
      BetterHelp's own Q1 2026 revenue decline reinforces that behavioral-health demand does not automatically translate
      into premium public multiples.

      Private comps are directionally supportive but imperfect. Headway is the closest disclosed model comp: a provider-
      enablement and insurer-linked platform that raised $100 million at a $2.3 billion valuation in July 2024 and said
      34,000 clinicians use the platform. Grow's reported 2026 mark is higher despite smaller disclosed clinician scale,
      which can be justified only if Grow's reported revenue is truly far ahead or if its enterprise expansion creates a
      broader strategic surface. Alma and Spring Health demonstrate ongoing category convergence but not a clean pricing
      benchmark because the 2026 transaction terms were undisclosed. Lyra's 2021 $4.6 billion peak remains useful only
      as a reminder that employer-led mental-health valuations were once far richer than today's public endpoints.
