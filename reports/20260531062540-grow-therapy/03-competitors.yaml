"callouts":
- "calloutType": "strength"
  "title": "Grow’s best differentiation is continuity across channels, not just a cheaper therapy visit"
  "body": "Grow’s employer and insurer pages point to the same core edge: people can start through an employer-funded benefit, move into insurance, and keep the same provider. That is a stronger distribution claim than simple patient matching or low software fees."
  "claimRefs":
  - "CP011"
  - "CP012"
  - "CP049"
  - "CP052"
- "calloutType": "risk"
  "title": "The biggest competitor may be payer leverage, not another startup"
  "body": "Optum and Aetna rate-cut episodes at Alma and Headway show that insurer pricing power can compress marketplace economics even when patient demand remains strong. Grow is exposed to the same structural risk because its value proposition still depends on payer relationships and reimbursement spreads."
  "claimRefs":
  - "CP029"
  - "CP030"
  - "CP046"
  - "CP047"
- "calloutType": "insight"
  "title": "Consolidation is making the market more dangerous for single-channel players"
  "body": "Spring’s acquisition of Alma, Talkspace’s payor-heavy pivot, and Teladoc’s insurance push inside BetterHelp all point toward broader platforms that combine enterprise access, consumer acquisition, and payer-backed continuity. Grow’s moat will have to be measured outcomes and embedded channel partnerships, not basic workflow features."
  "claimRefs":
  - "CP028"
  - "CP038"
  - "CP040"
  - "CP048"
  - "CP057"
