    - "label": "Continuity moat"
      "value": "EAP → insurance"
      "description": "Employees can continue with the same Grow provider after employer-funded sessions end"
    - "label": "Access speed"
      "value": "2.8 days"
      "description": "Average time from booking to first completed session on Grow employer page"
