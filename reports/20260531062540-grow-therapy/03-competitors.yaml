- "id": "pricing-distribution-and-lockin"
  "title": "Pricing, packaging, and distribution show where Grow is differentiated—and where lock-in is thin"
  "body": "Pricing and packaging make Grow look less like a software vendor and more like a distribution and continuity engine. On the provider side, Grow’s message is free participation, payer enrollment, claims support, and operating tools, while patients pay insurance-driven session prices. On the employer side, Grow says pricing is utilization-based rather than flat PMPM and that members can roll from employer-funded sessions into in-network coverage with the same provider. That continuity story is strategically important because it turns Grow from a point solution into a cross-channel care path. It also helps explain why the company is expanding into employers and health systems rather than staying a therapist marketplace alone.\n\nCompetitors package care differently. Headway also uses a free-to-provider, insurance-native model, but retained pages are less explicit about multi-channel continuity beyond the insurer workflow. Alma still monetizes via provider membership, which can appeal\
    \ to therapists who want a more software-like ROI test and community layer. BetterHelp and Talkspace expose much clearer consumer pricing: weekly subscriptions without insurance, or copays and covered sessions when insurance is available. SimplePractice and TherapyNotes use direct monthly SaaS pricing, letting practices keep their own demand if they can generate it.\n\nThe lock-in consequence is asymmetric. Provider lock-in appears weak because clinicians can multi-home, move cash-pay patients elsewhere, and even keep clinical records outside a platform. Payer and employer lock-in are stronger because reimbursement terms, benefits design, member communication, and continuity rules shape who controls the referral stream. Grow’s best lock-in is therefore not that therapists cannot leave; it is that insurers and employers can embed Grow in the care journey in ways that are harder to replicate with stand-alone software."
