- "id": "FP003"
  "title": "Competitive durability KPIs — Grow Therapy"
  "type": "kpi"
  "layout": "compact"
  "summary": "Grow’s visible strengths are insurer breadth and continuity, while the most important negative KPI is payer leverage over economics rather than software parity."
  "data":
