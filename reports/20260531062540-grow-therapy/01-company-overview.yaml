      - TO003
    figureRefs:
      - FO003
  - id: milestones-partnerships-risks
    title: Milestones, partnerships, and diligence risks
    body: >-
      The milestone record shows Grow moving from therapist enablement toward broader care-orchestration. After the 2024
      Series C, the company paired capital with measurement-informed-care infrastructure and later highlighted AI note
      taking, between-session patient tools, and outcomes tracking as proof that its model can scale beyond a directory.
      In March 2026 it used the Series D to launch employer benefits designed to bridge EAP sessions into normal health
      insurance and to extend referral workflows into health systems beginning with Circle Medical; Kaiser Permanente also
      hosts a partner page steering members into Grow's network. The diligence file is not entirely clean, however.
      Behavioral Health Business later corrected Grow's own initial description of which prior investors joined Series D,
      and Grow's employer page cites 10 million annual visits while other March 2026 materials describe 10 million
      lifetime appointments and seven million visits in 2025. Adverse signals also exist beyond disclosure quality:
      Healthline summarized dozens of BBB complaints focused on billing and insurance issues, a plaintiffs' firm says it
      is investigating provider-rights claims, and court-tracking services show 2025-2026 litigation involving Grow Care
      and related entities even though one contract case was dismissed for improper venue.
    claimRefs:
