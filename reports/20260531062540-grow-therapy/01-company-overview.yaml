  evidenceGaps:
    - type: missing-source
      severity: material
      topic: governance
      missingEvidence: A current board roster, board-rights summary, and governance documents such as committee structure or observer rights.
      whyItMatters: Public governance opacity makes it harder to underwrite founder control, investor influence, and escalation paths for legal or operating issues.
      diligencePath: Ask management for the current board list, lead-investor rights, and any governance deck used for financing or audit preparation.
      relatedQuestionRefs:
        - QO005
      relatedTableRefs:
        - TO002
    - type: conflicting-data
      severity: material
      topic: funding-conflict
      missingEvidence: A definitive cap-table note confirming which prior investors actually funded the March 2026 Series D.
      whyItMatters: The same round was described differently across outlets, which can distort signal about insider conviction and governance support.
      diligencePath: Request the Series D close memo or management clarification identifying funded, non-funded, and pro-rata investors.
      relatedQuestionRefs:
        - QO008
        - QO025
      relatedTableRefs:
        - TO003
    - type: private-evidence-only
      severity: material
      topic: revenue
      missingEvidence: Audited or management-certified revenue, gross margin, and run-rate disclosure.
      whyItMatters: Press-reported revenue is helpful for context but too weak to anchor later financial and valuation analysis without confirmation.
      diligencePath: Request monthly revenue bridge, 2025 actuals, and the internal definition behind the reported $1B figure.
      relatedQuestionRefs:
        - QO014
        - QO025
      relatedTableRefs:
        - TO001
    - type: missing-source
      severity: material
      topic: headcount
      missingEvidence: Current employee headcount and functional distribution across operations, engineering, clinical, and sales.
      whyItMatters: Headcount is needed to assess operating leverage, fixed-cost burn, and whether the company can support its expanded employer and health-system motions.
      diligencePath: Request current org chart and monthly headcount trend by function and geography.
      relatedQuestionRefs:
        - QO015
      relatedTableRefs:
        - TO001
    - type: conflicting-data
      severity: material
      topic: visits
      missingEvidence: A reconciled definition for annual visits, lifetime appointments, unique people served, and what exactly counts as a delivered visit.
      whyItMatters: Conflicting scale numbers can cascade into market-share, efficiency, and valuation work later in the report.
      diligencePath: Ask management for metric definitions and a 2024-2026 KPI bridge showing unique users, visits, and appointments.
      relatedQuestionRefs:
        - QO013
        - QO025
      relatedTableRefs:
        - TO001
        - TO004
    - type: private-evidence-only
      severity: minor
      topic: litigation
      missingEvidence: Underlying complaints, settlement posture, and internal assessments for the visible Grow Care litigation and labor-risk allegations.
      whyItMatters: Public docket metadata confirms activity but does not reveal merits, reserve exposure, or whether the issues are isolated.
      diligencePath: Run counsel-led legal diligence on complaint filings, reserve analysis, insurance coverage, and any employment-classification review.
      relatedQuestionRefs:
        - QO023
      relatedTableRefs:
        - TO004
