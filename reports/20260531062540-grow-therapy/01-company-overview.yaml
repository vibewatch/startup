company:
  name: Grow Therapy
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Grow Therapy is a New York-based, late-stage private mental-health platform founded in October 2020 that combines
    therapist practice-enablement software with insurance-backed patient acquisition and newly launched employer and
    health-system channels. Public evidence supports strong network scale and major March 2026 financing momentum, but
    revenue, headcount, board composition, and a few operating metrics remain imperfectly disclosed or internally
    inconsistent, creating clear follow-up diligence asks.
sections:
  - id: identity-business-model
    title: Identity, footprint, and business model
    body: >-
      Grow Therapy was founded in October 2020 and is headquartered in New York City, with public location evidence
      pointing to 122 East 42nd Street while the careers page also references hubs in New York, San Francisco, and
      Seattle plus a remote team. The company describes itself as a mental-health platform that helps people find
      in-person or virtual therapy and psychiatric care while also providing the underlying administrative stack that
      lets independent clinicians accept insurance and run their practices. That two-sided model is the core of Grow's
      differentiation: on the consumer side it promises fast matching, broad insurance acceptance, and average
      out-of-pocket cost around $21 per visit; on the provider side it handles credentialing, claims, billing, EHR,
      telehealth, marketing, and care-coordination functions that would otherwise sit with small practices. By 2026 the
      company had widened that model into employer and health-system channels, creating a three-sided platform in which
      payors, employers, and referral partners all direct demand into the same provider network.
    claimRefs:
      - CO001
      - CO002
      - CO007
      - CO008
      - CO024
      - CO029
      - CO030
      - CO032
      - CO036
    tableRefs:
      - TO001
    figureRefs:
      - FO002
  - id: leadership-governance
    title: Founders, leadership, and governance
    body: >-
      Grow Therapy remains clearly founder-led. Public sources consistently identify Jake Cooper as CEO and co-founder,
      Alan Ni as co-founder and CTO, and Manoj Kanagaraj, M.D., as co-founder and chief strategy officer, giving the
      company continuity at the top through its Series D stage. The publicly visible leadership bench is thinner than
      the company's scale would suggest, but the reviewed materials do name enterprise and clinical leaders such as Julie
      Harris and Cynthia Grant around new employer and measurement-informed-care programs. What is missing is equally
      important: the company's accessible official pages do not publish a full current board roster, governance charter,
      or other detailed board-level disclosures. That opacity does not by itself indicate a governance failure, but it
      does raise key-person dependence because the founder trio still appears to carry strategy, product, and technical
      authority while outside governance rights must be inferred indirectly from financing history and repeat lead
      investors.
    claimRefs:
      - CO003
      - CO004
      - CO005
      - CO006
      - CO017
      - CO029
      - CO037
      - CO038
    tableRefs:
      - TO002
  - id: funding-scale
    title: Funding history, investors, and verified scale
    body: >-
      Grow Therapy's capital path is unusually well signposted for a private company. It raised a $15 million Series A
      in 2021, a $75 million Series B in 2022, an $88 million Series C in 2024, and a $150 million Series D in March
      2026. The March 2026 round was led by repeat backer TCV and Growth Equity at Goldman Sachs Alternatives, added new
      investors BCI and Menlo Ventures, and took cumulative capital raised to a company-stated $328 million. Multiple
      outlets also tied the round to a roughly $3 billion valuation, but that valuation remains press-reported rather
      than formally disclosed in any filing. Scale claims are large and mostly company-sourced: 26,000 providers,
      125-plus health-plan partners, roughly 220 million covered lives, more than two million people served, and seven
      million visits in 2025. Revenue is less solid. Behavioral Health Business and HIT Consultant each reported about a
      $1 billion revenue or run-rate figure, but both rely on company communications and no audited public financials
      were located. Headcount is even less transparent; reviewed public materials show office hubs but not a current
      employee total.
    claimRefs:
      - CO009
      - CO010
      - CO011
