coverageNotes: |
  This report was produced on 2026-05-31 using publicly available sources only. Grow Therapy is a
  private company, so audited financial statements, gross margin, burn, payer concentration, board
  governance detail, and round-term economics are not publicly disclosed. Public 2026 sources support
  the March 2026 $150 million Series D, roughly $3 billion valuation, 26,000-plus clinician network,
  125-plus payer footprint, 220 million covered lives, and seven million 2025 visits. The widely
  cited ~$1 billion revenue figure is press-reported and not reconciled to a public GAAP definition,
  so valuation conclusions remain sensitive to revenue-quality interpretation.

