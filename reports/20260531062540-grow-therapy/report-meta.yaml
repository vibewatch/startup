companyProfile:
  summary: |
    Grow Therapy is a New York-based mental-health platform founded in 2020 by Jake Cooper, Manoj
    Kanagaraj, and Alan Ni. The company combines an insurance-backed patient marketplace with a
    provider operating system that handles credentialing, payor enrollment, billing, claims,
    documentation, telehealth, and scheduling for therapists and psychiatric prescribers. Its March
    2026 Series D pushed total funding to $328 million and funded expansion beyond the core insurer
    and provider marketplace into employer, health-system, and primary-care referral channels.
  foundedDate: "2020-10-01"
  founders:
    - name: Jake Cooper
      role: Co-Founder & CEO
      claimRefs: [CO004]
    - name: Manoj Kanagaraj
      role: Co-Founder & Chief Strategy Officer
      claimRefs: [CO006]
    - name: Alan Ni
      role: Co-Founder & CTO
      claimRefs: [CO005]
  foundingLocation: null
  headquarters: "New York, New York"
  productSummary: |
    Grow Therapy sells two linked products: a consumer marketplace for in-network therapy and
    psychiatry, and a provider operating platform for independent clinicians. The clinician stack
    covers credentialing, payor enrollment, insurance verification, claims, invoicing, EHR,
    telehealth, documentation, and AI-assisted note workflows.
  customerFocus: |
    Patients seeking insurance-backed mental-health care, independent therapists and psychiatric
    prescribers, health plans, employers, and health systems or primary-care partners that need
    referral continuity into behavioral health.
  businessModel: |
    Grow is primarily paid when in-network providers deliver reimbursed care, with newer employer and
    health-system channels designed to add utilization and continuity rather than pure seat-based
    software revenue. The model blends marketplace demand generation, administrative enablement, and
    payer-linked transaction economics.
  stage: Series D
  fundingStatus: "$150M Series D in March 2026 at roughly $3B valuation; $328M total capital raised."
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO007, CO008, CO010, CO012, CO013]

