callouts:
  - calloutType: strength
    title: Insurance-native workflow depth is the core product advantage
    body: >-
      Grow has public evidence for a real operating stack: credentialing, rates, claims handling, telehealth, notes,
      measures, and care coordination all sit in one clinician workflow instead of being left to a patchwork of outside
      tools.
    claimRefs:
      - CE005
      - CE010
      - CE016
      - CE021
      - CE024
  - calloutType: strength
    title: AI is embedded with review gates rather than sold as a free-floating chatbot
    body: >-
      The strongest AI evidence is not marketing copy but workflow control: opt-in consent, provider approval before
      sharing, pause controls, zero-retention terms, and safety alerts for Coach all point to a provider-led product
      design.
    claimRefs:
      - CE027
      - CE028
      - CE030
      - CE031
      - CE032
      - CE042
  - calloutType: risk
    title: Public diligence still cannot fully underwrite interoperability or reliability
    body: >-
      Grow publishes more trust detail than many peers, but reviewed sources still do not reveal a public API surface,
      vendor-level architecture map, Grow-specific security attestation, or uptime SLA. Independent reviews also show
      billing and support friction that could matter at scale.
    claimRefs:
      - CE043
      - CE044
      - CE046
      - CE047
