  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Grow solution
      - Measurable benefit
      - Limitation
    rows:
      - - Find an in-network therapist or prescriber
        - Search across state, insurance, and specialty; book online.
        - Patient marketplace and portal surface filter, book, and manage care in one flow.
        - Official surfaces repeatedly cite ~2-day starts and ~$21 average insured visits.
        - Public evidence does not disclose search-to-book conversion or provider acceptance rates.
      - - Join insurance networks quickly as a clinician
        - Credential into Grow group contracts before opening full portal access.
        - Grow handles payor enrollment and exposes status, referrals, and rates in portal workflows.
        - Reduces solo-practice startup friction versus DIY credentialing.
        - Provider remains dependent on Grow contracts and operational timelines.
      - - Run a secure virtual session
        - Open telehealth room from the portal and admit clients from browser links.
        - Integrated video, chat, captions, client info, attendance, and screen sharing.
        - No separate telehealth tool or download is required for clients.
        - Browser performance and Grow platform availability still gate reliability.
      - - Document care and maintain continuity
        - Complete notes, session insights, measures, and resource assignment in-platform.
        - AI summaries, psychiatry note templates, therapy toolkit, and recurring check-ins support the clinical loop.
        - Provider can stay in one system from visit to follow-up tasking.
        - AI note flows are limited by consent, language, and workflow scope.
      - - Get paid for insurance work
        - Grow verifies insurance, submits claims, manages denials, and collects payments.
        - RCM workflow shows expected payouts and Grow-managed appeals / follow-up.
        - Grow says guaranteed insurance payouts reduce provider cash-flow risk.
        - No public disclosure on claim turnaround distribution, appeal success rate, or clearinghouse vendors.
      - - Escalate to higher-acuity or specialty care
        - Provider submits request after at least one session.
        - Care Coordination routes clients to HLOC or specialty partners and helps with insurance navigation.
        - Adds a structured path beyond one-to-one outpatient care.
        - Program excludes inpatient emergencies and public partner list is incomplete.
    notes: >-
      Benefits are workflow-level and often company-claimed; missing denominators or private operational KPIs are called
      out explicitly in the limitation column.
    claimRefs:
      - CE002
      - CE007
      - CE010
      - CE015
      - CE016
      - CE018
      - CE021
      - CE024
      - CE026
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process
      - Role
      - Evidence
      - Dependency
      - Risk
    rows:
      - - Consumer acquisition and matching
        - Capture care intent, insurance, specialty, and availability to route patients to clinicians.
        - >-
          Homepage, How it Works, and independent review pages describe state / insurance / specialty filtering and
          instant booking.
        - Grow-controlled web marketplace plus insurer / partner demand.
        - No public API or ranking-logic disclosure; quality of matching is hard to underwrite externally.
      - - Provider portal and scheduling
        - Operate referrals, client charts, appointments, invoicing, and earnings from one dashboard.
        - Provider-portal and calendar help articles document dashboard, referrals, and appointment controls.
        - Credentialing completion and Grow account access.
        - If portal logic fails, clinicians lose a large share of operational control.
      - - Revenue-cycle engine
        - Verify eligibility, submit claims, manage denials, and present expected payouts.
        - RCM article details Grow-managed verification, submission, denial handling, and payout views.
        - Payor contracts, coding accuracy, and insurer adjudication.
        - Public evidence is process rich but vendor and SLA detail poor.
      - - Telehealth media layer
        - Run synchronous sessions, waiting room, chat, captions, and screen share.
        - Grow Telehealth docs show browser-based room links, live captions, and integrated client info.
        - Modern browsers, device hardware, and Grow platform uptime.
        - Performance is sensitive to browser / network quality and Grow-specific outages.
      - - Clinical documentation and measures
        - Store notes, recurring assessments, psychiatry templates, and partner-specific measure rules.
        - Prescriber-notes, measurement, and Kaiser-required-measures docs describe structured workflows.
        - Provider documentation quality and payer / partner rules.
        - No public schema, export tooling, or detailed interoperability model.
      - - AI assistance layer
        - Generate summaries, note suggestions, Session Insights, and between-session support.
        - AI FAQ, privacy FAQ, AI paper, and press coverage show optional, provider-reviewed workflows.
        - OpenAI / Anthropic processors plus Grow governance and consent flows.
        - Accuracy, rollout depth, and clinical impact are only lightly quantified publicly.
      - - Enterprise / partner workflow layer
        - Bridge EAP to insurance and connect primary care / payors to Grow providers.
        - Employer, physician, Kaiser, and Series D materials describe EAP rollover, referrals, and measure automation.
        - Partner contracts, payer rules, and implementation work with employers / health systems.
        - >-
          Public evidence shows integration intent and some product rules, but not contract economics or close-loop
          metrics.
    notes: >-
      This is an operating-model architecture reconstructed from public documentation rather than a vendor or service
      diagram published by Grow.
    claimRefs:
      - CE006
      - CE010
      - CE016
      - CE024
      - CE027
      - CE039
      - CE046
  - id: TE004
    title: Trust / quality / compliance table
    columns:
      - Control / metric
      - Status
      - Scope
      - Source-backed detail
      - Gap
    rows:
      - - Encryption
        - Disclosed
        - Platform-wide
        - TLS 1.2+ in transit and AES-256 at rest are stated on the trust page.
        - No reviewed key-management or tenant-isolation architecture detail.
      - - Access controls
        - Disclosed
        - Employee / contractor access
        - Role-based access, MFA, and least-privilege principles are explicitly stated.
        - No public admin-audit trail, SSO, or customer-facing access-reporting details.
      - - Testing and monitoring
        - Disclosed
        - Security operations
        - >-
          Grow cites regular vulnerability assessments, annual third-party penetration testing, and monitoring /
          logging.
        - No public remediation cadence, incident history, or uptime reporting.
      - - HIPAA and vendor governance
        - Disclosed
        - PHI handling and subprocessors
        - BAAs / DPAs, third-party HIPAA risk assessments, and zero-retention AI processor terms are stated publicly.
        - No Grow-specific SOC 2, HITRUST, or equivalent attestation was located.
      - - Telehealth consent and session storage
        - Disclosed
        - Virtual visits
        - Telehealth is voluntary, sessions are not stored, and informed consent is collected before first appointment.
        - No public evidence of a status page, recovery-time target, or business continuity SLA.
      - - AI consent and review
        - Disclosed
        - AI documentation features
        - >-
          AI summarization is optional, requires provider and client consent, and allows pause / review before anything
          is shared.
        - Provider cannot toggle consent per client or per session before a session begins.
      - - Reliability remediation
        - Disclosed
        - Outage handling
        - Grow publishes troubleshooting guidance and a compensation path for platform-caused missed sessions.
        - Policy is discretionary and excludes third-party outages, so true uptime burden still needs diligence.
      - - Independent quality feedback
        - Mixed
        - Patient and provider experience
        - >-
          Independent reviews praise ease of use and insurance handling but also cite billing / support friction and
          auto-cancellation complaints.
        - Complaint counts and resolution metrics are not published by Grow itself.
    notes: >-
      Trust controls are based on Grow's own trust-center and help pages plus independent review coverage; absence of a
      control in this table should not be read as evidence that it does not exist internally.
    claimRefs:
      - CE020
      - CE041
      - CE042
      - CE043
      - CE044
      - CE046
      - CE047
