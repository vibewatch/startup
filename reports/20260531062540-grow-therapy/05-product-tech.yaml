  evidenceGaps:
    - type: missing-source
      severity: material
      topic: interoperability
      missingEvidence: A vendor-level map of Grow's EHR, claims-clearinghouse, partner data-exchange, and any public API surface.
      whyItMatters: >-
        Without those details, it is hard to underwrite interoperability costs, export risk, and how deeply employer /
        health-system workflows are truly integrated.
      diligencePath: >-
        Ask management for architecture diagrams, integration inventory, API / webhook docs, and examples of partner
        data exchanged with employers, Kaiser, and Circle Medical.
      relatedQuestionRefs:
        - QE011
        - QE023
        - QE025
      relatedTableRefs:
        - TE003
    - type: private-evidence-only
      severity: material
      topic: security-assurance
      missingEvidence: Grow-specific SOC 2, HITRUST, penetration-test summary, uptime SLA, incident metrics, or a public status page.
      whyItMatters: >-
        Trust-center summaries are helpful, but investors still need independent assurance artifacts and service-level
        evidence before relying on security and reliability claims.
      diligencePath: >-
        Request the latest security packet, third-party attestation reports, business continuity / incident response
        documentation, and customer-facing uptime commitments.
      relatedQuestionRefs:
        - QE017
        - QE025
      relatedTableRefs:
        - TE004
    - type: private-evidence-only
      severity: material
      topic: partner-performance
      missingEvidence: >-
        Closed-loop referral conversion, EAP-to-insurance rollover rates, employer ROI, Kaiser measure compliance, and
        Circle Medical referral completion metrics.
      whyItMatters: >-
        These metrics determine whether Grow's enterprise integrations are a real product moat or still an early
        go-to-market narrative.
      diligencePath: >-
        Request partner scorecards, implementation playbooks, and the KPI dashboard used to manage employer, Kaiser, and
        Circle Medical relationships.
      relatedQuestionRefs:
        - QE010
        - QE011
        - QE015
      relatedTableRefs:
        - TE005
    - type: conflicting-data
      severity: minor
      topic: ai-scale
      missingEvidence: >-
        A reconciled denominator for 17,000 AI-enabled providers, 21,000-provider 2025 network size, and 26,000+ 2026
        network scale.
      whyItMatters: >-
        Different public denominators make it hard to compare AI adoption, rollout depth, and the share of the network
        using Grow's full suite of tools.
      diligencePath: >-
        Ask product leadership for a dated rollout bridge that separates total providers, full-suite providers,
        AI-eligible providers, and active AI users.
      relatedQuestionRefs:
        - QE015
        - QE026
      relatedTableRefs:
        - TE005
    - type: missing-source
      severity: minor
      topic: mobile-parity
      missingEvidence: >-
        A public Android app surface or a feature-parity matrix across web, iPhone, minors, Kaiser clients, and excluded
        geographies.
      whyItMatters: >-
        Mobile constraints can matter for patient engagement and enterprise implementations, but the public mobile story
        remains iPhone-centric and selectively available.
      diligencePath: >-
        Request a platform matrix showing web / iOS / Android support, feature parity, and eligibility rules by plan,
        state, and age cohort.
      relatedQuestionRefs:
        - QE016
        - QE024
      relatedTableRefs:
        - TE001
