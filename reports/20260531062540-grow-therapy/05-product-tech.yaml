  - id: ai-enterprise-integrations
    title: AI workflows, enterprise channels, and integration depth
    body: >-
      Grow's most differentiated product claims now sit in AI-assisted workflow and enterprise channel expansion. The AI
      layer includes consent-based ambient note drafting, provider-reviewed Session Insights, measurement-informed care
      prompts, between-session reflections, and Coach, an AI support tool that providers can monitor by default and that
      can automatically surface crisis resources and disable itself when safety concerns appear. The official
      AI-responsibility paper makes the product philosophy explicit: AI is supposed to extend care inside the
      therapeutic relationship rather than replace it. That positioning is reinforced by privacy FAQs describing
      zero-retention third-party processors and by help-center flows showing pause controls, review steps, and clinician
      approval gates. Outside the room, 2026 product expansion centers on employer EAP rollover and primary-care /
      health-system referrals. Series D coverage tied Grow's roadmap to direct integrations with Circle Medical and
      payer / employer continuity, while Kaiser-specific measure automation shows that at least some partner workflows
      are implemented as product rules inside Grow rather than handled manually. The platform therefore appears to be
      moving from marketplace plus admin software toward a broader care-orchestration layer, although public evidence on
      API depth, referral close-loop metrics, and customer-specific integrations remains thin.
    claimRefs:
      - CE027
      - CE028
      - CE029
      - CE030
