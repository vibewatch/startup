      - FE003
      - FE004
  - id: trust-reliability-constraints
    title: Trust, reliability, and technical constraints
    body: >-
      Grow has become more explicit in 2026 about security and trust controls than many digital-mental-health peers, but
      the public package is still a trust-center summary rather than a deep assurance file. Reviewed pages disclose
      encryption in transit and at rest, role-based access controls, MFA, AWS hosting in the United States, annual
      penetration testing, HIPAA training, BAAs / DPAs, third-party HIPAA assessments, and AI processor zero-retention
      terms. Telehealth and AI consent flows also show concrete product controls: sessions are not stored, AI
      summarization is optional, transcription can be paused, and providers must approve anything sent to clients.
      Reliability evidence is mixed. Grow publishes troubleshooting steps and a provider-compensation policy for
      outage-related missed sessions, which suggests mature incident handling. But it does not publish a public status
      page, an uptime SLA, or a Grow-specific SOC 2 / HITRUST-style attestation on the reviewed pages. Independent
      reviews reinforce that product risk is mostly operational rather than purely feature-related: patients praise
      affordability and insurer handling but still report billing friction, while provider reviews describe real value
      from credentialing and built-in tools alongside complaints about auto-cancellations, support quality, and control
      over records or billing identity.
    claimRefs:
      - CE041
      - CE042
      - CE043
      - CE044
      - CE046
      - CE047
    tableRefs:
      - TE004
tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - Module / asset
      - Primary user
      - Status / maturity
      - Differentiation
      - Diligence gap
    rows:
      - - Insurance-backed therapist marketplace
        - Patients
        - Mature / live
        - Insurance and specialty filters plus fast booking compress the search-to-care path.
        - No public conversion funnel or retention cohort by acquisition channel.
      - - Medication management / prescriber network
        - Patients and prescribers
        - Live but state / license dependent
        - Extends the same insurance-backed flow into psychiatric medication management.
        - No public prescriber-count split, state coverage map, or refill / follow-up adherence metrics.
      - - Provider practice OS
        - Independent clinicians
        - Mature / core
        - Credentialing, claims, telehealth, invoicing, rates, and referrals are unified in one portal.
        - No public vendor map for EHR, clearinghouse, or export tooling.
      - - Telehealth + client portal + iOS app
        - Patients and providers
        - Mature with eligibility gates
        - Browser join, secure waiting room, captions, messaging, forms, and between-session resources sit in one stack.
        - No reviewed Android surface and some iOS features exclude minors, Kaiser clients, and some states.
      - - Measurement-informed care + therapy toolkit
        - Providers and clients
        - Current / expanding
        - Recurring measures, progress visualization, and assignable vetted resources are built into workflow.
        - No public feature-level outcomes benchmark or completion-rate disclosure.
      - - AI documentation + Session Insights
        - Providers and clients
        - Current / opt-in
        - Ambient note drafts and provider-reviewed summaries reduce admin burden without auto-sending.
        - No external accuracy audit, benchmark set, or model-by-model performance disclosure.
      - - Coach + between-session reflections
        - Clients with provider oversight
        - Controlled rollout
        - Provider-visible between-session support with safety alerts and editable sharing keeps AI inside care.
        - Eligibility limits and rollout denomi­nators are public, but sustained engagement / outcome deltas are not.
      - - Enterprise / partner surfaces
        - Employers, payors, physicians, health systems
        - Launching / expanding
        - >-
          EAP rollover, primary-care referrals, and Kaiser-specific measures show deeper workflow embedding than
          marketing alone.
        - No public contract economics, referral-close rates, or implementation timelines by partner.
    notes: >-
      Rows synthesize official product pages, help-center documentation, and partner / independent coverage; maturity
      reflects publicly visible workflow depth, not internal code quality or enterprise deployment counts.
