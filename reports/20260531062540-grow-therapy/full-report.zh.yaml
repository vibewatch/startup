  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 患者与服务者产品界面
        blocks:
          - type: paragraph
            body: >-
              Grow Therapy
              的入口是围绕保险搭建的消费者搜索和预约市场，而不是自费订阅。患者路径从州、照护类型和保险筛选开始，再按专科、身份和可约时间收窄，然后即时或近即时预约。公开材料一贯把谈话治疗和用药管理都呈现为核心产品，线下与线上模式归于同一品牌，并提供客户门户
              / iPhone App，用于预约管理、安全消息、表格和疗程间资源。产品另一半是面向独立临床服务者而非雇员的服务者操作系统。Grow
              把这个界面营销为基础设施，让治疗师和处方医生在保持临床自主的同时，外包资质认证、支付方入网、账单、理赔、文书和远程医疗。因此，公司的真实产品更接近保险原生的心理健康运营层，而不是简单目录。代价是，Grow
              成为入驻、排期、报销和许多患者触点的工作流所有者；一旦平台不可用或临床服务者离开，就会引出互操作性、控制权和连续性方面的尽调问题。
