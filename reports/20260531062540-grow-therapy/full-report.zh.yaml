        - 验证服务方首次完成资质认证后的激活、留存和就诊爬坡
      - - 心理健康短缺地区和 48 天等待时间
        - 逆风
        - 当前
        - 临床医生密度不足地区需求仍然高企
        - 即使市场能拉动需求，预约供给仍受限
        - 将 Grow 的填充率和本地密度与短缺地区基准对比
      - - 公共付款方参与度低和报销压力
        - 逆风
        - 当前至 FY2026
        - Medicaid 费率增速放慢，精神科医生仍不太愿意接收新的 Medicaid 患者
        - 公共项目扩张可能让受保需求增长快于愿意承接的服务方供给
        - 按业务线索取各州报销和服务方参与数据
      - - 网外流失和精神科网络密度不足
        - 逆风
        - 当前
        - 行为健康保障往往仍卡在可用网络层面
        - 给 Grow 创造获客机会，也暴露供给匹配有多难
        - 按市场和专科测算实际网内服务方可用性
      - - Grow 经济性公开数据缺口
        - 尽调精度约束
        - 当前
