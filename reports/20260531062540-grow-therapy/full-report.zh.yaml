companyProfile:
  summary: >
    Grow Therapy 是一家总部位于纽约的心理健康平台，由 Jake Cooper、Manoj Kanagaraj 和 Alan Ni 于 2020
    年创立。公司把有保险覆盖的患者市场与服务者运营系统结合起来，为治疗师和精神科处方医生处理资质认证、支付方入网、账单、理赔、文书、远程医疗和排期。2026 年 3 月的 Series D 将累计融资推至 $328
    million，也为公司从核心的保险方和服务者市场延伸到雇主、医疗系统和初级保健转诊渠道提供资金。
