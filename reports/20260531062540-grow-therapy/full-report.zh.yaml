  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、报销与执照风险敞口
        blocks:
          - type: paragraph
            body: >-
              Grow 所处的医疗细分监管尤其重，因为它不只是线索生成目录。其法律文件将 Grow Care 描述为支持关联「Grow Professionals」的行政服务实体；公开运营页面则显示，其 26,000+
              临床医生网络覆盖 125+ 保险方、Medicare、Medicaid、美国 50 个州，以及约 2.2
              亿受保人群。这种组合意味着，即便关联临床医生仍是直接照护提供者，公司也要承受州执照规则、支付方文档规则、平价要求和远程医疗政策变化的广泛敞口。


              最重要的近期政策风险是心理健康平价下的报销行为。Department of Labor 表示，2024 年 MHPAEA 终局规则的适用日期在 2025 和 2026
              年，但诉讼推进期间，监管机构目前不执行新条款，且追加 18 个月。这并不是风险解除。Grow 自己的账单 FAQ
              仍强调拒赔、预授权问题、医疗必要性争议和网络限制，这意味着，即便联邦暂停期内，平台仍暴露在平价驱动的计划重设计、理赔编辑和利用管理选择之下。


              各州碎片化仍然重要。Grow 的支付方费率材料按支付方、州和执照类型筛选；扩张到更多州取决于有效执照或有效申请。与此同时，DEA 和 HHS 仅将受控物质远程医疗弹性延长至 2026
              年底，药物管理规则仍是临时而非定型。再加上 2023 年一桩公开的数字无障碍诉讼，结论是：Grow 的法律和报销风险是现实、多元且运营性的，不是假设。
