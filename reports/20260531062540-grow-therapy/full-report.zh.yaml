      - number: '4.5'
        title: 尽调阻碍与反向信号
        blocks:
          - type: paragraph
            body: >-
              最大的阻碍不是需求，而是披露质量。公开证据没有提供经审计财务报表、收入确认备忘录、渠道组合、毛利率、CAC、LTV、支付方集中度、理赔拒付率或现金跑道细节。这意味着，即使看似温和的 3x 估值 /
              收入框架，也只在一种收入主张解释下成立，在另一种解释下可能严重误导。资本故事同样不完整，因为最新轮次没有与来源 SEC 历史中可见的 2026 年 Form D 对上。


              反向表面信号真实存在，尽管仍有限。Grow Care 在 2023
              年面临一起无障碍诉讼。公司也维护了一个针对意外收费和保险覆盖争议的纠纷流程，说明账单摩擦是活跃运营问题。一份独立服务者评价综合报告提到自动取消、账单 ID
              混乱、支持不一致和转诊波动；这些说法相较申报文件可信度较低，但方向上相关，因为保险支持型市场依赖供给端信任。最后，Talkspace
              的公开可比公司申报显示，报销压力和支付方降本仍是保险挂钩行为健康模式中的真实风险。在管理层通过 NDA 补上这些数据缺口之前，Grow 的财务章节只能支持继续尽调，不能构成完整承保文件。
