      - number: '7.3'
        title: 合作伙伴、连续性与竞争结构风险
        blocks:
          - type: paragraph
            body: >-
              Grow 的商业模型与保险方和伙伴工作流紧密耦合。MedCity 称，当网内 Grow
              服务提供者接诊患者时，公司获得付费；雇主页面则表示，对雇主的卖点是连续性：雇主资助疗程结束后，会员应通过自己的健康保险继续留在同一名服务提供者那里。这是有吸引力的切入口，因为它同时降低雇主和患者的流失。但它也把支付方参与和网络充足性变成核心依赖。计划重新定价、福利重设计或覆盖收窄，不只是打击抽成率；它会打断
              Grow 在雇主销售中最差异化的连续性承诺。


              竞争格局在规模端也更集中。Headway 营销的保险覆盖网络远大于 Grow；Spring Health 完成与 Alma 的合并后称，已在雇主和健康计划中触达超过 1.7
              亿受保人群。上市公司可比样本显示，Talkspace 和 Teladoc/BetterHelp 仍在雇主、支付方或直客渠道上全国化运营。换句话说，Grow
              不再只是同薄弱本地诊所竞争；它面对的是资金更充足的平台，这些平台能把资质认证、产品和转诊成本摊到更大的会员或临床医生基数上。


              伙伴扩张有利有弊。Behavioral Health Business 称，Grow 正把 Series D 推进与 Circle Medical
              和更广泛的医疗系统集成绑定，这可能加深转诊流和开方医生协同。但初级保健、心理健康服务提供者、支付方规则和雇主福利之间每增加一次交接，就多一个数据共享、执照、福利设计和文档假设可能失效的位置。市场在奖励宽度，但宽度也在抬高
              Grow 的依赖负荷。
