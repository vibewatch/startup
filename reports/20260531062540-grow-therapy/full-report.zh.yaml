      - number: '8.5'
        title: 必须成立的条件、下行风险与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              要让 Grow 当前价格成立，三件事必须为真。第一，报告的 $1 billion 指标必须足够贴近净收入，避免公司实际是在一个隐藏的高个位数或两位数倍数上交易。第二，支付方续约和风险合同必须证明，Grow
              能推进基于价值的安排，而不会把自己暴露在广泛报销压缩之下。第三，雇主和医疗系统渠道必须在增加实施、合规和支持成本之前，更快提升客户终身价值和转诊连续性。若这些条件成立，今天的价格对一轮后期战略增长融资来说，可能是公平到略有吸引力。


              下行风险恰好集中在公开证据不透明的领域。Grow 已经有外部账单和保险投诉、一条公开诉讼信号，并且没有披露 2026 年轮次条款。Alma 和 Headway 等相邻平台已经遭遇 Optum
              费率压力，证明保险方关联心理健康经济性会突然重估。报销敏感性叠加披露有限，正是本章停在继续研究，而不是给出干净买入的原因。最终尽调清单不是锦上添花；它是判断所报告 $3 billion
              标记究竟符合市场、悄悄偏满，还是相对 Grow 当前声称的规模其实过低的最低证据。
