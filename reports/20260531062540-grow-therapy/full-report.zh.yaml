            body: 投资者可以争论 $3 billion 是否公平，但仍不知道 2026 年轮次是否包含老股交易、高级清算优先权或其他改变真实经济性的保护条款。在这个阶段，隐藏的条款复杂性可能比几个收入倍数点的标题差异更重要。
