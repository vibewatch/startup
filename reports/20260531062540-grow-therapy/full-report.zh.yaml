  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: Grow 最大风险渠道如何流入临床医生供给、患者连续照护、收入质量和估值支撑。
    approximationNotes: 该图展示分析师基于已披露业务机制推断的因果链，并非管理层批准的流程图。
    claimRefs:
      - CR021
      - CR022
      - CR024
      - CR025
      - CR026
      - CR045
      - CR048
    data:
      nodes:
        - id: N1
          label: 平价法或支付方重定价
          description: 保险计划收紧报销、医疗必要性规则或网络行为，速度快过 Grow 的抵消能力。
        - id: N2
          label: 临床医生报酬压力
          description: 报销质量下降或无瑕疵理赔处理变慢，会降低 Grow 经济账对临床医生的吸引力。
        - id: N3
          label: 网络连续性侵蚀
          description: 临床医生可约性或连续照护断裂，会削弱雇主到保险承接的承诺。
        - id: N4
          label: 雇主和支付方信任流失
          description: 连续照护失败、审计问题或服务摩擦，会让 Grow 在买方沟通中更难显出差异。
        - id: N5
          label: 收入质量承压
          description: 就诊量、抽成质量和转化假设会同时走弱。
        - id: N6
          label: 估值压缩风险
          description: 没有干净的收入质量和运营证明，高溢价私募估值就更难守住。
      edges:
        - from: N1
          to: N2
          label: 重定价改变临床医生经济账
        - from: N2
          to: N3
          label: 吸引力下降会削弱供给密度或连续性
        - from: N3
          to: N4
          label: 连续照护一断，买方承诺就变弱
        - from: N4
          to: N5
          label: 信任下降拖慢使用率和销售转化
        - from: N5
          to: N6
          label: 增长质量变软，压低倍数支撑
        - from: N1
          to: N5
          label: 报销质量直接打到收入
        - from: N3
          to: N5
          label: 临床医生可约性下降会削减就诊吞吐量
