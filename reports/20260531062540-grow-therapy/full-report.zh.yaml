      - number: '8.4'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              基准情景并不是 Grow 便宜；而是如果几个尚未证明的假设同时成立，Grow 有可能守住大致当前估值。最重要的假设是：公开 $1 billion
              指标大多是净收入；支付方续约足够稳定，不会触发大范围报销重置；雇主和医疗系统扩张能够提高留存利用，而不需要牺牲利润率的企业服务层。在这个框架下，以当前 $3 billion
              标记为中心的估值区间可以辩护，并可能小幅扩张。


              乐观情景取决于渠道质量，而不只是量。如果 Grow 较新的雇主和初级保健转诊路径实质性改善照护连续性、巩固支付方关系，并保持更像软件赋能基础设施、而不是重服务病例管理的经济性，公司可能在未来 24-36 个月长到
              $4.0-$5.5 billion 估值区间。悲观情景更近，也比标题规模叙事暗示的更可信。如果 $1 billion 数字更接近总理赔流水而非净收入，或类似 Optum 2024 年降费的报销压力打到 Grow
              的保险方关联模型，同一家公司可能看起来只是 $1.2-$1.8 billion 资产，并面临真实下轮压力。情景分布很宽，因为披露质量仍是约束变量。
