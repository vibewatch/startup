      - number: '2.3'
        title: 买方、用户和支付方分层
        blocks:
          - type: paragraph
            body: |2-
                              Grow 服务的是一个真正多边的市场。商业健康险计划是最清楚的经济买方，因为 Grow 销售的是网络充足性、可及速度和可衡量的行为健康结果。雇主是第二层买方，但通常是延展而不是替代保险关系：雇主产品资助增量咨询、报告和推广支持，然后把成员交回网内渠道。服务者在实践意义上也是买方，因为他们采用 Grow，是为了在保持独立的同时外包资质认证、理赔、账单和支付方入网。患者是终端用户，选择 Grow 是因为它呈现保险接受情况、直接排期，以及整合的心理治疗加用药支持，而不是订阅聊天或纯自费照护。

                              Medicare Advantage 和 Medicaid 很重要，因为它们把支付方组合扩展到商业保险成人之外，并创造更大的价格敏感型需求池，但它们也带来更难的报销和参与经济性。因此，健康险计划、雇主、服务者和患者优化的是不同结果：支付方要网络充足性和结果，雇主要可及福利和 ROI，服务者要降低行政负担并填满更多排期，患者要更快、更可负担、保险摩擦更少的访问。正是这种分层，让 Grow 更像一个市场和网络基础设施，而不是单边治疗品牌。
                          
