      - number: '8.3'
        title: 公开与私募可比框架
        blocks:
          - type: paragraph
            body: >-
              公开可比公司给 Grow 划出真实但并不舒服的估值区间。正面看，Talkspace 2026 年以约 $835 million 企业价值卖给 UHS，隐含约 3.6x Talkspace 2025 年收入；如果
              Grow 的 $1 billion 指标是净收入，这略高于 Grow 标题 3.0x 倍数。负面看，Teladoc 2026 年 5 月市值约 $1.37 billion，MarketScreener 的
              EV/revenue 比率约 0.59x，说明增长放慢或分部质量参差时，公开市场能把多元化虚拟照护资产压缩到多低。BetterHelp 自身 2026 年 Q1
              收入下滑也强化了这一点：行为健康需求不会自动转化为溢价公开市场倍数。


              私募可比方向上支持，但并不完美。Headway 是披露中最接近的模型可比：一个赋能服务提供者、与保险方相连的平台，2024 年 7 月以 $2.3 billion 估值融资 $100 million，并称有
              34,000 名临床医生使用平台。尽管 Grow 披露的临床医生规模更小，其 2026 年据报道估值更高；只有当 Grow 的报告收入确实遥遥领先，或企业扩张创造了更宽的战略界面时，这才说得通。Alma 与
              Spring Health 说明品类仍在融合，但 2026 年交易条款未披露，不能形成干净定价基准。Lyra 2021 年 $4.6 billion
              峰值估值的价值只在于提醒：以雇主为主导的心理健康估值曾经远高于今天的公开市场终点。
