      - number: '8.2'
        title: 融资背景与隐含倍数
        blocks:
          - type: paragraph
            body: >-
              最新融资容易陈述，却更难尽调确认。Reuters、Grow 自有博客和多家行业媒体都指向 2026 年 3 月由 TCV 和 Goldman Sachs Alternatives 领投的 $150 million
              Series D；累计融资达到 $328 million，估值据报道约 $3
              billion。围绕该轮的公开运营评论显示，公司在原有支付方与服务提供者模型之上叠加雇主和医疗系统扩张；如果渠道经济性好，这一转向有战略意义，因为它可能提高转诊密度和留存。同一证据包还称，Grow
              只按已交付照护向雇主收费，而不是按未使用的覆盖人群收费，这对收入质量方向上有利。


              问题在于，这一轮仍缺少此阶段投资者通常需要的公开条款透明度。Grow 的 SEC 浏览页显示 2021、2022 和 2024 年有 Form D 活动，但截至本次运行日期，没有可见的 2026 年 Form
              D。历史 Form D 金额也无法完全对齐已宣布的 Series A-C
              轮规模，因此公开申报轨迹能证明真实融资活动，却不能给出干净的逐轮法律台账。这留下三个关键估值问题：最新轮是否包含老股交易；普通股之上的清算或参与条款是什么；常被引用的 $1 billion
              收入数字究竟是净收入，还是更广义的流水指标。答案出现之前，标题 3.0x 隐含倍数只能作为工作假设，而不是既定结论。
