      - number: '6.4'
        title: 投诉、摩擦与集中度缺口
        blocks:
          - type: paragraph
            body: >-
              反向信号还没到推翻投资逻辑的程度，但足够一致，不能忽略。BBB 投诉摘要指向账单和服务问题；Healthline 评测也把账单、沟通和保险争议放在前面；负面 App Store
              评论则抱怨爽约费和技术问题。服务提供者侧的反向来源更尖锐。3Zebras 和 Mentalzon
              的独立评论都提到自动取消、人类支持不稳定、法律指引含糊，以及账单身份混乱。这些报告的置信度低于监管文件或监管行动，但方向上重要，因为 Grow 的市场一边扩大支付方和雇主需求，一边也必须留住临床医生信任。


              集中度风险比摩擦风险更难衡量，因为披露稀疏。Fierce 报道称，支付方仍是 Grow 最大的合作伙伴，公司与 25 个 Medicaid 计划合作，且只有 10 个支付方合同处于风险中，占支付方合同总数不到
              10%。这说明支付方覆盖较广，但基于价值的渗透仍有限。与此同时，公开具名证据仍集中在少数关系，本次检索没有任何公开来源披露头部支付方集中度、雇主续约率、服务提供者流失率，或分部
              NRR/GRR。因此，投资者能看到真实需求和工作流契合，但若没有管理层数据，还不足以支撑对集中度或耐久性的判断。
