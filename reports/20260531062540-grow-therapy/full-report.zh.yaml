      - number: '4.3'
        title: 单位经济代理指标与公开可比基准
        blocks:
          - type: paragraph
            body: >-
              公开披露只足以搭建自上而下的情景，无法建立真正的单位经济模型。使用公司发言人口径约 $1 billion 收入，并结合 Grow 披露的 2025 年 7 million 次就诊，隐含单次就诊收入约
              $143。再加上官方 $21 平均客户支付额，说明支付方或雇主资金平均每次就诊可能贡献约 $122。这道算术有信息价值，但并非定论，因为公司没有定义 $1 billion
              数字实际衡量什么。如果它是净收入，2026 年 3 月估值隐含约 3x 收入。如果它是总理赔流水，实际净收入倍数会显著更高。


              公开可比公司有助于框定范围。Talkspace 的支付方占比高的模式在 2025 年至 2026 年 Q1 产生约 41-43% 直接毛利率，并披露明确的按场次支付方确认，以及 PMPM/PPU
              企业合同。Teladoc 的 BetterHelp 展示了另一端：大规模直接面向消费者收入，但广告强度高，付费用户下滑。相对这些可比项，Grow 结构上更像报销和访问促成方，而不是订阅或自费心理健康
              App；但真实抽成率、服务者支付比例和理赔拒付经济性仍是私有信息。
