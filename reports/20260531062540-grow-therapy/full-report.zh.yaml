            body: >-
              Talkspace 2026 年以约 3.6x 收入卖给 UHS，说明成规模心理健康资产仍能拿到不错的战略倍数；Teladoc 约 0.59x EV/revenue
              则说明，公开市场会对增长更慢或质量混杂的远程医疗敞口打多深折扣。在收入质量得到更好证明之前，Grow 处在这两个端点之间。
