      - number: '6.2'
        title: 服务提供者获客引擎与具名客户证据
        blocks:
          - type: paragraph
            body: >-
              Grow 的客户故事依赖持续增加供给，因为只有患者能快速找到网内临床医生，支付方、雇主和医疗系统关系才成立。因此，公开的服务提供者招募话术异常细：Grow 承诺资质认证和支付方入网、账单和理赔支持、EHR
              与远程医疗工具、每周付款、免费 CE、临床咨询、同行社区，以及通过自有目录和雇主路径、Zocdoc 等渠道提供分发帮助。Verifiable
              的独立伙伴证据进一步说明，这不只是营销文案：资质认证案例研究称，周转时间从 60 至 120 天降到 30 天以内，在公司每月入驻超过 1,000 名服务提供者的同时，大多数服务提供者仍能在两周内获批。


              具名客户和伙伴证据真实存在，但仍然集中。Kaiser Permanente 公开引导会员使用 Grow，在两天内获得网内治疗。Fierce Healthcare 和 Grow 官方材料将 Circle
              Medical 标识为首个明确的医疗系统式转诊工作流；Zocdoc 也公开描述了面向参与 Grow
              临床医生的预约集成。这些例子证明，支付方、转诊和渠道侧都有已上线的合作关系；但也暴露了可作为标杆案例的约束：雇主动线被大量描述，且看起来具有战略意义，但本次运行没有找到公开具名雇主客户或续约数据。因此，证据组合比规模叙事实质性更薄。
