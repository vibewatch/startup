      - number: '5.2'
        title: 服务者操作系统与临床工作流
        blocks:
          - type: paragraph
            body: >-
              服务者侧技术栈是最清楚的证据，说明 Grow 正在建设软件基础设施，而不只是做需求生成。临床服务者完成 Grow
              团体合约下的资质认证后，会进入一个门户，里面整合预约、转诊、客户病历、目录设置、开票和收入。收入周期文档写得异常明确：Grow
              称其处理保险核验、理赔提交、拒付管理和收款，同时在门户工作流中呈现预期付款和日期。远程医疗内嵌在平台内，而不是外包出去，包含安全会议链接、出席跟踪、聊天、屏幕共享、实时字幕，并与笔记和客户记录紧密耦合。临床工作流深度也超过普通远程心理治疗。处方医生笔记会从初诊采集和既往文档中自动填充字段；远程精神科指引说明，当用药安全需要外部实验室检查时如何管理；测量驱动照护工具会发送周期性评估并可视化随时间变化的进展。Care
              Coordination 为更高照护层级和专科转诊增加了人工升级路径。合在一起，这些功能让 Grow 看起来更像面向保险型私人执业的轻量心理健康操作系统，而不是薄薄一层市场包装；但它仍让临床服务者依赖 Grow
              的运营和合规引擎。
