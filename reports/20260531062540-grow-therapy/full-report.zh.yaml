      - number: '5.3'
        title: AI 工作流、企业渠道与集成深度
        blocks:
          - type: paragraph
            body: >-
              Grow 最差异化的产品主张，如今落在 AI 辅助工作流和企业渠道扩张上。AI 层包括基于同意的环境式病历草稿、由服务提供者复核的 Session Insights、由量表驱动的照护提示、疗程间反思，以及
              Coach 这个 AI 支持工具；默认情况下，服务提供者可以监控 Coach，一旦出现安全担忧，它会自动弹出危机资源并停用自身。官方 AI 责任文件把产品哲学说得很清楚：AI
              应该在治疗关系内延展照护，而不是取代治疗关系。隐私 FAQ 提到第三方处理商采用零保留条款，帮助中心流程展示暂停控制、复核步骤和临床医生批准闸口，也进一步强化了这个定位。治疗室之外，2026
              年的产品扩张集中在雇主 EAP 转接，以及初级保健 / 医疗系统转诊。与 Series D 相关的报道把 Grow 路线图同 Circle Medical 的直接集成、支付方 / 雇主连续性连接起来；Kaiser
              专属的量表自动化也说明，至少一部分伙伴工作流在 Grow 内部以产品规则落地，而不是靠人工处理。因此，平台看起来正从「市场 + 管理软件」走向更广的照护编排层；但公开证据对 API
              深度、转诊闭环指标和客户专属集成仍然偏薄。
