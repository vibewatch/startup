      - number: '2.2'
        title: TAM、SAM 与约束口径下的市场规模
        blocks:
          - type: paragraph
            body: |2-
                              美国行为健康的公开市场规模估计有方向性参考价值，但彼此太不一致，不能作为单一尽调锚点。Mordor 将 2026 年行为健康市场定为 $79.79 billion，Precedence 将 2025 年市场定为 $94.82 billion，Marketdata 的 2026 年心理健康治疗估计为 $118 billion。这些数字表面矛盾，因为它们定义市场的方式不同：有的纳入住院设施、医院、物质使用服务、处方药板块或 App 收入，而 Grow 的实际商业模式围绕门诊、保险支持和服务者网络。

                              因此，更有决策价值的框架不是绝对规模，而是受约束的口径。需求侧患病率仍然庞大——2022 年有 59.3 million 成年人患有心理疾病，30.0 million 人接受了治疗——但只有一部分需求落在 Grow 可报销的门诊工作流内。把 Mordor 的流动和门诊照护占比套用到其宽口径市场估计上，可以得到一个粗略的 Grow 相关门诊代理规模，约 $31 billion 到 $46 billion。公司自身口径上，Grow 披露的 10 million 年就诊量、220 million 覆盖人群和 26,000 多名临床服务者显示，平台已经中介了真实规模，但公开证据没有揭示抽成率、支付方组合或心理治疗与精神科的占比。结论是：市场显然大到值得重视，但不能负责任地用一个宽泛 TAM 数字概括。
                          
