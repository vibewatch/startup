  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 对价格敏感的决策流，把规模证明、收入定义模糊、可比公司框架和下行风险串到「继续研究」建议。
    data:
      nodes:
        - id: n1
          label: 规模证明
          value: 26k providers, 125+ plans, 7M 2025 visits, 2M+ people served
        - id: n2
          label: 名义定价
          value: ~$3B reported mark and ~$1B revenue claim imply ~3.0x if revenue is net
        - id: n3
          label: 可比公司区间
          value: Talkspace takeout ~3.6x revenue vs Teladoc ~0.59x EV/revenue
        - id: n4
          label: 不透明风险
          value: No 2026 Form D, unclear cap-table terms, billing friction, reimbursement pressure
        - id: n5
          label: 建议
          value: Research more at current mark; move to conditional buy only after revenue and term diligence
      edges:
        - from: n1
          to: n2
          label: 规模支撑真实的估值论证
        - from: n2
          to: n5
          label: 只有收入与净收入口径可比时才成立
        - from: n3
          to: n5
          label: 公开可比公司显示当前估值合理，但不算明显便宜
        - from: n4
          to: n5
          label: 披露缺口挡住了明确买入
        - from: n1
          to: n3
          label: 运营规模必须跑赢可比口径瑕疵
    approximationNotes: 该流程把多变量承销过程压缩为当前价格下最关键的四个公开证据关卡。
