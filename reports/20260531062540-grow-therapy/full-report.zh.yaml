      - number: '3.5'
        title: 护城河耐久性更多取决于渠道控制，而不是专有工作流功能
        blocks:
          - type: paragraph
            body: >-
              Grow
              最强的持久主张，不只是它有软件或远程医疗。更可防守的论点是，它连接了多个需求渠道——消费者搜索、支付方关系、雇主福利和医疗系统转诊——并能维持它们之间的连续性。这种组合重要，因为许多对手仍只在一层最强：BetterHelp
              擅长消费者获客，Lyra 和 Spring 擅长企业分发，SimplePractice 和 TherapyNotes 擅长软件，Optum 擅长支付方自有导航。Grow
              也有一个可见的供给侧资产：把服务者带入支付方网络，并把自己营销为支持临床服务者的操作系统，而不只是保险目录。


              但反向证据显示，这条护城河并不深。支付方杠杆是真实的：Aetna 对 Alma 合约治疗师降价，以及 Optum 驱动的降价冲击 Alma 和
              Headway，都说明保险方重定价合同时，平台经济性会迅速压缩。多平台并行也是真实的：保留报道记录了治疗师同时使用 Alma 和 Headway，并把记录保留在平台系统外。这意味着，随着理赔处理、AI
              笔记、资质认证帮助和 EHR 功能在对手及更便宜替代品之间扩散，Grow 服务者价值主张中很大一块面临商品化风险。


              趋同是最后一项风险。Spring 加 Alma、Talkspace 向支付方倾斜的转向、Teladoc 在 BetterHelp 内部推进保险，以及 Optum
              的整合式雇主行为健康栈，都指向同一个方向：行业正在走向更宽的平台，把访问、分诊、心理治疗、精神科、福利设计和转诊路由结合起来。如果这成为常态，Grow
              下一道护城河必须来自可衡量结果、雇主和支付方集成，以及连续性经济性，而不是基础服务者工具本身。
