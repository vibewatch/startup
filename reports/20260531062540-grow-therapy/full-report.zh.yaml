      - number: '2.5'
        title: 采纳约束、互相矛盾的估计与尽调缺口
        blocks:
          - type: paragraph
            body: |2-
                              创造需求的力量同样会限制采纳。HRSA 称 137 million 人生活在心理健康短缺地区，行为健康平均等待时间为 48 天；AAMC 记录，美国超过一半县没有执业精神科医生。覆盖也不等于可用访问：KFF 记录了精神科医生网络密度薄弱，AAMC 也指出行为健康门诊中存在明显的网外泄漏。具体到 Medicaid，报销仍是结构性瓶颈，因为行为健康服务者的参与度弱于商业保险或 Medicare，许多州也在放慢服务者费率上调。这些约束与 Grow 直接相关，因为其供给模式依赖临床服务者加入并留在保险网络内。

                              市场定义问题是第二个主要约束。宽泛公开报告内部足够一致，可以证明行为健康是一个大品类，但不够精确，无法隔离 Grow 的准确可服务市场（SAM）。即使是 Grow 自己的公开指标——覆盖人群、临床服务者、年就诊量和雇主结果——也没有披露心理治疗与精神科占比、支付方组合、抽成率或各业务线经济性。这意味着尽调团队可以得出结论：该品类很大、在增长，并有结构性支持；同时也要承认，精确估值仍需要非公开的理赔、报销和队列数据。矛盾不在于市场小，而在于公开记录太粗，无法高精度测算 Grow 最值得投资的那一片市场。
                          
