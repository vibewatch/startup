            body: >-
              最佳公开证据显示，宽口径行为健康市场很大；但相关的尽调动作，是把范围收窄到保险支持的门诊心理治疗和精神科，而不是重复最大口径标题数字。这个较窄代理规模仍足够重要，Grow
              披露的覆盖人群、临床服务者和年就诊量也显示它在其中已有真实分发。
