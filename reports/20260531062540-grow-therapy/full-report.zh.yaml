            title: 标题便宜几乎完全取决于收入定义
            body: >-
              只有当公开 $1 billion 数字大体是净收入时，Grow 据报道约 $3 billion 估值才显得舒服合理。如果该数字是总理赔流水或另一项非 GAAP 运营
              KPI，同样的标题标记就难以辩护得多。因此，尽管其他规模证据强，本报告建议仍停在继续研究。
