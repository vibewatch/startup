  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值逻辑
      - 区间
      - 相对当前估值的含义
    rows:
      - - 乐观
        - $1B 指标大体是净收入，雇主和医疗系统渠道提高连续照护和客户终身价值，尽管风险共担合同增加，支付方续约仍保持稳定。
        - 当 Grow 证明自己具备耐久的多渠道基础设施地位时，4.0x-5.5x 类收入结果，或等效的战略控制权溢价，就具备可信度。
        - $4.0B-$5.5B
        - 较报道中的当前估值上行 1.3x-1.8x；可能需要又一轮干净融资，或战略买家的兴趣。
      - - 基准
        - $1B 数字大多是净收入，雇主项目贡献中等增量价值，报销总体稳定，没有重大续约冲击。
        - 用接近公开收购先例的后期增长定价，而不是周期高点的私募估值，当前估值附近仍能支撑。
        - $2.5B-$3.5B
        - 相对当前估值大致持平到小幅正向；可以接受，但并非明显错价。
      - - 悲观
        - 报道中的 $1B 数字高估了净收入，支付方费率压力扩大，或企业渠道在证明留存收益前先带来高实施成本。
        - 市场很可能按困境或低质量虚拟医疗倍数来给 Grow 定价，而不是按高溢价的服务提供者赋能同业定价。
        - $1.2B-$1.8B
        - 存在重大估值下调轮风险，新投资人的回报保护也更弱。
    notes: 这些区间是分析师估计，锚定公开可比公司、披露规模和未解决的收入定义问题。它们不是管理层指引，也不是经审计的估值标记。
