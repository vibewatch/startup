      - number: '3.6'
        title: 佐证材料
        blocks:
          - type: callout
            title: Grow 最好的差异化是跨渠道连续性，而不只是一次更便宜的心理治疗
            body: Grow 的雇主和保险方页面指向同一核心优势：用户可以从雇主资助福利开始，转入保险，并保留同一服务者。这是比简单患者匹配或低软件费更强的分发主张。
            calloutType: strength
            claimRefs:
              - CP011
              - CP012
              - CP049
              - CP052
          - type: callout
            title: 最大的竞争者可能是支付方杠杆，而不是另一家创业公司
            body: Optum 和 Aetna 在 Alma、Headway 的降价事件显示，即便患者需求仍强，保险方定价权也会压缩市场经济性。Grow 暴露在同样结构性风险中，因为其价值主张仍依赖支付方关系和报销价差。
            calloutType: risk
            claimRefs:
              - CP029
              - CP030
              - CP046
              - CP047
          - type: callout
            title: 整合正在让单渠道玩家的市场更危险
            body: >-
              Spring 收购 Alma、Talkspace 向支付方倾斜的转向，以及 Teladoc 在 BetterHelp 内部推进保险，都指向更宽的平台：企业入口、消费者获客和支付方支持的连续性被合并在一起。Grow
              的护城河必须是可衡量结果和嵌入式渠道合作，而不是基础工作流功能。
            calloutType: insight
            claimRefs:
              - CP028
              - CP038
              - CP040
              - CP048
              - CP057
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 融资历史与公开规模
        blocks:
          - type: paragraph
            body: >-
              Grow Therapy 在 2026 年 3 月通过 $150 million Series D 达到新的融资里程碑。公司官方材料和多家独立报道都确认该轮规模，以及累计融资 $328
              million；Reuters 转载报道则把投后估值放在约 $3 billion。同一公告前后的公开规模披露，对一家私营公司来说异常强：Grow 称五年内服务超过 2 million 人、2025 年促成 7
              million 次就诊、累计达到 10 million 次心理治疗和用药管理预约、建立 26,000 名服务者网络，并与 125+ 家保险方合作，覆盖约 220 million 人群。


              这组标题数字背后的轮次历史方向清楚，但数字混乱。公司官方叙事描述了 $75 million Series B 和 $88 million Series C，但 Grow Care, Inc. 名下 SEC
              Form D 证据显示，2022 年和 2024 年单项发行金额更低。这个不匹配不能推翻已宣布总额，但意味着历史融资只能从公开一手来源中部分核对。值得注意的是，截至报告运行日期，Grow Care 的 SEC
              浏览页面没有显示 2026 年 Form D，因此最新轮次在本证据集中缺少公开 SEC 确认。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI005
