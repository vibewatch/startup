        - 首页、How it Works 页面和独立评测页面描述了按州 / 保险 / 专科筛选以及即时预约。
        - Grow 控制的网页市场，以及保险方 / 合作伙伴需求。
        - 公开未披露 API 或排序逻辑；外部很难验证匹配质量。
      - - 服务方门户和排班
        - 在一个仪表盘里处理转诊、客户档案、预约、开票和收入。
        - 服务方门户和日历帮助文章记录了仪表盘、转诊和预约控制。
        - 完成资质认证并取得 Grow 账户权限。
        - 一旦门户逻辑出故障，临床医生会失去很大一部分运营控制。
      - - 收入周期引擎
        - 核验资格、提交理赔、处理拒赔，并展示预期支付款。
        - RCM 文章详细说明 Grow 管理的核验、提交、拒赔处理和付款视图。
        - 支付方合同、编码准确性和保险方裁定。
        - 公开证据流程信息丰富，但供应商和 SLA 细节不足。
      - - 远程医疗媒体层
        - 支撑同步会诊、候诊室、聊天、字幕和屏幕共享。
        - Grow Telehealth 文档展示基于浏览器的房间链接、实时字幕和集成客户信息。
        - 现代浏览器、设备硬件和 Grow 平台正常运行时间。
        - 性能受浏览器 / 网络质量和 Grow 特定故障影响。
      - - 临床文档与测量
        - 存储笔记、周期性评估、精神科模板和合作伙伴专属测量规则。
        - 处方医生笔记、测量和 Kaiser 必需测量文档描述了结构化工作流。
        - 服务方文档质量和支付方 / 合作伙伴规则。
        - 公开未披露 schema、导出工具或详细互操作模型。
      - - AI 辅助层
        - 生成摘要、笔记建议、Session Insights 和会间支持。
        - AI FAQ、隐私 FAQ、AI 论文和媒体报道显示，这些工作流可选择使用，并由服务方审核。
        - OpenAI / Anthropic 处理方，加上 Grow 治理和同意流程。
        - 准确性、推出深度和临床影响在公开资料中量化很少。
      - - 企业 / 合作伙伴工作流层
        - 衔接 EAP 到保险，并把初级保健 / 支付方连接到 Grow 服务方。
        - 雇主页、医生页面、Kaiser 和 Series D 材料描述了 EAP 接续、转诊和测量自动化。
        - 合作伙伴合同、支付方规则，以及与雇主 / 医疗系统的实施工作。
        - 公开证据显示整合意图和部分产品规则，但没有披露合同经济性或闭环指标。
    notes: 这是根据公开文档重建的运营模型架构，不是 Grow 发布的供应商或服务图。
