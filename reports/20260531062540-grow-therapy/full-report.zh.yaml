  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户组合与采用入口
        blocks:
          - type: paragraph
            body: >-
              Grow 现在更像一个多边心理健康市场，而不是单一的直面消费者获客漏斗。公开材料显示出五类与经济价值直接相关的群体：自主搜索并预约照护的患者；供给照护的独立治疗师和开方医生；为大多数可报销就诊付费的支付方；希望把
              EAP 福利接到保险连续照护里的雇主；以及想把治疗转诊路径做顺的医疗系统或初级保健机构。公司自有页面一直把支付方写成既有基本盘，雇主和医疗系统产品则是基于同一套服务提供者和理赔基础设施的新延展。


              采用证据在 Grow 披露可及性和规模时最强，而不是在披露账户经济时最强。2026 年官方来源称，网络覆盖 26,000 多名服务提供者、125 多个保险计划和约 2.2 亿受保人群，五年服务超过 200
              万人，2025 年完成 700 万次就诊，累计预约 1,000
              万次。面向客户的页面也让体验变得可读：多数客户大约两天内开始，雇主会员被承诺快速匹配并接入保险连续性，面向支付方的材料则强调新入网供给和可衡量的质量控制。缺失的分母是各分部收入结构，因此本章能证明覆盖广度和工作流，但不能证明每个渠道对毛利润或留存的确切贡献。
