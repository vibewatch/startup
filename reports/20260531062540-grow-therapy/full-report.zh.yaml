    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、业务足迹与商业模式
        blocks:
          - type: paragraph
            body: >-
              Grow Therapy 成立于 2020 年 10 月，总部在纽约市。公开地址证据指向 122 East 42nd
              Street；招聘页同时提到纽约、旧金山和西雅图枢纽，以及远程团队。公司把自己定义为心理健康平台，帮助用户找到线下或线上心理治疗和精神科服务，同时提供底层行政栈，让独立临床服务者能接受保险并运营自己的诊所。这个双边模式是
              Grow 差异化的核心：消费者端主打快速匹配、广泛接受保险、单次就诊平均自付约 $21；服务者端处理资质认证、理赔、账单、EHR、远程医疗、营销和照护协调，这些工作原本都要小型诊所自己承担。到 2026
              年，公司已把该模式扩展到雇主和医疗系统渠道，形成三边平台：支付方、雇主和转诊合作方都把需求导入同一个服务者网络。
