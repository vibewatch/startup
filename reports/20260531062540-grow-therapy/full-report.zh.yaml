      - number: '2.4'
        title: 增长驱动因素与采纳顺风
        blocks:
          - type: paragraph
            body: |2-
                              Grow 所在市场最强的结构性驱动来自政策对行为健康可及性的支持、持续未满足需求，以及买方偏好摩擦更低的保险支持型照护。联邦平价规则正在给健康险计划施加更多压力，要求其解释事前授权、网络设计和其他非量化治疗限制；州 Medicaid 项目也大体保留了疫情时期的远程行为健康扩展。Medicare 远程医疗灵活性也将持续到 2027 年，这让远程精神科和心理治疗在本地服务者短缺仍严重的市场中保持可行。除此之外，Grow 自身的雇主和支付方材料显示，买方越来越想要可衡量结果，而不只是目录访问；这有利于一个把测量和转诊工作流整合进去的保险优先平台。

                              服务者侧同样支撑市场增长。BLS 仍预计咨询师就业将在 2024 至 2034 年增长 17%，而 Grow 主张其许多临床服务者此前不在支付方网络内，而不是从现有面板回收。如果这一点成立，Grow 这类平台就能把原本自费或受行政约束的临床服务者转成可报销供给，从而扩大访问。雇主动作又增加了一股顺风，因为 HR 团队可以在员工可能已经使用的健康险计划之上叠加资助访问和 ROI 报告。简言之，需求增长并非假设：政策、买方和照护交付都在转向更可报销、可衡量、网络化的行为健康访问。
                          
