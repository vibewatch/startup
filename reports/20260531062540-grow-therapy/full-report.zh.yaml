      - number: '3.4'
        title: 定价、打包和分发显示 Grow 的差异化在哪里，也显示锁定效应有多薄
        blocks:
          - type: paragraph
            body: >-
              定价和打包让 Grow 看起来不像软件供应商，更像分发和连续性引擎。服务者端，Grow 的信息是免费参与、支付方入网、理赔支持和运营工具；患者支付由保险驱动的单次诊疗价格。雇主端，Grow
              称定价按使用量，而不是按每名覆盖员工收固定 PMPM；成员可以从雇主资助咨询转入同一服务者的网内覆盖。这个连续性叙事有战略重要性，因为它把 Grow
              从点状解决方案变成跨渠道照护路径。它也解释了为什么公司正在扩展到雇主和医疗系统，而不是停留在治疗师市场。


              竞争者打包照护的方式不同。Headway 也采用对服务者免费、保险原生的模式，但保留页面在保险工作流之外的多渠道连续性上不那么明确。Alma 仍通过服务者会员变现，这可能吸引想用更软件化 ROI
              测试和社区层的治疗师。BetterHelp 和 Talkspace 呈现更清晰的消费者定价：没有保险时按周订阅，有保险时则是共同支付额和覆盖咨询。SimplePractice 和 TherapyNotes
              采用直接月度 SaaS 定价，让诊所只要能生成需求就保留自己的需求。


              锁定效应的结果是不对称的。服务者锁定看起来弱，因为临床服务者可以多平台并行、把自费患者迁到别处，甚至把临床记录留在平台外。支付方和雇主锁定更强，因为报销条款、福利设计、成员沟通和连续性规则会塑造谁控制转诊流。因此，Grow
              最好的锁定并不是治疗师不能离开，而是保险方和雇主可以把 Grow 嵌入照护旅程，形成独立软件更难复制的路径。
