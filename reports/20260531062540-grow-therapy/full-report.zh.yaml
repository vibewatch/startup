      - number: '7.2'
        title: 临床质量、AI 文档与隐私 / 安全风险
        blocks:
          - type: paragraph
            body: >-
              Grow 的运营模型把临床工作流与账单和合规直接绑在一起。平台要求每张发票都有文档，要求 2025 年 5 月 5 日之后入驻的治疗师使用 Grow EHR，现在又把 AI
              生成的病历草稿叠进这些工作流。这带来真实生产率优势，但也意味着，公司比简单转诊市场更深地插入文档链条。若病历质量、同意采集或审计支持失效，风险不只是 UX 失望；它会变成拒赔、追偿，或临床责任争议。


              Grow 的缓释措施真实存在，但不完整。公司称 AI
              病历产品可选、需要双方同意、不会长期保留原始转录文本，并且提交前必须由临床医生复核批准。这些控制降低了完全自动化错误的概率。尽调难点在于，公开证据仍达不到投资者想要的指标：没有外部验证包，没有人工改写率披露，也没有与
              AI 生成病历绑定的公开拒赔或审计数据。3Zebras 的服务提供者评论综合还指出自动取消、升级路径弱、账单身份混乱等运营投诉——这些恰好是文档、支付和照护连续性相交时最要命的边缘案例。


              隐私和网络风险叠在上述工作流复杂性之上。Grow 隐私通知仍考虑非 HIPAA 网站数据的广告和第三方数据共享机制；FTC 对 BetterHelp 的行动表明，美国监管者会强力执法敏感心理健康数据用途。HHS
              OCR 的 2026 年勒索软件和解案，以及 Security Rule 更新议程，把基线进一步抬高：任何集中病历、理赔、排期和支付事件的 PHI 密集平台，无论是否已披露公开事件，都是重要的攻击目标。
