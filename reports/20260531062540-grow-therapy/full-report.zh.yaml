  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: |2-
                              Grow Therapy 的实际市场不是“全部行为健康”。它更窄：美国可走保险、可通过数字市场匹配的门诊心理治疗、精神科诊疗和用药管理市场。公司公开界面强调保险覆盖的心理治疗、用药支持、直接预约，以及线上或线下混合照护，因此商业保险、Medicare Advantage、Medicaid 和雇主赞助保险才是相关支出池。这个边界很重要，因为宽泛的行为健康报告往往包含住院、住宅式照护、危机干预、SUD 专项、医院和纯 App 收入，不能干净映射到 Grow 的工作流。

                              现状替代方案也比泛泛的“心理健康市场”标签更窄。最清楚的替代仍是自费私人执业：患者直接购买单次咨询，临床服务者避开保险文书。相邻但经济性不同的替代包括订阅制远程心理治疗产品、雇主出资的 EAP 咨询，以及更高急性程度的社区或住宅式项目。Grow 的竞争方式是承诺降低患者自付成本、直接核验保险，并让独立临床服务者更容易加入支付方网络。也就是说，纳入范围是保险支持的门诊心理健康照护；排除范围是绕开保险或需要显著不同临床和报销架构的支出。
                          
