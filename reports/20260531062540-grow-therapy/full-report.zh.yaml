    rows:
      - - Grow Therapy
        - 基准 / 直接同业集合标杆
        - 2026 年 3 月 Series D 轮 $150M；据报道累计融资 $328M、估值 $3B；26,000+ 名临床医生；125+ 个计划
        - 独立心理健康服务方；参保患者；付款方；雇主；医疗系统
        - 结合服务方市场、付款方赋能、雇主到保险的转接，以及服务方操作系统
        - 暴露于付款方重新定价；服务方锁定效应似乎有限
      - - Headway
        - 直接同业（保险原生的服务方赋能）
        - 2024 年 7 月 Series D 轮 $100M，估值 $2.3B
        - 独立治疗师和参保患者
        - 服务方免费注册、快速资质认证、免费 EHR 功能、理赔 / 付款处理
        - 留存来源未显示类似 Grow 的雇主连续性，也未披露付款方广度
      - - Alma / Spring Health
        - 直接同业，收购后渠道趋同
        - 付费会员模式；Alma 覆盖 112M+ 名保险可覆盖人群；Spring + Alma 合计约 170M 名患者覆盖容量
        - 独立服务方加 Spring 雇主人群
        - 结合执业工具、付款方关系、社区和 Spring 雇主分发
        - 会员费增加摩擦；付款方费率下调显示经济压力
      - - SonderMind
        - 直接 / 相邻混合竞争对手
        - 覆盖全美的心理治疗和精神科服务，广泛接受保险；50 个州
        - 参保患者、服务方、付款方、医疗系统、医生诊所
        - 心理治疗 + 精神科，多触点分发，强保险优先的患者匹配
        - 深度服务方运营工具证据少于 Grow 或 Alma
      - - Talkspace
        - 混合替代品及付款方 / 企业竞争对手
        - 上市公司；2025 年付款方收入 $171.5M，约占总收入 75%
        - 消费者、付款方、雇主、政府、福利顾问
        - 保险 + 订阅混合模式、药物管理、企业和政府渠道
        - 消费者业务根基仍在塑造产品和经济性；不是围绕独立执业赋能搭建
      - - BetterHelp / Teladoc
        - 具消费级规模的替代品，保险敞口开始趋同
        - 31,000+ 名治疗师；服务 5M+ 人；BetterHelp 2026 年 Q1 收入 $218.4M，同比下降 9%
        - 消费者、部分参保会员，以及通过母公司生态进入的雇主买方
        - 庞大治疗师网络、强消费者品牌，并通过 Teladoc / UpLift 扩张精神科 / 保险
        - 自费业务疲软迫使其转向保险；原生架构并非围绕独立执业的付款方签约
      - - Lyra Health
        - 相邻企业心理健康既有玩家
        - 通过直接雇主合同服务 20M+ 人；30K+ 名服务方
        - 大型雇主、会员、医疗系统
        - 雇主预算控制、临床监督、AI 分诊、专科护理、结果主张
        - 起点不是独立执业市场经济性
      - - Optum behavioral health 业务
        - 保险公司旗下既有玩家 / 现状替代方案
        - 付款方拥有的行为健康导航和 EAP 栈
        - 雇主团体、参保会员、付款方人群
        - 在付款方生态内控制福利、导航、自助、教练、治疗、机构护理和 EAP 指引
        - 面向独立临床医生的服务方运营命题较弱；开放市场逻辑较少
      - - SimplePractice / TherapyNotes
        - 软件替代品 / 私人执业现状
        - SimplePractice 核心套餐 $49-$99/月；TherapyNotes 核心套餐 $69-$79+/月
        - 自行获取患者的独立私人诊所
        - 排班、账单、病历、门户、远程医疗和附加项的直接供应商成本低
        - 不带来付款方需求、保险签约或雇主 / 付款方连续性
