            - Grow 首页
            - 雇主页
            - 支付方页
            - 转介工作流
          emotion: 需求紧迫；可负担性和匹配不确定性都很高
          label: 入口
        - stage: 匹配和保障范围核验
          actors:
            - 患者
            - Grow 匹配流程
            - 计费 / 保险系统
          touchpoints:
            - 目标和偏好采集
            - 保险核验
            - 目录筛选
            - 服务者档案
          emotion: 如果费用透明、服务者看起来匹配，信任会上升
          label: 匹配和保障范围核验
        - stage: 预约并完成首次治疗
          actors:
            - 患者
            - 服务者
            - Grow 运营
          touchpoints:
            - 即时预约
            - 预约提醒
            - 视频或线下治疗
            - 费用估算
          emotion: 速度很重要，因为等待太久会提高流失风险
          label: 预约并完成首次治疗
        - stage: 持续照护和疗程间支持
          actors:
            - 患者
            - 服务者
            - Grow 应用 / Coach
          touchpoints:
            - 消息
            - 通过应用加入治疗
            - 疗程间工具
            - 药物支持
          emotion: 治疗、用药和支持连贯起来后，留存会改善
          label: 持续照护和疗程间支持
        - stage: 扩张 / 连续性循环
          actors:
            - 雇主
            - 支付方
            - 初级保健合作伙伴
            - 服务者
          touchpoints:
            - EAP 转保险续接
            - 转介反馈闭环
            - 追加治疗
            - 福利报告
