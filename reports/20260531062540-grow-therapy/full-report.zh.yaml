  - id: TP003
    title: 定价 / 打包对比
    columns:
      - 平台
      - 变现 / 合同模式
      - 服务提供者成本
      - 患者 / 会员成本
      - 包含能力
      - 对 Grow 的启示
    rows:
      - - Grow Therapy
        - 支付方赋能的市场；按使用量定价的雇主合同
        - 对服务提供者免费
        - 有保险时每次治疗平均约 $21；雇主定价定制且按使用量收费
        - 资质认证、理赔支持、远程医疗、服务提供者目录、从雇主福利转入保险
        - 差异化来自连续照护和分发，而不是直接向临床医生收费
      - - Headway
        - 保险原生的服务提供者赋能
        - 对服务提供者免费
        - 服务时按保险估算患者自付责任
        - 资质认证、理赔处理、客户账单、打款、EHR 功能
        - 直接的结构性同业；最直接争夺想要免费保险工作流的治疗师
      - - Alma
        - 会员制 + 保险项目
        - 年付特别价起步为 $62.50/月
        - 患者按保险定价；服务提供者直接支付会员费
        - 保险支持、报销谈判、EHR 工具、继续教育、社区
        - 付费会员制让 Alma 更容易被更便宜的软件替代，但也支撑了更强的社区定位
      - - BetterHelp
        - 消费者订阅，加上部分保险覆盖照护
        - $0 直接服务提供者费用；平台向治疗师付款
        - 通常为 $70-$100/周订阅；部分参保会员平均约 $23/次
        - 消息、实时治疗、练习表、网络研讨会，以及通过 UpLift 提供的部分保险和精神科服务
        - 面向无保险或追求便利的用户，是替代品；对独立执业的支付方工作流不够原生
      - - Talkspace
        - 订阅 + 支付方 / 雇主 / 政府合同的混合模式
        - 保留材料显示直接服务提供者费用为 $0
        - 无保险为 $69-$109/周；平均共付额 $10，许多会员支付 $0
        - 分层消息服务、实时治疗、药物管理、企业和政府分发
        - 说明消费者品牌可以转向支付方占比更高的收入，从而压缩 Grow 的渠道优势
      - - SimplePractice
        - 直接 SaaS 订阅
        - $49 / $79 / $99 每月核心套餐，另有可选附加功能
        - 不适用于患者获客；面向客户的支出取决于诊所
        - 排班、门户、远程医疗、病历、分层理赔、AI 记录员和处方附加功能
        - 临床医生自行获客时，这是更便宜的工作流替代品
      - - TherapyNotes
        - 直接 SaaS 订阅
        - $69/月单人；首位临床医生 $79/月 + 每位新增 $50；ePrescribe $65/月
        - 不适用于患者获客；面向客户的支出取决于诊所
        - 账单、排班、远程医疗、客户门户、病历、处方附加功能
        - 又一个低成本软件天花板，限制 Grow 仅靠运营功能能收多少钱
    notes: 公开页面披露的是标价和打包方式，不是实际报销或毛利。雇主和支付方合同条款为定制，基本没有披露。
