      - number: '6.3'
        title: 满意度、结果与重复使用代理指标
        blocks:
          - type: paragraph
            body: >-
              Grow 披露的客户体验和结果细节多于大多数私营远程心理健康同行，但证据质量参差。2026 年官方材料声称，十名客户中有九名会强烈推荐 Grow，公司 NPS 为 85，超过 80%
              的会员出现临床显著改善，82% 自开始治疗后感觉更好，从第 1 次到第 3 次疗程的留存率为 75%。雇主页面进一步声称，96% 的会员在初次接触时找到了合适匹配，从预约到首次完成疗程为 2.8
              天。这些信号有意义，因为它们直指市场最难的问题：匹配质量、等待时间和连续性。


              独立评论渠道部分印证了正面故事，同时保留了真实谨慎。Trustpilot 有大体量 4.7 星评论基础，Apple App Store 有 4.8
              星评分和数千条评分，并有关于治疗师匹配、保险设置、消息和便利性的详细正面评论。同时，应用商店和编辑评测来源都提到费用惊喜、音频或视频故障、保险混乱和支持挫败感。结论是，Grow
              对许多患者看起来确实有用，但公开满意度证据更擅长证明广泛认可，而不是量化投诉发生率、退款率，或按分部划分的长期队列耐久性。
