  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: standard
    summary: Grow 的漏斗不只是获取患者：临床医生资质认证带来更宽的支付方覆盖，进而承接雇主端连续照护和医疗系统转诊。
    data:
      nodes:
        - id: provider-supply
          label: 招募临床医生供给
          detail: Grow 签约 1099 临床医生，协助资质认证，并为他们提供计费、排班、远程医疗和社区支持。
        - id: payer-enable
          label: 打通支付方覆盖
          detail: Grow 扩大保险计划接入和网络内可得性，让患者能用既有保险。
        - id: patient-discovery
          label: 患者发现 / 转诊
          detail: 患者来自自主搜索、雇主福利、支付方路径、初级保健或 Zocdoc。
        - id: match-book
          label: 匹配并预约
          detail: 保险、专科、身份、可约时间和服务形态等筛选条件，把用户推向首次预约。
        - id: first-session
          label: 首次完成咨询
          detail: 早期速度和匹配度很关键；官方页面强调快速预约和完成首次咨询。
        - id: repeat-expand
          label: 复诊 / 扩张
          detail: 后续照护可以靠复诊、EAP 转保险、医生转诊，以及更深的支付方或雇主集成来延续。
      edges:
        - from: provider-supply
          to: payer-enable
          label: 完成认证的临床医生撑起支付方覆盖广度
        - from: payer-enable
          to: patient-discovery
          label: 覆盖和可负担性打开更多入口
        - from: patient-discovery
          to: match-book
          label: 用户按匹配度、网络和时间筛选
        - from: match-book
          to: first-session
          label: 低摩擦预约把需求转成照护
        - from: first-session
          to: repeat-expand
          label: 连续照护和结果支撑复用与渠道扩张
    claimRefs:
      - CU010
      - CU019
      - CU020
      - CU033
      - CU037
      - CU040
