      - number: '4.2'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >-
              Grow 公开把自己定位为面向患者、服务者和支付方的三边基础设施平台。公司把治疗师匹配、资质认证、账单、理赔支持、EHR、远程医疗和照护导航工作流打包进一个运营模式。消费者端，Grow 称投保客户单次就诊平均支付
              $21，三分之一客户自付为零；如果没有可用保险，客户可以选择自费。雇主端，Grow 明确称其按交付的照护收费，而不是对每名覆盖员工收取固定费用，这指向与使用量挂钩的变现，而不是经典 SaaS 席位定价。


              这些披露意味着 Grow 的收入质量与实际交付照护的绑定，比与签约但未使用产能的绑定更紧。这是正面承保信号。限制在于确认口径不清：公司没有发布经审计报表，也没有公开备忘录定义其公开收入语言到底反映 GAAP
              净收入、总理赔流水，还是另一项 KPI。这种模糊很重要，因为同一组运营事实，在 Grow 经济上是净收入中介，还是围绕服务者照护组织总账单的情况下，会支持截然不同的估值结论。
