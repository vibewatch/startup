  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: standard
    summary: Grow 的旅程有多个入口——自助搜索、支付方、雇主和医生转介——但核心交接问题相同：足够快地把患者匹配给网内临床服务者，才能守住连续性。
    data:
      items:
