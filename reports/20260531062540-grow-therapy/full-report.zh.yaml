  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        Representative 2024-2026 public and private references relevant to Grow's insurer-linked provider-enablement and
        behavioral-health platform model; terms are incomplete for some private transactions, so the set is directional
        rather than exhaustive.
    columns:
      - 可比对象
      - 已披露指标
      - 倍数或价值
      - 相关性
      - 局限
    rows:
      - - Talkspace / UHS
        - 2025 年收入 $228.9M；2026 年收购 EV 约 $835M
        - 约 3.6x 收入收购倍数
        - 最接近的公开 M&A 基准，适用于有规模的数字心理健康交付。
        - Talkspace 混合了支付方、雇主和消费者收入，并不是服务提供者赋能平台。
      - - Teladoc / BetterHelp
        - Q1 2026 收入 $613.8M；BetterHelp 分部 $218.4M；市值约 $1.37B
        - 约 0.59x EV / 收入；市值约为年化收入的 0.6x
        - 可作为公开下行锚点，说明虚拟医疗资产在公开市场会如何压缩。
        - Teladoc 业务更多元，BetterHelp 偏 DTC，因此结构上并不完美可比。
      - - Headway
        - 2024 年 7 月 Series D；34,000 名临床人员；40+ 个商业计划
        - $2.3B 私募估值
        - 在保险赋能执业基础设施上，最接近的已披露私募模式可比。
        - 估值来自 2024 年中，不是 2026 年标记，收入也未披露。
      - - Alma / Spring Health
        - Spring Health 于 2026 年收购 Alma；条款未披露
        - 战略买家需求得到确认，定价未披露
        - 显示雇主赞助和支付方关联心理健康基础设施正在收敛。
        - 没有披露交易价值或倍数。
      - - Lyra Health
        - 2021 年融资轮；雇主主导的心理健康平台，全球服务 20M+ 人
        - 2021 年高点时 $4.6B 私募估值
        - 证明有规模的企业心理健康访问曾经能拿到的上限。
        - 2021 年周期高点定价，对 2026 年直接锚定意义较弱。
      - - 更宽的健康科技 / 行为健康基准
        - 公开健康科技 EV / 收入从低于 1x 的支付方类资产，到 4x-6x 的多元健康科技不等；大型行为健康平台可达到 9x-13x EBITDA
        - 宽基准区间，不是单一可比公司
        - 有助于压力测试 Grow 是否落在正常区间假设内。
        - 收入和 EBITDA 区间不能互换，必须与实际披露经济性匹配。
    notes: 可比集合混合了公开交易可比、公开 M&A 收购和私募参照点，因为没有一家上市公司能完全匹配 Grow 这种支付方关联、服务提供者赋能、雇主桥接的模式。
