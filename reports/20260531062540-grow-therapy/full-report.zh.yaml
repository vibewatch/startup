  - id: TV005
    title: 投资逻辑破坏与触发表
    columns:
      - 触发因素
      - 阈值或事件
      - 对估值的传导
      - 监测信号
      - 行动含义
    rows:
      - - 收入定义失败
        - 公开或 NDA 尽调显示，报道中的 $1B 指标实质上更接近总服务量，而不是净收入。
        - 隐含倍数会快速上修，当前价格纪律失效。
        - 经审计财务、KPI 桥接和财务负责人备忘录。
        - 除非价格大幅重置，否则从「继续研究」转为「放弃」。
      - - 支付方大范围重新定价
        - 多个主要计划下调报销，或风险共担合同在规模化后表现不佳。
        - 利润率假设被压缩，公开可比集合转向 Teladoc 式定价。
        - 续约结果、抽成率数据和理赔拒付趋势。
        - 提高悲观情景权重，并要求估值折价。
      - - 企业渠道拖累
        - 雇主或医疗系统上线需要大量支持开支，却没有带来留存或使用率提升。
        - 战略溢价论据消失，增长看起来更像重服务。
        - 雇主队列留存、实施成本和转诊转化数据。
        - 按低倍数护理服务公司重新承销 Grow。
      - - 账单或合规事件
        - 投诉量、诉讼或隐私问题升级为可量化的法律或监管问题。
        - 退出可选性收窄，公开市场对溢价定价的胃口下降。
        - 诉讼更新、争议仪表盘和合规审计发现。
        - 暂停投资，直到法律和运营暴露被量化。
      - - 后期条款不透明
        - 股权结构表审查发现沉重的优先权堆叠、显著老股交易，或让表面估值变便宜的投资人保护条款。
        - 新投资人的实际入场经济性比公开估值显示得更差。
        - 已签署投资条款清单、备考持股比例和清算瀑布模型。
        - 用经济所有权和清算价值重新定价，而不是用表面投后估值。
    notes: 这些是投资逻辑破坏条件，不是背景风险。即便需求和收入增长仍然强劲，任一条件都可能快速改变正确的估值立场。
    claimRefs:
      - CV022
      - CV025
      - CV048
      - CV049
      - CV050
      - CV051
      - CV057
      - CV058
      - CV059
      - CV060
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或路径
      - 决策影响
    rows:
      - - 收入定义
        - 经审计的 2025 年报表，以及报道中 $1B 数字的 KPI 到 GAAP 桥接
        - 决定 Grow 是接近 3.0x 收入交易，还是隐藏倍数高得多
        - CFO / 财务负责人尽调室
        - 影响最大的项目；可以立即改变估值立场
      - - 股权结构表和轮次条款
        - 2026 年投资条款清单、清算优先权、老股混合比例和董事会权利
        - 后期轮的实际价格可能与表面投后估值差异很大
        - 法务尽调和融资律师
        - 需要确认新钱是否真的买到了下行保护
      - - 支付方集中度和续约经济性
        - 前 10 大支付方收入占比、续约日历、风险共担合同表现和拒付趋势
        - 对保险关联平台而言，报销敏感性是核心下行变量
        - 商业尽调加收入运营审查
        - 决定悲观情景概率和所需折价
      - - 渠道单位经济模型
        - 按支付方、雇主和医疗系统渠道拆分的毛利率、服务提供者付款瀑布和实施成本
        - 需要把规模指标转成 EBITDA 质量的估值逻辑
        - FP&A 和运营数据请求
        - 决定 FOCUS 行为健康 EBITDA 区间是否适用
      - - 企业队列证明
        - 雇主和医疗系统合同数量、使用曲线、留存和照护连续性结果
        - 乐观情景依赖这些新渠道增加质量，而不只是增加故事价值
        - 企业销售 / 客户成功尽调
        - 决定 Grow 是否相对直接心理健康可比公司应享有战略溢价
      - - 投诉和诉讼暴露
        - 账单争议率、退款趋势、隐私事件历史和诉讼摘要
        - 公开反向信号存在，但规模还不够清楚，无法建模
        - 法务、合规和支持运营尽调
        - 可能显著改变下行权重和退出准备度
    notes: 这些要求是从公开证据框架进入可投资估值工作的最低材料包。如果考虑以报道中的当前估值或接近该估值入轮，没有一项可以省略。
    claimRefs:
