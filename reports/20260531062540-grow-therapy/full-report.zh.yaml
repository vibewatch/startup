  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议、投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              围绕 Grow Therapy 的估值争论，起点是一个对私营心理健康公司来说异常强的事实组合：公司公开把 2026 年 3 月后期融资与大体量运营披露放在一起。Grow 和 Reuters 都确认 $150
              million Series D 和 $328 million 累计融资；官方和行业来源也指向 26,000 名服务提供者、125+ 支付方关系、约 2.2 亿受保人群、服务超过 200 万人，以及 2025 年
              700 万次就诊。若另有报道称的「约 $1 billion」收入数字大体是净收入，所报道的约 $3 billion 标记只意味着约 3.0x 收入——相对成规模的行为健康或 healthtech
              基础设施可比公司，并不明显拉伸。


              反向逻辑在于，最重要输入也是定义最不清的输入。公开证据从未说明 $1 billion 是 GAAP 净收入、总理赔流水，还是另一项 KPI。这种模糊并非表面问题：净收入解释让 Grow
              看起来接近市场水平；总流水解释则意味着有效倍数实质性更高。后期条款同样不透明。SEC 历史记录尚未出现 2026 年 Form
              D，公开来源也没有披露优先股堆叠、老股交易或治理条款。再加上相邻保险方关联平台的真实报销压力以及账单摩擦投诉，当前标记下的正确建议是继续研究；只有在收入定义和条款尽调完成后，才愿意转向有条件买入。
