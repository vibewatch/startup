      - number: '5.4'
        title: 信任、可靠性与技术约束
        blocks:
          - type: paragraph
            body: >-
              2026 年，Grow 对安全和信任控制的披露比许多数字心理健康同行更明确；但公开材料仍停留在信任中心摘要层面，不是深入的审验材料包。本次查阅页面披露了传输和静态加密、基于角色的访问控制、MFA、美国境内 AWS
              托管、年度渗透测试、HIPAA 培训、BAAs / DPAs、第三方 HIPAA 评估，以及 AI 处理商零保留条款。远程医疗和 AI 同意流程也展示了具体产品控制：疗程不会被存储，AI
              摘要可选，转录可以暂停，服务提供者必须批准所有发送给客户的内容。可靠性证据好坏参半。Grow 发布故障排查步骤和因故障错过疗程的服务提供者补偿政策，说明事件处理较成熟。但本次查阅页面没有公开状态页、正常运行时间
              SLA，也没有 Grow 专属的 SOC 2 / HITRUST
              类认证。独立评论进一步说明，产品风险主要是运营风险，而不只是功能风险：患者称赞可负担性和保险处理，但仍反映账单摩擦；服务提供者评论则认可资质认证和内置工具的真实价值，同时抱怨自动取消、支持质量，以及对病历或账单身份的控制权。
