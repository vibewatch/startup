- id: growth-drivers
  title: Growth Drivers and Adoption Tailwinds
  body: "                The strongest structural drivers for Grow's market are policy support for behavioral-health access, persistent unmet demand, and a buyer preference for lower-friction insurance-backed care. Federal parity rules now put more pressure on plans to justify prior authorization, network design, and other nonquantitative treatment limits, while state Medicaid programs have broadly retained pandemic-era telebehavioral expansions. Medicare telehealth flexibilities also continue through 2027, which keeps remote psychiatric and therapy access viable in a market where local provider shortages remain severe. On top of that, Grow's own employer and payor materials suggest buyers increasingly want measurable outcomes, not just directory access, and that helps an insurance-first platform with integrated measurement and referral workflows.\n\n                The provider side also supports market growth. BLS still expects counselor employment to grow 17% from 2024 to 2034, and Grow\
    \ argues that many of its clinicians are new to payor networks rather than recycled from incumbent panels. If that holds, platforms like Grow can expand access by converting previously cash-pay or administratively constrained clinicians into reimbursable supply. The employer motion adds another tailwind because it lets HR teams layer funded access and ROI reporting onto plans employees may already use. In short, demand growth is not hypothetical: policy, buyers, and care delivery are all moving toward more reimbursable, measurable, network-based behavioral-health access.\n            "
