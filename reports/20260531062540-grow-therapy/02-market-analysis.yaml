- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Mechanism
  - Implication for Grow
  - Diligence ask
  rows:
  - - Parity scrutiny of prior authorization and network limits
    - Tailwind
    - 2025-2026 implementation
    - Plans must defend nonquantitative treatment limits and network design more explicitly
    - Supports network-based platforms that can expand usable access and document outcomes
    - Test whether payer contracts actually improved approval rates or psychiatrist density
  - - Medicare telehealth extension through 2027
    - Tailwind
    - Current
    - Keeps home-based and audio-only behavioral telehealth viable for covered beneficiaries
    - Extends the feasible geography for remote therapy and psychiatry
    - Quantify what share of Grow demand depends on remote behavioral telehealth
  - - State Medicaid telebehavioral expansions
    - Tailwind
    - Current
    - States continue audio-only coverage, broader provider eligibility, and telehealth reimbursement
    - Improves serviceability for Medicaid and rural access
    - Map where Grow actually participates in Medicaid by state and license type
  - - Employer demand for measurable, in-network mental health benefits
    - Tailwind
    - Current
    - Employers want higher utilization, better continuity, and ROI dashboards instead of unused subscriptions
    - Strengthens Grow's employer overlay and payor partnership motion
    - Validate employer retention, utilization lift, and benefit-cost outcomes under NDA
  - - Conversion of clinicians who are new to payor networks
    - Tailwind
    - Current
    - Credentialing and billing support can convert cash-pay or administratively constrained supply into reimbursable supply
    - Potentially expands network adequacy rather than simply reallocating existing supply
    - Verify provider activation, retention, and visit ramp after first credentialing
  - - Mental-health shortage areas and 48-day wait times
    - Headwind
    - Current
    - High demand persists where clinician density remains weak
    - Limits appointment supply despite marketplace demand generation
    - Benchmark Grow's fill rates and local density versus shortage-area benchmarks
  - - Low public-payer participation and reimbursement pressure
    - Headwind
    - Current to FY2026
    - Medicaid rate growth is slowing and psychiatrists remain less likely to accept new Medicaid patients
    - Public-program expansion may grow covered demand faster than willing provider supply
    - Request state-by-state reimbursement and provider participation by line of business
  - - Out-of-network leakage and weak psychiatrist network density
    - Headwind
    - Current
    - Behavioral-health coverage often still fails at the usable-network level
    - Creates acquisition opportunity for Grow but also reveals how hard supply matching is
    - Measure actual in-network provider availability by market and specialty
  - - Public data gaps on Grow economics
    - Constraint on diligence precision
    - Current
    - No public take rate, payer mix, or therapy-versus-psychiatry split
    - Prevents a high-confidence external SOM or revenue build from public evidence alone
    - Request cohort-level claims, reimbursement, and margin data
  notes: 'Timing and implications blend public policy evidence with company claims. This is a market-adoption table, not a company performance scorecard: some rows are tailwinds for category demand while still leaving Grow exposed to payer economics and local provider density.'
