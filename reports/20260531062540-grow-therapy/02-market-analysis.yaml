callouts:
- calloutType: insight
  title: Grow's real market is narrower than generic behavioral-health TAMs, but that narrower slice is still meaningful
  body: The best public evidence says the broad behavioral-health market is large, yet the relevant diligence move is to narrow it to insurer-backed outpatient therapy and psychiatry rather than repeat the broadest headline number. That narrower proxy is still large enough to matter, and Grow's disclosed covered lives, clinicians, and annual visits suggest real distribution inside it.
  claimRefs:
  - CM009
  - CM010
  - CM016
  - CM017
  - CM018
  - CM041
- calloutType: risk
  title: Coverage expansion does not remove the supply and reimbursement bottleneck
  body: Parity, telehealth, and Medicaid expansions make the market more addressable, but they do not solve shortages, low public-payer participation, or weak real-world network density. For Grow, the main market risk is that covered demand grows faster than willing, sustainably reimbursed provider supply.
  claimRefs:
  - CM021
  - CM022
  - CM032
  - CM034
  - CM038
  - CM040
  - CM042
  - CM044
- calloutType: assumption
  title: Public SOM math is only a proxy until Grow discloses economics by line of business
  body: Using 10 million annual visits and public self-pay ranges helps bracket scale, but it is not a substitute for actual take rate, payer mix, or therapy-versus-psychiatry split. A serious valuation model still needs non-public claims and reimbursement data.
  claimRefs:
  - CM011
  - CM018
  - CM049
  - CM050
