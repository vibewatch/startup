- id: market-sizing
  title: TAM, SAM, and Constrained Sizing Lenses
  body: "                Public market-sizing estimates for U.S. behavioral health are directionally useful but too inconsistent to serve as a single diligence anchor. Mordor places the 2026 behavioral-health market at $79.79 billion, Precedence places the 2025 market at $94.82 billion, and Marketdata's 2026 mental-health-treatment estimate is $118 billion. Those figures are contradictory on the surface because they define the market differently: some include inpatient facilities, hospitals, substance-use services, prescription segments, or app revenue, while Grow's actual business model is outpatient, insurance-backed, and provider-network centric.\n\n                A more decision-useful framing is therefore constrained rather than absolute. Demand-side prevalence remains large—59.3 million adults had a mental illness in 2022, and 30.0 million received treatment—but only part of that demand sits inside Grow's reimbursable outpatient workflow. Applying Mordor's ambulatory and outpatient\
    \ care shares to its broad market estimate produces a rough Grow-relevant outpatient proxy of about $31 billion to $46 billion. On the company-specific side, Grow's disclosed 10 million annual visits, 220 million covered lives, and 26,000-plus clinicians show that the platform already intermediates real volume, but public evidence does not reveal take rate, payer mix, or therapy-versus-psychiatry mix. The result is a market that is clearly large enough to matter, but not one that can be responsibly summarized by a single broad TAM number.\n            "
