  evidenceGaps:
  - type: missing-source
    severity: material
    topic: standalone-outpatient-market-sizing
    missingEvidence: A public claims-based or spend-based source that isolates U.S. insurance-covered outpatient therapy plus psychiatry as one standalone market category.
    whyItMatters: Without a clean public category definition, TAM and SAM stay bracketed by incompatible market reports and derived proxies instead of direct measurement.
    diligencePath: Request payer claims, a claims-clearinghouse cut, or NDA access to a behavioral-health market study with included NAICS and service-line definitions.
    relatedQuestionRefs:
    - QM026
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: grow-line-of-business-economics
    missingEvidence: Grow's current therapy-versus-psychiatry visit mix, payer mix by line of business, average allowed amount per visit, and take rate.
    whyItMatters: Those inputs are necessary to turn disclosed visits, covered lives, and clinicians into a defensible SOM, revenue, and margin model.
    diligencePath: Request cohort-level reimbursement, margin, and visit-mix data segmented by commercial, employer, Medicare Advantage, and Medicaid lines.
    relatedQuestionRefs:
    - QM027
    - QM028
    relatedTableRefs:
    - TM002
  - type: conflicting-data
    severity: material
    topic: public-market-estimates
    missingEvidence: A reconciled mapping of what each public market report includes or excludes across inpatient, outpatient, SUD, prescription, and app revenue.
    whyItMatters: The current public contradiction band is too wide to support a single valuation anchor without knowing whether two estimates refer to the same market.
    diligencePath: Obtain full analyst reports or the underlying methodology appendices and normalize them to Grow's actual market boundary before using them in valuation work.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: public-payer-reimbursement
    missingEvidence: State- and payer-level reimbursement benchmarks for Grow-relevant therapy and psychiatry visit types by line of business.
    whyItMatters: Provider participation, especially in Medicaid and Medicare Advantage, depends on whether reimbursement supports ongoing network retention and appointment supply.
    diligencePath: Request contracted rate sheets, de-identified claims extracts, or a payer-by-state reimbursement study for Grow's top visit codes and specialties.
    relatedQuestionRefs:
    - QM020
    - QM021
    - QM028
    relatedTableRefs:
    - TM004
