- id: buyer-user-payer-map
  title: Buyer, User, and Payer Segmentation
  body: "                Grow serves a genuinely multi-sided market. Commercial health plans are the clearest economic buyer because Grow sells network adequacy, access speed, and measurable behavioral-health outcomes. Employers are a second buyer layer, but they usually extend rather than replace the insurance relationship: the employer product funds incremental sessions, reporting, and rollout support, then hands members back into the in-network channel. Providers are also buyers in a practical sense because they adopt Grow to outsource credentialing, claims, billing, and payor enrollment while remaining independent. Patients are the end users, choosing Grow because it surfaces insurance acceptance, direct scheduling, and integrated therapy plus medication support instead of subscription chat or pure self-pay care.\n\n                Medicare Advantage and Medicaid matter because they expand the payer mix beyond commercially insured adults and create a larger affordability-driven demand\
    \ pool, but they also bring tougher reimbursement and participation economics. Health plans, employers, providers, and patients therefore optimize for different outcomes: payers want network adequacy and outcomes, employers want accessible benefits and ROI, providers want lower administrative burden and a fuller caseload, and patients want fast, affordable access with less insurance friction. That segmentation is what makes Grow more of a marketplace and network utility than a single-sided therapy brand.\n            "
