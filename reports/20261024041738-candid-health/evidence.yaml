evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current company-controlled leadership page, board roster, cap table summary, and succession plan.
    whyItMatters: >-
      The public record names founders but does not establish current executive responsibilities, board control, or
      key-person mitigation.
    diligencePath: >-
      Request the current organization chart, board minutes or consent summary, option pool, and founder succession plan
      under NDA.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: disclosure
    missingEvidence: Audited or management financials covering absolute revenue, ARR, gross margin, burn, runway, cash, and headcount.
    whyItMatters: Growth percentages and funding do not establish cash generation, capital efficiency, or valuation support.
    diligencePath: Obtain the latest monthly financial package, bank balance, cash forecast, cohort revenue, and hiring plan.
    relatedQuestionRefs:
      - QO005
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: customers
    missingEvidence: >-
      Named customer references and a cohort or concentration schedule distinguishing active customers from historical
      logos.
    whyItMatters: More than 200 organizations and reported claim volume do not reveal retention, concentration, or referenceability.
    diligencePath: Request a customer cohort export, top-10 revenue concentration, churn report, and permissioned reference calls.
    relatedQuestionRefs:
      - QO005
      - QO008
  - type: conflicting-data
    severity: minor
    topic: identity
    missingEvidence: >-
      An authoritative current biography resolving San Francisco versus New York listings and the Adam Reis founder
      reference.
    whyItMatters: Conflicting identity details reduce confidence in public company-profile data and governance attribution.
    diligencePath: Verify the registered office, operating headquarters, and founder roster against company records.
    relatedQuestionRefs:
      - QO001
      - QO003
  - type: missing-source
    severity: material
    topic: evidence-quality
    missingEvidence: >-
      Independent validation of first-pass resolution, denial, touchless-claim, net-collection, and manual-work
      reduction metrics.
    whyItMatters: >-
      Reported automation outcomes are central to the investment case but are not independently audited in the assigned
      pool.
    diligencePath: >-
      Commission customer-reference testing and request anonymized before-and-after claims cohorts with denominators and
      periods.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: material
    topic: market-size
    missingEvidence: >-
      A primary or independent market dataset separating U.S. provider RCM software, managed services, and addressable
      automation spend by segment.
    whyItMatters: The $280 billion figure is broad and investor-linked, so it cannot establish Candid's serviceable market or share.
    diligencePath: >-
      Obtain a segment-level market study or build a bottom-up model from provider counts, claim volumes, pricing, and
      target specialties.
    relatedQuestionRefs:
      - QM002
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: underwriting-gaps
    missingEvidence: >-
      Independent customer-level evidence for touchless claims, denial reduction, payment speed, retention,
      implementation cost, and gross margin.
    whyItMatters: Vendor and investor claims describe potential ROI but do not establish repeatability or valuation-grade economics.
    diligencePath: >-
      Request anonymized cohort metrics, payer and specialty cuts, customer references, and implementation
      contribution-margin data.
    relatedQuestionRefs:
      - QM008
  - type: conflicting-data
