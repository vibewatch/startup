      - ["Manual exception queues become a service bottleneck", "Medium", "High", "Product profiles describe human intervention or in-house billers for exceptions", "Operating model exists; capacity is undisclosed", "Medium-high", "Measure exception rate, queue age, staffing leverage, rework, and service margin by payer and specialty"]
    notes: "Ratings separate sector risk mechanisms from Candid-specific performance; unknown control evidence is recorded as a gap, not as proof that a failure occurred."
    claimRefs: [CR002, CR003, CR004, CR008, CR011, CR012]
