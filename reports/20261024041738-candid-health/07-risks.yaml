        - label: "PHI privacy or security control failure"
          values: ["Critical", "Medium", "Public listings only", "High"]
        - label: "Payer-rule accuracy drift"
          values: ["High", "High", "Developed but unverified", "Medium-high"]
        - label: "AI output or model-governance failure"
          values: ["High", "Medium", "Not publicly evidenced", "High"]
        - label: "Customer integration and segment expansion"
          values: ["High", "Medium", "Partial", "Medium-high"]
        - label: "Unit economics and capital visibility"
          values: ["High", "Unknown", "Not publicly evidenced", "High"]
    approximationNotes: "Qualitative ratings synthesize cited mechanisms and evidence gaps; they are not measured probabilities, losses, or evidence of a Candid-specific incident."
    claimRefs: [CR008, CR010, CR012, CR015, CR016]
callouts:
  - calloutType: risk
    title: Evidence standard before underwriting
    body: >-
      Require primary security assurance, payer-level quality cohorts, tested recovery
      evidence, current economics, and dependency concentration before treating the
      automation narrative as a durable operating moat.
    claimRefs: [CR010, CR011, CR012, CR015, CR016]
  - calloutType: assumption
    title: Exposure is not incident evidence
    body: >-
      The assigned sources do not establish that Candid has suffered a breach,
      enforcement action, material outage, or litigation loss; comparable incidents
      and general obligations define diligence priorities, not a company incident record.
    claimRefs: [CR007, CR011, CR012]
