      - ["Payer rules and adjudication behavior", "More than 1,000 U.S. payors according to the Series D lead", "Broad rule coverage; payer mix unknown", "A rule change or uncommon edge case causes denials and manual rework", "High", "Rules engine and feedback loop are described; independent accuracy evidence is missing", "Medium-high"]
      - ["Customer systems and implementation", "Provider APIs, EHRs, and internal billing operations", "Workflow coupling is high; customer concentration is unknown", "Integration defects or slow deployment delay value realization and collections", "High", "API-led integration and single-tenant deployment are listed", "Medium-high"]
      - ["Target-segment and stack position", "Digital-health providers, practices, EMRs, clearinghouses, and billing firms", "Segment and channel mix unknown", "Enterprise fit limits expansion or adjacent platforms absorb billing functions", "High", "Broader provider use cases are listed, but current win and retention data are absent", "High"]
    notes: "Named counterparties and concentration denominators are unavailable in the assigned evidence, so roles are shown without inventing supplier or customer shares."
    claimRefs: [CR001, CR002, CR005, CR006, CR012, CR013, CR014]
