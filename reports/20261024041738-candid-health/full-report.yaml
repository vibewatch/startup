  - id: TV004
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation or return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - Verified recurring revenue, strong gross margin, durable retention, and customer ROI
        - Premium to RCM benchmark may be supportable after a disclosed revenue base
        - Conditional; requires new evidence
        - Growth decelerates or customer economics fail independent checks
      - - Base
        - Series D demand is real, but price, margins, and cash economics remain private
        - Research-more; defer entry until price and unit economics are reconciled
        - Most defensible on current public evidence
        - Company declines to disclose core underwriting inputs
      - - Bear
        - Valuation step-up exceeds sustainable revenue quality or sector multiples compress
        - Avoid or wait for repricing / a later financing with transparent terms
        - Material tail risk
        - Down-round, multiple compression, concentration, or service-heavy margins
    notes: >-
      Scenario logic is qualitative because Candid's absolute valuation and revenue base are unavailable; no probability
      percentages or invented valuation ranges are asserted.
    claimRefs:
      - CV006
      - CV008
      - CV010
      - CV011
      - CV012
      - CV013
