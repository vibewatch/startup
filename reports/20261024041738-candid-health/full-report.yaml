chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and operating model
        blocks:
          - type: paragraph
            body: >-
              The available evidence identifies Candid Health as a San Francisco-based, privately held healthcare
              technology company founded in 2019. Its product is an API-first revenue cycle management platform that
              connects provider, clinical, billing, and payer data, then uses deterministic rules, machine learning, and
              AI agents to automate claim creation, submission, payment processing, denial management, appeals, and
              reporting. The product is positioned as infrastructure for healthcare providers rather than a
              patient-facing application. An investor-sponsored description says the target customer is primarily
              digital-health companies that bill insurance, while current financing coverage describes a broader base of
              more than 200 healthcare organizations. The evidence supports a usage-linked healthcare workflow business,
              but not a verified subscription-only model.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
