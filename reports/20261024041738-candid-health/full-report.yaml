        blocks:
          - type: paragraph
            body: >-
              Nick Perry and Doug Proctor are consistently identified as co-founders and former Palantir operators, with
              sources describing Perry's commercial healthcare leadership and Proctor's work on large product and
              government teams. One historical sponsored account also names Adam Reis as a founder, creating a
              governance record that should be reconciled against the current cap table and company biography. The
              evidence is strongest for Perry and Proctor's technical and healthcare operating background, and weaker
              for a complete current executive roster, board composition, succession planning, or separation of founder
              responsibilities. The concentration of product and domain knowledge in the founding team is therefore a
              material diligence consideration, even though no leadership departure is evidenced in the assigned
              sources.
