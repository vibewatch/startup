  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status quo
        blocks:
          - type: paragraph
            body: >-
              The relevant market is provider-side revenue cycle management: eligibility and registration inputs, coding
              and claim creation, clearinghouse submission, payer adjudication and remittance, denial and
              accounts-receivable work, patient balance collection, and the reporting needed to manage those workflows.
              It includes software, automation, and associated managed services sold to provider organizations, medical
              groups, MSOs, digital-health providers, and EHR partners. It excludes clinical recordkeeping, payer
              administration, and the patient's underlying medical expense. The status quo is not one product: providers
              can retain legacy RCM suites, outsource billing, operate internal teams, or build integrations and rules
              themselves. That fragmented substitute set explains both the budget opportunity and the implementation
              burden.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: Sizing lenses and market economics
        blocks:
          - type: paragraph
            body: >-
              Two different sizing lenses are visible in the assigned evidence. Investor and company-linked materials
              describe a roughly $280 billion annual RCM industry, a top-down measure of the broad economic activity
              around provider billing. A second lens is the operational loss pool: Sixth Street cites increasing
              denials, more than half of denied claims not being reworked, and approximately 4% to 5% of net revenue
              forfeited; Adonis reports that nearly two-thirds of surveyed leaders saw denials and underpayments as
              their largest revenue-growth barrier. These figures describe exposure and urgency, not Candid revenue or
              an immediately serviceable market. No source in the pool provides a Candid-specific U.S. SAM, reachable
              specialty subset, pricing-derived revenue pool, or evidence-based SOM, so those remain diligence gaps
              rather than inferred percentages of TAM.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM011
              - CM012
              - CM013
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM012
              - CM015
      - number: '2.3'
        title: Buyer segmentation and adoption path
        blocks:
          - type: paragraph
            body: >-
              The economic buyer is usually the provider organization or MSO responsible for collections, labor, and
              financial performance; revenue-cycle, finance, and operations teams are the principal users, while an EHR
              or practice-management platform can be the distribution partner. Digital-health providers are the
              lowest-friction beachhead in the evidence because they may be buying billing infrastructure for the first
              time and can integrate through an API. Multi-specialty groups and telehealth providers are documented
              target segments, while larger traditional providers face more extensive replacement and integration work.
              Adoption therefore follows a workflow trigger—denial pressure, labor cost, payment visibility, or
              growth—rather than a generic AI budget. A three-to-six-month go-live claim is faster than the incumbent
              timelines described by management, but it is still a material systems-change project.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM008
              - CM009
              - CM010
      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption drivers are mandatory payment workflows, rising payer complexity, denial and
              underpayment pressure, expensive administrative labor, and the possibility that adjudication data improves
              future submissions. The main constraints are integration and switching cost, changing payer rules,
              specialty edge cases, compliance exposure from incorrect automation, and incumbent or adjacent
              competition. Independent market evidence shows a broad field of vendors across full-suite RCM, denial
              prevention, eligibility, clearinghouse, payment posting, analytics, and managed services; it does not show
              that Candid wins each category. For valuation, these drivers support a large and mission-critical
              opportunity, while the unresolved SAM, retention by segment, independent outcome verification, and
              sustainable gross-margin path limit how much of the top-down market can be underwritten.
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The market is mandatory and fragmented
            body: >-
              Provider payment is unavoidable, but the workflow spans many payer rules, systems, and exception paths;
              this creates a real automation need without making every RCM dollar addressable by one platform.
            calloutType: insight
            claimRefs:
              - CM001
              - CM004
              - CM011
          - type: callout
            title: Sizing remains evidence-constrained
            body: >-
              The assigned sources support market scale and pain, but a valuation-grade Candid SAM/SOM requires
              bottom-up segmentation, pricing, claim volume, implementation capacity, and independently verified
              retention.
            calloutType: assumption
            claimRefs:
              - CM007
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and competitive set
        blocks:
          - type: paragraph
            body: >-
              Candid operates across several competitor classes rather than against one homogeneous peer group.
              Independent vendor profiles describe an end-to-end revenue-cycle platform covering claims submission,
              billing-issue resolution, API integration, and real-time analytics, with digital-health providers,
              physician groups, management services organizations, and electronic-medical-record platforms as relevant
              users. The disclosed alternatives therefore include incumbent suites such as Waystar and athenahealth,
              other automation vendors such as Adonis and Apero, specialized or adjacent tools, outsourced billing
              services, and the status quo of internal staff using institutional memory and manual workflows. The latter
              is not a weak comparator: Oak HC/FT described practices as relying on manual workflows with high error
              rates and repeated payer back-and-forth. Candid's buyer can also choose a broad suite for consolidation or
              a narrower tool for a single workflow, so product breadth, implementation risk, integration maturity, and
              service support matter as much as automation claims.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
      - number: '3.2'
        title: Capability, distribution, and trust comparison
        blocks:
          - type: paragraph
            body: >-
              Candid's stated product thesis is to engineer a claim correctly before submission rather than rely
              primarily on post-denial remediation. Sixth Street says the platform reverse-engineered requirements from
              more than a thousand U.S. payors and built a continuously enriched model of rosters, fee schedules, charge
              rules, and adjudication behavior. Oak's earlier description similarly emphasizes structured data, a rules
              engine, and analytics by payer, CPT code, and provider. These are meaningful workflow differentiators if
              they translate across specialties and payors, but they are also exposed to incumbent response: Waystar
              already serves more than 30,000 customers and approximately one million providers, processes more than $5
              billion of payment transactions annually, and reports internally developed AI and a large feature-delivery
              cadence. The independent KLAS coverage also warns that no measured incumbent offered a validated
              end-to-end suite and that integration gaps, extra module charges, and slow feature delivery remain common.
              Thus Candid may win on focused automation and data feedback while incumbents retain distribution,
              installed data, and procurement credibility.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP009
              - CP010
      - number: '3.3'
        title: Switching costs, pricing opacity, and moat durability
        blocks:
          - type: paragraph
            body: >-
              The likely moat is operational rather than purely algorithmic. Candid's accumulated payer rules,
              customer-specific data, claim outcomes, and integrations can increase switching costs as they become
              embedded in billing operations. Sixth Street explicitly characterizes the knowledge graph as an
              information flywheel in which processed claims feed the rules corpus. Yet the same sources leave important
              durability tests unresolved. Public competitor pages do not provide a comparable Candid price card,
              realized savings schedule, contract duration, implementation cost, or retention cohort. Elion reports an
              average implementation length of one to three months and a single-tenant SaaS deployment, but that does
              not establish renewal economics or migration friction. KLAS finds that consolidation customers still pay
              incremental charges for added modules and that no vendor has true all-inclusive pricing. Candid therefore
              has a credible data-and-workflow wedge, while pricing power, multi-homing, channel access, and the cost of
              an incumbent matching its automation remain open diligence questions.
            claimRefs:
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: Competitive verdict
        blocks:
          - type: paragraph
            body: >-
              Candid appears best positioned where a provider group values upstream denial prevention, granular
              operational visibility, and a modern integration layer more than maximum suite breadth. Its public
              evidence is strongest on product architecture and investor-reported customer outcomes, not on
              independently benchmarked win rates, pricing, or long-term retention. The competitive risk is two-sided:
              legacy platforms can bundle adjacent workflows and exploit their installed base, while narrower AI vendors
              or internal teams can attack individual tasks at lower apparent cost. A defensible lead would require
              evidence that Candid's payer-specific data compounds faster than competitors can replicate, customers
              expand rather than multi-home, and measurable collection or labor outcomes survive across specialties.
              Until those tests are answered, the platform merits a focused competitive thesis rather than a claim of
              category ownership.
            claimRefs:
              - CP007
              - CP009
              - CP010
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Data-and-workflow wedge
            body: >-
              Candid's strongest competitive argument is that payer-specific data, rules, and claim outcomes compound
              inside one workflow rather than being split across disconnected tools.
            calloutType: strength
            claimRefs:
              - CP006
              - CP007
              - CP012
          - type: callout
            title: Incumbent distribution and proof gap
            body: >-
              Waystar's installed base and suite breadth are substantial counterweights, while independent evidence on
              Candid's realized pricing, win rates, retention, and cross-specialty outcomes is still missing.
            calloutType: risk
            claimRefs:
              - CP009
              - CP010
              - CP014
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Candid sells software and operational automation into the healthcare revenue cycle rather than a
              conventional seat-based workflow product. The public description is an end-to-end process spanning
              eligibility, coding support, claim creation and submission, denial management, appeals, payment posting,
              and reporting. The clearest public pricing disclosure is a transaction-linked model: Out-Of-Pocket
              reported pricing starting at 3% of collections without medical coding and 3% plus $6 per claim when coding
              is included, with adjustments for state, complexity, and claim volume. That is a list-price indication,
              not realized revenue, gross margin, or customer-level take rate. The same source describes a hybrid
              customer motion in which some providers use Candid's software alongside an internal billing team, while
              others seek to outsource more of the workflow. This creates a plausible software-plus-services transition
              path, but the public record does not disclose the mix of subscription, percentage-of-collections,
              per-claim, or service revenue. Revenue quality therefore depends on validating contracts, realized rates,
              claim volumes, implementation fees, and whether automation changes the labor required to serve each
              account.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI009
      - number: '4.2'
        title: Traction and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              The available traction evidence is mostly company-reported or investor-reported. Sixth Street's investment
              announcement says annual contracted run-rate revenue grew 190% year over year in 2025 and net dollar
              retention was 180% year over year in 2025; its announcement also says Candid served more than 200
              healthcare organizations. VentureBurn repeated those figures while describing enterprise adoption, and
              Healthcare Discovery records a different September 2026 company figure of 250 customer organizations.
              These are useful directional signals but not a reconciled customer cohort or audited revenue series. The
              investor says it spoke with nearly 40 customers, but that is diligence commentary from a lead investor,
              not a third-party operating audit. Public sources do not provide sales-cycle length, CAC, payback, quota
              attainment, churn, implementation cost, or customer concentration. A finance review should therefore treat
              retention and contracted run-rate growth as reported proxies, not as substitutes for recognized revenue,
              cash conversion, or contribution margin.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
      - number: '4.3'
        title: Cost structure and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              Candid's cost structure is likely shaped by payer-rule maintenance, integrations, implementation, billing
              operations, and the compute and labor required to resolve exceptions, but the public sources do not
              quantify those components. Sixth Street describes a configurable rules engine, a unified model of
              provider, fee-schedule, charge-rule, and payer-adjudication data, and AI agents applied to eligibility,
              coding, and appeals workflows. Oak HC/FT similarly describes structuring provider rosters, charge rates,
              and fee schedules while building GenAI capabilities. Those descriptions support an operating model with
              potential automation leverage, but they do not establish gross margin or the pace at which manual work is
              being removed. Capital is also not equivalent to runway: the announced Series D was $120 million, while
              Healthcare Discovery says the SEC Form D reported $104,873,634 sold from 12 investors and notes a
              $15,126,366 difference from the announcement. The public record does not provide cash on hand, burn, debt,
              runway, use-of-funds detail, or a next-round trigger, so financing dependency remains a material
              underwriting gap.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI004
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Candid has a credible revenue-quality thesis if transaction-linked pricing converts into recurring,
              high-retention provider revenue while the rules corpus and workflow automation reduce marginal service
              cost. The evidence is not yet sufficient to underwrite that margin path. Out-Of-Pocket's description of
              the product and pricing is sponsored and the author discloses being an investor; Sixth Street and Oak
              HC/FT are investors whose positive descriptions are not independent benchmarks. Conversely, Healthcare
              Discovery explicitly distinguishes public capital and security-attestation evidence from company-reported
              performance, stating that the methods behind touchless rates, collection rates, and claim volume are
              unpublished. The adverse financial conclusion is therefore not that the business lacks traction, but that
              absolute revenue, realized pricing, gross margin, cash burn, runway, debt obligations, customer
              concentration, and independently measured efficacy are unavailable. The next diligence step is a
              cohort-level bridge from contracted run-rate to recognized revenue and collections, paired with
              account-level gross margin and cash-flow schedules.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Reported growth and retention are strong directional signals
            body: >-
              Candid reported 190% year-over-year annual contracted run-rate revenue growth and 180% year-over-year net
              dollar retention for 2025, but the public record does not disclose absolute revenue or cohort definitions.
            calloutType: strength
            claimRefs:
              - CI005
              - CI006
          - type: callout
            title: Capital raised does not establish runway
            body: >-
              The $120 million announced Series D and the separately reported $104.9 million Form D amount do not reveal
              cash on hand, burn, debt, or financing dependency.
            calloutType: risk
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
          - type: callout
            title: Underwrite from contracts and cash schedules
            body: >-
              Request a customer-level revenue bridge, realized pricing, gross-margin schedule, cash forecast, debt
              schedule, and KPI definitions before relying on headline growth or automation claims.
            calloutType: recommendation
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product in the customer workflow
        blocks:
          - type: paragraph
            body: >-
              Candid sits between a provider or digital-health company's clinical and operating systems and the payer
              payment cycle. The documented workflow starts with claim data, patient and provider records, coverage,
              encounters, diagnoses, service lines, and payer identity; Candid then creates and submits a professional
              claim and returns a claim response with Candid encounter and claim identifiers. The external Medplum
              integration guide makes this concrete rather than merely describing an API: a custom operation on a FHIR
              Claim submits the claim, and a successful response is stored back in Medplum. Earlier product coverage
              describes the broader scope as claim submission, claim follow-up, payment integrity, denial management,
              and appeals. This is a workflow infrastructure product, not simply a dashboard, but the public record does
              not establish how much of every workflow is fully autonomous for every specialty.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE005
              - CE009
              - CE011
              - CE014
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE003
              - CE007
              - CE008
              - CE010
      - number: '5.2'
        title: Operating architecture and data feedback loop
        blocks:
          - type: paragraph
            body: >-
              The public technical picture is a layered operating model. An API and integration surface receives
              structured clinical, provider, coverage, and payer data; a payer directory and rules layer resolves payer
              identity and validates claim requirements; a submission and remittance layer sends claims and interprets
              responses; and reporting exposes operational breakdowns back to the provider. An investor description says
              Candid has reverse-engineered requirements from more than a thousand U.S. payors and built a continuously
              enriched knowledge graph of provider rosters, fee schedules, charge rules, and adjudication behavior. A
              separate external integration guide shows the implementation burden that sits underneath this abstraction:
              required FHIR resources, payer identifiers, facility rules, service-line fields, idempotent submission
              behavior, retries, and debug documents. The architecture therefore appears differentiated by
              domain-specific data normalization and feedback, while remaining dependent on source-system data quality,
              payer rule changes, and correct integration mapping.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE013
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE007
              - CE008
              - CE014
      - number: '5.3'
        title: Maturity, deployment, and differentiation
        blocks:
          - type: paragraph
            body: >-
              Evidence indicates a product with meaningful deployment maturity but incomplete public proof of scale.
              Elion's curated profile describes an end-to-end RCM platform, API integration, single-tenant SaaS
              deployment, U.S. data residency, SOC 2 Type 1, HIPAA, and a typical implementation length of one to three
              months; it also lists 21 verified customers in its profile dataset. Medplum's live guide documents a real
              integration path through FHIR resources and a custom operation, including idempotency and troubleshooting
              artifacts. Candid's investor describes 95–99% first-pass touchless claim resolution, under-20-days average
              time to payment, and approximately 40% less manual work in cost-to-collect, but these are customer KPI
              claims rather than independently audited benchmarks. The most credible differentiation is the combination
              of payer-specific rules, normalized billing data, and workflow feedback; the diligence gap is production
              validation by specialty, payer mix, and implementation cohort.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Controls, dependencies, and technical risks
        blocks:
          - type: paragraph
            body: >-
              The product's technical risk is concentrated in correctness and change management rather than in a merely
              novel interface. The integration guide requires exact payer resolution, provider and facility mappings,
              claim coding, diagnosis pointers, and service-line data; a missing payer match can hard-fail submission,
              while non-telehealth claims require a service facility. The same guide documents transient retries and
              idempotent responses, which are useful operational controls, but it does not prove end-to-end uptime,
              incident rates, security test results, or recovery objectives. Investor and customer-facing sources say
              the rules corpus learns from claim outcomes and that agentic workflows are being expanded, yet the public
              evidence does not disclose model-evaluation protocols, human escalation thresholds, change-approval
              controls, or specialty-level error rates. Buyers should therefore diligence integration test coverage,
              payer-rule update SLAs, PHI controls, audit logs, rollback procedures, and measured denial and payment
              outcomes before treating the automation claims as durable.
            claimRefs:
              - CE013
              - CE014
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The moat is the feedback loop, not the API alone
            body: >-
              Candid's defensibility would come from payer-specific data, normalized billing entities, and outcome
              feedback compounding into better rules. The public API is a credible integration surface, but an API
              without evidence of superior payer coverage, accuracy, and operational outcomes is not by itself a durable
              moat.
            calloutType: insight
            claimRefs:
              - CE005
              - CE006
              - CE011
          - type: callout
            title: Automation claims need production-level validation
            body: >-
              Public KPI claims are promising but largely investor- or company-reported. The key diligence question is
              whether touchless resolution and payment speed persist across difficult specialties, changing payer rules,
              and customer implementations rather than only selected cohorts.
            calloutType: risk
            claimRefs:
              - CE011
              - CE014
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buyer
        blocks:
          - type: paragraph
            body: >
              Candid's buyer universe is broader than a single specialty but remains concentrated in organizations that
              need payer-facing revenue-cycle infrastructure. The Elation partner profile identifies multi-location
              practices and provider groups with 10–1,000+ physicians, while the investor materials describe
              digital-health companies, medical groups, and MSOs. The Flatiron relationship adds community oncology
              practices, where multi-drug regimens, prior authorization, and specialty billing create a distinct
              workflow. This points to a platform sold to provider organizations and operating teams rather than
              directly to patients. The buyer may be a practice or MSO, while billing, finance, and clinical operations
              are the primary users. Public materials do not disclose customer-level revenue bands, contract sizes,
              implementation conversion, or payer mix, so segment attractiveness should not be mistaken for quantified
              wallet share.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
      - number: '6.2'
        title: Adoption trajectory and outcome evidence
        blocks:
          - type: paragraph
            body: >
              Adoption evidence is directionally strong but heterogeneous. Sixth Street says Candid serves more than 200
              medical groups, MSOs, and digital-health companies, while a Flatiron announcement says the partnership is
              intended to make the platform available to practices across a network covering more than 5,100 providers
              and 220+ community oncology practices; network reach is not the same as Candid deployments. A named
              Talkiatry testimonial in a syndicated announcement reports 40% less manual work while claims volume
              increased 45% year over year, and Elation reports 21 verified customers on its marketplace profile. These
              are useful signals across scale, workflow, and named proof, but most are company-, partner-, investor-, or
              marketplace-reported. No public cohort table establishes active customers, renewal, GRR, NRR, churn, or a
              consistent denominator for outcome claims.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU007
              - CU008
              - CU009
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU003
              - CU007
              - CU009
              - CU013
      - number: '6.3'
        title: Named proof, durability, and concentration
        blocks:
          - type: paragraph
            body: >
              Named references span Talkiatry, Tia, Nourish, and Ophelia in the Elation partner listing, plus the
              Flatiron relationship for oncology. The evidence supports customer association and use-case breadth, not
              necessarily production status, deployment size, or outcome durability for each logo. Independent
              marketplace material reports 21 verified customers and a mix of virtual-first providers, specialty
              practices, primary-care clinics, and health-system-oriented categories, but it does not provide a
              retention cohort or contract economics. AVIA's independent comparison surface also places Candid in a
              buyer workflow built around alternatives, compatibility, peer reviews, and organizational fit,
              underscoring that partner placement does not remove competitive procurement. Adverse evidence is indirect:
              reporting on Tia describes patient-care and surprise-billing complaints, which does not establish a defect
              in Candid, but does show why a customer association should not be treated as an endorsement of the
              customer's own service quality. Concentration, top-account exposure, channel dependence, and expansion
              rates remain diligence gaps.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU007
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Distribution expands through workflow partners
            body: >-
              The Flatiron partnership gives Candid a route into a defined oncology network, but network coverage should
              not be counted as deployed customer count.
            calloutType: strength
            claimRefs:
              - CU003
              - CU006
          - type: callout
            title: Retention and concentration are not publicly measurable
            body: >-
              Public evidence shows logos, marketplace counts, and selected outcomes, but not cohort retention, customer
              revenue concentration, contract duration, or independently audited performance.
            calloutType: risk
            claimRefs:
              - CU009
              - CU013
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked residual risk view
        blocks:
          - type: paragraph
            body: >-
              The most consequential exposure is an interruption or integrity failure in the claims workflow, because
              Candid participates in submission, issue resolution, integrations, and financial-performance reporting. A
              Change Healthcare breach provides a sector precedent for how failure at a critical transaction provider
              can halt claims and remittance processes and create provider liquidity and legal consequences; it is not
              evidence that Candid has suffered such an incident. Payer-rule drift and AI error rank next because
              Candid's value proposition depends on keeping complex rules accurate while limiting manual exceptions.
              Privacy compliance, customer integration, segment expansion, and opaque unit economics add residual
              exposure. The heatmap is therefore a qualitative prioritization of documented mechanisms and missing
              controls, not a probability model or a record of Candid-specific incidents.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
              - CR011
              - CR012
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR008
              - CR010
              - CR012
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory, privacy, and AI governance
        blocks:
          - type: paragraph
            body: >-
              Revenue-cycle automation can involve protected health information even when the software is performing
              administrative rather than clinical work. HIPAA Journal states that a third-party AI vendor creating,
              receiving, maintaining, or transmitting PHI for a covered entity requires a Business Associate Agreement,
              and that existing privacy, security, breach-notification, and minimum-necessary duties continue to apply.
              It also reports that state rules can impose stricter consent, secondary-use, transparency, and
              sensitive-data restrictions. Public directory entries list HIPAA and SOC 2 attributes for Candid, while
              one leaves HITRUST unknown; those listings do not establish the current scope, exceptions, or operating
              effectiveness of controls. Underwriting should therefore depend on primary assurance documents, data-flow
              and subprocessor inventories, incident procedures, and contract allocation rather than marketplace labels.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR001
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
      - number: '7.3'
        title: Operational quality and resilience
        blocks:
          - type: paragraph
            body: >-
              The operating model must continuously translate heterogeneous payer behavior into accurate claims and
              remittance workflows. Sixth Street says Candid has reverse-engineered requirements for more than 1,000
              U.S. payors, while Out-Of-Pocket and Oak HC/FT describe payer rules and adjudication data as changing and
              difficult to normalize. That breadth is a potential moat and a maintenance burden: stale rules, unusual
              specialties, bad upstream data, or an incorrect automated output can create denials, rework, delayed
              payment, and customer escalation. The presence of an exception-services layer shows that some work still
              requires people, but public evidence does not quantify queue capacity, error rates, overrides, uptime,
              recovery objectives, or reconciliation performance. Diligence should test these measures by payer,
              specialty, and claim cohort rather than rely on aggregate automation claims.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR008
              - CR011
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR008
              - CR011
              - CR012
      - number: '7.4'
        title: Dependencies, business-model risk, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Candid's workflow is coupled to customer systems, clearinghouses, payer behavior, and customer willingness
              to integrate a new billing platform. Elion lists a single-tenant SaaS deployment, API integration, and a
              one-to-three-month average implementation period, while independent product profiles identify weaker fit
              for low-volume, on-premise, or incumbent-enterprise settings. An older investor-sponsored analysis also
              flags the difficulty of moving beyond digital health startups and reports percentage-of-collections
              pricing; neither current pricing nor present unit economics is established by the assigned evidence.
              Alternatives listed by AVIA and possible substitution by EMRs, clearinghouses, and billing firms compound
              execution risk. The investment thesis should break on a material PHI incident, sustained claims-processing
              outage, repeated payer-rule accuracy failures, or inability to provide current security assurance. Burn,
              runway, gross margin, concentration, current pricing, and supplier redundancy require direct diligence
              rather than inference.
            claimRefs:
              - CR005
              - CR006
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR006
              - CR012
              - CR013
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Evidence standard before underwriting
            body: >-
              Require primary security assurance, payer-level quality cohorts, tested recovery evidence, current
              economics, and dependency concentration before treating the automation narrative as a durable operating
              moat.
            calloutType: risk
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR015
              - CR016
          - type: callout
            title: Exposure is not incident evidence
            body: >-
              The assigned sources do not establish that Candid has suffered a breach, enforcement action, material
              outage, or litigation loss; comparable incidents and general obligations define diligence priorities, not
              a company incident record.
            calloutType: assumption
            claimRefs:
              - CR007
              - CR011
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment case and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The investment case is a mission-critical RCM platform addressing a large, structurally inefficient market
              with evidence of rapid expansion. Candid announced a $120 million Series D on July 22, 2026, led by Sixth
              Street Growth, and the announcement states that the financing increased valuation threefold versus the
              February 2025 Series C. Sixth Street's investment rationale cites a $280 billion RCM industry,
              customer-reported operating outcomes, and a 190% year-over-year increase in annual contracted run-rate
              revenue in 2025. Independent product reviews describe an API-first platform with custom, unpublished
              pricing and limited independent outcome data. That combination creates a credible quality-and-growth
              thesis but not enough public information to determine whether the latest price is attractive.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV008
              - CV010
              - CV016
      - number: '8.2'
        title: Financing context and comparable evidence
        blocks:
          - type: paragraph
            body: >-
              Financing evidence is current but incomplete. The July 2026 Series D amount and lead investor are
              disclosed, and multiple sources report total capital above $219 million after the round, yet none of the
              retained sources gives an absolute post-money valuation, share price, liquidation preference, option-pool
              treatment, debt balance, or cash balance. The reported threefold valuation increase is therefore a
              relative mark, not a usable entry valuation. Healthcare Growth Partners reports a 4.7x Health IT revenue
              multiple at June 30, 2026 and a 6.0x median multiple for RCM technology, while noting that multiples
              recovered from a 3.7x April low. These are sector benchmarks, not a Candid valuation: Candid's revenue,
              margin, retention denominator, and accounting definitions are not publicly disclosed. A disciplined
              investor should use the benchmarks only after obtaining company financials and reconciling recurring
              revenue with the reported run-rate metric.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: Decision, scenarios, and diligence
        blocks:
          - type: paragraph
            body: >-
              The appropriate decision is research more, with a high risk rating and an unknown valuation stance. The
              business may justify a premium if growth converts into durable, high-margin recurring revenue and the
              rules-and-data infrastructure produces measurable customer retention and collection benefits. Conversely,
              a threefold valuation step-up can leave little room for execution misses, multiple compression, customer
              concentration, or a larger services component than the software narrative implies. The retained evidence
              also shows unresolved commercial constraints: PracticeAll says Candid does not publish pricing, requires
              technical setup, and has limited independent review data; Out-Of-Pocket identifies competition and the
              question of whether digital health is a sufficiently large market. Before underwriting an entry price,
              diligence should obtain cohort-level ARR and retention, gross margin by software and services, customer
              concentration, cap-table terms, cash runway, and an independently verified customer reference set.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV004
            claimRefs:
              - CV006
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Research more before underwriting
            body: >-
              The latest financing and growth disclosures are encouraging, but the retained public evidence does not
              establish an absolute valuation, ARR base, gross margin, cash runway, or preference structure. A
              price-sensitive recommendation should wait for those inputs.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV016
          - type: callout
            title: Relative valuation is not a price
            body: >-
              A threefold increase over the Series C valuation indicates investor demand but cannot be translated into
              return potential without the underlying post-money valuation and ownership terms.
            calloutType: risk
            claimRefs:
              - CV006
              - CV007
              - CV011
