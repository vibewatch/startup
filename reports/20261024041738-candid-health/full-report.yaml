        - label: Transaction execution
          modules:
            - Claim creation
            - Claim submission
            - Payer adjudication
            - Remittance ingestion
        - label: Operations and feedback
          modules:
            - Payment interpretation
            - Exception and task workflows
            - Reporting by payer/code/provider
            - Debug documents
        - label: Automation layer
          modules:
            - Eligibility workflows
            - Coding and appeals agents
            - Resubmission rules
