    columns: [Metric, Value, Date, Source / confidence, Implication, Missing denominator]
    rows:
      - [Organizations served, "More than 200", "2026", "Sixth Street investor post; medium confidence", "Indicates broad commercial reach across provider-oriented segments", "Active versus historical accounts and production status"]
      - [Annual contracted run-rate revenue growth, "190% year over year", "2025", "Sixth Street investor post; medium confidence", "Suggests rapid commercial scaling", "Absolute run-rate revenue, customer contribution, and cohort mix"]
      - [Talkiatry manual-work reduction, "40%", "2025-08-06 announcement", "Candid/PRNewswire syndicated release; medium confidence", "Provides one named workflow outcome", "Baseline, measurement method, and independent verification"]
      - [Talkiatry claims-volume growth, "45% year over year", "2025-08-06 announcement", "Candid/PRNewswire syndicated release; medium confidence", "Shows reported scaling under higher volume", "Period denominator and whether volume was entirely Candid-processed"]
      - [Verified customers on Elation profile, "21", "2026 access date", "Elation marketplace profile; medium confidence", "Provides a marketplace-specific customer signal", "Definition, overlap with broader customer count, and retention"]
    notes: "Values are reported by different issuers with different scopes and periods; they are not a single comparable adoption series. Run-rate revenue is not ARR, and no value here establishes cash generation."
    claimRefs: [CU005, CU007, CU008, CU009]
  - id: TU003
    title: Named customer proof table
    columns: [Customer or network, Segment, Deployment / use case, Production vs pilot, Outcome, Limitation]
    rows:
      - [Talkiatry, "National telepsychiatry", "RCM automation and claims workflow", "Customer-reported use; production status not independently verified", "40% less manual work while claims volume rose 45% year over year", "Syndicated company announcement; baseline and methodology undisclosed"]
      - [Flatiron Health network, "Community oncology", "Partnership connecting OncoEMR network with Candid RCM", "Partnership access; participating-practice deployment count not disclosed", "Intended to increase net collections, lower cost to collect, and accelerate reimbursement", "Network coverage is not a Candid customer count"]
      - [Tia, "Women's health", "Named in Elation customer listing", "Customer association; deployment and production scope not disclosed", "No Candid-specific outcome disclosed", "Independent reporting describes Tia patient-care and billing complaints; attribution to Candid would be unsupported"]
      - [Nourish and Ophelia, "Virtual-first and specialty care", "Named in Elation customer listing", "Named logos; pilot versus production not disclosed", "No customer-specific outcome disclosed", "Logo evidence alone does not prove retention or revenue"]
    enumerationScope:
      coverage: partial
      basis: "Publicly named customer references identified in the assigned 2025-2026 source set; private and undisclosed deployments are not enumerated."
    notes: "The table separates customer association from production deployment and outcome evidence. Named logos and partner-network coverage do not establish retention, contract value, or customer concentration."
    claimRefs: [CU007, CU010, CU011, CU012]
