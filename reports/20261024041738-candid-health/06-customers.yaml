company:
  name: Candid Health
chapter:
  number: 6
  title: Customers
  summary: Candid has credible evidence of adoption across digital-health providers, physician groups, MSOs, and specialty practices, including a Flatiron partnership that extends its reach into community oncology. Public proof is still weighted toward company, investor, partner, and marketplace disclosures; independent retention, concentration, and production-outcome evidence remains limited.
sections:
  - id: customer-segments-and-buyer
    title: Customer segments and buyer
    body: |
      Candid's buyer universe is broader than a single specialty but remains concentrated in organizations that need payer-facing revenue-cycle infrastructure. The Elation partner profile identifies multi-location practices and provider groups with 10–1,000+ physicians, while the investor materials describe digital-health companies, medical groups, and MSOs. The Flatiron relationship adds community oncology practices, where multi-drug regimens, prior authorization, and specialty billing create a distinct workflow. This points to a platform sold to provider organizations and operating teams rather than directly to patients. The buyer may be a practice or MSO, while billing, finance, and clinical operations are the primary users. Public materials do not disclose customer-level revenue bands, contract sizes, implementation conversion, or payer mix, so segment attractiveness should not be mistaken for quantified wallet share.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-and-outcomes
    title: Adoption trajectory and outcome evidence
    body: |
      Adoption evidence is directionally strong but heterogeneous. Sixth Street says Candid serves more than 200 medical groups, MSOs, and digital-health companies, while a Flatiron announcement says the partnership is intended to make the platform available to practices across a network covering more than 5,100 providers and 220+ community oncology practices; network reach is not the same as Candid deployments. A named Talkiatry testimonial in a syndicated announcement reports 40% less manual work while claims volume increased 45% year over year, and Elation reports 21 verified customers on its marketplace profile. These are useful signals across scale, workflow, and named proof, but most are company-, partner-, investor-, or marketplace-reported. No public cohort table establishes active customers, renewal, GRR, NRR, churn, or a consistent denominator for outcome claims.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-proof-retention-and-concentration
    title: Named proof, durability, and concentration
    body: |
      Named references span Talkiatry, Tia, Nourish, and Ophelia in the Elation partner listing, plus the Flatiron relationship for oncology. The evidence supports customer association and use-case breadth, not necessarily production status, deployment size, or outcome durability for each logo. Independent marketplace material reports 21 verified customers and a mix of virtual-first providers, specialty practices, primary-care clinics, and health-system-oriented categories, but it does not provide a retention cohort or contract economics. AVIA's independent comparison surface also places Candid in a buyer workflow built around alternatives, compatibility, peer reviews, and organizational fit, underscoring that partner placement does not remove competitive procurement. Adverse evidence is indirect: reporting on Tia describes patient-care and surprise-billing complaints, which does not establish a defect in Candid, but does show why a customer association should not be treated as an endorsement of the customer's own service quality. Concentration, top-account exposure, channel dependence, and expansion rates remain diligence gaps.
    claimRefs: [CU010, CU011, CU012, CU013, CU016]
    tableRefs: [TU003]
callouts:
  - calloutType: strength
    title: Distribution expands through workflow partners
    body: The Flatiron partnership gives Candid a route into a defined oncology network, but network coverage should not be counted as deployed customer count.
    claimRefs: [CU003, CU006]
  - calloutType: risk
    title: Retention and concentration are not publicly measurable
    body: Public evidence shows logos, marketplace counts, and selected outcomes, but not cohort retention, customer revenue concentration, contract duration, or independently audited performance.
    claimRefs: [CU009, CU013, CU016]
