company:
  name: Candid Health
chapter:
  number: 5
  title: Product & Technology
  summary: Candid Health is an API-first revenue-cycle platform that combines payer-aware claim preparation, submission, remittance interpretation, reporting, and increasing automation. The strongest public technical evidence is an external integration guide that specifies a concrete FHIR-to-Candid claim workflow; broader architecture and performance claims remain primarily investor- or company-reported and require production validation.
sections:
  - id: product-and-customer-workflow
    title: Product in the customer workflow
    body: >-
      Candid sits between a provider or digital-health company's clinical and
      operating systems and the payer payment cycle. The documented workflow
      starts with claim data, patient and provider records, coverage, encounters,
      diagnoses, service lines, and payer identity; Candid then creates and
      submits a professional claim and returns a claim response with Candid
      encounter and claim identifiers. The external Medplum integration guide
      makes this concrete rather than merely describing an API: a custom
      operation on a FHIR Claim submits the claim, and a successful response is
      stored back in Medplum. Earlier product coverage describes the broader
      scope as claim submission, claim follow-up, payment integrity, denial
      management, and appeals. This is a workflow infrastructure product, not
      simply a dashboard, but the public record does not establish how much of
      every workflow is fully autonomous for every specialty.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: operating-architecture
    title: Operating architecture and data feedback loop
    body: >-
      The public technical picture is a layered operating model. An API and
      integration surface receives structured clinical, provider, coverage, and
      payer data; a payer directory and rules layer resolves payer identity and
      validates claim requirements; a submission and remittance layer sends
      claims and interprets responses; and reporting exposes operational
      breakdowns back to the provider. An investor description says Candid has
      reverse-engineered requirements from more than a thousand U.S. payors and
      built a continuously enriched knowledge graph of provider rosters, fee
      schedules, charge rules, and adjudication behavior. A separate external
      integration guide shows the implementation burden that sits underneath
      this abstraction: required FHIR resources, payer identifiers, facility
      rules, service-line fields, idempotent submission behavior, retries, and
      debug documents. The architecture therefore appears differentiated by
      domain-specific data normalization and feedback, while remaining
      dependent on source-system data quality, payer rule changes, and correct
      integration mapping.
    claimRefs: [CE005, CE006, CE007, CE008]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-deployment-and-differentiation
    title: Maturity, deployment, and differentiation
    body: >-
      Evidence indicates a product with meaningful deployment maturity but
      incomplete public proof of scale. Elion's curated profile describes an
      end-to-end RCM platform, API integration, single-tenant SaaS deployment,
      U.S. data residency, SOC 2 Type 1, HIPAA, and a typical implementation
      length of one to three months; it also lists 21 verified customers in its
      profile dataset. Medplum's live guide documents a real integration path
      through FHIR resources and a custom operation, including idempotency and
      troubleshooting artifacts. Candid's investor describes 95–99% first-pass
      touchless claim resolution, under-20-days average time to payment, and
      approximately 40% less manual work in cost-to-collect, but these are
      customer KPI claims rather than independently audited benchmarks. The
      most credible differentiation is the combination of payer-specific rules,
      normalized billing data, and workflow feedback; the diligence gap is
      production validation by specialty, payer mix, and implementation cohort.
    claimRefs: [CE009, CE010, CE011, CE012]
  - id: controls-and-technical-risks
    title: Controls, dependencies, and technical risks
    body: >-
      The product's technical risk is concentrated in correctness and change
      management rather than in a merely novel interface. The integration guide
      requires exact payer resolution, provider and facility mappings, claim
      coding, diagnosis pointers, and service-line data; a missing payer match
      can hard-fail submission, while non-telehealth claims require a service
      facility. The same guide documents transient retries and idempotent
      responses, which are useful operational controls, but it does not prove
      end-to-end uptime, incident rates, security test results, or recovery
      objectives. Investor and customer-facing sources say the rules corpus
      learns from claim outcomes and that agentic workflows are being expanded,
      yet the public evidence does not disclose model-evaluation protocols,
      human escalation thresholds, change-approval controls, or specialty-level
      error rates. Buyers should therefore diligence integration test coverage,
      payer-rule update SLAs, PHI controls, audit logs, rollback procedures,
      and measured denial and payment outcomes before treating the automation
      claims as durable.
    claimRefs: [CE013, CE014, CE015]
callouts:
  - calloutType: insight
    title: The moat is the feedback loop, not the API alone
    body: >-
      Candid's defensibility would come from payer-specific data, normalized
      billing entities, and outcome feedback compounding into better rules. The
      public API is a credible integration surface, but an API without evidence
      of superior payer coverage, accuracy, and operational outcomes is not by
      itself a durable moat.
    claimRefs: [CE005, CE006, CE011]
  - calloutType: risk
    title: Automation claims need production-level validation
    body: >-
      Public KPI claims are promising but largely investor- or company-reported.
      The key diligence question is whether touchless resolution and payment
      speed persist across difficult specialties, changing payer rules, and
      customer implementations rather than only selected cohorts.
    claimRefs: [CE011, CE014, CE015]
tables:
  - id: TE001
    title: Product module / asset matrix
    columns: [Module or asset, Primary user, Status or maturity, Differentiation, Diligence gap]
    rows:
      - [Claim creation and submission, Provider billing or engineering team, "Documented live integration path", Payer-aware claim construction and routing, Production success rate by payer and specialty]
      - [Payer directory and rules engine, Billing operations, "Documented; breadth company/investor reported", Normalizes payer identifiers and payer-specific requirements, Rule update SLA and change-control evidence]
      - [Remittance and payment processing, Finance and billing operations, "Documented workflow; outcome quality not independently verified", Interprets adjudication details and feeds future rules, CARC/RARC accuracy and exception rate]
      - ["Reporting and claim operations workspace", Revenue-cycle leaders, "Profiled as available", "Granular operational visibility by payer, code, or provider", "Customer-level adoption and measured decision impact"]
      - ["Agentic automation for eligibility, coding, and appeals", Billing teams and provider staff, "Expansion described by investor and company", "Uses the rules/data foundation to automate labor-intensive work", "Human-in-the-loop policy and model evaluation"]
    notes: "Status combines external integration documentation, curated vendor profile evidence, and investor/company descriptions; public sources do not provide a standardized release or deployment rubric."
    claimRefs: [CE001, CE005, CE009, CE011, CE014]
  - id: TE002
    title: Workflow / use-case table
    columns: [User job, Current workflow, Company solution, Measurable benefit, Limitation]
    rows:
      - [Submit a professional claim, Assemble FHIR or equivalent claim data and identify the payer, "Custom operation creates and submits a Candid claim", "Successful response returns claim and encounter identifiers", Requires accurate source data and payer mapping]
      - [Resolve payer identity, Interpret insurance identifiers and payer relationships, "Payer directory resolves Candid payer UUID or supported identifiers", Reduces routing ambiguity, Hard-fails when no payer match is found]
      - [Understand payment outcome, Parse remittance and adjustment information, "Payment-processing and reporting workflows expose adjudication detail", Faster operational feedback is claimed, Public evidence lacks independent accuracy and latency measures]
      - [Fix recurring claim issues, Rework exceptions manually and repeat the same research, "Rules corpus feeds learnings back into future submission and resubmission", Fewer repeat errors and less manual work are claimed, Public controls for rule approval and rollback are not disclosed]
      - [Operate across systems, Reconcile exports or bespoke integrations, "API and documented FHIR integration connect clinical records to claim response", Supports engineering-led deployment, Implementation burden and one-to-three-month profile estimate need customer validation]
    notes: "Benefits are stated as documented workflow outputs or attributed company/investor claims; no independent controlled comparison was available in the assigned pool."
    claimRefs: [CE001, CE003, CE007, CE008, CE010]
  - id: TE003
    title: Technology / operating architecture table
    columns: [Layer or process, Role, Dependency, Risk]
    rows:
      - [Integration and data ingestion, "Receive patient, provider, coverage, encounter, diagnosis, and service-line data", Customer EHR or FHIR implementation, "Missing or malformed fields can block or distort claims"]
      - [Payer identity and directory, "Map payer names and identifiers to a Candid payer", Payer identifiers and directory coverage, "Unmatched payer can hard-fail submission"]
      - [Rules and knowledge layer, Validate claim requirements and encode payer behavior, Current payer rules and accumulated claim outcomes, Rules drift or opaque changes can cause denials]
      - ["Claim submission and response", "Create claim, submit it, and return response identifiers", "Clearinghouse and payer rails", "External rejection, latency, or payer outage"]
      - ["Remittance and feedback", "Interpret payment decisions and feed learnings back to rules", "Complete remittance data and accurate reason-code interpretation", "Bad feedback can compound future errors"]
      - ["Operations, reporting, and debugging", "Surface tasks, analytics, retries, and raw request/response records", Customer workflows and support processes, "Adoption, escalation, and auditability remain under-disclosed"]
    notes: "Architecture is a synthesis of the Medplum integration guide and external product descriptions; it is not a claim that every layer is implemented identically for every customer."
    claimRefs: [CE005, CE006, CE007, CE008, CE013]
figures:
  - id: FE001
    title: Candid Health product architecture map
    type: stack
    summary: The public evidence supports a payer-aware RCM stack linking customer data to claims, remittance, reporting, and automation.
    data:
      layers:
        - label: Customer and clinical systems
          modules: [Patient and provider records, Coverage and payer data, Encounters and diagnoses, Service lines and facility]
        - label: Integration surface
          modules: [FHIR Claim resources, Custom claim-submit operation, API identifiers, ClaimResponse write-back]
        - label: Payer and rules foundation
          modules: [Payer directory, Payer-specific claim requirements, Provider rosters and fee schedules, Charge and coding rules]
        - label: Transaction execution
          modules: [Claim creation, Claim submission, Payer adjudication, Remittance ingestion]
        - label: Operations and feedback
          modules: [Payment interpretation, Exception and task workflows, Reporting by payer/code/provider, Debug documents]
        - label: Automation layer
          modules: [Eligibility workflows, Coding and appeals agents, Resubmission rules, Outcome feedback into rules corpus]
    approximationNotes: "Layer order is an analytical synthesis of the assigned technical and product sources; it does not assert an undisclosed internal software topology."
    claimRefs: [CE001, CE005, CE006, CE007, CE008, CE014]
