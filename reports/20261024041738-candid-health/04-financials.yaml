chapter:
  number: 4
  title: Financials
  summary: Candid Health presents a transaction-linked revenue model around automated healthcare revenue-cycle management, with company-reported growth and retention but no public absolute revenue, margin, burn, cash, or runway. The strongest underwriting evidence is the combination of a $120 million announced Series D, a $104.9 million Form D amount reported by a secondary profile, and disclosed operating metrics whose definitions and independent verification remain incomplete.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: >-
      Candid sells software and operational automation into the healthcare revenue cycle rather than a conventional seat-based workflow product. The public description is an end-to-end process spanning eligibility, coding support, claim creation and submission, denial management, appeals, payment posting, and reporting. The clearest public pricing disclosure is a transaction-linked model: Out-Of-Pocket reported pricing starting at 3% of collections without medical coding and 3% plus $6 per claim when coding is included, with adjustments for state, complexity, and claim volume. That is a list-price indication, not realized revenue, gross margin, or customer-level take rate. The same source describes a hybrid customer motion in which some providers use Candid's software alongside an internal billing team, while others seek to outsource more of the workflow. This creates a plausible software-plus-services transition path, but the public record does not disclose the mix of subscription, percentage-of-collections, per-claim, or service revenue. Revenue quality therefore depends on validating contracts, realized rates, claim volumes, implementation fees, and whether automation changes the labor required to serve each account.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: traction-and-efficiency
    title: Traction and sales-efficiency proxies
    body: >-
      The available traction evidence is mostly company-reported or investor-reported. Sixth Street's investment announcement says annual contracted run-rate revenue grew 190% year over year in 2025 and net dollar retention was 180% year over year in 2025; its announcement also says Candid served more than 200 healthcare organizations. VentureBurn repeated those figures while describing enterprise adoption, and Healthcare Discovery records a different September 2026 company figure of 250 customer organizations. These are useful directional signals but not a reconciled customer cohort or audited revenue series. The investor says it spoke with nearly 40 customers, but that is diligence commentary from a lead investor, not a third-party operating audit. Public sources do not provide sales-cycle length, CAC, payback, quota attainment, churn, implementation cost, or customer concentration. A finance review should therefore treat retention and contracted run-rate growth as reported proxies, not as substitutes for recognized revenue, cash conversion, or contribution margin.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI003]
  - id: cost-and-capital
    title: Cost structure and capital adequacy
    body: >-
      Candid's cost structure is likely shaped by payer-rule maintenance, integrations, implementation, billing operations, and the compute and labor required to resolve exceptions, but the public sources do not quantify those components. Sixth Street describes a configurable rules engine, a unified model of provider, fee-schedule, charge-rule, and payer-adjudication data, and AI agents applied to eligibility, coding, and appeals workflows. Oak HC/FT similarly describes structuring provider rosters, charge rates, and fee schedules while building GenAI capabilities. Those descriptions support an operating model with potential automation leverage, but they do not establish gross margin or the pace at which manual work is being removed. Capital is also not equivalent to runway: the announced Series D was $120 million, while Healthcare Discovery says the SEC Form D reported $104,873,634 sold from 12 investors and notes a $15,126,366 difference from the announcement. The public record does not provide cash on hand, burn, debt, runway, use-of-funds detail, or a next-round trigger, so financing dependency remains a material underwriting gap.
    claimRefs: [CI009, CI010, CI011, CI012]
    tableRefs: [TI004]
  - id: underwriting-verdict
    title: Financial verdict and diligence blockers
    body: >-
      Candid has a credible revenue-quality thesis if transaction-linked pricing converts into recurring, high-retention provider revenue while the rules corpus and workflow automation reduce marginal service cost. The evidence is not yet sufficient to underwrite that margin path. Out-Of-Pocket's description of the product and pricing is sponsored and the author discloses being an investor; Sixth Street and Oak HC/FT are investors whose positive descriptions are not independent benchmarks. Conversely, Healthcare Discovery explicitly distinguishes public capital and security-attestation evidence from company-reported performance, stating that the methods behind touchless rates, collection rates, and claim volume are unpublished. The adverse financial conclusion is therefore not that the business lacks traction, but that absolute revenue, realized pricing, gross margin, cash burn, runway, debt obligations, customer concentration, and independently measured efficacy are unavailable. The next diligence step is a cohort-level bridge from contracted run-rate to recognized revenue and collections, paired with account-level gross margin and cash-flow schedules.
    claimRefs: [CI013, CI014, CI015, CI016]
