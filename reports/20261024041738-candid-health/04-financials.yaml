      - [Collections-linked pricing, "Percentage of collections", "Starts at 3% in a sponsored 2022 description", "List-price indication, not realized revenue or margin", "Signed rate cards, discounts, and realized take rate"]
      - [Coding-inclusive pricing, "Percentage of collections plus per-claim fee", "3% plus $6 per claim in the same description", "Terms vary by state, complexity, and volume", "Customer-level volume and fee schedules"]
      - [Subscription or platform fee, "Potential fixed software component", "Not publicly disclosed", "Cannot infer from transaction pricing", "Contract inventory and recurring-revenue definition"]
    notes: "Sources are public descriptions with mixed issuer relationships; null or undisclosed values mean the public pool did not provide a quantified revenue split."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI003
    title: Public traction and efficiency proxies
    columns: [Metric, Reported value, Period, Attribution, Limitation]
    rows:
      - [Annual contracted run-rate revenue growth, 190, "% year over year", "Candid announcement and Sixth Street", "Not absolute ARR or recognized revenue"]
      - [Net dollar retention, 180, "% year over year", "Candid announcement and Sixth Street", "Cohort definition and denominator undisclosed"]
      - [Healthcare organizations, "More than 200", "2026 announcement", "Candid announcement", "Company-stated and not concentration-adjusted"]
      - [Customer organizations, 250, "September 2026", "Denver Post figure reproduced by Healthcare Discovery", "Differs from the contemporaneous >200 figure"]
      - [Customer diligence conversations, "Nearly 40", "Series D diligence", "Sixth Street", "Investor testimony, not independent sampling"]
      - [Sales cycle, null, "Not disclosed", "Evidence gap", "CAC and payback cannot be calculated"]
    notes: "Reported metrics use their stated periods and denominators; they are not treated as audited financial statements or as equivalent measures."
    claimRefs: [CI005, CI006, CI007, CI008]
  - id: TI004
    title: Capital adequacy and cost disclosure
    columns: [Input, Public value or status, Period, Evidence quality, Diligence ask]
    rows:
      - [Series D announced financing, 120, "USD million; July 2026", "Investor/company announcement", "Reconcile announcement to securities filing"]
      - [Form D amount sold, 104.873634, "USD million; July 22, 2026", "Secondary profile reporting SEC filing", "Obtain filing and any amendment directly"]
      - [Difference between announced and filed amount, 15.126366, "USD million", "Calculated from reported values", "Clarify committed versus sold capital"]
      - [Cash on hand, null, "Not disclosed", "Evidence gap", "Latest balance sheet and cash restrictions"]
      - [Burn and runway, null, "Not disclosed", "Evidence gap", "Monthly cash bridge and base/downside runway"]
      - [Debt and project-finance obligations, null, "Not disclosed", "Evidence gap", "Debt schedule, covenants, and repayment profile"]
    notes: "Funding raised is not cash available and the disclosed round amount is not a runway estimate; all unavailable fields remain null."
    claimRefs: [CI009, CI010, CI011, CI012]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Candid's described operating model links provider activity and payer rules to transaction-linked revenue, but public evidence does not quantify conversion at each step.
    data:
      nodes:
        - id: provider-activity
          label: Provider services and billing data
          detail: Customer clinical, provider, roster, and charge information enters the workflow.
        - id: rules-and-integrations
          label: Rules engine and integrations
          detail: Public descriptions cite payer rules, data models, and integrations that prepare claims.
        - id: claims-workflow
          label: Claims, denials, appeals, and posting
          detail: The platform is described as covering submission through payment and exception workflows.
        - id: collections
          label: Payer collections
          detail: Pricing is described as a percentage of collections, with a coding-related per-claim fee.
        - id: candid-revenue
          label: Candid revenue
          detail: Realized revenue mix, recognition, and gross margin are not publicly disclosed.
        - id: cash-conversion
          label: Cash conversion
          detail: Cash collections, burn, runway, and debt obligations are not publicly disclosed.
      edges:
        - from: provider-activity
          to: rules-and-integrations
        - from: rules-and-integrations
          to: claims-workflow
        - from: claims-workflow
          to: collections
        - from: collections
          to: candid-revenue
        - from: candid-revenue
          to: cash-conversion
    approximationNotes: "The sequence is an evidence-backed operating model, not a quantified revenue forecast or conversion funnel."
    claimRefs: [CI001, CI002, CI009]
callouts:
  - calloutType: strength
    title: Reported growth and retention are strong directional signals
    body: Candid reported 190% year-over-year annual contracted run-rate revenue growth and 180% year-over-year net dollar retention for 2025, but the public record does not disclose absolute revenue or cohort definitions.
    claimRefs: [CI005, CI006]
  - calloutType: risk
    title: Capital raised does not establish runway
    body: The $120 million announced Series D and the separately reported $104.9 million Form D amount do not reveal cash on hand, burn, debt, or financing dependency.
    claimRefs: [CI009, CI010, CI011, CI012]
  - calloutType: recommendation
    title: Underwrite from contracts and cash schedules
    body: Request a customer-level revenue bridge, realized pricing, gross-margin schedule, cash forecast, debt schedule, and KPI definitions before relying on headline growth or automation claims.
    claimRefs: [CI013, CI014, CI015, CI016]
