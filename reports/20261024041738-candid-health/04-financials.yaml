  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: capital-adequacy
      missingEvidence: Cash on hand, monthly burn, runway, debt obligations, and use-of-funds detail after the Series D.
      whyItMatters: Funding announced or sold is not the same as unrestricted cash available to fund operations and does not establish financing dependency.
      diligencePath: Request the latest balance sheet, cash-flow statement, debt schedule, restricted-cash schedule, and board-approved runway case.
      relatedQuestionRefs: [QI007, QI010]
    - type: private-evidence-only
      severity: material
      topic: revenue-quality
      missingEvidence: Contract-level revenue bridge showing list price, discounts, realized take rate, recognized revenue, collections, and revenue by stream.
      whyItMatters: Transaction-linked list pricing and contracted run-rate growth cannot by themselves establish recurring revenue quality or cash conversion.
      diligencePath: Sample contracts and customer cohorts, then reconcile bookings, contracted run-rate revenue, GAAP revenue, collections, and deferred revenue.
      relatedQuestionRefs: [QI001, QI002, QI009, QI010]
      relatedTableRefs: [TI001]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Customer-level gross margin, implementation cost, support and billing labor, CAC, sales cycle, payback, churn, and expansion cohorts.
      whyItMatters: The public operating model may combine software and service delivery, so growth and retention do not prove scalable contribution margins.
