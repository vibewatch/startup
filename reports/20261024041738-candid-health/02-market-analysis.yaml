company:
  name: Candid Health
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Candid operates in the U.S. healthcare revenue-cycle-management market, where
    provider payment depends on payer-specific rules, fragmented data, and labor-intensive
    exception handling. Available sources support a large, structurally necessary market
    and clear automation drivers, but do not isolate a defensible Candid SAM or SOM.
sections:
  - id: market-boundary
    title: Market boundary and status quo
    body: >-
      The relevant market is provider-side revenue cycle management: eligibility and
      registration inputs, coding and claim creation, clearinghouse submission, payer
      adjudication and remittance, denial and accounts-receivable work, patient balance
      collection, and the reporting needed to manage those workflows. It includes
      software, automation, and associated managed services sold to provider organizations,
      medical groups, MSOs, digital-health providers, and EHR partners. It excludes
      clinical recordkeeping, payer administration, and the patient's underlying medical
      expense. The status quo is not one product: providers can retain legacy RCM suites,
      outsource billing, operate internal teams, or build integrations and rules
      themselves. That fragmented substitute set explains both the budget opportunity and
      the implementation burden.
    claimRefs: [CM001, CM002, CM003]
    tableRefs: [TM001]
  - id: sizing-and-economics
    title: Sizing lenses and market economics
    body: >-
      Two different sizing lenses are visible in the assigned evidence. Investor and
      company-linked materials describe a roughly $280 billion annual RCM industry, a
      top-down measure of the broad economic activity around provider billing. A second
      lens is the operational loss pool: Sixth Street cites increasing denials, more than
      half of denied claims not being reworked, and approximately 4% to 5% of net revenue
      forfeited; Adonis reports that nearly two-thirds of surveyed leaders saw denials and
      underpayments as their largest revenue-growth barrier. These figures describe
      exposure and urgency, not Candid revenue or an immediately serviceable market.
      No source in the pool provides a Candid-specific U.S. SAM, reachable specialty
      subset, pricing-derived revenue pool, or evidence-based SOM, so those remain
      diligence gaps rather than inferred percentages of TAM.
    claimRefs: [CM004, CM005, CM006, CM007]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyer segmentation and adoption path
    body: >-
      The economic buyer is usually the provider organization or MSO responsible for
      collections, labor, and financial performance; revenue-cycle, finance, and
      operations teams are the principal users, while an EHR or practice-management
      platform can be the distribution partner. Digital-health providers are the
      lowest-friction beachhead in the evidence because they may be buying billing
      infrastructure for the first time and can integrate through an API. Multi-specialty
      groups and telehealth providers are documented target segments, while larger
      traditional providers face more extensive replacement and integration work.
      Adoption therefore follows a workflow trigger—denial pressure, labor cost,
      payment visibility, or growth—rather than a generic AI budget. A three-to-six-month
      go-live claim is faster than the incumbent timelines described by management, but
      it is still a material systems-change project.
    claimRefs: [CM008, CM009, CM010, CM011]
    tableRefs: [TM003]
  - id: drivers-and-constraints
    title: Drivers, constraints, and valuation relevance
    body: >-
      The strongest adoption drivers are mandatory payment workflows, rising payer
      complexity, denial and underpayment pressure, expensive administrative labor, and
      the possibility that adjudication data improves future submissions. The main
      constraints are integration and switching cost, changing payer rules, specialty
      edge cases, compliance exposure from incorrect automation, and incumbent or
      adjacent competition. Independent market evidence shows a broad field of vendors
      across full-suite RCM, denial prevention, eligibility, clearinghouse, payment
      posting, analytics, and managed services; it does not show that Candid wins each
      category. For valuation, these drivers support a large and mission-critical
      opportunity, while the unresolved SAM, retention by segment, independent outcome
      verification, and sustainable gross-margin path limit how much of the top-down
      market can be underwritten.
    claimRefs: [CM012, CM013, CM014, CM015]
