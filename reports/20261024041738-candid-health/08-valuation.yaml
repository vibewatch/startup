    title: Recommendation logic
    type: flow
    summary: "Current evidence supports a research-more decision because growth and market signals are offset by an undisclosed price and private-company operating inputs."
    data:
      nodes:
        - id: scale
          label: "Large RCM market"
          detail: "$280B industry described by Sixth Street"
        - id: growth
          label: "Growth signal"
          detail: "190% 2025 annual contracted run-rate revenue growth reported by Sixth Street"
        - id: financing
          label: "Financing validation"
          detail: "$120M Series D; reported 3x valuation increase"
        - id: benchmark
          label: "Market anchor"
          detail: "4.7x Health IT and 6.0x RCM benchmark context from HGP"
        - id: opacity
          label: "Underwriting gap"
          detail: "Absolute valuation, revenue base, margins, and preferences undisclosed"
        - id: decision
          label: "Decision"
          detail: "Research more; valuation stance unknown"
      edges:
        - [scale, growth]
        - [growth, financing]
        - [financing, benchmark]
        - [benchmark, opacity]
        - [opacity, decision]
    claimRefs: [CV002, CV003, CV006, CV008, CV010, CV016]
    approximationNotes: "The flow is an authored decision sequence, not a quantitative valuation model; it does not infer conversion rates or probabilities."

callouts:
  - calloutType: recommendation
    title: Research more before underwriting
    body: >-
      The latest financing and growth disclosures are encouraging, but the retained public evidence
      does not establish an absolute valuation, ARR base, gross margin, cash runway, or preference
      structure. A price-sensitive recommendation should wait for those inputs.
    claimRefs: [CV001, CV003, CV006, CV016]
  - calloutType: risk
    title: Relative valuation is not a price
    body: >-
      A threefold increase over the Series C valuation indicates investor demand but cannot be
      translated into return potential without the underlying post-money valuation and ownership
      terms.
    claimRefs: [CV006, CV007, CV011]

