slug: candid-health
runDate: 2026-10-24
company:
  name: Candid Health
chapter:
  number: 8
  title: Valuation
  summary: Candid's July 2026 Series D provides a strong growth and financing signal, but the round's absolute post-money valuation, revenue base, margins, and preference terms remain undisclosed. The evidence supports a research-more recommendation rather than a price-insensitive buy.
sections:
  - id: investment-case
    title: Investment case and anti-thesis
    body: >-
      The investment case is a mission-critical RCM platform addressing a large, structurally
      inefficient market with evidence of rapid expansion. Candid announced a $120 million Series D
      on July 22, 2026, led by Sixth Street Growth, and the announcement states that the financing
      increased valuation threefold versus the February 2025 Series C. Sixth Street's investment
      rationale cites a $280 billion RCM industry, customer-reported operating outcomes, and a
      190% year-over-year increase in annual contracted run-rate revenue in 2025. Independent
      product reviews describe an API-first platform with custom, unpublished pricing and limited
      independent outcome data. That combination creates a credible quality-and-growth thesis but
      not enough public information to determine whether the latest price is attractive.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV002]
    figureRefs: [FV001]
  - id: financing-and-comparables
    title: Financing context and comparable evidence
    body: >-
      Financing evidence is current but incomplete. The July 2026 Series D amount and lead investor
      are disclosed, and multiple sources report total capital above $219 million after the round,
      yet none of the retained sources gives an absolute post-money valuation, share price,
      liquidation preference, option-pool treatment, debt balance, or cash balance. The reported
      threefold valuation increase is therefore a relative mark, not a usable entry valuation.
      Healthcare Growth Partners reports a 4.7x Health IT revenue multiple at June 30, 2026 and a
      6.0x median multiple for RCM technology, while noting that multiples recovered from a 3.7x
      April low. These are sector benchmarks, not a Candid valuation: Candid's revenue, margin,
      retention denominator, and accounting definitions are not publicly disclosed. A disciplined
      investor should use the benchmarks only after obtaining company financials and reconciling
      recurring revenue with the reported run-rate metric.
    claimRefs: [CV006, CV007, CV008, CV009, CV010]
    tableRefs: [TV003]
  - id: decision-and-diligence
    title: Decision, scenarios, and diligence
    body: >-
      The appropriate decision is research more, with a high risk rating and an unknown valuation
      stance. The business may justify a premium if growth converts into durable, high-margin
      recurring revenue and the rules-and-data infrastructure produces measurable customer
      retention and collection benefits. Conversely, a threefold valuation step-up can leave little
      room for execution misses, multiple compression, customer concentration, or a larger
      services component than the software narrative implies. The retained evidence also shows
      unresolved commercial constraints: PracticeAll says Candid does not publish pricing, requires
      technical setup, and has limited independent review data; Out-Of-Pocket identifies competition
      and the question of whether digital health is a sufficiently large market. Before underwriting
      an entry price, diligence should obtain cohort-level ARR and retention, gross margin by
      software and services, customer concentration, cap-table terms, cash runway, and an
      independently verified customer reference set.
    claimRefs: [CV011, CV012, CV013, CV014, CV015, CV016]
    tableRefs: [TV004]

tables:
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Evidence, What would change the view]
    rows:
      - [Large and urgent market, "Sixth Street describes a $280B RCM industry and rising denial complexity", "Independent market sizing and customer ROI by segment"]
      - [Strong growth signal, "Sixth Street reports 190% 2025 annual contracted run-rate revenue growth", "Cohort ARR bridge, revenue recognition, and retention denominators"]
      - [Infrastructure differentiation, "Investors describe a rules engine, knowledge graph, and agentic automation", "Independent technical diligence and production reliability evidence"]
      - [Price and opacity risk, "Series D tripled the 2025 valuation; absolute valuation and pricing are undisclosed", "Post-money valuation, cap table, preferences, margins, and cash runway"]
    notes: "Arguments retain issuer attribution; investor claims are not treated as independent validation, and the missing fields are explicit diligence conditions."
    claimRefs: [CV002, CV003, CV004, CV006, CV007, CV011, CV012]
  - id: TV003
    title: Financing and market benchmark context
    columns: [Metric, Reported value, Period or basis, Qualification]
    rows:
      - [Series D financing, "$120M", "July 22, 2026", "Company announcement and investor announcement; financing amount is not valuation"]
      - [Valuation change, "3x", "Compared with February 2025 Series C", "Relative increase only; absolute post-money valuation is undisclosed"]
      - [Total capital raised, "More than $219M", "After July 2026 Series D", "Reported by company/investor coverage; not cash available"]
      - [Health IT revenue multiple, "4.7x", "June 30, 2026", "HGP six-month moving average; sector benchmark, not Candid-specific"]
      - [RCM technology median revenue multiple, "6.0x", "HGP July 2026 market review", "Comparable-sector median; no Candid revenue base disclosed"]
    notes: "Values mix company financing disclosures and HGP market benchmarks; they are not directly comparable and do not establish Candid's enterprise value."
    claimRefs: [CV001, CV006, CV007, CV008, CV009, CV010]
  - id: TV004
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation or return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Verified recurring revenue, strong gross margin, durable retention, and customer ROI", "Premium to RCM benchmark may be supportable after a disclosed revenue base", "Conditional; requires new evidence", "Growth decelerates or customer economics fail independent checks"]
      - [Base, "Series D demand is real, but price, margins, and cash economics remain private", "Research-more; defer entry until price and unit economics are reconciled", "Most defensible on current public evidence", "Company declines to disclose core underwriting inputs"]
      - [Bear, "Valuation step-up exceeds sustainable revenue quality or sector multiples compress", "Avoid or wait for repricing / a later financing with transparent terms", "Material tail risk", "Down-round, multiple compression, concentration, or service-heavy margins"]
    notes: "Scenario logic is qualitative because Candid's absolute valuation and revenue base are unavailable; no probability percentages or invented valuation ranges are asserted."
    claimRefs: [CV006, CV008, CV010, CV011, CV012, CV013, CV016]
figures:
