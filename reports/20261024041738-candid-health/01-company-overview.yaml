company:
  name: Candid Health
chapter:
  number: 1
  title: Company Overview
  summary: Candid Health is a privately held healthcare technology company founded in 2019 that sells an AI-powered revenue-cycle-management platform for provider organizations. The July 2026 Series D materially increased disclosed funding and investor sponsorship, while absolute revenue, valuation, headcount, profitability, and customer concentration remain undisclosed or inconsistently reported.
sections:
  - id: identity-and-business
    title: Identity, product, and operating model
    body: >-
      The available evidence identifies Candid Health as a San Francisco-based,
      privately held healthcare technology company founded in 2019. Its product
      is an API-first revenue cycle management platform that connects provider,
      clinical, billing, and payer data, then uses deterministic rules, machine
      learning, and AI agents to automate claim creation, submission, payment
      processing, denial management, appeals, and reporting. The product is
      positioned as infrastructure for healthcare providers rather than a
      patient-facing application. An investor-sponsored description says the
      target customer is primarily digital-health companies that bill insurance,
      while current financing coverage describes a broader base of more than
      200 healthcare organizations. The evidence supports a usage-linked
      healthcare workflow business, but not a verified subscription-only model.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Founders, leadership, and key-person exposure
    body: >-
      Nick Perry and Doug Proctor are consistently identified as co-founders and
      former Palantir operators, with sources describing Perry's commercial
      healthcare leadership and Proctor's work on large product and government
      teams. One historical sponsored account also names Adam Reis as a founder,
      creating a governance record that should be reconciled against the current
      cap table and company biography. The evidence is strongest for Perry and
      Proctor's technical and healthcare operating background, and weaker for a
      complete current executive roster, board composition, succession planning,
      or separation of founder responsibilities. The concentration of product
      and domain knowledge in the founding team is therefore a material diligence
      consideration, even though no leadership departure is evidenced in the
      assigned sources.
    claimRefs: [CO005, CO006, CO007]
    tableRefs: [TO002]
  - id: financing-and-scale
    title: Financing, scale, and disclosure quality
    body: >-
      Candid announced a $120 million Series D led by Sixth Street Growth in July
      2026, with Oak HC/FT, 8VC, and Y Combinator participating. Current coverage
      says the round tripled the company's Series C valuation and brought total
      capital raised above $219 million; a funding database rounds the total to
      $220 million. The company and investors describe more than 200 healthcare
      organizations, approximately $7 billion of annual claim volume, 190%
      year-over-year annual contracted run-rate revenue growth in 2025, and 180%
      year-over-year net dollar retention, but these are company-reported or
      investor-reported operating metrics rather than audited financials. No
      source in the assigned pool discloses post-money valuation, absolute
      revenue or ARR, gross margin, cash balance, burn, runway, or headcount.
    claimRefs: [CO008, CO009, CO010, CO011, CO012, CO016]
    tableRefs: [TO003]
  - id: milestones-and-open-questions
    title: Milestones and unresolved diligence
    body: >-
      The milestone record shows a progression from a 2020 seed round through
      Series A, Series B, Series C, and the July 2026 Series D, alongside a
      product evolution from API-first billing infrastructure toward autonomous
      revenue-cycle workflows and agentic automation. Sources also describe
      customer examples including Talkiatry and Nourish, but the strongest
      outcome metrics are reported by the company, its investors, or syndicated
      coverage and should not be treated as independent validation. The assigned
      search pool contains no adverse legal or regulatory finding specific to
      Candid, which is not proof that none exists. The remaining diligence
      priorities are an authoritative leadership and board record, verified
      customer references, unit economics, the exact Series D valuation, and
      independent testing of automation and collection outcomes.
    claimRefs: [CO013, CO014, CO015]
    figureRefs: [FO001]
