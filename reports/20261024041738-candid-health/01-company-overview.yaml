callouts:
  - calloutType: strength
    title: Capital and workflow embedding
    body: Candid has secured a large latest financing round and is described by investors as embedded in mission-critical provider workflows, but the public record does not independently audit the reported outcomes.
    claimRefs: [CO008, CO010, CO011]
  - calloutType: risk
    title: Private-company disclosure gap
    body: The strongest open risks are not a documented adverse incident but missing primary evidence for valuation, absolute revenue, profitability, headcount, ownership, customer concentration, and current governance.
    claimRefs: [CO012, CO015]
