  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What the product is in workflow terms
        blocks:
          - type: paragraph
            body: >-
              Biosplice is not selling a toolkit or platform subscription to end users. Its lead public product is
              lorecivivint, a clinician-administered intra-articular injection for knee osteoarthritis. In workflow
              terms, that means the therapy sits inside specialty orthopedic or rheumatology care and is evaluated
              through pain, function, and structure outcomes rather than consumer activation metrics. The product
              architecture is therefore relatively simple at the point of use: identify the right patient, administer a
              single injection, and follow clinical outcomes over time. The complexity sits upstream in molecular
              design, trial execution, regulatory review, and launch readiness. That distinction is important because it
              changes what maturity means. A biotech product can be highly mature scientifically while still being
              commercially opaque on manufacturing, quality, or support operations. Public sources let this chapter
              describe the drug, the administration model, and the key evidence loops with confidence.
