            body: >-
              From a financial diligence perspective, Biosplice looks like a company whose value is still driven by
              probability-weighted future economics rather than present operating quality. The positive side of the case
              is clear: multi-year clinical investment, real ex-US partner economics, and a product that has at least
              reached NDA review. The limiting factor is equally clear: public sources do not reveal current cash, burn,
              realized partner receipts, launch pricing, or the mechanics of the capital stack. That means the right
