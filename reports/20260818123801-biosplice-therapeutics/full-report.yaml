    title: Customers
    sections:
      - number: '6.1'
        title: Today's practical customers are partners and clinical stakeholders, not commercial users
        blocks:
          - type: paragraph
            body: >-
              The biggest challenge in this chapter is definitional. Biosplice does not yet have the kind of public
              commercial customer base that a software or medical-device company might display. Lorecivivint remained
              unapproved at the research date, so there is no verified public evidence of production revenue accounts,
              active commercial treated-patient counts, or payer contracts. The best current proxy for customers is a
              broader stakeholder set: regional commercialization partners such as Haisco and Samil, clinical
              investigators and sites that operationalize the studies, and patients whose outcomes create the evidence
              package. That means the customer chapter is less about installed revenue accounts and more about who is
              already willing to commit resources, rights, and operating time to the program. This distinction matters
              because it keeps the analysis honest: Biosplice has real external counterparties and user engagement, but
              it does not yet have a broad, measurable launched customer base.
