      - number: '5.3'
        title: Mechanism, evidence design, and what the clinical stack actually does
        blocks:
          - type: paragraph
            body: >-
              The public mechanism narrative for lorecivivint begins with Wnt-pathway modulation and links that biology
              to CLK2/DYRK1A inhibition and alternative pre-mRNA splicing. That is the technical core of the company's
              differentiation claim. The evidence stack built around it is equally important: repeated randomized
              blinded trials, dose-finding work, and outcome frameworks that combine patient-reported pain/function with
              structural imaging concepts such as medial joint space width. Public materials show why the program has
              remained interesting for so long. The product looks strongest when structure and symptoms appear
              directionally aligned and weakest when all-comer pain endpoints miss despite other signs of activity. That
              is not just a clinical nuance; it is part of the product design problem because the therapy's real-world
              value proposition depends on how regulators and payers interpret those endpoints. In that sense, the
              evidence package is part of the product architecture.
