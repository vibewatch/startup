  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risks dominate the current stack
        blocks:
          - type: paragraph
            body: >-
              The dominant risks around Biosplice are still regulatory and evidence-related. Lorecivivint has reached
              NDA review, which is a major achievement, but that stage also concentrates attention on every remaining
              weakness in the clinical package. Mixed phase 3 outcomes, a documented OA-21 primary-endpoint miss, and an
              external meta-analysis that is more cautious than company-authored messaging all reinforce that approval
              is not a formality. On the legal side, public patent assignment records show that Biosplice has meaningful
              IP assets, but they do not answer enforceability, expiry, or freedom-to-operate questions. More unusually,
              the apparent absence of working public terms and privacy pages creates a minor but noteworthy governance
              gap. None of these legal items outrank the approval question, but they belong in the diligence stack
              because they speak to readiness and external transparency for investors and counterparties. They also help
              frame where legal diligence should stop relying on surface-level web evidence and move into counsel-led
              document review.
