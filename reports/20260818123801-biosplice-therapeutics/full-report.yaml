  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Approval or label disappointment
        - Meaningful delay or label narrower than commercial plan requires
        - Undercuts core value driver and extends financing risk
        - Pause investment or demand repriced terms
      - - Cash or runway weakness
        - Runway insufficient to absorb launch or regulatory slippage
        - Forces valuation discussion into dilution protection rather than upside
        - Require bridge plan or walk
      - - Preference overhang
        - Stacked preferences, aggressive pay-to-play, or large option-pool reset
        - Can erase headline upside for new investors
        - Reprice or decline
      - - Weak reimbursement plan
        - No credible coding, access, or HEOR strategy
        - Turns approved drug into slow or low-value launch
        - Delay commitment until access proof exists
      - - Partner underperformance
        - Regional partners fail to execute or economics prove less valuable than advertised
        - Shrinks optionality and removes external validation
        - Lower scenario weights and valuation range
    notes: Kill criteria are intentionally monitorable and tied to underwriteable events.
    claimRefs:
      - CV016
      - CV022
      - CV023
      - CV024
      - CV033
      - CV035
      - CV039
      - CV040
      - CV043
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Current valuation and terms
        - Signed term sheet, current post-money, liquidation preferences, option-pool plan
        - Turns tracker narratives into real entry math
        - Lead investor counsel + CFO diligence
      - - Liquidity and runway
        - Current cash, burn, runway bridge, and downside scenario model
        - Determines whether delays create forced financing
        - Board package and CFO review
      - - Commercial assumptions
        - Launch price corridor, reimbursement plan, and access milestones
        - Needed to translate approval into revenue value
        - Commercial lead + market-access review
      - - Launch readiness
        - CMC, supply chain, medical affairs, and pharmacovigilance package
        - Operational readiness can destroy equity value even after approval
        - Quality/regulatory diligence
      - - Partner value realization
        - Haisco and Samil milestone status, receipts, amendments, and governance
        - Shows whether disclosed deal values are real economic support
        - BD/legal diligence
    notes: The shortest path to a better recommendation is better private evidence, not more public tracker screenshots.
    claimRefs:
      - CV014
      - CV015
      - CV022
      - CV023
      - CV024
      - CV032
      - CV040
      - CV043
