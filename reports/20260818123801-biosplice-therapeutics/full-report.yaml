      - number: '3.5'
        title: Moat durability depends on label strength and payer acceptance, not just novelty
        blocks:
          - type: paragraph
            body: >-
              If lorecivivint reaches the market, its moat will come from being first into a potentially new
              disease-modifying OA category, not from already owning distribution. That can be powerful if the label
              supports a differentiated structure-plus-symptom story. It can evaporate quickly if the label is narrow,
              uptake is slow, or incumbents adapt with contracting and convenience-focused response. Public data do not
              yet let this chapter prove strong IP durability, true physician switching shares, or precise price
              competition. The right conclusion is therefore conditional: Biosplice may have a meaningful thesis moat,
              but incumbents currently look stronger on trust, reimbursement familiarity, and commercial durability. The
              most important next diligence asks are full label economics, physician willingness to switch, and how
              access strategy will offset entrenched workflow behavior.
            claimRefs:
              - CP026
