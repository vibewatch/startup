  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive landscape: incumbents and substitutes matter more than direct DMOAD peers'
        blocks:
          - type: paragraph
            body: >-
              Biosplice is trying to enter a market that already solves the knee-osteoarthritis job in several different
              ways, but not with an approved disease-modifying product. The relevant competitor set therefore has to be
              broader than biotech peers alone. It includes corticosteroid injections such as Zilretta, multiple
              hyaluronic-acid viscosupplements, conservative care, and the eventual surgical path to arthroplasty. That
              framing matters because buyers do not need another experimental platform; they need a reason to switch
              away from familiar pain-relief tools or to use a new therapy earlier in the pathway before surgery. Public
              evidence also suggests the direct approved-peer field for a DMOAD-style OA claim is still thin, which can
              help Biosplice if approval lands. But in practice the company will still be judged against the therapies
              clinicians already know how to inject and payers already know how to cover.
            claimRefs:
