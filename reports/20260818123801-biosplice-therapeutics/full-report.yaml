      - number: '2.2'
        title: Prevalence-led sizing is more defensible than broad dollar TAM
        blocks:
          - type: paragraph
            body: >-
              Public evidence is much better at sizing the osteoarthritis problem in people than in dollars. Biosplice's
              own OA page cites roughly 51.9 million U.S. adults and 527.8 million adults globally with osteoarthritis,
              while the 2026 NDA release rounds those figures to roughly 50 million and 500 million-plus. Both sources
              place U.S. knee osteoarthritis around 25 million adults. The company also argues, using its own trial
              interpretation, that earlier-stage KL2 and early KL3 patients represent about 70% of the knee-OA
              population it cares most about. That does not create a realized commercial SAM by itself, but it does
              offer a more evidence-backed sizing logic than plugging one analyst dollar-TAM into a valuation model. For
              this report, the safest approach is to treat prevalence, subgroup eligibility, and clinical workflow fit
              as the primary lenses, while preserving a hard gap on price-based SAM and SOM.
