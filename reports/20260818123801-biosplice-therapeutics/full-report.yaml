      - number: '8.3'
        title: Scenarios and comparables should bound valuation, not pretend to solve it
        blocks:
          - type: paragraph
            body: >-
              The comp set helps bound the discussion, but it does not produce a neat spreadsheet answer. Caplight,
              VentureRadar, and Tracxn place Biosplice alongside regenerative, RNA, and specialty-biotech peers rather
              than one clean public-comparable basket. That is directionally useful because it shows how investors and
              databases classify the company. It is not enough to justify a direct multiple. The more relevant
              underwriting references are historical financing marks, the Haisco and Samil deal values, the late-stage
              NDA milestone, and the gap between platform optionality and current commercial opacity. Bull case requires
              approval, workable reimbursement, and current financing terms that do not trap new capital behind an old
              private mark. Base case assumes the science and partnering story remain credible, but price must reset to
              what current disclosure can support. Bear case assumes approval timing slips, payer access is weaker than
              hoped, or financing must be raised under pressure. Those outcomes produce a very wide valuation envelope
              by design.
