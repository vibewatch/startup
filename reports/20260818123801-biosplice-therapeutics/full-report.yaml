  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model is still mostly prospective
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not show an operating business with recognized product revenue today. Lorecivivint
              remained unapproved at the research date, which means the most defensible financial framing is still
              prospective rather than realized. The visible monetization paths are future U.S. product sales if approval
              lands, ex-US licensing economics with partners such as Haisco and Samil, and downstream milestone or
              royalty flows that may emerge only if those partnerships progress. That is very different from a business
              with current recurring revenue or disclosed commercial units. The chapter therefore treats Biosplice as a
              late-stage biotech whose economic model is approval-contingent. Financial strength, if any, comes from
              deal optionality and investor willingness to keep funding development rather than from demonstrated
              commercial cash generation.
            claimRefs:
