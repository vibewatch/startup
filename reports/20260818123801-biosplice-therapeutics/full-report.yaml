      - number: '3.4'
        title: Portfolio breadth adds optionality, but it can also dilute focus
        blocks:
          - type: paragraph
            body: >-
              The company is not purely a knee-OA commercial story. ClinicalTrials.gov and NCI materials show Biosplice
              continuing to advance oncology programs such as SM04755 and cirtuvivint. That can be interpreted
              positively as evidence the alternative-splicing platform has applications beyond one asset. It can also be
              interpreted negatively when capital is scarce, because management focus and cash may need to support
              multiple programs at once. The terminated SM08502 combination study is a useful reminder that portfolio
              decisions can change for business reasons, not only scientific ones. For competitor analysis, the main
              implication is that Biosplice may have more strategic options than a one-asset biotech, but it also faces
              an internal allocation challenge that mature incumbent injection brands do not. That is not a direct
              product competitor, but it is a real competitive-readiness variable.
