    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, stage, and strategic positioning
        blocks:
          - type: paragraph
            body: >-
              Biosplice Therapeutics is best described as a private clinical-stage biotech rather than a commercial
              pharmaceutical company. Public materials consistently anchor the company in San Diego, position it around
              small-molecule control of CLK/DYRK kinases and alternative RNA splicing, and frame lorecivivint as the
              program that carries the present enterprise value narrative. Dealroom places the founding in 2008, while
              current company materials emphasize the present-day Biosplice brand and its goal of producing
              disease-modifying therapies rather than incremental symptomatic drugs. That framing matters for diligence
              because the company is not selling approved medicines today: its operating identity still depends on
              pipeline credibility, regulatory execution, and access to follow-on capital rather than recurring product
              revenue. The public record also shows that Biosplice still uses a platform story to explain pipeline
              breadth across osteoarthritis, oncology, neurology, and other degenerative conditions, but the visible
              external proof is concentrated overwhelmingly in knee osteoarthritis. That concentration should shape how
              later chapters weigh optionality outside lorecivivint.
