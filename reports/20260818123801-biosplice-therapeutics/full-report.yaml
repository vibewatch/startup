      - number: '2.4'
        title: Growth drivers and the adoption constraints that matter most
        blocks:
          - type: paragraph
            body: >-
              The demand-side drivers are straightforward: osteoarthritis prevalence is large and rising, the condition
              produces substantial pain and functional loss, and the market still lacks an approved disease-modifying
              drug. Those factors create real strategic room for a therapy that can plausibly show more than temporary
              analgesia. The harder part is conversion from unmet need to reimbursed adoption. Biosplice's own public
              releases show why. The company can point to long-term structural and symptom data from OA-07, but it also
              acknowledged missed primary pain endpoints in earlier phase 3 studies and again in OA-21 at 12 weeks.
              Those misses matter not only for regulation but also for the commercial story, because payers and
              clinicians need a crisp proof package if a new injection is to displace conservative care and familiar
              incumbents like corticosteroids or viscosupplements. The market is therefore attractive, but it is also
              unusually sensitive to endpoint design, subgroup selection, reimbursement proof, and label scope.
            claimRefs:
