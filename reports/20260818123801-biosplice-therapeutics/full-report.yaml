  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and what counts as the opportunity
        blocks:
          - type: paragraph
            body: >-
              The addressable market for Biosplice should not be framed as all arthritis spend or even all orthopedic
              intervention spend. Public evidence supports a narrower definition: knee osteoarthritis patients who cycle
              through chronic symptom-management pathways and could plausibly receive an intra-articular injection
              intended to deliver both symptom relief and structural benefit. That excludes rheumatoid-arthritis
              biologics, broad chronic-pain management spend, unrelated musculoskeletal surgery, and most general
              orthopedic implants. In practice, lorecivivint enters a care pathway already dominated by exercise, weight
              management, oral or topical pain therapy, corticosteroid injections, hyaluronic-acid injections, and
              eventual arthroplasty. The chapter therefore treats the relevant market as the knee-OA treatment pathway
              in which clinicians, payers, and patients decide whether to escalate from symptom-focused care toward a
              novel disease-modifying injection. That boundary is strategically narrower than generic OA therapeutics
              TAMs, but it is the one that matters for adoption and valuation.
            claimRefs:
              - CM001
              - CM002
              - CM010
              - CM011
              - CM017
