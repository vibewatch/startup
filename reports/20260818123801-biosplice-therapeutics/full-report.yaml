      - number: '8.4'
        title: The final decision should turn on private disclosures, not more narrative
        blocks:
          - type: paragraph
            body: >-
              At this point the highest-value work is not another generic market survey. It is private diligence. The
              decisive asks are straightforward: current post-money and ownership, liquidation preferences, option-pool
              expansion, current cash and burn, board runway plan, label scenarios, reimbursement assumptions,
              launch-readiness evidence, and proof that the regional deal economics are translating into real strategic
              leverage rather than old press-release headlines. If those materials show ordinary terms, adequate runway,
              and credible commercialization readiness at a materially lower or better-protected entry, the
              recommendation can improve quickly. If they show stress, stacked preferences, or thin liquidity, the
              thesis should break just as quickly. That makes Biosplice a price-sensitive research-more case rather than
              a permanent pass. The public evidence says there is something worth diligencing; it does not yet say there
              is a public-record basis to buy at a decacorn-style mark.
