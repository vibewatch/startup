      - number: '1.4'
        title: Milestones, regional partnerships, and execution signals
        blocks:
          - type: paragraph
            body: >-
              The company’s milestone record is mixed rather than linear. On the positive side, Biosplice converted
              lorecivivint from a long-running osteoarthritis program into a January 2026 NDA filing, signed regional
              deals with Haisco in China and Samil in Korea, and kept the broader pipeline visible through publications,
              conference presentations, and oncology trial starts. On the negative side, the public milestone trail also
              records why investors should not read the NDA as de-risking the story entirely. In 2022 the company
              acknowledged earlier phase 3 trials that missed primary pain endpoints in all-comers, and in April 2024 it
              disclosed that OA-21 also missed its 12-week primary endpoint even while OA-07 continued to show a more
              favorable long-term structure and symptom profile. The resulting chronology is important: Biosplice did
              not follow a clean successive-hit sequence into approval; it advanced through mixed phase 3 evidence,
              subgroup interpretation, and regulatory consultation. That makes the 2026 filing a major milestone, but
              not a sufficient reason to ignore path-dependence and data-interpretation risk.
