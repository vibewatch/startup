            body: >-
              Even without audited statements, the broad cost structure is easy to infer. Biosplice has financed a long
              clinical program, repeated blinded multicenter studies, regulatory submission work, and whatever
              pre-launch manufacturing and medical-operations buildout an NDA-stage asset requires. Those are expensive
              activities. What public sources do not reveal is almost everything an underwriter would want for real
              modeling: gross margin path, cost of goods, inventory build, launch working capital, monthly burn, or the
