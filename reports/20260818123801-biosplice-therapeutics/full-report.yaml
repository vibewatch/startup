            body: >-
              The company's public product set is broader than a single osteoarthritis asset. Lorecivivint is the lead
              and the only asset with an NDA filing in the reviewed source set, but the publications and trial record
              also show oncology programs including SM04755, SM08502, and cirtuvivint. That matters because the
              underlying platform story is alternative-splicing control across multiple disease areas rather than
              one-off OA chemistry. It also matters because platform breadth changes how investors should think about
              technical optionality and management focus. A broader asset map can increase value if learning transfers
              across programs; it can also create capital-allocation and execution tradeoffs. From a
              product-and-technology perspective, the right conclusion is that Biosplice has demonstrated enough public
              breadth to be considered a platform company, but not enough public operational detail to judge how
