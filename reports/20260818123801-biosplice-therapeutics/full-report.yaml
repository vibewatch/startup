      - number: '1.5'
        title: What the overview settles and what remains unresolved
        blocks:
          - type: paragraph
            body: >-
              The overview chapter can settle identity, headquarters, named leadership, visible board composition,
              disclosed 2021 financing, regional licensing milestones, and the fact pattern behind the 2026 NDA
              submission. It cannot settle current revenue, headcount, cap-table detail, debt exposure, or whether a
              very large 2026 retail financing actually closed. Public materials also leave the non-lorecivivint
              pipeline more weakly substantiated than the company’s headline platform narrative suggests. For diligence
              purposes, that means later chapters should reuse the overview as ground truth on the company’s public
              identity and chronology while preserving skepticism on unsupported scale metrics. The right takeaway is
              not that Biosplice lacks substance; rather, it is that public evidence is strongest on lorecivivint’s
              regulatory arc and much thinner on private-company operating metrics, present valuation support, and
              capitalization after 2022. That gap is large enough that any investment decision should demand fresh
              primary materials rather than lean on legacy unicorn mythology or tracker extrapolations.
