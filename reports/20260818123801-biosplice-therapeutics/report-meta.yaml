companyProfile:
  summary: >-
    Biosplice Therapeutics, formerly Samumed, is a San Diego-headquartered private biotech founded in 2008 that
    develops small-molecule therapeutics targeting alternative RNA splicing and related CLK/DYRK biology. Its value
    narrative is dominated by lorecivivint, a knee-osteoarthritis program that reached NDA filing in January 2026,
    alongside earlier ex-US licensing deals with Haisco in China and Samil in Korea. The broader platform still shows
    oncology and legacy regenerative programs, but public evidence for near-term enterprise value remains heavily
    concentrated in lorecivivint and in the company’s ability to convert late-stage clinical progress into approval,
    reimbursement, and commercialization.
  foundedDate: "2008-01-01"
  founders:
    - name: Osman Kibar, PhD
      role: Founder and Executive Chairman
      background: Public management materials consistently identify Osman Kibar as the founder figure tied to the company’s long-running biology thesis.
      claimRefs: [CO006]
  foundingLocation: San Diego, California, USA
  headquarters: San Diego, California, USA
  productSummary: >-
