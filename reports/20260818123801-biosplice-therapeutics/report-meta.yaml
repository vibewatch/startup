    lead osteoarthritis asset at NDA stage and additional oncology and legacy regenerative programs providing lower-
    confidence optionality.
  customerFocus: Rheumatology and osteoarthritis stakeholders first, with ex-US commercialization partners in China and Korea and longer-dated oncology optionality.
  businessModel: Approval-dependent biotech model combining eventual U.S. product commercialization with ex-US licensing, milestones, and potential royalties.
  stage: Private late-stage biotech (NDA-stage lead asset)
  fundingStatus: Historical 2018 reported $12B mark; disclosed $120M 2021 financing; current valuation, cash, and terms remain privately held.
