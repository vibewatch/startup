- id: capital-adequacy
  title: Capital adequacy remains the main financial unknown
  body: The public record clearly shows that Biosplice has raised private capital repeatedly, including a 2021 equity financing and multiple Form D filings. It also shows that the company used regional licensing to supplement the funding story around lorecivivint. What it does not show is current liquidity. Neither Form D filings nor press releases provide audited cash on hand, monthly burn, runway months, or a live preference stack. The NDA filing may improve financing leverage because regulatory review can compress perceived development risk, but it does not prove that the company is funded through launch. The unverified 2026 retail-raise narrative further complicates the picture because it is material if true but weakly supported in the retained source set. The correct public-data stance is that Biosplice is financing dependent, plausibly better positioned after the NDA, but not demonstrably well capitalized.
  claimRefs:
  - CI006
  - CI007
  - CI008
  - CI016
