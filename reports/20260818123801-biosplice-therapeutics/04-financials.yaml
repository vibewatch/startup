  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: Current cash on hand, monthly burn, and runway months.
    whyItMatters: These are the core variables for judging financing dependency into and after NDA review.
    diligencePath: Request latest audited or board-approved balance sheet, cash-flow statement, and runway model.
    relatedQuestionRefs:
    - QI013
    - QI016
    - QI022
    - QI025
  - type: private-evidence-only
    severity: material
    topic: revenue-recognition
    missingEvidence: Recognized revenue, deferred revenue, and receipt timing under Haisco and Samil agreements.
    whyItMatters: Headline deal values do not reveal economic quality or timing of cash inflows.
    diligencePath: Request executed licensing contracts and revenue-recognition memo.
    relatedQuestionRefs:
    - QI012
    - QI021
    - QI025
  - type: missing-source
    severity: material
    topic: launch-pricing
    missingEvidence: No retained source provides launch pricing, reimbursement assumptions, or gross-to-net economics for lorecivivint.
    whyItMatters: Without pricing and payer assumptions, near-term revenue modeling is speculative.
    diligencePath: Request pricing architecture, HEOR package, and payer-access plan.
    relatedQuestionRefs:
    - QI008
    - QI023
    - QI025
  - type: conflicting-data
    severity: material
    topic: retail-raise
    missingEvidence: The reported 2026 retail-investor raise has weak support relative to official company and filing evidence.
    whyItMatters: If true, it could materially change runway and valuation; if false, it should not influence underwriting.
    diligencePath: Request placement documents, broker-dealer records, cap-table updates, and board approvals tied to any 2026 financing.
    relatedQuestionRefs:
    - QI015
    - QI016
    - QI025
  - type: private-evidence-only
    severity: medium
    topic: capital-stack
    missingEvidence: Current cap table, preference stack, and dilution overhang.
    whyItMatters: Valuation and next-round quality depend on financing terms, not just headline amounts raised.
    diligencePath: Request fully diluted cap table, liquidation preference summary, and recent term-sheet history.
    relatedQuestionRefs:
    - QI020
    - QI024
    - QI025
