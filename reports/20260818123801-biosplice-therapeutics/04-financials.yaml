- id: cost-structure
  title: Cost structure is obvious in shape and opaque in amount
  body: 'Even without audited statements, the broad cost structure is easy to infer. Biosplice has financed a long clinical program, repeated blinded multicenter studies, regulatory submission work, and whatever pre-launch manufacturing and medical-operations buildout an NDA-stage asset requires. Those are expensive activities. What public sources do not reveal is almost everything an underwriter would want for real modeling: gross margin path, cost of goods, inventory build, launch working capital, monthly burn, or the timing of milestone receipts. This is an important distinction. The chapter can responsibly call Biosplice capital intensive, but it cannot responsibly assign a precise margin profile or runway. That missing granularity should reduce confidence in any near-term financial scenario even if the broader strategic case for the product remains interesting.'
  claimRefs:
  - CI014
