- id: licensing-and-gtm
  title: Licensing economics are visible; GTM efficiency is not
  body: The Haisco and Samil announcements are the clearest public monetization evidence because they put explicit aggregate values on regional rights. The Haisco transaction was described as up to $140 million, including $20 million in upfront and early development milestones, while the Samil deal was described as up to $70 million in aggregate value. Those are useful clues about how external partners price the asset. They are not the same as recognized revenue, cash on hand, or repeatable commercial efficiency. The company is still too early for public CAC, payback, or sales-cycle disclosure to be meaningful. As a result, GTM analysis in this chapter focuses on geography, partner structure, and contingent economics instead of software-like efficiency metrics. That is the right level of precision for an NDA-stage biotech with limited public commercialization detail.
  claimRefs:
