      - number: '2.3'
        title: 买方、用户与支付方地图
        blocks:
          - type: paragraph
            body: >-
              lorecivivint 的经济和临床决策链有多层。患者承受疾病负担，但临床医生才是操作用户：诊断阶段、判断注射是否合适，并完成给药。卫生系统和保险方是
              经济守门人，因为指南定位和报销决定一种新型注射疗法会成为标准实践，还是继续受限。这点很重要：Biosplice 推出的不是患者自给的零售药，而是
              专科医生交付、带有操作属性的产品，必须嵌入骨科、风湿科和运动医学工作流。商业上最有吸引力的患者，似乎是较早期膝 OA 患者：关节结构仍足以支撑
              疾病进程调节论点，也希望推迟手术。但公开来源尚未证明，医生会多快采用一年一次或两次注射，支付方又会如何为这种疗法相对既有症状管理注射支付溢价。
