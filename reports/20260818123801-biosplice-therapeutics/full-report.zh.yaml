        title: 既有分销、报销熟悉度和工作流适配是真护城河
        blocks:
          - type: paragraph
            body: >-
              膝 OA 的商业力量不只来自分子新颖性，也来自一种疗法在日常工作流里的位置。Monovisc、Orthovisc、Synvisc-One、Zilretta 和 Euflexxa 等产品
              已经按专科注射办公室来定位，其中一些还具备 Biosplice 尚未拥有的清晰分销或覆盖信号。J&J MedTech 围绕 Monovisc 和 Orthovisc 的分销、 Euflexxa 的
              Medicare 覆盖措辞、Orthovisc 的庞大装机基础，都指向既有渠道深度。即使公开净价证据较弱，熟悉度本身也是护城河，因为它降低临床医生和支付方的决策摩擦。 因此，Biosplice
              不只要赢下一场正面科学论证，还要赢下准入和习惯改变论证。这会抬高切换成本，也让获批只成为竞争的第一步。
