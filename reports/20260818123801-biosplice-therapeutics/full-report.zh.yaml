              最强的终端用户证据来自注册试验和已发表事后分析。大型多中心 OA 研究、数百名入组参与者和具名研究者都显示，Biosplice 能以有意义的规模招募、运行和分析项目。 PMC
              事后分析提供了保留集中最干净的患者层面证据，显示主动治疗组更可能出现临床上有意义的疼痛和功能响应。但客户章节也必须保留反向一面。安慰剂与假操作分析提醒读者， 关节腔内 OA
              试验可能出现很大的对照组响应效应；2026 年荟萃分析也比纯公司撰写材料更谨慎。这些正是把临床热情转译为未来客户行为时必须重视的细节。 简言之，证据支持利益相关方参与和用户兴趣，但还不能证明商业采用质量。
