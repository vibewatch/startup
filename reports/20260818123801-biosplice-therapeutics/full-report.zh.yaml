        title: 组合宽度带来可选性，也可能稀释焦点
        blocks:
          - type: paragraph
            body: >-
              公司并非纯粹的膝 OA 商业化故事。ClinicalTrials.gov 和 NCI 材料显示，Biosplice 仍在推进 SM04755 和 cirtuvivint 等肿瘤项目。这可以被正面解读为
              可变剪接平台不止适用于一个资产；在资本稀缺时，也可以被负面解读，因为管理层注意力和现金可能必须同时支撑多个项目。已终止的 SM08502 联合用药研究提醒人们，
              组合决策会因商业原因改变，而不只是科学原因。放在竞争分析里，主要含义是 Biosplice 可能比单资产生物技术公司有更多战略选项，但也面对成熟既有注射品牌没有的内部配置挑战。
