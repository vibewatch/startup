      - number: '5.3'
        title: 机制、证据设计，以及临床栈实际做了什么
        blocks:
          - type: paragraph
            body: >-
              lorecivivint 的公开机制叙事从 Wnt 通路调节开始，并把这种生物学与 CLK2/DYRK1A 抑制和可变前体 mRNA 剪接连接起来。这是公司差异化主张的技术核心。
              围绕它搭建的证据栈同样重要：多轮随机盲法试验、剂量探索工作，以及把患者报告疼痛 / 功能与内侧关节间隙宽度等结构影像概念结合的结局框架。公开材料说明了这个项目为何长期保持吸引力。
              当结构和症状方向一致时，产品显得最强；当全人群疼痛终点落空、即便其他活性信号存在时，产品显得最弱。这不只是临床细节，而是产品设计问题的一部分，因为疗法的真实世界价值主张取决于
              监管方和支付方如何解读这些终点。从这个意义上，证据包就是产品架构的一部分。
