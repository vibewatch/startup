  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律风险主导当前风险栈
        blocks:
          - type: paragraph
            body: >-
              Biosplice 周围的主导风险仍是监管和证据。lorecivivint 已进入 NDA 审评，这是重大成就；但这个阶段也会把注意力集中到临床包里所有剩余弱点上。混合的 3 期结果、 有记录的 OA-21
              主要终点失手，以及比公司自写信息更谨慎的外部荟萃分析，都强化了一个事实：获批不是走过场。法律一侧，公开专利转让记录显示 Biosplice 拥有有意义的 IP 资产，
              但它们没有回答可执行性、到期时间或自由实施问题。更少见的是，公开条款和隐私页面似乎缺失，形成一个较小但值得注意的治理缺口。这些法律事项都不比获批问题更重要，
              但它们属于尽调风险栈，因为它们关乎公司对投资人和交易对手的准备度与外部透明度。它们也帮助界定法律尽调何时应停止依赖表层网页证据，转入法律顾问主导的文件审查。
