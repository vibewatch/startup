  - id: TV005
    title: 投资逻辑破裂与终止触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 获批或标签不及预期
        - 出现实质延迟，或标签范围窄于商业计划要求
        - 削弱核心价值驱动，并拉长融资风险
        - 暂停投资，或要求重新定价的条款
      - - 现金或现金跑道偏弱
        - 现金跑道不足以吸收上市或监管延误
        - 把估值讨论推向稀释保护，而不是上行空间
        - 要求过桥方案，否则退出
      - - 优先权包袱
        - 优先股堆叠、激进强制跟投条款，或大规模期权池重置
        - 可能抹掉新投资者的表面上行空间
        - 重新定价或拒绝
      - - 报销计划偏弱
        - 没有可信的编码、准入或 HEOR 策略
        - 让获批药物变成慢启动或低价值上市
        - 等到准入证据出现后再承诺
      - - 合作伙伴表现不及预期
        - 区域合作伙伴执行失败，或经济条款价值低于宣传
        - 压缩可选性，并削弱外部验证
        - 下调情景权重和估值区间
    notes: 终止标准刻意做成可监测，并绑定可用于投资判断的事件。
    claimRefs:
      - CV016
      - CV022
      - CV023
      - CV024
      - CV033
      - CV035
      - CV039
      - CV040
      - CV043
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 当前估值与条款
        - 已签投资条款清单、当前投后估值、清算优先权、期权池计划
        - 把数据库叙事转成真实入场价格测算
        - 领投方律师 + CFO 尽调
      - - 流动性与现金跑道
        - 当前现金、烧钱速度、现金跑道桥接和下行情景模型
        - 判断延误是否会逼出被动融资
        - 董事会材料与 CFO 审阅
      - - 商业化假设
        - 上市价格区间、报销计划和准入里程碑
        - 把获批转成收入价值所必需
        - 商业负责人 + 市场准入审阅
      - - 上市准备度
        - CMC、供应链、医学事务和药物警戒包
        - 即便获批，运营准备不足也会毁掉股权价值
        - 质量 / 监管尽调
      - - 合作伙伴价值兑现
        - Haisco 和 Samil 里程碑状态、收款、修订和治理
        - 判断披露交易金额是否构成真实经济支撑
        - BD / 法务尽调
    notes: 要提高投资建议，最快路径不是再截更多公开数据库截图，而是拿到更好的私有证据。
    claimRefs:
      - CV014
      - CV015
