        title: 运营风险在于商业化系统不透明，而不是试验执行能力
        blocks:
          - type: paragraph
            body: >-
              公开证据支持 Biosplice 有能力运行复杂多中心研究，并维持外部科学参与。这是公司最清楚的运营强项。问题在于，这个强项覆盖开发，不一定覆盖上市。保留来源集没有让生产、CMC、
              药物警戒、供应链或现场支持就绪度变得可读。对于后期生物技术公司，这个遗漏很重要，因为获批后的成功取决于公开材料中大多不可见的系统。因此，运营风险是不对称的：
              公司看起来足以走到监管决策点，但同一公开记录不能证明它已准备好规模化商业化。这就是为什么获批本身无法清掉完整风险栈。正确的下一步尽调，是检查隐藏的运营机器，
              而不是继续争论市场规模。实际问题是，公司是否已经完成了受控商业上市所需的那些不光鲜工作。
