              并在更名后又募集了更多资本。Synapse 和 NDA 公告也让人同样容易说，主导资产已达到严肃监管里程碑。公开记录不支撑的，是把这些事实连续延伸到今天价格。
              UpMarket、Notice、Dealroom、Seedtable 和相关追踪网站是有用的定位工具，但不能替代已签投资条款清单或经审计财务包。它们在融资轮、投资人或估值方法上的分歧不是致命问题；
