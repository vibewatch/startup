  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 从工作流看，产品是什么
        blocks:
          - type: paragraph
            body: >-
              Biosplice 不是在向终端用户销售工具包或平台订阅。其公开主导产品是 lorecivivint，一种由临床医生给药、用于膝骨关节炎的关节腔内注射。从工作流看，
              这意味着疗法位于骨科或风湿科专科照护中，评估标准是疼痛、功能和结构结果，而不是消费者激活指标。使用点上的产品架构相对简单：识别合适患者，完成单次注射，
              并随时间追踪临床结果。复杂性在上游：分子设计、试验执行、监管审评和上市准备。这个区别很重要，因为它改变了“成熟”的含义。生物技术产品可以在科学上高度成熟，
              但在生产、质量或支持运营上仍商业不透明。公开来源让本章可以有把握地描述药物、给药模式和关键证据闭环。
