  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式仍以未来为主
        blocks:
          - type: paragraph
            body: >-
              公开证据没有显示 Biosplice 今天拥有确认产品收入的运营业务。研究日时，lorecivivint 仍未获批，因此最站得住的财务框架仍是未来性，而不是已实现。可见变现路径包括：
              若获批落地，未来美国产品销售；与 Haisco、Samil 等伙伴的美国以外授权经济性；以及只有在合作推进后才可能出现的后续里程碑或版税流。这与一家拥有当前经常性收入或已披露商业销量的公司 完全不同。因此，本章把
              Biosplice 视为一家经济模型依赖获批的后期生物技术公司。若有财务强度，它来自交易可选性和投资人继续资助开发的意愿，而不是已经证明的商业现金生成。
