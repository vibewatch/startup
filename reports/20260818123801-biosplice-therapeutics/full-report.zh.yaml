              公司的公开产品集合宽于单一骨关节炎资产。lorecivivint 是主导资产，也是已审阅来源集中唯一递交 NDA 的资产，但论文和试验记录还显示 SM04755、SM08502 和 cirtuvivint
              等肿瘤项目。这点重要，因为底层平台故事是跨多个疾病领域控制可变剪接，而不是一次性 OA 化学。它也重要，因为平台宽度会改变投资人对技术可选性和管理层焦点的判断。
              若学习能跨项目迁移，更宽资产地图会增加价值；它也可能带来资本配置和执行取舍。从产品与技术角度看，正确结论是 Biosplice 已展示足够公开宽度，可以被视为平台公司；
