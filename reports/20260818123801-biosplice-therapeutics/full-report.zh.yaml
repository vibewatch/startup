      - number: '1.5'
        title: 概览章节能确定什么，哪些仍未解决
        blocks:
          - type: paragraph
            body: >-
              概览章节可以确定公司身份、总部、具名领导层、可见董事会构成、已披露 2021 年融资、区域授权里程碑，以及 2026 年 NDA 递交背后的 事实脉络。它无法确定当前收入、员工数、股权结构表细节、债务敞口，或
              2026 年大额零售融资是否真正完成。公开材料也让非 lorecivivint 管线的证据基础弱于公司头部平台叙事所暗示的程度。尽调上，后续章节应把概览作为公司公开身份和时间线的基准事实，
              同时继续怀疑没有支撑的规模指标。正确结论不是 Biosplice 没有实质；更准确地说，公开证据最强之处在于 lorecivivint 的监管弧线， 对私有公司的运营指标、当前估值支撑和 2022
              年后的资本化则薄得多。这个缺口足够大，任何投资决策都应要求新的第一手材料， 而不是依赖旧独角兽神话或追踪网站外推。
