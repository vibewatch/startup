            body: >-
              正确的剩余风险判断仍应保守。获批风险是一阶问题，但不是唯一一阶问题。准入和定价准备几乎同样重要，因为标签弱或报销慢，会掏空已获批药物的价值。现金不透明也是一阶风险， 因为它决定公司有多少时间吸收延迟。已终止的
              SM08502 研究、肿瘤机构证明对 OA 上市关联有限等组合问题，不主导投资逻辑，但会影响管理层焦点和可选性。净结果是： Biosplice
              应被视为一家拥有真实科学和战略上行空间、但执行栈集中且披露不足的公司。这正是明确否决标准和具体尽调追问比泛泛热情更重要的案例。 一次意外延迟就可能同时、系统性且严重地级联到融资、准入和合作伙伴信心。
