      - number: '2.2'
        title: 用患病人数定规模，比宽泛美元 TAM 更站得住
        blocks:
          - type: paragraph
            body: >-
              公开证据更适合用人数来衡量骨关节炎问题，而不是用美元。Biosplice 自己的 OA 页面引用美国约 51.9 million 成年人、全球 527.8 million 成年人患有骨关节炎；2026 年 NDA
              发布则把这些数字四舍五入为美国约 50 million、全球 500 million 以上。两类来源都把美国膝骨关节炎人数放在 约 25 million 成年人。公司还依据自己的试验解读主张，较早期 KL2
              和早期 KL3 患者约占其最关心膝 OA 人群的 70%。这本身并不创造一个已经实现的 商业 SAM，但比把某个分析师美元 TAM
              直接塞进估值模型更有证据支撑。本报告最稳妥的做法，是把患病率、亚组适格性和临床工作流适配作为主要镜头， 同时保留基于价格的 SAM 和 SOM 硬缺口。
