      - number: '2.5'
        title: 市场章节能、不能从公开证据确定什么
        blocks:
          - type: paragraph
            body: >-
              本章可以确定市场边界、患病率数量级、既有照护路径、可能的买方-用户-支付方结构，以及为什么这件事虽然开发周期长但机会仍有吸引力。它无法确定清晰年度美元 SAM、 支付方是否愿意为疾病进程调节型 OA
              疗法支付溢价，或获批后的真实医生采用曲线。这些不是小遗漏；它们正是把一个临床上可信的市场转成有价值市场的主要变量。
              因此，后续财务和估值章节应沿用患病率驱动的市场逻辑，但避免对近期收入或渗透率给出虚假精确。正确的尽调姿态，是把膝 OA 市场看作庞大、临床痛感强、战略上供给不足，
              同时对定价、覆盖、上市顺序和专科采用保留具体追问。
            claimRefs:
              - CM023
              - CM024
              - CM029
              - CM037
              - CM038
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：现有疗法和替代方案比直接 DMOAD 对手更重要
        blocks:
          - type: paragraph
            body: >-
              Biosplice 试图进入的市场，已经用几种不同方式解决膝骨关节炎任务，只是还没有已获批的疾病进程调节产品。因此，相关竞争集合必须宽于生物技术同业本身。 它包括 Zilretta
              等皮质类固醇注射、多种透明质酸黏弹补充剂、保守治疗，以及最终通往关节置换的手术路径。这个框架很关键，因为买方不需要又一个实验性平台；
              他们需要一个理由，离开熟悉的止痛工具，或在手术前更早使用新疗法。公开证据也表明，直接已获批、可提出 DMOAD 式 OA 疗效主张的同类领域仍很薄， 若获批落地，这会帮助
              Biosplice。但在现实中，公司仍会被拿来对照那些临床医生已经会注射、支付方已经会报销的疗法。
