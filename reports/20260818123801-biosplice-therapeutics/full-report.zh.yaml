      - number: '6.2'
        title: 具名合作伙伴是最强商业化证据
        blocks:
          - type: paragraph
            body: >-
              在保留来源集中，Haisco 和 Samil 是最清楚的具名交易对手。它们的协议很重要，因为协议把 lorecivivint 连到具体地域，也让外部读者看到比标志墙或泛泛商务拓展主张更具体的东西。 Haisco
              覆盖中国，Samil 覆盖韩国；多项保留来源相互印证这些关系。这是有意义的证据，说明第三方愿意押注该资产。同时，这些交易仍不等同于成熟客户基础。它们不能证明经常性收入、
              续约率或扩张动态，并且把可见合作伙伴故事集中在少数交易对手身上。财务条款是头部价值，不是已实现收款证明。因此，客户结论应保持平衡：这些关系显示真实商业兴趣和外部验证， 但由此形成的客户基础狭窄，且仍高度或有。
