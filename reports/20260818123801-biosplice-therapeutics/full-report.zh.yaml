  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 推荐与价格纪律
        blocks:
          - type: paragraph
            body: >-
              公开证据支持关注 Biosplice，而不是直接买入。公司仍有一个正当的后期资产、多项历史融资证明，以及愿意为 lorecivivint 支付有意义区域经济性的外部伙伴。这些事实都真实。
              问题在于价格纪律。最可见的估值锚仍是 2018 年据报道 $12B 私募估值，以及少数二级市场或追踪页面；这些页面要么复用旧参考，要么依赖未披露模型，
              要么明确标注其所有权数据为估计。与此同时，同一公开记录仍未披露当前现金、烧钱速度、股权结构表优先权、已实现伙伴收款、上市定价或支付方准备度。
              这个错配比公司的出身更重要。纪律严明的委员会可以保持兴趣，同时拒绝把历史光环或追踪页面当作当前公允价值。正确姿态因此是继续研究 / 观察； 只有当私有证据补上估值和流动性缺口时，推荐才应上调。
