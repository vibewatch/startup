        - 适合估值模型的交易参考
        - 总价值最高 $140M，包含首付款和里程碑
        - 锚定外部对区域权益的真实支付意愿
        - 不是企业股权估值
      - - Lorecivivint 韩国授权
        - 适合估值模型的交易参考
        - 总价值最高 $70M
        - 增加第二个外部资产价值参考
        - 仍不是企业股权估值
      - - Caplight / VentureRadar / Tracxn 的同业篮子
        - 基于相似度的可比组
        - OrthoTrophix、Kolon TissueGene、Eupraxia、Surrozen、Skyhawk、Frequency、Arrakis 等出现在类比对象中
        - 有助于同业框架和类别定位
        - 抓取摘录未提供干净的匹配倍数组合
    notes: 这只是估值相关参考的样本列举，不是完整或标准化的公开可比公司表。
