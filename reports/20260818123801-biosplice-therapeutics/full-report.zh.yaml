      - number: '1.3'
        title: 资本历史、投资人和估值模糊性
        blocks:
          - type: paragraph
            body: >-
              2021 年更名后，最清楚披露的融资事件是 2021 年 4 月 $120 million 股权融资；公司把这笔钱直接连到 lorecivivint 和 更宽的可变剪接平台议程。2021 年 3 月和 2022
              年 8 月的 SEC Form D 文件证实，更名后 Biosplice 仍处在私募融资模式， 但这些公开文件本身不给出新的市场出清估值。估值语境反而来自第三方追踪网站。Dealroom 仍呈现一家 2008
              年成立、位于 San Diego、带有旧百亿美元独角兽名声的生物技术公司；Caplight、Seedtable、Tracxn 和私募市场交易页面保留历史融资轮参考， 但没有在公开域浮现干净的 2021
              年后重定价事件。投资人因此面对旧估值锚问题：Biosplice 仍带着 2018 年 $12B 时代叙事的 记忆，但公开证据集对融资时间线的支撑远强于对当前公允价值的支撑。据称的 2026
              年零售融资若属实，可能显著改变判断； 但在已审阅来源集中，它仍是低置信度，且未获公司官方渠道确认。
