      - number: '3.2'
        title: Biosplice 的差异化在品类论点，不在商业护城河
        blocks:
          - type: paragraph
            body: >-
              lorecivivint 的市场叙事围绕一个想法：它可能通过影响结构和功能，做到不止临时控痛。这正是投资人和临床医生认为它可能显著不同于既有类固醇和透明质酸产品的核心原因。 问题在于，Biosplice
              自己的公开证据基础是混合的。公司可以指向 OA-07 的结构和症状数据，但也披露过 OA-21 主要疼痛终点未达标，以及更早 3 期全人群结果混合。
              也就是说，产品可能仍有战略差异化，但尚未商业上占优。与成熟既有疗法相比，Biosplice 缺少已获批标签的熟悉度、办公室常规使用和累积报销先例。因此，竞争故事不是 lorecivivint
              已经在每个维度更强；而是如果监管方和支付方接受底层证据包，它可能创造一条新维度。
