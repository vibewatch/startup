companyProfile:
  summary: >-
    Biosplice Therapeutics 曾名 Samumed，是一家总部位于 San Diego、2008 年成立的私有生物技术公司，开发靶向 可变 RNA 剪接及相关 CLK/DYRK
    生物学的小分子疗法。公司价值叙事主要押在 lorecivivint 上：这是一个膝骨关节炎 项目，已在 2026 年 1 月递交 NDA；此前公司还与中国 Haisco、韩国 Samil 达成美国以外授权交易。更宽的平台仍展示
    肿瘤和遗留再生项目，但支持近期企业价值的公开证据高度集中在 lorecivivint，以及公司能否把后期临床进展转成获批、 报销和商业化。
