          - type: paragraph
            body: >-
              按生物技术标准，OA 资产已经成熟。公开记录包括 2 期、3 期和现在 NDA 阶段证据。多项试验记录、论文和公司发布提供了清晰里程碑路径：从剂量探索到关键设计，再到监管递交。
              这比许多风险投资阶段生物技术资产能展示的成熟度信号强得多。但成熟度并不均衡。来源集大量披露临床设计，却很少披露生产、放行检测、商业药物警戒运营或规模化上市支持。
              因此，报告可以把临床开发机器评分为先进，同时仍把运营和质量就绪度视为披露不足。这个缺口不致命，但很重要，因为项目一旦从试验执行转向商业化，缺失细节就会变成最重要的一批产品风险。
            claimRefs:
