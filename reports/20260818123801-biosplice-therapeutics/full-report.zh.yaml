      - number: '2.4'
        title: 增长驱动与最关键的采用约束
        blocks:
          - type: paragraph
            body: >-
              需求侧驱动很直接：骨关节炎患病率大且仍在上升，疾病造成显著疼痛和功能损失，市场仍缺少已获批的疾病进程调节药物。这些因素为一种不止临时镇痛的疗法
              留出了真实战略空间。更难的是把未满足需求转成可报销采用。Biosplice 自己的公开发布说明了原因。公司可以指向 OA-07 的长期结构和症状数据， 但也承认更早 3 期研究未达到主要疼痛终点，OA-21 在
              12 周时也再次未达标。这些失手不仅影响监管，也影响商业故事，因为新注射疗法若要替代保守照护和
              皮质类固醇或黏弹补充剂等熟悉既有方案，支付方和临床医生需要一套清晰证据包。因此，这个市场有吸引力，但也异常敏感：终点设计、亚组选择、报销证明和标签范围 都会左右采用。
