  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 投资判断从战略可信度出发，经由估值不透明，落到「继续研究」建议。
    data:
      nodes:
        - id: stage
          label: NDA 阶段资产
          detail: 后期 lorecivivint 是实打实的战略证明
        - id: partners
          label: 合作伙伴经济性
          detail: Haisco 和 Samil 验证区域支付意愿
        - id: trackers
          label: 陈旧估值锚
          detail: 2018 年估值标记和追踪页面主导公开价格语境
        - id: gaps
          label: 披露缺口
          detail: 现金、条款和上市经济性仍缺位
        - id: call
          label: 继续研究 / 跟踪
          detail: 兴趣仍在，买入决策不成立
      edges:
        - from: stage
          to: call
          label: 支撑兴趣
        - from: partners
          to: call
          label: 增加可选性
        - from: trackers
          to: call
          label: 限制价格信心
        - from: gaps
          to: call
          label: 卡住投资测算
