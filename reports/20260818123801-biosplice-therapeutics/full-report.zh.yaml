          detail: Wnt / CLK2-DYRK1A / 可变剪接逻辑
        - label: 药物产品
          detail: 单次关节腔内 lorecivivint 注射
        - label: 证据引擎
          detail: 采用 PRO 和结构终点的随机盲法试验
        - label: 监管层
          detail: OA 资产的 NDA 阶段审评
    claimRefs:
      - CE001
      - CE004
      - CE007
      - CE010
      - CE025
  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: standard
    summary: OA 产品从患者筛选走向专科注射，再进入长期结局随访。
    data:
      nodes:
        - id: patient
          label: 膝 OA 患者
          detail: 中重度有症状疾病
        - id: clinician
          label: 专科注射医生
          detail: 评估适配度并给药
        - id: therapy
          label: Lorecivivint 注射
          detail: 单次关节腔内给药
        - id: followup
          label: 结局随访
          detail: 疼痛、功能、结构跟踪
        - id: reg
          label: 监管 / 支付方解读
          detail: 把证据转成准入
      edges:
        - from: patient
          to: clinician
          label: 评估
        - from: clinician
          to: therapy
          label: 给药
        - from: therapy
          to: followup
