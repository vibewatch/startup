            body: >-
              公开留存证据很弱。公司没有披露 NRR、GRR、流失、合同续约或复购指标。试验随访和重复给药设计只能作为间接代理，因为它们捕捉的是方案化参与，而不是真实客户复购意愿。
              相比之下，集中风险很容易看见。可见的美国以外合作伙伴故事集中在少数具名交易对手身上，整体客户叙事也围绕一个主导 OA 资产集中。这不让公司失去吸引力，
              但从尽调角度看，客户基础多元化不足。若获批落地，少数合作伙伴和支付方决策可能产生不成比例的影响。在此之前，正确分析动作是让大多数留存字段保持空值， 并强调集中度、利益相关方类型和下一批证明里程碑。
