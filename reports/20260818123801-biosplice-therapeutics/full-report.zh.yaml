            body: >-
              Biosplice 的合作伙伴结构既帮忙，也制造风险。Haisco 和 Samil 通过显示外部交易对手愿意签下该资产，降低了商业化故事的孤立感。它们也制造集中度，因为具名伙伴只有少数几家，
              客户故事仍处于商业化前阶段。若这些伙伴表现不佳，或支付方准入较弱，可见变现通道会迅速变窄。财务不透明会放大这个风险。Form D 活动和融资公告显示，公司反复接触资本，
              但没有披露当前现金、烧钱速度或现金跑道。支撑较弱的 2026 年零售融资说法增加的是噪音，不是清晰度。合在一起看，伙伴依赖、支付方准入不确定性和融资不透明不是彼此独立的问题；
              如果获批时点或上市牵引力令人失望，它们会相互强化。
