chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、阶段与战略定位
        blocks:
          - type: paragraph
            body: >-
              Biosplice Therapeutics 更应被看作一家私有临床阶段生物技术公司，而不是商业化药企。公开材料始终把公司锚定在 San Diego，围绕 CLK/DYRK 激酶和可变 RNA
              剪接的小分子调控展开，并把 lorecivivint 放在当前企业价值叙事中心。 Dealroom 将成立时间列为 2008 年；公司现有材料则强调现在的 Biosplice
              品牌，以及开发改变疾病进程疗法的目标， 而不是递增式症状缓解药物。这个定位对尽调很关键：公司今天没有销售已获批药物，经营身份仍靠管线可信度、监管执行和
              后续融资，而不是经常性产品收入。公开记录也显示，Biosplice 仍用平台故事解释骨关节炎、肿瘤、神经和其他退行性疾病的 管线宽度，但外部可见证据压倒性集中在膝骨关节炎。后续章节评估 lorecivivint
              之外的可选性时，应以这种集中度为前提。
