      - number: '8.3'
        title: 情景和可比公司应用来框定估值，而不是假装解出估值
        blocks:
          - type: paragraph
            body: >-
              同业集合有助于给讨论划边界，但不会给出整齐的表格答案。Caplight、VentureRadar 和 Tracxn 把 Biosplice 归到再生医学、RNA
              和专科生物技术同业旁边，而不是一组可直接对标的上市公司。这在方向上有用，因为它显示投资人和数据库如何给公司分类；但还不足以支撑直接套倍数。更相关的投资判断参照是历史融资估值、Haisco 和 Samil
              交易价值、后期 NDA
              里程碑，以及平台可选性与当前商业化不透明之间的落差。乐观情景需要获批、报销可行，且当前融资条款不会把新资本卡在旧私募估值之后。基准情景假设科学与合作叙事仍可信，但价格必须回落到当前披露能支撑的水平。悲观情景假设获批时间推迟、支付方准入弱于预期，或公司必须在压力下融资。这些结果本来就会拉出很宽的估值区间。
