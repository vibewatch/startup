      - number: '8.4'
        title: 最终判断应看私有披露，而不是更多叙事
        blocks:
          - type: paragraph
            body: >-
              眼下最有价值的工作不是再做一份泛泛的市场调查，而是私有尽调。决定性要项很直接：当前投后估值和持股、清算优先权、期权池扩张、当前现金和烧钱速度、董事会现金跑道计划、获批标签情景、报销假设、上市准备证据，以及区域交易经济条款确实转化为战略杠杆、而不是停留在旧新闻稿标题里的证明。如果这些材料显示条款常规、现金跑道足够，并且公司在显著更低或保护更好的入场点上具备可信的商业化准备，建议可以很快上调。如果材料显示压力、优先股堆叠或流动性单薄，投资逻辑也应同样快地失效。因此
              Biosplice 是一个价格敏感的继续研究案例，而不是永久放弃。公开证据说明它值得尽调；但还没有公开记录基础可以支持按十角兽式估值买入。
