  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 当前实际客户是合作伙伴和临床利益相关方，不是商业用户
        blocks:
          - type: paragraph
            body: >-
              本章最大的挑战是定义。Biosplice 还没有软件或医疗器械公司可能展示的那类公开商业客户基础。研究日时，lorecivivint 仍未获批，因此没有经过验证的公开证据显示生产收入账户、
              活跃商业治疗患者数或支付方合同。当前最好的客户代理，是更宽的利益相关方集合：Haisco、Samil 等区域商业化伙伴，负责把研究落地的临床研究者和中心，以及用结局构成证据包的患者。
              这意味着客户章节讨论的不是已安装收入账户，而是谁已经愿意向项目投入资源、权益和运营时间。这个区别很关键，因为它让分析保持诚实：Biosplice 有真实的外部交易对手和用户参与，
              但还没有广泛、可衡量的上市客户基础。
