  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与机会口径
        blocks:
          - type: paragraph
            body: >-
              Biosplice 的可触达市场不应被框成全部关节炎支出，甚至也不是全部骨科干预支出。公开证据支持更窄定义：膝骨关节炎患者在长期症状管理路径中
              反复切换，且可能接受一种关节腔内注射，目标是同时带来症状缓解和结构性获益。这个口径排除了类风湿关节炎生物制剂、广义慢性疼痛管理支出、 无关肌骨手术和大多数通用骨科植入物。实际临床中，lorecivivint
              进入的照护路径已由运动、体重管理、口服或外用止痛治疗、皮质类固醇注射、 透明质酸注射和最终关节置换主导。因此，本章把相关市场定义为膝 OA 治疗路径：临床医生、支付方和患者在这里决定，是否从聚焦症状的照护升级到
              一种新的疾病进程调节注射。这个边界在战略上窄于泛 OA 治疗 TAM，但它才是影响采用和估值的口径。
