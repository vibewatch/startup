      - number: '1.2'
        title: 领导层、创始人影响与治理覆盖
        blocks:
          - type: paragraph
            body: >-
              现有管理层和董事会材料显示，Biosplice 的领导班子不大，但功能上齐全。Erich Horsley 是现任 CEO，Osman Kibar 仍任创始人兼执行董事长，Yusuf Yazici
              负责医学战略，Phil Wilson 担任 CFO，Scott Bulcao 负责法律。董事会页面还显示 来自投资方的治理覆盖：Vickers Venture Partners 的 Finian
              Tan、Sands Capital 的 Stephen Zachary，以及 Ahmed Khizer Khan 和 Simon Faure。这个架构让 Biosplice
              在战略、医学、财务和法律事务上都有可见覆盖，但公开记录也提示 明显的关键人物依赖。Kibar 仍是公司长期生物学论点绑定的创始人身份，Horsley 反复出现在商业和融资材料中，Yazici 则是
              骨关节炎数据发布里最可见的临床发言人。换句话说，公司有治理结构，但公开叙事仍集中在少数具名高管和投资人身上，而不是 宽广披露的运营团队。
