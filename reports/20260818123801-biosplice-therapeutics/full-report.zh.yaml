      - number: '1.4'
        title: 里程碑、区域合作与执行信号
        blocks:
          - type: paragraph
            body: >-
              公司的里程碑记录有正有负，并非线性推进。积极一面是，Biosplice 把 lorecivivint 从长期骨关节炎项目推进到 2026 年 1 月 NDA 递交，与中国 Haisco、韩国 Samil
              签署区域交易，并借助论文、会议报告和肿瘤试验启动，让更宽管线保持可见。 消极一面是，公开里程碑轨迹也说明，投资人不应把 NDA 视为故事已完全去风险。2022 年，公司承认更早的 3 期试验在全人群中
              未达到主要疼痛终点；2024 年 4 月，公司又披露 OA-21 也未达到 12 周主要终点，尽管 OA-07 继续显示更有利的长期结构和 症状轮廓。因此，时间线本身很重要：Biosplice
              不是靠连续命中一路走向获批，而是在混合 3 期证据、亚组解读和监管沟通中推进。 2026 年递交因此是重大里程碑，但不足以让人忽略路径依赖和数据解读风险。
