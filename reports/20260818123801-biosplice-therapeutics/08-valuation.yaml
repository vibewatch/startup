- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: sample
    basis: 'Representative valuation-relevant references fetched for this chapter: historical private rounds, secondary-market tracker pages, and model-appropriate partner economics rather than a definitive public-biotech multiple set.'
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Biosplice 2018 private round
    - Historical financing mark
    - Reported $438M round at $12B pre-money
    - Best-known historic valuation anchor
    - Stale and pre-NDA; not current fair value
  - - Biosplice 2021 financing
    - Later private financing
    - Company-announced $120M financing; valuation undisclosed
    - Shows post-rebrand capital access
    - No post-money or preference terms disclosed
  - - UpMarket / Notice tracker context
    - Secondary-style private-market signal
    - UpMarket quotes $12.44B reference and $11B estimate; Notice shows $4.87 share headline
    - Useful for current market narrative and liquidity framing
    - Model-driven, indirect, and not a priced round
  - - Lorecivivint China licensing
    - Model-appropriate transaction reference
    - Up to $140M aggregate value including upfront and milestones
    - Anchors real external willingness to pay for regional rights
    - Not enterprise equity valuation
  - - Lorecivivint Korea licensing
    - Model-appropriate transaction reference
    - Up to $70M aggregate value
    - Adds second external asset-value reference
    - Still not enterprise equity valuation
  - - Peer baskets from Caplight / VentureRadar / Tracxn
    - Similarity-based comp set
    - OrthoTrophix, Kolon TissueGene, Eupraxia, Surrozen, Skyhawk, Frequency, Arrakis and others surfaced as analogs
    - Useful for peer framing and category placement
    - Fetched excerpts do not provide a clean matched multiple set
  notes: This is a sample enumeration of valuation-relevant references, not a complete or normalized public-comps table.
