- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence support
  - What would change the view
  rows:
  - - 'Thesis: lorecivivint is a real late-stage asset'
    - NDA filed and still treated as NDA/BLA-stage by retained sources
    - Actual approval, label breadth, and launch plan
  - - 'Thesis: external partners validated the asset'
    - Haisco and Samil disclosed meaningful regional economics
    - Evidence that partner economics translate into realized value
  - - 'Thesis: historical funding access was exceptional'
    - 2018 reported $12B mark plus later financing round
    - Current terms and runway, not only historical prestige
  - - 'Anti-thesis: valuation evidence is stale'
    - Tracker pages lean on old references or opaque models
    - Signed term sheet with current pricing and investor protections
  - - 'Anti-thesis: economics are opaque'
    - No public revenue, margin, burn, or runway figures
    - Private financial package with cash bridge and commercialization assumptions
  - - 'Anti-thesis: mixed evidence can compress price'
    - OA evidence is not clean enough for a frictionless premium multiple
    - Approval plus reimbursement traction and clean post-launch indicators
  notes: Arguments are paired with falsifiable diligence asks rather than treated as permanent truths.
