- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Approval or label disappointment
    - Meaningful delay or label narrower than commercial plan requires
    - Undercuts core value driver and extends financing risk
    - Pause investment or demand repriced terms
  - - Cash or runway weakness
    - Runway insufficient to absorb launch or regulatory slippage
    - Forces valuation discussion into dilution protection rather than upside
    - Require bridge plan or walk
  - - Preference overhang
    - Stacked preferences, aggressive pay-to-play, or large option-pool reset
    - Can erase headline upside for new investors
    - Reprice or decline
  - - Weak reimbursement plan
    - No credible coding, access, or HEOR strategy
    - Turns approved drug into slow or low-value launch
    - Delay commitment until access proof exists
  - - Partner underperformance
    - Regional partners fail to execute or economics prove less valuable than advertised
    - Shrinks optionality and removes external validation
    - Lower scenario weights and valuation range
  notes: Kill criteria are intentionally monitorable and tied to underwriteable events.
