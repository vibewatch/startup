- id: what-is-supported-vs-stale
  title: What the public record really supports versus what it only gestures toward
  body: The public record is strongest on historical financing and current strategic stage. MedCity, Tracxn, the 2021 company financing release, and the SEC filing trail make it easy to say Biosplice once commanded an extraordinary private valuation and later raised more capital after the rebrand. Synapse and the NDA announcements make it equally easy to say the lead asset has reached a serious regulatory milestone. What the public record does not support is continuity from those facts to today's price. UpMarket, Notice, Dealroom, Seedtable, and related trackers are useful orientation tools, but they are not substitutes for a signed term sheet or audited financial package. Their disagreements on rounds, investors, or valuation methodology are not fatal; they simply show why this chapter must be scenario-based. A valuation chapter that pretends those pages are primary evidence would overstate certainty. The more honest view is that Biosplice is strategically credible but still priced through
    an opaque private-market mirror.
  claimRefs:
