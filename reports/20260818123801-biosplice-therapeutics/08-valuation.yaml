  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-post-money-and-terms
    missingEvidence: Signed term sheet, current post-money valuation, liquidation preferences, option-pool reset, and board-rights package.
    whyItMatters: Tracker pages cannot substitute for actual entry math or downside protection.
    diligencePath: Request live financing documents and counsel-marked cap-table waterfall.
    relatedQuestionRefs:
    - QV025
    - QV028
    - QV030
  - type: private-evidence-only
    severity: material
    topic: cash-burn-runway
    missingEvidence: Current cash on hand, monthly burn, runway bridge, and downside scenario model.
    whyItMatters: A stale private mark becomes dangerous if the company still needs pressured financing before commercialization.
    diligencePath: Request latest board cash forecast, trailing cash flow, and runway stress test.
    relatedQuestionRefs:
    - QV016
    - QV026
    - QV030
  - type: private-evidence-only
    severity: material
    topic: launch-price-and-access
    missingEvidence: Internal launch price corridor, reimbursement assumptions, coding strategy, and access milestones.
    whyItMatters: Approval without viable pricing and access can destroy expected equity value.
    diligencePath: Review market-access plan, payer workstream, and pre-launch commercial model.
    relatedQuestionRefs:
    - QV007
    - QV019
    - QV027
    - QV030
  - type: missing-source
    severity: material
    topic: commercial-uptake-metrics
    missingEvidence: Public or private proof of treated commercial patients, early accounts, reorder behavior, or real launch demand.
    whyItMatters: Without uptake metrics, valuation depends almost entirely on pre-commercial scenario assumptions.
    diligencePath: Request account pipeline, pilot-to-paid conversion data, and demand forecast by segment.
    relatedQuestionRefs:
    - QV015
    - QV020
    - QV029
  - type: missing-source
    severity: medium
    topic: normalized-comparable-pricing
    missingEvidence: A clean, matched public/private comparable set with disclosed revenue, stage, and current valuation for true read-through.
    whyItMatters: The fetched comparable surfaces are helpful for category placement but too heterogeneous for a precise multiple.
    diligencePath: Build a normalized comp sheet after confirming the company's actual terms and near-term commercialization model.
    relatedQuestionRefs:
    - QV010
    - QV011
    - QV024
    relatedTableRefs:
    - TV004
