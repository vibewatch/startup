  name: Biosplice Therapeutics
chapter:
  number: 8
  title: Valuation
summary: 'Biosplice remains strategically interesting but hard to price: the public record supports a real NDA-stage asset, meaningful regional partner economics, and historically exceptional funding, yet today''s visible valuation stack still rests on stale 2018 references, tracker-model outputs, and missing cash and cap-table evidence. The recommendation is research-more / track rather than buy until current valuation, liquidity, and commercialization data are disclosed.'
sections:
- id: recommendation-price-discipline
  title: Recommendation and price discipline
  body: Public evidence supports interest in Biosplice, not a buy decision. The company still has a legitimate late-stage asset, multiple historical financing proofs, and external partners willing to pay meaningful regional economics for lorecivivint. Those facts are real. The problem is price discipline. The most visible valuation anchors are still a 2018 reported $12B private mark and a handful of secondary-market or tracker pages that either reuse old references, rely on undisclosed models, or explicitly label their ownership data as estimated. Meanwhile, the same public record still does not disclose current cash, burn, cap-table preferences, realized partner receipts, launch pricing, or payer readiness. That mismatch matters more than the company's pedigree. A disciplined committee can remain interested while refusing to treat historical prestige or tracker pages as current fair value. The right posture is therefore research-more / track, with the recommendation allowed to improve only
    if private evidence closes the valuation and liquidity gaps.
  claimRefs:
