- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Case
  - Assumptions
  - Valuation / return logic
  - Probability signal
  - Downside trigger
  rows:
  - - Bull
    - Approval lands, label is commercially usable, access work is credible, and cap-table terms are ordinary
    - A protected entry below stale decacorn expectations can compound if launch de-risks quickly
    - Private package confirms runway and launch readiness
    - Approval delay, adverse label, or stacked preferences
  - - Base
    - Science and partner story remain credible but public metrics stay incomplete
    - Track or diligenced hold; price should reset to what current disclosure can support
    - Historical funding plus partner economics keep option value alive
    - No data-room access or valuation discipline
  - - Bear
    - Approval, access, or financing goes wrong while current mark remains anchored to old prestige
    - Flat or down-round outcome becomes plausible and upside compresses
    - Secondary liquidity remains thin and terms are investor-unfriendly
    - Forced financing or weak reimbursement
  notes: Scenario logic is directional rather than precise because public evidence does not support a clean DCF or revenue-multiple model.
