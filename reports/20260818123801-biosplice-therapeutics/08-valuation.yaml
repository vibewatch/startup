  - CV043
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Current valuation and terms
    - Signed term sheet, current post-money, liquidation preferences, option-pool plan
    - Turns tracker narratives into real entry math
    - Lead investor counsel + CFO diligence
  - - Liquidity and runway
    - Current cash, burn, runway bridge, and downside scenario model
    - Determines whether delays create forced financing
    - Board package and CFO review
  - - Commercial assumptions
    - Launch price corridor, reimbursement plan, and access milestones
    - Needed to translate approval into revenue value
    - Commercial lead + market-access review
  - - Launch readiness
    - CMC, supply chain, medical affairs, and pharmacovigilance package
    - Operational readiness can destroy equity value even after approval
    - Quality/regulatory diligence
  - - Partner value realization
    - Haisco and Samil milestone status, receipts, amendments, and governance
    - Shows whether disclosed deal values are real economic support
    - BD/legal diligence
  notes: The shortest path to a better recommendation is better private evidence, not more public tracker screenshots.
