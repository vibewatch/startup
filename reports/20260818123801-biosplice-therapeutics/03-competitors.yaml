- id: strategy
  title: Portfolio breadth adds optionality, but it can also dilute focus
  body: The company is not purely a knee-OA commercial story. ClinicalTrials.gov and NCI materials show Biosplice continuing to advance oncology programs such as SM04755 and cirtuvivint. That can be interpreted positively as evidence the alternative-splicing platform has applications beyond one asset. It can also be interpreted negatively when capital is scarce, because management focus and cash may need to support multiple programs at once. The terminated SM08502 combination study is a useful reminder that portfolio decisions can change for business reasons, not only scientific ones. For competitor analysis, the main implication is that Biosplice may have more strategic options than a one-asset biotech, but it also faces an internal allocation challenge that mature incumbent injection brands do not. That is not a direct product competitor, but it is a real competitive-readiness variable.
  claimRefs:
  - CP022
  - CP023
  - CP024
  - CP025
  - CP035
  tableRefs:
  - TP004
  figureRefs: []
- id: moat
  title: Moat durability depends on label strength and payer acceptance, not just novelty
  body: 'If lorecivivint reaches the market, its moat will come from being first into a potentially new disease-modifying OA category, not from already owning distribution. That can be powerful if the label supports a differentiated structure-plus-symptom story. It can evaporate quickly if the label is narrow, uptake is slow, or incumbents adapt with contracting and convenience-focused response. Public data do not yet let this chapter prove strong IP durability, true physician switching shares, or precise price competition. The right conclusion is therefore conditional: Biosplice may have a meaningful thesis moat, but incumbents currently look stronger on trust, reimbursement familiarity, and commercial durability. The most important next diligence asks are full label economics, physician willingness to switch, and how access strategy will offset entrenched workflow behavior.'
