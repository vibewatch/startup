- id: channel
  title: Incumbent distribution, coverage familiarity, and workflow fit are real moats
  body: Commercial power in knee OA does not come only from molecule novelty. It also comes from where a therapy sits in everyday workflow. Products like Monovisc, Orthovisc, Synvisc-One, Zilretta, and Euflexxa are already framed for specialist injection offices, and some have clear distribution or coverage signals that Biosplice does not yet possess. J&J MedTech distribution around Monovisc and Orthovisc, Medicare coverage language on Euflexxa, and Orthovisc's large installed base all point to incumbent channel depth. Even where public net-price evidence is weak, familiarity itself is a moat because it lowers decision friction for clinicians and payers. Biosplice therefore has to win not just a head-to-head science argument, but an access and habit-change argument. That raises switching costs and makes approval only the first step in competition.
