  evidenceGaps:
  - type: missing-source
    severity: material
    topic: net-pricing
    missingEvidence: Reviewed public sources do not provide a reliable, comparable net-pricing dataset across incumbent injectables and lorecivivint.
    whyItMatters: Without comparable pricing and reimbursement economics, the chapter cannot rank competitors on value-for-money or undercutting risk with confidence.
    diligencePath: Request provider buy-and-bill economics, gross-to-net assumptions, and payer policy examples for incumbent products and Biosplice launch plans.
    relatedQuestionRefs:
    - QP021
  - type: missing-source
    severity: material
    topic: switching-shares
    missingEvidence: No retained source quantifies real-world physician switching or multi-homing shares across OA injectables.
    whyItMatters: Adoption-speed modeling depends on whether clinicians rotate among incumbent products or stay sticky to a preferred workflow.
    diligencePath: Request physician survey data, claims analysis, and any field-intelligence on prescribing concentration by practice type.
    relatedQuestionRefs:
    - QP025
  - type: conflicting-data
    severity: material
    topic: differentiation-strength
    missingEvidence: Biosplice's differentiation thesis is real, but mixed phase 3 pain outcomes conflict with a simple superiority story.
    whyItMatters: The product's competitive moat depends on whether subgroup or structural advantages are strong enough to overcome all-comer endpoint misses.
    diligencePath: Review full study reports, subgroup reproducibility, and payer/physician reactions to the final NDA data package.
    relatedQuestionRefs:
    - QP022
    - QP023
  - type: missing-source
    severity: medium
    topic: ip-durability
    missingEvidence: Public IP trackers are too thin to conclude on moat duration without primary patent review.
    whyItMatters: Durable exclusivity can matter if incumbents respond quickly after approval.
    diligencePath: Obtain primary patent family list, Orange Book status if any, and counsel review of composition and use claims.
    relatedQuestionRefs:
    - QP024
  - type: missing-source
    severity: medium
    topic: incumbent-contracting
    missingEvidence: Competitor pages reveal little about payer contracting, discounting, or provider-buy-and-bill economics.
    whyItMatters: Channel strength may depend more on contracting than on label text.
    diligencePath: Collect policy documents, specialty-distributor terms, and representative reimbursement workflows from target clinics.
    relatedQuestionRefs:
    - QP021
    - QP025
