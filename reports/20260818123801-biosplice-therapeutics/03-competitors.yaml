- id: positioning
  title: Biosplice is differentiated on category thesis, not on commercial entrenchment
  body: Lorecivivint is marketed around the idea that it could do more than temporary pain control by affecting structure and function. That is the core reason investors and clinicians would consider it materially different from incumbent steroid and hyaluronic-acid products. The problem is that Biosplice's own public evidence base is mixed. The company can point to OA-07 structure and symptom data, but it also disclosed missed primary pain endpoints in OA-21 and earlier mixed all-comer phase 3 results. That means the product may still be strategically differentiated without yet being commercially dominant. Compared with established incumbents, Biosplice lacks approved-label familiarity, routine office use, and accumulated reimbursement precedent. So the competitive story is not that lorecivivint is already stronger on every axis; it is that it could create a new axis if regulators and payers accept the underlying evidence package.
