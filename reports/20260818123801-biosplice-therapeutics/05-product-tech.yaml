  evidenceGaps:
  - type: missing-source
    severity: material
    topic: cmc-manufacturing
    missingEvidence: No retained public source details commercial manufacturing, formulation release testing, or CMC readiness for lorecivivint.
    whyItMatters: An NDA-stage asset can still stumble if manufacturing and quality systems are not launch ready.
    diligencePath: Request CMC summary, manufacturing-site plan, release-testing framework, and comparability strategy.
    relatedQuestionRefs:
    - QE021
    - QE024
    - QE025
  - type: missing-source
    severity: material
    topic: launch-support
    missingEvidence: No retained source describes commercial pharmacovigilance, field support, or post-launch medical-operations readiness.
    whyItMatters: Product success after approval depends on support and safety operations, not just clinical efficacy.
    diligencePath: Request launch-readiness workstream owners, pharmacovigilance SOP summary, and field medical support plan.
    relatedQuestionRefs:
    - QE021
    - QE022
    - QE024
  - type: conflicting-data
    severity: material
    topic: endpoint-translation
    missingEvidence: Late-stage releases show mixed pain-endpoint outcomes alongside structural or subgroup positives.
    whyItMatters: The product thesis depends on how mixed endpoint evidence translates into label strength and payer acceptance.
    diligencePath: Review full clinical study reports, subgroup reproducibility, and payer/physician reactions to the final NDA package.
    relatedQuestionRefs:
    - QE020
    - QE022
    - QE025
  - type: missing-source
    severity: medium
    topic: poster-weight
    missingEvidence: Conference poster claims are visible, but not every poster item is paired with a full peer-reviewed publication in the retained set.
    whyItMatters: Poster data are useful for freshness but weaker than journal articles for underwriting the product story.
    diligencePath: Map every major poster claim to a peer-reviewed publication or formal regulatory disclosure.
    relatedQuestionRefs:
    - QE018
    - QE025
  - type: missing-source
    severity: medium
    topic: platform-economics
    missingEvidence: Public sources do not reveal how shared platform capabilities transfer economically across OA and oncology programs.
    whyItMatters: Platform breadth may add value or distraction depending on capital efficiency and shared infrastructure.
    diligencePath: Request R&D allocation by program, shared-team map, and stage-gate governance for portfolio prioritization.
    relatedQuestionRefs:
    - QE023
    - QE024
