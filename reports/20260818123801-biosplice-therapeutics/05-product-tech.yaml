  figureRefs: []
- id: trust
  title: Trust and quality are supported mainly by study design, not by visible operating controls
  body: The strongest public trust signals are scientific and regulatory rather than operational. Randomized, blinded, placebo-controlled studies, peer-reviewed articles, and a steady conference-poster cadence all support the view that Biosplice has built a serious evidence engine around lorecivivint. Safety and tolerability language also appears consistently across the retained sources. What is missing is equally important. The reviewed public set does not reveal commercial-scale manufacturing partners, detailed CMC controls, release metrics, public quality-system certifications, or commercial support infrastructure. That does not mean the controls do not exist; it means outside investors cannot verify them from public sources. For a biotech at NDA stage, this is the core unresolved product-tech issue. The chapter therefore treats study rigor and scientific engagement as verified strengths, while keeping commercialization quality systems and support readiness as explicit diligence gaps
    rather than inferred strengths.
