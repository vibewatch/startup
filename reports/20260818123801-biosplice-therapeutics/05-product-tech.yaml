- id: maturity
  title: Maturity is high in clinical development and low in commercial operations visibility
  body: By biotech standards, the OA asset is mature. The public record includes phase 2, phase 3, and now NDA-stage evidence. Multiple trial records, publications, and company releases provide a clear milestone path from dose finding to pivotal design to regulatory submission. That is a much stronger maturity signal than many venture-stage biotech assets can show. But maturity is uneven. The source set reveals a lot about clinical design and very little about manufacturing, release testing, commercial pharmacovigilance operations, or scaled launch support. That means a report can score the clinical-development machine as advanced while still treating operations and quality readiness as under-disclosed. The gap is not fatal, but it is material because once a program shifts from trial execution to commercialization, the missing details become some of the most important product risks.
  claimRefs:
  - CE009
  - CE010
  - CE014
  - CE015
  - CE023
  - CE032
  - CE033
  - CE036
