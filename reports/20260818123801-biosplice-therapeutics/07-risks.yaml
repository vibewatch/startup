- id: partner-customer-financial
  title: Partner, customer-access, and financing risks can compound each other
  body: Biosplice's partner structure helps and hurts. Haisco and Samil reduce the loneliness of the commercialization story by showing that external counterparties will sign up for the asset. They also create concentration because there are only a few named partners and because the customer story is still pre-commercial. If those partners underperform or if payer access is weak, the visible monetization lanes narrow quickly. Financial opacity amplifies this risk. Form D activity and financing announcements show repeated access to capital, but they do not reveal current cash, burn, or runway. The weakly supported 2026 retail-raise narrative adds noise rather than clarity. Put together, partner dependence, payer-access uncertainty, and financing opacity are not separate problems; they can reinforce one another if approval timing or launch traction disappoints.
  claimRefs:
  - CR013
  - CR015
  - CR016
  - CR017
  - CR018
  - CR019
  - CR025
  - CR026
  - CR027
  - CR028
  - CR034
