company:
  name: Biosplice Therapeutics
chapter:
  number: 7
  title: Risks
  summary: 'Biosplice''s residual risk stack is concentrated and typical of late-stage biotech: approval, label, payer access, and cash-opacity risks are first order, while partner concentration and operational opacity amplify the downside if timelines slip. The public record supports real upside but leaves too many launch-critical systems under-disclosed to treat the thesis as de-risked.'
sections:
- id: regulatory-legal
  title: Regulatory and legal risks dominate the current stack
  body: The dominant risks around Biosplice are still regulatory and evidence-related. Lorecivivint has reached NDA review, which is a major achievement, but that stage also concentrates attention on every remaining weakness in the clinical package. Mixed phase 3 outcomes, a documented OA-21 primary-endpoint miss, and an external meta-analysis that is more cautious than company-authored messaging all reinforce that approval is not a formality. On the legal side, public patent assignment records show that Biosplice has meaningful IP assets, but they do not answer enforceability, expiry, or freedom-to-operate questions. More unusually, the apparent absence of working public terms and privacy pages creates a minor but noteworthy governance gap. None of these legal items outrank the approval question, but they belong in the diligence stack because they speak to readiness and external transparency for investors and counterparties. They also help frame where legal diligence should stop relying
    on surface-level web evidence and move into counsel-led document review.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR008
  - CR009
  - CR010
  - CR011
  - CR024
  - CR025
  - CR031
  - CR039
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: operational
  title: Operational risk is about opaque commercialization systems, not trial execution ability
  body: 'Public evidence supports Biosplice''s ability to run sophisticated multicenter studies and maintain external scientific engagement. That is the company''s clearest operational strength. The problem is that this strength covers development, not necessarily launch. The retained source set does not make manufacturing, CMC, pharmacovigilance, supply chain, or field-support readiness legible. For a late-stage biotech, that omission is material because success after approval depends on systems that are mostly invisible from public materials. The operational risk is therefore asymmetric: the company appears strong enough to get to the decision point, but the same public record does not prove it is ready to commercialize at scale. This is why approval alone cannot clear the full risk stack. The right next diligence step is to inspect the hidden operating machinery, not to keep debating market size. In practical terms, the biggest operational question is whether the company has already done
    the unglamorous work needed for a controlled commercial launch.'
  claimRefs:
  - CR012
  - CR020
  - CR021
  - CR022
  - CR032
  - CR036
  - CR037
  tableRefs:
  - TR002
  figureRefs:
