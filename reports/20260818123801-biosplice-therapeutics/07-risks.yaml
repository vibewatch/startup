  figureRefs:
  - FR003
- id: residual-exposure
  title: Residual exposure remains high until approval, access, and liquidity are all clearer
  body: The right residual-risk view is still conservative. Approval risk is first order, but it is not the only first-order item. Access and pricing readiness are nearly as important because a weak label or slow reimbursement can hollow out the value of an approved drug. Cash-opacity risk is also first order because it determines how much time the company has to absorb delays. Portfolio issues such as the terminated SM08502 study and the limited relevance of oncology institutional proof to OA launch do not dominate the thesis, but they matter because they shape management focus and optionality. The net result is that Biosplice should be judged as a company with real scientific and strategic upside but a concentrated and under-disclosed execution stack. That is exactly the kind of case where clear kill criteria and specific diligence asks matter more than broad enthusiasm. It is precisely the kind of situation where a single unexpected delay can cascade through financing, access, and partner
    confidence all at once systemwide severely.
  claimRefs:
  - CR006
  - CR007
  - CR014
