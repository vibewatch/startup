- id: market-gaps
  title: What the market chapter can and cannot settle from public evidence
  body: This chapter can settle market boundary, prevalence order of magnitude, incumbent care pathways, likely buyer-user-payer structure, and the reason the opportunity is interesting despite long development timelines. It cannot settle a clean annual dollar SAM, payer willingness to reimburse a premium disease-modifying OA therapy, or real-world physician adoption curves post-approval. Those are not minor omissions; they are the main variables that convert a clinically credible market into a valuable one. As a result, later financial and valuation chapters should reuse the prevalence-led market logic but avoid false precision on near-term revenue or penetration. The correct diligence posture is to treat the knee-OA market as large, clinically painful, and strategically under-served, while preserving specific asks on pricing, coverage, launch sequencing, and specialty adoption.
  claimRefs:
  - CM023
  - CM024
  - CM029
