  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sam-dollar-sizing
    missingEvidence: A public or management-verified pricing-and-penetration model that converts prevalence into a defendable annual SAM/SOM in dollars.
    whyItMatters: Valuation and adoption timing can be overstated if prevalence counts are mistaken for revenue opportunity.
    diligencePath: Request management pricing assumptions, treated-patient penetration model, and payer access plan.
    relatedQuestionRefs:
    - QM021
  - type: private-evidence-only
    severity: material
    topic: payer-willingness
    missingEvidence: Any payer research, HEOR dossier, or coverage-development plan showing willingness to reimburse a novel DMOAD premium.
    whyItMatters: Payer friction could delay the market even after approval.
    diligencePath: Request HEOR models, payer interviews, and pre-launch market-access work.
    relatedQuestionRefs:
    - QM022
  - type: private-evidence-only
    severity: material
    topic: physician-adoption
    missingEvidence: KOL survey data, target-account list, and expected injector-specialty mix.
    whyItMatters: Adoption depends on specialty workflow fit, referral patterns, and comfort with repeat injections.
    diligencePath: Request commercial planning deck and physician research.
    relatedQuestionRefs:
    - QM023
  - type: conflicting-data
    severity: minor
    topic: market-estimate-conflict
    missingEvidence: Reconciled view of how prevalence-led sizing differs from generic analyst TAMs for OA therapeutics.
    whyItMatters: Different market definitions can create false precision in downstream valuation models.
    diligencePath: Preserve both sizing paths and ask management to define included spend explicitly.
    relatedQuestionRefs:
    - QM024
  - type: missing-source
    severity: minor
    topic: adoption-timing
    missingEvidence: Launch-sequencing assumptions by segment, payer, and region.
    whyItMatters: Without adoption-timing detail the chapter can describe the market but not confidently time penetration.
    diligencePath: Request launch plan, target-account prioritization, and post-approval evidence-generation plan.
    relatedQuestionRefs:
    - QM025
