- id: buyer-user-payer
  title: Buyer, user, and payer map
  body: The economic and clinical decision chain for lorecivivint is multilayered. The patient bears the disease burden, but the clinician is the operational user who diagnoses stage, decides on injection appropriateness, and performs administration. Health systems and insurers are the economic gatekeepers because guideline placement and reimbursement shape whether a novel injectable therapy becomes standard practice or remains restricted. This matters because Biosplice is not launching a self-administered retail drug; it is pursuing a specialist-delivered procedure-like product that must fit orthopedics, rheumatology, and sports-medicine workflows. The most commercially attractive patients appear to be earlier-stage knee-OA patients who still have enough joint structure to justify a disease-modification argument and who want to delay surgery. But public sources do not yet prove how quickly physicians would adopt a once- or twice-yearly injection or how payers would underwrite a premium
    versus incumbent symptom-focused injections.
  claimRefs:
  - CM015
  - CM016
  - CM025
  - CM026
  - CM031
  - CM033
  - CM036
