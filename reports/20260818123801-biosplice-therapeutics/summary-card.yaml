  topStrengths:
    - >-
      Lorecivivint reached NDA filing in January 2026, giving Biosplice a real late-stage asset rather than a purely
      preclinical platform story.
    - >-
      Historical financing access was exceptional, including the widely reported 2018 $438M round and the disclosed
      $120M 2021 financing.
    - Haisco and Samil regional licensing deals provide real external willingness-to-pay signals for lorecivivint.
    - >-
      The broader platform still shows oncology and legacy pipeline optionality that can matter if the lead asset
      de-risks.
  topRisks:
    - >-
      Current valuation support is stale and indirect; reviewed tracker pages do not substitute for a fresh priced round
      or signed term sheet.
    - >-
      Public sources do not disclose current cash, burn, runway, preference stack, or option-pool terms, blocking clean
      entry underwriting.
    - >-
      Mixed OA evidence, reimbursement uncertainty, and launch-readiness opacity mean NDA filing does not equal
      commercial de-risking.
    - The 2026 retail-raise narrative is weakly supported and should not be used as a capitalization backstop.
  unresolvedGaps:
    - Current post-money valuation, cap-table ownership, liquidation preferences, and board rights are not public.
    - Cash on hand, burn, runway, and downside financing plan remain undisclosed.
    - Pricing, reimbursement, and market-access assumptions for lorecivivint are still missing.
    - Realized partner economics, milestone receipts, and commercialization-readiness evidence are not public.
