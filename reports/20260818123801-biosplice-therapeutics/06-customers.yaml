  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: commercial-patient-count
    missingEvidence: Active treated commercial patients, payer-covered accounts, and prescriber count after launch.
    whyItMatters: These are the core customer metrics once a therapy transitions from clinical proof to commercialization.
    diligencePath: Request launch tracker, active account list, and payer-coverage dashboard once available.
    relatedQuestionRefs:
    - QU022
    - QU024
    - QU025
  - type: private-evidence-only
    severity: material
    topic: partner-retention
    missingEvidence: Contract renewal, expansion, amendment, and realized-payment history for Haisco and Samil.
    whyItMatters: Partner quality cannot be judged from headline press releases alone.
    diligencePath: Request executed agreements, amendment history, and payment receipts.
    relatedQuestionRefs:
    - QU011
    - QU021
    - QU024
    - QU025
  - type: missing-source
    severity: material
    topic: payer-proof
    missingEvidence: Executed payer coverage or provider-adoption proof beyond trials and partner announcements.
    whyItMatters: The final customer chain depends on prescribers and payers, not only licensees.
    diligencePath: Request market-access plan, advisory-board outputs, and payer-pre-readout materials.
    relatedQuestionRefs:
    - QU019
    - QU024
    - QU025
  - type: conflicting-data
    severity: medium
    topic: patient-benefit-strength
    missingEvidence: Published and meta-analytic evidence is mixed on the strength and consistency of patient benefit.
    whyItMatters: Customer satisfaction and long-term adoption will depend on whether trial signals translate clearly into practice.
    diligencePath: Review full NDA data package, subgroup persistence, and external physician feedback.
    relatedQuestionRefs:
    - QU009
    - QU010
    - QU023
  - type: private-evidence-only
    severity: medium
    topic: concentration-dashboard
    missingEvidence: Internal segmentation by geography, partner contribution, and expected revenue concentration.
    whyItMatters: Current public evidence clearly suggests concentration but cannot quantify it precisely.
    diligencePath: Request concentration tables by geography, partner, and program.
    relatedQuestionRefs:
