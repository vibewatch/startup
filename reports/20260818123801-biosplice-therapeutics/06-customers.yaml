- id: retention-and-concentration
  title: Retention is mostly a gap; concentration is clearly high
  body: Public retention evidence is weak. There are no disclosed NRR, GRR, churn, contract-renewal, or reorder metrics. Trial follow-up and repeat-dosing designs are useful only as indirect proxies because they capture protocolized engagement rather than true customer willingness to repurchase. By contrast, concentration risk is easy to see. The visible ex-US partner story is concentrated in a small number of named counterparties, and the overall customer narrative is concentrated around one lead OA asset. This does not make the company unattractive, but it makes the customer base under-diversified from a diligence perspective. If approval lands, a small number of partner and payer decisions could matter disproportionately. Until then, the right analytic move is to keep most retention fields null and emphasize concentration, stakeholder type, and next-proof milestones instead.
  claimRefs:
  - CU018
  - CU019
