- id: verdict
  title: 'Customer verdict: real stakeholder pull, limited commercial visibility'
  body: 'Biosplice has stronger customer-style evidence than a raw preclinical story, but weaker evidence than a launched commercial company. The partner side is real and named. The patient and investigator side is real and tied to registered studies and publications. Institutional proof extends even to NCI-sponsored work in oncology. What is missing is the full commercial layer: executed payer coverage, active treated commercial patients, repeat purchasing, satisfaction outside trials, and expansion dynamics. The result is a nuanced but coherent verdict. Biosplice appears able to attract serious stakeholders around its lead programs, and that is valuable. It does not yet provide enough public proof to claim a diversified, durable, measurable customer base. That gap should shape later risk and valuation judgments more than the presence of partner logos alone.'
  claimRefs:
  - CU015
