- id: partner-proof
  title: Named partner proof is the strongest commercialization evidence
  body: 'Haisco and Samil are the clearest named counterparts in the retained source set. Their agreements matter because they tie lorecivivint to specific geographies and give outside readers something more concrete than a logo wall or a generic business-development claim. Haisco covers China and Samil covers Korea; multiple retained sources corroborate each relationship. This is meaningful evidence that third parties were willing to commit to the asset. At the same time, these deals are still not the same as a mature customer base. They do not prove recurring revenue, renewal rates, or expansion dynamics, and they concentrate the visible partner story into a small number of counterparties. The financial terms are headline values, not proof of realized receipts. So the customer conclusion should be balanced: these relationships show real commercial interest and external validation, but the resulting customer base is narrow and still highly contingent.'
  claimRefs:
  - CU002
  - CU003
  - CU004
  - CU005
  - CU020
  - CU023
  - CU033
  figureRefs: []
- id: patient-and-site-proof
  title: Patient and site proof is real, but still clinical rather than commercial
  body: The strongest end-user evidence comes from registered trials and post hoc published analyses. Large multicenter OA studies, hundreds of enrolled participants, and named investigators all show that Biosplice can recruit, run, and analyze the program at meaningful scale. The PMC post hoc analysis provides the cleanest patient-level evidence in the retained set, showing a greater likelihood of clinically meaningful pain and function responses in the active-treatment arm. But the customer chapter has to preserve the adverse side too. The placebo-versus-sham analysis reminds readers that intra-articular OA trials can show large control-arm response effects, and the 2026 meta-analysis is more cautious than pure company-authored materials. These are exactly the kinds of nuances that matter when translating clinical enthusiasm into future customer behavior. In short, the evidence supports stakeholder engagement and user interest, but it does not yet prove commercial adoption quality.
  claimRefs:
