  topStrengths:
    - Lorecivivint 已在 2026 年 1 月提交 NDA，Biosplice 手里有真实的后期资产，而不是纯临床前平台故事。
    - 历史融资能力很强，包括外界广泛报道的 2018 年 $438M 融资，以及披露的 2021 年 $120M 融资。
    - Haisco 和 Samil 的区域授权交易，为 lorecivivint 提供了真实的外部付费意愿信号。
    - 更大的平台仍保留肿瘤学和历史管线期权；若核心资产降险，期权价值可能显现。
  topRisks:
    - 当前估值支撑陈旧且间接；已审阅的追踪页面无法替代最新定价轮或已签 term sheet。
    - 公开来源没有披露当前现金、烧钱速度、现金跑道、优先股堆叠或期权池条款，无法干净承保入场。
    - OA 证据混杂，报销路径不确定，上市准备透明度不足；提交 NDA 不等于商业风险已降下来。
    - 2026 年面向散户融资的叙事支撑较弱，不应当作资本化兜底。
  unresolvedGaps:
    - 当前 post-money 估值、股权结构所有权、清算优先权和董事会权利均未公开。
    - 账上现金、烧钱速度、现金跑道和下行融资计划仍未披露。
    - Lorecivivint 的定价、报销和市场准入假设仍缺失。
    - 已实现的合作伙伴经济性、里程碑回款和商业化准备证据均未公开。
