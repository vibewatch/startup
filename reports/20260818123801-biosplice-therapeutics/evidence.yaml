evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Current product revenue, collaboration revenue recognition, and any service or milestone revenue schedule.
    whyItMatters: >-
      Without revenue disclosure the overview cannot populate revenue-run-rate or customer metrics and later financial
      judgments remain range-bound.
    diligencePath: Request audited financial statements, management reporting package, and any milestone-revenue waterfall.
    relatedQuestionRefs:
      - QO021
  - type: missing-source
    severity: material
    topic: headcount-footprint
    missingEvidence: Current total employee count and any active offices or lab footprint beyond the San Diego headquarters.
    whyItMatters: Scale signals inform burn expectations, execution capacity, and whether public tracker numbers are stale.
    diligencePath: Request current org chart, payroll headcount by site, and facility list.
    relatedQuestionRefs:
      - QO022
  - type: conflicting-data
    severity: material
    topic: retail-fundraising
    missingEvidence: >-
      Primary evidence confirming or disproving the reported 2026 retail-investor raise amount, structure, and
      settlement status.
    whyItMatters: >-
      Capital-adequacy and valuation conclusions change materially if hundreds of millions of fresh capital were
      actually raised.
    diligencePath: >-
      Request capitalization table updates, placement documents, broker-dealer records, and board approvals tied to any
      2026 financing.
    relatedQuestionRefs:
      - QO013
      - QO023
  - type: missing-source
    severity: minor
    topic: debt-secondary
    missingEvidence: Any debt facility, venture loan, or organized secondary transaction terms for existing investors.
    whyItMatters: >-
      These instruments affect liquidation preference, dilution, and runway even when headline equity rounds are
      unchanged.
    diligencePath: Request debt schedules, side letters, and any secondary-transfer policy or broker records.
    relatedQuestionRefs:
      - QO024
  - type: private-evidence-only
    severity: material
    topic: overview-completeness
    missingEvidence: Board-approved current cap table, preference stack, and management KPI pack.
    whyItMatters: >-
      These materials would reconcile stale public valuation anchors with current operating reality and close multiple
      unresolved overview questions.
    diligencePath: Request the latest board deck, cap table, and financing history appendix.
    relatedQuestionRefs:
      - QO025
  - type: missing-source
    severity: material
    topic: sam-dollar-sizing
    missingEvidence: >-
      A public or management-verified pricing-and-penetration model that converts prevalence into a defendable annual
      SAM/SOM in dollars.
    whyItMatters: Valuation and adoption timing can be overstated if prevalence counts are mistaken for revenue opportunity.
    diligencePath: Request management pricing assumptions, treated-patient penetration model, and payer access plan.
    relatedQuestionRefs:
      - QM021
  - type: private-evidence-only
    severity: material
    topic: payer-willingness
    missingEvidence: >-
      Any payer research, HEOR dossier, or coverage-development plan showing willingness to reimburse a novel DMOAD
      premium.
    whyItMatters: Payer friction could delay the market even after approval.
    diligencePath: Request HEOR models, payer interviews, and pre-launch market-access work.
    relatedQuestionRefs:
      - QM022
  - type: private-evidence-only
    severity: material
    topic: physician-adoption
    missingEvidence: KOL survey data, target-account list, and expected injector-specialty mix.
    whyItMatters: Adoption depends on specialty workflow fit, referral patterns, and comfort with repeat injections.
    diligencePath: Request commercial planning deck and physician research.
    relatedQuestionRefs:
      - QM023
  - type: conflicting-data
    severity: minor
    topic: market-estimate-conflict
    missingEvidence: Reconciled view of how prevalence-led sizing differs from generic analyst TAMs for OA therapeutics.
    whyItMatters: Different market definitions can create false precision in downstream valuation models.
    diligencePath: Preserve both sizing paths and ask management to define included spend explicitly.
    relatedQuestionRefs:
      - QM024
  - type: missing-source
    severity: minor
    topic: adoption-timing
    missingEvidence: Launch-sequencing assumptions by segment, payer, and region.
    whyItMatters: Without adoption-timing detail the chapter can describe the market but not confidently time penetration.
    diligencePath: Request launch plan, target-account prioritization, and post-approval evidence-generation plan.
    relatedQuestionRefs:
      - QM025
  - type: missing-source
    severity: material
    topic: net-pricing
    missingEvidence: >-
      Reviewed public sources do not provide a reliable, comparable net-pricing dataset across incumbent injectables and
      lorecivivint.
    whyItMatters: >-
      Without comparable pricing and reimbursement economics, the chapter cannot rank competitors on value-for-money or
      undercutting risk with confidence.
    diligencePath: >-
      Request provider buy-and-bill economics, gross-to-net assumptions, and payer policy examples for incumbent
      products and Biosplice launch plans.
    relatedQuestionRefs:
      - QP021
  - type: missing-source
    severity: material
    topic: switching-shares
    missingEvidence: No retained source quantifies real-world physician switching or multi-homing shares across OA injectables.
    whyItMatters: >-
      Adoption-speed modeling depends on whether clinicians rotate among incumbent products or stay sticky to a
      preferred workflow.
    diligencePath: >-
      Request physician survey data, claims analysis, and any field-intelligence on prescribing concentration by
      practice type.
    relatedQuestionRefs:
      - QP025
  - type: conflicting-data
    severity: material
    topic: differentiation-strength
    missingEvidence: >-
      Biosplice's differentiation thesis is real, but mixed phase 3 pain outcomes conflict with a simple superiority
      story.
    whyItMatters: >-
      The product's competitive moat depends on whether subgroup or structural advantages are strong enough to overcome
      all-comer endpoint misses.
    diligencePath: Review full study reports, subgroup reproducibility, and payer/physician reactions to the final NDA data package.
    relatedQuestionRefs:
      - QP022
      - QP023
  - type: missing-source
    severity: medium
    topic: ip-durability
    missingEvidence: Public IP trackers are too thin to conclude on moat duration without primary patent review.
    whyItMatters: Durable exclusivity can matter if incumbents respond quickly after approval.
    diligencePath: Obtain primary patent family list, Orange Book status if any, and counsel review of composition and use claims.
    relatedQuestionRefs:
      - QP024
  - type: missing-source
    severity: medium
    topic: incumbent-contracting
    missingEvidence: Competitor pages reveal little about payer contracting, discounting, or provider-buy-and-bill economics.
    whyItMatters: Channel strength may depend more on contracting than on label text.
    diligencePath: >-
      Collect policy documents, specialty-distributor terms, and representative reimbursement workflows from target
      clinics.
    relatedQuestionRefs:
      - QP021
      - QP025
