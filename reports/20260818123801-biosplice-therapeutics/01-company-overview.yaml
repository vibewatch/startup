- id: leadership-governance
  title: Leadership, founder influence, and governance coverage
  body: Current management and board materials show a small but functionally complete leadership bench. Erich Horsley is the current chief executive officer, Osman Kibar remains founder and executive chairman, Yusuf Yazici leads medical strategy, Phil Wilson holds the CFO role, and Scott Bulcao covers legal. The board page adds investor-linked governance through Finian Tan of Vickers Venture Partners and Stephen Zachary of Sands Capital, plus Ahmed Khizer Khan and Simon Faure. That structure gives Biosplice visible coverage across strategy, medicine, finance, and legal affairs, but the public record also suggests notable key-person dependence. Kibar remains the founder identity attached to the company’s long-running biology thesis, Horsley appears repeatedly on commercial and financing materials, and Yazici is the most visible clinical spokesperson across osteoarthritis data releases. In other words, governance exists, but the public narrative is still concentrated in a small number of named
    executives and investors rather than a broad disclosed operating bench.
  claimRefs:
  - CO005
  - CO006
  - CO007
  - CO008
  - CO009
