- id: capital-history
  title: Capital history, investors, and valuation ambiguity
  body: 'The clearest disclosed financing event after the 2021 rebrand is the April 2021 $120 million equity financing, which the company tied directly to lorecivivint and a broader alternative-splicing platform agenda. SEC Form D filings in March 2021 and August 2022 corroborate that Biosplice remained in private fundraising mode after the rebrand, but the public filings do not by themselves provide a fresh market-clearing valuation. Instead, valuation context comes from third-party trackers. Dealroom still reflects a 2008-founded San Diego biotech with a legacy decacorn reputation, while Caplight, Seedtable, Tracxn, and private-market trading pages preserve historical funding-round references but do not surface a clean post-2021 repricing event in the public domain. This leaves investors with a stale mark problem: Biosplice still carries the memory of its 2018 $12 billion-era story, but the public evidence set is much stronger on financing chronology than on present fair value. The claimed
    2026 retail raise could change that view materially, but in the reviewed source set it remains low-confidence and unconfirmed by official company channels.'
  claimRefs:
