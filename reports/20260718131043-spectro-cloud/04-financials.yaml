        "FI001"
      ]
    },
    {
      "id": "traction-and-sales-proxies",
      "title": "Traction, GTM, and customer-scale proxies",
      "body": "Because Spectro Cloud does not publish revenue, investors have to infer economic quality from proxy evidence. The strongest single signal is Goldman Sachs' 2024 statement that the company achieved three consecutive years of triple-digit ARR growth. That does not reveal the ARR base, but it does suggest real expansion prior to the 2026 round. Customer stories strengthen the case that Spectro Cloud is selling into large, operationally complex environments: RapidAI says Palette supports deployments across thousands of hospitals, Yum! Brands says it spans 40,000 restaurant locations, and the Series D announcement says Spectro Cloud is involved in VM migration programs covering tens of thousands of virtual machines. Those are not revenue figures, but they do indicate the company is pitching into large estates where annual contract values can plausibly be meaningful. The GTM motion also looks enterprise-heavy. Management explicitly tied new capital to geographic sales expansion, while Carahsoft, Maximus, and Ericsson-related signals imply channel assistance in regulated and telecom markets. That combination points to a relatively expensive, field-driven selling model rather than a low-touch product-led engine.",
      "claimRefs": [
        "CI004",
        "CI012",
        "CI013",
        "CI014",
        "CI003",
        "CI009",
