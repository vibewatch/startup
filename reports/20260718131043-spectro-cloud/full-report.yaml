  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk is manageable but real
        blocks:
          - type: paragraph
            body: >-
              Spectro Cloud's public legal and compliance footprint is better than many private infrastructure startups,
              but it still creates meaningful diligence questions. The company can point to an active FIPS 140-3
              certificate, FedRAMP-related progress, and a public docs hub that references compliance, open-source
              licenses, partners, and security bulletins. That is helpful. It means management understands that
              regulated buyers need more than a generic security promise. At the same time, public legal surfaces carry
              the usual disclaimers: website content is not a warranty, disputes route to California, and export-control
              obligations apply. The privacy materials also show that Spectro Cloud collects technical business metadata
              from customers and operates cross-border data-transfer processes in some contexts. None of that is
              disqualifying, but it means the company is already operating inside a web of legal and regulatory
              obligations that will only become more demanding if government and international expansion keep growing.
              The mitigation is visible; the residual burden is also visible.
