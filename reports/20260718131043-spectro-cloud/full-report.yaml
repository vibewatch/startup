      - number: '2.2'
        title: Sizing lenses and adoption signals
        blocks:
          - type: paragraph
            body: >-
              Public sizing sources support a real market, but the numbers should be treated as lenses rather than a
              single canonical TAM. Mordor pegs the Kubernetes market at $2.57 billion in 2025 and $3.13 billion in
              2026, with an $8.41 billion outlook by 2031, while NextMSC also frames the category as a high-growth
              market over a longer horizon. Survey evidence explains why those forecasts are plausible. The Linux
              Foundation's 2024 CNCF survey found very broad cloud-native adoption, while the 2025 CNCF release put
              production Kubernetes use at 82% and explicitly framed Kubernetes as AI's de facto operating system.
              Gartner's public hyperscaler summaries reinforce the same direction by arguing container infrastructure
              will underpin most AI or ML deployments by 2027. Together, these sources support a growth market, but they
              also imply that the monetizable layer is the operational substrate around Kubernetes and AI workloads
              rather than the whole universe of digital infrastructure.
