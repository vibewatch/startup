      - number: '1.4'
        title: Underwriting caveats and what remains undisclosed
        blocks:
          - type: paragraph
            body: >-
              The most important caveat is that the company has upgraded the narrative faster than it has upgraded
              public financial disclosure. The Series D and PaletteAI announcements are strong on use cases, ecosystem
              breadth, and investor names, but they stop short of disclosing revenue, ARR, gross margin, current
              customer count, cash, or preference structure. AI Weekly's recap is valuable precisely because it makes
              the missing data explicit and warns that the $1 billion-plus mark is reported rather than independently
              cleared by a public market. That does not invalidate the round; it simply means later chapters need to
              treat valuation, economics, and customer durability with more caution than the headline suggests. For now
              the chapter-level conclusion is that Spectro Cloud has enough evidence to be treated as a real late-stage
              infrastructure company with authentic enterprise and government deployments, but not enough public
              transparency to treat its latest valuation as fully underwritten on fundamentals alone today externally.
