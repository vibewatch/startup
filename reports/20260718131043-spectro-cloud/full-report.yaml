      - number: '8.3'
        title: Comparables bound the valuation, but none lets investors avoid scenario work
        blocks:
          - type: paragraph
            body: >-
              The right way to think about Spectro Cloud today is with scenario discipline, not false precision. Nutanix
              offers a useful public infrastructure-software anchor because it trades on a visible revenue and EBITDA
              base at about 5.3x enterprise value to revenue. IBM's HashiCorp acquisition shows that infrastructure
              lifecycle automation can command strategic value far above commodity-software levels when the customer
              base, product breadth, and market relevance are broad enough. CoreWeave demonstrates a different kind of
              appetite: AI infrastructure can attract extraordinary capital, but direct infrastructure ownership is a
              far more capital-intensive model than Spectro Cloud appears to be. Platform9 is a reminder that private
              peer disclosures are thin and competition is active. Taken together, these comparables do not prove
              Spectro Cloud is overpriced. They show that the current round can be defended only under a reasonably
              strong software-style scenario. Because revenue is undisclosed, investors must instead ask what ARR level
              and what quality of growth would have to be true for the mark to make sense. That is why threshold math
              matters here.
