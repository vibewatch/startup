        - Private diligence shows ARR materially below roughly $100M-$125M
        - Current mark implies an overly rich multiple on public-comp discipline
        - Move toward avoid or require substantial reprice.
      - - AI product contribution is too small
        - PaletteAI is still immaterial to revenue or expansion
        - AI-era narrative is ahead of economic reality
        - Downgrade confidence and treat current mark as narrative-heavy.
      - - Services burden is too high
        - Gross margin or support intensity looks closer to infrastructure enablement than premium software
        - Valuation should compress toward lower public precedents
        - Re-underwrite with lower multiples and higher risk.
      - - Public comp compression continues
        - Infrastructure-software and AI-platform comps rerate downward materially
        - Even good execution may no longer justify current entry price
        - Stay out unless price resets.
      - - Cap-table economics are worse than headline suggests
        - Preferences, participation, or tender terms reduce common-equity value
        - Headline valuation overstates investor economics
        - Pause until waterfall is fully understood.
    notes: Kill triggers are framed around measurable underwriting failures rather than general market anxiety.
    claimRefs:
      - CV045
      - CV046
      - CV041
      - CV036
      - CV047
  - id: TV006
    title: Final diligence asks table
    columns:
      - topic
      - missing evidence
      - why it matters
      - owner or diligence path
    rows:
      - - ARR and revenue bridge
        - Current ARR, GAAP revenue, growth rate, and product mix including PaletteAI
        - Without the denominator, the headline valuation cannot be tested.
        - Request CFO bridge and board KPI pack.
      - - Margin and services mix
        - Gross margin, implementation burden, support attach, and any services revenue
        - Determines whether Spectro deserves a premium software or lower infrastructure-enablement multiple.
        - Request product-family P&L and services attachment data.
      - - Retention and concentration
        - NRR, GRR, logo churn, and top-customer exposure
        - Premium late-stage valuation requires durable revenue quality.
        - Request cohort analysis and concentration schedule.
      - - Cap table and preferences
        - Liquidation stack, participation, ratchets, and any tender mechanics
        - Headline valuation can diverge sharply from true common-equity economics.
        - Review financing docs and waterfall model.
      - - AI-specific proof
        - PaletteAI customer count, deployment size, utilization impact, and realized pricing
        - The new AI narrative must carry real economic weight to justify the repricing.
        - Request product-level bookings and large-customer case studies.
    notes: >-
      These are the minimum diligence items needed to move from a public-evidence view to an actual investment committee
      underwriting call.
    claimRefs:
      - CV010
      - CV042
      - CV041
      - CV045
      - CV047
