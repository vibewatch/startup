              AI infrastructure-control-plane layer, public materials expose at least one usage-linked pricing axis
              through PaletteAI's per-GPU model, and the company can point to named customers and partner validation
              that most private infrastructure startups would love to have. Three consecutive years of triple-digit ARR
              growth, if still directionally relevant, imply real momentum. The anti-thesis matters just as much. The
              current round gives no public revenue denominator, no margin proof, no net-retention data, and no clear
              way to separate high-value software from any support-heavy delivery burden. AI Weekly's warning is
              therefore important: a financing valuation is not the same thing as a public-market-clearing price. The
              burden is now on management to show that the AI-era narrative is already converting into a business large
              and efficient enough to deserve a premium multiple at this mark.
            claimRefs:
