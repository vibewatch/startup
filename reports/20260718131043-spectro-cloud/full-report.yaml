      - number: '4.3'
        title: Cost structure and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              The company's cost structure likely sits between classic SaaS and heavier infrastructure delivery. Spectro
              Cloud is not financing hardware on its own balance sheet, which helps relative capital intensity, but it
              is supporting air-gapped, edge, regulated, and public-sector deployments that tend to increase
              implementation and support complexity. Public documentation on edge deployment references registration
              tokens, provider-image creation, registry permissions, and vCenter connectivity, all of which suggest
              customer onboarding and solution-engineering work that a lighter self-serve cloud product would not face.
              Likewise, PaletteAI Secure and VerteX emphasize FIPS, 24x7 support, and regulated operations, which likely
              raise support and compliance costs. On capital adequacy, the July 2026 round plainly improves flexibility
              because it added more than $100 million of fresh capital and named concrete use cases for that money. But
              the company still does not disclose cash on hand, burn, debt, or runway. Investors can therefore conclude
              that financing pressure has eased in the near term, yet they still cannot quantify how long the current
              capital base will last under different growth plans.
