          - type: figure
            figureRef: FP003
            claimRefs:
              - CP028
              - CP017
              - CP034
              - CP035
      - number: '3.4'
        title: Scale references and evidence gaps
        blocks:
          - type: paragraph
            body: >-
              Public comp data helps frame strategic value but not decisive ranking. Platform9's $100 million funding
              history shows Spectro Cloud is not alone in attracting infrastructure capital, while IBM's $6.4 billion
              HashiCorp acquisition demonstrates that automation-control layers can command meaningful strategic
              outcomes. Nutanix provides a public trading benchmark for adjacent infrastructure software, but it is
              broader than Kubernetes management and therefore only loosely comparable. The harder problem is missing
              public win-loss evidence. There is no clean dataset showing Spectro Cloud's realized pricing, renewal
              outcomes, or consistent competitive wins versus each major rival. That means the current assessment should
              treat the company's differentiation as plausible and increasingly relevant, but still only partly proven
              in public. Buyers and investors should demand direct bake-off evidence before assuming Spectro Cloud has
              already achieved durable category leadership. Until then, competitor analysis should stay
              probability-weighted rather than categorical, and every claimed moat should be tested against recent deal
              evidence and replacement risk.
            claimRefs:
              - CP003
              - CP020
              - CP021
              - CP022
              - CP023
              - CP024
              - CP035
              - CP036
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The hardest competitor is often the default cloud service
            body: >-
              Spectro Cloud wins when the buyer needs one operating model across many environments; it loses relevance
              fastest when the workload can stay comfortably inside a single hyperscaler.
            calloutType: insight
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP027
          - type: callout
            title: AI can widen Spectro's wedge or erase it
            body: >-
              AI infrastructure complexity makes cross-environment governance more valuable, but it also gives AI-native
              operators and packaged software stacks a chance to capture the budget directly.
            calloutType: risk
            claimRefs:
