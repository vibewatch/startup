      - number: '2.4'
        title: Constraints, cost pressure, and why TAM can be overstated
        blocks:
          - type: paragraph
            body: >-
              The strongest counterweight to the growth story is cost and maturity. Spectro Cloud's 2025
              production-Kubernetes report says cost has overtaken skills and security as the top pain point, with 88%
              seeing rising total Kubernetes TCO. The edge-AI research is similarly sobering: most organizations have
              been working on edge AI for only a short period, and just 11% have reached full-scale production. Even the
              neocloud opportunity comes with margin warnings, because Spectro Cloud's own article cites McKinsey
              estimating only mid-teens gross margins for pure GPU-rental models. Those figures do not negate the
              market; they narrow it. They imply that buyers will pay not for generic orchestration, but for control
              planes that lower complexity, improve utilization, and support heterogeneous deployment rules. That is
              favorable to Spectro Cloud's thesis, but it is also why generic AI-infrastructure TAM slides should be
              treated as marketing, not underwriting or diligence shortcuts. In practice, the winning products will need
              to prove measurable operational ROI before budgets expand broadly.
            claimRefs:
