  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and included spend
        blocks:
          - type: paragraph
            body: >-
              Spectro Cloud does not compete for all cloud or all AI infrastructure spend. The real market boundary sits
              around operating-control software for Kubernetes fleets, edge estates, and GPU-backed AI environments that
              need consistent governance across multiple domains. That means the addressable layer includes control
              planes, lifecycle tooling, workload templates, policy, and operations automation; it does not include
              every dollar of hyperscaler IaaS, all AI-model spending, or the full value of raw GPU rental. This
              distinction matters because the company is closer to infrastructure software and platform operations than
              to bare-metal cloud capacity. Adjacent markets such as VMware migration, AI clouds, and managed Kubernetes
              services can create demand, but they also compete for budget. An investable market view therefore has to
              strip out broad cloud headlines and focus on the subset of spending where multi-environment complexity,
              compliance, and lifecycle management are the actual pain points.
            claimRefs:
              - CM034
              - CM035
