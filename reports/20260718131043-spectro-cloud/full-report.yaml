  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape segmentation and the real competitor set
        blocks:
          - type: paragraph
            body: >-
              The buyer does not compare Spectro Cloud against one neat peer group. In practice the landscape includes
              direct multi-cluster and lifecycle managers such as Platform9 and Rancher, broader enterprise application
              platforms like OpenShift and Tanzu, hyperscaler-managed Kubernetes services such as EKS, AKS, and GKE, and
              adjacent AI-infrastructure operators like CoreWeave or NVIDIA's software stack. These categories compete
              for the same budget in different ways. Some promise simplicity inside one cloud. Others sell platform
              breadth, VM convergence, or AI packaging. Spectro Cloud's challenge is therefore not merely to be a better
              cluster manager; it is to persuade buyers that cross-environment consistency and Day-2 governance deserve
              a dedicated control plane. That is most persuasive in regulated, edge, or heterogeneous estates, and least
              persuasive when the customer is comfortable living natively inside one hyperscaler. The result is a market
              where the same RFP can contain direct, indirect, and substitute competitors simultaneously, often with
              different internal champions backing each option.
            claimRefs:
              - CP026
              - CP002
              - CP004
              - CP007
              - CP009
              - CP010
              - CP011
              - CP014
              - CP037
