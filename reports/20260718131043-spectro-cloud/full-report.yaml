  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization shape and what is actually public
        blocks:
          - type: paragraph
            body: >-
              Spectro Cloud's public materials give a coherent but incomplete monetization picture. The company is
              clearly selling platform software for Kubernetes and AI infrastructure management, not a one-off
              consulting engagement. Palette documentation positions the core product as a repeatable full-stack
              lifecycle layer for clusters across cloud, data center, and edge environments, while PaletteAI adds a
              second monetization surface aimed at production AI infrastructure. The most concrete pricing disclosure is
              that PaletteAI uses a flat fee per GPU managed and includes technical support. That is useful because it
              shows Spectro Cloud has at least one usage-linked pricing axis tied to managed infrastructure scale rather
              than pure seat count. At the same time, the company has not disclosed realized pricing, volume tiers, or
              average contract size. The public record therefore supports the shape of revenue streams, but not the
              yield of those streams. It also hints at mixed deployment models, because Palette VerteX is offered in
              SaaS and self-hosted forms, which can change hosting costs, support obligations, and the accounting
              treatment of contracts.
