companyProfile:
  summary: >-
    Spectro Cloud is a San Jose-based private infrastructure-software company founded in 2019 by Tenry Fu and Saad
    Malik. Public evidence shows the company evolving from full-lifecycle Kubernetes management into a broader AI
    infrastructure control-plane story through Palette and PaletteAI, with support for data center, cloud, edge,
    regulated, and air-gapped environments. By July 2026, Spectro Cloud had raised more than $100 million in a Series D,
    reached $260 million of total capital raised, and was reported at a valuation above $1 billion. The company looks
    strategically relevant in AI-era platform operations, but it remains private and under-disclosed on the financial
    and capital-structure details investors need to fully underwrite the current price.
