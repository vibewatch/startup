      - number: '3.3'
        title: Moat durability and commoditization pressure
        blocks:
          - type: paragraph
            body: >-
              The moat is real but conditional. Spectro Cloud's documentation and positioning make a stronger case for
              Day-2 operations, cross-environment governance, and regulated deployment breadth than a generic
              managed-Kubernetes service can. Yet the category is still vulnerable to commoditization because
              hyperscalers now offer managed control planes by default and buyers can often get far with native services
              before they feel serious pain. The open-versus-closed ecosystem fight described by Forrester adds another
              layer: buyers may prefer open control over stacks and silicon while still demanding highly packaged AI
              experiences. That tension is exactly where Spectro Cloud wants to sit. The risk is that AI-native vendors
              or broader platforms package enough governance and GPU management to collapse the independent
              control-plane wedge before it scales into a category of its own. Winning therefore depends on proving
              better outcomes, not merely better architecture language.
            claimRefs:
              - CP016
              - CP031
              - CP030
              - CP029
              - CP034
              - CP028
              - CP017
          - type: table
            tableRef: TP004
            claimRefs:
