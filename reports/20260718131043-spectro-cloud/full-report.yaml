  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What Spectro Cloud actually delivers
        blocks:
          - type: paragraph
            body: >-
              At its core, Spectro Cloud sells an infrastructure control plane rather than a single Kubernetes
              distribution. Palette is described as the layer that standardizes how full-stack clusters are defined,
              deployed, updated, and governed across multiple environments. That matters because the product is not only
              provisioning Kubernetes; it is packaging operating-system choices, networking, storage, add-on services,
              governance policies, and lifecycle actions into one repeatable model. The central abstraction is the
              Cluster Profile, which lets teams describe full-stack cluster intent and then reuse that intent across
              cloud, data-center, bare-metal, and edge deployments. PaletteAI extends the same operating model into
              GPU-backed and production AI environments. Public pages show a separation of roles in which platform teams
              create approved templates and policy boundaries while AI or application teams self-serve against those
              guardrails. In practice, Spectro Cloud is selling control, repeatability, and fleet operations for
              heterogeneous infrastructure rather than raw compute or developer notebooks.
