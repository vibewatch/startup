chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and platform positioning
        blocks:
          - type: paragraph
            body: >-
              Spectro Cloud's current identity is broader than a pure Kubernetes tooling startup. The company page,
              homepage, and Tenry Fu author profile all frame the business around managing full-stack application and AI
              infrastructure from edge to cloud and from metal to model. That positioning matters because it shifts the
              underwriting lens from cluster administration alone to a control-plane story spanning VMs, Kubernetes
              fleets, air-gapped environments, and now GPU-backed AI estates. Palette remains the base platform for
              lifecycle management and Day-2 consistency, while PaletteAI is the product that makes the AI reframe
              explicit. The combined message is that Spectro Cloud is trying to own the operational middle layer between
              raw infrastructure and production application or model delivery, especially where governance,
              repeatability, and heterogeneous environments matter more than developer self-service alone.
