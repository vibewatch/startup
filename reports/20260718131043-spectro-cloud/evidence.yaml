evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Current revenue, ARR, and gross-margin disclosure.
    whyItMatters: The late-stage valuation cannot be benchmarked cleanly without current software-economics data.
    diligencePath: Request board deck, latest monthly financials, and booked ARR bridge.
    relatedQuestionRefs:
      - QO021
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Post-Series D ownership, preference stack, and board-rights package.
    whyItMatters: Economic value and control are impossible to assess from headline financing alone.
    diligencePath: Obtain the latest cap table, investor-rights agreement, and any side letters.
    relatedQuestionRefs:
      - QO024
  - type: private-evidence-only
    severity: material
    topic: TO002 leadership coverage
    missingEvidence: Full executive biographies, tenure history, and succession depth for the named leadership team.
    whyItMatters: The public leadership table is partial and leaves key-person and succession risk underexplained.
    diligencePath: Request executive bios, tenure dates, and an org chart with succession coverage.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: TO003 investor map
    missingEvidence: A complete investor list, ownership percentages, and economic rights for all major stakeholders.
    whyItMatters: The stakeholder map is partial and does not reveal ownership concentration or control rights after the Series D.
    diligencePath: Request a post-close cap table and board-rights summary covering every preferred holder.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: TO004 milestone chronology
    missingEvidence: A full round-by-round and launch-by-launch operating chronology beyond the public highlights captured here.
    whyItMatters: >-
      The milestone table is necessarily partial and may miss intermediate product, hiring, or governance events that
      matter for underwriting.
    diligencePath: Request the internal company timeline used in board or fundraising materials.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: liquidity
    missingEvidence: Cash balance, burn, and expected runway after the Series D.
    whyItMatters: Capital adequacy affects both downside risk and the urgency of future financing.
    diligencePath: Review post-close cash waterfall, budget, and hiring plan.
    relatedQuestionRefs:
      - QO023
      - QO025
  - type: missing-source
    severity: material
    topic: sam-isolation
    missingEvidence: A clean public SAM or SOM for cross-environment Kubernetes and AI control planes.
    whyItMatters: Broad market pages overstate the slice Spectro Cloud can actually monetize.
    diligencePath: Build bottom-up SAM from cluster counts, regulated buyers, and average contract values.
    relatedQuestionRefs:
      - QM024
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: Win-loss and migration data showing how buyers move from hyperscaler-native tools to horizontal control planes.
    whyItMatters: Switching friction determines whether multi-environment complexity converts into software spend.
    diligencePath: Request recent competitive bake-off data and deployment migration timelines.
    relatedQuestionRefs:
      - QM025
  - type: private-evidence-only
    severity: minor
    topic: buyer-budget-data
    missingEvidence: Customer-level examples of who approved budgets and what ROI hurdle was used.
    whyItMatters: Budget-owner ambiguity can slow sales cycles even in a fast-growing market.
    diligencePath: Review top-customer deal sheets with economic buyers and ROI framing.
    relatedQuestionRefs:
      - QM023
  - type: private-evidence-only
    severity: material
    topic: win-loss
    missingEvidence: Actual bake-off results and renewal rationales against OpenShift, Rancher, and hyperscaler-native services.
    whyItMatters: Public positioning pages do not prove durable competitive advantage.
    diligencePath: Request the last 12 months of competitive win-loss data by segment.
    relatedQuestionRefs:
      - QP025
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Realized pricing, discounting, and expansion path versus major rivals.
    whyItMatters: Competitive strength can be offset by aggressive discounting or low attach rates.
