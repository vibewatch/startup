    {
      "id": "architecture-and-deployment",
      "title": "Architecture and deployment workflow",
      "body": "The public architecture story is unusually concrete. Palette supports cloud IaaS and managed Kubernetes services, data-center environments such as vSphere and Nutanix, Canonical MAAS for bare metal, and edge deployments with dedicated artifact creation workflows. Spectro Cloud's edge tutorial shows that deployment is a staged process: build or source installer artifacts, prepare Edge hosts, create cluster profiles, then roll out clusters and ongoing lifecycle policy. That is reinforced by the public CanvOS repository, which describes the build process for installer ISOs and Kubernetes provider images. The presence of a compatibility matrix linking CanvOS, Stylus, and Edge host versions suggests Spectro Cloud has a managed release discipline rather than a loose collection of scripts. The product therefore looks like an opinionated operating model that spans image preparation, cluster design, rollout, upgrades, and rollback. It is more sophisticated than a cluster installer, but it also means operational success depends on version discipline and ecosystem fit.",
      "claimRefs": [
        "CE005",
        "CE006",
        "CE007",
        "CE008",
        "CE024",
        "CE025",
