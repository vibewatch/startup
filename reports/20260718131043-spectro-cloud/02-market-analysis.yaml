  "chapter": {
    "number": 2,
    "title": "Market Analysis",
    "summary": "Spectro Cloud plays in a narrower market than generic AI or cloud headlines imply: the underwriteable layer is the control plane for Kubernetes fleets, edge estates, and GPU-backed AI environments that need governance across multiple infrastructure domains. Public surveys and analyst pages show real adoption and spending growth, but they also show rising total cost, multi-environment sprawl, and immature edge-AI production depth that should temper TAM inflation."
  },
  "sections": [
    {
      "id": "market-boundary",
      "title": "Market boundary and included spend",
      "body": "Spectro Cloud does not compete for all cloud or all AI infrastructure spend. The real market boundary sits around operating-control software for Kubernetes fleets, edge estates, and GPU-backed AI environments that need consistent governance across multiple domains. That means the addressable layer includes control planes, lifecycle tooling, workload templates, policy, and operations automation; it does not include every dollar of hyperscaler IaaS, all AI-model spending, or the full value of raw GPU rental. This distinction matters because the company is closer to infrastructure software and platform operations than to bare-metal cloud capacity. Adjacent markets such as VMware migration, AI clouds, and managed Kubernetes services can create demand, but they also compete for budget. An investable market view therefore has to strip out broad cloud headlines and focus on the subset of spending where multi-environment complexity, compliance, and lifecycle management are the actual pain points.",
      "claimRefs": [
        "CM034",
        "CM035",
        "CM036",
        "CM029",
        "CM038"
      ],
      "tableRefs": [
        "TM001"
      ],
      "figureRefs": [
        "FM001"
      ]
    },
    {
      "id": "sizing-and-adoption",
      "title": "Sizing lenses and adoption signals",
      "body": "Public sizing sources support a real market, but the numbers should be treated as lenses rather than a single canonical TAM. Mordor pegs the Kubernetes market at $2.57 billion in 2025 and $3.13 billion in 2026, with an $8.41 billion outlook by 2031, while NextMSC also frames the category as a high-growth market over a longer horizon. Survey evidence explains why those forecasts are plausible. The Linux Foundation's 2024 CNCF survey found very broad cloud-native adoption, while the 2025 CNCF release put production Kubernetes use at 82% and explicitly framed Kubernetes as AI's de facto operating system. Gartner's public hyperscaler summaries reinforce the same direction by arguing container infrastructure will underpin most AI or ML deployments by 2027. Together, these sources support a growth market, but they also imply that the monetizable layer is the operational substrate around Kubernetes and AI workloads rather than the whole universe of digital infrastructure.",
      "claimRefs": [
        "CM001",
        "CM002",
        "CM003",
        "CM004",
        "CM005",
        "CM006",
        "CM007",
        "CM008",
        "CM009"
