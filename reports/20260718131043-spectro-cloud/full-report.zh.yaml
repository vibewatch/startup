      - number: '3.2'
        title: 能力宽度与分发力量
        blocks:
          - type: paragraph
            body: >-
              能力重叠很高，但分发力量并不相同。超大规模云厂商受益于云预算里的默认位置、既有 IAM 和网络栈，以及买方在可能情况下留在原生环境的愿望。Red Hat 和 VMware
              受益于更宽的平台叙事和装机基础信任。SUSE Rancher 继续吸引那些想要混合平台、且更重视开放姿态的买方。Spectro Cloud 最强的角度，不是它是唯一能管理 Kubernetes
              的系统；而是它的运营模型在一层里覆盖 VM、Kubernetes 集群队列、隔离站点，以及现在的受治理 AI
              环境。当买方已经知道单云便利性不够时，这一点最重要；当工作负载边界清晰、云环境单一、采购只想走最短路径获得有支持的托管服务时，它的重要性会下降。为什么最大云厂商几乎在每个交易周期里仍是默认标杆，答案不只是产品，也是分发。
