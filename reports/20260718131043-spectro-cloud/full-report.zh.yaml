      - number: '6.2'
        title: 具名客户证据真实，但不均衡
        blocks:
          - type: paragraph
            body: >-
              最好的公开证据来自包含运营结果的客户故事。RapidAI 是最强的医疗案例，因为既有 Spectro Cloud 案例研究，也有客户侧公司页面显示 RapidAI 医院覆盖规模。GE HealthCare
              同样重要，因为 Spectro Cloud 声称取得了具体结果——不到四小时内升级超过 100 个集群且零停机——如果准确，GE 自身公司规模也让它成为高价值背书。Yum! Brands
              是最清楚的分布式边缘案例，公开引用了 40,000 家餐厅位置。政府证据也很重要：U.S. Air Force 出现在融资报道和第三方客户证据中，Carahsoft 和 Spectro Cloud 还描述了更广的
              Army、Navy 和 Air Force 使用情况。相比之下，T-Mobile 和 Airbus
              目前更像是高质量客户标识，而不是充分展开的公开案例研究。这不意味着它们是弱背书，但确实说明不同账户的证据质量差异很大。
