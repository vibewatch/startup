      - number: '3.4'
        title: 规模参照与证据缺口
        blocks:
          - type: paragraph
            body: >-
              公开可比数据能帮助框定战略价值，但不能给出决定性排名。Platform9 的 $100 million 融资历史显示，Spectro Cloud 并不是唯一吸引基础设施资本的公司；IBM 以 $6.4
              billion 收购 HashiCorp，则说明自动化控制层能够取得有意义的战略结果。Nutanix 为相邻基础设施软件提供了公开交易基准，但它比 Kubernetes
              管理更宽，因此只具备松散可比性。更难的问题是缺少公开赢输证据。没有干净数据集显示 Spectro Cloud
              的实际定价、续约结果，或相对每个主要竞争对手的稳定胜率。因此，当前评估应把公司的差异化视为可信且越来越相关，但在公开层面仍只部分得到证明。买方和投资者应要求直接的 正面对比测试证据，再假设 Spectro
              Cloud 已经取得持久类别领导地位。在此之前，竞争分析应保持概率加权，而不是下绝对判断；每一项护城河主张都应拿近期交易证据和替代风险来检验。
