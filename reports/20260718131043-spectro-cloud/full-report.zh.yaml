    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与平台定位
        blocks:
          - type: paragraph
            body: >-
              Spectro Cloud 现在的身份已经不只是单纯的 Kubernetes 工具创业公司。公司页面、官网和 Tenry Fu 作者页，都把业务框在从边缘到云、从裸金属到模型的全栈应用与 AI
              基础设施管理上。这个定位很关键，因为尽调视角会从单纯的集群管理，转向横跨 VM、Kubernetes 集群队列、隔离环境以及 GPU 驱动 AI 资产的控制平面。Palette 仍是生命周期管理和 Day-2
              一致性的基础平台，PaletteAI 则把 AI 重新定位讲得更明确。合在一起，Spectro Cloud
              想占据原始基础设施与生产应用或模型交付之间的运营中间层，尤其是在治理、可重复性和异构环境比单纯开发者自助更重要的场景。
