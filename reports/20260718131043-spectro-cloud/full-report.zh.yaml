  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局分层与真实竞争集
        blocks:
          - type: paragraph
            body: >-
              买方不会把 Spectro Cloud 拿来和一个整齐的同类组比较。实践中，竞争格局包括 Platform9、Rancher 等直接的多集群和生命周期管理厂商，OpenShift 和 Tanzu
              等更宽的企业应用平台，EKS、AKS、GKE 等超大规模云厂商托管 Kubernetes 服务，以及 CoreWeave 或 NVIDIA 软件栈等相邻 AI
              基础设施运营商。这些类别以不同方式争夺同一笔预算。有的承诺在单一云内化繁为简，有的出售平台宽度、VM 融合或 AI 打包。Spectro Cloud
              的挑战因此不只是做一个更好的集群管理器，而是说服买方相信，跨环境一致性和 Day-2
              治理值得一套专用控制平面。在受监管、边缘或异构资产中，这个论点最有说服力；当客户愿意原生留在单一超大规模云厂商里时，说服力最低。结果是，同一个 RFP
              里可能同时出现直接、间接和替代竞争对手，且常常由不同内部拥护者支持不同选项。
