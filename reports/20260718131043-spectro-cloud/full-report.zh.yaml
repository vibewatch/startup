      - number: '7.2'
        title: 运营与安全风险随覆盖面扩大
        blocks:
          - type: paragraph
            body: >-
              Spectro Cloud 的平台宽度是优势，也是风险放大器。公司试图管理公有云、托管 Kubernetes、虚拟化数据中心、裸金属、边缘设备、隔离环境，以及现在的生产 AI
              栈。需要验证、打补丁和支持的表面积很大。公开产品页面承诺小时级对账、自愈、零停机更新和丰富的 Day-2 运营，但没有公开状态历史或事故页面，让外部人评估这些承诺在现场是否稳定兑现。State of Edge
              AI 报告提供了重要的反向背景：分布式 AI 基础设施很脆弱，许多组织已经遭遇服务中断。Spectro Cloud
              来自医疗和其他任务关键环境的最强客户故事令人鼓舞，但也提高了下行严重性，因为这些环境里的可靠性失败，比随意开发者部署的失败更昂贵。风险不是 Spectro Cloud
              缺乏雄心，而是横跨太多环境的雄心可能跑在运营证明之前。
