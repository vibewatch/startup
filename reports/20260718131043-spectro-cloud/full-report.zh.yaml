            body: >-
              Spectro Cloud 的公开材料给出了连贯但不完整的变现图景。公司显然在销售 Kubernetes 和 AI 基础设施管理平台软件，而不是一次性咨询项目。Palette
              文档把核心产品定位为可重复的全栈生命周期层，覆盖云、数据中心和边缘环境中的集群；PaletteAI 则增加了面向生产 AI 基础设施的第二个变现表面。最具体的价格披露是，PaletteAI 按每块受管理 GPU
              收取固定费用，并包含技术支持。这个信息有用，因为它表明 Spectro Cloud
              至少有一条用量挂钩的定价轴，绑定的是受管理基础设施规模，而不是纯席位数。同时，公司没有披露实际成交价格、用量分层或平均合同规模。公开记录因此支持收入流的形态，但不支持这些收入流的产出率。它也暗示部署模型混合，因为
              Palette VerteX 提供 SaaS 和自托管形态，这会改变托管成本、支持义务和合同会计处理。
