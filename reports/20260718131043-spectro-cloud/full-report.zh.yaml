companyProfile:
  summary: >-
    Spectro Cloud 是一家位于 San Jose 的私营基础设施软件公司，由 Tenry Fu 和 Saad Malik 于 2019 年创立。公开证据显示，公司正在通过 Palette 和
    PaletteAI，把自己从全生命周期 Kubernetes 管理厂商，推进到更宽的 AI 基础设施控制平面叙事，覆盖数据中心、云、边缘、受监管和隔离环境。到 2026 年 7 月，Spectro Cloud 已完成超过 $100
    million 的 Series D 轮融资，累计融资 $260 million，据报道估值超过 $1 billion。公司在 AI
    时代平台运营里具备战略相关性，但仍是私营公司，财务与资本结构披露不足，投资者要完整承销当前价格仍缺关键细节。
