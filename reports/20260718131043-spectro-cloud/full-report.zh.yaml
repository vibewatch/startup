  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Spectro Cloud 实际交付的是什么
        blocks:
          - type: paragraph
            body: >-
              核心上，Spectro Cloud 销售的是基础设施控制平面，而不是单一 Kubernetes 发行版。Palette
              被描述为一层标准化模型，用来定义、部署、更新和治理跨多个环境的全栈集群。关键在于，产品不只是供应
              Kubernetes；它把操作系统选择、网络、存储、附加服务、治理策略和生命周期动作打包进一个可重复模型。核心抽象是 Cluster
              Profile，团队可以描述全栈集群意图，再把该意图复用到云、数据中心、裸金属和边缘部署。PaletteAI 把同一套运营模型延伸到 GPU 驱动和生产级 AI
              环境。公开页面显示了角色分离：平台团队创建已批准模板和策略边界，AI 或应用团队则在这些护栏内自助使用。实践中，Spectro Cloud
              销售的是面向异构基础设施的控制、可重复性和集群队列运营，而不是原始算力或开发者 notebook。
