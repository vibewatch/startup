            body: >-
              公开的架构故事异常具体。Palette 支持云 IaaS 和托管 Kubernetes 服务，也支持 vSphere、Nutanix 等数据中心环境、用于裸金属的 Canonical
              MAAS，以及带专用制品创建流程的边缘部署。Spectro Cloud 的边缘教程显示，部署是分阶段流程：构建或获取安装制品，准备边缘主机，创建集群配置档，再推出集群和持续生命周期策略。公开 CanvOS
              仓库进一步强化了这一点，它描述了安装器 ISO 和 Kubernetes provider 镜像的构建流程。CanvOS、Stylus 和边缘主机版本之间存在兼容性矩阵，说明 Spectro Cloud
              有受管理的发布纪律，而不是一堆松散脚本。因此，产品看起来像一套有明确主张的运营模型，覆盖镜像准备、集群设计、推出、升级和回滚。它比集群安装器更复杂，但也意味着运营成功取决于版本纪律和生态适配。
