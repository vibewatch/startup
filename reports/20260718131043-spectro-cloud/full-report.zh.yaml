      - number: '2.4'
        title: 约束、成本压力与 TAM 被高估的原因
        blocks:
          - type: paragraph
            body: >-
              增长故事最强的反向力量是成本和成熟度。Spectro Cloud 的 2025 年生产 Kubernetes 报告称，成本已经超过技能和安全，成为首要痛点；88% 的受访者看到 Kubernetes
              总拥有成本上升。边缘 AI 研究同样令人清醒：多数组织投入边缘 AI 的时间还很短，只有 11% 进入全面生产。即便是 neocloud 机会，也伴随利润率警告，因为 Spectro Cloud 自己的文章引用
              McKinsey 的估计，纯 GPU
              租赁模式毛利率只有十几个百分点中段。这些数字没有否定市场，而是收窄了市场。它们意味着，买方会为能降低复杂度、提升利用率并支持异构部署规则的控制平面付费，而不是为通用编排付费。这有利于 Spectro Cloud
              的投资逻辑，但也说明，通用 AI 基础设施 TAM 幻灯片应被看作营销材料，而不是承销或尽调捷径。实践中，赢家产品需要先证明可量化的运营 ROI，预算才会大范围扩张。
