      - number: '2.2'
        title: 规模测算视角与采用信号
        blocks:
          - type: paragraph
            body: >-
              公开规模测算支持这是一个真实市场，但这些数字更适合作为观察镜头，而不是单一权威 TAM。Mordor 估算 Kubernetes 市场 2025 年为 $2.57 billion，2026 年为 $3.13
              billion，并预计 2031 年达到 $8.41 billion；NextMSC 也把这一类别放在更长期的高增长市场里。调查证据解释了这些预测为何可信。Linux Foundation 的 2024 年
              CNCF 调查发现云原生采用已经很广；2025 年 CNCF 发布则把生产环境 Kubernetes 使用率定在 82%，并明确把 Kubernetes 称为 AI 的事实操作系统。Gartner
              公开的超大规模云厂商摘要也强化了同一方向，认为到 2027 年，容器基础设施将支撑大多数 AI 或 ML 部署。合在一起，这些来源支持增长市场判断；但也意味着，可变现层是 Kubernetes 和 AI
              工作负载周边的运营底座，而不是整个数字基础设施宇宙。
