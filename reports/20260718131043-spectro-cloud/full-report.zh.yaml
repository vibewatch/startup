        title: 可比公司约束估值，但没有一个能让投资者省掉情景推演
        blocks:
          - type: paragraph
            body: >-
              今天看 Spectro Cloud，正确方法是守住情景纪律，而不是追求虚假精确。Nutanix 是有用的公开基础设施软件锚点，因为它有清晰收入和 EBITDA 基数，企业价值 / 收入约 5.3 倍。IBM 收购
              HashiCorp 说明，只要客户基础、产品宽度和市场相关性足够广，基础设施生命周期自动化能拿到远高于商品化软件的战略价值。CoreWeave 展示的是另一种资本胃口：AI
              基础设施能吸引超常规模的资金，但直接持有基础设施的模式，比 Spectro Cloud 看起来采用的模式资本密集得多。Platform9 则提醒我们，私有同业披露很薄，竞争也在推进。合在一起，这些可比对象不能证明
              Spectro Cloud 估值过高。它们说明，本轮估值只有在一个相当强的软件式情景下才能自圆其说。收入未披露，投资者只能反过来问：需要什么 ARR
