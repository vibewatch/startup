  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险可控但真实
        blocks:
          - type: paragraph
            body: >-
              Spectro Cloud 的公开法律和合规足迹，好于许多私营基础设施创业公司，但仍制造了有意义的尽调问题。公司可以指向有效的 FIPS 140-3 证书、FedRAMP
              相关进展，以及引用合规、开源许可证、伙伴和安全公告的公开文档中心。这有帮助，说明管理层理解受监管买方需要的不只是通用安全承诺。同时，公开法律页面带有常见免责声明：网站内容不是担保，争议由加州管辖，出口管制义务适用。隐私材料还显示，Spectro
              Cloud
              会从客户收集技术业务元数据，并在某些场景运营跨境数据传输流程。这些都不构成否决项，但意味着公司已经处在一张法律和监管义务网络中；如果政府和国际扩张继续增长，这张网只会更紧。缓释措施可见，剩余负担也可见。
