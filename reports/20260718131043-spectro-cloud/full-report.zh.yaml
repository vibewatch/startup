      - number: '2.3'
        title: 买方、部署环境与增长驱动
        blocks:
          - type: paragraph
            body: >-
              经济买方通常是平台、基础设施或运营负责人，而不是单个数据科学团队。超大规模云厂商产品页显示，托管 Kubernetes 已经是云预算里的默认预期；但 Spectro Cloud
              自己的研究显示，许多企业已经跨越超过五个环境运营。买方需要一套运营模型覆盖边缘、本地部署、主权和公有云位置，这就创造了需求楔子。AI 正在加剧问题，而不是简化问题。Spectro Cloud 的 2025 年生产
              Kubernetes 报告称，90% 的受访者预期 Kubernetes 上的 AI 工作负载会增长；其 2026 年 AI 趋势文章则把主权 AI、智能体系统和边缘 AI 列为下一批结构性驱动。Spectro
              Cloud 对 neocloud 的分析又加入一个平行买方类别：试图把 AI
              工厂商业化，而不只是运行内部集群的服务提供商和主权运营方。在两种情况下，采购动作通常落在中央平台或基础设施所有者手里，他们能够跨多团队合理化运营和利用率。
