      - number: '6.3'
        title: 采用与扩张信号向上，但分母缺失
        blocks:
          - type: paragraph
            body: >-
              公开信号显示，Spectro Cloud 的客户关系可以随时间加深。2024 年 Series C 评论提到连续三年三位数 ARR 增长，说明在最新 AI
              基础设施叙事成形前，公司已经在新增或扩张收入。当前故事又把新的增长向量叠加到这个基础上：涉及数万台虚拟机的 VM 迁移项目、横跨零售和医疗的边缘 AI 项目、受监管公共部门部署，以及主权云和 neocloud
              等新细分。面向零售的材料称，Spectro Cloud 约 70% 的零售客户已经在运行或计划运行 AI
              工作负载，这意味着公司正在利用既有客户足迹扩大工作负载范围，而不是只追逐净新增客户标识。产品设计也支持先落地再扩张：平台团队可以集中治理，更多内部团队再消费模板和受管理环境。公开记录无法说明的是，这些扩张机会是否转化为持久、多年的经常性收入，并拥有有吸引力的留存率。
