    sections:
      - number: '6.1'
        title: 谁在使用 Spectro Cloud，以及为什么使用
        blocks:
          - type: paragraph
            body: >-
              可见客户基数在数量上不算宽，但画像很强。公开引用把 Spectro Cloud
              放进医疗系统、餐饮和零售集群、电信和连接运营商、航空航天级企业，以及军方或公共部门项目。这些不是随意的开发者账户。它们是基础设施一致性、补丁纪律和安全治理至关重要的环境，因为停机或配置错误会造成真实运营后果。最可能的买方是平台工程、IT
              运营或基础设施现代化团队，而不是单个开发者。公开产品页面也强化了这一点，它们面向必须治理共享环境的平台团队、管理员和 DevOps 运营者。在账户内部，下游用户可以包括现场工程师、开发者和 AI
              从业者，他们消费已批准模板或受管理集群。因此，即便没有公布客户数量，Spectro Cloud
              的客户基数仍具战略吸引力：公司似乎瞄准复杂、高风险资产，那里的买方为生命周期管理付费的意愿应结构性高于小型实验性部署。
