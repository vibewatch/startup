  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与可计入支出
        blocks:
          - type: paragraph
            body: >-
              Spectro Cloud 并不争夺全部云支出或全部 AI 基础设施支出。真正的市场边界，在于 Kubernetes 集群队列、边缘资产和 GPU 驱动 AI
              环境的运营控制软件，这些环境需要跨多个域保持一致治理。因此，可寻址层包括控制平面、生命周期工具、工作负载模板、策略和运营自动化；它不包括超大规模云厂商 IaaS 的每一美元、所有 AI 模型支出，或原始 GPU
              租赁的全部价值。这个区分很重要，因为公司更接近基础设施软件和平台运营，而不是裸金属云容量。VMware 迁移、AI 云和托管 Kubernetes
              服务等邻近市场能创造需求，也会争夺预算。因此，可投资的市场判断必须剔除宽泛的云标题，聚焦那部分真正由多环境复杂性、合规和生命周期管理驱动的支出。
            claimRefs:
              - CM034
              - CM035
              - CM036
              - CM029
              - CM038
