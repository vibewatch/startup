      - number: '6.4'
        title: 耐久性与集中度仍是最大未知
        blocks:
          - type: paragraph
            body: >-
              客户故事在质量上有说服力，但耐久性指标很弱。公开来源没有提供经验证的客户数量，没有展示
              NRR、GRR、流失率或续约队列，也没有披露少数大客户是否主导收入。除了公司、伙伴和客户自撰故事，独立满意度证据也很少。没有可见流失或公开投诉，在方向上有帮助，但不能替代留存数据。因此，核心尽调问题从「是否有真实客户？」转向「客户基数有多宽、多粘、多元化？」第一个问题的答案是肯定的；第二个问题仍未知。对投资者来说，这很重要，因为
              Spectro Cloud 最好的背书恰好来自大型、成熟账户。如果客户基数比预期更窄，这些账户既能验证产品，也会制造集中度风险。
