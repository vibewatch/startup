  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 改变观点的证据
    rows:
      - - 正向逻辑：Spectro Cloud 卡在真实的控制平面痛点上，覆盖 Kubernetes、VM、边缘、受监管环境和 AI 基础设施。
        - 若能独立证明客户以软件式经济性续约和扩张，投资逻辑会明显增强。
      - - 正向逻辑：若采用真实，PaletteAI 的 GPU 绑定定价和 token 成本 / 治理卖点可支撑规模化变现。
        - 披露实际 AI ARR、客户数或大规模部署经济性，会让高溢价更容易站住。
      - - 正向逻辑：具名客户和合作伙伴验证表明，公司正在进入高要求环境。
        - 新增标杆客户赢单，加上留存持久的证据，会支持对收入质量更乐观。
      - - 反向逻辑：当前收入、利润率和烧钱速度仍未披露，表面估值无法换算成清晰倍数。
        - 一份可上会的 KPI 包，证明 ARR 达九位数、毛利强、留存干净，可以化解这一反对意见。
      - - 反向逻辑：融资估值不一定等于市场出清估值，尤其是在偏爱 AI 的私有市场。
        - 后续轮次、老股交易或公开文件若确认更强的价格发现，可降低这一担忧。
      - - 反向逻辑：基础设施管理领域的竞争和价格压力一旦拖慢增长，可能迅速压缩估值支撑。
        - 若能以溢价价格反复拿下大客户，就能证明护城河守得住。
    notes: 反向逻辑主要针对证据质量和价格纪律，而不是否认 Spectro Cloud 拥有真实产品和市场。
    claimRefs:
      - CV016
      - CV011
      - CV013
      - CV032
      - CV009
      - CV030
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观：ARR 已大致超过 $150M，增长仍很强，受监管信任里程碑继续推进，服务负担保持可控。
        - $1.3B-$1.8B 估值可由约 10x-12x 的优质私有市场软件倍数支撑。
        - 需要异常强的执行力，以及比公开来源目前能证明的更干净经济性。
        - 可能成立，但公开证据尚未证明。
      - - 基准：ARR 可能在 $100M-$130M 左右，客户质量强，公司维持差异化控制平面位置。
        - $0.9B-$1.3B 估值可由类似 8x-10x 的区间支撑，使当前估值落在合理区间的上半段附近。
        - 任何 ARR 更低或服务占比更重的迹象，都会迅速削弱支撑。
        - 这是今天公开证据下最可能的情景。
      - - 悲观：ARR 低于 $100M，AI 贡献仍小，增长放缓，或公开市场倍数压缩。
        - 投资者转向 6x-8x 或更低的软件框架后，$0.6B-$0.9B 会更合理。
        - 即使产品没有失败，只要披露显示经济性弱于叙事暗示，该情景也可能出现。
        - 若证据不及预期，下行空间真实存在。
    notes: 这些区间是情景带，不是 DCF。设置它们是因为关键收入分母仍未披露。
