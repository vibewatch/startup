      - number: '7.3'
        title: 依赖与模式风险位于投资逻辑核心
        blocks:
          - type: paragraph
            body: >-
              Spectro Cloud 不是孤立构建。公司依赖云、芯片供应商、开源项目、伙伴 AI 栈、集成商和公共部门采购渠道。客户想要经过验证的生态，而不是孤立组件，这可以加速采用。但这也意味着，Spectro
              Cloud 的产品质量和销售效率部分受制于外部路线图。AI 层尤其暴露：随着 NVIDIA 等厂商以越来越强主张的企业栈加速推进，问题变成 Spectro Cloud
              能否继续成为首选编排层，还是会被更宽的平台压缩。政府业务引入另一种依赖：渠道和采购中介可以扩大触达，也会拉长周期并降低直接控制。即便是开源姿态，也有两面性。它给 Spectro Cloud
              灵活性并避免锁定，但也迫使公司吸收支持和兼容性义务，而更简单、更强主张的厂商可能把这些义务推回给客户。这是典型的控制平面业务：护城河可以真实存在，但前提是依赖网保持对齐。
