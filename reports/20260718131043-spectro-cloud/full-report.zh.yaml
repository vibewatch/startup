  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 在当前价格下，市场和产品证据虽强，但经济账披露仍薄，投资建议因此保持谨慎。
    data:
      nodes:
        - id: a
          label: 大规模 AI / 云控制平面需求
          role: start
        - id: b
          label: 具名客户 + 合作伙伴验证
          role: step
        - id: c
          label: 当前 $1B+ 融资估值
          role: step
        - id: d
          label: 收入 / 利润率 / 股权结构表缺口
          role: step
        - id: e
          label: 价格未充分论证
          role: step
        - id: f
          label: 建议：继续研究
          role: end
      edges:
        - from: a
          to: b
          label: 证明需求成立
        - from: b
          to: c
          label: 支撑溢价叙事
        - from: c
          to: d
          label: 检验证据质量
        - from: d
          to: e
          label: 卡住倍数论证
        - from: e
          to: f
          label: 需要入场纪律
    approximationNotes: null
    claimRefs:
      - CV016
      - CV013
      - CV006
      - CV010
      - CV047
  - id: FV002
    title: 估值敏感性
    type: bar
    summary: 估值固定在 $1B 时，需要多少 ARR 全看投资者认可的倍数；倍数一变，门槛就大幅升降。
    data:
      items:
        - label: 4 倍 ARR
          value: 250
        - label: 6 倍 ARR
          value: 167
        - label: 8 倍 ARR
          value: 125
        - label: 10 倍 ARR
          value: 100
        - label: 12 倍 ARR
          value: 83
    approximationNotes: 数值是各倍数下支撑 $1B 估值所需的隐含 ARR 门槛，单位为 USD millions；这只是算术推导，不是管理层指引。
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV036
      - CV037
  - id: FV003
    title: 估值 / 回报区间
    type: range
    summary: 公开证据只能支撑围绕当前估值的一条宽区间：证据若不及预期，有下行；只有私有指标显著强于公开来源披露，才有上行。
    data:
      items:
        - label: 悲观
          low: 0.6
          mid: 0.75
          high: 0.9
        - label: 基准
          low: 0.9
          mid: 1.1
          high: 1.3
        - label: 乐观
          low: 1.3
          mid: 1.55
          high: 1.8
    approximationNotes: 数值为宽口径企业价值区间，单位为 USD billions；它来自情景假设和公开可比公司的估值纪律，不是 DCF 结果。
    claimRefs:
      - CV038
      - CV039
      - CV040
      - CV037
      - CV048
  - id: FV004
    title: 投资 KPI
    type: kpi
    summary: Spectro Cloud 在市场需求和产品契合度上得分较高，但披露质量和当前入场吸引力偏弱。
    data:
      items:
        - label: 市场 / 问题紧迫性
          value: 8
        - label: 产品 / 控制平面契合度
          value: 8
        - label: 客户 / 生态证据
          value: 7
        - label: 披露质量
          value: 3
        - label: 执行 / 商业模式风险
          value: 4
        - label: 当前估值吸引力
          value: 4
    approximationNotes: 分数是基于留存证据综合得出的 0-10 分尽调序位判断，不是公司披露指标。
    claimRefs:
      - CV016
      - CV003
      - CV013
      - CV010
      - CV047
      - CV048
