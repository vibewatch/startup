      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - ARR 低于支撑溢价的门槛
        - 私有尽调显示 ARR 明显低于约 $100M-$125M
        - 按公开可比估值纪律看，当前估值意味着倍数过高
        - 转向回避，或要求大幅重新定价。
      - - AI 产品贡献过小
        - PaletteAI 对收入或扩张仍不重要
        - AI 时代叙事跑在经济现实前面
        - 下调信心，把当前估值视为叙事偏重。
      - - 服务负担过高
        - 毛利率或支持强度更像基础设施赋能，而不是优质软件
        - 估值应向更低的公开市场先例压缩
        - 用更低倍数和更高风险重新承销。
      - - 公开可比倍数继续压缩
        - 基础设施软件和 AI 平台可比对象估值显著下修
        - 即使执行良好，也可能无法再支撑当前入场价
        - 除非价格重置，否则不进场。
      - - 股权结构经济性弱于表面信息
        - 优先权、参与权或老股交易条款压低普通股价值
        - 表面估值高估投资者经济性
        - 暂停，直到完全看清瀑布分配。
    notes: 否决触发因素围绕可衡量的承销失败来设定，而不是泛泛的市场焦虑。
    claimRefs:
      - CV045
      - CV046
      - CV041
      - CV036
      - CV047
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - ARR 与收入桥接
        - 当前 ARR、GAAP 收入、增长率，以及包含 PaletteAI 在内的产品组合
        - 没有分母，就无法检验表面估值。
        - 索取 CFO 桥接表和董事会 KPI 包。
      - - 毛利率与服务组合
        - 毛利率、实施负担、支持附加，以及任何服务收入
        - 决定 Spectro 应拿优质软件倍数，还是较低的基础设施赋能倍数。
        - 索取产品线 P&L 和服务附加数据。
      - - 留存与集中度
        - NRR、GRR、logo 流失和头部客户暴露
        - 优质后期估值需要持久的收入质量。
        - 索取队列分析和集中度明细表。
      - - 股权结构与优先权
        - 清算优先权堆叠、参与权、ratchet 条款，以及任何老股交易机制
        - 表面估值可能与真实普通股经济性大幅背离。
        - 审查融资文件和瀑布模型。
      - - AI 专项证明
        - PaletteAI 客户数、部署规模、利用率影响和已实现定价
        - 新的 AI 叙事必须承载真实经济权重，才足以支撑重新定价。
        - 索取产品级订单额和大客户案例研究。
    notes: 这些是从公开证据视角走向真实投委会承销判断所需的最低尽调项。
    claimRefs:
      - CV010
      - CV042
      - CV041
      - CV045
      - CV047
