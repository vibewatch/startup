    },
    {
      "id": "funding-milestones-and-customer-proof",
      "title": "Funding milestones and customer proof",
      "body": "The funding chronology is now clear enough to establish momentum even if it still lacks private-company financial detail. Sierra says the company started with a $6 million seed, moved to a $75 million Series C in 2024, and then closed an oversubscribed Series D of more than $100 million in July 2026. Spectro Cloud and Morningstar both say the new round brings total capital raised to $260 million, while Tracxn's lagging figure of $242 million demonstrates why third-party databases should not be treated as canonical after a fresh financing. Customer proof has also become more visible. The 2026 round materials name T-Mobile, Airbus, and the U.S. Air Force, while Carahsoft and government pages broaden that into Army, Navy, and Air Force adoption. Company case studies add more granular deployment evidence through RapidAI and Yum! Brands, showing that the platform is being used in healthcare and distributed retail edge settings rather than only in slideware pilots. That breadth is strategically important because it suggests Spectro Cloud is winning in environments where downtime, compliance, and remote operations matter simultaneously.",
      "claimRefs": [
        "CO010",
