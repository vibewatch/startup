    {
      "id": "durability-and-gaps",
      "title": "Durability and concentration remain the big unknowns",
      "body": "The customer story is persuasive on quality and weak on durability metrics. Public sources do not provide a verified customer count, do not show NRR, GRR, churn, or renewal cohorts, and do not disclose whether a handful of large accounts dominate revenue. There is also little independent satisfaction evidence outside company, partner, and customer-authored stories. The absence of visible churn or public complaints is directionally helpful, but it is not a substitute for retention data. This means the core diligence question shifts from \\\"are there real customers?\\\" to \\\"how broad, sticky, and diversified is the customer base?\\\" The answer to the first question is yes. The answer to the second is still unknown. For investors, that matters because Spectro Cloud's best references are exactly the kinds of large, sophisticated accounts that can both validate the product and create concentration risk if the customer base is narrower than expected.",
      "claimRefs": [
        "CU024",
