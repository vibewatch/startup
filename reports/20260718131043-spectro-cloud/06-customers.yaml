  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "Spectro Cloud has credible public proof that real enterprises and government teams use its platform in production, especially across healthcare, retail edge, telecom, aerospace, and defense. What is still missing is the denominator: public sources do not disclose customer count, retention, expansion rates, or concentration, so the quality of the customer base is more visible than its breadth or durability."
  },
  "sections": [
    {
      "id": "who-uses-spectro",
      "title": "Who uses Spectro Cloud and why",
      "body": "The visible customer base is not broad in count, but it is strong in profile. Public references place Spectro Cloud inside healthcare systems, restaurant and retail fleets, telecom and connectivity operators, aerospace-scale enterprises, and military or public-sector programs. Those are not casual developer accounts. They are the kinds of environments where infrastructure consistency, patch discipline, and security governance matter because downtime or misconfiguration has real operational consequences. The most likely buyer is a platform engineering, IT operations, or infrastructure modernization team rather than an individual developer. Public product pages reinforce that view by speaking to platform teams, administrators, and DevOps operators who must govern shared environments. Within accounts, downstream users can include field engineers, developers, and AI practitioners who consume approved templates or managed clusters. That makes Spectro Cloud's customer base strategically interesting even without a published customer count: the company appears to target complex, high-stakes estates where the willingness to pay for lifecycle management should be structurally higher than in small experimental deployments.",
      "claimRefs": [
        "CU003",
        "CU004",
        "CU030",
        "CU031",
        "CU020"
      ],
      "tableRefs": [
        "TU001"
      ],
      "figureRefs": [
        "FU001"
      ]
    },
    {
      "id": "named-customer-proof",
      "title": "Named customer proof is real, but uneven",
      "body": "The best public evidence comes from customer stories that include operational outcomes. RapidAI is the strongest healthcare example because there is both a Spectro Cloud case study and a customer-side corporate surface showing the scale of RapidAI's hospital footprint. GE HealthCare also matters because Spectro Cloud claims a concrete outcome\u2014upgrading more than 100 clusters in under four hours with no downtime\u2014and GE's own corporate scale makes it a high-value reference if accurate. Yum! Brands is the clearest distributed-edge reference, with 40,000 restaurant locations cited publicly. Government evidence is also material: the U.S. Air Force appears in funding coverage and in third-party customer proof, while Carahsoft and Spectro Cloud describe broader Army, Navy, and Air Force usage. By contrast, T-Mobile and Airbus are currently more valuable as high-quality logos than as fully elaborated public case studies. That does not make them weak references, but it does mean the proof quality varies sharply by account.",
