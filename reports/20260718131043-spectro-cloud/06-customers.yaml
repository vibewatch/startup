    {
      "id": "adoption-and-expansion",
      "title": "Adoption and expansion signals point up, but the denominator is missing",
      "body": "Public signals suggest Spectro Cloud's customer relationships can deepen over time. The 2024 Series C commentary about triple-digit ARR growth for three consecutive years indicates that the company was adding or expanding revenue before the latest AI-infrastructure narrative took hold. The current story layers new growth vectors on top of that base: VM migration projects involving tens of thousands of virtual machines, AI-at-the-edge programs across retail and healthcare, regulated public-sector deployments, and new segments such as sovereign clouds and neoclouds. Retail-facing materials say about 70% of Spectro Cloud's retail customers are already running or planning AI workloads, which implies the company is using existing customer footprints to broaden workload scope rather than chasing only net-new logos. Product design also supports land-and-expand: platform teams can govern centrally while additional internal teams consume templates and managed environments. What the public record cannot show is whether these expansion opportunities turn into durable, multi-year recurring revenue at attractive retention rates.",
      "claimRefs": [
        "CU017",
