callouts:
  - calloutType: "strength"
    title: "Objective Standardization in Clinical Scoring"
    body: "Iterative Health's computer vision approach tackles one of the most persistent bottlenecks in gastroenterology clinical trials: inter-observer variability in endoscopic Mayo scoring. By replacing subjective visual estimation with standardized algorithmic scoring, the platform enables trial sponsors to identify qualifying patients faster and minimize costly screen failures."
    claimRefs:
      - "CE001"
      - "CE004"
      - "CE014"
  - calloutType: "risk"
    title: "Hardware Heterogeneity and Data Access Moats"
    body: "While real-time computer vision yields compelling adenoma detection and pre-screening velocity in controlled trials, scaling across fragmented community ASCs introduces technical exposure to diverse optical processors, camera resolutions, and varying video capture standards. Furthermore, reluctance among pharmaceutical sponsors to share proprietary trial video datasets limits third-party validation of algorithmic generalizability."
    claimRefs:
      - "CE012"
      - "CE014"
