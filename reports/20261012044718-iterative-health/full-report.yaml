      - number: '8.2'
        title: Capitalization Context, Valuation Multiples, and Dilution Overhang
        blocks:
          - type: paragraph
            body: >-
              Iterative Health closed a $77 million Series C financing round on April 30, 2026, co-led by Intrepid
              Growth Partners and Google Ventures, with participation from EDBI, Insight Partners, and Obvious Ventures.
              This round brought total lifetime funding to approximately $271 million across five financing rounds since
              its 2017 inception. The Series C reportedly established a post-money valuation of $1.3 billion,
              representing an incremental step-up from its $704 million Series B valuation achieved in January 2022.
              Based on disclosed round figures, the Series C round implied an estimated investor dilution of
              approximately 6%, compared to 21% sold during Series B and 22% in Series A-1. However, this headline
              unicorn valuation creates substantial investment overhang. Iterative Health remains private and provides
              zero public disclosure of audited revenue, annual recurring revenue (ARR), gross margins, or cash runway.
              Tracker databases estimate headcount between 125 and 207 personnel, suggesting that top-line revenue may
              lag traditional software unicorn benchmarks, leaving the $1.3B valuation multiple heavily stretched
              against comparable clinical services and digital health peers.
