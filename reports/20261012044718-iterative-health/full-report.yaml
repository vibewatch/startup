      - number: '6.2'
        title: Adoption Trajectory and Named Network Deployments
        blocks:
          - type: paragraph
            body: >-
              Iterative Health's commercial deployment model has evolved from single-site clinical trial software pilots
              into an enterprise network spanning more than 100 community and health system research sites globally.
              Primary customer proof is anchored by marquee multi-specialty physician networks, most notably Gastro
              Health—a nationwide medical group spanning over 380 physicians across seven states—which deployed
              Iterative Health's AI Recruitment (AIR) platform to standardize trial enrollment in IBD trials. Additional
              named clinical research partners include GI Alliance, Tyler Research Institute, One GI, and US Heart &
              Vascular. These enterprise deployments demonstrate that community-based clinical groups are willing to
              integrate Iterative Health's operational and software stack into everyday clinical workflows. Furthermore,
              the network has demonstrated cross-specialty adoption, expanding from core gastroenterology and hepatology
              into obesity and cardiology clinical programs.
