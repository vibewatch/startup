            body: >-
              Iterative Health faces critical diligence headwinds due to the absence of public HIPAA compliance
              statements, product-level Business Associate Agreements, and third-party security certifications such as
              SOC 2 Type II. As health systems and pharmaceutical sponsors enforce rigorous vendor assurance programs,
              the lack of verifiable data safeguards around patient endoscopy videos and clinical trial screening
              databases threatens to delay or derail enterprise contract expansion.
