      - number: '5.2'
        title: Technology Architecture and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Iterative Health's underlying architecture bridges hardware-agnostic clinical video ingestion with
              distributed machine learning inference and centralized site enablement workflows. At the procedure level,
              the platform captures high-definition video feeds directly from standard endoscope processor outputs
              without requiring proprietary endoscopic hardware replacements. Proprietary convolutional and vision-based
              neural networks analyze mucosal surfaces across frame sequences, evaluating over two dozen distinct
              clinical features including mucosal erythema, vascular pattern loss, ulcerations, bleeding, and erosions.
              To transition from standalone diagnostic point solutions toward a comprehensive research operating model,
              Iterative Health links this algorithmic core to an automated pre-screening engine and centralized
              operations backbone. The pre-screening pipeline scans clinical schedules and electronic health records
              across partner ambulatory surgery centers to identify candidate trial participants prior to procedure
              dates. Centralized operations teams manage study startup, regulatory submissions, protocol training, and
              dedicated clinical research coordinator (CRC) staffing, enabling community practices to operate
              high-performing clinical trial ancillaries. The company's technical and clinical leadership is anchored by
              prominent academic and clinical researchers, including MIT CSAIL Professor Polina Golland as AI Chair, Dr.
              David Rubin of the University of Chicago as IBD Chair, and Dr. Casey Chapman of GI Alliance as Chief
              Medical Officer. This multi-tiered operational model supports clinical trials across four therapeutic
              focus areas: gastroenterology, hepatology, obesity, and cardiology.
            claimRefs:
