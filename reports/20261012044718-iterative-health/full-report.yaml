      - number: '5.3'
        title: Clinical Performance Benchmarks and Network Scale
        blocks:
          - type: paragraph
            body: >-
              Clinical research execution in gastrointestinal medicine faces severe structural friction, with
              industry-wide enrollment rates declining by over 70% over the past two decades. Iterative Health's hybrid
              software-and-services model seeks to counter this trend by combining algorithmic patient identification
              with standardized site operations. At Digestive Disease Week (DDW) 2026, Iterative Health reported updated
              multi-center performance data evaluating randomized controlled trials across ulcerative colitis and
              Crohn's disease indications. Over a two-year evaluation period across US and European site cohorts, the
              network achieved a per-study randomization rate of 0.33 patients per site per month across Phase 2 and
              Phase 3 studies. This performance represents more than three times the published industry benchmark of
              0.10 patients per site per month. Across four fully enrolled trials, the network maintained a global
              median randomization rate of 0.32 patients per site per month, demonstrating consistent recruitment
              velocity across the complete trial lifecycle rather than temporary front-loaded enrollment surges.
              Iterative Health attributes this velocity to its proprietary AI pre-screening tools, which report a 40%
              uplift in patient randomizations while saving research teams thousands of hours of manual chart review.
              Strategic provider partnerships, including a network-wide deployment across Gastro Health's 150 locations
              and collaborations with GI Alliance, substantiate the scalability of embedding research infrastructure
              directly into community healthcare settings.
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE007
              - CE008
              - CE009
