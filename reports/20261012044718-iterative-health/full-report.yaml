  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Clinical Workflow Integration
        blocks:
          - type: paragraph
            body: >-
              Iterative Health operates as a specialized healthcare technology and clinical services provider, targeting
              structural operational inefficiencies in gastroenterology procedures and clinical trials. The company's
              core technological offering originated around real-time computer vision applications in endoscopy suites,
              notably the FDA 510(k)-cleared SKOUT device. SKOUT integrates directly into procedure room endoscopy
              monitors, processing live optical video feeds to highlight suspicious mucosal tissue and potentially
              precancerous polyps during screening and surveillance colonoscopies. In its registration trial published
              in Gastroenterology, the device achieved a 27% relative increase in adenoma detection per colonoscopy,
              averaging one additional adenoma for every 4.5 patients evaluated. Beyond colorectal cancer screening,
              Iterative Health developed AI Recruitment (AIR), a clinical software solution addressing the acute
              recruitment crisis in inflammatory bowel disease (IBD) drug development. AIR analyzes colonoscopy video
              recordings and digital procedure images to compute standardized endoscopic disease scores, such as the
              Mayo score for ulcerative colitis. Because traditional clinical trial recruitment relies on subjective
              visual assessment by individual endoscopists, high inter-observer scoring variance frequently causes
              inappropriate patient screening and elevated screen failure rates. By automating disease scoring against
              standardized inclusion criteria, AIR provides clinical research teams with an objective patient selection
              pipeline. Through commercial partnerships with large platform practices such as Gastro Health, the company
              has deployed its AI technology across hundreds of gastroenterologists and community endoscopy centers.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
