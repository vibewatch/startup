              Iterative Health's dual-engine model combines an FDA 510(k)-cleared AI medical device (SKOUT) with an
              embedded multispecialty clinical trial site network exceeding 100 locations globally. This structure
              allows the company to address clinical trial enrollment bottlenecks directly in community settings while
