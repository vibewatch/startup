        title: Thesis-Break Triggers and Exit Readiness Assessment
        blocks:
          - type: paragraph
            body: >-
              A disciplined investment posture requires identifying explicit thesis-break triggers and essential
              confirmatory diligence requirements before considering an equity participation. Primary thesis-break
              events include: (1) any public regulatory enforcement action or sponsor audit finding related to
              unconsented patient data pre-screening or HIPAA non-compliance; (2) material customer churn among marquee
              provider partners such as GI Alliance or Gastro Health, which would impair network enrollment capacity;
              (3) failure of cross-specialty clinical trial expansion into obesity and cardiology, constraining the
              company's total addressable market to gastrointestinal indications; and (4) senior liquidation preference
              stacking in the Series C round that disproportionately subordinates common equity and earlier venture
              syndicates. Confirmatory diligence must prioritize securing audited trailing twelve-month revenue, ARR
              bridge analysis, gross margin breakdown between software and clinical services, and the full Series C
              certificate of incorporation detailing liquidation preferences, dividend covenants, and redemption rights.
