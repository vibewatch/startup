      - number: '3.2'
        title: Competitor Archetypes and Category Dynamics
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape surrounding Iterative Health stratifies into four primary archetypes: incumbent
              CADe medical device manufacturers, specialized diagnostic startups, clinical site management organizations
              (SMOs), and global contract research organizations (CROs). In endoscopic detection, global medical
              technology leaders such as Medtronic with its GI Genius platform dominate hospital and ambulatory surgery
              center installations through established capital sales channels. Meanwhile, earlier-stage diagnostic
              innovators including Alimetry and Suzhou Huiwei focus narrowly on non-invasive gastric electrogastrography
              or regional screening algorithms without clinical trial recruitment infrastructure. In trial execution,
              traditional SMOs and site networks like Velocity Clinical Research and CareAccess operate extensive
              physical clinic footprints but rely on labor-intensive manual coordinator screening. Iterative Health
              targets this systemic trial friction—where over half of standard research sites enroll zero or one patient
              per protocol—by offering over forty biopharma and CRO partners automated pre-screening and standardized
              image scoring across its allied community provider footprint.
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP008
              - CP009
              - CP010
      - number: '3.3'
        title: Capability Comparison and Commercial Contracting Structures
        blocks:
          - type: paragraph
            body: >-
              A structural comparison of technical capabilities highlights Iterative Health's differentiated focus on
              procedural standardization and trial acceleration. In clinical endoscopy, SKOUT has secured six FDA 510(k)
              clearances through late 2025 and demonstrated a 27 percent relative increase in adenoma detection per
              colonoscopy in its prospective registration trial published in Gastroenterology. Beyond polyp detection,
              the company develops computer vision software that analyzes endoscopic video to generate objective,
              standardized disease severity scores for inflammatory bowel disease (IBD) trials, directly mitigating the
              inter-observer variability that historically impedes sponsor patient enrollment. Commercially, SKOUT is
              sold across the United States through an exclusive distribution partnership with Provation, integrating
              into standard endoscopy documentation software. However, neither Iterative Health nor Provation publishes
              standardized rate cards or per-procedure license fees. Similarly, sponsor pricing for clinical trial
              acceleration services is negotiated confidentially on a study-by-study performance basis, obscuring
              underlying gross margins and unit realization.
