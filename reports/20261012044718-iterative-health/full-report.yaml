              - CI010
              - CI012
              - CI014
      - number: '4.3'
        title: Public Commercial Traction, Valuation Disconnect, and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              Publicly visible commercial traction for Iterative Health is defined by site network scale, clinical
              partnerships, and venture capital financing milestones rather than disclosed financial statements. The
              company cites partnerships with over 40 global sponsors and contract research organizations, alongside
              network relationships with prominent multi-specialty physician practices including GI Alliance, OneGI, and
              U.S. Heart & Vascular. Official materials report operational metrics including 2x faster site activation
              and 3.4x higher patient enrollment rates versus industry baselines. However, neither audited revenue,
              annual recurring revenue (ARR), gross profit margins, nor unit economics per partner site are publicly
              reported. Private market tracking estimates post-money valuation at $1.3 billion following the April 2026
              Series C round, implying a high forward valuation multiple against unverified commercial revenues. For
              prospective investors, this absence of unit economics creates a major diligence gap: without visibility
              into revenue per active site, customer acquisition costs, or provider profit-sharing take-rates, the
              enterprise cannot be underwritten on verifiable cash contribution.
            claimRefs:
