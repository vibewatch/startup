      - number: '8.3'
        title: Recommendation Synthesis, Risk Rating, and Valuation Stance
        blocks:
          - type: paragraph
            body: >-
              We assign Iterative Health a formal recommendation of research-more with medium confidence, a high risk
              rating, and a stretched valuation stance. The recommendation balances observable real-world operational
              strength against acute information asymmetry. While Iterative Health's site network delivers tangible
              enrollment acceleration and maintains high-profile advisory relationships with leading academic
              gastroenterologists and clinical groups, capital allocators cannot responsibly underwrite an entry at a
              $1.3 billion post-money valuation without audited financial statements. The high risk rating reflects the
              combination of unverified revenue scale, potential customer concentration across top biopharmaceutical
              clinical programs, and unaddressed compliance posture regarding patient health information. Under current
              private market conditions, investing at unicorn marks requires clear visibility into net revenue
              retention, software gross margins, and burn multiple efficiency. Until management provides verified
              financial and capitalization schedules during confirmatory diligence, investors should avoid issuing
              binding capital commitments and continue active tracking.
