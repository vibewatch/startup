      - number: '4.2'
        title: Cost Structure, Delivery Economics, and Margin Drivers
        blocks:
          - type: paragraph
            body: >-
              The operational cost profile of Iterative Health is heavily weighted toward decentralized clinical
              operations, specialized trial staffing, and regulatory coordination. Unlike a pure-play software vendor
              whose cost of goods sold is dominated by cloud hosting and model inference infrastructure, Iterative
              Health embeds dedicated clinical research coordinators, regulatory managers, and study support staff
              directly across its global site network. The company reports over 250 employees worldwide across offices
              in Cambridge, New York, Dallas, and San Francisco, having expanded from approximately 75 employees in late
              2021. This personnel footprint drives substantial operating expenses in payroll, site training retreats,
              protocol management, and sponsor relationship management. Furthermore, while proprietary artificial
              intelligence tools automate patient pre-screening and image interpretation, human clinicians and
              coordinators remain indispensable for patient consent, trial protocol execution, and data reporting.
              Consequently, independent assessments emphasize that Iterative Health operates fundamentally as a
              specialized clinical services organization, where gross margins are structurally constrained to
              professional services levels rather than software benchmarks.
            claimRefs:
              - CI006
              - CI010
              - CI013
              - CI014
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI005
              - CI006
