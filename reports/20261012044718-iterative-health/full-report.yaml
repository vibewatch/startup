              - CE010
      - number: '5.4'
        title: Technical Dependencies, Data Governance, and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Despite compelling clinical trial metrics and regulatory validation for SKOUT, Iterative Health faces
              significant technical dependencies, data governance hurdles, and enterprise diligence gaps. On the product
              roadmap, the company has announced development of AI Documentation in collaboration with clinical software
              vendor Provation, aiming to generate structured procedure documentation automatically from video. However,
              commercialization timelines, product maturity, and software integration depth with non-Provation
              electronic health record systems remain unverified. A deeper technological challenge involves access to
              high-quality training data. As noted in company technical commentary, biopharmaceutical sponsors and
              health systems are frequently reluctant to pool proprietary trial data, creating artificial barriers to
              training robust, cross-population vision algorithms. Furthermore, endoscope video quality, illumination
              artifacts, and camera motion across heterogeneous equipment lines (e.g. Olympus, Pentax, Fujifilm)
              introduce potential domain shift that can degrade model sensitivity outside tightly calibrated trial
              environments. From an enterprise security perspective, public disclosures omit third-party verification of
              SOC 2 Type II controls, ISO 27001 certifications, or detailed HIPAA data segregation mechanisms for
              cloud-based video transmission. Closing these diligence gaps will require technical reviews of model
              calibration datasets, hardware compatibility matrices, and independent cybersecurity audit packages.
            claimRefs:
              - CE006
              - CE012
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Objective Standardization in Clinical Scoring
            body: >-
              Iterative Health's computer vision approach tackles one of the most persistent bottlenecks in
              gastroenterology clinical trials: inter-observer variability in endoscopic Mayo scoring. By replacing
              subjective visual estimation with standardized algorithmic scoring, the platform enables trial sponsors to
              identify qualifying patients faster and minimize costly screen failures.
            calloutType: strength
            claimRefs:
              - CE001
              - CE004
              - CE014
          - type: callout
            title: Hardware Heterogeneity and Data Access Moats
            body: >-
              While real-time computer vision yields compelling adenoma detection and pre-screening velocity in
              controlled trials, scaling across fragmented community ASCs introduces technical exposure to diverse
              optical processors, camera resolutions, and varying video capture standards. Furthermore, reluctance among
              pharmaceutical sponsors to share proprietary trial video datasets limits third-party validation of
              algorithmic generalizability.
            calloutType: risk
            claimRefs:
              - CE012
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Commercial Engine Dynamics
        blocks:
          - type: paragraph
            body: >-
              Iterative Health addresses two distinct buyer populations across clinical trial execution and endoscopic
              diagnostics. On the clinical research side, the company's primary economic buyers are pharmaceutical and
              biotechnology sponsors—alongside partner contract research organizations (CROs)—seeking accelerated
              patient recruitment and standardized disease activity scoring for complex clinical trials. The service
              proposition centers on reducing study startup delays and trial failure risks in inflammatory bowel disease
              (IBD) and adjacent cardiometabolic indications. The counterpart to this sponsor-facing engine is the
              provider research network, comprising community-based gastroenterology practices, specialized ambulatory
              surgery centers (ASCs), and health systems that host clinical trials as profitable clinical ancillaries.
              On the diagnostic technology side, Iterative Health targets gastroenterology practices and endoscopy
              suites with SKOUT, an FDA-cleared computer-aided polyp detection tool distributed via Provation. While
              these two commercial surfaces share underlying clinical domain expertise in gastroenterology, their
              procurement pathways, value propositions, and economic incentives operate largely independently.
            claimRefs:
