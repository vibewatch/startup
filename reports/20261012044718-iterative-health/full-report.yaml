          - type: callout
            title: Strategic Friction Between Dual Operating Models
            body: >-
              Iterative Health operates two distinct business models: an FDA-cleared diagnostic software product (SKOUT)
              and a physical, community-embedded clinical trial site network. While both leverage AI and
              gastroenterology relationships, they present fundamentally different operating profiles. SKOUT behaves
              like pure software dependent on distributor Provation, whereas the clinical site network requires heavy
              clinical coordinator staffing, site-level compliance, and physician recruitment, exposing the company to
              margin compression and operational scaling friction.
            calloutType: insight
            claimRefs:
              - CR004
