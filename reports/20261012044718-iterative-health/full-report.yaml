      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Adoption Pathways
        blocks:
          - type: paragraph
            body: >-
              The commercial adoption path for Iterative Health relies on a two-sided marketplace structure linking
              biopharmaceutical sponsors and contract research organizations on the demand side with independent
              outpatient provider networks on the supply side. Biopharma study sponsors and CROs act as primary
              purchasers, funding trial acceleration out of central clinical development and therapeutic program budgets
              to compress phase 1b through phase 4 development timelines. Conversely, independent community physician
              groups, including large enterprise partnerships with GI Alliance, One GI, and US Heart & Vascular, adopt
              Iterative Health's site model as a profitable clinical ancillary service. Iterative Health provides
              centralized regulatory filings, specialized clinical research coordinator staffing, and negotiated premium
              rate cards, insulating community clinicians from administrative startup burdens. For hospital systems and
              ambulatory surgery centers, adoption of real-time AI tools like SKOUT follows medical executive and
              facility technology procurement pathways focused on procedure quality benchmarking, adenoma detection
              improvements, and standardized clinical documentation.
            claimRefs:
              - CM005
              - CM006
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM011
              - CM012
      - number: '2.4'
        title: Adoption Drivers, Structural Bottlenecks, and Evidence Gaps
        blocks:
          - type: paragraph
            body: >-
              Growth in Iterative Health's market footprint is propelled by acute biopharma demand for compressed
              enrollment schedules, where the company reports delivering 2x faster site activation, reducing startup
              timelines by up to three months, and achieving over 3x higher patient enrollment rates compared to
              conventional IBD industry benchmarks. In gastroenterology trials, subjective variation in physician
              endoscopic scoring has historically created high screen failure rates and prolonged qualification cycles,
              providing a strong economic driver for automated, objective computer vision scoring. Nevertheless,
              material structural constraints temper rapid market expansion. Pharmaceutical sponsors exhibit persistent
              reluctance to pool or share proprietary patient datasets across shared algorithmic frameworks,
              constraining the pace of multi-institution model training. Furthermore, while the network spans more than
              100 clinical research sites and 40 biopharma relationships, the absence of public customer concentration
              data, retention metrics, and audited software ARR leaves meaningful diligence gaps regarding the long-term
              unit economics and enterprise renewal stability of its commercial contracts.
            claimRefs:
              - CM001
              - CM007
              - CM009
              - CM010
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Dual-Sided Network Economics Overcome Community Site Activation Bottlenecks
            body: >-
              By positioning the clinical site at the operational center and securing premium rate cards for community
              practices, Iterative Health converts fragmented outpatient GI clinics into high-throughput research
              centers, solving the structural industry reality where more than half of research sites fail to enroll
              more than one patient.
            calloutType: insight
            claimRefs:
              - CM001
              - CM005
              - CM011
              - CM012
          - type: callout
            title: Multi-Specialty Sizing Relies on Transferable Workflow Execution
            body: >-
              Iterative Health's expansion beyond established gastroenterology and hepatology domains into obesity and
              cardiology significantly enlarges its addressable market, but commercial execution requires proving that
              proprietary AI pre-screening and site enablement deliver identical 2x activation and 3x enrollment
              outperformance in non-endoscopic therapeutic settings.
            calloutType: risk
            claimRefs:
              - CM004
              - CM006
              - CM007
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Across Endoscopy AI and Clinical Research Networks
        blocks:
          - type: paragraph
            body: >-
              Iterative Health occupies an unconventional competitive position by spanning two historically separate
              markets: medical device computer-aided detection (CADe) software and decentralized clinical research site
              operations. In gastroenterology diagnostic imaging, the company commercializes SKOUT, an artificial
              intelligence tool cleared for real-time colorectal polyp detection during screening colonoscopy.
              Concurrently, the firm operates a performance-driven clinical trial network comprising more than one
              hundred specialized research sites across North America, Europe, India, and Australia. Following a $77
              million Series C funding round in May 2026 led by Google Ventures and Intrepid Growth Partners, Iterative
              Health is actively scaling this clinical research network beyond gastroenterology and hepatology into
              high-growth therapeutic areas including obesity and cardiology. This multi-specialty expansion
              differentiates the company from pure-play medical device vendors and traditional contract research
              organizations by embedding proprietary screening algorithms directly into routine provider workflows.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP010
              - CP014
