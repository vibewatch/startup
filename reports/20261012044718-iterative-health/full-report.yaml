            title: High Strategic Exposure to Sponsor Trial Cycling and Churn Ambiguity
            body: >-
              Because clinical trial revenues are fundamentally project-dependent and tied to clinical trial phases,
              biopharma spending is subject to termination when clinical development milestones conclude or
              investigational drugs fail. Iterative Health's absence of disclosed NRR or contract length leaves
              long-term customer durability unverified.
