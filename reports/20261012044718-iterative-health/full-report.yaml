      - number: '7.4'
        title: Financial Capital Intensity, Valuation Exposure, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              From a financial and investment thesis perspective, Iterative Health exhibits a stark asymmetry between
              its headline valuation and its underlying financial transparency. Following a $77M Series C financing in
              April 2026 led by Intrepid Growth Partners and GV, the company attained a post-money valuation of $1.3B.
              Despite this unicorn valuation mark, Iterative Health discloses no public audited figures for revenue,
              annual recurring revenue (ARR), gross margins, or cash burn rate. Public employee headcount estimates
              diverge substantially across market data providers, ranging between 125 and more than 250 personnel,
              reflecting significant operational opacity. Operating a global network of over 110 research sites requires
              substantial personnel costs for clinical research coordinators, regulatory compliance staff, and site
              liaisons, which may dilute the high-margin software economics typically expected of healthcare AI
              companies. In the private secondary market, shares trade on platforms like EquityZen as early shareholders
              seek liquidity, underscoring illiquidity risks and the absence of a visible near-term IPO window. Key
              thesis-break triggers for investors include any loss of the Provation distribution agreement, critical
              HIPAA enforcement actions, regulatory warnings regarding clinical data pre-screening, or evidence of heavy
              cash burn outpacing network sponsor contract revenue.
            claimRefs:
              - CR005
              - CR012
              - CR013
              - CR014
