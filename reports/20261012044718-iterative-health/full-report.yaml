              - CP008
              - CP010
              - CP011
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams, Commercial Monetization, and Pricing Dynamics
        blocks:
          - type: paragraph
            body: >-
              Iterative Health commercializes two distinct offerings across healthcare and life sciences: a clinical
              trial site network and an FDA-cleared colonoscopy artificial intelligence device known as SKOUT. The
              primary commercial growth driver is the clinical research site network, which contracts directly with
              pharmaceutical sponsors, biotechnology firms, and contract research organizations to accelerate clinical
              trial execution across gastroenterology, hepatology, obesity, and cardiology indications. Under this
              business line, Iterative Health captures milestone-based trial management fees, study startup revenues,
              and patient randomization success fees. For participating healthcare provider practices such as GI
              Alliance and OneGI, Iterative Health operates as an outsourced trial infrastructure partner that enables
              community clinics to offer clinical research as an operationally profitable ancillary service, sharing
              economics via negotiated rate cards. Meanwhile, commercial distribution of the SKOUT polyp detection
              software in the United States is handled through an exclusive partnership with Provation, which markets
              the tool as an integrated software add-on for endoscopy suites. Realized pricing, software license ARR,
              and sponsor fee schedules remain closely held private data.
            claimRefs:
              - CI001
              - CI005
