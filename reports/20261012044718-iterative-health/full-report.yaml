      - number: '7.3'
        title: Commercial Channel Concentration and Provider Network Dependencies
        blocks:
          - type: paragraph
            body: >-
              Iterative Health exhibits pronounced commercial and operational dependencies on external channel partners
              and provider organizations. For its flagship diagnostic software, SKOUT, commercialization in the United
              States depends exclusively on an enterprise distribution partnership with Provation. Consequently,
              software sales velocity, contract renewals, and customer relationship control are mediated by a
              third-party vendor rather than a direct enterprise sales force, exposing Iterative Health to distributor
              prioritization risk and pricing renegotiation pressures. Concurrently, the company's research network
              expansion depends on locking in large regional independent provider networks and management services
              organizations (MSOs). Its partnership with Gastroenterology Associates of New Jersey (GANJ) integrates
              research infrastructure across 28 community practice locations. While MSO partnerships rapidly expand
              geographic reach and patient diversity, they create acute partner concentration risk: the loss or
              disengagement of a major multi-site practice partner directly degrades clinical trial capacity and sponsor
              throughput. Governance oversight has expanded with the appointment of Intrepid Growth Partners Co-Founder
              Ajay Agrawal to the board of directors following the 2026 Series C financing, yet ongoing execution
              remains dependent on maintaining active physician investigator engagement across diverse community
              practices.
            claimRefs:
