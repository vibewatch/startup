      - number: '3.4'
        title: Moat Durability, Channel Dependencies, and Regulatory Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              Iterative Health's competitive defensibility rests on a self-reinforcing data and operational loop between
              its clinical research site network and specialized algorithmic development. By embedding operational
              support, principal investigator training, and automated EHR pre-screening across more than one hundred
              community sites, the company creates operational switching costs for allied gastroenterology practices
              seeking profitable research ancillaries. Nevertheless, significant competitive and structural
              vulnerabilities exist. Commercially, SKOUT's total dependence on Provation for domestic distribution
              leaves market access vulnerable to channel partner realignment or competing AI module integrations.
              Operationally, independent diligence from AI Health Index identifies that Iterative Health publishes no
              external security attestations or explicit HIPAA business associate documentation covering its
              multi-continent patient record screening. Furthermore, as the company deploys Series C capital into
              cardiology and obesity, it must prove its AI pre-screening advantages transfer outside image-centric
              endoscopy into complex metabolic and cardiovascular trial designs.
            claimRefs:
              - CP007
              - CP010
              - CP013
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Structural Channel Dependency and Compliance Disclosure Gaps
            body: >-
              Iterative Health's reliance on Provation for domestic SKOUT distribution leaves its endoscopy hardware
              margin profile tied to a third-party channel partner, while the research network's rapid multi-specialty
              expansion exposes operations to institutional review board scrutiny without publicly verifiable security
              certifications or HIPAA attestations.
            calloutType: risk
            claimRefs:
              - CP007
              - CP013
          - type: callout
            title: Two-Sided Network Effect in Specialized Trial Recruitment
            body: >-
              By integrating proprietary AI-based endoscopic scoring with an embedded network of over one hundred
              clinical research sites and forty biopharma sponsor relationships, Iterative Health creates high switching
              costs against traditional SMOs that rely entirely on manual coordinator chart reviews.
            calloutType: strength
            claimRefs:
