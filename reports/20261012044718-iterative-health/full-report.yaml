  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Definitions, and Adjacent Spend
        blocks:
          - type: paragraph
            body: >-
              Iterative Health operates at the convergence of clinical trial site enablement, specialized patient
              recruitment, and artificial intelligence-assisted gastrointestinal diagnostics. The company's primary
              addressable market boundary encompasses biopharmaceutical clinical trial execution budgets and specialized
              site enablement services across gastroenterology, hepatology, obesity, and cardiology. This market
              category includes dedicated clinical research coordinators, study startup workflow acceleration, automated
              patient identification, and standardized endoscopic scoring for trial eligibility. It explicitly excludes
              full-service global contract research organization (CRO) study governance, centralized core-laboratory
              safety testing, hospital electronic health record enterprise licensing, and general endoscopy tower
              optical hardware procurement. In adjacent domains, Iterative Health commercializes SKOUT, an FDA-cleared
              computer vision device providing real-time polyp detection during outpatient screening colonoscopies. This
              dual-product footprint bridges outpatient diagnostic procedure suites and biopharma-sponsored clinical
              research protocols, creating a specialized hybrid market positioning distinct from purely software-based
              clinical trial management systems or conventional site management organizations.
            claimRefs:
              - CM003
              - CM004
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM013
      - number: '2.2'
        title: Multi-Lens Addressable Market Sizing and Constrained Potential
        blocks:
          - type: paragraph
            body: >-
              Sizing Iterative Health's addressable opportunity requires evaluating multiple commercial lenses rather
              than relying on an unconstrained global market figure. At the macroeconomic tier, biopharmaceutical
              sponsors incur substantial opportunity losses from operational development bottlenecks, with industry
              benchmarks indicating that over 90% of US-based clinical trials miss planned enrollment timelines and more
              than half of research sites enroll one or fewer patients per protocol. Company sponsor materials estimate
              the resulting cost of clinical trial delay at approximately $0.5 million in lost daily commercial revenue
              alongside $40,000 in daily operational execution expenditure. In the core inflammatory bowel disease (IBD)
              segment, a target US prevalence population exceeding 3 million individuals provides an expansive
              therapeutic development base, but patient eligibility remains constrained by protocol stringency.
              Following its $77 million Series C financing, Iterative Health expanded its target addressable boundaries
              beyond digestive diseases into obesity and cardiovascular trials. However, because the company maintains
              private financial disclosure and does not publicly report audited revenue or annual recurring revenue
              (ARR), direct sizing of its serviceable obtainable market (SOM) remains an analytical estimate bounded by
              private diligence.
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM008
              - CM014
