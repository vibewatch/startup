  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory Compliance, Device Clearance, and Health Data Governance
        blocks:
          - type: paragraph
            body: >-
              Iterative Health operates in a highly scrutinized regulatory and clinical environment across both its
              diagnostic software and clinical research businesses. On the medical device front, the company has secured
              FDA 510(k) clearance K213686 alongside five subsequent special 510(k) clearances extending through
              December 2025 for SKOUT, its real-time computer-aided lesion detection tool during white-light colonoscopy
              in adults under 21 CFR 876.1520. While these clearances validate the algorithmic technology as an
              assistive aid rather than a primary diagnostic interpreter, clinical trial testing revealed an average of
              22.55 false marks per 15-minute interval. This elevated false-mark rate presents meaningful automation
              bias and clinician alert fatigue risks during live procedures. More critically, an independent security
              and governance review reveals that Iterative Health has published no public confirmation of its HIPAA
              compliance posture, no standard product-level Business Associate Agreement terms, and no independent
              third-party security attestations such as SOC 2 Type II or ISO 27001. Because the company captures and
              processes live procedural video and clinical patient charts to screen trial participants across partner
              practices, this lack of documented data governance exposes enterprise health system buyers and trial
              sponsors to material compliance and enforcement liabilities.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
