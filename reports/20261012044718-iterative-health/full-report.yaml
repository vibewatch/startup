      - number: '4.4'
        title: Capital Adequacy, Cash Burn, and Diligence Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              Iterative Health has established substantial capital reserves to finance operations, securing $77 million
              in Series C equity financing in April 2026 co-led by Intrepid Growth Partners and GV (Google Ventures),
              with additional backing from EDBI, Insight Partners, and Obvious Ventures. Lifetime equity funding stands
              at $271 million across five completed rounds. The Series C injection was raised specifically to fund rapid
              geographical expansion across North America, Europe, India, and Australia, as well as therapeutic
              diversification beyond core gastroenterology into high-demand areas including metabolic
              dysfunction-associated steatohepatitis (MASH), obesity, and interventional cardiology. However, because
              ongoing capital expenditures, monthly net burn rate, and cash runway remain private, underwriting capital
              adequacy requires strict verification of site ramp costs. If multi-specialty site expansion requires
              significant upfront staffing and coordinator overhead before sponsor milestone billings ramp, cash burn
              could accelerate rapidly. Institutional investors must establish private diligence access to audited
              trailing financials, segmented contribution margins, and contractual revenue backlog before confirming
              software-tier valuation multiples.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI011
              - CI012
              - CI013
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital Intensity and Commercial Opacity Underwrite Stretched Valuation
            body: >-
              While Iterative Health successfully raised $77M in Series C financing in April 2026 at a reported $1.3B
              post-money valuation, the company maintains complete confidentiality regarding recognized revenue, ARR,
              gross margins, and customer acquisition costs. Without audited financial statements or segment-level unit
              economics, institutional underwriting must treat the business as an operationally intensive site-services
              network rather than a high-margin software platform.
