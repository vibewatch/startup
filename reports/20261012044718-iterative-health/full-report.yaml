      - What Would Change View
    rows:
      - - Network Scale
        - >-
          Over 100 clinical research sites provide centralized access to diverse patient populations and rapid trial
          startup.
        - Site network relies on community practices with potential churn and unverified long-term sponsor retention.
        - Disclosure of multi-year biopharma sponsor contract renewals and net revenue retention rates exceeding 110%.
      - - Trial Acceleration
        - Proprietary AI pre-screening drives 40% randomization uplift and 3.4x enrollment speed over industry averages.
        - Operational efficiencies may reflect site selection bias rather than generalizable technology advantage.
        - Peer-reviewed multicenter prospective validation of pre-screening algorithms across non-GI indications.
      - - Valuation Multiple
        - >-
          Unicorn valuation reflects premium multi-specialty clinical research infrastructure spanning GI, obesity, and
          cardiology.
        - $1.3B post-money price tag represents extreme multiple risk without disclosed ARR or positive unit economics.
        - Audited financial statements demonstrating greater than $100M ARR with gross margins above 65%.
      - - Regulatory & Compliance
        - SKOUT holds six FDA 510(k) clearances establishing medical device regulatory credibility.
        - >-
