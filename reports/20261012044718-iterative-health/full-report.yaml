      - number: '6.3'
        title: Retention Dynamics, Expansion Loops, and Customer Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Despite extensive named site deployments and documented operational acceleration metrics, Iterative Health
              exhibits critical customer concentration and disclosure gaps common to private clinical trial service
              networks. The company does not publicly disclose net revenue retention (NRR), gross revenue retention
              (GRR), annual churn rates, or average contract values (ACV) for either its biopharma sponsor contracts or
              its provider software subscriptions. Clinical trial sponsorship in pharmaceutical drug development is
              inherently project-based and tied to specific protocol phases; Phase 1b to Phase 3 trial cycles present
              natural renewal cliffs when trial programs complete or drug candidates fail in clinical development.
              Furthermore, while the network claims active engagements with over 40 global pharmaceutical sponsors and
              CROs, revenue is highly susceptible to concentration among top-tier gastrointestinal drug development
              programs. In the diagnostic hardware-software business, end-user retention is exposed to operator
              acceptance, workflow integration frictions, and the performance of its third-party exclusive distribution
              partner Provation.
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Dual-Engine Synergy Between Provider Enablement and Biopharma Demand
            body: >-
              Iterative Health's primary commercial moat is its high-performance site network that aligns provider
              revenue incentives with pharmaceutical trial timelines. By acting as an operational backbone rather than a
              traditional monitoring-only CRO, the company secures deep practice integration with leading GI groups like
              Gastro Health and GI Alliance.
            calloutType: strength
            claimRefs:
