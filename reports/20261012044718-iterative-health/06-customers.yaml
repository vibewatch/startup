    title: "Iterative Health Customer Adoption and Expansion Journey Map"
    type: "journey-map"
    summary: "Visualizes the dual-sided customer onboarding, operational integration, and enterprise expansion cycle across clinical providers and biopharma sponsors."
    data:
      items:
        - label: "1. Provider Network Alignment"
          summary: "Community GI practices and ASCs engage to establish or scale clinical trial operations as a profitable ancillary line."
          detail: "Practice evaluation, site feasibility screening, and alignment on trial operational infrastructure."
        - label: "2. Workflow & Technology Integration"
          summary: "Deployment of AI patient pre-screening, trial startup protocols, and SKOUT endoscopic detection systems."
          detail: "Endoscopy suite integration, CRC staffing support, regulatory management, and physician training."
        - label: "3. Biopharma Trial Protocol Matching"
          summary: "Biopharmaceutical sponsors and CROs contract network capacity for specific Phase 1b-4 clinical protocols."
          detail: "Centralized contracting, rapid budgeting, and IRB alignment across qualified network sites."
        - label: "4. Accelerated Trial Execution"
          summary: "Active patient recruitment, automated pre-screening, and standardized endoscopic scoring."
          detail: "Delivers 2X faster activation, 3X higher enrollment per site, and reliable protocol adherence."
        - label: "5. Multi-Specialty Network Expansion"
          summary: "Sponsors expand trial bookings across therapeutic areas while provider practices extend to cardiometabolic studies."
          detail: "Expansion from GI into hepatology, obesity (GLP-1), and cardiology clinical trials."
        - label: "6. Enterprise Program Scaling"
          summary: "Conversion of successful single-protocol site deployments into multi-year programmatic enterprise research alliances."
          detail: "Long-term capacity commitments, expanded community physician onboarding, and centralized data management across site networks."
    approximationNotes: "Journey stages model the structured dual-sided network loop between site enablement and pharmaceutical sponsor trial contracting."
