  title: "Customers"
  summary: "Iterative Health operates a dual-engine commercial model serving biopharma clinical trial sponsors through an embedded site network and endoscopy provider organizations through AI diagnostic software. Real-world commercial traction is concentrated in multi-site research agreements across gastroenterology practices, while biopharma concentration and long-term diagnostic software retention metrics remain undisclosed."
sections:
  - id: "customer-segmentation-and-commercial-engines"
    title: "Customer Segmentation and Commercial Engine Dynamics"
    body: "Iterative Health addresses two distinct buyer populations across clinical trial execution and endoscopic diagnostics. On the clinical research side, the company's primary economic buyers are pharmaceutical and biotechnology sponsors—alongside partner contract research organizations (CROs)—seeking accelerated patient recruitment and standardized disease activity scoring for complex clinical trials. The service proposition centers on reducing study startup delays and trial failure risks in inflammatory bowel disease (IBD) and adjacent cardiometabolic indications. The counterpart to this sponsor-facing engine is the provider research network, comprising community-based gastroenterology practices, specialized ambulatory surgery centers (ASCs), and health systems that host clinical trials as profitable clinical ancillaries. On the diagnostic technology side, Iterative Health targets gastroenterology practices and endoscopy suites with SKOUT, an FDA-cleared computer-aided polyp detection tool distributed via Provation. While these two commercial surfaces share underlying clinical domain expertise in gastroenterology, their procurement pathways, value propositions, and economic incentives operate largely independently."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "adoption-trajectory-and-named-deployments"
    title: "Adoption Trajectory and Named Network Deployments"
    body: "Iterative Health's commercial deployment model has evolved from single-site clinical trial software pilots into an enterprise network spanning more than 100 community and health system research sites globally. Primary customer proof is anchored by marquee multi-specialty physician networks, most notably Gastro Health—a nationwide medical group spanning over 380 physicians across seven states—which deployed Iterative Health's AI Recruitment (AIR) platform to standardize trial enrollment in IBD trials. Additional named clinical research partners include GI Alliance, Tyler Research Institute, One GI, and US Heart & Vascular. These enterprise deployments demonstrate that community-based clinical groups are willing to integrate Iterative Health's operational and software stack into everyday clinical workflows. Furthermore, the network has demonstrated cross-specialty adoption, expanding from core gastroenterology and hepatology into obesity and cardiology clinical programs."
    claimRefs:
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU011"
    tableRefs:
      - "TU002"
      - "TU003"
  - id: "retention-expansion-and-concentration-vulnerabilities"
    title: "Retention Dynamics, Expansion Loops, and Customer Concentration Risks"
    body: "Despite extensive named site deployments and documented operational acceleration metrics, Iterative Health exhibits critical customer concentration and disclosure gaps common to private clinical trial service networks. The company does not publicly disclose net revenue retention (NRR), gross revenue retention (GRR), annual churn rates, or average contract values (ACV) for either its biopharma sponsor contracts or its provider software subscriptions. Clinical trial sponsorship in pharmaceutical drug development is inherently project-based and tied to specific protocol phases; Phase 1b to Phase 3 trial cycles present natural renewal cliffs when trial programs complete or drug candidates fail in clinical development. Furthermore, while the network claims active engagements with over 40 global pharmaceutical sponsors and CROs, revenue is highly susceptible to concentration among top-tier gastrointestinal drug development programs. In the diagnostic hardware-software business, end-user retention is exposed to operator acceptance, workflow integration frictions, and the performance of its third-party exclusive distribution partner Provation."
    claimRefs:
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"
