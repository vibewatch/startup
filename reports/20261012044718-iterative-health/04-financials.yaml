company:
  name: Iterative Health
chapter:
  number: 4
  title: Financials
  summary: Iterative Health operates as a hybrid healthcare enterprise combining an FDA-cleared computer-aided endoscopy detection software device with a clinical research site network that spans over 100 partner facilities. The company closed a $77 million Series C financing round in April 2026 at a reported $1.3 billion valuation, bringing total equity funding to $271 million. However, because recognized revenue, ARR, gross margins, and customer acquisition costs remain strictly undisclosed private data, institutional underwriting must treat the core business as an operationally intensive clinical services network rather than a high-margin software enterprise.
sections:
  - id: revenue-streams-and-pricing-model
    title: Revenue Streams, Commercial Monetization, and Pricing Dynamics
    body: 'Iterative Health commercializes two distinct offerings across healthcare and life sciences: a clinical trial site network and an FDA-cleared colonoscopy artificial intelligence device known as SKOUT. The primary commercial growth driver is the clinical research site network, which contracts directly with pharmaceutical sponsors, biotechnology firms, and contract research organizations to accelerate clinical trial execution across gastroenterology, hepatology, obesity, and cardiology indications. Under this business line, Iterative Health captures milestone-based trial management fees, study startup revenues, and patient randomization success fees. For participating healthcare provider practices such as GI Alliance and OneGI, Iterative Health operates as an outsourced trial infrastructure partner that enables community clinics to offer clinical research as an operationally profitable ancillary service, sharing economics via negotiated rate cards. Meanwhile, commercial distribution of the SKOUT polyp detection software in the United States is handled through an exclusive partnership with Provation, which markets the tool as an integrated software add-on for endoscopy suites. Realized pricing, software license ARR, and sponsor fee schedules remain closely held private data.'
    claimRefs:
      - CI001
      - CI005
      - CI006
      - CI007
      - CI008
      - CI009
    tableRefs:
      - TI001
      - TI002
  - id: cost-structure-and-delivery-economics
    title: Cost Structure, Delivery Economics, and Margin Drivers
    body: The operational cost profile of Iterative Health is heavily weighted toward decentralized clinical operations, specialized trial staffing, and regulatory coordination. Unlike a pure-play software vendor whose cost of goods sold is dominated by cloud hosting and model inference infrastructure, Iterative Health embeds dedicated clinical research coordinators, regulatory managers, and study support staff directly across its global site network. The company reports over 250 employees worldwide across offices in Cambridge, New York, Dallas, and San Francisco, having expanded from approximately 75 employees in late 2021. This personnel footprint drives substantial operating expenses in payroll, site training retreats, protocol management, and sponsor relationship management. Furthermore, while proprietary artificial intelligence tools automate patient pre-screening and image interpretation, human clinicians and coordinators remain indispensable for patient consent, trial protocol execution, and data reporting. Consequently, independent assessments emphasize that Iterative Health operates fundamentally as a specialized clinical services organization, where gross margins are structurally constrained to professional services levels rather than software benchmarks.
    claimRefs:
      - CI006
      - CI010
      - CI013
      - CI014
    figureRefs:
      - FI001
  - id: public-traction-and-unit-economics
    title: Public Commercial Traction, Valuation Disconnect, and Unit Economics
    body: 'Publicly visible commercial traction for Iterative Health is defined by site network scale, clinical partnerships, and venture capital financing milestones rather than disclosed financial statements. The company cites partnerships with over 40 global sponsors and contract research organizations, alongside network relationships with prominent multi-specialty physician practices including GI Alliance, OneGI, and U.S. Heart & Vascular. Official materials report operational metrics including 2x faster site activation and 3.4x higher patient enrollment rates versus industry baselines. However, neither audited revenue, annual recurring revenue (ARR), gross profit margins, nor unit economics per partner site are publicly reported. Private market tracking estimates post-money valuation at $1.3 billion following the April 2026 Series C round, implying a high forward valuation multiple against unverified commercial revenues. For prospective investors, this absence of unit economics creates a major diligence gap: without visibility into revenue per active site, customer acquisition costs, or provider profit-sharing take-rates, the enterprise cannot be underwritten on verifiable cash contribution.'
    claimRefs:
      - CI002
      - CI004
      - CI010
      - CI011
      - CI013
      - CI014
    tableRefs:
      - TI003
  - id: capital-adequacy-and-underwriting-verdict
    title: Capital Adequacy, Cash Burn, and Diligence Underwriting Verdict
    body: Iterative Health has established substantial capital reserves to finance operations, securing $77 million in Series C equity financing in April 2026 co-led by Intrepid Growth Partners and GV (Google Ventures), with additional backing from EDBI, Insight Partners, and Obvious Ventures. Lifetime equity funding stands at $271 million across five completed rounds. The Series C injection was raised specifically to fund rapid geographical expansion across North America, Europe, India, and Australia, as well as therapeutic diversification beyond core gastroenterology into high-demand areas including metabolic dysfunction-associated steatohepatitis (MASH), obesity, and interventional cardiology. However, because ongoing capital expenditures, monthly net burn rate, and cash runway remain private, underwriting capital adequacy requires strict verification of site ramp costs. If multi-specialty site expansion requires significant upfront staffing and coordinator overhead before sponsor milestone billings ramp, cash burn could accelerate rapidly. Institutional investors must establish private diligence access to audited trailing financials, segmented contribution margins, and contractual revenue backlog before confirming software-tier valuation multiples.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI011
      - CI012
      - CI013
tables:
  - id: TI001
    title: Revenue Streams and Commercial Monetization Architecture
    columns:
      - Revenue Stream
      - Commercial Mechanism
      - Pricing / Volume Unit
      - Current Status & Scale
      - Revenue Quality & Predictability
      - Diligence Information Request
    rows:
      - - Clinical Trial Site Network Execution
        - Per-trial milestone and study startup fees paid by biopharma sponsors and CROs
        - Per active trial site / study protocol
        - Active across 100+ global sites in GI, hepatology, obesity, and cardiology
        - Recurring project-based services; subject to clinical trial enrollment timelines
        - Provide backlog of contracted study value and weighted pipeline conversion rate.
      - - AI-Enabled Patient Pre-Screening & Recruitment
        - Per-screened patient or successful randomization success fee from trial sponsors
        - Per randomized patient or completed trial cohort
        - Deployed across partner networks including GI Alliance and OneGI
        - Variable volume-dependent fees tied to clinical trial recruitment phases
        - Disclose historical randomization success rates and realized revenue per randomized candidate.
      - - SKOUT Colonoscopy AI Detection System
        - Annual software subscription / device license for computer-aided polyp detection
        - Per endoscopy suite or active procedural room per year
        - FDA 510(k) cleared; commercialized in US via Provation partnership
        - High-margin recurring SaaS / software license with predictable renewal characteristics
        - Provide ARR breakdown for SKOUT, active suite footprint, and Provation net realization.
      - - AI-Enabled Endoscopic Documentation
        - Software workflow add-on co-developed with Provation for procedure reporting
        - Per provider seat or procedure documentation volume
        - In development / early commercialization with Provation
        - Recurring software license potential; currently pre-scale
        - Request commercial launch roadmap, pilot hospital feedback, and co-development revenue split.
    notes: Iterative Health does not disclose public revenue disaggregation by stream; commercial mechanisms and scale parameters are compiled from official sponsor and provider collateral, partnership announcements, and independent vendor profiles.
    claimRefs:
      - CI005
      - CI006
      - CI007
      - CI008
  - id: TI002
    title: Commercial Pricing Structure, Monetization Models, and Channel Terms
    columns:
      - Product / Service Offering
      - Contract & Monetization Unit
      - List vs. Realized Pricing Structure
      - Discounts, Bundling & Unknowns
      - Source & Verification Level
    rows:
      - - Site Network Trial Operations
        - Master Services Agreement (MSA) with task order milestone fee schedule
        - Custom enterprise rate cards based on trial phase, therapeutic complexity, and study duration
        - Volume-based sponsor tier discounts; provider site profit-sharing splits not disclosed
        - Official provider and sponsor publications; contract rate cards remain confidential
      - - AI Clinical Trial Recruitment (AI-R)
        - Success fee per patient randomized plus protocol setup implementation fees
        - Tiered fee based on disease indication complexity (e.g., IBD, MASH, heart failure)
        - Potential bundling with broader site network trial management packages
        - Official company press announcements and independent AI vendor indexes
      - - SKOUT Polyp Detection AI Device
        - Annual capital lease or software license fee distributed via Provation
        - List pricing undisclosed; sold as enterprise endoscopy software add-on
        - Enterprise discounts for multi-center health systems and ASC endoscopy suites
        - Independent evaluation (AI Health Index) and FDA regulatory documentation
      - - Provider Ancillary Program Integration
        - Revenue-sharing model on study margin and ancillary facility billing
        - Premium rate cards negotiated centrally by Iterative Health for member sites
        - Unknown operational fee withholdings by Iterative Health for centralized staffing
        - Official provider portal documentation; specific take-rates require private audit
    notes: Commercial pricing schedules and realized contract values are proprietary and confidential; entries reflect disclosed contracting models and independent vendor reviews.
    claimRefs:
      - CI005
      - CI006
      - CI007
      - CI008
      - CI009
  - id: TI003
    title: Unit Economics, Margin Profiles, and Diligence Benchmark Indicators
    columns:
      - Financial & Operating Metric
      - Reported / Estimated Value
      - Confidence Level
      - Underwriting Relevance & Strategic Rationale
      - Diligence Information Request
    rows:
      - - Annual Recurring Revenue (ARR) / Run-Rate
        - Undisclosed (Estimated private)
        - Low
        - Critical baseline to evaluate whether the $1.3B valuation reflects a 10x-20x software multiple or lower services multiple
        - Provide historical audited ARR, ARR growth rate, and committed contract backlog under NDA.
      - - Gross Margin (Blended Network vs. Software)
        - 'Undisclosed (Services: 35%-50%; Software: 75%-85% benchmark)'
        - Low
        - Differentiates labor-intensive clinical site management from scalable medical imaging software gross contribution
        - Deliver gross margin schedule segmented by clinical site services versus SKOUT software licensing.
      - - Revenue per Partner Research Site
        - Undisclosed (Industry benchmark $200k-$500k annual trial throughput)
        - Low
        - Measures unit productivity and monetization depth across the 100+ partner clinical site network
        - Provide trailing 12-month revenue distribution by active research site and cohort tenure.
      - - Customer Acquisition Cost (CAC) & Payback
        - Undisclosed (High-touch biopharma enterprise sales cycles 6-12 months)
        - Low
        - Assesses GTM sales efficiency and capital requirements to expand into cardiology and obesity
        - Request sales efficiency metrics, biopharma account acquisition costs, and net revenue retention (NRR).
    notes: Financial values are not publicly disclosed by Iterative Health; benchmark ranges and confidence assessments reflect independent analyst evaluations and private market reporting.
    claimRefs:
      - CI002
      - CI006
      - CI010
      - CI011
      - CI013
figures:
  - id: FI001
    title: Iterative Health Revenue Model Bridge and Commercial Value Flow
    type: flow
    summary: End-to-end commercial flow illustrating how biopharma sponsor trial demand converts into site network activity, milestone billing, and operating contribution.
    data:
      nodes:
        - id: sponsors
          label: Biopharma & CRO Trial Demand
          description: Pharmaceutical sponsors contract trial protocols across GI, hepatology, obesity, and cardiology indications.
        - id: network
          label: Community Provider Site Network
          description: Over 100 research sites in partner provider networks (e.g., GI Alliance, OneGI) activated as clinical research ancillaries.
        - id: ai-screening
          label: AI Pre-Screening & Candidate Identification
          description: Proprietary AI and coordinator teams pre-screen patient records and endoscopic imaging to identify eligible trial candidates.
        - id: enrollment
          label: Patient Enrollment & Study Execution
          description: Sites enroll patients and execute trial protocol visits, delivering accelerated startup and 3.4x enrollment uplift.
        - id: billing
          label: Milestone Billing & Revenue Recognition
          description: Sponsors pay milestone-based trial execution fees and patient randomization success fees.
        - id: distribution
          label: Provider Profit Share & Company Margin
          description: Iterative Health distributes ancillary revenue to provider practices and retains gross operating margin after staffing costs.
      edges:
        - from: sponsors
          to: network
          label: Trial study allocation and protocol contracting
        - from: network
          to: ai-screening
          label: Patient chart access and procedural endoscopy feeds
        - from: ai-screening
          to: enrollment
          label: Validated patient recruitment candidate pipeline
        - from: enrollment
          to: billing
          label: Completed protocol visits and randomization milestones
        - from: billing
          to: distribution
          label: Revenue collection and ancillary profit-sharing allocation
    approximationNotes: Flow architecture models the commercial interactions and fee flows documented across official sponsor and provider materials, as well as independent industry vendor assessments.
