company:
  name: "Iterative Health"
chapter:
  number: 3
  title: "Competitors"
  summary: "Iterative Health bridges two distinct competitive arenas by combining an FDA-cleared colonoscopy CADe device with an international network of over 100 clinical research sites. While traditional CADe hardware peers like Medtronic face hospital capital sales friction and conventional SMOs suffer from manual recruitment bottlenecks, Iterative Health's dual model creates proprietary data moats but introduces commercial channel dependency on Provation and heightened compliance exposure."
sections:
  - id: "competitive-landscape"
    title: "Competitive Landscape Across Endoscopy AI and Clinical Research Networks"
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP003"
      - "CP004"
      - "CP010"
      - "CP014"
    figureRefs:
      - "FP001"
    body: >-
      Iterative Health occupies an unconventional competitive position by spanning two historically separate markets: medical device computer-aided detection (CADe) software and decentralized clinical research site operations. In gastroenterology diagnostic imaging, the company commercializes SKOUT, an artificial intelligence tool cleared for real-time colorectal polyp detection during screening colonoscopy. Concurrently, the firm operates a performance-driven clinical trial network comprising more than one hundred specialized research sites across North America, Europe, India, and Australia. Following a $77 million Series C funding round in May 2026 led by Google Ventures and Intrepid Growth Partners, Iterative Health is actively scaling this clinical research network beyond gastroenterology and hepatology into high-growth therapeutic areas including obesity and cardiology. This multi-specialty expansion differentiates the company from pure-play medical device vendors and traditional contract research organizations by embedding proprietary screening algorithms directly into routine provider workflows.
  - id: "competitor-archetypes"
    title: "Competitor Archetypes and Category Dynamics"
    claimRefs:
      - "CP001"
      - "CP003"
      - "CP004"
      - "CP008"
      - "CP009"
      - "CP010"
    tableRefs:
      - "TP001"
    body: >-
      The competitive landscape surrounding Iterative Health stratifies into four primary archetypes: incumbent CADe medical device manufacturers, specialized diagnostic startups, clinical site management organizations (SMOs), and global contract research organizations (CROs). In endoscopic detection, global medical technology leaders such as Medtronic with its GI Genius platform dominate hospital and ambulatory surgery center installations through established capital sales channels. Meanwhile, earlier-stage diagnostic innovators including Alimetry and Suzhou Huiwei focus narrowly on non-invasive gastric electrogastrography or regional screening algorithms without clinical trial recruitment infrastructure. In trial execution, traditional SMOs and site networks like Velocity Clinical Research and CareAccess operate extensive physical clinic footprints but rely on labor-intensive manual coordinator screening. Iterative Health targets this systemic trial friction—where over half of standard research sites enroll zero or one patient per protocol—by offering over forty biopharma and CRO partners automated pre-screening and standardized image scoring across its allied community provider footprint.
  - id: "capability-and-commercial-comparison"
    title: "Capability Comparison and Commercial Contracting Structures"
    claimRefs:
      - "CP004"
      - "CP005"
      - "CP006"
      - "CP007"
      - "CP011"
      - "CP012"
    tableRefs:
      - "TP002"
      - "TP003"
    body: >-
      A structural comparison of technical capabilities highlights Iterative Health's differentiated focus on procedural standardization and trial acceleration. In clinical endoscopy, SKOUT has secured six FDA 510(k) clearances through late 2025 and demonstrated a 27 percent relative increase in adenoma detection per colonoscopy in its prospective registration trial published in Gastroenterology. Beyond polyp detection, the company develops computer vision software that analyzes endoscopic video to generate objective, standardized disease severity scores for inflammatory bowel disease (IBD) trials, directly mitigating the inter-observer variability that historically impedes sponsor patient enrollment. Commercially, SKOUT is sold across the United States through an exclusive distribution partnership with Provation, integrating into standard endoscopy documentation software. However, neither Iterative Health nor Provation publishes standardized rate cards or per-procedure license fees. Similarly, sponsor pricing for clinical trial acceleration services is negotiated confidentially on a study-by-study performance basis, obscuring underlying gross margins and unit realization.
  - id: "moat-durability-and-risks"
    title: "Moat Durability, Channel Dependencies, and Regulatory Vulnerabilities"
    claimRefs:
      - "CP007"
      - "CP010"
      - "CP013"
      - "CP014"
    body: >-
      Iterative Health's competitive defensibility rests on a self-reinforcing data and operational loop between its clinical research site network and specialized algorithmic development. By embedding operational support, principal investigator training, and automated EHR pre-screening across more than one hundred community sites, the company creates operational switching costs for allied gastroenterology practices seeking profitable research ancillaries. Nevertheless, significant competitive and structural vulnerabilities exist. Commercially, SKOUT's total dependence on Provation for domestic distribution leaves market access vulnerable to channel partner realignment or competing AI module integrations. Operationally, independent diligence from AI Health Index identifies that Iterative Health publishes no external security attestations or explicit HIPAA business associate documentation covering its multi-continent patient record screening. Furthermore, as the company deploys Series C capital into cardiology and obesity, it must prove its AI pre-screening advantages transfer outside image-centric endoscopy into complex metabolic and cardiovascular trial designs.
