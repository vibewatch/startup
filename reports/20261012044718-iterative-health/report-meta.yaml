companyProfile:
  summary: >-
    Iterative Health is a Cambridge-based healthcare technology and services company founded in 2017 that combines an
    AI-enabled clinical research site network with FDA-cleared endoscopy software. The business serves biopharma
    sponsors, CROs, and provider networks across gastroenterology and adjacent specialties, with a public operating
    footprint that now extends beyond GI into cardiology, obesity, and hepatology. Despite clear evidence of commercial
    traction and regulatory progress, the company still does not disclose audited revenue, ARR, gross margins, or cash
    burn.
