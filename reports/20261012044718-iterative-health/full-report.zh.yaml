chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与混合业务模式
        blocks:
          - type: paragraph
            body: >-
              Iterative Health 的法定注册名为 Iterative Scopes, Inc.，总部位于 Massachusetts 州 Cambridge 和 New York City。公司成立于 2017
              年，最初专注于把计算机视觉和机器学习算法用于胃肠内窥镜。2022 年 10 月，公司正式从 Iterative Scopes 更名为 Iterative
              Health，战略上从诊断医学影像拓展到临床试验基础设施和招募服务。如今公司有两条独立商业线：获 FDA 许可的计算机辅助检测设备 SKOUT，以及嵌入式多专科临床研究站点网络，覆盖北美、欧洲、印度和澳大利亚
              100 多家合作机构。SKOUT 在美国通过与 Provation 的独家分销合作商业化；临床试验网络则直接与生物制药赞助方和合同研究组织签约，加速胃肠病学、肝病学、肥胖和心脏病学试验中的患者识别与入组。
            claimRefs:
              - CO001
              - CO007
              - CO008
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO006
              - CO008
              - CO011
              - CO012
      - number: '1.2'
        title: 高管领导、治理结构与创始人—市场匹配
        blocks:
          - type: paragraph
            body: >-
              Iterative Health 由创始人兼首席执行官 Jonathan Ng 医生（MBBS）领导。他是医生和 MIT 校友，主导了公司用于胃肠临床研究的核心机器学习应用。 Ng
              医生既是核心战略愿景负责人，也是运营权威；创始人—市场匹配度高，但公司战略、融资和临床方案开发也因此高度依赖关键个人。2026 年 4 月 C 轮融资后，公司董事会和治理体系明显扩张。Intrepid
              Growth Partners 联合创始人兼合伙人 Ajay Agrawal 加入董事会，担任有表决权董事， 带来 AI 商业化和行业系统重构经验。同一时期，GV（Google
              Ventures）普通合伙人、执业心脏病专家 Anthony Philippakis 医生加入董事会担任观察员，
              增强了公司的技术深度及其在生物制药生态中的战略关系。治理监督由风险投资赞助方与专业学术、临床领域顾问共同构成。
            claimRefs:
              - CO001
              - CO009
              - CO010
          - type: table
            tableRef: TO002
            claimRefs:
              - CO009
              - CO010
      - number: '1.3'
        title: 资本化轨迹、估值基准与投资者基础
        blocks:
          - type: paragraph
            body: >-
              Iterative Health 自成立以来完成四轮机构股权融资，累计股权资本约 $270.3 million。早期机构融资始于 2020 年 1 月的 $13.25 million Pre-Series
              A，投后估值为 $29.43 million；随后是 2021 年 8 月的 $30 million Series A-1，投后估值 $133.45 million。2022 年 1 月， 公司完成由
              Clearlake Capital Group 和 Insight Partners 共同领投的 $150 million Series B，投后估值 $704.24 million。2026 年 4 月，
              Iterative Health 通过完成由 Intrepid Growth Partners 和 GV 共同领投的 $77 million Series C，达到独角兽地位；EDBI 新加入， Insight
              Partners 和 Obvious Ventures 继续参投，投后估值达到 $1.3 billion。Planet First Partners 随后于 2026 年 6 月投入后续战略增长股权。
              尽管资本规模大幅增长，清算优先权、优先级债务分层、二级股票出售等详细资本化机制仍严格保密；收入、ARR、毛利率和净现金消耗等经审计财务指标也未披露。
            claimRefs:
              - CO002
              - CO003
              - CO004
              - CO005
              - CO012
