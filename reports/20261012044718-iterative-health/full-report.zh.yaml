  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管合规、设备许可与健康数据治理
        blocks:
          - type: paragraph
            body: >-
              Iterative Health 的诊断软件和临床研究业务都处于高度审查的监管与临床环境。医疗器械方面，公司为 SKOUT 获得 FDA 510(k) 许可 K213686， 并截至 2025 年 12
              月取得五项后续特别 510(k) 许可；SKOUT 是依据 21 CFR 876.1520、在成人白光结肠镜中实时检测病灶的计算机辅助工具。
              这些许可证明算法技术可作为辅助工具，而非主要诊断解释器；但临床试验显示，每 15 分钟平均出现 22.55 个错误标记。错误标记率偏高，给实时操作带来自动化偏差和临床医生警报疲劳风险。
              更关键的是，独立安全与治理审查显示，Iterative Health 未公开确认 HIPAA 合规状态，没有标准产品级商业伙伴协议条款，也没有 SOC 2 Type II 或 ISO 27001
              等独立第三方安全证明。 公司会捕获并处理实时操作视频和临床患者病历，用于在合作诊所筛选试验参与者；数据治理缺乏记录，使医疗系统买方和试验赞助方暴露于重大合规与执法责任。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: 运营执行、算法监督与临床工作流可靠性
        blocks:
          - type: paragraph
            body: >-
              Iterative Health 的运营骨干依赖 AI 软件与社区内窥镜室及门诊手术中心临床工作流的整合。主要运营风险来自真实环境下内窥镜医生行为差异和算法监督。 SKOUT
              在试验环境中灵敏度较高，但医生会受到假阳性实时干扰；如果内窥镜医生在繁忙操作排程中关闭软件，长期临床采用可能受损。同时，Iterative Health 的临床研究网络部署专有机器学习预筛查工具，
              评估患者记录是否符合试验资格，并声称患者随机化提升 40%。但这些预筛查算法没有公开临床验证或人口亚组公平性基准，带来方案漂移或招募不具代表性的风险。
              此外，胃肠临床试验在运营上仍很脆弱：公司引用的行业数据称，超过 50% 的传统研究站点入组 0 或 1 名患者，超过 90% 错过时间表，延误使生物制药赞助方每天承担估计 $40K 运营成本。跨 110
              多个站点扩张试验运营，需要大量协调员和持续培训，网络因此容易受到协调员流失、站点层面方案不合规和药企数据共享阻力影响。
            claimRefs:
              - CR002
              - CR007
              - CR008
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR007
              - CR008
      - number: '7.3'
        title: 商业渠道集中与医疗服务网络依赖
        blocks:
          - type: paragraph
            body: >-
              Iterative Health 在商业和运营上高度依赖外部渠道合作伙伴及医疗服务机构。其旗舰诊断软件 SKOUT 在美国的商业化完全依靠与 Provation
              的企业分销合作。因此，软件销售速度、合同续签和客户关系控制都由第三方厂商而非直销企业销售团队主导，公司面临分销商优先级变化和重新议价压力。与此同时，公司研究网络的扩张取决于能否锁定大型区域性独立医疗机构网络和管理服务组织（MSO）。公司与
              Gastroenterology Associates of New Jersey（GANJ）的合作，把研究基础设施接入 28 个社区诊所。MSO
              合作能迅速扩大地域覆盖和患者多样性，但也带来突出的伙伴集中风险：一旦失去或失去一家大型多点诊所伙伴的参与，临床试验产能和对申办方的交付能力都会直接下降。2026 年 C 轮融资后，Intrepid Growth
              Partners 联合创始人 Ajay Agrawal 加入董事会，治理监督有所加强；但公司能否持续执行，仍取决于能否让分散在各社区诊所的医生研究者保持积极参与。
            claimRefs:
              - CR004
              - CR006
              - CR009
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR006
