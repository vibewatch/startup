      - number: '3.3'
        title: 能力对比与商业签约结构
        blocks:
          - type: paragraph
            body: >-
              技术能力的结构性比较凸显 Iterative Health 对流程标准化和试验加速的差异化聚焦。临床内窥镜方面，SKOUT 截至 2025 年底已获得六项 FDA 510(k) 许可， 其发表于
              Gastroenterology 的前瞻性注册试验显示，每次结肠镜检查的腺瘤检出率相对提高 27%。除息肉检测外，公司还开发计算机视觉软件，分析内窥镜视频，
              为炎症性肠病（IBD）试验生成客观、标准化的疾病严重程度评分，直接缓解历史上阻碍赞助方患者入组的观察者间差异。商业上，SKOUT 通过与 Provation 的独家分销合作在美国销售，
              并接入标准内窥镜记录软件。然而，Iterative Health 和 Provation 都未公布标准费率表或按操作计收的许可费。同样，临床试验加速服务的赞助方定价按单项研究、基于绩效保密协商，
              使底层毛利率和单位变现情况不可见。
