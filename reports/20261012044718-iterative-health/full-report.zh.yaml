              标准化疾病活动评分。服务价值主张是降低炎症性肠病（IBD）及相邻心脏代谢适应症的研究启动延误和试验失败风险。与赞助方面向引擎相对应的是医疗服务研究网络，
              由社区胃肠诊所、专业门诊手术中心（ASC）和把临床试验作为盈利性增值服务的医疗系统组成。诊断技术侧则面向胃肠诊所和内窥镜室销售 SKOUT， 这是一款由 Provation 分销的获 FDA
              许可计算机辅助息肉检测工具。两条商业表面共享胃肠病学临床专长，但采购路径、价值主张和经济激励基本独立。
