      - number: '5.4'
        title: 技术依赖、数据治理与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              尽管 SKOUT 的临床试验指标和监管验证具有吸引力，Iterative Health 仍面临重大技术依赖、数据治理障碍和企业尽调缺口。产品路线图显示，公司与临床软件供应商 Provation 合作开发 AI
              Documentation，希望从视频自动生成结构化操作记录；但商业化时间表、产品成熟度以及与非 Provation 电子病历系统的整合深度仍未验证。
              更深层技术挑战在于能否获得高质量训练数据。公司技术评论指出，生物制药赞助方和医疗系统经常不愿汇集专有试验数据，给训练稳健、跨人群视觉算法制造人为障碍。 此外，不同设备线（如
              Olympus、Pentax、Fujifilm）的内窥镜视频质量、照明伪影和镜头运动存在差异，可能造成领域偏移，使模型在严格校准的试验环境之外灵敏度下降。 企业安全方面，公开披露没有第三方验证 SOC 2
              Type II 控制、ISO 27001 认证或云端视频传输的详细 HIPAA 数据隔离机制。要补齐这些尽调缺口，需要审查模型校准数据集、 硬件兼容性矩阵和独立网络安全审计包。
