      - number: '5.2'
        title: 技术架构与运营模式
        blocks:
          - type: paragraph
            body: >-
              Iterative Health 的底层架构把不依赖硬件品牌的临床视频采集、分布式机器学习推理和集中式站点赋能流程连在一起。操作层面，平台直接从标准内窥镜处理器输出采集高清视频，
              不要求替换专有内窥镜硬件。专有卷积和视觉神经网络跨连续帧分析黏膜表面，评估二十多项临床特征，包括黏膜红斑、血管纹理消失、溃疡、出血和糜烂。 为从单点诊断方案转向完整研究运营模式，Iterative Health
              把算法核心接到自动预筛查引擎和集中运营中枢。预筛查管线扫描合作门诊手术中心的临床排班和电子病历，
              在操作日期前识别潜在试验参与者。集中运营团队负责研究启动、监管申报、方案培训和临床研究协调员（CRC）配置，让社区诊所运营高绩效临床试验增值服务。 技术与临床领导层包括 MIT CSAIL 教授、AI 主席
              Polina Golland，芝加哥大学 IBD 主席 David Rubin 医生，以及 GI Alliance 首席医疗官 Casey Chapman 医生。
              这种多层运营模式支持胃肠病学、肝病学、肥胖和心脏病学四个治疗方向的临床试验。
