  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心运营假设
      - 估值 / 回报逻辑
      - 主要下行风险
      - 概率信号
    rows:
      - - 乐观情景
        - ARR 借助心脏代谢领域扩张超过 $150M；毛利率超过 70%；SKOUT 在主要内镜检查室成为护理标准。
        - $150M ARR 适用 15.0x EV/ARR 倍数，对应 $2.25B 退出估值（1.7x MOIC，按 C 轮入场计算 IRR 为 20%）。
        - 临床数据共享受到监管审查；生物制药试验预算收缩。
        - 低（20%）：需要跨专科执行毫无瑕疵且财务规模透明。
      - - 基准情景
        - ARR 温和增长至 $80M–$100M；研究网络仍集中于胃肠病学；技术赋能服务的利润率稳定在约 50%–55%。
        - 8.0x–10.0x EV/ARR 倍数对应 $640M–$1.0B 估值（0.5x–0.8x MOIC；估值持平至下跌）。
        - 技术赋能服务倍数压缩；客户集中于头部 CRO 合作伙伴。
        - 中（55%）：反映混合型临床站点管理模式的历史轨迹。
      - - 悲观情景
        - 增长停滞，ARR 低于 $50M；高昂的站点支持成本将利润率压低至 40% 以下；合规障碍阻断生物制药企业主协议。
        - 4.0x EV/ARR 的困境出售，或以 $200M–$300M 估值进行资本重组（0.15x–0.25x MOIC；资本严重受损）。
        - 高级清算优先权吞噬普通股和早期轮次；客户转向传统 SMO。
        - 偏高（25%）：估值悬垂且缺乏有据可查的单位经济性，因此风险很大。
    notes: 回报倍数与 EV/ARR 比率以 C 轮 $1.3B 投后估值为模型基础。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV010
      - CV012
