      - number: '5.3'
        title: 临床绩效基准与网络规模
        blocks:
          - type: paragraph
            body: >-
              胃肠医学临床研究执行面临严重结构性摩擦，行业入组率在过去二十年下降超过 70%。Iterative Health 的软硬结合服务模式试图把算法化患者识别与标准化站点运营结合起来， 扭转这一趋势。在 2026 年
              Digestive Disease Week（DDW），公司报告了针对溃疡性结肠炎和克罗恩病适应症随机对照试验的更新多中心表现数据。美国和欧洲站点队列历经两年评估后， 网络在 2 期和 3
              期研究中实现每项研究每站点每月 0.33 名患者的随机化率，高于公开行业基准 0.10 名的三倍以上。四项完全入组试验中， 网络保持全球中位随机化率每站点每月 0.32
              名患者，说明整个试验生命周期的招募速度稳定，而非短期前置冲高。Iterative Health 将这一速度归因于专有 AI 预筛查工具， 该工具报告患者随机化提升
              40%，同时为研究团队节省数千小时人工查阅病历时间。与 Gastro Health 150 个地点全网部署以及和 GI Alliance 的合作， 进一步证明了把研究基础设施直接嵌入社区医疗场景的可扩展性。
