      - number: '2.3'
        title: 买方分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              Iterative Health 的商业采用路径依赖双边市场结构：需求侧是生物制药赞助方和合同研究组织，供给侧是独立门诊医疗服务网络。生物制药研究赞助方和 CRO
              是主要买方，从中央临床开发和治疗项目预算中支付试验加速费用，以压缩从 1b 期到 4 期的开发周期。另一侧，独立社区医生集团把公司的站点模式当作可盈利的临床增值服务；其中包括与 GI Alliance、One
              GI 及 US Heart & Vascular 等大型合作方。Iterative Health 提供集中式监管申报、专业临床研究协调员配置和议定的溢价费率表，
              让社区医生免受研究启动的行政负担。对医院系统和门诊手术中心而言，SKOUT 等实时 AI 工具的采用遵循医疗管理层和设施技术采购路径，重点是操作质量基准、腺瘤检出改善和标准化临床记录。
            claimRefs:
              - CM005
              - CM006
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM011
              - CM012
      - number: '2.4'
        title: 采用驱动因素、结构性瓶颈与证据缺口
        blocks:
          - type: paragraph
            body: >-
              Iterative Health 的市场版图扩张由生物制药方对压缩入组周期的迫切需求推动；公司报告站点启动速度快 2x、启动周期最多缩短三个月、患者入组率比传统 IBD 行业基准高 3x
              以上。胃肠试验中，医生内窥镜评分的主观差异长期造成较高筛查失败率和更长资格审查周期，因此自动化、客观的计算机视觉评分有强劲经济驱动。
              但结构性约束限制了市场快速扩张。药企赞助方持续不愿在共享算法框架中汇集或共享专有患者数据，拖慢多机构模型训练。此外，尽管网络覆盖 100 多个临床研究站点并拥有 40
              个生物制药关系，公开客户集中度数据、留存指标和经审计软件 ARR 均缺失，商业合同的长期单位经济性和企业续约稳定性仍存在重要尽调缺口。
            claimRefs:
              - CM001
              - CM007
              - CM009
              - CM010
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 双边网络经济克服社区站点启动瓶颈
            body: Iterative Health 把临床站点置于运营中心，并为社区诊所争取溢价费率表，将分散的门诊 GI 诊所转成高吞吐研究中心，解决超过一半研究站点无法入组超过一名患者这一行业结构性难题。
            calloutType: insight
            claimRefs:
              - CM001
              - CM005
              - CM011
              - CM012
          - type: callout
            title: 多专科测算依赖可迁移的工作流执行
            body: >-
              Iterative Health 从成熟的胃肠病学和肝病学拓展到肥胖与心脏病学，显著扩大了可服务市场；但商业执行仍需证明，在非内窥镜治疗场景中，专有 AI 预筛查和站点赋能同样能带来 2x 的启动速度和 3x
              的入组优势。
            calloutType: risk
            claimRefs:
              - CM004
              - CM006
              - CM007
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 内窥镜 AI 与临床研究网络的竞争格局
        blocks:
          - type: paragraph
            body: >-
              Iterative Health 横跨两个历史上分离的市场，形成非传统竞争位置：医疗器械计算机辅助检测（CADe）软件，以及去中心化临床研究站点运营。在胃肠诊断影像领域， 公司商业化
              SKOUT，这是一款获批用于筛查结肠镜实时检测结直肠息肉的 AI 工具。同时，公司运营一个以绩效为导向的临床试验网络，在北美、欧洲、印度和澳大利亚拥有 100 多个专业研究站点。2026 年 5 月由
              Google Ventures 和 Intrepid Growth Partners 领投 $77 million C 轮融资后，Iterative Health 正把该网络从胃肠病学和肝病学扩展至
              肥胖、心脏病学等高增长治疗领域。这种多专科扩张让公司区别于纯医疗器械供应商和传统 CRO：它把专有筛查算法直接嵌入日常医疗服务工作流。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP010
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
