      - number: '7.4'
        title: 财务资本强度、估值敞口与论点失效触发因素
        blocks:
          - type: paragraph
            body: >-
              从财务和投资论点看，Iterative Health 的名义估值与财务透明度之间存在明显不对称。2026 年 4 月，Intrepid Growth Partners 与 GV 领投 7700 万美元 C
              轮融资后，公司投后估值达到 13 亿美元。尽管估值已达到独角兽水平，Iterative Health
              却没有公开披露经审计的收入、年度经常性收入（ARR）、毛利率或现金消耗率。不同市场数据供应商对公司公开员工人数的估计差异很大，范围从 125 人到超过 250 人，显示出显著的运营不透明度。公司运营着一个覆盖
              110 多个研究站点的全球网络，需要为临床研究协调员、监管合规人员和站点联络员承担大量人力成本，这可能稀释医疗 AI 公司通常应有的高毛利软件经济性。在私人二级市场，股份可在 EquityZen
              等平台交易，早期股东正寻求流动性，进一步说明公司缺乏流动性，也看不到近期 IPO 窗口。对投资者而言，关键的论点失效触发因素包括：Provation 分销协议被终止、发生严重 HIPAA
              执法行动、监管机构就临床数据预筛查发出警告，或有证据表明现金消耗大幅超过研究网络申办方合同收入。
            claimRefs:
              - CR005
              - CR012
              - CR013
              - CR014
