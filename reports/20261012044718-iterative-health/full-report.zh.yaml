  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类定义与相邻支出
        blocks:
          - type: paragraph
            body: >-
              Iterative Health 处于临床试验站点赋能、专业患者招募和 AI 辅助胃肠诊断的交汇处。公司的主要可服务市场边界包括生物制药临床试验执行预算，
              以及胃肠病学、肝病学、肥胖和心脏病学领域的专业站点赋能服务。该品类包括专职临床研究协调员、研究启动流程加速、自动化患者识别，以及用于试验资格判定的标准化内窥镜评分。 它明确排除全球全服务 CRO
              的研究治理、集中式核心实验室安全检测、医院电子病历企业许可和通用内窥镜塔光学硬件采购。在相邻领域，Iterative Health 商业化 SKOUT——一款获 FDA
              许可、可在门诊筛查结肠镜中实时检测息肉的计算机视觉设备。这一双产品版图连接了门诊诊断操作室与生物制药赞助的临床研究方案， 形成有别于纯软件临床试验管理系统或传统站点管理组织的专业混合市场定位。
            claimRefs:
              - CM003
              - CM004
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM013
      - number: '2.2'
        title: 多视角可服务市场测算与受约束的潜力
        blocks:
          - type: paragraph
            body: >-
              测算 Iterative Health 的可服务机会，需要从多种商业视角评估，而不能依赖不受约束的全球市场总额。宏观层面，生物制药赞助方因运营开发瓶颈承受重大机会损失； 行业基准显示，超过 90%
              的美国临床试验错过计划入组时间，超过一半研究站点每个方案只能入组 1 名或更少患者。公司赞助方材料估算，临床试验延误每天造成约 $0.5 million 的商业收入损失和 $40,000
              的运营执行支出。核心炎症性肠病（IBD）领域的美国目标患病人群超过 3 million，构成广阔的治疗开发基础， 但严格的方案限制了患者资格。完成 $77 million C 轮融资后，Iterative
              Health 又把目标边界从消化系统疾病扩展至肥胖和心血管试验。不过，公司财务披露仍属私有，
              且未公开报告经审计收入或年度经常性收入（ARR），因此其可服务可获取市场（SOM）的直接测算仍只是受私募尽调约束的分析估计。
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM008
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM008
              - CM014
          - type: figure
            figureRef: FM001
