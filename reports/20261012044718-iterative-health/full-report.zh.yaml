              - CV014
      - number: '8.4'
        title: 论点失效触发因素与退出准备度评估
        blocks:
          - type: paragraph
            body: >-
              纪律严明的投资姿态要求，在考虑参与股权投资前，先明确论点失效触发因素和必要的确认性尽调要求。主要论点失效事件包括：（1）因未经同意的患者数据预筛查或 HIPAA
              不合规而发生任何公开监管执法行动，或申办方审计发现问题；（2）GI Alliance 或 Gastro Health
              等知名医疗机构伙伴出现重大客户流失，导致网络入组能力受损；（3）向肥胖症和心脏病学拓展跨专科临床试验失败，使公司的总可服务市场受限于胃肠道适应症；（4）C
              轮出现高级清算优先权层层叠加，令普通股和更早期的风险投资联合体处于不成比例的次级地位。确认性尽调应优先取得经审计的过去 12 个月收入、ARR 桥接分析、软件与临床服务之间的毛利率拆分，以及完整的 C
              轮公司注册证书，其中应详细列明清算优先权、股息约定和赎回权。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV010
              - CV013
              - CV014
      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 没有财务证明，资本纪律不允许高价买入独角兽
            body: >-
              Iterative Health 已在 100 多个研究站点展现出经验证的运营势头，SKOUT 也持有 6 项 FDA 510(k) 许可；但在没有披露 ARR、毛利率和客户留存指标的情况下，据报道的 $1.3B
              C 轮估值无法纳入投资判断。投资者应继续保持“继续研究”的立场，直到能够取得经审计的核心财务数据。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV012
              - CV014
          - type: callout
            title: 合规缺口与未披露的资本化优先级威胁下行空间
            body: >-
              独立技术评估指出，公司没有公开 HIPAA 文件，缺少安全证明，且患者筛查模型的数据管理尚未得到验证。再加上未披露的 C 轮优先权条款和约 6%
              的估算轮次稀释，在困境或下行轮情景下，下行损失的回收将受到显著的结构性悬念影响。
            calloutType: risk
            claimRefs:
              - CV006
              - CV010
              - CV013
