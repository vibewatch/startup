  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与临床工作流整合
        blocks:
          - type: paragraph
            body: >-
              Iterative Health 是一家专业医疗科技和临床服务提供商，针对胃肠操作和临床试验中的结构性运营低效。公司的核心技术起源于内窥镜室实时计算机视觉应用， 代表产品是获 FDA 510(k) 许可的
              SKOUT。SKOUT 直接接入操作室内窥镜显示器，处理实时光学视频流，在筛查和监测结肠镜检查中标出可疑黏膜组织及潜在癌前息肉。 其发表于 Gastroenterology
              的注册试验显示，每次结肠镜检查腺瘤检出率相对提高 27%，平均每评估 4.5 名患者多检出一个腺瘤。除结直肠癌筛查外， Iterative Health 还开发了 AI
              Recruitment（AIR），解决炎症性肠病（IBD）药物开发中的招募危机。AIR 分析结肠镜视频和数字操作图像，计算标准化内窥镜疾病评分， 例如溃疡性结肠炎 Mayo
              评分。传统临床试验招募依赖内窥镜医生主观目视评估，评分者间差异经常造成错误筛查和较高筛查失败率。AIR 按标准化入组条件自动评分， 为临床研究团队提供客观患者筛选管线。通过与 Gastro Health
              等大型平台诊所合作，公司已把 AI 技术部署到数百名胃肠科医生和社区内窥镜中心。
            claimRefs:
              - CE001
