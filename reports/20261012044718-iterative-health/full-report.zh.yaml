      - number: '6.3'
        title: 留存动态、扩张闭环与客户集中风险
        blocks:
          - type: paragraph
            body: >-
              尽管已有大量具名站点部署和运营加速指标，Iterative Health 仍存在私有临床试验服务网络常见的客户集中度和披露缺口。公司未公开披露生物制药赞助方合同或医疗服务方软件订阅的
              净收入留存率（NRR）、总收入留存率（GRR）、年度流失率或平均合同价值（ACV）。药物开发中的临床试验赞助本质上按项目计费，并绑定具体方案阶段； 1b 期到 3
              期的试验周期在项目完成或候选药物临床开发失败时，会自然形成续约断点。此外，尽管网络声称与 40 多家全球药企赞助方和 CRO 保持活跃合作，
              收入仍高度容易集中于头部胃肠药物开发项目。诊断硬件—软件业务的终端用户留存，则暴露于操作者接受度、工作流整合摩擦和第三方独家分销伙伴 Provation 的表现。
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.4'
        title: 展示项
        blocks:
          - type: callout
            title: 医疗服务方赋能与生物制药需求的双引擎协同
            body: >-
              Iterative Health 的核心商业护城河是高绩效站点网络，它把医疗服务方的收入激励与药企试验时间表对齐。公司充当运营骨干，而非只做监查的传统 CRO， 因而与 Gastro Health、GI
              Alliance 等领先 GI 集团形成深度诊所整合。
            calloutType: strength
            claimRefs:
              - CU001
              - CU003
              - CU008
              - CU009
          - type: callout
            title: 高度暴露于赞助方试验周期与流失不确定性
            body: 临床试验收入本质上依赖项目和试验阶段；当临床开发里程碑结束或研究药物失败时，生物制药支出可能终止。Iterative Health 未披露 NRR 或合同期限， 因而长期客户耐久性仍未验证。
