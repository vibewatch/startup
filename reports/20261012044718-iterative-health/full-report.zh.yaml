      - number: '3.2'
        title: 竞争者类型与品类动态
        blocks:
          - type: paragraph
            body: >-
              Iterative Health 周边竞争格局可分为四类：在位 CADe 医疗器械厂商、专业诊断初创公司、临床站点管理组织（SMO）和全球 CRO。在内窥镜检测领域， Medtronic
              等全球医疗科技龙头凭借成熟的资本销售渠道，以及 GI Genius 平台，主导医院和门诊手术中心装机。较早期的诊断创新者如 Alimetry 和 Suzhou Huiwei，
              则分别聚焦非侵入性胃电图或区域筛查算法，没有临床试验招募基础设施。在试验执行领域，Velocity Clinical Research、CareAccess 等传统 SMO 和站点网络拥有广泛实体诊所版图，
              但依赖劳动密集型的协调员人工筛查。Iterative Health 针对标准研究站点超过一半每个方案只能入组 0 或 1 名患者这一系统性摩擦，为 40 多家生物制药和 CRO 合作方提供自动预筛查，
              并在其社区医疗服务版图内进行标准化图像评分。
