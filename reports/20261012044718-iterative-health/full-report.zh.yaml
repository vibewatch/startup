      - number: '6.2'
        title: 采用轨迹与已命名网络部署
        blocks:
          - type: paragraph
            body: >-
              Iterative Health 的商业部署模式已从单站点临床试验软件试点，演变为覆盖全球 100 多个社区和医疗系统研究站点的企业网络。最具代表性的客户证明来自大型多专科医生网络， 尤其是 Gastro
              Health——这家全国性医疗集团横跨七州、拥有 380 多名医生，并部署 Iterative Health 的 AI Recruitment（AIR）平台，在 IBD 试验中标准化入组。
              其他已命名临床研究伙伴包括 GI Alliance、Tyler Research Institute、One GI 和 US Heart & Vascular。这些企业部署说明社区医疗集团愿意把
              Iterative Health 的运营和软件栈嵌入日常临床工作流。 网络还证明了跨专科采用能力，已从核心胃肠病学和肝病学扩展到肥胖和心脏病学临床项目。
            claimRefs:
