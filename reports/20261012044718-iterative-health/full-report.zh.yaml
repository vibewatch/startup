      - number: '8.2'
        title: 资本化背景、估值倍数与稀释悬念
        blocks:
          - type: paragraph
            body: >-
              Iterative Health 于 2026 年 4 月 30 日完成 $77M C 轮融资，由 Intrepid Growth Partners 和 Google Ventures
              联合领投，EDBI、Insight Partners 和 Obvious Ventures 参投。自 2017 年成立以来，公司已完成 5 轮融资，累计融资约 $271M。据报道，C 轮融资带来 $1.3B
              投后估值，较 2022 年 1 月实现的 $704M B 轮估值进一步上升。按已披露的轮次金额估算，C 轮投资者稀释比例约为 6%，而 B 轮和 A-1 轮分别出售了 21% 和 22%
              的股份。不过，这一独角兽级估值形成了很大的投资悬念。Iterative Health 仍是私营公司，完全没有公开披露经审计的收入、年度经常性收入（ARR）、毛利率或现金跑道。追踪数据库估计公司员工人数在 125
              至 207 人之间，说明其收入规模可能落后于传统软件独角兽基准，使 $1.3B 估值倍数相对于可比临床服务和数字医疗公司显得严重偏高。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV010
              - CV012
      - number: '8.3'
        title: 建议汇总、风险评级与估值立场
        blocks:
          - type: paragraph
            body: >-
              我们正式建议继续研究，置信度为中等；风险评级为高，估值立场为偏高。该建议在可观察的真实运营实力与严重信息不对称之间取得平衡。Iterative Health
              的站点网络确实带来了切实的入组加速，也与知名学术胃肠病学家和临床团体保持高质量顾问关系；但在没有经审计财务报表的情况下，资本配置者无法对 13
              亿美元投后估值下的投资进入做出负责任的判断。高风险评级反映了未经验证的收入规模、头部生物制药临床项目可能存在的客户集中，以及患者健康信息合规姿态仍未解决。在当前私人市场环境下，以独角兽估值投资，必须清楚了解净收入留存率、软件毛利率和现金消耗倍数效率。在管理层于确认性尽调期间提供经验证的财务及资本化明细前，投资者应避免作出具有约束力的资本承诺，并持续跟踪。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV012
              - CV014
