      - number: '7.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 企业合规与安全敞口
            body: >-
              由于缺少公开的 HIPAA 合规声明、产品层面的业务伙伴协议（BAA）以及 SOC 2 Type II 等第三方安全认证，Iterative Health
              在尽调中面临重大阻力。随着医疗系统和制药申办方执行严格的供应商保障计划，围绕患者内镜视频和临床试验筛查数据库的可验证数据保护措施不足，可能延迟甚至阻断企业合同扩张。
            calloutType: risk
            claimRefs:
              - CR003
              - CR013
          - type: callout
            title: 双重运营模式之间的战略摩擦
            body: >-
              Iterative Health 运营着两种截然不同的业务模式：获得 FDA 批准的诊断软件产品 SKOUT，以及嵌入社区的实体临床试验站点网络。两者都利用 AI 和胃肠病学关系，但运营特征根本不同。SKOUT
              更像纯软件，依赖分销商 Provation；临床站点网络则需要大量临床协调员、站点层面的合规工作和医生招募，使公司面临利润率压缩和运营扩张摩擦。
            calloutType: insight
            claimRefs:
              - CR004
              - CR011
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点动态
        blocks:
          - type: paragraph
            body: >-
              Iterative Health 的投资论点颇具吸引力，基础是双引擎商业化模式和已验证的临床运营表现。公司已从专注于内镜的软件开发商，成长为覆盖北美、欧洲、印度和澳大利亚、超过 100
              个临床站点的运营型研究网络。通过整合集中式试验人员配置、监管管理和人工智能预筛查，Iterative Health 展示出相较传统行业基准快 2 倍的站点启动速度，以及高出 3
              倍以上的患者入组速度。此外，其专有诊断设备 SKOUT 已取得 6 项 FDA 510(k)
              许可，为其在胃肠病学领域建立了较强的监管可信度。不过，反论点指出了可能打断这一运营势头的严重商业和治理风险。公司高度依赖合作临床机构，而在胃肠病学之外拓展企业软件的能力尚未得到验证。更关键的是，独立第三方评估显示，公司没有公开
              HIPAA 合规披露，产品尚无已验证的 BAA 协议覆盖，也没有任何公开安全认证，这会给生物制药申办方的采购带来实质摩擦。
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV007
              - CV008
              - CV009
