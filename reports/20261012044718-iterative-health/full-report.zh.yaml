              实时计算机视觉在受控试验中能带来有说服力的腺瘤检测和预筛查速度，但要在分散的社区 ASC 中扩张，就会暴露于不同光学处理器、相机分辨率和视频采集标准。
              此外，药企赞助方不愿分享专有试验视频数据集，限制了第三方对算法泛化能力的验证。
