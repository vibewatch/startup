  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 系统化决策流程将运营证据、财务不透明度和合规风险连接到“继续研究”的建议。
    data:
      nodes:
        - id: network-proof
          label: 1. 临床网络规模
          detail: 已在多个治疗领域建立覆盖 100 多个研究站点、启动速度快 2 倍、入组率达 3.4 倍的网络。
        - id: device-clearance
          label: 2. 监管批准
          detail: SKOUT 持有 6 项 FDA 510(k) 批准，在胃肠病学领域提供已确立的医疗器械验证。
        - id: valuation-mark
          label: 3. C 轮独角兽估值
          detail: $77M C 轮融资于 2026 年 4 月完成，据报道投后估值为 $1.3B。
        - id: financial-opacity
          label: 4. 信息不对称
          detail: 公开信息中没有经审计的收入运行率、ARR、毛利率、运营现金消耗或客户留存披露。
        - id: governance-risk
          label: 5. 合规与结构性悬垂
          detail: 独立审查发现未公开 HIPAA/BAA 合规状况、安全认证存在缺口，且优先股堆叠情况未知。
        - id: recommendation-outcome
          label: 6. 投资立场
          detail: 估值偏高的立场导致建议“进一步研究”，有待确认性财务尽调。
      edges:
        - from: network-proof
          to: device-clearance
        - from: device-clearance
          to: valuation-mark
        - from: valuation-mark
          to: financial-opacity
        - from: financial-opacity
          to: governance-risk
        - from: governance-risk
          to: recommendation-outcome
    approximationNotes: 基于运营指标、合规调查结果及估值压力的顺序逻辑综合。
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV012
      - CV014
