      - number: '1.4'
        title: 运营里程碑、监管许可与合规缺口
        blocks:
          - type: paragraph
            body: >-
              Iterative Health 的运营轨迹由关键监管里程碑、临床验证和持续扩大的网络部署构成。诊断产品线最重要的监管成果发生在 2022 年 8 月，公司为 SKOUT 获得 FDA 510(k) 许可
              K213686；该 AI 软件设备用于成人结肠镜筛查时实时标记息肉位置。首次获批后，公司截至 2025 年 12 月又取得五项特别 510(k) 许可（延伸至 K253664），持续迭代和更新检测模型。发表于
              Gastroenterology 的关键临床试验显示，在 1,359 名随机试验参与者中， 每次结肠镜检查的腺瘤检出率相对提高 27%。与此同时，临床站点网络扩展至全球 100
              多家合作机构。然而，独立医疗科技评估指出，公司尚未公布 SOC 2 Type II 等独立第三方安全证明，未记录正式 HIPAA
              合规框架，也未披露明确的数据权利政策，无法确认患者操作视频和试验筛查记录是否会被导入专有基础模型。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO013
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO005
              - CO006
              - CO007
      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 多专科网络规模与监管差异化
            body: >-
              Iterative Health 的双引擎模式把获 FDA 510(k) 许可的 AI 医疗设备 SKOUT，与覆盖全球 100 多个地点的嵌入式多专科临床试验站点网络结合起来。
              这种结构让公司能在社区场景直接解决临床试验入组瓶颈，同时利用专有 AI 算法筛查患者。
            calloutType: strength
            claimRefs:
              - CO006
              - CO008
          - type: callout
            title: 估值规模先于经审计财务与合规披露
            body: >-
              Iterative Health 的投后估值达到 $1.3 billion，却未披露 GAAP 收入、ARR、毛利率或现金消耗，仍获得独角兽定价。外部评估还指出， HIPAA 状态、SOC 2
              证明以及用于模型训练的患者操作视频治理均存在尚未解决的合规风险。
            calloutType: risk
            claimRefs:
