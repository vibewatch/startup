            body: >-
              Iterative Health 的竞争防御力来自临床研究站点网络与专业算法开发之间自我强化的数据—运营闭环。公司在 100 多个社区站点嵌入运营支持、主要研究者培训和自动化 EHR 预筛查，
              为寻求可盈利研究增值服务的合作胃肠诊所制造运营切换成本。但竞争和结构性脆弱点也很明显。商业上，SKOUT 完全依赖 Provation 在美国分销，市场准入容易受渠道合作伙伴调整或竞争 AI 模块整合影响。
              运营上，AI Health Index 的独立尽调指出，Iterative Health 没有公布覆盖跨洲患者记录筛查的外部安全证明或明确 HIPAA 商业伙伴协议文件。此外，公司把 C
              轮资金投入心脏病学和肥胖领域后， 必须证明 AI 预筛查优势能从以影像为中心的内窥镜迁移到复杂代谢和心血管试验设计。
