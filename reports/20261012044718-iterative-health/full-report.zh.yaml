          detail: 自动病历分析和试验方案匹配软件（AIR），识别符合条件的研究参与者
        - label: 站点运营与协调员工作流
          detail: 运营协议、协调员培训模块（Iterative U）和集中式研究启动工具
        - label: 网络集成与多站点枢纽
          detail: 跨社区胃肠病学诊所及合作诊所开展多中心站点协调与绩效跟踪
        - label: 生物制药申办方与 CRO 分析
          detail: 集中式试验可行性仪表盘、入组监测和监管级审计轨迹交付
    approximationNotes: 架构模型综合自公司公开产品披露、FDA 设备摘要和临床演示摘要。
    claimRefs:
      - CE001
      - CE004
      - CE009
      - CE010
      - CE011
      - CE013
  - id: FU001
    title: Iterative Health 客户采用与扩张旅程图
    type: journey-map
    summary: 展示临床服务方与生物制药申办方两端客户的引入、运营集成和企业扩张周期。
    data:
      items:
        - label: 1. 医疗服务方网络对齐
          summary: >-
            Community GI practices and ASCs engage to establish or scale clinical trial operations as a profitable
            ancillary line.
          detail: 评估诊所、筛选站点可行性，并就试验运营基础设施达成一致。
        - label: 2. 工作流与技术集成
          summary: Deployment of AI patient pre-screening, trial startup protocols, and SKOUT endoscopic detection systems.
          detail: 内镜室集成、CRC 人员支持、监管管理和医生培训。
        - label: 3. 生物制药试验方案匹配
          summary: Biopharmaceutical sponsors and CROs contract network capacity for specific Phase 1b-4 clinical protocols.
          detail: 在符合条件的网络站点间集中签约、快速编制预算并完成 IRB 对齐。
        - label: 4. 加速试验执行
          summary: Active patient recruitment, automated pre-screening, and standardized endoscopic scoring.
          detail: 启动速度提升 2 倍、每站点入组提高 3 倍，并保持可靠的方案执行。
        - label: 5. 多专科网络扩张
          summary: >-
            Sponsors expand trial bookings across therapeutic areas while provider practices extend to cardiometabolic
            studies.
          detail: 从胃肠病学扩展到肝病学、肥胖（GLP-1）和心脏病学临床试验。
        - label: 6. 企业项目规模化
          summary: >-
            Conversion of successful single-protocol site deployments into multi-year programmatic enterprise research
            alliances.
          detail: 长期产能承诺、扩大社区医生引入，并在站点网络间集中管理数据。
    approximationNotes: 旅程阶段模拟站点赋能与制药申办方试验签约之间结构化的双向网络循环。
    claimRefs:
      - CU001
      - CU003
      - CU007
      - CU010
      - CU011
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 企业风险矩阵从监管、运营、合作伙伴和财务维度评估可能性、影响、缓解措施成熟度及剩余严重性。
