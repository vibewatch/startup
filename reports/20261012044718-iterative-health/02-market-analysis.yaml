    title: "Dual-Sided Network Economics Overcome Community Site Activation Bottlenecks"
    body: "By positioning the clinical site at the operational center and securing premium rate cards for community practices, Iterative Health converts fragmented outpatient GI clinics into high-throughput research centers, solving the structural industry reality where more than half of research sites fail to enroll more than one patient."
    claimRefs:
      - "CM001"
      - "CM005"
      - "CM011"
      - "CM012"
  - calloutType: "risk"
    title: "Multi-Specialty Sizing Relies on Transferable Workflow Execution"
    body: "Iterative Health's expansion beyond established gastroenterology and hepatology domains into obesity and cardiology significantly enlarges its addressable market, but commercial execution requires proving that proprietary AI pre-screening and site enablement deliver identical 2x activation and 3x enrollment outperformance in non-endoscopic therapeutic settings."
    claimRefs:
      - "CM004"
      - "CM006"
      - "CM007"
