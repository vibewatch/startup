    title: "Capital Discipline Precludes Premium Unicorn Buy Without Financial Proof"
    body: "While Iterative Health demonstrates verified operational momentum across more than 100 research sites and holds six FDA 510(k) clearances for SKOUT, the reported $1.3B Series C valuation cannot be underwritten in the absence of disclosed ARR, gross margin, and customer retention metrics. Investors should maintain a research-more stance until audited primary financials are made available."
