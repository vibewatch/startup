company:
  name: "Iterative Health"
chapter:
  number: 8
  title: "Valuation"
  summary: "Iterative Health demonstrates rapid clinical trial site expansion and proven regulatory milestones, culminating in a reported $1.3 billion Series C valuation in April 2026. However, complete financial opacity regarding ARR, gross margins, and customer retention alongside compliance gaps dictates a research-more recommendation and stretched valuation stance."
sections:
  - id: "investment-thesis-and-anti-thesis-framework"
    title: "Investment Thesis and Anti-Thesis Dynamics"
    body: "Iterative Health presents a compelling investment thesis grounded in its dual-engine commercialization model and verified clinical operational performance. The company has successfully evolved from a specialized endoscopy software developer into an operational research network spanning more than 100 clinical sites across North America, Europe, India, and Australia. By integrating centralized trial staffing, regulatory management, and artificial intelligence pre-screening, Iterative Health demonstrates 2x faster site activation and over 3x higher patient enrollment velocity compared to traditional industry benchmarks. Furthermore, its proprietary diagnostic device SKOUT holds six FDA 510(k) clearances, establishing substantial regulatory credibility in gastroenterology. However, the core anti-thesis highlights severe commercial and governance risks that challenge this operational momentum. The business operates with significant dependency on partner clinical practices, while enterprise software expansion outside gastroenterology remains unproven. Crucially, independent third-party evaluations demonstrate an absence of published HIPAA compliance disclosures, lack of verified BAA agreements reaching the product, and zero public security certifications, introducing material procurement friction for biopharma sponsors."
    claimRefs:
      - "CV002"
      - "CV003"
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV009"
    tableRefs:
      - "TV002"
  - id: "capitalization-valuation-context-and-multiple-analysis"
    title: "Capitalization Context, Valuation Multiples, and Dilution Overhang"
    body: "Iterative Health closed a $77 million Series C financing round on April 30, 2026, co-led by Intrepid Growth Partners and Google Ventures, with participation from EDBI, Insight Partners, and Obvious Ventures. This round brought total lifetime funding to approximately $271 million across five financing rounds since its 2017 inception. The Series C reportedly established a post-money valuation of $1.3 billion, representing an incremental step-up from its $704 million Series B valuation achieved in January 2022. Based on disclosed round figures, the Series C round implied an estimated investor dilution of approximately 6%, compared to 21% sold during Series B and 22% in Series A-1. However, this headline unicorn valuation creates substantial investment overhang. Iterative Health remains private and provides zero public disclosure of audited revenue, annual recurring revenue (ARR), gross margins, or cash runway. Tracker databases estimate headcount between 125 and 207 personnel, suggesting that top-line revenue may lag traditional software unicorn benchmarks, leaving the $1.3B valuation multiple heavily stretched against comparable clinical services and digital health peers."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV004"
      - "CV010"
      - "CV011"
      - "CV012"
    tableRefs:
      - "TV003"
  - id: "recommendation-synthesis-and-valuation-stance"
    title: "Recommendation Synthesis, Risk Rating, and Valuation Stance"
    body: "We assign Iterative Health a formal recommendation of research-more with medium confidence, a high risk rating, and a stretched valuation stance. The recommendation balances observable real-world operational strength against acute information asymmetry. While Iterative Health's site network delivers tangible enrollment acceleration and maintains high-profile advisory relationships with leading academic gastroenterologists and clinical groups, capital allocators cannot responsibly underwrite an entry at a $1.3 billion post-money valuation without audited financial statements. The high risk rating reflects the combination of unverified revenue scale, potential customer concentration across top biopharmaceutical clinical programs, and unaddressed compliance posture regarding patient health information. Under current private market conditions, investing at unicorn marks requires clear visibility into net revenue retention, software gross margins, and burn multiple efficiency. Until management provides verified financial and capitalization schedules during confirmatory diligence, investors should avoid issuing binding capital commitments and continue active tracking."
    claimRefs:
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV012"
      - "CV014"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "thesis-break-triggers-and-confirmatory-diligence-asks"
    title: "Thesis-Break Triggers and Exit Readiness Assessment"
    body: "A disciplined investment posture requires identifying explicit thesis-break triggers and essential confirmatory diligence requirements before considering an equity participation. Primary thesis-break events include: (1) any public regulatory enforcement action or sponsor audit finding related to unconsented patient data pre-screening or HIPAA non-compliance; (2) material customer churn among marquee provider partners such as GI Alliance or Gastro Health, which would impair network enrollment capacity; (3) failure of cross-specialty clinical trial expansion into obesity and cardiology, constraining the company's total addressable market to gastrointestinal indications; and (4) senior liquidation preference stacking in the Series C round that disproportionately subordinates common equity and earlier venture syndicates. Confirmatory diligence must prioritize securing audited trailing twelve-month revenue, ARR bridge analysis, gross margin breakdown between software and clinical services, and the full Series C certificate of incorporation detailing liquidation preferences, dividend covenants, and redemption rights."
    claimRefs:
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV010"
      - "CV013"
      - "CV014"
