    body: "Independent technical reviews highlight an absence of published HIPAA documentation, lack of security attestations, and unverified data stewardship regarding patient screening models. Combined with undisclosed Series C preference terms and estimated 6% round dilution, downside recovery in distressed or down-round scenarios faces substantial structural overhang."
