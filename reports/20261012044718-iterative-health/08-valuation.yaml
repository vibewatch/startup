      - "Key Downside Risks"
      - "Probability Signal"
    rows:
      - - "Bull Case"
        - "ARR scales past $150M via cardiometabolic expansion; gross margin exceeds 70%; SKOUT becomes standard of care across major endoscopy suites."
        - "15.0x EV/ARR multiple on $150M ARR yields $2.25B exit valuation (1.7x MOIC, 20% IRR on Series C entry)."
        - "Regulatory scrutiny on clinical data sharing; biopharma trial budget contraction."
        - "Low (20%): Requires flawless cross-specialty execution and transparent financial scale."
      - - "Base Case"
        - "ARR grows moderately to $80M-$100M; research network remains concentrated in GI; tech-enabled services margin settles around 50-55%."
        - "8.0x-10.0x EV/ARR multiple yields $640M-$1.0B valuation (0.5x-0.8x MOIC; flat to down valuation)."
        - "Multiple compression for tech-enabled services; customer concentration among top CRO partners."
        - "Moderate (55%): Reflects historical trajectory of hybrid clinical site management models."
      - - "Bear Case"
        - "Growth stalls below $50M ARR; high site support costs compress margins below 40%; compliance barriers block biopharma enterprise master agreements."
        - "4.0x EV/ARR distressed sale or recapitalization at $200M-$300M valuation (0.15x-0.25x MOIC; severe capital impairment)."
        - "Senior liquidation preferences wipe out common and early rounds; customer defection to legacy SMOs."
        - "Elevated (25%): Substantial risk given valuation overhang and absence of documented unit economics."
    notes: "Return multiples and EV/ARR ratios modeled against Series C post-money valuation of $1.3B."
    claimRefs:
