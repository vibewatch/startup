callouts:
  - calloutType: risk
    title: Enterprise Compliance and Security Exposure
    body: Iterative Health faces critical diligence headwinds due to the absence of public HIPAA compliance statements, product-level Business Associate Agreements, and third-party security certifications such as SOC 2 Type II. As health systems and pharmaceutical sponsors enforce rigorous vendor assurance programs, the lack of verifiable data safeguards around patient endoscopy videos and clinical trial screening databases threatens to delay or derail enterprise contract expansion.
    claimRefs:
      - CR003
      - CR013
  - calloutType: insight
    title: Strategic Friction Between Dual Operating Models
    body: "Iterative Health operates two distinct business models: an FDA-cleared diagnostic software product (SKOUT) and a physical, community-embedded clinical trial site network. While both leverage AI and gastroenterology relationships, they present fundamentally different operating profiles. SKOUT behaves like pure software dependent on distributor Provation, whereas the clinical site network requires heavy clinical coordinator staffing, site-level compliance, and physician recruitment, exposing the company to margin compression and operational scaling friction."
    claimRefs:
      - CR004
      - CR011
