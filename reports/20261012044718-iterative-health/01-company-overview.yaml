company:
  name: Iterative Health
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Iterative Health is a Cambridge-based clinical research technology and endoscopy software company valued at $1.3
    billion following a $77 million Series C round in April 2026. Founded in 2017 by Dr. Jonathan Ng, the company
    operates an AI-assisted multispecialty clinical trial site network alongside SKOUT, its FDA-cleared real-time polyp
    detection tool. While total equity funding has reached $270.3 million with backing from Intrepid Growth Partners and
    GV, audited revenue, ARR, operating burn, and data governance policies remain undisclosed.
sections:
  - id: corporate-identity-and-business-model
    title: Corporate Identity and Hybrid Business Model
    claimRefs:
      - CO001
      - CO007
      - CO008
      - CO014
    tableRefs:
      - TO001
    body: >-
      Iterative Health, legally incorporated as Iterative Scopes, Inc., operates from dual headquarters in Cambridge,
      Massachusetts and New York City. The enterprise was founded in 2017 with an initial focus on applying computer
      vision and machine learning algorithms to gastroenterological endoscopy. In October 2022, the company formally
      rebranded from Iterative Scopes to Iterative Health, reflecting a strategic expansion from diagnostic medical
      imaging into clinical trial infrastructure and recruitment services. Today, Iterative Health operates two distinct
      commercial business lines: an FDA-cleared computer-aided detection device known as SKOUT, and an embedded
      multispecialty clinical research site network that spans more than 100 partner institutions across North America,
      Europe, India, and Australia. While SKOUT is commercialized in the United States through an exclusive distribution
      partnership with Provation, the clinical trial network contracts directly with biopharmaceutical sponsors and
      contract research organizations to accelerate patient identification and enrollment across gastroenterology,
      hepatology, obesity, and cardiology trials.
  - id: leadership-and-governance
    title: Executive Leadership, Governance Structure, and Founder-Market Fit
    claimRefs:
      - CO001
      - CO009
      - CO010
    tableRefs:
      - TO002
    body: >-
      Iterative Health is led by Founder and Chief Executive Officer Dr. Jonathan Ng, MBBS, a physician and MIT alumnus
      who pioneered the organization's core machine learning applications for gastrointestinal clinical research. Dr. Ng
      represents the central executive visionary and operational authority, maintaining high founder-market fit while
      introducing substantial key-person dependence across corporate strategy, fundraising, and clinical protocol
      development. The company's board of directors and governance ecosystem underwent significant expansion following
      the April 2026 Series C financing. Ajay Agrawal, Co-Founder and Partner at Intrepid Growth Partners, joined
      Iterative Health's Board of Directors as an active voting director, bringing expertise in artificial intelligence
      commercialization and industry system redesign. Concurrently, Dr. Anthony Philippakis, General Partner at GV
      (Google Ventures) and practicing cardiologist, joined the board as an observer, enhancing the company's technical
      depth and strategic relationships across the biopharmaceutical ecosystem. Governance oversight balances venture
      capital sponsors with specialized academic and clinical domain advisors.
  - id: capitalization-and-investor-syndicate
    title: Capitalization Trajectory, Valuation Benchmark, and Investor Base
    claimRefs:
      - CO002
      - CO003
      - CO004
      - CO005
      - CO012
    tableRefs:
      - TO003
    body: >-
      Iterative Health has completed four institutional equity financing rounds since inception, accumulating
      approximately $270.3 million in lifetime equity capital. Early institutional funding began with a $13.25 million
      Pre-Series A round in January 2020 at a $29.43 million post-money valuation, followed by a $30 million Series A-1
      round in August 2021 at a $133.45 million post-money valuation. In January 2022, the enterprise closed a $150
      million Series B round co-led by Clearlake Capital Group and Insight Partners at a $704.24 million post-money
      valuation. In April 2026, Iterative Health attained unicorn status by closing a $77 million Series C financing
      round co-led by Intrepid Growth Partners and GV, with new participation from EDBI and existing investors Insight
      Partners and Obvious Ventures, establishing a post-money valuation of $1.3 billion. Planet First Partners
      subsequently contributed follow-on strategic growth equity in June 2026. Despite this substantial capital
      progression, detailed capitalization mechanics such as liquidation preferences, senior debt tranches, and
      secondary stock sales remain strictly private, as do audited financial metrics such as revenue, ARR, gross
      margins, and net cash burn.
  - id: operational-milestones-and-compliance-risks
    title: Operational Milestones, Regulatory Clearance, and Compliance Gaps
    claimRefs:
      - CO005
      - CO006
      - CO007
      - CO013
    figureRefs:
      - FO001
    body: >-
      The operational trajectory of Iterative Health is punctuated by critical regulatory milestones, clinical
      validations, and expanding network deployments. The cornerstone regulatory accomplishment for its diagnostic
      product line occurred in August 2022, when the company secured FDA 510(k) clearance K213686 for SKOUT, an
      artificial intelligence software device designed to provide real-time polyp location marks during adult
      colonoscopy screening. Following initial clearance, the company achieved five subsequent special 510(k) clearances
      through December 2025 (extending through clearance K253664) to iterate and update its detection models. Pivotal
      clinical trials published in Gastroenterology documented a 27 percent relative increase in adenoma detection per
      colonoscopy among 1,359 randomized trial participants. Concurrently, the clinical site network scaled to encompass
      over 100 partner facilities globally. However, independent health-tech evaluations highlight significant
      operational and compliance ambiguities: the company has not published independent third-party security
      attestations such as SOC 2 Type II reports, documented formal HIPAA compliance frameworks, or disclosed explicit
      data-rights policies governing whether patient procedure video and trial-screening records are ingested into
      proprietary foundation models.
