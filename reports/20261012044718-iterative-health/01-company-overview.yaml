callouts:
  - calloutType: strength
    title: Multi-Specialty Network Scale and Regulatory Differentiation
    body: >-
      Iterative Health's dual-engine model combines an FDA 510(k)-cleared AI medical device (SKOUT) with an embedded
      multispecialty clinical trial site network exceeding 100 locations globally. This structure allows the company to
      address clinical trial enrollment bottlenecks directly in community settings while leveraging proprietary AI
      algorithms to screen patients.
    claimRefs:
      - CO006
      - CO008
  - calloutType: risk
    title: Valuation Scale Precedes Audited Financial and Compliance Disclosures
    body: >-
      At a $1.3 billion post-money valuation, Iterative Health commands unicorn pricing without disclosing GAAP revenue,
      ARR, gross margins, or cash burn. Furthermore, external evaluations cite unaddressed compliance risks regarding
      HIPAA status, SOC 2 attestations, and governance over patient procedure video used for model training.
    claimRefs:
      - CO004
      - CO012
      - CO013
