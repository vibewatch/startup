      - number: '2.3'
        title: Structural Demand Drivers and Constraints
        blocks:
          - type: paragraph
            body: >-
              The current macro and housing backdrop is favorable for digital rental platforms even if it is less
              favorable for transaction-heavy home sales. FipeZap reported national rent inflation of 9.44% in 2025 with
              average asking rent of BRL 50.98 per square meter, while Coraly reported continued price growth in
              residential sales as affordability tightened. Brazil’s housing deficit remains structurally large—5.77
              million units in 2024—with excessive rent burden representing the majority of that deficit. That creates a
              large population of households under pressure to find housing faster, more efficiently, and often without
              the balance sheet strength needed for traditional guarantor-heavy leasing. At the same time, higher Selic
              rates and tighter mortgage conditions are expected to shrink real-estate credit and raise down-payment
              burdens, pushing some would-be buyers back into the rental market. These same forces constrain
              QuintoAndar’s sales-side revenue opportunity, so the tailwind is not uniform across all products. Trust,
              compliance, and consumer-protection scrutiny also remain adoption constraints: at platform scale, speed
              and convenience only work if landlords, renters, and agencies believe the rules, pricing, and
              dispute-resolution practices remain fair.
