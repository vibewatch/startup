      - number: '1.2'
        title: Leadership Bench and Governance Readiness
        blocks:
          - type: paragraph
            body: >-
              Public leadership evidence suggests QuintoAndar is professionalizing for a larger, more operationally
              complex phase, but still leaves real governance blind spots. The 2025 executive update added Marco
              Mordehachvili as CFO and Rafael Castro as CPO, while retaining Lucas Lima as COO and Ana Pellegrini as
              CLO. The backgrounds are meaningful: Farallon experience points to capital-discipline and financing
              sophistication, while Castro brings large-scale product and engineering credibility after Google plus
              internal operating tenure. Pellegrini explicitly oversees legal, public policy, privacy, M&A, corporate
              governance, and compliance, which matters for a marketplace touching payments, consumer contracts, and
              increasingly AI-driven decisions. Management language also shifted from startup disruption toward scale,
              sophisticated governance, and durable growth. That said, board composition and ownership concentration
              remain weakly disclosed in public materials. Press releases highlight executives but do not meaningfully
              disclose independent directors, committee structure, or investor control rights. The result is a mixed
              governance read: the management team is clearly maturing, but the public record still does not let an
              investor underwrite board independence or founder-control dynamics with confidence.
