        title: Customer Segmentation and Surface Area
        blocks:
          - type: paragraph
            body: >-
              QuintoAndar’s customer base is unusually broad for a consumer proptech. The company serves renters and
              landlords in the core rental workflow, buyers and sellers in the residential sale flow, and partner
              agencies through marketplace and AI-assistant tools. Adjacent products broaden the surface further toward
              condo stakeholders, suppliers, and research audiences. This breadth matters because it gives the company
              several acquisition and monetization loops rather than dependence on one consumer persona. It also creates
              multiple decision-makers whose motivations can reinforce each other when supply, demand, and
              intermediaries all stay active on the same platform. It also complicates diligence: a renter is not the
              same economic actor as a landlord or broker, and those segments likely have different retention and
              profitability profiles. Public evidence nevertheless shows that QuintoAndar is not stuck in a single
              narrow use case. Its customer surface spans demand-side users, supply-side owners, professional
              intermediaries, and adjacent property-service communities, which helps explain both its scale and its
