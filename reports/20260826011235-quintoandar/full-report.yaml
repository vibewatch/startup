    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Decision implication
    rows:
      - - Recommendation
        - flag / price-sensitive research-more
        - Proceed only with a meaningful discount to stale peak pricing or with fresh audited disclosure.
      - - Confidence
        - Medium
        - >-
          Enough evidence exists to bracket valuation, but not enough to clear underwriting risk at an unknown current
          price.
      - - Risk rating
        - Medium-high
        - Trust, credit cyclicality, and disclosure opacity can compress valuation together.
      - - Valuation stance
        - Conditionally supportable below prior peak; stretched near $5.1B
        - A portal-like premium is possible, but only with stronger proof on margins and risk control.
      - - Entry discipline
        - Prefer sub-peak entry with disclosure rights
        - Price should reset lower if current metrics are closer to brokerage economics than portal economics.
    notes: This is not a static view on company quality; it is a price-sensitive and evidence-sensitive call.
    claimRefs:
      - CV031
      - CV040
      - CV041
      - CV042
      - CV043
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - What would change the view
    rows:
      - - >-
          THESIS: QuintoAndar is the scaled category leader in Brazilian housing transactions, with meaningful rental,
          sales, and managed-contract volume.
        - >-
          View strengthens if audited revenue quality and segment margins confirm that scale converts into durable
          economics.
      - - >-
          THESIS: The company has enough breadth across rentals, sales, partners, and AI workflows to deserve more than
          a simple brokerage multiple.
        - >-
          View strengthens if management shows that adjacencies deepen monetization without materially increasing loss
          or service complexity.
      - - >-
          THESIS: A BRL 2 billion AI plan could improve conversion, pricing quality, and cost-to-serve, raising the
          probability of portal-like economics.
        - View strengthens if AI releases demonstrably lift margin or conversion within 12-18 months.
      - - >-
          ANTI-THESIS: Public evidence is still too thin on audited margins, cash generation, and risk-bearing exposure
          to justify paying near the old peak.
        - View softens if management provides audited statements, reserve data, and cohort economics.
      - - >-
          ANTI-THESIS: Regulatory trust and macro credit conditions can push QuintoAndar into a lower-multiple public
          bucket faster than private markets expect.
        - >-
          View softens if complaint intensity normalizes and sales-side performance proves resilient through tighter
          credit conditions.
    notes: Each argument is tied to evidence and includes a condition that could revise the recommendation.
    claimRefs:
      - CV001
      - CV003
      - CV012
      - CV013
      - CV014
      - CV015
      - CV039
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Key assumptions
      - Implied valuation
      - Key risks
      - Probability signal
    rows:
      - - BULL
        - >-
          ARR is at least real, AI spend improves conversion and margin, operating profitability becomes clearly
          visible, and trust issues do not recur.
        - 6x-7x ARR = about $4.5B-$5.25B
        - Regulatory hits, weak ROI on AI, or hidden loss exposure
        - 'Signals: audited margin improvement + visible operating leverage + no new material trust events'
      - - BASE
        - >-
          Scale is real, but disclosures stay incomplete and economics look mixed between portal and transaction-service
          models.
        - 4x-5x ARR = about $3.0B-$3.75B
        - Valuation remains capped by opacity and macro sensitivity
        - 'Signals: stable scale metrics + moderate margin progress + no major negative surprises'
      - - BEAR
        - >-
          Growth or monetization disappoints, housing-credit sensitivity bites, and the market treats QuintoAndar like a
          cyclical or trust-stressed brokerage.
        - 2.5x-3.5x ARR = about $1.9B-$2.6B
        - Multiple compression, margin pressure, or recurring sanctions
        - 'Signals: slower growth + credit weakness + further complaint or compliance stress'
    notes: >-
      Scenarios are ranges, not false-precision point estimates, and they depend heavily on the reliability of the ARR
      anchor.
    claimRefs:
      - CV011
      - CV026
      - CV027
      - CV028
      - CV029
      - CV030
  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Type
      - Metric
      - Multiple / valuation
      - Relevance
      - Limitation
    rows:
      - - Redfin
        - Public brokerage + portal hybrid
        - 2024 revenue ~$1.043B; market value ~$0.707B
        - ~0.7x revenue
        - Useful for brokerage-like downside bracket
        - Still U.S.-specific and not a direct guarantor-style rental model
      - - Opendoor
        - Public transaction-heavy proptech
        - 2024 revenue ~$5.2B; market value ~$0.987B
        - ~0.2x revenue
        - Useful bear-case floor for capital or macro-sensitive housing models
        - Home-inventory model is far more capital-intensive than QuintoAndar
      - - Compass
        - Public brokerage platform
        - 2024 revenue ~$5.629B; market value ~$1.427B
        - ~0.25x revenue
        - Shows how public markets price commission-heavy brokerage exposure
        - Agent-centric U.S. brokerage economics differ materially
      - - Zillow
        - Public real-estate audience / platform
        - 2024 revenue ~$2.2B; market value ~$9.4B
        - ~4x-plus revenue
        - Upper-middle benchmark for audience + software value
        - Much richer public disclosure and more portal-like economics
      - - CoStar
        - Public data + marketplace platform
        - 2024 revenue ~$2.7B; market value ~$30.1B
        - ~11x revenue
        - High-end premium benchmark for data-rich marketplace economics
        - Far more software/data-driven and much lower trust friction
      - - Rightmove
        - Public profitable property portal
        - 2024 revenue £389.9M; 70% underlying margin; 90% retention
        - Premium portal benchmark; exact multiple varies with market price
        - Helpful for understanding what best-in-class portal quality can earn
        - UK portal economics are cleaner and more profitable than QuintoAndar’s public picture
    notes: >-
      The right lesson from comps is not a single number; it is that QuintoAndar belongs in the middle of the public
      housing-tech spectrum, not at either extreme.
    enumerationScope:
      coverage: exhaustive
      basis: >-
        This register captures every directly reviewed public comparable used to bracket QuintoAndar in this chapter:
        Redfin, Opendoor, Compass, Zillow, CoStar, and Rightmove.
    claimRefs:
      - CV016
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Repeat trust or regulatory events
        - Multiple new sanctions, fines, or complaint spikes over 2+ quarters
        - Pushes QuintoAndar away from premium marketplace framing
        - Reset valuation toward bear/base low end
      - - AI program underdelivers
        - No visible margin or conversion gain after major spend period
        - Undercuts bull-case premium logic
        - Remove premium multiple assumptions
      - - Sales-side macro stress
        - Credit-tightening materially slows transaction velocity
        - Re-rates business toward lower public-housing multiples
        - Lower growth and exit assumptions
      - - Disclosure remains thin
        - Management cannot provide audited and segment-level economics in diligence
        - Prevents underwritten upside case
        - Stay at flag / no-commit
      - - Evidence of brokerage-like economics
        - Margins and retention fail to show portal-like quality
        - Collapses middle-bucket thesis
        - Treat as lower-multiple transaction business
    notes: These triggers are meant to be monitored, not admired. Each one changes the appropriate multiple.
    claimRefs:
      - CV029
      - CV030
      - CV037
      - CV038
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Audited financial statements
        - Revenue by line, gross margin, operating margin, cash flow
        - Needed to test whether ARR translates into durable earnings quality
        - Request from CFO / auditor
      - - Risk-bearing exposure
        - Guarantee, claims, reserve, delinquency, fraud, and loss data
        - Determines whether QuintoAndar behaves more like a marketplace or risk intermediary
        - Request from CFO / risk lead
      - - Cohort durability
        - Churn, renewal, repeat usage, NRR/GRR, CAC payback
        - Determines whether premium multiple is deserved
        - Request from growth / finance
      - - AI ROI
        - Roadmap milestones, spend by initiative, conversion or cost impact
        - Separates value-creating AI from narrative-heavy capex
        - Request from CTO / CPO
      - - Current price and preferences
        - Latest round, secondary mark, cap-table preference stack
        - Determines entry discipline and true downside protection
        - Request from CEO / finance / counsel
    notes: If management cannot satisfy these asks, the lack of evidence is itself a valuation conclusion.
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV036
