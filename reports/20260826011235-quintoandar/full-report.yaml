chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Core Offer, and Scale Signals
        blocks:
          - type: paragraph
            body: >-
              QuintoAndar presents itself as an end-to-end housing platform rather than a single listings site. The
              company says it was founded in 2012 in São Paulo by Gabriel Braga and André Penha and now serves the core
              residential journey across renting, buying, and selling. The core promise is friction removal: tenants can
              search, schedule visits, negotiate, pass credit review, and sign a contract digitally without the
              traditional Brazilian fiador requirement. That operating wedge still matters because guarantor-free
              execution is the clearest behavioral difference versus legacy brokers and portals. The official about page
              anchors scale with unusually concrete operating metrics: more than 15,000 new rental contracts per month,
              60,000 active listings, 30,000 exclusive properties, 500,000 scheduled rental visits per month, roughly
              3,000 property sales per month, and 150,000 monthly purchase visits. Those numbers, while company-issued,
              support a real claim that QuintoAndar is no longer just an early marketplace experiment; it is a
              high-volume transaction engine spanning multiple property workflows. The same source also emphasizes
              strong brand recall, including top-of-mind status and more than 30% of Google searches in its category,
              reinforcing consumer pull in addition to supply-side listings breadth.
