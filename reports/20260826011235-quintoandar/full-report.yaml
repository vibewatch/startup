  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market for QuintoAndar is narrower than “Brazilian real estate” and broader than “property
              classifieds.” At the narrow end, the company monetizes and facilitates residential rentals, residential
              sales, and adjacent services that reduce transaction friction for owners, tenants, buyers, sellers, and
              partner agencies. At the broad end, the company also participates in discovery, lead routing, agency
              software, and financing-enablement workflows, especially after building a larger ecosystem of brands and
              B2B tools. That means the market boundary includes both consumer transaction surfaces and some software or
              service layers surrounding those transactions. The most important status-quo substitutes remain fragmented
              imobiliárias, direct landlord-tenant negotiation, older online portals that focus on lead generation
              rather than managed workflows, and manual financing or documentation processes. This matters because
              QuintoAndar is not merely chasing listing traffic; it is trying to capture value where digital contracts,
              identity, payment, and service coordination remove frictions that the legacy market still leaves on the
              table. The company’s multi-city footprint and visible transaction scale suggest that housing digitization
              in Brazil has moved past experimentation, but it remains far from complete.
            claimRefs:
              - CM025
              - CM026
