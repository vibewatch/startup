      - number: '4.4'
        title: Financial Verdict and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is cautiously constructive. QuintoAndar looks far beyond the pre-revenue or
              pure-burn stage: it has significant transaction throughput, a credible self-funded strategic investment
              program, a large workforce, and a history of late-stage financing from sophisticated investors. At the
              same time, nearly every hard underwriting question that matters for price discipline—recognized revenue,
              take rate, gross margin, default losses, burn, debt, cash runway, and profitability—remains outside the
              public record. That forces any outside investor to distinguish between operational scale and investable
              financial certainty. Public evidence supports a thesis that the company can monetize housing workflows at
              scale and reallocate capital pragmatically when a product underperforms. It does not support a
              high-confidence view on normalized earnings power or downside protection. In practical terms,
              QuintoAndar’s financials are good enough to avoid a red flag on survivability, but not transparent enough
              to justify premium valuation underwriting without direct access to internal statements and unit-economics
