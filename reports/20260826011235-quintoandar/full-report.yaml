            body: >-
              QuintoAndar’s dependency risks are more subtle than classic single-supplier exposure. Partner agencies
              matter more as the sales ecosystem expands, mobile distribution still sits on Apple and Google rules, and
              housing credit conditions influence transaction velocity and consumer affordability. Brazil’s policy
              environment for data sharing and digital markets adds another layer if QuintoAndar expands financial or
              guarantee products further. Financial-model risk is amplified by opacity. The company has strong scale
              signals and third-party ARR estimates, but public disclosures remain far thinner than an investor would
              want for underwriting loss, reserve, fraud, and working-capital dynamics. That means the downside is less
              about “will people need housing?” and more about whether the current model can keep margins and trust
              stable while it scales capital-light promises across complicated transaction flows. In that sense,
              QuintoAndar’s residual risk is manageable but not trivial: the company looks strategically durable, yet
              several critical risk channels remain visible only through private diligence. Until internal dashboards
              are shared, the prudent stance is to assume residual volatility is higher than public evidence alone
              suggests. Investors should treat missing private metrics as an exposure in their own right, not merely as
