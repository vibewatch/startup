      - number: '8.2'
        title: What Public Comparables Say
        blocks:
          - type: paragraph
            body: >-
              The comparable set argues against simplistic valuation shortcuts. Redfin, Compass, and Opendoor show what
              happens when public investors treat housing businesses as transaction-heavy, cyclical, or
              capital-intensive: revenue can be large while multiples stay low. Zillow, CoStar, and Rightmove show the
              opposite end of the spectrum, where audience ownership, software, data, and portal economics support much
              higher valuation levels. QuintoAndar sits between those buckets. It has more operational complexity and
              trust exposure than a pure portal, yet it also appears more defensible and broader than a straightforward
              brokerage. That mixed profile explains why a public-market-like 0.2x to 0.7x revenue multiple would feel
              too punitive, while a double-digit software multiple would feel too generous without far better
              disclosure. For valuation, the comp set says QuintoAndar deserves an intermediate range that rewards its
              leadership but discounts its opacity and risk-bearing model elements. That middle position is precisely
              why a disciplined investor can like the company while still rejecting an overaggressive entry price.
