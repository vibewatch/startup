      - number: '8.4'
        title: Exit Readiness and Final Diligence
        blocks:
          - type: paragraph
            body: >-
              QuintoAndar increasingly looks like a company that could justify public-market attention one day, but it
              is not yet public-ready from a disclosure standpoint. The positive side is clear: scale is real, customer
              proof is substantial, and management is still investing aggressively. The limiting factor is transparency.
              Investors still need audited financial statements, segment and cohort detail, reserve or claims exposure,
              and a sharper picture of how much of QuintoAndar’s economics resemble a portal, a brokerage, or a
              risk-intermediating fintech. Those distinctions change the multiple more than narrative quality does.
              Final diligence therefore matters as much as headline valuation. If management can close the evidence
              gaps, the recommendation could move up quickly. If not, the absence of disclosure becomes a reason for
              sustained caution rather than a temporary inconvenience.
            claimRefs:
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
              - CV038
              - CV041
