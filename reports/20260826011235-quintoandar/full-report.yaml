      - number: '2.4'
        title: Buyer Segmentation, Adoption Path, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              QuintoAndar’s market is best understood as a linked set of economic actors rather than a single customer.
              Renters value convenience, reduced bureaucracy, and search quality; landlords care about vacancy, payment
              certainty, and speed to close; home buyers and sellers want discovery, data, and coordinated execution;
              partner agencies seek lead generation and conversion lift; and B2B surfaces increasingly want AI-enabled
              response, qualification, and workflow support. The product therefore sits across multiple buyer-user-payer
              combinations, which is a strength for ecosystem expansion but a challenge for clean segment-level revenue
              analysis. Public evidence shows strong demand proxies—monthly rentals, monthly sales, ecosystem visits,
              and partner-agency conversion—but still leaves major diligence gaps around exact share by subsegment,
              segment profitability, and the split between rentals, sales, and software monetization. Those missing
              links matter because a giant national housing market can still translate into a much smaller monetizable
              niche if take rates compress or certain cohorts multi-home across competing portals. The conclusion is
              positive on demand backdrop but disciplined on sizing: QuintoAndar is clearly in a structurally important
              market, yet the investable question is submarket economics, not headline Brazilian real-estate GDP.
