      - number: '1.3'
        title: Capital History, Valuation, and Expansion Logic
        blocks:
          - type: paragraph
            body: >-
              QuintoAndar has already cleared the capital-formation hurdle that many LatAm proptechs fail to cross.
              Third-party funding trackers and company releases consistently support a step-up from early Kaszek-backed
              rounds to General Atlantic, SoftBank, Ribbit, Tencent, Greenoaks, and Grupoglobo participation. The
              best-supported total raised figure is roughly three quarters of a billion dollars across seven rounds,
              with the last clearly market-cleared valuation set in August 2021 at $5.1 billion during the Series E
              extension. That funding history matters not only as an old mark but as an explanation for later strategic
              moves. The Navent acquisition materially expanded the company from a Brazil-first managed marketplace into
              a regional ecosystem with classifieds and software assets across Argentina, Mexico, Peru, Ecuador, and
              Panama. The valuation context is more nuanced than the headline: 2021 was an unusually generous tech
              multiple environment, and public sources do not show a fresh institutional round after December 2022.
              Still, there is also no public evidence of a down round or rescue financing. The company therefore enters
              2026 with a prestigious, but stale, last-round price that must now be judged against operational evidence
              rather than fresh market clearing.
