              The scenario work points to a practical answer. A bear case around 2.5x to 3.5x ARR places QuintoAndar
              near $1.9 billion to $2.6 billion, roughly where public markets often punish housing businesses with
              cyclical or disclosure-heavy concerns. A base case around 4x to 5x ARR yields about $3.0 billion to $3.75
              billion, which better matches a scaled marketplace with category leadership but incomplete public
              economics. A bull case around 6x to 7x ARR reaches roughly $4.5 billion to $5.25 billion, essentially
              returning QuintoAndar toward its prior peak only if the AI plan translates into better margins, trust
              holds, and profitability becomes visible. On that framing, the recommendation is flag / price-sensitive
              research-more. The company is probably investable at the right entry; what public evidence does not
              support is complacency at a premium price. A disciplined term sheet should therefore be built around
