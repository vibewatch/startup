  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation flows from real scale and strategic quality into disclosure and risk discounts that block a
      clean pass at premium pricing.
    data:
      nodes:
        - id: N1
          label: Real scale and category leadership
          detail: High rental, sales, GMV, and contract volumes are real.
          tone: positive
        - id: N2
          label: AI and platform upside
          detail: Large technology investment could improve conversion and margins.
          tone: positive
        - id: N3
          label: Disclosure gap
          detail: ARR, margins, reserves, and current pricing remain only partially public.
          tone: risk
        - id: N4
          label: Trust and macro risk
          detail: Regulatory complaints and housing-credit sensitivity compress premium multiples.
          tone: risk
        - id: N5
          label: Middle-bucket valuation
          detail: More than brokerage, less than clean portal premium.
          tone: neutral
        - id: N6
          label: Flag / price-sensitive research-more
          detail: Investable at the right discount, not at blind peak-unicorn pricing.
          tone: neutral
      edges:
        - from: N1
          to: N5
          label: supports premium to low-end comps
        - from: N2
          to: N5
          label: supports upside optionality
        - from: N3
          to: N6
          label: blocks clean pass
        - from: N4
          to: N6
          label: requires discount
        - from: N5
          to: N6
          label: sets entry stance
        - from: N1
          to: N6
          label: keeps company on the list
    claimRefs:
      - CV001
      - CV003
      - CV012
      - CV013
      - CV014
      - CV040
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: Small changes in the revenue multiple drive large valuation swings around the same ARR anchor.
    data:
      items:
        - label: Bear 2.5x on $750M
          value: 1.9
          note: Low bear outcome in $B
        - label: Bear 3.5x on $750M
          value: 2.6
          note: High bear outcome in $B
        - label: Base 4.0x on $750M
          value: 3
          note: Low base outcome in $B
        - label: Base 5.0x on $750M
          value: 3.75
          note: High base outcome in $B
        - label: Bull 6.0x on $750M
          value: 4.5
          note: Low bull outcome in $B
        - label: Bull 7.0x on $750M
          value: 5.25
          note: High bull outcome in $B
    claimRefs:
      - CV011
      - CV026
      - CV027
      - CV028
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: The supportable range sits below the old 2021 peak in base case and only regains it in a full bull case.
    data:
      items:
        - label: Bull case
          low: 4500
          mid: 4900
          high: 5250
          unit: $M
          detail: AI and profitability proof justify a near-peak re-rating.
          tone: positive
        - label: Base case
          low: 3000
          mid: 3400
          high: 3750
          unit: $M
          detail: Scaled leader but still disclosure-discounted.
          tone: neutral
        - label: Bear case
          low: 1900
          mid: 2250
          high: 2600
          unit: $M
          detail: Macro, trust, or economics push it toward public-housing discounts.
          tone: risk
    claimRefs:
      - CV026
      - CV027
      - CV028
      - CV032
      - CV043
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: wide
    summary: QuintoAndar scores strongly on market proof but materially weaker on transparency and price support.
    data:
      items:
        - label: Market and scale proof
          value: Strong
          tone: positive
          detail: Official rental, sales, visit, GMV, and contract metrics indicate real category leadership.
        - label: Customer and product proof
          value: Strong
          tone: positive
          detail: App ratings, partner growth, and AI roadmap support a durable product narrative.
        - label: Competitive position
          value: Moderate-strong
          tone: positive
          detail: Broad housing workflow and local scale appear defensible, but portals and brokerages remain relevant comps.
        - label: Financial transparency
          value: Weak
          tone: risk
          detail: ARR is secondary-sourced and public margin detail remains insufficient.
        - label: Risk load
          value: Medium-high
          tone: risk
          detail: Trust, privacy, credit, and macro factors can all compress the valuation.
        - label: Valuation support at sub-peak entry
          value: Moderate
          tone: neutral
          detail: Base-case support exists below the prior peak if scale proves durable.
        - label: Valuation support near peak pricing
          value: Weak
          tone: risk
          detail: The 2021 $5.1B mark needs fresher proof before it becomes investable again.
    claimRefs:
      - CV001
      - CV003
      - CV012
      - CV024
      - CV033
      - CV040
      - CV043
