      - number: '4.3'
        title: Capital Allocation and Balance-Sheet Signals
        blocks:
          - type: paragraph
            body: >-
              The best public signal on QuintoAndar’s financial maturity is not a disclosed EBITDA margin but the
              combination of funding history, capex ambition, and portfolio pruning. The company has already raised
              roughly $755 million across seven rounds and last clearly priced the business at more than $5 billion in
              2021, with a disclosed but undisclosed-size follow-on event in 2022. That capital base matters because
              management now says it can invest BRL 2 billion in technology over two years using its own resources
              rather than new equity. If accurate, that implies at least enough internal cash-generation confidence to
              commit to a major multi-year plan. QuintoCred’s restructuring points in the same direction: the company
              appears willing to shut or shrink subscale or lower-priority activities rather than carry them
              indefinitely. Velo, by contrast, shows a willingness to buy capabilities that support partner monetization
              and risk-transfer economics. Still, no public source provides cash on hand, debt balances, burn, or
              runway. Capital discipline is visible; capital adequacy remains partly opaque.
