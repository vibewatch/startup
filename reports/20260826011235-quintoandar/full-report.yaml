      - number: '1.4'
        title: Milestones, Operating Momentum, and Adverse Baseline
        blocks:
          - type: paragraph
            body: >-
              The 2025-2026 milestone set tells a story of scale plus deliberate platform reinvestment. QuintoAndar says
              it surpassed BRL 20 billion in one-year transaction volume, had about 300,000 contracts under management,
              and saw partner agencies double sales under the marketplace model. Management also says company revenue
              has grown fifteen times since 2020 and that more than 3 million people have already benefited from the
              platform, with 1 million added in the prior eighteen months. The June 2026 headquarters announcement pairs
              those growth claims with a R$2 billion technology program, and third-party reporting frames that spend as
              self-funded rather than a new round—an encouraging but still unaudited signal of operating durability. The
              AI stack also appears increasingly customer-facing through the ChatGPT integration and internal
              productivity tooling. Against that positive arc, the baseline chronology must still include friction
              points: QuintoCred was restructured in 2025 to refocus resources on core businesses, and G1 reported a
              June 2025 Procon-SP fine for abusive consumer practices. Those events do not break the thesis, but they do
              establish that QuintoAndar is now large enough for regulatory and consumer-protection scrutiny to become a
              recurring part of the story.
