  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis Versus Price Discipline
        blocks:
          - type: paragraph
            body: >-
              The investment thesis is not hard to see. QuintoAndar has scale, brand, category leadership, and a broad
              housing workflow spanning rentals, sales, partners, and adjacent services. Official disclosures plus
              third-party reporting point to high monthly rental and sales activity, large managed-contract volume, and
              BRL 20 billion in annual transacted value. That is enough to separate QuintoAndar from speculative
              proptech stories. But valuation decisions cannot stop at quality. The public denominator is still weak:
              the widely repeated $750 million ARR figure is not audited company disclosure, the last famous pricing
              mark is the 2021 $5.1 billion valuation, and the public record is thin on current margins, cash
              generation, and loss-bearing exposure. That means QuintoAndar may be a strong business whose observable
              evidence still argues for price discipline. The right conclusion is not “avoid,” but “do not pay
              peak-unicorn prices without fresh proof.” In practice, that means the investment debate should focus less
              on brand admiration and more on whether a new round, tender, or diligence packet can justify the multiple
              being asked today.
