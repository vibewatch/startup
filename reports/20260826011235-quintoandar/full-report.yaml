      - number: '3.4'
        title: Moat Durability, Multi-Homing, and Competitive Risk
        blocks:
          - type: paragraph
            body: >-
              QuintoAndar’s moat is real but not absolute. The managed-rental and contract-execution layer is harder to
              copy than cosmetic search or listing UX, and the company’s operating scale plus transaction history
              support that point. Yet the category still has several structural limits on moat durability. Sellers,
              landlords, and agencies can multi-home. Competitor pricing is not transparent enough to rule out
              aggressive discounting. Trust and regulatory posture can erode advantage in a business where consumers
              fear being trapped by fees, arbitration clauses, or poor service quality. Meanwhile, large portals can use
              scale to shape consumer entry points and seller expectations even if they do not own the full workflow.
              The best synthesis is that QuintoAndar has moved beyond being “just another portal,” especially in rentals
              and agency tooling, but it still operates in a market where inventory distribution and consumer attention
              are contestable. The company’s long-run edge therefore depends on whether its deeper workflow ownership
              keeps compounding faster than rivals can replicate the most visible parts of the experience.
