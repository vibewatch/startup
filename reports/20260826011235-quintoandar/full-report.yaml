  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              The most concrete external risk evidence is regulatory and legal. G1 reported that Procon-SP fined
              QuintoAndar in 2025 for abusive consumer practices, making customer-trust and consumer-protection exposure
              more than hypothetical. Privacy is the second major front. QuintoAndar publicly says it has a privacy
              program, a specialized team, and a DPO, but the broader Brazilian context is getting stricter. The LGPD is
              broad, and outside counsel commentary plus ANPD activity indicate more active enforcement, including
              breach disclosure, transfer rules, and AI-related oversight. For a company whose workflows touch identity,
              contracts, messaging, home visits, and pricing intelligence, that matters materially. Antitrust is a third
              legal layer. QuintoAndar’s expansion through acquisitions and platform scale occurs as CADE is increasing
              scrutiny on digital-market conduct and merger behavior. None of this proves an active existential legal
              crisis, but it does support a view that legal and regulatory complexity is rising faster than the
              simplicity of the business model. A late-stage investor therefore needs not only comfort on headline
              compliance, but also evidence that the company can absorb repeat scrutiny without slowing growth or
              damaging customer trust. That is especially important in Brazil, where consumer, privacy, and competition
              oversight can move on different timelines yet still converge on the same operating model.
