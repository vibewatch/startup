- id: revenue-range-and-quality-assessment
  title: Revenue Range, Revenue Quality, and Unit-Economics Uncertainty
  body: 'The headline revenue figure in public circulation is GetLatka’s roughly $750 million of 2024 ARR. It is directionally useful but not investor-grade by itself, because the methodology is not audited and may not match recognized revenue. When triangulated against BRL 20 billion of transaction value and the company’s disclosed operating volumes, the figure implies a business of meaningful scale, but still leaves a wide confidence band around true recurring revenue, gross margin, and contribution margin. Workforce data add another rough lens: with roughly 4,828 employees, ARR per employee would look healthy if the $750 million figure were robust, but less compelling if recognized revenue is materially below that number. The financial quality question is therefore less about whether QuintoAndar monetizes at all—it clearly does—and more about how much of that monetization is recurring, how much is transaction-driven, and what loss or service costs sit underneath guarantee-linked products
    and complex operations. Public diligence can describe the revenue engine; it cannot yet certify its quality.'
