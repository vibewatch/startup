chapter:
  number: 4
  title: Financials
  summary: 'QuintoAndar’s public financial picture is volume-rich but accounting-light: the company discloses large operating activity, stale funding history, and a self-funded BRL 2 billion AI program, but not audited revenue, margin, cash, or runway. The best read is a scaled business with credible monetization surfaces and improving discipline, offset by substantial disclosure gaps around revenue quality and capital adequacy.'
sections:
- id: revenue-model-and-traction-proxies
  title: Revenue Model and Public Traction Proxies
  body: 'QuintoAndar’s public evidence points to a diversified monetization model built around managed rentals, residential sales, and partner-facing housing services rather than a single take-rate line item. The core rental operation likely provides the most durable recurring revenue surface because it sits on an ongoing contract base rather than a one-time transaction. Home sales add higher-ticket but more cyclical monetization, while partner tools and guarantee-related products create additional wallet-share opportunities with agencies and owners. What is unusually helpful is the amount of activity data the company does publish: 15,000-plus rental contracts per month, about 3,000 property sales per month, hundreds of thousands of scheduled visits, and BRL 20 billion in one-year transaction value. Those are not financial statements, but they are strong volume proxies. They suggest QuintoAndar already operates at enough scale to support meaningful revenue. The problem is translation: public
    materials do not reveal the take rate, mix, or recognition policy that would convert GMV and contract counts into reliable recognized revenue or gross profit.'
