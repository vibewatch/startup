  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cash-and-runway
    missingEvidence: Cash balance, debt, monthly burn, and runway bridge through the BRL 2 billion technology plan.
    whyItMatters: Self-funded capex sounds positive but does not reveal whether QuintoAndar can finance downside scenarios without external capital.
    diligencePath: Request monthly cash bridge, debt schedule, and board-approved capex plan.
    relatedQuestionRefs:
    - QI017
    - QI024
  - type: private-evidence-only
    severity: material
    topic: margin-and-take-rate
    missingEvidence: Recognized revenue, gross margin, contribution margin, take rate by business line, and default-loss metrics.
    whyItMatters: GMV and ARR proxies are insufficient to judge revenue quality or unit economics.
    diligencePath: Request audited P&L plus business-line revenue and loss triangles.
    relatedQuestionRefs:
    - QI003
    - QI015
    - QI018
    - QI024
  - type: missing-source
    severity: minor
    topic: quarterly-financials
    missingEvidence: Quarterly company financial statements to match the cadence of public DataHouse market reports.
    whyItMatters: The company publishes market data regularly but not investor-grade financial disclosures.
    diligencePath: Ask management for internal monthly KPI packs and board decks.
    relatedQuestionRefs:
