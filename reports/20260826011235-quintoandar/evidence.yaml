evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-governance and investor table TO003
    missingEvidence: Current board composition, voting rights, ownership stakes by lead investors, and committee structure.
    whyItMatters: >-
      Governance concentration and investor control cannot be judged from press releases alone, so the stakeholder table
      remains only partially complete.
    diligencePath: Request cap table, board observer list, shareholder agreement excerpts, and committee matrix.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited revenue, margin, EBITDA, and cash flow for 2024-2026.
    whyItMatters: Cover metrics currently depend on company statements and third-party estimates rather than audited filings.
    diligencePath: Request audited financial statements or lender/investor reporting pack.
    relatedQuestionRefs:
      - QO019
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: A single management-approved headcount and geography split.
    whyItMatters: Group site floors and workforce-intelligence estimates diverge, affecting productivity calculations.
    diligencePath: Ask finance or people ops for latest FTE, contractor, and country breakdown.
    relatedQuestionRefs:
      - QO016
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-table TO002
    missingEvidence: A complete executive org chart and board roster covering all material leaders and directors.
    whyItMatters: >-
      The public leadership table is intentionally partial, so investors cannot fully test succession depth or board
      independence.
    diligencePath: Request org chart, board list, and committee matrix from management.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A reconciled addressable-market model that bridges broad real-estate spend, digital listings, and actual
      monetizable platform revenue pools.
    whyItMatters: Top-down TAM studies overstate the near-term revenue opportunity for a managed marketplace like QuintoAndar.
    diligencePath: Ask management for internal TAM/SAM/SOM waterfall with take-rate assumptions and segment mix.
    relatedQuestionRefs:
      - QM018
      - QM019
  - type: missing-source
    severity: material
    topic: market-share
    missingEvidence: >-
      Public share data for QuintoAndar versus OLX/ZAP, Viva Real, Loft, and other portals by listings, traffic, and
      closed transactions.
    whyItMatters: Without share data, relative competitive position inside each submarket remains partially inferred.
    diligencePath: Request internal share dashboards or third-party traffic/listings studies segmented by rentals and sales.
    relatedQuestionRefs:
      - QM024
  - type: private-evidence-only
    severity: minor
    topic: segment economics
    missingEvidence: Mix of QuintoAndar GMV and revenue by rentals, sales, financing, and B2B software.
    whyItMatters: Chapter can explain market fit but not precisely size the monetizable share of each customer segment.
    diligencePath: Request management revenue mix bridge by business line.
    relatedQuestionRefs:
      - QM019
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Public take-rate, subscription, and discount schedules for QuintoAndar, Loft, ZAP, Viva Real, and Imovelweb.
    whyItMatters: Pricing opacity limits rigorous comparison of monetization durability and unit economics across rivals.
    diligencePath: Request internal competitor pricing tear sheet or broker-side contracts.
    relatedQuestionRefs:
      - QP017
      - QP024
  - type: private-evidence-only
    severity: material
    topic: conversion
    missingEvidence: Competitor conversion, retention, and repeat-usage metrics by channel and product.
    whyItMatters: >-
      Traffic or listings breadth alone does not reveal how effectively each player converts intent into closed
      transactions.
    diligencePath: Ask management for internal win-rate and funnel benchmarks against OLX/ZAP and Loft.
    relatedQuestionRefs:
      - QP008
      - QP025
  - type: conflicting-data
    severity: minor
    topic: competitive-share
    missingEvidence: Unified market-share definitions for rentals, sales, listings, and agency software across Brazil and LatAm.
    whyItMatters: >-
      Different sources describe leadership using different units, which can overstate or understate competitive
      position.
    diligencePath: 'Force each claim onto a single denominator: listings, traffic, contracts, or GMV.'
    relatedQuestionRefs:
      - QP001
      - QP007
      - QP024
  - type: private-evidence-only
    severity: material
    topic: cash-and-runway
    missingEvidence: Cash balance, debt, monthly burn, and runway bridge through the BRL 2 billion technology plan.
    whyItMatters: >-
      Self-funded capex sounds positive but does not reveal whether QuintoAndar can finance downside scenarios without
      external capital.
    diligencePath: Request monthly cash bridge, debt schedule, and board-approved capex plan.
    relatedQuestionRefs:
      - QI017
      - QI024
  - type: private-evidence-only
    severity: material
    topic: margin-and-take-rate
    missingEvidence: Recognized revenue, gross margin, contribution margin, take rate by business line, and default-loss metrics.
    whyItMatters: GMV and ARR proxies are insufficient to judge revenue quality or unit economics.
    diligencePath: Request audited P&L plus business-line revenue and loss triangles.
    relatedQuestionRefs:
      - QI003
      - QI015
      - QI018
      - QI024
  - type: missing-source
    severity: minor
    topic: quarterly-financials
    missingEvidence: Quarterly company financial statements to match the cadence of public DataHouse market reports.
    whyItMatters: The company publishes market data regularly but not investor-grade financial disclosures.
    diligencePath: Ask management for internal monthly KPI packs and board decks.
    relatedQuestionRefs:
      - QI014
      - QI022
  - type: private-evidence-only
    severity: material
    topic: architecture
    missingEvidence: >-
      System architecture diagrams, core service boundaries, uptime/SLA history, and build-versus-buy decisions for AI
      products.
    whyItMatters: >-
      Workflow maturity is visible, but technical diligence still lacks the underlying architecture and reliability
      evidence.
    diligencePath: Request engineering architecture deck and platform reliability reviews.
    relatedQuestionRefs:
      - QE009
      - QE019
  - type: private-evidence-only
    severity: material
    topic: privacy-and-security
