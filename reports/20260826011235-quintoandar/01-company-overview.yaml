  - TO002
- id: capital-history-and-valuation-context
  title: Capital History, Valuation, and Expansion Logic
  body: 'QuintoAndar has already cleared the capital-formation hurdle that many LatAm proptechs fail to cross. Third-party funding trackers and company releases consistently support a step-up from early Kaszek-backed rounds to General Atlantic, SoftBank, Ribbit, Tencent, Greenoaks, and Grupoglobo participation. The best-supported total raised figure is roughly three quarters of a billion dollars across seven rounds, with the last clearly market-cleared valuation set in August 2021 at $5.1 billion during the Series E extension. That funding history matters not only as an old mark but as an explanation for later strategic moves. The Navent acquisition materially expanded the company from a Brazil-first managed marketplace into a regional ecosystem with classifieds and software assets across Argentina, Mexico, Peru, Ecuador, and Panama. The valuation context is more nuanced than the headline: 2021 was an unusually generous tech multiple environment, and public sources do not show a fresh institutional
    round after December 2022. Still, there is also no public evidence of a down round or rescue financing. The company therefore enters 2026 with a prestigious, but stale, last-round price that must now be judged against operational evidence rather than fresh market clearing.'
  claimRefs:
  - CO018
  - CO019
  - CO020
  - CO021
  - CO029
  - CO030
  tableRefs:
  - TO003
  figureRefs:
  - FO001
- id: milestones-operating-momentum-and-adverse-baseline
  title: Milestones, Operating Momentum, and Adverse Baseline
  body: 'The 2025-2026 milestone set tells a story of scale plus deliberate platform reinvestment. QuintoAndar says it surpassed BRL 20 billion in one-year transaction volume, had about 300,000 contracts under management, and saw partner agencies double sales under the marketplace model. Management also says company revenue has grown fifteen times since 2020 and that more than 3 million people have already benefited from the platform, with 1 million added in the prior eighteen months. The June 2026 headquarters announcement pairs those growth claims with a R$2 billion technology program, and third-party reporting frames that spend as self-funded rather than a new round—an encouraging but still unaudited signal of operating durability. The AI stack also appears increasingly customer-facing through the ChatGPT integration and internal productivity tooling. Against that positive arc, the baseline chronology must still include friction points: QuintoCred was restructured in 2025 to refocus resources
    on core businesses, and G1 reported a June 2025 Procon-SP fine for abusive consumer practices. Those events do not break the thesis, but they do establish that QuintoAndar is now large enough for regulatory and consumer-protection scrutiny to become a recurring part of the story.'
