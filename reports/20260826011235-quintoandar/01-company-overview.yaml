  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-governance and investor table TO003
    missingEvidence: Current board composition, voting rights, ownership stakes by lead investors, and committee structure.
    whyItMatters: Governance concentration and investor control cannot be judged from press releases alone, so the stakeholder table remains only partially complete.
    diligencePath: Request cap table, board observer list, shareholder agreement excerpts, and committee matrix.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited revenue, margin, EBITDA, and cash flow for 2024-2026.
    whyItMatters: Cover metrics currently depend on company statements and third-party estimates rather than audited filings.
    diligencePath: Request audited financial statements or lender/investor reporting pack.
    relatedQuestionRefs:
    - QO019
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: A single management-approved headcount and geography split.
    whyItMatters: Group site floors and workforce-intelligence estimates diverge, affecting productivity calculations.
    diligencePath: Ask finance or people ops for latest FTE, contractor, and country breakdown.
    relatedQuestionRefs:
    - QO016
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-table TO002
    missingEvidence: A complete executive org chart and board roster covering all material leaders and directors.
    whyItMatters: The public leadership table is intentionally partial, so investors cannot fully test succession depth or board independence.
    diligencePath: Request org chart, board list, and committee matrix from management.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO002
