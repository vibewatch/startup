- id: sizing-the-addressable-opportunity
  title: Sizing the Addressable Opportunity
  body: 'Top-down studies make the opportunity look enormous, but the useful diligence question is which layer QuintoAndar can actually monetize. Third-party researchers place Brazil’s total real-estate market above $230 billion in 2024 and above $263 billion in 2025, while IMARC sizes the domestic proptech segment near $866 million in 2025 and projects double-digit CAGR into the next decade. Coraly’s portal-market framing is more relevant than a generic construction or property-spend TAM because it isolates digital discovery and transaction intent. At the same time, top-down numbers should be handled carefully: a managed marketplace cannot monetize the full value of underlying homes any more than a broker can take the gross merchandise value as revenue. The most grounded signals come from price and volume datasets such as FipeZap and QuintoAndar’s own disclosed transaction activity, not only from consultant market models. Practically, that means the best working SAM is the digitally searchable
    and serviceable slice of urban rental and resale transactions plus adjacent broker software rather than the entire property stock or all construction spend. Investors should therefore use broad TAMs as directional context and build underwriting from transaction, take-rate, and adoption constraints upward.'
