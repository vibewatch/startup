chapter:
  number: 3
  title: Competitors
  summary: 'QuintoAndar competes on a different axis from pure listings portals: it is strongest where underwriting, contract execution, and service operations matter, while OLX/ZAP remain powerful on inventory and top-of-funnel discovery. The Navent portfolio and newer B2B tooling expand QuintoAndar’s moat, but multi-homing and opaque competitor pricing keep commoditization risk real.'
sections:
- id: landscape-and-core-peer-set
  title: Landscape, Incumbents, and Direct Peer Set
  body: 'The competitive landscape is not a simple one-on-one fight. QuintoAndar sits at the intersection of managed rentals, residential sales, listings discovery, and now agency-facing workflow software. That places its direct peers across several categories: OLX Group’s ZAP and Viva Real brands dominate open listings and discovery breadth; Loft competes more in sales-side, brokerage, financing, and agency productivity layers; Imovelweb and other Navent-origin brands matter both as current portfolio assets and as evidence of how fragmented the Latin American market still is. The status quo substitute is also powerful: many transactions still flow through traditional imobiliárias, informal landlord-tenant negotiation, or multi-portal listing behavior rather than a single integrated platform. This matters because QuintoAndar’s strongest competitive claims are not just about traffic, but about moving more of the transaction stack into a single managed workflow. Investors should therefore
    distinguish between “who owns browsing traffic,” “who owns listing supply,” and “who actually owns risk-bearing, contract-bearing execution.” Those are overlapping but not identical battlegrounds.'
