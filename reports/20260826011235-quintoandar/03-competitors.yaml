  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Public take-rate, subscription, and discount schedules for QuintoAndar, Loft, ZAP, Viva Real, and Imovelweb.
    whyItMatters: Pricing opacity limits rigorous comparison of monetization durability and unit economics across rivals.
    diligencePath: Request internal competitor pricing tear sheet or broker-side contracts.
    relatedQuestionRefs:
    - QP017
    - QP024
  - type: private-evidence-only
    severity: material
    topic: conversion
    missingEvidence: Competitor conversion, retention, and repeat-usage metrics by channel and product.
    whyItMatters: Traffic or listings breadth alone does not reveal how effectively each player converts intent into closed transactions.
    diligencePath: Ask management for internal win-rate and funnel benchmarks against OLX/ZAP and Loft.
    relatedQuestionRefs:
    - QP008
    - QP025
  - type: conflicting-data
    severity: minor
    topic: competitive-share
    missingEvidence: Unified market-share definitions for rentals, sales, listings, and agency software across Brazil and LatAm.
    whyItMatters: Different sources describe leadership using different units, which can overstate or understate competitive position.
    diligencePath: 'Force each claim onto a single denominator: listings, traffic, contracts, or GMV.'
