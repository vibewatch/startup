- id: trust-quality-and-product-verdict
  title: Trust, Quality, and Product Verdict
  body: 'QuintoAndar’s public product evidence is strong enough to support a positive maturity assessment, but not strong enough to clear technical diligence by itself. The strongest signals are breadth of workflow ownership, active product use in app stores, agency enablement through Domi and the marketplace, and a clear roadmap funded by a large technology investment plan. The company also shows some product discipline by pruning QuintoCred instead of expanding every experiment indefinitely. Where evidence is weakest is exactly where later-stage buyers or lenders will care most: formal privacy, security, compliance, and AI-governance controls. Public sources do not explain training-data governance, uptime history, credit-model monitoring, or security certifications in enough detail to underwrite operational risk. That means the product-tech verdict is favorable on user workflow and commercial relevance, but conditional on deeper engineering and compliance review before investors should
    assume the visible interface quality fully reflects underlying platform resilience.'
  claimRefs:
