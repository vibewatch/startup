figures:
- id: FE001
  title: Product architecture map
  type: stack
  layout: wide
  summary: QuintoAndar’s stack layers consumer search, transaction workflow, partner tooling, and adjacencies on top of shared data and AI capabilities.
  data:
    layers:
    - label: Interface layer
      detail: Consumer and partner entry points across web, mobile, messaging, and external AI surfaces.
      items:
      - Web marketplace
      - iOS app
      - Android app
      - WhatsApp / ChatGPT surfaces
    - label: Workflow layer
      detail: Core transaction steps that turn discovery into scheduled visits, qualification, and closing support.
      items:
      - Search and shortlist
      - Visit scheduling
      - Qualification
      - Digital contract support
    - label: Partner layer
      detail: Products that help agencies route leads, qualify demand, and manage co-sell workflows.
      items:
      - Agency marketplace
      - Domi assistant
      - CRM / portal integrations
    - label: Adjacency layer
      detail: Non-core modules that extend the housing journey into guarantees, condos, and supplier ecosystems.
      items:
      - Velo guarantee tools
      - Noknox condo app
      - SíndicoNet services
    - label: Shared intelligence layer
      detail: Data, AI, and pricing services reused across consumer and partner experiences.
      items:
      - Conversational search
      - Pricing / valuation support
      - Market-research content
