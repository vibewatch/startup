  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: architecture
    missingEvidence: System architecture diagrams, core service boundaries, uptime/SLA history, and build-versus-buy decisions for AI products.
    whyItMatters: Workflow maturity is visible, but technical diligence still lacks the underlying architecture and reliability evidence.
    diligencePath: Request engineering architecture deck and platform reliability reviews.
    relatedQuestionRefs:
    - QE009
    - QE019
  - type: private-evidence-only
    severity: material
    topic: privacy-and-security
    missingEvidence: Privacy controls, AI-governance standards, model-audit process, and formal security or compliance certifications.
    whyItMatters: Housing, credit, and messaging workflows expose sensitive user data and potentially regulated decisions.
    diligencePath: Request security questionnaire, privacy impact assessments, and model-governance policy.
    relatedQuestionRefs:
    - QE012
    - QE022
  - type: missing-source
    severity: minor
    topic: roadmap
    missingEvidence: Public release notes tying specific roadmap milestones to ship dates and adoption metrics.
    whyItMatters: Public ambition is clear but milestone completion tracking is not.
    diligencePath: Ask product leadership for roadmap, shipped-feature timeline, and adoption dashboard.
    relatedQuestionRefs:
    - QE010
    - QE018
