  topStrengths:
    - QuintoAndar has genuine category scale in Brazilian housing, supported by disclosed rental, sales, GMV, and contract metrics rather than narrative alone.
    - The company spans rentals, home sales, partner agencies, and AI-assisted housing workflows, giving it more monetization breadth than a simple brokerage.
    - Continued self-funded investment in technology and AI suggests management still sees room to deepen product quality and operating leverage.
  topRisks:
    - Audited financial quality, gross margin, and reserve exposure remain opaque for a business of this scale.
    - Consumer-protection and trust issues have already surfaced publicly, including the 2025 Procon-SP fine.
    - Sales-side performance is exposed to Brazilian housing-credit conditions and macro sensitivity.
    - The AI roadmap could become expensive narrative spend if it does not translate into conversion or margin gains.
    - Public comparables suggest the market can sharply discount housing businesses that look more like transaction-heavy brokers than software-rich portals.
  unresolvedGaps:
    - Audited financial statements and revenue-by-line, gross-margin, and operating-margin detail are not public.
    - Cohort retention, churn, NRR/GRR, CAC payback, and segment contribution margins remain undisclosed.
    - Reserve, claims, delinquency, fraud, and risk-bearing product exposure are not public.
    - No fresh public priced round or cap-table preference detail was confirmed after the stale peak-unicorn mark.
