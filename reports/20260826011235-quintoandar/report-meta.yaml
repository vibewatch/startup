companyProfile:
  summary: >-
    QuintoAndar is a São Paulo-based housing platform founded in 2012 by Gabriel Braga and André Penha. It combines a
    digital rental marketplace, home-buying and selling workflows, partner-agency tools, and adjacent housing services
    across Brazil and other parts of Latin America. Public evidence supports real operating scale rather than a narrow
    niche: QuintoAndar reports more than 15,000 new rental contracts per month and 3,000 home sales per month, while
    outside reporting and company disclosures point to BRL 20 billion of annual transacted value, about 300,000
    contracts under management, and an estimated $750 million ARR in 2024. The central diligence question is no longer
    whether QuintoAndar matters in its market; it is whether the company’s economics, risk-bearing exposure, and
    disclosure quality justify anything close to its old peak-unicorn pricing.
