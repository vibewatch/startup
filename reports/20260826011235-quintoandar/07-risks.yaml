- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Consumer-protection / trust
    - Regulatory or complaint recurrence
    - Multiple new sanctions or rising unresolved complaints for 2+ quarters
    - Pause positive underwriting; demand remediation proof
  - - AI execution
    - ROI and quality evidence
    - No measurable conversion, CSAT, or margin improvement after major AI spend window
    - Reduce conviction; revisit valuation and capex discipline
  - - Channel dependency
    - Agency or app-platform deterioration
    - Agency sales contribution stalls or platform-policy changes cut conversion
    - Lower growth assumptions
  - - Credit / macro sensitivity
    - Housing-finance contraction
    - Persistent mortgage or credit tightening reduces sales velocity materially
    - Weight rental-only resilience more heavily
  - - Loss-opacity
    - Private diligence shortfall
    - Company cannot produce incident, reserve, or dispute dashboards
    - Treat residual risk as higher than currently modeled
  notes: Kill criteria are designed to be observable within diligence or the first 12–18 months after investment.
