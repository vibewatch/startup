  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局、既有玩家与直接同业
        blocks:
          - type: paragraph
            body: >-
              竞争格局不是简单的一对一。QuintoAndar 处在托管租赁、住宅销售、房源发现以及面向中介的工作流软件交叉点。直接同业因此分布在几个类别：OLX Group 的 ZAP 和 Viva Real
              品牌主导开放房源和发现广度；Loft 更偏销售端、经纪、融资和中介生产力层；Imovelweb 和其他源自 Navent
              的品牌，既是当前组合资产，也说明拉美市场仍然高度碎片化。现状替代方案同样强大：许多交易仍通过传统
              imobiliárias、非正式房东-租客谈判，或多门户挂牌行为完成，而不是流向单一集成平台。关键在于，QuintoAndar
              最强的竞争主张不只是流量，而是把更多交易堆栈迁入一个托管工作流。投资人因此要区分“谁拥有浏览流量”“谁拥有房源供给”和“谁真正掌握风险承担与合同执行”。这些战场互有重叠，但并不相同。
