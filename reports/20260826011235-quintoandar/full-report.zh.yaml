chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位、核心产品与规模信号
        blocks:
          - type: paragraph
            body: >-
              QuintoAndar 把自己定位为端到端住房平台，而不是单一房源网站。公司称，2012 年在 São Paulo 由 Gabriel Braga 和 André Penha
              创立，如今覆盖租房、买房、卖房这条核心居住链路。核心承诺是减少摩擦：租客可以在线搜索、预约看房、议价、完成信用审核并签署合同，不再需要巴西传统租赁中的 fiador
              担保人。这个运营切口仍然重要，因为免担保人的履约能力，是它区别于传统经纪和门户最清晰的行为差异。官方关于页面用异常具体的运营指标锚定规模：每月新增租赁合同超过 15,000 份、60,000
              个活跃房源、30,000 套独家房源、每月预约租房看房 500,000 次、每月约 3,000 笔房产销售、每月购房看房 150,000 次。虽然这些数字由公司发布，但足以支撑一个真实判断：QuintoAndar
              已经不只是早期市场实验，而是一台跨多类房产工作流的高吞吐交易引擎。同一来源还强调强品牌心智，包括首提知名度以及该品类超过 30% 的 Google 搜索份额，说明除供给侧房源广度外，消费者拉力也存在。
