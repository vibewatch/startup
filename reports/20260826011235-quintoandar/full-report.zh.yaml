  - id: FI001
    title: 收入模型桥
    type: flow
    layout: wide
    summary: QuintoAndar 的财务引擎从住房意图出发，靠多个变现界面转化，而不是单一费用线。
    data:
      nodes:
        - id: demand
          label: |-
            住房需求
            租客、买家、业主、中介机构
        - id: transactions
          label: |-
            平台活动
            租赁、销售、看房、合同
        - id: monetization
          label: |-
            变现界面
            租赁费、销售费、合作伙伴服务
        - id: adjacent
          label: |-
            邻近业务
            担保、融资、中介工具
        - id: cash
          label: |-
            现金生成
            资金再投入和运营
        - id: reporting
          label: |-
            DataHouse 报告
            市场洞察和需求生成
        - id: risk
          label: |-
            风险成本
            罚款、担保、服务运营
      edges:
        - from: demand
          to: transactions
          label: 转化
        - from: transactions
          to: monetization
          label: 抽成率 / 费用
        - from: monetization
          to: adjacent
          label: 交叉销售
        - from: monetization
          to: cash
          label: 毛利
        - from: adjacent
          to: cash
          label: 附加收入
        - from: transactions
          to: reporting
          label: 数据副产品
        - from: risk
          to: cash
