      - number: '8.2'
        title: 公开可比公司给出的信号
        blocks:
          - type: paragraph
            body: >-
              可比公司组合反对简单估值捷径。Redfin、Compass 和 Opendoor 展示了住房业务被公开市场视为交易重、周期性或资本密集时的后果：收入可以很大，倍数仍会很低。Zillow、CoStar 和
              Rightmove 则展示光谱另一端，受众所有权、软件、数据和门户经济性可以支撑高得多的估值水平。QuintoAndar
              介于两者之间。它比纯门户有更多运营复杂度和信任敞口，但看起来也比直白经纪业务更可防守、覆盖更宽。这个混合画像解释了为什么类公开市场 0.2x 至 0.7x
              收入倍数会显得过于惩罚，而如果没有好得多的披露，两位数软件倍数又会过于慷慨。估值上，可比公司说明 QuintoAndar
              应得一个中间区间：奖励其领导地位，同时折价不透明性和风险承担模型要素。正是这个中间位置，让有纪律的投资人可以喜欢公司，却仍拒绝过激的入场价。
