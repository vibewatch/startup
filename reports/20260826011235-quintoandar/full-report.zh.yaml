      - number: '2.4'
        title: 买方分层、采用路径与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              QuintoAndar
              的市场更适合看成一组相互连接的经济参与者，而不是单一客户。租客看重便利、低官僚成本和搜索质量；房东关心空置率、收款确定性和成交速度；买房者和卖房者需要发现、数据和协调执行；合作中介追求线索生成和转化提升；B2B
              触点则越来越需要 AI
              驱动的响应、资格筛选和工作流支持。因此产品横跨多种买方-用户-付费方组合，这有利于生态扩张，却让分板块收入分析更难干净完成。公开证据显示强需求代理指标——月租赁、月销售、生态访问和合作中介转化——但在子板块精确份额、板块盈利能力，以及租赁、销售和软件变现拆分上，仍留下重大尽调缺口。这些缺口很重要，因为如果抽成率受压或某些队列在竞争门户之间多平台使用，巨大的全国住房市场仍可能只转化成小得多的可变现利基。结论是需求背景正面、规模测算要克制：QuintoAndar
              明显处在一个结构性重要市场里，但可投资问题是子市场经济性，而不是巴西房地产 GDP 的标题数字。
