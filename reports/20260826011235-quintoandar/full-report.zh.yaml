            body: >-
              以私营消费公司标准看，公开采用证据异常具体。QuintoAndar 称，每月签下超过 15,000 份租赁合同，挂牌 60,000 套活跃房源，安排 500,000 次租房看房，每月售出约 3,000
              套住房，并安排 150,000 次购房看房。其他披露又补充 BRL 20 billion 一年交易额和约 300,000 份在管合同。公司 ChatGPT 发布提到生态每月 50 million 次访问；围绕
              2026 年 AI 投资的新闻稿称，超过 3 million 人已经从平台受益。虽然这些数据点不是经审计队列，但足以证明真实客户活动。应用商店界面提供补充证据：iOS 和 Android
              列表均显示高评分，Android 列表还通过数百万下载量体现广泛分发。综合来看，这些信号支持这样的判断：QuintoAndar 已经远远越过实验阶段，进入规模化消费者采用。
