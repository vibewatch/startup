      - number: '7.3'
        title: 依赖、财务与模型风险
        blocks:
          - type: paragraph
            body: >-
              QuintoAndar 的依赖风险比经典单一供应商敞口更隐蔽。随着销售生态扩张，合作中介更重要；移动分发仍受 Apple 和 Google 规则约束；住房信贷条件会影响交易速度和消费者负担能力。如果
              QuintoAndar 进一步扩张金融或保证产品，巴西的数据共享和数字市场政策环境还会增加一层影响。财务模型风险被不透明放大。公司有强规模信号和第三方 ARR
              估计，但公开披露远少于投资人评估损失、准备金、欺诈和营运资本动态所需。也就是说，下行风险不在于“人们是否需要住房”，而在于当前模型能否在复杂交易流中扩张轻资本承诺，同时守住利润率和信任。从这个意义看，QuintoAndar
              的剩余风险可管理但不轻：公司看起来具备战略耐久性，但几个关键风险通道只有私下尽调才能看清。在内部仪表盘共享之前，审慎立场应是假设剩余波动高于公开证据单独显示的水平。投资人应把缺失的私有指标本身视作敞口，而不只是建模上的不便。
