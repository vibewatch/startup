      - number: '2.2'
        title: 可触达机会规模
        blocks:
          - type: paragraph
            body: >-
              自上而下研究让机会看起来巨大，但有用的尽调问题是 QuintoAndar 究竟能变现哪一层。第三方研究机构把 2024 年巴西房地产总市场放在 $230 billion 以上，2025 年超过 $263
              billion；IMARC 则估算 2025 年国内 proptech 板块接近 $866 million，并预测未来十年保持两位数 CAGR。Coraly
              对门户市场的框定，比泛泛的建筑或物业支出总可用市场（TAM）更有价值，因为它隔离出数字发现和交易意图。同时，自上而下数字必须谨慎使用：托管式市场平台不可能把底层房屋总价值全部变现，就像经纪商不能把商品交易总额（GMV）当收入。最扎实的信号来自
              FipeZap 等价格和成交量数据集，以及 QuintoAndar
              自己披露的交易活动，而不只是咨询公司市场模型。实际承销时，最佳工作口径的可服务市场（SAM）是城市租赁和二手房交易中可被数字化搜索并可服务的那一块，加上相邻经纪软件，而不是全部房产存量或所有建筑支出。因此，投资人应把宽口径
              TAM 当方向背景，再从交易量、抽成率和采用约束向上搭模型。
