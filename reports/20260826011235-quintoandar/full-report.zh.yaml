  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              最具体的外部风险证据来自监管和法律。G1 报道称，Procon-SP 在 2025 年因侵害消费者权益的做法对 QuintoAndar
              罚款，让客户信任和消费者保护敞口不再只是理论风险。隐私是第二条主要战线。QuintoAndar 公开称其有隐私计划、专业团队和 DPO，但巴西整体环境正在收紧。LGPD 覆盖广，外部律师评论和 ANPD
              动态显示执法更活跃，包括泄露披露、转移规则和 AI 监督。公司工作流触及身份、合同、消息、上门看房和定价情报，隐私监管影响重大。反垄断是第三个法律层次。随着 CADE
              加强对数字市场行为和并购行为的审查，QuintoAndar
              也在通过收购和平台规模扩张。以上都不能证明公司存在现实的生存级法律危机，但足以说明法律和监管复杂度上升速度，快于商业模式看起来的简单程度。因此，后期投资人不仅要确认公司在标题层面合规，还要看到公司能承受反复审视，而不拖慢增长或伤害客户信任。巴西尤其需要这一点，因为消费者、隐私和竞争监管可能按不同时间线推进，最后仍落在同一运营模型上。
