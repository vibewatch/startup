      - number: '1.2'
        title: 管理层梯队与治理成熟度
        blocks:
          - type: paragraph
            body: >-
              公开管理层证据显示，QuintoAndar 正在为更大、更复杂的运营阶段专业化，但治理盲区仍然真实存在。2025 年高管更新中，Marco Mordehachvili 出任 CFO、Rafael Castro
              出任 CPO，Lucas Lima 继续担任 COO，Ana Pellegrini 继续担任 CLO。这些背景有含金量：Farallon 经历指向资本纪律和融资成熟度，Castro 在 Google
              之后又有内部运营任期，带来大规模产品和工程可信度。Pellegrini 明确负责法律、公共政策、隐私、M&A、公司治理和合规；这些职责对触及支付、消费者合同并日益依赖 AI
              决策的市场平台很关键。管理层话语也从创业公司式颠覆，转向规模、精细治理和持久增长。不过，公开材料对董事会构成和所有权集中度披露仍弱。新闻稿突出高管，却几乎没有实质披露独立董事、委员会结构或投资人控制权。最终治理判断是混合的：管理团队明显成熟，但公开记录仍不足以让投资人放心判断董事会独立性或创始人控制安排。
