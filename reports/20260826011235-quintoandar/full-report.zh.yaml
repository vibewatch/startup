      - number: '6.4'
        title: 持久性、满意度与集中风险
        blocks:
          - type: paragraph
            body: >-
              持久性判断偏正面，但尚未定论。公开客户满意度信号令人鼓舞：应用评分高、活动量大，中介客户似乎获得了可衡量销售提升。同时，公开留存数据仍薄。没有经过审阅的披露说明流失、NRR、合同期限，或按租客、业主、中介板块拆分的队列行为。信任风险也真实存在。G1
              对 Procon-SP 罚款的报道显示，规模和客户投诉可以与正面应用商店情绪并存，这意味着外部观察者不能只用评论当完整信任评分。消费者侧用户基础很广，集中度似乎低；但在渠道和 B2B
              分发上，中介参与很重要，集中度更高。合理结论是：QuintoAndar 客户宽度强、公开活动证据有说服力；但在私有队列和服务质量仪表盘开放之前，留存持久性的证据只能给中等置信度。
