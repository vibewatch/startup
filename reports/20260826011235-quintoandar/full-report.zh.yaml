        - 抵押贷款或信贷持续收紧，明显压低销售速度
        - 更重视纯租赁韧性
      - - 损失不透明
        - 私募尽调证据不足
        - 公司无法提供事件、准备金或争议仪表盘
        - 将剩余风险视为高于当前模型
    notes: 退出标准应能在尽调中或投资后 12–18 个月内被观察到。
    claimRefs:
      - CR034
      - CR035
      - CR036
  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 决策含义
    rows:
      - - 建议
        - 标记 / 对价格敏感，继续研究
        - 只有相较过期峰值定价有明显折价，或拿到新的经审计披露，才继续推进。
      - - 信心
        - 中
        - 证据足以圈定估值区间，但在未知当前价格下，还不足以排除投资论证风险。
      - - 风险评级
        - 中高
        - 信任、信贷周期性和披露不透明可能一起压缩估值。
      - - 估值立场
        - 低于上一轮峰值时有条件可支持；接近 $5.1B 则偏高
        - 可能存在类门户溢价，但需要更强证据证明利润率和风险控制。
      - - 入场纪律
        - 倾向以低于峰值的价格入场，并获得披露权
        - 如果当前指标更接近经纪业务经济性，而不是门户经济性，价格应向下重置。
    notes: 这不是对公司质量的静态判断，而是一个对价格和证据都敏感的结论。
    claimRefs:
      - CV031
      - CV040
      - CV041
      - CV042
      - CV043
  - id: TV002
    title: 正向论点 / 反向论点表
    columns:
      - 论点
      - 什么会改变判断
    rows:
      - - 正向论点：QuintoAndar 是巴西住房交易中已具规模的品类领导者，拥有可观的租赁、销售和托管合同量。
        - 如果经审计收入质量和分部利润率证实规模能转化为持久经济性，判断会增强。
      - - 正向论点：公司横跨租赁、销售、合作伙伴和 AI 工作流，广度足以支撑高于简单经纪业务的倍数。
        - 如果管理层证明相邻业务能加深变现，同时不显著增加损失或服务复杂度，判断会增强。
      - - 正向论点：BRL 2 billion AI 计划可能改善转化、定价质量和服务成本，提高拿到类门户经济性的概率。
        - 如果 AI 发布在 12-18 个月内能明确拉动利润率或转化，判断会增强。
      - - 反向论点：公开证据仍不足以说明经审计利润率、现金生成和风险承担敞口，无法支撑接近旧峰值的价格。
        - 如果管理层提供经审计报表、准备金数据和队列经济性，判断会缓和。
      - - 反向论点：监管信任和宏观信贷条件可能比私募市场预期更快，把 QuintoAndar 推入较低倍数的上市公司篮子。
        - 如果投诉强度正常化，且销售端表现能在信贷收紧中保持韧性，判断会缓和。
    notes: 每条论点都绑定证据，并附带一个可能修正建议的条件。
    claimRefs:
      - CV001
      - CV003
      - CV012
      - CV013
      - CV014
      - CV015
      - CV039
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 关键假设
      - 隐含估值
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - ARR 至少真实存在，AI 投入改善转化和利润率，运营盈利能力变得清晰，信任问题不再反复。
        - 6x-7x ARR = 约 $4.5B-$5.25B
        - 监管打击、AI ROI 偏弱，或隐藏损失敞口
        - 信号：经审计利润率改善 + 可见经营杠杆 + 无新增重大信任事件
      - - 基准
        - 规模真实，但披露仍不完整，经济性介于门户和交易服务模式之间。
        - 4x-5x ARR = 约 $3.0B-$3.75B
        - 估值继续受不透明和宏观敏感性压制
        - 信号：规模指标稳定 + 利润率温和改善 + 无重大负面意外
      - - 悲观
        - 增长或变现不及预期，住房信贷敏感性发作，市场把 QuintoAndar 当成周期性或信任承压的经纪业务。
        - 2.5x-3.5x ARR = 约 $1.9B-$2.6B
        - 倍数压缩、利润率压力，或反复制裁
        - 信号：增长放缓 + 信贷走弱 + 投诉或合规压力继续上升
    notes: 情景是区间，不是伪精确的点估计，并且高度依赖 ARR 锚点的可靠性。
    claimRefs:
      - CV011
      - CV026
      - CV027
      - CV028
      - CV029
      - CV030
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 类型
      - 指标
      - 倍数 / 估值
      - 相关性
      - 局限
    rows:
      - - Redfin
        - 上市经纪 + 门户混合体
        - 2024 收入 ~$1.043B；市值 ~$0.707B
        - ~0.7x 收入
        - 可作为类经纪下行情景的区间参考
        - 仍是美国市场特有，也不是直接的担保式租赁模式
      - - Opendoor
        - 交易属性较重的上市房地产科技公司
        - 2024 收入 ~$5.2B；市值 ~$0.987B
        - ~0.2x 收入
        - 可作为资本或宏观敏感住房模式的悲观底部
        - 住房库存模式比 QuintoAndar 资本密集得多
      - - Compass
        - 上市经纪平台
        - 2024 收入 ~$5.629B；市值 ~$1.427B
        - ~0.25x 收入
        - 展示公开市场如何给佣金占比较高的经纪敞口定价
        - 以经纪人为中心的美国经纪经济性差异很大
      - - Zillow
        - 上市房地产流量 / 平台
        - 2024 收入 ~$2.2B；市值 ~$9.4B
        - ~4x 以上收入
        - 流量 + 软件价值的中高端基准
        - 公开披露充足得多，经济性也更像门户
      - - CoStar
        - 上市数据 + 市场平台
        - 2024 收入 ~$2.7B；市值 ~$30.1B
        - ~11x 收入
        - 数据密集型市场平台经济性的高端溢价基准
        - 软件 / 数据驱动程度高得多，信任摩擦也低得多
      - - Rightmove
        - 上市盈利型房产门户
        - 2024 收入 £389.9M；70% 基础利润率；90% 留存率
        - 高溢价门户基准；精确倍数随市场价格变化
        - 有助于理解一流门户质量能拿到怎样的估值
        - 英国门户经济性比 QuintoAndar 的公开图景更干净、盈利性更强
    notes: 可比公司的正确启发不是某个单一数字，而是 QuintoAndar 应处在上市住房科技谱系的中间，而非任何一个极端。
    enumerationScope:
      coverage: exhaustive
      basis: >-
        This register captures every directly reviewed public comparable used to bracket QuintoAndar in this chapter:
        Redfin, Opendoor, Compass, Zillow, CoStar, and Rightmove.
    claimRefs:
      - CV016
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
  - id: TV005
    title: 论点破裂与退出触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 信任或监管事件反复出现
        - 2+ 个季度出现多起新制裁、罚款或投诉激增
        - 让 QuintoAndar 偏离高溢价市场平台叙事
        - 将估值重置到悲观 / 基准低端
      - - AI 项目交付不及预期
        - 重大投入期后，利润率或转化没有可见提升
        - 削弱乐观情景溢价逻辑
        - 移除溢价倍数假设
      - - 销售端宏观压力
        - 信贷收紧明显拖慢交易速度
        - 将业务重新定价为较低的上市住房倍数
        - 下调增长和退出假设
      - - 披露仍然薄弱
        - 管理层无法在尽调中提供经审计和分部层面经济性
        - 阻断可投资的上行情景
        - 维持标记 / 不承诺
      - - 出现类经纪业务经济性证据
        - 利润率和留存无法体现类门户质量
        - 中间篮子论点崩塌
        - 视为低倍数交易业务
    notes: 这些触发因素用来监控，不是用来欣赏。每一项都会改变适用倍数。
    claimRefs:
      - CV029
      - CV030
      - CV037
      - CV038
  - id: TV006
    title: 最终尽调请求表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 经审计财务报表
        - 按业务线拆分收入、毛利率、经营利润率、现金流
        - 需要检验 ARR 能否转化为持久盈利质量
        - 向 CFO / 审计师索取
      - - 风险承担敞口
        - 担保、索赔、准备金、逾期、欺诈和损失数据
        - 判断 QuintoAndar 更像市场平台，还是风险中介
        - 向 CFO / 风险负责人索取
      - - 队列耐久性
        - 流失、续约、重复使用、NRR/GRR、CAC 回收期
        - 判断是否配得上溢价倍数
        - 向增长 / 财务团队索取
      - - AI ROI
        - 路线图里程碑、按计划拆分投入、转化或成本影响
        - 区分创造价值的 AI 和叙事驱动的资本开支
        - 向 CTO / CPO 索取
      - - 当前价格和优先权
        - 最新轮次、二级市场标记、股权结构中的优先权栈
        - 判断入场纪律和真实下行保护
        - 向 CEO / 财务 / 法务索取
    notes: 如果管理层无法满足这些请求，缺少证据本身就是一个估值结论。
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV036
