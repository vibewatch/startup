      - CV026
      - CV027
      - CV028
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 可支撑区间在基准情景下低于 2021 年旧峰值，只有完整乐观情景才能重新达到该峰值。
    data:
      items:
        - label: 乐观情景
          low: 4500
          mid: 4900
          high: 5250
          unit: $M
          detail: AI 和盈利能力证据可支撑接近峰值的重估。
          tone: positive
        - label: 基准情景
          low: 3000
          mid: 3400
          high: 3750
          unit: $M
          detail: 已成规模的领导者，但仍受披露折价约束。
          tone: neutral
        - label: 悲观情景
          low: 1900
          mid: 2250
          high: 2600
          unit: $M
          detail: 宏观、信任或经济性会把估值推向公开住房类公司的折价水平。
          tone: risk
    claimRefs:
      - CV026
      - CV027
      - CV028
      - CV032
      - CV043
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: QuintoAndar 在市场验证上得分很强，但透明度和价格支撑明显较弱。
    data:
      items:
        - label: 市场与规模验证
          value: Strong
          tone: positive
          detail: 官方租赁、销售、看房、GMV 和合同指标显示真实品类领导力。
        - label: 客户与产品验证
          value: Strong
          tone: positive
          detail: App 评分、合作伙伴增长和 AI 路线图支撑可持续的产品叙事。
        - label: 竞争位置
          value: Moderate-strong
          tone: positive
          detail: 广泛住房工作流和本地规模看起来可防守，但门户和经纪公司仍是相关可比对象。
        - label: 财务透明度
          value: Weak
          tone: risk
          detail: ARR 来自二手来源，公开利润率细节仍不足。
        - label: 风险负荷
          value: Medium-high
          tone: risk
          detail: 信任、隐私、信贷和宏观因素都可能压缩估值。
        - label: 低于峰值入场的估值支撑
          value: Moderate
          tone: neutral
          detail: 如果规模被证明可持续，低于前峰值时存在基准情景支撑。
        - label: 接近峰值定价的估值支撑
          value: Weak
          tone: risk
          detail: 2021 年 $5.1B 估值点需要更新证据，才重新具备可投性。
    claimRefs:
      - CV001
      - CV003
      - CV012
      - CV024
      - CV033
      - CV040
      - CV043
