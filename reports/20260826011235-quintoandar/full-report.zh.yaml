              公开流传的标题收入数字，是 GetLatka 估计的 2024 年约 $750 million ARR。它有方向价值，但单独看还达不到投资人级别，因为方法论未经审计，也可能不等同于确认收入。把这个数字与 BRL
              20 billion 交易额和公司披露的运营量交叉验证，可以看出业务规模已经有分量，但围绕真实经常性收入、毛利率和贡献利润率，置信区间仍很宽。员工数据提供另一个粗略视角：以约 4,828 名员工计，如果 $750
              million 数字扎实，单人 ARR 看起来健康；但如果确认收入明显低于该数字，说服力就会下降。因此，财务质量问题不在于 QuintoAndar
              是否变现——它显然在变现——而在于其中多少是经常性收入，多少由交易驱动，以及保证挂钩产品和复杂运营下面压着多少损失或服务成本。公开尽调可以描述收入引擎，但还不能证明它的质量。
