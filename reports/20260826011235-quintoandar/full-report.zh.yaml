      - number: '3.2'
        title: 相比房源导向门户的差异
        blocks:
          - type: paragraph
            body: >-
              最强证据仍支持将 QuintoAndar 看作比 ZAP 或 Viva Real 式门户更深度运营集成的公司。托管租赁流程、免担保人定位、在线签约和高月度租赁量表明，QuintoAndar
              不只是生成线索再转交。市场里供给侧参与者经常为获得可见度而多平台挂牌，这个差异就有战略意义。以房源为核心的既有玩家可以展示广度和流量，但并不自动掌握筛选、文件处理或支付邻近信任。QuintoAndar
              自身规模数字——每月数万次租赁或销售动作、数十万份在管合同——说明它已经靠更深的工作流控制变现，而不只是靠页面浏览。与此同时，FipeZap 方法论提醒我们，OLX
              控制的数据基础设施仍然塑造市场的一个重要公共视角。换句话说，QuintoAndar 的护城河最强在执行；OLX/ZAP 的护城河最强在漏斗顶端数据和库存。
