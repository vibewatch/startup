      - number: '8.3'
        title: 情景区间与建议
        blocks:
          - type: paragraph
            body: >-
              情景测算给出的是一个实际答案。2.5x 至 3.5x ARR 的悲观情景把 QuintoAndar 放在约 $1.9 billion 至 $2.6
              billion，接近公开市场经常惩罚带有周期性或披露负担的住房业务的位置。4x 至 5x ARR 的基准情景对应约 $3.0 billion 至 $3.75
              billion，更符合一家有规模、有品类领导地位但公开经济性不完整的市场平台。6x 至 7x ARR 的乐观情景达到约 $4.5 billion 至 $5.25 billion，实质上只有在 AI
              计划转化为更好利润率、信任守住、盈利能力可见时，才让 QuintoAndar 回到此前峰值附近。在这个框架下，建议是标记 /
              价格敏感型继续研究。公司在合适入场价上大概率可投；公开证据不支持在溢价价格上松懈。一份有纪律的条款清单因此应围绕下行保护、治理访问权和披露质量不达预期时重新审视价格的能力来设计。
