      - number: '1.4'
        title: 里程碑、运营动能与反向基线
        blocks:
          - type: paragraph
            body: >-
              2025-2026 年里程碑讲的是规模扩张加有意的平台再投入。QuintoAndar 称，一年交易量突破 BRL 20 billion，在管合同约 300,000
              份，合作中介在市场平台模型下销售翻倍。管理层还称，公司收入自 2020 年以来增长 15 倍，超过 3 million 人已经从平台受益，其中 1 million 人是在此前 18 个月新增。2026 年 6
              月总部公告把这些增长说法与 R$2 billion 技术计划放在一起，第三方报道则将这笔投入描述为自筹而非新融资——这是鼓舞人的运营韧性信号，但仍未经审计。AI 技术栈也通过 ChatGPT
              集成和内部生产力工具，越来越直接面向客户。沿着这条正向曲线，基准时间线仍必须纳入摩擦点：QuintoCred 在 2025 年重组，把资源重新聚焦核心业务；G1 报道 Procon-SP 在 2025 年 6
              月因侵害消费者权益的做法罚款。这些事件不推翻投资逻辑，但说明 QuintoAndar 已经大到足以让监管和消费者保护审视成为故事中的反复主题。
