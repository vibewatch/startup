companyProfile:
  summary: >-
    QuintoAndar 是一家总部位于 São Paulo 的住房平台，2012 年由 Gabriel Braga 和 André Penha
    创立。公司把数字化租赁市场、住房买卖流程、合作中介工具和相邻住房服务整合起来，覆盖巴西和拉美其他地区。公开证据支撑的是一家具备真实运营规模的公司，而不是小众业务：QuintoAndar 称每月新增租赁合同超过 15,000
    份、每月完成 3,000 笔住房销售；外部报道和公司披露则指向 BRL 20 billion 年交易额、约 300,000 份在管合同，以及 2024 年估计 $750 million ARR。现在尽调的核心问题不再是
    QuintoAndar 是否在所在市场重要，而是公司的经济性、风险承担敞口和披露质量，能否支撑接近其旧有独角兽峰值的定价。
