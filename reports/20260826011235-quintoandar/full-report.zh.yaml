      - number: '2.3'
        title: 结构性需求驱动与约束
        blocks:
          - type: paragraph
            body: >-
              当前宏观和住房背景利好数字租赁平台，即使对交易驱动更重的住房销售没那么友好。FipeZap 报告 2025 年全国租金通胀为 9.44%，平均挂牌租金为每平方米 BRL 50.98；Coraly
              则报告，在负担能力收紧之下，住宅销售价格继续上涨。巴西住房缺口结构性巨大——2024 年为 5.77 million
              套——其中过度租金负担占大多数。这创造了一大批承压家庭，他们需要更快、更高效地找房，而且往往没有足够资产实力去满足传统重担保租赁。与此同时，更高的 Selic
              利率和更紧的按揭条件预计会压缩房地产信贷、抬高首付负担，把部分潜在买家推回租赁市场。相同力量也限制 QuintoAndar
              销售端收入机会，所以顺风并非均匀覆盖所有产品。信任、合规和消费者保护审视仍是采用约束：平台达到规模之后，只有房东、租客和中介相信规则、定价和纠纷解决实践保持公平，速度和便利才有效。
