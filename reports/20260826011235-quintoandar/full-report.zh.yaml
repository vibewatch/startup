  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议从真实规模和战略质量出发，再扣除披露和风险折价；这些折价阻止公司在溢价定价下直接通过。
    data:
      nodes:
        - id: N1
          label: 真实规模和品类领导力
          detail: 高租赁量、销售量、GMV 和合同量具备实证支撑。
          tone: positive
        - id: N2
          label: AI 与平台上行空间
          detail: 大额技术投入可能改善转化和利润率。
          tone: positive
        - id: N3
          label: 披露缺口
          detail: ARR、利润率、准备金和当前定价仍只部分公开。
          tone: risk
        - id: N4
          label: 信任与宏观风险
          detail: 监管投诉和住房信贷敏感性压缩溢价倍数。
          tone: risk
        - id: N5
          label: 中档估值
          detail: 高于经纪业务，低于纯门户溢价。
          tone: neutral
        - id: N6
          label: 标记 / 价格敏感型继续研究
          detail: 合适折扣下可投，盲按独角兽峰值定价则不可投。
          tone: neutral
      edges:
        - from: N1
          to: N5
          label: 支撑相对低端可比公司的溢价
        - from: N2
          to: N5
          label: 支撑上行可选性
        - from: N3
          to: N6
          label: 阻止直接通过
        - from: N4
          to: N6
          label: 需要折价
        - from: N5
          to: N6
          label: 确定入场立场
        - from: N1
          to: N6
          label: 将公司留在名单上
    claimRefs:
      - CV001
      - CV003
      - CV012
      - CV013
      - CV014
      - CV040
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 同一 ARR 锚点下，收入倍数的小幅变化会带来大幅估值波动。
    data:
      items:
        - label: 悲观情景：$750M × 2.5x
          value: 1.9
          note: 悲观低端结果（$B）
        - label: 悲观情景：$750M × 3.5x
          value: 2.6
