      - number: '8.4'
        title: 退出准备度与最终尽调
        blocks:
          - type: paragraph
            body: >-
              QuintoAndar
              越来越像一家有朝一日能吸引公开市场关注的公司，但按披露标准看，还没有准备好上市。正面部分很清楚：规模真实，客户证据扎实，管理层仍在激进投资。限制因素是透明度。投资人仍需要经审计财务报表、板块和队列细节、准备金或索赔敞口，以及更清晰的图景：QuintoAndar
              经济性中有多少像门户、多少像经纪、多少像承担风险的金融科技中介。这些差异对倍数的影响，比叙事质量更大。因此，最终尽调与标题估值同样重要。如果管理层能补齐证据缺口，建议可能很快上调。如果不能，缺乏披露就会成为持续谨慎的理由，而不是临时不便。
