      - number: '1.3'
        title: 融资历史、估值与扩张逻辑
        blocks:
          - type: paragraph
            body: >-
              QuintoAndar 已经跨过许多拉美 proptech 没能跨过的资本形成门槛。第三方融资追踪和公司公告一致显示，公司从早期 Kaszek 支持的轮次，逐步走到 General
              Atlantic、SoftBank、Ribbit、Tencent、Greenoaks 和 Grupoglobo 参与。最有支撑的累计融资数字，是七轮合计约 $750
              million；最后一次明确由市场定价的估值，是 2021 年 8 月 Series E 延展轮中的 $5.1 billion。这段融资史重要，不只是因为它留下一个旧价格锚，也解释了后来的战略动作。Navent
              收购把公司从以巴西为主的托管式市场平台，显著扩成一个区域生态，覆盖 Argentina、Mexico、Peru、Ecuador 和 Panama 的分类信息和软件资产。估值语境比标题数字更细：2021
              年是科技倍数异常宽松的环境，公开来源也没有显示 2022 年 12 月之后出现新的机构轮。不过，公开信息同样没有下轮或救助融资证据。因此公司进入 2026
              年时，带着一个声望很高但已经陈旧的上一轮价格；现在必须用运营证据来判断，而不是用新一轮市场定价来确认。
