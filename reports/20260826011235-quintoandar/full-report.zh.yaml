      - number: '7.2'
        title: 运营、技术与执行风险
        blocks:
          - type: paragraph
            body: >-
              运营上，QuintoAndar 已经大到吞吐量本身会成为风险。围绕 BRL 20 billion 年交易额和约 300,000
              份在管合同的公开披露，意味着服务系统即便没有严重宕机，也可能因文件错误、解决时效差或执行不一致而失灵。AI 路线图会放大这一点。BRL 2 billion
              技术投资可以加深产品质量，但也抬高预期，并在搜索质量、定价输出、线索处理和合规审查中引入失败模式。Domi 和其他 AI
              辅助体验让这些风险变得具体，而不是抽象。收购整合又制造额外压力：Noknox、SíndicoNet 和 Velo
              扩大生态，同时增加产品、数据和组织复杂度。管理层补强和庞大员工数有帮助，但也确认了执行负担的规模。执行错误现在有更大的冲击半径，因为如此多客户和合作伙伴界面都落在同一平台上。这样的耦合意味着，一个领域的故障可能很快在别处显现，例如投诉、退款、转化损失或更高服务费用。因此，尽调核心问题不是风险是否存在，而是内部控制系统是否已经成熟到足以阻止局部故障在网络中级联。
