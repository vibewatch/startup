  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与价格纪律
        blocks:
          - type: paragraph
            body: >-
              投资逻辑不难看见。QuintoAndar 有规模、品牌、品类领导地位，以及横跨租赁、销售、合作伙伴和相邻服务的宽住房工作流。官方披露加第三方报道，指向高月度租赁和销售活动、大量在管合同和 BRL 20
              billion 年交易额。这足以把 QuintoAndar 与投机性 proptech 故事区分开。但估值决策不能停在质量判断。公开分母仍弱：被广泛引用的 $750 million ARR
              数字不是经审计公司披露，上一次著名定价锚是 2021 年 $5.1 billion 估值，公开记录也很少说明当前利润率、现金生成和承担损失敞口。这意味着 QuintoAndar
              可能是一家强公司，但可观察证据仍要求价格纪律。正确结论不是“回避”，而是“没有新证据，就不要支付独角兽峰值价格”。实际操作中，投资讨论应少一点品牌崇拜，多聚焦新一轮、要约交易或尽调包能否支撑今天要求的倍数。
