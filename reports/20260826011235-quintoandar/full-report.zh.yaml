  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: QuintoAndar 的技术栈把消费者搜索、交易工作流、合作伙伴工具和邻近业务叠在共享数据与 AI 能力之上。
    data:
      layers:
        - label: 交互层
          detail: 消费者和合作伙伴从 Web、移动端、消息渠道和外部 AI 界面进入。
          items:
            - Web 市场平台
            - iOS 应用
            - Android 应用
            - WhatsApp / ChatGPT 界面
        - label: 工作流层
          detail: 核心交易步骤把发现转成预约看房、资质审核和签约支持。
          items:
            - 搜索与筛选
            - 看房预约
            - 资质审核
            - 数字合同支持
        - label: 合作伙伴层
          detail: 产品帮助中介分配线索、审核需求，并管理联合销售工作流。
          items:
            - 中介市场平台
            - Domi 助手
            - CRM / 门户集成
        - label: 邻近业务层
          detail: 非核心模块把住房旅程延伸到担保、公寓管理和供应商生态。
          items:
            - Velo 担保工具
            - Noknox 公寓应用
            - SíndicoNet 服务
        - label: 共享智能层
          detail: 数据、AI 和定价服务在消费者和合作伙伴体验中复用。
          items:
            - 对话式搜索
            - 定价 / 估值支持
            - 市场研究内容
