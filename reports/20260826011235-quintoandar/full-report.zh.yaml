        - label: 基准情景：$750M × 5.0x
          value: 3.75
          note: 基准高端结果（$B）
        - label: 乐观情景：$750M × 6.0x
          value: 4.5
          note: 乐观低端结果（$B）
        - label: 乐观情景：$750M × 7.0x
          value: 5.25
          note: 乐观高端结果（$B）
    claimRefs:
