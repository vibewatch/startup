  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              QuintoAndar
              所处市场窄于“巴西房地产”，宽于“房产分类信息”。从窄口径看，公司变现并促成住宅租赁、住宅销售和相邻服务，减少业主、租客、买家、卖家和合作中介的交易摩擦。从宽口径看，特别是在搭建更大的品牌和 B2B
              工具体系之后，公司也参与发现、线索分配、中介软件和融资赋能工作流。这意味着市场边界既包括面向消费者的交易界面，也包括围绕交易的一部分软件和服务层。最重要的现状替代方案仍是碎片化
              imobiliárias、房东与租客直接谈判、以线索生成为主而非托管流程的老牌在线门户，以及人工融资或文件流程。关键在于，QuintoAndar
              不只是追逐房源流量；它试图在数字合同、身份、支付和服务协调消除传统市场遗留摩擦的地方抓价值。公司的多城市覆盖和可见交易规模显示，巴西住房数字化已经越过试验阶段，但距离完成还很远。
