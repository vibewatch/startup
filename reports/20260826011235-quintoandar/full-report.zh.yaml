      - number: '6.3'
        title: 客户偏好、扩张与渠道循环
        blocks:
          - type: paragraph
            body: >-
              QuintoAndar 的研究活动和相邻产品，透露出公司如何获客和扩张。围绕搬家偏好、住房愿望、租售指数和业主经济性的研究，说明公司有意把市场情报转成产品和需求生成资产。这些内容能帮助 QuintoAndar
              比通用门户更具体地与租客和供给侧业主沟通。中介关系增加一条更直接的扩张循环：合作中介可以挂牌库存、带来买家，现在还能使用 Domi 自动处理线索。Noknox 和 SíndicoNet
              等相邻产品把生态延伸到公寓和供应商受众，为一次性交易用户走向更广住房服务参与开路。战略上，这意味着 QuintoAndar
              的客户引擎不只是“找到租客、签下合同”。它越来越像一个由住房用户和专业人士组成的互联网络，后续可以交叉销售数据、工作流或物业管理界面。
