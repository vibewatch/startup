      - number: '3.3'
        title: 生态扩张与分发能力
        blocks:
          - type: paragraph
            body: >-
              Navent 收购和更新的中介产品重要，因为它们拓宽了 QuintoAndar
              的竞争表面。公司不再只守一个巴西租赁切口，而是在多个拉美国家控制或影响一个更大的本地品牌家族，覆盖分类信息、软件和经纪工具。这很关键，因为即便资本是区域性的，住房市场的品牌习惯往往仍然本地化。QuintoAndar
              因此可以用组合策略竞争，而不是逼迫一个消费者品牌赢下每个地理市场和每条工作流。合作中介计划又增加一个分发杠杆：中介可以在 QuintoAndar
              上挂牌房源，并把自己的买家带到平台，形成介于传统经纪与市场需求捕获之间的混合模型。Domi 把这套逻辑进一步延展，让 QuintoAndar 成为中介、门户和 CRM 的 AI
              工作流供应商。战略上，这降低了对单一消费者漏斗的依赖，也给公司更多方式从同一批市场参与者身上提取价值，虽然也把它推向与横向软件和通信厂商的竞争。
