- id: durability-satisfaction-and-concentration-risk
  title: Durability, Satisfaction, and Concentration Risk
  body: 'The durability read is positive, but not yet definitive. Public customer satisfaction signals are encouraging: app ratings are high, activity volumes are large, and agency customers appear to be getting measurable sales lift. At the same time, public retention data remain thin. There is no reviewed disclosure of churn, NRR, contract length, or cohort behavior by renter, owner, or agency segment. Trust risk also remains real. G1’s reporting on the Procon-SP fine shows that scale and customer complaints can coexist with positive app-store sentiment, which means outside observers should not treat reviews alone as a full trust score. Concentration appears low on the consumer side because the user base is broad, but higher on channels and B2B distribution where agency participation matters. The right conclusion is that QuintoAndar has strong customer breadth and convincing public activity, but only medium-confidence evidence on retention durability until private cohort and service-quality
    dashboards are made available.'
  claimRefs:
