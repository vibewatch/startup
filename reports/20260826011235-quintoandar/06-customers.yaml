chapter:
  number: 6
  title: Customers
  summary: 'QuintoAndar’s customer evidence is strongest on breadth and activity: the platform reports large rental, sales, visit, and contract volumes, while app-store ratings and partner-agency growth support real engagement. The weak point is classic private-company retention disclosure—public sources do not reveal churn, contract length, or cohort economics in enough detail to fully underwrite durability.'
sections:
- id: customer-segmentation-and-surface-area
  title: Customer Segmentation and Surface Area
  body: 'QuintoAndar’s customer base is unusually broad for a consumer proptech. The company serves renters and landlords in the core rental workflow, buyers and sellers in the residential sale flow, and partner agencies through marketplace and AI-assistant tools. Adjacent products broaden the surface further toward condo stakeholders, suppliers, and research audiences. This breadth matters because it gives the company several acquisition and monetization loops rather than dependence on one consumer persona. It also creates multiple decision-makers whose motivations can reinforce each other when supply, demand, and intermediaries all stay active on the same platform. It also complicates diligence: a renter is not the same economic actor as a landlord or broker, and those segments likely have different retention and profitability profiles. Public evidence nevertheless shows that QuintoAndar is not stuck in a single narrow use case. Its customer surface spans demand-side users, supply-side
    owners, professional intermediaries, and adjacent property-service communities, which helps explain both its scale and its complexity.'
  claimRefs:
  - CU001
  - CU011
  - CU012
  - CU013
  - CU024
  - CU025
  - CU037
  tableRefs:
  - TU001
  - TU005
  figureRefs:
  - FU001
- id: adoption-trajectory-and-proof-points
  title: Adoption Trajectory and Public Proof Points
  body: 'The public adoption evidence is unusually concrete for a private consumer company. QuintoAndar says it closes more than 15,000 rental contracts per month, lists 60,000 active properties, schedules 500,000 rental visits, sells about 3,000 homes monthly, and schedules 150,000 purchase visits. Separate disclosures add BRL 20 billion in one-year transaction value and around 300,000 contracts under management. The company’s ChatGPT release cited 50 million monthly visits across the ecosystem, and press around the 2026 AI investment says more than 3 million people have already benefited from the platform. While those data points are not audited cohorts, they are strong evidence of real customer activity. App-store surfaces add complementary proof: both iOS and Android listings show high ratings, while the Android listing also signals broad distribution through multi-million downloads. Put together, these signals support a view that QuintoAndar has moved well beyond experimentation into
    scaled consumer adoption.'
  claimRefs:
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
  - CU009
  - CU010
  - CU014
  - CU015
  - CU017
