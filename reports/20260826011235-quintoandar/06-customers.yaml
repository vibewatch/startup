  - TU006
- id: customer-preferences-expansion-and-channel-loops
  title: Customer Preferences, Expansion, and Channel Loops
  body: 'QuintoAndar’s research activity and adjacent products provide clues about how the company acquires and expands customers. Research on moving preferences, housing aspirations, rental and purchase indices, and owner economics suggests a deliberate strategy of turning market intelligence into product and demand-generation assets. That content can help QuintoAndar speak to both renters and supply-side owners with more specificity than a generic portal. Agency relationships add a more direct expansion loop: partner agencies can list inventory, bring buyers, and now use Domi to automate lead handling. Adjacent products such as Noknox and SíndicoNet broaden the ecosystem into condo and supplier audiences, creating a path from one-time transaction users toward broader housing-service engagement. Strategically, this means QuintoAndar’s customer engine is not just “find renter, close contract.” It increasingly looks like a network of interconnected housing users and professionals who can
    be cross-sold data, workflow, or property-management surfaces over time.'
  claimRefs:
  - CU018
  - CU019
  - CU020
  - CU021
  - CU022
