  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: NRR, GRR, churn, renewal, contract length, and cohort retention by product line and customer segment.
    whyItMatters: Public activity and ratings are not enough to judge customer durability or expansion economics.
    diligencePath: Request cohort tables for rentals, buyers, agencies, and adjacent products.
    relatedQuestionRefs:
    - QU011
    - QU019
    - QU024
  - type: private-evidence-only
    severity: material
    topic: customer-economics / TU003
    missingEvidence: Revenue and margin by renter, landlord, buyer, seller, agency, and adjacent customer segment.
    whyItMatters: Breadth of customer types is a strength only if high-value segments are retained and profitable.
    diligencePath: Request segment-level revenue and gross-margin bridge.
    relatedQuestionRefs:
    - QU013
    - QU017
    - QU025
    relatedTableRefs:
    - TU003
  - type: conflicting-data
    severity: minor
    topic: trust
    missingEvidence: Unified customer trust dashboard covering complaints, refunds, resolution time, and app-store review trends.
    whyItMatters: Positive app-store ratings and adverse consumer-regulator events can coexist; investors need the reconciled picture.
    diligencePath: Request CX and compliance dashboard with monthly trend lines.
    relatedQuestionRefs:
    - QU005
    - QU018
