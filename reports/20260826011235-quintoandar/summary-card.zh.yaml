  topStrengths:
    - QuintoAndar 在巴西住房市场确有品类规模，披露的租赁、销售、GMV 和合同指标支撑了这一点，不只是叙事。
    - 公司横跨租赁、房屋销售、合作经纪机构和 AI 辅助住房工作流，变现宽度超过单纯经纪业务。
    - 公司继续用自有资金投入技术和 AI，说明管理层仍认为产品质量和经营杠杆还有加深空间。
  topRisks:
    - 以这个体量来看，经审计财务质量、毛利率和储备敞口仍不透明。
    - 消费者保护和信任问题已经公开浮现，包括 2025 年 Procon-SP 罚款。
    - 销售侧表现受巴西住房信贷条件和宏观敏感性拖累。
    - 如果 AI 路线图不能转化为转化率或利润率提升，就可能变成昂贵叙事开支。
    - 公开可比公司显示，一旦住房业务更像交易密集型经纪商、而不是软件含量高的平台，市场折价会很重。
  unresolvedGaps:
    - 经审计财报，以及按收入线拆分的收入、毛利率和经营利润率细节尚未公开。
    - 队列留存、流失、NRR/GRR、CAC 回本周期和分部贡献利润率仍未披露。
    - 储备、索赔、逾期、欺诈和承担风险产品的敞口尚未公开。
    - 过时的峰值独角兽估值之后，没有确认新的公开定价轮或股权结构优先权细节。
