- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Type
  - Metric
  - Multiple / valuation
  - Relevance
  - Limitation
  rows:
  - - Redfin
    - Public brokerage + portal hybrid
    - 2024 revenue ~$1.043B; market value ~$0.707B
    - ~0.7x revenue
    - Useful for brokerage-like downside bracket
    - Still U.S.-specific and not a direct guarantor-style rental model
  - - Opendoor
    - Public transaction-heavy proptech
    - 2024 revenue ~$5.2B; market value ~$0.987B
    - ~0.2x revenue
    - Useful bear-case floor for capital or macro-sensitive housing models
    - Home-inventory model is far more capital-intensive than QuintoAndar
  - - Compass
    - Public brokerage platform
    - 2024 revenue ~$5.629B; market value ~$1.427B
    - ~0.25x revenue
    - Shows how public markets price commission-heavy brokerage exposure
    - Agent-centric U.S. brokerage economics differ materially
  - - Zillow
    - Public real-estate audience / platform
    - 2024 revenue ~$2.2B; market value ~$9.4B
    - ~4x-plus revenue
    - Upper-middle benchmark for audience + software value
    - Much richer public disclosure and more portal-like economics
  - - CoStar
    - Public data + marketplace platform
    - 2024 revenue ~$2.7B; market value ~$30.1B
    - ~11x revenue
    - High-end premium benchmark for data-rich marketplace economics
    - Far more software/data-driven and much lower trust friction
  - - Rightmove
    - Public profitable property portal
    - 2024 revenue £389.9M; 70% underlying margin; 90% retention
    - Premium portal benchmark; exact multiple varies with market price
    - Helpful for understanding what best-in-class portal quality can earn
    - UK portal economics are cleaner and more profitable than QuintoAndar’s public picture
  notes: The right lesson from comps is not a single number; it is that QuintoAndar belongs in the middle of the public housing-tech spectrum, not at either extreme.
  enumerationScope:
    coverage: exhaustive
    basis: 'This register captures every directly reviewed public comparable used to bracket QuintoAndar in this chapter: Redfin, Opendoor, Compass, Zillow, CoStar, and Rightmove.'
