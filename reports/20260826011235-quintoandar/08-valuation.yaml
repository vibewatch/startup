- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Key assumptions
  - Implied valuation
  - Key risks
  - Probability signal
  rows:
  - - BULL
    - ARR is at least real, AI spend improves conversion and margin, operating profitability becomes clearly visible, and trust issues do not recur.
    - 6x-7x ARR = about $4.5B-$5.25B
    - Regulatory hits, weak ROI on AI, or hidden loss exposure
    - 'Signals: audited margin improvement + visible operating leverage + no new material trust events'
  - - BASE
    - Scale is real, but disclosures stay incomplete and economics look mixed between portal and transaction-service models.
    - 4x-5x ARR = about $3.0B-$3.75B
    - Valuation remains capped by opacity and macro sensitivity
    - 'Signals: stable scale metrics + moderate margin progress + no major negative surprises'
  - - BEAR
    - Growth or monetization disappoints, housing-credit sensitivity bites, and the market treats QuintoAndar like a cyclical or trust-stressed brokerage.
    - 2.5x-3.5x ARR = about $1.9B-$2.6B
    - Multiple compression, margin pressure, or recurring sanctions
    - 'Signals: slower growth + credit weakness + further complaint or compliance stress'
  notes: Scenarios are ranges, not false-precision point estimates, and they depend heavily on the reliability of the ARR anchor.
