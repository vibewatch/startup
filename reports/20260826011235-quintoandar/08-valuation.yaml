- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Decision implication
  rows:
  - - Recommendation
    - flag / price-sensitive research-more
    - Proceed only with a meaningful discount to stale peak pricing or with fresh audited disclosure.
  - - Confidence
    - Medium
    - Enough evidence exists to bracket valuation, but not enough to clear underwriting risk at an unknown current price.
  - - Risk rating
    - Medium-high
    - Trust, credit cyclicality, and disclosure opacity can compress valuation together.
  - - Valuation stance
    - Conditionally supportable below prior peak; stretched near $5.1B
    - A portal-like premium is possible, but only with stronger proof on margins and risk control.
  - - Entry discipline
    - Prefer sub-peak entry with disclosure rights
    - Price should reset lower if current metrics are closer to brokerage economics than portal economics.
  notes: This is not a static view on company quality; it is a price-sensitive and evidence-sensitive call.
