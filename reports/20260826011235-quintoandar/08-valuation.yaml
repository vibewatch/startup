- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - 'THESIS: QuintoAndar is the scaled category leader in Brazilian housing transactions, with meaningful rental, sales, and managed-contract volume.'
    - View strengthens if audited revenue quality and segment margins confirm that scale converts into durable economics.
  - - 'THESIS: The company has enough breadth across rentals, sales, partners, and AI workflows to deserve more than a simple brokerage multiple.'
    - View strengthens if management shows that adjacencies deepen monetization without materially increasing loss or service complexity.
  - - 'THESIS: A BRL 2 billion AI plan could improve conversion, pricing quality, and cost-to-serve, raising the probability of portal-like economics.'
    - View strengthens if AI releases demonstrably lift margin or conversion within 12-18 months.
  - - 'ANTI-THESIS: Public evidence is still too thin on audited margins, cash generation, and risk-bearing exposure to justify paying near the old peak.'
    - View softens if management provides audited statements, reserve data, and cohort economics.
  - - 'ANTI-THESIS: Regulatory trust and macro credit conditions can push QuintoAndar into a lower-multiple public bucket faster than private markets expect.'
    - View softens if complaint intensity normalizes and sales-side performance proves resilient through tighter credit conditions.
  notes: Each argument is tied to evidence and includes a condition that could revise the recommendation.
