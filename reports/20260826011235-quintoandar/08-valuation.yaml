- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Repeat trust or regulatory events
    - Multiple new sanctions, fines, or complaint spikes over 2+ quarters
    - Pushes QuintoAndar away from premium marketplace framing
    - Reset valuation toward bear/base low end
  - - AI program underdelivers
    - No visible margin or conversion gain after major spend period
    - Undercuts bull-case premium logic
    - Remove premium multiple assumptions
  - - Sales-side macro stress
    - Credit-tightening materially slows transaction velocity
    - Re-rates business toward lower public-housing multiples
    - Lower growth and exit assumptions
  - - Disclosure remains thin
    - Management cannot provide audited and segment-level economics in diligence
    - Prevents underwritten upside case
    - Stay at flag / no-commit
  - - Evidence of brokerage-like economics
    - Margins and retention fail to show portal-like quality
    - Collapses middle-bucket thesis
    - Treat as lower-multiple transaction business
  notes: These triggers are meant to be monitored, not admired. Each one changes the appropriate multiple.
  claimRefs:
  - CV029
  - CV030
  - CV037
  - CV038
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Audited financial statements
    - Revenue by line, gross margin, operating margin, cash flow
    - Needed to test whether ARR translates into durable earnings quality
    - Request from CFO / auditor
  - - Risk-bearing exposure
    - Guarantee, claims, reserve, delinquency, fraud, and loss data
    - Determines whether QuintoAndar behaves more like a marketplace or risk intermediary
    - Request from CFO / risk lead
  - - Cohort durability
    - Churn, renewal, repeat usage, NRR/GRR, CAC payback
    - Determines whether premium multiple is deserved
    - Request from growth / finance
  - - AI ROI
    - Roadmap milestones, spend by initiative, conversion or cost impact
    - Separates value-creating AI from narrative-heavy capex
    - Request from CTO / CPO
  - - Current price and preferences
    - Latest round, secondary mark, cap-table preference stack
    - Determines entry discipline and true downside protection
    - Request from CEO / finance / counsel
  notes: If management cannot satisfy these asks, the lack of evidence is itself a valuation conclusion.
