    "number": 3,
    "title": "Competitors",
    "summary": "ModRetro competes in a real but tightly bounded premium-retro hardware niche. Chromatic currently sits between Analogue’s broader premium preservation stack and much cheaper Nintendo, Evercade, emulation, and original-hardware substitutes, while M64’s July 2026 launch creates upside but also forces a direct fight with Analogue 3D and modded-original N64 paths before ModRetro has public win-loss proof."
