      "id": "competitive-landscape-and-buyer-choice-set",
      "title": "Competitive landscape and buyer choice set",
      "body": "ModRetro is not competing in one neat product lane. The closest direct handheld rival is Analogue Pocket, which already serves the premium collector who wants FPGA-based authenticity and a large cartridge-compatible library. On the console side, M64 is preparing to enter an even sharper fight because Analogue 3D already owns the “modern N64 on a 4K TV” pitch. Below those premium peers sits Blaze’s Evercade family, which offers licensed physical cartridges and lower hardware prices, but with a more curated and less hardware-purist proposition. Outside the direct-FPGA set, Nintendo Switch Online absorbs casual retro demand with a subscription and expanding classic libraries, while Anbernic and Miyoo-style handhelds compete for play time through cheap SD-card-centric breadth. Finally, original hardware, flash carts, and FPGA mod kits remain real status-quo substitutes. The practical implication is that ModRetro is competing for a nostalgia budget that can route toward authenticity, convenience, breadth, or collector ritual, not just toward one rival SKU.",
