            body: >-
              若把 ModRetro 看作利基高端发烧友生意，而不是大众掌机发布，它的公开客户故事最强。证据集中在复古硬件收藏者、怀旧驱动买家，以及愿意忍受 $199.99
              起售价的爱好者身上，因为他们在意原真度、材料和原始卡带兼容性。评测反复强调产品有高端感、围绕明确用途打造；ModRetro
              自己的创作者触达和改装配件也显示，公司不只想服务被动收藏者，也在培养创作者和动手派。即便没有披露销量，需求也以重要方式可见：Android Police 记录了 ModRetro 自有颜色全线售罄；Forbes
              后来记录了数月售罄后的补货；eBay / TrackaLacker
              页面则显示稀缺意识仍在。问题在于，这些信号全都是定性的。它们证明有人想要这台设备并持续关注，但不揭示出货多少、哪个细分转化最好，或需求能否超出怀旧优先人群。
