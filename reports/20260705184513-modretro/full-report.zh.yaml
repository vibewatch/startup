      - number: '8.3'
        title: 情景视角、反推收入数学与建议
        blocks:
          - type: paragraph
            body: >-
              反推 $1 billion 讨论，是压力测试 ModRetro 定价最干净的方法。如果投资者最终按 Funko 的方式给公司估值，支撑 $1 billion 企业价值所需收入会超过 $3.0 billion。按
              Corsair 类硬件倍数，要求仍约 $1.5 billion。即便套用 Hasbro 和 Logitech 类公开倍数，也分别需要约 $415 million 和 $353 million 收入。只有假设约
              4.0x 的高端私募可选性倍数，隐含收入要求才会降到约 $250 million。这组数学不能证明 ModRetro 被高估；它证明当前估值只有在公司最终好于普通硬件、并更像一个规模化实体 IP 平台时才成立。


              因此，公开建议应保持克制。牛市情形真实存在：Luckey 有稀缺创始人属性，Chromatic 已经证明产品质量，M64
              扩大了产品触点，官方页面也显示公司认真围绕手柄、卡带和新游戏搭生态。但基准情形仍要折价看待当前头条估值，因为没有任何公开来源披露能支撑该估值的收入或利润率桥。熊市情形也不难想象：M64
              发布，但需求仍停留在发烧友小众圈，附加销售一般，业务被重新定价到公开硬件或收藏品周边倍数。基于现有证据，正确姿态是跟踪等待，把估值标为偏高，而不是立即投资。
