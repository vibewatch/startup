  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 融资支持是真实的，产品已有验证，但信息不透明；推荐结论因此落在等待并跟踪。
    data:
      nodes:
        - id: funding
          label: 融资现实
          detail: $150M 募资额度中已售出 $145.2M；Forge 显示总融资 $164.3M
        - id: proof
          label: 产品验证
          detail: Chromatic 评测表现不错；M64 扩大硬件、控制器和游戏覆盖面
        - id: optionality
          label: 创始人可选性
          detail: Luckey 稀缺度叠加生态野心，让市场愿意为溢价故事保持好奇
        - id: opacity
          label: 经营数据不透明
          detail: 收入、毛利率、现金、烧钱速度均未公开，也没有终端售出率桥接
        - id: verdict
          label: 跟踪 / 等待
          detail: KPI 证据出现前，约 $1B 估值偏紧
      edges:
        - from: funding
          to: proof
