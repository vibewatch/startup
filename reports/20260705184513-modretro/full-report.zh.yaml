  - id: TP001
    title: 竞品画像表
    columns:
      - 替代方案
      - 类别
      - 规模 / 状态
      - 目标细分
      - 差异化
      - 相比 ModRetro 的主要短板
    rows:
      - - ModRetro Chromatic / M64
        - 高端 FPGA 复古保存硬件
        - $199.99 的 Chromatic 掌机已上线；据称 M64 将于 7 月 28 日发货，早期支持者价 $199
        - 收藏者、怀旧买家、实体媒介爱好者
        - 原始分辨率 Game Boy 理念、高端材料、盒装软件野心、GameStop 曝光
        - 生态宽度窄于 Nintendo 或 Analogue，且没有公开赢单 / 输单证据
      - - Analogue Pocket / 3D
        - 高端保存平台
        - Pocket 已上线；3D 在延迟后发货，预购价 $250
        - 愿为广泛卡带兼容付费的收藏者
        - 最广的高端真实性技术栈、多系统适配器、openFPGA 开发者生态
        - Pocket 现价更高，大众零售曝光弱于 GameStop 助推的发布
      - - Evercade EXP-R / VS-R
        - 授权实体卡带性价比生态
        - 评测中的刷新款价格 $129.99；60+ 张卡带覆盖 600+ 款游戏
        - 家庭、对卡带好奇的买家、预算较低的收藏者
        - 硬件门票更低，配授权实体卡带和电视 / 掌机选项
        - 硬件没那么高端，还原度主张较弱，卡带价值不均
      - - Nintendo Switch Online
        - 订阅式复古内容存量平台
        - 绑定现有 Switch 装机量的大众市场存量平台
        - 现有 Switch 家庭和低门槛尝鲜用户
        - 家庭套餐边际成本接近零，经典游戏库仍在扩张
        - 提供访问权，不提供原版卡带真实性或收藏者拥有感
      - - Anbernic / Miyoo 类
        - 低成本模拟掌机
        - 社区驱动的大型掌机品类，硬件频繁迭代
        - 折腾玩家、旅行用户、价值型买家
        - 硬件便宜、自定义固件、基于 ROM 的广覆盖
        - 授权媒介、实体卡带仪式感和高端做工较弱
      - - 原版 N64 + EverDrive
        - 二手原版硬件 + 烧录卡替代方案
        - 翻新 N64 和兼容烧录卡仍有销售
        - 想要灵活性的老卡带持有者
        - 保留原机外壳和手柄手感，同时提升便利性
        - 比全新一体化主机更费设置，也有老化硬件风险
      - - Game Boy Color + FPGBC / 改装栈
        - DIY 改装替代方案
        - FPGA 和显示升级套件市场活跃
        - 动手型改装玩家和现有 Game Boy 持有者
        - 能保留卡带仪式感，同时定制硬件栈
        - 需要单独零件和组装投入，也更要能接受折腾
