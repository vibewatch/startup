      - number: '3.4'
        title: 楔子与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              ModRetro 最好的竞争楔子不是绝对独特，而是中间定位。Chromatic 试图比廉价模拟设备更忠实、更有高端实体质感，同时低于当前 Analogue Pocket 头条价。掌机还有一个比 Pocket
              更简单的叙事：原始分辨率显示哲学、金属外壳、随附 Tetris，以及借 GameStop 讲得更清楚的消费者零售故事。M64 试图把同一套打法延伸到客厅：原始卡带、新手柄、开源 FPGA 核心野心，以及低于
              Analogue 3D 首轮预购价的公开入门价。但护城河耐久性只是中等。Analogue 已经拥有 openFPGA 和更广的保存社区装机基础。Evercade 占据低价授权卡带赛道。Nintendo
              和模拟厂商占据便利性和广度。即便改装生态，也能用 FPGBC 或 EverDrive 式技术栈复刻 ModRetro
              的部分吸引力。因此，楔子是真实的，但它更多依赖执行质量、持续盒装软件支持和渠道证据，而不是任何对手碰不到的硬锁定机制。
