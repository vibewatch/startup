      - number: '1.4'
        title: 里程碑、分销与负面信号
        blocks:
          - type: paragraph
            body: >-
              ModRetro 已从怀旧概念快速变成运营中的品牌。XDA 记录了 2024 年 6 月 Chromatic 的发布和假日上市窗口，Observer 将第一款产品发布放在 2024 年；The Verge
              则记录了 2025 年 7 月永久补货，颜色、配件和卡带选择扩大，同时 $199.99 入门价保持不变。随后 M64 更新显示，第二款设备已经推进到足够接近入仓，并有明确的 2026 年 7
              月发货目标。分销也不像精品收藏品的一次性投放那么窄，因为资料反复提到 ModRetro 自有店铺和 GameStop。最清楚的负面信号不是硬件，而是声誉。评论大体称赞 Chromatic 的做工和原真感，但
              The Verge 和 Kotaku 认为，公司与 Anduril 以及 Luckey 政治立场的距离太近，已经成为真实买家顾虑，而不是脚注。就公司概览而言，ModRetro
              的真实产品执行已经足以让它值得关注；但创始人品牌包袱也足以影响消费者采纳和边际投资者群体。
