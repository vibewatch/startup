      - number: '3.5'
        title: 竞争如何改变可投资性叙事
        blocks:
          - type: paragraph
            body: >-
              竞争把 ModRetro 故事切成两个方向。正面看，公司不是凭空发明需求。Analogue 的成功、Evercade 持续的卡带业务、二手原始硬件转售，以及 Nintendo
              对经典游戏库的持续扩展，都证明复古游戏仍能抓住真实消费者注意力和支付意愿。这让 ModRetro
              的利基比纯虚荣硬件故事更可信。负面看，同一组证据也说明，供给已经从各个角度覆盖这个利基：高端保存、更便宜的授权卡带、超低价订阅访问、社区固件模拟，以及自己动手升级原始硬件。M64 还缩短了 ModRetro
              可用叙事宽限期，因为它必须在发布评测和终端销量公开之前，直接面对 Analogue 3D 和原始 N64 替代技术栈。再加上创始人品牌争议——这已经导致一家复古媒体完全停止报道公司——竞争使 ModRetro
              只有在管理层能私下证明终端销售、卡带重复附加和竞争胜率时才可投资；这些证明目前公开证据尚未给出。
