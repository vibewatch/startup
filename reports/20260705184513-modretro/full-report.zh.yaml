      - number: '7.3'
        title: 外部规则栈会同时挤压利润、维修姿态和兼容自由度
        blocks:
          - type: paragraph
            body: >-
              最重要的反向风险簇来自外部，而不是公司内部。ModRetro 在 2025–2026 年环境中销售小批量高端硬件，而中国关联关税敞口、de minimis 暂停、维修权审查和仍然有效的 DMCA
              反规避规则会同时起作用。CBP 和 USTR 明确表示，进口商需要正确的 HTS 归类，才能判断 Section 301 关税是否适用、税率是多少。White House 和 Federal Register
              命令显示，低价值货件失去广泛的 de minimis 庇护，这会同时抬高配件和备件的关税承担与海关流程摩擦。与此同时，FTC 指引称，保修覆盖通常不能仅以授权零件或授权服务为条件，而 ModRetro
              自己的政策却要求机主不要打开外壳。最后，DMCA 规则栈仍然真实存在：Cornell、Copyright Office 和 2024 年豁免规则都把 Section 1201
              框定为窄豁免制度，而不是全面商业安全港；Nintendo 的 Yuzu 案也说明，靠近兼容性的生态会多快招来高成本执法。这些都不能证明 ModRetro
              今天已经违规；它证明的是，一旦法律和监管滑坡，成本会高、变化会快，事后也很难收住。
