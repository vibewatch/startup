  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: ModRetro 的产品栈把工业设计和原始介质工作流叠在 MiSTer 衍生逻辑、公司控制的固件路径，以及日益定制化的主机硬件之上。
