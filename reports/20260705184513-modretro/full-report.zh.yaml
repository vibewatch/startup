        - 因设备、适配器或改装栈差异很大
      - - 开放开发者或改装路径
        - M64 核心承诺发布时开源，但平台尚未验证
        - openFPGA 已支持第三方硬件核心
        - 封闭精选游戏库模式
        - 封闭第一方订阅模式
