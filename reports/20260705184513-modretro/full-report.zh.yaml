  - id: TV005
    title: 投资逻辑失效与否决触发因素表
    columns:
      - 触发因素
      - 阈值 / 预警信号
      - 为什么重要
      - 行动含义
    rows:
      - - M64 发货延期
        - 明显晚于 July 28, 2026 目标，或多次只给评测者状态更新
        - 会削弱支撑溢价的第二平台扩张故事。
        - 把当前估值视为早期标记，降低为可选性付价的意愿。
      - - 价格 / 价值受压
        - 常规价格落在 $229.99 附近，但评测仍认为设备相较替代品偏窄
        - 说明高端 ASP 可能无法转化为足够广的需求。
        - 把公司重新按小众硬件而非平台来建模。
      - - 附着经济性弱
        - 手柄、卡带和首发游戏未在首次硬件销售之外拉出复购支出
        - 没有附着，ModRetro 仍只是硬件小工具公司。
        - 没有经常性钱包份额证据，就不要支付平台式倍数。
      - - KPI 包继续不透明
        - 下一轮融资后，管理层仍不披露收入、毛利率、现金、烧钱速度或终端销售
        - 没有这些指标，名义估值含金量没法判断。
        - 维持观望，不把该估值当作已承保结果。
      - - 创始人相关反弹扩大
        - 核心发烧友圈外，品牌讨论仍由 Luckey 政治立场或国防关系主导
        - TAM 会收窄，付费获客摩擦上升。
        - 假设高端定价必须在更窄的可服务市场里成立。
      - - 轮次保护不及预期
        - 未来条款清单披露重度下行保护、老股交易或其他偏投资人的结构
        - 可能让名义估值的经济含义低于表面。
        - 按有效经济利益重估，而不是只看投后名义估值。
    notes: 这些触发因素旨在快速改变估值立场；它们不是完整风险登记表，完整风险在上一章。
    claimRefs:
      - CV017
      - CV019
      - CV021
      - CV022
      - CV023
      - CV024
      - CV044
      - CV045
      - CV050
      - CV054
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 问题
      - 缺失证据
      - 为什么重要
      - 尽调路径
    rows:
      - - 按产品族拆分收入
        - Chromatic 硬件、配件、卡带，以及 M64 预购或出货的确认收入拆分
        - 需要它才能把公司放进真实可比区间。
        - 在 NDA 下索取月度收入桥和渠道组合。
      - - 毛利率与支持负担
        - 按硬件、配件和软件拆分毛利率，加上保修和退货准备
        - 高端硬件只有单位经济性真实，才配得上高端倍数。
        - 索取 SKU 级毛利率瀑布和准备金历史。
      - - 终端销售与附着
        - Chromatic 装机量、卡带附着、配件附着和 M64 预购转化
        - 需要判断 ModRetro 是在变成平台，还是停留在一次性卖盒子的生意。
        - 索取首购和复购队列表。
      - - 现金、烧钱速度和库存承诺
        - 账上现金、月度烧钱速度、采购承诺、模具和库存融资
        - 硬件公司一旦营运资本吃紧，股权上行会很快被抹掉。
        - 索取董事会或贷款方材料，覆盖现金跑道和采购订单。
      - - 2026 融资条款
        - 完整条款清单、清算顺位、pro-rata 条款、老股交易比例和主要投资人权利
        - 只有名义估值还不够，必须有经济语境。
        - 审阅融资文件和股权结构表。
      - - 发布质量数据
        - M64 配货、退货政策、缺陷率、客服工单和评测者到客户的转化
        - 需要这些来判断第二平台是在验证还是削弱溢价投资逻辑。
        - 索取发货后前 90 天的发布仪表盘。
    notes: 在这些问题得到回答前，估值工作应保持情景化和中等信心，而不是进入高确信承保。
    claimRefs:
      - CV011
      - CV017
      - CV019
      - CV021
      - CV044
      - CV045
      - CV054
