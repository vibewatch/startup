      - number: '6.4'
        title: 客户耐久性仍未验证，品牌 / 渠道集中仍是关键风险
        blocks:
          - type: paragraph
            body: >-
              客户章节的难点不是证明 Chromatic
              有买家；而是证明这些买家足够耐久，能支撑重复购买假设。公开证据明确显示有需求、有真实机主、有创作者参与，也有可附加销售触点，但还没给出投资人真正想看的指标：没有经审计的客户数，没有活跃设备基数，没有公开的 NRR
              / GRR / 流失率等价指标，也没有渠道组合披露，无法量化 GameStop 与 ModRetro
              直营的占比。也就是说，重复购买逻辑仍主要靠假设驱动：只要游戏持续推出、配件持续有用，收藏者就可能再次消费。反向证据也要算进去。一些潜在买家公开表示会因 Palmer Luckey / Anduril
              的政治因素拒绝购买，另一些人认为这台设备的性价比低于 Analogue
              Pocket。再叠加严格的退货和保修条款，公司在发烧友群体里有韧性，但更广泛受众可能有天花板。因此本章的判断很明确：客户热情真实存在，但客户耐久度还没有被公开量化。
