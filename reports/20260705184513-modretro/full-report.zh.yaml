  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 当前产品面与用户任务
        blocks:
          - type: paragraph
            body: >-
              ModRetro 已经像产品公司一样运转，而不是复古概念品牌，但产品图谱有意保持狭窄。Chromatic 现在是高端 Game Boy/Game Boy Color 掌机；M64
              仍是发布前主机生态，把主机、手柄、实体游戏和固件承诺打包进一条路线图。这种狭窄是战略选择。Chromatic
              并不想做通用模拟盒，也不是多核心动手设备；它围绕真实卡带游玩、定制分辨率屏幕、原版风格联机流程和高端材料销售。M64 页面把同一思路搬到客厅：无需设置、快速启动、原始卡带、4
              人沙发同玩，以及单独销售的实体首发游戏。好处是清晰。买家立刻知道每台设备是干什么的。代价是范围。评测者明确指出，Chromatic 不在广度上与 Analogue Pocket 或软件掌机竞争；公开 M64
              定价也还没有体验叙事那么干净，因为官方落地页强调发货日期和能力，而第三方报道填入的价格细节并不一致。对尽调来说，产品面是自洽的，但公司仍在选择原真度和工业设计，而不是灵活性、广度和完全稳定的上市信息。
