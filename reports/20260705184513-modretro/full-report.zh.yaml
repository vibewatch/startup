chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 定位、产品与可见商业面
        blocks:
          - type: paragraph
            body: >-
              在年轻消费硬件创业公司里，ModRetro 的公开呈现难得具体：它卖的是真设备、卡带和配件，不只是一个预热页面。当前店铺围绕 Chromatic 展开，这是一款高端 Game Boy 兼容掌机，起价
              $199.99，并随附 ModRetro 自制 Tetris
              卡带；相邻店铺库存还显示，公司也靠配件、替换零件和不断扩大的卡带软件目录变现。官方材料比一般怀旧硬件营销话术更进一步，明确描绘一个有意构建的实体媒介生态，包括复刻版、新 IP 和未来 M64
              游戏发行。重要之处在于，公司隐含目标不是只卖一次性掌机，而是成为一个有品牌的复古游戏平台。第二条硬件线 M64 已呈现为完整主机生态，包含手柄、游戏和 2026 年 7
              月发货计划；即便公开财务披露还没跟上，多产品野心已经很清楚。
