      - number: '4.4'
        title: 披露质量与承销阻断点
        blocks:
          - type: paragraph
            body: >-
              核心阻断点是财务披露质量，不是缺少需求信号。公开材料证明产品存在，证明当前标价，证明融资真实，也证明 ModRetro 已经发货超过一个微小首批。但它们仍没有披露确认收入、终端销量、DTC
              与零售组合、按产品家族的毛利率、配件或卡带附加率、员工数、现金、烧钱速度、债务、保修准备或退货。即便官方 Form D 也写着 "No
              Revenues"，在公司商业化生命周期走到这个阶段时，这是一个醒目的数据点。净结果是，外部投资者能看到价格点和融资动能，却无法测试收入质量或运营杠杆。


              因此，承销姿态很清楚。正面案例是，ModRetro 已经展示高端定价、多 SKU
              野心，并能获得足够资本去尝试第二个平台。谨慎案例是，所有硬件硬风险仍在台下：关税、内存价格、库存减记、支持负担和渠道经济，都可能在公开投资者看到收入线之前左右结果。除非管理层提供 KPI
              包和营运资本桥，否则最佳公开结论不是「财务已验证」，而是「有前景的高端硬件平台，但存在实质尽调阻断点」。
