      - number: '5.2'
        title: 架构与技术差异化
        blocks:
          - type: paragraph
            body: >-
              ModRetro 技术故事中最耐久的一点，是产品不只是怀旧外壳。Chromatic 的差异化是一整套栈：FPGA 复刻、专用 160x144 显示屏、保留的联机和 IR
              接口，以及比大宗模拟掌机更接近精品消费电子的材料。公开 GitHub 发布很重要，因为它证明这台设备不是靠虚构营销语言搭出的黑箱；该 repo 明确回指 Game Boy MiSTer
              项目，并公开真实工具链、烧录路径和板卡目标。与此同时，这次发布也暴露摩擦。本地构建仍依赖非常具体的 Gowin IDE 版本和每年续期的许可证；它比封闭主机更开放，但没有「开源」这个词单独暗示的那么解放。M64
              方面，官方深度解析对一台发布前主机来说异常坦率。Robert Peip 解释了为什么选择 PSRAM 而不是 DDR、为什么 FPGA 对 N64
              时序行为仍重要，以及哪些开放准确性问题还没解决。这种坦率是真优势，因为它把技术差异化变成具体工程取舍：ModRetro
              接受定制硬件复杂性和更长调通周期，以优化确定性、手柄延迟和忠实卡带的行为。反面是，同样的开放也让剩余缺口可见，尤其是浮点时序和 RSP 行为。
