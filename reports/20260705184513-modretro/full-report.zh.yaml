  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前估值事实，以及它们真正证明了什么
        blocks:
          - type: paragraph
            body: >-
              ModRetro 当前估值叙事有真实融资证据支撑，但公开材料离真正的承销包还差很远。最强文件是 2026 年 SEC Form D：它显示一笔 $150.0 million 发行，已售出 $145.2
              million，剩余 $4.8 million，交易中有 41 名投资者，收入区间标为 “No Revenues”。Forge 又加了一层结构：总融资 $164.3 million、2026 年 3 月
              $111.63 million 的 Series A-1、$33.53 million 的 Series A-2，以及看起来比带困境色彩的成长资本更干净的优先股字段。TechCrunch、Observer 和
              Notebookcheck 随后把市场叙事锚定在约 $1 billion 的估值讨论上。


              这些事实重要，因为它们证明成熟资本已经进入一家小众消费硬件公司。它们不能证明公司配得上头条估值。同一份公开记录仍不披露确认收入、毛利率、现金、烧钱、库存承诺、渠道组合、预购转化，以及 Forge
              页面之外的清算栈细节。因此，正确读法是：ModRetro 的私募市场支持真实存在，但当前价格讨论更多由创始人可信度、稀缺性和平台可选性托着，而不是由已披露经营指标托着。
