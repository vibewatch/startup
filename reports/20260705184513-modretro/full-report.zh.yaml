      - number: '8.2'
        title: 可比框架：硬件底线、收藏品压缩与平台天花板
        blocks:
          - type: paragraph
            body: >-
              可比公司集合必须从 ModRetro 今天肉眼可见的样子出发：一家高端实体产品公司，销售 FPGA 硬件、配件、卡带，现在还推出第二款主机和手柄生态。官方 M64
              材料显示，公司真在尝试拓宽变现栈：四款首发游戏、实体盒装软件，以及直接出资的新游戏。评测也显示，产品质量足以赢得热情。但同一批评测也明确指出，ModRetro 为一个刻意收窄的体验收取发烧友价格。Digital
              Trends 称 Chromatic 昂贵，且相较同价位替代品功能偏轻；The Verge 则说这款掌机也许是史上最好的 Game Boy 复刻，但仍被创始人包袱包住。


              这种组合指向的公开可比对象，更接近 Corsair、Logitech、Hasbro、Funko，以及部分零售 / 收藏品参照，而不是软件或交易平台公司。Corsair 2026
              年业绩展示了真实高端外设业务的经济性：利润率尚可但仍是硬件式，并对关税、供给和定价敏感。Hasbro 说明，即便强 IP 公司也要承受实体产品波动和关税开支。Funko
              则说明，收藏者热情在公开市场里会被多残酷地压缩。Nintendo 是上行天花板，不是直接可比：它证明硬件只有在软件和数字附加销售真正规模化后才会值钱得多，但 ModRetro
              还没有披露任何证据，证明它的收入质量接近那种状态。
