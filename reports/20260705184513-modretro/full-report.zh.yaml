        - 全球零售商网络和卡带售出循环
        - 大众市场装机量和经常性计费
        - 主要依靠发烧友渠道、交易平台和改装店
      - - 最匹配买家
        - 看重手感和包装的高端怀旧买家
        - 想要最大保存覆盖面的收藏者
        - 重视性价比的实体媒介买家
        - 便利优先的家庭或休闲复古玩家
        - 预算型折腾玩家或现有原版硬件持有者
