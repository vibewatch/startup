      - number: '3.2'
        title: 定价与能力取舍
        blocks:
          - type: paragraph
            body: >-
              Chromatic 当前头条定价具有战略意义：它相对便利型替代品显得贵，但面对最高端的直接同类仍可防守。ModRetro 自有商店和 GameSpot 的零售报道都把含 Tetris 的 Chromatic 定在
              $199.99。这个价格低于 Engadget 和 Android Authority 报道的 2026 年 Analogue Pocket 涨价后水平，但明显高于 Evercade 2025 年 EXP-R 和
              VS-R 新款约 $129.99 的价格、Lukie Games 可见翻新 N64 套装约 $104.34 的价格，也高于 Nintendo 官方所称共享 Switch Online + Expansion
              Pack 家庭方案每人每年约 $10 的成本。能力打包同样关键。Pocket 更宽，支持多系统适配器、Dock 和 openFPGA。Evercade 更便宜且有授权，但在硬件和随附内容上做取舍。Nintendo
              第一年的成本低得多，但提供的是访问权而不是所有权。模拟掌机通过固件和 ROM 工作流把广度推得更远，只是卡带原真信号弱得多。因此，ModRetro
