      - number: '2.4'
        title: 驱动因素、约束与采纳节奏
        blocks:
          - type: paragraph
            body: >-
              几个结构性驱动确实存在。ESA 的年龄结构和家庭同玩信号支持一个判断：复古需求不是只有硬核收藏者，而是跨代际的。实体媒介生态仍有共鸣：Evercade 持续用捆绑卡带和低价硬件把新人拉进收藏习惯；ModRetro
              自有材料也强力强调卡带、复刻版和新开发游戏。分析机构市场报告还称离线游玩仍有需求，这符合自有复古硬件的心理。约束同样重要。Circana
              明确警告，即使软件年份改善，硬件仍面临逆风。广义市场报告把云游戏、订阅和其他数字娱乐描述为时间和金钱的强替代用途。CNBC 对 Nintendo Switch 2 关税的报道显示，硬件 BOM
              冲击即便对大型平台也会推迟预购并迫使价格调整；这提醒我们，利基复古厂商可能更脆弱，而不是更稳。最后，ModRetro 承担同行没那么强的创始人品牌风险：The Verge 和 Kotaku 都显示，Palmer
              Luckey 与 Anduril、政治立场的关联可能变成采纳阻力。净结果是：采纳应按一条窄的发烧友楔子建模，并保留生态上行，而不是按大众主机周期建模。
