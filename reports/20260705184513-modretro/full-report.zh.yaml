      - number: '6.3'
        title: 做工口碑大多正面，但电池和政策摩擦持续存在
        blocks:
          - type: paragraph
            body: >-
              公开评测语料方向上有利。评测者持续称赞 Chromatic
              的做工、原真度和显示效果，即便持怀疑态度的媒体通常也承认，产品兑现了核心复古承诺。问题是，同一批语料反复提到一组狭窄负面：这台设备对单用途掌机来说太贵，依赖 3 节 AA
              电池，可充电路径要么额外收费，要么在部分评测期间缺席。这些抱怨很重要，因为它们直接打击追求便利的买家，让产品更容易被欣赏，而不是被广泛推荐。官方支持页面也强化了同一主题。ModRetro
              的已知问题页面公开记录电量表异常、低电量下背光闪烁、存档问题和 kernel panic 升级路径。Bug 页面要求用户先走固件更新再联系支持，这在运营上合理，但仍会给客户增加工作。最鼓舞人的客服证明，是唯一一条
              Trustpilot 评价称电池问题后获得了免费外置充电器；最不利的信号是限制性退货条款、用户打开设备即失去保修，以及音量滚轮松动帖子等机主投诉。
