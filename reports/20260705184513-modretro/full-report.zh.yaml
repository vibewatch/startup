      - number: '2.2'
        title: 规模测算视角与区间纪律
        blocks:
          - type: paragraph
            body: >-
              本章最重要的规模纪律，是把广义游戏需求与真正会购买专用复古硬件的细分人群分开。ESA 2024 年美国数据展示了真实支出背景：消费者总支出 $59.3B，其中硬件 $4.9B、配件
              $3.2B。分析机构把外框拉得更大：Fortune Business Insights 预计 2026 年全球视频游戏市场为 $255.03B；Grand View 测算 2024 年市场为
              $298.98B，并称主机占比超过 27%。这些数字有助于定方向，但太宽，不能称为 ModRetro 的 TAM。Research and Markets
              有一定方向价值，因为它单独跟踪主机游戏、实体主机游戏、平均售价和人均支出，确认实体主机支出是一个合法分析视角；但公开摘要仍没有给出切出高端复古硬件细分所需的数字。因此，唯一可防守的公开建模路径是受限的、自下而上的。若美国
              2.05 亿以上玩家中只有 0.05% 到 0.20% 在一年内购买一台约 $200 的高端复古设备，年设备支出约为 $20.5M 到 $82.0M。如果 ModRetro
              能把生态变现，这个规模值得投资；但相对广义游戏市场，它仍是利基，小到执行失误、关税或争议都可能产生很大影响。
