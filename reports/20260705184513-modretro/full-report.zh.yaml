      - 层级 / 组件
      - 作用
      - 当前证据
      - 外部依赖
      - 主要风险
    rows:
      - - Chromatic 自定义显示栈
        - 提供原真的 GB/GBC 像素几何和户外可读背光画面
        - 官方产品页和深度评测分析
        - 自定义面板供应和镜片材料采购
        - 差异化难复制，但规模化替换或维修也更难
      - - Chromatic FPGA 核心
        - 在专用硬件上重建 GB/GBC 逻辑
        - 官方代码仓库和 README
        - 源自 MiSTer 的上游设计血统
        - 除非移植更多核心，否则范围保持狭窄
      - - Chromatic 本地构建链
        - 让开发者重建或修改 FPGA 固件
        - README、Gowin 许可页面和社区复用代码仓库
        - 特定 Gowin IDE 版本加年度本地许可证
        - 开放，但仍脆弱且绑定工具链
      - - Chromatic 社区工具层
        - 把已发布源码改用于转储卡带等归档工作流
        - 社区转储工具代码仓库
        - 志愿开发者和非官方维护
        - 能证明开放性，但还没有打磨到适合大众用户采用
      - - M64 FPGA 逻辑结构
        - 为周期敏感的 N64 行为和未来核心可移植性提供计算预算
        - 官方深度解析加第三方摘要
        - AMD / Artix UltraScale+ 供应和板级设计执行
        - 实际准确性仍取决于核心成熟度，不只是硅片余量
      - - M64 内存子系统
        - 使用低延迟 PSRAM 支持确定性的随机访问
        - 官方深度解析加 CNX 摘要
        - 板级布线、时序收敛和持续固件优化
        - ModRetro 承认实现还没有完全优化
      - - M64 手柄 / 无线栈
        - 把三叉手柄人体工学与现代低延迟、抗漂移硬件结合起来
        - 官方更新和 M64 页面
        - 蓝牙模块行为，以及跨设备的 SCI 支持
        - 性能说法尚未经过独立基准测试
      - - 发货后的固件路径
        - 硬件到手后承接 bug 修复和功能新增
        - Chromatic 更新器界面和 M64 更新措辞
        - 内部固件团队、更新器驱动和支持流程
        - 承诺有可信度，但仍会留下长期维护负担
    notes: 本表把物理组件与围绕它们的运营工具拆开，因为 ModRetro 的差异化不只靠外壳层面的规格， 也靠构建链和固件姿态。
