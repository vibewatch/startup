      - number: '1.3'
        title: 资本结构、披露与当前规模
        blocks:
          - type: paragraph
            body: >-
              资本故事是公开记录里最强的正面信号，但数字上也最混乱。TechCrunch、Observer 和 GREY Journal 都把 ModRetro 放在 2026 年 3 月融资周期中，估值可能约
              $1B。官方可访问、偏申报的证据更窄：FormDs 显示一笔 $150M 目标发行，已售 $145.2M；Forge 可访问公司页显示 2026 年 3 月 6 日完成 $111.63M 的 Series
              A-1、$33.53M 的 Series A-2，累计融资
              $164.3M。这些数字说明公司刚拿到大量新钱，但无法整齐合并成一个头条融资额。缺失的信息同样重要。审阅过的官方页面没有披露收入、ARR、毛利率、客户数或员工数。因此，任何尽调判断都只能依赖产品证据、市场定位和创始人质量，而不是运营证明。投资者也应把公开估值叙事视作由可选性驱动，直到管理层把轮次规模、股权结构和真实经营指标讲清楚。
