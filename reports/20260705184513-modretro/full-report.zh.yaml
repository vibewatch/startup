      - number: '4.3'
        title: 资本结构、融资与资本强度
        blocks:
          - type: paragraph
            body: >-
              最强的硬财务证据是 2026 年 Form D。ModRetro 的 SEC 申报显示，一笔 $150.0M 发行，已售 $145.2M，剩余 $4.8M，已有 41 名投资者进入交易，收入区间标为 "No
              Revenues"。这很有意义，因为消费硬件创业公司很少披露这样大、这样明确的融资。它支持一个结论：ModRetro 已筹到足够资金，可以支持产品扩张和库存建设；但它没有回答这些资本消耗得多快。Forge
              通过披露 2026 年 3 月 $111.63M 的 Series A-1 和 $33.53M 的 Series A-2 提供更多结构，同时显示总融资 $164.3M，以及 1x
              非参与式清算优先权等可见优先股条款。市场报道再叠加约 $1B 估值讨论，但那仍是讨论，不是经审计的经营桥。


              因此，资本强度现实有两面。一面是，官方和市场数据来源显示 ModRetro
              具备真实融资能力，负担得起不止一个平台的模具、元件采购、仓储和上市库存。另一面是，没有公开来源披露手头现金、烧钱速度、债务、采购订单融资、库存周转或下一轮触发条件。硬件同行说明了为什么这些问题重要：元件通胀、内存约束和关税变化会迅速移动成本，实体产品公司也经常需要在终端销售已知之前先投入库存、物流和营销。因此，这笔融资降低了生存风险，但不能让外部投资者精确建模资本充足性。
