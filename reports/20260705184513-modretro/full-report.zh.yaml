      - number: '8.4'
        title: 最终尽调问题、退出纪律与投资假设破裂触发器
        blocks:
          - type: paragraph
            body: >-
              缺失信息不是装饰，它决定这家公司只是有一个看似合理的高溢价，还是能被真正承销。已审阅的公开来源没有披露 ModRetro
              的确认收入、产品家族毛利率、预购转化、保修准备金、现金余额、烧钱、库存承诺或客户集中度。Forge
              只露出轮次机制的一小片，即便这部分也无法回答更广泛融资故事背后有多少清算保护、老股转让或按比例跟投行为。因此，外部投资者无法判断当前估值是由真实单元经济支撑，还是仅由一个有魅力的连续创业者和稀缺私募资产的胃口支撑。


              这也意味着退出姿态必须保守。旗舰申报仍写着 “No Revenues”，运营桥仍是私有信息，公开材料没有支撑近期 IPO 就绪度的基础。可支撑的持有逻辑，是 M64
              发布前后继续私下执行、证明实销，并在未来拿出一套 KPI
              包，把收入、利润率和营运资本强度对上。如果发布时间显著滑后，如果卡带和手柄附加销售没能加深变现，如果退货或支持成本压过高端定价，或如果未来融资轮揭示的投资者保护条款让头条估值没看上去那么有意义，投资假设就会破裂。
