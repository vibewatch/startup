  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              ModRetro 应放在游戏硬件的一小块里承销：高端复古保存设备，靠原真感、实体媒介和自有硬件仪式感变现，而不是一般游戏消费。大市场背景当然很大，但大部分支出不在 ModRetro 的实际战场。买家选择
              Chromatic 或 M64 时，并不是在 ModRetro 和整个全球游戏经济之间二选一；真正的比较集合窄得多。它包括原始硬件和翻新路径、Analogue 的高端 FPGA 复刻设备、Evercade
              这类精选卡带生态、Retroid 或 Anbernic 等低价模拟掌机，以及 Nintendo Switch Online
              这样的订阅库。这个区分很关键，因为几个替代品能以低得多的成本完成同一个怀旧任务。Switch Online 让一个家庭在共享方案下以每人每年约 $5 到 $10 试玩经典游戏库；Evercade 新款硬件约
              $100；翻新 N64 硬件当前挂牌约 $95 到 $100；Anbernic 式模拟设备可接近 $70。因此，ModRetro
              所在市场里，所有权、材料、卡带保真度和生态身份必须证明相对便利型替代品的大幅溢价是合理的。
