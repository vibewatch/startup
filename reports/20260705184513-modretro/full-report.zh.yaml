  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与买家选择集
        blocks:
          - type: paragraph
            body: >-
              ModRetro 并不在一条整齐产品赛道里竞争。最接近的直接掌机对手是 Analogue Pocket，它已经服务那些想要 FPGA 原真度和大规模卡带兼容库的高端收藏者。主机端的 M64
              将进入更尖锐的战场，因为 Analogue 3D 已经占据「现代 N64 上 4K 电视」叙事。低于这些高端同类的是 Blaze 的 Evercade
              系列，它提供授权实体卡带和更低硬件价格，但主张更精选、也没那么硬件纯粹。直接 FPGA 集合之外，Nintendo Switch Online 用订阅和不断扩大的经典游戏库吸收休闲复古需求；Anbernic 和
              Miyoo 式掌机则靠廉价、以 SD 卡为中心的广度争夺游玩时间。最后，原始硬件、烧录卡和 FPGA 改装套件仍是真实的现状替代品。实际含义是，ModRetro
              争夺的是一笔怀旧预算，它可以流向原真度、便利性、广度或收藏仪式，而不只是流向某个竞争 SKU。
