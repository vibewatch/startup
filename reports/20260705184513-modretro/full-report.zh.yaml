        - 核心问题是，高端定价能否抵消硬件成本、关税和支持负担
        - 索取 BOM 摘要、运费和关税假设、准备金政策，以及按 SKU 划分的毛利桥接
      - - 手头现金、烧钱、跑道，以及债务或 PO 融资
        - 2026 年融资本身并不能说明公司能为发布和库存撑多久
