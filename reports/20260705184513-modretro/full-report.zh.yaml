  - id: TP003
    title: 定价 / 包装对比
    columns:
      - 替代方案
      - 公开入门价
      - 包含能力
      - 隐性额外成本 / 约束
      - 含义
    rows:
      - - Chromatic
        - $199.99
        - 包含 Tetris，原始分辨率掌机，金属外壳，支持 GB/GBC 卡带
        - 套装之外仍需购买卡带；目前只有一个核心格式
        - 买家若重视手感胜过覆盖宽度，高端掌机叙事就强
      - - M64
        - 据称早期支持者价 $199
        - 全新 N64 FPGA 主机、现代手柄生态、原版卡带接入现代电视
        - 发布执行和独立评测验证仍待观察
        - 作为高端 N64 克隆机，入门价进攻性强，但风险尚未拆掉
      - - Analogue Pocket
        - 2026 年涨价报道中约 $239-$240
        - 多系统卡带兼容、即时存档、Dock 选项、openFPGA 邻近生态
        - $99 Dock 和适配器会显著抬高全包成本
        - 覆盖比 Chromatic 更广、基础更稳，但也更贵
      - - Analogue 3D
        - 预购价 $250
        - 4K N64 游玩、四个手柄接口、Wi-Fi/Bluetooth、原版卡带
        - 有发货延迟历史，关税后补货价格不确定
        - 最接近 M64 的直接可比对象，但并不明显更便宜
      - - Evercade EXP-R
        - 2025 年评测报道中 $129.99
        - 授权卡带掌机、TATE 模式、Wi-Fi、精选游戏库
        - 无电视输出，性价比弱于老款捆绑版本
        - 更低成本的卡带生态，会吸走价格敏感的收藏者
      - - Evercade VS-R
        - 2025 年评测报道中 $129.99
        - 1080p 电视游玩、双卡带、一个手柄、四个 USB 接口
        - 仍是精选生态，硬件基本未变
        - 面向家庭和复古新人的亲民沙发替代方案
      - - Nintendo Switch Online + Expansion Pack 家庭共享
        - Nintendo 官方家庭套餐示例中，每人每年约 $10
        - 大型复古游戏库、在线功能、云存档、现有硬件便利性
        - 获得访问权而非拥有权；前提是已经有或想买 Switch
        - 对高端复古硬件最强的主流价格锚
      - - 翻新原版 N64
        - Lukie Games 在售标价 $104.34
        - 原版主机手感，含手柄、线缆和保修
        - 硬件老化、AV 适配麻烦，且没有一体化现代便利性
        - 现状替代方案，会让部分怀旧买家不参与新主机发布
