      - - 零售商经济性和退货
        - 直营叙事看起来可能很有吸引力；一旦叠加批发折扣、扣款和退货率，真实经济性才会显现
        - 索取 GameStop 和其他渠道条款、合作营销支出、退货备抵和保修处理方式
