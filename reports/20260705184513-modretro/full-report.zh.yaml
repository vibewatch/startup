      - number: '4.2'
        title: 单元经济代理指标与利润率现实
        blocks:
          - type: paragraph
            body: >-
              ModRetro 几乎不直接披露经典单元经济栈，所以同行硬件披露是唯一有纪律的公开代理。Nintendo 文件显示，硬件占比上升时，利润率压缩可以很快：当低利润率 Switch 2
              硬件在销售中占比大幅提高，其毛利率从 61.0% 降到 39.3%，库存基础还包含有意义的原材料和成品减记。Corsair 更适合作为高端发烧友硬件和配件代理：2026 年 Q1 公司毛利率为
              32.7%，外设隐含毛利率约 40.8%，组件和系统为 28.4%；同时它仍警告关税逆风、半导体约束和高价带来的需求压力。Hasbro
              的消费品分部提供另一层现实校验：即使更大公司仍在增长，增量关税费用也能把实体产品业务推入经营亏损。


              这些代理说明，ModRetro 应按一家真实硬件公司承销，而不是披着复古品牌的软件公司。实体媒介卡带、金属外壳、定制显示屏、手柄、可充电电池包、仓储和售后支持，都会把模型推向库存和服务复杂性。ModRetro
              自有 M64
              材料强调易维修设计、可替换手柄零件和实体盒装软件；这些对品牌是优势，也提示模具、零件管理、保修处理和替换库存都很重要。因此，公开证据支持一条可行的高端硬件毛利路径，但不是软件式路径，更不能推出公司可以在没有营运资本冲击的情况下扩张。
