      - number: '1.2'
        title: 创始人、领导层与公司足迹
        blocks:
          - type: paragraph
            body: >-
              公司叙事与 Palmer Luckey 深度绑定，但运营图景比「Palmer 的副业项目」更复杂。Luckey 自己的发布文章称，ModRetro 起源于他少年时期的硬件改装论坛，Chromatic
              的想法作为爱好延续了近 17 年。不过，公开第三方资料把当前硬件公司的重启时间放在 2023 年，并持续将 Torin Herndon 列为联合创始人兼 CEO。2026 年 4 月 M64 更新由 Torin
              署名，也强化了一个判断：他是对产品发货负责的可见高管；Luckey 更像创始人、产品愿景人物和融资磁铁。公司足迹证据没那么干净。本次审阅的官方消费端页面没有公布总部地址，但偏申报的数据库和市场数据档案指向
              ModRetro, Inc. 在 Irvine, California 的邮寄地址。因此，尽调可以支持 Irvine 的法律 / 申报足迹，但仍应直接要求管理层厘清法律地址、仓储运营，以及更广义的
              Southern California 运营布局。
