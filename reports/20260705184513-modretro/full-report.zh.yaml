      - number: '7.2'
        title: 公开可靠性信号可管理，但电池、固件和可维修性摩擦持续存在
        blocks:
          - type: paragraph
            body: >-
              反驳“产品质量灾难”假设的最好论据，是 ModRetro 已知问题范围窄，且常可通过固件修复。反驳“高端硬件无摩擦”假设的最坏论据，是同一批公开支持页面反复回到电池、固件和边缘 bug。known-issues
              页面记录了电量计异常、低电量电池下背光闪烁、kernel-panic 升级、游戏存档排障和更新器失败；bug 页面明确要求机主先走自助服务和固件流程，再进入人工支持；MR Updater 与 Cart
              Clinic 也把软件工具变成持有体验的核心部分。发烧友能接受，但如果机主基数扩大，就会抬高支持规模化风险。硬件侧也有可见毛边。ModRetro 警告，首版机器中的 Power Core
              死电后可能无法恢复；一名论坛用户抱怨音量轮松动；Old School Gamer 作者描述了一次电池漏液，导致主机音频失效，直到 ModRetro 更换设备。即便正面的 Trustpilot
              轶事也是双刃剑：它证明客服不错，但开头就是电池充电失败。结论不是 Chromatic 已经坏掉，而是 ModRetro 仍像一个活的硬件平台，保修准备金、支持和机主便利性风险都不低。
