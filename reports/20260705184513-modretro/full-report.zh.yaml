      - number: '5.4'
        title: 可维修性、制造准备度与路线图风险
        blocks:
          - type: paragraph
            body: >-
              可维修性故事好过多数精品复古硬件，但没有营销口号那么干净。Chromatic 似乎确实容易打开：iFixit
              展示了直观的三翼螺丝拆解，内部模块可触达；第三方评测者也指出，其螺丝和连接器选择没有某些同类那么敌意。不过，ModRetro
              自己的保修文本明确表示，用户打开外壳会让保修失效。实际结果是，设备在机械上可维修，但商业安排把用户推向厂商控制的服务。Old School Gamer 的电池漏液轶事说明 ModRetro
              可能仍会慷慨处理部分故障，但公开备件经济性仍不透明。M64 目前受益于强于多数未发布主机的路线图透明度。4
              月更新称，已认证机型正在入仓，早期生产接近完成，预生产硬件已交给测试者。官方深度解析甚至更有信息量，因为它点名未解决技术工作，而不是假装核心已完成。这种诚实提升了可信度。尽管如此，发布风险并未消失。M64
              还缺少对延迟、兼容性边缘案例、散热和长时段稳定性的独立公开验证。公开价格故事也仍然混乱。合并来看，ModRetro 在工程意图上可信，发布前技术披露也强于常态；但 M64
              的证明责任仍落在独立评测覆盖和发布后的真实仓库交付上。
