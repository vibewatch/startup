  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型、定价与商业面
        blocks:
          - type: paragraph
            body: >-
              ModRetro 已经展示出比一次怀旧小玩意投放更宽的变现栈。当前店铺把 Chromatic 套装定价 $199.99，保留 $299.99 的蓝宝石屏幕高价选项，销售可充电电池包和定制零件等配件，并用单 SKU
              定价和套装式促销陈列实体卡带。同样重要的是，官方 M64 材料把第二个平台写成一个平台，而不是一次性后续产品：主机首发时有 4 款游戏单独销售，ModRetro 称正直接资助新的 M64
              游戏，公司还把手柄、电池和配件设计打进产品故事。这个组合在财务上重要，因为它说明 ModRetro 试图靠硬件、配件附加和实体软件复合钱包份额，而不是只靠单台设备 ASP。


              公开记录仍没有揭示的是，从标价到实际收入质量的桥。公司没有公开披露批发与 DTC 组合、零售商抽成、折扣、套装附加、退货、保修准备，或按 SKU 的贡献利润率。M64 定价故事在来源质量上也混杂：官方页面确认 7
              月 28 日发货时点和激进 MSRP 表述；Notebookcheck 是 $199 早鸟价最清晰的公开见证。因此，正确财务解读是，ModRetro
              有真实、可见的定价权信号和多个收入面，但投资者仍不知道，在制造、物流、支持和渠道摩擦之后，有多少标价会转成确认毛利。
