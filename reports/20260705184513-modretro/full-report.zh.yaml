      - number: '3.3'
        title: 替代品、分销与收藏者技术栈
        blocks:
          - type: paragraph
            body: >-
              最大的错误，是只拿 ModRetro 和其他闪亮的 FPGA 盒子比较。许多买家无需进入 ModRetro 生态，也能满足同一项复古游戏任务。Nintendo 提供摩擦最低的家庭选项，因为买家可能已经有
              Switch，只需很小的增量支出就能加上经典游戏库。Miyoo 和 Anbernic 式设备吸引的是另一种用户心理：他们用原真度换取广度、自定义固件、Wi-Fi 功能，以及 ROM + SD
              卡工作流，让爱好者用少得多的钱做多得多的事。原始硬件发烧友还有另一条路。Lukie 的翻新 N64 挂牌显示，老硬件仍以可运行套装出售；EverDrive64 和 FunnyPlaying 的 FPGBC
              套件则显示，收藏者不买 ModRetro 硬件，也能现代化或整合自己的配置。GameStop 分销让 ModRetro
              比某些对手更不像精品小众货，但单靠分销抹不掉这些替代阶梯。收藏者生态是碎片化的，其中很大一部分已经由零售商、改装套件厂商、烧录卡卖家和订阅平台服务；它们会先于 ModRetro 捕获预算型买家或深度动手派。
