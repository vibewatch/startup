      - number: '2.5'
        title: 规模与采纳尽调缺口
        blocks:
          - type: paragraph
            body: >-
              公开记录足以说明市场存在、买家愿意为原真体验付费、ModRetro 位于真实的高端复古替代集合中。但这些证据还不足以转成干净的
              SOM。最大缺口是可观察的销量：本次审阅没有任何公开来源单独给出高端复古保存设备的终端销售、装机量或重复附加行为。第二个缺口是生态本身的经济性。只有当卡带和配件足够频繁附加，能把生命周期价值抬到超过一次性硬件销售在利基
              TAM 中可支撑的水平时，实体媒介才是可信顺风。第三个未解问题是，创始人争议究竟只是声音很大的评论，还是可测量的需求税。广义游戏数字远大于潜在利基，所以这些未回答问题不是脚注；它们决定 ModRetro
              是耐久发烧友平台，还是做得很漂亮但边界清晰的硬件生意。因此，承销应把当前市场案例视为：存在性为正、溢价支付意愿为正；在管理层提供分群和渠道数据前，对规模保持谨慎。
