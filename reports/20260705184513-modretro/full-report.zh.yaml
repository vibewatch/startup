      - number: '2.3'
        title: 买家细分与支付意愿
        blocks:
          - type: paragraph
            body: >-
              买家图谱不是一个单一的「复古玩家」群体。收藏 / 保存型玩家看重原始卡带、显示准确度、手柄手感，以及拥有专用硬件的象征动作，因此最愿意支付高端
              ASP。第二类是成年怀旧掌机买家：他们想要更好的现代日常游玩设备，只要硬件足够高端，就能为 $200 购买找到理由；The Verge 的 Chromatic
              评测说明，高做工可以显著支撑这一人群。第三类是家庭或礼品购买者，最终用户可能是孩子或共享家庭成员，真正掌握预算的人更在意易用、耐用和辨识度，而不是晶体管级原真度。图谱另一端是价值优先的动手派，他们可以买 $70
              的 Anbernic 设备或 $199 的 Android 模拟掌机，用更高设置摩擦换取更广的软件灵活性。Evercade 也证明，中间层用户想要实体卡带，但未必需要 ModRetro
              级别的高端硬件。这个替代阶梯说明，ModRetro 的支付意愿天花板是真实存在的，但它落在发烧友和重视设计的利基里，而不是主流预算池。
