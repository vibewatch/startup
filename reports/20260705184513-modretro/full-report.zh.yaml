          detail: 买家通常在 ModRetro DTC、GameStop 独家渠道或小众合作伙伴套装之间选择。
        - id: j3
          label: 硬件加 Tetris 起步
          detail: 产品按高端入门套装销售，不是裸硬件外壳。
        - id: j4
          label: 分流到加购
          detail: 收藏者买游戏；折腾型买家买 Mod Kits；便利型买家考虑 Power Core；联名买家加购 Koss 套装。
        - id: j5
          label: 使用支持和固件路径
          detail: 遇到 bug 的机主会被引导查看已知问题、更新固件并联系支持。
        - id: j6
          label: 向市场反馈需求信号
          detail: 部分用户留下论坛帖或评测；稀缺性把其他人推向转售或补货提醒渠道。
    claimRefs:
      - CU001
      - CU003
      - CU010
      - CU018
      - CU021
      - CU023
      - CU027
      - CU048
      - CU057
      - CU058
  - id: FU002
    title: 采用 / 落地漏斗
    type: flow
    layout: wide
    summary: 公开证据显示一条狭窄但清晰的漏斗：通过发烧友媒体发现，经稀缺零售或 DTC 供给转化，再扩展到游戏、配件或社区触点。
    data:
      nodes:
        - id: f1
          label: 认知
          detail: 评测、Android Police 的需求报道和社区讨论带来发现。
        - id: f2
          label: 稀缺性检查
          detail: 买家注意到售罄批次、GameStop 独家或补货提醒。
        - id: f3
          label: 首次购买
          detail: 首购通常是硬件捆绑 Tetris 和电池。
        - id: f4
          label: 加购机会
          detail: 游戏、Power Core、Mod Kit、耳机和收藏者套装扩大支出。
        - id: f5
          label: 支持 / 固件循环
          detail: 已知问题、bug 分流和政策条款塑造购后客户体验。
        - id: f6
          label: 结果
          detail: 满意机主贡献评测或复购；不满机主提出价值或争议异议。
      edges:
        - from: f1
          to: f2
