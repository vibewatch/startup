        - 毛利率决定高端定价是否真能覆盖硬件 COGS 和渠道摩擦
        - 提供 Chromatic、配件、卡带和 M64 预购的毛利率
      - - 硬件毛利率代理区间
        - 同行分部区间为 28.4% 至 40.8%；Nintendo 在硬件占比较高的年份，综合毛利率降至 39.3%
        - 中
        - 公开同行显示，高端硬件经济性可以不错，但仍远低于软件式毛利，而且对产品结构高度敏感
        - 把 ModRetro BOM、模具摊销、物流和退货准备金桥接到单台贡献利润
      - - 库存 / 过时风险
        - Nintendo 库存 486.4bn 日元，并对原材料和成品计提减值
        - 中
        - 实体硬件和盒装软件若需求误判或版本快速迭代，会沉淀资本
        - 提供按 SKU 家族划分的库存、库龄和减值政策
      - - 关税 / 零部件成本敏感性
        - Nintendo 预计成本影响约 100bn 日元；Corsair 和 Hasbro 均提到关税逆风
        - 中
        - 如果芯片、组装或物流成本波动，高端小众主机的毛利会很快受损
        - 按地区分享采购地图、关税敞口和缓释假设
      - - 现金 / 跑道
        - null
        - 低
        - 大额融资不等于健康跑道；如果模具和库存先于终端销售吃掉现金，跑道会缩短
        - 提供现金、月烧钱、采购承诺，以及基准和下行情境下的跑道
      - - 支持 / 维修负担
        - 可维修设计和可更换部件意味着长期备件、校准和支持流程
        - 低
        - 售后复杂度如果准备金太薄，会侵蚀毛利和客户满意度
        - 提供保修申赔率、备件库存和每台活跃设备支持成本
