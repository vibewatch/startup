companyProfile:
  summary: >-
    ModRetro 是一家私营复古硬件公司，Palmer Luckey 和 Torin Herndon 于 2023 年将其重启。公司目前销售 Chromatic：一款高端掌机，基于 FPGA，聚焦 Game Boy/Game Boy
    Color，并配套自有卡带和配件生态；同时准备推出 M64，一款基于 FPGA、兼容 Nintendo 64
    的主机，配套自有手柄和实体软件路线图。公开证据支持真实的发烧友需求、扎实的产品工艺和近期大额融资，但收入质量、利润率结构和治理细节仍大多未披露。
