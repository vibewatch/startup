  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 资本真实存在，但估值和第二款产品执行现在承载下行风险
        blocks:
          - type: paragraph
            body: >-
              ModRetro 已经从概念跨过门槛，变成拿到融资的运营公司。Form D 对一家私营消费硬件公司来说异常清楚：$150.0 million 豁免发行、已售出 $145.2 million、41
              名投资者，收入区间为 “No Revenues”。这组信息重要，因为它排除了“公司下个季度能否活下去”这种简单质疑，却提出了更难的问题：一家只发出一款小众主机、收入未披露的公司，能否支撑市场报道的 $1
              billion 估值讨论？答案现在高度取决于 M64 执行。官方页面仍在使用等待名单和发布措辞，M64 生产更新还在谈评测机和转入量产，第三方报道仍提示预购可见度缺失、首批产量不确定。换句话说，ModRetro
              的融资风险不再是单纯流动性风险，而是估值支撑风险。如果 M64
              顺利发布并卖穿，这轮融资就像扩张燃料；如果发布时间滑后、供给比预期更薄，或附加销售经济性不及预期，同一笔资本就会开始像一座很昂贵的桥，通向一个比假设更窄的发烧友市场。
