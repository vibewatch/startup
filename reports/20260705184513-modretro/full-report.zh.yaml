      - number: '7.4'
        title: 创始人争议与集中执行压缩容错空间
        blocks:
          - type: paragraph
            body: >-
              ModRetro 的创始人优势和创始人风险是同一个变量。Palmer Luckey 给公司带来媒体氧气、融资故事和清晰的产品哲学；他也保证每次产品讨论都可能变成政治或防务科技讨论。Yahoo Tech 重提他被
              Facebook 解雇以及支持 Trump 的捐款，Cybernews 强调他愿意为战争中 AI 生死决策辩护，ResetEra 的反弹帖则显示，至少一部分公开情绪把 Luckey
              本人视为拒绝关联产品的理由。TechCrunch 用更礼貌的方式表达了同一点：它引用一篇评论，问买家是否会购买 Lockheed Martin 造的 Game
              Boy。大众市场品牌遇到这种情况是观感问题；对小众高端复古品牌来说，这是可量化的 TAM
              约束。它不会阻止公司向坚定发烧友发货，但会提高产品质量、渠道信任和性价比的门槛，因为创始人画像已经过滤掉一部分可触达受众。因此，正确的监控框架不是泛泛的“执行风险”，而是集中度风险：一个创始人、一个仍在成熟中的硬件平台、一次高可见度的下一款产品发布，以及一个几乎不给运营意外留空间的估值故事。
