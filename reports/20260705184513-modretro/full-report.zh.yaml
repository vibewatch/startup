      - number: '5.3'
        title: 开放性、固件与开发者姿态
        blocks:
          - type: paragraph
            body: >-
              ModRetro 的开源姿态在 Chromatic 上最强，在 M64 上仍是临时承诺。已发货掌机方面，公司发布了 FPGA 和 MCU
              两个仓库，记录了社区刷机路径，并留出足够空间，让独立开发者搭建卡带转储等旁路工作流。这明显好过纯围墙花园，也给本章提供了可信的开发者信号面。但开放并非毫无摩擦。工具链仍绑定
              Gowin，构建说明有强预设，社区复用案例读起来仍是「能跑，但不友好」。评测者也持续指出，ModRetro 对 Chromatic 的公开叙事弱化了让这次发布成为可能的 MiSTer 血统。M64
              野心更大。官方和独立报道都指向一点：主机计划使用 Robert Peip 基于 MiSTer 的 N64 核心，ModRetro 承诺向上游提交代码，硬件也被设计成比 DE10-Nano 级设备更强的开放
              FPGA 活动通用主场。不过，实际 M64 仓库尚未公开。这造成了本章的核心路线图张力：ModRetro 说了许多正确的话，开放性过往记录也强于 Analogue；但 M64
              开源论点仍是由访谈和博客支撑的承诺，还不是交付后的公开仓库。
