        - 业务仍比 ModRetro 宽，也受 PC 零部件周期影响。
      - - Logitech
        - 高端外设平台，品牌、规模和品类宽度都更强。
        - 2026 年 7 月 P/S 为 2.83x
        - 如果 ModRetro 证明配件经济性可持续，它可作为公开外设基准的高端参照。
        - 规模大得多、更多元，对单一 IP 的依赖也低得多。
      - - Hasbro
        - 自有 IP 玩具与游戏公司，既有实体产品，也有更高价值的内容飞轮。
        - 2026 年 7 月 P/S 为 2.41x
        - 说明当生态不止一个设备家族时，品牌化实体 IP 公司能拿到什么估值。
        - 仍不是直接硬件可比公司，也受益于宽得多的 IP 深度。
      - - Funko
        - 收藏周边和粉丝需求看起来诱人，但一旦需求和库存风险暴露，公开市场会重罚。
        - 2026 年 7 月 P/S 为 0.33x
        - 当需求或执行走弱时，发烧友实体商品会如何被压缩估值，Funko 是有用案例。
        - 周边商品模式不同于 FPGA 游戏硬件。
      - - GameStop
        - 零售 / 收藏品可选性可能带来异常公开倍数，与干净的经营可比性脱节。
        - 2026 年 7 月 P/S 为 2.82x
        - 这是一个提醒：公开市场定价可能含有非基本面可选性。
        - Meme 股、资产负债表和散户因素让它很难作为核心可比公司。
      - - Nintendo
        - 真正的平台经济性来自硬件与软件、规模化数字变现的结合。
        - 定性天花板，不是直接倍数锚
        - 说明为什么当实体硬件带来大规模软件和数字化附着时，投资人可能付更高价格。
        - ModRetro 还没有公开证明接近 Nintendo 的规模或附着。
    notes: 由于不存在完美的 ModRetro 公开类比，本表有意混合直接硬件、高端外设、收藏 / IP 和平台天花板参照。
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover the main public lenses useful for bounding ModRetro valuation as of the run date, not every gaming or
        consumer-hardware ticker.
