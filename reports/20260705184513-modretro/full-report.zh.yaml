        - 通过 Pocket 适配器、openFPGA 和 3D，覆盖极高
        - 通过跨多发行商的精选卡带库，覆盖中等
        - 便利性高，但受限于 Nintendo 精选游戏库
        - 基于 ROM 的掌机覆盖极高；原版硬件栈通常较窄
