    {
      "id": "capitalization-disclosure-and-current-scale",
      "title": "Capitalization, disclosure, and current scale",
      "body": "The capital story is the strongest positive signal in the public record, but it is also the messiest numerically. TechCrunch, Observer, and GREY Journal all place ModRetro in a March 2026 fundraising cycle that could value the company around $1 billion. Officially accessible filing-oriented evidence is narrower: FormDs reports a $150 million target offering with $145.2 million sold, while Forge’s accessible company page shows a March 6, 2026 Series A-1 of $111.63 million, a Series A-2 of $33.53 million, and cumulative funding of $164.3 million. Those numbers imply substantial fresh capital, but they do not resolve neatly into a single headline amount. What is absent is just as important. None of the reviewed official pages disclose revenue, ARR, gross margin, customer count, or headcount. That forces any diligence stance to lean on product evidence, market positioning, and founder-quality rather than on operating proof. It also means investors should treat the public valuation narrative as optionality-driven until management bridges round size, ownership, and actual business performance metrics.",
