  topStrengths:
    - >-
      Chromatic already proves ModRetro can ship a premium, well-reviewed hardware product rather than just market
      nostalgia concept art.
    - >-
      The company appears to be building a broader physical-IP ecosystem through cartridges, accessories, and a second
      console rather than relying on one SKU.
    - >-
      Public financing evidence is substantial for a niche hardware startup, materially lowering near-term survival
      risk.
    - >-
      Founder scarcity and Palmer Luckey’s hardware track record create real fundraising and awareness advantages
      relative to ordinary retro-hardware startups.
    - >-
      Distribution through both ModRetro’s own storefront and GameStop broadens visibility beyond a tiny collector-only
      channel.
  topRisks:
    - >-
      The market-reported ~$1B valuation is being asked before ModRetro discloses the revenue, margin, and
      working-capital bridge needed to support it.
    - >-
      M64 execution is now the key swing factor; a delayed or disappointing second launch would pressure both valuation
      and platform thesis.
    - >-
      Hardware economics, tariff exposure, inventory risk, and support burden make ModRetro much more like a
      physical-products company than a software business.
    - >-
      Founder controversy around Palmer Luckey and Anduril is already a real buyer and community objection, not a
      theoretical reputational risk.
    - >-
      Public customer proof is strong qualitatively but still lacks disclosed customer counts, retention, sell-through,
      and attach-rate evidence.
  unresolvedGaps:
    - >-
      Recognized revenue, gross margin, and attach economics by hardware, accessories, and cartridges remain
      undisclosed.
    - >-
      The exact final size, cap-table impact, and investor-rights structure of the 2026 financing are not fully visible
      publicly.
    - Current headcount, customer count, reorder behavior, and channel mix are not disclosed in reviewed public sources.
    - M64 launch sell-through, return rates, and support costs are still unproven until the product is fully in market.
    - >-
      Board composition, governance rights, and liquidation-stack detail remain only partially visible in public
      sources.
