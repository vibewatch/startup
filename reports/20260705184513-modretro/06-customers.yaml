- id: channels-community-and-attach-surfaces
  title: Channels, community surfaces, and the attach path after the first console sale
  body: 'The current channel map is narrow but legible. The base journey starts with ModRetro’s own starter bundle, spills into GameStop when exclusivity or stockouts matter, and then branches into much smaller niche surfaces such as Anduril Gear and Koss collaborations. That is enough to prove real channel diversity, but not enough to disprove dependence on a small number of surfaces. After the first purchase, the strongest public monetization story is attach rather than recurring-service revenue. ModRetro sells a Rechargeable Power Core and a Mod Kit, maintains a creator-facing call for new games, and has community proof that the launch bundle already extended beyond the console into six games with more promised. The named proof is still sparse but useful: a third-party creator publicly distributes a Chromatic demo and physical-copy path, a Trustpilot owner describes a battery-support interaction, and owners surface hardware-fit complaints in ModRetro’s own forum. Those examples prove
    the ecosystem is real, but they are still anecdotes, not scaled cohort data.'
