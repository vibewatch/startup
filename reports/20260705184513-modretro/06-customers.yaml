- id: TU005
  title: Expansion and concentration risk table
  columns:
  - expansion driver or risk
  - concentration / friction
  - impact
  - current evidence
  - diligence path
  rows:
  - - physical game cadence
    - Expansion depends on buyers returning for cartridges after hardware purchase
    - Could lift lifetime value if software cadence holds
    - Launch bundle, separate titles, and creator outreach are visible
    - Request attach rate by month and repeat purchase by owner cohort
  - - accessory upsells
    - Power Core, Mod Kit, and headphones add post-console monetization
    - Positive for LTV but also exposes support burden when accessories fail
    - Official accessory pages and partner bundle prove attach surface
    - Request accessory gross margin, defect rate, and repeat attach by SKU
  - - retail concentration
    - Publicly visible channels cluster around ModRetro DTC plus GameStop and a few niche partners
    - Retail disruption or partner underperformance could hit acquisition
    - GameStop exclusivity and TrackaLacker evidence suggest a narrow public channel map
    - Request sales mix by channel and retailer dependency terms
  - - reputation / controversy risk
    - Some prospective buyers openly refuse to buy because of Palmer Luckey or Anduril associations
    - Can cap expansion into broader audiences even if enthusiasts remain interested
    - AtariAge thread preserves explicit refusal-to-buy statements
    - Measure conversion loss or refund reasons linked to brand controversy
  - - policy friction
    - Warranty void for owner opening and strict return rules may irritate enthusiast owners
    - Could suppress satisfaction among repair-minded buyers
    - Support pages are clear but restrictive
    - Request return reasons, denial rates, and goodwill-credit practices
  notes: Rows separate monetization upside from the concentration or support frictions that could limit the upside.
