tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - segment
  - buyer / user / payer
  - public proof
  - revenue / strategic value
  - main gap
  rows:
  - - retro enthusiasts / collectors
    - Buyer, user, and payer usually appear to be the same hobbyist
    - Premium review framing, GameStop exclusivity, resale listings, and collector bundles
    - Core demand cohort for a $199.99–$299.99 single-purpose device
    - No public customer-count denominator
  - - gift / family nostalgia buyers
    - Adult payer, casual user or family household
    - ModRetro says all ages; MobileSyrup describes children using the device on a trip
    - Broadens TAM beyond purist collectors
    - No public conversion or holiday-gift mix
  - - indie developers / homebrew-adjacent creators
    - Developer is both builder and downstream customer / publisher partner
    - Create for the Chromatic call plus Chantey demo and physical-copy path
    - Could seed durable software attach and exclusives
    - No public creator-count or sales data
  - - modders / repair tinkerers
    - Buyer pays for console plus parts and tools
    - Mod Kit positioning plus public owner hardware-fit complaint
    - Supports accessory attach and community stickiness
    - Warranty terms discourage owner opening
  - - content creators / streamers
    - Buyer may be enthusiast or reviewer; user cares about capture workflow
    - Review coverage keeps highlighting USB-C capture and show-and-tell hardware appeal
    - Helps awareness and social proof
    - No public creator-program or affiliate data
  - - mass-market value shoppers
    - Buyer compares against multifunction handhelds or Analogue Pocket
    - XDA, CNET, and AtariAge all surface price or value objections
    - Important holdout segment because refusal-to-buy reasons are public
    - No quantified loss rate versus substitutes
  notes: Segments are inferred from public evidence rather than disclosed CRM cohorts; the rightmost column captures the missing denominator for each segment.
