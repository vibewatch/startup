  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-count
    missingEvidence: Audited or management-disclosed customer counts, sell-through totals, or active-device totals for Chromatic.
    whyItMatters: Demand is visible through stockouts and resale chatter, but without a denominator it is impossible to size the installed base or compare conversion efficiency against peers.
    diligencePath: Request sell-through by hardware SKU, cumulative units shipped, active support-ticket counts, and any internal active-device or firmware-update user totals.
    relatedQuestionRefs:
    - QU012
  - type: private-evidence-only
    severity: material
    topic: repeat-purchase-retention
    missingEvidence: Repeat-purchase rates for games and accessories, reorder curves, cohort behavior, and any attachment-rate reporting by SKU.
    whyItMatters: Public attach signals exist, but they do not tell us whether the catalog drives durable monetization after the console sale.
    diligencePath: Ask management for monthly attach rate by game and accessory, reorder rates by launch month, and any customer cohort tables used internally.
    relatedQuestionRefs:
    - QU011
    - QU025
  - type: private-evidence-only
    severity: material
    topic: channel-concentration
    missingEvidence: Gross merchandise volume or unit split across ModRetro DTC, GameStop, partner bundles, and international channels.
    whyItMatters: Public pages show the channel set but not the revenue concentration inside it, so distribution risk cannot be sized.
    diligencePath: Request 12-month sales mix by channel, retailer return rates, and any forward commitments or minimums tied to GameStop or partner bundles.
    relatedQuestionRefs:
    - QU026
  - type: private-evidence-only
    severity: material
    topic: customer-proof-depth
    missingEvidence: Named owner or creator references with repeat purchases, satisfaction surveys, and verified outcomes beyond one Trustpilot review and a few forum posts.
    whyItMatters: The public proof surfaces demonstrate real usage, but the sample is too thin to underwrite durability or mainstream satisfaction.
    diligencePath: Request anonymized support-resolution stats, creator royalty participation, and permission to speak with repeat buyers, accessory buyers, and at least one indie publishing partner.
    relatedQuestionRefs:
    - QU011
    - QU027
    relatedTableRefs:
    - TU003
