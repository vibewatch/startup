chapter:
  number: 6
  title: Customers
  summary: ModRetro’s customer evidence is strongest with retro-hardware enthusiasts, collectors, and creator-adjacent buyers who accept a premium single-purpose device in exchange for authenticity. Public demand signals are real—sellouts, restocks, resale activity, games, accessories, and community discussion—but retention, customer counts, and channel concentration remain undisclosed, so durability is still mostly a thesis rather than a measured fact.
sections:
- id: who-buys-and-why-demand-is-real
  title: Who buys Chromatic, and why the demand evidence is real but niche
  body: 'ModRetro’s public customer story looks strongest when framed as a niche-premium enthusiast business rather than a mass-market handheld launch. The evidence clusters around retro-hardware collectors, nostalgia-driven buyers, and hobbyists who will tolerate a $199.99 starting price because they care about authenticity, materials, and original-cartridge compatibility. Reviews repeatedly emphasize that the product feels premium and purpose-built, while ModRetro’s own creator outreach and modding accessories show it is also trying to cultivate creators and tinkerers instead of only passive collectors. Demand is visible in ways that matter even without disclosed unit counts: Android Police documented a full sellout across ModRetro’s own colors, Forbes later documented a restock after months sold out, and eBay / TrackaLacker surfaces show continued scarcity awareness. The catch is that every one of those signals is qualitative. They prove that people wanted the device and kept watching
    for it, but they do not reveal how many devices moved, which segment converts best, or whether demand broadens beyond the nostalgia-first audience.'
