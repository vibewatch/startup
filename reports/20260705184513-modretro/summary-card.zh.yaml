  topStrengths:
    - Chromatic 已经证明 ModRetro 能交付高端且口碑不错的硬件产品，而不只是拿怀旧概念图做营销。
    - 公司正靠卡带、配件和第二台主机拼出更宽的实体 IP 生态，而不是押注单一 SKU。
    - 以小众硬件创业公司而言，公开融资证据相当扎实，明显压低了短期生存风险。
    - 创始人稀缺性叠加 Palmer Luckey 的硬件履历，让 ModRetro 相比普通复古硬件公司更容易融资、也更容易被看见。
    - ModRetro 自有商城和 GameStop 同时铺货，把曝光面从小圈层收藏玩家拓宽到更大的零售渠道。
  topRisks:
    - 在 ModRetro 披露收入、毛利率和营运资金桥之前，市场传出的约 $1B 估值缺少可承接的基本面。
    - M64 执行现在是关键变量；第二次发布若延期或低于预期，估值和平台逻辑都会受压。
    - 硬件经济性、关税敞口、库存风险和售后负担决定了 ModRetro 更像实体产品公司，而不是软件公司。
    - 围绕 Palmer Luckey 和 Anduril 的创始人争议，已经是买家和社区的真实反对点，而不是理论上的声誉风险。
    - 公开客户证据在定性层面很强，但仍缺少客户数、留存、售罄率和附加购买率披露。
  unresolvedGaps:
    - 硬件、配件和卡带分项的确认收入、毛利率和附加购买经济性仍未披露。
    - 2026 年融资的最终规模、对股权结构的影响和投资人权利安排，公开信息仍看不全。
    - 当前员工数、客户数、复购行为和渠道结构，在已审阅公开来源中均未披露。
    - M64 上市后的售罄率、退货率和支持成本，要等产品完整进入市场后才能验证。
    - 董事会构成、治理权利和清算优先级细节，在公开来源中仍只露出一部分。
