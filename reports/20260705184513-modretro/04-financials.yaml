  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Recognized revenue, unit sell-through, channel mix, customer count, and any recurring-revenue components by month and by product family.
    whyItMatters: List prices and financing momentum cannot be converted into valuation multiples or revenue-quality judgments without a real top line and sell-through view.
    diligencePath: Request monthly management accounts, sell-in versus sell-through reporting, preorder conversion by cohort, and channel P&Ls for direct, retail, and wholesale sales.
    relatedQuestionRefs:
    - QI011
    - QI018
    - QI022
    relatedTableRefs:
    - TI001
    - TI005
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: Gross margin by Chromatic, accessories, cartridges, and M64; BOM, freight, duty, packaging, and reserve assumptions; and realized accessory and software attach rates.
    whyItMatters: Public peers prove that premium hardware margins can be decent but volatile, and public ModRetro pricing alone cannot reveal whether the company is actually scaling profitably.
    diligencePath: Request SKU-level gross-margin bridge, tooling amortization schedule, reserve policy, and margin waterfall from list price to contribution margin.
    relatedQuestionRefs:
    - QI012
    - QI013
    - QI014
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: runway-and-debt
    missingEvidence: Cash on hand, monthly burn, runway months, debt instruments, purchase-order financing, inventory commitments, and covenant or repayment schedules.
    whyItMatters: A $145.2 million sold amount materially lowers existential risk, but without a balance-sheet bridge an investor still cannot underwrite downside runway or refinancing dependence.
    diligencePath: Request the current balance sheet, 13-week cash forecast, debt schedule, supplier-payment terms, and downside cases under slower sell-through or higher tariffs.
    relatedQuestionRefs:
    - QI017
    - QI023
    - QI026
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: channel-economics
    missingEvidence: Retailer economics, wholesale discounting, return allowances, chargebacks, co-op marketing spend, and support or warranty costs by channel.
    whyItMatters: Hardware businesses can look attractive on direct list price and still lose meaningful economics once retail mix, returns, and after-sale obligations are layered in.
    diligencePath: Request channel contracts, gross-to-net bridges, return rates, warranty reserve roll-forward, and customer-support cost per shipped unit.
    relatedQuestionRefs:
    - QI018
    - QI020
    - QI024
    - QI025
    relatedTableRefs:
    - TI001
    - TI003
    - TI005
  - type: conflicting-data
    severity: material
    topic: funding-bridge
    missingEvidence: A management-confirmed financing chronology that reconciles the SEC Form D, Forge round labels and amounts, and the market-reported valuation narrative into one cap-table history.
    whyItMatters: The public record clearly supports substantial financing, but not a clean round-by-round bridge for dilution, governance, or preferred-stack analysis.
    diligencePath: Request signed financing documents, post-close cap table, board rights summary, and a round bridge from seed through the 2026 raise.
    relatedQuestionRefs:
    - QI006
    - QI009
    - QI010
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: service-and-repair
    missingEvidence: Warranty claim rates, spare-parts planning, repair turnaround data, calibration labor assumptions, and reserve accounting for hardware support.
    whyItMatters: Repair-friendly premium devices can still consume meaningful cash and margin through spare parts, labor, and replacement inventory if support assumptions are too optimistic.
    diligencePath: Request warranty reserve methodology, historical RMA or defect data, spare-parts BOM, and service-cost assumptions for Chromatic and M64.
    relatedQuestionRefs:
    - QI019
    - QI024
    - QI025
    relatedTableRefs:
    - TI003
    - TI005
