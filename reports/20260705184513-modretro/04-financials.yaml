- id: TI003
  title: Unit Economics Table
  columns:
  - Metric
  - Public value / proxy
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Recognized revenue / ARR
    - null
    - Low
    - Without a top line, valuation and margin math cannot be grounded in actual scale
    - Provide monthly revenue, trailing-twelve-month revenue, and any recurring-revenue components
  - - Gross margin
    - null
    - Low
    - Gross margin determines whether premium pricing is actually overcoming hardware COGS and channel friction
    - Provide gross margin by Chromatic, accessories, cartridges, and M64 preorders
  - - Hardware margin proxy band
    - 28.4% to 40.8% peer segment range; Nintendo blended gross margin fell to 39.3% in hardware-heavy year
    - Medium
    - Public peers show premium hardware economics can be decent but still far below software-style margins and highly mix-sensitive
    - Bridge ModRetro BOM, tooling amortization, logistics, and return reserves to unit contribution
  - - Inventory / obsolescence risk
    - Nintendo inventories 486.4bn yen with write-downs on raw materials and finished goods
    - Medium
    - Physical hardware and boxed software can strand capital if demand misfires or revisions arrive quickly
    - Provide inventory by SKU family, ageing, and write-down policy
  - - Tariff / component cost sensitivity
    - Nintendo forecasts ~100bn yen cost impact; Corsair and Hasbro both cite tariff headwinds
    - Medium
    - A premium niche console can lose margin quickly if chip, assembly, or logistics costs move
    - Share sourcing map, tariff exposure, and mitigation assumptions by region
  - - Cash / runway
    - null
    - Low
    - A large raise is not the same as healthy runway if tooling and inventory consume cash ahead of sell-through
    - Provide cash, monthly burn, purchase commitments, and runway under base and downside cases
  - - Support / repair burden
    - Repair-friendly design and swappable parts imply ongoing spare-parts, calibration, and support workflows
    - Low
    - After-sale complexity can erode gross profit and customer satisfaction if reserves are too light
    - Provide warranty claim rate, spare-parts inventory, and support cost per active device
  notes: Nulls indicate metrics the public record does not disclose; proxy values are explicitly marked as peer or inferred reference points rather than ModRetro-reported results.
