- id: TI005
  title: Public Financial Gaps Table
  columns:
  - Missing metric / evidence
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Recognized revenue, units sold, and sell-through by SKU and channel
    - Without sell-through and revenue recognition detail, list prices cannot be converted into demand quality or valuation multiples
    - Request monthly P&L, sell-in versus sell-through reports, preorder conversion, and channel mix by product family
  - - Gross margin by hardware, accessories, and cartridges
    - The central question is whether premium pricing offsets hardware costs, tariffs, and support burden
    - Request BOM summary, freight and duty assumptions, reserve policy, and margin bridge by SKU
  - - Cash on hand, burn, runway, and debt or PO financing
    - The 2026 raise does not by itself show how long the company can fund launches and inventory
    - Request balance sheet, cash bridge, debt instruments, vendor commitments, and downside runway model
  - - Inventory ageing, write-down policy, and spare-parts reserves
    - Physical hardware risk often appears first in inventory and reserve accounts
    - Request inventory ledger by age, provisioning policy, warranty reserve roll-forward, and spare-parts plan
  - - Retailer economics and returns
    - A direct-to-consumer story can look attractive until wholesale discounts, chargebacks, and return rates are layered in
    - Request GameStop and other channel terms, co-op marketing spend, return allowances, and warranty handling
  - - Cap-table and round-structure reconciliation
    - SEC, Forge, and market narratives do not resolve perfectly into one simple round history
    - Request signed financing docs, investor roster, preferred-stock terms, and board-rights summary
  notes: Every row is a missing item that materially changes a financial underwriting decision; the table is intentionally specific so management can answer with documents rather than narrative.
