- id: unit-economics-proxies-and-margin-realities
  title: Unit-Economics Proxies and Margin Realities
  body: 'ModRetro discloses almost none of the classic unit-economics stack directly, so peer hardware disclosures are the only disciplined public proxy. Nintendo''s filings show how fast margin can compress when hardware mix rises: its gross profit ratio fell from 61.0% to 39.3% when lower-margin Switch 2 hardware became a much larger share of sales, and its inventory base carried meaningful raw-material and finished-goods write-downs. Corsair, a better proxy for premium enthusiast hardware and accessories, posted company gross margin of 32.7% in Q1 2026, about 40.8% implied gross margin in peripherals, and 28.4% in components and systems, while still warning about tariff headwinds, semiconductor constraints, and demand pressure from elevated pricing. Hasbro''s consumer-products segment adds another reality check: incremental tariff expense can still push a physical-products business into operating loss even when the broader company is growing.


    Those proxies suggest ModRetro should be underwritten as a real hardware company, not as a software business wearing a retro brand. Physical-media cartridges, metal enclosures, custom displays, controllers, rechargeable packs, warehousing, and after-sale support all push the model toward inventory and service complexity. ModRetro''s own M64 materials emphasize repair-friendly design, swappable controller parts, and physical-boxed software, which are strengths for the brand but also clues that tooling, parts management, warranty handling, and replacement inventory will matter. Public evidence therefore supports a plausible premium-hardware gross margin path, but not a software-like one, and certainly not a conclusion that the company can scale without working-capital shocks.'
