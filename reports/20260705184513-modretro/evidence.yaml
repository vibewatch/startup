evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: funding-history
    missingEvidence: >-
      Executed financing documents or a management-confirmed cap table that reconciles the March-May 2026 round
      structure, closing amount, and post-money valuation.
    whyItMatters: >-
      The public record supports a large financing but does not cleanly reconcile the exact size or total capital
      raised, which affects dilution and valuation framing.
    diligencePath: >-
      Request signed financing documents, post-close investor roster, and a cap-table bridge from the 2024 seed through
      the 2026 round.
    relatedQuestionRefs:
      - QO009
      - QO010
      - QO011
      - QO012
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Current revenue, ARR, gross margin, headcount, customer count, and sell-through data by product and channel.
    whyItMatters: >-
      Without operating metrics, the company overview can show execution quality and funding momentum but cannot
      independently underwrite unit economics or enterprise value.
    diligencePath: Request board decks, monthly KPI packs, audited financial statements, and current org/headcount snapshots.
    relatedQuestionRefs:
      - QO013
      - QO014
      - QO025
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Board composition, observer rights, liquidation preferences, and voting/control arrangements after the 2026
      financing.
    whyItMatters: >-
      Founder dependence and investor control are core diligence questions for a premium-hardware company scaling beyond
      its first product.
    diligencePath: >-
      Request the board roster, shareholder agreements, voting agreements, and the latest financing term sheet or
      definitive docs.
    relatedQuestionRefs:
      - QO023
      - QO025
    relatedTableRefs:
      - TO003
      - TO002
  - type: missing-source
    severity: minor
    topic: footprint
    missingEvidence: >-
      An official public corporate page that states headquarters, warehouse, and primary operating footprint in one
      place.
    whyItMatters: >-
      Current location evidence comes from filing-oriented databases and shipping language rather than from an explicit
      official company profile page.
    diligencePath: >-
      Request a formal company overview deck or official legal page that reconciles mailing address, warehouse location,
      and principal place of business.
    relatedQuestionRefs:
      - QO007
      - QO025
  - type: missing-source
    severity: material
    topic: retro-tam
    missingEvidence: >-
      Observed annual unit sales, installed base, and category revenue for premium retro-preservation handhelds and
      consoles.
    whyItMatters: >-
      Broad gaming and console reports are too large to underwrite ModRetro’s real serviceable market without a
      defensible niche denominator.
    diligencePath: >-
      Request sell-through, channel sell-in, preorder, and attach-rate data from ModRetro management and any major
      retail partners; triangulate with competitor restock cadence and cartridge sell-outs.
    relatedQuestionRefs:
      - QM011
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: controversy-elasticity
    missingEvidence: >-
      Quantified evidence on whether founder or Anduril associations reduce conversion, repeat purchase, or retailer
      willingness to stock product.
    whyItMatters: Public commentary shows buyer objection, but underwriting needs actual conversion impact rather than anecdote.
    diligencePath: >-
      Ask management for survey data, refund reasons, channel feedback, and campaign-level conversion splits before and
      after controversy-linked announcements.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: material
    topic: attach-rates
    missingEvidence: Observed cartridge, accessory, and software attach rates for Chromatic and any M64 preorder cohorts.
    whyItMatters: >-
      The ecosystem thesis matters more than hardware gross profit if ModRetro’s niche TAM is only tens of millions of
      dollars annually.
    diligencePath: >-
      Request cohort-level basket data, repeat-purchase rates, and margin by hardware versus cartridges/accessories from
      ModRetro finance and commerce teams.
    relatedQuestionRefs:
      - QM025
  - type: private-evidence-only
    severity: minor
    topic: tariff-exposure
    missingEvidence: Company-specific country-of-origin, assembly, and tariff pass-through assumptions for Chromatic and M64.
    whyItMatters: >-
      Industry headlines prove the risk exists, but ModRetro’s actual BOM sensitivity could be better or worse than
      Nintendo’s.
    diligencePath: >-
      Request supplier map, BOM concentration, and pricing committee memos covering tariff scenarios and inventory
      already in U.S. warehouses.
    relatedQuestionRefs:
      - QM020
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: material
    topic: channel-mix
    missingEvidence: Direct versus GameStop sell-through, repeat purchase, and attach-rate data by channel.
    whyItMatters: >-
      Retail presence is part of the ModRetro wedge, but public sources do not show whether that channel broadens the
      market or just adds merchandising optics.
    diligencePath: >-
      Request channel mix, reorder cadence, and conversion metrics for GameStop-exclusive Chromatic inventory versus
      direct web sales.
    relatedQuestionRefs:
      - QP017
    relatedTableRefs:
      - TP004
      - TP005
  - type: private-evidence-only
    severity: material
    topic: win-loss-data
    missingEvidence: >-
      Competitive win-loss studies, customer surveys, and unit-share or installed-base estimates versus Analogue,
      Evercade, Nintendo, and emulation substitutes.
