- id: openness-firmware-and-developer-posture
  title: Openness, firmware, and developer posture
  body: 'ModRetro''s open-source posture is strongest on Chromatic and still provisional on M64. On the shipped handheld, the company has released both FPGA and MCU repositories, documented community flashing routes, and left enough room for independent developers to build side workflows like cartridge dumping. That is materially better than a pure walled garden, and it gives the product a credible developer-signal surface for this chapter. But the openness is not frictionless. The toolchain remains Gowin-specific, the build instructions are opinionated, and the community reuse example still reads as “works, but not friendly.” Reviewers also keep pointing out that ModRetro''s public messaging about Chromatic underplayed the MiSTer lineage that made the release possible. M64 is more ambitious. Official and independent coverage align that the console is meant to use Robert Peip''s MiSTer-derived N64 core, that ModRetro is committing code upstream, and that the hardware is being designed as
    a stronger generalized home for open FPGA activity than DE10-Nano-class gear. However, the actual M64 repository is not public yet. That creates the central roadmap tension of the chapter: ModRetro is saying many of the right things and has a better prior record than Analogue on openness, but the M64 open-source thesis is still a promise backed by interviews and blog posts rather than by a delivered public repo.'
