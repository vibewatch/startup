  evidenceGaps:
  - type: missing-source
    severity: material
    topic: chromatic-wireless-feature-clarity
    missingEvidence: An official explanation of whether Chromatic's radio hardware and microSD-adjacent pads are for future user features, service workflows, or permanently unused design headroom.
    whyItMatters: Without a first-party explanation, the chapter can only say the hardware appears in filings and teardown-style reviews, not what customers should expect from it.
    diligencePath: Ask ModRetro product or firmware leadership for a board-level explanation and whether any wireless or storage-facing features are planned, disabled, or reserved for service.
    relatedQuestionRefs:
    - QE013
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: m64-open-source-delivery
    missingEvidence: A public M64 hardware or FPGA/core repository with license text, build instructions, and visible commit history.
    whyItMatters: The open-source thesis is one of the main reasons M64 could differentiate from more closed FPGA competitors, but today it is still promise-backed rather than artifact-backed.
    diligencePath: Monitor ModRetro's GitHub organization around launch and ask management for the exact repo, license, and publication timing they intend to use.
    relatedQuestionRefs:
    - QE021
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: material
    topic: m64-price-finalization
    missingEvidence: An official M64 launch post or product page that clearly lists the final console SKU, controller bundle, and accessory pricing.
    whyItMatters: Public third-party reporting currently disagrees on whether the relevant number is a $199 early-bird entry point or a $229.99 controller-included launch bundle.
    diligencePath: Re-check the official M64 storefront and launch posts at release and ask management to confirm final MSRP, early-bird rules, and controller attachment pricing.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: material
    topic: m64-independent-validation
    missingEvidence: Independent hands-on reviews or benchmarks covering M64 latency, compatibility edge cases, thermal behavior, and long-session stability on near-final hardware.
    whyItMatters: Official technical transparency is valuable, but the underwriting question is whether outside reviewers reproduce the claimed accuracy and experience under real use.
    diligencePath: Track first-wave reviewer coverage after units ship and request direct evidence on latency, per-game edge cases, thermals, and controller behavior under sustained play.
