- id: FE001
  title: Product architecture map
  type: stack
  layout: wide
  summary: ModRetro's product stack layers industrial design and original-media workflows on top of MiSTer-derived logic, company-controlled firmware paths, and increasingly custom console hardware.
  data:
    layers:
    - label: User-facing experience
      detail: Chromatic handheld workflow today; M64 couch-console workflow next, each centered on original cartridges and low-friction boot-to-play usage.
    - label: Accessory and control layer
      detail: Link cable, IR, capture workflow, and for M64 a trident controller with TMR sticks plus wired and wireless paths.
    - label: Display and output layer
      detail: Chromatic custom 160x144 handheld display; M64 HDMI-first living-room output with CRT adapter work in progress.
    - label: Core execution layer
      detail: Chromatic FPGA recreation of GB/GBC logic and M64 FPGA recreation of N64 behavior.
    - label: Memory and board architecture
      detail: Chromatic GW5A-25-era handheld board design; M64 Artix UltraScale+ with low-latency PSRAM and custom PCBA priorities.
    - label: Firmware and toolchain layer
      detail: Public updater surface, released GitHub repos, Gowin-dependent build flow, and post-ship firmware iteration.
