  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: hts-and-origin-stack
    missingEvidence: SKU-level manufacturing origin, HTS classifications, customs rulings, and actual duty incidence for Chromatic, M64, controllers, and Power Core accessories.
    whyItMatters: Without exact origin and tariff-code mapping, the public trade-regime evidence proves directional risk but cannot quantify landed-cost compression or price sensitivity by SKU.
    diligencePath: Request customs-broker memos, current HTS classifications, declared countries of origin, and landed-cost waterfalls for each major hardware and accessory SKU.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: commercial-ip-clearance
    missingEvidence: Any outside-counsel opinion, internal compliance memo, or rights-holder communication covering cartridge compatibility, controller likeness, open-core distribution, or adjacent tooling boundaries.
    whyItMatters: Public law and enforcement precedent show the perimeter is real, but only internal legal work can demonstrate whether ModRetro is comfortably inside it.
    diligencePath: Request counsel memorandum, open legal issues tracker, and product-signoff process for any compatibility, firmware, or developer-facing release touching copyright or circumvention boundaries.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: m64-launch-volume-and-policy
    missingEvidence: First-run M64 production quantity, channel allocation, sell-through assumptions, and final refund or exchange terms for launch buyers.
    whyItMatters: The launch is the core valuation bridge, yet public materials still leave volume and buyer-remedy terms too vague to underwrite downside in a miss scenario.
    diligencePath: Request launch allocation plan, units available on day one, replenishment timing, return and exchange policy, and post-launch customer-service staffing assumptions.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR003
    - TR005
  - type: private-evidence-only
    severity: material
    topic: controversy-conversion-effect
    missingEvidence: Any measured funnel data showing how founder-related controversy affects paid conversion, channel acceptance, or review sentiment outside the core enthusiast base.
    whyItMatters: The public backlash evidence proves the risk exists, but without funnel or channel data investors cannot size how much TAM is lost versus simply noisier discourse.
    diligencePath: Ask for brand-lift studies, ad conversion by creative that suppresses founder identity, retailer feedback, and any cohort or survey data on purchase refusal reasons.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR004
  - type: private-evidence-only
    severity: material
    topic: support-and-reserve-metrics
