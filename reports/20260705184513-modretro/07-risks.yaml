- id: reliability-support-and-serviceability-risk
  title: Public reliability signals are manageable, but battery, firmware, and serviceability friction are persistent
  body: 'The best argument against a catastrophic product-quality thesis is that ModRetro’s known issues are narrow and often remediated through firmware. The worst argument against a frictionless premium-hardware thesis is that the same public support surfaces keep returning to batteries, firmware, and edge-case bugs. The known-issues page documents battery meter quirks, backlight flicker on depleted cells, kernel-panic escalation, game-save troubleshooting, and updater failures; the bug page explicitly sends owners through self-service and firmware before human support; and MR Updater plus Cart Clinic turn software tooling into a core part of ownership. That is workable for enthusiasts, but it raises support-scaling risk if the owner base broadens. The hardware side also has visible rough edges. ModRetro warns that dead Power Cores can become unrecoverable in first-edition units, a forum user complained about a loose volume wheel, and an Old School Gamer writer described a battery leak
    that killed console audio until ModRetro replaced the device. Even the positive Trustpilot anecdote is double-edged: it shows good customer care, but it also begins with a battery charging failure. The conclusion is not that Chromatic is broken; it is that ModRetro still looks like a live hardware platform with nontrivial reserve, support, and owner-convenience risk.'
