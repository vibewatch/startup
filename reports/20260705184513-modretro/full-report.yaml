      - number: '1.4'
        title: Milestones, distribution, and adverse signals
        blocks:
          - type: paragraph
            body: >-
              ModRetro has moved quickly from nostalgia concept to operating brand. XDA captured the June 2024
              announcement and holiday launch window for the Chromatic, Observer places the first product release in
              2024, and The Verge documented a July 2025 permanent restock that widened colors, accessories, and
              cartridge selection while preserving the $199.99 entry price. The M64 update then shows a second device
              already far enough along for warehousing and a dated July 2026 shipment target. Distribution also looks
              broader than a boutique collector drop because sources repeatedly mention both ModRetro’s own storefront
              and GameStop. The clearest negative signal is reputational, not hardware-related. Reviews broadly praise
              the Chromatic’s build quality and authenticity, but The Verge and Kotaku argue that the company’s
              proximity to Anduril and to Luckey’s politics is an active buyer objection, not a footnote. For
              company-overview purposes, that means ModRetro already has enough real product execution to matter, but
              also enough founder-brand baggage to affect both consumer adoption and the marginal investor base.
