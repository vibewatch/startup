      - number: '7.4'
        title: Founder controversy and concentrated execution narrow the error budget
        blocks:
          - type: paragraph
            body: >-
              ModRetro’s founder advantage and founder risk are the same variable. Palmer Luckey gives the company press
              oxygen, a fundraising story, and a clear product philosophy. He also ensures that every product discussion
              can become a politics or defense-tech discussion. Yahoo Tech revisits his Facebook firing and pro-Trump
              donations, Cybernews highlights his willingness to defend AI life-and-death decisions in war, and a
              ResetEra backlash thread shows that at least some public sentiment treats Luckey himself as a reason to
              reject associated products. TechCrunch made the same point more politely by quoting a review that asked
              whether buyers would purchase a Game Boy made by Lockheed Martin. For a mass-market brand this would be
              bad optics; for a niche premium retro brand it is a measurable TAM constraint. It does not stop the
              company from shipping to committed enthusiasts, but it raises the burden on product quality, channel
              trust, and value-for-money because the founder profile already filters out some portion of the addressable
              audience. That is why the right monitoring framework is not generic “execution risk.” It is concentration
              risk: one founder, one still-maturing hardware platform, one high-visibility next launch, and a valuation
              story that leaves less room for operational surprises.
