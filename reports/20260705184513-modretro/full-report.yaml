  - id: TV006
    title: Final Diligence Asks Table
    columns:
      - Ask
      - Missing evidence
      - Why it matters
      - Diligence path
    rows:
      - - Revenue by product family
        - Recognized revenue split across Chromatic hardware, accessories, cartridges, and M64 preorders or shipments
        - Needed to map the company to any real comp band.
        - Request monthly revenue bridge and channel mix under NDA.
      - - Gross margin and support burden
        - Gross margin by hardware, accessories, and software plus warranty and return reserves
        - Premium hardware only deserves premium multiples if unit economics are real.
        - Request SKU-level margin waterfall and reserve history.
      - - Sell-through and attach
        - Chromatic installed base, cartridge attach, accessory attach, and M64 preorder conversion
        - Needed to know whether ModRetro is becoming a platform or staying a one-box business.
        - Request cohort tables for first and repeat purchases.
      - - Cash, burn, and inventory commitments
        - Cash on hand, monthly burn, purchase commitments, tooling, and inventory financing
        - Working-capital stress can erase equity upside quickly in hardware.
        - Request board or lender package covering cash runway and purchase orders.
      - - 2026 financing terms
        - Full term sheet, liquidation stack, pro-rata terms, secondary mix, and major investor rights
        - Headline valuation is not enough without economic context.
        - Review financing documents and cap table.
      - - Launch-quality telemetry
        - M64 allocation, return policy, defect rates, support tickets, and reviewer-to-customer conversion
        - Needed to judge whether the second platform validates or weakens the premium thesis.
        - Request launch dashboard for the first 90 days after ship date.
    notes: >-
      Until these asks are answered, valuation work should remain scenario-based and medium-confidence rather than
      conviction underwriting.
