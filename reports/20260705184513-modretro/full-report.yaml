      - number: '3.3'
        title: Substitutes, distribution, and collector stacks
        blocks:
          - type: paragraph
            body: >-
              The biggest mistake would be to analyze ModRetro only against other shiny FPGA boxes. Many buyers can
              satisfy the same retro-gaming job without ever entering ModRetro’s ecosystem. Nintendo offers the
              lowest-friction family option because the buyer may already own a Switch and can add classic libraries
              with minimal incremental spend. Miyoo and Anbernic-style devices attract a different user psychology: they
              trade authenticity for breadth, custom firmware, Wi-Fi features, and a ROM-and-SD-card workflow that lets
              hobbyists do far more for far less money. Original-hardware enthusiasts have yet another path. Lukie’s
              refurbished N64 listing shows that legacy hardware is still sold as a working bundle, while EverDrive64
              and FunnyPlaying’s FPGBC kit show how collectors can modernize or consolidate their setup without buying
              ModRetro hardware at all. GameStop distribution helps ModRetro look less boutique than some rivals, but
              distribution alone does not erase those substitute ladders. The collector ecosystem is fragmented, and
              much of it is already served by retailers, mod-kit vendors, flash-cart sellers, and subscription platforms
              that capture either the budget buyer or the deep tinkerer before ModRetro does.
