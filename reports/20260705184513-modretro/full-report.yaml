      - number: '6.4'
        title: Customer durability is still unproven, and brand / channel concentration remain the key risks
        blocks:
          - type: paragraph
            body: >-
              The hard part of the customer chapter is not proving that Chromatic has buyers; it is proving that those
              buyers will remain durable enough to support a repeat-purchase thesis. Public evidence clearly shows
              demand, real owners, creator participation, and attach surfaces, but it stops short of the metrics an
              investor would actually want. There is no audited customer count, no active-device base, no public NRR /
              GRR / churn equivalent, and no channel mix disclosure that would size GameStop versus ModRetro direct.
              That means repeat-purchase logic is still mostly thesis-driven: if games keep coming and accessories stay
              useful, collectors may spend again. The adverse evidence also matters. Some prospective buyers publicly
              refuse to purchase because of Palmer Luckey / Anduril politics, and others say the device is lower value
              than the Analogue Pocket. Combined with strict return and warranty terms, that suggests the business is
              resilient with enthusiasts but may have a ceiling with broader audiences. The chapter therefore lands on a
              clear judgment: customer enthusiasm is real, but customer durability is not yet publicly measured.
