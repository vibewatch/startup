            title: Real market, niche denominator
            body: >-
              Public evidence supports a real premium retro-hardware market, but the defensible public TAM looks closer
              to tens of millions of dollars annually in the U.S. than to any headline global gaming figure.
            calloutType: insight
            claimRefs:
