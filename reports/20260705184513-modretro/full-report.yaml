      - number: '3.2'
        title: Pricing and capability tradeoffs
        blocks:
          - type: paragraph
            body: >-
              Chromatic’s current headline pricing is strategically important because it looks expensive versus
              convenience substitutes but still defensible against the most premium direct peer. ModRetro’s own store
              and GameSpot’s retailer coverage put Chromatic at $199.99 with Tetris included. That sits below the 2026
              Analogue Pocket price hike reported by Engadget and Android Authority, but well above Evercade’s roughly
              $129.99 2025 EXP-R and VS-R refreshes, the approximate $104.34 refurbished N64 bundle visible at Lukie
              Games, and Nintendo’s official claim that a shared Switch Online + Expansion Pack family plan can work out
              to about $10 per person annually. Capability packaging matters just as much. Pocket is broader, with
              multi-system adapters, Dock support, and openFPGA. Evercade is cheaper and licensed, but makes hardware
              and pack-in trade-offs. Nintendo is dramatically cheaper on a first-year basis, but provides access rather
              than ownership. Emulation handhelds go broader still through firmware and ROM workflows, albeit with much
              weaker cartridge-authenticity cues. ModRetro therefore wins the cleanest economic story only inside a
              buyer segment that values premium physical fidelity enough to pay more than the low-friction alternatives.
