      - number: '8.4'
        title: Final Diligence Asks, Exit Discipline, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              The missing information is not cosmetic; it is the difference between a plausible premium and an
              underwritten one. No reviewed public source discloses ModRetro's recognized revenue, product-family gross
              margin, preorder conversion, warranty reserve, cash balance, burn, inventory commitments, or customer
              concentration. Forge exposes only a thin slice of round mechanics, and even that does not answer how much
              liquidation protection, secondary, or pro-rata behavior sits behind the broader financing story. Public
              investors therefore cannot tell whether the current mark is being supported by real unit economics or
              simply by appetite for a charismatic serial founder and a scarce private asset.


              That also means exit posture has to stay conservative. There is no public basis for underwriting near-term
              IPO readiness when the flagship filing still says "No Revenues" and the operating bridge remains private.
              The supportable hold logic is continued private execution through M64 launch, demonstrated sell-through,
              and a future KPI pack that reconciles revenue, margin, and working-capital intensity. The thesis breaks if
              launch timing slips materially, if cartridge and controller attach fail to deepen monetization, if return
              or support costs overwhelm premium pricing, or if a future round reveals investor-protection terms that
              make the headline valuation less meaningful than it appears.
            claimRefs:
              - CV002
              - CV011
              - CV019
              - CV021
              - CV044
              - CV045
              - CV046
              - CV054
              - CV055
          - type: table
            tableRef: TV006
            claimRefs:
              - CV011
              - CV017
              - CV019
              - CV021
              - CV044
              - CV045
              - CV054
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The mark is believable as a private-market event, not as a public-market proof point
            body: >-
              Public documents and reporting make the financing story real. The valuation debate is about what revenue
              quality eventually sits underneath it, and that part is still mostly private.
            calloutType: insight
            claimRefs:
              - CV003
              - CV008
              - CV012
              - CV044
              - CV046
          - type: callout
            title: Current pricing already consumes a lot of optionality
            body: >-
              At a roughly $1B headline, ModRetro does not have much room for a narrow-M64 outcome, weak attach, or a
              future round that reveals heavier downside protection than the headline implies.
            calloutType: risk
            claimRefs:
              - CV011
