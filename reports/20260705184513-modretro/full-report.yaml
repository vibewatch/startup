      - number: '3.5'
        title: How competition changes the investability story
        blocks:
          - type: paragraph
            body: >-
              Competition cuts the ModRetro story in two directions. On the positive side, the company is not inventing
              demand from nothing. Analogue’s success, Evercade’s continued cartridge business, used-original-hardware
              resale, and Nintendo’s constant expansion of classic libraries all prove that retro gaming still commands
              real consumer attention and willingness to pay. That makes ModRetro’s niche more credible than a pure
              vanity-hardware story. On the negative side, the same evidence says the niche is already served from every
              angle: premium preservation, cheaper licensed cartridges, ultra-cheap subscription access,
              community-firmware emulation, and do-it-yourself original-hardware upgrades. M64 also shortens ModRetro’s
              runway for narrative grace because it now has to face Analogue 3D and original-N64 substitute stacks
              directly before launch reviews and sell-through are public. Add founder-brand controversy, which already
              caused one retro outlet to stop covering the company altogether, and competition makes ModRetro look
              investable only if management can privately prove sell-through, repeat cartridge attach, and competitive
              win rates that public evidence does not yet show.
