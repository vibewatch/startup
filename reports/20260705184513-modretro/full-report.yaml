  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Chromatic’s public customer path runs from nostalgia-driven discovery into a premium first purchase, then branches
      into games, accessories, support, or resale depending on buyer type.
    data:
      nodes:
        - id: j1
          label: Discover through nostalgia and reviews
          detail: >-
            Collectors and comparison shoppers most often encounter Chromatic via premium-review coverage or scarcity
            talk.
        - id: j2
          label: Choose a channel
          detail: Buyers usually pick between ModRetro DTC, GameStop exclusivity, or niche partner bundles.
        - id: j3
          label: Start with hardware plus Tetris
          detail: The product is sold as a premium starter bundle rather than a bare hardware shell.
        - id: j4
          label: Branch into attach purchases
          detail: >-
            Collectors buy games; tinkerers buy Mod Kits; convenience buyers consider the Power Core; collab buyers add
            Koss bundles.
        - id: j5
          label: Use support and firmware path
          detail: Owners encountering bugs are directed through known issues, firmware updates, and contact support.
        - id: j6
          label: Signal demand back to market
          detail: Some users leave forum posts or reviews, while scarcity pushes others into resale or restock-alert channels.
