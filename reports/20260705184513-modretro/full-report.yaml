      - number: '2.3'
        title: Buyer segments and willingness to pay
        blocks:
          - type: paragraph
            body: >-
              The buyer map is not one monolithic “retro gamer.” Collector-preservationists value original cartridges,
              display accuracy, controller feel, and the symbolic act of owning dedicated hardware, so they are the
              segment most willing to pay premium ASPs. A second segment is the adult nostalgia handheld buyer who wants
              a better modern daily-play device and can rationalize a $200 purchase if the hardware feels premium
              enough; The Verge’s Chromatic review suggests that high build quality can meaningfully support this
              segment. A third segment is households or gift purchasers, where the end user may be a child or shared
              family audience and the real budget owner cares more about ease, durability, and recognizability than
              transistor-level authenticity. On the other side of the map sit value-first tinkerers, who can buy a $70
              Anbernic device or a $199 Android emulation handheld and accept higher setup friction in exchange for
              broader software flexibility. Evercade proves there is also a middle segment that wants physical
              cartridges but not necessarily ModRetro-level premium hardware. This substitute ladder implies that
              ModRetro’s willingness-to-pay ceiling is real, but it lives in an enthusiast and design-conscious niche,
              not a mainstream budget pool.
            claimRefs:
