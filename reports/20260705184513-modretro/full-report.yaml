  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: wide
    summary: >-
      The intended customer workflow is simple: insert original media, boot fast, optionally capture or update firmware,
      and stay inside a deliberately narrow hardware experience.
    data:
      nodes:
        - id: w1
          label: Insert original cartridge
          detail: User starts from physical GB/GBC or N64 media instead of ROM-library browsing.
        - id: w2
          label: Boot dedicated hardware
          detail: Chromatic or M64 powers straight into a focused platform rather than a multi-system menu stack.
        - id: w3
          label: Play with original-style I/O
          detail: Buttons, link workflows, controller ports, and cartridge behavior stay close to legacy usage patterns.
        - id: w4
          label: Capture or connect extras
          detail: Chromatic USB capture path or M64 accessory / controller permutations extend the core play loop.
        - id: w5
          label: Update firmware when needed
          detail: Official updater and ongoing post-ship firmware work keep the platforms evolving.
        - id: w6
          label: Stay inside curated scope
          detail: Users get authenticity and low latency, but sacrifice broader system flexibility and open-ended expansion.
      edges:
