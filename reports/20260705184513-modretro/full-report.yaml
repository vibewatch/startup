      - number: '7.3'
        title: External rule stacks can squeeze margin, repair posture, and compatibility freedom at the same time
        blocks:
          - type: paragraph
            body: >-
              The most important adverse risk cluster is external rather than internal. ModRetro is selling small-batch
              premium hardware into a 2025–2026 environment where China-linked tariff exposure, de minimis suspension,
              right-to-repair scrutiny, and live DMCA anti-circumvention rules all matter at once. CBP and USTR make
              clear that importers need the correct HTS classification to know whether Section 301 duties apply and at
              what rate. White House and Federal Register orders show that low-value shipments lost broad de minimis
              shelter, which raises both duty incidence and customs-process friction for accessories and spare parts. At
              the same time, FTC guidance says warranty coverage generally cannot be conditioned on authorized parts or
              service alone, even as ModRetro’s own policy tells owners not to open the shell. Finally, the DMCA stack
              remains real: Cornell, the Copyright Office, and the 2024 exemption rule all frame Section 1201 as a
              narrow-exemption regime, not a blanket commercial safe harbor, while Nintendo’s Yuzu case demonstrates how
              quickly a compatibility-adjacent ecosystem can attract high-cost enforcement. None of this proves ModRetro
              is in breach today. It does prove that legal and regulatory slippage would be expensive, fast-moving, and
              difficult to contain after the fact.
