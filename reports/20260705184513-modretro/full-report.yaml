      - number: '8.2'
        title: 'Comparable Framework: Hardware Floor, Collector Compression, and Platform Ceiling'
        blocks:
          - type: paragraph
            body: >-
              The comp set has to start with what ModRetro visibly is today: a premium physical-products company selling
              FPGA hardware, accessories, cartridges, and now a second console plus controller ecosystem. Official M64
              materials show a real attempt to widen the monetization stack with four launch titles, physical-boxed
              software, and directly funded new games. Reviews also show that the products are good enough to earn
              enthusiasm. But the same reviews are explicit that ModRetro is charging enthusiast pricing for a
              deliberately narrow experience. Digital Trends calls Chromatic expensive and feature-light versus
              similarly priced alternatives, while The Verge says the handheld may be the best Game Boy remake ever made
              but still wraps the product in founder baggage.


              That mix points to public comparables that are much closer to Corsair, Logitech, Hasbro, Funko, and
              selective retail/collectibles references than to software or marketplace names. Corsair's 2026 results
              show the economics of a real premium-peripherals business: decent but still hardware-style margins and
              sensitivity to tariffs, supply, and pricing. Hasbro shows how even a powerful IP company can still absorb
              physical-product volatility and tariff expense. Funko shows how brutally collector enthusiasm can compress
              in public markets. Nintendo is the upside ceiling, not the direct comp: it demonstrates that hardware
              becomes much more valuable when software and digital attach truly scale, but ModRetro has not yet
              disclosed any evidence that its revenue quality looks like that.
