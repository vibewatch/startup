      - number: '2.2'
        title: Sizing lenses and range discipline
        blocks:
          - type: paragraph
            body: >-
              The chapter’s most important sizing discipline is to separate broad gaming demand from the niche that can
              actually buy dedicated retro hardware. ESA’s 2024 U.S. numbers show a real spending backdrop: $59.3
              billion total consumer spend, with $4.9 billion on hardware and $3.2 billion on accessories. Analyst
              houses stretch the outer frame much further, with Fortune Business Insights putting the 2026 global video
              game market at $255.03 billion and Grand View sizing the 2024 market at $298.98 billion while saying
              consoles are more than 27% of that total. Those are useful orientation points, but they are much too broad
              to call ModRetro’s TAM. Research and Markets is directionally helpful because it separately tracks console
              games, physical console games, average selling price, and spending per capita, which confirms that
              physical console spend is a legitimate analytic lens; however, the public summary still does not expose
              the numbers needed to carve out a premium retro-hardware niche. The only defensible public modeling path
              is therefore constrained and bottom-up. If just 0.05% to 0.20% of the 205 million-plus U.S. player base
              buys a roughly $200 premium retro device in a year, annual device spend lands around $20.5 million to
              $82.0 million. That is investable if ModRetro can monetize an ecosystem, but it is niche relative to the
              broad gaming market and small enough that execution mistakes, tariffs, or controversy can matter a lot.
            claimRefs:
              - CM002
              - CM003
              - CM006
