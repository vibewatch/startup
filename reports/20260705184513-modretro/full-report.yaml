          - type: callout
            title: Cheap substitutes cap mass-market upside
            body: >-
              Nintendo’s subscription library, ~$100 Evercade hardware, refurbished originals, and sub-$100 emulation
              devices all solve enough of the nostalgia job to limit how far ModRetro can scale on price alone.
            calloutType: risk
            claimRefs:
