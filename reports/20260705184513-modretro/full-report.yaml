      - number: '4.4'
        title: Disclosure Quality and Underwriting Blockers
        blocks:
          - type: paragraph
            body: >-
              Financial disclosure quality is the core blocker, not lack of demand signals. Public materials prove the
              products exist, prove current list pricing, prove the raise is real, and prove ModRetro is shipping beyond
              a tiny first batch. But they still do not disclose recognized revenue, units sold through,
              direct-versus-retail mix, gross margin by product family, accessory or cartridge attach rates, headcount,
              cash, burn, debt, warranty reserves, or returns. Even the official Form D says "No Revenues," which is a
              striking data point this late in the company's commercial life. The net result is that outside investors
              can see price points and financing momentum but cannot test revenue quality or operating leverage.


              That leaves a clear underwriting posture. The positive case is that ModRetro has demonstrated premium
              pricing, multi-SKU ambition, and access to enough capital to attempt a second platform. The caution case
              is that every hard hardware risk still sits offstage: tariffs, memory pricing, inventory write-downs,
              support burden, and channel economics can all swing outcomes before public investors ever see a top line.
              Until management provides a KPI pack and a working-capital bridge, the best public conclusion is not
              "financially proven" but "promising premium-hardware platform with material diligence blockers."
