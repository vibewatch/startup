      - number: '5.4'
        title: Repairability, manufacturing readiness, and roadmap risk
        blocks:
          - type: paragraph
            body: >-
              The repairability story is better than average for boutique retro hardware but not as clean as the
              marketing slogan suggests. Chromatic appears genuinely easy to open: iFixit shows a straightforward
              tri-wing disassembly with accessible internal modules, and third-party reviewers note that screw and
              connector choices are less hostile than on some peers. Yet ModRetro's own warranty text explicitly voids
              coverage if an owner opens the shell. In practice, that means the device is mechanically repairable but
              commercially nudged toward manufacturer-controlled service. The Old School Gamer battery-leak anecdote
              suggests ModRetro may still handle some failures generously, but public spare-parts economics remain
              opaque. M64 currently benefits from stronger roadmap transparency than most unreleased consoles. The April
              update says certified units are entering the warehouse, early production is nearly finished, and
              preproduction hardware is already with testers. The official deep dive is even more revealing because it
              names unresolved technical work instead of pretending the core is done. That honesty helps credibility.
              Still, the launch risk has not disappeared. M64 lacks independent public validation of latency,
              compatibility edge cases, thermals, and long-session stability. The public price story also remains messy.
              Netting it out, ModRetro looks credible on engineering intent and stronger-than-usual on prelaunch
              technical disclosure, but the burden of proof for M64 still sits on independent review coverage and actual
              repo delivery after launch.
