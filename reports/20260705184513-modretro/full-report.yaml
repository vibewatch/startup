  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              ModRetro should be underwritten inside a narrow slice of gaming hardware: premium retro-preservation
              devices that monetize authenticity, physical media, and owned hardware rituals rather than general game
              consumption. The broad market backdrop is obviously large, but most of that spend sits outside ModRetro’s
              practical fight. A buyer choosing Chromatic or M64 is not really deciding between ModRetro and the whole
              global games economy; the real comparison set is much tighter. It includes original hardware and refurb
              paths, premium FPGA recreations from Analogue, curated cartridge ecosystems such as Evercade, lower-cost
              emulation handhelds like Retroid or Anbernic, and subscription libraries such as Nintendo Switch Online.
              That distinction matters because several substitutes solve the same nostalgia job at far lower cost.
              Switch Online lets a household sample classic libraries for roughly $5 to $10 per person per year on a
              shared plan, Evercade refresh hardware sits around $100, refurbished N64 hardware is currently listed
              around $95 to $100, and Anbernic-style emulation devices can land near $70. ModRetro therefore competes in
              a market where ownership, materials, cartridge fidelity, and ecosystem identity must justify a large
              premium over convenience substitutes.
            claimRefs:
