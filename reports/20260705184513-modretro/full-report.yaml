      - number: '3.4'
        title: Wedge and moat durability
        blocks:
          - type: paragraph
            body: >-
              ModRetro’s best competitive wedge is not absolute uniqueness; it is middle-positioning. Chromatic aims to
              feel more faithful and physically premium than the cheap emulation class while staying below the current
              Analogue Pocket headline price. The handheld also benefits from a simpler thesis than Pocket:
              original-resolution display philosophy, metal shell, included Tetris, and a more consumer-legible retail
              story via GameStop. M64 tries to extend the same playbook into the living room with original cartridges, a
              new controller, open-sourced FPGA-core ambitions, and a lower public entry price than Analogue 3D’s
              initial preorder ticket. But moat durability is only medium. Analogue already has openFPGA and a broader
              installed preservation community. Evercade owns a lower-cost licensed-cartridge lane. Nintendo and
              emulation vendors own convenience and breadth. Even the modding ecosystem can recreate parts of ModRetro’s
              appeal with FPGBC or EverDrive-style stacks. The wedge is therefore real, but it depends on execution
              quality, ongoing boxed-software support, and channel evidence more than on any hard lock-in mechanism that
              rivals cannot touch.
