  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Current product surface and user jobs
        blocks:
          - type: paragraph
            body: >-
              ModRetro already behaves like a product company rather than a retro-concept brand, but the product map is
              intentionally narrow. Chromatic is a premium Game Boy/Game Boy Color handheld now, while M64 is still a
              prelaunch console ecosystem that bundles console, controller, physical games, and firmware promises into a
              single roadmap. That narrowness is strategic. Chromatic is not trying to be a general-purpose emulator box
              or a many-core tinkering device; the device is sold around authentic cartridge play, a custom-resolution
              screen, original-style link workflows, and premium materials. The M64 page repeats the same idea in
              living-room form: no setup, fast boot, original cartridges, four-player couch use, and physical launch
              games sold separately. The benefit is clarity. Buyers immediately understand what each device is for. The
              cost is scope. Reviewers are explicit that the Chromatic does not compete on breadth with Analogue Pocket
              or software handhelds, and public M64 pricing is not yet as clean as the experience pitch because the
              official landing page stresses ship date and capabilities while third-party coverage fills in inconsistent
              price details. For diligence, that means the product surface is coherent, but the company is still
              choosing authenticity and industrial design over flexibility, breadth, and fully settled launch messaging.
