  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - risk
      - monitorable trigger
      - threshold / event
      - action implication
    rows:
      - - Valuation outruns operating proof
        - Public or investor materials still cite valuation momentum without revenue bridge
        - No disclosed revenue / margin / sell-through bridge by next financing step
        - Treat price discipline as mandatory and downgrade any growth-underwriting assumptions
      - - M64 launch execution miss
        - Ship-date slippage, preorder confusion, or thin initial availability
        - Launch moves beyond committed window or first-run sell-through is obscured by policy uncertainty
        - Pause expansion thesis until shipment quality and customer reception are evidenced
      - - Quality / support burden spike
        - Known issues expand faster than firmware fixes
        - Visible increase in battery, audio, save, or updater complaints without resolution cadence
        - Assume reserve and support cost pressure until operating evidence improves
      - - Trade-cost compression
        - Tariff or de minimis rules lift landed cost materially
        - Price increase, accessory margin squeeze, or broker / customs disruption before gross margins are disclosed
        - Re-underwrite contribution margin and channel economics conservatively
      - - IP / DMCA escalation
        - Rights-holder complaint, takedown, or legal demand tied to compatibility or tooling
        - Any formal notice, injunction demand, or forced feature rollback
        - Escalate to legal diligence immediately and haircut platform-option value
      - - Founder-brand backlash
        - Press cycle or consumer thread centers Luckey rather than product
        - Controversy dominates review narratives or materially changes channel willingness to feature product
        - Assume broader-audience TAM cap and require stronger product-led proof before underwriting scale
    notes: >-
      Thresholds are qualitative because public operating dashboards are unavailable; each row is designed to convert
      soft risk into a concrete diligence or underwriting action.
