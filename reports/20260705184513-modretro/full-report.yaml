      - number: '4.3'
        title: Capital Structure, Funding, and Capital Intensity
        blocks:
          - type: paragraph
            body: >-
              The strongest hard financial evidence is the 2026 Form D. ModRetro's SEC filing shows a $150.0 million
              offering, $145.2 million sold, $4.8 million remaining, 41 investors already in the deal, and a revenue
              range marked "No Revenues." That is meaningful because it is both large and unusually explicit for a
              consumer-hardware startup. It supports the conclusion that ModRetro has raised enough capital to fund
              product expansion and inventory build, but it does not answer how quickly that capital is being consumed.
              Forge adds additional structure by showing a March 2026 Series A-1 at $111.63 million and a Series A-2 at
              $33.53 million, alongside total funding of $164.3 million and visible preferred-share terms such as a 1x
              non-participating liquidation preference. Market coverage then layers on roughly $1 billion valuation
              talk, but that is still talk rather than an audited operating bridge.


              The capital-intensity reality is therefore two-sided. On one side, official and market-data sources imply
              ModRetro has real financing capacity and can afford tooling, component procurement, warehousing, and
              launch inventory for more than one platform. On the other side, no public source discloses cash on hand,
              burn, debt, purchase-order financing, inventory turns, or next-round trigger conditions. Hardware peers
              show why that matters: component inflation, memory constraints, and tariff changes can move costs quickly,
              and physical-product companies regularly need inventory, logistics, and marketing outlays before
              sell-through is known. So the raise reduces existential risk, but it does not let an outside investor
              model capital adequacy with any precision.
