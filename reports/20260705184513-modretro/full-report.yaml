  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing, and Commercial Surface
        blocks:
          - type: paragraph
            body: >-
              ModRetro already shows a broader monetization stack than a single nostalgic gadget drop. The current
              storefront prices the Chromatic bundle at $199.99, keeps a higher-priced sapphire-screen option at
              $299.99, sells accessories such as a rechargeable battery pack and customization parts, and merchandises
              physical cartridges with individual SKU pricing and bundle-style promotions. Just as important, the
              official M64 materials frame a second platform rather than a one-off follow-up: the console launches with
              four games sold separately, ModRetro says it is directly funding new M64 games, and the company is
              bundling controller, battery, and accessory design into the product story. That combination matters
              financially because it implies ModRetro is trying to compound wallet share through hardware, accessory
              attach, and physical software rather than through a single device ASP.


              What the public record still does not reveal is the bridge from list pricing to realized revenue quality.
              There is no public disclosure of wholesale versus direct-to-consumer mix, retailer take rates,
              discounting, bundle attachment, returns, warranty reserves, or contribution margins by SKU. The M64
              pricing story is also mixed by source quality: official pages confirm July 28 shipment timing and
              aggressive MSRP language, while Notebookcheck is the clearest public witness for the $199 early-bird
              price. So the correct financial read is that ModRetro has real, visible pricing power signals and multiple
              revenue surfaces, but investors still do not know how much of that list price converts into recognized
              gross profit after manufacturing, logistics, support, and channel friction.
