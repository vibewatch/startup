    type: flow
    layout: wide
    summary: >-
      Public evidence supports a premium-hardware revenue story, but the economics still flow through manufacturing,
      inventory, tariff, and support burdens that the company does not quantify.
    data:
      nodes:
        - id: price
          label: Premium list price
          detail: Chromatic and reported M64 pricing imply willingness to pay near $200 and above
        - id: build
          label: Hardware build + tooling
          detail: Metal shells, custom displays, controllers, cartridges, and warehousing raise COGS intensity
        - id: channel
          label: Channel / logistics drag
          detail: Retailer cuts, freight, duties, and returns are not publicly disclosed
        - id: support
          label: Support / repair burden
          detail: Spare parts, calibration, and warranty handling can absorb margin
        - id: inventory
          label: Inventory exposure
          detail: Physical goods require prebuilt stock before end-customer sell-through is known
        - id: outcome
          label: Contribution margin unknown
          detail: Public sources never bridge price to unit profitability
      edges:
        - from: price
          to: build
          label: must cover
        - from: build
          to: channel
          label: flows through
        - from: channel
          to: support
          label: still leaves
        - from: build
          to: inventory
          label: requires
        - from: support
          to: outcome
          label: obscures
        - from: inventory
          to: outcome
          label: obscures
    approximationNotes: >-
      The bridge is qualitative because ModRetro does not publish COGS, warranty reserves, channel discounts, or returns
      data.
    claimRefs:
      - CI011
      - CI012
      - CI028
      - CI031
      - CI032
      - CI041
