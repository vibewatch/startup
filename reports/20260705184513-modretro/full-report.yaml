      - number: '6.3'
        title: Sentiment is mostly positive on build quality, but battery and policy friction are persistent
        blocks:
          - type: paragraph
            body: >-
              The public review corpus is directionally favorable. Reviewers keep praising Chromatic’s build quality,
              authenticity, and display, and even skeptical outlets usually concede that the product delivers on its
              core retro promise. The problem is that the same corpus keeps repeating a narrow set of negatives: the
              device is expensive for a single-purpose handheld, it leans on three AA batteries, and the rechargeable
              path either costs extra or was missing during some reviews. Those complaints matter because they cut
              directly against convenience-seeking buyers and make the product easier to admire than to recommend
              broadly. Official support surfaces reinforce the same theme. ModRetro’s known-issues page openly documents
              battery-meter quirks, backlight flicker on low batteries, saving issues, and kernel-panic escalation
              paths. The bug page routes users through firmware updates before support contact, which is reasonable
              operationally but still creates customer work. The most encouraging customer-service proof is the lone
              Trustpilot review praising a free external charger after a battery problem; the least encouraging signals
              are restrictive return terms, a warranty void for owner opening, and owner complaints like the loose
              volume wheel thread.
