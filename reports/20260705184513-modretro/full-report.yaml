      - number: '5.2'
        title: Architecture and technical differentiation
        blocks:
          - type: paragraph
            body: >-
              The most durable part of ModRetro's technical story is that the products are not just nostalgia shells.
              Chromatic's differentiation is a stack: FPGA recreation, a purpose-built 160x144 display, preserved link
              and IR interfaces, and materials that feel closer to boutique consumer electronics than to commodity
              emulation handhelds. The public GitHub release matters because it proves the device is not a black box
              built on invented marketing language; the repo explicitly points back to the Game Boy MiSTer project and
              exposes the actual toolchain, flash path, and board target. At the same time, the release also reveals
              friction. Building locally still depends on a very specific Gowin IDE version and a yearly-renewed
              license, which is more open than a sealed console but less liberating than the word open-source alone
              implies. On M64, the official deep dive is unusually candid for a prelaunch console. Robert Peip explains
              why PSRAM was chosen over DDR, why FPGA still matters for N64 timing behavior, and which open accuracy
              issues remain. That candor is a real strength because it turns technical differentiation into a concrete
              engineering tradeoff: ModRetro is accepting custom hardware complexity and longer bring-up work in order
              to optimize determinism, controller latency, and cartridge-faithful behavior. The flip side is that the
              same openness makes remaining gaps visible, especially around floating-point timing and RSP behavior.
