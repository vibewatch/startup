  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Capital is real, but valuation and second-product execution now carry the downside
        blocks:
          - type: paragraph
            body: >-
              ModRetro has already crossed the threshold from concept to financed operator. The Form D is unusually
              clear for a private consumer-hardware company: it shows a $150.0 million exempt offering, $145.2 million
              sold, 41 investors, and a revenue range of “No Revenues.” That combination matters because it removes the
              easy “will this company survive the next quarter?” objection while creating a harder one: can a business
              with one shipped niche console and undisclosed revenue justify a market-reported $1 billion conversation?
              The answer now depends heavily on M64 execution. Official pages still lean on waitlist and launch
              language, M64 production updates still talk about reviewer units and mass-production transition, and
              third-party coverage still flags missing preorder visibility and uncertain first-run volume. In other
              words, ModRetro’s funding risk is no longer pure liquidity risk; it is valuation-support risk. If M64
              launches cleanly and sells through, the raise looks like expansion fuel. If launch timing slips, supply is
              thinner than expected, or attach economics disappoint, the same capital base can start looking like a very
              expensive bridge to a narrower-than-assumed enthusiast market.
