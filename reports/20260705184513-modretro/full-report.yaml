      - number: '2.4'
        title: Drivers, constraints, and adoption timing
        blocks:
          - type: paragraph
            body: >-
              Several structural drivers are real. ESA’s age mix and family-play signals support the idea that retro
              demand is multi-generational, not just hardcore-collector only. Physical-media ecosystems also still
              resonate: Evercade keeps using bundled cartridges and lower-cost hardware to pull newcomers into a
              collection habit, while ModRetro’s own materials lean hard into cartridges, remasters, and newly developed
              games. Analyst market reports additionally say offline play remains relevant, which fits the psychology of
              owned retro hardware. The constraints, however, are equally important. Circana explicitly warns that
              hardware faces headwinds even in a better software year. Broad market reports describe cloud gaming,
              subscriptions, and other digital entertainment as strong alternative uses of time and money. CNBC’s tariff
              coverage of Nintendo’s Switch 2 shows that hardware BOM shocks can delay preorders and force pricing
              changes even for very large platforms, which is a reminder that niche retro vendors may be more fragile,
              not less. Finally, ModRetro carries a founder-brand risk that peers do not bear as strongly: both The
              Verge and Kotaku show that Palmer Luckey’s Anduril and politics associations can become an adoption
              objection. Net result: adoption should be modeled as a narrow enthusiast wedge with ecosystem upside, not
              as a mass-market console cycle.
            claimRefs:
              - CM004
              - CM005
              - CM021
              - CM027
              - CM028
              - CM034
