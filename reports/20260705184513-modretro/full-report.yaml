chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, products, and commercial surface
        blocks:
          - type: paragraph
            body: >-
              ModRetro’s public face is unusually concrete for a young consumer-hardware startup: it sells actual
              devices, cartridges, and accessories rather than just a teaser page. The current storefront centers on the
              Chromatic, a premium Game Boy-compatible handheld that starts at $199.99 and ships with a
              ModRetro-produced Tetris cartridge, while adjacent store inventory shows the company also monetizing
              through accessories, replacement parts, and a growing catalog of cartridge software. Official materials go
              further than a typical nostalgia-hardware pitch by describing a deliberate physical-media ecosystem,
              including remasters, new IP, and future M64 game releases. That matters because the company is implicitly
              trying to become a branded retro-gaming platform, not just a one-off handheld seller. The second hardware
              surface, M64, is already presented as a full console ecosystem with a controller, games, and a July 2026
              ship plan, which signals a multi-product ambition even before public financial disclosure catches up.
