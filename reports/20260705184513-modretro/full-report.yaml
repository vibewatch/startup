companyProfile:
  summary: >-
    ModRetro is a private retro-hardware company revived in 2023 by Palmer Luckey and Torin Herndon. The company sells
    the Chromatic, a premium FPGA-based Game Boy/Game Boy Color-focused handheld with its own cartridge and accessory
    ecosystem, and is preparing to launch the M64, an FPGA-based Nintendo 64-compatible console with its own controller
    and physical software roadmap. Public evidence supports real enthusiast demand, strong product craftsmanship, and
    substantial recent financing, but still leaves revenue quality, margin structure, and governance detail largely
    undisclosed.
  foundedDate: '2023-01-01'
  founders:
    - name: Palmer Luckey
      role: Co-founder
      background: >-
        Founded the original ModRetro forum as a teenager and later founded Oculus VR and Anduril, giving ModRetro
        unusual founder-brand visibility and fundraising gravity.
      claimRefs:
        - CO007
        - CO009
        - CO029
    - name: Torin Herndon
      role: Co-founder & CEO
      background: >-
        Former Oculus and Anduril engineer who appears to run day-to-day product, engineering, and shipping execution
        for ModRetro.
      claimRefs:
