      - number: '1.2'
        title: Founders, leadership, and corporate footprint
        blocks:
          - type: paragraph
            body: >-
              The company’s narrative is deeply tied to Palmer Luckey, but the operating picture is more nuanced than
              “Palmer’s side project.” Luckey’s own launch essay says ModRetro began as a teenage hardware-modding forum
              and that the Chromatic idea had lived as a hobby for almost seventeen years. Public third-party sources,
              however, place the revival of the current hardware company in 2023 and consistently identify Torin Herndon
              as co-founder and CEO. The April 2026 M64 update being signed by Torin reinforces that he is the visible
              executive responsible for shipping product, while Luckey appears to function more as founder, product
              visionary, and fundraising magnet. Corporate footprint evidence is less clean. Official consumer-facing
              pages reviewed here do not publish a headquarters address, but filing-oriented databases and market-data
              profiles point to an Irvine, California mailing address for ModRetro, Inc. That means diligence can defend
              an Irvine legal/filing footprint, yet should still ask management to reconcile legal address, warehouse
              operations, and any broader Southern California operating footprint directly.
            claimRefs:
