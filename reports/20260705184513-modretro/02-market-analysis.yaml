    {
      "id": "diligence-gaps-and-underwriting-implications",
      "title": "Sizing and adoption diligence gaps",
      "body": "The public record is strong enough to say the market exists, that buyers do pay for authenticity, and that ModRetro sits in a real premium-retro substitute set. It is not strong enough to turn that into a clean SOM. The biggest missing piece is observed unit volume: no public source reviewed here isolates premium retro-preservation device sell-through, installed base, or repeat-attach behavior. The second missing piece is economics of the ecosystem itself. Physical media is a plausible tailwind only if cartridges and accessories attach often enough to lift lifetime value above what a one-time hardware sale can justify in a niche TAM. The third unresolved issue is whether founder controversy is just loud commentary or a measurable demand tax. Because the broad gaming figures are so much larger than the likely niche, those unanswered questions are not footnotes; they are the difference between a durable enthusiast platform and a beautifully made but bounded hardware business. Underwriting should therefore treat the current market case as positive on existence, positive on premium willingness to pay, and cautious on scale until management provides cohort and channel data.",
