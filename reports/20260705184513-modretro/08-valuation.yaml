- id: diligence-asks-exit-discipline-and-thesis-breaks
  title: Final Diligence Asks, Exit Discipline, and Thesis-Break Triggers
  body: |-
    The missing information is not cosmetic; it is the difference between a plausible premium and an underwritten one. No reviewed public source discloses ModRetro's recognized revenue, product-family gross margin, preorder conversion, warranty reserve, cash balance, burn, inventory commitments, or customer concentration. Forge exposes only a thin slice of round mechanics, and even that does not answer how much liquidation protection, secondary, or pro-rata behavior sits behind the broader financing story. Public investors therefore cannot tell whether the current mark is being supported by real unit economics or simply by appetite for a charismatic serial founder and a scarce private asset.

    That also means exit posture has to stay conservative. There is no public basis for underwriting near-term IPO readiness when the flagship filing still says "No Revenues" and the operating bridge remains private. The supportable hold logic is continued private execution through M64 launch, demonstrated sell-through, and a future KPI pack that reconciles revenue, margin, and working-capital intensity. The thesis breaks if launch timing slips materially, if cartridge and controller attach fail to deepen monetization, if return or support costs overwhelm premium pricing, or if a future round reveals investor-protection terms that make the headline valuation less meaningful than it appears.
