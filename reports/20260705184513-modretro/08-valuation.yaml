- id: scenario-view-and-recommendation
  title: Scenario View, Reverse Revenue Math, and Recommendation
  body: |-
    Reverse-engineering the $1 billion talk is the cleanest way to pressure-test ModRetro's pricing. If investors ultimately value the company like Funko, the required revenue to support a $1 billion enterprise value exceeds $3.0 billion. At Corsair-like hardware multiples, the requirement is still about $1.5 billion. Even Hasbro-like and Logitech-like public multiples require roughly $415 million and $353 million of revenue respectively. Only by assuming a premium private optionality multiple around 4.0x does the implied revenue requirement drop to about $250 million. That math does not prove ModRetro is overvalued; it proves the current mark only works if the company eventually looks better than ordinary hardware and more like a scaled physical-IP platform.

    That is why the public recommendation should stay disciplined. The bull case is real: Luckey has founder scarcity, Chromatic already proves product quality, the M64 expands the surface area, and official pages show a serious effort to build an ecosystem around controller, cartridges, and new games. But the base case still discounts the current headline because none of the public sources disclose the revenue or margin bridge required to defend it. The bear case is also easy to imagine: M64 launches, but demand remains enthusiast-niche, attach is modest, and the business is re-rated toward public hardware or collector-merch multiples. On current evidence, the right stance is track-and-wait, with a stretched valuation label rather than an invest-now call.
