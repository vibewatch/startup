- id: TV002
  title: Thesis / Anti-Thesis Table
  columns:
  - Lens
  - Bull thesis
  - Anti-thesis
  - What would decide it
  rows:
  - - Founder
    - Luckey scarcity and fundraising ability support a premium private mark.
    - Founder politics and defense-tech baggage constrain TAM outside the enthusiast core.
    - Customer conversion and channel breadth outside the core retro audience
  - - Product quality
    - Chromatic reviews show premium build quality and authentic execution.
    - Those same reviews also say the devices are expensive and narrow in scope.
    - Sell-through, returns, and repeat purchase behavior
  - - Platform ambition
    - M64 plus controller plus new physical games can turn one gadget into a physical-IP ecosystem.
    - The ecosystem may remain a boutique collector project rather than a scalable platform.
    - Attach rates for controllers, cartridges, and second-device buyers
  - - Comparable set
    - Premium peripherals and branded IP comps support more than plain commodity-hardware multiples.
    - Public collector and hardware comps still compress quickly when demand narrows or inventory risk rises.
    - Actual gross margins and revenue mix versus those comp bands
  - - Valuation support
    - A clean launch and KPI pack could move the company toward the low end of a credible platform premium.
    - Without disclosed revenue and margin proof, the current mark is optionality-first, not earnings-backed.
    - A management bridge from financing facts to operating metrics
  - - Exit path
    - A later private round or strategic path could preserve optionality if execution is strong.
    - Public-market readiness is not visible today.
    - Revenue, cash-flow, and governance disclosure suitable for public investors
  notes: The anti-thesis is not that the products are bad; it is that the current valuation can outrun what the public operating file can currently prove.
