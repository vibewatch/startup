  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-quality
    missingEvidence: Recognized revenue, gross margin, and unit-economics bridge by product family.
    whyItMatters: Without revenue quality data, no outside investor can map ModRetro onto a credible public or private multiple band.
    diligencePath: Request a management KPI pack showing revenue, gross margin, channel mix, return rates, and attach by Chromatic, accessories, cartridges, and M64.
    relatedQuestionRefs:
    - QV027
    - QV031
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: round-terms
    missingEvidence: The full 2026 financing term sheet, cap table, secondary mix, and investor-protection terms beyond the visible Forge fields.
    whyItMatters: Headline valuation can materially overstate economic value when downside protection or secondary is heavy.
    diligencePath: Review financing documents and investor rights agreements under NDA before treating the headline valuation as decision-grade.
    relatedQuestionRefs:
    - QV030
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: material
    topic: launch-volume
    missingEvidence: M64 preorder counts, launch allocation, and first-90-day sell-through data.
    whyItMatters: The second platform is carrying too much of the upside case to leave launch demand unmeasured.
    diligencePath: Request weekly preorder, allocation, cancellation, and sell-through reporting through the first 90 days after launch.
    relatedQuestionRefs:
    - QV032
    relatedTableRefs:
    - TV005
    - TV006
  - type: enumeration-incomplete
    severity: minor
    topic: TV004 comparable coverage
    missingEvidence: A truly direct public retro-console comp set with disclosed margins and current trading multiples.
    whyItMatters: The comparable table is intentionally partial because the closest analogs are either much larger platform companies or private niche hardware brands.
    diligencePath: Expand the comp sheet if a newly public retro-hardware or enthusiast-platform company becomes available, but keep today’s table bounded to the best public proxies.
    relatedTableRefs:
    - TV004
