- id: TV005
  title: Thesis-Break and Kill Triggers Table
  columns:
  - Trigger
  - Threshold / warning sign
  - Why it matters
  - Action implication
  rows:
  - - M64 launch slip
    - Meaningful delay beyond the July 28, 2026 target or repeated reviewer-only status updates
    - Would undermine the second-platform expansion story carrying the premium.
    - Treat the current mark as early and reduce willingness to pay for optionality.
  - - Price/value compression
    - Regular pricing settles near $229.99 but reviews still frame the device as narrow versus alternatives
    - Suggests premium ASP may not translate into broad enough demand.
    - Re-underwrite the company closer to niche hardware rather than platform.
  - - Weak attach economics
    - Controllers, cartridges, and launch titles do not create repeat spend beyond the first box sale
    - Without attach, ModRetro remains a gadget company.
    - Do not pay platform-style multiples without evidence of recurring wallet share.
  - - Opaque KPI pack persists
    - Management still withholds revenue, gross margin, cash, burn, or sell-through after the next financing step
    - Headline valuation quality cannot be judged without those metrics.
    - Maintain a wait stance and avoid treating the mark as underwritten.
  - - Founder backlash widens
    - Brand conversation outside the core enthusiast base stays dominated by Luckey politics or defense ties
    - This shrinks TAM and raises paid-acquisition friction.
    - Assume premium pricing must work against a narrower addressable market.
  - - Round protections disappoint
    - Future term sheet reveals heavy downside protection, secondary, or other investor-favorable structure
    - Could make the headline valuation less economically meaningful than it appears.
    - Revalue based on effective economics, not headline post-money alone.
  notes: These triggers are designed to move valuation stance quickly; they are not a full risk register, which lives in the prior chapter.
