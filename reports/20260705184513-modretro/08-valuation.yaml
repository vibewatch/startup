- id: TV004
  title: Comparable Valuation Table
  columns:
  - Comparable
  - What it shows
  - Public multiple / status
  - Why it matters
  - Limitation
  rows:
  - - Corsair Gaming
    - Gaming/peripherals hardware with real enthusiast brand equity and hardware-style margin exposure.
    - 0.66x July 2026 P/S
    - Closest public baseline for premium gaming hardware economics.
    - Still broader than ModRetro and exposed to PC-component cycles.
  - - Logitech
    - Premium peripherals platform with stronger brand, scale, and category breadth.
    - 2.83x July 2026 P/S
    - Useful upper-end public peripheral benchmark if ModRetro proves durable accessory economics.
    - Much larger, more diversified, and less single-franchise-dependent.
  - - Hasbro
    - Owned-IP toy and game company with a mix of physical products and higher-value content flywheels.
    - 2.41x July 2026 P/S
    - Shows what a branded physical-IP company can command when the ecosystem is broader than one device family.
    - Still not a direct hardware comp and benefits from much wider franchise depth.
  - - Funko
    - Collector-merch and fandom demand can look attractive until public markets punish demand and inventory risk.
    - 0.33x July 2026 P/S
    - Useful compression case for enthusiast physical goods when demand or execution weakens.
    - Merchandising model differs from FPGA gaming hardware.
  - - GameStop
    - Retail/collectibles optionality can produce unusual public multiples disconnected from clean operating comparability.
    - 2.82x July 2026 P/S
    - Helpful as a warning that public marks can contain non-fundamental optionality.
    - Meme, balance-sheet, and retail factors make it a weak core comp.
  - - Nintendo
    - True platform economics come from pairing hardware with software and digital monetization at scale.
    - Qualitative ceiling, not direct multiple anchor
    - Shows why investors may pay more when physical hardware leads to large software and digital attach.
    - ModRetro has not publicly shown anything close to Nintendo-like scale or attach yet.
  notes: This enumeration intentionally mixes direct hardware, premium peripherals, collectible/IP, and platform-ceiling references because no perfect public ModRetro analog exists.
  enumerationScope:
    coverage: partial
    basis: Rows cover the main public lenses useful for bounding ModRetro valuation as of the run date, not every gaming or consumer-hardware ticker.
