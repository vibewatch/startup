chapter:
  number: 8
  title: Valuation
  summary: ModRetro has enough real financing, product quality, and founder scarcity to make a ~$1 billion private-market conversation plausible, but not enough public operating disclosure to make that price look comfortable. Relative to public hardware, peripherals, and collectible-IP comps, the current mark already assumes that Chromatic plus M64 becomes a broader physical-IP platform rather than staying a premium nostalgia hardware brand. The public stance should therefore remain track-and-wait with a stretched valuation label until management discloses revenue quality, launch sell-through, and round-term detail.
sections:
- id: current-valuation-facts-and-what-they-prove
  title: Current Valuation Facts and What They Actually Prove
  body: |-
    ModRetro's current valuation narrative is backed by real financing evidence, but the public file still stops well short of a true underwriting package. The strongest document is the 2026 SEC Form D: it shows a $150.0 million offering, $145.2 million already sold, $4.8 million remaining, 41 investors in the deal, and a revenue range marked "No Revenues." Forge adds a second layer of structure by showing $164.3 million of total funding, a March 2026 Series A-1 of $111.63 million, a Series A-2 of $33.53 million, and visible preferred-share fields that look cleaner than distressed-growth capital. TechCrunch, Observer, and Notebookcheck then anchor the market narrative around a roughly $1 billion valuation discussion.

    Those facts matter because they prove sophisticated capital has already shown up for a niche consumer-hardware business. They do not prove the business deserves the headline mark. The same public record still withholds recognized revenue, gross margin, cash, burn, inventory commitments, channel mix, preorder conversion, and liquidation-stack nuance beyond what Forge exposes on the page. So the correct read is that ModRetro's private-market support is real, but the current price conversation is being carried more by founder credibility, scarcity, and platform optionality than by disclosed operating metrics.
