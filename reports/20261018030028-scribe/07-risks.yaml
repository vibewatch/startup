chapter:
  number: 7
  title: "Risks"
  summary: "Scribe's heaviest underwriteable risks come from privacy and employee-trust exposure inherent in workflow capture, plus execution dependence on human guide upkeep and external AI/platform partners. Public evidence shows meaningful mitigation claims, but the assigned source set still leaves incident history, litigation posture, and monetization durability insufficiently proven for a low-residual-risk view."
sections:
  - id: "privacy-and-legal-exposure"
    title: "Privacy, legal, and employee-trust exposure sits above ordinary SaaS risk"
    body: |-
      The core product records how people work, which is exactly what makes privacy, consent, and confidentiality the first risk bucket to rank. Official materials say Scribe enforces redaction, domain controls, and IP whitelisting and is compliant with SOC 2 Type II, HIPAA, FERPA, and GDPR, but the same evidence set also shows why residual exposure stays material: independent reviewers warn that captured workflows can contain sensitive client or company data, and the Chrome Web Store disclosure confirms the extension handles user activity and website content. Forbes frames the adjacent downside clearly by describing Scribe as software that records employee screens and noting that comparable monitoring tools have triggered privacy-violation backlash. That mix supports a view that mitigation exists, but only alongside real legal, labor, and customer-trust diligence before underwriting broad enterprise rollout.
    claimRefs: ["CR002", "CR003", "CR008", "CR009"]
    tableRefs: ["TR001"]
  - id: "operational-quality-risk"
    title: "Operational value depends on disciplined review, upkeep, and scope control"
    body: |-
      Scribe's product ambition has expanded from basic capture into Autocapture, AI-authored process documents, on-screen walkthroughs, translations, and agent-facing integrations. That broader surface can improve value, but it also raises the operational bar because generated guides still need humans to edit steps, redact screenshots, and keep documentation aligned with changing workflows. Independent reviewers reinforce that the system is only as good as the workflows teams actually capture and maintain. In practice, the largest execution risk is not whether Scribe can generate an SOP once; it is whether customers can sustain accurate, current, appropriately redacted process knowledge at enterprise scale without creating stale documentation, avoidable errors, or shadow processes outside the platform.
    claimRefs: ["CR001", "CR006", "CR007", "CR011"]
    tableRefs: ["TR002"]
  - id: "dependency-and-commercial-risk"
    title: "AI, platform, and packaging dependencies can weaken resilience and rollout economics"
    body: |-
      Scribe's AI layer is not fully self-contained. The company says Scribe AI uses OpenAI LLM APIs, while Forbes reports the broader model stack sits on top of OpenAI, Anthropic, and Google systems. Distribution and downstream usage also depend on browser extensions, desktop apps, and integrations into tools such as Confluence, SharePoint, Notion, Guru, HubSpot, Slack, MCP, and APIs. Those dependencies matter because outages, policy changes, model-quality drift, or breaking integration changes can impair either capture or delivery. Commercially, public pricing signals that the most governance-heavy and cross-surface capabilities sit behind paid plans, while the free product is narrower. That implies both conversion risk and enterprise-procurement friction if customers need desktop capture, governance, or broader deployment before they have proven ROI.
    claimRefs: ["CR004", "CR005", "CR010", "CR012"]
    tableRefs: ["TR003"]
    figureRefs: ["FR001"]
  - id: "residual-exposure-and-kill-criteria"
    title: "Residual exposure is manageable only with explicit diligence gates and kill criteria"
    body: |-
      The assigned evidence supports a monitorable, not dismissible, risk posture. Management's mitigation story is credible enough to keep diligence open: there are explicit redaction and policy controls, current help-center material on editing and sharing, and current product pages that tie the product to enterprise workflows rather than consumer novelty. But the same record does not prove low residual risk. Before underwriting aggressively, investors should demand current legal and security documentation, customer references that describe how redaction and change management work in production, evidence that guide freshness and adoption are measured over time, and proof that paid enterprise expansion offsets freemium surface limitations. Kill criteria should include any verified privacy or labor complaint tied to capture practices, material AI-vendor or integration disruption, weak conversion from free/browser usage into governed paid deployment, or customer evidence that stale guides are degrading operational accuracy rather than improving it.
    claimRefs: ["CR002", "CR004", "CR005", "CR008", "CR010", "CR011", "CR012"]
callouts:
  - calloutType: "risk"
    title: "Surveillance-style backlash is the fastest way for Scribe's value proposition to invert"
    body: "Because the product captures live work, the downside is not abstract cyber risk alone; it is employee-trust, privacy, and confidentiality friction that can turn deployment into a governance fight unless capture scope, redaction, and opt-out boundaries are explicit."
    claimRefs: ["CR003", "CR008", "CR009"]
  - calloutType: "recommendation"
    title: "Treat low residual-risk underwriting as unproven until enterprise operating evidence is produced"
    body: "The assigned public evidence is enough to define diligence asks and kill criteria, but not enough to clear incident-history, vendor-dependency, or monetization-risk questions without live customer, legal, and security materials."
    claimRefs: ["CR004", "CR010", "CR012"]
