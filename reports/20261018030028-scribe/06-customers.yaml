schemaVersion: report-v2
artifact: customers
slug: scribe
runDate: 2026-10-18
company:
  name: Scribe
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence supports a two-tier customer story: Scribe appears to have a
    very large top-of-funnel/self-serve footprint plus a real large-enterprise
    sales motion, but public proof of retention, customer concentration, and
    AI-module attach remains thin. Independent evidence is strongest for broad
    scale and a few named enterprise deployments, while durability still depends
    on private cohort and renewal data.
sections:
  - id: customer-base-and-segmentation
    title: Customer base and segmentation
    body: >-
      Scribe's public customer surface spans a broad self-serve/documentation
      wedge and a more explicit enterprise motion. The official product and
      support surfaces center on individuals and teams who need to capture a
      workflow quickly, share it with teammates or clients, and turn repeated
      operating knowledge into guides, SOPs, and AI-readable context. At the
      same time, Scribe's 2026 large-enterprise sales hiring language points to
      a buyer set that includes large accounts with 10,000+ employees, six-figure
      ARR deal sizes, and multi-stakeholder procurement. That split matters for
      diligence: the company can plausibly land through free or low-friction
      capture usage, but the public record does not bridge cleanly from
      organizations and users to paying customers, segment mix, or revenue
      concentration.
    claimRefs: [CU001, CU002, CU004, CU006, CU008, CU009]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof-and-named-deployments
    title: Adoption proof and named deployments
    body: >-
      Adoption proof is directionally strong but unevenly disclosed. Scribe's
      own pages cite hundreds of thousands of organizations and broad Fortune 500
      penetration, while Forbes reports 80,000 customers, more than 6 million
      employees with the app on their laptop, and paid contracts ranging from
      $20 subscriptions to five- to seven-figure enterprise deals. Named proof
      is best for large-enterprise workflow training and process standardization:
      LinkedIn, HubSpot, and T-Mobile appear in independent or company-issued
      references, and official testimonials describe Scribe as a context layer
      across teams or a way to self-document applications during demos and
      testing. That said, the strongest public proofs are still logos, quotes,
      and anecdotal use cases rather than cohort data, deployment counts by
      segment, or independently verified business outcomes.
    claimRefs: [CU003, CU005, CU007, CU010]
    tableRefs: [TU002, TU003]
  - id: durability-expansion-and-concentration-risk
    title: Durability, expansion, and concentration risk
    body: >-
      The weak point in the public customer record is durability. Across the
      assigned sources, there is still no disclosed NRR, GRR, churn, renewal,
      contract-length, or top-customer concentration data, so it is impossible
      to tell whether Scribe's impressive user and organization funnel converts
      into sticky multi-product revenue at the same rate across SMB, mid-market,
      and large-enterprise accounts. Expansion logic exists: Scribe markets
      workflow capture, broader document generation, and AI/context-layer use
      cases that can widen account scope. But the AI message also lands in a
      noisier category, where adjacent "AI scribe" coverage emphasizes platform
      breadth, compliance controls, and audit risk. Until Scribe publishes
      segment-level retention or attach metrics, investors should treat the
      expansion story as plausible but not yet externally proven.
    claimRefs: [CU009, CU011, CU012, CU013, CU014]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Primary use case
      - Scale / strategic value
      - Gap
    rows:
      - - Self-serve workflow capture
        - Individual operator or team lead is usually buyer and user; free entry point lowers initial payer friction.
        - Capture browser-based processes and auto-generate step-by-step guides.
        - Broad top-of-funnel reach underpins the 500,000+ / 600,000-organization claims.
        - Public evidence does not disclose free-to-paid conversion by segment.
      - - Team workspace adoption
        - Department contributors use the product while team admins or function leads manage sharing, approvals, and workspace surfaces.
        - Knowledge transfer, onboarding, approvals, and cross-team process standardization.
        - Expands Scribe beyond solo capture into repeatable team workflows and shared operating context.
        - No public seat counts, activation rates, or renewal data by function.
      - - Large enterprise accounts
        - Procurement, enablement, IT, RevOps, or operations leaders buy; broad employee base uses the guides.
        - Standardize complex workflows, train employees, and surface inefficiencies across large organizations.
        - Job-post evidence points to accounts with 10,000+ employees, six-figure ARR deals, and 90-day sales cycles.
        - No disclosed top-customer mix, win rates, or enterprise retention cohorts.
      - - External enablement / client sharing
        - Internal team authors the guide; teammates or clients consume it.
        - Share process documentation outside the core authoring team.
        - Extends value beyond internal SOPs into customer- or client-facing enablement.
        - Revenue contribution from this use case is not disclosed.
    notes: >-
      Segments are inferred from assigned product, support, and sales-motion
      sources; public disclosures do not provide a formal revenue-by-segment bridge.
    claimRefs: [CU001, CU002, CU006, CU008, CU009]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date / source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Organizations familiar with legacy Scribe
        - 500,000+ organizations
        - Undated "Introducing Scribe AI" page, accessed 2026-10-18
        - Medium
        - Shows a large installed audience before the newer AI positioning.
        - Does not reconcile to paying customers or current active organizations.
      - - Organizations on current capture page
        - 600,000 organizations
        - Scribe Capture page, accessed 2026-10-18
        - Medium
        - Suggests the self-serve / broad-usage funnel continued to expand.
        - Does not distinguish free from paid accounts.
      - - Users across businesses
        - 7 million users across 600,000 businesses
        - 2026 large-enterprise sales job post, accessed 2026-10-18
        - Medium
        - Implies broad top-of-funnel and multi-user penetration inside accounts.
        - Company-issued repost; no active-user definition or audit trail.
      - - Paying-customer count
        - 80,000 customers
        - Forbes, 2026-05-10
        - Medium
        - Indicates a narrower monetized base inside the much larger organization/user funnel.
        - Customer definition and segment mix are not disclosed.
      - - Employee distribution
        - More than 6 million employees with the app on their laptop
        - Forbes, 2026-05-10
        - Medium
        - Suggests adoption inside customer organizations can spread well beyond one champion.
        - Installs are not the same as active use, renewals, or paid seats.
      - - Commercial range
        - $20 subscriptions to five- to seven-figure contracts
        - Forbes, 2026-05-10
        - Medium
        - Supports a land-and-expand story from self-serve to enterprise budgets.
        - No ACV distribution, retention, or expansion-rate disclosure.
      - - Enterprise penetration
        - More than 94% of the Fortune 500 use Scribe
        - Capture page and 2026 large-enterprise sales job post
        - Medium
        - Large-brand reach is a meaningful proof point for enterprise relevance.
        - '"Use" is not defined as paid deployment, active seats, or multi-product adoption.'
    notes: >-
      The table preserves separate metrics for organizations, businesses, users,
      customers, employees, and enterprise penetration because the public record
      does not reconcile them into one denominator.
    claimRefs: [CU003, CU004, CU005]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome / proof
      - Limitation
    rows:
      - - LinkedIn
        - Large enterprise
        - Workflow guides used to train employees on complex workflows.
        - Production-looking
        - Named as a current Scribe customer in independent and company-issued 2026 sources.
        - Public evidence does not disclose seat count, duration, or renewal terms.
      - - HubSpot
        - Large enterprise
        - Workflow guides used for employee training and process standardization.
        - Production-looking
        - Named as a current customer in independent and company-issued 2026 sources.
        - No independently verified outcome metric is disclosed.
      - - T-Mobile
        - Large enterprise
        - Workflow guides tied to training and operational efficiency.
        - Production-looking
        - Named as a current customer in independent and company-issued 2026 sources.
        - Public evidence does not reveal product mix or contract size.
      - - KLN Family Brands
        - Mid-to-large operating team
        - Autocapture used to self-document applications during testing and user demos.
        - Production-looking testimonial
        - Official quote describes an application-level workflow documentation use case.
        - Only company-issued evidence is available in the assigned pool.
    notes: >-
      Rows include only named deployments surfaced in the assigned pool's retained
      sources; logo pages without explicit use context are excluded.
    enumerationScope:
      coverage: partial
      basis: >-
        Named-customer subset from the assigned worker pool only; not an exhaustive
        list of all Scribe customers or references.
    claimRefs: [CU007, CU010]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Scribe appears to land through low-friction workflow capture, then expand
      toward shared process infrastructure and enterprise commercialization.
    data:
      items:
        - label: Discovery through process-documentation pain
          actor: Individual operator or team lead
          phase: Discovery
          touchpoints:
            - Get Scribe Free
            - Document any process
            - Browser-extension capture
        - label: First workflow capture
          actor: Initial product user
          phase: Activation
          touchpoints:
            - Browser-based apps and processes
            - Auto-generated step-by-step guide
            - First Scribe shared in minutes
        - label: Team sharing and repeat use
          actor: Teammates or clients
          phase: Early collaboration
          touchpoints:
            - Share by link or export
            - Teammates or clients consume guides
            - Shared workspace navigation
        - label: Department standardization
          actor: Ops, IT, enablement, or business-app owner
          phase: Expansion
          touchpoints:
            - Context layer across teams
            - Application self-documentation
            - Insights / Optimize surfaces
        - label: Large-enterprise procurement
          actor: Buyer committee and enterprise AE
          phase: Commercial scale
          touchpoints:
            - 10,000+ employee accounts
            - Six-figure ARR deals
            - Roughly 90-day sales cycles
        - label: AI upsell under governance review
          actor: AI, security, and process owners
          phase: Expansion risk
          touchpoints:
            - Scribe AI available to all users
            - Context for AI agents
            - Higher proof burden on audit and surveillance concerns
    approximationNotes: >-
      Sequence is inferred from assigned product, support, sales, and adjacent
      category sources; it represents likely motion rather than a company-disclosed funnel.
    claimRefs: [CU001, CU002, CU006, CU008, CU012, CU014]
callouts:
  - calloutType: strength
    title: Breadth before depth
    body: >-
      The public record suggests Scribe has already achieved broad workflow
      awareness and a real enterprise sales motion; the diligence question is
      less "can it land?" and more "how reliably does it convert and expand?"
    claimRefs: [CU003, CU005, CU006, CU007]
  - calloutType: risk
    title: Durability is still under-disclosed
    body: >-
      Public customer evidence still lacks cohort retention, renewal, attach,
      and concentration data, and Scribe's AI-branded upsell enters a category
      that carries extra governance and compliance scrutiny.
    claimRefs: [CU011, CU012, CU013, CU014]
