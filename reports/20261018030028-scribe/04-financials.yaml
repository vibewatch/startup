  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Realized ASP, discounting, implementation fees, and AI or Optimize attach rates by customer segment.
    whyItMatters: List pricing can overstate revenue quality if most ARR comes from discounted enterprise contracts or low-attach feature bundles.
    diligencePath: Request board or operating-review pricing waterfalls, cohort expansion data, and contract samples by segment.
    relatedQuestionRefs:
    - QI001
    - QI002
    relatedTableRefs:
    - TI001
    - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, CAC, payback, net revenue retention, and product-level service or support burden.
    whyItMatters: Without unit economics, investors cannot judge whether ARR scale is compounding efficiently or masking a margin problem.
    diligencePath: Request monthly KPI decks with gross-margin bridge, CAC by segment, payback, and NRR by cohort.
    relatedQuestionRefs:
    - QI003
    - QI004
    - QI008
    relatedTableRefs:
    - TI003
  - type: conflicting-data
    severity: material
    topic: traction-reconciliation
    missingEvidence: A reconciled metric tree linking users, employees with the app, free organizations, paying organizations, and customers.
    whyItMatters: Unreconciled denominators make it hard to model free-to-paid conversion, seat density, and the true scale of monetized usage.
    diligencePath: Ask management for the exact definitions and time stamps behind each public traction metric, plus a current paid-seat bridge.
