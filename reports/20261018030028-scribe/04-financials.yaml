  - - CAC / payback / NRR
    - null
    - Low
    - These metrics are needed to underwrite efficient growth and retention durability.
    - Provide CAC by segment, payback period, and net revenue retention.
  - - Cash / burn / runway
    - null
    - Low
    - A past valuation and funding total do not establish current capital adequacy.
    - Provide cash balance, monthly burn, runway, and financing triggers.
