company:
  name: Scribe
chapter:
  number: 4
  title: Financials
  summary: 'Scribe has a legible top-of-funnel software monetization model — free capture, paid seat tiers, enterprise governance, and newer AI or workflow-analysis upsells — and Forbes reported a $100 million ARR milestone in April 2026. The underwriting problem is that public evidence still stops well above gross profit: list pricing is visible, but realized pricing, product mix, burn, runway, CAC, payback, and margin data remain undisclosed.'
sections:
- id: monetization-model
  title: Monetization model and pricing surface
  body: 'The public evidence supports a software-style monetization stack built around workflow capture and documentation. Official product surfaces show that Scribe''s core value starts with auto-generated guides, then layers paid capabilities such as desktop capture, screenshot editing, redaction, exports, and governance controls on top of that base. Third-party pricing review keeps the list-price ladder unusually visible for a private company: Basic is free, Pro Personal carries an individual seat price, Pro Team lowers seat pricing but imposes a five-seat floor, and Enterprise remains custom. That structure implies that Scribe can monetize both self-serve creators and governed enterprise rollouts, while Scribe AI or Pages functions more like a usage-expanding upsell than a mandatory prerequisite for adoption.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI011
  - CI013
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: traction-and-unit-economics
  title: Public traction is visible; unit economics are not
  body: 'Forbes gives the clearest public financial signal by saying Scribe crossed $100 million in annualized recurring revenue in April 2026 and that contracts range from low-dollar subscriptions to five- and seven-figure enterprise deals. That indicates meaningful revenue scale and a broad contract ladder, but it does not reveal how much of the business sits in free distribution, low-end paid seats, large enterprise contracts, or newer products such as Optimize. Public traction counts also need care: the evidence cites 5 million to 6 million users or employees, 600,000 free-version organizations, and roughly 78,000 to 80,000 paying or customer organizations without reconciling those denominators. For underwriting, the missing bridge is not top-line interest; it is conversion quality, realized ASP, renewal durability, and margin contribution by product line.'
  claimRefs:
  - CI006
  - CI007
  - CI008
  - CI009
  - CI010
  - CI012
  tableRefs:
  - TI003
- id: capital-adequacy-and-verdict
  title: Capital adequacy remains a diligence blocker
  body: 'The retained sources are enough to say Scribe has reached real scale and raised capital at a unicorn valuation, but they are not enough to underwrite cash needs. A reported $1.3 billion November 2025 valuation and $122 million-plus funding history do not tell investors what cash remained on hand as of October 2026, how quickly the company is burning, whether AI or workflow-analysis products expand or compress gross margin, or when management would need another financing event. The most decision-useful public negative signal is strategic rather than accounting-based: workflow recording sits close to employee-surveillance concerns, and Forbes also describes the category as rapidly commoditizing. The financial verdict is therefore positive on revenue-model legibility and negative on margin-path confidence until management provides cohort, pricing-realization, and runway evidence.'
  claimRefs:
  - CI010
  - CI014
  - CI015
