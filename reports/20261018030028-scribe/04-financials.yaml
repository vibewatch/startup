    - $100M annualized recurring revenue reported for April 2026
    - Medium
    - Establishes top-line relevance and late-stage expectations.
    - Reconcile ARR to GAAP revenue, deferred revenue, and segment mix.
  - - Contract-size ladder
    - $20 subscriptions to five- to seven-figure contracts
    - Medium
    - Shows potential for land-and-expand economics but not typical deal size.
    - Provide ACV distribution, sales cycle, and win-rate by segment.
  - - Free versus paid footprint
    - 600,000 free-version organizations plus 78,000 to 80,000 paying or customer organizations reported publicly
    - Medium
    - Conversion quality and paid penetration determine revenue durability.
    - Provide paid-account definition, conversion rate, and active-seat penetration.
  - - Gross margin
    - null
    - Low
    - Without gross margin, investors cannot judge whether AI or services expand or dilute software economics.
