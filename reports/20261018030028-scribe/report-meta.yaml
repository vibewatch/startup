companyProfile:
  summary: >-
    Scribe is a workflow-capture and process-documentation company that is being repositioned as a context layer for AI
    agents and enterprise workflow intelligence. The product base is well-evidenced, and the company now pairs that core
    with broader automation and AI-agent messaging, but public scale signals still mix users, organizations, customers,
    and employees in ways that require management reconciliation.
