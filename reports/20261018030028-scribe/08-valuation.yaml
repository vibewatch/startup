  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: revenue-quality
      missingEvidence: Audited ARR, net revenue retention, gross margin, burn, runway, and cohort churn by segment.
      whyItMatters: Those metrics determine whether Scribe merits a premium private multiple or should be underwritten at a discount.
      diligencePath: Request the latest board deck, audited or reviewed financials, cohort retention tables, and monthly KPI history.
      relatedQuestionRefs: [QV002, QV006, QV009]
    - type: private-evidence-only
      severity: material
      topic: cap-table-and-preferences
      missingEvidence: Liquidation preferences, participation terms, option-pool refreshes, debt or structured capital, and any other preference overhang.
      whyItMatters: Entry price alone does not determine realized returns if the security stack redistributes proceeds away from new investors.
      diligencePath: Review the cap table, financing documents, and any side letters or debt facilities with counsel.
      relatedQuestionRefs: [QV001, QV006, QV009]
    - type: conflicting-data
      severity: material
      topic: usage-to-paid-conversion
      missingEvidence: A reconciled bridge between 5M+ users, 600,000 organizations, 78,000 paying organizations, and any 6M+ employee usage claims.
      whyItMatters: The valuation case depends on understanding how broad adoption maps to paying customers and durable monetization.
      diligencePath: Request the active-user, free-to-paid, and enterprise-account reconciliation used internally for investor reporting.
      relatedQuestionRefs: [QV002, QV008]
    - type: missing-source
