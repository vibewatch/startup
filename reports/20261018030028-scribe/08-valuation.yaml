    summary: Evidence chain from traction and product breadth to a research-more call.
    data:
      nodes:
        - id: scale
          label: Scale proof
          value: "5M+ users; 94% of Fortune 500"
          note: "Official 2025 financing materials establish broad reach."
          tone: opportunity
        - id: monetization
          label: Monetization proof
          value: "$100M ARR reported; $20 to seven-figure contracts"
          note: "Independent reporting shows real paid revenue, but only limited public detail."
          tone: opportunity
        - id: product
          label: Product expansion
          value: "Optimize, Scribe AI, MCP/API support"
          note: "The roadmap extends beyond static documentation into workflow intelligence and AI enablement."
          tone: opportunity
        - id: opacity
          label: Underwriting opacity
          value: "No public retention, margin, burn, or preference stack"
          note: "Key pricing and return variables remain outside the public record."
          tone: risk
        - id: downside
          label: Downside triggers
          value: "Multiple compression, weak conversion, privacy friction"
          note: "The workflow-capture narrative can cut both ways in enterprise buying."
          tone: risk
        - id: call
          label: Recommendation
          value: "Research more / stretched / high risk"
          note: "Only private diligence or better entry terms would justify a more aggressive call."
          tone: high
      edges:
        - from: scale
          to: monetization
          relationship: "Usage breadth needs to translate into durable paid economics."
        - from: monetization
          to: product
          relationship: "The next leg of upside depends on Optimize and AI-feature monetization."
        - from: product
          to: opacity
          relationship: "Expansion ambition outpaces what the public record discloses."
        - from: opacity
          to: downside
          relationship: "Missing underwriting data increases sensitivity to adverse execution or governance outcomes."
        - from: downside
          to: call
          relationship: "That mix supports strict entry discipline instead of a buy call."
    claimRefs: [CV005, CV006, CV008, CV009, CV011, CV012, CV016]
callouts:
  - calloutType: recommendation
    title: Public-evidence call
    body: >-
      Scribe looks like a credible company with a real enterprise workflow product set, but
      the evidence still supports research-more rather than buy at or above the last
      disclosed round benchmark.
    claimRefs: [CV001, CV006, CV011, CV012]
  - calloutType: risk
    title: Main downside to the price
    body: >-
      The biggest underwriting risk is not whether Scribe has customers; it is whether
      public traction signals overstate the durability, margin quality, and conversion of
      that growth once investor protections and workflow-capture governance are considered.
    claimRefs: [CV007, CV011, CV012, CV016]
  - calloutType: assumption
    title: What would improve the stance
    body: >-
      A stronger recommendation would require private evidence on ARR quality, net
      retention, burn, gross margin, customer concentration, and liquidation preferences,
      plus proof that Optimize expands contract value rather than merely refreshing the story.
    claimRefs: [CV003, CV010, CV015]
