schemaVersion: report-v2
artifact: valuation
slug: scribe
runDate: 2026-10-18
company:
  name: Scribe
chapter:
  number: 8
  title: Valuation
  summary: >-
    Scribe has credible scale, a fresh $75 million Series C at a $1.3 billion valuation,
    and a potentially valuable AI workflow-data wedge, but the public record still does
    not disclose enough quality-of-revenue or cap-table detail to underwrite that price
    aggressively. The evidence supports a research-more recommendation, medium confidence,
    high risk, and a stretched valuation stance until private diligence proves durable paid
    expansion, retention, and preference economics.
sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      The public record supports a cautious, price-sensitive call rather than a buy
      recommendation. Scribe's November 2025 round established a $1.3 billion benchmark
      and management paired that raise with a coherent story around Workflow AI, Scribe
      Optimize, and broad enterprise reach. Independent reporting adds a helpful signal:
      Forbes said Scribe crossed $100 million in annualized recurring revenue in April
      2026 and monetizes from low-ticket subscriptions to five- to seven-figure contracts.
      That is meaningful proof of commercialization, but it is still not enough to defend
      an aggressive entry without audited ARR quality, retention, gross margin, burn,
      runway, or preference terms. Because the upside case depends on how efficiently
      Scribe converts wide usage and new AI workflow products into durable paid expansion,
      the evidence favors research-more at or above the last disclosed round price.
    claimRefs: [CV001, CV006, CV007, CV011, CV012, CV015]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-anti-thesis
    title: Thesis and anti-thesis
    body: >-
      The best part of the thesis is that Scribe appears to have a real wedge at the
      intersection of documentation, workflow visibility, and AI enablement. Company
      materials consistently describe a base product that captures work as it happens,
      premium and enterprise features for desktop capture and governance, and newer
      capabilities that push from static documentation toward workflow analysis and AI
      agent enablement. That supports a view that the company is trying to monetize not
      only knowledge capture, but also the data layer behind enterprise process change.
      The anti-thesis is that valuation may already assume a large share of that upside:
      only one retained independent source provides ARR context, the company-controlled
      sources still do not publish retention or margin evidence, and the same workflow
      capture narrative can trigger surveillance sensitivity if governance is not handled
      carefully. The call therefore depends more on private diligence and entry price than
      on company quality alone.
    claimRefs: [CV002, CV003, CV008, CV009, CV011, CV012, CV016]
    tableRefs: [TV002]
  - id: financing-context-and-scenarios
    title: Financing context and scenarios
    body: >-
      The latest disclosed financing event gives a useful anchor but not a complete
      valuation model. Scribe said the Series C was led by StepStone at a $1.3 billion
      valuation and that the capital would fund enterprise go-to-market and the rollout
      of Scribe Optimize. Forbes later reported more than $100 million of ARR and a broad
      contract range, which is directionally supportive, while Silicon Valley Investclub
      notes that EV-to-revenue was not disclosed for any round and offers only loose
      public SaaS IPO yardsticks. That means the scenario analysis should stay explicit
      about what must be true to justify a premium, a flat, or a discounted outcome
      versus the last round. Until Scribe can show durable retention, margin quality,
      and the paid conversion path from broad usage into Optimize and enterprise deals,
      a flat-to-discount framing is easier to defend than a premium case.
    claimRefs: [CV001, CV002, CV006, CV007, CV010, CV011, CV013, CV014]
    tableRefs: [TV003]
  - id: diligence-gates-and-exit-readiness
    title: Diligence gates and exit readiness
    body: >-
      Scribe looks more exit-ready on narrative coherence than on public underwriting
      completeness. The company can point to scale, known enterprise logos, AI product
      launches, and a current story about helping teams and AI agents work from captured
      process knowledge. What the public record still lacks is the evidence investors need
      to convert that story into conviction on terms: audited ARR and net retention by
      cohort, gross margin and burn quality, paid conversion from free and broad
      organizational usage, attach rates for Optimize and other premium products, customer
      concentration, and the liquidation-preference or other preference overhang that
      would shape realized returns. The recommendation should only improve after that data
      confirms that the business compounds fast enough to outrun both multiple
      compression and governance or privacy friction around workflow capture.
    claimRefs: [CV008, CV009, CV011, CV012, CV015, CV016]
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Evidence
      - Decision implication
    rows:
      - [Recommendation, research-more, "Credible traction and product breadth, but underwriting gaps remain.", "Do not stretch on price without private diligence."]
      - [Confidence, medium, "Official and independent sources agree on scale and the last round, but not on revenue quality or cap-table economics.", "Use management access and data-room diligence before committing."]
      - [Risk rating, high, "Upside depends on monetizing broad usage while managing privacy, execution, and valuation opacity.", "Size exposure conservatively and require downside protection."]
      - [Valuation stance, stretched, "The last disclosed benchmark is $1.3B, while public EV/revenue support and preference terms remain undisclosed.", "Prefer flat-to-discount entry versus the last round."]
      - [Entry discipline, strict, "A better call needs validated ARR quality, retention, margin, burn, and preference data.", "Advance only if private diligence closes those gaps."]
    notes: >-
      Synthesizes retained sources into an investment call; recommendation terms are analyst
      judgments, while factual anchors are the disclosed round, product claims, and the
      limited independent revenue context.
    claimRefs: [CV001, CV006, CV007, CV011, CV012, CV015]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Side
      - Argument
      - What would change the view
    rows:
      - [Thesis, "Workflow capture plus Optimize suggests Scribe is moving from documentation software toward an AI workflow-data layer with measurable ROI claims.", "Independent proof that Optimize drives paid expansion or larger contract values would strengthen this."]
      - [Thesis, "Broad reach claims—5M+ users, 94% of Fortune 500, and large enterprise logos—support distribution breadth and category relevance.", "Cohort-level paid conversion and retention data would confirm that usage breadth turns into durable revenue."]
      - [Anti-thesis, "The public record still does not disclose enough revenue-quality, margin, or preference detail to justify paying up confidently at the last round benchmark.", "Audited ARR, NRR, gross margin, and cap-table economics could narrow the discount."]
      - [Anti-thesis, "Workflow capture can be framed as surveillance-adjacent software, which could slow enterprise rollout if governance is weak.", "Customer references, privacy controls in practice, and incident-free deployment evidence would reduce this risk."]
    notes: >-
      Pairs the strongest upside logic with the clearest disconfirming evidence and names
      the incremental proof needed to change the recommendation.
    claimRefs: [CV003, CV005, CV008, CV009, CV011, CV012, CV016]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "ARR growth remains strong above the reported $100M run rate, Optimize monetizes into larger enterprise contracts, and workflow data becomes a differentiated AI moat.", "A premium to the last disclosed $1.3B round could be supportable only if private diligence shows strong retention, margins, and clean preference terms.", "Optimize attach stays low or privacy concerns limit deployment.", "Would require new third-party evidence of durable paid expansion."]
      - [Base, "Scribe sustains meaningful enterprise demand, but the monetization bridge from broad usage to premium workflow intelligence remains only partly proven.", "A flat to modest discount versus the last round is easier to defend while public multiples and private terms remain opaque.", "Growth slows, but the company still supports a viable private-market outcome.", "Best matches the current mix of official traction claims and limited independent revenue evidence."]
      - [Bear, "The market applies multiple compression, Optimize fails to widen monetization materially, or governance/privacy pushback slows rollout.", "A down-round or structured financing below the last disclosed benchmark becomes plausible if private diligence does not validate quality-of-revenue.", "Preference overhang or weak retention further compresses realized returns.", "Becomes more likely if data-room evidence does not reconcile conversion, churn, and cap-table terms."]
    notes: >-
      Scenario bands are directional and anchored to the last disclosed $1.3B post-money
      benchmark because public EV/revenue support, retention, and preference disclosures
      remain incomplete.
    claimRefs: [CV001, CV006, CV007, CV010, CV011, CV012, CV014, CV015, CV016]
figures:
  - id: FV001
    title: Recommendation logic
