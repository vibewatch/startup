evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: scale-metrics
    missingEvidence: >-
      A management bridge that reconciles users, employees with the app, free organizations, paid organizations, and
      customers across 2025-2026 disclosures.
    whyItMatters: Customer count and user depth drive retention assumptions, monetization, and credible valuation benchmarking.
    diligencePath: >-
      Request a KPI pack defining each metric, the paid/free split, and the month-end timestamp for every cited
      disclosure.
  - type: enumeration-incomplete
    severity: material
    topic: leadership and founder table coverage
    missingEvidence: A current executive and board roster with role ownership, committee seats, and any recent turnover.
    whyItMatters: >-
      Founder concentration, succession depth, and governance quality cannot be judged from two founders plus one named
      sales leader.
    diligencePath: Collect the board deck, org chart, and investor rights summary; verify against management interviews.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder or investor map coverage
    missingEvidence: >-
      Round-by-round cap table, preference stack, ownership percentages, and any debt, secondaries, or SAFE/convertible
      overhang.
    whyItMatters: >-
      The public financing narrative does not reveal control rights or economic seniority at the current valuation
      anchor.
    diligencePath: Request the cap table, stock purchase agreements, side letters, and debt schedule.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-quality
    missingEvidence: Audited revenue, gross margin, burn, runway, NRR, and segment mix.
    whyItMatters: Forbes supports ARR, but valuation diligence still needs margin quality, efficiency, and cash durability.
    diligencePath: Request audited financial statements, cohort-level retention reporting, and board KPI packs.
  - type: missing-source
    severity: minor
    topic: company-specific incident and regulatory history
    missingEvidence: >-
      Company-specific public incident logs, SLA-credit disclosures, and formal regulatory or litigation records tied
      directly to Scribe's workflow-capture product.
    whyItMatters: >-
      Category-level privacy and audit sensitivity exists, but absence of a retained company-specific incident should
      not be treated as proof of absence.
    diligencePath: >-
      Ask management for security incident history, customer escalations, and litigation/regulatory correspondence since
      launch.
  - type: missing-source
    severity: material
    topic: tam-denominator
    missingEvidence: >-
      An independent spend-based TAM, SAM, or SOM for workflow documentation and workflow-intelligence software that
      matches Scribe's actual category.
    whyItMatters: >-
      Without a comparable denominator, public valuation debates can overstate upside by leaning on adoption anecdotes
      or adjacent category reports.
    diligencePath: >-
      Obtain analyst coverage or customer budget studies that isolate documentation, guidance, and workflow-intelligence
      spend by segment and geography.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: monetization-mix
    missingEvidence: >-
      Segment-level customer counts, ARR mix, and attach rates for Capture, enterprise governance, and Optimize or
      AI-agent products.
    whyItMatters: >-
      Expansion logic is central to the thesis, but public evidence does not show how much revenue comes from the
      higher-value layers.
    diligencePath: >-
      Request cohort revenue bridges, product attach rates, and enterprise contract segmentation in management
      diligence.
    relatedQuestionRefs:
      - QM003
      - QM005
    relatedTableRefs:
      - TM002
      - TM003
  - type: missing-source
    severity: minor
    topic: buyer-budget-owner
    missingEvidence: >-
      Public procurement or customer case-study detail that names the budget owner and approval chain for large Scribe
      deployments.
    whyItMatters: >-
      Budget ownership affects sales-cycle length, resilience versus suite competition, and the repeatability of
      expansion into AI or operations budgets.
    diligencePath: >-
      Review enterprise case studies, procurement records, or customer interviews that identify the initial sponsor,
      economic buyer, and renewal owner.
    relatedQuestionRefs:
      - QM004
      - QM006
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: enterprise-pricing
    missingEvidence: Realized enterprise contract pricing, discounting, and Scribe Optimize attach rates by customer segment.
    whyItMatters: >-
      The competitive model changes if enterprise controls and Optimize can be sold incrementally below the public
      enterprise bundle.
    diligencePath: Request the current price book, sample enterprise order forms, and attach-rate data for Capture versus Optimize.
    relatedQuestionRefs:
      - QP005
  - type: private-evidence-only
    severity: material
    topic: switching-cost
    missingEvidence: >-
      Retention, seat expansion, multi-homing, and renewal cohorts against Tango, Guidde, Loom, and internal
      documentation substitutes.
    whyItMatters: >-
      Public product pages imply switching cost, but moat durability cannot be underwritten without evidence that buyers
      stay after rollout instead of layering Scribe beside substitutes.
    diligencePath: >-
      Review churn cohorts, win-loss notes, and product telemetry on guide reuse, pinned guidance usage, and Optimize
      adoption.
    relatedQuestionRefs:
      - QP006
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Realized ASP, discounting, implementation fees, and AI or Optimize attach rates by customer segment.
    whyItMatters: >-
      List pricing can overstate revenue quality if most ARR comes from discounted enterprise contracts or low-attach
      feature bundles.
    diligencePath: Request board or operating-review pricing waterfalls, cohort expansion data, and contract samples by segment.
    relatedQuestionRefs:
      - QI001
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, CAC, payback, net revenue retention, and product-level service or support burden.
    whyItMatters: >-
      Without unit economics, investors cannot judge whether ARR scale is compounding efficiently or masking a margin
      problem.
    diligencePath: Request monthly KPI decks with gross-margin bridge, CAC by segment, payback, and NRR by cohort.
    relatedQuestionRefs:
      - QI003
      - QI004
      - QI008
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: traction-reconciliation
    missingEvidence: >-
      A reconciled metric tree linking users, employees with the app, free organizations, paying organizations, and
      customers.
    whyItMatters: >-
      Unreconciled denominators make it hard to model free-to-paid conversion, seat density, and the true scale of
      monetized usage.
    diligencePath: >-
      Ask management for the exact definitions and time stamps behind each public traction metric, plus a current
      paid-seat bridge.
    relatedQuestionRefs:
      - QI003
      - QI005
    relatedTableRefs:
      - TI001
      - TI003
  - type: missing-source
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash balance, monthly burn, runway, debt facilities, covenant triggers, and management's next-round plan.
    whyItMatters: >-
      A past financing round and reported valuation do not establish whether Scribe can self-fund growth or needs
      external capital on a specific timeline.
    diligencePath: Request the latest cash bridge, debt agreements, budget versus actuals, and board-approved financing plan.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: trust-telemetry
    missingEvidence: >-
      Customer-visible incident history, status-page export, DPA detail, redaction-behavior proof, and admin audit
      evidence for Autocapture and Optimize.
    whyItMatters: >-
      Passive workflow capture can trigger privacy and surveillance objections, so buyers need proof that controls work
      in production rather than only marketing claims.
    diligencePath: >-
      Request the trust-center package, last-12-month incident log, data-flow diagram, DPA, and a live admin-control
      walkthrough for enterprise deployments.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: optimize-efficacy
    missingEvidence: >-
      Independent case studies, benchmark methodology, attach-rate data, and public pricing for Scribe Optimize and
      Autocapture-led improvement workflows.
    whyItMatters: >-
      Most of the upside case in this chapter depends on Scribe moving from documentation into measurable workflow
      intelligence, but the public record does not yet prove that layer at scale.
    diligencePath: >-
      Ask management for named Optimize customers, before-and-after workflow metrics, commercial packaging, and
      references willing to discuss realized automation ROI.
    relatedTableRefs:
      - TE001
      - TE002
  - type: missing-source
    severity: material
    topic: durability-gap
    missingEvidence: Public NRR, GRR, churn, renewal, contract-length, and cohort data by customer segment.
    whyItMatters: >-
      Without cohort and renewal evidence, the public record cannot distinguish a wide adoption funnel from durable,
      compounding customer value.
    diligencePath: >-
      Request segment-level retention tables, renewal schedules, and expansion cohorts for self-serve, mid-market, and
      large-enterprise customers.
    relatedQuestionRefs:
      - QU006
    relatedTableRefs:
      - TU002
  - type: private-evidence-only
    severity: material
    topic: concentration-risk
