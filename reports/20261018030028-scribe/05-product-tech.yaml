callouts:
  - calloutType: "insight"
    title: "The moat claim is company-specific workflow context"
    body: >-
      Scribe's strongest product narrative is not generic AI writing; it is the claim that
      company-specific workflow capture can power both human training and AI-agent execution from
      the same underlying guide corpus.
    claimRefs: ["CE005", "CE006", "CE007"]
  - calloutType: "risk"
    title: "Optimize proof still trails the pitch"
    body: >-
      The Capture base is concrete, but the higher-value layers—Optimize, Autocapture-driven
      change detection, and AI-agent outcome gains—still lack public benchmark methodology,
      independent case studies, and production-reliability evidence.
    claimRefs: ["CE008", "CE011", "CE014"]
