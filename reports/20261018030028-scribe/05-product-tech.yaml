chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    Scribe has expanded from automatic workflow capture into a broader process-intelligence stack:
    Capture and desktop clients record work, Pages and Scribe AI assemble richer documentation,
    and MCP/API plus Optimize are meant to feed AI agents and automation programs. The platform
    architecture is legible enough to underwrite a real workflow-context product, but public proof
    still lags the pitch on Optimize efficacy, surveillance mitigation, incident history, and the
    exact boundaries of newer AI and Autocapture claims.
sections:
  - id: "workflow-product-scope"
    title: "Workflow capture has become a broader process-document platform"
    body: >-
      Scribe's delivered product is no longer a single browser-extension utility. Current help and
      product pages show a stack that starts with Scribe Capture—automatic browser or desktop
      workflow capture that turns work into step-by-step guides—then expands into Pages for longer
      procedures and Scribe AI for drafting or editing broader process documents around those
      captured guides. Public messaging increasingly frames the output as operational context for
      both people and AI agents, not just screenshots plus instructions. That shift matters because
      the user job moves from "document a task" to "encode institutional workflow knowledge once
      and reuse it across onboarding, support, implementation, and agent orchestration." The open
      commercial question is mix rather than existence: public materials cite 600,000
      organizations, 5 million users, and 80,000 customers, but they do not reconcile which
      products those populations use or pay for.
    claimRefs: ["CE001", "CE003", "CE004", "CE006", "CE007", "CE012"]
    tableRefs: ["TE001", "TE002"]
  - id: "architecture-and-deployment"
    title: "The operating model is endpoint-led and distribution-heavy"
    body: >-
      The public operating model is endpoint-led. Browser capture is available via Chrome and Edge
      extensions on all plans, while desktop capture requires Pro or Enterprise, which implies a
      freemium browser wedge plus paid expansion into harder workflows. Support and marketing
      surfaces show the next layers clearly: guides can be shared by link or export, embedded into
      tools such as Confluence, SharePoint, Notion, Guru, and HubSpot, surfaced as on-screen
      walkthroughs, and exposed to AI assistants through MCP or API. That is enough to draw a real
      product architecture: capture clients feed structured guides, guides feed longer-form
      documents, and those documents feed downstream knowledge and agent surfaces. What remains
      thin is the engineering disclosure under that architecture—no public API limits, integration
      catalog depth, model-evaluation framework, or status-history evidence for the newer AI and
      Autocapture surfaces.
    claimRefs: ["CE001", "CE002", "CE005", "CE009", "CE011", "CE014"]
    tableRefs: ["TE003"]
    figureRefs: ["FE001"]
  - id: "differentiation-trust-and-maturity"
    title: "Differentation depends on Optimize, while trust proof remains shallow"
    body: >-
      Differentiation now hinges on Scribe Optimize, not on the legacy guide generator alone.
      Forbes and AloneReaders both describe a two-product stack in which Capture records work while
      Optimize analyzes workflow data to identify bottlenecks and automation ROI, pushing Scribe
      toward a process-intelligence narrative instead of a pure documentation SKU. That creates
      upside, but also the sharpest diligence risks. Public trust materials emphasize redaction,
      domain controls, IP whitelisting, and compliance badges, yet Forbes still places Scribe in a
      category adjacent to worker-surveillance "bossware" and notes that customers had to manage
      employee perception carefully. Likewise, current marketing around Autocapture, workflow-change
      alerts, and AI-agent performance is directionally interesting but not backed by published
      benchmark methodology, incident logs, or independent case studies. Compared with ambient
      clinical AI scribes that listen to conversations and generate notes, Scribe is clearly a
      workflow-capture platform; the open question is how durable and governable the newer
      intelligence layer really is.
    claimRefs: ["CE007", "CE008", "CE009", "CE010", "CE011", "CE013", "CE014"]
