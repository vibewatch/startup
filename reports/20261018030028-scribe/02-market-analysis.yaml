  evidenceGaps:
    - type: missing-source
      severity: material
      topic: tam-denominator
      missingEvidence: An independent spend-based TAM, SAM, or SOM for workflow documentation and workflow-intelligence software that matches Scribe's actual category.
      whyItMatters: Without a comparable denominator, public valuation debates can overstate upside by leaning on adoption anecdotes or adjacent category reports.
      diligencePath: Obtain analyst coverage or customer budget studies that isolate documentation, guidance, and workflow-intelligence spend by segment and geography.
      relatedQuestionRefs: [QM007]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: monetization-mix
      missingEvidence: Segment-level customer counts, ARR mix, and attach rates for Capture, enterprise governance, and Optimize or AI-agent products.
      whyItMatters: Expansion logic is central to the thesis, but public evidence does not show how much revenue comes from the higher-value layers.
      diligencePath: Request cohort revenue bridges, product attach rates, and enterprise contract segmentation in management diligence.
      relatedQuestionRefs: [QM003, QM005]
      relatedTableRefs: [TM002, TM003]
    - type: missing-source
      severity: minor
      topic: buyer-budget-owner
      missingEvidence: Public procurement or customer case-study detail that names the budget owner and approval chain for large Scribe deployments.
      whyItMatters: Budget ownership affects sales-cycle length, resilience versus suite competition, and the repeatability of expansion into AI or operations budgets.
      diligencePath: Review enterprise case studies, procurement records, or customer interviews that identify the initial sponsor, economic buyer, and renewal owner.
      relatedQuestionRefs: [QM004, QM006]
      relatedTableRefs: [TM003]
