      - ["Self-serve documentation teams", "Department lead or individual manager", "Frontline operators and subject-matter experts", "Team or individual software budget", "Capture browser-based processes and share guides", "Functional manager", "Manual documentation is slow and inconsistent"]
      - ["Structured onboarding and training", "Enablement or learning leader", "New hires, trainers, customer-facing teams", "Departmental enablement budget", "Bundle guides, pages, and walkthroughs into repeatable onboarding", "Enablement / L&D", "Faster ramp time and fewer repeat explanations"]
      - ["Enterprise process governance", "IT admin, business systems, or operations lead", "Cross-functional teams working in multiple apps", "Centralized software or operations budget", "Desktop capture, governance, redaction, SSO, compliance, and approval flows", "IT / operations", "Need for control, security, and scale across many teams"]
      - ["Workflow intelligence and AI-agent context", "Automation or transformation leader", "Analysts, process owners, internal AI builders", "Transformation or innovation budget", "Use captured workflows as context for AI assistants, agents, and optimization", "Operations excellence / enterprise IT", "Need to make company-specific workflows legible to humans and agents"]
    notes: "Buyer and budget-owner fields are inferred from public product positioning and feature packaging because public procurement records were not retained in the assigned pool."
    claimRefs: [CM003, CM006, CM010, CM011, CM012]
figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      The retained evidence supports a demand ladder built from adoption and contract signals,
      not a single clean TAM/SAM/SOM waterfall.
    data:
      items:
        - label: Excluded ambient AI scribe adjacency
          displayValue: "$1.75B in 2025"
          note: "Global healthcare documentation market; not a valid proxy for Scribe's workflow-documentation spend"
          claimRefs: [CM005]
        - label: Official organization reach
          displayValue: "500,000+ to 600,000 organizations"
          note: "Company-issued usage and trust counts across different official surfaces"
          claimRefs: [CM008]
        - label: Paying customer base
          displayValue: "≈78,000–80,000"
          note: "Independent sources, current-year company scale indicator"
          claimRefs: [CM007]
        - label: Installed / workflow footprint
          displayValue: "6M employees; 15M workflows"
          note: "Independent usage observation plus workflow corpus size"
          claimRefs: [CM008]
        - label: Enterprise penetration signal
          displayValue: "94% of Fortune 500"
          note: "Official enterprise reach claim, useful as market validation but not spend"
          claimRefs: [CM008]
        - label: Contract-size ceiling
          displayValue: "5- to 7-figure deals"
          note: "Evidence that Scribe reaches meaningful enterprise budget pools"
          claimRefs: [CM009]
    approximationNotes: >-
      Layers are intentionally non-additive and mix adoption, monetization, and excluded-adjacent
      market signals; the pyramid orders the best public sizing lenses rather than implying one
      reconciled denominator.
    claimRefs: [CM013]
callouts:
  - calloutType: insight
    title: Expansion logic is credible, but conventional TAM proof is weak
    body: >-
      The public record supports real customer demand and enterprise budget capture, yet it does
      not publish a spend-based TAM/SAM/SOM for Scribe’s exact category. That makes adoption,
      contract size, and workflow-intelligence expansion the more credible underwriting lens.
    claimRefs: [CM007, CM008, CM009]
  - calloutType: risk
    title: Market timing depends on trust and platform access, not just documentation pain
    body: >-
      Scribe’s value proposition improves when buyers accept workflow capture as helpful context
      rather than surveillance and when browser, desktop, and application ecosystems remain open
      enough to observe work reliably. Those constraints can slow penetration even if the product
      is useful.
    claimRefs: [CM010, CM011]
