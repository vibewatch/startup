schemaVersion: "report-v2"
artifact: market-analysis
slug: scribe
runDate: 2026-10-18
company:
  name: Scribe
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Scribe’s supported market is workflow documentation, enablement, in-product guidance,
    and workflow-intelligence tooling that sits on top of existing business software, not the
    separate clinical ambient-scribe category that public market reports often measure. Public
    evidence shows meaningful adoption and enterprise monetization, but it does not supply a
    clean external TAM/SAM/SOM denominator, so valuation support rests more on expansion and
    budget capture signals than on a single category-size statistic.
sections:
  - id: market-boundary
    title: "Market boundary: workflow documentation, not clinical ambient scribing"
    body: >-
      Scribe’s retained evidence supports a market boundary that is narrower than generic
      knowledge management but broader than simple screen recording. Across company and
      independent descriptions, the product captures work as it happens and turns the output
      into step-by-step guides, then layers editing, redaction, governance, translation, and
      in-context delivery on top. That means the included spend is workflow documentation, SOP
      creation, onboarding and training content, in-workflow guidance, and the newer
      workflow-intelligence layer that feeds AI assistants or automation programs. It does not
      justify importing “AI scribe” healthcare TAMs: those sources describe clinician note
      generation, coding integrity, and reimbursement workflows, which are adjacent only
      because they share the word “scribe,” not because they map to the same buyer, workflow,
      or budget.
    claimRefs: [CM001, CM002, CM004, CM005, CM012]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Public sizing is adoption-rich but denominator-poor
    body: >-
      The strongest market evidence is not a third-party TAM deck; it is a stack of adoption
      and monetization signals. Independent sources place Scribe at roughly $100 million of
      ARR or revenue with about 78,000 to 80,000 paying customers, while official and
      independent sources point to 500,000-plus to 600,000 organizations touched by the
      product, more than 6 million employees with the app on their laptops, and enterprise
      contracts that can reach five to seven figures. Those data points support a real market
      and credible expansion path, but they are not a spend-based denominator. The evidence
      therefore supports a constrained demand ladder rather than a clean TAM/SAM/SOM bridge,
      and investors should treat broad category numbers as directional context instead of a
      valuation proof.
    claimRefs: [CM006, CM007, CM008, CM009, CM013]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-drivers-and-constraints
    title: Buyers span enablement, operations, and enterprise admin teams
    body: >-
      The user is usually the person doing the work, but the economic buyer appears to shift as
      Scribe moves upmarket. The self-serve motion starts with individual capture and sharing,
      yet the public feature set points to broader buyers in enablement, operations, IT, and
      enterprise administration once desktop capture, governance, SSO, compliance controls, and
      AI-agent distribution matter. Growth drivers are straightforward: replacing manual
      documentation, speeding onboarding, surfacing guidance where work happens, and making
      company-specific workflows legible to AI systems. Constraints are equally important for
      timing and valuation: Scribe depends on browser and desktop capture permissions, it must
      prove it is not surveillance software, and it competes against status-quo documentation
      habits plus suite vendors that could embed lighter-weight workflow guidance into broader
      software bundles.
    claimRefs: [CM003, CM010, CM011, CM012]
    tableRefs: [TM003]
