      - ["Forbes", "2026", "Company-level / global footprint", "600,000 organizations on the free version; 6M employees with the app; $20 to 5- to 7-figure contracts", "n/a", "Reported customer and contract observations from a feature on Scribe’s business", "medium", "Adoption and contract-size proxy rather than TAM/SAM/SOM"]
      - ["Scribe official surfaces", "2026", "Company-level / global footprint", "500,000+ organizations; 600,000 organizations; 94% of Fortune 500; 15M workflows across 40,000 apps", "n/a", "Company-issued product and launch materials", "medium", "Useful for reach and positioning, but company-controlled and not directly comparable across metrics"]
      - ["Growth Market Reports", "2025 base / 2026-2034 forecast", "Global", "$1.75B ambient AI scribe market in 2025; $13.8B by 2034", "23.9%", "Vendor market report for healthcare ambient-scribe software", "low", "Adjacent clinical category; excluded from Scribe’s core market boundary"]
    notes: "These lenses are non-additive and use different denominators; they constrain the market discussion but do not form a single comparable TAM/SAM/SOM stack."
    claimRefs: [CM005, CM007, CM008, CM009]
  - id: TM003
