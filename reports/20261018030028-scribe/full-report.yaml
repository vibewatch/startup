  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: workflow documentation, not clinical ambient scribing'
        blocks:
          - type: paragraph
            body: >-
              Scribe’s retained evidence supports a market boundary that is narrower than generic knowledge management
              but broader than simple screen recording. Across company and independent descriptions, the product
              captures work as it happens and turns the output into step-by-step guides, then layers editing, redaction,
              governance, translation, and in-context delivery on top. That means the included spend is workflow
              documentation, SOP creation, onboarding and training content, in-workflow guidance, and the newer
              workflow-intelligence layer that feeds AI assistants or automation programs. It does not justify importing
              “AI scribe” healthcare TAMs: those sources describe clinician note generation, coding integrity, and
              reimbursement workflows, which are adjacent only because they share the word “scribe,” not because they
              map to the same buyer, workflow, or budget.
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM005
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM005
              - CM012
      - number: '2.2'
        title: Public sizing is adoption-rich but denominator-poor
        blocks:
          - type: paragraph
            body: >-
              The strongest market evidence is not a third-party TAM deck; it is a stack of adoption and monetization
              signals. Independent sources place Scribe at roughly $100 million of ARR or revenue with about 78,000 to
              80,000 paying customers, while official and independent sources point to 500,000-plus to 600,000
              organizations touched by the product, more than 6 million employees with the app on their laptops, and
              enterprise contracts that can reach five to seven figures. Those data points support a real market and
              credible expansion path, but they are not a spend-based denominator. The evidence therefore supports a
              constrained demand ladder rather than a clean TAM/SAM/SOM bridge, and investors should treat broad
              category numbers as directional context instead of a valuation proof.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM013
      - number: '2.3'
        title: Buyers span enablement, operations, and enterprise admin teams
        blocks:
          - type: paragraph
            body: >-
              The user is usually the person doing the work, but the economic buyer appears to shift as Scribe moves
              upmarket. The self-serve motion starts with individual capture and sharing, yet the public feature set
              points to broader buyers in enablement, operations, IT, and enterprise administration once desktop
              capture, governance, SSO, compliance controls, and AI-agent distribution matter. Growth drivers are
              straightforward: replacing manual documentation, speeding onboarding, surfacing guidance where work
              happens, and making company-specific workflows legible to AI systems. Constraints are equally important
              for timing and valuation: Scribe depends on browser and desktop capture permissions, it must prove it is
              not surveillance software, and it competes against status-quo documentation habits plus suite vendors that
              could embed lighter-weight workflow guidance into broader software bundles.
            claimRefs:
              - CM003
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM006
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Expansion logic is credible, but conventional TAM proof is weak
            body: >-
              The public record supports real customer demand and enterprise budget capture, yet it does not publish a
              spend-based TAM/SAM/SOM for Scribe’s exact category. That makes adoption, contract size, and
              workflow-intelligence expansion the more credible underwriting lens.
            calloutType: insight
            claimRefs:
              - CM007
              - CM008
              - CM009
          - type: callout
            title: Market timing depends on trust and platform access, not just documentation pain
            body: >-
              Scribe’s value proposition improves when buyers accept workflow capture as helpful context rather than
              surveillance and when browser, desktop, and application ecosystems remain open enough to observe work
              reliably. Those constraints can slow penetration even if the product is useful.
            calloutType: risk
            claimRefs:
              - CM010
              - CM011
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers are only one slice of the buying set'
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence points to a market where Scribe is not competing only against capture-first peers.
              Scribe's own alternatives page groups substitutes across capture-first recorders, SOP and training
              systems, video-first tools, and in-app guidance products, while ClearWork argues that buyers often enter
              the search for "Scribe alternatives" because they need process discovery and delivery-ready artifacts
              rather than cleaner documentation alone. That matters for diligence because the real competitive set spans
              direct peers such as Tango, adjacent substitutes such as Guidde and Loom, and broader process-intelligence
              entrants such as ClearWork, plus the status quo of internal wikis, manual screenshots, and meetings.
            claimRefs:
              - CP009
              - CP010
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP004
              - CP005
              - CP009
              - CP010
              - CP013
      - number: '3.2'
        title: 'Capability comparison: Scribe wins on capture speed and packaging breadth'
        blocks:
          - type: paragraph
            body: >-
              On product surface area, Scribe still looks strongest where the buyer wants fast browser or desktop
              capture that turns directly into reusable guides. Official materials and third-party reviews line up on
              the core workflow: browser capture is broadly available, desktop capture is gated to paid plans, Pages
              packages multiple guides into longer SOPs, and newer launch material extends distribution into AI
              assistants, translations, and on-screen walkthroughs. The evidence also shows why this does not settle the
              market. Fast.io and ClearWork both describe a category split where Scribe is excellent for text-and-
              screenshot documentation, but video-first training, richer process discovery, or governed transformation
              work can send buyers toward adjacent tools instead.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP006
              - CP009
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP006
              - CP009
              - CP010
              - CP011
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP013
      - number: '3.3'
        title: Pricing, packaging, and switching cost favor expansion but create a mid-market opening
        blocks:
          - type: paragraph
            body: >-
              Public pricing evidence suggests Scribe has a strong self-serve wedge but a material packaging step-up
              once buyers need enterprise controls. Fast.io reports a ladder from free browser capture to individual and
              team paid plans, with SSO, SCIM, and related controls moving into enterprise pricing that it reports at
              roughly $18,000+ per year. Scribe's own alternatives page confirms that SSO sits in Enterprise, while the
              support documentation and product pages show why teams may still pay: desktop capture, analytics, guide
              updates, pinned guidance, AI-assistant distribution, and process packaging can all create operational
              switching cost once content is embedded across workflows. The open question is whether that creates
              durable retention or merely makes Scribe one layer inside a broader documentation stack.
            claimRefs:
              - CP002
              - CP006
              - CP007
              - CP008
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP007
              - CP008
      - number: '3.4'
        title: Durability hinges on moving beyond guide creation into higher-value workflow context
        blocks:
          - type: paragraph
            body: >-
              The strongest bullish read is that Scribe already has enough scale and product adjacency to remain the
              default workflow-documentation layer for many operations, enablement, and IT teams. Capture, AI-authored
              packaging, auto-updating guides, guided execution, and MCP or API distribution all deepen the value of the
              content once it is created. The bearish read is also visible in the assigned pool: review and competitor
              sources repeatedly frame Scribe as easy to use but still exposed to commoditization from low-cost capture
              peers, video tools for training, and process-intelligence vendors that promise richer discovery,
              governance, and delivery artifacts. Without public retention, multi-homing, or Scribe Optimize attach-rate
              data, moat durability is directionally positive but not fully underwritten.
            claimRefs:
              - CP004
              - CP005
              - CP008
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Documentation-layer moat is broader than simple screen capture
            body: >-
              Scribe is trying to turn workflow capture into a distribution and execution layer by combining Pages, AI
              writing, auto-updating guides, pinned walkthroughs, translation, and MCP or API access for assistants.
            calloutType: strength
            claimRefs:
              - CP003
              - CP006
              - CP011
          - type: callout
            title: The clearest opening is packaging and substitution, not lack of product value
            body: >-
              Buyers who only need video, in-app guidance, or deeper process-intelligence outputs can route around
              Scribe, and the public pricing step-up around enterprise controls makes that substitution economically
              easier for some teams.
            calloutType: risk
            claimRefs:
              - CP007
              - CP009
              - CP010
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization model and pricing surface
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports a software-style monetization stack built around workflow capture and
              documentation. Official product surfaces show that Scribe's core value starts with auto-generated guides,
              then layers paid capabilities such as desktop capture, screenshot editing, redaction, exports, and
              governance controls on top of that base. Third-party pricing review keeps the list-price ladder unusually
              visible for a private company: Basic is free, Pro Personal carries an individual seat price, Pro Team
              lowers seat pricing but imposes a five-seat floor, and Enterprise remains custom. That structure implies
              that Scribe can monetize both self-serve creators and governed enterprise rollouts, while Scribe AI or
              Pages functions more like a usage-expanding upsell than a mandatory prerequisite for adoption.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI011
              - CI013
