  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      The retained evidence supports a demand ladder built from adoption and contract signals, not a single clean
      TAM/SAM/SOM waterfall.
    data:
      items:
        - label: Excluded ambient AI scribe adjacency
          displayValue: $1.75B in 2025
          note: Global healthcare documentation market; not a valid proxy for Scribe's workflow-documentation spend
          claimRefs:
            - CM005
        - label: Official organization reach
          displayValue: 500,000+ to 600,000 organizations
          note: Company-issued usage and trust counts across different official surfaces
          claimRefs:
            - CM008
        - label: Paying customer base
          displayValue: ≈78,000–80,000
          note: Independent sources, current-year company scale indicator
          claimRefs:
            - CM007
        - label: Installed / workflow footprint
          displayValue: 6M employees; 15M workflows
          note: Independent usage observation plus workflow corpus size
          claimRefs:
            - CM008
        - label: Enterprise penetration signal
          displayValue: 94% of Fortune 500
          note: Official enterprise reach claim, useful as market validation but not spend
          claimRefs:
            - CM008
        - label: Contract-size ceiling
          displayValue: 5- to 7-figure deals
          note: Evidence that Scribe reaches meaningful enterprise budget pools
          claimRefs:
            - CM009
    approximationNotes: >-
      Layers are intentionally non-additive and mix adoption, monetization, and excluded-adjacent market signals; the
      pyramid orders the best public sizing lenses rather than implying one reconciled denominator.
    claimRefs:
      - CM013
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal 1-5 scores place Scribe above direct documentation peers on packaged workflow coverage, while
      process-intelligence entrants still rank higher on transformation depth.
    data:
      points:
        - label: Scribe
          x: 4
          'y': 3
          note: High capture breadth and packaging; mid transformation depth.
        - label: Tango
          x: 3
          'y': 2
          note: Direct capture-first peer with strong in-app guidance.
        - label: Guidde
          x: 2
          'y': 2
          note: Video-first substitute rather than documentation system of record.
        - label: Loom
          x: 1
          'y': 1
          note: Useful substitute for ad hoc explanation, not structured SOP management.
        - label: ClearWork
          x: 2
          'y': 5
          note: Lower instant-capture emphasis, higher process-intelligence depth.
        - label: Internal build
          x: 1
          'y': 1
          note: Lowest packaged breadth and governance despite low direct spend.
    approximationNotes: >-
      X-axis is packaged workflow-coverage breadth and Y-axis is transformation depth; both are evidence-backed ordinal
      scores from the retained sources rather than measured market-share or benchmark statistics.
    claimRefs:
      - CP009
      - CP010
      - CP011
      - CP013
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence suggests Scribe converts workflow capture into seat revenue first, then layers enterprise
      governance and AI or Optimize expansion on top.
    data:
      nodes:
        - id: capture
          label: Workflow capture
          value: Free browser capture or paid desktop/mobile capture
          note: Top-of-funnel product entry.
        - id: guide
          label: Generated guide
          value: Screenshots, click targets, and editable steps
          note: Core documentation value proposition.
        - id: paid
          label: Paid feature gates
          value: Redaction, exports, branding, governance, and Pages AI
          note: Usage moves from basic utility to paid workflow ownership.
        - id: seat
          label: Seat pricing
          value: Pro Personal $35/mo; Pro Team $17/mo with 5-seat minimum
          note: Published list pricing only.
        - id: enterprise
          label: Enterprise rollout
          value: Custom pricing; reported five- to seven-figure contracts
          note: Governed deployment is the clearest route to large ACV.
        - id: expansion
          label: Expansion products
          value: Scribe AI / Pages and Optimize
          note: Attach rate and gross-margin contribution are not publicly disclosed.
      edges:
        - from: capture
          to: guide
          label: records work and drafts documentation
        - from: guide
          to: paid
          label: teams need editing, redaction, and broader distribution
        - from: paid
          to: seat
          label: self-serve monetization begins
        - from: seat
          to: enterprise
          label: governed rollout expands contract value
        - from: enterprise
          to: expansion
          label: AI context and workflow analysis become upsell paths
    approximationNotes: >-
      The sequence reflects the public product and pricing surfaces, not a disclosed internal funnel or conversion-rate
      series.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI007
      - CI012
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public product surfaces describe a layered workflow stack from endpoint capture to AI/automation distribution and
      governance.
    data:
      layers:
        - label: Work execution
          detail: Employees, trainers, and operators perform browser and desktop workflows that Scribe is meant to observe.
          outputs:
            - label: Raw process context
            - label: Institutional know-how in day-to-day work
        - label: Capture clients
          detail: Scribe collects workflow traces through endpoint software.
          modules:
            - label: Chrome / Edge extension
              detail: Browser-based capture available on all plans.
            - label: Mac / Windows desktop app
              detail: Desktop capture reserved for Pro and Enterprise.
        - label: Guide generation
          detail: Captured actions become shareable, step-by-step workflow guides.
          outputs:
            - label: Screenshots, text, and cursor clicks
            - label: One-click walkthrough foundations
        - label: Document authoring
          detail: Higher-level documentation layers sit on top of captured guides.
          modules:
            - label: Scribe AI
              detail: Drafts or edits broader process documents.
            - label: Pages
              detail: Combines Scribes with text, lists, and video.
        - label: Distribution and execution support
          detail: Knowledge is delivered into the places teams and agents already work.
          modules:
            - label: Smart Embed
              detail: Named support surfaces include Confluence, SharePoint, Notion, Guru, and HubSpot.
            - label: Links, exports, and on-screen guidance
              detail: Makes documentation consumable inside or outside Scribe.
        - label: AI and workflow intelligence
          detail: Scribe extends the content layer into agent retrieval and process-improvement claims.
          modules:
            - label: MCP / API
              detail: Connects guides to AI assistants, chatbots, and agents.
            - label: Optimize
              detail: Promised layer for workflow analysis and automation prioritization.
        - label: Governance controls
          detail: Admin policies and compliance posture are part of the enterprise pitch.
          modules:
            - label: Redaction, domain controls, IP whitelisting
            - label: SOC 2 Type II, HIPAA, FERPA, GDPR
    claimRefs:
      - CE001
      - CE004
      - CE005
      - CE007
      - CE009
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Scribe appears to land through low-friction workflow capture, then expand toward shared process infrastructure and
      enterprise commercialization.
    data:
      items:
        - label: Discovery through process-documentation pain
          actor: Individual operator or team lead
          phase: Discovery
          touchpoints:
            - Get Scribe Free
            - Document any process
            - Browser-extension capture
        - label: First workflow capture
          actor: Initial product user
          phase: Activation
          touchpoints:
            - Browser-based apps and processes
            - Auto-generated step-by-step guide
            - First Scribe shared in minutes
        - label: Team sharing and repeat use
          actor: Teammates or clients
          phase: Early collaboration
          touchpoints:
            - Share by link or export
            - Teammates or clients consume guides
            - Shared workspace navigation
        - label: Department standardization
          actor: Ops, IT, enablement, or business-app owner
          phase: Expansion
          touchpoints:
            - Context layer across teams
            - Application self-documentation
            - Insights / Optimize surfaces
        - label: Large-enterprise procurement
          actor: Buyer committee and enterprise AE
          phase: Commercial scale
          touchpoints:
            - 10,000+ employee accounts
            - Six-figure ARR deals
            - Roughly 90-day sales cycles
        - label: AI upsell under governance review
          actor: AI, security, and process owners
          phase: Expansion risk
          touchpoints:
            - Scribe AI available to all users
            - Context for AI agents
            - Higher proof burden on audit and surveillance concerns
    approximationNotes: >-
      Sequence is inferred from assigned product, support, sales, and adjacent category sources; it represents likely
      motion rather than a company-disclosed funnel.
    claimRefs:
      - CU001
      - CU002
      - CU006
      - CU008
      - CU012
      - CU014
