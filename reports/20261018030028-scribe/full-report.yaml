chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and current positioning
        blocks:
          - type: paragraph
            body: |-
              Scribe's current official positioning is no longer just lightweight process documentation.
              The homepage and Capture product pages frame the company as a workflow-intelligence
              layer for teams and AI agents that automatically captures how work gets done, turns it
              into reusable guidance, and can distribute that guidance through links, exports, and
              MCP/API connections. The retained support documentation still describes the original
              core product in simpler terms—an automatically generated step-by-step guide with
              screenshots, text, and cursor clicks—which helps anchor what the software indisputably
              does today. That combination matters for diligence: the base product appears proven and
              legible, while the newer AI-agent and workflow-intelligence framing is the main
              expansion vector rather than a separate identity.
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO006
          - type: table
            tableRef: TO001
            claimRefs:
              - CO002
              - CO003
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
      - number: '1.2'
        title: Founders, visible leadership, and key-person concentration
        blocks:
          - type: paragraph
            body: |-
              Independent reporting consistently ties Scribe to cofounders Jennifer Smith and Aaron
              Podolny, with Smith as the public commercial voice and Podolny as the technical
              cofounder. The public leadership surface retained for this chapter is otherwise thin:
              the October 2026 enterprise-sales hiring post names a Head of New Business Sales and
              signals a scaling go-to-market organization, but it does not provide a broader board
              or governance roster. That leaves a practical key-person dependency around the
              founders, especially because the strongest public strategic narrative—why workflow
              capture matters for automation and agents—still runs through Smith's interviews and
              company-authored launches.
            claimRefs:
              - CO002
              - CO003
              - CO015
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO015
      - number: '1.3'
        title: Funding, scale, and commercial signals
        blocks:
          - type: paragraph
            body: |-
              The clearest financing datapoint is TechCrunch's November 2025 report that Scribe
              raised a $75 million all-equity Series C at a $1.3 billion post-money valuation led
              by StepStone, with several existing investors participating. Simplify's October 2026
              company profile lists Scribe as a Series C company with $130 million in total funding,
              which is directionally consistent with additional earlier capital but does not itself
              disclose a full round-by-round bridge. Commercial traction is also meaningful but not
              yet perfectly reconciled: TechCrunch cited more than 5 million users, 78,000 paid
              organizations, and 94% of the Fortune 500 in late 2025; Forbes later cited 80,000
              customers, more than 6 million employees with the app, and 600,000 organizations on
              the free tier; a company-distributed October 2026 recruiting post then claimed 7
              million users across 600,000 businesses. Those numbers are strong directional signals,
              but they describe different populations and should not be treated as one clean funnel.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO002
              - CO011
              - CO012
              - CO015
      - number: '1.4'
        title: Milestones, operating momentum, and open diligence issues
        blocks:
          - type: paragraph
            body: |-
              The milestone pattern is coherent: Scribe was founded in 2019, matured its core
              Capture workflow-documentation product, rolled out Scribe Optimize alongside the 2025
              financing, and continued broadening into Scribe AI and AI-agent integrations during
              2026. The strongest near-term quality signal is Forbes' report that the company crossed
              $100 million in annualized recurring revenue in April 2026, which suggests the AI
              narrative is being layered onto an already sizable commercial base rather than masking a
              pre-scale business. The main unresolved issues are governance transparency, exact
              customer/user metric definitions, and whether workflow-capture software can encounter
              privacy, surveillance, or regulated-workflow pushback as buyers scrutinize how
              automation systems observe employees and generate documentation.
            claimRefs:
              - CO002
              - CO005
              - CO013
              - CO014
              - CO015
