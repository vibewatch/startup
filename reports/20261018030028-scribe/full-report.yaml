      - What would change the view
    rows:
      - - Thesis
        - >-
          Workflow capture plus Optimize suggests Scribe is moving from documentation software toward an AI
          workflow-data layer with measurable ROI claims.
        - Independent proof that Optimize drives paid expansion or larger contract values would strengthen this.
      - - Thesis
        - >-
          Broad reach claims—5M+ users, 94% of Fortune 500, and large enterprise logos—support distribution breadth and
          category relevance.
        - Cohort-level paid conversion and retention data would confirm that usage breadth turns into durable revenue.
      - - Anti-thesis
        - >-
          The public record still does not disclose enough revenue-quality, margin, or preference detail to justify
          paying up confidently at the last round benchmark.
        - Audited ARR, NRR, gross margin, and cap-table economics could narrow the discount.
      - - Anti-thesis
        - >-
          Workflow capture can be framed as surveillance-adjacent software, which could slow enterprise rollout if
          governance is weak.
        - >-
          Customer references, privacy controls in practice, and incident-free deployment evidence would reduce this
          risk.
    notes: >-
      Pairs the strongest upside logic with the clearest disconfirming evidence and names the incremental proof needed
      to change the recommendation.
    claimRefs:
      - CV003
      - CV005
      - CV008
      - CV009
      - CV011
      - CV012
      - CV016
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          ARR growth remains strong above the reported $100M run rate, Optimize monetizes into larger enterprise
          contracts, and workflow data becomes a differentiated AI moat.
        - >-
          A premium to the last disclosed $1.3B round could be supportable only if private diligence shows strong
          retention, margins, and clean preference terms.
        - Optimize attach stays low or privacy concerns limit deployment.
        - Would require new third-party evidence of durable paid expansion.
      - - Base
        - >-
          Scribe sustains meaningful enterprise demand, but the monetization bridge from broad usage to premium workflow
          intelligence remains only partly proven.
        - >-
          A flat to modest discount versus the last round is easier to defend while public multiples and private terms
          remain opaque.
        - Growth slows, but the company still supports a viable private-market outcome.
        - Best matches the current mix of official traction claims and limited independent revenue evidence.
      - - Bear
        - >-
          The market applies multiple compression, Optimize fails to widen monetization materially, or
          governance/privacy pushback slows rollout.
        - >-
          A down-round or structured financing below the last disclosed benchmark becomes plausible if private diligence
          does not validate quality-of-revenue.
        - Preference overhang or weak retention further compresses realized returns.
        - Becomes more likely if data-room evidence does not reconcile conversion, churn, and cap-table terms.
    notes: >-
      Scenario bands are directional and anchored to the last disclosed $1.3B post-money benchmark because public
      EV/revenue support, retention, and preference disclosures remain incomplete.
    claimRefs:
      - CV001
      - CV006
      - CV007
      - CV010
      - CV011
      - CV012
      - CV014
      - CV015
      - CV016
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Scribe progressed from a 2019 workflow-documentation startup to a 2025-2026 AI-agent and workflow-intelligence
      platform with meaningful commercial scale but still-open governance and metric reconciliation questions.
    data:
      items:
        - date: '2019'
          label: Founded by Jennifer Smith and Aaron Podolny
          detail: >-
            Independent reporting consistently dates the company's founding to 2019 and ties both founders to the
            original workflow-capture concept.
          tone: positive
          claimRefs:
            - CO002
        - date: '2025-11-10'
          label: Series C financing set the current public valuation anchor
          detail: TechCrunch reported a $75M all-equity Series C at a $1.3B post-money valuation led by StepStone.
          tone: positive
          claimRefs:
            - CO011
        - date: '2025-11-10'
          label: Scribe Optimize became the next product wedge
          detail: >-
            The same financing story tied new capital to Scribe Optimize, which maps workflows to identify automation
            and AI opportunities.
          tone: positive
          claimRefs:
            - CO005
            - CO011
        - date: '2025-11-10'
          label: Late-2025 public scale marker
          detail: >-
            TechCrunch cited more than 5 million users and 78,000 paid organizations, establishing a large installed
            base before the 2026 AI push.
          tone: positive
          claimRefs:
            - CO008
        - period: April 2026
          label: ARR crossed nine figures
          detail: Forbes reported that Scribe crossed $100M in annualized recurring revenue in April 2026.
          tone: positive
          claimRefs:
            - CO013
        - date: '2026-05-10'
          label: Forbes framed Scribe as both fast-growing and surveillance-sensitive
          detail: >-
            The profile described 80,000 customers, 600,000 free organizations, and more than 6 million employees with
            the app, while also noting broader bossware-style privacy concerns around workplace monitoring tools.
          tone: risk
          claimRefs:
