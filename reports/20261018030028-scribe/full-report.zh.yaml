        title: 证据摘录
        blocks:
          - type: callout
            title: 从产品到平台的扩张真实可见
            body: 保留的来源显示，产品确实从自动生成指南推进到工作流智能和 AI 智能体上下文，并非只是在概念上换成 AI 名称。
