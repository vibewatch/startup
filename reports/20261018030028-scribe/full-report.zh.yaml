    title: 竞争定位图
    type: quadrant
    summary: 1—5 的序数评分显示，Scribe 的打包工作流覆盖优于直接文档竞品，但流程智能新进入者的转型深度仍更高。
    data:
      points:
        - label: Scribe
          x: 4
          'y': 3
          note: 采集广度和产品打包能力高；转型深度中等。
        - label: Tango
          x: 3
          'y': 2
          note: 直接采集优先的同类产品，应用内引导能力强。
        - label: Guidde
          x: 2
          'y': 2
          note: 以视频为先的替代品，而非文档系统记录库。
        - label: Loom
          x: 1
          'y': 1
          note: 适合临时解释的替代品，不适合结构化 SOP 管理。
        - label: ClearWork
          x: 2
          'y': 5
          note: 对即时采集的强调较低，但流程智能深度更高。
        - label: 内部自建
          x: 1
          'y': 1
          note: 尽管直接支出较低，但打包广度和治理能力最低。
    approximationNotes: X 轴是打包工作流覆盖广度，Y 轴是转型深度；两者都是保留来源支持的序数评分，并非测量所得的市场份额或基准统计。
    claimRefs:
      - CP009
      - CP010
      - CP011
      - CP013
  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 公开证据表明，Scribe 先把工作流采集转化为席位收入，再叠加企业治理以及 AI 或 Optimize 扩张。
    data:
      nodes:
        - id: capture
          label: 工作流采集
          value: Free browser capture or paid desktop/mobile capture
          note: 漏斗顶部的产品入口。
        - id: guide
          label: 生成的指南
          value: Screenshots, click targets, and editable steps
          note: 核心文档价值主张。
        - id: paid
          label: 付费功能门槛
          value: Redaction, exports, branding, governance, and Pages AI
          note: 使用从基础工具性转向付费工作流所有权。
        - id: seat
          label: 席位定价
          value: Pro Personal $35/mo; Pro Team $17/mo with 5-seat minimum
          note: 仅为已发布的列表价格。
        - id: enterprise
          label: 企业推广
          value: Custom pricing; reported five- to seven-figure contracts
          note: 受治理的部署是获取大额 ACV 最清晰的路径。
        - id: expansion
          label: 扩张产品
          value: Scribe AI / Pages and Optimize
          note: 附加率和对毛利率的贡献尚未公开披露。
      edges:
        - from: capture
          to: guide
          label: 记录工作并起草文档
        - from: guide
          to: paid
          label: 团队需要编辑、脱敏和更广分发
        - from: paid
          to: seat
          label: 自助变现开始
        - from: seat
          to: enterprise
          label: 受治理的推广扩大合同价值
        - from: enterprise
          to: expansion
          label: AI 上下文和工作流分析成为增购路径
    approximationNotes: 该顺序反映公开产品和定价界面，而不是已披露的内部漏斗或转化率序列。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI007
      - CI012
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开产品界面展示了一套分层工作流栈，从终端采集延伸到 AI / 自动化分发与治理。
    data:
      layers:
        - label: 工作执行
          detail: 员工、培训师和运营人员执行浏览器及桌面工作流，Scribe 旨在观察这些流程。
          outputs:
            - label: Raw process context
            - label: Institutional know-how in day-to-day work
        - label: 采集客户端
          detail: Scribe 通过终端软件收集工作流轨迹。
          modules:
            - label: Chrome / Edge 扩展
              detail: 所有套餐均提供基于浏览器的采集。
            - label: Mac / Windows 桌面应用
              detail: 桌面采集仅提供给 Pro 和 Enterprise。
        - label: 指南生成
          detail: 采集的动作变成可分享的分步工作流指南。
          outputs:
            - label: Screenshots, text, and cursor clicks
            - label: One-click walkthrough foundations
        - label: 文档编写
          detail: 更高层的文档层建立在采集的指南之上。
          modules:
            - label: Scribe AI
              detail: 起草或编辑更广泛的流程文档。
            - label: Pages
              detail: 将 Scribe 与文本、列表和视频结合起来。
        - label: 分发与执行支持
          detail: 知识被送入团队和智能体已经工作的场所。
          modules:
            - label: Smart Embed
              detail: 已列出的支持界面包括 Confluence、SharePoint、Notion、Guru 和 HubSpot。
            - label: 链接、导出与屏幕引导
              detail: 让文档可在 Scribe 内外使用。
        - label: AI 与工作流智能
          detail: Scribe 将内容层延伸到智能体检索和流程改进主张。
          modules:
            - label: MCP / API
              detail: 将指南连接到 AI 助手、聊天机器人和智能体。
            - label: Optimize
              detail: 承诺用于工作流分析和自动化优先级排序的一层。
        - label: 治理控制
          detail: 管理员政策和合规姿态是企业销售说辞的一部分。
          modules:
            - label: 脱敏、域控制、IP 白名单
            - label: SOC 2 Type II、HIPAA、FERPA、GDPR
    claimRefs:
      - CE001
      - CE004
      - CE005
      - CE007
      - CE009
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Scribe 似乎先靠低摩擦的工作流采集切入，再扩展到共享流程基础设施和企业商业化。
    data:
      items:
        - label: 从流程文档痛点开始发现
          actor: 个人运营人员或团队负责人
          phase: 发现
          touchpoints:
            - 获取 Scribe Free
            - 记录任意流程
            - 浏览器扩展采集
        - label: 首次工作流采集
          actor: 初始产品用户
          phase: 激活
          touchpoints:
            - 基于浏览器的应用和流程
            - 自动生成的分步指南
            - 几分钟内分享第一份 Scribe
        - label: 团队分享与重复使用
          actor: 队友或客户
          phase: 早期协作
          touchpoints:
            - 通过链接或导出分享
            - 队友或客户使用指南
            - 共享工作区导航
        - label: 部门标准化
          actor: 运营、IT、赋能或业务应用负责人
          phase: 扩张
          touchpoints:
            - 跨团队的上下文层
            - 应用自文档化
            - Insights / Optimize 界面
        - label: 大型企业采购
          actor: 买方委员会和企业客户经理
          phase: 商业规模化
          touchpoints:
            - 10,000+ 员工账户
            - 六位数 ARR 交易
            - 约 90 天销售周期
        - label: 在治理审查下增购 AI
          actor: AI、安全和流程负责人
          phase: 扩张风险
          touchpoints:
            - 所有用户均可使用 Scribe AI
            - AI 智能体的上下文
            - 审计和监控担忧带来更高证明负担
    approximationNotes: 该顺序根据指定的产品、支持、销售和邻接品类来源推断；它代表可能的推进路径，而非公司披露的漏斗。
    claimRefs:
      - CU001
      - CU002
      - CU006
      - CU008
      - CU012
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 基于指定 2026 年证据，对 Scribe 最重大的剩余风险进行优先级排序。
    data:
      columns:
        - 风险
        - 可能性（1—5）
        - 影响（1—5）
        - 缓解成熟度（1—5）
        - 剩余严重性
      rows:
        - label: 隐私 / 保密信息泄露
          values:
            - 4
            - 5
            - 3
            - 高
            - 敏感工作流可能在审查前被采集
        - label: 员工信任 / 监控反弹
          values:
            - 3
            - 5
            - 2
            - 高
            - 即使有控制措施，监控观感也可能阻碍推广
        - label: 指南时效性 / 质量衰减
          values:
            - 4
            - 4
            - 3
            - 高
            - 指南不维护，价值就会流失
        - label: AI 供应商依赖
          values:
            - 3
            - 4
            - 2
            - 中高
            - 生成式功能依赖外部模型提供商
        - label: 采集界面覆盖缺口
          values:
            - 3
            - 3
            - 3
            - 中
            - 重要工作流可能不在仅限浏览器的采集范围内
        - label: 付费推广 / 转化阻力
          values:
            - 3
            - 3
            - 2
            - 中
            - 桌面、治理和规模化功能需要付费扩展
    approximationNotes: 评分是分析师根据引用证据排出的优先级，并非公司披露的量化风险评分。
    claimRefs:
      - CR002
      - CR003
      - CR004
      - CR005
      - CR006
      - CR008
      - CR010
      - CR011
      - CR012
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 从牵引力和产品广度推导出“继续研究”的证据链。
    data:
      nodes:
        - id: scale
          label: 规模证据
          value: 5M+ users; 94% of Fortune 500
          note: 2025 年官方融资材料确立了广泛触达。
          tone: opportunity
        - id: monetization
          label: 变现证据
          value: $100M ARR reported; $20 to seven-figure contracts
          note: 独立报道显示真实付费收入，但公开细节有限。
          tone: opportunity
        - id: product
          label: 产品扩张
          value: Optimize, Scribe AI, MCP/API support
          note: 路线图从静态文档延伸到工作流智能和 AI 赋能。
          tone: opportunity
        - id: opacity
          label: 投资判断透明度不足
          value: No public retention, margin, burn, or preference stack
          note: 关键定价和回报变量仍不在公开记录中。
          tone: risk
        - id: downside
          label: 下行触发因素
          value: Multiple compression, weak conversion, privacy friction
          note: 工作流采集叙事在企业采购中可能利弊兼具。
          tone: risk
        - id: call
          label: 建议
          value: Research more / stretched / high risk
          note: 只有私下尽调或更好的入场条款，才能支持更激进的判断。
          tone: high
      edges:
        - from: scale
          to: monetization
          relationship: 使用广度需要转化为持久的付费经济性。
        - from: monetization
          to: product
          relationship: 下一阶段上行空间取决于 Optimize 和 AI 功能变现。
        - from: product
          to: opacity
          relationship: 扩张野心超过了公开记录的披露范围。
        - from: opacity
          to: downside
          relationship: 投资判断数据缺失，使结果更容易受不利执行或治理影响。
        - from: downside
          to: call
          relationship: 这种组合支持严格的入场纪律，而不是直接买入。
    claimRefs:
      - CV005
      - CV006
      - CV008
      - CV009
      - CV011
      - CV012
      - CV016
