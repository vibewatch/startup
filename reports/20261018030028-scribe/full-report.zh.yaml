            body: >-
              Forbes 给出最清晰的公开财务信号：Scribe 在 2026 年 4 月突破 $100 million 年化经常性收入，合同从低价订阅到五至
              七位数企业交易不等。这说明收入规模可观、合同梯度广，但没有说明业务在免费分发、低端付费席位、大型企业合同和 Optimize 等新产品之间如何分布。采用数据也要谨慎：证据引用了 5 million 至 6
              million 用户或员工、600,000 个免费版组织， 以及约 78,000 至 80,000 家付费或客户组织，却没有对齐分母。投资判断缺的不是收入兴趣，而是转化质量、实际 ASP、续约
              持久性和各产品线的利润贡献。
            claimRefs:
              - CI006
