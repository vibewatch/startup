      - number: '4.3'
        title: 资本充足性仍是尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              保留来源足以说明 Scribe 已达到真实规模，并以独角兽估值融资，但不足以判断现金需求。公开报道的 2025 年 11 月 $1.3 billion 估值和超过 $122 million
              的融资历史，无法告诉投资人截至 2026 年 10 月账上还剩多少现金、消耗速度有多快、AI
              或工作流分析产品会扩大还是压缩毛利率，以及管理层何时需要再次融资。最有决策价值的公开负面信号来自战略而非会计：工作流记录接近员工监控争议，Forbes
              也称该品类正快速商品化。因此，在管理层提供分组、价格实现和资金续航证据前，财务判断对收入模式清晰度偏正面，对利润路径信心偏负面。
