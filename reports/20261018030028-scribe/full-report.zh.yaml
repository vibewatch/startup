        title: 证据摘录
        blocks:
          - type: callout
            title: 文档层护城河比简单录屏更宽
            body: Scribe 正在把工作流捕捉变成分发与执行层：把 Pages、AI 写作、自动更新指南、置顶引导、翻译以及面向助手的 MCP 或 API 接入组合起来。
            calloutType: strength
            claimRefs:
              - CP003
              - CP006
              - CP011
          - type: callout
            title: 最明显的机会在打包和替代，而非产品价值不足
            body: 只需要视频、应用内指导或更深流程智能产出的买方可以绕开 Scribe；企业控制带来的公开定价上跳，也让部分团队更容易在经济上选择替代品。
            calloutType: risk
            claimRefs:
