    columns:
      - 立场
      - 论点
      - 哪些证据会改变判断
    rows:
      - - 正方
        - 工作流采集加上 Optimize，说明 Scribe 正从文档软件走向 AI 工作流数据层，并提出可量化的 ROI 主张。
        - 若有独立证据证明 Optimize 能推动付费扩张或提高合同金额，论点会更有力。
      - - 正方
        - 5M+ 用户、覆盖 94% 的 Fortune 500 以及大量企业客户标志等广泛触达主张，支持其分发广度和品类相关性。
        - 按队列拆分的付费转化和留存数据，才能确认广泛使用能转化为持久收入。
      - - 反方
        - 公开记录仍未披露足够的收入质量、利润率或优先权细节，无法支持在上一轮基准上放心溢价买入。
        - 经审计的 ARR、NRR、毛利率和股权结构表经济性数据，可能缩小折价幅度。
      - - 反方
        - 工作流采集可能被视为接近监控的软件；若治理薄弱，企业推广会放慢。
        - 客户参考、实际隐私控制和无事故部署证据，能降低这一风险。
    notes: 将最强的上行逻辑与最明确的反证并列，并指出改变建议所需的增量证据。
