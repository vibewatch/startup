      - number: '1.4'
        title: 里程碑、经营势头与待解尽调问题
        blocks:
          - type: paragraph
            body: |-
              里程碑脉络清晰：Scribe 于 2019 年成立，成熟了核心 Capture 工作流文档产品，随 2025 年融资推出 Scribe Optimize，
              并在 2026 年继续扩展 Scribe AI 和 AI 智能体集成。近期最强的质量信号是 Forbes 报道公司在 2026 年 4 月突破
              $100 million 年化经常性收入，说明 AI 叙事是叠加在已有商业基础上，而不是掩盖尚未规模化的业务。主要未解问题包括
              治理透明度、客户与用户指标的准确口径，以及买方审视自动化系统如何观察员工并生成文档后，工作流捕捉软件是否会遭遇
              隐私、监控或受监管工作流的反弹。
