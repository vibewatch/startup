        title: 能力对比：Scribe 在捕捉速度和产品打包广度上占优
        blocks:
          - type: paragraph
            body: >-
              在产品覆盖面上，Scribe 最强的地方仍是快速捕捉浏览器或桌面操作，并直接转成可复用指南。官方材料和第三方评测对核心流程 基本一致：浏览器捕捉广泛可用，桌面捕捉限于付费套餐，Pages 将多份指南打包成长
              SOP，新发布内容则把分发扩展到 AI 助手、翻译和屏幕引导。但这并不能决定市场胜负。Fast.io 和 ClearWork 都描述了品类分化：Scribe 擅长文字加截图文档，
              而视频培训、更深的流程发现或受治理的流程改造可能把买方带向相邻工具。
