chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与当前定位
        blocks:
          - type: paragraph
            body: |-
              Scribe 当前的官方定位已不只是轻量流程文档。官网和 Capture 产品页把它描述为面向团队与 AI 智能体的工作流智能层：
              自动记录工作如何完成，将其变成可复用的指导，并通过链接、导出和 MCP/API 连接分发。现有支持文档仍以更直白的方式
              描述原始核心产品——自动生成包含截图、文字和光标点击的分步指南——这能锚定软件当下确实能做什么。对尽调而言，
              这组证据很关键：基础产品看起来已被验证且易于理解，而新的 AI 智能体和工作流智能叙事是主要扩张方向，并非另一套身份。
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO006
          - type: table
            tableRef: TO001
            claimRefs:
              - CO002
              - CO003
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
      - number: '1.2'
        title: 创始人、可见管理层与关键人集中度
        blocks:
          - type: paragraph
            body: |-
              独立报道始终将 Scribe 与联合创始人 Jennifer Smith 和 Aaron Podolny 联系在一起：Smith 是对外商业表达者，Podolny
              是技术联合创始人。本章保留的公开管理层信息除此之外很少。2026 年 10 月的企业销售招聘帖提到新业务销售负责人，
              说明公司正在扩张市场拓展组织，但没有给出更完整的董事会或治理名单。因此创始人仍构成实际关键人依赖，
              尤其是关于工作流捕捉为何有利于自动化和智能体的核心战略叙事，仍主要来自 Smith 的采访和公司发布内容。
            claimRefs:
              - CO002
              - CO003
              - CO015
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO015
      - number: '1.3'
        title: 融资、规模与商业信号
        blocks:
          - type: paragraph
            body: |-
              最清晰的融资数据来自 TechCrunch 2025 年 11 月报道：Scribe 完成由 StepStone 领投的 $75 million 全股权 Series C，
              投后估值 $1.3 billion，数家老股东跟投。Simplify 2026 年 10 月的公司简介将 Scribe 列为累计融资 $130 million 的
              Series C 公司；这与此前还有融资的方向一致，但没有给出完整的逐轮对账。商业进展也很有意义，却尚未完全对齐：
              TechCrunch 在 2025 年末称用户超过 5 million、付费组织 78,000 家、覆盖 Fortune 500 的 94%；Forbes 后来称客户
              80,000 家、超过 6 million 名员工使用该应用、免费层组织 600,000 家；公司在 2026 年 10 月发布的招聘帖又称
              600,000 家企业共有 7 million 用户。这些数字是强方向性信号，但对应不同人群，不能当成一条干净的漏斗。
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
