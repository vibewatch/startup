  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：工作流文档，而非临床环境听写
        blocks:
          - type: paragraph
            body: >-
              Scribe 保留的证据显示，其市场边界比泛知识管理窄，却比简单录屏宽。产品在工作发生时捕捉过程，生成分步指南，再叠加编辑、
              脱敏、治理、翻译和上下文交付。因此相关支出包括工作流文档、SOP、入职与培训内容、工作中指导，以及供 AI 助手或自动化 项目使用的新工作流智能层。不能套用医疗“AI
              scribe”TAM：那些来源讲的是临床笔记生成、编码完整性和报销流程，只因共享 “scribe”一词而相邻，并不对应同一买方、工作流或预算。
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM005
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM005
              - CM012
      - number: '2.2'
        title: 公开规模数据采用率丰富，但缺少分母
        blocks:
          - type: paragraph
            body: >-
              最强的市场证据不是第三方 TAM 演示稿，而是一组采用和变现信号。独立来源估计 Scribe 的 ARR 或收入约 $100 million， 付费客户约 78,000 至 80,000 家；官方及独立来源还指向
              500,000 多至 600,000 家触达组织、超过 6 million 名 笔记本装有该应用的员工，以及金额可达五至七位数的企业合同。这些数据支持真实市场和可信扩张路径，却不是按支出计算的
              分母。因此证据支持的是受约束的需求阶梯，而非干净的 TAM/SAM/SOM 桥接；投资人应把宽泛品类数字当作方向性背景，而非估值证明。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM013
      - number: '2.3'
        title: 买方覆盖赋能、运营与企业管理团队
        blocks:
          - type: paragraph
            body: >-
              用户通常就是实际做事的人，但 Scribe 向高端市场推进后，经济买方似乎会变化。自助模式从个人捕捉和分享开始；一旦桌面 捕捉、治理、SSO、合规控制和 AI 智能体分发变得重要，公开功能便指向赋能、运营、IT
              和企业管理团队。增长驱动很直接： 替代手工文档、加快入职、在工作发生处提供指导，并让 AI 系统读懂公司专属流程。时机和估值也受约束：Scribe 依赖浏览器及
              桌面捕捉权限，必须证明自己不是监控软件，还要面对既有文档习惯及可能把轻量工作流指导嵌入套件的厂商。
            claimRefs:
              - CM003
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM006
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 证据摘录
        blocks:
          - type: callout
            title: 扩张逻辑可信，但传统 TAM 证据薄弱
            body: 公开记录支持真实客户需求和企业预算获取，但没有披露 Scribe 所属细分市场按支出计算的 TAM/SAM/SOM。因此，采用率、 合同规模和工作流智能扩张是更可信的投资判断视角。
            calloutType: insight
            claimRefs:
              - CM007
              - CM008
              - CM009
          - type: callout
            title: 市场时机取决于信任和平台接入，不只是文档痛点
            body: 当买方把工作流捕捉视为有用上下文而非监控，且浏览器、桌面和应用生态足够开放、能可靠观察工作时，Scribe 的价值主张才会 增强。即使产品有用，这些约束也可能拖慢渗透。
            calloutType: risk
            claimRefs:
              - CM010
              - CM011
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接竞品只是买方选择的一部分
        blocks:
          - type: paragraph
            body: >-
              现有证据显示，Scribe 的竞争对手不只是以捕捉为先的同类产品。其 alternatives 页面将替代品分为捕捉记录器、SOP 与培训 系统、视频工具和应用内指导；ClearWork 认为，买方搜索
              “Scribe alternatives” 往往是因为需要流程发现和可交付产物， 而不只是更整洁的文档。真实竞争集包括 Tango 等直接竞品、Guidde 和 Loom 等相邻替代品、ClearWork
              等流程智能进入者， 以及内部 wiki、手工截图和会议等现状方案。
            claimRefs:
              - CP009
              - CP010
