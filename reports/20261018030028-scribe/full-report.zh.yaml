      - number: '3.3'
        title: 定价、打包和切换成本利于扩张，却给中端市场留下空间
        blocks:
          - type: paragraph
            body: >-
              公开定价证据显示，Scribe 有很强的自助切入点，但买方需要企业控制后，套餐价格会明显上跳。Fast.io 描述了从免费浏览器捕捉 到个人和团队付费方案的阶梯；SSO、SCIM
              等控制进入企业定价，据其报道约为每年 $18,000+。Scribe 自己的 alternatives 页面确认 SSO 属于
              Enterprise。支持文档和产品页也说明团队为何仍愿意付费：桌面捕捉、分析、指南更新、置顶指导、AI 助手 分发和流程打包，一旦内容嵌入工作流，都会形成运营切换成本。问题在于这带来的是持久留存，还是只让
              Scribe 成为更大文档栈的一层。
            claimRefs:
              - CP002
              - CP006
              - CP007
              - CP008
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP007
              - CP008
      - number: '3.4'
        title: 持久性取决于从指南创建走向更高价值的工作流上下文
        blocks:
          - type: paragraph
            body: >-
              最乐观的解读是，Scribe 已有足够规模和产品邻接性，能继续成为许多运营、赋能和 IT 团队的默认工作流文档层。捕捉、AI 生成打包、自动更新指南、引导执行以及 MCP 或 API
              分发，会在内容生成后继续提高其价值。悲观解读同样明显：评测和竞品来源 反复称 Scribe 易用，却仍会受到低价捕捉同类、培训视频工具和承诺更强流程发现、治理与交付产物的流程智能厂商的商品化冲击。
              在缺乏公开留存、多平台使用或 Scribe Optimize 附加率数据前，护城河持久性只是方向上积极，尚不足以完成投资判断。
            claimRefs:
