  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - ARR 增长继续强劲，保持在已报告的 $100M 年化速度之上；Optimize 变现为更大的企业合同，工作流数据形成差异化 AI 护城河。
        - 只有私下尽调显示留存强劲、利润率良好且优先权条款干净，才可能支持相对最近披露的 $1.3B 轮次溢价。
        - Optimize 附加率维持低位，或隐私担忧限制部署。
        - 需要新的第三方证据证明付费扩张具备持久性。
      - - 基准
        - Scribe 保持可观的企业需求，但从广泛使用走向高端工作流智能的变现桥梁仍只得到部分验证。
        - 在公开倍数和私下条款仍不透明的情况下，相比上一轮平价或小幅折价更容易辩护。
        - 增长放缓，但公司仍能支撑可行的私募市场结果。
        - 这最符合当前官方牵引力主张与有限独立收入证据的组合。
      - - 悲观
        - 市场压缩估值倍数，Optimize 未能实质扩大变现，或治理 / 隐私反弹拖慢推广。
        - 如果私下尽调无法验证收入质量，低于最近披露基准的下轮融资或结构化融资就变得可能。
        - 优先权悬垂或留存疲弱会进一步压缩实际回报。
        - 如果数据室证据无法对上转化、流失和股权结构表条款，悲观情景更可能发生。
    notes: 情景区间仅供方向性参考，并锚定最近披露的 $1.3B 投后基准；公开 EV / 收入依据、留存和优先权披露仍不完整。
    claimRefs:
      - CV001
