        title: 隐私、法律和员工信任风险高于普通 SaaS 风险
        blocks:
          - type: paragraph
            body: >-
              核心产品记录人们如何工作，这正是隐私、同意和保密性必须优先评估的原因。官方材料称 Scribe 执行脱敏、域控制和 IP 白名单， 并符合 SOC 2 Type II、HIPAA、FERPA 和
              GDPR；但同一证据集也显示剩余风险仍大：独立评测警告捕捉的工作流可能含有敏感客户 或公司数据，Chrome Web Store 披露则确认扩展会处理用户活动和网站内容。Forbes
              更直接地指出相邻下行：Scribe 会记录员工 屏幕，而类似监控工具曾引发隐私违规反弹。综合来看，缓释措施确实存在，但在判断大规模企业部署前仍需法律、劳工和客户信任尽调。
            claimRefs:
              - CR002
