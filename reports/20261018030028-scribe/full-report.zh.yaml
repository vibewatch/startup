companyProfile:
  summary: >-
    Scribe 是一家工作流捕捉和流程文档公司，正在重新定位为 AI 智能体和企业工作流智能的上下文层。产品基础已有充分公开证据， 公司也在此基础上加入更广泛的自动化和 AI
    智能体叙事；但公开规模数据混用了用户、组织、客户和员工口径，仍需管理层对账。
