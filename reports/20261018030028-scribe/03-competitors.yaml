      - ["Pro Team", "$13/seat/month billed annually with five-seat minimum; $17/seat/month monthly", "Shared workspaces, team analytics, approval workflows, centralized admin controls", "$65/month entry floor and no public SSO tier below enterprise", "Supports rollout across teams but still leaves identity-sensitive buyers exposed"]
      - ["Enterprise", "Custom pricing; Fast.io reports $18,000+/year", "SAML SSO, SCIM, IP whitelisting, Enterprise Search API, authenticated viewers, dedicated support", "Official price book and typical discount bands are not public", "Creates the largest monetization upside, but also the clearest opening for cheaper substitutes"]
    notes: >-
