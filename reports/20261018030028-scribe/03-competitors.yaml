company:
  name: "Scribe"
chapter:
  number: 3
  title: "Competitors"
  summary: >-
    Scribe's competitive center of gravity is still workflow capture and SOP packaging, but the live threat
    comes less from one direct clone than from substitute categories such as video walkthroughs, interactive
    demos, and process-intelligence platforms. Public evidence suggests the company has real scale and useful
    lock-in features, while pricing cliffs around enterprise controls and limited proof on deeper transformation
    outcomes leave room for adjacent entrants.
sections:
  - id: "landscape"
    title: "Landscape: direct peers are only one slice of the buying set"
    body: >-
      The assigned evidence points to a market where Scribe is not competing only against capture-first peers.
      Scribe's own alternatives page groups substitutes across capture-first recorders, SOP and training
      systems, video-first tools, and in-app guidance products, while ClearWork argues that buyers often enter
      the search for "Scribe alternatives" because they need process discovery and delivery-ready artifacts
      rather than cleaner documentation alone. That matters for diligence because the real competitive set spans
      direct peers such as Tango, adjacent substitutes such as Guidde and Loom, and broader process-intelligence
      entrants such as ClearWork, plus the status quo of internal wikis, manual screenshots, and meetings.
    claimRefs:
      - "CP009"
      - "CP010"
      - "CP013"
    tableRefs:
      - "TP001"
  - id: "capability-comparison"
    title: "Capability comparison: Scribe wins on capture speed and packaging breadth"
    body: >-
      On product surface area, Scribe still looks strongest where the buyer wants fast browser or desktop
      capture that turns directly into reusable guides. Official materials and third-party reviews line up on
      the core workflow: browser capture is broadly available, desktop capture is gated to paid plans, Pages
      packages multiple guides into longer SOPs, and newer launch material extends distribution into AI
      assistants, translations, and on-screen walkthroughs. The evidence also shows why this does not settle the
      market. Fast.io and ClearWork both describe a category split where Scribe is excellent for text-and-
      screenshot documentation, but video-first training, richer process discovery, or governed transformation
      work can send buyers toward adjacent tools instead.
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP003"
      - "CP006"
      - "CP009"
      - "CP011"
    tableRefs:
      - "TP002"
    figureRefs:
      - "FP001"
  - id: "pricing-and-switching"
    title: "Pricing, packaging, and switching cost favor expansion but create a mid-market opening"
    body: >-
      Public pricing evidence suggests Scribe has a strong self-serve wedge but a material packaging step-up
      once buyers need enterprise controls. Fast.io reports a ladder from free browser capture to individual and
      team paid plans, with SSO, SCIM, and related controls moving into enterprise pricing that it reports at
      roughly $18,000+ per year. Scribe's own alternatives page confirms that SSO sits in Enterprise, while the
      support documentation and product pages show why teams may still pay: desktop capture, analytics, guide
      updates, pinned guidance, AI-assistant distribution, and process packaging can all create operational
      switching cost once content is embedded across workflows. The open question is whether that creates durable
      retention or merely makes Scribe one layer inside a broader documentation stack.
    claimRefs:
      - "CP002"
      - "CP006"
      - "CP007"
      - "CP008"
      - "CP011"
      - "CP012"
    tableRefs:
      - "TP003"
  - id: "durability"
    title: "Durability hinges on moving beyond guide creation into higher-value workflow context"
    body: >-
      The strongest bullish read is that Scribe already has enough scale and product adjacency to remain the
      default workflow-documentation layer for many operations, enablement, and IT teams. Capture, AI-authored
      packaging, auto-updating guides, guided execution, and MCP or API distribution all deepen the value of the
      content once it is created. The bearish read is also visible in the assigned pool: review and competitor
      sources repeatedly frame Scribe as easy to use but still exposed to commoditization from low-cost capture
      peers, video tools for training, and process-intelligence vendors that promise richer discovery,
      governance, and delivery artifacts. Without public retention, multi-homing, or Scribe Optimize attach-rate
      data, moat durability is directionally positive but not fully underwritten.
    claimRefs:
      - "CP004"
      - "CP005"
      - "CP008"
      - "CP010"
      - "CP011"
      - "CP012"
      - "CP013"
