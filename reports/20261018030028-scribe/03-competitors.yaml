callouts:
  - calloutType: "strength"
    title: "Documentation-layer moat is broader than simple screen capture"
    body: >-
      Scribe is trying to turn workflow capture into a distribution and execution layer by combining Pages, AI
      writing, auto-updating guides, pinned walkthroughs, translation, and MCP or API access for assistants.
    claimRefs:
      - "CP003"
      - "CP006"
      - "CP011"
  - calloutType: "risk"
    title: "The clearest opening is packaging and substitution, not lack of product value"
    body: >-
      Buyers who only need video, in-app guidance, or deeper process-intelligence outputs can route around
      Scribe, and the public pricing step-up around enterprise controls makes that substitution economically
      easier for some teams.
    claimRefs:
      - "CP007"
      - "CP009"
      - "CP010"
      - "CP012"
