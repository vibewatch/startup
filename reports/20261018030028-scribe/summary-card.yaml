  topStrengths:
    - Proven workflow-capture product with clear enterprise relevance and broad top-of-funnel adoption.
    - Publicly disclosed $100M ARR benchmark and meaningful venture backing at a $1.3B post-money valuation.
    - Product expansion into AI workflow intelligence and agent enablement creates a credible second growth vector.
  topRisks:
    - Public scale metrics remain internally inconsistent across users, customers, organizations, and headcount.
    - Retention, gross margin, burn, runway, and cap-table economics remain undisclosed in the public record.
    - Workflow capture can create privacy or surveillance concerns if governance and controls are not handled well.
  unresolvedGaps:
    - Audited ARR, gross margin, burn, runway, and NRR remain unavailable in the public record.
    - The bridge between users, organizations, employees, and paying customers still is not publicly reconciled.
    - Board composition, liquidation preferences, and detailed cap-table economics are not publicly disclosed.
    - Public evidence does not provide incident logs, SLA-credit data, or churn cohorts by customer segment.
    - The attach rate and monetization curve for Scribe Optimize versus the legacy documentation product remain unclear.
