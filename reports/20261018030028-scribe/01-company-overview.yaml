      - Key-person dependency
    rows:
      - ["Jennifer Smith", "Cofounder and CEO", "TechCrunch and Forbes identify Smith as Scribe's public-facing cofounder/CEO; she is the quoted voice on workflow visibility, automation, and AI agents.", "Strong founder-market fit on workflow analysis, operating pain points, and GTM narrative.", "High: strategy, fundraising story, and external market narrative remain concentrated in Smith."]
      - ["Aaron Podolny", "Cofounder and CTO", "TechCrunch and Forbes identify Podolny as the technical cofounder; the company origin story pairs him with Smith at launch.", "Owns technical founding credibility behind capture, productization, and AI expansion.", "High: retained public evidence surfaces little substitute technical leadership depth beyond the cofounder."]
      - ["Krista Alderman", "Head of New Business Sales (hiring manager on Oct. 2026 role)", "Simplify's enterprise-sales posting names Alderman as hiring manager for a large-enterprise sales leader.", "Signals dedicated enterprise-sales management and a maturing commercial layer below the founders.", "Medium: useful GTM depth signal, but public evidence still does not reveal the broader executive bench or board."]
    notes: >-
      Partial public leadership surface only; rows reflect leaders named in retained sources,
      not a complete executive or board roster.
    enumerationScope:
      coverage: partial
      basis: Publicly retained sources identify the two founders and one sales leader, but they do not disclose a full board or executive roster as of the run date.
    claimRefs: [CO002, CO015]
  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Role
      - Control or economic importance
      - Diligence ask
    rows:
      - ["Jennifer Smith", "Cofounder / CEO", "Likely central operating and narrative control based on all retained public leadership references.", "Request board seat, voting control, and retention package detail."]
      - ["Aaron Podolny", "Cofounder / CTO", "Likely central technical and product control because retained evidence still centers the founding pair.", "Confirm product ownership, technical succession depth, and any super-voting or founder protections."]
      - ["StepStone", "Series C lead investor", "Led the disclosed $75M November 2025 financing at a $1.3B post-money valuation.", "Request ownership %, terms, pro rata, and any governance rights."]
      - ["Amplify Partners / Redpoint Ventures / Tiger Global / Morado Ventures / New York Life Ventures", "Existing investors in disclosed Series C syndicate", "Follow-on participation signals continuing sponsor support but does not reveal exact ownership or preferences.", "Request round-by-round cap table, preference stack, and side-letter rights."]
      - ["Large-enterprise buyers", "Economic stakeholders in current GTM expansion", "The October 2026 hiring profile centers 10,000+ employee accounts and six-figure ARR deals, implying enterprise expansion is financially material.", "Test enterprise pipeline concentration, ACV distribution, and procurement-cycle length."]
    notes: >-
      This is a partial stakeholder map derived from public financing coverage and company-distributed
      hiring materials; undisclosed ownership, board rights, and secondaries remain open diligence items.
    enumerationScope:
      coverage: partial
      basis: Public evidence identifies founders, the named Series C lead, participating investors, and the target enterprise buyer segment, but not a full cap table or governance map.
    claimRefs: [CO002, CO011, CO012, CO015]
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: Scribe progressed from a 2019 workflow-documentation startup to a 2025-2026 AI-agent and workflow-intelligence platform with meaningful commercial scale but still-open governance and metric reconciliation questions.
    data:
      items:
        - date: "2019"
          label: Founded by Jennifer Smith and Aaron Podolny
          detail: Independent reporting consistently dates the company's founding to 2019 and ties both founders to the original workflow-capture concept.
          tone: positive
          claimRefs: [CO002]
        - date: "2025-11-10"
          label: Series C financing set the current public valuation anchor
          detail: TechCrunch reported a $75M all-equity Series C at a $1.3B post-money valuation led by StepStone.
          tone: positive
          claimRefs: [CO011]
        - date: "2025-11-10"
          label: Scribe Optimize became the next product wedge
          detail: The same financing story tied new capital to Scribe Optimize, which maps workflows to identify automation and AI opportunities.
          tone: positive
          claimRefs: [CO005, CO011]
        - date: "2025-11-10"
          label: Late-2025 public scale marker
          detail: TechCrunch cited more than 5 million users and 78,000 paid organizations, establishing a large installed base before the 2026 AI push.
          tone: positive
          claimRefs: [CO008]
        - period: "April 2026"
          label: ARR crossed nine figures
          detail: Forbes reported that Scribe crossed $100M in annualized recurring revenue in April 2026.
          tone: positive
          claimRefs: [CO013]
        - date: "2026-05-10"
          label: Forbes framed Scribe as both fast-growing and surveillance-sensitive
          detail: The profile described 80,000 customers, 600,000 free organizations, and more than 6 million employees with the app, while also noting broader bossware-style privacy concerns around workplace monitoring tools.
          tone: risk
          claimRefs: [CO009, CO016]
        - date: "2026-09-23"
          label: Support materials showed a broader operating suite
          detail: The updated user guide referenced Home, Insights, Approval Requests, and Optimize, suggesting a larger workflow stack than simple one-off guides.
          tone: positive
          claimRefs: [CO004, CO005]
        - period: "October 2026"
          label: Enterprise-sales hiring signaled continued upmarket push
          detail: Scribe recruited for a leader managing six-figure ARR deals in 10,000+ employee accounts, reinforcing an enterprise expansion agenda.
          tone: positive
          claimRefs: [CO015]
    approximationNotes: null
    claimRefs: [CO002, CO004, CO005, CO008, CO009, CO011, CO013, CO015, CO016]
callouts:
  - calloutType: strength
    title: Real product-to-platform expansion is visible
    body: The retained source set shows a credible progression from auto-generated guides to workflow intelligence and AI-agent context, rather than a purely aspirational AI relabeling.
    claimRefs: [CO001, CO004, CO005, CO013]
  - calloutType: risk
    title: Public traction exists, but metric definitions remain unresolved
    body: Scribe's user, customer, organization, and headcount disclosures all point to scale, yet they are not directly comparable enough to underwrite without a management reconciliation pack.
    claimRefs: [CO008, CO009, CO010, CO014]
