company:
  name: "Qonto"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Founded in 2016 by Alexandre Prot and Steve Anavi and launched in 2017, Qonto has established itself as the leading European business-finance platform and payment institution for SMEs and freelancers, serving over 750,000 clients across eight markets. Headquartered in Paris and operating as Olinda SAS, the company has raised approximately $717 million (€622 million) in total funding, achieved a $5.0 billion valuation in its Series D round, and is actively pursuing a full European credit institution license while maintaining a Paris headquarters footprint that houses 900 workstations."
sections:
  - id: "identity-corporate-structure"
    title: "Corporate Identity, Foundation, and Licensing Evolution"
    body: "Qonto was founded in 2016 by French entrepreneurs Alexandre Prot and Steve Anavi to address the friction, administrative burden, and poor user experiences European small and medium-sized enterprises (SMEs) faced when opening and operating traditional commercial bank accounts. Registered in France under the legal entity name Olinda SAS (incorporation registration number CIN 819489626), the company is headquartered at 18 Rue de Navarin, 75009 Paris, France. Qonto publicly launched its commercial digital financial service in July 2017, initially relying on third-party banking-as-a-service infrastructure via Treezor before securing its own regulated payment institution license and migrating its customer base onto an in-house core banking engine. In 2025, Qonto formally submitted its application for a European credit institution (full banking) license, marking a strategic transition from a digital payment institution into a directly regulated banking institution across its European markets. In September 2026, Qonto inaugurated its new 11,000-square-meter Paris headquarters, Bonne Nouvelle, featuring 900 workstations across nine floors to centralize operations and support continued continental growth."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
    tableRefs:
      - "TO001"
  - id: "governance-leadership"
    title: "Leadership Architecture, Governance, and Key-Person Risk"
    body: "Qonto operates under an executive structure led by its co-founders alongside experienced functional executives who manage its international scaling, technology platform, and regional markets. Co-founder and Chief Executive Officer Alexandre Prot directs corporate strategy, regulatory licensing relationships, and commercial growth, while co-founder and President Steve Anavi oversees platform design, operational execution, and long-term positioning. Prior to co-founding Qonto, both founders previously created and scaled Smokio, an early connected-device venture acquired in 2016. Chief Technology Officer Aymeric Augustin leads the core engineering and artificial intelligence infrastructure, directing platform automation and AI agent deployments. The company's corporate governance is anchored by a formal board of directors comprising five active members: co-founders Alexandre Prot and Steve Anavi, alongside independent and lead investor directors including James Fitzgerald, Philippe Teixeira Da Mota, and Guillaume Aubin. The concentration of strategic vision and institutional knowledge in the two founders represents an identifiable key-person dependency, balanced by experienced external board representatives and executive hires in people, operations, risk, and regional country management."
    claimRefs:
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
    tableRefs:
      - "TO002"
  - id: "capitalization-shareholders"
    title: "Financing History, Valuation, and Stakeholder Composition"
    body: "Qonto is among the most heavily capitalized private fintech companies in Europe, having raised $717 million (€622 million) in total funding across multiple institutional equity rounds. The company's capitalization trajectory accelerated through its Series B ($8.27 million in early 2021), followed by its landmark $552 million (€486 million) Series D funding round in January 2022 led by Tiger Global Management and TCV, alongside existing backers Valar Ventures, Alven, DST Global, and Tencent, and new participants including KKR, Insight Partners, Eurazeo, Alkeon, and Exor Seeds. A small additional Series D tranche of $5.42 million was completed in April 2022. The Series D valuation reached $5.0 billion (€4.4 billion), implying an enterprise valuation multiple of approximately 54.5x on historical annual revenues at the time. While secondary share transactions and private equity participation exist, the company has not raised primary equity since 2022, relying on balance sheet reserves and expanding software revenues. Annual recurring revenue reached an estimated $149 million to $220 million run-rate by 2026, though audited net income margins and cohort-level churn metrics remain closely guarded private figures."
    claimRefs:
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
    tableRefs:
      - "TO003"
  - id: "operational-scale-milestones"
    title: "Operational Scale, Geographic Expansion, and Platform Evolution"
    body: "Qonto's operating scale expanded from 220,000 customers at the time of its Series D announcement in 2022 to over 750,000 daily business clients by September 2026 across eight European countries: France, Germany, Italy, Spain, Austria, Belgium, the Netherlands, and Portugal. This trajectory was augmented by programmatic M&A, highlighted by the strategic acquisition of German competitor Penta in 2022, which brought 50,000 German SME accounts and consolidated Qonto's presence in the DACH market. Headcount grew from roughly 500 personnel in early 2022 to over 1,700 full-time employees in 2026, with 450 new employees recruited in 2026 alone. Simultaneously, Qonto expanded its product architecture from straightforward business bank accounts and debit cards into a full financial operating system incorporating invoicing, automated bookkeeping, expense approvals, multi-currency transactions, company incorporation services, and embedded AI agents for invoice parsing and workflow management. Historical financial disclosures indicate a 27 million euro loss in fiscal year 2020; while management has targeted operating profitability by 2025-2026, unaudited management claims have yet to be independently confirmed via statutory financial releases."
    claimRefs:
      - "CO004"
      - "CO005"
      - "CO015"
      - "CO016"
    figureRefs:
      - "FO001"
