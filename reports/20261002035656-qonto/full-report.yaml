      - number: '3.2'
        title: Feature Matrix and Tiered Pricing Dynamics
        blocks:
          - type: paragraph
            body: >-
              Differentiation between Qonto and its primary alternatives reflects fundamentally different packaging and
              revenue architectures. Qonto operates an unbundled subscription model ranging from €9 per month for solo
              freelancers to €249 or more for enterprise organizations, monetizing additional user seats, corporate
              cards, and transaction volumes above plan quotas. Unlike freemium alternatives such as Revolut Business or
              entry-level freelancer tools, Qonto offers no permanent free tier, requiring customers to commit to
              recurring subscription fees from onboarding. However, Qonto establishes initial operational lock-in by
              offering share capital deposit certificates for company registration within 72 hours for approximately
              €100, an administrative workflow absent from Revolut Business. For growing teams, Qonto bundles smart
              company cards with spend limits, automated receipt capture, real-time VAT detection, and native electronic
              invoicing in 29 currencies. Conversely, customers with extensive cross-border payment requirements face
              higher foreign exchange markups in Qonto than in Revolut Business or Wise, making multi-currency commerce
              an ongoing point of competitive vulnerability.
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP008
              - CP010
              - CP011
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
