      - number: '5.2'
        title: Core Banking Architecture, Engineering Organization, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              The core technical differentiator of Qonto's software stack is its proprietary in-house core banking
              system (CBS), which the company migrated to in 2020 after initially bootstrapping operations on
              third-party banking-as-a-service provider Treezor [CE001]. Operating under its own payment institution
              license, Qonto manages ledger state, account balances, and direct payment scheme connections internally
              rather than delegating custody and ledger execution to an external BaaS platform [CE001, CE006]. The
              engineering organization scales backend services through a dedicated Foundations domain comprising
              approximately 110 backend engineers responsible for critical platform services including transactions
              processing, search indexing, billing, multi-tenant permissions, internal tooling, and external partner
              integrations [CE003]. To sustain system resilience as transaction throughput reaches approximately 600,000
              daily events approaching one billion total processed records, the engineering organization enforces
              standardized living technical documentation across more than 50 functional scopes [CE003, CE009].
              Cross-functional engineering, product, and operations teams coordinate their roadmap, service
              dependencies, and Lean problem-solving workflows using centralized databases and living specifications
              rather than static handoffs [CE009, CE010, CE011].
            claimRefs:
              - CE001
              - CE003
              - CE006
              - CE009
              - CE010
              - CE011
