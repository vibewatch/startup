      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The bundle can deepen monetization through subscription tiers, transaction commissions, premium finance
              tools, and partner services, while adjacent workflows such as business travel can increase engagement.
              Public pricing snapshots nevertheless have different dates and scopes: an archived G2 page showed Basic,
              Smart, and Premium plans at €9, €19, and €39 per month, while a 2024 article described plans spanning €9
              to €299 plus transaction commissions. Customer evidence is positive overall but exposes adoption friction
              around account setup, specialized payment instruments, credit availability, and integrations. These
              limitations constrain expansion into more complex SMEs and mean that customer count alone cannot justify
              valuation without cohort retention, revenue by segment, attach rates, and country-level unit economics.
