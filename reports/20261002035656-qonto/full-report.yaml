      - number: '2.2'
        title: Evidence-constrained market sizing
        blocks:
          - type: paragraph
            body: >-
              The strongest assigned sizing evidence is Qonto's disclosed operating footprint, not a third-party
              market-spend forecast. TechCrunch reported 220,000 paying companies in four countries in January 2022;
              International Finance reported 450,000 customer companies in September 2024; and a July 2026 partner
              release described more than 600,000 SMEs and freelancers across eight countries. These vintages indicate
              expansion, but they are not directly comparable audited cohorts and do not establish category growth,
              retention, or market share. No assigned source supplies the total number of eligible European firms,
              addressable subscription spend, country-level penetration, or a bottoms-up conversion bridge. The
              investment case therefore needs a footprint lens today and a separately diligenced TAM/SAM/SOM before
              valuation is tied to market share.
