      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The core buyer is a founder, owner, or finance lead at a small organization, while employees and
              accountants are recurring users and the legal entity is the payer. Company formation is a meaningful
              acquisition trigger: Qonto's chief executive said in 2022 that around one third of customers created their
              companies with Qonto. Existing businesses form the other route, split between replacing an incumbent
              account and multi-homing alongside one or more accounts. Adoption is therefore driven by quick onboarding,
              one subscription replacing several administrative tools, accountant collaboration, and real-time control
              over employee spend. Country-specific accounting integrations and local banking practices make
              distribution and localization as important as a generic European brand.
