  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Historical price and current scale signals flow through unresolved financial, ownership, and liquidity gaps to a
      research-more decision.
    data:
      nodes:
        - id: priced-round
          label: January 2022 priced round
          detail: €486m raised at €4.4bn; $552m at $5bn.
        - id: scale-signal
          label: Current scale signal
          detail: Public 2026 sources report 600k to 750k+ customers across eight countries.
        - id: economics-gap
          label: Economics gap
          detail: Current revenue, margin, retention, cash flow, and verified profitability are unavailable.
        - id: ownership-gap
          label: Ownership gap
          detail: Fully diluted cap table, debt, dilution, and preference waterfall are unavailable.
        - id: liquidity-gap
          label: Liquidity gap
          detail: No committed IPO strategy or supported exit timing appears in the assigned evidence.
        - id: recommendation
          label: Research more
          detail: Do not treat the 2022 valuation as a current floor or issue a numeric range.
      edges:
        - from: priced-round
          to: scale-signal
        - from: scale-signal
          to: economics-gap
        - from: economics-gap
          to: ownership-gap
        - from: ownership-gap
          to: liquidity-gap
        - from: liquidity-gap
          to: recommendation
    approximationNotes: Amounts preserve the reporting currencies and periods; the flow does not estimate a present valuation.
    claimRefs:
