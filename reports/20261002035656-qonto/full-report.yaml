              - CI014
      - number: '4.3'
        title: Capital Adequacy, Financing Dependency, and Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              Qonto has accumulated substantial capitalization across multiple funding rounds, culminating in a 552
              million dollar Series D in January 2022 led by TCV and Tiger Global at a 5 billion dollar post-money
              valuation, supplemented by a 5 million euro customer crowdfunding campaign on Crowdcube in April 2022.
              Lifetime capital raised exceeds 600 million euros, providing substantial runway that shields the company
              from immediate equity dilution or venture debt dependency. Nonetheless, for underwriting purposes,
              material information asymmetries persist: Qonto does not disclose audited gross margins, cohort-level net
              revenue retention (NRR), churn by country, or standalone German performance following its acquisition of
              competitor Penta. The financial profile reflects strong European SME commercial scale, but an exit via
              public listing will demand formal disclosure of cohort durability and unit economics.
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital Deposit as a Low-CAC Inbound Channel
            body: >-
              Around one-third of Qonto customers originate by registering their company and depositing share capital
              directly through the platform. This mechanism creates an exceptionally cost-effective customer acquisition
              flywheel compared to traditional fintech marketing.
            calloutType: insight
            claimRefs:
              - CI005
          - type: callout
            title: Private Unit Economics Obscure Public Underwriting
            body: >-
              Although Qonto asserts progress toward 2026 profitability, the absence of public NRR, gross margin, and
              statutory financials since FY2020 means prospective investors must independently audit cohort retention
              and true interchange unit economics.
            calloutType: risk
            claimRefs:
              - CI007
              - CI008
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Scope and Customer Workflow Modules
        blocks:
          - type: paragraph
            body: >-
              Qonto designs its product as an integrated financial operating system for European small and medium-sized
              enterprises (SMEs) and freelancers, structuring everyday financial operations across three complementary
              pillars: day-to-day business banking, bookkeeping automation, and corporate spend management [CE001,
              CE006]. The primary entry point for newly created enterprises is digital company formation and paid-up
              capital deposit, which pairs local European IBAN issuance with business registration in France, Germany,
              Italy, and Spain [CE001, CE007]. For ongoing operations, Qonto replaces disparate financial software by
              integrating SEPA instant transfers, physical and virtual Mastercard payment cards with configurable
              spending rules, automated VAT and receipt reconciliation, and digital invoice generation [CE001, CE002,
              CE006, CE008]. To eliminate cross-border connectivity friction for mobile European business teams, Qonto
              also directly embeds travel eSIM provisioning via Gigs natively within the mobile application, granting
              cellular connectivity in over 180 countries without requiring external telecom roaming subscriptions
              [CE005]. As European tax authorities enforce B2B electronic invoicing reforms, Qonto is upgrading its
              accounts payable and accounts receivable modules to function as a registered e-invoicing platform
              connecting directly to government tax portals across France, Spain, and Germany [CE004].
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
