        - label: 2026 - Bonne Nouvelle HQ
          date: 2026-09
          detail: >-
            Opens 11,000 sqm Paris headquarters with 900 desks supporting 1,700 employees and over 750,000 active
            European businesses.
          claimRefs:
            - CO005
            - CO007
