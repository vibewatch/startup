        - Data room verifies the assumptions and a current arm's-length price offers a credible target return.
      - - Base
        - Scale persists, but profitability, retention, and ownership evidence remain incomplete.
        - Wait or negotiate evidence-linked pricing and protections; no public-data range is supportable.
        - Paying-customer quality and margin conversion remain unknown.
        - Financial evidence improves without fully closing the preference and exit gaps.
      - - Bear
        - The 2022 mark anchors expectations while growth quality or profitability disappoints.
        - Assume the historical mark is not a floor and require downside analysis through the preference waterfall.
        - Down-round, dilution, preference overhang, competition, and delayed liquidity.
        - A current transaction prices below the old mark or verified operating metrics miss management targets.
    notes: >-
      Scenarios are conditional diligence cases, not forecasts; numeric values and probabilities are intentionally
      withheld because current financial, comparable, and capital-structure inputs are unavailable.
    claimRefs:
      - CV001
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV015
      - CV016
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Key evolutionary milestones for Qonto from its Paris founding in 2016 to continental expansion, unicorn financing,
      and 2026 banking license pursuit.
    data:
      items:
        - label: 2016 - Incorporation
          date: 2016-04
          detail: >-
            Olinda SAS incorporated in Paris by Alexandre Prot and Steve Anavi to build a modernized SME banking
            service.
          claimRefs:
            - CO002
        - label: 2017 - Commercial Launch
          date: 2017-07
          detail: >-
            Qonto officially launches in France, offering digital business accounts and cards powered by Treezor
            infrastructure.
          claimRefs:
            - CO001
            - CO003
        - label: 2019 - Core Banking Migration
          date: 2019-06
          detail: >-
            Secures French payment institution license from ACPR and builds proprietary core banking system to eliminate
            third-party dependency.
          claimRefs:
            - CO003
        - label: 2020 - European Expansion
          date: 2020-01
          detail: >-
            Launches local operations in Germany, Italy, and Spain, scaling customer base to 100,000 businesses despite
            €27M net loss.
          claimRefs:
            - CO004
            - CO016
        - label: 2022 - Series D Financing
          date: 2022-01
          detail: Raises $552M (€486M) led by Tiger Global and TCV at a $5.0B (€4.4B) valuation, serving 220,000 clients.
          claimRefs:
            - CO012
            - CO013
        - label: 2022 - Penta Acquisition
          date: 2022-07
          detail: >-
            Acquires German digital banking rival Penta, absorbing 50,000 corporate clients and consolidating European
            leadership.
          claimRefs:
            - CO004
        - label: 2024 - Benelux & Portugal Expansion
          date: 2024-03
          detail: >-
            Expands coverage to 8 European markets including Austria, Belgium, Portugal, and the Netherlands, reaching
            600,000 clients.
          claimRefs:
            - CO004
            - CO010
        - label: 2025 - Banking License Application
          date: 2025-06
          detail: >-
            Submits formal application for European credit institution license to enable direct lending and deposit
            insurance.
          claimRefs:
