  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: European SME Banking and Finance Landscape
        blocks:
          - type: paragraph
            body: >-
              The European small and medium-sized enterprise (SME) business finance landscape is characterized by
              multi-tiered competition spanning generalist cross-border neobanks, local French fintechs, and dedicated
              software solutions. Qonto positions itself as an integrated business finance management platform rather
              than a pure balance sheet bank, serving over 600,000 businesses across eight European markets including
              France, Germany, Italy, and Spain. In contrast to international transaction specialists like Revolut
              Business, which leverage multi-currency accounts and wholesale foreign exchange pricing, Qonto focuses
              primarily on domestic French company creation workflows, local IBAN issuance, and multi-user team expense
              management. Meanwhile, national competitors such as Shine target cost-conscious micro-enterprises and
              freelancers with simplified flat-rate banking, and vertical platforms like Spendesk provide
              enterprise-grade spend controls that overlap with Qonto's higher subscription tiers. Beyond direct
              neobanks, incumbent traditional banks still control the majority of commercial deposits and credit lines,
              forcing fintechs like Qonto to partner with external lending entities such as October, Cashbee, and
              Banxware rather than underwriting balance-sheet loans directly.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
