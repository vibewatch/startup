      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Transition from Neobank to Regulated Credit Institution
            body: >-
              Qonto's formal application in 2025 for a full European credit institution license represents a fundamental
              strategic transition. Operating as an authorized payment institution allowed rapid software deployment and
              agile product development, but restricted Qonto to payment facilitation and pass-through partnerships for
              credit and deposit interest. Securing a banking license will allow Qonto to retain customer deposits
              directly on balance sheet, expand high-margin direct lending to European SMEs, and structurally reduce
              funding costs.
            calloutType: insight
            claimRefs:
              - CO006
              - CO007
          - type: callout
            title: Valuation Benchmark Stagnation and Private Financial Opacity
            body: >-
              Qonto's $5.0 billion valuation benchmark was established in January 2022 during a peak in global fintech
              market valuations, representing an enterprise revenue multiple in excess of 50x. While customer accounts
              have grown from 220,000 to over 750,000, Qonto has kept full statutory financial statements confidential
              since posting a €27 million loss in 2020. The lack of audited EBITDA, net revenue retention (NRR), and
              unit economics creates valuation uncertainty ahead of any prospective European IPO.
            calloutType: risk
            claimRefs:
              - CO012
              - CO015
              - CO016
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Qonto's relevant market is the paid operating layer used by European freelancers and small and midsize
              businesses to hold and move business funds, issue cards, invoice customers, collect and reconcile
              receipts, manage team spend, and coordinate bookkeeping. The boundary is wider than a business current
              account because the product bundles payments and finance operations, but narrower than full enterprise
              resource planning, complex multi-entity accounting, or specialist credit. The principal substitutes are a
              traditional bank plus separate accounting and expense tools, cloud-accounting products, and continued use
              of multiple bank accounts. This distinction matters for sizing: deposits, loan principal, and the full
              accounting-software market should not be counted as Qonto-addressable spend merely because they touch the
              same buyer.
            claimRefs:
              - CM001
              - CM008
              - CM009
              - CM014
              - CM015
