              - CP012
      - number: '3.3'
        title: Switching Costs, Ecosystem Lock-in, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              A central diligence consideration is whether Qonto's business finance management software creates durable
              competitive moats or remains vulnerable to displacement. Customer switching costs in SME banking stem less
              from payment card issuance and more from deep accounting synchronization, supplier directory links, and
              automated reconciliation. By integrating natively with regional accounting platforms such as Cegid in
              France and Datev in Germany, Qonto embeds its transaction ledger directly into external CPA workflows,
              illustrated by French accounting practices that standardize client operations on Pennylane and Qonto.
              Additionally, Qonto expanded its ecosystem through embedded travel connectivity via Gigs, enabling team
              administrators to assign international eSIMs natively within the banking dashboard. Despite these
              integrations, Qonto operates as a regulated payment institution rather than a fully licensed credit
              institution, relying on embedded partnerships like Banxware to offer short-term financing. Because
              customers cannot obtain primary commercial mortgages or large-scale revolving credit lines directly from
              Qonto, multi-homing remains prevalent, with approximately two-thirds of customers maintaining parallel
              accounts at traditional banks.
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Administrative Workflows as a Retention Anchor
            body: >-
              Qonto's primary defense against lower-cost or free fintech accounts is its embedding in the French
              corporate formation and accounting ecosystem. By capturing clients during initial share capital deposit
              and linking directly into external accounting software, Qonto converts routine banking into an
              administrative hub that increases operational switching hurdles.
            calloutType: insight
            claimRefs:
              - CP002
              - CP008
              - CP013
          - type: callout
            title: Cross-Border FX and Multi-Currency Vulnerability
            body: >-
              For internationally active businesses and e-commerce merchants receiving non-euro currencies, Qonto's
              foreign exchange markup and international transfer fees remain less competitive than specialized platforms
              like Revolut Business or Wise, encouraging multi-homing or full migration among globally scaling SMEs.
            calloutType: risk
            claimRefs:
              - CP003
              - CP011
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization Architecture
        blocks:
          - type: paragraph
            body: >-
              Qonto generates revenue through a hybrid model combining recurring SaaS subscriptions with
              transaction-based interchange and workflow commissions. Core plans are priced on a tiered monthly basis
              starting at 9 euros per month for freelancers and scaling up to 249 or 299 euros per month for larger
              enterprise tiers. Beyond recurring software access, Qonto captures interchange on corporate card
              transactions, fees on international multi-currency transfers across 29 currencies, and platform margin on
              embedded third-party offerings. The company maintains an inbound customer acquisition motion where
              approximately one-third of clients register their company and complete statutory capital deposits directly
              through Qonto, creating a low-CAC onboarding funnel that converts newly formed legal entities into
              long-term subscribers.
            claimRefs:
              - CI001
