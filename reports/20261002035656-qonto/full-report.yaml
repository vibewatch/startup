      - number: '4.2'
        title: Cost Structure, Unit Economics, and Operating Leverage
        blocks:
          - type: paragraph
            body: >-
              The primary components of Qonto's cost structure include payment network fees, regulatory compliance
              infrastructure, banking core operations, and specialized personnel. In 2020, Qonto transitioned from
              relying exclusively on BaaS intermediary Treezor to operating its proprietary core banking system as a
              licensed payment institution, capturing greater transactional gross margin and eliminating per-account
              middleware costs. However, customer acquisition across six major European markets and product scaling have
              required extensive marketing spend and engineering headcount expansion to over 1,600 personnel. While the
              neobank previously reported a 27 million euro loss in 2020, management reported significant margin
              expansion over subsequent years with plans to achieve operating profitability by 2026.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
          - type: table
