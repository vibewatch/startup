          - type: callout
            title: Complexity can narrow the serviceable market
            body: >-
              Customer and comparison evidence points to gaps in specialized payment instruments, credit, advanced
              banking functionality, and integrations, which may limit adoption among complex SMEs.
            calloutType: risk
            claimRefs:
