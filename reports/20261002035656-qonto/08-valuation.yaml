  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: current-valuation
      missingEvidence: "Current fully diluted cap table, debt schedule, cash balance, liquidation preferences, and any arm's-length primary or secondary transaction terms."
      whyItMatters: "Entry ownership, dilution, preference overhang, and downside proceeds cannot be calculated from funding totals or a 2022 post-money mark."
      diligencePath: "Obtain the board-approved cap table, financing documents, debt agreements, cash statement, and recent secondary indications; model proceeds through the preference waterfall."
      relatedQuestionRefs: [QV002, QV005, QV007]
    - type: private-evidence-only
      severity: material
      topic: profitability
      missingEvidence: "Audited 2025-2026 revenue, ARR definition, gross margin, operating profit, cash flow, retention, churn, and cohort contribution economics."
      whyItMatters: "The operating denominator and profit conversion needed for valuation and return analysis are not verified by the assigned public sources."
      diligencePath: "Review audited financial statements, monthly management accounts, revenue-recognition policy, bank statements, and customer cohorts reconciled to the general ledger."
      relatedQuestionRefs: [QV004, QV005]
    - type: missing-source
      severity: material
      topic: comparable-set
      missingEvidence: "A comparable set with aligned business model, geography, revenue definition, growth, margin, retention, and transaction date."
      whyItMatters: "Using unmatched fintech or SaaS multiples would create a precise-looking but unsupported valuation range."
      diligencePath: "Build public-company, private-round, M&A, and secondary benchmarks after current Qonto operating metrics are verified on matching definitions."
      relatedQuestionRefs: [QV008]
    - type: conflicting-data
      severity: minor
      topic: customer-scale
      missingEvidence: "A dated reconciliation of active, paying, SME, freelancer, and acquired customer counts across the 600,000 and 750,000-plus public figures."
      whyItMatters: "Unreconciled population definitions weaken growth and monetization comparisons."
      diligencePath: "Request monthly customer bridges by country, plan, active status, paying status, acquisition source, and the exact reporting cut-off."
      relatedQuestionRefs: [QV003]
