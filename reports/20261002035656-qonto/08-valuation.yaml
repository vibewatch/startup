schemaVersion: "report-v2"
artifact: valuation
slug: qonto
runDate: 2026-10-02
company:
  name: Qonto
chapter:
  number: 8
  title: Valuation
  summary: >-
    Qonto's operating scale and product breadth are credible, but the only
    independently corroborated priced valuation in the assigned evidence is the
    €4.4 billion ($5 billion) Series D mark from January 2022. A current entry
    valuation, verified profitability, retention, preference stack, and comparable
    multiple set are unavailable, so the evidence supports research-more rather
    than underwriting a price from the stale round.
sections:
  - id: historical-price-anchor
    title: Historical price anchor, not a current valuation
    body: >-
      The January 2022 Series D is the only firm price anchor in the assigned
      evidence: TechCrunch and FinTech Futures reported €486 million ($552
      million) raised at €4.4 billion ($5 billion). Tracxn separately records the
      round at a 54.5x revenue multiple, but that database observation is not a
      current market quote and its revenue denominator is not disclosed in the
      fetched text. Funding totals also vary by source and currency, while Clay
      displays two different dollar totals on the same page. These inconsistencies
      make funding history useful context but not a substitute for current
      enterprise value, fully diluted ownership, or cash available today.
    claimRefs: [CV001, CV002, CV003, CV004]
    tableRefs: [TV001]
  - id: scale-and-quality-signals
    title: Scale supports diligence, but not the old price
    body: >-
      Qonto's current press page reports more than 750,000 SMEs and freelancers
      across eight countries, while a July 2026 partner release reports 600,000.
      The difference may reflect timing, scope, or definitions, but the public
      material does not reconcile it. Historical coverage reported 450,000
      companies in 2024 and 220,000 paying companies in 2022, and the App Store
      displayed a 4.7 rating from 1.3 thousand ratings when reviewed. Together
      these signals support meaningful adoption and product relevance; they do
      not establish retention, revenue quality, margins, or a current valuation
      multiple.
    claimRefs: [CV005, CV006, CV007, CV008, CV014]
    tableRefs: [TV002]
  - id: downside-and-scenarios
    title: Downside is dominated by missing financial and capital-structure evidence
    body: >-
      The latest accounting outcome cited in the assigned material is a €27
      million loss for 2020; that accounting loss is not cash burn. A 2024 article
      relayed management's expectation of reaching profitability in 2025, but no
      assigned source verifies that the target was achieved. Clay also flags
      competition, crowdfunding regulation, security, and reliability as
      challenges. Because current revenue or ARR, gross margin, retention, cash,
      debt, liquidation preferences, and fully diluted ownership are absent,
      numeric bull, base, and bear valuation ranges would be false precision.
      The scenarios therefore define evidence and price conditions rather than
      unsupported point estimates.
    claimRefs: [CV009, CV010, CV012, CV013, CV015, CV016]
    tableRefs: [TV003]
  - id: decision-and-diligence
    title: "Decision: research more before discussing price"
    body: >-
      The recommendation is research more, with medium confidence and high
      underwriting risk driven primarily by evidence gaps rather than a conclusion
      that the company is weak. Qonto has scale, a broad finance workflow, and
      substantial historical backing, but the 2022 valuation cannot serve as a
      present-day floor. Management also said in 2024 that an IPO was not the
      strategy, leaving timing and liquidity uncommitted. A decision-ready process
      requires audited current financials, cohort retention, reconciled customer
      definitions, a current cap table and preference waterfall, secondary-market
      evidence, and a comparable set built on matching revenue and margin
      definitions. Until then, no target return, hold period, or exit value is
      supportable.
    claimRefs: [CV001, CV005, CV006, CV011, CV012, CV016]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Decision implication]
    rows:
      - [Recommendation, "Research more", "Do not underwrite an entry price until the named data-room evidence is verified."]
      - [Confidence, "Medium", "The historical round and scale are corroborated, but present financial and ownership inputs are missing."]
      - [Risk rating, "High underwriting risk", "Evidence and capital-structure uncertainty can dominate company-quality signals."]
      - [Valuation stance, "Insufficient current evidence", "Treat €4.4 billion / $5 billion as a January 2022 mark, not a current floor."]
    notes: "Assessment is based only on the assigned public evidence; recommendation labels are analytical judgments, not transaction advice."
    claimRefs: [CV001, CV002, CV005, CV006, CV009, CV012, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Side, Evidence-backed argument, What would change the view]
    rows:
      - [Thesis, "Qonto reports more than 750,000 SMEs and freelancers across eight countries.", "Reconcile the population and cut-off date against the partner-reported 600,000 figure."]
      - [Thesis, "The App Store showed a 4.7/5 rating from 1.3k ratings when reviewed.", "Cohort retention, active-account, and primary-account data would establish economic engagement."]
      - [Anti-thesis, "The only corroborated priced valuation is from January 2022.", "A current arm's-length primary or secondary transaction with disclosed terms would refresh the anchor."]
      - [Anti-thesis, "The evidence provides a 2020 loss and a later profitability target, not verified current profit.", "Audited 2025-2026 P&L, cash flow, and unit economics would resolve the gap."]
    notes: "Customer counts use different issuers and may use different definitions; the rating is an App Store snapshot, not a retention measure."
    claimRefs: [CV001, CV005, CV006, CV007, CV009, CV010]
  - id: TV003
    title: Bull, base, and bear scenario conditions
    columns: [Scenario, Assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Verified profitable growth, durable retention, reconciled customer scale, and clean preferences.", "Set a numeric range only after applying evidence-backed comparable multiples to audited current metrics.", "Multiple compression, regulation, security, and execution.", "Data room verifies the assumptions and a current arm's-length price offers a credible target return."]
      - [Base, "Scale persists, but profitability, retention, and ownership evidence remain incomplete.", "Wait or negotiate evidence-linked pricing and protections; no public-data range is supportable.", "Paying-customer quality and margin conversion remain unknown.", "Financial evidence improves without fully closing the preference and exit gaps."]
      - [Bear, "The 2022 mark anchors expectations while growth quality or profitability disappoints.", "Assume the historical mark is not a floor and require downside analysis through the preference waterfall.", "Down-round, dilution, preference overhang, competition, and delayed liquidity.", "A current transaction prices below the old mark or verified operating metrics miss management targets."]
    notes: "Scenarios are conditional diligence cases, not forecasts; numeric values and probabilities are intentionally withheld because current financial, comparable, and capital-structure inputs are unavailable."
    claimRefs: [CV001, CV009, CV010, CV011, CV012, CV013, CV015, CV016]
