callouts:
  - calloutType: insight
    title: Administrative Workflows as a Retention Anchor
    body: Qonto's primary defense against lower-cost or free fintech accounts is its embedding in the French corporate formation and accounting ecosystem. By capturing clients during initial share capital deposit and linking directly into external accounting software, Qonto converts routine banking into an administrative hub that increases operational switching hurdles.
    claimRefs:
      - CP002
      - CP008
      - CP013
  - calloutType: risk
    title: Cross-Border FX and Multi-Currency Vulnerability
    body: For internationally active businesses and e-commerce merchants receiving non-euro currencies, Qonto's foreign exchange markup and international transfer fees remain less competitive than specialized platforms like Revolut Business or Wise, encouraging multi-homing or full migration among globally scaling SMEs.
    claimRefs:
      - CP003
      - CP011
      - CP012
