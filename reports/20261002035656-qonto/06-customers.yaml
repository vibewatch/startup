callouts:
  - calloutType: "insight"
    title: "Capital Deposit Integration as a Customer Acquisition Engine"
    body: "Qonto's integration with business registration frameworks serves as an effective organic customer acquisition channel. By capturing roughly one-third of its customer base at the moment of share capital deposit, Qonto secures primary account status before incumbent commercial banks can initiate outreach, establishing high barriers to switching."
    claimRefs:
      - "CU002"
      - "CU014"
  - calloutType: "risk"
    title: "Unreported Cohort Retention and Software Boundary Friction"
    body: "While Qonto has successfully expanded its headline customer footprint to over 600,000 businesses, the company maintains strict confidentiality over net revenue retention and cohort churn. As client organizations mature, Qonto's lack of native operational tools—such as CRM and project tracking—creates software fragmentation that could impair long-term retention among mid-market enterprises."
    claimRefs:
      - "CU015"
      - "CU016"
