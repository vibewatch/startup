      - "TU003"
  - id: "durability-expansion-and-concentration-limits"
    title: "Durability, Inbound Acquisition Loops, and Retention Limitations"
    body: |
      The foundation of Qonto's customer acquisition model relies on a proprietary inbound capital deposit loop. Approximately one-third of all onboarded clients create their corporate entity directly through Qonto's legal business incorporation service, using the platform for their mandatory share capital deposit to register with commercial courts. For these organizations, Qonto serves as their first and exclusive operating bank account, generating structurally low customer acquisition costs and high early-stage account stickiness. Among the remaining two-thirds of customers that already possessed an operating bank account prior to onboarding, approximately half decommission their legacy accounts while the other half maintain Qonto in parallel with incumbent financial institutions.

      Despite these substantial top-of-funnel strengths and platform reported Net Promoter Scores exceeding 75, critical diligence gaps obscure underlying cohort durability. Qonto does not publicly disclose net revenue retention (NRR), gross revenue retention (GRR), or annualized cohort-level churn metrics. External competitor assessments highlight structural platform limitations: Qonto operates primarily as a financial settlement, payment, and expense logging platform, but lacks native CRM capabilities, project pipeline tracking, time and profitability tracking, contract management, electronic document signature workflows, and dedicated customer ticketing systems. Consequently, growing SMEs frequently face operational fragmentation and software sprawl, requiring secondary platforms to manage operational customer touchpoints before invoice settlement.
    claimRefs:
      - "CU002"
      - "CU010"
      - "CU014"
      - "CU015"
      - "CU016"
    figureRefs:
      - "FU001"
