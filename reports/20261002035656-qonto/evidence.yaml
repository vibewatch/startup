evidenceGaps:
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      A current independent count of eligible firms, addressable spend per firm, and country-level penetration for
      Qonto's target category.
    whyItMatters: >-
      Without a denominator, the disclosed customer footprint cannot be converted into defensible TAM, SAM, SOM, or
      market share.
    diligencePath: >-
      Obtain country-level business-demography data, third-party category-spend research, and Qonto eligibility and
      customer counts by country, then build top-down and bottoms-up cases.
    relatedQuestionRefs:
      - QM002
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: adoption-economics
    missingEvidence: >-
      Customer retention, multi-product attach rates, revenue by segment and country, and cohort-level acquisition
      economics.
    whyItMatters: >-
      Customer count and public pricing do not reveal durable paid adoption, expansion, or the revenue quality implied
      by valuation.
    diligencePath: >-
      Request cohort retention, product attach, ARPA, CAC payback, and contribution-margin schedules split by segment
      and country.
    relatedQuestionRefs:
      - QM006
      - QM008
  - type: conflicting-data
    severity: minor
    topic: historical-footprint
    missingEvidence: A consistently defined and independently verified customer series covering 2022 through the run date.
    whyItMatters: >-
      The 220,000, 450,000, and over-600,000 disclosures use different dates and issuers, preventing a clean growth
      calculation.
    diligencePath: >-
      Reconcile year-end active paying entities, acquired accounts, closed accounts, and country scope against
      management reporting.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: lending-architecture
    missingEvidence: >-
      Architectural specifications for API integration and risk data sharing between Qonto's core ledger and external
      lending partners (October, Cashbee).
    whyItMatters: >-
      Reveals whether credit underwriting relies on raw transactional API webhooks or batch exports, affecting credit
      disbursement speed and partner dependency risks.
    diligencePath: >-
      Request technical partner integration architecture documents and data privacy compliance agreements during
      management technical diligence.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: >-
      Cohort-level net revenue retention (NRR), gross revenue retention (GRR), and monthly logo churn rates across
      freelancer versus corporate SME tiers.
    whyItMatters: >-
      Without cohort retention disclosures, investors cannot assess whether Qonto's rapid headline customer expansion
      reflects durable enterprise expansion or high-churn solo freelancer turnover masked by legal entity creation
      volume.
    diligencePath: >-
      Request audited management cohort retention tables and revenue expansion waterfall schedules during formal private
      diligence.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU002
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof-table-coverage
    missingEvidence: >-
      Comprehensive directory of named production SME customer case studies across all eight European operating
      countries.
    whyItMatters: >-
      Public customer disclosures heavily feature infrastructure and ecosystem partners (Powens, Gigs, ClickHouse)
      rather than granular commercial case studies of mid-sized enterprise clients.
    diligencePath: >-
      Request customer reference call permissions and representative customer case studies across manufacturing,
      professional services, and retail verticals.
    relatedTableRefs:
      - TU003
  - type: enumeration-incomplete
    severity: material
    topic: TR001 regulatory legal risk register
    missingEvidence: Exhaustive supervisory disclosure of all historical ACPR inquiry notices and compliance warning letters.
    whyItMatters: >-
      Full regulatory enforcement records determine whether compliance penalties represent isolated legacy incidents or
      systemic supervisory oversight patterns.
    diligencePath: >-
      Request regulatory compliance audit trail and formal correspondence history between Olinda and ACPR supervisory
      controllers.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: current-valuation
    missingEvidence: >-
      Current fully diluted cap table, debt schedule, cash balance, liquidation preferences, and any arm's-length
      primary or secondary transaction terms.
    whyItMatters: >-
      Entry ownership, dilution, preference overhang, and downside proceeds cannot be calculated from funding totals or
      a 2022 post-money mark.
    diligencePath: >-
      Obtain the board-approved cap table, financing documents, debt agreements, cash statement, and recent secondary
      indications; model proceeds through the preference waterfall.
    relatedQuestionRefs:
      - QV002
      - QV005
      - QV007
  - type: private-evidence-only
    severity: material
    topic: profitability
    missingEvidence: >-
      Audited 2025-2026 revenue, ARR definition, gross margin, operating profit, cash flow, retention, churn, and cohort
      contribution economics.
    whyItMatters: >-
      The operating denominator and profit conversion needed for valuation and return analysis are not verified by the
      assigned public sources.
    diligencePath: >-
      Review audited financial statements, monthly management accounts, revenue-recognition policy, bank statements, and
      customer cohorts reconciled to the general ledger.
    relatedQuestionRefs:
      - QV004
      - QV005
  - type: missing-source
    severity: material
    topic: comparable-set
    missingEvidence: >-
      A comparable set with aligned business model, geography, revenue definition, growth, margin, retention, and
      transaction date.
    whyItMatters: Using unmatched fintech or SaaS multiples would create a precise-looking but unsupported valuation range.
    diligencePath: >-
      Build public-company, private-round, M&A, and secondary benchmarks after current Qonto operating metrics are
      verified on matching definitions.
    relatedQuestionRefs:
      - QV008
  - type: conflicting-data
    severity: minor
    topic: customer-scale
    missingEvidence: >-
      A dated reconciliation of active, paying, SME, freelancer, and acquired customer counts across the 600,000 and
      750,000-plus public figures.
    whyItMatters: Unreconciled population definitions weaken growth and monetization comparisons.
    diligencePath: >-
      Request monthly customer bridges by country, plan, active status, paying status, acquisition source, and the exact
      reporting cut-off.
    relatedQuestionRefs:
      - QV003
