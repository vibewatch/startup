      - number: '1.3'
        title: 融资历程、估值与股东结构
        blocks:
          - type: paragraph
            body: >-
              Qonto 是欧洲资金储备最雄厚的私营金融科技企业之一，历经多轮机构股权融资累计筹集 $717 million（€622 million）。公司的资本化进程在 2021 年初的 Series B（$8.27
              million）后显著提速，随后在 2022 年 1 月完成了标志性的 $552 million（€486 million）Series D 融资，由 Tiger Global Management 和 TCV
              领投，现有股东 Valar Ventures、Alven、DST Global 和 Tencent 跟投，并引入 KKR、Insight Partners、Eurazeo、Alkeon 与 Exor Seeds
              等新投资方。2022 年 4 月，公司又追加了一笔 $5.42 million 的小额 Series D 追加轮。Series D 估值达 $5.0 billion（€4.4
              billion），对应当时历史年收入的企业估值倍数约为 54.5x。尽管存在老股转让和私募股权参与，公司自 2022 年以来未再进行一级市场股权融资，主要依靠资产负债表储备及软件收入扩张维持运营。截至 2026
              年，年经常性收入（ARR）运行率估计达到 $149 million 至 $220 million，但经审计净利润率和客群层面的流失率指标仍属高度保密的非公开数据。
            claimRefs:
              - CO012
              - CO013
              - CO014
              - CO015
          - type: table
            tableRef: TO003
            claimRefs:
