  - id: FE001
    title: Qonto 平台运营与软件技术栈
    type: stack
    summary: 分层展示 Qonto 的技术架构，涵盖用户界面、基础服务、核心账本系统及外部金融网络。
    data:
      items:
        - label: Web 门户与桌面端会计
          detail: 用于桌面端财务对账、批量转账与支出管控的前端门户
        - label: 原生移动端应用
          detail: 用于即时交易通知、银行卡开关控制及 eSIM 激活的智能手机客户端
        - label: 外部合作伙伴与 ERP API
          detail: 面向第三方财务会计与金融科技工具的程序化接口
        - label: 交易与结算引擎
          detail: 日均处理约 600k 笔交易，累计历史交易总量接近 1B 笔
        - label: 角色与权限管理
          detail: 针对中小企业团队支出管控的精细化多用户授权矩阵
        - label: 海量数据检索索引
          detail: 覆盖全量历史交易记录的检索索引能力
        - label: 自研复式记账账本
          detail: 2020 年从 Treezor 迁移完成的全套内部余额跟踪系统
        - label: 直连 SEPA 支付中心
          detail: 直连 SEPA 贷记转账、即时支付及直接借记清算
        - label: Mastercard 银行卡处理
          detail: 实体与虚拟企业支付卡的发卡与交易处理
        - label: Gigs 嵌入式网络连接 API
          detail: 支持全球 180+ 国家的移动漫游上网 eSIM 电信基础设施
    approximationNotes: 架构分层与模块细分源自工程招聘说明、技术工程公开文章及合作伙伴集成文件。
