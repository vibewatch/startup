  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 欧洲中小企业银行与财务服务格局
        blocks:
          - type: paragraph
            body: >-
              欧洲中小企业（SME）商业金融格局呈现多层竞争态势，涵盖通用型跨国数字银行、法国本土金融科技公司以及专属软件方案。Qonto 将自身定位为一体化企业财务管理平台而非纯资产负债表银行，在法国、德国、意大利、西班牙等
              8 个欧洲市场服务逾 600,000 家企业。与依托多币种账户和外汇批发价优势的跨国交易专家 Revolut Business 相比，Qonto 重点聚焦于法国本土公司注册工作流、本地 IBAN
              签发以及多用户团队支出管理。同时，Shine 等法国本土竞品以极简统一定价模式瞄准注重成本的微型企业与自由职业者；Spendesk 等垂直平台则提供企业级支出管控，与 Qonto
              的高阶订阅方案形成重合。在直营数字银行之外，传统在位银行依然掌控着绝大部分商业存款与信贷额度，迫使 Qonto 等金融科技企业必须携手 October、Cashbee 和 Banxware
              等外部放贷机构，而无法直接在表内放贷。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
