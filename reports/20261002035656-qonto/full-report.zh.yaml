      - number: '1.4'
        title: 运营规模、地域扩张与平台演进
        blocks:
          - type: paragraph
            body: >-
              Qonto 的运营规模从 2022 年宣布 Series D 时的 220,000 客户，增长至 2026 年 9 月遍及欧洲 8 个国家的逾 750,000
              家日常企业客户，覆盖法国、德国、意大利、西班牙、奥地利、比利时、荷兰与葡萄牙。常规并购强化了这一扩张进程，最具代表性的是 2022 年战略收购德国竞争对手 Penta，由此并入 50,000
              个德国中小企业账户并夯实了在 DACH（德语区）市场的布局。员工人数从 2022 年初的约 500 人壮大至 2026 年的 1,700 多名全职员工，仅 2026 年一年就新增招聘 450
              人。与此同时，Qonto 的产品架构也从基础的企业银行账户与借记卡，扩展为涵盖发票、自动化记账、费用审批、多币种交易、公司注册服务，以及用于发票解析和工作流管理的嵌入式 AI
              智能体的完整财务操作系统。历史财务披露显示其 2020 财年亏损 27 million euro；尽管管理层定下了 2025–2026
              年实现营业利润的目标，但未经审计的管理层主张尚未通过法定财务公告获得独立证实。
            claimRefs:
