      - number: '6.3'
        title: 业务存续能力、自然获客飞轮与留存瓶颈
        blocks:
          - type: paragraph
            body: >
              Qonto 获客模式的基石依托专有的验资存款自然获客漏斗。入驻平台的客户中，约有三分之一直接借助 Qonto
              的法定企业登记服务设立法人实体，并使用该平台完成商事法院注册所需的法定股本验资。面向这些企业，Qonto
              成为其首个且排他的日常经营银行账户，构筑起极低的获客成本以及业务初期极高的账户黏性。而在入驻前已拥有经营银行账户的其余三分之二客户中，约有一半停用了传统账户，另一半则将 Qonto 与传统金融机构并行保留。


              尽管前端获客优势显著且平台公布的净推荐值（NPS）超过 75，关键尽调缺口依然掩盖了深层客群的存续韧性。Qonto
              并未公开披露净留存率（NRR）、毛收入留存率（GRR）或年化客群流失率指标。外部竞品调研凸显了结构性平台局限：Qonto 主要作为财务结算、支付与费用记账平台运行，缺乏原生 CRM
              功能、项目商机跟进、工时与盈利追踪、合同管理、电子文档签署工作流以及专属客户工单系统。因此，处于成长期的中小企业常常面临运营割裂与软件泛滥，在发票结算前必须依赖辅助平台管理各项业务触点。
            claimRefs:
              - CU002
              - CU010
              - CU014
              - CU015
              - CU016
