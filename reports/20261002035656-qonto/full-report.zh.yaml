  - id: FI001
    title: Qonto 客户交易与订阅价值流
    type: flow
    summary: 详述客户入驻如何通过软件订阅和刷卡消费转化为净收入的直观链路图。
    data:
      nodes:
        - id: onboarding
          label: 客户设立与自然注册
          description: 中小企业存入资本金并开设 IBAN 账户
        - id: subscription
          label: 分级 SaaS 订阅
          description: EUR 9 至 EUR 299 每月经常性软件费用
        - id: transact
          label: 支付与刷卡交易量
          description: 每月高达 EUR 200k 的企业卡消费
        - id: gross-revenue
          label: 平台总收入
          description: SaaS 软件费、刷卡手续费分成（interchange）与外汇点差收益的汇总
        - id: cogs
          label: 支付与核心银行业务交付
          description: 内部核心银行系统、清算及合作伙伴成本
        - id: gross-profit
          label: 平台净利润空间
          description: 用于支持研发、合规及业务增长的利润资金池
      edges:
        - from: onboarding
          to: subscription
        - from: onboarding
          to: transact
        - from: subscription
          to: gross-revenue
        - from: transact
          to: gross-revenue
        - from: gross-revenue
          to: cogs
        - from: cogs
          to: gross-profit
    approximationNotes: 平台收入机制的概念性展示；具体单位利润率因账户套餐层级而异。
