      - number: '4.2'
        title: 成本结构、单客经济模型与经营杠杆
        blocks:
          - type: paragraph
            body: >-
              Qonto 的成本结构主要由支付网络清算费、合规风控基础设施、核心银行运维以及专业人员开支构成。2020 年，Qonto 从完全依赖 BaaS 服务商 Treezor
              转向作为持牌支付机构自营专有核心银行系统，从而获得了更高的交易毛利率，并消除了按账户计费的中间件成本。然而，在 6 个欧洲主要市场获客以及产品迭代拓展，需要大额市场营销支出，且研发工程人员规模已扩充至 1,600
              人以上。尽管这家数字银行在 2020 年曾录得 27 million euro 的亏损，但管理层称随后数年利润率显著改善，并计划于 2026 年实现营业利润。
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
