chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业法人架构、创立历程与牌照演进
        blocks:
          - type: paragraph
            body: >-
              Qonto 由法国创业者 Alexandre Prot 与 Steve Anavi 于 2016
              年创立，旨在化解欧洲中小企业在开设和使用传统商业银行账户时面临的繁琐流程、行政负担与欠佳用户体验。公司在法国注册的法人实体名称为 Olinda SAS（企业登记号 CIN 819489626），总部位于法国巴黎
              18 Rue de Navarin, 75009。Qonto 于 2017 年 7 月正式上线商业数字金融服务，起初通过 Treezor
              依托第三方银行即服务（BaaS）基础设施，随后取得受监管的自持支付机构牌照，并将客户群迁移至自研核心银行引擎。2025 年，Qonto
              正式递交欧洲信贷机构（全牌照银行）申请，标志着其在欧洲市场从数字支付机构向直接受监管银行机构的战略转型。2026 年 9 月，Qonto 启用了面积达 11,000 平方米的新巴黎总部 Bonne
              Nouvelle，分布于 9 个楼层、拥有 900 个工位，以集中运营并支撑在欧洲大陆的持续扩张。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
