      - number: '2.2'
        title: 基于有限证据的市场规模测算
        blocks:
          - type: paragraph
            body: >-
              衡量市场规模最坚实的依据是 Qonto 披露的实际业务覆盖面，而非第三方市场支出预测。TechCrunch 报道称其在 2022 年 1 月于 4 个国家拥有 220,000
              家付费企业；International Finance 报道其在 2024 年 9 月拥有 450,000 家客户企业；2026 年 7 月的一份合作伙伴新闻稿则称其在 8 个国家拥有超过 600,000
              家中小企业与自由职业者。这些历史时点数据印证了扩张态势，但彼此并非直接可比的经审计客群，无法据此确立品类增长率、留存率或市场份额。所给来源均未提供符合条件的欧洲企业总数、可触达订阅支出、国别渗透率或自下而上的转化推导路径。因此，当前的投资逻辑需要立足于现有业务足迹视角，并在将估值与市场份额挂钩前，独立完成对
              TAM/SAM/SOM 的尽调。
            claimRefs:
              - CM002
