  - number: 8
    title: 估值考量
    sections:
      - number: '8.1'
        title: 历史价格锚点而非现时估值
        blocks:
          - type: paragraph
            body: >-
              2022 年 1 月的 Series D 融资是本次指定证据中唯一确定的价格锚点：据 TechCrunch 和 FinTech Futures 报道，公司以 €4.4 billion（$5
              billion）的估值募集了 €486 million（$552 million）。Tracxn 单独记录该轮融资对应 54.5x revenue
              multiple，但该数据库记录并非当前市场报价，且抓取的文本中未披露其收入分母。不同来源与计价货币下的融资总额也存在差异，Clay
              甚至在同一页面上标出了两个互不一致的美元总额。这些出入使历史融资记录可作为有价值的背景参考，但无法替代当前企业价值、完全稀释后持股比例或当下可用现金。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
