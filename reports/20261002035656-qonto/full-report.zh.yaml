            title: 业务足迹不等于 TAM
            body: 服务逾 600,000 家企业证明了其运营规模，但所给证据缺乏计算渗透率或市场份额所需的独立企业总数和支出分母。
            calloutType: insight
            claimRefs:
              - CM002
              - CM003
          - type: callout
            title: 业务复杂性或将收窄可服务市场
            body: 客户评价与竞品对比证据表明，专用支付工具、信贷、高阶银行业务功能及第三方集成的短板，可能会限制业务复杂的中小企业的采纳率。
            calloutType: risk
            claimRefs:
