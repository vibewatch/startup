    title: 客户全生命周期旅程与运营触点图
    type: journey-map
    summary: 直观展现中小企业客户从法定公司设立、日常银行业务、费用审批授权，直至结构性 CRM 功能边界的递进旅程。
    approximationNotes: 各发展阶段与触点反映了公司公开文档中记录的入驻流程、定价层级及合作伙伴软件功能边界。
    data:
      items:
        - label: 公司设立与资本金存入
          stage: 获客
          touchpoints:
            - 法定企业组织形式选择
            - 初始股本资本金存入
            - 商业法院登记注册
            - 瞬时签发法国 / 欧盟 IBAN 账户
          sentiment: positive
        - label: 核心日常银行业务
          stage: 采纳使用
          touchpoints:
            - SEPA 即时贷记转账
            - 实体与虚拟 Mastercard 激活
            - 实时支付通知
            - 移动端 App Store 银行操作流程
          sentiment: positive
        - label: 财务团队分权授权
          stage: 业务拓展
          touchpoints:
