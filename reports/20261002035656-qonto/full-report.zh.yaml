      - number: '5.2'
        title: 核心银行架构、工程组织与运营模式
        blocks:
          - type: paragraph
            body: >-
              Qonto 软件栈的核心技术差异化优势在于其自研的核心银行系统（CBS）；在创立初期依托第三方银行即服务（BaaS）提供商 Treezor 启动业务后，公司于 2020 年完成了向自研系统的迁移
              [CE001]。凭借自有的支付机构牌照，Qonto 在内部自主管理总账状态、账户余额以及直接支付清算网络直连，而无需将资金托管和记账执行委托给外部 BaaS 平台 [CE001, CE006]。工程团队依托专门的
              Foundations（基础设施）领域扩展后端服务，该领域拥有约 110 名后端工程师，负责交易处理、搜索索引、计费、多租户权限、内部工具以及外部合作伙伴集成等关键平台服务 [CE003]。随着日交易吞吐量达到约
              600,000 笔事件、历史累计处理记录逼近 10 亿条（one billion），为了保持系统韧性，工程组织在 50 多个职能范围内推行了标准化的动态技术文档机制 [CE003,
              CE009]。跨职能的工程、产品与运营团队利用集中化数据库与动态演进规范来协调路线图、服务依赖关系及精益（Lean）问题解决流程，取代了静态的任务交接模式 [CE009, CE010, CE011]。
