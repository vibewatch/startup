      - number: '7.4'
        title: 展品
        blocks:
          - type: callout
            title: 辅助支持核验产生严重的账户劫持风险
            body: Qonto 采用手持纸条的静态自拍人工审核来应对生物识别入驻失败，构成了不对称的运营脆弱点。攻击者可蓄意触发系统报错，并利用客服团队考核处理时效的压力劫持管理邮箱，从而夺取对企业资金门户的完全控制权。
            calloutType: risk
            claimRefs:
