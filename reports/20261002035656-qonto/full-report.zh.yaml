  - id: FV001
    title: 投资建议决策逻辑
    type: flow
    summary: 历史定价与当前业务规模信号穿透未决的财务、股权及流动性缺口，最终导向进一步研究的决策结论。
    data:
      nodes:
        - id: priced-round
          label: 2022 年 1 月定价轮融资
          detail: 融资 €486m，估值 €4.4bn；融资 $552m，估值 $5bn。
        - id: scale-signal
          label: 当前业务规模信号
          detail: 据 2026 年公开报道称，其在 8 个国家的客户规模达 600k 至 750k+。
        - id: economics-gap
          label: 经济模型缺口
          detail: 最新收入、利润率、留存率、现金流及经核实的盈利情况均不可得。
        - id: ownership-gap
          label: 股权结构缺口
          detail: 完全稀释的股权结构表、负债、稀释比例及优先清偿顺序均不可得。
        - id: liquidity-gap
          label: 流动性缺口
          detail: 所获证据中未见确定的 IPO 战略或有数据支撑的退出时间表。
        - id: recommendation
          label: 继续研究
          detail: 切勿将 2022 年估值视作当前底部支撑，亦不宜给出具体的数字区间。
      edges:
        - from: priced-round
          to: scale-signal
        - from: scale-signal
          to: economics-gap
        - from: economics-gap
          to: ownership-gap
        - from: ownership-gap
          to: liquidity-gap
        - from: liquidity-gap
          to: recommendation
    approximationNotes: 金额保留报告期币种与报告周期；本流程图不对当前估值作出推算。
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV009
      - CV011
      - CV012
      - CV016
