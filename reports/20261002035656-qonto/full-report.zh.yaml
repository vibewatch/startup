      - number: '6.4'
        title: 展品
        blocks:
          - type: callout
            title: 验资存款整合作为获客引擎
            body: Qonto 与企业登记框架的整合形成了高能效的自然获客渠道。通过在缴纳股本验资的关键节点捕获约三分之一的客户群，Qonto 在传统商业银行开展触达前抢先锁定了主账户地位，建立了极高的转换壁垒。
            calloutType: insight
            claimRefs:
              - CU002
              - CU014
          - type: callout
            title: 客群留存未予披露与软件边界摩擦
            body: >-
              尽管 Qonto 成功将其公布的客户规模扩大至 600,000 家企业以上，但公司对净留存率与客群流失率保持严格保密。随着客户企业日益成熟，Qonto 缺乏 CRM
              和项目追踪等原生运营工具的短板造成了软件体系割裂，可能削弱中型企业的长期留存率。
            calloutType: risk
            claimRefs:
              - CU015
              - CU016
  - number: 7
    title: 风险分析
    sections:
      - number: '7.1'
        title: 监管与合规漏洞
        blocks:
          - type: paragraph
            body: >-
              Qonto 通过其法人实体 Olinda 作为 ACPR 持牌支付机构，在法国、德国、意大利、西班牙及其他欧洲市场开展业务 CR001。作为受监管的支付机构，必须严格遵守包含 PSD2、PCI DSS 和
              GDPR 在内的欧洲监管框架 CR002。然而，监管部门的处罚举措表明其存在显著合规阻力：Olinda 曾因反洗钱（AML）合规缺陷被处以 €390,000 的监管罚款 CR003。此外，Qonto
              的业务流程带来了次生合规隐患；当自动化入驻系统遇到报错时，支持流程允许客户通过手持身份证件与手写便签的静态照片进行身份核验
              CR004。监管机构会严厉处罚未能保护客户凭证或将身份证明文档存放在未加密客户支持知识库中的机构 CR005。持续采用人工备用核验使 Qonto
              面临针对性的合成身份欺诈风险，并承受欧洲数字身份准则下的严苛监管审查 CR006。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
