      - number: '3.2'
        title: 功能矩阵与分层定价动态
        blocks:
          - type: paragraph
            body: >-
              Qonto 与其主要竞品之间的差异化，反映出根本不同的产品打包与收入架构。Qonto 采取非捆绑式订阅模式，价格从面向独立自由职业者的每月 €9 到面向企业组织的每月 €249
              及以上不等，并通过增加入职席位、企业卡以及超出套餐配额的交易量获取增量收益。与 Revolut Business 等免费增值模式竞品或入门级自由职业者工具不同，Qonto
              不设永久免费版本，要求客户自注册起便承担周期性订阅费用。不过，Qonto 能够以约 €100 的费用在 72 小时内出具用于企业注册的验资存款证明，以此建立早期的业务锁定，而 Revolut Business
              并不具备该项行政工作流。针对成长型团队，Qonto 将附带支出限额的智能企业卡、自动化收据抓取、实时增值税（VAT）识别以及支持 29 种货币的原生电子发票功能打包提供。相反，有大量跨境支付需求的客户在
              Qonto 处面临的外汇加价高于 Revolut Business 或 Wise，使得多币种商业结算成为其持续存在的竞争劣势。
