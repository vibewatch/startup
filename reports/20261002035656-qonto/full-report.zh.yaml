      - number: '6.2'
        title: 采用轨迹、规模体量与具名运营验证
        blocks:
          - type: paragraph
            body: >
              Qonto 的客户拓展轨迹展现出在法国、德国、意大利和西班牙等核心市场持续多年的规模扩张，并随后扩展至更广泛的欧洲八国。付费企业账户数从 2022 年 1 月 Series D 融资时的 220,000 家扩充至
              2024 年初的 450,000 家，随后突破 500,000 家，并在 2026 年中超过 600,000 家活跃企业。这一采用速度得益于欧洲区域的战略性并购整合，尤为典型的是 2022 年收购德国数字银行竞品
              Penta，直接将 50,000 个德国企业账户整合进 Qonto 的区域运营版图。


              实际生产部署印证了其与客户会计及数据工作流的深度嵌入融合，而非停留在边缘辅助账户。企业合作伙伴案例研究证实，Qonto 通过 Powens 的银行 API 编排了广泛的跨国开放银行（Open
              Banking）连接，使法国、德国、意大利和西班牙的企业客户能够将第三方银行记录汇总至统一的财务驾驶舱，据报道其账户连接接受率高达 75%。同样，商业电信基础设施提供商 Gigs 与 Qonto
              合作，直接在移动端 App 中嵌入全球商旅 eSIM 调配功能，使全部 600,000 个企业账户能够在 180 多个国家使用蜂窝数据配置。活跃用户在移动分发渠道上的运营满意度保持稳健，在 App Store 的
              1,300 条用户评价中获得 4.7 分（满分 5 分）。
