      - number: '1.2'
        title: 领导架构、公司治理与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              Qonto 采取由联合创始人统领、多位资深职能高管协同的执行架构，分管国际化扩张、技术平台与区域市场。联合创始人兼 CEO Alexandre Prot 掌管公司战略、监管牌照事务与商业增长；联合创始人兼总裁
              Steve Anavi 则统筹平台设计、运营执行及长期定位。创立 Qonto 之前，两位创始人曾共同创办并壮大早期智能互联硬件企业 Smokio（于 2016 年被收购）。CTO Aymeric Augustin
              主管核心工程与人工智能基础设施，统领平台自动化与 AI 智能体部署。公司治理以由 5 位现任成员组成的正式董事会为核心：包括联合创始人 Alexandre Prot 与 Steve Anavi，以及 James
              Fitzgerald、Philippe Teixeira Da Mota 与 Guillaume Aubin
              等独立董事和领投方董事。战略愿景与组织知识高度集中于两位创始人，构成了明确的关键人物依赖；外部资深董事代表以及人力、运营、风控和各区域总经理等管理层引入，在一定程度上平衡了该项风险。
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
