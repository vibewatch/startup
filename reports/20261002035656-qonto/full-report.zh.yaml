      - - 反向逻辑
        - 唯一得到印证的定价估值来自 2022 年 1 月。
        - 若发生条款公开披露的当下公平一手或二手交易，将更新这一参考估值锚点。
      - - 反向逻辑
        - 现有证据仅提供了 2020 年的亏损及随后的盈利目标，并未提供经核实的当前利润。
        - 经审计的 2025–2026 年损益表、现金流及单位经济模型将弥合这一缺口。
    notes: 客户统计数量来自不同的发布主体，且可能采用不同定义；该评分仅为 App Store 的某一时刻快照，并非衡量留存率的指标。
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV007
      - CV009
      - CV010
  - id: TV003
    title: 乐观、基准与悲观情景假设条件
    columns:
      - 情景
      - 假设前提
      - 估值 / 回报逻辑
      - 核心风险
      - 概率信号
    rows:
      - - 乐观
        - 盈利增长已获核实、留存持久、客户规模已完成对账，且优先股条款清晰。
        - 仅在对经审计的当前财务指标应用有证据支持的可比公司倍数后，方可设定具体数值区间。
        - 估值倍数压缩、监管政策、安全漏洞及执行风险。
        - 虚拟数据室核实了上述假设，且当下的公平交易价格能提供可靠的目标回报率。
      - - 基准
        - 业务规模得以维系，但盈利能力、留存率和股权归属证据仍不完整。
        - 等待观望或协商挂钩证据的定价与保护性条款；公开数据无法支撑得出任何估值区间。
        - 付费客户质量与利润率转化情况依然未知。
        - 财务证据有所改善，但未完全消除优先股与退出机制方面的信息缺口。
      - - 悲观
        - 2022 年的估值标记锚定了市场预期，而增长质量或盈利能力却不及预期。
        - 假定历史估值并非底线，并要求穿透优先股清算瀑布进行下行情景分析。
        - 估值下调（down-round）、股权稀释、优先股积压（preference overhang）、行业竞争以及流动性退出推迟。
        - 当下交易定价低于历史标记，或经核实的运营指标未达到管理层目标。
    notes: 各类情景属于附带条件的尽调推演案例，而非前瞻预测；因无法获取当前的财务、可比公司及资本结构输入数据，故有意未提供具体数值及概率。
    claimRefs:
      - CV001
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV015
      - CV016
figures:
  - id: FO001
    title: 公司重大里程碑时间线
    type: timeline
    summary: 展示 Qonto 自 2016 年在巴黎创立，历经欧洲大陆扩张、独角兽融资，直至 2026 年申请银行牌照的关键发展里程碑。
    data:
      items:
        - label: 2016 - 公司成立
          date: 2016-04
          detail: Alexandre Prot 与 Steve Anavi 在巴黎注册成立 Olinda SAS，旨在打造现代化的中小企业银行服务。
          claimRefs:
            - CO002
        - label: 2017 - 商业化上线
          date: 2017-07
          detail: Qonto 在法国正式上线，依托 Treezor 基础设施提供数字商业账户与银行卡。
          claimRefs:
            - CO001
            - CO003
        - label: 2019 - 核心银行系统迁移
          date: 2019-06
          detail: 获得法国审慎监管局（ACPR）颁发的支付机构牌照，并构建自研核心银行系统以摆脱对第三方的依赖。
          claimRefs:
            - CO003
        - label: 2020 - 欧洲市场扩张
          date: 2020-01
          detail: 在德国、意大利和西班牙启动本地化业务，尽管录得 €27M 净亏损，仍将客户群扩展至 100,000 家企业。
          claimRefs:
            - CO004
            - CO016
        - label: 2022 - D 轮融资
          date: 2022-01
          detail: 由 Tiger Global 和 TCV 领投融资 $552M（€486M），估值达 $5.0B（€4.4B），服务客户达 220,000 家。
          claimRefs:
            - CO012
            - CO013
        - label: 2022 - 收购 Penta
          date: 2022-07
          detail: 收购德国数字银行竞争对手 Penta，吸收 50,000 家企业客户，巩固了其在欧洲的领先地位。
          claimRefs:
            - CO004
        - label: 2024 - 比荷卢与葡萄牙市场扩张
          date: 2024-03
          detail: 将业务拓展至奥地利、比利时、葡萄牙及荷兰等 8 个欧洲市场，客户总数达到 600,000 家。
          claimRefs:
            - CO004
            - CO010
        - label: 2025 - 申请银行牌照
          date: 2025-06
          detail: 正式递交欧洲信贷机构牌照申请，以支持开展直接借贷业务并提供存款保障。
          claimRefs:
            - CO006
        - label: 2026 - Bonne Nouvelle 总部
          date: 2026-09
          detail: 启用位于巴黎的 11,000 sqm 总部，设 900 个工位，支持 1,700 名员工并服务欧洲超过 750,000 家活跃企业。
          claimRefs:
            - CO005
            - CO007
    approximationNotes: 各日期代表公开公告或公司注册成立月份。客户数量里程碑反映特定日期报道的活跃账户数。
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
      - CO007
      - CO010
      - CO012
      - CO013
      - CO016
