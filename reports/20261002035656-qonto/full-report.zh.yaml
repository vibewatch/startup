      - number: '4.3'
        title: 资本充足性、融资依赖度与投资研判结论
        blocks:
          - type: paragraph
            body: >-
              Qonto 通过多轮融资积累了雄厚的资本储备，最高峰为 2022 年 1 月由 TCV 和 Tiger Global 领投、投后估值达 5 billion dollar 的 552 million dollar
              Series D 融资，并在 2022 年 4 月通过 Crowdcube 完成了一笔 5 million euro 的客户众筹。累计融资额已超过 600 million
              euros，提供了充裕的现金跑道，使公司免受近期股权稀释或风险债依赖的困扰。即便如此，投资研判仍面临重大信息不对称：Qonto 并未披露经审计的毛利率、客群层面的净留存率（NRR）、国别流失率，亦未披露收购竞品
              Penta 后德国业务的独立业绩表现。其财务特征展现出强劲的欧洲中小企业商业体量，但若要通过公开发行上市退出，仍须正式披露客群存续能力与单客经济模型。
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: 展品
        blocks:
          - type: callout
            title: 验资存款作为低 CAC 的自然获客渠道
            body: 约三分之一的 Qonto 客户源于直接通过该平台注册公司并缴纳股本验资。相较于传统金融科技营销手段，该机制构建了极具成本效益的获客飞轮。
            calloutType: insight
            claimRefs:
              - CI005
          - type: callout
            title: 未公开单客经济模型阻碍公开市场投资评估
            body: 尽管 Qonto 坚称其正向 2026 年实现盈利迈进，但由于缺乏公开的净留存率（NRR）、毛利率以及 FY2020 以来的法定财报，潜在投资人必须独立核验客群留存情况及真实的刷卡手续费单客经济模型。
            calloutType: risk
            claimRefs:
