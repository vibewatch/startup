              - CV010
      - number: '8.3'
        title: 财务与资本结构证据缺失主导下行风险
        blocks:
          - type: paragraph
            body: >-
              指定资料中援引的最新会计数据是 2020 年的 €27 million 亏损；该会计亏损并不等同于现金消耗。2024 年的一篇报道转述了管理层预计在 2025
              年实现盈利的预期，但没有任何指定信息源证实该目标已经达成。Clay 还将市场竞争、众筹合规、系统安全与稳定性列为核心挑战。鉴于当前收入或
              ARR、毛利率、留存率、现金储备、负债、清算优先权以及完全稀释股权结构均未披露，测算牛市、基准和熊市的具体估值区间将属于伪精确。因此，各类情景分析仅界定了证据与定价前提，而非提供未经证实的点估计。
            claimRefs:
              - CV009
              - CV010
              - CV012
