      - number: '1.5'
        title: 展品
        blocks:
          - type: callout
            title: 从数字银行向受监管信贷机构转型
            body: >-
              Qonto 于 2025 年正式申请欧洲全牌照信贷机构，代表着一次根本性的战略转型。以往作为获批支付机构运营虽能实现敏捷的软件部署与敏捷产品开发，却使 Qonto
              仅能开展支付中介业务，并只能通过通道合作提供信贷与存款利息。获得银行牌照后，Qonto 将能够把客户存款直接留存在资产负债表上，向欧洲中小企业拓展高毛利直接放贷，并在结构上削减资金成本。
            calloutType: insight
            claimRefs:
              - CO006
              - CO007
          - type: callout
            title: 估值基准停滞与非公开财务透明度缺失
            body: >-
              Qonto 的 $5.0 billion 估值基准确立于 2022 年 1 月全球金融科技市场估值高位期间，对应超过 50x 的企业收入倍数。尽管客户账户数已从 220,000 增至 750,000 以上，但自
              2020 年录得 €27 million 亏损以来，Qonto 对完整的法定财务报表始终严格保密。缺乏经审计的 EBITDA、净留存率（NRR）以及单客经济模型数据，给未来任何潜在的欧洲 IPO
              带来了估值不确定性。
            calloutType: risk
            claimRefs:
              - CO012
              - CO015
              - CO016
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              Qonto
              的目标市场是欧洲自由职业者及中小企业用于管理和调度企业资金、发卡、开具发票、收取并核对收据、管理团队支出以及协调记账的付费运营层。该边界宽于企业活期账户，因为产品打包了支付与财务运营功能；但窄于完整的企业资源规划（ERP）、复杂的多实体会计或专业信贷。主要替代方案包括传统银行加独立会计及报销工具、云会计产品，以及同时使用多个银行账户。此项区分对市场规模测算至关重要：存款、贷款本金以及整个会计软件市场，不能仅仅因为触达同一类买家就被计入
              Qonto 的可触达支出。
            claimRefs:
              - CM001
              - CM008
              - CM009
              - CM014
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM010
