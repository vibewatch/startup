  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范畴与客户工作流模块
        blocks:
          - type: paragraph
            body: >-
              Qonto 将其产品打造为面向欧洲中小企业（SME）与自由职业者的一体化财务操作系统，将日常财务运营划分为三大互补支柱：日常商业银行服务、记账自动化以及企业支出管理 [CE001,
              CE006]。新设立企业的主要切入点是数字化公司注册与实缴资本验资存款，该功能将本地欧洲 IBAN 签发与法国、德国、意大利和西班牙的企业登记无缝结合 [CE001, CE007]。面向持续日常运营，Qonto
              整合了 SEPA 实时转账、支持自定义支出规则的实体与虚拟 Mastercard 支付卡、自动化增值税（VAT）与收据核对以及电子发票生成，取代了彼此割裂的各类财务软件 [CE001, CE002, CE006,
              CE008]。为了消除欧洲流动商务团队的跨境网络连接阻碍，Qonto 还在移动端 App 内原生集成了基于 Gigs 的商旅 eSIM 调配功能，无需办理外部电信漫游套餐即可在 180 多个国家获取蜂窝网络连接
              [CE005]。随着欧洲税务机构推行 B2B 电子发票改革，Qonto 正在升级其应付账款与应收账款模块，使其作为注册电子发票平台直接连通法国、西班牙及德国的政府税务门户 [CE004]。
            claimRefs:
