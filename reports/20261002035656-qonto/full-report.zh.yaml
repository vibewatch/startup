      - number: '8.2'
        title: 业务规模支持尽调推演，但无法支撑既往价格
        blocks:
          - type: paragraph
            body: >-
              Qonto 目前的新闻页面显示其在八个国家拥有超过 750,000 家中小企业和自由职业者客户，而 2026 年 7 月的一份合作伙伴新闻稿则记录为 600,000
              家。这一差异可能源于统计时间、覆盖口径或定义差异，但公开资料并未调和这一分歧。历史报道显示 2024 年客户数为 450,000 家，2022 年付费企业为 220,000 家；核实期间 App Store
              显示其基于 1.3k 条评分获得 4.7 分。这些迹象综合印证了扎实的市场采用度与产品契合度，但并不能确立留存率、收入质量、利润率或现行估值倍数。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV014
          - type: table
            tableRef: TV002
