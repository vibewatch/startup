      - number: '8.4'
        title: 结论：在商讨价格前深化调研
        blocks:
          - type: paragraph
            body: >-
              研判建议为“深化调研”，置信度评级为中，承销风险评级为高；这一判断主要源于证据缺口，而非认为公司基本面疲软。Qonto 具备显著规模、宽广的财务工作流以及雄厚的历史资本背书，但 2022
              年的估值不能作为现时底线。管理层亦在 2024 年表示 IPO
              并非既定战略，对退出时机与流动性未予承诺。具备投资决策条件的前提是获取经审计的最新财报、客群留存数据、核准一致的客户定义、现行股权结构表与优先清算瀑布流、二级市场交易凭据，以及按统一收入与利润率口径构建的可比公司组合。在此之前，任何目标回报率、持股周期或退出估值均缺乏事实支撑。
