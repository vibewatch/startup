      - number: '2.3'
        title: 买方、使用者、付款方与采纳路径
        blocks:
          - type: paragraph
            body: >-
              核心买方为小型组织的创始人、企业主或财务负责人，员工与会计师是高频使用者，企业法人实体则是付款方。公司注册是一项关键的获客切入点：Qonto 的 CEO 在 2022 年表示，约有三分之一的客户是通过 Qonto
              设立公司的。存量企业构成另一条获客路径，又细分为完全替代既有银行账户，以及与一个或多个账户并行使用。采纳动力因而来自极速开户流程、单项订阅替代多套行政工具、会计协同机制，以及对员工支出的实时管控。针对特定国家的会计软件集成与本地银行业惯例，使得渠道分发与本地化能力的重要性丝毫不亚于通用的欧洲品牌形象。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM015
