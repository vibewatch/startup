      - number: '7.3'
        title: 合作伙伴依赖度与商业模式韧性
        blocks:
          - type: paragraph
            body: >-
              Qonto 在其国际与本土服务体系中，对专业基础设施提供商存在高度结构性依赖。覆盖 150 多个国家、30 多种货币的国际跨境支付功能完全由与 Wise 的外部合作提供支持
              CR012。企业卡发卡与支付卡基础设施则直接通过与 Mastercard 的合作实现 CR013。此外，嵌入式国际移动网络连接通过与 Gigs 的操作系统合作交付 CR014。从商业模式来看，Qonto
              持续承受利润率风险与客户自动结汇摩擦；由于 Qonto 账户严格以欧元计价，入账的外币资金在到账时会被自动转换为欧元 CR015。尽管管理层设定了在不大规模裁撤成本的前提下于 2026
              年实现持续盈利的目标，但历史财报显示其录得会计亏损，并承担了大额营销支出以支持跨八国市场的扩张 CR016。
            claimRefs:
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR007
              - CR012
