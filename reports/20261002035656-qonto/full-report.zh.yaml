      - number: '3.3'
        title: 转换成本、生态锁定与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              尽调的核心考量在于：Qonto 的企业财务管理软件究竟建立了持久的竞争壁垒，还是仍容易被替换。中小企业银行服务的客户转换成本较少来自支付卡发行，更多来自深度会计同步、供应商名录关联及自动化对账。通过与法国
              Cegid 和德国 Datev 等区域性主流会计平台建立原生集成，Qonto 将其交易总账直接嵌入外部注册会计师（CPA）工作流；例如众多法国会计师事务所已将客户运营标准化建立在 Pennylane 与
              Qonto 之上。此外，Qonto 还通过 Gigs 引入嵌入式商旅网络服务以拓展生态，使团队管理员可在银行控制面板内直接分发国际 eSIM。尽管拥有这些集成，Qonto
              目前仍作为受监管支付机构而非全牌照信贷机构运营，需依赖 Banxware 等嵌入式合作伙伴提供短期融资。由于客户无法直接从 Qonto
              获得大额商业抵押贷款或大规模循环信贷额度，多账户并用现象依然普遍，约有三分之二的客户在传统银行保留并行账户。
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.4'
        title: 展品
        blocks:
          - type: callout
            title: 行政工作流作为客户留存锚点
            body: Qonto 抵御低价或免费金融科技账户的核心壁垒，在于其深度嵌入法国企业设立与会计生态。通过在初始验资存款阶段捕获客户，并直接打通外部会计软件，Qonto 将常规银行业务升级为行政中枢，从而抬高了业务迁移壁垒。
            calloutType: insight
            claimRefs:
              - CP002
              - CP008
              - CP013
          - type: callout
            title: 跨境汇兑与多币种业务短板
            body: 面向具备跨国业务或接收非欧元币种的电商卖家，Qonto 的外汇加价与国际汇款手续费竞争力不及 Revolut Business 或 Wise 等专业平台，导致全球化扩张型中小企业选择多账户并用或彻底流失迁移。
            calloutType: risk
            claimRefs:
              - CP003
              - CP011
              - CP012
  - number: 4
    title: 财务表现
    sections:
      - number: '4.1'
        title: 收入模式与商业化架构
        blocks:
          - type: paragraph
            body: >-
              Qonto 的收入来自混合商业模式，将周期性 SaaS 订阅与基于交易的刷卡手续费分成及工作流佣金相结合。核心方案按月阶梯定价，自由职业者方案每月 9 欧元起步，大型企业方案则增至每月 249 或 299
              欧元。除固定的软件使用费外，Qonto 还从企业卡交易中抽取刷卡手续费，收取涵盖 29 种货币的跨国多币种转账费，并从嵌入式第三方服务中提取平台分成。公司保持着自然流入的获客飞轮：约三分之一的客户直接通过
              Qonto 注册企业并完成法定验资存款，构建起获客成本（CAC）极低的转化漏斗，将新设立的法人实体转化为长期订阅客户。
            claimRefs:
              - CI001
