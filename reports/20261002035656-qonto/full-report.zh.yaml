      - number: '2.4'
        title: 增长驱动因素、制约瓶颈与估值关联
        blocks:
          - type: paragraph
            body: >-
              该产品组合可通过订阅分层、交易佣金、高级财务工具与合作伙伴服务深化商业化变现，而商旅等外延工作流亦能提升用户黏性。然而公开的定价信息在截取时间与范围上存在差异：G2 的历史存档页面显示其 Basic、Smart
              与 Premium 方案分别为每月 €9、€19 与 €39，而 2024 年的一篇文章则称其方案涵盖 €9 至 €299
              不等，外加交易佣金。客户反馈整体偏正面，但暴露了开户流程、特殊支付工具、信贷可得性及系统集成带来的采纳阻力。这些瓶颈制约了向业务更复杂的中小企业渗透；因此在缺乏客群留存率、分部收入、交叉附着率以及国别单客经济模型的情况下，仅凭客户数无法支撑当前估值。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM016
