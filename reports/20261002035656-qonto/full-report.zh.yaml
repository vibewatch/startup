              - CR004
              - CR005
              - CR006
      - number: '7.2'
        title: 运营安全与技术架构
        blocks:
          - type: paragraph
            body: >-
              Qonto 的技术基石依托由 Ruby on Rails 后端、Ember.js 和 React 前端以及配备 PostgreSQL 数据库与事件流处理的 Amazon Web Services
              基础设施构成的集中式云架构 CR007。尽管主要入驻环节利用了 Fourthline 的生物活体检测引擎，但在遇到异常时，辅助账户维护流程会绕过自动化活体检测
              CR008。更改企业主邮箱地址会移交财务门户的管理控制权，使未授权第三方得以修改付款模板并添加签约人
              CR009。将护照复印件、国民身份证和个人自拍照上传至客户支持工单软件，会将敏感记录暴露于大范围内部流转与内部人威胁之中 CR010。此外，新市场的公司注册等核心运营流程依赖线下法律合作伙伴；例如设立荷兰 BV
              公司需要 5 至 15 天的人工公证协调 CR011。
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
