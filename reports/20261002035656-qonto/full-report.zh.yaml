        - label: 多市场账户归集整合
          stage: 成熟运作
          touchpoints:
            - 借助 Powens 归集跨境银行账户
            - 欧洲多国 IBAN 统一管理
            - 资金全景驾驶舱看板
            - 集中化交易报告
