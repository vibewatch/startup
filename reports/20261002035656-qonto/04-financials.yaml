callouts:
  - calloutType: "insight"
    title: "Capital Deposit as a Low-CAC Inbound Channel"
    body: "Around one-third of Qonto customers originate by registering their company and depositing share capital directly through the platform. This mechanism creates an exceptionally cost-effective customer acquisition flywheel compared to traditional fintech marketing."
    claimRefs:
      - "CI005"
  - calloutType: "risk"
    title: "Private Unit Economics Obscure Public Underwriting"
    body: "Although Qonto asserts progress toward 2026 profitability, the absence of public NRR, gross margin, and statutory financials since FY2020 means prospective investors must independently audit cohort retention and true interchange unit economics."
    claimRefs:
      - "CI007"
      - "CI008"
      - "CI014"
