  topStrengths:
    - Leading European SME finance and payments platform with broad workflow integration.
    - Strong historical capital backing and large multi-market customer footprint.
    - Broad product surface that deepens engagement across accounts, spend, invoicing, and automation.
  topRisks:
    - Current valuation remains anchored to a 2022 pricing event rather than a fresh market transaction.
    - Profitability, retention, and current unit-economics disclosure remain limited.
    - Regulatory, partner-dependency, and execution risk remain material as the platform scales.
