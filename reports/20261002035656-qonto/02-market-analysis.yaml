    rows:
      - ["Business account and payments", "Account subscription and transaction-service fees", "Customer deposits, transferred principal, and loan principal", "Founder, owner, or finance lead; legal entity pays", "Core operating account and payment workflow"]
      - ["Bookkeeping and invoicing workflow", "Fees for invoice, receipt, reconciliation, and accountant-collaboration tools", "Full ERP, audit, tax-advisory, and external accountant fees", "Owner or finance lead; accountant is a user", "Expands the product beyond banking into finance operations"]
      - ["Expense and spend management", "Subscription or usage fees for cards, budgets, approvals, and receipt capture", "Employee purchases and reimbursed expense value", "Finance lead or operations lead; legal entity pays", "Creates multi-user adoption and premium-plan potential"]
      - ["Financing and partner adjacencies", "Platform or partner fees attributable to integrated financing and adjacent services", "Credit principal, telecom data spend, and unrelated partner revenue", "Owner or finance lead", "Potential attach revenue, but not part of the core category denominator"]
    notes: >-
      Boundary is synthesized from assigned product, review, and news sources; excluded amounts
      prevent deposits, principal, and adjacent third-party spend from being mislabeled as market revenue.
    claimRefs: [CM001, CM010, CM011, CM012, CM016]
  - id: TM002
    title: Sizing lenses supported by assigned evidence
    columns: [Publisher and period, Geography or population, Reported value, Methodology, Confidence, Limitation]
    rows:
      - ["TechCrunch, January 2022", "France, Germany, Italy, and Spain", "220,000 paying companies", "Journalistic report quoting management", "Medium", "Historical company-reported footprint; not a market denominator"]
      - ["International Finance, September 2024", "European customer base; article discusses four core markets", "450,000 customer companies; reported as 30% above 2022", "Secondary report referencing company and Sifted reporting", "Medium", "Period and cohort definition are not independently audited in the source"]
      - ["Gigs partner release, July 2026", "Eight countries", "Over 600,000 SMEs and freelancers", "Partner-issued launch announcement", "Medium", "Commercial partner claim; not independent verification or market share"]
      - ["Assigned evidence set, October 2026 review", "European SME finance-management category", "Monetary TAM, SAM, and SOM not disclosed", "Review of all eight assigned prefetched sources", "Medium", "Missing eligible-firm denominator, spend per firm, and penetration bridge"]
      - ["Forge, October 2026", "Private-market data page", "Qonto total funding and active trading price shown as unavailable", "Marketplace display with explicit missing values", "Low", "Does not size the operating market and should not be treated as valuation evidence"]
    notes: >-
      Values use different vintages, issuers, definitions, and denominators; they are shown as
      separate sizing lenses and must not be added or interpreted as audited market growth.
    claimRefs: [CM002, CM003, CM004, CM005, CM006]
  - id: TM003
    title: Segment, buyer, user, payer, and adoption map
    columns: [Segment, Buyer, User, Payer, Workflow and budget owner, Adoption trigger or constraint]
    rows:
      - ["New freelancers and newly formed companies", "Founder or owner", "Founder and external accountant", "New legal entity", "Founder controls the banking and admin budget", "Capital-deposit and company-formation moment; around one third of the 2022 base reportedly formed with Qonto"]
      - ["Existing micro-businesses", "Owner or manager", "Owner, employee cardholders, accountant", "Business entity", "Owner controls a combined banking and software budget", "Can replace an incumbent bank or run in parallel; simplicity and setup speed drive adoption"]
      - ["Small teams, generally 1-50 employees in the comparison source", "Founder, finance manager, or operations lead", "Employees, finance team, accountant", "Business entity", "Finance or operations owner controls account and spend tooling", "Budgets, approvals, cards, receipts, and integrations increase utility"]
      - ["More complex or internationally active SMEs", "Finance leader", "Finance team and traveling employees", "Business entity", "Finance leader coordinates payments, cards, and cross-border workflows", "Localization and travel tools help, but advanced banking, credit, and integration needs can push buyers to alternatives"]
      - ["Accountants and bookkeeping collaborators", "Business owner or finance lead", "Accountant or bookkeeper", "Business entity", "Finance owner buys; accountant influences tool fit", "Real-time reconciliation and country-specific accounting integrations reduce switching friction"]
    notes: >-
      Segment boundaries combine company-issued product descriptions, partner claims, independent
      comparison content, and customer reviews; budget ownership is an analytical mapping, not a disclosed procurement study.
    claimRefs: [CM007, CM008, CM009, CM010, CM014, CM015, CM016]
figures:
  - id: FM001
    title: Evidence stack for Qonto's reachable market
    type: pyramid
    summary: >-
      A footprint-based evidence stack is used because the assigned sources do not provide a
      defensible current monetary TAM, SAM, or SOM.
    data:
      items:
        - label: "European SME finance-management category"
          value: "Not quantified"
          detail: "No assigned source provides a current independent monetary TAM or eligible-firm denominator."
        - label: "Qonto serviceable market"
          value: "Not quantified"
          detail: "Country-level eligible firms, spend per firm, and product eligibility are undisclosed."
        - label: "Current geographic footprint"
          value: 8
          unit: "countries"
          detail: "Partner-reported footprint in July 2026."
        - label: "Current customer footprint"
          value: 600000
          unit: "SMEs and freelancers, over"
          detail: "Partner-reported footprint in July 2026; not an independently audited cohort."
        - label: "September 2024 customer snapshot"
          value: 450000
          unit: "customer companies"
          detail: "Secondary report; included as a historical disclosure, not a conversion stage."
        - label: "January 2022 customer snapshot"
          value: 220000
          unit: "paying companies"
          detail: "TechCrunch report covering four countries; included as a historical disclosure."
    approximationNotes: >-
      This is an evidence hierarchy, not a conversion funnel. Customer counts use different
      dates and issuers, are not additive, and are not transformed into market share.
    claimRefs: [CM002, CM003, CM004, CM005, CM006]
callouts:
  - calloutType: insight
    title: Footprint is not TAM
    body: >-
      More than 600,000 served businesses demonstrates scale, but the assigned evidence lacks the
      independent firm-count and spend denominator needed to calculate penetration or market share.
    claimRefs: [CM002, CM003]
  - calloutType: risk
    title: Complexity can narrow the serviceable market
    body: >-
      Customer and comparison evidence points to gaps in specialized payment instruments, credit,
      advanced banking functionality, and integrations, which may limit adoption among complex SMEs.
    claimRefs: [CM014, CM015]
