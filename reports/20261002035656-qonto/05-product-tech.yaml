callouts:
  - calloutType: "insight"
    title: "In-House Core Banking System as the Strategic Foundation"
    body: "Qonto's decision to migrate from Treezor to its own core banking engine in 2020 represents its single most significant technical milestone [CE001]. Owning the transactional ledger and payment institution license eliminated margin-eroding third-party BaaS fees, unlocked faster product development cycles for complex spend management workflows, and provided the architectural independence necessary to scale past 600,000 customers [CE001, CE003, CE006]."
    claimRefs:
      - "CE001"
      - "CE003"
      - "CE006"
  - calloutType: "risk"
    title: "Regulatory Fragmentation in European E-Invoicing Expansion"
    body: "While Qonto is expanding into electronic invoicing to deepen customer retention, complying with divergent national e-invoicing standards across France, Germany, and Spain exposes the engineering organization to complex regulatory roadmaps [CE004]. Designing bespoke government connectors and adhering to evolving public tax specifications risks consuming substantial backend development bandwidth across the 110-engineer Foundations domain [CE003, CE004]."
    claimRefs:
      - "CE003"
      - "CE004"
