chapter:
  number: 5
  title: "Product & Technology"
  summary: "Qonto operates an integrated business finance workspace combining in-house core banking, multi-card spend management, automated bookkeeping, and e-invoicing compliance across eight European markets. Built on a proprietary banking core migrated from Treezor in 2020, its technical architecture scales to over 600,000 daily transactions and 110 backend engineers in its Foundations domain, while facing critical technical hurdles around pan-European e-invoicing mandates and credit-license evolution."
sections:
  - id: "product-definition-modules"
    title: "Product Scope and Customer Workflow Modules"
    body: "Qonto designs its product as an integrated financial operating system for European small and medium-sized enterprises (SMEs) and freelancers, structuring everyday financial operations across three complementary pillars: day-to-day business banking, bookkeeping automation, and corporate spend management [CE001, CE006]. The primary entry point for newly created enterprises is digital company formation and paid-up capital deposit, which pairs local European IBAN issuance with business registration in France, Germany, Italy, and Spain [CE001, CE007]. For ongoing operations, Qonto replaces disparate financial software by integrating SEPA instant transfers, physical and virtual Mastercard payment cards with configurable spending rules, automated VAT and receipt reconciliation, and digital invoice generation [CE001, CE002, CE006, CE008]. To eliminate cross-border connectivity friction for mobile European business teams, Qonto also directly embeds travel eSIM provisioning via Gigs natively within the mobile application, granting cellular connectivity in over 180 countries without requiring external telecom roaming subscriptions [CE005]. As European tax authorities enforce B2B electronic invoicing reforms, Qonto is upgrading its accounts payable and accounts receivable modules to function as a registered e-invoicing platform connecting directly to government tax portals across France, Spain, and Germany [CE004]."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE004"
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE008"
    tableRefs:
      - "TE001"
      - "TE002"
  - id: "architecture-and-operating-model"
    title: "Core Banking Architecture, Engineering Organization, and Operating Model"
    body: "The core technical differentiator of Qonto's software stack is its proprietary in-house core banking system (CBS), which the company migrated to in 2020 after initially bootstrapping operations on third-party banking-as-a-service provider Treezor [CE001]. Operating under its own payment institution license, Qonto manages ledger state, account balances, and direct payment scheme connections internally rather than delegating custody and ledger execution to an external BaaS platform [CE001, CE006]. The engineering organization scales backend services through a dedicated Foundations domain comprising approximately 110 backend engineers responsible for critical platform services including transactions processing, search indexing, billing, multi-tenant permissions, internal tooling, and external partner integrations [CE003]. To sustain system resilience as transaction throughput reaches approximately 600,000 daily events approaching one billion total processed records, the engineering organization enforces standardized living technical documentation across more than 50 functional scopes [CE003, CE009]. Cross-functional engineering, product, and operations teams coordinate their roadmap, service dependencies, and Lean problem-solving workflows using centralized databases and living specifications rather than static handoffs [CE009, CE010, CE011]."
    claimRefs:
      - "CE001"
      - "CE003"
      - "CE006"
      - "CE009"
      - "CE010"
      - "CE011"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "technical-risks-and-differentiation"
    title: "Technical Differentiation, Regulatory Compliance, and Scalability Gaps"
    body: "Qonto's technological differentiation stems from its full vertical integration across core ledger infrastructure, compliance tooling, and workflow automation, rather than reskinning legacy banking rails [CE001, CE006]. However, this architectural ownership creates non-trivial technical and regulatory challenges as European B2B transaction laws evolve. The rollout of mandatory B2B e-invoicing across France, Spain, and Germany requires building low-latency, highly available connectors to distinct national public invoicing portals and government tax specifications, transforming invoicing from a lightweight SaaS feature into a mission-critical regulatory interface [CE004]. Simultaneously, high transaction volumes place substantial performance pressure on search indexing and real-time transaction ledger querying at scale [CE003]. Furthermore, while Qonto has established in-house card processing and SEPA rails under its payment institution authorization, its lack of a full credit banking license limits native balance sheet lending, requiring architectural integrations with external credit and savings partners such as October and Cashbee to deliver expanded balance-sheet services [CE001, CE006]."
    claimRefs:
      - "CE001"
      - "CE003"
      - "CE004"
      - "CE006"
