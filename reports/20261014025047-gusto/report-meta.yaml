companyProfile:
  summary: >-
    Gusto is a late-stage private cloud software company that sells payroll, HR, benefits, compliance, and
    contractor-management tools to U.S. small and midsize businesses. The company has surpassed $1 billion in trailing
    twelve-month revenue, serves more than 500,000 customers, and monetizes through subscription plans, per-employee
    pricing, and add-on services. Its product breadth now extends beyond core payroll, but its strongest fit remains
    lean SMBs that want automated compliance without enterprise complexity.
