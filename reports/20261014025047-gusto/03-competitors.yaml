callouts:
  - calloutType: "strength"
    title: "Differentiation Anchored in Usability, Ecosystem Depth, and Transparent Terms"
    body: "Gusto differentiates from legacy incumbents Paychex and ADP by eliminating restrictive annual lock-in and bundling digital onboarding across all tiers. With 650+ integrations and an intuitive user interface, Gusto creates a frictionless operational hub for sub-100 employee businesses that lower-cost rivals cannot match."
    claimRefs:
      - "CP004"
      - "CP005"
      - "CP006"
      - "CP014"
  - calloutType: "risk"
    title: "Mid-Market Glass Ceiling and Partner-Reliant International Model"
    body: "Gusto's differentiation erodes as clients scale past 100 employees or expand abroad. The lack of native international legal entities forces global teams onto Remote partnerships, while support friction on complex payroll exceptions (Trustpilot 2.5/5) leaves Gusto vulnerable to displacement by unified platforms like Rippling."
    claimRefs:
      - "CP010"
      - "CP011"
      - "CP012"
