evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financials-and-unit-economics
    missingEvidence: >-
      Audited GAAP financial statements including gross margin percentages, operating margins, EBITDA, and detailed cash
      flow statements for Gusto as a private company.
    whyItMatters: >-
      Gusto discloses headline revenue surpassing $1 billion and positive cash flow, but exact gross margin profiles and
      bottom-line GAAP profitability cannot be independently verified without audited financial filings.
    diligencePath: >-
      Obtain confidential financial disclosures or pre-IPO S-1 registration filing statements when prepared for public
      listing review.
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-cap-table-liquidation-preferences
    missingEvidence: >-
      Complete shareholder cap table with fully diluted equity percentages, share classes, and liquidation preference
      structures across all 88 disclosed investors.
    whyItMatters: >-
      While lead institutional investors and round sizes are documented, ownership distribution and preferred security
      covenants remain confidential private data.
    diligencePath: >-
      Review certificate of incorporation filings in Delaware or investor disclosure schedules during secondary share
      due diligence.
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-founder-governance-composition
    missingEvidence: >-
      Comprehensive listing of independent board of directors members, observer seats, and committee chairs beyond
      executive founders and lead venture partners.
    whyItMatters: >-
      External board seats beyond lead venture directors like General Catalyst are not fully disclosed in public
      profiles, limiting governance risk assessment.
    diligencePath: Request governance charters and board member rosters from corporate secretary in formal diligence.
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A current independent US SMB payroll and HR software market estimate with methodology, geography, period, and
      CAGR.
    whyItMatters: Without a comparable denominator, company scale cannot be translated into market share, TAM, SAM, or SOM.
    diligencePath: >-
      Commission or obtain a reputable analyst dataset and reconcile its category boundary to Gusto's US SMB product
      scope.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: customer-scale
    missingEvidence: >-
      A dated customer-count definition reconciling the 400,000-plus independent-review figures with Gusto's
      500,000-plus claim.
    whyItMatters: The denominator may include different account types, inactive businesses, partners, or publication lags.
    diligencePath: Request cohort definitions, active paid-customer counts, and period-end customer reconciliations from management.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: market-penetration
    missingEvidence: >-
      Segment-level win rates, retention, customer counts, and revenue by employer size, state footprint, and product
      bundle.
    whyItMatters: >-
      These data are required to estimate serviceable penetration and expansion economics rather than infer them from
      aggregate scale.
    diligencePath: Review management cohort exports and billing data by segment, acquisition period, and adopted module.
    relatedQuestionRefs:
      - QM002
      - QM003
      - QM004
    relatedTableRefs:
      - TM002
      - TM003
  - type: private-evidence-only
    severity: material
    topic: international-payroll
    missingEvidence: >-
      Audited multi-country entity ownership breakdown and revenue split between domestic payroll and partner-delivered
      Global EOR services.
    whyItMatters: >-
      Gusto relies on Remote for international EOR across roughly 12 countries, leaving it structurally vulnerable
      against global-first platforms like Rippling and Deel for scaling cross-border teams.
    diligencePath: >-
      Request management disclosure on cross-border revenue share, international entity roadmap, and gross margins on
      Remote-brokered contracts.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: gross-margin-and-ebitda
    missingEvidence: Audited financial statements detailing gross margins, payment processing COGS, and GAAP operating profitability.
    whyItMatters: >-
      Without segmented gross margins, investors cannot definitively model the incremental margin contribution of
      non-payroll versus core payroll products.
    diligencePath: Request audited GAAP income statements and cost of revenue breakdowns during confidential data room diligence.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: customer-retention-and-churn
    missingEvidence: Net revenue retention benchmarks, gross logo retention rates, and SMB cohort churn dynamics.
    whyItMatters: >-
      Small business mortality is structurally elevated relative to enterprise software; high gross churn could impair
      long-term compound growth.
    diligencePath: Request multi-year cohort retention curves segmented by employee count and plan tier.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: minor
    topic: credit-facility-terms
    missingEvidence: Disclosures regarding revolving credit facilities, payroll float interest terms, and debt covenants.
    whyItMatters: >-
      Float interest on impounded payroll taxes contributes to margin, while debt covenants could constrain strategic
      capital deployment.
    diligencePath: Review credit agreements and banking partner fee sharing terms under NDA.
    relatedQuestionRefs:
      - QI008
  - type: private-evidence-only
    severity: material
    topic: cloud-infrastructure-sla
    missingEvidence: >-
      Audited system architecture diagrams, uptime SLAs, and SOC 2 Type II compliance audit reports detailing cloud
      hosting infrastructure and disaster recovery protocols.
    whyItMatters: >-
      Gusto processes mission-critical statutory tax filings and wage disbursements for over 500,000 businesses;
      unverified cloud infrastructure and failover redundancy pose operational underwriting risk.
    diligencePath: >-
      Request confidential SOC 2 Type II audit reports, ISO 27001 certifications, and cloud infrastructure architecture
      documentation during formal management diligence.
    relatedQuestionRefs:
      - QE003
      - QE006
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: minor
    topic: developer-signal-api
    missingEvidence: >-
      Public developer platform metrics, public API request volumes, webhook failure rates, and ecosystem developer
      activity on third-party integration portals.
    whyItMatters: >-
      Independent developer telemetry verifies the technical health, extensibility, and partner stickiness of Gusto's
      integration ecosystem beyond marketing partner counts.
    diligencePath: >-
      Review Gusto Developer Portal API documentation, partner app store telemetry, and developer community forums under
      technical NDA.
    relatedQuestionRefs:
      - QE004
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: cohort-retention-nrr
    missingEvidence: >-
      Audited cohort-level net revenue retention (NRR), gross revenue retention (GRR), and annual customer logo churn
      rates.
    whyItMatters: >-
      Because Gusto serves SMBs which naturally exhibit higher business mortality and churn than enterprise SaaS,
      undisclosed NRR obscures whether organic account expansion offsets small business churn.
    diligencePath: >-
      Request historical cohort retention curves and gross/net dollar retention breakdowns by employee-size band during
      pre-IPO confidential data room access.
    relatedQuestionRefs:
      - QU009
    relatedTableRefs:
      - TU002
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-sample-TU003
    missingEvidence: Exhaustive customer deployment data across all 500,000+ businesses beyond public case study references.
    whyItMatters: >-
      Table TU003 captures a representative sample of accounting firms, enterprise bank integrations, and SMB users, but
      vendor case studies may select for positive operational outcomes.
    diligencePath: >-
      Audit customer concentration and churn across a stratified sample of non-reference accounts during data room
      review.
    relatedTableRefs:
      - TU003
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      Comprehensive audit records of state-level payroll tax penalty notices and client reimbursement payout statistics
      across all 50 states.
    whyItMatters: >-
      Directly determines the residual financial exposure Gusto faces when tax engine calculation bugs or state agency
      electronic filing delays trigger late-payment penalties.
    diligencePath: >-
      Request confidential tax operations error rate reports, notice resolution times, and escrow account reconciliation
      statements during formal diligence.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: partner-concentration
    missingEvidence: >-
      Contract terms, commercial revenue-share rates, and SLA commitments governing the exclusive employer of record
      partnership with Remote.
    whyItMatters: >-
      A commercial dispute or termination of the Remote agreement would disrupt international hiring capabilities for
      growing U.S. customers.
    diligencePath: >-
      Review master service agreements and revenue share schedules with key strategic partners including Remote and
      Middesk.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: private-financials-and-ipo-readiness
    missingEvidence: >-
      Audited gross margins, net revenue retention rates, and formal IPO readiness timeline are withheld as a private
      entity.
    whyItMatters: >-
      Direct verification of unit margins and cohort expansion is critical to refining quantitative valuation multiples
      ahead of public listing.
    diligencePath: >-
      Request audited financial statements, cohort retention tables, and cap-table liquidation preferences during
