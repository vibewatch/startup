        title: Exhibits
        blocks:
          - type: callout
            title: Installed base is a scale proxy, not market size
            body: >-
              The 500,000-plus company claim and USD 1 billion revenue milestone support commercial scale, but neither
              supplies a category denominator or a defensible TAM, SAM, or SOM.
            calloutType: insight
            claimRefs:
