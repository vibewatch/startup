      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand is driven by recurring payroll obligations, fragmented compliance, limited administrative capacity
              at small businesses, and the value of joining payroll, benefits, and HR data in one workflow. Multi-state
              hiring increases the need for automated tax filing, while manual processing exposes owners to time costs
              and filing risk. Constraints are equally concrete: benefits availability varies by state, richer features
              and support can require higher tiers or add-ons, and international employment relies on Remote rather than
              a broad Gusto-owned entity network. Large or international-first organizations may therefore graduate to
              more configurable HCM or global-employment systems. For valuation, observable cross-sell and acquisition
              claims are positive, but the absent category denominator, penetration rate, retention, and independently
              sourced CAGR prevent a source-backed market-share or SOM conclusion.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM011
              - CM012
              - CM014
              - CM015
              - CM016
