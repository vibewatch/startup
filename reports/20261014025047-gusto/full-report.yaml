              - CE002
              - CE004
              - CE005
              - CE006
              - CE007
      - number: '5.2'
        title: Workflow Automation and Operational Mechanics
        blocks:
          - type: paragraph
            body: >-
              Gusto replaces manual, fragmented small-business human resource procedures with automated digital
              workflows designed for business operators who lack dedicated HR departments. Traditional small-business
              payroll requires tedious hour aggregation, manual gross-to-net tax math, paper check issuance, and complex
              quarterly state and federal form preparation. Gusto streamlines this operational lifecycle into a
              sub-five-minute digital execution or fully automated AutoPilot background process. The software
              automatically calculates statutory withholdings, coordinates direct deposit payments, and handles federal
              Form 940 and Form 941 filings alongside applicable state tax obligations.


              Onboarding workflows follow a self-service model where newly hired W-2 employees and 1099 independent
              contractors enter personal identification, direct deposit details, and withholding allowances directly
              through web or mobile interfaces. For cross-border labor, Gusto facilitates contractor disbursements
              across more than 120 countries utilizing payment rails powered by Wise and stablecoin mechanisms. When
              employers require full-time international employment, Gusto partners with Remote to provide employer of
              record (EOR) services, routing onboarding, foreign tax withholding, and local statutory compliance to
              Remote's localized legal infrastructure.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
              - CE012
          - type: table
            tableRef: TE002
