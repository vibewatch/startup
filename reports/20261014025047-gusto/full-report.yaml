              - CE014
          - type: callout
            title: Third-Party Regulatory and Global Partner Dependencies
            body: >-
              While Gusto automates domestic payroll processing, international workforce delivery depends on Remote for
              EOR and multi-state employer tax setup relies on Middesk, introducing external partner operational
              dependencies.
            calloutType: risk
            claimRefs:
              - CE012
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Ideal Customer Profile
        blocks:
          - type: paragraph
            body: >-
              Gusto's commercial expansion is anchored on a clear segmentation model that targets U.S. small and
              medium-sized businesses spanning single-person entities up to 100-employee organizations. The platform
              packages its capabilities across three primary service tiers: Simple, Plus, and Premium. The Simple tier
              targets micro-businesses and solopreneurs seeking automated single-state payroll and contractor payments
              at a base of $40 per month plus $6 per employee. Core small businesses with 2 to 25 W-2 employees
              represent the primary volume engine on the Plus plan, priced at an $80 monthly base plus $12 per employee,
              which layers on automated multi-state tax filing, PTO management, and next-day direct deposit.
              Organizations scaling toward 100 employees utilize the Premium tier at $180 per month plus $22 per
              employee, accessing dedicated HR advisors and compliance alerts. While this tiered structure drives steady
              account expansion across the core SMB segment, third-party technology reviews note that organizations
              scaling beyond 100 workers frequently outgrow Gusto's basic HRIS and performance tools, creating an upper
              boundary on its addressable customer size.
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU011
          - type: figure
            figureRef: FU001
            claimRefs:
