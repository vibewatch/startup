      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The economic buyer is typically an owner, finance lead, operations lead, or lean HR team; employees and
              contractors are the recurring users, and the employer is the payer. The strongest fit is a US business
              that values automated payroll tax filing, integrated benefits, transparent month-to- month pricing, and
              employee self-service without deploying enterprise software. Adoption can begin with payroll and
              onboarding, then broaden into benefits, time tracking, compliance, and contractor payments. That sequence
              is consistent with Gusto's claim that more than half of ARR now comes from products beyond payroll. Public
              pricing reduces initial procurement friction, but add-ons and tier changes can materially raise cost as
              headcount, state coverage, and workflow requirements expand.
            claimRefs:
              - CM002
              - CM004
              - CM005
              - CM006
              - CM007
              - CM011
