  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable boundary is narrower than broad global HCM: Gusto is consistently described as a US-first
              payroll, benefits, and HR platform for small and midsize employers. Core spend includes payroll
              processing, federal, state, and local tax administration, employee onboarding, and benefits workflows.
              Adjacent spend includes time tracking, recruiting, compliance, contractor payments, and limited
              international employment support. Manual payroll, accountants, and separate payroll, benefits, and HR
              point tools remain substitutes. Global employer-of-record infrastructure and deeply configurable
              enterprise HCM should be excluded because current reviews describe Gusto's international offer as
              dependent on Remote and its enterprise customization as limited. This boundary makes adoption a
              workflow-consolidation decision, not merely a payroll-software purchase.
            claimRefs:
