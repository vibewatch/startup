  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Structural workflow from initial self-serve onboarding through core payroll to multi-product monetization and
      partner channels.
    data:
      items:
        - label: Acquisition & Discovery
          stage: Acquisition & Discovery
          actor: SMB Owner / Bookkeeper
          objective: Replace manual payroll spreadsheets or legacy bureau services
          touchpoints:
            - Organic search
            - Accountant referral
            - Chase embedded banking
            - Word-of-mouth
          friction: Bank account verification delays and state tax agency registration
        - label: Self-Serve Onboarding
          stage: Self-Serve Onboarding
          actor: Operations Lead
          objective: Input employee W-2/1099 data and verify bank details in under 1 week
          touchpoints:
            - Interactive self-guided setup
            - Direct deposit bank verification
            - Tax profile setup
          friction: First-run payroll cutoff timeline on Simple plan (up to 4-day deposit)
        - label: Core Payroll Adoption
          stage: Core Payroll Adoption
          actor: Company Administrator
          objective: Automate recurring payroll runs and multi-state tax withholdings
          touchpoints:
            - Autopilot payroll processing
            - Employee self-service paystubs
            - Automated quarterly filings
          friction: Single-state payroll focus; complex multi-state registration overhead
        - label: Benefits & HR Expansion
          stage: Benefits & HR Expansion
          actor: HR Manager / Growing Team
          objective: Add integrated health insurance, 401(k), workers comp, and time tracking
          touchpoints:
            - Benefits admin dashboard
            - Gusto People Advisory
            - Plus plan upgrade
          friction: Per-employee add-on fee accumulation accelerating monthly costs
        - label: Partner & Embedded Integration
          stage: Partner & Embedded Integration
          actor: External Accounting Firm / Bank
          objective: Manage multi-client payroll and integrate with accounting/banking platforms
          touchpoints:
            - Gusto Pro partner portal
            - QBO/Xero ledger sync
            - Chase Payroll API
          friction: Accountant platform stickiness vs competing Rippling/ADP partner programs
        - label: Scale Ceiling & Enterprise Churn
          stage: Scale Ceiling & Enterprise Churn
          actor: 100+ Employee Enterprise
          objective: Advanced HRIS, enterprise performance management, and global payroll
          touchpoints:
            - Premium plan tier
            - Dedicated service advisor
            - International contractor payments
          friction: Companies exceeding 100 employees outgrow basic HRIS and seek dedicated platforms
    approximationNotes: >-
