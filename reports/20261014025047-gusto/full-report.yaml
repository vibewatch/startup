      - number: '6.2'
        title: Adoption Trajectory and Scale Milestones
        blocks:
          - type: paragraph
            body: >-
              Gusto has achieved substantial market penetration across the fragmented U.S. payroll software market over
              the past seven years. From an estimated base of approximately 95,000 customers in 2019, the company
              accelerated through the pandemic-era transition to remote work and distributed hiring, expanding to
              400,000 active businesses by 2023. In May 2026, Gusto officially announced that its platform serves more
              than 500,000 small businesses nationwide. Concurrently, the company disclosed surpassing $1 billion in
              trailing twelve-month revenue, marking five consecutive quarters of accelerating revenue growth. To
              service this expanding account base and support product enhancements, Gusto expanded its workforce from
              3,041 employees in 2023 to 4,426 employees by May 2026. However, because Gusto operates as a private
              company and reports customer milestones as point-in-time round numbers, public data lacks granular
              disclosures regarding active monthly payroll processing volumes versus dormant or seasonal accounts.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU007
          - type: table
