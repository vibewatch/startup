  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Perspective
      - Core Argument
      - Evidence Anchor
      - What Would Change View
    rows:
      - - Investment Thesis
        - Undisputed SMB payroll utility with 500k+ clients and cash flow positivity
        - 500,000+ SMB customers, >$1B revenue, FCF positive for years
        - Material deceleration in SMB net hiring or net logo contraction
      - - Investment Thesis
        - Product expansion into benefits and compliance yields multi-product ARR lift
        - Over 50% of ARR now generated from products beyond core payroll
        - Stalled cross-sell penetration and failure of Guideline/Mosey integrations
      - - Anti-Thesis
        - Compounding per-employee fees and add-on costs induce churn among scaling clients
        - BestGuide and Business.com reviews flag steep pricing progression as teams grow
        - Introduction of enterprise-friendly volume pricing tiers and unified bundles
      - - Anti-Thesis
        - Customer service bottlenecks during tax seasons generate operational friction
        - BBB notice flagging payroll complaints on file during peak filing deadlines
        - Automated anomaly detection in assisted payroll prep resolving support tickets
