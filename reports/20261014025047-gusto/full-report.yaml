        title: Sizing through observable scale, not a generic TAM
        blocks:
          - type: paragraph
            body: >-
              The source pool supports company-scale proxies rather than market-scale estimates. Gusto says more than
              500,000 businesses use the platform and that trailing-twelve-month revenue exceeded USD 1 billion, while
              two independent 2026 reviews still cite more than 400,000 businesses. The difference may reflect
              publication lag, counting definitions, or weak secondary sourcing; it should not be silently reconciled.
              Gusto also says more than half of ARR comes from products beyond payroll and that roughly 50,000 customers
              were added in the latest quarter, indicating expansion within the workflow and continued acquisition. None
              of these figures is a TAM, penetration denominator, or independently verified market forecast, so
              valuation work should treat them as traction signals only.
