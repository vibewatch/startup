  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与理想客户画像
        blocks:
          - type: paragraph
            body: >-
              Gusto 的商业扩张建立在清晰的分层模式上，目标是从单人实体到 100 人企业的美国中小企业。平台提供 Simple、Plus 和 Premium 三个主要服务层级。Simple
              面向寻求自动单州薪资和承包商付款的微型企业与个体创业者，基础费为每月 40 美元加每名员工 6 美元。拥有 2 至 25 名 W-2 员工的核心小企业是 Plus 方案的主要成交量来源，基础费每月 80
              美元加每名员工 12 美元，并增加自动跨州报税、PTO 管理和次日直接存款。员工数接近 100 人的组织使用 Premium，每月 180 美元加每名员工 22 美元，可获得专属 HR
              顾问和合规提醒。分层结构推动了核心 SMB 客户持续扩张，但第三方技术评测指出，员工数超过 100 人后，企业经常会超出 Gusto 基础 HRIS 和绩效工具的能力边界，形成可服务客户规模的上限。
            claimRefs:
