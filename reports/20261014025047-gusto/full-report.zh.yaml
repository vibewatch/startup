  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与平台范围
        blocks:
          - type: paragraph
            body: >-
              Gusto 从 2011 年的 ZenPayroll
              起步，逐渐发展为综合人员管理平台，在单一云架构中整合核心薪资、员工福利经纪、人才管理和商业合规。核心产品自动完成跨州工资计算、法定扣款、直接存款发放和雇主报税。除工资计算外，平台还提供
              AutoPilot，能够自动执行周期性薪资运行，无需雇主每个发薪周期手工介入。如今 Gusto 的 ARR 中超过一半来自核心薪资以外的产品，说明客户确实在采用扩展后的模块组合。


              平台扩张由有重点的企业收购和原生产品开发共同推动。Gusto 收购 Guideline，以支持原生 Gusto 401(k) 退休金产品；又收购州合规技术公司 Mosey，为 Gusto Business
              Compliance 套件打基础。员工福利上，Gusto 作为持牌健康保险经纪人，提供医疗、牙科和视力保险方案管理，不另收经纪管理费。HR
              套件还包括应用内申请人跟踪系统（ATS）、数字化录用通知书、电子签名入职清单，以及员工离职后仍可终身自助访问历史税表和工资单。
