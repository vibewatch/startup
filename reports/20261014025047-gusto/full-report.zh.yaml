              过去七年，Gusto 在碎片化的美国薪资软件市场取得了相当的渗透。从 2019 年约 95,000 家客户的估计基数起，公司在疫情期间远程办公和分布式招聘转型中加速增长，到 2023 年扩大至 40
              万家活跃企业。2026 年 5 月，Gusto 正式宣布平台服务全国超过 50 万家小企业。同期，公司披露过去 12 个月收入超过 $1 billion
              亿美元，收入增速连续五个季度加快。为服务不断扩大的客户基础并支持产品增强，Gusto 员工数从 2023 年的 3,041 人增至 2026 年 5 月的 4,426 人。不过，由于 Gusto
