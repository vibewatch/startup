      - number: '4.3'
        title: 成本结构、单位经济与服务交付
        blocks:
          - type: paragraph
            body: >-
              Gusto 的服务交付经济学将高毛利云软件与合规监管、报税执行、客户支持和金融交易处理等运营开销结合起来。核心平台自动完成薪资计算、直接存款路由和跨司法辖区报税，账户密度提升后可带来显著运营杠杆。但覆盖全部 50
              个州意味着持续合规监控、银行交易费和客户服务需求都不低。独立评估指出，实时客户电话支持仅限于标准营业时间，而非全天候 24/7；与企业级人力资本管理平台相比，平台定制能力也受限。从单位经济看，50
              万家企业贡献超过 $1 billion 过去 12 个月收入，意味着每个账户的平均年合同价值约为 $2,000。由于客户合同按月、没有年度锁定，长期单位经济高度依赖总客户留存和多产品扩张，以抵消小企业自然淘汰率。
