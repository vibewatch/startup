      - number: '4.2'
        title: 定价结构、套餐设计与增值服务变现
        blocks:
          - type: paragraph
            body: >-
              Gusto 通过混合订阅模式变现客户基础：每月收取公司基础费，并在三种主要全服务薪资套餐中按员工收取月费。入门级 Simple 套餐为每月 49 美元基础费加每名员工每月 6
              美元，提供单州核心薪资、自动报税和自助入职。面向中端市场的 Plus 套餐为每月 80 美元加每名员工每月 12 美元，服务需要跨州能力、集成工时追踪和定制入职流程的成长型企业。Premium 套餐为每月 180
              美元加每名员工每月 22 美元，包含专属 HR 顾问服务、合规提醒和健康保险经纪集成。此外，Gusto 还为单成员 LLC 和 S-Corporation 提供 Solo 套餐，基础费 49 美元加每名收款人每月
              6 美元。除基础软件订阅外，Gusto 还通过专门增值服务增加收入，包括每月 14 美元起的工伤赔偿、每位参与者 2.50 美元的健康储蓄账户，以及每位参与者 4 美元的灵活支出账户。Gusto
              作为健康保险记录经纪人时免收管理费，但如果雇主保留外部经纪人，Plus 方案每名员工每月需支付 6
              美元的集成费。独立评测指出，虽然标价透明，但按席位累加的费用和增值服务绑定，会随着客户人数增加迅速推高月度软件支出。
