      - number: '5.2'
        title: 工作流自动化与运营机制
        blocks:
          - type: paragraph
            body: >-
              Gusto 用自动化数字工作流替代碎片化的手工小企业人力资源流程，服务没有专职 HR 部门的经营者。传统小企业薪资处理需要繁琐地汇总工时、手算税前税后工资、开具纸质支票，以及复杂地准备季度州和联邦表格。Gusto
              将整个运营周期压缩成不到五分钟的数字操作，或交给后台全自动 AutoPilot。软件自动计算法定预扣款、协调直接存款，并处理联邦 Form 940、Form 941 及适用的州税务义务。


              入职流程采用自助模式：新入职的 W-2 员工和 1099 独立承包商直接通过网页或移动界面填写个人身份信息、直接存款信息和预扣税额。对于跨境劳动力，Gusto 借助 Wise 和稳定币支付机制支持向 120
              多个国家发放承包商款项。当雇主需要正式雇用海外全职员工时，Gusto 与 Remote 合作提供名义雇主（EOR）服务，将入职、海外预扣税和当地法定合规交给 Remote 的本地法律基础设施。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
