      - number: '5.3'
        title: 架构、集成与嵌入式 AI
        blocks:
          - type: paragraph
            body: >-
              Gusto 的技术架构是多租户云应用，可通过现代网页浏览器、原生移动应用和专用数字打卡终端访问。员工保留账户的终身登录权限，即使离职，也能持续访问历史 W-2 表、福利报表和工资记录。平台与约 150
              个第三方软件应用预先构建双向集成，能将员工工时、工资拆分、税务负债和费用直接同步至 Intuit QuickBooks、Xero 等会计账簿。


              人工智能已成为 Gusto 软件平台的核心层。Gusto 部署了嵌入式对话式 AI 助手 Gus，用于回答人力资源问题并呈现公司专属运营数据；同时提供具备代理能力的 AI 助手
              Cofounder，可执行承包商付款、报表生成和带提交前异常检测的自动薪资准备等操作。此外，Gusto 还通过 Anthropic Claude、OpenAI ChatGPT 和 Slack
              的原生连接器与插件，将运营能力延伸到第三方生产力环境，允许企业主用自然语言发起薪资任务并查询合规要求。
