        title: 管理层、创始团队匹配度与治理
        blocks:
          - type: paragraph
            body: >-
              管理团队兼具前沿模型研究经验和基础设施系统工程能力。CEO Diogo Almeida 在 OpenAI 工作四年，直接参与 RLHF、InstructGPT 和早期 ChatGPT 开发，随后离开并启动
              TypeSafe AI 这条反常规的面向机器研究路线。联合创始人 Erik Gafni 和 Sasha Sheng 负责核心基础设施与模型系统，组成紧密的技术创始三人组。Almeida
              代表校准决策建模的核心研究理念，也是公司论点的公开倡导者，因此 TypeSafe AI 对关键人物依赖较重。2026 年 10 月 A 轮融资后，外部治理明显加强：Andreessen Horowitz
              普通合伙人 Martin Casado 加入董事会，为创始团队的纯研究背景补充企业扩张和网络基础设施经验。
            claimRefs:
