            body: >-
              TypeSafe AI 的资本形成经历了近期创投史上最压缩的估值轨迹之一。公司在隐身状态下自筹两年，随后于 2026 年 9 月宣布由深科技风投 DCVC 领投的 $40 million 种子轮，据报道估值
              $200 million。仅三周后，即 2026 年 10 月 9 日，公司宣布由 Andreessen Horowitz 领投的 $870 million A 轮，披露估值 $7.5
              billion；Sequoia Capital、既有种子投资人 DCVC 和私人天使投资人参投。公司走出隐身状态一个月内，披露的股权资本总额达到 $910 million。这次 37.5
              倍估值跃升显示投资人对非聊天智能基础设施抱有非凡信心；但公司和领投方都未说明 $7.5 billion 是投前还是投后估值，最终资本结构和创始人稀释程度因此存在歧义。
