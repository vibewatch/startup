  - id: TV002
    title: 核心论点与反向论点评估
    columns:
      - 支柱
      - 核心论点
      - 反向论点的风险
      - 监测指标与反转触发条件
    rows:
      - - 产品架构
        - 非对话式 System One 决策模型从架构上消除文本幻觉，并提供 70-500ms 的确定性决策。
        - 前沿模型供应商可以在现有开发者 API 中加入低成本结构化 JSON 采样端点和原生决策头。
        - 若 OpenAI 或 Google 推出低于 50ms、校准良好的决策 API，且 Jev 基准准确率相当，则论点反转。
      - - 单位经济性
        - 输入价格为每百万 token $0.042，输出 token 免费，打开了此前负担不起的高频自动化循环。
        - 超低 token 价格会严重挤压毛利率，除非推理基础设施和合成蒸馏达到巨大规模。
        - 若 TypeSafe AI 证明在规模化生产企业层级中，推理 COGS 低于 20% 且单位贡献利润为正，则论点反转。
      - - 生态分发
        - 在开发者平台（Vercel、Cloudflare、LangChain）上的快速集成，会在企业采购介入前形成自然增长势头。
        - 免费开发者集成和试用层的采用，可能无法转化为已承诺的企业合同和多年 ARR。
        - 若付费企业客户转化率超过活跃网关团队的 20%，且净收入留存率高于 130%，则论点反转。
      - - 资本与治理
        - 由顶级投资方（a16z、Sequoia、DCVC）领投的已披露股权融资超过 $910M，为其主导该品类提供多年资金续航。
        - 巨额资本涌入会迫使这家年轻初创公司在产品市场匹配完全稳固前，过早扩张人员和基础设施。
        - 若月度资金消耗率在企业合同签约未同步加速的情况下超过 $25M，则论点反转。
    notes: 核心投资论点与反向论点，以及相应监测触发条件。
