  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 按工作流专业化程度和执行效率，对决策系统与语言模型进行序数定位。
    approximationNotes: 分数为序数位置（1-10），根据公开评估中报告的延迟、价格基准和架构约束测得。
    data:
      xAxis:
        label: 工作流专业化程度（任务边界）
        min: 0
        max: 10
      yAxis:
        label: 执行效率（推理成本与延迟）
        min: 0
        max: 10
      points:
        - label: TypeSafe AI (Jev)
          x: 8.5
          'y': 9
          tone: positive
          description: 针对高频、有边界的决策优化，支持并行采样且输出 token 成本为零。
        - label: 前沿 LLM（GPT-5.6 / Claude Fable）
          x: 2
          'y': 2
          tone: neutral
          description: 通用推理和开放式文本生成；成本高，顺序延迟以秒计。
        - label: 轻量 LLM（Gemini Flash-Lite / Haiku）
          x: 4.5
          'y': 5.5
          tone: neutral
          description: 生成 token 速度快并支持结构化输出；成本有所降低，但仍受顺序解码限制。
        - label: 开源克隆（jev48 / open-jev）
          x: 8
          'y': 7.5
          tone: neutral
          description: 社区复现版本，部署成本低，但校准精度和生态支持落后。
        - label: 监督式分类器（bge-small + LogReg）
          x: 9.5
          'y': 9.2
          tone: neutral
          description: 在固定标注分类法上准确率最高、延迟为微秒级，但完全无法适应模式变化。
        - label: 确定性代码与静态规则
          x: 10
          'y': 9.8
          tone: neutral
          description: 对硬约束实现即时零成本执行，但完全无法处理语义细微差异。
    claimRefs:
      - CP012
      - CP013
      - CP014
  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 依次展示客户应用活动如何转化为 API token 消耗、计费使用量和毛利率贡献。
    approximationNotes: 转化步骤和成本比率代表基础架构流程及已发布开发者基准；企业毛利取决于托管基础设施协议。
    claimRefs:
      - CI002
      - CI003
      - CI010
    data:
      nodes:
        - id: step-1
          label: 客户软件事件（触发器）
        - id: step-2
          label: 应用上下文序列化（输入 token）
        - id: step-3
          label: Jev 决策引擎评估
        - id: step-4
          label: 类型化分类与分数输出
        - id: step-5
          label: 按量计费（每 B 输入 token $42）
        - id: step-6
          label: 毛利贡献（扣除托管 GPU 成本后）
      edges:
        - from: step-1
          to: step-2
        - from: step-2
          to: step-3
        - from: step-3
          to: step-4
        - from: step-4
          to: step-5
        - from: step-5
          to: step-6
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 从客户端应用集成向下至托管 GPU 算力的六层架构栈。
    data:
      layers:
        - label: 应用与客户端层
          detail: 客户端应用、TypeScript 与 Python SDK、Vercel AI Gateway 和 LangChain 中间件
        - label: API 网关与摄取层
          detail: REST 端点（/v1/systemone），负责认证、64k token 上下文窗口和限流
        - label: 并行采样引擎
          detail: 硬件感知采样器，单次运行即可同时为最多 255 个选项生成输出概率
        - label: System One 模型核心（Jev）
          detail: 基于 Transformer 的决策引擎，通过 RLCD 训练以实现校准置信度和零类型错误
        - label: 决策校准与评分运行时
          detail: 计算 Choice、Score 和 Noul 概率分布及置信度分数，供下游设阈值
        - label: 基础设施与算力平面
          detail: 托管 GPU 集群，针对低延迟并行推理优化，响应时间低于 100ms
    approximationNotes: 根据开发者文档和厂商技术披露抽象出的架构分层。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE007
      - CE011
