chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创立背景与核心架构
        blocks:
          - type: paragraph
            body: >-
              TypeSafe AI 是一家总部位于美国加利福尼亚州旧金山的人工智能系统实验室，成立于 2024 年，目标是为软件自动化开创面向机器的智能。公司由前 OpenAI 研究员 Diogo Almeida 与
              Erik Gafni、Sasha Sheng 共同创立，基于这样的判断：通过人类反馈强化学习训练的大语言模型擅长对话，但嵌入自动化软件架构后会带来严重的非确定性、延迟和解析开销。于是 TypeSafe 开发了旗舰
              System One 决策模型 Jev，训练方法称为 Reinforcement Learning for Calibrated Decisions。Jev 不输出对话式自然语言字符串，而是接收结构化问题，返回受
              schema 约束的类型化决策及校准置信概率。商业访问按输入 token 每 10 亿个 $42、输出 token 零收费设计，目标是让软件应用以低于 100 毫秒的延迟执行高频语义评估。
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO006
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO008
              - CO011
              - CO014
