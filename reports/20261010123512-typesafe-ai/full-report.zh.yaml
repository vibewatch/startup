        - AI 基础设施倍数回归至 30x - 40x ARR，导致倍数压缩。
        - 50%
      - - 悲观情景
        - 企业转化停滞；主要模型供应商捆绑校准分类能力；ARR 低于 $40M，同时算力消耗沉重。
        - $1.5B - $2.5B 下轮重组或困境收购；普通股权严重稀释。
        - $870M A 轮资本结构带来的高额清算优先权压力。
        - 30%
