          detail: X 上的开发者演示走红，以及 Vercel AI Gateway 提供零配置访问
          tone: positive
        - label: 基准测试
          detail: 在内部数据集上本地测试 Choice、Score 和 Noul 原语
          tone: neutral
        - label: 试点部署
          detail: 初始路由和审核筛选与现有 LLM 并行运行
          tone: neutral
        - label: 迁移到生产
          detail: 在目标高流量决策步骤中 100% 替代小型 LLM
          tone: positive
