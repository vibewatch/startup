      - number: '2.3'
        title: 企业买方画像、预算归属与集成工作流
        blocks:
          - type: paragraph
            body: >-
              System One 决策基础设施的采购和预算归属不同于传统生成式 AI 应用。对话工具和 AI 助手经常由业务线生产力预算或高管创新预算出资，而决策基础设施由核心工程、AI
              平台和基础设施团队评估并采购。目标买方包括负责系统延迟、正常运行时间和推理成本优化的工程负责人、CTO
              和平台架构师。主要技术用户是后端软件开发者、智能体流水线架构师和站点可靠性工程师。在企业客服、金融服务和信任与安全组织中，预算负责人往往是客户运营副总裁或风险工程负责人，他们希望自动化高流量分诊，却不引入解析错误。采用路径基本遵循混合集成：开发者把
              Jev 放在现有 OpenAI、Anthropic 或 Google 生成模型的上游分诊路由器或下游护栏位置。这种架构保留已有投入，同时消除容易失败的 JSON schema 抽取步骤。
            claimRefs:
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM014
      - number: '2.4'
        title: 采用驱动因素、运营约束与规模尽调缺口
        blocks:
          - type: paragraph
            body: >-
              面向机器的决策模型由强劲的技术驱动推动采用，但也受重要运营约束牵制。主要驱动包括压缩延迟——早期开发者测试显示端到端响应时间为 70 至 500 毫秒（中位数 76 毫秒）——以及完全消除结构化 JSON
              解析异常。但企业买方也遇到关键障碍。第一，schema 合规不等于决策准确：API
              调用可以返回格式完美却事实错误的选项。因此，企业部署前必须用自有客户数据严格验证校准概率，才能设定自动化阈值。第二，当现有基础模型供应商可以提供轻量结构化端点时，企业采购团队不愿为狭窄分类任务引入单一专用供应商。最后，尽调缺口仍很大：TypeSafe
              AI 在 2026 年 9 月发布后，没有披露付费生产客户数量、签约年经常性收入或留存数据。围绕 $10 billion 估值的报道式讨论反映出激进的市场预期，假设企业转化速度会远早于经审计的商业验证。
            claimRefs:
              - CM011
              - CM014
      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 面向机器的决策定价与 Jevons 悖论
            body: >-
              TypeSafe AI 对 Jev 的定价为每 10 亿输入 token $42（每百万 $0.042），约为前沿文本模型的 1/238。成本大幅压缩虽支持低延迟循环中的高频评估，却迫使 TypeSafe AI
              每年捕获数万亿次生产决策，才能产生有意义的软件基础设施收入。
            calloutType: insight
            claimRefs:
              - CM004
              - CM007
              - CM011
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 替代方案版图与竞争者画像
        blocks:
          - type: paragraph
            body: >-
              企业软件自动化工作流长期在僵硬的手写确定性规则引擎与昂贵、缓慢的通用大语言模型之间妥协。TypeSafe AI 于 2026 年 9 月走出隐身状态，获得 DCVC 领投的 $40 million 种子融资，并以
              Jev 开创“System One”决策模型品类。Jev 不生成对话散文，而是返回带校准置信概率的类型化输出，声称在路由、分诊和评分等离散选择上具备极高速度和成本优势。但 TypeSafe
              并非处在无人竞争的真空中。竞争版图包括四类替代方案：OpenAI 和 Anthropic 的前沿基础模型、Google Gemini Flash-Lite 等蒸馏轻量模型、传统监督分类器，以及
              jev48、open-jev 等新兴开源仿制品。前沿模型开发商拥有巨大的算力规模和更强的通用多步推理能力，但在简单决策门中部署时会带来高 token
              延迟和价格开销。反之，逻辑回归等传统监督分类器在历史类别上的推理速度可达微秒级，却缺少零样本语义适应能力。开源复现证明 Jev 的核心架构模式可以快速仿制，立即给 TypeSafe 的早期市场领先地位带来压力。
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP010
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP010
      - number: '3.2'
        title: 不同模型类别的能力与架构取舍
        blocks:
          - type: paragraph
            body: >-
              TypeSafe AI 声称的核心技术差异在于结构化输出安全和不确定性校准。前沿 LLM 生成非结构化 token 序列，开发者必须叠加事后 schema 验证层、JSON 约束或多轮修复提示；压力条件下错误率为
              0.58% 至 45.5%。Jev 把采样限制在预定义 schema 类型内，从架构上保证数据格式有效，彻底移除这一失败模式。TypeSafe 的 Reinforcement Learning for
              Calibrated Decisions（RLCD）还训练模型输出反映实际经验准确率的概率。但独立基准揭示了关键架构取舍。TypeSafe 宣称成本降低 445 倍、延迟改善 193 倍，社区基于 12,759
              份报告的评估却测得中位速度提升 7x、中位成本下降约 30x。更重要的是，在 Banking77 等多类别基准上，bge-small 加逻辑回归的监督式传统基线准确率达到 93.3%，超过 Jev 的
              83.2%。此外，Jev 完全不生成文本或解释性理由，对对抗性提示输入的韧性有限，因此只能部署在更大软件流水线中边界清晰、schema 稳定的运营节点。
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP007
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP007
      - number: '3.3'
        title: 推理经济性、产品包装与分发能力
        blocks:
          - type: paragraph
            body: >-
              TypeSafe AI 的商业策略由激进低价计划定义，目标是刺激高量自动化流水线采用。Jev 每 10 亿输入 token 收费 $42（每百万 token $0.042），输出 token
              完全免费，因此输入价格比 Claude Fable 5.1 低二百三十八倍，也显著低于每百万 token 收费 $0.20 至
              $10.00、另加输出倍数的前沿推理模型。应用可以进行推测性扇出查询和持续实时评估，例如自动化工具调用护栏、邮件分诊和入站线索评分，而不必让推理账单失控。然而，现有超大规模云厂商拥有深厚的分发与捆绑优势。Google
              以商品化价格提供 Gemini Flash-Lite，配有慷慨的免费额度，并直接集成到 Vertex AI 和 Google Cloud 服务。OpenAI 和 Anthropic
