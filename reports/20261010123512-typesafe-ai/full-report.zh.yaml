  - id: FV001
    title: 建议决策逻辑链
    type: flow
    summary: 从技术验证到估值纪律和投资建议的顺序分析链。
    data:
      nodes:
        - id: tech-architecture
          label: 技术架构
          detail: Jev System One 模型在 70-500ms 内输出受模式约束的概率选择，不产生文本幻觉。
        - id: developer-velocity
          label: 开发者增长速度
          detail: 通过 Vercel AI Gateway 快速自然采用（24 小时内覆盖 13% 的付费团队），并获得早期财富 500 强测试。
        - id: missing-disclosures
          label: 披露缺口
          detail: 年度经常性收入、客户续约留存或推理毛利均没有公开数据。
        - id: valuation-overhang
          label: 估值压力
          detail: $7.5B A 轮估值在不到一个月内较 $200M 种子轮估值上浮 37.5 倍，幅度激进。
        - id: competitive-moat
          label: 竞争护城河
          detail: 前沿模型供应商可能捆绑原生结构化决策端点和校准置信度评分。
        - id: final-recommendation
          label: 投资立场
          detail: 建议：跟踪 / 继续研究。在无法查阅经审计企业 ARR 前，不以 $7.5B 估值参与。
      edges:
        - from: tech-architecture
          to: developer-velocity
          label: 促成快速集成
        - from: developer-velocity
          to: missing-disclosures
          label: 掩盖财务真空
        - from: missing-disclosures
          to: valuation-overhang
          label: 加剧倍数风险
        - from: valuation-overhang
          to: competitive-moat
          label: 要求完美防御
        - from: competitive-moat
          to: final-recommendation
          label: 决定定价纪律
    approximationNotes: 代表投资委员会定性评估标准的顺序逻辑链。
    claimRefs:
      - CV001
      - CV004
      - CV007
      - CV010
      - CV012
      - CV013
      - CV014
