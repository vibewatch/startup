  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、工作负载范围与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              面向机器的智能正在给企业软件架构带来结构性分化。市场不再把所有认知任务都当作开放式对话生成，而是分成生成式 System Two 层和结构化 System One 决策基础设施。TypeSafe AI 通过自有
              Jev
              模型切入后者：模型接收原始应用状态，评估预先声明的类型化问题，返回校准概率、选项和评分，而不是文本。这一品类的市场边界很窄，涵盖确定性路由、实时工单分类、自动承保检查、政策护栏和模型路由调度，明确不包括对话创作、代码生成、长文档摘要和面向人的对话。眼下的替代方案有两类：一边是脆弱的确定性正则表达式和启发式规则引擎，另一边是调用速度慢、成本高的通用前沿
              LLM 结构化输出。System One 决策基础设施把数秒级的串行 token 生成替换成低于 100 毫秒的并行评估，在应用代码与基础模型 API 之间建立了独立的软件品类。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 可触达市场规模与价格通缩视角
        blocks:
          - type: paragraph
            body: >-
              估算面向机器的决策模型可触达市场，需要从多个视角拆解广义企业自动化支出。漏斗顶端，全球企业云软件、认知基础设施和业务工作流自动化年支出超过 $65 billion。其中，中间层 AI
              基础设施（包括中间件、智能体编排、模型路由和验证）的服务可触达市场（SAM）估计为 $4.8 billion 至 $14 billion。但传统市场规模方法无法捕捉 TypeSafe AI
              定价带来的剧烈价格通缩。在每 10 亿输入 token $42（每百万 $0.042）的价格下，Jev 的单位经济性比前沿生成模型低两百多倍。因此，要获得 $100 million
              软件年经常性收入，生产流水线需处理超过 2.3 trillion 个输入 token。价格大幅下降会让更多自动化检查在经济上可行，这正是 Jevons 悖论的典型表现；不过，在企业客户把决策 API
              接入关键、高频交易工作流前，近期可服务可获得市场（SOM）的获取仍受到严格限制。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM012
              - CM013
