              500 毫秒，输入 token 成本为每百万 $0.042（每 10 亿 $42），输出决策不计量。供应商强调，相比多步骤前沿 LLM 工作流，执行速度最高提升 193.6x、成本最高降低
              444.6x。但严格的第三方分析显示， headline 倍数代表基准优势的极端上限。发布部署的独立遥测显示，现实世界延迟中位数约 76 毫秒，相对传统模型有效成本下降约 30x。此外，TypeSafe
              公布的评估套件显示，Jev 在工作流准确率上以 67.8% 追平 Sonnet 5，却在原始任务精度上落后于 Sol（74.1%）和 Opus 5（73.1%）等顶级前沿模型。公司管理层明确承认，激进的
              $0.042/MTok token 定价能否在没有补贴的情况下长期可持续，尚未得到证明。
