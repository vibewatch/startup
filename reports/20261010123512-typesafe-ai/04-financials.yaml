callouts:
  - calloutType: insight
    title: Zero-Price Output Architecture as a Competitive Moat
    body: By charging solely on input tokens ($42 per billion) and pricing output decisions at zero, TypeSafe AI structurally decouples API costs from model reasoning complexity. For enterprise customers accustomed to paying asymmetric output token premiums on generative LLMs, Jev turns high-frequency workflow classification into a predictable operating cost rather than an escalating compute burden.
    claimRefs:
      - CI002
      - CI003
      - CI010
  - calloutType: risk
    title: Valuation Disconnect and Premature Scaling Risk
    body: The reported progression from a $40 million seed at a $200 million valuation to discussions exceeding $10 billion within weeks represents an extraordinary 50x markup driven by launch excitement rather than demonstrated revenue. Investors face acute downside risk if TypeSafe accelerates headcount and compute commitments before enterprise retention, contract pricing power, and gross margins are proven.
    claimRefs:
      - CI001
      - CI006
      - CI007
      - CI008
