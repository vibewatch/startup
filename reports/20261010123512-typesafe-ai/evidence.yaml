evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-adoption-verification
    missingEvidence: >-
      Independent audit or customer-disclosed contract documentation verifying TypeSafe AI's claim that roughly 25% to
      33% of Fortune 500 enterprises are using Jev in production.
    whyItMatters: >-
      The $7.5 billion Series A valuation assumes rapid enterprise monetization, but adoption claims currently rest
      entirely on unverified company and lead-investor statements without named references.
    diligencePath: Request customer reference calls and anonymized production invoice logs during primary diligence.
    relatedQuestionRefs:
      - QO008
  - type: enumeration-incomplete
    severity: material
    topic: investor-cap-table
    missingEvidence: >-
      Complete capitalization table detailing exact ownership percentages, option pool reserve, liquidation preference
      seniority, and secondary share transactions.
    whyItMatters: >-
      Understanding economic dilution between the $40M seed and $870M Series A is critical to evaluating founder
      incentives and governance dynamics.
    diligencePath: Review the company's certificate of incorporation, Series A voting agreement, and investor rights agreements.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: commercial-traction
    missingEvidence: Audited production customer metrics, contracted ARR, net revenue retention, and paying account counts.
    whyItMatters: >-
      Without disclosed paying customer figures, addressable market capture models rely entirely on speculative
      bottom-up estimates rather than demonstrated commercial willingness to pay.
    diligencePath: >-
      Request customer pipeline disclosures, pilot-to-production conversion rates, and revenue cohort data from TypeSafe
      AI management under NDA.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: valuation-expectations
    missingEvidence: >-
      Reconciliation between the $200 million seed post-money valuation and the reported $10 billion Series A funding
      discussions.
    whyItMatters: >-
      A 50x valuation jump within weeks of launch indicates extreme multiple expansion that is decoupled from near-term
      addressable market capture under $42/B token economics.
    diligencePath: >-
      Verify term sheets and lead investor commitments for the reported Series A round to confirm pricing, liquidation
      preferences, and milestones.
    relatedQuestionRefs:
      - QM009
  - type: missing-source
    severity: material
    topic: independent-production-benchmarks
    missingEvidence: >-
      Comprehensive third-party enterprise evaluations comparing Jev's calibrated decision accuracy against fine-tuned
      small language models across diverse production distributions.
    whyItMatters: >-
      Vendor-published figures show extreme speed and cost advantages, but independent tests reveal smaller multiples
      and highlight that supervised classifiers can outperform Jev when labeled data is available.
    diligencePath: >-
      Obtain blinded benchmark logs from production pilot customers comparing Jev, Gemini Flash-Lite, and domain-tuned
      classifiers on identical unlabelled operational traffic.
    relatedQuestionRefs:
      - QP001
      - QP005
    relatedTableRefs:
      - TP002
  - type: conflicting-data
    severity: material
    topic: copycat-resilience-and-moat
    missingEvidence: >-
      Quantitative multi-homing and churn data measuring whether developers utilizing Jev migrate to open-source
      reproductions (such as jev48) or incumbent cloud provider endpoints.
    whyItMatters: >-
      Rapid community replication of the core typed-decision architecture within days of release indicates low
      technological barriers to entry, making commercial moat durability dependent on proprietary distribution.
    diligencePath: >-
      Track API retention metrics, developer SDK churn rates, and enterprise multi-year contract commitments during
      upcoming funding rounds.
    relatedQuestionRefs:
      - QP004
      - QP008
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Direct data room disclosure of hosting infrastructure agreements, realized gross margins, and customer-level token
      volume distributions.
    whyItMatters: >-
      Determines whether TypeSafe AI can achieve software gross margins (70%+) or operates with lower infrastructure
      margins given inference hosting costs.
    diligencePath: >-
      Review management gross margin accounting, AWS/GCP cloud commitment schedules, and anonymized top-customer billing
