- id: TE002
  title: Workflow / use-case table
  columns:
  - User Job
  - Current Workflow
  - Company Solution
  - Measurable Benefit
  - Limitation
  rows:
  - - Support Ticket Triage
    - Sequential LLM parsing for department, urgency, and customer sentiment
    - Single parallel Jev request combining Choice, Score, and Noul primitives
    - Reduces triage latency from seconds to <100ms; costs fraction of a cent per batch
    - Cannot generate conversational customer responses or explanations
  - - Agent Tool Call Guardrail
    - Large LLM evaluates proposed function parameters before execution
    - Jev fast classification evaluates tool call safety against pre-set rubrics
    - 5x to 18x faster execution at p95 latency compared to frontier LLM checks
    - Cannot synthesize dynamic security policy adjustments or novel reasoning
  - - Lead Qualification & Routing
    - Rules-based regex or multi-prompt LLM scoring of inbound accounts
    - Composite calibrated score across discrete criteria with confidence thresholds
    - High-confidence items auto-route; uncertain leads cleanly escalate to human review
    - Sensitive to context noise; large unstructured documents degrade classification
  - - LLM Model Routing
    - All user prompts routed directly to expensive frontier models
    - Jev pre-screens queries to separate simple structured tasks from reasoning needs
    - Eliminates 10x-20x inference costs on standard classification and extraction
    - Requires engineering custom application state wrappers and question schemas
  notes: Performance metrics based on developer launch benchmarks and vendor evaluation reports; real-world benefits vary
    by prompt structure.
