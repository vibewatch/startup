- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / Component
  - Role & Functionality
  - Key Dependency
  - Technical & Operational Risk
  rows:
  - - Inference Engine & Sampler
    - Executes parallel forward-pass sampling for multi-question probability output
    - Proprietary model weights and custom hardware-aware parallel execution kernels
    - Closed-source model architecture prevents independent optimization or on-prem deployment
  - - RLCD Training Pipeline
    - Optimizes model parameters against verifiable outcomes for calibrated decision probabilities
    - Reinforcement learning infrastructure and curated decision-calibration datasets
    - Training distribution bias toward vendor-selected workflows and reference models
  - - API Gateway & Ingestion
    - Manages auth, rate-limiting (250k tokens/sec), schema validation, and payload routing
    - Cloud hosting infrastructure on US West Coast
    - Single-region concentration introduces cross-region latency overhead for global enterprise clients
  - - SDK & Integration Layer
    - Exposes typed Python/TypeScript bindings and agent middlewares (Vercel, LangChain)
    - Client runtime environments and gateway compatibility
    - Lack of OpenAI chat-completions API format compatibility requires dedicated integration code
