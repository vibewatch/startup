      - number: '1.3'
        title: Financing History, Mega-Round Valuation, and Stakeholders
        blocks:
          - type: paragraph
            body: >-
              TypeSafe AI's capital formation represents one of the most compressed valuation trajectories in recent
              venture history. The company spent two years self-funded in stealth before announcing a $40 million seed
              funding round led by deep tech venture firm DCVC in September 2026 at a reported valuation of $200
              million. Merely three weeks later on October 9, 2026, the company announced an $870 million Series A
              financing led by Andreessen Horowitz at a disclosed $7.5 billion valuation, with participation from
              Sequoia Capital, existing seed backer DCVC, and private angel investors. Total disclosed equity capital
              reached $910 million within one month of stealth emergence. This 37.5-fold valuation step-up underscores
              extraordinary investor conviction in non-chat intelligence infrastructure, yet neither the company nor its
              lead investors have clarified whether the $7.5 billion figure represents pre-money or post-money
              valuation, creating ambiguity around final capitalization structure and founder dilution.
