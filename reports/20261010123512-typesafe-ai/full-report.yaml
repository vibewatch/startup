        title: Exhibits
        blocks:
          - type: callout
            title: The Jevons Paradox in software economics
            body: >-
              By reducing decision costs by over 90% and eliminating output token fees, TypeSafe AI transforms model
              inference from an expensive bottleneck into a lightweight infrastructure primitive that developers call
              liberally across high-frequency execution loops.
            calloutType: insight
            claimRefs:
