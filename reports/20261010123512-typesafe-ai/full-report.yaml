      - number: '4.2'
        title: Cost Structure & Unit Economics
        blocks:
          - type: paragraph
            body: >-
              The core unit economics of Jev depend on inference efficiency and latency advantages relative to
              general-purpose frontier language models. Because Jev is optimized strictly for narrow decision evaluation
              rather than next-token autoregressive generation, community benchmarks document decision latencies between
              70 and 500 milliseconds, with typical individual calls costing a fraction of a cent. In production routing
              configurations, developers have measured median operating cost reductions of approximately 30x compared to
              frontier LLM deployments, with specialized workloads demonstrating cost advantages exceeding 70x. However,
              realized enterprise gross margins remain an unverified private metric. While pure software API delivery
              historically targets gross margins above 70%, inference hosting costs on dedicated GPU clusters can
              compress margins if customer token volume does not scale efficiently. Furthermore, claims of
              sub-100-millisecond latency and dramatic cost reductions remain vendor-provided figures that lack formal
              third-party audit verification.
