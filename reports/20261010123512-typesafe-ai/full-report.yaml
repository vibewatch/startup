      - number: '5.3'
        title: Platform Infrastructure, Integrations, and Operating Limits
        blocks:
          - type: paragraph
            body: >-
              TypeSafe AI delivers Jev through a managed cloud architecture centered on a single REST endpoint (POST
              /v1/systemone) supported by official client libraries in Python and TypeScript. The API enforces strict
              operational constraints, supporting a 64,000-token aggregate context window (capped at 32,000 tokens for
              any single question) and default rate limits of approximately 250,000 tokens per second and 1,200 requests
              per minute. Ecosystem adoption materialized rapidly following the September 2026 launch: Vercel integrated
              Jev into its AI Gateway on day two, capturing nearly 13% of paid team traffic within 24 hours, while
              orchestration frameworks such as LangChain deployed dedicated classifier wrappers. Early production
              architectures deploy Jev primarily as a low-latency decision gate: high-confidence classifications
              auto-execute immediately, while ambiguous or low-confidence outputs escalate to human operators or
              downstream reasoning models. However, the service remains confined to hosted early access behind a
              commercial waitlist. TypeSafe has not published model weights, disclosed parameter counts, or provided
              self-hosting mechanisms, concentrating operational dependencies within its proprietary cloud plane.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
