chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Founding, and Core Architecture
        blocks:
          - type: paragraph
            body: >-
              TypeSafe AI is an artificial intelligence systems lab headquartered in San Francisco, California,
              established in 2024 to pioneer machine-native intelligence for software automation. Founded by former
              OpenAI researcher Diogo Almeida alongside Erik Gafni and Sasha Sheng, the company was built on the thesis
              that while large language models trained via reinforcement learning from human feedback excel at
              conversational interaction, they introduce severe non-determinism, latency, and parsing overhead when
              embedded inside automated software architectures. In response, TypeSafe developed Jev, its flagship System
              One decision model trained using Reinforcement Learning for Calibrated Decisions. Rather than outputting
              conversational natural language strings, Jev accepts structured questions and returns schema-constrained
              typed decisions alongside calibrated confidence probabilities. Commercial access is structured around
              ultra-low pricing of $42 per billion input tokens with zero charge for output tokens, aiming to enable
              software applications to execute high-frequency semantic evaluations at latencies below 100 milliseconds.
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO006
