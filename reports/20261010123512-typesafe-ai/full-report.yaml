        title: Exhibits
        blocks:
          - type: callout
            title: Structural Type Safety and Parallel Evaluation
            body: >-
              By constraining outputs to predefined schemas and evaluating questions in parallel, Jev eliminates
              token-by-token parsing failures and delivers sub-100ms response times for structured software decisions.
            calloutType: strength
            claimRefs:
              - CE003
