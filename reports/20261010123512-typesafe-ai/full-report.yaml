            title: Closed-Source Hosting and Arithmetic Jaggedness
            body: >-
              Jev exhibits jagged capability on arithmetic and date comparisons, and its closed-source deployment model
              leaves enterprise adopters exposed to single-vendor availability and unverified pricing sustainability.
            calloutType: risk
