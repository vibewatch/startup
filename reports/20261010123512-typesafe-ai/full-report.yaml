      - number: '6.4'
        title: Customer Durability, Retention Gaps, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Despite remarkable top-of-funnel velocity, significant diligence gaps surround customer retention and the
              long-term durability of TypeSafe AI's revenue base. First, disclosures regarding enterprise adoption
              exhibit material variance: TypeSafe AI reported that one-third of Fortune 500 corporations use Jev,
              whereas lead investor Andreessen Horowitz cited 25% of Fortune 500 enterprises. Crucially, neither
              disclosure clarifies whether these engagements represent enterprise-wide master services agreements or
              uncontracted developer experimentation. Second, independent technical benchmarks reveal operational
              limitations, including elevated calibration errors on complex public classification suites like Banking77
              and performance degradation when prompt state accumulates extraneous unstructured context. Furthermore,
              the absence of published net revenue retention (NRR), gross retention, or customer concentration metrics
              makes it impossible to verify whether early developer enthusiasm translates into sticky, high-retention
              annual recurring revenue.
            claimRefs:
