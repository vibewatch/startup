        title: Leadership Roster, Founder-Market Fit, and Governance
        blocks:
          - type: paragraph
            body: >-
              The leadership team combines deep frontier model research experience with infrastructure systems
              engineering. Chief Executive Officer Diogo Almeida spent four years at OpenAI directly contributing to
              reinforcement learning from human feedback, InstructGPT, and early ChatGPT developments before departing
              to initiate TypeSafe AI's contrarian machine-native research path. Co-founders Erik Gafni and Sasha Sheng
              lead core infrastructure and model systems, establishing a tightly knit technical founding triumvirate.
              Because Almeida personifies the core research philosophy of calibrated decision modeling and acts as the
              public champion of the company's thesis, TypeSafe AI exhibits substantial key-person dependence. External
              governance expanded meaningfully following the Series A financing round in October 2026, when Andreessen
              Horowitz General Partner Martin Casado joined the company's board of directors, providing seasoned
              enterprise scaling and networking infrastructure expertise to balance the founding team's pure research
              pedigree.
