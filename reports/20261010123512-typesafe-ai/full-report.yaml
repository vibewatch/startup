  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Buyer Profiles
        blocks:
          - type: paragraph
            body: >-
              TypeSafe AI targets software engineering teams and enterprise technology organizations that process
              high-frequency automated decision tasks. Unlike conversational artificial intelligence platforms that
              optimize for natural human dialogue, the Jev model is architected specifically for machine-to-machine
              interactions where software requires discrete, typed outputs. The initial customer base divides into four
              functional segments: developer platforms integrating automated routing into cloud gateways, internet
              marketplaces running continuous content and candidate screening, enterprise automation teams managing
              back-office data extraction, and autonomous agent builders seeking low-latency tactical control. Early
              commercial momentum has centered on engineering leaders looking to bypass expensive reasoning models for
              deterministic classification steps.
            claimRefs:
              - CU001
              - CU012
              - CU013
