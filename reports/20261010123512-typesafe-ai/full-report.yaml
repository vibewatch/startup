        title: Exit Readiness, Diligence Asks, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Given its early operating stage, TypeSafe AI has no near-term path to public markets and must rely on
              private liquidity or long-term consolidation. Before considering an investment in subsequent financing
              tranches, diligence must demand: (1) audited annual recurring revenue broken down by contracted versus
              pay-as-you-go developer usage; (2) cohort-level net revenue retention metrics; (3) gross margin accounting
              incorporating dedicated GPU inference infrastructure; and (4) the Delaware certificate of incorporation
              specifying Series A liquidation preferences. Negative thesis-break triggers that would prompt an Avoid
              stance include frontier model providers releasing sub-50ms native decision APIs, monthly cash burn
              accelerating beyond $25 million without proportional enterprise contract growth, or customer churn
              following promotional credit exhaustion.
