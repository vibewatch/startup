  - id: TV003
    title: 'Scenario Matrix: Bull, Base, and Bear Case Projections'
    columns:
      - Scenario
      - 3-Year Operating Assumptions
      - Implied Valuation Logic
      - Key Vulnerabilities
      - Probability Weight
    rows:
      - - Bull Case
        - >-
          Jev becomes the default decision layer for agentic software; ARR scales to $500M+ with 80% gross margins and
          140% NRR across Fortune 500.
        - $25B - $35B exit via IPO or strategic acquisition at 50x-70x recurring revenue multiple.
        - Requires complete platform defense against hyperscaler model commoditization.
        - 20%
      - - Base Case
        - >-
          Strong developer utility for classification and routing; ARR reaches $120M - $180M, but faces intense
          competition from small open-weight models.
        - $8B - $12B valuation reflecting modest 1.1x - 1.6x appreciation over Series A entry price.
        - Multiple compression as AI infrastructure multiples normalize toward 30x - 40x ARR.
        - 50%
      - - Bear Case
        - >-
          Enterprise conversion stalls; major model vendors bundle calibrated classification; ARR remains below $40M
          with heavy compute burn.
        - $1.5B - $2.5B down-round restructuring or distressed acquisition; severe common equity dilution.
        - High liquidation preference overhang from $870M Series A capital stack.
        - 30%
      - - Downside Floor
        - >-
          Total commercial failure or catastrophic model defect; enterprise workloads repatriate to internal rules
          engines and fine-tuned open weights.
        - Cash liquidation value of remaining treasury ($400M - $600M net of accrued compute commitments).
        - Complete loss of equity value junior to preferred liquidation preference stack.
        - Tail Risk
    notes: 3-to-5 year exit scenario analysis based on enterprise adoption, multiple compression, and platform defense.
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV007
      - CV008
      - CV014
