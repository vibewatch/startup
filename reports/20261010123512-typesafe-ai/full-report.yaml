      - number: '7.4'
        title: Platform Dependencies, Capital Intensity, and Execution Headwinds
        blocks:
          - type: paragraph
            body: >-
              TypeSafe AI's operational trajectory is shaped by substantial capital intensity and platform dependency
              risks. The startup's $40 million seed financing at a $200 million post-money valuation establishes
              elevated performance benchmarks prior to commercial revenue maturity. Frontier model training and
              real-time low-latency serving necessitate significant compute expenditure, exposing the business to cloud
              infrastructure costs and GPU cluster availability constraints. Furthermore, TypeSafe AI's developer
              adoption heavily leverages third-party distribution gateways such as Vercel AI Gateway and OpenRouter,
              creating channel concentration risks should platform routing policies or fee structures shift. Finally,
              maintaining an exclusively in-person research team in San Francisco near Embarcadero station creates
              persistent recruiting friction against heavily capitalized frontier labs competing for specialized AI
              systems talent.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
