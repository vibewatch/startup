  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Operational Reliability and Model Failure Modes
        blocks:
          - type: paragraph
            body: >-
              TypeSafe AI positions its System One architecture around deterministic output schemas and calibrated
              probabilities, claiming that replacing chat-based generative sampling with Reinforcement Learning for
              Calibrated Decisions eliminates hallucinations. However, third-party evaluations reveal a stark divergence
              between schema compliance and factual accuracy. On public evaluation suites such as the Banking77
              benchmark, Jev exhibited an expected calibration error of 0.246 and declined forced-uncertainty questions
              only 49.7% of the time, compared to 97.3% to 100% for frontier large language models. While Jev guarantees
              that outputs conform strictly to predetermined enum choices, scores, or boolean probabilities, a
              structurally valid response can remain factually incorrect. In high-throughput enterprise pipelines,
              uncalibrated confidence scores risk accelerating automated misrouting or erroneous transaction approvals
              at machine speed. Operational durability requires explicit auto-action thresholds and human-in-the-loop
              review queues rather than treating raw model confidence as self-verifying policy.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR014
              - CR015
