      - number: '6.3'
        title: Named Customer Proof Points and Production Outcomes
        blocks:
          - type: paragraph
            body: >-
              Concrete production deployments illustrate the economic thesis behind TypeSafe AI's System One
              architecture. Talent marketplace platform Jack & Jill replaced Gemini 3.1 Flash Lite with Jev for 100% of
              candidate-matching screening calls within 10 days of testing, slashing unit evaluation costs by 88% from
              $0.755 to $0.092 per thousand candidates while halving median screening time from 20.3 seconds to 10.3
              seconds without sacrificing ranking quality. In content moderation, events platform NearHere reported
              achieving 96% accuracy with Jev compared to 86% for Gemini Flash-Lite at 58-times lower cost per
              evaluation. Similarly, open-source agent frameworks including Browser Use and Vercel Eve have adopted Jev
              for tactical action selection and tool-approval gating. These customer deployments validate that where
              workflows can be structured into discrete categorical choices or calibrated probabilities, specialized
              decision models offer substantial throughput and operational cost advantages over general-purpose
              generative models.
            claimRefs:
              - CU001
              - CU004
