        title: Financing Context, Entry Valuation, and Capital Structure
        blocks:
          - type: paragraph
            body: >-
              TypeSafe AI's capital velocity is historic, raising roughly $910 million across its seed and Series A
              rounds in under thirty days. The company emerged from stealth on September 15, 2026 with a $40 million
              seed round led by DCVC at a reported $200 million valuation, followed on October 9, 2026 by an $870
              million Series A led by Andreessen Horowitz with Sequoia Capital and DCVC. However, neither the company
