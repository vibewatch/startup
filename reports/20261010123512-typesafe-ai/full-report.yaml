        title: Exhibits
        blocks:
          - type: callout
            title: Commoditization Threat from Open-Source Architecture Copies
            body: >-
              Because Jev's System 1 paradigm relies on schema-constrained classification rather than conversational
              pretraining, open-source reproductions emerged within days of launch, challenging TypeSafe's long-term
              proprietary pricing power.
            calloutType: risk
            claimRefs:
              - CP004
              - CP013
          - type: callout
            title: The Division of Labor in Enterprise AI Stacks
            body: >-
              Jev does not compete directly for the primary enterprise model contract; instead, it establishes an
              efficiency layer that handles high-volume micro-decisions while routing complex reasoning to frontier LLMs
              and deterministic workflows to code.
            calloutType: insight
            claimRefs:
              - CP002
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model & Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              TypeSafe AI has structured its commercial go-to-market around a developer-first, usage-metered API model.
              Rather than following conversational chatbot pricing conventions that charge premium rates for generated
              text, TypeSafe charges exclusively for input context at $42 per billion tokens, equivalent to $0.042 per
              million tokens, while providing output decisions at zero additional charge. This pricing strategy reflects
              the architectural purpose of Jev as a System One decision model designed to evaluate structured state and
              return discrete classifications, rankings, or probability scores directly into production software. By
              eliminating output token billing, the company directly targets developers currently spending substantial
              sums on multi-step generative LLM calls where the vast majority of generated output tokens are discarded.
              Public traction metrics indicate rapid initial adoption, with the company reporting over one trillion
              input tokens processed daily within one week of its September 2026 public launch, driven by automated
              backend systems executing continuous API calls.
            claimRefs:
