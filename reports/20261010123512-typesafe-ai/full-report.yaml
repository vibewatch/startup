        title: Operating Scale, Milestone Timeline, and Independent Evaluation
        blocks:
          - type: paragraph
            body: >-
              TypeSafe AI operates from San Francisco with an employee band tracked by industry databases at 51 to 100
              personnel as of October 2026. While the company's public launch sparked immediate industry discussion
              regarding alternatives to large language models and prompted numerous copycat implementations, its rapid
              rise has attracted critical scrutiny. Marketing statements by TypeSafe and its investors assert that
              between 25% and roughly one-third of Fortune 500 enterprises have integrated Jev; however, no named
