      - number: '5.2'
        title: Inference Performance, Latency, and Economic Realities
        blocks:
          - type: paragraph
            body: >-
              Inference economics and execution latency form the core value proposition of TypeSafe AI's System One
              architecture. In vendor benchmark evaluations across four production workflow graphs—including security
              incident triage, agent observability, invoice processing, and customer support routing—TypeSafe claims Jev
              achieves an end-to-end latency of 70 to 500 milliseconds and an input token cost of $0.042 per million
              tokens ($42 per billion tokens), with unmetered output decisions. The vendor highlights performance gains
              of up to 193.6x faster execution and 444.6x lower cost compared to multi-step frontier LLM workflows.
              However, rigorous third-party analysis reveals that headline multiples represent the extreme upper bound
              of benchmark advantages. Independent telemetry across launch deployments indicates a real-world median
              latency of approximately 76 milliseconds and an effective cost reduction of roughly 30x over traditional
              models. Furthermore, TypeSafe's published evaluation suite demonstrates that while Jev ties Sonnet 5 in
              workflow accuracy at 67.8%, it trails top-tier frontier models like Sol (74.1%) and Opus 5 (73.1%) on raw
              task precision. Crucially, company leadership explicitly concedes that the long-term economic
              sustainability of its aggressive $0.042/MTok token pricing cannot yet be established as unsubsidized.
            claimRefs:
              - CE005
              - CE006
              - CE009
              - CE014
