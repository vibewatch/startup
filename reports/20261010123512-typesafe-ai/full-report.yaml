      - number: '4.4'
        title: Financial Verdict & Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              From an investment diligence standpoint, TypeSafe AI presents an innovative monetization mechanism paired
              with significant underwriting ambiguity. The developer-friendly pricing model of $0.042 per million input
              tokens addresses a clear pain point in enterprise software automation, and early developer enthusiasm
              indicates strong initial product curiosity. Nevertheless, institutional underwriting cannot treat
              launch-week API traffic as equivalent to high-retention annual recurring revenue. The key diligence
              blockers include the lack of disclosed enterprise contract terms, absence of audited gross margins, and
              unknown customer concentration. Moreover, because developers can theoretically recreate specialized
              classification logic in application code, TypeSafe must demonstrate that its ongoing model calibration and
              latency advantages justify recurring vendor spend over internal alternatives before high valuations can be
              rationalized.
            claimRefs:
