  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Workload Scope, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The emergence of machine-native intelligence represents a structural bifurcation in enterprise software
              architecture. Rather than treating all cognitive tasks as open-ended conversational generation, the market
              is fragmenting into generative System Two layers and structured System One decision infrastructure.
              TypeSafe AI targets the latter through its proprietary Jev model, which ingests raw application state and
              evaluates pre-declared typed questions—returning calibrated probabilities, choices, and rubric scores
              rather than text. The market boundary for this category is strictly bounded: it encompasses deterministic
              routing, real-time ticket categorization, automated underwriting checks, policy guardrails, and model
              router dispatching. Conversely, it explicitly excludes conversational authoring, code generation,
              long-form document summarization, and human-facing dialogue. The immediate status-quo substitutes are
              twofold: brittle deterministic regex and heuristic rules engines on one side, and general-purpose frontier
              LLMs executing slow, expensive structured-output calls on the other. By replacing multi-second sequential
              token generation with parallel evaluation completed in sub-hundred millisecond latencies, System One
              decision infrastructure establishes a distinct software category between application code and foundational
              model APIs.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Addressable Market Sizing and Price-Deflation Lenses
        blocks:
          - type: paragraph
            body: >-
              Sizing the addressable market for machine-native decision models requires decomposing broad enterprise
              automation expenditure through multiple analytical lenses. At the top of the funnel, global spending on
              enterprise cloud software, cognitive infrastructure, and business workflow automation exceeds $65 billion
              annually. Within that universe, the serviceable addressable market (SAM) for intermediate AI
              infrastructure—encompassing middleware, agent orchestration, model routing, and verification—is estimated
              at $4.8 billion to $14 billion. However, traditional market sizing heuristics fail to capture the severe
              price-deflation dynamics introduced by TypeSafe AI's pricing model. At $42 per billion input tokens
              ($0.042 per million), Jev's unit economics are over two hundred times lower than frontier generative
              models. Consequently, capturing $100 million in software Annual Recurring Revenue requires processing over
              2.3 trillion input tokens across production pipelines. While this radical cost reduction expands the
              volume of economically viable automation checks by orders of magnitude—a classic manifestation of the
              Jevons paradox—near-term serviceable obtainable market (SOM) capture remains tightly constrained until
              enterprise customers integrate decision APIs into mission-critical, high-frequency transaction workflows.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM012
              - CM013
