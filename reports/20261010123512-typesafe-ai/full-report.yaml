      - number: '7.2'
        title: Security Vulnerabilities and Adversarial Attack Surfaces
        blocks:
          - type: paragraph
            body: >-
              Embedding typed decision models into agentic execution harnesses introduces specialized security
              vulnerabilities. Because Jev assesses unstructured program state to produce immediate tool-routing or
              permission verdicts, adversarial input text engineered to manipulate classification boundaries can induce
              severe tool-misuse failures. Technical analyses from integration partners like LangChain emphasize that
              autonomous agents remain inherently vulnerable to malicious or indirect prompt injections. Without
              defensive middleware such as AutoModeMiddleware to intercept hazardous tool calls, an attacker can steer
              an agent into executing destructive operations like unauthorized file deletion or data exfiltration.
              Furthermore, context bloat and adversarial prompt stuffing degrade classification accuracy, demonstrating
              that input sanitization and strict token boundaries must be enforced upstream of model invocation.
            claimRefs:
              - CR005
              - CR006
              - CR008
      - number: '7.3'
        title: Regulatory, Legal, and Intellectual Property Exposures
        blocks:
          - type: paragraph
            body: >-
              TypeSafe AI faces structural intellectual property and regulatory compliance challenges. The company's
              launch of Jev in September 2026 immediately catalyzed open-source copycats and competing decision engines
              within weeks, underscoring the fragility of algorithmic differentiation in the absence of broad patent
              barriers. While public litigation records confirm no pending IP disputes, regulatory actions, or security
              breaches to date, emerging global frameworks governing automated decisions—including the European Union AI
              Act and state-level automated decision system rules—impose stringent governance, explainability, and
              auditing requirements. Because System One models produce categorical verdicts without explanatory text
              rationales, enterprise adopters must maintain external decision logs, audit trails, and human override
              mechanisms to meet statutory compliance standards.
            claimRefs:
              - CR007
              - CR009
          - type: table
            tableRef: TR001
