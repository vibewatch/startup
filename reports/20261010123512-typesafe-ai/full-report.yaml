  - id: FE001
    title: Product architecture map
    type: stack
    summary: Six-layer architectural stack from client application integrations down to hosted GPU compute.
    data:
      layers:
        - label: Application & Client Layer
          detail: Client applications, TypeScript and Python SDKs, Vercel AI Gateway, and LangChain middleware
        - label: API Gateway & Ingestion Layer
          detail: REST endpoint (/v1/systemone) managing authentication, 64k token context window, and rate limiting
        - label: Parallel Sampling Engine
          detail: Hardware-aware sampler generating output probabilities for up to 255 options simultaneously in a single pass
        - label: System One Model Core (Jev)
          detail: Transformer-based decision engine trained via RLCD for calibrated confidence and zero type errors
        - label: Decision Calibration & Scoring Runtime
          detail: Computes Choice, Score, and Noul probability distributions and confidence scores for downstream thresholding
        - label: Infrastructure & Compute Plane
          detail: Hosted GPU compute cluster optimized for low-latency parallel inference with sub-100ms response times
    approximationNotes: Architectural layering abstracted from developer documentation and vendor technical disclosures.
