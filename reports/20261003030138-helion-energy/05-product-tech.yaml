callouts:
  - calloutType: "insight"
    title: "The Physics Advantage and Engineering Burden of Faraday Direct Conversion"
    body: "Helion's direct electromagnetic recapture avoids the 60% thermodynamic losses inherent in steam turbine Rankine cycles, fundamentally lowering plant capital cost and water consumption. However, this architectural choice shifts the entire engineering burden onto power electronics: capacitors and solid-state switches must absorb gigawatt-scale pulses every second without electrical breakdown."
    claimRefs:
      - "CE004"
      - "CE005"
      - "CE013"
  - calloutType: "risk"
    title: "The Helium-3 Fuel Breeding Dilemma"
    body: "Burning deuterium and helium-3 solves the neutron damage challenge of D-T fusion, but helium-3 is virtually non-existent in commercial quantities. While Helion's patent demonstrates that D-D side reactions produce tritium that beta-decays into helium-3, the 12.32-year half-life creates an acute fuel lag. Early commercial plants must procure rare seed inventories or accept lower efficiency while breeding their own fuel."
    claimRefs:
      - "CE007"
      - "CE008"
      - "CE009"
