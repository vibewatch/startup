  - id: "prototype-evolution-and-manufacturing-scaling"
    title: "Prototype Progression and Industrial Scale-Up"
    body: |
      Helion's commercialization path relies on rapid iterative prototyping across eight machine generations, supported by parallel subsystem testbeds rather than monolithic mega-facilities. Earlier prototypes demonstrated essential physics: the Inductive Plasmoid Accelerator (IPA) validated supersonic FRC merging; Grande (2014) validated 4-tesla compression and 95% Faraday energy recovery over 1 million pulses; Venti (2018) reached 7 tesla and multi-keV D-D neutron production; and Trenta (2020–2021) demonstrated sustained operation over 10,000 pulses, reaching 100 million degrees Celsius (9 keV) and magnetic compression exceeding 8 tesla. To de-risk Polaris and future plants without halting core operations, Helion deployed specialized subscale testbeds including Vela (which switched 11 GJ of energy at 1 Hz through simulated compression magnets), Polaris Junior Formation (2023–2025), and Tiny Merge for next-generation magnet and plasma dynamics.

      The seventh-generation machine, Polaris, completed construction in Everett, Washington, in late 2024 and is currently operating to demonstrate net electricity gain—the milestone where recovered electricity exceeds electrical input per pulse. In February 2026, Polaris demonstrated measurable D-T fusion reactions and achieved record plasma temperatures of 150 million degrees Celsius. In parallel, Helion has initiated construction on Orion, a 50-MWe commercial pilot power plant located in Malaga, Chelan County, Washington, designed to supply clean baseload power to Microsoft data centers under a 2028 commercial power purchase agreement. Achieving commercial operations requires industrial mass manufacturing: Helion is scaling in-house production of solid-state high-voltage switching modules and energy-storage capacitors from 10 MJ to 100,000 MJ annually, while navigating deterministic industrial network architectures (EtherCAT, PTP/NTP) to synchronize thousands of pulsed power elements within microsecond tolerances.
