callouts:
  - calloutType: "risk"
    title: "Commercial proof precedes operating proof"
    body: >-
      Microsoft and Nucor validate buyer interest, but both relationships depend on
      future plants. Scientific American reported no published confirmation of net
      power from Polaris as of May 2026, so the first customer obligation remains
      exposed to a technical milestone that the retained evidence does not show as
      completed.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU005"
  - calloutType: "insight"
    title: "Nucor combines strategic and customer relationships"
    body: >-
      Helion's 2025 release lists Nucor as a returning investor while also describing
      the 500 MW customer-development agreement. That alignment may support long-horizon
      collaboration, but it is not independent proof of deployment success or customer
      economics.
    claimRefs:
      - "CU002"
      - "CU014"
