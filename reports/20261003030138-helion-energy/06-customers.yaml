  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "retention-and-durability"
      missingEvidence: >-
        Contract duration, renewal rights, termination rights, customer satisfaction,
        NRR, GRR, churn, and cohort evidence for commercial counterparties.
      whyItMatters: >-
        Without durability evidence, signed future-delivery commitments cannot be
        translated into recurring demand or customer lifetime value.
      diligencePath: >-
        Review executed customer contracts and management's customer-level retention,
        renewal, and satisfaction reporting in a confidential data room.
      relatedQuestionRefs:
        - "QU005"
    - type: "enumeration-incomplete"
      severity: "material"
      topic: "named-customer-proof"
      missingEvidence: >-
        A complete roster of signed customers, prospects, pilots, contract status,
        proposed capacity, and counterparties that have terminated or paused work.
      whyItMatters: >-
        Public sources name only a small set of relationships, preventing reliable
        measurement of customer concentration and pipeline conversion.
      diligencePath: >-
        Obtain the customer and pipeline register, then reconcile each entry to signed
        agreements, board materials, and counterparty confirmations.
      relatedQuestionRefs:
        - "QU006"
      relatedTableRefs:
        - "TU003"
    - type: "conflicting-data"
      severity: "material"
      topic: "microsoft-delivery-date"
      missingEvidence: >-
        The executed Microsoft PPA schedule defining plant opening, first delivery,
        ramp-up, acceptance testing, and any distinction between 2028 and 2029.
      whyItMatters: >-
        Public sources differ on the delivery year, so timing exposure and milestone
        performance cannot be assessed reliably.
      diligencePath: >-
        Inspect the executed PPA milestone schedule and confirm dates directly with
        Microsoft and the power marketer.
      relatedQuestionRefs:
        - "QU003"
      relatedTableRefs:
        - "TU002"
        - "TU003"
    - type: "private-evidence-only"
      severity: "material"
      topic: "customer-economics-and-concentration"
      missingEvidence: >-
        Contract pricing, minimum take obligations, remedies, cancellation rights,
        deposits, customer revenue share, and concentration by committed value.
      whyItMatters: >-
        Proposed megawatts do not reveal revenue quality, downside exposure, cash
        receipts, or dependence on any single counterparty.
      diligencePath: >-
        Review full contract economics and a customer concentration schedule, with
        counterparty confirmation of material terms.
      relatedQuestionRefs:
        - "QU006"
