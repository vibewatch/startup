company:
  name: "Helion Energy"
chapter:
  number: 6
  title: "Customers"
  summary: >-
    Helion's customer evidence consists of future-delivery commitments rather than
    operating adoption: Microsoft is tied to a 50 MW power purchase agreement and
    Nucor to a 500 MW development agreement, while delivery, retention, revenue
    concentration, and realized customer outcomes remain unverified.
sections:
  - id: "buyers-users-and-commercial-surfaces"
    title: "Buyers, users, and commercial surfaces"
    body: >-
      Helion's disclosed commercial surface is narrow and enterprise-led. Microsoft
      is the clearest prospective buyer, with a 50 MW power purchase agreement tied
      to data-center electricity; Nucor is the second named customer, through a
      500 MW plant-development agreement for an industrial use case [CU001, CU002,
      CU003]. Nuclear Engineering International also identifies Constellation Energy
      as power marketer for the Microsoft arrangement, showing that delivery depends
      on a channel and grid interface as well as the end buyer [CU013]. OpenAI is
      described only as an explored purchasing partnership, not a signed customer
      agreement [CU015]. The evidence therefore supports hyperscale data centers and
      energy-intensive industry as target segments, but not a broad installed base,
      active utilization, or a quantified customer count.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU013"
      - "CU015"
    tableRefs:
      - "TU001"
  - id: "adoption-is-milestone-based"
    title: "Adoption is milestone-based, not usage-based"
    body: >-
      Public adoption evidence is a sequence of commitments and delivery-enabling
      milestones rather than consumed megawatt-hours. KING 5 reported in 2021 that
      Helion's chief executive declined to specify when electricity production would
      begin [CU016]. The company disclosed the Microsoft and Nucor agreements in
      2023, raised a Series F in 2025 for commercialization work, and by 2026 had
      expanded to 800 employees while construction advanced at Orion [CU001, CU002,
      CU008, CU009, CU012]. A third-party industry source reported two Washington
      state licenses that cleared continued construction [CU010]. These are material
      procurement and execution signals, but none is evidence of delivered fusion
      electricity, repeat purchase, plant utilization, customer satisfaction, or
      realized customer economics.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU012"
      - "CU016"
    tableRefs:
      - "TU002"
  - id: "named-proof-and-delivery-risk"
    title: "Named proof is contractual and pre-production"
    body: >-
      The Microsoft agreement is the strongest customer proof because multiple
      independent sources corroborate its scale and intended data-center use
      [CU001, CU003]. It is still pre-production proof. Scientific American reports
      that Helion planned to open Orion in 2028 and supply 50 MW in 2029, in tension
      with company and other third-party descriptions of delivery beginning in 2028
      [CU004]. The same source states that no published results had confirmed net
      power generation from Polaris as of May 2026 [CU005]. Nucor's agreement adds
      industrial validation and a larger proposed plant, but it remains a development
      arrangement for the 2030s, not an operating deployment [CU002]. OpenAI remains
      exploratory [CU015]. No retained evidence reports production consumption or
      customer outcomes for any named counterparty.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU015"
    tableRefs:
      - "TU003"
  - id: "durability-expansion-and-concentration"
    title: "Durability, expansion, and concentration"
    body: >-
      Retention cannot be evaluated with conventional measures because the retained
      evidence discloses no NRR, GRR, renewal, churn, cohort, satisfaction, contract
      pricing, or delivered-volume history. Expansion is visible only as a pipeline:
      Microsoft establishes the first 50 MW obligation, Nucor extends the model into
      steel at 500 MW, and OpenAI represents a possible additional buyer [CU001,
      CU002, CU015]. The official value proposition is continuous grid power, while
      the operating model relies on standardized in-house components and rigorous
      hardware execution [CU006, CU007, CU011]. Those features could support repeat
      plant deployment, but they do not demonstrate retention. Until contractual
      economics and a fuller customer roster are disclosed, customer concentration
      and the financial consequence of a delayed first delivery remain material
      diligence gaps.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU006"
      - "CU007"
      - "CU011"
      - "CU015"
    figureRefs:
      - "FU001"
