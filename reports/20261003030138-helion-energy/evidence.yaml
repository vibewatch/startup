evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: A current authoritative executive and board roster, committee structure, voting-control map, and succession plan.
    whyItMatters: Founder and board concentration determine key-person, conflict, oversight, and continuity risk.
    diligencePath: Request the charter, bylaws, board minutes, director list, committee mandates, and management succession plan.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: cover-metrics
    missingEvidence: >-
      Audited revenue, revenue run-rate, cash, debt, burn, runway, active-customer count, and a complete facilities
      inventory.
    whyItMatters: >-
      Funding raised is not cash available, commercial agreements are not revenue, and named counterparties do not
      establish customer count.
    diligencePath: >-
      Obtain audited financial statements, bank and debt schedules, monthly cash reporting, contract billing records,
      and a site register.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: capitalization
    missingEvidence: >-
      The complete capitalization table, investor ownership, liquidation preferences, board rights, side letters,
      secondaries, and debt or credit facilities.
    whyItMatters: >-
      Named financing participants do not reveal control, preference seniority, dilution, or effective economic
      ownership.
    diligencePath: >-
      Request the fully diluted cap table, financing documents, side letters, equity transfer ledger, and debt
      agreements.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: net-electricity
    missingEvidence: >-
      Independent, reviewable measurements of net electricity, pulse repetition, availability, component life, and
      system-level energy accounting.
    whyItMatters: Temperature and fusion reactions do not establish a repeatable, dispatchable, economically viable power plant.
    diligencePath: >-
      Commission an independent technical review of raw Polaris diagnostics, input-output boundaries, calibration, pulse
      logs, and replication results.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Independent electricity-market spend by geography, firm clean-power premium, technically eligible sites, Helion
      price per MWh, plant capex, and repeatable annual deployment capacity.
    whyItMatters: >-
      Without compatible denominators, a dollar TAM, serviceable SAM, and deliverable SOM would be speculative and could
      overstate valuation.
    diligencePath: >-
      Obtain buyer procurement data, third-party power-market forecasts, contracted pricing, site-screening criteria,
      and a capacity deployment model reconciled to manufacturing and interconnection constraints.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Contract pricing, annual MWh, minimum-take terms, credit support, penalties, internal budget owners, approval
      thresholds, and renewal or termination rights for Microsoft, Nucor, and any OpenAI negotiation.
    whyItMatters: >-
      Named capacity cannot be converted into revenue, margin, adoption rate, or buyer willingness to pay without
      commercial terms.
    diligencePath: >-
      Review executed contracts and buyer procurement approvals, then interview energy-procurement owners and the named
      power marketer.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: delivery-timing
    missingEvidence: >-
      A reconciled contractual schedule distinguishing plant operational date, first electricity, ramp period, and full
      50 MW delivery.
    whyItMatters: >-
      Public sources reference both 2028 and 2029, changing time-to-revenue and the probability-weighted value of the
      first commercial plant.
    diligencePath: Inspect the Microsoft PPA milestone schedule and Orion construction and interconnection critical path.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: competitor-unit-economics
    missingEvidence: >-
      Audited capex per kilowatt and levelized cost of electricity (LCOE) projections for commercial-scale Helion plants
      versus CFS ARC tokamak and SMR fission facilities.
    whyItMatters: >-
      Without verified balance-of-plant capex and maintenance schedules, claims of economic superiority over
      conventional thermal cycles remain unverified.
    diligencePath: >-
      Request confidential engineering cost breakdown for the Orion 50 MW plant and comparative LCOE models prepared for
      Microsoft.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP002
  - type: missing-source
    severity: material
    topic: net-energy-gain-verification
    missingEvidence: >-
      Peer-reviewed experimental verification of net electrical energy gain (Q > 1) from Helion's Polaris prototype
      under sustained pulsing.
    whyItMatters: >-
      Net electricity generation is the binary scientific prerequisite for all commercial contracts and competitive
      differentiation against alternative power sources.
    diligencePath: Review third-party diagnostic logs and calorimetry data from Polaris pulse test runs scheduled through 2026-2027.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: contracting
    missingEvidence: >-
      Contractual price per megawatt-hour ($/MWh), indexation terms, and specific liquidated penalty payment schedules
      under the Microsoft PPA.
    whyItMatters: >-
      Without contract pricing and non-delivery penalty formulas, analysts cannot model realized cash flows, gross
      margins, or potential liability balances if plant delivery is delayed.
    diligencePath: >-
      Request confidential disclosure of the executed Microsoft PPA schedule and liquidated damages clauses under an
      investor non-disclosure agreement.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
  - type: missing-source
    severity: material
    topic: burn-rate
    missingEvidence: >-
      Audited financial statements detailing monthly cash burn, capital expenditures for Orion construction, and exact
      cash balances following the Series G close.
    whyItMatters: >-
      Headcount expansion to 800+ and parallel construction of Orion and Tiny Merge create large cash burn that dictates
      exact runway length and timing of the next capital raise.
    diligencePath: >-
      Review GAAP financial statements, balance sheets, and management cash flow forecasts during on-site financial due
      diligence.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: retention-and-durability
    missingEvidence: >-
      Contract duration, renewal rights, termination rights, customer satisfaction, NRR, GRR, churn, and cohort evidence
      for commercial counterparties.
    whyItMatters: >-
      Without durability evidence, signed future-delivery commitments cannot be translated into recurring demand or
      customer lifetime value.
    diligencePath: >-
      Review executed customer contracts and management's customer-level retention, renewal, and satisfaction reporting
      in a confidential data room.
    relatedQuestionRefs:
      - QU005
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      A complete roster of signed customers, prospects, pilots, contract status, proposed capacity, and counterparties
      that have terminated or paused work.
    whyItMatters: >-
      Public sources name only a small set of relationships, preventing reliable measurement of customer concentration
      and pipeline conversion.
    diligencePath: >-
      Obtain the customer and pipeline register, then reconcile each entry to signed agreements, board materials, and
      counterparty confirmations.
    relatedQuestionRefs:
      - QU006
    relatedTableRefs:
      - TU003
  - type: conflicting-data
    severity: material
    topic: microsoft-delivery-date
    missingEvidence: >-
      The executed Microsoft PPA schedule defining plant opening, first delivery, ramp-up, acceptance testing, and any
      distinction between 2028 and 2029.
    whyItMatters: >-
      Public sources differ on the delivery year, so timing exposure and milestone performance cannot be assessed
      reliably.
    diligencePath: Inspect the executed PPA milestone schedule and confirm dates directly with Microsoft and the power marketer.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU002
      - TU003
  - type: private-evidence-only
    severity: material
    topic: customer-economics-and-concentration
    missingEvidence: >-
      Contract pricing, minimum take obligations, remedies, cancellation rights, deposits, customer revenue share, and
      concentration by committed value.
    whyItMatters: >-
      Proposed megawatts do not reveal revenue quality, downside exposure, cash receipts, or dependence on any single
      counterparty.
    diligencePath: >-
      Review full contract economics and a customer concentration schedule, with counterparty confirmation of material
      terms.
    relatedQuestionRefs:
      - QU006
  - type: missing-source
    severity: material
    topic: regulatory-licensing-register
    missingEvidence: >-
      Multi-state nuclear regulatory approvals and NRC non-fission material licensing standards for post-Orion
      commercial fusion sites.
    whyItMatters: >-
      While Washington State granted materials licenses for Orion, multi-state commercial expansion (such as the 500 MW
      Nucor deployment) requires establishing interstate regulatory precedents.
    diligencePath: >-
      Review NRC Part 30/Part 20 rulemaking dockets and interstate compact agreements governing commercial fusion
      byproduct materials.
    relatedQuestionRefs:
      - QR005
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: commercial-penalties
    missingEvidence: Exact contractual liquidated damages and financial penalty terms per missed megawatt-hour in the Microsoft PPA.
    whyItMatters: >-
      Determines immediate cash burn and balance sheet liability if the Orion facility misses its 2028 operational
      delivery deadline.
    diligencePath: >-
      Request confidential contract disclosure of PPA penalty schedule, cure periods, and termination provisions under
      NDA.
    relatedQuestionRefs:
      - QR004
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: scientific-verification
    missingEvidence: >-
      Peer-reviewed diagnostic data and energy balance sheets detailing Polaris plasma density, temperature, and net
      gain.
    whyItMatters: >-
