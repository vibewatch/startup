chapter:
  number: 7
  title: "Risks"
  summary: "Helion Energy operates under unprecedented commercial timelines that compress fundamental plasma physics, precision manufacturing, and unproven regulatory regimes into a contractual 2028 delivery window. While early state licenses in Washington mitigate immediate facility permitting roadblocks and $1.5 billion in cumulative funding provides substantial liquidity, severe exposure persists across unvalidated net energy gain, scarce Helium-3 fuel breeding, single-customer penalty liabilities with Microsoft, and extreme technical opacity."
sections:
  - id: "technical-and-physics-risks"
    title: "Plasma Physics, Confinement, and Fuel Cycle Vulnerabilities"
    body: "Helion's pulsed magneto-inertial fusion architecture bypasses the steady-state confinement requirements of conventional tokamaks, but introduces acute, unvalidated physical risks at commercial scale. Although the seventh-generation Polaris prototype demonstrated 150 million degree Celsius plasma temperatures and initial deuterium-tritium reactions, Helion has not publicly confirmed net energy gain (Q > 1) from any device. The transition to the 50 MW Orion production facility requires simultaneous plasma stability, magnetic field compression exceeding 15 Tesla, and direct inductive recovery via Faraday coupling at an unprecedented 95 percent efficiency target. External critics and academic plasma physicists, notably former co-founder Dr. John Slough and research teams at the Max Planck Institute, contend that catastrophic magnetic flux loss during high-speed plasmoid merging and severe ion-electron thermal equilibration could prevent net power production under realistic multi-dimensional conditions. Furthermore, Helion's long-term commercial blueprint depends entirely on an aneutronic deuterium–helium-3 fuel cycle. Because terrestrial Helium-3 is virtually non-existent, Helion must successfully breed tritium from deuterium-deuterium side reactions and capture its radioactive decay product over a 12.32-year half-life. If side-reaction breeding yields prove insufficient or plasma heating requirements surpass 200 million degrees Celsius without adequate confinement, Helion cannot achieve its aneutronic low-neutron operating paradigm."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR006"
    tableRefs:
      - "TR002"
    figureRefs:
      - "FR001"
  - id: "commercial-and-counterparty-risks"
    title: "Offtake Concentration, PPA Penalty Structures, and Capital Intensity"
    body: "Helion's commercial credibility rests almost entirely on its May 2023 power purchase agreement with Microsoft for 50 megawatts of electricity delivery from the Orion facility by 2028. Unlike standard pre-revenue clean technology agreements, this contract incorporates explicit financial non-delivery penalties if electricity generation fails to materialize on schedule. With Constellation Energy acting as power marketer and transmission coordinator, any operational delay at Orion directly creates contractual liabilities and impairs enterprise valuation. While Helion has executed a secondary framework agreement with Nucor Corporation targeting a 500 MW deployment in the 2030s, exploratory multi-gigawatt power negotiations with OpenAI remain unfinalized and uncommitted. Commercial capital intensity remains severe despite Helion's $465 million Series G raise in June 2026, which valued the pre-revenue venture at $15.5 billion post-money. Total cumulative private fusion sector capital requirements are projected to reach $77 billion for commercial gigawatt deployment, leaving Helion dependent on periodic private market equity infusions until merchant power generation or PPA cash flows commence."
    claimRefs:
      - "CR007"
      - "CR008"
      - "CR009"
      - "CR010"
      - "CR011"
    tableRefs:
      - "TR003"
  - id: "regulatory-and-operational-risks"
    title: "Nuclear Licensing Frameworks, Supply Chains, and Technical Transparency"
    body: "On the regulatory front, Helion achieved a historic precedent on June 16, 2026, when the Washington State Department of Health issued a Radioactive Materials License and a Radioactive Air Emissions License for the Orion generator site in Chelan County. This confirms that state-level authorities regulate Helion's low-neutron pulsed system under materials licensing frameworks rather than traditional commercial fission reactor statutes under Nuclear Regulatory Commission Part 50/52. Nevertheless, operating with tritium inventory and high-voltage capacitor arrays requires ongoing regulatory compliance, and interstate expansion outside Washington State remains exposed to untested state-by-state licensing hurdles. Operationally, Helion's vertical integration strategy requires in-house serial manufacturing of specialized components, including thousands of high-voltage, oil-filled pulse capacitors filling 150 shipping containers, solid-state switches rated for hundreds of millions of pulses, and ultra-high-pressure ceramics. These specialized components cannot be sourced off-the-shelf from commercial utility supply chains. Compounding these engineering challenges is Helion's institutional secrecy; the company maintains a strict policy of withholding detailed plasma diagnostic data from peer-reviewed scientific journals, preventing independent verification of plasma stability and creating substantial narrative risk if milestones slip."
    claimRefs:
      - "CR012"
      - "CR013"
      - "CR014"
      - "CR015"
      - "CR016"
    tableRefs:
      - "TR001"
