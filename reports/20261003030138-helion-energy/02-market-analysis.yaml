company:
  name: Helion Energy
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Helion's evidenced commercial wedge is firm, carbon-free electricity for
    large data centers and energy-intensive industry, anchored by a 50 MW
    Microsoft PPA and a 500 MW Nucor development agreement. The assigned
    evidence does not support a defensible dollar TAM, SAM, or deliverable SOM,
    while independent reporting identifies net-power, plasma-stability, fuel,
    manufacturing, and schedule constraints that sharply limit how much of the
    demand signal should be capitalized today.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      Helion is not yet selling a general-purpose reactor, components, or
      securities into one coherent market. Its commercial market is the
      generation and sale of firm electricity from Helion-built fusion plants,
      initially through long-dated arrangements with large loads. The clearest
      target buyers are hyperscale data centers and energy-intensive industrial
      sites: Microsoft is tied to a 50 MW plant and Nucor to development of a
      500 MW plant. Electricity transmission, data-center equipment, steelmaking
      equipment, and private-company shares are adjacent or excluded spend, not
      fusion-power revenue. Status-quo substitutes include grid purchases and
      other firm generation; intermittent renewables can compete for clean-energy
      budgets but do not independently reproduce the company's claimed 24/7
      value proposition. Helion's direct electricity-recovery architecture is
      relevant to cost and plant complexity, but it is a product claim rather
      than evidence that a broad electricity market is presently serviceable.
    claimRefs: [CM001, CM002, CM004, CM010]
    tableRefs: [TM001]
  - id: evidence-constrained-sizing
    title: Evidence-constrained sizing
    body: >-
      The available evidence supports bottom-up demand markers, not a defensible
      TAM/SAM/SOM estimate. The 50 MW Microsoft PPA is the narrowest announced
      commercial entry point; the 500 MW Nucor development agreement is a
      larger industrial pathway but is not equivalent to delivered or contracted
      revenue. POWER reported prospective OpenAI discussions involving as much
      as 5 GW by 2030 and 50 GW by 2035, but those figures describe talks rather
      than a signed commitment. The industry's $14.24 billion of capital raised
      since 2021 measures investor funding, not customer spend or annual market
      revenue. These lenses cannot be added into one market value because they
      mix generation capacity, possible demand, and financing. A valuation model
      should therefore scenario-weight announced capacity only after confirming
      plant economics, build cadence, interconnection, and executable offtake.
    claimRefs: [CM002, CM003, CM004, CM005, CM007, CM015]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyer-and-adoption
    title: Buyer, user, payer, and adoption path
    body: >-
      The strongest buyer pattern is a concentrated enterprise procurement
      motion rather than a mass-market sale. A hyperscaler or industrial company
      agrees on a long-duration power structure; a power marketer or grid
      intermediary can manage delivery; the end user is the data center or
      industrial facility consuming electricity. Microsoft, OpenAI, and Nucor
      illustrate distinct stages: signed PPA, reported discussions, and a
      development agreement. The evidence does not identify the internal budget
      owners, approval thresholds, energy-price terms, credit support, or
      curtailment obligations for these buyers. Adoption is therefore likely to
      depend on technical validation, permitting, site construction,
      interconnection, and bankable delivery terms before ordinary procurement
      economics dominate. Regulatory licensing at Orion removes one visible
      construction barrier, but it does not validate net electricity or prove a
      repeatable purchasing workflow.
    claimRefs: [CM002, CM003, CM004, CM005, CM014]
    tableRefs: [TM003]
  - id: drivers-constraints-valuation
    title: Drivers, constraints, and valuation relevance
    body: >-
      Demand-side momentum is real: independent reporting links growth in data
      centers and wider electrification to rising need for abundant,
      around-the-clock power, while global fusion funding indicates sustained
      investor interest. Helion also has substantial organizational and capital
      inputs, including 800 reported employees, current engineering recruitment,
      and roughly $1.5 billion raised after a $465 million 2026 round. Supply-side
      evidence remains the gating factor. Scientific American reported that no
      published result had confirmed net power from Polaris, described FRC
      stability as difficult at higher energy, and highlighted scarce helium-3
      and a roughly 200 million-degree requirement for the intended fuel cycle.
      Independent sources also preserve a 2028-versus-2029 delivery distinction.
      For valuation, demand signals justify strategic option value, but assigning
      utility-like market share before verified net output and repeatable plant
      delivery would convert prospective capacity into unsupported revenue.
    claimRefs: [CM003, CM006, CM007, CM008, CM009, CM011, CM012, CM013, CM015]
