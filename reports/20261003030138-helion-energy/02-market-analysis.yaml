figures:
  - id: FM001
    title: Evidence-constrained market sizing lens
    type: pyramid
    summary: >-
      Public evidence narrows from a broad unquantified electricity opportunity
      to named capacity signals, while verified deliverable output remains open.
    data:
      nodes:
        - label: Broad electricity TAM
          value: Not quantified
          detail: Firm electricity spend is the relevant top boundary, but no defensible dollar estimate was retained.
        - label: Firm carbon-free SAM
          value: Not quantified
          detail: Data centers and industrial loads are evidenced target verticals; qualifying sites and price thresholds are unknown.
        - label: Nucor development pathway
          value: 500 MW
          detail: Announced development agreement in the 2030s, not delivered output or disclosed revenue.
        - label: Microsoft commercial wedge
          value: 50 MW
          detail: First-plant PPA target, with public sources distinguishing 2028 plant timing and 2029 electricity delivery.
        - label: Reported OpenAI demand signal
          value: Up to 5 GW by 2030; 50 GW by 2035
          detail: Reported discussions only, not a signed commitment or executable forecast.
        - label: Verified deliverable SOM
          value: Not publicly established
          detail: No retained published result confirms net power from Polaris or repeatable commercial deployment.
    approximationNotes: >-
      This is an evidence hierarchy, not an additive funnel. Capacity figures
      have different commitment levels and dates; null layers remain explicit
      rather than being estimated from general electricity demand.
    claimRefs: [CM001, CM002, CM004, CM005, CM011, CM014]
callouts:
  - calloutType: insight
    title: Demand evidence is ahead of supply evidence
    body: >-
      Named buyers demonstrate appetite for firm clean power, but the evidence
      does not yet connect that appetite to verified net output, plant economics,
      repeatable build cadence, or a defensible revenue-based market share.
    claimRefs: [CM002, CM004, CM005, CM011]
  - calloutType: risk
    title: Do not capitalize prospective gigawatts as contracted revenue
    body: >-
      The reported OpenAI figures are discussions, the Nucor figure is a
      development agreement, and even the Microsoft PPA lacks disclosed pricing
      and annual delivered-energy economics in the assigned evidence.
    claimRefs: [CM002, CM003, CM004, CM005]
