company:
  name: "Helion Energy"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Helion Energy is an Everett-based, Series G-backed fusion developer pursuing pulsed field-reversed-configuration machines and direct electromagnetic electricity recovery. Its June 2026 financing established a $15.5 billion post-money valuation and $1.5 billion invested-to-date figure, while a September company update raised the round's final close from $465 million to $500 million; commercial credibility still depends on demonstrating net electricity and meeting the Orion delivery schedule."
sections:
  - id: "identity-and-operating-model"
    title: "Identity, stage, and operating model"
    body: >-
      Helion Energy is a private fusion company headquartered in Everett,
      Washington and founded in 2013 by David Kirtley, John Slough, Chris Pihl,
      and George Votroubek. Its current stage is best described as a
      late-stage, Series G-backed developer moving from prototypes toward a
      first commercial plant, rather than an operating power producer. Helion
      proposes to form, accelerate, merge, and magnetically compress two
      field-reversed-configuration plasmas in pulses, then recover electricity
      through electromagnetic induction instead of a steam-turbine cycle.
      Revenue, revenue run-rate, active customer count, and unit economics are
      not disclosed in the assigned evidence, so commercial agreements should
      not be presented as realized sales or operating customers.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO004"
    tableRefs:
      - "TO001"
    figureRefs: []

  - id: "leadership-and-governance"
    title: "Leadership and governance"
    body: >-
      David Kirtley remains the publicly identified co-founder and chief
      executive. Public profiles also identify Chris Pihl and George Votroubek
      as technical co-founders, while John Slough supplied foundational
      field-reversed-configuration research before splitting with the company.
      That history creates two forms of key-person exposure: execution remains
      closely associated with Kirtley's commercial timetable, and Slough has
      become a technically informed external critic of the design. The retained
      source set does not provide a current, authoritative board roster,
      committee structure, voting-control map, succession plan, or investor
      protective provisions. Governance conclusions should therefore remain
      provisional until the company supplies its capitalization table, charter,
      board minutes, and key-person continuity plan.
    claimRefs:
      - "CO002"
      - "CO003"
      - "CO015"
      - "CO016"
    tableRefs:
      - "TO002"
    figureRefs: []

  - id: "capital-and-stakeholders"
    title: "Capitalization and strategic stakeholders"
    body: >-
      Helion announced an initial $465 million Series G close on June 4, 2026,
      led by Thrive Capital at a $15.5 billion post-money valuation, and said
      total investment to date had reached $1.5 billion. The company later
      updated the release to say the oversubscribed round closed at $500
      million in September; the update did not restate a different valuation or
      invested-to-date denominator. This followed a $500 million 2021 round in
      which CNBC reported Sam Altman invested $375 million. Microsoft and Nucor
      add strategic relevance through a 50 MW power agreement and a separate
      500 MW development agreement, respectively, but neither contract proves
      delivered electricity, recognized revenue, or disclosed economics.
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
    tableRefs:
      - "TO003"
    figureRefs: []

  - id: "milestones-and-execution-risk"
    title: "Milestones, scale, and execution risk"
    body: >-
      The milestone record combines meaningful engineering progress with
      unresolved commercial proof. Helion and multiple reports say Polaris
      operated with deuterium-tritium fuel and exceeded 150 million degrees
      Celsius in 2026, while Scientific American reported roughly 600 employees
      and Orion construction under way near Malaga, Washington. The same
      independent account found no published result confirming net power from
      Polaris as of May 2026 and described prior missed electricity targets.
      Slough argues that confinement losses may undermine Helion's accelerated
      field-reversed-configuration approach, and another independent expert
      said sparse publication makes the core performance claims difficult to
      assess. The central diligence test is therefore not temperature alone,
      funding raised, or contracted capacity; it is independently reviewable
      net electricity, repeatability, plant availability, and schedule evidence.
    claimRefs:
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
    tableRefs: []
    figureRefs:
      - "FO001"

