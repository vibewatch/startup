      - number: '3.3'
        title: Commercial Moats, Regulatory Precedence, and Displacement Risks
        blocks:
          - type: paragraph
            body: >-
              Commercial differentiation in early-stage fusion is dictated by power purchase commitments, regulatory
              licensing momentum, and capital adequacy rather than near-term levelized cost of electricity. Helion
              secured a decisive first-mover commercial advantage through its binding power purchase agreement with
              Microsoft to deliver 50 megawatts from its planned Orion facility in Malaga, Washington, by 2028. On June
              16, 2026, Helion established regulatory precedence by securing the world's first radioactive materials and
              air emissions licenses for a commercial fusion facility from the Washington State Department of Health.
              Supported by $465 million in Series G funding raised in June 2026 at a $15.5 billion valuation, bringing
              cumulative capital past $1.5 billion, Helion holds substantial runway. Nevertheless, severe displacement
              risks persist: if Helion experiences demonstration slippage on its Polaris prototype or fails to
              commission Orion before 2030, hyperscale customers can pivot capital toward licensed SMR fission projects,
              natural gas with carbon capture, or firm geothermal power.
            claimRefs:
              - CP011
