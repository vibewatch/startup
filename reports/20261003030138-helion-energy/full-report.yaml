        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The strongest buyer pattern is a concentrated enterprise procurement motion rather than a mass-market
              sale. A hyperscaler or industrial company agrees on a long-duration power structure; a power marketer or
              grid intermediary can manage delivery; the end user is the data center or industrial facility consuming
