      - number: '6.4'
        title: Durability, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              Retention cannot be evaluated with conventional measures because the retained evidence discloses no NRR,
              GRR, renewal, churn, cohort, satisfaction, contract pricing, or delivered-volume history. Expansion is
              visible only as a pipeline: Microsoft establishes the first 50 MW obligation, Nucor extends the model into
              steel at 500 MW, and OpenAI represents a possible additional buyer [CU001, CU002, CU015]. The official
              value proposition is continuous grid power, while the operating model relies on standardized in-house
              components and rigorous hardware execution [CU006, CU007, CU011]. Those features could support repeat
              plant deployment, but they do not demonstrate retention. Until contractual economics and a fuller customer
              roster are disclosed, customer concentration and the financial consequence of a delayed first delivery
