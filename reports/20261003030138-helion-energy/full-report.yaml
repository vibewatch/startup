      - number: '3.2'
        title: Technical Architecture and Power Conversion Tradeoffs
        blocks:
          - type: paragraph
            body: >-
              The core technical battleground between Helion and competing clean power developers centers on energy
              conversion efficiency, supply chain ownership, and balance-of-plant complexity. Conventional fusion
              concepts boil water via thermal neutron capture to spin steam turbines, suffering thermal Carnot
              efficiency losses and requiring massive cooling infrastructure and specialized turbine halls. Helion
              claims direct Faraday electromagnetic recovery yielding over 95 percent efficiency as expanding plasma
              pushes against magnetic containment coils. Furthermore, by targeting deuterium and helium-3 fuel, Helion
              minimizes high-energy neutron flux compared to deuterium-tritium fusion, reducing material activation and
              licensing friction. However, D-He3 fusion requires significantly higher plasma temperatures exceeding 100
              million degrees Celsius, demanding rigorous confinement stability that FRC plasmas historically struggle
              to sustain. Additionally, Helion relies on extensive in-house vertical manufacturing for custom
              high-voltage capacitors and ultrahigh-pressure ceramics, while competitors like CFS build specialized
              infrastructure for high-temperature superconducting magnets.
            claimRefs:
              - CP004
              - CP005
              - CP007
              - CP008
              - CP009
              - CP010
