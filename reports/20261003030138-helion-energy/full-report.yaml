  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Helion is not yet selling a general-purpose reactor, components, or securities into one coherent market.
              Its commercial market is the generation and sale of firm electricity from Helion-built fusion plants,
              initially through long-dated arrangements with large loads. The clearest target buyers are hyperscale data
              centers and energy-intensive industrial sites: Microsoft is tied to a 50 MW plant and Nucor to development
              of a 500 MW plant. Electricity transmission, data-center equipment, steelmaking equipment, and
              private-company shares are adjacent or excluded spend, not fusion-power revenue. Status-quo substitutes
              include grid purchases and other firm generation; intermittent renewables can compete for clean-energy
              budgets but do not independently reproduce the company's claimed 24/7 value proposition. Helion's direct
              electricity-recovery architecture is relevant to cost and plant complexity, but it is a product claim
              rather than evidence that a broad electricity market is presently serviceable.
