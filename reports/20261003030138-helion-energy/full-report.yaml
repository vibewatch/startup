      - number: '6.3'
        title: Named proof is contractual and pre-production
        blocks:
          - type: paragraph
            body: >-
              The Microsoft agreement is the strongest customer proof because multiple independent sources corroborate
              its scale and intended data-center use [CU001, CU003]. It is still pre-production proof. Scientific
              American reports that Helion planned to open Orion in 2028 and supply 50 MW in 2029, in tension with
              company and other third-party descriptions of delivery beginning in 2028 [CU004]. The same source states
              that no published results had confirmed net power generation from Polaris as of May 2026 [CU005]. Nucor's
              agreement adds industrial validation and a larger proposed plant, but it remains a development arrangement
              for the 2030s, not an operating deployment [CU002]. OpenAI remains exploratory [CU015]. No retained
              evidence reports production consumption or customer outcomes for any named counterparty.
