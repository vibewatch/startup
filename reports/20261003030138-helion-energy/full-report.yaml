  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, stage, and operating model
        blocks:
          - type: paragraph
            body: >-
              Helion Energy is a private fusion company headquartered in Everett, Washington and founded in 2013 by
              David Kirtley, John Slough, Chris Pihl, and George Votroubek. Its current stage is best described as a
              late-stage, Series G-backed developer moving from prototypes toward a first commercial plant, rather than
              an operating power producer. Helion proposes to form, accelerate, merge, and magnetically compress two
              field-reversed-configuration plasmas in pulses, then recover electricity through electromagnetic induction
              instead of a steam-turbine cycle. Revenue, revenue run-rate, active customer count, and unit economics are
              not disclosed in the assigned evidence, so commercial agreements should not be presented as realized sales
              or operating customers.
