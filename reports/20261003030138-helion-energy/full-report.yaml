      - number: '7.3'
        title: Nuclear Licensing Frameworks, Supply Chains, and Technical Transparency
        blocks:
          - type: paragraph
            body: >-
              On the regulatory front, Helion achieved a historic precedent on June 16, 2026, when the Washington State
              Department of Health issued a Radioactive Materials License and a Radioactive Air Emissions License for
              the Orion generator site in Chelan County. This confirms that state-level authorities regulate Helion's
              low-neutron pulsed system under materials licensing frameworks rather than traditional commercial fission
              reactor statutes under Nuclear Regulatory Commission Part 50/52. Nevertheless, operating with tritium
              inventory and high-voltage capacitor arrays requires ongoing regulatory compliance, and interstate
              expansion outside Washington State remains exposed to untested state-by-state licensing hurdles.
              Operationally, Helion's vertical integration strategy requires in-house serial manufacturing of
              specialized components, including thousands of high-voltage, oil-filled pulse capacitors filling 150
              shipping containers, solid-state switches rated for hundreds of millions of pulses, and
              ultra-high-pressure ceramics. These specialized components cannot be sourced off-the-shelf from commercial
              utility supply chains. Compounding these engineering challenges is Helion's institutional secrecy; the
              company maintains a strict policy of withholding detailed plasma diagnostic data from peer-reviewed
              scientific journals, preventing independent verification of plasma stability and creating substantial
              narrative risk if milestones slip.
            claimRefs:
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR012
              - CR013
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The 2028 Binary Delivery Cliff
            body: >-
              Helion's power purchase agreement with Microsoft represents both its greatest commercial asset and its
              most acute existential risk. Unlike typical venture-backed R&D startups, Helion accepted enforceable
              financial penalties for missing its 2028 delivery date. If the Orion machine fails to demonstrate
              sustained commercial electricity generation in time, Helion faces severe contract penalties, reputational
              impairment, and potential downward valuation adjustments across its $15.5 billion capital structure.
            calloutType: risk
            claimRefs:
              - CR007
