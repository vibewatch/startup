              Helion Energy remains entirely pre-revenue as of late 2026, with zero commercial generation receipts
              recognized to date. The company's future revenue architecture is anchored on long-term power purchase
              agreements (PPAs) structured around baseload electricity offtake. Its flagship commercial agreement is a
