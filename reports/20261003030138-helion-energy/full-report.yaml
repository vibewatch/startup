      - number: '7.2'
        title: Offtake Concentration, PPA Penalty Structures, and Capital Intensity
        blocks:
          - type: paragraph
            body: >-
              Helion's commercial credibility rests almost entirely on its May 2023 power purchase agreement with
              Microsoft for 50 megawatts of electricity delivery from the Orion facility by 2028. Unlike standard
              pre-revenue clean technology agreements, this contract incorporates explicit financial non-delivery
              penalties if electricity generation fails to materialize on schedule. With Constellation Energy acting as
              power marketer and transmission coordinator, any operational delay at Orion directly creates contractual
              liabilities and impairs enterprise valuation. While Helion has executed a secondary framework agreement
              with Nucor Corporation targeting a 500 MW deployment in the 2030s, exploratory multi-gigawatt power
              negotiations with OpenAI remain unfinalized and uncommitted. Commercial capital intensity remains severe
              despite Helion's $465 million Series G raise in June 2026, which valued the pre-revenue venture at $15.5
              billion post-money. Total cumulative private fusion sector capital requirements are projected to reach $77
              billion for commercial gigawatt deployment, leaving Helion dependent on periodic private market equity
              infusions until merchant power generation or PPA cash flows commence.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
