            banks
          modules:
            - High-Voltage Capacitor Banks
            - Solid-State Thyristor Switches
        - label: Magneto-Inertial Compression Core
          detail: Adiabatic magnetic compression coils exceeding 15 tesla heating collided plasmoids past 100M-150M °C
          modules:
