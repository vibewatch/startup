  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Fusion Architecture and Direct Faraday Recovery
        blocks:
          - type: paragraph
            body: >
              Helion Energy departs fundamentally from steady-state magnetic confinement tokamaks and laser-driven
              inertial confinement facilities by pursuing a linear, pulsed magneto-inertial fusion architecture. Rather
              than relying on massive cryogenic superconducting magnets or complex laser optics, Helion forms two
              high-beta Field Reversed Configuration (FRC) plasmoids at opposite ends of a linear quartz and metal
              generator tube. High-voltage magnetic coils accelerate these FRC plasmoids toward each other at supersonic
              speeds exceeding 1 million miles per hour (approximately 300 to 450 km/s). When the two plasmoids collide
              in the central fusion chamber, they merge into a single, high-density target plasmoid that is
              adiabatically compressed by pulsed magnetic fields exceeding 15 tesla, rapidly driving plasma conditions
              past 100 million degrees Celsius (9 keV) where thermal fusion occurs.


              The core operational differentiator of Helion's architecture is its direct electromagnetic energy
              conversion mechanism, eliminating the steam turbines, heat exchangers, and cooling towers required by
              conventional nuclear fission and rival fusion designs. Because high-beta FRC plasmas have an internal
              magnetic field that opposes the external confining field, the sudden thermal expansion of the fused plasma
              pushes outward against the magnetic compression field. According to Faraday's Law of Induction, this flux
              displacement induces an opposing electrical current in the surrounding compression coils, directly
              transferring the kinetic and thermal energy of charged fusion products back into the electrical circuit.
              This energy is captured directly into high-voltage capacitor banks with demonstrated subscale round-trip
              recovery efficiencies exceeding 95%. By avoiding thermal Rankine cycles that are Carnot-efficiency limited
              to 33–45%, Helion projects system-level electrical efficiency above 85% for charged-particle output,
              substantially reducing capital complexity and land footprint.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE006
              - CE013
              - CE016
          - type: figure
            figureRef: FE001
            claimRefs:
