        title: Capital Adequacy, Series G Financing, and Forward Solvency Verdict
        blocks:
          - type: paragraph
            body: >-
              Helion dramatically bolstered its balance sheet in June 2026 by closing a $465 million Series G round led
              by Thrive Capital, which established a post-money valuation of $15.5 billion and elevated cumulative
              capital raised to more than $1.5 billion. While this equity infusion provides an estimated 18 to 24 months
