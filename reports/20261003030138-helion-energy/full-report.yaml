  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Position
      - Core Argument
      - Key Vulnerability
      - What Would Change the View
    rows:
      - - Core Thesis
        - First commercial fusion generator with direct Faraday recovery and 50 MW Microsoft PPA
        - Unproven net electric gain Q > 1 at commercial scale
        - Demonstrated electricity generation from Polaris fed directly into local grid
      - - Commercial Anti-Thesis
        - Binary contractual deadline with Microsoft in 2028 carrying financial delivery penalties
        - Construction or engineering delays causing breach of contract
        - Contractual extension amendment or successful early synchronization of Orion
      - - Scientific Anti-Thesis
        - Lack of frequent peer-reviewed literature and plasma instability risks cited by critics
        - Aneutronic D-He-3 fusion physics operating at extreme pulsed magnetic compression
        - Independent scientific validation of sustained FRC confinement and energy gain
      - - Financial Anti-Thesis
        - $15.5B valuation prices in commercial success before proving underlying revenue model
        - High capital intensity and burn rate requiring substantial ongoing funding
        - Multi-year fixed-price customer prepayments or sovereign infrastructure backing
    notes: Evaluates core thesis drivers against independent scientific and contractual counter-theses.
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV006
      - CV007
      - CV008
