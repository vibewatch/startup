        - $1B-$3B recapitalization or asset liquidation; technology relegated to research stage
        - Severe Microsoft contract breach penalties; investor confidence collapse
    notes: Scenario analysis models commercial outcomes from 2026 through 2030 based on Orion operational milestones.
