      - Probability
      - Core Assumptions
      - Valuation & Return Logic
      - Downside Triggers & Risks
    rows:
      - - Bull Case
        - 25%
        - Polaris proves net electric gain in 2026-2027; Orion delivers 50 MW to Microsoft in 2028
        - $40B+ valuation at IPO; established category monopoly in baseload clean power
        - Supply chain delays in specialized high-field magnet capacitors or semiconductors
      - - Base Case
        - 50%
        - Polaris demonstrates Q > 1 with delay; Orion operational in 2029-2030 under negotiated PPA extension
        - $15B-$20B valuation; additional $500M-$1B growth round needed to bridge commercialization
        - Microsoft imposes modest monetary penalties; equity dilution for existing shareholders
      - - Bear Case
        - 25%
