        - High
        - Conceptual
        - Commercial plants constrained to D-T fuels with higher neutron flux and component embrittlement
        - Tritium breeding and decay conversion rates inside pulsed commercial devices unproven
      - - Capacitor and Solid-State Switch Degradation
        - Medium
        - Medium
        - In-House Pilot
        - Hardware failure at 1 Hz continuous repetition rate causes extended plant outages
        - Component lifecycle data under continuous multi-megajoule pulsed bombardment undisclosed
