      - number: '8.2'
        title: Recommendation Stance and Decision Framework
        blocks:
          - type: paragraph
            body: >-
              We assign Helion Energy a recommendation of track with a confidence level of medium and an overall risk
              rating of critical, while assessing its valuation stance as stretched [CV001, CV002, CV003, CV006]. Helion
              cannot be assigned an outright buy because its core physical milestone—net electricity generation (Q > 1)
              on the 7th-generation Polaris prototype—has not been publicly verified or peer-reviewed [CV001, CV006,
              CV008]. Although Polaris demonstrated deuterium-tritium fusion conditions and reached record plasma
              temperatures of 150 million degrees Celsius, entering at a $15.5B valuation implies that commercial
              success is largely priced into the equity [CV001, CV003, CV007]. Forge secondary market data shows Series
              G-1 shares at $179.52 per share with 1.0x non-cumulative liquidation preferences, leaving late-stage
              growth investors exposed to severe multiple compression or down-round risk if physical milestones slip
              past 2027 [CV003, CV004]. Investors should track execution milestones through late 2026 and 2027,
              establishing an entry position only upon verified grid-interconnection progress or independent
              verification of net electricity recovery [CV005, CV007].
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
      - number: '8.3'
        title: Financing History, Cap Table Dynamics, and Market Comps
        blocks:
          - type: paragraph
            body: >-
              Helion's capital trajectory reflects explosive valuation growth, expanding twelvefold from $1.3B at its
              Series D in September 2020 to $5.425B post-money in its Series F in January 2025, and subsequently nearly
              tripling to $15.5B in its June 2026 Series G led by Thrive Capital [CV001, CV002, CV003]. Total private
              capital raised has surpassed $1.5B across priced equity rounds and strategic investments from Nucor ($35M)
              and Sam Altman ($375M personal commitment) [CV001, CV002, CV004]. Forge market tracking details a Series
              G-1 price per share of $179.52, senior liquidation preference seniority of order 1 at 1.0x, and an 8.0%
              non-cumulative dividend rate, confirming a standard clean venture structure without punitive senior
              liquidation overhang [CV003]. In comparable private funding benchmarks, Commonwealth Fusion Systems (CFS)
              has raised close to $3B targeting commercial delivery by the early 2030s, while earlier-stage peers like
              Focused Energy ($240M), Thea Energy ($100M), and Inertia Energy ($450M Series A) have raised smaller
              rounds [CV001]. At a $15.5B valuation, Helion commands a premium multiple over all private fusion
              competitors, reflecting its signed customer contracts and 2028 operational target [CV001, CV002, CV005].
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
      - number: '8.4'
        title: Scenario Analysis, Diligence Triggers, and Exit Pathways
        blocks:
          - type: paragraph
            body: >-
              Evaluating Helion across bull, base, and bear scenarios demonstrates significant asymmetry tied to the
              2026–2028 timeline [CV001, CV005]. Under the bull scenario (25% probability), Polaris confirms net
              electricity generation in 2026–2027, the Malaga Orion facility delivers 50 MW to Microsoft on schedule in
              2028, and Helion scales standardized manufacturing of capacitor modules and power electronics for
              multi-gigawatt pipeline partners like Nucor and OpenAI, supporting a $40B+ valuation via IPO [CV001,
              CV002, CV005, CV007, CV008]. In the base scenario (50% probability), technical commissioning faces modest
              12-to-24 month delays, requiring negotiated waivers or manageable delivery penalties with Microsoft while
              necessitating a bridge round or milestone-linked financing at a flat $15B–$18B valuation [CV001, CV002,
              CV004, CV005]. In the bear scenario (25% probability), plasma instabilities or direct-recovery efficiency
              limits prevent commercial electricity generation, triggering contractual breach penalties with Microsoft,
              inability to refinance capital intensity, and severe down-round restructuring [CV001, CV005, CV006]. Key
              diligence asks focus on Polaris net energy gain demonstration logs, Microsoft PPA penalty rate clauses,
              and Orion construction milestones [CV001, CV005, CV007].
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Investment Stance: Track Pending Net Electricity Proof'
            body: >-
              While Helion has achieved historic commercial milestones—including the $15.5B Series G, the Microsoft PPA,
              and state regulatory licenses for its Orion plant—investors should maintain a track stance until net
              electricity production is independently validated on Polaris [CV001, CV002, CV003, CV007, CV008].
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV008
          - type: callout
            title: Binary Contractual Risk in 2028 Microsoft Agreement
            body: >-
              The Microsoft power purchase agreement establishes a hard commercial deadline in 2028 with monetary
              penalties for failure to deliver, transforming technical fusion development into a binary financial risk
              [CV001, CV005].
            calloutType: risk
            claimRefs:
              - CV001
              - CV005
