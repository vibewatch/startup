            - Central Fusion Chamber
        - label: Supersonic FRC Formation & Acceleration
          detail: Opposing formation sections accelerating high-beta FRC plasmoids toward center at >1 million mph
          modules:
            - Formation Coils
            - Fast Gas Injection Piezo Valves
        - label: Closed-Loop Fuel Processing & Tritium Decay
          detail: >-
            Exhaust capture, cryogenic distillation, isotope separation, and tritium beta-decay storage breeding
            helium-3
          modules:
            - Cryogenic Separation Units
            - Tritium Holdup Decay Vaults
