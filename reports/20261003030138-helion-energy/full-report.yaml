              - CE002
              - CE004
              - CE005
              - CE008
              - CE010
      - number: '5.2'
        title: 'Fuel Cycle Strategy: Deuterium-Helium-3 and In-Situ Breeding'
        blocks:
          - type: paragraph
            body: >
              Helion's system is optimized to burn a fuel mixture of deuterium (D) and helium-3 (3He). In a pure D-3He
              fusion reaction, the products are an alpha particle (4He, 3.6 MeV) and a high-energy proton (p, 14.7 MeV),
              both of which are charged ions whose kinetic energy couples directly to the magnetic field for Faraday
              electricity extraction. Crucially, pure D-3He fusion releases no primary neutrons. In practice, side
              deuterium-deuterium (D-D) reactions occur within the hot plasma, producing neutrons that account for
              roughly 5% of total energy output at 2.45 MeV. This low-neutron operational regime dramatically reduces
              neutron embrittlement and activation of vacuum chamber walls compared to deuterium-tritium (D-T) systems,
              which produce 80% of their energy as damaging 14.1 MeV neutrons.


              The primary technical vulnerability of this fuel strategy is the near-total terrestrial absence of
              helium-3. Natural helium-3 resources on Earth are virtually non-existent, and commercial procurement from
              decay of nuclear weapons tritium is capped at tens of kilograms globally. To circumvent this constraint,
              Helion operates an integrated, closed-loop fuel cycle where 3He is bred directly through side D-D
              reactions inside the generator. In D-D reactions, 50% of events yield helium-3 and a neutron, while the
              other 50% yield tritium and a proton. Helion's plant design captures the unburned exhaust gases, routes
              them through cryogenic separation columns, isotope distillation membranes, and chemical processing skids,
              and isolates tritium. The captured tritium undergoes radioactive beta decay with a 12.32-year half-life
              into helium-3, which is then recycled back into the primary fuel feed. Operating this closed-loop chemical
              plant requires extensive radiological controls and process equipment to prevent tritium leakage, forming a
              major engineering frontier alongside the core plasma physics.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
