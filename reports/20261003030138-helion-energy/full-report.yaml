  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Plasma Physics, Confinement, and Fuel Cycle Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              Helion's pulsed magneto-inertial fusion architecture bypasses the steady-state confinement requirements of
              conventional tokamaks, but introduces acute, unvalidated physical risks at commercial scale. Although the
              seventh-generation Polaris prototype demonstrated 150 million degree Celsius plasma temperatures and
              initial deuterium-tritium reactions, Helion has not publicly confirmed net energy gain (Q > 1) from any
              device. The transition to the 50 MW Orion production facility requires simultaneous plasma stability,
              magnetic field compression exceeding 15 Tesla, and direct inductive recovery via Faraday coupling at an
              unprecedented 95 percent efficiency target. External critics and academic plasma physicists, notably
              former co-founder Dr. John Slough and research teams at the Max Planck Institute, contend that
              catastrophic magnetic flux loss during high-speed plasmoid merging and severe ion-electron thermal
              equilibration could prevent net power production under realistic multi-dimensional conditions.
              Furthermore, Helion's long-term commercial blueprint depends entirely on an aneutronic deuterium–helium-3
              fuel cycle. Because terrestrial Helium-3 is virtually non-existent, Helion must successfully breed tritium
              from deuterium-deuterium side reactions and capture its radioactive decay product over a 12.32-year
              half-life. If side-reaction breeding yields prove insufficient or plasma heating requirements surpass 200
              million degrees Celsius without adequate confinement, Helion cannot achieve its aneutronic low-neutron
              operating paradigm.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
