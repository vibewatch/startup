              - CR011
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The central investment thesis for Helion Energy rests on its unique positioning as the world's most
              commercially advanced private magneto-inertial fusion company. Helion's proprietary pulsed field-reversed
              configuration (FRC) architecture with direct Faraday electricity recovery bypasses traditional steam
              turbines, drastically lowering projected balance-of-plant capital intensity. Backed by the first
              commercial power purchase agreement in fusion history—contracting 50 MW to Microsoft by 2028 with monetary
              delivery penalties—and state regulatory licenses from the Washington State Department of Health to build
              and operate Orion in Malaga, WA, Helion possesses unrivaled commercial momentum [CV001, CV002, CV007,
              CV008]. Conversely, the anti-thesis centers on extreme technical, binary execution, and financial
              concentration risks. Commercial electricity from fusion has never been demonstrated in human history
              [CV005]. Independent academic physicists, including retired Princeton Plasma Physics Laboratory researcher
              Daniel Jassby, have publicly criticized private fusion startups for recurring claims of power within 5 to
              10 years without validated net reactions, labeling such timelines unproven science [CV006]. Furthermore,
              missing the contractual 2028 Microsoft deadline triggers direct monetary penalties and reputational
              impairment, while the company operates at pre-revenue status with substantial ongoing capital burn [CV001,
              CV004, CV005].
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
