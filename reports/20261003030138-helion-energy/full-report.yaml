        title: Milestones, scale, and execution risk
        blocks:
          - type: paragraph
            body: >-
              The milestone record combines meaningful engineering progress with unresolved commercial proof. Helion and
              multiple reports say Polaris operated with deuterium-tritium fuel and exceeded 150 million degrees Celsius
