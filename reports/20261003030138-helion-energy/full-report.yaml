      - number: '5.3'
        title: Prototype Progression and Industrial Scale-Up
        blocks:
          - type: paragraph
            body: >
              Helion's commercialization path relies on rapid iterative prototyping across eight machine generations,
              supported by parallel subsystem testbeds rather than monolithic mega-facilities. Earlier prototypes
              demonstrated essential physics: the Inductive Plasmoid Accelerator (IPA) validated supersonic FRC merging;
              Grande (2014) validated 4-tesla compression and 95% Faraday energy recovery over 1 million pulses; Venti
              (2018) reached 7 tesla and multi-keV D-D neutron production; and Trenta (2020–2021) demonstrated sustained
              operation over 10,000 pulses, reaching 100 million degrees Celsius (9 keV) and magnetic compression
              exceeding 8 tesla. To de-risk Polaris and future plants without halting core operations, Helion deployed
              specialized subscale testbeds including Vela (which switched 11 GJ of energy at 1 Hz through simulated
              compression magnets), Polaris Junior Formation (2023–2025), and Tiny Merge for next-generation magnet and
              plasma dynamics.


              The seventh-generation machine, Polaris, completed construction in Everett, Washington, in late 2024 and
              is currently operating to demonstrate net electricity gain—the milestone where recovered electricity
              exceeds electrical input per pulse. In February 2026, Polaris demonstrated measurable D-T fusion reactions
              and achieved record plasma temperatures of 150 million degrees Celsius. In parallel, Helion has initiated
              construction on Orion, a 50-MWe commercial pilot power plant located in Malaga, Chelan County, Washington,
              designed to supply clean baseload power to Microsoft data centers under a 2028 commercial power purchase
              agreement. Achieving commercial operations requires industrial mass manufacturing: Helion is scaling
              in-house production of solid-state high-voltage switching modules and energy-storage capacitors from 10 MJ
              to 100,000 MJ annually, while navigating deterministic industrial network architectures (EtherCAT,
              PTP/NTP) to synchronize thousands of pulsed power elements within microsecond tolerances.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE012
              - CE014
              - CE015
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Physics Advantage and Engineering Burden of Faraday Direct Conversion
            body: >-
              Helion's direct electromagnetic recapture avoids the 60% thermodynamic losses inherent in steam turbine
              Rankine cycles, fundamentally lowering plant capital cost and water consumption. However, this
              architectural choice shifts the entire engineering burden onto power electronics: capacitors and
              solid-state switches must absorb gigawatt-scale pulses every second without electrical breakdown.
            calloutType: insight
            claimRefs:
              - CE004
              - CE005
              - CE013
          - type: callout
            title: The Helium-3 Fuel Breeding Dilemma
            body: >-
              Burning deuterium and helium-3 solves the neutron damage challenge of D-T fusion, but helium-3 is
              virtually non-existent in commercial quantities. While Helion's patent demonstrates that D-D side
              reactions produce tritium that beta-decays into helium-3, the 12.32-year half-life creates an acute fuel
              lag. Early commercial plants must procure rare seed inventories or accept lower efficiency while breeding
              their own fuel.
            calloutType: risk
            claimRefs:
              - CE007
              - CE008
              - CE009
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyers, users, and commercial surfaces
        blocks:
          - type: paragraph
            body: >-
              Helion's disclosed commercial surface is narrow and enterprise-led. Microsoft is the clearest prospective
              buyer, with a 50 MW power purchase agreement tied to data-center electricity; Nucor is the second named
              customer, through a 500 MW plant-development agreement for an industrial use case [CU001, CU002, CU003].
              Nuclear Engineering International also identifies Constellation Energy as power marketer for the Microsoft
              arrangement, showing that delivery depends on a channel and grid interface as well as the end buyer
              [CU013]. OpenAI is described only as an explored purchasing partnership, not a signed customer agreement
              [CU015]. The evidence therefore supports hyperscale data centers and energy-intensive industry as target
              segments, but not a broad installed base, active utilization, or a quantified customer count.
            claimRefs:
              - CU001
