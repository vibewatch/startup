      - number: '6.2'
        title: Adoption is milestone-based, not usage-based
        blocks:
          - type: paragraph
            body: >-
              Public adoption evidence is a sequence of commitments and delivery-enabling milestones rather than
              consumed megawatt-hours. KING 5 reported in 2021 that Helion's chief executive declined to specify when
              electricity production would begin [CU016]. The company disclosed the Microsoft and Nucor agreements in
              2023, raised a Series F in 2025 for commercialization work, and by 2026 had expanded to 800 employees
              while construction advanced at Orion [CU001, CU002, CU008, CU009, CU012]. A third-party industry source
              reported two Washington state licenses that cleared continued construction [CU010]. These are material
              procurement and execution signals, but none is evidence of delivered fusion electricity, repeat purchase,
              plant utilization, customer satisfaction, or realized customer economics.
