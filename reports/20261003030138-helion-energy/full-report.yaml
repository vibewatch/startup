  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Alternative Approaches and Direct Fusion Contenders
        blocks:
          - type: paragraph
            body: >-
              Evaluating Helion Energy's competitive durability requires examining the broader landscape of zero-carbon
              baseload generation technologies. Direct peers in the commercial fusion space are pursuing divergent
              physics and engineering pathways to net electricity generation. Traditional private and public fusion
              initiatives overwhelmingly depend on magnetic confinement inside toroidal tokamaks, such as Commonwealth
              Fusion Systems (CFS), or stellarators and magnetized target fusion architectures like General Fusion and
              TAE Technologies. Tokamak architectures rely on complex high-temperature superconducting magnet assemblies
              and thermal steam turbine power cycles to extract thermal energy from deuterium-tritium reactions. In
              sharp contrast, Helion pursues a linear pulsed field-reversed configuration (FRC) utilizing deuterium and
              helium-3 fuel, recovering electrical power directly through electromagnetic induction without a
              conventional thermal cycle. Beyond private fusion peers, advanced nuclear fission and small modular
              reactors (SMRs) represent mature, licensed incumbent alternatives already competing for
              high-capacity-factor baseload procurement contracts from hyperscale data center operators.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP001
