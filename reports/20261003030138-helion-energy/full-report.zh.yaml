        title: 里程碑、规模与执行风险
        blocks:
          - type: paragraph
            body: >-
              里程碑记录折射出显著的工程进展与悬而未决的商业验证并存。Helion 与多方报道称 Polaris 于 2026 年使用氘-氚（D-T）燃料运行且温度突破 1.5 亿摄氏度；《Scientific
              American》报道其员工规模约为 600 人，位于华盛顿州 Malaga 附近的 Orion 电站已开工建设。该独立报道同时指出，截至 2026 年 5 月并无公开发表结果证实 Polaris
