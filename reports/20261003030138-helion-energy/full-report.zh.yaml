              燃烧氘与氦-3 虽化解了 D-T 聚变的中子损伤痛点，但商业化规模的氦-3 储量几乎为零。尽管 Helion 专利表明可通过 D-D 副反应生成氚并 β 衰变为氦-3，但 12.32
              年的半衰期带来了严峻的燃料供给滞后。早期商业电站必须高价搜罗极其稀缺的启动原料底料，或者在自持增殖燃料期间承受较低的系统效率。
