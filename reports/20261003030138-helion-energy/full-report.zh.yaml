      - number: '2.3'
        title: 买方、用户、出资方与接纳路径
        blocks:
          - type: paragraph
            body: >-
              核心买方主要是高度集中的大企业采购，而非大众市场销售。超大规模云厂商或工业巨头敲定长期供电结构；售电经纪商或电网中介机构统筹电力交付；终端用户则是实际消耗电力的对应数据中心或工业工厂。Microsoft、OpenAI
              与 Nucor 分别代表不同推进阶段：已签署
              PPA、据报道处于接洽商谈、开发协议。现有材料未披露这些买方内部的预算决策人、审批门槛、电价条款、信用担保或弃电补偿义务。因此，在常规采购商业逻辑发挥主导作用之前，商业落地推进很可能取决于技术验证、许可证审批、现场施工、电网并网以及具备可融资性的交付条款。Orion
              取得监管许可固然破除了一处显性施工壁垒，但并未证实净发电能力，亦未验证可规模复制的采购商业闭环。
