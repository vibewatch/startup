      - number: '7.3'
        title: 核许可监管框架、供应链与技术透明度
        blocks:
          - type: paragraph
            body: >-
              监管方面，Helion 于 2026 年 6 月 16 日开创历史先例：华盛顿州卫生部针对 Chelan 县的 Orion 发电机现场颁发了放射性材料许可证与放射性空气排放许可证。这证实州级监管机构是将
              Helion 的低中子脉冲系统纳入材料许可框架监管，而非援引美国核管理委员会（NRC）第 50/52
              编传统商用裂变反应堆法规。尽管如此，处理在库氚及高压电容阵列仍需持续满足合规要求，且未来若跨出华盛顿州向其他州拓展，各州未经检验的属地审批流程仍具不确定性。在工程运营端，Helion
              的垂直整合战略要求内部自建产线批量制造专用零部件，包括装满 150 个集装箱的数千台高压充油脉冲电容器、承受数亿次脉冲的固态开关以及超高压陶瓷部件。这些高度定制的专用构件无法直接从现成电力供应链中采购。更棘手的是
              Helion 对外高度保密的企业作风：公司严守不对同行评审学术期刊公开详细等离子体诊断数据的政策，导致外部无法独立验证其等离子体稳定性，一旦时间表出现拖延，势必引发巨大的舆论叙事风险。
            claimRefs:
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
