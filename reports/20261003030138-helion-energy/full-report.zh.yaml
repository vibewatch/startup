  - number: 7
    title: 风险剖析
    sections:
      - number: '7.1'
        title: 等离子体物理、约束瓶颈与燃料循环软肋
        blocks:
          - type: paragraph
            body: >-
              Helion 的脉冲磁惯性聚变架构规避了传统托卡马克的稳态约束难题，却在商用放大尺度上引入了严峻且未经充分验证的物理风险。尽管第七代原型机 Polaris 达到了 1.5
              亿摄氏度等离子体温度并测得初步氘-氚反应，但 Helion 迄今未公开确认旗下任何装置实现了净能量增益（Q > 1）。向 50 MW Orion 生产型设施过渡，要求在确保等离子体稳定性的同时，实现超 15
              特斯拉磁场压缩，并依靠法拉第耦合完成史无前例的 95% 电磁直接回收效率目标。外部批评人士与学术界等离子体物理学家（尤其是前联合创始人 John Slough 博士及 Max Planck
              研究所研究团队）指出，在真实的复杂多维工况下，高速等离子体团碰撞合并过程中的灾难性磁通量损耗以及严重的离子-电子热平衡效应，极可能阻碍净电能输出。此外，Helion
              的远期商业蓝图完全系于无中子（低中子）氘-氦-3 燃料循环。由于地球几乎不存在天然氦-3，Helion 必须依托氘-氘副反应成功增殖氚，并在 12.32
              年半衰期内捕获其放射性衰变产物。若副反应增殖产率不及预期，或等离子体加热在缺乏足够约束的前提下被推高至 2 亿摄氏度以上，Helion 规划的低中子运行范式将难以为继。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
