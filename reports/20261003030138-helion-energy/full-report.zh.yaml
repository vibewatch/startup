  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 替代技术路线与聚变直接竞品
        blocks:
          - type: paragraph
            body: >-
              评估 Helion Energy
              的竞争护城河与持久力，须将其置于更广阔的零碳基荷发电技术图景中考量。商业聚变领域的直接同行分别探索截然不同的物理与工程路径以求实现净发电。传统民营与公共科研聚变项目绝大多数依赖环形托卡马克磁约束，例如
              Commonwealth Fusion Systems（CFS），或仿星器及磁化靶聚变架构，如 General Fusion 与 TAE
              Technologies。托卡马克架构依赖复杂的高温超导磁体组件与传统蒸汽轮机朗肯动力循环，从氘-氚反应中提取热能。相比之下，Helion 另辟蹊径，采用基于氘和氦-3
              燃料的直线脉冲场反转位形（FRC），省去传统热循环，直接依靠电磁感应回收电能。除聚变同行外，先进核裂变与小型模块化反应堆（SMR）作为技术更成熟、已获监管牌照的在位替代方案，已在争夺超大规模数据中心高容量因数的基荷电力采购合同。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
