      - number: '7.2'
        title: 消纳端集中度、PPA 罚则机制与高资本密集度
        blocks:
          - type: paragraph
            body: >-
              Helion 的商业信誉几乎完全系于 2023 年 5 月与 Microsoft 签署的购电协议——承诺在 2028 年前通过 Orion 设施交付 50 MW
              电力。不同于寻常的早期零收入清洁技术协议，该合同包含明确的未按期发电经济罚款条款。在 Constellation Energy 担任售电经纪与输电协调方的架构下，Orion
              的任何工期延误都将直接触发合同违约责任并重创企业估值。尽管 Helion 与 Nucor Corporation 达成了面向 2030 年代建设 500 MW 电站的二级框架协议，但与 OpenAI
              探讨的数吉瓦供电接洽仍未敲定，亦无任何正式承诺。尽管 2026 年 6 月 Helion 完成了 $465M Series G 融资，将这家尚无商业收入的企业投后估值推高至
              $15.5B，商业化资本密集度依然令人咋舌。据预测，民营聚变行业实现吉瓦级商业部署累计需注资 $77B；在实现市场化发电售电或产生 PPA 经营现金流之前，Helion 仍须仰赖一级市场定期注入股权资金。
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
