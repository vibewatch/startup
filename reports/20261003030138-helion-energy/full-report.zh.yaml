  - id: FE001
    title: Helion 直接回收磁惯性聚变技术栈架构
    type: stack
    summary: 全景展示等离子体生成、加速、磁压缩、法拉第直接电磁感应回收以及闭环燃料循环的全集成技术架构。
    data:
      layers:
        - label: 电网互联与电力输出系统
          detail: 变电站开关站向区域电网及 Microsoft 数据中心稳定输送 50 MWe 基荷电力
          modules:
            - 主升压变电站
            - 开关设备主控系统
        - label: 法拉第直接能量回收系统
          detail: 压缩线圈在无需蒸汽朗肯循环介入的前提下，直接将等离子体膨胀能量转化为反电动势电能
          modules:
            - 感应拾取线圈
            - 法拉第电路耦合回路
        - label: 脉冲功率与电容储能系统
          detail: 吉瓦级固态功率开关以超过 95% 的往返充放电效率向储能电容器组传输电能
          modules:
            - 高压储能电容器组
            - 固态晶闸管开关
        - label: 磁惯性聚变压缩核心区
          detail: 超过 15 特斯拉的绝热磁压缩线圈将对撞后的等离子体团快速加热至 100m–150m（1 亿至 1.5 亿）摄氏度
          modules:
            - 15T 脉冲磁体线圈
            - 核心聚变反应室
        - label: 超音速 FRC 生成与加速系统
          detail: 对置的双向生成段将高贝塔场反向构型（FRC）等离子体团以超 160 万公里/小时（超 1m 英里/小时）高速推向核心区对撞
          modules:
            - 生成线圈组
            - 快速气喷压电阀门
        - label: 闭环燃料后处理与氚衰变系统
          detail: 尾气回收、深冷精馏、同位素分离及氚 β 衰变储存罐，持续循环增殖提纯氦-3
          modules:
            - 深冷分离处理单元
            - 氚滞留衰变储存舱
    approximationNotes: 功能架构示意图基于 Helion 公开技术资料与官方专利文献绘制。
