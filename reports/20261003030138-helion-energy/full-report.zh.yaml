  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Helion
              尚未面向单一统合市场对外出售通用反应堆、核心零部件或证券资产。其商业市场定位是利用自建聚变电站发电并销售可调度的稳定基荷电力，初期依托与大型负荷买方签订的长期协议推进。最清晰的目标买方为超大规模数据中心与高耗能工业厂区：Microsoft
              签约绑定 50 MW 电站，Nucor 则敲定 500 MW
              电站开发。输配电、数据中心硬件、炼钢设备及未上市公司股权交易均属于相邻或排除在外的开支范畴，不构成聚变售电收入。现有替代方案包括电网购电及其他稳定基荷发电；间歇性可再生能源虽能争夺清洁能源预算，却无法凭一己之力支撑公司所主打的
              24/7 全天候价值主张。Helion 的电能直接回收架构关系到成本控制与电站复杂度，但这只是一项产品宣称，尚不足以证明广阔电力市场已具备即时服务可行性。
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM010
