      - number: '2.2'
        title: 基于有限证据的市场空间测算
        blocks:
          - type: paragraph
            body: >-
              现有证据仅能支撑自下而上的需求端指标，无法得出立论严密的 TAM/SAM/SOM 测算。50 MW Microsoft PPA 是已公布范围最明确的商业切入点；500 MW Nucor
              开发协议勾勒了更大规模的工业路径，却不等同于已交付或已确认的合同收入。《POWER》杂志曾报道其与 OpenAI 探讨潜在供电构想（2030 年达 5 GW、2035 年达 50
              GW），但此类数字仅反映接触谈判，并非签约承诺。全行业自 2021 年以来累计筹集的 $14.24B
              资本衡量的是投资机构注资，而非客户实际采购支出或年度市场总收入。上述维度杂糅了发电容量、潜在需求与股权融资，不可简单加总求出单一市场规模。估值模型在确认电站度电经济性、建设节奏、电网并网以及可执行消纳协议前，仅应对已公布容量做情景加权处理。
