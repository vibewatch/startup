      - number: '5.2'
        title: 燃料循环策略：氘-氦-3 与原位自持增殖
        blocks:
          - type: paragraph
            body: >
              Helion 系统的终极目标是燃烧氘（D）与氦-3（3He）的混合燃料。在理想的纯 D-3He 聚变反应中，生成物为一个 α 粒子（4He，3.6 MeV）和一个高能质子（p，14.7
              MeV），二者均为带电离子，其动能可直接与磁场耦合，依靠法拉第感应直接提取电能。至关重要的一点是，纯 D-3He 聚变不产生原生中子。在实际工况下，高温等离子体内部会发生副反应氘-氘（D-D）聚变，产生 2.45
              MeV 的中子，约占总能量输出的 5%。相比产生 80% 高破坏性 14.1 MeV 中子的氘-氚（D-T）体系，这种低中子运行模式大幅降低了真空室壁的材料中子脆化与放射性活化。


              该燃料策略最大的技术命门在于地球上几乎完全缺乏氦-3。天然氦-3 在地表储量趋近于零，全球从核武库氚衰变中提取的商业年采购上限仅数十千克。为破解这道锁钥，Helion 构想了一套集成闭环燃料循环，利用发电机内部的
              D-D 副反应原位增殖 3He。在 D-D 聚变中，50% 的几率生成氦-3 与中子，另 50% 的几率生成氚与质子。Helion
              的电站设计捕获未燃烧的尾气，导入深冷分离塔、同位素精馏膜及化学处理集成撬块以分离出氚。捕获的氚经历半衰期为 12.32 年的放射性 β
              衰变生成氦-3，再循环回主燃料供给系统。驾驭这一闭环化工设施需要严密的放射性防护控制与工艺设备以防氚泄漏，构成了与核心等离子体物理并驾齐驱的重大工程攻坚前沿。
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
