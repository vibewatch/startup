  - number: 8
    title: 估值分析
    sections:
      - number: '8.1'
        title: 核心投资逻辑与反向论点
        blocks:
          - type: paragraph
            body: >-
              Helion Energy 的核心投资逻辑在于其独一无二的先发身位：全球商业化推进最快的民营磁惯性聚变企业。Helion
              独创的脉冲场反转位形（FRC）架构配合法拉第电能直接回收机制，彻底省去了传统蒸汽轮机，大幅压降了电站辅助设施（BOP）的预估资本密集度。坐拥人类聚变史上首份商用购电协议（承诺 2028 年前向 Microsoft
              供电 50 MW 并附带违约罚金条款），并已斩获华盛顿州卫生部针对 Malaga Orion 电站建设与运营颁发的监管许可，Helion 拥有无可匹敌的商业推进势头 [CV001, CV002, CV007,
              CV008]。反向论点则紧扣极端的物理技术壁垒、非生即死的执行考验及财务集中度风险。人类历史上从未实现过商业聚变发电 [CV005]。包括普林斯顿等离子体物理实验室退休研究员 Daniel Jassby
              在内的多位独立学者曾公开抨击民营聚变初创公司：在未验证净反应的前提下屡次宣称 5 到 10 年内实现发电，本质上是不折不扣的「未经验证科学」[CV006]。此外，错过 2028 年 Microsoft
              履约大限将招致直接经济索赔并重创商业信誉，而公司仍处零收入状态且持续承受巨额资本消耗 [CV001, CV004, CV005]。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
