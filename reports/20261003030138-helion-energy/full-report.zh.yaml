      - number: '2.4'
        title: 驱动因素、制约瓶颈与估值关联
        blocks:
          - type: paragraph
            body: >-
              需求侧动能毋庸置疑：独立报道显示，数据中心爆发式扩张与全社会电气化转型，催生对海量 24/7 全天候基荷电力的迫切需求，全球聚变领域的融资热潮也反映了资本的持续追捧。Helion
              的组织与资本投入积淀深厚，拥有据报道约 800 名员工并持续招聘工程人才，在 2026 年完成 $465M 融资后累计募资约 $1.5B。然而，供给侧证据依然是决定性的卡脖子瓶颈。《Scientific
              American》指出，尚无已发表成果证实 Polaris 产出净电能，并提到 FRC 在高能级下的稳定性极难控制，同时预定燃料循环面临氦-3 极度匮乏以及约 2 200m（2
              亿）摄氏度的超高温门槛。独立信源在首批供电时间节点上也存在 2028 年与 2029
              年的分歧。就估值而言，强劲需求信号赋予其战略期权价值；但在缺乏验证净输出与可复制交付能力的前提下，过早按公用事业企业测算市场份额，势必会将预期产能误读为毫无依据的账面收入。
