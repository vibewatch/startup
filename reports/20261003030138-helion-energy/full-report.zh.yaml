      - number: '1.3'
        title: 资本结构与战略利益相关方
        blocks:
          - type: paragraph
            body: >-
              Helion 于 2026 年 6 月 4 日宣布完成首期 $465M Series G 融资，由 Thrive Capital 领投，投后估值达 $15.5B，并称累计融资额达
              $1.5B。公司后续更新新闻稿，宣布该轮超额认购已于 9 月以 $500M 最终交割；更新未重述不同估值或累计融资金额。此前在 2021 年完成的 $500M 融资中，CNBC 报道称 Sam Altman
              个人注资 $375M。Microsoft 与 Nucor 分别凭借 50 MW 购电协议与 500 MW 开发协议注入战略背书，但两份合同均无法证明已实现电力交付、确认收入或披露具体经济条款。
