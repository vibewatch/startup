  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 聚变架构与法拉第直接电能回收
        blocks:
          - type: paragraph
            body: >
              Helion Energy 彻底颠覆了稳态磁约束托卡马克与激光惯性约束的技术路径，选用直线脉冲磁惯性聚变架构。Helion
              无需庞大的低温超导磁体或精密激光光路，而在石英与金属打造的直线发电机管两端，分别形成两团高 β 值的场反转位形（FRC）等离子体团。高压磁线圈以超过 100 万英里/小时（约 300 至 450
              km/s）的超音速将两团 FRC 对向加速。当两者在中央聚变室猛烈撞击时，会融合成单一的高密度目标等离子体团，并被超过 15 特斯拉的脉冲磁场绝热压缩，迅速将等离子体推升至 1 亿摄氏度（9
              keV）以上，触发热核聚变反应。


              Helion 架构最核心的运营差异化优势，在于其电磁直接能量转换机制，彻底抛弃了传统核裂变及竞品聚变方案不可或缺的蒸汽轮机、热交换器与冷却塔。高 β 值的 FRC
              等离子体具备反抗外部约束磁场的内部固有磁场，聚变后等离子体剧烈的热膨胀向外反推压缩磁场。依据法拉第电磁感应定律，磁通量变化在周围压缩线圈中感应出反向电流，将带电聚变产物的动能与热能直接传回电路。该电能被直接捕获储存在高压电容器组中，在缩比验证中展现了超过
              95% 的往返回收效率。省去卡诺效率受限于 33%–45% 的传统朗肯热循环后，Helion 预计带电粒子产物的系统级发电效率可达 85% 以上，大幅压降了设备资本复杂度与占地面积。
