      - number: '8.3'
        title: 融资历史、股权结构演变与可比公司分析
        blocks:
          - type: paragraph
            body: >-
              Helion 的融资历程折射出估值的爆发式增长：从 2020 年 9 月 Series D 的 $1.3B 飙升至 2025 年 1 月 Series F 投后的 $5.425B，增幅接近三倍；随后在 2026
              年 6 月由 Thrive Capital 领投的 Series G 中再度翻近三倍，达到 $15.5B [CV001, CV002, CV003]。历次定增股权轮次叠加 Nucor（$35M）与 Sam
              Altman（个人注资 $375M）的战略投资，累计私募融资总额已突破 $1.5B [CV001, CV002, CV004]。Forge 二级市场追踪显示，Series G-1 每股价格为
              $179.52，清算优先权顺位为 1 级（1.0x），附带 8.0% 非累积股息率，印证了其标准清晰的风投架构，无惩罚性优先清算悬顶负担 [CV003]。横向比对民营聚变融资标杆，Commonwealth
              Fusion Systems（CFS）累计募资近 $3B，目标于 2030 年代初实现商业交付；而 Focused Energy（$240M）、Thea Energy（$100M）及 Inertia
              Energy（$450M Series A）等更早期的竞品融资金额较小 [CV001]。凭借已签约的客户合同与 2028 年商用运营目标，Helion 在 $15.5B
              估值下享有高过所有民营聚变同行的溢价估值倍数 [CV001, CV002, CV005]。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
      - number: '8.4'
        title: 情景分析、尽调触发条件与退出路径
        blocks:
          - type: paragraph
            body: >-
              从乐观、基准和悲观情景评估 Helion，显示出与 2026–2028 年时间表紧密挂钩的显著不对称性 [CV001, CV005]。乐观情景（概率 25%）：Polaris 于 2026–2027
              年证实实现净发电，位于 Malaga 的 Orion 设施于 2028 年如期向 Microsoft 交付 50 MW 电力，且 Helion 为 Nucor 和 OpenAI 等 GW
              级储备客户规模化标准生产电容模块与电力电子设备，支撑通过 IPO 实现 $40B+ 估值 [CV001, CV002, CV005, CV007, CV008]。基准情景（概率 50%）：技术调试面临 12 至
              24 个月的温和延误，需与 Microsoft 协商豁免或承受可控交付罚金，同时需以 $15B–$18B 平价估值完成过桥轮或里程碑挂钩融资 [CV001, CV002, CV004,
              CV005]。悲观情景（概率 25%）：等离子体不稳定性或直接能量回收效率瓶颈阻碍商业发电，触发对 Microsoft 的合同违约罚金，无法支撑资本密集度的再融资需求，引发严重流血轮重组 [CV001,
              CV005, CV006]。核心尽调诉求聚焦 Polaris 净能量增益验证日志、Microsoft PPA 罚金费率条款以及 Orion 建设里程碑 [CV001, CV005, CV007]。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
