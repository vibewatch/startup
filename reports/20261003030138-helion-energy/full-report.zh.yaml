              加速场反转位形方案的可行性，另一位独立专家亦指出，极少的公开发表使得核心性能主张难以评估。因此，尽调核心检验标准绝非单纯看温度、融资金额或签约容量，而是可供独立审阅的净发电量、可重复性、电站可用率及工期推进证据。
