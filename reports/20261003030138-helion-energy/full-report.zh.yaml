      - number: '3.3'
        title: 商业壁垒、监管先例与被替代风险
        blocks:
          - type: paragraph
            body: >-
              早期聚变领域的商业壁垒主要由购电协议承诺、监管牌照推进节奏与资本充裕度决定，而非近期的平准化度电成本（LCOE）。Helion 凭借与 Microsoft 签署的具约束力 PPA 锁定先发优势，承诺在 2028
              年前从华盛顿州 Malaga 规划建设的 Orion 电站交付 50 MW 电力。2026 年 6 月 16 日，Helion
