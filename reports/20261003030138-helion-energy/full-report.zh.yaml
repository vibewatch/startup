      - number: '1.2'
        title: 领导团队与公司治理
        blocks:
          - type: paragraph
            body: >-
              David Kirtley 目前仍是公开确认的联合创始人兼 CEO。公开履历显示 Chris Pihl 和 George Votroubek 为技术联合创始人；John Slough
              曾提供奠基性的场反转位形（FRC）研究，后与公司分道扬镳。这段历史埋下两重关键人风险：执行推进高度绑定 Kirtley 的商业时间表，而深谙技术内情的 Slough
              已转为该设计的外部批评者。手头信源未提供现行权威董事会名册、委员会架构、投票权控制权分布图、接班人计划或投资者保护性条款。在公司提供股权结构表、公司章程、董事会纪要及关键人持续性计划之前，治理层面的判断仍属暂定性质。
