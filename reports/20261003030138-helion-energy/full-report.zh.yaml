    title: 公司概况
    sections:
      - number: '1.1'
        title: 定位、阶段与运营模式
        blocks:
          - type: paragraph
            body: >-
              Helion Energy 是一家总部位于华盛顿州 Everett 的非上市聚变公司，由 David Kirtley、John Slough、Chris Pihl 与 George Votroubek 于
              2013 年联合创立。公司当前阶段更适合定义为由 Series G 资助的后期开发商，正从原型机向首个商业电站迈进，而非处于营运期的发电运营商。Helion
              提出脉冲式形成、加速、碰撞合并两团场反转位形（FRC）等离子体并实施磁压缩，随后直接依靠电磁感应回收电能，彻底替代蒸汽轮机循环。现有资料未披露收入、年化收入运行率、活跃客户数及单位经济模型，因此商业协议不能等同于已确认销售额或营运客户。
            claimRefs:
              - CO001
              - CO002
              - CO004
