            title: 法拉第直接转换的物理优势与工程重负
            body: >-
              Helion 的电磁直接回收规避了蒸汽轮机朗肯循环固有的 60%
              热力学损耗，从根本上降低了电站建造成本与水耗。然而，这一架构选择将全部工程压力转嫁到了电力电子设备端：电容器与固态开关必须每秒承受吉瓦级脉冲冲击而不发生击穿。
