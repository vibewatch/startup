      - number: '7.4'
        title: 重点图表
        blocks:
          - type: callout
            title: 2028 交付悬崖的非生即死
            body: >-
              Helion 与 Microsoft 签署的购电协议既是其最大的商业王牌，也是最致命的生存风险。不同于一般的风投孵化研发型初创企业，Helion 接受了未能在 2028
              年按期交付就必须承担强制性经济赔偿的严苛条款。若 Orion 届时无法实现持续的商业化发电，Helion 将面临沉重的违约罚金、声誉重创，以及 $15.5B 估值架构被大幅下调的严峻局面。
            calloutType: risk
