            body: >-
              由于现有资料未披露 NRR、GRR、续约率、流失率、同构群组（cohort）、满意度、合同定价或实际交付电量历史，无法用常规商业指标评估客户留存度。业务拓展目前仅以潜在管线形态呈现：Microsoft 确立了首笔
              50 MW 履约义务，Nucor 将这一模式拓展至钢铁工业场景（500 MW），OpenAI 则代表潜在增量买方 [CU001, CU002,
              CU015]。官方主打的价值主张是全天候电网连续供电，运营模式则仰仗标准化自研零部件与严苛的硬件执行力 [CU006, CU007,
              CU011]。这些特征或许有助于未来电站的规模复制，但绝非客户留存的实证。在合同经济条款与更完整的客户名单公开之前，客户高度集中以及首期交付延期可能引发的财务连带后果，依然是核心的尽调盲区。
