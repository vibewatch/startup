      - number: '8.2'
        title: 投资建议与决策分析框架
        blocks:
          - type: paragraph
            body: >-
              我们给予 Helion Energy「持续跟踪」（track）建议，置信度评定为「中等」（medium），整体风险评级定为「严峻」（critical），并判定其估值偏高（stretched）[CV001,
              CV002, CV003, CV006]。当前不可直接给予「买入」（buy）评级，原因在于其核心物理节点——第七代 Polaris 原型机的净发电（Q > 1）——尚未得到公开证实或同行评审 [CV001,
              CV006, CV008]。尽管 Polaris 展现了氘-氚聚变工况且等离子体温度创下 150m（1.5 亿）摄氏度纪录，但在 $15.5B 估值下入局，意味着其股权已基本提前透支了商业成功的预期
              [CV001, CV003, CV007]。Forge 二级市场数据显示其 Series G-1 股标价为每股 $179.52，附带 1.0x 非累积清算优先权；若物理验证里程碑拖过 2027
              年，后期成长期投资人将面临惨烈的估值倍数压缩或下调估值（down-round）风险 [CV003, CV004]。投资者宜持续追踪 2026 年底至 2027
              年的推进节点，唯有在电网并网取得扎实进展或电能净回收获得独立验证后，方可考虑建仓入局 [CV005, CV007]。
            claimRefs:
              - CV001
