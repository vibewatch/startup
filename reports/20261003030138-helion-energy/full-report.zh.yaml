      - number: '3.2'
        title: 技术架构与能量转换权衡
        blocks:
          - type: paragraph
            body: >-
              Helion
              与其他清洁能源开发商的核心技术竞逐点聚焦于能量转换效率、供应链掌控度以及电站辅助设施（BOP）的复杂度。传统聚变构想大多利用热中子捕获加热水以驱动蒸汽轮机，面临卡诺热效率损耗，且需要庞大的冷却基础设施与专用轮机厂房。Helion
              宣称利用等离子体膨胀反推磁约束线圈，法拉第电磁直接回收效率超 95%。此外，采用氘与氦-3 燃料使 Helion 大幅降低了相比氘-氚聚变的高能中子通量，减少了材料辐照活化并规避了牌照审查摩擦。然而，D-3He
              聚变所需等离子体温度极高（须突破 1 亿摄氏度），对约束稳定性提出苛刻要求，而这正是 FRC 等离子体在历史上难以持续维持的弱点。与此同时，Helion 高度依赖定制高压电容与超高压陶瓷的全面自研垂直整合，而
              CFS 等竞品则在高温超导磁体领域布局专用制造基建。
            claimRefs:
              - CP004
              - CP005
              - CP007
              - CP008
              - CP009
              - CP010
