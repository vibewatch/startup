        title: 支撑图表
        blocks:
          - type: callout
            title: 投资立场：净发电验证前保持跟踪
            body: >-
              尽管 Helion 已取得历史性商业里程碑——包括 $15.5B 估值的 G 轮融资、Microsoft PPA 以及 Orion 电厂的州级监管许可——但在 Polaris
              净发电产出获得独立验证前，投资者仍应保持跟踪观望立场 [CV001, CV002, CV003, CV007, CV008]。
