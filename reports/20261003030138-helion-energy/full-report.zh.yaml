              与 Microsoft 的协议是最有力的客户背书，多家独立信源印证了其合作规模与面向数据中心的供电用途 [CU001, CU003]。但这依然属于试产前期的名义背书。《Scientific
              American》指出，Helion 计划于 2028 年建成 Orion 并于 2029 年供电 50 MW，这与公司及其他第三方关于 2028 年开始供电的表述存在分歧 [CU004]。该报道还指出，截至
              2026 年 5 月尚无公开发表结果证实 Polaris 实现了净发电 [CU005]。Nucor 的协议增添了工业级背书并构想了更大体量的电站，但这仅是面向 2030 年代的开发协议，并非处于营运状态的实际部署
              [CU002]。OpenAI 仍处于意向接触阶段 [CU015]。手头掌握的证据均未记载任何一家合作方已实际用上电力或产生了落地业务收益。
            claimRefs:
