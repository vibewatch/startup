      - number: '5.3'
        title: 原型机演进与工业级规模放大
        blocks:
          - type: paragraph
            body: >
              Helion 的商业化路径依托八代原型机的敏捷迭代推进，并辅以并行的子系统试验台，而非孤注一掷地押注单一巨型设施。早期原型机逐一验证了基础物理机制：感应等离子体团加速器（IPA）验证了超音速 FRC
              碰撞合并；Grande（2014）经受 100 万次脉冲测试，验证了 4 特斯拉压缩与 95% 的法拉第能量回收；Venti（2018）达到 7 特斯拉并测得数千电子伏特的 D-D
              中子产生；Trenta（2020–2021）展现了超 10,000 次脉冲的持续运行能力，达到 1 亿摄氏度（9 keV）并在超 8 特斯拉磁压缩下运行。为在不中断核心运行的前提下为 Polaris
              及后续电站排查风险，Helion 搭建了专门的缩比试验台，包括 Vela（以 1 Hz 频率在模拟压缩磁体中切换 11 GJ 能量）、Polaris Junior
              Formation（2023–2025）以及验证下一代磁体和等离子体动力学的 Tiny Merge。


              第七代装置 Polaris 于 2024 年底在华盛顿州 Everett 竣工，目前正运行以验证净发电增益（即单次脉冲回收电能大于输入电能的关键节点）。2026 年 2 月，Polaris 测得可度量的 D-T
              聚变反应，等离子体温度创下 1.5 亿摄氏度纪录。与此同时，Helion 已在华盛顿州 Chelan 县 Malaga 启动 Orion 的建设；这座 50 MWe 商业示范电站旨在履行 2028
              年商业购电协议，向 Microsoft 数据中心输送清洁基荷电力。实现商业运营需要工业级规模化量产能力：Helion 着力扩建自建产线，将固态高压开关模块和储能电容器的年产量从 10 MJ 提升至 100,000
              MJ，同时运用确定性工业网络架构（EtherCAT、PTP/NTP）实现数千个脉冲功率元器件在微秒级容差内的精密同步。
