callouts:
  - calloutType: "insight"
    title: "The Steam Turbine Elimination Moat"
    body: "Helion's primary technological moat lies in eliminating the thermal Rankine cycle. While tokamak and stellarator competitors must develop fusion cores and simultaneously construct complex, capital-intensive steam turbine plants that suffer 60-70 percent thermodynamic heat rejection losses, Helion's direct electromagnetic Faraday recovery promises radically smaller plant footprints and lower balance-of-plant capex—provided FRC plasma physics behaves as modeled."
    claimRefs:
      - "CP004"
      - "CP007"
      - "CP008"
  - calloutType: "risk"
    title: "Binary Timeline and Substitution Risk"
    body: "Despite securing a $15.5 billion valuation, $1.5 billion in total capital, and the first commercial plant licenses in Washington State, Helion's commercial moat is fragile against timeline slippage. With Microsoft expecting 50 MW by 2028, any delay in proving net electricity gain with the Polaris prototype leaves Helion exposed to rapid displacement by advanced fission SMRs or firm geothermal power."
    claimRefs:
      - "CP011"
      - "CP012"
      - "CP015"
      - "CP016"
