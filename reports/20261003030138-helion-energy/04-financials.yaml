chapter:
  number: 4
  title: "Financials"
  summary: "Helion Energy operates as a pre-revenue fusion developer capitalized by over $1.5 billion in equity, anchored by a June 2026 Series G valuation of $15.5 billion. While backed by a commercial 50 MW power purchase agreement with Microsoft for 2028 delivery, the business faces acute financial exposure from confidential non-delivery penalty clauses, surging headcount-driven burn, and high capital intensity across prototype iterations and manufacturing scale-up."
sections:
  - id: "revenue-streams-and-pricing-architecture"
    title: "Revenue Model, Contracting Architecture, and Commercial Pricing Mechanisms"
    body: "Helion Energy remains entirely pre-revenue as of late 2026, with zero commercial generation receipts recognized to date. The company's future revenue architecture is anchored on long-term power purchase agreements (PPAs) structured around baseload electricity offtake. Its flagship commercial agreement is a binding 50 MW power purchase agreement signed with Microsoft in 2023, targeted for commercial delivery in 2028 to power regional data center clusters in central Washington. Under this contracting structure, Helion intends to monetize pulsed magneto-inertial fusion energy converted directly to electricity via electromagnetic induction, bypassing costly steam turbine cycles. However, realized pricing per megawatt-hour, indexation terms, and minimum take-or-pay volume thresholds remain strictly undisclosed private data, preventing rigorous external revenue underwritings. Furthermore, commercialization depends on executing transmission interconnection agreements with regional utilities, such as the Chelan County Public Utility District, which remains unresolved as the Orion generator site advances through earthwork."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI011"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "cost-structure-and-capital-burn"
    title: "Cost Structure, Headcount Inflation, and Capital Burn Dynamics"
    body: "The company's cost structure is heavily dominated by technical personnel, advanced manufacturing infrastructure, and prototype fabrication. Helion's workforce expanded dramatically to more than 800 employees by September 2026, accompanied by geographical expansion including a 15,631-square-foot business office in downtown Seattle in addition to five facilities in Everett and the Orion production site in Malaga. This rapid expansion drives an estimated annualized cash personnel burn exceeding $200 million when accounting for highly specialized engineering salaries, employer payroll taxes, and comprehensive benefits. Concurrently, capital expenditures remain elevated due to the in-house fabrication of specialized pulsed-power hardware—including proprietary capacitors and high-voltage semiconductor switches—at its dedicated assembly facilities. Operating runway is further strained by iterative prototype development, where unexpected plasma merging physics in the primary Polaris machine required funding a downsized intermediate testbed designated Tiny Merge to mitigate schedule slippage."
    claimRefs:
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI012"
      - "CI014"
  - id: "capital-adequacy-and-financing-dependency"
    title: "Capital Adequacy, Series G Financing, and Forward Solvency Verdict"
    body: "Helion dramatically bolstered its balance sheet in June 2026 by closing a $465 million Series G round led by Thrive Capital, which established a post-money valuation of $15.5 billion and elevated cumulative capital raised to more than $1.5 billion. While this equity infusion provides an estimated 18 to 24 months of operational and capital expenditure runway, Helion remains entirely dependent on external capital markets or customer advances until commercial power flows. Under the binding Microsoft PPA, CEO David Kirtley has confirmed that non-delivery carries contractual financial penalties if the 50 MW threshold is not achieved by 2028. If prototype plasma instability or plant interconnection delays postpone commercial operation, liquidated damages or contract breach penalties would compound cash depletion during a potential down-round financing window. Consequently, underwriting Helion requires treating its equity as a binary execution wager where forward solvency hinges on meeting 2028 commercial delivery milestones."
    claimRefs:
      - "CI004"
      - "CI005"
      - "CI009"
      - "CI010"
      - "CI013"
      - "CI015"
    tableRefs:
      - "TI003"
