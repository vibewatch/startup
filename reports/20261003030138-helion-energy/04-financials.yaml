callouts:
  - calloutType: "risk"
    title: "Binding PPA Delivery Penalties and Schedule Compression"
    body: "Unlike typical venture-stage clean tech R&D arrangements, Helion's contract with Microsoft includes enforceable financial penalties for failure to deliver 50 MW by 2028. Technical modifications in the Polaris prototype and the construction of the Tiny Merge testbed illustrate timeline compression that could trigger contractual liabilities."
    claimRefs:
      - "CI002"
      - "CI003"
      - "CI012"
  - calloutType: "insight"
    title: "Capital Sufficiency Governed by Binary Technical Inflection"
    body: "The $465 million Series G financing extends cash runway through 2027-2028, but capital intensity will escalate sharply as Helion transitions from small-scale assembly to multi-megawatt commercial deployment. Achieving net electricity output remains the sole gateway to non-dilutive project debt financing."
    claimRefs:
      - "CI004"
      - "CI005"
      - "CI010"
      - "CI015"
