- id: SO03
  title: Funding, valuation and investors
  body: On July 1, 2026, Venice AI announced a $65 million Series A led by Dragonfly at an approximately $1 billion valuation, its first external capital raise and the round that confirmed unicorn status. Participants included Coinbase Ventures, North Island Ventures, F-Prime Capital, Morgan Creek and other crypto-oriented investors, alongside founder equity from Erik Voorhees. Reporting indicates the round involved roughly 8.98% equity plus VVV token warrants, with proceeds earmarked in part for a proprietary data-center build-out, user growth, new-market entry, hiring and potential acquisitions. Notably, Venice was bootstrapped before this round and reportedly reached profitability, an unusual profile for a fast-growing consumer AI company and a factor that likely supported the premium valuation. At roughly 14x its reported $70 million ARR, the price sits at the lower end of AI-startup multiples, though the token warrants and crypto-native structure make an apples-to-apples equity comparison difficult. Whether the round included secondary share sales is not disclosed in retained sources.
  claimRefs:
  - CO019
  - CO013
  - CO014
  - CO015
