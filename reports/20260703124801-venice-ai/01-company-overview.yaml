company:
  name: Venice AI
chapter:
  number: 1
  title: Company Overview
  summary: Venice AI is a privacy-first AI platform founded in 2024 by Erik Voorhees and Jesse Proudman that reached unicorn status in July 2026 with a $65M Series A at a $1B valuation on roughly $70M ARR and 3M+ users.
sections:
- id: SO01
  title: Identity and business model
  body: Venice AI is a privacy-first artificial-intelligence platform that gives users access to more than 200 open-source and proprietary models across text, image and code through a single interface and an OpenAI-compatible API. Founded in 2024 by crypto entrepreneur Erik Voorhees and Seattle serial founder Jesse Proudman, and launched publicly in early 2025, Venice positions itself as a private, uncensored alternative to mainstream services such as ChatGPT and Claude. Its defining mechanism is a proxy architecture that strips identity, IP and metadata from prompts before they reach upstream providers, and a stated policy of never logging or retaining prompts or outputs. The company operates as a distributed, remote-first business corporately associated with Sheridan, Wyoming while drawing heavily on Seattle engineering talent. Venice monetizes through a freemium model with a paid Pro subscription tier and a native VVV token that can be staked to mint recurring daily AI compute credits, blending a conventional SaaS motion with crypto-native incentives.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  tableRefs:
