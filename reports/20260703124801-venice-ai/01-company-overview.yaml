- id: SO04
  title: Cover metrics and milestone chronology
  body: 'Venice AI’s public scoreboard is anchored by its Series A: $65 million raised, an approximately $1 billion valuation, about $70 million in annual recurring revenue, more than 3 million users and roughly 45 employees. The company also reports processing on the order of 85 billion tokens and 1.7 million API calls per day, and states it reached profitability in early 2026. The milestone chronology is compressed and fast: founding in 2024, the January 2025 launch of the VVV token on Base with a 100 million genesis supply and a 50 million airdrop, a rapid climb past 850,000 registered users in early 2025, introduction of the DIEM staking mechanism, the crossing of 3 million users in 2026, and the July 2026 unicorn round. External context mattered too: a late-June 2026 US export order restricting certain Anthropic models amplified demand for permissionless, privacy-first platforms. Independent user reviews are more mixed, with a 2.9/5 Trustpilot rating flagging support and quota frustrations that temper the growth story.'
