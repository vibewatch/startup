  evidenceGaps:
  - type: missing-source
    severity: material
    topic: Independent audit of Venice zero-logging privacy claims
    missingEvidence: No public third-party security or privacy audit validating the no-logging architecture was found.
    whyItMatters: The entire investment thesis rests on the privacy guarantee; an unverified claim materially raises technical and regulatory risk.
    diligencePath: Request a SOC 2 / independent penetration and privacy audit report and architecture review under NDA.
    relatedQuestionRefs:
    - QO025
  - type: missing-source
    severity: minor
    topic: Series A secondary share sales
    missingEvidence: Whether founders or early holders sold secondary shares in the Series A is not disclosed.
    whyItMatters: Secondary sales affect insider alignment and the true primary capital available for growth.
    diligencePath: Review the closing cap table and round documents for primary versus secondary allocation.
    relatedQuestionRefs:
    - QO026
  - type: private-evidence-only
    severity: minor
    topic: Board composition and governance
    missingEvidence: Venice AI board membership and formal governance structure are not disclosed publicly.
    whyItMatters: Governance quality and investor board rights shape oversight of a founder-driven company.
    diligencePath: Obtain the post-round governance documents and board roster from the data room.
    relatedQuestionRefs:
    - QO027
  - type: enumeration-incomplete
    severity: minor
    topic: Venice milestone history completeness
    missingEvidence: The public milestone record omits internal product and hiring events and some precise 2025 token dates.
    whyItMatters: An incomplete chronology can hide execution stumbles or overstate a clean growth narrative.
