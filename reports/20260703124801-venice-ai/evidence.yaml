evidenceGaps:
  - type: missing-source
    severity: material
    topic: Independent audit of Venice zero-logging privacy claims
    missingEvidence: No public third-party security or privacy audit validating the no-logging architecture was found.
    whyItMatters: >-
      The entire investment thesis rests on the privacy guarantee; an unverified claim materially raises technical and
      regulatory risk.
    diligencePath: Request a SOC 2 / independent penetration and privacy audit report and architecture review under NDA.
    relatedQuestionRefs:
      - QO025
  - type: missing-source
    severity: minor
    topic: Series A secondary share sales
    missingEvidence: Whether founders or early holders sold secondary shares in the Series A is not disclosed.
    whyItMatters: Secondary sales affect insider alignment and the true primary capital available for growth.
    diligencePath: Review the closing cap table and round documents for primary versus secondary allocation.
    relatedQuestionRefs:
      - QO026
  - type: private-evidence-only
    severity: minor
    topic: Board composition and governance
    missingEvidence: Venice AI board membership and formal governance structure are not disclosed publicly.
    whyItMatters: Governance quality and investor board rights shape oversight of a founder-driven company.
    diligencePath: Obtain the post-round governance documents and board roster from the data room.
    relatedQuestionRefs:
      - QO027
  - type: enumeration-incomplete
    severity: minor
    topic: Venice milestone history completeness
    missingEvidence: The public milestone record omits internal product and hiring events and some precise 2025 token dates.
    whyItMatters: An incomplete chronology can hide execution stumbles or overstate a clean growth narrative.
    diligencePath: Cross-check the milestone list against internal release notes and board decks.
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: material
    topic: Contradictory AI market-size estimates for 2026
    missingEvidence: Analyst estimates for inference and companion markets diverge widely with no reconciliation.
    whyItMatters: A wide TAM range makes Venice’s share and headroom hard to bound for underwriting.
    diligencePath: Commission or license a segment-specific sizing model isolating private consumer AI.
    relatedQuestionRefs:
      - QM006
      - QM028
  - type: missing-source
    severity: material
    topic: Independent sizing of the private consumer AI segment
    missingEvidence: No published report isolates the exact private-consumer-AI segment Venice serves.
    whyItMatters: Without a defined SAM, Venice’s growth ceiling and penetration cannot be estimated reliably.
    diligencePath: Build a bottoms-up SAM from privacy-tool adoption and paid-AI conversion rates.
    relatedQuestionRefs:
      - QM029
  - type: private-evidence-only
    severity: minor
    topic: Venice market share quantification
    missingEvidence: Segment-level revenue needed to compute market share is not disclosed.
    whyItMatters: Share trajectory is a core input to any market-based valuation cross-check.
    diligencePath: Request Venice segment revenue and user mix under NDA.
    relatedQuestionRefs:
      - QM030
  - type: missing-source
    severity: minor
    topic: Edge privacy-search competitors
    missingEvidence: Detailed positioning of edge players like Kagi against Venice is thinly documented.
    whyItMatters: Edge competitors could pick off Venice’s most privacy-motivated paying subscribers.
    diligencePath: Profile Kagi and similar tools’ AI features and pricing directly.
    relatedQuestionRefs:
      - QP035
  - type: private-evidence-only
    severity: minor
    topic: Head-to-head scale comparison with inference leaders
    missingEvidence: Venice does not disclose enterprise-comparable throughput or revenue for a like-for-like scale comparison.
    whyItMatters: Without comparable metrics, Venice’s relative scale versus Together and Fireworks is indicative only.
    diligencePath: Request comparable usage and revenue metrics under NDA.
    relatedQuestionRefs:
      - QP036
  - type: missing-source
    severity: material
    topic: Venice gross margin and unit economics
    missingEvidence: Gross margin, NRR, CAC, payback and churn are not disclosed publicly.
    whyItMatters: These determine whether reported ARR translates into durable, high-quality profit.
