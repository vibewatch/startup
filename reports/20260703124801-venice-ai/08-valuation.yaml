- id: SV03
  title: Financing and entry discipline
  body: 'Venice raised $65 million at a roughly $1 billion post-money valuation in its July 2026 Series A led by Dragonfly Capital, its first institutional round. At about $70 million ARR that implies roughly a 14x ARR multiple, which is a disciplined entry for a profitable, fast-growing AI company relative to peers. Because this is a first institutional round, preference and dilution overhang are modest, and public evidence — the ARR, more than 3 million users and reported profitability — broadly supports the price. The bootstrapped path to $70 million ARR is itself a valuation support, signaling capital efficiency that most venture-funded peers lack. The complication is the token: a VVV market capitalization near $650 million with a fully-diluted value above $1 billion provides an additional value reference, but it is volatile and introduces a parallel overhang that can diverge from equity value. An investor must therefore underwrite two linked but distinct value surfaces — the equity and the token — and be clear that public evidence supports the equity price while the token adds both optionality and uncertainty.'
  claimRefs:
  - CV016
  - CV017
  - CV018
  - CV019
  - CV020
  - CV021
  - CV022
  - CV023
- id: SV04
  title: Scenarios and sensitivity
  body: 'The range of outcomes is wide, which is why the recommendation is to monitor rather than commit. In a bull case, Venice consolidates leadership in private AI and scales to $200 million-plus ARR, supporting a $3-5 billion valuation as multiples hold. In a base case — the most probable given current profitability and traction — it reaches $120-150 million ARR at a 14-18x multiple, supporting roughly $2-2.5 billion. In a bear case, a token or regulatory shock combined with churn pushes value to $0.4-0.8 billion, below the round price. All three cases hinge on the same three variables: ARR growth, the token-classification outcome and margin durability as compute scales. The primary downside trigger is a securities action against VVV, which would hit both the token economy and the equity narrative at once. The sensitivity figure shows how implied valuation moves with the revenue multiple applied to $70 million ARR, and the range figure places the scenarios against the $1 billion entry, making clear that the base and bull cases offer attractive upside while the bear case is a real, regulation-driven loss.'
