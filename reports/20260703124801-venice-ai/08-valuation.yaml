- id: SV05
  title: Comparable valuation
  body: Comparables frame the price but do not settle it, because none of Venice’s peers share its privacy-plus-token model. The most relevant scaled reference is Together AI, which raised $800 million at an $8.3 billion valuation in July 2026 as a private-inference platform; Fireworks AI, reportedly in talks near a $15 billion valuation, is a more aggressive inference comparable. On the consumer side, Perplexity has carried a $9-20 billion valuation on roughly $200 million ARR, implying very high multiples that say more about AI hype than about Venice. Against the broader benchmark, AI startups traded around 20-30x revenue on a median basis in 2026, which places Venice’s roughly 14x at a discount to the median. The closest comparables are inference and aggregator platforms, but the honest limitation is that these multiples are noisy and often struck on tiny or zero revenue, so they bound the discussion rather than pin a number. The read-through is that Venice is priced conservatively relative to AI peers on an ARR basis, with the caveat that its crypto linkage and thin disclosure justify some of that discount.
  claimRefs:
  - CV030
  - CV031
  - CV032
  - CV033
  - CV034
  - CV035
  tableRefs:
  - TV004
- id: SV06
  title: Exit readiness and final diligence
  body: 'Venice is early, so exit analysis is about direction rather than timing. The likeliest paths are acquisition by a larger AI or privacy platform seeking a private-inference capability, or continued independent scaling; an IPO is distant given the company’s stage and crypto linkage. Venice is not exit-ready in the near term, and that is appropriate for a Series A company. What converts this from a monitor to an invest decision is a short, concrete diligence list: audited unit economics (gross margin, CAC, churn), a securities legal opinion on VVV, independent security and privacy audits, and cohort retention data — plus a governance review of preference terms and the token treasury. Two events would break the thesis outright: a securities or enforcement action against VVV, and a verified privacy breach. If the diligence asks are cleared favorably and neither kill-trigger fires, Venice is a compelling, if high-variance, opportunity that merits milestone-gated capital. The final judgment, therefore, is constructive-but-patient: a company worth tracking closely and backing on evidence, not on narrative.'
