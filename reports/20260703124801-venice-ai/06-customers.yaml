chapter:
  number: 6
  title: Customers
  summary: Venice AI has well-corroborated mass adoption — 3M+ total and 1M+ iOS users, heavy daily usage and ~$70M ARR — across privacy consumers, the crypto community and developers; but customer proof is cohort-level not logo-level, retention metrics are undisclosed, satisfaction proxies diverge, and demand is concentrated in the crypto community.
sections:
- id: SU01
  title: Customer base and segmentation
  body: Venice AI serves a consumer and prosumer base rather than enterprises, and it splits into a handful of recognizable cohorts. The largest is privacy-conscious consumers who want a no-log alternative to mainstream assistants for chat, image generation and private search. Overlapping heavily with it is the crypto community, an outsized cohort seeded by the VVV airdrop and Erik Voorhees’s following, for whom the token and staking mechanics are as much a draw as the AI. Creators use Venice’s uncensored image and text models to work without content filters, developers form a growing segment through the OpenAI-compatible API and community SDK, and a values-aligned niche of journalists, researchers and activists is drawn specifically to the no-logging promise. Geographically the base is global but US-centric, with the iOS app ranking in the US Productivity category. Crucially the payer is almost always the individual — via subscription or crypto — not a procurement-driven enterprise buyer, which shapes both the revenue profile and the concentration risks discussed later. Independent tool directories corroborate this positioning as a broad, private, uncensored consumer AI.
