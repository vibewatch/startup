  - TU003
  figureRefs:
  - FU003
- id: SU04
  title: Retention, satisfaction and durability
  body: 'Retention is the weakest-evidenced dimension of Venice’s customer story. The company discloses no net revenue retention, gross retention, churn or renewal metrics, so durability must be read from proxies. Those proxies diverge: the iOS app holds a respectable 3.7/5 rating across several hundred ratings, but Trustpilot shows a weaker 2.9/5 with recurring complaints about image quotas and slow support, and community sentiment, while broadly positive on privacy and breadth, includes real frustration over bugs and a desire for more transparency on data handling despite the no-logging claim. One structural retention lever is the DIEM staking mechanism: users who stake VVV for daily credits have an economic reason to stay, which likely makes the token cohort the stickiest. But without disclosed cohort data, the illustrative retention curves can only be scenario estimates. The net read is mixed-positive satisfaction with genuinely unknown quantitative retention — a material gap given how central recurring revenue is to the $70M ARR.'
  claimRefs:
  - CU024
  - CU025
  - CU026
  - CU027
  - CU028
  - CU029
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: SU05
  title: Expansion and concentration
  body: 'Venice’s expansion paths are real but early. The clearest is developer and API growth layered on top of higher subscription tiers, which can lift ARPU without a traditional sales motion, and the token-and-staking loop gives engaged users a reason to deepen usage. Multimodal breadth also supports cross-sell, moving a user from chat into image, audio and video within a single subscription. Against these sit concentration risks that diligence should weigh. The most material is dependence on the crypto community and token sentiment: a large share of demand is correlated with VVV and the broader crypto cycle, so a downturn in sentiment could hit both usage and monetization. The absence of enterprise contracts caps deal size and removes the land-and-expand dynamics that stabilize B2B revenue, even as self-serve neatly avoids procurement friction. Finally, the US-centric base is a geographic concentration to monitor as Venice expands internationally. None of these is disqualifying, but together they mean Venice’s customer quality is high on breadth and privacy alignment yet thin on the durability and diversification signals that de-risk revenue.'
