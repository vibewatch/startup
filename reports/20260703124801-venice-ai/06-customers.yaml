- id: SU03
  title: Named customer proof
  body: 'Because Venice is a self-serve consumer product, customer proof is cohort-level rather than logo-level, and that shapes how it should be underwritten. The strongest single proof point is the iOS user base: more than 1 million app users and a 3.7/5 App Store rating are concrete, third-party-verifiable evidence of real adoption. The crypto and privacy community is a second proof cohort, its mass adoption seeded by the airdrop and sustained by the token economy, while developers provide a third through API and SDK usage in private workflows. Founder Erik Voorhees functions as a visible individual advocate who lends credibility within crypto. What is missing is named enterprise references or outcome-specific case studies — there are no logos, deployment metrics or ROI testimonials of the kind a B2B diligence would expect. That is not necessarily a weakness for a consumer business, but it means the proof is aggregate adoption and app-store evidence rather than reference-quality accounts, and its freshness (mid-2026) is good but shallow. The enumeration of named proof is therefore explicitly partial.'
  claimRefs:
  - CU018
  - CU019
  - CU020
  - CU021
  - CU022
  - CU023
