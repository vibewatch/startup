- id: SU02
  title: Adoption trajectory
  body: 'On raw adoption, Venice’s numbers are strong and unusually well-corroborated for a young company. It reports more than 3 million users overall, and the iOS app alone has surpassed 1 million users with third-party analytics estimating 250,000-plus downloads and recent US growth near 50,000 per month. Engagement is heavy rather than nominal: the platform processes roughly 85 billion tokens and 1.7 million API calls per day, and that activity monetizes into about $70 million in ARR. Growth accelerated through 2025 and 2026 alongside the January 2025 token launch and the mobile release, powered by low-cost referral and community advocacy plus a free-to-paid conversion loop. The important caveat is denominators: Venice does not disclose DAU/MAU, the Android split, or a paid-versus-free breakdown, so while the top-line counts are credible, the intensity and quality of that usage per cohort remain partly inferred. Still, the combination of reported totals, app-store adoption and daily-usage figures makes the adoption trajectory one of the better-evidenced parts of the Venice story.'
