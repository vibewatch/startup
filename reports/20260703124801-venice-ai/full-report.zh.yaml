      - number: '2.2'
        title: 多重视角下的市场规模
        blocks:
          - type: paragraph
            body: >-
              没有一个数字能概括 Venice 的市场，因此我们从四个视角交叉校准。AI 推理市场——Venice 依托的基础设施层——预计 2026 年接近 $117.8B，2034 年约 $312.6B，CAGR 约
              12.98%；另一组估算则认为 2025 年为 $125.8B，到 2034 年升至 $536.9B，显示分歧不小。Venice 所引领的隐私保护 AI 细分更小但更快，预计从 2025 年约 $3.9B 增至
              2033 年 $23.9B，增速 25.4%。更宽的生成式 AI 市场大得多，2026 年约 $83.3B，并走向 2035 年 $988B；更贴近的生成式 AI 聊天机器人板块，2026 年约
              $13.19B，增速约 31%。AI 伴侣相邻市场还会再增加 $5B–$48B，取决于定义。所有视角都显示两位数或更高增长，但区间很宽；Venice 约 $70M
              ARR，即便放在狭义隐私细分里也只意味着低个位数份额。
