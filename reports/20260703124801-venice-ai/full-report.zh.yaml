            body: >-
              2026 年 7 月 1 日，Venice AI 宣布完成由 Dragonfly 领投的 $65M Series A，估值约 $1B。这是公司首轮外部融资，也确认了独角兽身份。参投方包括 Coinbase
              Ventures、North Island Ventures、F-Prime Capital、Morgan Creek 等偏加密投资人，创始人 Erik Voorhees 也投入股权。据报道，本轮约包含
              8.98% 股权加 VVV 代币认股权证，部分资金将用于自有数据中心建设、用户增长、新市场进入、招聘和潜在收购。值得注意的是，Venice 在此轮前一直自举经营，并据称已实现盈利；对一家高速增长的消费 AI
              公司来说，这种画像少见，也可能支撑了溢价估值。按报告的 $70M ARR 计算，价格约为 14x ARR，处在 AI
              初创公司倍数的较低端；不过代币认股权证和加密原生结构让股权口径的横向比较并不干净。保留来源未披露本轮是否包含老股出售。
