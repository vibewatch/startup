      - number: '8.6'
        title: 退出准备度与最终尽调
        blocks:
          - type: paragraph
            body: >-
              Venice 还早，退出分析看方向，不看时间表。最可能的路径是被更大的 AI 或隐私平台收购，以获得私有推理能力；另一条是继续独立扩张。考虑到公司阶段和加密关联，IPO 仍很遥远。短期内 Venice
              尚不具备退出准备，这对 Series A 公司是合理状态。要把“观察”转成“投资”，需要一张短而具体的尽调清单：经审计的单位经济（毛利率、CAC、流失）、VVV 的证券法律意见、独立安全和隐私审计、分
              cohort 留存数据——另加对优先权条款和代币金库的治理审查。两类事件会直接击穿投资假设：针对 VVV 的证券或执法行动，以及经证实的隐私泄露。如果尽调问题得到有利解决，且两个否决触发器都没有触发，Venice
              就是一个值得按里程碑投入资本的高波动但有吸引力机会。因此最终判断是建设性但耐心：这家公司值得密切跟踪；要支持，也应基于证据，而不是叙事。
            claimRefs:
              - CV036
