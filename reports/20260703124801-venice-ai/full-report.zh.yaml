  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资正反命题
        blocks:
          - type: paragraph
            body: >-
              Venice 的投资逻辑立在一个简单判断上：隐私 AI 这个品类真实且在增长，Venice 是早期领先者，并且用异常高的资本效率跑到了这个位置。正向论点有四条腿——庞大且扩张的隐私 AI 与推理市场，覆盖 200
              多个模型、以隐私为设计起点的差异化产品，约 $70M ARR 对应的罕见盈利信号，以及能带来低成本分发的创始人品牌。反向论点同样具体。Venice 的加密原生设计叠加了纯 SaaS
              同业没有的代币和监管风险；最尖锐的单一问题，是 VVV 是否属于证券。收入集中在加密社区，因此与加密周期相关；其核心承诺——不留日志——也没有任何第三方验证。坦率看，护城河不是专有
              IP，而是一体化隐私体验和品牌，因为 Venice 提供的是任何人都可以托管的同一批开放模型。因此，投资问题变成：在监管或竞争压力侵蚀领先地位之前，执行和信任能否把早期领先转成持久价值。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
