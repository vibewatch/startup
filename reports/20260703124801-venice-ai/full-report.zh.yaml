      - number: '2.3'
        title: 买方与用户分层
        blocks:
          - type: paragraph
            body: >-
              Venice 的需求拆成几个预算负责人和采用路径各不相同的细分。注重隐私的消费者是已经验证的核心，他们用个人钱包为 Pro 订阅付费，换取无日志、更高额度访问。加密与自由意志主义社区是重要的早期采用者群体，约
              8% 用户用加密货币支付，反映 Venice 的代币原生设计和创始人品牌。开发者构成增长中的细分，OpenAI 兼容 API 以 token 计量额度服务他们，让 Venice
              在消费者订阅之外多了第二个变现界面。记者、活动人士和其他高威胁模型用户，是规模小但战略意味强的利基。最关键的未解问题是企业：法律、医疗和新闻等受监管买方显然有隐私需求，但 Venice
              很少披露生产级企业采用证据，因此该细分仍处萌芽且未被证明。贯穿所有群体，Venice 能从免费增值基数中做出约 $70M ARR，说明用户愿为隐私付费。
