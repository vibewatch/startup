      - number: '7.7'
        title: 图表
        blocks:
          - type: callout
            title: 代币定性是最尖锐的外部风险
            body: 如果 VVV 被认定为证券，为回购并销毁和 DIEM 积分提供资金的代币经济会被直接牵连——这是击穿投资假设的触发器。
