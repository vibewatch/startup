  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Venice AI 是一个隐私优先的人工智能平台，把 200 多个开源和专有文本、图像、代码模型整合到单一界面和 OpenAI 兼容 API 里。公司由加密企业家 Erik Voorhees 与西雅图连续创业者
              Jesse Proudman 于 2024 年创立，并在 2025 年初公开发布；Venice 把自己定位成 ChatGPT、Claude
              等主流服务之外的私密、无审查替代品。它的核心机制是一套代理架构：提示词到达上游提供商之前，系统会剥离身份、IP
              和元数据；公司也声明从不记录或保留提示词和输出。公司以分布式、远程优先方式运营，公司关系上关联怀俄明州 Sheridan，同时大量吸收西雅图工程人才。Venice 靠免费增值模式变现，付费 Pro
              订阅层之外，还发行原生 VVV 代币；用户质押代币可铸造每日循环 AI 计算额度，把常规 SaaS 动作与加密原生激励揉在一起。
