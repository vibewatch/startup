      - number: '6.5'
        title: 扩张与集中
        blocks:
          - type: paragraph
            body: >-
              Venice 的扩张路径真实存在，但仍早期。最清晰的是在更高订阅层之上叠加开发者和 API 增长，无需传统销售动作也能抬升
              ARPU；代币与质押循环也给高参与用户提供深化使用的理由。多模态广度支持交叉销售，让用户在单一订阅内从聊天扩到图像、音频和视频。与此同时，尽调需要权衡集中风险。最重要的是对加密社区和代币情绪的依赖：很大一部分需求与
              VVV 和更广的加密周期相关，情绪下行可能同时打击使用和变现。缺少企业合同限制了单笔交易规模，也拿掉了稳定 B2B 收入的先落地再扩张 动态，尽管自助式模式巧妙避开了采购摩擦。最后，美国中心的用户基础是
              Venice 国际扩张时需要监控的地理集中。单看这些都不致命，但合在一起意味着 Venice 的客户质量在广度和隐私匹配度上很高，在降低收入风险所需的耐久性与多元化信号上仍偏薄。
