      - number: '7.4'
        title: 合作伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Venice 建在一整套外部依赖之上，其中几项已经结构性嵌入，并不容易替换。产品目录依赖开源模型生态，因此上游许可证或可用性变化可能扰乱 Venice
              的供给，不过多模型覆盖在一定程度上分散了这一风险。推理容量依赖 DePIN GPU 供应商，把算力供给风险集中在一个仍未成熟的市场。最深的依赖是 Base 区块链，VVV 和 DIEM
              积分都在其上运行——如果链稳定性出问题，或 Base 政策变化，代币轨道会直接受冲击。支付通道（加密和银行卡处理商）暴露在政策变动下；资本层面，Dragonfly
              作为领投方的集中度，也构成治理和后续融资依赖。最后，监管者本身也是外部依赖，一次行动就能同时约束代币和内容模式。依赖图展示这些交易对手如何汇入平台；实际含义是，Venice
              的韧性只和其中最难替换的一环一样强，而今天这一环就是 Base/VVV 代币基础设施。
