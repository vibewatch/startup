            body: >-
              最适合把 Venice AI 理解成通往开源 AI 的隐私优先前门。按客户工作流看，它能做主流助手能做的事——跨 100 多个文本模型聊天、生成和编辑图像、用 50+
              声音合成语音、转录音频并生成视频——但加了一个决定性转折：提示词和输出不记录，也从不用来训练。公司把这一切放在单一 OpenAI 兼容 API 密钥后面，因此无论用户在 Venice Web
              应用、浏览器、移动应用还是开发者集成里，同一个请求都能工作。一个有辨识度的产品选择，是把无审查、无限制模型与可配置系统提示词和角色人格结合起来，这让可服务用例超出重过滤
              既有巨头允许的范围。Web、浏览器扩展、移动端和 API 的访问广度，使 Venice 能用一个平台同时服务非技术隐私寻求者和开发者；OpenAI 兼容也意味着，采用 Venice 可以简单到只替换 base
              URL 和密钥。
