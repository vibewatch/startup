        title: 客户基础与分层
        blocks:
          - type: paragraph
            body: >-
              Venice AI
              服务的是消费者和专业消费者基数，而非企业，并可拆成几个清晰群体。最大的一群是注重隐私的消费者，他们想要一个替代主流助手的无日志选项，用于聊天、图像生成和私密搜索。与之高度重叠的是加密社区，这个群体被 VVV
              空投和 Erik Voorhees 的追随者放大；对他们来说，代币和质押机制与 AI 本身一样有吸引力。创作者使用 Venice 的无审查图像和文本模型，绕开内容过滤工作；开发者通过 OpenAI 兼容 API
              和社区 SDK 构成增长细分；一小群价值观一致的记者、研究人员和活动人士，则专门被无日志承诺吸引。地理上，用户基础全球化但偏美国，iOS
              应用在美国生产力类别有排名。关键是，付款方几乎总是个人——通过订阅或加密货币——而不是采购驱动的企业买方；这同时塑造收入画像和后文讨论的集中风险。独立工具目录也印证了这一定位：广泛、私密、无审查的消费 AI。
