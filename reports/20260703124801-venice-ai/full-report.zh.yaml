              - CR006
              - CR009
      - number: '7.3'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              运营上，最关键的风险是信任集中在隐私代理上。推理前去除身份和 IP 的正是这个组件，一旦被攻破——哪怕概率很低——后果会是灾难性的，Venice 产品赖以成立的承诺会被打穿。SOC 2、ISO 27001
              认证和任何第三方审计都缺席，虽然这本身不是泄露，但让核心主张停留在未验证状态，也实实在在挡住企业信任。隐私之外，提供 200
              多个开源模型也把部分任务上的质量与安全失误风险带进来，且没有公开基准可以给出边界。降低成本的去中心化 GPU
              供给，同时带来可靠性、宕机和一定供应商集中风险；用户快速增长时，基础设施和社区支持同步扩张，也会拉紧单薄的运营底座。即便一次泄露没有触及提示词，比如只涉及账单或元数据，对一家以隐私为品牌的公司也会造成严重声誉伤害。这些风险单独看都不太可能致命，但主题相同：支撑
              Venice 的信任，目前靠的是架构和声誉，而不是外部保证。
            claimRefs:
              - CR012
              - CR013
              - CR015
              - CR014
