        title: 创始人、领导层与关键人物敞口
        blocks:
          - type: paragraph
            body: >-
              Venice AI 由创始人兼 CEO Erik Voorhees 领导。他早年创办 ShapeShift 和 SatoshiDice，其加密自由意志主义者个人品牌已经和公司叙事绑在一起。联合创始人 Jesse
              Proudman 是西雅图连续创业者，曾将 Blue Box 出售给 IBM、将 Makara 出售给 Betterment；他担任总裁兼 CTO，主导隐私架构判断。COO Teana Baker-Taylor
              带来 Circle 和 Crypto.com 的运营经验，团队还包括营销副总裁 Austin Virts、工程负责人 Tim Shakarian 和战略负责人 Jonathan Shapiro。到 2026
              年中，公司从一年前约 15 人扩到约 45 人。最重要的治理观察是关键人物依赖：Venice 的定位、融资和公共声音都高度依赖
              Voorhees；他过往创业项目多次与监管方和解，也给尽调带来必须衡量的声誉风险。董事会构成和正式治理安排在公开记录中仍未披露。
