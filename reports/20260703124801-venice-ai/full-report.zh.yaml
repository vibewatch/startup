      - number: '7.5'
        title: 财务、商业模式与执行风险
        blocks:
          - type: paragraph
            body: >-
              财务和执行层面，代币既是资产也是风险。VVV 约 14%
              的通胀，以及用收入出资的回购并销毁，把商业模式系在代币价格波动上；随着算力成本扩张，免费增值隐私模式能否持续还没被证明。收入集中在加密社区，因此与加密周期相关，下行周期可能同时打击使用量和变现；如果算力成本涨得快于定价，毛利也可能被压缩。计划中的自有数据中心战略上说得通，但会抬高资本强度和执行风险。人是另一层风险：Venice
              是创始人品牌公司，暴露在 Erik Voorhees 和 Jesse Proudman 的关键人风险下；Voorhees 的加密背景叠加用户评价分化，也带来声誉风险，可能挡住企业或主流采用。约 45
              人的团队，对其扩张野心来说偏薄。这些风险大多是中等严重度、可管理，但会相互作用——代币冲击、声誉事件和利润率不及预期如果同时到来，破坏力会远超任一单点风险。
