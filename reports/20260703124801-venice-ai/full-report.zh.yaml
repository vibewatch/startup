      - number: '6.4'
        title: 留存、满意度与耐久性
        blocks:
          - type: paragraph
            body: >-
              留存是 Venice 客户故事中证据最弱的一环。公司未披露净收入留存、总留存、流失率或续约指标，因此只能通过代理变量读取耐久性。这些代理变量彼此分化：iOS 应用在数百个评分中保持 3.7/5，表现尚可；但
              Trustpilot 为 2.9/5，反复出现图像额度和支持慢的投诉；社区情绪虽整体看好隐私和广度，也对 bug 以及无日志声明下数据处理透明度不足表达真实不满。一个结构性留存杠杆是 DIEM 质押机制：用户质押
              VVV 获取每日额度，就有经济理由留下，这可能让代币群体最黏。但没有披露群组数据，示意性的留存曲线只能是情景估算。净判断是满意度偏正面但混合，定量留存真实未知——考虑到经常性收入对 $70M ARR
              的核心性，这是重要缺口。
