    title: Venice AI 投资建议逻辑
    type: flow
    layout: wide
    summary: 从规模和证据出发，经风险和估值推导到投资建议。
    data:
      nodes:
        - id: scale
          label: 规模
          detail: 3M+ 用户，约 $70M ARR，已盈利
        - id: proof
          label: 证据
          detail: 采用证据强，留存披露薄
        - id: risks
          label: 风险
          detail: 代币 / 监管、隐私可验证性
        - id: valuation
          label: 估值
          detail: 约 14x ARR，相比 AI 同行合理
        - id: reco
          label: 观察
          detail: 质量高、波动大；按里程碑把关
      edges:
        - from: scale
          to: proof
          label: 支撑
        - from: proof
          to: reco
          label: 提供依据
        - from: risks
          to: reco
          label: 约束
        - from: valuation
          to: reco
