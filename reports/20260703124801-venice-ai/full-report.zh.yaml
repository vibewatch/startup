              Venice AI 的公开记分牌由 Series A 锚定：融资 $65M、估值约 $1B、年经常性收入约 $70M、用户超过 300 万、员工约 45 人。公司还称每天处理约 850 亿 token 和 170
              万次 API 调用，并表示 2026 年初已实现盈利。里程碑节奏紧凑且很快：2024 年创立，2025 年 1 月在 Base 上线 VVV 代币，创世供应 1 亿枚并空投 5000 万枚；2025
              年初注册用户迅速超过 85 万；随后引入 DIEM 质押机制，2026 年突破 300 万用户，并在 2026 年 7 月完成独角兽轮。外部环境也有影响：2026 年 6 月末，美国出口令限制部分
