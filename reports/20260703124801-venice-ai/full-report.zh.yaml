      - number: '5.6'
        title: 信任、隐私与质量控制
        blocks:
          - type: paragraph
            body: >-
              信任就是产品，所以控制措施值得细看。Venice 的核心控制是架构性的：无服务器端日志、浏览器内历史、剥离身份的代理，并配套声明不使用用户提示词或输出训练。这些是真实的设计选择，但主要仍是自我主张——Venice
              没有发布 SOC 2 或 ISO 27001
              认证，也没有第三方隐私审计；对需要外部保证的企业买方，这是实质缺口。没有公开审计就无法独立验证保证，用户实际上是在信任代理和公司承诺。质量上，服务开源模型意味着某些任务的输出可能落后于前沿专有模型；Venice
              接受这一取舍，用它换取隐私和广度。最后，无审查访问把内容安全责任更多推给用户，而不是由平台重过滤；这扩大了用例，也增加了误用敞口。合在一起，隐私声明验证、认证和质量基准测试是关键尽调领域。
            claimRefs:
              - CE032
              - CE033
              - CE034
              - CE035
              - CE036
              - CE037
