      - number: '6.3'
        title: 具名客户证明
        blocks:
          - type: paragraph
            body: >-
              Venice 是自助式消费产品，所以客户证明更多停留在群体层面，而不是客户标识层面；承销时也应如此处理。最强的单一证明点是 iOS 用户基础：超过 100 万应用用户和 3.7/5 App Store
              评分，是具体、可由第三方验证的真实采用证据。加密和隐私社区是第二个证明群体，空投播种了大规模采用，代币经济维持参与；开发者则通过私密工作流中的 API 和 SDK 使用提供第三个证明。创始人 Erik
              Voorhees 在加密圈是可见的个人倡导者，能增加可信度。缺口在于具名企业参考或结果型案例研究——没有客户标识、部署指标或 ROI 证明，这些是 B2B
