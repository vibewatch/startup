            body: >-
              单一界面下面，Venice 是一组模块，每个模块映射一个 API 端点：chat、image、audio、video、embeddings，外加管理付费访问的代币与额度模块。最重要的资产是模型目录——200
              多个开源模型，文本侧覆盖 Llama、Mistral、DeepSeek、Qwen，图像侧覆盖 Stable Diffusion 和 Flux 家族——这是 Venice 用隐私和便利性包装的原材料。音频模块增加
              50+ 多语言文本转语音声音和转录能力，视频模块处理文本、图像、参考图到视频生成。Agent 应用集成通过 OpenClaw、Hermes 和 NanoClaw，把这些模块延伸到
              WhatsApp、Telegram 和 Discord；embeddings 端点支持检索和 RAG。基于 VVV 和 DIEM
              质押的代币模块，则是加密原生层，用来计量计算额度，并把使用与链上经济绑定——这是主流竞争对手没有复制的设计。
