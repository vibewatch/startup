      - number: '6.2'
        title: 采用轨迹
        blocks:
          - type: paragraph
            body: >-
              从原始采用看，Venice 数字强劲；对一家年轻公司来说，佐证也异常充分。公司报告总用户超过 300 万，仅 iOS 应用就超过 100 万用户，第三方分析估计下载量超过 25 万，近期美国月增长接近 5
              万。互动不是名义上的：平台每天处理约 850 亿 token 和 170 万次 API 调用，并把这些活动变现为约 $70M ARR。2025 和 2026 年，随着 2025 年 1
              月代币上线和移动端发布，增长加速；低成本转介、社区拥护和免费转付费循环共同推动。重要保留是分母：Venice 未披露 DAU/MAU、Android
              拆分，或付费与免费比例；因此顶线数量可信，但各群体的使用强度和质量仍有一部分来自推断。即便如此，报告总量、应用商店采用和每日使用数据结合起来，使采用轨迹成为 Venice 故事中证据较扎实的一部分。
