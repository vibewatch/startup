  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局
        blocks:
          - type: paragraph
            body: >-
              Venice AI 所处的竞争环境异常拥挤且多层。最直接的对手是其他打隐私品牌的助手——Proton Lumo、DuckDuckGo 的 Duck.ai、Brave Leo 和
              Kagi——它们都承诺无日志或匿名化访问 AI。下一层，Together AI、Fireworks AI、Replicate、OpenRouter 等开源模型推理提供商，争夺 Venice 通过 OpenAI
              兼容 API 想服务的开发者工作负载。所有这些之上，是 ChatGPT、Claude、Gemini 等主流既有巨头；它们主导助手市场，设定模型质量基准，并拥有 Venice
              无法自然匹配的分发能力。终极替代品，是用 Ollama 等工具在本地跑开源模型；Apple、Samsung 的大科技端侧
              AI，也可能把隐私变成默认硬件功能。随着开源模型和推理商品化，新进入者持续出现，大企业甚至可以内部搭建私有推理。Venice 的答案不是单轴竞争，而是占据一个把广泛模型访问与隐私打包在一起的鲜明利基。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
