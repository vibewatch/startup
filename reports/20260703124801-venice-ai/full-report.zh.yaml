      - number: '2.4'
        title: 增长驱动、采用约束与规模测算缺口
        blocks:
          - type: paragraph
            body: >-
              多个顺风因素支持 Venice。主驱动力是用户越来越担心主流 AI 提供商会记录、也可能被迫披露提示词；2025-2026 年几起高调数据留存诉讼让这种担忧更尖锐。市场对无审查、无过滤 AI 的需求进一步把
              Venice 与护栏很重的既有巨头区分开，加密原生计算激励也帮助它保持有竞争力的价格。机构兴趣真实存在，隐私保护 AI 近期获得超过 $1.1B
              投资。但约束同样具体：隐私保护推理可能牺牲质量和延迟；不可验证的无日志声明会限制怀疑者转化；低切换成本削弱留存；演化中的 AI
              监管可能抬高无审查平台的合规和法律成本。最后，市场规模本身也是缺口。分析师估算差异很大，没有报告单独隔离 Venice 服务的私密消费级 AI
              细分；公司又未披露分部收入，真实市占率无法钉牢——这些都要求谨慎看待任何单一 TAM 数字。
