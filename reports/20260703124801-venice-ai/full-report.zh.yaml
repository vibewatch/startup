      - number: '5.5'
        title: 差异化
        blocks:
          - type: paragraph
            body: >-
              Venice 的差异化来自一组选择；单看每项，别处也能找到，但很少被放在一起。第一是设计上可验证的隐私——无日志加剥离身份的代理——再叠加无审查模型访问，两者合在一起定义了一个少有
              既有巨头进入的类别。第二是广度：一个 API 下有 200+ 模型，对比单模型助手和精选目录，用户可以为每个任务挑最合适的开源模型。第三是加密原生代币模型，VVV 和 DIEM
              额度创造变现，也带来一种主流竞争对手没有的锁定。第四，OpenAI 兼容降低切换成本，让 Venice 更像可直接替换的私密替代方案，而不是推倒重来。诚实的保留是，Venice
              的可防御性靠架构、品牌和社区，而非专有模型 IP——它服务的是任何人都能托管的同一批开源模型——因此护城河是整合体验和信任，而不是技术秘密。这让执行和声誉成为持久差异点。
            claimRefs:
              - CE027
              - CE028
              - CE029
              - CE030
              - CE031
