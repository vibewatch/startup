  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览与严重度
        blocks:
          - type: paragraph
            body: >-
              Venice AI 的风险直接来自它的独特性：加密原生、隐私优先的设计，把监管与波动性敞口叠在年轻 AI 公司的常规风险之上。按严重度排序，最重要的风险簇是代币和监管敞口——VVV
              是否会被认定为证券，以及内容和隐私规则如何演化。紧随其后的是运营信任风险，尤其是无日志保证是否可验证；这是整个价值主张所依赖的单一承诺。再往下是财务和执行风险：加密社区收入集中、计划中数据中心带来的资本密度，以及创始人与团队依赖。考虑
              Venice
              已经采取的缓释措施后，残余敞口集中在两处：代币经济的法律分类，以及隐私保证来自自我主张、并非外部审计。后续热力图会从可能性、影响、缓释成熟度和残余严重度给这些风险打分；它也清楚显示，残余风险最高的项目不一定最可能发生——而是低概率、高后果的场景，这是隐私加代币业务无法完全对冲的。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR012
              - CR030
              - CR028
      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              监管界面是 Venice 最复杂的风险。最尖锐的问题是 VVV 在美国是否构成证券；若出现不利分类，将牵连用于资助回购销毁和 DIEM 额度的代币经济。创始人记录会放大这一风险：Erik Voorhees
              此前的项目 ShapeShift 曾在 2024 年因作为未注册交易商运营与 SEC 和解，并支付 $275,000 罚款；这也是其加密项目长期监管摩擦模式的一部分。AI 侧，EU AI Act 的通用 AI
              义务已在 2025 年 8 月生效，罚款最高可达 €35M 或全球营业额 7%，因此 Venice 若服务欧盟用户，必须满足透明度义务。演化中的 AI
              隐私监管也可能审视无日志和不训练声明；无审查模型访问则为非法或有害生成内容带来法律敞口，Venice 通过用户责任模型管理这一点。OpenAI/New York Times
              数据留存争议等先例表明，即使隐私设计立场也会面对法律压力。风险登记表按严重度排序，但诚实结论是，加密 AI 混合体面对的监管组合仍在形成中。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
