      - number: '8.3'
        title: 融资与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Venice 在 2026 年 7 月完成 $65M Series A，投后估值约 $1B，由 Dragonfly Capital 领投，这是其首轮机构融资。按约 $70M ARR 计算，对应约 14x ARR
              倍数；相较同业，这是一家盈利、快速增长 AI 公司较有纪律的入场价格。由于这是首轮机构融资，优先权和稀释包袱都不重；公开证据——ARR、超过 300 万用户和据称已盈利——大体支撑这个价格。靠自举走到 $70M
              ARR，本身也是估值支撑，说明其资本效率高于多数 VC 资助的同业。复杂之处在代币：VVV 市值接近 $650M、完全稀释价值超过
              $1B，提供了额外价值参照，但它波动大，也引入一层可能偏离股权价值的平行包袱。因此投资人必须承做两个相连但不同的价值面——股权和代币——并明确一点：公开证据支撑股权价格，而代币同时增加上行选择权和不确定性。
            claimRefs:
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
      - number: '8.4'
        title: 情景与敏感性
        blocks:
          - type: paragraph
            body: >-
              结果区间很宽，这也是建议观察而非投入的原因。牛市情景下，Venice 巩固隐私 AI 领导地位，ARR 扩到 $200M 以上，在倍数维持时支撑 $3-5B
              估值。基准情景——考虑当前盈利和牵引力，这是最可能的情形——公司达到 $120-150M ARR，适用 14-18x 倍数，支撑约 $2-2.5B 估值。熊市情景下，代币或监管冲击叠加流失，把价值推到
              $0.4-0.8B，低于本轮价格。三种情景都取决于同三个变量：ARR 增长、代币定性结果，以及算力扩张时利润率能否守住。主要下行触发器是针对 VVV
              的证券行动，会同时打击代币经济和股权叙事。敏感性图展示把不同收入倍数套到 $70M ARR 后，隐含估值如何变化；区间图把各情景放在 $1B
              入场价格旁边，清楚显示基准和牛市情景有吸引力上行，而熊市情景是真实存在、由监管驱动的亏损。
            claimRefs:
              - CV024
              - CV025
