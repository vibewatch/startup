      - number: '3.2'
        title: 竞争对手画像
        blocks:
          - type: paragraph
            body: >-
              在隐私同类里，Proton Lumo 最接近、也可能是最强对手：它提供零访问加密和自有模型，配图像生成、记忆和商业模式；纯加密隐私上超过 Venice，但模型广度落后。DuckDuckGo 的 Duck.ai
              路线更轻，匿名化提示词并通过盲代理访问第三方模型，不需要账户，但不运行自有模型。开发者侧，Together AI 和 Fireworks AI
              是资金充足的推理头部，围绕开源模型覆盖、性能和价格竞争；不过二者瞄准企业和开发者规模，而非 Venice 的隐私优先消费者。Perplexity
              以快速增长的答案引擎身份竞争，用户基数很大但隐私保证较弱；Replicate 服务开发者，却没有消费者隐私叙事。ChatGPT 则高居其上，掌握约 77% 的聊天机器人转介流量份额，分发护城河巨大。Venice
              的平衡力量是真实的消费者规模——超过 300 万用户——这是少数隐私原生同类能拿出的指标。
