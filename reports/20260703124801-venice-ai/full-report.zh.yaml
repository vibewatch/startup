  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、替代品与定位
        blocks:
          - type: paragraph
            body: >-
              Venice AI 竞争的位置，落在两个分析师通常分开跟踪的市场交界处：消费级生成式 AI 助手，以及隐私保护型 AI 推理。因此，它的可服务市场覆盖付费助手订阅、按量计费 API
              推理和隐私工具预算，但不包括本地化企业模型训练、专用 AI 硬件和广告资助型助手。用户衡量 Venice 时，现状替代品是 ChatGPT、Claude、Gemini
              等主流助手，或者更技术化的路径：在本地运行开源模型。相邻市场——AI 伴侣、去中心化 GPU 计算、隐私浏览器或 VPN——会随时间拓宽潜在界面。在这个边界内，Venice
              明确把自己放在隐私优先位置，用一部分模型打磨度换取无日志、无审查体验。需求全球化且无需许可，但当前支出集中在北美，所以早期变现偏向该地区，长期机会仍是全球性的。这种消费者加基础设施的混合足迹，正是单一市场报告难以准确捕捉
              Venice 的原因。
