      - number: '8.5'
        title: 可比估值
        blocks:
          - type: paragraph
            body: >-
              可比公司能框定价格，却无法给出定论，因为 Venice 的隐私加代币模式没有真正同业。最相关的规模化参照是 Together AI，这家私有推理平台在 2026 年 7 月以 $8.3B 估值融资
              $800M；Fireworks AI 据称正洽谈接近 $15B 估值，是更激进的推理可比。消费者侧，Perplexity 在约 $200M ARR 上背过 $9-20B 估值，隐含倍数很高，更多说明 AI
              热度，而不是 Venice 本身。放到更广的基准里，2026 年 AI 初创公司收入倍数中位数约 20-30x，使 Venice 约 14x
              低于中位数。最接近的可比对象是推理和聚合平台，但必须承认，这些倍数噪音很大，且常常建立在很小甚至为零的收入上，因此只能约束讨论，不能钉死数字。读数是：按 ARR 看，Venice 相对 AI
              同业定价偏保守；但其加密关联和披露单薄，也解释了这部分折价。
            claimRefs:
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
          - type: table
            tableRef: TV004
            claimRefs:
