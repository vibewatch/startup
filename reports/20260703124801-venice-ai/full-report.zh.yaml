            body: >-
              Venice 的架构围绕一句承诺设计：服务器不应该知道是谁在提问。请求先经过隐私代理，推理前剥离用户身份和 IP；提示词和输出不在服务器端存储；对话历史留在用户浏览器里，而不是公司数据库。服务层运行 200+
              开源模型，算力部分来自去中心化 GPU 网络（DePIN 风格），而非单一集中式云，因此容量更弹性、成本更低。前面是一层位于 api.venice.ai/api/v1 的 OpenAI 兼容 API 网关，让现有
              OpenAI 客户端和工具几乎不用改动即可工作；更重的视频任务通过同步和异步作业队列处理。概念上，这个栈由客户端应用、API
              网关、隐私代理、模型服务和去中心化算力层层相接，代币模块计量付费使用。主要架构风险集中在代理层信任：隐私保证能否成立，取决于这个组件是否确实按声称方式运作。
