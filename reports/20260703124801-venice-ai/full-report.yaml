        title: Cover metrics and milestone chronology
        blocks:
          - type: paragraph
            body: >-
              Venice AI’s public scoreboard is anchored by its Series A: $65 million raised, an approximately $1 billion
              valuation, about $70 million in annual recurring revenue, more than 3 million users and roughly 45
              employees. The company also reports processing on the order of 85 billion tokens and 1.7 million API calls
              per day, and states it reached profitability in early 2026. The milestone chronology is compressed and
              fast: founding in 2024, the January 2025 launch of the VVV token on Base with a 100 million genesis supply
