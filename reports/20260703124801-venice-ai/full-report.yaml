              fast-growing consumer AI company and a factor that likely supported the premium valuation. At roughly 14x
              its reported $70 million ARR, the price sits at the lower end of AI-startup multiples, though the token
              warrants and crypto-native structure make an apples-to-apples equity comparison difficult. Whether the
