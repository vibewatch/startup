      - number: '7.2'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              The regulatory surface is Venice’s most complex risk. The sharpest question is whether VVV constitutes a
              security in the US; an adverse classification would implicate the token economy that funds
              buyback-and-burn and DIEM credits. That risk is amplified by the founder’s record: Erik Voorhees’s prior
              venture ShapeShift settled with the SEC for a $275,000 penalty in 2024 over acting as an unregistered
              dealer, part of a broader pattern of regulatory friction around his crypto ventures. On the AI side, the
              EU AI Act’s general-purpose-AI obligations came into force in August 2025 and carry fines up to €35
              million or 7% of global turnover, so Venice must meet transparency duties to serve EU users. Evolving
              AI-privacy regulation could also scrutinize the no-logging and no-training claims, and uncensored model
              access creates legal exposure for illegal or harmful generated content that Venice manages through a
              user-responsibility model. Precedents like the OpenAI/New York Times data-retention dispute show that even
              privacy-by-design positions can face legal pressure. The register orders these by severity, but the honest
              conclusion is that the regulatory set for a crypto-AI hybrid is still forming.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR001
