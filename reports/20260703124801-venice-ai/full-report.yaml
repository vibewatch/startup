      - number: '2.4'
        title: Growth drivers, adoption constraints and sizing gaps
        blocks:
          - type: paragraph
            body: >-
              Several tailwinds favor Venice. The dominant driver is rising concern that mainstream AI providers log and
              can be compelled to disclose user prompts, a fear sharpened by high-profile data-retention litigation in
              2025-2026. Demand for uncensored, unfiltered AI further differentiates Venice from guardrail-heavy
              incumbents, and crypto-native compute incentives help it price competitively. Institutional interest is
              real, with more than $1.1 billion recently invested into privacy-preserving AI. But the constraints are
              equally concrete: privacy-preserving inference can carry quality and latency tradeoffs, trust in
              unverifiable no-logging claims caps conversion among skeptics, low switching costs weaken retention, and
              evolving AI regulation could raise compliance and legal costs for an uncensored platform. Finally, sizing
              itself is a gap. Analyst estimates diverge widely, no report isolates the exact private-consumer-AI
              segment Venice serves, and without disclosed segment revenue its true market share cannot be pinned down —
              all reasons to treat any single TAM number with caution.
