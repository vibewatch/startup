              recognizable cohorts. The largest is privacy-conscious consumers who want a no-log alternative to
              mainstream assistants for chat, image generation and private search. Overlapping heavily with it is the
              crypto community, an outsized cohort seeded by the VVV airdrop and Erik Voorhees’s following, for whom the
              token and staking mechanics are as much a draw as the AI. Creators use Venice’s uncensored image and text
              models to work without content filters, developers form a growing segment through the OpenAI-compatible
              API and community SDK, and a values-aligned niche of journalists, researchers and activists is drawn
              specifically to the no-logging promise. Geographically the base is global but US-centric, with the iOS app
              ranking in the US Productivity category. Crucially the payer is almost always the individual — via
              subscription or crypto — not a procurement-driven enterprise buyer, which shapes both the revenue profile
              and the concentration risks discussed later. Independent tool directories corroborate this positioning as
