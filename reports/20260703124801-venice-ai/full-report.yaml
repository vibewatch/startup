      - number: '4.3'
        title: Cost structure and margins
        blocks:
          - type: paragraph
            body: >-
              Venice AI’s cost base is dominated by compute. GPU inference is the principal variable cost, and the
              company mitigates it by sourcing capacity partly through decentralized providers rather than paying
              hyperscaler list prices. Because Venice serves open-source models, it avoids the large proprietary
              model-licensing fees that weigh on some competitors, which helps gross margin. The strongest signal on
              profitability is that Venice reportedly reached positive margins in early 2026 on a lean, roughly
              45-person, remote-first cost base, implying healthy but undisclosed gross margins. Looking forward, the
              planned proprietary data-center build-out is a double-edged sword: it can lower long-run unit compute
              costs and deepen the privacy moat, but it converts flexible variable cost into fixed capex and raises
              capital intensity. On top of infrastructure economics, the VVV buyback-and-burn funded from revenue
              behaves like a capital-return cost tied to token performance, an additional call on cash that a purely
              equity-financed SaaS business would not carry.
