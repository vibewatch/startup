            body: >-
              No single figure captures Venice’s market, so we triangulate across four lenses. The AI inference market —
              the infrastructure Venice sits atop — is projected near $117.8 billion in 2026 and about $312.6 billion by
              2034 at a ~12.98% CAGR, though an alternative estimate puts 2025 at $125.8 billion rising to $536.9
              billion by 2034, showing meaningful dispersion. The privacy-preserving AI niche Venice leads is smaller
              but faster, growing from roughly $3.9 billion in 2025 to $23.9 billion by 2033 at 25.4%. The broader
              generative-AI market is far larger at about $83.3 billion in 2026 heading toward $988 billion by 2035, and
              the closer generative-AI chatbot segment sits near $13.19 billion in 2026 on a ~31% trajectory. The AI
              companion adjacency adds another $5–$48 billion depending on definition. Every lens shows
              double-digit-or-higher growth, but the ranges are wide, and Venice’s ~$70 million ARR still implies only a
              low-single-digit share of even the narrow privacy segment.
