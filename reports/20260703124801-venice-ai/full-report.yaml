            body: >-
              On July 1, 2026, Venice AI announced a $65 million Series A led by Dragonfly at an approximately $1
              billion valuation, its first external capital raise and the round that confirmed unicorn status.
              Participants included Coinbase Ventures, North Island Ventures, F-Prime Capital, Morgan Creek and other
              crypto-oriented investors, alongside founder equity from Erik Voorhees. Reporting indicates the round
              involved roughly 8.98% equity plus VVV token warrants, with proceeds earmarked in part for a proprietary
