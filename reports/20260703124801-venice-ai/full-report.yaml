      - number: '5.3'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              Venice’s architecture is engineered around a single promise: the servers should never know who is asking.
              Requests pass through a privacy proxy that strips user identity and IP before inference, prompts and
              outputs are not stored server-side, and conversation history lives in the user’s browser rather than a
              company database. The serving layer runs the 200-plus open-source models, and compute is drawn partly from
              decentralized GPU networks (DePIN-style) rather than a single centralized cloud, giving elastic and
              lower-cost capacity. Sitting in front is an OpenAI-compatible API gateway at api.venice.ai/api/v1, so
              existing OpenAI clients and tools work with minimal change, and heavier video jobs are handled through a
              synchronous and asynchronous job queue. Conceptually the stack layers client apps, the API gateway, the
              privacy proxy, model serving and decentralized compute, with the token module metering paid usage. The
              main architectural risk is concentration of trust in the proxy: it is the component that must behave
              exactly as claimed for the privacy guarantee to hold.
