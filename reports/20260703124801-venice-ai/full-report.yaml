  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue streams and pricing model
        blocks:
          - type: paragraph
            body: >-
              Venice AI monetizes through a layered model that blends conventional SaaS with crypto-native mechanics.
              The core is subscription: a Pro tier at roughly $18 per month unlocking unlimited text, generous image
              quotas and API access, and a higher Advanced tier near $68 per month with much larger monthly compute
              credits. Beneath these sit free and no-account tiers with daily caps that seed a conversion funnel. A
              second revenue surface is the OpenAI-compatible API, billed per token, which competes with open-model
              inference peers and gives Venice a developer channel beyond consumers. The third and most distinctive
              layer is token-linked: the DIEM mechanism lets users stake VVV to mint recurring daily AI credits, and
              roughly 8% of users pay in cryptocurrency. Revenue mix is not disclosed by stream, but it plausibly skews
              to consumer subscriptions with a growing API contribution. Token-denominated credits also complicate
              revenue recognition relative to a pure ratable-subscription model, a nuance diligence should probe.
