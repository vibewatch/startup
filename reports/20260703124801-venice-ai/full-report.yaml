  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk overview and severity
        blocks:
          - type: paragraph
            body: >-
              Venice AI’s risks flow directly from what makes it distinctive: a crypto-native, privacy-first design that
              layers regulatory and volatility exposure on top of the ordinary risks of a young AI company. Ranked by
              severity, the most material cluster is token and regulatory exposure — whether VVV is treated as a
              security and how content and privacy rules evolve. Just behind sit operational-trust risks, above all the
              verifiability of the no-logging guarantee, which is the single promise on which the whole value
              proposition rests. Below those are financial and execution risks: crypto-community revenue concentration,
              capital intensity from the planned data center, and founder-and-team dependence. After the mitigations
              Venice already has in place, residual exposure concentrates in two places: the legal classification of the
              token economy and the fact that the privacy guarantee is self-asserted rather than externally audited. The
              heatmap that follows scores these on likelihood, impact, mitigation maturity and residual severity, and it
              makes clear that the highest-residual items are not the most likely ones — they are the low-probability,
              high-consequence scenarios that a privacy-and-token business cannot fully insure against.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: figure
            figureRef: FR001
