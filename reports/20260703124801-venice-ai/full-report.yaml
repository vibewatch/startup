      - number: '3.2'
        title: Competitor profiles
        blocks:
          - type: paragraph
            body: >-
              Among privacy peers, Proton Lumo is the closest and arguably strongest rival: it offers zero-access
              encryption plus its own models with image generation, memory and a business mode, out-doing Venice on pure
              cryptographic privacy while trailing on model breadth. DuckDuckGo’s Duck.ai takes a lighter approach,
              anonymizing prompts and blind-proxying third-party models without accounts, but it runs no models of its
              own. On the developer side, Together AI and Fireworks AI are well-funded inference leaders competing on
              open-model coverage, performance and price, though both target enterprise and developer scale rather than
              Venice’s privacy-first consumers. Perplexity competes as a fast-growing answer engine with a large user
              base but weaker privacy guarantees, and Replicate serves developers without a consumer privacy story.
              Towering over all of them, ChatGPT commands roughly 77% of chatbot referral share, an enormous
              distribution moat. Venice’s counterweight is genuine consumer scale — more than 3 million users — which
              few privacy-native peers can claim.
