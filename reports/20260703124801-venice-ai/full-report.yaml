        title: Founders, leadership and key-person exposure
        blocks:
          - type: paragraph
            body: >-
              Venice AI is led by founder and chief executive Erik Voorhees, whose earlier ventures include ShapeShift
              and SatoshiDice and whose crypto-libertarian brand is inseparable from the company narrative. Co-founder
              Jesse Proudman, a Seattle serial entrepreneur who previously sold Blue Box to IBM and Makara to
              Betterment, serves as President and chief technology officer and owns the privacy architecture thesis.
              Chief operating officer Teana Baker-Taylor brings operating experience from Circle and Crypto.com, while
              the broader team includes VP of marketing Austin Virts, head of engineering Tim Shakarian and head of
              strategy Jonathan Shapiro. The company scaled to roughly 45 employees by mid-2026 from about 15 a year
              earlier. The most material governance observation is key-person dependence: Venice’s positioning,
              fundraising and public voice all lean heavily on Voorhees, and his repeated regulatory settlements from
              prior ventures introduce reputational risk that diligence must weigh. Board composition and formal
              governance remain undisclosed in the public record.
