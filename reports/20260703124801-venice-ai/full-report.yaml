  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, substitutes and positioning
        blocks:
          - type: paragraph
            body: >-
              Venice AI competes at the intersection of two markets that analysts usually track separately: consumer
              generative-AI assistants and privacy-preserving AI inference. Its addressable market therefore spans paid
              assistant subscriptions, metered API inference and privacy-tooling budgets, while excluding on-premise
              enterprise model training, dedicated AI hardware and advertising-funded assistants. The status-quo
              alternatives users weigh against Venice are the mainstream assistants ChatGPT, Claude and Gemini, or the
              more technical route of running open-source models locally. Adjacent markets — AI companions,
              decentralized GPU compute and privacy browsers or VPNs — widen the potential surface area over time.
              Within this boundary Venice positions itself explicitly as the privacy-first entrant, trading some model
              polish for a no-logging, uncensored experience. Because demand is global and permissionless yet current
              spend is concentrated in North America, early monetization skews to that region even as the long-run
              opportunity is worldwide. This hybrid consumer-plus-infrastructure footprint is exactly why a single
              market report cannot capture Venice cleanly.
            claimRefs:
