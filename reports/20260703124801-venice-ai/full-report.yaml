      - number: '5.6'
        title: Trust, privacy and quality controls
        blocks:
          - type: paragraph
            body: >-
              Trust is the product, so the controls deserve scrutiny. Venice’s central control is architectural: no
              server-side logs, in-browser history and an identity-stripping proxy, backed by a stated policy of not
              training on user prompts or outputs. These are genuine design decisions, but they are largely
              self-asserted — Venice publishes no SOC 2 or ISO 27001 certification and no third-party privacy audit,
              which is a material gap for enterprise buyers who need external assurance. Because the guarantees cannot
              be independently verified without open audits, users are effectively trusting the proxy and the company’s
              word. On quality, serving open-source models means outputs can trail frontier proprietary models on some
              tasks, a tradeoff Venice accepts in exchange for privacy and breadth. Finally, uncensored access shifts
              content-safety responsibility toward the user rather than heavy platform filtering, which expands use
              cases but raises misuse exposure. Together these make privacy claims verification, certification and
              quality benchmarking the key diligence areas.
