              DIEM staking mechanism, the crossing of 3 million users in 2026, and the July 2026 unicorn round. External
              context mattered too: a late-June 2026 US export order restricting certain Anthropic models amplified
              demand for permissionless, privacy-first platforms. Independent user reviews are more mixed, with a 2.9/5
