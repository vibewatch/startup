      - number: '2.3'
        title: Buyer and user segmentation
        blocks:
          - type: paragraph
            body: >-
              Venice’s demand splits into several segments with distinct budget owners and adoption paths.
              Privacy-conscious consumers are the proven core, paying out of personal wallets for Pro subscriptions that
              unlock unlogged, higher-quota access. The crypto and libertarian community is an important early-adopter
              cohort, and roughly 8% of users pay in cryptocurrency, reflecting Venice’s token-native design and its
              founder’s brand. Developers form a growing segment served by an OpenAI-compatible API with token-metered
              credits, giving Venice a second monetization surface beyond consumer subscriptions. Journalists, activists
              and other high-threat-model users represent a small but strategically resonant niche. The most
              consequential open question is enterprise: regulated buyers in legal, healthcare and journalism have
              obvious privacy needs, but Venice has disclosed little proof of production enterprise adoption, so that
              segment remains emerging and unproven. Across all of these, willingness to pay for privacy is demonstrated
              by Venice generating roughly $70 million ARR from a freemium base.
