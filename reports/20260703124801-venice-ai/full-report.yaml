      - number: '5.2'
        title: Modules and asset map
        blocks:
          - type: paragraph
            body: >-
              Underneath the single interface, Venice is a set of modules that each map to an API endpoint: chat, image,
              audio, video and embeddings, plus a token-and-credits module that governs paid access. The headline asset
              is the model catalog — more than 200 open-source models spanning Llama, Mistral, DeepSeek and Qwen for
              text and Stable Diffusion and Flux families for images — which is the raw material Venice packages with
              privacy and convenience. The audio module adds 50-plus multilingual text-to-speech voices and
              transcription, while the video module handles text-, image- and reference-to-video generation. Agent-app
              integrations extend these modules into WhatsApp, Telegram and Discord through OpenClaw, Hermes and
              NanoClaw, and the embeddings endpoint supports retrieval and RAG. The token module, built on VVV and DIEM
              staking, is the crypto-native layer that meters compute credits and ties usage to the on-chain economy — a
              design no mainstream competitor replicates.
