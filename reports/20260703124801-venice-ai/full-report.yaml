              - CR013
              - CR015
              - CR014
              - CR016
              - CR017
      - number: '7.4'
        title: Partner and dependency risk
        blocks:
          - type: paragraph
            body: >-
              Venice sits atop a stack of external dependencies, and several are structurally embedded rather than
              easily swapped. The product catalog depends on the open-source model ecosystem, so licensing or
              availability changes upstream could disrupt what Venice offers, though multi-model breadth diversifies
              this. Inference capacity depends on DePIN GPU providers, concentrating compute-supply risk in a
              still-maturing market. The most embedded dependency is the Base blockchain, on which VVV and DIEM credits
              run — chain instability or policy change there would hit the token rail directly. Payment rails (crypto
              and card processors) are exposed to policy shifts, and at the capital layer, concentration on Dragonfly as
              lead investor is a governance and follow-on-financing dependency. Regulators, finally, are an external
              dependency in their own right, able to constrain both the token and the content model with a single
              action. The dependency map visualizes how these counterparties feed into the platform; the practical
              implication is that Venice’s resilience is only as strong as the least substitutable of them, which today
              is the Base/VVV token infrastructure.
            claimRefs:
              - CR018
              - CR019
              - CR020
              - CR021
              - CR022
              - CR023
              - CR039
