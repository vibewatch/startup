      - number: '3.3'
        title: Capability, pricing and trust comparison
        blocks:
          - type: paragraph
            body: >-
              On capability, Venice’s headline advantage is breadth: a 200+ model catalog spanning text, image and code
              that dwarfs single-model privacy peers like Proton Lumo, paired with an OpenAI-compatible API that pure
              consumer tools lack. The tradeoff is that Venice offers more model choice but a less rigorous
              zero-knowledge guarantee than Proton’s zero-access encryption, so it wins on flexibility and loses on
              cryptographic purity. Pricing is competitive: Venice’s roughly $18-a-month Pro tier sits below ChatGPT
              Plus and Perplexity Pro, and its per-token API pricing competes with Together and Fireworks for
              developers. Where Venice diverges most is go-to-market and trust posture. Its distribution runs through
              founder brand and crypto-community channels rather than enterprise sales, and its deliberately uncensored
              stance differentiates it while raising regulatory and trust questions that compliance-focused incumbents
              avoid. Developers, meanwhile, multi-home freely across providers, so capability and price advantages
              rarely translate into durable lock-in.
