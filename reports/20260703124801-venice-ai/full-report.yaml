  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape
        blocks:
          - type: paragraph
            body: >-
              Venice AI sits inside an unusually crowded and multi-layered landscape. Its most direct competitors are
              other privacy-branded assistants — Proton Lumo, DuckDuckGo’s Duck.ai, Brave Leo and Kagi — each promising
              no-logging or anonymized access to AI. One layer down, open-model inference providers such as Together AI,
              Fireworks AI, Replicate and OpenRouter compete for the developer workloads Venice courts through its
              OpenAI-compatible API. Above all of them loom the mainstream incumbents ChatGPT, Claude and Gemini, which
              dominate the assistant market and set the model-quality benchmark, backed by distribution that Venice
              cannot match organically. The ultimate substitute is running open-source models locally through tools like
              Ollama, while big-tech on-device AI from Apple and Samsung threatens to make privacy a default hardware
              feature. Because open models and inference are commoditizing, new entrants keep appearing and large
              enterprises can even build private inference internally. Venice’s answer is to occupy a distinctive niche
              that pairs broad model access with privacy, rather than competing on any single axis.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
