  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and access
        blocks:
          - type: paragraph
            body: >-
              Venice AI is best understood as a privacy-first front door to open-source AI. In customer-workflow terms
              it does everything a mainstream assistant does — chat across more than 100 text models, generate and edit
              images, synthesize speech with 50-plus voices, transcribe audio, and produce video — but with a defining
              twist: prompts and outputs are not logged and are never used for training. The company exposes all of this
              behind a single OpenAI-compatible API key, so the same request works whether the user is in the Venice web
              app, a browser, a mobile app or a developer integration. A distinctive product choice is uncensored,
              unrestricted models paired with configurable system prompts and character personas, which broadens the
              addressable use cases beyond what heavily filtered incumbents allow. Access breadth — web, browser
              extension, mobile and API — lets Venice serve both non-technical privacy-seekers and developers from one
              platform, and the OpenAI compatibility means adopting Venice can be as simple as swapping a base URL and
              key.
