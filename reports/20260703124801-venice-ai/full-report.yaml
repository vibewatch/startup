              - CR006
              - CR009
      - number: '7.3'
        title: Operational, quality and security risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, the defining risk is concentration of trust in the privacy proxy. Because that component is
              what strips identity and IP before inference, a compromise — however unlikely — would be catastrophic,
              breaking the guarantee that defines the product. Compounding this is the absence of SOC 2 or ISO 27001
              certification and any third-party audit, which is not itself a breach but leaves the core claim unverified
              and is a real barrier for enterprise trust. Beyond privacy, serving 200-plus open-source models introduces
              quality and safety-failure risk on some tasks, with no public benchmarks to bound it. The decentralized
              GPU supply that lowers cost also introduces reliability and outage risk and some provider concentration,
              and scaling infrastructure and community support alongside a fast-growing user base strains a thin
              operational base. Even a breach that did not touch prompts — say billing or metadata — would be
              reputationally severe for a company whose brand is privacy. None of these is individually likely to be
              fatal, but they share a common theme: the trust that powers Venice is currently backed by architecture and
              reputation rather than external assurance.
            claimRefs:
              - CR012
              - CR013
              - CR015
              - CR014
              - CR016
              - CR017
              - CR040
          - type: table
            tableRef: TR002
            claimRefs:
