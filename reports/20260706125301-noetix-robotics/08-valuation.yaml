- id: TV005
  title: Thesis-break and kill triggers
  columns:
  - Trigger
  - Why it matters
  - Immediate implication
  rows:
  - - Safety or support failure during scale-up
    - Breaks partner and consumer trust
    - Pause conviction until controls are proven
  - - Weak conversion from publicity to paid demand
    - Exposes narrative over substance
    - Re-rate valuation downward
  - - Next financing needed before margin proof
    - Signals capital efficiency weakness
    - Assume current round did not buy enough execution time
  - - Severe channel concentration or partner underperformance
    - Shrinks market-access optionality
    - Reduce confidence in growth narrative
  notes: Kill triggers are designed as practical monitoring tests rather than abstract risk labels.
  enumerationScope:
