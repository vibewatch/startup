  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: valuation underwriting pack
    missingEvidence: Monthly revenue, realized ASP, gross margin, refund behavior, and support cost by SKU and channel.
    whyItMatters: Without this pack, valuation cannot be anchored to operating quality rather than narrative.
    diligencePath: Request monthly KPI dashboard and margin bridge under NDA before any investment decision.
    relatedQuestionRefs:
    - QV003
    - QV013
    - QV014
    - QV021
    - QV023
  - type: private-evidence-only
    severity: material
    topic: customer cohorts and channel economics
    missingEvidence: Repeat-purchase, conversion, cancellations, partner take-rates, and top-account concentration.
    whyItMatters: The market and product story can only justify the current price if demand quality is durable.
    diligencePath: Obtain cohort tables and partner-economics schedules for JD, distributors, and institutional channels.
    relatedQuestionRefs:
    - QV011
    - QV029
  - type: missing-source
    severity: material
    topic: comparable-set normalization
    missingEvidence: Consistent public revenue and margin disclosures for private Chinese humanoid peers.
    whyItMatters: Comparable valuation remains noisy when most peers are private and narrative-driven.
    diligencePath: Supplement public work with investor deck, banker, or expert-call data before anchoring a final price view.
    relatedQuestionRefs:
    - QV026
    - QV027
    relatedTableRefs:
    - TV004
  - type: enumeration-incomplete
    severity: minor
    topic: final diligence asks completeness
    missingEvidence: Cap table terms, liquidation preferences, and any channel-specific minimum purchase commitments.
    whyItMatters: The listed asks capture core value drivers but not every legal or preference-layer issue that could affect returns.
    diligencePath: Request financing documents, cap table, and partner contracts once the operating KPI pack is reviewed.
    relatedTableRefs:
    - TV006
acknowledgedWarnings:
- dimension: tableNotes
  reason: Every valuation table includes caveats, but scenario work and comparable framing still rely on public approximations.
- dimension: unverifiedSource
  reason: Several supplemental diligence URLs were reviewed outside the fetch-url audit trail, so the strict warning is acknowledged transparently.
