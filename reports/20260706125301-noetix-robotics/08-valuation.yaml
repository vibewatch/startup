- id: scenario-and-comparables
  title: Scenario framing and comparable valuation logic
  body: A sensible valuation view has to think in scenarios, not in a single heroic outcome. The bull case assumes that Noetix uses its funding and channel support to fill capacity, prove product quality, and maintain enough pricing power to show a margin path before the next financing event. The base case assumes steady but uneven adoption, meaningful strategic value, and continuing reliance on private capital while operational metrics remain partially opaque. The bear case assumes that price compression, support burden, or quality stumbles arrive before repeat demand is proven. Comparable work is useful but imperfect. Unitree is relevant because it combines shipment scale and visible pricing aggression. Public-market or quasi-public peers help frame what maturity might look like, but the whole humanoid category still suffers from inconsistent disclosure and narrative-heavy valuation benchmarks. That is why comparables can inform the debate without resolving it. In other words, scenarios
    matter more than point estimates because the disclosed evidence base is still lopsided.
  claimRefs:
  - CV007
  - CV008
  - CV009
  - CV015
  - CV016
  - CV017
  - CV018
  - CV019
  - CV020
