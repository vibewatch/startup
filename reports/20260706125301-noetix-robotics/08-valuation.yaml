    - Reliability and retention metrics are still missing
  - - Customers
    - JD.com and distributors prove real demand interest
    - Named enterprise-account durability is unproven
  - - Capital
    - Strategic and policy investors de-risk near-term funding
    - Strategic capital does not equal transparent unit economics
  - - Valuation
    - Could become fair if execution is strong
    - Already rich on disclosed fundamentals today
  notes: Thesis and anti-thesis are intentionally paired so that each positive signal is stress-tested by the most relevant counterpoint.
