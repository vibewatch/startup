  - FV003
- id: recommendation-and-kill-triggers
  title: Recommendation, confidence, and kill triggers
  body: 'The most defensible chapter-level recommendation is research-more, not because Noetix looks weak, but because the valuation already prices in a meaningful amount of success. Strategic and policy capital reduce near-term financing fear, and the platform story adds some optionality beyond a single hardware SKU. Even so, confidence should remain moderate at best because the public dataset remains too thin on revenue quality and unit economics. The company could still grow into the number if channel proof converts into durable shipments and margins improve. It could also disappoint if the sector''s price war accelerates or if support and quality economics prove worse than expected. The right posture is to keep conviction conditional. That means being explicit about kill triggers: a material safety or support failure, weak conversion from publicity to paid demand, or evidence that the next financing round is required before operational KPIs stabilize.'
  claimRefs:
  - CV021
  - CV022
  - CV023
  - CV024
  - CV025
  - CV026
  - CV027
  - CV028
  - CV029
  - CV030
  - CV035
  - CV036
  tableRefs:
  - TV005
  figureRefs:
  - FV004
- id: diligence-and-valuation-verdict
  title: Final diligence asks and valuation verdict
  body: 'The final valuation verdict is that Noetix is worth following closely, but not yet easy to underwrite at face value. Public evidence supports interest because the company has product reality, real channel momentum, and strong investors. Public evidence does not support complacency because the most important value drivers remain unverified: realized ASP, gross margin, repeat demand, refund behavior, support cost, and partner economics. Those are not secondary details; they are the bridge between strategic narrative and actual private-market return. The minimum next diligence pack should include monthly shipments by SKU and channel, realized margin, cancellations, service burden, and scenario-based cash planning. If those numbers are strong, the current valuation could ultimately look fair rather than stretched. If they are weak, the valuation already leaves too little room for error. That discipline is especially important in categories where private marks can move faster than audited
    proof.'
  claimRefs:
  - CV026
  - CV027
  - CV028
  - CV037
  - CV038
  - CV039
  - CV040
