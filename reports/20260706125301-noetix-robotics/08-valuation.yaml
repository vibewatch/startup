    - Sales / channel leadership
  - - Refunds, support tickets, and warranty cost
    - Needed to quantify post-sale burden
    - Operations / customer support
  - - Scenario cash model and next-round triggers
    - Needed to understand financing resilience
    - CEO / finance lead
  - - Named customer cohorts and repeat activity
    - Needed to verify durable demand
    - Sales / customer success
  notes: These asks are the minimum evidence package required to move from interesting narrative to investment-grade underwriting.
