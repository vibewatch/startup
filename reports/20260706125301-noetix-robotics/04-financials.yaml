    - Cannot test whether low pricing is economically rational
    - Request BOM, warranty reserve, and service attach analysis
  - - Cash burn and runway
    - No public cash-flow statement
    - Cannot assess next-round timing risk
    - Request monthly burn and cash-balance history
  - - Backlog conversion and churn
