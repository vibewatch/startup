  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: recognized revenue
    missingEvidence: Monthly recognized revenue, deferred revenue, and channel sell-through by SKU and geography.
    whyItMatters: Revenue quality cannot be underwritten from pre-orders and product pages alone.
    diligencePath: Request a 12-month management revenue bridge with shipped units, realized ASP, and cash collection by channel.
    relatedQuestionRefs:
    - QI010
    - QI030
  - type: private-evidence-only
    severity: material
    topic: gross margin and contribution margin
    missingEvidence: Gross margin by SKU, channel discounts, warranty reserve policy, and service attach economics.
    whyItMatters: A low-price hardware strategy can destroy value if contribution margin stays negative after support costs.
    diligencePath: Obtain BOM walk-throughs, warranty claims history, and contribution-margin waterfalls for Bumi, N2, and E1.
    relatedQuestionRefs:
    - QI018
    - QI020
    - QI033
  - type: missing-source
    severity: material
    topic: runway and leverage
    missingEvidence: Cash balance, monthly burn, debt obligations, and any project-finance or supplier-credit facilities.
    whyItMatters: Capital adequacy cannot be confirmed from fundraising headlines without balance-sheet data.
    diligencePath: Request cash-flow statements, debt schedules, and a 12-month operating budget tied to production milestones.
    relatedQuestionRefs:
    - QI028
    - QI029
  - type: enumeration-incomplete
    severity: minor
    topic: public financial gaps table completeness
    missingEvidence: Detailed disclosure on backlog aging, refunds, geographic mix, and service revenue contribution.
    whyItMatters: The listed gaps capture major blockers but not every secondary KPI that could affect valuation comfort.
    diligencePath: Ask management for a diligence KPI deck covering order book health and post-sale economics.
    relatedTableRefs:
    - TI005
