- id: traction-disclosure-and-gaps
  title: Traction signals, capital adequacy, and disclosure gaps
  body: 'Noetix is well capitalized by startup standards. Nine rounds in less than three years, a nearly RMB 1 billion Series B, and repeat investment from policy-linked capital together reduce immediate liquidity anxiety. The same evidence, however, also exposes the limits of public diligence: there is no disclosed cash balance, no burn rate, no debt schedule, and no bridge from orders to revenue recognition. That means investors can observe financing success, but not financial quality. The best-case interpretation is that strategic capital is funding a time-sensitive production land grab ahead of broad humanoid adoption. The more skeptical interpretation is that private capital is masking a margin-negative race for share in a sector where competitors are cutting prices and scaling supply even faster. Both can be true at once. As a result, capital adequacy looks acceptable for near-term operations, but only because outside investors have kept writing checks. Without audited financial statements
    or even consistent KPI disclosure, public evidence still leaves the central underwriting questions unresolved.'
  claimRefs:
  - CI013
  - CI014
  - CI015
  - CI016
