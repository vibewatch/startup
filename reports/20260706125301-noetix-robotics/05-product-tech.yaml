- id: trust-quality-and-compliance
  title: Trust, quality, security, and compliance posture
  body: 'Trust and quality disclosure lag the product narrative. Public materials show privacy, service-support, and after-sales surfaces, which is better than a purely experimental startup, but the company does not publish field-reliability data, safety-certification status, or a quantified incident history. That matters because humanoid robots are cyber-physical systems: the failure mode is not only a software bug or a mispriced sensor but also a fall event, a battery issue, a privacy complaint, or an insecure integration. External sources reinforce that this is now a board-level issue. Safety standards for walking robots increasingly focus on deployment context and application-specific certification, while Gartner, Lockton, and Autonomy Global all emphasize that AI-enabled devices expand identity, privacy, and liability exposures. Noetix has the beginnings of a trust surface, but the diligence bar for a home, school, or public-service robot is much higher than a simple web product. Evidence
    of controls exists; evidence of mature control performance does not.'
  claimRefs:
  - CE019
  - CE020
  - CE023
  - CE024
  - CE025
  - CE026
  - CE027
  - CE028
  - CE029
  - CE031
  - CE032
  tableRefs:
  - TE004
  figureRefs:
  - FE004
- id: maturity-and-technical-verdict
  title: Maturity map and technical verdict
  body: 'The overall product-tech verdict is positive on capability definition and ecosystem intention, but cautious on operational maturity. Noetix has enough public evidence to show that it has real SKUs, not placeholders; enough external listings to show that at least some products are distributed outside a closed lab context; and enough developer-signal surface to show a serious attempt at building a platform rather than a one-off machine. The remaining diligence gap is the one that separates impressive robots from investable product systems: repeatable reliability, certifiable deployments, and measurable third-party usage. The company may well clear that gap over time, especially given its funding and channel ambition, but the public record does not yet prove it. For now, Noetix should be understood as ahead on product articulation, ahead on ecosystem signaling, and behind on disclosed trust-and-quality metrics relative to what a scaled deployment buyer would eventually demand.'
  claimRefs:
  - CE031
  - CE032
  - CE033
  - CE034
  - CE035
  - CE036
