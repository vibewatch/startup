  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: field reliability
    missingEvidence: Installed-base uptime, MTBF, failure rates, and incident reports by SKU.
    whyItMatters: Without reliability metrics, it is impossible to distinguish a polished demo platform from a deployment-grade product system.
    diligencePath: Request service logs, fleet uptime, warranty claims, and reliability scorecards by product line.
    relatedQuestionRefs:
    - QE020
    - QE030
  - type: missing-source
    severity: material
    topic: certification status
    missingEvidence: Third-party safety certification records, deployment risk assessments, or audited compliance reports for specific robots.
    whyItMatters: Humanoid deployments increasingly require application-level safety validation, especially in public or household settings.
    diligencePath: Ask management for certification files, risk assessments, and customer deployment safety packages.
    relatedQuestionRefs:
    - QE021
  - type: missing-source
    severity: minor
    topic: developer adoption
    missingEvidence: Counts of external developers, SDK downloads, integrated apps, or active partner deployments.
    whyItMatters: Developer-signal surfaces are promising, but traction cannot be quantified from public pages alone.
    diligencePath: Request product analytics, repo activity summaries, and named ecosystem-partner case studies.
    relatedQuestionRefs:
    - QE029
  - type: enumeration-incomplete
    severity: minor
    topic: workflow use-case table completeness
    missingEvidence: A full deployment list across healthcare, retail, education, and service verticals.
    whyItMatters: The visible workflows are representative but not exhaustive of every vertical the company may be pursuing.
    diligencePath: Request customer deployment inventory and use-case taxonomy from product and sales leadership.
    relatedTableRefs:
    - TE002
