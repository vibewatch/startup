- id: architecture-and-developer-stack
  title: Architecture, software stack, and developer enablement
  body: 'The most interesting technical signal in Noetix is the combination of hardware definition with explicit ecosystem enablement. N2 documentation shows a robot with a substantial onboard stack: batteries, sensors, edge compute, and motion-control interfaces exposed through Python, C++, ROS, and Linux. ChinaBizInsider adds an operating-system claim that N2 uses OpenHarmony, which gives Noetix a plausible route into a broader Chinese device and developer ecosystem. Importantly, the company does not stop at product brochures. It publishes an official open-source page, a development-tools surface, a product SDK surface, and a document center. Those pages do not prove broad outside adoption, but they do show that management understands adoption bottlenecks for robotics platforms: customers, labs, and integrators need APIs, SDKs, documentation, and support artifacts if the robot is going to be more than a stage demo. The architecture story is therefore stronger than many early robotics startups,
    even if the company still discloses more intent than measured platform usage.'
  claimRefs:
  - CE007
  - CE008
  - CE009
  - CE010
