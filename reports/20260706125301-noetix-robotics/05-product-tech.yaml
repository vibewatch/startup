company:
  name: Noetix Robotics
chapter:
  number: 5
  title: Product / Tech
  summary: Noetix has a credible multi-product robotics stack with visible specifications, official SDK signaling, and an OpenHarmony-linked software layer. The strongest proof is around product definition and ecosystem intent, while the weakest proof remains reliability, certification depth, and quantified third-party developer adoption.
sections:
- id: portfolio-and-workflow
  title: Product portfolio and customer workflow definition
  body: 'Noetix is not selling a single humanoid robot with one buyer story. Its public product surface spans consumer-facing and education-friendly body robots such as Bumi, higher-capability locomotion platforms such as N2 and E1, and bionic interaction systems such as Hobbs 3 and Hobbs W1. That portfolio design matters because the product is defined in workflow terms: some units are designed to move, perform, and interact physically; others are designed to emote, guide, and support social presence. Public listings from the company, RBTX, and Aparobot all reinforce that Noetix is targeting research, education, demonstration, and service scenarios rather than a narrow industrial niche. This breadth is strategically useful because it expands the set of deployment experiments customers can run, but it also means each module may be at a different maturity level. From a diligence perspective, the right question is not “does Noetix have a product?” but “which product surfaces are already standardized
    enough to support repeatable deployment and support?”'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE021
  - CE033
  tableRefs:
  - TE001
  - TE002
