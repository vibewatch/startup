  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer cohorts
    missingEvidence: Cohort table with orders, deliveries, cancellations, repeat purchases, and support tickets by channel.
    whyItMatters: Without cohort evidence, early adoption cannot be translated into durable customer quality.
    diligencePath: Request channel-level cohort exports and monthly operating reviews for JD, distributors, and institutional buyers.
    relatedQuestionRefs:
    - QU013
    - QU016
    - QU023
    - QU024
  - type: missing-source
    severity: material
    topic: named enterprise customers
    missingEvidence: List of top institutional accounts, contract sizes, contract length, and current deployment stage.
    whyItMatters: Public proof today is channel-heavy and does not establish account-level durability or expansion.
    diligencePath: Request a top-20 customer schedule with pilot vs production classification and contract terms.
    relatedQuestionRefs:
    - QU012
    - QU026
  - type: missing-source
    severity: minor
    topic: satisfaction metrics
    missingEvidence: NPS, CSAT, complaint-resolution SLA, or published service outcomes.
    whyItMatters: Support pages show intent to serve customers but not whether customers are happy or retained.
    diligencePath: Ask customer success leadership for service dashboards and escalation data.
    relatedQuestionRefs:
    - QU015
  - type: enumeration-incomplete
    severity: minor
    topic: named customer proof table completeness
    missingEvidence: A fuller list of named reference customers beyond platforms and distributors.
    whyItMatters: The table intentionally captures the strongest public proof, but the public record may still understate or overstate actual deployment breadth.
    diligencePath: Collect customer references and signed case studies from sales leadership.
    relatedTableRefs:
    - TU003
