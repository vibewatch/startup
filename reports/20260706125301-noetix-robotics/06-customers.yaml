company:
  name: Noetix Robotics
chapter:
  number: 6
  title: Customers
  summary: Noetix has credible early adoption proof through JD.com pre-orders, a strategic JD partnership, and distributor visibility, but the public record is much stronger on top-of-funnel demand than on retention or enterprise-account durability. The chapter therefore supports real customer interest while preserving caution on concentration, conversion, and repeat usage.
sections:
- id: segments-and-proof
  title: Customer segments and the quality of adoption proof
  body: 'Noetix''s customer evidence is unusually channel-heavy for a startup at this stage. The company clearly targets households, education buyers, robotics labs, public-service venues, and distribution partners, but the strongest public proof does not come from a long list of named end customers. It comes from JD.com pre-orders, the JD strategic partnership, and distributor listings such as RBTX. That is still useful evidence because it proves someone is willing to market, list, and in at least one case reserve units for the product. It also shows that Noetix has matched product formats to distinct customer archetypes: Bumi for low-friction entry, N2 for research and demo buyers, and bionic systems for guidance and interaction use cases. What public proof does not yet show is deep account penetration or disclosed contract values. That means the customer story is real, but still early enough that investors should distinguish between visible demand signals and mature customer-base disclosure.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU010
  - CU011
  - CU012
  - CU016
  tableRefs:
  - TU001
  - TU003
  figureRefs:
  - FU003
- id: adoption-trajectory
  title: Adoption trajectory and customer journey
  body: The adoption curve visible in public sources starts with product visibility and accelerates into channelization. Bumi's 500-plus JD pre-orders are the clearest hard consumer datapoint. From there, Noetix deepened the story through a broader JD.com relationship that now covers product design, user operations, and channel expansion, while People's Daily places Noetix inside JD's JoyInside device ecosystem and broader humanoid retail push. RBTX adds a second layer of evidence by showing that Noetix can be merchandised to overseas technical buyers rather than only to Chinese consumers. Taken together, these signals imply a customer journey that runs from awareness and curiosity to listing, reservation, integration, deployment, and after-sales support. What remains opaque is how often that funnel ends in durable revenue or repeat orders. The public record supports real top-of-funnel momentum, but conversion quality and cohort durability still need direct diligence from management.
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU008
  - CU009
  - CU010
  - CU013
  - CU014
  - CU015
  - CU020
  - CU021
  tableRefs:
  - TU002
  figureRefs:
  - FU001
  - FU002
- id: retention-and-concentration
  title: Retention, repeat usage, and concentration risk
  body: 'This is where public disclosure thins out. No source reviewed for this chapter provides customer count, active installed base, churn, repeat purchase rate, renewal rate, or expansion rate inside named accounts. The company does have maintenance, after-sales, legal, and privacy surfaces, which suggests management expects an ongoing customer relationship rather than one-off gadget shipments. But a support surface is only the existence of a system, not proof that the system works well. The same is true of concentration. JD.com is so dominant in public evidence that it clearly constitutes customer or channel concentration risk, but public materials do not quantify revenue share by channel or partner. That leaves a tension at the center of the chapter: Noetix looks better than a pure prototype story because it has visible demand and support scaffolding, yet it still looks less mature than a scaled hardware business because its retention and concentration metrics remain private.'
  claimRefs:
  - CU017
  - CU018
  - CU019
  - CU023
  - CU024
  - CU029
  - CU030
  - CU031
  - CU032
  - CU033
  tableRefs:
  - TU004
  - TU005
  figureRefs:
  - FU004
- id: customer-verdict
  title: Customer verdict and diligence implications
  body: 'The customer verdict is therefore constructive but incomplete. There is enough public evidence to say that Noetix has crossed out of the purely hypothetical stage: consumers have pre-ordered Bumi, JD.com has committed to a deeper channel relationship, and a third-party marketplace is positioning N2 for technical buyers. That combination matters because it shows interest from both low-friction retail and higher-friction partner-led channels. At the same time, nearly every institutional metric that would make the story durable—active customers, repeat purchases, cohort retention, account concentration, refunds, support load, and expansion within named accounts—remains undisclosed. The right diligence next step is not to ask whether customers exist, but to request a cohort data pack that reconciles orders, delivered units, cancellations, support tickets, and repeat activity by channel. Until that information is available, Noetix should be treated as a company with credible adoption
    momentum and material durability unknowns. That missing cohort layer is the main gating item before calling the customer base durable.'
  claimRefs:
  - CU023
  - CU025
  - CU026
  - CU027
  - CU028
  - CU034
  - CU035
