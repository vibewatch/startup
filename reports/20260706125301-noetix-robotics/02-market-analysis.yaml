  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market sizing
    missingEvidence: Reconciliation between $9T global TAM (RBC) and $2B China near-term (Morgan Stanley) given wide methodological gaps
    whyItMatters: Investor decisions require actionable near-term sizing, not aspirational long-term projections
    diligencePath: Request segment-level bottom-up models from Morgan Stanley and RBC with explicit assumption sets
    relatedQuestionRefs:
    - QM015
  - type: missing-source
    severity: material
    topic: government procurement data
    missingEvidence: Specific provincial deployment targets and government order volumes for humanoid robots
    whyItMatters: Government demand may constitute majority of near-term orders; without it, consumer demand is overstated
    diligencePath: Request provincial five-year plan implementation documents and public procurement records
    relatedQuestionRefs:
    - QM017
    - QM026
  - type: missing-source
    severity: minor
    topic: price elasticity
    missingEvidence: Consumer willingness-to-pay studies or conversion rate data at various humanoid price points
    whyItMatters: Cannot validate whether sub-$1,500 truly unlocks mass adoption or remains a niche curiosity
    diligencePath: Conduct consumer survey or analyze JD.com conversion data at different price tiers
    relatedQuestionRefs:
    - QM023
  - type: missing-source
    severity: minor
    topic: switching costs quantification
    missingEvidence: Measured cost of transitioning from traditional EdTech tools to humanoid robot platforms
    whyItMatters: High switching costs would slow institutional adoption regardless of price point
    diligencePath: Interview education technology procurement officers and measure total cost of ownership
    relatedQuestionRefs:
    - QM025
