- id: buyer-segmentation
  title: Buyer, User, and Payer Segmentation
  body: The humanoid robot buyer landscape segments into four primary categories for Noetix's product portfolio. First, education institutions (schools, STEM programs, robotics competitions) purchase N2
    and E1 models as teaching platforms—budget ownership sits with school administrators or educational technology procurement departments, with adoption triggered by curriculum modernization mandates.
    Second, consumer households purchase Bumi as a companionship and programming education device—parents are the payers with children as primary users, triggered by STEM education demand and novelty value
    at the sub-$1,500 price point. Third, commercial enterprises (hotels, malls, event venues) purchase E1 and Hobbs models for reception, guiding, and brand activation—marketing or facilities management
    budgets fund these purchases. Fourth, research institutions and universities acquire N2 and E1 as development platforms—funded through research grants and departmental equipment budgets. The buying
    process for consumer products runs through e-commerce (JD.com) with low friction, while institutional sales require direct sales engagement, demonstrations, and procurement cycles of 1-3 months.
  claimRefs:
  - CM011
  - CM012
  - CM013
  - CM014
  - CM015
  tableRefs:
  - TM003
  figureRefs:
  - FM003
  - FM004
- id: drivers-and-constraints
  title: Growth Drivers and Adoption Constraints
  body: 'Growth is driven by five primary forces. First, government policy mandates through the 15th Five-Year Plan require provincial deployment targets and fund commercial pilots. Second, dramatic cost
    reduction—Noetix''s Bumi at $1,370 represents a 90%+ price reduction versus prior-generation humanoids, crossing the consumer affordability threshold. Third, the CCTV Gala moment created mass cultural
    awareness and normalized humanoid robots in Chinese households. Fourth, the OpenHarmony ecosystem integration positions humanoid robots as IoT nodes rather than standalone devices. Fifth, the broader
    Chinese manufacturing supply chain enables rapid production scaling. Constraints include: AI software gaps limiting real-world autonomy; safety and regulatory uncertainty as first national standards
    were introduced in March 2026; cybersecurity concerns for home-deployed connected robots; bubble risk from over-investment (140+ companies, potential overcapacity); and the consumer adoption gap between
    novelty interest and daily utility. The critical constraint is the autonomy gap—current robots excel at pre-programmed routines but cannot generalize to unstructured home environments.'
