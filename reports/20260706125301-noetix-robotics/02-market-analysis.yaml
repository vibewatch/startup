chapter:
  number: 2
  title: Market Analysis
  summary: The global humanoid robotics market is projected to reach $9 trillion by 2050 with China's segment at $2 billion in 2026 growing at 65%+ CAGR. Noetix operates in consumer/education humanoid robotics,
    a subsegment where sub-$10,000 pricing and government mandates drive rapid adoption.
sections:
- id: market-boundary
  title: Market Boundary and Definition
  body: The humanoid robotics market encompasses full-body bipedal robots designed for human-environment interaction, distinct from industrial robotic arms, autonomous vehicles, and software-only AI. Noetix
    competes specifically in the consumer and education humanoid segment—robots priced under $20,000 designed for home companionship, STEM education, commercial guiding, and light service tasks. Adjacent
    markets include industrial collaborative robots (cobots), quadruped robots, and social/companion robots without bipedal locomotion. Status-quo substitutes include educational tablets, smart home assistants
    (Alexa, Google Home), toy robots (without advanced locomotion), and human tutors/caregivers. The market boundary excludes industrial manufacturing robots, surgical robots, and autonomous drones. China's
    humanoid robot market is distinguished by heavy state involvement—the 15th Five-Year Plan (2026-2030) explicitly prioritizes robotics and embodied intelligence as strategic national technologies, creating
    both demand-pull through government procurement mandates and supply-push through subsidized R&D and manufacturing. The included spend encompasses hardware robots capable of bipedal locomotion priced
    from $1,000 to $100,000, their companion software platforms, maintenance contracts, and content ecosystems. Excluded spend covers pure software AI assistants, non-bipedal industrial robots, and medical
    robotic systems.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  tableRefs:
  - TM001
  figureRefs: []
- id: market-sizing
  title: TAM/SAM/SOM and Multi-Lens Sizing
  body: Multiple credible analyst projections frame the humanoid robotics opportunity. RBC Capital Markets projects a $9 trillion total addressable market for humanoid robotics globally by 2050, encompassing
    manufacturing, logistics, healthcare, household, and defense applications. For the near term, Morgan Stanley projects China's humanoid robot market at approximately $2 billion in 2026 with ~50,000 units
    shipped, representing a 79% upgrade from prior estimates driven by verified commercial deployments. By 2030, China's market alone is projected to reach $15 billion with 446,000 annual unit shipments,
    implying a 65%+ CAGR. The serviceable addressable market (SAM) for consumer/education humanoids—Noetix's primary segment—is a subset estimated at 15-20% of the total China humanoid market in 2026, or
    approximately $300-400 million, growing toward $2-3 billion by 2030 as cost curves fall below the $10,000 consumer threshold. Noetix's serviceable obtainable market (SOM) is constrained by its current
    production capacity of approximately 1,000 units/month (12,000/year) at average selling prices of $1,400-$10,000, implying maximum near-term revenue capacity of $17-120 million annually.
  claimRefs:
  - CM005
  - CM006
