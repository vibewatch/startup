evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Absolute revenue figures, revenue growth rate, and unit economics for Noetix Robotics
    whyItMatters: Cannot assess commercial viability or path to profitability without revenue data
    diligencePath: Request audited financials under NDA from management or Series B investors
    relatedQuestionRefs:
      - QO014
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Full board composition, governance documents, and shareholder agreement terms
    whyItMatters: Cannot evaluate governance quality or investor protections
    diligencePath: Request corporate registry filings and shareholder agreements
    relatedQuestionRefs:
      - QO025
      - QO016
  - type: missing-source
    severity: minor
    topic: adverse events
    missingEvidence: Court filings, regulatory actions, or product recall notices involving Noetix Robotics
    whyItMatters: Absence of adverse evidence is not evidence of absence; critical for risk assessment
    diligencePath: Search Chinese court databases (裁判文书网), SAMR filings, and product safety databases
    relatedQuestionRefs:
      - QO017
  - type: missing-source
    severity: minor
    topic: leadership table completeness
    missingEvidence: Full executive team and board member list beyond the three publicly named leaders
    whyItMatters: Cannot assess depth of management bench or governance quality
    diligencePath: Request management org chart and board composition from company IR
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: investor map completeness
    missingEvidence: Early seed/angel round investors and their terms are not publicly identified
    whyItMatters: Cannot assess full cap table composition or early investor influence on governance
    diligencePath: Request cap table and historical term sheets from company counsel
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone timeline completeness
    missingEvidence: Earlier seed/angel funding dates and undisclosed product development milestones from 2023-2024
    whyItMatters: Gaps in early history make it harder to assess development velocity and burn rate
    diligencePath: Request internal product development timeline and early funding history from management
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: material
    topic: market sizing
    missingEvidence: >-
      Reconciliation between $9T global TAM (RBC) and $2B China near-term (Morgan Stanley) given wide methodological
      gaps
    whyItMatters: Investor decisions require actionable near-term sizing, not aspirational long-term projections
    diligencePath: Request segment-level bottom-up models from Morgan Stanley and RBC with explicit assumption sets
    relatedQuestionRefs:
      - QM015
  - type: missing-source
    severity: material
    topic: government procurement data
    missingEvidence: Specific provincial deployment targets and government order volumes for humanoid robots
    whyItMatters: Government demand may constitute majority of near-term orders; without it, consumer demand is overstated
    diligencePath: Request provincial five-year plan implementation documents and public procurement records
    relatedQuestionRefs:
      - QM017
      - QM026
  - type: missing-source
    severity: minor
    topic: price elasticity
    missingEvidence: Consumer willingness-to-pay studies or conversion rate data at various humanoid price points
    whyItMatters: Cannot validate whether sub-$1,500 truly unlocks mass adoption or remains a niche curiosity
    diligencePath: Conduct consumer survey or analyze JD.com conversion data at different price tiers
    relatedQuestionRefs:
      - QM023
  - type: missing-source
    severity: minor
    topic: switching costs quantification
    missingEvidence: Measured cost of transitioning from traditional EdTech tools to humanoid robot platforms
    whyItMatters: High switching costs would slow institutional adoption regardless of price point
    diligencePath: Interview education technology procurement officers and measure total cost of ownership
    relatedQuestionRefs:
      - QM025
  - type: missing-source
    severity: material
    topic: market share
    missingEvidence: Precise market share data for each competitor in the China consumer humanoid segment
    whyItMatters: Cannot assess relative competitive position without share data
    diligencePath: Request shipment data from Morgan Stanley or track JD.com/Tmall sales rankings
    relatedQuestionRefs:
      - QP012
  - type: private-evidence-only
    severity: material
    topic: competitor funding
    missingEvidence: Total funding raised and current runway for Galbot, MagicLab, and smaller competitors
    whyItMatters: Cannot assess which competitors will survive consolidation without capital adequacy data
    diligencePath: Monitor PitchBook/Crunchbase for funding announcements; request LP reports
    relatedQuestionRefs:
      - QP022
  - type: missing-source
    severity: minor
    topic: switching costs
    missingEvidence: Measured customer switching costs and lock-in mechanisms across platforms
    whyItMatters: Low switching costs mean competitive advantages can erode quickly
    diligencePath: Survey robot owners about platform migration difficulty and content portability
    relatedQuestionRefs:
      - QP016
  - type: missing-source
    severity: minor
    topic: production volume comparison
    missingEvidence: >-
      Verified production volume data for Unitree, Galbot, and MagicLab to compare against Noetix 1000 units/month
      target
    whyItMatters: Cannot assess relative manufacturing advantage without peer volume data
    diligencePath: Track supplier orders, factory capacity reports, and logistics data for peer companies
    relatedQuestionRefs:
      - QP013
  - type: private-evidence-only
    severity: material
    topic: recognized revenue
    missingEvidence: Monthly recognized revenue, deferred revenue, and channel sell-through by SKU and geography.
    whyItMatters: Revenue quality cannot be underwritten from pre-orders and product pages alone.
    diligencePath: Request a 12-month management revenue bridge with shipped units, realized ASP, and cash collection by channel.
    relatedQuestionRefs:
      - QI010
      - QI030
  - type: private-evidence-only
    severity: material
    topic: gross margin and contribution margin
    missingEvidence: Gross margin by SKU, channel discounts, warranty reserve policy, and service attach economics.
    whyItMatters: A low-price hardware strategy can destroy value if contribution margin stays negative after support costs.
    diligencePath: Obtain BOM walk-throughs, warranty claims history, and contribution-margin waterfalls for Bumi, N2, and E1.
    relatedQuestionRefs:
      - QI018
      - QI020
      - QI033
  - type: missing-source
    severity: material
    topic: runway and leverage
    missingEvidence: Cash balance, monthly burn, debt obligations, and any project-finance or supplier-credit facilities.
    whyItMatters: Capital adequacy cannot be confirmed from fundraising headlines without balance-sheet data.
    diligencePath: Request cash-flow statements, debt schedules, and a 12-month operating budget tied to production milestones.
    relatedQuestionRefs:
      - QI028
      - QI029
  - type: enumeration-incomplete
    severity: minor
    topic: public financial gaps table completeness
    missingEvidence: Detailed disclosure on backlog aging, refunds, geographic mix, and service revenue contribution.
    whyItMatters: The listed gaps capture major blockers but not every secondary KPI that could affect valuation comfort.
    diligencePath: Ask management for a diligence KPI deck covering order book health and post-sale economics.
    relatedTableRefs:
      - TI005
  - type: private-evidence-only
    severity: material
    topic: field reliability
    missingEvidence: Installed-base uptime, MTBF, failure rates, and incident reports by SKU.
    whyItMatters: >-
      Without reliability metrics, it is impossible to distinguish a polished demo platform from a deployment-grade
      product system.
    diligencePath: Request service logs, fleet uptime, warranty claims, and reliability scorecards by product line.
    relatedQuestionRefs:
      - QE020
      - QE030
  - type: missing-source
    severity: material
    topic: certification status
    missingEvidence: >-
      Third-party safety certification records, deployment risk assessments, or audited compliance reports for specific
      robots.
    whyItMatters: >-
      Humanoid deployments increasingly require application-level safety validation, especially in public or household
      settings.
    diligencePath: Ask management for certification files, risk assessments, and customer deployment safety packages.
    relatedQuestionRefs:
      - QE021
  - type: missing-source
    severity: minor
    topic: developer adoption
    missingEvidence: Counts of external developers, SDK downloads, integrated apps, or active partner deployments.
    whyItMatters: Developer-signal surfaces are promising, but traction cannot be quantified from public pages alone.
    diligencePath: Request product analytics, repo activity summaries, and named ecosystem-partner case studies.
    relatedQuestionRefs:
