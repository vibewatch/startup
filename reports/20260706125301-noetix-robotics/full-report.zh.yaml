  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险栈
        blocks:
          - type: paragraph
            body: >-
              人形机器人面临的法律和监管图景，正从概念走向运营。外部标准评论如今把步行人形机器人视作一个特殊类别，具有跌倒、电池和特定应用部署风险；法律顾问也越来越把联网机器人定义为网络物理系统，其设计、软件更新、集成和现场行为都会影响责任。对
              Noetix 来说，这很重要，因为公司明确瞄准家庭、学校、面向公众的服务场景，以及潜在企业空间；在这些环境里，隐私、物理安全和客户损害可能汇合。公司公开页面显示，Noetix
              已开始建设隐私、维护和售后条款等治理界面。这比什么都没有好，但不同于发布认证状态、风险评估或事件响应指标。因此，当前风险姿态只有在投资人假设公司及其渠道伙伴内部仍有大量控制工作要做时，才算可管理。
