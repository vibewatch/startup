      - CR024
      - CR025
      - CR036
      - CR037
      - CR040
  - id: TV001
    title: 建议摘要
    columns:
      - 字段
      - 评估
      - 原因
    rows:
      - - 建议
        - 继续研究
        - 叙事强度真实存在，但基本面不透明
      - - 信心
        - 中
        - 关键运营指标仍未披露
      - - 风险评级
        - 高
        - 硬件爬坡、价格战和披露缺口叠加
      - - 估值立场
        - 偏高
        - 当前价格已经把执行成功计入了
      - - 最佳下一步
        - 在 NDA 下索取 KPI 包
        - 需要直接证明利润率和需求质量
    notes: 摘要只反映公开证据，也刻意不假装能精确推断缺失的私有指标。
