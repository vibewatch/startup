        title: 财务结论与尽调含义
        blocks:
          - type: paragraph
            body: >-
              财务结论不是 Noetix 缺少商业牵引，而是公开数据还没有证明牵引能否转化为有吸引力的单位经济模型。公司显然拥有产品市场好奇心、融资渠道和足以影响赛道的制造雄心。但投资人若要用基本面支撑 RMB 10
              billion 估值，仍需要硬数字；公开证据还停在这些数字之前：收入结构、各产品毛利率、服务附加率、保修准备金、渠道返利、净营运资本和月度烧钱。实践中，合适的尽调姿态是把 Noetix
              视作一个重融资的硬件爬坡项目：如果制造和渠道执行守得住，上行空间不对称；如果价格战先于成本曲线改善到来，下行也很大。下一步尽调不应再要一份市场叙事演示材料，而是一份管理层数据包，包含月度出货、实际 ASP、按
              SKU 计算的贡献利润率，以及按渠道拆分的订单到现金转换。在此之前，证据天平支持继续关注，而不是给出清洁的承销舒适度。
