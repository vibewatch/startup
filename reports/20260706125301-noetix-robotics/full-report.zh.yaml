        title: 风险结论与否决标准
        blocks:
          - type: paragraph
            body: >-
              最终风险结论不是 Noetix
              独特危险，而是公司正处在四件难事的交叉点：新监管、硬科技执行、渠道依赖和赛道级商业不稳定。单独看，任何一个风险都可能扛过去；叠加之后，它们要求的尽调深度远高于产品页面或融资头条能提供的内容。优先级最高的工作流是安全治理、现场质量监测、伙伴经济模型和管理层深度。如果在更广的人形机器人市场仍在降价时，出现重大安全事件、支持崩溃或渠道转化不达预期，融资缓冲可能比公开叙事暗示的缩得更快。因此，投资人应把控制，而不是演示，视作真正的门槛。令人鼓舞的信号是，Noetix
              已经展示出一些治理脚手架和伙伴意图。缺失的信号，是这些脚手架能在规模压力下良好运转的证明。缺失的证据不是叙事信心，而是规模下可衡量的控制表现。
