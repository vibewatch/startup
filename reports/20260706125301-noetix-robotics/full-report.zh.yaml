companyProfile:
  summary: >-
    Noetix Robotics（松延动力）是一家总部位于北京的人形与仿生机器人公司，2023 年 9 月由 Jiang Zheyuan（CTO）和 Zhang
    Shipu（CEO）创立。公司开发消费级双足人形机器人（Bumi，$1,370；N2；E1）和仿生头部平台（Hobbs 系列，32 个面部表情自由度）。在 CATL 关联的 CD Capital
    和北京机器人产业基金支持下，Noetix 在 2026 年 2 月以央视春晚人形仿生机器人独家合作伙伴身份进入大众视野，并已完成 9 轮融资，累计超过 RMB 1.5 billion。公司面向教育、家庭陪伴和商业服务市场，产能约
    1,000 台 / 月。
