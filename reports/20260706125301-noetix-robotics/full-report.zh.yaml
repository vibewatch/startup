      - number: '3.3'
        title: 护城河耐久度与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Noetix 的竞争护城河立在四根支柱上：（1）靠垂直整合和供应链控制取得成本领先，支撑低于 $1,500 的价位；（2）央视春晚合作带来的品牌认知，提供难以匹敌的消费者知名度；（3）仿生头部平台具备 32
              DOF 面部表情能力，是独特技术差异点；（4）北京机器人基金背书带来的政策契合。但四根支柱都存在被侵蚀的风险。Unitree R1
              的价格战，以及拥有更大生产规模、可能做到成本平价的竞争者，正在压迫成本领先。品牌护城河有时效性——如果没有持续营销投入，春晚效应会消退。仿生头部平台今天有差异，但底层执行器技术开放，未来可能被复制。政策契合也不是独享——竞争者同样通过各类省级基金获得国资支持。最耐久的护城河元素是双足
              + 仿生的一体化产品架构，它同时需要运动能力和面部表情专长，建设周期以年计。最不耐久的是价格，Unitree 和新进入者正在快速逼近。整合风险很高：140+ 家公司参与，预计 2027-2028
              年将出现显著行业出清；资金市场收紧前，能否实现可持续单位经济模型决定生存。
