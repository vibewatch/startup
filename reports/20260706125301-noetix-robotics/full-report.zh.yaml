  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >-
              人形机器人市场覆盖为人类环境交互而设计的全身双足机器人，不同于工业机械臂、自动驾驶汽车和纯软件 AI。Noetix 具体竞争的是消费与教育人形机器人细分市场：价格低于 $20,000，面向家庭陪伴、STEM
              教育、商业导览和轻服务任务。相邻市场包括工业协作机器人（cobots）、四足机器人，以及没有双足运动能力的社交 / 陪伴机器人。现状替代品包括教育平板、智能家居助手（Alexa、Google
              Home）、玩具机器人（没有高级运动能力）和真人家教 /
              看护。市场边界排除工业制造机器人、手术机器人和自动无人机。中国人形机器人市场的特点是国家深度参与——十五五规划（2026-2030）明确把机器人和具身智能列为战略性国家技术，一方面通过政府采购要求拉动需求，另一方面通过补贴研发和制造推动供给。纳入的支出包括价格从
              $1,000 到 $100,000、具备双足运动能力的机器人硬件，以及配套软件平台、维护合同和内容生态。排除的支出包括纯软件 AI 助手、非双足工业机器人和医疗机器人系统。
