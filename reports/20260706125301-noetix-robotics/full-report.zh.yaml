      - number: '3.2'
        title: 功能与能力对比
        blocks:
          - type: paragraph
            body: >-
              Noetix 在三条轴线上差异化：价格、产品线宽度和仿生情绪交互。定价 $1,370 的 Bumi 是目前商业可得的最便宜全双足人形机器人，比 Unitree R1 低约 30-40%。但 Unitree R1
              载荷能力更强，工业级耐久性更好。Noetix 的双轨策略（双足移动 + 32 DOF 面部表情仿生头部）很独特——没有竞争对手同时提供两者。Galbot 在操作灵巧度上领先（实时物体折叠演示），MagicLab
              在编舞精度上领先。UBTech 拥有最成熟的企业部署记录。所有竞争对手都共享 OpenHarmony 或 ROS2 兼容性，因此软件生态并不是差异点。Noetix 的关键差异点包括：消费级低于 $1,500
              定价的先发者；央视独家合作伙伴身份（未与竞争者共享）；同业没有的仿生头部平台；以及最快的研发迭代周期（43 天造出第一台机器人，2.5 年完成 9 轮融资）。相对同业的弱点包括：员工数小于 Unitree 和
              UBTech；不像 UBTech 那样公开披露财务；经营记录更短；单型号产量更低。中国如今出货全球 90% 的人形机器人，把整场价格战和创新竞赛集中在国内市场，竞争强度因此进一步升高。
