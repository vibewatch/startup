        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Noetix 故事里有吸引力的部分很容易看到。公司拥有真实产品面、可见早期需求、有意义的战略和政策契合投资人，并且暴露在中国扩张最快的工业叙事之一上。它不是纯概念。公开资料显示，Bumi
              有消费者兴趣，JD.com 和 RBTX
              带来分销牵引，运营叙事围绕可负担性、生态集成和量产展开。反论点同样清楚：这一切不会自动说明当前私有估值便宜。公开证据仍缺少已确认收入、毛利率、流失率和资本效率指标。市场产出正在爆发、价格压缩已经可见时，缺少这些指标，比多一条产品视频更重要。公司可以具有战略重要性，但在没有更深尽调前，仍可能难以按当前价格买入。可见牵引与不可见经济性之间的不对称，正是这里需要估值纪律的原因。
