      - number: '4.2'
        title: 单位经济模型、成本驱动与资本强度
        blocks:
          - type: paragraph
            body: >-
              公开记录足以估出经济形态，却不足以承销贡献利润率。如果 Noetix 某天用 Bumi 单一产品填满 1,000 台 /
              月的产能目标，年收入能力仍只是美元口径的中等八位数；更高端的产品组合可以大幅抬高这一数字。这令人鼓舞，但也暴露出 Noetix
              在独角兽估值看起来符合常规收入倍数之前，需要爬到多大的规模。成本结构很可能由执行器、传感器、电池、板载计算和服务义务主导。N2 文档强调快换电池、边缘 AI 硬件、深度感知和动态运动能力；这些都会把 BOM
              和现场支持复杂度推得高于简单消费电子。RBTX
              的交付周期信号显示，公司更像按订单履约，而不是拥有充足成品库存；这在运营上合理，但可能拉长现金转换周期。由此得到的是典型机器人悖论：更高技术雄心提升定价权，但在规模制造追上来之前，每一次性能升级都会增加资金需求和执行风险。
