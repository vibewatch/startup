            body: >-
              合理的估值视角必须按情景思考，而不是押一个英雄式单一结果。牛市情景假设 Noetix
              利用资金和渠道支持填满产能、证明产品质量，并保持足够定价权，在下一次融资事件前展示利润率路径。基准情景假设采用稳步但不均衡，战略价值有意义，公司继续依赖民间资本，同时运营指标仍部分不透明。熊市情景假设价格压缩、支持负担或质量失误在复购需求被证明前就到来。可比公司分析有用但不完美。Unitree
              相关，因为它结合了出货规模和可见的定价进攻。公开市场或准公开同业可以帮助界定成熟度可能是什么样子，但整个人形机器人品类仍受披露不一致和叙事驱动估值基准拖累。因此，可比公司能帮助讨论，却不能解决讨论。换句话说，情景比点估计更重要，因为已披露证据基础仍然偏斜。
