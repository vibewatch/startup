  - id: TR005
    title: 缓解措施和放弃标准快照
    columns:
      - 领域
      - 当前缓解信号
      - 缺失证据
      - 放弃触发条件
    rows:
      - - 安全治理
        - 公司显示出标准意识，也公开了支持入口
        - 认证材料包和部署审计
        - 发生严重现场安全事件，且没有可信整改
      - - 渠道经济性
        - 合作伙伴和代理网络可见
        - 渠道毛利和转化数据
        - 大型合作伙伴表现不佳且没有备用渠道
      - - 质量体系
        - 支持和维护入口存在
        - 现场故障和遥测指标
        - 支持负担上升且没有遏制证据
      - - 融资韧性
        - 近期大额融资
        - 烧钱速度、债务和现金跑道可见性
        - 产品质量稳定前就需要新资金
      - - 管理层厚度
        - 活跃招聘可见
        - 梯队厚度和负责人分工图
        - 无法把产品、运营和支持领导职责下放
    notes: 放弃标准以事件组合呈现，因为早期机器人市场里，单个数据点噪音太大。
