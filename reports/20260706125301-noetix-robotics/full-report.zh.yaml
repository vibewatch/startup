              信任和质量披露落后于产品叙事。公开材料显示，公司已有隐私、服务支持和售后界面；这比纯实验型创业公司更好，但公司没有发布现场可靠性数据、安全认证状态或量化事故历史。这一点很关键，因为人形机器人是网络物理系统：故障模式不只包括软件
