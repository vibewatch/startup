        - 上游兼容性或安全问题
        - OS 依赖会传导到产品可靠性和更新
        - 审查抽象层和备选方案
      - - 渠道合作伙伴和代理商
        - 执行不一致
        - 合作伙伴质量影响客户体验和转化
        - 审核伙伴赋能和合同标准
      - - 零售 / 平台集中
        - 商业议价失衡
        - 少数可见平台主导公开证据
        - 分散渠道组合，并在内部披露集中度
      - - 共享供应商生态
        - 冲击传导
