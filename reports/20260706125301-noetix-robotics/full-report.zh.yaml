      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              对 Noetix 的产品组合而言，人形机器人买方可以分成四类。第一类是教育机构（学校、STEM 项目、机器人竞赛），购买 N2 和 E1
              作为教学平台；预算归学校管理层或教育技术采购部门，课程现代化要求触发采用。第二类是消费家庭，购买 Bumi 作为陪伴和编程教育设备；父母付款，儿童是主要用户，触发因素是 STEM 教育需求以及低于 $1,500
              价位带来的新奇价值。第三类是商业企业（酒店、商场、活动场馆），购买 E1 和 Hobbs 型号用于接待、导览和品牌激活；营销或设施管理预算出资。第四类是研究机构和大学，采购 N2 和 E1
              作为开发平台；资金来自研究经费和院系设备预算。消费产品购买流程通过电商（JD.com）完成，摩擦较低；机构销售则需要直销触达、演示和 1-3 个月采购周期。
