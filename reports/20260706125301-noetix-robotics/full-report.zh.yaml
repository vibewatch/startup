              Noetix 卖的不是一个只有单一买方故事的人形机器人。公开产品面覆盖面向消费者、适合教育场景的本体机器人，如 Bumi；能力更高的运动平台，如 N2 和 E1；以及仿生交互系统，如 Hobbs 3 和
              Hobbs W1。这个组合设计很重要，因为产品是按工作流来定义的：有些单元设计用来移动、表演并进行物理互动；有些则设计用来表达情绪、导览并支撑社交存在感。来自公司、RBTX 和 Aparobot
              的公开清单都强化了这一点：Noetix
              瞄准研究、教育、展示和服务场景，而不是狭窄工业利基。这个宽度在战略上有用，因为它扩大了客户可以运行的部署实验集合；但它也意味着每个模块可能处在不同成熟度。尽调视角下，正确的问题不是「Noetix
              有没有产品？」而是「哪些产品面已经足够标准化，可以支撑可重复部署和支持？」
