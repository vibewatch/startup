              N2。这个组合很重要，因为它同时显示低摩擦零售和高摩擦伙伴主导渠道的兴趣。与此同时，几乎所有会让故事变得耐久的机构指标——活跃客户、复购、分群留存、账户集中度、退款、支持负载，以及具名账户内扩张——仍未披露。下一步尽调不应问客户是否存在，而应要求一份分群数据包，按渠道对订单、已交付单位、取消、支持工单和重复活动进行对账。在这些信息可得之前，Noetix
