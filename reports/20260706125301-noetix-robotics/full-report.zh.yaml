      - number: '2.2'
        title: TAM/SAM/SOM 与多视角测算
        blocks:
          - type: paragraph
            body: >-
              多家可信分析机构给出了人形机器人机会的边界。RBC Capital Markets 预计，到 2050 年，全球人形机器人总可寻址市场将达到 $9
              trillion，覆盖制造、物流、医疗、家庭和国防应用。近端来看，Morgan Stanley 预计中国人形机器人市场 2026 年约为 $2 billion，出货约 50,000
              台；因商业部署得到验证，这一估计较此前上调 79%。到 2030 年，仅中国市场预计就将达到 $15 billion，年出货 446,000 台，隐含 65%+ CAGR。Noetix 主攻的消费 /
              教育人形机器人可服务可寻址市场（SAM），是中国人形机器人总市场的一个子集，估计占 2026 年总市场的 15-20%，约 $300-400 million；随着成本曲线跌破 $10,000 消费门槛，到
              2030 年有望增长到 $2-3 billion。Noetix 的可获得服务市场（SOM）受当前约 1,000 台 / 月（12,000 台 / 年）产能约束，按 $1,400-$10,000
              的平均售价计算，近期最大年收入能力约为 $17-120 million。
