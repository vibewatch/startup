        - 评估梯队厚度和授权归属
      - - 招聘执行压力
        - 高
        - 中
        - 多个招聘入口显示公司需要主动扩张团队
        - 审查招聘漏斗、留存和入职流程
      - - 员工增长中的流程漂移
        - 中
        - 高
        - 100+ 名员工和多地规模可能跑在体系前面
        - 检查组织设计和 QA 治理
      - - 叙事跑在证据前面
        - 中
        - 中
        - 传播节奏强于已披露指标
        - 用可追溯的客户和质量数据校准市场推进主张
    notes: 人员风险是执行乘数：硬件公司扩张时，它们会放大或压低每一类风险。
    enumerationScope:
