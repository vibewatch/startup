              公开资料呈现的采用曲线，从产品可见度开始，并加速进入渠道化。Bumi 在 JD 上 500 多个预订单，是最清晰的硬消费者数据点。随后，Noetix 通过更广的 JD.com
              关系深化叙事；这段关系如今覆盖产品设计、用户运营和渠道扩张，而 People's Daily 则把 Noetix 放进 JD 的 JoyInside 设备生态和更广的人形机器人零售推进之中。RBTX
