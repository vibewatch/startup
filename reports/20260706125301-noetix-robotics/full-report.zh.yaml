            body: >-
              按创业公司标准，Noetix 资金充足。不到三年 9 轮融资、近 RMB 1 billion 的 Series
              B，以及政策关联资本反复投资，共同降低了眼前的流动性焦虑。但同一组证据也暴露了公开尽调的边界：没有披露现金余额、烧钱速度、债务时间表，也没有把订单桥接到收入确认的说明。投资人能看到融资成功，却看不到财务质量。最乐观的解释是，战略资本正在为广泛人形机器人采用前的时间敏感型产能圈地提供资金。更怀疑的解释是，民间资本正在掩盖一个负毛利抢份额竞赛，而这个赛道的竞争者还在更快降价和扩供。两种解释可以同时成立。因此，短期运营的资金充足度看起来可以接受，但这只是因为外部投资人持续开票。没有审计财报，甚至没有一致
