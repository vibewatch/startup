              战略合作，以及 RBTX 等分销商清单。这些证据仍有价值，因为它证明有人愿意营销、上架，并且至少在一个案例中为产品预订单位。它也显示 Noetix 已经把产品形态匹配到不同客户原型：Bumi 用于低摩擦入门，N2
              面向研究和演示买方，仿生系统用于导览和交互场景。公开证据尚未证明的是深度账户渗透或已披露合同金额。因此，客户故事是真实的，但仍早到需要投资人区分可见需求信号与成熟客户基础披露。
