    sections:
      - number: '1.1'
        title: 身份、创立与公司结构
        blocks:
          - type: paragraph
            body: >-
              Noetix Robotics（官方注册名：松延动力（北京）科技集团股份有限公司，Songyan Power [Beijing] Technology Group Co.,
              Ltd.）是一家总部位于北京的人工智能公司，聚焦人形机器人本体和仿人仿生面部的研发、制造与销售。公司由 Jiang Zheyuan 和 Zhang Shipu 于 2023 年 9 月创立；Jiang
              Zheyuan 任董事长兼 CTO，Zhang Shipu 任联合创始人兼 CEO。Jiang Zheyuan
              从清华大学博士项目退学创业，使他成为中国人形机器人赛道最年轻的创始人之一。核心技术团队来自清华大学、中国科学院、浙江大学和香港大学。2026 年初，公司改制为股份制集团，为规模化前的治理补强。Jin
              Zhiyong 任运营总监。截至 2026 年，公司在北京、常州和东莞等地拥有 100 多名员工。不到三年从零扩到百人以上，反映出当前政策环境下中国深科技创业公司的速度和强度。
