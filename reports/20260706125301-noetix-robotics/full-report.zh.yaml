              台。但年收入、ARR、毛利率、净收入留存率和精确客户数仍属私有信息。公司的披露画像是私有且未披露；除投资人和媒体报道外，没有公开财务文件。投资人文件确认公司已有收入生成，但没有绝对金额。快速融资与财务不透明之间的落差，是当前增长阶段中国深科技硬件创业公司的典型模式。更重要的是，在几乎没有披露收入的情况下，据报
