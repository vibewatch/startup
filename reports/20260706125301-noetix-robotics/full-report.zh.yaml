  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型、定价与渠道结构
        blocks:
          - type: paragraph
            body: >-
              从财务画像看，Noetix 更像一家试图用激进定价压缩采用曲线的年轻硬件公司，而不是靠经常性席位变现的软件公司。公开资料显示，公司有四类可变现产品：大众市场端的 Bumi，票价逐步更高的研究和商用产品
              N2、E1，以及作为专业交互模块的 Hobbs
              级仿生头部。这个宽度很重要，因为它创造了多条平均售价通道；但它也让收入确认和产品组合分析更难，公开资料没有拆分已签订单、已交付单位或渠道终端售出。最强的可见需求证明仍是 Bumi 在 JD.com
              的预订单以及随后与 JD
              的战略合作，它们意味着真实的漏斗顶部兴趣。即便如此，直销、合作伙伴渠道和国际扩张都很可能伴随折扣、演示费用和售后服务成本，而这些没有披露。因此，财务上的收入故事是正面的，但仍处早期：Noetix
              有变现证据和分销杠杆，却没有足够公开披露来证明收入质量已经成熟。
