        - 销售 / 渠道负责人
      - - 退款、支持工单和质保成本
        - 需要量化售后负担
        - 运营 / 客户支持
      - - 情景现金模型和下一轮融资触发条件
        - 需要理解融资韧性
        - CEO / 财务负责人
      - - 具名客户队列和复购活动
        - 需要验证需求持久性
        - 销售 / 客户成功
    notes: 这些索取项是把有趣叙事推进到投资级承销所需的最低证据包。
    enumerationScope:
