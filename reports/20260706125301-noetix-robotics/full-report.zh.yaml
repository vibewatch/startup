  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与关键玩家
        blocks:
          - type: paragraph
            body: >-
              2026 年，中国人形机器人市场已有 140 多家活跃公司，但在消费和教育细分市场，Noetix 的主要竞争对手集中在四家：Unitree Robotics、Galbot（Beijing
              Galbot）、MagicLab 和 UBTech。Unitree 是最直接的竞争对手，其 R1 型号直接瞄准与 Noetix Bumi 相同的低于 $20,000 消费级市场。Unitree
              依托四足机器人业务（Spot 对标产品）积累更久，并在 2026 年央视春晚上展示了令人印象深刻的武术编排。Galbot 聚焦交互助手能力和包括物体操作在内的实用服务演示。MagicLab 以 MagicBot
              系列的表现性手势和杂技级精度突出。UBTech 是同业中唯一公开上市公司（HKEX: 9880），具备 Noetix 缺少的财务透明度。国际上，竞争集合包括 Figure AI（估值 $39B）、Agility
              Robotics（聚焦物流）、Tesla Optimus（商业化前）和 Boston Dynamics（Atlas / Spot），但这些公司主要瞄准工业场景，而非消费用例。2025-2026
              年，中国市场出货了全球 90% 的人形机器人，因此国内竞争比国际竞争更紧迫。快速资本流入进一步推高竞争强度——仅 2026 年上半年，15 家中国具身 AI 独角兽估值就超过 $1.4
              billion。每个竞争者都有不同技术路线：Unitree 强在工业能力，Noetix 强在交互和可负担性，MagicLab 强在编舞式表达，Galbot
              强在实用操作。竞争动态仍在快速演变，新进入者几乎每月出现。
