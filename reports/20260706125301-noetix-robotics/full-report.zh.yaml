              公开披露在这里变薄。本章审阅的资料中，没有来源提供客户数量、活跃装机量、流失率、复购率、续约率，或具名账户内的扩张率。公司确实有维护、售后、法律和隐私界面，这表明管理层预期客户关系会持续，而不是一次性发货。但支持界面只能证明系统存在，不能证明系统运行良好。集中度也是同理。JD.com
              在公开证据中占比很高，明显构成客户或渠道集中度风险；但公开材料没有量化按渠道或伙伴拆分的收入占比。这让本章核心出现一种张力：Noetix
              因为有可见需求和支持脚手架，看起来强于纯原型故事；但它的留存和集中度指标仍属私有，因此又不如规模化硬件业务成熟。
