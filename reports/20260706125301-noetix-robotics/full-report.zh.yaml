      - number: '1.3'
        title: 产品组合与关键里程碑
        blocks:
          - type: paragraph
            body: >-
              Noetix 采取双轨产品策略：一端是双足人形机器人，另一端是仿生人形系统。旗舰消费产品 Bumi 是一台 94 cm、12 kg 的双足人形机器人，定价 RMB 9,998（约 USD
              1,370），面向教育、家庭陪伴和 STEM 编程。Bumi 拥有 21 个自由度，兼容 ROS2，搭载 Rockchip 处理器，并开放编程接口。N2「Athlete」型号（118 cm、30 kg、18
              DOF）面向敏捷运动研究，价格约 USD 5,500。E1 型号（136 cm、21+ DOF）服务高阶研究和商业导览，价格 USD 5,570–10,000。Hobbs 系列覆盖仿生头部平台，具备 32
              个主动面部自由度，用于更有情绪共鸣的交互。关键里程碑包括：2023 年 9 月公司成立；43 天造出第一台机器人；N2 在 2025 北京人形机器人半程马拉松中获得亚军；Bumi 于 2025 年 10
              月发布，并在 JD.com 获得 500 多个预订单；2026 年 2 月 16 日以人形仿生机器人独家合作伙伴身份登上央视春晚；2026 年 3 月完成 Series B。公司拥有 30 多项核心专利，截至
              2025 年 7 月单月交付超过 100 台机器人。N2 还成为全球首款运行 Huawei OpenHarmony 操作系统的消费级人形机器人，目标是接入智能家居生态。
