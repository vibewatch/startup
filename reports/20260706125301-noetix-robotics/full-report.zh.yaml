      - number: '7.2'
        title: 运营、产品质量与技术依赖风险
        blocks:
          - type: paragraph
            body: >-
              Noetix 正试图同时做到几件难事：硬件快速规模化、公众可见度和年轻品类里的技术雄心。即使还没有出现任何单一缺陷，这也会抬高运营风险。制造目标、多城市布局、电池、传感器、边缘计算和带 API
              的产品栈，都比简单消费设备制造出更多故障点。交付周期信号和公开支持页面显示，生产、履约和售后能力必须同时跟上。除此之外，公司似乎依赖 OpenHarmony
              等外部软件和生态层；它们可以加速采用，也会引入上游兼容性和安全风险。实践中，核心技术风险问题不是机器人能不能移动、能不能在舞台上吸睛——它们显然可以——而是当部署和用户多样性扩大时，质量体系、事件监测和服务物流是否成熟到足以顶住。公开证据还不能自信回答这个问题。
