  - id: TV002
    title: 投资逻辑 / 反向逻辑对照
    columns:
      - 视角
      - 投资逻辑
      - 反向逻辑
    rows:
      - - 市场
        - 中国人形机器人市场快速放大
        - 高速增长也会推高产能过剩和竞争风险
      - - 产品
        - Noetix 有真实 SKU 和生态信号
        - 可靠性和留存指标仍缺失
      - - 客户
        - JD.com 和经销商证明市场确实有需求兴趣
        - 具名企业客户能否持续仍未证明
      - - 资本
        - 战略和政策投资者降低近期融资风险
        - 战略资本不等于单位经济模型透明
      - - 估值
        - 如果执行足够强，估值可能变得合理
        - 以当前披露基本面看已经偏贵
    notes: 投资逻辑和反向逻辑刻意成对呈现，让每个正面信号都接受最贴近反面论点的压力测试。
    claimRefs:
      - CV004
      - CV006
      - CV012
      - CV014
      - CV023
      - CV028
  - id: TV003
    title: 乐观 / 基准 / 悲观情景
    columns:
      - 情景
      - 核心假设
      - 估值含义
      - 概率信号
    rows:
      - - 乐观
        - 产能吃满，利润率路径浮现，合作伙伴渠道转化
        - 当前估值介于合理和有吸引力之间
        - 需要 KPI 证明，且没有重大事故
      - - 基准
        - 采用率上升，但透明度仍有限
        - 当前估值介于偏高和合理之间
        - 最符合当前公开证据
      - - 悲观
        - 价格战、支持负担或质量问题拖慢变现
        - 当前估值显得昂贵
        - 如果下一轮融资早于 KPI 证明出现，概率更高
    notes: 情景框架为定性判断，因为公开来源没有提供管理层指引或经审计财务模型。
    claimRefs:
      - CV007
      - CV008
      - CV009
      - CV029
      - CV030
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 重要性
      - 公开信号
      - 对 Noetix 的启示
    rows:
      - - Unitree
        - 规模、价格进攻性和逐步浮现的公开市场可见度
        - TrendForce 引述 60% 合并毛利率和 IPO 可见度
        - 显示规模化人形机器人经济性可以很强，但也加剧竞争
      - - UBTech
        - 公开市场透明度标杆
        - 中国人形机器人赛道至少有一个公开参照点
        - 凸显 Noetix 目前直接披露很少
      - - Figure AI
        - 叙事丰富的全球可比公司
        - 公开收入细节有限，但估值很高
        - 显示板块情绪会跑在基本面前面
      - - Noetix
        - 平价消费级 + 平台化切入
        - Series B 后私有市场估值 USD 1.39B
        - 需要比当前公开资料更强的 KPI 证明
    notes: 可比集合用于示意而非穷尽，因为多数赛道同业仍是私营公司，披露也不均衡。
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most relevant market-reference comparables for framing Noetix, not every private humanoid startup in
        China or globally
    claimRefs:
      - CV018
      - CV019
      - CV031
      - CV032
      - CV033
      - CV034
  - id: TV005
    title: 投资逻辑失效和放弃触发条件
    columns:
      - 触发条件
      - 重要性
      - 直接含义
    rows:
      - - 扩张期出现安全或支持故障
        - 打破合作伙伴和消费者信任
        - 控制措施被证明前，暂缓形成投资信心
      - - 从声量到付费需求的转化弱
        - 暴露叙事大于实质
        - 下调估值判断
      - - 利润率证明前就需要下一轮融资
        - 显示资本效率偏弱
        - 假设本轮没有买到足够执行时间
      - - 渠道高度集中或合作伙伴严重不达预期
        - 压缩市场进入选择
        - 降低对增长叙事的信心
    notes: 放弃触发条件被设计成实际监控测试，而不是抽象风险标签。
    enumerationScope:
      coverage: partial
      basis: >-
        Lists the highest-salience thesis-break conditions implied by public evidence and known disclosure gaps as of
        July 2026
    claimRefs:
      - CV030
      - CV035
      - CV036
      - CV040
  - id: TV006
    title: 最终尽调索取清单
    columns:
      - 索取项
      - 为何必须索取
      - 最佳负责人
    rows:
      - - 按 SKU 拆分的月度出货量、ASP 和利润率
