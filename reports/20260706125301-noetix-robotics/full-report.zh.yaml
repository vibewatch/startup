      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              增长由五股力量推动。第一，十五五规划下的政府政策要求省级部署目标，并资助商业试点。第二，成本大幅下降——Noetix 的 Bumi 定价 $1,370，相比上一代人形机器人降价
              90%+，跨过消费可负担门槛。第三，央视春晚时刻制造了大众文化认知，也让人形机器人在中国家庭里变得正常化。第四，OpenHarmony 生态集成把人形机器人定位为 IoT
              节点，而不是孤立设备。第五，中国更广泛的制造供应链支持快速扩产。约束包括：AI 软件缺口限制真实世界自主性；首批国家标准在 2026 年 3
              月推出后，安全和监管仍不确定；家用联网机器人存在网络安全顾虑；过度投资带来泡沫风险（140+
              家公司，潜在产能过剩）；以及消费者从新奇兴趣到日常效用之间仍有采用缺口。关键约束是自主性缺口——当前机器人擅长预设动作，但还无法泛化到非结构化家庭环境。
