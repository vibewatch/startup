      - number: '1.2'
        title: 融资历史与投资人格局
        blocks:
          - type: paragraph
            body: >-
              Noetix Robotics 自 2023 年 9 月成立以来已完成 9 轮融资；对一家硬件机器人创业公司来说，这个节奏异常快。最近一轮是 2026 年 3 月完成的近 RMB 1 billion（约 USD
              140–145 million）Series B，由 CATL 旗下产业投资平台 Chen Dao Capital（CD Capital）领投。联合投资方包括 Guoke
              Investment、Jingguosheng Fund 和 Jiuhe Venture Capital。Series B 之前，公司在 2025 年末从 Fangguang Capital 和 CICC
              Capital 获得近 RMB 500 million 的 Pre-B 和 Pre-B+ 轮融资。由 Shoucheng Holdings 管理的北京机器人产业发展投资基金曾两次投资（2024 年 3
              月、2025 年 9 月），构成带有国资关联的背书，也释放出强政策契合信号。Series B 后，媒体报道公司的投后估值接近 RMB 10 billion。公司累计融资超过 RMB 1.5
              billion。北京机器人基金、Guoke、Jingguosheng 等国资关联资本，与 CICC、Fangguang、Jiuhe 等民营成长资本共同构成混合投资人基础，降低了单一投资人依赖。
