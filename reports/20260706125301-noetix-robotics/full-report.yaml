  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk stack
        blocks:
          - type: paragraph
            body: >-
              The legal and regulatory picture for humanoid robots is moving from conceptual to operational. External
              standards commentary now treats walking humanoids as a special category with fall, battery, and
              application-specific deployment risk, while legal advisors increasingly frame connected robots as
              cyber-physical systems whose design, software updates, integrations, and field behavior all affect
              liability. For Noetix, this matters because the company is clearly targeting environments—homes, schools,
              public-facing service settings, and potentially enterprise spaces—where privacy, physical safety, and
              customer harm can converge. Public company pages show that Noetix has begun building governance surfaces
              such as privacy, maintenance, and after-sales terms. That is better than having nothing, but it is not the
              same as publishing certification status, risk assessments, or incident-response metrics. The current risk
              posture is therefore manageable only if investors assume a meaningful amount of control work remains
              inside the company and its channel partners.
