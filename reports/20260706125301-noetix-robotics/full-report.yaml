      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Growth is driven by five primary forces. First, government policy mandates through the 15th Five-Year Plan
              require provincial deployment targets and fund commercial pilots. Second, dramatic cost reduction—Noetix's
              Bumi at $1,370 represents a 90%+ price reduction versus prior-generation humanoids, crossing the consumer
              affordability threshold. Third, the CCTV Gala moment created mass cultural awareness and normalized
              humanoid robots in Chinese households. Fourth, the OpenHarmony ecosystem integration positions humanoid
              robots as IoT nodes rather than standalone devices. Fifth, the broader Chinese manufacturing supply chain
              enables rapid production scaling. Constraints include: AI software gaps limiting real-world autonomy;
              safety and regulatory uncertainty as first national standards were introduced in March 2026; cybersecurity
              concerns for home-deployed connected robots; bubble risk from over-investment (140+ companies, potential
              overcapacity); and the consumer adoption gap between novelty interest and daily utility. The critical
              constraint is the autonomy gap—current robots excel at pre-programmed routines but cannot generalize to
              unstructured home environments.
