      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              The humanoid robot buyer landscape segments into four primary categories for Noetix's product portfolio.
              First, education institutions (schools, STEM programs, robotics competitions) purchase N2 and E1 models as
              teaching platforms—budget ownership sits with school administrators or educational technology procurement
              departments, with adoption triggered by curriculum modernization mandates. Second, consumer households
              purchase Bumi as a companionship and programming education device—parents are the payers with children as
              primary users, triggered by STEM education demand and novelty value at the sub-$1,500 price point. Third,
              commercial enterprises (hotels, malls, event venues) purchase E1 and Hobbs models for reception, guiding,
              and brand activation—marketing or facilities management budgets fund these purchases. Fourth, research
              institutions and universities acquire N2 and E1 as development platforms—funded through research grants
              and departmental equipment budgets. The buying process for consumer products runs through e-commerce
              (JD.com) with low friction, while institutional sales require direct sales engagement, demonstrations, and
              procurement cycles of 1-3 months.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
