    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The attractive part of the Noetix story is easy to see. The company has real product surfaces, visible
              early demand, meaningful strategic and policy-aligned investors, and exposure to one of the
              fastest-scaling industrial narratives in China. It is not a pure concept. Public sources show consumer
              interest in Bumi, distribution traction through JD.com and RBTX, and an operating narrative built around
              affordability, ecosystem integration, and mass production. The anti-thesis is equally clear: none of that
              automatically makes the current private valuation cheap. Public evidence still lacks recognized revenue,
              gross margin, churn, and capital-efficiency metrics. In a market where output is exploding and price
              compression is already visible, the absence of those metrics matters more than the presence of another
              product video. The company can be strategically important and still be hard to buy at the current price
              without deeper diligence. That asymmetry between visible traction and invisible economics is exactly why
              valuation discipline matters here.
