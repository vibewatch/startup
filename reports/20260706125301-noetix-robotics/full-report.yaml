    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Founding, and Corporate Structure
        blocks:
          - type: paragraph
            body: >-
              Noetix Robotics (official registered name: 松延动力（北京）科技集团股份有限公司, Songyan Power [Beijing] Technology Group
              Co., Ltd.) is a Beijing-headquartered artificial intelligence company focusing on the research,
              development, manufacturing, and sales of humanoid robot bodies and bionic human-like faces. The company
              was founded in September 2023 by Jiang Zheyuan, who serves as Chairman and CTO, and Zhang Shipu, who
              serves as Co-founder and CEO. Jiang Zheyuan left a PhD program at Tsinghua University to start the
              company, making him one of the youngest founders in the Chinese humanoid robotics sector. The core
              technical team draws from Tsinghua University, the Chinese Academy of Sciences, Zhejiang University, and
              the University of Hong Kong. The company restructured into a joint-stock group in early 2026 to strengthen
              governance ahead of scaling. Jin Zhiyong serves as Director of Operations. As of 2026, the company employs
              over 100 people across facilities in Beijing, Changzhou, and Dongguan. This rapid scaling from zero to
              over 100 employees in under three years reflects the velocity and intensity of Chinese deep-tech startups
              in the current policy environment.
