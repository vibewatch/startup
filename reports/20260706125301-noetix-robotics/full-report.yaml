      - number: '2.2'
        title: TAM/SAM/SOM and Multi-Lens Sizing
        blocks:
          - type: paragraph
            body: >-
              Multiple credible analyst projections frame the humanoid robotics opportunity. RBC Capital Markets
              projects a $9 trillion total addressable market for humanoid robotics globally by 2050, encompassing
              manufacturing, logistics, healthcare, household, and defense applications. For the near term, Morgan
              Stanley projects China's humanoid robot market at approximately $2 billion in 2026 with ~50,000 units
              shipped, representing a 79% upgrade from prior estimates driven by verified commercial deployments. By
              2030, China's market alone is projected to reach $15 billion with 446,000 annual unit shipments, implying
              a 65%+ CAGR. The serviceable addressable market (SAM) for consumer/education humanoids—Noetix's primary
              segment—is a subset estimated at 15-20% of the total China humanoid market in 2026, or approximately
              $300-400 million, growing toward $2-3 billion by 2030 as cost curves fall below the $10,000 consumer
              threshold. Noetix's serviceable obtainable market (SOM) is constrained by its current production capacity
              of approximately 1,000 units/month (12,000/year) at average selling prices of $1,400-$10,000, implying
              maximum near-term revenue capacity of $17-120 million annually.
