      - number: '4.2'
        title: Unit economics, cost drivers, and capital intensity
        blocks:
          - type: paragraph
            body: >-
              The public record gives enough to estimate economic shape, but not enough to underwrite contribution
              margin. If Noetix ever filled its 1,000-unit-per-month target with only Bumi units, annual revenue
              capacity would still be limited to a mid-eight-figure dollar number, and a more premium product mix could
              raise that substantially. That is encouraging, but it also reveals how much scale Noetix must achieve
              before a unicorn valuation looks conventional on revenue multiples. Cost structure is likely dominated by
              actuators, sensors, batteries, onboard compute, and service obligations. N2 documentation highlights
              quick-swap batteries, edge AI hardware, depth sensing, and dynamic locomotion features, all of which push
              BOM and field-support complexity higher than simple consumer electronics. Delivery-time signals from RBTX
              suggest order-based fulfillment rather than abundant finished-goods inventory, which is operationally
              sensible but may lengthen cash-conversion cycles. The resulting picture is a classic robotics paradox:
              higher technical ambition improves pricing power, but each performance upgrade also raises capital needs
              and execution risk until scale manufacturing catches up.
