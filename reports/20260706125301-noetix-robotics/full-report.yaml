        title: Product portfolio and customer workflow definition
        blocks:
          - type: paragraph
            body: >-
              Noetix is not selling a single humanoid robot with one buyer story. Its public product surface spans
              consumer-facing and education-friendly body robots such as Bumi, higher-capability locomotion platforms
              such as N2 and E1, and bionic interaction systems such as Hobbs 3 and Hobbs W1. That portfolio design
              matters because the product is defined in workflow terms: some units are designed to move, perform, and
              interact physically; others are designed to emote, guide, and support social presence. Public listings
              from the company, RBTX, and Aparobot all reinforce that Noetix is targeting research, education,
              demonstration, and service scenarios rather than a narrow industrial niche. This breadth is strategically
              useful because it expands the set of deployment experiments customers can run, but it also means each
              module may be at a different maturity level. From a diligence perspective, the right question is not “does
              Noetix have a product?” but “which product surfaces are already standardized enough to support repeatable
              deployment and support?”
