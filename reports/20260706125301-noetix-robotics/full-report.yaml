  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing, and channel structure
        blocks:
          - type: paragraph
            body: >-
              Noetix looks financially like a young hardware company trying to compress the adoption curve with
              aggressive pricing rather than a software company monetizing recurring seats. Public sources show four
              monetizable product families: Bumi at the mass-market end, N2 and E1 at progressively higher-ticket
              research and commercial price points, and Hobbs-class bionic heads as specialized interaction modules.
              That breadth matters because it creates multiple average selling price lanes, but it also makes revenue
              recognition and mix analysis harder; public sources do not separate booked orders, delivered units, or
              channel sell-through. The strongest visible demand proof remains Bumi's JD.com pre-orders and JD's
              subsequent strategic partnership, which imply genuine top-of-funnel interest. Even so, direct sales,
              partner channels, and international expansion all likely come with discounting, demo expense, and
              post-sale service costs that are not disclosed. Financially, the revenue story is therefore positive but
              still early: Noetix has evidence of monetization and distribution leverage, yet not enough public
              disclosure to call revenue quality mature.
