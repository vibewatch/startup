      - number: '4.4'
        title: Financial verdict and diligence implications
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is not that Noetix lacks commercial traction; it is that public data do not yet show
              whether traction converts into attractive unit economics. The company clearly has product-market
              curiosity, funding access, and enough manufacturing ambition to matter. Yet public evidence still stops
              short of the hard numbers an investor would need to justify a RMB 10 billion valuation on fundamentals:
              revenue mix, gross margin by product, service attach rate, warranty reserve, channel rebates, net working
              capital, and monthly burn. In practice, the right diligence posture is to treat Noetix as a heavily
              financed hardware ramp with asymmetric upside if manufacturing and channel execution hold, but with
              substantial downside if the price war arrives before cost curves improve. The next diligence step is not
              another market narrative deck; it is a management pack with monthly shipments, realized ASPs, contribution
              margin by SKU, and order-to-cash conversion by channel. Until then, the balance of evidence supports
              interest, not clean underwriting comfort.
