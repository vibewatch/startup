      - number: '1.3'
        title: Product Portfolio and Key Milestones
        blocks:
          - type: paragraph
            body: >-
              Noetix pursues a dual-track product strategy encompassing bipedal humanoid robots and bionic humanoid
              systems. The flagship consumer product is 'Bumi,' a 94 cm, 12 kg bipedal humanoid priced at RMB 9,998
              (approximately USD 1,370), targeting education, home companionship, and STEM programming. Bumi features 21
              degrees of freedom, ROS2 compatibility, a Rockchip processor, and open programming interfaces. The N2
              'Athlete' model (118 cm, 30 kg, 18 DOF) targets agile locomotion research at approximately USD 5,500. The
              E1 model (136 cm, 21+ DOF) serves advanced research and commercial guiding at USD 5,570–10,000. The Hobbs
              series encompasses bionic head platforms with 32 degrees of active facial freedom for emotionally resonant
              interaction. Key milestones include: the company's founding in September 2023; first robot built in 43
              days; the N2's runner-up finish in the 2025 Beijing Humanoid Robot Half Marathon; Bumi's launch in October
              2025 with over 500 pre-orders on JD.com; the CCTV Spring Festival Gala appearance on February 16, 2026 as
              Exclusive Partner for Humanoid Bionic Robots; and the Series B close in March 2026. The company holds over
              30 core patents and delivered over 100 robots in a single month as of July 2025. The N2 also became the
              world's first consumer-grade humanoid robot to run on Huawei's OpenHarmony operating system, targeting
              smart home ecosystem integration.
