  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: >-
              The humanoid robotics market encompasses full-body bipedal robots designed for human-environment
              interaction, distinct from industrial robotic arms, autonomous vehicles, and software-only AI. Noetix
              competes specifically in the consumer and education humanoid segment—robots priced under $20,000 designed
              for home companionship, STEM education, commercial guiding, and light service tasks. Adjacent markets
              include industrial collaborative robots (cobots), quadruped robots, and social/companion robots without
              bipedal locomotion. Status-quo substitutes include educational tablets, smart home assistants (Alexa,
              Google Home), toy robots (without advanced locomotion), and human tutors/caregivers. The market boundary
              excludes industrial manufacturing robots, surgical robots, and autonomous drones. China's humanoid robot
              market is distinguished by heavy state involvement—the 15th Five-Year Plan (2026-2030) explicitly
              prioritizes robotics and embodied intelligence as strategic national technologies, creating both
              demand-pull through government procurement mandates and supply-push through subsidized R&D and
              manufacturing. The included spend encompasses hardware robots capable of bipedal locomotion priced from
              $1,000 to $100,000, their companion software platforms, maintenance contracts, and content ecosystems.
              Excluded spend covers pure software AI assistants, non-bipedal industrial robots, and medical robotic
              systems.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
