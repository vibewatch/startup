              Trust and quality disclosure lag the product narrative. Public materials show privacy, service-support,
              and after-sales surfaces, which is better than a purely experimental startup, but the company does not
              publish field-reliability data, safety-certification status, or a quantified incident history. That
              matters because humanoid robots are cyber-physical systems: the failure mode is not only a software bug or
              a mispriced sensor but also a fall event, a battery issue, a privacy complaint, or an insecure
              integration. External sources reinforce that this is now a board-level issue. Safety standards for walking
              robots increasingly focus on deployment context and application-specific certification, while Gartner,
              Lockton, and Autonomy Global all emphasize that AI-enabled devices expand identity, privacy, and liability
              exposures. Noetix has the beginnings of a trust surface, but the diligence bar for a home, school, or
              public-service robot is much higher than a simple web product. Evidence of controls exists; evidence of
