        title: Funding History and Investor Landscape
        blocks:
          - type: paragraph
            body: >-
              Noetix Robotics has raised capital across nine funding rounds since its founding in September 2023,
              demonstrating exceptional velocity for a hardware robotics startup. The most recent round—a Series B of
              nearly RMB 1 billion (approximately USD 140–145 million)—closed in March 2026, led by Chen Dao Capital (CD
              Capital), an industrial investment platform under CATL. Co-investors included Guoke Investment,
              Jingguosheng Fund, and Jiuhe Venture Capital. Prior to the Series B, the company raised nearly RMB 500
              million in Pre-B and Pre-B+ rounds in late 2025 from Fangguang Capital and CICC Capital. The Beijing Robot
              Industry Development Investment Fund, managed by Shoucheng Holdings, invested twice (March 2024 and
              September 2025), constituting state-linked backing that signals strong policy alignment. The company's
              post-money valuation is reported to be near RMB 10 billion following the Series B. Total lifetime capital
              raised exceeds RMB 1.5 billion. The density of state-linked capital (Beijing Robot Fund, Guoke,
              Jingguosheng) alongside private growth capital (CICC, Fangguang, Jiuhe) creates a blended investor base
              that reduces single-investor dependency.
