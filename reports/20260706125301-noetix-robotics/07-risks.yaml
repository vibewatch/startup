    - Standards awareness and public support surfaces
    - Certification package and deployment audits
    - Serious field safety incident without credible remediation
  - - Channel economics
    - Partners and agent network visible
    - Channel-margin and conversion data
    - Large partner underperformance with no backup channels
  - - Quality systems
    - Support and maintenance surfaces exist
    - Field-failure and telemetry metrics
    - Rising support burden with no containment evidence
  - - Financing resilience
    - Large recent fundraise
    - Burn, debt, and runway visibility
    - Need for fresh capital before product quality stabilizes
  - - Management depth
    - Active hiring is visible
    - Bench-strength and owner map
    - Inability to delegate product, operations, and support leadership
  notes: Kill criteria are expressed as combinations of events because single datapoints are too noisy in an early-stage robotics market.
