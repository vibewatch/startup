company:
  name: Noetix Robotics
chapter:
  number: 7
  title: Risks
  summary: 'Noetix faces a layered risk stack: emerging safety and privacy obligations, channel and platform dependence, execution strain from a fast hardware ramp, and a sector-wide price war that can turn technical progress into financial fragility. None of these risks is automatically fatal, but their interaction means diligence should focus on systems and controls rather than only on product demos or funding headlines.'
sections:
- id: regulatory-and-legal
  title: Regulatory and legal risk stack
  body: The legal and regulatory picture for humanoid robots is moving from conceptual to operational. External standards commentary now treats walking humanoids as a special category with fall, battery, and application-specific deployment risk, while legal advisors increasingly frame connected robots as cyber-physical systems whose design, software updates, integrations, and field behavior all affect liability. For Noetix, this matters because the company is clearly targeting environments—homes, schools, public-facing service settings, and potentially enterprise spaces—where privacy, physical safety, and customer harm can converge. Public company pages show that Noetix has begun building governance surfaces such as privacy, maintenance, and after-sales terms. That is better than having nothing, but it is not the same as publishing certification status, risk assessments, or incident-response metrics. The current risk posture is therefore manageable only if investors assume a meaningful amount
    of control work remains inside the company and its channel partners.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR016
  - CR026
  - CR027
