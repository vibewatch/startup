- id: risk-verdict
  title: Risk verdict and kill criteria
  body: 'The final risk verdict is not that Noetix is uniquely dangerous; it is that the company sits at the intersection of four hard things: new regulation, hard-tech execution, channel dependence, and sector-level commercial instability. Any one of those risks might be survivable on its own. In combination, they require far deeper diligence than product pages or fundraising headlines suggest. The highest-priority workstreams are safety governance, field-quality monitoring, partner economics, and management depth. If a material safety incident, support breakdown, or channel-conversion miss arrives while the broader humanoid market is still cutting price, the financing cushion could shrink far faster than public narratives imply. Investors should therefore treat controls, not demos, as the real gating factor. The encouraging sign is that Noetix already shows some governance scaffolding and partner intent. The missing sign is proof that those scaffolds perform well under scale stress. The
    missing evidence is measurable control performance under scale, not narrative confidence.'
  claimRefs:
  - CR036
  - CR037
  - CR038
  - CR039
  - CR040
  tableRefs: []
  figureRefs: []
