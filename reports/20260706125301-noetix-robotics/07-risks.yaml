  evidenceGaps:
  - type: missing-source
    severity: material
    topic: certification and safety governance
    missingEvidence: Third-party certification records, deployment risk assessments, and incident-response plans for specific robot models.
    whyItMatters: Safety governance is the single fastest way for a robotics thesis to fail under real-world deployment.
    diligencePath: Request certification files, hazard analyses, and safety-owner accountability mapping for each shipped product family.
    relatedQuestionRefs:
    - QR006
    - QR007
    - QR030
  - type: private-evidence-only
    severity: material
    topic: quality and support telemetry
    missingEvidence: Field-failure rates, uptime, ticket volumes, spare-parts turnaround, and warranty-claim history.
    whyItMatters: Operational risks cannot be priced accurately without evidence on how the fleet performs after shipment.
    diligencePath: Obtain service dashboards, fleet telemetry summaries, and SKU-level warranty reserves.
    relatedQuestionRefs:
    - QR015
    - QR028
    - QR032
    - QR033
  - type: private-evidence-only
    severity: material
    topic: financial resilience
    missingEvidence: Burn rate, debt, covenant exposure, and runway under base and downside scenarios.
    whyItMatters: Price-war and quality shocks are survivable only if financing resilience is strong.
    diligencePath: Request 24-month cash model with margin sensitivity and financing assumptions.
    relatedQuestionRefs:
    - QR024
    - QR025
    - QR034
  - type: enumeration-incomplete
    severity: minor
    topic: risk register completeness
    missingEvidence: Supplier-by-supplier dependency mapping and insurer or claims-history detail.
    whyItMatters: The public registers capture main categories but cannot identify every second-order failure path.
    diligencePath: Run a dependency workshop with operations, legal, security, and after-sales leads.
    relatedTableRefs:
    - TR001
    - TR002
    - TR003
    - TR004
acknowledgedWarnings:
- dimension: tableNotes
  reason: All risk tables include notes, but risk scoring still uses qualitative estimates that the validator flags by design.
- dimension: unverifiedSource
  reason: Several official risk-related URLs were reviewed outside the fetch-url trail, so the strict warning is acknowledged transparently.
