companyProfile:
  summary: "Noetix Robotics (松延动力) is a Beijing-based humanoid and bionic robotics company founded in September 2023 by Jiang Zheyuan (CTO) and Zhang Shipu (CEO). The company develops consumer-grade bipedal humanoid robots (Bumi at $1,370, N2, E1) and bionic head platforms (Hobbs series with 32 DOF facial expression). Backed by CATL-linked CD Capital and the Beijing Robot Industry Fund, Noetix achieved mass-market visibility as the CCTV Spring Festival Gala Exclusive Partner in February 2026 and has raised over RMB 1.5 billion across nine rounds. The company targets education, home companionship, and commercial service markets with a production capacity of ~1,000 units/month."
