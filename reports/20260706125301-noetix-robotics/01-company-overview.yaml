company:
  name: "Noetix Robotics"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Noetix Robotics (松延动力) is a Beijing-based humanoid and bionic robotics company founded in September 2023 by Jiang Zheyuan and Zhang Shipu, now valued at near-RMB 10 billion post-Series B. The company achieved mass-market visibility via its CCTV Spring Festival Gala appearance in February 2026 and ships consumer-grade humanoid robots starting at sub-RMB 10,000."
sections:
  - id: "identity-and-founding"
    title: "Identity, Founding, and Corporate Structure"
    body: "Noetix Robotics (official registered name: 松延动力（北京）科技集团股份有限公司, Songyan Power [Beijing] Technology Group Co., Ltd.) is a Beijing-headquartered artificial intelligence company focusing on the research, development, manufacturing, and sales of humanoid robot bodies and bionic human-like faces. The company was founded in September 2023 by Jiang Zheyuan, who serves as Chairman and CTO, and Zhang Shipu, who serves as Co-founder and CEO. Jiang Zheyuan left a PhD program at Tsinghua University to start the company, making him one of the youngest founders in the Chinese humanoid robotics sector. The core technical team draws from Tsinghua University, the Chinese Academy of Sciences, Zhejiang University, and the University of Hong Kong. The company restructured into a joint-stock group in early 2026 to strengthen governance ahead of scaling. Jin Zhiyong serves as Director of Operations. As of 2026, the company employs over 100 people across facilities in Beijing, Changzhou, and Dongguan. This rapid scaling from zero to over 100 employees in under three years reflects the velocity and intensity of Chinese deep-tech startups in the current policy environment."
    claimRefs: ["CO001", "CO002", "CO003", "CO004", "CO005", "CO006", "CO007"]
    tableRefs: ["TO002"]
    figureRefs: []
  - id: "funding-and-investors"
    title: "Funding History and Investor Landscape"
    body: "Noetix Robotics has raised capital across nine funding rounds since its founding in September 2023, demonstrating exceptional velocity for a hardware robotics startup. The most recent round—a Series B of nearly RMB 1 billion (approximately USD 140–145 million)—closed in March 2026, led by Chen Dao Capital (CD Capital), an industrial investment platform under CATL. Co-investors included Guoke Investment, Jingguosheng Fund, and Jiuhe Venture Capital. Prior to the Series B, the company raised nearly RMB 500 million in Pre-B and Pre-B+ rounds in late 2025 from Fangguang Capital and CICC Capital. The Beijing Robot Industry Development Investment Fund, managed by Shoucheng Holdings, invested twice (March 2024 and September 2025), constituting state-linked backing that signals strong policy alignment. The company's post-money valuation is reported to be near RMB 10 billion following the Series B. Total lifetime capital raised exceeds RMB 1.5 billion. The density of state-linked capital (Beijing Robot Fund, Guoke, Jingguosheng) alongside private growth capital (CICC, Fangguang, Jiuhe) creates a blended investor base that reduces single-investor dependency."
    claimRefs: ["CO008", "CO009", "CO010", "CO011", "CO012", "CO013", "CO014", "CO015"]
    tableRefs: ["TO003"]
    figureRefs: ["FO002"]
  - id: "product-and-milestones"
    title: "Product Portfolio and Key Milestones"
    body: "Noetix pursues a dual-track product strategy encompassing bipedal humanoid robots and bionic humanoid systems. The flagship consumer product is 'Bumi,' a 94 cm, 12 kg bipedal humanoid priced at RMB 9,998 (approximately USD 1,370), targeting education, home companionship, and STEM programming. Bumi features 21 degrees of freedom, ROS2 compatibility, a Rockchip processor, and open programming interfaces. The N2 'Athlete' model (118 cm, 30 kg, 18 DOF) targets agile locomotion research at approximately USD 5,500. The E1 model (136 cm, 21+ DOF) serves advanced research and commercial guiding at USD 5,570–10,000. The Hobbs series encompasses bionic head platforms with 32 degrees of active facial freedom for emotionally resonant interaction. Key milestones include: the company's founding in September 2023; first robot built in 43 days; the N2's runner-up finish in the 2025 Beijing Humanoid Robot Half Marathon; Bumi's launch in October 2025 with over 500 pre-orders on JD.com; the CCTV Spring Festival Gala appearance on February 16, 2026 as Exclusive Partner for Humanoid Bionic Robots; and the Series B close in March 2026. The company holds over 30 core patents and delivered over 100 robots in a single month as of July 2025. The N2 also became the world's first consumer-grade humanoid robot to run on Huawei's OpenHarmony operating system, targeting smart home ecosystem integration."
    claimRefs: ["CO016", "CO017", "CO018", "CO019", "CO020", "CO021", "CO022", "CO023", "CO024", "CO025", "CO031", "CO032", "CO033"]
    tableRefs: ["TO004"]
    figureRefs: ["FO001"]
  - id: "cover-metrics"
    title: "Cover Metrics and Gaps"
    body: "Noetix Robotics presents a compelling growth narrative for a two-year-old company, but several critical metrics remain undisclosed. Valuation is reported near RMB 10 billion (approximately USD 1.39 billion) post-Series B. Total capital raised exceeds RMB 1.5 billion. Headcount is confirmed at over 100 employees. Production capacity is ramping toward 1,000 units per month. However, annual revenue, ARR, gross margin, net revenue retention, and precise customer count remain private. The company's disclosure profile is private-undisclosed, with no public financial filings beyond what investors and media report. Revenue generation has been confirmed by investor filings but no absolute figure is available. The gap between rapid fundraising and opaque financials is a hallmark pattern of Chinese deep-tech hardware startups in the current growth phase. Importantly, the reported RMB 10 billion valuation on near-zero disclosed revenue raises questions about whether the market is pricing purely on technology potential and policy tailwinds rather than commercial fundamentals—a bubble risk flagged by multiple analysts covering the sector."
    claimRefs: ["CO026", "CO027", "CO028", "CO029", "CO030", "CO035", "CO036"]
    tableRefs: ["TO001"]
    figureRefs: ["FO003"]
