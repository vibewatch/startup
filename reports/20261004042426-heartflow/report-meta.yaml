  topStrengths:
    - 'Large and growing public operating scale: $176.0M FY2025 revenue, $64.1M Q2 2026 revenue, and 83.3% gross margin'
    - Broad adoption footprint with more than 1,800 institutions and more than 750,000 patients treated
    - Usage-based workflow embedded in reimbursed CCTA diagnostics with room for Plaque and PCI expansion
    - Strong balance sheet relative to the current operating scale, with $246.8M of cash and investments at June 2026
  topRisks:
    - DOJ civil investigative demands and reimbursement dependence remain unresolved
    - FFRCT concentration and under-disclosed plaque economics limit diversification visibility
    - Retention, renewal timing, and customer concentration are still not publicly quantified
    - AWS single-provider infrastructure and clinical quality / review risks remain material
    - No current share price, enterprise value, or peer multiple set is established in the assigned evidence
  unresolvedGaps:
    - Product-level plaque revenue, attach rate, ASP, and gross margin remain undisclosed
    - Gross-to-net realization, denial rates, and payer-class collections are not publicly broken out
    - Mature-account utilization curves and expansion density by cohort are not publicly available
    - NRR, renewal timing, and top-customer concentration remain undisclosed
    - Current share price, enterprise value, and comparable multiples are missing from the assigned evidence
    - Capital-allocation discipline by sales hiring, clinical spend, and payback remains unclear
