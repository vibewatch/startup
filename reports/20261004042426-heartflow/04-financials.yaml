chapter:
  number: 4
  title: "Financials"
  summary: "Heartflow demonstrated substantial top-line momentum in Q2 FY2026 with revenue expanding 48% year-over-year to $64.1 million and gross margin reaching 83.3%, while management raised full-year revenue guidance to $246 million to $250 million. However, net losses continue, mature-account plaque attach economics and gross-to-net payer realizations remain undisclosed, and ongoing federal Civil Investigative Demands represent unresolved capital and operational contingencies."
sections:
  - id: "revenue-streams-and-pricing-architecture"
    title: "Revenue Streams and Pricing Architecture"
    body: "Heartflow operates a dual-modality commercial model for coronary computed tomography angiography (CCTA) post-processing, consisting of its established Heartflow FFRCT Analysis and the emerging Heartflow Plaque Analysis. In the second quarter of FY2026, Heartflow generated $64.1 million in total revenue, reflecting 48% year-over-year expansion [CI001]. Growth was heavily led by the domestic market, where U.S. revenue expanded 51% year-over-year to $59.6 million, while international and other revenue accounted for $4.5 million [CI001]. Flagship FFRCT processing remains the company's primary economic engine, benefiting from nationwide clinical adoption and Category I CPT reimbursement coverage across 99.5% of insured U.S. commercial and Medicare lives [CI008]. Meanwhile, Plaque Analysis represents Heartflow's primary growth vector, contributing $7.8 million in quarterly revenue during Q2 FY2026 [CI001]. Management raised full-year 2026 plaque revenue expectations to a range of $29 million to $31 million, projecting roughly 1,250 activated plaque hospital accounts by year-end [CI002]. Hospital outpatient reimbursement under Medicare APC schedules provides a predictable fee structure, but health systems contract privately under list and enterprise volume tiers, creating opacity in realized per-case pricing [CI008]."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI008"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "unit-economics-and-cost-structure"
    title: "Cost Structure, Unit Economics, and Margin Expansion"
    body: "Heartflow's operating model exhibits substantial gross margin expansion alongside high commercial fixed costs. Non-GAAP gross margin expanded 770 basis points year-over-year to 83.3% in Q2 FY2026, compared to 75.6% in Q2 FY2025 [CI004]. Full-year non-GAAP gross margin guidance was subsequently raised to approximately 82%, with executive management targeting an 85% mid-term gross margin run-rate underpinned by algorithmic automation and volume leverage [CI004]. Total global revenue cases reached 84,491 in Q2 FY2026, an increase of 74% year-over-year that illustrates strong procedure demand [CI001]. The delivery cost structure primarily comprises cloud computational infrastructure on Amazon Web Services and specialized human-in-the-loop image quality analysts who inspect anatomical vessel segmentations prior to clinical delivery. Despite gross profit expansion, operational overhead remains heavy: Q2 FY2026 selling, general, and administrative expenses reached $37.8 million, while research and development investment totaled $23.5 million [CI005]. Heartflow reported a non-GAAP operating loss of $7.9 million for the quarter, an improvement from an $11.5 million operating loss in the prior-year period [CI005]. Critical unit-level disclosures—including customer acquisition cost, payback periods, and net revenue retention by hospital cohort—remain private and undisclosed [CI013]."
    claimRefs:
      - "CI001"
      - "CI004"
      - "CI005"
      - "CI013"
    tableRefs:
      - "TI003"
  - id: "capital-adequacy-and-contingent-liabilities"
    title: "Capital Adequacy, Cash Burn, and Contingent Liabilities"
    body: "As of June 30, 2026, Heartflow held $246.8 million in cash, cash equivalents, and investments on its balance sheet [CI006]. Operating cash burn has decelerated from historical levels: net cash used in operating activities stood at $54.0 million for full-year 2025, down from $69.0 million in 2024 and $76.4 million in 2023 [CI007]. Management maintains that existing liquid resources provide sufficient runway to achieve self-sustaining operating profitability without requiring dilutive equity financing [CI006]. Forge's historical financing page reports inconsistent cumulative funding totals of $890.7 million and $755.52 million, so neither figure is treated as current liquidity [CI014]. However, the business faces material ongoing legal and regulatory overhangs. In October 2025, the U.S. Department of Justice served Heartflow and certain employees with Civil Investigative Demands under the federal Anti-Kickback Statute and False Claims Act regarding financial arrangements with healthcare providers and marketing practices [CI011]. Concurrently, Heartflow is engaged in multi-year intellectual property litigation against competitor Cleerly, leading management to adjust non-GAAP SG&A metrics to exclude patent litigation costs [CI012]. While consensus Wall Street analyst estimates anticipated a Q2 FY2026 loss of approximately $-0.22 per share [CI009], the stock traded at $49.32 as of early October 2026, implying an equity market valuation of approximately $4.29 billion across 86.95 million shares outstanding [CI003, CI010]."
    claimRefs:
      - "CI003"
      - "CI006"
      - "CI007"
      - "CI009"
      - "CI010"
      - "CI011"
      - "CI012"
      - "CI014"
      - "CI015"
