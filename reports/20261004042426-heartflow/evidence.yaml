evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: funding-history
    missingEvidence: >-
      A reconciled financing ledger explaining Forge's $890.7 million narrative total versus its $755.52 million
      structured total.
    whyItMatters: >-
      Total capital raised informs dilution, capital efficiency, and historical investor-return analysis, but funding
      raised is not cash currently available.
    diligencePath: >-
      Reconcile preferred-stock issuances, convertible notes, debt, secondaries, and IPO proceeds against the cap table
      and audited financing statements.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: current-corporate-snapshot
    missingEvidence: >-
      A current registrant address, current basic share count, and same-date market price sufficient to establish
      current headquarters and equity valuation.
    whyItMatters: >-
      The assigned evidence documents a headquarters relocation and only a historical private valuation; neither
      supports a precise current valuation or unqualified location.
    diligencePath: >-
      Verify the latest 10-Q cover page, current investor-relations contact address, current exchange close, and current
      basic and diluted shares.
    relatedQuestionRefs:
      - QO001
      - QO005
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-map
    missingEvidence: A current post-IPO ownership register and complete customer, payor, and related-party concentration schedule.
    whyItMatters: >-
      The public evidence identifies stakeholder classes but cannot establish current voting concentration, investor
      overhang, or counterparty dependence.
    diligencePath: >-
      Review the latest proxy, beneficial-ownership filings, transfer-agent register, customer concentration schedule,
      and reimbursement mix.
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: legal-investigation
    missingEvidence: The DOJ investigation's likely duration, outcome, remediation requirements, and possible financial impact.
    whyItMatters: >-
      A penalty, sales-practice change, or corporate-integrity obligation could affect operating costs, customer
      relationships, and valuation.
    diligencePath: Obtain counsel updates, CID response status, board compliance materials, and any subsequent SEC or DOJ disclosure.
    relatedQuestionRefs:
      - QO009
  - type: missing-source
    severity: material
    topic: independent-market-sizing
    missingEvidence: >-
      An independent, current U.S. patient-flow model that reproduces symptomatic CCTA eligibility, FFRCT and plaque
      filters, geographic access, and realistic adoption ceilings.
    whyItMatters: >-
      Without an independently reproducible denominator, the company TAM cannot be translated into a reliable SAM or SOM
      for valuation.
    diligencePath: >-
      Obtain current claims-based procedure counts and CCTA volumes by site, then independently apply guideline,
      image-quality, stenosis, plaque, and payer-coverage filters.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-and-utilization
    missingEvidence: >-
      Realized net price, denial rate, payer mix, account-level utilization cohorts, and product attach rates by
      hospital, office, and clinic setting.
    whyItMatters: >-
      Published list-price assumptions and aggregate patient counts do not establish obtainable revenue or the pace at
      which installed accounts mature.
    diligencePath: >-
      Request management cohort schedules and payer-level gross-to-net data, then reconcile billed, approved, collected,
      and denied cases to contract terms.
    relatedQuestionRefs:
      - QM010
    relatedTableRefs:
      - TM002
      - TM003
  - type: private-evidence-only
    severity: material
    topic: head-to-head-win-rates
    missingEvidence: >-
      Audited head-to-head customer win-loss data, pricing discounts, and account churn rates between Heartflow Plaque
      Analysis and Cleerly.
    whyItMatters: >-
      Without objective win-loss data, the degree of market share loss or pricing erosion inflicted by private
      venture-backed plaque competitors cannot be independently confirmed.
    diligencePath: >-
      Interview hospital radiology procurement officers and multi-center health system cardiology service-line leaders
      during commercial diligence.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP002
      - TP003
  - type: missing-source
    severity: material
    topic: oem-bundling-timelines
    missingEvidence: >-
      Public product roadmaps and commercial release timelines for native FFRCT software modules embedded directly on
      Siemens, GE, or Philips CT workstations.
    whyItMatters: >-
      Direct software bundling by scanner hardware manufacturers represents an existential platform risk that could
      bypass standalone SaaS analysis workflows.
    diligencePath: >-
      Track OEM 510(k) clearance filings with the FDA and inspect annual RSNA exhibition product showcases for CT
      console software updates.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: private-metric-gaps
    missingEvidence: >-
      Audited breakdown of hospital customer acquisition cost, payback period, and cohort net revenue retention (NRR)
      curves.
    whyItMatters: >-
      Without cohort retention curves and CAC payback metrics, underwriting long-term commercial sales productivity and
      hospital expansion economics relies on top-line estimates.
    diligencePath: >-
      Request confidential hospital cohort retention curves, gross-to-net realization schedules, and sales commission
      payback metrics under management NDA.
    relatedQuestionRefs:
      - QI009
  - type: missing-source
    severity: material
    topic: product-performance
    missingEvidence: >-
      Empirical third-party benchmark comparisons evaluating Heartflow's computational fluid dynamics simulation
      accuracy against newer machine-learning-only FFRCT models.
    whyItMatters: >-
      Competing architectures from startups and imaging vendors claim faster turnaround times by replacing full physics
      simulations with deep learning approximations.
    diligencePath: >-
      Review peer-reviewed head-to-head clinical study publications comparing Heartflow against on-premise deep learning
      CT-FFR algorithms.
    relatedQuestionRefs:
      - QE002
  - type: missing-source
    severity: minor
    topic: pci-planner-validation
    missingEvidence: >-
      Peer-reviewed multi-center clinical validation data and real-world catheterization lab workflow trials for the
      upcoming Heartflow PCI Planner.
    whyItMatters: >-
      The commercial expansion into interventional planning in 2026 depends on whether interventional cardiologists
      actively trust and adopt in-silico stent modeling.
    diligencePath: >-
      Track prospective clinical trial registrations and FDA 510(k) summary documentation upon formal commercial launch
      of PCI Planner.
    relatedQuestionRefs:
