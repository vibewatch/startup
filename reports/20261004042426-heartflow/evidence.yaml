      Usage growth and activation targets cannot distinguish durable same-customer expansion from replacement of lost or
      low-usage accounts.
    diligencePath: >-
      Obtain quarterly cohort schedules by activation date, product, setting, health-system parent, orders, revenue,
      renewal, and churn.
    relatedTableRefs:
      - TU001
      - TU002
  - type: enumeration-incomplete
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Top-five and top-ten customer revenue shares, multi-account health-system mappings, and concentration by payer and
