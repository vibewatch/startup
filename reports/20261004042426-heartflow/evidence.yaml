    whyItMatters: >-
      The disclosed sub-10% single-customer threshold does not quantify correlated loss exposure across centrally
      managed accounts.
    diligencePath: Request anonymized customer concentration tables that reconcile facilities to health-system parents and payer mix.
    relatedTableRefs:
      - TU001
  - type: private-evidence-only
    severity: minor
    topic: adoption-denominators
    missingEvidence: >-
      Active versus inactive institutions, unique versus repeat patients, product-level account counts, and period case
      volumes.
    whyItMatters: >-
      Without aligned denominators, public account, institution, hospital, patient, and revenue metrics cannot form a
      conversion or retention funnel.
    diligencePath: >-
      Ask management for a dated metric dictionary and quarterly bridge across accounts, active ordering physicians,
      cases, unique patients, and products.
    relatedTableRefs:
      - TU002
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-risk-register
    missingEvidence: >-
      Final DOJ outcome, non-public legal exposure, current commercial payer terms, foreign regulatory matters, and a
      reconciled final 2026 FFRCT hospital payment rate are not established by the assigned pool.
    whyItMatters: These items can change legal liability, payment economics, product access, and the severity ordering in TR001.
    diligencePath: >-
      Obtain counsel and compliance updates, payer contracts, current CMS final-rule tables, and jurisdiction-level
      regulatory correspondence.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: risk-monitoring
    missingEvidence: >-
      Current error and corrected-report rates, MAUDE trend review, AWS recovery objectives and failover tests,
      reportable security incidents, system-level revenue concentration, support backlogs, retention, and cash-flow
      runway.
    whyItMatters: >-
      Public disclosures identify the failure modes but do not quantify frequency, control effectiveness, or financial
      tolerance, preventing calibrated likelihood estimates and fully measurable kill criteria.
    diligencePath: >-
      Request quality-system dashboards, incident and CAPA logs, business-continuity test results, security reports,
      customer-cohort data, support SLAs, current cash-flow forecasts, and board risk reporting.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR002
