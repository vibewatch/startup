        title: Exhibits
        blocks:
          - type: callout
            title: 在价格可验证前持续跟踪
            body: 运营质量不能回答入场价格。将运营论点转化为买入决定前，应验证当前企业价值、稀释、产品组合和可比倍数。
            calloutType: recommendation
            claimRefs:
              - CV016
