      - number: '2.3'
        title: 买方、用户、支付方与采用路径
        blocks:
          - type: paragraph
            body: >-
              采用是多方参与的企业销售过程。影像科医生和放射科医生影响账户启用及扫描解读；转诊心脏科医生推动病例量；介入心脏科医生使用规划信息；医疗系统或影像机构签约购买服务；政府和商业支付方决定经济性是否支持常规使用。Heartflow
              主要在医生订购并收到 FFRCT Analysis、Plaque Analysis 或两者时收取使用费，因此已安装账户不等于持续使用。公司称新账户通常需要 12 个月才能接近稳态，定义为约 33% 的账户
              CCTA 使用 FFRCT。2025 年末文件报告美国账户超过 1,465 个，而当前主页报告机构超过 1,800 家；标签、日期和地域不同，不能把两者当作干净的增长序列。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: 驱动因素、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              最强的需求驱动因素包括 CCTA 获指南支持、FFRCT 广泛覆盖、Plaque Analysis 获得新的编码和覆盖、无需购买资本设备，以及同一扫描可销售多项分析。2026
              年第一季度结果提供了已实现需求信号：公司发布的结果显示收入 $52.6 million，同比增长 41%，主要来自美国 FFRCT 量增加。约束同样具有结构性：Heartflow 依赖当地 CCTA
              容量和图像质量、医生行为改变、多方工作流整合，以及其无法控制的覆盖和支付决定。据报 FFRCT 覆盖约 99% 的美国参保人口，而 Plaque Analysis 覆盖约
              75%，使较新的产品更容易受到支付方转化影响。在获得使用队列、按场所类型划分的已实现价格、支付方组合和可独立复现的可服务市场证据前，应对公司较大的 TAM 打折。
            claimRefs:
              - CM002
              - CM011
              - CM012
              - CM013
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: TAM 很大，但变现层很窄
            body: Heartflow 在订购合适的 CCTA 后对分析变现；它不获取扫描仪、采集、介入或更广泛 CAD 治疗的钱包。
            calloutType: insight
            claimRefs:
              - CM001
              - CM014
          - type: callout
            title: 公开数据无法确定 SAM 或 SOM
            body: 现有证据缺少独立的适用患者数量、已实现净价、使用队列和支付方层面的转化数据，无法把公司 TAM 转化为可辩护的可服务市场。
            calloutType: risk
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争环境与市场结构
        blocks:
          - type: paragraph
            body: >-
              Heartflow 所处的是一个多层竞争市场，各家采用不同技术诊断冠状动脉疾病。其核心商业平台用 AI 算法把标准 CCTA 扫描转化为非侵入性解剖和生理诊断模型，具体包括 Heartflow FFRCT
              Analysis 和 Heartflow Plaque Analysis。Heartflow 既面对传统非侵入性功能检查的主要竞争，也面对专业化、风险投资支持的 AI
              软件开发商的直接竞争，还承担全球医疗影像设备集团带来的长期平台风险。SPECT、负荷超声心动图、PET 和有创诊断导管等传统方式，仍是医院心脏科的既有标准。Siemens Healthineers AG、GE
              Healthcare 和 Koninklijke Philips N.V. 等跨国公司既制造这些传统方式所需的影像硬件，也制造采集 CCTA 所需的 CT
              扫描仪。因此，这些影像巨头既是上游关键数据供应商，也可能把原生分析工具捆绑进扫描仪硬件生态，成为强大的潜在软件竞争者。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
      - number: '3.2'
        title: 直接 AI 冠脉挑战者与功能差异化
        blocks:
          - type: paragraph
            body: >-
              专业 CCTA AI 软件领域的直接竞争者包括 Cleerly, Inc.、Elucid Bioimaging Inc. 和 Keya Medical Technology Co., Ltd.
              等灵活的风险投资支持创新者。这些同行聚焦算法表征、血管生物学和斑块量化。尤其是 Cleerly 强调总斑块体积和表型表征，而不只关注血流动力学储备。Heartflow 的监管披露明确指出，数家灵活竞争者在
              Heartflow Plaque Analysis 之前已商业推出斑块分析软件，可能先建立客户关系，并争夺医院软件预算。Heartflow 通过打造集成诊断套件应对压力：将解剖 Roadmap
              Analysis、生理 FFRCT、完整 Plaque Analysis 和术前导管规划 PCI Navigator 组合起来，并以超过 625 篇同行评审出版物和超过 200 million 张标注 CT
              图像的专有训练数据库支持。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP008
      - number: '3.3'
        title: 壁垒持续性、切换成本与监管逆风
        blocks:
          - type: paragraph
            body: >-
              Heartflow 的竞争壁垒有四根支柱：广泛的专有临床试验证据、深度接入 PACS 和电子病历系统的企业工作流、专用 CPT
              报销编码，以及支持医院临床和运营团队的客户成功现场团队。但其商业模式仍对外部资本和支付方报销结构敏感。与在硬件、设备和药品上创造数十亿美元收入的多元化跨国集团不同，Heartflow 高度依赖第三方支付方和
              Medicare 设定的报销率。Heartflow 在监管文件中指出，CMS 提议的 2026 年 OPPS 规则可能使包含 Heartflow FFRCT Analysis 的临床 APC Medicare
              报销率最多下降 15%。这种报销波动说明，纯软件诊断供应商持续承受实现价格压力，而资本设备巨头更容易用多元收入线吸收压力。
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP007
              - CP010
              - CP012
              - CP013
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 扫描仪 OEM 平台捆绑风险
            body: >-
              Heartflow 市场定位面临的主要结构性威胁来自 Siemens Healthineers、GE Healthcare 和 Philips 等医疗影像集团，它们制造提供 CCTA 数据的实体 CT
              扫描仪。如果影像 OEM 以零成本或边际成本推出原生集成 AI 分析包，独立专业 SaMD 厂商将面临客户利润率压缩和渠道摩擦。
            calloutType: risk
            claimRefs:
              - CP003
              - CP004
          - type: callout
            title: 临床试验规模与编码构成竞争防线
            body: >-
              Heartflow 抵御 Cleerly、Elucid 等灵活风险投资创业公司的能力，依靠专有临床登记规模——包括 DECIDE 登记中超过 23,000
              名患者的前瞻性随访数据——以及覆盖商业和政府医疗计划的成熟 Category I CPT 编码基础设施。
            calloutType: insight
            claimRefs:
              - CP008
              - CP011
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与定价架构
        blocks:
          - type: paragraph
            body: >-
              Heartflow 的 CCTA 后处理采用双模式商业模型，包括成熟的 Heartflow FFRCT Analysis 和新兴的 Heartflow Plaque Analysis。FY2026 第二季度总收入
              $64.1 million，同比增长 48% [CI001]。增长主要由国内市场带动：美国收入同比增长 51% 至 $59.6 million，国际及其他收入为 $4.5 million [CI001]。旗舰
              FFRCT 处理仍是主要经济引擎，受益于全国临床采用以及覆盖 99.5% 美国商业保险和 Medicare 参保人口的 Category I CPT 报销 [CI008]。Plaque Analysis
              是主要增长方向，FY2026 第二季度贡献季度收入 $7.8 million [CI001]。管理层将 2026 年全年斑块收入预期上调至 $29 million 至 $31
              million，预计年末启用斑块业务的医院账户约 1,250 个 [CI002]。Medicare APC
              计划下的医院门诊报销提供可预测收费结构，但医疗系统按目录价和企业量级档位私下签约，使已实现的单病例价格不透明 [CI008]。
