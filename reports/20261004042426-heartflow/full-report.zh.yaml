            body: >-
              公开披露显示，John Farquhar 任总裁、首席执行官兼董事，Vikram Verghese 任首席财务官，William Weldon 任董事会主席。官方简介补充了相关医疗科技和上市公司经验，但文件警告
              Heartflow 没有为高管或其他员工购买关键人物保险。公司于 2025 年 8 月完成 IPO，年报披露净募资约 $332.4 million，并将 2025 年融资所得的一部分用于偿还 $115.1
