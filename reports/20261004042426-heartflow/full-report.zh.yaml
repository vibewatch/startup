      - number: '1.2'
        title: 运营规模与上市公司转型
        blocks:
          - type: paragraph
            body: >-
              Heartflow 报告 2025 年收入为 $176.0 million，2026 年第一季度收入为 $52.6 million，管理层称后者同比增长 41%。收入不是
              ARR；没有季节性证据，不应把季度结果年化为运行率。截至 2025 年 12 月 31 日，公司报告已评估患者超过 600,000 人，2025 年评估患者 219,000 人，美国账户超过 1,465
              个，全球全职员工 843 人。其未标日期的 About 页面目前声称已治疗患者超过 750,000 人、使用 Heartflow 的机构超过 1,800
              家。这些后来的网站指标显示规模扩张，但“账户”和“机构”没有被证明使用相同分母，不应据此计算增长率。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
