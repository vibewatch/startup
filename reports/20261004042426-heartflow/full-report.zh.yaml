        title: 资本充足性、现金消耗与或有负债
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 6 月 30 日，Heartflow 资产负债表上有 $246.8 million 现金、现金等价物和投资 [CI006]。运营现金消耗较历史水平放缓：2025 全年运营活动净现金使用
              $54.0 million，低于 2024 年的 $69.0 million 和 2023 年的 $76.4 million [CI007]。管理层据称现有流动资源足以实现自给自足的运营盈利，无需稀释性股权融资
              [CI006]。Forge 历史融资页面给出不一致的累计融资总额 $890.7 million 和 $755.52 million，因此两者都不被视为当前流动性
              [CI014]。但业务仍面临重大的法律和监管压力。2025 年 10 月，美国司法部依据联邦《反回扣法》和《虚假申报法》，就与医疗服务商的财务安排和营销做法向 Heartflow 及部分员工发出民事调查要求
              [CI011]。与此同时，Heartflow 与竞争者 Cleerly 进行多年知识产权诉讼，促使管理层调整非 GAAP SG&A 指标，剔除专利诉讼成本 [CI012]。华尔街分析师一致预期 FY2026
