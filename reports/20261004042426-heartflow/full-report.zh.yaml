              文件支持 Heartflow 从 2007 年成立、2015 年商业化到 2025 年上市的历程，但当前风险不能简化为增长里程碑。2025 年 10 月，Heartflow
              及部分员工收到美国司法部民事调查要求，涉及医疗服务商的财务和合同安排，以及《反回扣法》和《虚假申报法》下的销售与营销活动。10-K 称调查持续时间、结果和可能的财务影响尚无法估计。一篇明确由 AI
