      - number: '5.3'
        title: 临床验证、知识产权壁垒与企业安全
        blocks:
          - type: paragraph
            body: >
              Heartflow 的临床差异化建立在大量前瞻性随机对照试验和临床登记之上。关键 NXT 试验显示，相对于有创导管 FFR 测量，FFRCT 的逐血管诊断准确率为 86%，而单独 CCTA 为 65%（p <
              0.001）。前瞻性 PRECISE 试验显示，CCTA 加 Heartflow FFRCT 诊断路径使仅用于诊断的有创冠脉造影（ICA）减少 69%，同时使后续进行治疗性血运重建的导管检查产出率从 30.5%
              翻倍至 71.9%。


              截至 2025 年 12 月 31 日，公司通过全球知识产权组合保护技术基础，约有 617 项已授权专利和 93 项待审申请。组合覆盖计算机实现的 CFD 模拟、机器学习驱动的解剖边界提取、交互式 3D
              图形界面，以及仅用机器学习估算 FFR 的替代方法；关键美国专利有效期延续至 2044 年。企业医疗信任由信息安全管理系统支持，该系统持有 HITRUST、ISO 27001、ISO 13485、SOC 2
              Type 2 和 UK CyberEssentials 认证，为受保护健康信息处理提供正式合规保障。
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
