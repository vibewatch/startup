  - id: TV003
    title: 乐观、中性与悲观情景框架
    columns:
      - 情景
      - 基于证据的信号
      - 估值 / 回报逻辑
      - 下行触发条件
      - 概率信号
    rows:
      - - 乐观
        - 2026 年收入达到公司指引的 $228M-$232M 区间，利润率维持在接近 Q1 的水平，现金使用额下降
        - 在核实当前 EV 和同业倍数前，该区间无法支撑估值判断
        - 增长或利润率不及预期，同时现金使用额没有改善
        - 未量化；需要当前交易和产品组合证据
      - - 中性
        - 收入增长，但经营亏损和 FFRCT 集中度持续
        - 跟踪业绩；不要从历史私募估值推断回报
        - 多元化和留存仍未披露
        - 与现有混合证据最一致，但未赋予数值概率
      - - 悲观
        - 增长放缓、毛利率收缩、经营现金使用额上升，或法律风险损害执行
        - 没有当前企业价值，无法界定下行空间
        - 增长大幅放缓、现金使用额恶化或出现不利法律结果
        - 下行路径可信；幅度和概率仍未量化
    notes: 情景数值没有被估算，这是有意为之：指定证据池缺少当前股价、企业价值、同业倍数集合和概率证据。
    claimRefs:
      - CV002
      - CV003
      - CV005
      - CV007
      - CV010
      - CV015
