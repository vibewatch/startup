        - Q1 2026 年净经营亏损为 $29.5M；2025 年经营现金使用额为 $54.0M
        - 在经营现金使用额下降的同时保持增长
      - - 产品组合
        - 使用驱动型收入已证明具备规模
        - FFRCT 占 2025 年收入的 98%
        - 经审计的产品收入和附加率多元化
      - - 资本结构
        - IPO 产生约 $332.4M 净募资
        - $98.3M 票据按 IPO 价格的 20% 折价转换
        - 当前完全摊薄股数和净现金桥接表
      - - 客户与竞争
        - 没有单一客户占 2025 年收入至少 10%
        - 决策仍可能集中；与 Cleerly 的专利诉讼正在进行
        - 客户留存数据和经核实的诉讼状态更新
    notes: 该表将已报告的财务指标与分析含义分开；Cleerly 诉状记录的是 Heartflow 的指控，并不证明责任或结果。
