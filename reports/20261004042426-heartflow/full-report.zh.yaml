            body: >-
              Heartflow 的商业模式可以在既有账户内扩张：转诊医生下单更多分析，Plaque 也能与 FFRCT 一起启用。TradingKey 报道称，2025 年新增的 340 个账户正按管理层预期爬坡，而新的
