      - number: '7.4'
        title: 财务、治理与市场风险影响
        blocks:
          - type: paragraph
            body: >-
              产品集中和亏损使执行失误影响更大。Heartflow FFRCT Analysis 占 2025 年收入的 98%；公司报告 FY2025 净亏损 $116.8 million，前九个月净亏损 $92.4
              million，这些是会计亏损，不是现金消耗或现金跑道。公开网站声称已治疗患者超过 750,000 人、使用 Heartflow 的机构超过 1,800 家，但抓取页面没有 as-of
              日期，因此不能把运营规模误当作已披露留存或服务可靠性。IPO 时，高管、董事、5% 持有人和关联方预计持有约 50.1% 并拥有重大投票控制；这是 IPO 日估计，不是当前持股数据。MarketBeat 报告
              2026 年 10 月 3 日 beta 为 2.73，显示该数据集中的公开市场波动。因此投资监测应区分会计亏损和现金使用，并要求当前持股、现金流、产品组合、可靠性和留存证据。
            claimRefs:
              - CR003
              - CR010
              - CR014
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR007
              - CR010
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 现实的法律不确定性
            body: 最新指定文件中的 DOJ 调查仍未解决，Heartflow 自己也称结果可能产生重大影响；尽调不应把没有披露解决结果转化为不存在负债的假设。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
          - type: callout
            title: 会计亏损不是现金消耗
            body: 引用的 FY2025 $116.8 million 和 2025 年九个月 $92.4 million 是会计净亏损。现金跑道需要现金流和当前流动性分析，不能把任一数字改称现金消耗。
            calloutType: assumption
            claimRefs:
              - CR010
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              证据支持持续跟踪、继续研究，而不是不考虑价格直接买入。Heartflow 报告 2025 年收入 $176.0 million，同比增长 40%；随后 2026 年第一季度收入 $52.6
              million，同比增长 41%，第一季度毛利率 80.2%。这些是收入和毛利率指标，不是 ARR，也不是持续留存证明。同一季度发布还报告净运营亏损 $29.5 million，其中含 $7.5 million
              非现金减值；该会计亏损不是现金消耗。2025 年文件另报告运营现金使用 $54.0 million，年末现金、等价物和投资 $280.2
              million；这些余额不能确定当前现金或跑道。最重要的是，没有成功分配的来源提供 2026 年 10 月股价、净债务桥接、企业价值或可交易入场倍数。没有这些输入，既无法支持目标回报，也无法支持估值区间。
            claimRefs:
              - CV001
