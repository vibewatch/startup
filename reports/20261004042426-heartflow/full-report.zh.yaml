  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 非侵入性 CCTA 诊疗路径上的产品组合
        blocks:
          - type: paragraph
            body: >
              Heartflow 已将一体化云端软件平台商业化，用于改变冠状动脉疾病（CAD）的诊断和治疗管理。Heartflow Platform 不依赖
              SPECT、负荷超声心动图或跑台试验等传统负荷型非侵入性检查（NIT），而是利用一套标准 CCTA 数据，生成患者冠脉的个性化三维解剖和生理数字孪生模型。


              临床套件包括三款已获商业许可的软件应用，另有一款即将推出的介入规划方案。Heartflow RoadMap Analysis 从合格 CCTA
              扫描中自动提取冠脉解剖结构，标出具有临床意义的管腔狭窄区域，加快诊断工作流。Heartflow FFRCT Analysis 于 2014 年通过 FDA de novo 510(k)
              获批，在模拟最大充血状态下应用计算流体力学（CFD），计算冠脉动脉树每条主要分支的血流储备分数，以 0.80 作为血流动力学显著狭窄的验证阈值。Heartflow Plaque Analysis 于 2023
              年末开始有限商业教育，量化斑块总量并区分非钙化与钙化成分，为长期预防性药物治疗提供依据。第四款应用 Heartflow PCI Planner 计划于 2026
              年商业发布，帮助介入心脏科医生进行虚拟支架放置和手术建模。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
      - number: '5.2'
        title: 运营模式、算法流水线与生产基础设施
        blocks:
          - type: paragraph
            body: >
              Heartflow 运行集中式软件即服务处理流水线，托管于 Amazon Web Services（AWS）云基础设施。医疗中心通过 Heartflow 轻量网关客户端，将门诊或医院 CT 扫描仪采集的
              DICOM 图像序列安全上传至云端。处理流程从深度卷积神经网络模型开始；模型用超过 160 million 张带标注 CCTA 图像训练，用于分割管腔边界、冠脉血管中心线和心肌体积。


              运动模糊、心率过高和严重钙化等生物图像伪影可能扭曲算法分割，因此 Heartflow
              采用人工参与的质控架构。专业生产分析师通过专有复核软件检查算法提取的模型，在高性能计算模拟运行前手动编辑并批准冠脉分割。模拟引擎在患者专属边界条件下求解 Navier-Stokes
              血流方程，得出生理压力，无需药物给予腺苷。完成的报告在数小时内通过交互式网页、可下载 PDF 摘要以及直接的电子病历（EHR）和 PACS 集成返回给下单医生。
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
