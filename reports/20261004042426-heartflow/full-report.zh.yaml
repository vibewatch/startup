            body: >-
              Heartflow 的输出依赖一条始于其软件之外的链条。独立 SCCT 指南称冠脉 CTA 诊断质量取决于硬件、软件和采集协议，Heartflow 文件则称输入图像限制可能影响分析。同一文件警告 AI
              模型、分析师复核和软件可能含有未发现的错误；还披露过去代码和发布流程缺陷曾间歇性中断医生使用，其中部分通过 FDA MAUDE 报告。这些不是当前系统性不准确的证明，但使图像接受率、报告更正率、MAUDE
              趋势、周转时间超时和投诉关闭时间成为必要监测指标。临床重要更正持续增加或发生召回，将挑战平台风险调整后采用逻辑的可信度。
