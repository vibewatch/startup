companyProfile:
  summary: >
    Heartflow 是一家 2007 年成立的上市心血管软件公司，在云端工作流中分析冠脉 CTA 扫描，并输出 AI 辅助的 FFRCT、斑块和 PCI 规划结果。公司披露的规模已较大且仍在增长：2025 年收入 $176.0
    million、2026 年第二季度收入 $64.1 million，平台据报已被 1,800 多家机构使用，累计治疗患者超过 750,000
    人。尽调的主要保留项是：产品层面的斑块业务经济性、留存和客户集中度仍只披露了一部分；DOJ 民事调查和报销敏感性仍是现实风险。
