      - number: '7.3'
        title: 基础设施、安全与交易对手集中度
        blocks:
          - type: paragraph
            body: >-
              Heartflow 将全部云基础设施外包给 AWS。文件称服务中断可能使临床服务无法访问，AWS 可提前 30
              天通知终止，或在特定条件下更早终止；文件没有披露正在运行的多云故障切换。平台还存储和传输客户及患者身份信息，因此一次泄露可能同时带来停机、责任、认证丧失、客户流失和补救费用。客户集中度更隐蔽：没有客户占 2025
              年收入的 10%
              或以上，但多个账户的决策可能集中在少数医疗系统。公司招聘材料显示，投诉调查、质量和准确性反馈、服务水平及支持扩展需要专门的跨职能团队。恢复目标、切换测试结果、安全事件、医疗系统集中度和支持服务水平仍是非公开尽调事项。
            claimRefs:
