      - number: '4.2'
        title: 成本结构、单位经济性与利润率扩张
        blocks:
          - type: paragraph
            body: >-
              Heartflow 的运营模式在商业固定成本较高的同时，毛利率显著扩张。FY2026 第二季度非 GAAP 毛利率同比提升 770 个基点至 83.3%，高于 FY2025 第二季度的 75.6%
              [CI004]。全年非 GAAP 毛利率指引随后上调至约 82%，管理层目标是在算法自动化和规模杠杆支持下达到中期 85% 的运行率 [CI004]。FY2026 第二季度全球收入病例数达 84,491，同比增长
              74%，显示病例需求强劲 [CI001]。交付成本主要包括 Amazon Web Services 云计算基础设施，以及临床交付前检查解剖血管分割结果的人工质控图像分析师。尽管毛利增长，运营费用仍高：FY2026
              第二季度销售、一般及行政费用 $37.8 million，研发投入 $23.5 million [CI005]。公司报告本季度非 GAAP 运营亏损 $7.9 million，优于上年同期 $11.5
              million [CI005]。客户获客成本、回收期、医院队列净收入留存等关键单位层面数据仍属私有且未披露 [CI013]。
