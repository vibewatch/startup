  - id: FM001
    title: 公司估算的美国 TAM 下的患者量视角
    type: pyramid
    summary: 相对患者池展示广泛的无创检测分母如何逐步缩小到产品适用人群，再缩小到已报告的 2025 年美国使用量；各层是相互重叠的规模视角，不是转化阶段。
    data:
      items:
        - label: 接受 NIT 的稳定型胸痛患者
          value: 9500000
          unit: patients per year
          detail: 公司基于 Clarivate ProcedureFinder 估算的美国年度分母。
        - label: 符合 Plaque Analysis 适用条件的患者总数
          value: 5500000
          unit: patients per year
          detail: 公司将稳定型和急性 NSTE 胸痛适用人群合并后的估算。
        - label: 符合 Plaque Analysis 适用条件的稳定型患者
          value: 5100000
          unit: patients per year
          detail: 公司在稳定型路径中采用约 60% 斑块假设后的估算。
        - label: 符合 FFRCT 适用条件的患者总数
          value: 3100000
          unit: patients per year
          detail: 公司将稳定型和急性 NSTE 胸痛适用人群合并后的估算。
        - label: 符合 FFRCT 适用条件的稳定型患者
          value: 2800000
          unit: patients per year
          detail: 公司对稳定型情况下狭窄程度为 40% 至 90% 患者的估算。
        - label: 2025 年接受分析的美国患者
          value: 195000
          unit: patients
          detail: 已报告的实际年度使用量，公司称其不到整体机会的 2%。
    approximationNotes: 数值根据公司文件复现，并按披露方式四舍五入。Plaque 和 FFRCT 的适用人群相互重叠，急性病例增量并非 9.5M 稳定型分母的子集；该展示不应解读为转化漏斗、经独立核实的预测或可加总的人口模型。
    claimRefs:
      - CM003
      - CM004
      - CM005
      - CM007
