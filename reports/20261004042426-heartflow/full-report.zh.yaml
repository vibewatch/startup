chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Heartflow 是一家 2007 年成立于特拉华州的公司，也是一家以 HTFL 交易的上市医疗科技软件公司。公司文件描述的是按使用量驱动的模式：医生下单 FFRCT Analysis、Plaque
              Analysis 或两者，Heartflow 在交付所请求的分析时确认收入。平台于 2015 年商业化，因此它是成熟的工作流业务，而不是尚未产生收入的 AI 开发商。最新年报仍将 Mountain View
              列为主要行政办公地点，但 2026 年第一季度电话会披露了与总部迁往 San Francisco 相关的设施减值。因此，应确认其法律和运营地址，不能不加限定地把任一城市视为当前总部。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
