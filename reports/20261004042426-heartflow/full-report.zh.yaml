  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可投资市场是面向有症状冠状动脉疾病、附着于冠状动脉计算机断层血管造影（CCTA）的软件分析，不包括全部心脏影像、CAD 治疗或 CT 设备。Heartflow 当前的付费产品在医疗服务商已经完成的 CCTA
              上增加生理学和斑块表征；RoadMap 和 PCI Navigator 被描述为集成工作流功能，而非独立产品。因此，临床相关的现状还包括负荷 SPECT、负荷超声心动图、PET、单独复核
              CCTA，以及有创血管造影或有创 FFR。CCTA 的指南地位是需求驱动因素，但 Heartflow
              仍处于医生决定订购合适扫描之后的环节。无症状风险预测属于相邻机会，不是当前可服务需求，因为公司称仍需更多证据、监管批准、支付方覆盖和商业化工作。
            claimRefs:
              - CM001
              - CM002
              - CM013
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM013
              - CM014
      - number: '2.2'
        title: 从患者、产品和已实现需求角度测算市场
        blocks:
          - type: paragraph
            body: >-
              Heartflow 估计 FFRCT 和 Plaque Analysis 在当前美国市场的机会约为 $5 billion。其披露的测算从每年接受非侵入性检查的约 9.5 million
              名独立稳定胸痛患者开始，再套用临床适用性假设和假定售价，得出约 3.1 million 名 FFRCT 适用患者、按平均销售价 $1,067 计 $3.3 billion；另有约 5.5 million
              名斑块适用患者，按 $300 计增量 $1.7 billion。这些是同一路径上的重叠产品机会，不是独立人群或转化漏斗。最佳公开采用交叉验证同样来自公司：2025 年分析的 195,000
              名美国患者不足公司整体机会的 2%，约占当前美国 CCTA 量的 19%。现有独立来源都无法重建分母、适用性筛选、已实现净价或 CAGR。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
