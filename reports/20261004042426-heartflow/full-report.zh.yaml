        - 与负荷试验相比，大幅减少假阴性评估
        - 需要高质量多排 CT 扫描仪及患者心率控制
      - - 生理性缺血评估
        - 使用冠脉压力导丝进行有创导管插入（有创 FFR）
        - 从单次 CCTA 采集中进行无创 FFRCT 血流模拟
        - 相比有创 FFR，每条血管准确率达 86%；正常有创导管检查减少 69%
        - 云端处理延迟数小时，无法用于急诊急性分诊
      - - 动脉粥样硬化与斑块表征
        - Agatston 冠状动脉钙化（CAC）评分
        - 用 AI 量化评估总斑块、钙化斑块及非钙化斑块体积
        - 预测后续罪犯斑块破裂，并在 >50% 的病例中改变药物管理
        - 相比已建立的 FFRCT 代码，商业保险覆盖政策仍在演变
      - - 血运重建策略与 PCI 规划
        - 导管插入期间进行二维有创诊断血管造影
        - 进入导管室前由虚拟 PCI 规划器模拟支架置入后的血流动力学
        - 在计算机模拟中优化支架选择及计划中的血管介入
