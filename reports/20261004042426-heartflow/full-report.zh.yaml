        title: 法律、监管与报销风险
        blocks:
          - type: paragraph
            body: >-
              最紧迫的已披露法律风险是真实存在而非假设：Heartflow 报告称其与部分员工在 2025 年 10
              月收到美国司法部民事调查要求，涉及服务商财务和合同安排，以及《反回扣法》和《虚假申报法》下的销售与营销活动。公司正在配合，但无法估计持续时间或结果，并称结果可能重大影响业务、财务状况、业绩或现金流。除此之外，Medicare
              和商业支付仍是反复出现的模式依赖。2025 年 Form 10-K 说明 CMS 使用医院成本和收费数据重置费率，并以 2025 年 7 月最多下调 15%
              的提案作为历史例子；已获取证据无法确定该提案的最终结果。最终执法、排除风险、重大偿还或报销重置若显著损害账户经济性，将成为击穿论点的事件。
            claimRefs:
