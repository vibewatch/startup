  - id: FI001
    title: Heartflow 收入与成本转化桥
    type: flow
    summary: 展示从医院初始 CCTA 患者扫描，到净收入和毛利的临床及商业逐级转化路径。
    data:
      nodes:
        - id: ccta-scans
          label: 1. 已完成的医院 CCTA 扫描
        - id: cloud-ingestion
          label: 2. 云端图像摄取与病例提交
        - id: ai-segmentation
          label: 3. 自动 AI 分割与 CFD 分析
        - id: analyst-qa
          label: 4. 人工质量保证与临床验证
        - id: report-delivery
          label: 5. 向医生交付临床报告
        - id: case-billing
          label: 6. 病例诊断计费（CPT 75580 / Plaque）
        - id: gross-profit
          label: 7. 净收入（$64.1M Q2）与毛利（83.3%）
    approximationNotes: 表示运营和经济工作流顺序；使用量转化百分比以及每次扫描的具体云处理单位成本未公开披露。
    claimRefs:
      - CI001
      - CI004
      - CI007
  - id: FE001
    title: Heartflow 端到端技术栈与数据流架构
    type: stack
    summary: Heartflow Platform 的架构层涵盖医院边缘传输、云端 AI 分割、人工质量控制、生物物理建模、临床可视化和企业治理。
    data:
      layers:
        - label: 医院边缘端与图像摄取
          detail: 嵌入医院或门诊影像中心的客户端软件将 DICOM CCTA 扫描安全传输至 AWS。
          modules:
            - 医院扫描仪网关
            - DICOM TLS 加密
        - label: 云端 AI 分割与几何提取
          detail: 基于超过 1.6 亿张图像训练的深度学习神经网络模型，分割冠状动脉、管腔边界和心肌组织。
          modules:
            - 多任务 CNN 分割
            - 3D 血管树提取
        - label: 人在回路质量控制
          detail: 经认证的生产分析师使用专有检查软件审查并手动调整算法提取的冠脉几何结构。
          modules:
            - 分析师检查控制台
            - 边界校正反馈回路
        - label: 血流动力学模拟与生物物理建模
          detail: 基于云的计算流体动力学求解器执行 3D Navier-Stokes 数值方程，推导特定血管的 FFRCT 值。
          modules:
            - Navier-Stokes 求解引擎
            - 斑块体积分类器
        - label: 临床可视化与 EMR 交付
          detail: 交互式 3D 可视化 Web 应用（Vue.js 前端）、移动查看器，以及自动将 PDF 交付至医院 EMR 系统。
          modules:
            - WebGL 交互式查看器
            - EMR 与 PACS 集成网关
        - label: 质量管理与安全治理
          detail: 持续监管合规、审计日志和安全控制符合 ISO 13485 医疗器械及 SOC 2 Type 2 标准。
          modules:
            - 信息安全管理系统
            - 质量审计与可追溯性控制
    approximationNotes: 架构层综合自 Heartflow Form 10-K 文件、技术披露和工程规格。
    claimRefs:
      - CE006
      - CE007
      - CE008
      - CE009
      - CE014
  - id: FU001
    title: 使用驱动的客户旅程与扩张闭环
    type: journey-map
    summary: 商业旅程从设施实施推进到医生订购和产品扩张；可取消合同和缺失的队列指标掩盖了续约的持久性。
    data:
      items:
        - label: 设施资格评估
          detail: 医疗提供商或医疗系统建立账户。
          touchpoints:
            - 商业评估
            - 付款方和报销审查
        - label: 实施与培训
          detail: 新账户完成安装、实施和培训后，公司才开始确认收入。
          touchpoints:
            - 工作流设置
            - 临床医生培训
        - label: 首次医生订购
          detail: 医生订购 FFRCT Analysis、Plaque Analysis 或两者，提供商账户在交付时计费。
          touchpoints:
            - CCTA 病例
            - 使用驱动的分析
        - label: FFRCT 使用量爬坡
          detail: 管理层称新账户通常需要约一年才能接近成熟的 FFRCT 使用水平。
          touchpoints:
            - 转诊医生教育
            - 重复订购
        - label: Plaque 启用
          detail: 更多医生和符合条件的 CCTA 病例可以扩大已安装账户内的使用。
          touchpoints:
            - Plaque 账户启用
            - 更广泛的病例适用范围
        - label: 客户韧性检查点
          detail: 用 30 天取消权和私有队列数据验证留存与扩张。
          touchpoints:
            - 续约与流失复盘
            - 医疗系统采购决策
    approximationNotes: 该定性顺序源自申报文件和当前业绩摘要；除管理层报告的 FFRCT 爬坡期外，它不代表公司披露了转化率、标准合同期限或统一的价值实现时间。
    claimRefs:
      - CU003
      - CU014
      - CU015
      - CU016
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 定性排序显示，正在进行的 DOJ 调查、对单一云服务商的依赖，以及报销 / 产品集中度风险高于治理和市场波动风险；概率未知这一点仍予以保留。
    data:
      columns:
        - 可能性证据
        - 潜在影响
        - 缓释成熟度
        - 剩余风险等级
      rows:
        - label: DOJ 调查
          values:
            - label: 进行中，概率未知
              tone: warning
              detail: 公司已收到民事调查要求；结果和持续时间无法估计。
            - label: 可能重大
              tone: negative
              detail: 公司指出，这可能对业务、财务状况、经营业绩或现金流产生重大影响。
            - label: 早期 / 未披露
              tone: warning
              detail: 公司披露了配合调查，但未披露解决条款和损失区间。
            - label: 关键
              tone: negative
              detail: 法律风险正在持续，公开结果没有明确上限。
        - label: 报销与产品集中度
          values:
            - label: 每年反复暴露
              tone: warning
              detail: CMS 和商业支付方可以调整覆盖范围、编码和支付。
            - label: 高
              tone: negative
              detail: FFRCT Analysis 占 2025 年收入的 98%。
            - label: 未量化
              tone: warning
              detail: 此处没有确立量化的定价或产品多元化缓冲。
            - label: 高
              tone: negative
              detail: 支付变化会影响占主导地位的收入产品。
        - label: 临床输入与 AI 质量
          values:
            - label: 已披露缺陷，频率未知
              tone: warning
              detail: 申报文件描述了过去的缺陷，以及未来可能出现的图像、软件、AI 和人工复核错误。
            - label: 高
              tone: negative
              detail: 错误可能影响临床使用、法律责任、采用率和声誉。
            - label: 发展中
              tone: warning
              detail: 已有标准和人工复核，但结果发生率未公开。
            - label: 高
              tone: negative
              detail: 临床后果和缺失的分母使剩余风险持续存在。
        - label: AWS 与网络安全
          values:
            - label: 已知的单一服务商暴露
              tone: warning
              detail: 全部云基础设施都在 AWS 上；攻击和宕机是持续存在的风险。
            - label: 高
              tone: negative
              detail: 停机或泄露可能中断临床访问并暴露受保护数据。
            - label: 部分有证据
              tone: warning
              detail: 公司披露了安全控制，但未披露经过测试的替代云恢复方案。
            - label: 高
              tone: negative
              detail: 即使已有披露的控制措施，单一服务商集中度仍然存在。
        - label: 亏损与客户决策
          values:
            - label: 持续中
              tone: warning
              detail: FY2025 仍处于亏损状态；多账户决策可能集中在少数客户手中。
            - label: 中高
              tone: warning
              detail: 执行受挫可能影响盈利能力和多个账户。
            - label: 部分
              tone: warning
              detail: 公司描述了客户扩张，但留存和系统集中度未公开。
            - label: 中高
              tone: warning
              detail: 财务和客户韧性需要当前经营证据支持。
        - label: 治理与股价波动
          values:
            - label: 可观察，当前水平部分过时
              tone: neutral
              detail: IPO 控制权估计来自历史数据；MarketBeat 的 beta 数据截至其文章发布时为最新。
            - label: 中
              tone: warning
              detail: 投票影响力和股价波动可能影响少数股东的结果。
            - label: 公开披露
              tone: neutral
              detail: 申报文件提供了所有权和市场风险的可见度，但仍需更新。
            - label: 中
              tone: neutral
              detail: 这对入场纪律很重要，但风险低于临床和法律运营风险。
    approximationNotes: 序数标签是分析师基于已披露状态和影响作出的判断，不是估计的事件发生概率。未知的可能性仍然未知，IPO 所有权估计也不被视为当前所有权。
    claimRefs:
      - CR002
      - CR003
      - CR006
      - CR007
      - CR010
      - CR015
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 由于当前估值输入缺失，经营证据最终只支持“跟踪 / 继续研究”的决定。
    data:
      nodes:
        - id: growth
          label: 增长
          detail: 2025 年收入增长 +40%；2026 年第一季度收入增长 +41%
        - id: margin
          label: 毛利率
          detail: 2026 年第一季度毛利率为 80.2%
        - id: cash
          label: 现金纪律
          detail: 2025 年经营现金使用额为 $54.0M
        - id: concentration
          label: 集中度
          detail: FFRCT 占 2025 年收入的 98%
        - id: valuation-gap
          label: 估值缺口
          detail: 当前股价、EV 和可比公司倍数尚未确定
        - id: decision
          label: 决策
          detail: 跟踪 / 继续研究
      edges:
        - from: growth
          to: margin
        - from: margin
          to: cash
        - from: cash
          to: concentration
        - from: concentration
          to: valuation-gap
        - from: valuation-gap
          to: decision
    approximationNotes: 这是一条定性决策链；其中没有编码估值倍数、回报目标或情景概率。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV005
      - CV010
      - CV012
      - CV016
