      - number: '8.2'
        title: 投资论点、融资背景与下行风险
        blocks:
          - type: paragraph
            body: >-
              投资论点结合病例驱动的快速收入增长、高毛利率和公开市场融资渠道。Heartflow 2025 年 8 月 IPO 发行 19,166,667 股，每股 $19.00，净募资约 $332.4
              million。交割时，$98.3 million 可转换票据按每股 $15.20 转换为 6,470,743 股普通股，较 IPO 价格折价
              20%。这次转换是历史稀释事实，并不代表持续存在清算优先权。融资历史数据也相互冲突：Tracxn 报告 12 轮融资共 $936 million，Forge 则报告 12 轮共 $890.7 million，以及
              2023 年 4 月私募投后估值 $546.5 million。以上都不是当前公开市场估值。反向逻辑在于经营集中度：FFRCT 占 2025 年收入的 98%。没有任何单一客户贡献 10% 或以上，但
              Heartflow 警告，跨账户的决策仍可能集中。Heartflow 2026 年 4 月针对 Cleerly 提起的专利诉讼，又增加了一项仍在持续的法律和竞争依赖，其结果不能由诉状确定。
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
              - CV009
              - CV010
              - CV011
              - CV015
      - number: '8.3'
        title: 情景、退出准备度与最终尽调
        blocks:
          - type: paragraph
            body: >-
              看涨信号是按管理层 2026 年 $228 million 至 $232 million 收入指引执行，同时保持约 80%
              毛利率并减少运营现金使用；即便如此，没有当前企业价值也无法量化上行空间。基准情景是持续增长但亏损和 FFRCT
              集中度仍在，适合跟踪而不是把精确回报计入投资判断。悲观情景包括增长放缓、毛利率压缩、运营现金使用增加、产品多元化失败或诉讼结果不利。Heartflow 已上市，相关退出问题是价格和流动性，而不是 IPO
              准备度。最终尽调应取得当前完全摊薄股数、现金、投资、债务、股价、产品层收入、留存、报销实现度，以及基于共同期间和分母的可比交易倍数。击穿论点的触发因素包括披露增长显著放缓、利润率持续恶化、现金使用变差、继续近乎完全依赖
              FFRCT，或损害商业化的法律结果。在这些检查完成前，情景概率和美元估值区间仍是缺口，而非可投资估计。
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV007
              - CV010
              - CV015
              - CV016
