schemaVersion: "report-v2"
artifact: market-analysis
slug: heartflow
runDate: "2026-10-04"
company:
  name: Heartflow
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Heartflow addresses a narrow, reimbursement-dependent layer of the U.S. coronary artery disease
    diagnostic pathway rather than the whole cardiology market. Its approximately $5 billion U.S.
    opportunity is a company-built estimate, while current adoption indicators show meaningful scale
    but do not establish a defensible independent SAM or SOM.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      The investable market is the software-enabled analysis attached to coronary computed tomography
      angiography (CCTA) for symptomatic coronary artery disease, not all cardiac imaging, CAD treatment,
      or CT equipment. Heartflow's current paid products add physiology and plaque characterization to
      a CCTA that a provider has already performed; RoadMap and PCI Navigator are described as integrated
      workflow features rather than stand-alone products. The clinically relevant status quo therefore
      includes stress SPECT, stress echocardiography, PET, review of CCTA alone, and invasive angiography
      or invasive FFR. CCTA's guideline position is a demand driver, but Heartflow remains downstream of
      the decision to order a suitable scan. Asymptomatic risk prediction is an adjacency, not present
      serviceable demand, because the company says additional evidence, regulatory approval, payer
      coverage, and commercialization work are still required.
    claimRefs: [CM001, CM002, CM013, CM014]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing through patient, product, and realized-demand lenses
    body: >-
      Heartflow estimates an approximately $5 billion current U.S. opportunity for FFRCT and Plaque
      Analysis. Its disclosed construction starts with an estimated 9.5 million unique stable chest-pain
      patients receiving non-invasive tests annually, then applies clinical-eligibility assumptions and
      assumed selling prices. That produces approximately 3.1 million FFRCT-eligible patients and
      $3.3 billion at a $1,067 average sales price, plus approximately 5.5 million plaque-eligible patients
      and an incremental $1.7 billion at $300. These are overlapping product opportunities from the same
      pathway, not independent populations or a conversion funnel. The best public adoption cross-check
      is also company-issued: 195,000 U.S. patients analyzed in 2025 represented less than 2% of the
      company's overall opportunity and about 19% of current U.S. CCTA volume. Neither retained
      independent source reconstructs the denominator, eligibility filters, realized net price, or CAGR.
    claimRefs: [CM003, CM004, CM005, CM006, CM007, CM008]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyer, user, payer, and adoption path
    body: >-
      Adoption is a multi-stakeholder enterprise motion. Imaging physicians and radiologists influence
      account activation and scan interpretation; referring cardiologists drive case volume; interventional
      cardiologists consume planning information; health systems or imaging facilities contract for the
      service; and government and commercial payers determine whether the economics support routine use.
      Heartflow primarily charges a usage fee when a physician orders and receives FFRCT Analysis,
      Plaque Analysis, or both, so an installed account is not equivalent to recurring utilization. The
      company says a new account generally takes 12 months to approach steady state, defined as FFRCT
      use on roughly 33% of account CCTAs. Its year-end 2025 filing reported more than 1,465 U.S.
      accounts, while the current homepage reports more than 1,800 institutions; the differing labels,
      dates, and geography prevent treating those figures as a clean growth series.
    claimRefs: [CM009, CM010, CM011, CM012, CM013, CM014, CM015]
    tableRefs: [TM003]
  - id: drivers-constraints-and-valuation-relevance
    title: Drivers, constraints, and valuation relevance
    body: >-
      The strongest demand drivers are guideline support for CCTA, broad FFRCT coverage, new Plaque
      Analysis coding and coverage, no required capital-equipment purchase, and the ability to sell more
      than one analysis from the same scan. The first-quarter 2026 result supplies a realized-demand
      signal: company-issued results reported $52.6 million of revenue, up 41% year over year, primarily
      from higher U.S. FFRCT volume. The principal constraints are equally structural. Heartflow depends
      on local CCTA capacity and image quality, physician behavior change, multi-party workflow integration,
      and coverage and payment decisions outside its control. FFRCT coverage was reported at about 99%
      of U.S. covered lives, whereas Plaque Analysis coverage was about 75%, leaving the newer product
      more exposed to payer conversion. For valuation, a large company TAM should therefore be discounted
      until utilization cohorts, realized price by site type, payer mix, and independently reproducible
      serviceable-market evidence are available.
    claimRefs: [CM002, CM011, CM012, CM013, CM015, CM016]
tables:
  - id: TM001
    title: Market definition and boundary
    columns:
      - Segment or category
      - Included spend
      - Excluded spend
      - Buyer or payer
      - Relevance to Heartflow
    rows:
      - - Symptomatic CCTA physiology
        - Per-analysis FFRCT software service for eligible CCTA cases
        - CT scanner, CCTA acquisition, drugs, intervention, and hospital procedure spend
        - Hospital or imaging facility; government and commercial payers influence reimbursement
        - Core current monetized market and 98% of 2025 revenue
      - - Symptomatic CCTA plaque characterization
        - Per-analysis Plaque Analysis software service
        - General preventive cardiology, calcium scoring alone, and non-CCTA imaging
        - Hospital, cardiology or imaging account; payer coverage remains a gate
        - Incremental product opportunity from the same CCTA scan
      - - Workflow features
        - RoadMap and PCI Navigator embedded within the platform experience
        - Stand-alone software TAM because the company does not describe these as stand-alone products
        - Provider account and clinical service line
        - Supports activation, retention, and procedure planning rather than a separately sized market
      - - Status quo and substitutes
        - No Heartflow revenue; represents spend that may be displaced or complemented
        - Heartflow's own software opportunity
        - Cardiology, radiology, hospital administration, and payer
        - Stress SPECT, stress echo, PET, CCTA-alone review, invasive angiography, and invasive FFR
      - - Asymptomatic risk assessment
        - No current serviceable revenue established in retained evidence
        - Present Heartflow TAM and currently reimbursed symptomatic indications
        - Future provider and payer set remains unproven
        - Adjacency requiring clinical evidence, regulatory approval, coverage, and commercialization
    notes: >-
      Boundary is based on Heartflow filings and an independent strategy profile; excluded categories
      prevent the company-estimated software opportunity from being conflated with total CAD spending.
    claimRefs: [CM001, CM002, CM013, CM014]
  - id: TM002
    title: Monetization sizing lenses and limitations
    columns:
      - Publisher
      - Year or period
      - Geography
      - Value
      - CAGR
      - Methodology
      - Confidence
      - Limitation
    rows:
      - - Heartflow prospectus
        - "2025"
        - United States
        - Approximately $5.0B combined FFRCT and Plaque opportunity
        - Not disclosed
        - Sum of company-estimated product opportunities
        - Medium
        - Company estimate; product populations overlap and no independent reconstruction was retained
      - - Heartflow prospectus
        - "2025"
        - United States
        - Approximately $3.3B FFRCT opportunity
        - Not disclosed
        - Approximately 3.1M eligible patients multiplied by $1,067 U.S. average sales price
        - Medium
        - Depends on test volume, stenosis and acute-care assumptions, CCTA access, and assumed price
      - - Heartflow prospectus
        - "2025"
        - United States
        - Incremental approximately $1.7B Plaque opportunity
        - Not disclosed
        - Approximately 5.5M eligible patients multiplied by an estimated $300 U.S. sales price
        - Medium
        - Plaque coverage and realized price were still developing; population overlaps the CCTA pathway
      - - Heartflow first-quarter release
        - Q1 2026
        - Global, with U.S. split disclosed
        - $52.6M quarterly revenue, up 41% year over year
        - Not a market CAGR
        - Reported revenue; growth primarily attributed to higher U.S. FFRCT volume
        - Medium
        - Revenue is a realized-demand signal, not TAM, SAM, ARR, or cash generation
    notes: >-
      Dollar opportunity rows are management estimates from the 2025 prospectus; no retained independent
      source reproduces the patient filters, prices, or CAGR, and the 2026 revenue row is not market size.
    claimRefs: [CM003, CM004, CM005, CM006, CM016]
  - id: TM003
    title: Segment and buyer map
    columns:
      - Segment
      - Economic buyer
      - Primary user
      - Payer
      - Workflow and budget owner
      - Adoption trigger
    rows:
      - - Hospital or integrated delivery network
        - Health-system or service-line leadership
        - Imaging physicians, cardiologists, and interventionalists
        - Medicare, Medicaid, and commercial insurers
        - Cardiology and radiology service lines with revenue-cycle and IT participation
        - Guideline-aligned CCTA program, coverage, and no new capital equipment
      - - Hospital radiology or cardiac imaging
        - Facility or health system
        - Radiologist or imaging cardiologist
        - Government or commercial payer under site-specific payment rules
        - Imaging workflow owner and CCTA operations
        - Faster interpretation, consistent reads, suitable scan quality, and embedded data transfer
      - - Referring cardiology
        - Usually the contracted provider organization
        - Referring cardiologist
        - Patient's insurer
        - Cardiology pathway owner
        - Education, clinical evidence, and confidence that results alter diagnosis or management
      - - Office or clinic imaging account
        - Practice or independent imaging facility
        - Reading physician and referring clinician
        - Physician-fee-schedule and commercial payers
        - Practice administrator and clinical lead
        - Adequate reimbursement, CCTA volume, and utilization ramp after activation
      - - Payer or Medicare contractor
        - Not the product buyer; controls coverage and payment
        - Medical-policy and claims teams
        - The payer itself
        - Coverage, coding, utilization management, and payment policy
        - Clinical utility, coding, medical necessity, and favorable reimbursement
    notes: >-
      Roles are synthesized from company filings and the Umbrex profile; actual contracting authority,
      net price, and budget ownership can vary by site and are not publicly enumerated account by account.
    claimRefs: [CM009, CM010, CM011, CM012, CM013, CM014, CM015]
figures:
  - id: FM001
    title: Patient-volume lens beneath the company-estimated U.S. TAM
    type: pyramid
    summary: >-
      Relative patient pools show how a broad non-invasive-test denominator narrows to product eligibility
      and then to reported 2025 U.S. use; the layers are overlapping sizing lenses, not conversion stages.
    data:
      items:
        - label: Stable chest-pain patients receiving NITs
          value: 9500000
          unit: patients per year
          detail: Company-estimated U.S. annual denominator based on Clarivate ProcedureFinder.
        - label: Total Plaque Analysis-eligible patients
          value: 5500000
          unit: patients per year
          detail: Company estimate combining stable and acute NSTE chest-pain eligibility.
        - label: Stable Plaque Analysis-eligible patients
          value: 5100000
          unit: patients per year
          detail: Company estimate applying an approximately 60% plaque assumption to the stable pathway.
        - label: Total FFRCT-eligible patients
          value: 3100000
          unit: patients per year
          detail: Company estimate combining stable and acute NSTE chest-pain eligibility.
        - label: Stable FFRCT-eligible patients
          value: 2800000
          unit: patients per year
          detail: Company estimate for patients with 40% to 90% stenosis in the stable setting.
        - label: U.S. patients analyzed in 2025
          value: 195000
          unit: patients
          detail: Reported actual annual use, which the company described as less than 2% of overall opportunity.
    approximationNotes: >-
      Values are reproduced from company filings and rounded as disclosed. Plaque and FFRCT eligibility
      overlap, acute additions are not subsets of the 9.5M stable denominator, and the display must not be
      interpreted as a conversion funnel, independently verified forecast, or additive population model.
    claimRefs: [CM003, CM004, CM005, CM007]
callouts:
  - calloutType: insight
    title: Large TAM, narrow monetization layer
    body: >-
      Heartflow monetizes analysis after a suitable CCTA is ordered; it does not capture scanner,
      acquisition, intervention, or the broader CAD-treatment wallet.
    claimRefs: [CM001, CM014]
  - calloutType: risk
    title: Public data does not establish SAM or SOM
    body: >-
      The retained evidence lacks independent eligibility counts, realized net prices, utilization cohorts,
      and payer-level conversion needed to translate the company TAM into a defendable serviceable market.
    claimRefs: [CM003, CM004, CM005, CM006, CM015]
