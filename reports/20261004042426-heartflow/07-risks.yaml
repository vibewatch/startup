schemaVersion: report-v2
artifact: risks
slug: heartflow
runDate: '2026-10-04'
company:
  name: Heartflow
chapter:
  number: 7
  title: Risks
  summary: >-
    Heartflow's highest-evidence risks are an unresolved U.S. Department of Justice investigation, dependence on
    reimbursement and a product that generated 98% of 2025 revenue, and single-provider AWS infrastructure. Clinical
    input quality, AI and human-review errors, continuing accounting losses, customer decision concentration, and public
    market volatility add material residual exposure despite disclosed quality, supplier, and support controls.
sections:
  - id: legal-regulatory-and-reimbursement
    title: Legal, regulatory, and reimbursement exposure
    body: >-
      The most immediate disclosed legal risk is active rather than hypothetical: Heartflow reported that it and certain
      employees received U.S. Department of Justice civil investigative demands in October 2025 concerning provider
      financial and contractual arrangements and sales and marketing activities under the Anti-Kickback Statute and
      False Claims Act. The company was cooperating but could not estimate duration or outcome, and said the result could
      materially affect the business, financial condition, results, or cash flows. Separately, Medicare and commercial
      payment remain recurring model dependencies. The 2025 Form 10-K explained that CMS resets rates using hospital
      cost and charge data and cited a July 2025 proposal for an up-to-15% reduction as a historical example; the fetched
      evidence does not establish that proposal's final outcome. A final enforcement action, exclusion risk, material
      repayment, or reimbursement reset that materially impairs account economics would be a thesis-break event.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
    tableRefs:
      - TR001
  - id: clinical-and-operational-quality
    title: Clinical input and execution quality
    body: >-
      Heartflow's output depends on a chain that begins outside its own software. Independent SCCT guidance states that
      coronary CTA diagnostic quality depends on hardware, software, and acquisition protocols, while Heartflow's filing
      says inbound image limitations can affect its analyses. The same filing warns that AI models, analyst review, and
      software can contain undetected errors; it also discloses past code and release-process defects that intermittently
      interrupted physician use, with a subset reported through FDA MAUDE. These are not proof of current systematic
      inaccuracy, but they make image-acceptance rates, corrected-report rates, MAUDE trends, turnaround-time misses, and
      complaint closure times essential monitoring indicators. A sustained increase in clinically significant corrections
      or a recall would challenge confidence in the platform's risk-adjusted adoption case.
    claimRefs:
      - CR005
      - CR006
      - CR013
      - CR014
    tableRefs:
      - TR002
  - id: infrastructure-security-and-counterparties
    title: Infrastructure, security, and counterparty concentration
    body: >-
      Heartflow outsources all cloud infrastructure to AWS. Its filing says outages could make the clinical service
      inaccessible and that AWS can terminate on 30 days' notice, or sooner under specified conditions; the filing does
      not disclose an active multi-cloud failover. The platform also stores and transmits customer and patient identifying
      information, so a breach could combine downtime, liability, lost certifications, customer loss, and remediation
      expense. Customer concentration is subtler: no customer represented 10% or more of 2025 revenue, yet decision-making
      for multiple accounts can sit with a relatively small number of health systems. Company-issued hiring material shows
      that complaint investigation, quality and accuracy feedback, service levels, and support scaling require a dedicated
      cross-functional function. Recovery objectives, failover-test results, security incidents, health-system concentration,
      and support service-level performance remain non-public diligence items.
    claimRefs:
      - CR007
      - CR008
      - CR009
      - CR011
      - CR013
      - CR014
    tableRefs:
      - TR003
  - id: financial-governance-and-kill-criteria
    title: Financial, governance, and market-risk implications
    body: >-
      Product concentration and losses make execution setbacks more consequential. Heartflow FFRCT Analysis represented
      98% of 2025 revenue, and the company reported a $116.8 million FY2025 net loss after a $92.4 million net loss for
      the first nine months; these are accounting losses, not cash burn or runway. The public website claims more than
      750,000 patients treated and more than 1,800 institutions using Heartflow but gives no as-of date in the fetched
      page, so operating scale should not be mistaken for disclosed retention or service reliability. At the IPO, officers,
      directors, 5% holders, and affiliates were expected to own about 50.1% and exercise significant voting control; that
      is an IPO-date estimate, not a current ownership measure. MarketBeat reported a 2.73 beta on October 3, 2026,
      indicating public-market volatility in that data set. Investment monitoring should therefore distinguish accounting
      loss from cash use and require current ownership, cash-flow, product-mix, reliability, and retention evidence.
    claimRefs:
      - CR003
      - CR010
      - CR014
      - CR015
      - CR016
    figureRefs:
      - FR001
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Risk or rule
      - Public status
      - Likelihood evidence
      - Impact evidence
      - Disclosed mitigation
      - Residual exposure
      - Diligence path or trigger
    rows:
      - - DOJ Anti-Kickback Statute / False Claims Act investigation
        - CID received in October 2025; outcome and duration not estimable in the FY2025 Form 10-K
        - Active investigation; no probability of an adverse outcome disclosed
        - Company says outcome may materially affect business, results, financial condition, or cash flows
        - Company says it is cooperating
        - High uncertainty because no resolution, range of loss, or timetable is disclosed
        - Obtain counsel update; thesis breaks on material settlement, exclusion, complaint, or repayment exposure
      - - Medicare OPPS and MPFS reimbursement
        - Rates reset through recurring rulemaking and hospital cost / charge inputs
        - Historical July 2025 proposal illustrates downside; final disposition is not established by the retained excerpt
        - Lower payment can weaken provider economics and adoption
        - No quantified mitigation maturity disclosed in retained evidence
        - Annual rate and coding sensitivity remains
        - Reconcile final 2026 rates and monitor proposed and final rules for 2027
      - - FDA medical-device and AI lifecycle compliance
        - Cleared products remain subject to post-market controls; AI rules continue to evolve
        - Filing discloses prior software defects and a subset of reports in FDA MAUDE
        - Errors, recalls, delayed changes, or enforcement could impair adoption and reputation
        - Human-in-the-loop review and quality processes are disclosed
        - No public error-rate or correction-rate denominator in the assigned pool
        - Review MAUDE records, recalls, CAPAs, complaint trends, and model-change controls
      - - Health-data privacy and cybersecurity
        - Platform stores and transmits customer and patient identifying information
        - Filing says attacks are ongoing and complete prevention is virtually impossible
        - Breach can cause liability, downtime, lost certifications, customers, and remediation cost
        - Encryption and security certifications are described, but control effectiveness is not independently tested here
        - Third-party cloud and telecommunications providers expand the attack surface
        - Obtain current penetration tests, incident history, cyber coverage, and notification logs
    notes: >-
      Partial public register based on company-issued SEC filings plus independent SCCT guidance; qualitative rankings
      preserve disclosed uncertainty and do not estimate enforcement outcomes or incident probabilities.
    enumerationScope:
      coverage: partial
      basis: >-
        Material U.S. legal, reimbursement, medical-device, AI, privacy, and security risks visible in the assigned
        prefetched sources as of the run date; non-public investigations and foreign matters are not exhaustive.
    claimRefs:
      - CR001
      - CR002
      - CR004
      - CR005
      - CR006
      - CR009
      - CR016
  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Evidence-based likelihood signal
      - Impact
      - Mitigation maturity
      - Residual exposure
      - Monitor or kill criterion
    rows:
      - - Inadequate inbound CCTA image quality
        - SCCT identifies hardware, software, and acquisition-protocol dependence; company says limitations can affect analysis
        - Incorrect or unavailable analysis and reduced physician confidence
        - Standards and image acceptance processes exist; performance data are not public in the pool
        - Customer-site acquisition remains partly outside Heartflow's control
        - Monitor rejection and rescan rates; break thesis on persistent site-level quality failures
      - - AI, software, or analyst-review error
        - Filing discloses past defects and says undetected errors may remain
        - Misdiagnosis exposure, interruption, recall, liability, and reputational damage
        - Human-in-the-loop inspection is disclosed
        - Error and corrected-report rates are not disclosed
        - Monitor MAUDE, CAPA, recalls, corrections, and clinically significant error rates
      - - AWS outage or termination
        - All cloud infrastructure is outsourced to AWS; agreement permits 30-day termination
        - Clinical service unavailability, delayed reports, and migration expense
        - Alternative services are described as obtainable, but tested failover is not disclosed
        - Single-provider operational concentration
        - Obtain RTO / RPO and failover tests; break thesis on prolonged clinical outage without tested recovery
      - - Security breach affecting patient or customer data
        - Company says attacks are ongoing and full mitigation is virtually impossible
        - Regulatory liability, customer loss, downtime, and remediation cost
        - Encryption and certifications are company-disclosed controls
        - Third-party providers and sophisticated attackers remain
        - Monitor reportable incidents, lost certifications, claims, and customer remediation
      - - Support and complaint-handling bottleneck
        - Current job material seeks leadership to scale support and investigate quality and accuracy complaints
        - Slower resolutions, weaker adoption, and compliance failures
        - Dedicated leadership role and KPI mandate are described
        - Staffing level, backlog, first-contact resolution, and service levels are undisclosed
        - Obtain backlog and SLA trends; break thesis on sustained clinically material complaint delays
    notes: >-
      Qualitative risk assessment uses the FY2025 Form 10-K, SCCT guidance, and a company-issued job repost; likelihood
      labels are evidence signals rather than actuarial probabilities, and absent operating rates are explicit gaps.
    claimRefs:
      - CR005
      - CR006
      - CR007
      - CR008
      - CR009
      - CR013
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration evidence
      - Failure scenario
      - Disclosed mitigation
      - Residual exposure
    rows:
      - - Cloud hosting
        - Amazon Web Services
        - Entire cloud-based infrastructure
        - All infrastructure outsourced to one provider
        - Outage, security compromise, or termination interrupts report delivery
        - Company expects similar services could be obtained elsewhere
        - Migration time, tested failover, and recovery metrics are not disclosed
      - - Health-system buying decisions
        - Hospital systems and affiliated accounts
        - Order and utilization decisions
        - No customer was at least 10% of 2025 revenue, but decision-making can span multiple accounts
        - One system reduces volumes or exits across several facilities
        - Company expects new customers to reduce concentration
        - System-level revenue, retention, and termination rights are undisclosed
      - - Customer support capacity
        - Specialized support workforce
        - Complaint investigation, service levels, training, and adoption support
        - Current leadership hiring indicates a need to scale with commercial growth
        - Backlog or insufficient expertise delays clinical issue resolution
        - Dedicated support leadership and KPI ownership are planned
        - No public staffing, backlog, or service-level denominator
      - - Supplier governance
        - Direct UK suppliers and other third parties
        - Services and operational inputs
        - Company says an April 2026 audit found no high-risk suppliers
        - Undetected labor or third-party compliance issue
        - Procurement review, questionnaires, audits, and supplier policies
        - Company-issued audit conclusion does not independently verify all suppliers or cloud resilience
    notes: >-
      Dependency register uses company filings, company-issued recruiting material, and Heartflow's voluntary UK statement;
      supplier findings are management claims and do not establish absence of operational or compliance incidents.
    claimRefs:
      - CR007
      - CR008
      - CR011
      - CR012
      - CR013
      - CR014
figures:
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Qualitative ranking places the active DOJ investigation, single-provider cloud dependency, and reimbursement / product
      concentration above governance and market-volatility risks, while preserving unknown probabilities.
    data:
      columns:
        - Likelihood evidence
        - Potential impact
        - Mitigation maturity
        - Residual rank
      rows:
        - label: DOJ investigation
          values:
            - label: Active, probability unknown
              tone: warning
              detail: Civil investigative demands were received; outcome and duration were not estimable.
            - label: Potentially material
              tone: negative
              detail: Company identifies possible material business, financial, results, or cash-flow impact.
            - label: Early / undisclosed
              tone: warning
              detail: Cooperation is disclosed; resolution terms and loss range are not.
            - label: Critical
              tone: negative
              detail: Active legal exposure with unbounded public outcome.
        - label: Reimbursement and product concentration
          values:
            - label: Recurring annual exposure
              tone: warning
              detail: CMS and commercial payors can change coverage, coding, and payment.
            - label: High
              tone: negative
              detail: FFRCT Analysis represented 98% of 2025 revenue.
            - label: Unquantified
              tone: warning
              detail: No quantified pricing or product-diversification buffer is established here.
            - label: High
              tone: negative
              detail: Payment changes affect the dominant revenue product.
        - label: Clinical input and AI quality
          values:
            - label: Defects disclosed, frequency unknown
              tone: warning
              detail: Filing describes past defects and possible future image, software, AI, and human-review errors.
            - label: High
              tone: negative
              detail: Errors can affect clinical use, liability, adoption, and reputation.
            - label: Developing
              tone: warning
              detail: Standards and human review exist, but outcome rates are not public.
            - label: High
              tone: negative
              detail: Clinical consequence and absent denominators sustain residual exposure.
        - label: AWS and cybersecurity
          values:
            - label: Known single-provider exposure
              tone: warning
              detail: All cloud infrastructure is on AWS; attacks and outages are continuing hazards.
            - label: High
              tone: negative
              detail: Downtime or breach can interrupt clinical access and expose protected data.
            - label: Partly evidenced
              tone: warning
              detail: Security controls are disclosed, but tested alternate-cloud recovery is not.
            - label: High
              tone: negative
              detail: Single-provider concentration remains after disclosed controls.
        - label: Losses and customer decisions
          values:
            - label: Ongoing
              tone: warning
              detail: FY2025 remained loss-making; multi-account decisions can sit with a small customer set.
            - label: Medium-high
              tone: warning
              detail: Execution setbacks can affect profitability and multiple accounts.
            - label: Partial
              tone: warning
              detail: Customer expansion is described, but retention and system concentration are not public.
            - label: Medium-high
              tone: warning
              detail: Financial and customer durability require current operating evidence.
        - label: Governance and stock volatility
          values:
            - label: Observable, current level partly stale
              tone: neutral
              detail: IPO control estimate is historical; MarketBeat beta is current to its article.
            - label: Medium
              tone: warning
              detail: Voting influence and share volatility can affect minority-holder outcomes.
            - label: Public disclosure
              tone: neutral
              detail: Filings provide ownership and market-risk visibility, subject to updating.
            - label: Medium
              tone: neutral
              detail: Important for entry discipline, below clinical and legal operating risks.
    approximationNotes: >-
      Ordinal labels are analyst judgments anchored to disclosed status and impact, not estimated incident probabilities.
      Unknown likelihoods remain unknown, and the IPO ownership estimate is not treated as current ownership.
    claimRefs:
      - CR002
      - CR003
      - CR006
      - CR007
      - CR010
      - CR015
      - CR016
callouts:
  - calloutType: risk
    title: Active legal uncertainty
    body: >-
      The DOJ investigation is unresolved in the latest assigned filing, and Heartflow itself says the outcome may have a
      material effect; diligence should not convert the absence of a disclosed resolution into an assumption of no liability.
    claimRefs:
      - CR001
      - CR002
  - calloutType: assumption
    title: Accounting loss is not cash burn
    body: >-
      The cited $116.8 million FY2025 and $92.4 million nine-month 2025 figures are accounting net losses. Runway requires
      cash-flow and current liquidity analysis rather than relabeling either figure as burn.
    claimRefs:
      - CR010
