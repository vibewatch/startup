chapter:
  number: 8
  title: "Valuation"
  summary: "Heartflow's reported growth and gross margin support a positive operating thesis, but the assigned evidence does not establish a current share price, enterprise value, or defensible comparable multiple range. The recommendation is therefore track/research-more with medium confidence and high risk until price, product concentration, cash use, and legal exposure can be reconciled."
sections:
  - id: "recommendation-and-entry-discipline"
    title: "Recommendation and Entry Discipline"
    body: >-
      The evidence supports a track/research-more recommendation rather than a price-insensitive
      buy. Heartflow reported $176.0 million of 2025 revenue, up 40%, followed by $52.6 million
      of first-quarter 2026 revenue, up 41%, and an 80.2% first-quarter gross margin. These are
      revenue and gross-margin measures, not ARR or proof of recurring retention. The same
      first-quarter release reported a $29.5 million net operating loss, including a $7.5 million
      non-cash impairment; that accounting loss is not cash burn. The 2025 filing separately
      reported $54.0 million of operating cash use and $280.2 million of year-end cash,
      equivalents, and investments. Those balances do not establish current cash or runway.
      Most importantly, no successful allocated source provides an October 2026 share price,
      net debt bridge, enterprise value, or transaction-ready entry multiple. Without those
      inputs, neither a target return nor a valuation range is supportable.
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV016"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "thesis-financing-and-downside"
    title: "Thesis, Financing Context, and Downside"
    body: >-
      The thesis combines rapid case-driven revenue growth, high gross margin, and public-market
      access. Heartflow's August 2025 IPO sold 19,166,667 shares at $19.00 and generated about
      $332.4 million of net proceeds. At closing, $98.3 million of convertible notes converted
      into 6,470,743 common shares at $15.20, a 20% discount to the IPO price. That conversion
      is a historical dilution fact, not evidence of a continuing liquidation preference.
      Financing-history providers also conflict: Tracxn reports $936 million over 12 rounds,
      while Forge reports $890.7 million over 12 rounds and a $546.5 million April 2023 private
      post-money valuation. None is a current public valuation. The anti-thesis is operational
      concentration: FFRCT represented 98% of 2025 revenue. No individual customer contributed
      10% or more, but Heartflow warned that decision-making across accounts can still be
      concentrated. Its April 2026 patent complaint against Cleerly adds a live legal and
      competitive dependency whose outcome is not established by the complaint.
    claimRefs:
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV013"
      - "CV014"
      - "CV015"
    tableRefs:
      - "TV002"
  - id: "scenarios-exit-and-final-diligence"
    title: "Scenarios, Exit Readiness, and Final Diligence"
    body: >-
      The bull signal is execution against management's $228 million to $232 million 2026
      revenue guidance while preserving roughly 80% gross margin and reducing operating cash
      use; even then, upside cannot be quantified without a current enterprise value. The base
      case is continued growth with persistent losses and FFRCT concentration, which supports
      monitoring rather than underwriting a precise return. The bear case is slower growth,
      gross-margin compression, rising operating cash use, failed product diversification, or
      an adverse litigation development. Heartflow is already publicly listed, so the relevant
      exit question is price and liquidity rather than IPO readiness. Final diligence should
      obtain current fully diluted shares, cash, investments, debt, share price, product-level
      revenue, retention, reimbursement realization, and peer transaction multiples on a common
      period and denominator. Thesis-break triggers are a material deceleration from disclosed
      growth, sustained margin deterioration, worsening cash use, continued near-total FFRCT
      dependence, or legal outcomes that impair commercialization. Until those checks are
      complete, scenario probabilities and dollar valuation ranges remain gaps rather than
      investable estimates.
    claimRefs:
      - "CV002"
      - "CV003"
      - "CV005"
      - "CV007"
      - "CV010"
      - "CV015"
      - "CV016"
    tableRefs:
      - "TV003"
