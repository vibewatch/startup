company:
  name: "Heartflow"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Heartflow is a Nasdaq-listed cardiovascular software company whose usage-based CCTA analysis platform produced $176.0 million of 2025 revenue and $52.6 million of Q1 2026 revenue. Its disclosed scale is substantial, but total pre-IPO funding is internally inconsistent in the assigned market-data source and the outcome of an October 2025 DOJ civil investigation remains unknown."
sections:
  - id: "identity-and-business-model"
    title: "Identity and Business Model"
    body: >-
      Heartflow is a Delaware corporation formed in 2007 and a public medical-technology software
      company trading as HTFL. Its filings describe a usage-driven model: physicians order FFRCT
      Analysis, Plaque Analysis, or both, and Heartflow recognizes revenue when it delivers the
      requested analysis. The platform was commercialized in 2015, so this is an established
      workflow business rather than a pre-revenue AI developer. The latest annual filing still lists
      Mountain View as the principal executive-office location, while the Q1 2026 call disclosed a
      facilities impairment associated with relocating headquarters to San Francisco. The legal and
      operating address should therefore be confirmed rather than treating either city as an
      unqualified current headquarters statement.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
    tableRefs:
      - "TO001"
    figureRefs: []
  - id: "operating-scale"
    title: "Operating Scale and Public-Company Transition"
    body: >-
      Heartflow reported $176.0 million of revenue for 2025 and $52.6 million for Q1 2026, with
      management describing the latter as 41% year-over-year growth. Revenue is not ARR, and the
      quarterly result should not be annualized into a run-rate without seasonality evidence. At
      December 31, 2025, the company reported more than 600,000 assessed patients, 219,000 patients
      assessed during 2025, more than 1,465 U.S. accounts, and 843 full-time employees globally. Its
      undated About page now claims more than 750,000 patients treated and more than 1,800
      institutions using Heartflow. Those later website measures indicate expansion, but
      "accounts" and "institutions" are not documented as identical denominators and should not be
      presented as a calculated growth rate.
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
    tableRefs: []
    figureRefs: []
  - id: "leadership-and-capital"
    title: "Leadership, Governance, and Capital Formation"
    body: >-
      Public disclosures identify John Farquhar as president, chief executive officer, and director;
      Vikram Verghese as chief financial officer; and William Weldon as board chair. The official
      biographies add relevant medtech and public-company experience, while the filing warns that
      Heartflow carries no key-person insurance for executives or other employees. The company
      completed its IPO in August 2025 and reported approximately $332.4 million of net proceeds in
      the annual filing, using 2025 financing proceeds in part to repay $115.1 million of term-loan
      principal. The assigned Forge page is not reliable enough to establish a single cumulative
      funding total: its narrative says $890.7 million across 12 rounds, while its structured
      snapshot says $755.52 million.
    claimRefs:
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
    tableRefs:
      - "TO002"
      - "TO003"
    figureRefs: []
  - id: "milestones-and-open-risks"
    title: "Milestones and Open Risks"
    body: >-
      Heartflow's sequence from 2007 incorporation to 2015 commercialization and a 2025 public
      listing is supported by filings, but its current risk profile cannot be reduced to the growth
      milestones. In October 2025, Heartflow and certain employees received civil investigative
      demands from the U.S. Department of Justice concerning provider financial and contractual
      arrangements and sales and marketing activity under the Anti-Kickback Statute and False
      Claims Act. The 10-K states that duration, outcome, and possible financial impact could not yet
      be estimated. An independent but explicitly AI-generated Seeking Alpha item separately
      identifies clinician adoption, outcomes evidence, physician education, and back-half revenue
      weighting as Plaque risks; it is a weak secondary signal, not independent verification.
      Barchart's price-indicator methodology is likewise market timing evidence, not operating
      diligence.
    claimRefs:
      - "CO014"
      - "CO015"
      - "CO016"
    tableRefs: []
    figureRefs:
      - "FO001"
