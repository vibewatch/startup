  - calloutType: "insight"
    title: "Expansion is visible before retention"
    body: "Account ramps, repeat physician use, and Plaque activation support a land-and-expand mechanism, but public evidence still does not show NRR, GRR, renewal behavior, or cohort churn."
    claimRefs:
