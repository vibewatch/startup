chapter:
  number: 6
  title: "Customers"
  summary: "Heartflow discloses broad aggregate adoption - more than 1,465 U.S. accounts at year-end 2025 and more than 1,800 institutions globally by July 2026 - but the assigned evidence does not identify a paying production hospital by name. Usage-driven billing and product expansion create an installed-base growth loop, while 30-day cancellation terms, undisclosed retention cohorts, and health-system decision concentration limit visibility into durability."
sections:
  - id: "buyer-user-payer-map"
    title: "Buyer, user, payer, and beneficiary map"
    body: >-
      Heartflow sells the platform to medical providers rather than directly to patients. Its filing
      defines an account as an individual facility ordering FFRCT Analysis, Plaque Analysis, or both,
      while a customer may be either one account or a health or hospital system containing several
      accounts. Physicians are the ordering users, and the account is billed when an analysis is
      delivered. Government and commercial payers influence realized economics through reimbursement
      and volume rebates, but they are not described as the contracting customer. Patients are the
      clinical beneficiaries and cumulative case population. Research programs such as PREEMPT may
      validate use, but they should not be counted as commercial customers without procurement evidence.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU011"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory"
    title: "Adoption trajectory without false comparability"
    body: >-
      The public adoption record is substantial but mixes different units. Heartflow reported more than
      1,465 U.S. accounts as of December 31, 2025; an April 2026 complaint described relationships with
      more than 1,400 U.S. hospitals including 80% of the top 50 heart hospitals; and a July 2026
      company release said adoption exceeded 1,800 institutions globally. Patient figures also moved
      from more than 650,000 in that July release to more than 750,000 in a September company job
      posting and the current homepage. These observations are not a same-population funnel: account,
      hospital, institution, and cumulative patient denominators differ, and company-issued figures are
      not independent customer confirmation. Quarterly revenue is therefore shown only as a commercial
      momentum indicator, not as a customer-count substitute.
    claimRefs:
      - "CU001"
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU012"
      - "CU013"
    tableRefs:
      - "TU002"
  - id: "durability-and-expansion"
    title: "Usage expansion is visible; retention is not"
    body: >-
      Heartflow's commercial model can expand inside an installed account as referring physicians order
      more analyses and as Plaque is activated alongside FFRCT. TradingKey reported that the 340
      accounts added in 2025 were ramping in line with management expectations, while new FFRCT
      accounts generally require about one year to approach mature utilization. The same report said
      Plaque remains below management's roughly 60% eligible-CCTA ceiling even as the year-end 2026
      activation target increased to approximately 1,250 accounts. This is credible evidence of an
      expansion mechanism, not proof of retention: substantially all revenue was usage-driven, customer
      contracts were generally cancellable on 30 days' notice, and public NRR, GRR, churn, renewal, and
      cohort-level utilization data remain unavailable.
    claimRefs:
      - "CU003"
      - "CU014"
      - "CU015"
      - "CU016"
    figureRefs:
      - "FU001"
  - id: "named-proof-and-concentration"
    title: "Named proof and concentration remain the diligence bottlenecks"
    body: >-
      The assigned pool contains aggregate scale, clinical investigators, and research relationships,
      but no named paying hospital whose production deployment, contract status, utilization, and
      outcome are all public. A University of Kentucky HealthCare investigator is quoted about DECIDE,
      yet the release does not call the institution a Heartflow customer. PREEMPT establishes a research
      provider role, not hospital procurement. Concentration disclosure is similarly incomplete:
      Heartflow reported that no customer contributed 10% or more of revenue in 2023-2025, but warned
      that centralized decisions across multi-account health systems could cause disproportionate account
      loss. The sub-10% threshold therefore limits single-customer revenue concentration without
      resolving network-level procurement exposure.
    claimRefs:
      - "CU004"
      - "CU005"
      - "CU010"
      - "CU011"
    tableRefs:
      - "TU003"
