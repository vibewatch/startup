  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "named-customer-proof"
      missingEvidence: "Named paying hospitals with current production status, contract dates, product utilization, and attributable clinical or economic outcomes."
      whyItMatters: "Aggregate institution counts and research affiliations do not establish reference quality, production use, or renewal durability."
      diligencePath: "Request a customer reference list and sample current contracts, then interview at least three production users across hospital and outpatient settings."
      relatedQuestionRefs:
        - "QU003"
      relatedTableRefs:
        - "TU003"
    - type: "private-evidence-only"
      severity: "material"
      topic: "retention-and-churn"
      missingEvidence: "NRR, GRR, account and customer churn, renewal timing, contract tenure, and mature-cohort utilization curves."
      whyItMatters: "Usage growth and activation targets cannot distinguish durable same-customer expansion from replacement of lost or low-usage accounts."
      diligencePath: "Obtain quarterly cohort schedules by activation date, product, setting, health-system parent, orders, revenue, renewal, and churn."
      relatedTableRefs:
        - "TU001"
        - "TU002"
    - type: "enumeration-incomplete"
      severity: "material"
      topic: "customer-concentration"
      missingEvidence: "Top-five and top-ten customer revenue shares, multi-account health-system mappings, and concentration by payer and channel."
      whyItMatters: "The disclosed sub-10% single-customer threshold does not quantify correlated loss exposure across centrally managed accounts."
      diligencePath: "Request anonymized customer concentration tables that reconcile facilities to health-system parents and payer mix."
      relatedTableRefs:
        - "TU001"
    - type: "private-evidence-only"
      severity: "minor"
      topic: "adoption-denominators"
      missingEvidence: "Active versus inactive institutions, unique versus repeat patients, product-level account counts, and period case volumes."
      whyItMatters: "Without aligned denominators, public account, institution, hospital, patient, and revenue metrics cannot form a conversion or retention funnel."
      diligencePath: "Ask management for a dated metric dictionary and quarterly bridge across accounts, active ordering physicians, cases, unique patients, and products."
      relatedTableRefs:
        - "TU002"
