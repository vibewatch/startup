              - CM014
              - CM015
      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The strongest demand drivers are guideline support for CCTA, broad FFRCT coverage, new Plaque Analysis
              coding and coverage, no required capital-equipment purchase, and the ability to sell more than one
              analysis from the same scan. The first-quarter 2026 result supplies a realized-demand signal:
              company-issued results reported $52.6 million of revenue, up 41% year over year, primarily from higher
              U.S. FFRCT volume. The principal constraints are equally structural. Heartflow depends on local CCTA
              capacity and image quality, physician behavior change, multi-party workflow integration, and coverage and
              payment decisions outside its control. FFRCT coverage was reported at about 99% of U.S. covered lives,
              whereas Plaque Analysis coverage was about 75%, leaving the newer product more exposed to payer
              conversion. For valuation, a large company TAM should therefore be discounted until utilization cohorts,
              realized price by site type, payer mix, and independently reproducible serviceable-market evidence are
              available.
            claimRefs:
              - CM002
              - CM011
              - CM012
              - CM013
              - CM015
              - CM016
