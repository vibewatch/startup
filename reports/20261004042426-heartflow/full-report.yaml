              Heartflow reported $176.0 million of revenue for 2025 and $52.6 million for Q1 2026, with management
              describing the latter as 41% year-over-year growth. Revenue is not ARR, and the quarterly result should
              not be annualized into a run-rate without seasonality evidence. At December 31, 2025, the company reported
              more than 600,000 assessed patients, 219,000 patients assessed during 2025, more than 1,465 U.S. accounts,
              and 843 full-time employees globally. Its undated About page now claims more than 750,000 patients treated
