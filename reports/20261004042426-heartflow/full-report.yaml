    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              Heartflow is a Delaware corporation formed in 2007 and a public medical-technology software company
              trading as HTFL. Its filings describe a usage-driven model: physicians order FFRCT Analysis, Plaque
              Analysis, or both, and Heartflow recognizes revenue when it delivers the requested analysis. The platform
              was commercialized in 2015, so this is an established workflow business rather than a pre-revenue AI
              developer. The latest annual filing still lists Mountain View as the principal executive-office location,
              while the Q1 2026 call disclosed a facilities impairment associated with relocating headquarters to San
              Francisco. The legal and operating address should therefore be confirmed rather than treating either city
              as an unqualified current headquarters statement.
