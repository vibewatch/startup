  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio Across the Non-Invasive CCTA Care Pathway
        blocks:
          - type: paragraph
            body: >
              Heartflow has commercialized an integrated, cloud-delivered software platform designed to transform
              coronary artery disease (CAD) diagnosis and treatment management. Rather than relying on traditional
              stress-based non-invasive tests (NITs) such as SPECT, stress echocardiography, or treadmill tests—which
              suffer from significant false-positive and false-negative rates—the Heartflow Platform utilizes a single
              standard coronary computed tomography angiography (CCTA) dataset to generate a personalized
              three-dimensional anatomical and physiological digital twin of the patient's coronary arteries.


              The clinical suite comprises three commercially cleared software applications alongside an upcoming
              interventional planning solution. Heartflow RoadMap Analysis automatically extracts coronary anatomy from
              acceptable CCTA scans to highlight clinically relevant areas of luminal narrowing, functioning as a
              diagnostic workflow acceleration tool. Heartflow FFRCT Analysis, cleared via FDA de novo 510(k) in 2014,
              applies computational fluid dynamics (CFD) under simulated maximal hyperemia to calculate fractional flow
              reserve values along every major branch of the coronary arterial tree, using 0.80 as the validated
              threshold for hemodynamically significant stenosis. Heartflow Plaque Analysis, introduced to limited
              commercial education in late 2023, quantifies total plaque volume and characterizes non-calcified versus
              calcified components to guide long-term preventive medical therapy. A fourth application, Heartflow PCI
              Planner, is scheduled for commercial release in 2026 to assist interventional cardiologists with virtual
              stent placement and procedural modeling.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
      - number: '5.2'
        title: Operating Model, Algorithm Pipeline, and Production Infrastructure
        blocks:
          - type: paragraph
            body: >
              Heartflow operates a centralized software-as-a-service processing pipeline hosted on Amazon Web Services
              (AWS) cloud infrastructure. Medical centers securely upload DICOM image series acquired from outpatient or
              hospital CT scanners via Heartflow's lightweight gateway client directly into the cloud. The processing
              workflow initiates with deep convolutional neural network models trained on an annotated corpus exceeding
              160 million CCTA images, segmenting the lumen boundaries, coronary vessel centerlines, and myocardial
              volume.


              Because biological image artifacts such as motion blur, high heart rates, and heavy calcification can
              distort algorithmic segmentation, Heartflow employs a human-in-the-loop quality control architecture.
              Specialized production analysts inspect algorithmically extracted models through proprietary review
              software, manually editing and approving coronary segmentations before high-performance computational
              simulations execute. The simulation engine resolves Navier-Stokes blood flow equations across
              patient-specific boundary conditions, deriving physiological pressures without requiring pharmacologic
              adenosine administration. Finished reports are returned to the ordering physician within hours through an
              interactive web portal, downloadable PDF summaries, and direct electronic health record (EHR) and PACS
              integrations.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE010
              - CE011
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE014
      - number: '5.3'
        title: Clinical Validation, Intellectual Property Moat, and Enterprise Security
        blocks:
          - type: paragraph
            body: >
              Heartflow's clinical differentiation is anchored by extensive prospective randomized controlled trials and
              clinical registries. The pivotal NXT trial established an 86% per-vessel diagnostic accuracy for FFRCT
              relative to invasive catheter-based FFR measurements, compared to 65% for CCTA alone (p < 0.001). The
              prospective PRECISE trial demonstrated that a CCTA plus Heartflow FFRCT diagnostic pathway resulted in a
              69% reduction in diagnostic-only invasive coronary angiograms (ICA) while doubling the yield of
              catheterizations that proceeded to therapeutic revascularization from 30.5% to 71.9%.


              The company protects its technological foundation through an extensive global intellectual property estate
              comprising approximately 617 issued patents and 93 pending applications globally as of December 31, 2025.
              This portfolio covers computer-implemented CFD simulations, machine-learning-driven anatomical boundary
              extraction, interactive 3D graphical interfaces, and alternative machine-learning-only FFR estimation
              methods, with key US patents expiring through 2044. Enterprise healthcare trust is supported by an
              Information Security Management System holding HITRUST, ISO 27001, ISO 13485, SOC 2 Type 2, and UK
              CyberEssentials certifications, providing formal compliance for protected health information handling.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
          - type: table
            tableRef: TE003
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE014
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Comprehensive Clinical Evidence Moat
            body: >-
              Heartflow's algorithmic blood flow simulation is substantiated by prospective trial data across thousands
              of patients, including NXT, ADVANCE, and PRECISE, creating substantial clinical guideline endorsement and
              commercial reimbursement barriers for nascent entrants.
            calloutType: strength
            claimRefs:
              - CE010
              - CE011
          - type: callout
            title: Operational Labor Dependency in Scaled Case Production
            body: >-
              Despite continuous machine learning automation advancements, Heartflow's reliance on human-in-the-loop
              production analysts introduces variable labor costs, turnaround time exposure during case volume spikes,
              and potential gross margin sensitivity.
            calloutType: risk
            claimRefs:
              - CE008
              - CE009
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, payer, and beneficiary map
        blocks:
          - type: paragraph
            body: >-
              Heartflow sells the platform to medical providers rather than directly to patients. Its filing defines an
              account as an individual facility ordering FFRCT Analysis, Plaque Analysis, or both, while a customer may
              be either one account or a health or hospital system containing several accounts. Physicians are the
              ordering users, and the account is billed when an analysis is delivered. Government and commercial payers
              influence realized economics through reimbursement and volume rebates, but they are not described as the
              contracting customer. Patients are the clinical beneficiaries and cumulative case population. Research
              programs such as PREEMPT may validate use, but they should not be counted as commercial customers without
              procurement evidence.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU011
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU011
      - number: '6.2'
        title: Adoption trajectory without false comparability
        blocks:
          - type: paragraph
            body: >-
              The public adoption record is substantial but mixes different units. Heartflow reported more than 1,465
              U.S. accounts as of December 31, 2025; an April 2026 complaint described relationships with more than
              1,400 U.S. hospitals including 80% of the top 50 heart hospitals; and a July 2026 company release said
              adoption exceeded 1,800 institutions globally. Patient figures also moved from more than 650,000 in that
              July release to more than 750,000 in a September company job posting and the current homepage. These
              observations are not a same-population funnel: account, hospital, institution, and cumulative patient
              denominators differ, and company-issued figures are not independent customer confirmation. Quarterly
              revenue is therefore shown only as a commercial momentum indicator, not as a customer-count substitute.
            claimRefs:
              - CU001
              - CU006
              - CU007
              - CU008
              - CU009
              - CU012
              - CU013
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU006
              - CU007
              - CU008
              - CU009
              - CU012
              - CU013
      - number: '6.3'
        title: Usage expansion is visible; retention is not
        blocks:
          - type: paragraph
            body: >-
              Heartflow's commercial model can expand inside an installed account as referring physicians order more
              analyses and as Plaque is activated alongside FFRCT. TradingKey reported that the 340 accounts added in
              2025 were ramping in line with management expectations, while new FFRCT accounts generally require about
              one year to approach mature utilization. The same report said Plaque remains below management's roughly
              60% eligible-CCTA ceiling even as the year-end 2026 activation target increased to approximately 1,250
              accounts. This is credible evidence of an expansion mechanism, not proof of retention: substantially all
              revenue was usage-driven, customer contracts were generally cancellable on 30 days' notice, and public
              NRR, GRR, churn, renewal, and cohort-level utilization data remain unavailable.
            claimRefs:
              - CU003
              - CU014
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU003
              - CU014
              - CU015
              - CU016
      - number: '6.4'
        title: Named proof and concentration remain the diligence bottlenecks
        blocks:
          - type: paragraph
            body: >-
              The assigned pool contains aggregate scale, clinical investigators, and research relationships, but no
              named paying hospital whose production deployment, contract status, utilization, and outcome are all
              public. A University of Kentucky HealthCare investigator is quoted about DECIDE, yet the release does not
              call the institution a Heartflow customer. PREEMPT establishes a research provider role, not hospital
              procurement. Concentration disclosure is similarly incomplete: Heartflow reported that no customer
              contributed 10% or more of revenue in 2023-2025, but warned that centralized decisions across
              multi-account health systems could cause disproportionate account loss. The sub-10% threshold therefore
              limits single-customer revenue concentration without resolving network-level procurement exposure.
            claimRefs:
              - CU004
              - CU005
              - CU010
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU009
              - CU010
              - CU011
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Sub-10% revenue concentration does not eliminate network risk
            body: >-
              No customer reached 10% of revenue in 2023-2025, but Heartflow itself warns that centralized decisions at
              a smaller number of multi-account customers could create disproportionate account losses.
            calloutType: risk
            claimRefs:
              - CU004
              - CU005
          - type: callout
            title: Expansion is visible before retention
            body: >-
              Account ramps, repeat physician use, and Plaque activation support a land-and-expand mechanism, but public
              evidence still does not show NRR, GRR, renewal behavior, or cohort churn.
            calloutType: insight
            claimRefs:
              - CU014
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal, regulatory, and reimbursement exposure
        blocks:
          - type: paragraph
            body: >-
              The most immediate disclosed legal risk is active rather than hypothetical: Heartflow reported that it and
              certain employees received U.S. Department of Justice civil investigative demands in October 2025
              concerning provider financial and contractual arrangements and sales and marketing activities under the
              Anti-Kickback Statute and False Claims Act. The company was cooperating but could not estimate duration or
              outcome, and said the result could materially affect the business, financial condition, results, or cash
              flows. Separately, Medicare and commercial payment remain recurring model dependencies. The 2025 Form 10-K
              explained that CMS resets rates using hospital cost and charge data and cited a July 2025 proposal for an
              up-to-15% reduction as a historical example; the fetched evidence does not establish that proposal's final
              outcome. A final enforcement action, exclusion risk, material repayment, or reimbursement reset that
              materially impairs account economics would be a thesis-break event.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR006
              - CR009
              - CR016
      - number: '7.2'
        title: Clinical input and execution quality
        blocks:
          - type: paragraph
            body: >-
              Heartflow's output depends on a chain that begins outside its own software. Independent SCCT guidance
              states that coronary CTA diagnostic quality depends on hardware, software, and acquisition protocols,
              while Heartflow's filing says inbound image limitations can affect its analyses. The same filing warns
              that AI models, analyst review, and software can contain undetected errors; it also discloses past code
              and release-process defects that intermittently interrupted physician use, with a subset reported through
              FDA MAUDE. These are not proof of current systematic inaccuracy, but they make image-acceptance rates,
              corrected-report rates, MAUDE trends, turnaround-time misses, and complaint closure times essential
              monitoring indicators. A sustained increase in clinically significant corrections or a recall would
              challenge confidence in the platform's risk-adjusted adoption case.
            claimRefs:
              - CR005
              - CR006
              - CR013
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR013
      - number: '7.3'
        title: Infrastructure, security, and counterparty concentration
        blocks:
          - type: paragraph
            body: >-
              Heartflow outsources all cloud infrastructure to AWS. Its filing says outages could make the clinical
              service inaccessible and that AWS can terminate on 30 days' notice, or sooner under specified conditions;
              the filing does not disclose an active multi-cloud failover. The platform also stores and transmits
              customer and patient identifying information, so a breach could combine downtime, liability, lost
              certifications, customer loss, and remediation expense. Customer concentration is subtler: no customer
              represented 10% or more of 2025 revenue, yet decision-making for multiple accounts can sit with a
              relatively small number of health systems. Company-issued hiring material shows that complaint
              investigation, quality and accuracy feedback, service levels, and support scaling require a dedicated
              cross-functional function. Recovery objectives, failover-test results, security incidents, health-system
              concentration, and support service-level performance remain non-public diligence items.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR011
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR007
              - CR008
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.4'
        title: Financial, governance, and market-risk implications
        blocks:
          - type: paragraph
            body: >-
              Product concentration and losses make execution setbacks more consequential. Heartflow FFRCT Analysis
              represented 98% of 2025 revenue, and the company reported a $116.8 million FY2025 net loss after a $92.4
              million net loss for the first nine months; these are accounting losses, not cash burn or runway. The
              public website claims more than 750,000 patients treated and more than 1,800 institutions using Heartflow
              but gives no as-of date in the fetched page, so operating scale should not be mistaken for disclosed
              retention or service reliability. At the IPO, officers, directors, 5% holders, and affiliates were
              expected to own about 50.1% and exercise significant voting control; that is an IPO-date estimate, not a
              current ownership measure. MarketBeat reported a 2.73 beta on October 3, 2026, indicating public-market
              volatility in that data set. Investment monitoring should therefore distinguish accounting loss from cash
              use and require current ownership, cash-flow, product-mix, reliability, and retention evidence.
            claimRefs:
              - CR003
              - CR010
              - CR014
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR007
              - CR010
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Active legal uncertainty
            body: >-
              The DOJ investigation is unresolved in the latest assigned filing, and Heartflow itself says the outcome
              may have a material effect; diligence should not convert the absence of a disclosed resolution into an
              assumption of no liability.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
          - type: callout
            title: Accounting loss is not cash burn
            body: >-
              The cited $116.8 million FY2025 and $92.4 million nine-month 2025 figures are accounting net losses.
              Runway requires cash-flow and current liquidity analysis rather than relabeling either figure as burn.
            calloutType: assumption
            claimRefs:
              - CR010
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a track/research-more recommendation rather than a price-insensitive buy. Heartflow
              reported $176.0 million of 2025 revenue, up 40%, followed by $52.6 million of first-quarter 2026 revenue,
              up 41%, and an 80.2% first-quarter gross margin. These are revenue and gross-margin measures, not ARR or
              proof of recurring retention. The same first-quarter release reported a $29.5 million net operating loss,
              including a $7.5 million non-cash impairment; that accounting loss is not cash burn. The 2025 filing
              separately reported $54.0 million of operating cash use and $280.2 million of year-end cash, equivalents,
              and investments. Those balances do not establish current cash or runway. Most importantly, no successful
              allocated source provides an October 2026 share price, net debt bridge, enterprise value, or
              transaction-ready entry multiple. Without those inputs, neither a target return nor a valuation range is
              supportable.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV010
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV010
              - CV012
              - CV016
      - number: '8.2'
        title: Thesis, Financing Context, and Downside
        blocks:
          - type: paragraph
            body: >-
              The thesis combines rapid case-driven revenue growth, high gross margin, and public-market access.
              Heartflow's August 2025 IPO sold 19,166,667 shares at $19.00 and generated about $332.4 million of net
              proceeds. At closing, $98.3 million of convertible notes converted into 6,470,743 common shares at $15.20,
              a 20% discount to the IPO price. That conversion is a historical dilution fact, not evidence of a
              continuing liquidation preference. Financing-history providers also conflict: Tracxn reports $936 million
              over 12 rounds, while Forge reports $890.7 million over 12 rounds and a $546.5 million April 2023 private
              post-money valuation. None is a current public valuation. The anti-thesis is operational concentration:
              FFRCT represented 98% of 2025 revenue. No individual customer contributed 10% or more, but Heartflow
              warned that decision-making across accounts can still be concentrated. Its April 2026 patent complaint
              against Cleerly adds a live legal and competitive dependency whose outcome is not established by the
              complaint.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
              - CV009
              - CV010
              - CV011
              - CV015
      - number: '8.3'
        title: Scenarios, Exit Readiness, and Final Diligence
        blocks:
          - type: paragraph
            body: >-
              The bull signal is execution against management's $228 million to $232 million 2026 revenue guidance while
              preserving roughly 80% gross margin and reducing operating cash use; even then, upside cannot be
              quantified without a current enterprise value. The base case is continued growth with persistent losses
              and FFRCT concentration, which supports monitoring rather than underwriting a precise return. The bear
              case is slower growth, gross-margin compression, rising operating cash use, failed product
              diversification, or an adverse litigation development. Heartflow is already publicly listed, so the
              relevant exit question is price and liquidity rather than IPO readiness. Final diligence should obtain
              current fully diluted shares, cash, investments, debt, share price, product-level revenue, retention,
              reimbursement realization, and peer transaction multiples on a common period and denominator. Thesis-break
              triggers are a material deceleration from disclosed growth, sustained margin deterioration, worsening cash
              use, continued near-total FFRCT dependence, or legal outcomes that impair commercialization. Until those
              checks are complete, scenario probabilities and dollar valuation ranges remain gaps rather than investable
              estimates.
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV007
              - CV010
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV007
              - CV010
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Track Until Price Is Verifiable
            body: >-
              Operating quality does not answer entry price. Verify current enterprise value, dilution, product mix, and
              comparable multiples before converting the operating thesis into a buy decision.
            calloutType: recommendation
            claimRefs:
              - CV016
