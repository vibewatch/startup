      - number: '4.2'
        title: Cost Structure, Unit Economics, and Margin Expansion
        blocks:
          - type: paragraph
            body: >-
              Heartflow's operating model exhibits substantial gross margin expansion alongside high commercial fixed
              costs. Non-GAAP gross margin expanded 770 basis points year-over-year to 83.3% in Q2 FY2026, compared to
              75.6% in Q2 FY2025 [CI004]. Full-year non-GAAP gross margin guidance was subsequently raised to
              approximately 82%, with executive management targeting an 85% mid-term gross margin run-rate underpinned
              by algorithmic automation and volume leverage [CI004]. Total global revenue cases reached 84,491 in Q2
              FY2026, an increase of 74% year-over-year that illustrates strong procedure demand [CI001]. The delivery
              cost structure primarily comprises cloud computational infrastructure on Amazon Web Services and
              specialized human-in-the-loop image quality analysts who inspect anatomical vessel segmentations prior to
              clinical delivery. Despite gross profit expansion, operational overhead remains heavy: Q2 FY2026 selling,
              general, and administrative expenses reached $37.8 million, while research and development investment
              totaled $23.5 million [CI005]. Heartflow reported a non-GAAP operating loss of $7.9 million for the
              quarter, an improvement from an $11.5 million operating loss in the prior-year period [CI005]. Critical
              unit-level disclosures—including customer acquisition cost, payback periods, and net revenue retention by
              hospital cohort—remain private and undisclosed [CI013].
            claimRefs:
              - CI001
              - CI004
              - CI005
              - CI013
          - type: table
