  - id: TV003
    title: Bull, Base, and Bear Scenario Framework
    columns:
      - Scenario
      - Evidence-based signals
      - Valuation / return logic
      - Downside trigger
      - Probability signal
    rows:
      - - Bull
        - 2026 revenue reaches the $228M-$232M company-guided range, margin holds near Q1 levels, and cash use declines
        - Range not supportable until current EV and peer multiples are verified
        - Growth or margin misses while cash use fails to improve
        - Unquantified; requires current trading and product-mix evidence
      - - Base
        - Revenue grows but operating losses and FFRCT concentration persist
        - Track performance; do not infer return from historical private marks
        - Diversification and retention remain undisclosed
        - Most consistent with the available mixed evidence, but not assigned a numeric probability
      - - Bear
        - Growth slows, gross margin compresses, operating cash use rises, or legal exposure impairs execution
        - Downside cannot be bounded without a current enterprise value
        - Material growth deceleration, worsening cash use, or adverse legal outcome
        - Credible downside path; magnitude and probability remain unquantified
    notes: >-
      Scenario values are deliberately not estimated because the assigned pool lacks a current share price, enterprise
      value, peer multiple set, and probability evidence.
