  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape & Market Structure
        blocks:
          - type: paragraph
            body: >-
              Heartflow operates in a multi-tiered competitive arena defined by distinct technological approaches to
              diagnosing coronary artery disease. Heartflow's core commercial platform transforms standard coronary
              computed tomography angiography (CCTA) scans via artificial intelligence algorithms into non-invasive
              anatomical and physiological diagnostic models, specifically Heartflow FFRCT Analysis and Heartflow Plaque
              Analysis. In doing so, Heartflow faces primary competition from traditional non-invasive functional tests,
              direct competition from specialized venture-backed AI software developers, and long-term platform risk
              from global medical imaging equipment conglomerates. Traditional non-invasive diagnostic
              modalities—including single-photon emission computed tomography (SPECT), stress echocardiography, positron
              emission tomography (PET), and invasive diagnostic catheterization—represent the entrenched standard of
              care across hospital cardiology departments. Major multi-national commercial organizations including
              Siemens Healthineers AG, GE Healthcare, and Koninklijke Philips N.V. manufacture the imaging hardware for
              these traditional modalities as well as the CT scanners required to acquire CCTA scans. Consequently,
              these imaging giants maintain dual positioning as essential upstream data suppliers and formidable
              potential software competitors who could bundle native analysis tools into their scanner hardware
              ecosystems.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
      - number: '3.2'
        title: Direct AI Coronary Challengers & Feature Differentiation
        blocks:
          - type: paragraph
            body: >-
              Direct competition within the specialized CCTA-based AI software category includes agile, venture-backed
              innovators such as Cleerly, Inc., Elucid Bioimaging Inc., and Keya Medical Technology Co., Ltd. These
              specialized peers focus on algorithmic characterization, vascular biology, and plaque quantification. In
              particular, Cleerly emphasizes total plaque volume and phenotypic characterization rather than hemodynamic
              flow reserve alone. Heartflow's regulatory disclosures explicitly highlight that several agile competitors
              commercially launched plaque analysis software ahead of Heartflow Plaque Analysis, potentially
              establishing first-mover relationships and creating price competition for hospital software budgets.
              Heartflow has countered this competitive pressure by building an integrated diagnostic suite that pairs
              anatomical Roadmap Analysis and physiological FFRCT with comprehensive Plaque Analysis and pre-procedural
              catheterization planning via PCI Navigator, supported by extensive clinical validation spanning over 625
              peer-reviewed publications and a proprietary training database of over 200 million annotated CT images.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP008
      - number: '3.3'
        title: Moat Durability, Switching Costs, and Regulatory Headwinds
        blocks:
          - type: paragraph
            body: >-
              Heartflow's competitive moat rests on four pillars: an extensive proprietary clinical trial evidence base,
              deep enterprise workflow integration into PACS and electronic health record systems, dedicated CPT
              reimbursement coding, and dedicated customer success field teams supporting hospital clinical and
              operational teams. However, Heartflow's business model remains sensitive to external capital and payer
              reimbursement structures. Unlike diversified multi-national conglomerates that generate billions across
              hardware, devices, and pharmaceuticals, Heartflow depends heavily on reimbursement rates established by
              third-party payors and Medicare. In its regulatory filings, Heartflow noted that the Centers for Medicare
              & Medicaid Services (CMS) proposed 2026 OPPS rule could reduce the Medicare reimbursement rate for the
              clinical Ambulatory Payment Classification (APC) that includes Heartflow FFRCT Analysis by up to 15%. This
              regulatory reimbursement volatility highlights that software-only diagnostic providers face continuous
              price realization pressure that capital-equipment incumbents can more easily absorb across diversified
              revenue lines.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP007
              - CP010
              - CP012
              - CP013
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Scanner OEM Platform Bundling Risk
            body: >-
              The primary structural threat to Heartflow's market positioning stems from medical imaging
              conglomerates—Siemens Healthineers, GE Healthcare, and Philips—who manufacture the physical CT scanners
              that supply CCTA data. If imaging OEMs introduce native, integrated AI analysis packages at zero or
              marginal cost, standalone specialized SaMD vendors face customer margin compression and channel friction.
            calloutType: risk
            claimRefs:
              - CP003
              - CP004
          - type: callout
            title: Clinical Trial Scale and Coding as Competitive Defenses
            body: >-
              Heartflow's defensibility against agile venture-backed startups such as Cleerly and Elucid relies on its
              proprietary clinical registry scale—including prospective follow-up data from over 23,000 patients tracked
              in the DECIDE registry—and established Category I CPT coding infrastructure across commercial and
              government health plans.
            calloutType: insight
            claimRefs:
              - CP008
              - CP011
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              Heartflow operates a dual-modality commercial model for coronary computed tomography angiography (CCTA)
              post-processing, consisting of its established Heartflow FFRCT Analysis and the emerging Heartflow Plaque
              Analysis. In the second quarter of FY2026, Heartflow generated $64.1 million in total revenue, reflecting
              48% year-over-year expansion [CI001]. Growth was heavily led by the domestic market, where U.S. revenue
              expanded 51% year-over-year to $59.6 million, while international and other revenue accounted for $4.5
              million [CI001]. Flagship FFRCT processing remains the company's primary economic engine, benefiting from
              nationwide clinical adoption and Category I CPT reimbursement coverage across 99.5% of insured U.S.
              commercial and Medicare lives [CI008]. Meanwhile, Plaque Analysis represents Heartflow's primary growth
              vector, contributing $7.8 million in quarterly revenue during Q2 FY2026 [CI001]. Management raised
              full-year 2026 plaque revenue expectations to a range of $29 million to $31 million, projecting roughly
              1,250 activated plaque hospital accounts by year-end [CI002]. Hospital outpatient reimbursement under
              Medicare APC schedules provides a predictable fee structure, but health systems contract privately under
              list and enterprise volume tiers, creating opacity in realized per-case pricing [CI008].
            claimRefs:
              - CI001
              - CI002
              - CI008
