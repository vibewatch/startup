        title: Exhibits
        blocks:
          - type: callout
            title: Large TAM, narrow monetization layer
            body: >-
              Heartflow monetizes analysis after a suitable CCTA is ordered; it does not capture scanner, acquisition,
              intervention, or the broader CAD-treatment wallet.
