  - id: FE001
    title: Heartflow End-to-End Technology Stack and Data Flow Architecture
    type: stack
    summary: >-
      Architectural layers of the Heartflow Platform spanning hospital edge transmission, cloud AI segmentation, human
      quality control, biophysical modeling, clinical visualization, and enterprise governance.
    data:
      layers:
        - label: Hospital Edge & Image Ingestion
          detail: >-
            Embedded client software within hospital or outpatient imaging centers transmits DICOM CCTA scans securely
            to AWS.
          modules:
            - Hospital Scanner Gateway
            - DICOM TLS Encryption
        - label: Cloud AI Segmentation & Geometry Extraction
          detail: >-
            Deep learning neural network models trained on over 160 million images segment coronary vessels, lumen
            boundaries, and myocardial tissue.
          modules:
            - Multi-task CNN Segmentation
            - 3D Vessel Tree Extraction
        - label: Human-in-the-Loop Quality Control
          detail: >-
            Certified production analysts review and manually adjust algorithmically extracted coronary geometry using
            proprietary inspection software.
          modules:
            - Analyst Inspection Console
            - Boundary Correction Feedback Loop
        - label: Hemodynamic Simulation & Biophysical Modeling
          detail: >-
            Cloud-based computational fluid dynamics solvers execute 3D Navier-Stokes numerical equations to derive
            vessel-specific FFRCT values.
          modules:
            - Navier-Stokes Solver Engine
            - Plaque Volumetric Classifier
        - label: Clinical Visualization & EMR Delivery
          detail: >-
            Interactive 3D visualization web application (Vue.js frontend), mobile viewer, and automated PDF delivery
            into hospital EMR systems.
          modules:
            - WebGL Interactive Viewer
            - EMR & PACS Integration Gateway
        - label: Quality Management & Security Governance
          detail: >-
            Continuous regulatory compliance, audit logging, and security controls meeting ISO 13485 medical device and
            SOC 2 Type 2 standards.
          modules:
            - Information Security Management System
            - Quality Audit & Traceability Controls
    approximationNotes: >-
      Architectural layers synthesized from Heartflow Form 10-K filings, technical disclosures, and engineering
      specifications.
