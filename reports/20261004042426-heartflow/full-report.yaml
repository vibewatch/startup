  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable market is the software-enabled analysis attached to coronary computed tomography
              angiography (CCTA) for symptomatic coronary artery disease, not all cardiac imaging, CAD treatment, or CT
              equipment. Heartflow's current paid products add physiology and plaque characterization to a CCTA that a
              provider has already performed; RoadMap and PCI Navigator are described as integrated workflow features
              rather than stand-alone products. The clinically relevant status quo therefore includes stress SPECT,
              stress echocardiography, PET, review of CCTA alone, and invasive angiography or invasive FFR. CCTA's
              guideline position is a demand driver, but Heartflow remains downstream of the decision to order a
              suitable scan. Asymptomatic risk prediction is an adjacency, not present serviceable demand, because the
              company says additional evidence, regulatory approval, payer coverage, and commercialization work are
              still required.
            claimRefs:
              - CM001
              - CM002
              - CM013
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM013
              - CM014
      - number: '2.2'
        title: Sizing through patient, product, and realized-demand lenses
        blocks:
          - type: paragraph
            body: >-
              Heartflow estimates an approximately $5 billion current U.S. opportunity for FFRCT and Plaque Analysis.
              Its disclosed construction starts with an estimated 9.5 million unique stable chest-pain patients
              receiving non-invasive tests annually, then applies clinical-eligibility assumptions and assumed selling
              prices. That produces approximately 3.1 million FFRCT-eligible patients and $3.3 billion at a $1,067
              average sales price, plus approximately 5.5 million plaque-eligible patients and an incremental $1.7
              billion at $300. These are overlapping product opportunities from the same pathway, not independent
              populations or a conversion funnel. The best public adoption cross-check is also company-issued: 195,000
              U.S. patients analyzed in 2025 represented less than 2% of the company's overall opportunity and about 19%
              of current U.S. CCTA volume. Neither retained independent source reconstructs the denominator, eligibility
              filters, realized net price, or CAGR.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
