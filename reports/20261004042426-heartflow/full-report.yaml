companyProfile:
  summary: >
    Heartflow is a public cardiovascular software company founded in 2007 that analyzes coronary CTA scans and returns
    AI-assisted FFRCT, plaque, and PCI-planning outputs inside a cloud workflow. The company has disclosed large and
    growing scale, including 2025 revenue of $176.0 million, Q2 2026 revenue of $64.1 million, more than 1,800 reported
    institutions using the platform, and more than 750,000 patients treated. The main diligence caveat is that
    product-level plaque economics, retention, and customer concentration remain only partially disclosed, while a DOJ
    civil investigation and reimbursement sensitivity remain live risks.
