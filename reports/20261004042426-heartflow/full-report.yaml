      - number: '4.3'
        title: Capital Adequacy, Cash Burn, and Contingent Liabilities
        blocks:
          - type: paragraph
            body: >-
              As of June 30, 2026, Heartflow held $246.8 million in cash, cash equivalents, and investments on its
              balance sheet [CI006]. Operating cash burn has decelerated from historical levels: net cash used in
              operating activities stood at $54.0 million for full-year 2025, down from $69.0 million in 2024 and $76.4
              million in 2023 [CI007]. Management maintains that existing liquid resources provide sufficient runway to
              achieve self-sustaining operating profitability without requiring dilutive equity financing [CI006].
              Forge's historical financing page reports inconsistent cumulative funding totals of $890.7 million and
              $755.52 million, so neither figure is treated as current liquidity [CI014]. However, the business faces
              material ongoing legal and regulatory overhangs. In October 2025, the U.S. Department of Justice served
              Heartflow and certain employees with Civil Investigative Demands under the federal Anti-Kickback Statute
              and False Claims Act regarding financial arrangements with healthcare providers and marketing practices
              [CI011]. Concurrently, Heartflow is engaged in multi-year intellectual property litigation against
              competitor Cleerly, leading management to adjust non-GAAP SG&A metrics to exclude patent litigation costs
              [CI012]. While consensus Wall Street analyst estimates anticipated a Q2 FY2026 loss of approximately
              $-0.22 per share [CI009], the stock traded at $49.32 as of early October 2026, implying an equity market
              valuation of approximately $4.29 billion across 86.95 million shares outstanding [CI003, CI010].
            claimRefs:
