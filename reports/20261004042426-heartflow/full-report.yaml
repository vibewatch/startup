      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Adoption is a multi-stakeholder enterprise motion. Imaging physicians and radiologists influence account
              activation and scan interpretation; referring cardiologists drive case volume; interventional
              cardiologists consume planning information; health systems or imaging facilities contract for the service;
              and government and commercial payers determine whether the economics support routine use. Heartflow
              primarily charges a usage fee when a physician orders and receives FFRCT Analysis, Plaque Analysis, or
              both, so an installed account is not equivalent to recurring utilization. The company says a new account
              generally takes 12 months to approach steady state, defined as FFRCT use on roughly 33% of account CCTAs.
              Its year-end 2025 filing reported more than 1,465 U.S. accounts, while the current homepage reports more
              than 1,800 institutions; the differing labels, dates, and geography prevent treating those figures as a
              clean growth series.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
