chapter:
  number: 5
  title: Product & Technology
  summary: Heartflow provides a non-invasive, cloud-based coronary computed tomography angiography (CCTA) analysis platform combining deep learning segmentation with computational fluid dynamics to assess anatomy, ischemia, and plaque burden.
sections:
  - id: product-definition-overview
    title: Product Portfolio Across the Non-Invasive CCTA Care Pathway
    body: |
      Heartflow has commercialized an integrated, cloud-delivered software platform designed to transform coronary artery disease (CAD) diagnosis and treatment management. Rather than relying on traditional stress-based non-invasive tests (NITs) such as SPECT, stress echocardiography, or treadmill tests—which suffer from significant false-positive and false-negative rates—the Heartflow Platform utilizes a single standard coronary computed tomography angiography (CCTA) dataset to generate a personalized three-dimensional anatomical and physiological digital twin of the patient's coronary arteries.

      The clinical suite comprises three commercially cleared software applications alongside an upcoming interventional planning solution. Heartflow RoadMap Analysis automatically extracts coronary anatomy from acceptable CCTA scans to highlight clinically relevant areas of luminal narrowing, functioning as a diagnostic workflow acceleration tool. Heartflow FFRCT Analysis, cleared via FDA de novo 510(k) in 2014, applies computational fluid dynamics (CFD) under simulated maximal hyperemia to calculate fractional flow reserve values along every major branch of the coronary arterial tree, using 0.80 as the validated threshold for hemodynamically significant stenosis. Heartflow Plaque Analysis, introduced to limited commercial education in late 2023, quantifies total plaque volume and characterizes non-calcified versus calcified components to guide long-term preventive medical therapy. A fourth application, Heartflow PCI Planner, is scheduled for commercial release in 2026 to assist interventional cardiologists with virtual stent placement and procedural modeling.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
    tableRefs:
      - TE001
  - id: technical-architecture-pipeline
    title: Operating Model, Algorithm Pipeline, and Production Infrastructure
    body: |
      Heartflow operates a centralized software-as-a-service processing pipeline hosted on Amazon Web Services (AWS) cloud infrastructure. Medical centers securely upload DICOM image series acquired from outpatient or hospital CT scanners via Heartflow's lightweight gateway client directly into the cloud. The processing workflow initiates with deep convolutional neural network models trained on an annotated corpus exceeding 160 million CCTA images, segmenting the lumen boundaries, coronary vessel centerlines, and myocardial volume.

      Because biological image artifacts such as motion blur, high heart rates, and heavy calcification can distort algorithmic segmentation, Heartflow employs a human-in-the-loop quality control architecture. Specialized production analysts inspect algorithmically extracted models through proprietary review software, manually editing and approving coronary segmentations before high-performance computational simulations execute. The simulation engine resolves Navier-Stokes blood flow equations across patient-specific boundary conditions, deriving physiological pressures without requiring pharmacologic adenosine administration. Finished reports are returned to the ordering physician within hours through an interactive web portal, downloadable PDF summaries, and direct electronic health record (EHR) and PACS integrations.
    claimRefs:
      - CE006
      - CE007
      - CE008
      - CE009
    tableRefs:
      - TE002
    figureRefs:
      - FE001
  - id: differentiation-intellectual-property
    title: Clinical Validation, Intellectual Property Moat, and Enterprise Security
    body: |
      Heartflow's clinical differentiation is anchored by extensive prospective randomized controlled trials and clinical registries. The pivotal NXT trial established an 86% per-vessel diagnostic accuracy for FFRCT relative to invasive catheter-based FFR measurements, compared to 65% for CCTA alone (p < 0.001). The prospective PRECISE trial demonstrated that a CCTA plus Heartflow FFRCT diagnostic pathway resulted in a 69% reduction in diagnostic-only invasive coronary angiograms (ICA) while doubling the yield of catheterizations that proceeded to therapeutic revascularization from 30.5% to 71.9%.

      The company protects its technological foundation through an extensive global intellectual property estate comprising approximately 617 issued patents and 93 pending applications globally as of December 31, 2025. This portfolio covers computer-implemented CFD simulations, machine-learning-driven anatomical boundary extraction, interactive 3D graphical interfaces, and alternative machine-learning-only FFR estimation methods, with key US patents expiring through 2044. Enterprise healthcare trust is supported by an Information Security Management System holding HITRUST, ISO 27001, ISO 13485, SOC 2 Type 2, and UK CyberEssentials certifications, providing formal compliance for protected health information handling.
    claimRefs:
      - CE010
      - CE011
      - CE012
      - CE013
      - CE014
      - CE015
    tableRefs:
      - TE003
callouts:
  - calloutType: strength
    title: Comprehensive Clinical Evidence Moat
    body: Heartflow's algorithmic blood flow simulation is substantiated by prospective trial data across thousands of patients, including NXT, ADVANCE, and PRECISE, creating substantial clinical guideline endorsement and commercial reimbursement barriers for nascent entrants.
