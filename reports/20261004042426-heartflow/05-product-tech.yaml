    title: Operational Labor Dependency in Scaled Case Production
    body: Despite continuous machine learning automation advancements, Heartflow's reliance on human-in-the-loop production analysts introduces variable labor costs, turnaround time exposure during case volume spikes, and potential gross margin sensitivity.
