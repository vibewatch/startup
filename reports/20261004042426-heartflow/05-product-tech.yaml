      - CE009
tables:
  - id: TE001
    title: Heartflow Diagnostic and Interventional Product Matrix
    columns:
      - Product Application
      - Target Clinical User
      - Functional Mechanism
      - Commercial Status
      - Core Differentiation
      - Diligence Gap
    rows:
      - - Heartflow RoadMap Analysis
        - Radiologists & Imaging Cardiologists
        - Automated anatomic segmentation and stenosis highlighting on CCTA
        - Commercial (integrated workflow feature)
        - Speeds initial scan triage; included without separate charge
        - Standalone standalone diagnostic accuracy versus expert human reading is unseparated
      - - Heartflow FFRCT Analysis
        - General & Interventional Cardiologists
        - Cloud computational fluid dynamics calculating fractional flow reserve (cutoff <=0.80)
        - Commercial (core revenue driver; cleared 2014)
        - Non-invasive physiological ischemia mapping without hyperemic drugs
        - Sensitivity to heavy calcification artifacts and vendor scanner variations
      - - Heartflow Plaque Analysis
        - Preventative Cardiologists & Internists
        - Volumetric quantification and composition analysis (calcified vs non-calcified)
        - Commercial (broadening payor coverage; launched 2023)
        - AI characterization of rupture-prone plaque from standard CCTA scan
        - Commercial payer reimbursement coverage breadth and standalone attach rate undisclosed
      - - Heartflow PCI Planner
        - Interventional Cardiologists & Cath Lab Operators
        - Virtual revascularization modeling, stent sizing, and post-PCI flow prediction
        - Planned commercial launch in 2026
        - In-silico intervention trial planning prior to catheterization
        - Real-world procedural adoption hurdles and health economic proof pending launch
    notes: Status reflects commercial availability across US, EU, UK, and Japan as disclosed in SEC filings as of December 31, 2025.
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE005
  - id: TE002
    title: Clinical Diagnostic Workflows and Heartflow Solution Impact
    columns:
      - Clinical Decision Step
      - Conventional Medical Pathway
      - Heartflow Integrated Solution
      - Quantified Clinical Benefit
      - Technical & Operational Limitation
    rows:
      - - Symptomatic Patient Initial Evaluation
        - Exercise treadmill ECG or stress echocardiography
        - CCTA anatomical scan supplemented by automatic RoadMap Analysis
        - Substantial reduction in false-negative evaluations versus stress testing
        - Requires high-quality multidetector CT scanner and patient heart-rate control
      - - Physiological Ischemia Assessment
        - Invasive catheterization with coronary pressure wire (invasive FFR)
        - Non-invasive FFRCT blood flow simulation from single CCTA acquisition
        - 86% per-vessel accuracy vs invasive FFR; 69% reduction in normal invasive caths
        - Cloud processing latency of several hours prevents emergent acute triage use
      - - Atherosclerosis & Plaque Characterization
        - Agatston coronary artery calcium (CAC) scoring
        - Quantitative AI assessment of total, calcified, and non-calcified plaque volume
        - Predicts subsequent culprit plaque rupture and changes medical management in >50%
        - Evolving commercial insurer coverage policies compared to established FFRCT codes
      - - Revascularization Strategy & PCI Planning
        - 2D invasive diagnostic angiograms during catheterization
        - Virtual PCI Planner simulating post-stent hemodynamics prior to entering cath lab
        - Optimizes stent selection and planned vessel intervention in-silico
        - Product scheduled for 2026 introduction; real-world clinical workflow adoption untested
    notes: Performance benchmarks derived from prospective NXT, ADVANCE, PRECISE, and DECIDE clinical trial cohorts.
    claimRefs:
      - CE001
      - CE004
      - CE005
      - CE010
      - CE011
  - id: TE003
    title: Operating Architecture, Technology Components, and Failure Modes
    columns:
      - Technology Component
      - Architectural Implementation
      - Operational Role
      - System Dependency
      - Technical Risk & Mitigation
    rows:
      - - Hospital Data Gateway
        - On-premise secure image transmission client
        - Encrypts and transmits DICOM CCTA data from hospital scanners to cloud
        - Hospital PACS / scanner network connectivity
        - Network firewalls or TLS configuration defects; monitored via customer success
      - - Cloud Image Storage & Orchestration
        - AWS cloud services, Python, and Django microservices
        - Coordinates scalable processing pipelines and case state tracking
        - Amazon Web Services availability and regional infrastructure
        - Third-party cloud outages or API latency; mitigated via multi-AZ hosting
      - - Deep Learning Segmentation Engine
        - Neural network algorithms trained on 160M+ annotated CCTA images
        - Extracts patient-specific 3D vascular geometry and plaque boundaries
        - Quality of incoming CT scan (motion, contrast opacification)
        - Segmentation errors on heavily calcified vessels; caught by human review
      - - Human-in-the-Loop Analyst Verification
        - Proprietary CAD review software and certified production analysts
        - Visual inspection and manual editing of automated vessel segmentations
        - Scaled availability of trained production analysts
        - Labor cost bottleneck and throughput caps; addressed by increasing automation
      - - Fluid Dynamics Solver Engine
        - High-performance finite element simulation algorithms
        - Solves 3D Navier-Stokes blood flow equations across coronary tree
        - Cloud compute capacity (AWS EC2 / GPU instances)
        - Computational run times and high compute cost; optimized numerical solver
      - - Interactive Clinical Viewer & EHR Interface
        - Web-based viewer (Vue.js frontend), mobile application, and PDF reports
        - Presents interactive 3D color-coded models and delivers EHR summaries
        - Hospital web browser compatibility and EHR interface protocols
        - Client rendering issues or intermittent UI bugs; covered by ISO 13485 QA
    notes: Architectural layers based on company SEC Form 10-K disclosures, technical job listings, and NSF documentation.
