  topStrengths:
    - 公开经营规模大且仍在增长：FY2025 收入 $176.0M、2026 年 Q2 收入 $64.1M，毛利率 83.3%
    - 覆盖面广，已有超过 1,800 家机构、超过 750,000 名患者接受治疗
    - 按使用量计费的工作流已嵌入可报销的 CCTA 诊断，Plaque 和 PCI 仍有扩张空间
    - 相对当前经营规模，资产负债表稳健；截至 2026 年 6 月，现金及投资为 $246.8M
  topRisks:
    - DOJ 民事调查要求以及对报销的依赖仍未解决
    - FFRCT 业务集中，斑块产品经济性披露不足，限制了对多元化程度的判断
    - 留存、续约时间和客户集中度仍未公开量化
    - AWS 单一供应商基础设施以及临床质量 / 审阅风险仍然重大
    - 本次证据集中没有当前股价、企业价值或可比公司倍数
  unresolvedGaps:
