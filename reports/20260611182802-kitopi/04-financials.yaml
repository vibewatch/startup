- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact on underwriting
  - Why it matters
  - Best public proxy available
  - Exact diligence path
  rows:
  - - Cash on hand and runway
    - Cannot test liquidity after the debt raise
    - Debt plus growth only helps if liquidity is adequate
    - Profitability headline and debt choice
    - Request board or lender deck with cash, burn, and runway
  - - Gross margin by stream
    - Cannot assess structural profitability of owned brands versus services
    - Revenue quality depends on what mix actually carries margin
    - Industry fee pressure and SKOS efficiency claims
    - Request gross margin split by owned brands, partner services, dine-in, and meal plans
  - - Contribution margin after delivery / marketing
    - Cannot test the real benefit of loyalty and first-party channels
    - Third-party fees and CAC can absorb a large share of value
    - Forbes margin-pressure evidence
    - Request contribution margin by order source and channel mix
  - - Revenue mix
    - Cannot tell whether growth came from durable or lower-quality streams
    - Owned brands and franchises are strategically important but economically opaque
    - Public discussion of brands, franchising, and meal plans
    - Request revenue bridge by stream, market, and format
  - - Franchise economics
    - Cannot value the scalability of the new franchise push
    - A weak royalty model could add complexity without attractive returns
    - Public franchise-support positioning only
    - Request franchise FDD-style pack, fees, capex, and payback
  - - Debt terms
    - Cannot underwrite downside protection or refinancing risk
    - Growth debt can hide warrants, covenants, and maturity pressure
    - Public lender and round-size disclosure only
    - Request signed facility summary or lender term sheet
  notes: This table is intentionally explicit about what the public record does not provide, because those
    omissions drive the underwriting blocker in this chapter.
