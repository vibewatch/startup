  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: No public source discloses cash on hand, monthly burn, runway, or debt covenant headroom
      after the EvolutionX round.
    whyItMatters: Those are the minimum inputs needed to judge whether the 2026 debt is prudent growth
      capital or a source of refinancing risk.
    diligencePath: Request a lender or board deck with cash, burn, runway, covenants, and maturity schedule.
    relatedQuestionRefs:
    - QI018
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: No public source discloses gross margin, contribution margin, CAC, payback, or average
      order economics.
    whyItMatters: Profitability headlines are not enough without the underlying unit-economic bridge for
      owned brands, partner services, and delivery channels.
    diligencePath: Request contribution-margin and CAC/payback waterfalls by channel and by top brand.
    relatedQuestionRefs:
    - QI019
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Revenue mix is not public across owned brands, partner-managed kitchens, dine-in,
      meal plans, and franchising.
    whyItMatters: The quality and durability of revenue depend on which streams are actually driving the
      2024 and 2026 growth story.
    diligencePath: Request revenue and gross-profit bridge by stream, market, and format for 2023-2026.
    relatedQuestionRefs:
    - QI020
  - type: private-evidence-only
    severity: material
    topic: franchise-economics
    missingEvidence: Public franchise materials omit fee schedules, royalty structure, unit capex, and
      partner payback.
    whyItMatters: Franchising is a major use of funds and part of the moat thesis, so missing economics
      block any scale-value judgment.
    diligencePath: Request franchise disclosure materials, sample unit economics, and actual pipeline
      conversion data.
    relatedQuestionRefs:
    - QI012
    - QI020
  - type: missing-source
    severity: minor
    topic: peer-margin-comparables
    missingEvidence: The reviewed public peer filings show disclosure surfaces but not a normalized, directly
      comparable margin bridge for Kitopi’s hybrid model.
    whyItMatters: Peer reporting helps frame what a public company would disclose, but it does not by
      itself solve the private-company economics gap.
    diligencePath: Build a benchmark pack that standardizes margin, take-rate, and working-capital metrics
      across public delivery and restaurant-platform comps.
    relatedQuestionRefs:
    - QI017
