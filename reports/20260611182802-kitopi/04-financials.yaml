- id: unit-economics-and-cost-structure
  title: Unit economics and cost structure
  body: The strongest public evidence around Kitopi’s unit economics is directional rather than complete.
    Official tech and smart-kitchen materials say SKOS optimizes kitchens in real time, helps partners
    scale quickly, and supports customer service, delivery, and business tooling. Careers pages show the
    company has broad cost centers across finance, legal, supply chain, property management, customer
    experience, strategy, product, and operations. Those surfaces imply a real operating platform, not
    a lightweight marketplace wrapper. But the adverse industry evidence is equally important. Forbes
    says ghost kitchens still face 15% to 30% delivery-fee pressure, high acquisition costs, and low loyalty,
    while Restaurant Business shows what happens when category operators outrun economics. For Kitopi,
    that means efficiency claims and profitability headlines should be treated as helpful but incomplete.
    The company may now own more of the consumer relationship and more of the gross profit pool, yet it
    also carries more brand and operating overhead. Without public margin, CAC, repeat-order, and cohort
    data, the public record supports a mechanism view, not a completed unit-economic model. The practical
    diligence consequence is that every bullish revenue or profitability statement must be paired with
    a request for cohort retention, channel mix, and contribution margin by brand and market before it
    can support a serious underwriting case.
