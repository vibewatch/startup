      - number: '4.2'
        title: 单位经济与成本结构
        blocks:
          - type: paragraph
            body: >-
              围绕 Kitopi 单位经济，最强的公开证据是方向性的，而非完整的。官方技术和智能厨房材料称，SKOS
              能实时优化厨房，帮助合作伙伴快速扩张，并支持客服、配送和业务工具。招聘页面显示，公司在财务、法务、供应链、物业管理、客户体验、战略、产品和运营上有广泛成本中心。这些入口暗示 Kitopi
              拥有真实运营平台，而不是轻量级市场包装。但行业负面证据同样重要。Forbes 称，幽灵厨房仍承受 15% 至 30% 的配送费压力、高获客成本和低忠诚度；Restaurant Business
              展示了品类运营商跑在经济性前面会发生什么。对 Kitopi
              而言，这意味着效率主张和盈利标题有帮助，但不完整。公司或许现在掌握了更多消费者关系和更多毛利池，但也背上更多品牌和运营开销。没有公开利润率、CAC、复购订单和 cohort
              数据，公开记录支持的是机制视角，而不是完整的单位经济模型。实际尽调后果是，任何看多收入或盈利能力的表述，都必须配套索要按品牌和市场拆分的 cohort 留存、渠道组合和贡献利润率，才足以支撑严肃投资判断。
