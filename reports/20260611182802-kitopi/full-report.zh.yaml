    notes: 即便考虑 Kitopi 的自有品牌与特许经营混合策略，和公开可比公司相比，Kitopi 仍显得昂贵。Olo 是这里最接近软件公司的最高倍数标的，但除非接受大幅调整，仍低于 Kitopi 的隐含估值。
