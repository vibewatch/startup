      - number: '2.4'
        title: 增长驱动与约束：品类在扩张，但信任、质量和经济性仍限制轻松上行
        blocks:
          - type: paragraph
            body: >-
              结构性需求驱动很直接。MarkNtel 指出，智能手机持有率、互联网渗透率、外籍劳动力占比较高的劳动力市场、女性劳动参与率上升以及便利消费行为，是 GCC
              的核心增长驱动。阿联酋宏观数据和食品服务数据也指向同一方向：有韧性的非石油经济、旅游支撑，以及庞大的食品服务和食品电商渠道，使该地区适合支持外卖的业态。公开市场外卖平台也显示，订单、GMV
              和变现工具仍在扩张；DoorDash 强调 DashPass、杂货和零售扩张、订位和广告，Delivery Hero 强调多垂直客户消费是仅食品客户的 5.2 倍。但摩擦真实存在。GCC
              市场研究指出，食品安全事件、长距离配送导致的温度劣化，以及清真保证担忧，构成信任约束。Business of Apps
              又给出更财务化的警示：配送和服务成本高于五年前。成熟市场披露进一步说明，经济性并非处处已经跑通。Just Eat Takeaway 在变现和 EBITDA 改善后，2025 年 H1
              持续经营业务仍亏损。结果是，市场顶线逻辑强，但价值捕获仍有选择性：更可能胜出的，是能把品牌杠杆与严格厨房、渠道经济性结合起来的运营商，而不是每一个暴露于外卖需求的参与者。
