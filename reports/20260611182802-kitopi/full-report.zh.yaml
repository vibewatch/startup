              幽灵厨房模式更能控制客户数据。下行在于，公开证据仍没有说明外部品牌与自有品牌各占多少收入，业务多大程度依赖外卖平台，或少数概念是否贡献了不成比例的体量。外卖依赖并非假设；Endeavor 和 AstroLabs
