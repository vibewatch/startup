      - number: '8.2'
        title: 公开可比公司仍指向明显低于 Kitopi 隐含水平的倍数区间
        blocks:
          - type: paragraph
            body: >-
              可比公司不完美，但不完美不等于没用。Toast、Olo 这类餐厅软件公司具备更清晰的经常性软件属性；Toast 还披露更充分，盈利路径也清楚。DoorDash、Uber、Deliveroo、Just Eat
              Takeaway 这类外卖平台并不是运营上的完全匹配，但它们是公开市场对食品下单与物流生态最接近的实时读数。放在这一组里，观察到的收入倍数远低于 Kitopi 隐含的 9x 以上水平。DoorDash
              是这组里最强的大市值可比公司，筛下来也只有约 4x 中段。Uber 更低。Deliveroo 和 Just Eat
              低得多，部分原因是公开市场惩罚了较弱的外卖经济性，部分原因是整合已经让一些独立玩家彻底翻篇。Olo 最近一次已知倍数是最支持软件化叙事的数据点，但单靠它也不足以支撑 Kitopi
              的隐含价格。因此，情景表必须把重点放在倍数压缩风险，而不只是收入增长的希望。这组里质量更高的可比公司之所以获得公开投资人更好待遇，是因为它们披露了留存、利润率和现金流的驱动因素。Kitopi
              也许应相对组内最弱公司获得一些战略性上调，但举证责任仍在主张溢价的一方，而不是在谨慎承销的一方。
