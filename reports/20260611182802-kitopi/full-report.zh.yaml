      - number: '2.3'
        title: 买方、用户与付款方地图：平台掌握消费者需求，运营商靠品牌和运营杠杆变现
        blocks:
          - type: paragraph
            body: >-
              市场链条是多边的。需求侧，终端消费者通过平台到消费者或餐厅到消费者的应用点餐。供给侧，餐厅品牌、特许经营商和自有品牌运营方需要厨房、劳动力系统、菜单执行和物流协调。公开平台披露说明聚合平台为何重要。Uber
              报告称，进入 2026 年时月活消费者为 202 million，日行程超过 40 million；DoorDash 报告 2025 年 Q4 订单为 903 million，市场 GOV 为 USD 29.7
              billion。Delivery Hero 的 MENA 数据增加了区域相关性：2025 年 Q2 MENA GMV 同比增长 26%，Hungerstation 沙特订单动能超过
              20%。这些数字显示需求在哪里集中。但 Kitopi
              的变现逻辑不同。其特许经营页面暗示买方拥有资本、有酒店餐饮野心，并希望获得运营支持；其品牌页面显示，自有概念可以通过堂食、外卖和特许经营铺开来变现。这形成一条链：预算所有权可以在特许经营商或品牌所有者手中，而消费者需求仍通过外卖平台被捕获。因此，分析
              Kitopi 时应少把它当作 App，多把它看作接入平台生态的基础设施与品牌层。
