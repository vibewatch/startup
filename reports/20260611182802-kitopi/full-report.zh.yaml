  - id: TV005
    title: 投资逻辑失效与叫停触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 下一轮融资估值持平或下调，且结构更紧
        - 新资金估值低于或仅等于上一轮，同时附带重度优先权或类债保护
        - 削弱「业务质量改善正在支撑估值」这一判断
        - 重新定价为回避，除非下行风险已明确计入价格
      - - 自有品牌和第一方需求仍未成规模
        - 没有证据表明直接需求正在降低对平台市场的依赖
        - 打破「相较外卖可比公司应享有溢价」的论点
        - 转向低个位数收入倍数框架
      - - 主要市场出现质量或合规事件
        - 核心 GCC 市场出现关店、召回或评分持续恶化
        - 打击收入韧性，并抬高折现率假设
        - 暂停投资，或要求大幅估值折让
      - - 与外卖相关公司挂钩的退出市场持续关闭
        - 没有可信的 IPO 或战略出售可比交易能以溢价倍数出清
        - 拉长持有周期，并压低终值倍数
        - 将当前估值视为过早 / 过贵
    notes: 这些触发因素关注会推翻溢价逻辑的证据，而不只是增长放慢。
