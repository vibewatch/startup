      - number: '8.3'
        title: 建议：继续研究，因为业务可能跑得通，但价格仍可能不守纪律
        blocks:
          - type: paragraph
            body: >-
              Kitopi 的乐观投资逻辑很容易说清：GCC
              规模、盈利改善、自有品牌占比提升，以及特许经营可能把一个资本密集型运营商推近区域品牌平台。问题不在想象力，而在证据。今天的公开记录仍没有展示渠道结构、按品牌拆分的贡献利润率、同店销售、债务条款、清算优先权，或清晰的股权结构表。正是这些项目决定
              Kitopi
              的混合模式应拿到溢价倍数，还是仍然受制于平台经济性和运营强度。因此，正确建议是继续研究，置信度中等、风险高、估值立场昂贵。这不是否定公司，而是判断：当可见证据仍留下关键下行变量时，价格纪律比叙事动能更重要。业务质量还不错、价格支撑却偏弱，正是严谨投资人应该放慢而非加速的情形。更强的建议需要一手尽调补上结构和单位经济缺口，而不是又一个利好的融资标题。
