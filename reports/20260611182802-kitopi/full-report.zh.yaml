        title: 留存与体验质量
        blocks:
          - type: paragraph
            body: >-
              在 Kitopi 讨论如何管理服务质量的地方，客户耐久性的公开证据最强；在市场通常期待正式留存指标的地方，证据最弱。客户体验文章有用，因为它把运营闭环说清楚：品牌级和厨房级仪表盘、对每个低评分订单的调查、用 QR
              扫描减少漏项，以及指挥中心对骑手和厨房产能的可见度。忠诚度文章补上行为侧，认为迪拜的复购取决于一致性、个性化、用户倡导和无摩擦回访路径，而不只是积分。应用商店证据方向上正面但混杂。Apple 抽样 iPhone
              列表显示 4.5 的体面评分，而 MWM 报告称，用户强烈喜欢便利性和返现，同时也尖锐抱怨积分消失、App 稳定性和区域覆盖。这让投资判断保持平衡：Kitopi
              显然把客户体验当作运营纪律，但外部投资者仍无法验证这些努力是否转化为消费者 App、自有品牌或外部餐厅账户的流失率、NRR 或续约结果。
