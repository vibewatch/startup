chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、模式与当前版图
        blocks:
          - type: paragraph
            body: >-
              Kitopi 的公开材料给出了清晰的顶层身份：公司 2018 年创立于迪拜，名称来自「Kitchen
              Utopia」，最初为食品品牌打造托管云厨房或餐厅即服务平台，让它们不用投入完整餐厅资本开支也能获得外卖覆盖。后文最可复用的事实，不只是 Kitopi
              运营厨房，而是它长期把自己定位为运营层：公司管理供应链、厨房运营、配送协调和客户体验，让餐厅或品牌所有者专注菜单和品牌。自有 SKOS 技术栈是这套叙事的核心，因为公司反复称它能实时优化厨房运营，并可在短至 14
              天内完成合作伙伴上线。面向 2026 年的官方页面，如今比早期云厨房报道呈现出更宽的身份。Kitopi 称其在阿联酋、沙特阿拉伯、巴林、卡塔尔和科威特运营超过 200
              个门店，当前品牌页面显示组合覆盖外卖优先、餐食计划和堂食概念。因此，标准公司概览框架已不再是「单一产品云厨房创业公司」。Kitopi 是一家 GCC
              食品科技运营商，仍依赖云厨房基础设施，但越来越多靠自有品牌、特许经营和全渠道餐饮业态变现。
