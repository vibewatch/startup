  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局与公司位置
        blocks:
          - type: paragraph
            body: >-
              Kitopi 已不再能被规整放进「为第三方品牌提供托管云厨房」这个狭窄盒子；这一盒子定义的是 2020-2021 年高峰期的品类。当前公开入口强调的是一个更宽的 F&B
              生态，覆盖外卖、堂食、餐食计划、自有品牌、特许经营和规模不小的技术栈；独立来源仍把它放在经典托管厨房和幽灵厨房同行旁边。因此，正确竞争格局比一份 GCC 外卖运营商名单更宽。最接近的直接基础设施同行仍是
              CloudKitchens、Kitchen United、Deliveroo Editions 和 REEF，因为它们都向餐厅运营商销售某种厨房容量、扩张工具或与需求挂钩的履约能力。但 Rebel Foods 和
              Wonder 也重要，因为它们展示了相邻模式：通过自有品牌、多品牌点餐和直接 App 流量，捕获更多消费者关系。实际结论是，Kitopi 同时在三层竞争：厨房基础设施、操作系统和工作流工具，以及品牌所有权 /
              消费者触达。
