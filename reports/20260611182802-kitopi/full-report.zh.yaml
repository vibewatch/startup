      - number: '2.2'
        title: 规模测算视角：GCC 外卖很大，云厨房小得多，Kitopi 夹在中间
        blocks:
          - type: paragraph
            body: >-
              最干净、由证据支撑的规模测算，应使用多个视角，而不是押注一个宏大数字。MarkNtel 估计 GCC 在线食品外卖市场 2023 年约为 USD 3.93 billion，到 2030 年达到 USD 11.18
              billion，这是区域内最宽的数字需求池。但中东和非洲云厨房市场 2024 年只有约 USD 427 million，预计 2030 年达到 USD 1.074 billion；沙特云厨房子板块 2023
              年约为 USD 173 million。这些较低数字更接近 Kitopi 竞争的运营层。全球背景解释了投资者为何关注这一品类：DataM 估计 2025 年全球在线食品外卖为 USD 303.2
              billion，TBRC 估计 2025 年全球云厨房为 USD 71.81 billion。但这些全球数字应作为估值背景，而不是 Kitopi 的直接可服务市场。阿联酋公开市场背景也支持真实需求。USDA
              食品服务报告称，阿联酋食品服务价值销售额 2023 年达到 USD 9.47 billion，食品电商达到 USD 1.07 billion，更广的 HRI 渠道为 USD 18.78
              billion。实际结论是，Kitopi 所在市场真实且增长中，但可投资的问题在于，这部分需求中有多少归外包厨房运营商和本土特许经营平台，而不是归聚合平台或全服务餐厅。
