      - number: '7.3'
        title: 如果品类下修评级，财务、声誉和退出风险都会恶化
        blocks:
          - type: paragraph
            body: >-
              Kitopi 2026 年盈利里程碑有帮助，但并未消除资本强度或退出风险。公司已经融入独角兽级资本，Tracxn 的 $852 million 累计融资统计意味着未来轮次会被放在很高的预期集下评判。然而，2026
              年新轮只有 $50 million，远低于定义早期扩张阶段的 2021 年和 2022 年支票。这一模式符合一个正在走向更严苛投资测算、而非更轻松乐观的行业。Forbes 2026 年幽灵厨房批评和 Sensor
              Tower 关于欧洲部分地区需求重置的证据都重要，因为它们显示，更广品类不再获得一揽子增长信用。声誉问题会放大这种财务敏感性。抵制叙事不需要公平，也可能造成伤害，只要它们喂养出一种故事：Kitopi
              挤压本地运营商，或集中太多市场权力。在这种环境中，主要投资者问题不是 Kitopi
              能否继续增长，而是它能否在降低对聚合平台依赖、守住质量的同时，证明未来退出应获得溢价倍数，而不是品类折价。实际而言，估值应被视为风险治理的输出，而不是独立故事。如果合规、伙伴集中或质量控制数据在尽调中令人失望，倍数应先压缩，然后才轮到讨论长期
              TAM。
