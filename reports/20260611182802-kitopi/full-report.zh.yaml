            body: >-
              负面证据重要，因为这一品类最弱的地方一直是经济性，而不是认知度。Forbes 认为，幽灵厨房面临结构性高获客成本、低忠诚度，以及 15% 至 30% 的配送费；Restaurant Business 则展示了
              REEF 疫情期间激增后撞上盈利、监管和关店问题。对 Kitopi 而言，这些信号重要，因为它们说明集中式厨房本身不是护城河。更耐久的优势来自掌握需求，或掌握足够多的客户旅程，从而保护利润率和复购。Kitopi
              转向自有品牌、特许经营和第一方互动，方向正确；但风险画像也随之改变：公司现在必须证明品牌吸引力、品牌留存和特许经营纪律，而不只是厨房吞吐量。换句话说，Kitopi
              在价值链控制上看起来强于纯基础设施同行，但仍暴露于全品类利润率和执行压力；这些压力已经击垮更弱的幽灵厨房运营商。
