    summary: 主要风险通道最终汇入订单经济性、客户复购和退出估值。
    data:
      nodes:
        - id: n1
          label: 监管疏漏
          detail: 许可或检查失败会扰乱厨房或品牌运营。
        - id: n2
          label: 平台挤压
          detail: 佣金、排序或整合会压缩订单利润率。
        - id: n3
          label: 品质不一致
          detail: 服务或食品波动会拉低评分和复购。
        - id: n4
          label: 收入波动
          detail: 订单、AOV 或结构恶化。
        - id: n5
          label: 利润率压缩
          detail: 贡献利润和 EBITDA 承压。
        - id: n6
          label: 资本 / 估值压力
          detail: 新资金变得更挑剔或更昂贵。
      edges:
        - from: n1
          to: n4
          label: 门店扰动
        - from: n2
          to: n5
          label: 抽佣压力
        - from: n3
          to: n4
          label: 复购流失
        - from: n4
          to: n5
          label: 运营去杠杆
        - from: n5
          to: n6
          label: 倍数重置
        - from: n2
          to: n6
          label: 依赖信号
    approximationNotes: 这是因果图，不是预测。它展示看似局部的运营失败，如何演变成融资或估值问题。
    claimRefs:
      - CR004
      - CR014
      - CR016
      - CR020
      - CR027
      - CR028
      - CR041
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: 关键依赖不在 Kitopi 直接控制之下，尤其集中在平台、监管和资本。
    data:
      nodes:
        - id: d1
          label: Talabat / Delivery Hero
          detail: 最大的 MENA 市场平台敞口。
        - id: d2
          label: Deliveroo / DoorDash
          detail: 高端 UAE / Kuwait 需求，以及更集中的平台栈。
        - id: d3
          label: Careem / Uber
          detail: 营销活动和超级 App 触达。
        - id: d4
          label: Dubai / GCC 监管机构
          detail: 许可和检查。
        - id: d5
          label: 成长贷方 / 投资者
          detail: 扩张资本和再融资灵活性。
        - id: d6
          label: Kitopi 品牌和厨房
          detail: 所有依赖交汇的运营核心。
      edges:
        - from: d1
          to: d6
          label: 订单流
        - from: d2
          to: d6
          label: 高端需求
        - from: d3
          to: d6
          label: 促销触达
        - from: d4
          to: d6
          label: 运营许可
        - from: d5
          to: d6
          label: 资本跑道
    approximationNotes: 依赖方仅限于那些能实质改变 Kitopi 经济性，或影响其开店和运营能力的主体。
    claimRefs:
      - CR010
      - CR013
      - CR016
      - CR029
      - CR040
      - CR042
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 业务质量在改善，但估值支撑落后于证据支撑。
    data:
      nodes:
        - id: v1
          label: 规模 + 盈利信号
          detail: 200+ 家门店、2024 年收入披露、盈利里程碑。
        - id: v2
          label: 自有品牌 / 加盟上行空间
          detail: 收入质量可能好于纯市场平台敞口。
        - id: v3
          label: 披露缺口
          detail: 公开渠道结构、利润率桥接和股权结构表都不清晰。
        - id: v4
          label: 可比上市公司现实
          detail: 最相关的公开市场倍数远低于 Kitopi 隐含估值。
        - id: v5
          label: 继续研究
          detail: 业务有意思，但按当前可见价格进入，纪律性不足。
      edges:
        - from: v1
          to: v2
          label: 支撑上行
        - from: v2
          to: v5
          label: 单独不够
        - from: v3
          to: v5
          label: 限制信心
        - from: v4
          to: v5
          label: 倒逼纪律
    approximationNotes: 流程是定性框架，服务于投委会逻辑，而不是精确权重。
    claimRefs:
      - CV004
      - CV009
      - CV042
      - CV044
      - CV045
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 合理收入倍数小幅变化，就会相对当前私有市场标记产生大幅摆动。
    data:
      items:
        - label: 3.0x 收入
          value: 497.1
          detail: 使用 2024 年收入计算的 $M 估值
        - label: 4.5x 收入
          value: 745.7
          detail: 使用 2024 年收入计算的 $M 估值
        - label: 6.0x 收入
          value: 994.2
          detail: 使用 2024 年收入计算的 $M 估值
        - label: 7.5x 收入
          value: 1242.8
          detail: 使用 2024 年收入计算的 $M 估值
        - label: 当前隐含 9.1x
          value: 1507.9
          detail: 使用四舍五入当前标记计算的 $M 估值
    approximationNotes: 数值只是把不同收入倍数套用于已披露的 2024 年收入 $165.7 million。
    claimRefs:
      - CV002
      - CV009
      - CV010
      - CV042
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 当前定价让基准情景容错空间很窄，悲观情景下则有实质下行。
    data:
      items:
        - label: 悲观估值（$M）
          low: 414
          mid: 497.1
          high: 579.9
        - label: 基准估值（$M）
          low: 745.7
          mid: 828.5
          high: 911.4
        - label: 乐观估值（$M）
          low: 1077.1
          mid: 1160
          high: 1325.6
        - label: 当前隐含标记（$M）
          low: 1500
          mid: 1525
          high: 1550
    approximationNotes: 区间代表收入倍数情景，而不是 DCF 输出。它们展示相对当前私有市场标记的估值压缩风险。
    claimRefs:
      - CV009
      - CV010
      - CV045
      - CV046
      - CV047
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 可供投委会使用的评分卡，把业务质量和价格纪律分开看。
    data:
      items:
        - label: 业务质量
          value: 7/10
          detail: 规模和盈利信号是真实的，但披露仍然很薄。
        - label: 市场位置
          value: 7/10
          detail: 在 GCC 的相关性清晰，但平台掌握了大量消费者关系。
        - label: 证据质量
          value: 5/10
          detail: 私营公司披露仍然存在实质缺口。
        - label: 估值支撑
          value: 3/10
          detail: 如今公开可比公司不支持 9 倍以上收入倍数。
        - label: 整体建议
          value: research-more
          detail: 资产有意思；价格支撑不足。
    claimRefs:
      - CV004
      - CV038
      - CV042
      - CV044
