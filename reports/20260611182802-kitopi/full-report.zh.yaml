      - 类别
      - 公开规模信号
      - 主要客户
      - 核心模式
      - 相对 Kitopi 的意义
    rows:
      - - Kitopi
        - 托管云厨房加自有品牌
        - 7 个国家；12 个城市；200+ 个点位；100+ 个品牌；6,000+ 名员工
        - 消费者、餐厅合作伙伴、加盟合作伙伴
        - 拥有并运营品牌，支持配送和堂食，开放概念加盟，运行厨房软件
        - 比纯厨房房东更宽，越来越接近区域品牌平台模式
      - - CloudKitchens
        - 厨房基础设施
        - 600+ 个品牌信任；每个点位 20+ 间私有厨房
        - 餐厅运营方
        - 预建商用厨房，报价制定价，前期投入低
        - 基础设施竞品很强，但直接品牌所有权弱于 Kitopi
      - - Kitchen United
        - 轻资产店外触达
        - 单点位 10+ 家餐厅；主打交钥匙、轻资产
        - 餐厅运营方
        - 面向店外需求的共享厨房和自提模式
        - 更接近基础设施和自提，不像 Kitopi 那样拥有自有品牌生态
      - - Deliveroo Editions
        - 绑定市场平台的厨房扩张
        - 英国 20+ 个 Editions 点位；在四个国家运营
        - Deliveroo 上的餐厅合作伙伴
        - 只做配送的厨房，绑定 Deliveroo 物流和需求
        - 把产能与市场平台分发结合起来，Kitopi 单独很难完全复制
      - - REEF
        - 软件主导的街区商业
        - 65+ 个配送集成；直接点单、POS、自助终端、储物柜
        - 点位运营方和配送商户
        - REEF OS 加配送连接和本地订单管理
        - 竞争点在软件工具和订单流编排，而不只是厨房
      - - Rebel Foods
        - 自有品牌互联网餐厅网络
        - 4,000+ 家互联网餐厅；450+ 间厨房；70+ 个城市；10 个国家；2M+ 客户
        - 消费者和合作品牌
        - 多品牌自有品牌、启动器平台和消费者 app
        - 自有品牌、多厨房规模能在全球跑通的最大证明
      - - Wonder
        - 面向消费者的多餐厅平台
        - 20+ 个获奖餐厅合作伙伴
        - 消费者
        - 多餐厅点单，$0 配送费，集成式点位
        - 说明拥有消费者触点有多重要
      - - 现状 / 内部自建
        - 内部替代方案
        - 餐厅可以靠自有厨房、POS 和配送市场平台扩张
        - 餐厅运营方
        - 使用现有厨房，或增加小型店外产能
        - 如果运营方已经拥有需求，测试起来往往比外包更便宜
    enumerationScope:
      coverage: partial
      basis: >-
        Captures the most visible global and regional models surfaced in the fetched corpus: infrastructure-only
        operators, marketplace-linked kitchens, owned-brand internet restaurants, consumer aggregators, and the
        internal-build substitute set.
    notes: 各行混合官方规模披露和独立市场图谱，因此比较是方向性的，不是逐项可比的运营基准。
