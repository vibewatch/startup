  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: Kitopi 的运营进展真实，但当前估值标记仍显偏贵
        blocks:
          - type: paragraph
            body: >-
              Kitopi 估值逻辑里最强的一点，是它已经不像一个纯靠想象撑起的幽灵厨房故事。公司报告已跨过盈利节点，第三方报道披露 2024 年收入为 $165.7
              million，并且似乎正从单纯租来的需求，转向自有品牌、会员忠诚度和特许经营。业务质量确实比过去更好。估值问题在于，可见价格锚仍然指向 2021-2022 年的独角兽时代。Tracxn 标出的 2022
              年投后估值 $1.55 billion，或用户概括的 $1.5 billion 口径，折算约为 2024 年收入的 9.1x 到 9.4x。2026 年 $50 million
              轮融资不像一次明确向上重估，更像是在经营节点之后继续给支持。因此，公开证据支持的是一家公司：它或许应比弱势外卖平台享有一些溢价，但溢价不能大到让入场纪律变成可选项。这就是为什么默认立场应是谨慎，而不是兴奋。当前估值并非因为公司是假的而荒唐；它显得吃紧，是因为证据仍不完整。投资人被要求先为更干净的未来收入组合买单，但这套组合的机制还没有出现在公开数字里。
