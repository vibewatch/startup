  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和平台集中风险排在首位
        blocks:
          - type: paragraph
            body: >-
              Kitopi 最大的外部风险，不能简单靠更多厨房或更多品牌解决。第一是监管：GCC 的食品安全合规不是一张单一许可证，而是分层运营纪律，结合联邦规则、市政许可、检查和各市场特定更新。Kayrouz 2026
              年法律评论之所以有用，正因为它把运营商在一线感受到的情况翻译出来：在阿联酋，仅有有效商业许可证仍不足以处理食品，还需要市政批准；迪拜和阿布扎比已经大规模运行活跃检查项目。沙特阿拉伯又增加第二层不确定性，因为
              SFDA 法规页面在 2026 年仍持续更新。第二个外部风险是平台集中。Talabat、Deliveroo、Careem 和 Delivery Hero 技术栈控制 GCC 的需求发现和抽佣率。这意味着，即使
              Kitopi 的运营杠杆改善，只要分销仍由市场平台主导，议价杠杆仍可能弱化。DoorDash 收购 Deliveroo
              只会让这一点更尖锐：现在挡在品牌和客户之间的规模化对手更少。因此，投资者应要求查看实时许可证清单、检查节奏和伙伴商业排期，而不是依赖标题式增长指标。如果这些运营控制弱于当前叙事，下行会先反映在贡献利润率上，随后才反映在增长标题中。
