      - number: '1.3'
        title: 资本形成、规模披露与未解的融资算术
        blocks:
          - type: paragraph
            body: >-
              融资历史足以证明 Kitopi 已进入后期阶段，但还不足以在没有后续追问的情况下支撑可直接落入股权结构表的叙事。MAGNiTT 报道 $60 million Series B 时，将 Kitopi 描述为运营
              30 多个厨房、合作餐厅超过 100 家。随后 Wamda 和 MAGNiTT 支持 2021 年 7 月由 SoftBank Vision Fund 2 领投的 $415 million Series C；这让
              Kitopi 成为区域独角兽，也成为 SoftBank 第一笔总部在阿联酋的投资。下一步开始出现模糊：Kitopi 自己的文章称又获得 $300 million Series C 延展轮，而 MAGNiTT
              称该延展轮使 Series C 总额达到 $715 million，并将其与全渠道转型联系起来。Tracxn 又给出一个外部数据点，列出 2022 年 5 月 $300 million Series C，投后估值
              $1.55 billion；另单列 2026 年 1 月 $50 million 轮。Wamda 的 2026
              年报道是当前最好的新鲜度锚点，因为它明确把新资金与盈利能力和本土品牌扩张绑定。即便如此，公开记录仍缺融资文件、具体工具细节，以及完全对齐的累计融资数字。因此，当前后期规模可信，但公开融资算术仍应按中等置信度处理，而不是审计终稿。
