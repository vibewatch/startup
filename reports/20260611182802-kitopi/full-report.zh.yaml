      - number: '1.2'
        title: 领导层厚度与治理可见度
        blocks:
          - type: paragraph
            body: >-
              高管层面的领导层可见度相当好，董事会或所有权层面的可见度明显更弱。公开领导团队页面列出 Mohamad Ballout 为 CEO 兼联合创始人，Saman Darkan 为 CTO，Bader Ataya
              为首席增长官，Sami Bejjani 为 CFO，Jihad Bou Nasr 为首席人才与转型官，Mohamad Sami Ballout 为 COO。Kitopi 还在 2023 年披露沙特运营调整，任命
              Wentzel David de Wet 为 KSA 董事总经理，说明业务成熟后，国家层面的管理专业化在增强。缺失的是标题之下的治理层。投资者和融资报道清楚点名 SoftBank Vision Fund
              2、Chimera、DisruptAD、B. Riley、Dogus Group、Next Play Capital、Nordstar，以及后来的
              EvolutionX，但保留来源中没有清晰的公开董事会名单、席位分配、所有权拆分或当前控制图。薪酬和员工持股可见度也有同样问题：Kitopi 披露过 2022 年 ESOP 回购，并称 60% 总部员工持有
              ESOP，但没有公开稀释影响、期权池规模或当前期权悬置细节。对尽调而言，结论是高管识别可用，治理与控制仍需要一手文件或管理层直接访谈。
