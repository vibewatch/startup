  - id: TR005
    title: 缓释和放弃标准表
    columns:
      - 风险
      - 可监测触发器
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 聚合平台挤压
        - 佣金或广告包阶梯上调
        - 综合渠道成本升至 30% 以上，且 AOV 没有同步提升
        - 暂停基于聚合平台需求假设的激进新品牌铺开
      - - 质量控制滑坡
        - 客户评分恶化或重复投诉
        - 多个品牌或厨房连续两个季度评分下滑
        - 承销进一步扩张前，要求开展运营审计
      - - 监管事件
        - 检查不合格、关停或正式通知
        - 核心市场出现任何重复关停、召回或劳动执法行动
        - 升级到投资逻辑破裂审查，并重新评估治理
      - - 估值 / 退出重设
        - 新融资以持平或下调经济条款完成，且条款更紧
        - 下一轮融资显示定价更弱，或结构限制明显增加
        - 重设回报预期，将立场从增长承销转向下行保护
    notes: 放弃标准刻意设置成可监测，而不是理论推演。风险治理成熟时，管理层内部本就应该跟踪每一项。
