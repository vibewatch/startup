  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础分层
        blocks:
          - type: paragraph
            body: >-
              Kitopi
              的客户地图比经典幽灵厨房故事更宽。当前官方组合显示，自有品牌覆盖家庭餐饮、健康餐食计划、咖啡馆、汉堡、寿司、甜品和外卖优先概念。这很重要，因为公司如今既服务企业型餐厅伙伴，也用自有标签直接服务食客。Right
              Bite 是结构化周期性消费者产品最清楚的例子：它围绕营养目标定义买方，使用营养师设计的订阅，并延伸到按需订单。Eatopi 又不同，它像一个轮换的厨师与品牌展示场，由 Kitopi
              围绕本地餐饮创作者策划流量和需求。消费者 App
              再把多个品牌用返现和跨品牌点餐连接起来，让食客关系本身成为产品表面。合在一起，材料包支持一种混合客户架构：直接消费者、自有品牌食客和餐厅伙伴都位于同一个需求引擎中。这种宽度是优势，但也意味着投资者问题必须拆开：谁向
              Kitopi 付费，谁使用服务，哪些品牌真正承担增长压力。
