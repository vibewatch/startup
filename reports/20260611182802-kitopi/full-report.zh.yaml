  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 渠道结构
        - 按 Talabat、Deliveroo、Careem、第一方 app、堂食和特许经营拆分的收入或 GMV
        - 判断 Kitopi 是在摆脱聚合平台经济，还是仍在租用需求
        - CFO / 增长团队资料室
      - - 品牌经济性
        - 按自有品牌队列拆分的贡献利润率、复购率和 CAC
        - 乐观情景取决于自有品牌经济性是否优于传统合作厨房业务
        - 财务 + 品牌运营复盘
      - - 资本结构
        - 当前股权结构表、债务条款、契约、清算优先权和期权池
        - 没有结构信息，就无法干净地承销价格
        - CFO + 法务
      - - 门店和厨房产能
        - 按市场拆分的同店销售、厨房利用率和关闭历史
        - 用来检验规模是有效产能，还是只是覆盖面更广
        - 运营资料包
      - - 特许经营模式
        - 版税、费用、回本周期和支持成本假设
        - 特许经营是上行空间的核心，但公开市场尚未定价
        - 特许经营 P&L 和管线复盘
    notes: 这些项目中任何一个，都可能比又一个月的泛泛市场评论更能改变估值判断。
