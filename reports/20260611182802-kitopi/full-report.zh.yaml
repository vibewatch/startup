            body: >-
              公开竞争对手入口显示，Kitopi 的同行正在解决同一个外卖履约问题的不同部分。CloudKitchens 和 Kitchen United
              主打轻资本基础设施，服务希望更快扩张、又不想建设完整线下门店的餐厅运营商。Deliveroo Editions
              把厨房容量与内嵌市场需求、可衡量的配送改善结合起来；当买方看重即时订单密度时，这一模式更有吸引力。REEF 更偏向软件、直接点餐和外卖平台集成，Rebel Foods
              则在全球规模上走得最接近自有品牌和操作系统模式。Wonder 则不太像托管厨房外包商，更像面向消费者的多餐厅目的地。相对这组公司，Kitopi 的差异化不再是云厨房本身的新鲜度，而是 GCC
              运营密度、自有和收购品牌、特许经营野心，以及从厨房编排延伸到面向客户渠道的垂直一体化技术栈。
