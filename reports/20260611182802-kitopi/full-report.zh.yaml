      - number: '5.3'
        title: 可靠性、可观测性与信任控制
        blocks:
          - type: paragraph
            body: >-
              Kitopi 最具体的信任证据来自运营，而不是认证。SRE 文章描述了 Dynatrace 管理区、团队所有权、接入 Slack 的告警、异常检测，以及关键端点的 SLO。移动端可观测性文章再下一层，说明
              Kitopi 在 App 侧关注哪些指标，并给出一个案例：支付仪表盘据称把取消率从低双位数降到中个位数。这是有意义的产品运营闭环，因为它显示团队在衡量商业痛点，而不只是基础设施在线率。Cognito
              文章又增加了一个有用的信任信号：Kitopi 愿意记录一套使用 API Gateway、Cognito 和 Terraform 的 OAuth2 client-credentials
              模式，说明平台确有集成工作，而不只是基础消费者点餐流程。即便如此，信任包仍不完整。同一个公开表面在工程流程上信息丰富，在正式披露上却偏薄。审阅材料包没有露出公开 uptime
              页面、第三方安全认证，或除应用商店跟踪披露之外的投资者级数据治理细节。这在可信运营成熟度与已完整尽调的企业级信任之间留下缺口。
