  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 技术栈与产品表面
        blocks:
          - type: paragraph
            body: >-
              Kitopi 的产品不只是一个消费者 App 或一组厨房。最强的官方主题，是分层运营技术栈。Smart Kitchens 和 Our Story 都把 SKOS
              定位为自研系统，实时优化厨房工作；技术页面又通过描述一支足以支撑严肃内部平台的工程组织，让这一主张更具体。公开 App 证据把范围扩展到后厨编排之外。iPhone 列表和官方 rewards
              页面显示，一个消费者产品把多个本土品牌、返现、扫码点餐、外卖和自提连接在一起。Google Play 显示，Android 组合已经覆盖核心 Kitopi rewards App 和 Right Bite
              App；这很重要，因为它意味着 Kitopi 正在为不同需求池建立独立入口，而不是把每个用户都塞进一个界面。2026 年 Right Bite
              发布进一步强化了这一判断：它为餐食计划用户增加排期灵活性，也扩大了证据范围，说明 Kitopi 现在同时销售餐厅入口和由软件调度的周期性营养工作流。
