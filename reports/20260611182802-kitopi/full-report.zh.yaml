  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失指标
      - 对承销判断的影响
      - 重要性
      - 最佳公开代理指标
      - 精确尽调路径
    rows:
      - - 手头现金和现金跑道
        - 无法检验债务融资后的流动性
        - 只有流动性充足，债务加增长才有帮助
        - 盈利标题和债务选择
        - 要求提供董事会或贷款方材料，列明现金、烧钱速度和现金跑道
      - - 按收入流拆分毛利率
        - 无法评估自有品牌相对服务业务的结构性盈利能力
        - 收入质量取决于真正承载利润的业务组合
        - 行业费用压力和 SKOS 效率主张
        - 要求按自有品牌、合作服务、堂食和餐食计划拆分毛利率
      - - 配送 / 营销后的贡献利润率
        - 无法检验忠诚度和一方渠道的真实收益
        - 第三方费用和 CAC 可能吃掉很大一部分价值
        - Forbes 关于利润率压力的证据
        - 要求按订单来源和渠道组合披露贡献利润率
      - - 收入组合
        - 无法判断增长来自耐久收入流还是较低质量收入流
        - 自有品牌和特许经营在战略上重要，但经济性不透明
        - 公开讨论品牌、特许经营和餐食计划
        - 要求按收入流、市场和形态提供收入桥
      - - 特许经营经济性
        - 无法评估新特许经营推进的可扩张性价值
        - 薄弱的版税模型可能只会增加复杂度，却没有有吸引力的回报
        - 仅有公开的特许经营支持定位
        - 要求提供 FDD 风格特许经营资料包、费用、资本开支和回本
      - - 债务条款
        - 无法承销下行保护或再融资风险
        - 增长债可能隐藏认股权证、契约和到期压力
        - 仅有公开贷款方和轮次规模披露
        - 要求提供已签署贷款安排摘要或贷款方条款清单
    notes: 该表刻意明确列出公开记录没有给出什么，因为这些缺口正是本章的承销阻断点。
