      - 什么会改变判断
    rows:
      - - Kitopi 确实有规模、盈利信号，以及来自自有品牌和特许经营的战略上行空间。
        - 若经验证的渠道结构显示自有需求，并且自有品牌毛利显著更高，可能支撑更高倍数。
      - - 隐含的 9x 以上收入倍数，已经把公开证据尚无法证明的执行兑现计入价格。
        - 若有一轮定价融资高于 2022 年估值，且条款透明、单位经济经审计，信心会提高。
      - - 公开可比公司显示，市场奖励有盈利的规模，但通常给的倍数低于 Kitopi 当前隐含水平。
        - 如果更相关的混合型私有同业在类似披露下，以显著高于 7x 收入的价格成交，相对溢价的反对理由会减弱。
    notes: 反向逻辑不是说 Kitopi 没有业务，而是当前价格看起来跑在可见证据基础前面。
