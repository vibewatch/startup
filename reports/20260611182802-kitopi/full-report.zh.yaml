  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与战略转向
        blocks:
          - type: paragraph
            body: >-
              Kitopi 2026 年的公开财务故事，最好理解为从纯「厨房即服务」基础设施业务，转向混合运营商：拥有品牌，运营堂食和外卖业态，支持餐食计划，并开始推进特许经营。2021
              年来源仍描述的是以合作伙伴优先的模式，围绕为餐厅品牌处理备餐和配送；餐食计划和杂货当时已作为早期多元化出现。到 2022 年，管理层已明确谈到向实体餐厅品牌投资数亿美元；到 2026
              年，公司官方和独立入口则围绕自有概念、特许经营、忠诚度和客户互动展开。收入质量因此发生变化。在纯托管厨房模式下，大部分上行归合作品牌和外卖平台。在 Kitopi
              当前结构中，理论上更多价值可以留在自有品牌和直接关系里。代价是，相比简单的基础设施房东，公司现在承担更多品牌建设、劳动力、物业和执行风险。因此，公开证据足以描绘收入机制，但不足以量化每条收入流占比。
