      - number: '3.3'
        title: 切换成本、分销与定价姿态
        blocks:
          - type: paragraph
            body: >-
              商业包装证据最值得注意的，是它省略了什么。CloudKitchens 把潜在客户导向报价流程，而不是公开价目表。Deliveroo Editions 称会提出与增长目标匹配的方案，同样没有标价。Kitchen
              United 营销「轻资本」非堂食触达，但不披露标准化经济性。Kitopi
              的特许经营页面也强调资格审核、培训、开业支持和运营手册，而不是前期费用或单位经济披露。这意味着切换成本分析必须聚焦工作流和分销，而不是标价。若运营商拥有菜单、品牌和客户名单，纯基础设施玩家仍相对容易被多平台并用绕开。模式在拥有品牌组合、消费者
              App 或数据层时会更黏。按这一标准，Kitopi 比 2021 年更有防御性：自有品牌、餐食计划和忠诚度野心，降低了对第三方餐厅伙伴的依赖，即便无法消除对外卖需求和区域执行的依赖。
