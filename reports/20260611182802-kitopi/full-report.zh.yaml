  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：Kitopi 更接近数字食品基础设施，而不是总餐饮支出
        blocks:
          - type: paragraph
            body: >-
              首先要避免的分析错误，是把 Kitopi 等同于整个餐饮市场，甚至等同于整个在线食品外卖市场。Kitopi
              自己的智能厨房、特许经营和品牌页面显示，公司如今横跨几个层级：为品牌外包厨房运营，运营自有或收购品牌，支持特许经营，并布局全渠道 F&B 业态。因此，正确的市场边界不是「所有售出餐食」，甚至不是「所有基于 App
              的外卖 GMV」。更窄的交集才是核心：支持外卖的食品基础设施、云厨房、多品牌餐厅运营和品牌扩张服务。第三方市场定义也支持这种更窄框架。TBRC
              将云厨房定义为服务外带和外卖、没有就餐空间的纯外卖商业厨房；MarkNtel 的 MEA 报告则拆分独立、中央厨房或多品牌、厨房舱和外包厨房等模式。Kitopi
              最接近外包或多品牌运营层，而不是完整消费者钱包。这一区分很关键，因为平台 GMV 可以很大，但厨房运营商可获得的收入池小得多。Kitopi
              当前品牌组合和特许经营主张，把可服务机会扩展到纯第三方赋能之外；但仍不足以把在线食品外卖总 GMV 视为公司的即时 SAM。
