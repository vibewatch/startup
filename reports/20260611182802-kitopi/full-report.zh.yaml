  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 自有品牌收入占比超过 50%，会员显著降低对聚合平台的依赖，特许经营在国际市场放量。
        - 在更大、更干净的收入基数上按 7.0x 收入估值，长期可能接近或小幅超过当前估值。
        - 执行滑坡、质量问题，以及披露仍然偏薄
        - 有可能，但需要尚未公开的证据
      - - 基准
        - Kitopi 继续增长、保持盈利，相比疲弱配送可比公司拿到溢价，但拿不到独角兽时代溢价。
        - 4.5x 到 5.5x 收入意味着，相比 9x 以上的进入倍数，除非收入快速增长，否则下行空间很大。
        - 聚合平台挤压、自有订单占比有限、退出市场低迷
        - 大多数证据指向这里
      - - 悲观
        - 聚合平台经济性仍然沉重，增长放慢，下一轮融资或退出按较低个位数可比倍数定价。
        - 2.5x 到 3.5x 收入意味着当前私募账面价格会深度重设。
        - 品类重估、股权结构摩擦和披露冲击
        - 不能排除
    notes: 情景区间是估值纪律的启发式框架，不是正式 DCF 输出。各情景刻意锚定可观察市场倍数，而不是编造运营预测。
