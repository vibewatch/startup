- id: buyer-and-value-chain
  title: 'Buyer, user, and payer map: platforms own consumer demand, while operators monetize through brands and operational leverage'
  body: 'The market chain is multi-sided. On the demand side, end consumers order meals through platform-to-consumer or restaurant-to-consumer applications. On the supply side, restaurant brands, franchisees, and owned-brand operators need kitchens, labor systems, menu execution, and logistics coordination. Public platform disclosures show why aggregators matter. Uber reported 202 million monthly active consumers and more than 40 million daily trips entering 2026, while DoorDash reported 903 million Q4 2025 orders and USD 29.7 billion of marketplace GOV. Delivery Hero’s MENA data adds regional relevance: MENA GMV grew 26% year over year in Q2 2025, with Saudi order momentum above 20% at Hungerstation. Those figures show where demand concentrates. But Kitopi’s monetization logic is different. Its franchise page implies a buyer with capital, hospitality ambition, and desire for operational support; its brand page shows owned concepts that can monetize via dine-in, delivery, and franchise rollout.
    This creates a chain in which budget ownership can sit with a franchisee or brand owner, while consumer demand is still captured through delivery platforms. That is why Kitopi should be analyzed less as an app and more as an infrastructure-and-brand layer that plugs into the platform ecosystem.'
