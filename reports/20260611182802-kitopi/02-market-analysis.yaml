- id: sizing-lenses
  title: 'Sizing lenses: GCC delivery is large, cloud kitchens are much smaller, and Kitopi sits between them'
  body: 'The cleanest evidence-backed sizing stack uses multiple lenses rather than one heroic number. MarkNtel estimates the GCC online food-delivery market at about USD 3.93 billion in 2023 and USD 11.18 billion by 2030, which is the broadest regionally relevant digital-demand pool. But the Middle East and Africa cloud-kitchen market is only about USD 427 million in 2024, projected to reach USD 1.074 billion by 2030, and the Saudi cloud-kitchen subsegment is about USD 173 million in 2023. Those lower figures are much closer to the operational layer where Kitopi competes. Global context helps show why investors care about the category: DataM sizes global online food delivery at USD 303.2 billion in 2025 and TBRC sizes global cloud kitchens at USD 71.81 billion in 2025. Yet those global numbers should be treated as valuation context, not as a direct Kitopi serviceable market. UAE public-market context also supports real demand. The USDA food-service report says UAE food-service value sales
    hit USD 9.47 billion in 2023 and food e-commerce reached USD 1.07 billion, while the broader HRI channel was USD 18.78 billion. The practical takeaway is that Kitopi operates in a real and growing market, but the investable question is which slice of that demand belongs to outsourced kitchen operators and homegrown franchise platforms rather than to aggregators or full-service restaurants.'
