tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Public scale signal
  - Primary customer
  - Core model
  - Why it matters versus Kitopi
  rows:
  - - Kitopi
    - Managed cloud kitchens plus owned brands
    - 7 countries; 12 cities; 200+ locations; 100+ brands; 6,000+ employees
    - Consumers, restaurant partners, franchise partners
    - Owns and operates brands, supports delivery and dine-in, franchises concepts, runs kitchen software
    - Broader than a pure kitchen landlord and increasingly closer to a regional branded-platform model
  - - CloudKitchens
    - Kitchen infrastructure
    - Trusted by 600+ brands; 20+ private kitchens per location
    - Restaurant operators
    - Prebuilt commercial kitchens with quote-based pricing and low upfront investment
    - Strong infrastructure competitor but weaker direct brand ownership than Kitopi
  - - Kitchen United
    - Capital-light off-premise access
    - 10+ restaurants in one location; turnkey, capital-light pitch
    - Restaurant operators
    - Shared kitchen and pickup model for off-premise demand
    - Closer to infrastructure and pickup than to Kitopi’s owned-brand ecosystem
  - - Deliveroo Editions
    - Marketplace-linked kitchen expansion
    - 20+ Editions sites in the UK; active in four countries
    - Restaurant partners on Deliveroo
    - Delivery-only kitchens tied to Deliveroo logistics and demand
    - Combines capacity with marketplace distribution in a way Kitopi cannot fully replicate alone
  - - REEF
    - Software-led block commerce
    - 65+ delivery integrations; direct ordering, POS, kiosks, lockers
    - Location operators and delivery merchants
    - REEF OS plus delivery connectivity and local order management
    - Competes on software tooling and order-flow orchestration rather than only kitchens
  - - Rebel Foods
    - Owned-brand internet restaurant network
    - 4,000+ internet restaurants; 450+ kitchens; 70+ cities; 10 countries; 2M+ customers
    - Consumers and partner brands
    - Multi-brand owned brands, launcher platform, and consumer app
    - Largest proof that owned-brand, multi-kitchen scale can work globally
  - - Wonder
    - Consumer-facing multi-restaurant platform
    - 20+ award-winning restaurant partners
    - Consumers
    - Multi-restaurant ordering with $0 delivery fees and integrated locations
    - Shows the competitive importance of owning the consumer touchpoint
  - - Status quo / internal build
    - In-house alternative
    - Restaurant can expand via its own kitchen, POS, and delivery marketplaces
    - Restaurant operators
    - Use existing kitchens or add small-format off-premise capacity
    - Often cheaper to test than outsourcing if the operator already owns demand
