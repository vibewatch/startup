- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Supporting evidence
  - Main threat
  - Severity
  - Why the threat matters
  - Diligence ask
  rows:
  - - Regional operating density in GCC
    - Kitopi public scale and 200+ locations
    - Global entrants or local copycats
    - Medium
    - Density helps execution but does not itself create exclusive demand
    - Ask for city-level market share and occupancy by kitchen / store format
  - - SKOS and operating tooling
    - Tech page plus 2021 SKOS performance claims
    - Feature catch-up by infrastructure peers
    - Medium
    - Software differentiation can compress if rivals replicate workflow tooling
    - Ask for current prep-time, labor-productivity, and order-accuracy deltas versus peers
  - - Owned-brand portfolio
    - Brands page plus newsroom acquisition strategy
    - Brand fatigue and weak repeat purchase
    - High
    - Owned brands create control but require consumer pull and marketing efficiency
    - Ask for same-store sales, repeat rate, and top-brand contribution by market
  - - Franchise expansion
    - Franchise page and 2026 reporting
    - Execution slippage outside core GCC markets
    - High
    - Franchise scale can widen distribution but also adds partner-quality risk
    - Ask for pipeline, unit economics, and target royalty / payback assumptions
  - - Direct relationship via loyalty / meal plans
    - Newsroom and 2026 articles
    - Continued dependence on third-party delivery apps
    - High
    - If first-party demand stays weak, margin remains hostage to platform fees and CAC
    - Ask for first-party mix, loyalty-app MAUs, and blended commission rate
  - - Category tailwind from cloud-kitchen growth
    - Independent market reports
    - Category-wide margin compression and closures
    - High
    - Adverse category evidence shows kitchen centralization alone is not enough
    - Ask for blended contribution margin by order source and by owned versus partner brands
  notes: Severity reflects underwriting relevance, not certainty. The register leans on adverse industry
    evidence because the largest category failure mode has been economics rather than product novelty.
