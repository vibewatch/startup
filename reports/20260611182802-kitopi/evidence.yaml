    whyItMatters: >-
      Peer reporting helps frame what a public company would disclose, but it does not by itself solve the
      private-company economics gap.
    diligencePath: >-
      Build a benchmark pack that standardizes margin, take-rate, and working-capital metrics across public delivery and
      restaurant-platform comps.
    relatedQuestionRefs:
      - QI017
  - type: missing-source
    severity: material
    topic: security-certifications
