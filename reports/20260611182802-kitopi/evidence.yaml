evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, seat allocation, voting rights, and major shareholder percentages.
    whyItMatters: >-
      Control, governance quality, and investor influence are central to late-stage diligence but cannot be inferred
      reliably from funding headlines alone.
    diligencePath: Request current board materials, cap table, and shareholder agreement summary from the company or lead investors.
    relatedQuestionRefs:
      - QO008
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: funding-history
    missingEvidence: >-
      A cap-table-ready financing ledger reconciling the 2021 Series C, 2022 extension, and 2026 growth-capital round by
      instrument and proceeds.
    whyItMatters: >-
      Recommendation, dilution, and valuation analysis all depend on knowing whether public round totals overlap, stack,
      or reflect different instruments.
    diligencePath: >-
      Obtain financing closing documents, investor presentation schedules, and management confirmation of cumulative
      primary capital raised.
    relatedQuestionRefs:
      - QO011
      - QO024
      - QO026
    relatedTableRefs:
      - TO003
      - TO004
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: >-
      A current employee count bridge that explains the difference between official 6,000+ Kitopians and lower
      third-party database estimates.
    whyItMatters: >-
      Headcount is used as a scale proxy, but inconsistent definitions can distort operating-efficiency comparisons and
      benchmarking.
    diligencePath: Request a current employee-count breakdown by frontline versus HQ and by market.
    relatedQuestionRefs:
      - QO005
      - QO015
  - type: missing-source
    severity: minor
    topic: valuation
    missingEvidence: Primary or investor-authenticated post-money valuation support for the 2022 extension and 2026 round.
    whyItMatters: >-
      Third-party valuation datapoints are useful, but investment judgment should not rely on them as if they were
      legally confirmed financing terms.
    diligencePath: Request valuation support directly from management, lead investors, or closing documentation.
    relatedQuestionRefs:
      - QO014
      - QO024
  - type: missing-source
    severity: material
    topic: kitopi-specific-sam
    missingEvidence: >-
      A public or management-backed bridge from broad GCC delivery demand to Kitopi’s actual revenue pool, take-rate,
      and serviceable market.
    whyItMatters: >-
      A recommendation on market upside needs a credible path from category GMV to the narrower pool available to
      outsourced-kitchen and franchise operators.
    diligencePath: >-
      Request market-by-market revenue mix, take-rate logic, owned-brand versus partner-brand split, and franchise
      pipeline assumptions.
    relatedQuestionRefs:
      - QM022
      - QM025
      - QM026
  - type: private-evidence-only
    severity: material
    topic: operator-unit-economics
    missingEvidence: >-
      Kitchen-level contribution margins, order density, delivery radius assumptions, and brand-level retention or
      repeat metrics.
    whyItMatters: >-
      The market is clearly growing, but value accrues selectively; without unit economics it is impossible to know
      whether Kitopi captures attractive share or only participates in topline expansion.
    diligencePath: >-
      Request unit economics by format, kitchen cohort performance, and market-level profitability bridges from
      management.
    relatedQuestionRefs:
      - QM022
      - QM024
      - QM025
  - type: stale
    severity: minor
    topic: gcc-cloud-kitchen-data
    missingEvidence: A current public GCC-specific cloud-kitchen revenue series rather than broad MEA or Saudi-specific reports.
    whyItMatters: >-
      Regional cloud-kitchen estimates are fragmented, which makes GCC-specific benchmarking less precise than
      delivery-demand benchmarking.
    diligencePath: >-
      Look for newer government, trade-association, or investment-bank publications on GCC cloud-kitchen revenue and
      format mix.
    relatedQuestionRefs:
      - QM026
  - type: access-blocked
    severity: minor
    topic: supplementary-public-company-filings
    missingEvidence: >-
      Accessible current Delivery Hero and Deliveroo investor pages that expose more detailed regional filings or
      downloadable annual materials.
    whyItMatters: >-
      Additional primary documents could sharpen market-quality comparisons across public delivery peers without relying
      as heavily on summary pages and press releases.
    diligencePath: Re-pull investor pages through alternate access paths or use archived copies when they become available.
    relatedQuestionRefs:
      - QM013
      - QM014
  - type: private-evidence-only
    severity: material
    topic: franchise-economics
    missingEvidence: Kitopi does not publish franchise fees, royalty rates, capex requirements, or unit payback assumptions.
    whyItMatters: Those numbers determine whether franchising adds durable distribution or merely shifts execution risk to partners.
    diligencePath: Request franchise disclosure materials, example P&Ls, and launch-cost assumptions by concept.
    relatedQuestionRefs:
      - QP024
  - type: private-evidence-only
    severity: material
    topic: partner-unit-economics
    missingEvidence: No public source discloses realized economics for third-party brands or partners using Kitopi’s operating system.
    whyItMatters: >-
      Without realized economics it is impossible to judge whether Kitopi is meaningfully better than internal build or
      rival infrastructure offers.
    diligencePath: Request partner take-rate, launch cost, gross-margin, and order-mix data for a representative cohort.
    relatedQuestionRefs:
      - QP025
  - type: private-evidence-only
    severity: material
    topic: owned-brand-retention
    missingEvidence: >-
      No public source discloses same-store sales, repeat purchase, order frequency, or brand-level retention for
      Kitopi-owned brands.
    whyItMatters: >-
      Owned brands are central to the moat thesis, so missing repeat-use data blocks confidence in customer relationship
      durability.
    diligencePath: Request cohort retention, first-party mix, and same-store sales by top brand and market.
    relatedQuestionRefs:
      - QP026
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-profile-table coverage
    missingEvidence: Long-tail regional operators and white-label kitchen managers are not fully enumerated in the public source set.
    whyItMatters: >-
      The chapter can compare the major archetypes, but it cannot claim exhaustive global coverage of every local
      competitor.
    diligencePath: >-
      Extend the competitor census city by city across GCC and Southeast Asia using local trade sources and operator
      registries.
    relatedQuestionRefs:
      - QP001
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: >-
      No public source discloses cash on hand, monthly burn, runway, or debt covenant headroom after the EvolutionX
      round.
    whyItMatters: >-
      Those are the minimum inputs needed to judge whether the 2026 debt is prudent growth capital or a source of
      refinancing risk.
    diligencePath: Request a lender or board deck with cash, burn, runway, covenants, and maturity schedule.
    relatedQuestionRefs:
      - QI018
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: No public source discloses gross margin, contribution margin, CAC, payback, or average order economics.
    whyItMatters: >-
      Profitability headlines are not enough without the underlying unit-economic bridge for owned brands, partner
      services, and delivery channels.
    diligencePath: Request contribution-margin and CAC/payback waterfalls by channel and by top brand.
    relatedQuestionRefs:
      - QI019
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Revenue mix is not public across owned brands, partner-managed kitchens, dine-in, meal plans, and franchising.
    whyItMatters: The quality and durability of revenue depend on which streams are actually driving the 2024 and 2026 growth story.
    diligencePath: Request revenue and gross-profit bridge by stream, market, and format for 2023-2026.
    relatedQuestionRefs:
      - QI020
  - type: private-evidence-only
    severity: material
    topic: franchise-economics
    missingEvidence: Public franchise materials omit fee schedules, royalty structure, unit capex, and partner payback.
    whyItMatters: >-
      Franchising is a major use of funds and part of the moat thesis, so missing economics block any scale-value
      judgment.
    diligencePath: Request franchise disclosure materials, sample unit economics, and actual pipeline conversion data.
    relatedQuestionRefs:
      - QI012
      - QI020
  - type: missing-source
    severity: minor
    topic: peer-margin-comparables
    missingEvidence: >-
      The reviewed public peer filings show disclosure surfaces but not a normalized, directly comparable margin bridge
