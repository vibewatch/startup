- id: capital-scale
  title: Capital formation, scale disclosures, and unresolved funding arithmetic
  body: 'Funding history is strong enough to establish late-stage status, but not clean enough to support a cap-table-ready narrative without follow-up. MAGNiTT reports a $60 million Series B that framed Kitopi as operating more than 30 kitchens and partnering with more than 100 restaurants. Wamda and MAGNiTT then support the July 2021 Series C at $415 million, led by SoftBank Vision Fund 2, which made Kitopi a regional unicorn and SoftBank’s first UAE-headquartered investment. The next step is where ambiguity begins: Kitopi’s own post says it raised a further $300 million Series C extension, while MAGNiTT says that extension brought the Series C total to $715 million and linked it to an omnichannel pivot. Tracxn adds another external datapoint by listing a May 2022 $300 million Series C at a $1.55 billion post-money valuation and, separately, a January 2026 $50 million round. Wamda’s 2026 coverage is the best current freshness anchor because it explicitly ties the new money to profitability
    and homegrown-brand expansion. Even so, the public record still lacks financing documents, exact instrument detail, and a fully reconciled total-raised figure. That is why current late-stage scale is believable, but public funding arithmetic should still be treated as medium-confidence rather than audit-final.'
