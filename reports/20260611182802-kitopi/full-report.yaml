  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and strategic shift
        blocks:
          - type: paragraph
            body: >-
              Kitopi’s public financial story in 2026 is best understood as a transition away from a pure “kitchen as a
              service” infrastructure business toward a hybrid operator that owns brands, runs dine-in and delivery
              formats, supports meal plans, and now pursues franchising. The 2021 sources still describe a partner-first
              model built around handling food preparation and delivery for restaurant brands, with meal plans and
              grocery already appearing as early diversification. By 2022 management was explicitly talking about
              investing a few hundred million dollars into physical restaurant brands, and by 2026 the company’s
              official and independent surfaces were centered on owned concepts, franchising, loyalty, and customer
              engagement. This matters for revenue quality. In a pure managed-kitchen model, much of the upside accrues
              to partner brands and delivery platforms. In Kitopi’s current structure, more value can theoretically be
              captured inside owned brands and direct relationships. The tradeoff is that the company now bears more
              brand-building, labor, property, and execution risk than a simple infrastructure landlord. Public evidence
              is therefore enough to map the revenue mechanism, but not enough to quantify how much of revenue comes
              from each stream.
