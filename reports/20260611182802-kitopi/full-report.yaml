          detail: Permit or inspection failure disrupts kitchens or brands.
        - id: n2
          label: Platform squeeze
          detail: Commissions, ranking, or consolidation compress order margins.
        - id: n3
          label: Quality inconsistency
          detail: Service or food variance reduces ratings and repeats.
        - id: n4
          label: Revenue volatility
          detail: Orders, AOV, or mix deteriorate.
        - id: n5
          label: Margin compression
          detail: Contribution and EBITDA suffer.
        - id: n6
          label: Capital / valuation pressure
          detail: New money becomes more selective or expensive.
      edges:
        - from: n1
          to: n4
          label: store disruption
        - from: n2
          to: n5
          label: take-rate pressure
        - from: n3
          to: n4
          label: repeat loss
        - from: n4
          to: n5
          label: operating deleverage
        - from: n5
          to: n6
          label: multiple reset
        - from: n2
          to: n6
          label: dependency signal
    approximationNotes: >-
      This is a causal map, not a forecast. It shows how seemingly local operating failures can become financing or
      valuation problems.
    claimRefs:
      - CR004
      - CR014
      - CR016
      - CR020
      - CR027
      - CR028
      - CR041
  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: Critical dependencies sit outside Kitopi’s direct control, especially around platforms, regulators, and capital.
    data:
      nodes:
        - id: d1
          label: Talabat / Delivery Hero
          detail: Largest MENA marketplace exposure.
        - id: d2
          label: Deliveroo / DoorDash
          detail: Premium UAE / Kuwait demand and a more consolidated platform stack.
        - id: d3
          label: Careem / Uber
          detail: Campaigns and super-app reach.
        - id: d4
          label: Dubai / GCC regulators
          detail: Licensing and inspections.
        - id: d5
          label: Growth lenders / investors
          detail: Expansion capital and refinancing flexibility.
        - id: d6
          label: Kitopi brands and kitchens
          detail: Operating core where all dependencies meet.
      edges:
        - from: d1
          to: d6
          label: order flow
        - from: d2
          to: d6
          label: premium demand
        - from: d3
          to: d6
          label: promotion reach
        - from: d4
          to: d6
          label: permission to operate
        - from: d5
          to: d6
          label: capital runway
    approximationNotes: >-
      Dependencies are limited to parties that can materially change Kitopi’s economics or ability to open and operate
      sites.
    claimRefs:
      - CR010
      - CR013
      - CR016
      - CR029
      - CR040
      - CR042
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: Business quality is improving, but valuation support lags evidence support.
    data:
      nodes:
        - id: v1
          label: Scale + profitability signal
          detail: 200+ outlets, 2024 revenue disclosure, profitability milestone.
        - id: v2
          label: Owned-brand / franchise upside
          detail: Potentially better revenue quality than pure marketplace exposure.
        - id: v3
          label: Disclosure gap
          detail: No public channel mix, margin bridge, or cap-table clarity.
        - id: v4
          label: Public-comp reality
          detail: Most relevant public multiples sit far below Kitopi’s implied mark.
        - id: v5
          label: research-more
          detail: Interesting business, poor entry discipline at current visible price.
      edges:
        - from: v1
          to: v2
          label: supports upside
        - from: v2
          to: v5
          label: not enough alone
        - from: v3
          to: v5
          label: limits confidence
        - from: v4
          to: v5
          label: forces discipline
    approximationNotes: The flow is qualitative and intended for IC logic rather than precise weighting.
    claimRefs:
      - CV004
      - CV009
      - CV042
      - CV044
      - CV045
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: Small changes in justified revenue multiple create large swings versus the current private mark.
    data:
      items:
        - label: 3.0x revenue
          value: 497.1
          detail: $M valuation using 2024 revenue
        - label: 4.5x revenue
          value: 745.7
          detail: $M valuation using 2024 revenue
        - label: 6.0x revenue
          value: 994.2
          detail: $M valuation using 2024 revenue
        - label: 7.5x revenue
          value: 1242.8
          detail: $M valuation using 2024 revenue
        - label: 9.1x current-implied
          value: 1507.9
          detail: $M valuation using rounded current mark
    approximationNotes: Values simply apply alternative revenue multiples to the disclosed $165.7 million 2024 revenue figure.
    claimRefs:
      - CV002
      - CV009
      - CV010
      - CV042
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: Current pricing leaves narrow room for error in the base case and meaningful downside in the bear case.
    data:
      items:
        - label: Bear valuation ($M)
          low: 414
          mid: 497.1
          high: 579.9
        - label: Base valuation ($M)
          low: 745.7
          mid: 828.5
          high: 911.4
        - label: Bull valuation ($M)
          low: 1077.1
          mid: 1160
          high: 1325.6
        - label: Current implied mark ($M)
          low: 1500
          mid: 1525
          high: 1550
    approximationNotes: >-
      Ranges represent revenue-multiple scenarios rather than DCF outputs. They show valuation compression risk relative
      to the current private mark.
    claimRefs:
      - CV009
      - CV010
      - CV045
      - CV046
      - CV047
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: IC-ready scorecard separating business quality from price discipline.
    data:
      items:
        - label: Business quality
          value: 7/10
          detail: Scale and profitability signal are real but still thinly disclosed.
        - label: Market position
          value: 7/10
          detail: Clear GCC relevance, but platforms own much of the consumer relationship.
        - label: Evidence quality
          value: 5/10
          detail: Private-company disclosure remains materially incomplete.
        - label: Valuation support
          value: 3/10
          detail: Public comps do not support a 9x-plus revenue multiple today.
        - label: Overall recommendation
          value: research-more
          detail: Interesting asset; insufficient price support.
    claimRefs:
      - CV004
      - CV038
      - CV042
      - CV044
