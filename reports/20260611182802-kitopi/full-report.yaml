      - number: '3.3'
        title: Switching costs, distribution, and pricing posture
        blocks:
          - type: paragraph
            body: >-
              The commercial packaging evidence is notable mostly for what it omits. CloudKitchens routes prospects to a
              quote flow rather than a public rate card. Deliveroo Editions says it will propose a package aligned to
              growth targets, again without list pricing. Kitchen United markets “capital-light” off-premise reach, but
              not standardized economics. Kitopi’s franchise page likewise emphasizes qualification, training, launch
              support, and operational playbooks rather than upfront fees or unit-economics disclosures. That means
              switching-cost analysis has to focus on workflow and distribution, not sticker price. Infrastructure-only
              players remain relatively easy to multi-home around if operators own the menu, brand, and customer list.
              The models become stickier when they own the brand portfolio, the consumer app, or the data layer. On that
              measure Kitopi has become more defensible than it was in 2021: owned brands, meal plans, and loyalty
              ambitions reduce dependence on third-party restaurant partners, even if they do not eliminate dependence
              on delivery demand and regional execution.
