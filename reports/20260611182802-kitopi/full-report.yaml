      - number: '2.4'
        title: >-
          Growth drivers and constraints: the category is expanding, but trust, quality, and economics still cap the
          easy upside
        blocks:
          - type: paragraph
            body: >-
              The structural demand drivers are straightforward. MarkNtel points to smartphone ownership, internet
              penetration, expatriate-heavy labor markets, rising female workforce participation, and convenience
              behavior as core growth drivers in the GCC. UAE macro data and food-service data support the same
              direction: a resilient non-oil economy, tourism support, and large food-service and food-e-commerce
              channels make the region fertile for delivery-enabled formats. Public-market delivery platforms also show
              that orders, GMV, and monetization tools continue to scale, with DoorDash highlighting DashPass, grocery
              and retail expansion, reservations, and advertising, and Delivery Hero highlighting multi-vertical
              customer spending that is 5.2 times higher than food-only customers. But the friction is real. GCC market
              research points to food-safety breaches, long-distance temperature degradation, and halal-assurance
              concerns as trust constraints. Business of Apps adds a more financial warning: delivery and service costs
              are higher than they were half a decade ago. Mature-market disclosures reinforce that economics are uneven
              rather than universally solved. Just Eat Takeaway still lost money from continuing operations in H1 2025
              despite better monetization and EBITDA. The result is a market with strong topline logic but still
              selective value capture: the winners are likely to be operators that pair brand leverage with disciplined
              kitchen and channel economics, not every participant exposed to delivery demand.
