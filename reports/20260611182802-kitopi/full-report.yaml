            body: >-
              The public architecture story is unusually detailed for a private food-tech company. Kitopi says it runs
              about 40 applications in a microservice architecture, around 20 frontend apps, and more than 50
              components. The same page names cross-functional squads, domain-driven design, event storming, hexagonal
