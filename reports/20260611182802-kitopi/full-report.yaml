      - number: '7.2'
        title: Operational consistency and people complexity are the core self-inflicted risks
        blocks:
          - type: paragraph
            body: >-
              The core internal risk is not whether Kitopi can open locations; it is whether it can keep quality,
              service, and unit economics consistent while simultaneously scaling brands, formats, and franchises.
              Kitopi’s own materials are revealing here. Its customer-experience team talks openly about complaint root
              causes, technology fixes, culinary interventions, and process reengineering. That is encouraging as a
              mitigation signal, but it also confirms that quality failure is a recurring operating reality, not a
              hypothetical. The company’s hiring surface points to the same conclusion from a different angle: finance,
              legal, property, supply chain, operations, strategy, customer experience, and product-tech all need to
              work in concert across a 200+ outlet footprint. A founder-led executive bench can work at this scale, but
              only if decision rights, quality-control loops, and market-level accountability are more mature than the
              public record can currently prove. The same goes for labor. Formal UAE labor reform is real, yet Human
              Rights Watch still sees migrant-worker and heat-risk concerns as material, which keeps labor governance
              inside the diligence perimeter rather than outside it. The burden rises further because Kitopi is not
              standardizing one concept. It is coordinating many concepts, cuisines, service levels, and customer
              promises at once. That makes middle-management depth, escalation speed, and brand-level accountability
              just as important as kitchen technology itself.
