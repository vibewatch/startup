  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: Kitopi is closer to digital food infrastructure than to total restaurant spend'
        blocks:
          - type: paragraph
            body: >-
              The first analytic mistake to avoid is equating Kitopi with the whole restaurant market or even with the
              whole online food-delivery market. Kitopi’s own smart-kitchen, franchise, and brand pages show that the
              company now sits across several layers: outsourced kitchen operations for brands, operation of owned or
              acquired brands, franchise support, and omnichannel F&B formats. That means the right market boundary is
              not ‘all meals sold’ or even ‘all app-based delivery GMV.’ It is the narrower intersection of
              delivery-enabled food infrastructure, cloud kitchens, multi-brand restaurant operations, and brand
              expansion services. Third-party market definitions support that narrower framing. TBRC defines cloud
              kitchens as delivery-only commercial kitchens serving takeout and delivery without dining space, while
              MarkNtel’s MEA report separates independent, commissary or multi-brand, kitchen-pod, and
              outsourced-kitchen models. Kitopi maps most closely to the outsourced or multi-brand operational layer
              rather than the full consumer wallet. The distinction matters because platform GMV can be huge while the
              revenue pool available to kitchen operators is much smaller. Kitopi’s current brand portfolio and
              franchise pitch widen its addressable opportunity beyond pure third-party enablement, but they still do
              not justify treating total online food-delivery GMV as the company’s immediate SAM.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM032
              - CM039
