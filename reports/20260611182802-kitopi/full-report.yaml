  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and company position
        blocks:
          - type: paragraph
            body: >-
              Kitopi no longer fits neatly into the narrow “managed cloud kitchen for third-party brands” box that
              defined the category at its 2020-2021 peak. Its current public surfaces emphasize a broad F&B ecosystem
              that spans delivery, dine-in, meal plans, owned brands, franchising, and a sizable technology stack, while
              the independent source set still places it alongside classic managed-kitchen and ghost-kitchen peers. That
              makes the right landscape wider than a simple list of GCC delivery operators. The closest direct
              infrastructure peers remain CloudKitchens, Kitchen United, Deliveroo Editions, and REEF, because all sell
              some combination of kitchen capacity, expansion tooling, or demand-linked fulfillment to restaurant
              operators. But Rebel Foods and Wonder matter too because they demonstrate adjacent models that capture
              more of the consumer relationship through owned brands, multi-brand ordering, and direct app traffic. The
              practical takeaway is that Kitopi competes across three layers at once: kitchen infrastructure, operating
              system and workflow tooling, and brand ownership / consumer reach.
