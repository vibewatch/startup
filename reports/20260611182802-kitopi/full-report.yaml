  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Kitopi’s operating progress is real, but the current mark still looks rich
        blocks:
          - type: paragraph
            body: >-
              The strongest part of Kitopi’s valuation case is that it no longer looks like a pure speculative
              ghost-kitchen story. The company has reported a profitability milestone, disclosed 2024 revenue of $165.7
              million through third-party coverage, and appears to be pivoting toward owned brands, loyalty, and
              franchising rather than just rented demand. That is a meaningful improvement in business quality. The
              valuation problem is that the available price anchors still point back to the 2021-2022 unicorn era.
              Tracxn’s $1.55 billion 2022 post-money mark, or even the user’s rounded $1.5 billion framing, translates
              into roughly 9.1x to 9.4x 2024 revenue. The 2026 $50 million round does not look like a decisive reprice
              upward; it looks more like continued support after an operating milestone. Public evidence therefore
              supports a business that may deserve some premium to weak delivery marketplaces, but not a premium so
              large that entry discipline becomes optional. That is why the right default posture is caution rather than
              enthusiasm. The current mark is not absurd because the company is fake; it looks demanding because the
              evidence set is still incomplete. Investors are being asked to pay for a cleaner future mix before the
              mechanics of that mix are visible in public numbers.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV009
