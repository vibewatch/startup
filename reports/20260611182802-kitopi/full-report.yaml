            title: Marketplace concentration is the fastest way for good kitchen execution to become bad equity economics
            body: >-
              Kitopi can improve food operations and still lose bargaining power if order discovery, promotions, and
              ranking remain concentrated with Talabat, Deliveroo, and Careem-linked ecosystems.
            calloutType: risk
