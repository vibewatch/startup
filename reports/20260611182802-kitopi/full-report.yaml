chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, model, and present-day footprint
        blocks:
          - type: paragraph
            body: >-
              Kitopi’s public materials give a coherent top-line identity: it was founded in Dubai in 2018, named for
              ‘Kitchen Utopia,’ and built as a managed cloud-kitchen or restaurant-as-a-service platform for food brands
              that wanted delivery reach without full restaurant capex. The most reusable fact for later chapters is not
              just that Kitopi runs kitchens, but that it has long positioned itself as an operating layer: it manages
              supply chain, kitchen operations, delivery coordination, and customer experience while restaurant or brand
              owners focus on menu and brand. The proprietary SKOS stack is central to that story, because the company
              repeatedly says it optimizes kitchen operations in real time and can onboard partners in as little as 14
              days. Official 2026-facing pages now push a broader identity than earlier cloud-kitchen coverage did.
              Kitopi says it operates over 200 outlets across the UAE, Saudi Arabia, Bahrain, Qatar, and Kuwait, and its
              current brands page shows a portfolio spanning delivery-first, meal-plan, and dine-in concepts. That means
              the canonical company-overview frame is no longer ‘single-product cloud kitchen startup.’ It is a GCC
              food-tech operator that still relies on cloud-kitchen infrastructure but increasingly monetizes through
              owned brands, franchising, and omnichannel restaurant formats.
