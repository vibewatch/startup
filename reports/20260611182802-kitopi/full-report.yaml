            body: >-
              Kitopis customer map is broader than a classic ghost-kitchen story. The current official portfolio shows
              owned brands spanning family dining, healthy meal plans, cafes, burgers, sushi, desserts, and
              delivery-first concepts. That matters because the company now serves both enterprise-style restaurant
              partners and direct diners under its own labels. Right Bite is the clearest example of a structured
              recurring-consumer product: it frames the buyer around nutrition goals, uses dietitian-crafted
              subscriptions, and stretches into on-demand orders. Eatopi is different again, acting as a rotating
              chef-and-brand showcase where Kitopi curates traffic and demand around local culinary creators. The
              consumer app then ties multiple brands together with cashback and cross-brand ordering, making the diner
              relationship itself a product surface. Taken together, the pack supports a hybrid customer architecture:
              direct consumers, owned-brand diners, and restaurant partners all sit inside the same demand engine. That
              breadth is a strength, but it also means investor questions have to separate who pays Kitopi, who uses the
              service, and which brands actually carry the growth burden.
