      - number: '1.2'
        title: Leadership bench and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Leadership visibility is fairly good at the executive level and notably weaker at the board or ownership
              level. The public leadership page identifies Mohamad Ballout as CEO and co-founder, Saman Darkan as CTO,
              Bader Ataya as Chief Growth Officer, Sami Bejjani as CFO, Jihad Bou Nasr as Chief People and
              Transformation Officer, and Mohamad Sami Ballout as COO. Kitopi also disclosed a Saudi operating change in
              2023 when it appointed Wentzel David de Wet as Managing Director for KSA, which suggests increasing
              country-level management specialization as the business matured. What remains missing is the governance
              layer beneath the headlines. Investor and funding coverage clearly names SoftBank Vision Fund 2, Chimera,
              DisruptAD, B. Riley, Dogus Group, Next Play Capital, Nordstar, and, later, EvolutionX, but there is no
              clean public board roster, seat allocation, ownership breakdown, or current control map in the retained
              sources. The same problem appears in compensation and employee-ownership visibility: Kitopi disclosed a
              2022 ESOP buyback and said 60% of head-office employees held ESOPs, but there is no public dilution
              impact, pool size, or current option-overhang detail. For diligence, the takeaway is that executive
              identification is usable, while governance and control still require primary documents or direct
              management access.
