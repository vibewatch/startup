      - number: '3.4'
        title: Moat durability and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              Adverse evidence matters because the category’s weakest point has been economics, not awareness. Forbes
              argues that ghost kitchens face structurally high acquisition costs, low loyalty, and 15% to 30% delivery
              fees, while Restaurant Business shows how REEF’s pandemic-era surge ran into profitability, regulatory,
              and closure problems. Those signals matter for Kitopi because they suggest that centralized kitchens alone
              are not a moat. The more durable advantage is owning demand or owning enough of the customer journey that
              a company can protect margin and repeat use. Kitopi’s strategic shift toward owned brands, franchising,
              and first-party engagement moves it in the right direction, but it also changes the risk profile: the
              company must now prove brand attraction, brand retention, and franchising discipline, not just kitchen
              throughput. In other words, Kitopi looks stronger than pure infrastructure peers on control of the value
              chain, but it is still exposed to the same category-wide margin and execution pressure that has already
              broken weaker ghost-kitchen operators.
