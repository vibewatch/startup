  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and platform concentration risks lead the stack
        blocks:
          - type: paragraph
            body: >-
              Kitopi’s biggest external risks are the ones it cannot simply solve with more kitchens or more brands. The
              first is regulatory: food-safety compliance in the GCC is not a single licence but a layered operating
              discipline that combines federal rules, municipal permits, inspections, and market-specific updates.
              Kayrouz’s 2026 legal review is useful precisely because it translates what operators feel on the ground:
              in the UAE, a valid commercial licence still is not enough to handle food without municipal approvals,
              while Dubai and Abu Dhabi already run active inspection programs at large scale. Saudi Arabia adds a
              second layer of uncertainty because the SFDA regulations surface kept updating in 2026. The second
              external risk is platform concentration. Talabat, Deliveroo, Careem, and the Delivery Hero stack control
              demand discovery and take rates across the GCC. That means Kitopi’s operating leverage can improve while
              its bargaining leverage still weakens if distribution remains marketplace-led. DoorDash’s takeover of
              Deliveroo only sharpens the point: fewer scaled counterparties now sit between brands and customers.
              Investors should therefore ask for a live permit inventory, inspection cadence, and partner commercial
              schedules rather than relying on headline growth metrics. If those operating controls are weaker than the
              current narrative suggests, the downside would show up first in contribution margin and only later in
              growth headlines.
