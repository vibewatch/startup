        title: Financial, reputational, and exit risks all worsen if the category rerates downward
        blocks:
          - type: paragraph
            body: >-
              Kitopi’s 2026 profitability milestone helps, but it does not eliminate capital-intensity or exit risk. The
              company has already raised unicorn-scale capital, and Tracxn’s $852 million cumulative tally means future
              rounds will be judged against a very high expectation set. Yet the fresh round in 2026 was only $50
              million, far below the 2021 and 2022 checks that defined the earlier expansion phase. That pattern is
              consistent with a sector that is maturing into harder underwriting rather than easier optimism. Forbes’
              2026 ghost-kitchen critique and Sensor Tower’s evidence of reset demand in parts of Europe both matter
              because they show the wider category is no longer receiving blanket growth credit. Reputational issues can
              amplify that financial sensitivity. Boycott narratives do not need to be fair to be damaging if they feed
              a story that Kitopi displaces local operators or concentrates too much market power. In that environment,
              the main investor question is not whether Kitopi can keep growing. It is whether it can do so while
              lowering dependence on aggregators, preserving quality, and proving that a future exit deserves a premium
              multiple rather than a category discount. In practical terms, that means valuation should be treated as
              the output of risk governance rather than as an independent story. If compliance, partner concentration,
              or quality-control data disappoints in diligence, the multiple should compress before anyone debates
              long-term TAM.
            claimRefs:
              - CR003
              - CR016
              - CR018
