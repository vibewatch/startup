      - number: '3.2'
        title: Peer models and capabilities
        blocks:
          - type: paragraph
            body: >-
              Public competitor surfaces show that Kitopi’s peers are solving different parts of the same
              delivery-fulfillment problem. CloudKitchens and Kitchen United lead with capital-light infrastructure for
              restaurant operators that want faster expansion without building full brick-and-mortar sites. Deliveroo
              Editions combines kitchen capacity with embedded marketplace demand and measured delivery improvements,
              making it attractive when the buyer values immediate order density. REEF leans harder into software,
              direct ordering, and delivery-platform integrations, while Rebel Foods has moved furthest toward the
              owned-brand, operating-system model at global scale. Wonder, meanwhile, is less a managed-kitchen
              outsourcer than a consumer-facing, multi-restaurant destination. Relative to that set, Kitopi’s
              differentiator is not the raw novelty of cloud kitchens anymore; it is the combination of GCC operating
              density, owned and acquired brands, franchise ambition, and a vertically integrated stack that extends
              from kitchen orchestration to customer-facing channels.
