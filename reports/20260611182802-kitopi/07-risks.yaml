- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Aggregator squeeze
    - Commission or ad-package step-up
    - Blended channel cost rises above 30% without offsetting AOV gains
    - Pause aggressive new-brand rollouts on aggregator-led demand assumptions
  - - Quality-control slippage
    - Customer-rating deterioration or repeat complaints
    - Sustained rating drop across multiple brands or kitchens for two quarters
    - Require operational audit before underwriting further expansion
  - - Regulatory incident
    - Inspection failure, closure, or formal notice
    - Any repeated closure, recall, or labour enforcement action in a core market
    - Escalate to thesis-break review and reassess governance
  - - Valuation / exit reset
    - New financing at flat-or-down economics with tighter terms
    - Next round implies weaker pricing or materially more restrictive structure
    - Reset return expectations and shift stance from growth underwriting to downside protection
  notes: Kill criteria are intentionally monitorable rather than theoretical. Each is something management should already track internally if risk governance is mature.
