- calloutType: insight
  title: Regulatory complexity is multiplicative, not additive
  body: A multi-country cloud-kitchen operator does not face one compliance regime repeated five times. It faces different food, labor, and licensing interfaces in each market, with shared reputational consequences if any one of them fails.
