- id: reliability-observability-and-trust
  title: Reliability, observability, and trust controls
  body: 'Kitopis most concrete trust evidence is operational rather than certification-based. The SRE post describes Dynatrace management zones, team ownership, alerting into Slack, anomaly detection, and SLOs for critical endpoints. The mobile observability piece goes one level lower by describing the metrics Kitopi cares about on the app side and by giving a case study where a payment dashboard reportedly cut cancellation rates from the low teens to the mid-single digits. That is a meaningful product-operations loop because it shows the team measuring a commercial pain point, not just infrastructure uptime. The Cognito article adds another useful trust signal: Kitopi is willing to document an OAuth2 client-credentials pattern with API Gateway, Cognito, and Terraform, which indicates the platform has genuine integration work and not just basic consumer ordering flows. Still, the trust package is incomplete. The same public surface that is rich on engineering process is thin on formal disclosure.
    The reviewed pack did not expose public uptime pages, third-party security certifications, or investor-grade data-governance detail beyond app-store tracking disclosures. That leaves a gap between credible operations maturity and fully diligenced enterprise trust.'
