- id: architecture-and-operating-workflow
  title: Architecture and operating workflow
  body: The public architecture story is unusually detailed for a private food-tech company. Kitopi says it runs about 40 applications in a microservice architecture, around 20 frontend apps, and more than 50 components. The same page names cross-functional squads, domain-driven design, event storming, hexagonal architecture, continuous integration and deployment, and infrastructure as code. Those are not proof of world-class software by themselves, but together they do imply a real internal platform discipline. The robotics material deepens the operating picture. The sorter project is not framed as standalone warehouse theater; it is tied back into SKOS through a Kitchen Unit Control layer, QR-based item identification, KDS work, and process redesign intended to cut manual sorting and reduce pack time. NxTides case study points in the same direction from the outside, describing Kitopi as kitchen-as-a-service supported by software, a nearshore product team, and a delivery-speed objective.
    The practical conclusion is that Kitopis differentiation lies in orchestration across order capture, kitchen execution, and dispatch support rather than in any one app or robot alone.
