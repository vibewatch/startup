- id: TU006
  title: Customer-proof quality table
  columns:
  - Evidence surface
  - What it proves
  - What it does not prove
  - Current read
  - Gap
  rows:
  - - Brand pages
    - Current brand existence and positioning
    - Volume, profitability, or retention
    - Useful starting point
    - Need transactional metrics
  - - App-store listings
    - Live product, geography, and review signals
    - Unit economics or sustained engagement depth
    - Strong direct-consumer proof
    - Need MAU, frequency, and churn
  - - Experience-management posts
    - Internal focus on quality and remediation
    - Customer durability or independent service benchmarks
    - Helpful operating-process evidence
    - Need audited CX outcomes
  - - Testimonials and partner profiles
    - External brand relationships and customer value proposition
    - How many active partners remain current
    - Good corroboration for go-to-market fit
    - Need live customer roster
  - - Acquisition coverage
    - Immediate expansion of customer footprint through owned brands
    - Post-integration growth and concentration
    - Strong scale proof
    - Need brand-level performance post-close
  notes: This extra table separates proof quality from raw customer count so the chapter does not overclaim from logos and app listings alone.
