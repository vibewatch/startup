  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, churn, renewal, contract length, and cohort behavior for both partner brands and direct consumers.
    whyItMatters: Without retention accounting, the customer story shows reach but not durability.
    diligencePath: Request cohort tables for owned brands, partner brands, and app users; include renewal terms and churn by market.
    relatedQuestionRefs:
    - QU021
    - QU024
  - type: private-evidence-only
    severity: material
    topic: concentration-mix
    missingEvidence: Revenue and order mix by top brands, owned-vs-partner channels, and aggregator-vs-direct demand.
    whyItMatters: Customer concentration could be high even if the public portfolio looks broad.
    diligencePath: Request monthly revenue/order mix by top 10 brands, top 10 partners, and channel, with margin contribution.
    relatedQuestionRefs:
    - QU019
    - QU022
    - QU024
  - type: missing-source
    severity: material
    topic: production-vs-logo-proof
    missingEvidence: Brand-by-brand production status, market-level deployment counts, and proof that named references are still active at scale.
    whyItMatters: Logo presence does not equal durable production demand or current customer health.
    diligencePath: Request live brand roster with market status, launch date, closure date if any, and current order run rate.
    relatedQuestionRefs:
    - QU023
    - QU025
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: minor
    topic: app-support-quality
    missingEvidence: Version-level crash rates, cashback dispute rate, support-response times, and service-availability gaps by city.
    whyItMatters: Negative app friction could impair the direct-customer flywheel even if brand demand stays healthy.
    diligencePath: Request app quality dashboard, support SLA compliance, and cashback-expiry complaint trend by version.
    relatedQuestionRefs:
    - QU018
    - QU020
