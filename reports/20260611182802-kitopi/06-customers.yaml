- id: named-proof-and-adoption-surfaces
  title: Named proof and adoption surfaces
  body: The chapters best adoption evidence comes from named brands and live surfaces rather than from a clean published customer count. Right Bite and Eatopi prove that Kitopi can operate differentiated customer propositions inside its own brand family, while the 2026 delivery guide shows brands like Operation Falafel, Hot Bun, Sushido, and Ichiban positioned for distinct demand pools and geographies. External proof still matters because it shows Kitopi is not only growing its own labels. Endeavor, FeaturedCustomers, Startup Info, and UAE Startup Story all describe restaurant partners using Kitopi to expand without opening new storefronts, and Endeavor explicitly names well-known restaurant brands. The AWJ acquisition materially deepened that proof by adding more than 10 brands, 32-plus outlets, and Operation Falafels large consumer footprint. App-store surfaces add another layer of real-world adoption because they show a current rewards product with city coverage, version history, ratings,
    and mixed reviews. The strongest read is therefore not one single number; it is the density of named brands, channels, and consumer touchpoints that point to a live, multi-surface customer engine.
