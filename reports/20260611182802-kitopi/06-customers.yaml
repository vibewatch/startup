- id: retention-and-experience-quality
  title: Retention and experience quality
  body: 'Public evidence on customer durability is strongest where Kitopi discusses how it manages service quality, and weakest where the market would usually expect formal retention metrics. The customer-experience post is useful because it makes the operating loop explicit: brand-level and kitchen-level dashboards, investigations for every low-rated order, QR scanning to reduce missing items, and command-center visibility into drivers and kitchen capacity. The loyalty essay fills in the behavioral side of the story, arguing that repeat business in Dubai depends on consistency, personalization, advocacy, and a frictionless return path rather than points alone. The app-store evidence is directionally positive but mixed. Apple shows a respectable 4.5 rating on the sampled iPhone listing, while MWM reports strong enthusiasm for convenience and cashback alongside sharp complaints around disappearing credits, app stability, and regional coverage. That leaves the underwriting view balanced: Kitopi
    clearly treats customer experience as an operational discipline, but outside investors still cannot verify whether those efforts translate into churn, NRR, or renewal outcomes across the consumer app, owned brands, or external restaurant accounts.'
