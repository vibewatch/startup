  rows:
  - - Owned delivery and dine-in brands
    - Kitopi owns the brand economics; diners are end users
    - Drive direct consumer demand across cuisine concepts
    - Higher control of brand, pricing, and data
    - Public revenue mix by brand is undisclosed
  - - Meal-plan subscribers
    - Consumers pay recurring or pre-committed plan fees; Right Bite delivers the service
    - Recurring healthy-meal program across UAE and KSA
    - Closest public proxy to a subscription base
    - No churn, retention, or subscriber count disclosed
  - - Consumer-app diners
    - Diners use Kitopi for cashback, mix-and-match ordering, pickup, or dine-in rewards
    - Cross-brand loyalty and order aggregation
    - Builds direct customer relationship across multiple brands
    - MAU, order frequency, and CAC are not public
  - - External restaurant partners
    - Restaurant brands pay Kitopi to operate kitchen and fulfilment workflows
    - Enter new markets without new storefronts
    - Maintains B2B relevance and supply-side inventory
    - Named active partner roster is incomplete in current public pack
  - - Acquired brand groups
    - Kitopi acquires brands such as AWJ and scales them across its network
    - Add mature concepts and customer footprints quickly
    - Accelerates owned-brand expansion
    - Acquisition economics and post-deal performance are private
  notes: Segmentation distinguishes direct consumer demand from restaurant-partner demand because Kitopis current model spans both.
