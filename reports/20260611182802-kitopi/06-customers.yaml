- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration or friction risk
  - Impact
  - Diligence path
  rows:
  - - Saudi-focused expansion and M&A
    - Public evidence does not show what share of growth depends on a few acquired brands
    - A small set of concepts could dominate volume and weaken resilience
    - Request revenue and order mix by country, brand, and channel
  - - Loyalty app scale-up
    - Cashback disputes or app instability could slow direct-customer adoption
    - Weakens the owned-demand thesis and raises support costs
    - Request refund, expiry, and complaint-rate data by app version
  - - Heavy delivery-channel dependence
    - Roughly 80% delivery-sales mix implies dependence on aggregator and dispatch economics
    - Margin and customer access could be vulnerable to platform power
    - Request channel-margin bridge and direct-vs-aggregator order mix
  - - External restaurant-partner pipeline
    - Public named partner roster is incomplete and dated
    - Hard to judge whether B2B customer proof is growing or shrinking
    - Request current active partner list, contract length, and retention by cohort
  - - Owned-brand expansion after acquisitions
    - Post-acquisition performance is not disclosed brand by brand
    - Capital allocation quality cannot be judged from public materials
    - Request post-M&A growth, same-store sales, and closure data by acquired brand
  notes: Risks focus on concentration and durability because public customer breadth is easier to see than revenue diversification.
