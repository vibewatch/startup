- id: public-comps-and-scenario-range
  title: Public comps still argue for a materially lower multiple band than Kitopi implies
  body: The comparable set is imperfect, but imperfect does not mean useless. Restaurant-software names like Toast and Olo have cleaner recurring-software characteristics and, in Toast’s case, stronger disclosure and clear profitability. Delivery marketplaces like DoorDash, Uber, Deliveroo, and Just Eat Takeaway are not operating matches, but they are the public market’s closest live readthrough for food-ordering and logistics ecosystems. Across that set, observed revenue multiples cluster far below Kitopi’s implied 9x-plus level. DoorDash is the strongest large-cap comp in the set and still screens around the mid-4x range. Uber sits lower. Deliveroo and Just Eat sit much lower, in part because the public market has punished weaker delivery economics and in part because consolidation has closed the book on some standalone players altogether. Olo’s last known multiple is the most supportive software-like datapoint, but even that is not enough on its own to defend Kitopi’s implied price. The
    scenario table therefore has to center on multiple compression risk, not just revenue growth hope. Even the higher-quality comps in the set win better treatment from public investors because they disclose what drives retention, margins, and cash flow. Kitopi may deserve some strategic adjustment upward from the weakest names in the group, but the burden of proof still sits with the premium claimant, not with skeptical underwriting.
  claimRefs:
