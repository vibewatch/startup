- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Owned brands exceed 50% of revenue, loyalty meaningfully reduces aggregator reliance, and franchising scales internationally.
    - 7.0x revenue on a larger, cleaner revenue base could approach or modestly exceed current valuation over time.
    - Execution slippage, quality issues, and still-thin disclosure
    - Possible but needs evidence not yet public
  - - Base
    - Kitopi grows, stays profitable, and earns a premium to weak delivery comps but not a unicorn-era premium.
    - 4.5x to 5.5x revenue implies material downside versus a 9x-plus entry multiple unless revenue grows rapidly.
    - Aggregator squeeze, limited direct-order share, and muted exit market
    - Most evidence points here
  - - Bear
    - Aggregator economics stay heavy, growth slows, and next financing or exit prices off lower-single-digit comps.
    - 2.5x to 3.5x revenue would imply a deep reset from current private marks.
    - Category rerating, cap-table friction, and disclosure shock
    - Cannot be dismissed
  notes: Scenario ranges are valuation-discipline heuristics, not formal DCF outputs. They intentionally anchor on observed market multiples rather than invented operating forecasts.
