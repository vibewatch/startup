- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - Kitopi has real scale, a profitability signal, and strategic upside from owned brands plus franchising.
    - Verified channel mix showing first-party demand and materially higher owned-brand gross profit could justify a higher multiple.
  - - The implied 9x-plus revenue multiple already prices in execution that public evidence cannot yet prove.
    - A priced round above 2022 valuation with transparent terms and audited unit-economics would improve confidence.
  - - Public comps show the market rewards profitable scale, but usually at lower multiples than Kitopi currently implies.
    - If a more relevant hybrid private peer clears materially above 7x revenue with similar disclosure, the relative-premium objection weakens.
  notes: The anti-thesis is not that Kitopi lacks a business; it is that the current price appears to outrun the visible evidence base.
