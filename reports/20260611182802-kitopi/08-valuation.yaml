- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Next financing is flat or down with tighter structure
    - New money below or merely equal to prior valuation plus heavy preferences or debt-like protections
    - Undercuts the idea that improving business quality is creating valuation support
    - Re-rate to avoid unless downside is explicitly priced
  - - Owned-brand and first-party demand remain subscale
    - No evidence that direct demand is reducing marketplace dependence
    - Breaks the premium-over-delivery-comp argument
    - Move to low-single-digit revenue-multiple framework
  - - Quality or compliance incident hits a major market
    - Closure, recall, or sustained rating deterioration in a core GCC market
    - Hits revenue durability and raises discount-rate assumptions
    - Pause investment or require steep valuation concession
  - - Exit market stays shut for delivery-linked names
    - No credible IPO or strategic-sale comparables clear at premium multiples
    - Keeps duration longer and terminal multiple lower
    - Treat current valuation as too early / too rich
  notes: These triggers focus on evidence that would invalidate the premium thesis rather than simply slowing growth.
  claimRefs:
  - CV033
  - CV040
  - CV041
  - CV042
  - CV047
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Channel mix
    - Revenue or GMV split by Talabat, Deliveroo, Careem, first-party app, dine-in, and franchise
    - Determines whether Kitopi is escaping aggregator economics or still renting demand
    - CFO / growth team data room
  - - Brand economics
    - Contribution margin, repeat rate, and CAC by owned brand cohort
    - Bull case depends on owned brands being economically better than partner-kitchen legacy work
    - Finance + brand ops review
  - - Capital structure
    - Current cap table, debt terms, covenants, liquidation preferences, and option pool
    - Price cannot be underwritten cleanly without structure
    - CFO + counsel
  - - Store and kitchen productivity
    - Same-store sales, kitchen utilization, and closure history by market
    - Needed to test whether scale is productive or merely broad
    - Operations pack
  - - Franchise model
    - Royalty, fee, payback, and support-cost assumptions
    - Franchising is central to upside but unpriced publicly
    - Franchise P&L and pipeline review
  notes: Any one of these items could move the valuation view more than another month of generic market commentary.
