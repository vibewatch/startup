  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: consolidated-financial-bridge
    missingEvidence: A bridge from audited broker-entity results to the broader group revenue and profit narrative used in private valuation discussions.
    whyItMatters: This is the single biggest factor limiting valuation confidence and causing scenario spread.
    diligencePath: Request consolidated management accounts or a segment bridge showing which entities and products make up the claimed revenue base.
    relatedQuestionRefs:
    - QV002
    - QV003
    - QV004
    relatedTableRefs:
    - TV002
    - TV004
    - TV005
  - type: private-evidence-only
    severity: material
    topic: customer-quality-and-retention
    missingEvidence: Funded accounts, active investors, repeat-trading behavior, cohort retention, and product attach by customer segment.
    whyItMatters: A 7M-user story can support premium pricing only if economic quality is strong and durable.
    diligencePath: Request funded-user cohorts, activity frequency, NRR analogues, and product-level retention or cross-sell rates.
    relatedQuestionRefs:
    - QV013
    - QV025
    - QV028
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preferences
    missingEvidence: Latest cap table, liquidation preferences, anti-dilution, and investor-rights overhang from prior rounds.
    whyItMatters: Headline enterprise value can diverge materially from common-equity outcomes if preference overhang is significant.
    diligencePath: Request the latest capitalization table and major financing documents or board-approved summaries.
    relatedQuestionRefs:
    - QV017
    - QV025
    relatedTableRefs:
    - TV005
    - TV006
  - type: missing-source
    severity: minor
    topic: recent-secondary-or-primary-pricing
    missingEvidence: A clearly disclosed post-2021 financing event, tender, or secondary transaction marking today's valuation.
    whyItMatters: Without it, the unicorn anchor is historically important but not necessarily current.
    diligencePath: Ask management or investors whether any later financing, secondary sale, or internal valuation policy updated the mark.
    relatedQuestionRefs:
    - QV017
    - QV018
    relatedTableRefs:
    - TV005
  - type: private-evidence-only
    severity: material
    topic: exit-readiness-metrics
    missingEvidence: Profitability by product, compliance-adjusted margins, exit-prep KPIs, and buyer or IPO readiness materials.
    whyItMatters: Exit readiness is plausible strategically, but current public evidence is too thin for premium exit assumptions.
    diligencePath: Request board materials on exit planning, margin profile by rail, and readiness milestones for public or strategic processes.
    relatedQuestionRefs:
    - QV024
    - QV030
    relatedTableRefs:
    - TV006
