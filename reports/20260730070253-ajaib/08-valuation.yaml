- id: comparable-set-and-market-frames
  title: Comparable set and market frames
  body: 'The comparable set gives a broad but useful frame. CompaniesMarketCap pages imply that Robinhood''s July 2026 market cap and TTM revenue correspond to a much richer multiple than Futu or UP Fintech, while Windsor Drake''s wealthtech and capital-markets-tech M&A guide and FE International''s 2025-2026 fintech framework both confirm that the subsector has very wide dispersion. Robinhood is a premium benchmark because it combines scale, profitability, funded customers, assets, and public market liquidity. Futu and UP Fintech are more relevant on brokerage adjacency, but both trade at much lower market-cap-to-revenue levels than Robinhood. Put differently, the public market does not give one clean answer for consumer brokerage and wealthtech.


    That dispersion helps explain why Ajaib''s implied 7x revenue multiple can look simultaneously defendable and risky. It sits inside Windsor Drake''s 5-10x wealthtech/capital-markets range, roughly around FE International''s upper private-fintech band, above Futu and far above UP Fintech, yet below Robinhood. The right question is therefore whether Ajaib deserves a premium for Indonesian retail growth and category scarcity, or a discount for disclosure opacity, regulatory complexity, and uncertain customer-quality metrics.'
