tables:
- id: TV001
  title: Investment thesis / anti-thesis table
  columns:
  - Theme
  - Thesis support
  - Anti-thesis / tension
  - Investment read
  rows:
  - - Category scarcity
    - Indonesia's first investment-fintech unicorn with multi-asset breadth
    - Scarcity alone does not solve disclosure-quality gaps
    - Supports strategic interest, not blind premium
  - - Growth narrative
    - 2025 estimate sources point to $142.1M revenue and rapid growth
    - The estimate is third-party and not reconciled to public consolidated financials
    - Use growth as directional, not definitive
  - - Customer scale
    - Public sources cite 7M+ users and broad national reach
    - No funded-account, cohort-quality, or NRR disclosure
    - Mass scale helps upside but weakens confidence precision
  - - Regulatory position
    - Licensed broker rails and rising rule complexity can favor scaled incumbents
    - The same complexity can create compliance drag or episodic trust shocks
    - Moat and burden coexist
  - - Exit potential
    - Ajaib has strategic relevance for wealthtech and capital-markets buyers
    - Exit-grade disclosure is thinner than ideal for premium pricing
    - Interesting asset, but not fully de-risked
  - - Public evidence quality
    - There is enough to model scenarios
    - There is not enough to assert a clean fair value
    - Recommendation should stay price-sensitive
  notes: The table separates strategic attractiveness from valuation certainty; Ajaib scores higher on the former than the latter.
