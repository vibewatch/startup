  rows:
  - - Windsor Drake 2026
    - Wealthtech & capital markets tech M&A range ~5-10x revenue
    - Ajaib's implied ~7x can fit this band
    - M&A range is for private deal comps, not a guarantee for this exact company
  - - FE International 2025-2026
    - Private fintech revenue multiples ~3.7x-7.4x; 20-40% growth plus profitability can reach ~7.9x
    - Ajaib could justify upper-mid range if growth and efficiency are real
    - Retention and profitability proof are incomplete publicly
  - - Finro Q1 2026 dataset
    - Capital markets comp preview ~5.9x; growth / pre-IPO preview shows broad 2.8x-11.2x dispersion
    - Supports wide scenario ranges rather than a single exact number
    - Preview dataset is indicative, not Ajaib-specific
  - - Robinhood public comp
    - Premium multiple backed by funded customers, assets, profitability, and product breadth
    - Shows ceiling case for a scaled retail-finance platform
    - Not a like-for-like emerging-market private comp
  - - Futu and UP public comps
    - Much lower public multiples despite strong revenues
    - Ajaib should not assume automatic premium simply for being a trading app
    - Different geography, regulation, and product mix still matter
  notes: Framework sources are used to bound a defensible range, not to claim a mechanically precise mark.
