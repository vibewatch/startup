company:
  name: Ajaib
chapter:
  number: 8
  title: Valuation
  summary: 'Ajaib''s valuation case is attractive in narrative terms but only moderately supportable from public evidence. On one hand, the company is Indonesia''s first investment-fintech unicorn, public 2025 estimate sources peg revenue around $142.1 million with strong growth, customer scale is large, and the product footprint is broader than a single-asset retail broker. On the other hand, the strongest audited financial evidence is only for one broker entity, and it is much smaller in scope than the group-level revenue and valuation narrative. That mismatch matters because a $1 billion valuation can look reasonable on a 7x revenue multiple if the $142.1 million estimate is representative of the economic whole, yet look aggressive if the filing-accessible entity is closer to the real earnings base. Public comps also cut both ways: Robinhood trades at a much richer market-cap-to-revenue ratio, but Futu and UP Fintech trade far lower. The disciplined conclusion is that Ajaib looks strategically
    valuable and plausibly financeable around unicorn territory, but that the entry case is price-sensitive and should carry a disclosure discount until better consolidated financial evidence appears.'
sections:
- id: valuation-context-and-evidence-quality
  title: Valuation context and evidence quality
  body: 'The first valuation question is not what multiple to apply, but what revenue base is actually being valued. Public third-party sources such as GetLatka and Gate.com repeat a 2025 revenue estimate of roughly $142.1 million and a continuing $1 billion valuation narrative. If those numbers broadly represent the group, then Ajaib screens like a late-stage, high-growth wealthtech or capital-markets platform rather than a narrow domestic broker. But the cleanest audited public financial evidence remains the 2024 broker-entity filing, which describes a smaller regulated operating company with its own liabilities, related-party balances, and governance constraints. That means the central valuation challenge is scope, not arithmetic.


    For that reason, any public valuation stance must embed an evidence-quality haircut. Ajaib may well deserve strategic scarcity value because it combines consumer-fintech distribution, regulated brokerage rails, crypto exposure, and mass retail reach in a large Southeast Asian market. Yet the absence of public consolidated financials or a precise bridge from entity results to group estimates prevents a high-confidence mark-to-model conclusion.'
