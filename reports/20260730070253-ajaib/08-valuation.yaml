- id: TV005
  title: Financing, overhang, and disclosure table
  columns:
  - Topic
  - Public signal
  - Why it matters
  - Gap
  rows:
  - - Historic valuation anchor
    - 2021 Series B put Ajaib at unicorn status
    - Sets the benchmark many later narratives still reference
    - No public mark-to-market or later priced round terms in retained pack
  - - Current revenue base
    - $142.1M estimate is third-party, not a public consolidated filing
    - Central input to any revenue-multiple view
    - Need a bridge from entity filings to group economics
  - - Preference / cap-table overhang
    - No retained public source details liquidation preferences, investor rights, or preference stack
    - These can materially affect common-equity outcomes
    - Request latest cap table and major round terms
  - - Capital and governance actions
    - Broker-entity filings and RUPS documents show ongoing capital and governance management
    - Signals that licensed entities matter operationally
    - Still not the same as group-level valuation disclosure
  - - Funding recency
    - Public narrative still points back to 2021 rather than a fresh large round
    - Means today's pricing has less recent external validation
    - Need any later secondary, internal mark, or fundraising evidence
  notes: The biggest valuation overhang is not obvious dilution from the public record; it is the lack of public clarity on whether the record is complete.
