- id: TV004
  title: Bull / base / bear case table
  columns:
  - Case
  - Assumptions
  - Valuation range
  - Implied stance
  - Trigger conditions
  rows:
  - - Bull
    - Group-level $142.1M estimate is representative; growth stays high; customer quality improves; compliance burden remains manageable
    - ~$1.14B-$1.42B (8-10x est. revenue)
    - Can justify at or above unicorn level
    - Need better profitability proof, customer quality, and no adverse regulator action
  - - Base
    - Revenue estimate broadly right but disclosure discount persists; growth good but not pristine; public comp set stays mixed
    - ~$0.71B-$1.00B (5-7x est. revenue)
    - Close to fair around historical unicorn mark only at the high end
    - Requires continued traction without clearer downside evidence
  - - Bear
    - Estimate overstates economic whole, or risk / regulation / customer-quality concerns dominate
    - ~$0.28B-$0.57B (2-4x est. revenue)
    - Unicorn mark looks too rich
    - Would be reinforced by weak funded-user data, regulator friction, or slower growth
  - - Audit-anchor stress case
    - Investors overweight the smaller broker-entity filing without a clear bridge to group economics
    - Below the base range and hard to mark confidently from public evidence alone
    - Public evidence becomes too weak for aggressive pricing
    - Triggered by inability to reconcile entity and group scope in diligence
  notes: Ranges are illustrative scenario outputs, not tradable price targets, and are meant to show sensitivity to evidence quality more than forecasting precision.
