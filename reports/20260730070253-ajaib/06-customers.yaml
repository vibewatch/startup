- id: customer-proof-support-and-adverse-signals
  title: Customer proof, support, and adverse signals
  body: 'Customer proof exists, but it is consumer-style social proof rather than enterprise-style case studies. Positive proof includes app-store ratings, beginner-oriented positioning, support-channel transparency, and evidence that Ajaib is actively soliciting feedback from active users through in-person forums. The official customer-service article lists in-app chat, product-specific email addresses, and a help center; the Detik feedback piece shows product, marketing, and leadership teams meeting users directly to collect stories, challenges, and feature requests. Together, those signals suggest Ajaib recognizes that trust and education are essential when much of the base is first-time investors.


    Negative proof is also material. Chrome-Stats preserves outage and support complaints, and the July 2025 margin-transaction dispute became a named adverse customer event rather than anonymous review noise. Media coverage shows both the customer allegation and Ajaib''s response that the transaction came from a trusted device and that OJK requested a detailed internal report. For diligence purposes, that adverse case matters because it reveals where a novice-heavy customer base can encounter product-comprehension and support-risk problems even when the firm argues its systems behaved as designed.'
