- id: adoption-scale-and-usage-signals
  title: Adoption scale and usage signals
  body: 'Adoption evidence is abundant but uneven in quality. The platform''s strongest topline adoption claim is the 7 million-user milestone repeated across multiple 2026 media reports, while Detik''s August 2025 product-feedback article still quoted management at more than 3 million users across Indonesia. That sequence implies rapid claimed acceleration, but the exact composition of the reported total is not fully disclosed: public materials do not reconcile registered users, funded accounts, monthly active investors, or cross-app duplicates between Ajaib and Ajaib Kripto. App-distribution surfaces nevertheless provide supporting social proof. The App Store shows tens of thousands of ratings, Chrome-Stats shows more than 10 million Android downloads, and Slashdot mirrors the broad proposition around easy onboarding and retail accessibility.


    This combination supports a practical interpretation: Ajaib has achieved large-scale reach, but the public evidence is much better at proving awareness and registrations than engagement depth. The customer chapter therefore should distinguish carefully between scale signals and quality-of-usage signals. Ajaib looks large; it is less clear how many users are active, funded, recurrently transacting, or graduating from beginner flows into higher-value trading behaviors.'
