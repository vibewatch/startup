    - Confirmed through Chrome-Stats and margin-incident reporting
    - Shows where trust can erode even at scale
    - No public churn or complaint-resolution metrics
  notes: Durability is inferred from support and complaint signals because classic SaaS-style retention metrics are not disclosed.
