company:
  name: Ajaib
chapter:
  number: 6
  title: Customers
  summary: Ajaib's customer story is strongest as a mass-market Indonesian retail-investor franchise, not as a precisely disclosed user cohort model. Multiple 2025-2026 media reports quote company executives saying the platform surpassed 7 million users by early 2026, with the largest concentration in the 25-40 age bracket and broad geographic reach beyond Jabodetabek. Official product surfaces reinforce a beginner-first acquisition motion — digital onboarding, education, support, and the Lite experience — while Pro tools create an internal expansion path for more active users. The main weakness is measurement quality. Public sources say a lot about registered users, app ratings, and customer-service channels, but almost nothing about funded accounts, monthly actives, churn, retention, cohort performance, or revenue concentration by customer segment. The most defensible conclusion is that Ajaib has achieved very large retail reach and meaningful customer proof, but that durability and monetization
    quality remain under-disclosed.
sections:
- id: customer-segmentation-and-acquisition
  title: Customer segmentation and acquisition
  body: 'Ajaib''s customer base appears centered on Indonesian retail investors rather than enterprise buyers, institutions, or high-touch wealth-management relationships. The strongest public segmentation evidence comes from March 2026 company statements carried by Kontan, Liputan6, and ObserverID: Ajaib said it had crossed 7 million users, with the majority in the productive 25-40 age range and many of them first-time investors. ObserverID and the earlier Workable careers page also add a geographic signal, saying user growth has spread well beyond Jabodetabek and that roughly 80% of users come from outside that area. That is strategically important because it suggests Ajaib''s growth is not only an urban-Jakarta story; it is a digital distribution story.


    Product design aligns with that segmentation. Lite is positioned for newer, goals-based, and recommendation-led investors, while Pro is built for more active traders who want charting, faster execution, and richer control. That means Ajaib''s segmentation is not only demographic but behavioral. The company is trying to acquire beginner users cheaply through low-friction onboarding and then keep them inside the platform as their sophistication rises.'
