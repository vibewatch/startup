- id: TU005
  title: Expansion / concentration map
  columns:
  - Theme
  - Evidence
  - Upside
  - Risk
  rows:
  - - Lite-to-Pro progression
    - Official Lite/Pro segmentation plus product breadth
    - Ajaib can keep a user as sophistication rises
    - Progression rates are undisclosed
  - - Multi-asset cross-sell
    - Stocks, funds, bonds, crypto, and U.S. stocks in one app
    - Higher lifetime value per retained user
    - Public monetization by rail is absent
  - - National digital distribution
    - Users beyond Jabodetabek and digital-only support
    - Large TAM outside legacy finance centers
    - Brand trust and support quality become critical at scale
  - - Channel dependence
    - App stores, online content, help center, media literacy events
    - Low branch cost and fast distribution
    - Outages, policy shifts, or review damage can hit acquisition
  - - Concentration opacity
    - No public funded-user concentration, heavy-trader mix, or churn data
    - May still be diversified if millions are real active users
    - Could hide revenue reliance on a smaller active subset
  notes: The chapter can support an expansion thesis, but public concentration risk is largely an unmeasured variable.
