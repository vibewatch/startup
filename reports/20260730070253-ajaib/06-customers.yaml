  title: Customer segment matrix
  columns:
  - Segment
  - Evidence
  - Need state
  - Ajaib fit
  - Open question
  rows:
  - - First-time investors
    - Kontan, ObserverID, help-center language
    - Safe and simple entry into investing
    - Low-friction onboarding, education, support, Lite mode
    - What share of registrations ever fund an account?
  - - Millennial / Gen Z productive-age users
    - Kontan and Liputan6 quote majority age 25-40
    - Mobile-first, low-balance, intuitive investing
    - Digital onboarding and beginner-first UX
    - How different are Gen Z and millennial retention curves?
  - - Outside-Jabodetabek users
    - ObserverID and Workable cite broad non-metro reach
    - Access to investment tools without physical branches
    - Digital-only distribution lowers geographic barriers
    - Which provinces drive the highest funded-user density?
  - - Active traders
    - Lite/Pro materials and app-store features
    - Faster execution, charting, risk controls
    - Ajaib Pro, TradingView, Fast Trade, broker summary
    - How many users actually convert into Pro-style behavior?
  - - Multi-asset upgraders
    - Product breadth across stocks, funds, bonds, crypto, U.S. stocks
    - Diversification without leaving the app
    - Cross-sell inside one ecosystem
    - Which asset rails produce the best retention and monetization?
  notes: This is a behavioral segment map reconstructed from public product and media evidence, not an official CRM cohort report.
