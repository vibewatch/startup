- id: buyers-users-and-adoption-paths
  title: Buyers, users, and adoption paths differ by investor maturity
  body: The buyer and user are usually the same person in Ajaib’s core market, but the segments are not uniform. At the beginner end, Ajaib’s own Lite materials and 2026 media coverage point to first-time investors who want recommendations, educational support, and simple access to mutual funds, bonds, and curated equities. Statista’s market narrative supports that pattern by emphasizing convenience, accessibility, low fees, and user-friendly interfaces. At the more active end, Ajaib Pro and MetricBase both suggest a rising cohort of multi-asset traders who move across Indonesian equities, crypto, and other global assets using real-time data and mobile execution. Separately, the broader Indonesian wealth market still includes affluent and HNW customers whose liquid assets are concentrated and whose portfolios remain heavily influenced by deposits, advisory channels, and asset-allocation preferences rather than pure trading UX. Ajaib’s likely adoption path therefore runs from entry-level
    product discovery and small-ticket investing into deeper engagement, more asset classes, and eventually more frequent or more sophisticated trading behaviour.
