company:
  name: Ajaib
chapter:
  number: 2
  title: Market Analysis
  summary: Ajaib sells into an Indonesian digital-investment market that is broad enough to be strategically attractive but still uneven in monetisation quality. The best-supported demand markers are 28.96 million capital-market investor IDs by June 2026, 26.48 million mutual-fund investors by May 2026, and continuing mobile-first adoption trends, while the best-supported constraints are market volatility, transparency reform, dormant accounts, and the fact that safe deposits still dominate household portfolios. For Ajaib, the practical opportunity is not the whole wealth market; it is the subset of Indonesian households and traders willing to move from deposits into mobile-led multi-asset investing across equities, mutual funds, bonds, crypto, and selected global assets.
sections:
- id: market-boundary-and-substitutes
  title: Market boundary and status-quo substitutes
  body: Ajaib does not compete for the whole Indonesian wealth stack. Its real market sits at the intersection of mobile brokerage, mutual-fund distribution, government-bond access, crypto trading, and lightweight portfolio guidance for retail users. Official product surfaces show that the company wants to be the front door to all of those activities in one app, while Statista’s digital-investment framing explains why users increasingly want one platform that combines low-friction onboarding, multiple products, real-time data, and transparent pricing. The important boundary condition is that deposits and incumbent banking relationships still matter enormously in Indonesia. GlobalData’s Indonesia wealth summary says deposits made up more than 72% of the retail savings and investment portfolio in 2021, which means digital brokers are still fighting a large status-quo preference for cash-like instruments and safety rather than simply splitting an already-optimized investing pool. For Ajaib,
    the market is therefore best defined as the portion of Indonesian household financial activity willing to migrate from deposits, manual brokerage channels, or single-product apps into a mobile-led multi-asset investing workflow.
  claimRefs:
