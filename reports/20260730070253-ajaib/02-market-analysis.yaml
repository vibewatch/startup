- id: drivers-constraints-and-regulatory-backdrop
  title: Growth drivers are real, but regulation and market structure still constrain monetisation
  body: Indonesia’s macro and regulatory backdrop is supportive enough to keep the market growing, but not frictionless enough to make every account valuable. Ajaib’s January 2026 outlook estimates Indonesian GDP growth around 5.0% in 2026, supported by domestic demand, while inflation remains within Bank Indonesia’s target range and policy easing may continue. Statista’s narrative adds digitalization, smartphone usage, and financial-inclusion initiatives as structural demand drivers. On the other hand, 2026 market reforms reveal why trust and transparency still matter so much. TnP Law Firm, ASEAN Exchanges, and IDNFinancials all describe the 2026 push to raise free float requirements, disclose shareholders above 1%, improve beneficial-owner transparency, and respond to MSCI investability concerns. Meanwhile Menitnews showed that June 2026 still featured a 34.74% year-to-date drop in the IHSG and meaningful foreign net selling, even as investor counts kept rising. MetricBase then adds the
    operational warning that many headline accounts are dormant. For Ajaib, that means user growth alone is not the same thing as monetisable market depth.
