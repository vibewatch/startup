tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend or workflow
  - Excluded spend
  - Buyer / payer
  - Relevance to Ajaib
  rows:
  - - Retail equities brokerage
    - Account opening, stock trading, portfolio monitoring, e-IPO participation
    - Institutional execution and prime-broker workflows
    - Individual investor
    - Core Ajaib product rail and monetisation surface.
  - - Mutual funds and retail bonds
    - Fund selection, recurring savings, bonds, goals-based accumulation
    - Private banking mandates and corporate treasury allocation
    - Individual saver / household
    - Important for first-time investors and lower-frequency users.
  - - Crypto and global assets
    - Crypto trading, perpetuals, U.S. stocks, selected ETFs and global hedges
    - Professional derivatives desks and offshore custodians
    - Individual trader
    - Expands wallet share and keeps advanced users inside one app.
  - - Retail wealth accumulation
    - Mobile-led household investing and small-ticket diversification
    - Traditional deposits, branch-led wealth advice, insurance-only savings products
    - Individual / household
    - Defines the broader demand pool Ajaib is trying to convert.
  - - Regulated market-access infrastructure
    - KYC, investor accounts, disclosures, and public-market transparency
    - Unlicensed channels and informal tips-only communities
    - Investor plus regulator-mediated ecosystem
    - A prerequisite rather than a revenue line; it shapes trust and conversion.
  notes: This chapter defines Ajaib’s market as mobile-led retail investment workflows rather than the entire Indonesian financial-services sector.
