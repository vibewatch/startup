- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - ~5% GDP growth and domestic-demand resilience
    - driver
    - 2025-2026
    - Supports household confidence and investable income formation.
    - How much of Ajaib user activity correlates with income growth versus market momentum?
  - - Low inflation and easier BI stance
    - driver
    - '2026'
    - Improves affordability and risk appetite for household investors.
    - Does rate easing increase trading or simply shift deposits slowly?
  - - Mobile-first digital-investment adoption
    - driver
    - structural
    - Supports low-friction acquisition for brokers like Ajaib.
    - What is CAC by channel for novice versus active users?
  - - Multi-asset product demand
    - driver
    - structural
    - Favors apps that can hold equities, funds, bonds, and crypto in one interface.
    - How much cross-sell actually converts after the first account is opened?
  - - Free-float and ownership-transparency reforms
    - driver
    - 2026 onward
    - Could improve market credibility and foreign/retail trust.
    - How quickly will reforms change liquidity and tradable-float quality?
  - - IHSG drawdown and market volatility
    - constraint
    - 2026 current
    - Can slow conversion, hurt trading confidence, and reduce revenue consistency.
    - What portion of Ajaib revenue is tied to active trading versus recurring savings?
  - - Dormant-account problem
    - constraint
    - structural
    - Headline investor counts may overstate monetizable activity.
    - What share of registered users trades or funds accounts monthly?
  - - MSCI transparency concerns and governance frictions
    - constraint
    - 2026 current
    - Shows that market access still depends on reform execution, not just demand.
    - Would further investability setbacks reduce retail trust or listed-asset breadth?
  notes: The Indonesian market is growing, but several constraints affect revenue quality, not just top-line account growth.
