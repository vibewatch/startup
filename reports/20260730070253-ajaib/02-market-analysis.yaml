  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: active-user-conversion
    missingEvidence: Ajaib-specific data on funded accounts, monthly active traders, product attach rates, and revenue per active user.
    whyItMatters: Market-account counts are large, but they do not show what share of users convert into durable or monetizable behaviour on Ajaib.
    diligencePath: Request cohort data by product, monthly activity, and funded-account conversion from management.
    relatedQuestionRefs:
    - QM024
    - QM025
  - type: enumeration-incomplete
    severity: minor
    topic: segment-coverage
    missingEvidence: A cleaner public breakdown of beginner, active-trader, affluent, and dormant-account segments inside Indonesia’s digital-investment market.
    whyItMatters: The buyer map is directionally strong but still triangulated from cross-source proxies rather than one canonical segmentation dataset.
    diligencePath: Combine broker disclosures, regulator data, and paid market surveys to refine segment weights and overlaps.
    relatedQuestionRefs:
    - QM010
    relatedTableRefs:
    - TM003
  - type: private-evidence-only
    severity: material
    topic: tamsamprecision
    missingEvidence: A consistent, non-overlapping market model linking SID counts, mutual-fund investors, crypto investors, and Ajaib user metrics.
    whyItMatters: Current public counts overlap and can exaggerate addressable or serviceable market size if treated as additive.
    diligencePath: Build a unified market model from OJK/KSEI raw data and company cohort disclosures.
    relatedQuestionRefs:
    - QM022
    - QM023
    relatedTableRefs:
    - TM002
  - type: stale
    severity: minor
    topic: wealth-summary-2021-bases
    missingEvidence: More current public asset-allocation splits than the 2021 base year in the GlobalData executive summary.
    whyItMatters: Portfolio-mix and affluent-allocation claims are useful context, but they are anchored on an older base period.
    diligencePath: Refresh the portfolio-allocation lens with 2025-2026 surveys or a newer wealth-market dataset.
    relatedQuestionRefs:
    - QM009
  - type: conflicting-data
    severity: material
    topic: activity-vs-accounts
    missingEvidence: A reconciled view of dormant versus active retail accounts across equities, mutual funds, and crypto.
    whyItMatters: The market may look deeper from account totals than it really is for transaction-driven platforms.
    diligencePath: Compare raw KSEI account series with broker-side activity disclosures and regulator turnover statistics.
