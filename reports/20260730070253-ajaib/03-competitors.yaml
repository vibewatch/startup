- id: moat-durability-and-displacement-risk
  title: Moat durability and displacement risk
  body: The moat question is therefore nuanced. Ajaib has a credible right to claim that it brings more regulated asset classes together than Stockbit, Bibit, Bareksa, or Pintu individually, and it increasingly frames that breadth with separate Lite and Pro experiences. But the evidence does not support a conclusion that breadth alone is durable. Pluang already markets a broader visible asset menu, Stockbit still appears deeper on stock community and analysis, and Bibit or Bareksa may remain better aligned with lower-risk beginners who want robo-advice, funds, or government bonds before they want active trading. Independent comparison pages repeatedly frame the Indonesian category as a set of specialized strengths rather than a winner-take-all market. That increases commoditization risk. If users can discover products, open accounts quickly, and maintain several apps, then Ajaib's defense must come from conversion quality, cross-sell rates, trust, execution speed, and regulation-aware product
    design rather than from simple feature checklists. In other words, Ajaib looks like a strong contender in Indonesia's investment-app market, but not an unassailable platform whose customers are structurally locked in.
