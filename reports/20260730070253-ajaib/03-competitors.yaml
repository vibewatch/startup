- id: pricing-distribution-and-multi-homing
  title: Pricing, distribution, and multi-homing
  body: 'Public evidence is stronger on packaging than on realized economics, but even that limited visibility shows why switching costs are not absolute. Stockbit''s Google Play description openly states 0.15% buy and 0.25% sell brokerage fees, while Bibit stresses zero commission on mutual-fund transactions. Pluang emphasizes transparent low fees and small-ticket entry for crypto, U.S. stocks, and gold. By contrast, Ajaib''s retained official and app surfaces emphasize product breadth, fast onboarding, e-IPO access, and advanced trading tools more than a fully visible rate card. That matters because retail investors in Indonesia can easily open several apps at once: one for mutual funds, another for stock analysis, and another for crypto or U.S. stocks. Distribution is similarly fragmented. Stockbit benefits from community-led engagement, Bibit from robo-advisor positioning for beginners, Bareksa from long-standing marketplace credibility, Pluang from cross-asset diversification, and Pintu
    from a focused crypto brand. International names like Groww and Upstox reinforce the point that simple UX plus educational framing can be powerful, but they also underline that many winning features are imitable. Ajaib therefore competes less on exclusive rail access and more on whether one app can deliver enough breadth, speed, trust, and education to reduce the user''s need to multi-home.'
