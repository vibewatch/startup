- id: financial-verdict-and-diligence-blockers
  title: Financial verdict and diligence blockers
  body: 'The financial verdict is constructive but disclosure-limited. On the positive side, retained evidence proves that the broker entity is real, regulated, revenue-generating, profitable in audited 2024 accounts, and still being capitalized by the parent in 2025. Public traction signals also point to a larger group opportunity: millions of users, a $1 billion historical valuation, and outside estimates of far bigger top line than the broker filing alone suggests. But the blockers are just as important. The market still lacks a retained consolidated group financial statement, product-level revenue mix, take rates, funded-user counts, CAC, churn, and a clean runway model. The entity-level and group-level pictures are simply not the same thing.


    That mismatch matters directly for underwriting. If the investment case rests on Ajaib as a broad fintech wealth platform, then investors need consolidated statements across securities, funds, crypto, and overseas-stock entities rather than only one broker filing. If the case rests on the broker alone, then margin dependence, large liabilities, and related-party funding deserve closer attention. Until management supplies a bridge between those views, the best-supported conclusion is that Ajaib has meaningful operating scale and funding support, but still falls short of public-company-grade financial transparency.'
