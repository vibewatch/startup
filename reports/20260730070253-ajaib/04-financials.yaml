- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Consolidated FY2024-FY2025 statements across all Ajaib entities
    - Without them, group-scale revenue and profit cannot be verified against broker filings
    - Request audited consolidated income statement, balance sheet, cash flow, and entity bridge
  - - GMV / order-flow / funded-active-user metrics
    - Without them, transaction quality and monetization efficiency are unknowable
    - Request monthly funded users, active traders, order values, and cohort activity by asset class
  - - Product-level revenue mix
    - Without it, investors cannot tell whether growth comes from durable fees or cyclical trading
    - Request revenue split by brokerage commissions, margin/interest, funds, crypto, U.S. stocks, and other services
  - - Customer acquisition cost and retention
    - Without them, scale claims do not translate into payback or LTV confidence
    - Request CAC by channel, repeat trading, churn, and funded-user retention cohorts
  - - Runway and cash-on-hand at group level
    - Without them, capital adequacy remains qualitative rather than modeled
    - Request current cash, burn, intra-group funding flows, and scenario runway under stressed markets
  - - Related-party funding terms and service dependencies
    - Without them, investors cannot assess true cost of capital or operating dependence
    - Provide agreements with PT Harta Karunia Indonesia and affiliated service providers
  notes: The biggest blocker is not lack of growth signals; it is lack of a clean bridge from entity filings to the broader Ajaib platform story.
  claimRefs:
