company:
  name: Ajaib
chapter:
  number: 4
  title: Financials
  summary: 'Ajaib''s public financial record is split between audited broker-entity filings and much larger group-level media estimates. The strongest hard evidence is the audited 2024 financial statement for PT Ajaib Sekuritas Asia: Rp187.98 billion of revenue, Rp144.97 billion of gross profit, Rp18.09 billion of net profit, Rp1.31 trillion of assets, Rp1.23 trillion of liabilities, and a Rp320 billion related-party payable. Q1 2025 analysis from PintarSaham shows continued fast broker growth but also thinner profit, heavier administrative cost, and rising margin dependence. By contrast, the headline $84.2 million FY2024 and $142.1 million FY2025 figures come from third-party databases and media relays, not retained official group statements. The underwriting takeaway is that Ajaib likely has real scale and adequate capital backing, but public evidence is still not good enough to cleanly reconcile group revenue quality, margin durability, or runway.'
sections:
- id: revenue-model-and-public-traction
  title: Revenue model and public traction
  body: 'Ajaib''s official surfaces make the commercial ambition look broader than one brokerage line. The app and securities pages show monetization surfaces across Indonesian stocks, mutual funds, bonds, crypto, U.S. stocks, IPO participation, and advanced trading features, while the audited broker filing confirms that the revenue actually recognized inside PT Ajaib Sekuritas Asia is still concentrated in brokerage-style economics. In the 2024 audited statement, commission revenue reached Rp147.73 billion and interest plus dividend income added Rp40.25 billion, for total revenue of Rp187.98 billion. That mix matters because it shows Ajaib''s most visible filed entity is already monetizing both transaction activity and balance-sheet-linked yield or margin economics rather than pure subscription software revenue.


    Public traction in 2025 looks meaningfully higher, but the source quality drops. PintarSaham''s breakdown of the March 2025 filing says Q1 revenue reached Rp74.12 billion, up 110% year over year, with commissions at Rp50.86 billion and interest plus dividend income at Rp23.26 billion. Separate third-party group-level estimates are much larger still: Gate, relaying Tech in Asia, says Ajaib posted 152% revenue growth and 38% profit growth in 2025, while GetLatka''s title line shows $142.1 million estimated 2025 ARR and a $1 billion valuation. Those numbers may all be directionally useful, but they are not the same scope. The safest interpretation is that the broker-entity filing proves real monetization, while group-level revenue headlines remain estimate-grade rather than audit-grade.'
