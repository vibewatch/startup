  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: consolidated-financials
    missingEvidence: Audited consolidated FY2024 and FY2025 financial statements spanning securities, mutual-fund, crypto, and U.S.-stocks entities.
    whyItMatters: Without a group-level bridge, investors cannot reconcile broker filings with much larger public revenue estimates or value the platform as one business.
    diligencePath: Request full consolidated statements plus an entity-by-entity revenue, asset, and profit bridge.
    relatedQuestionRefs:
    - QI017
    - QI020
    relatedTableRefs:
    - TI001
    - TI005
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: GMV, funded active users, take rate, CAC, payback, retention, and product-level margin by asset class.
    whyItMatters: Growth without these metrics cannot be translated into durable economics or valuation confidence.
    diligencePath: Request monthly cohort reporting across stocks, funds, crypto, and global assets.
    relatedQuestionRefs:
    - QI023
    - QI025
    relatedTableRefs:
    - TI003
    - TI005
  - type: conflicting-data
    severity: material
    topic: scope-reconciliation
    missingEvidence: A clean reconciliation between PT Ajaib Sekuritas Asia entity filings, third-party group revenue estimates, and broader Ajaib headcount figures.
    whyItMatters: Mixed-scope numbers can make the business look either much smaller or much larger than it really is, distorting valuation and risk analysis.
    diligencePath: Obtain management-certified KPI definitions and entity scope for every published revenue or headcount metric.
    relatedQuestionRefs:
    - QI017
    - QI024
    relatedTableRefs:
    - TI001
    - TI004
  - type: private-evidence-only
    severity: material
    topic: liquidity-and-runway
    missingEvidence: Current group cash on hand, intra-group funding flows, debt terms, and downside runway under lower trading activity.
    whyItMatters: Capital adequacy cannot be stress-tested from balance-sheet snapshots and funding history alone.
    diligencePath: Request treasury dashboard, debt schedule, cash forecast, and regulatory capital buffers by entity.
    relatedQuestionRefs:
    - QI016
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: minor
    topic: pricing-disclosure
    missingEvidence: A retained official rate card or revenue-recognition note that explains realized customer pricing across the product stack.
    whyItMatters: Public product breadth is clear, but monetization quality is not.
    diligencePath: Collect the latest brokerage fee schedule, spread policy, FX or partner-fee arrangements, and accounting treatment by product.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI002
