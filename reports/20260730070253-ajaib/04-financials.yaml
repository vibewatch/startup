- id: TI002
  title: Pricing / monetization table
  columns:
  - Offer
  - Price / contract model
  - List vs realized pricing
  - Included capabilities
  - Unknowns
  - Source / implication
  rows:
  - - Stocks brokerage
    - Transaction-linked economics
    - Realized pricing undisclosed in retained pack
    - Securities trading and app-based brokerage
    - Rate card, discounts, turnover mix
    - Audited revenue proves monetization but not the fee schedule
  - - Interest and margin income
    - Balance-sheet and margin-linked income
    - Realized economics only visible through filed totals
    - Margin financing and associated yield
    - Funding cost, loss assumptions, customer risk tiering
    - The income line can grow quickly but adds market-sensitivity risk
  - - Mutual funds / bonds
    - Distribution or platform-fee economics
    - No retained rate card
    - Ajaib Lite recommendations, funds, bonds
    - Fee basis and revenue share by product
    - Could diversify revenue, but current public evidence is thin
  - - Crypto / U.S. stocks
    - Spread, commission, or partner-share model
    - No retained realized pricing detail
    - Cross-asset trading beyond Indonesian equities
    - Which entity books revenue and what margins look like
    - Important for group story, but opaque in filings
  - - e-IPO
    - Promotional or zero-fee acquisition feature
    - Publicly advertised as zero fee on retained app-store pages
    - IPO participation and onboarding hook
    - Indirect monetization via retention or trading activity
    - Strong acquisition tool, but likely not a direct revenue driver
  - - Advanced Pro features
    - Trading tools that may lift activity rather than charge subscription fees
    - No retained subscription pricing
    - Charting, order book, fast trade, stop loss / take profit
    - Whether any feature is paid or only engagement-driven
    - Suggests monetization depends on trading depth, not SaaS subscription
  notes: Official product packaging is visible, but realized economics remain mostly hidden; the chapter therefore separates visible capability from disclosed revenue recognition.
