  rows:
  - - Brokerage commissions
    - Trading commissions on securities activity
    - Transaction / account
    - Rp147.73B in audited 2024; Rp50.86B in Q1 2025 analysis
    - High for 2024 filed entity; medium for 2025 relay
    - Disclose product split by stocks, IPOs, and other brokerage activity
  - - Interest, margin, and dividend income
    - Balance-sheet and margin-linked income
    - Balance / receivable / funding
    - Rp40.25B in audited 2024; Rp23.26B in Q1 2025 analysis
    - High for 2024 filed entity; medium for 2025 relay
    - Separate dividend income from customer-margin yield and funding spread
  - - Mutual funds and bonds
    - Distribution and cross-sell through app surfaces
    - Account / AUM / transaction
    - Visible in official product surfaces, but no retained filed line-item revenue
    - Low-medium
    - Provide fee basis, AUM, and revenue contribution by product line
  - - Crypto and U.S. stocks
    - Cross-asset monetization through other Ajaib entities
    - Spread / transaction / FX-like economics
    - Officially visible, but not reconciled in the retained broker filing
    - Low-medium
    - Bridge which legal entity records this revenue and how much it contributes
  - - IPO and advanced-trader tooling
    - Acquisition or activity driver rather than clearly disclosed revenue line
    - User / order flow
    - Ajaib markets zero-fee e-IPO and Pro tools, but economics are undisclosed
    - Low
    - Show whether these features monetize directly or mainly improve retention
  - - Group-level platform revenue estimate
    - Third-party estimate across broader Ajaib scope
    - Annual revenue estimate
    - GetLatka title gives $142.1M estimated 2025 ARR; Gate relays 152% 2025 revenue growth
    - Low-medium
    - Provide audited consolidated FY2024-FY2025 statements for the whole group
  notes: Rows distinguish filed broker-entity revenue from broader group or product claims that are not yet reconciled in retained public disclosure.
