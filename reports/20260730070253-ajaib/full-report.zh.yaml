      - number: '1.4'
        title: 规模指标、里程碑时间线与主要未答问题
        blocks:
          - type: paragraph
            body: >-
              当前最强的规模信号是用户增长。多篇 2026 年 3 月媒体报道称，Ajaib 已超过 7 million 用户或投资者，多数年龄在 25 至 40 岁，许多人是首次投资者，并把 Ajaib 作为第一款投资
              App。这些都是有意义的牵引力指标，因为它们契合公司长期的普惠叙事，也显示平台规模已远超 Y Combinator 资料中约一百万投资者的水平。公开产品里程碑也支持继续扩张：2025 年 5 月推出 Ajaib
              Lite 和 Ajaib Pro，说明管理层在切分新手和进阶用户；当前应用商店页面则通过 600 多只美股、黄金和白银 ETF，以及加密 App 中 750
              多种加密资产，展示了更宽的全球资产野心。弱点是披露纪律。员工人数只能通过 Tracxn 第三方估算看到，外部收入数字多是数据库估算或媒体转述，公开材料仍未调和 App
              下载量、注册用户、入金投资者和活跃券商账户之间的差异。因此，本章支持 Ajaib 是一个具备强分发动能的真实散户投资平台，但尚不足以给出干净、经审计的运营基线。
