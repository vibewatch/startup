      - number: '3.4'
        title: 护城河耐久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              护城河问题因此更微妙。Ajaib 有可信理由声称，自己把比 Stockbit、Bibit、Bareksa 或 Pintu 单独更多的受监管资产类别放在一起，并且越来越多地用 Lite 和 Pro
              两套体验来包装这种宽度。但证据不支持“仅靠宽度就能持久”的结论。Pluang 已经宣传更宽的可见资产菜单，Stockbit 在股票社区和分析上仍显得更深，Bibit 或 Bareksa
              可能仍更适合低风险新手——他们在想要主动交易之前，更需要智能投顾、基金或政府债券。独立比较页面反复把印尼品类描述为一组专门化优势，而不是赢家通吃市场。这提高了商品化风险。如果用户能发现产品、快速开户并同时保留多个
              App，Ajaib 的防线就必须来自转化质量、交叉销售率、信任、执行速度和懂监管的产品设计，而不是简单功能清单。换句话说，Ajaib 像是印尼投资 App
              市场里的强竞争者，但不是客户被结构性锁定、不可撼动的平台。
