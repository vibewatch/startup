      - number: '8.4'
        title: 退出准备度和最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              退出准备度同样有好有坏。战略上，Ajaib 确实有收购方或公开市场会看重的品质：大规模散户触达、品牌相关度、 产品宽度、持牌基础设施，以及在渗透率不足的新兴市场中的位置。但达到退出质量的披露仍偏薄。FE
              International 的 2026 框架强调增长、盈利、留存和监管状态；Finro 数据集和 Windsor Drake 区间也显示，买方现在越来越要求 可辩护的同业样本、干净的分层，以及比
              2021-2022 年热潮期更充分的收入质量证明。Ajaib 的公开材料 还没有给出足够的留存、入金账户或合并利润率披露，无法把这项优势完全兑现。


              因此，关键尽调问题很直接：在押注估值判断前，先拿到合并财务报表，或至少拿到桥接后的财务数据、 产品级贡献、队列质量指标，以及前几轮融资留下的任何优先权或股权结构包袱。没有这些材料，最合适的公开市场式立场
              是对价格敏感地乐观，而不是高确信定价。
