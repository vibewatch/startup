      - number: '8.3'
        title: 情景分析和建议
        blocks:
          - type: paragraph
            body: >-
              乐观、基准和悲观三种情景，主要看两股力量哪一边占上风。乐观情景下，投资人接受集团层面的收入估计， 相信客户增长和交叉销售仍然强劲，并把 Ajaib 视为稀缺的东南亚财富科技公司：盈利能力在提升，
              合规成本可控。此时，公司可以证明甚至超过历史独角兽估值。基准情景下，投资人仍认可收入估计， 但加入披露折价，并使用金融科技 / 财富科技中档倍数，估值更接近数亿美元高位，而不是干净的溢价独角兽。
              悲观情景下，投资人盯住审计主体范围、利润率和消费者保护风险，以及缺少合并层面证明，合适倍数可能被大幅压缩。


              因此，务实的投资建议是：Ajaib 值得跟踪或进一步尽调，但仅靠公开来源，还不足以在任何价格上激进承销。 如果 1.421 亿美元的估计真实且可持续，公司并不明显高估；但它也不明显便宜，因为最强的公开证据
              仍在范围、质量和风险承受能力上留下太多空洞。
