      - number: '6.2'
        title: 采用规模与使用信号
        blocks:
          - type: paragraph
            body: >-
              采用证据丰富，但质量不均。平台最强的总体采用主张，是多篇 2026 年媒体报道重复的 7 million 用户里程碑；Detik 2025 年 8 月产品反馈文章仍引用管理层称，Ajaib 在印尼各地拥有超过 3
              million 用户。这个序列暗示公司宣称的增长明显加速，但报告总数的具体构成没有完整披露：公开材料没有调和注册用户、入金账户、月活投资者，或 Ajaib 与 Ajaib Kripto 之间的跨 App
              重复。App 分发界面仍提供了支持性社会证明。App Store 显示数万条评分，Chrome-Stats 显示 Android 下载量超过 10 million，Slashdot
              则复述了易开户和散户可达性的广泛主张。


              这组信息支持一个务实解读：Ajaib 已实现大规模触达，但公开证据更擅长证明认知和注册，而不是证明参与深度。因此，客户章节应谨慎区分规模信号与使用质量信号。Ajaib
              看起来很大；但有多少用户活跃、已入金、反复交易，或从新手流程升级到更高价值交易行为，仍不清楚。
