      - number: '2.2'
        title: 市场规模需要多重视角，而不是一个 TAM 标题数字
        blocks:
          - type: paragraph
            body: >-
              对 Ajaib 来说，最干净的公开规模视角是投资者账户基础设施，而不是单一付费市场研究 TAM 数字。OJK 口径报道称，到 2026 年 6 月，印尼资本市场 SID 达到 28.96
              million，单月增加约 1.21 million；CEIC 基于 KSEI 的序列显示，2026 年 5 月共同基金投资者为 26.48 million，同月政府证券投资者为 1.52
              million。这些数字不能直接映射成 Ajaib 客户，因为它们代表相互重叠的账户群体，但它们说明可触达的散户投资基础已达到数千万级。财富端，GlobalData 摘要提供了补充视角：预计到 2026
              年，散户储蓄和投资将以 6.9% CAGR 增长，其中债券增长 12.7%，而共同基金在 2021 年仍只占组合的 3.8%。这组信息意味着市场足够大，仍在重新配置，并且投资 App
              渗透尚未完全完成。实务结论是，Ajaib 的 SAM 远窄于印尼整个储蓄池，但又远宽于活跃股票交易者本身。
