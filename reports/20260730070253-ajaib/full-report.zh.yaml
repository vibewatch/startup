      - number: '1.3'
        title: 融资历史、投资人基础，以及独角兽标签真正证明了什么
        blocks:
          - type: paragraph
            body: >-
              Ajaib 的资本历史是公开记录里最清楚的部分之一。Tracxn 融资表显示，公司在 2018 年 8 月完成种子轮，2021 年 1 月完成 US$25 million Series A、投后估值 US$400
              million，2021 年 3 月完成 US$65 million Series A 延伸轮，并在 2021 年 10 月完成 US$153 million Series B。GPCA 引用 Bloomberg
              的条目和 WeNetwork Asia 在 Series B 关键信息上相互印证：DST Global 领投，跟投方包括多家知名金融科技和跨界基金，这轮融资把 Ajaib 推到据称 US$1 billion
              的估值。即便具体稀释和优先权结构仍未公开，这已经足以把独角兽标签视为有公开证据支撑。更大的解读点在于，保留来源没有显示后续股权融资，因此到 2026 年中，2021
              年估值仍是最新公开可见的一级市场融资锚点。Ajaib 因而拥有强势投资人名单和耐久的独角兽标签，但没有近期公开价格发现。后续估值讨论必须纳入这个缺口，而不能假设 2021 年标记无需调整仍然成立。
