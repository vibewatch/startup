      - number: '5.4'
        title: 路线图、成熟度与开放缺口
        blocks:
          - type: paragraph
            body: >-
              路线图和成熟度图景可信，因为它们出现在几个独立界面上。Workable 里程碑页面勾勒出从共同基金到股票，再到加密和保证金，最后到债券的产品扩张路径。2025-2026 年产品材料通过 Lite/Pro
              分层、面向客户的研究发布、更深入的筛选和图表工作流，以及持续到 2026 年 7 月的 App 发布，增加了更多成熟度。这说明 Ajaib
              不再只是资产数量宽；它也在为不同投资者群体搭建更专业的体验，并围绕这些产品加厚内容层。


              但仍有实质缺口。已审阅来源没有公开外部开发者门户、交易 API 文档、公开可用性看板、具名云或托管架构图，也没有覆盖每个实体的详细安全认证包。公开 GitHub
              足迹可作为开发者信号，但不足以推断生产设计、发布速度或安全审查严谨度。因此，最好的产品技术结论是积极但克制：Ajaib
              看起来是一个严肃的多资产金融科技产品，具备活跃工程能力和真实客户工作流设计，但在韧性、合作伙伴依赖和系统内部结构上，公开证据仍有限。
