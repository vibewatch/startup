      - number: '1.2'
        title: 创始人、可见管理梯队与治理披露边界
        blocks:
          - type: paragraph
            body: >-
              创始人故事证据扎实，但更广义的治理透明度并不充分。Stanford GSB 2024 年教学案例和 Forbes 报道都确认 Anderson Sumarli 与 Yada Piyajomkwan
              为联合创始人，并把两人的合作追溯到 Stanford MBA 同窗时期。这些来源连同 Forbes
              人物稿，把最初使命界定为帮助首次投资者和更年轻的印尼投资者获得投资入口。后续运营能见度主要来自媒体引述，而不是完整高管名单：Kontan、Observer 和 Liputan6 引用了总裁董事
              Juliana，以及产品设计高管 Michael Lim 或 Michael Liem 关于用户增长、信任和教育的表述，说明 Ajaib
              现在的管理梯队已不止两位创始人。即便如此，公开材料仍没有给出现任董事会名单、独立董事名单，或 Series B
              后治理权利的清晰说明。因此，创始人可信度和使命匹配有相当证据支撑，但正式治理质量仍是尽调缺口。用于投资判断时，本章更能支持创始人与市场匹配度，而不是支持对董事会监督或投资人控制机制的信心。
