      - number: '5.3'
        title: 信任、合规与可靠性控制
        blocks:
          - type: paragraph
            body: >-
              信任、安全和合规是 Ajaib 运营模式的核心，因为它的产品宽度跨越多个受监管领域。法律和应用商店披露把集团映射为多个受监管实体：PT Ajaib Sekuritas Asia 负责证券，PT Takjub
              Teknologi Indonesia 负责共同基金，PT Kagum Teknologi Indonesia 负责加密资产，PT Ajaib Futures Asia 负责美股接入。IDX
              和注册类来源支撑了其交易所会员和受监管券商基础，LegalKah 则总结了 OJK 和 BEI 注册，以及隔离账户、P3/KPEI 覆盖等投资者保护机制。加密端，ABNR 2026 年 7 月法律更新和 OJK
              2025 年 7 月新闻稿显示，数字资产运营商正面对越来越明确的治理和 fit-and-proper 制度，这意味着 Ajaib 的多资产野心带来真实合规开销。


              可靠性证据更混杂。Chrome-Stats 和第三方评论界面仍保留了用户关于开盘附近宕机、客服质量和交易控制问题的投诉；同时，应用商店和下载页面显示，公司持续维护到 2026 年 7
              月。这种组合通常意味着平台正在成熟，但在峰值活动期间仍暴露于负载、运营或客服瓶颈。现有证据足以相信 Ajaib 受监管且积极维护；但公开证据不足以证明极端负载下稳定的可用性、事件响应质量或生产控制成熟度。
