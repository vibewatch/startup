  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Ajaib 并不争夺整个印尼财富管理栈。它真正的市场位于移动券商、共同基金分销、政府债券接入、加密交易，以及面向散户的轻量级组合指导交汇处。官方产品界面显示，公司想用一个 App
              成为这些活动的入口；Statista 对数字投资的框架也解释了为什么用户越来越想要一个同时具备低摩擦开户、多产品、实时数据和透明定价的平台。关键边界条件是，存款和传统银行关系在印尼仍极其重要。GlobalData
              的印尼财富摘要称，2021 年存款占散户储蓄和投资组合的 72% 以上，这意味着数字券商仍在对抗散户对类现金工具和安全性的巨大现状偏好，而不是简单切分一个已经优化好的投资池。对 Ajaib
              来说，市场最好定义为：愿意从存款、人工券商渠道或单一产品 App，迁移到移动主导、多资产投资流程的印尼家庭金融活动部分。
