  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与获客
        blocks:
          - type: paragraph
            body: >-
              Ajaib 的客户基础似乎集中在印尼散户投资者，而不是企业买方、机构或高接触财富管理关系。最强的公开分层证据来自 Kontan、Liputan6 和 ObserverID 转述的 2026 年 3
              月公司表述：Ajaib 称用户已超过 7 million，多数处在 25-40 岁生产力年龄段，很多是首次投资者。ObserverID 和更早的 Workable 招聘页面还补充了地理信号，称用户增长已明显扩散到
              Jabodetabek 之外，约 80% 用户来自该地区以外。这在战略上重要，因为它说明 Ajaib 的增长不只是城市雅加达故事，而是数字分发故事。


              产品设计与这一分层一致。Lite 面向较新手、目标导向、靠推荐引导的投资者；Pro 则服务更活跃、需要图表、更快执行和更丰富控制的交易者。这意味着 Ajaib
              的分层不只是人口统计学意义上的，也是行为意义上的。公司试图通过低摩擦开户低成本获取新手用户，并在其成熟度上升后继续把他们留在平台内。
