  - id: TV003
    title: 估值框架基准
    columns:
      - 框架 / 来源
      - 适用区间或洞察
      - Ajaib 的含义
      - 注意事项
    rows:
      - - Windsor Drake 2026
        - 财富科技与资本市场科技并购区间约 5-10x 收入
        - Ajaib 隐含约 7x，可落在该区间
        - 并购区间来自私有交易可比，不保证适用于这家公司
      - - FE International 2025-2026
        - 私有金融科技收入倍数约 3.7x-7.4x；20-40% 增长叠加盈利能力，可到约 7.9x
        - 若增长和效率属实，Ajaib 可支撑中高段区间
        - 留存和盈利能力的公开证据不完整
      - - Finro Q1 2026 数据集
        - 资本市场可比预览约 5.9x；增长 / IPO 前预览显示 2.8x-11.2x 的宽幅分散
        - 支撑宽情景区间，而非单一精确数字
        - 预览数据集只作指示，不是 Ajaib 专属
      - - Robinhood 上市可比
        - 高溢价倍数由入金客户、资产、盈利能力和产品广度支撑
        - 展示规模化零售金融平台的天花板情景
        - 不是一一对应的新兴市场私有可比公司
      - - Futu 与 UP 上市可比
        - 尽管收入强劲，公开市场倍数仍低很多
        - Ajaib 不能因为是交易应用就假设自动享有溢价
        - 地域、监管和产品组合差异仍重要
    notes: 框架来源用于框定可辩护区间，不用于声称机械精确的估值标记。
    claimRefs:
