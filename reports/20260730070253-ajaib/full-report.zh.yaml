  - id: TV004
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值区间
      - 隐含立场
      - 触发条件
    rows:
      - - 乐观
        - 集团层面 $142.1M 估算具代表性；增长维持高位；客户质量改善；合规负担仍可控
        - ~$1.14B-$1.42B（8-10x 估算收入）
        - 可支撑独角兽水平或更高估值
        - 需要更好的盈利能力、客户质量证据，且监管无不利动作
      - - 基准
        - 收入估算大体正确，但披露折价仍在；增长良好但不完美；公开可比组合仍然混杂
        - ~$0.71B-$1.00B（5-7x 估算收入）
        - 只有高端区间才接近历史独角兽标记的公允值
        - 需要持续牵引力，且没有更清晰的下行证据
      - - 悲观
        - 估算高估经济整体，或风险 / 监管 / 客户质量担忧占上风
        - ~$0.28B-$0.57B（2-4x 估算收入）
        - 独角兽标记显得过高
        - 弱入金用户数据、监管摩擦或增长放缓都会强化该情景
      - - 审计锚定压力情景
        - 投资者过度看重较小券商实体申报，且缺少通往集团经济性的清晰桥
        - 低于基准区间，且仅凭公开证据很难自信标记
        - 公开证据弱到难以支撑激进定价
        - 尽调无法勾稽实体口径和集团口径时触发
    notes: 区间只是示意性情景输出，不是可交易目标价；重点展示估值对证据质量的敏感性，而非预测精度。
    claimRefs:
      - CV004
      - CV014
      - CV018
      - CV028
      - CV029
      - CV030
      - CV031
  - id: TV005
    title: 融资、悬而未决因素与披露表
    columns:
      - 主题
      - 公开信号
      - 为什么重要
      - 缺口
    rows:
      - - 历史估值锚
        - 2021 年 Series B 轮使 Ajaib 跻身独角兽
        - 设定许多后续叙事仍引用的基准
        - 留存材料没有公开盯市标记或后续定价轮条款
      - - 当前收入基础
        - $142.1M 估算来自第三方，不是公开合并申报
        - 任何收入倍数视角的核心输入
        - 需要从实体申报到集团经济性的桥
      - - 优先权 / 股权结构悬念
        - 留存公开来源未详述清算优先权、投资者权利或优先权结构
        - 这些会实质影响普通股结果
        - 索取最新股权结构表和主要轮次条款
      - - 资本与治理动作
        - 券商实体申报和 RUPS 文件显示资本与治理仍在管理中
        - 说明持牌实体在运营上重要
        - 仍不等于集团层面的估值披露
      - - 融资新近度
        - 公开叙事仍回指 2021 年，而不是一轮新的大额融资
        - 意味着今日定价缺少近期外部验证
        - 需要后续二级交易、内部标记或融资证据
    notes: 最大的估值悬念不是公开记录显示的明显稀释，而是公开材料无法说明记录是否完整。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV022
      - CV023
      - CV024
      - CV036
  - id: TV006
    title: 建议与最终尽调要求
    columns:
      - 领域
      - 当前判断
      - 原因
      - 下一步要求
    rows:
      - - 建议
        - 跟踪 / 继续研究
        - 公司有吸引力，但仅凭公开证据不足以支撑高确信定价
        - 只有保持价格纪律并深入尽调，才继续推进
      - - 置信度
        - 中-低
        - 叙事强度高于审计口径清晰度
        - 索取合并或已桥接财务数据
      - - 风险评级
        - 高-中
        - 监管和信任风险仍可能实质压低倍数
        - 索取投诉、队列和监管方数据
      - - 估值立场
        - 只有集团收入估算属实时才公允；否则偏贵
        - 约 7x 合理还是激进，取决于口径
        - 承保前先勾稽客户质量和分部经济性
      - - 退出准备度
        - 有前景，但不完整
        - 品牌和规模加分，披露不透明扣分
        - 索取股权结构条款、优先权结构和退出准备指标
    notes: 该表把情景工作转成可执行的尽调姿态，而不是二元的投 / 不投结论。
    claimRefs:
