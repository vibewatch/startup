      - number: '4.4'
        title: 财务结论与尽调阻断点
        blocks:
          - type: paragraph
            body: >-
              财务结论偏建设性，但受披露限制。积极一面，保留证据证明券商实体真实存在、受监管、能产生收入、在 2024 年经审计账户中盈利，并且 2025 年仍由母公司注资。公开牵引力信号也指向更大的集团机会：数百万用户、$1
              billion
              历史估值，以及外部估算中远高于券商单体申报的收入规模。但阻断点同样重要。市场仍缺少保留下来的合并集团财务报表、按产品拆分的收入结构、抽佣率、入金用户数、CAC、流失率，以及清晰的现金续航模型。实体层面和集团层面根本不是同一张图。


              这种错配直接影响投资判断。如果投资逻辑建立在 Ajaib
              是一个宽口径金融科技财富平台之上，投资者需要的是覆盖证券、基金、加密和海外股票实体的合并报表，而不是只有一份券商申报。如果逻辑只建立在券商单体上，那么保证金依赖、大额负债和关联方融资就值得更仔细审视。在管理层提供两种视角之间的桥之前，最有证据支撑的结论是：Ajaib
              拥有有意义的运营规模和资金支持，但仍达不到上市公司级财务透明度。
