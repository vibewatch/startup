      - number: '8.2'
        title: 可比公司组和市场框架
        blocks:
          - type: paragraph
            body: >-
              可比公司组给出的是宽口径但有用的参照。CompaniesMarketCap 页面显示，Robinhood 2026 年 7 月的市值 与 TTM 收入对应的倍数远高于 Futu 或 UP
              Fintech；Windsor Drake 的财富科技和资本市场科技 M&A 指南、 FE International 的 2025-2026 金融科技框架也都说明，这个子赛道的估值离散度很大。Robinhood
              是溢价基准，因为它同时具备规模、盈利能力、入金客户、资产规模和公开市场流动性。Futu 和 UP Fintech 在券商邻近性上更贴近，但两者的市值 / 收入水平都远低于
              Robinhood。换句话说，公开市场并没有给消费券商 和财富科技一个干净答案。


              Ajaib 隐含的 7 倍收入倍数之所以既能辩护又有风险，正是因为这组离散度。它落在 Windsor Drake 的 5-10 倍财富科技 / 资本市场区间内，大致贴近 FE International
              私营金融科技区间的上沿，高于 Futu、 远高于 UP Fintech，但低于 Robinhood。因此，真正的问题是：Ajaib 应不应该因为印尼散户增长和品类稀缺性
              拿到溢价，还是应该因为披露不透明、监管复杂、客户质量指标不确定而被打折。
