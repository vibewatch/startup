  - id: TR003
    title: 运营与客户信任风险表
    columns:
      - 风险领域
      - 已观察信号
      - 影响路径
      - 缓释因素
    rows:
      - - 宕机 / 可靠性投诉
        - Chrome-Stats 保留了有关宕机和支持问题的投诉文本
        - 交易时段故障会直接伤害散户信任
        - App 持续更新、工程岗位招聘，暗示仍在修复
      - - 账户访问 / 支持锁定风险
        - 具名争议报道称，用户投诉后无法访问账户
        - 会把产品误解升级成急性客户伤害和公关风险
        - 官方支持渠道和监管沟通存在，但没有 SLA 数据
      - - 缺少公开状态页 / 复盘透明度
        - 留存材料中没有公开可用性仪表盘或事件归档
        - 用户和投资者无法判断故障严重性或复发率
        - 内部可能存在，但外部不可见
      - - 用户侧凭证 / 设备失陷
        - 隐私政策把 OTP、PIN、密码和设备安全责任推给用户
        - 钓鱼或设备失陷可能变成责任归属争议
        - 这是金融科技常见控制点，但仍是信任风险
      - - 分布式系统复杂度
        - SDET 招聘提到快速扩张的微服务平台和大量测试领域
        - 复杂度能提升规模能力，也会扩大故障面
        - 可靠性、性能和混沌工程工作可见，可作为缓释因素
    notes: 运营风险通过外部可见的故障模式和控制信号评估；内部 SRE 指标不可得。
