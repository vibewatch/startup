      - number: '6.3'
        title: 客户证明、支持与负面信号
        blocks:
          - type: paragraph
            body: >-
              客户证明存在，但它是消费级社会证明，而不是企业级案例研究。正面证明包括应用商店评分、面向新手的定位、支持渠道透明度，以及 Ajaib 通过线下论坛主动向活跃用户征集反馈的证据。官方客服文章列出了 App
              内聊天、按产品划分的邮箱地址和帮助中心；Detik 反馈文章显示，产品、营销和领导团队直接与用户见面，收集故事、挑战和功能需求。放在一起，这些信号说明 Ajaib
              明白，当大量基础用户都是首次投资者时，信任和教育至关重要。


              负面证明也很实质。Chrome-Stats 保留了宕机和客服投诉，2025 年 7 月保证金交易纠纷则成为具名负面客户事件，而不是匿名评论噪音。媒体报道同时呈现了客户指控，以及 Ajaib
              的回应：交易来自可信设备，OJK 要求提交详细内部报告。对尽调来说，这个负面案例重要，因为它揭示了当客户基础偏新手时，哪怕公司主张系统按设计运行，用户仍可能遇到产品理解和支持风险问题。
