  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律敞口
        blocks:
          - type: paragraph
            body: >-
              监管和法律风险是最重要的风险桶，因为 Ajaib 横跨多个受监管产品和实体。法律页面、隐私政策和应用条款把 Ajaib 的用户关系绑定到一个包含证券、加密、期货和共同基金活动的集团；ARMA 对 OJK
              Regulation 3/2026 的讨论显示，随着印尼市场数字化，证券公司治理、资本和分类规则变得更严格。ABNR 的法律更新和 OJK 2025
              年数字资产新闻稿在加密端又增加了第二个移动层：治理、fit-and-proper 预期和合规评估正在收紧，而 Ajaib
              正好在扩大产品范围。这不是假设风险。它意味着公司必须同时管理多个监管体系，并服务一个新手占比高的散户基础。


              2025 年 7 月保证金纠纷显示，法律和监管问题可以多快从客户投诉升级到监管关注。媒体报道称，OJK 要求 Ajaib 提交详细内部调查结果并直接与客户沟通，BEI 也与 Ajaib
              单独会面，公开评论则质疑类保证金功能对新手是否足够透明。即便 Ajaib 对具体事件的解释正确，这次事件也说明，在受监管散户场景中，产品设计模糊性可以同时变成法律、政治和声誉风险。
