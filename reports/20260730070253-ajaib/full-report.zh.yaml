chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、平台范围与受监管运营结构
        blocks:
          - type: paragraph
            body: >-
              Ajaib 当前的公开身份已不只是一个股票交易 App。官网、Google Play 页面和 Apple App Store
              页面都把公司描述为一站式数字投资平台，覆盖印尼股票、共同基金、加密资产、债券和美股；2025 年 5 月 Lite/Pro
              发布材料则显示，管理层有意把新手投资者和活跃交易者的体验拆开。这种宽度很关键，因为公司并不只想变现一个散户流程，而是想成为面向投资的消费金融超级 App。法律架构也比主品牌看上去更复杂。法律条款和应用商店披露把
              PT Ajaib Teknologi Indonesia
              列为集团层面的品牌持有人，并分别列出证券、共同基金、加密和海外股票服务的受监管实体。公开应用商店披露还发布了这些运营实体的雅加达办公地址，这很有价值，因为它把品牌落在可识别的持牌业务上，而不是停留在纯营销外壳。正确结论是，Ajaib
              已经运营一个多产品、多实体的散户投资栈，但外部投资者仍需要比当前公开记录更清晰的法律实体到产品映射。
