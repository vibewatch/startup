      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              资本充足性看上去足以支撑当前运营，但披露仍不够清楚，难以高置信度支撑投资判断。2024 年经审计申报显示，资产 Rp1.31 trillion，对应负债 Rp1.23 trillion、权益 Rp80.31
              billion，另有应付关联方 Rp320 billion。附注还说明，2025 年 1 月 10 日，母公司 PT Harta Karunia Indonesia 追加注资 Rp75
              billion，使实缴资本在待 OJK 批准后达到 Rp125 billion。这强烈说明，进入 2025 年时，股东仍在支持券商实体增长和审慎资本状况。EMIS 和 Companies House 也进一步确认
              PT Ajaib Sekuritas Asia 是活跃注册实体，IDX 继续将其列为交易所会员 XC。


              更难的问题是，实体流动性是否能干净代表集团流动性。PintarSaham 描述了 2025 年 3 月更高杠杆的资产负债表：资产 Rp1.75 trillion、负债 Rp1.59
              trillion，客户和清算应付款较重，保证金应收账款规模较大。与此同时，Tracxn 融资记录显示迄今累计融资约 $245 million，2021 年 10 月 Series B 估值 $1
              billion。放在一起看，这些事实说明 Ajaib
              并未缺乏资本，但它们没有揭示手头现金、月度烧钱、契约约束，或资本如何在集团的券商、共同基金、加密和美股实体之间分配。正确的尽调姿态是：资本获取看起来真实，但集团层面的流动性透明度仍不完整。
