  - id: TR002
    title: 监管 / 法律风险登记表
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly visible legal and regulatory risk vectors retained for this run, focused on the main exposure
        categories rather than every possible clause or rule interaction.
    columns:
      - 风险领域
      - 证据
      - 为何重要
      - 缓释因素
      - 待尽调问题
    rows:
      - - 多实体监管足迹
        - Ajaib 法律页面和条款覆盖证券、加密货币、期货、共同基金相关实体
        - 产品越宽，同时承担的合规义务越多
        - 正式法律文件和受监管实体可见
        - 要求提供逐实体合规责任图和审计日历
      - - 证券公司规则大修
        - ARMA 称，OJK 第 3/2026 号条例对证券公司的行为规范、资本化、分类和治理作了现代化调整
        - 规则变化可能抬高资本或控制要求
        - Ajaib 已运营持牌券商实体并有申报文件
        - 确认适用的 PEKU 分类及其资本余量
      - - 数字资产治理收紧
        - ABNR 和 OJK 显示，数字资产运营商面临适格性与治理规则
        - 加密业务扩张现在承载更高监管预期
        - Ajaib 已通过独立实体披露加密业务
        - 要求提供 OJK 数字资产过渡期的合规路线图
      - - 融资融券 / 交易额度法律清晰度
        - Akurat 和多家媒体报道强调客户资格、抵押品和强平规则趋严
        - 杠杆被误解会引发投资者保护争议
        - 行业层面的规则正变得更明确
        - 要求提供产品默认设置截图和融资融券开通路径
      - - 客户争议后的诉讼 / 执法升级
        - Kompas、Katadata 和 detik 显示，2025 年事件后出现法律顾问介入、公开指控和监管沟通
        - 单个出圈案例就可能制造超额法律和声誉成本
        - Ajaib 称所有行动均遵守规则和调查步骤
        - 要求提供最终书面解决结果、投诉处理日志和任何监管结论
    notes: 本表把法律基础风险与更广泛媒体情绪风险拆开；这里只评估前者。
