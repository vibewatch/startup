  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 版图与竞争类别
        blocks:
          - type: paragraph
            body: >-
              Ajaib
              不再只和一家线上股票券商竞争。保留下来的官方界面、应用商店描述和独立资料显示，它的散户投资主张已经更宽，覆盖印尼股票、共同基金、债券、加密资产和美股。因此，相关竞品集必须按类别拆开，而不是拉成一个扁平同业名单。Stockbit
              是最接近、以股票为先的本土替代品，因为它把交易、讨论、图表、新闻和可见低佣金券商服务结合在一起。Bibit 和 Bareksa
              属于相邻但仍重要的竞争者，因为它们掌握新手、共同基金和政府债券流程，能在用户成为活跃交易者之前先拿下同一客户。Pluang 是最清晰的超级 App 式挑战者，因为它在一个 App
              里提供印尼股票、美股、加密、共同基金、黄金和类衍生品产品；Pintu 则是范围更窄但有规模的加密专业玩家。Tracxn 和 CB Insights 把视角进一步拉宽，显示 Ajaib 也会被拿来和
              Groww、Upstox 这类快速扩张的投资平台对标；即便这些公司并不直接面向印尼散户销售，这一点仍影响估值和产品野心。
