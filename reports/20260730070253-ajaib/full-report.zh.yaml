      - number: '7.3'
        title: 财务与模型风险
        blocks:
          - type: paragraph
            body: >-
              财务和模型风险更细，但很重要。经审计的 2024 年券商实体申报和 2025
              年中期分析显示，公司拥有一个真实、受监管的业务，具备有意义的收入、保证金应收款、关联方余额和治理依赖；但这些数字远小于市场叙事常用的第三方集团层面收入估算。这造成披露质量风险：如果投资者把实体层面申报和集团层面估算压成一个故事，就很容易高估规模、盈利能力或估值的确定性。公开证据还显示，杠杆产品很重要。保证金和交易额度机制引入强平、抵押品和客户保护风险；如果散户活动放缓或监管进一步收紧，部分变现杠杆可能变得吸引力下降或运营成本上升。


              第二个模型风险是融资和合规负担会随时间上升。公开来源仍把 Ajaib 的独角兽估值锚定在 2021 年 Series
              B，而保留下来的公开材料看不到后续重大融资轮。这并不能证明资本压力，但意味着合规成本、支持成本或散户市场活动放缓，必须由现有业务和资产负债表结构吸收，而不是由一轮明显刷新的股权融资承接。
