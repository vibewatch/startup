companyProfile:
  summary: >-
    Ajaib 由 Anderson Sumarli 和 Yada Piyajomkwan 于 2018
    年创立，已成长为印尼首家投资科技独角兽，面向散户提供覆盖本地股票、共同基金、债券、加密资产和美股的综合投资产品栈。公开证据显示，Ajaib 的散户触达很强，到 2026 年初已有 7M+ 用户，并继续通过 Lite 和 Pro
    做产品分层。不过，公司仍是私营企业，合并层面披露不足：公开材料尚未把经审计的券商实体业绩，与更广集团的收入、利润率和客户质量叙事清晰打通。
