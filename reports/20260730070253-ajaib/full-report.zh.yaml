      - number: '4.2'
        title: 成本结构与单位经济
        blocks:
          - type: paragraph
            body: >-
              经审计的 2024 年券商申报在账面上显示盈利，但 2025 年 Q1 图景没有那么干净。2024 年，PT Ajaib Sekuritas Asia 报告收入 Rp187.98 billion、毛利
              Rp144.97 billion、净利润 Rp18.09 billion，意味着该申报券商实体的报告毛利率很强。但 PintarSaham 的 2025 年 Q1
              分析显示，收入快速增长的同时利润被压缩：净利润降至 Rp2.23 billion，行政及一般费用据称跃升 299% 至 Rp41.53 billion，成本收入比约为
              75%。这本身不能证明结构性弱点，却确实说明更快的收入增长不会自动转化为更强的盈利质量。


              随着保证金和融资活动增加，券商经济敏感度似乎也在上升。PintarSaham 称利息收入同比增长超过 367%，并把增幅与客户更重的保证金使用联系起来。同一分析还强调了 Rp693.13 billion
              保证金应收款、Rp40.86 billion 正经营现金流，以及帮助推动现金结果的 Rp240 billion 保证金融资收款。结合经审计申报中的大额券商余额，这说明 Ajaib 申报券商的经济性，比随意的消费
              App 描述所暗示的更受资产负债表影响。因此，公开证据足以说明该实体拥有多条收入流并报告盈利，但不足以说明标准化抽佣率、CAC、回本期或按产品拆分的贡献利润率等耐久单位经济。
