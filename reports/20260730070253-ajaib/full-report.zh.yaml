  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品模块与用户任务
        blocks:
          - type: paragraph
            body: >-
              Ajaib 的产品定义现在已经清晰模块化。官网、App Store、Google Play 页面和 Lite/Pro 说明都描述了一个覆盖印尼股票、共同基金、债券、加密资产和美股的
              App；用户体验则被刻意拆分为面向更简单目标型投资的 Lite，以及面向活跃交易的 Pro。这一点重要，因为 Ajaib
              不只是券商前端；它试图在一个界面里服务多个投资者任务，从首次积累，到快速下单和受控风险交易。Workable 招聘页面进一步细化了模块地图，显示公司在 2019 年推出共同基金，2020 年推出股票，2022
              年推出加密和保证金交易，2024 年推出债券。


              工作流证据在 App 界面明确处最强。新用户可在约五分钟内线上开户，从小额投资开始，在 Lite 模式下获得共同基金和债券推荐，并逐步升级到 Ajaib Pro
              功能，如高级图表、订单簿可见性、快速执行、止损、止盈和券商摘要。就此而言，平台产品策略不只是宽度，而是生命周期设计。Ajaib 希望一个新手留在同一生态内，并随着用户更活跃、持有更多资产类别而继续使用。
