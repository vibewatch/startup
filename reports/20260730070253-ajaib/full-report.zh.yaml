  - id: TV001
    title: 投资论点 / 反论点表
    columns:
      - 主题
      - 论点支撑
      - 反论点 / 张力
      - 投资解读
    rows:
      - - 类别稀缺性
        - 印尼首个具备多资产广度的投资金融科技独角兽
        - 稀缺性本身补不上披露质量缺口
        - 支撑战略兴趣，但不支撑盲目溢价
      - - 增长叙事
        - 2025 年估算来源指向 $142.1M 收入和快速增长
        - 该估算来自第三方，未与公开合并财务数据勾稽
        - 增长只能作方向性判断，不能当定论
      - - 客户规模
        - 公开来源称用户 7M+，全国触达较广
        - 未披露入金账户、队列质量或 NRR
        - 大众规模抬高上行空间，但判断精度打折
      - - 监管资质
        - 持牌券商通道叠加规则趋复杂，可能利好有规模的在位者
        - 同样的复杂度也会带来合规拖累或阶段性信任冲击
        - 护城河与负担并存
      - - 退出潜力
        - Ajaib 对财富科技和资本市场买方具备战略意义
        - 达到退出级定价所需的披露仍偏薄
        - 资产有吸引力，但风险还没完全拆掉
      - - 公开证据质量
        - 足以建情景模型
        - 还不足以断言干净的公允价值
        - 建议应保持价格敏感
    notes: 该表把战略吸引力和估值确定性拆开看；Ajaib 前者得分高于后者。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV020
      - CV021
      - CV023
      - CV024
      - CV035
  - id: TV002
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly retained comparable valuation references selected to bracket Ajaib across premium, mid-range, and
        compressed brokerage outcomes; not intended as an exhaustive peer set.
    columns:
      - 公司
      - 市值 / 估值信号
      - 收入信号
      - 隐含市值 / 收入
      - 为什么重要
    rows:
      - - Ajaib
        - ~$1.0B 私有独角兽基准
        - 2025 年估算 ~$142.1M
        - ~7.0x
        - 如果该估算具代表性，能看出当前私有市场叙事隐含了什么
      - - Robinhood
        - $80.90B 市值（2026 年 7 月）
        - $4.61B TTM 收入
        - ~17.5x
        - 高溢价上市可比公司，规模、盈利能力和入金客户深度都远超 Ajaib 可见披露
      - - Futu Holdings
        - $14.28B 市值（2026 年 7 月）
        - $3.07B TTM 收入
        - ~4.7x
        - 券商 / 财富科技可比性强，公开报告更扎实，倍数低于 Ajaib 隐含的 7x
      - - UP Fintech / Tiger Brokers
        - $0.85B 市值（2026 年 7 月）
        - $0.64B TTM 收入
        - ~1.3x
        - 当规模和质量被视为偏弱时，上市零售券商倍数可以压到很低
    notes: 隐含比率只是基于当前公开页面计算的市值 / 收入简化代理，不是按企业价值归一后的控制权估值。
