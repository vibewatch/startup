  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与公开牵引力
        blocks:
          - type: paragraph
            body: >-
              Ajaib 的官方界面让商业野心看上去不止一条券商收入线。App 和证券页面展示了跨印尼股票、共同基金、债券、加密、美股、IPO 参与和高级交易功能的变现触点；经审计的券商申报则确认，PT Ajaib
              Sekuritas Asia 内部实际确认的收入仍集中在券商式经济上。2024 年经审计报表中，佣金收入达到 Rp147.73 billion，利息加股息收入贡献 Rp40.25 billion，总收入为
              Rp187.98 billion。这一组合很重要，因为它说明 Ajaib 最可见的申报实体，已经在变现交易活动和与资产负债表相关的收益或保证金经济，而不是纯订阅软件收入。


              2025 年公开牵引力看起来明显更高，但来源质量下降。PintarSaham 对 2025 年 3 月申报的拆解称，Q1 收入达到 Rp74.12 billion，同比增长 110%，其中佣金为 Rp50.86
              billion，利息加股息收入为 Rp23.26 billion。另有第三方集团层面估算更大：Gate 转述 Tech in Asia 称，Ajaib 在 2025 年收入增长 152%、利润增长
              38%；GetLatka 标题行显示 2025 年 ARR 估算为 $142.1 million，估值 $1
              billion。这些数字可能都有方向性价值，但口径并不相同。最稳妥的解读是，券商实体申报证明了真实变现，而集团层面的收入标题仍是估算级，而不是审计级。
