      - number: '3.2'
        title: 同业画像与能力重叠
        blocks:
          - type: paragraph
            body: >-
              直接同业画像显示，Ajaib 最强的主张是宽度，而不是独占性。Ajaib 自己的产品界面推广一个 App 内的完整栈，覆盖股票、共同基金、债券、加密和美股，并把 Lite 定位给新手，把 Pro
              定位给活跃交易者。Stockbit 用另一种切口回应：社交讨论、股票新闻、高级图表、模拟交易和明确的股票券商支持。Bibit 的回应是新手优先设计、智能投顾、共同基金、SBN
              ritel、固定利率政府债券，以及基金交易免佣金。Bareksa 通过共同基金、SBN、黄金和股票，加上计算器和会员忠诚叙事，切入更宽的储蓄和财富角度。Pluang 在产品菜单宽度上最激进，宣传覆盖美股和
              ETF、印尼股票、加密、共同基金和黄金的 2,000+ 资产；Pintu 则用更简单的论点专注加密和期货。含义是，多数 Ajaib 买方并不会抽象地选择唯一“最佳投资 App”；他们会选择最适合当前任务的
              App，不论这个任务是学习股票、搭建共同基金组合、交易加密，还是在一个界面持有多类资产。
