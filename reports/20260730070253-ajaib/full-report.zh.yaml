      - number: '3.3'
        title: 定价、分发与多 App 并用
        blocks:
          - type: paragraph
            body: >-
              公开证据对包装的说明强于对实际经济性的说明，但即便有限能见度也说明转换成本并非绝对。Stockbit 的 Google Play 描述公开列出 0.15% 买入和 0.25% 卖出券商佣金，Bibit
              强调共同基金交易零佣金。Pluang 强调面向加密、美股和黄金的透明低费率和小额起投。相比之下，Ajaib 保留下来的官方和 App 界面更强调产品宽度、快速开户、e-IPO
              入口和高级交易工具，而不是完整可见的费率表。这一点重要，因为印尼散户很容易同时开多个 App：一个买共同基金，一个做股票分析，另一个处理加密或美股。分发同样碎片化。Stockbit
              受益于社区驱动的参与，Bibit 受益于面向新手的智能投顾定位，Bareksa 受益于长期市场平台信誉，Pluang 受益于跨资产多元化，Pintu 受益于聚焦的加密品牌。Groww 和 Upstox
              这类国际名字进一步说明，简单 UX 加教育叙事很有力量，但也强调许多胜出功能可以被模仿。因此，Ajaib 的竞争重点不在独占轨道接入，而在一个 App 能否提供足够的宽度、速度、信任和教育，降低用户多栖的必要性。
