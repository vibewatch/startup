      - 监控指标
      - 论点破裂触发因素
      - 下一步尽调问题
    rows:
      - - 监管负担
        - 持牌实体、法律页面、交易所会员资格、申报文件
        - 任何 OJK 或 BEI 正式行动、新资本要求或分类变化
        - 正式执法、制裁或反复整改发现
        - 获取监管往来日志和 PEKU 分类
      - - 消费者保护风险
        - 支持渠道、帮助中心、事件后的直接客户会议
        - 围绕杠杆、登录或强平的投诉集群
        - 第二起同类高关注新手亏损案例
        - 审查开通默认设置和投诉解决统计
      - - 运营韧性
        - 持续发版和工程招聘
        - App 评论恶化、宕机讨论升温、发版节奏放缓
        - 持续宕机且没有公开解释
        - 要求提供可用性历史、复盘和支持 KPI
      - - 财务吸收能力
        - 经审计实体、增资、收入牵引估算
        - MKBD 趋势、融资融券应收款、净利率、关联方余额
        - 资本余量或融资融券损失急剧恶化
        - 要求提供更新后的 2025 年审计报表和资本缓冲
      - - 声誉与法律升级
        - 公开回应、律师介入和监管会议
        - 媒体频率、诉讼文件、用户信任情绪
        - 投诉螺旋叠加不利于公司的法律结论
        - 要求提供事件最终闭环和任何和解安排
      - - 客户质量
        - 大用户数说法和 Lite / Pro 进阶故事
        - 入金账户增长、活跃用户、重复交易、支持负载
        - 增长伴随入金账户转化弱或投诉率上升
        - 要求按产品线拆分用户队列留存和入金用户
    notes: 监控指标旨在比年度财务报表更早捕捉投资论点恶化。
