      - number: '2.3'
        title: 买方、用户和采用路径随投资者成熟度而不同
        blocks:
          - type: paragraph
            body: >-
              在 Ajaib 的核心市场，买方和用户通常是同一个人，但细分人群并不一致。新手端，Ajaib 自身 Lite 材料和 2026
              年媒体报道指向首次投资者：他们需要推荐、教育支持，以及简单接入共同基金、债券和精选股票。Statista 的市场叙事通过强调便利、可达性、低费用和友好界面，支撑了这种模式。更活跃的一端，Ajaib Pro 和
              MetricBase 都显示，多资产交易者群体正在扩大，他们用实时数据和移动执行在印尼股票、加密和其他全球资产之间切换。另一个层面上，更广泛的印尼财富市场仍包括富裕和 HNW
              客户，他们的流动资产更集中，组合仍深受存款、顾问渠道和资产配置偏好影响，而不只是交易体验。Ajaib
              可能的采用路径因此是：从入门级产品发现和小额投资起步，走向更深参与、更多资产类别，最终发展为更频繁或更复杂的交易行为。
