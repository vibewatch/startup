      - number: '6.4'
        title: 耐久性、扩张与集中度缺口
        blocks:
          - type: paragraph
            body: >-
              留存、扩张和集中度仍是客户故事里最不透明的部分。公开证据强烈暗示内部扩张循环——从第一个账户，到 Lite 引导投资，再到更广资产使用并可能进入 Pro 交易——但公司没有披露分群留存、入金账户率、类似 NRR
              的行为，或按模块拆分的交叉销售附着率。消费者集中度也无法从公开数据干净衡量。公开资料没有披露重度交易者贡献的活动占比，没有入金账户集中度曲线，也没有按加密、股票或美股拆分的产品级贡献。


              可以有把握地说，Ajaib
              高度依赖数字渠道和信任系统。应用商店、支持质量、监管声誉和金融素养举措，都直接影响获客和留存。这形成了一种混合但可投资的模式：获客引擎看起来强，分层逻辑可信，内部扩张路径也合理；但缺少公开耐久性指标，使得客户终身价值和集中度风险难以形成更高置信判断。
