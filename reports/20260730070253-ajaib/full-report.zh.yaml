      - number: '2.4'
        title: 增长驱动真实存在，但监管和市场结构仍约束变现
        blocks:
          - type: paragraph
            body: >-
              印尼的宏观和监管背景足以支撑市场继续增长，但摩擦仍大到不是每个账户都值钱。Ajaib 2026 年 1 月展望估计，国内需求支撑下，印尼 2026 年 GDP 增速约为 5.0%；通胀保持在 Bank
              Indonesia 目标区间内，政策宽松可能延续。Statista 的叙事还把数字化、智能手机使用和金融普惠举措列为结构性需求驱动。另一方面，2026 年市场改革说明信任和透明度为什么仍然关键。TnP Law
              Firm、ASEAN Exchanges 和 IDNFinancials 都描述了 2026 年改革：提高自由流通股要求、披露持股超过 1% 的股东、提升受益所有人透明度，并回应 MSCI
              对可投资性的担忧。与此同时，Menitnews 显示，尽管投资者数量继续上升，2026 年 6 月 IHSG 年初至今仍下跌 34.74%，且外资净卖出明显。MetricBase
              随后补充了运营层面的提醒：许多头部账户处于休眠状态。对 Ajaib 来说，这意味着用户增长本身不等同于可变现的市场深度。
