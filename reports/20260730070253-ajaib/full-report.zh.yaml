  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景与证据质量
        blocks:
          - type: paragraph
            body: >-
              第一个估值问题不是该套哪一个倍数，而是市场到底在给哪一块收入定价。GetLatka、Gate.com 等公开第三方来源反复引用一个 2025 年收入约 1.421 亿美元、估值继续按 10 亿美元
              叙述的口径。如果这些数字大体代表集团，Ajaib 看起来就更像后期、高增长的财富科技或资本市场平台， 而不是一家狭窄的本土券商。但最干净的公开审计财务证据仍是 2024 年券商主体申报文件：它呈现的是
              一个规模更小的持牌运营公司，有自己的负债、关联方余额和治理约束。也就是说，核心估值难点在范围， 不在算术。


              因此，任何公开估值立场都必须嵌入证据质量折价。Ajaib 可能确实有战略稀缺价值：它把消费金融科技分发、 持牌券商通道、加密资产敞口和大众散户触达放进了一个庞大的东南亚市场。但缺少公开合并财务报表，
              也没有从主体业绩通向集团估计的精确桥，市场就很难高确信地做模型估值结论。
