company:
  name: Ajaib
chapter:
  number: 1
  title: Company Overview
  summary: Ajaib is a Jakarta-based digital investment platform founded in 2018 by Anderson Sumarli and Yada Piyajomkwan that now presents itself as an all-in-one brokerage, mutual-fund, crypto, bond, and U.S.-stocks app for Indonesian retail investors. The strongest public funding anchor remains the October 2021 US$153 million Series B led by DST Global at a reported US$1 billion valuation, while the cleanest current scale marker is early-2026 disclosure that users have surpassed 7 million. The public record supports broad product breadth and real retail reach, but it remains weak on audited financials, board composition, and the exact bridge between app-level users, funded investors, and regulated legal entities.
sections:
- id: identity-platform-scope
  title: Identity, platform scope, and regulated operating structure
  body: Ajaib’s current public identity is broader than a single stock-trading app. The main website, Google Play listing, and Apple App Store listing all describe the company as an all-in-one digital investment platform spanning Indonesian stocks, mutual funds, crypto assets, bonds, and U.S. stocks, while the May 2025 Lite/Pro launch materials show management intentionally splitting the user experience between beginner investors and active traders. That breadth matters because it means the company is not just monetising one retail workflow; it is trying to become a consumer financial super-app for investing. The legal architecture is also more complex than the main brand suggests. The legal terms and store disclosures name PT Ajaib Teknologi Indonesia as the group-level brand holder and identify separate regulated entities for securities, mutual funds, crypto, and overseas-stocks services. Public app-store disclosures additionally publish Jakarta office addresses for those operating entities,
    which is useful because it grounds the brand in identifiable licensed businesses rather than a pure marketing shell. The right takeaway is that Ajaib already operates a multi-product, multi-entity retail-investment stack, but outside investors still need a cleaner legal-entity-to-product map than the public record currently provides.
