              surfaces. Workable's milestone page sketches a product expansion path from mutual funds to stocks, then
              crypto and margin, then bonds. The 2025-2026 product materials add more sophistication through Lite/Pro
              segmentation, research publications for clients, deeper screening and charting workflows, and continuing
              app releases into July 2026. That suggests Ajaib is no longer just broad in asset count; it is also
