  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation context and evidence quality
        blocks:
          - type: paragraph
            body: >-
              The first valuation question is not what multiple to apply, but what revenue base is actually being
              valued. Public third-party sources such as GetLatka and Gate.com repeat a 2025 revenue estimate of roughly
              $142.1 million and a continuing $1 billion valuation narrative. If those numbers broadly represent the
              group, then Ajaib screens like a late-stage, high-growth wealthtech or capital-markets platform rather
              than a narrow domestic broker. But the cleanest audited public financial evidence remains the 2024
              broker-entity filing, which describes a smaller regulated operating company with its own liabilities,
              related-party balances, and governance constraints. That means the central valuation challenge is scope,
              not arithmetic.


              For that reason, any public valuation stance must embed an evidence-quality haircut. Ajaib may well
              deserve strategic scarcity value because it combines consumer-fintech distribution, regulated brokerage
              rails, crypto exposure, and mass retail reach in a large Southeast Asian market. Yet the absence of public
              consolidated financials or a precise bridge from entity results to group estimates prevents a
              high-confidence mark-to-model conclusion.
            claimRefs:
              - CV001
              - CV002
              - CV003
