      - number: '8.3'
        title: Scenario analysis and recommendation
        blocks:
          - type: paragraph
            body: >-
              The bull, base, and bear cases depend mostly on which of those two forces dominates. In a bull case,
              investors accept the group-level revenue estimate, believe customer growth and cross-sell remain strong,
              and treat Ajaib as a scarce Southeast Asian wealthtech with rising profitability and manageable compliance
              cost. In that scenario, the company can justify or exceed the historic unicorn mark. In a base case,
              investors still credit the revenue estimate but apply a disclosure discount and use mid-range
              fintech/wealthtech multiples, which yields a value closer to the high hundreds of millions than a clean
              premium unicorn. In a bear case, investors focus on audited-entity scope, margin and consumer-protection
              risk, and the absence of consolidated proof, which can compress the appropriate multiple sharply.


              That leads to a pragmatic investment recommendation: Ajaib is interesting enough to track or diligence
              further, but not well evidenced enough from public sources to underwrite aggressively at any price. The
              company is not obviously overvalued if the $142.1 million estimate is real and recurring. It is also not
              obviously cheap, because the strongest public evidence still leaves too many holes around scope, quality,
              and risk absorption.
