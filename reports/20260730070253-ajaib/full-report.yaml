      - number: '4.3'
        title: Capital adequacy and financing dependence
        blocks:
          - type: paragraph
            body: >-
              Capital adequacy looks adequate for current operations, but not cleanly disclosed enough to underwrite
              with high confidence. The 2024 audited filing shows Rp1.31 trillion of assets against Rp1.23 trillion of
              liabilities and Rp80.31 billion of equity, plus a Rp320 billion payable to a related party. The notes also
              state that on 10 January 2025 the parent company PT Harta Karunia Indonesia injected another Rp75 billion
              of capital, taking total paid-up capital to Rp125 billion subject to OJK approval. That is a strong sign
              that shareholders were still supporting the broker entity's growth and prudential position entering 2025.
              EMIS and Companies House also reinforce that PT Ajaib Sekuritas Asia is an active registered entity, while
              IDX continues to show it as exchange member XC.


              The harder question is whether entity liquidity cleanly represents group liquidity. PintarSaham describes
              a more leveraged March 2025 balance sheet with Rp1.75 trillion of assets, Rp1.59 trillion of liabilities,
              heavy customer and clearing payables, and a large margin receivable book. Meanwhile Tracxn's funding
              record shows roughly $245 million raised to date and a $1 billion Series B valuation in October 2021.
              Those facts together suggest that Ajaib has not been capital-starved, but they do not reveal cash on hand,
              monthly burn, covenant constraints, or how capital is allocated across the group's broker, mutual-fund,
              crypto, and U.S.-stocks entities. The right diligence stance is that capital access looks real, while
              group-level liquidity transparency is still incomplete.
