  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product modules and user jobs
        blocks:
          - type: paragraph
            body: >-
              Ajaib's product definition is now clearly modular. The official website, App Store, Google Play listing,
              and Lite/Pro explainer all describe one app that spans Indonesian stocks, mutual funds, bonds, crypto
              assets, and U.S. stocks, while the user experience is deliberately split between Lite for simpler
              goals-based investing and Pro for active trading. That matters because Ajaib is not only a brokerage front
              end; it is trying to serve multiple investor jobs inside one interface, from first-time accumulation to
              fast order entry and risk-managed trading. The Workable careers page sharpens the module map further by
              showing the staged rollout of mutual funds in 2019, stocks in 2020, crypto and margin trading in 2022, and
              bonds in 2024.


              The workflow evidence is strongest where the app surfaces are explicit. New users can open an account
              online in around five minutes, begin with small-ticket investing, receive mutual-fund and bond
              recommendations in Lite mode, and graduate into Ajaib Pro features such as advanced charts, order-book
              visibility, fast execution, stop loss, take profit, and broker summary. In that sense, the platform's
              product strategy is not only breadth; it is lifecycle design. Ajaib wants one beginner to remain inside
              the same ecosystem as that user becomes more active and more multi-asset.
