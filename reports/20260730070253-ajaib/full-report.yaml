      - number: '7.4'
        title: Mitigations, monitoring, and thesis breakers
        blocks:
          - type: paragraph
            body: >-
              Mitigation maturity is mixed rather than weak. On the positive side, Ajaib has clear support channels,
              formal terms, a published privacy policy, exchange membership, audited filings for the broker entity,
              active app releases, and public evidence of engagement with regulators and customers when issues arise.
              The evolving OJK rulebook can also become a moat for scaled, compliant operators if Ajaib executes well.
              But the residual exposure remains meaningful because the biggest open risks are not easy to dismiss from
              public evidence: beginner-user misconfiguration around leverage, reputation damage from viral disputes,
              opaque cohort economics, and incomplete disclosure on cyber, uptime, or complaint trends.


              The practical investment posture is therefore to monitor triggers rather than assume steady-state safety.
              Thesis breaks would include formal regulatory findings, repeated margin or login complaints with a similar
              pattern, evidence of weak capital absorption at the broker entity, or signs that customer growth masks
              poor funded-account retention. The chapter's overall judgment is that Ajaib's risk profile is manageable
              only if governance, education, and support quality keep pace with product breadth and customer growth.
