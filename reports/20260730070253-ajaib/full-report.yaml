      - number: '2.2'
        title: Market size requires multiple lenses rather than one headline TAM
        blocks:
          - type: paragraph
            body: >-
              The cleanest public sizing lens for Ajaib is investor-account infrastructure rather than a single paid
              market-research TAM number. OJK-linked reporting says Indonesian capital-market SID reached 28.96 million
              by June 2026, up about 1.21 million in one month, while CEIC’s KSEI-based series shows 26.48 million
              mutual-fund investors in May 2026 and 1.52 million government-securities investors in the same month.
              Those figures do not map directly to Ajaib customers because they represent overlapping account
              populations, but they show that the addressable retail-investment base is already measured in the tens of
              millions. On the wealth side, GlobalData’s summary adds a complementary lens: retail savings and
              investments are forecast to grow at a 6.9% CAGR through 2026, with bonds growing 12.7%, while mutual funds
              still represented only 3.8% of portfolios in 2021. That combination implies a market that is big, still
              reallocating, and not yet fully penetrated by investment apps. The practical lesson is that Ajaib’s SAM is
              far narrower than Indonesia’s entire savings pool but far broader than active stock traders alone.
