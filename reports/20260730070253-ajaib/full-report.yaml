  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Regulatory and legal risk is the most important bucket because Ajaib spans multiple supervised products
              and entities. The legal page, privacy policy, and application terms tie Ajaib's user relationship to a
              group that includes securities, crypto, futures, and mutual-fund activities, while ARMA's discussion of
              OJK Regulation 3/2026 shows that securities-company governance, capital, and classification rules have
              become more demanding as Indonesian markets digitize. ABNR's legal update and OJK's 2025 digital-asset
              press release add a second moving layer on the crypto side: governance, fit-and-proper expectations, and
              compliance assessments are tightening just as Ajaib is broadening product scope. This is not a
              hypothetical risk. It means the company must manage several regulatory regimes at once while serving a
              novice-heavy retail base.


              The July 2025 margin dispute showed how quickly legal and supervisory issues can move from customer
              complaint to regulator attention. Media reports say OJK asked for detailed internal findings and direct
              engagement with the customer, BEI held its own meeting with Ajaib, and public commentary questioned
              whether margin-like features were sufficiently transparent for beginners. Even if Ajaib's interpretation
              of the specific incident is correct, the episode demonstrates that product-design ambiguity in a regulated
              retail context can become a legal, political, and reputational risk at once.
