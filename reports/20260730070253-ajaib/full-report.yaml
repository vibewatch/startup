  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and competitive classes
        blocks:
          - type: paragraph
            body: >-
              Ajaib no longer competes only against one online stock broker. Its retained official surfaces, app-store
              descriptions, and independent profiles show a broader retail-investment proposition covering Indonesian
              stocks, mutual funds, bonds, crypto assets, and U.S. stocks. That means the relevant rival set must be
              split into classes rather than one flat peer list. Stockbit is the closest stock-first domestic substitute
              because it combines trading, discussion, charting, news, and low visible brokerage fees. Bibit and Bareksa
              are adjacent but still serious competitors because they own beginner, mutual-fund, and government-bond
              workflows that can capture the same customer before that user ever becomes an active trader. Pluang is the
              clearest super-app style challenger because it offers Indonesian stocks, U.S. stocks, crypto, mutual
              funds, gold, and derivatives-like products in one app, while Pintu is a narrower but scaled crypto
              specialist. Tracxn and CB Insights widen the frame by showing that Ajaib is also benchmarked against
              fast-scaling investment platforms such as Groww and Upstox, which matters for valuation and product
              ambition even if those companies do not directly sell to Indonesian retail investors.
