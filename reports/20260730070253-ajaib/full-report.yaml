  - id: TV006
    title: Recommendation and final diligence asks
    columns:
      - Area
      - Current judgment
      - Why
      - Next ask
    rows:
      - - Recommendation
        - Track / research more
        - Interesting company, but public evidence does not justify high-conviction pricing by itself
        - Proceed only with price discipline and deeper diligence
      - - Confidence
        - Medium-Low
        - Narrative strength exceeds audited scope clarity
        - Request consolidated or bridged financials
      - - Risk rating
        - High-Medium
        - Regulatory and trust risks can still de-rate the multiple materially
        - Request complaint, cohort, and regulator data
      - - Valuation stance
        - Fair only if the group revenue estimate is real; otherwise rich
        - ~7x can be reasonable or aggressive depending on scope
        - Reconcile customer quality and segment economics before underwriting
      - - Exit readiness
        - Promising but incomplete
        - Brand and scale help, disclosure opacity hurts
        - Request cap-table terms, preference stack, and exit-prep metrics
    notes: >-
      This table translates the scenario work into an actionable diligence posture rather than a binary go/no-go
      verdict.
