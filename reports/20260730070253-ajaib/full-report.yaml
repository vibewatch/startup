              education are essential when much of the base is first-time investors.


              Negative proof is also material. Chrome-Stats preserves outage and support complaints, and the July 2025
              margin-transaction dispute became a named adverse customer event rather than anonymous review noise. Media
              coverage shows both the customer allegation and Ajaib's response that the transaction came from a trusted
              device and that OJK requested a detailed internal report. For diligence purposes, that adverse case
