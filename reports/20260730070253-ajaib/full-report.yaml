      - number: '1.4'
        title: Scale markers, milestone chronology, and the main unanswered questions
        blocks:
          - type: paragraph
            body: >-
              The strongest current scale signal is user growth. Multiple March 2026 media reports say Ajaib has
              surpassed 7 million users or investors, that most are 25 to 40 years old, and that many are first-time
              investors using Ajaib as their first investing app. Those are meaningful traction markers because they fit
              the company’s long-running inclusion narrative and show the platform has grown well beyond the roughly
              one-million-investor scale cited on its Y Combinator profile. Public product milestones also support
              continued expansion: the May 2025 launch of Ajaib Lite and Ajaib Pro shows management segmenting novice
              and advanced users, while the current app listings show broader global-asset ambitions through 600-plus
              U.S. stocks, gold-and-silver ETFs, and 750-plus crypto assets in the crypto app. The weak point is
              disclosure discipline. Employee count is visible only through Tracxn’s third-party estimate, external
              revenue figures are mostly database estimates or media relays, and the public pack still does not
              reconcile differences between app downloads, registered users, funded investors, and active brokerage
              accounts. The chapter therefore supports a real retail-investing platform with strong distribution
              momentum, but it does not yet support a clean audited operating baseline.
