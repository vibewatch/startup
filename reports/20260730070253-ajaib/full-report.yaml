      - number: '3.2'
        title: Peer profiles and capability overlap
        blocks:
          - type: paragraph
            body: >-
              The direct peer profiles show that Ajaib's strongest claim is breadth rather than exclusivity. Ajaib's own
              product surfaces market a one-app stack spanning stocks, mutual funds, bonds, crypto, and U.S. stocks,
              with Lite positioned for beginners and Pro for active traders. Stockbit answers with a different wedge:
              social discussion, stock news, advanced charting, virtual trading, and explicit stock brokerage support.
              Bibit answers with beginner-first design, robo-advisory, mutual funds, SBN ritel, fixed-rate government
              bonds, and no-commission fund transactions. Bareksa competes with a broader savings and wealth angle
              through mutual funds, SBN, gold, and stocks, plus calculators and loyalty framing. Pluang pushes hardest
              on product-menu breadth, advertising 2,000+ assets across U.S. stocks and ETFs, Indonesian stocks, crypto,
              mutual funds, and gold, while Pintu concentrates on crypto and futures with a simpler thesis. The
              implication is that most of Ajaib's buyers do not need to choose the single 'best investment app' in the
              abstract; they choose which app feels best for their current job, whether that is learning stocks,
              building a mutual-fund portfolio, trading crypto, or holding multiple assets in one interface.
