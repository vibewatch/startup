      - number: '4.2'
        title: Cost structure and unit economics
        blocks:
          - type: paragraph
            body: >-
              The audited 2024 broker filing looks profitable on paper, but the Q1 2025 picture is less clean. In 2024
              PT Ajaib Sekuritas Asia reported Rp144.97 billion of gross profit on Rp187.98 billion of revenue and
              Rp18.09 billion of net profit, which implies a strong reported gross margin for the filed broker entity.
              But PintarSaham's Q1 2025 analysis shows profit compression despite rapid revenue growth: net profit fell
              to Rp2.23 billion, administrative and general expense reportedly jumped 299% to Rp41.53 billion, and
              cost-to-income reached roughly 75%. That is not proof of structural weakness on its own, yet it does show
              that faster topline does not automatically translate into stronger earnings quality.


              The broker's economic sensitivity also appears to be rising with margin and funding activity. PintarSaham
              says interest income was up more than 367% year over year and links the increase to heavier margin usage
              by customers. The same analysis highlights margin receivables of Rp693.13 billion, positive operating cash
              flow of Rp40.86 billion, and Rp240 billion of margin-funding receipts that helped drive the cash outcome.
              Combined with the audited filing's large brokerage balances, that suggests Ajaib's filed broker economics
              are more balance-sheet-sensitive than a casual consumer-app description would imply. Public evidence is
              therefore sufficient to say the entity has multiple revenue streams and reported profitability, but
              insufficient to state durable unit economics such as normalized take rate, CAC, payback, or contribution
              margin by product.
