      - number: '8.4'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is likewise mixed. Strategically, Ajaib has real qualities that acquirers or public markets
              could value: large retail reach, brand relevance, product breadth, regulated infrastructure, and a
              position in an underpenetrated emerging market. But exit-quality disclosure is thinner than ideal. FE
              International's 2026 framework stresses growth, profitability, retention, and regulatory standing; Finro's
              dataset and Windsor Drake's ranges both imply that buyers increasingly demand defensible peer sets, clean
              segmentation, and better proof of revenue quality than the 2021-2022 boom required. Ajaib's public
              materials do not yet provide enough retention, funded-account, or consolidated-margin disclosure to
              maximize that advantage.


              The key diligence ask is therefore straightforward: before leaning into a valuation call, obtain
              consolidated or at least bridged financials, product-level contribution, cohort-quality metrics, and any
              preference/cap-table overhang from prior rounds. Without those items, the best public-market-style stance
              is price-sensitive optimism rather than conviction pricing.
            claimRefs:
