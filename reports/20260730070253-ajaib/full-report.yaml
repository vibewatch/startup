              public evidence strongly suggests an internal expansion loop — from first account, to Lite-guided
              investing, to broader asset use and potentially Pro trading — but the company does not publish cohort
              retention, funded-account rates, NRR-like behavior, or cross-sell attach by module. Consumer concentration
              also cannot be measured cleanly from public data. There is no disclosed share of activity from heavy
              traders, no funded-account concentration curve, and no product-level contribution by crypto, stocks, or
              U.S. stocks.


              What can be said with confidence is that Ajaib depends heavily on digital channels and trust systems. App
              stores, support quality, regulatory reputation, and financial-literacy initiatives all matter directly to
              customer acquisition and retention. That produces a mixed but investable pattern: the acquisition engine
              looks strong, the segmentation logic looks credible, and the internal expansion path is sensible, but the
