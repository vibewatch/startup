      - number: '1.3'
        title: Funding history, investor base, and what the unicorn label really proves
        blocks:
          - type: paragraph
            body: >-
              Ajaib’s capital history is one of the cleanest parts of the public record. Tracxn’s funding tables show a
              seed round in August 2018, a US$25 million Series A in January 2021 at a US$400 million post-money
              valuation, a US$65 million Series A extension in March 2021, and a US$153 million Series B in October
              2021. GPCA’s Bloomberg-cited item and WeNetwork Asia both align on the key Series B message: DST Global
              led the round, follow-on investors included several well-known fintech and crossover funds, and the
              financing pushed Ajaib to a reported US$1 billion valuation. That is enough to treat the unicorn mark as
              well supported publicly, even if the exact dilution and preference stack remain private. The bigger
              interpretive point is that no retained source shows a later equity round, so the 2021 valuation is still
              the latest publicly visible primary financing anchor in mid-2026. Ajaib therefore benefits from a
              prestigious investor roster and a durable unicorn label, but not from recent public price discovery. Later
              valuation discussion must account for that gap rather than assuming the 2021 mark still clears without
              adjustment.
