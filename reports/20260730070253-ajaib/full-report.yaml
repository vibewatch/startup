  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Ajaib does not compete for the whole Indonesian wealth stack. Its real market sits at the intersection of
              mobile brokerage, mutual-fund distribution, government-bond access, crypto trading, and lightweight
              portfolio guidance for retail users. Official product surfaces show that the company wants to be the front
              door to all of those activities in one app, while Statista’s digital-investment framing explains why users
              increasingly want one platform that combines low-friction onboarding, multiple products, real-time data,
              and transparent pricing. The important boundary condition is that deposits and incumbent banking
              relationships still matter enormously in Indonesia. GlobalData’s Indonesia wealth summary says deposits
              made up more than 72% of the retail savings and investment portfolio in 2021, which means digital brokers
              are still fighting a large status-quo preference for cash-like instruments and safety rather than simply
              splitting an already-optimized investing pool. For Ajaib, the market is therefore best defined as the
              portion of Indonesian household financial activity willing to migrate from deposits, manual brokerage
              channels, or single-product apps into a mobile-led multi-asset investing workflow.
