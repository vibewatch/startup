      - number: '1.2'
        title: Founders, visible leadership bench, and governance disclosure limits
        blocks:
          - type: paragraph
            body: >-
              The founder story is well supported even though broader governance transparency is not. Stanford GSB’s
              2024 teaching case and Forbes coverage both identify Anderson Sumarli and Yada Piyajomkwan as the
              cofounders and tie their partnership to their time as Stanford MBA classmates. Those sources, together
              with the Forbes profile, frame the original mission as opening investing access for first-time and younger
              Indonesian investors. Later operating visibility comes mainly through media quotes rather than a complete
              executive roster: Kontan, Observer, and Liputan6 quote President Director Juliana and product-design
              executive Michael Lim or Michael Liem on user growth, trust, and education, showing that Ajaib now has a
              broader management bench than the two founders alone. Even so, the public pack does not provide a current
              board roster, independent-director list, or a clean explanation of post-Series-B governance rights. That
              means founder credibility and mission fit are reasonably well evidenced, but formal governance quality is
              still a diligence gap. For underwriting purposes, this chapter supports confidence in founder-market fit
              more than confidence in board oversight or investor-control mechanics.
