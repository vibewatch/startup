- id: operational-and-customer-trust-risk
  title: Operational and customer-trust risk
  body: 'Operational risk is concentrated in trust, service quality, and the fragility of a digital-only user journey. Chrome-Stats preserves complaints about outages and support problems; the named 2025 dispute included allegations that the user''s account became inaccessible after the complaint and that force-sell mechanics converted a product misunderstanding into real financial harm. Because Ajaib acquires and serves users primarily through the app, help center, and digital support channels, any failure in login integrity, customer support responsiveness, or incident communication can quickly damage trust among beginner investors. This matters more for Ajaib than for an incumbent with branches or a higher-touch advisory model.


    There are mitigants, but they are partial. The privacy policy and terms place explicit responsibility on users to protect passwords, OTPs, PINs, and device security, which helps reduce Ajaib''s direct liability in phishing or account-compromise scenarios but does not eliminate customer-harm risk. The SDET hiring page also implies serious testing and reliability work, yet no retained public artifact provides uptime history, incident postmortems, or support-resolution KPIs. So the platform looks actively managed, but not transparently proven under stress.'
