- id: financial-and-model-risk
  title: Financial and model risk
  body: 'Financial and model risk is subtler but important. The audited 2024 broker-entity filing and 2025 interim analysis show a real, regulated business with meaningful revenue, margin receivables, related-party balances, and governance dependencies, but those figures are far smaller than the third-party group-level revenue estimates often used in market narratives. That creates a disclosure-quality risk: investors can easily overestimate certainty on scale, profitability, or valuation if they collapse entity-level filings and group-level estimates into one story. Public evidence also shows that leverage products matter. Margin and trade-limit mechanics introduce forced-sell, collateral, and customer-protection risk; if retail activity slows or regulation tightens further, some monetization levers could become less attractive or more costly to operate.


    A second model risk is funding and compliance burden over time. Public sources still anchor Ajaib''s unicorn valuation in the 2021 Series B, while no later major funding round is obvious in the retained public pack. That does not prove capital stress, but it does mean rising compliance costs, support costs, or slower retail market activity would need to be absorbed by the existing business and balance-sheet structure rather than by an obviously refreshed equity round.'
