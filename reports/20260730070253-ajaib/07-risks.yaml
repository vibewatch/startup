    - Formal enforcement, sanctions, or repeated remedial findings
    - Get regulator correspondence log and PEKU classification
  - - Consumer-protection risk
    - Support channels, help center, direct customer meetings after incidents
    - Complaint clusters on leverage, login, or forced sell
