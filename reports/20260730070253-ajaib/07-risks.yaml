company:
  name: Ajaib
chapter:
  number: 7
  title: Risks
  summary: 'Ajaib''s risk profile is dominated by regulated-retail brokerage complexity rather than by a single existential technology flaw. The biggest issues visible in public evidence are regulatory and consumer-protection risk around leverage and product comprehension, operational trust risk in a digital-only support model, and disclosure risk created by the gap between audited broker-entity filings and much larger third-party group-level revenue narratives. The July 2025 Rp1.8 billion margin dispute is the clearest public stress case: it triggered OJK and BEI engagement, multiple media cycles, legal escalation, and a wider debate about whether novice users can safely navigate margin or trade-limit features inside a fast-growing app. At the same time, legal documents and 2026 regulation updates show that compliance burden is rising, especially for broker-dealers and digital-asset operators. The mitigants are real — official supervision, active app maintenance, support channels, filings,
    and expanding governance rules — but so are the blind spots: no public uptime history, no public complaint-resolution metrics, no public cyber-loss disclosure, and no clean reconciliation between entity-level and group-level economics.'
sections:
- id: regulatory-and-legal-exposure
  title: Regulatory and legal exposure
  body: 'Regulatory and legal risk is the most important bucket because Ajaib spans multiple supervised products and entities. The legal page, privacy policy, and application terms tie Ajaib''s user relationship to a group that includes securities, crypto, futures, and mutual-fund activities, while ARMA''s discussion of OJK Regulation 3/2026 shows that securities-company governance, capital, and classification rules have become more demanding as Indonesian markets digitize. ABNR''s legal update and OJK''s 2025 digital-asset press release add a second moving layer on the crypto side: governance, fit-and-proper expectations, and compliance assessments are tightening just as Ajaib is broadening product scope. This is not a hypothetical risk. It means the company must manage several regulatory regimes at once while serving a novice-heavy retail base.


    The July 2025 margin dispute showed how quickly legal and supervisory issues can move from customer complaint to regulator attention. Media reports say OJK asked for detailed internal findings and direct engagement with the customer, BEI held its own meeting with Ajaib, and public commentary questioned whether margin-like features were sufficiently transparent for beginners. Even if Ajaib''s interpretation of the specific incident is correct, the episode demonstrates that product-design ambiguity in a regulated retail context can become a legal, political, and reputational risk at once.'
