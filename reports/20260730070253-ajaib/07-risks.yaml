- id: TR005
  title: Mitigation, monitoring, and diligence-ask table
  columns:
  - Area
  - Current mitigation signal
  - Monitoring indicator
  - Thesis-break trigger
  - Next diligence ask
  rows:
  - - Regulatory burden
