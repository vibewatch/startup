- id: TR002
  title: Regulatory / legal risk register
  enumerationScope:
    coverage: partial
    basis: Publicly visible legal and regulatory risk vectors retained for this run, focused on the main exposure categories rather than every possible clause or rule interaction.
  columns:
  - Risk area
  - Evidence
  - Why it matters
  - Mitigant
  - Open diligence ask
  rows:
  - - Multi-entity regulatory footprint
    - Ajaib legal pages and terms span securities, crypto, futures, and mutual-fund related entities
    - More product breadth means more simultaneous compliance obligations
    - Formal legal documentation and regulated entities are visible
    - Request entity-by-entity compliance ownership map and audit calendar
  - - Securities-company rule overhaul
    - ARMA says OJK Regulation 3/2026 modernizes conduct, capitalization, classification, and governance for securities companies
    - Rule changes can raise capital or control requirements
    - Ajaib already operates a licensed broker entity with filings
    - Confirm which PEKU classification applies and its capital headroom
  - - Digital-asset governance tightening
    - ABNR and OJK show fit-and-proper and governance rules for digital-asset operators
    - Crypto expansion now carries heavier supervisory expectations
    - Ajaib already discloses crypto through a separate entity
    - Request compliance roadmap for OJK digital-asset transition
  - - Margin / trade-limit legal clarity
    - Akurat and multiple media reports highlight stricter customer eligibility, collateral, and force-sell rules
    - Misunderstood leverage can create investor-protection disputes
    - Rules are becoming more explicit at the industry level
    - Request product-default screenshots and margin activation journey
  - - Litigation / enforcement escalation after customer disputes
    - Kompas, Katadata, and detik show legal counsel, public accusations, and regulator contact after the 2025 incident
    - A single viral case can create outsized legal and reputational cost
    - Ajaib says all actions followed rules and investigation steps
    - Request final written resolution, complaint handling logs, and any regulator findings
  notes: The table separates legal-basis risk from broader media sentiment risk; only the former is scored here.
