- id: roadmap-maturity-and-open-gaps
  title: Roadmap, maturity, and open gaps
  body: 'The roadmap and maturity picture are credible because they are visible across several independent surfaces. Workable''s milestone page sketches a product expansion path from mutual funds to stocks, then crypto and margin, then bonds. The 2025-2026 product materials add more sophistication through Lite/Pro segmentation, research publications for clients, deeper screening and charting workflows, and continuing app releases into July 2026. That suggests Ajaib is no longer just broad in asset count; it is also building more specialized experiences for different investor cohorts and a thicker content layer around those products.


    But there are still material gaps. The reviewed sources do not expose an external developer portal, trading API documentation, public uptime dashboard, named cloud or custody architecture map, or detailed security-certification pack for every entity. The public GitHub footprint is useful as a developer signal, yet it is not enough to infer production design, release velocity, or security-review rigor. The best product-tech verdict is therefore positive but disciplined: Ajaib looks like a serious multi-asset fintech product with active engineering and real customer workflow design, but still with limited public evidence on resilience, partner dependencies, and system internals.'
