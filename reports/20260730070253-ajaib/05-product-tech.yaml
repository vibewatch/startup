- id: trust-compliance-and-reliability-controls
  title: Trust, compliance, and reliability controls
  body: 'Trust, safety, and compliance are central to Ajaib''s operating model because its product breadth crosses several regulated domains. The legal and app-store disclosures map the group into multiple supervised entities: PT Ajaib Sekuritas Asia for securities, PT Takjub Teknologi Indonesia for mutual funds, PT Kagum Teknologi Indonesia for crypto assets, and PT Ajaib Futures Asia for U.S.-stock access. IDX and registry-style sources support the exchange-member and regulated-broker footing, while LegalKah summarizes OJK and BEI registration plus investor-protection mechanisms such as segregated accounts and P3/KPEI coverage. On the crypto side, ABNR''s July 2026 legal update and OJK''s July 2025 press release show that digital-asset operators face an increasingly explicit governance and fit-and-proper regime, which means Ajaib''s multi-asset ambition carries real compliance overhead.


    Reliability evidence is more mixed. Chrome-Stats and third-party review surfaces still preserve user complaints about outages around market open, support quality, and trading-control issues, even while app-store and download pages show active maintenance through July 2026. That combination usually means the platform is maturing but still exposed to load, operations, or customer-support bottlenecks during peak activity. There is enough evidence to trust that Ajaib is regulated and actively maintained; there is not enough public evidence to prove consistent uptime, incident response quality, or production-control maturity under extreme load.'
  claimRefs:
