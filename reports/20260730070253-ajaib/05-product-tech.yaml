company:
  name: Ajaib
chapter:
  number: 5
  title: Product & Technology
  summary: 'Ajaib''s product and technology stack is broader and more operationally real than a simple retail-trading app label suggests. Official app surfaces, legal disclosures, and the Workable careers site show a multi-entity product set spanning securities, mutual funds, crypto, bonds, U.S. stocks, research content, and separate Lite and Pro experiences. Public technical signals are limited but meaningful: Ajaib''s hiring pages describe a rapidly scaling microservices platform with API/UI/contract/performance testing, CI/CD pipelines, and chaos-engineering style reliability work, while the public GitHub organization and client-only research PDFs show a real internal engineering and content apparatus. The strongest weaknesses are not on feature breadth but on transparency: there is no retained public trading API documentation, no public status page or incident-history pack in the reviewed sources, and third-party review aggregators still surface outage and support complaints. The best-supported
    view is that Ajaib has substantial product depth and active software operations, but some reliability, compliance, and architecture details remain opaque.'
sections:
- id: product-modules-and-user-jobs
  title: Product modules and user jobs
  body: 'Ajaib''s product definition is now clearly modular. The official website, App Store, Google Play listing, and Lite/Pro explainer all describe one app that spans Indonesian stocks, mutual funds, bonds, crypto assets, and U.S. stocks, while the user experience is deliberately split between Lite for simpler goals-based investing and Pro for active trading. That matters because Ajaib is not only a brokerage front end; it is trying to serve multiple investor jobs inside one interface, from first-time accumulation to fast order entry and risk-managed trading. The Workable careers page sharpens the module map further by showing the staged rollout of mutual funds in 2019, stocks in 2020, crypto and margin trading in 2022, and bonds in 2024.


    The workflow evidence is strongest where the app surfaces are explicit. New users can open an account online in around five minutes, begin with small-ticket investing, receive mutual-fund and bond recommendations in Lite mode, and graduate into Ajaib Pro features such as advanced charts, order-book visibility, fast execution, stop loss, take profit, and broker summary. In that sense, the platform''s product strategy is not only breadth; it is lifecycle design. Ajaib wants one beginner to remain inside the same ecosystem as that user becomes more active and more multi-asset.'
