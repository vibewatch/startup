summary:
  headline: >-
    Ajaib combines real retail scale, strong product breadth, and credible growth signals, but
    public evidence still leaves too much uncertainty on consolidated financial quality,
    customer-quality metrics, and risk-adjusted valuation to underwrite the unicorn mark
    aggressively.
