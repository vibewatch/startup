companyProfile:
  summary: >-
    Ajaib was founded in 2018 by Anderson Sumarli and Yada Piyajomkwan and has grown into
    Indonesia's first investment-fintech unicorn with a broad retail-investing stack spanning local
    equities, mutual funds, bonds, crypto, and U.S. stocks. Public evidence indicates strong retail
    reach, 7M+ users by early 2026, and continued product segmentation through Lite and Pro.
    However, the company remains private and under-disclosed at the consolidated level: public
    materials do not yet provide a clean bridge from audited broker-entity results to the wider
    group revenue, margin, and customer-quality narrative.
