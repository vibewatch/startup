  topStrengths:
    - Real retail-investing scale with public early-2026 user counts above 7 million
    - Broad multi-asset product stack spanning local equities, funds, bonds, crypto, and U.S. stocks
    - Strong strategic category position as Indonesia's first investment-fintech unicorn
    - Product segmentation through Lite and Pro supports internal user expansion over time
    - Public growth estimates imply that the business may already be operating at meaningful late-stage scale
  topRisks:
    - >-
      Consolidated financial disclosure remains too weak to reconcile audited entity results with group-level revenue
      claims
    - >-
      Regulatory and consumer-protection risk around leverage, trade-limit clarity, and novice-user trust can compress
      valuation quickly
    - Public customer-scale proof is much stronger than funded-account, retention, or monetization-quality proof
    - The historic $1B valuation anchor may already price in outcomes that public evidence cannot fully verify
    - No public detail on cap-table terms, liquidation preferences, or any later mark-to-market after the 2021 Series B
  unresolvedGaps:
    - Consolidated or bridged group financials linking broker-entity filings to the wider revenue narrative
    - Funded-account, cohort-retention, and product-level customer-quality metrics
    - Latest cap table, preference stack, and any post-2021 financing or secondary pricing
    - Product-level contribution margin and compliance-cost burden across entities
    - Final regulator and product-remediation record for the 2025 margin-dispute episode
