evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, committee structure, and post-Series-B governance rights.
    whyItMatters: >-
      Founder quality is reasonably clear, but board independence and investor-control mechanics cannot be judged from
      the retained public pack.
    diligencePath: Request the latest board list, shareholder agreement summary, and any governance-rights schedule from management.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited revenue, net revenue, gross margin, profitability bridge, and KPI definitions for 2024-2026.
    whyItMatters: >-
      External databases and media relays provide only indicative revenue signals, which is not enough to underwrite
      operating quality.
    diligencePath: Request audited or management-certified financial statements plus KPI definitions by product line.
    relatedQuestionRefs:
      - QO019
  - type: conflicting-data
    severity: material
    topic: user-definitions
    missingEvidence: A reconciled definition of registered users, funded investors, active traders, and cumulative app customers.
    whyItMatters: Different sources use different labels for scale, which can distort per-user economics and adoption analysis.
    diligencePath: Ask management for a KPI bridge from registered accounts to funded, active, and monetized users.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: minor
    topic: regulatory-registers
    missingEvidence: Direct regulator register entries for every Ajaib legal entity across securities, crypto, and overseas stocks.
    whyItMatters: >-
      Official company disclosures are strong, but independent regulator lookup would improve confidence in entity-level
      licensing scope.
    diligencePath: >-
      Pull named-entity entries from OJK, Bappebti, IDX, and any relevant BI public registers and attach them by
      legal-entity name.
    relatedQuestionRefs:
      - QO009
  - type: private-evidence-only
    severity: material
    topic: cap-table-visibility
    missingEvidence: Fully diluted cap table, current shareholder percentages, and any secondary transfers after the 2021 Series B.
    whyItMatters: >-
      The investor map is visible at the brand-name level, but control, dilution, and liquidation economics are still
      opaque.
    diligencePath: Request the latest cap table, financing documents, and shareholder-rights schedule from management or counsel.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-precision
    missingEvidence: Canonical ISO dates for the 2018 company formation and the 2019 commercial launch phase.
    whyItMatters: >-
      The chronology is directionally strong, but a few early milestone dates are approximate rather than
      document-perfect.
    diligencePath: >-
      Pull company-incorporation records and any archived launch announcement to replace year-only placeholders with
      exact dates.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: active-user-conversion
    missingEvidence: Ajaib-specific data on funded accounts, monthly active traders, product attach rates, and revenue per active user.
    whyItMatters: >-
      Market-account counts are large, but they do not show what share of users convert into durable or monetizable
      behaviour on Ajaib.
    diligencePath: Request cohort data by product, monthly activity, and funded-account conversion from management.
    relatedQuestionRefs:
      - QM024
      - QM025
  - type: enumeration-incomplete
    severity: minor
    topic: segment-coverage
    missingEvidence: >-
      A cleaner public breakdown of beginner, active-trader, affluent, and dormant-account segments inside Indonesia’s
      digital-investment market.
    whyItMatters: >-
      The buyer map is directionally strong but still triangulated from cross-source proxies rather than one canonical
      segmentation dataset.
    diligencePath: Combine broker disclosures, regulator data, and paid market surveys to refine segment weights and overlaps.
    relatedQuestionRefs:
      - QM010
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: tamsamprecision
    missingEvidence: >-
      A consistent, non-overlapping market model linking SID counts, mutual-fund investors, crypto investors, and Ajaib
      user metrics.
    whyItMatters: Current public counts overlap and can exaggerate addressable or serviceable market size if treated as additive.
    diligencePath: Build a unified market model from OJK/KSEI raw data and company cohort disclosures.
    relatedQuestionRefs:
      - QM022
      - QM023
    relatedTableRefs:
      - TM002
  - type: stale
    severity: minor
    topic: wealth-summary-2021-bases
    missingEvidence: More current public asset-allocation splits than the 2021 base year in the GlobalData executive summary.
    whyItMatters: Portfolio-mix and affluent-allocation claims are useful context, but they are anchored on an older base period.
    diligencePath: Refresh the portfolio-allocation lens with 2025-2026 surveys or a newer wealth-market dataset.
    relatedQuestionRefs:
      - QM009
  - type: conflicting-data
    severity: material
    topic: activity-vs-accounts
    missingEvidence: A reconciled view of dormant versus active retail accounts across equities, mutual funds, and crypto.
    whyItMatters: The market may look deeper from account totals than it really is for transaction-driven platforms.
    diligencePath: Compare raw KSEI account series with broker-side activity disclosures and regulator turnover statistics.
    relatedQuestionRefs:
      - QM021
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: material
    topic: win-loss-data
    missingEvidence: Segment-level win-loss data showing when Ajaib beats Stockbit, Bibit, Bareksa, Pluang, or Pintu.
    whyItMatters: Public positioning shows overlap, but not who actually wins acquisition or retention by user type.
    diligencePath: Request cohort-level acquisition and retention splits by first product, channel, and displaced competitor.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: pricing-realization
    missingEvidence: Effective brokerage, spread, or product-level monetization by cohort and negotiated pricing path.
    whyItMatters: Packaging is visible, but realized economics determine whether breadth is actually attractive or subsidized.
    diligencePath: Request realized fee bands, blended take rates, and margin by product line.
    relatedQuestionRefs:
      - QP017
      - QP025
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: minor
    topic: active-user-overlap
    missingEvidence: Independent data on how many Indonesian retail investors actively use more than one investment app.
    whyItMatters: The multi-homing thesis is plausible but not quantified in the retained public pack.
    diligencePath: Look for app-usage panel data, consumer survey results, or management disclosures on funded-user overlap.
    relatedQuestionRefs:
      - QP018
      - QP025
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-universe
    missingEvidence: A fully exhaustive local competitor map including Indodax, Reku, IPOT, and other narrower substitutes.
    whyItMatters: The chapter covers the most decision-relevant peers but not every Indonesian investing or crypto brand.
    diligencePath: >-
      Expand the landscape with regulator lists and category-by-category app discovery if deeper market mapping is
      required.
    relatedQuestionRefs:
      - QP001
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: cross-sell-quality
    missingEvidence: >-
      Asset-per-user, funded-user, and cross-sell conversion metrics that prove Ajaib's breadth leads to higher wallet
      share.
    whyItMatters: >-
      Breadth is the core moat claim, but public evidence does not show whether customers actually consolidate activity
      inside Ajaib.
    diligencePath: Request a funnel from registered users to funded users, then to two-asset and three-asset active cohorts.
    relatedQuestionRefs:
      - QP023
      - QP025
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: consolidated-financials
    missingEvidence: >-
      Audited consolidated FY2024 and FY2025 financial statements spanning securities, mutual-fund, crypto, and
      U.S.-stocks entities.
    whyItMatters: >-
      Without a group-level bridge, investors cannot reconcile broker filings with much larger public revenue estimates
      or value the platform as one business.
    diligencePath: Request full consolidated statements plus an entity-by-entity revenue, asset, and profit bridge.
    relatedQuestionRefs:
      - QI017
      - QI020
    relatedTableRefs:
      - TI001
      - TI005
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: GMV, funded active users, take rate, CAC, payback, retention, and product-level margin by asset class.
    whyItMatters: Growth without these metrics cannot be translated into durable economics or valuation confidence.
    diligencePath: Request monthly cohort reporting across stocks, funds, crypto, and global assets.
    relatedQuestionRefs:
      - QI023
      - QI025
    relatedTableRefs:
      - TI003
      - TI005
  - type: conflicting-data
    severity: material
    topic: scope-reconciliation
    missingEvidence: >-
      A clean reconciliation between PT Ajaib Sekuritas Asia entity filings, third-party group revenue estimates, and
      broader Ajaib headcount figures.
    whyItMatters: >-
      Mixed-scope numbers can make the business look either much smaller or much larger than it really is, distorting
      valuation and risk analysis.
    diligencePath: Obtain management-certified KPI definitions and entity scope for every published revenue or headcount metric.
    relatedQuestionRefs:
      - QI017
      - QI024
    relatedTableRefs:
      - TI001
      - TI004
  - type: private-evidence-only
    severity: material
    topic: liquidity-and-runway
    missingEvidence: >-
      Current group cash on hand, intra-group funding flows, debt terms, and downside runway under lower trading
      activity.
    whyItMatters: Capital adequacy cannot be stress-tested from balance-sheet snapshots and funding history alone.
    diligencePath: Request treasury dashboard, debt schedule, cash forecast, and regulatory capital buffers by entity.
    relatedQuestionRefs:
      - QI016
    relatedTableRefs:
      - TI004
      - TI005
  - type: missing-source
    severity: minor
    topic: pricing-disclosure
    missingEvidence: >-
      A retained official rate card or revenue-recognition note that explains realized customer pricing across the
      product stack.
    whyItMatters: Public product breadth is clear, but monetization quality is not.
    diligencePath: >-
      Collect the latest brokerage fee schedule, spread policy, FX or partner-fee arrangements, and accounting treatment
      by product.
    relatedQuestionRefs:
      - QI023
    relatedTableRefs:
      - TI002
  - type: missing-source
    severity: material
    topic: public-api-docs
    missingEvidence: Official developer portal or trading-API documentation for external programmatic access.
    whyItMatters: >-
      Without it, we cannot tell whether Ajaib supports partner integrations, institutional APIs, or only closed
      consumer workflows.
    diligencePath: >-
      Ask management whether APIs exist, for whom, and under what compliance constraints; request sandbox or API docs if
      available.
    relatedQuestionRefs:
      - QE021
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: status-and-incidents
    missingEvidence: Public status page, uptime history, incident postmortems, or structured outage archive.
    whyItMatters: >-
      Review complaints suggest reliability risk, but public operating evidence is too sparse to judge severity or
