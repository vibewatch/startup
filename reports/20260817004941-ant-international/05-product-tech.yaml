    "researchQuestions": [
      {
        "id": "QE001",
        "question": "What are Ant International’s core product modules?",
        "type": "enumeration",
        "targets": [
          "contentRequirements/0",
          "contentRequirements/1",
          "plannedTables/product-module-asset-matrix"
        ],
        "status": "answered",
        "answerSummary": "The core modules are Alipay+, Antom, WorldFirst, Bettr, ANEXT Bank / credit services, and 2C2P by Antom."
      },
      {
        "id": "QE002",
        "question": "How should those modules be understood in customer-workflow terms?",
        "type": "mechanism",
        "targets": [
          "contentRequirements/0",
          "plannedTables/workflow-use-case-table"
        ],
        "status": "answered",
        "answerSummary": "They map from wallet access and merchant acceptance to settlement, accounts, treasury, and embedded finance."
      },
      {
        "id": "QE003",
        "question": "What does Alipay+ actually do in the stack?",
        "type": "verification",
        "targets": [
          "contentRequirements/0"
        ],
        "status": "answered",
        "answerSummary": "Alipay+ acts as a unified wallet gateway connecting merchants, wallets, QR schemes, and digital engagement tools."
      },
      {
        "id": "QE004",
        "question": "What does Antom actually do in the stack?",
        "type": "verification",
        "targets": [
          "contentRequirements/0"
        ],
        "status": "answered",
        "answerSummary": "Antom is the merchant-payment layer offering acquiring, acceptance, settlement, and local payment method connectivity."
      },
      {
        "id": "QE005",
        "question": "What does WorldFirst actually do in the stack?",
        "type": "verification",
        "targets": [
          "contentRequirements/0"
        ],
        "status": "answered",
        "answerSummary": "WorldFirst provides global account, collection, payout, FX risk management, and SME treasury services."
      },
      {
        "id": "QE006",
        "question": "What does Bettr / embedded finance actually do in the stack?",
        "type": "verification",
        "targets": [
          "contentRequirements/0"
        ],
        "status": "answered",
        "answerSummary": "Bettr extends the stack into inclusive financing, credit-tech, and real-time treasury products."
      },
      {
        "id": "QE007",
        "question": "What are the key architecture layers in Ant International’s operating model?",
        "type": "enumeration",
        "targets": [
          "contentRequirements/2",
          "plannedTables/technology-operating-architecture-table",
          "plannedFigures/product-architecture-map"
        ],
        "status": "answered",
        "answerSummary": "The key layers are consumer/wallet access, merchant acceptance, settlement/FX/accounts, treasury intelligence, finance/credit, and risk/compliance."
      },
      {
        "id": "QE008",
        "question": "How important is one-time integration / unified gateway design to the product story?",
        "type": "mechanism",
        "targets": [
          "contentRequirements/2"
        ],
        "status": "answered",
        "answerSummary": "It is central because the product pitch repeatedly emphasizes one integration unlocking many methods, wallets, and markets."
      },
      {
        "id": "QE009",
        "question": "What role did 2C2P play in strengthening the architecture?",
        "type": "verification",
        "targets": [
          "contentRequirements/2"
        ],
        "status": "answered",
        "answerSummary": "2C2P added Southeast Asian acquiring, payout, and payment-method depth and now sits under Antom."
      },
      {
        "id": "QE010",
        "question": "What role do treasury and FX models play in the product?",
        "type": "mechanism",
        "targets": [
