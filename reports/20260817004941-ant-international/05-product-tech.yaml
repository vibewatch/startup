    {
      "id": "architecture-operating-model",
      "title": "Architecture and Operating Model",
      "body": "Public disclosures point to a multi-rail architecture built around one-time integration, local method access, merchant digitisation, and treasury intelligence. The Alipay+ home page describes a unified wallet gateway connecting billions of consumers, 50-plus mobile payment providers, 10-plus national payment networks, 220-plus markets, and very large QR and NFC merchant footprints. Ant’s own home page describes Antom as a unified merchant payment layer and WorldFirst as a one-stop cross-border account and treasury service. The 2C2P acquisition added an important Southeast Asian acquiring and payout capability, while Antom’s 2026 transaction release says the platform continued to expand direct acquiring and improve payment success for clients. Bettr adds an internal treasury and credit-tech layer, including a Time-Series Transformer model for FX and cash-flow exposure and a tokenised settlement tool for wholesale treasury flows within the Ant ecosystem. The result looks less like a monolithic app and more like a set of shared infrastructure components: wallet connectivity, merchant acceptance, acquiring, FX and treasury logic, account services, risk and fraud controls, and credit services. This architecture is particularly well suited to fragmented emerging-market corridors where local methods, merchant education, and balance-sheet efficiency all matter at once.",
