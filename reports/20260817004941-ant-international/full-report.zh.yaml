      - number: '3.3'
        title: 功能宽度、定价与产品市场匹配
        blocks:
          - type: paragraph
            body: >-
              有用的比较不只是规模，而是每家服务商能为同一客户打包哪些能力。Ant International 可以把 Alipay+ 消费者钱包受理、Antom 商户收单、WorldFirst
              多币种中小企业账户和嵌入式金融服务放在一起。很少有同行覆盖完整栈。Stripe 和 Adyen 在 API-first 商户受理、编排和企业授权优化上更强，但它们天然不是由钱包发端的消费者网络。Wise
              在价格清晰度上高度差异化，拥有结构性较低的 52 个基点费率，并围绕中端市场 FX 建立强品牌。Payoneer 在商业付款和市场平台流量上强，但价格模型仍取决于走廊，在银行卡和非本币场景下可能明显高于
              Wise。PayPal 拥有巨大用户触达和卖家信任，但它披露的开票和 FX 费用层明显高于最透明的金融科技挑战者。Airwallex 和 WorldFirst 在中小企业资金管理工作流上最接近
              Ant：两者公开页面都强调主要货币按银行间汇率上浮 0.5%、多币种账户，以及数十种货币的本地收款或付款。Nium 和 Thunes
              更偏基础设施，吸引的是较少关心品牌、更多关心支付网络覆盖的机构和平台。结论是，Ant 最强的匹配场景，是本地支付方式、新兴市场受理和中小企业资金管理需求必须一起解决的地方；最弱的场景，是买方把透明 FX
