      - number: '3.2'
        title: 直接对手集群及其胜点
        blocks:
          - type: paragraph
            body: >-
              Wise 和 Payoneer 为透明的中小企业资金流动、卖家付款和多币种运营账户设定了标杆。Wise 报告 FY2026 有 19 million 活跃客户、US$243.5 billion 跨境交易量、52
              个基点费率，75% 的支付在 20 秒内完成；仅其商业产品就称，每月有超过 700,000 家全球企业移动 US$16 billion。Payoneer 报告 2025 年收入 US$1.05
              billion，并定位覆盖 190 多个国家和 70 多种货币，在市场平台、自由职业者和 SMB 收款上尤其强。Stripe、PayPal 和 Adyen 是更强的商户受理和企业结账竞争者。Stripe 强调覆盖
              195 个国家、135 多种货币、100 多种支付方式，并在 46 个市场本地收单；PayPal 强调 400 million 用户网络、200 多个市场和深度结账分发；Adyen
              把全球收单、本地处理和企业性能优化结合起来。架构上最接近的同行是 dLocal、Nium、Thunes 和 Airwallex。dLocal 专注高增长新兴市场，在 44 多个国家提供 1,000
              多种支付方式；Nium 聚焦全球付款、银行卡和资金管理 API；Thunes 强调其直连 140 个国家银行、钱包和银行卡的网络；Airwallex 已成为大型多产品商业金融平台，拥有 200,000
              多家公司客户、80 张牌照和超过 US$1 billion 年化收入。Ant 最接近的战略挑战，来自这些对手中任何一个能在不丢失走廊深度的前提下，缩小商户受理与资金管理基础设施之间的差距。
