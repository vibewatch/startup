      - number: '1.5'
        title: 战略背景与不利因素
        blocks:
          - type: paragraph
            body: >-
              主要不利框架不是当前经营困境，而是政治和披露风险。Reuters 关于稳定币牌照的报道引用了 Ant International
              平台技术负责人说法：公司正认真考虑在多个司法辖区申请牌照，明确目的是改善全球支付，而不是专注加密交易。这一雄心与商业模式在战略上相符，但也把公司更深地拉入新加坡及其他市场的牌照、AML、储备和跨境监管问题。更广泛地看，Ant
              International 的故事无法与 Ant Group 历史切开：母公司 2020 年 IPO
              暂停、后续重组和持续地缘政治审视，仍会影响监管者和外国交易对手如何看待一家注册在新加坡、但有中国所有权根源的支付基础设施公司。Startup Fortune 2026 年 7
              月分析走得更远，认为分拆部分是为了让海外业务在全球融资和合作上获得更多空间，不必背负母公司全部中国内地监管重量。这不否定业务本身，但意味着尽调应当把治理分离和监管许可放到与商户增长叙事同等重要的位置。
