  - id: TV002
    title: 可比估值表
    slug: comparable-valuation-table
    columns:
      - 公司
      - 状态
      - 公开 / 最新标记
      - 它说明什么
      - 对 Ant 的映射
    rows:
      - - Payoneer
        - 上市公司
        - ~US$2.41B 市值（2026 年 8 月）
        - 即便完整公开披露，跨境专家公司的交易估值仍不高
        - 只有规模和可选项真正更强，Ant 才配得上溢价
      - - PayPal
        - 上市公司
        - ~US$53.15B 市值（2026 年 8 月）
        - 全球规模化标杆，披露和信任更成熟
        - 相比这种确定性，Ant 应有明显折价
      - - Adyen
        - 上市公司
        - ~US$38.77B 市值（2026 年 8 月）
        - 高质量支付基础设施标杆
        - Ant 在披露和质量证明上仍明显更早期
      - - Airwallex
        - 非上市
        - US$8B Series G 轮标记
        - 本组中最接近的高增长非上市跨境可比公司
        - Ant 的 US$11.2B 价格隐含了规模和财资叙事溢价
      - - Nuvei
        - 上市公司 / 私有化交易历史
        - 仅作公开市值参照
        - 说明增长质量或叙事走弱时，支付规模也会被降估值
        - Ant 不应假设估值溢价会永久存在
      - - Wise
        - 上市公司
        - 官方 FY2026 业绩与公开披露节奏
        - 证明跨境金融里持续披露的价值
        - Ant 必须补上披露缺口，才可能获得类似上市公司的定价待遇
    notes: 公开标记只能做方向性可比，不是 EV/收入的一一对照；原因是 Ant 独立公开财务披露仍不完整。
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV016
      - CV017
      - CV018
      - CV019
    type: enumeration
    enumerationScope:
      coverage: sample
      basis: >-
        The comparable set is intentionally selective rather than exhaustive, combining the most decision-useful public
        and private benchmarks visible from accessible sources as of the run date.
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    slug: bull-base-bear-scenario-table
    columns:
      - 情景
      - 退出估值
      - 相对 US$11.2B 入场价的 MOIC
      - 核心假设
      - 必须成立的条件
    rows:
      - - 乐观
        - US$18B-US$24B
        - 1.6x-2.1x
        - 财资业务变现、利润率证明和披露均改善
        - Ant 证明盈利质量更高，并扩大可信企业用例
      - - 基准
        - US$12B-US$16B
        - 1.1x-1.4x
        - 稳定增长、部分定价压力、披露部分改善
        - 规模继续扩大，但确定性折价仍在
      - - 悲观
        - US$7B-US$9B
        - 0.6x-0.8x
        - 监管、竞争或利润率质量不及预期
        - 网络宽度无法抵消价格和披露压力
    notes: 区间情景比点估值更站得住脚，因为公开数据不足，无法直接锚定倍数。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV024
      - CV026
      - CV027
  - id: TV004
    title: 承销假设表
    slug: underwriting-assumption-table
    columns:
      - 假设领域
      - 乐观情形
      - 基准情形
      - 悲观情形
      - 证据质量
    rows:
      - - 增长质量
        - 商户和 SME 规模转化为更强变现
        - 增长延续，但结构仍部分不透明
        - 增长放缓，抽佣率收紧
        - 中
      - - 披露
        - 独立经济性达到投资级
        - 有所改善，但仍不完整
        - 缺口延续
        - 低到中
      - - 产品结构
        - 财资 / WorldFirst / 更高价值产品加深挂载
        - 支付仍占主导，挂载逐步提升
        - 相邻业务仍以叙事为主
        - 中
      - - 监管
        - 没有重大挫折；代币化路径保持建设性
        - 监管路径可控但更慢
        - 牌照或政策拖累出现
        - 中
      - - 退出路径
        - IPO 或战略出售，采用更高信心倍数
        - 买方兴趣有纪律，估值中度重估
        - 几乎不重估，可能下调估值
        - 中
    notes: 披露假设是最能拉开各情景的摆动因素。
    claimRefs:
      - CV014
      - CV015
      - CV024
      - CV025
      - CV028
      - CV030
  - id: TV005
    title: 入场纪律与优先条款表
    slug: entry-discipline-and-preferred-terms-table
    columns:
      - 项目
      - 为何重要
      - 偏好立场
      - 若拿不到的后果
    rows:
      - - 入场价格
        - 本轮价格已经计入执行兑现
        - 争取折价，或用结构化条款托住下行
        - 基准情形下回报变薄
      - - 信息权
        - 公开披露不完整
        - 季度管理账与 KPI 包
        - 投资人仍会结构性失明
      - - 按比例跟投 / 所有权
        - 投资假设兑现时，需要保住上行
        - 强按比例跟投权
        - 即便执行良好，上行也会被稀释
      - - 优先权可见度
        - 分配瀑布会重塑普通股结果
        - 完整股权结构表与清算优先权图谱
        - 真实下行无法建模
      - - 治理访问
        - 复杂受监管业务需要监督
        - 董事会观察员或等效权利
        - 监控会从主动变成被动
    notes: 在这里，更好的条款对回报的贡献可能不亚于增长小幅改善。
    claimRefs:
      - CV032
      - CV033
      - CV034
  - id: TV006
    title: 最终尽调问题与投资假设破裂表
    slug: final-diligence-asks-and-thesis-break-table
    columns:
      - 优先级
      - 要求 / 触发器
      - 为何重要
      - 若未解决 / 被触发
    rows:
      - - P1 阻断项
        - 独立、接近审计口径的财务数据与利润率桥
        - 没有它，估值精度太弱
        - 维持有条件关注，或放弃
      - - P1 阻断项
        - 股权结构表与清算优先权
        - 建模普通股结果必须拿到
        - 不按上一轮全价承做
      - - P1 阻断项
        - 队列留存与大客户质量
        - 如果缺少留存质量，交易量可能被高估
        - 下调倍数和情景上行
      - - P1 阻断项
        - 欺诈损失、准备金与对冲政策数据
        - 财资和外汇规模需要有纪律的控制
        - 风险评级显著上升
      - - 投资假设破裂
        - 监管 / 伙伴 / 定价恶化
        - 这些因素最快会让叙事降估值
        - 下调为放弃或减值情形
    notes: 这些要求有意收窄到决策关键项，而不是泛泛的数据室全范围清单。
    claimRefs:
      - CV035
      - CV036
      - CV037
      - CV038
      - CV040
