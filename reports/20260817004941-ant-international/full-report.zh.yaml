      - number: '4.2'
        title: 运营牵引力与资本充足性
        blocks:
          - type: paragraph
            body: >-
              即使没有审计报表，业务披露的规模也足以支撑严肃的成长阶段承销讨论。Ant International 称，2025 年其核心新兴市场处理超过 2 billion 笔交易，并在全球服务超过 150 million
              家商户，其中 90% 是中小企业。2024 年可持续发展披露还补充说，Alipay+ 连接超过 1.7 billion 个用户账户，WorldFirst 帮助超过 1.2 million 家中小企业把生意卖向
              200 多个市场，2024 年累计交易价值约 US$100 billion；Forbes 后来把 WorldFirst 描述为在 Ant 更广商户伞下服务 1.6 million 家中小企业。因此，2026 年约
              US$1.2 billion Series A 资助的是一个已经规模化的运营平台，而不是收入前建设。Business Wire 报道称，资金将用于加速 AI 驱动的金融工具和国际扩张；Reuters
              系报道把业务估值放在 US$10-11.2 billion 区间。表面上看，资本充足性较强，因为 Ant International 还保留来自 Ant Group 和 Alibaba
