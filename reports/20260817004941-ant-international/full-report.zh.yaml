companyProfile:
  summary: >-
    Ant International 是 Ant Group 更大范围重组后，在 2024 年独立运营的国际业务板块，总部位于新加坡。业务围绕 Alipay+、Antom、WorldFirst、Bettr /
    资金管理联动服务组织：Alipay+ 负责跨境商户和钱包连接，Antom 负责支付受理和编排，WorldFirst 服务中小企业跨境账户和贸易赋能，Bettr /
    资金管理联动服务覆盖更广的金融普惠和流动性场景。公开材料称，公司服务超过 150 million 家商户，连接超过 2 billion 个用户账户，并在 2026 年 7 月完成约 US$1.2 billion Series
    A，估值约 US$11.2 billion。
  foundedDate: '2024-03-20'
  foundingLocation: Singapore
  headquarters: Singapore
  productSummary: 产品支柱包括 Alipay+、Antom、WorldFirst 和 Bettr，覆盖支付受理、钱包互联互通、中小企业账户与 FX、收单、资金管理联动基础设施，以及配套金融服务工具。
  customerFocus: 核心客户包括商户、市场平台、移动钱包生态、跨境销售的中小企业，以及在新兴和国际走廊使用支付与资金管理能力的企业或平台。
  businessModel: 收入看起来来自商户支付费用、跨境结算和 FX 价差、账户及增值服务费，以及更广泛的资金管理 / 嵌入式金融变现，但独立分部经济性仍未公开披露。
  stage: late-stage private
