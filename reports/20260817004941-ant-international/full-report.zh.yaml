      - number: '4.3'
        title: 单位经济性、利润率潜力与估算区间
        blocks:
          - type: paragraph
            body: >-
              Ant International 没有披露收入，投资者只能从同行定价和商业模式组合推理。公开可比公司显示的变现包络很宽：Wise 报告 FY2026 平均费率 52 个基点，Airwallex
              公开宣传主要货币与其他货币分别高于银行间 0.5%-1.0%，Payoneer 按用例披露多档 1%-4% 费用，Stripe 在基础处理费上叠加国际和 FX 加价，PayPal 披露 1.5% 国际开票费加
              2%-4% FX 价差。Ant 大概率落在这些模式的混合版本中：像资金管理或 FX
              基础设施时更低，像商户受理或跨境钱包结账时更高。这说明，标题交易笔数本身不是收入的好代理，产品组合和走廊组合更重要。利润率潜力也应按业务线显著变化。本地支付网络和合规基础设施到位后，商户和 FX
              流量可以高效扩张；但嵌入式信贷会引入资本、损失和资金成本风险。最强的单位经济性逻辑是，Ant
              的多产品捆绑能通过账户、资金管理、支付和增值工具持续提高单商户收入。最弱的逻辑是，核心仍主要是支付量，软件式利润率或经常性可见度有限。公开证据支持前一种可能，但还不足以证明。
