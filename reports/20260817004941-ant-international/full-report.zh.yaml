      - number: '7.3'
        title: 财务与模型风险
        blocks:
          - type: paragraph
            body: >-
              核心财务风险不是显性的困境，而是在很有分量的估值下，盈利质量披露不足。全行业跨境支付费率都在收紧，因此 Ant
              需要让交易量、商户广度和更高价值产品附加增长得快于定价压缩。这可以做到，但公开来源没有提供足够独立信息，去有把握地承销收入结构、利润率、欺诈损失、储备政策或队列耐久性。资金管理和代币化资金策略可能降低结算摩擦，并打开新的收入或成本优势，但公开证据目前更能证明运营可行性，而不是经济性更优。2026
              年 Series A 估值约 US$11.2
              billion，提高了模型错误的代价，因为投资者已经在为未来执行买单。嵌入式金融邻接业务让挑战更深：账户、资金管理、融资和外汇带来的风险栈，比纯支付网关更宽。没有类似审计的单位经济和治理披露，这一项仍属于中高风险。
