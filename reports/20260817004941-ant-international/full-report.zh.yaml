      - number: '3.4'
        title: 护城河耐久性与 Ant 面临的竞争风险
        blocks:
          - type: paragraph
            body: >-
              Ant International 的护城河真实存在，但不均匀。最强防御要素是双边触达：Ant 官方材料称，公司借数十个钱包和 QR 方案，把超过 150 million 家商户（主要是中小企业）连接到超过
              1.7-1.8 billion 个用户账户。纯 B2B 玩家很难快速复制这种消费者到商户的桥。Ant 也受益于深厚的 APAC
              和新兴市场经验，这在旅游、钱包受理和本地支付网络集成中重要。可是，当买方优先考虑明确价格、合规中立性或开发者声誉时，护城河就弱一些。Wise 更容易按价格基准比较；Stripe 仍是 API
              驱动支付的默认心智模型；Adyen 是经验证的企业本地收单运营商；当买方想要新兴市场最后一公里覆盖、但不想承担中国关联治理问题时，dLocal 或 Thunes
              可能更受偏好。因此，竞争风险最高的四个地方是：Stripe 和 Adyen 可以提高转化率的企业结账；Wise、Payoneer 和 Airwallex 可以简化切换的中小企业自助账户；Nium 和 Thunes
              可以赢下伙伴的付款和资金管理 API；以及 Ant 关联历史可能减少入围名单的地缘政治敏感市场。核心尽调结论是，Ant
              不是一个只有单一护城河分数的通用支付玩家。网络触达、本地方式、中小企业服务和钱包互联互通相互强化时，它最强；任务坍缩为纯价格、纯 API 或纯中立性决策时，它更弱。
