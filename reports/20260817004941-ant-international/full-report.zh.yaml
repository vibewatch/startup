        title: 按客户工作流理解产品组合
        blocks:
          - type: paragraph
            body: >-
              Ant International 的产品设计明显以工作流为中心。入口是 Alipay+，它让商户和支付伙伴通过统一网关接入消费者钱包、QR 方案和跨境支付体验。Antom 更靠近商户运营层，在 50
              多个国家和地区支持线上线下受理、本地支付方式、银行卡和结算，同时把商户连接到 200 多个市场、100 多种货币的消费者。WorldFirst
              处理商户或中小企业收款之后的资金管理和账户工作流：全球收款、付款、汇率转换风险管理和供应链融资。Bettr、ANEXT Bank 和全球信贷服务把工作流进一步延伸到借贷、资金管理智能和嵌入式金融。这意味着 Ant
              不只是帮商户收钱；它越来越想拥有从消费者支付方式选择，到结算、FX、营运资本和数字化运营的完整路径。这个产品逻辑是公司差异化的核心，因为它提高切换成本，也让每个新模块接到其他模块后更有价值。
