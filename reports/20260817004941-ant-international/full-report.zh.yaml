            body: >-
              公开客户记录里，留存证据最弱。Ant International
              不披露净留存率（NRR）、总留存、流失率、续约率、合同期限、队列衰减或头部客户集中度。不过仍有一些可用代理指标。第一，若干合作关系看起来是多年期且持续加深，而不是一次性试点：Ant 提到自 2017 年以来与
              GCash 合作，并逐步扩展到银行卡、结账和到店受理；Alipay+ 与国家 QR 方案的互联互通项目更像结构性集成，不是短期活动；WorldFirst
              在客户财务工作流中的运营角色，也意味着切换摩擦远高于单个支付插件。第二，公司沿工作流持续交叉销售：钱包受理可以延伸到商户收单、结算、WorldFirst 资金管理工具，以及 Bettr
              等金融产品。第三，公开的合作伙伴和客户评论一贯强调运营便利、速度或业务扩张，而不只是新鲜感。话虽如此，缺少量化留存披露仍然重要。公司如此依赖广泛合作伙伴，客户耐久性最终必须靠产品级队列数据、合同续约时间表和分客群流失率来证明。
