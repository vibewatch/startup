  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现架构
        blocks:
          - type: paragraph
            body: >-
              Ant International 看起来不是靠一项简单支付费变现，而是横跨五条相互连接的收入流。第一是借 Antom 和 Alipay+ 受理产生的商户受理和处理收入，商户为跨境结账、本地支付方式、QR
              受理和结算付费。第二是 FX 和资金管理收入，尤其来自 WorldFirst 及配套中小企业产品，外汇价差、跨币种资金池和流动性管理很可能重要。第三是多币种账户、收款和付款带来的账户及平台收入。第四是 AI
              驱动商户工具、集成和嵌入式金融模块带来的软件和 API 关联收入。第五是嵌入式金融里的信贷或信贷邻近经济性，可能来自自营、伙伴驱动或转介。Ant
              官方披露越来越强调增值软件和资金管理能力，而不只是原始支付吞吐量：2024 年可持续发展报告突出 AI 支付集成、FX 预测模型和信贷工具；2026 年交易新闻稿强调 AI 支付助手、资金管理和税务 /
              合规工具。公开同行定价支持一个判断：Ant 的混合变现可能从低基点 FX
              经济性到多百分点商户受理定价都有，取决于走廊和产品。这种宽度在战略上有利，因为它能分散收入，但也让外界更难仅靠公开来源推断真实毛利率或经常性收入质量。
