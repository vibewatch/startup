    approximationNotes: 基于官方产品描述抽象出的概念性堆栈；并非专有内部架构图。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE009
      - CE010
      - CE011
      - CE012
    data:
      layers:
        - label: 消费者 / 钱包接入
          detail: Alipay+ 钱包网关、二维码方案、银行 App，以及覆盖 220+ 个市场的消费者支付方式。
        - label: 商户受理
          detail: Antom 和 2C2P by Antom 支持线上 / 线下结账、本地支付方式、银行卡、收单、出款和 汇款。
        - label: 结算 / 账户 / FX
          detail: WorldFirst 全球账户、收款、出款、结算、FX 换汇和财资工作流。
        - label: 财资智能
          detail: Falcon 和 Bettr 财资工具用于预测 FX 敞口、提升流动性可视化，并实时优化财资。
        - label: 金融 / 信贷层
          detail: Bettr、ANEXT Bank 和全球信贷服务支持贷款、嵌入式金融和伙伴赋能。
        - label: 风险 / 信任 / 合规
          detail: 合规架构、AI 安全控制、反 deepfake 能力和受监管主体监督。
  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: standard
    summary: 展示商户或 SME 如何沿 Ant International 堆栈，从支付受理走向财资和金融。
    approximationNotes: 呈现面向外部客户的工作流逻辑，而不是逐屏还原产品行为。
