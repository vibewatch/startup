  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景与可比框架
        blocks:
          - type: paragraph
            body: >-
              Ant International 2026 年 7 月约 US$11.2 billion 的 Series A 估值门槛很高，但不荒唐。公司显然比 Payoneer
              等较小的上市跨境同业规模更大、战略面更宽，但估值规模仍明显低于 PayPal、Adyen 等成熟上市龙头。这个位置很重要：Ant
              不该被当成便宜的追赶交易来承销，但它也没有达到公开市场级别的披露、盈利可见度或申报节奏。最好的框架因此是混合式的。上市同业能校准受信任、经审计、已规模化支付网络今天的交易水平；Airwallex
              等私营同业则显示，在没有完整公开透明度的情况下，投资者愿意为高增长基础设施故事支付什么价格。Ant 的网络规模、WorldFirst
              邻接、商户触达和资金管理叙事支撑其战略相关性，但信息缺口仍然重要。缺少精确的独立公开经济数据时，情景法比单一激进倍数更站得住脚。
