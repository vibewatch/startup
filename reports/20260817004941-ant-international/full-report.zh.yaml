      - number: '1.3'
        title: 融资、所有权信号与估值模糊性
        blocks:
          - type: paragraph
            body: >-
              Ant International 在 2026 年 7 月宣布完成约 $1.2 billion Series A 股权融资。官方和独立报道中，只有 Ant Group 和 Alibaba Group
              被点名为参与的现有投资者；公司把其他参与机构只称为“知名国际投资机构”，没有披露领投方或份额细节。管理层称，资金将加速商户支付、账户管理，以及面向中小企业和企业的普惠金融服务的全球扩张和创新。第三方估值报道方向上较强，但并不完全一致：Reuters
              联合报道称，公司在本轮前估值约 $10 billion；Crunchbase 后来把近期融资价值描述为 $11.2
              billion。差异本身不致命，但重要，因为本轮实际上是分拆后第一次外部股权融资，投资者使用的是一个部分不透明的价格锚。未披露股权结构、具名外部领投方和详细募资用途分项，应当被视为重大尽调缺口，而不是脚注。
