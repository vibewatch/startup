              账户和资金管理工具的中小企业；GCash、DANA、TrueMoney、TNG Digital 等支付合作伙伴和超级应用；使用 Antom 与 2C2P 基础设施的企业商户和平台；以及通过 Bettr 和
              ANEXT Bank 覆盖的金融合作伙伴或数字银行用户。地域也很关键。公开材料反复指向东南亚、南亚、中东和拉丁美洲这些核心增长通道，产品重点落在碎片化但增长很快的数字经济体。商户敞口明显偏向中小企业：Ant 称其
              150 million 商户中 90% 是中小企业，Alipay+ 和 WorldFirst 材料也强调服务长尾商户和出口商。不同模块的客户「买方」也不一样。GCash 或 Mastercard
