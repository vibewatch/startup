    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >-
              Ant International 自称是一家领先的全球数字支付、数字化和金融科技提供商，总部位于新加坡，主要运营覆盖亚洲、欧洲、中东和拉丁美洲。它的商业模式明确是跨境和
              B2B/B2B2C，而不是只做消费者钱包：Alipay+ 是全球钱包网关，Antom 提供商户支付和收单基础设施，WorldFirst 为中小企业提供跨境账户和资金管理工具，Bettr
              提供嵌入式金融和信贷科技服务。官方定位强调中小企业普惠增长、与公私部门伙伴开放协作，以及 AI 驱动的支付、资金管理和信贷工具，而不是狭义收银台产品。到 2026 年初，管理层称平台服务全球超过 150
              million 家商户，其中 90% 是中小企业，并把它们连接到超过 2 billion 个用户账户；即使不计入母公司关联生态，按商户覆盖看，公司已经跻身全球最大私有跨境支付网络之列。
