      - number: '2.2'
        title: 机会测算：流量、收入池与区域切入点
        blocks:
          - type: paragraph
            body: >-
              任何严肃口径下，这个市场都很大，但正确数字取决于测量对象。FXC Intelligence 2026 年市场规模报告称，2025 年跨境支付总 TAM 达到 $208 trillion，其中 $164
              trillion 是批发，$44 trillion 是零售。同一报告估算 2025 年跨境收入池为 $625 billion，说明服务商关心的不只是原始流量，更是费率、细分组合和走廊经济性。在零售内部，B2B
              中小企业支付贡献了最大的单一零售收入池，达到 $191 billion，尽管它不是最大的流量细分。其他按收入估算市场的分析机构数值明显更低，因为它们测量服务商收入，而不是流量价值：The Business
              Research Company 给出的市场规模是 2026 年 $188.41 billion、2030 年 $263.41 billion。区域上，亚太是 Ant International
              最重要的切入点。FXC 亚洲分析称，2025 年 APAC 对外跨境支付总额为 $13.5 trillion，到 2033 年可能升至 $24 trillion；PCMI 预计中国以外的亚太电商在 2025
              年将超过 $1.1 trillion。结论是，Ant 不需要拿下全球流量的主导份额就能支撑大结果；它需要在摩擦更高的商户、中小企业和钱包互联互通走廊里拿到份额，因为这些走廊的费率和产品捆绑机会在结构上更好。
