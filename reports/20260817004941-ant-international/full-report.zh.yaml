      - number: '2.4'
        title: 增长驱动因素与基础设施推手
        blocks:
          - type: paragraph
            body: >-
              多股力量同时在扩大市场。HSBC 2026 年支付趋势报告把贸易重构、数字商务、嵌入式金融、更丰富的数据、AI 和基础设施现代化列为国际支付增长的主要驱动因素。FXC
              亚洲研究补充说，旅游、在线零售和互联互通项目在 APAC 尤其重要；dLocal 手册则强调，在新兴市场，本地银行卡、钱包、QR 码和实时转账已不再是“替代”支付方式，而是运营常态。基础设施层面，BIS、FSB
              和 Axis Intelligence 都把 ISO 20022 迁移、RTGS 延长运行时间、快速支付系统互联，以及法律 / 监管协调视为关键推手。Axis 报告称，到 2025 年底，97% 的 SWIFT
              支付指令已使用 ISO 20022，66% 的 RTGS 系统已经 24/7 运行、延长时段运行，或计划迁移到该状态。Convera
              认为，企业开始选择走廊专属路径，而不是依赖单一通用支付网络，多轨策略正成为竞争标准。这些驱动因素之所以重要，是因为 Ant International
              本来就为变现复杂性而建：支付行为越本地化、支付基础设施越全球化，钱包桥、商户受理、跨境结算、资金管理和嵌入式金融就越有价值。
