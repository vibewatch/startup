      - number: '7.2'
        title: 运营与伙伴依赖风险
        blocks:
          - type: paragraph
            body: >-
              运营风险离不开伙伴结构。Ant International 的公开资金管理叙事显示执行确有进展：DBS 称 Treasury Tokens 让 Ant 可以跨市场跑即时多币种资金管理，HSBC 称 Ant
              是其香港 Tokenised Deposit Service 的首个客户。但同一批披露也显示出集中度。最显眼的高价值资金管理用例依赖少数大型银行伙伴，以及 Ensemble 这类互联互通项目。Whale
              看起来越来越重要，而不是实验项目；独立报道称 2024 年 Ant International
              超过三分之一交易在链上处理。不过公开材料仍没有给投资者一套统一的韧性统计，覆盖正常运行时间、制裁例外、欺诈损失或事故率。客户侧依赖同样重要。商户、钱包和平台伙伴把生态触达转成交易量；失去一个主要节点不会击穿公司，但会放慢复利增长，并引发留存问题。结果是：运营画像可信且在改善，但仍暴露在交易对手、控制体系和
              24/7 例外管理之下。
