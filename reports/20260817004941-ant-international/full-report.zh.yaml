  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与待完成任务
        blocks:
          - type: paragraph
            body: >-
              Ant International 真正面对的市场不是“所有支付”，甚至也不是所有跨境支付。公开市场资料把机会拆成批发银行间流量、零售跨境支付、汇款、跨境电商支付、B2B
              供应商和资金管理支付、企业付款、钱包互联互通，以及 FX 管理、流动性和嵌入式金融等邻近服务。这个区分重要，因为不同细分市场的流量规模、收入池和买方痛点差异很大。FXC Intelligence 的 2026
              年报告明确拆分批发与零售跨境流量；The Business Research Company 和 Juniper 则从 B2B、B2C、C2B、C2C
              交易类型，以及银行转账、银行卡、钱包、区块链解决方案等支付方式描述市场。Ant International 最需要完成的任务，是让商户、中小企业、平台和支付伙伴能够本地收款、国际结算、管理 FX
              和流动性，并在匹配本地买方偏好的支付网络上完成这些动作，而不是强迫全球都走银行卡单一路径。因此，钱包互联互通、QR
              桥、市场平台卖家工具和商户资金管理服务都应纳入范围；纯汇款或国内收单市场并不能完整捕捉这条投资逻辑。
