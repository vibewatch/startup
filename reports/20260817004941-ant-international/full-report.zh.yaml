      - number: '1.2'
        title: 2024 年独立、治理与领导层
        blocks:
          - type: paragraph
            body: >-
              尽调里最关键的结构事实是，Ant International 已不再只是 Ant Group 内部的海外部门。多篇 2024 年报道和 Ant International 自身 2025
              年可持续发展材料都说，Ant Group 2024
              年重组后，该业务开始独立运营，拥有自己的董事会和独立员工激励安排，同时仍获得母公司控股方在治理、技术、风险管理和资本上的支持。这让该业务更自由地融资和推进国际合作，但并没有消除母公司影响。治理仍围绕 Ant
              生态集中：KrASIA 报道 Eric Jing 出任 Ant International 董事长，Peng Yang 继续担任 CEO。官方材料列出 Douglas Feagin
              为总裁，并展示了覆盖财务、可持续发展、运营、风险、法务和平台技术的广泛高管梯队。完整董事会名单、独立董事和正式投资者控制权仍缺乏公开披露，因此公司看起来已经运营独立，但还没有达到公开市场投资者期待的透明分离程度。
