      - number: '2.5'
        title: 采用约束、摩擦与相互矛盾的估算
        blocks:
          - type: paragraph
            body: >-
              这个市场有吸引力，正因为它仍然难做。FSB 和 BIS 继续用四个长期摩擦定义行业：成本高、速度慢、可及性有限、透明度不足；BIS 还明确说，G20 的 2027 年底目标不太可能按时实现。Atlantic
              Council 2026 年简报认为，市场结构、技术、监管和地缘政治同时推动碎片化，这意味着单靠创新无法消除摩擦。监管成本、AML/KYC 预期、非银接入不均、关税、汇率波动和欺诈仍然重要，而且在 Ant
              International 瞄准的走廊里更重要。PaymentsJournal 和 Finastra 都指出，代理行收缩和合规成本降低了亚洲部分地区和小型走廊的覆盖；Deloitte 警告，MSME
              数字化速度快于自身控制栈时，欺诈和金融犯罪风险会上升。即使市场规模也会彼此矛盾，除非先明确分析单位：数千亿美元收入估算可以与数十万亿或数百万亿美元流量估算并存，因为它们测的是不同东西。尽调时，任何单一市场数字都不该单独驱动信念。更好的问题是，Ant
              是否对准了高摩擦细分——中小企业跨境贸易、本地钱包受理和多轨结算——这些地方的需求增长和可变现复杂性都更持久。
