    type: journey-map
    layout: standard
    summary: 典型商户或合作伙伴在 Ant 生态中的旅程：从发现合作机会，到扩展至资金管理或金融服务。
    approximationNotes: 该图把商户、钱包合作伙伴和 SME 账户旅程合并为一种共同模式，而不是某个具体产品流程。
