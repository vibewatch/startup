      - number: '6.4'
        title: 扩张打法、集中度风险与渠道依赖
        blocks:
          - type: paragraph
            body: >-
              Ant 的落地再扩张打法看起来靠生态推动，而不是纯直销。钱包或平台合作可以带来商户采用；商户关系可以延伸到资金管理或金融产品；2C2P
              这样的区域基础设施资产则能加深企业和旅游客户触达。打法有吸引力，但也带来公开资料无法完全回答的集中度问题。GCash、AirAsia
              MOVE、主要钱包伙伴和区域支付伙伴，每一个都可能形成有意义的渠道集中度，即使没有单一商户构成集中。客户集中度也可能藏在网络或伙伴层面，而不是单个商户层面。采购摩擦大概率按客群分化很大：中小企业和商户入驻可能相对轻量，企业或银行集成则周期更长，还要经过合规审查。公司的跨境策略也让东南亚及周边新兴市场形成地域集中风险，不过向中东、拉丁美洲和连接欧洲的中小企业通道扩张，部分抵消了这一点。因此，公开结论是扩张潜力为正，但集中度风险证据不足。投资者在把客户基础视为充分去风险化之前，应要求披露头部伙伴敞口、商户队列结构和产品附加率证据。
