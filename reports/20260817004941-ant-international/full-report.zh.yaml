        title: 承销缺口与仍需验证事项
        blocks:
          - type: paragraph
            body: >-
              Ant International 财务章节最大的问题不是规模，而是可观察性。公司仍没有公开审计收入，没有披露产品级收入组合，没有独立毛利率，没有明确 EBITDA
              或自由现金流画像，没有披露净收入留存，也没有针对嵌入式金融产品的透明信贷损失或拨备历史。关联交易图景同样重要。Ant International 在结构上从 Ant Group
              分离，但战略持股、运营联系、资金管理安排、牌照支持或技术服务关系，仍可能实质影响独立盈利能力。同样，公司的地理覆盖是优势，但只有在扣除本地支付方式成本、合规和欺诈损失后，各走廊单位经济性仍为正时才成立。缺少这些细节时，当前尽调结论只能是谨慎正面但不完整。证据足以让人相信
              Ant 有一个真实且有价值的财务引擎；但若没有数据室，还不足以按 2026 年 7 月估值精确承销这台引擎。管理层需要在收入质量、按产品贡献利润率、嵌入式信贷表现和母公司关联转移经济性上承担较高举证责任。
