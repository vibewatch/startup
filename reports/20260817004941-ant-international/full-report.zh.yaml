            body: >-
              情景框架需要同时反映真实可选性和真实不确定性。乐观情景假设 Ant
              把网络广度转化为更好的变现，借资金管理和代币化资金工具加深企业粘性，并把披露质量提升到足以让市场更像承销受信任平台、而非不透明私有资产。基准情景假设升值健康但不爆发：规模继续复利，但费率压力和披露折价让估值增益保持温和。悲观情景不需要公司崩塌；只需要增长放慢、定价压力、监管摩擦或无法证明利润率质量中的若干项同时出现。上市可比公司也说明为什么离散度重要。Payoneer
              较小的市值显示，一旦缺少溢价叙事，市场可以多快压缩支付资产；Adyen 和 PayPal 则显示，透明度和信任增强后，支付特许经营权可以变得更值钱。Ant 目前正处在这两端之间。
