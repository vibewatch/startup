      - number: '1.4'
        title: 规模指标、产品支柱与地理足迹
        blocks:
          - type: paragraph
            body: >-
              2024-2026 年来源披露的规模，对一家新近独立的私有金融科技公司而言异常大。Ant International 2024 年可持续发展报告称，Alipay+ 在超过 70 个市场连接了超过 1.7
              billion 个用户账户和超过 100 million 家商户；2026 年公司新闻稿又把集团整体指标更新为超过 150 million 家商户、超过 2 billion 个用户账户，以及 2025
              年核心新兴市场超过 2 billion 笔数字跨境交易。仅 WorldFirst 一项，就被描述为服务超过 200 个市场的逾 1.2 million 家中小企业，并在 2024 年处理约 $100
              billion 支付；后续第三方报道还称累计交易量超过 $300 billion、中小企业客户约 1.6 million。管理层也强调全球超过 30
              个办公室，商户网络覆盖亚洲、欧洲、中东和拉丁美洲。这些披露支撑了一个投资判断：Ant International 已经在有意义的基础设施规模上运营；也解释了为什么即便在最终香港上市之前，它对 Ant Group
              和外部投资者都具有战略重要性。
