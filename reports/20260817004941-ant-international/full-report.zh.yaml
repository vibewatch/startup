      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              买方地图比单一商户画像复杂。付款方一侧，最清晰的经济买方是中小企业出口商、跨境电商商户、市场平台、旅游商户，以及有资金管理或供应商付款需求的大型企业。用户一侧，发起或接收价值的人包括使用本地钱包或 QR
              方式付款的消费者、给卖家结算的市场平台，以及管理多币种和多走廊流动性的财务团队。钱包、银行和 PSP 等渠道伙伴重要，因为它们既可能是客户，也可能是分发节点。FXC 的 SMB
              分析认为，小企业比大型企业更直接感受到成本和延迟，因为支付时滞会直接伤害现金流。PCMI 和 dLocal 都强化了一个判断：新兴市场的本地支付方式决定转化率；Deloitte 和 Finastra
              则描述了一个由电子钱包、超级 App、即时转账和 QR 网络塑造结账行为的区域，传统跨境银行卡体验不再主导。Ant International
              最适配的场景，是本地买方行为必须转化为商户受理、结算和营运资本工具的地方：例如东南亚旅游和零售商户、使用市场平台的中小企业卖家，或寻求互联互通支付网络的钱包生态。这与纯汇款或国内收单的买方地图不同，也解释了为什么
              Ant 的 Alipay+、Antom 和 WorldFirst 互补而非冗余。
