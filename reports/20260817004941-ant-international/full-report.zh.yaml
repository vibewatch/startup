  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与地缘政治风险
        blocks:
          - type: paragraph
            body: >-
              Ant International 的风险轮廓首先来自监管，因为公司处在支付、外汇、资金管理和新兴代币化资金基础设施的交汇点。新加坡分量格外重：集团总部设在那里，Payment Services Act
              为持牌支付活动、客户资金保障和行为要求提供法律框架。香港同样关键，因为 Ant 已把 Whale 及其代币化存款资金管理用例放进 HKMA Project Ensemble 从沙盒到 EnsembleTX
              的路径里。这在战略上有价值，但也意味着 Ant 是在可见监管审视下扩张，而不是躲在轻监管角落里。公司与 Ant Group 的联系又叠加一层地缘政治风险。即便 2024
              年重组之后，交易对手仍可能把历史中国政策和声誉顾虑附着到 Ant
              名字上。新兴稳定币计划让这层张力更尖锐：它可能提升未来结算效率，但也会扩大牌照边界，并带来审慎监管、储备和行为规范问题。对投资者而言，这一类是最重要的尾部风险驱动因素，因为一个核心司法辖区出问题，可能外溢到更广网络中的银行、商户和合作伙伴尽调。
