        - 国内发票费率，另加 1.5% 国际费用和 2%-4% 外汇点差
        - 结账 + 企业账户栈
        - 发票和外汇费率表公开
        - 便利性和信任往往抵消更高成本
      - - Adyen
        - 交换费加成和按支付方式定价
