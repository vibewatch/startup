  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图概览
        blocks:
          - type: paragraph
            body: >-
              Ant International 的竞争对手不只是“支付公司”。它至少面对三组对手：第一，Stripe、PayPal、Adyen 等全球商户收单和编排平台；第二，Wise、Payoneer、WorldFirst
              等中小企业跨境账户、FX 和付款专家；第三，dLocal、Nium、Thunes、Airwallex 等新兴市场和多轨基础设施玩家。Juniper 和 FXC
              都把跨境市场描述为一个银行仍保有规模、但专业服务商越来越靠本地支付方式、实时结算、嵌入式金融和走廊覆盖拉开差距的市场。Ant
              的定位异常宽，因为它能把商户受理、钱包互联互通、资金管理、中小企业账户和金融服务结合起来。宽度也让几乎每个比较都不对称：Stripe 在开发者驱动的商户集成更强，Wise 在透明中小企业 FX
              定价更强，Payoneer 在市场平台付款更强，Adyen 在企业本地收单更强，dLocal 和 Thunes 在部分新兴市场最后一公里走廊更强，Airwallex
              则是最可信的多产品商业金融类比对象。因此，尽调的实用问题不是“谁是唯一直接竞争对手？”，而是 Ant 想拥有的每条工作流上，哪个对手更有优势。
