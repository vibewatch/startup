      - number: '8.3'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              仅凭公开信息，建议是有条件兴趣。Ant 看起来是高质量战略平台，但当前轮次价格没有给粗糙承销留下太多空间。投资者不应只因为公司规模大、又挂钩 AI
              商务或代币化资金管理等重要主题就追高。这里的价格纪律比在明显被忽视的资产里更重要，因为估值已经假设公司会继续执行。获得更好风险调整回报的最干净路径，是折价进入、结构化轮次，或异常强的信息权和下行保护。实操上，新投资者在接受头条价格之前，应坚持获得更清楚的股权结构表可见度、清算优先权细节，以及可信的内部报告访问权。这不是「任何价格都必须持有」的局面，而是「条款和数据配合时有意思」的局面。
