    {
      "id": "expansion-concentration",
      "title": "Expansion Motion, Concentration Risk, and Channel Dependence",
      "body": "Ant’s land-and-expand motion appears to operate through ecosystems rather than pure direct sales. A wallet or platform partnership can create merchant adoption; a merchant relationship can expand into treasury or financial products; and a regional infrastructure asset such as 2C2P can deepen reach among enterprise and travel clients. This is attractive, but it creates concentration questions that public sources cannot fully resolve. GCash, AirAsia MOVE, major wallet partners, and regional payment partners may each represent meaningful channel concentration even if no single merchant does. Customer concentration could also hide at the network or partner level rather than at the individual merchant level. Procurement friction likely differs sharply by segment: SME and merchant onboarding may be comparatively lightweight, while enterprise or bank integrations involve longer cycles and compliance review. The company’s cross-border strategy also creates geographic concentration risk in Southeast Asia and adjacent emerging markets, though that is partially offset by expansion into the Middle East, Latin America, and Europe-linked SME corridors. The public verdict is therefore positive on expansion potential but incomplete on concentration risk. Investors should demand top-partner exposure, merchant cohort mix, and product attach-rate evidence before treating the customer base as fully de-risked.",
