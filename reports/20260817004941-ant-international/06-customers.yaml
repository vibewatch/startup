    {
      "id": "durability",
      "title": "Retention, Repeat Usage, and Durability Signals",
      "body": "Retention evidence is the weakest part of the public customer record. Ant International does not disclose net revenue retention, gross retention, churn, renewal rates, contract lengths, cohort decay, or top-customer concentration. However, there are some useful proxies. First, several partner relationships appear to be multi-year and deepening rather than one-off pilots: Ant cites work with GCash since 2017 and incremental expansion into card, checkout, and in-store acceptance; Alipay+ interoperability projects with national QR schemes suggest structural integrations rather than short campaigns; and WorldFirst’s operating role in customer finance workflows implies much higher switching friction than a single payment plug-in. Second, the company continues to cross-sell along the workflow: wallet acceptance can expand into merchant acquiring, settlement, WorldFirst treasury tools, and finance products such as Bettr. Third, public partner and customer commentary consistently emphasizes operational convenience, speed, or business expansion rather than novelty alone. That said, the absence of quantified retention disclosure remains material. For a company with such broad partner dependence, customer durability must ultimately be proven with product-level cohort data, contract renewal schedules, and segment-specific churn.",
