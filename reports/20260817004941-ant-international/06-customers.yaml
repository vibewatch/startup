    {
      "id": "adoption-proof",
      "title": "Adoption Trajectory and Named Customer Proof",
      "body": "Public adoption proof is substantial even though the company does not disclose standard SaaS-style cohort metrics. Ant says it connects more than 150 million merchants to more than 2 billion user accounts worldwide, supports over 300 payment methods across 220+ markets, and processes more than 20 million transactions daily. WorldFirst adds a distinct SME adoption layer, with official and independent sources putting it at 1.2 to 1.6 million SME customers and roughly US$100 billion of cumulative or annual transaction value in the recent period. Named partner proof is also strong. Antom deepened its partnership with GCash for Business in 2026 to extend card, online checkout, and in-store acceptance for Filipino MSMEs; AirAsia MOVE partnered with Antom and 2C2P to reduce cross-border cost and broaden payment options; GCash Tap to Pay expanded global acceptance for a 100-million-user wallet through Alipay+ and Mastercard; and 2C2P continues to list large enterprise merchants such as Lazada, Lenovo, and Changi. FutureCIO and The Story Thailand describe 2C2P’s 38% Southeast Asia transaction-volume growth, WorldFirst’s near-40% growth in transaction value, Bettr’s 184% increase in user base through wallet partnerships, and ANEXT Bank’s six-fold increase in cross-border volume. These are strong usage and deployment signals, even if not yet a full retention dataset.",
