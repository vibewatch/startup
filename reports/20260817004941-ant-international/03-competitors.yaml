    {
      "id": "direct-clusters",
      "title": "Direct Rival Clusters and Where They Win",
      "body": "Wise and Payoneer set the bar for transparent SME money movement, seller payouts, and multi-currency operating accounts. Wise reported 19 million active customers, US$243.5 billion of cross-border volume, a 52-basis-point take rate, and 75% of payments completed in under 20 seconds in FY2026, while its business product alone says more than 700,000 global businesses move US$16 billion per month. Payoneer reported US$1.05 billion of 2025 revenue and positions itself across 190-plus countries and 70-plus currencies, making it especially strong in marketplaces, freelancers, and SMB collections. Stripe, PayPal, and Adyen are stronger merchant-acceptance and enterprise checkout competitors. Stripe emphasizes 195-country reach, 135-plus currencies, 100-plus payment methods, and local acquiring in 46 markets; PayPal emphasizes a 400-million-user network, 200-plus markets, and deep checkout distribution; Adyen combines global acquiring with local-processing and enterprise performance optimization. The closest architecture peers are dLocal, Nium, Thunes, and Airwallex. dLocal is specialized for high-growth emerging markets with 1,000-plus payment methods across 44-plus countries; Nium focuses on global payouts, cards, and treasury APIs; Thunes emphasizes its direct network into banks, wallets, and cards across 140 countries; and Airwallex has become a large multi-product business-finance platform with 200,000-plus companies, 80 licences, and US$1 billion-plus annualized revenue. Ant’s closest strategic challenge comes from whichever of these rivals narrows the gap between merchant acceptance and treasury infrastructure without losing corridor depth.",
