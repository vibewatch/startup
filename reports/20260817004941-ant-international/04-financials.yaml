    "researchQuestions": [
      {
        "id": "QI001",
        "question": "What are Ant International’s likely revenue streams?",
        "type": "enumeration",
        "targets": [
          "contentRequirements/0",
          "plannedTables/revenue-streams-table"
        ],
        "status": "answered",
        "answerSummary": "Merchant fees, FX and treasury, accounts and payouts, software/API, and embedded-finance economics are the main likely streams."
      },
      {
        "id": "QI002",
        "question": "Does public evidence suggest Ant is more than a pure payments take-rate business?",
        "type": "verification",
        "targets": [
          "contentRequirements/0"
        ],
        "status": "answered",
        "answerSummary": "Yes. Official materials highlight AI, treasury, credit, and account tools alongside payment throughput."
      },
      {
        "id": "QI003",
        "question": "What official operating-scale metrics has Ant disclosed?",
        "type": "quantification",
        "targets": [
          "contentRequirements/1"
        ],
        "status": "answered",
        "answerSummary": "150M+ merchants, 2B+ transactions in core emerging markets in 2025, and 1.7B-1.8B+ user-account reach via Alipay+ are the clearest signals."
      },
      {
        "id": "QI004",
        "question": "What economic footprint does WorldFirst provide inside Ant International?",
        "type": "quantification",
        "targets": [
          "contentRequirements/1"
        ],
        "status": "answered",
        "answerSummary": "WorldFirst has been described as serving 1.2M-1.6M SMEs with about US$100B cumulative transaction value in 2024."
      },
      {
        "id": "QI005",
        "question": "How important is the July 2026 Series A to capital adequacy?",
        "type": "comparison",
        "targets": [
          "contentRequirements/1",
          "plannedTables/capital-adequacy-table",
          "contentRequirements/4"
        ],
        "status": "answered",
        "answerSummary": "It materially strengthens capital adequacy because it is large relative to most growth-stage rounds and funds an already scaled platform."
      },
      {
        "id": "QI006",
        "question": "What valuation band is supported by public evidence for the 2026 round?",
        "type": "quantification",
        "targets": [
          "contentRequirements/1"
        ],
        "status": "answered",
        "answerSummary": "Public sources support an approximate US$10B-11.2B valuation band around the Series A."
      },
      {
        "id": "QI007",
        "question": "What do public peer pricing disclosures imply about Ant’s monetization envelope?",
        "type": "comparison",
        "targets": [
          "contentRequirements/2",
          "plannedTables/pricing-monetization-table",
          "plannedFigures/financial-estimate-range"
        ],
        "status": "answered",
        "answerSummary": "Peer disclosures show models ranging from ~0.5% low-spread FX economics to multi-point merchant and invoicing fee layers."
      },
      {
        "id": "QI008",
        "question": "Can transaction count alone be used to estimate Ant’s revenue?",
        "type": "mechanism",
        "targets": [
          "contentRequirements/2"
        ],
        "status": "answered",
        "answerSummary": "No. Revenue yield depends far more on corridor, payment method, merchant mix, and cross-sold services than on transaction count alone."
      },
      {
        "id": "QI009",
        "question": "Which peers are the best monetization comparables for different Ant product lines?",
        "type": "enumeration",
        "targets": [
          "contentRequirements/2"
        ],
        "status": "answered",
        "answerSummary": "Wise and Airwallex are best for FX/accounts, Payoneer for payouts, Stripe/PayPal/Adyen for merchant acceptance, and Ant’s own disclosures for blended bundling."
      },
      {
        "id": "QI010",
        "question": "What does Wise disclose that is especially useful for Ant financial inference?",
        "type": "verification",
        "targets": [
          "contentRequirements/2"
        ],
        "status": "answered",
        "answerSummary": "Wise discloses active customers, cross-border volume, and take rate, which bound low-spread cross-border infrastructure economics."
      },
      {
        "id": "QI011",
        "question": "What does Payoneer disclose that is especially useful for Ant financial inference?",
        "type": "verification",
        "targets": [
          "contentRequirements/2"
        ],
        "status": "answered",
        "answerSummary": "Payoneer discloses 2025 revenue and a corridor-dependent public fee schedule, showing how payout and collection models monetize."
      },
      {
        "id": "QI012",
        "question": "What do Stripe and PayPal disclose that is especially useful for Ant financial inference?",
        "type": "verification",
        "targets": [
          "contentRequirements/2"
        ],
        "status": "answered",
        "answerSummary": "They show how merchant acceptance and invoicing models can monetize at materially higher public fee bands than treasury-style models."
      },
      {
        "id": "QI013",
        "question": "How should Ant’s blended take rate likely compare with pure transparent-FX players?",
        "type": "comparison",
        "targets": [
          "contentRequirements/2"
        ],
        "status": "answered",
        "answerSummary": "It is likely higher than pure low-spread FX utilities when merchant acceptance and local-method value are included, but probably lower on treasury-like flows."
      },
      {
        "id": "QI014",
        "question": "What are the most likely high-quality revenue streams for Ant?",
        "type": "comparison",
        "targets": [
          "contentRequirements/0"
        ],
        "status": "answered",
        "answerSummary": "Payment, FX, account, and software revenues are likely higher quality than credit-linked economics because they need less balance-sheet risk."
      },
      {
        "id": "QI015",
        "question": "What are the main risks to Ant’s unit economics?",
        "type": "enumeration",
        "targets": [
          "contentRequirements/2",
          "plannedTables/unit-economics-table"
        ],
        "status": "answered",
        "answerSummary": "Take-rate compression, local-method and compliance cost, fraud, Western expansion CAC, and credit losses are the main risks."
      },
      {
        "id": "QI016",
        "question": "What is the strongest public argument for Ant’s margin upside?",
        "type": "mechanism",
        "targets": [
          "contentRequirements/2"
        ],
        "status": "answered",
        "answerSummary": "The strongest argument is bundle expansion from payments into treasury, accounts, and AI-enabled services that can raise ARPU per merchant."
      },
      {
        "id": "QI017",
        "question": "What is the strongest public argument against assuming strong margins?",
        "type": "adverse",
        "targets": [
          "contentRequirements/2"
        ],
        "status": "answered",
        "answerSummary": "The business still may be largely transaction-volume driven, and public data does not prove software-like margin or retention quality."
      },
      {
        "id": "QI018",
        "question": "Does embedded finance improve or worsen the financial picture?",
        "type": "comparison",
        "targets": [
          "contentRequirements/2"
        ],
        "status": "answered",
        "answerSummary": "It can improve revenue and stickiness, but it also introduces loss, reserve, and capital-intensity risks."
      },
      {
        "id": "QI019",
        "question": "What does the Series A say about the company’s stage of maturity?",
        "type": "mechanism",
        "targets": [
          "contentRequirements/1",
          "contentRequirements/4"
        ],
        "status": "answered",
        "answerSummary": "It suggests Ant is financing scaled expansion and AI/product deepening rather than proving basic product-market fit."
      },
      {
        "id": "QI020",
        "question": "What is the biggest missing public datapoint for revenue underwriting?",
        "type": "adverse",
        "targets": [
          "contentRequirements/3"
        ],
        "status": "answered",
        "answerSummary": "Audited revenue by product and region is the biggest single missing datapoint."
      },
      {
        "id": "QI021",
        "question": "What is the biggest missing public datapoint for profitability underwriting?",
        "type": "adverse",
        "targets": [
          "contentRequirements/3"
        ],
        "status": "answered",
        "answerSummary": "Gross margin and contribution margin by business line are the biggest missing profitability datapoints."
      },
      {
        "id": "QI022",
        "question": "What is the biggest missing public datapoint for credit-risk underwriting?",
        "type": "adverse",
        "targets": [
          "contentRequirements/3"
        ],
        "status": "answered",
        "answerSummary": "Credit-book size, loss rates, and provisioning by embedded-finance product are the key missing datapoints."
      },
      {
        "id": "QI023",
        "question": "How important are parent-company and affiliate ties to the financial story?",
        "type": "mechanism",
        "targets": [
          "contentRequirements/3"
        ],
        "status": "answered",
        "answerSummary": "They may materially shape transfer economics, credibility, partner access, and capital resilience, so they must be understood before underwriting stand-alone profitability."
      },
      {
        "id": "QI024",
        "question": "What is the chapter verdict on Ant’s financial quality from public data alone?",
        "type": "comparison",
        "targets": [
          "contentRequirements/3",
          "contentRequirements/5"
        ],
        "status": "answered",
        "answerSummary": "Public data supports a real scaled business with strong capital adequacy, but not a fully underwritten view of revenue quality or profitability."
      },
      {
        "id": "QI025",
        "question": "What should management provide next to clear the chapter’s main financial blockers?",
        "type": "enumeration",
        "targets": [
          "contentRequirements/3",
          "plannedTables/public-financial-gaps-table",
          "contentRequirements/5"
        ],
        "status": "answered",
        "answerSummary": "Audited financials, revenue mix, margin bridges, cohort retention, credit losses, and intercompany economics are the minimum asks."
      }
