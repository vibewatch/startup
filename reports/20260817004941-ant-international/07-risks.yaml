    {
      "id": "s4",
      "title": "Mitigations, monitoring, and diligence triggers",
      "body": "The visible mitigations are real but partial. Ant International is not presenting itself as a rules-arbitrage story; its bank partnerships, regulator-linked pilots, and compliance-heavy messaging suggest management knows that trust is the scarce asset in cross-border infrastructure. Working with DBS, HSBC, MAS-linked tokenisation workstreams, and HKMA programs should improve credibility with large counterparties. Yet those same relationships also create dependency risk, which is why investors should monitor not only partner additions but also partner withdrawals, changing control requirements, and signs that pilot economics are failing to graduate into durable business value. The clearest thesis-break triggers are a core licence disruption, a large partner-bank or channel-partner loss, or a material fraud / sanctions / resilience event that undermines trust. Before underwriting upside from tokenised treasury or stablecoins, investors should demand a full licence register, bank-partner map, fraud-loss and incident history, tokenisation governance model, reserve design, and hedging policy. This can be an investable risk profile, but only for an active owner with a real data room and quarterly monitoring discipline.",
