    {
      "id": "s3",
      "title": "Financial and model risk",
      "body": "The central financial risk is not obvious distress; it is under-disclosed quality of earnings at a very meaningful valuation. Cross-border payment take rates are tightening across the industry, so Ant needs to keep scaling transaction volume, merchant breadth, and higher-value product attach faster than pricing compresses. That is possible, but public sources do not provide enough standalone information about revenue mix, margins, fraud losses, reserve policy, or cohort durability to underwrite it confidently. The treasury and tokenised-money strategy may reduce settlement friction and open new revenue or cost advantages, yet the public evidence still proves operational viability more clearly than it proves economic superiority. The 2026 Series A at roughly US$11.2 billion increases the penalty for model error because investors are already paying for future execution. Embedded-finance adjacency deepens the challenge: accounts, treasury, financing, and FX create a broader exposure stack than a pure payment gateway would carry. Without audited-style disclosure on unit economics and governance, this remains a medium-high risk bucket.",
      "claimRefs": [
