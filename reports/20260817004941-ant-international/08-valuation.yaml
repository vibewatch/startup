          "contentRequirements/3"
        ],
        "status": "answered",
        "answerSummary": "A base-case exit range around US$12B-US$16B is more defensible than an aggressive immediate step-up from the 2026 round."
      },
      {
        "id": "QV008",
        "question": "What defines the bull case?",
        "type": "enumeration",
        "targets": [
          "contentRequirements/3"
        ],
        "status": "answered",
        "answerSummary": "Bull-case drivers are margin visibility, treasury monetisation, durable merchant growth, and regulatory progress on tokenised money."
      },
      {
        "id": "QV009",
        "question": "What defines the bear case?",
        "type": "enumeration",
        "targets": [
          "contentRequirements/3"
        ],
        "status": "answered",
        "answerSummary": "Bear-case drivers are take-rate compression, regulation drag, partner concentration, and failure to prove standalone economics."
      },
      {
        "id": "QV010",
        "question": "How does Ant compare with Airwallex?",
        "type": "comparison",
        "targets": [
          "contentRequirements/4"
        ],
        "status": "answered",
        "answerSummary": "Ant merits a premium to Airwallex only if broader network scale and treasury optionality outweigh its disclosure gap."
      },
      {
        "id": "QV011",
        "question": "How does Ant compare with Payoneer?",
        "type": "comparison",
        "targets": [
          "contentRequirements/4"
        ],
        "status": "answered",
        "answerSummary": "Ant looks strategically larger than Payoneer, but Payoneer’s public disclosure quality is materially stronger."
      },
      {
        "id": "QV012",
        "question": "How does Ant compare with Adyen?",
        "type": "comparison",
        "targets": [
          "contentRequirements/4"
        ],
        "status": "answered",
        "answerSummary": "Ant remains well below Adyen in public-market valuation and disclosure quality, which caps how much premium private investors should pay today."
      },
      {
        "id": "QV013",
        "question": "How does Ant compare with PayPal?",
        "type": "comparison",
        "targets": [
          "contentRequirements/4"
        ],
        "status": "answered",
        "answerSummary": "PayPal is a mature global benchmark showing Ant still trades at a discount to global scale leaders, but certainty differs sharply."
      },
      {
        "id": "QV014",
        "question": "What does the peer disclosure set tell investors?",
        "type": "verification",
        "targets": [
          "contentRequirements/2",
          "contentRequirements/4"
        ],
        "status": "answered",
        "answerSummary": "Public peers routinely publish annual reports, quarterly results, and filings, highlighting Ant’s information asymmetry."
      },
      {
        "id": "QV015",
        "question": "What is the most honest recommendation from public data alone?",
        "type": "comparison",
        "targets": [
          "contentRequirements/1",
          "contentRequirements/5"
        ],
        "status": "answered",
        "answerSummary": "Conditional interest is the most defensible stance: quality appears high, but price discipline and hard diligence gates are essential."
      },
      {
        "id": "QV016",
        "question": "What terms would improve risk-adjusted returns?",
        "type": "enumeration",
        "targets": [
          "contentRequirements/1",
          "contentRequirements/2"
        ],
        "status": "answered",
        "answerSummary": "A discounted entry, pro rata, information rights, and clear downside protections would improve underwriting."
      },
      {
        "id": "QV017",
        "question": "How much does scenario dispersion matter here?",
        "type": "verification",
        "targets": [
          "contentRequirements/3"
        ],
        "status": "answered",
        "answerSummary": "It matters a lot because modest changes in take rate, regulation, or disclosure can move outcomes from acceptable to poor."
      },
      {
        "id": "QV018",
        "question": "Which KPIs should govern post-investment monitoring?",
        "type": "enumeration",
        "targets": [
          "contentRequirements/5"
        ],
        "status": "answered",
        "answerSummary": "Monitor margin progression, retention, partner concentration, regulatory status, and product-mix quality."
      },
      {
        "id": "QV019",
        "question": "Can tokenisation justify a higher multiple today?",
        "type": "adverse",
        "targets": [
          "contentRequirements/0",
          "contentRequirements/3"
        ],
        "status": "answered",
        "answerSummary": "Not by itself; the current evidence proves strategic option value better than hard economics."
      },
      {
        "id": "QV020",
        "question": "How valuable is the merchant / SME network in underwriting?",
        "type": "mechanism",
        "targets": [
          "contentRequirements/0",
          "contentRequirements/3"
        ],
        "status": "answered",
        "answerSummary": "It supports scale and optionality, but value realization still depends on margins, retention, and corridor economics."
      },
      {
        "id": "QV021",
        "question": "What is the recommended hold / exit framing?",
        "type": "verification",
        "targets": [
          "contentRequirements/1",
          "contentRequirements/5"
        ],
        "status": "answered",
        "answerSummary": "A 5-7 year hold with IPO or strategic sale optionality is reasonable only if governance and economics become more visible."
      },
      {
        "id": "QV022",
        "question": "What are the key anti-thesis arguments?",
        "type": "enumeration",
        "targets": [
          "contentRequirements/0"
        ],
        "status": "answered",
        "answerSummary": "Anti-thesis points are opaque economics, regulation creep, partner concentration, price competition, and rich entry valuation."
      },
      {
        "id": "QV023",
        "question": "What are the key pro-thesis arguments?",
        "type": "enumeration",
        "targets": [
          "contentRequirements/0"
        ],
        "status": "answered",
        "answerSummary": "Pro-thesis points are rare network scale, emerging-market reach, bank partnerships, and product adjacency across payments and treasury."
      },
      {
        "id": "QV024",
        "question": "What diligence items are true blockers?",
        "type": "enumeration",
        "targets": [
          "contentRequirements/5"
        ],
        "status": "answered",
        "answerSummary": "Audited-style financials, cap table / preferences, cohort retention, and loss / reserve data are the main blockers."
      },
      {
        "id": "QV025",
        "question": "What is the best downside-protection logic?",
        "type": "mechanism",
        "targets": [
          "contentRequirements/1",
          "contentRequirements/2"
        ],
        "status": "answered",
        "answerSummary": "The main protection is disciplined entry price plus terms, because public data alone cannot fully quantify downside."
      },
      {
        "id": "QV026",
        "question": "How does public market sentiment shape the recommendation?",
        "type": "freshness",
        "targets": [
          "contentRequirements/4"
        ],
        "status": "answered",
        "answerSummary": "The 2026 peer market-cap set supports discipline: high-quality payments names still trade well below prior-cycle exuberance."
      },
      {
        "id": "QV027",
        "question": "Could a strategic buyer pay more than public comps imply?",
        "type": "comparison",
        "targets": [
          "contentRequirements/4",
          "contentRequirements/5"
        ],
        "status": "answered",
        "answerSummary": "Possibly, but regulatory complexity and preference-stack friction limit how much M&A upside should be underwritten."
      },
      {
        "id": "QV028",
        "question": "What has to happen for a clear upgrade?",
        "type": "verification",
        "targets": [
          "contentRequirements/1",
          "contentRequirements/5"
        ],
        "status": "answered",
        "answerSummary": "Ant would need stronger standalone disclosures, evidence of margin durability, and cleaner proof that treasury products improve economics."
      },
      {
        "id": "QV029",
        "question": "What would force a downgrade or pass?",
        "type": "adverse",
        "targets": [
          "contentRequirements/1",
          "contentRequirements/5"
        ],
        "status": "answered",
        "answerSummary": "Any deterioration in regulation, partner concentration, margins, or growth quality would justify a pass at the current round price."
      },
      {
        "id": "QV030",
        "question": "Is Ant overpriced, fairly priced, or underpriced from public data alone?",
        "type": "comparison",
        "targets": [
          "contentRequirements/1",
          "contentRequirements/2"
        ],
        "status": "answered",
        "answerSummary": "From public data alone it looks fairly-to-richly priced rather than obviously underpriced."
      }
