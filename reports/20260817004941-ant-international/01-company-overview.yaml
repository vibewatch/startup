    {
      "id": "spinout-governance",
      "title": "2024 Independence, Governance, and Leadership",
      "body": "The most important structural fact for diligence is that Ant International is not merely an overseas department inside Ant Group anymore. Multiple 2024 reports and Ant International’s own 2025 sustainability materials say the business became independently operated after Ant Group’s 2024 reorganisation, with its own board of directors and separate employee incentive arrangements while still receiving governance, technology, risk-management, and capital support from the parent holding company. That means the unit has more freedom to raise capital and pursue international partnerships, but it does not eliminate parent influence. Governance remains concentrated around the Ant ecosystem: KrASIA reported that Eric Jing took the role of chairman of Ant International, while Peng Yang remained CEO. Official materials list Douglas Feagin as president and show a broad executive bench spanning finance, sustainability, operations, risk, legal, and platform technology. Public disclosures are still incomplete on the full board roster, independent directors, and formal investor control rights, so the company looks operationally independent but not yet transparently separated in the way a public-market investor would expect.",
