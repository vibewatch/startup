    {
      "calloutType": "strength",
      "title": "WorldFirst and Alipay+ make the SME proposition tangible",
      "body": "Unlike some payments stories that rely on abstract network claims, Ant International can point to concrete scale in the SME stack: WorldFirst’s million-plus SME base, large annual TPV, and global-account product, plus Alipay+ wallet interoperability across dozens of partners and markets.",
