    {
      "id": "scale-products-footprint",
      "title": "Scale Metrics, Product Pillars, and Geographic Footprint",
      "body": "The scale disclosed across 2024-2026 sources is unusually large for a newly independent private fintech. Ant International’s 2024 sustainability report said Alipay+ connected more than 1.7 billion user accounts and over 100 million merchants across more than 70 markets, while 2026 company releases updated group-wide metrics to more than 150 million merchants, more than 2 billion user accounts, and more than 2 billion digital cross-border transactions during 2025 in core emerging markets. WorldFirst alone was described as serving over 1.2 million SMEs across more than 200 markets and processing around $100 billion of payments in 2024, with later third-party reporting citing more than $300 billion cumulative volume and roughly 1.6 million SME customers. Management also highlighted more than 30 offices globally and a merchant network spanning Asia, Europe, the Middle East, and Latin America. These disclosures support the investment case that Ant International is already operating at meaningful infrastructure scale; they also show why the business is strategically important to both Ant Group and outside investors even before an eventual Hong Kong listing.",
