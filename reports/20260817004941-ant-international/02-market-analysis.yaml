  "chapter": {
    "number": 2,
    "title": "Market Analysis",
    "summary": "Ant International operates in a market that must be understood through multiple lenses rather than a single headline TAM. FXC Intelligence’s 2026 work puts total 2025 cross-border payment flows at $208 trillion, but only $44 trillion of that is retail cross-border activity, and revenue pools compress sharply as take rates fall. The company’s highest-fit opportunity sits in the intersection of SME cross-border commerce, merchant acceptance, wallet interoperability, and real-time/ISO-modernized infrastructure across Asia and other emerging markets. Market attractiveness is strong, but adoption remains constrained by regulatory fragmentation, trust, corridor-specific economics, and uneven interoperability progress."
  },
