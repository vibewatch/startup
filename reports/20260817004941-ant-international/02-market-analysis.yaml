    {
      "id": "market-boundary",
      "title": "Market Boundary and Job-to-be-Done",
      "body": "The relevant market for Ant International is not “all payments” and not even all cross-border payments. Public market references split the opportunity into wholesale bank-to-bank flows, retail cross-border payments, remittances, cross-border e-commerce payments, B2B supplier and treasury payments, business payouts, wallet interoperability, and adjacent services such as FX management, liquidity, and embedded finance. That distinction matters because flow volumes, revenue pools, and buyer pain points differ sharply by segment. FXC Intelligence’s 2026 report explicitly separates wholesale and retail cross-border flows, while The Business Research Company and Juniper describe the market across B2B, B2C, C2B, and C2C transaction types plus payment methods such as bank transfers, cards, wallets, and blockchain solutions. For Ant International, the most relevant job-to-be-done is enabling merchants, SMEs, platforms, and payment partners to accept money locally, settle internationally, manage FX and liquidity, and do so on rails that match local buyer preferences rather than forcing global card-only behavior. That is why wallet interoperability, QR bridges, marketplace seller tools, and merchant treasury services belong in-scope, while pure remittance or domestic checkout markets do not fully capture the thesis.",
