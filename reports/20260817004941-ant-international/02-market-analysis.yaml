    {
      "id": "constraints-and-contradictions",
      "title": "Adoption Constraints, Frictions, and Contradictory Estimates",
      "body": "The market is attractive precisely because it is still hard. FSB and BIS continue to frame the industry around four enduring frictions—high cost, low speed, limited access, and insufficient transparency—and BIS explicitly says the G20’s end-2027 targets are unlikely to be met on time. Atlantic Council’s 2026 brief argues that fragmentation is being driven simultaneously by market structure, technology, regulation, and geopolitics, which means innovation alone will not remove friction. Regulatory costs, AML/KYC expectations, uneven non-bank access, tariffs, currency volatility, and fraud all still matter, and they matter more in exactly the corridors Ant International targets. PaymentsJournal and Finastra both note that correspondent banking consolidation and compliance costs have reduced reach in parts of Asia and smaller corridors, while Deloitte warns that fraud and financial crime risk rises as MSMEs digitize faster than their control stacks. Even market size is contradictory until one specifies the unit of analysis: revenue estimates in the hundreds of billions can coexist with flow estimates in the tens or hundreds of trillions because they measure different things. For diligence, that means no single market number should drive conviction. The better question is whether Ant is aligned to the high-friction segments—SME cross-border commerce, local-wallet acceptance, and multi-rail settlement—where both demand growth and monetizable complexity remain durable.",
