    {
      "id": "sizing-lenses",
      "title": "Sizing the Opportunity: Flows, Revenue Pools, and Regional Wedges",
      "body": "The market looks huge under any serious methodology, but the right number depends on what is being measured. FXC Intelligence’s 2026 market-sizing report says total cross-border payment TAM reached $208 trillion in 2025, of which $164 trillion was wholesale and $44 trillion was retail. That same report estimated a $625 billion 2025 cross-border revenue pool, showing why providers care less about raw flow than about take rates, segment mix, and corridor economics. Within retail, B2B SME payments generated the largest single retail revenue pool at $191 billion despite not being the largest flow segment. Other analysts publishing revenue-based market estimates are materially lower because they measure service-provider revenue rather than flow value: The Business Research Company puts market size at $188.41 billion in 2026 and $263.41 billion by 2030. Regionally, Asia-Pacific is the most important wedge for Ant International. FXC’s Asia analysis says APAC outbound cross-border payments totalled $13.5 trillion in 2025 and could rise to $24 trillion by 2033, while PCMI projects Asia-Pacific e-commerce outside China to surpass $1.1 trillion in 2025. The takeaway is that Ant does not need a dominant share of global flows to justify a large outcome; it needs share in the higher-friction merchant, SME, and wallet-interoperability corridors where take rates and product-bundling opportunities remain structurally better.",
