      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              The buyer map is more complex than a single merchant archetype. On the payer side, the clearest economic
              buyers are SME exporters, cross-border e-commerce merchants, marketplaces, travel merchants, and larger
              enterprises with treasury or supplier-payment needs. On the user side, the people initiating or receiving
              value include consumers paying with local wallets or QR methods, marketplaces settling sellers, and
              finance teams managing liquidity across currencies and corridors. Channel partners such as wallets, banks,
              and PSPs matter because they can be both customers and distribution nodes. FXC’s SMB analysis argues that
              small businesses feel cost and delay more acutely than large enterprises because payment latency directly
              damages cash flow. PCMI and dLocal both reinforce that local payment methods determine conversion in
              emerging markets, while Deloitte and Finastra describe a region where e-wallets, super-apps, instant
              transfers, and QR rails shape checkout behavior more than legacy cross-border card experiences. Ant
              International’s fit is strongest where local buyer behavior must be translated into merchant acceptance,
              settlement, and working-capital tools: think Southeast Asian travel and retail merchants, SME sellers
              using marketplaces, or wallet ecosystems seeking interoperable rails. That is a different buyer map from
              pure remittance or domestic acquiring and explains why Ant’s Alipay+, Antom, and WorldFirst products are
              complementary rather than redundant.
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
