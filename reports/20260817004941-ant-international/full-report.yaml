      - number: '4.2'
        title: Operating Traction and Capital Adequacy
        blocks:
          - type: paragraph
            body: >-
              The business has enough disclosed scale to support a serious growth-stage underwriting conversation even
              without audited statements. Ant International says it processed over 2 billion transactions in its core
              emerging markets in 2025 and serves more than 150 million merchants globally, 90% of them SMEs. The 2024
              sustainability disclosures add that Alipay+ connected more than 1.7 billion user accounts and that
              WorldFirst enabled over 1.2 million SMEs to sell into more than 200 markets with roughly US$100 billion of
              cumulative transaction value in 2024; Forbes later described WorldFirst as serving 1.6 million SMEs under
              Ant’s broader merchant umbrella. The 2026 Series A of approximately US$1.2 billion is therefore financing
              an already scaled operating platform, not a pre-revenue buildout. Business Wire coverage says the funds
              are meant to accelerate AI-powered financial tools and international expansion, while Reuters-linked
              coverage places the business around a US$10-11.2 billion valuation band. Capital adequacy looks strong on
              the surface because Ant International also retains strategic support from Ant Group and Alibaba. The open
              question is not whether the business can keep operating; it is whether standalone economics are already
              self-sustaining enough to justify the valuation without continuing parent-linked strategic advantages.
