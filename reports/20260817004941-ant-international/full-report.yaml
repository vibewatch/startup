      - number: '8.3'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              From public information alone, the recommendation is conditional interest. Ant looks like a high-quality
              strategic platform, but the current round price does not leave much room for sloppy underwriting.
              Investors should not pay up merely because the company is large and tied to important themes such as AI
              commerce or tokenised treasury. Price discipline matters more here than in a clearly underfollowed asset
              because the valuation already assumes continued execution. The cleanest route to better risk-adjusted
              returns is a discounted entry, a structured round, or unusually strong information rights and downside
              protections. In practical terms, new investors should insist on better cap-table visibility,
              liquidation-preference detail, and credible access to internal reporting before accepting the headline
              price. This is not a “must own at any price” situation; it is an “interesting if terms and data cooperate”
              situation.
            claimRefs:
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
          - type: table
