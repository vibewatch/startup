chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Headquarters, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Ant International describes itself as a leading global digital payment, digitisation, and financial
              technology provider headquartered in Singapore, with main operations across Asia, Europe, the Middle East,
              and Latin America. The business model is explicitly cross-border and B2B/B2B2C rather than consumer-wallet
              only: Alipay+ acts as the global wallet gateway, Antom provides merchant payment and acquiring
              infrastructure, WorldFirst provides cross-border accounts and treasury tools for SMEs, and Bettr provides
              embedded finance and credit-tech services. The official positioning emphasizes inclusive growth for SMEs,
              open collaboration with public and private sector partners, and AI-enabled payments, treasury, and credit
              tooling rather than a narrow checkout product. By early 2026 management said the platform served more than
              150 million merchants worldwide, 90% of them SMEs, and linked them to more than 2 billion user accounts,
              which places the company among the largest private cross-border payments networks globally by merchant
              reach even before considering parent-affiliate ecosystems.
