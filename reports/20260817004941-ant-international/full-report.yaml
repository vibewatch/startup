              treasury flows within the Ant ecosystem. The result looks less like a monolithic app and more like a set
              of shared infrastructure components: wallet connectivity, merchant acceptance, acquiring, FX and treasury
              logic, account services, risk and fraud controls, and credit services. This architecture is particularly
