companyProfile:
  summary: >-
    Ant International is the Singapore-headquartered international arm spun into independent operation in 2024 from Ant
    Group's wider restructuring. It organizes its business around Alipay+ for cross-border merchant and wallet
    connectivity, Antom for payment acceptance and orchestration, WorldFirst for SME cross-border accounts and trade
    enablement, and Bettr / treasury-linked services for broader financial inclusion and liquidity use cases. Public
    company materials say it serves more than 150 million merchants, connects more than 2 billion user accounts, and
    closed an approximately US$1.2 billion Series A in July 2026 at roughly a US$11.2 billion valuation.
  foundedDate: '2024-03-20'
  foundingLocation: Singapore
  headquarters: Singapore
  productSummary: >-
    Product pillars include Alipay+, Antom, WorldFirst, and Bettr, spanning payment acceptance, wallet interoperability,
    SME accounts and FX, acquiring, treasury-linked infrastructure, and related financial-services tooling.
  customerFocus: >-
    Core customers include merchants, marketplaces, mobile-wallet ecosystems, SMEs selling cross-border, and enterprises
    or platforms using payments and treasury capabilities across emerging and international corridors.
  businessModel: >-
    Revenue appears to come from merchant payment fees, cross-border settlement and FX spread, account and value-added
    service fees, and broader treasury / embedded-finance monetisation, though standalone segment economics remain
    publicly undisclosed.
  stage: late-stage private
  fundingStatus: >-
