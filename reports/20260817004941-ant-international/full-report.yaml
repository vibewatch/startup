  - id: FE001
    title: Product architecture map
    type: stack
    layout: standard
    summary: >-
      Stack view of Ant International’s public product architecture from consumer-wallet access through merchant
      acceptance, treasury, and finance layers.
    approximationNotes: Conceptual stack derived from official product descriptions; not a proprietary internal architecture diagram.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE009
      - CE010
      - CE011
      - CE012
    data:
      layers:
        - label: Consumer / wallet access
          detail: Alipay+ wallet gateway, QR schemes, bank apps, and consumer payment methods across 220+ markets.
        - label: Merchant acceptance
          detail: >-
            Antom and 2C2P by Antom for online/offline checkout, local methods, cards, acquiring, payout, and
            remittance.
        - label: Settlement / accounts / FX
          detail: WorldFirst global account, collection, payout, settlement, FX conversion, and treasury workflow.
        - label: Treasury intelligence
          detail: >-
            Falcon and Bettr treasury tooling for FX exposure prediction, liquidity visibility, and real-time treasury
            optimization.
        - label: Finance / credit layer
          detail: Bettr, ANEXT Bank, and global credit services for lending, embedded finance, and partner enablement.
        - label: Risk / trust / compliance
          detail: Compliance structure, AI-security controls, anti-deepfake capability, and regulated entity oversight.
