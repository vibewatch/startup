        title: Customer Base Segmentation and Geographic Weighting
        blocks:
          - type: paragraph
            body: >-
              Ant International’s customer base cannot be summarized by a single user count because the company serves
              several layers of the payments ecosystem at once. The most visible groups are merchants accepting
              cross-border wallet and local-method payments; SMEs using WorldFirst accounts and treasury tools; payment
              partners and super apps such as GCash, DANA, TrueMoney, and TNG Digital; enterprise merchants and
              platforms using Antom and 2C2P infrastructure; and finance partners or digital-bank users served through
              Bettr and ANEXT Bank. Geography matters. Public materials consistently point to Southeast Asia, South
              Asia, the Middle East, and Latin America as core growth corridors, with product emphasis on fragmented but
              fast-growing digital economies. Merchant exposure is heavily SME-weighted: Ant says 90% of its 150 million
              merchants are SMEs, while Alipay+ and WorldFirst materials emphasize long-tail merchant and exporter
              enablement. Customer “buyers” also vary by module. A GCash or Mastercard partnership buyer is a platform
              or scheme; a WorldFirst buyer is a finance lead at an SME; an AirAsia MOVE buyer is an enterprise commerce
              operator. This multi-sided segmentation broadens the addressable base, but it also means retention and
              concentration must be evaluated differently by product line.
