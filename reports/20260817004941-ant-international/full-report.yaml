      - number: '4.3'
        title: Unit Economics, Margin Potential, and Estimate Ranges
        blocks:
          - type: paragraph
            body: >-
              Because Ant International has not disclosed revenue, investors need to reason from peer pricing and
              business-model mix. Public comps show a wide monetization envelope: Wise reported a 52-basis-point average
              take rate in FY2026, Airwallex publicly markets 0.5%-1.0% above interbank for major versus other
              currencies, Payoneer discloses many 1%-4% fee bands depending on use case, Stripe layers international and
              FX add-ons onto base processing, and PayPal discloses 1.5% international invoicing fees plus 2%-4% FX
              spread. Ant likely sits somewhere inside a blended version of those models: lower where it behaves like
              treasury or FX infrastructure, higher where it behaves like merchant acceptance or cross-border wallet
              checkout. This suggests that headline transaction count alone is not a good proxy for revenue; product mix
              and corridor mix matter more. Margin potential should also vary materially by business line. Merchant and
              FX flows can scale efficiently once local-rail and compliance infrastructure are in place, but embedded
              credit introduces capital, loss, and funding risk. The strongest unit-economics thesis is that Ant’s
              multi-product bundle raises revenue per merchant over time through accounts, treasury, payments, and
              value-added tools. The weakest thesis is that the core is still mostly payment volume with limited
              software-like margin or recurring visibility. Public evidence supports the first possibility, but not yet
              strongly enough to prove it.
