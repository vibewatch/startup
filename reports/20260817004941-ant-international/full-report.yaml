              - CV039
              - CV040
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The final underwriting question is not whether Ant can keep growing; it is whether that growth will
              eventually become legible enough for public or strategic buyers to reward it at a meaningfully higher
              valuation. A 5-7 year hold with IPO or strategic-sale optionality is reasonable, but only if Ant
              strengthens its standalone reporting and proves that product expansion improves economics rather than just
              narrative breadth. The highest-priority blockers are straightforward: audited-style standalone financials,
              cohort retention and major-customer quality, margin by product or corridor, the preference stack, and hard
              data on losses, reserves, hedging, and partner concentration. Those asks are also the main thesis-break
              map. If regulation tightens, a major partner withdraws, or pricing pressure erodes economics without
              countervailing monetisation gains, the investment case should be downgraded quickly. Investors should also
              ask management to show how reported merchant, SME, and treasury growth reconcile to actual contribution
              profit, because headline network expansion can otherwise flatter perceived valuation support. This
              additional bridge is especially important if Ant seeks a future IPO path where public investors will
              expect repeatable quarterly evidence, not only strategic storytelling.
            claimRefs:
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
          - type: table
            tableRef: TV006
            claimRefs:
              - CV035
              - CV036
