  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio in Customer Workflow Terms
        blocks:
          - type: paragraph
            body: >-
              Ant International’s product design is unusually workflow-centric. The front door is Alipay+, which lets
              merchants and payment partners connect to consumer wallets, QR schemes, and cross-border payment
              experiences through a unified gateway. Antom sits closer to the merchant operating layer, supporting
              online and offline acceptance, local payment methods, cards, and settlement for businesses in more than 50
              countries and regions, while connecting them to consumers in more than 200 markets and more than 100
              currencies. WorldFirst addresses the treasury and account workflow that begins once merchants or SMEs have
              collected funds: global collection, payments, currency conversion risk management, and supply-chain
              financing. Bettr, ANEXT Bank, and global credit services extend the workflow further into lending,
              treasury intelligence, and embedded finance. This means Ant is not just helping merchants accept money; it
              is increasingly trying to own the full path from customer payment method choice to settlement, FX, working
              capital, and digital operations. That product logic is central to the company’s differentiation because it
              raises switching costs and makes each new module more valuable when attached to the others.
