      - number: '7.2'
        title: Operational and partner-dependency risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk is inseparable from partner structure. Ant International's public treasury narrative
              shows genuine execution progress: DBS says Treasury Tokens lets Ant run instant multi-currency treasury
              across markets, and HSBC says Ant is the first client for its Tokenised Deposit Service in Hong Kong. But
              those same disclosures show concentration. The most visible high-value treasury use cases depend on a
              small set of large-bank partners and on interoperability projects such as Ensemble. Whale looks
              increasingly material rather than experimental, with independent reporting saying more than a third of Ant
              International transactions were processed on-chain in 2024, yet public materials still stop short of
              giving investors unified resilience statistics across uptime, sanctions exceptions, fraud losses, or
              incident rates. Customer-side dependencies matter too. Merchant, wallet, and platform partners translate
              ecosystem reach into volume; losing a major node would not break the company, but it would slow
              compounding and raise retention questions. The result is an operational profile that is credible and
              improving, but still exposed to counterparties, controls, and 24/7 exception management.
