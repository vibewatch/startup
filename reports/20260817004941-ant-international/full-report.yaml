  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation context and comparable framework
        blocks:
          - type: paragraph
            body: >-
              Ant International’s July 2026 Series A at roughly US$11.2 billion sets a high but not absurd bar. The
              company is clearly larger and strategically broader than smaller public cross-border peers such as
              Payoneer, yet it remains well below the valuation scale of mature public leaders such as PayPal and Adyen.
              That positioning matters: Ant should not be underwritten as a cheap catch-up trade, but it also does not
              have public-market levels of disclosure, profitability visibility, or filing cadence. The best framework
              is therefore blended. Public peers provide reality checks on where trusted, audited, scaled payment
              networks trade today; private peers such as Airwallex show what investors have been willing to pay for
              high-growth infrastructure stories without full public transparency. Ant’s network scale, WorldFirst
              adjacency, merchant reach, and treasury narrative support strategic relevance, but the information gap is
              still material. Without precise standalone public economics, a scenario-based approach is more defensible
              than a single heroic multiple.
            claimRefs:
              - CV001
              - CV002
              - CV003
