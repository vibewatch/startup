      - number: '8.2'
        title: Scenario ranges and comparable logic
        blocks:
          - type: paragraph
            body: >-
              The scenario framework should reflect both real optionality and real uncertainty. The bull case assumes
              Ant turns network breadth into better monetisation, uses treasury and tokenised-money tools to deepen
              enterprise stickiness, and improves its disclosure quality enough for the market to underwrite it more
              like a trusted platform than an opaque private asset. The base case assumes healthy but not explosive
              appreciation: scale keeps compounding, but take-rate pressure and disclosure discount keep valuation gains
              modest. The bear case does not require collapse; it only requires some combination of slower growth,
              pricing pressure, regulatory friction, or failure to prove margin quality. Public comparables reinforce
              why dispersion matters. Payoneer’s smaller market cap shows how quickly the market can compress payments
              assets without a premium narrative, while Adyen and PayPal show how much more valuable payments franchises
              can become once transparency and trust are stronger. Ant sits squarely between those poles today.
            claimRefs:
