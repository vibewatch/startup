      - number: '1.3'
        title: Funding, Ownership Signals, and Valuation Ambiguity
        blocks:
          - type: paragraph
            body: >-
              Ant International announced in July 2026 that it closed an approximately $1.2 billion Series A equity
              financing. Across official and independent coverage, only Ant Group and Alibaba Group were named as
              participating existing investors; the company referred to other participating institutions only as
              “renowned international investment institutions,” with no lead investor or allocation detail disclosed.
              Management said proceeds would accelerate global expansion and innovation in merchant payments, account
              management, and inclusive financial services for SMEs and enterprises. Third-party valuation coverage is
              directionally strong but not fully consistent: Reuters syndicated coverage said the company had been
              valued at about $10 billion before the round, while Crunchbase later described the recent funding value as
              $11.2 billion. That divergence is not fatal, but it matters because the round is effectively the first
              external equity financing after the spinout, so investors are using a partially opaque price anchor. The
              absence of a disclosed cap table, named external leads, or detailed use-of-proceeds segmentation should be
              treated as a material diligence gap rather than a footnote.
