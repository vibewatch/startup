  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              Ant International is not competing only with “payments companies.” It faces at least three competitor
              sets: first, global merchant-acquiring and orchestration platforms such as Stripe, PayPal, and Adyen;
              second, SME cross-border account, FX, and payout specialists such as Wise, Payoneer, and WorldFirst;
              third, emerging-market and multi-rail infrastructure players such as dLocal, Nium, Thunes, and Airwallex.
              Juniper and FXC both frame the cross-border market as one where banks retain scale but specialist
              providers increasingly differentiate on local payment methods, real-time settlement, embedded finance, and
              corridor coverage. Ant’s positioning is unusually broad because it can combine merchant acceptance, wallet
              interoperability, treasury, SME accounts, and financial services. That breadth means almost every
              comparison is asymmetric: Stripe is stronger in developer-led merchant integration, Wise is stronger in
              transparent SME FX pricing, Payoneer is stronger in marketplace payouts, Adyen is stronger in enterprise
              local acquiring, dLocal and Thunes are stronger in some last-mile emerging-market corridors, and Airwallex
              is the most credible multi-product business-finance analogue. The practical question for diligence is
              therefore not “who is the one direct competitor?” but which rival has the advantage on each workflow Ant
              wants to own.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
