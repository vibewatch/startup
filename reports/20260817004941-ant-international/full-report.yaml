      - Main assumption
      - What has to be true
    rows:
      - - Bull
        - US$18B-US$24B
        - 1.6x-2.1x
        - Treasury monetisation, margin proof, and disclosure improve
        - Ant proves higher-quality earnings and broadens trusted enterprise use cases
      - - Base
        - US$12B-US$16B
        - 1.1x-1.4x
        - Steady growth, some pricing pressure, partial disclosure improvement
        - Scale continues but certainty discount persists
      - - Bear
        - US$7B-US$9B
        - 0.6x-0.8x
        - Regulation, competition, or margin quality disappoints
        - Network breadth fails to offset price and disclosure pressures
    notes: >-
      Range-based scenarios are more defensible than point estimates because direct multiple anchoring is
      under-constrained by public data.
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV024
      - CV026
      - CV027
  - id: TV004
    title: Underwriting assumption table
    slug: underwriting-assumption-table
    columns:
      - Assumption area
      - Bull case
      - Base case
      - Bear case
      - Evidence quality
    rows:
      - - Growth quality
        - Merchant and SME scale converts into better monetisation
        - Growth continues but mix stays partly opaque
        - Growth slows and take rates tighten
        - Medium
      - - Disclosure
        - Standalone economics become investor-grade
        - Some improvement, still incomplete
        - Gap persists
        - Low-medium
      - - Product mix
        - Treasury / WorldFirst / higher-value products deepen attach
        - Payments remain dominant with gradual attach
        - Adjacency remains narrative-heavy
        - Medium
      - - Regulation
        - No major setbacks; tokenisation path remains constructive
        - Manageable but slower regulatory path
        - Licensing or policy drag emerges
        - Medium
      - - Exit path
        - IPO or strategic sale at stronger confidence multiple
        - Moderate rerating with disciplined buyer interest
        - Little rerating, possible markdown
        - Medium
    notes: The disclosure assumption is the swing factor that most sharply separates the scenarios.
    claimRefs:
      - CV014
      - CV015
      - CV024
      - CV025
      - CV028
      - CV030
  - id: TV005
    title: Entry discipline and preferred terms table
    slug: entry-discipline-and-preferred-terms-table
    columns:
      - Item
      - Why it matters
      - Preferred stance
      - Consequence if unavailable
    rows:
      - - Entry price
        - Current round already assumes execution
        - Seek discount or structured downside support
        - Return profile becomes thin in base case
      - - Information rights
        - Public disclosure is incomplete
        - Quarterly management accounts and KPI package
        - Investor remains structurally blind
      - - Pro rata / ownership
        - Needed to preserve upside if thesis proves out
        - Strong pro rata rights
        - Upside diluted despite good execution
      - - Preference visibility
        - Waterfall can reshape common-equity outcomes
        - Full cap table and liquidation preference map
        - True downside cannot be modeled
      - - Governance access
        - Complex regulated business needs oversight
        - Board observer or equivalent
        - Monitoring becomes reactive instead of active
    notes: Better terms can do as much for returns here as a modest improvement in growth.
    claimRefs:
      - CV032
      - CV033
      - CV034
  - id: TV006
    title: Final diligence asks and thesis-break table
    slug: final-diligence-asks-and-thesis-break-table
    columns:
      - Priority
      - Ask / trigger
      - Why it matters
      - If unresolved / triggered
    rows:
      - - P1 blocker
        - Standalone audited-style financials and margin bridge
        - Without this, valuation precision is too weak
        - Remain at conditional interest or pass
      - - P1 blocker
        - Cap table and liquidation preferences
        - Needed to model common-equity outcomes
        - Do not underwrite full last-round price
      - - P1 blocker
        - Cohort retention and major-customer quality
        - Volume without retention quality can be overvalued
        - Reduce multiple and scenario upside
      - - P1 blocker
        - Fraud-loss, reserve, and hedging policy data
        - Treasury and FX scale require disciplined controls
        - Risk rating increases materially
      - - Thesis-break
        - Regulatory / partner / pricing deterioration
        - These are the fastest ways to de-rate the story
        - Downgrade to pass or markdown case
    notes: These asks are intentionally narrow and decision-critical rather than a generic full-scope data-room checklist.
    claimRefs:
      - CV035
      - CV036
      - CV037
      - CV038
      - CV040
