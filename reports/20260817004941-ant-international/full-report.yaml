      - number: '4.4'
        title: Underwriting Gaps and What Still Needs Verification
        blocks:
          - type: paragraph
            body: >-
              The single largest problem in Ant International’s financial chapter is not scale but observability. There
              is still no public audited revenue, no disclosed product-level revenue mix, no standalone gross margin, no
              explicit EBITDA or free-cash-flow profile, no disclosed net revenue retention, and no transparent
              credit-loss or provisioning history for embedded-finance products. The intercompany picture also remains
              important. Ant International was separated structurally from Ant Group, but strategic shareholding,
              operational ties, treasury arrangements, licensing support, or technology-service relationships could
              still materially affect standalone profitability. Likewise, the company’s geographic reach is a strength
              only if the unit economics by corridor are positive after local-method costs, compliance, and fraud loss.
              Without that detail, the current diligence conclusion has to be cautiously positive but incomplete. There
              is enough evidence to believe Ant has a real and valuable financial engine; there is not enough evidence
              to underwrite that engine precisely at the July 2026 valuation without a data room. Management’s burden of
              proof should be high on revenue quality, contribution margin by product, embedded-credit performance, and
              parent-related transfer economics.
