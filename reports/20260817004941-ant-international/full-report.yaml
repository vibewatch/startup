      - number: '2.4'
        title: Growth Drivers and Infrastructure Enablers
        blocks:
          - type: paragraph
            body: >-
              Several forces are expanding the market simultaneously. HSBC’s 2026 payment trends report identifies trade
              rewiring, digital commerce, embedded finance, richer data, AI, and infrastructure modernization as the
              main drivers of international payment growth. FXC’s Asia work adds tourism, online retail, and
              interoperability projects as especially important in APAC, while dLocal’s handbook stresses that local
              cards, wallets, QR codes, and real-time transfers are no longer “alternative” payment methods in emerging
              markets—they are the operating norm. At the infrastructure level, BIS, FSB, and Axis Intelligence all
              point to ISO 20022 migration, extended RTGS hours, fast-payment-system interlinking, and legal/regulatory
              harmonization as essential enablers. Axis reports that 97% of SWIFT payment instructions were using ISO
              20022 by late 2025 and that 66% of RTGS systems were already 24/7, extended-hours, or planning to move
              there. Convera argues that multi-rail strategy is becoming the competitive standard as corporates choose
              corridor-specific paths instead of relying on one universal rail. For Ant International, these drivers
              matter because the company is built to monetize complexity: wallet bridges, merchant acceptance,
              cross-border settlement, treasury management, and embedded finance all become more valuable as payment
              behavior localizes and payment infrastructure globalizes.
            claimRefs:
              - CM009
              - CM012
              - CM018
              - CM019
              - CM020
