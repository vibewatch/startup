  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and geopolitical risk
        blocks:
          - type: paragraph
            body: >-
              Ant International's risk profile starts with regulation because the company sits at the junction of
              payments, FX, treasury, and emerging tokenised-money infrastructure. Singapore matters disproportionately:
              the group is headquartered there, and the Payment Services Act provides the legal frame for licensed
              payment activity, safeguarding, and conduct expectations. Hong Kong matters next because Ant has placed
              Whale and its tokenised-deposit treasury use cases inside HKMA's Project Ensemble path from sandbox to
              EnsembleTX. That is strategically valuable but also means Ant is expanding under visible supervisory
              scrutiny rather than in a lightly regulated pocket. The company's linkage to Ant Group adds a separate
              geopolitical layer. Even after the 2024 restructuring, counterparties can still attach legacy China-policy
              and reputation concerns to the Ant name. The emerging stablecoin initiative sharpens this tension: it may
              improve future settlement efficiency, but it also widens the licensing perimeter and adds prudential,
              reserve, and conduct questions. For investors, this category is the single most important tail-risk driver
              because one core-jurisdiction problem could spill across bank, merchant, and partner diligence across the
              wider network.
            claimRefs:
              - CR001
