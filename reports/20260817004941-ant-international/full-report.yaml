      - number: '2.5'
        title: Adoption Constraints, Frictions, and Contradictory Estimates
        blocks:
          - type: paragraph
            body: >-
              The market is attractive precisely because it is still hard. FSB and BIS continue to frame the industry
              around four enduring frictions—high cost, low speed, limited access, and insufficient transparency—and BIS
              explicitly says the G20’s end-2027 targets are unlikely to be met on time. Atlantic Council’s 2026 brief
              argues that fragmentation is being driven simultaneously by market structure, technology, regulation, and
              geopolitics, which means innovation alone will not remove friction. Regulatory costs, AML/KYC
              expectations, uneven non-bank access, tariffs, currency volatility, and fraud all still matter, and they
              matter more in exactly the corridors Ant International targets. PaymentsJournal and Finastra both note
              that correspondent banking consolidation and compliance costs have reduced reach in parts of Asia and
              smaller corridors, while Deloitte warns that fraud and financial crime risk rises as MSMEs digitize faster
              than their control stacks. Even market size is contradictory until one specifies the unit of analysis:
              revenue estimates in the hundreds of billions can coexist with flow estimates in the tens or hundreds of
              trillions because they measure different things. For diligence, that means no single market number should
              drive conviction. The better question is whether Ant is aligned to the high-friction segments—SME
              cross-border commerce, local-wallet acceptance, and multi-rail settlement—where both demand growth and
              monetizable complexity remain durable.
            claimRefs:
              - CM001
              - CM016
              - CM017
              - CM021
              - CM022
              - CM033
              - CM034
              - CM035
              - CM036
              - CM037
              - CM039
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: The most useful market number is not the largest one
            body: >-
              Ant International does not need to win the entire US$208 trillion cross-border flows market. The
              economically relevant slice is the revenue-dense intersection of SME B2B, cross-border merchant
              acceptance, and interoperability-heavy corridors where take rates and bundling opportunities remain above
              wholesale banking levels.
            calloutType: insight
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM031
          - type: callout
            title: Asia-Pacific remains the most strategic regional wedge
            body: >-
              APAC combines large outbound flow, fast wallet adoption, tourism, QR interoperability, and growing
              e-commerce. Multiple sources show the region moving faster than global averages on both demand and
              infrastructure modernization, which supports Ant International's regional-first strategy.
            calloutType: strength
            claimRefs:
              - CM008
              - CM010
              - CM013
              - CM014
              - CM038
              - CM044
          - type: callout
            title: Fragmentation is both the opportunity and the tax
            body: >-
              The same market fragmentation that makes multi-rail platforms valuable also raises compliance cost, slows
              interoperability, and limits how quickly end users actually feel improvement. That is why BIS and FSB
              still see only modest progress against the G20 targets.
            calloutType: risk
            claimRefs:
              - CM016
              - CM017
              - CM020
              - CM033
              - CM034
              - CM037
          - type: callout
            title: Wallet-driven growth still requires trust and control infrastructure
            body: >-
              Deloitte, PaymentsJournal, and other sources emphasize that fraud, financial crime, and inconsistent
              regulation rise with faster MSME digitization. A provider can only monetize cross-border growth
              sustainably if compliance, risk scoring, and data standards keep pace with volume.
            calloutType: risk
            claimRefs:
              - CM023
              - CM037
