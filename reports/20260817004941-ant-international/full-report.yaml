            body: >-
              Public disclosures point to a multi-rail architecture built around one-time integration, local method
              access, merchant digitisation, and treasury intelligence. The Alipay+ home page describes a unified wallet
              gateway connecting billions of consumers, 50-plus mobile payment providers, 10-plus national payment
              networks, 220-plus markets, and very large QR and NFC merchant footprints. Ant’s own home page describes
