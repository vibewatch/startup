        - [financing, opacity]
        - [opacity, recommendation]
        - [recommendation, diligence]
    claimRefs: [CV001, CV002, CV006, CV008, CV015]
callouts:
  - calloutType: recommendation
    title: Price discipline is the decision gate
    body: Public evidence supports strategic relevance but not a current price or return calculation. Retain a track/research-more stance until a current valuation, fully diluted cap table, revenue quality, and preference terms are verified.
    claimRefs: [CV006, CV009, CV015]
  - calloutType: risk
    title: Contingent value is not realized cash
    body: Sanofi's potential deal value above $1 billion is tied to development, regulatory, and commercial milestones; it should not be treated as booked revenue, cash available, or a valuation mark.
    claimRefs: [CV002, CV003]
