          note: "Sanofi and Harbour BioMed collaborations provide external validation, with contingent economics"
        - id: financing
          label: "Financing optionality"
          note: "A reported confidential Hong Kong IPO application is not a priced financing"
        - id: opacity
          label: "Price and cap-table opacity"
          note: "Current valuation, revenue denominator, dilution, and preferences remain unresolved"
        - id: recommendation
          label: "Track / research-more"
          note: "Require price-linked financial and ownership diligence before buy"
        - id: diligence
          label: "Diligence gate"
          note: "Verify price, ownership, revenue quality, and milestone conversion"
      edges:
