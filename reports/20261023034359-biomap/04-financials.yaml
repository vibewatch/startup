schemaVersion: "report-v2"
artifact: financials
slug: biomap
runDate: 2026-10-23
company:
  name: BioMap
chapter:
  number: 4
  title: Financials
  summary: BioMap presents a hybrid monetization model spanning partner-funded discovery, platform licensing, and discovery services, but public evidence does not disclose recognized revenue, margins, cash, burn, or realized pricing. Large milestone opportunities and reported institutional reach support commercial potential while leaving underwriting dependent on private diligence.
sections:
  - id: monetization-and-revenue-quality
    title: Monetization and revenue quality
    body: "BioMap's public materials describe more than one route to monetization rather than a simple software subscription. AI Health Index reports that the company earns by co-developing with partners rather than selling access, while BioMap's own site says BioMap OS can be deployed as models, software, or a complete system and can support system-based discovery services. The Sanofi announcement provides the clearest economic datapoint: a $10 million upfront payment, near-term module-development payments, and more than $1 billion of potential pre-clinical, clinical, regulatory, and commercial milestones. Those figures are contract consideration and contingent upside, not recognized revenue or ARR. Public sources do not separate platform licenses, research services, upfronts, milestones, royalties, or any product-line mix, so revenue quality cannot yet be tested against recurring versus project-based economics."
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
  - id: traction-and-sales-efficiency
    title: Traction and sales-efficiency proxies
    body: "Public traction is strongest on customer and project counts, not on financial conversion. BioMap's website states that it supports more than 800 institutional users, more than 30 leading enterprises, and more than 80 proof-of-concept programs; an earlier company launch article reported more than 500 institutional clients and a $2 billion total potential order value. These are company-reported or company-syndicated operating indicators and lack a disclosed denominator for paid conversion, renewal, average contract value, or recognized revenue. Partnerships with Sanofi, XBiome, Harbour BioMed, and Kexing Biopharm show channel and use-case breadth, but disclosed financial terms are sparse outside Sanofi. The public record therefore supports commercial engagement, while CAC, sales cycle, implementation cost, payback, and channel economics remain unavailable."
    claimRefs: [CI005, CI006, CI007, CI008]
  - id: cost-structure-and-capital-needs
    title: Cost structure and capital needs
    body: "BioMap's cost base is likely shaped by model development, high-performance computing, data acquisition, wet-lab experimentation, and specialist scientific staff, but public sources do not provide accounting costs or gross margin. BusinessWire says the company used super-scale computing, public and private datasets, automation, and integrated workflows; the Harbour BioMed announcement describes an intelligent dry-wet laboratory and a proposed five-petabyte data-generation program over five years. These disclosures indicate meaningful infrastructure and experiment costs, but they do not quantify capex, cloud expense, laboratory cost, personnel expense, working capital, or service-delivery cost. The historical round chronology is addressed in Company Overview; this chapter focuses on forward capital adequacy. A reported confidential Hong Kong IPO filing aimed to raise several hundred million dollars, according to Yicai, but that is a reported financing plan rather than cash on hand or proof of runway."
    claimRefs: [CI009, CI010, CI011, CI012]
    tableRefs: [TI003]
  - id: underwriting-verdict
    title: Underwriting verdict and diligence blockers
    body: "The financial case is strategically attractive but not presently modelable from public evidence. The company has a credible set of monetization mechanisms, real pharmaceutical counterparties, and platform usage claims, yet the public record omits the core inputs needed to distinguish a high-margin software business from a project-heavy discovery-services business. A competitor benchmark is illustrative rather than a BioMap estimate: Recursion Pharmaceuticals' revenue page reports $53.93 million of trailing revenue in 2026 and $74.25 million in 2025, but BioMap has not published a comparable revenue series. The adverse underwriting signal is therefore disclosure opacity, not evidence of insolvency. Investment sizing should remain conditional on audited revenue recognition, cash and debt, burn, margin bridge, contract terms, and customer concentration."
    claimRefs: [CI013, CI014, CI015, CI016]
    figureRefs: [FI001]
callouts:
  - calloutType: recommendation
    title: Financial stance
    body: Treat BioMap as a diligence-dependent growth opportunity rather than an underwritable financial compounder until revenue, cash, burn, margin, and contract-level conversion data are disclosed.
    claimRefs: [CI003, CI012, CI016]
  - calloutType: risk
    title: Primary financial risk
    body: Contingent milestone headlines and institutional-user counts could overstate near-term revenue quality if recurring licenses, paid conversion, renewal, and recognized revenue remain unreported.
    claimRefs: [CI004, CI005, CI016]
tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns: [Stream, Mechanism, Unit or payment basis, Current public value/status, Quality, Diligence ask]
    rows:
      - [Platform licensing, "BioMap OS deployed as models, software, or complete system", "License or system deployment; price not published", "Available as a stated commercial mode; no realized revenue disclosed", "Company-described mechanism", "Obtain contracts, recognized revenue, gross margin, renewal and implementation cost"]
      - [Discovery services, "System-based discovery services such as protein discovery", "Project or service engagement; price not published", "Offered publicly; no revenue mix disclosed", "Company-described mechanism", "Obtain project contribution margin, staffing model, cycle time and backlog"]
      - [Partner co-development, "AI modules and co-development with pharmaceutical partners", "Upfront, development payments, milestones and possible royalties", "$10M upfront from Sanofi; more than $1B potential contingent payments", "Contract announcement; contingent amounts", "Obtain accounting treatment, probability-weighted pipeline and milestone realization history"]
      - [Pipeline and asset creation, "AI-identified candidates and joint pipeline companies", "Potential upfronts, milestones and royalties", "MegaStream parties entitled to potential payments, milestones and royalty sharing; amounts undisclosed", "Partner announcement; terms incomplete", "Obtain ownership, economics, payment timing and obligations by asset"]
    notes: "Public sources describe mechanisms and selected contract terms, but do not provide a reconciled revenue denominator or revenue mix; contingent milestone value is not recognized revenue."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization transparency
    columns: [Offering, List or realized price, Contract model, Public evidence, Unknowns, Diligence ask]
    rows:
      - [BioMap OS, null, "Models, software, or complete system deployment", "BioMap says the platform supports configurable components and cloud or on-premises deployment", "No list price, realized price, discount, minimum commitment or support fee", "Request current price book and three anonymized invoices"]
      - [Protein and antibody discovery, null, "System-based discovery service or licensed workflow", "BioMap describes discovery services and 40+ advanced protein programs", "No price per program, milestone schedule or service gross margin", "Request unit pricing, staffing hours and realized contribution margin"]
      - [Sanofi collaboration, "$10M upfront; >$1B potential payments", "Upfront plus near-term development payments and milestones", "BusinessWire announcement", "No payment schedule, probability, royalty rate or recognized revenue", "Reconcile contract accounting and milestone status"]
      - [Institutional access, null, "Institutional users and enterprise engagements", "More than 800 institutional users and 30+ leading enterprises claimed on company site", "Paid versus unpaid users and contract value are not disclosed", "Provide paid-user definition, ACV, retention and concentration"]
    notes: "Null means the public source does not disclose a price; official or company-reported availability is not evidence of realized pricing or revenue."
    claimRefs: [CI001, CI003, CI005, CI006]
  - id: TI003
    title: Unit-economics and capital-adequacy inputs
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue or ARR, null, "Unavailable publicly", "Separates recurring platform economics from project and milestone revenue", "Audited revenue bridge by stream and ARR definition"]
      - [Gross margin, null, "Unavailable publicly", "Tests whether compute, wet-lab and services costs scale with revenue", "Gross-margin bridge by offering and customer cohort"]
      - ["CAC, payback and sales cycle", null, "Unavailable publicly", "Tests whether enterprise distribution is economically repeatable", "Request bookings funnel, fully loaded CAC, cycle and payback"]
      - [Cash and burn, null, "Unavailable publicly", "Determines financing dependency and runway", "Latest cash, monthly burn, committed spend and runway cases"]
      - [Debt and project-finance obligations, null, "Unavailable publicly", "Identifies claims ahead of equity and fixed obligations", "Debt schedule, leases, guarantees and laboratory commitments"]
      - [IPO proceeds, "Several hundred million dollars reportedly targeted", "Low-to-medium; media report, not filing", "Could fund scale but does not establish cash available", "Verify filing status, size, use of proceeds and dilution"]
    notes: "Null values are explicit evidence gaps, not zeroes or estimates. The IPO figure is a reported target and should not be treated as cash raised."
    claimRefs: [CI009, CI010, CI011, CI012, CI013, CI014]
