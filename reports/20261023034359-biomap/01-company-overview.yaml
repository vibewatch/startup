company:
  name: BioMap
chapter:
  number: 1
  title: Company Overview
  summary: BioMap is a 2020-founded life-science AI company built around the xTrimo foundation-model family and BioMap OS, a dry-wet discovery system. Current evidence supports meaningful platform adoption, partner validation, and commercial milestone potential, but public disclosure remains insufficient to reconcile revenue, ownership, valuation, and operating scale.
sections:
  - id: identity-and-platform
    title: Identity, platform, and operating model
    body: >-
      BioMap was founded in 2020 by Robin Li and Wei Liu, with the company describing itself as a life-science AI foundation-model company. Its current product architecture is centered on xTrimo, a protein- and biology-focused foundation-model family, and BioMap OS, which combines knowledge aggregation, predictive design, experimental control, and model training. The company positions the system as deployable as models, software, or a complete system, including cloud and on-premises deployment. This supports an enterprise platform-plus-discovery-services model rather than a single drug-asset thesis. The evidence is primarily company-issued or company-republished, so technical and adoption metrics should be treated as company claims pending customer-level validation.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: leadership-and-governance
    title: Founders, leadership, and governance
    body: >-
      The evidence identifies Robin Li as a co-founder and early chairman, and Wei Liu as co-founder and chief executive officer in partner and company materials. BioMap’s public materials also identify technical and business leaders such as Le Song, Deng Yongfu, Zhang Xiaoming, Wei Yuan, and Xu Ziyao, but do not provide a complete board roster, committee structure, succession plan, or executive tenure table. The company’s dependence on founder-linked strategic relationships is material: Baidu ties are repeatedly mentioned in independent and partner coverage, while core product credibility rests on a relatively small set of named technical leaders. Governance and key-person diligence therefore remain open rather than inferred from titles in press releases.
    claimRefs: [CO005, CO006, CO007, CO008]
    tableRefs: [TO002]
  - id: funding-commercialization
    title: Funding, commercialization, and scale signals
    body: >-
      Public evidence shows a 2021 Series A described by Pharmaphorum as $100 million, a Sanofi collaboration with a $10 million upfront payment and potential milestone value above $1 billion, and later reporting of more than $200 million in cumulative financing. These figures are not interchangeable: deal value is contingent consideration, funding is capital raised, and upfront cash is not disclosed as available cash. The company reports more than 800 institutional users, more than 30 leading enterprises, and more than 80 proof-of-concept programs on its current website; a 2025 event report instead cited more than 500 institutional clients and a $2 billion potential order value. The differing snapshots are a reason to preserve dates and denominators, not to select a single “customer count.”
    claimRefs: [CO008, CO009, CO010, CO011, CO012, CO013]
    tableRefs: [TO003]
  - id: milestones-and-open-gaps
    title: Milestones and unresolved diligence
    body: >-
      BioMap’s observable milestones run from its 2020 founding through the 2023 Sanofi collaboration, later platform launches and partner integrations, and 2026 reporting of a confidential Hong Kong IPO filing. Partner announcements show the company extending its model into antibodies, complex biologics, microbiome applications, and autoimmune discovery. The strongest positive signal is repeated translation of the platform into external collaborations; the strongest limitation is that most scale, model-performance, and commercial-value numbers remain issuer-reported or reported without audited operating context. No retained source supplies a reconciled revenue denominator, customer concentration, headcount, complete cap table, or confirmed IPO terms.
    claimRefs: [CO014, CO015, CO016]
    figureRefs: []
callouts:
  - calloutType: strength
    title: External platform validation
    body: Sanofi, Harbour BioMed, XBiome, and Biogend materials describe collaborations that apply BioMap’s models or discovery system to distinct biological workflows, providing stronger validation than a product description alone.
    claimRefs: [CO010, CO014, CO015]
  - calloutType: risk
    title: Disclosure remains incomplete
    body: Public evidence does not reconcile revenue, ownership, valuation, headcount, customer concentration, or the economic status of reported pipeline and partnership milestones.
    claimRefs: [CO013, CO016]
