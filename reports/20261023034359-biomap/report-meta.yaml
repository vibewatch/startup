companyProfile:
  summary: >-
    BioMap is a Beijing-based life-science AI company founded in 2020 by Robin Li and Wei Liu. It develops the xTrimo
    biology foundation-model family and BioMap OS, a dry-wet discovery system spanning biological data, predictive
    design, experiments, and model training. Current evidence shows broad institutional and partner adoption, but public
    disclosure does not reconcile revenue, valuation, ownership, customer concentration, or operating scale.
