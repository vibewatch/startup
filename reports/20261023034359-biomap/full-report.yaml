          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI003
              - CI005
              - CI006
      - number: '4.2'
        title: Traction and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              Public traction is strongest on customer and project counts, not on financial conversion. BioMap's website
              states that it supports more than 800 institutional users, more than 30 leading enterprises, and more than
              80 proof-of-concept programs; an earlier company launch article reported more than 500 institutional
              clients and a $2 billion total potential order value. These are company-reported or company-syndicated
              operating indicators and lack a disclosed denominator for paid conversion, renewal, average contract
              value, or recognized revenue. Partnerships with Sanofi, XBiome, Harbour BioMed, and Kexing Biopharm show
              channel and use-case breadth, but disclosed financial terms are sparse outside Sanofi. The public record
              therefore supports commercial engagement, while CAC, sales cycle, implementation cost, payback, and
              channel economics remain unavailable.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
      - number: '4.3'
        title: Cost structure and capital needs
        blocks:
          - type: paragraph
            body: >-
              BioMap's cost base is likely shaped by model development, high-performance computing, data acquisition,
              wet-lab experimentation, and specialist scientific staff, but public sources do not provide accounting
              costs or gross margin. BusinessWire says the company used super-scale computing, public and private
              datasets, automation, and integrated workflows; the Harbour BioMed announcement describes an intelligent
              dry-wet laboratory and a proposed five-petabyte data-generation program over five years. These disclosures
              indicate meaningful infrastructure and experiment costs, but they do not quantify capex, cloud expense,
              laboratory cost, personnel expense, working capital, or service-delivery cost. The historical round
              chronology is addressed in Company Overview; this chapter focuses on forward capital adequacy. A reported
              confidential Hong Kong IPO filing aimed to raise several hundred million dollars, according to Yicai, but
              that is a reported financing plan rather than cash on hand or proof of runway.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: Underwriting verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial case is strategically attractive but not presently modelable from public evidence. The
              company has a credible set of monetization mechanisms, real pharmaceutical counterparties, and platform
              usage claims, yet the public record omits the core inputs needed to distinguish a high-margin software
              business from a project-heavy discovery-services business. A competitor benchmark is illustrative rather
              than a BioMap estimate: Recursion Pharmaceuticals' revenue page reports $53.93 million of trailing revenue
              in 2026 and $74.25 million in 2025, but BioMap has not published a comparable revenue series. The adverse
              underwriting signal is therefore disclosure opacity, not evidence of insolvency. Investment sizing should
              remain conditional on audited revenue recognition, cash and debt, burn, margin bridge, contract terms, and
              customer concentration.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
          - type: figure
