      - number: '3.2'
        title: Capability and trust comparison
        blocks:
          - type: paragraph
            body: >-
              The clearest differentiation is architectural breadth. BioMap presents xTrimo as a 268-billion-parameter,
              multimodal life-science foundation model and BioMap OS as a configurable system spanning knowledge
              aggregation, predictive design, experimental control, and model training. Owkin emphasizes patient data,
              an autonomous AI scientist, and wet-lab validation; Valo emphasizes causal biology and closed-loop
              chemistry; insitro emphasizes population-scale genetics, cellular experiments, and modality-agnostic
              therapeutics design. XBiome's partner-issued description adds a vertical alternative built around
              microbiome samples, strains, its own model, and BiomeOS. These are not directly comparable benchmark
              results: the companies use different data populations, model scopes, and validation claims. The
              competitive read-through is therefore a buyer tradeoff between BioMap's broad platform and domain-specific
              alternatives with more explicit data or clinical-workflow positioning.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP014
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP014
              - CP017
      - number: '3.3'
        title: Commercial model and pricing visibility
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports multiple commercial paths but not a comparable price card. BioMap says BioMap OS
              can be deployed as models, software, or a complete system, with system licensing and system-based
              discovery services. Its Sanofi collaboration used an upfront payment, near-term model-development
              payments, and potential pre-clinical, clinical, regulatory, and commercial milestones exceeding $1 billion
              in aggregate potential value. The MegaStream partnership similarly refers to potential upfront payments,
              success-based milestones, and royalties, without disclosing equity splits or a standard price. These
              structures can align payment with downstream value, but they also make customer economics, realized
              revenue, and switching costs difficult to compare with peers. Buyers would need contract-level evidence on
              implementation fees, usage or seat metrics, milestones, data rights, and renewal terms.
            claimRefs:
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
              - CP015
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              BioMap's potential moat is a reinforcing loop among proprietary biological data, foundation-model
              capability, configurable workflows, and experimental feedback. The company says its platform helps users
              accumulate proprietary data and train their own models, which could increase customer-specific switching
              costs if those data and workflows are difficult to export. The risk is that the loop is not unique in
              concept: Owkin, Valo, insitro, and XBiome all describe integrated model-and-lab or model-and-data systems,
              while BioMap's partnership releases are company or partner issued and therefore do not independently
              validate superiority. BioMap also does not publicly disclose a comparable retention rate, realized
              pricing, independent head-to-head benchmark, or customer concentration. The moat should therefore be
              treated as plausible but unproven, with displacement pressure from better-capitalized incumbents, internal
              pharma platforms, and modality-specific specialists.
            claimRefs:
              - CP015
              - CP017
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: paragraph
            body: >-
              The exhibits separate company descriptions from third-party market context and preserve unknowns rather
              than filling unsupported cells. The positioning map is an evidence-backed ordinal view, not a measured
              market ranking: its axes summarize breadth of integrated workflow and explicit data or laboratory
              integration in the assigned source material. Recursion's market capitalization is a public-market
              reference, not a valuation for BioMap and not a measure of product superiority for this company.
            claimRefs:
              - CP008
              - CP013
              - CP015
      - number: '3.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad platform proposition
            body: >-
              BioMap combines a foundation model, configurable discovery software, and a dry-wet feedback loop in one
              commercial proposition, which can reduce the buyer's need to assemble multiple specialist vendors.
            calloutType: strength
            claimRefs:
