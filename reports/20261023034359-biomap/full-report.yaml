  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              BioMap's buyer can choose among several materially different ways to pursue the same job: a
              foundation-model and discovery-platform vendor, a vertically integrated AI drug-discovery company, a
              partner-led collaboration, an internal build, or conventional outsourced and in-house screening. BioMap
              describes BioMap OS as deployable as models, software, or a complete system, and says it supports both
              licensed workflows and discovery services. That makes it a platform-plus-services competitor rather than a
              pure software substitute. Direct platform peers include Owkin, Valo, and insitro, each of which combines
              models with biological or experimental data. Recursion is retained only as a public-market scale reference
              because its assigned source establishes market capitalization, not product architecture. Internal build
              and conventional screening remain credible status-quo alternatives because the assigned evidence does not
              establish that BioMap's claimed efficiency gains translate across programs or procurement contexts.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
