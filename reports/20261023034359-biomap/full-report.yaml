  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              BioMap's defensible core market is narrower than healthcare AI and broader than standalone
              molecular-generation software. It includes AI software and services used for target discovery, molecular
              design, property prediction, preclinical decision support, data preparation, and experimentally validated
              dry-wet workflows. BioMap says its system can be delivered as models, software, or a complete system
              through cloud or on-premises deployment, while recent collaborations show a second motion in which the
              whole discovery system is embedded in a partner or venture. Synthetic biology and microbiome applications
              are relevant adjacencies, but downstream clinical development, manufacturing, and drug sales are excluded
              unless BioMap captures that economics directly. Status-quo substitutes include internal computational
              teams, conventional screening, point tools, CRO projects, and partner-led laboratory work.
            claimRefs:
              - CM009
              - CM011
              - CM014
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM009
              - CM011
              - CM014
              - CM015
      - number: '2.2'
        title: Market size, growth, and evidence limits
        blocks:
          - type: paragraph
            body: >-
              Global Market Insights estimates the AI-in-drug-discovery market at $3.1 billion in 2025, $4.0 billion in
              2026, and $43.9 billion in 2035, implying a 30.5% forecast CAGR from 2026 through 2035. The same source
              reports that software represented 67.9% of 2025 revenue, pharmaceutical and biotechnology companies
              represented 52.8% of end-use revenue, and North America represented 47.7% of revenue; Asia Pacific is
              forecast to grow at 31.2%. These are publisher estimates with different denominators, not BioMap TAM, SAM,
              or SOM. The market is also fragmented, with the top five participants estimated at 11.8% of 2025 revenue.
              BioMap-specific sizing remains unavailable because public sources do not disclose pricing, deployment mix,
              reachable buyer counts, implementation capacity, geographic exclusions, renewals, or market share.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM007
              - CM010
      - number: '2.3'
        title: Buyers, users, payers, and adoption paths
        blocks:
          - type: paragraph
            body: >-
              The buyer set spans pharmaceutical and biotechnology R&D leaders, AI-native pipeline companies, biologics
              partners, synthetic-biology operators, microbiome companies, and research institutions. Users are
              computational scientists, biologists, protein engineers, and wet-lab teams; payers are enterprise R&D
              budgets, program budgets, sponsored ventures, or strategic partners. BioMap's Sanofi agreement illustrates
              module-development and milestone economics, while the Biogend arrangement illustrates system export rather
              than licensing one asset. The Harbour BioMed venture describes integrated data, models, laboratories, and
              pipelines, but its greater-than-500% efficiency figure is explicitly projected rather than realized.
              BioMap's reported 800-plus institutional users and 80-plus proof-of-concept programs indicate adoption
              activity, but they do not establish recurring revenue, conversion, retention, or customer-level ROI.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Adoption is supported by scientific complexity, long development cycles, high attrition, expanding
              biological datasets, and the need to prioritize expensive experiments. IQVIA reports that inter-trial
              intervals increased by three months and identifies early evidence of stronger success rates among
              AI-enabled programs, giving buyers both a productivity problem and an emerging reason to test new tools.
              The counterweight is substantial: Global Market Insights identifies fragmented data and transferability
              limits, while regulatory expectations increase requirements for provenance, documentation, and model
              credibility. BioMap must therefore prove that outputs generalize across targets, modalities, and customer
              datasets and that its dry-wet loop produces repeatable economic gains. Until pricing, implementation cost,
              renewal, concentration, and realized ROI are disclosed, category growth should not be translated
              mechanically into BioMap revenue or a valuation premium.
            claimRefs:
              - CM007
              - CM008
              - CM012
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Category growth is not company market share
            body: >-
              The external forecast supports a fast-growing category, but BioMap's serviceable market depends on
              deployment mix, buyer budgets, implementation capacity, pricing, and geography that public sources do not
              disclose.
            calloutType: insight
            claimRefs:
