              - CE014
      - number: '5.3'
        title: Differentiation, dependencies, and control gaps
        blocks:
          - type: paragraph
            body: >-
              The most defensible differentiation thesis is the combination of biological models, proprietary or partner
              data, experimental feedback, and deployment infrastructure. The World Economic Forum profile says BioMap's
              platform uses high-granularity patient data and internally generated high-throughput wet-lab data, while
              partner disclosures show that vertical performance also depends on Sanofi datasets, Harbour BioMed
              antibody assets, and XBiome microbiome resources. This can create domain-specific learning loops, but it
              also raises portability, data-rights, and implementation risks when results depend on a partner's assays
              or expert interpretation. Public evidence does not document formal security certifications, privacy
              controls, uptime, incident history, support performance, or a dated product roadmap. Those omissions are
              evidence gaps, not proof that controls are absent. A separate Eurofins product uses the BioMAP name for a
              different phenotypic-screening platform, creating a practical source-verification risk: technical claims
              must be traced to the issuing organization rather than attributed by product-name similarity. Underwriting
              should therefore require model cards, deployment architecture, control evidence, customer references, and
              measured outcomes before treating the integrated stack as a durable moat.
            claimRefs:
              - CE003
              - CE010
              - CE011
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The product thesis is an integrated discovery loop
            body: >-
              BioMap's strongest differentiation claim is the combination of models, experiment orchestration, and
              partner data rather than model scale alone.
            calloutType: strength
            claimRefs:
              - CE006
              - CE009
              - CE013
              - CE014
          - type: callout
            title: Production controls remain under-disclosed
            body: >-
              The assigned evidence does not establish security certification, uptime, incident performance,
              standardized implementation, or independently measured customer outcomes.
            calloutType: risk
            claimRefs:
              - CE003
              - CE013
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and buying contexts
        blocks:
          - type: paragraph
            body: >-
              BioMap presents a multi-segment customer base rather than a single repeatable buyer cohort. Its current
              site says the platform has supported more than 800 institutional users and more than 30 leading
              enterprises, across antibody and protein work, innovative therapies, synthetic biology, and scientific
              research. The same site says BioMap OS can be consumed as models, software, or a complete system, through
              cloud or on-premises deployment, licensing, or discovery services. That flexibility broadens the
              addressable buyer set, but it also mixes users, enterprises, proof-of-concept programs, and commercial
              counterparties. The resulting counts are useful evidence of reach, not a clean count of paying or retained
              customers. HKIC's accelerator commitment and the XBiome relationship add ecosystem and vertical-solution
              channels beyond direct enterprise software sales.
            claimRefs:
              - CU001
              - CU002
              - CU009
              - CU010
              - CU013
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
      - number: '6.2'
        title: Adoption trajectory and proof quality
        blocks:
          - type: paragraph
            body: >-
              Public disclosures show a rising sequence, but the metric changes at each observation. HKIC reported more
              than 200 AIGP-platform contracts in June 2024; an April 2025 launch account quoted BioMap at more than 500
              institutional clients; Yicai reported in March 2026 that BioMap said it had served more than 800
              institutions and validated BioMap OS in more than 60 projects; and BioMap's September 2026 site states
              more than 800 institutional users and more than 80 proof-of-concept programs. These are not a comparable
              cohort series: contracts, clients, users, and PoCs have different denominators, and none discloses active
              usage or conversion. The strongest interpretation is widening engagement and a larger disclosed validation
              base, not a measured retention curve or verified customer growth rate.
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU005
              - CU006
              - CU014
