        - BioMap describes licensing, services, cloud/on-premises deployment, and 800+ institutional users
        - Obtain paid-customer count, renewal, pricing, gross margin, and customer concentration
      - - Financing optionality
        - Yicai reports a confidential Hong Kong IPO application and a target of several hundred million dollars
        - Obtain filing, offer range, dilution, use of proceeds, and preference conversion terms
      - - Disclosure anti-thesis
        - Public evidence does not disclose current valuation, revenue, or preference stack
        - A current cap table and audited or investor-grade financial package would reduce uncertainty
      - - Execution anti-thesis
        - Partnership announcements describe ambitious pipelines and milestones rather than realized commercial outcomes
        - Independent evidence of repeatable deployment and clinical or preclinical conversion would improve confidence
    notes: >-
      Rows distinguish company-issued partnership claims from independent reporting and identify diligence that could
      change the investment view.
    claimRefs:
      - CV002
      - CV003
      - CV005
      - CV008
      - CV010
      - CV011
      - CV013
  - id: TV003
    title: Bull / base / bear scenario
    columns:
      - Scenario
      - Operating assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - >-
          Paid platform adoption expands; partner milestones convert; IPO or strategic liquidity is executed
          transparently
        - >-
          Upside is supportable only after a verified price and financial denominator; no numeric range is supportable
          now
        - Possible but unverified
        - Milestones remain contingent or commercial conversion is not evidenced
      - - Base
        - Strategic collaborations continue, but revenue mix and repeatability remain opaque
        - Track until price, revenue quality, dilution, and preferences can be modeled
        - Most defensible on current evidence
        - No reconciled revenue, renewal, or cap-table disclosure
      - - Bear
        - Milestone economics fail to convert, budgets tighten, or financing creates adverse dilution/preferences
        - Capital impairment risk cannot be bounded without entry price and fully diluted ownership
        - Material risk
        - Down-round, delayed IPO, weak customer retention, or failed validation
      - - Diligence gate
        - Verify offer documents, cap table, contracts, financials, and customer metrics
        - Move recommendation only when downside and return can be calculated
        - Required before buy
        - Any material inconsistency between announced economics and cash realization
    notes: >-
      Scenario outputs are qualitative because public sources do not provide a current valuation, audited revenue, or a
      reliable probability distribution; contingent deal value is not treated as cash available.
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV009
      - CV012
      - CV014
      - CV015
