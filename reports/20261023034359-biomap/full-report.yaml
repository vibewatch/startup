  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization and revenue quality
        blocks:
          - type: paragraph
            body: >-
              BioMap's public materials describe more than one route to monetization rather than a simple software
              subscription. AI Health Index reports that the company earns by co-developing with partners rather than
              selling access, while BioMap's own site says BioMap OS can be deployed as models, software, or a complete
              system and can support system-based discovery services. The Sanofi announcement provides the clearest
              economic datapoint: a $10 million upfront payment, near-term module-development payments, and more than $1
              billion of potential pre-clinical, clinical, regulatory, and commercial milestones. Those figures are
              contract consideration and contingent upside, not recognized revenue or ARR. Public sources do not
              separate platform licenses, research services, upfronts, milestones, royalties, or any product-line mix,
              so revenue quality cannot yet be tested against recurring versus project-based economics.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
