              - CU008
              - CU010
              - CU012
              - CU013
      - number: '6.3'
        title: Named deployments and expansion mechanisms
        blocks:
          - type: paragraph
            body: >-
              Named counterparties provide stronger proof than aggregate user counts, but their maturity varies.
              Sanofi's 2023 agreement included a $10 million upfront payment and more than $1 billion of potential value
              tied to development, regulatory, and commercial milestones; the latter is contingent deal value, not
              realized revenue. Harbour BioMed says its collaboration with BioMap began in 2021 and covered more than
              ten pipeline programs before the parties announced MegaStream, where the economics may include upfront
              payments, milestones, and royalties. XBiome announced platform, model, application, and market
              cooperation, while HKIC's BioX commitment is an ecosystem program rather than evidence of recurring
              software revenue. The relationship set supports production-oriented engagement, but only Sanofi discloses
              an upfront payment.
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
