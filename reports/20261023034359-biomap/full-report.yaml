              - CM002
              - CM009
          - type: callout
            title: Commercial evidence trails capability evidence
            body: >-
              User, proof-of-concept, and partner disclosures demonstrate engagement, while conversion, renewals,
              customer concentration, realized efficiency, and recurring economics remain unavailable.
            calloutType: risk
            claimRefs:
