              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: Durability, retention, and concentration remain unproven
        blocks:
          - type: paragraph
            body: >-
              None of the assigned public evidence provides NRR, GRR, churn, renewal rates, contract duration,
              active-seat utilization, or revenue concentration by customer. A confidential Hong Kong filing also leaves
              the prospectus unavailable before the listing-hearing stage, according to Sohu, limiting public
              reconciliation of customer counts to revenue and concentration. The evidence therefore supports an
              adoption thesis with substantial diligence conditions: request customer-level revenue cohorts, conversion
              from PoC to paid production, renewal and expansion histories, implementation timelines, and top-customer
              exposure. Sohu's conclusion that BioMap's ability to convert its technical position into a durable
              competitive position still requires market testing is an appropriate adverse counterweight to partner and
              company announcements.
            claimRefs:
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth is not durability
            body: >-
              The disclosed base mixes users, enterprises, contracts, projects, and PoCs. Underwrite retention only
              after reviewing cohort-level renewals, expansion, usage, and revenue.
            calloutType: risk
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU014
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Evidence, model, and translational risk
        blocks:
          - type: paragraph
            body: >-
              BioMap presents xTrimo and BioMap OS as a broad foundation-model and dry-wet discovery stack, but most
              available performance and adoption measures are self-reported or disclosed in partner-led releases. The
              official site states that xTrimo V4 has 268 billion parameters and 300+ state-of-the-art performances
              across more than 20 fields, while also saying the system has been validated in more than 80
              proof-of-concept programs. Those figures describe capability and validation claims, not independently
              audited clinical success, reproducibility, or realized customer economics. Partner material describes a
              planned integrated laboratory and projected efficiency gains, but those are forward-looking and do not
              establish delivery. External benchmark evidence is relevant to the field: PFMBench evaluates protein
              foundation models across 38 tasks and 17 models, indicating that broad model claims require task-level
              comparison rather than a single headline score. A similarly named BioMAP presentation concerns a different
              company and product, creating an entity-resolution risk for diligence unless every source is checked
              against BioMap's identity.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR005
              - CR008
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR009
              - CR011
              - CR013
      - number: '7.2'
        title: Regulatory, legal, and operational exposure
        blocks:
          - type: paragraph
            body: >-
              No assigned source documents a BioMap enforcement action, lawsuit, security breach, or outage, so the
              absence of a recorded incident should not be treated as evidence that those risks are absent. BioMap's
              product is used in life-science discovery workflows where data provenance, model validation, privacy,
              intellectual-property rights, and laboratory execution can affect downstream development decisions. The
              Sanofi announcement says BioMap's work combines its models with Sanofi proprietary data and targets
              pre-clinical, clinical, regulatory, and commercial milestones; this creates a dependency on partner data
              rights, validation, and milestone execution. The Harbour BioMed release describes a complex-biologics
              laboratory intended to generate more than five petabytes of data within five years and claims projected
              efficiency gains of more than 500%; these are ambitious operating dependencies and projections, not
              evidence of completed performance. The practical risk posture is therefore a diligence gap: obtain
              incident, security, quality-system, validation, IP, and regulatory records before relying on the platform
              in regulated development.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR007
      - number: '7.3'
        title: Partner, financial, and transaction risk
        blocks:
          - type: paragraph
            body: >-
              BioMap's disclosed commercial path is partnership-led, which can provide validation but also concentrates
              execution, data access, and economics in counterparties. The Sanofi release discloses a $10 million
              upfront payment and potential payments above $1 billion tied to development, regulatory, and commercial
              milestones; the contingent amount is not cash available today and does not establish recognized revenue.
              The Harbour BioMed release similarly refers to potential upfront payments, success-based milestones, and
              royalty sharing, while the IPO reporting says the confidential filing and proposed raise were reported
              rather than confirmed by a public prospectus. Sohu contributor 新识研究所 reports cumulative funding above $200
              million, but funding raised is not evidence of cash currently available. BioMap's official site describes
              more than 800 institutional users, more than 30 leading enterprises, and more than 80 PoCs, but does not
              disclose retention, concentration, revenue conversion, or contract terms. These gaps leave financial-model
              risk around cash generation, customer concentration, milestone timing, dilution, and preference rights.
              Until audited financials, customer cohorts, contract terms, and cap-table information are available, the
              appropriate controls are measurable diligence triggers rather than a precise solvency conclusion.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR015
      - number: '7.4'
        title: Monitoring plan and thesis-break criteria
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a monitoring plan centered on independent validation and operating delivery. First,
              require task-level external benchmark results and reproducibility for material model releases, not only
              aggregate state-of-the-art counts. Second, track production deployments, PoC-to-paid conversion, renewal
              and concentration metrics, and the proportion of economics coming from milestones versus recurring
              software or services. Third, monitor laboratory uptime, data-quality exceptions, security incidents, IP
              disputes, and regulatory or clinical setbacks across partner programs. A thesis break would be triggered
              by a material model-validation failure, an unremedied security or data-rights incident, repeated
              laboratory or delivery failures, loss or renegotiation of a strategic partner, or financing terms that
              materially increase dilution without corresponding commercial proof. The assigned evidence does not
              quantify thresholds for these events, so the next diligence step is to obtain the underlying operating
              dashboard and legal, quality, and financing records.
            claimRefs:
              - CR013
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary thesis break
            body: >-
              The thesis breaks if BioMap cannot independently reproduce material model performance or convert partner
              and PoC activity into durable, measurable commercial outcomes while maintaining data, security, and
              laboratory controls.
            calloutType: risk
            claimRefs:
              - CR003
              - CR010
              - CR013
          - type: callout
            title: Evidence limitation
            body: >-
              Assigned sources do not provide audited financials, customer retention, incident history, security
              attestations, or complete collaboration and capitalization terms; those are diligence gaps, not negative
              findings.
            calloutType: assumption
            claimRefs:
              - CR008
              - CR011
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive thesis is that BioMap is not only a model demonstration: its current site describes BioMap OS
              as a licensable or service-delivered dry-wet discovery system, while public partnership disclosures show
              enterprise validation with Sanofi and Harbour BioMed. Sanofi's disclosed $10 million upfront and potential
              milestone value above $1 billion demonstrate that a major pharmaceutical buyer has assigned economic
              importance to the collaboration, although the contingent value is not realized revenue. The anti-thesis is
              that the public record still does not provide audited revenue, gross margin, recurring versus milestone
              mix, customer concentration, current valuation, or the rights and dilution terms behind a prospective IPO.
              Product scale and partner headlines therefore support strategic relevance, not a price-independent buy
              decision.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV006
              - CV009
              - CV012
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV008
              - CV010
              - CV011
              - CV013
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Financing evidence is directional rather than a mark-to-market valuation. Tracxn labels BioMap a Series A
              company and says its funding amount is undisclosed, whereas a March 2026 Sohu article reports two rounds
              and more than $200 million raised. That discrepancy makes neither figure a current post-money valuation.
              Yicai reports that BioMap confidentially applied for a Hong Kong IPO and aimed to raise several hundred
              million US dollars, while explicitly attributing the plan to media reports and noting Baidu declined
              comment. The IPO indication can improve financing optionality but does not establish offer price,
              dilution, float, preference conversion, or proceeds available to existing investors. Entry discipline
              should therefore be based on a verified cap table and a price-linked revenue or milestone framework, not
              on the largest disclosed partnership headline.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV012
              - CV014
              - CV015
      - number: '8.3'
        title: Scenarios, exit readiness, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              A bull case is plausible if BioMap converts institutional adoption and strategic collaborations into
              repeatable paid licenses, validates product performance in clinical or preclinical workflows, and reaches
              a transparent IPO or strategic liquidity event. The base case is a valuable but opaque platform whose
              partnership economics arrive over time and whose services, licenses, and milestones are difficult to
              separate. The bear case is that contingent milestones do not convert, model performance does not translate
              into durable customer budgets, or an IPO proceeds without terms that protect existing holders. Because the
              evidence does not support a point valuation, the scenario table uses valuation as an unresolved diligence
              variable rather than inventing a multiple or return. A decision should move from track to buy only after
              current price, fully diluted ownership, preference stack, revenue quality, renewal data, and downside
              protections are verified.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV008
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Price discipline is the decision gate
            body: >-
              Public evidence supports strategic relevance but not a current price or return calculation. Retain a
              track/research-more stance until a current valuation, fully diluted cap table, revenue quality, and
              preference terms are verified.
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV009
              - CV015
          - type: callout
            title: Contingent value is not realized cash
            body: >-
              Sanofi's potential deal value above $1 billion is tied to development, regulatory, and commercial
              milestones; it should not be treated as booked revenue, cash available, or a valuation mark.
            calloutType: risk
            claimRefs:
              - CV002
              - CV003
