chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, platform, and operating model
        blocks:
          - type: paragraph
            body: >-
              BioMap was founded in 2020 by Robin Li and Wei Liu, with the company describing itself as a life-science
              AI foundation-model company. Its current product architecture is centered on xTrimo, a protein- and
              biology-focused foundation-model family, and BioMap OS, which combines knowledge aggregation, predictive
              design, experimental control, and model training. The company positions the system as deployable as
              models, software, or a complete system, including cloud and on-premises deployment. This supports an
              enterprise platform-plus-discovery-services model rather than a single drug-asset thesis. The evidence is
              primarily company-issued or company-republished, so technical and adoption metrics should be treated as
              company claims pending customer-level validation.
