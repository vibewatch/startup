  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              BioMap presents BioMap OS as a foundation-model-driven discovery system rather than a single prediction
              tool. Its current official surface combines knowledge aggregation, predictive design, experimental
              control, and model training within a dry-wet feedback loop. Delivery can take the form of models,
              software, or a complete system, with cloud, on-premises, licensing, and system-based discovery-service
              options. The product therefore spans both software and scientific service workflows, which broadens
              adoption paths but makes module availability, implementation responsibility, and data governance central
              to diligence. The official site reports more than 80 proof-of-concept programs, while the repeatedly cited
              figure of more than 800 institutional users remains a company-originated metric rather than independent
              evidence of active production use. Sanofi, Harbour BioMed, and XBiome disclosures demonstrate that the
              platform can be adapted to biologics and microbiome workflows, but each implementation depends on partner
              data, assays, or domain expertise and should not be read as proof of a standardized deployment.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE009
              - CE010
              - CE011
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE002
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.2'
        title: Architecture, technical proof, and maturity
        blocks:
          - type: paragraph
            body: >-
              BioMap's public architecture has four reinforcing pillars: multimodal biological data, expert-driven
              multimodal algorithms, high-throughput closed-loop experimentation, and a bio-computing engine with global
              multi-cloud deployment. The commercial product layer is meant to connect those pillars through data
              insight, parameter optimization, de novo design, experimental control, and model training. Public research
              provides narrower technical proof. The xTrimoPGLM preprint reports a unified 100-billion-parameter protein
              model trained on one trillion tokens and evaluated across understanding and generation tasks. A later
              BioMap-linked bioRxiv preprint reports ProteinReasoner performance in structure prediction, inverse
              folding, fitness prediction, and optimization. These artifacts show model-development activity, but they
              do not independently validate the broader 268-billion-parameter xTrimo V4 product claims or customer-level
              performance. Harbour BioMed's planned Design-Build-Test-Learn laboratory and XBiome's proposed workflow
              integration provide architecture-specific examples, while remaining partner-issued descriptions rather
              than audited operating results.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE011
              - CE014
          - type: table
