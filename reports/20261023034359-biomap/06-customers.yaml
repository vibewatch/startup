company:
  name: BioMap
chapter:
  number: 6
  title: Customers
  summary: >-
    BioMap discloses a broad institutional footprint and an expanding set of proof-of-concept
    programs, while named collaborations with Sanofi, Harbour BioMed, XBiome, and HKIC show
    several routes from technical evaluation to co-development. The evidence does not disclose
    renewals, churn, customer concentration, or realized revenue by relationship, so adoption
    breadth should not be read as demonstrated commercial durability.
sections:
  - id: customer-base
    title: Customer base and buying contexts
    body: >-
      BioMap presents a multi-segment customer base rather than a single repeatable buyer cohort.
      Its current site says the platform has supported more than 800 institutional users and more
      than 30 leading enterprises, across antibody and protein work, innovative therapies,
      synthetic biology, and scientific research. The same site says BioMap OS can be consumed as
      models, software, or a complete system, through cloud or on-premises deployment, licensing,
      or discovery services. That flexibility broadens the addressable buyer set, but it also
      mixes users, enterprises, proof-of-concept programs, and commercial counterparties. The
      resulting counts are useful evidence of reach, not a clean count of paying or retained
      customers. HKIC's accelerator commitment and the XBiome relationship add ecosystem and
      vertical-solution channels beyond direct enterprise software sales.
    claimRefs: [CU001, CU002, CU009, CU010, CU013]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption trajectory and proof quality
    body: >-
      Public disclosures show a rising sequence, but the metric changes at each observation.
      HKIC reported more than 200 AIGP-platform contracts in June 2024; an April 2025 launch
      account quoted BioMap at more than 500 institutional clients; Yicai reported in March 2026
      that BioMap said it had served more than 800 institutions and validated BioMap OS in more
      than 60 projects; and BioMap's September 2026 site states more than 800 institutional users
      and more than 80 proof-of-concept programs. These are not a comparable cohort series:
      contracts, clients, users, and PoCs have different denominators, and none discloses active
      usage or conversion. The strongest interpretation is widening engagement and a larger
      disclosed validation base, not a measured retention curve or verified customer growth rate.
    claimRefs: [CU001, CU003, CU004, CU005, CU006, CU014]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-customer-proof
    title: Named deployments and expansion mechanisms
    body: >-
      Named counterparties provide stronger proof than aggregate user counts, but their maturity
      varies. Sanofi's 2023 agreement included a $10 million upfront payment and more than
      $1 billion of potential value tied to development, regulatory, and commercial milestones;
      the latter is contingent deal value, not realized revenue. Harbour BioMed says its
      collaboration with BioMap began in 2021 and covered more than ten pipeline programs before
      the parties announced MegaStream, where the economics may include upfront payments,
      milestones, and royalties. XBiome announced platform, model, application, and market
      cooperation, while HKIC's BioX commitment is an ecosystem program rather than evidence of
      recurring software revenue. The relationship set supports production-oriented engagement,
      but only Sanofi discloses an upfront payment.
    claimRefs: [CU007, CU008, CU009, CU010, CU011, CU012]
    tableRefs: [TU003]
  - id: durability-and-concentration
    title: Durability, retention, and concentration remain unproven
    body: >-
      None of the assigned public evidence provides NRR, GRR, churn, renewal rates, contract
      duration, active-seat utilization, or revenue concentration by customer. A confidential
      Hong Kong filing also leaves the prospectus unavailable before the listing-hearing stage,
      according to Sohu, limiting public reconciliation of customer counts to revenue and
      concentration. The evidence therefore supports an adoption thesis with substantial
      diligence conditions: request customer-level revenue cohorts, conversion from PoC to paid
      production, renewal and expansion histories, implementation timelines, and top-customer
      exposure. Sohu's conclusion that BioMap's ability to convert its technical position into a
      durable competitive position still requires market testing is an appropriate adverse
      counterweight to partner and company announcements.
    claimRefs: [CU015, CU016]
