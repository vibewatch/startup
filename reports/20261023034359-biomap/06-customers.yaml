    title: Customer evidence and expansion journey
    type: journey-map
    summary: >-
      Public evidence supports multiple routes from discovery interest to broader strategic
      relationships, while conversion and retention between stages remain undisclosed.
    data:
      nodes:
        - label: Institutional discovery
          detail: "Users enter through scientific research, protein design, and vertical life-science workflows."
          touchpoints: [Models, Software, Discovery services]
        - label: Proof of concept
          detail: "BioMap reports more than 80 PoC programs, but does not publish conversion rates."
          touchpoints: [Target discovery, Antibody discovery, Drug development]
        - label: Enterprise deployment
          detail: "BioMap OS is offered through cloud, on-premises, licensing, or complete-system delivery."
          touchpoints: [Cloud, On-premises, System license]
        - label: Co-development
          detail: "Named relationships combine BioMap models with counterparty data and domain expertise."
          touchpoints: [Sanofi, XBiome, Harbour BioMed]
        - label: Program expansion
          detail: "Some agreements extend into joint models, laboratories, pipelines, or market channels."
          touchpoints: [MegaStream, BioX, Joint market expansion]
        - label: Economic realization
          detail: "Upfront, milestone, and royalty structures are disclosed selectively; renewals and concentration are not."
          touchpoints: [Upfront payment, Milestones, Royalties]
    approximationNotes: "Conceptual evidence journey; node order does not represent a measured funnel, conversion rate, or universal customer path."
    claimRefs: [CU003, CU007, CU008, CU010, CU012, CU013]
callouts:
  - calloutType: risk
    title: Breadth is not durability
    body: >-
      The disclosed base mixes users, enterprises, contracts, projects, and PoCs. Underwrite
      retention only after reviewing cohort-level renewals, expansion, usage, and revenue.
    claimRefs: [CU001, CU002, CU003, CU004, CU014, CU015]
