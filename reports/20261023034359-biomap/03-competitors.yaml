callouts:
  - calloutType: strength
    title: Broad platform proposition
    body: BioMap combines a foundation model, configurable discovery software, and a dry-wet feedback loop in one commercial proposition, which can reduce the buyer's need to assemble multiple specialist vendors.
    claimRefs: [CP006, CP011]
  - calloutType: risk
    title: Differentiation is not independently benchmarked
    body: Competitors describe similarly integrated data-model-lab systems, while the assigned evidence contains no common benchmark, retention metric, price card, or independently verified superiority result.
    claimRefs: [CP007, CP008, CP014, CP015]
  - calloutType: recommendation
    title: Underwrite contracts and transferability
    body: The next diligence step should test realized pricing, renewal and churn, data ownership and export rights, implementation burden, and program-level outcomes against at least two named alternatives.
    claimRefs: [CP009, CP010, CP011, CP015]
