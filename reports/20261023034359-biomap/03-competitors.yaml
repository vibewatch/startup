      - [MegaStream partnership, "Potential upfront, success-based milestones, and royalties; no equity split", "Foundation model, Harbour Mice data, dry-wet lab, pipeline development", "Terms, ownership, and operational launch status not fully disclosed", "Partner access can create distribution and data advantages but also dependency"]
      - [Owkin, "No public price in assigned source", "K Pro, patient data, agents, wet-lab validation", "Contract terms and switching cost unknown", "Competes for platform and pharma workflow budgets"]
      - [Valo, "No public price in assigned source", "Causal biology and closed-loop chemistry", "Contract terms and switching cost unknown", "Competes for target and molecule discovery budgets"]
      - [insitro, "No public price in assigned source", "Virtual Human, TherML, cellular and genetic data", "Contract terms and switching cost unknown", "Competes where biological causality and modality choice matter"]
      - [Recursion, "No comparable product price; public market cap is not product pricing", "Product capabilities not established by the assigned source", "Revenue, contract, and product mix not established by assigned evidence", "Public-market scale is not evidence of lower buyer cost or product superiority"]
    notes: "Payments and potential deal values are not ARR, recognized revenue, or cash available; competitor price and renewal data were not disclosed in the assigned sources."
    claimRefs: [CP009, CP010, CP011, CP012, CP013, CP015]
