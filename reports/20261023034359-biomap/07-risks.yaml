callouts:
  - calloutType: risk
    title: Primary thesis break
    body: The thesis breaks if BioMap cannot independently reproduce material model performance or convert partner and PoC activity into durable, measurable commercial outcomes while maintaining data, security, and laboratory controls.
    claimRefs: [CR003, CR010, CR013]
  - calloutType: assumption
    title: Evidence limitation
    body: Assigned sources do not provide audited financials, customer retention, incident history, security attestations, or complete collaboration and capitalization terms; those are diligence gaps, not negative findings.
    claimRefs: [CR008, CR011, CR014]
