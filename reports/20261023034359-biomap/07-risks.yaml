  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: disclosure-gaps
      missingEvidence: Audited financial statements, cash balance, revenue mix, customer retention, concentration, and complete cap-table or preference terms.
      whyItMatters: These inputs determine whether partnership and user-count claims translate into durable cash generation and how much dilution or liquidity risk an investor bears.
      diligencePath: Request audited statements, a customer cohort and concentration schedule, material contracts, capitalization table, and financing documents under NDA.
      relatedQuestionRefs: [QR007, QR008, QR009]
      relatedTableRefs: [TR001]
    - type: access-blocked
      severity: material
      topic: legal-and-security
      missingEvidence: Security attestations, incident history, privacy and data-rights documentation, IP ownership terms, and regulatory-quality validation records.
      whyItMatters: BioMap's platform is positioned for life-science workflows where data provenance and validation failures can affect regulated development decisions.
      diligencePath: Obtain SOC or equivalent control reports, incident register, data-processing terms, IP schedules, validation protocols, and partner quality agreements.
      relatedQuestionRefs: [QR002, QR004, QR005]
    - type: missing-source
      severity: material
      topic: benchmark
      missingEvidence: Independent, task-level reproducibility results for xTrimo and BioMap OS across representative customer or therapeutic workflows.
      whyItMatters: Aggregate state-of-the-art and proof-of-concept counts do not establish generalization, production reliability, or clinical translation.
      diligencePath: Request benchmark datasets, held-out results, error bars, failed-case analysis, and production performance logs.
      relatedQuestionRefs: [QR001, QR003]
