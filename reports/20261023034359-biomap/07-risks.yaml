    claimRefs: [CR002, CR003, CR006, CR007]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty, Role, Concentration or dependency, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - [Proprietary biological data and antibody platform, Harbour BioMed, "Data and experimental capability for MegaStream", material to planned complex-biologics programs, "Data access or collaboration failure delays pipeline", high, Joint platform and DBTL design, high]
      - [Proprietary pharma data and milestone development, Sanofi, "Co-development of AI modules and biotherapeutics", economics depend on milestone achievement, "Milestone or validation failure reduces contingent economics", high, Contracted development milestones and partner expertise, medium-to-high]
      - [Customer and enterprise adoption, Institutional users and leading enterprises, "Licensed, system, or discovery-service demand", concentration and conversion not disclosed, "PoC activity fails to convert or renew", high, Multiple verticals and deployment modes, high]
      - [Capital-market access and financing terms, Prospective Hong Kong IPO and investors, "Funding and liquidity pathway", confidential filing and raise were reported rather than prospectus-confirmed, "Delay or down-round increases dilution and runway risk", high, Maintain financing alternatives and obtain cap-table evidence, high]
    notes: "Counterparty roles are stated in assigned releases or reporting; concentration, contract duration, renewal, cash balance, and preference terms remain undisclosed."
    claimRefs: [CR009, CR010, CR011, CR012, CR015]
