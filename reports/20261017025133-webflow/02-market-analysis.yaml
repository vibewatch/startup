figures:
  - id: "FM001"
    title: "Demand stack for Webflow's addressable workflow"
    type: "pyramid"
    summary: "The addressable workflow narrows from a broad low-code tailwind to specific marketing-owned web operations where Webflow's integrated CMS, collaboration, and optimization features matter most."
    data:
      items:
        - label: "Broad low-code / no-code tailwind"
          displayValue: "$44.5B adjacent market in 2026"
          note: "7Span cites Gartner for the broader low-code/no-code market and 70% of new enterprise apps on such tools."
          tone: "neutral"
        - label: "Digital-budget pressure on website efficiency"
          displayValue: "61.1% of marketing spend is digital; budgets ~7.7% of revenue"
          note: "Underscore cites Gartner to show why teams need higher output from the web channel."
          tone: "neutral"
        - label: "Website as a revenue surface"
          displayValue: "91% of marketing leaders say the website drives more revenue than any other channel"
          note: "Underscore attributes this to Webflow's 2025 State of the Website research."
          tone: "opportunity"
        - label: "Core use case Webflow repeatedly serves"
          displayValue: "Marketing and content sites managed without constant developer involvement"
          note: "Third-party reviews repeatedly center landing pages, blogs, resource hubs, and B2B brand sites."
          tone: "opportunity"
        - label: "Self-serve and mid-market commercial entry"
          displayValue: "$23/month CMS plan, plus separate workspace economics"
          note: "Public pricing shows an accessible content-site entry point but layered billing."
          tone: "warning"
        - label: "Enterprise operating layer"
          displayValue: "Custom pricing; permissions, staging, localization, analytics, and optimization"
          note: "Enterprise value is workflow control and governance, but public contract data are sparse."
          tone: "opportunity"
    approximationNotes: >-
      This is a narrowing demand stack, not a conversion funnel or an arithmetic TAM-to-SOM
      cascade. The layers mix adjacent market size, budget mix, survey evidence, use-case fit, and
      pricing structure because the public record does not expose a clean Webflow-specific SAM.
    claimRefs: ["CM003", "CM005", "CM007", "CM011", "CM013", "CM015"]
