        - Unknown
        - High
        - Treat the gap as unresolved until management supplies current disclosure
        - Unknown residual risk until diligence closes the source gap
        - Request 24-month litigation, enforcement, DPA, SLA, and incident history from management and counsel
    notes: >-
      Ordered by severity; rows mix sourced risks and one explicit evidence gap because the assigned
