  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty / ecosystem
      - Role
      - Concentration
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Agency and integration ecosystem
        - Webflow agencies, compliance vendors, and third-party auth / automation tools
        - Build, migration, privacy tooling, user accounts, and automation extensions
        - Medium to high for enterprise and regulated deployments
        - The stack works only with external retainers, plugins, or replacement vendors that add cost and execution risk
        - High
        - Pre-approve architecture, ownership, and renewal economics for every non-native dependency
        - Residual lock-in remains because multiple adjacent vendors are needed to replace removed or absent native features
      - - Parallel enterprise stack
        - AEM or another data-heavy digital experience platform
        - Retains complex product or multi-channel workflows while Webflow runs marketing surfaces
        - Medium
        - The company ends up paying for two platforms and their integration boundaries instead of one unified system
        - Medium
        - Constrain Webflow to high-velocity marketing experiences and keep product-grade complexity elsewhere
        - Residual architecture sprawl remains if leadership expects Webflow to converge the full stack later
      - - Marketing-operations discipline
        - Internal marketing, design, and web operations team
        - Determines whether faster publishing translates into outcomes rather than noisy iteration
        - High
        - The organization gains publishing speed without the operating discipline needed to realize conversion or SEO gains
        - Medium
        - Set explicit governance, testing cadence, KPI ownership, and page-level review routines
        - Residual people risk remains because the platform cannot manufacture strategic discipline on its own
    notes: >-
      This register isolates execution and ecosystem dependence rather than repeating the raw plan
      limits already captured in the operational register.
    claimRefs: [CR006, CR007, CR010, CR011, CR012, CR013]
figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Qualitative comparison of the six highest-salience residual risks in the assigned evidence.
    data:
      columns:
        - label: Likelihood
        - label: Impact
        - label: Mitigation maturity
        - label: Residual severity
      rows:
        - label: Feature continuity
          values:
            - value: Medium
              detail: Two native capabilities were sunset during 2025-2026.
            - value: High
              detail: Customers may need to rebuild automation or gated experiences.
            - value: Low
              detail: Replacement tools exist but add vendors and operating complexity.
            - value: High
              detail: Further product changes could force migration or re-architecture.
        - label: Hosted-platform concentration
          values:
            - value: Medium
              detail: Core publishing and collaboration run in Webflow's hosted application.
            - value: High
              detail: Disruption or commercial change affects the public web estate.
            - value: Medium
              detail: Backups, staging, exports, and APIs provide partial safeguards.
            - value: High
              detail: Complete portability still requires tested recovery and migration plans.
        - label: Regulated workflow boundary
          values:
            - value: Medium
              detail: Risk rises when public marketing flows collect sensitive information.
            - value: High
              detail: Privacy, security, accessibility, or sector failures can create legal exposure.
            - value: Medium
              detail: Specialist systems and explicit handoffs reduce but do not remove boundary risk.
            - value: High
              detail: No primary regulator or legal evidence is available in the assigned pool.
        - label: Plan and cost expansion
          values:
            - value: High
              detail: Seats, add-ons, bandwidth, agencies, and adjacent tools compound with usage.
            - value: Medium
              detail: Cost growth can compress the expected benefit of marketing autonomy.
            - value: Medium
              detail: Forecasting and contract review can make the exposure visible.
            - value: Medium
              detail: Company-specific usage and fully loaded spend remain private.
        - label: Operator skill concentration
          values:
            - value: High
              detail: Multiple sources describe meaningful learning and execution requirements.
            - value: Medium
              detail: Weak handoff or governance can slow publishing and reduce quality.
            - value: Medium
              detail: Training, permissions, and process controls are available.
            - value: Medium
              detail: Platform controls cannot substitute for experienced operators.
        - label: Third-party integration stack
          values:
            - value: Medium
              detail: External apps, APIs, webhooks, and replacement tools are normal at higher scope.
            - value: Medium
              detail: More vendors create renewal, ownership, and failure-point exposure.
            - value: Medium
              detail: Architecture ownership and vendor inventories can constrain the surface.
            - value: Medium
              detail: Residual integration and counterparty dependence remains.
    approximationNotes: >-
      Likelihood, impact, maturity, and residual severity are qualitative evidence syntheses, not
      measured probabilities; no numeric incident frequency was available in the assigned pool.
    claimRefs: [CR003, CR004, CR006, CR007, CR008, CR011, CR012, CR015]
callouts:
  - calloutType: risk
    title: Highest-conviction kill criterion
    body: >-
      Walk away or reset scope if management expects Webflow to natively own regulated transactions,
      authenticated product experiences, or heavy server-side logic without a documented adjacent
      stack. The assigned evidence repeatedly places those workflows outside Webflow's comfortable
      operating boundary.
    claimRefs: [CR006, CR008, CR010, CR014]
  - calloutType: recommendation
    title: Diligence asks that matter more than another feature demo
    body: >-
      Ask for current Webflow tier, bandwidth usage, add-on spend, third-party auth and automation
      map, agency-retainer commitments, incident history, and the exact boundary between Webflow and
      any regulated or product-grade systems. Those answers determine whether Webflow is a force
      multiplier or a governance liability.
    claimRefs: [CR002, CR004, CR005, CR007, CR015]
