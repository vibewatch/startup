        - More vendors, subscriptions, and failure points accumulate around gated experiences and automation
        - Management has not provided the current replacement stack or spend
      - - Performance and web-vitals quality can degrade on complex pages
        - RapidDev describes a JS-runtime tax and 60-75 Lighthouse outcomes on complex pages even as hosting remains managed
        - Medium
        - Medium
        - Medium
        - Teams can buy managed hosting yet still lose conversion or SEO efficiency on animation-heavy or CMS-heavy builds
