      - number: '2.2'
        title: 'Sizing lenses: macro demand is real, but precise Webflow TAM remains unproven'
        blocks:
          - type: paragraph
            body: >-
              Public sizing evidence is strongest at adjacent-market and budget-pressure lenses, not at a direct Webflow
              TAM. One external synthesis cites Gartner putting low-code/no-code at roughly $44.5 billion in 2026 with
              70% of new enterprise apps using such tools, while another cites Gartner's 2025 CMO Spend Survey showing
              digital channels at 61.1% of marketing spend even as total budgets sit near 7.7% of revenue. Those data
              points support the demand backdrop for tools that compress web production cycles, and Forrester-derived
              benchmarks cited by ecosystem partners reinforce that buyers value faster launch cadence and lower change
              costs. What they do not provide is a defendable SAM/SOM for Webflow itself, because the public record
              still mixes adjacent category sizing, operator budget signals, and directional vendor adoption proxies.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM010
              - CM015
