        title: Public traction proxies exist, but unit economics remain mostly private
        blocks:
          - type: paragraph
            body: >-
              Public traction signals point to a meaningful software business, but the usable numbers are mostly
              third-party estimates rather than audited disclosures. WhoEarns estimates roughly $200 million of ARR and
              says more than 3.5 million websites have been built on Webflow, while Growth Navigate says the company was
              nearing $100 million ARR around the 2022 Series C and that enterprise revenue had expanded from roughly $1
              million to $8 million. Those datapoints suggest a real enterprise upsell path, yet the record still lacks
              the underwriting basics: recognized revenue, segment mix, gross margin, CAC, payback, churn, and net
              revenue retention are not publicly disclosed in the retained sources.
