  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Webflow's adoption pattern moves from design-led evaluation into structured publishing, governed review, and
      team-scale expansion.
    data:
      items:
        - label: Discovery and fit test
          actor: Founder, marketer, freelancer, or agency owner
          touchpoints:
            - Free or low-commitment evaluation
            - Compare design control against WordPress, Framer, Wix, or Squarespace
          note: Best fit starts where recurring publishing matters more than a single launch.
          tone: neutral
        - label: System and schema build
          actor: Designer and developer
          touchpoints:
            - Designer canvas
            - CMS schema and component setup
            - Custom code or integrations when needed
          note: The tool is not code-free for every advanced use case.
          tone: medium
        - label: Structured content handoff
          actor: Marketer or content editor
          touchpoints:
            - Collections for blog, case studies, team content, or resources
            - Role-limited editing instead of layout access
          note: This is the strongest adoption surface for non-developer day-to-day use.
          tone: positive
        - label: Collaborative review and approval
          actor: Reviewer, admin, or enterprise stakeholder
          touchpoints:
            - Comments
            - Read-only share links
            - Staging and item-level publishing
          note: Governance features make larger-team use more plausible than logo-only evidence would suggest.
          tone: medium
        - label: Publish, measure, and optimize
          actor: Marketing ops or web owner
          touchpoints:
            - Analyze and Optimize
            - Publish logs
            - Reuse structured content across pages
          note: Official surfaces emphasize ongoing operation, not just initial launch.
          tone: positive
        - label: Expansion or procurement friction
          actor: Team buyer, finance, or procurement
          touchpoints:
            - Premium, Team, or Enterprise packaging
            - Pricing changes
            - Item or feature thresholds
          note: Expansion is visible in packaging, but pricing complexity can slow broader rollout.
          tone: risk
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU007
      - CU010
      - CU011
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: Qualitative comparison of the six highest-salience residual risks in the assigned evidence.
    data:
      columns:
        - label: Likelihood
        - label: Impact
        - label: Mitigation maturity
        - label: Residual severity
      rows:
        - label: Feature continuity
          values:
            - value: Medium
              detail: Two native capabilities were sunset during 2025-2026.
            - value: High
              detail: Customers may need to rebuild automation or gated experiences.
            - value: Low
              detail: Replacement tools exist but add vendors and operating complexity.
            - value: High
              detail: Further product changes could force migration or re-architecture.
        - label: Hosted-platform concentration
          values:
            - value: Medium
              detail: Core publishing and collaboration run in Webflow's hosted application.
            - value: High
              detail: Disruption or commercial change affects the public web estate.
            - value: Medium
              detail: Backups, staging, exports, and APIs provide partial safeguards.
            - value: High
              detail: Complete portability still requires tested recovery and migration plans.
        - label: Regulated workflow boundary
          values:
            - value: Medium
              detail: Risk rises when public marketing flows collect sensitive information.
            - value: High
              detail: Privacy, security, accessibility, or sector failures can create legal exposure.
            - value: Medium
              detail: Specialist systems and explicit handoffs reduce but do not remove boundary risk.
            - value: High
              detail: No primary regulator or legal evidence is available in the assigned pool.
        - label: Plan and cost expansion
          values:
            - value: High
              detail: Seats, add-ons, bandwidth, agencies, and adjacent tools compound with usage.
            - value: Medium
              detail: Cost growth can compress the expected benefit of marketing autonomy.
            - value: Medium
              detail: Forecasting and contract review can make the exposure visible.
            - value: Medium
              detail: Company-specific usage and fully loaded spend remain private.
        - label: Operator skill concentration
          values:
            - value: High
              detail: Multiple sources describe meaningful learning and execution requirements.
            - value: Medium
              detail: Weak handoff or governance can slow publishing and reduce quality.
            - value: Medium
              detail: Training, permissions, and process controls are available.
            - value: Medium
              detail: Platform controls cannot substitute for experienced operators.
        - label: Third-party integration stack
          values:
            - value: Medium
              detail: External apps, APIs, webhooks, and replacement tools are normal at higher scope.
            - value: Medium
              detail: More vendors create renewal, ownership, and failure-point exposure.
            - value: Medium
              detail: Architecture ownership and vendor inventories can constrain the surface.
            - value: Medium
              detail: Residual integration and counterparty dependence remains.
    approximationNotes: >-
      Likelihood, impact, maturity, and residual severity are qualitative evidence syntheses, not measured
      probabilities; no numeric incident frequency was available in the assigned pool.
    claimRefs:
      - CR003
      - CR004
      - CR006
      - CR007
      - CR008
      - CR011
      - CR012
      - CR015
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Product proof and scale signals remain real, but valuation opacity and incomplete financial disclosure stop the
      evidence chain at research-more.
    data:
      nodes:
        - id: product-proof
          label: Product proof
          note: Official documentation shows CMS analytics optimization permissions staging and AI-assisted workflows.
        - id: scale-signals
          label: Scale signals
          note: Secondary sources still point to large customer website and partner reach.
        - id: monetization-proof
          label: Monetization proof
          note: Only an estimated ARR anchor is public in the assigned pool.
        - id: price-context
          label: Price context
          note: Public valuation and funding anchors conflict across secondary sources.
        - id: downside-check
          label: Downside check
          note: Reviewer friction and multiple-compression risk remain live.
        - id: recommendation
          label: Research-more
          note: Wait for current financing and financial proof before underwriting an entry.
      edges:
        - from: product-proof
          to: scale-signals
          label: supports
        - from: scale-signals
          to: monetization-proof
          label: still needs clean conversion proof
        - from: monetization-proof
          to: price-context
          label: cannot resolve price alone
        - from: price-context
          to: downside-check
          label: raises entry risk
        - from: downside-check
          to: recommendation
          label: leads to
    approximationNotes: >-
      This is a reasoning chain rather than a quantitative conversion model because the assigned pool lacks primary
      valuation and current financial disclosures.
    claimRefs:
      - CV001
      - CV003
      - CV006
      - CV007
      - CV011
      - CV012
      - CV013
