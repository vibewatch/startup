              - CP007
              - CP008
              - CP014
              - CP015
      - number: '3.3'
        title: Pricing and packaging crossover
        blocks:
          - type: paragraph
            body: >
              Omid's worked baseline makes the pricing battle more nuanced than simple headline plans. For a one-owner
              site with two collections and up to 50 GB of bandwidth, Framer Basic at $10 per month undercuts Webflow
              Premium at $25. Add a third collection and the comparison flips because Framer moves to Pro at $30 while
              Webflow remains $25; push that same workload to 100 GB and the economics flip back because Webflow needs a
              bandwidth add-on, reaching $45 versus Framer's $30. ToolNerdy's public list pricing points in the same
              direction: Webflow Basic is only the low-cost option when the buyer can live without CMS, while Premium
              becomes the default list-price tier once structured content is part of the job.
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
      - number: '3.4'
        title: Durability and displacement risk
        blocks:
          - type: paragraph
            body: >
              That pattern makes Webflow durable in mid-market content operations, but vulnerable where the
              job-to-be-done is narrower or more specialized. Framer pressures the top of funnel for designer-owned
              sites and already leads Webflow in the recent Y Combinator homepage snapshot. WordPress remains a live
              alternative for buyers who prefer open-source control and can accept plugin and maintenance burden, while
              Shopify wins the commerce-heavy edge cases that care more about storefront depth than web-ops governance.
              The assigned evidence therefore argues against a universal moat: Webflow's defensibility is strongest
              where content structure, permissions, collaboration, and managed hosting are all purchased together, and
              weakest where buyers optimize mainly for visual speed, portability, or commerce specialization.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP012
              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Operational moat outweighs aesthetic moat
            body: >-
              The strongest evidence-backed moat is Webflow's ability to combine structured CMS capacity, role-based
              collaboration, training, and managed publishing in one workflow; none of the assigned alternatives matches
              that entire stack in the public evidence set.
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP006
              - CP008
          - type: callout
            title: Designer-first displacement is real
            body: >-
              Framer is not a hypothetical entrant in this pool: the comparison evidence says it is the better fit for
              frequent visual iteration, and the recent Y Combinator homepage snapshot shows it ahead of Webflow, so
              Webflow's direct-peer moat depends on buyers valuing operations more than pure speed.
            calloutType: risk
            claimRefs:
              - CP006
              - CP012
