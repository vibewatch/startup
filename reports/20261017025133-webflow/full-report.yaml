      - number: '1.3'
        title: Funding, scale, and public metric confidence
        blocks:
          - type: paragraph
            body: >-
              The most important overview takeaway is that Webflow's private-company scale is still visible only through
              inconsistent secondary databases. GetLatka reports $217.8 million raised and a $4 billion valuation tied
              to a 2021 Series B, while Taptwice reports $334.9 million raised and a March 2022 Series C at the same $4
              billion valuation. Revenue and headcount are similarly inconsistent across retained trackers: one estimate
              points to roughly $212.5 million of 2024 revenue, another to about $200 million of ARR, and another to
              only $96.5 million of annual revenue with roughly 1.1 thousand employees.


              Those conflicts do not mean the company is small or stagnant; they mean the public record is not strong
              enough to treat any single private-company database as ground truth. Official sources do support broad
              adoption and enterprise ambitions, including the homepage's claim of over 300 thousand teams and product
              materials that emphasize cross-functional collaboration, experimentation, and AI-enabled site operations.
              But current revenue quality, precise customer denominators, and the freshness of the $4 billion valuation
              anchor remain open diligence items rather than settled facts.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO015
      - number: '1.4'
        title: Milestones, constraints, and open asks
        blocks:
          - type: paragraph
            body: >-
              The milestone record is strongest on financing and product-platform development. Retained sources support
              a 2013 founding period, early seed backing, larger financings in 2019, 2021, and 2022, a 2023 CEO
              transition, 2024 acquisitions of Intellimize and GreenSock, and a 2025 go-to-market leadership hire.
              Official 2026 product materials then show Webflow leaning further into AI-assisted authoring, AEO/SEO
              tooling, and enterprise workflow controls.


              The main adverse evidence in this pool is executional rather than legal or regulatory. A retained
              independent review argues that Webflow still carries a real learning curve, meaningful pricing friction
              for multi-site users, ecommerce limitations versus Shopify, and some platform lock-in for customers who
              later want to migrate. That matters because current valuation and market-positioning narratives depend on
              whether Webflow can keep moving upmarket without eroding usability or increasing commercial friction
              faster than product breadth improves.
