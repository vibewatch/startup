  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and platform scope
        blocks:
          - type: paragraph
            body: >-
              Webflow's official positioning has expanded well beyond a simple no-code site builder. The homepage now
              frames the product as an "agentic web platform for modern businesses," while the help-center and
              university materials describe a hosted workflow that spans visual design, structured content,
              optimization, publishing, and governed collaboration. That combination is important for later chapters
              because it anchors Webflow as a workflow and web-operations platform, not only a template-driven SMB
              website tool.


              Basic corporate identity is less directly documented on official pages than product scope is. The retained
              third-party profiles consistently place Webflow in San Francisco and describe the company as founded by
              Vlad Magdalin, Sergie Magdalin, and Bryant Chou, but the pool does not include a current official
              corporate-about page that cleanly confirms founding date, headquarters, or legal entity details. The
              overview is therefore stronger on what the platform does than on formally disclosed corporate identity
              fields.
