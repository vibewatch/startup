      - number: '5.2'
        title: Architecture, deployment, and extension model
        blocks:
          - type: paragraph
            body: >-
              The platform’s operating model is managed rather than self-hosted. Official sources show staging and
              production publishing, page and CMS-item level publishing controls, apps, APIs, and developer docs layered
              around the core canvas and CMS. Independent hosting reviews describe the delivery layer as globally
              distributed managed hosting with autoscaling, SSL, backups, and low server-maintenance burden; those
              sources support the existence of a managed hosting tier, but they do not fully settle the underlying
              vendor stack or prove every compliance assertion on their own. Webflow Cloud appears to be the
              architectural bridge from classic marketing-site hosting toward dynamic application deployment, but the
              strongest public evidence here is still a mix of official product framing and external explainers rather
              than a deep official technical architecture package.
