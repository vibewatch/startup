  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer boundary
        blocks:
          - type: paragraph
            body: >
              The assigned evidence points to a segmented landscape rather than a single competitor set. Framer is the
              closest direct peer for designer-led sites: Omid Saffari's October 2026 comparison says to pick Webflow
              when content publishing is a recurring business operation and Framer when visual iteration is the main
              job. WordPress remains the incumbent/open status quo for content-heavy publishing, Shopify remains the
              more purpose-built substitute for complex commerce, and low-end builders still absorb very small
              non-technical sites. Webflow still matters as an incumbent platform — Forbes' September 2025 snapshot put
              it at 3.5 million total users and 300,000 paid customers — but the same pool also shows real displacement
              pressure, with Wikipedia citing Framer ahead of Webflow among 2024 and 2025 Y Combinator batch homepage
              choices.
            claimRefs:
