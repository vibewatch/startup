        title: Leadership, governance, and control
        blocks:
          - type: paragraph
            body: >-
              The retained pool is enough to identify the main operating leaders but not enough to fully map governance.
              Third-party sources place Linda Tong as CEO by 2023 and show Adrian Rosenkranz joining as Webflow's first
              chief revenue officer in February 2025, which suggests the company is still professionalizing go-to-market
              leadership as it scales enterprise adoption. Founder identity is also stable across sources even though
              the public evidence here is mostly secondary rather than official.


              Governance remains only partially visible. One tracker lists Laela Sturdy, Bryant Chou, and Sergie
              Magdalin as board members, but the pool does not include an official current board roster, a cap table,
              voting-control disclosure, or a clean investor-rights summary. For diligence purposes, that means
              stakeholder mapping can identify likely influence centers, yet ownership, board committee structure, and
              founder-vs-investor control still need direct company confirmation.
