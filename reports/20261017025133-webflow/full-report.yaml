          Independent sources still show meaningful scale signals including 250000+ paying customers, 40M+ websites,
          300000+ companies, and 2000+ partners.
        - >-
          A primary update that reconciles whether these scale signals map to current paying-customer quality,
          retention, and monetization.
      - - Anti-thesis
        - >-
          Public valuation support is internally inconsistent because the assigned secondary record mixes a $5.8B
          headline with a $4B 2022 anchor and conflicting funding totals.
        - >-
          A current financing document set or independently verified secondary mark that resolves valuation, total
          capital raised, and preference structure.
      - - Anti-thesis
        - >-
          Customer and reviewer evidence still includes onboarding or ease-of-use friction, which weakens a simple
          no-code premium multiple argument.
        - >-
          Evidence that enterprise adoption and retention are strong enough to offset complexity, or proof that friction
          is limited to non-core SMB buyers.
    notes: >-
      Thesis rows summarize product and scale support; anti-thesis rows summarize valuation opacity and adoption
      friction in the assigned sources.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV006
      - CV008
      - CV010
      - CV011
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Core assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          AI workflow expansion and enterprise web-ops positioning translate into stronger monetization than the public
          pool can currently prove.
        - >-
          A premium value above stale 2022 anchors is only supportable if a fresh round or secondary evidence package
          also verifies materially stronger current ARR growth margins and retention.
        - >-
          Investors could still overpay if AI narrative outruns enterprise economics or if preference terms are
          investor-unfriendly.
        - Needs primary evidence that clears the current public inconsistency around valuation and funding.
      - - Base
        - >-
          Webflow is a strong private software asset but the cleanest public valuation anchor remains the older $4B
          reference while current ARR is still estimated rather than disclosed.
        - The assigned record supports monitoring and re-underwriting rather than paying through a premium mark today.
        - >-
          Lack of current financial disclosure can hide multiple compression risk even if product quality remains
          strong.
        - Supported by official product proof plus secondary scale evidence but not by clean price discovery.
      - - Bear
        - >-
          True current financing context is at or below the older anchor and customer-complexity friction limits upside
          conversion from product breadth.
        - >-
          Return potential becomes unattractive because price would be defended mainly by narrative rather than by
          verified operating proof.
        - >-
          Down-round or flat-round risk, dilution overhang, and commercialization slippage become more important than
          platform quality.
        - Any new evidence showing weaker monetization or investor protections than expected would tilt the case here.
    notes: >-
      Scenario logic stays qualitative because the assigned public record does not provide enough primary pricing or
      financial detail for a defensible numeric range.
    claimRefs:
      - CV003
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
