  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: marketing-owned web experiences, not all web development'
        blocks:
          - type: paragraph
            body: >-
              The consistent boundary across official and third-party evidence is not "all websites" or "all low-code,"
              but the operating layer for marketing and content teams that need to design, publish, and optimize web
              experiences without rebuilding every change through engineering. Webflow's own product surfaces describe a
              shared workspace for marketers, designers, developers, content teams, and AI agents, while third-party
              reviews converge on marketing sites, content hubs, landing pages, and agency-delivered brand sites as the
              core use cases. That puts Webflow between template builders such as Wix or Squarespace and developer-heavy
              CMS stacks such as WordPress or Drupal: it wins where design control, CMS structure, collaboration, and
              hosting need to sit in one workflow, but it is not the whole market for software development or for
              complex back-end applications.
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
