      - number: '4.3'
        title: Historical funding is visible; current capital adequacy is still a blocker
        blocks:
          - type: paragraph
            body: >-
              Funding history is easier to observe than present liquidity. Tracxn reports six rounds and $336 million
              total funding, with a $120 million Series C in March 2022, but independent aggregators disagree on total
              funding, revenue scale, and employee count. That conflict is important because Webflow is still private:
              without current cash, burn, debt, covenant, or cash-generation disclosure, investors cannot translate the
              historical funding chronology into a current runway view. The financial verdict is therefore mixed:
              Webflow appears to have multiple monetization levers and a credible enterprise packaging strategy, but
              public evidence is not yet sufficient to underwrite revenue quality, margin path, or financing dependency
              with confidence.
