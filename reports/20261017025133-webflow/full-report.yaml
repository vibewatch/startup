            body: >-
              Webflow's public product surfaces show a broad, subscription-led monetization stack rather than a single
              low-end website-hosting SKU. Official materials position the product around collaborative site building,
              CMS, analytics, optimization, localization, publishing, and role-based workflows for marketers, designers,
