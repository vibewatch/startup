      - number: '2.3'
        title: 'Buyer segmentation: budget sits with marketing and web-ops, with agencies as an important channel'
        blocks:
          - type: paragraph
            body: >-
              The clearest buyer pattern is marketing-owned web operations. Third-party guides repeatedly describe B2B
              marketing teams, SaaS companies, agencies, and enterprise web teams as the best fit because those buyers
              care about launch speed, CMS-driven publishing, on-brand governance, and measurable experimentation more
              than deep server-side extensibility. Official product pages support the same adoption path with role-based
              access, staging, analytics, optimization, localization, and integration workflows that suit multi-role
              teams. The commercial motion is bifurcated: self-serve and mid-market buyers can start on per-site CMS and
              workspace plans, while enterprise buyers move into custom-priced packages when they need SLAs,
              permissions, localization, or multi-brand governance.
            claimRefs:
              - CM002
              - CM004
              - CM011
              - CM013
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM004
              - CM011
              - CM013
              - CM015
      - number: '2.4'
        title: 'Constraints and diligence gaps: complexity, ecommerce ceilings, and inconsistent installed-base data'
        blocks:
          - type: paragraph
            body: >-
              The same sources that support Webflow's fit also narrow its addressable market. Reviews and agency
              explainers consistently warn that the platform has a real learning curve, layered pricing, weaker fit for
              complex backend logic, and lower ceilings for large-scale ecommerce than Shopify or heavily customized
              WordPress stacks. Public adoption estimates are also noisy: one 2026 comparison pegs active sites near
              493,000, while another article cites roughly 822,000 live sites and 0.8% web share. Those figures are
              directionally positive but too methodologically mixed to anchor a precise sizing stack, so diligence
              should treat today's market case as "strong workflow demand with incomplete segment economics" rather than
              as a fully quantified market map.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM016
