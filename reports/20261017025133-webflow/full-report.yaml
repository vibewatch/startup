  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and operating job-to-be-done
        blocks:
          - type: paragraph
            body: >-
              Webflow’s product is not just a visual page builder; the official product surfaces describe a single
              system for structuring pages, branches, and locales, managing CMS content, and operating analytics and
              optimization workflows around the published site. The official video and help surfaces consistently frame
              the primary user workflow as a shared environment for marketers, designers, developers, content teams, and
              reviewers, with role-based permissions rather than separate authoring and hosting stacks. That makes the
              core product definition strongest for enterprises that treat the website as an operational publishing
              system rather than a one-off design asset.
