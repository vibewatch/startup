            body: >-
              Webflow is not only monetizing low-end publishing. Its visible packaging layers bundle governance,
              collaboration, and AI/localization tooling into higher-ACV contracts, which is strategically important
              even though public sources do not disclose realized enterprise mix.
            calloutType: insight
            claimRefs:
