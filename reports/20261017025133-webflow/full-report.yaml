        title: Exhibits
        blocks:
          - type: callout
            title: Best read as a workflow category, not a generic website-builder bucket
            body: >-
              The investable question is whether marketing-owned web operations keep shifting toward integrated
              visual/CMS/optimization stacks, not whether Webflow can serve every website or application category.
            calloutType: insight
            claimRefs:
              - CM004
              - CM007
              - CM013
          - type: callout
            title: Public market math is still too noisy for a hard Webflow SAM
            body: >-
              Contradictory installed-base counts, custom enterprise pricing, and a lack of segment-level disclosed
              spend mean the chapter can defend demand direction better than it can defend a bottom-up revenue
