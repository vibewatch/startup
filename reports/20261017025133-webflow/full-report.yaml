      - number: '3.2'
        title: Workflow governance and switching cost
        blocks:
          - type: paragraph
            body: >
              Webflow's moat in this evidence set is operational, not aesthetic. Official product surfaces document a
              collaborative canvas with role-based permissions, staging and production publishing, Analyze and Optimize,
              and reusable CMS structures, while Webflow University supplies free courses and certifications that reduce
              onboarding friction. Those features matter because they let marketing, content, and design teams work in
              the same system without collapsing control boundaries. The same evidence cuts both ways: ToolNerdy
              explicitly flags migration difficulty and weaker commerce depth versus Shopify, and Omid's comparison says
              that when a complete self-hosted CMS is mandatory, neither Webflow nor Framer's advertised export story is
              enough. The workflow moat is therefore real, but it only defends price and retention when the buyer
              actually values governed collaboration over raw portability.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP014
          - type: table
            tableRef: TP002
