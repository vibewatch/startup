  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: current-financing-terms
      missingEvidence: Definitive 2026 financing or secondary-market documentation showing current valuation, investor protections, liquidation preferences, and dilution structure.
      whyItMatters: Without current price formation and preference data, public narrative evidence cannot be converted into an underwritten entry return.
      diligencePath: Request the latest term sheet, cap table, or verified secondary mark package directly from the company or lead investors.
      relatedQuestionRefs: [QV001, QV005, QV008]
    - type: private-evidence-only
      severity: material
      topic: current-operating-metrics
      missingEvidence: Current ARR or revenue, growth, gross margin, retention, and cash-efficiency metrics from a primary management or lender-ready source.
      whyItMatters: Estimated ARR and scale proxies are insufficient for judging whether the valuation is attractive or stretched.
      diligencePath: Obtain a current operating dashboard or board-quality KPI package with definitions for revenue, ARR, retention, and margin.
      relatedQuestionRefs: [QV002, QV008]
    - type: conflicting-data
      severity: material
      topic: valuation-history-reconciliation
      missingEvidence: A reconciled funding history and valuation timeline that explains the gap between the $4B and $5.8B anchors and the $330M versus $483M funding totals.
      whyItMatters: Contradictory secondary records make it unsafe to treat any one public valuation anchor as current fact.
      diligencePath: Reconcile capitalization history against primary round announcements, investor disclosures, and company-provided financing chronology.
      relatedQuestionRefs: [QV001, QV005]
    - type: missing-source
      severity: minor
      topic: exit-readiness
      missingEvidence: Current board composition, governance controls, and audited readiness signals for a public-market or large-scale strategic exit.
      whyItMatters: Exit timing matters for return underwriting, especially when price already looks demanding.
      diligencePath: Ask for current governance materials, audit status, and any formal IPO-readiness or strategic-process preparation documents.
      relatedQuestionRefs: [QV008]
