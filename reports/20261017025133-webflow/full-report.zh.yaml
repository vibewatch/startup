  - id: FE001
    title: 产品架构图
    type: stack
    summary: 官方和第三方证据指向一套分层架构，从共享创作延伸到托管交付，并逐步加入 Cloud 扩展。
    data:
      layers:
        - label: 创作界面
          detail: 页面、分支、本地化版本和组件共用的可视化画布
          modules:
            - - Design tab
              - components
              - variables
            - - Pages
              - branches
              - locales
        - label: 内容与治理
          detail: CMS、角色和协作让多支团队共用一套运营模式
          modules:
            - - CMS collections
              - dynamic content
            - - Role-based permissions
              - reviewers
              - content editors
        - label: 衡量与运营
          detail: Analyze、Optimize、Localize、预发布和受控发布与内容运营并列
          modules:
            - - Analyze
              - Optimize
              - Localize
            - - Staging
              - page publish
              - CMS-item publish
        - label: 托管交付层
          detail: 独立评测描述了具备 SSL、备份和自动扩展能力的全球分布式托管服务
          modules:
            - - Managed hosting
              - CDN delivery
            - - SSL
              - backups
              - version control
        - label: Cloud 扩展
          detail: Webflow Cloud 将平台延伸至主站旁的动态应用
          modules:
            - - Next.js and Astro support
            - - Dynamic app experiences
              - APIs
          outputs:
            - - Adjacent site-plus-app workflow
        - label: 支持与上手界面
          detail: 帮助、迁移和大学内容降低部署摩擦，并强化受治理的产品使用
          modules:
            - - Help Center
              - migration guidance
            - - University courses
              - certifications
    approximationNotes: 这是根据指定证据综合出的概念性产品分层图，不是字面意义上的网络拓扑，也不是供应商认证的基础设施蓝图。
    claimRefs:
      - CE001
      - CE004
      - CE005
      - CE007
      - CE008
      - CE013
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Webflow 的采用路径从设计驱动的评估，走向结构化发布、受治理复核和团队规模扩张。
    data:
      items:
        - label: 发现与契合度测试
          actor: 创始人、营销人员、自由职业者或代理机构负责人
          touchpoints:
            - 免费或低承诺评估
            - 将设计控制力与 WordPress、Framer、Wix 或 Squarespace 比较
          note: 当持续发布比单次上线更重要时，产品最容易契合。
          tone: neutral
        - label: 系统与架构搭建
          actor: 设计师和开发者
          touchpoints:
            - 设计师画布
            - CMS 架构和组件配置
            - 必要时加入自定义代码或集成
          note: 对于高级用例，这个工具并非完全不需要代码。
          tone: medium
        - label: 结构化内容交接
          actor: 营销人员或内容编辑
          touchpoints:
            - 用于博客、案例研究、团队内容或资源的集合
            - 受角色限制的编辑，而不是开放布局访问
          note: 这是非开发者日常使用最强的采用场景。
          tone: positive
        - label: 协作复核与审批
          actor: 复核者、管理员或企业利益相关者
          touchpoints:
            - 评论
            - 只读共享链接
            - 预发布和逐项发布
          note: 治理功能让大团队使用比仅看客户 logo 得出的判断更可信。
          tone: medium
        - label: 发布、衡量与优化
          actor: 营销运营或网站负责人
          touchpoints:
            - Analyze 和 Optimize
            - 发布日志
            - 在不同页面复用结构化内容
          note: 官方产品界面强调持续运营，而不只是首次上线。
          tone: positive
        - label: 扩张或采购摩擦
          actor: 团队采购方、财务或采购部门
          touchpoints:
            - Premium、Team 或 Enterprise 套餐
            - 定价变化
            - 项目或功能阈值
          note: 套餐设计清晰呈现了扩张路径，但定价复杂度可能拖慢更大范围的推广。
          tone: risk
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU007
      - CU010
      - CU011
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 对指定证据中六项最突出的残余风险进行定性比较。
    data:
      columns:
        - label: 可能性
        - label: 影响
        - label: 缓解成熟度
        - label: 残余严重性
      rows:
        - label: 功能连续性
          values:
            - value: Medium
              detail: 两项原生能力在 2025-2026 年间停止服务。
            - value: High
              detail: 客户可能需要重建自动化或门控体验。
            - value: Low
              detail: 虽有替代工具，但会增加供应商和运营复杂度。
            - value: High
              detail: 产品进一步变化可能迫使客户迁移或重构架构。
        - label: 托管平台集中度
          values:
            - value: Medium
              detail: 核心发布和协作运行在 Webflow 的托管应用中。
            - value: High
              detail: 服务中断或商业变化会影响公开 Web 资产。
            - value: Medium
              detail: 备份、预发布、导出和 API 提供部分保障。
            - value: High
              detail: 要实现完整可移植性，仍需要经过测试的恢复和迁移方案。
        - label: 受监管工作流边界
          values:
            - value: Medium
              detail: 公开营销流程收集敏感信息时，风险会上升。
            - value: High
              detail: 隐私、安全、无障碍或行业合规失误可能带来法律风险。
            - value: Medium
              detail: 专业系统和明确交接能降低边界风险，但无法消除风险。
            - value: High
              detail: 指定证据池中没有一手监管机构或法律证据。
        - label: 套餐与成本扩张
          values:
            - value: High
              detail: 席位、增值服务、带宽、代理机构和相邻工具会随用量叠加。
            - value: Medium
              detail: 成本增长可能压缩营销自主性的预期收益。
            - value: Medium
              detail: 预测和合同复核可以让这部分暴露变得清晰。
            - value: Medium
              detail: 公司特定用量和完全计入的支出仍属非公开信息。
        - label: 运营者技能集中
          values:
            - value: High
              detail: 多个来源都描述了较高的学习和执行要求。
            - value: Medium
              detail: 交接或治理薄弱会拖慢发布并降低质量。
            - value: Medium
              detail: 培训、权限和流程控制均可使用。
            - value: Medium
              detail: 平台控制不能替代有经验的运营人员。
        - label: 第三方集成栈
          values:
            - value: Medium
              detail: 在更大范围内，外部应用、API、webhook 和替代工具都很常见。
            - value: Medium
              detail: 供应商增多会带来续约、所有权和故障点暴露。
            - value: Medium
              detail: 架构负责人和供应商清单可以收窄暴露面。
            - value: Medium
              detail: 集成和交易对手依赖仍会残留。
    approximationNotes: 可能性、影响、成熟度和残余严重性是定性证据综合，不是测量得出的概率；指定证据池中没有数值化事故频率。
    claimRefs:
      - CR003
      - CR004
      - CR006
      - CR007
      - CR008
      - CR011
      - CR012
      - CR015
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 产品证明和规模信号仍然真实存在，但估值不透明和财务披露不完整，让证据链只能停在“继续研究”。
    data:
      nodes:
        - id: product-proof
          label: 产品证明
          note: 官方文档展示了 CMS、分析、优化、权限、预发布和 AI 辅助工作流。
        - id: scale-signals
          label: 规模信号
          note: 二手来源仍指向庞大的客户、网站和合作伙伴覆盖面。
        - id: monetization-proof
          label: 变现证明
          note: 指定证据池中公开的只有估算 ARR 锚点。
        - id: price-context
          label: 价格背景
          note: 不同二手来源中的公开估值和融资锚点相互冲突。
        - id: downside-check
          label: 下行检查
          note: 评测者摩擦和估值倍数压缩风险仍然存在。
        - id: recommendation
          label: 继续研究
          note: 等待当前融资和财务证明，再评估入场。
      edges:
        - from: product-proof
          to: scale-signals
          label: 支持
        - from: scale-signals
          to: monetization-proof
          label: 仍需清晰的转化证明
        - from: monetization-proof
          to: price-context
          label: 单凭此项无法解决价格问题
        - from: price-context
          to: downside-check
          label: 提高入场风险
        - from: downside-check
          to: recommendation
          label: 导向
    approximationNotes: 这是推理链，而非量化转化模型，因为指定证据池缺乏一手估值和当前财务披露。
    claimRefs:
      - CV001
      - CV003
      - CV006
      - CV007
      - CV011
      - CV012
      - CV013
