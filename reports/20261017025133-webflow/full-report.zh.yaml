      - number: '2.3'
        title: 买方分层：预算掌握在营销与 Web 运营团队，代理商是重要渠道
        blocks:
          - type: paragraph
            body: >-
              最清晰的买方模式是由营销团队主导 Web 运营。第三方指南反复将 B2B 营销团队、SaaS 公司、代理商和企业 Web 团队列为最适合的客户，因为这些买方相比深度的服务端扩展能力，更看重上线速度、CMS
              驱动的发布、品牌治理和可度量的实验。官方产品页面也以基于角色的访问、预发布、分析、优化、本地化和集成工作流支持同一路径，适合多角色团队。商业模式分成两路：自助式与中端市场买方可以从按网站收费的 CMS
              和工作区方案起步；企业买方在需要 SLA、权限、本地化或多品牌治理时，则转向定制报价套餐。
            claimRefs:
              - CM002
              - CM004
              - CM011
              - CM013
              - CM015
