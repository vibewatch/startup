            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV007
              - CV011
              - CV012
              - CV013
      - number: '8.2'
        title: 估值背景与可比信号
        blocks:
          - type: paragraph
            body: >-
              估值背景方向上偏正面，但数字噪声很大。TechStackIPO 将 Webflow 定位为 IPO 前的 Series E 公司，IPO 准备度评分为 71 / 100，对外宣称的估值为 $5.8
              billion；但同一页面还称公司估值为 $4 billion、融资额为 $330 million，并将 $5.8 billion 的数字标注为 2022 年 1 月时点。WhoEarns 也重复了 $4
              billion 的 2022 年锚点，估计 ARR 约为 $200 million，并称 Webflow 累计融资 $330 million，这与 TechStackIPO 的 $483 million
              融资总额冲突。与 Framer 的定价比较证据有助于判断产品市场定位和商业化纪律，但无法解决私募市场成交价；它主要说明，当内容模型和治理负担增加时 Webflow 更有优势，而在更小或低带宽部署中 Framer
              可能更便宜。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: 情景与最终尽调
        blocks:
          - type: paragraph
            body: >-
              乐观情景需要证据证明 Webflow 的企业工作流扩张和 AI 定位正在转化为持久且当前有效的财务表现，而公开记录尚未展示这一点。基准情景将 Webflow
              视为高质量的私营软件资产，但其最近得到明确重复的估值锚点如今已经过时，最新估值标记证据也不一致到不足以支持高确信度入场。悲观情景是业务很好，但可投资价格错了：如果当前融资条款、老股交易价格或利润率质量不足以支撑高于
              2022 年锚点的溢价倍数，那么下行来自倍数压缩，而不是产品失败。在评估任何新一轮融资或老股购买之前，尽调需要当前 ARR 与增长、毛利率与烧钱质量、企业客户留存，以及包括优先权和稀释结构在内的确定性 2026
              年融资条款。
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
