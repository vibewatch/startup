      - number: '3.4'
        title: 持久性与替代风险
        blocks:
          - type: paragraph
            body: >
              这一模式让 Webflow 在中端市场内容运营中更耐用，但在任务更窄或更专业的场景中容易受伤。Framer 正在挤压设计师主导网站的漏斗顶部，并且已经在近期 Y Combinator 首页快照中领先
              Webflow。对于偏好开源控制、愿意承担插件和维护负担的买方，WordPress 仍是现实替代方案；而在更看重店面深度、而非 Web 运营治理的重电商边缘场景中，Shopify
              胜出。因此，现有证据反对“普遍护城河”的说法：当内容结构、权限、协作和托管主机被一起购买时，Webflow 的防御力最强；当买方主要优化视觉速度、可移植性或电商专业化时，防御力最弱。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP012
              - CP014
              - CP015
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 运营护城河胜过审美护城河
            body: 证据最充分的护城河，是 Webflow 能在一套工作流中结合结构化 CMS 能力、基于角色的协作、培训和托管式发布；在公开证据集中，没有任何指定替代方案能匹配这一整套能力。
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP006
              - CP008
          - type: callout
            title: 设计师优先的替代压力真实存在
            body: >-
              Framer 在这组证据中不是假想进入者：比较证据称它更适合频繁视觉迭代，近期 Y Combinator 首页快照也显示它领先 Webflow。因此，Webflow
              面对直接同类产品的护城河，取决于买方是否比纯粹速度更看重运营。
            calloutType: risk
            claimRefs:
