companyProfile:
  summary: >-
    Webflow 是一个可视化 Web 开发与网站体验平台，让营销、设计、开发和内容团队搭建、管理、优化网站，不必每次改动都依赖传统的手写前端代码。它把设计工具、CMS 工作流、主机托管、协作控制，以及日益增多的 AI
    辅助建站和优化功能结合在一起。
  headquarters: San Francisco, California, United States
  productSummary: 面向托管式 Web 体验的可视化网站构建器、CMS、主机托管与工作流平台。
  customerFocus: 营销团队、设计驱动型代理商、初创公司与企业 Web 团队。
  businessModel: 按订阅收费的软件，包含网站、工作区和增值功能定价。
  stage: Private growth-stage company
  fundingStatus: 最近一次公开披露的锚点仍是 $4.0 billion 估值；证据集中没有公开更新当前融资详情。
