        title: 产品边界与要解决的运营任务
        blocks:
          - type: paragraph
            body: >-
              Webflow 的产品不只是可视化页面构建器；官方产品界面将它描述为一套统一系统，用于构建页面、分支和本地化版本，管理 CMS
              内容，并围绕已发布网站运行分析和优化工作流。官方视频与帮助界面始终把主要用户流程定义为营销、设计、开发、内容团队和审核者共享的环境，采用基于角色的权限，而不是把创作与主机托管拆成两套系统。因此，对把网站当作运营发布系统、而不是一次性设计资产的企业而言，这一定义最有说服力。
