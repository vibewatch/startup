      - number: '1.2'
        title: 领导层、治理与控制
        blocks:
          - type: paragraph
            body: >-
              保留的证据池足以识别主要运营负责人，但不足以完整描绘治理结构。第三方来源显示 Linda Tong 至迟于 2023 年担任 CEO，Adrian Rosenkranz 于 2025 年 2 月加入并成为
              Webflow 首位 CRO，这说明公司在扩大企业客户采用的同时，仍在推进市场拓展领导层的专业化。尽管这里的公开证据主要来自二手来源而非官方材料，各来源对创始人身份的描述也基本一致。


              治理结构仍只部分可见。一家追踪数据库将 Laela Sturdy、Bryant Chou 和 Sergie Magdalin
              列为董事，但证据池没有当前官方董事名册、股权结构表、投票控制披露或清晰的投资人权利摘要。就尽调而言，利益相关者地图可以识别可能的影响中心，但所有权、董事会委员会结构以及创始人与投资人之间的控制权，仍需公司直接确认。
