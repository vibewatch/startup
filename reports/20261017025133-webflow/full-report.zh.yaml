      - number: '3.2'
        title: 工作流治理与切换成本
        blocks:
          - type: paragraph
            body: >
              在这组证据中，Webflow 的护城河来自运营，而非审美。官方产品界面记录了带基于角色权限的协作画布、预发布与生产发布、Analyze 和 Optimize，以及可复用的 CMS 结构；Webflow
              University 则提供免费课程和认证，降低上手摩擦。这些功能的重要性在于，营销、内容和设计团队可以在同一系统中工作，同时不打破控制边界。同一批证据也有另一面：ToolNerdy 明确指出迁移困难，且相比
              Shopify 电商深度较弱；Omid 的比较则称，完整的自托管 CMS 若是硬性要求，Webflow 和 Framer
              宣传的导出能力都不够。因此，工作流护城河确实存在，但只有在买方真正看重受治理的协作、而非纯粹的可移植性时，它才能守住价格和留存。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP014
