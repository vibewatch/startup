  - id: TV002
    title: 正反论点表
    columns:
      - 论点
      - 证据
      - 哪些事实会改变判断
    rows:
      - - 正论
        - Webflow 官方材料展示了覆盖 CMS、分析、优化、权限、预发布和 AI 辅助发布的完整网站体验工作流。
        - 更新的一手财务披露需证明这些能力正在带来持续增长和高效的企业扩张。
      - - 正论
        - 独立来源仍显示出明显的规模信号，包括 250000+ 付费客户、40M+ 个网站、300000+ 家公司和 2000+ 个合作伙伴。
        - 一份一手更新材料需要核对这些规模信号是否对应当前的付费客户质量、留存和变现。
      - - 反论
        - 公开估值依据前后不一致：指定的二手记录把 $5.8B 的标题数字、2022 年 $4B 锚点和相互冲突的融资总额混在一起。
        - 当前融资文件集，或经独立核实的二手估值，需要厘清估值、累计募资额和优先权结构。
      - - 反论
        - 客户和评测者证据仍显示上手或易用性存在摩擦，这削弱了简单的无代码溢价倍数论。
        - 需要证明企业采用和留存足以抵消复杂度，或证明摩擦仅限于非核心 SMB 买家。
    notes: 正论行概括产品和规模支撑；反论行概括指定来源中的估值不透明和采用摩擦。
    claimRefs:
