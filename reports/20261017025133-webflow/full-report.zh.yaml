      - number: '3.3'
        title: 定价与套餐交叉
        blocks:
          - type: paragraph
            body: >
              Omid 的实际测算表明，定价竞争比套餐标题价格更复杂。对于一个单人所有、包含两个集合且带宽不超过 50 GB 的网站，Framer Basic 每月 $10，低于 Webflow Premium 的
              $25。增加第三个集合后，比较结果反转：Framer 升至 $30 的 Pro，而 Webflow 仍为 $25；同样的工作负载推到 100 GB 后，经济性再次反转，因为 Webflow
              需要带宽增值包，价格达到 $45，而 Framer 为 $30。ToolNerdy 的公开目录价也指向同一结论：只有买方可以不要 CMS 时，Webflow Basic
              才是低价选项；一旦工作需要结构化内容，Premium 就成为默认目录价层级。
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
