        - 中
        - 高
        - 在 Webflow 上保留公开教育内容，将敏感工作流步骤迁移到专业系统
        - 公开内容与受监管系统之间的每个边界都仍有集成和交接风险
        - 对每个涉及身份、金融、健康或理赔数据的工作流进行架构审查
      - - 当前诉讼、执法或公开事件风险在本工作资料池中未经验证
        - 公司整体 / 当前刷新轮次
        - 指定资料池中没有监管机构、法院或事件披露来源
        - Unknown
        - 高
        - 在管理层提供当前披露前，将该缺口视为未解决
        - 尽调关闭来源缺口前，剩余风险未知
        - 向管理层和法律顾问索取 24 个月的诉讼、执法、DPA、SLA 和事件历史
    notes: 按严重性排序；由于指定资料池缺少监管机构、法院或事件的直接披露，各行混合了有来源的风险和一个明确的证据缺口。
    enumerationScope:
