  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与买方边界
        blocks:
          - type: paragraph
            body: >
              现有证据指向分层市场，而不是一组单一的竞争者。对于设计师主导的网站，Framer 是最接近的直接同类产品：Omid Saffari 2026 年 10 月的比较称，内容发布是持续性业务运营时应选
              Webflow，而视觉迭代是主要工作时应选 Framer。WordPress 仍是内容密集型发布的在位 / 开放式默认选择，Shopify
              仍是复杂电商更专用的替代方案，低端构建器则继续承接非常小型的非技术网站。Webflow 作为在位平台仍然重要——Forbes 2025 年 9 月的快照称其拥有 3.5 million 名用户和 300,000
              名付费客户——但同一证据池也显示出真实的替代压力：Wikipedia 称在 2024 年和 2025 年 Y Combinator 批次的网站首页选择中，Framer 已领先 Webflow。
            claimRefs:
