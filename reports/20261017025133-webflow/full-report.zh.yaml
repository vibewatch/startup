  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：营销团队主导的 Web 体验，而非所有 Web 开发
        blocks:
          - type: paragraph
            body: >-
              官方与第三方证据共同划出的边界，不是“所有网站”或“所有低代码”，而是面向营销和内容团队的运营层：这些团队需要设计、发布和优化 Web 体验，不必每次改动都让工程团队重做。Webflow
              的产品界面将营销、设计、开发、内容团队与 AI 智能体放在共享工作区中；第三方评测则一致将营销网站、内容中心、落地页和代理商交付的品牌网站视为核心用例。因此，Webflow 介于 Wix、Squarespace
              等模板构建器与 WordPress、Drupal 等开发者主导的 CMS 技术栈之间：当设计控制、CMS 结构、协作和主机托管需要放进同一套工作流时，它更有优势，但它并不覆盖软件开发或复杂后端应用的全部市场。
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
