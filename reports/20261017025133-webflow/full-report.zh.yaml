      - number: '2.2'
        title: 测算视角：宏观需求真实存在，但 Webflow 的精确 TAM 仍未证实
        blocks:
          - type: paragraph
            body: >-
              公开测算证据在相邻市场和预算压力视角上最强，而不是直接指向 Webflow 的 TAM。一份外部汇总引用 Gartner 数据称，低代码 / 无代码市场 2026 年约为 $44.5 billion，70%
              的新企业应用会使用这类工具；另一份材料引用 Gartner 2025 年 CMO Spend Survey，称数字渠道占营销支出的 61.1%，而总预算约为收入的 7.7%。这些数据支持压缩 Web
              生产周期的工具拥有需求背景；生态合作伙伴引用的 Forrester 基准也进一步表明，买方重视更快的发布节奏和更低的变更成本。但它们无法为 Webflow 本身提供站得住脚的
              SAM/SOM，因为公开记录仍混杂了相邻品类规模、运营方预算信号和方向性的供应商采用代理指标。
            claimRefs:
