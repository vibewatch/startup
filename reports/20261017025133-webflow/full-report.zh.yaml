  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              相比作为一个可按投资逻辑评估的 2026 年投资标的，Webflow 作为产品和工作流平台更强。官方产品材料展示了包含 CMS、分析、优化、基于角色权限、预发布和 AI
              辅助工作流的广泛网站体验技术栈；独立来源也仍指向可观的客户规模和活跃的合作伙伴生态。问题在于价格支撑：指定公开来源混杂了 $4 billion 的 2022 年融资锚点、$5.8 billion 的
              headline 估值和相互矛盾的融资总额，而证据池唯一的收入数据点是估计约 $200 million ARR，不是当前收入、增长、留存或利润率的披露数据集。因此，证据足以说明 Webflow
              具有战略相关性，却不足以支持以新鲜的溢价价格买入。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV012
