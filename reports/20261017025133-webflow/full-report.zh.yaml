chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与平台边界
        blocks:
          - type: paragraph
            body: >-
              Webflow 的官方定位早已超出简单的无代码网站构建器。首页如今将产品描述为“面向现代企业的智能体 Web
              平台”；帮助中心与大学课程材料则把它描述为一套托管式工作流，覆盖可视化设计、结构化内容、优化、发布和受治理的协作。这一组合对后续章节很关键，因为它将 Webflow 锚定为工作流与 Web
              运营平台，而不只是模板驱动的 SMB 建站工具。


              与产品边界相比，官方页面对基础公司身份的直接记录更少。保留的第三方资料一致将 Webflow 定位在旧金山，并称公司由 Vlad Magdalin、Sergie Magdalin 和 Bryant Chou
              创立；但证据池没有当前官方公司简介页面，能够明确确认成立日期、总部或法律实体信息。因此，我们对平台实际做什么的判断，比对正式披露的公司身份信息更有把握。
