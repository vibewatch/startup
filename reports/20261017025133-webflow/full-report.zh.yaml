  - id: FM001
    title: Webflow 可触达工作流的需求分层
    type: pyramid
    summary: 可触达工作流从广泛的低代码顺风，逐步收窄到营销团队主导的具体 Web 运营场景；在这些场景中，Webflow 的集成 CMS、协作和优化功能最有价值。
    data:
      items:
        - label: 广泛的低代码 / 无代码顺风
          displayValue: $44.5B adjacent market in 2026
          note: 7Span 引用 Gartner 对更广泛低代码 / 无代码市场的判断，以及新企业应用中 70% 使用此类工具的数据。
          tone: neutral
        - label: 数字预算推动网站效率
          displayValue: 61.1% of marketing spend is digital; budgets ~7.7% of revenue
          note: Underscore 引用 Gartner，说明团队为何需要从 Web 渠道获得更高产出。
          tone: neutral
        - label: 网站作为营收阵地
          displayValue: 91% of marketing leaders say the website drives more revenue than any other channel
          note: Underscore 将这一点归因于 Webflow 的《2025 年网站现状》研究。
          tone: opportunity
        - label: Webflow 反复服务的核心用例
          displayValue: Marketing and content sites managed without constant developer involvement
          note: 第三方评测反复聚焦落地页、博客、资源中心和 B2B 品牌网站。
          tone: opportunity
        - label: 自助式和中端市场商业入口
          displayValue: $23/month CMS plan, plus separate workspace economics
          note: 公开定价显示内容型网站的进入门槛较低，但计费层次较多。
          tone: warning
        - label: 企业运营层
          displayValue: Custom pricing; permissions, staging, localization, analytics, and optimization
          note: 企业价值在于工作流控制和治理，但公开合同数据稀少。
          tone: opportunity
    approximationNotes: 这是一组逐步收窄的需求分层，不是转化漏斗，也不是算术式 TAM 到 SOM 的级联。由于公开记录没有披露清晰的 Webflow 专属 SAM，各层混合了相邻市场规模、预算结构、调研证据、用例契合度和定价结构。
    claimRefs:
      - CM003
      - CM005
      - CM007
      - CM011
      - CM013
      - CM015
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 序数 x 评分代表内容治理广度和发布复杂度；序数 y 评分代表设计师主导的迭代速度，仅使用指定证据池中有文档记录的工作流和套餐证据。
    data:
      points:
        - label: Webflow
          x: 5
          'y': 3
          note: 有文档支持的 CMS 深度、角色控制、发布工作流、分析 / 优化和培训组合最广。
        - label: Framer
          x: 3
          'y': 5
          note: 最适合设计师主导的迭代，且文档支持最充分，但内置 CMS 容量小于 Webflow。
        - label: WordPress + 插件
          x: 4
          'y': 2
          note: 开放性强的既有发布栈，但维护和插件负担由运营方承担。
        - label: Shopify
          x: 2
          'y': 2
          note: 专注于店铺深度，而不是广泛的 Web 运营控制平面。
        - label: Wix / Squarespace
          x: 1
          'y': 4
          note: 面向微型、非技术型商业网站的低端替代品，而不是结构化 Web 运营方案。
        - label: 自托管 / 定制构建
          x: 5
          'y': 1
          note: 控制力和可移植性最高，但迭代速度取决于内部工程投入。
    approximationNotes: 评分是根据指定证据中有文档记录的工作流契合度、CMS 容量和可移植性限制做出的序数综合，不是实测基准。
    claimRefs:
      - CP001
      - CP002
      - CP006
      - CP007
      - CP008
      - CP012
      - CP014
      - CP015
      - CP016
  - id: FI001
    title: 营收模式桥接图
    type: flow
    summary: 公开证据显示，订阅模式从按站点发布扩展到协作、企业治理和付费增值服务，但公开记录没有披露每一层产生多少毛利或现金转化。
    data:
      nodes:
        - label: 产品使用与内容工作流
          detail: 用户在 Webflow 中构建、管理和发布网站，并使用 CMS、分析、优化、本地化和协作工作流。
          claimRefs:
            - CI001
            - CI002
        - label: 站点套餐订阅
          value: $15-$39/mo list
          unit: per site
          detail: Basic 和 Premium 套餐直接从已发布的网站变现。
          claimRefs:
            - CI003
            - CI004
        - label: 工作区与席位变现
          value: Free-$49/mo + seats
          unit: per workspace / seat
          detail: 协作、预发布和权限在站点套餐之外增加第二层变现。
          claimRefs:
            - CI003
            - CI005
        - label: 平台 / 企业合同
          value: $2,500+/mo
          unit: annual contract
          detail: Team 和 Enterprise 套餐将治理、席位、Localize、AI 积分和支持打包进更大的合同。
          claimRefs:
            - CI005
            - CI012
        - label: 增值服务与用量扩张
          detail: Analyze、Optimize、Localize、带宽层级和云用量都能让客户钱包份额超出表面订阅收入。
          claimRefs:
            - CI003
            - CI005
            - CI006
        - label: 毛利与现金转化
          detail: 公开来源显示了定价杠杆，却没有披露确认收入、毛利率、CAC / 回收期、现金消耗或现金跑道。
          claimRefs:
            - CI013
            - CI014
    approximationNotes: null
    claimRefs:
