              - CV014
      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 在一手证据更新价格前继续研究
            body: Webflow 达到了战略相关性的门槛，但指定公开记录不足以支撑支付新的溢价估值。下一步尽调应验证当前 ARR、增长、利润率、留存和融资条款，而不是争论产品是否重要。
            calloutType: recommendation
            claimRefs:
