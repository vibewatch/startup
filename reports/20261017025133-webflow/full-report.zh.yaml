            body: >-
              融资历史比当前流动性更容易观察。Tracxn 报告六轮融资、累计融资 $336 million，其中 2022 年 3 月 Series C 为 $120
              million；但独立聚合数据库对融资总额、收入规模和员工数的说法并不一致。这一冲突很重要，因为 Webflow
              仍是私营公司：没有当前现金、烧钱速度、债务、契约或现金生成披露，投资人无法把历史融资时间线转换成当前现金跑道判断。因此，财务结论是混合的：Webflow
              似乎拥有多种变现杠杆和可信的企业套餐策略，但公开证据尚不足以有把握地评估收入质量、利润率路径或融资依赖。
