      - number: '1.3'
        title: 融资、规模与公开指标可信度
        blocks:
          - type: paragraph
            body: >-
              概览最重要的结论是：Webflow 这家私营公司的规模，目前仍只能从彼此不一致的二手数据库中观察。GetLatka 报告融资额为 $217.8 million，并将 $4 billion 估值归因于 2021 年
              Series B；Taptwice 则报告融资额为 $334.9 million，并称 2022 年 3 月 Series C 的估值同为 $4
              billion。保留的追踪数据库对收入和员工数也同样不一致：一项估计认为 2024 年收入约为 $212.5 million，另一项估计 ARR 约为 $200 million，还有一项只给出 $96.5
              million 年收入和约 1.1 thousand 名员工。


              这些冲突不代表公司规模小或停滞，而是说明公开记录不足以把任何一家私营公司数据库当作事实基准。官方来源确实支持广泛采用与企业化野心，包括首页所称的超过 300 thousand 个团队，以及强调跨职能协作、实验和
              AI 驱动网站运营的产品材料。但当前收入质量、准确的客户分母，以及 $4 billion 估值锚点是否仍然新鲜，仍是待尽调事项，而非已经确定的事实。
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO015
      - number: '1.4'
        title: 里程碑、约束与待确认事项
        blocks:
          - type: paragraph
            body: >-
              里程碑记录以融资和产品平台发展为主。保留的来源支持 2013 年前后成立、早期种子轮支持、2019 年、2021 年和 2022 年的大额融资、2023 年 CEO 交接、2024 年收购 Intellimize
              和 GreenSock，以及 2025 年聘任市场拓展负责人。随后，2026 年官方产品材料显示 Webflow 进一步押注 AI 辅助创作、AEO/SEO 工具和企业工作流控制。


              该证据池中的主要反向证据来自执行层面，而非法律或监管层面。一份保留的独立评测认为，Webflow 仍有明显学习曲线，多站点用户面临实质性的定价摩擦；相比 Shopify 的电商能力，Webflow
              存在局限，且日后想迁移的客户会受到一定平台锁定。这一点很重要，因为当前估值和市场定位叙事取决于：Webflow 能否继续向高端市场上移，而不让易用性下降，或让商业摩擦的增加速度快于产品广度的提升。
