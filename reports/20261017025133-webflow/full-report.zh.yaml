      - number: '5.2'
        title: 架构、部署与扩展模式
        blocks:
          - type: paragraph
            body: >-
              该平台采用托管而非自托管的运营模式。官方来源展示了预发布与生产发布、页面和 CMS 项目级发布控制、应用、API，以及围绕核心画布和 CMS
              构建的开发者文档。独立主机评测将交付层描述为全球分布式托管主机，具备自动扩缩容、SSL、备份和较低的服务器维护负担；这些来源支持托管主机层确实存在，但本身无法完全确定底层供应商技术栈，也不能证明所有合规断言。Webflow
              Cloud 似乎是从传统营销网站托管走向动态应用部署的架构桥梁，但这里最强的公开证据仍是官方产品定位与外部解读的混合，而不是一套深入的官方技术架构材料。
