      - number: '2.4'
        title: 约束与尽调缺口：复杂度、电商上限与不一致的存量数据
        blocks:
          - type: paragraph
            body: >-
              支持 Webflow 适配性的同一批来源，也在收窄其可服务市场。评测和代理商解读一致提醒：该平台有明显学习曲线，定价层级复杂，对复杂后端逻辑的适配较弱，在大规模电商上的上限也低于 Shopify 或深度定制的
              WordPress 技术栈。公开采用量估计同样嘈杂：一项 2026 年比较将活跃网站数估为接近 493,000，另一篇文章则称约有 822,000 个在线网站、占 Web 的
              0.8%。这些数字方向上偏正面，但方法混杂，不能作为精确测算框架的锚点；因此，尽调应把当前市场逻辑视为“工作流需求强劲，但分层经济性不完整”，而非一张已完全量化的市场地图。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 更适合看作工作流品类，而非泛化的网站构建器市场
            body: 可投资的问题在于，营销团队主导的 Web 运营是否会继续转向整合式的可视化 / CMS / 优化技术栈，而不是 Webflow 能否服务每一种网站或应用品类。
            calloutType: insight
            claimRefs:
              - CM004
              - CM007
              - CM013
          - type: callout
            title: 公开市场数据仍太嘈杂，无法硬算 Webflow 的 SAM
            body: 存量数量相互矛盾、企业定价采用定制方式，且缺少按细分市场披露的支出数据；因此，本章能更有把握地说明需求方向，却无法有力支撑自下而上的收入机会模型。
            calloutType: risk
            claimRefs:
