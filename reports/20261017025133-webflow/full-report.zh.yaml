      - CV002
      - CV004
      - CV005
      - CV006
      - CV008
      - CV010
      - CV011
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - AI 工作流扩张和企业 Web 运营定位带来更强的变现，但目前公开证据池还无法证明这一点。
        - 只有新一轮融资或二手证据包同时核实当前 ARR 增长、利润率和留存明显更强，才能支持高于过时 2022 年锚点的溢价估值。
        - 如果 AI 叙事跑在企业经济性前面，或优先权条款不利于投资者，投资者仍可能买贵。
        - 需要一手证据消除当前公开估值和融资信息的不一致。
      - - 基准
        - Webflow 是一项强势的私有软件资产，但最清晰的公开估值锚点仍是较早的 $4B 参考值；当前 ARR 依然是估算值，并未披露。
        - 指定记录支持持续跟踪并重新评估，而不是今天按溢价估值买入。
        - 即便产品质量仍然很强，缺乏当前财务披露也可能掩盖估值倍数压缩风险。
        - 有官方产品证明和二手规模证据支撑，但没有清晰的价格发现。
      - - 悲观
        - 当前真实融资背景处于较早锚点或其下方，客户复杂度带来的摩擦限制了产品广度转化为上行空间。
        - 回报潜力变得缺乏吸引力，因为价格主要靠叙事而不是经核实的运营证明来支撑。
        - 下轮融资或平轮融资风险、稀释压力和商业化滞后，比平台质量更值得关注。
        - 任何显示变现或投资者保护弱于预期的新证据，都会让判断转向这一情景。
    notes: 情景逻辑保持定性，因为指定公开记录没有足够的一手定价或财务细节来支撑可信的数字区间。
    claimRefs:
      - CV003
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
