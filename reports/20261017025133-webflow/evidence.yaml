evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-scale
    missingEvidence: Current management-backed ARR, recognized revenue, segment mix, and post-2025 headcount.
    whyItMatters: >-
      The public judgment on quality of growth and valuation is weak if the chapter relies only on conflicting
      private-company trackers.
    diligencePath: >-
      Request board deck or KPI pack covering ARR, recognized revenue, gross retention, NRR, and current headcount by
      function.
    relatedQuestionRefs:
      - QO003
      - QO005
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: funding-history
    missingEvidence: >-
      One clean financing timeline with round dates, amounts, investors, post-money valuations, and any material
      secondaries.
    whyItMatters: >-
      The retained sources disagree on total capital raised and whether the $4B anchor belongs to a 2021 Series B or a
      2022 Series C.
    diligencePath: >-
      Request cap table, financing summary, and confirmation from management or lead investors on the latest primary and
      secondary pricing.
    relatedQuestionRefs:
      - QO005
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: An official current board roster, committee structure, and ownership-control summary.
    whyItMatters: >-
      Leadership can be named from secondary sources, but governance quality and control rights cannot be judged
      confidently without primary evidence.
    diligencePath: Request leadership page, board list, investor rights summary, and current governance deck from the company.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: minor
    topic: customer-denominator
    missingEvidence: A single, audited definition for customers, paying teams, websites, and enterprise accounts.
    whyItMatters: >-
      Mixing teams, websites, and broader usage counts makes customer scale easy to overstate and hard to compare with
      peers.
    diligencePath: Ask management to define and time-stamp each customer denominator used in marketing, finance, and board reporting.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: A direct public Webflow-specific TAM/SAM/SOM segmented by buyer type, geography, and contract tier.
    whyItMatters: >-
      Without a segment-level denominator, the chapter can defend demand direction but not a calibrated revenue
      opportunity stack.
    diligencePath: >-
      Request management's internal segmentation by self-serve, mid-market, and enterprise ARR plus win-rate assumptions
      by geography.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: installed-base
    missingEvidence: >-
      A reconciled explanation of how Webflow, W3Techs-style share estimates, and publisher site-count proxies define
      active versus live sites.
    whyItMatters: >-
      Installed-base growth is useful as a market signal, but inconsistent denominators make external adoption evidence
      too noisy for precise sizing.
    diligencePath: >-
      Ask management for current paid-customer, active-site, and enterprise-customer counts with definitions that can be
      tied back to public metrics.
    relatedQuestionRefs:
      - QM005
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: enterprise-pricing
    missingEvidence: >-
      Actual enterprise contract values, seat economics, and attach rates for localization, optimization, and AI
      products.
    whyItMatters: >-
      The commercial upside likely sits in enterprise web-ops, but public pricing stops short of the contract terms that
      would anchor SAM and valuation.
    diligencePath: >-
      Request recent enterprise proposals, realized ASPs, and expansion data by module to test whether workflow breadth
      translates into ACV growth.
    relatedQuestionRefs:
      - QM006
      - QM008
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: enterprise-pricing
    missingEvidence: >-
      Current enterprise contract pricing, discounting, seat minimums, migration services, and renewal terms for Webflow
      and Framer.
    whyItMatters: >-
      Public list prices explain SMB and mid-market crossover points, but enterprise ACV and migration friction
      determine whether Webflow's workflow moat actually monetizes at the high end.
    diligencePath: >-
      Request two recent Webflow enterprise quotes, two Framer enterprise or Pro quotes for a comparable workload, and
      one buyer-side migration plan showing implementation services and renewal terms.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: revenue-quality
    missingEvidence: >-
      Current ARR, recognized revenue, YoY growth, and revenue mix across site plans, workspace/seat layers, Team,
      Enterprise, and add-ons.
    whyItMatters: >-
      Revenue quality cannot be underwritten from list pricing or third-party estimates alone; segment mix drives
      durability, margin, and valuation support.
    diligencePath: >-
      Request the latest board pack or monthly KPI deck with revenue bridge and segment mix, plus policy notes on
      recognition.
    relatedQuestionRefs:
      - QI003
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Gross margin, hosting/CDN cost intensity, support/service delivery cost, CAC, payback, win rate, and net revenue
      retention.
    whyItMatters: >-
      Webflow's enterprise packaging can create attractive ACV, but without margin and acquisition-cost data investors
      cannot judge operating leverage or pricing power.
    diligencePath: >-
      Request cohort-level retention and expansion data, S&M efficiency metrics, and a gross-margin walk by product
      line.
    relatedQuestionRefs:
      - QI004
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Current unrestricted cash, monthly burn, free cash flow, debt/project-finance obligations, covenant terms, and
      base / downside runway.
    whyItMatters: >-
      Historical fundraising is not the same as cash available today, so next-round dependency and downside financing
      risk remain unknown.
    diligencePath: >-
      Request current balance sheet, cash waterfall, debt schedule, and management runway scenarios tied to hiring and
      infrastructure plans.
    relatedQuestionRefs:
      - QI005
      - QI008
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: financial-scale
    missingEvidence: >-
      A reconciled management view of current revenue, cumulative funding, and headcount versus third-party aggregator
      estimates.
    whyItMatters: >-
      Conflicting public scale datapoints weaken confidence in valuation heuristics and in any attempt to use employee
      count as a cost-base proxy.
    diligencePath: >-
      Ask management to reconcile public-company profiles against internal cap-table, financing, revenue, and HR system
      exports.
    relatedQuestionRefs:
      - QI003
      - QI007
      - QI008
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public developer-signal or practitioner-community evidence for Webflow Cloud, MCP, API, or integration usage at
      meaningful scale.
    whyItMatters: >-
      Without external adoption evidence, the chapter cannot judge whether the developer-facing extension is strategic
      traction or mostly product positioning.
    diligencePath: >-
      Request public or customer-shareable metrics on API usage, app installs, Cloud deployments, community
      participation, or integration-partner activity.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: security-compliance
    missingEvidence: >-
      Current official security, privacy, status, and compliance artifacts that directly substantiate SLA, SOC 2, GDPR,
      and incident-handling claims.
    whyItMatters: >-
      Underwriting should not rely on third-party summaries for core trust and compliance assertions on a managed web
      platform.
    diligencePath: >-
      Obtain current trust-center or security documentation, status history, contractual SLA language, and any
      customer-facing audit artifacts.
    relatedQuestionRefs:
      - QE006
  - type: private-evidence-only
    severity: material
    topic: webflow-cloud-maturity
    missingEvidence: Named production references, GA timing, and workload boundaries for Webflow Cloud dynamic-app deployments.
    whyItMatters: >-
      Cloud is the main architectural expansion vector, but maturity uncertainty affects technical risk, implementation
      effort, and platform upside.
    diligencePath: >-
      Ask management for production customer references, GA roadmap, support model, performance benchmarks, and explicit
      workload limitations.
    relatedQuestionRefs:
      - QE004
      - QE007
      - QE008
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Public or management-shared NRR, GRR, churn, renewal, and contract-length data by major plan tier or segment.
    whyItMatters: Without retention data, adoption proof cannot be converted into durability or expansion confidence.
    diligencePath: Request cohort retention, renewal, and contract-length disclosures in management diligence or data-room materials.
    relatedQuestionRefs:
      - QU006
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Top-customer or top-segment concentration, channel mix, and partner contribution to new customer acquisition or
      delivery.
    whyItMatters: >-
      Customer and partner concentration could materially change the quality of Webflow's customer base and expansion
      economics.
    diligencePath: >-
      Request customer concentration, partner-sourced pipeline, and major-account revenue contribution in management
      diligence.
    relatedQuestionRefs:
      - QU010
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: >-
      A fuller named-reference set with customer quotes, deployment scope, and freshness beyond the sample available in
      the assigned pool.
    whyItMatters: >-
      The current named-customer table demonstrates real use cases but does not establish exhaustive customer proof or
      reference quality.
    diligencePath: >-
      Ask Webflow for current enterprise references and match each to deployment scope, production status, and renewal
      history.
    relatedQuestionRefs:
      - QU009
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: legal-gap
    missingEvidence: >-
      Direct regulator, court, incident-disclosure, or company trust documentation showing current litigation,
      enforcement, or security-incident posture.
