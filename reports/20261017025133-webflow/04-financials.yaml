  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue-quality
      missingEvidence: Current ARR, recognized revenue, YoY growth, and revenue mix across site plans, workspace/seat layers, Team, Enterprise, and add-ons.
      whyItMatters: Revenue quality cannot be underwritten from list pricing or third-party estimates alone; segment mix drives durability, margin, and valuation support.
      diligencePath: Request the latest board pack or monthly KPI deck with revenue bridge and segment mix, plus policy notes on recognition.
      relatedQuestionRefs: [QI003, QI007, QI008]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Gross margin, hosting/CDN cost intensity, support/service delivery cost, CAC, payback, win rate, and net revenue retention.
      whyItMatters: Webflow's enterprise packaging can create attractive ACV, but without margin and acquisition-cost data investors cannot judge operating leverage or pricing power.
      diligencePath: Request cohort-level retention and expansion data, S&M efficiency metrics, and a gross-margin walk by product line.
      relatedQuestionRefs: [QI004, QI007]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: blocking
      topic: capital-adequacy
      missingEvidence: Current unrestricted cash, monthly burn, free cash flow, debt/project-finance obligations, covenant terms, and base / downside runway.
      whyItMatters: Historical fundraising is not the same as cash available today, so next-round dependency and downside financing risk remain unknown.
      diligencePath: Request current balance sheet, cash waterfall, debt schedule, and management runway scenarios tied to hiring and infrastructure plans.
      relatedQuestionRefs: [QI005, QI008]
      relatedTableRefs: [TI003]
    - type: conflicting-data
      severity: material
      topic: financial-scale
      missingEvidence: A reconciled management view of current revenue, cumulative funding, and headcount versus third-party aggregator estimates.
      whyItMatters: Conflicting public scale datapoints weaken confidence in valuation heuristics and in any attempt to use employee count as a cost-base proxy.
      diligencePath: Ask management to reconcile public-company profiles against internal cap-table, financing, revenue, and HR system exports.
      relatedQuestionRefs: [QI003, QI007, QI008]
