    title: Product architecture map
    type: stack
    summary: Official and third-party evidence point to a layered stack from shared authoring through managed delivery and an emerging Cloud extension.
    data:
      layers:
        - label: Authoring surface
          detail: Shared visual canvas for pages, branches, locales, and components
          modules:
            - [Design tab, components, variables]
            - [Pages, branches, locales]
        - label: Content and governance
          detail: CMS, roles, and collaboration keep multiple teams in one operating model
          modules:
            - [CMS collections, dynamic content]
            - [Role-based permissions, reviewers, content editors]
        - label: Measurement and operations
          detail: Analyze, Optimize, Localize, staging, and controlled publishing sit next to content operations
          modules:
            - [Analyze, Optimize, Localize]
            - [Staging, page publish, CMS-item publish]
        - label: Managed delivery layer
          detail: Independent reviews describe globally distributed managed hosting with SSL, backups, and autoscaling
          modules:
            - [Managed hosting, CDN delivery]
            - [SSL, backups, version control]
        - label: Cloud extension
          detail: Webflow Cloud extends the platform toward dynamic applications beside the main site
          modules:
            - [Next.js and Astro support]
            - [Dynamic app experiences, APIs]
          outputs:
            - [Adjacent site-plus-app workflow]
        - label: Support and onboarding surface
          detail: Help, migration, and university content reduce deployment friction and reinforce governed product use
          modules:
            - [Help Center, migration guidance]
            - [University courses, certifications]
    approximationNotes: >-
      This is a conceptual product-layer map synthesized from assigned evidence, not a literal
      network topology or vendor-certified infrastructure blueprint.
    claimRefs: [CE001, CE004, CE005, CE007, CE008, CE013]
