  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role
      - Dependency
      - Risk
    rows:
      - ["Canvas, components, and site structure", "Visual authoring and shared design system", "Core Webflow product environment", "Customers depend on Webflow’s own editor paradigm and role model"]
      - ["CMS, collections, and permissions", "Structured publishing and governance", "Webflow CMS and site roles", "Strong fit for content operations, but creates platform concentration around content model choices"]
      - ["Apps, APIs, webhooks, and developer docs", "Integration and extension layer", "Managed platform interfaces rather than raw infrastructure", "Extensibility exists, but backend freedom is constrained relative to self-hosted stacks"]
      - ["Managed hosting, staging, and publishing", "Delivery, environments, and operations", "Webflow-managed hosting plus its publish workflow", "Public proof for exact reliability/compliance details is thinner than the marketing narrative"]
      - ["Webflow Cloud extension", "Dynamic app deployment beside the core site", "Cloudflare-edge-style runtime per third-party explainer plus official product positioning", "Newest layer carries the largest maturity and external-adoption uncertainty"]
    notes: >-
      This architecture table synthesizes official product-surface evidence with assigned
      third-party explainers; it should not be read as a vendor-certified infrastructure diagram.
    claimRefs: [CE004, CE005, CE007, CE008, CE012, CE013]
