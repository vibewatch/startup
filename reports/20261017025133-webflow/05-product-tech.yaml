  evidenceGaps:
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: Public developer-signal or practitioner-community evidence for Webflow Cloud, MCP, API, or integration usage at meaningful scale.
      whyItMatters: Without external adoption evidence, the chapter cannot judge whether the developer-facing extension is strategic traction or mostly product positioning.
      diligencePath: Request public or customer-shareable metrics on API usage, app installs, Cloud deployments, community participation, or integration-partner activity.
      relatedQuestionRefs: [QE008]
    - type: private-evidence-only
      severity: material
      topic: security-compliance
      missingEvidence: Current official security, privacy, status, and compliance artifacts that directly substantiate SLA, SOC 2, GDPR, and incident-handling claims.
      whyItMatters: Underwriting should not rely on third-party summaries for core trust and compliance assertions on a managed web platform.
      diligencePath: Obtain current trust-center or security documentation, status history, contractual SLA language, and any customer-facing audit artifacts.
      relatedQuestionRefs: [QE006]
    - type: private-evidence-only
      severity: material
      topic: webflow-cloud-maturity
      missingEvidence: Named production references, GA timing, and workload boundaries for Webflow Cloud dynamic-app deployments.
      whyItMatters: Cloud is the main architectural expansion vector, but maturity uncertainty affects technical risk, implementation effort, and platform upside.
      diligencePath: Ask management for production customer references, GA roadmap, support model, performance benchmarks, and explicit workload limitations.
      relatedQuestionRefs: [QE004, QE007, QE008]
