company:
  name: "Webflow"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Webflow's official 2026 surfaces support a broad web-experience platform story that spans visual site building, CMS, analytics, optimization, publishing, and AI-assisted workflows. Leadership is identifiable, but current scale, cap-table detail, and valuation freshness remain weakly evidenced because retained third-party databases disagree on funding, revenue, headcount, and even round chronology."
sections:
  - id: "identity-and-platform-scope"
    title: "Identity and platform scope"
    body: |-
      Webflow's official positioning has expanded well beyond a simple no-code site builder. The homepage now frames the product as an "agentic web platform for modern businesses," while the help-center and university materials describe a hosted workflow that spans visual design, structured content, optimization, publishing, and governed collaboration. That combination is important for later chapters because it anchors Webflow as a workflow and web-operations platform, not only a template-driven SMB website tool.

      Basic corporate identity is less directly documented on official pages than product scope is. The retained third-party profiles consistently place Webflow in San Francisco and describe the company as founded by Vlad Magdalin, Sergie Magdalin, and Bryant Chou, but the pool does not include a current official corporate-about page that cleanly confirms founding date, headquarters, or legal entity details. The overview is therefore stronger on what the platform does than on formally disclosed corporate identity fields.
    claimRefs: ["CO001", "CO002", "CO003", "CO004", "CO007", "CO013"]
    tableRefs: ["TO001"]
  - id: "leadership-governance-and-control"
    title: "Leadership, governance, and control"
    body: |-
      The retained pool is enough to identify the main operating leaders but not enough to fully map governance. Third-party sources place Linda Tong as CEO by 2023 and show Adrian Rosenkranz joining as Webflow's first chief revenue officer in February 2025, which suggests the company is still professionalizing go-to-market leadership as it scales enterprise adoption. Founder identity is also stable across sources even though the public evidence here is mostly secondary rather than official.

      Governance remains only partially visible. One tracker lists Laela Sturdy, Bryant Chou, and Sergie Magdalin as board members, but the pool does not include an official current board roster, a cap table, voting-control disclosure, or a clean investor-rights summary. For diligence purposes, that means stakeholder mapping can identify likely influence centers, yet ownership, board committee structure, and founder-vs-investor control still need direct company confirmation.
    claimRefs: ["CO004", "CO005", "CO006", "CO014"]
    tableRefs: ["TO002", "TO003"]
  - id: "funding-scale-and-public-metric-confidence"
    title: "Funding, scale, and public metric confidence"
    body: |-
      The most important overview takeaway is that Webflow's private-company scale is still visible only through inconsistent secondary databases. GetLatka reports $217.8 million raised and a $4 billion valuation tied to a 2021 Series B, while Taptwice reports $334.9 million raised and a March 2022 Series C at the same $4 billion valuation. Revenue and headcount are similarly inconsistent across retained trackers: one estimate points to roughly $212.5 million of 2024 revenue, another to about $200 million of ARR, and another to only $96.5 million of annual revenue with roughly 1.1 thousand employees.

      Those conflicts do not mean the company is small or stagnant; they mean the public record is not strong enough to treat any single private-company database as ground truth. Official sources do support broad adoption and enterprise ambitions, including the homepage's claim of over 300 thousand teams and product materials that emphasize cross-functional collaboration, experimentation, and AI-enabled site operations. But current revenue quality, precise customer denominators, and the freshness of the $4 billion valuation anchor remain open diligence items rather than settled facts.
    claimRefs: ["CO006", "CO007", "CO008", "CO009", "CO010", "CO015"]
  - id: "milestones-constraints-and-open-asks"
    title: "Milestones, constraints, and open asks"
    body: |-
      The milestone record is strongest on financing and product-platform development. Retained sources support a 2013 founding period, early seed backing, larger financings in 2019, 2021, and 2022, a 2023 CEO transition, 2024 acquisitions of Intellimize and GreenSock, and a 2025 go-to-market leadership hire. Official 2026 product materials then show Webflow leaning further into AI-assisted authoring, AEO/SEO tooling, and enterprise workflow controls.

      The main adverse evidence in this pool is executional rather than legal or regulatory. A retained independent review argues that Webflow still carries a real learning curve, meaningful pricing friction for multi-site users, ecommerce limitations versus Shopify, and some platform lock-in for customers who later want to migrate. That matters because current valuation and market-positioning narratives depend on whether Webflow can keep moving upmarket without eroding usability or increasing commercial friction faster than product breadth improves.
    claimRefs: ["CO005", "CO011", "CO012", "CO013", "CO015"]
    figureRefs: ["FO001"]
