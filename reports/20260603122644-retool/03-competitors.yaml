- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Platform
  - Public entry price
  - Primary billing unit
  - Deployment signal
  - Notable included capability
  - Implication
  rows:
  - - Retool
    - $10 builder or $5 internal user on Team; $50 builder or $15 internal user on Business
    - Builder, internal user, external user, workflow overage
    - Self-hosting and enterprise controls available, but external-user self-hosted deployments require custom annual plans
    - Mobile, portals, workflows, AI credits, Git-compatible source control
    - Very broad product surface, but economics become layered as usage broadens
  - - Superblocks
    - $100 per AI builder per month billed annually on Team
    - AI builder plus hosted apps; enterprise for VPC and support
    - Cloud, hybrid, and cloud-prem in AWS, GCP, Azure
    - Git-linked source control and secret-manager integrations
    - Targets enterprise control first, not bottom-up self-serve price discovery
  - - Appsmith
    - Free community; $15 per user per month Business; $2,500 per month Enterprise for 100 users
    - Per user after freemium
    - Cloud, self-hosted, air-gapped add-ons
    - Unlimited environments, Git repos, reusable packages, CI/CD
    - Attractive like-for-like OSS alternative when teams want Git and self-hosting
  - - Budibase
    - Free self-hosted OSS plus paid creator and end-user packaging
    - Creators, end users, and enterprise add-ons
    - Cloud or flexible self-hosting
    - Open-source self-hosted plan, SSO, audit logs, air-gapped deployment in enterprise
    - Strong option when data sovereignty matters and CRUD-heavy apps dominate
  - - ToolJet
    - $79 per builder per month Pro; $199 per builder per month Team
    - Builders rather than end users
    - Cloud or self-hosted across Docker, Kubernetes, and clouds
    - Unlimited end users from Team, Git sync, custom groups, modules
    - Pricing is friendlier than Retool for broad internal rollouts with many viewers or operators
  - - UI Bakery
    - $20 to $40 per developer per month on public tiers
    - Developer seats
    - Shared or dedicated deployment plus self-hosting options
    - Git version control and code export
    - Appeals when portability and readable code outweigh ecosystem breadth
  - - DronaHQ
    - $100 starter; $500 business billed annually
    - Developers, connectors, tasks, AI credits
    - Cloud-first with enterprise add-ons and data export
    - 50+ connectors and exportable customer data
    - Adjacent substitute for lighter app-builder programs
  - - Power Apps
    - Free developer plan plus premium production licensing
    - Production license plus capacity and connector decisions
    - Microsoft cloud and Dataverse admin model
    - Templates, Dataverse, premium connectors, admin-center governance
    - Best viewed as installed-base convenience rather than like-for-like open internal-tool portability
  - - Mendix
    - $75 basic entry plus per-user adders; quote-led higher tiers
    - Per app and user or enterprise quote
    - Cloud, private cloud, dedicated cloud, government cloud, server-based
    - Mission-critical tiering and multiple environments
    - Competes on governed app portfolios more than rapid team-level experimentation
  - - OutSystems
    - Custom quote-led
    - Application objects, end users, runtimes, support options
    - Cloud, hybrid, and some self-hosted plans
    - Built-in DevSecOps and deploy-anywhere posture
    - Competes where enterprise engineering control justifies opaque pricing
  notes: This table compares public list pricing and packaging signals only; negotiated discounts, large-volume concessions, and custom support bundles remain mostly private.
