  evidenceGaps:
  - type: missing-source
    severity: material
    topic: peer-funding-comparability
    missingEvidence: Current like-for-like funding, valuation, and growth disclosures for Superblocks, Appsmith, and other private peers using authoritative primary or high-tier independent sources.
    whyItMatters: Competitor profiles benefit from comparable scale signals, but public data are uneven and can otherwise overstate Retool's visibility advantage.
    diligencePath: Request management's competitive battlecards or obtain primary financing announcements and investor materials for the main private peers.
    relatedQuestionRefs:
    - QP006
  - type: private-evidence-only
    severity: material
    topic: multi-homing-and-win-loss
    missingEvidence: Customer-level evidence showing how often Retool is deployed alongside Power Apps, OSS builders, or internal code rather than as an exclusive standard.
    whyItMatters: Public product pages show credible multi-homing paths, but underwriting moat durability needs actual overlap and replacement behavior.
    diligencePath: Ask for top-50 account competitive overlap, win-loss notes, and workspace-level app migration history.
    relatedQuestionRefs:
    - QP019
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-and-discounts
    missingEvidence: Realized contract pricing, volume discounts, and concessions across Retool, Superblocks, Appsmith, and ToolJet for larger deployments.
    whyItMatters: List prices are directionally useful, but real competitive pressure and pricing power are determined by negotiated enterprise economics.
    diligencePath: Request anonymized MSAs or pricing exhibits for recent enterprise deals segmented by builder, internal-user, external-user, and viewer-heavy deployments.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP003
