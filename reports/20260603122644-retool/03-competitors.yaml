- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat or risk
  - Why it matters
  - Public evidence
  - Threat source
  - Severity
  - Diligence ask
  rows:
  - - All-in-one internal operating surface
    - Retool's breadth can reduce tool sprawl and increase standardization value
    - Public surfaces span apps, workflows, agents, portals, mobile, governance, and self-hosting
    - OSS peers or incumbents that win on one dimension only
    - Medium
    - Request internal product-level adoption by module to see whether customers truly use the full surface
  - - Operational switching cost after adoption
    - Git, spaces, environments, and governance create real migration work once embedded
    - Retool pricing and enterprise pages highlight source control, flexible workspaces, SSO, audit logs, and self-hosting
    - Migration to OSS or incumbent suites still possible
    - Medium
    - Request top-ten app inventory, dependency map, and migration complexity by workspace
  - - Open-source portability pressure
    - Appsmith, Budibase, ToolJet, and UI Bakery all market code ownership or exportability
    - Open-source licensing, self-hosting, and code export are central to rival narratives
    - Price-sensitive or sovereignty-sensitive teams
    - High
    - Measure how often code ownership is a formal deal requirement or loss reason
  - - Microsoft installed-base pressure
    - Power Apps lets buyers stay inside an existing admin and data-governance stack
    - Free developer plan, premium production licenses, Dataverse, and admin-center governance
    - Microsoft-centric enterprises
    - High
    - Split pipeline by Microsoft-heavy accounts and identify where Power Apps is the real default
  - - Enterprise ALM pressure
    - Mendix and OutSystems can look safer for mission-critical portfolios
    - Multiple runtimes, ALM, CI/CD, DevSecOps, and quote-led enterprise packaging
    - Large regulated enterprises
    - Medium
    - Compare Retool win rates by app criticality and runtime-count requirement
  - - Trust and operational surface area
    - Security incidents and mobile outages weaken claims of unqualified platform safety
    - Retool disclosed SAML and host-header issues and a multi-day mobile sign-in incident
    - Security review committees and risk-averse buyers
    - High
    - Request incident history, time-to-patch data, and share of customers on affected configurations
  - - Layered deployment economics
    - Builder plus internal-user plus external-user plus run pricing can expand quickly
    - Retool pricing layers multiple billing dimensions while ToolJet and some others emphasize builder or creator pricing
    - Broad internal rollouts and customer-facing portal deployments
    - Medium
    - Request average revenue per workspace and discounting by internal versus external-user mix
  notes: Severity reflects underwriting risk to Retool's competitive durability, not certainty of displacement.
