- id: moat-durability-and-adverse-evidence
  title: Moat durability, adverse evidence, and the underwriting conclusion
  body: The strongest argument for Retool remains breadth plus brand. Independent reporting gives it meaningful historical scale, and the enterprise surface now spans apps, workflows, agents, mobile, and governance in one stack. That combination is not trivial for a challenger to replicate quickly. Still, the moat is not absolute. Retool's own trust center documents a recent SAML-related account takeover risk and a separate self-hosted host-header issue, while the status page shows a public multi-day mobile login incident in late May 2026. Review sources and alternative guides repeatedly frame price expansion, portability, and scale complexity as reasons teams shop the category. Competitor attack pages are no longer subtle either; they explicitly target code ownership, self-hosting burden, and exportability. That evidence supports a moderate-moat conclusion. Retool can remain the default choice where buyers value a governed all-in-one operating surface, but price-sensitive, sovereignty-sensitive,
    or incumbent-aligned accounts have credible alternatives with increasingly mature product and governance stories.
