company:
  name: Retool
chapter:
  number: 3
  title: Competitors
  summary: Retool remains one of the broadest public internal-tools platforms, but the competitive set is wider than low-code lookalikes. Open-source and self-hosted builders such as Appsmith, Budibase, ToolJet, UI Bakery, and DronaHQ attack price and lock-in, while Power Apps, Mendix, and OutSystems compete from installed governance and portfolio control. The moat is real in breadth and brand, yet public evidence on pricing opacity, code ownership, and disclosed trust incidents implies moderate durability rather than winner-take-all defensibility.
sections:
- id: landscape-and-substitutes
  title: Direct peers, incumbents, substitutes, and status quo options
  body: 'Retool does not face one neat one-for-one rival. The closest direct peers are enterprise internal-tool builders such as Superblocks, Appsmith, Budibase, and ToolJet, because each lets teams connect existing databases and APIs, compose operational interfaces quickly, and add governance around internal workflows. UI Bakery and DronaHQ are adjacent substitutes that push harder on code export, portability, or lighter builder workflows. The incumbent tier is different again: Microsoft Power Apps is the default substitute inside Microsoft estates, while Mendix and OutSystems compete for higher-governance, mission-critical application portfolios. Status quo competition also comes from internal build itself. Open-source tools blur the boundary between buying a low-code product and extending an in-house engineering stack, which means buyers can solve the same job either by standardizing on Retool or by owning more of the code and infrastructure themselves. That is why Retool competes across
    three lanes at once: direct low-code peers, governance-heavy incumbents, and internal-build-plus-suite substitutes.'
