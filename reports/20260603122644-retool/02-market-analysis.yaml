company:
  name: Retool
chapter:
  number: 2
  title: Market Analysis
  summary: Retool's relevant market is the narrower enterprise internal-application and workflow layer inside the broader no-code, low-code, and AI-assisted software market. Public 2026 sizing lenses range from about USD 31.59 billion for low-code development platforms to about USD 65 billion for the broader no-code/low-code market, but the more decision-useful lens is governed internal tools, operational workflows, and data-heavy business apps bought by engineering, IT, and operations leaders. Adoption is supported by backlog relief, AI-assisted development, and business-led software creation, while governance, rewrite risk, vendor lock-in, and pricing-tier frictions make a precise Retool SAM/SOM impossible to defend from public evidence alone.
sections:
- id: market-boundary
  title: Market Boundary, Included Spend, and Status-Quo Substitutes
  body: 'Retool does not compete for every dollar labeled no-code, low-code, or AI coding. Its strongest market boundary is enterprise internal applications built on top of existing systems, with enough governance to pass security review and enough flexibility to ship data-heavy workflows quickly. Retool''s own surfaces emphasize internal software, builders, workflows, agents, permissions, and external applications rather than generic public-site creation. Independent low-code comparisons place Retool beside Power Apps, Mendix, and Appian in the enterprise-internal-tools bucket, while Appsmith, ToolJet, and Budibase show that open-source and self-hosted substitutes occupy the same job-to-be-done. That means included spend is admin panels, approval flows, ops dashboards, internal portals, and operational automations; excluded or only adjacent spend is website builders, consumer no-code products, and generalized SaaS categories that do not require governed access to enterprise data. Status-quo
    substitutes matter as much as named competitors: custom code, spreadsheets, scripts, and point SaaS are still how many teams solve these workflows, which is why Retool''s relevant market sits between classic enterprise development tools and broader horizontal application software.'
  claimRefs:
  - CM001
  - CM002
  - CM004
  - CM005
  - CM006
  - CM007
  - CM008
  - CM009
  tableRefs:
  - TM001
  figureRefs:
