- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Developer shortage and IT backlog
    - Driver
    - Current + durable
    - Makes faster internal-app delivery economically attractive to IT and platform teams
    - Request internal ROI data on hours saved versus custom-code baseline
  - - AI-assisted app generation and coding
    - Driver
    - Current
    - Lowers prototype cost and expands who can ship internal tooling
    - Measure prototype-to-production conversion and governance overhead
  - - SaaS replacement pressure in workflows and admin tools
    - Driver
    - Current + medium-term
    - Creates near-term budget openings in internal automations, dashboards, and ops tooling
    - Map which replaced SaaS categories turn into durable platform spend
  - - Business-led software creation
    - Driver / constraint
    - Current
    - Expands demand but shifts ownership beyond central engineering
    - Quantify departmental demand versus centralized enablement capacity
  - - CoE, governance, and monitoring requirements
    - Constraint
    - Current + durable
    - Large deployments need admin analytics, DLP, ownership, and support processes
    - Ask for maker-to-admin ratios, inactive-app cleanup, and policy enforcement data
  - - Vendor lock-in and rewrite risk
    - Constraint
    - Current + medium-term
    - Can cap willingness to standardize on visual platforms for core workflows
    - Request migration stories, export paths, and app-life expectancy data
  - - Security, RBAC, audit, and deployment controls
    - Constraint
    - Current
    - Raises the bar for production deployment while favoring enterprise-ready vendors
    - Ask for self-hosted share, security-review win rate, and regulated-customer mix
  - - Open-source and suite-native substitutes
    - Constraint
    - Current
    - Keeps buyers’ outside options broad and constrains pricing power
    - Request win/loss rates versus Power Apps, custom code, Appsmith, ToolJet, and Budibase
  notes: The table mixes demand-side drivers with production-readiness constraints because low-code adoption accelerates only when speed, governance, and total cost of ownership all clear the buyer’s threshold.
