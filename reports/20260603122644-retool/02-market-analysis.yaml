- id: growth-drivers-and-constraints
  title: Growth Drivers, Adoption Constraints, and Critical Gaps
  body: 'The strongest demand drivers are backlog relief, developer scarcity, AI-assisted development, and the business-side desire to replace misfitting SaaS with purpose-built workflows. Searchlab says 87% of IT leaders view low-code as a response to developer shortages, and Retool''s 2026 survey says 35% of teams have already replaced at least one SaaS tool while 78% expect to build more internal tools this year. But the same evidence also explains why adoption can stall. Forrester says distributed creation creates fragmentation and sprawl faster than governance can catch up; Digital Journal''s summary of Info-Tech warns about weak data-loss-prevention controls and unclear ownership; McKinsey says shadow IT turns risky when departments build outside architecture and compliance guardrails. Cost and durability constraints matter too. DesignRevision argues that 25-30% of no-code projects are rewritten within two years and that migration can cost USD 50k to USD 250k, while ToolJet''s enterprise-readiness
    checklist warns that vendors often gate SSO, RBAC, and audit trails behind enterprise plans. For Retool, the valuation-relevant contradiction is clear: the market tailwind is real, but durable share depends on whether governed internal-app platforms can convert shadow demand into long-lived, production-grade deployments before buyers either revert to custom code or standardize on cheaper, suite-native, or open-source substitutes.'
