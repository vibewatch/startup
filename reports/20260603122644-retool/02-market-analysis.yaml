  evidenceGaps:
  - type: missing-source
    severity: material
    topic: retool-specific-market-sizing
    missingEvidence: Retool-specific customer counts, ACV ranges, workflow mix, and revenue split across builders, internal users, and external users.
    whyItMatters: Without buyer-level revenue mix and pricing realization, a public Retool SAM or obtainable-share model would be mostly assumption rather than evidence.
    diligencePath: Ask management for customer segmentation, annual contract values, and the share of revenue tied to internal apps, workflows, agents, and external portals.
    relatedQuestionRefs:
    - QM007
    - QM026
    relatedTableRefs:
    - TM002
  - type: conflicting-data
    severity: material
    topic: market-size-methodology
    missingEvidence: Primary analyst methodology pages showing exactly which product categories sit inside each 2026 market estimate.
    whyItMatters: The published range from roughly USD 31.59B to USD 66.2B is too wide to collapse into one headline without understanding each provider’s inclusion rules.
    diligencePath: Obtain primary Gartner, Mordor Intelligence, and Business Research Company excerpts or analyst calls that define the no-code, low-code, and enterprise-application boundaries.
    relatedQuestionRefs:
    - QM006
    - QM007
    - QM025
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-mix-and-deployment-profile
    missingEvidence: Revenue share by buyer persona, department, regulated vertical, and cloud versus self-hosted deployment choice.
    whyItMatters: Those facts determine whether Retool is primarily an engineering tool, a business-systems platform, or a regulated internal-app control plane, which changes both valuation multiples and retention expectations.
    diligencePath: Request pipeline and installed-base cuts by department, self-hosted share, regulated-customer share, and upsell motion from builders to broader internal-user bases.
    relatedQuestionRefs:
    - QM009
    - QM011
    - QM018
    - QM026
    relatedTableRefs:
    - TM003
  - type: missing-source
    severity: minor
    topic: migration-and-pricing-realization
    missingEvidence: Win-loss data against Power Apps, custom code, and open-source alternatives plus real migration stories away from low-code platforms.
    whyItMatters: List pricing and category rhetoric do not show whether Retool can hold price, expand seat counts, or avoid churn when buyers reassess lock-in and total cost of ownership.
    diligencePath: Ask for renewal cohorts, displacement reasons, and proof of durable adoption after year one versus one-off prototyping or SaaS replacement projects.
    relatedQuestionRefs:
    - QM020
    - QM021
    - QM026
    relatedTableRefs:
    - TM004
