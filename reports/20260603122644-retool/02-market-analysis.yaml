callouts:
- calloutType: insight
  title: Broad low-code TAMs are real but too wide for Retool’s direct market
  body: The useful market lens is not all no-code or all enterprise applications using low-code features. It is the subset of governed internal tools, operational workflows, and data-connected business apps where buyers care about security, connectors, deployment control, and portfolio governance.
  claimRefs:
  - CM007
  - CM010
  - CM011
  - CM012
  - CM016
- calloutType: risk
  title: App sprawl and migration pain are category risks, not edge cases
  body: Shadow demand is strong, but the same forces that expand adoption also create sprawl, unclear ownership, rewrite risk, and vendor-lock-in anxiety. If Retool cannot convert fast starts into governed standards, the market can stay large while durable share stays smaller than TAM headlines imply.
  claimRefs:
  - CM033
  - CM034
  - CM040
  - CM041
  - CM042
  - CM043
- calloutType: assumption
  title: Retool’s upside depends on standardization, not just prototype velocity
  body: Public evidence supports strong demand for building more internal software, but valuation upside requires proof that buyers standardize on a governed platform over time instead of using it for one-off replacements while keeping custom code, suite-native tools, and open-source alternatives in the stack.
  claimRefs:
  - CM021
  - CM022
  - CM032
  - CM046
