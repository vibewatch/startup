  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 相关性
    rows:
      - - 受治理的内部工具和管理面板
        - 连接企业数据的内部看板、CRUD 应用、审批应用、运营控制台和业务流程前端
        - 网站构建器、静态微型网站和通用公开营销页面
        - 工程、IT、平台或运营预算付费；内部团队使用
        - Retool 的核心直接切入口，也最贴合产品定位
      - - 工作流自动化和运营应用
        - 后台工作流、人在回路自动化、告警、路由和轻量级案例管理
        - 没有应用构建的独立 BPA 套件，或没有应用层的纯 RPA 支出
        - 运营、IT、支持、财务和业务线负责人付费；构建者和运营人员使用
        - 重要的纳入支出，因为 Retool 把应用、工作流和智能体打包在一起
      - - 数据密集型看板和决策应用
        - 运营分析、数据库 GUI、调查工具和连接数据的控制面板
        - 不涉及动作层或应用工作流时的传统 BI 席位支出
        - 数据、运营和职能团队付费；分析师和操作人员使用
        - 非常适合构建在 API 和数据库之上的 Retool 式应用
      - - 外部或伙伴运营门户
        - 供应商、客户或现场门户，基于同一个受治理应用平台构建
        - 独立公开网页产品或大众消费者 SaaS
        - 企业客户付费；伙伴、供应商或客户使用
        - 相邻但相关，因为 Retool 定价明确包含外部用户
      - - 开源或自托管内部应用平台
        - 花在 Appsmith、ToolJet、Budibase 或类似自托管内部应用栈上的预算
        - 不能端到端解决应用交付的横向开发者工具
        - 平台、IT 或工程团队付费；内部构建者使用
        - 直接替代集合，会约束定价和部署选择
      - - 现状替代：定制代码、电子表格和脚本
        - 用于解决管理、工作流和运营问题的内部工程时间和影子工具
        - 与内部运营工作流无关的已购软件类别
        - 职能团队或工程团队在内部吸收成本
        - 关键替代方案，因为许多买家仍把 Retool 与自建相比
      - - 宽泛无代码网站和 MVP 构建器
        - 仅包含买方把这些工具延伸到内部工作流的少量重叠
        - 消费级无代码、落地页和 SMB 网站构建器支出
        - 非技术业务用户常常直接付费
        - 相邻市场会抬高宽 TAM 口径，但不是 Retool 的直接 SAM
    notes: 边界由构建在企业系统之上的受治理内部应用和工作流定义，而不是最宽泛的无代码标签。第五到第七行是替代或相邻视角，不是纯 平台授权支出。
