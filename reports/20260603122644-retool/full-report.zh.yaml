          detail: 支持坐席、风险操作员、CSM、门店经理或 BDR 将应用用作指挥中心
          tone: positive
        - label: 扩张循环
          detail: 更多工具、团队、工作流或 AI 智能体叠加到同一套受治理的平台上
          tone: positive
        - label: 企业级加固
          detail: SSO、权限、自托管、市场渠道和合作伙伴都纳入购买与扩张动作
          tone: risk
    approximationNotes: 旅程阶段综合了案例研究、定价文档、应用市场证据和评论中反复出现的模式，并非来自 Retool 披露的单一销售手册。
    claimRefs:
      - CU003
      - CU005
      - CU007
      - CU016
      - CU028
      - CU031
      - CU033
      - CU040
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: 客户名单和案例研究层面的公开证据很充足，但一旦标准提高到留存、集中度和无摩擦扩张，证据很快收窄。
    data:
      items:
        - label: 公开安装基数说法
          value: 10000
          detail: Retool 称获得信任的公司数量
          tone: neutral
        - label: 已审阅的具名且有结果的客户故事
          value: 10
          detail: DoorDash、Ramp、Plaid、Remitly、Orangetheory、Neo4j、Komatsu、UTMB、ClickUp、SafetyCulture 等客户
          tone: positive
        - label: 有量化工作流改进的案例
          value: 9
          detail: 已审阅样本中，除 Holland & Barrett 外均有明确指标或强运营代理指标
          tone: positive
        - label: 含外部用户或自托管细节的案例
          value: 3
          detail: Remitly、Orangetheory、AWS Marketplace 渠道
          tone: warning
        - label: 供应商层面的公开留存队列
          value: 0
          detail: 未找到 NRR、GRR 或客户数流失队列
          tone: risk
        - label: 供应商层面的集中度披露
          value: 0
          detail: 未披露头部客户 ARR 结构
          tone: risk
    approximationNotes: 该漏斗混合了供应商整体说法、已审阅案例研究数量和尽调缺口；它衡量的是证据质量，不是字面意义上的客户转化漏斗。
    claimRefs:
      - CU001
      - CU030
      - CU031
      - CU033
      - CU041
      - CU042
