      - - 企业 ALM 压力
        - 面向关键任务应用组合时，Mendix 和 OutSystems 看起来可能更稳妥
        - 多运行时、ALM、CI/CD、DevSecOps，以及以报价为主的企业打包
        - 大型受监管企业
        - 中
        - 按应用关键性和运行时数量要求比较 Retool 胜率
      - - 信任和运营暴露面
        - 安全事件和移动端中断削弱了平台绝对安全的说法
        - Retool 披露过 SAML 和 host-header 问题，以及持续多天的移动端登录事件
        - 安全审查委员会和风险厌恶型买方
        - 高
        - 索取事件历史、补丁修复耗时，以及使用受影响配置的客户占比
      - - 分层部署经济性
