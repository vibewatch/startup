      - number: '1.3'
        title: 融资历史、投资人图谱与披露边界
        blocks:
          - type: paragraph
            body: >-
              Retool 的融资历史是公司概况中最清楚的部分之一。公司在 October 2020 宣布由 Sequoia 领投的 $50 million Series B，在 December 2021 完成估值
              $1.85 billion 的 $20 million Series C， 并在 July 2022 完成估值 $3.2 billion 的 $45 million Series
              C2。这几轮反复出现同一批高信号支持者： Sequoia、John and Patrick Collison、Nat Friedman、Elad Gil、Daniel Gross 以及相关内部支持者。
              Sequoia 自己的公司页面称其在 2019 与 Retool 合作，这强化了一个长期赞助者持续加码、 而不是每轮都转向新投资团的图景。


              更细的判断是：估值比资本结构清楚。最新被广泛交叉印证的私募估值仍是 $3.2 billion， 第三方数据库也仍将 Series C2 列为最新公开交易类型。但累计融资额没有那么干净。 Sacra
              引用的累计融资大约为 $141 million，Tracxn 则引用 $165 million。两个数字方向相近， 却差到不能在没有限定说明的情况下当作单一精确值。Hsu 自己的 2021 融资文章也说明，
              Retool 有意偏好更小融资轮和更低稀释，而不是追逐头条式大融资；这是关于资本哲学的有用信号， 但不能替代股权结构表细节。


              从尽调角度看，公司像一个后期私营软件平台，投资人质量强，但控制权故事仍保留在私域。 公开证据支持融资时间线和估值标记；却不支持精确持股比例、老股交易、债务条款或董事会权利。
              也就是说，投资人图谱足以证明可信度，但没有直接公司材料，就不足以评估下行情景保护或控制权动态。
