      - number: '5.4'
        title: 路线图、生态信号、差异化与技术风险
        blocks:
          - type: paragraph
            body: >-
              Retool 当前的路线图信号主要由 AI 辅助构建和更广企业控制主导。2026 稳定版发布说明显示了具体产品动作： 智能体的 A2A 支持、多页 Assist、加固镜像、自托管组织的资源类型限制、Assist
              的基于角色访问控制， 以及多实例 Source Control 发布正式可用。公司自有发布信息流和论坛又在其上叠加了短期信号： MCP、工作流分析、跨 spaces
              的审计日志，以及新应用构建器中的保护。AppGen 发布文章把更大的战略押注明确说了出来： Retool 希望应用生成发生在同一个受治理平台里，身份、权限、集成和部署本来就在那里。

              外部信号方向偏正面，但并非无保留。Product Hunt、GitHub 部署资产、Stack Overflow 问题和活跃的产品更新论坛 都表明存在真实的实践者生态。独立评论也一致描述了核心权衡：Retool
              对连接既有业务系统的内部工具快速有效； 但随着用例增长，复杂度、浏览器性能、自托管负担、有限代码导出和应用冲突风险会更显眼。 结果是，对想要一个受治理内部应用平台的组织来说，Retool
              产品差异化明确；但技术风险是平台耦合： 一旦应用、工作流、权限和源代码控制约定深度嵌入 Retool，切换成本和运营者依赖会实质上升。
