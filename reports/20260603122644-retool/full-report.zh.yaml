      items:
        - label: 广义无代码 + 低代码市场
          value: USD 65B in 2026
          detail: Searchlab 2026 年对 Gartner 的摘要将无代码 / 低代码合并市场规模约置于 USD 65B。
        - label: 广义市场中的低代码占比
          value: USD 39B in 2026
          detail: 同一摘要暗示，低代码约占广义市场的 60%，即约 USD 39B。
        - label: 低代码开发平台
          value: USD 31.59B in 2026
          detail: CMARIX 引用 Mordor 的低代码开发平台口径，是最接近 Retool 实际品类的公开替代口径，但仍比内部工具本身更宽。
