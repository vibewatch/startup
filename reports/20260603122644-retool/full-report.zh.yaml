        - 面向只使用、不构建的启用用户，席位价格较低
        - Team 标价 $5/月；Business 标价 $15/月；企业定制
        - 经常性但 ARPU 较低；扩大账户覆盖面，平台一旦广泛嵌入就更难被替换
        - 内部用户与构建者的配比，以及查看者向更高价构建者的转化
      - - 外部用户 / 门户
        - 面向组织外客户、合作伙伴或供应商的分层定价
        - Business 计划：前 50 个免费，之后年付分层为 $8/$6/$4，月付分层为 $10/$7/$5
        - 与面向客户的采用挂钩、对用量敏感的扩张向量；上行空间不错，但不如已承诺席位可预测
        - 月活外部用户数、流失、滥用 / 欺诈控制，以及按门户用例拆分的毛利率
      - - 工作流运行次数
        - 针对自动化任务和后端流程的按执行次数变现
        - 额外运行次数每月每 5,000 次 $75
        - 健康的扩张杠杆，因为它能把既有客户内部的自动化强度变现
        - 工作流贡献的 ARR 占比、超额用量发生率，以及执行量季节性
      - - AI 积分 / 智能体小时
        - 套餐内含 AI 积分和智能体运行时长，可选购额外容量
        - 积分和免费小时数因套餐而异；可购买额外包或定制容量
        - 仍早期，但可能是高价值用量层；质量取决于模型转嫁成本，以及试验后的留存
        - 按 AI 产品拆分的贡献毛利、客户采用曲线，以及付费账户附加率
    notes: 标价公开；实际企业折扣、产品组合和毛利率未披露。
