        - 下行可能经由倍数压缩、披露缺失和疲弱的下一次价格发现事件叠加放大。
      - - 估值立场
        - 按上次披露的 $3.2B 估值偏高
        - 没有当前收入桥接，公开可比公司组合不支持支付完整溢价倍数。
      - - 最有吸引力的入场条件
        - 新一轮融资或低于上次披露估值的老股交易
        - 更低入场价，或有数据室支撑的估值再确认，都能缩小承销缺口。
      - - 上调触发项
        - 收入、利润率、留存和股权结构清晰度
        - 披露后的经营经济性桥接，可能把结论从继续研究推向观察。
      - - 立即否决信号
        - 折价或结构化条款很重的新融资
        - 这会说明旧账面估值夸大了普通股价值。
    notes: 判断表综合公开估值历史、当前公开可比公司和未解决尽调缺口；不是管理层指引。
    claimRefs:
      - CV001
      - CV003
      - CV037
      - CV041
      - CV046
      - CV050
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 立场
      - 证据
      - 为何重要
      - 什么会改变判断
    rows:
      - - 投资逻辑
        - Retool 横跨内部应用、工作流和 AI 智能体，拥有多个变现杠杆。
        - 更宽的产品面可以支撑溢价估值，前提是附加率和扩张经济性足够强。
        - 展示应用、工作流和智能体之间的细分组合、附加率和净留存。
      - - 投资逻辑
        - 官方客户案例提到开发周期快 10x、效率提升 65%，工作流耗时大幅压缩。
        - 大额 ROI 主张意味着，平台一旦嵌入运营，买方可能扩大使用。
        - 用留存、席位扩张和毛利率质量指标交叉验证。
      - - 投资逻辑
        - 企业控制、自托管和治理功能让 Retool 对受监管或安全敏感客户具有战略价值。
        - 如果客户在平台上标准化，这些功能可以支撑更高 ACV 和更低流失。
        - 拿出企业控制能转化为更大或更持久合同的证据。
      - - 反向逻辑
        - 最新公开估值标记仍是 2022 年 7 月 $3.2B 融资。
        - 陈旧标记看起来让人安心，却几乎不能告诉投资人当前清算价格。
        - 提供新的融资、老股交易，或支持旧估值的经审计财务桥接。
      - - 反向逻辑
        - 公开来源未披露当前 ARR、收入、毛利率或 NRR。
        - 没有分母，任何基于公开倍数的承销都无法精确。
        - 开放数据室，提供当前经营指标和队列行为。
      - - 反向逻辑
        - 独立评论指出速度慢、定价摩擦、定制限制和规模复杂度。
        - 这些摩擦可能封顶扩张，或迫使买方在更大规模时给平台打折。
        - 展示企业续约质量、使用扩张，以及更低的事故或支持摩擦。
    notes: 每一行都把正向战略叙事与具体证据缺口或反证信号配对；这些因素让结论仍低于买入。
    claimRefs:
      - CV014
      - CV015
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
      - CV024
      - CV025
      - CV026
      - CV027
      - CV028
      - CV041
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 指示性估值区间（USD bn）
      - 概率信号
      - 核心假设
      - 相对 $3.2B 的回报逻辑
      - 下行 / 确认触发项
    rows:
      - - 乐观
        - 3.8-5.0
        - 需要多个正向证据，不只是旧私募估值标记
        - Retool 披露收入质量、留存和利润率；应用 / 工作流 / 智能体在企业规模上变现；评论中的摩擦保持可控。
        - 相对上次披露估值，稀释前大约有 19%-56% 上行。
        - 新的价格发现等于或高于旧估值，且指标披露清晰，即可确认。
      - - 基准
        - 2.4-3.2
        - 最符合当前公开证据
        - 产品价值仍然真实，但公开财务披露仍薄，且没有新一轮融资明确向上重估公司。
        - 相对旧估值几乎没有上行；投资人主要靠期权性，而不是当前证据获得回报。
        - 若公司继续增长但仍无法提供干净收入桥接，则确认。
      - - 悲观
        - 1.2-2.0
        - 由严苛价格发现或加剧的规模摩擦触发
        - 下一轮融资或老股交易低于 2022 年估值，或公开市场和私有市场软件倍数持续压缩，而 Retool 仍缺披露。
        - 相对上次披露估值，在任何优先权分配瀑布前，潜在下行 38%-63%。
        - 由折价轮、结构化条款很重的融资，或规模摩擦限制变现的明确证据确认。
    notes: 情景区间是分析师估计，锚定陈旧的 2022 年融资、2026 年公开可比公司离散度和当前财务披露缺失；不是管理层目标。
    claimRefs:
