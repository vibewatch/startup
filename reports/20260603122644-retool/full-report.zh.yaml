      - number: '5.2'
        title: 架构、部署与集成模式
        blocks:
          - type: paragraph
            body: >-
              Retool 的公开架构叙事在自托管上异常明确，在云端上则相对高层。安全实践页面称 Retool Cloud 运行在多租户 AWS 服务上，自托管文档则把世界分成 Retool 托管和自管两种单租户部署。在
              Retool 托管模式下， 客户保留 VPC、密钥、访问和网络基础设施的所有权，Retool 通过窄范围 Runner VM 以及 Secrets Manager、 EKS、RDS 等 AWS
              原生服务来运营。在自管模式下，文档更深入，列出了实际服务拓扑：
              api、jobs-runner、workflows-worker、workflows-backend、agent-worker、agent-eval-worker 和 code-executor 容器，并带有基于
              nsjail 的沙箱和明确扩展指南。

              这套架构让 Retool 很强，也暴露了它的依赖。工作流执行依赖 Temporal worker 和代码执行服务， 托管部署高度依赖 AWS 基础组件，真正的企业源代码控制则依赖一个专用 GitHub 仓库，
              以及一个拥有 contents 和 pull requests 写权限的 GitHub App。GitHub 资源文档还展示了 outbound-region 和 allowlist
              要求，这意味着即便在低代码产品中，网络和数据源可达性仍是运营问题。公开 GitHub 仓库、 官方 Helm 资产和自定义组件指南确认，Retool 支持严肃的运营者和开发者扩展；但它们也强化了一个判断：
              买方采用的是一个平台，而不是轻量前端小组件。
