      - number: '2.2'
        title: 受证据约束的 TAM、SAM 与公开市场视角
        blocks:
          - type: paragraph
            body: >-
              公开规模测算有方向价值，但不能直接换算成 Retool 的 TAM。最宽的 2026 口径把无代码/低代码合并市场约为 USD 65 billion，其中约 USD 39 billion
              归因于低代码。更窄的低代码开发平台估算降到 2026 约 USD 31.59 billion；另一个来源因类别定义和预测基准不同，将市场放到 USD 66.2 billion。
              采用率口径同样很大：Searchlab 引用 70% 新应用会在 2026 使用无代码/低代码，ToolJet 则引用 Gartner 对新企业应用的 75% 预测。正确结论不是平均这些数字，而是保留矛盾：
              宽口径市场标题包含 Retool 不能完全拥有的类别；更窄的低代码平台估算，也仍包含比受治理内部工具和工作流应用更广的软件。
              公开证据支持“市场大且增长”的判断，但在披露客户组合、ACV、部署模式和扩张率之前，不能给 Retool 算出干净的 SAM 或 SOM。
