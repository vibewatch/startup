      - number: '7.4'
        title: 客户、集中度和商业模式风险
        blocks:
          - type: paragraph
            body: >-
              Retool 确有客户证据，但同一组证据也说明为什么客户和模式风险仍要留在台面上。平台被 Brex、Plaid、DoorDash、UTMB 等大型且运营重要的账户使用，Retool
              发布的成果也很强：更快的构建周期、更快的支持响应，以及快速上线的受监管 AI 工作流。Retool 还直接面向金融服务场景营销，例如承保、KYC
              和风控运营。这强化了一个判断：它不只是原型工具。但这也意味着，故障、权限错误或账户接管事件，可能打到受监管决策或收入运营绑定的工作流。


              公开证据更难支撑商业模式承销。定价把构建者
              和内部用户分开，把许多治理功能放在更高档，外部用户经济性则保持定制。外部评价认为，席位模式在规模扩大后更痛，复杂应用也可能变慢或在运营上变得别扭。公开证据在投资人最需要清楚的地方也很薄：保留下来的来源集没有披露
              2026 年 ARR、毛利率、现金消耗、NRR 或客户集中度。最后一个头条估值证据来自 2022 年。这并不说明 Retool
              是坏生意，但意味着在尽调拿到队列数据和当前经济数据之前，下行情景必须假设续约、定价和集中度存在显著不确定性。
