  - id: TP003
    title: 定价 / 包装对比
    columns:
      - 平台
      - 公开入门价格
      - 主要计费单位
      - 部署信号
      - 值得注意的内置能力
      - 含义
    rows:
      - - Retool
        - Team 版 $10 / 搭建者或 $5 / 内部用户；Business 版 $50 / 搭建者或 $15 / 内部用户
        - 搭建者、内部用户、外部用户、工作流超额用量
        - 可自托管并提供企业控制，但外部用户的自托管部署需要定制年度套餐
        - 移动端、门户、工作流、AI 额度、兼容 Git 的源代码控制
        - 产品面非常宽，但使用范围扩大后，经济性会层层叠加
      - - Superblocks
        - Team 版按年计费，每名 AI 搭建者每月 $100
        - AI 搭建者加托管应用；VPC 和支持走企业版
        - AWS、GCP、Azure 上的云端、混合和云端-本地部署
        - Git 关联的源代码控制和密钥管理器集成
        - 优先打企业控制诉求，而不是自下而上的自助价格发现
      - - Appsmith
        - Community 免费；Business 每用户每月 $15；Enterprise 100 用户每月 $2,500
        - 免费增值后按用户计费
        - 云端、自托管、隔离网络附加项
        - 无限环境、Git 仓库、可复用包、CI/CD
        - 团队想要 Git 和自托管时，这是有吸引力的同类 OSS 替代品
      - - Budibase
        - 免费自托管 OSS，加付费创建者和终端用户套餐
        - 创建者、终端用户和企业附加项
        - 云端或灵活自托管
        - 开源自托管套餐、SSO、审计日志、企业版隔离网络部署
        - 数据主权重要且应用以 CRUD 为主时，是强选项
      - - ToolJet
        - Pro 版每名搭建者每月 $79；Team 版每名搭建者每月 $199
        - 按搭建者而非终端用户计费
        - 云端或通过 Docker、Kubernetes、云平台自托管
        - Team 版起无限终端用户、Git 同步、自定义群组、模块
        - 面向大量查看者或操作员的广泛内部铺开，定价比 Retool 更友好
      - - UI Bakery
        - 公开套餐每名开发者每月 $20 到 $40
        - 开发者席位
        - 共享或专属部署，加自托管选项
        - Git 版本控制和代码导出
        - 当可移植性和可读代码比生态广度更重要时有吸引力
      - - DronaHQ
        - Starter 版 $100；Business 版年付 $500
        - 开发者、连接器、任务、AI 额度
        - 云优先，叠加企业附加项和数据导出
        - 50+ 个连接器和可导出的客户数据
        - 轻量应用构建器项目的相邻替代品
      - - Power Apps
        - 免费开发者计划，加高级生产许可
        - 生产许可，加容量和连接器决策
        - Microsoft 云和 Dataverse 管理模型
        - 模板、Dataverse、高级连接器、管理中心治理
        - 更适合看作既有安装基础的便利选项，而不是可一对一迁移的开放内部工具平台
      - - Mendix
        - 基础入门 $75，另按用户加价；更高层级以报价为主
        - 按应用和用户计费，或企业报价
        - 云、私有云、专用云、政府云、服务器部署
        - 面向关键任务的分层和多环境
        - 竞争重点更偏治理型应用组合，而不是团队级快速试验
      - - OutSystems
        - 定制报价为主
        - 应用对象、终端用户、运行时、支持选项
        - 云、混合部署，以及部分自托管方案
        - 内置 DevSecOps，定位为可部署到任意环境
        - 在企业工程控制足以支撑不透明定价的场景竞争
    notes: 本表只比较公开标价和打包信号；议价折扣、大批量让利和定制支持包大多仍属私密信息。
