      - number: '6.2'
        title: 具名客户证明真实，且常有丰富成果，但主要仍由供应商撰写
        blocks:
          - type: paragraph
            body: >-
              最强的公开证明来自带有具体工作流成果的具名账户，而不只是 logo 页面。DoorDash 记录了一个成熟运营部署， 拥有 40+ 工具，并把构建时间从数月缩短到数分钟。Ramp 在风险和产品运营中深度使用
              Retool， 称不到一年构建了 100+ 工具并节省了数百万。Plaid 将 Retool 与可衡量的 80% 工单解决提升联系起来； Remitly 则给出少见且有用的部署细节，描述了在自有 VPC 和
              Kubernetes 环境中的自托管。 Orangetheory 的故事价值也高，因为它展示的是面向外部加盟商的应用，而不只是内部看板。


              更新的 2026 案例研究也重要，因为它们表明 Retool 正卖进 AI 时代预算，而不只是旧式低代码实验。 ClickUp、SafetyCulture、UTMB 和 Komatsu
              都描述了与可衡量吞吐、转化或成本成果绑定的生产或近生产用途。 同时，质量门槛仍要守住：几乎所有这些证明仍发布在 Retool 自己的网站上，再由 Cuspera 或 FeaturedCustomers
              等聚合平台回声放大。这足以证明真实采用和具名部署深度，但不足以把每个 logo 变成独立留存证明。 正确读法是“可信的生产参考样本”，而不是“完全独立交叉印证的客户基础”。
