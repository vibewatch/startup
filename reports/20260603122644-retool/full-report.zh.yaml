  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览和剩余风险排序
        blocks:
          - type: paragraph
            body: >-
              Retool 最高的剩余风险不是简单的低代码品类风险，而是特权平台风险。产品明确让客户连接敏感数据库和 API、运行代码和 AI
              动作，并让更广泛的构建者在集中治理下交付应用。这个能力很强，但也意味着一旦控制失效，问题会很快从一个供应商扩散到客户自己的运营系统。2023 年云账户接管事件、近期 SAML 和自托管漏洞披露，以及清晰可见的
              2026 年故障流，都说明下行风险并非假设。


              下一层是依赖和可靠性风险。Retool 的云姿态依赖 AWS 和 Cloudflare；自托管工作流编排在某些模式下仍可能依赖 Retool 托管的 Temporal；AI
              功能依赖第三方模型或搜索供应商。公开故障追踪器显示，核心云可用性、边缘分发、许可和第三方连接器都发生过真实事故。商业侧不如安全侧急迫，但仍然重要：定价把许多控制功能放进更高档，外部评价提到性能和席位成本摩擦，公开材料也没有披露集中度、留存或当前
              2026 年经济数据。最后，执行风险仍可见，因为 Retool 仍在招聘应用安全、可观测性、治理和技术客户体验管理岗位，同时 AppGen
              正把构建者基数扩到传统工程师之外。下面的热力图和传导图按剩余严重性而非标题熟悉度，对这些暴露排序。
