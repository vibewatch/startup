        blocks:
          - type: paragraph
            body: >-
              Retool 的公开故事有吸引力：企业采用面广、定价清楚、客户 ROI 案例强，并且有一条从内部工具扩张到外部应用、 工作流和 AI 智能体的合理路径。Sacra 的 October 2025 ARR 估计为
              $120 million，说明规模真实存在。 但下行证据也重要。BleepingComputer 报道称，在 2023 Okta-linked 事件中，27 个 Retool 云客户账户被攻破，
              即便本地部署客户未受影响。评论来源也提醒，产品价值不能消除性能风险；Capterra 用户提到速度慢、 看板可靠性问题和工作流限制。对于一家变现关键任务运营软件的公司，信任和性能是收入质量变量，而不只是产品问题。


              更大的问题是信息不透明。没有经审计报表，没有披露毛利率，没有公布烧钱速度或现金跑道，没有留存或流失指标， 也没有公开调和席位收入与新使用量型 AI、工作流产品之间的关系。公开融资数据库对累计融资额意见不一。
              员工数代理指标差异很大。二级市场报道存在，但公开页面没有暴露足够数据来判断融资压力。因此，判断不是 Retool 没有可行收入模式；
              而是公开证据足以支持乐观商业叙事，却不足以在没有私有数据室的情况下评估收入质量、利润率耐久性或资本充足性。
