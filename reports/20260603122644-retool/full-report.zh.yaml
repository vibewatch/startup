      - - Superblocks
        - 直接企业级同侪
        - 首页展示 Snowflake 和 Databricks 客户证明；企业销售以报价驱动
        - IT、平台工程和受治理的业务搭建者
        - AI 辅助内部应用、集成、托管应用、混合和云端-本地部署
        - 用 Git、密钥和 VPC 部署打消企业控制顾虑
        - 入门路径透明度较低，广泛自助采用的公开证据也更少
      - - Appsmith
        - 开源直接同侪
        - 以开源旗舰产品为核心，叠加企业包装和基于 Git 的 CI/CD 定位
        - 从初创公司到企业的开发者主导内部应用团队
        - 内部应用、数据工具、工作流、可复用包、嵌入
        - 提供类似 Retool 的构建器，同时代码层透明度和自托管灵活性更高
        - 在移动端、门户和工作流上的一体化界面广度，公开证据不如 Retool
      - - Budibase
        - 开源直接同侪
        - 开源仓库和自托管姿态；首页列举政府和企业客户
        - 以 CRUD 为主的内部应用和运营团队
        - 应用、自动化、智能体、内置数据库、自托管运维
        - 靠 OSS 经济性拿下主权敏感场景和小团队工作流
        - 公开产品面最强的是运营和 CRUD，不是广泛的门户或移动端能力
      - - ToolJet
        - 开源直接同侪
        - 据称拥有 36,558 个 GitHub 星标和 1,000+ 家公司
        - 工程团队，以及搭建者 / 开发者混合团队
        - 内部应用、工作流、AI 应用构建器、内置数据库、插件
        - 把 OSS 可移植性、企业安全和按搭建者计费的经济性揉在一起
        - 对任务关键型、老牌厂商式 ALM 深度的公开证据较少
      - - UI Bakery
        - 相邻的可移植性主导替代品
        - 据称跨仓库有 55,000+ 个星标，并主打代码导出
        - 想快速搭内部应用、又不放弃代码所有权的团队
        - 内部应用、自动化、Git 版本控制、代码导出、自托管
        - 靠可移植性和可读的 React 导出竞争
        - 公开品牌声量小于 Retool，可见企业部署主张也更少
      - - DronaHQ
        - 相邻构建器替代品
        - 按搭建者计费的套餐和广泛连接器目录
        - 需要员工门户或运营应用的开发者、IT 专业人员和业务团队
        - 内部工具、移动和 Web 应用、连接器、自动化、AI 额度
        - 靠更轻包装和连接器驱动的快速应用构建竞争
        - 公开规模和治理证明弱于顶级企业同侪
      - - Microsoft Power Apps
        - 拥有既有装机基础的老牌厂商，也是维持现状的替代方案
        - Microsoft 管理、Dataverse 和模板生态
        - 以 Microsoft 为中心的企业和公民开发者计划
        - 画布和模型驱动应用、模板、连接器、Dataverse 治理
        - 把现有 Microsoft 资产转成内部应用平台
        - 更偏 Microsoft 生态，对工程式定制内部工具的聚焦较弱
      - - Mendix
        - 企业 ALM 老牌厂商
        - 任务关键型分层，加上政府版、服务器部署等多种部署选项
        - 拥有业务应用组合的大型企业
        - 低代码应用平台、云端或私有部署、生命周期工具
        - 在应用组合治理和运行时控制比试用速度更重要的场景取胜
        - 对只想快速做一个内部工具的团队，自助感更弱、体感更慢
      - - OutSystems
        - 企业 ALM 老牌厂商
        - 报价驱动的企业定价，内置 DevSecOps，并可选择自托管
        - 构建企业级应用的 IT 和数字化转型团队
        - AI 开发平台、CI/CD、任意部署、运行时管理
        - 靠企业工程控制和任务关键型交付取胜
        - 定价透明度远低于 Retool，流程也往往更重
    notes: 规模单元格采用公开证据能支撑的最强信号，而不是硬塞同侪并不持续披露的收入或融资数字。
