        title: 销售效率代理指标与需求信号
        blocks:
          - type: paragraph
            body: >-
              Retool 不披露 CAC、回本周期、销售周期长度或净收入留存，所以本章只能依赖间接代理指标。 这些代理指标仍有意义。Retool 官网称平台受到 10,000+ 个团队信任；TechCrunch 报道称，
              截至 2022 融资轮，平台上已构建超过 500,000 个应用并处理数十亿次查询。招聘文案称平台已经自动化超过 100 million
              小时工作。合在一起，这些信号暗示安装基础很大、生产使用有意义，即便公司不公布队列或美元留存。


              客户证据是更强的 GTM 信号。DoorDash 称 Retool 将内部工具构建时间从一到两个月降到 30 到 60 分钟， 现在支持 40+ 个运营工具。Plaid 称工单解决时间提升 80%。Brex
              称一个通知工作流少用了 75% 代码； Ramp 称自己在不到一年内构建了 100+ 个内部工具，并把大约 $8 million 公司节省和 10-20% 运营效率提升归因于 Retool。 这些不是 CAC
              或回本指标，但它们说明了产品驱动或开发者驱动的扩张动作为什么能成立： 一旦团队在一个工作流上证明 ROI，平台就会扩散到支持、运营、风险、财务和工程。
