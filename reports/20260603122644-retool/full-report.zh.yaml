      - number: '5.3'
        title: 信任、隐私、可靠性与合规姿态
        blocks:
          - type: paragraph
            body: >-
              Retool 的信任姿态在解释客户数据如何流动、围绕这些流动有哪些控制时最强。安全和信任材料称， Retool Cloud 是多租户的，会加密传输中和静态数据，保留审计日志，支持远程禁用用户和全团队 2FA，
              并每晚备份、保留 7 天，同时每 90 天做灾难恢复测试。隐私和信任页面又补了一层重要产品细节： 当客户连接自己的数据库或第三方数据资源时，Retool 通常代理查询，而不是存储底层客户数据；Retool
              Database 以及可选查询或工作流缓存，是公开材料中 Retool 自己存储数据的主要情形。法律材料还显示了明确的分包处理方计划， 并说明 Google Workspace API 数据不会被保留用于训练通用
              AI 或 ML 模型。

              限制因素不是缺少控制，而是可靠性和合同透明度。公开状态证据显示，late-May 2026 的移动端登录事件由会话验证变更触发；
              第三方状态聚合器又补充了证据：中断和降级足够反复，值得作为运营类别跟踪。IncidentHub 关于自托管许可服务 的说明尤其有用，因为它表明即便客户托管的设置，也可能依赖 Retool 管理的编排组件。
              对尽调来说，Retool 的信任故事足以支撑企业软件采购，但买方仍需要私下尽调正常运行时间承诺、 区域故障切换行为，以及托管 Temporal 和其他共享服务周围的精确支持边界。
