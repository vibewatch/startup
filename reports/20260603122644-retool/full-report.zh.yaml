  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流
      - Retool 方案
      - 可量化收益
      - 限制
    rows:
      - - 基于现有系统构建内部应用
        - 连接数据库和 API，拼出表单 / 表格，加入自定义逻辑
        - 由组件、查询和 JS/Python/SQL 组成的经典应用
        - 官方客户案例称，企业部署中周期快 10 倍、效率提升 65%
        - 公开证据更能证明速度，对长期可维护性指标支撑较弱
      - - 自动化重复性后台流程
        - 定时调度任务，或由事件和 webhook 触发
        - 由查询块、转换和异步逻辑组成的 Workflows
        - 同一资源层既能支撑 UI，也能支撑自动化路径
        - 公开材料未披露吞吐量和重试行为基准
      - - 编排半自主业务流程
        - 合并业务规则、模型调用和审批
        - Agents 混合确定性代码、LLM、人和动作步骤
        - Retool 可把 AI 工作流生成和执行留在受治理的企业平台内
        - Agents 的公开用量限制、模型策略和审计粒度仍部分不透明
      - - 标准化大团队变更管理
        - 开发者需要可审查的应用变更，而不是临时编辑
        - 由 GitHub 支撑的 Source Control，支持 PR 工作流和多实例发布
        - 变更历史可沿用团队已有的企业仓库规范来审查
        - 高并发编辑下的评审和合并体验，公开材料量化不足
      - - 在受监管或基础设施受控环境中部署
        - 买方需要客户自有网络边界或自管技术栈
        - Retool 托管的客户 VPC，或完全自管的 Kubernetes / Docker 部署
        - 保住数据和密钥所有权，同时保留低代码生产力
        - 自管运维仍需要扎实的平台和升级经验
      - - 用自定义 UI 或包代码扩展平台
        - 团队需要内置组件之外的 UI 原语
        - 用 React、npm 包和沙箱 iframe 接口构建自定义组件
        - 公开指南支持本地开发、热重载，以及 CDN 或内联生产路径
        - 扩展仍发生在 Retool 运行时边界内，而不是导出为独立代码
    notes: 收益来自公开客户故事和产品材料；它们只能说明方向性价值，不应当作覆盖所有部署的审计基准。
