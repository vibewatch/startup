  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 安全和依赖风险排在最高，因为 Retool 承载有权限的内部工作流，近期公开证据也显示控制失效和服务事故反复出现。
    data:
      columns:
        - 概率
        - 影响
        - 缓释成熟度
        - 剩余严重度
      rows:
        - label: 特权平台被攻破
          values:
            - label: 中
              tone: warning
              detail: 平台已在 2023 年遭遇一次重大的云客户接管事件，且仍披露与认证有关的漏洞。
            - label: 严重
              tone: negative
              detail: 攻破后触达的可能是内部支持、管理员或受监管工作流，而不是狭窄的 SaaS 功能边界。
            - label: 中
              tone: warning
              detail: Retool 发布 SOC 2 材料、漏洞处理、日志和事件流程，但攻击面仍带有高权限。
            - label: 高
              tone: negative
              detail: 在尽调证明管理员控制已加固、自托管补丁习惯足够强之前，剩余暴露仍高。
        - label: 依赖引发的宕机
          values:
            - label: 高
              tone: negative
              detail: 公开追踪器显示 2026 年有一组有意义的事故，历史宕机记录也更长。
            - label: 高
              tone: negative
              detail: 停机可能阻断内部运营、自托管工作流执行器，或客户视为生产系统的连接器。
            - label: 中
              tone: warning
              detail: Retool 记录了值班覆盖、灾备和可观测性招聘，但公开 MTTR 与服务抵扣数据很薄。
            - label: 高
              tone: negative
              detail: 在宕机率和依赖治理明确改善之前，剩余严重度仍高。
        - label: 共同隐私与监管负担
          values:
            - label: 中
              tone: warning
              detail: 法律文件清楚说明，客户仍是控制者，必须自行负责受监管用例的合规。
            - label: 高
              tone: negative
              detail: 数据处理或请求失败可能外溢到承保、KYC、医疗等敏感工作流。
            - label: 中
              tone: warning
              detail: DPA、SCC、请求政策和子处理方控制已经存在，但公开证据无法完成登记层面的验证。
            - label: 中高
              tone: warning
              detail: 只有配上客户特定控制和合同尽调，剩余暴露才可管理。
        - label: 商业模式和续约摩擦
          values:
            - label: 中高
              tone: warning
              detail: 定价和评论都指向成本敏感性；一旦部署越过小型构建者群体，问题会显现。
            - label: 中高
              tone: warning
              detail: 如果席位摩擦或性能投诉叠加，续约质量和利润率可能走弱。
            - label: 中低
              tone: warning
              detail: 公开材料缺少当前 NRR、队列留存或定价兑现数据。
            - label: 中高
              tone: warning
              detail: 在管理层提供当前留存和单位经济证据之前，剩余风险仍偏高。
        - label: 治理和支持中的执行债
          values:
            - label: 中高
              tone: warning
              detail: 当前岗位显示，随着 AppGen 扩大构建者基数，Retool 仍在补齐关键控制和客户执行职能。
            - label: 高
              tone: warning
              detail: 如果治理、可观测性或技术客户体验能力落后于增长，事故和续约都会受损。
            - label: 中
              tone: warning
              detail: 公司正在直接投入，但当前公开证据还不能说明这些缺口已经补上。
            - label: 中高
              tone: warning
              detail: 在执行证据追上市场定位之前，剩余风险仍有实质分量。
    approximationNotes: 概率、影响、缓释成熟度和剩余严重度都是锚定引用公开证据的序位判断，不是建模得出的精算概率。
    claimRefs:
      - CR006
      - CR009
      - CR021
      - CR023
      - CR031
      - CR045
      - CR050
      - CR051
      - CR052
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 主要下行链条从特权访问和依赖失效出发，传导到客户停机、信任流失、续约走弱和估值压力。
    data:
      nodes:
        - id: builder-expansion
          label: 更广的构建者基数
          detail: AppGen 把创建者扩展到传统工程师之外。
          tone: warning
        - id: privileged-access
          label: 特权数据和代码访问
          detail: 应用、工作流和智能体可能触达敏感系统并执行代码。
          tone: negative
        - id: control-gap
          label: 治理 / 控制缺口
          detail: 政策、AppSec 和可观测性工作仍在扩张。
          tone: warning
        - id: security-event
          label: 安全事件
          detail: 泄露或认证层漏洞影响客户环境。
          tone: negative
        - id: dependency-failure
          label: 依赖故障
          detail: AWS、Cloudflare、Temporal、连接器或模型提供商故障中断服务。
          tone: negative
        - id: customer-ops
          label: 客户运营受扰
          detail: 支持、财务、医疗或物流工作流停止或降级。
          tone: negative
        - id: trust
          label: 客户信任流失
          detail: 事故会降低客户扩大高风险用例的意愿。
          tone: negative
        - id: renewals
          label: 续约和扩张压力
          detail: 定价审视和信心下降会压缩增购与留存。
          tone: warning
        - id: valuation
          label: 估值下行
          detail: 当前经济数据不透明，一旦续约走弱，下行会更陡。
          tone: negative
      edges:
        - from: builder-expansion
          to: privileged-access
          label: 更多应用和智能体触达实时系统
          tone: warning
        - from: privileged-access
          to: control-gap
          label: 抬高治理负担
          tone: warning
        - from: control-gap
          to: security-event
          label: 加固速度过慢
          tone: negative
        - from: dependency-failure
          to: customer-ops
          label: 打断内部工具和工作流
          tone: negative
        - from: security-event
          to: customer-ops
          label: 攻破特权工作流
          tone: negative
        - from: customer-ops
          to: trust
          label: 损害对平台关键用途的信心
          tone: negative
        - from: trust
          to: renewals
          label: 放慢扩张并提高审视强度
          tone: negative
        - from: renewals
          to: valuation
          label: 削弱倍数支撑
          tone: negative
        - from: dependency-failure
          to: valuation
          label: 增加可靠性折价
          tone: warning
    claimRefs:
      - CR003
      - CR006
      - CR019
      - CR020
      - CR023
      - CR031
      - CR034
      - CR036
      - CR037
      - CR050
      - CR052
      - CR053
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: Retool 架在少数基础设施、身份、编排、AI 和连接器依赖之上，其中任何一个都可能中断客户工作流。
    data:
      nodes:
        - id: aws
          label: AWS
          detail: 托管多租户云服务和工作流缓存。
          tone: warning
        - id: cloudflare
          label: Cloudflare / 边缘分发
          detail: 保护并交付流量，但也曾牵涉边缘访问事件。
          tone: warning
        - id: temporal
          label: Temporal
          detail: 面向自托管工作流的可选 Retool 托管编排层。
          tone: warning
        - id: ai-providers
          label: 模型和 AI 提供商
          detail: OpenAI、Anthropic、Baseten、Tavily 和 ClickHouse 支持 AI 功能。
          tone: warning
        - id: connectors
          label: 第三方连接器
          detail: Google Sheets、MotherDuck 以及大量 API 嵌入客户工作流。
          tone: warning
        - id: saml
          label: SAML 和 IdP 层
          detail: 企业身份能力很强，但存在认证漏洞时，也可能成为接管路径。
          tone: negative
        - id: customers
          label: 客户运营
          detail: 支持、财务、医疗和物流团队依赖由此产生的应用和工作流。
          tone: negative
      edges:
        - from: aws
          to: customers
          label: 云可用性和存储支撑生产使用
          tone: warning
        - from: cloudflare
          to: customers
          label: 边缘交付影响应用能否加载
          tone: warning
        - from: temporal
          to: customers
          label: 编排可能卡住自托管工作流执行
          tone: warning
        - from: ai-providers
          to: customers
          label: AI 功能依赖外部模型和日志服务
          tone: warning
        - from: connectors
          to: customers
          label: 工作流价值取决于外部系统保持可达
          tone: warning
        - from: saml
          to: customers
          label: 身份层可能打开全组织范围的攻破路径
          tone: negative
        - from: aws
          to: ai-providers
          label: 共享基础设施集中度会叠加故障
          tone: warning
    claimRefs:
      - CR019
      - CR020
      - CR021
      - CR031
      - CR033
      - CR034
      - CR044
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 决策从产品宽度和证据出发，但必须穿过过时估值背景和披露缺口，最终落到继续研究的立场。
    data:
      nodes:
        - id: mark
          label: 最近披露估值：$3.2B（2022）
          detail: 有用的历史锚点，但不是实时价格发现事件。
        - id: proof
          label: 产品和客户证据
          detail: 应用、工作流、智能体、ROI 说法和大客户引用支撑其相关性。
        - id: friction
          label: 规模和定价摩擦
          detail: 评论提示速度慢、定价僵硬、定制受限和规模复杂度。
        - id: disclosure
          label: 无公开收入桥
          detail: 公开来源仍未披露 ARR、收入、毛利率或 NRR。
        - id: decision
          label: 继续研究 / 估值偏满
          detail: 承销旧估值前，需要更新的价格发现或达到尽调标准的指标。
      edges:
        - from: mark
          to: decision
          label: 锚定
        - from: proof
          to: decision
          label: 支撑
        - from: friction
          to: decision
          label: 约束
        - from: disclosure
          to: decision
          label: 限制
        - from: proof
          to: disclosure
          label: 仍需指标
    approximationNotes: 这条流表达的是因果逻辑，而不是概率权重。
    claimRefs:
      - CV001
      - CV017
      - CV024
      - CV029
      - CV041
      - CV046
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 最强的正向驱动是真正升级披露；最大的负面因素则是经济数据缺失和倍数压缩。
    data:
      items:
        - label: 应用 + 工作流 + 智能体宽度
          value: 2.5
          detail: 如果变现质量得到证明，可支撑平台溢价叙事。
        - label: 企业证据和 ROI
          value: 2
          detail: 客户故事和 10,000 多个团队支撑战略相关性。
        - label: 缺少 ARR / 收入 / NRR 桥
          value: -4.5
          detail: 按可比公司承销的最大单一阻碍。
        - label: 过时的 2022 年价格锚
          value: -3.5
          detail: 旧轮次提供背景，但不是新的清算价格。
        - label: 定价和规模摩擦
          value: -2.5
          detail: 独立评论警告，采用过程可能变得昂贵或混乱。
        - label: 2026 年移动端登录事件
          value: -1
          detail: 温和但真实的企业信任折价。
        - label: 新的数据室指标
          value: 4
          detail: 如果管理层能提供，这会是最干净的上调催化剂。
    approximationNotes: 敏感性条是对投资判断的序位影响分数，不是企业价值的直接变化。
    claimRefs:
      - CV017
      - CV020
      - CV021
      - CV026
      - CV027
      - CV029
      - CV041
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 旧的 $3.2B 轮次位于基准情景顶部，而不是区间中部。
    data:
      items:
        - label: 悲观情景（M USD）
          low: 1200
          mid: 1600
          high: 2000
          detail: 严苛的价格发现，或倍数继续压缩。
        - label: 基准情景（M USD）
          low: 2400
          mid: 2800
          high: 3200
          detail: 产品相关性强，但没有新的经济数据披露。
        - label: 乐观情景（M USD）
          low: 3800
          mid: 4400
          high: 5000
          detail: 新的收入证据叠加平台溢价定位。
        - label: 最近披露轮次锚点（M USD）
          low: 3200
          mid: 3200
          high: 3200
          detail: 2022 年 7 月 Series C2 估值。
    approximationNotes: 区间是锚定公开可比公司和过时 2022 年融资估值的分析师估计，不是评估价值。
    claimRefs:
      - CV001
      - CV037
      - CV044
      - CV045
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 产品宽度和客户证据得分不错；估值清晰度和退出准备度仍是最弱维度。
    data:
      items:
        - label: 产品宽度
          score: 8
          note: 应用、工作流、智能体和企业控制带来真实的平台可选性。
        - label: 客户证据
          score: 7
          note: 官方 ROI 故事和知名客户名称支撑相关性。
        - label: 变现清晰度
          score: 4
          note: 定价机制可见，但当前收入结构和留存不可见。
        - label: 披露质量
          score: 3
          note: 没有当前公开的 ARR、收入、毛利率或 NRR 桥。
        - label: 估值支撑
          score: 4
          note: 公开可比公司框住了该领域，但上一次私募估值看起来仍偏满。
        - label: 运营信心
          score: 5
          note: 企业控制不错，但评论和 2026 年事故仍留下部分折价。
        - label: 退出准备度
          score: 3
          note: 相比近期 IPO 路径，另一轮私募融资看起来更可能。
        - label: 整体结论
          score: 4
          note: 在过时的 $3.2B 估值上继续研究；拿到新指标或更好价格后再重看。
    claimRefs:
      - CV020
      - CV021
      - CV029
      - CV041
      - CV046
      - CV047
