  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户组合很广，内部构建者和运营团队是反复出现的重心
        blocks:
          - type: paragraph
            body: >-
              Retool 的公开客户集明显不只是一个创业公司 logo 墙。已审阅引用覆盖物流（DoorDash）、 fintech
              和资金流转（Ramp、Plaid、Brex、Remitly）、加盟运营（Orangetheory）、医疗健康（UTMB）、 工业支持（Komatsu）、续约和客户成功（Neo4j），以及 AI 加持的 GTM
              运营（ClickUp 和 SafetyCulture）。 这种宽度重要，因为它说明 Retool 没有被困在单一垂直行业，也不是只服务一个狭窄管理面板用例。 它也与 Retool 自己的 2026
              定位一致：在既有企业内部，围绕内部管理工具、工作流自动化和自建对购买替换来展开。


              反复出现的买方/用户/付款方模式也很清楚。经济买方往往是工程、运营、产品、RevOps、支持或安全负责人； 他们需要更快的内部软件，但不想走完整自定义构建周期。日常用户通常是支持坐席、风险运营、加盟经理、
              续约代表或 GTM 团队；付款方是企业软件预算，而不是大众市场终端用户。定价和文档强化了这一结构： Retool 明确区分构建者、内部用户和外部用户，也向管理员开放全组织用量分析。
              这种组合让产品看起来像一个由开发者治理的操作层，之后可以向外扩张到合作伙伴和客户门户。
