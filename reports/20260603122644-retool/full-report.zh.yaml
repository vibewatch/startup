  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、打包方式与收入质量
        blocks:
          - type: paragraph
            body: >-
              Retool 的公开变现比简单的席位许可 SaaS 计划更细。官方定价和计费文档显示，至少有五类变现单位： 构建者席位、价格较低的内部用户席位、外部用户门户访问、工作流执行超额用量，以及 AI credits
              或智能体小时。 这会影响收入质量，因为前两类更像合同收入，适合年度承诺；后三类引入使用量敏感性，既可能在既有账户内扩张消费， 也会在活动量走弱时增加波动。计费文档还显示存在企业/承诺合同路径，支持 ACH
              或银行电汇付款， 说明大客户可以通过谈判后的年度条款购买，而不是纯自助刷卡。


              公开标价足以锚定收入线机制，但不足以锚定实际成交价。Team 计划的构建者标价从每月 $10 起， Business 计划从每月 $50 起；内部用户价格更低，外部用户在 Business 计划前 50
              个免费席位之后明确分层。 工作流运行还增加另一项用量表，价格为每月每额外 5,000 次运行 $75；2025 发布周期又加入 AI credits 和智能体小时作为新的变现单位。收入质量的正面是，Retool
              看起来用席位收入落地，再靠自动化、 门户和 AI 功能扩张；负面是，企业实际折扣、真实净美元留存和按产品拆分的组合均未披露。
