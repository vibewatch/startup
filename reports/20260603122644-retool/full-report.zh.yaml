      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              理解 Retool 的买方图谱，与其按单一行业垂直划分，不如从构建者经济性切入。Retool 自己的调查覆盖工程、 运营、产品、数据、IT、财务、营销和业务分析岗位，Searchlab 则称近一半无代码项目由
              IT 之外发起。 实践中，用户往往是运营人员或分析师，构建者可能在工程、IT 或运营团队，付款方通常是共享平台、 数字化转型或职能运营预算。定价也强化了这一理解：Retool 区分构建者、内部用户和外部用户，
              Power Apps 则销售高级平台许可证，可以扩展到数千名制作者和大得多的用户群。 采用路径通常靠赋能推进，而不是纯粹自下而上的病毒式传播。Microsoft 的 CoE 指南明确把低代码框定为
              制作者治理问题，Appian 和 Mendix 的竞品页面也强调基于角色的访问、编排、可审计性以及与既有企业系统集成。 因此，Retool 的天然买方不是爱好者式公民开发者；而是那些想让更多人交付运营软件、
              同时不丢掉 IT 控制权的组织。
