  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Retool 争夺的不是所有贴着无代码、低代码或 AI 编码标签的预算。它最强的市场边界，是构建在既有系统之上的企业内部应用： 治理足以通过安全评审，灵活性也足以快速交付数据密集型工作流。Retool
              自己的页面强调内部软件、构建者、 工作流、智能体、权限和外部应用，而不是泛化的公开网站创建。独立低代码比较把 Retool 与 Power Apps、 Mendix 和 Appian
              放在企业内部工具桶里；Appsmith、ToolJet 和 Budibase 则说明，开源和自托管替代品也在服务同一任务。
              因此，纳入支出是管理面板、审批流、运营看板、内部门户和运营自动化；排除或仅相邻的支出是网站构建器、 消费者无代码产品，以及不需要受治理访问企业数据的泛 SaaS 类别。现状替代方案与具名竞争对手同样重要：
              自定义代码、电子表格、脚本和单点 SaaS 仍是许多团队解决这些工作流的方式，所以 Retool 的相关市场位于经典企业开发工具和更宽的横向应用软件之间。
