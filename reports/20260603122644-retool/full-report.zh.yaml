      - number: '1.2'
        title: 创始人主导的管理、团队能见度与治理限制
        blocks:
          - type: paragraph
            body: >-
              Retool 仍明显由创始人主导。David Hsu 仍是公司在官方新闻中心、投资人画像和重大合作公告中的公开面孔。 这种集中并不只是象征。融资策略、产品哲学、AWS
              合作表述，以及企业应当更多自建软件这一大命题， 都由 Hsu 发声。他的经历也与产品高度匹配：Cashew 的运营痛点催生了最初洞察； 他把一次失败的 fintech
              尝试重构成开发者平台，这更像可信的创始人-市场匹配，而不是营销戏码。


              除 Hsu 之外，公开可见的管理层板凳厚度远低于业务规模应有水平。已审阅的核心官方页面没有发布当前高管名册， 也没有任何董事会细节。外部报道在 2023 事件响应中点名 Snir Kodesh 为工程负责人，
              Sequoia 的画像称 David Dworsky 是 AI 产品经理，但这不等于透明的领导班子。 公司幕后很可能有更深的高管团队；问题在于，公开记录让外部很难测试管理层深度。


              由此带来的尽调结论很直接。围绕 Hsu 的领导连续性看起来很强，但治理能见度弱。 公开材料没有呈现董事会名单、委员会结构，也没有明确财务、安全和人事领导的角色边界。 员工数披露同样混乱：Y Combinator
              显示团队规模 300，PitchBook 的 2024 快照显示 394 名员工， Tracxn 显示截至 Apr 26 有 416 名员工。由于这些数字无法干净对齐，Retool
              的公开身份更适合理解为创始人主导、 已有规模，但治理和组织深度仍相对不透明。
