chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品、阶段与运营模式
        blocks:
          - type: paragraph
            body: >-
              Retool 是一家总部位于 San Francisco 的私营软件公司，由 David Hsu 在 Cashew 失败后于 2017 创立； Cashew 是他带进 Y Combinator
              的点对点支付创业公司。已审阅的官方、投资人和加速器资料都指向同一个起点： Hsu 和团队发现，他们围绕反欺诈、KYC 和运营反复搭建的内部工具，比原来的 fintech 业务更有前途。 这个起点至今仍重要，因为
              Retool 的产品和叙事仍扎根在一个判断上：内部软件具有战略价值，但从零搭建很浪费。


              如今，Retool 把自己定位为面向内部软件开发的企业级 AppGen 平台。落到产品上，公司销售的是一个受治理的平台： 企业可以在既有数据库和 API 之上搭建内部应用、工作流、移动应用和 AI
              智能体。官网、定价页、 AWS 发布稿和第三方报道的产品叙事一致：Retool 尽量把软件中的定制部分留在代码里，把重复部分抽象成构建块、 权限、集成、部署控制和 AI
              辅助生成。这比泛泛的“低代码”定位更强，也更具体。


              Retool 的商业模式对私营公司来说也罕见地明确。公司把构建者、内部用户和外部用户分开计价， 再叠加共享 AI credits，并按使用时长单独向智能体收费。公开规模证据最强的地方是采用度和客户成果，
              而不是经审计的财务深度。官方资料现在称，Retool 受到全球超过 10,000 个组织或团队信任； TechCrunch 则报道，截至 mid-2022，平台已构建超过 500,000
              个应用、处理数十亿次查询。 官网客户证明和 Ramp 案例给出了具体 ROI，但关于当前员工数和经审计收入，公开记录仍然偏薄。
