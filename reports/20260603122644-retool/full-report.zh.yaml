              从公开市场角度看，Retool
              还不像已经准备好退出。公司的战略覆盖面显然足以吸引大型软件或工作流在位厂商；如果内部指标持续复合增长，另一轮私募也有可能。但保留下来的公开记录达不到公开投资人预期的审计和季度披露标准。这让实际决策框架很直接。若下一轮融资低于旧标记、变现证据仍无法桥接到公开市场倍数、可靠性或实施摩擦继续恶化，或自托管和企业复杂度侵蚀价值主张，投资逻辑
              就会破裂。尽调路径也同样清楚：投资人需要当前 ARR 或收入桥、毛利率和留存数据、队列级使用质量、股权结构表 和优先权细节，以及 2022 年以来任何二级价格。在这些材料出现之前，审慎姿态是把 Retool
