  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品面与构建者工作流
        blocks:
          - type: paragraph
            body: >-
              Retool 不再只是拖拽式管理面板构建器。它当前的公开产品面把经典应用、工作流、智能体、可复用模块、 GitHub 支持的源代码控制和企业治理放在一个平台里。官方企业定位强调在既有系统之上构建， 并使用
              JavaScript、Python、SQL 等标准语言；应用和工作流文档则更具体地展示了运营模式： 团队连接 API 或数据库，组装界面，添加查询和逻辑，再用定时或 webhook
              驱动的工作流自动化同一业务流程。 智能体把这个模式进一步延展，把代码、LLM 决策、人工审批，以及对外部记录系统的动作混在一起。

              因此，公开材料中可见的差异化不是原始无代码简单性，而是工作流压缩。Retool 试图把 UI 构建、数据访问、
              自动化、治理和部署放进同一个控制平面，从而减少内部工具的集成交接。模块和自定义组件带来复用和可扩展性， 但它们是在 Retool 自己的运行时和 iframe 边界内完成，而不是通过一个完全可导出的代码库完成。
              企业页面上的公开客户成果表明，这种打包最适合工程、运营和数据密集型团队；这些团队已经习惯围绕 API、 权限和在线系统思考，而不是纯视觉化无代码抽象。
