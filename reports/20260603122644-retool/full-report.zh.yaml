      - number: '7.5'
        title: 执行、人员配置和投资逻辑破裂监控
        blocks:
          - type: paragraph
            body: >-
              Retool
              的招聘信号格外重要，因为它们透露公司自己仍认为哪些平台工作没有收尾。应用安全岗位围绕一个会执行任意代码、处理敏感客户数据的平台来描述。可观测性岗位围绕一个任务关键、高可用产品来描述。治理岗位围绕大客户需要的行级和列级控制、AI
              配置政策、自动化安全中心 功能来描述。技术客户体验负责人则负责续约、扩张、范围化交付和高风险升级。合在一起，这些岗位说明公司仍在搭建让 AppGen
              在规模化时安全、可靠、可支持的机器，而不是已经完成最难控制工作的公司。


              这不会自动导向负面结论；它定义的是尽调标准。关键监控问题是：抗钓鱼的管理员控制和自托管卫生是否真的强制执行；2026
              年故障模式是改善而不是重复；企业部署能否在没有隐藏集中度的情况下续约并扩张；治理和支持招聘能否在构建者
              增长跑过平台控制之前补上缺口。如果管理层无法就这些问题拿出硬性的私有证据，正确结论不是产品没有需求，而是剩余风险仍过高，无法按低波动企业软件资产承销。
