      - number: '7.2'
        title: 法律、隐私和特权平台安全风险
        blocks:
          - type: paragraph
            body: >-
              Retool 的法律和监管姿态，最强之处在于说得足够明确：隐私政策和 DPA 清楚把客户列为 Customer Data 的控制者，把 Retool 列为处理者，写明基于 SCC
              的跨境传输机制，也记录监管和执法请求如何处理。这些文件有帮助，但也说明承销难题：Retool 不是开箱即用的合规转移工具。客户如果把 Retool
              用在承保、KYC、临床审查或其他受监管工作流上，数据合法性和许多部署选择仍由客户负责；Retool 仍是处理者，但仍可为了排障访问账户，并可能随时间增加子处理者。


              安全历史抬高了剩余严重性。Retool 自己的安全事件复盘称，2023 年一次短信钓鱼和深度伪造攻击导致 27 个云客户账户被接管；独立报道把该事件与 Fortress Trust
              的重大下游损失联系起来。Trust Center 还提供了更新证据：攻击面依然具备高权限且敏感。SAMLStorm 影响了使用 SAML SSO 的组织，另一项 2025 年披露则警告部分自托管实例存在
              host-header 和认证配置错误。公司确实展示了实质缓解措施——可见的 SOC 2 材料、漏洞披露计划、备份和事件流程文档，以及云与本地之间的零信任
              隔离——但平台可能直接站在敏感生产系统前面，因此剩余风险仍高。
