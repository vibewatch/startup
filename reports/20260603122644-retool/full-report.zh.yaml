      - number: '6.3'
        title: 耐久性证据从代理指标看偏正面，但投资人真正想要的指标仍薄弱
        blocks:
          - type: paragraph
            body: >-
              Retool 的公开记录更能证明客户反复使用，合同留存反而证据不足。几家具名客户把 Retool 描述成每天真正干活的地方：Neo4j 称团队 95% 的 CSM 时间都在 Retool 里，Ramp
              把它当成风险和产品指挥中心，TrustRadius 评价者也提到多个内部团队每天用它做管理面板和支持工作。这些信号重要，因为账户一旦嵌入工作流、权限和已连接数据源，切换成本就会变高。它们也说明，Retool
              更多是执行系统，而不是可丢弃的原型层。


              但这些仍只是代理指标。公开来源没有披露 NRR、GRR、logo 流失、合同期限、续约率或头部客户扩张。最接近留存的具名信号，是 Neo4j 称逾期续约导致的流失改善了很多倍，以及 Orangetheory
              称更好的工具支持会员留存。独立评价对 ROI 和把数据送到团队面前的易用性整体偏正面，但也提到加载慢、编辑冲突和基础 UI
              局限。结论是，客户满意度看起来足以支撑继续采用，但相较于部署案例的质量，长期稳定性仍缺乏证据。
