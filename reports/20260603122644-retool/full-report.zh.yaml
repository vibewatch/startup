      - number: '1.4'
        title: 里程碑、合作伙伴与负面信任事件
        blocks:
          - type: paragraph
            body: >-
              Retool 的里程碑弧线显示，公司正从开发者工具走向企业 AI 应用基础设施。早期节点包括 2017 创立和 YC 转向，随后是 Sequoia 合作以及截至 2022 逐步扩大的融资轮。2022 C2 材料和
              TechCrunch 报道还显示， 公司从 San Francisco 扩展到 New York、Seattle、London，并支持更广泛的 EMEA。更近的里程碑则从资本形成转向平台定位： June 2025
              Databricks 合作伙伴奖、December 2025 AWS 战略合作协议， 以及 February 2026 一份认为企业团队已经在用自建软件替换 SaaS 的报告。


              这一阶段的规模说法值得注意。Retool 称已自动化超过 100 million 小时工作，并受到全球超过 10,000 个组织信任。 公司官方调查称，35% 受访者已经用自定义构建替换至少一个 SaaS
              工具，78% 预计在 2026 构建更多内部工具。 这些是公司生成的数字，不能误读为独立市场审计，但它们展示了 Retool 现在出售的故事：
              不只是内部工具，而是一个企业应用层，让开发者和领域专家一起构建受治理的软件。


              负面记录重要，因为 Retool 承载敏感运营工作流。August 2023，一次定向钓鱼攻击攻破了 27 个云客户账户； Retool 和 BleepingComputer
              对范围描述一致，公司称本地部署或托管账户未受影响。May 2026， Retool 状态页记录了一起持续多日的移动端登录事件，根因与会话验证变更有关。OpenCVE 还列出两项 自托管 Retool 漏洞，并在
              2026 更新。这些都不能推翻平台动能，但投资案例同样取决于安全和可靠性纪律， 而不只取决于 AppGen 叙事强度。
