              核心价格锚已经足够旧，应被当作参考点，而不是实时清算价。TechCrunch 称，Retool 在 2022 年 7 月以 $3.2B 估值融资 $45M，此前 2021 年 12 月一轮估值约
              $1.85B。我们保留的独立画像来源仍把 Series C2 的这次跃升描述为最新公开估值标记，也仍把公司归类为 Series C 企业。这一点重要，因为投资人在 2026 年 6 月可买到的
              可比公司集合披露质量远好于 Retool。公开工作流和软件公司提供当前收入、当前市值和当前市销率倍数；Retool 没有。因此，入场纪律必须假设 2022
