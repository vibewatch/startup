      - number: '6.4'
        title: 扩张有迹可循，但渠道杠杆、采购摩擦和集中度不透明让投资判断门槛仍然很高
        blocks:
          - type: paragraph
            body: >-
              Retool 最清晰的扩张路径，是在账户内先落地再扩张。DoorDash 和 Ramp 从内部运营需求起步，最后做出数十个甚至数百个工具。Orangetheory 从内部现代化扩到外部加盟商应用。ClickUp
              和 SafetyCulture 表明，一旦 Retool 作为应用、工作流和智能体 层嵌入，更多团队会开始在同一个受治理底座上搭建。这个模式在战略上是正面的，因为它说明扩张不只靠新增 logo，也能靠用例变宽。


              摩擦也同样清楚。AWS Marketplace、合作伙伴计划和集成目录都能帮 Retool 拓宽采购和部署路径，尤其适合需要 Marketplace 计费或 SI
              支持的企业。但定价结构也清楚说明，SSO、源代码控制、审计日志、高级权限，以及大多数严肃的外部用户场景，都放在更高层级或定制合同之后。独立评论还提到，自托管可能很吃
              DevOps；评论和状态页则显示，性能和可靠性不错，但并非无瑕。集中度是最大未解风险：Retool 披露了标杆 logo 和 10,000+ 家公司的说法，却没有披露 ARR 有多少来自这些 logo、云市场渠道
              或少数大垂直行业。因此，客户故事基本正面，但若要判断投资级收入耐久性，置信度仍只能算中等。
