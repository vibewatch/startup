  - id: TV004
    title: 可比估值表
    columns:
      - 参照对象
      - 当前估值 / 倍数标记
      - 规模标记
      - 为何可比
      - 关键限制
    rows:
      - - GitLab
        - $5.37B 市值；5.35x 销售额
        - $1.00B TTM 收入
        - 开发者工具和平台软件基准，技术买方画像相近。
        - 披露更充分，也经过公开市场检验，程度远高于 Retool。
      - - monday.com
        - $4.02B 市值；3.09x 销售额
        - $1.30B TTM 收入
        - 工作流软件可比公司，靠席位和工作编排变现。
        - 品类更偏广义工作管理，开发者中心性弱于 Retool。
      - - Asana
        - $2.06B 市值；2.55x 销售额
        - $808.63M TTM 收入
        - 低倍数工作流软件的底部参照。
        - 没有 Retool 的开发者工具或智能体叙事。
      - - UiPath
        - $6.33B 市值；3.79x 销售额
        - $1.67B TTM 收入
        - 流程编排和企业部署的自动化平台参照。
        - RPA 背景和规模不同于 Retool 的应用构建器根基。
      - - Atlassian
        - $27.68B 市值；4.47x 销售额
        - $6.19B TTM 收入
        - 协作和开发者工作流平台基准，扩张经济性强。
        - 客户基数大得多，公开公司画像也更成熟。
      - - ServiceNow
        - $131.64B 市值；9.43x 销售额
        - $13.96B TTM 收入
        - 企业工作流溢价天花板，显示一流平台地位能拿到什么估值。
        - 已成熟的工作流操作系统，不是可一一对比的成长阶段私营公司。
      - - Salesforce
        - $164.48B 市值；3.84x 销售额
        - $42.83B TTM 收入
        - 规模化企业应用平台参照，面向大型企业销售、治理负担重。
        - 相比私有阶段的 Retool，商业化和利润率画像成熟得多。
    notes: Retool 估值讨论中最适合的公开可比公司样本，截至 runDate；各行把当前市场价值标记和已披露过去 12 个月收入合并展示。
    claimRefs:
      - CV030
      - CV031
      - CV032
      - CV033
      - CV034
      - CV035
      - CV036
      - CV037
      - CV042
    enumerationScope:
      coverage: sample
      basis: >-
        Sample of the public workflow, developer-tool, and automation comparables most relevant to Retool's June 2026
        valuation debate rather than an exhaustive universe of all software names.
  - id: TV005
    title: 投资逻辑击穿和否决触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 为何重要
      - 行动含义
    rows:
      - - 新的价格发现低于 2022 年估值
        - 新一轮融资或老股交易成交价明显低于 $3.2B
        - 这会证明旧披露估值不是新资金该用的承销锚。
        - 从继续研究转向回避，除非折价创造明显上行。
      - - 尽调中没有收入桥接
        - 管理层仍无法提供当前 ARR/收入、毛利率或留存
        - 没有这些指标，公开倍数逻辑仍是猜测。
        - 不要按陈旧的 2022 年估值出价。
      - - 规模摩擦恶化
        - 独立评论和支持或事故信号不是改善，而是恶化
        - 这会削弱平台溢价论和扩张逻辑。
        - 下调估值区间，并把企业级证据视为没那么持久。
      - - 自托管或治理负担超过 ROI
        - 大客户需要大量 DevOps 投入或定制绕路才能成功
        - 实施摩擦可能封顶 ACV 和扩张，即便顶层漏斗兴趣很强。
        - 下调“仅靠企业控制就能支撑溢价”的投资逻辑。
      - - 没有出现可信退出路径
        - 深入尽调后，仍没有经审计的公开公司式报告或可交给投行的流程
        - 流动性选项仍局限于财务赞助方兴趣和战略可选性。
        - 维持继续研究或回避，而不是承销类 IPO 退出。
    notes: 这些触发项是估值传导点，不是泛泛运营风险；每一项都能直接砍掉倍数或可实现的普通股结果。
    claimRefs:
      - CV026
      - CV027
      - CV028
      - CV029
      - CV041
      - CV045
      - CV047
      - CV048
      - CV049
  - id: TV006
    title: 最终尽调索取清单
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人 / 尽调路径
    rows:
      - - 当前收入桥接
        - 按产品线或客户细分拆分的 ARR 或 GAAP 收入
        - 这是每一次基于可比公司的讨论都缺失的分母。
        - 财务尽调包，提供当前季度到最近一期经审计期间的桥接。
      - - 毛利率和单位经济性
        - 按产品拆分的毛利率、托管成本、智能体服务成本和贡献利润率
        - AI 和工作流变现在 ARR 里可能好看，在利润率里未必好看。
        - CFO 和产品财务复盘。
      - - 留存和队列行为
        - 应用、工作流和智能体之间的 NRR、客户留存、席位扩张和附加率
        - 需要检验产品宽度带来的是持久扩张，还是功能蔓延。
        - 收入运营和董事会指标材料。
      - - 股权结构表和优先股堆叠
        - 优先股条款、反稀释权、期权池，以及 2022 年以来的任何老股定价
        - 名义投后估值和已实现普通股价值可能大幅分叉。
        - 法律股权结构表复盘和投资人权利清单。
      - - 使用质量和企业客户组合
        - 大型企业贡献的支出占比、部署模式、自托管占比和产品渗透率
        - 澄清 Retool 是在升级为战略平台，还是停留在点状解决方案。
        - 商业化分析和客户队列复盘。
      - - 退出准备度
        - 经审计报表、盈利质量审查路径，以及任何投行或战略接触
        - 决定上行是否有足够流动性，能在风险投资周期内兑现。
        - 董事会材料和外部顾问工作计划。
    notes: 这些索取项是最低材料包，才能把 Retool 从有吸引力的产品故事转成可定价的投资案例。
    claimRefs:
      - CV041
      - CV046
      - CV047
      - CV050
