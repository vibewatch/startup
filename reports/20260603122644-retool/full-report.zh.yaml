      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              最后一轮清楚披露的融资仍是 July 2022 完成的 $45 million Series C2，估值 $3.2 billion； PitchBook 也把它标为最新已完成交易。相对 2026
              运行日期，这已经过去数年。公开数据库仍对完整资本栈有分歧—— Sacra 称累计融资大约 $141 million，Tracxn 称六轮共 $165 million——所以连基本的股权结构起点也需要管理层确认。
              Y Combinator、PitchBook 和 Tracxn 都显示 Retool 仍在运营，但已审阅来源都没有披露当前现金、月度烧钱速度、 最低现金契约或现金跑道。


              因此，融资依赖结论必须保持有条件。正面是，公司似乎在没有公开披露新融资的情况下，继续推出 AI 和工作流的新变现界面， 说明它没有明显陷入困境。负面是，公开现金流能见度缺失，外部无法判断 Retool
              是在自筹资金增长、 安静依赖老股流动性，还是只是选择不披露。SEC Form D 指南在这里提供了相关流程背景： 豁免发行本应通过 Form D 通知，但已审阅公开材料中没有出现 Retool
              专属备案。对投资评估来说， 近期没有融资事件，并不等于资本充足性已经得到证明。
