      - number: '7.3'
        title: 运营韧性和伙伴依赖风险
        blocks:
          - type: paragraph
            body: >-
              Retool 的公开安全和工作流材料显示，技术栈分层但高度依赖外部。核心云交付跑在多租户 AWS 基础设施上，DDoS 和边缘保护依赖 Cloudflare；选择特定模式的自托管工作流用户，仍可能依赖
              Retool 托管的 Temporal。子处理者名单显示，AI 功能还叠加了一组依赖：OpenAI、Anthropic、Baseten、Tavily 和 ClickHouse。这一点重要，因为 Retool
              不只是 UI 构建器；它是内部软件、自动化、智能体 和连接器的运营织物。一旦依赖出问题，内部看板到工作流工作进程都可能被打断。


              2026 年故障记录支持把它视为真实的剩余暴露。IsDown 显示，自 2020 年 1 月以来共有 123 次故障，过去十二个月有 26 次，包括云用户 504、多小时页面未找到事故、阻断使用 Retool
              托管 Temporal 的自托管工作进程的许可降级、持续三天的 retool-edge 分发事故，以及 Google Sheets 和 MotherDuck 的多日故障。Retool
              记录了值班覆盖、灾备测试和备份流程，招聘可观测性岗位也说明公司仍在投入可靠性工具。但公开记录仍指向这样一个平台：风险不只来自一次灾难性
              安全事件，也来自伙伴、边缘、编排和连接器故障的长尾，这些故障会中断业务关键的内部运营。
