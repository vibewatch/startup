  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层 / 流程 / 组件
      - 角色
      - 依赖
      - 风险
    rows:
      - - 多租户 Retool Cloud
        - 面向应用、工作流和流程的共享 SaaS 控制平面
        - 由 AWS 托管的平台，客户应用和资源相互隔离
        - 共享服务故障或区域问题可能一次影响许多客户
      - - Retool 托管的自托管支持层
        - 客户自有 VPC，加上 Runner VM、IAM、DNS 和 Secrets Manager 脚手架
        - AWS 账户、CloudFormation、限定范围的角色和客户网络配置
        - 即使 Retool 管理实例，买方也可能低估 AWS 和网络设计工作
      - - Retool 托管服务层
        - EKS 托管的应用服务，加上 RDS 元数据存储和 ALB 路由
        - Runner VM 连通性和 AWS 原生服务
        - 托管访问边界较强，但服务连续性仍取决于 Retool 运营的编排
      - - 自管服务网格
        - api、jobs-runner、workflows workers、agent workers 和 code-executor 容器
        - Kubernetes 或 Docker 运维、Temporal、Postgres 和配套 ingress
