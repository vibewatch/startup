      - number: '2.4'
        title: 增长驱动、采用约束与关键缺口
        blocks:
          - type: paragraph
            body: >-
              最强的需求驱动是待办积压缓解、开发者稀缺、AI 辅助开发，以及业务侧希望用定制工作流替换不合身的 SaaS。 Searchlab 称 87% IT 领导者把低代码视为应对开发者短缺的办法；Retool 的
              2026 调查称， 35% 团队已经替换至少一个 SaaS 工具，78% 预计今年构建更多内部工具。但同一组证据也解释了采用为什么会卡住。 Forrester
              称，分布式创建会比治理追赶更快制造碎片化和蔓延；Digital Journal 对 Info-Tech 的摘要警告数据丢失防护控制薄弱、 所有权不清；McKinsey 则称，部门在架构和合规护栏之外构建时，影子
              IT 会变得危险。 成本和耐久性约束同样重要。DesignRevision 认为，25-30% 无代码项目会在两年内重写， 迁移可能花费 USD 50k 到 USD 250k；ToolJet
              的企业就绪清单则警告，厂商常把 SSO、RBAC 和审计日志关在企业版后面。 对 Retool 来说，与估值相关的矛盾很清楚：市场顺风真实存在，但持久份额取决于受治理内部应用平台能否把影子需求转成长期、
              生产级部署，然后赶在买方回到自定义代码，或标准化到更便宜、套件原生、开源替代品之前守住位置。
