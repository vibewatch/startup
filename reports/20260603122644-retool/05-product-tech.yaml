      - CE016
      - CE031
      - CE041
      - CE044
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process / component
      - Role
      - Dependency
      - Risk
    rows:
      - - Multitenant Retool Cloud
        - Shared SaaS control plane for apps, workflows, and processes
        - AWS-hosted platform with segregated customer apps and resources
        - Shared-service incidents or regional issues can affect many customers at once
      - - Retool-managed self-hosted support layer
        - Customer-owned VPC plus Runner VM, IAM, DNS, and Secrets Manager scaffolding
        - AWS account, CloudFormation, scoped roles, and customer network setup
        - Buyers may underestimate AWS and network design work even though Retool manages the instance
      - - Retool-managed services layer
        - EKS-hosted application services plus RDS metadata store and ALB routing
        - Runner VM connectivity and AWS-native services
        - Managed access boundaries are strong, but service continuity still depends on Retool-operated orchestration
      - - Self-managed service mesh
        - api, jobs-runner, workflows workers, agent workers, and code-executor containers
        - Kubernetes or Docker operations, Temporal, Postgres, and supporting ingress
        - Operator burden rises materially with upgrades, migrations, and workload scaling
      - - Code execution path
        - Runs user code for workflow blocks, queries, and agent logic
        - code-executor service plus nsjail sandboxing and privileged-container support
        - Weak sandbox configuration or unprivileged fallbacks can change the security posture
      - - Integration and networking path
        - Connects GitHub and other data sources into Retool resources and source control
        - GitHub Apps, access tokens, outbound regions, IP allowlists, and customer firewalls
        - Connectivity and permission issues can break key workflows even when the core app builder is healthy
    notes: >-
      This table reflects only the public architecture Retool discloses; it is intentionally more concrete for
      self-hosted deployments than for Retool Cloud internals.
