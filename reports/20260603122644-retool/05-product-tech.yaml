chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Retool now spans a broad internal-software stack: app building, workflow automation, agents, source control,
    deployment choices, and enterprise governance. Its strongest public case is speed plus control on top of live
    business systems, while the main diligence caveats remain self-hosting/operator burden, platform dependencies,
    and limited public evidence on large-scale performance or contractual reliability.
sections:
  - id: sec501
    title: Product surface and builder workflow
    body: >-
      Retool is no longer just a drag-and-drop admin-panel builder. Its current public surface combines classic apps,
      workflows, agents, reusable modules, GitHub-backed source control, and enterprise governance inside one
      platform. The official enterprise positioning emphasizes building on top of existing systems with standard
      languages such as JavaScript, Python, and SQL, while the apps and workflows docs show the operating model more
      concretely: teams connect APIs or databases, assemble interfaces, add queries and logic, then automate the same
      business process with scheduled or webhook-driven workflows. Agents extend that model further by mixing code,
      LLM decisions, human approvals, and actions against external systems of record.

      The differentiator visible in public materials is therefore workflow compression rather than raw no-code
      simplicity. Retool tries to keep UI building, data access, automation, governance, and deployment inside the
      same control plane, which reduces integration handoffs for internal tools. Modules and custom components add
      reuse and extensibility, but they do so inside Retool’s own runtime and iframe boundaries rather than through a
      fully exportable codebase. Public customer outcomes on the enterprise page suggest that this packaging works best
      for engineering, operations, and data-heavy teams that already think in terms of APIs, permissions, and live
      systems instead of purely visual no-code abstractions.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
