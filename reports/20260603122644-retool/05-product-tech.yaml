  evidenceGaps:
    - type: missing-source
      severity: material
      topic: performance-benchmarks
      missingEvidence: Independent benchmark data for large Retool app latency, multi-editor conflict rates, workflow throughput, and agent latency by workload class.
      whyItMatters: Public sources show speed claims and anecdotal slowdown complaints, but not a diligence-safe benchmark pack for scale underwriting.
      diligencePath: Request internal scale references, synthetic-load results, concurrency limits, and browser performance guidance by app complexity tier.
      relatedQuestionRefs:
        - QE026
      relatedTableRefs:
        - TE001
        - TE002
    - type: missing-source
      severity: material
      topic: feature-parity
      missingEvidence: A public parity matrix across Retool Cloud, customer-VPC Retool-managed, and fully self-managed deployments for agents, mobile, observability, source control, and orchestration dependencies.
      whyItMatters: Buyers can under-budget operator work or overestimate feature availability if they assume all deployment models behave the same.
      diligencePath: Request a deployment-SKU parity sheet, managed-Temporal dependency map, and version-lag guidance for each major module.
      relatedQuestionRefs:
        - QE005
        - QE026
      relatedTableRefs:
        - TE001
        - TE003
    - type: missing-source
      severity: material
      topic: enterprise-sla
      missingEvidence: A public SLA or service-credit document plus official long-horizon uptime exports by region or component.
      whyItMatters: Official status and trust materials describe controls and incidents, but not the contractual availability regime many enterprise buyers require.
      diligencePath: Obtain the enterprise order-form SLA, regional SLO history, and incident-review process for shared services and self-hosted dependencies.
      relatedQuestionRefs:
        - QE014
        - QE026
      relatedTableRefs:
        - TE004
    - type: private-evidence-only
      severity: material
      topic: ai-guardrails
      missingEvidence: Public detail on Assist and Agents model routing, redaction, token economics, approval policies, and audit granularity.
      whyItMatters: AI features are central to Retool’s differentiation, but unclear operating constraints can create cost, privacy, and governance risk.
      diligencePath: Request enterprise AI architecture documents, logging and approval controls, model-selection policy, and retention settings for generated outputs.
      relatedQuestionRefs:
        - QE016
      relatedTableRefs:
        - TE005
