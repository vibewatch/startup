tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - Module / asset
      - Primary user
      - Status / maturity
      - Differentiation
      - Diligence gap
    rows:
      - - Apps
        - Internal app builders across engineering, ops, and business teams
        - Mature core surface
        - Drag-and-drop UI plus JS/Python/SQL on live systems rather than a toy data layer
        - Public materials do not publish large-app latency or concurrency benchmarks
      - - Workflows
        - Ops, back-office, and automation builders
        - Mature and deeply documented
        - Scheduled and webhook-driven automations share the same resource and query model as apps
        - Public docs do not quantify throughput, queueing, or SLOs by workload class
      - - Agents
        - Teams automating decision-heavy business processes
        - Fast-moving 2025-2026 surface
        - Combines LLMs, deterministic code, human approvals, and tool actions in one platform
        - Public model-routing, cost, and guardrail details remain thin
      - - Modules
        - Retool developers standardizing common logic and UI
        - Mature reuse primitive
        - Reuses queries and components across apps without rebuilding from scratch
        - Reuse governance and dependency-management details are not benchmarked publicly
      - - Source Control with GitHub
        - Platform admins and larger development teams
        - Mature enterprise workflow with 2026 expansion
        - Pull-request-based change management tied to dedicated GitHub repos and apps
        - Public evidence does not fully describe merge-conflict handling at very large scale
      - - Self-hosted deployment topologies
        - Security-sensitive and regulated buyers
        - Real, documented, but operationally uneven by model
        - Choice between customer-VPC Retool-managed and fully self-managed Kubernetes or Docker setups
        - No public parity sheet across cloud, Retool-managed self-hosted, and fully self-managed
      - - Retool Database / cached data path
        - Teams that want an in-platform Postgres-backed data layer
        - Publicly visible but less directly documented than apps or workflows
        - Lets Retool store data only when customers opt into Retool-managed data products or caching features
        - Public current docs are thinner than the rest of the platform and lack external benchmark evidence
    notes: >-
      Rows reflect the public surface directly evidenced in marketing, docs, trust materials, and developer assets as of
      2026-06-03; maturity is qualitative and based on documentation depth, release freshness, and observed operator
      complexity rather than internal roadmap access.
