  - id: sec503
    title: Trust, privacy, reliability, and compliance posture
    body: >-
      Retool’s trust posture is strongest where it explains how customer data flows and what controls exist around that
      flow. The security and trust materials say Retool Cloud is multitenant, encrypts data in transit and at rest,
      keeps audit logs, supports remote user disablement and team-wide 2FA, and runs nightly backups with seven-day
      retention plus disaster-recovery testing every 90 days. The privacy and trust pages add an important product
      nuance: when customers connect their own databases or third-party data resources, Retool usually proxies queries
      instead of storing the underlying customer data, while Retool Database and optional query or workflow caching are
      the main public cases where Retool itself stores data. Legal materials also show an explicit subprocessor program
      and note that Google Workspace API data is not retained to train generalized AI or ML models.

      The limiting factor is reliability and contract transparency rather than an absence of controls. Public status
      evidence shows a late-May 2026 mobile sign-in incident caused by a session-validation change, and third-party
      status aggregators add evidence that outages and degradations are recurring enough to track as an operational
      category. IncidentHub’s self-hosted licensing-service note is especially useful because it shows that even
      customer-hosted setups can depend on Retool-managed orchestration components. For diligence, that means Retool’s
      trust story is credible for enterprise software procurement, but buyers still need private diligence on uptime
      commitments, regional failover behavior, and the precise support boundaries around managed Temporal and other
      shared services.
    claimRefs:
      - CE018
      - CE019
      - CE021
      - CE022
      - CE023
