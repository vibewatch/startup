  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Retool solution
      - Measurable benefit
      - Limitation
    rows:
      - - Build an internal app on top of existing systems
        - Connect databases and APIs, assemble forms/tables, add custom logic
        - Classic apps with components, queries, and JS/Python/SQL
        - Official customer examples cite 10x faster cycles and 65% efficiency gains in enterprise deployments
        - Public evidence is stronger on speed than on long-horizon maintainability metrics
      - - Automate a recurring back-office process
        - Schedule work or trigger it from events and webhooks
        - Workflows with query blocks, transforms, and asynchronous logic
        - Same resource layer can power both the UI and the automation path
        - Public throughput and retry-behavior benchmarks are not disclosed
      - - Orchestrate a semi-autonomous business process
        - Combine business rules, model calls, and approvals
        - Agents mix deterministic code, LLMs, humans, and action steps
        - Retool can keep AI workflow generation and execution inside a governed enterprise platform
        - Public usage limits, model policies, and audit granularity for agents remain partially opaque
      - - Standardize large-team change management
        - Developers want reviewable app changes instead of ad hoc edits
        - GitHub-backed Source Control with PR workflows and multi-instance releases
        - Change history becomes reviewable through the same enterprise repo conventions teams already use
        - Reviewer and merge ergonomics under heavy concurrent editing are not well quantified publicly
      - - Deploy in a regulated or infrastructure-controlled environment
        - Buyer needs customer-owned network perimeter or self-managed stack
        - Retool-managed customer VPC or full self-managed Kubernetes or Docker deployment
        - Preserves data and key ownership while retaining low-code productivity
        - Self-managed operations still require meaningful platform and upgrade expertise
      - - Extend the platform with custom UI or package code
        - Team needs UI primitives beyond built-in components
        - Custom components built with React, npm packages, and a sandboxed iframe interface
        - Public guide supports local dev, hot reload, and CDN or inline production paths
        - Extension still happens inside Retool’s runtime boundary, not exported standalone code
    notes: >-
      Benefits are drawn from public customer stories and product materials; they indicate directional value but should
      not be treated as audited benchmarks across all deployments.
    claimRefs:
