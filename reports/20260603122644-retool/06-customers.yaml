- id: named-customer-proof
  title: Named customer proof is real and often outcome-rich, but it is still mostly vendor-authored
  body: |-
    The strongest public proof comes from named accounts with specific workflow outcomes, not from logo pages alone. DoorDash documents a mature operational deployment with 40-plus tools and a build-time reduction from months to minutes. Ramp uses Retool deeply in risk and product operations, saying it built 100-plus tools in less than a year and saved millions. Plaid ties Retool to a measurable 80 percent ticket-resolution improvement, while Remitly provides unusually useful deployment detail by describing self-hosting in its own VPC and Kubernetes environment. Orangetheory’s story is also high-value because it shows external franchisee-facing apps, not just internal dashboards.

    The newer 2026 case studies matter because they show Retool selling into AI-era budgets, not just legacy low-code experiments. ClickUp, SafetyCulture, UTMB, and Komatsu all describe production or near-production uses tied to measurable throughput, conversion, or cost outcomes. At the same time, the quality bar should stay disciplined: almost all of this proof is still published on Retool’s own site and then echoed by aggregation platforms such as Cuspera or FeaturedCustomers. That is enough to demonstrate real adoption and named deployment depth, but not enough to turn every logo into independent retention proof. The right read is “credible sample of production references,” not “fully independently corroborated customer base.”
