- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Evidence
  - Diligence path
  rows:
  - - More teams adopt the same platform inside one account
    - Logo count may overstate diversified revenue if a few large enterprises dominate
    - Supports land-and-expand economics but can hide ARR concentration
    - DoorDash, Ramp, ClickUp, SafetyCulture case studies
    - Request top-20 account ARR and active-app counts
  - - External-user and franchise deployments
    - External-user pricing is separate and economics are undisclosed
    - Creates bigger surface area but unclear gross margin or renewal profile
    - Orangetheory plus pricing page
    - Ask for external-user pricing mix and portal retention
  - - AI workflow expansion across GTM and product teams
    - Rapid experimentation may create shallow or non-renewing use cases
    - Positive cross-functional adoption but quality depends on lasting business ownership
    - ClickUp and SafetyCulture 2026 stories
    - Review usage cohorts for agents, workflows, and AI credits by team
  - - Marketplace and partner channels
    - Channel partners can own procurement leverage or customer relationship
    - Helps reach enterprise buyers but can compress direct margin or visibility
    - AWS Marketplace and Retool partner program
    - Break out direct vs marketplace vs SI-sourced ARR
  - - Regulated self-hosted wins
    - Heavier deployment model can lengthen procurement or delay expansion
    - Security-sensitive customers may be sticky, but sales cycles may be slower and costlier
    - Remitly and Orangetheory self-hosted references
    - Compare time-to-close and renewal rates for self-hosted vs cloud
  - - Marquee logos without ARR mix
    - Top-customer concentration remains undisclosed
    - Big names can create a stronger perceived moat than the revenue mix actually supports
    - Customers page, Business Wire, Vendr
    - Request top-customer share, logo tenure, and net expansion by segment
  notes: This table focuses on revenue-quality interpretation rather than absolute customer quality; concentration values are qualitative because public ARR mix is not disclosed.
