  rows:
  - - Fintech and money movement
    - Ramp, Plaid, Brex, Remitly
    - Buyer = product / operations / support / risk leaders; user = support, risk, developer-success teams; payer = enterprise software budget
    - Risk operations, support tooling, internal CRM, transaction troubleshooting
    - High-value, data-intensive accounts with regulated workflows
    - No disclosed ARR concentration or renewal data by fintech cohort
  - - Logistics and marketplaces
    - DoorDash
    - Buyer = engineering / ops leadership; user = operations teams; payer = core ops tooling budget
    - Dasher routing, rewards operations, restaurant and logistics tooling
    - Shows Retool can sit close to operational core processes
    - Public proof is one flagship case, not a disclosed cohort
  - - External portal / franchise operations
    - Orangetheory Fitness
    - Buyer = infrastructure / security leadership; user = studio managers and franchisees; payer = enterprise platform budget
    - Lead management, member management, portfolio apps for franchisees
    - Demonstrates external-user motion rather than just employee tooling
    - No disclosed external-user revenue or portal renewal economics
  - - Customer success and renewals
    - Neo4j, Plaid, Remitly
    - Buyer = CX or renewals leadership; user = CSMs, support reps, developer success; payer = GTM / support / renewals budget
    - Renewals control centers, integration health dashboards, transaction troubleshooting
    - Strong fit for teams that need action and data in one place
    - Public proof is workflow-centric, not contract-metric-centric
  - - AI-era GTM and product operations
    - ClickUp, SafetyCulture
    - Buyer = GTM AI / RevOps / marketing-tech leaders; user = sales, support, DA, BDR teams; payer = GTM systems budget
    - AI agents, lead research, support triage, product-feedback workflows
    - Shows expansion into current AI budgets and workflow orchestration
    - Recent proof is promising but still mostly vendor-authored
  - - Healthcare and industrial enterprises
    - UTMB, Komatsu
    - Buyer = clinical informatics or enterprise architecture leaders; user = pathology or support-center agents; payer = innovation / IT budget
    - Clinical review automation, call-center automation, service workflows
    - Proves Retool can support complex regulated or operationally heavy environments
    - Need more independent proof on long-term production durability
  - - Retail transformation
    - Holland & Barrett
    - Buyer = data / transformation leadership; user = senior decision makers and internal data teams; payer = digital-transformation budget
    - Self-service governance and reporting tools
    - Adds large-store-footprint retail evidence
    - Public case is lighter on deployment detail and quantified outcomes than top references
  notes: Rows synthesize the clearest public buyer/user/payer archetypes as of 2026-06-03; they are not an exhaustive customer census.
