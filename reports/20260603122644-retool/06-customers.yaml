- id: TU006
  title: Procurement / channel friction table
  columns:
  - Friction point
  - Evidence
  - Customer impact
  - Most exposed segment
  - Diligence path
  rows:
  - - Enterprise-only governance features
    - SSO, source control, audit logging, and dedicated support sit on higher tiers or custom deals
    - Raises cost and approval bar for regulated or collaborative teams
    - Mid-market teams graduating from pilot to enterprise
    - Obtain actual feature gating by plan and win/loss notes around SSO or Git
  - - Self-hosting operational burden
    - Independent reviews say self-hosting needs meaningful DevOps effort and updates can trail cloud
    - Can slow procurement, deployment, and upgrade cadence
    - Security-sensitive buyers needing private cloud or on-prem
    - Review self-hosted implementation timelines, staffing, and upgrade burden
  - - Marketplace contract complexity
    - AWS listing uses contract duration, private offers, overages, and infrastructure costs
    - Adds procurement optionality but also pricing complexity
    - Enterprises centralizing spend through cloud marketplaces
    - Ask for marketplace share, private-offer close rates, and overage incidence
  - - Collaborative editing friction
    - Reviews mention app changes can overwrite each other or break functionality
    - Can matter once multiple builders work on the same app estate
    - Large internal platform teams with many builders
    - Validate source-control maturity and multi-builder workflows in a demo
  - - Performance and UI constraints
    - Reviews mention slow loading, sluggish complex dashboards, and basic UI limitations
    - Can affect adoption or satisfaction for large or heavily queried apps
    - Data-heavy operations and support teams
    - Benchmark large app performance and monitor query latency in customer references
  - - Reliability incidents
    - Status page shows mobile sign-in disruption in May 2026 despite strong overall uptime
    - Reliability is good but not perfect, which matters if workflows are mission critical
    - Mobile users and any team with operational dependency on Retool Cloud
    - Request incident postmortems and customer-communication standards
  notes: Procurement friction combines first-party packaging, marketplace mechanics, review evidence, and incident history; it is a diligence checklist, not a claim that Retool is uniquely hard to buy.
