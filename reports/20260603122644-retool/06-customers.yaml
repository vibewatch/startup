  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Customer-level NRR, GRR, renewal rate, contract-length, and logo-churn cohorts by vintage or segment.
    whyItMatters: Retool’s public record is strong on deployment anecdotes but weak on whether those accounts renew and expand at software-quality economics.
    diligencePath: Request a cohort pack showing logo start date, current ARR, modules live, renewals, expansions, downgrades, and churn reasons for the top 25 accounts.
    relatedQuestionRefs:
    - QU016
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer ARR share, top-ten customer share, and any concentration by industry or deployment model.
    whyItMatters: A vendor with marquee logos can still have dangerous renewal or bargaining leverage if a few fintech or enterprise accounts dominate ARR.
    diligencePath: Ask management for top-10 ARR concentration, top-10 gross margin contribution, renewal dates, and the mix of direct versus marketplace- or partner-sourced revenue.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-coverage
    missingEvidence: A complete customer census with deployment stage, geography, buyer team, and whether each logo is active production, pilot, or historical.
    whyItMatters: The public customer story is sample-based and outcome-rich for marquee accounts, but it does not prove how representative those wins are across the installed base.
    diligencePath: Request a current customer ledger or at least the top 50 referenceable accounts with stage, start date, latest usage, and permission for live reference calls.
    relatedQuestionRefs:
    - QU001
    - QU025
    relatedTableRefs:
    - TU003
  - type: access-blocked
    severity: minor
    topic: review-density
    missingEvidence: Fresh enterprise review exports from G2 or Gartner Peer Insights, plus any forum threads with direct incident or migration complaints.
    whyItMatters: TrustRadius, Capterra, and critical blogs show friction, but a broader set of current raw reviews would better quantify how common those issues are among larger deployments.
    diligencePath: Pull current enterprise review exports directly from G2/Gartner or ask Retool for customer-reference packets and objection logs used by sales engineering.
    relatedQuestionRefs:
    - QU018
