- id: funding-investors
  title: Funding history, investor map, and disclosure boundaries
  body: |-
    Retool’s financing history is one of the clearest parts of the company overview. The company announced a $50 million Series B led by Sequoia in October 2020, a $20 million Series C at a $1.85 billion valuation in December 2021, and a $45 million Series C2 at a $3.2 billion valuation in July 2022. Those rounds repeatedly feature the same high-signal backers: Sequoia, John and Patrick Collison, Nat Friedman, Elad Gil, Daniel Gross, and related insider supporters. Sequoia’s own company page says it partnered with Retool in 2019, reinforcing the picture of a long-duration sponsor that kept backing the company rather than flipping to a new syndicate every round.

    The more nuanced read is that valuation is clearer than capital structure. The latest widely corroborated private valuation is still $3.2 billion, and third-party databases still show Series C2 as the latest public deal type. But the total amount raised is not as clean. Sacra cites roughly $141 million in lifetime funding, while Tracxn cites $165 million. Those figures are directionally similar but too different to present as a single precision number without caveat. Hsu’s own 2021 fundraising essay also makes clear that Retool deliberately preferred smaller rounds and lower dilution over headline-maximizing raises, which is a useful signal about capital philosophy but not a substitute for cap-table detail.

    For diligence purposes, the company reads as a late-stage private software platform with strong investor quality and a still-private control story. Public evidence supports the financing chronology and valuation marks; it does not support exact ownership percentages, secondaries, debt terms, or board rights. That means the investor map is good enough to establish credibility, but not good enough to underwrite downside protections or control dynamics without direct company materials.
