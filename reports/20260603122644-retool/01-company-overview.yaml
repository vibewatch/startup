- id: milestones-risks
  title: Milestones, partnerships, and adverse trust events
  body: |-
    Retool’s milestone arc shows a company moving from developer tooling into enterprise AI application infrastructure. The early chapters are the 2017 founding and YC pivot, followed by a Sequoia partnership and progressively larger financing rounds through 2022. The 2022 C2 materials and TechCrunch coverage also show geographic expansion from San Francisco into New York, Seattle, London, and broader EMEA support. More recent milestones shift from capital formation to platform positioning: a June 2025 Databricks partner award, a December 2025 AWS strategic collaboration agreement, and a February 2026 report arguing that enterprise teams are already replacing SaaS with custom-built software.

    Scale claims in this phase are notable. Retool says it has automated more than 100 million hours of work and is trusted by more than 10,000 organizations worldwide. The company’s official survey work says 35% of respondents have already replaced at least one SaaS tool with a custom build and 78% expect to build more internal tools in 2026. These are company-generated numbers, so they should not be mistaken for independent market audits, but they do show the story Retool is now selling: not merely internal tools, but an enterprise application layer where developers and domain experts build governed software together.

    The adverse record matters because Retool sits on sensitive operational workflows. In August 2023, a spear-phishing attack compromised 27 cloud customer accounts; Retool and BleepingComputer agree on the scope, and the company said no on-prem or managed accounts were affected. In May 2026, Retool’s status page logged a multi-day mobile sign-in incident tied to session validation changes. OpenCVE also listed two self-hosted Retool vulnerabilities updated in 2026. None of this disproves the platform’s momentum, but it does mean the investment case depends on security and reliability discipline as much as on AppGen narrative strength.
