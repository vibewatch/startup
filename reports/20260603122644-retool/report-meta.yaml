companyProfile:
  summary: Retool is a San Francisco-based internal-tools platform founded in 2017 that lets enterprises build apps, workflows, mobile experiences, and AI agents on top of their existing data systems without starting from scratch. Public evidence supports strong product breadth, real enterprise customer proof, and a meaningful 2021-2022 valuation step-up, but the variables that matter most for late-stage underwriting—current ARR quality, margins, retention, concentration, and any newer price discovery—remain only partially public. The result is a strategically relevant developer-tool asset with credible adoption and incomplete economics disclosure.
  foundedDate: null
  founders:
    - name: David Hsu
      role: Founder & CEO
      background: Oxford-trained technologist who previously built the YC-backed payments startup Cashew before refocusing the team on internal tooling and founding Retool.
      claimRefs: [CO012, CO013]
  foundingLocation: San Francisco, California, USA
  headquarters: San Francisco, California, USA
  productSummary: Low-code internal application, workflow, mobile, and AI-agent platform that connects to APIs, databases, warehouses, and cloud services while offering governance, self-hosting, and enterprise controls.
  customerFocus: Mid-market and enterprise teams across engineering, operations, data, IT, support, and other functions that need governed internal software or workflow automation.
  businessModel: SaaS pricing based on builder seats, internal and external users, workflow runs, and hourly AI-agent usage, with enterprise contracts and self-hosted options for larger deployments.
  stage: Late-stage private / Series C2-era company with the latest public valuation marker from July 2022.
  fundingStatus: Latest public financing marker is the July 2022 $45M Series C2 at a $3.2B valuation; public databases disagree on lifetime funding totals and do not provide a newer public re-marking event.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO003, CO005, CO007, CO011, CO020, CO022, CI019, CV046]
