- id: TI005
  title: Public Financial Gaps That Still Block Underwriting
  columns:
  - Missing metric / document
  - Why the gap matters
  - Exact diligence path
  rows:
  - - Audited income statement, balance sheet, and cash-flow statement
    - Without auditeds, public ARR and funding estimates cannot be reconciled to profitability, cash conversion, or solvency
    - Request 2023-2025 audited financials plus YTD 2026 management accounts
  - - ARR / revenue mix by product
    - Seat revenue and usage add-ons likely have different durability and margin profiles
    - Request ARR split across builders, internal users, external users, workflows, AI, and any services
  - - Gross margin by product
    - AI and workflow workloads can have materially different infrastructure costs from core seat software
    - Request gross margin bridge by major product line and hosting model
  - - Retention, churn, and cohort expansion
    - Revenue quality depends on whether customers expand after initial deployment or churn after pilots
    - Request GRR/NRR by cohort, segment, and deployment model
  - - Cash, burn, runway, and financing plan
    - Capital adequacy cannot be judged from public sources today
    - Request monthly cash waterfall, board plan, and downside runway sensitivity
  - - Deferred revenue, billings, and collections
    - Contract quality and cash conversion depend on billing cadence and collections behavior
    - Request deferred revenue roll-forward, billings, aging, bad-debt history, and top-customer payment terms
  - - Customer concentration and largest-contract exposure
    - A handful of large enterprise accounts could dominate ARR and renewal risk
    - Request top 20 customers by ARR, renewal dates, and concentration share
  - - Security-incident economic impact
    - Trust events can reduce renewals, expansion, or hosting preference for cloud customers
    - Request churn/expansion analysis for affected cloud cohorts after the 2023 incident
  notes: Each row is a concrete missing input that directly affects the investment case rather than a generic research wish list.
