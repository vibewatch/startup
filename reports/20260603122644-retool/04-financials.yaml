  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: audited-financial-statements
    missingEvidence: Audited 2023-2025 income statement, balance sheet, and cash-flow statement plus YTD 2026 management accounts.
    whyItMatters: Without auditeds, public ARR and funding estimates cannot be reconciled to profitability, cash generation, or solvency.
    diligencePath: Request the latest audit package, trial balance bridge, and board materials used to discuss financial performance.
    relatedQuestionRefs:
    - QI018
    - QI023
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: revenue-mix-and-margin
    missingEvidence: ARR split by builders, internal users, external users, workflows, AI, and any services, plus gross margin by product.
    whyItMatters: Usage-heavy AI and workflow revenue can carry very different margin profiles from contracted seat revenue.
    diligencePath: Request a product-level ARR and gross-margin bridge for the last eight quarters.
    relatedQuestionRefs:
    - QI001
    - QI011
    - QI024
    relatedTableRefs:
    - TI001
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: retention-and-cohorts
    missingEvidence: Gross and net revenue retention, logo churn, and cohort expansion by segment and deployment model.
    whyItMatters: The commercial case depends on land-and-expand behavior, but public sources only show anecdotal ROI.
    diligencePath: Request cohort tables and renewal dashboards from RevOps or finance.
    relatedQuestionRefs:
    - QI006
    - QI007
    - QI023
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-and-runway
    missingEvidence: Cash balance, monthly burn, runway, and any board-approved financing plan.
    whyItMatters: Capital adequacy cannot be judged from the public record today.
    diligencePath: Request a monthly cash waterfall, scenario model, and any lender or investor update decks.
    relatedQuestionRefs:
    - QI017
    - QI018
    - QI019
    relatedTableRefs:
    - TI004
  - type: missing-source
    severity: material
    topic: financing-filings
    missingEvidence: Retool-specific Form D or equivalent financing-filing trail, if any exists.
    whyItMatters: A verified filing trail would help confirm timing, issuer name, and financing mechanics for private rounds.
    diligencePath: Ask counsel or management for the company’s historical financing notices and legal-entity list.
