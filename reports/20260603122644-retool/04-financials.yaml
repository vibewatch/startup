callouts:
- calloutType: strength
  title: The commercial model has credible expansion levers
  body: Retool is not limited to one seat-based SKU. Public evidence shows a base of builder and internal-user subscriptions with expansion into external portals, workflow overages, and newer AI usage units, which can raise account value if adoption continues.
  claimRefs:
  - CI001
  - CI008
  - CI009
  - CI010
  - CI020
  - CI044
- calloutType: risk
  title: Revenue quality is still harder to underwrite than the product story
  body: Customer proofs and demand signals are strong, but there is still no public gross margin, NRR, churn, cash, or runway disclosure. The 2023 cloud-customer breach also shows that trust events can directly affect the more exposed cloud business.
  claimRefs:
  - CI030
  - CI031
  - CI038
  - CI039
  - CI045
- calloutType: recommendation
  title: Require a private-data-room bridge before taking valuation seriously
  body: Before underwriting Retool at any price, request audited financials, revenue mix by product, cohort retention, cash runway, top-customer concentration, and a reconciled funding history. Public sources support the commercial narrative but not a dependable investment model.
