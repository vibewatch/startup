tables:
- id: TI001
  title: Revenue Streams and Quality Summary
  columns:
  - Stream
  - Mechanism
  - Public pricing anchor
  - Revenue quality read
  - Main diligence ask
  rows:
  - - Builder seats
    - Per-seat subscription for users who create or edit apps and workflows
    - $10/month Team list; $50/month Business list; enterprise custom
    - Best recurring revenue candidate because builders are core power users and can be sold on annual/contracted terms
    - Realized builder ASP by segment, gross dollar retention, and enterprise discounting
  - - Internal users
    - Lower-priced seat for enabled users who consume but do not build
    - $5/month Team list; $15/month Business list; enterprise custom
    - Recurring but lower-ARPU; expands account breadth and makes platform harder to rip out once embedded broadly
    - Mix of internal users to builders and conversion of viewers into higher-priced builders
  - - External users / portals
    - Tiered pricing for customers, partners, or vendors outside the org
    - 'Business plan: first 50 free, then $8/$6/$4 annual tiers or $10/$7/$5 monthly tiers'
    - Usage-sensitive expansion vector tied to customer-facing adoption; good upside but less predictable than committed seats
    - Monthly active external-user counts, churn, abuse/fraud controls, and gross margin by portal use case
  - - Workflow runs
    - Per-execution monetization for automation jobs and backend processes
    - Additional runs $75 per 5,000 per month
    - Healthy expansion lever because it monetizes automation intensity inside existing customers
    - Share of ARR from workflows, overage incidence, and seasonality of execution volume
  - - AI credits / agent hours
    - Plan-bundled AI credits and agent runtime with optional extra capacity
    - Credits and free hours vary by plan; extra packs/custom capacity available
    - Early but potentially high-value usage layer; quality depends on model pass-through costs and retention after experimentation
    - Contribution margin by AI product, customer adoption curves, and attach rates into paying accounts
  notes: List pricing is public; realized enterprise discounts, product mix, and gross margin are not disclosed.
