slug: retool
runDate: '2026-06-03'
company:
  name: Retool
chapter:
  number: 4
  title: Financials
  summary: 'Retool''s public evidence supports a hybrid seat-plus-usage SaaS model: builders and internal users create the contracted base, while external users, workflow runs, and AI credits add usage expansion. Demand signals are strong—10,000+ teams, 100M+ hours automated, and Sacra''s $120M ARR estimate for October 2025—but underwriting is still blocked by missing audited financials, no public cash or burn disclosure, and conflicting total-funding estimates of $141M versus $165M.'
sections:
- id: revenue-model-and-pricing
  title: Revenue Model, Packaging, and Revenue Quality
  body: |-
    Retool's public monetization is more nuanced than a simple seat-license SaaS plan. Official pricing and billing documents show at least five monetized units: builder seats, lower-priced internal-user seats, external-user portal access, workflow execution overages, and AI credits or agent hours. That matters for revenue quality because the first two are more contract-like and lend themselves to annual commitments, while the latter three introduce usage sensitivity that can expand spend inside existing accounts but also adds volatility if activity softens. The billing docs also show an enterprise/committed-contract path with ACH or bank-wire payment, suggesting larger accounts can be sold on negotiated annual terms rather than pure self-serve card billing.

    Public list pricing is clear enough to anchor the topline mechanics but not realized pricing. Builder list prices start at $10 per month on Team and $50 per month on Business, while internal users are lower priced and external users are explicitly tiered after the first 50 free seats on Business plans. Workflow runs add another usage meter at $75 per 5,000 additional runs per month, and the 2025 launch cycle added AI credits and agent hours as new monetization units. The revenue-quality positive is that Retool appears to land with seat revenue and expand through automations, portals, and AI features; the negative is that realized enterprise discounts, true net dollar retention, and mix by product are all undisclosed.
