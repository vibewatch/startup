- id: sales-efficiency-and-demand-proxies
  title: Sales Efficiency Proxies and Demand Signals
  body: |-
    Retool does not disclose CAC, payback, sales cycle length, or net revenue retention, so the chapter has to lean on indirect proxies. Those proxies are still meaningful. Retool's homepage says the platform is trusted by 10,000+ teams, while TechCrunch reported more than 500,000 apps built on the platform and billions of queries as of the 2022 financing round. Careers copy says the platform has automated over 100 million hours of work. Together, those signals imply a large installed base and meaningful production usage, even if the company does not publish cohorts or dollar retention.

    Customer evidence is the stronger GTM signal. DoorDash says Retool reduced internal-tool build time from one to two months to 30 to 60 minutes and now supports 40+ operational tools. Plaid says ticket-resolution time improved 80%. Brex says a notification workflow required 75% less code, and Ramp says it built 100+ internal tools in less than a year while attributing roughly $8 million of company savings and 10-20% operational efficiency gains to Retool. These are not CAC or payback metrics, but they do show why a product-led or developer-led expansion motion can work: once a team proves ROI on one workflow, the platform spreads across support, operations, risk, finance, and engineering.
  claimRefs:
