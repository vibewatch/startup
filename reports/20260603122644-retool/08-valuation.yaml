- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Case
  - Indicative valuation band (USD bn)
  - Probability signal
  - Core assumptions
  - Return logic vs $3.2B
  - Downside / confirmation trigger
  rows:
  - - Bull
    - 3.8-5.0
    - Needs multiple positive proofs, not just old private marks
    - Retool discloses revenue quality, retention, and margins; apps/workflows/agents monetize at enterprise scale; review friction stays manageable.
    - Upside of roughly 19%-56% from the last disclosed mark before dilution.
    - Confirmed by fresh price discovery at or above the old mark plus clear metric disclosure.
  - - Base
    - 2.4-3.2
    - Most consistent with current public evidence
    - Product relevance remains real, but public financial disclosure stays thin and no fresh round conclusively re-marks the company upward.
    - Little to no upside from the old mark; investors are paid mostly by optionality, not current proof.
    - Confirmed if company keeps growing but still cannot supply a clean revenue bridge.
  - - Bear
    - 1.2-2.0
    - Triggered by harsh price discovery or worsening scale friction
    - Next financing or secondary clears below the 2022 mark, or public and private software multiples stay compressed while Retool still lacks disclosure.
    - Potential 38%-63% downside to the last disclosed mark before any preference waterfall.
    - Confirmed by a down round, structure-heavy terms, or clear evidence that scale friction limits monetization.
  notes: Scenario bands are analyst estimates anchored to the stale 2022 round, 2026 public comp dispersion, and the absence of current financial disclosure; they are not management targets.
