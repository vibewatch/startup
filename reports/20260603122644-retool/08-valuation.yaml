  evidenceGaps:
  - type: stale
    severity: material
    topic: latest-price-discovery
    missingEvidence: A newer financing, tender, or secondary transaction showing where common equity actually clears after the July 2022 round.
    whyItMatters: A stale headline valuation can overstate current common-equity value in a different software-multiple regime.
    diligencePath: Request the most recent board-approved 409A, any priced secondaries, and any term sheets or banker materials since 2022.
    relatedQuestionRefs:
    - QV004
  - type: private-evidence-only
    severity: blocking
    topic: financial-disclosure
    missingEvidence: Current ARR or GAAP revenue, gross margin, and retention by major product line or customer segment.
    whyItMatters: Without a current denominator, no public comparable multiple can be used with confidence.
    diligencePath: Obtain a current quarter operating deck and management-certified bridge to the last audited period.
    relatedQuestionRefs:
    - QV026
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-overhang
    missingEvidence: Cap-table preferences, anti-dilution protections, option-pool refreshes, and any secondary pricing since 2022.
    whyItMatters: Headline post-money value can differ sharply from the realized outcome for new common-equity investors.
    diligencePath: Request the cap table, investor-rights agreements, and any recent secondary or tender documentation.
    relatedQuestionRefs:
    - QV027
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: exit-readiness
    missingEvidence: Audited financial statements, quality-of-earnings preparation, and any banker or strategic process since 2022.
    whyItMatters: Exit timing and liquidity determine whether upside can be realized on a venture timeline.
    diligencePath: Review board materials, auditor workplans, and any financing or strategic-process updates.
    relatedQuestionRefs:
    - QV031
    relatedTableRefs:
    - TV006
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-set-scope
    missingEvidence: A fully exhaustive universe of every relevant public and private low-code, automation, and workflow comparable.
    whyItMatters: The comparable table is a targeted sample, not a complete software-screen output.
    diligencePath: Expand the comp screen with banker or market-data terminal support if the deal proceeds.
    relatedQuestionRefs:
    - QV020
    relatedTableRefs:
    - TV004
