- id: exit-readiness-and-diligence
  title: Exit readiness, kill triggers, and final diligence asks
  body: 'Retool does not yet look exit-ready in the public-market sense. The company clearly has enough strategic surface area to interest large software or workflow incumbents, and another private round is possible if internal metrics have kept compounding, but the retained public record does not provide the audited, quarterly disclosure standard that public investors would expect. That makes the practical decision framework straightforward. The thesis breaks if the next financing clears below the old mark, if monetization proof still cannot bridge to public multiples, if reliability or implementation friction keeps worsening, or if self-hosted and enterprise complexity erode the value proposition. The diligence path is equally clear: investors need a current ARR or revenue bridge, gross margin and retention data, cohort-level usage quality, cap-table and preference detail, and any secondary pricing since 2022. Until those items exist, the prudent posture is to keep Retool on a research-more
    list rather than to treat the stale $3.2 billion mark as verified fair value.'
