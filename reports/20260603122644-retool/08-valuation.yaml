- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Why it matters
  - Action implication
  rows:
  - - Fresh price discovery below the 2022 mark
    - A new round or secondary clears materially below $3.2B
    - Would prove the old headline was not the right underwriting anchor for new money.
    - Move from research-more toward avoid unless the discount creates obvious upside.
  - - No revenue bridge in diligence
    - Management still cannot supply current ARR/revenue, gross margin, or retention
    - Without those metrics, public-multiple logic remains guesswork.
    - Do not pay through the stale 2022 mark.
  - - Scale friction worsens
    - Independent reviews and support or incident signals deteriorate rather than improve
    - That would weaken the platform-premium argument and expansion case.
    - Reduce valuation range and treat enterprise proof as less durable.
  - - Self-hosting or governance burden outweighs ROI
    - Large customers need heavy DevOps effort or customization workarounds to succeed
    - Implementation friction can cap ACVs and expansion despite strong top-of-funnel interest.
    - Discount the thesis that enterprise controls alone justify a premium.
  - - No credible exit path emerges
    - Still no audited public-style reporting or banker-ready process after deeper diligence
    - Liquidity options remain limited to sponsor appetite and strategic optionality.
    - Keep stance at research-more or avoid rather than underwriting an IPO-like exit.
  notes: These triggers are valuation transmission points rather than generic operating risks; each one can directly cut the multiple or the realizable common-equity outcome.
