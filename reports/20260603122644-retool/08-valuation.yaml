- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Current revenue bridge
    - ARR or GAAP revenue by product line or customer segment
    - This is the missing denominator for every comp-based discussion.
    - Finance diligence pack with current quarter bridge to the last audited period.
  - - Gross margin and unit economics
    - Gross margin, hosting cost, agent cost-to-serve, and contribution margin by product
    - AI and workflow monetization can look attractive in ARR but unattractive in margin.
    - CFO and product-finance review.
  - - Retention and cohort behavior
    - NRR, logo retention, seat expansion, and attach rates across apps, workflows, and agents
    - Needed to test whether platform breadth creates durable expansion or just feature sprawl.
    - Revenue operations and board metrics deck.
  - - Cap table and preference stack
    - Preferred terms, anti-dilution rights, option pool, and any secondary pricing since 2022
    - Headline post-money and realized common value can diverge sharply.
    - Legal cap-table review and investor-rights schedule.
  - - Usage quality and enterprise mix
    - Share of spend from large enterprises, deployment pattern, self-hosted mix, and product penetration
    - Clarifies whether Retool is graduating into a strategic platform or staying a point solution.
    - Go-to-market analytics and customer cohort review.
  - - Exit readiness
    - Audited statements, quality of earnings path, and any banker or strategic outreach
    - Determines whether upside is liquid enough to matter on a venture time horizon.
    - Board materials and external advisor workplan.
  notes: These asks are the minimum package required to convert Retool from a compelling product story into a priceable investment case.
