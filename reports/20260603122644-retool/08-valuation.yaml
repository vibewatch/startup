company:
  name: Retool
chapter:
  number: 8
  title: Valuation
  summary: Retool's last publicly disclosed valuation marker remains the July 2022 $45 million Series C2 at $3.2 billion after a December 2021 step-up round at about $1.85 billion. Product breadth, enterprise controls, and visible customer proof make a premium workflow-platform outcome plausible, but absent current revenue, margin, retention, and cap-table disclosure, the old price still reads stretched against 2026 public comps; the recommendation is RESEARCH-MORE rather than BUY.
sections:
- id: recommendation-frame
  title: Recommendation frame and thesis tension
  body: 'Retool is easier to like as a product than to underwrite at the last publicly disclosed price. The bullish case is visible in the evidence: Retool still presents a broad platform that spans internal apps, workflows, AI agents, governance, and self-hosting, and it publishes customer stories that claim 10x faster development cycles or 65% efficiency gains. TechCrunch also reported more than 500,000 apps built and billions of queries by mid-2022, while Retool now says 10,000-plus teams trust it for production-ready AI applications. The anti-thesis is not that the product lacks relevance; it is that public valuation evidence is stale and incomplete. The last disclosed financing marker remains the July 2022 $3.2 billion round, yet retained public sources still do not disclose current ARR, GAAP revenue, gross margin, or retention. That pushes the recommendation to RESEARCH-MORE, not BUY, at the headline $3.2 billion mark.'
