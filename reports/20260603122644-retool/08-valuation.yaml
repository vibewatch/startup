- id: valuation-context
  title: Valuation context and entry discipline
  body: The core price anchor is old enough that it should be treated as a reference point, not a live clearing price. TechCrunch said Retool raised $45 million at a $3.2 billion valuation in July 2022 after a December 2021 round at roughly $1.85 billion. Our retained independent profile sources still describe that Series C2 step-up as the latest public valuation marker and still categorize the company as a Series C business. That matters because the comp set investors can buy in June 2026 is much better disclosed than Retool is. Public workflow and software names give current revenue, current market cap, and current sales multiples; Retool does not. Entry discipline therefore has to assume more downside than the 2022 headline implies, and it also has to assume that preference terms, anti-dilution, or secondary prices could change real economics materially even if the headline post-money has not changed in public.
