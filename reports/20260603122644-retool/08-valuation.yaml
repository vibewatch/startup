- id: public-comparables-and-scenarios
  title: Public comparables and bull / base / bear ranges
  body: The public comp set is useful precisely because it is disclosed. GitLab, monday.com, Atlassian, UiPath, Asana, Salesforce, and ServiceNow currently span roughly 2.5x to 9.4x sales, with most of the set clustering closer to 3x to 5.5x. That creates a simple but uncomfortable test for Retool. A $3.2 billion valuation implies roughly $800 million of revenue at 4x sales, about $600 million at GitLab's 5.35x, and still about $340 million even at ServiceNow's premium 9.43x multiple. Because none of the retained public Retool sources disclose current revenue, margin, or retention, public evidence cannot tell us where Retool belongs on that range. The bull case therefore requires a disclosure step-up plus proof that apps, workflows, and agents are monetizing at enterprise scale. The base case treats the 2022 round as the top end of a plausible range. The bear case assumes the next real price-discovery event happens in a less forgiving market and below the old headline mark.
