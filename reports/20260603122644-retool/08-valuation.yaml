  title: Recommendation summary table
  columns:
  - Dimension
  - Value
  - Decision implication
  rows:
  - - Recommendation
    - RESEARCH-MORE
    - Do not underwrite the 2022 $3.2B mark as investable fair value without fresh disclosure or a better entry price.
  - - Confidence
    - MEDIUM
    - Product strength is real, but price support is limited by stale valuation context and missing financial metrics.
  - - Risk rating
    - HIGH
    - Downside can compound through multiple compression, missing disclosure, and a weak next price-discovery event.
  - - Valuation stance
    - STRETCHED at last disclosed $3.2B
    - The public comp set does not support paying full premium multiples without a current revenue bridge.
  - - Most attractive entry setup
    - Fresh round or secondary below the last headline mark
    - A lower entry or a data-room-backed reaffirmation would narrow the underwriting gap.
  - - Upgrade trigger
    - Revenue, margin, retention, and cap-table clarity
    - A disclosed economics bridge could move the call from research-more toward track.
  - - Immediate no-go signal
    - Discounted or structure-heavy new financing
    - That would suggest the old paper mark overstated common-equity value.
  notes: Judgment table synthesizing public valuation history, current public comps, and unresolved diligence gaps; it is not management guidance.
