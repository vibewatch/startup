    - Lower-multiple workflow-software floor reference.
    - Does not carry Retool's developer-tool or agent narrative.
  - - UiPath
    - $6.33B market cap; 3.79x sales
    - $1.67B TTM revenue
    - Automation-platform reference for process orchestration and enterprise deployment.
    - RPA heritage and scale differ from Retool's app-builder roots.
  - - Atlassian
    - $27.68B market cap; 4.47x sales
    - $6.19B TTM revenue
    - Collaboration and developer-workflow platform benchmark with strong expansion economics.
    - Much larger installed base and mature public-company profile.
  - - ServiceNow
    - $131.64B market cap; 9.43x sales
    - $13.96B TTM revenue
    - Enterprise-workflow premium ceiling showing what best-in-class platform status can command.
    - A mature workflow operating system, not a like-for-like growth-stage private company.
  - - Salesforce
    - $164.48B market cap; 3.84x sales
    - $42.83B TTM revenue
    - Scaled enterprise-app platform reference for governance-heavy software sold to large enterprises.
    - Very mature go-to-market and margin profile versus private Retool.
