  evidenceGaps:
  - type: missing-source
    severity: material
    topic: regulatory-verification
    missingEvidence: A company-specific DPF participant record or another regulator-maintained record that directly confirms or denies Retool's current transfer-program status.
    whyItMatters: Cross-border transfer marketing is stronger when it can be checked against a current regulator-maintained registry rather than only company legal copy.
    diligencePath: Search the DPF registry for Retool, preserve the participant detail page if present, and reconcile it with the privacy policy and DPA before underwriting EU-facing regulated workloads.
    relatedQuestionRefs:
    - QR005
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: outage-sla-metrics
    missingEvidence: Public or private service-credit terms, MTTR reporting, or incident-response metrics that quantify reliability expectations for recent outages.
    whyItMatters: Incident counts alone do not show how much customer pain, contractual liability, or repeated operational drag those outages create.
    diligencePath: Request enterprise SLA language, last-twelve-month MTTR, sev-1 and sev-2 incident counts, and postmortems for the May 2026 outage cluster.
    relatedQuestionRefs:
    - QR014
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer revenue share, renewal cohorts, NRR, churn, and segmentation by internal versus external-user deployments.
    whyItMatters: Named logos show quality but do not tell an investor whether a handful of large enterprise renewals dominate downside risk.
    diligencePath: Request the top-10 customer list by ARR, gross and net retention by cohort, contract duration distribution, and expansion-versus-contraction bridge.
    relatedQuestionRefs:
    - QR024
    relatedTableRefs:
    - TR004
    - TR006
  - type: private-evidence-only
    severity: blocking
    topic: current-economics
    missingEvidence: Current ARR, revenue growth, gross margin, burn, cash runway, and AI-feature gross-margin impact as of 2026.
    whyItMatters: The latest high-profile valuation evidence is historical, so current downside cannot be underwritten without current economics.
    diligencePath: Pull the 2026 board package or financing deck with ARR, gross margin, burn, net retention, and sales efficiency by product line and hosting model.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR004
    - TR006
  - type: private-evidence-only
    severity: material
    topic: self-hosted-patch-adoption
    missingEvidence: Installed-base patch adoption and vulnerability-remediation completion for self-hosted customers affected by recent SAML and BASE_DOMAIN issues.
    whyItMatters: A vendor-disclosed fix list does not show whether real customers actually applied the patches quickly enough to reduce residual risk.
    diligencePath: Ask for patch-adoption curves by affected release branch, customer notification logs, and the percentage of self-hosted tenants still relying on password authentication.
    relatedQuestionRefs:
    - QR009
    relatedTableRefs:
    - TR002
