- id: TR006
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Privileged-platform compromise
    - Admin controls and phishing resistance
    - Management cannot prove hardware-key enforcement, admin-workflow segregation, and post-incident control testing for sensitive tenants.
    - Treat the thesis as broken for low-volatility enterprise underwriting and move to avoid or demand materially lower price.
  - - Dependency-led outage persistence
    - Public incident cadence
    - A similar cluster of cloud, edge, or orchestration incidents repeats over the next two quarters without clear MTTR improvement.
    - Cut reliability assumptions and underwrite higher churn, slower expansion, and implementation drag.
  - - Self-hosted security hygiene gap
    - Patch-adoption and auth-hardening evidence
    - Management cannot show timely remediation of SAML or BASE_DOMAIN issues and low exposure to password-only self-hosted auth.
    - Assume materially higher residual security risk in the self-hosted base and discount regulated-customer quality.
  - - Commercial-model stress
    - Pricing and renewal evidence
    - Seat expansion requires heavy discounting or management cannot show healthy net expansion on large-user deployments.
    - Lower long-run margin and retention assumptions; valuation support weakens sharply.
  - - Concentration opacity
    - Top-customer disclosure
    - Management refuses to share top-customer mix, NRR, or renewal concentration in diligence.
    - Do not underwrite premium multiple expansion without hard concentration evidence.
  - - Execution capacity miss
    - Closure of governance, observability, and customer-escalation gaps
    - Hiring remains open and platform-control milestones slip while builder growth accelerates.
    - Assume control debt is compounding faster than product adoption and cap the position size or stand down.
  notes: These kill criteria are intentionally monitorable rather than model-perfect because the public evidence is strong on risk shape but weak on private operating metrics.
