      - Relevance
    rows:
      - - Governed internal tools and admin panels
        - >-
          Internal dashboards, CRUD apps, approval apps, ops consoles, and business-process front ends tied to
          enterprise data
        - Website builders, static microsites, and generic public marketing pages
        - Engineering, IT, platform, or operations budgets pay; internal teams use
        - Core direct wedge for Retool and closest fit to product positioning
      - - Workflow automation and operational apps
        - Back-office workflows, human-in-the-loop automations, alerts, routing, and lightweight case management
        - Standalone BPA suites without app-building, or pure RPA spend with no app layer
        - Operations, IT, support, finance, and line-of-business leaders pay; builders and operators use
        - Important included spend because Retool bundles apps, workflows, and agents
      - - Data-heavy dashboards and decision apps
        - Operational analytics, database GUIs, investigation tools, and data-connected control panels
        - Traditional BI seat spend when no action layer or app workflow is involved
        - Data, operations, and functional teams pay; analysts and operators use
        - Strong fit for Retool-style apps built over APIs and databases
      - - External or partner operational portals
        - Supplier, customer, or field portals built from the same governed app platform
        - Standalone public-web products or mass-market consumer SaaS
        - Enterprise customer pays; partners, vendors, or customers use
        - Adjacent but relevant because Retool pricing explicitly includes external users
      - - Open-source or self-hosted internal app platforms
        - Budget spent on Appsmith, ToolJet, Budibase, or similar self-hosted internal-app stacks
        - Horizontal developer tooling that does not solve app delivery end-to-end
        - Platform, IT, or engineering teams pay; internal builders use
        - Direct substitute set that constrains pricing and deployment choices
      - - Status-quo custom code, spreadsheets, and scripts
        - Internal engineering time and shadow tooling used to solve admin, workflow, and ops problems
        - Purchased software categories unrelated to internal operational workflows
        - Functional teams or engineering absorb the cost internally
        - Critical substitute because many buyers still compare Retool against build-it-yourself
      - - Broad no-code website and MVP builders
        - Only the small overlap where a buyer stretches those tools into internal workflows
        - Consumer no-code, landing-page, and SMB website-builder spend
        - Non-technical business users often pay directly
        - Adjacency that inflates broad TAM headlines but is not Retool’s direct SAM
    notes: >-
