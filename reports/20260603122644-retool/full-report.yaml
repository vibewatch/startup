      - number: '8.3'
        title: Product proof, monetization breadth, and adverse friction
        blocks:
          - type: paragraph
            body: >-
              Retool does have the ingredients of a premium platform story. Official pages show monetization across
              builder seats, internal and external users, workflow runs, and hourly AI-agent usage; they also show a
              product surface that now spans app building, workflow orchestration, and agent automation. Enterprise
              materials emphasize SOC 2 Type II controls, SSO, audit logs, RBAC, and self-hosting, while customer proof
              points from Orangetheory, Checkout.com, and Modern Milkman point to meaningful time savings and operating
              leverage. But the evidence also shows why that story cannot be underwritten on slogans alone. Independent
              review sources complain about slowness, pricing rigidity, complexity at scale, and meaningful DevOps
              burden for self-hosting. Retool's own status page also logged a May 2026 mobile sign-in incident. The net
              result is a company with clear strategic relevance and equally clear reasons to demand more proof before
              paying a premium growth multiple.
