  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation frame and thesis tension
        blocks:
          - type: paragraph
            body: >-
              Retool is easier to like as a product than to underwrite at the last publicly disclosed price. The bullish
              case is visible in the evidence: Retool still presents a broad platform that spans internal apps,
              workflows, AI agents, governance, and self-hosting, and it publishes customer stories that claim 10x
              faster development cycles or 65% efficiency gains. TechCrunch also reported more than 500,000 apps built
              and billions of queries by mid-2022, while Retool now says 10,000-plus teams trust it for production-ready
              AI applications. The anti-thesis is not that the product lacks relevance; it is that public valuation
              evidence is stale and incomplete. The last disclosed financing marker remains the July 2022 $3.2 billion
              round, yet retained public sources still do not disclose current ARR, GAAP revenue, gross margin, or
              retention. That pushes the recommendation to RESEARCH-MORE, not BUY, at the headline $3.2 billion mark.
