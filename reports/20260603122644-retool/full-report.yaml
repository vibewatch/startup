      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad low-code TAMs are real but too wide for Retool’s direct market
            body: >-
              The useful market lens is not all no-code or all enterprise applications using low-code features. It is
              the subset of governed internal tools, operational workflows, and data-connected business apps where
              buyers care about security, connectors, deployment control, and portfolio governance.
            calloutType: insight
