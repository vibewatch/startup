      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              Retool's buyer map is better understood through builder economics than through a single industry vertical.
              Retool's own survey spans engineering, operations, product, data, IT, finance, marketing, and
              business-analysis roles, while Searchlab says nearly half of no-code projects are initiated outside IT. In
              practice, that means the user is often an operator or analyst, the builder may sit in engineering, IT, or
              an ops team, and the payer is usually a shared platform, digital-transformation, or functional-operations
              budget. Pricing reinforces that interpretation: Retool splits builders, internal users, and external
              users, while Power Apps sells a premium platform license that can scale to thousands of makers and much
              larger user populations. The adoption path usually runs through enablement rather than pure bottom-up
              virality. Microsoft's CoE guidance explicitly frames low-code as a maker-governance problem, and
              competitor pages from Appian and Mendix emphasize role-based access, orchestration, auditability, and
              integration with existing enterprise systems. So Retool's natural buyer is not the hobbyist citizen
              developer; it is the organization trying to let more people ship operational software without losing IT
              control.
