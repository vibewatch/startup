      - number: '3.2'
        title: Capability, pricing, and go-to-market differences
        blocks:
          - type: paragraph
            body: >-
              Public pricing surfaces show that Retool and its challengers monetize in meaningfully different ways.
              Retool layers builder seats, internal users, external users, and workflow overages, which keeps entry
              pricing simple for a small technical team but can become expensive once a broader operations organization
              uses the product. Superblocks is more quote-led and enterprise-governance heavy. Appsmith uses freemium
              and per-user packaging, Budibase mixes creators and end users, ToolJet prices builders and becomes
              friendlier on unlimited end users, UI Bakery focuses on developer seats with Git and code export, and
              DronaHQ packages around developers and tasks. Capability comparison matters just as much as headline
              price. Retool still exposes one of the broadest public surfaces by combining apps, workflows, agents,
              mobile, and portals, while open-source peers repeatedly emphasize Git, self-hosting, CI/CD, and code
              ownership. Power Apps, Mendix, and OutSystems widen the comparison from low-code convenience into
              governance, runtime control, and lifecycle management, so buyers are often choosing operating model as
              much as raw feature lists.
