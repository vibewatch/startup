        - label: Disclosure quality
          score: 3
          note: No current public ARR, revenue, gross margin, or NRR bridge.
        - label: Valuation support
          score: 4
          note: Public comps bracket the space, but the last private mark still looks full.
        - label: Operational confidence
          score: 5
          note: Good enterprise controls, but reviews and a 2026 incident keep some discount in place.
        - label: Exit readiness
          score: 3
          note: Another private round looks more plausible than a near-term IPO path.
        - label: Overall verdict
          score: 4
          note: Research-more at the stale $3.2B mark; revisit with fresh metrics or better price.
