  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and builder workflow
        blocks:
          - type: paragraph
            body: >-
              Retool is no longer just a drag-and-drop admin-panel builder. Its current public surface combines classic
              apps, workflows, agents, reusable modules, GitHub-backed source control, and enterprise governance inside
              one platform. The official enterprise positioning emphasizes building on top of existing systems with
              standard languages such as JavaScript, Python, and SQL, while the apps and workflows docs show the
              operating model more concretely: teams connect APIs or databases, assemble interfaces, add queries and
              logic, then automate the same business process with scheduled or webhook-driven workflows. Agents extend
              that model further by mixing code, LLM decisions, human approvals, and actions against external systems of
              record.

              The differentiator visible in public materials is therefore workflow compression rather than raw no-code
              simplicity. Retool tries to keep UI building, data access, automation, governance, and deployment inside
              the same control plane, which reduces integration handoffs for internal tools. Modules and custom
              components add reuse and extensibility, but they do so inside Retool’s own runtime and iframe boundaries
              rather than through a fully exportable codebase. Public customer outcomes on the enterprise page suggest
              that this packaging works best for engineering, operations, and data-heavy teams that already think in
              terms of APIs, permissions, and live systems instead of purely visual no-code abstractions.
