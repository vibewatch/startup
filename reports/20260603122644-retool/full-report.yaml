      - number: '4.4'
        title: Capital Adequacy and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              The last clearly disclosed financing remains the July 2022 $45 million Series C2 at a $3.2 billion
              valuation, with PitchBook also marking it as the latest completed deal. That is now several years old
              relative to the 2026 run date. Public databases still disagree on the all-in capital stack—Sacra says
              roughly $141 million total funding, while Tracxn says $165 million across six rounds—so even a basic
              cap-table starting point requires management confirmation. Y Combinator, PitchBook, and Tracxn all show
              Retool as active, but none of the reviewed sources disclose current cash, monthly burn, minimum cash
              covenant, or runway.


              That means the financing-dependency conclusion has to stay conditional. On the positive side, the company
              appears to have continued shipping new monetization surfaces in AI and workflows without a publicly
              disclosed new round, suggesting it is not in obvious distress. On the negative side, the lack of public
              cash-flow visibility means there is no way to determine whether Retool is self-funding growth, quietly
              dependent on secondary liquidity, or simply choosing not to disclose. The SEC Form D guidance is relevant
              process context here: exempt offerings are supposed to be noticed via Form D, but no Retool-specific
              filing surfaced in the reviewed public materials. For underwriting, the absence of a recent financing
              event is not the same thing as proof of capital adequacy.
