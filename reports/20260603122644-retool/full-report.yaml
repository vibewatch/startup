        - >-
          Official customer proof cites 10x faster development cycles, 65% efficiency gains, and dramatic workflow time
          compression.
        - Large ROI claims imply buyers may expand usage once the platform is embedded in operations.
        - Corroborate with retention, seat expansion, and gross-margin-quality metrics.
      - - Thesis
        - >-
          Enterprise controls, self-hosting, and governance features make Retool strategic for regulated or
          security-sensitive customers.
        - Those features can justify higher ACVs and lower churn if customers standardize on the platform.
        - Provide evidence that enterprise controls convert into larger or more durable contracts.
      - - Anti-thesis
        - The latest public valuation marker is still the July 2022 $3.2B round.
        - A stale mark can look comforting while telling investors very little about current clearing price.
        - Produce a newer financing, secondary, or audited financial bridge that supports the old mark.
      - - Anti-thesis
        - Public sources do not disclose current ARR, revenue, gross margin, or NRR.
        - Without the denominator, no public multiple-based underwriting can be precise.
        - Open the data room to current operating metrics and cohort behavior.
      - - Anti-thesis
        - Independent reviews point to slowness, pricing friction, customization limits, and scale complexity.
        - Those frictions can cap expansion or force buyers to discount the platform at larger scale.
        - Show enterprise renewal quality, usage expansion, and lower incident or support friction.
