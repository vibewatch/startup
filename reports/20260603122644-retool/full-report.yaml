    rows:
      - - Thesis
        - Retool spans internal apps, workflows, and AI agents with multiple monetization levers.
        - A broader product surface can support a premium valuation if attach rates and expansion economics are strong.
        - Show segment mix, attach rates, and net retention across apps, workflows, and agents.
