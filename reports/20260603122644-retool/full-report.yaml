      - number: '2.2'
        title: Evidence-Constrained TAM, SAM, and Public Market Lenses
        blocks:
          - type: paragraph
            body: >-
              Public sizing lenses are directionally useful but not directly convertible into a Retool TAM. The broadest
              2026 lens is about USD 65 billion for the combined no-code/low-code market, with about USD 39 billion
              attributed to low-code alone. Narrower low-code development-platform estimates drop to roughly USD 31.59
              billion in 2026, while another source places the market as high as USD 66.2 billion because it uses a
              different category definition and forecast base. Adoption-share lenses are similarly large: Searchlab
              cites 70% of new apps using no-code/low-code by 2026, while ToolJet cites Gartner's 75% forecast for new
              enterprise applications. The right conclusion is not to average these numbers, but to preserve the
              contradiction: broad market headlines include categories Retool does not fully own, while narrower
              low-code-platform estimates still include more software than governed internal tools and workflow apps.
              Public evidence supports a 'large and growing' market call, but not a clean SAM or SOM for Retool without
              customer-mix, ACV, deployment-model, and expansion-rate disclosures.
