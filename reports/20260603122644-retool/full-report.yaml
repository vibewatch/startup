  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      The decision starts with product breadth and proof, but it flows through stale valuation context and disclosure
      gaps before landing on a research-more stance.
    data:
      nodes:
        - id: mark
          label: 'Last disclosed mark: $3.2B (2022)'
          detail: Useful historical anchor, but not a live price-discovery event.
        - id: proof
          label: Product and customer proof
          detail: Apps, workflows, agents, ROI claims, and large-customer references support relevance.
        - id: friction
          label: Scale and pricing friction
          detail: Reviews flag slowness, pricing rigidity, customization limits, and scale complexity.
        - id: disclosure
          label: No public revenue bridge
          detail: Public sources still do not disclose ARR, revenue, gross margin, or NRR.
        - id: decision
          label: RESEARCH-MORE / stretched
          detail: Need fresher price discovery or diligence-grade metrics before underwriting the old mark.
      edges:
        - from: mark
          to: decision
          label: anchors
        - from: proof
          to: decision
          label: supports
        - from: friction
          to: decision
          label: constrains
        - from: disclosure
          to: decision
          label: limits
        - from: proof
          to: disclosure
          label: still needs metrics
    approximationNotes: This flow expresses causal logic rather than probability weights.
    claimRefs:
      - CV001
      - CV017
      - CV024
      - CV029
      - CV041
      - CV046
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      The strongest positive driver is a genuine disclosure step-up; the strongest negatives are missing economics and
      multiple compression.
    data:
      items:
        - label: Apps + workflows + agents breadth
          value: 2.5
          detail: Supports a platform-premium narrative if monetization quality is proven.
        - label: Enterprise proof and ROI
          value: 2
          detail: Customer stories and 10,000-plus teams support strategic relevance.
        - label: Missing ARR / revenue / NRR bridge
          value: -4.5
          detail: Largest single blocker to comp-based underwriting.
        - label: Stale 2022 price anchor
          value: -3.5
          detail: Old round provides context but not a fresh clearing price.
        - label: Pricing and scale friction
          value: -2.5
          detail: Independent reviews warn adoption can become costly or messy.
        - label: 2026 mobile sign-in incident
          value: -1
          detail: A modest but real enterprise-trust discount.
        - label: Fresh data-room metrics
          value: 4
          detail: Would be the cleanest upgrade catalyst if management can supply them.
    approximationNotes: Sensitivity bars are ordinal impact scores on the investment case, not direct changes in enterprise value.
    claimRefs:
      - CV017
      - CV020
      - CV021
      - CV026
      - CV027
      - CV029
      - CV041
