  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      Security and dependency risks rank highest because Retool sits on privileged internal workflows and recent public
      evidence shows both control failures and repeated service incidents.
    data:
      columns:
        - Probability
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Privileged-platform compromise
          values:
            - label: medium
              tone: warning
              detail: >-
                The platform already suffered a material 2023 cloud-customer takeover incident and still discloses
                auth-related vulnerabilities.
            - label: critical
              tone: negative
              detail: >-
                Compromise can reach internal support, admin, or regulated workflows rather than a narrow SaaS feature
                boundary.
            - label: medium
              tone: warning
              detail: >-
                Retool publishes SOC 2 materials, vulnerability handling, logging, and incident procedures, but the
                attack surface remains privileged.
            - label: high
              tone: negative
              detail: >-
                Residual exposure stays high until diligence proves hardened admin controls and strong self-hosted patch
                hygiene.
        - label: Dependency-led outages
          values:
            - label: high
              tone: negative
              detail: Public trackers show a meaningful 2026 incident cluster plus a longer historical outage record.
            - label: high
              tone: negative
              detail: >-
                Downtime can block internal operations, self-hosted workflow workers, or connectors that customers treat
                as production systems.
            - label: medium
              tone: warning
              detail: >-
                Retool documents on-call coverage, DR, and observability hiring, but public MTTR and service-credit data
                are thin.
            - label: high
              tone: negative
              detail: Residual severity remains high until outage rate and dependency hygiene clearly improve.
        - label: Shared privacy and regulatory burden
          values:
            - label: medium
              tone: warning
              detail: The legal pack is clear that customers remain controllers and must own regulated use-case compliance.
            - label: high
              tone: negative
              detail: >-
                Failures in data handling or requests can spill into underwriting, KYC, healthcare, and other sensitive
                workflows.
            - label: medium
              tone: warning
              detail: >-
                DPA, SCCs, request policies, and subprocessor controls exist, but registry-level verification is
                incomplete from public evidence.
            - label: medium-high
              tone: warning
              detail: Residual exposure is manageable only with customer-specific controls and contract diligence.
        - label: Commercial-model and renewal friction
          values:
            - label: medium-high
              tone: warning
              detail: Pricing and reviews point to cost sensitivity once deployments spread beyond a small builder cohort.
            - label: medium-high
              tone: warning
              detail: If seat friction or performance complaints compound, renewal quality and margin can weaken.
            - label: low-medium
              tone: warning
              detail: The public pack lacks current NRR, cohort retention, or pricing-realization data.
            - label: medium-high
              tone: warning
              detail: Residual risk stays elevated until management provides current retention and unit-economics evidence.
        - label: Execution debt in governance and support
          values:
            - label: medium-high
              tone: warning
              detail: >-
                Current roles show Retool is still staffing key control and customer-execution functions while AppGen
                broadens the builder base.
            - label: high
              tone: warning
              detail: >-
                If governance, observability, or technical-customer-experience capacity lags growth, incidents and
                renewals can suffer.
            - label: medium
              tone: warning
              detail: The company is investing directly, but current public evidence does not show those gaps already closed.
            - label: medium-high
              tone: warning
              detail: Residual risk is meaningful until execution proof catches up to positioning.
    approximationNotes: >-
      Probability, impact, mitigation maturity, and residual severity are ordinal judgments anchored to cited public
      evidence rather than modeled actuarial probabilities.
    claimRefs:
      - CR006
      - CR009
      - CR021
      - CR023
      - CR031
      - CR045
      - CR050
      - CR051
      - CR052
  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      The main downside chain runs from privileged access and dependency failures into customer downtime, trust loss,
      weaker renewals, and valuation pressure.
    data:
      nodes:
        - id: builder-expansion
          label: Broader builder base
          detail: AppGen expands creation beyond traditional engineers.
          tone: warning
        - id: privileged-access
          label: Privileged data and code access
          detail: Apps, workflows, and agents can touch sensitive systems and execute code.
          tone: negative
        - id: control-gap
          label: Governance/control gap
          detail: Policy, AppSec, and observability work is still scaling.
          tone: warning
        - id: security-event
          label: Security event
          detail: Breach or auth-layer exploit affects customer environments.
          tone: negative
        - id: dependency-failure
          label: Dependency failure
          detail: AWS, Cloudflare, Temporal, connector, or model-provider failure interrupts service.
          tone: negative
        - id: customer-ops
          label: Customer operations disrupted
          detail: Support, finance, healthcare, or logistics workflows stop or degrade.
          tone: negative
        - id: trust
          label: Customer trust loss
          detail: Incidents reduce willingness to expand high-risk use cases.
          tone: negative
        - id: renewals
          label: Renewal and expansion pressure
          detail: Pricing scrutiny and lower confidence compress upsell and retention.
          tone: warning
        - id: valuation
          label: Valuation downside
          detail: Opaque current economics make downside sharper if renewals weaken.
          tone: negative
      edges:
        - from: builder-expansion
          to: privileged-access
          label: more apps and agents touch live systems
          tone: warning
        - from: privileged-access
          to: control-gap
          label: raises governance burden
          tone: warning
        - from: control-gap
          to: security-event
          label: hardens too slowly
          tone: negative
        - from: dependency-failure
          to: customer-ops
          label: breaks internal tools and workflows
          tone: negative
        - from: security-event
          to: customer-ops
          label: compromises privileged workflows
          tone: negative
        - from: customer-ops
          to: trust
          label: damages confidence in platform-critical use
          tone: negative
        - from: trust
          to: renewals
          label: slows expansion and raises scrutiny
          tone: negative
        - from: renewals
          to: valuation
          label: weakens multiple support
          tone: negative
        - from: dependency-failure
          to: valuation
          label: adds reliability discount
          tone: warning
    claimRefs:
      - CR003
      - CR006
      - CR019
      - CR020
      - CR023
      - CR031
      - CR034
      - CR036
      - CR037
      - CR050
      - CR052
      - CR053
  - id: FR003
