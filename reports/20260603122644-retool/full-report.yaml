companyProfile:
  summary: >-
    Retool is a San Francisco-based internal-tools platform founded in 2017 that lets enterprises build apps, workflows,
    mobile experiences, and AI agents on top of their existing data systems without starting from scratch. Public
    evidence supports strong product breadth, real enterprise customer proof, and a meaningful 2021-2022 valuation
    step-up, but the variables that matter most for late-stage underwriting—current ARR quality, margins, retention,
    concentration, and any newer price discovery—remain only partially public. The result is a strategically relevant
    developer-tool asset with credible adoption and incomplete economics disclosure.
