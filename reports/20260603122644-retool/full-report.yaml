            title: App sprawl and migration pain are category risks, not edge cases
            body: >-
              Shadow demand is strong, but the same forces that expand adoption also create sprawl, unclear ownership,
              rewrite risk, and vendor-lock-in anxiety. If Retool cannot convert fast starts into governed standards,
              the market can stay large while durable share stays smaller than TAM headlines imply.
            calloutType: risk
