            body: >-
              Retool’s current roadmap signal is dominated by AI-assisted building and broader enterprise controls. The
              2026 stable release notes show concrete product motion around A2A support for agents, multipage Assist,
              hardened images, resource type restrictions for self-hosted organizations, role-based access controls for
              Assist, and general availability for multi-instance Source Control releases. The company-owned releases
              feed and forum add a near-term layer on top of that with MCP, workflow analytics, audit logs across
