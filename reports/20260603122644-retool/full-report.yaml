  - id: TP001
    title: Competitor profile table
    columns:
      - Competitor
      - Category
      - Scale or public signal
      - Target segment
      - Product scope
      - Strategic direction
      - Limitation versus Retool
    rows:
      - - Retool
        - Reference platform
        - 500k+ apps built and $3.2B valuation signal in 2022 reporting
        - Developers and operations teams building internal business software
        - Apps, workflows, agents, mobile, portals, governance
        - Standardize internal app delivery on one governed surface
        - Portability and code ownership are weaker than open-source or code-export rivals
      - - Superblocks
        - Direct enterprise peer
        - Snowflake and Databricks customer proof on home surface; quote-led enterprise motion
        - IT, platform engineering, and governed business builders
        - AI-assisted internal apps, integrations, hosted apps, hybrid and cloud-prem deployment
        - Win enterprise control concerns with Git, secrets, and VPC deployment
        - Less transparent entry motion and less public evidence of broad self-serve adoption
      - - Appsmith
        - Open-source direct peer
        - Open-source flagship plus enterprise packaging and Git-based CI/CD positioning
        - Developer-led internal app teams from startup to enterprise
        - Internal apps, data tools, workflows, reusable packages, embedding
        - Offer a Retool-like builder with more code-level transparency and self-hosting flexibility
        - Less evidence of the same all-in-one surface breadth across mobile, portals, and workflows
      - - Budibase
        - Open-source direct peer
        - Open-source repo and self-host posture; governments and enterprises cited on home page
        - CRUD-heavy internal app and operations teams
        - Apps, automations, agents, built-in DB, self-hosted operations
        - Own sovereignty-sensitive and smaller-team workflows with OSS economics
        - Public surface is strongest for operations and CRUD, not for broad portal or mobile breadth
      - - ToolJet
        - Open-source direct peer
        - 36,558 GitHub stars and 1,000+ companies claimed
        - Engineering teams and mixed builder or developer teams
        - Internal apps, workflows, AI app builder, built-in DB, plugins
        - Blend OSS portability with enterprise security and builder-priced economics
        - Less public evidence of mission-critical incumbent-style ALM depth
      - - UI Bakery
        - Adjacent portability-led substitute
        - 55,000+ stars across repos claimed and code-export positioning
        - Teams that want fast internal apps without giving up code ownership
        - Internal apps, automations, Git version control, code export, self-hosting
        - Compete on portability and readable React export
        - Smaller public brand and fewer visible enterprise deployment claims than Retool
      - - DronaHQ
        - Adjacent builder substitute
        - Builder-priced plans and broad connector catalog
        - Developers, IT professionals, and business teams needing employee portals or ops apps
        - Internal tools, mobile and web apps, connectors, automations, AI credits
        - Compete on lighter packaging and fast connector-led app building
        - Weaker public scale and governance proof than top enterprise peers
      - - Microsoft Power Apps
        - Installed-base incumbent and status quo substitute
        - Microsoft admin, Dataverse, and template ecosystem
        - Microsoft-centric enterprises and citizen-developer programs
        - Canvas and model-driven apps, templates, connectors, Dataverse governance
        - Convert existing Microsoft estates into internal app platforms
        - More Microsoft-centric and less focused on engineering-style custom internal tooling
      - - Mendix
        - Enterprise ALM incumbent
        - Mission-critical tiering plus multiple deployment options including government and server-based
        - Large enterprises with portfolios of business applications
        - Low-code app platform, cloud or private deployments, lifecycle tooling
        - Win where portfolio governance and runtime control matter more than trial speed
        - Less self-serve and slower-feeling for teams that just want an internal tool quickly
      - - OutSystems
        - Enterprise ALM incumbent
        - Quote-led enterprise pricing with built-in DevSecOps and optional self-hosting
        - IT and digital-transformation groups building enterprise-grade apps
        - AI development platform, CI/CD, deploy-anywhere, runtime management
        - Win on enterprise engineering control and mission-critical delivery
        - Much less transparent pricing and often heavier process than Retool
    notes: >-
      Scale cells use the strongest supportable public signal rather than forcing revenue or funding figures that peers
      do not disclose consistently.
