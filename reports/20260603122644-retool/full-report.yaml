      - number: '7.4'
        title: Customer, concentration, and commercial-model risk
        blocks:
          - type: paragraph
            body: >-
              Retool has real customer proof, but the same evidence shows why customer and model risk should stay on the
              table. The platform is used by large, operationally important accounts including Brex, Plaid, DoorDash,
              and UTMB, and the outcomes Retool publishes are strong: faster build cycles, faster support resolution,
              and regulated AI workflows deployed quickly. Retool also markets directly into financial-services use
              cases like underwriting, KYC, and risk operations. That strengthens the case that this is not just a
              prototyping tool. It also means outages, permission mistakes, or account-takeover events can hit workflows
              tied to regulated decisions or revenue operations.


              The commercial model is harder to underwrite from public evidence. Pricing separates builders from
              internal users, puts many governance features in higher tiers, and leaves external-user economics custom.
              External reviews argue that the seat model becomes more painful at scale and that complex apps can become
              slow or operationally awkward. Public evidence is also thin where investors most want clarity: the
              retained source set does not disclose 2026 ARR, gross margin, burn, NRR, or customer concentration. The
              last headline valuation evidence is from 2022. That does not make Retool a broken business, but it means
              the downside case has to assume meaningful renewal, pricing, and concentration uncertainty until diligence
              gets cohort data and current economics.
