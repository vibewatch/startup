    title: Investment KPIs
    type: kpi
    layout: compact
    summary: Product breadth and customer proof score well; valuation clarity and exit readiness remain the weakest dimensions.
    data:
      items:
        - label: Product breadth
          score: 8
          note: Apps, workflows, agents, and enterprise controls create real platform optionality.
        - label: Customer proof
          score: 7
