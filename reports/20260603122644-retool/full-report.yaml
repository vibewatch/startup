  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk overview and residual ranking
        blocks:
          - type: paragraph
            body: >-
              Retool's highest residual risk is privileged-platform risk rather than simple low-code category risk. The
              product is explicitly designed to let customers connect sensitive databases and APIs, run code and AI
              actions, and increasingly let a broader population of builders ship applications under centralized
              governance. That is powerful, but it also means a control failure can move quickly from one vendor into
              the customer's own operational systems. The 2023 cloud-account takeover event, recent SAML and self-hosted
              vulnerability disclosures, and the visible 2026 outage stream all show that the downside is not
              hypothetical.


              The next layer is dependency and reliability risk. Retool's cloud posture depends on AWS and Cloudflare,
              self-hosted workflow orchestration can still depend on Retool-managed Temporal, and AI features rely on
              third-party model or search providers. Public outage trackers show real incidents across core cloud
              availability, edge distribution, licensing, and third-party connectors. The commercial side is less acute
              than the security side, but still material: pricing gates many control features to higher tiers, external
              reviews flag performance and seat-cost friction, and the public pack does not disclose concentration,
              retention, or current 2026 economics. Finally, execution risk remains visible because Retool is still
              hiring specifically into application security, observability, governance, and technical
              customer-experience management while AppGen expands the builder base beyond traditional engineers. The
              heatmap and transmission map below rank those exposures by residual severity rather than by headline
              familiarity.
            claimRefs:
              - CR001
              - CR003
              - CR006
