      - number: '5.2'
        title: Architecture, deployment, and integration model
        blocks:
          - type: paragraph
            body: >-
              Retool’s public architecture story is unusually explicit for self-hosting and fairly high level for cloud.
              The security practices page says Retool Cloud runs as a multitenant AWS service, while the self-hosted
              docs split the world into Retool-managed and self-managed single-tenant deployments. In the Retool-managed
              model, customers keep ownership of the VPC, keys, access, and network infrastructure while Retool operates
              through a narrowly scoped Runner VM plus AWS-native services such as Secrets Manager, EKS, and RDS. In the
              self-managed model, the docs go deeper and enumerate the actual service topology: api, jobs-runner,
              workflows-worker, workflows-backend, agent-worker, agent-eval-worker, and code-executor containers, with
              nsjail-based sandboxing and explicit scaling guidance.

              That architecture makes Retool powerful but also reveals its dependencies. Workflow execution depends on
              Temporal workers and code execution services, managed deployments depend heavily on AWS primitives, and
              real enterprise source control depends on a dedicated GitHub repository plus a GitHub App with write
              access to contents and pull requests. The GitHub resource docs also show outbound-region and allowlist
              requirements, which means networking and data-source reachability still matter operationally even in a
              low-code product. Public GitHub repos, official Helm assets, and the custom-component guide confirm that
              Retool supports serious operator and developer extensions, but they also reinforce that buyers are
              adopting a platform, not a lightweight front-end widget.
