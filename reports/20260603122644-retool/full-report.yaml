            body: >-
              Retool’s clearest expansion pattern is land-and-expand inside accounts. DoorDash and Ramp started with
              internal operations needs and ended up with dozens or hundreds of tools. Orangetheory expanded from
              internal modernization into external franchisee apps. ClickUp and SafetyCulture show that once Retool is
              embedded as an app, workflow, and agent layer, more teams start building on top of the same governed
              foundation. This pattern is strategically positive because it suggests expansion can come from breadth of
              use case rather than only adding net-new logos.


              The friction points are equally visible. AWS Marketplace, the partner program, and the integrations
              catalog all help Retool widen procurement and deployment routes, especially for enterprises that want
              marketplace billing or SI help. But the pricing structure also makes clear that SSO, source control, audit
              logging, advanced permissions, and most serious external-user motion sit behind higher-tier or custom
              contracts. Independent commentary adds that self-hosting can be DevOps-heavy, while reviews and the status
              page show performance and reliability are good but not flawless. Concentration is the biggest unresolved
              risk: Retool discloses marquee logos and a 10,000-plus-company claim, but not what percentage of ARR comes
              from those logos, from marketplaces, or from a few large verticals. That leaves the customer story
