      - number: '3.3'
        title: Switching cost, multi-homing, and internal-build escape hatches
        blocks:
          - type: paragraph
            body: >-
              Retool does create real switching cost once a team has standardized on its spaces, source control,
              environment variables, audit logs, self-hosting, and governance patterns. That stickiness gets stronger if
              the same platform also handles workflows, portals, mobile experiences, and AI agents, because each
              additional use case reduces the appeal of point-tool replacement. But the public record also shows clear
              escape hatches. Appsmith, Budibase, ToolJet, and UI Bakery all market some combination of open-source
              licensing, code export, self-hosting, or direct Git control, which lowers the practical cost of
              multi-homing or migrating away. Microsoft estates can often solve a large portion of the job inside
              existing governance, while Mendix and OutSystems become compelling when the buyer values multi-runtime ALM
              and mission-critical process control more than Retool's speed. The result is not zero lock-in, but
              conditional lock-in: Retool is sticky when it becomes the standard operating surface, and less sticky when
              buyers insist on owning code, infrastructure, or incumbent suite alignment.
