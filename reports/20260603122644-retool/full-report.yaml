  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Why it matters
      - Action implication
    rows:
      - - Fresh price discovery below the 2022 mark
        - A new round or secondary clears materially below $3.2B
        - Would prove the old headline was not the right underwriting anchor for new money.
        - Move from research-more toward avoid unless the discount creates obvious upside.
      - - No revenue bridge in diligence
        - Management still cannot supply current ARR/revenue, gross margin, or retention
        - Without those metrics, public-multiple logic remains guesswork.
        - Do not pay through the stale 2022 mark.
      - - Scale friction worsens
        - Independent reviews and support or incident signals deteriorate rather than improve
        - That would weaken the platform-premium argument and expansion case.
        - Reduce valuation range and treat enterprise proof as less durable.
      - - Self-hosting or governance burden outweighs ROI
        - Large customers need heavy DevOps effort or customization workarounds to succeed
        - Implementation friction can cap ACVs and expansion despite strong top-of-funnel interest.
        - Discount the thesis that enterprise controls alone justify a premium.
      - - No credible exit path emerges
        - Still no audited public-style reporting or banker-ready process after deeper diligence
        - Liquidity options remain limited to sponsor appetite and strategic optionality.
        - Keep stance at research-more or avoid rather than underwriting an IPO-like exit.
    notes: >-
      These triggers are valuation transmission points rather than generic operating risks; each one can directly cut
      the multiple or the realizable common-equity outcome.
    claimRefs:
      - CV026
      - CV027
      - CV028
      - CV029
      - CV041
      - CV045
      - CV047
      - CV048
      - CV049
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Current revenue bridge
        - ARR or GAAP revenue by product line or customer segment
        - This is the missing denominator for every comp-based discussion.
        - Finance diligence pack with current quarter bridge to the last audited period.
      - - Gross margin and unit economics
        - Gross margin, hosting cost, agent cost-to-serve, and contribution margin by product
        - AI and workflow monetization can look attractive in ARR but unattractive in margin.
        - CFO and product-finance review.
      - - Retention and cohort behavior
        - NRR, logo retention, seat expansion, and attach rates across apps, workflows, and agents
        - Needed to test whether platform breadth creates durable expansion or just feature sprawl.
        - Revenue operations and board metrics deck.
      - - Cap table and preference stack
        - Preferred terms, anti-dilution rights, option pool, and any secondary pricing since 2022
        - Headline post-money and realized common value can diverge sharply.
        - Legal cap-table review and investor-rights schedule.
      - - Usage quality and enterprise mix
        - Share of spend from large enterprises, deployment pattern, self-hosted mix, and product penetration
        - Clarifies whether Retool is graduating into a strategic platform or staying a point solution.
        - Go-to-market analytics and customer cohort review.
      - - Exit readiness
        - Audited statements, quality of earnings path, and any banker or strategic outreach
        - Determines whether upside is liquid enough to matter on a venture time horizon.
        - Board materials and external advisor workplan.
    notes: >-
      These asks are the minimum package required to convert Retool from a compelling product story into a priceable
      investment case.
    claimRefs:
      - CV041
      - CV046
      - CV047
      - CV050
