            body: >-
              The strongest argument for Retool remains breadth plus brand. Independent reporting gives it meaningful
              historical scale, and the enterprise surface now spans apps, workflows, agents, mobile, and governance in
              one stack. That combination is not trivial for a challenger to replicate quickly. Still, the moat is not
              absolute. Retool's own trust center documents a recent SAML-related account takeover risk and a separate
              self-hosted host-header issue, while the status page shows a public multi-day mobile login incident in
