      - number: '7.3'
        title: Operational resilience and partner-dependency risk
        blocks:
          - type: paragraph
            body: >-
              Retool's public security and workflow materials show a layered but dependency-heavy stack. Core cloud
              delivery runs on multitenant AWS infrastructure, DDoS and edge protection rely on Cloudflare, and
              self-hosted workflow users can still depend on Retool-managed Temporal if they choose that mode. The
              subprocessor list shows that AI features add another dependency bundle across OpenAI, Anthropic, Baseten,
              Tavily, and ClickHouse. This matters because Retool is not just a UI builder; it is an operational fabric
              for internal software, automations, agents, and connectors. When a dependency fails, it can break
              everything from internal dashboards to workflow workers.


              The 2026 outage record supports treating this as a real residual exposure. IsDown shows 123 outages since
              January 2020 and 26 in the prior twelve months, including cloud-user 504s, multi-hour page-not-found
              incidents, a licensing degradation that blocked self-hosted workers using Retool-managed Temporal, a
              three-day retool-edge distribution incident, and multi-day Google Sheets and MotherDuck failures. Retool
              does document on-call coverage, disaster-recovery testing, and backup procedures, and the observability
              hiring plan suggests the company is still investing in reliability tooling. But the public record still
              points to a platform whose risk comes not only from one catastrophic breach, but also from a long tail of
              partner, edge, orchestration, and connector failures that can interrupt business-critical internal
              operations.
