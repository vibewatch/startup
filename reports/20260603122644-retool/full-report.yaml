chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, stage, and operating model
        blocks:
          - type: paragraph
            body: >-
              Retool is a San Francisco-based private software company founded in 2017 by David Hsu after the failure of
              Cashew, the peer-to-peer payments startup he took through Y Combinator. The reviewed official, investor,
              and accelerator sources all point to the same origin: Hsu and team discovered that the repetitive internal
              tools they had built around fraud, KYC, and operations were more promising than the original fintech
              business. That origin still matters because Retool’s product and messaging remain rooted in the idea that
              internal software is strategically important but wasteful to build from scratch.


              Today, Retool presents itself as an enterprise AppGen platform for internal software development. In
              practical terms, the company sells a governed platform for building internal apps, workflows, mobile apps,
              and AI agents on top of existing databases and APIs. The product narrative is consistent across the
              homepage, pricing, AWS release, and third-party coverage: Retool tries to keep the bespoke parts of
              software in code while abstracting the repetitive parts into building blocks, permissions, integrations,
              deployment controls, and AI-assisted generation. That is a stronger and more specific identity than
              generic “low-code” positioning.


              The business model is also unusually explicit for a private company. Retool prices builders, internal
              users, and external users separately, layers on pooled AI credits, and bills agents independently by time
              used. Public scale evidence is strongest on adoption and customer outcomes rather than audited financial
              depth. Official materials now say Retool is trusted by more than 10,000 organizations or teams worldwide,
              while TechCrunch reported more than 500,000 apps and billions of queries by mid-2022. Customer proof on
              the homepage and Ramp story shows concrete ROI, but the public record is still thinner on current
              headcount and audited revenue.
