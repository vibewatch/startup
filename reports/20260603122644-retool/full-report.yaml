      - number: '7.2'
        title: Legal, privacy, and privileged-platform security risk
        blocks:
          - type: paragraph
            body: >-
              Retool's legal and regulatory posture is strongest where it is most explicit: the privacy policy and DPA
              clearly place the customer in the controller role for Customer Data and Retool in the processor role,
              spell out SCC-based transfer mechanics, and document how regulator and law-enforcement requests are
              handled. Those documents are helpful, but they also clarify the underwriting problem: Retool is not a
              plug-and-play compliance transfer. If a customer uses Retool for underwriting, KYC, clinical review, or
              other regulated workflows, the customer still owns the legality of the data and many of the deployment
              choices, while Retool remains a processor that can still access accounts for troubleshooting and can add
              subprocessors over time.


              The security history raises the residual severity. Retool's own breach write-up says a 2023 smishing and
              deepfake attack led to 27 cloud-customer account takeovers, and independent reporting ties that event to
              meaningful downstream loss at Fortress Trust. The Trust Center adds more recent evidence that the attack
              surface remains privileged and sensitive: SAMLStorm affected SAML SSO organizations and a separate 2025
              disclosure warned some self-hosted instances about host-header and authentication misconfiguration. The
              company does show real mitigations — visible SOC 2 materials, a vulnerability disclosure program,
              documented backup and incident processes, and a zero-trust separation between cloud and on-prem — but the
              residual risk remains high because the platform can sit directly in front of sensitive production systems.
