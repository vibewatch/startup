evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance-board-disclosure
    missingEvidence: >-
      Current board roster, committee structure, and named executive bench with ownership of finance, security, product,
      and people.
    whyItMatters: >-
      Founder concentration is visible, but formal governance and succession cannot be assessed from the public record
      alone.
    diligencePath: Request the latest board materials, org chart, and investor-rights summary directly from the company.
    relatedQuestionRefs:
      - QO011
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: funding-precision
    missingEvidence: >-
      Cap table, secondaries, debt instruments, and exact lifetime capital raised, including any option refreshes or
      structured financing.
    whyItMatters: Public sources disagree on total funding and do not reveal dilution, control rights, or downside protections.
    diligencePath: Request the cap table, financing documents, and any debt or secondary transaction schedules.
    relatedQuestionRefs:
      - QO016
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A current employee count by geography and function as of the run date.
    whyItMatters: >-
      Public directories disagree materially, so headcount cannot be used confidently in burn, productivity, or capacity
      analysis.
    diligencePath: Request an HRIS export or management-certified headcount snapshot for 2026-06-03.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Audited or board-approved 2024-2025 revenue, ARR, growth, gross margin, and retention metrics.
    whyItMatters: Valuation, efficiency, and downside cases cannot be pressure-tested on third-party ARR estimates alone.
    diligencePath: Request audited financials or the latest board-approved KPI pack before relying on ARR multiples.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: leadership-bench
    missingEvidence: >-
      A current executive roster beyond David Hsu, with role definitions and tenure for product, finance, engineering,
      and people leaders.
    whyItMatters: Public sources surface only selective leaders, limiting bench-strength assessment and key-person risk calibration.
    diligencePath: Request a current leadership org chart and executive bios as part of management diligence.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: minor
    topic: milestone-table-coverage
    missingEvidence: >-
      Internal product roadmap dates, undisclosed governance changes, and any omitted customer or financing events that
      would make the chronology exhaustive.
    whyItMatters: >-
      The public milestone chronology is strong enough for a usable narrative, but it is still assembled from
      outward-facing sources and may miss internal milestones.
    diligencePath: >-
      Request a board-level timeline or company operating history log to confirm whether any material milestone is
      missing from TO004.
    relatedQuestionRefs:
      - QO017
      - QO018
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: retool-specific-market-sizing
    missingEvidence: >-
      Retool-specific customer counts, ACV ranges, workflow mix, and revenue split across builders, internal users, and
      external users.
    whyItMatters: >-
      Without buyer-level revenue mix and pricing realization, a public Retool SAM or obtainable-share model would be
      mostly assumption rather than evidence.
    diligencePath: >-
      Ask management for customer segmentation, annual contract values, and the share of revenue tied to internal apps,
      workflows, agents, and external portals.
    relatedQuestionRefs:
      - QM007
      - QM026
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: market-size-methodology
    missingEvidence: Primary analyst methodology pages showing exactly which product categories sit inside each 2026 market estimate.
    whyItMatters: >-
      The published range from roughly USD 31.59B to USD 66.2B is too wide to collapse into one headline without
      understanding each provider’s inclusion rules.
    diligencePath: >-
      Obtain primary Gartner, Mordor Intelligence, and Business Research Company excerpts or analyst calls that define
      the no-code, low-code, and enterprise-application boundaries.
    relatedQuestionRefs:
      - QM006
      - QM007
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-mix-and-deployment-profile
    missingEvidence: Revenue share by buyer persona, department, regulated vertical, and cloud versus self-hosted deployment choice.
    whyItMatters: >-
      Those facts determine whether Retool is primarily an engineering tool, a business-systems platform, or a regulated
      internal-app control plane, which changes both valuation multiples and retention expectations.
    diligencePath: >-
      Request pipeline and installed-base cuts by department, self-hosted share, regulated-customer share, and upsell
      motion from builders to broader internal-user bases.
    relatedQuestionRefs:
      - QM009
      - QM011
      - QM018
      - QM026
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: minor
    topic: migration-and-pricing-realization
    missingEvidence: >-
      Win-loss data against Power Apps, custom code, and open-source alternatives plus real migration stories away from
      low-code platforms.
    whyItMatters: >-
      List pricing and category rhetoric do not show whether Retool can hold price, expand seat counts, or avoid churn
      when buyers reassess lock-in and total cost of ownership.
    diligencePath: >-
      Ask for renewal cohorts, displacement reasons, and proof of durable adoption after year one versus one-off
      prototyping or SaaS replacement projects.
    relatedQuestionRefs:
      - QM020
      - QM021
      - QM026
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: material
    topic: peer-funding-comparability
    missingEvidence: >-
      Current like-for-like funding, valuation, and growth disclosures for Superblocks, Appsmith, and other private
      peers using authoritative primary or high-tier independent sources.
    whyItMatters: >-
      Competitor profiles benefit from comparable scale signals, but public data are uneven and can otherwise overstate
      Retool's visibility advantage.
    diligencePath: >-
      Request management's competitive battlecards or obtain primary financing announcements and investor materials for
      the main private peers.
    relatedQuestionRefs:
      - QP006
  - type: private-evidence-only
    severity: material
    topic: multi-homing-and-win-loss
    missingEvidence: >-
      Customer-level evidence showing how often Retool is deployed alongside Power Apps, OSS builders, or internal code
      rather than as an exclusive standard.
    whyItMatters: >-
      Public product pages show credible multi-homing paths, but underwriting moat durability needs actual overlap and
      replacement behavior.
    diligencePath: Ask for top-50 account competitive overlap, win-loss notes, and workspace-level app migration history.
    relatedQuestionRefs:
      - QP019
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-and-discounts
    missingEvidence: >-
      Realized contract pricing, volume discounts, and concessions across Retool, Superblocks, Appsmith, and ToolJet for
      larger deployments.
    whyItMatters: >-
      List prices are directionally useful, but real competitive pressure and pricing power are determined by negotiated
      enterprise economics.
    diligencePath: >-
      Request anonymized MSAs or pricing exhibits for recent enterprise deals segmented by builder, internal-user,
      external-user, and viewer-heavy deployments.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: audited-financial-statements
    missingEvidence: Audited 2023-2025 income statement, balance sheet, and cash-flow statement plus YTD 2026 management accounts.
    whyItMatters: >-
      Without auditeds, public ARR and funding estimates cannot be reconciled to profitability, cash generation, or
      solvency.
    diligencePath: Request the latest audit package, trial balance bridge, and board materials used to discuss financial performance.
