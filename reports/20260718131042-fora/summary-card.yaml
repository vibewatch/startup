summary:
  headline: >-
    Fora has built credible category traction in advisor-enabled travel and a differentiated AI-product narrative, but
    the current $1 billion valuation is still difficult to underwrite from public evidence because the revenue, margin,
    and cohort-quality denominator remains opaque.
