- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence supporting it
  - Counterpoint
  - What would change the view
  rows:
  - - Fora has built a real new-advisor category
    - 15,000+ advisors, 97% new to the profession, $3B+ bookings
    - Advisor count may overstate economically meaningful users
    - Cohort conversion from signup to repeat-booking and renewal
  - - AI can create operating leverage
    - Via and Sidekick clearly target workflow time savings
    - No public data shows AI is translating into realized margin or throughput lift
    - Measured before/after productivity and gross-margin deltas
  - - The platform can monetize meaningfully
    - Membership, retained commissions, and service fees all exist
    - Actual take rate and revenue mix remain undisclosed
    - Revenue bridge by stream
  - - The valuation could be justified by growth
    - Recent booking velocity accelerated materially
    - Acceleration may not persist and may still imply a rich multiple
    - Monthly bookings and revenue trend lines with cohort quality
  - - The valuation could still be too full
    - Public comp band is below the implied low-case multiple
    - Private software markets sometimes reward differentiated growth narratives
    - Evidence of durable, high-growth, high-margin economics at scale
  notes: The anti-thesis is not that the company is weak; it is that the current price may already discount most of the visible upside.
