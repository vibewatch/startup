- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Case
  - Core assumptions
  - Implied revenue / value logic
  - Risk signal
  - Probability posture
  rows:
  - - Bear
    - Recent bookings pace cools, novice activation stays shallow, and revenue realization tracks the low end of the estimate band
    - ~$48M annualized revenue would imply a >20x multiple at today’s mark
    - Support variance or commission compression worsens
    - Meaningful downside risk if private metrics disappoint
  - - Base
    - Bookings pace is partly durable, fee adoption helps, and realized revenue tracks the middle of the estimate band
    - ~$72M annualized revenue implies ~14x at today’s mark
    - Valuation can be argued but still looks full versus public comps
    - Public evidence supports this as the central case
  - - Bull
    - Via improves advisor productivity, high-value categories expand, and realized revenue reaches or exceeds the high end quickly
    - ~$108M annualized revenue implies ~9x at today’s mark before further growth
    - Needs strong cohort retention and margin improvement
    - Possible, but not yet proven in public data
  notes: These are not management forecasts. They are scenario frames built from disclosed bookings velocity and observed commission economics.
