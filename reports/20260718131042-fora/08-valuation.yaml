chapter:
  number: 8
  title: Valuation
  summary: Fora’s $1 billion post-money valuation is defensible only as a forward-looking bet on advisor activation, AI-enabled productivity, and continued booking acceleration rather than on disclosed current earnings. Public comparables suggest the current mark is at least full, and possibly stretched, unless actual annualized platform revenue is already at or above the high end of the range implied by recent booking pace.
sections:
- id: valuation-starting-point
  title: Current Price, Evidence Quality, and What the Market Is Actually Buying
  body: 'The July 2026 Series D sets Fora’s current reference price at a $1 billion post-money valuation after more than $138 million of total disclosed funding. Public evidence also shows a business with real scale signals: more than $3 billion of lifetime bookings, a visibly accelerating bookings cadence, more than 15,000 active advisors, and a product narrative centered on Via as an embedded AI operating layer. What public evidence does not show is the exact metric the round is underwriting. There is still no disclosed revenue run rate, gross margin, burn, runway, or booking concentration by advisor cohort. That means the current price is not being attached to known profitability or even to a clearly disclosed revenue denominator. Investors are effectively paying for a blended thesis: that the company can keep converting first-time advisors into productive repeat sellers, that AI materially lifts advisor throughput, and that supplier-commission plus fee economics can scale faster than
    support and product costs.'
  claimRefs:
