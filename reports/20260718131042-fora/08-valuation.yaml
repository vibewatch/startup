      detail: 15,000+ advisors and $3B+ bookings show the company is more than a concept
      tone: positive
    - id: ai
      label: AI and workflow upside
      detail: Via and Sidekick could lift advisor productivity and category expansion
      tone: positive
    - id: gap
      label: Disclosure gap
      detail: Revenue, margins, runway, and cohort concentration remain private
      tone: warning
    - id: comp
      label: Comp discipline
      detail: Public travel platforms mostly trade below Fora’s low-case implied multiple
      tone: warning
    - id: rec
      label: 'Recommendation: research-more'
      detail: Current price is investable only after deeper private diligence closes the denominator gap
      tone: negative
    edges:
    - from: proof
      to: ai
