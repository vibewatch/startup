    - Huge, mature OTA; useful lower-multiple scale anchor
  - - Airbnb
    - Market cap $86.63B (Jul 2026)
    - 2025 revenue $12.241B
    - ~7.1x market cap / revenue
    - Consumer marketplace with stronger brand and margins than Fora
  - - TripAdvisor
    - Market cap $1.69B (Jul 2026)
    - 2024 revenue $1.835B
    - ~0.9x market cap / revenue
    - Low-growth travel media / metasearch style comp; useful floor anchor
  - - MakeMyTrip
    - Market cap $5.18B (Jul 2026)
    - 2023 revenue $593M
    - ~8.7x market cap / revenue
    - Geographically different and using an older revenue base, but useful high-multiple public comp
  - - Navan
    - IPO valuation $6.2B in Oct 2025
    - LTM revenue $613M on Navan IR
    - ~10.1x valuation / LTM revenue
    - Closest travel-software style comp, but corporate travel and expense are different markets
  notes: The comp set is intentionally model-appropriate rather than exhaustive. It mixes public marketplaces with a more software-like travel platform to frame the plausible multiple range.
