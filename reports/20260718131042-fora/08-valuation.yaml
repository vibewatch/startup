- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Why it matters
  - Action implication
  rows:
  - - Revenue miss versus public range
    - Private revenue materially below low public estimate band
    - Would make the current mark look distinctly overextended
    - Downgrade valuation stance to expensive
  - - Cohort weakness
    - Low repeat-booking or renewal among novice cohorts
    - Would show advisor count is not translating into durable economics
    - Reset growth and multiple assumptions
  - - Support / trust slippage
    - Rising complaint rate or unresolved traveler incidents
    - Would undermine referral loop and premium-service thesis
    - Increase risk discount and delay conviction
  - - Commission or fee pressure
    - Supplier take rates compress faster than fee adoption offsets
    - Would reduce contribution quality of bookings growth
    - Lower revenue-quality and margin assumptions
  - - AI control failure
    - Material privacy, hallucination, or permission incident
    - Would weaken the AI-upside narrative quickly
    - Pause any AI-premium valuation credit
  notes: These triggers are the fastest ways today’s forward-looking valuation can de-rate before topline demand visibly collapses.
  claimRefs:
  - CV033
  - CV036
  - CV039
  - CV040
  - CV042
- id: TV006
  title: Final diligence asks table
  columns:
  - Open diligence ask
  - Why it matters
  - Best current proxy
  - Exact request
  rows:
  - - Revenue by stream
    - Needed to replace estimates with fact
    - Bookings velocity plus public split mechanics
    - Monthly 2024-2026 revenue bridge for memberships, retained commissions, and fees
  - - Gross margin and contribution margin
    - Determines whether AI and workflow tooling create leverage
    - Public AI narrative only
    - Category-level margin bridge and support-cost allocation
  - - Advisor cohort retention and concentration
    - Separates headline advisor count from economic quality
    - Top-producer anecdotes and Pro thresholds
    - Cohorts for signups, first booking, repeat booking, renewal, and top-decile concentration
  - - Cash burn and runway
    - Tests whether Series D is offensive or defensive capital
    - Funding size and headcount proxy only
    - Current cash, monthly burn, and 18-month plan
  - - AI quality and governance
    - Determines whether Via deserves premium credit
    - Job-post signals about evals and guardrails
    - Usage, acceptance, eval, hallucination, and incident dashboards
  notes: If management can clear these asks cleanly, the recommendation can move quickly from research-more toward a firmer valuation stance.
  claimRefs:
  - CV033
  - CV036
  - CV039
  - CV040
  - CV042
