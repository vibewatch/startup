- id: ai-layer-data-and-engineering-signals
  title: AI Layer, Data Assets, and Engineering Signals
  body: 'Fora’s current AI story has two visible layers. Externally, Via is the flagship narrative in 2026: an embedded assistant intended to absorb administrative work such as destination research, supplier lookups, itinerary drafting, and proposal generation so advisors can spend more time with clients. Internally, Sidekick shows the earlier pattern the company is building from: a custom GPT-4 chatbot trained on proprietary advisor content, partner information, help-center materials, community knowledge, and traveler reviews. The strongest evidence that this is not a marketing veneer comes from developer-signal sources. A 2026 Applied AI engineering role references MCP tools, agent harness and orchestration work, evaluation systems, observability, provider SDKs, structured outputs, streaming, retrieval, and production LLM features. A senior product role similarly frames the roadmap around AI agents, CRM intelligence, segmentation, lead scoring, and workflow automation. Taken together,
    the public signal points to a genuinely modern applied-AI stack layered onto a domain-specific workflow product.'
