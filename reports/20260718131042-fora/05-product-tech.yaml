- id: trust-controls-and-public-limitations
  title: Trust, Compliance, and Public Limitations
  body: 'Fora has enough public evidence to show that trust and compliance are product concerns, but not enough to let an outsider verify the full control stack. Travel Agent Central explicitly names Vault as the secure payment-card storage and collection layer inside the booking workflow, and the company exposes separate privacy, terms, onboarding, and help-center surfaces on its public site. In this run, however, several official pages resolved only to a Vercel security checkpoint or required privileged access, which limits how much of the trust narrative can be independently inspected from the outside. That does not negate the existence of those controls; it simply means diligence should not confuse page presence with verified operating quality. The main implication is practical: until the buyer or investor sees live product demos, permissioned help-center content, incident history, and real privacy or security documentation, the trust story remains directionally positive but not exhaustively
    proven. That missing outside-in visibility is itself a diligence signal because a platform this workflow-critical should be demonstrable under realistic advisor conditions.'
