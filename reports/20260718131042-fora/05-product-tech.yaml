- id: TE002
  title: Workflow / use-case table
  columns:
  - Advisor job
  - Current workflow
  - Fora solution
  - Evidence of benefit
  - Open limitation
  rows:
  - - Research a destination or property
    - Traditionally spans supplier sites, notes, and peer chats
    - Sidekick, Via, training content, and central supplier data shorten lookup time
    - Multiple sources say AI handles research and returns categorized internal answers
    - No disclosed time-saved metric by cohort
  - - Compare and quote hotels
    - Usually requires multiple tabs and manual perk comparison
    - Booking platform compares preferred partner hotels, rates, and perks in one place
    - Travel Agent Central says advisors can move from research to booking in a few clicks
    - Public evidence on non-hotel comparison depth is thinner
  - - Collect payment details securely
    - Manual card handling raises friction and risk
    - Vault captures and stores client payment details inside workflow
    - Travel Agent Central names Vault as secure storage and collection
    - No public PCI or audit detail retrieved
  - - Track commissions and service fees
    - Often requires spreadsheets and chasing suppliers
    - Portal tracks commissions, invoices service fees, and monitors performance
    - Host Agency Reviews and Travel Research Online both highlight these functions
    - Real realization rates are not public
  - - Draft client-facing itinerary or copy
    - Manual edits from GDS or supplier content are time-consuming
    - AI reformats supplier copy and drafts itinerary/proposal language
    - Host Agency Reviews describes GPT-4 and client-ready GDS reformatting
    - Quality, hallucination rate, and review steps are undisclosed
  - - Get help or improve skills
    - Legacy advisors depend on host staff, peers, and informal docs
    - 700+ lessons, live sessions, community channels, and AI Office Hours
    - Reviews and HAR profile repeatedly cite training breadth and support responsiveness
    - Support consistency still shows mixed public feedback
  notes: Measured benefits are largely qualitative in public sources; the workflow gain is visible but not yet benchmarked with company metrics.
