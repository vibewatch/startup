    - Payment and security vendors or internal controls
    - Opaque security detail raises diligence need
  - - AI interaction layer
    - Via and Sidekick provide retrieval, drafting, and search assistance
    - Funding coverage and HAR describe embedded AI workflow
    - LLM providers, prompts, eval systems, and model orchestration
    - Hallucination, cost, or latency can degrade user trust
  - - Applied AI tooling
    - MCP tools, agent harness, evals, observability, streaming, retrieval
    - Built In engineering role lists the stack elements
    - Fast-moving applied AI infrastructure and providers
    - Operational complexity rises as the stack deepens
  - - CRM / data intelligence
    - Lead scoring, segmentation, next-best-action, workflow automation
    - Built In PM role points to advisor-enablement data products
    - Quality of customer data and model signals
    - Weak signals or poor integration could limit conversion gains
