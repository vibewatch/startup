    Fora 是一家总部位于 New York 的旅行顾问平台，2021 年由 Henley Vazquez、Evan Frank 和 Jake Peters
    创立。公司把主办代理机构模式与现代软件栈结合起来：顾问付费获得培训、供应商关系、社区、预订工具、佣金管理和 AI 辅助，然后在上面搭建自己的旅游销售生意。公开证据支持超过 15,000 名活跃顾问、超过 $3 billion
