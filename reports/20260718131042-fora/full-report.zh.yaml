      - number: '1.3'
        title: 融资历程、规模与里程碑记录
        blocks:
          - type: paragraph
            body: >-
              Fora 的融资故事在顶层很清楚，细节却不完整。当前主线明确：公司于 2026 年 7 月完成 $60 million Series D，投后估值 $1 billion，已披露累计融资达到 $138.5
              million。上一笔有记录的主要融资，是 2025 年 4 月宣布由 Thrive Capital 和 Insight Partners 领投的 $60 million Series B 和
              C。再往前，2021 年上线报道披露了由 Forerunner Ventures 领投的 $5 million
              种子轮。这些片段无法完全对齐累计融资总额，意味着至少还有一次额外融资事件、扩展轮或转换工具，在本次检索到的公开材料中没有拆解。运营里程碑比融资颗粒度更清楚。到 2025 年 4 月，公司称销售额已超过 $1
              billion，预订夜数达到 2 million；到 2026 年 7 月，独立报道佐证累计预订额跃升至超过 $3 billion。从三年做到第一个 $1 billion，再用八个月和五个月完成后两个 $1
              billion，这种加速支持管理层的说法：随着顾问密度、供应商接入和 AI 工具共同改善，平台扩张正在变快。
