          - type: paragraph
            body: >-
              Fora 的模式架在供应商经济和可选旅游需求之上，因此宏观或分销冲击会很快传到预订、顾问士气和估值支撑。Travel Weekly
              对费用的报道说明了原因：代理商越来越多收取规划费，因为供应商佣金被削减或变得不稳定，航空领域尤其明显；否则专业服务往往拿不到报酬。TravelPulse 和 Travel Agent Central
              给出了更近的宏观读数。2025 年和 2026
              年，顾问把通胀、旅行成本压力、直订竞争、政府政策不确定性、关税和旅行禁令列为现实经营担忧。奢侈需求强劲并不会消除该风险；反而凸显当前叙事在多大程度上依赖消费者继续为高端、复杂旅行买单。Luxury Travel
              Advisor 汇总的 Fora 婚礼旅行数据同时显示上行空间和警讯：目的地婚礼需求在增长，但淡季找性价比和转向国内目的地也在升温。该模式可以穿越波动，但佣金池、供应商议价能力或可选需求一旦变化，它并不免疫。
