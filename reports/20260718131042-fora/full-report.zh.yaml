      - number: '2.2'
        title: 规模测算视角、渠道经济与增长空间
        blocks:
          - type: paragraph
            body: >-
              至少可以用三条可辩护的视角测算这个市场。第一，ASTA 资料页把 2025 年旅游支出 $1.57 trillion 与旅行社占每四美元旅行支出中的一美元配对，推导出美国通过旅行社预订的支出池约 $392.5
              billion。第二，Phocuswright 和 PhocusWire 显示数字旅行分销已经很大且仍在复利增长：2025 年总预订额 $1.67 trillion，其中约 $1.07 trillion 在线，到
              2026 年将升向 $1.2 trillion，在线份额约 65%。第三，Fora 自身叙事指向一个可触达的渠道缺口：公司认为，尽管旅游整体规模巨大，旅行顾问在酒店预订中的占比仍低于
              10%。在这些视角下，Fora 披露的 $3 billion 累计预订额仍然很小——远低于美国旅行社代理池的 1%，约为在线预订视角的
              0.3%。这些百分比只是粗略值，不是定论，但方向上说明，即便成为独角兽后，Fora 相对总分销机会仍处早期。
