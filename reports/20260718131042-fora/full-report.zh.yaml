  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律暴露
        blocks:
          - type: paragraph
            body: >-
              Fora 运营在旅行分销渠道中，合规不是可选项；随着地域扩张，监管负担会复利上升。California 的 Seller of Travel 制度要求注册并展示注册号，Ontario 的 TICO 框架监管约
              2,100 家注册旅行零售商和批发商。Fora
              自身公开帮助中心结构显示，旅行销售者合规重要到值得为顾问提供专门指引；但一手页面在本次运行中受到机器人防护限制，外部无法独立审阅公司实际向顾问传达的规则。隐私构成第二层法律约束。FTC
              指引明确要求公司履行隐私承诺，并维持与所持数据相匹配的安全措施；同一指引还明确点名移动应用和技术工具是隐私敏感界面。对于一个存储旅行者和支付数据、同时把 AI
              部署在内部语料上的平台，隐私、条款和支持文档的公开可见度不完整，应被视为尽调问题，而不是格式问题。
