        - label: 资深顾问评价者（在 Fora 2 年）
          values:
            - 100
            - 100
            - 100
    approximationNotes: 这刻意不是总体留存队列。由于 Fora 没有披露真实队列留存或 NRR，它只编码公开具名任期评价中的轶事性存续。
    claimRefs:
