        title: 创始人、领导层与治理可见度
        blocks:
          - type: paragraph
            body: >-
              三位创始人分别带来品类知识、市场搭建经验和产品领导力。Henley Vazquez 以旅行顾问和机构建设经历带来运营可信度；Evan Frank 带来 onefinestay 和 Context Travel
              的连续创业经验；Jake Peters
              是公开头衔最清晰的高管，身份为联合创始人兼首席产品与技术官。官方材料还展示了更宽的运营班底——国际业务负责人、首席营收官、培训与发展负责人、航班业务负责人以及其他职能领导——说明业务已从纯创始人驱动的创业公司，进入更专业化的运营结构。即便如此，关键人风险仍然不低，因为公开叙事仍很依赖创始人的品类故事和面向投资人的信息，尤其围绕
              AI、创业精神和供应商分销变化。治理可见度弱于领导层可见度：检索到的来源列出了主要投资方和领投方，但没有披露当前董事会名单、观察员权利或正式委员会结构。因此很难判断 2025 和 2026
              年融资后创始人还保留多少控制权，也把治理尽调推入证据缺口，而不是已确认事实。
