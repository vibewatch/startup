      - number: '8.2'
        title: 可比公司框架与情景边界
        blocks:
          - type: paragraph
            body: >-
              公开可比公司有用，但前提是谨慎处理。Booking 和 Airbnb 远大于 Fora，也成熟得多；TripAdvisor 增速更低、结构也不同；MakeMyTrip
              的地域不同，收入基底更老。即便如此，已知收入的公开旅游平台交易区间仍可由它们锚定。按当前市值和已发布收入计算，Booking 约为近 12 个月收入的 5.2x，Airbnb 约 7.1x，TripAdvisor
              约 0.9x，MakeMyTrip 按保留来源集中最新可用收入计算约 8.7x。在这个背景下，只有当 Fora
              当前年化收入更接近公开估计区间高端、而不是低端时，当前估值才显得合理。一个用披露预订速度和公开可见佣金经济搭出的简化模型显示，最近年化收入大约在 $48 million 到 $108 million
              之间，对应当前估值约 9x 到 21x 收入。这高于大型公开旅游平台，更接近高溢价私人软件公司的定价思路。
