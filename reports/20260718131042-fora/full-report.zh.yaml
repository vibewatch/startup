      - number: '5.2'
        title: AI 层、数据资产与工程信号
        blocks:
          - type: paragraph
            body: >-
              Fora 当前的 AI 故事有两个可见层。对外，Via 是 2026
              年的旗舰叙事：一个嵌入式助手，意在吸收目的地研究、供应商查询、行程起草和方案生成等行政工作，让顾问把更多时间花在客户身上。对内，Sidekick 展示了公司更早的构建模式：一个定制 GPT-4
              聊天机器人，训练材料包括自有顾问内容、合作伙伴信息、帮助中心材料、社区知识和旅行者评论。证明这不是营销外衣的最强证据来自开发者信号来源。一则 2026 年 Applied AI 工程职位提到 MCP
              工具、智能体测试框架与编排、评估系统、可观测性、供应商 SDK、结构化输出、流式输出、检索和生产级 LLM 功能。一个高级产品岗位同样把路线图框定在 AI 智能体、CRM
              智能、分群、线索评分和工作流自动化上。合起来看，公开信号指向一个真正现代的应用 AI 栈，并叠加在领域专属工作流产品之上。
