chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、品类逻辑与顾问运营模式
        blocks:
          - type: paragraph
            body: >-
              Fora 是一家总部位于 New York 的旅行顾问平台，2021
              年开始运营，并明确要改造创始人眼中技术落后、社交门槛很高的旅行分销环节。公开材料一直把公司描述成主办代理机构和软件平台的结合：顾问付费获得工具、供应商关系、培训和社区，然后在其上搭建独立旅游生意。这一定位很关键，因为
              Fora 不是又一家争夺终端旅行者的零售旅行社；它试图打造可规模化的顾问赋能层，比传统主办代理机构更快招募新销售者。会员栈包括预订门户、行程和报价工具、佣金管理、入驻支持和社区基础设施，经济抓手则是默认
              70/30 佣金分成，且随产出提升而改善。公开定价页显示年费 $299，并提供分期付款版本，说明公司在持续调校入门摩擦与经常性收入之间的平衡。模式刻意做得包容：官方和媒体来源都把 Fora
              描述为一条入口，让父母、创作者、副业者和其他新人无需继承客户簿，也不用拼接多套传统工具，就能进入旅行顾问行业。
