      - CU027
      - CU023
      - CU024
  - id: FU004
    title: 留存 / 重复队列
    type: cohort
    layout: standard
    summary: Fora 专属的公开持久性证据偏轶事，因此该队列使用具名顾问评价中的存续痕迹，而不是公司层面的留存表。
    data:
      columns:
        - 第 6 个月
        - 第 12 个月
