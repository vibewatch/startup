      - number: '3.4'
        title: 反向证据与监测重点
        blocks:
          - type: paragraph
            body: >-
              公开反向证据尚未击穿投资逻辑，但有方向性价值。Trustpilot 评论显示，服务质量、退款处理和国际适配问题会在客户边缘浮现。这一点重要，因为相较自助工具，Fora
              明确差异化之一就是人的问责；如果服务一致性下滑，品牌相对 OTA 和纯软件的优势会收窄。更广泛地看，Travel Weekly
              关于费用采用率的报道提醒投资人，顾问行业整体都承受佣金压力；除非平台也改善生产力和线索转化，否则听起来很强的分成比例实际意义会下降。因此，未来 12 个月的竞争观察清单不应只盯一个对手。投资人应监测
              TravelJoy 或类似工具是否持续变得对独立顾问“足够好”，奢华存量玩家能否留住最高价值顾问和供应商关系，活动平台是否吃掉更多行程钱包，以及 Fora 自己的新手队列是否留存并变现到足以证明其供给创造逻辑。
