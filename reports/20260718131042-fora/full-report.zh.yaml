              公开采用证据在漏斗顶部最强，也有一些轶事性但可信的证明点。到 2026 年 7 月，Fora 预订额超过 $3 billion，并称这些预订服务了 180
              多个国家的旅行者，说明顾问网络不只是注册账号，而是在促成真实旅行量。具名证明来自顾问侧和旅行者侧。Host Agency Reviews 引用顾问 Beth Kaczka 和 Rita Carton，描述
              Sidekick 和 AI 辅助内容格式化带来的具体工作流收益；Trustpilot 则记录了旅行者评论，称赞 Patricia Caruso 和 Cyril Orhierie
              等顾问把行程执行得很好。这些例子不能证明队列层面的留存，但能说明平台支持实际行程规划、客户沟通和已交付的旅行体验。这个模式在新手和兼职顾问中尤其一致：他们反复把培训和社区描述为自己无需拼接传统工具包就能开始销售的原因。
