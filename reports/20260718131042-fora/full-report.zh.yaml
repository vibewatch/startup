      - number: '7.4'
        title: 团队、执行与打破投资逻辑的触发点
        blocks:
          - type: paragraph
            body: >-
              执行风险仍然不低，因为让 Fora 有意思的战略选择，也把管理难度抬高了。Series D 轮逻辑直接押在
              Via、新市场、机票、邮轮、企业相邻场景和持续招聘上。执行压力因此集中压到创始团队和产品领导层身上，尤其是客户群大多是新手顾问；他们需要可靠的培训和支持，而不只是软件。公开招聘页面显示，公司已有 200
              多名员工，AI 和数据团队仍在扩张。这是正面信号，但也意味着职责边界、产品优先级和质量控制都还在变化。实操上的否决条件很直接：如果顾问激活停滞、支持质量差异扩大、供应商经济被压缩的速度快于费用抵消能力，或 AI
              带来可见的信任失误，增长故事会在叙事耗尽前就先减速。正确的缓释姿态是主动监控，而不是被动乐观。
