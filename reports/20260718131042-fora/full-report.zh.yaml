        blocks:
          - type: paragraph
            body: >-
              一个合理的公开模型可以圈定业务边界，但无法完全承销。把 10% 到 15% 的供应商佣金区间套到 $3 billion 累计预订额上，意味着累计总佣金池约 $300 million 到 $450
              million。再套用 Fora 可观察的 10% 到 30% 佣金留存份额，意味着累计平台收入约 $60 million 到 $135
              million，尚未考虑任何服务费收入或组合影响。按最近披露的预订节奏，最新 $1 billion 在五个月内完成，年化约为 $2.4 billion 预订额；如果这一节奏维持且组合类似，对应年化平台收入约
              $48 million 到 $108 million。在 $1 billion
              投后估值下，这个粗略区间意味着高个位数到二十倍出头的收入倍数。结论不是估值不理性，而是利润率路径、激活曲线、现金消耗和收入确认质量仍是实际承销问题。
