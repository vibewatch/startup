      - number: '2.3'
        title: 买方、用户与付费方分层
        blocks:
          - type: paragraph
            body: >-
              这个市场的买方-用户-付费方地图比普通 SaaS
              更复杂。顾问创业者是平台会员的直接买方，也是软件的日常用户。旅行者支付底层行程成本，并获得个性化、权益和问题解决服务，但通常不是直接软件客户。供应商——酒店、邮轮、旅行团和其他合作伙伴——支付佣金，支撑顾问经济，并间接支撑平台抽成。平台能让三边保持一致时，模式在结构上很有吸引力：顾问需要生产力和线索生成，旅行者需要信任和策划，供应商需要以更低分销成本获取高价值预订。Travel
              Weekly、ASTA 和 BLS 都指向高度碎片化的顾问基础，这意味着平台层可以通过专业化和聚合供给创造价值。因此，Fora
              聚焦首次入行顾问不只是招聘选择；它是在一个存量从业者更老龄、小企业占比高且数字化程度不均的渠道里，尝试制造新增供给。
