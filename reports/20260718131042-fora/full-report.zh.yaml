  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与集群图
        blocks:
          - type: paragraph
            body: >-
              Fora 的竞争格局不是单一同业集合。第一类是面向既有顾问的纯软件工具，TravelJoy 是最清晰的基准：CRM、行程、支付和自动化作为独立 SaaS 销售。第二类是 InteleTravel、Avoya
              等主办代理机构和顾问网络存量玩家，以及更偏奢华领域的 Brownell 和 Virtuoso。第三类是规模化数字分销平台——Booking、Expedia、Airbnb，以及 GetYourGuide、Klook
              等专项体验平台——它们靠便利、广度和消费者品牌取胜。第四类是 Navan 等相邻工作流所有者，主要在企业差旅。CB Insights 进一步证明，竞争集合已从老牌主办代理机构延伸到旅游科技
              和规划产品。这一点重要，因为 Fora 不只是要在佣金分成上击败另一家主办代理机构；它必须足够好，让有志成为顾问的人选择在 Fora 上搭建业务，而不是使用软件工具、加入传统网络，或退回消费者自助渠道。
