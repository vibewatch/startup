  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代品
        blocks:
          - type: paragraph
            body: >-
              Fora 并不直接覆盖整个旅游经济。相关市场位于可佣金化旅行分销、顾问主导行程规划，以及帮助独立销售者获客、研究库存、预订行程和收款的软件的交集。这个边界远窄于 WTTC 估算的 $11.6 trillion
              全球旅行与旅游 GDP 足迹，但又远宽于一个小众主办代理机构 软件市场。公开来源显示了几类现状替代品。一端是传统机构和居家独立顾问，仍依赖人工流程、碎片化工具和供应商佣金。另一端是 OTA 和直接数字渠道，如
              Booking Holdings、Expedia Group、Airbnb、GetYourGuide 和 Klook，靠自助便利、广泛库存和品牌信任捕获需求。Navan
              等企业差旅管理平台服务的是不同但相邻的工作流。Fora 的差异化主张是，现代平台可以扩充顾问劳动力本身，而不只是帮助存量从业者提速。这一点重要，因为公司招募的是首次入行顾问和转行者，而不只是追逐已经有产出的老手。
