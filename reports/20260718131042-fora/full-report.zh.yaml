  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: Fora 多数下行路径沿着少数共通渠道传导：合规失败、支持失灵、供应商经济性承压或宏观需求冲击，最终打到预订额、信任和估值支撑。
    data:
      nodes:
        - id: reg
          label: 合规 / 隐私疏漏
          detail: 注册、披露或数据治理失效
          tone: warning
        - id: ops
          label: 支持 / 服务失灵
          detail: 退款、沟通或旅途中问题处理失手
          tone: warning
        - id: supplier
          label: 供应商 / 佣金压力
          detail: 佣金压缩或合作伙伴经济性偏弱
          tone: warning
        - id: macro
          label: 宏观旅行冲击
          detail: 关税、旅行禁令、通胀或机票价格飙升
          tone: warning
        - id: trust
          label: 顾问与旅客信任
          detail: 平台和顾问网络看起来是否可靠
          tone: warning
        - id: bookings
          label: 预订额与留存
          detail: 出行量、费用接受度和复购行为
          tone: negative
        - id: valuation
          label: 估值支撑
          detail: 投资者是否愿意为未来增长和利润率买单
          tone: negative
      edges:
        - from: reg
          to: trust
        - from: ops
          to: trust
        - from: supplier
          to: bookings
        - from: macro
          to: bookings
        - from: trust
          to: bookings
        - from: bookings
          to: valuation
        - from: supplier
          to: valuation
        - from: reg
          to: valuation
    approximationNotes: 这张图是定性且方向性的；它展示风险如何传导到核心结果，而不是分配百分比或美元损失。
    claimRefs:
      - CR001
      - CR005
      - CR011
      - CR018
      - CR025
      - CR026
      - CR029
      - CR034
      - CR040
  - id: FR003
