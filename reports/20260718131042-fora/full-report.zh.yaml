  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 仅基于公开信息，建议逻辑很简单：真实增长已有证据，但披露质量和可比估值约束仍压着确信度。
    data:
      nodes:
        - id: proof
          label: 真实牵引力证据
          detail: 15,000+ 名顾问和 $3B+ 预订额说明，公司不只是概念
          tone: positive
        - id: ai
          label: AI 与工作流上行空间
          detail: Via 和 Sidekick 可能提升顾问效率，并拓展品类
          tone: positive
        - id: gap
          label: 披露缺口
          detail: 收入、利润率、现金跑道和队列集中度仍未公开
          tone: warning
        - id: comp
          label: 可比估值约束
          detail: 上市旅行平台的交易倍数大多低于 Fora 低情景隐含倍数
          tone: warning
        - id: rec
          label: 建议：继续研究
          detail: 只有更深入的非公开尽调补齐分母缺口后，当前价格才具备可投性
          tone: negative
      edges:
        - from: proof
          to: ai
        - from: ai
          to: gap
        - from: gap
          to: comp
        - from: comp
          to: rec
    approximationNotes: 这是一条判断链，不是数学模型；它说明为什么证据质量，而不只是增长，决定建议。
    claimRefs:
      - CV001
      - CV003
      - CV009
      - CV021
      - CV033
      - CV041
      - CV042
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 最大摆动因素是实际收入、留存质量，以及市场最终按软件公司还是交易平台的可比区间给 Fora 定价。
    data:
      items:
        - label: 真实收入证明年化 >$100M
          value: 2
        - label: 队列留存向好超预期
          value: 1.5
        - label: 上市可比公司倍数压缩占主导
          value: -2
        - label: 收入落在估计区间低端附近
          value: -2.5
        - label: AI 质量或信任问题浮现
          value: -1.5
    approximationNotes: 这些数值是相对当前 $1B 估值标记的方向性估值影响评分，量级为数亿美元，不是 DCF 输出。
    claimRefs:
      - CV033
      - CV034
      - CV036
      - CV037
      - CV039
      - CV040
