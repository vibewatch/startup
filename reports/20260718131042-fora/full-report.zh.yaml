            body: >-
              最好的公开单位经济证据是间接的，但仍有用。Fora 称活跃顾问超过 15,000 名，97% 是行业新人，一些头部生产者年预订额已超过 $10
              million。这些披露意味着顾问生产力曲线分散很大：中位数顾问几乎肯定远低于头部层级，但平台已经证明，其最佳用户可以建立有意义的业务簿。公开运营者评论也解释了为什么服务费重要。Travel Weekly
              报道称，由于供应商佣金本身并不总能补偿研究、取消和重做行程的工作，尤其在航空佣金削减后，顾问行业费用采用率正在上升。Fora
              的运营模式贴合这一趋势，因为平台支持服务费开票，也给高预订量顾问更好的佣金分成。最终图景是一个混合经济栈：Fora 收取不高的经常性会员费，保留供应商佣金的一部分，并在顾问成熟为更高价值、可收服务费的业务时受益。
