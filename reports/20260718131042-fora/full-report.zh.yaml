      - number: '6.3'
        title: 留存、满意度与扩张 / 集中风险
        blocks:
          - type: paragraph
            body: >-
              留存是最大的客户尽调缺口，因此最好的公开判断来自代理指标。Gitnux 和 WorldMetrics 的行业基准显示，顾问主导旅行仍受益于高重复意愿、强个性化需求和有意义的复杂行程使用场景。不过，Fora
              专属的耐久性证据大多是轶事。Trustpilot 和 Host Agency Reviews 展示了许多热情的顾问评价，包括使用 18
              个月到两年的用户，他们把平台描述为有价值的第二职业或兼职生意引擎。与此同时，同一批评论界面也展示了新手占比高、网络很宽的风险：一些顾问或旅行者提到支持延迟、退款受挫，或 U.K.
              顾问发现部分预订仅限美国等地域限制。因此，最可能的集中风险不是某个巨型企业客户，而是过度依赖少数高产顾问队列，而大多数账号仍处于早期、偶发或学习阶段。
