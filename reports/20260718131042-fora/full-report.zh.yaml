      - number: '5.4'
        title: 信任、合规与公开局限
        blocks:
          - type: paragraph
            body: >-
              Fora 有足够公开证据显示信任和合规是产品关注点，但还不足以让外部人验证完整控制栈。Travel Agent Central 明确把 Vault
              称为预订工作流中的安全支付卡存储和收集层，公司也在公开站点上提供独立的隐私、条款、入驻和帮助中心入口。不过在本次运行中，若干官方页面只解析到 Vercel
              安全检查点，或需要特权访问，限制了外部独立检查信任叙事的深度。这并不否定这些控制的存在；它只是说明，尽调不能把页面存在等同于已验证的运营质量。主要含义很实际：在买方或投资人看到现场产品演示、带权限的帮助中心内容、事故历史以及真实隐私或安全文档之前，信任故事仍是方向上正面，但尚未被穷尽证明。这种外部视角下的可见度缺口本身就是尽调信号，因为一个对工作流如此关键的平台，应能在真实顾问条件下被展示和验证。
