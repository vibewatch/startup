  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础分层与买方 / 用户 / 付费方现实
        blocks:
          - type: paragraph
            body: >-
              Fora 的客户地图从一个细微但重要的区分开始：平台卖给顾问，而旅行者消费顾问交付的服务。公开证据显示，顾问侧很广，对主办代理机构业务而言也异常包容。Fora 称其拥有超过 15,000 名活跃顾问，其中 97%
              是旅行顾问行业新人；第三方报道反复把用户群描述为转行者、副业者、父母、退休人士和数字原生旅行爱好者，而不只是继承客户簿的传统代理。Travel Research Online 补充了有用的人口画像，称网络中
              86% 是女性，近半数是父母。这种组合重要，因为它支持 Fora 正在制造新增顾问供给的逻辑，但也提出了一个艰难的激活问题：为首次入行者搭建的平台，其参与强度的分布很可能远宽于只服务全职老手的网络。
