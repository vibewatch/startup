  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现机制
        blocks:
          - type: paragraph
            body: >-
              Fora 通过分层模式变现旅行顾问工作流，而不是只卖一个 SaaS 订阅。公开证据支持三条当前变现轨道：年度顾问会员费、顾问分成后的供应商佣金留存份额，以及通过平台流转的顾问开票服务费。会员费把入门摩擦压低到每年
              $299，真正的经济引擎则是与预订量绑定的佣金层。Travel Research Online 和 Host Agency Reviews 明确显示，Fora
              是刻意为首次入行顾问设计的，所以名义顾问数不如转化为有效预订者的比例有信息量。公开披露显示默认 70/30 分成，并会随产出门槛提升而改善，这意味着 Fora
              从广度和预订吞吐中捕获的美元，比从高名义软件定价中更多。预订量复利增长时，这带来上行；但收入质量仍取决于供应商佣金兑现、顾问激活和品类 组合，而公司尚未以经审计形式披露这些因素。
