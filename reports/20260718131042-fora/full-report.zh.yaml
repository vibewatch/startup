      - number: '1.4'
        title: 顾问基础、地域与公开信号
        blocks:
          - type: paragraph
            body: >-
              公开规模指标指向一家已在旅行顾问生态中具备分量的公司。Fora 称其拥有超过 15,000 名活跃顾问，多家独立媒体重复这一数字，并强调 97% 顾问是旅行顾问行业新人。TIME 进一步补充定性画像：顾问群体中
              86% 为女性，近半数是父母。公司的全球足迹也明显扩大：官方页面称顾问可从 140 多个国家申请，旅行者预订覆盖 180 多个国家；Canada 和 Mexico 已经形成正式运营，到 2025
              年中当地顾问社区已有数百人。顾问赚钱能力的公开证明仍是方向性的，而非经审计数据：公司和媒体来源提到，一些成员把 Fora 用作补充收入，头部生产者年预订额超过 $10 million；Travel
              Research Online 报道称，一些顾问约 20 个月就做到七位数规模的业务。不过公开信号并非全然正面。Trustpilot
              评论暴露了退款、行程支持和国际顾问限制方面的投诉，提醒投资人：快速增长的网络模式仍要把服务质量和运营一致性跑出来。
