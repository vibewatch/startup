      - number: '2.4'
        title: 增长驱动、约束与市场成熟度
        blocks:
          - type: paragraph
            body: >-
              市场需求侧仍然建设性。Deloitte 2025 年展望把韧性的旅行需求、随地办公行为和 AI 加速描述为塑造行业的长期力量。PhocusWire 2026 年摘要进一步给出直接证据：旅行者使用 AI
              已进入主流，超过半数活跃美国旅行者以某种形式使用 AI，39% 专门用于旅行规划或研究。这给 Fora 带来双刃剑。一面，AI
              可以降低顾问杂务、改善行程质量，并让一个分布式半专业销售者网络更高产。另一面，同样的工具也会把低复杂度行程规划商品化，并加剧 OTA 或纯 AI 行程规划工具的竞争。经济模型也在演变：Travel Weekly
              报道称，在佣金继续承压的情况下，55% 美国旅行社现在收取费用；这有利于顾问专业化，也提醒市场，仅靠供应商出资的分销并不够。监管是另一个关键约束。Deloitte 2026
              年展望强调签证处理、隐私规则、垃圾费用审查和 AI 监管，这些都会影响数字旅行平台在哪些地区增长最快，以及如何部署个性化定价或推荐。
