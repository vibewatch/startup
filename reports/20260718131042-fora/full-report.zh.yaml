      - number: '6.4'
        title: 客户判断与剩余尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              公开客户故事足以让人相信，Fora
              已经与有志入行、追求灵活工作的顾问建立真正产品市场契合，但不足以完整衡量客户质量。最强信号是规模、社会证明和反复出现的工作流好评：网络很大，平台似乎尤其吸引新手，具名用户也能说清自己到底如何使用这些工具。最弱信号全是分母问题。公开来源没有说明
              15,000 多名顾问中有多少每月预订、多少第一年后续费、中位数顾问产生多少量、多少旅行者成为重复终端客户，或 Pro 层级在总预订额中集中度多高。对投资人而言，正确客户结论因此是正面但不完整：Fora
              明显找到了需求，但在客户账本可以称为完全承销前，还需要队列和集中度数据。至少从公开信息看，目前如此。
