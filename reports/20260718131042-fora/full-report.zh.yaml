  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前价格、证据质量与市场真正买的东西
        blocks:
          - type: paragraph
            body: >-
              2026 年 7 月的 Series D 轮把 Fora 当前参考价定在 $1 billion 投后估值，累计披露融资超过 $138 million。公开证据也显示，公司已有真实规模信号：累计预订超过 $3
              billion，预订节奏明显加速，活跃顾问超过 15,000 名，并围绕 Via 打出嵌入式 AI
              操作层的产品叙事。公开证据没有说明的是，本轮到底在承销哪个精确指标。公司仍未披露收入运行率、毛利率、烧钱速度、现金跑道或按顾问队列划分的预订集中度。因此，当前价格并不是锚在已知盈利能力上，甚至也没有锚在清楚披露的收入分母上。投资者实际在为一组混合逻辑买单：公司能持续把首次入行的顾问转化为高产复购卖家，AI
              能实质性提高顾问吞吐量，供应商佣金加费用的经济模型能比支持和产品成本扩张得更快。
