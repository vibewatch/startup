      - number: '3.2'
        title: 同业画像、定位与能力取舍
        blocks:
          - type: paragraph
            body: >-
              同业画像展示了不同战略选择。TravelJoy 可能是最干净的软件可比项：价格低、表达直接、功能导向，面向已经知道如何获取供给、只想缓解工作流压力的顾问。InteleTravel
              则强调礼宾服务、供应商认可和长期运营历史。Avoya 很依赖热门行程交易和消费者线索捕获，因此部分作为需求所有者竞争，而不只是顾问赋能层。Brownell 和 Virtuoso
              强调传承、奢华关系和顾问声望——这些属性很难只靠软件复制，但并不为新销售者低摩擦入门优化。Fora
              自身叙事位于这些极点之间。它像主办代理机构一样提供基础设施、培训、合作伙伴接入和社区，又像科技公司一样营销统一平台和 AI 工具。这种混合姿态大概解释了为什么公开描述 Fora
              时，会随来源在“现代旅行社”“平台”和“AI 驱动旅行社”之间切换。
