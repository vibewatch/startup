      - number: '3.3'
        title: 护城河耐久性、工作流替代与竞争风险
        blocks:
          - type: paragraph
            body: >-
              支持 Fora 的最强论点是它在创造新增供给。Travel Weekly 称公司主要瞄准首次入行顾问，官方材料又把培训、全球招聘和统一平台加入主张。这一动作不同于 TravelJoy
              的“给现有专业人士的工具”模式，也不同于 Brownell 和 Virtuoso 声望优先的奢华定位。如果 Fora 能反复把新人转化为持久生产者，它可能拥有一个难复制的增长飞轮。但替代风险真实存在。OTA 和
              Airbnb 掌握低摩擦消费者需求；GetYourGuide 和 Klook 可以吸收活动加购；Navan 捕获企业工作流；AI 规划工具会压缩简单行程的价值。因此，护城河不太取决于原始库存，更取决于 Fora
              能否以更低总分销成本，把供应商接入、顾问生产力和信任组合起来。Travel Research Online 关于 7,000
              多个合作伙伴关系的说法有助于这一论点，但公开证据仍未量化这些伙伴关系比存量同业可匹配的关系到底更独家或更赚钱多少。
