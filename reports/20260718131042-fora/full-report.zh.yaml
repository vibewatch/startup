              tone: positive
            - label: 中 — 好的赋能有价值，但可被模仿
              tone: warning
            - label: 中 — 客户反馈有分歧，但整体偏正面
              tone: warning
        - label: 社区数据层
          values:
            - label: 中 — 证据偏描述性，而非定量
              tone: warning
            - label: 中 — 明显活跃，但规模指标未披露
              tone: warning
            - label: 高 — 共享知识会复利式提升产品价值
              tone: positive
            - label: 低 — 外部无法访问，难以验证深度
              tone: warning
        - label: 隐私 / 法律控制
          values:
            - label: 中 — 页面存在，也点名支付安全
              tone: warning
            - label: 中 — 控制可能真实存在，但证据不完整
              tone: warning
            - label: 中 — 信任层必不可少，但不是独特差异化
              tone: warning
            - label: 低 — 机器人拦截页面限制验证
              tone: warning
    approximationNotes: 这些顺序矩阵标签反映基于已采纳公开证据的尽调判断，不是内部评分卡或正常运行时间报告。
    claimRefs:
      - CE015
      - CE017
      - CE021
      - CE022
      - CE028
      - CE033
      - CE037
      - CE038
      - CE043
  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Fora 的核心客户旅程从职业向往和低摩擦入门开始，随后成败取决于培训、首批预订和社区支持下的重复使用。
    data:
      items:
        - label: 发现：有志成为顾问的人看到的是合法主办旅行社路径，而不是 MLM 式招募话术
        - label: 加入：低年费且无配额，降低转行者、父母和兼职用户的摩擦
        - label: 学习：培训库、网络研讨会、同期班、社区和 AI 工具教授目的地、供应商和流程
        - label: 首批预订：顾问使用门户、供应商准入和支持，服务最初的旅行者客户
        - label: 扩张：重复预订、细分定位发展、费用和 Pro 门槛，把副业兴趣变成真实业务
        - label: 持久性考验：留存取决于支持一致性、跨境适配度，以及顾问是否达到可持续交易量
    approximationNotes: 这张旅程图反映公开评价和行业报道中最常出现的顾问路径；它不是实测内部漏斗。
    claimRefs:
      - CU002
      - CU010
      - CU012
      - CU018
      - CU025
      - CU026
      - CU028
  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: wide
    summary: Fora 公开可见的漏斗，从广泛获客顾问开始，进入培训、首批行程、旅行者交付，最终沉淀为更小但价值更高的重复预订核心。
    data:
      nodes:
        - label: 大规模漏斗顶部顾问获客，拥有 15,000+ 活跃账号
        - label: 新手占比高，97% 刚进入旅行顾问行业
        - label: 培训、社区和 AI 工具加快服务首个客户的准备
        - label: 顾问开始服务 180+ 个国家的旅行者
        - label: 最优秀用户提升等级，拿到更好分成，并产生重复预订
        - label: 公开分母缺口仍在：有活跃预订者、续费者和前十分位用户占比均未披露
    approximationNotes: 该漏斗使用公开里程碑和用户叙事，而不是披露的队列转化百分比。
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU012
      - CU018
      - CU023
      - CU041
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: 具名客户证明在工作流实用性和旅行者满意度上最强，但在收入持久性和队列级留存上弱得多。
    data:
      columns:
        - 结果具体度
        - 生产环境成熟度
        - 背书质量
        - 持久性可见度
      rows:
        - label: Beth Kaczka
          values:
            - label: 中 — 明确说明工作流节省时间
              tone: positive
            - label: 高 — 门户用于活跃顾问工作流
              tone: positive
            - label: 中 — 被独立行业出版物引用
              tone: positive
            - label: 低 — 没有预订或续费指标
              tone: warning
        - label: Rita Carton
          values:
            - label: 中 — 客户文案收益明确
              tone: positive
            - label: 高 — 与线上预订工作流绑定
              tone: positive
            - label: 中 — 被独立行业出版物引用
              tone: positive
            - label: 低 — 没有收入或复购数据
              tone: warning
        - label: Patricia Caruso 旅行者评价
          values:
            - label: 高 — 行程结束满意度陈述详细
              tone: positive
            - label: 高 — 行程已完成，旅途中可联系支持
              tone: positive
            - label: 中 — 公开的验证式评价页面
              tone: positive
            - label: 低 — 只有一条评价，没有二次预订证据
              tone: warning
        - label: Cyril Orhierie 旅行者评价
          values:
            - label: 高 — 明确提到交通和活动已处理
              tone: positive
            - label: 高 — 家庭行程执行完成
              tone: positive
            - label: 中 — 公开评价页面
              tone: positive
            - label: 低 — 没有复购或转介绍数据
              tone: warning
        - label: Becca Marsh
          values:
            - label: 中 — 主办旅行社选择和激活叙事强
              tone: positive
            - label: 中 — 五个月达到高级等级
              tone: positive
            - label: 中 — 具名独立顾问博客
              tone: warning
            - label: 低 — 仍是轶事性、自我选择的证据
              tone: warning
    approximationNotes: 该矩阵评分的是证据质量，不是客户价值；高分行并不代表具有代表性的队列结果。
