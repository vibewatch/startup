      - number: '8.3'
        title: 私营可比公司背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              在这组来源里，Navan 是最有用的私营或近上市类比，因为它同时展示了上行空间，以及当收入和交易量变得透明时，公开市场会给旅游软件施加的纪律。Navan 投资者关系页面披露 LTM 收入 $613
              million、LTM 总预订额 $7.6 billion；第三方报道则称，公司以 $6.2 billion 估值上市，此前私下估值一度为 $9.2 billion。这段历史重要，因为它说明，即便是有规模的 AI
              旅游平台，当投资者要求更强基本面时，也会被大幅重定价。Fora 更早期，规模也可能小得多，所以不需要用 Booking 式倍数交易才能支撑十亿美元轮次；但它也还没有 Navan
              那样的披露深度或收入规模。因此，入场纪律应把今天的估值视为饱满，除非私下尽调能证明，近期预订加速正在转化为九位数年化平台收入，且利润率质量在改善。
            claimRefs:
              - CV028
              - CV029
              - CV030
              - CV031
              - CV039
