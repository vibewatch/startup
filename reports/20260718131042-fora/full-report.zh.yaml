      - number: '8.4'
        title: 投资建议、信心与开放尽调
        blocks:
          - type: paragraph
            body: >-
              仅基于公开信息，正确建议是继续研究，而不是回避。Fora
              的牵引力已经超过虚荣独角兽，产品故事也比普通托管旅行社更好，但价格已经假设了大量未来效率。如果真实年化收入仍接近公开估计区间低端，相对公开可比公司，估值偏高。如果收入接近高端，且 AI
              确实能提升顾问生产力而不损害信任，价格可能走向合理。问题不在于上行情景不可能；问题在于，以当前价格，现有证据无法区分一家非常好的公司和一家只是包装得很好的公司。因此，决定性尽调问题很直接：按收入流证明已实现收入，证明利润率质量，证明队列留存和集中度，并证明
              AI 层提高吞吐量的速度快于它抬高支持、治理和信任成本的速度。
