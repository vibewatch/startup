      - number: '4.3'
        title: 规模、融资历程与基准语境
        blocks:
          - type: paragraph
            body: >-
              2026 年 7 月 Series D 重要，不只是因为它把 Fora 推成独角兽，还因为它发生在可见预订加速之后。Fora 累计预订额的第三个 $1 billion
              在第二个之后五个月达成，意味着近期总预订节奏远高于前三年。公开来源还称，本轮使累计融资达到 $138.5 million，资金将用于深化 Via、进入新市场、增加邮轮和航空能力，并继续招聘。Built In
              NYC 的招聘帖显示，公司目前有 200 多名全职员工；对于仍不披露现金消耗或现金余额的私营公司，这是有意义的成本基础代理指标。与上市旅游平台相比，Fora 绝对收入规模仍小很多：Booking 2025 年收入
              $26.9 billion，Airbnb 收入 $12.2 billion，TripAdvisor 2024 年收入 $1.8 billion，MakeMyTrip 2023 年收入 $593
              million。这个基准集合不能证明 Fora 被高估，但确实说明 $1 billion 标记奖励的是未来变现潜力，而不是已披露的当前规模。
