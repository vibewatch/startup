  topStrengths:
    - Public evidence supports real platform traction, including 15,000+ active advisors and $3B+ in cumulative bookings.
    - Fora's product looks more like an advisor operating system than a simple host agency, with booking, workflow, and AI surfaces reinforcing each other.
    - The July 2026 Series D and repeat participation from prominent investors validate strategic interest in the model.
  topRisks:
    - Public sources still do not disclose current revenue, gross margin, burn, runway, or cap-table preference terms.
    - The current $1 billion mark looks full unless actual annualized platform revenue is already near the high end of the public estimate band.
    - A novice-heavy advisor base makes activation, retention, and support quality strategic rather than cosmetic risks.
    - Supplier-commission pressure, travel cyclicality, or AI trust failures could compress both economics and future exit multiples.
  unresolvedGaps:
    - Monthly or quarterly revenue by stream remains private, forcing valuation work to rely on public estimates.
    - Gross margin, contribution margin, and support-cost visibility are not public.
    - Cohort retention, advisor concentration, and repeat-booking quality remain undisclosed.
    - The preference stack, dilution history, and current runway are not publicly available.
