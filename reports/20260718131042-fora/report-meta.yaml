companyProfile:
  summary: >-
    Fora is a New York-headquartered travel-advisor platform founded in 2021 by Henley Vazquez, Evan Frank,
    and Jake Peters. The business combines a host-agency style model with a modern software stack: advisors pay
    for access to training, supplier relationships, community, booking tools, commission administration, and AI
    assistance, then build their own travel-selling businesses on top. Public evidence supports more than 15,000
    active advisors, more than $3 billion in cumulative bookings, and a July 2026 Series D that established
    unicorn status at a $1 billion post-money valuation. The strategic appeal is real, but audited financial and
    cap-table detail remain private.
  foundedDate: '2021-08-01'
  founders:
    - name: Henley Vazquez
      role: Co-founder
      background: Travel operator and advisor with prior experience at Indagare and her own Virtuoso-affiliated agency.
      claimRefs: [CO002, CO003]
    - name: Evan Frank
      role: Co-founder
      background: Repeat travel entrepreneur who previously co-founded onefinestay and served as CEO of Context Travel.
      claimRefs: [CO002, CO004]
    - name: Jake Peters
      role: Co-founder and Chief Product & Technology Officer
      background: Product and technology leader anchoring Fora's software, booking-platform, and AI execution.
      claimRefs: [CO002, CO005]
  foundingLocation: New York City, New York, USA
  headquarters: New York City, New York, USA
  productSummary: >-
    Advisor operating system spanning advisor onboarding, training, supplier access, hotel and partner search,
    booking workflows, CRM, commission tracking, invoicing, secure payment capture, community knowledge, and the
    Via / Sidekick AI assistance layer.
  customerFocus: Independent and aspiring travel advisors serving leisure travelers across premium, family, group, and specialty trips.
  businessModel: >-
    Membership plus transaction economics: advisors pay an annual platform fee and share supplier commissions and
    service-fee flows with Fora, with productivity and retention improving as advisors move into higher-value categories.
  stage: Late-stage private unicorn (Series D)
  fundingStatus: >-
