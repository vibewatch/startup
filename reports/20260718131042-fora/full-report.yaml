      - number: '8.2'
        title: Comparable Frameworks and Scenario Bounds
        blocks:
          - type: paragraph
            body: >-
              Public comps are useful here, but only if handled carefully. Booking and Airbnb are far larger and more
              mature than Fora, while TripAdvisor is lower-growth and structurally different, and MakeMyTrip is
              geographically different with an older revenue base. Even so, they anchor the range of what public travel
              platforms trade for when revenue is known. Based on current market caps and published revenues, Booking
              screens near 5.2x trailing revenue, Airbnb around 7.1x, TripAdvisor roughly 0.9x, and MakeMyTrip roughly
              8.7x using its latest revenue figure available in the retained source set. Against that backdrop, Fora’s
              mark can look reasonable only if the company’s current annualized revenue is much closer to the high end
              of a public estimate range than to the low end. A simple model using disclosed bookings velocity and
              publicly visible commission economics suggests a recent annualized revenue range of roughly $48 million to
              $108 million, which would put the current mark around 9x to 21x revenue. That is above large public travel
              marketplaces and closer to premium private-software thinking.
