  - id: FE004
    title: Product maturity / capability map
    type: matrix
    layout: wide
    summary: >-
      Public evidence suggests higher maturity in training, booking workflow, and AI-enabled retrieval than in fully
      auditable trust documentation or published reliability metrics.
    data:
      columns:
        - Evidence breadth
        - Current maturity
        - Differentiation
        - External auditability
      rows:
        - label: Booking workflow
          values:
            - label: High — multiple sources describe live workflow
              tone: positive
            - label: Medium-High — alpha launched and later expanded
              tone: positive
            - label: High — unified booking + payments + data is differentiated
              tone: positive
            - label: Medium — outsiders still lack product access
              tone: warning
        - label: AI assistants
          values:
            - label: High — funding, coverage, and jobs all point the same way
              tone: positive
            - label: Medium — Via is still beta, Sidekick is established
              tone: warning
            - label: High — domain-specific corpus is a real asset
              tone: positive
            - label: Low — no public accuracy or usage metrics
              tone: warning
        - label: Training and support
          values:
            - label: High — reviews and HAR profile repeatedly confirm breadth
              tone: positive
            - label: High — large lesson library and live sessions are established
              tone: positive
            - label: Medium — good enablement is valuable but imitable
              tone: warning
            - label: Medium — customer feedback is mixed but mostly positive
              tone: warning
        - label: Community data layer
          values:
            - label: Medium — evidence is descriptive rather than quantitative
              tone: warning
            - label: Medium — clearly active, but scale metrics are undisclosed
              tone: warning
            - label: High — shared knowledge compounds product value
              tone: positive
            - label: Low — no external access to validate depth
              tone: warning
        - label: Privacy / legal controls
          values:
            - label: Medium — pages exist and payment security is named
              tone: warning
            - label: Medium — likely real controls, but evidence is incomplete
              tone: warning
            - label: Medium — trust layer is necessary, not uniquely differentiating
              tone: warning
            - label: Low — bot-blocked pages limit verification
              tone: warning
    approximationNotes: >-
      Ordinal matrix labels reflect diligence judgment from retained public evidence, not internal scorecards or uptime
      reports.
