      - number: '3.4'
        title: Adverse Evidence and Monitoring Priorities
        blocks:
          - type: paragraph
            body: >-
              Public adverse evidence is not thesis-breaking, but it is directionally useful. Trustpilot reviews
              indicate that service quality, refund handling, and international-fit issues can surface at the customer
              edge. That matters because one of Fora’s explicit differentiators versus self-service tools is human
              accountability; if service consistency slips, the brand advantage over OTAs and pure software narrows.
              More broadly, Travel Weekly’s fee-adoption reporting reminds investors that advisors everywhere are under
              commission pressure, which can make a strong-sounding split less meaningful unless the platform also
              improves productivity and lead conversion. The competitive watch list for the next 12 months is therefore
              broader than any one rival. Investors should monitor whether TravelJoy or similar tools keep getting ‘good
              enough’ for independent advisors, whether luxury incumbents retain the highest-value advisors and supplier
              relationships, whether activity platforms eat more of the itinerary wallet, and whether Fora’s own
              newcomer cohorts retain and monetize well enough to prove its supply-creation thesis.
