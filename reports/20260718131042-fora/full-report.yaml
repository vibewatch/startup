  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Fora does not address the entire travel economy directly. The relevant market is the intersection of
              commissionable travel distribution, advisor-led trip planning, and software that helps independent sellers
              acquire clients, research inventory, book trips, and get paid. That boundary is much narrower than WTTC’s
              $11.6 trillion global travel-and-tourism GDP footprint but much broader than a niche host-agency software
              market. Public sources show several status-quo substitutes. At one end are legacy agencies and home-based
              independents that still rely on manual workflows, fragmented tools, and supplier commissions. At the other
              end are OTAs and direct digital channels such as Booking Holdings, Expedia Group, Airbnb, GetYourGuide,
              and Klook, which capture demand through self-service convenience, broad inventory, and brand trust.
              Corporate travel-management platforms such as Navan serve a different but adjacent workflow. Fora’s
              differentiated claim is that a modern platform can expand the advisor workforce itself, not just help
              incumbents work faster. That matters because the company is recruiting first-time advisors and
              career-switchers rather than only chasing already-productive veterans.
            claimRefs:
