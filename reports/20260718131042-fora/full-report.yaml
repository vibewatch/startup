chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Category Thesis, and Advisor Operating Model
        blocks:
          - type: paragraph
            body: >-
              Fora is a New York-based travel-advisor platform that started operating in 2021 and explicitly set out to
              modernize a part of travel distribution that its founders viewed as technologically backward and socially
              gatekept. Public materials consistently describe the company as both a host agency and a software
              platform: advisors pay for access to tooling, supplier relationships, training, and community, then build
              independent travel businesses on top. That positioning matters because Fora is not merely another retail
              travel agency competing for end travelers; it is attempting to create a scalable advisor-enablement layer
              that can recruit new sellers faster than legacy host agencies. The membership stack includes the booking
              portal, itinerary and quote tools, commission administration, onboarding support, and community
              infrastructure, while the economic hook is a 70/30 default commission split that can improve with
              production. Public pricing pages suggest a $299 annual membership with installment-plan variants,
              indicating the company is actively tuning entry-friction versus recurring revenue. The model is
              intentionally inclusive: official and media sources frame Fora as a way for parents, creators,
              side-hustlers, and other newcomers to enter travel advising without inheriting a book of business or
              stitching together multiple legacy tools.
