      - CE043
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Fora’s core customer journey starts with aspiration and low-friction entry, then rises or falls on training, first
      bookings, and community-supported repeat use.
    data:
      items:
        - label: 'Discovery: aspiring advisor sees a legitimate host-agency path rather than an MLM-style recruitment pitch'
        - label: 'Join: low annual fee and no quotas reduce friction for career-switchers, parents, and part-time users'
        - label: >-
            Learn: training library, webinars, cohorts, community, and AI tools teach destinations, suppliers, and
            process
        - label: 'First bookings: advisor uses portal, supplier access, and support to serve initial traveler clients'
        - label: >-
            Expansion: repeat bookings, niche development, fees, and Pro thresholds turn a side interest into a real
            business
        - label: >-
            Durability test: retention depends on support consistency, cross-border fit, and whether the advisor reaches
            sustainable volume
    approximationNotes: >-
      The journey map reflects the most repeated advisor path in public reviews and trade coverage; it is not a measured
      internal funnel.
    claimRefs:
      - CU002
      - CU010
      - CU012
      - CU018
      - CU025
      - CU026
      - CU028
  - id: FU002
    title: Adoption / deployment funnel
    type: flow
    layout: wide
    summary: >-
      Fora’s publicly visible funnel moves from broad advisor acquisition into training, first trips, traveler delivery,
      and a smaller but more valuable repeat-booking core.
    data:
      nodes:
        - label: Large top-of-funnel advisor acquisition with 15,000+ active accounts
        - label: Novice-heavy mix, with 97% new to travel advising
        - label: Training, community, and AI tools accelerate first-client readiness
        - label: Advisors begin serving travelers across 180+ countries
        - label: Best users climb tiers, earn better splits, and generate repeat bookings
        - label: 'Public denominator gap remains: active-booking, renewing, and top-decile shares are undisclosed'
    approximationNotes: This funnel uses public milestones and user narratives rather than disclosed cohort conversion percentages.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU012
      - CU018
      - CU023
      - CU041
