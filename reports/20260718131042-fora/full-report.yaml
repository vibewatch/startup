              career-switchers, side-hustlers, parents, retirees, and digitally native travel enthusiasts rather than
              only legacy agents with inherited books of business. Travel Research Online adds useful demographic
              texture, describing the network as 86% women and nearly half parents. That mix matters because it supports
              the thesis that Fora is manufacturing new advisor supply, but it also raises a hard activation question: a
              platform built for first-time entrants will likely have a much wider range of engagement intensity than a
              network built only for full-time veterans.
