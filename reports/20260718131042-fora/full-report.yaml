      - number: '1.3'
        title: Capital Formation, Scale, and Milestone Record
        blocks:
          - type: paragraph
            body: >-
              Fora’s capital story is straightforward at the top line and incomplete in the details. The current
              headline is clear: the company closed a $60 million Series D in July 2026 at a $1 billion post-money
              valuation, bringing lifetime disclosed funding to $138.5 million. The prior major financing on the record
              is a $60 million Series B and C announcement in April 2025 led by Thrive Capital and Insight Partners.
              Going further back, a 2021 launch profile reported a $5 million seed round led by Forerunner Ventures.
              Those pieces do not fully reconcile to the lifetime total, which implies at least one additional capital
              event, extension, or converted instrument that is not decomposed in the public materials retrieved for
              this run. Operational milestones are clearer than financing granularity. By April 2025 the company said it
              had crossed $1 billion of sales and 2 million booked nights, and by July 2026 independent coverage
              corroborated the jump to more than $3 billion in cumulative bookings. The acceleration—from three years to
              the first billion, then eight months and five months for the next two—supports management’s claim that the
              platform is scaling faster as advisor density, supplier access, and AI tooling improve together.
