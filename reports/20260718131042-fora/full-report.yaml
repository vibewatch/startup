  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      Most downside paths transmit through a few common channels: compliance failure, support failure, supplier
      economics pressure, or macro demand shock ultimately hit bookings, trust, and valuation support.
    data:
      nodes:
        - id: reg
          label: Compliance / privacy lapse
          detail: Registration, disclosure, or data-governance failure
          tone: warning
        - id: ops
          label: Support / service breakdown
          detail: Refund, communication, or in-trip resolution misses
          tone: warning
        - id: supplier
          label: Supplier / commission pressure
          detail: Commission compression or weak partner economics
          tone: warning
        - id: macro
          label: Macro travel shock
          detail: Tariffs, travel bans, inflation, or airfare spikes
          tone: warning
        - id: trust
          label: Advisor and traveler trust
          detail: Perceived reliability of the platform and advisor network
          tone: warning
        - id: bookings
          label: Bookings and retention
          detail: Trip volume, fee adoption, and repeat behavior
          tone: negative
        - id: valuation
          label: Valuation support
          detail: Investor willingness to underwrite future growth and margins
          tone: negative
      edges:
        - from: reg
          to: trust
        - from: ops
          to: trust
        - from: supplier
          to: bookings
        - from: macro
          to: bookings
        - from: trust
          to: bookings
        - from: bookings
          to: valuation
        - from: supplier
          to: valuation
        - from: reg
          to: valuation
    approximationNotes: >-
      The map is qualitative and directional; it shows how risks transmit into core outcomes rather than assigning
      percentages or dollar losses.
    claimRefs:
