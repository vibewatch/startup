      - number: '1.2'
        title: Founders, Leadership, and Governance Visibility
        blocks:
          - type: paragraph
            body: >-
              The founding trio combines category knowledge, marketplace-building, and product leadership. Henley
              Vazquez brought prior operator credibility from travel advising and agency building; Evan Frank brought
              repeat-founder experience from onefinestay and Context Travel; and Jake Peters is the clearest publicly
              titled executive, identified as co-founder plus chief product and technology officer. Official materials
              also show a broader operating bench—head of international, chief revenue officer, head of training and
              development, head of flights, and other functional leaders—which suggests the business has already moved
              beyond a purely founder-driven startup into a more specialized operating structure. Even so, key-person
              exposure remains meaningful because the public narrative still relies heavily on the founders’ category
              story and investor-facing messaging, especially around AI, entrepreneurship, and supplier-distribution
              change. Governance visibility is weaker than leadership visibility: retrieved sources name major investors
              and round leads but do not disclose a current board roster, observer rights, or any formal committee
              structure. That makes it difficult to judge how much control founders retain after the 2025 and 2026
              financings, and it pushes governance diligence into the evidence-gap bucket rather than the confirmed-fact
              bucket.
