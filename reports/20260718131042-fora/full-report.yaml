      - number: '2.2'
        title: Sizing Lenses, Channel Economics, and Headroom
        blocks:
          - type: paragraph
            body: >-
              The market can be sized through at least three defensible lenses. First, ASTA’s fact sheet implies a large
              U.S. agency-mediated base by pairing $1.57 trillion of 2025 travel spend with its one-in-four
              travel-dollar share for agencies, which yields an indicative U.S. agency-booked spend pool near $392.5
              billion. Second, Phocuswright and PhocusWire show that digital travel distribution is already massive and
              still compounding: $1.67 trillion of gross bookings in 2025, roughly $1.07 trillion of it online, rising
              toward $1.2 trillion and about 65% online share by 2026. Third, Fora’s own framing points to an
              addressable channel gap: the company argues travel advisors still account for less than 10% of hotel
              bookings despite travel’s overall scale. Against those lenses, Fora’s disclosed $3 billion of cumulative
              bookings remains tiny—well under 1% of the U.S. agency proxy and around 0.3% of the online-booking lens.
              Those percentages are rough rather than definitive, but directionally they show that even a post-unicorn
              Fora is still early relative to the total distribution opportunity.
            claimRefs:
