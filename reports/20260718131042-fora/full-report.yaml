      - number: '7.4'
        title: People, Execution, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Execution risk remains meaningful because the same strategic choices that make Fora interesting also raise
              the burden on management. The Series D thesis is tied directly to Via, new markets, flights, cruises,
              enterprise adjacency, and continued hiring. That creates concentrated execution pressure on the founding
              and product leadership bench, especially when the customer base is mostly novice advisors who need
              reliable education and support rather than only software. Public hiring pages show a 200-plus-employee
              organization still scaling AI and data teams, which is positive but also means role clarity, product
              prioritization, and quality control are moving targets. The practical kill criteria are therefore
              straightforward: if advisor activation stalls, if support variance worsens, if supplier economics compress
              faster than fees can offset them, or if AI adds visible trust failures, the growth story can decelerate
              long before the company runs out of narrative. The correct mitigation posture is active monitoring, not
              passive optimism.
