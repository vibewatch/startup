      - number: '8.3'
        title: Private-Comp Context and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              Navan is the most useful private or recently public analog in this source set because it shows both the
              upside and the discipline public markets impose on travel software when revenue and volume are visible.
              Navan’s investor-relations page reports $613 million of LTM revenue and $7.6 billion of LTM gross booking
              volume, while third-party coverage says the company went public at a $6.2 billion valuation after having
              once been marked at $9.2 billion privately. That history matters because it shows that even a scaled
              AI-powered travel platform can be repriced materially when investors demand stronger fundamentals. Fora is
              much earlier and likely much smaller, so it does not need to trade on Booking-like multiples to justify a
              billion-dollar round; however, it also does not yet have Navan-like disclosure depth or revenue scale.
              Entry discipline should therefore treat today’s mark as full unless private diligence can prove that
              recent booking acceleration is translating into nine-figure annualized platform revenue with improving
              margin quality.
            claimRefs:
              - CV028
              - CV029
              - CV030
              - CV031
              - CV039
              - CV040
              - CV041
          - type: table
