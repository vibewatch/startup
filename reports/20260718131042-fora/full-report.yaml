  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization Mechanics
        blocks:
          - type: paragraph
            body: >-
              Fora monetizes the travel-advisor workflow through a layered model rather than a single SaaS subscription.
              Public evidence supports three current monetization rails: annual advisor membership fees, a retained
              share of supplier commissions after the advisor split, and advisor-billed service fees routed through the
              platform. The membership fee keeps entry friction low at $299 per year, while the real economic engine is
              the commission layer tied to bookings volume. Travel Research Online and Host Agency Reviews make clear
              that Fora is deliberately designed for first-time advisors, so headline advisor count is less informative
              than the proportion who become productive bookers. Public disclosures show a 70/30 default split that
              improves with production thresholds, which means Fora captures more dollars from breadth and booking
              throughput than from high headline software pricing. That creates upside when booking volume compounds,
              but it also means revenue quality still depends on supplier commission realization, advisor activation,
              and category mix that the company has not published in audited form.
