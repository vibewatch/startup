      - number: '2.4'
        title: Growth Drivers, Constraints, and Market Readiness
        blocks:
          - type: paragraph
            body: >-
              The demand side of the market remains constructive. Deloitte’s 2025 outlook describes resilient travel
              demand, work-from-anywhere behavior, and AI acceleration as durable forces shaping the industry.
              PhocusWire’s 2026 summary adds direct evidence that traveler use of AI is now mainstream, with more than
              half of active U.S. travelers using AI in some form and 39% using it specifically for travel planning or
              research. That creates a double-edged dynamic for Fora. On the positive side, AI can lower advisor
              busywork, improve itinerary quality, and make a distributed network of semi-professional sellers more
              productive. On the negative side, the same tools can commoditize low-complexity trip planning and
              intensify competition from OTAs or pure AI trip planners. Economics are evolving too: Travel Weekly
              reports that 55% of U.S. agencies now charge fees as commissions remain under pressure, which is favorable
              for advisor professionalism but a reminder that supplier-funded distribution alone is not enough.
              Regulation is the other key constraint. Deloitte’s 2026 outlook highlights visa processing, privacy rules,
              junk-fee scrutiny, and AI oversight, all of which can shape where digital travel platforms grow fastest
              and how personalized pricing or recommendations are deployed.
