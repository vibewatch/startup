      - number: '7.2'
        title: Operational, Quality, and Platform Risk
        blocks:
          - type: paragraph
            body: >-
              The biggest operating risk is not that Fora lacks tools; it is that the entire customer promise depends on
              those tools working consistently for a beginner-heavy advisor base in live travel situations. Trustpilot
              reviews reveal the tails of that distribution: some travelers report excellent white-glove service, while
              others describe refund friction, missed communications, or unsupported in-trip problem resolution.
              Cross-border onboarding adds another edge case, with at least one U.K.-based advisor saying they
              discovered U.S.-only limitations only after training. The AI layer increases both leverage and fragility.
              Public hiring signals show Fora building on MCP tooling, agent orchestration, retrieval, provider SDKs,
              and non-deterministic evaluation frameworks, which is strategically impressive but also means accuracy,
              privacy, model-cost, and vendor-change risk now sit inside the operating core rather than at the edge.
              Until diligence sees uptime history, escalation paths, and AI quality metrics, operational maturity should
              be treated as still forming.
            claimRefs:
