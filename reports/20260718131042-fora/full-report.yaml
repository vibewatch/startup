  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Exposure
        blocks:
          - type: paragraph
            body: >-
              Fora operates in a travel-distribution channel where compliance is not optional and where the regulatory
              burden compounds as geography expands. California’s Seller of Travel regime requires registration and
              display of registration numbers, while Ontario’s TICO framework governs roughly 2,100 registered travel
              retailers and wholesalers. Fora’s own public help-center structure shows that seller-of-travel compliance
              is important enough to merit dedicated advisor guidance, but the first-party page was bot-protected in
              this run, limiting independent review of the actual rules the company communicates to advisors. Privacy
              creates a second legal layer. FTC guidance makes clear that companies must honor privacy promises and
              maintain security appropriate to the data they hold, and the same guidance explicitly calls out mobile
              apps and tech tools as privacy-sensitive surfaces. For a platform that stores traveler and payment data
              while also deploying AI over internal corpora, incomplete public visibility into privacy, terms, and
              support documentation should be treated as a diligence issue, not a formatting issue.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
