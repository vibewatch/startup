  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The public-only recommendation follows a simple chain: real growth proof exists, but disclosure quality and comp
      discipline still cap conviction.
    data:
      nodes:
        - id: proof
          label: Real traction proof
          detail: 15,000+ advisors and $3B+ bookings show the company is more than a concept
          tone: positive
        - id: ai
          label: AI and workflow upside
          detail: Via and Sidekick could lift advisor productivity and category expansion
          tone: positive
        - id: gap
          label: Disclosure gap
          detail: Revenue, margins, runway, and cohort concentration remain private
          tone: warning
        - id: comp
          label: Comp discipline
          detail: Public travel platforms mostly trade below Fora’s low-case implied multiple
          tone: warning
        - id: rec
          label: 'Recommendation: research-more'
          detail: Current price is investable only after deeper private diligence closes the denominator gap
          tone: negative
      edges:
        - from: proof
          to: ai
        - from: ai
          to: gap
        - from: gap
          to: comp
        - from: comp
          to: rec
    approximationNotes: >-
      This is a judgment chain, not a mathematical model; it encodes why evidence quality, not only growth, controls the
      recommendation.
    claimRefs:
      - CV001
      - CV003
      - CV009
      - CV021
      - CV033
      - CV041
      - CV042
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      The biggest swing factors are realized revenue, retention quality, and whether the market rewards Fora closer to
      software-like or marketplace-like comp bands.
    data:
      items:
        - label: Real revenue proves >$100M annualized
          value: 2
        - label: Cohort retention surprises positively
          value: 1.5
        - label: Public comp compression dominates
          value: -2
        - label: Revenue lands near low estimate band
          value: -2.5
        - label: AI quality or trust issues emerge
          value: -1.5
    approximationNotes: >-
      Values are directional valuation-impact scores in hundreds of millions of dollars relative to the current $1B
      mark, not a DCF output.
    claimRefs:
      - CV033
      - CV034
      - CV036
      - CV037
      - CV039
