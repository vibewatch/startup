  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Cluster Map
        blocks:
          - type: paragraph
            body: >-
              Fora’s competitive landscape is not a single peer set. The first cluster is software-only tooling for
              already-existing advisors, where TravelJoy is the clearest benchmark: CRM, itineraries, payments, and
              automations sold as standalone SaaS. The second is host-agency and advisor-network incumbents such as
              InteleTravel, Avoya, and, in a more luxury-specific way, Brownell and Virtuoso. The third is scaled
              digital distribution platforms—Booking, Expedia, Airbnb, and specialist experiences platforms like
              GetYourGuide and Klook—that win on convenience, breadth, and consumer brand. The fourth is adjacent
              workflow owners such as Navan in corporate travel. CB Insights reinforces that the competitive set extends
              beyond old-line host agencies into travel-tech and planning products. This matters because Fora does not
              simply need to beat another host agency on commission split; it has to be good enough that aspiring
              advisors choose to build their business on Fora instead of using a software tool, joining a legacy
              network, or defaulting back to consumer self-service channels.
