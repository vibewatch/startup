- id: customer-verdict-and-diligence-blockers
  title: Customer Verdict and Remaining Diligence Blockers
  body: 'The public customer story is good enough to believe that Fora has built genuine product-market fit with aspiring and flexible-work advisors, but not good enough to fully measure customer quality. The strongest signals are scale, social proof, and repeated workflow praise: the network is large, the platform appears especially attractive to novices, and named users can describe what they actually do with the tooling. The weakest signals are all denominator questions. Public sources do not show how many of the 15,000-plus advisors book monthly, how many renew after year one, how much volume the median advisor produces, what percent of travelers become repeat end clients, or how concentrated gross bookings are in the Pro tier. For investors, that means the right customer conclusion is positive but incomplete: Fora has clearly found demand, but it still needs cohort and concentration data before the customer ledger can be called fully underwritten. Publicly, today.'
