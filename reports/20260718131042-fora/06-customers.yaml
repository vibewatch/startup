- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Fora’s core customer journey starts with aspiration and low-friction entry, then rises or falls on training, first bookings, and community-supported repeat use.
  data:
    items:
    - label: 'Discovery: aspiring advisor sees a legitimate host-agency path rather than an MLM-style recruitment pitch'
    - label: 'Join: low annual fee and no quotas reduce friction for career-switchers, parents, and part-time users'
    - label: 'Learn: training library, webinars, cohorts, community, and AI tools teach destinations, suppliers, and process'
    - label: 'First bookings: advisor uses portal, supplier access, and support to serve initial traveler clients'
    - label: 'Expansion: repeat bookings, niche development, fees, and Pro thresholds turn a side interest into a real business'
    - label: 'Durability test: retention depends on support consistency, cross-border fit, and whether the advisor reaches sustainable volume'
  approximationNotes: The journey map reflects the most repeated advisor path in public reviews and trade coverage; it is not a measured internal funnel.
