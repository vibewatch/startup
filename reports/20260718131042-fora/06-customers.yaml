- id: retention-satisfaction-and-expansion-risk
  title: Retention, Satisfaction, and Expansion / Concentration Risk
  body: 'Retention is the biggest customer diligence gap, so the best public read comes from proxies. Industry benchmarks from Gitnux and WorldMetrics suggest advisor-led travel still benefits from high repeat intent, strong personalization demand, and meaningful complex-itinerary use cases. Yet Fora-specific durability evidence is mostly anecdotal. Trustpilot and Host Agency Reviews show many enthusiastic advisor reviews, including users who stayed for 18 months to two years and describe the platform as a valuable second-career or part-time business engine. At the same time, the same review surfaces show the risks of a broad beginner-heavy network: some advisors or travelers cite delayed support, refund frustration, or geographic limitations such as U.K.-based advisors discovering certain bookings were U.S.-only. The most likely concentration risk is therefore not one giant enterprise customer; it is overreliance on a small productive advisor cohort while the majority of accounts remain
    early-stage, sporadic, or still learning the trade.'
  claimRefs:
