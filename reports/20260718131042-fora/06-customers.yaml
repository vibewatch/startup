- id: TU003
  title: Named customer proof table
  columns:
  - Named customer / advisor
  - Segment
  - Use case
  - Outcome or evidence
  - Limit / caveat
  rows:
  - - Beth Kaczka
    - Newer advisor / workflow power user
    - Uses Sidekick for fast research inside portal
    - Describes Sidekick as a lightning-fast research assistant that helps craft tailored itineraries
    - Advisor quote shows workflow value, not revenue output
  - - Rita Carton
    - Advisor using AI drafting tools
    - Uses AI to reformat GDS-style content for clients
    - Says AI turns coded booking descriptions into readable client language
    - Single-use-case proof, not full-book workflow proof
  - - Patricia Caruso traveler review
    - End traveler served by Fora advisor
    - European itinerary planning and in-trip support
    - Traveler says the trip was perfectly organized and the advisor was highly available
    - Single review; no spend or repeat-booking data
  - - Cyril Orhierie traveler review
    - End traveler served by Fora advisor
    - Punta Cana family trip planning
    - Traveler cites pre-arranged transport, activities, and smooth family experience
    - Single review; no evidence on margins or repeat rate
  - - Becca Marsh
    - Independent advisor choosing a host
    - Selected Fora after screening out MLM-like options and valuing training and support
    - Reports five months to reach advanced tier and immediate ability to start booking
    - Independent blog is anecdotal and self-selected
  notes: Named proof combines advisor-workflow evidence and traveler-outcome evidence; it is directionally strong but not a substitute for cohort analytics.
