  figureRefs:
  - FU001
- id: adoption-growth-and-customer-proof
  title: Adoption Trajectory and Named Customer Proof
  body: Public adoption evidence is strongest at the top of the funnel and in anecdotal but credible proof points. Fora crossed more than $3 billion in bookings by July 2026 and said those bookings served travelers across 180-plus countries, which implies the advisor network is not merely signing up accounts but facilitating real travel volume. Named proof comes from both advisor-side and traveler-side sources. Host Agency Reviews quotes advisors Beth Kaczka and Rita Carton describing concrete workflow benefits from Sidekick and AI-assisted content formatting, while Trustpilot captures traveler reviews praising advisors such as Patricia Caruso and Cyril Orhierie for well-run trips. Those examples do not prove cohort-level retention, but they do show that the platform supports actual trip planning, customer communication, and delivered traveler experiences. The pattern is especially consistent for new and part-time advisors, who repeatedly describe training and community as the reasons they
    can start selling without stitching together a legacy toolkit.
