- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration or friction risk
  - Current public signal
  - Potential impact
  - Diligence path
  rows:
  - - Beginner-friendly onboarding
    - Many signups may remain low-output or hobbyist users
    - 97% of advisors are new to the profession
    - Can inflate network count without equivalent revenue depth
    - Request activation and booking-frequency cohorts
  - - Community and support model
    - Support quality may vary across advisor and traveler situations
    - Trustpilot includes both glowing and critical service stories
    - Inconsistent support can weaken referrals and repeat business
    - Request CSAT, ticket-response, and escalation metrics
  - - Cross-border advisor appeal
    - Some bookings and features may be U.S.-centric
    - U.K. reviewer said they found many desired bookings were U.S.-only
    - Can slow non-U.S. expansion and damage trust
    - Request country-by-country feature availability map
  - - Top-tier advisor economics
    - A small Pro cohort may drive outsized bookings
    - Public sources cite high-volume advisors and better tiers but not the cohort size
    - Network could be more concentrated than advisor-count headlines suggest
    - Request bookings concentration by top 1%, 10%, and Pro cohort
  - - Traveler referral loop
    - Positive traveler outcomes can expand advisor books quickly
    - Trustpilot contains strong traveler referrals and praise for named advisors
    - Great service can compound organically, but failures can travel just as fast
    - Request repeat-traveler and referral-source metrics
  notes: The main customer risk is not a single giant account; it is uncertainty around how much of the network becomes productive and stays productive.
