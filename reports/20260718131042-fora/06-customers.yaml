company:
  name: Fora
chapter:
  number: 6
  title: Customers
  summary: Fora’s primary paying customers are advisors, not end travelers, and the company’s clearest customer signal is that it has attracted a very large pool of first-time, predominantly female, flexible-work seekers into travel advising. Public customer evidence is directionally strong on advisor enthusiasm, onboarding breadth, and traveler outcomes in individual cases, but weak on cohort retention, active-booker concentration, and the share of the 15,000-plus advisors who become durable repeat sellers.
sections:
- id: customer-base-and-segmentation
  title: Customer Base Segmentation and Buyer / User / Payer Reality
  body: 'Fora’s customer map starts with a subtle but important distinction: the platform sells to advisors while travelers consume the service those advisors deliver. Public evidence shows that the advisor side is broad and unusually inclusive for a host-agency business. Fora says it has more than 15,000 active advisors, 97% of whom are new to travel advising, and third-party coverage repeatedly describes the user base as career-switchers, side-hustlers, parents, retirees, and digitally native travel enthusiasts rather than only legacy agents with inherited books of business. Travel Research Online adds useful demographic texture, describing the network as 86% women and nearly half parents. That mix matters because it supports the thesis that Fora is manufacturing new advisor supply, but it also raises a hard activation question: a platform built for first-time entrants will likely have a much wider range of engagement intensity than a network built only for full-time veterans.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
  - CU025
  - CU041
  tableRefs:
