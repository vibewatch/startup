- id: partner-macro-and-model-risk
  title: Partner, Macro, and Business-Model Risk
  body: 'Fora’s model sits on top of supplier economics and discretionary travel demand, so macro or distribution shocks can travel quickly into bookings, advisor morale, and valuation support. Travel Weekly’s fees coverage shows why: agencies increasingly charge planning fees because supplier commissions were cut or made less reliable, especially in air, and because professional service work often goes unpaid otherwise. TravelPulse and Travel Agent Central add a more immediate macro read. Advisors in 2025 and 2026 cited inflation, trip-cost pressure, direct-booking competition, government-policy uncertainty, tariffs, and travel bans as active business concerns. Luxury-demand strength does not eliminate that risk; if anything, it highlights how much of the current narrative relies on consumers continuing to spend on premium and complex travel. Fora’s own wedding-travel data, summarized in Luxury Travel Advisor, shows both upside and caution: destination wedding demand is up, but off-season
    value-seeking and domestic substitution are rising too. The model can work through turbulence, but it is not insulated from changes in commission pools, supplier bargaining power, or discretionary demand.'
  claimRefs:
  - CR025
  - CR026
  - CR027
  - CR028
  - CR029
  - CR030
  - CR031
  - CR032
  - CR033
  - CR034
  - CR035
