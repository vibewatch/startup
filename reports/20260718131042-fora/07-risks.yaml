- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Advisor activation weakness
    - First-booking conversion or renewal rate
    - Material deceleration for multiple cohorts
    - Re-cut growth assumptions and widen customer-concentration discount
  - - Support quality deterioration
    - Refund, communication, or in-trip complaint rate
    - Sustained rise without corresponding resolution improvement
    - Treat customer trust as a thesis-break factor
  - - Supplier economics compression
    - Commission realization or override loss
    - Meaningful net take decline not offset by fees
    - Lower revenue-quality and margin assumptions
  - - AI trust failure
    - Observable hallucination, privacy, or permission incident
    - One severe traveler-facing failure or repeated advisor distrust
    - Pause AI-upside credit until controls are proven
  - - Compliance breakdown
    - Registration, disclosure, or privacy lapse
    - Formal regulator action or material policy non-compliance
    - Escalate to high-severity legal risk and revisit investment case
  - - Macro demand shock
    - Tariff / travel-ban or inflation shock to advisor bookings
    - Bookings slowdown and rising fee-dependence at same time
    - Shift from growth thesis to resilience thesis
  notes: These kill triggers are designed to be monitored in diligence and post-investment, not inferred only from topline funding headlines.
