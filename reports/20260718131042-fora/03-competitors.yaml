- id: peer-profiles-and-positioning
  title: Peer Profiles, Positioning, and Capability Trade-offs
  body: 'The peer profiles show distinct strategic choices. TravelJoy is likely the cleanest software comparator: it is cheap, explicit, feature-led, and built for advisors who already know how to source supply and want workflow relief. InteleTravel, by contrast, emphasizes concierge service, supplier recognition, and long operating history. Avoya leans heavily into top-trip deals and consumer lead capture, meaning it competes partly as a demand owner rather than purely as an advisor-enablement layer. Brownell and Virtuoso lean into heritage, luxury relationships, and advisor prestige—attributes that are hard to reproduce with software alone but not optimized for low-friction entry by new sellers. Fora’s own pitch sits between these poles. It offers infrastructure, training, partner access, and community like a host agency, but it also markets a unified platform and AI tools more like a technology company. That hybrid posture is probably why public descriptions of Fora bounce between ‘modern
    travel agency,’ ‘platform,’ and ‘AI-powered travel agency’ depending on the source.'
