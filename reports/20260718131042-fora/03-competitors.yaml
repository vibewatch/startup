  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Comparable host-agency take rates, overrides, and supplier economics for InteleTravel, Avoya, Brownell, and Virtuoso-affiliated advisors.
    whyItMatters: Public homepages reveal positioning but not the unit-economics detail needed to compare true advisor earnings power.
    diligencePath: Request advisor agreements, commission schedules, and override policies from the main peers or from recruited advisors.
    relatedQuestionRefs:
    - QP007
    - QP011
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: supplier-access
    missingEvidence: Side-by-side data on preferred-partner depth, exclusive inventory, and conversion by supplier for Fora versus legacy peers.
    whyItMatters: Supplier access is a claimed moat, but public sources do not quantify how exclusive or monetizable it actually is.
    diligencePath: Obtain partner-count, preferred-program, and commission realization data from management and peer advisors.
    relatedQuestionRefs:
    - QP012
    - QP014
    relatedTableRefs:
    - TP002
    - TP004
  - type: private-evidence-only
    severity: material
    topic: advisor-cohorts
    missingEvidence: Cohort retention, productivity ramp, and churn data comparing first-time advisors with experienced recruits.
    whyItMatters: Fora’s most distinctive competitive claim is supply creation; without cohort data, moat durability is more narrative than proven.
    diligencePath: Request onboarding funnel and cohort productivity data for 2024-2026.
    relatedQuestionRefs:
    - QP008
    - QP013
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: minor
    topic: reputation
    missingEvidence: A normalized complaint and SLA benchmark versus peers instead of anecdotal review pages.
    whyItMatters: Trust and service quality are central in advisory travel but public review samples are noisy.
    diligencePath: Compare response times, complaint volumes, and satisfaction scores across host agencies and advisor platforms.
    relatedQuestionRefs:
    - QP015
    relatedTableRefs:
    - TP004
