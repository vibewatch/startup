callouts:
- calloutType: strength
  title: Fora’s most differentiated competitor is often “no advisor yet” rather than another host agency
  body: The company’s first-time-advisor focus changes the game. Software-only tools assume an existing seller. Legacy luxury networks assume an already credible advisor. Fora instead tries to create the advisor, which can make its addressable competitive pool larger than the formal host-agency market.
  claimRefs:
  - CP017
  - CP025
  - CP027
  - CP037
- calloutType: risk
  title: The competitive threat is cumulative substitution across workflow slices
  body: 'No single rival replicates Fora perfectly. The danger is that many players each own one important slice: TravelJoy owns workflow software, OTAs own self-service demand, luxury networks own prestige, and activity platforms own itinerary add-ons. If Fora cannot keep all of those slices coordinated, the moat weakens quickly.'
  claimRefs:
  - CP021
  - CP023
  - CP028
  - CP029
  - CP038
- calloutType: insight
  title: Fora is a hybrid of host agency, advisor OS, and recruitment engine
  body: That hybrid shape is why the company attracts multiple comparison sets. It is too software-led to be judged only as a traditional agency, and too host-agency-like to be judged only as vertical SaaS. The right benchmark is a weighted combination of both.
  claimRefs:
  - CP015
  - CP016
  - CP020
  - CP037
