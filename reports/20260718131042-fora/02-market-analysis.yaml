chapter:
  number: 2
  title: Market Analysis
  summary: 'Fora is attacking a very large but fragmented slice of travel distribution: a channel where travel agencies still touch meaningful spend, online booking continues to move toward trillion-dollar scale, and AI is changing both how trips are planned and how advisors can serve clients. The evidence supports a large TAM for advisor-led travel enablement, but the precise AI-enabled software SAM remains proxy-based because public sources mix end-market travel spend with channel economics.'
sections:
- id: market-boundary-and-substitutes
  title: Market Boundary and Status-Quo Substitutes
  body: Fora does not address the entire travel economy directly. The relevant market is the intersection of commissionable travel distribution, advisor-led trip planning, and software that helps independent sellers acquire clients, research inventory, book trips, and get paid. That boundary is much narrower than WTTC’s $11.6 trillion global travel-and-tourism GDP footprint but much broader than a niche host-agency software market. Public sources show several status-quo substitutes. At one end are legacy agencies and home-based independents that still rely on manual workflows, fragmented tools, and supplier commissions. At the other end are OTAs and direct digital channels such as Booking Holdings, Expedia Group, Airbnb, GetYourGuide, and Klook, which capture demand through self-service convenience, broad inventory, and brand trust. Corporate travel-management platforms such as Navan serve a different but adjacent workflow. Fora’s differentiated claim is that a modern platform can expand
    the advisor workforce itself, not just help incumbents work faster. That matters because the company is recruiting first-time advisors and career-switchers rather than only chasing already-productive veterans.
  claimRefs:
