- id: buyer-user-payer-segmentation
  title: Buyer, User, and Payer Segmentation
  body: 'The buyer-user-payer map in this market is more complex than in ordinary SaaS. The advisor entrepreneur is the immediate buyer of the platform membership and the day-to-day user of the software. The traveler pays the underlying trip cost and benefits from personalization, perks, and problem-solving, but is not usually the direct software customer. Suppliers—hotels, cruises, tours, and other partners—pay commissions that fund the advisor’s economics and indirectly the platform’s take. This creates a structurally attractive model when the platform can keep all three sides aligned: advisors need productivity and lead generation, travelers need trust and curation, and suppliers need high-value bookings at lower distribution cost. Travel Weekly, ASTA, and BLS all point to a highly fragmented advisor base, which means the platform layer can create value by professionalizing and aggregating supply. Fora’s first-time-advisor focus is therefore not just a recruiting choice; it is an attempt
    to manufacture new supply in a channel where incumbents are older, small-business-heavy, and not uniformly digital-first.'
