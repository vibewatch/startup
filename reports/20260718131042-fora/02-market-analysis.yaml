callouts:
- calloutType: strength
  title: The opportunity is big because travel distribution remains fragmented even after online channels scaled
  body: The strongest evidence for the market is not any single TAM number. It is the combination of ASTA’s agency-booked share, Phocuswright’s trillion-dollar online-booking channel, and BLS / Travel Weekly evidence that advisor supply is still fragmented and often manually operated. That creates room for a platform that professionalizes a long tail of sellers.
  claimRefs:
  - CM005
  - CM006
  - CM008
  - CM015
  - CM017
  - CM035
- calloutType: risk
  title: AI and OTAs expand the market while simultaneously capping how much of it advisors can defensibly own
  body: Traveler use of AI for research is already mainstream, and large digital platforms remain the default for simple itineraries. Fora’s market is therefore strongest where human judgment, curation, and accountability matter most; it is weakest where planning becomes a commodity workflow that software alone can satisfy.
  claimRefs:
  - CM016
  - CM018
  - CM023
  - CM026
  - CM027
  - CM040
- calloutType: insight
  title: Fora is best understood as a supply-creation platform inside a large channel, not merely a host agency taking incumbent share
  body: The company’s first-time-advisor focus matters. If Fora were only fighting for experienced agents, the market would look like a zero-sum host-agency battle. Because it recruits people who were not previously advisors, its upside is partly tied to expanding the labor pool that can serve advisor-mediated travel.
  claimRefs:
  - CM002
  - CM020
  - CM038
