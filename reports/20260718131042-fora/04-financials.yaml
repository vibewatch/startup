- id: unit-economics-and-productivity-proxies
  title: Unit Economics and Advisor Productivity Proxies
  body: 'The best public unit-economics evidence is indirect but still useful. Fora says more than 15,000 advisors are active, 97% are new to the profession, and some top producers now exceed $10 million in annual bookings. Those disclosures imply a wide dispersion curve in advisor productivity: the median advisor is almost certainly far below the top tier, but the platform has already proven that its best users can build meaningful books of business. Public operator commentary also shows why service fees matter. Travel Weekly reports that fee adoption is climbing across the advisor industry because supplier commissions alone do not always compensate for research, cancellation, and redesign work, especially after airline commission cuts. Fora’s own operating model fits that trend because the platform supports invoicing service fees while also giving high-volume advisors better commission splits. The resulting picture is a hybrid economics stack in which Fora earns a modest recurring membership
    fee, keeps a share of supplier commissions, and benefits when advisors mature into higher-value, fee-charging businesses.'
  claimRefs:
