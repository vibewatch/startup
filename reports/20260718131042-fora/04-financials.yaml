  title: The public model is good enough to bound revenue, but not good enough to trust margin quality
  body: Without disclosed revenue run rate, gross margin, cash balance, burn, and cohort retention, investors are still underwriting a story more than a published financial profile.
  claimRefs:
  - CI033
  - CI034
  - CI036
