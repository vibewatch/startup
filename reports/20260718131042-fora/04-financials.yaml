- id: financial-verdict-and-diligence-blockers
  title: Financial Verdict and Diligence Blockers
  body: A reasonable public model can bound the business, but it cannot fully underwrite it. Applying a 10% to 15% supplier-commission band to $3 billion of lifetime bookings implies a lifetime gross commission pool of roughly $300 million to $450 million. Applying Fora’s observable 10% to 30% retained share of that commission pool implies cumulative platform revenue of roughly $60 million to $135 million, before considering any service-fee revenue or mix effects. Using the most recent disclosed booking cadence, the latest $1 billion in five months annualizes to about $2.4 billion of bookings, which in turn suggests roughly $48 million to $108 million of annualized platform revenue if that pace holds and mix stays similar. At a $1 billion post-money valuation, that rough range implies a high-single-digit to low-twenties revenue multiple. The conclusion is not that the valuation is irrational; it is that the margin path, activation curve, cash burn, and revenue-recognition quality remain
    the real underwriting questions.
  claimRefs:
