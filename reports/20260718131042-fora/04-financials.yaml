- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public status
  - Signal
  - Why it matters
  - Current gap
  rows:
  - - Latest financing
    - $60M Series D at $1B post-money
    - Large fresh round lowers immediate financing pressure
    - Provides new cash for product, hiring, and expansion
    - Exact close date, investor terms, and preferences are undisclosed
  - - Total disclosed capital
    - $138.5M
    - Fora has raised enough to build platform and advisor supply before public profitability evidence
    - Shows real venture backing behind the model
    - No cap table or liquidation-preference detail
  - - Use of proceeds
    - Via, new markets, cruise, flights, enterprise, hiring
    - Capital is being directed toward growth and operating leverage bets
    - Shows management priorities for the next phase
    - No budget split between R&D, GTM, and international expansion
  - - Headcount proxy
    - 200+ full-time employees
    - Implies a meaningful operating cost base even before contractor and advisor-support spend
    - Useful burn proxy in absence of disclosed opex
    - No payroll, SBC, or contractor breakdown
  - - Runway / cash balance
    - Not publicly disclosed
    - Core adequacy question remains unanswered despite fresh funding
    - Determines whether the round is offensive or defensive
    - Need cash, burn, and runway bridge
  - - Debt / off-balance obligations
    - No material debt or project finance disclosed in retained public sources
    - Suggests a relatively light balance-sheet structure
    - Important for downside protection
    - Absence of disclosure is not proof of zero obligations
  notes: Capital adequacy can only be assessed directionally because cash balance, burn, and preferred terms remain private.
  claimRefs:
  - CI001
  - CI003
  - CI028
  - CI032
  - CI039
- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Best public proxy
  - Likely analytical effect
  - Diligence path
  rows:
  - - Revenue run rate / ARR
    - Needed to test valuation support and multiple discipline
    - Estimated from bookings, commissions, and split tiers
    - Current valuation could be either justified or stretched depending on actual realization
    - Request monthly revenue bridge by stream for 2024-2026
  - - Gross margin by category
    - Determines whether AI and central tooling create real operating leverage
    - Management positioning around automation and unified tooling
    - Could materially change margin quality versus a pure host-agency model
    - Request contribution margin by hotels, cruise, air, tours, and service fees
  - - Advisor activation and retention cohorts
    - Separates top-line advisor count from productive recurring supply
    - Top-producer anecdotes and Pro thresholds
    - Could reveal that scale is broad but shallow
    - Request cohorts for signed, trained, first-booking, and repeat-booking advisors
  - - Cash balance, burn, and runway
    - Determines financing dependency after the Series D
    - Total raise size and headcount proxy only
    - Could shift the recommendation from growth-backed to capital-dependent
    - Request current cash, monthly net burn, and 12-18 month plan
  - - Supplier concentration and override economics
    - Tests dependency risk and take-rate durability
    - Preferred-partner and supplier-database messaging
    - Could expose margin compression or concentration not visible in topline bookings
    - Request top suppliers by bookings, commission realization, and overrides
  notes: These are the specific missing private metrics that prevent a clean public underwriting of Fora’s current price.
