tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Current public signal
  - Revenue visibility
  - Key diligence ask
  rows:
  - - Advisor membership fees
    - $299 annual fee paid by advisors to join or remain on the platform
    - Repeated in Travel Research Online, Host Agency Reviews, and an independent advisor review
    - Visible list price; realized discounting is not disclosed
    - How many paying advisors renew at full price versus discounted or churned pricing
  - - Retained supplier commission share
    - Fora keeps the platform share of hotel, cruise, tour, and other supplier commissions after the advisor split
    - Default 70/30 split improves at production thresholds; some top advisors exceed $10M in annual bookings
    - Core economics are visible structurally but not disclosed as realized take rate
    - What blended commission realization and retained net take does Fora earn by product category
  - - Advisor service fees
    - Advisors can invoice service fees through the platform in addition to supplier commissions
    - Host Agency Reviews says the portal can invoice service fees; industry fee adoption is rising
    - Mechanism is public, dollar contribution is not
    - What share of active advisors charge fees and what gross volume runs through the portal
  - - Preferred-partner / supplier monetization
    - Fora aggregates preferred rates, perks, and supplier visibility inside its portal
    - Travel Agent Central describes a central supplier database and advisor-side commission visibility
    - Supplier override and marketing-fund economics are not public
    - How much margin comes from overrides, preferred partnerships, or other supplier economics
  - - Expansion categories
    - Series D proceeds will support cruises, flights, and enterprise-oriented growth
    - Multiple July 2026 articles cite category expansion as a use of funds
    - Forward-looking only; no category revenue split published
    - How quickly can higher-frequency or higher-ticket categories change take rate and retention
  - - AI-enabled productivity
    - Via and other automation are intended to raise advisor output and reduce back-office labor
    - Public sources frame AI as the operating layer that enables larger books of business
    - Productivity uplift is described but not quantified cohort by cohort
    - What is the before/after booking volume and margin profile for advisors using Via heavily
  notes: Current public evidence is strong on monetization mechanics but weak on realized revenue mix, renewal, and category-level take rates.
