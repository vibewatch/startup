callouts:
- calloutType: strength
  title: Fora has already demonstrated that a host-agency platform can scale bookings much faster than legacy narratives imply
  body: The jump from the second to the third billion of lifetime bookings in five months suggests real demand and advisor throughput, not just a vanity advisor-count story.
  claimRefs:
