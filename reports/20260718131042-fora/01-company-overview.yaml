- id: advisor-base-geography-and-public-signal
  title: Advisor Base, Geography, and Public Signal
  body: 'The scale indicators that are public point to a business that has already become meaningful inside the travel-advisor ecosystem. Fora says it has more than 15,000 active advisors, and multiple independent outlets repeat that figure along with the striking statistic that 97% of those advisors are new to travel advising. TIME adds qualitative texture, reporting that 86% of the advisor base is women and nearly half are parents. The company’s global footprint has also widened materially: official pages say advisors can apply from more than 140 countries, travelers are booked across more than 180 countries, and formal operations now exist in Canada and Mexico, where local advisor communities were already in the hundreds by mid-2025. Public proof of advisor earning power is directional rather than audited: company and media sources note that some members use Fora for supplemental income while top producers exceed $10 million in annual bookings, and Travel Research Online reports that
    some advisors reach seven-figure books in about 20 months. The public signal is not uniformly positive, however. Trustpilot reviews surface complaints around refunds, trip support, and international advisor constraints, reminding investors that a fast-growing network model still has to execute on service quality and operational consistency.'
