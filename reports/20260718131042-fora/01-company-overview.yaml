  evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Named board seats, observer rights, and governance committees across Fora’s preferred-stock rounds.
    whyItMatters: Investor influence and founder control cannot be evaluated cleanly without public board visibility.
    diligencePath: Request the latest board deck, stockholder agreement, and cap table summary from management or lead investors.
    relatedQuestionRefs:
    - QO007
    relatedTableRefs:
    - TO002
    - TO003
  - type: missing-source
    severity: material
    topic: operating-metrics
    missingEvidence: Current headcount, revenue run rate, gross margin, take rate, and advisor activity/retention metrics.
    whyItMatters: Cover-metric quality is limited when topline bookings are public but monetization efficiency is not.
    diligencePath: Ask for a KPI bridge covering advisor count, active-booking advisor count, take rate, revenue, and headcount for 2024-2026.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO001
  - type: conflicting-data
    severity: material
    topic: pricing
    missingEvidence: A reconciled explanation of why public pages show different installment-plan options for the same annual membership.
    whyItMatters: Pricing complexity affects onboarding friction, CAC assumptions, and the transparency of advisor economics.
    diligencePath: Obtain current price book by geography and compare to archived landing pages and advisor contracts.
    relatedQuestionRefs:
    - QO005
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: funding-history
    missingEvidence: A full round-by-round funding schedule reconciling the $5M launch-era seed, 2025 B/C round, and $138.5M lifetime total.
    whyItMatters: Incomplete funding decomposition obscures dilution history and any bridge/SAFE/secondary activity before the unicorn step-up.
    diligencePath: Request cap-table history and financing docs, including any SAFEs, convertibles, or undisclosed seed extensions.
    relatedQuestionRefs:
    - QO011
    - QO023
    relatedTableRefs:
    - TO003
    - TO004
  - type: private-evidence-only
    severity: minor
    topic: advisor-satisfaction
    missingEvidence: Cohort-level complaint, refund, or advisor-churn data behind the mixed public review signal.
    whyItMatters: Anecdotal negative reviews are directionally useful but insufficient to size the risk to advisor retention or traveler trust.
    diligencePath: Ask management for complaint volumes, response SLAs, refund resolution metrics, and advisor churn/renewal rates.
    relatedQuestionRefs:
    - QO020
    relatedTableRefs:
    - TO001
