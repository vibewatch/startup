- id: current-mark-peer-context
  title: 'Current mark: Proxima is now priced near the global fusion leader group'
  body: 'The €2.4 billion valuation makes Proxima the clear European leader by disclosed valuation and funding, while still below the most aggressive
    U.S. peer mark. Helion is the outlier, with a $15.5 billion post-money valuation in 2026 and an announced Microsoft power-delivery obligation.
    CFS is less transparent on valuation but is the capital-raised benchmark, having raised $863 million in 2025 and nearly $3 billion by that
    point, with analyst sources describing additional capital leadership. TAE shows the long-duration risk: more than $1.3 billion raised across
    many years, with older disclosed valuation marks well below Helion. Tokamak Energy is technologically relevant in European fusion but materially
    smaller by disclosed funding. The peer lesson is not that Proxima is cheap; it is that fusion markets reward credible milestones with venture-option
    valuations despite sparse revenue evidence.'
