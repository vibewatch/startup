- id: TV007
  title: Methods comparison table
  columns:
  - Method
  - Applicability
  - Output for Proxima
  - Why it matters
  rows:
  - - Revenue / EBITDA multiples
    - Not applicable
    - No public revenue, ARR, EBITDA, or product sales
    - Avoids false precision on a pre-revenue fusion company
  - - Capital-raised benchmark
    - Useful but blunt
    - Proxima at ~$2.7B value and ~$740M raised sits near top-tier peers but below Helion
    - Frames market willingness to finance fusion options
  - - Peer valuation comparison
    - Useful where marks are disclosed
    - Helion is the high-side reference; CFS/TAE/Tokamak mostly show capital intensity
    - Shows the current mark is neither unique nor fundamentals-proven
  - - Milestone-weighted option value
    - Best public method
    - Values Alpha, magnet scaling, utility/site commitments, and future funding access
    - Matches where real value creation or destruction occurs
  - - Venture method
    - Useful for return discipline
    - 5x-10x gross needs roughly €12B-€24B exit before later dilution
    - Shows the entry price demands a leader-scale outcome
  notes: Method comparison intentionally rejects traditional multiples and relies on option, milestone, and venture-return logic.
