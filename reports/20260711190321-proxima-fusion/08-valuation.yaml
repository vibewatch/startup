- id: downside-triggers-and-diligence
  title: 'Diligence: require milestone, structure, and capital-plan proof before paying the headline'
  body: 'The adverse case is not that fusion has no value; it is that investors may be asked to capitalize success before the decisive milestones
    exist. TechCrunch’s reporting on cracks in the fusion funding boom, MIT Technology Review’s cost caution, and the Bulletin’s skepticism toward
    commercial fusion hype all point to the same underwriting problem: timelines can slip, economics can disappoint, and public markets can reward
    narratives too early. Proxima’s own filing and press evidence confirms the entity and headline financing, but not the preference stack, ownership
    split, grant conditions, capex to Alpha, project-finance plan, or customer economics after grid connection. The minimum diligence package
    is therefore a milestone budget to Alpha, magnet production cost curves, signed partner/offtake terms, public-grant conditionality, and a
    cap-table waterfall. Without those, the valuation remains an expensive option, not a de-risked investment. A final IC model should therefore show both enterprise value and expected ownership after at least two additional financings. If the required capital stack forces investors to keep writing checks simply to preserve ownership, a headline mark that looks tolerable at entry can become unattractive even when technical progress is real. That is why the valuation decision should be revisited after each funded technical milestone, not treated as a static mark.'
