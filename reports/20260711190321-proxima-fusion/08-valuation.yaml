- id: TV008
  title: Final diligence asks and kill triggers table
  columns:
  - Topic
  - Missing evidence / trigger
  - Why it matters
  - Owner / diligence path
  rows:
  - - Cap table and preferences
    - Full post-round ownership, liquidation stack, pro-rata, anti-dilution, and primary/secondary mix
    - Headline post-money may overstate common-equity attractiveness
    - Legal counsel and company finance data room
  - - Alpha budget and schedule
    - Milestone budget, technical readiness levels, independent reviews, and contingency plan
    - Alpha slippage is the central bear-case trigger
    - Technical diligence with IPP/RWE milestone review
  - - Magnet manufacturing
    - HTS cable and magnet yield, cost curve, supplier constraints, and vertical integration capex
    - Manufacturing failure destroys option value before revenue
    - Engineering diligence and supplier interviews
  - - Strategic commitments
    - RWE site/offtake economics, Google demand logic, public-grant conditions
    - Strategic logos are not equivalent to bankable project finance
    - Partner diligence and grant-document review
  - - Next financing
    - Amount, timing, syndicate depth, and downside plan for the next multibillion-euro step
    - Future dilution can erase returns even if the company survives
    - Board/investor interviews and financing model
  - - Power economics
    - Expected capex/MW, LCOE range, uptime, maintenance, and tritium/fuel assumptions
    - Cost skepticism caps terminal value
    - Independent power-market and nuclear-engineering review
  notes: Final asks are the minimum to convert a strategic-quality judgment into a priced investment decision.
