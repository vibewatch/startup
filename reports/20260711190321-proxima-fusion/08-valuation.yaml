company:
  name: Proxima Fusion
chapter:
  number: 8
  title: Valuation
  summary: Proxima's €2.4B July 2026 mark is stretched on fundamentals because the company is pre-revenue, but it is understandable as a milestone-weighted
    fusion option with unusually strong European strategic support. The investable answer is track/research-more unless private diligence proves
    acceptable terms, dilution protection, Alpha budget credibility, and a path to leader-scale outcomes.
sections:
- id: recommendation-and-valuation-stance
  title: 'Recommendation: track the asset, do not underwrite the mark as fundamentals-backed'
  body: 'Proxima is a credible strategic asset, but the public valuation answer is deliberately price-sensitive. The disclosed July 2026 financing
    gives the market a clean headline: €411 million raised at a €2.4 billion post-money valuation, with Google and RWE among the strategic participants.
    That is meaningful validation for a two-to-three-year-old Max Planck spin-out, and it supports real option value around Alpha, verticalized
    magnets, and a European energy-security agenda. It does not create a fundamentals-backed price. Proxima has no public product revenue, ARR,
    EBITDA, or power-sales history, so the usual software or industrial multiples are category errors. The right stance is therefore stretched/expensive
    on fundamentals, but not irrational as a long-dated option if investors receive acceptable preferences, milestone financing, and enough ownership
    to survive later dilution. IC should track or research-more, not buy blindly at the headline mark.'
  claimRefs:
