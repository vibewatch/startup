  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preferences
    missingEvidence: Post-round ownership, primary versus secondary mix, liquidation preferences, anti-dilution, pro-rata rights, and governance
      terms.
    whyItMatters: The same €2.4B post-money mark can produce very different common-equity outcomes depending on structure and future financing
      rights.
    diligencePath: Request executed financing documents, cap table, side letters, and a liquidation waterfall from company counsel.
    relatedQuestionRefs:
    - QV018
    - QV028
    - QV030
  - type: private-evidence-only
    severity: material
    topic: milestone-budget
    missingEvidence: Detailed Alpha budget, cash runway, technical milestones, magnet manufacturing yield, contingency plan, and next-round capital
      need.
    whyItMatters: The valuation is an option on Alpha and follow-on financing; without a funded milestone plan, dilution and delay dominate expected
      value.
    diligencePath: Run technical diligence with independent fusion engineers and reconcile the Alpha budget to board-approved financing plans.
    relatedQuestionRefs:
    - QV008
    - QV019
    - QV029
    - QV030
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-valuation-table
    missingEvidence: A full paid-data-room set of private fusion post-money valuations, preference terms, and secondary marks for all relevant
      peers.
    whyItMatters: Public peer comparison relies on disclosed valuations for Helion and Proxima plus funding proxies for several others, not a
      complete market-clearing comp set.
    diligencePath: Pull PitchBook, Dealroom, CB Insights, secondary-market broker, and banker comp data during formal diligence.
    relatedQuestionRefs:
    - QV013
    - QV014
    - QV015
    - QV016
    relatedTableRefs:
    - TV004
  - type: conflicting-data
    severity: minor
    topic: market-data-scope
    missingEvidence: A reconciled definition of cumulative fusion funding by date, included company set, and whether public grants are counted.
    whyItMatters: Market-data sources use different scopes, so sector funding totals should be treated as context rather than precise valuation
      inputs.
    diligencePath: Normalize source definitions across FIA, TechCrunch, Clean Energy Platform, Tracxn, and CB Insights before using sector totals
      in a model.
    relatedQuestionRefs:
    - QV012
    - QV017
