- id: scenario-method-and-sensitivity
  title: 'Scenario method: option value dominates, while dilution controls common-equity value'
  body: 'The valuation model should be scenario-led rather than multiple-led. Bear value is mostly IP, team, grant relationships, and residual
    strategic optionality if Alpha slips or magnet manufacturing fails to scale. Base value is close to the current mark, accepting that strategic
    investors have validated Proxima while discounting the absence of revenue, operating metrics, cap-table detail, and demonstrated net-energy
    hardware. Bull value can be much larger, but only if Alpha and utility commitments make Proxima look more like a leader in the Helion/CFS
    peer group. Even then, common-equity returns depend on dilution: the July round alone is roughly 17% of post-money if primary, and the company
    likely needs several more large financings before any commercial plant. A venture-method investor entering at €2.4 billion needs a very large
    exit, not merely a successful next round.'
  claimRefs:
