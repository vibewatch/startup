- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Direction
  - What would change the view
  rows:
  - - Best-funded European fusion company after a €411M July 2026 financing
    - Thesis
    - Weak round structure or heavy preferences would make the headline less investable
  - - Google and RWE participation validate strategic relevance and future power-demand pull
    - Thesis
    - Strategics not deepening commitments after Alpha budget approval would reduce conviction
  - - Alpha and the Bavaria/RWE/IPP commercial-plant pathway create option value beyond a normal startup
    - Thesis
    - Major Alpha schedule slippage would move the case toward salvage-value logic
  - - No revenue, earnings, or commercial electricity sales make traditional multiples unusable
    - Anti-thesis
    - Signed bankable offtake or paid engineering/magnet revenue would improve underwriting
  - - Fusion peers show enormous capital intensity and long timelines before breakeven
    - Anti-thesis
    - A funded, milestone-based path to Alpha with limited dilution would reduce the discount
  - - Cost and hype skepticism cap the probability investors should assign to the bull case
    - Anti-thesis
    - Independent validation of net-energy progress and credible power economics would change this
  notes: The anti-thesis is not market-denial; it is price, timing, dilution, and evidence-quality risk.
