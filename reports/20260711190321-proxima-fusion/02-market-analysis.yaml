tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment/category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Proxima
  rows:
  - - Commercial fusion electricity
    - Power sold by future fusion plants, grid services, offtake contracts
    - Generic renewable PPAs and conventional nuclear output not tied to fusion
    - Utilities, hyperscalers, public power buyers
    - Core long-term revenue pool if Stellaris reaches grid operation
  - - Fusion plant development and components
    - HTS magnets, stellarator engineering, heat management, fuel-cycle systems, EPC preparation
    - Academic research with no commercialization path
    - Fusion developers, governments, strategic suppliers
    - Near-term spend pool before power revenue exists
  - - Clean firm power adjacency
    - Fission, enhanced geothermal, long-duration storage, gas CCS, firmed renewables
    - Intermittent-only renewables without firming
    - Hyperscalers, industrials, utilities
    - Substitute set that can satisfy demand before fusion arrives
  - - European energy-security demand
    - Domestic low-carbon baseload, industrial competitiveness, sovereign technology policy
    - Imported fossil fuel supply and non-firm offsets
    - EU/German governments, utilities, large industry
    - Explains Germany/Bavaria policy support and RWE interest
  - - Industrial heat / process energy
    - Future high-temperature heat or power-to-industry applications
    - Low-grade heat markets and unrelated efficiency services
    - Heavy industry and infrastructure operators
    - Plausible segment, but less supported by public Proxima evidence
  notes: Boundary separates future fusion revenue from broader clean-energy spend and from substitute technologies that compete
    for the same clean-firm-power budgets.
