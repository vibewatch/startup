  - - Government / sovereign technology
    - Research, economy, and energy ministries
    - Public labs, funding agencies, regional development bodies
    - Public grants, IPCEI/Euratom, state funding
    - Energy security, industrial competitiveness, strategic autonomy
    - R&D grants → hubs → demonstrator → regulatory framework
  - - Fusion supply chain
    - Fusion developers and tier-one suppliers
    - Magnet, materials, heat-management, vacuum, fuel-cycle teams
    - Developer capex and supplier expansion budgets
    - Need capacity ahead of commercial machines
    - Supplier qualification → long-term visibility → scaled production
