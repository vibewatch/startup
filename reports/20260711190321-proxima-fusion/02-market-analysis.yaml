  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sam-som
    missingEvidence: Management-backed TAM/SAM/SOM segmentation by buyer type, geography, plant count, capacity, price, and
      expected offtake volume.
    whyItMatters: Published fusion forecasts are broad scenarios and cannot show what Proxima can actually capture in Europe
      or Germany.
    diligencePath: Request market model, target plant capacity, offtake assumptions, pricing bands, RWE/Gundremmingen terms,
      and sensitivity cases.
    relatedQuestionRefs:
    - QM022
    - QM023
  - type: private-evidence-only
    severity: material
    topic: offtake
    missingEvidence: Binding or option-style offtake rights from RWE, Google, or other clean-firm-power buyers.
    whyItMatters: Strategic investments indicate interest but not necessarily future revenue, PPA price, or buyer commitment.
    diligencePath: Review investment side letters, MoUs, offtake discussions, exclusivity, site-control terms, and grid-interconnection
      responsibilities.
    relatedQuestionRefs:
    - QM011
    - QM012
    - QM023
  - type: conflicting-data
    severity: material
    topic: forecast-caveat
    missingEvidence: Independent forecast consensus separating commercial fusion electricity revenue from component, grant,
      and R&D spending.
    whyItMatters: Forecast providers may count very different revenue pools and may imply commercialization earlier than technical
      evidence supports.
    diligencePath: Compare paid analyst methodologies and ask management to reconcile market models with plant-delivery roadmap.
    relatedQuestionRefs:
    - QM004
    - QM019
    - QM025
  - type: private-evidence-only
    severity: minor
    topic: industrial-heat
    missingEvidence: Specific customer discovery, temperature requirements, and economics for process-heat applications.
    whyItMatters: Industrial heat is a plausible segment but is less evidenced publicly than grid electricity and data-center
      power.
    diligencePath: Request customer interview notes and technical integration studies for industrial heat or hydrogen-adjacent
      use cases.
    relatedQuestionRefs:
    - QM013
  - type: missing-source
    severity: minor
    topic: competitive-substitutes
    missingEvidence: Side-by-side buyer economics for SMRs, geothermal, storage-backed renewables, gas CCS and fusion in target
      geographies.
    whyItMatters: Clean-firm demand may be real while fusion still loses timing or bankability to alternatives.
    diligencePath: Build a buyer-level LCOE, permitting, delivery-date, and contractability comparison before underwriting
      fleet-scale adoption.
    relatedQuestionRefs:
    - QM021
