- id: drivers-and-buyers
  title: 'Demand segments and buyer path: utilities first, hyperscalers as strategic accelerants'
  body: The likely buyer path is led by power-system actors rather than individual industrial sites. Utilities and grid operators
    need reliable, decarbonized capacity as electrification and weather-dependent renewables increase system-balancing requirements;
    RWE’s investment and Gundremmingen partnership make it the clearest utility signal for Proxima. Hyperscalers are a second
    demand vector. Google’s own sustainability materials say its AI infrastructure buildout is accelerating faster than grids
    are decarbonizing, that it signed more than 12 GW of clean-energy agreements in 2025, and that it is making long-term
    bets on fusion while also scaling nuclear and enhanced geothermal. Data-center buyers value 24/7 carbon-free energy, speed
    to power, and credible long-duration supply, but they can also choose fission, geothermal, storage-backed renewables,
    or grid contracts before fusion arrives. Industrial heat is a plausible third segment because fusion plants produce thermal
    energy and the supply chain is already focused on heat-management constraints, but public Proxima evidence is much stronger
    for grid electricity than for industrial process heat.
