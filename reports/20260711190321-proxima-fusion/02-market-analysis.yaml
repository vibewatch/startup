- id: sizing-lenses
  title: 'Sizing lenses: big forecast numbers, narrow evidence for near-term SAM/SOM'
  body: 'The broadest published fusion sizing is striking but should be treated as a scenario, not a present TAM. Precedence
    Research projects a nuclear-fusion market of $471.99 billion in 2030 and $843.46 billion by 2040, while the FIA’s 2025
    reporting says the industry raised about $2.6 billion in the prior 12 months and approached $9.8 billion of cumulative
    investment. Those numbers show rising option value, not commercial electricity revenue. A more diligence-useful lens starts
    with demand pools that could pay for firm clean power: McKinsey expects U.S. data-center electricity demand to rise by
    roughly 400 TWh between 2024 and 2030, and BloombergNEF tracked 23.1 GW of global data-center IT capacity under construction
    as of late 2025. For Proxima, the SAM is narrower still: Europe and Germany where energy security, industrial competitiveness,
    and fusion policy align. The SOM is currently unquantified because Proxima has disclosed milestones but not plant capacity,
    contracted price, or offtake volume.'
