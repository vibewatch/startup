- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - AI data-center electricity load grows quickly
    - Driver
    - Now through 2030
    - Creates high-willingness-to-pay buyers for reliable clean power
    - Ask whether Google interest includes technical collaboration, offtake rights, or only financial exposure
  - - European energy security and industrial policy
    - Driver
    - 2026-2030 policy cycle
    - Localizes support for a German first plant and supplier ecosystem
    - Map grants, milestones, clawbacks, IP restrictions, and permitting requirements
  - - RWE / Gundremmingen site pathway
    - Driver
    - Alpha to late 2030s
    - Utility and former nuclear site could shorten market-formation path
    - Request MoU terms, grid-connection responsibilities, site constraints, and offtake framework
  - - Fusion supply-chain spending rising
    - Driver
    - 2025-2026
    - Shows suppliers are beginning to build capacity before revenue
    - Verify Proxima’s supplier commitments for HTS, vacuum, heat, and fuel-cycle systems
  - - No commercial fusion plants today
    - Constraint
    - Current
    - Market forecasts are option value, not proven sales
    - Do not underwrite TAM capture until net-energy and plant economics are demonstrated
  - - Competing clean firm technologies
    - Constraint
    - Current through 2030s
    - SMRs, geothermal, storage and firmed renewables can win demand first
    - Compare levelized cost, timing, permitting, and bankability by buyer segment
  - - Engineering and supply-chain bottlenecks
    - Constraint
    - Current
    - Power systems, heat management, vacuum vessels, pumps, fuel cycle and materials may delay plants
    - Track critical-path components against Alpha and Stellaris milestones
  - - Regulatory and IP commercialization complexity
    - Constraint
    - 2026 onward
    - Funding support may come with cooperation, exploitation, and export-control obligations
    - Review public-funding terms and whether fusion sits outside conventional nuclear law
  notes: Drivers are real but staged; constraints directly affect whether broad clean-firm-power demand converts into Proxima-specific
    revenue.
