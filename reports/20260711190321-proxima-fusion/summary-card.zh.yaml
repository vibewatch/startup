  topStrengths:
    - 科学血统几乎无可匹敌：首家 Max Planck IPP spin-out，直接站在 Wendelstein 7-X 上，并用同行评审的 Stellaris 电站概念降低物理叙事风险，相比多数聚变创业公司更扎实。
    - 欧洲资金最厚的聚变公司，已锁定 €650M+，2026 年 7 月一轮融资 €411M；Google、RWE、XTX / East X 等一线战略方同时带来资本、包销意向和数据中心需求信号。
    - 差异化 QI-stellarator 路线承诺准稳态运行，并避开 tokamak 破裂问题；HTS 磁体和 AI / ML 驱动的 3D 线圈优化构成真实技术护城河。
    - >-
      工业化路径具体：RWE 合作、Gundremmingen 商业场址、超过 50 家伙伴的 Alpha Alliance，以及分阶段路线图（Model Coil 2027 → Alpha 2030 年代初 → Stellaris
      2030 年代末）。
    - 创始团队强，治理层也在补工业化能力：CFO Sergei Galperin 和由欧洲资深产业人士组成的 Industrial Development Board，显示公司正从实验室转向工业执行。
  topRisks:
    - 基础科学风险仍是最大变量：还没有仿星器（或任何装置）演示过商业净能量增益，核心价值主张尚未验证，存在彻底失败的可能。
    - 资本强度和稀释都极端：仅 Alpha 项目就是数十亿欧元级工程，在产生任何收入前还要反复做巨额融资并依赖持续公共补贴。
    - 收入周期很长（目标 2030 年代末并网），投资逻辑会暴露在时间表滑坡、技术替代和融资市场周期之下。
    - €2.4B 的无收入估值在基本面上安全边际很薄，高度依赖期权价值和聚变赛道热度延续。
    - 全球对手资金充足：Commonwealth Fusion Systems、Helion、TAE，以及 Type One、Thea、Gauss、Renaissance 等仿星器同行，可能率先抢到进度、关键人才或包销协议。
    - 公司高度依赖创始团队、Max Planck IPP 资源，以及稀缺的仿星器工程人才。
  unresolvedGaps:
    - 财务未披露：烧钱速度、现金跑道、资金用途细节，以及 €650M+ 中股权融资与公共补助的拆分都未公开。
    - 2025 和 2026 轮的股权结构表、投资人持股比例、清算优先权、控制权 / 治理条款未披露。
    - Stellaris 概念论文之外的技术里程碑证据（Model Coil 测试结果、HTS 磁体表现）尚未公开演示。
    - 目前没有具约束力的商业包销、PPA 或电站交付合同；RWE / Gundremmingen 与数据中心需求仍是合作阶段信号。
    - QI-stellarator 净能量路径和 Alpha 时间表缺少独立、经审计的验证；时间线仍由公司给出。
    - 用作可比公司的精确同业估值标记（CFS、Helion 等）部分来自媒体报道估计，并非公司披露。
