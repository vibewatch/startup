summary:
  headline: >
    纸面上，Proxima Fusion 是欧洲最强的核聚变资产：继承 IPP / W7-X，拥有同行评审的仿星器方案、一线战略投资人和欧洲最大核聚变资金池；但公司仍无收入，净能量尚未验证，电网收入至少十多年后才可能出现，€2.4B
    估值只能按风险投资式期权纪律紧密跟踪，不能按基本面承销。
