              加入了重量级产业顾问，但已检索材料没有披露完整法定董事会、 观察员权利、投票门槛、创始人归属或继任规划。后续尽调应测试：Proxima 与 IPP 绑定的创始人，究竟仍是执行加速器， 还是集中度风险。
