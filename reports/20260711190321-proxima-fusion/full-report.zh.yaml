    sections:
      - number: '1.1'
        title: 身份、阶段与运营模式
        blocks:
          - type: paragraph
            body: >-
              Proxima Fusion 应被视为一家总部在慕尼黑、收入前的深科技基础设施公司，而不是传统能源卖方。法律实体为 Proxima Fusion GmbH，注册在慕尼黑地方法院，编号 HRB
              283423；公司材料也将 Zurich 和 Oxford 列为运营地点。公开来源把公司创立时间指向 2023 年 4 月，并独立称其为 Max Planck Institute for Plasma
              Physics 的首家拆分创业公司。它的一句话模式在年轻核聚变创业公司里异常具体：建造 QI-HTS 仿星器，先做 2027 年的 Stellarator Model Coil，再在 2030
              年代初于慕尼黑附近做 Alpha，最终在 2030 年代末做 Stellaris 电站。按通常意义，这还不是收入模式。已检索来源没有披露产品收入、ARR、付费客户数、
