  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议：跟踪资产，不要把当前估值当作基本面支撑
        blocks:
          - type: paragraph
            body: >-
              Proxima 是可信的战略资产，但公开估值结论必须对价格敏感。2026 年 7 月披露的融资给市场一个清晰头条：融资 €411 million、投后估值 €2.4 billion， Google 和 RWE
              等战略方参与。对一家成立两到三年的 Max Planck 分拆公司来说，这是有分量的背书，也支撑 Alpha、垂直整合磁体和欧洲能源安全议程的真实期权价值。 但它没有给出基本面支撑的价格。Proxima
              没有公开产品收入、ARR、EBITDA 或电力销售历史，因此常规软件或工业倍数都用错了类别。因此，基于基本面应视为偏高 / 昂贵；
              但如果投资者能拿到可接受的优先权、里程碑融资安排，以及足以扛过后续稀释的持股，这个长期期权并非非理性。IC 应跟踪或继续研究，而不是按头条估值盲买。
