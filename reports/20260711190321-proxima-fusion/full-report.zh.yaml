            body: >-
              市场时点有利，但容错很低。德国 Fusion Action Plan 承诺到 2029 年投入超过 €2B，并把德国第一座核聚变电站列为国家目标； Bavaria 另行宣布最高 €400M，投向与
              Proxima、RWE 和 IPP 相关的项目；EU/Euratom 政策也在走向 2026-2027 年核聚变商业化和公私合作框架。 这给 Proxima 在 Munich/Garching 和 Bavaria
              周边一个异常强的本地政策楔子，而公司自身也把欧洲描述成在与美国和中国赛跑。 反向观点同样重要：Clean Energy Wire 报道核聚变仍处实验阶段，商业使用至少还要数十年；CNBC 引用 Google
              称商业化极其艰难，成功没有保证。 正确的市场结论因此应分阶段。2030 年代初的 Alpha 可以扩大 SAM 可信度；2030 年代末的并网电站可以创造首个 SOM 证据；
