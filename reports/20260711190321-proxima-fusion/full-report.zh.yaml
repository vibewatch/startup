      - number: '3.2'
        title: Proxima 对比仿星器同行：QI、W7-X 传承、HTS 与 AI 线圈设计
        blocks:
          - type: paragraph
            body: >-
              直接的仿星器同行范围比完整核聚变地图窄。Type One 是最接近的美国类比，因为它也在商业化仿星器，并有一个与 TVA 相关的项目概念； Thea
              从相反方向处理同一个仿星器历史弱点，用大量模块化磁体和软件控制替代复杂 3D 线圈；Renaissance 通过 HTS 沉积和液态金属屏蔽简化线圈制造； Gauss
              则是一个面向磁约束电站交付的欧洲产业联盟。Proxima 的回答是另一组组合：准等动力等离子体物理、HTS 磁体、AI 加速的线圈和工程优化， 以及来自 Max Planck IPP 的 Wendelstein
              7-X 机构传承。Stellaris 论文强化了这个故事，因为它把卖点转成可检查的电站概念， 而不只是公司单方面宣称。风险在于，每个仿星器同行也都在试图消除同一个复杂性反对意见，所以 Proxima
              的护城河取决于执行速度和制造证明， 而不是“仿星器”这个词本身。
