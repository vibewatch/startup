        title: 监管比裂变更友好，但选址、废物、氚和 IP 义务仍是现实风险
        blocks:
          - type: paragraph
            body: >-
              监管风险有两面。好的一面是，主要司法辖区正有意搭建相称的聚变框架，而不是把聚变照搬裂变监管。英国 EN-8 草案不绑定具体技术和输出，NRC 正沿着聚变机器副产品材料路径推进，
              德国联邦政策也明确要为首座聚变电站创造有利创新的条件。这降低了陷入裂变式许可死胡同的概率。但许可并不因此轻松。Foley Hoag 指出，NRC 框架仍留下废物分类、氚报告和州联邦兼容性等实操问题；
              英国流程仍要求规划和环境评估；Proxima 自己的 MoU 也把选址、许可、监管流程、项目结构和融资列为明确工作流。法律风险还不止安全法规：Noerr 强调，IP 策略、利用计划、拨款义务和跨境限制， 都是德国
              / 欧盟公共资助聚变项目能否成功的关键。
