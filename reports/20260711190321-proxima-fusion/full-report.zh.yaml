        title: 子系统风险集中在磁体、包层、材料、燃料循环和制造
        blocks:
          - type: paragraph
            body: >
              偏反向的技术观点是，Proxima 有可信的设计论点，但在达到可投资的商业就绪度前，仍有数个未解决证明点。HTS 磁体必须在仿星器几何中被验证， 先通过 2027 年 Stellarator Model
              Coil，再走到反应堆尺度。复杂非平面线圈和支撑结构必须满足毫米级磁场公差，同时仍可制造、可检查、可维护。 中子包层和内部热管理表面必须适配仿星器的 3D
              几何，氘-氚燃料路径最终还需要氚增殖和抗中子材料，而这仍是全行业瓶颈。MIT 2025 年 REBCO 辐照结果排除了一个瞬时临界电流担忧，但明确把多年暴露下的长期退化留作后续工作。因此，风险登记表把
              Proxima 视为技术上差异化但远未去风险： 净能量尚未演示，Alpha 融资和监管仍未完成，Stellaris 还排在成功演示装置之后多年。
