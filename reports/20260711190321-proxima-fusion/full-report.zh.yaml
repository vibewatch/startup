      - number: '7.2'
        title: 技术风险不只是等离子体物理；它是一套硬件、燃料和材料的集成工程
        blocks:
          - type: paragraph
            body: >-
              最重要的技术风险在于，Proxima 必须把优化后的 QI-HTS 仿星器概念，推进成一台可运行、可维护、能实现净能量的机器。Wendelstein 7-X 和 Stellaris 提供了科学与设计可信度，
              但商业运行的约束比研究记录能验证的更严苛：14 MeV 中子通量下的长寿命结构材料、氚增殖和处理、HTS 磁体耐久性、磁场容差、第一壁维护，以及复杂部件供应。部分风险边际上已经降低： MIT
              研究人员发现，先前怀疑的 REBCO 瞬时束流开启效应在其测试中并不重要。但同一来源也说，REBCO 多年或数十年的长期退化仍在研究中；FIA 供应链报告则把燃料基础设施和第一壁材料列为重大未来隐忧。
              尽调重点应放在 Alpha 的模型线圈证据、中子 / 材料验证计划、燃料循环设计和制造良率上，而不只是看等离子体头条里程碑。
