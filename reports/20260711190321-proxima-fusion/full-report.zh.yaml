              - CV045
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 最佳公开结论：跟踪，并设置严格价格 / 条款闸门
            body: Proxima 具有战略重要性，但 €2.4B 是期权价值价格；买入前必须做私下的里程碑和优先权尽调。
            calloutType: recommendation
            claimRefs:
