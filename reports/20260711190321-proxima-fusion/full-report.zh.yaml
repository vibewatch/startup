      - number: '1.5'
        title: 反向背景与尽调路径
        blocks:
          - type: paragraph
            body: >-
              反向观点不是 Proxima 不严肃，而是投资逻辑依赖证明一些尚无私人核聚变公司在商业上证明过的事情。CNBC 指出核聚变尚未商业部署， 并引用 Google
              的保留意见：商业化极其艰难，成功没有保证。Sifted 对 A 轮的报道在净能量风险上更直接，提醒没有任何核聚变装置 已经做到产出能量超过消耗。即便纳入国家实验室点火里程碑，Proxima
              自己的计划仍需要数个未融资或部分融资步骤：SMC、Alpha、许可、 场址改造、供应链放大，以及后续电站项目融资。公司有可观公共和私人支持，但广泛股东基础和战略伙伴无法消除稀释、治理或执行风险。
              因此，本章对收入、ARR、客户数和股权结构经济性明确留空，尽调路径聚焦管理层财务、伙伴合同、董事会材料和 Alpha 技术就绪度评审。
