  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: QI-HTS 架构是技术论点，今天还不是可交付产品
        blocks:
          - type: paragraph
            body: >
              Proxima 的技术栈最适合被框定为一套一体化反应堆设计架构。公司正在开发准等动力仿星器，用外部、复杂的三维磁场而不是大等离子体电流来约束等离子体。
              这给了该架构相对托卡马克的核心优势：设计难得多，但运行概念瞄准稳态、无破裂，并降低等离子体控制负担。Proxima 加入高温超导磁体，
              以相对更老的仿星器概念缩小装置，并用仿真驱动优化搜索一个过去难以处理的巨大设计空间。最强的产品技术证据，是公司官方技术页、Stellaris 论文公告、 DOE 解释材料和 W7-X
              技术来源都指向同一个取舍：仿星器可以更容易连续运行，但线圈几何、工程集成和制造精度会变成硬问题。因此， 这是一个有吸引力但仍处商业化前的架构故事，不是经过验证的能源产品。
