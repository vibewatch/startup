        title: 这轮融资买来现金续航，但也抬高了后续资本和商业证明的门槛
        blocks:
          - type: paragraph
            body: >-
              2026 年 7 月这轮融资既是优势，也是风险标记。它给 Proxima 带来真实资源和战略背书，但也在 Alpha 尚未证明净能量、任何产品收入尚不可见之前，就把一条商业化前的硬件路线图定价到 €2.4
              billion。2026 年 2 月 MoU 称，仅 Alpha 就需要约 €2 billion；从 Alpha 走到 Gundremmingen 和并网 Stellaris，还需要更多公共、私人和项目融资资本。
              这轮融资也意味着实质稀释和后续融资压力：€411 million 约等于投后价值的 17%，且还不含后续分批。竞争压力并非纸面假设。CFS 称已累计融资接近 $3 billion，并计划在 2030 年代初借
              Dominion 和 Google 推进 ARC 并网发电；其他聚变同行也把投资者预期维持在激进水平。即便 AI 和数据中心电力需求形成支撑，购电价值仍取决于成本、可靠性、进度和并网能力。
