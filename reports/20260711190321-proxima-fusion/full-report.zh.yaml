        title: 开放优化资产围绕艰难设计瓶颈，释放出有意义的开发者信号
        blocks:
          - type: paragraph
            body: >
              Proxima 的公开开发者信号，与其核心技术风险异常相关。其 GitHub 组织列出 VMEC++、射线追踪、开放仿星器模型和 ConStellaration 相关代码库；ConStellaration
              代码库、Hugging Face 数据集、PyPI 包和 arXiv 预印本则暴露了一个用于 QI 类仿星器等离子体边界的优化基准。 该数据集按不同来源呈现被描述为超过 160,000 到 182,000
              行，并配有 ideal-MHD 平衡态和指标；相关挑战要求机器学习社区优化几何上更简单、 更易建造的 QI，以及 MHD 稳定的 QI 仿星器。这不能证明 Proxima
              能制造线圈或实现净能量，但验证了设计工作流周围确有真实从业者界面。 因此，今天的客户工作流是内部且面向生态的：定义目标等离子体边界，评估物理和工程指标，简化与线圈相关的几何，并把有前景的设计送入更高保真工程。
              公开开源活动降低了黑箱风险，同时也确认设计问题仍然高维且计算昂贵。
