  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 没有产品收入：售电前的模式是里程碑融资
        blocks:
          - type: paragraph
            body: >
              Proxima 应按收入前深科技承保，而不是按 SaaS、市场平台或经常性基础设施业务承保。公司公开材料描述的是一条从工程工作走向 Alpha 的路径：Alpha 是计划在 2030
              年代初落在慕尼黑附近的净能量仿星器演示装置，之后再走向 Stellaris，也就是十年后期的首座商业仿星器电站；
              这些材料没有描述当前产品收入、ARR、已实现售电、毛利率或客户合同。从公开证据看，近期唯一可见的经济“单元”是里程碑完成： Stellarator Model Coil、HTS 线缆和磁体生产、Alpha
              场址/建设，以及产业伙伴就绪度。RWE 和 Google 在战略上重要， 但 RWE 2026 年 7
              月披露的是投资和场址/产业化关系，而不是收入合同。因此，今天无法给收入质量打分。尽调路径应在给予商业收入信用前， 拆分公共补助、股权融资、伙伴实物支持，以及任何未来购电或项目融资承诺。
