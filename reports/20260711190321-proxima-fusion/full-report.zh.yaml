        title: Stellaris 和 Alpha 把 W7-X 传承转成分阶段证明计划
        blocks:
          - type: paragraph
            body: >
              Stellaris 给 Proxima 提供了一个比多数早期核聚变创业公司更具体的技术产物：一个经同行评审的一体化电站概念，把 QI 等离子体设计、 HTS
              磁体、支撑结构、热管理和中子学放进同一个连贯的设计主张。该概念仍是纸面设计，但其覆盖面重要，因为它迫使等离子体物理和工程约束进入同一优化回路。 Alpha 是下一步验证，计划建在 Garching 的 IPP
              附近，被描述为净能量演示装置，而不是商业电站。路线图随后指向 Alpha 之后在前 Gundremmingen 裂变核电站址建设 Stellaris，RWE 和 Bavaria
              参与场址、融资和产业化工作。Wendelstein 7-X 是科学传承： IPP 的装置已经证明优化仿星器的相关性，创下长脉冲纪录，并在 2026 年发表经同行评审的托卡马克级三重积性能。尽调问题在于， W7-X
              验证的是物理案例的一部分，不是 Proxima 完整反应堆系统；Alpha 也尚未运行。
