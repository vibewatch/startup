companyProfile:
  summary: |
    Proxima Fusion GmbH 是一家总部位于慕尼黑的商业核聚变能源公司，也是 Max Planck
    Institute for Plasma Physics (IPP) 历史上第一家拆分创业公司。它正在开发基于准等动力
    （QI）仿星器的电站——这种磁约束设计以准稳态运行，避开困扰托卡马克的破裂问题，
    但代价是极其复杂的 3D 磁体几何。Proxima 用高温超导（HTS）磁体、计算优化和
    AI/ML 辅助设计来攻克这件事。公司直接承接 Wendelstein 7-X 实验，并发表了
    Stellaris；该方案被描述为首个经同行评审的商业仿星器电站概念。路线图从
    Stellarator Model Coil（2027 年）走向慕尼黑附近的 Alpha 净能量演示装置
    （2030 年代初），再到巴伐利亚前 Gundremmingen 核电站址的商业 Stellaris 电站，
    目标是在 2030 年代末接入德国电网。2026 年 7 月，公司以 €2.4B ($2.7B) 投后估值
    完成 €411M ($468M) 融资，由 XTX Ventures 和 East X Ventures 领投，Google 与
    RWE 作为战略投资方参投，使其成为欧洲融资最充足的核聚变公司。
