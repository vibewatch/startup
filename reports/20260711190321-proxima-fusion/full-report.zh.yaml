        title: “客户”基础是未来购电方和使能伙伴，而不是当前买家
        blocks:
          - type: paragraph
            body: >-
              Proxima 仍处收入前阶段，所以正确的尽调框架不是装机客户质量或账户扩张，而是可信未来买方和使能方是否正在围绕首座电站组织起来。 最强公开证明是
              RWE：它是战略投资方，是具备电站建设和运营能力的公用事业公司，也是 Proxima 计划建设商业 Stellaris 电站的前 Gundremmingen 核电站址所有者。与巴伐利亚自由州、RWE 和 Max
              Planck IPP 的 MoU 定义了一条路径： 先在 Garching 附近做 Alpha，如果技术跑通，再走向 Gundremmingen 并网仿星器。这比标志墙更接近场址/购电市场验证，
              但仍不等于经常性收入、具约束力的 PPA 或已交付的兆瓦时。因此，买方/用户/付款方角色被拆开：RWE 是场址和公用事业伙伴， 公共部门资金方是基础设施赞助者，IPP
