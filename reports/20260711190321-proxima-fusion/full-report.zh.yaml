subtitle: 欧洲融资最充足的核聚变冠军 — 收入前 €2.4B 估值上的高信念登月赌注
coverageNotes: |
  Proxima Fusion 是一家私营、收入前的深科技公司，2023 年从 Max Planck
  Institute for Plasma Physics (IPP) 拆分出来。公开证据有力支撑其科学传承
  （Wendelstein 7-X）、准等动力（QI）仿星器路线、经同行评审的 Stellaris
  电站概念，以及资本形成——2025 年 6 月 €130M A 轮，2026 年 7 月以
  €2.4B ($2.7B) 投后估值完成 €411M ($468M) 融资，使已锁定资本超过 €650M。
  公司没有披露产品收入、ARR、利润率或具约束力的商业购电协议，因为这些尚不存在：
  公司仍是一个十年以上的科学与工程项目，目标是在 2030 年代初于慕尼黑附近建成
  净能量演示装置（“Alpha”），并在 2030 年代末让商业电站（“Stellaris”，与
  RWE 位于前 Gundremmingen 核电站址）接入德国电网。本报告所有估值观点都基于
  期权价值和情景，而非盈利，应视为方向性判断。
