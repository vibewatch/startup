  - id: TP001
    title: 竞品画像表
    columns:
      - 公司
      - 路线 / 类别
      - 披露融资或估值信号
      - 目标细分 / 里程碑
      - 差异化
      - 局限
    rows:
      - - Proxima Fusion
        - QI 仿星器 / 直接同业
        - 含补助在内合计 €650M+；2026 年 7 月投后估值 €2.4B
        - 2030 年代初，慕尼黑附近的 Alpha 净能量仿星器
        - QI-HTS 设计、W7-X 传承、AI 线圈优化、Stellaris 电站概念
        - 比美国头部玩家更年轻、资金更少；模型线圈和制造验证仍待完成
      - - Commonwealth Fusion Systems
        - HTS 托卡马克 / 既有领先者
        - 按 TechCrunch 列表，已融资接近 $3B
        - SPARC 净能量装置，2030 年代初 ARC 并网电站
        - 资金最充足的私营聚变玩家，路线图是紧凑型 HTS 托卡马克
        - 托卡马克破裂、材料、氚和建设风险仍在
      - - TAE Technologies
        - 场反位形 / 长期在场的既有玩家
        - 按 TechCrunch/PitchBook，计划合并前已融资约 $1.79B
        - 将先进束流 FRC 平台商业化
        - 运营历史深，另有替代燃料循环叙事
        - 时间线漫长，复杂公司交易也削弱可比性
      - - Helion Energy
        - FRC / 直接发电 / 超大规模客户支持的对手
        - 2026 年一轮 $465M；估值 $15.5B；累计融资 $1.5B
        - Orion 电站和 Microsoft 客户时间表
        - 直接电能转换，以及 Sam Altman/OpenAI 邻近性
        - 激进的 2028 目标抬高交付风险
      - - Tokamak Energy
        - 球形托卡马克 / HTS 磁体同业
        - 按 TechCrunch/PitchBook，累计融资 $336M
        - ST40 和 HTS 磁体商业化
        - 紧凑型托卡马克叠加磁体技术收入选项
        - 资金基础小于 CFS，与仿星器的直接相关性也更弱
      - - General Fusion
        - 磁化靶聚变
        - 按 TechCrunch，已融资超过 $600M
        - LM26 示范装置和首创电站路线图
        - 液态金属压缩架构和长期运营历史
        - 混合机械系统带来独特工程复杂度
      - - Zap Energy
        - 剪切流 Z 箍缩 / 相邻路线
        - 按 TechCrunch/PitchBook，已融资 $327M
        - 聚变试点电站预概念里程碑
        - 用紧凑 Z 箍缩路线绕开 HTS 磁体和激光
        - 仍必须证明电站级等离子体性能稳定且可重复
      - - First Light Fusion
        - 惯性 / 弹丸与 FLARE 架构
        - 按 TechCrunch/PitchBook，已融资 $108M
        - 可扩展惯性架构，以及相邻极端条件能力
        - 峰值功率较低的惯性概念
        - 商业路径已重新聚焦，且无法与磁约束路线直接比较
      - - Type One Energy
        - 仿星器 / 直接同业
        - 按 TechCrunch，含 Series B 前股权在内已融资 $269M
        - 2030 年代中期，与 TVA 相关的 350 MW 电站概念
        - 美国仿星器路线，采用公用事业主导建设 / 持有 / 运营模式
        - 2026 年 7 月后资本少于 Proxima，且仍处于商业化前
      - - Thea Energy
        - 仿星器 / 直接同业
        - 按 TechCrunch，2026 年完成 $100M Series B 轮
        - 软件控制的模块化磁体仿星器
        - 用可量产磁体阵列化解线圈复杂度
        - 必须证明软件控制磁场质量和反应堆集成
      - - Marvel Fusion
        - 激光惯性 / 德国同业
        - '> $400M 公司披露的公共和私人资金；按 TechCrunch，私人融资 $162M'
        - 激光靶电站技术和 Fort Collins 基础设施
        - 硅靶和快点火激光策略
        - 资金口径不一，惯性路线经济性仍未证明
      - - Focused Energy
        - 激光惯性 / 德美同业
        - 按 TechCrunch，Series A 轮 $240M，另有补助
        - Biblis 首台激光，2030 年代试点电站路径
        - NIF 点火传承和 RWE 场址准入
        - 需要高重复率靶制造和激光经济性跑通
      - - Gauss Fusion
        - 欧洲磁约束联盟 / 仿星器相邻
        - 公司提到 BMBF 支持的 €10M 氚增殖资金
        - 面向欧洲聚变电站的产业联盟
        - 联盟可触达德国、法国、意大利、西班牙的产业伙伴
        - 私人融资和具体装置里程碑披露较少
      - - Renaissance Fusion
        - 仿星器 / 欧洲直接同业
        - 保留来源对融资披露不一致
        - HTS 线圈沉积、液态金属屏蔽、面向电网的仿星器
        - 用直接沉积 HTS 线圈简化仿星器工程
        - 资本规模和试点时间的公开证据比 Proxima 更薄
      - - Xcimer
        - 激光惯性 / 美国同业
        - 按 TechCrunch 列表语境为 >$100M 级别；官方路线图强调 Phoenix
        - 10-MJ 级激光聚变路线图
        - 大型准分子激光架构，连接已验证的 NIF 物理
        - 资本和重复率经济性仍不确定
      - - Pacific Fusion
        - 脉冲磁惯性 / 美国同业
        - 按 TechCrunch，Series A 轮超过 $1B，按里程碑支付
        - 使用同步 Marx 发生器的脉冲功率惯性系统
        - 大规模分阶段资本承诺和 Eric Lander 领衔团队
        - 按里程碑分档的融资，以及极端脉冲功率时序风险
    notes: 融资数值是截至 2026 年运行日期的公开来源快照；披露口径不同，有的给累计融资，有的给单轮规模， 有的给估值。
