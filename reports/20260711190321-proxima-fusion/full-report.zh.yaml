  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：清洁稳定电力，而不是泛能源转型支出
        blocks:
          - type: paragraph
            body: >-
              Proxima 的市场规模应对标清洁、稳定、可调度电力和高温能源选项，而不是所有可再生能源、所有核能或全部气候科技资本。 纳入范围包括未来核聚变发电、电站开发、电网互联、HTS
              磁体和热管理系统等使能组件，以及公用事业或大型企业负荷买家的战略购电。 相邻但不能完全替代的市场包括小型模块化裂变反应堆、增强型地热、长时储能、配碳捕集的天然气、氢能，以及传统可再生能源 PPA。
              这个边界重要，因为 Proxima 仍无收入，也因为今天没有商业核聚变电站。当前市场信号因此不是销售转化，而是政府、公用事业、 超大规模云厂商和供应商愿不愿意为可能在 2030
              年代变成售电的里程碑出钱。Proxima 获 RWE 和 Google 参与支撑这一边界： 二者都是电力需求相关角色，但都不能证明核聚变已进入可银行融资的发电市场。
