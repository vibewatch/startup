      - number: '8.4'
        title: 尽调：在支付头条价格前，要求证明里程碑、条款结构和资本计划
        blocks:
          - type: paragraph
            body: >-
              负面情形不是聚变没有价值，而是投资者可能在决定性里程碑出现前就被要求为成功买单。TechCrunch 关于聚变融资热潮裂缝的报道、MIT Technology Review 对成本的提醒， 以及 Bulletin
              对商业聚变炒作的怀疑，都指向同一个承销问题：时间线会滑、经济性会不及预期，公开市场也可能过早奖励叙事。Proxima 自己的备案和新闻稿证据确认了实体与头条融资，
              但没有确认优先权堆栈、持股拆分、拨款条件、Alpha 资本开支、项目融资计划，或并网后的客户经济性。因此，最低尽调包应包括：到 Alpha 的里程碑预算、磁体生产成本曲线、 已签署的合作伙伴 /
              购电条款、公共拨款附带条件，以及股权结构瀑布。没有这些，估值仍是昂贵期权，不是已降险的投资。最终 IC 模型还应同时展示企业价值，
              以及至少两轮后续融资后的预期持股。如果所需资本堆栈迫使投资者不断续投、只为维持持股，那么入场时看似可接受的头条估值，即便技术进展真实，也会变得缺乏吸引力。
              这也是为什么估值决策应在每个已融资技术里程碑之后重新审视，而不是被当作静态估值。
            claimRefs:
              - CV006
              - CV008
              - CV009
              - CV012
              - CV035
              - CV036
              - CV037
              - CV038
              - CV040
              - CV041
              - CV045
