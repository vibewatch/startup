              最强的财务证据，是 Proxima 能够快速组织一个泛欧洲且带战略属性的融资辛迪加。公开来源相互印证了 2025 年 6 月 €130M A 轮、2025 年 9 月 €15M 延伸轮使披露融资达到
              €200M，以及 2026 年 7 月以 €2.4B 估值完成 €411M 融资。 2026 年 7 月轮由 XTX Ventures 和 East X Ventures 领投，RWE 和 Google
              为战略投资方；公共和准公共支持者包括 KfW Capital、SPRIND、DTCF、Bayern Kapital、HTGF、CDP Venture Capital 和 EIC
              Fund。这是优势，因为核聚变公司在多个阶段都需要口袋够深的支持者； 但这也带来股权结构和治理问题。Northdata 和在线注册页将 Proxima Fusion GmbH 标识为 Munich HRB
              283423，Northdata 列出 37 名已知活跃股东。公司可以可信地声称欧洲融资领先，但投资人尽调仍需要清算优先权、按比例跟投权、公共资金约束，以及战略投资者围绕 Alpha 或未来电站的任何权利。
