            body: >-
              主要客户风险不是客户流失；它没有可流失的收入基础。风险在于，今天的“客户”是有条件的利益相关方，其经济性只有在重大科学、工程、许可、 融资和电网集成里程碑之后才会兑现。公开来源没有披露 Proxima
              PPA、费率、合同容量、商业价格、客户数指标、NRR、GRR、合同期限或头部客户集中度。 Neutron Bytes 明确质疑 Proxima 的公关说法止于何处、硬事实始于何处；Energy Solutions
              2026 年核聚变综述强调，氚、材料、监管和成本障碍， 使 2030 年代中期前出现有意义的并网供应不太可能。这种怀疑对客户尽调很重要：RWE 和 Bavaria 降低了选址和机构风险，但不能消除技术交付风险，
