              发布稿称，各方将就许可、项目结构、融资和建设角色合作。这是相当实质的未来客户证明，因为它把首座电站锚定在真实公用事业场址。 相比之下，Google 目前是投资者和市场需求信号，不是已披露的 Proxima
              电力买家。可比案例显示未来模式可能是什么样：Google-CFS 宣布了 ARC 的 200 MW PPA，Helion-Microsoft 宣布了首个核聚变 PPA，目标至少 50
