      - number: '7.5'
        title: 缓释因素可信，但承销必须用里程碑设闸，而且不能心软
        blocks:
          - type: paragraph
            body: >-
              正确的投资控制，不是因为聚变很难就排除 Proxima；而是要求每个主要缓释因素都转化为可量化的降险。Max Planck IPP 领导力应产出透明的 Alpha 物理里程碑。RWE 在
              Gundremmingen 的角色应拿出具体的选址、并网、许可和项目交付证据。新融资应转化为模型线圈进展、HTS 产能、供应商承诺，以及不依赖模糊未来巨额融资的分阶段预算。
              监管上，应尽早拿到主管机构对氚、废物、环境评估和公众沟通的反馈。如果这些里程碑延误，下行情形会非线性放大：Alpha 迟到或超预算，会削弱净能量论点、加重稀释、暴露政策依赖，
              并让资金更足的竞争对手定义市场。因此，风险登记支持高风险、继续研究的立场；除非资料室证据能证明进度、预算、技术和监管推进已经超出公开公告。
