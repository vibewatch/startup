              估值模型应以场景为核心，而不是以倍数为核心。熊市价值主要来自 IP、团队、拨款关系，以及 Alpha 延误或磁体制造无法放量时剩余的战略可选性。基准价值接近当前估值： 承认战略投资者已经验证
              Proxima，同时折价处理缺乏收入、运营指标、股权结构细节和已验证净能量硬件。牛市价值可能大得多，但前提是 Alpha 和公用事业承诺让 Proxima 看起来更像 Helion/CFS
