      - number: '2.3'
        title: 需求细分与买方路径：公用事业先行，超大规模云厂商作为战略加速器
        blocks:
          - type: paragraph
            body: >-
              可能的买方路径由电力系统角色牵头，而不是单个工业场址。电气化和天气依赖型可再生能源提高系统平衡要求后，公用事业和电网运营商需要可靠、 低碳容量；RWE 的投资和 Gundremmingen 合作，是
              Proxima 最清晰的公用事业信号。超大规模云厂商是第二条需求向量。 Google 自身可持续发展材料称，其 AI 基础设施建设快过电网脱碳，2025 年签署了超过 12 GW
              清洁能源协议，并在扩大核能和增强型地热的同时， 对核聚变做长期押注。数据中心买家看重 24/7 无碳能源、接电速度和可信的长周期供应，但在核聚变到来前，也可以选择裂变、地热、
              储能支撑的可再生能源或电网合同。工业热是可信的第三个细分，因为核聚变电站产生热能，供应链已聚焦热管理约束；但 Proxima 的公开证据对电网电力的支撑远强于工业过程热。
