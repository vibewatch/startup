            body: >
              2026 年 7 月资产负债表应能买来时间，但不能消除融资依赖。Proxima 称新资本将支持 Alpha、模型线圈完成、HTS 线缆和磁体生产、招聘， 以及制造系统开发。围绕 Bavaria 相关 Alpha
              计划的独立报道，指向一个约 €2B 的仿星器测试设施项目；Bavaria 和 Proxima 各承担 20%， 仍需要预期 €1.2B
              联邦资金。即便这些报道只是方向性而非已签融资文件，它也框定了规模问题：€411M 是大额风险资本，但 Alpha 是项目融资级别的工程。
              公开来源没有披露账面现金、月度现金消耗、已承诺资本开支、营运资本、采购定金、债务或公共补助的确切拨付计划。一个简单敏感性说明了为何这重要： 如果月度现金消耗为 €10M，€411M 约等于 41
              个月资金跑道；如果为 €20M，约 21 个月；如果为 €30M，约 14 个月。 这些情形都不是公司指引，但它们说明资金跑道必须拿里程碑预算和公共资金时点来尽调验证。
