      - number: '2.2'
        title: 规模测算视角：预测数很大，但近期 SAM/SOM 证据窄
        blocks:
          - type: paragraph
            body: >-
              最宽口径的已发布核聚变市场规模很醒目，但应视为情景，而不是当前 TAM。Precedence Research 预测核聚变市场 2030 年为 $471.99B，2040 年达 $843.46B；FIA 2025
              年报告称行业过去 12 个月融资约 $2.6B，累计投资接近 $9.8B。 这些数字显示的是上升的期权价值，不是商业电力收入。更适合尽调的视角，应从可能为清洁稳定电力付费的需求池出发： McKinsey 预计
              2024 至 2030 年美国数据中心用电需求将增加约 400 TWh，BloombergNEF 追踪到截至 2025 年末全球在建数据中心 IT 容量为 23.1 GW。对 Proxima 来说，SAM
              还要更窄：欧洲和德国，能源安全、产业竞争力和核聚变政策在这里同向。 SOM 目前无法量化，因为 Proxima 披露了里程碑，但没有披露电站容量、合同价格或购电量。
            claimRefs:
              - CM008
