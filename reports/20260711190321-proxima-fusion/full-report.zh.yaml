              Kubie，这个创始团队直接连着 Max Planck IPP、MIT 和 Google X 式技术背景。Sciortino 在融资、Stellaris 和 IPP 合作材料中仍是核心公开发言人和 CEO；
              Milanese 也在公司法律声明中担任董事总经理；Lion 是 Stellaris 上可见的首席科学家声音。因此，2026 年 6 月 Sergei Galperin 加入担任 CFO
