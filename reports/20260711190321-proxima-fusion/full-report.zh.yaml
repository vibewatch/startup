      - number: '4.4'
        title: 同行融资验证了品类，同时凸显稀释和补贴风险
        blocks:
          - type: paragraph
            body: >
              Proxima 现在是欧洲融资最充足的核聚变公司之一，但同行背景提醒，不应把这一轮融资过度解读为财务去风险证明。Commonwealth Fusion Systems 已融资接近 $3B，Helion 称已融资约
              $1.5B，TechCrunch 2026 年调查列出多家融资数亿美元或更多的私人核聚变公司。这个比较有双向含义。 一方面，它支持严肃核聚变项目需要传统风险轮次可能无法单独覆盖的资本规模；另一方面，它也说明
              Proxima 超过 €650M 的总资本，相对于美国领跑者仍属早期。 反向财务证据很重要：MIT Technology Review 警告核聚变可能不会很快变便宜，且尚无核聚变电站存在；Bulletin of
              the Atomic Scientists 强调商业核聚变一再比预期更慢，经济性核聚变没有保证。公开结论因此是平衡的。Proxima 融资动能强，公私战略支持异常有力；但十年以上收入路径、
              没有产品收入、重资本开支、可能稀释和补贴依赖，仍是核心财务风险。
