  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 顶层风险集中在技术证明、资本强度和进度现实性
        blocks:
          - type: paragraph
            body: >-
              Proxima Fusion 的风险更适合看成层层叠加的里程碑问题，而不是单一科学风险。作为一家年轻深科技公司，它有少见的优势：2026 年 7 月完成 €411 million 融资，投后估值 €2.4
              billion，继承 Max Planck IPP 技术，RWE 参与选址和运营，德国政策环境也希望落地首座聚变电站。这些事实让它相对多数欧洲聚变同行， 融资和可信度风险更低，但核心问题还没解除：Alpha
              仍要在 2030 年代初证明仿星器的净能量，同时公司还要扩 HTS 磁体制造、氚与材料方案、许可审批、公私资金和未来购电经济性。 独立负面来源仍把剩余风险压在高位：GAO
              称商业聚变仍面临燃烧等离子体、材料、系统工程和监管挑战；MIT Technology Review 质疑聚变成本能否快速下降；Bulletin 则认为商业化炒作一次次跑在有用功率证明前面。
