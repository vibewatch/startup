        - 不计后续稀释，5x-10x 毛回报大约需要 €12B-€24B 退出
        - 显示入场价格要求龙头级结果
    notes: 方法比较刻意排除传统倍数，依赖期权、里程碑和风险投资回报逻辑。
    claimRefs:
      - CV025
      - CV033
      - CV042
      - CV043
      - CV044
  - id: TV008
    title: 最终尽调问题和否决触发器表
    columns:
      - 主题
      - 缺失证据 / 触发器
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 股权结构和优先权
        - 完整投后持股、清算优先权堆栈、按比例跟投权、反稀释条款和一级 / 二级交易组合
        - 头条投后估值可能夸大普通股吸引力
        - 法律顾问和公司财务数据室
      - - Alpha 预算和进度
        - 里程碑预算、技术成熟度等级、独立评审和应急计划
        - Alpha 滑坡是悲观情景核心触发器
        - 技术尽调，配合 IPP/RWE 里程碑复核
      - - 磁体制造
        - HTS 线缆和磁体良率、成本曲线、供应商约束和垂直整合资本开支
        - 制造失败会在收入出现前摧毁期权价值
        - 工程尽调和供应商访谈
      - - 战略承诺
        - RWE 场址 / 购电经济性、Google 需求逻辑、公共补助条件
        - 战略标识不等于可融资的项目融资
        - 合作伙伴尽调和补助文件审查
      - - 下一轮融资
        - 下一笔数十亿欧元融资的金额、时间、投资团深度和下行情景计划
        - 即使公司活下来，未来稀释也可能抹掉回报
        - 董事会 / 投资者访谈和融资模型
      - - 电力经济性
        - 预期 capex/MW、LCOE 区间、可用率、维护以及氚 / 燃料假设
        - 成本质疑压住终值
        - 独立电力市场和核工程审查
    notes: 最终问题是把战略质量判断转成定价投资决定的最低要求。
    claimRefs:
      - CV034
      - CV036
      - CV038
      - CV040
      - CV041
      - CV045
