      - 时间
      - 含义
      - 尽调问题
    rows:
      - - AI 数据中心用电负荷快速增长
        - 驱动因素
        - 现在至 2030 年
        - 为可靠清洁电力创造支付意愿高的买方
        - 询问 Google 的兴趣是否包括技术协作、承购权，还是只有财务敞口
      - - 欧洲能源安全和产业政策
        - 驱动因素
        - 2026-2030 政策周期
        - 支持德国首座电站和供应商生态在本地落地
        - 梳理补助、里程碑、追回条款、IP 限制和许可要求
      - - RWE / Gundremmingen 场址路径
        - 驱动因素
        - Alpha 至 2030 年代末
        - 公用事业伙伴和原核电场址可能缩短市场形成路径
        - 索取 MoU 条款、并网责任、场址约束和承购框架
      - - 聚变供应链支出上升
        - 驱动因素
        - 2025-2026
        - 说明供应商已经在收入到来前开始建设产能
        - 核实 Proxima 在 HTS、真空、热管理和燃料循环系统上的供应商承诺
      - - 目前没有商用聚变电站
        - 约束
        - 当前
        - 市场预测体现的是期权价值，不是已验证销售
        - 在净能量和电站经济性得到证明前，不要把 TAM 获取写入投资假设
      - - 竞争性稳定清洁技术
        - 约束
        - 当前至 2030 年代
        - SMR、地热、储能和配套稳定化的可再生能源可能先拿下需求
        - 按买方细分比较平准化成本、时间、许可和可融资性
      - - 工程和供应链瓶颈
        - 约束
        - 当前
        - 电力系统、热管理、真空室、泵、燃料循环和材料都可能拖慢电站
        - 对照 Alpha 和 Stellaris 里程碑跟踪关键路径部件
      - - 监管和 IP 商业化复杂度
        - 约束
        - 2026 年起
        - 资金支持可能附带合作、开发利用和出口管制义务
        - 审查公共资助条款，以及聚变是否不受传统核能法律约束
    notes: 驱动因素真实存在，但会分阶段释放；约束会直接决定广义稳定清洁电力需求能否转成 Proxima 的收入。
