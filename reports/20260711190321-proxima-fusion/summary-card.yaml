  topStrengths:
    - >-
      Unmatched scientific pedigree: first Max Planck IPP spin-out, building directly on Wendelstein 7-X, with a
      peer-reviewed Stellaris power-plant concept that de-risks the physics narrative versus most fusion startups
    - >-
      Best-funded fusion company in Europe with €650M+ secured, a €411M July 2026 round, and blue-chip strategic backers
      (Google, RWE, XTX/East X) that provide capital, offtake intent, and data-center demand signal
    - >-
      Differentiated QI-stellarator approach that promises quasi-steady-state operation and avoids tokamak disruptions,
      with HTS magnets and AI/ML-driven 3D coil optimization as a genuine technical moat
    - >-
      Concrete industrialization path: RWE cooperation, the Gundremmingen commercial site, a >50-partner Alpha Alliance,
      and a staged roadmap (Model Coil 2027 → Alpha early 2030s → Stellaris late 2030s)
    - >-
      Strong founding team and governance additions (CFO Sergei Galperin, an Industrial Development Board of senior
      European industry figures) signaling a shift from lab to industrial execution
  topRisks:
    - >-
      Fundamental scientific risk: no stellarator (or any device) has yet demonstrated commercial net energy gain, so
      the core value proposition is unproven and could fail outright
    - >-
      Extreme capital intensity and dilution: the Alpha program alone is a multi-billion-euro undertaking, requiring
      repeated mega-rounds and continued public subsidy before any revenue
    - >-
      Very long time-to-revenue (grid connection targeted late 2030s) exposes the thesis to timeline slippage,
      technology substitution, and financing-market cycles
    - >-
      €2.4B pre-revenue valuation leaves little margin of safety on fundamentals and depends heavily on option value and
      continued fusion-sector enthusiasm
    - >-
      Well-funded global competition (Commonwealth Fusion Systems, Helion, TAE, plus stellarator peers like Type One,
      Thea, Gauss and Renaissance) could win the race, key talent, or offtake first
    - >-
      Key-person and institutional dependence on the founding team, Max Planck IPP access, and stellarator-specific
      engineering talent
  unresolvedGaps:
    - >-
      No disclosed financials: burn rate, runway, detailed use-of-proceeds, and the split of the €650M+ between equity
      and public grants are not public
    - >-
      Cap table, investor ownership percentages, liquidation preferences, and control/governance terms for the 2025 and
      2026 rounds are undisclosed
    - >-
      Technical milestone evidence beyond the Stellaris concept paper (Model Coil test results, HTS magnet performance)
      is not yet publicly demonstrated
    - >-
      No binding commercial off-take, PPA, or plant-delivery contract exists; RWE/Gundremmingen and data-center demand
      remain cooperation-stage signals
    - >-
      Independent, audited validation of the QI-stellarator net-energy path and Alpha timeline is not available;
      timelines are company-stated
    - >-
      Precise peer valuation marks (CFS, Helion, etc.) used for comparables are partly estimated from press coverage
      rather than disclosed
