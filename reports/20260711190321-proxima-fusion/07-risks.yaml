- id: financial-competitive-and-market-risk
  title: The financing event buys runway, but it also raises the bar for follow-on capital and commercial proof
  body: 'The July 2026 round is both a strength and a risk marker. It gives Proxima real resources and strategic validation,
    yet it prices a pre-commercial hardware roadmap at €2.4 billion before Alpha has demonstrated net energy or any product
    revenue is visible. The February 2026 MoU says Alpha alone requires about €2 billion, and the full path to Gundremmingen
    and grid-connected Stellaris will require additional public, private, and project-finance capital. The round also implies
    material dilution and future financing pressure: €411 million is roughly 17% of post-money value before later tranches.
    Competitive pressure is not theoretical. CFS says it has raised close to $3 billion and is pursuing ARC grid power in
    the early 2030s with Dominion and Google; other fusion peers keep investor expectations aggressive. Even if power demand
    from AI and data centers is supportive, offtake value depends on cost, reliability, schedule, and grid integration.'
