- id: TR006
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Alpha net-energy risk
    - Physics and integrated-power milestone reviews
    - Alpha slips more than 24 months or power-balance evidence remains unaudited
    - Pause premium valuation credit and reprice as research option
  - - HTS / coil manufacturing risk
    - Model coil test and production yield
    - Model coil fails target field/tolerance or yield remains uneconomic
    - Require technical reserve, syndicate support, or valuation haircut
  - - Tritium / materials risk
    - Fuel-cycle and first-wall roadmap
    - No credible tritium breeding, inventory, waste, or replacement plan by next major round
    - Treat commercial-plant timeline as speculative
  - - Capital intensity / dilution
    - Budget, runway, and financing plan
    - Next tranche needed before technical milestone or at punitive terms
    - Model severe dilution and downside preference stack
  - - Regulatory / siting risk
    - Authority feedback and public process
    - German/Bavarian permitting path unresolved after site-specific pre-application work
    - Delay Stellaris value credit and require legal condition precedent
  - - Competitive timing risk
    - Peer milestone comparison
    - CFS/Helion secures grid/offtake proof while Alpha remains pre-net-energy
    - Cut strategic scarcity premium
  - - Market/offtake risk
    - PPA and LCOE evidence
    - No credible buyer economics at first-plant cost levels
    - Do not underwrite utility-scale revenue until economics are independently validated
  notes: Kill criteria are intentionally milestone-based because the company is pre-revenue and valuation is dominated by
    technical and financing option value.
