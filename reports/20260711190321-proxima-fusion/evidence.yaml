evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-and-customers
    missingEvidence: >-
      Audited revenue, ARR, grant revenue recognition, paid pilot contracts, customer count, and any binding offtake
      agreements.
    whyItMatters: >-
      The public story is pre-revenue and partner-led; valuation underwriting needs evidence of future contracted
      economics rather than roadmap intent.
    diligencePath: >-
      Request FY2024-FY2026 management accounts, grant schedules, signed customer/offtake contracts, LOIs, and a
      revenue-recognition memo.
    relatedQuestionRefs:
      - QO011
      - QO026
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-governance
    missingEvidence: >-
      Full cap table, primary-versus-secondary allocation, liquidation preferences, board/observer rights, founder
      vesting, debt facilities, and side letters.
    whyItMatters: >-
      A €2.4B post-money valuation with many investors can hide preference, control, and dilution economics that
      materially affect entry terms.
    diligencePath: >-
      Review closing binders for the 2025 and 2026 rounds, shareholder register, board consents, investor rights
      agreements, debt documents, and side letters.
    relatedQuestionRefs:
      - QO024
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: alpha-readiness
    missingEvidence: >-
      SMC test plan, Alpha engineering design review, HTS supply-chain qualification, cost-to-complete, licensing path,
      and independent technical readiness review.
    whyItMatters: >-
      The company’s near-term value inflection depends on hardware milestones that are not yet achieved and require
      significant follow-on execution.
    diligencePath: >-
      Run a technical diligence session with Proxima, IPP advisers, magnet suppliers, and an independent fusion
      engineer; request milestone evidence and burn-down charts.
    relatedQuestionRefs:
      - QO017
      - QO019
      - QO020
  - type: missing-source
    severity: minor
    topic: leadership-disclosure
    missingEvidence: A complete current management team, statutory board roster, observer list, and functional ownership map.
    whyItMatters: >-
      Founder-market fit is a strength, but concentration risk cannot be assessed without succession, delegation, and
      governance detail.
    diligencePath: >-
      Ask management for an org chart, board deck cover pages, committee charters, founder employment terms, and
      key-person insurance or retention arrangements.
    relatedQuestionRefs:
      - QO004
      - QO005
      - QO024
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-map
    missingEvidence: >-
      Exhaustive list of all 2026 investors, grantors, board observers, strategic partners, and contractual
      counterparties.
    whyItMatters: The public stakeholder list is sufficient for overview but not for legal, control, or concentration underwriting.
    diligencePath: Reconcile company cap table, grant agreements, partner contracts, and board minutes against public investor lists.
    relatedQuestionRefs:
      - QO021
      - QO025
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: minor
    topic: founding-date
    missingEvidence: Exact incorporation date and founding-date convention used by management.
    whyItMatters: >-
      Public sources mix April 2023 and beginning-of-2023 language; the difference is not investment-material but should
      be standardized for the report.
    diligencePath: Pull official Handelsregister extract or request incorporation documents from management.
    relatedQuestionRefs:
      - QO002
  - type: private-evidence-only
    severity: material
    topic: sam-som
    missingEvidence: >-
      Management-backed TAM/SAM/SOM segmentation by buyer type, geography, plant count, capacity, price, and expected
      offtake volume.
    whyItMatters: >-
      Published fusion forecasts are broad scenarios and cannot show what Proxima can actually capture in Europe or
      Germany.
    diligencePath: >-
      Request market model, target plant capacity, offtake assumptions, pricing bands, RWE/Gundremmingen terms, and
      sensitivity cases.
    relatedQuestionRefs:
      - QM022
      - QM023
  - type: private-evidence-only
    severity: material
    topic: offtake
    missingEvidence: Binding or option-style offtake rights from RWE, Google, or other clean-firm-power buyers.
    whyItMatters: Strategic investments indicate interest but not necessarily future revenue, PPA price, or buyer commitment.
    diligencePath: >-
      Review investment side letters, MoUs, offtake discussions, exclusivity, site-control terms, and
      grid-interconnection responsibilities.
    relatedQuestionRefs:
      - QM011
      - QM012
      - QM023
  - type: conflicting-data
    severity: material
    topic: forecast-caveat
    missingEvidence: >-
      Independent forecast consensus separating commercial fusion electricity revenue from component, grant, and R&D
      spending.
    whyItMatters: >-
      Forecast providers may count very different revenue pools and may imply commercialization earlier than technical
      evidence supports.
    diligencePath: Compare paid analyst methodologies and ask management to reconcile market models with plant-delivery roadmap.
    relatedQuestionRefs:
      - QM004
      - QM019
      - QM025
  - type: private-evidence-only
    severity: minor
    topic: industrial-heat
    missingEvidence: Specific customer discovery, temperature requirements, and economics for process-heat applications.
    whyItMatters: Industrial heat is a plausible segment but is less evidenced publicly than grid electricity and data-center power.
    diligencePath: >-
      Request customer interview notes and technical integration studies for industrial heat or hydrogen-adjacent use
      cases.
    relatedQuestionRefs:
      - QM013
  - type: missing-source
    severity: minor
    topic: competitive-substitutes
    missingEvidence: >-
      Side-by-side buyer economics for SMRs, geothermal, storage-backed renewables, gas CCS and fusion in target
      geographies.
    whyItMatters: Clean-firm demand may be real while fusion still loses timing or bankability to alternatives.
    diligencePath: >-
      Build a buyer-level LCOE, permitting, delivery-date, and contractability comparison before underwriting
      fleet-scale adoption.
    relatedQuestionRefs:
      - QM021
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-profile-table
    missingEvidence: >-
      A continuously updated global registry that distinguishes every fusion power-plant developer from suppliers,
      public labs, and component companies.
    whyItMatters: >-
      The table is intentionally bounded to major funded private power-plant competitors and may omit small, stealth,
      public-sector, or supplier-only efforts.
    diligencePath: >-
      Refresh against FIA membership data, PitchBook, Crunchbase, and management win/loss lists before an investment
      committee vote.
    relatedQuestionRefs:
      - QP001
      - QP020
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: pricing-offtake
    missingEvidence: >-
      Comparable power purchase prices, reactor capex, binding offtake terms, and project-finance obligations for
      Proxima, CFS, Helion, Type One, and Focused Energy.
    whyItMatters: >-
      Strategic logos and public funding rounds do not prove that a future plant can clear customer economics or
      financing hurdles.
    diligencePath: >-
      Request executed term sheets, offtake drafts, site agreements, interconnection assumptions, and project-finance
      models from management and counterparties.
    relatedQuestionRefs:
