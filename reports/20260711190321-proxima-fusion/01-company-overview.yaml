  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-and-customers
    missingEvidence: Audited revenue, ARR, grant revenue recognition, paid pilot contracts, customer count, and any binding
      offtake agreements.
    whyItMatters: The public story is pre-revenue and partner-led; valuation underwriting needs evidence of future contracted
      economics rather than roadmap intent.
    diligencePath: Request FY2024-FY2026 management accounts, grant schedules, signed customer/offtake contracts, LOIs, and
      a revenue-recognition memo.
    relatedQuestionRefs:
    - QO011
    - QO026
    relatedTableRefs:
    - TO001
    - TO003
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-governance
    missingEvidence: Full cap table, primary-versus-secondary allocation, liquidation preferences, board/observer rights,
      founder vesting, debt facilities, and side letters.
    whyItMatters: A €2.4B post-money valuation with many investors can hide preference, control, and dilution economics that
      materially affect entry terms.
    diligencePath: Review closing binders for the 2025 and 2026 rounds, shareholder register, board consents, investor rights
      agreements, debt documents, and side letters.
    relatedQuestionRefs:
    - QO024
    - QO025
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: alpha-readiness
    missingEvidence: SMC test plan, Alpha engineering design review, HTS supply-chain qualification, cost-to-complete, licensing
      path, and independent technical readiness review.
    whyItMatters: The company’s near-term value inflection depends on hardware milestones that are not yet achieved and require
      significant follow-on execution.
    diligencePath: Run a technical diligence session with Proxima, IPP advisers, magnet suppliers, and an independent fusion
      engineer; request milestone evidence and burn-down charts.
    relatedQuestionRefs:
    - QO017
    - QO019
    - QO020
  - type: missing-source
    severity: minor
    topic: leadership-disclosure
    missingEvidence: A complete current management team, statutory board roster, observer list, and functional ownership map.
    whyItMatters: Founder-market fit is a strength, but concentration risk cannot be assessed without succession, delegation,
      and governance detail.
    diligencePath: Ask management for an org chart, board deck cover pages, committee charters, founder employment terms,
      and key-person insurance or retention arrangements.
    relatedQuestionRefs:
    - QO004
    - QO005
    - QO024
    relatedTableRefs:
    - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-map
    missingEvidence: Exhaustive list of all 2026 investors, grantors, board observers, strategic partners, and contractual
      counterparties.
    whyItMatters: The public stakeholder list is sufficient for overview but not for legal, control, or concentration underwriting.
    diligencePath: Reconcile company cap table, grant agreements, partner contracts, and board minutes against public investor
      lists.
    relatedQuestionRefs:
    - QO021
    - QO025
    relatedTableRefs:
    - TO003
  - type: conflicting-data
    severity: minor
    topic: founding-date
    missingEvidence: Exact incorporation date and founding-date convention used by management.
    whyItMatters: Public sources mix April 2023 and beginning-of-2023 language; the difference is not investment-material
      but should be standardized for the report.
    diligencePath: Pull official Handelsregister extract or request incorporation documents from management.
    relatedQuestionRefs:
    - QO002
