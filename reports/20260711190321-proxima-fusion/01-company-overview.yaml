- id: milestones-roadmap-and-technical-heritage
  title: Milestones, Roadmap, and Technical Heritage
  body: 'The milestone sequence is best read as a race from institutional science toward industrial execution. IPP’s Wendelstein
    7-X gives Proxima a credible stellarator foundation, while the 2025 Stellaris publication converted that inheritance into
    a company-specific power-plant concept. Proxima’s roadmap then turns to hardware: complete the Stellarator Model Coil
    in 2027, finish Alpha’s design, operate Alpha near Munich in the early 2030s, and pursue a first commercial magnetic-fusion
    plant at Gundremmingen in the late 2030s. RWE’s July 2026 release makes the site strategy more than a slide: it says Proxima
    chose Gundremmingen and will initiate approvals with the Bavarian environment ministry. The gating issue is that every
    major value inflection is still ahead. Stellaris is a peer-reviewed concept, Alpha is a planned demonstrator, and commercial
    grid power remains a late-2030s ambition. The chronology is therefore strong enough to justify continued diligence, not
    strong enough to assume execution success.'
