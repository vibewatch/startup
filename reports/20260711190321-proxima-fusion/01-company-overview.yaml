company:
  name: Proxima Fusion
chapter:
  number: 1
  title: Company Overview
  summary: Proxima Fusion is a Munich-headquartered Max Planck IPP spin-out building QI-HTS stellarators, with a 2026 €411M
    round at a €2.4B valuation making it Europe’s best-funded fusion company. The overview evidence supports strong founder-technology
    fit and strategic backers, but the company is still pre-revenue with Alpha, Gundremmingen, and late-2030s grid deployment
    milestones ahead.
sections:
- id: identity-stage-and-operating-model
  title: Identity, Stage, and Operating Model
  body: 'Proxima Fusion should be treated as a Munich-headquartered, pre-revenue deep-tech infrastructure company rather than
    a conventional energy seller. The legal entity is Proxima Fusion GmbH, registered at the District Court of Munich under
    HRB 283423, with company materials also pointing to Zurich and Oxford as operating locations. Public sources date the
    founding to April 2023 and independently describe the company as the first spin-out from the Max Planck Institute for
    Plasma Physics. Its one-line model is unusually concrete for a young fusion startup: build QI-HTS stellarators, first
    through the 2027 Stellarator Model Coil, then Alpha near Munich in the early 2030s, and ultimately Stellaris power plants
    in the late 2030s. That is not yet a revenue model in the ordinary sense. No fetched source discloses product revenue,
    ARR, paying customer count, audited financials, or power-sales contracts, so the operating stage remains pre-revenue with
    public partners and future off-takers rather than commercial customers.'
