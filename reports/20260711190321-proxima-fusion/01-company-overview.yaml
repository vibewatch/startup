- id: founders-leadership-and-key-person-dependence
  title: Founders, Leadership, and Key-Person Dependence
  body: The leadership story is a strength and a dependency. Public founder lists identify Francesco Sciortino, Lucio Milanese,
    Jorrit Lion, Jonathan Schilling, and Martin Kubie, a founding group tied directly to Max Planck IPP, MIT, and Google X-style
    technical backgrounds. Sciortino remains the central public spokesperson and CEO in financing, Stellaris, and IPP cooperation
    materials; Milanese is also a managing director in the company’s imprint; Lion is the visible chief-scientist voice on
    Stellaris. The June 2026 addition of Sergei Galperin as CFO is therefore important because it broadens the finance bench
    before the capital-intensive Alpha and Stellaris phases. Still, the public governance surface is incomplete. The Industrial
    Development Board adds heavyweight industrial advisers, but fetched materials do not disclose a full statutory board,
    observer rights, voting thresholds, founder vesting, or succession planning. Later diligence should therefore test whether
    Proxima’s IPP-linked founders remain execution accelerants or concentration risks.
