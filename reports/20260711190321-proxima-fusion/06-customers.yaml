  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: binding-offtake
    missingEvidence: Definitive Proxima offtake agreements, capacity reservations, tariffs, delivery dates, penalties, and
      conditions precedent.
    whyItMatters: Future customer demand cannot be underwritten as revenue without bankable contracts tied to MW, price, and
      schedule.
    diligencePath: Request signed PPAs, LOIs, offtake options, RWE project agreements, and any hyperscaler capacity discussions
      under NDA.
    relatedQuestionRefs:
    - QU012
    - QU024
    - QU025
  - type: private-evidence-only
    severity: material
    topic: mou-durability
    missingEvidence: |-
      Full RWE, Bavaria, IPP, and project-development agreements including exclusivity, termination rights, funding conditions, and scope of commitment.
    whyItMatters: The strongest customer-proof signals are contingent agreements whose durability cannot be scored from press
      releases alone.
    diligencePath: Review definitive agreements, board approvals, government award letters, and any side letters with partner
      obligations.
    relatedQuestionRefs:
    - QU002
    - QU004
    - QU018
    - QU019
    relatedTableRefs:
    - TU003
  - type: enumeration-incomplete
    severity: minor
    topic: named-proof-table
    missingEvidence: A complete internal list of all customer, offtake, LOI, utility, industrial, hyperscaler, and public-sector
      discussions.
    whyItMatters: The public named-proof table is a sample of disclosed signals and may omit private customer-development
      activity.
    diligencePath: Ask management for the full commercial pipeline, including stage, counterparty type, MW, price framework,
      probability, and blockers.
    relatedQuestionRefs:
    - QU001
    - QU023
    - QU024
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-and-satisfaction
    missingEvidence: Customer satisfaction, renewal, repeat usage, or reference-call evidence for the eventual power product.
    whyItMatters: No retention metric can exist before delivery, so diligence must use partner reference checks and milestone
      conversion until revenue begins.
    diligencePath: Conduct reference calls with RWE, IPP, Bavarian stakeholders, and comparable fusion offtake buyers.
    relatedQuestionRefs:
    - QU016
    - QU017
    - QU024
  - type: missing-source
    severity: minor
    topic: grid-and-permitting
    missingEvidence: Public grid-interconnection, permitting, and project-finance documentation for Stellaris.
    whyItMatters: Customer bankability depends on the right to build, connect, finance, and dispatch the plant, not only on
      demand interest.
    diligencePath: Track Bavarian environmental permitting, federal hub decisions, interconnection filings, and RWE site reuse
      plans.
    relatedQuestionRefs:
    - QU019
    - QU025
