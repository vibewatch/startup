  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale signal
  - Strategic value
  - Gap
  rows:
  - - Utility / site partner
    - RWE management, project-development teams, future grid operator interfaces
    - Reuse Gundremmingen and help industrialize fusion
    - RWE invested €25M and owns the decommissioning site
    - Best anchor for future offtake/site credibility
    - No disclosed binding PPA or tariff
  - - Public-sector infrastructure sponsor
    - Free State of Bavaria and potentially German/EU programs
    - Co-finance Alpha, site selection, permitting, regional jobs
    - Bavaria indicated potential 20% contribution; German hub bid pending
    - Reduces non-dilutive capital and policy risk
    - Funding is contingent on federal awards and project approvals
  - - Scientific / technical partner
    - Max Planck IPP leadership and Proxima engineering
    - Alpha plasma physics and W7-X knowledge transfer
    - IPP named as scientific lead for Alpha
    - Deepens credibility of the technology roadmap
    - Research partnership is not customer revenue
  - - AI/data-center clean power demand
    - Google energy and infrastructure teams, future hyperscale buyers
    - Long-duration clean firm electricity for load growth
    - Google invested and separately signed CFS fusion PPA
    - Signals buyer appetite for fusion power
    - No Proxima-Google offtake disclosed
  - - Industrial and grid buyers
    - German/EU utilities, industrials, data centers
    - Future firm clean electricity from Stellaris
    - Commercial plant targeted for late 2030s grid connection
    - Large TAM if fusion works at cost
    - No contracted capacity or price
  - - Fusion PPA comparables
    - Microsoft, Google, CFS, Helion counterparties
    - Template for first-of-a-kind offtake commitments
    - 200 MW Google-CFS and 50 MW Helion-Microsoft precedents
    - Shows market design path
    - Comparable delivery remains contingent
  notes: Segments are future demand and enabling-partner segments because Proxima has no paying customers or product revenue
    as of the run date.
