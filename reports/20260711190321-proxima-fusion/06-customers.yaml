- id: named-proof-and-comparable-offtake
  title: Named proof is credible on counterparties but not yet commercial on offtake
  body: |-
    The named-counterparty record is unusually high quality for a young fusion company: RWE, the Bavarian government, Max Planck IPP, Google, KfW Capital, and the EIC Fund are all meaningful institutions. Still, the diligence standard should separate “proof of partner willingness” from “proof of customer demand at price and volume.” RWE’s materials say it will make nuclear infrastructure and regulatory expertise available if the site wins the federal hub, and Proxima’s release says the partners will work on permitting, project structure, financing, and construction roles. That is substantial future-customer proof because it anchors the first plant at a real utility site. By contrast, Google is currently an investor and market-demand signal, not a disclosed Proxima power buyer. Comparables show what the future model could look like: Google-CFS announced a 200 MW PPA for ARC, while Helion-Microsoft announced a first fusion PPA targeting at least 50 MW. Those deals validate buyer appetite for fusion electricity but also highlight Proxima’s current gap: no equivalent binding commercial offtake has been disclosed for Stellaris.
