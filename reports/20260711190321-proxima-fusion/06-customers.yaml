chapter:
  number: 6
  title: Customers
  summary: |-
    Proxima Fusion has no paying customers or product revenue today; the customer file is a future-offtake and strategic-partner file. The strongest proof is RWE’s site, utility expertise, and €25 million strategic investment around Gundremmingen, while Bavaria, IPP, Google, and fusion PPA comparables indicate demand but not binding Proxima-scale revenue.
sections:
- id: pre-revenue-customer-definition
  title: The “customer” base is future offtakers and enabling partners, not current buyers
  body: |-
    Proxima is still pre-revenue, so the correct diligence frame is not installed-base quality or account expansion; it is whether credible future buyers and enablers are organizing around the first power plant. The strongest public proof is RWE: it is a strategic investor, a utility with power-plant construction and operating expertise, and the owner of the former Gundremmingen nuclear site where Proxima’s commercial Stellaris plant is planned. The MoU with the Free State of Bavaria, RWE, and Max Planck IPP defines a pathway that starts with Alpha near Garching and, if the technology works, moves toward a grid-connected stellarator at Gundremmingen. That is closer to site/offtake-market validation than a logo wall, but it still does not equal recurring revenue, a binding PPA, or a delivered megawatt-hour. Buyer/user/payer roles therefore split across RWE as site and utility partner, public-sector funders as infrastructure sponsors, IPP as scientific partner, and eventual grid or industrial electricity buyers as the still-uncontracted demand pool.
