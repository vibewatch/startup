schemaVersion: "report-v2"
artifact: "financials"
slug: "proxima-fusion"
runDate: "2026-07-11"
company:
  name: "Proxima Fusion"
chapter:
  number: 4
  title: "Financials"
  summary: "Proxima Fusion is a pre-revenue, capital-intensive fusion developer whose financial story is dominated by access to mega-rounds and public grants rather than product revenue. The July 2026 €411 million round at a €2.4 billion post-money valuation gives Proxima unusual European capital momentum, but Alpha is still a multi-billion-euro demonstrator program with no ARR, gross margin, or commercial power revenue to underwrite today."
sections:
  - id: pre-revenue-model-and-monetization
    title: "No product revenue: the model is milestone finance before power sales"
    body: |
      Proxima should be underwritten as pre-revenue deep tech, not as a SaaS, marketplace, or recurring infrastructure business. The company’s public materials describe a path from engineering work to Alpha, a net-energy stellarator demonstrator near Munich in the early 2030s, and then to Stellaris, a first commercial stellarator plant later in the decade; they do not describe current product revenue, ARR, realized electricity sales, gross margin, or customer contracts. The only near-term economic “unit” visible from public evidence is milestone completion: the Stellarator Model Coil, HTS cable and magnet production, Alpha site/build-out, and industrial partner readiness. RWE and Google are strategically important, but RWE’s July 2026 disclosure is an investment and site/industrialization relationship rather than a revenue contract. That makes revenue quality impossible to score today. The diligence path is to separate public grants, equity proceeds, partner in-kind support, and any future offtake or project-finance commitment before giving credit for commercial revenue.
    claimRefs: [CI014, CI015, CI016, CI017, CI041, CI042, CI043]
    tableRefs: [TI001, TI002]
    figureRefs: [FI004]

  - id: capital-raised-and-cap-table
    title: "Capital formation is exceptional for Europe, but the stack is complex"
    body: |
      The strongest financial evidence is Proxima’s ability to assemble a pan-European and strategic financing syndicate quickly. Public sources corroborate a June 2025 €130 million Series A, a September 2025 €15 million extension that took disclosed funding to €200 million, and a July 2026 €411 million financing at a €2.4 billion valuation. The July 2026 round was led by XTX Ventures and East X Ventures, with RWE and Google as strategic investors; public and quasi-public backers include KfW Capital, SPRIND, DTCF, Bayern Kapital, HTGF, CDP Venture Capital, and the EIC Fund. This is an advantage because fusion companies need deep-pocketed sponsors across many phases, but it also creates cap-table and governance questions. Northdata and online registry pages identify Proxima Fusion GmbH under Munich HRB 283423, and Northdata lists 37 known active shareholders. The company can credibly claim European funding leadership, yet investor diligence still needs liquidation preferences, pro-rata rights, public-funding covenants, and any strategic investor rights around Alpha or future plants.
    claimRefs: [CI001, CI002, CI003, CI006, CI007, CI011, CI012, CI013, CI038, CI039, CI040]
    tableRefs: [TI004, TI005]
    figureRefs: [FI001]

  - id: burn-runway-and-alpha-capex
    title: "Runway depends on Alpha burn, not on ordinary operating expenses"
    body: |
      The July 2026 balance sheet should buy time, but it does not remove financing dependency. Proxima says the new capital backs Alpha, model-coil completion, HTS cable and magnet production, hiring, and manufacturing-system development. Independent reporting on the Bavaria-linked Alpha plan points to a roughly €2 billion stellarator test-facility program, with Bavaria and Proxima each responsible for 20% and an expected €1.2 billion federal tranche still needed. Even if that reporting is directional rather than a signed financing document, it frames the scale problem: €411 million is large venture capital, but Alpha is a project-finance-scale undertaking. Public sources do not disclose cash on hand, monthly burn, committed capex, working capital, procurement deposits, debt, or the exact public-grant disbursement schedule. A simple sensitivity shows why this matters: at €10 million monthly burn, €411 million is about 41 months of runway; at €20 million, it is about 21 months; at €30 million, it is about 14 months. None of those cases are company guidance, but they illustrate why runway must be diligence-tested against milestone budgets and public-funding timing.
    claimRefs: [CI004, CI005, CI018, CI019, CI020, CI021, CI022, CI023, CI024, CI025, CI027, CI028]
    tableRefs: [TI003, TI006]
    figureRefs: [FI002, FI003]

  - id: peer-context-and-underwriting-verdict
    title: "Peer funding validates the category while highlighting dilution and subsidy risk"
    body: |
      Proxima is now one of the best-funded fusion companies in Europe, but peer context argues against over-reading the round as proof of financial de-risking. Commonwealth Fusion Systems has raised close to $3 billion, Helion says it has raised about $1.5 billion, and TechCrunch’s 2026 survey lists multiple private fusion companies with hundreds of millions or more in capital. That comparison cuts both ways. It supports the idea that serious fusion programs require capital at a scale that traditional venture rounds alone may not cover, and it suggests Proxima’s €650 million-plus total capital is still early relative to U.S. leaders. The adverse financial evidence is material: MIT Technology Review warns that fusion may not become cheap quickly and that no fusion power plants exist yet; the Bulletin of the Atomic Scientists stresses that commercial fusion has repeatedly taken longer than expected and that economic fusion is not assured. The public verdict is therefore balanced. Proxima has strong financing momentum and unusually strategic public-private support, but a decade-plus revenue path, no product revenue, heavy capex, possible dilution, and subsidy dependence remain the core financial risks.
    claimRefs: [CI026, CI029, CI030, CI031, CI032, CI033, CI034, CI035, CI036, CI037, CI043]
    tableRefs: [TI007, TI008]
    figureRefs: [FI005]

