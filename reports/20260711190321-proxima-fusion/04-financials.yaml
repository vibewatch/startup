        - { label: "Expected federal tranche", value: 1200, unit: "€M", note: "Reported remaining share" }
    approximationNotes: "Waterfall combines company disclosures and independent reporting; the Bavaria/federal Alpha stack requires primary grant confirmation."
    claimRefs: [CI004, CI005, CI020, CI021, CI022, CI028]

  - id: FI003
    title: "Runway and burn sensitivity"
    type: "range"
    layout: "standard"
    summary: "The €411M round buys materially different time depending on how fast Alpha-related spend ramps."
    data:
      items:
        - { label: "Low illustrative burn", low: 41, high: 41, unit: "months", note: "€411M / €10M per month" }
        - { label: "Mid illustrative burn", low: 21, high: 21, unit: "months", note: "€411M / €20M per month" }
        - { label: "High illustrative burn", low: 14, high: 14, unit: "months", note: "€411M / €30M per month" }
        - { label: "Alpha target window", low: 54, high: 66, unit: "months", note: "Rough July 2026 to early-2030s operations window" }
    approximationNotes: "Burn cases are diligence sensitivities only; Proxima does not disclose cash balance or monthly burn."
    claimRefs: [CI018, CI019, CI023, CI024, CI025]

  - id: FI004
    title: "Revenue model bridge"
    type: "flow"
    layout: "standard"
    summary: "Current financing converts into technical milestones before any future power-plant revenue can exist."
    data:
      nodes:
        - { id: "capital", label: "Equity + public grants" }
        - { id: "hardware", label: "SMC, HTS cable, magnets" }
        - { id: "alpha", label: "Alpha net-energy demonstrator" }
        - { id: "stellaris", label: "Future Stellaris plant" }
        - { id: "revenue", label: "Future electricity / project revenue" }
        - { id: "gaps", label: "No ARR, GM, or product revenue today" }
      edges:
        - { from: "capital", to: "hardware", label: "Funds near-term build" }
        - { from: "hardware", to: "alpha", label: "De-risks demonstrator" }
        - { from: "alpha", to: "stellaris", label: "Bridge to FOAK plant" }
        - { from: "stellaris", to: "revenue", label: "Potential future monetization" }
        - { from: "capital", to: "gaps", label: "Does not equal current revenue" }
    approximationNotes: "Bridge is qualitative because no product pricing, ARR, or PPA economics are public."
    claimRefs: [CI014, CI015, CI016, CI017, CI025, CI041]

  - id: FI005
    title: "Unit economics bridge"
    type: "flow"
    layout: "standard"
    summary: "Public diligence must move from funding proof to plant economics before revenue quality can be underwritten."
    data:
      nodes:
        - { id: "funding", label: "€650M+ funding proof" }
        - { id: "build", label: "€2B Alpha-scale capex question" }
        - { id: "cost", label: "Fusion cost decline uncertain" }
        - { id: "commercial", label: "No operating reactor revenue yet" }
        - { id: "underwrite", label: "Need LCOE, PPA, burn, grants" }
      edges:
        - { from: "funding", to: "build", label: "Capital supports but may not complete" }
        - { from: "build", to: "cost", label: "Complex facilities may learn slowly" }
        - { from: "cost", to: "commercial", label: "Economics still unproven" }
        - { from: "commercial", to: "underwrite", label: "Private data-room required" }
    approximationNotes: "The economic-risk branch relies on adverse independent sources rather than company guidance."
    claimRefs: [CI020, CI029, CI030, CI031, CI032, CI043]

callouts:
  - calloutType: "insight"
    title: "The balance sheet is milestone capital, not revenue traction"
    body: "The July 2026 round gives Proxima a rare European funding base, but it does not create ARR, gross margin, or product-market proof; those depend on Alpha and later plant economics."
    claimRefs: [CI001, CI014, CI015, CI043]
  - calloutType: "risk"
    title: "Alpha is bigger than one venture round"
    body: "A €411M round is substantial, but independent reporting frames Alpha as a roughly €2B public-private program with unresolved federal funding and project-finance needs."
    claimRefs: [CI020, CI021, CI022, CI027, CI037]
  - calloutType: "recommendation"
    title: "Diligence should request cash, grants, cap table, and LCOE before valuation comfort"
    body: "The next diligence package should reconcile post-close cash, burn, grant covenants, investor preferences, and a plant-level economics model before underwriting the €2.4B valuation."
    claimRefs: [CI001, CI018, CI019, CI027, CI038, CI043]

