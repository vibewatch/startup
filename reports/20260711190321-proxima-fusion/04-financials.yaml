      items:
        - { label: "2023 pre-seed", value: 7.5, unit: "€M", note: "Approximate public pre-seed disclosure" }
        - { label: "2024 seed", value: 20, unit: "€M", note: "Seed round" }
        - { label: "2025 Series A", value: 130, unit: "€M", note: "June 2025 Series A" }
        - { label: "2025 extension", value: 15, unit: "€M", note: "Series A extension" }
        - { label: "2026 financing", value: 411, unit: "€M", note: "July 2026 round" }
        - { label: "2026 total including grants", value: 650, unit: "€M+", note: "Company-disclosed total including grants" }
    approximationNotes: "Pre-seed shown as €7.5M from the 2024 seed release; total funding is a rounded company disclosure, not a sum of only listed equity rounds."
    claimRefs: [CI001, CI003, CI007, CI009, CI010, CI011]

  - id: FI002
    title: "Capital allocation and milestone stack"
    type: "waterfall"
    layout: "wide"
    summary: "The 2026 round supports near-term hardware milestones, while Alpha facility funding remains a larger public-private stack."
    data:
      items:
        - { label: "July 2026 equity round", value: 411, unit: "€M", note: "New private financing" }
        - { label: "Public grants disclosed", value: 95, unit: "€M", note: "Inside €650M+ total" }
        - { label: "Bavaria Alpha contribution", value: 400, unit: "€M", note: "Reported public contribution" }
