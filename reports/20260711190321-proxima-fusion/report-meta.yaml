summary:
  headline: >
    Proxima Fusion is the strongest European fusion asset on paper — IPP/W7-X heritage, a
    peer-reviewed stellarator concept, blue-chip strategic backing, and Europe's largest
    fusion war chest — but it is a pre-revenue science moonshot priced at €2.4B with net
    energy still unproven and grid revenue more than a decade away, so the right call is to
    track it closely with venture-style, option-value discipline rather than underwrite it
    on fundamentals.
