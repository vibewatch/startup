companyProfile:
  summary: |
    Proxima Fusion GmbH is a Munich-based commercial fusion energy company and the first
    spin-out in the history of the Max Planck Institute for Plasma Physics (IPP). It is
    developing power plants based on the quasi-isodynamic (QI) stellarator — a magnetic
    confinement design that operates in a quasi-steady state and avoids the disruptions
    that affect tokamaks, at the cost of highly complex 3D magnet geometry that Proxima
    tackles with high-temperature superconducting (HTS) magnets, computational optimization,
    and AI/ML-assisted design. The company builds directly on the Wendelstein 7-X
    experiment and published Stellaris, described as the first peer-reviewed commercial
    stellarator power-plant concept. Its roadmap runs from a Stellarator Model Coil (2027)
    to the Alpha net-energy demonstrator near Munich (early 2030s) to a commercial Stellaris
    plant at the former Gundremmingen nuclear site in Bavaria, targeting German grid
    connection in the late 2030s. In July 2026 it raised €411M ($468M) at a €2.4B ($2.7B)
    post-money valuation led by XTX Ventures and East X Ventures, with Google and RWE as
    strategic investors, making it Europe's best-funded fusion company.
