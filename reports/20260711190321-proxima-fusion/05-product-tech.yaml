    title: "Peer review plus open tooling make the technical story unusually inspectable"
    body: "Stellaris is not just a slide deck: it is tied to a peer-reviewed plant concept and Proxima has exposed optimization code, datasets, and benchmarks that outsiders can inspect."
    claimRefs: [CE008, CE019, CE020, CE021, CE025]
  - calloutType: "risk"
    title: "Net energy and plant integration are still unproven"
    body: "W7-X and Stellaris improve the plausibility of QI-HTS stellarators, but Proxima has not yet operated Alpha, demonstrated net energy, qualified blankets, or closed the tritium and materials loop."
    claimRefs: [CE012, CE032, CE034, CE035, CE036, CE037, CE040]
  - calloutType: "insight"
    title: "The moat is co-optimization across physics and manufacturability"
