    - type: "private-evidence-only"
      severity: "material"
      topic: "alpha-net-energy-design"
      missingEvidence: "Independent Alpha design review showing target Q, power accounting, plasma scenarios, heat loads, diagnostics, and success criteria."
      whyItMatters: "Alpha is the milestone that must convert the Stellaris paper and W7-X heritage into Proxima-specific net-energy evidence."
      diligencePath: "Request Alpha design basis documents, independent physics review, integrated test plan, and power-balance methodology."
      relatedQuestionRefs: [QE009, QE026]
    - type: "private-evidence-only"
      severity: "material"
      topic: "hts-magnet-scaleup"
      missingEvidence: "SMC design data, REBCO supplier agreements, quench protection design, joint performance, radiation margins, and factory yield assumptions."
      whyItMatters: "HTS magnets are central to Proxima's compactness claim and a critical path item before Alpha construction."
      diligencePath: "Audit SMC test plans, vendor contracts, magnet QA process, and long-duration irradiation evidence."
      relatedQuestionRefs: [QE005, QE018, QE025]
    - type: "private-evidence-only"
      severity: "material"
      topic: "coil-manufacturing-tolerances"
      missingEvidence: "Manufacturing process capability for non-planar coils, metrology tolerances, rework rates, field-error budgets, and assembly sequencing."
      whyItMatters: "The stellarator advantage depends on building complex coils accurately enough that optimized fields survive construction."
      diligencePath: "Review manufacturing readiness, prototype coil inspection reports, supplier qualification, and tolerance stack-up analysis."
      relatedQuestionRefs: [QE019, QE026]
    - type: "missing-source"
      severity: "material"
      topic: "blanket-tritium-materials"
      missingEvidence: "Validated tritium breeding ratio, lithium-6 supply plan, neutron materials lifetime, remote maintenance design, and fuel-handling regulatory plan."
      whyItMatters: "A D-T fusion plant cannot be commercially credible without a fuel cycle and materials plan that survives reactor-scale neutron exposure."
      diligencePath: "Request neutronics, blanket, fuel-cycle, materials, and regulatory work packages plus independent expert review."
      relatedQuestionRefs: [QE020, QE026]
