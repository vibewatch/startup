company:
  name: "Proxima Fusion"
chapter:
  number: 5
  title: "Product & Technology"
  summary: "Proxima Fusion’s product is not a near-term power SKU; it is an integrated QI-HTS stellarator program spanning optimized plasma shapes, complex 3D coils, HTS magnets, blankets, and staged demonstrators. Public evidence is unusually technical for a young fusion company because Stellaris is peer-reviewed and Proxima exposes optimization code and datasets, but net energy, HTS scaling, tritium breeding, neutron materials, and manufacturable coil precision remain the dominant diligence risks."
sections:
  - id: "qi-hts-architecture-and-differentiation"
    title: "QI-HTS architecture is the technology thesis, not a shippable product today"
    body: |
      Proxima’s technology stack is best framed as an integrated reactor-design architecture. The company is developing quasi-isodynamic stellarators that use external, complex three-dimensional magnetic fields rather than a large plasma current to confine plasma. That gives the architecture its core advantage over tokamaks: the design is much harder, but the operating concept targets steady-state, disruption-free behavior and lower plasma-control burden. Proxima adds high-temperature superconducting magnets to shrink the device relative to older stellarator concepts, and it uses simulation-driven optimization to search a very large design space that was historically impractical. The strongest product-tech evidence is that the company’s official technology page, the Stellaris paper announcement, DOE explainers, and W7-X technical sources all point to the same trade: stellarators can be easier to operate continuously, while coil geometry, engineering integration, and manufacturing precision become the hard problem. This is therefore a compelling but still pre-commercial architecture story, not a validated energy product.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE006, CE007, CE029, CE030, CE031]
    tableRefs: [TE001, TE006]
    figureRefs: [FE001, FE004]

  - id: "stellaris-alpha-and-w7x-heritage"
    title: "Stellaris and Alpha turn W7-X heritage into a staged proof plan"
    body: |
      Stellaris gives Proxima a more concrete technical artifact than most early fusion startups can show: a peer-reviewed, integrated power-plant concept that links QI plasma design, HTS magnets, support structures, heat management, and neutronics in one coherent design claim. The concept is still a paper design, but the breadth matters because it forces plasma physics and engineering constraints into the same optimization loop. Alpha is the next validation step, planned near IPP in Garching and described as a net-energy demonstrator rather than a commercial power plant. The roadmap then points to Stellaris at the former Gundremmingen fission site after Alpha, with RWE and Bavaria involved in site, financing, and industrialization work. Wendelstein 7-X is the scientific inheritance: IPP’s device has demonstrated optimized stellarator relevance, long-pulse records, and 2026 peer-reviewed tokamak-level triple-product performance. The diligence issue is that W7-X validates pieces of the physics case, not Proxima’s full reactor system, and Alpha has not yet operated.
    claimRefs: [CE008, CE009, CE010, CE011, CE012, CE013, CE014, CE015, CE016, CE017, CE018]
    tableRefs: [TE005]
    figureRefs: [FE005, FE006]

  - id: "optimization-developer-signal-and-workflow"
    title: "Open optimization assets are meaningful developer signal around a hard design bottleneck"
    body: |
      Proxima’s public developer signal is unusually relevant to its core technical risk. Its GitHub organization lists VMEC++, ray tracing, open stellarator models, and ConStellaration-related repositories, while the ConStellaration repository, Hugging Face dataset, PyPI package, and arXiv preprint expose an optimization benchmark for QI-like stellarator plasma boundaries. The dataset is described as more than 160,000 to 182,000 rows depending on source presentation, paired with ideal-MHD equilibria and metrics; the associated challenge asks the machine-learning community to optimize geometric, simpler-to-build QI, and MHD-stable QI stellarators. That does not prove Proxima can manufacture coils or achieve net energy, but it does verify a real practitioner surface around the design workflow. The customer workflow today is therefore internal and ecosystem-facing: define target plasma boundary, evaluate physics and engineering metrics, simplify coil-relevant geometry, and feed promising designs into higher-fidelity engineering. Public open-source activity reduces black-box risk, while also confirming that the design problem remains high-dimensional and computationally expensive.
    claimRefs: [CE019, CE020, CE021, CE022, CE023, CE024, CE025, CE026, CE027, CE028]
    tableRefs: [TE002]
    figureRefs: [FE002]

  - id: "subsystems-quality-controls-and-risks"
    title: "Subsystem risk is concentrated in magnets, blankets, materials, fuel cycle, and manufacturing"
    body: |
      The adverse-leaning technical view is that Proxima has a credible design thesis but still faces several unresolved proof points before investable commercial readiness. HTS magnets must be demonstrated in stellarator geometry, first through the 2027 Stellarator Model Coil and later at reactor scale. Complex non-planar coils and support structures must meet millimeter-level magnetic-field tolerances while remaining manufacturable, inspectable, and maintainable. Neutron blankets and internal heat-management surfaces must work around a stellarator’s 3D geometry, and the deuterium-tritium fuel path ultimately requires tritium breeding and neutron-resistant materials that remain sector-wide bottlenecks. MIT’s 2025 REBCO irradiation result retires one instantaneous critical-current concern, but it explicitly leaves long-term degradation under years of exposure as ongoing work. The risk register therefore treats Proxima as technically differentiated but far from de-risked: net energy has not been demonstrated, Alpha funding and regulation remain unfinished, and Stellaris is years behind a successful demonstrator.
    claimRefs: [CE032, CE033, CE034, CE035, CE036, CE037, CE038, CE039, CE040]
    tableRefs: [TE003, TE004, TE007]
    figureRefs: [FE003]

