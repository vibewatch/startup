            body: >
              Proxima is now one of the best-funded fusion companies in Europe, but peer context argues against
              over-reading the round as proof of financial de-risking. Commonwealth Fusion Systems has raised close to
              $3 billion, Helion says it has raised about $1.5 billion, and TechCrunch’s 2026 survey lists multiple
              private fusion companies with hundreds of millions or more in capital. That comparison cuts both ways. It
              supports the idea that serious fusion programs require capital at a scale that traditional venture rounds
              alone may not cover, and it suggests Proxima’s €650 million-plus total capital is still early relative to
              U.S. leaders. The adverse financial evidence is material: MIT Technology Review warns that fusion may not
              become cheap quickly and that no fusion power plants exist yet; the Bulletin of the Atomic Scientists
              stresses that commercial fusion has repeatedly taken longer than expected and that economic fusion is not
              assured. The public verdict is therefore balanced. Proxima has strong financing momentum and unusually
              strategic public-private support, but a decade-plus revenue path, no product revenue, heavy capex,
