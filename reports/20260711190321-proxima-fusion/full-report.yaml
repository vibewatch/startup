  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: clean firm power, not generic energy transition spend'
        blocks:
          - type: paragraph
            body: >-
              Proxima should be sized against the market for clean, firm, dispatchable electricity and high-temperature
              energy options, not against all renewables, all nuclear, or all climate-tech capital. The included spend
              is future fusion-generated electricity, power-plant development, grid interconnection, enabling components
              such as HTS magnets and heat-management systems, and strategic offtake from utilities or large corporate
              load buyers. Adjacent but not fully substitutable markets include small modular fission reactors, enhanced
              geothermal, long-duration storage, gas with carbon capture, hydrogen, and conventional renewable PPAs.
              That boundary matters because Proxima is pre-revenue and because no commercial fusion plant exists today.
              The current market signal is therefore not sales conversion; it is willingness by governments, utilities,
              hyperscalers, and suppliers to fund milestones that could become power sales in the 2030s. Proxima’s RWE
              and Google participation supports the boundary: both are power-demand actors, but neither proves that
              fusion has reached a bankable generation market.
