        title: Subsystem risk is concentrated in magnets, blankets, materials, fuel cycle, and manufacturing
        blocks:
          - type: paragraph
            body: >
              The adverse-leaning technical view is that Proxima has a credible design thesis but still faces several
              unresolved proof points before investable commercial readiness. HTS magnets must be demonstrated in
              stellarator geometry, first through the 2027 Stellarator Model Coil and later at reactor scale. Complex
              non-planar coils and support structures must meet millimeter-level magnetic-field tolerances while
              remaining manufacturable, inspectable, and maintainable. Neutron blankets and internal heat-management
              surfaces must work around a stellarator’s 3D geometry, and the deuterium-tritium fuel path ultimately
              requires tritium breeding and neutron-resistant materials that remain sector-wide bottlenecks. MIT’s 2025
              REBCO irradiation result retires one instantaneous critical-current concern, but it explicitly leaves
              long-term degradation under years of exposure as ongoing work. The risk register therefore treats Proxima
              as technically differentiated but far from de-risked: net energy has not been demonstrated, Alpha funding
              and regulation remain unfinished, and Stellaris is years behind a successful demonstrator.
