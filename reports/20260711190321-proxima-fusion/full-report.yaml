subtitle: Europe's Best-Funded Fusion Champion — High-Conviction Moonshot at a €2.4B Pre-Revenue Mark
coverageNotes: |
  Proxima Fusion is a private, pre-revenue deep-tech company spun out of the Max Planck
  Institute for Plasma Physics (IPP) in 2023. Public evidence strongly supports its
  scientific heritage (Wendelstein 7-X), its quasi-isodynamic (QI) stellarator approach,
  the peer-reviewed Stellaris power-plant concept, and its capital formation — a €130M
  Series A (June 2025) and a €411M ($468M) round in July 2026 at a €2.4B ($2.7B)
  post-money valuation, taking total secured capital above €650M. It does NOT disclose
  product revenue, ARR, margins, or binding commercial off-take because none exist yet:
  the company remains a decade-plus science-and-engineering program targeting a
  net-energy demonstrator ("Alpha") near Munich in the early 2030s and a commercial plant
  ("Stellaris", at the former Gundremmingen nuclear site with RWE) connected to the German
  grid in the late 2030s. All valuation views in this report are option-value and
  scenario-based rather than earnings-based, and should be treated as directional.
