  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: funded fusion rivals split by confinement approach'
        blocks:
          - type: paragraph
            body: >-
              Proxima does not compete in a single-product category; it competes in a capital-intensive race to be among
              the first credible private fusion power plant suppliers. The field separates first by physics
              architecture. CFS and Tokamak Energy pursue high-field tokamaks; Type One, Thea, Gauss, Renaissance, and
              Proxima are the most relevant private stellarator cohort; Helion, TAE, General Fusion, and Zap use
              field-reversed, magnetized-target, or Z-pinch variants; and First Light, Marvel, Focused Energy, Xcimer,
              and Pacific Fusion sit closer to inertial or pulsed-power pathways. That matters because investors,
              utilities, hyperscalers, and governments are buying timelines, technical risk reduction, industrial
              supply-chain access, and credible grid projects rather than a standardized reactor. Proxima's QI
              stellarator pitch is differentiated inside the stellarator lane, but the funding table shows that the
              best-capitalized global rivals are still mostly U.S. tokamak, FRC, and inertial players.
