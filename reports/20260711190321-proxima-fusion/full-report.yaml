              and an expected €1.2 billion federal tranche still needed. Even if that reporting is directional rather
              than a signed financing document, it frames the scale problem: €411 million is large venture capital, but
              Alpha is a project-finance-scale undertaking. Public sources do not disclose cash on hand, monthly burn,
              committed capex, working capital, procurement deposits, debt, or the exact public-grant disbursement
              schedule. A simple sensitivity shows why this matters: at €10 million monthly burn, €411 million is about
