      - number: '6.2'
        title: Adoption trajectory is a milestone funnel from MoU to demonstrator to late-2030s grid power
        blocks:
          - type: paragraph
            body: >-
              The adoption trajectory is more like infrastructure development than enterprise sales. Public sources
              identify a staged path: Alpha near IPP in Garching is meant to demonstrate net energy in the early 2030s;
              Stellaris would follow at Gundremmingen in the late 2030s; Proxima and partners are also seeking German
              federal magnetic-fusion-hub support. RWE’s July 2026 investment hardens the February agreement because it
              adds money to the earlier site and collaboration signal. Bavaria’s newsletter and the Proxima/IPP releases
              make the public-sector demand case explicit: energy security, industrial jobs, AI and data-center load,
              and European technology leadership. Google’s participation is not a Proxima offtake contract, but it is a
              credible strategic signal because Google has separately committed to a 200 MW fusion PPA with Commonwealth
              Fusion Systems and is under pressure to procure clean firm power for data centers. The trajectory is
              therefore encouraging but binary: adoption only becomes commercial if Alpha validates and a bankable plant
              can be permitted, financed, connected, and sold into the grid.
