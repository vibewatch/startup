  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Top risks concentrate in technical proof, capital intensity, and schedule realism
        blocks:
          - type: paragraph
            body: >-
              Proxima Fusion’s risk profile is best read as a stacked milestone problem rather than as one isolated
              scientific risk. The company has unusual strengths for a young deep-tech venture: a €411 million July 2026
              financing, a €2.4 billion post-money valuation, Max Planck IPP inheritance, RWE site and operator
              involvement, and a German policy environment that wants a first fusion plant. Those facts reduce financing
              and credibility risk versus most European fusion peers, but they do not retire the central question: Alpha
              still has to prove net energy in a stellarator, on an early-2030s schedule, while the company
              simultaneously scales HTS magnet manufacturing, tritium and materials plans, permitting, public-private
              funding, and future offtake economics. Independent adverse sources keep the residual risk high: GAO says
              commercial fusion still faces burning-plasma, materials, systems-engineering, and regulatory challenges;
              MIT Technology Review questions whether fusion costs will fall quickly; and the Bulletin argues
              commercialization hype has repeatedly outrun useful-power proof.
