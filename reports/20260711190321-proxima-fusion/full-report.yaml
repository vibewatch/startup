        title: Capital formation is exceptional for Europe, but the stack is complex
        blocks:
          - type: paragraph
            body: >
              The strongest financial evidence is Proxima’s ability to assemble a pan-European and strategic financing
              syndicate quickly. Public sources corroborate a June 2025 €130 million Series A, a September 2025 €15
              million extension that took disclosed funding to €200 million, and a July 2026 €411 million financing at a
              €2.4 billion valuation. The July 2026 round was led by XTX Ventures and East X Ventures, with RWE and
              Google as strategic investors; public and quasi-public backers include KfW Capital, SPRIND, DTCF, Bayern
              Kapital, HTGF, CDP Venture Capital, and the EIC Fund. This is an advantage because fusion companies need
              deep-pocketed sponsors across many phases, but it also creates cap-table and governance questions.
              Northdata and online registry pages identify Proxima Fusion GmbH under Munich HRB 283423, and Northdata
              lists 37 known active shareholders. The company can credibly claim European funding leadership, yet
              investor diligence still needs liquidation preferences, pro-rata rights, public-funding covenants, and any
              strategic investor rights around Alpha or future plants.
