      - number: '7.2'
        title: Technical risk is not just plasma physics; it is an integrated hardware, fuel, and materials program
        blocks:
          - type: paragraph
            body: >-
              The most important technical risk is that Proxima must move from an optimized QI-HTS stellarator concept
              into a working, maintainable net-energy machine. Wendelstein 7-X and Stellaris provide scientific and
              design credibility, yet commercial operation introduces harsher constraints than the research record alone
              can verify: long-lived structural materials under 14 MeV neutron flux, tritium breeding and processing,
              HTS magnet durability, field tolerances, first-wall maintenance, and complex component supply. Some risk
              has been retired at the margin: MIT researchers found that a suspected instantaneous REBCO beam-on effect
              was not important under their tests. But the same source says longer-term REBCO degradation over years or
              decades remains under investigation, and the FIA supply-chain report flags fuel infrastructure and
              first-wall materials as major future concerns. The diligence focus should be Alpha’s model-coil evidence,
              neutron/materials qualification plan, fuel-cycle design, and manufacturing yield—not only headline plasma
              milestones.
