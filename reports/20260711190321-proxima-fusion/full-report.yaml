        title: Open optimization assets are meaningful developer signal around a hard design bottleneck
        blocks:
          - type: paragraph
            body: >
              Proxima’s public developer signal is unusually relevant to its core technical risk. Its GitHub
              organization lists VMEC++, ray tracing, open stellarator models, and ConStellaration-related repositories,
              while the ConStellaration repository, Hugging Face dataset, PyPI package, and arXiv preprint expose an
              optimization benchmark for QI-like stellarator plasma boundaries. The dataset is described as more than
              160,000 to 182,000 rows depending on source presentation, paired with ideal-MHD equilibria and metrics;
              the associated challenge asks the machine-learning community to optimize geometric, simpler-to-build QI,
              and MHD-stable QI stellarators. That does not prove Proxima can manufacture coils or achieve net energy,
              but it does verify a real practitioner surface around the design workflow. The customer workflow today is
              therefore internal and ecosystem-facing: define target plasma boundary, evaluate physics and engineering
              metrics, simplify coil-relevant geometry, and feed promising designs into higher-fidelity engineering.
              Public open-source activity reduces black-box risk, while also confirming that the design problem remains
              high-dimensional and computationally expensive.
