      - number: '3.2'
        title: 'Proxima versus stellarator peers: QI, W7-X heritage, HTS, and AI coil design'
        blocks:
          - type: paragraph
            body: >-
              The direct stellarator peer set is narrower than the full fusion map. Type One is the closest U.S. analog
              because it is also commercializing a stellarator and has a TVA-linked project concept; Thea attacks the
              same historical stellarator weakness from the opposite direction by replacing complex 3D coils with many
              modular magnets and software control; Renaissance simplifies coil manufacture through HTS deposition and
              liquid-metal shielding; and Gauss is a European industrial consortium aimed at magnetic-confinement plant
              delivery. Proxima's response is a different bundle: quasi-isodynamic plasma physics, HTS magnets,
              AI-accelerated coil and engineering optimization, and Wendelstein 7-X institutional heritage from Max
              Planck IPP. The Stellaris publication strengthens that story because it turns the pitch into an
              inspectable plant concept rather than a pure company assertion. The risk is that every stellarator peer is
              also trying to make the same complexity objection go away, so Proxima's moat depends on execution speed
              and manufacturing proof, not the word stellarator alone.
