  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: 'No product revenue: the model is milestone finance before power sales'
        blocks:
          - type: paragraph
            body: >
              Proxima should be underwritten as pre-revenue deep tech, not as a SaaS, marketplace, or recurring
              infrastructure business. The company’s public materials describe a path from engineering work to Alpha, a
              net-energy stellarator demonstrator near Munich in the early 2030s, and then to Stellaris, a first
              commercial stellarator plant later in the decade; they do not describe current product revenue, ARR,
              realized electricity sales, gross margin, or customer contracts. The only near-term economic “unit”
              visible from public evidence is milestone completion: the Stellarator Model Coil, HTS cable and magnet
              production, Alpha site/build-out, and industrial partner readiness. RWE and Google are strategically
              important, but RWE’s July 2026 disclosure is an investment and site/industrialization relationship rather
              than a revenue contract. That makes revenue quality impossible to score today. The diligence path is to
              separate public grants, equity proceeds, partner in-kind support, and any future offtake or
              project-finance commitment before giving credit for commercial revenue.
