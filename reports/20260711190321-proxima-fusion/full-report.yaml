      - number: '2.4'
        title: Timing, geography, policy tailwinds, and constraints
        blocks:
          - type: paragraph
            body: >-
              Market timing is favorable but unforgiving. Germany’s Fusion Action Plan pledges more than €2 billion by
              2029 and frames the first fusion power plant in Germany as a national objective; Bavaria separately
              announced up to €400 million for projects tied to Proxima, RWE, and IPP; and EU/Euratom policy is moving
              toward a 2026-2027 fusion commercialization and public-private-partnership framework. This gives Proxima
              an unusually strong local policy wedge around Munich/Garching and Bavaria, while the company itself frames
              Europe as racing the United States and China. The adverse view is equally important: Clean Energy Wire
              reports that fusion remains experimental and commercial use is at least decades away, and CNBC quotes
              Google saying commercialization is immensely challenging and success is not guaranteed. The right market
              conclusion is therefore staged. Alpha in the early 2030s can expand SAM credibility; a late-2030s grid
              plant can create first SOM evidence; but valuation should not capitalize broad 2040 market forecasts as if
              commercial revenue were already de-risked.
