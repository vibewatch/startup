      - number: '1.3'
        title: Capital Formation and Stakeholder Map
        blocks:
          - type: paragraph
            body: >-
              Capital formation is the clearest public signal of momentum. Proxima moved from a roughly €7 million 2023
              pre-seed to a €20 million 2024 seed, a €130 million Series A in June 2025, and then a July 2026 €411
              million round that priced the company at €2.4 billion post-money. The latest financing was led by XTX
              Ventures and East X Ventures, with Google and RWE as strategic investors, and Proxima says total secured
              capital now exceeds €650 million including public grants. This is enough to establish Proxima as Europe’s
              best-funded fusion company, but not enough to underwrite economics. The sources do not disclose
              primary-versus-secondary mix, preference stack, debt, board rights, or insider ownership. The stakeholder
              map also matters because money and execution are intertwined: RWE contributes site and regulatory
              know-how, Bavaria and public grants help de-risk Alpha, IPP supplies scientific heritage, and XTX/Google
              connect the narrative to AI-enabled engineering and long-term data-center power demand.
