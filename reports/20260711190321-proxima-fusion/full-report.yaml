            body: >-
              The main customer risk is not churn; there is no revenue base to churn. The risk is that today’s
              “customers” are contingent stakeholders whose economics only materialize after major scientific,
              engineering, permitting, financing, and grid-integration milestones. Public sources do not disclose a
              Proxima PPA, tariff, contracted capacity, commercial price, customer-count metric, NRR, GRR, contract
              duration, or top-customer concentration. Neutron Bytes explicitly questions where Proxima’s
              public-relations claims end and hard facts begin, and Energy Solutions’ 2026 fusion review stresses that
              tritium, materials, regulation, and cost hurdles keep meaningful grid supply before the mid-2030s
              unlikely. That skepticism matters for customer diligence: RWE and Bavaria reduce siting and institutional
