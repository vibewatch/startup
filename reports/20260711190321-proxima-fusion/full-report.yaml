              peer-reviewed, integrated power-plant concept that links QI plasma design, HTS magnets, support
              structures, heat management, and neutronics in one coherent design claim. The concept is still a paper
              design, but the breadth matters because it forces plasma physics and engineering constraints into the same
              optimization loop. Alpha is the next validation step, planned near IPP in Garching and described as a
              net-energy demonstrator rather than a commercial power plant. The roadmap then points to Stellaris at the
              former Gundremmingen fission site after Alpha, with RWE and Bavaria involved in site, financing, and
              industrialization work. Wendelstein 7-X is the scientific inheritance: IPP’s device has demonstrated
              optimized stellarator relevance, long-pulse records, and 2026 peer-reviewed tokamak-level triple-product
              performance. The diligence issue is that W7-X validates pieces of the physics case, not Proxima’s full
              reactor system, and Alpha has not yet operated.
