      - number: '7.5'
        title: Mitigants are credible, but underwriting should be milestone-gated and unforgiving
        blocks:
          - type: paragraph
            body: >-
              The right investment control is not to dismiss Proxima because fusion is hard; it is to demand that each
              major mitigant converts into measured de-risking. Max Planck IPP leadership should produce transparent
              Alpha physics milestones. RWE’s Gundremmingen role should produce concrete siting, grid, permitting, and
              project-delivery evidence. The fresh financing should translate into model-coil progress, HTS production
              capacity, supplier commitments, and a staged budget that does not rely on vague future mega-rounds.
              Regulation should produce early authority feedback on tritium, waste, environmental assessment, and public
              engagement. If those milestones slip, the downside is nonlinear: a late or over-budget Alpha weakens the
              net-energy thesis, increases dilution, exposes policy-dependence, and lets better-funded competitors
              define the market. The risk register therefore supports a high-risk, research-more stance unless data-room
              evidence shows schedule, budget, technical, and regulatory traction beyond public announcements.
