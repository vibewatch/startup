  productSummary: |
    Proxima does not yet sell a commercial product. Its "product" is a fusion power-plant
    program: the QI stellarator concept Stellaris, an HTS-magnet development track (including
    a Stellarator Model Coil milestone and a framework agreement with PSI), and the planned
    Alpha net-energy demonstrator. The eventual commercial offering is baseload, clean,
    quasi-steady-state fusion electricity delivered to grids and large energy buyers, with a
    first commercial plant planned at the former Gundremmingen fission site alongside RWE.
  customerFocus: >
    Future off-takers and strategic energy buyers rather than paying customers today: utilities (RWE as site and
    cooperation partner), the Bavarian state and German public sector, and large clean-firm-power buyers such as
    hyperscale/AI data-center operators (reflected in Google's strategic investment). No binding commercial off-take
    exists yet.
  businessModel: >
