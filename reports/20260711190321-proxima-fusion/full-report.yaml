        title: Identity, Stage, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Proxima Fusion should be treated as a Munich-headquartered, pre-revenue deep-tech infrastructure company
              rather than a conventional energy seller. The legal entity is Proxima Fusion GmbH, registered at the
              District Court of Munich under HRB 283423, with company materials also pointing to Zurich and Oxford as
              operating locations. Public sources date the founding to April 2023 and independently describe the company
              as the first spin-out from the Max Planck Institute for Plasma Physics. Its one-line model is unusually
              concrete for a young fusion startup: build QI-HTS stellarators, first through the 2027 Stellarator Model
              Coil, then Alpha near Munich in the early 2030s, and ultimately Stellaris power plants in the late 2030s.
              That is not yet a revenue model in the ordinary sense. No fetched source discloses product revenue, ARR,
              paying customer count, audited financials, or power-sales contracts, so the operating stage remains
              pre-revenue with public partners and future off-takers rather than commercial customers.
