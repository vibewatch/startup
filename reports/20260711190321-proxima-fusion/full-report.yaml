              with QI optimization, HTS magnets, AI design tooling, W7-X learning, and unusually strong European
              public-private backing. The adverse case is equally straightforward: the company is young, pre-revenue,
              less funded than CFS and Helion, and operating in a crowded field where rival architectures may reach
              visible grid milestones first. Stellarator complexity is still the central risk. Thea and Renaissance
