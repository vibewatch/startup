              expansion; it is whether credible future buyers and enablers are organizing around the first power plant.
              The strongest public proof is RWE: it is a strategic investor, a utility with power-plant construction and
              operating expertise, and the owner of the former Gundremmingen nuclear site where Proxima’s commercial
              Stellaris plant is planned. The MoU with the Free State of Bavaria, RWE, and Max Planck IPP defines a
              pathway that starts with Alpha near Garching and, if the technology works, moves toward a grid-connected
              stellarator at Gundremmingen. That is closer to site/offtake-market validation than a logo wall, but it
              still does not equal recurring revenue, a binding PPA, or a delivered megawatt-hour. Buyer/user/payer
              roles therefore split across RWE as site and utility partner, public-sector funders as infrastructure
              sponsors, IPP as scientific partner, and eventual grid or industrial electricity buyers as the
              still-uncontracted demand pool.
