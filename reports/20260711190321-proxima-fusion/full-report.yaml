      - number: '1.5'
        title: Adverse Context and Diligence Paths
        blocks:
          - type: paragraph
            body: >-
              The adverse view is not that Proxima is unserious; it is that the investment case depends on proving
              things no private fusion company has yet proven commercially. CNBC notes that fusion has not been deployed
              commercially and cites Google’s caveat that commercialization is immensely challenging and success is not
              guaranteed. Sifted’s Series A coverage is even more direct on net-energy risk, warning that no fusion
              machine had yet managed to produce more energy than it consumes. Even allowing for national-lab ignition
              milestones, Proxima’s own plan requires several unfunded or partially funded steps: SMC, Alpha, licensing,
              site conversion, supply-chain scale-up, and later power-plant project finance. The company has substantial
              public and private backing, but a broad shareholder base and strategic partners do not remove dilution,
              governance, or execution risk. The chapter therefore carries explicit nulls for revenue, ARR, customer
              count, and cap-table economics, with diligence paths focused on management financials, partner contracts,
              board materials, and Alpha technical-readiness reviews.
