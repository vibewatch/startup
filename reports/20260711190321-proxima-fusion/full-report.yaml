      - number: '7.3'
        title: Regulation is more favorable than fission, but siting, waste, tritium, and IP obligations remain live risks
        blocks:
          - type: paragraph
            body: >-
              Regulatory risk is two-sided. On the positive side, leading jurisdictions are deliberately building
              proportionate fusion frameworks rather than treating fusion exactly like fission. The UK draft EN-8 is
              technology- and output-agnostic, the NRC is moving through a fusion-machines byproduct-material pathway,
              and German federal policy is explicitly trying to create innovation-friendly conditions for a first fusion
              power plant. That lowers the odds of a fission-style licensing dead end. It does not make licensing
              trivial. Foley Hoag notes that the NRC framework still leaves practical issues around waste
              classification, tritium reporting, and state-federal compatibility; the UK process still requires planning
              and environmental assessment; and Proxima’s own MoU makes site selection, permitting, regulatory
              processes, project structure, and financing explicit workstreams. Legal risk also extends beyond safety
              law: Noerr highlights IP strategies, exploitation plans, grant obligations, and cross-border restrictions
              as success factors for publicly funded German/EU fusion projects.
