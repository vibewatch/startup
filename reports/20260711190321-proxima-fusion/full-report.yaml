  - id: TE006
    title: Technology differentiation comparison
    columns:
      - Dimension
      - QI stellarator / Proxima thesis
      - Tokamak baseline
      - Diligence implication
    rows:
      - - Magnetic-field source
        - External 3D coils create the confinement field
        - Plasma current plus coils create twisted field
        - Stellarator shifts complexity from operations to design and manufacturing
      - - Operating mode
        - Targets steady-state continuous operation
        - Pulsed or noninductive current-drive operation is harder
        - Proxima's differentiation matters most if continuous high-performance operation scales
      - - Disruption risk
        - No large toroidal plasma current; current-driven disruptions can be eliminated
        - Tokamak plasma currents can experience internal disruptions
        - Safety and availability thesis is plausible but still needs Alpha proof
      - - Design complexity
        - Many degrees of freedom and complex non-planar coils
        - Simpler axisymmetric geometry
        - AI/ML and numerical optimization are central, not optional
      - - Power-density path
        - HTS high fields aim to shrink stellarator size
        - HTS tokamaks also pursue compact high-field designs
        - HTS is a shared enabler rather than Proxima-only moat
    notes: >-
      The comparison synthesizes DOE, IPP, Proxima, and W7-X technical evidence rather than assuming one concept is
      commercially proven.
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE005
      - CE006
      - CE029
      - CE030
      - CE031
