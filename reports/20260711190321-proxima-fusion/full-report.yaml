  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: QI-HTS architecture is the technology thesis, not a shippable product today
        blocks:
          - type: paragraph
            body: >
              Proxima’s technology stack is best framed as an integrated reactor-design architecture. The company is
              developing quasi-isodynamic stellarators that use external, complex three-dimensional magnetic fields
              rather than a large plasma current to confine plasma. That gives the architecture its core advantage over
              tokamaks: the design is much harder, but the operating concept targets steady-state, disruption-free
              behavior and lower plasma-control burden. Proxima adds high-temperature superconducting magnets to shrink
              the device relative to older stellarator concepts, and it uses simulation-driven optimization to search a
              very large design space that was historically impractical. The strongest product-tech evidence is that the
              company’s official technology page, the Stellaris paper announcement, DOE explainers, and W7-X technical
              sources all point to the same trade: stellarators can be easier to operate continuously, while coil
              geometry, engineering integration, and manufacturing precision become the hard problem. This is therefore
              a compelling but still pre-commercial architecture story, not a validated energy product.
