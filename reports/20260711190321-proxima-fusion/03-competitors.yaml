  evidenceGaps:
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-profile-table
    missingEvidence: A continuously updated global registry that distinguishes every fusion power-plant developer
      from suppliers, public labs, and component companies.
    whyItMatters: The table is intentionally bounded to major funded private power-plant competitors and may omit
      small, stealth, public-sector, or supplier-only efforts.
    diligencePath: Refresh against FIA membership data, PitchBook, Crunchbase, and management win/loss lists before
      an investment committee vote.
    relatedQuestionRefs:
    - QP001
    - QP020
    relatedTableRefs:
    - TP001
  - type: private-evidence-only
    severity: material
    topic: pricing-offtake
    missingEvidence: Comparable power purchase prices, reactor capex, binding offtake terms, and project-finance
      obligations for Proxima, CFS, Helion, Type One, and Focused Energy.
    whyItMatters: Strategic logos and public funding rounds do not prove that a future plant can clear customer
      economics or financing hurdles.
    diligencePath: Request executed term sheets, offtake drafts, site agreements, interconnection assumptions, and
      project-finance models from management and counterparties.
    relatedQuestionRefs:
    - QP019
    - QP024
    - QP025
  - type: private-evidence-only
    severity: material
    topic: win-rates-and-talent
    missingEvidence: Private talent-pipeline, supplier-allocation, and investor-overlap data showing whether Proxima
      is losing key hires or suppliers to CFS, Helion, Type One, or Thea.
    whyItMatters: The biggest competitive harm may appear in hiring and supply-chain allocation years before commercial
      revenue exists.
    diligencePath: Review recruiting funnel, supplier MOUs, long-lead purchase commitments, and investor competitive-conflict
      disclosures.
    relatedQuestionRefs:
    - QP021
    - QP022
    - QP025
  - type: missing-source
    severity: minor
    topic: competitor-funding
    missingEvidence: Primary fundraising documents or company-confirmed cap tables for every competitor in the profile
      table.
    whyItMatters: TechCrunch/PitchBook-style funding totals mix rounds, grants, valuations, and milestone-tranched
      commitments, limiting exact ranking precision.
    diligencePath: Triangulate funding values through PitchBook, Crunchbase, company filings, and direct management
      confirmation.
    relatedQuestionRefs:
    - QP003
    - QP006
    - QP016
    - QP024
  - type: missing-source
    severity: material
    topic: technical-benchmarks
    missingEvidence: Comparable independent test results for Proxima model coils versus Type One, Thea, Renaissance,
      CFS magnets, and Helion FRC performance.
    whyItMatters: Public architecture descriptions are insufficient to rank technical probability of success.
    diligencePath: Commission an expert review of magnet tolerances, confinement metrics, target repetition assumptions,
      and subsystem readiness levels.
    relatedQuestionRefs:
    - QP015
    - QP017
    - QP018
    - QP023
