- id: TP004
  title: Approach trade-off table
  columns:
  - Approach
  - Representative companies
  - Core promise
  - Primary risk
  - Why it matters to Proxima
  rows:
  - - QI / optimized stellarator
    - Proxima
    - Steady-state operation with reduced turbulence and W7-X-derived credibility
    - Complex 3D engineering, coil precision, and manufacturing scale-up
    - This is Proxima’s main differentiation and main technical diligence burden
  - - Other stellarators
    - Type One, Thea, Renaissance, Gauss
    - Steady-state magnetic confinement with different simplification strategies
    - Peers may solve coil complexity faster or cheaper
    - Directly contests Proxima’s claim to the winning stellarator implementation
  - - HTS tokamak / spherical tokamak
    - CFS, Tokamak Energy
    - More mature tokamak physics with compact HTS magnets
    - Disruptions, pulsed/steady operation, materials, and tritium systems
    - Could reach grid milestones first and dominate investor imagination
  - - FRC / Z-pinch / magnetized target
    - Helion, TAE, Zap, General Fusion
    - Potentially simpler geometry or direct conversion
    - Plasma stability, compression mechanics, and repeated operation
    - Competes for the same clean firm-power customers without stellarator coils
  - - Laser / inertial / pulsed magnetic inertial
    - First Light, Marvel, Focused, Xcimer, Pacific
    - Builds from NIF-style ignition or pulsed-power physics
    - Driver efficiency, target mass production, repetition rate, chamber survivability
    - Can attract large rounds and industrial partners despite different physics
  notes: The approach table compresses complex reactor programs into diligence categories; it is a decision map,
    not a physics proof.
