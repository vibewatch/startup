- id: capital-scale-and-commercial-access
  title: Funding, valuation, and customer-access asymmetry
  body: Proxima's July 2026 financing puts it in the global conversation and appears to make it Europe's best-funded
    fusion company, but it is still smaller and younger than the biggest U.S. competitors. CFS has raised near $3
    billion and is building the SPARC-to-ARC tokamak roadmap; Helion disclosed a $15.5 billion valuation and $1.5
    billion total raised while pointing at Microsoft as its first customer; Pacific Fusion disclosed a very large
    staged Series A; and TAE has almost two decades more operating history. Proxima's RWE and Google participation
    helps narrow the commercial-access gap because it links the company to a German grid-site pathway and a strategic
    electricity-demand buyer, but rival offtake and project announcements create a high bar for diligence. The underwriting
    issue is not whether Proxima raised a large round; it is whether Alpha, the model coil, HTS production, and
    manufacturing systems can convert that capital into milestones before better-funded alternatives lock up partners,
    talent, and supply chain capacity.
