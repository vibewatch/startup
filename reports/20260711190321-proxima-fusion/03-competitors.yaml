- id: moat-risks-and-diligence-asks
  title: 'Moat durability: differentiation is real but unproven at plant scale'
  body: 'The strongest competitive case for Proxima is that it combines a steady-state stellarator architecture
    with QI optimization, HTS magnets, AI design tooling, W7-X learning, and unusually strong European public-private
    backing. The adverse case is equally straightforward: the company is young, pre-revenue, less funded than CFS
    and Helion, and operating in a crowded field where rival architectures may reach visible grid milestones first.
    Stellarator complexity is still the central risk. Thea and Renaissance explicitly market simplification strategies,
    while CFS and Helion avoid the same 3D-coil problem through different confinement choices. Supply-chain evidence
    also points to bottlenecks in advanced components, vacuum vessels, power electronics, first-wall materials,
    and fuel-cycle infrastructure, which can slow all approaches but especially hardware designs that need custom
    magnets and precision manufacturing. Diligence should therefore focus on model-coil performance, manufacturing
    yield, supplier concentration, timeline realism, and whether RWE/Google support translates into binding project
    economics rather than strategic signaling.'
