- id: TP005
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Why it matters
  - Mitigation / diligence ask
  rows:
  - - QI stellarator physics plus W7-X heritage
    - Type One, Thea, Renaissance, and Gauss also market stellarator simplification
    - high
    - Architecture-level differentiation narrows if peers solve coil cost and manufacturability
    - Review model-coil test results, optimization benchmarks, and manufacturing yield data
  - - Europe’s best-funded fusion company
    - CFS, Helion, TAE, and Pacific have greater or comparable global capital signals
    - high
    - Capital depth controls talent, suppliers, project credibility, and timeline resilience
    - Benchmark remaining cash needs through Alpha and first plant against rival funding capacity
  - - AI and computational coil design
    - Software-led coil optimization is not exclusive; Thea and Renaissance also shift complexity into controls
      or manufacturing
    - medium
    - AI claims can become table stakes without hardware proof
    - Audit design-to-build cycle time, simulation validation, and tolerance stackups
  - - RWE/Google strategic access
    - CFS has Google offtake; Helion has Microsoft and OpenAI-linked demand narrative
    - medium
    - Strategic logos do not equal bankable plant contracts
    - Separate investment, MOU, site access, offtake, and project-finance obligations
  - - Stellaris plant concept credibility
    - Paper concept may not survive component, supply-chain, fuel-cycle, and first-wall constraints
    - high
    - A credible concept is necessary but insufficient for executable plant delivery
    - Map every Stellaris subsystem to supplier, cost, schedule, and test evidence
  notes: Risk severity reflects diligence priority, not probability; all rows require private technical and commercial
    evidence before underwriting.
