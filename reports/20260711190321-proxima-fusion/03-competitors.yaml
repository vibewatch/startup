tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Company
  - Approach / category
  - Reported funding or valuation signal
  - Target segment / milestone
  - Differentiation
  - Limitation
  rows:
  - - Proxima Fusion
    - QI stellarator / direct peer
    - €650M+ total including grants; €2.4B post-money valuation in July 2026
    - Alpha net-energy stellarator near Munich, early 2030s
    - QI-HTS design, W7-X heritage, AI coil optimization, Stellaris plant concept
    - Younger and less funded than top U.S. leaders; model-coil and manufacturing proof pending
  - - Commonwealth Fusion Systems
    - HTS tokamak / incumbent leader
    - Near $3B raised per TechCrunch list
    - SPARC net-energy machine, ARC grid plant in early 2030s
    - Best-funded private fusion player with compact HTS tokamak roadmap
    - Tokamak disruption, materials, tritium, and buildout risks remain
  - - TAE Technologies
    - Field-reversed configuration / long-running incumbent
    - About $1.79B raised before planned merger per TechCrunch/PitchBook
    - Commercialize advanced-beam FRC platform
    - Deep operating history and alternative fuel-cycle narrative
    - Long timeline and complex corporate transaction obscure clean comparability
  - - Helion Energy
    - FRC / direct electricity / hyperscaler-backed rival
    - $465M 2026 round; $15.5B valuation; $1.5B total raised
    - Orion power plant and Microsoft customer timeline
    - Direct electricity conversion and Sam Altman/OpenAI adjacency
    - Aggressive 2028 target heightens delivery risk
  - - Tokamak Energy
    - Spherical tokamak / HTS magnet peer
    - $336M total raised per TechCrunch/PitchBook
    - ST40 and HTS magnet commercialization
    - Compact tokamak plus magnet-technology revenue options
    - Smaller funding base than CFS and less direct stellarator relevance
  - - General Fusion
    - Magnetized target fusion
    - Over $600M raised per TechCrunch
    - LM26 demo and first-of-a-kind plant roadmap
    - Liquid-metal compression architecture and long operating history
    - Hybrid mechanical system adds unique engineering complexity
  - - Zap Energy
    - Sheared-flow Z-pinch / adjacent
    - $327M raised per TechCrunch/PitchBook
    - Fusion pilot plant preconceptual milestone
    - Avoids HTS magnets and lasers with compact Z-pinch approach
    - Still must prove stable, repeatable power-plant plasma performance
  - - First Light Fusion
    - Inertial / projectile and FLARE architecture
    - $108M raised per TechCrunch/PitchBook
    - Scalable inertial architecture and adjacent extreme-conditions capabilities
    - Lower peak-power inertial concept
    - Refocused commercial path and no direct magnetic-confinement comparability
  - - Type One Energy
    - Stellarator / direct peer
    - $269M raised including pre-Series-B equity per TechCrunch
    - TVA-linked 350 MW plant concept in mid-2030s
    - U.S. stellarator route with utility-led build/own/operate model
    - Less capital than Proxima after July 2026 and still pre-commercial
  - - Thea Energy
    - Stellarator / direct peer
    - $100M Series B in 2026 per TechCrunch
    - Software-controlled modular-magnet stellarator
    - Attacks coil complexity with mass-manufacturable magnet arrays
    - Must prove software-controlled field quality and reactor integration
  - - Marvel Fusion
    - Laser inertial / German peer
    - '> $400M public and private funding per company; $162M private per TechCrunch'
    - Laser-target power plant technology and Fort Collins infrastructure
    - Silicon-target and fast-ignitor laser strategy
    - Funding definitions vary and inertial economics remain unproven
  - - Focused Energy
    - Laser inertial / German-U.S. peer
    - $240M Series A plus grants per TechCrunch
    - First laser at Biblis, pilot plant path in 2030s
    - NIF-ignition lineage and RWE site access
    - Requires high-repetition target manufacturing and laser economics
  - - Gauss Fusion
    - European magnetic-confinement consortium / stellarator-adjacent
    - BMBF-backed €10M tritium-breeding funding noted by company
    - Industrial consortium for European fusion plants
    - Consortium access to industrial partners across Germany, France, Italy, Spain
    - Less transparent private funding and device-specific milestone detail
  - - Renaissance Fusion
    - Stellarator / direct European peer
    - Funding not consistently disclosed in retained sources
    - HTS coil deposition, liquid-metal shields, grid-oriented stellarator
    - Simplifies stellarator engineering with direct-deposited HTS coils
    - Public evidence on capital scale and pilot timing is thinner than Proxima
  - - Xcimer
    - Laser inertial / U.S. peer
    - '>$100M class per TechCrunch list context; official roadmap emphasizes Phoenix'
    - 10-MJ-class laser-fusion roadmap
    - Large excimer-laser architecture linked to validated NIF physics
    - Capital and repetition-rate economics still uncertain
  - - Pacific Fusion
    - Pulsed magnetic inertial / U.S. peer
    - Series A over $1B paid by milestones per TechCrunch
    - Pulsed-power inertial system using synchronized Marx generators
    - Large staged capital commitment and Eric Lander-led team
    - Milestone-tranched financing and extreme pulsed-power timing risk
  notes: Funding values are public-source snapshots as of the 2026 run date and mix total funding, round size, and
    valuation where those are the disclosed metrics.
