  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Erebor 的优势和风险都从监管开始。该银行已经拿到真实的牌照与保险里程碑，但批准附带硬约束：资本要求、启动期限、商业计划限制，以及管理层变更的直接监督。在这些内生约束之外，Erebor
              的获批已经进入政治视野。Senate Banking Committee 批评了审批流程和治理姿态，外部行业组织也讨论过起诉 OCC 更广泛的 fintech 与 crypto 发牌路径。这意味着 Erebor
              不只是一个在监管下建设的 startup，它也成了联邦银行监管者应否把边界向科技和数字资产参与者打开的公共符号。政治风向、法院结果或监管机构领导层一旦变化，Erebor 受到的冲击可能比更传统的 de novo
              bank 更大。数字资产立法和监管指引同样如此：即便 Erebor 可以继续推进，stablecoin、托管和代币化证券的规则仍在厘清。
