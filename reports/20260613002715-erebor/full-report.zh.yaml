            title: SAM 不透明是重要尽调缺口
            body: >-
              尚无已发布市场研究把创新经济银行子细分（风险投资支持创业公司、加密公司、国防科技承包商、AI 实验室）从更广义的美国 neobanking 或 SMB 商业银行市场中拆出。本章 $50–80B 的 SAM
              估算，是基于 Mercury $20B 存款代理指标和历史 VC 部署规模作出的编辑性推断。若未委托一手研究，按行业垂直和客户生命周期阶段拆分可服务钱包，投资人不应依赖这些估算。
