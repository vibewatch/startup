        title: 单位经济代理指标与存款经济性
        blocks:
          - type: paragraph
            body: >-
              Erebor 仍处于收入前阶段，公开单位经济只能从可比对象三角测算。Mercury 是最强代理，因为它在 SVB 之后五天吸收了 $2B
              新存款，并已扩张到大型公开代理指标。这既证明了集中创业公司存款的上行空间，也说明资金管理信任的重要性。SVB
              复盘补上了警示的另一半：聚焦创业公司的银行业务可以有吸引力，但如果资产负债管理失手，同一存款基础也会变得相关且不稳定。对 Erebor
              来说，上行情景是每个客户的存款密度高；下行情景是在风险控制被证明之前，重建生态系统集中度。[CI008] [CI015] [CI016] [CI017] [CI018] [CI019] [CI021]
