      - number: '8.3'
        title: 牛市、基准与熊市情景
        blocks:
          - type: paragraph
            body: >-
              收入和存款数据仍是私有信息，情景只能围绕里程碑，而不是精确表格。牛市情景假设顺利上线、早期客户集中在有利
              cohort，并成功扩展到钱包份额更高的产品。基准情景假设银行上线并获得部分客户采用，但证明积累更慢、受监管约束时间更长，估值需要多年执行才能挣回来。熊市情景假设延迟、治理噪音或集中度担忧，让 Erebor
              无法脱离「有前景但不透明」的桶。在这种下行情景里，当前估值很难辩护。这种不确定性解释了为什么合适姿态不是强烈负面，而是有纪律地等待证据。
