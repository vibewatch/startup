              Erebor 之所以迅速获得强烈关注，领导层和支持方画像是最清楚的解释之一。Palmer Luckey 是创始层面的公开面孔，Joe Lonsdale 和 Peter Thiel 旗下 Founders Fund
              也被反复列为重要支持方。Business Insider 非洲版报道称，Luckey 创立了 Erebor，Jacob Hirshman 和 Owen Rapaport 被安排为联席 CEO，前 Valley
              National Bank CFO Mike Hagedorn 预计出任总裁。公开报道还点名了 Diogo Monica、Michael Mosier 等独立董事，但完整董事名单和股权结构表尚未公布。Joe
              Lonsdale 的 8VC 个人简介进一步说明了这项业务背后的网络效应：Lonsdale 是 Palantir 联合创始人，也是长期投向国防和企业技术的投资人，其投资组合取向与 Erebor
              的目标客户高度重合。这种重合强化了创始人—市场匹配，但也带来集中度和治理问题，因为同一个网络同时供给客户、投资人和监管关系；审批进度异常快时，外界容易感知到偏袒风险。
