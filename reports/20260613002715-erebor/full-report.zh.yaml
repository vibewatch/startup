        title: 资本充足率与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Erebor 周围的硬财务事实是融资和资本监管，而不是运营表现。公开报道从 2025 年 7 月约 $2B 估值、目标融资约 $225M，推进到 2025 年 12 月约 $350M、估值 $4.35B
              的一轮融资。同时，FDIC 要求前三年一级杠杆率为 12%，并给 Erebor 12 个月设立银行。这一组合让 Erebor
              作为启动前公司异常资本密集：股本既要覆盖搭建期烧钱，又要充当监管资本，而且没有经营现金流补充。2026 年 2 月牌照里程碑提高了特许经营价值，但没有消除启动执行风险。[CI022] [CI023]
