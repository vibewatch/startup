              或财务负责人；相邻用户则包括 controller、运营人员和希望获得信贷与资金管理支持的关系客户。这个细分比一般小企业银行更窄、更富，但也更集中、更受声誉影响。实际来看，Erebor
              试图成为创新经济客户的主金融枢纽；这些客户更关心现金管理、支付、专项信贷和监管舒适度，而不是通用网点覆盖。这一焦点也意味着，如果银行成功开业，少数具有标杆意义的客户胜利可能会对品牌形成产生不成比例的影响。
