    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、市场角色与公开足迹
        blocks:
          - type: paragraph
            body: >-
              Erebor 是一个总部位于俄亥俄州 Columbus 的新设全国性银行项目，2025 年浮出水面时，明确承诺填补 Silicon Valley Bank 2023 年 3
              月倒闭后留下的部分真空。公开报道和监管披露对这家银行的描述基本一致：它瞄准创新经济，服务科技、支付系统、投资、国防、人工智能、制造和虚拟货币参与者。这些客户要么觉得传统银行服务不足，要么希望贷款方更愿意接纳靠近数字资产的商业模式。对一家几个月内估值冲到数十亿美元的公司来说，公开记录异常稀薄，但现有文件在三个方向上相互印证：Erebor
              不是纯软件层，而是在推进联邦特许银行；它为风险承受度更高的创业公司和前沿科技客户而设计；稳定币和数字资产能力是差异化的一部分，而不是附带产品。官方网页足迹仍很稀疏，这本身就是一个重要尽调事实，因为它限制了外部对产品广度、客户开户细节和启动状态的验证。
