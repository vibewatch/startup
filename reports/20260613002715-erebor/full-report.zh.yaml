      - number: '2.4'
        title: 增长驱动因素与结构性市场顺风
        blocks:
          - type: paragraph
            body: >-
              四个结构性驱动因素支撑了 Erebor 这类创新经济创业银行的有利市场前景。第一，SVB 倒闭永久打乱了创业银行的传统模式：SVB
              的失败抹去了风险投资支持创业公司存款的集中承载点，也持续催生了对多元化、资本充足替代方案的需求。SVB 失败后五天内，Mercury 吸收了 $2B
              新存款，既说明了迁移需求的规模，也说明了可信替代方能多快聚拢需求。第二，2022–2023 年低迷后，2024–2025 年风险投资反弹，扩大了需要银行服务的已融资创业公司群体。第三，Trump 政府在
              2025–2026 年对加密友好的监管姿态，让 OCC 更愿意发放包含数字资产业务的银行牌照；PYMNTS 对 OCC 给 Erebor
              附条件批准的报道，也把它解读为对数字资产业务开放的信号。第四，neobank 内部采用 AI 正在拉开数字原生银行与传统银行之间的质量差距：预计到 2025 年，70% 的 neobank 将使用 AI
              驱动的预测分析，改善欺诈检测、信贷承销和现金流预测。北美整体 neobanking 收入预计到 2026 年以 34.6% CAGR 增长，为所有地区最高，动力来自熟悉技术的创始人和 SME
              采用更先进的银行平台。
