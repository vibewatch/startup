  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、细分定义与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Erebor 位于三个部分重叠的市场交叉点：美国创业公司和创新经济商业银行、涵盖加密 / 数字资产的银行服务，以及面向国防和前沿技术公司的新设全国性特许银行。FDIC
              的存款保险批准明确把技术、支付系统、投资、国防和虚拟货币市场参与者列为目标客户。主要现状替代方案是大型传统商业银行——JPMorgan Chase、Bank of America 和 Wells
              Fargo——它们合计服务了美国 3000 万中小企业中的压倒性多数。科技创业公司的次级替代方案，是以 Mercury（Choice Financial Group 和 Column N.A.）及 Brex
              为代表的合作银行 neobank 模式。SVB 在 2023 年 3 月倒闭前，一直是风险投资支持创业公司的主导性主银行服务商。Erebor 近期范围之外的业务包括消费者银行、传统住房抵押贷款、传统零售 SMB
              银行，以及成熟大型企业的机构资金管理。国防和 AI 子细分是创业银行中的高溢价层：双用途技术客户需要更高的监管能力和 AML/BSA 合规能力，标准 SMB neobank 难以满足。Erebor
              的全国性银行牌照是关键结构性差异：银行可以直接接入 Federal Reserve 支付基础设施，而不必依赖合作银行中介。这提高了资本要求，但去掉了一层关键交易对手风险；2025 年 Evolve Bank
              同意令扰动期间，这层风险曾让 Mercury 客户受到冲击。
