      - number: '7.2'
        title: 运营、质量与合规风险
        blocks:
          - type: paragraph
            body: >-
              运营上，Erebor 要切入商业银行里最难的一角：客户集中、节奏快、渠道数字化，还带有一定 crypto 邻近性。FinCEN 和 Treasury 义务让 AML、制裁和可疑活动控制没有讨价还价空间。FDIC
              要求银行在失败场景下能处理存款账户，说明监管者在开业前就很重视运营管线。但公司还没有披露现代 startup-bank 买家常看的状态、信任、隐私或 API 控制信息。同行和基础设施提供商会公开权限模型、SDK
              或产品文档；Erebor 对外仍不透明。不透明不等于控制薄弱，但外部资本目前无法靠公开证据验证韧性、供应商治理或事故纪律。放在数字资产语境里，合规负担不是静态的；随着机构细化托管、stablecoin
              和资本处理预期，负担还可能扩大。
