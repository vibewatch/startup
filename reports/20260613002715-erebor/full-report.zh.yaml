  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义
        blocks:
          - type: paragraph
            body: >-
              相比公司自己在开放网页上展示了什么，监管机构说 Erebor 将服务谁，更能确定它的产品定义。FDIC、Reuters 和后续行业报道都指向同一个核心待办任务：为 SVB
              失败后觉得服务不足的风险投资支持公司和前沿技术企业，以及围绕这些网络的创始人、投资人和高净值个人，提供存款账户、支付和贷款能力。这让 Erebor 更接近一家行业专门型商业银行，而不是单一功能
              neobank。悬而未决的是打包方式。公司自有公开域名目前没有可访问的开户流程、定价页、功能矩阵或文档库，因此最站得住脚的判断是：Erebor
              是一个创业公司原生银行主张，其客户工作流由监管机构和媒体阐明，而不是由可启动的公开产品界面阐明。市场清晰但产品不透明，这种不对称是尽调核心，因为客户能理解承诺，但投资人仍无法验证完整服务设计。今天如此。公开层面如此。
