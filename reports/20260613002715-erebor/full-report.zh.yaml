              Erebor 目前还没有可观察收入基础，但其牌照措辞和目标客户指向传统银行经济模型，而不是软件优先的 fintech 模型。OCC /
              媒体把它描述为面向科技公司、超高净值虚拟货币用户的全服务受保存款全国性银行；FDIC 又聚焦技术、支付系统、投资、国防和虚拟货币市场参与者。这些都指向吸收存款、部署贷款和证券，以及通过关系费用变现。不同于合作银行
              fintech，直接全国性银行理论上可以保留完整银行利差，但 Erebor 尚未披露任何实时 NIM、信贷收益率、收费表或存款承诺。野心显然是成为 SVB
