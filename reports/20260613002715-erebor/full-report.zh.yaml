      - number: '2.5'
        title: 采用约束、监管动态与反向市场风险
        blocks:
          - type: paragraph
            body: >-
              即便结构性顺风有利，Erebor 仍面临四项重要采用约束和反向市场风险。第一，创业银行收入对利率周期高度敏感：Mercury 的收入增速在 2025 年秋季 Federal Reserve 降息后，从 2024
              年同比 97% 压缩到 2025 年约 41%，说明重存款收入模式结构性暴露于政策利率变动，Erebor 也会承受同样风险。第二，更广义的 neobank 市场存在盈利问题：截至 2023 年，全球 80% 的
              neobank 仍未盈利，预计到 2025 年仅 15% 能实现盈利。扩张一家新设特许银行比合作银行模式承担更高监管资本负担，意味着 Erebor 通往盈利的路径可能比 Mercury 或 Brex
              更长、资本消耗更大。第三，创业银行客户本身具有周期性：风险投资收缩时，存款余额下降，核销率上升。Federal Reserve 对 SVB 的复盘准确记录了这一动态：当 VC 情绪转向，SVB
              未保险存款集中度随之崩塌。第四，传统银行——JPMorgan Chase、Bank of America、Wells Fargo——已经用加速数字 SMB 投资回应 neobank 压力；Newsweek 和
              Elizabeth Warren 对 Erebor 监管批准的报道，也标记了这家银行与政治知名投资人关联所带来的可信政治和声誉风险。Erebor 前三年 12%
              的一级杠杆率要求，也进一步约束了银行激进扩张贷款账簿的能力。
