      - number: '7.3'
        title: 合作方、集中度与模式风险
        blocks:
          - type: paragraph
            body: >-
              核心商业模式风险在于，Erebor
              最有吸引力的客户画像也可能让它变得脆弱。Crypto、AI、防务以及创始人关联的高净值客户，可能带来更大余额、更强网络，也更愿意购买专项产品。但这些客户的情绪、融资周期和政策暴露也可能高度相关。SVB
              复盘给出的类别提醒最清楚：创新经济银行业务如果流动性和治理纪律跟不上野心，就会出问题。客户集中之外，还有合作方依赖：支付 rails、数据连接和潜在基础设施供应商都必不可少，但披露很少。如果 Erebor
              在第三方监督上投入不足，或在控制系统成熟前扩大产品范围，集中度风险、执行风险和监管风险就会彼此强化。因此风险清单不是固定的；服务这些行业的银行，可能一边证明商业契合度，一边吸收新的控制和报告义务。
            claimRefs:
              - CR008
              - CR009
