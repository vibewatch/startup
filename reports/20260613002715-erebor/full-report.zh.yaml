      - number: '8.2'
        title: 正面论点与反面论点
        blocks:
          - type: paragraph
            body: >-
              多头论点在概念上很强。Erebor 瞄准的是 SVB 之后真实存在的缺口：一家有牌照、有保险、专为 startups 和 frontier-tech
              客户设计的银行；这些客户可能更看重行业理解、关系深度和专项信贷，而不是普通网点银行。如果这家银行能拿下主运营账户，就可能继续扩到 treasury、支付和贷款。反面论点同样强。Erebor
              的估值已经隐含了相当程度的未来成功，但公开记录缺少客户证明、产品透明度和财务披露。因此问题不是市场需求是否存在，而是公司证明执行之前，投资者是否应支付接近已验证同行的价格。按今天的证据，答案是否定的。
            claimRefs:
              - CV002
              - CV003
              - CV016
              - CV017
              - CV022
              - CV038
              - CV039
