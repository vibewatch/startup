      - number: '3.5'
        title: 护城河耐久性、反向证据与潜在进入者
        blocks:
          - type: paragraph
            body: >-
              Mercury 的 18 个月先发优势——$20B 存款、200K 企业账户和深嵌 VC 推荐网络——是 Erebor 最耐久的竞争障碍。分发护城河难以快速复制，因为它建立在 YC
              和加速器校友网络的自然信任上，而不是付费获客。Newsweek 把 Erebor 快速牌照批准与支持 Trump 的亿万富豪捐赠者联系起来，制造了具体声誉风险：政治温和的创业公司创始人，包括许多 YC
              校友，可能更偏好 Mercury 的政治中性品牌。Mercury 在 Trustpilot 上的反向客户评价显示，有账户关闭投诉和电汇延迟，这是服务质量缺口信号；如果 Erebor
              启动执行到位，可以利用这一点。Brex 关于账户暂停的反向 Trustpilot 数据，进一步强化了所有 neobank 的广义信任脆弱性。Ramp 的支出管理定位在结构上与 Erebor
              的银行主张互补，带来有利的多产品捆绑机会，而不是正面对抗威胁。Stripe Treasury 和 Rippling
              是最可信的潜在进入者：两者都有庞大的嵌入式创业客户基础和基础设施，不必拿自己的牌照也能推出准银行产品。Stripe Treasury 已经向第三方平台提供
              banking-as-a-service，通过间接路径压缩基于牌照的护城河。Coindesk 报道称，OCC 2025 年 1 月指引明确允许全国性银行从事加密托管和稳定币活动，这意味着 Erebor
              包含加密的银行服务不再是独特监管优势——任何全国性银行在获得 OCC 批准后都可以开展这些活动，Mercury 牌照申请若成功也包括在内。创业银行产品的商品化风险是真实的：零费用支票账户、API 访问和 FDIC
              受保存款，已经成为多家服务商的入场配置。
