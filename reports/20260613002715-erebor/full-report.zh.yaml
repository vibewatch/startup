      - number: '2.3'
        title: 买方与客户细分
        blocks:
          - type: paragraph
            body: >-
              Erebor 的目标买方横跨创新经济中的五个可区分细分，每个细分的预算负责人、采用触发点和预期存款余额都不同。风险投资支持的科技创业公司——从种子轮到 Series C——是核心滩头阵地，预算负责人通常是 CEO
              或 CFO，他们在同一银行关系中管理资金、工资和 venture debt。加密和数字资产公司构成第二类清晰买方：它们需要稳定币轨道、虚拟货币托管或集成，以及愿意处理代币发行和交易所相关 AML/BSA
              复杂性的银行伙伴。国防和双用途技术公司——FDIC 对 Erebor 批准中最明确点出的细分——需要一家联邦特许银行，能在标准企业银行服务之外处理 ITAR
              和出口管制合规。超高净值科技创始人和早期员工构成第四个细分，他们愿意为与自身职业网络一致的银行里的准私人银行服务支付溢价。AI
              研究实验室和模型公司是正在出现的第五个细分，特征是算力成本支出迅速上升、需要大量信贷额度，并有兴趣用稳定币结算国际算力供应商付款。所有细分的切换触发点都集中在公司设立事件、被迫迁移（SVB/Evolve
              扰动）、投资人网络推荐，以及传统银行或标准 neobank 无法提供的数字资产能力差异化。
