      - number: '2.2'
        title: TAM、SAM 与市场规模测算——多重视角
        blocks:
          - type: paragraph
            body: >-
              多家独立研究机构发布了 neobanking 和数字银行市场估算，尽管方法差异很大，结论都指向高增长轨迹。Grand View Research 估计，2025 年全球 neobanking 市场规模为
              $211.2B，按 61.9% CAGR 增长，到 2033 年达到 $9,384.73B；增长由商业账户主导（2025 年收入占比 64.71%）和企业采用推动。Markets and Data
              给出了美国视角：2024 年为 $34.56B，到 2032 年增至 $263.67B，CAGR 为 27.31%。Cheqly 认为美国 neobank 市场 2022 年约为 $15.64B，并预测 2023
              至 2030 年 CAGR 为 52.2%，到 2030 年达到 $451.45B。Awisee 报告称，2025 年全球 neobank 用户为 350
              million，并预计同年美国仅使用数字银行账户的持有人为 53.7 million。这些估算都没有拆出 Erebor 具体瞄准的创新经济银行子细分——风险投资支持创业公司、加密公司、AI
              实验室、国防承包商。作为粗略的 SOM 代理，Mercury 截至 2025 年 9 月的 $20B 存款和 $650M
              年化收入表明，即便一个中腰部玩家只服务可服务创业银行钱包的一小部分，也能达到有意义的规模。若把美国风险投资活动中的创业公司和国防科技占比套到商业银行总 TAM 上，美国创新经济银行市场的保守总 SAM 约为每年
              $50B 至 $80B 的存款与信贷钱包。尚无权威发布方拆分这个子 TAM，这仍是一个重要证据缺口。
