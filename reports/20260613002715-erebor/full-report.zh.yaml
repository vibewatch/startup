  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前融资与估值背景
        blocks:
          - type: paragraph
            body: >-
              Erebor 最新公开融资背景，标题数字很亮眼，承销细节却很薄。多家媒体称，公司在 2025 年 12 月达到约 $4.35 billion 估值，此前 2025 年 7 月的募资目标约 $2
              billion。公开证据也支持牌照和 FDIC 里程碑，这些很可能推动了估值上台阶。但公开证据没有同样支持客户、存款、收入或产品深度的上台阶。这一点重要，因为估值已经不再抽象；它现在接近一些成熟得多的
              startup-banking 或 digital-finance
              公司。换句话说，投资者被要求为一家监管路径可见、商业牵引力仍主要私有的银行，支付成熟可比公司价值的相当一部分。实际含义是，投资者在能给运营定价之前，已经先给战略定价。
            claimRefs:
              - CV004
              - CV005
              - CV014
              - CV015
              - CV030
