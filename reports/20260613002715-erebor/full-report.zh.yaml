              和国防客户可能带来大额余额和高钱包份额，但也可能成群移动，并对情绪、政策或行业压力快速反应。参议院的反向评论进一步提醒投资人，不要把行业亲和力误认为客户多元化。如果 Erebor
              的首批客户聚集在支持这家银行的同一批创始人和 VC 网络周围，获客可能很高效，但存款稳定性、信贷相关性和声誉外溢都会更脆弱。从尽调角度看，银行不仅要证明能吸引正确
