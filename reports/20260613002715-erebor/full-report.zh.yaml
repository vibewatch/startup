      - number: '7.4'
        title: 人员、执行与否决标准
        blocks:
          - type: paragraph
            body: >-
              Senate
              的负面评论让人员风险格外重要。如果管理层深度、风险领导力或董事会监督弱于宣传，即便资本充足、形式批准到位，也未必能保住执行。投资者应盯住三类否决标准。第一是启动节奏：如果银行在设立时钟下消耗大量时间，却拿不出可信的公开上线、客户或产品证据，就是负面信号。第二是审慎监管滑坡：资本缓冲、well-capitalized
              状态或意外监管异议一旦出问题，都应视为威胁投资论点。第三是治理不稳定：核心风险或运营岗位继续流失，或围绕重大商业计划变更出现正式 non-objection
              冲突，都说明牌照叙事跑在运营机构前面。一家同时启动并适应政策变化的银行，比典型 fintech app 更少有管理犯错空间。这种不对称很关键。
