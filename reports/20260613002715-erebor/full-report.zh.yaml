      - number: '8.4'
        title: 可比估值基准
        blocks:
          - type: paragraph
            body: >-
              最有用的可比组需要混合来看。Mercury 是最相关的私有基准，因为它直接服务 startups，并且现在披露了密集证据包——客户、收入、盈利能力和产品路线图——估值 $5.2
              billion。Chime、SoFi、Nubank 和 LendingClub 没有那么直接，但它们说明，当指标可见后，公开市场如何奖惩 fintech-bank hybrids。Ramp
              不是银行，但它证明了软件驱动金融在增长和自由现金流无可否认时能拿到怎样的定价。在这条光谱上，Erebor 突出的不是估值明显不可能，而是在给出多数可比公司已经拥有或被迫发布的证据包之前，就已经达到大额估值。
