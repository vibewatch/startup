        blocks:
          - type: paragraph
            body: >-
              Erebor 的竞争横跨三个结构不同的层级。第一层也是最关键的一层，是直接 neobank 层：Mercury、Brex、Ramp、Arc 和 Novo 都已切出创业公司和 SMB 银行利基，合计持有超过
              300,000 个企业账户。Mercury 是主导玩家，年化收入 $650M、存款超过 $20B、企业账户超过 200,000 个，是 Erebor
              在风险投资支持创业公司细分中最直接的竞争对手。Brex（$700M ARR）和 Ramp（$1B+ ARR）的收入规模更大，但战略位置不同——Brex 来自企业卡和费用管理，Ramp
              来自支出自动化——因此它们是相邻竞争者，而不是 Erebor 全服务特许模式的直接银行替代品。第二层是传统商业银行层：JPMorgan Chase、Bank of America 和 Wells Fargo
              按美元金额合计持有多数创业公司存款，也是事实上的现状替代方案。第三层是潜在进入者：Stripe Treasury 和 Rippling 都有庞大的嵌入式创业客户基础，也具备推出准银行产品的基础设施。Erebor
              于 2026 年初获得的 OCC 全国性银行牌照，为其相对所有合作银行 neobank 形成监管护城河，但 Mercury 2025 年 12 月也提交了 OCC 牌照申请，说明这项优势可能只是暂时的。
