      - number: '3.2'
        title: 直接 fintech 竞争对手画像
        blocks:
          - type: paragraph
            body: >-
              Mercury 是 Erebor 的标杆竞争对手，已经吸收了 SVB 外溢创业银行市场的相当份额。Mercury 在没有全国性银行牌照的情况下，实现了 $20B 存款和 $650M
              ARR，监管基础设施依赖合作银行 Choice Financial Group 和 Column N.A.。Federal Reserve 降息压缩净息差后，收入增速从 2024 年同比 97% 放缓到 2025
              年约 41%；Erebor 也会面对同样动态。Mercury 于 2025 年 12 月提交 OCC 全国性银行牌照申请，这是对 Erebor 结构性差异化最直接的竞争威胁。Mercury 的 Treasury
              产品为 $500K 以上余额提供最高 4.39% 年化净收益率，直接竞争 Erebor 可能推出的资金收益产品。Brex 截至 2025 年 8 月年化收入约 $700M，但自 2022
              年以来战略上转向中型市场和企业客户，明确降低了与 Erebor 早期创业公司核心客群的重叠。Brex 对多数账户要求有风险投资或机构投资人支持，这在结构上过滤掉了 Erebor 瞄准的自举型和 pre-seed
              细分。Ramp 到 2025 年 11 月年化收入超过 $1B，企业客户超过 50,000 家，年化支付额 $100B。Ramp 不提供 FDIC
              受保存款，也不是特许银行；它是一个与银行服务商搭配的支出管理平台，因此大体上是 Erebor 的互补产品，而非直接替代。Arc 面向风险投资支持公司，提供创业公司资金管理和银行服务，包括高收益资金账户和
              venture debt 产品。Novo 以移动优先支票账户和 Mastercard 借记卡服务微型 SMB 和个体创业者，瞄准的细分风险更低，也不如 Erebor 的国防和 AI 焦点那么包容加密。
