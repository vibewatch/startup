      - number: '8.5'
        title: 建议、信心与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              建议姿态是继续研究，信心低、风险高、估值偏贵。这不是否定机会，而是对时点和证据质量的判断。Erebor
              可能成长为创新经济里一家具备独特价值的银行，但当前公开记录不足以让投资者像未来已经去风险一样为它付款。投资者在提高确信度之前，应要求一小组证据点：上线产品演示、可背调客户、细分集中度数据、承销政策、存款行为假设和管理层深度。如果这些检查很强，Erebor
              仍可能长进当前估值。如果检查薄弱，今天的价格几乎不给叙事错误留余地。在证据出现之前，审慎应压过兴奋。
