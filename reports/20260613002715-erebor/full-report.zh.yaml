      - number: '3.4'
        title: 切换成本、多银行并用、信任与监管姿态
        blocks:
          - type: paragraph
            body: >-
              创业银行的切换成本结构上低于消费者银行，因为账户有 FDIC 保险（消除了交易对手集中风险）、银行 API 标准化，而且很多创始人同时维持多家银行关系。Mercury 通过 Y Combinator 和 VC
              加速器网络获得的自然分发，是这个细分里最接近切换成本护城河的东西：创始人在 YC 入营时开通 Mercury 账户，除非遭遇账户关闭或监管扰动，通常很少切换。Evolve Bank & Trust 的 2024
              年同意令扰乱了 Mercury 客户，也证明合作银行模式存在潜在监管传染风险；Erebor 的新设牌照模式在结构上避开了这个风险。Mercury 随后转向 Column N.A.
              作为主要合作银行，说明合作银行模式也把切换依赖强加给 Mercury 自身。反向监管侧，Elizabeth Warren 参议员 2026 年 2 月致 OCC 信函称，Erebor
              快速牌照批准可能与其政治关联投资人存在利益冲突；这对政治温和的创业公司创始人形成重要声誉信号，他们可能更偏好 Mercury 或 Brex 的政治中性定位。Erebor 前三年 12% 的一级杠杆率要求由
              FDIC 施加，资本消耗明显高于 Mercury 的合作银行模式，后者由合作方持有监管资本。这项资本负担限制 Erebor 在启动阶段高效部署股本资本，也相对把监管资本要求外包给合作机构的 neobank
              同行形成结构性成本劣势。
