              beta、功能发布节奏或客户支持界面。由此出现了分裂图景。一方面，监管机构已经验证了银行开业的法律路径，并对资本、业务计划变更和启动时间设下明确控制；这比典型创业公司的等待名单页面更有实质。另一方面，潜在客户无法独立检查可用性历史、事故沟通、开户
