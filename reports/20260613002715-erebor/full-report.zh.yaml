      - number: '3.3'
        title: 传统银行、现状方案与内部自建
        blocks:
          - type: paragraph
            body: >-
              JPMorgan Chase 是最强大的长期传统竞争对手。它是美国资产规模最大的商业银行，2025 年在 J.D. Power 小企业数字银行排名第一，并大幅投资数字 SMB 工具。其 Business
              Complete Banking 账户每月起价 $15（平均每日余额 $2,000 可免），并收取标准国内电汇费，相对零费用 neobank 形成结构性成本劣势。不过，对寻求大规模 venture debt
              或信贷关系的创业公司来说，Chase 的品牌信任、信贷额度和线下网点网络是真实竞争优势。SVB 2023 年 3 月倒闭永久打乱了传统创业银行模式：SVB
              曾是风险投资支持创业公司的主导主银行服务商，失败后留下结构性空位，Mercury、Brex 和 Erebor 都在争夺填补这个位置。许多创业公司的现状替代方案是多银行并用：在前五大商业银行维持主银行关系，同时用
              Mercury 或 Brex 获得运营账户便利。这种多银行模式意味着 Erebor 并不总是在竞争替代 Mercury；它可能是在竞争替代双银行关系中的一条腿。对存款超过约 $50M
              的创业公司来说，自建内部资金管理功能在理论上可以替代外部银行，但运营复杂度和合规负担让它对多数 Erebor 目标客户并不划算。
