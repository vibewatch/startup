    summary: 相比任何公开可见的软件差异点，产品更依赖受监管基础设施和合规系统。
    data:
      nodes:
        - id: regulators
          label: OCC / FDIC
        - id: aml
          label: AML / FinCEN 控制
        - id: rails
          label: Fed 和支付轨道
        - id: integrations
          label: API / 合作伙伴集成
        - id: customers
          label: 初创公司客户
      edges:
        - from: regulators
          to: customers
          label: 牌照和保险合法性
        - from: aml
          to: customers
          label: 账户审批和监控
        - from: rails
          to: customers
          label: 交易和资金流动
        - from: integrations
          to: customers
          label: 工作流匹配
        - from: regulators
          to: rails
          label: 运营约束
    claimRefs:
      - CE018
      - CE023
      - CE026
      - CE032
  - id: FE004
    title: 产品成熟度 / 能力图
    type: matrix
    summary: 公开可观察的成熟度最高在监管状态，最低在外露软件能力。
    data:
      columns:
        - 公开成熟度
        - 客户可见度
        - 技术可见度
      rows:
        - label: 牌照和保险路径
          values:
            - 高
            - 中
            - 中
        - label: 存款和放贷范围
          values:
            - 中
            - 低
            - 低
        - label: 开发者和集成工具
          values:
            - 低
            - 低
            - 低
        - label: 信任中心和支持透明度
          values:
            - 低
            - 低
            - 低
        - label: 路线图可见度
          values:
            - 中
            - 低
            - 低
    claimRefs:
      - CE021
      - CE022
      - CE033
      - CE034
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 胜出的初创银行旅程始于信任和开户，随后延展到财资、支付和信贷工作流。
    data:
      nodes:
        - id: discover
          label: 发现适配行业的银行
        - id: onboard
          label: 开立运营账户
        - id: operate
          label: 运行薪资、ACH、电汇、AP
        - id: expand
          label: 增加财资、公司卡、放贷
        - id: retain
          label: 因工作流深度和信任而留存
    claimRefs:
      - CU001
      - CU014
      - CU018
      - CU029
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    summary: Erebor 的漏斗顶部目标客群可见，但漏斗底部仍缺少公开证明。
    data:
      items:
        - label: 公开点名的可服务目标客群
          value: 5
        - label: 已获得监管批准
          value: 3
        - label: 找到的公开 Erebor 客户具名引用
          value: 0
        - label: 找到的公开留存指标
          value: 0
    claimRefs:
      - CU001
      - CU005
      - CU006
      - CU030
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    summary: 公开证明质量在品类类比上较高，在 Erebor 具体采用上较低。
    data:
      columns:
        - 具名证明质量
        - 结果具体度
        - 留存可见度
        - 与 Erebor 的直接相关性
      rows:
        - label: Erebor
          values:
            - 低
            - 低
            - 低
            - 高
        - label: Mercury / Sazabi
          values:
            - 高
            - 中
            - 低
            - 中
        - label: Mercury / Rise
          values:
            - 高
            - 中
            - 低
            - 中
        - label: Mercury / Attivo
          values:
            - 高
            - 中
            - 低
            - 中
        - label: Brex
          values:
            - 中
            - 中
            - 低
            - 中
    claimRefs:
      - CU006
      - CU008
      - CU010
      - CU012
      - CU017
      - CU035
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: Erebor 最实质的公开风险集中在上线前不透明、客户集中和监管交汇处。
    data:
      columns:
        - 发生概率
        - 影响
        - 缓释成熟度
      rows:
        - label: 上线延迟
          values:
            - 中
            - 高
            - 低
        - label: 资本 / 杠杆压力
          values:
            - 中
            - 高
            - 中
        - label: 客户集中
          values:
            - 高
            - 高
            - 低
        - label: AML / 制裁失效
          values:
            - 中
            - 高
            - 中
        - label: 透明度 / 运营缺口
          values:
            - 高
            - 中
            - 低
    claimRefs:
      - CR001
      - CR011
      - CR018
      - CR030
      - CR031
  - id: FR002
    title: 风险传导图
    type: dag
    summary: 几项头部风险会同时通过信心、流动性和采用传导。
    data:
      nodes:
        - id: concentration
          label: 集中的客户
        - id: confidence
          label: 信心冲击
        - id: liquidity
          label: 流动性压力
        - id: adoption
          label: 采用放缓
        - id: valuation
          label: 估值下行
      edges:
        - from: concentration
          to: confidence
          label: 相关情绪
        - from: confidence
          to: liquidity
          label: 存款迁移
        - from: liquidity
          to: valuation
          label: 业务压力
        - from: confidence
          to: adoption
          label: 采购犹豫
        - from: adoption
          to: valuation
          label: 增长和证明降低
    claimRefs:
      - CR033
      - CR034
      - CR037
  - id: FR003
    title: 依赖图
    type: dag
    summary: 监管机构和基础设施伙伴位于上线与客户信任的上游。
    data:
      nodes:
        - id: occ
          label: OCC / FDIC
        - id: vendors
          label: 基础设施 / 供应商
        - id: controls
          label: 合规控制
        - id: product
          label: 银行产品
        - id: customers
          label: 客户
      edges:
        - from: occ
          to: product
          label: 批准和条件
        - from: vendors
          to: product
          label: 运营赋能
        - from: controls
          to: product
          label: 安全运营
        - from: product
          to: customers
          label: 服务交付
        - from: occ
          to: customers
          label: 信任和合法性
    claimRefs:
      - CR015
      - CR016
      - CR023
      - CR032
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 建议来自一条简单链条：机会真实、批准也真实，但在高估值下，公开证明仍偏弱。
    data:
      nodes:
        - id: gap
          label: 后 SVB 市场缺口
        - id: approvals
          label: 牌照 + FDIC 进展
        - id: proof
          label: 有限的公开牵引力证明
        - id: price
          label: $4.35B 私募估值
        - id: call
          label: 继续研究
      edges:
        - from: gap
          to: approvals
          label: 支撑机会
        - from: approvals
          to: price
          label: 推动重新定价
        - from: proof
          to: call
          label: 阻碍高确信度
        - from: price
          to: call
          label: 要求更强证据
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV030
  - id: FV002
    title: 估值敏感性
    type: bar
    summary: Erebor 的隐含价值对证明里程碑最敏感，而不是对表格模型里的小幅调整敏感。
    data:
      items:
        - label: 干净上线 + 客户引用
          value: 3
        - label: 客户集中度已披露且可控
          value: 2
        - label: 承销政策已验证
          value: 2
        - label: 治理担忧未解
          value: -3
        - label: 上线延迟或资本压力
          value: -4
    claimRefs:
      - CV020
      - CV027
      - CV028
      - CV029
  - id: FV003
    title: 估值 / 回报区间
    type: range
    summary: 没有收入披露，区间只能基于里程碑，而不是精确数字。
    data:
      items:
        - label: 悲观
          low: 1.5
          high: 3
        - label: 基准
          low: 3
          high: 4.5
        - label: 乐观
          low: 4.5
          high: 7
    approximationNotes: 区间是以十亿美元计的方向性估值锚点，来自同业定位和情景质量，而不是 Erebor 已披露财务数据。
    claimRefs:
      - CV016
      - CV018
      - CV019
      - CV021
      - CV025
  - id: FV004
    title: 投资 KPI
    type: kpi
    summary: Erebor 在市场需求上得分较高，在公开证明质量上得分较低。
    data:
      items:
        - label: 市场缺口
          value: 8
        - label: 监管进展
          value: 8
        - label: 公开产品验证
          value: 3
        - label: 客户验证
          value: 2
        - label: 经济可见度
          value: 2
        - label: 治理可接受度
          value: 3
        - label: 估值吸引力
          value: 3
    approximationNotes: 当前公开证据只支持定性判断；这些分数是投委会式指标，按 0-10 分标尺呈现。
    claimRefs:
      - CV002
      - CV004
      - CV022
      - CV023
      - CV024
      - CV025
