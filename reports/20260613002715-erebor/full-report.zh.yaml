        title: 架构与运营模式
        blocks:
          - type: paragraph
            body: >-
              公开证据没有揭示 Erebor 的内部核心银行技术栈，但揭示了它必须达到的技术标准。现代创业银行竞争对手已经开放 API、开发者文档、基于 OAuth
              的集成和资金管理轨道，让创始人可以自动化账户数据、支付、资金管理和运营工作流。Mercury 的公开 API 和 CLI 界面、Plaid 的 Auth 流程、Stripe Treasury 的金融账户功能，以及
              Unit 的基础设施模式，共同勾勒出任何可信的软件赋能企业银行都应具备的运营架构：客户界面和开户、总账和账户系统、支付和卡轨道、合规和风险控制，以及用于数据共享和自动化的集成层。Erebor
              可能有类似内部能力，但尚未公开。这一缺席很重要，因为落地速度、合作伙伴集成深度和支持质量，是创业银行中的关键购买标准；客户尤其已经在使用资金管理、ERP、工资和 AP
              工具，这些工具都需要有清晰文档的连接。这也意味着实施风险过度集中在集成、权限和支持流程上，而同行会公开记录这些环节，Erebor 并没有。
