      - number: '1.3'
        title: 监管时间线、牌照状态与运营约束
        blocks:
          - type: paragraph
            body: >-
              Erebor 最具体的里程碑来自监管，而不是商业。Elizabeth Warren 参议员 2026 年 2 月信函引用的公开申请时间线显示，Erebor 于 2025 年 6 月 11 日向 OCC
              提交牌照申请。到 2025 年 10 月 15 日，OCC 已授予初步附条件批准；PYMNTS
              对该附条件批准函的摘要称，拟设银行被描述为一家全服务、受保存款的全国性银行，目标客户是使用虚拟货币的科技公司和超高净值个人。2025 年 12 月 16 日，FDIC 批准存款保险，并称 Erebor
              将聚焦技术、支付系统、投资和国防企业的存款与贷款产品，包括虚拟货币市场参与者。FDIC 同时设下硬约束：前三年一级杠杆率为 12%、失败处置处理协议，以及除非延期、否则 12
              个月内设立银行的最后期限。Reuters 2026 年 2 月 6 日报道还称，Erebor 成为第二届 Trump 政府期间首家获得全国性银行牌照的银行。这个里程碑值得注意，因为它表明 Erebor
              在不到八个月内，从有志于拿牌的申请方跨到了获得联邦批准的运营银行。
