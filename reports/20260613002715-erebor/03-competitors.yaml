company:
  name: Erebor
chapter:
  number: 3
  title: Competitors
  summary: >-
    Erebor enters a startup banking market dominated by Mercury ($650M ARR, $20B
    deposits), Brex ($700M ARR), and Ramp ($1B+ ARR), with incumbent banks and
    a status-quo multi-homing pattern providing structural headwinds. Erebor's
    national OCC bank charter is its primary structural differentiator over every
    neobank competitor—but Mercury's parallel OCC application, filed December 2025,
    could close that gap within one to two years. Adverse evidence spans a fast-tracked
    politically connected approval (Warren letter), charter-level capital burdens
    (12% tier-1 leverage ratio for three years), and zero verified customer traction,
    while competitive switching costs in startup banking are low and multi-homing
    with Ramp is widespread.
sections:
  - id: competitive-landscape
    title: Competitive Landscape and Tier Structure
    body: >-
      Erebor competes across three structurally distinct competitive tiers. The first
      and most consequential tier is the direct neobank layer: Mercury, Brex, Ramp,
      Arc, and Novo have each carved out startup and SMB banking niches and collectively
      hold more than 300,000 business accounts. Mercury is the dominant player, with
      $650 million in annualized revenue, over $20 billion in deposits, and more than
      200,000 business accounts, making it Erebor's most direct competition for the
      venture-backed startup segment. Brex ($700M ARR) and Ramp ($1B+ ARR) compete
      at larger revenue scale but from different strategic positions—Brex from corporate
      cards and expense management, Ramp from spend automation—meaning they are
      adjacent competitors rather than direct banking substitutes for Erebor's full-service
      charter model. The second tier is the incumbent commercial banking layer: JPMorgan
      Chase, Bank of America, and Wells Fargo collectively hold the majority of startup
      deposits by dollar volume and are the effective status-quo alternative. The third
      tier is likely entrants: Stripe Treasury and Rippling each have large embedded startup
      customer bases and the infrastructure to launch banking-adjacent products. Erebor's
      OCC national bank charter, received in early 2026, creates a regulatory moat over
      all partner-bank neobanks, but Mercury's parallel December 2025 OCC charter
      application signals this advantage may be temporary.
    claimRefs:
      - CP001
      - CP004
      - CP005
      - CP007
      - CP008
    tableRefs:
      - TP001
    figureRefs:
      - FP001

  - id: direct-fintech-competitors
    title: Direct Fintech Competitor Profiles
    body: >-
      Mercury is the benchmark competitor for Erebor, having absorbed a substantial
      share of the SVB-displaced startup banking market. Mercury's $20 billion in
      deposits and $650 million ARR were achieved without a national bank charter,
      relying on partner banks Choice Financial Group and Column N.A. for regulatory
      infrastructure. Revenue growth decelerated from 97% year-over-year in 2024 to
      approximately 41% in 2025 after Federal Reserve rate cuts compressed net interest
      margin—a dynamic Erebor will share. Mercury filed an OCC national bank charter
      application in December 2025, the most direct competitive threat to Erebor's
      structural differentiation. Mercury's Treasury product offers money-market fund
      yields up to 4.39% net annually for balances above $500K, competing directly
      with the treasury yield product Erebor would offer. Brex generated approximately
      $700 million in annualized revenue as of August 2025 but has strategically
      shifted toward mid-market and enterprise customers since 2022, explicitly reducing
      its competitive overlap with Erebor's early-stage startup core. Brex requires
      venture capital or institutional investor backing for most accounts, which
      structurally filters out the bootstrapped and pre-seed segment Erebor targets.
      Ramp surpassed $1 billion in annualized revenue by November 2025 with over
      50,000 business customers and $100 billion in annualized payment volume. Ramp does
      not offer FDIC-insured deposits and is not a chartered bank; it is a spend-management
      platform that pairs with a banking provider, making it largely complementary to
      Erebor rather than a direct substitute. Arc offers startup treasury management
      and banking services targeting venture-backed companies with high-yield treasury
      accounts and venture debt products. Novo serves micro-SMBs and solopreneurs
      with mobile-first checking accounts and Mastercard debit cards, targeting a
      lower-risk and less crypto-inclusive segment than Erebor's defense and AI focus.
    claimRefs:
