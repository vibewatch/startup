  - id: incumbent-banks-status-quo
    title: Incumbent Banks, Status Quo, and Internal Build
    body: >-
      JPMorgan Chase is the most formidable long-term incumbent competitor. It is the
      largest US commercial bank by assets, ranked number one in small business digital
      banking by J.D. Power in 2025, and has invested significantly in digital SMB
      tools. Its Business Complete Banking account starts at $15 per month (waivable
      with a $2,000 average daily balance) and charges standard domestic wire fees,
      creating a structural cost disadvantage relative to zero-fee neobanks. However,
      Chase's brand trust, credit facilities, and in-person branch network are genuine
      competitive strengths for startups seeking venture debt or credit relationships
      at scale. SVB's March 2023 collapse permanently disrupted the incumbent startup
      banking model: SVB had served as the dominant primary banking provider for
      venture-backed startups, and its failure created a structural vacancy that Mercury,
      Brex, and Erebor are each seeking to fill. The status-quo alternative for many
      startups is multi-homing: maintaining a primary banking relationship at a top-five
      commercial bank while using Mercury or Brex for operating account convenience.
      This multi-homing pattern means Erebor is not always competing to replace Mercury—it
      may be competing to displace one leg of a two-bank relationship. Building an in-house
      treasury management function as a substitute is a theoretical option for startups
      above approximately $50 million in deposits, but the operational complexity and
      compliance burden make it uneconomical for the majority of Erebor's target customers.
    claimRefs:
      - CP007
      - CP016
      - CP017
      - CP018
      - CP019
      - CP020

  - id: switching-costs-trust-regulatory
    title: Switching Costs, Multi-Homing, Trust, and Regulatory Posture
    body: >-
      Startup banking exhibits structurally lower switching costs than consumer banking
      because accounts are FDIC-insured (eliminating counterparty concentration risk),
      banking APIs are standardized, and many founders maintain multiple simultaneous
      banking relationships. Mercury's organic distribution through Y Combinator and VC
      accelerator networks is the closest analog to a switching cost moat in this segment:
      founders who open Mercury accounts during YC onboarding rarely switch unless forced
      by account closures or regulatory disruptions. Evolve Bank & Trust's 2024 consent
      order disrupted Mercury customers and demonstrated that the partner-bank model carries
      latent regulatory contagion risk—a risk Erebor's de novo charter model structurally
      avoids. Mercury's subsequent pivot to Column N.A. as its primary partner bank
      illustrates the switching dependency the partner-bank model imposes on Mercury itself.
      On the adverse regulatory side, Senator Elizabeth Warren's February 2026 letter to the
      OCC cited Erebor's fast-tracked charter approval as a potential conflict of interest
      tied to its politically connected investors, creating a material reputational signal
      for politically moderate startup founders who may prefer the politically neutral
      positioning of Mercury or Brex. Erebor's 12% tier-1 leverage ratio requirement for
      the first three years—imposed by the FDIC—is materially more capital-intensive than
      Mercury's partner-bank model, where the partner holds regulatory capital. This capital
      burden constrains Erebor's ability to deploy its equity capital productively during
      its launch phase and represents a structural cost disadvantage relative to neobank
      peers who offload regulatory capital requirements to partner institutions.
    claimRefs:
      - CP021
      - CP022
      - CP023
      - CP024
      - CP025
      - CP026
      - CP027

  - id: moat-durability-adverse
    title: Moat Durability, Adverse Evidence, and Likely Entrants
    body: >-
      Mercury's 18-month first-mover advantage—$20B in deposits, 200K business accounts,
      and deep VC referral network entrenchment—is Erebor's most durable competitive
      obstacle. The distribution moat is difficult to replicate quickly because it is
      built on organic trust within YC and accelerator alumni networks rather than paid
      acquisition. Newsweek's reporting tying Erebor's fast-tracked charter approval to
      billionaire Trump-aligned donors creates a specific reputational risk: politically
      moderate startup founders, including many YC alumni, may prefer Mercury's
      politically neutral brand. Adverse customer review evidence for Mercury on Trustpilot
      shows account closure complaints and wire transfer delays—signal of service quality
      gaps that a well-executed Erebor launch could exploit. Brex's adverse Trustpilot
      data around account suspensions reinforces a broader trust fragility across all
      neobanks. Ramp's spend-management positioning is structurally complementary to
      Erebor's banking proposition, creating a favorable multi-product bundling opportunity
      rather than a head-to-head threat. Stripe Treasury and Rippling are the most credible
      likely entrants: both have large embedded startup customer bases and infrastructure
      to launch banking-adjacent products without obtaining their own charter. Stripe
      Treasury already provides banking-as-a-service to third-party platforms, compressing
      the charter-based moat through indirect routes. Coindesk reported that the OCC's
      January 2025 guidance explicitly permits national banks to engage in crypto custody
      and stablecoin activities, meaning Erebor's crypto-inclusive banking is no longer a
      unique regulatory advantage—any national bank can now pursue these activities upon
      OCC approval, including Mercury if its charter application succeeds. The commoditization
      risk for startup banking products is real: zero-fee checking, API access, and
      FDIC-insured deposits have become table stakes across multiple providers.
