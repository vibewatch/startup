        - label: Capital Burden (T1 Leverage Ratio)
          value: 12% for 3 years
          delta: negative
          detail: >-
            FDIC imposed 12% tier-1 leverage ratio vs. Mercury's partner-bank model
            where partner holds capital; Erebor capital drag is material
        - label: Political / Reputational Risk
          value: Material (Warren letter)
          delta: negative
          detail: >-
            Senator Warren's OCC letter and Newsweek billionaire-donor coverage
            create adverse reputational signal for politically moderate founders
        - label: Adverse Competitive Evidence vs. Mercury
          value: Account closure complaints (Trustpilot)
          delta: positive
          detail: >-
            Mercury's Trustpilot account closure pattern is a genuine switching
            opportunity for a well-executed Erebor launch with superior service quality

callouts:
  - calloutType: risk
    title: Mercury's OCC Charter Application Is the Defining Threat
    body: >-
      Mercury filed an OCC national bank charter application in December 2025. If
      approved within the typical 12–24 month window, Mercury would eliminate its
      partner-bank regulatory dependency and obtain the same direct Federal Reserve
      payment access that is currently Erebor's primary structural differentiator.
      Erebor's competitive moat window is likely 12–24 months before Mercury's
      charter application either advances materially or creates a credible parallel
      offering. Investors must diligence whether Erebor can convert its first-mover
      charter advantage into durable customer lock-in before Mercury closes the gap.
    claimRefs:
      - CP003
      - CP028
      - CP034

  - calloutType: insight
    title: Ramp Is Complementary, Not Substitutive
    body: >-
      Ramp's $1B+ ARR and 50,000 business customers are not a direct competitive threat
      to Erebor's banking proposition because Ramp does not offer FDIC-insured deposits.
      The pattern established in the Mercury ecosystem—where many startups use Ramp for
      expense automation while banking with Mercury—is likely to replicate at Erebor.
      This means Erebor's launch strategy can position itself as Ramp-compatible rather
      than competing against Ramp's spend-management moat.
    claimRefs:
      - CP005
      - CP006
      - CP032

  - calloutType: risk
    title: Adverse Political Posture Is a Customer Acquisition Risk
    body: >-
      Senator Elizabeth Warren's February 2026 letter to the OCC explicitly criticized
      Erebor's charter approval as a potential conflict of interest tied to Trump-aligned
      billionaire investors. Newsweek's coverage amplified this framing. For a startup
      banking product targeting VC-backed tech founders—many of whom are politically
      moderate or Democratic-leaning—this adverse political signal is a material customer
      acquisition risk that Mercury's neutral positioning does not face. Erebor's management
      should address this head-on in its launch messaging.
    claimRefs:
      - CP024
      - CP030

