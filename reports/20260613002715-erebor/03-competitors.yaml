  - id: TP004
    title: Moat Durability / Competitive Risk Register
    notes: >-
      Moat claims assessed qualitatively from public evidence as of Q1 2026. Severity
      ratings reflect potential impact to Erebor's differentiation if threat materializes.
      Time horizon refers to estimated onset window. Diligence asks target investor
      confirmability through private data access.
    columns:
      - Moat Claim
      - Primary Threat
      - Severity
      - Time Horizon
      - Mitigation / Diligence Ask
    rows:
      - - National OCC bank charter as direct-Fed-access moat over partner-bank neobanks
        - Mercury's December 2025 OCC charter application, if approved, eliminates this differentiator
        - High
        - 1–2 years
        - Track Mercury OCC application status; develop additional moat layers (crypto scope; defense relationships) before Mercury's charter is granted.
      - - Crypto- and digital-asset-inclusive charter scope as sector differentiation
        - OCC January 2025 guidance already permits all national banks to engage in crypto custody and stablecoin activities; advantage narrowing now
        - High
        - Immediate
        - Assess whether Erebor's crypto advantage is operational depth (actual product, compliance team) vs. just charter scope. Depth moat persists even if legal permission is commoditized.
      - - Defense / AI / frontier-tech sector expertise and regulatory comfort
        - Incumbents (JPMorgan, BofA) serving defense contractors at scale; limited neobank competition in this niche
        - Medium
        - 2–3 years
        - Verify Erebor has defense-sector compliance infrastructure (ITAR, export controls, dual-use AML) not just charter permission.
      - - Fast-track regulatory approval under Trump administration as a network advantage
        - Warren letter and political scrutiny create reputational risk with moderate founders; political regime change could reverse favorable OCC posture
        - High
        - Ongoing
        - Monitor Congressional and OCC regulatory developments; assess extent to which Erebor's customer base is politically sensitive.
      - - Zero start-from-scratch customer base enabling clean credit culture and risk underwriting
        - Mercury's 200K+ incumbent accounts and $20B deposits represent 18-month compounding distribution lead that cannot be reversed quickly
        - High
        - Ongoing
        - Request Erebor's customer pipeline data; verify whether any pre-launch signed LOIs or anchor deposit commitments exist from named defense/crypto clients.
