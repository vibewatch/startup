- id: TE003
  title: Technology / Operating Architecture Table
  columns:
  - Layer / component
  - Role in customer experience
  - Public evidence
  - Critical dependency
  - Risk if weak or absent
  rows:
  - - Customer interface
    - Account opening, dashboard, support, disclosures
    - No usable Erebor product UI is publicly visible on the open web
    - Company-operated product and support systems
    - Prospects cannot validate usability or launch readiness
  - - Bank ledger and account core
    - Holds balances, product configuration, statements, controls
    - Not disclosed by Erebor; category benchmark inferred from bank operations
    - Core banking vendor or in-house bank systems
    - Operational errors, weak reporting, or slow feature delivery
  - - Money movement rails
    - ACH, wires, cards, treasury transfers, cash movement
    - Peers and infrastructure providers show this as standard; Erebor has no public rail matrix
    - Fedwire, FedACH, card networks, payment operations
    - Limited product breadth and weak day-2 operations
  - - Compliance and risk layer
    - KYC, AML, fraud, sanctions, monitoring, approvals
    - FinCEN mission and FDIC conditions make this mandatory
    - Compliance staff, monitoring tools, regulator interfaces
    - Regulatory breach or inability to serve target segments safely
  - - Integration layer
    - API tokens, OAuth, data-sharing, accounting links
    - Mercury, Plaid, Stripe, and Unit expose clear patterns; Erebor does not
    - APIs, auth, partner integrations
    - Harder deployment into modern finance stacks
  notes: Architecture layers are a public-evidence synthesis, not a claimed Erebor system diagram. The table uses peers and infrastructure docs to define category expectations where Erebor has not published details.
