- id: TE004
  title: Trust / Quality / Compliance Table
  columns:
  - Control or quality signal
  - Public status
  - Scope
  - Why it matters
  - Gap or caveat
  rows:
  - - FDIC deposit-insurance approval
    - Verified
    - Bank launch conditions and insured-deposit path
    - Confirms seriousness of chartered-bank route
    - Does not prove launch, UX, or service quality
  - - 12% tier 1 leverage requirement
    - Verified
    - First three years of operation
    - Shows prudential caution and capital discipline
    - May constrain speed of balance-sheet expansion
  - - Business-plan change restrictions
    - Verified
    - First three years, material deviations require non-objection
    - Reduces reckless pivot risk
    - Could slow adaptation after launch
  - - AML / BSA obligations
    - Verified in principle via FinCEN mandate
    - Virtual-currency and high-risk sectors amplify need
    - Critical for crypto-adjacent client base
    - No public description of Erebor tooling or policies
  - - Customer data-rights environment
    - Verified through CFPB 1033 rulemaking
    - Data sharing and permissions across finance tools
    - Relevant for startup-stack integrations
    - No public Erebor privacy, API, or data-permission documentation
  - - Public trust center / status / security docs
    - Not located
    - External diligence surface
    - Common expectation for modern financial software
    - Major transparency gap today
  notes: Trust signals combine explicit regulatory approvals with the absence of product-operational disclosures. This chapter can verify prudential controls more easily than service-level controls.
