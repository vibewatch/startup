    coverage: partial
    basis: Public evidence covers broad product lines and target users, but no complete Erebor product catalog or pricing page is accessible as of 2026-06-13.
- id: TE002
  title: Workflow / Use-Case Table
  columns:
  - User job
  - Current market workflow
  - Erebor solution implied by sources
  - Measurable benefit if delivered
  - Current limitation
  rows:
  - - Open primary operating account
    - Founders choose between legacy banks and startup-focused fintechs
    - Sector-specialist insured bank for startup and frontier-tech users
    - Could consolidate deposits inside a chartered, mission-specific institution
    - No public onboarding flow or launch-state demo
  - - Run deposits, ACH, and wires
    - Finance teams need reliable payment rails and approvals
    - Erebor would need standard business-banking rails comparable to peers
    - Higher trust if paired with charter and sector familiarity
    - No published rail coverage or cutoff information
  - - Manage treasury and idle cash
    - Startups increasingly expect yield, sweeps, and automation
    - Erebor could offer bank-native treasury and relationship products
    - Potential to extend runway and deepen wallet share
    - No treasury workflow or yield product disclosure
  - - Connect banking into software stack
    - Modern teams expect APIs, OAuth, and ERP/accounting connections
    - Not publicly shown by Erebor; peers offer mature patterns
    - Would reduce back-office friction and improve stickiness
    - No public API, docs, changelog, or integration marketplace
  - - Access venture-style or specialty credit
    - Startups need cash management plus credit lines or secured borrowing
    - Approved product scope includes lending for target sectors
    - Potentially higher ARPU and switching costs
    - No evidence of credit product design or approval process
  notes: This workflow table mixes validated scope with peer-benchmark expectations. It should be read as customer-job analysis, not as a confirmed list of live Erebor features.
