- id: deployment-and-roadmap
  title: Deployment, Reliability, and Roadmap
  body: Erebor’s externally visible roadmap is still dominated by regulatory sequence rather than by product release notes. The market can verify the charter and insurance milestones, the first-three-year prudential constraints, and the 12-month establishment deadline, but not a public beta, feature launch cadence, or customer support surface. That produces a split picture. On one hand, regulators have validated the legal path for the bank to open and imposed explicit controls on capital, business-plan changes, and launch timing, which is more substantive than a typical startup waitlist page. On the other hand, prospective customers cannot independently inspect uptime history, incident communication, onboarding UX, or integration support. Relative to Mercury’s fast-shipping roadmap and API distribution, Erebor’s maturity is best understood as structurally approved but commercially and technically opaque from the outside.
  claimRefs:
  - CE022
  - CE023
  - CE024
  - CE025
  - CE030
  - CE031
  - CE034
  tableRefs:
  - TE005
  figureRefs:
  - FE004
- id: differentiation-and-controls
  title: Differentiation, Trust, and Controls
  body: The clearest differentiators visible today are not proprietary software features but target-market selection and regulatory posture. Erebor is trying to be a chartered, insured bank for AI, crypto, defense, and founder-linked customers, and sources suggest management wants to pair that niche with conservative balance-sheet language. Yet trust in banking products is won through both regulatory status and operational transparency. FinCEN’s AML mandate, CFPB data-rights obligations, FDIC processing rules, and the public expectation of docs, status pages, and clear permissions all raise the diligence bar. Erebor’s challenge is that public evidence strongly supports the first half of that equation—regulatory legitimacy—but weakly supports the second half—visible product controls, developer readiness, privacy posture, and support operations. Investors should therefore treat trust as partially earned via approvals and still unproven via product operations. Investors should separate charter
    evidence from product evidence. More disclosure is still required.
  claimRefs:
  - CE026
  - CE027
  - CE028
  - CE029
  - CE032
  - CE033
  - CE035
