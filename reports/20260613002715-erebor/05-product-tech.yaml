  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: product documentation
    missingEvidence: Launch-ready product pages, onboarding screenshots, pricing, and a feature-by-feature account or lending spec.
    whyItMatters: Without primary product materials, investors cannot validate what customers will actually receive on day one.
    diligencePath: Request a live demo, product deck, and current feature matrix from management.
    relatedQuestionRefs:
    - QE003
    - QE023
    relatedTableRefs:
    - TE001
    - TE002
  - type: missing-source
    severity: material
    topic: technical architecture
    missingEvidence: Disclosure of core banking, payments, data, and integration partners plus any public API roadmap.
    whyItMatters: Architecture determines speed, reliability, and the bank’s ability to plug into startup finance stacks.
    diligencePath: Ask for an architecture review and partner/vendor list under NDA.
    relatedQuestionRefs:
    - QE012
    - QE022
  - type: missing-source
    severity: material
    topic: security and privacy
    missingEvidence: Privacy policy, security overview, trust center, incident process, and data-retention or access-control documentation.
    whyItMatters: Trust in a startup bank requires evidence of operational controls, not just charter status.
    diligencePath: Request security, privacy, and compliance documentation plus any third-party assessments.
    relatedQuestionRefs:
    - QE017
    - QE018
    - QE024
    relatedTableRefs:
    - TE004
  - type: stale
    severity: minor
    topic: website footprint
    missingEvidence: A functioning official website consistent with the company’s claimed brand and current operating status.
    whyItMatters: Domain confusion and parked surfaces impede diligence and may slow customer acquisition.
    diligencePath: Confirm canonical customer-facing domains and whether launch surfaces are intentionally private or simply incomplete.
    relatedQuestionRefs:
    - QE003
    - QE025
