company:
  name: Erebor
chapter:
  number: 5
  title: Product & Technology
  summary: 'Erebor’s public product story is regulator-led rather than demo-led: approvals and repeated reporting validate insured deposits, lending ambition, and sector focus, but the company still exposes little readable web or developer surface of its own. Category benchmarks from Mercury, Plaid, Stripe, and Unit show that modern startup banking is increasingly API-, treasury-, and workflow-native. As of 2026-06-13, Erebor looks more like an approved bank project with plausible product ambition than a fully externally verifiable software-enabled banking platform.'
sections:
- id: product-definition
  title: Product Definition
  body: 'Erebor’s product can be defined more confidently by whom regulators say it will serve than by what the company itself shows on the open web. The FDIC, Reuters, and later trade coverage all converge on the same core job-to-be-done: provide deposit accounts, payments, and lending capacity to venture-backed and frontier-technology businesses that felt underserved after SVB’s failure, plus the founders, investors, and high-net-worth individuals around those networks. That places Erebor closer to a sector-specialist commercial bank than to a single-feature neobank. The open question is packaging. The company’s own public domains do not currently present an accessible onboarding flow, pricing page, feature grid, or docs library, so the most defensible view is that Erebor is a startup-native banking proposition whose customer workflow has been articulated through regulators and media rather than through a launch-ready public product surface. That asymmetry between market clarity and product
    opacity is central to diligence, because customers can understand the promise while investors still cannot verify the full service design. Today. Publicly.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE007
  tableRefs:
  - TE001
  - TE002
  figureRefs:
  - FE002
- id: architecture-and-operating-model
  title: Architecture and Operating Model
  body: 'Public evidence does not reveal Erebor’s internal core banking stack, but it does reveal the technical standard it must meet. Modern startup-banking competitors now expose APIs, developer docs, OAuth-based integrations, and treasury rails that let founders automate account data, payments, treasury, and operating workflows. Mercury’s public API and CLI surface, Plaid’s Auth flows, Stripe Treasury’s financial-account features, and Unit’s infrastructure model together outline the expected operating architecture for any credible software-enabled business bank: customer interface and onboarding, ledger and account systems, payments and card rails, compliance and risk controls, and an integration layer for data sharing and automation. Erebor may have analogous internals, but it has not published them. That absence matters because implementation speed, partner integration depth, and support quality are key buying criteria in startup banking, especially when customers already use treasury,
    ERP, payroll, and AP tooling that expect well-documented connections. It also means implementation risk sits disproportionately in integrations, permissions, and support processes that peers document publicly but Erebor does not.'
  claimRefs:
