tables:
- id: TE001
  title: Product Module / Asset Matrix
  columns:
  - Module
  - Public evidence
  - Likely primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Operating deposit accounts
    - FDIC approval and multiple reports describe deposit products for innovation-economy businesses and related individuals
    - Startups, operating companies, founders
    - Approved, but public web product still opaque
    - Direct charter path and sector specialization
    - No public pricing, onboarding, or account feature grid
  - - Commercial and relationship lending
    - FDIC and media coverage describe lending products as part of approved scope
    - Venture-backed companies, defense/AI operators, HNW linked users
    - Approved in scope; no public credit product page
    - Ability to combine deposits with lending under a charter
    - No disclosed underwriting criteria, loan types, or pricing
  - - Virtual-currency-linked services
    - PYMNTS and trade coverage reference virtual-currency products or users
    - Crypto firms and customers using digital assets
    - Strategic intent visible; product mechanics undisclosed
    - Targets a segment many banks avoid
    - No custody, settlement, or compliance workflow documentation
  - - Payments and treasury operations
    - Any startup bank must support ACH, wires, card, and treasury workflows; peers show this explicitly
    - Finance teams and operators
    - Inferred category requirement, not publicly documented by Erebor
    - Could pair banking with startup cash-management workflows
    - No payment-rail, card, or treasury feature disclosures
  - - Founder / HNW relationship banking
    - Crowdfund coverage explicitly includes HNW users alongside startups
    - Founders, executives, investors
    - Publicly described but not productized on the web
    - Could increase deposit density per relationship
    - No evidence of wealth features, concierge service, or eligibility rules
  notes: Rows distinguish regulator-validated scope from public product evidence. Erebor-specific web disclosure remains thin, so several cells are inferred from approvals and repeated reporting rather than official feature pages.
  claimRefs:
  - CE001
  - CE002
  - CE004
  - CE028
