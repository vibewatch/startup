evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Verified public figures for customers, deposits, revenue, losses, and headcount.
    whyItMatters: >-
      Without operating metrics, investors cannot judge whether Erebor’s valuation is supported by real commercial
      adoption or mostly by regulatory optionality.
    diligencePath: Request management presentation, call-report plans, launch KPIs, and first-quarter operating dashboard.
    relatedQuestionRefs:
      - QO014
      - QO015
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A complete official board roster, cap table summary, and management org chart.
    whyItMatters: >-
      Governance rights, independence, and key-person concentration are central risks for a politically visible de novo
      bank.
    diligencePath: Obtain charter exhibits, board committee charters, and investor-rights summary from counsel.
    relatedQuestionRefs:
      - QO007
      - QO027
    relatedTableRefs:
      - TO002
      - TO003
  - type: access-blocked
    severity: material
    topic: official-web-disclosure
    missingEvidence: A substantive official Erebor product site with account, pricing, onboarding, and compliance details.
    whyItMatters: The current public website footprint is too sparse to verify launch readiness and customer-facing differentiation.
    diligencePath: Request bank website preview, account agreements, pricing schedules, and compliance disclosures.
    relatedQuestionRefs:
      - QO023
      - QO024
  - type: conflicting-data
    severity: minor
    topic: opening-date
    missingEvidence: An official bank statement reconciling conditional approval, charter receipt, and operational launch/opening date.
    whyItMatters: >-
      The difference between being chartered, insured, and fully launched affects how investors interpret stage and
      execution progress.
    diligencePath: Confirm final OCC authorization and first-day-of-business date from management or regulator order.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: underwriting-model
    missingEvidence: Formal credit policy and risk limits for crypto collateral, GPU-backed lending, and high-volatility sectors.
    whyItMatters: Erebor’s economic upside depends on underwriting segments that can also create outsized credit and liquidity risk.
    diligencePath: Request credit-policy deck, concentration limits, collateral haircuts, and stress-testing materials.
    relatedQuestionRefs:
      - QO012
      - QO028
  - type: missing-source
    severity: material
    topic: defense-AI-crypto-banking-TAM
    missingEvidence: >-
      A published market sizing estimate specifically for the defense technology, AI research lab, and crypto company
      banking sub-segment in the US, disaggregated from the broader neobanking or SMB commercial banking markets.
    whyItMatters: >-
      Without a disaggregated SAM for Erebor's specific customer categories, it is impossible to rigorously assess
      whether the target market is large enough to support a well-capitalized national bank at Erebor's implied
      valuation, or whether the innovation economy banking opportunity is concentrated among only a few hundred large
      accounts.
    diligencePath: >-
      Commission primary market research sizing the venture-backed startup, crypto, AI, and defense contractor banking
      wallet by tracking deposit volumes at Mercury, Brex, and SVB's historical customer roster; cross-reference with
      Federal Reserve small business survey data on digital banking adoption by sector.
    relatedQuestionRefs:
      - QM009
      - QM018
  - type: missing-source
    severity: minor
    topic: de-novo-charter-application-trends
    missingEvidence: >-
      Data on whether the number of de novo bank charter applications to the OCC or FDIC increased meaningfully after
      SVB's 2023 collapse, and how Erebor's approval compares to peer applications.
    whyItMatters: >-
      Understanding the competitive landscape of de novo bank applications post-SVB would contextualize whether Erebor
      benefited from a structural opportunity or simply moved faster than peers; it also affects assessment of
      regulatory pipeline risk.
    diligencePath: >-
      Review OCC and FDIC press release archives for 2023-2026 de novo bank applications; compare to pre-SVB application
      rates using FDIC historical charter data.
    relatedQuestionRefs:
      - QM024
  - type: private-evidence-only
    severity: material
    topic: SVB-market-share
    missingEvidence: >-
      Precise data on SVB's market share among venture-backed US startups at its peak, and the total value of deposits
      displaced by its collapse that remain up for grabs for successor banks like Erebor.
    whyItMatters: >-
      SVB's concentration among startups is frequently cited as the root cause of both its failure and the market
      opportunity for successors; the precise magnitude of the displaced deposit pool affects the credibility of TAM
      claims for Erebor's market thesis.
    diligencePath: >-
      Review FDIC receivership filings for SVB deposit data; cross-reference with published SVB financial statements
      pre-failure and VC survey data on primary banking provider share.
    relatedQuestionRefs:
      - QM017
  - type: missing-source
    severity: material
    topic: erebor-pricing
    missingEvidence: >-
      Erebor's public fee schedule, pricing tiers, corporate card terms, and wire transfer costs have not been publicly
      disclosed.
    whyItMatters: >-
      Without Erebor's pricing, a direct fee and yield comparison against Mercury's zero-fee model and 4.39% treasury
      yield is impossible; investors cannot assess whether Erebor's economics will be competitive enough to attract
      deposits from Mercury.
    diligencePath: >-
      Request the Erebor product roadmap and pre-launch pricing deck from management; obtain pilot customer term sheets
      if available.
    relatedQuestionRefs:
      - QP007
      - QP022
  - type: stale
    severity: material
    topic: mercury-occ-application-status
    missingEvidence: >-
      No official OCC confirmation of Mercury's charter application status as of Q2 2026; only press reports of the
      filing date.
    whyItMatters: >-
      If Mercury's OCC application is approved within 12–24 months, Erebor's primary structural differentiator (direct
      Fed access from charter) is eliminated, fundamentally changing the competitive landscape.
    diligencePath: >-
      Monitor OCC application docket; check OCC news releases at occ.gov for Mercury charter application disposition
      notices.
    relatedQuestionRefs:
      - QP010
  - type: private-evidence-only
    severity: material
    topic: multi-homing-quantitative
    missingEvidence: >-
      Quantitative data on the share of startup founders who multi-home between Mercury and a traditional bank, or
      between Mercury and Ramp, is not publicly available.
    whyItMatters: >-
      Multi-homing rates determine whether Erebor is displacing Mercury entirely (zero-sum) or entering an additive
      second-bank relationship (positive-sum), which materially affects the size of the addressable opportunity.
    diligencePath: >-
      Request primary customer research from Erebor management; cross-check Mercury public commentary on single-bank vs.
      multi-bank account structures among its user base.
    relatedQuestionRefs:
      - QP015
  - type: missing-source
    severity: minor
    topic: arc-competitor-scale
    missingEvidence: Arc's current customer count, deposit balances, ARR, and strategic roadmap for 2026 are not publicly disclosed.
    whyItMatters: >-
      If Arc has scaled significantly in the venture-backed startup treasury segment, it represents a more direct
      competitive threat than the current evidence supports.
    diligencePath: >-
      Search for recent Arc fundraising announcements, investor reports, or press coverage of Arc's 2025–2026 scale and
      product roadmap.
    relatedQuestionRefs: []
  - type: missing-source
    severity: material
    topic: Future revenue mix and customer evidence remain unavailable before launch
    missingEvidence: >-
      No public source discloses Erebor's expected split between NIM and fee income, any signed customer commitments, or
      any initial deposit balances.
    whyItMatters: >-
      Without those data points, revenue sensitivity and launch traction cannot be underwritten directly; all forecasts
      remain proxy-driven.
    diligencePath: >-
      Request management's launch budget, initial deposit pipeline, pricing deck, and first-year balance-sheet plan;
      verify against first Call Reports once the bank opens.
    relatedTableRefs:
