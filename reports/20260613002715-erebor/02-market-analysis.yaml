company:
  name: Erebor
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Erebor's target market—startup, innovation economy, crypto, AI, and defense
    banking—sits within an estimated $34.6 billion US neobanking market growing at
    27%+ CAGR through 2032, itself a subset of the $211 billion global neobanking
    industry. The March 2023 SVB collapse created a structural vacancy for a federally
    chartered, digital-asset-inclusive startup bank, which Mercury, Brex, and now
    Erebor have each tried to fill; Erebor's de novo OCC national bank charter
    differentiates it from pure fintech-bank partnerships but also imposes capital,
    regulatory, and execution constraints that remain materially unverified. Market
    growth drivers—post-SVB banking anxiety, venture ecosystem rebound, crypto
    regulatory tailwinds, AI adoption—are real, while key risks include rate sensitivity,
    startup funding cyclicality, persistent neobank non-profitability, and the absence
    of any disclosed Erebor customer traction data.
sections:
  - id: market-boundary
    title: Market Boundary, Segment Definition, and Status-Quo Substitutes
    body: >-
      Erebor occupies the intersection of three partially overlapping market segments:
      US startup and innovation economy commercial banking, crypto/digital-asset-inclusive
      banking, and de novo nationally chartered banking for defense and frontier-technology
      companies. Its FDIC deposit insurance approval explicitly names technology, payment
      systems, investment, defense, and virtual-currency market participants as the target
      customer base. The primary status-quo substitutes are the large incumbent commercial
      banks—JPMorgan Chase, Bank of America, and Wells Fargo—which collectively serve the
      overwhelming majority of the 30 million US small and medium-sized businesses. A
      secondary substitute for tech startups is the partner-bank neobank model exemplified
      by Mercury (Choice Financial Group and Column N.A.) and Brex. SVB served as the
      dominant primary banking provider for venture-backed startups until its March 2023
      collapse. Excluded from Erebor's near-term scope are consumer banking, conventional
      residential mortgages, traditional retail SMB banking, and institutional treasury for
      established large corporates. The defense and AI sub-segment represents a premium
      layer within startup banking that demands higher regulatory sophistication and AML/BSA
      compliance for dual-use technology customers than standard SMB neobanks provide.
      Erebor's national bank charter is the key structural differentiator: it gives the
      bank direct access to Federal Reserve payment infrastructure rather than depending
      on partner-bank intermediaries, which imposes higher capital requirements but removes
      a critical counterparty risk layer that proved disruptive for Mercury customers
      during the Evolve Bank consent order disruption of 2025.
