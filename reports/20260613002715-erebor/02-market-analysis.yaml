callouts:
  - calloutType: risk
    title: SAM Opacity Is a Material Diligence Gap
    body: >-
      No published market research has disaggregated the innovation economy banking sub-segment
      (venture-backed startups, crypto companies, defense-tech contractors, AI labs) from the
      broader US neobanking or SMB commercial banking markets. The $50–80B SAM estimate in this
      chapter is an editorial inference from Mercury's $20B deposit proxy and historical VC
      deployment volumes. Investors should not rely on these estimates without commissioning
      primary research that segments the addressable wallet by vertical and customer lifecycle stage.
    claimRefs:
      - CM030
  - calloutType: insight
    title: National Bank Charter as Structural Differentiator
    body: >-
      Erebor's OCC national bank charter fundamentally changes its market access relative to
      Mercury's or Brex's partner-bank model. Direct Federal Reserve payment system access removes
      the counterparty risk demonstrated during the Evolve Bank consent order disruption of 2025,
      when Mercury customers faced operational disruption from a third-party bank's regulatory
      crisis. However, the charter also imposes higher capital requirements (12% tier-1 leverage
      ratio for three years per FDIC conditions) that constrain near-term lending growth.
    claimRefs:
      - CM028
      - CM029
