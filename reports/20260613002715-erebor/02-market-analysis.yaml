  - id: constraints-risks
    title: Adoption Constraints, Regulatory Dynamics, and Adverse Market Risks
    body: >-
      Despite favorable structural tailwinds, Erebor faces four material adoption constraints
      and adverse market risks. First, startup banking revenue is highly sensitive to interest
      rate cycles: Mercury's revenue growth rate compressed from 97% year-over-year in 2024 to
      approximately 41% in 2025 following Federal Reserve rate cuts in autumn 2025, demonstrating
      that the deposit-heavy revenue model is structurally exposed to policy rate movements that
      Erebor will share. Second, the broader neobank market has a profitability problem: 80% of
      global neobanks remained unprofitable as of 2023, and only 15% were expected to reach
      profitability by 2025. Scaling a de novo chartered bank carries higher regulatory capital
      burdens than the partner-bank model, meaning Erebor's path to profitability is likely
      longer and more capital-intensive than Mercury or Brex's. Third, the startup banking
      customer base is inherently cyclical: when venture capital funding contracts, deposit
      balances decline and charge-off rates rise. The Federal Reserve's SVB review documented
      exactly this dynamic as SVB's uninsured deposit concentration collapsed when VC sentiment
      shifted. Fourth, incumbent banks—JPMorgan Chase, Bank of America, Wells Fargo—have
      responded to neobank pressure with accelerated digital SMB investment, and the
      Newsweek and Elizabeth Warren reporting on Erebor's regulatory approval flagged credible
      political and reputational risks arising from the bank's connection to politically
      prominent investors. Erebor's 12% tier-1 leverage ratio requirement for the first three years
      further constrains the bank's ability to grow the loan book aggressively.
