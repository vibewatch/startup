  - id: buyer-segmentation
    title: Buyer and Customer Segmentation
    body: >-
      Erebor's target buyer population spans five distinguishable segments within the
      innovation economy, each with distinct budget ownership, adoption triggers, and
      expected deposit balances. Venture-backed technology startups—seed through Series C—
      represent the core beachhead, and their budget owner is typically the CEO or CFO who
      manages treasury, payroll, and venture debt in a single banking relationship. Crypto
      and digital asset companies form a second distinct buyer category: they require
      stablecoin rails, virtual currency custody or integration, and a banking partner
      willing to handle AML/BSA complexity associated with token issuance and exchange.
      Defense and dual-use technology companies—the segment most explicitly called out in
      the FDIC's Erebor approval—need a federally chartered bank capable of navigating
      ITAR and export-control compliance alongside standard business banking. Ultra-high-net-worth
      technology founders and early employees represent a fourth segment willing to pay premium
      fees for private banking-adjacent services at a bank aligned to their professional network.
      AI research labs and model companies are an emerging fifth segment characterized by rapid
      compute-cost expenditure, need for significant credit facilities, and interest in stablecoin
      settlements for international compute vendor payments. Across all segments, switching triggers
      cluster around company formation events, forced migrations (SVB/Evolve disruption), investor
      network referrals, and product differentiation on digital-asset capabilities unavailable at
      incumbent banks or standard neobanks.
    claimRefs:
