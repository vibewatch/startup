    - type: missing-source
      severity: material
      topic: defense-AI-crypto-banking-TAM
      missingEvidence: >-
        A published market sizing estimate specifically for the defense technology, AI research
        lab, and crypto company banking sub-segment in the US, disaggregated from the broader
        neobanking or SMB commercial banking markets.
      whyItMatters: >-
        Without a disaggregated SAM for Erebor's specific customer categories, it is impossible
        to rigorously assess whether the target market is large enough to support a well-capitalized
        national bank at Erebor's implied valuation, or whether the innovation economy banking
        opportunity is concentrated among only a few hundred large accounts.
      diligencePath: >-
        Commission primary market research sizing the venture-backed startup, crypto, AI, and
