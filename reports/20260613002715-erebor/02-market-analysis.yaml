        - Favorable
      - - FDIC deposit insurance approval with 12% tier-1 leverage ratio requirement
        - December 16, 2025
        - Confirms market entry but imposes capital constraints limiting early loan growth; 12% tier-1 LR for three years restricts balance-sheet expansion
        - Mixed
      - - Senator Elizabeth Warren letter to OCC questioning approval process
        - February 25, 2026
        - 'Political risk: bipartisan scrutiny possible if Erebor attracts adverse regulatory attention; investor concentration amplifies governance risk'
        - Adverse
      - - OCC interpretive guidance on digital asset bank activities (2021 precedent)
        - January 2021
        - OCC has permitted national banks to engage in digital asset custody and stablecoin activities since 2021; Erebor's charter is consistent with this framework
        - Favorable
      - - Federal Reserve SVB review documenting supervisory failures
        - April 28, 2023
        - Established regulatory precedent for stricter supervision of concentrated-model banks; creates compliance overhead Erebor must navigate given its own concentration in a single customer category
        - Mixed
