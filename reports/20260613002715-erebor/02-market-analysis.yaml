  - id: growth-drivers
    title: Growth Drivers and Structural Market Tailwinds
    body: >-
      Four structural drivers underpin the favorable market outlook for an innovation
      economy startup bank like Erebor. First, the SVB collapse permanently disrupted the
      incumbent model for startup banking: SVB's failure wiped out a concentration of
      venture-backed startup deposits and created lasting demand for diversified, well-capitalized
      alternatives. Mercury captured $2 billion in new deposits within five days of SVB's
      failure, demonstrating both the scale of displaced demand and the speed with which
      it can consolidate at a credible alternative. Second, venture capital rebound in 2024–2025—
      after the 2022–2023 downturn—has expanded the population of funded startups requiring
      banking services. Third, the Trump administration's crypto-friendly regulatory posture in
      2025–2026 made the OCC more willing to grant digital-asset-inclusive bank charters, as
      confirmed by PYMNTS coverage of the OCC's Erebor conditional approval framing it as a
      signal of openness to digital asset banking activities. Fourth, AI adoption within neobanks
      is accelerating the quality gap between digital-native banks and incumbent banks: 70% of
      neobanks are expected to use AI-driven predictive analytics by 2025, improving fraud
      detection, credit underwriting, and cash-flow forecasting. North America as a whole is
      projected to grow neobanking revenues at 34.6% CAGR through 2026, the highest of any region,
      driven by tech-savvy founders and SMEs adopting advanced banking platforms.
