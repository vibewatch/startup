- id: TR005
  title: Mitigation and Kill Criteria Table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Launch-delay risk
    - Establishment timeline
    - No credible launch before deadline or extension request without clear rationale
    - Pause underwriting and reassess opening viability
  - - Capital risk
    - Leverage / well-capitalized status
    - Any sign of buffer stress or regulatory capital concern
    - Treat thesis as broken until recapitalized
  - - Governance risk
    - Management or control changes
    - Unexpected turnover in risk leadership or regulator objection to changes
    - Escalate diligence on operating readiness
  - - Concentration risk
    - Customer mix and deposit concentration
    - Early book clusters too tightly around one frontier-tech cohort
    - Demand diversification plan before capital
  - - Transparency risk
    - Public product and control disclosure
    - Continued absence of usable product, trust, or customer evidence after launch window
    - Assume slower adoption and higher operational risk
  notes: Kill criteria are intentionally monitorable rather than narrative. Each row ties a visible event to an investment implication.
