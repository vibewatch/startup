  - TR003
  figureRefs:
  - FR003
- id: people-execution-and-kill-criteria
  title: People, Execution, and Kill Criteria
  body: 'The Senate’s adverse commentary makes the people risk unusually important. If management depth, risk leadership, or board oversight are weaker than advertised, then even strong capital and formal approvals may not save execution. Investors should therefore watch three categories of kill criteria. First, launch timing: if the bank burns meaningful time against the establishment clock without a credible public rollout, customer or product proof, that is a negative signal. Second, prudential slippage: any issue around capital buffers, well-capitalized status, or unexpected regulator objections should be treated as thesis-threatening. Third, governance instability: further turnover in core risk or operating roles, or formal non-objection conflicts around material business-plan changes, would suggest the charter story is outrunning the operating institution. A bank that is simultaneously launching and adapting to policy change has less room for managerial error than a typical fintech
    app. That asymmetry matters.'
  claimRefs:
  - CR006
  - CR007
  - CR029
  - CR032
  - CR036
  - CR037
  - CR038
  - CR039
