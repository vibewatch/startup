- id: operational-and-compliance-risks
  title: Operational, Quality, and Compliance Risk
  body: 'Operationally, Erebor is trying to enter one of the hardest corners of business banking: concentrated, fast-moving customers; digital channels; and some crypto adjacency. FinCEN and Treasury obligations mean AML, sanctions, and suspicious-activity controls will be non-negotiable. FDIC’s requirement that the bank be ready to process deposit accounts in a failure scenario shows how seriously regulators take operational plumbing before launch. Yet the company has not published the kind of status, trust, privacy, or API-control information that modern startup-bank buyers often inspect. Compared with peers and infrastructure providers that expose permissioning models, SDKs, or product docs, Erebor remains externally opaque. That opacity is not proof of weak controls, but it does mean outside capital cannot yet validate resilience, vendor governance, or incident discipline from public evidence. In a digital-asset context, compliance burden is not static; it can widen as agencies refine
    custody, stablecoin, and capital-treatment expectations.'
  claimRefs:
  - CR011
  - CR012
  - CR013
  - CR014
  - CR017
  - CR018
  - CR019
  - CR023
  - CR024
  - CR025
