- id: TV005
  title: Thesis-Break and Kill Triggers Table
  columns:
  - Trigger
  - Threshold or event
  - Transmission to thesis
  - Action implication
  rows:
  - - Launch slippage
    - Deadline pressure without clean rollout
    - Undercuts core “ready to fill the gap” argument
    - Move to avoid unless evidence improves
  - - Capital or leverage issue
    - Any sign required buffers are strained
    - Challenges bank-model viability
    - Re-underwrite as distressed execution
  - - Governance instability
    - Further risk or management turnover
    - Raises execution discount materially
    - Pause or downgrade diligence
  - - Weak customer proof
    - No references, no segment diversification, no wallet depth
    - Narrative remains unearned
    - Do not pay premium valuation
  notes: Each trigger is observable and tied to a clear decision consequence.
  claimRefs:
  - CV020
  - CV028
- id: TV006
  title: Final Diligence Asks Table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Live product and onboarding
    - Demo plus current feature matrix
    - Validates product readiness and support depth
    - Management product demo
  - - Customer references
    - At least three active customers by segment
    - Validates adoption quality and target fit
    - Sales / customer-success references
  - - Customer concentration
    - Deposits and pipeline by subsector and top account
    - Tests correlation risk and growth realism
    - Finance / risk data request
  - - Underwriting policy
    - Loan types, collateral, approval process, loss assumptions
    - Tests whether credit upside is disciplined
    - Chief credit / risk review
  - - Management depth
    - Current org chart and key-role tenure
    - Tests execution maturity and governance resilience
    - Board and management package
  notes: These asks are the shortest path from a narrative case to an underwritten case.
