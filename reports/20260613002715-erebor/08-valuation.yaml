- id: final-decision
  title: Recommendation, Confidence, and Final Diligence Asks
  body: 'The recommended posture is research-more, with low confidence, high risk, and an expensive valuation stance. That is not a denial of the opportunity. It is a judgment about timing and evidence quality. Erebor may become a uniquely valuable bank for the innovation economy, but the current public record does not justify paying for that future as though it were already de-risked. Investors should require a short list of proof points before moving up the conviction curve: live product demonstration, referenceable customers, segment concentration data, underwriting policy, deposit behavior assumptions, and management depth. If those checks are strong, Erebor could still grow into the present valuation. If they are weak, today’s price leaves little margin for narrative error. Until those proofs appear, prudence should dominate excitement.'
