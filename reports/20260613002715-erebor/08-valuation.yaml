- id: TV003
  title: Bull / Base / Bear Scenario Table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Clean launch, strong founder-network deposits, attach treasury and credit, no regulatory hiccups
    - Current valuation can be grown into and potentially exceeded over time
    - Concentration still manageable if growth is diversified
    - Possible but not proven
  - - Base
    - Launch succeeds but proof builds slowly under prudential constraints
    - Current valuation requires patience and offers limited near-term upside margin
    - Execution and transparency remain gating factors
    - Most evidence-consistent
  - - Bear
    - Delays, governance noise, or weak customer proof keep franchise unproven
    - Current valuation compresses or stays flat for a long period
    - Capital, launch, and concentration risk reinforce each other
    - Material downside case
  notes: These scenarios are milestone-based because Erebor does not publish revenue or deposit numbers sufficient for a rigorous DCF or revenue-multiple model.
