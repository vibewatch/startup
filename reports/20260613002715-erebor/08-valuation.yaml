- id: TV002
  title: Thesis / Anti-Thesis Table
  columns:
  - Argument
  - Evidence today
  - What would change the view
  rows:
  - - Post-SVB startup-banking gap is real
    - Regulators and reporting consistently show Erebor aiming at underserved innovation-economy customers
    - Verified live adoption and product depth would strengthen the thesis
  - - Charter plus sector focus could create high wallet share
    - Bank structure could pair deposits with treasury and credit
    - Proof of deposit stickiness and cross-sell would improve confidence
  - - Valuation already prices in substantial success
    - $4.35B valuation arrived before public traction metrics
    - Lower entry price or stronger metrics would reduce concern
  - - Governance and concentration risks may stay material
    - Senate letter and public opacity keep risk high
    - Clearer management depth and customer-mix data would help
  notes: The point of this table is to show how evidence, not enthusiasm, would move the recommendation.
