schemaVersion: report-v2
artifact: financials
slug: erebor
runDate: '2026-06-13'
company:
  name: Erebor
chapter:
  number: 4
  title: Financials
  summary: 'Erebor has no launched financial statements, deposits, loans, or customer metrics yet, so
    its Chapter 4 profile is necessarily a pre-launch underwriting memo rather than a true operating review.
    Public evidence supports a bank-style economics thesis—commercial and UHNW deposit gathering, NIM
    on assets, and relationship-fee income—but all live performance variables remain undisclosed. The
    strongest hard facts are capital and regulation: ~$225M sought at ~$2B in July 2025, ~$350M raised
    at $4.35B in December 2025, a 12% tier-1 leverage requirement for the first three years, and a 12-month
    launch deadline. The result is a business with meaningful theoretical upside if startup/crypto/defense
    deposits consolidate, but with unusually high financing dependency, underwriting complexity, and public-metric
    scarcity before opening.'
sections:
- id: revenue-model
  title: Revenue Model and Monetization Path
  body: Erebor has no observed revenue base yet, but its charter language and target customers imply a
    conventional bank economics model rather than a software-first fintech model. The OCC/press framing
    of a full-service insured national bank for technology companies, ultra-high-net-worth virtual-currency
    users, and the FDIC's focus on technology, payment-systems, investment, defense, and virtual-currency
    market participants point to deposit gathering, loan and securities deployment, and relationship-fee
    monetization. Unlike a partner-bank fintech, a direct national bank can theoretically retain the full
    banking spread, but Erebor has not disclosed any live NIM, credit yields, fee schedule, or deposit
    commitments. The ambition is clearly post-SVB replacement banking; the economics remain unproven until
    launch. [CI001] [CI002] [CI003] [CI004] [CI005] [CI006] [CI007] [CI009] Until call reports exist,
    any split between rate-sensitive NIM and fee income is scenario analysis rather than observed performance.
    [CI039]
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI007
  - CI009
  - CI039
  tableRefs:
  - TI001
  figureRefs: []
- id: pricing-architecture
  title: Pricing Architecture and Visible Fee Signals
  body: Erebor has not published a pricing page, so the best available view is by analogy to startup-finance
    peers. Mercury uses a $0 core banking entry point with upsell tiers at $29.90 and $299 per month;
    Brex discloses $0 and $12 per-user tiers; Ramp advertises free ACH and wire rails. Those peers show
    that customer acquisition in this segment is driven by low visible fees and monetization through spread,
    card economics, treasury, and premium workflows. Erebor is therefore unlikely to win on headline account
    pricing alone; it will need differentiated balance-sheet capacity and high-value relationship services.
    [CI010] [CI011] [CI012] [CI013] [CI014] That matters because a pre-launch bank cannot lean on mature
    software ARR to subsidize customer acquisition the way spend-management platforms can; its moat has
    to come from regulatory trust, balance-sheet capacity, and sector-specific service. [CI014] [CI039]
  claimRefs:
  - CI010
  - CI011
  - CI012
  - CI013
  - CI014
  - CI039
  tableRefs:
  - TI002
  figureRefs: []
- id: unit-economics-proxies
  title: Unit Economics Proxies and Deposit Economics
  body: 'Because Erebor is pre-revenue, public unit economics have to be triangulated from analogs. Mercury
    is the strongest proxy because it captured $2B of new deposits in five days after SVB and has since
    scaled to large public proxy metrics. That demonstrates both the upside of concentrated startup deposits
    and the importance of treasury trust. The SVB review adds the cautionary half of the story: startup-focused
    banking can be economically attractive, but the same deposit base can become correlated and unstable
    if asset-liability management slips. For Erebor, the upside case is high deposit density per client;
    the downside case is recreating ecosystem concentration before proving risk controls. [CI008] [CI015]
    [CI016] [CI017] [CI018] [CI019] [CI021]'
  claimRefs:
  - CI008
  - CI015
  - CI016
  - CI017
  - CI018
  - CI019
  - CI021
