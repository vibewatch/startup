- id: capital-adequacy
  title: Capital Adequacy and Financing Dependency
  body: 'The hard financial facts around Erebor are fundraising and capital regulation, not operating
    performance. Public reporting moved from a July 2025 target of roughly $225M at a $2B valuation to
    a December 2025 round of about $350M at $4.35B. Meanwhile the FDIC required a 12% tier-1 leverage
    ratio for the first three years and gave Erebor 12 months to establish the bank. That combination
    makes Erebor unusually capital-intensive for a pre-launch business: equity must fund both setup burn
    and regulatory capital, and there is no operating cash flow to replenish it. The February 2026 charter
    milestone raised franchise value, but it did not eliminate launch execution risk. [CI022] [CI023]
    [CI024] [CI025] [CI026] [CI027] [CI028] [CI029] [CI030] [CI034]'
