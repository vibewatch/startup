tables:
- id: TI001
  slug: revenue-streams-table
  title: Theoretical revenue streams before launch
  summary: Erebor has not launched, so each row describes an inferred revenue stream based on its charter,
    target customers, and bank structure rather than observed P&L disclosure.
  columns:
  - Revenue stream
  - Mechanism
  - Why it fits Erebor
  - Why it is still unverified
  rows:
  - - Net interest margin on operating deposits
    - Gather startup, UHNW, and sector-specialist deposits; invest in cash, securities, and loans; retain
      spread
    - Direct charter structure and FDIC-approved business scope point to a bank-led spread model
    - No deposit balances, asset mix, or target NIM disclosed
  - - Commercial and relationship lending
    - Extend credit to technology, payment, investment, defense, and adjacent customers
    - FDIC explicitly approved deposit and lending products for those sectors
    - No loan pipeline, pricing grid, or loss assumptions disclosed
  - - Payments, treasury, FX, and cash-management fees
    - Charge for premium money movement, treasury tooling, FX, and service intensity
    - Peer pricing suggests visible account fees stay low while treasury/payment monetization matters
    - No fee schedule, wire pricing, or treasury basis-point take rate published
  - - UHNW / specialty relationship services
    - Use balance-sheet access and white-glove service to monetize wealthy or complex clients
    - OCC coverage referenced UHNW virtual-currency users as part of target scope
    - No evidence yet of wealth products, attach rates, or advisory economics
  claimRefs:
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI009
  notes: All rows are analytical inferences from approvals and peer analogs; Erebor has not disclosed
    an observed revenue mix.
- id: TI002
  slug: pricing-proxy-table
  title: Pricing and monetization proxies versus peers
  summary: 'Public peer pricing illustrates the commercial environment Erebor will enter: low visible
    sticker prices, monetization through spread and embedded finance, and little room for large account
    fees.'
  columns:
  - Platform
  - Public entry pricing
  - Observed upsell / monetization signal
  - Implication for Erebor
  rows:
  - - Erebor
    - Undisclosed
    - No public pricing page or fee card located
    - Cannot underwrite pricing power directly; assume low-friction acquisition economics at launch
  - - Mercury
    - $0 core; Plus $29.90/mo; Pro $299/mo
    - Uses free banking entry point plus paid workflow tiers
    - Erebor likely needs spread and premium services, not basic account fees, to monetize
  - - Brex
    - $0/user/mo starting plan; advanced features at $12/user/mo
    - Visible software pricing exists, but core economics are still tied to card and treasury activity
    - Even software-forward peers keep the visible price low to land accounts
  - - Ramp
    - Free ACH and wire rails highlighted publicly
    - Core product positioning emphasizes no-fee rails and workflow value
    - Transaction-fee monetization in startup finance is highly competitive and likely compressed
  claimRefs:
  - CI010
  - CI011
  - CI012
  - CI013
  - CI014
  notes: Peer rows use current official pricing pages fetched on 2026-06-13; Erebor row reflects absence
    of equivalent public disclosure.
- id: TI003
  slug: unit-economics-proxy-table
  title: Unit economics proxies and deposit analogs
  summary: Because Erebor is pre-launch, public analogs matter more than direct financials. This table
    compares SVB, Mercury, Brex, and Erebor on what can and cannot be inferred.
  columns:
  - Reference point
  - Public signal
  - What it implies for Erebor
  - Primary caution
  rows:
  - - Silicon Valley Bank
    - Large startup-focused franchise before failure; failed from interest-rate and liquidity mismanagement
    - Concentrated innovation-economy banking can be valuable at scale
    - Sector concentration and treasury confidence can reverse deposit stability quickly
  - - Mercury
    - $2B deposits captured in five days post-SVB; ~200K customers; large public revenue proxy
    - Startup deposits can move fast to a credible alternative and become economically meaningful
    - Mercury is not a direct de novo charter analog and already has operating scale
  - - Brex
    - $0 to $12 visible software pricing; card and treasury-led monetization
    - Visible prices can stay low while monetization happens in spend and treasury activity
    - Brex is software-led and not a national bank balance-sheet analog
  - - Erebor
    - No public deposits, revenue, customer count, or loan book yet
    - Financial upside exists if deposits consolidate rapidly after launch
    - Every unit-economics conclusion is hypothetical until call reports and actual balances exist
  claimRefs:
  - CI008
  - CI015
  - CI016
  - CI017
  - CI018
  - CI019
  - CI021
  notes: Mercury metrics are proxy-level and sourced from analyst/research coverage; Erebor metrics remain
    undisclosed.
- id: TI004
  slug: capital-timeline-table
  title: Capital adequacy and financing timeline
  summary: The most underwritable part of Erebor today is its capital-and-regulation sequence rather than
    any operating statement.
  columns:
  - Date / milestone
  - Public fact
  - Financial significance
  - Residual risk
  rows:
  - - July 2025 fundraising target
    - Business Insider reported Erebor seeking about $225M at roughly $2B valuation
    - Establishes initial capitalization ambition before approvals were complete
    - Target does not prove cash was closed or sufficient for full launch
  - - October 2025 OCC conditional approval
    - Conditional approval increased charter credibility and future monetization optionality
    - Supports franchise value and customer signaling before launch
    - Conditional approval is not the same as an operating bank with deposits
  - - December 2025 FDIC approval + reported $350M raise
    - FDIC approved deposit insurance; multiple outlets reported ~$350M at $4.35B valuation
    - Creates the core investor-funded capital stack for launch
    - Capital must absorb both setup burn and regulatory leverage constraints
  - - February 2026 national charter milestone
    - Erebor reported as first national bank charter under second Trump administration
    - Improves strategic scarcity value in de novo banking
    - Still no public operating metrics or proof of on-time launch readiness
  claimRefs:
  - CI022
  - CI023
  - CI024
  - CI025
  - CI026
  - CI027
  - CI028
  - CI029
  - CI030
  notes: Where media outlets differed on precise wording, the table uses approximate values that recur
    across multiple reports.
- id: TI005
  slug: disclosure-gaps-table
  title: What remains undisclosed or unavailable
  summary: Pre-launch status means many of the most important financial metrics are either absent by definition
    or still private.
  columns:
  - Metric
  - Current public status
  - Why it matters
  - Best available proxy today
  rows:
  - - Deposits / funding mix
    - No public deposit balance or commitment level
    - Determines NIM opportunity, liquidity profile, and franchise traction
    - Mercury's post-SVB deposit capture and SVB historical concentration dynamics
  - - Loan book / credit quality
    - No loan balances, yields, reserve policy, or charge-off data
    - Determines spread quality and downside risk
    - Target-sector mix plus general lessons from specialized-bank underwriting
  - - Pricing / NIM target
    - No public fee schedule or NIM objective
    - Needed to model revenue mix and customer willingness to pay
    - Mercury, Brex, and Ramp public pricing pages
  - - Customers / acquisition / operating KPIs
    - No customer count, CAC, headcount, or usage metrics disclosed
    - Needed to judge go-to-market efficiency and fixed-cost absorption
    - Regulatory milestones, fundraising history, and peer analogs only
  claimRefs:
  - CI031
  - CI032
  - CI033
  - CI037
  - CI038
  - CI039
  notes: This table intentionally distinguishes between metrics that do not yet exist because Erebor has
    not launched and metrics that may exist internally but are not publicly disclosed.
