- id: risk-and-gaps
  title: Crypto, AI, Defense Underwriting Risk and Missing Metrics
  body: 'Erebor''s most distinctive financial risk is not merely that it is pre-launch, but that it intends
    to serve customer segments with atypical compliance and concentration profiles: crypto or virtual-currency
    participants, AI startups, defense contractors, manufacturers, and wealthy venture-linked households.
    Publicly there is no evidence yet of credit performance, deposit stickiness, or risk-adjusted pricing
    for those cohorts. FFIEC benchmarking will only appear once Erebor files call reports, and several
    apparently relevant 2026 media or official URLs are already inaccessible, which makes source durability
    itself part of diligence. For now, financial underwriting has to lean on approvals, raises, peer analogs,
    and disclosed gaps rather than operating KPIs. [CI020] [CI031] [CI032] [CI033] [CI035] [CI036] [CI037]
    [CI038] [CI039] [CI040]'
