- id: TU005
  title: Expansion and Concentration Risk Table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Early signal
  - Diligence path
  rows:
  - - Win primary operating account
    - Sector concentration among AI/crypto/defense founders
    - High deposit density but correlated balances
    - Customer mix by vertical and stage
    - Request pipeline by subsector
  - - Attach treasury and yield products
    - Rate-sensitive, mobile deposits
    - Balances may move fast when trust changes
    - Treasury balance split and withdrawal behavior
    - Request concentration and beta data
  - - Attach cards, AP, payroll, or reimbursements
    - Operational switching costs improve retention
    - Requires software depth Erebor has not shown publicly
    - Product roadmap and integration plan
    - Request roadmap and usage forecasts
  - - Attach specialty lending
    - Credit concentration in frontier sectors
    - Could raise ARPU and loss volatility simultaneously
    - Loan pipeline by collateral type
    - Request underwriting policy
  - - Network-led referrals from founders and VCs
    - Customer base may cluster around sponsor ecosystems
    - Fast early growth but narrow diversification
    - Top 10 prospective relationships
    - Request referral-source concentration
  notes: This table treats expansion and concentration as two sides of the same strategy. The strongest wallet-share levers are also the strongest concentration vectors.
