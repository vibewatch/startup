company:
  name: Erebor
chapter:
  number: 6
  title: Customers
  summary: 'Erebor’s public customer story is still a target-segment story, not a traction story: regulators and coverage clearly define the startup, crypto, AI, defense, and founder-linked buyers the bank wants, but no public customer count or named Erebor deployment could be verified. Market analogs from Mercury, Brex, and Ramp show what validated startup-banking demand looks like in practice—multi-product workflow depth, treasury value, and finance-stack integration. That makes Erebor’s customer fit plausible, but its adoption, retention, and concentration quality remain private-evidence questions.'
sections:
- id: target-segmentation
  title: Target Segmentation and Buyer Map
  body: 'Erebor’s customer thesis is unusually clear even though its traction is not. Regulators and repeated reporting point to the same target set: venture-backed and frontier-technology companies in AI, crypto, payments, investment, defense, and adjacent manufacturing fields, plus the founders, investors, and high-net-worth individuals who sit around those networks. That means the core buyer is likely a founder, CFO, or finance lead choosing a primary operating bank, while adjacent users include controllers, operators, and relationship clients who want credit and treasury support. This is a narrower and richer segment than general small business banking, but it is also more concentrated and reputation-sensitive. In practical terms, Erebor is trying to become the primary financial hub for innovation-economy customers who care about cash management, payments, specialized credit, and regulatory comfort more than they care about generic branch access. That focus also means a small number
    of reference-quality wins could matter disproportionately to brand formation if the bank opens successfully.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU026
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-and-named-proof
  title: Adoption Proof and Named Customer Evidence
  body: 'Public adoption proof for Erebor itself remains thin. No verified customer count, no public logos tied to use cases, and no named production references were found in this review. To understand what Erebor must sell into, the best available evidence comes from incumbents serving the same segment. Mercury’s customer archive shows AI startups, global payroll platforms, and startup CFO partners using the product as a central workflow layer for treasury, invoicing, payroll, bill pay, reimbursements, and cash optimization. Brex and Ramp add a second pattern: founders increasingly expect their operating account, treasury yields, cards, AP, and automation to live inside one integrated finance stack. These analogs do not prove Erebor traction, but they do clarify the category’s proof standard and the jobs customers already pay for. In effect, Erebor is asking investors to trust segment intent first and defer direct customer validation to later diligence.'
  claimRefs:
