- id: retention-expansion-and-procurement
  title: Retention, Expansion, and Procurement Friction
  body: 'Startup-bank retention is usually earned through workflow depth rather than through contractual lock-in. The customer stories reviewed here repeatedly show multi-product usage: treasury, accounts payable, payroll, cross-border movement, reimbursements, cards, and cash-management guidance. That creates a clear land-and-expand logic for the category. Win the primary operating account, then attach treasury, cards, lending, and automation. Erebor’s challenge is that none of its public materials yet prove it can execute that arc. There are no public NRR or churn statistics, no testimonials, and no visible pre-purchase product surface that a finance team could compare against Mercury or Brex. Charter status helps on trust, but opaque disclosure still adds procurement friction, especially for startups that want to audit integrations and service quality before moving their core cash. The decision for investors is therefore whether charter status can compensate for weak pre-purchase transparency;
    for now, the answer is only partially.'
  claimRefs:
  - CU019
  - CU020
  - CU021
  - CU022
