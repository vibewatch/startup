- id: concentration-risk
  title: Expansion and Concentration Risk
  body: The same focused segment that makes Erebor strategically interesting also creates concentration risk. Startup, crypto, AI, and defense customers can bring large balances and high wallet share, but they can also move in herds and react quickly to sentiment, policy, or sector stress. The Senate’s adverse commentary reinforces that investors should not confuse sector affinity with customer diversification. If Erebor’s first customers cluster around the same founder and VC networks that back the bank, then customer acquisition may be efficient, but deposit stability, credit correlation, and reputational spillover all become more fragile. From a diligence standpoint, the bank needs to prove not just that it can attract the right logos, but that it can do so across enough subsectors, sizes, and use cases to avoid recreating a single-ecosystem concentration problem. That makes customer composition and referral-source concentration two of the most important diligence asks before any valuation
    call becomes firmer. Proof still matters.
  claimRefs:
  - CU031
  - CU032
  - CU035
  tableRefs:
  - TU005
  figureRefs: []
