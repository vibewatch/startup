companyProfile:
  summary: Erebor is a U.S. startup-banking venture pursuing a regulated national-bank model for venture-backed and frontier-technology customers after Silicon Valley Bank's collapse. Public evidence confirms charter and FDIC milestones plus a focused customer thesis, but it still leaves major gaps on product surface, customer adoption, operating metrics, and team depth.
  founders:
  - name: Palmer Luckey
    role: Founder
    background: Founder of Anduril and the public face most closely associated with Erebor's creation and defense-tech network.
    claimRefs:
    - CO015
    - CO028
  foundingLocation: United States
  headquarters: United States
  productSummary: FDIC-approved deposit and lending products for startups, technology companies, and related high-net-worth users, with likely expansion into treasury, payments, and specialty credit if launch execution is strong.
  customerFocus: Seed through growth-stage innovation-economy companies plus founders, investors, and related HNW users.
  businessModel: Net interest income, treasury and payments monetization, and specialty lending attached to primary operating-account relationships.
  stage: Growth
  fundingStatus: Approximately $350 million raised at a $4.35 billion valuation in December 2025 according to multiple public reports.
