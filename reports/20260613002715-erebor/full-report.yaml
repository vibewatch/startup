      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: SAM Opacity Is a Material Diligence Gap
            body: >-
              No published market research has disaggregated the innovation economy banking sub-segment (venture-backed
              startups, crypto companies, defense-tech contractors, AI labs) from the broader US neobanking or SMB
              commercial banking markets. The $50–80B SAM estimate in this chapter is an editorial inference from
              Mercury's $20B deposit proxy and historical VC deployment volumes. Investors should not rely on these
              estimates without commissioning primary research that segments the addressable wallet by vertical and
              customer lifecycle stage.
            calloutType: risk
            claimRefs:
              - CM030
          - type: callout
            title: National Bank Charter as Structural Differentiator
            body: >-
              Erebor's OCC national bank charter fundamentally changes its market access relative to Mercury's or Brex's
              partner-bank model. Direct Federal Reserve payment system access removes the counterparty risk
              demonstrated during the Evolve Bank consent order disruption of 2025, when Mercury customers faced
              operational disruption from a third-party bank's regulatory crisis. However, the charter also imposes
              higher capital requirements (12% tier-1 leverage ratio for three years per FDIC conditions) that constrain
              near-term lending growth.
            calloutType: insight
            claimRefs:
              - CM028
              - CM029
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Tier Structure
        blocks:
          - type: paragraph
            body: >-
              Erebor competes across three structurally distinct competitive tiers. The first and most consequential
              tier is the direct neobank layer: Mercury, Brex, Ramp, Arc, and Novo have each carved out startup and SMB
              banking niches and collectively hold more than 300,000 business accounts. Mercury is the dominant player,
              with $650 million in annualized revenue, over $20 billion in deposits, and more than 200,000 business
              accounts, making it Erebor's most direct competition for the venture-backed startup segment. Brex ($700M
              ARR) and Ramp ($1B+ ARR) compete at larger revenue scale but from different strategic positions—Brex from
              corporate cards and expense management, Ramp from spend automation—meaning they are adjacent competitors
              rather than direct banking substitutes for Erebor's full-service charter model. The second tier is the
              incumbent commercial banking layer: JPMorgan Chase, Bank of America, and Wells Fargo collectively hold the
              majority of startup deposits by dollar volume and are the effective status-quo alternative. The third tier
              is likely entrants: Stripe Treasury and Rippling each have large embedded startup customer bases and the
              infrastructure to launch banking-adjacent products. Erebor's OCC national bank charter, received in early
              2026, creates a regulatory moat over all partner-bank neobanks, but Mercury's parallel December 2025 OCC
              charter application signals this advantage may be temporary.
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP007
              - CP008
