  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              Erebor’s advantages and its risks both begin with regulation. The bank has real charter and insurance
              milestones, but those approvals came with hard constraints: capital requirements, a launch deadline,
              business-plan restrictions, and direct oversight of management changes. On top of those built-in
              constraints, the bank’s approval has become politically salient. The Senate Banking Committee criticized
              the process and governance posture, while outside industry groups have discussed legal action against the
              OCC’s broader fintech- and crypto-chartering approach. That means Erebor is not merely a startup building
              under supervision; it is also a public symbol in the debate over how far federal banking regulators should
              go in opening the perimeter to tech- and digital-asset-linked entrants. Any shift in political tone, court
              outcomes, or agency leadership could therefore hit Erebor harder than a more conventional de novo bank.
              The same is true for digital-asset legislation and agency guidance: even if Erebor is allowed to proceed,
              the rules around stablecoins, custody, and tokenized securities are still being clarified.
