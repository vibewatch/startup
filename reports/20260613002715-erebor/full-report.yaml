            body: >-
              Erebor’s customer thesis is unusually clear even though its traction is not. Regulators and repeated
              reporting point to the same target set: venture-backed and frontier-technology companies in AI, crypto,
              payments, investment, defense, and adjacent manufacturing fields, plus the founders, investors, and
              high-net-worth individuals who sit around those networks. That means the core buyer is likely a founder,
              CFO, or finance lead choosing a primary operating bank, while adjacent users include controllers,
              operators, and relationship clients who want credit and treasury support. This is a narrower and richer
              segment than general small business banking, but it is also more concentrated and reputation-sensitive. In
              practical terms, Erebor is trying to become the primary financial hub for innovation-economy customers who
              care about cash management, payments, specialized credit, and regulatory comfort more than they care about
              generic branch access. That focus also means a small number of reference-quality wins could matter
              disproportionately to brand formation if the bank opens successfully.
