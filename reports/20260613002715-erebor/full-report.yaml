      - number: '2.2'
        title: TAM, SAM, and Market Sizing—Multiple Lenses
        blocks:
          - type: paragraph
            body: >-
              Multiple independent research firms publish neobanking and digital banking market estimates that, despite
              wide methodology divergence, converge on a high-growth trajectory. Grand View Research estimates the
              global neobanking market at $211.2 billion in 2025, growing at a CAGR of 61.9% to reach $9,384.73 billion
              by 2033, driven by business account dominance (64.71% revenue share in 2025) and enterprise adoption.
              Markets and Data provides a US-specific view: $34.56 billion in 2024 growing to $263.67 billion by 2032 at
              a 27.31% CAGR. Cheqly places the US neobank market at approximately $15.64 billion in 2022 with a
              projection of $451.45 billion by 2030 at a 52.2% CAGR from 2023 to 2030. Awisee reports 350 million global
              neobank users in 2025 and 53.7 million projected US digital-only bank account holders by the same year.
              None of these estimates disaggregate the innovation economy banking subsegment that Erebor specifically
              targets—venture-backed startups, crypto companies, AI labs, defense contractors. As a rough SOM proxy,
              Mercury's $20 billion in deposits and $650 million in annualized revenue as of September 2025 suggests
              that even a mid-tier player serving a fraction of the addressable startup banking wallet can reach
              meaningful scale. A conservative total SAM for the US innovation economy banking market—applying the
              startup and defense-tech share of US venture capital activity to the total commercial banking TAM—yields
              an estimated $50 billion to $80 billion in annual deposit-and-credit wallet. No authoritative publisher
              has disaggregated this sub-TAM, which remains a material evidence gap.
