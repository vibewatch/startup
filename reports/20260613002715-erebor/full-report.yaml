chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Market Role, and Public Footprint
        blocks:
          - type: paragraph
            body: >-
              Erebor is a Columbus, Ohio-headquartered de novo national-bank project that emerged in 2025 with an
              explicit promise to fill part of the vacuum left by Silicon Valley Bank’s March 2023 collapse. Public
              reporting and regulatory disclosures consistently describe the bank as targeting the innovation economy:
              technology, payment systems, investment, defense, artificial intelligence, manufacturing, and
              virtual-currency participants that either felt underserved by incumbent banks or wanted a lender more
              willing to accommodate digital-asset-adjacent business models. The public record is unusually thin for a
              company that reached multibillion-dollar valuation territory within months, but the available documents
              are directionally consistent on three points: Erebor is a federally chartered-bank effort rather than a
              pure software layer, it is designed to serve risk-tolerant startup and frontier-tech customers, and it is
              using stablecoin and digital-asset functionality as part of its differentiation rather than as a side
              product. The official web footprint remains sparse, which itself is a material diligence fact because it
              limits external verification of product breadth, customer onboarding details, and launch status.
