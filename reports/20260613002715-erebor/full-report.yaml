      - number: '3.4'
        title: Switching Costs, Multi-Homing, Trust, and Regulatory Posture
        blocks:
          - type: paragraph
            body: >-
              Startup banking exhibits structurally lower switching costs than consumer banking because accounts are
              FDIC-insured (eliminating counterparty concentration risk), banking APIs are standardized, and many
              founders maintain multiple simultaneous banking relationships. Mercury's organic distribution through Y
              Combinator and VC accelerator networks is the closest analog to a switching cost moat in this segment:
              founders who open Mercury accounts during YC onboarding rarely switch unless forced by account closures or
              regulatory disruptions. Evolve Bank & Trust's 2024 consent order disrupted Mercury customers and
              demonstrated that the partner-bank model carries latent regulatory contagion risk—a risk Erebor's de novo
              charter model structurally avoids. Mercury's subsequent pivot to Column N.A. as its primary partner bank
              illustrates the switching dependency the partner-bank model imposes on Mercury itself. On the adverse
              regulatory side, Senator Elizabeth Warren's February 2026 letter to the OCC cited Erebor's fast-tracked
              charter approval as a potential conflict of interest tied to its politically connected investors, creating
              a material reputational signal for politically moderate startup founders who may prefer the politically
              neutral positioning of Mercury or Brex. Erebor's 12% tier-1 leverage ratio requirement for the first three
              years—imposed by the FDIC—is materially more capital-intensive than Mercury's partner-bank model, where
              the partner holds regulatory capital. This capital burden constrains Erebor's ability to deploy its equity
              capital productively during its launch phase and represents a structural cost disadvantage relative to
              neobank peers who offload regulatory capital requirements to partner institutions.
            claimRefs:
