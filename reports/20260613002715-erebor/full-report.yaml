              Startup, crypto, AI, and defense customers can bring large balances and high wallet share, but they can
              also move in herds and react quickly to sentiment, policy, or sector stress. The Senate’s adverse
              commentary reinforces that investors should not confuse sector affinity with customer diversification. If
              Erebor’s first customers cluster around the same founder and VC networks that back the bank, then customer
