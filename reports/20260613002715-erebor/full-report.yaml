              - CV034
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Price outruns proof
            body: >-
              Erebor may yet earn its valuation, but current public evidence is still closer to milestone investing than
              to fully underwritten growth investing.
            calloutType: recommendation
            claimRefs:
