              - CV030
      - number: '8.2'
        title: Thesis Versus Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The bull thesis is conceptually strong. Erebor is pursuing a real post-SVB gap: a chartered, insured bank
              designed for startups and frontier-tech customers that may value sector understanding, relationship depth,
              and specialty credit more than generic branch banking. If that bank can win the operating account, it can
              potentially expand into treasury, payments, and lending. The anti-thesis is equally strong. Erebor’s
              valuation already implies meaningful future success even though the public record lacks customer proof,
              product transparency, and financial disclosure. The question is therefore not whether the market need
              exists; it is whether investors should pay close to proven-peer prices before the company demonstrates
              execution. On today’s evidence, the answer is no.
            claimRefs:
              - CV002
              - CV003
              - CV016
              - CV017
              - CV022
              - CV038
              - CV039
