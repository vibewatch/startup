              - CV025
      - number: '8.4'
        title: Comparable Valuation Benchmarks
        blocks:
          - type: paragraph
            body: >-
              The most useful comparable set is blended. Mercury is the most relevant private benchmark because it
              serves startups directly and now discloses a dense proof pack—customers, revenue, profitability, and
              product roadmap—at a $5.2 billion valuation. Chime, SoFi, Nubank, and LendingClub are less direct, but
              they establish how public markets reward or punish fintech-bank hybrids once metrics are visible. Ramp is
              not a bank, but it demonstrates what software-led finance can command when growth and free cash flow are
              undeniable. On that spectrum, Erebor stands out not because its valuation is obviously impossible, but
              because it has reached a large valuation before providing the proof bundle that most comps either already
              have or are forced to publish.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV026
              - CV035
              - CV036
              - CV037
          - type: table
            tableRef: TV004
            claimRefs:
              - CV006
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.5'
        title: Recommendation, Confidence, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The recommended posture is research-more, with low confidence, high risk, and an expensive valuation
              stance. That is not a denial of the opportunity. It is a judgment about timing and evidence quality.
              Erebor may become a uniquely valuable bank for the innovation economy, but the current public record does
              not justify paying for that future as though it were already de-risked. Investors should require a short
              list of proof points before moving up the conviction curve: live product demonstration, referenceable
              customers, segment concentration data, underwriting policy, deposit behavior assumptions, and management
              depth. If those checks are strong, Erebor could still grow into the present valuation. If they are weak,
              today’s price leaves little margin for narrative error. Until those proofs appear, prudence should
              dominate excitement.
            claimRefs:
              - CV001
              - CV023
              - CV024
              - CV025
              - CV027
              - CV028
              - CV029
              - CV031
              - CV032
              - CV040
