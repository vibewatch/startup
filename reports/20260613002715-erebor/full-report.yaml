        title: Product Definition
        blocks:
          - type: paragraph
            body: >-
              Erebor’s product can be defined more confidently by whom regulators say it will serve than by what the
              company itself shows on the open web. The FDIC, Reuters, and later trade coverage all converge on the same
              core job-to-be-done: provide deposit accounts, payments, and lending capacity to venture-backed and
              frontier-technology businesses that felt underserved after SVB’s failure, plus the founders, investors,
              and high-net-worth individuals around those networks. That places Erebor closer to a sector-specialist
              commercial bank than to a single-feature neobank. The open question is packaging. The company’s own public
              domains do not currently present an accessible onboarding flow, pricing page, feature grid, or docs
              library, so the most defensible view is that Erebor is a startup-native banking proposition whose customer
              workflow has been articulated through regulators and media rather than through a launch-ready public
              product surface. That asymmetry between market clarity and product opacity is central to diligence,
              because customers can understand the promise while investors still cannot verify the full service design.
