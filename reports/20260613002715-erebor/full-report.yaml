      - number: '3.2'
        title: Direct Fintech Competitor Profiles
        blocks:
          - type: paragraph
            body: >-
              Mercury is the benchmark competitor for Erebor, having absorbed a substantial share of the SVB-displaced
              startup banking market. Mercury's $20 billion in deposits and $650 million ARR were achieved without a
              national bank charter, relying on partner banks Choice Financial Group and Column N.A. for regulatory
              infrastructure. Revenue growth decelerated from 97% year-over-year in 2024 to approximately 41% in 2025
              after Federal Reserve rate cuts compressed net interest margin—a dynamic Erebor will share. Mercury filed
              an OCC national bank charter application in December 2025, the most direct competitive threat to Erebor's
              structural differentiation. Mercury's Treasury product offers money-market fund yields up to 4.39% net
              annually for balances above $500K, competing directly with the treasury yield product Erebor would offer.
              Brex generated approximately $700 million in annualized revenue as of August 2025 but has strategically
              shifted toward mid-market and enterprise customers since 2022, explicitly reducing its competitive overlap
              with Erebor's early-stage startup core. Brex requires venture capital or institutional investor backing
              for most accounts, which structurally filters out the bootstrapped and pre-seed segment Erebor targets.
              Ramp surpassed $1 billion in annualized revenue by November 2025 with over 50,000 business customers and
              $100 billion in annualized payment volume. Ramp does not offer FDIC-insured deposits and is not a
              chartered bank; it is a spend-management platform that pairs with a banking provider, making it largely
              complementary to Erebor rather than a direct substitute. Arc offers startup treasury management and
              banking services targeting venture-backed companies with high-yield treasury accounts and venture debt
              products. Novo serves micro-SMBs and solopreneurs with mobile-first checking accounts and Mastercard debit
              cards, targeting a lower-risk and less crypto-inclusive segment than Erebor's defense and AI focus.
