          - type: callout
            title: Ramp Is Complementary, Not Substitutive
            body: >-
              Ramp's $1B+ ARR and 50,000 business customers are not a direct competitive threat to Erebor's banking
              proposition because Ramp does not offer FDIC-insured deposits. The pattern established in the Mercury
              ecosystem—where many startups use Ramp for expense automation while banking with Mercury—is likely to
              replicate at Erebor. This means Erebor's launch strategy can position itself as Ramp-compatible rather
              than competing against Ramp's spend-management moat.
