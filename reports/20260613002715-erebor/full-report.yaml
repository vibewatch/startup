      - number: '1.3'
        title: Regulatory Timeline, Charter Status, and Operating Constraints
        blocks:
          - type: paragraph
            body: >-
              Erebor’s most concrete milestones are regulatory rather than commercial. The public application timeline
              cited by Senator Elizabeth Warren’s February 2026 letter places the OCC charter filing on June 11, 2025.
              By October 15, 2025, the OCC had granted preliminary conditional approval, and PYMNTS’ summary of the
              conditional-approval letter says the proposed bank was described as a full-service insured national bank
              targeting technology companies and ultra-high-net-worth individuals that use virtual currencies. On
              December 16, 2025, the FDIC approved deposit insurance, saying Erebor would focus on deposit and lending
              products for technology, payment-systems, investment, and defense businesses, including virtual-currency
              market participants. The FDIC also imposed hard guardrails: a 12% tier 1 leverage ratio for the first
              three years, failure-resolution processing protocols, and a twelve-month outside date to establish the
              bank unless extended. Reuters reporting on February 6, 2026 added that Erebor had become the first bank to
              receive a national bank charter during the second Trump administration, a notable milestone because it
              suggests Erebor crossed from aspirational charter applicant to federally approved operating bank within
              less than eight months.
