            body: >-
              Public evidence does not reveal Erebor’s internal core banking stack, but it does reveal the technical
              standard it must meet. Modern startup-banking competitors now expose APIs, developer docs, OAuth-based
              integrations, and treasury rails that let founders automate account data, payments, treasury, and
              operating workflows. Mercury’s public API and CLI surface, Plaid’s Auth flows, Stripe Treasury’s
              financial-account features, and Unit’s infrastructure model together outline the expected operating
              architecture for any credible software-enabled business bank: customer interface and onboarding, ledger
              and account systems, payments and card rails, compliance and risk controls, and an integration layer for
              data sharing and automation. Erebor may have analogous internals, but it has not published them. That
              absence matters because implementation speed, partner integration depth, and support quality are key
              buying criteria in startup banking, especially when customers already use treasury, ERP, payroll, and AP
