  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current Financing and Valuation Context
        blocks:
          - type: paragraph
            body: >-
              Erebor’s latest publicly reported financing context is impressive on headline terms and thin on
              underwriting detail. Multiple outlets said the company reached about a $4.35 billion valuation in December
              2025 after an earlier July 2025 fundraising target around $2 billion. Public evidence also supports the
              charter and FDIC milestones that likely helped drive that step-up. What it does not support is a
              comparable step-up in disclosed customers, deposits, revenue, or product depth. That matters because the
              valuation is no longer abstract; it now sits in the same neighborhood as significantly more proven
              startup-banking or digital-finance businesses. In other words, investors are being asked to pay a
              substantial fraction of mature-peer value for a bank whose regulatory path is visible but whose commercial
              traction is still mostly private. The practical implication is that investors are marking strategy before
              they can mark operations.
            claimRefs:
              - CV004
              - CV005
              - CV014
              - CV015
              - CV030
          - type: table
            tableRef: TV001
            claimRefs:
