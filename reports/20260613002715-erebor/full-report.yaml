      - number: '7.3'
        title: Partner, Concentration, and Model Risk
        blocks:
          - type: paragraph
            body: >-
              The core business-model risk is that the exact customer profile that makes Erebor attractive can also make
              it fragile. Crypto, AI, defense, and founder-linked wealthy clients may offer larger balances, stronger
              networks, and more willingness to buy specialty products. They may also be correlated in sentiment,
              funding cycles, and policy exposure. The SVB review is the clearest category reminder that concentrated
              innovation-economy banking can fail when liquidity and governance discipline lag ambition. On top of
              customer concentration sits partner dependence: payments rails, data connections, and possible
              infrastructure vendors are essential, but largely undisclosed. If Erebor underinvests in third-party
              oversight or expands product scope before control systems are mature, then concentration risk, execution
              risk, and regulatory risk all start reinforcing each other. That makes the risk register dynamic rather
              than fixed, because a bank serving these sectors may need to absorb new control and reporting obligations
              while still proving commercial fit.
            claimRefs:
              - CR008
