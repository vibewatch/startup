      - number: '3.3'
        title: Incumbent Banks, Status Quo, and Internal Build
        blocks:
          - type: paragraph
            body: >-
              JPMorgan Chase is the most formidable long-term incumbent competitor. It is the largest US commercial bank
              by assets, ranked number one in small business digital banking by J.D. Power in 2025, and has invested
              significantly in digital SMB tools. Its Business Complete Banking account starts at $15 per month
              (waivable with a $2,000 average daily balance) and charges standard domestic wire fees, creating a
              structural cost disadvantage relative to zero-fee neobanks. However, Chase's brand trust, credit
              facilities, and in-person branch network are genuine competitive strengths for startups seeking venture
              debt or credit relationships at scale. SVB's March 2023 collapse permanently disrupted the incumbent
              startup banking model: SVB had served as the dominant primary banking provider for venture-backed
              startups, and its failure created a structural vacancy that Mercury, Brex, and Erebor are each seeking to
              fill. The status-quo alternative for many startups is multi-homing: maintaining a primary banking
              relationship at a top-five commercial bank while using Mercury or Brex for operating account convenience.
              This multi-homing pattern means Erebor is not always competing to replace Mercury—it may be competing to
              displace one leg of a two-bank relationship. Building an in-house treasury management function as a
              substitute is a theoretical option for startups above approximately $50 million in deposits, but the
              operational complexity and compliance burden make it uneconomical for the majority of Erebor's target
              customers.
            claimRefs:
              - CP007
