        title: Exhibits
        blocks:
          - type: callout
            title: Mercury's OCC Charter Application Is the Defining Threat
            body: >-
              Mercury filed an OCC national bank charter application in December 2025. If approved within the typical
              12–24 month window, Mercury would eliminate its partner-bank regulatory dependency and obtain the same
              direct Federal Reserve payment access that is currently Erebor's primary structural differentiator.
              Erebor's competitive moat window is likely 12–24 months before Mercury's charter application either
              advances materially or creates a credible parallel offering. Investors must diligence whether Erebor can
              convert its first-mover charter advantage into durable customer lock-in before Mercury closes the gap.
            calloutType: risk
