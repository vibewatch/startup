              - CV023
              - CV024
              - CV025
      - number: '8.3'
        title: Bull, Base, and Bear Scenarios
        blocks:
          - type: paragraph
            body: >-
              Because revenue and deposit data are private, scenarios have to be milestone-driven instead of
              spreadsheet-precise. The bull case assumes a clean launch, strong early customer concentration in
              favorable cohorts, and successful expansion into higher-wallet-share products. The base case assumes
              launch and some customer adoption, but slower proof-building, more time under regulatory constraints, and
              a valuation that needs years of execution to be earned. The bear case assumes delays, governance noise, or
              concentration concerns that keep Erebor from escaping the “promising but opaque” bucket. In that downside
              state, the current valuation would be difficult to defend. This uncertainty is why the appropriate stance
              is not a hard negative, but a disciplined wait for proof.
            claimRefs:
              - CV018
              - CV019
              - CV020
              - CV021
              - CV033
              - CV034
