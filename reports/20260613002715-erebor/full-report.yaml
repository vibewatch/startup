              as a potential conflict of interest tied to Trump-aligned billionaire investors. Newsweek's coverage
              amplified this framing. For a startup banking product targeting VC-backed tech founders—many of whom are
              politically moderate or Democratic-leaning—this adverse political signal is a material customer
              acquisition risk that Mercury's neutral positioning does not face. Erebor's management should address this
              head-on in its launch messaging.
