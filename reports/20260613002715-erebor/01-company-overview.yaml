- id: leadership-sponsorship
  title: Leadership, Sponsors, and Governance Signals
  body: 'The leadership and sponsorship profile is one of the clearest explanations for why Erebor attracted intense attention so quickly. Palmer Luckey is the founding public face, while Joe Lonsdale and Peter Thiel’s Founders Fund are repeatedly identified as important backers. Reporting in Business Insider’s Africa edition says Luckey founded Erebor, Jacob Hirshman and Owen Rapaport were positioned as co-CEOs, and former Valley National Bank CFO Mike Hagedorn was slated to serve as president. Public coverage also names independent directors such as Diogo Monica and Michael Mosier, but a complete board roster and ownership cap table have not been released. Joe Lonsdale’s 8VC biography reinforces the network effect behind the venture: Lonsdale is a Palantir co-founder and longstanding defense-and-enterprise investor whose portfolio orientation overlaps closely with Erebor’s target customer set. That overlap strengthens founder-market fit, but it also raises concentration and governance
    questions because the same network that supplies customers, investors, and regulators can create perceived favoritism risk when approvals move unusually quickly.'
  claimRefs:
