- id: capital-trajectory
  title: Valuation Step-Up, Strategic Narrative, and Evidence Gaps
  body: 'The capital story moved almost as fast as the charter process. Business Insider reported in July 2025 that Erebor was seeking at least $225 million at a valuation of roughly $2 billion. By late December 2025, PYMNTS, CryptoNews, FinanceFeeds, Blockonomi, and Ohio Tech News all cited a financing round of roughly $350 million at a $4.35 billion valuation, framing the step-up as a reaction to regulatory progress and investor demand for a startup-focused bank purpose-built for crypto, AI, defense, and manufacturing companies. The speed of that valuation jump is strategically important, but it also amplifies due-diligence gaps: the public record still does not provide customer count, revenue, deposit balances, headcount, loss rates, or proof of durable multi-product adoption. Publicly visible official domains add to the opacity. erebor.com is an unrelated long-running personal site, while ereborbank.com resolves but exposes little readable product content through a sparse redirecting
    landing page. In practice, outside observers are being asked to underwrite a venture whose regulatory milestones are easier to verify than its commercial traction, operational readiness, or governance maturity.'
  claimRefs:
