company:
  name: Erebor
chapter:
  number: 1
  title: Company Overview
  summary: Erebor is a 2025-launched de novo bank project aimed at the startup and innovation economy categories left exposed by Silicon Valley Bank’s collapse. Public evidence most strongly supports regulatory and financing milestones — OCC conditional approval, FDIC deposit-insurance approval, and a reported December 2025 $350M financing at a $4.35B valuation — while leaving customer traction, revenue, and product depth materially under-disclosed.
sections:
- id: founding-identity
  title: Identity, Market Role, and Public Footprint
  body: 'Erebor is a Columbus, Ohio-headquartered de novo national-bank project that emerged in 2025 with an explicit promise to fill part of the vacuum left by Silicon Valley Bank’s March 2023 collapse. Public reporting and regulatory disclosures consistently describe the bank as targeting the innovation economy: technology, payment systems, investment, defense, artificial intelligence, manufacturing, and virtual-currency participants that either felt underserved by incumbent banks or wanted a lender more willing to accommodate digital-asset-adjacent business models. The public record is unusually thin for a company that reached multibillion-dollar valuation territory within months, but the available documents are directionally consistent on three points: Erebor is a federally chartered-bank effort rather than a pure software layer, it is designed to serve risk-tolerant startup and frontier-tech customers, and it is using stablecoin and digital-asset functionality as part of its differentiation
    rather than as a side product. The official web footprint remains sparse, which itself is a material diligence fact because it limits external verification of product breadth, customer onboarding details, and launch status.'
  claimRefs:
