companyProfile:
  summary: >-
    Unconventional AI emerged from stealth in December 2025 around founder and CEO Naveen Rao, joined by
    cofounders MeeLan Lee, Sara Achour, and Michael Carbin. The company is pursuing a physics-first,
    mixed-signal AI compute stack for datacenter inference, with official materials framing the product as
    a new substrate for intelligence and targeting 1000x energy-efficiency improvements at the system
    level. Public sources consistently support a $475 million seed round at a reported $4.5 billion
    valuation, but they still show a company in research mode rather than in commercial scale-up: no
    public product catalog, no disclosed customers, and no third-party benchmark package sufficient to
    underwrite the valuation as an operating-company mark.
