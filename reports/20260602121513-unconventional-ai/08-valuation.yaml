  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: terms-opacity
    missingEvidence: The preferred stock terms, liquidation preferences, anti-dilution mechanics, pro-rata rights, and governance package for the seed round.
    whyItMatters: Return math can change materially if the round includes strong downside protections or unusual control rights.
    diligencePath: Request the signed term sheet or financing docs and map the cap-table stack before underwriting the mark.
    relatedQuestionRefs:
    - QV020
    - QV024
  - type: private-evidence-only
    severity: material
    topic: benchmark-gap
    missingEvidence: Third-party or reproducible benchmark data that shows energy efficiency, throughput, latency, and cost versus named baselines.
    whyItMatters: The valuation depends on a technical leap that is not yet externally verified.
    diligencePath: Request benchmark methodology, lab reports, and any customer validation packets tied to the 1000x claim.
    relatedQuestionRefs:
    - QV008
    - QV025
  - type: private-evidence-only
    severity: material
    topic: commercial-proof
    missingEvidence: Named design partners, pilot agreements, or customer references that indicate willingness to evaluate or buy the architecture.
    whyItMatters: Without demand evidence, the current mark remains a technology option rather than a commercially de-risked asset.
    diligencePath: Request LOIs, pilot contracts, or a funnel view that identifies target customers and stage of engagement.
    relatedQuestionRefs:
    - QV005
    - QV023
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-set
    missingEvidence: A broader set of disclosed private AI and AI-hardware financings with directly comparable milestones and terms.
    whyItMatters: Private round data is selective, so the comparable table is directional rather than exhaustive.
    diligencePath: Expand the comp set with paid databases or investor memos that include round terms, revenue state, and customer proof.
    relatedQuestionRefs:
    - QV011
    - QV012
    - QV013
    - QV014
