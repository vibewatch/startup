- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Lens
  - Argument
  - Public support
  - What would change the view
  rows:
  - - Bull
    - Real compute-energy bottlenecks create demand for radically more efficient AI hardware.
    - Official and investor sources consistently frame power and efficiency as the core problem.
    - Independent benchmark data showing the architecture clears a meaningful efficiency threshold.
  - - Bull
    - Rao and the syndicate represent a scarce founder-plus-capital combination that can recruit talent and survive long cycles.
    - TechCrunch, a16z, Lightspeed, and market coverage all point to founder pedigree and elite backing.
    - Evidence that recruiting and follow-on access are weaker than the market assumes.
  - - Bull
    - The 2025-2026 market is willing to pay extraordinary seed prices for frontier AI founders.
    - Thinking Machines and SSI show the market can support extreme early valuations.
    - A sharp reset in frontier-AI private pricing or failed next rounds for comparable companies.
  - - Bear
    - Unconventional has no public product, customer, or revenue proof today.
    - Reviewed sources disclose the vision and funding but not commercial traction.
    - Named pilots, design partners, or revenue-bearing contracts.
  - - Bear
    - Management describes the next several years as research and prototype iteration.
    - The Register and DCD both quote Rao on a multi-year path to the right paradigm.
    - A faster-than-expected benchmark or commercialization timeline.
  - - Bear
    - The valuation already prices success cases that may never materialize in hardware.
    - GeekWire, CNBC, Forbes, and Graphcore history all show the downside of founder-pedigree overpayment.
    - A later round or strategic deal that validates the current mark with better proof.
  notes: Bull and bear arguments are intentionally paired. This chapter is about price discipline, not a generic company-quality score.
