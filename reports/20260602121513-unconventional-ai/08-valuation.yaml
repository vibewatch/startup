- id: decision-and-diligence
  title: Recommendation, Entry Discipline, and Diligence Priorities
  body: |-
    The public-data recommendation is research-more, not buy. That is not a statement that Unconventional lacks upside; it is a statement that too much of the upside is already capitalized in the entry price relative to what outsiders can verify. A buyer at the current mark is effectively underwriting benchmark success, customer interest, capital availability, and survivable round terms before any of those items are public. That can still work in a scarcity market, but expected returns compress sharply when a seed investor pays something close to a successful future-case price upfront.

    Accordingly, entry discipline should focus on what would actually change the valuation read. Evidence that would move the case upward includes externally credible performance benchmarks, named design partners or pilots, and proof that the financing terms do not shift downside asymmetrically away from new entrants. Evidence that would break the thesis includes a follow-on round below or flat to the current mark, continued absence of benchmark disclosure, or evidence that customers are unwilling to test the architecture. Until those questions are answered, the current price should be treated as a stretched but still strategically interesting option value rather than a clearly supported fair mark.
