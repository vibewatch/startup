    - medium
    - Valuation, timeline, and comp facts are public, but economics and terms remain private.
    - Treat the conclusion as directional rather than final.
  - - Risk rating
    - high
    - The company is pre-product, hardware-heavy, and explicitly on a multi-year research path.
