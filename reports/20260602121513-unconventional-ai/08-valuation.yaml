  - - Valuation stance
    - stretched
    - Current pricing embeds technical proof and commercialization milestones that are not yet public.
    - Require either better proof or a better price.
  - - Scarcity premium
    - real but prepaid
    - Founder pedigree and syndicate quality explain why the company cleared the round.
    - Do not mistake access premium for proof premium.
  - - What would upgrade the view
    - benchmarks plus demand
    - Credible efficiency benchmarks and named design partners would materially change the underwriting case.
    - Re-open the case if those milestones appear before the next round.
