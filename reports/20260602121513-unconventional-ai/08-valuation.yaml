  rows:
  - - Unconventional AI
    - 475M seed at 4.5B valuation; round could grow toward 1B
    - Pre-product hardware research; no public customers or revenue disclosed
    - Anchor row for the current mark being tested
    - Price reflects scarcity and thesis more than disclosed operating proof
  - - Safe Superintelligence
    - 1B raise at 5B in 2024; 2B at 32B reported in 2025
    - Frontier-model lab priced on founder pedigree and compute ambition
    - Shows how rare AI founders can clear massive early valuations
    - Software or model-lab economics are not the same as custom hardware economics
  - - Thinking Machines Lab
    - 2B seed at 12B valuation in 2025
    - Another founder-led pre-product frontier AI outlier
    - Shows the market ceiling for scarcity-premium seed pricing
    - Referenced through secondary reporting rather than direct company disclosures here
  - - Groq
    - 640M at 2.8B in 2024; 750M at 6.9B in 2025
    - Inference hardware with actual cloud and on-prem products
    - Useful proof-versus-price comp for AI hardware re-rating
    - Different architecture and already had clearer commercialization
  - - Tenstorrent
    - 693M round at valuation above 2.6B in 2024
    - AI hardware company with disclosed customer contracts and roadmap cadence
    - Highlights that commercial proof can coexist with lower valuation than Unconventional's seed mark
    - TechCrunch is the clearest accessible source for valuation and contract detail
  - - Graphcore
    - Struggled into sale talks over ~£400M and later needed SoftBank capital after acquisition
    - Well-funded AI chip challenger that struggled to monetize despite technical promise
    - Downside reminder that hardware optionality can compress severely
    - Historical distress comp, not an apples-to-apples round pricing benchmark
  notes: This is a directional comp set made from public 2024-2026 AI and AI-hardware financings or transactions with fetchable valuation context. It is intentionally not a precise market map.
