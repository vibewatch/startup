- id: stretch-risks
  title: Why the Valuation May Already Be Stretched
  body: |-
    The biggest reason the valuation looks stretched is that management and press coverage both describe a multi-year research program rather than near-term productization. The Register quotes Rao saying the company will not have a product in two years and that the next several years are about cracking a new paradigm. Data Center Dynamics similarly describes multiple prototype and architecture experiments before the company knows what scales best. In other words, investors are paying for architecture-selection risk as well as execution risk.

    Adverse sources make the same point more bluntly. GeekWire’s Virgin Unicorns framework argues that early-stage AI storytelling can substitute for traction. CNBC’s 2026 survey shows bubble concern around record AI valuations. Forbes and TechCrunch both describe a market where elite founders and large funds are pulling seed prices upward faster than the underlying disclosure standards have improved. Graphcore is a useful cautionary reference: a well-funded AI-chip challenger can still struggle to commercialize and end up sold or recapitalized on unattractive terms. Unconventional may ultimately justify the price, but the current mark leaves little room for delay, weak benchmarks, or a financing reset.
