- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold or signal
  - Why it matters
  - Action implication
  rows:
  - - No benchmark disclosure
    - No credible external benchmark package before the next financing process
    - The technical leap is the core reason the valuation exists.
    - Move the case toward avoid or require a substantial price reset.
  - - No customer validation
    - No named pilot, design partner, or reference customer before follow-on fundraising
    - Shows that technical intrigue is not converting into demand.
    - Treat the current mark as unsupported by commercial proof.
  - - Flat or down round
    - Next primary round fails to clear the current 4.5B mark
    - Confirms that the seed round overreached public or private support.
    - Do not average in without a new thesis and revised return math.
  - - Execution slippage
    - Founder departure or material delay in prototype roadmap
    - This company is unusually dependent on technical leadership and recruiting.
    - Raise the probability of the bear case materially.
  - - Manufacturing economics fail
    - Benchmarks improve but cost, yield, or packaging assumptions do not support adoption
    - A better chip is not enough if customers cannot buy a working system economically.
    - Reframe the case as technical success with weak venture economics.
  notes: Triggers are designed to be observable and investment-relevant. They are meant to force discipline before the next capital event.
