- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Implied public-data valuation logic
  - Probability signal
  - Key risks
  rows:
  - - Bull
    - Benchmark data confirms a step-change in efficiency, first design partners appear, and follow-on capital remains abundant.
    - A 6-12B range becomes more credible because the company starts to resemble a validated frontier hardware platform rather than a pure research option.
    - Possible but not yet visible.
    - Hardware proof could still fail to translate into customer adoption or manufacturable economics.
  - - Base
    - Prototype progress is real but incomplete, customers are still evaluating, and the next round funds de-risking rather than scale.
    - A 2.5-4.5B range is defensible because technical progress offsets some uncertainty but does not yet justify major upside from today’s mark.
    - Most consistent with current public evidence.
    - Time-to-product stretches, and future dilution eats much of the upside.
  - - Bear
    - Benchmarks disappoint, no external demand signal appears, or financing conditions harden before proof.
    - A sub-2B or strategic-value outcome becomes plausible because the company has more science than commercial evidence.
    - Always live in deep-tech hardware.
    - Down round, forced recap, or strategic sale can destroy venture returns from an already-elevated seed entry.
  notes: These are heuristic scenario bands anchored to public comparables and milestone logic, not DCF outputs or management guidance.
