      "id": "milestones-and-operating-signals",
      "title": "Milestones, Operating Signals, and Disclosure Gaps",
      "body": "The company’s public timeline is short but already informative. Coverage of Rao’s Databricks departure appeared in September 2025, fundraising speculation surfaced in October, and the company formally launched on 2025-12-08 with both the official announcement and the financing disclosure. That same launch window produced investor essays from a16z and Lightspeed, suggesting the syndicate wanted to frame the company as a first-principles response to AI’s power problem from day one. By early 2026, CNBC was explicitly naming Bezos Expeditions as a backer, while Unconventional’s own blog had shifted into a research cadence with April and May 2026 posts on neural co-evolution, memory bottlenecks, mixed-signal tradeoffs, and grantmaking.\n\nThose milestones show a company that is actively recruiting, publishing technical worldview content, and building mindshare. They do not yet show a product ship date, customer deployment, or operating scale. Key cover metrics remain undisclosed, including revenue, ARR, customer count, headcount, and formal governance structure. Even basic identity fields are not fully settled: the source set conflicts on headquarters, with some articles calling the startup San Francisco-based and another calling it San Diego-based. The correct interpretation is that the public evidence establishes a real and heavily funded company, but not yet a fully disclosed operating business.",
