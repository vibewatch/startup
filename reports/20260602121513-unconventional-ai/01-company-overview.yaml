      "id": "founders-leadership",
      "title": "Founders, Leadership, and Governance",
      "body": "Naveen Rao is the company’s central leadership asset and the main reason investors appear willing to underwrite an enormous pre-commercial valuation. Public sources consistently describe him as the former head of AI at Databricks, the co-founder of MosaicML, and the earlier co-founder of Nervana Systems. Those exits matter because they link Rao to both software-system scaling and AI hardware execution, which is exactly the blend Unconventional claims it needs. Official materials also add a neuroscience credential from Brown University, reinforcing the company’s biology-inspired narrative.\n\nThe named cofounder bench is also notable, though less thoroughly corroborated than Rao’s biography. Official and investor materials identify MeeLan Lee, Sara Achour, and Michael Carbin as cofounders; Lightspeed describes Lee as an analog-circuit veteran from Google, Qualcomm, and Intel, while Achour and Carbin are presented as researchers from Stanford and MIT focused on novel computing substrates. Even so, governance disclosure remains thin. The reviewed materials did not provide a board roster, control rights, or a detailed executive team beyond the founders, so key-person dependence on Rao remains high and formal oversight is still a diligence gap.",
