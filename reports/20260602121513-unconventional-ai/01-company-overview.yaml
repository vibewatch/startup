    "title": "Company Overview",
    "summary": "Unconventional AI emerged from stealth on 2025-12-08 around founder Naveen Rao and a thesis that AI will hit an energy bottleneck without radically more efficient compute. Reviewed sources consistently support a $475 million seed round at a $4.5 billion valuation led by Lightspeed and Andreessen Horowitz, but they still leave headquarters, commercialization timing, and key operating metrics unresolved."
  },
