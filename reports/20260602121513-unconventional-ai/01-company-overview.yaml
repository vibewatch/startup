    {
      "id": "adverse-views-and-key-risks",
      "title": "Adverse Views and Key Risks",
      "body": "The company’s thesis is compelling precisely because the external problem is real. IEA says data-center electricity demand rose sharply in 2025 and that grid interconnections, transformers, turbines, advanced chips, and permitting are all tightening. Utility Dive’s 2026 reporting adds that developers are chasing time-to-power, requesting hundreds of megawatts, and increasingly turning to onsite generation when the grid cannot keep pace. Those conditions support Unconventional’s basic argument that efficiency matters more than ever — but they also complicate adoption, because customers facing immediate power shortages may prioritize reliable, available infrastructure over elegant but unproven architectures.\n\nThat is why the valuation deserves skepticism. Byteiota’s framing is directionally useful: analog and neuromorphic approaches can promise major efficiency gains, but they still face precision, manufacturability, tooling, and ecosystem hurdles before they can challenge entrenched GPU-based stacks. A16z itself acknowledges that this is an ambitious attempt to open a new point in hardware design space rather than an incremental product upgrade. With no public customer proof, no disclosed operating metrics, and unresolved basics like headquarters and board composition, Unconventional looks like a founder-and-thesis-driven moonshot. The upside is large if the physics work; the downside is that a $4.5 billion seed valuation has already priced in years of technical execution that the public record cannot yet verify.",
      "claimRefs": [
