              - CV042
      - number: '8.4'
        title: 建议、入场纪律与尽调优先级
        blocks:
          - type: paragraph
            body: >-
              基于公开数据的建议是继续研究，而不是买入。这并不是说 Unconventional
              没有上行空间；而是说，相对于外部人能够验证的内容，太多上行已经被计入入场价格。按当前估值进入的买方，实际上是在公开证据出现前，就承保了基准测试成功、客户兴趣、资本可得性和可承受的轮次条款。在稀缺市场里这仍可能奏效，但当种子投资人预先支付接近未来成功情景的价格时，预期回报会被明显压缩。


              因此，入场纪律应聚焦于哪些证据会真正改变估值判断。能上调判断的证据包括：外部可信的性能基准、具名设计伙伴或试点，以及融资条款不会把下行风险不对称转嫁给新进入者的证明。会打破投资逻辑的证据包括：下一轮低于或持平于当前估值，继续没有基准披露，或出现客户不愿测试该架构的证据。在这些问题得到回答之前，当前价格应被视为偏高但仍具战略吸引力的期权价值，而不是有清晰支撑的公允估值。
            claimRefs:
              - CV040
              - CV041
              - CV042
              - CV043
              - CV044
              - CV045
          - type: table
            tableRef: TV006
            claimRefs:
              - CV041
              - CV043
              - CV044
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 当前价格已经假设了尚未公开的证明
            body: 市场也许有理由相信，稀缺的前沿硬件创始人值得稀缺性溢价，但当前入场价格看起来更接近一个成功的中期里程碑，而不是一次干净的种子轮重置。
            calloutType: risk
            claimRefs:
              - CV031
              - CV037
              - CV039
          - type: callout
            title: 继续研究，而不是买入
            body: 只有对基准、客户拉动、资本强度和条款做私人尽调，才能支撑按当前估值买入。否则，正确姿态是密切研究，等待证明或价格变化。
            calloutType: recommendation
            claimRefs:
              - CV040
