        - 真实存在的计算能耗瓶颈，会催生对效率大幅提升的 AI 硬件需求。
        - 官方和投资人来源都持续把功耗和效率定义为核心问题。
        - 独立基准数据显示该架构跨过有意义的效率门槛。
