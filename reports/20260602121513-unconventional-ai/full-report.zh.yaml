      - number: '4.4'
        title: 公开财务不透明与谨慎读数
        blocks:
          - type: paragraph
            body: >-
              反向案例不是建立在欺诈指控或破裂资产负债表上，而是估值对应的运营披露几乎完全缺席。GeekWire 的 "Virgin Unicorns" 框架明确把 Unconventional AI
              列为无产品公司；Forbes 警告，种子阶段 AI 公司的头部指标往往看起来强于底层经济；Axis Intelligence 认为，2025 年超级种子轮已经扭曲了传统风投承保规范。


              技术怀疑又加重了融资怀疑。The Register 提到，迄今只造出过少数神经形态原型，且没有一个接近人脑效率。Unconventional
              自己也承认仍在寻找最能高效扩展的具体范式。这意味着公司要求投资人资助的不只是执行风险，还有架构选择风险。


              换句话说，市场在为可能性付费，而不是为证据付费。公开记录显示了顶级创始人、世界级投资人联盟和连贯的能效逻辑。它没有显示产品市场契合、定价权、已验证的制造经济性或收入质量。对本章而言，这个缺口就是财务故事。
