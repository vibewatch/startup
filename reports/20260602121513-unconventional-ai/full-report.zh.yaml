  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 稀缺性、证据缺口和入场价格如何共同导向「继续研究」建议。
    data:
      nodes:
        - id: r1
          label: AI 电力瓶颈
          detail: 计算需求和电力稀缺给新架构留出空间。
          tone: positive
        - id: r2
          label: 创始人 + 辛迪加溢价
          detail: Rao 和顶级投资者解释了为什么资本这么早就到位。
          tone: positive
        - id: r3
          label: 产品前状态
          detail: 没有公开产品、客户或收入披露。
          tone: negative
        - id: r4
          label: 多年研究路径
          detail: 管理层描述了数年的原型探索。
          tone: negative
        - id: r5
          label: 当前 4.5B 入场价格
          detail: 今天的估值已经嵌入未来技术和商业成功。
          tone: negative
        - id: r6
          label: 继续研究
          detail: 保持跟踪，但承销前需要私人证据或更好价格。
          tone: neutral
      edges:
        - from: r1
          to: r2
          label: 支撑稀缺性溢价
        - from: r2
          to: r5
          label: 帮助解释价格
        - from: r3
          to: r5
          label: 削弱支撑
        - from: r4
          to: r5
          label: 拉长风险窗口
        - from: r5
          to: r6
          label: 迫使价格纪律
