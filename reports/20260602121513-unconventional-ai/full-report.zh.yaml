      - number: '6.4'
        title: 耐久性与集中度：公开档案最薄弱之处，恰好是承保最需要证明之处
        blocks:
          - type: paragraph
            body: >-
              仅凭公开证据，目前无法判断耐久性。没有已审阅来源给出客户数、合同期限、续约、NRR、GRR、流失、满意度或重复使用。也没有来源披露潜在细分市场之间的构成、首个部署规模，或早期交易对手是在付费还是仅在合作。这意味着本章无法像评估更后期的硬件或基础设施公司那样承保客户质量。如果收入很快出现，收入很可能集中在少数灯塔账户或项目中，因为公司尚未展示广泛渠道、自助界面或多元化装机基础。这是深科技硬件平台的标准风险模式：第一个客户可能具有战略意义，却不足以让业务在经济上多元化。


              反向证据让这种谨慎不只是泛泛怀疑。PMC 表示，神经形态商业化仍取决于能否解决编程和规模化部署挑战。IEEE Spectrum
              指向真实的机器人和零售用例，但也称企业仍必须在混乱的现实环境中证明这些系统。World Economic Forum 强调边缘 AI 需求有价值，同时也凸显功耗、尺寸、连接和延迟等硬约束。就连
              Unconventional
              自己的模拟计算文章也承认，如果噪声或内存搬运上升，优秀的组件效率可能无法带来更低的单次推理总能耗。合在一起，公开客户图景支持可信的痛点信号、合理的早期买方，以及漫长的采用周期。它还不支持已经验证
              PMF、具备耐久留存或近期收入多元化的判断。
