      - number: '7.4'
        title: 剩余暴露、公开缓释因素与打破投资逻辑的触发点
        blocks:
          - type: paragraph
            body: >-
              公开记录里确实有缓释因素，但大多是早期缓释因素，并不能证明硬风险已经受控。最强的正面因素是创始人与市场匹配、资本获取能力，以及对挑战的坦诚。Rao 具备硬件和 AI
              背景，投资人财团一线，公司也在发布技术世界观文章，而不是假装问题已经解决。资助计划还显示公司试图扩大研究漏斗；招聘信息也清楚表明，公司知道自己需要异常跨学科的人才。这些都是有帮助的信号，但不能替代原型数据、代工产能预留、良率证据或开发者采用。


              因此，实际承保姿态应围绕触发点展开。绿色路径需要看到：在具名工作负载上测得每 token 焦耳改进，可信的开发者 /
              运行时叙事，已披露的制造路径，以及下一步融资是在为规模化供血、而不是为基础科学发现续命的证据。红色路径则相反：到下一次融资时仍没有经过基准测试的原型，没有明确代工或封装计划，没有客户试点，并且对出口管制或本地化规则的暴露继续上升。在这些证明点出现之前，技术执行、产业依赖、生态采用和达到收入的时间上，剩余暴露都仍然很高。这是一个典型案例：不能把没有反向私人尽调证据，误读成已经存在运营证明。
