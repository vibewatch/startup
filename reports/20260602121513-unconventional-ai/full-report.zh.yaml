  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与架构类别
        blocks:
          - type: paragraph
            body: >-
              Unconventional AI 并不在一条清晰赛道里竞争。其官方材料称，公司面向数据中心，试图通过让 AI 模型与硬件协同进化，用混合模拟和数字电路、非线性动力学，以及刻意最小化数据搬运，将生成式 AI
              推理能耗降低 1000x，而不是只提高每瓦 TOPS。这让它最接近云端和数据中心导向、攻击内存或系统瓶颈的挑战者——例如 Cerebras 用晶圆级片上内存和系统集成，Lightmatter
              等相邻光子玩家用互连扩展——同时也与 Intel Loihi、IBM TrueNorth 和 NorthPole、BrainChip Akida、Mythic 等神经形态和模拟尝试共享部分知识
              DNA。关键区别在部署目标。BrainChip 和 Mythic 明确先做边缘和超低功耗，针对传感器、机器人、家电和嵌入式用例优化。Intel 的 Loihi 和 Hala Point
              仍以研究为主，有开放工具和社区建设，但本轮没有看到 NVIDIA 级主流云部署证据。IBM 的 TrueNorth 和 NorthPole
              仍是证明架构偏离能为能耗和内存局部性带来什么的重要证据点，但保留下来的独立文献仍把 IBM 更多视为基准设定者，而不是当前商业平台拥有者。相比之下，NVIDIA 和 AMD 今天同时覆盖边缘和云，Cerebras
              则销售完整数据中心系统。因此，实际竞争地图是分层的：研究型神经形态项目证明物理机制，边缘神经形态产品证明部分商业采用意愿，现有数据中心厂商定义 Unconventional 最终必须取代的真实购买基线。
