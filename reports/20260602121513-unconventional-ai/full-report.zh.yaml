      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Naveen Rao 是公司的核心领导资产，也是投资人似乎愿意承接巨大商业化前估值的主要原因。公开来源一致称他曾任 Databricks AI 负责人，是 MosaicML 联合创始人，更早还创办了
              Nervana Systems。这些退出经历重要，因为它们把 Rao 同时连接到软件系统扩展和 AI 硬件落地，而这正是 Unconventional 声称自己需要的组合。官方材料还补充了 Brown
              University 神经科学背景，强化了公司的仿生叙事。


              具名联合创始人阵容同样值得关注，尽管其佐证不如 Rao 的履历充分。官方和投资人材料确认 MeeLan Lee、Sara Achour 和 Michael Carbin 为联合创始人；Lightspeed 称
              Lee 是来自 Google、Qualcomm 和 Intel 的模拟电路资深人士，Achour 和 Carbin 则被描述为来自 Stanford 和
              MIT、专注新型计算基底的研究者。即便如此，治理披露仍很薄。本轮审阅材料没有给出董事会名单、控制权，或创始人之外的详细高管团队，因此公司对 Rao 的关键人依赖仍高，正式监督仍是尽调缺口。
