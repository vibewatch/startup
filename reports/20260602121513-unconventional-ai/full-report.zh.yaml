      - number: '2.2'
        title: 买方地图：推理和近边缘工作负载释放最清晰痛感
        blocks:
          - type: paragraph
            body: >-
              AI 买方的需求信号并不均匀。Deloitte 仍预计，2026 年几乎所有 AI 计算都会由巨型 AI 数据中心和昂贵的企业 AI
              服务器完成，这意味着超大规模云厂商和大型企业仍是经济重心。但推理改变了问题形状。Dell’Oro
              认为，与集中式训练集群相比，推理工作负载需要更高可用性、地理分布和更严格延迟保障，这会把建设推向更接近终端用户的近边缘站点。电力效率因此同时产生三重价值：降低每次推理请求成本，让固定站点配额内容纳更多有用算力，并减少小型分布式站点的冷却和备用电力负担。Google
              和 Microsoft 披露显示，大买方已经通过需求响应、硬件选择标准、利用率软件和电力收割来执行这套逻辑。AMD 的嵌入式路线图也在远边缘强化同一点：低功耗推理正在成为产品要求，即便它还不是超大规模 AI
              园区的替代品。
