  - id: TV005
    title: 投资逻辑破裂和终止触发点表
    columns:
      - 触发点
      - 阈值或信号
      - 重要性
      - 行动含义
    rows:
      - - 没有基准测试披露
        - 下一次融资流程前，没有可信的外部基准测试包
        - 技术跃迁是估值存在的核心理由。
        - 将案例推向回避，或要求大幅价格重置。
      - - 没有客户验证
        - 后续融资前，没有具名试点、设计伙伴或参考客户
        - 说明技术吸引力没有转化为需求。
        - 将当前估值视为缺乏商业证明支撑。
      - - 持平轮或下调轮
        - 下一轮新股融资未能超过当前 4.5B 估值
        - 证实种子轮超出了公开或私下支持能力。
        - 没有新投资逻辑和修订后的回报测算，不要加仓摊低。
      - - 执行滑坡
        - 创始人离职，或原型路线图出现重大延误
        - 公司异常依赖技术领导力和招聘。
        - 显著上调悲观情景概率。
      - - 制造经济性失败
        - 基准测试改善，但成本、良率或封装假设不支持采用
        - 如果客户无法经济地购买可用系统，更好的芯片也不够。
        - 将案例重构为技术成功但风投经济性偏弱。
    notes: 触发点设计成可观察且与投资相关。它们的作用是在下一次资本事件前强制保持纪律。
    claimRefs:
      - CV014
      - CV015
      - CV028
      - CV036
      - CV042
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 基准测试包
        - 第三方或客户验证的能耗、吞吐和延迟基准，对比具名基线
        - 核心技术证明决定投资逻辑是真实存在，还是只是优雅叙事。
        - 向管理层索取基准测试方法、原始输出和复现细节。
      - - 客户需求
        - 具名试点、LOI 或带评估标准的设计伙伴
        - 需求证明是从科学项目走向风投结果的桥梁。
        - 按客户、阶段、工作负载和决策时间线询问管线。
      - - 制造经济性
        - BOM、预期良率、封装路径和毛利率假设
        - 即便原型可用，如果经济性闭不上，仍可能不是好生意。
        - 与工程和财务负责人一起审查硬件成本模型。
      - - 资本计划
        - 资金用途、烧钱假设，以及剩余 1B 目标的预期时间
        - 如果当前投资人只是在给一个大得多项目的第一段供血，回报测算会改变。
        - 将里程碑计划与现金需求和下一轮触发点绑定。
      - - 条款清单
        - 优先权、按比例跟投权、治理，以及任何创始人侧条款
        - 后期下行保护可能显著改变有效进入价格和控制权。
        - 获取融资文件，并绘制股权结构堆叠。
      - - 里程碑节奏
        - 管理层预期未来 6-18 个月发布什么
        - 从现在到下一轮之间，市场需要可观察的降风险进展。
        - 要求提供包含依赖关系的产品、基准测试和客户里程碑日历。
    notes: 这些问题按最能改变估值判断的程度排序，而不是按一般好奇心排序。
    claimRefs:
      - CV041
      - CV043
      - CV044
