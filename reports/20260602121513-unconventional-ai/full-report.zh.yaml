  - id: FE001
    title: 产品架构地图
    type: stack
    layout: standard
    summary: 分层展示 Unconventional AI 隐含产品栈：从数据中心推理工作负载，一直到混合信号硅和本地内存封装。
    data:
      layers:
        - label: 客户工作负载层
          detail: 数据中心文本或图像推理任务；在这些任务里，电力、时延和内存流量比通用训练灵活性更重要。
          modules:
            - LLM 或多模态推理
            - 长上下文服务
            - 电力受限的机架运营
        - label: 模型设计层
          detail: 模型类别和架构选择与基底物理共同演化，包括循环、稀疏性，以及对重注意力流程的可能替代方案。
