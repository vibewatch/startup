      - number: '4.2'
        title: 成本结构、资本强度与资金用途
        blocks:
          - type: paragraph
            body: >-
              即便没有公开财务报表，成本结构方向也很清楚：Unconventional AI 正试图在收入之前资助一个深科技硬件项目。官方和投资人材料描述了模拟或混合信号硅片、模型与硬件协同设计，以及为达到 1000x
              能效提升而进行的多轮原型迭代。这些活动都很昂贵，必须在任何产品发货前投入，技术风险还会放大资本需求。


              可能的资金用途可以从公司自称已经开展的工作中看到：招聘硬件、软件、算法和系统人才；资助实验性芯片和系统研究；探索新内存和数据搬运路径；通过 Unconventional Grant program
              播种外部研究。这些支出都不会产生近期收入。它们是商业化前投资，用来降低架构选择风险，并吸引稀缺技术人才。


              因此，资本强度从设计上就很高。A16z 认为，新的 AI 硬件设计空间必须在 GPU 之外探索；公司和媒体来源称，Unconventional
              会先测试数种范式，再选定一种能经济扩展的路径。新型硅片、不确定架构和多年原型循环叠在一起，意味着这家公司会先消耗资本，再发现单位经济。公开来源没有披露毛利率目标、流片预算或营运资金需求，因此承保负担仍落在私下尽调上。
