      - number: '4.5'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              从财务角度看，Unconventional AI
              应被视为一家收入前、研究阶段的硬件公司，资本获取能力出色，但公开运营可见度几乎为零。种子轮融资在标题意义上消除了近期融资风险，但公司自身和第三方报道持续强调研究、原型和更长商业化路径。这个组合指向的是收入前的大量资本消耗，而不是常规风投软件曲线。


              对既定使命而言，可能的资金用途是合理的——资助人才、原型硅片、软硬件协同设计和外部研究——但这些用途都不能证明当下单位经济。缺少预算分配、原型成本、烧钱和商业化里程碑等私有数据，外部投资人无法检验 $475
              million 是保守、充足，还是更大资本计划的第一笔。


              因此，承保阻断项基础但决定性：真实客户证据、产品时间、价格实现、毛利率潜力、现金跑道，以及详细股权结构表。在管理层提供这些材料之前，基于公开数据的结论是：Unconventional AI
              是一个逻辑丰富但财务不透明的未来计算架构赌注，而不是一家有可衡量基本面的运营公司。
