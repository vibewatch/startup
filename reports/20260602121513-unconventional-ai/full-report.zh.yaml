      - number: '4.3'
        title: 融资结构、稀释与资本充足性
        blocks:
          - type: paragraph
            body: >-
              核心公开融资事实很直接：Unconventional AI 于 2025 年 12 月完成 $475 million 种子轮，报道估值 $4.5
              billion。Bloomberg、TechCrunch、公司自身和多篇后续报道均同意这些头部条款，Tracxn 还明确把 $4.5 billion 标为投后估值。公开报道也称，此次关闭是可能最终达到 $1
              billion 的一轮融资的第一笔。


              如果 Tracxn 的投后口径正确，首关意味着新资金大约获得 10.6% 所有权（$475 million 除以 $4.5 billion）。如果媒体简写指的是投前估值，稀释则接近
              9.5%。无论哪种口径，一家成立仅数月、仍处产品前阶段的种子阶段公司似乎已出售约十分之一股权，这凸显出估值有多大程度锚定在创始人履历和投资人联盟，而不是披露的运营指标。


              资本充足性更难判断。公开来源没有披露现金余额、月度烧钱、营运资金需求、债务或项目融资。事实模式反而指向里程碑融资：一次很大的首关、明确讨论更大目标，以及反复声明产品化仍需数年。这不能证明当前现金不足，但意味着公开市场投资人无法基于现有证据负责地估算现金跑道或下一轮时间。
