  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 头部估值以及投资人为何愿意高价买入
        blocks:
          - type: paragraph
            body: >-
              Unconventional AI 的种子轮规模通常属于更后期公司：据报道以 $4.5 billion 估值融资 $475 million，管理层和多家媒体称，这次交割可能只是最终达到 $1 billion
              的整轮融资的首笔。公开收入、客户或产品出货无法解释这一数字，因为这些都未披露。溢价反而落在三件公开可见的事情上：Naveen Rao 过往打造公司的记录，一线投资人领投的财团，以及一种市场叙事——AI
              需求正撞上严重到足以支撑非常规硬件押注的电力和成本瓶颈。


              公司自身也强化了这种稀缺叙事。官方材料称，Unconventional 正在追求 1000x 能效提升，并围绕每 token 焦耳经济性共同重设计模型与硬件。a16z 和 Lightspeed
              的投资人文章把机会定义为基础计算问题，而不是狭义芯片优化。这种组合解释了为什么公司能在缺少传统运营证明的情况下拿到极高价格。但它也意味着，当前估值买的主要是未来里程碑交付的期权，而不是今天已经被证明的业务。
