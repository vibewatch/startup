  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 用方向性方式观察，今天基于公开数据的估值判断对关键里程碑有多敏感。
    data:
      items:
        - label: 可信外部基准包
          value: 2
          unit: USD billions
          detail: 最大的正向摆动，因为它把论点转成可测试证据。
          status: positive
        - label: 具名设计伙伴或试点
          value: 1.5
          unit: USD billions
          detail: 显示买方愿意评估或购买该架构。
          status: positive
        - label: 完整 1B 融资但价格不上调
          value: -1
          unit: USD billions
          detail: 同一估值下更多稀释会压缩预期回报。
          status: negative
        - label: 下一轮前没有产品或基准信号
          value: -2
          unit: USD billions
          detail: 延长纯研究叙事，并提高重置风险。
          status: negative
    approximationNotes: 数值是相对公开数据支持估值判断的方向性变化，不是管理层指引或公允价值标记。
    claimRefs:
      - CV029
      - CV031
      - CV033
      - CV034
      - CV036
      - CV042
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 在熊、基准和牛市假设下，基于公开数据的估值区间。
    data:
      items:
        - label: 今天的熊市情景价值
          low: 0.5
          mid: 1
          high: 2
          unit: USD billions
          detail: 没有基准证明、没有客户信号，融资条件更严苛。
        - label: 今天的基准情景价值
          low: 2.5
          mid: 3.5
          high: 4.5
          unit: USD billions
          detail: 原型进展存在，但商业化证明仍不完整。
        - label: 今天的牛市情景价值
          low: 6
          mid: 8
          high: 12
          unit: USD billions
          detail: 基准成功、早期需求证明，以及稀缺性溢价市场延续。
    approximationNotes: 这些是启发式公开数据区间，锚定里程碑逻辑和已披露的可比融资。由于收入和条款不公开，区间刻意保持很宽。
    claimRefs:
      - CV032
      - CV033
      - CV035
      - CV036
      - CV037
      - CV045
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: IC 风格记分卡，列出承销当前种子轮估值时最重要的因素。
    data:
      items:
        - label: 创始人 - 市场匹配
          value: Strong
          detail: Rao 的背景和投资者辛迪加解释了公司为何能在早期接触大规模资本池。
          status: positive
        - label: 技术证明
          value: Low
          detail: 1000x 论点很有野心，但公开基准证据尚未出现。
          status: negative
        - label: 商业证明
          value: Very low
          detail: 未发现公开设计定点、客户或收入披露。
          status: negative
        - label: 资本可得性
          value: High
          detail: 当前轮次和投资者组合显示，公司有异乎寻常的能力支撑漫长硬件周期。
          status: positive
        - label: 下行保护
          value: Low
          detail: 轮次条款、优先权和治理保护没有公开披露。
          status: negative
        - label: 估值支撑
          value: Limited
          detail: 公开证据尚不支持今天为未来成功结果买单。
          status: negative
    approximationNotes: null
    claimRefs:
      - CV009
      - CV012
      - CV014
      - CV037
      - CV041
      - CV043
      - CV044
