      - number: '2.3'
        title: 模拟与神经形态硬件确有能效潜力，但商业化没有免考
        blocks:
          - type: paragraph
            body: >-
              非常规架构的技术案例已不再只是愿景。IEEE Xplore 把神经形态芯片描述为对大模型能耗和扩展极限的回应，而近期 Nature 研究展示了具体器件层面收益，例如拥有很高 TOPS-per-watt
              的存内计算宏，以及可在保持准确率的同时把向量矩阵乘法功耗最高降低 90% 的信号折叠硬件。这是市场的有利面。不利面同样重要。IEEE Spectrum 认为，该领域仍没有商业突破，仍需要杀手级应用，也仍缺少让
              GPU 易于采用的高级软件栈。换句话说，更好的物理机制不会自动创造软件生态、设计导入周期或采购预算。对 Unconventional AI
              而言，市场逻辑在客户今天遭遇硬电力天花板的场景里最强，但商业化负担仍包括开发者工具、工作负载适配，以及证明模拟或神经形态设计能在可重复的生产环境中胜过优化后的数字推理。
