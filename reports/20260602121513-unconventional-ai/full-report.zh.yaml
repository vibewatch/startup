      - number: '5.4'
        title: 制造、部署与控制层约束
        blocks:
          - type: paragraph
            body: >-
              可制造性是公开记录明显变薄的地方。Rao 告诉 The Register 和
              DCD，公司仍在尝试几种路径，最终设备很可能是模拟的，并会用硅制造。资助计划把工程议程讲得更清楚：强调非常规电路、异构系统、最小化数据搬运的循环，以及 3D
              集成，并明确偏好五年内有量产路径的想法。这个组合说明，封装密度、内存近邻、校准和良率是产品成功的一阶决定因素，而不是架构选定后再解决的问题。


              但审阅界面没有披露数据中心买方最终会要求的核心控制项。没有公开晶圆代工伙伴、工艺节点、封装方法、误差预算披露、校准计划、良率目标或可靠性认证制度。也没有公开的安全、隐私、安全性或合规文档来支撑未来产品栈。这些缺口在这里比常规加速器路线图中更重要。在物理优先的混合信号系统里，模拟噪声、漂移、可复现性和现场校准与商业部署不可分割。同样，如果产品真的是完整系统，而不是芯片
              IP 模块，那么与服务器、网络、电力交付和内存封装的集成也会成为可制造性问题的一部分。结果是：技术方向可信，但产品化路径仍不透明。
