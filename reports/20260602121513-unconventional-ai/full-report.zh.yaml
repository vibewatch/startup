  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：瓶颈是电力，不是泛 AI 需求
        blocks:
          - type: paragraph
            body: >-
              对 Unconventional AI 来说，相关市场比“所有 AI 硬件”更窄，也比“单一芯片类别”更宽。可投资切口是这样一组 AI
              工作负载：电力、机架功率密度、冷却、并网时间和电网可负担性，如今与模型需求同样决定部署节奏。IEA 当前基准情景预计，到 2030 年数据中心总用电约为 950 TWh，其中以 AI
              为中心的设施增长更快；DOE/LBNL 预计美国数据中心耗电到 2028
              年将翻倍或增至三倍。这些数字重要，因为买方已经不只为加速器付钱：他们还在为输电升级、储能、备用发电、更高密度冷却和许可工作付钱。也就是说，Unconventional AI 面对的现状替代品不只是 NVIDIA
              或 AMD 卡，还包括燃气轮机、电池、液冷改造、排队接入位置，以及在同一电力包络内挤出更高利用率的软件。Unconventional 的逻辑契合这个市场边界，因为它把能效视作客户越来越被迫围绕其采购的瓶颈变量。
