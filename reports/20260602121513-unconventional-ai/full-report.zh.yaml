      - number: '1.5'
        title: 反向观点与关键风险
        blocks:
          - type: paragraph
            body: >-
              公司逻辑之所以有吸引力，正是因为外部问题真实存在。IEA 称，2025 年数据中心用电需求大幅上升，并且电网接入、变压器、涡轮机、先进芯片和许可都在收紧。Utility Dive 的 2026
              年报道补充说，开发商在追逐通电时间，提出数百兆瓦级需求，并在电网跟不上时越来越多转向现场发电。这些条件支撑了 Unconventional
              的基本论点：效率比以往更重要；但它们也会让采用更复杂，因为面对即时电力短缺的客户，可能会优先选择可靠、可获得的基础设施，而不是优雅但未经验证的架构。


              因此，估值值得怀疑。Byteiota 的表述方向上有用：模拟和神经形态路径可以承诺重大效率提升，但在挑战根深蒂固的 GPU 栈之前，仍要跨过精度、可制造性、工具和生态障碍。A16z
              自己也承认，这是一场试图打开硬件设计空间新位置的雄心尝试，而不是增量产品升级。没有公开客户证明、没有披露运营指标，总部和董事会构成等基础问题也未解决，Unconventional
              看起来像由创始人和逻辑驱动的登月项目。如果物理路线跑通，上行空间很大；下行风险则是，$4.5 billion 种子轮估值已经计入多年技术执行，而公开记录还无法验证这些执行。
