      - number: '3.2'
        title: 商业化成熟度、部署目标与资本不对称
        blocks:
          - type: paragraph
            body: >-
              这个格局里最大的战略分野，在于架构是智识上有吸引力，还是买方真的能采购、集成并支持。Unconventional AI
              的官方发布材料对一家种子阶段硬件公司来说野心异常大、融资异常充足，但读起来仍像招聘和逻辑界面，而不是产品目录：公司披露了大额种子轮，发布架构文章，并招聘硬件、软件和算法人才；但保留下来的公开证据没有显示已发货系统、客户部署、基准套件或商业包装。BrainChip
              在狭窄边缘赛道里成熟得多，因为它提供处理器 IP、工具、模型、云端基准界面和面向生产的边缘产品。Mythic
              同样展示了具体的模拟计算架构和面向边缘设备的部署工具链，即便这里的公开界面对大规模商业证明着墨不多。Graphcore 和 Cerebras 更接近 Unconventional
              的数据中心雄心，但状态完全不同：Graphcore 的技术仍有相关性，但独立报道显示，把另类芯片技术优势转化为持久独立规模有多难，最终走向出售谈判并由 SoftBank 持有。Cerebras
              则销售完整系统，甚至曾推进 IPO，显示出更具体的资本市场和企业系统姿态。NVIDIA 和 AMD
              是最难对比的对象，因为它们已经以发货硬件叠加开发者栈、合作伙伴和企业采购动作，横跨边缘到云端连续体。公开定价也实质不对称。本来源集中，大多数非常规硬件厂商只展示联系销售或产品家族页面，而 NVIDIA 至少展示
              Jetson 开发者套件和更广泛的购买生态。换句话说，Unconventional 的融资缩小了一个问题——现金跑道——但没有缩小更重要的商业化缺口：架构承诺与已落地平台成熟度之间的距离。
