      - number: '1.4'
        title: 里程碑、运营信号与披露缺口
        blocks:
          - type: paragraph
            body: >-
              公司的公开时间线很短，但已经有信息量。2025 年 9 月出现 Rao 离开 Databricks 的报道，10 月浮现融资传闻，公司于 2025-12-08 借官方公告和融资披露正式发布。同一发布窗口还出现
              a16z 和 Lightspeed 的投资人文章，说明投资人联盟从第一天起就想把公司框定为 AI 电力问题的第一性原理式回应。到 2026 年初，CNBC 已明确点名 Bezos Expeditions
              为支持方，而 Unconventional 自家博客也转入研究节奏，4 月和 5 月发布了关于神经协同进化、内存瓶颈、混合信号取舍和资助计划的文章。


              这些里程碑显示公司在积极招聘、发布技术世界观内容，并建立心智份额。它们还不能证明产品发货日期、客户部署或运营规模。关键封面指标仍未披露，包括收入、ARR、客户数、员工数和正式治理结构。连基础身份字段也未完全稳定：来源集在总部地点上互相冲突，有文章称这家创业公司总部在
              San Francisco，另一篇称在 San Diego。正确解读是，公开证据足以证明这是一家真实且融资充足的公司，但还不能证明它已经是充分披露的运营业务。
