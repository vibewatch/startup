            - 递归或状态空间模式
            - 稀疏性与参数复用
            - 模型架构专用化
        - label: 训练 / 代理层
          detail: 行为模型和可微训练流程先于或伴随硅实现，优化物理参数。
          modules:
            - 可微 ODE 或代理模型
            - 基于梯度的优化
            - 噪声感知训练假设
        - label: 运行时 / 编译器层
          detail: 必要但尚未发布的映射层，必须把模型意图转成可落地的电路和系统行为。
          modules:
            - 模型映射 / 编译器
            - 运行时调度
            - 基准测试与仪器工具
        - label: 内存 / 封装层
          detail: 本地或 3D 集成内存配合短通信路径，用来压低占主导的移动成本。
          modules:
            - 片上或近芯片内存
            - 3D 集成 / 封装
            - 位置感知布局
        - label: 物理计算层
          detail: 硅电路利用非线性动力学，模拟和数字模块在各自最强的位置协同工作。
          modules:
            - 混合信号计算模块
            - 非线性电路动力学
            - 硅制造与测试
