  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与目标工作负载
        blocks:
          - type: paragraph
            body: >-
              Unconventional AI 今天没有展示常规芯片目录。其官方材料描述的是一个面向生物尺度效率的“new physical substrate for intelligence”，第三方报道则称 Rao
              设想的是定制硅片和服务器基础设施。最清晰的工作负载切口是数据中心生成式 AI 推理：公司详细效率文章把成功定义为在输出质量相当时降低每 token
              焦耳或每图像焦耳，并仍把延迟、吞吐、面积和价格视为次要约束，而非首要目标。Rao 还告诉 The
              Register，扩散、流以及相关适合动力学的模型天然适合这类基底；这意味着首个目标不是通用计算，而是成本由权重和状态搬运主导的推理工作负载。


              关键产品含义是，公司在构建一个栈，而不只是一颗裸片。公开文章暗示至少包括工作负载层、受基底物理塑造的模型设计选择、训练或替代模型层、运行时 /
              编译器层，以及定制硅片加近端内存。但商业界面仍很薄。官方网站展示了首页、技术博客、资助计划和稀疏招聘页；没有展示 SKU、价格表、基准仪表盘、API
              文档或具名客户部署。用客户工作流语言说，产品主张是：帮助受电力约束的数据中心推理团队，通过同时改变模型形态和硬件基底，降低每次输出能耗。用市场就绪度语言说，公开证据仍像一个在描述未来可售内容的研究项目，而不是今天可销售的产品。
