  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 技术证明、模拟扩展与商业化风险
        blocks:
          - type: paragraph
            body: >-
              核心风险不是 Unconventional AI 缺少野心，而是公司自己把项目描述成一项长期研究计划，而非通往近期产品的工程冲刺。Rao 告诉 The
              Register，公司两年内不会有产品，未来几年要破解一种新范式；Data Center Dynamics
              也单独引用他说，团队在确定哪条路径能最高效、最具成本效益地规模化之前，仍预计会测试多种想法和原型。这意味着投资人在能承保产品市场匹配之前，先要承保科学发现和架构发现风险。


              技术负担也异常高。Unconventional 自己的文章把数据搬运、片外 HBM 访问和 Amdahl's Law 描述成实现 1000x
              能效跃迁的真正约束；其模拟计算博客也承认，热噪声、模拟内存不成熟和系统级精度权衡，可能抹掉大量表面上的模拟优势。外部综述进一步说明，这仍是一个不成熟领域：MDPI 综述强调硬件、算法、可扩展性和集成挑战；UC
              San Diego 对 Nature 路线图的总结称，神经形态计算仍需要开放框架和用户友好的编程语言；The Register
              则指出，目前只有少数原型存在，且没有一个接近类脑效率。换句话说，Unconventional 要求市场相信，它能解决业内人士和外部评审者仍称为开放问题的难题。
