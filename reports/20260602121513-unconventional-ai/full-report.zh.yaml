          - type: paragraph
            body: >-
              最公平的公开可比组不是干净的收入倍数表，因为 Unconventional 仍处于产品前阶段。更好的锚点，是其他由创始人主导、按技术承诺、人才密度或战略稀缺性定价的 AI 或 AI 硬件融资。按这个口径，$4.5
              billion 的估值高于 Groq 2024 年的 $2.8 billion 估值，也高于 Tenstorrent 2024 年超过 $2.6 billion 的估值；尽管这些公司产品化更可见，而且
              Tenstorrent 还披露了客户合同。它也接近 Safe Superintelligence 2024 年 $5 billion 的估值，同时远低于 2025 年 Thinking Machines Lab
              $12 billion 的离群值。


              这些可比交易支持两种解读。乐观解读是，市场有意为稀缺的前沿创始人和稀缺的 AI
              基础设施资产支付溢价。怀疑解读是，市场已经把后期证明提前计入种子轮。由于两种解读都有一部分成立，给出情景区间比给出点估值更诚实。乐观情景假设有经过基准测试的技术证明、首批设计伙伴和后续资本；基准情景假设部分去风险，但没有真实收入规模；悲观情景假设研究期拉长、没有产品信号，融资市场也更严苛。
