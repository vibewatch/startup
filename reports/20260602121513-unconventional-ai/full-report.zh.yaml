      - number: '5.5'
        title: 对比、成熟度读数与技术未知数
        blocks:
          - type: paragraph
            body: >-
              比较来源让产品判断更清晰。Intel、EBRAINS 和 BrainChip 各自展示了 Unconventional
              尚未公开暴露的平台成熟度片段：大规模事件驱动硬件、公开或半公开软件框架、仿真环境、API，以及 BrainChip 更可识别的商业和开发者界面。这些例子都不能证明 Unconventional
              的逻辑是错的。事实上，它们验证了行业正在认真探索事件驱动、混合信号和内存局部架构。但它们也说明，真实硬件本身还不够。IEEE Spectrum 的“killer app”批评，以及 Frontiers
              综述对训练工具不成熟、可靠性约束、噪声敏感和基准碎片化的警告，都指向同一个采用瓶颈。


              因此，Unconventional 的 1000x 主张应被视为研究目标，而不是产品事实。公司已经提出一条可信攻击线，瞄准内存搬运、模拟 /
              数字分区和协同进化的模型设计。它尚未发布的是从逻辑到产品的缺失转换层：真实工作负载结果、可制造的内存与封装计划、可用工具链，以及证明如果效率收益需要非即插即用工作流，数据中心买方也会接受。除非这些缺口闭合，谨慎但公平的解读是：Unconventional
              可能正在研究一个重要的下一代计算方向，但其产品姿态仍实质落后于概念雄心。
