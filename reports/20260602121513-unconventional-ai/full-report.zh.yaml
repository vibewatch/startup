      - number: '8.3'
        title: 估值为何可能已经偏高
        blocks:
          - type: paragraph
            body: >-
              估值看起来偏高的最大原因，是管理层和媒体报道都把公司描述成多年研究计划，而不是近期产品化。The Register 引述 Rao 称，公司两年内不会有产品，未来几年要破解一种新范式。Data Center
              Dynamics 也类似描述了多轮原型和架构实验，之后公司才会知道什么路径最适合规模化。换句话说，投资人不只在为执行风险付费，也在为架构选择风险付费。


              反向来源把同一点说得更直白。GeekWire 的 Virgin Unicorns 框架认为，早期 AI 叙事可能替代真实牵引。CNBC 的 2026 调查显示，市场担心创纪录 AI 估值存在泡沫。Forbes 和
              TechCrunch 都描述了一个市场：精英创始人和大型基金推高种子轮价格的速度，快于底层披露标准改善的速度。Graphcore 是一个有用的警示参照：资金充足的 AI
              芯片挑战者，仍可能难以商业化，最后以不理想条款被出售或资本重组。Unconventional 最终也许能证明当前价格合理，但现在的估值几乎不给延误、弱基准或融资重置留下空间。
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV017
              - CV018
