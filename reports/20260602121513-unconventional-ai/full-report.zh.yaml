      - number: '6.2'
        title: 具名证明缺口：商业化意图可见，但客户披露仍然缺席
        blocks:
          - type: paragraph
            body: >-
              关于实际客户，最强的公开证据仍是反向证据。在已审阅的官方页面、投资人文章、TechCrunch 报道和 Data Center Dynamics 报道中，没有具名付费客户，没有公开设计伙伴，没有 alpha
              队列披露，没有采购记录，没有使用指标，也没有与客户账户绑定的公开收入标记。这一缺口很关键，因为本章要区分「有意思的客户痛点」和「已验证的客户采用」。现在前者远强于后者。即便最具体的独立商业化引述，也只是 Rao
              称未来几年会尝试想法和原型。资助计划征集外部方案、帮助打造一台 20 W 计算机，也指向同一方向：公司仍明显处在研究和架构成形阶段。


              最合理的解读是一条分阶段的硬件 GTM。首先，Unconventional
              需要吸引极少数电力痛点尖锐的交易对手关注。随后，公司必须在实际工作负载上证明系统级效率，展示软件和工具链兼容性，通过资格认证和采购流程，之后才可能走向有限量产。如果技术成立，这当然可以带来高价值灯塔客户，但这是一条很长的收入路径。换句话说，公司可能已经知道自己想卖给谁，但公开档案还没有显示任何这类买方已经从兴趣越过到已披露采用。
