      - number: '2.4'
        title: 政策和电力系统规则会像芯片物理一样决定采用节奏
        blocks:
          - type: paragraph
            body: >-
              监管环境强化了效率需求，也让任何新架构的扩张速度更复杂。FERC 已在 PJM 推动更清晰的大负载规则，EPA 正在为备用发电建立许可路径，DOE
              也明确支持输电、并网、效率和柔性负载响应。这意味着政策制定者越来越把 AI 数据中心负载视为规划问题，而不是临时异常。与此同时，出口管制和半导体政策意味着，后 GPU
              架构仍会继承现有厂商面对的先进封装、出口许可和制造约束。由此得出的市场逻辑更微妙。Unconventional AI
              的方向是对的，因为客户显然正在撞上电力、冷却和电网瓶颈。但采用不会只由逻辑质量决定。关键在于公司能否展示一个产品：在受监管、容量受限且依赖软件的部署栈中，按每次推理能耗胜出。因此，市场机会很大，但捕获路径由集成证明把关，而不只是概念验证。
