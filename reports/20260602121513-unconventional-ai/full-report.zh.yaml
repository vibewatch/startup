      - number: '7.2'
        title: 制造、代工与监管依赖风险
        blocks:
          - type: paragraph
            body: >-
              即便技术逻辑能在仿真中成立，Unconventional 仍要在一个产能已受限、并受地缘政治管理的半导体供应链里制造真实产品。公司的资助计划明确表示，只有在五年内存在走向规模制造的路径时，才偏好 3D
              集成工作；这实际上承认，可制造性是核心挑战的一部分。Moody's 将先进半导体生产描述为集中在少数地区和公司，TSMC 代工份额接近 70%，专业供应商冗余有限，资格认证周期可能需要数月。CNBC 和
              Epoch 针对 AI 芯片说得更进一步：2025 年的主要瓶颈不仅是逻辑裸片，而是先进封装和 HBM；Nvidia 以及其他超大规模云厂商已经吃掉了绝大多数 CoWoS 和 HBM 产能。


              对一家可能需要模拟或混合信号硅、先进封装，并需要代工厂把稀缺产能分配给未经验证架构的创业公司来说，这种集中带来进度、成本，甚至生存风险。政策层还会放大问题。CRS 和 GAO
              显示，出口管制现在不只覆盖芯片，也覆盖 HBM、先进封装、测试、EDA 和制造设备等更广泛栈；Mayer Brown 指出，2026 年 1
              月政策新增了终端用户尽调、第三方测试，以及出口不会把代工产能从美国需求中转移出去的认证要求。Baker Botts、Gunderson 和 ML Strategies 也描述了 2026 年州、联邦和跨境 AI
              规则仍在拼接中的格局。因此，一家仍在定义硬件栈的创业公司，在披露商业产品之前，就同时面对产业集中风险和上升的合规负担。
