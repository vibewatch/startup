      - number: '5.3'
        title: 软件、工具与训练含义
        blocks:
          - type: paragraph
            body: >-
              公司的“neural co-evolution”表述有重大软件后果。如果模型结构和基底物理必须协同设计，产品就不可能是任意 PyTorch 图的即插即用加速器。Unconventional
              的动力学演示把这一点具体化：它使用一个玩具陀螺仪加弹簧系统，用可微分 ODE
              模型训练物理参数，并展示反向传播原则上可以优化物理动力系统。这是研究方向的重要概念验证，但仍只是玩具分类案例，不是生产推理栈的证据。从演示走向产品，需要一个适合训练的行为模型、能把学习到的结构转成可实现电路的编译器或映射层、暴露可预测系统行为的运行时，以及在系统层面测量能耗的基准工具。


              外部比较来源显示，这正是故事中最难的部分。IEEE Spectrum 称神经形态硬件仍缺少类似 TensorFlow/PyTorch 的工具；EBRAINS 通过 PyNN 驱动接口开放 BrainScaleS
              和 SpiNNaker；Intel 的 Lava 文档则是创建可复用软件抽象的最清晰尝试之一。BrainChip 的公开界面在商业方向走得更远，提供
              SDK、仿真工具、模型资产和可基准测试的硬件访问。相对这些参照点，Unconventional
              当前公开栈作为技术逻辑很有吸引力，但作为开发者体验仍描述不足。公开挑战不是物理能否计算，而是公司能否把物理机制转化为真实运营方可用的模型设计、软件和运行时工作流。
