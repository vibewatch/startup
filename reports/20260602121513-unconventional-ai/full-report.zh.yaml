      - number: '6.3'
        title: 代理客户证明：买方侧需求真实，但 Unconventional 部署仍未验证
        blocks:
          - type: paragraph
            body: >-
              由于缺少具名 Unconventional 客户，最有用的公开证据来自买方一侧和相邻生态。Google 自身的推理披露、Microsoft 的 Maia 发布，以及 Microsoft-OpenAI
              伙伴关系，都显示潜在客户已经围绕推理经济性、功耗和平台级可靠性优化。Google Cloud 表示，83% 的组织需要升级基础设施，才能把智能体 AI 从试点推向生产。Crusoe 表示，其 2026
              趋势研究基于 300 多位 AI 领导者；这一点重要，因为它说明基础设施栈仍处在主动重构中。这些信号不能证明 Unconventional 的产品市场匹配，但仍有分析价值：如果 Unconventional
              能交付其宣称的东西，买方已经有严肃的经济问题要解决。


              第二组对应买方存在于边缘和国防场景。AMD 的嵌入式 AI 发布强调，为汽车和工业客户降低成本，并加快进入生产的路径。Army tactical-edge 文章认为，D-DIL
              作业需要在加固硬件上运行低功耗神经形态推理。Edge AI Foundation
              的国防工作组同样把战术边缘部署描述成政府用户正在面对的工程问题。这把目标客户地图从超大规模数据中心扩展出去。不过，置信度应低于数据中心逻辑，因为 Unconventional
              自身谈数据中心推理，远比谈国防、机器人或工业边缘更明确。正确结论是，代理需求证据很强，但代理需求不等于已披露销售管线。
