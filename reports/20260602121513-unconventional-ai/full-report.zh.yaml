chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、使命与产品逻辑
        blocks:
          - type: paragraph
            body: >-
              Unconventional AI 于 2025-12-08 公开走出隐身状态，并立即把自己定位成深科技算力实验室，而不是常规应用创业公司。官方发布文章称，公司正在构建一种面向“生物尺度”能效的新智能基底，并认为
              AI 需求增长快过全球新增电力容量。换句话说，核心产品逻辑不只是做一张更好的加速卡，而是更根本地改变 AI 工作负载在硅片里表达和计算的方式。


              本轮审阅的官方与投资人材料描述的是一个系统：它更多借助非线性、混合信号和概率方法，而不只依赖数字抽象。这个表述很关键，因为它意味着公司走的是长期 R&D
              项目，重度依赖科学突破，而不是近期产品推出。公开材料还显示公司网页足迹分裂：提示中给出的 unconventional.ai 域名目前解析到待售着陆页，活跃公司内容则分布在 unconv.ai
              的发布文章、博客和招聘页上。这并不否定公司存在，但对一家估值已达数十亿美元的创业公司来说，它显示品牌界面异常早期或仍在过渡。
