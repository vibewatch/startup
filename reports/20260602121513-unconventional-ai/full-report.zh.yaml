      - number: '5.2'
        title: 物理优先架构与 1000x 效率逻辑
        blocks:
          - type: paragraph
            body: >-
              从机制上看，Unconventional 对当前 AI 硬件坏在哪里讲得异常明确。公司的 1000x 文章称，相关比较对象是端到端系统能耗，而不是构件级
              TOPS/W，并认为推理能耗主要由存储、访问和搬运主导，而不是算术。它对 100B 参数模型的粗略计算显示，在计入 KV-cache 开销前，算术能耗约为每 token 0.007 Joules，SRAM
              读取约为每 token 0.2 Joules，HBM 读取约为每 token 3.9 Joules。因此，同一篇文章反复回到局部性、参数复用、循环、注意力替代方案，以及可能的 3D
              集成内存。架构逻辑不是“我们找到了更好的乘加器”，而是“我们需要一种基底，让模型状态在物理上靠近使用它的位置”。


              公司的模拟计算文章同样重要，因为它收窄了主张。Unconventional
              没说模拟是免费午餐。它说，精度更高时，热噪声会迫使更大电容，模拟效率会崩；模拟内存仍未解决到足以免除昂贵接口开销；如果噪声、重写或更大模型增加流量并损害等准确率，漂亮的 fJ/op
              数字仍可能在系统层面输掉。换句话说，乐观案例依赖混合信号协同设计，而不是幼稚的模拟对数字叙事。公开材料把 1000x
              目标视为栈级结果，可能来自许多小胜利——更好的局部性、更适合的模型类别、循环、稀疏性、更少搬运，以及在取舍真正有利时直接利用物理机制的电路。
