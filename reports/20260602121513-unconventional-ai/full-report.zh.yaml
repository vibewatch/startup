        - 要求提供真实数据中心推理工作负载上的可运行系统证明，以及开发者工具证据，而不只是架构文章
      - - 数据搬运洞察是可持续差异点
        - 其他厂商正用不同杠杆攻同一个瓶颈
        - 高
        - Cerebras 用片上内存和晶圆级系统；Lightmatter 用光互连；既有厂商用全栈平台工程
        - 说明 Unconventional 的路径为何能在可部署 TCO 上胜过其他内存 / 互连修复方案
      - - 神经形态历史证明仿脑硬件能跨越 GPU
        - 过往努力往往停留在小众、研究优先或软件碎片化状态
        - 高
        - 独立评述强调，商业采用取决于 API、集成、可靠性和标准化，不只是能耗基准
        - 要求基准方法、编译器方案、标准接口和参考部署
      - - 大额种子融资构成资本护城河
        - 资金充足的既有厂商和战略母公司仍远超创业公司的现金跑道
        - 中
        - Graphcore 的历史表明，数亿美元面对生态惯性仍可能不够；NVIDIA 和 AMD 仍是上市公司量级的既有厂商
        - 要求多年供应链、封装和软件预算计划，而不只是融资标题
      - - 边缘神经形态产品验证了更广泛颠覆路径
        - 边缘商业化未必能迁移到数据中心工作负载
        - 中
        - BrainChip 和 Mythic 证明低功耗 AI 存在边缘市场，但留存文献显示，神经形态硬件的数据中心商业化仍未解决
        - 区分边缘经验与云推理要求，并量化真正可迁移的部分
      - - 架构新颖性本身就是护城河
        - 买家可能更偏好能保留现有软件和工作流的渐进式替代方案
        - 高
        - 系统厂商、GPU 平台或光子基础设施都能攻同样的瓶颈，而且不必强迫买家整体切换编程模型
        - 测试买家愿不愿重写工作流或采用新工具链，而不是直接购买更好的既有硬件
    notes: 严重度衡量的是 Unconventional 未来竞争位置承受的压力，而不是失败确定性。主导风险来自商业化和生态，而不只是原始硅性能。
