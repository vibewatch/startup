  - id: TR005
    title: 缓释和终止标准表
    columns:
      - 风险
      - 可监控触发点
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 技术证明风险
        - 公开原型披露、论文或基准测试帖子
        - 下一次融资里程碑前，没有实测原型在同等质量 joules/token 上显著超过具名 GPU/TPU 基线
        - 将其视为从物理到产品时点的投资逻辑破裂；停止把 1000x 主张作为近期价值承销
      - - 制造 / 代工路径风险
        - 代工、封装或内存合作伙伴披露
        - 公司声称走出研究阶段后，仍没有可信的具名制造路径或产能策略
        - 冻结制造上行假设，并在模型中计入重大排期延误
      - - 软件生态风险
        - SDK、编译器、框架或开发者预览披露
        - 12-18 个月内看不到通向主流框架或客户评估栈的路径
        - 下调采用速度，把可信 TAM 缩窄到定制研究用例
      - - 监管 / 出口管制风险
        - BIS 指引、出口许可证新闻、关税变化或公司法律披露
        - 许可证被拒、不利分类，或规则显著限制目标市场或代工准入
        - 重建供应链模型，并假设合规成本更高、商业化更慢
      - - 融资和收入时间风险
        - 融资公告、产品 / 试点更新和客户证明
        - 原型证明或任何客户 / 试点披露之前，就需要再融一轮巨额资金
        - 预期稀释、收入时间更长、估值信心更低
    notes: 这些触发点选择的是可从公开证据监控的信号。它们服务于投资承销，而不是运营管理。
