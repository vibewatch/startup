  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 部署目标
      - 架构逻辑
      - 成熟度 / 规模信号
      - 对 Unconventional AI 的护城河含义
    rows:
      - - Unconventional AI
        - 参照公司
        - 数据中心生成式 AI 推理
        - AI 模型和硬件全栈协同设计；混合模拟和数字电路；动力系统；尽量减少数据移动
        - 官方发布、技术博客系列、招聘入口和已披露的巨额种子轮融资；本轮未保留已出货产品目录
        - 架构野心和融资都强，但在可部署系统和工具公开前，护城河仍主要靠逻辑支撑
      - - Intel Loihi / Hala Point
        - 研究型神经形态基准
        - 边缘和研究规模的自适应 AI 系统
        - 稀疏事件驱动的脉冲计算，集成内存和开源 Lava 工具
        - Intel 支持的研究项目，拥有 1.15B 神经元 Hala Point，并明确从原型走向产品的路径
        - 最强证明是大型在位者可以连续多年资助神经形态 R&D，从而削弱“只有创业公司能探索该领域”的说法
      - - IBM TrueNorth / NorthPole
        - 标志性神经形态 / 存内计算基准
        - 研究和推理基准场景
        - 节能神经形态或存内计算设计，尽量减少推理中的片外内存访问
        - 历史上重要的效率基准，但保留证据更像架构验证，而不是广泛商业平台
        - 说明亮眼效率结果可能停在基准状态，并未变成主导产品
      - - BrainChip Akida
        - 商业化神经形态边缘产品
        - 边缘 AI、常开感知、嵌入式设备
        - 稀疏神经形态处理器 IP，加上面向超低功耗边缘工作负载调优的云、模型和工具
        - 公开产品栈、商店、开发者入口和明确边缘模态，让它成为本组最商业化的神经形态方案之一
        - 验证了低功耗神经形态部署有真实需求，但主要在边缘类别，而不是 Unconventional 的数据中心目标
      - - Mythic
        - 模拟存内计算边缘加速器
        - 带有部分服务器工具邻近性的边缘设备
        - 基于 tile 的模拟存内计算 APU，配套数据流架构和编译器 / 工具链支持
        - 公开架构和软件叙事存在，但保留证据在规模化商业采用上弱于技术设计
        - 模拟创新能吸引兴趣，但未必已经建立广泛市场锁定，这是一个相关警示
      - - Graphcore
        - 替代 AI 芯片 / 系统供应商
        - 云和数据中心 AI
        - 基于 IPU 的 GPU 中心型 AI 基础设施替代方案
        - 独立报道显示出售谈判、巨额亏损、SoftBank 所有权，以及重新融资 / 招聘
        - 技术差异化仍可能输给生态和资本不对称，这是一个强案例
      - - Cerebras
        - 数据中心非常规计算系统
        - 私有云和企业 AI / HPC 超算
        - 晶圆级系统，具备大规模片上内存和带宽，用来缓解内存墙
        - CS-3 系统出货加上 2024 年 S-1 文件，显示它比典型研究型创业公司更接近产品化云规模姿态
        - 判断非 GPU 架构能否赢得数据中心采购周期时，它是最清晰的直接基准之一
      - - NVIDIA
        - 在位全栈平台
        - 边缘、企业、云和超大规模 AI
        - 统一的加速计算平台，覆盖 Jetson 边缘模块、Blackwell 数据中心 GPU、CPU、网络和软件
        - 出货边缘套件、合作伙伴网络、上市公司披露，以及横跨全栈的广泛部署入口
        - 最难打的整体对手，因为买方可以留在既有软件和供应链轨道内
      - - AMD
        - 在位挑战者平台
        - 边缘嵌入式 AI 加数据中心 AI
        - 面向实时边缘推理的自适应 SoC，加上面向云 AI 的 Instinct 加速器和开发者工具
        - 公开产品组合通过 ROCm、Vitis 和企业 AI 资源覆盖边缘和数据中心
        - 给买方第二条大规模在位者路径，降低单靠架构新颖性取胜的概率
      - - Lightmatter
        - 相邻光子基础设施替代方案
        - 前沿训练和推理基础设施
        - 面向 AI 集群扩展的光子互连和光引擎平台，而不是神经形态计算
        - 公开路线图声称支持 100,000+ GPU fabric、重大融资和量产规模合作伙伴
        - 重要之处在于，它攻击同一个数据中心瓶颈——AI 数据移动——却不要求买方采用全新的计算范式
    notes: 各行比较部署目标和商业化姿态，而不是实验室最佳基准。“成熟度 / 规模信号”指本轮保留的最强公开信号， 范围从招聘和博客深度，到已出货系统和公开资本市场活动。
