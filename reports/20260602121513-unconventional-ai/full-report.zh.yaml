      - number: '3.3'
        title: 护城河耐久性与神经形态热潮的反向视角
        blocks:
          - type: paragraph
            body: >-
              Unconventional AI 最强的护城河论点，不是它发明了某个更好的乘加模块；而是系统级 AI
              效率需要打碎模型设计、内存层级、物理动力学和硬件架构之间的边界。如果这个判断成立，一个全栈、协同进化的组织就可能重要。但反向案例很强，不应淡化。第一，过往神经形态和非常规硬件努力显示，效率主张不会自动转化为数据中心采用。独立评述反复指出，缺失层是易用性：软件可移植性、标准接口、可靠性、标准化和熟悉的编程模型。第二，许多更早的工业神经形态押注要么停留在研究中心，要么输给张量处理器生态，而这正是
              Unconventional 试图避开的路径。第三，Unconventional 强调的买方瓶颈——数据搬运、内存局部性和系统能耗——并非神经形态或混合信号设计独占。Cerebras
              用巨型片上内存攻击它；Lightmatter 用光子互连攻击它；NVIDIA 和 AMD
              用全栈平台集成和快速产品节奏攻击它。这削弱了“架构新颖性本身就能创造持久护城河”的说法。最后，另类芯片历史显示，对抗资本重力很难：Graphcore 曾有可信技术，最终仍依赖战略母公司；而这里的公开证据还没显示
              Unconventional 已从优雅逻辑跨入客户验证平台。如果 Unconventional
              在可部署系统上证明可重复的数据中心推理优势，并配套可用工具，护城河可能成真。在此之前，更保守的看法是：它拥有强研究逻辑，也拥有年轻公司少见的强资产负债表，但仍面对历史上限制神经形态和非 GPU
              挑战者的同一个商业化陷阱。
