      - number: '1.3'
        title: 资本基础、投资人联盟与可能的 GTM
        blocks:
          - type: paragraph
            body: >-
              对如此年轻的公司而言，融资事实被异常充分地交叉印证。官方、Bloomberg、TechCrunch、SiliconANGLE 及其他报道均指向同一组条款：由 Lightspeed 和 Andreessen
              Horowitz 领投，完成 $475 million 种子轮，估值 $4.5 billion。多家来源还点名 Sequoia、Lux Capital、DCVC、Future Ventures 和 Jeff
              Bezos，CNBC 后续又把 Bezos 的参与关联到 Bezos Expeditions。Bloomberg 另称 Databricks 参投，多家来源表示 Rao 个人按相同条款投资 $10
              million。TechCrunch 提到，此次关闭可能只是更大一轮融资的第一笔，最终规模可达 $1 billion。


              公开 GTM 证据仍是间接的。审阅来源没有披露客户、收入或已发货产品，因此商业动作只能从产品逻辑和买方痛点推断。最可能的路径是企业基础设施：围绕更高效的 AI
              算力栈，向受电力、成本和扩展限制约束的超大规模云厂商、模型开发方和数据中心运营商销售或合作。Lightspeed 和 a16z 的投资人文章强化了这个判断；它们承保的是一个绑定 AI
              基础设施经济性的硬件平台赌注，而不是快速变现的软件故事。
