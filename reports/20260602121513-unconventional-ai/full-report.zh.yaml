  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型、变现与牵引缺口
        blocks:
          - type: paragraph
            body: >-
              Unconventional AI 今天并未销售公开产品。公司材料和创始人访谈描述的是一个多年研究项目，要构建新的 AI 优先算力基底；The Register 引述 Naveen Rao
              称，公司两年内不会有产品，接下来几年都会处于研究模式。因此，当前财务故事是计划中的变现，而不是已经发生的商业活动。


              最可能的未来收入模型以硬件为主：架构得到验证后，销售定制芯片、参考系统和紧密耦合的软件接口。官方文章聚焦每 token
              焦耳、内存搬运、模拟动力学，以及模型加硬件协同设计；没有披露客户、合同、标价、按用量收费，或任何经常性软件收入。如果商业化通过硬件发货到来，收入确认可能是一次性且批量波动的，而不是 SaaS 式 ARR。


              公开牵引指标同样缺席。审阅来源没有披露收入、ARR、客户数、设计赢单或任何已签商业承诺。公司 $0.5 million
              的学术资助计划对生态建设有战略价值，但它不是运营收入，也不应被视为客户牵引。因此，收入问题不是报道收入是否在增长，而是任何变现路径是否已经越过概念阶段。公开证据显示还没有。
