        - Rao 与投资人财团构成稀缺的创始人 + 资本组合，能够招募人才并熬过长周期。
        - TechCrunch、a16z、Lightspeed 和市场报道都指向创始人履历和顶级背书。
        - 证据显示招聘和后续融资准入弱于市场假设。
      - - 乐观
        - 2025-2026 年市场愿意为前沿 AI 创始人支付异常高的种子轮价格。
        - Thinking Machines 和 SSI 显示，市场可以支撑极端早期估值。
        - 前沿 AI 私募定价急剧重置，或可比公司下一轮失败。
      - - 悲观
        - Unconventional 目前没有公开产品、客户或收入证明。
        - 已审阅来源披露了愿景和融资，但没有披露商业牵引。
        - 具名试点、设计伙伴或有收入合同。
      - - 悲观
        - 管理层称未来几年是研究和原型迭代阶段。
        - The Register 和 DCD 都引用了 Rao 关于多年路径才能找到正确范式的说法。
        - 基准测试或商业化时间线快于预期。
      - - 悲观
        - 估值已经计入了可能永远无法在硬件中兑现的成功情景。
        - GeekWire、CNBC、Forbes 和 Graphcore 历史都显示，过度支付创始人履历可能带来下行。
        - 后续轮次或战略交易以更强证明验证当前估值。
    notes: 乐观和悲观论点刻意成对呈现。本章讨论的是价格纪律，而不是泛泛的公司质量评分。
