      - number: '7.3'
        title: 软件生态、竞争压力与融资风险
        blocks:
          - type: paragraph
            body: >-
              Unconventional 不只是要造出更好的芯片；它还要打败已经掌握开发者、模型、云分发和生产经济性的既有生态。Andreessen Horowitz 公开表示，GPU 仍是 AI
              的骨干，投资目的在于探索设计空间里的一个新硬件点，因为 Nvidia 的硬件和软件生态非常强。Nvidia 自己的 CUDA
              材料也强化了这条护城河：开发者获得编译器、库、调试工具、运行时层和广泛装机基础；CUDA-X 声称拥有超过 100 万开发者和数百个库。这个领域也没有停下。AWS 用 Neuron SDK、原生 PyTorch
              集成、自定义内核，以及相对 GPU 实例更好的性价比主张来营销 Trainium；Google 用 PyTorch、JAX 和 vLLM 支持，在 Gemini 规模上营销 TPU；AMD
              继续在更广泛的加速器和工具组合中扩展 Instinct。这些既有玩家会压缩任何缺少即时软件兼容性的新架构可用的空白。


              资本降低了近期生存风险，但抬高了业绩门槛。TechCrunch 表示，据报道 $475 million 种子轮只是首笔交割，整轮最终可能达到 $1 billion；GeekWire 则把
              Unconventional 归为没有产品的 “Virgin Unicorn”。Forbes 认为，AI
              种子市场目前容易受到估值阶梯影响；这些阶梯建立在耐久性薄弱、试点悬崖和动量上，而不是已证明的经常性经济性。Morgan Stanley 同样表示，市场正在为货币化付费，并惩罚 2026 年 AI
              建设中的不确定性。对 Unconventional
              来说，这意味着下一次融资事件可能不再主要取决于背景光环，而取决于公司能否在既有玩家再次抬高基准之前，拿出经过基准测试的原型证据、可信的软件路径和可相信的收入路线。
