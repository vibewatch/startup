        - 继续研究
        - 公开证据足以研究公司，但不足以把当前价格承销为可投资。
        - 保持接触，但没有私下尽调前，不要按当前估值承诺出资。
      - - 信心
        - 中
        - 估值、时间线和可比事实是公开的，但经济性和条款仍是私有信息。
        - 把结论视为方向性，而不是最终判断。
      - - 风险评级
        - 高
        - 公司还没有产品，硬件属性重，并明确处在多年研究路径上。
        - 假设技术和融资风险都高。
