  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户地图与买方痛点：客户名单尚未出现，但 ICP 已经清楚
        blocks:
          - type: paragraph
            body: >-
              截至 2026-06-02 的报告运行日，Unconventional 的公开客户叙事更像 ICP 叙事，而不是采用叙事。官网、发布文章和技术写作都围绕 AI
              能效展开，而不是围绕一个已经完成、并有具名标杆客户的终端产品。更具体地说，官方最强表述集中在数据中心推理、每 token 焦耳、内存搬运和软硬件协同设计。这首先指向超大规模云厂商、模型实验室和大型 AI
              平台运营商；它们真正的问题不是泛泛的 AI
              热情，而是在固定电力、制冷和成本边界内服务更多推理。在这些账户里，潜在买方大概率是基础设施或平台负责人，用户是模型服务和系统团队，付费来源是基础设施预算，而不是部门级软件预算。


              买方侧来源也强化了这一逻辑。Google 表示，AI 使用量上升后，推理效率会变得更重要，并描述 Cloud 客户正在使用为推理优化的 TPU 基础设施。Microsoft 表示，Maia 200 在服务
              OpenAI 和 Microsoft 工作负载时，提升了 Azure 全球机群的每美元性能并降低了功耗。JLL 表示，接入电力的速度已经成为 AI 基础设施选址的首要标准。合在一起，这些来源不能证明
              Unconventional 已经卖进这些账户，但确实说明公司瞄准的痛点真实且昂贵。边缘 OEM、机器人和国防买方也与该逻辑相符，但这种匹配目前主要由相邻来源支撑，而不是由 Unconventional
              自身的顶层信息支撑。
