    {
      "id": "physics-first-architecture",
      "title": "Physics-first architecture and the 1000x efficiency thesis",
      "body": "Mechanistically, Unconventional is unusually explicit about what it thinks is broken in current AI hardware. The company’s 1000x post says the relevant comparison is end-to-end system energy, not building-block TOPS/W, and argues that inference energy is dominated by storage, access, and movement rather than arithmetic. Its own rough calculations for a 100B-parameter model put arithmetic energy around 0.007 Joules per token, SRAM reads around 0.2 Joules per token, and HBM reads around 3.9 Joules per token before accounting for KV-cache overhead. That is why the same post keeps returning to locality, parameter reuse, recurrence, alternatives to attention, and possible 3D-integrated memory. The architecture thesis is therefore less “we found a better multiply-accumulate” than “we need a substrate that keeps model state physically close to where it is used.”\n\nThe company’s analog essay is equally important because it narrows the claim. Unconventional does not say analog is a free lunch. It says analog efficiency falls apart at higher precision because thermal noise forces larger capacitance, that analog memory is still unresolved enough to require expensive interface overheads, and that great fJ/op numbers can still lose at the system level if noise, rewrites, or larger models increase traffic and degrade iso-accuracy. In other words, the optimistic case depends on mixed-signal co-design, not on a naive analog-versus-digital narrative. Public materials treat the 1000x target as a stack-level outcome that may come from many smaller wins—better locality, more suitable model classes, recurrence, sparsity, lower movement, and circuits that exploit physics directly where that trade-off is actually favorable.",
