    "number": 5,
    "title": "Product & Technology",
    "summary": "Unconventional AI's product is best understood as a research-stage datacenter inference stack—custom silicon, local-memory architecture, and model/hardware co-design—rather than as a disclosed chip SKU. Official materials support a physics-first, mixed-signal, 1000x-efficiency thesis centered on data movement and Joules-per-token, but the public record still lacks manufacturability, tooling, benchmark, and qualification evidence, so the product case remains more compelling as a research roadmap than as a ship-ready platform."
  },
  "sections": [
    {
      "id": "product-definition-workloads",
      "title": "Product definition and target workloads",
      "body": "Unconventional AI is not presenting a conventional chip catalog today. Its official materials describe a “new physical substrate for intelligence” aimed at biology-scale efficiency, while third-party coverage says Rao envisions both custom silicon and server infrastructure. The clearest workload wedge is datacenter generative-AI inference: the company’s detailed efficiency post defines success as lower Joules per token or Joules per image at matched output quality, and still treats latency, throughput, area, and price as secondary constraints rather than the primary objective. Rao also told The Register that diffusion, flow, and related dynamics-friendly models are natural candidates for this sort of substrate, which implies the first target is not general-purpose compute but inference workloads whose cost is dominated by movement of weights and state.\n\nThe important product implication is that the company is building a stack, not just a die. Public posts imply at least a workload layer, model-design choices shaped by substrate physics, a training or surrogate-model layer, a runtime/compiler layer, and custom silicon plus close memory. But the commercial surface still looks thin. The official site exposes a homepage, technical blog, grant program, and a sparse careers page; it does not expose SKUs, price sheets, benchmark dashboards, API documentation, or named customer deployments. In customer-workflow terms, the product claim is therefore: help power-constrained datacenter inference teams lower energy per output by changing both the model form and the hardware substrate. In market-readiness terms, the public evidence still looks like a research program describing what could be sold later, not a sellable product today.",
