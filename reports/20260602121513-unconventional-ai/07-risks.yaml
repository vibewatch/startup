  claims:
  - id: CR001
    statement: Unconventional AI says it is rethinking the foundations of a computer to optimize energy efficiency for AI and bring biology-scale efficiency to artificial intelligence.
    type: company-claimed
    topic: company-thesis
    sourceRefs:
    - SR001
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR003
    - QR025
  - id: CR002
    statement: The public company site and careers messaging frame the team as built from AI systems, analog circuits, computing theory, and neuroscience expertise.
    type: company-claimed
    topic: talent-mix
    sourceRefs:
    - SR001
    - SR007
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR025
    - QR026
  - id: CR003
    statement: Unconventional's launch and technical posts frame the strategy as co-evolving AI models and hardware rather than slotting a new chip under today's software abstractions.
    type: company-claimed
    topic: co-design
    sourceRefs:
    - SR002
    - SR003
    - SR005
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR003
  - id: CR004
    statement: Unconventional says the relevant benchmark is end-to-end joules per token or image at iso-quality versus state-of-the-art GPUs or TPUs, and that the meaningful conventional baseline keeps moving toward 2030.
    type: company-claimed
    topic: benchmarking
    sourceRefs:
    - SR005
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR003
  - id: CR005
    statement: Unconventional argues that data movement and off-chip HBM access dominate modern inference energy, so a large efficiency gain requires solving memory locality rather than only arithmetic efficiency.
    type: company-claimed
    topic: data-movement
    sourceRefs:
    - SR005
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR003
    - QR005
  - id: CR006
    statement: Unconventional says Amdahl's Law means a 1000x gain requires optimizing nearly the whole system, not just a single compute block.
    type: company-claimed
    topic: system-optimization
    sourceRefs:
    - SR005
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR003
  - id: CR007
    statement: Unconventional's analog blog says thermal noise causes analog energy cost to rise steeply with precision and that dense, acceptable analog memory is still a work in progress.
    type: company-claimed
    topic: analog-noise
    sourceRefs:
    - SR004
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR004
    - QR006
  - id: CR008
    statement: Unconventional's analog blog says the best analog dot-product efficiency advantage over digital is smaller than hoped and can be offset by system-level accuracy, write-energy, and memory tradeoffs.
    type: company-claimed
    topic: analog-tradeoffs
    sourceRefs:
    - SR004
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR004
  - id: CR009
    statement: Unconventional says current AI hardware is stuck in an innovation logjam because model builders assume only existing primitives and hardware designers feel constrained by those workloads.
    type: company-claimed
    topic: abstraction-lock-in
    sourceRefs:
    - SR003
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR003
    - QR017
