- id: SR002
  title: Manufacturing, foundry, and regulatory dependency risk
  body: |-
    Even if the technical thesis works in simulation, Unconventional still has to manufacture something real inside a semiconductor supply chain that is already capacity-constrained and geopolitically managed. The company's grant program explicitly says it prefers 3D-integration work only when there is a path to volume manufacturing within five years, which is effectively an admission that manufacturability is part of the core challenge. Moody's describes leading-edge semiconductor production as concentrated in a small number of regions and firms, with TSMC near 70% foundry share, limited redundancy among specialty suppliers, and qualification cycles that can take months. CNBC and Epoch go further for AI chips specifically: advanced packaging and HBM, not just logic dies, were the principal bottlenecks in 2025, and Nvidia plus other hyperscalers already consume the overwhelming majority of CoWoS and HBM capacity.

    For a startup that may need analog or mixed-signal silicon, advanced packaging, and a foundry willing to allocate scarce capacity to an unproven architecture, this concentration creates schedule, cost, and even existence risk. The policy layer compounds the problem. CRS and GAO show that export controls now span not just chips but the broader stack of HBM, advanced packaging, testing, EDA, and manufacturing equipment, while Mayer Brown notes that the January 2026 policy added new end-user diligence, third-party testing, and certifications that exports will not divert foundry capacity from U.S. demand. Baker Botts, Gunderson, and ML Strategies also describe a live 2026 patchwork of state, federal, and cross-border AI rules. A startup still defining its hardware stack therefore faces both industrial concentration risk and rising compliance overhead before it has even disclosed a commercial product.
