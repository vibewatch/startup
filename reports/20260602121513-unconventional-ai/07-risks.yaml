- id: TR005
  title: Mitigation and Kill Criteria Table
  columns:
  - Risk
  - Monitorable Trigger
  - Threshold / Event
  - Action Implication
  rows:
  - - Technical proof risk
    - Public prototype disclosures, papers, or benchmark posts
    - No measured prototype materially beating a named GPU/TPU baseline on iso-quality joules/token before the next financing milestone
    - Treat as thesis break on physics-to-product timing; stop underwriting 1000x claims as near-term value
  - - Manufacturing / foundry path risk
    - Foundry, packaging, or memory partner disclosures
    - No credible named manufacturing path or capacity strategy once the company claims it is moving past research
    - Freeze manufacturing upside assumptions and model major schedule slippage
  - - Software ecosystem risk
    - SDK, compiler, framework, or developer-preview disclosures
    - No visible path to mainstream frameworks or customer evaluation stack within 12-18 months
    - Discount adoption velocity and narrow the credible TAM to bespoke research use cases
  - - Regulatory / export-control risk
    - BIS guidance, export-license news, tariff changes, or company legal disclosures
    - License denial, adverse classification, or rules that materially constrain target markets or foundry access
    - Rebuild the supply-chain model and assume higher compliance cost and slower commercialization
  - - Fundraising and time-to-revenue risk
    - Fundraise announcements, product/pilot updates, and customer proof
    - Need for another mega-round before prototype proof or any customer/pilot disclosure
    - Expect dilution, longer time-to-revenue, and lower valuation confidence
  notes: These triggers are chosen to be monitorable from public evidence. They are intended for investment underwriting rather than operational management.
