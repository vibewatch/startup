  evidenceGaps:
  - type: missing-source
    severity: material
    topic: foundry-path
    missingEvidence: Named foundry, advanced-packaging, HBM, and yield/reservation evidence for prototype and volume plans.
    whyItMatters: The company's economics and schedule depend on manufacturing access that public sources do not yet identify or verify.
    diligencePath: Request NDA-backed manufacturing roadmap, vendor list, process-node assumptions, package architecture, and any reserved-capacity documentation.
    relatedQuestionRefs:
    - QR010
    relatedTableRefs:
    - TR003
  - type: missing-source
    severity: material
    topic: mitigation-maturity
    missingEvidence: Prototype benchmarks, SDK/compiler roadmap, internal controls, and stage-gate evidence showing risks are shrinking rather than merely described.
    whyItMatters: Public mitigations today are mostly talent and capital based; without operating proof it is impossible to score mitigation maturity confidently.
    diligencePath: Request prototype readouts, software-stack roadmap, benchmarking methodology, and internal risk-review cadence from management.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR002
    - TR005
  - type: missing-source
    severity: material
    topic: compliance-surface
    missingEvidence: Public or private security, privacy, export-control, customer-terms, and compliance ownership documentation.
    whyItMatters: The active website surface is thin, and the 2026 regulatory environment makes it risky to assume readiness without documentation.
    diligencePath: Request policy library, export-control memo, data-governance owner, security program summary, and customer legal templates.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: commercial-milestones
    missingEvidence: Internal milestone plan covering prototype timing, customer pilots, benchmark thresholds, and revenue objectives before the next financing event.
    whyItMatters: Without milestone visibility, investors cannot tell whether another large round would fund scaling a proven path or simply extend research burn.
    diligencePath: Request board-approved roadmap, financing plan, prototype gates, customer-engagement pipeline, and planned disclosure cadence.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR005
