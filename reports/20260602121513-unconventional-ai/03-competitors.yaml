    title: Competitive positioning map
    type: quadrant
    layout: standard
    summary: >-
      Ordinal view of commercialization maturity versus architectural unconventionality across the most relevant
      rival classes.
    data:
      xAxis: >-
        Commercialization maturity (1 = early thesis / research surface, 10 = broadly shipped platform with
        procurement path and ecosystem)
      yAxis: >-
        Architectural unconventionality (1 = mostly conventional digital extension, 10 = major departure from
        mainstream AI compute assumptions)
      points:
        - label: Unconventional AI
          x: 2
          'y': 9
          detail: Radical architecture thesis and large funding, but retained public surface is still pre-product.
        - label: Intel Loihi / Hala Point
          x: 5
          'y': 8
          detail: Deeply resourced neuromorphic program with research system scale and open tooling.
        - label: IBM TrueNorth / NorthPole
          x: 3
          'y': 8
          detail: Important architectural benchmark line with less evidence here of broad current productization.
        - label: BrainChip Akida
          x: 7
          'y': 7
          detail: Commercial neuromorphic edge stack with public tools, products, and deployment posture.
        - label: Mythic
          x: 4
          'y': 8
          detail: Analog compute-in-memory architecture with public tooling but thinner retained commercial proof.
        - label: Graphcore
          x: 6
          'y': 6
          detail: Real alternative-AI-chip platform, but independent coverage shows severe capital and traction pressure.
        - label: Cerebras
          x: 7
          'y': 7
          detail: Shipping unconventional datacenter systems and public-capital ambitions via S-1.
        - label: NVIDIA
          x: 10
          'y': 3
          detail: Broadly deployed incumbent platform spanning edge, enterprise, and hyperscale data centers.
        - label: AMD
          x: 9
          'y': 4
