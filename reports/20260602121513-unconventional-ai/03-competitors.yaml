    - type: private-evidence-only
      severity: material
      topic: commercialization-maturity
      missingEvidence: Specific Unconventional AI shipment, deployment, customer, or production-ramp metrics.
      whyItMatters: The difference between a well-funded thesis and an emerging commercial platform is central to moat and maturity assessment.
      diligencePath: Request management disclosure on prototype status, first silicon, pilot customers, foundry/packaging partners, and deployment timeline.
      relatedQuestionRefs:
        - QP026
      relatedTableRefs:
        - TP001
    - type: missing-source
      severity: material
      topic: benchmarking
      missingEvidence: Apples-to-apples benchmark results comparing Unconventional AI’s claimed system-level efficiency against GPUs, Cerebras, or other alternatives on the same workloads.
      whyItMatters: The core competitive case depends on whether the claimed datacenter advantage survives standardized measurement rather than architecture-level rhetoric.
      diligencePath: Obtain third-party benchmark methodology, workload definitions, latency constraints, and measured joules-per-token results on equivalent models.
      relatedQuestionRefs:
