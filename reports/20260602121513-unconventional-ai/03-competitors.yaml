chapter:
  number: 3
  title: Competitors
  summary: >-
    Unconventional AI sits between neuromorphic research programs and cloud-scale AI-systems challengers: its
    official thesis is datacenter inference with 1000x energy-efficiency gains from full-stack co-design,
    analog-plus-dynamical hardware, and reduced data movement. The strongest near-term competitive pressure,
    however, comes less from edge-first neuromorphic products than from incumbents and well-capitalized
    alternatives such as NVIDIA, AMD, Cerebras, and adjacent photonic infrastructure plays, all of which ship
    real platforms today and already own software, distribution, or systems-integration leverage.
sections:
  - id: SEC301
    title: Landscape and architecture classes
    body: >-
      Unconventional AI is not competing in a single clean lane. Its own official materials describe a
      datacenter-focused attempt to cut generative-AI inference energy by 1000x through co-evolving AI models
      and hardware, using mixed analog and digital circuits, nonlinear dynamics, and a deliberate attempt to
      minimize data movement rather than merely improve TOPS per watt. That places it closest to the cloud- and
      datacenter-oriented challengers that attack the memory or systems bottleneck—Cerebras through wafer-scale
      on-chip memory and system integration, and adjacent photonic players such as Lightmatter through
      interconnect scale-up—while still sharing some intellectual DNA with neuromorphic and analog efforts such
      as Intel Loihi, IBM TrueNorth and NorthPole, BrainChip Akida, and Mythic. The important distinction is
      deployment target. BrainChip and Mythic are explicitly edge-first and ultra-low-power, optimized for
      sensor, robotics, appliance, and embedded use cases. Intel’s Loihi and Hala Point remain heavily
      research-framed, with open tooling and community-building but no evidence in this run of mainstream cloud
      deployment at NVIDIA-scale. IBM’s TrueNorth and NorthPole remain crucial proof points for what architectural
      departures can do for energy and memory locality, but the retained independent literature still frames IBM
      more as a benchmark setter than as a current commercial platform owner. By contrast, NVIDIA and AMD span
      both edge and cloud today, while Cerebras sells whole datacenter systems. The practical competitor map is
      therefore layered: research neuromorphic programs prove the physics, edge neuromorphic products prove some
      commercial willingness to adopt brain-inspired hardware, and incumbent data-center vendors define the real
      buying baseline that Unconventional ultimately has to displace.
