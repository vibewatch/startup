  - id: SEC302
    title: Commercialization maturity, deployment target, and capital asymmetry
    body: >-
      The biggest strategic split in this landscape is between architectures that are intellectually compelling and
      architectures that a buyer can actually procure, integrate, and support. Unconventional AI’s official
      launch materials are unusually ambitious for a seed-stage hardware company and unusually well funded, but
      they still read like a recruiting-and-thesis surface rather than a product catalog: the company discloses a
      large seed round, publishes architectural essays, and is hiring across hardware, software, and algorithms,
      yet the retained public evidence does not show shipping systems, customer deployments, benchmark suites, or
      commercial packaging. BrainChip looks much more mature in a narrow edge lane because it offers processor
      IP, tools, models, a cloud benchmark surface, and production-oriented edge products. Mythic similarly
      presents a concrete analog compute architecture and deployment toolchain for edge devices, even if the
      public surface here remains light on large-scale commercial proof. Graphcore and Cerebras sit closer to
      Unconventional’s datacenter ambition, but in very different states: Graphcore’s technology remains
      relevant, yet independent coverage shows how difficult it was to translate alternative-chip technical merit
      into durable standalone scale, culminating in sale talks and eventual SoftBank ownership. Cerebras, by
      contrast, sells whole systems and even pursued an IPO, signaling a much more concrete capital-markets and
      enterprise-systems posture. NVIDIA and AMD are the hardest comparators because they already span the edge
      to cloud continuum with shipping hardware plus developer stacks, partners, and enterprise buying motions.
      Public pricing is also materially asymmetric. Most unconventional-hardware vendors in this source set expose
      only contact-sales or product-family surfaces, whereas NVIDIA at least exposes Jetson developer kits and a
      far broader buying ecosystem. In other words, Unconventional’s fundraising narrows one problem—runway—but
      not the more important commercialization gap between architectural promise and fielded platform maturity.
