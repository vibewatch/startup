  - id: SEC303
    title: Moat durability and the adverse lens on neuromorphic hype
    body: >-
      Unconventional AI’s strongest moat argument is not that it has invented one better multiply-accumulate
      block; it is that system-level AI efficiency requires collapsing the boundaries between model design,
      memory hierarchy, physical dynamics, and hardware architecture. If that is true, then a full-stack,
      co-evolutionary organization could matter. But the adverse case is powerful and should not be softened.
      First, prior neuromorphic and unconventional hardware efforts show that efficiency claims do not convert
      automatically into datacenter adoption. Independent reviews repeatedly argue that the missing layer is ease
      of use: software portability, standard interfaces, reliability, standardization, and familiar programming
      models. Second, many earlier industrial neuromorphic bets either stayed research-centric or lost ground to
      tensor-processor ecosystems, which is exactly the path Unconventional is trying to avoid. Third, the buyer
      bottleneck Unconventional highlights—data movement, memory locality, and system energy—does not belong
      exclusively to neuromorphic or mixed-signal designs. Cerebras attacks it through giant on-chip memory;
      Lightmatter attacks it through photonic interconnect; NVIDIA and AMD attack it through full-stack platform
      integration and rapid product cadence. That weakens any claim that architectural novelty alone creates a
      durable moat. Finally, alternative-chip history shows how hard it is to fight capital gravity: Graphcore had
      credible technology and still ended up relying on a strategic parent, while public evidence here does not
      yet show that Unconventional has crossed from elegant thesis to customer-proven platform. The moat could
      become real if Unconventional proves a repeatable datacenter inference advantage on deployable systems with
      usable tooling. Until then, the more conservative view is that it has a strong research thesis and an
      unusually strong balance sheet for a young company, but it still faces the same commercialization trap that
      has historically limited neuromorphic and non-GPU challengers.
