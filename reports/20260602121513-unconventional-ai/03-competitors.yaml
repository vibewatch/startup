callouts:
  - calloutType: insight
    title: Closest practical rival set is more cloud-system than edge-neuromorphic
    body: >-
      Unconventional AI borrows ideas from neuromorphic and analog computing, but its stated target is
      datacenter inference, so the most consequential competitive comparison is against Cerebras, NVIDIA, AMD,
      and adjacent infrastructure players like Lightmatter rather than against purely edge-first chips.
    claimRefs:
      - CP001
      - CP003
      - CP022
      - CP025
      - CP028
      - CP032
      - CP043
  - calloutType: risk
    title: Prior category history weakens the clean-moat story
    body: >-
      The harsh historical lesson from Loihi, TrueNorth, Graphcore, and the broader neuromorphic literature is
      that software portability, integration friction, and capital endurance matter at least as much as raw
      efficiency claims.
    claimRefs:
      - CP020
      - CP034
      - CP035
      - CP039
      - CP040
      - CP041
      - CP042
