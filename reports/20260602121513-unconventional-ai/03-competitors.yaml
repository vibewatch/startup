    rows:
      - - Unconventional AI
        - Reference company
        - Datacenter GenAI inference
        - >-
          Full-stack co-design of AI models and hardware; mixed analog and digital circuits; dynamical systems;
          data-movement minimization
        - >-
          Official launch, technical blog series, recruiting surface, and disclosed mega-seed financing; no
          shipped product catalog retained in this run
        - >-
          Strong architectural ambition and financing, but moat is still thesis-led until deployable systems and
          tooling are public
      - - Intel Loihi / Hala Point
        - Research neuromorphic benchmark
        - Edge and research-scale adaptive AI systems
        - >-
          Sparse event-driven spiking computation with integrated memory and open-source Lava tooling
        - >-
          Intel-backed research program with 1.15B-neuron Hala Point and explicit path from prototypes toward
          products
        - >-
          Strongest proof that large incumbents can fund neuromorphic R&D for years, weakening any claim that
          only startups can explore the space
      - - IBM TrueNorth / NorthPole
        - Landmark neuromorphic / in-memory benchmark
        - Research and inference benchmark setting
        - >-
          Energy-efficient neuromorphic or in-memory designs that minimize off-chip memory access for inference
        - >-
          Historically important efficiency benchmarks, but retained evidence points more to architectural proof
          than a broad commercial platform
        - >-
          Shows that striking efficiency results can stop at benchmark status without becoming a dominant product
      - - BrainChip Akida
        - Commercial neuromorphic edge product
        - Edge AI, always-on sensing, embedded devices
        - >-
          Sparse neuromorphic processor IP plus cloud, models, and tools tuned for ultra-low-power edge workloads
        - >-
          Public product stack, shop, developer surfaces, and explicit edge modalities make it one of the most
          commercialized neuromorphic offers in the set
        - >-
          Validates real demand for low-power neuromorphic deployment, but mainly in edge categories rather than
          Unconventional’s datacenter target
      - - Mythic
        - Analog compute-in-memory edge accelerator
        - Edge devices with some server-tooling adjacency
        - >-
          Tile-based analog compute-in-memory APU with dataflow architecture and compiler/toolchain support
        - >-
          Public architecture and software story exist, but retained evidence is thinner on scaled commercial
          adoption than on technical design
        - >-
          Relevant as a warning that analog novelty can attract interest without yet establishing broad market
          lock-in
      - - Graphcore
        - Alternative AI-chip / system vendor
        - Cloud and datacenter AI
        - >-
          IPU-based alternative to GPU-centric AI infrastructure
        - >-
          Independent coverage shows sale talks, heavy losses, SoftBank ownership, and renewed financing/hiring
        - >-
          Strong example that technical differentiation can still lose to ecosystem and capital asymmetry
      - - Cerebras
        - Datacenter unconventional-compute system
        - Private cloud and enterprise AI / HPC supercomputing
        - >-
          Wafer-scale system with massive on-chip memory and bandwidth to reduce the memory wall
        - >-
          Shipping CS-3 systems plus 2024 S-1 filing indicate a much more productized cloud-scale posture than a
          typical research startup
        - >-
          One of the clearest direct benchmarks for whether a non-GPU architecture can win in datacenter buying
          cycles
      - - NVIDIA
        - Incumbent full-stack platform
        - Edge, enterprise, cloud, and hyperscale AI
        - >-
          Unified accelerated-computing platform spanning Jetson edge modules, Blackwell data-center GPUs, CPU,
          networking, and software
        - >-
          Shipping edge kits, partner network, public-company reporting, and broad deployment surfaces across the
          stack
        - >-
          Hardest overall rival because buyers can stay inside an existing software and supply-chain orbit
      - - AMD
        - Incumbent challenger platform
        - Edge embedded AI plus data-center AI
        - >-
          Adaptive SoCs for real-time edge inference plus Instinct accelerators and developer tooling for cloud AI
        - >-
          Public product portfolio spans edge and data center with ROCm, Vitis, and enterprise AI resources
        - >-
          Gives buyers a second large-scale incumbent path, reducing the odds that architecture novelty alone wins
      - - Lightmatter
        - Adjacent photonic infrastructure alternative
        - Frontier training and inference infrastructure
        - >-
          Photonic interconnect and light-engine platform for AI-cluster scale-up rather than neuromorphic compute
        - >-
          Public roadmap claims 100,000+ GPU fabrics, major funding, and production-scale partners
        - >-
          Important because it attacks the same datacenter bottleneck—movement of AI data—without requiring
          buyers to adopt a wholly new compute paradigm
    notes: >-
      Rows compare deployment target and commercialization posture, not laboratory-best benchmark claims. “Maturity
      / scale signal” refers to the strongest public signal retained in this run, which ranges from hiring and
      blog depth to shipped systems and public-capital-market activity.
