  - id: TP004
    title: Moat durability / competitive risk register
    columns:
      - Moat claim
      - Threat
      - Severity
      - Evidence-backed rationale
      - Mitigation / diligence ask
    rows:
      - - Full-stack co-evolution produces a unique efficiency frontier
        - Incumbents already co-design hardware, software, networking, and deployment stacks at larger scale
        - High
        - >-
          NVIDIA and AMD already sell integrated developer and deployment ecosystems, while Unconventional’s
          retained public evidence is still pre-product
        - >-
          Request working-system proof on real datacenter inference workloads plus developer-tooling evidence, not
          only architectural essays
      - - Data-movement insight is a durable differentiator
        - Other vendors attack the same bottleneck via different levers
        - High
        - >-
          Cerebras uses on-chip memory and wafer-scale systems; Lightmatter uses photonic interconnect; incumbents
          use full-stack platform engineering
        - >-
          Show why Unconventional’s solution path beats alternative memory/interconnect fixes on deployable TCO
      - - Neuromorphic history proves brain-inspired hardware can leapfrog GPUs
        - Prior efforts often stayed niche, research-first, or software-fragmented
        - High
        - >-
          Independent reviews stress that commercial adoption hinges on APIs, integration, reliability, and
          standardization, not just energy benchmarks
        - >-
          Demand benchmark methodology, compiler story, standard interfaces, and reference deployments
      - - Large seed financing creates a capital moat
        - Capital-rich incumbents and strategic parents still dwarf startup runway
        - Medium
        - >-
          Graphcore’s history shows that hundreds of millions can still be insufficient against ecosystem gravity,
          while NVIDIA and AMD remain public-scale incumbents
        - >-
          Ask for multi-year supply-chain, packaging, and software-budget plan, not just financing headline
      - - Edge neuromorphic products validate a path to broader disruption
        - Edge commercialization may not transfer to datacenter workloads
        - Medium
        - >-
          BrainChip and Mythic prove there is an edge market for low-power AI, but retained literature says
          datacenter commercialization remains unresolved for neuromorphic hardware
        - >-
          Separate edge lessons from cloud inference requirements and quantify what truly transfers
      - - Architecture novelty is itself the moat
        - Buyers may prefer incremental alternatives that preserve existing software and workflows
        - High
        - >-
          The same bottlenecks can be attacked by systems vendors, GPU platforms, or photonic infrastructure
          without forcing a wholesale programming-model shift
        - >-
          Test buyer willingness to rewrite workflows or adopt new toolchains versus buying better incumbent
          hardware
    notes: >-
      Severity measures pressure on Unconventional’s future competitive position, not certainty of failure. The
      dominant risks are commercialization and ecosystem risks, not only raw silicon-performance risks.
