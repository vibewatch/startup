    severity: material
    topic: governance
    missingEvidence: >-
      Board composition, observer rights, and any governance arrangements associated with the lead investors or
      Databricks participation.
    whyItMatters: >-
      Given the size of the seed round, governance rights will materially affect follow-on control, pace of spending,
      and founder dependency risk.
    diligencePath: >-
      Request the board deck, financing term sheet, or an investor-side governance summary that names directors,
      observers, and major protective provisions.
