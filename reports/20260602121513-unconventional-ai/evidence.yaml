evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: headquarters
    missingEvidence: >-
      An authoritative company filing, company profile, or direct management confirmation of headquarters and
      incorporation jurisdiction.
    whyItMatters: >-
      Location affects hiring market, legal entity diligence, tax assumptions, and basic company identity fields used
      across later chapters.
    diligencePath: >-
      Request the certificate of incorporation, most recent financing documents, or a direct investor/company
      confirmation of headquarters and entity domicile.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Revenue, customer count, headcount, product readiness, and any tape-out or deployment timeline.
    whyItMatters: >-
      These are the metrics required to judge whether the company is still a research bet or beginning to convert
      capital into commercial proof.
    diligencePath: >-
      Ask management or lead investors for a KPI pack covering headcount, hiring plan, technical milestones, and any
      pilot or customer commitments.
    relatedQuestionRefs:
      - QO018
      - QO019
      - QO021
    relatedTableRefs:
      - TO001
