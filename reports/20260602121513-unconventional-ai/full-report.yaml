              1000x energy-efficiency gain and is redesigning models plus hardware together around joules-per-token
              economics. Investor posts from a16z and Lightspeed frame the opportunity as a foundational compute
              problem, not a narrow chip optimization. That combination explains why the company can clear a very high
              price without conventional operating proof. But it also means the current valuation is mostly buying an
