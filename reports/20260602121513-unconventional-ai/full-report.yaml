      - number: '2.4'
        title: Policy and power-system rules will shape adoption timing as much as chip physics
        blocks:
          - type: paragraph
            body: >-
              The regulatory environment strengthens the market need for efficiency while complicating how fast any new
              architecture can scale. FERC is already forcing clearer large-load rules in PJM, EPA is building a
              permitting path for backup generation, and DOE is explicitly backing transmission, interconnection,
              efficiency, and flexible-load responses. That means policymakers increasingly accept AI data-centre load
              as a planning problem, not a temporary anomaly. At the same time, export controls and semiconductor policy
              mean a post-GPU architecture still inherits the same advanced-packaging, export-licensing, and
              manufacturing constraints as the incumbents. The resulting market logic is nuanced. Unconventional AI’s
              thesis is directionally right because customers are clearly running into power, cooling, and grid
              bottlenecks. But adoption will not be determined by thesis quality alone. It will depend on whether the
              company can show a product that wins on energy per inference inside a regulated, capacity-constrained, and
              software-dependent deployment stack. The market opportunity is therefore large, but the path to capture is
              gated by proof of integration, not just proof of concept.
