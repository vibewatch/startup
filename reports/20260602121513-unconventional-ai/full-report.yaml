  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: the bottleneck is power, not generic AI demand'
        blocks:
          - type: paragraph
            body: >-
              The relevant market for Unconventional AI is narrower than “all AI hardware” and broader than “one chip
              category.” The investable wedge is the set of AI workloads where electricity, rack power density, cooling,
              interconnection timing, and grid affordability now shape deployment timing as much as model demand does.
              IEA’s current base case puts total data-centre electricity at roughly 950 TWh by 2030, with AI-focused
              facilities growing even faster, while DOE/LBNL expects U.S. data-centre consumption to double or triple by
              2028. Those numbers matter because buyers are already paying for more than accelerators: they are paying
              for transmission upgrades, storage, backup generation, higher-density cooling, and permitting work. That
              means the status quo substitutes for Unconventional AI are not only NVIDIA or AMD cards; they are also gas
              turbines, batteries, liquid-cooling retrofits, queue positions, and software that squeezes more
              utilization from the same power envelope. Unconventional’s thesis fits this market boundary because it
              treats energy efficiency as the bottleneck variable customers are increasingly forced to buy around.
            claimRefs:
              - CM001
