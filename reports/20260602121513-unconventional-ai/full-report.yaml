      - number: '1.3'
        title: Capital Base, Investor Syndicate, and Likely GTM
        blocks:
          - type: paragraph
            body: >-
              The financing facts are unusually well corroborated for such a young company. Official, Bloomberg,
              TechCrunch, SiliconANGLE, and other coverage all align on a $475 million seed round at a $4.5 billion
              valuation, led by Lightspeed and Andreessen Horowitz. Multiple sources also name Sequoia, Lux Capital,
              DCVC, Future Ventures, and Jeff Bezos, while CNBC later ties the Bezos participation to Bezos Expeditions.
              Bloomberg additionally reports Databricks joined the round, and several sources say Rao personally
              invested $10 million on the same terms. TechCrunch notes the close may be only the first installment
              toward a larger round that could reach $1 billion.


              Public go-to-market evidence is still indirect. No reviewed source disclosed customers, revenue, or a
              shipped product, so the commercial motion must be inferred from the product thesis and buyer problem. The
              most plausible path is enterprise infrastructure: selling or partnering around a more efficient AI compute
              stack for hyperscalers, model builders, and data-center operators constrained by power, cost, and scaling
              limits. Investor essays from Lightspeed and a16z reinforce that view; they are underwriting a
              hardware-platform bet tied to AI infrastructure economics, not a quick-turn software monetization story.
