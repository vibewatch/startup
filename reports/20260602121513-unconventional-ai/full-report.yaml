      - number: '8.2'
        title: Comparable Financings and Scenario-Based Valuation Logic
        blocks:
          - type: paragraph
            body: >-
              The fairest public comparison set is not a clean revenue-multiple comp table, because Unconventional is
              still pre-product. The better anchors are other founder-led AI or AI-hardware financings that were priced
              on technical promise, talent density, or strategic scarcity. On that basis, the $4.5 billion mark is above
              Groq’s 2024 $2.8 billion valuation and above Tenstorrent’s 2024 valuation above $2.6 billion, even though
              those companies had more visible productization and, in Tenstorrent’s case, disclosed customer contracts.
              It also sits close to Safe Superintelligence’s 2024 $5 billion valuation while remaining far below the
              2025 Thinking Machines Lab outlier at $12 billion.


              Those comps support two different readings. The bullish reading is that the market is deliberately paying
              up for rare frontier founders and scarce AI infrastructure assets. The skeptical reading is that the
              market is already pricing later-stage proof into seed rounds. Because both readings are partially true,
              scenario ranges are more honest than a point estimate. The bull case assumes benchmarked technical proof
              plus first design partners and follow-on capital; the base case assumes partial de-risking without real
              revenue scale; the bear case assumes prolonged research, no product signal, and a harsher financing
              market.
