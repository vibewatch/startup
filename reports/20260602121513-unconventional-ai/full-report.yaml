      - number: '2.3'
        title: Analog and neuromorphic hardware have real efficiency promise, but not a commercial free pass
        blocks:
          - type: paragraph
            body: >-
              The technical case for unconventional architectures is no longer purely aspirational. IEEE Xplore frames
              neuromorphic chips as a response to the energy and scaling limits of large models, while recent Nature
              work shows concrete device-level gains such as compute-in-memory macros with very high TOPS-per-watt and
              signal-folding hardware that can cut vector-matrix multiplication power by up to 90% while preserving
              accuracy. That is the favorable side of the market. The unfavorable side is equally important. IEEE
              Spectrum argues the field still has no commercial breakout, still needs a killer application, and still
              lacks the high-level software stack that made GPU adoption easy. In other words, better physics does not
              automatically create a software ecosystem, design-in cycle, or procurement budget. For Unconventional AI,
              this means the market thesis is strongest where customers face hard power ceilings today, but the
              commercialization burden still includes developer tooling, workload fit, and proof that analog or
              neuromorphic designs outperform optimized digital inference in a repeatable production setting.
            claimRefs:
