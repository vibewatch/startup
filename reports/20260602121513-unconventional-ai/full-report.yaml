      - number: '2.2'
        title: 'Buyer map: inference and near-edge workloads create the clearest pain signal'
        blocks:
          - type: paragraph
            body: >-
              The demand signal is not uniform across AI buyers. Deloitte still expects giant AI data centres and
              expensive enterprise AI servers to perform almost all AI computing in 2026, which means hyperscalers and
              large enterprises remain the economic center of gravity. But inference changes the shape of the problem.
              Dell’Oro argues that inference workloads require higher availability, geographic distribution, and tighter
              latency guarantees than centralized training clusters, which pushes buildout toward near-edge sites closer
              to end users. That makes power efficiency valuable in three ways at once: it lowers the cost per inference
              request, helps more useful compute fit within fixed site allocations, and reduces the cooling and
              backup-power burden of smaller distributed sites. Google and Microsoft disclosures show that large buyers
              already operationalize this logic through demand response, hardware-selection criteria, utilization
              software, and power harvesting. AMD’s embedded roadmap reinforces the same point at the far edge:
              low-power inference is becoming a product requirement, even if it is not yet a substitute for hyperscale
              AI campuses.
