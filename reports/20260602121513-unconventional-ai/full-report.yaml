            body: >-
              Durability is currently unknowable from public evidence. No reviewed source gives customer count, contract
              length, renewals, NRR, GRR, churn, satisfaction, or repeat usage. No source discloses the mix between
              likely segments, the size of a first deployment, or whether any early counterparties are paying versus
              merely collaborating. That means the chapter cannot underwrite customer quality in the way a later-stage
              hardware or infrastructure company could. If revenue appears soon, it is likely to be concentrated in a
              handful of lighthouse accounts or programs because the company has not shown a broad channel, self-serve
              surface, or diversified installed base. This is the standard risk pattern for a deep-tech hardware
              platform: the first customer may be strategically important without making the business economically
              diversified.


              Adverse evidence makes that caution more than generic skepticism. PMC says neuromorphic commercialization
              still depends on solving programming and deployment-at-scale challenges. IEEE Spectrum points to real
              robotics and retail use cases but says companies still must prove those systems in messy real-world
              settings. The World Economic Forum highlights valuable edge AI demand but also underscores hard
              constraints around power, size, connectivity, and delay. Even Unconventional’s own analog essay admits
              that great component efficiency can fail to produce lower total energy per inference if noise or memory
              movement rise. Put together, the public customer picture supports a credible pain signal, plausible early
              buyers, and a long adoption cycle. It does not yet support claims of validated PMF, durable retention, or
              near-term diversified revenue.
