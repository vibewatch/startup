      - - Bull
        - The 2025-2026 market is willing to pay extraordinary seed prices for frontier AI founders.
        - Thinking Machines and SSI show the market can support extreme early valuations.
        - A sharp reset in frontier-AI private pricing or failed next rounds for comparable companies.
      - - Bear
        - Unconventional has no public product, customer, or revenue proof today.
        - Reviewed sources disclose the vision and funding but not commercial traction.
        - Named pilots, design partners, or revenue-bearing contracts.
      - - Bear
        - Management describes the next several years as research and prototype iteration.
