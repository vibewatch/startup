  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Benchmark package
        - Third-party or customer-validated energy, throughput, and latency benchmarks against named baselines
        - Core technical proof determines whether the thesis is real or just elegant narrative.
        - Request benchmark methodology, raw outputs, and replication detail from management.
      - - Customer demand
        - Named pilots, LOIs, or design partners with evaluation criteria
        - Demand proof is the bridge from science project to venture outcome.
        - Ask for pipeline by account, stage, workload, and decision timeline.
      - - Manufacturing economics
        - BOM, expected yield, packaging path, and gross-margin assumptions
        - A working prototype can still be a bad business if economics never close.
        - Review hardware cost model with the engineering and finance leads.
      - - Capital plan
        - Use-of-proceeds, burn assumptions, and expected timing for the rest of the 1B target
        - Return math changes if current investors are funding only the first leg of a much larger program.
        - Tie milestone plan to cash needs and next-round triggers.
      - - Term sheet
        - Preferences, pro-rata rights, governance, and any founder side terms
        - Late-stage downside protections can materially change effective entry price and control.
        - Obtain financing docs and map the cap-table stack.
      - - Milestone cadence
        - What management expects to release over the next 6-18 months
        - The market needs observable de-risking between now and the next round.
        - Request product, benchmark, and customer milestone calendar with dependencies.
    notes: These asks are ordered by what most directly changes the valuation read, not by general curiosity.
