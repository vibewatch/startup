      - number: '7.4'
        title: Residual exposure, public mitigations, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              There are real mitigants in the public record, but most are early-stage mitigants rather than proof that
              the hard risks are controlled. The strongest positives are founder-market fit, access to capital, and
              intellectual honesty about the challenge. Rao has relevant hardware and AI credentials, the investor
              syndicate is elite, and the company is publishing technical worldview pieces rather than pretending the
              problem is already solved. The grant program also suggests an attempt to broaden the research funnel, and
              the careers messaging makes clear the company knows it needs unusually cross-disciplinary talent. Those
              are helpful signs, but they are not substitutes for prototype data, foundry reservations, yield evidence,
              or developer adoption.


              The practical underwriting posture should therefore be trigger-based. A green path would show measured
              joules-per-token gains on a named workload, a credible developer/runtime story, a disclosed manufacturing
              path, and evidence that the next financing step is funding scale rather than basic scientific discovery. A
              red path would look like the opposite: still no benchmarked prototype by the next financing, no identified
              foundry or packaging plan, no customer pilots, and increasing exposure to export-control or localization
              rules. Until those proof points appear, the residual exposure remains high across technical execution,
              industrial dependency, ecosystem adoption, and time-to-revenue. This is a classic case where the absence
              of disconfirming private diligence should not be confused with the presence of operating proof.
