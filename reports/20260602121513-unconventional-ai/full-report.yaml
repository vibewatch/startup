  - id: FE001
    title: Product architecture map
    type: stack
    layout: standard
    summary: >-
      Layer view of the implied Unconventional AI product stack, from datacenter inference workloads down to
      mixed-signal silicon and local-memory packaging.
    data:
      layers:
        - label: Customer workload layer
          detail: >-
            Datacenter text or image inference jobs where power, latency, and memory traffic matter more than generic
            training flexibility.
          modules:
            - LLM or multimodal inference
            - Long-context serving
            - Power-constrained rack operations
        - label: Model-design layer
          detail: >-
            Model classes and architectural choices co-evolved with substrate physics, including recurrence, sparsity,
            and possible alternatives to attention-heavy flows.
          modules:
            - Recurrence or state-space patterns
            - Sparsity and parameter reuse
            - Model architecture specialization
        - label: Training / surrogate layer
          detail: >-
            Behavioral models and differentiable training flow that let physical parameters be optimized before or
            alongside silicon realization.
          modules:
            - Differentiable ODE or surrogate models
            - Gradient-based optimization
            - Noise-aware training assumptions
        - label: Runtime / compiler layer
          detail: >-
            Necessary but unreleased mapping layer that would have to turn model intent into realizable circuits and
            system behavior.
          modules:
            - Model mapping / compiler
            - Runtime scheduling
            - Benchmark and instrumentation tooling
        - label: Memory / packaging layer
          detail: >-
            Local or 3D-integrated memory plus short communication paths intended to minimize the dominant movement
            cost.
          modules:
            - On-chip or near-chip memory
            - 3D integration / packaging
            - Locality-aware placement
        - label: Physical compute layer
          detail: >-
            Silicon circuits exploiting nonlinear dynamics with analog and digital blocks used together where each is
            strongest.
          modules:
            - Mixed-signal compute blocks
            - Nonlinear circuit dynamics
            - Silicon fabrication and test
    approximationNotes: >-
      The runtime/compiler and packaging layers are inferred necessities from the public thesis, not disclosed product
      modules. The figure maps how the public story would need to become a real product stack.
    claimRefs:
      - CE001
      - CE004
      - CE005
      - CE018
      - CE024
