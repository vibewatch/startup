      - number: '4.3'
        title: Financing Structure, Dilution, and Capital Adequacy
        blocks:
          - type: paragraph
            body: >-
              The core public financing fact is straightforward: Unconventional AI closed a $475 million seed round in
              December 2025 at a reported $4.5 billion valuation. Bloomberg, TechCrunch, the company itself, and
              multiple follow-on reports agree on those headline terms, and Tracxn specifically labels the $4.5 billion
              figure as post-money. Public reports also say the close is the first installment of a round that could
              ultimately reach $1 billion.


              If Tracxn's post-money framing is correct, the first close implied roughly 10.6% new-money ownership for
              the incoming capital ($475 million divided by $4.5 billion). If media shorthand meant pre-money instead,
              dilution would be closer to 9.5%. Either way, a seed-stage company founded only months earlier appears to
              have sold roughly a tenth of the company while still pre-product, underscoring how much of the valuation
              is anchored in founder pedigree and the investor syndicate rather than disclosed operating metrics.


              Capital adequacy is much harder to judge. Public sources do not disclose cash balance, monthly burn,
              working capital needs, debt, or project finance. The fact pattern instead suggests milestone financing: a
              very large first close, explicit discussion of a larger target, and repeated statements that
              productization is still years away. That does not prove the current cash is insufficient, but it does mean
              public investors cannot responsibly estimate runway or next-round timing from available evidence.
