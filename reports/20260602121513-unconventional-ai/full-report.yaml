chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Mission, and Product Thesis
        blocks:
          - type: paragraph
            body: >-
              Unconventional AI publicly emerged from stealth on 2025-12-08 and immediately positioned itself less as a
              conventional application startup than as a deep-tech compute lab. The official launch post says the
              company is building a new substrate for intelligence aimed at “biology-scale” energy efficiency, arguing
              that AI demand is expanding faster than the world can add electricity capacity. In other words, the core
              product thesis is not simply a better accelerator card, but a more fundamental change in how AI workloads
              are represented and computed in silicon.


              The reviewed official and investor materials describe a system that leans on non-linear, mixed-signal, and
              probabilistic approaches rather than only digital abstractions. That framing matters because it implies a
              long-horizon R&D program with heavy dependence on scientific breakthroughs, not a near-term product
              rollout. Public materials also show a split web footprint: the prompt-supplied unconventional.ai domain
              currently resolves to a for-sale lander, while active company content lives on unconv.ai across a launch
              post, blog, and careers page. That does not negate the company’s existence, but it does signal an
              unusually early-stage or transitional brand surface for a startup already valued in the multi-billions.
            claimRefs:
              - CO001
              - CO002
