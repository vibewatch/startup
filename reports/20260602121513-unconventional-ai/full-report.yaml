            body: >-
              Unconventional AI has the kind of seed round that normally belongs to a later-stage company: $475 million
              at a reported $4.5 billion valuation, with management and multiple outlets saying the close could be the
              first installment of a round that eventually reaches $1 billion. That figure is not explained by public
