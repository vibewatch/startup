  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Technical proof, analog scaling, and commercialization risk
        blocks:
          - type: paragraph
            body: >-
              The central risk is not that Unconventional AI lacks ambition; it is that the company itself describes the
              project as a long-duration research program rather than an engineering march-down to a near-term product.
              Rao told The Register that the company will not have a product in two years and that the next several
              years are about cracking a new paradigm, while Data Center Dynamics separately quoted him saying the team
              still expects to test multiple ideas and prototypes before settling on the exact approach that scales most
              efficiently and cost effectively. That means investors are underwriting scientific and architectural
              discovery risk before they can underwrite product-market fit.


              The technical burden is also unusually high. Unconventional's own writings frame data movement, off-chip
              HBM access, and Amdahl's Law as the real constraints on achieving a 1000x energy-efficiency step change,
              while its analog blog acknowledges that thermal noise, analog memory immaturity, and system-level accuracy
              tradeoffs can erase much of the apparent analog advantage. External reviews reinforce that this is still
              an immature field: the MDPI review highlights hardware, algorithm, scalability, and integration
              challenges, UC San Diego's summary of the Nature roadmap says neuromorphic computing still needs open
              frameworks and user-friendly programming languages, and The Register notes that only a handful of
              prototypes exist and none approach brain-like efficiency. Put differently, Unconventional is asking the
              market to believe it can solve problems that both insiders and external reviewers still describe as open.
