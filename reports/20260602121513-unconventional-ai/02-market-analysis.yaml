- calloutType: insight
  title: The market problem is physical before it is algorithmic
  body: Public evidence increasingly frames AI scaling as a site-power, cooling, and grid-timing problem. That is exactly the wedge an energy-first architecture startup needs to exist.
  claimRefs:
  - CM001
  - CM005
  - CM007
  - CM041
