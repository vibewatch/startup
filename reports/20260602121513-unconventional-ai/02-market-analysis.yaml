  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: flexibility-economics
    missingEvidence: Buyer-level data on what fraction of AI load can be interrupted or shifted without violating SLA commitments.
    whyItMatters: This determines whether demand response and utilization software are enough, or whether lower-energy silicon is economically mandatory.
    diligencePath: Request utility contracts or internal workload-flexibility analyses from hyperscalers and enterprise operators.
    relatedQuestionRefs:
    - QM005
    - QM021
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: A non-overlapping TAM/SAM/SOM model that cleanly separates hyperscale, enterprise on-prem, near-edge, and embedded inference spending.
    whyItMatters: Public figures mix capex, electricity, and hardware revenue pools, so headline TAMs overstate the directly addressable wedge for a single architecture startup.
    diligencePath: Rebuild serviceable market bottoms-up from named workloads, rack footprints, and buyer budgets rather than from generic AI-infrastructure headlines.
    relatedQuestionRefs:
    - QM023
    - QM024
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: software-portability
    missingEvidence: Independent migration evidence showing how much model-rewrite, compiler work, or retraining would be required to move mainstream inference workloads onto Unconventional-style hardware.
    whyItMatters: Commercialization risk now appears to sit as much in the software stack as in the physics or device layer.
    diligencePath: Obtain early developer materials, compiler docs, or pilot design-partner feedback once available.
    relatedQuestionRefs:
    - QM017
    - QM019
    - QM024
  - type: private-evidence-only
    severity: minor
    topic: deployment-wedge
    missingEvidence: A named design-partner list or workload shortlist showing where Unconventional plans to enter first.
    whyItMatters: The thesis could target hyperscale inference, enterprise boxes, or sensor-adjacent edge AI, and each path implies different sales cycles and capital needs.
    diligencePath: Ask management for first-target segment, expected power envelope, and software compatibility assumptions.
    relatedQuestionRefs:
    - QM020
    - QM024
