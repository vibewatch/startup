chapter:
  number: 2
  title: Market Analysis
  summary: Unconventional AI is targeting a market that is being redefined by the AI compute energy crisis rather than by generic AI enthusiasm. IEA, DOE, hyperscaler disclosures, and infrastructure analysts all point to faster growth in data-centre power demand, tighter rack-density and interconnection constraints, and rising demand for inference efficiency, especially in near-edge and enterprise deployments. That makes the thesis directionally compelling, but neuromorphic and analog hardware still face commercialization hurdles around software portability, killer applications, and operating inside export-controlled semiconductor supply chains.
sections:
- id: market-boundary
  title: 'Market boundary: the bottleneck is power, not generic AI demand'
  body: 'The relevant market for Unconventional AI is narrower than “all AI hardware” and broader than “one chip category.” The investable wedge is the set of AI workloads where electricity, rack power density, cooling, interconnection timing, and grid affordability now shape deployment timing as much as model demand does. IEA’s current base case puts total data-centre electricity at roughly 950 TWh by 2030, with AI-focused facilities growing even faster, while DOE/LBNL expects U.S. data-centre consumption to double or triple by 2028. Those numbers matter because buyers are already paying for more than accelerators: they are paying for transmission upgrades, storage, backup generation, higher-density cooling, and permitting work. That means the status quo substitutes for Unconventional AI are not only NVIDIA or AMD cards; they are also gas turbines, batteries, liquid-cooling retrofits, queue positions, and software that squeezes more utilization from the same power envelope. Unconventional’s
    thesis fits this market boundary because it treats energy efficiency as the bottleneck variable customers are increasingly forced to buy around.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM006
