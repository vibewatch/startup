- id: architecture-transition
  title: Analog and neuromorphic hardware have real efficiency promise, but not a commercial free pass
  body: The technical case for unconventional architectures is no longer purely aspirational. IEEE Xplore frames neuromorphic chips as a response to the energy and scaling limits of large models, while recent Nature work shows concrete device-level gains such as compute-in-memory macros with very high TOPS-per-watt and signal-folding hardware that can cut vector-matrix multiplication power by up to 90% while preserving accuracy. That is the favorable side of the market. The unfavorable side is equally important. IEEE Spectrum argues the field still has no commercial breakout, still needs a killer application, and still lacks the high-level software stack that made GPU adoption easy. In other words, better physics does not automatically create a software ecosystem, design-in cycle, or procurement budget. For Unconventional AI, this means the market thesis is strongest where customers face hard power ceilings today, but the commercialization burden still includes developer tooling, workload
    fit, and proof that analog or neuromorphic designs outperform optimized digital inference in a repeatable production setting.
  claimRefs:
  - CM032
  - CM033
  - CM034
  - CM035
  - CM036
  - CM039
  - CM040
  - CM044
  tableRefs:
  - TM004
  figureRefs:
  - FM004
- id: policy-and-thesis
  title: Policy and power-system rules will shape adoption timing as much as chip physics
  body: The regulatory environment strengthens the market need for efficiency while complicating how fast any new architecture can scale. FERC is already forcing clearer large-load rules in PJM, EPA is building a permitting path for backup generation, and DOE is explicitly backing transmission, interconnection, efficiency, and flexible-load responses. That means policymakers increasingly accept AI data-centre load as a planning problem, not a temporary anomaly. At the same time, export controls and semiconductor policy mean a post-GPU architecture still inherits the same advanced-packaging, export-licensing, and manufacturing constraints as the incumbents. The resulting market logic is nuanced. Unconventional AI’s thesis is directionally right because customers are clearly running into power, cooling, and grid bottlenecks. But adoption will not be determined by thesis quality alone. It will depend on whether the company can show a product that wins on energy per inference inside a regulated,
    capacity-constrained, and software-dependent deployment stack. The market opportunity is therefore large, but the path to capture is gated by proof of integration, not just proof of concept.
