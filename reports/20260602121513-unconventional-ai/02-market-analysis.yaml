- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Factor
  - Type
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Exploding data-centre electricity demand
    - driver
    - positive
    - 2026-2030
    - Makes energy-efficient inference economically strategic
    - Ask which workloads are power-limited today versus merely cost-limited
  - - Near-edge buildout for latency-sensitive inference
    - driver
    - positive
    - 2026-2028
    - Favors architectures that can fit more useful compute into smaller sites
    - Ask target rack density and thermal assumptions for first deployments
  - - Demand response and utilization software
    - constraint
    - mixed
    - current
    - Can defer some hardware purchases by squeezing more value from existing fleets
    - Ask how much load can actually be shifted without violating SLAs
  - - Onsite gas and batteries as workarounds
    - constraint
    - mixed
    - 2026-2030
    - Customers can buy around the power problem before buying new silicon
    - Ask whether efficient chips reduce required overbuild of onsite power
  - - Export controls and packaging constraints
    - constraint
    - negative
    - current
    - Alternative architectures still depend on controlled chip and packaging supply chains
    - Ask foundry, packaging, and export-compliance assumptions
  - - Software-stack immaturity in neuromorphic systems
    - constraint
    - negative
    - current
    - Could slow adoption more than device performance does
    - Ask for compiler, SDK, and model-porting roadmap
  - - Technical proof of analog efficiency
    - driver
    - positive
    - current
    - Recent Nature results make the physics more credible than a pure slideware thesis
    - Ask whether gains survive at production precision and deployment scale
  - - Missing killer app / commercial breakout
    - constraint
    - negative
    - current
    - Sector still lacks a widely adopted workload that forces fast purchasing behavior
    - Ask which named workload category demonstrates 10x economic advantage
  notes: Drivers and constraints are intentionally mixed because this market is being shaped by both acute demand and strong workaround options.
