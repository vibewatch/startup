tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment
  - Included spend / problem
  - Excluded spend
  - Buyer / payer
  - Relevance to Unconventional AI
  rows:
  - - Hyperscale AI campuses
    - Inference and training compute constrained by site power, cooling, storage, and interconnection
    - Generic cloud software spend and non-AI server refresh
    - Hyperscaler infrastructure teams / cloud capex budgets
    - Core pain signal, but hardest initial qualification path
  - - Enterprise AI boxes / on-prem clusters
    - High-end enterprise servers, localized model serving, resilient on-prem inference
    - General enterprise software licenses and unmanaged endpoint AI
    - CIO / infrastructure VP / corporate capex
    - Large enough 2026 wedge with clearer power-cost accountability
  - - Near-edge inference sites
    - Latency-sensitive AI services near population centers with dense accelerated clusters
    - Conventional CDN footprint that does not require high-density AI inference
    - Hyperscalers, telcos, colo operators / infra budgets
    - Strong fit because latency and fixed site power both matter
  - - Edge OEM and industrial systems
    - Always-on low-power inference for robotics, machine vision, and embedded control
    - Commodity consumer devices that can tolerate cloud round-trips
    - OEM engineering and product groups / device BOM
    - Smaller revenue pool today, but attractive for energy-first designs
  - - Grid and facility response layer
    - Batteries, demand response, cooling, and backup generation deployed to keep AI sites operating
    - Traditional utility capex not tied to AI loads
    - Utilities, developers, and facility operators / power budgets
    - Not the product market itself, but the workaround stack efficiency hardware competes against
  notes: Defines the addressable problem in terms of power-constrained AI compute rather than all AI spending.
