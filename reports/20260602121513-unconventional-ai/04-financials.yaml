- id: skeptical-read
  title: Public Financial Opacity and Skeptical Read-Throughs
  body: |-
    The adverse case is not built on fraud allegations or a broken balance sheet; it is built on the near-total absence of operating disclosure relative to the valuation. GeekWire's "Virgin Unicorns" framework explicitly lists Unconventional AI with no product, while Forbes warns that seed-stage AI headline metrics often look stronger than the underlying economics, and Axis Intelligence argues that 2025 mega-seed rounds have already distorted traditional venture underwriting norms.

    Technical skepticism compounds the financing skepticism. The Register notes that only a handful of neuromorphic prototypes have ever been built and that none come close to the efficiency of the human brain. Unconventional itself acknowledges that it is still searching for the exact paradigm that will scale most efficiently. That means the company is asking investors to finance not just execution risk, but also architecture-selection risk.

    Put differently, the market is paying for possibility, not proof. The public record shows an elite founder, a world-class syndicate, and a coherent energy-efficiency thesis. It does not show product-market fit, pricing power, validated manufacturing economics, or revenue quality. For this chapter, that gap is the financial story.
  claimRefs:
