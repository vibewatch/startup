callouts:
- calloutType: risk
  title: Valuation Is Far Ahead of Disclosure
  body: A $4.5B seed valuation is supported publicly by founder pedigree, top-tier investors, and a compelling compute thesis, not by disclosed operating evidence. Public sources still show no product, no revenue, no customer metrics, and no public gross-margin or runway data. That mismatch is the chapter's central financial risk.
  claimRefs:
  - CI022
  - CI029
  - CI030
  - CI034
  - CI040
- calloutType: recommendation
  title: Do Not Underwrite Without Private Financial Packets
  body: This company may merit diligence on technical ambition, but not on public numbers alone. Require the budget by workstream, burn and cash schedule, prototype plan, cap table, customer evidence, and manufacturing assumptions before taking any view on adequacy of capital or fairness of valuation.
