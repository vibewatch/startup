- id: financial-verdict
  title: Financial Verdict and Diligence Blockers
  body: |-
    Financially, Unconventional AI should be treated as a pre-revenue, research-phase hardware company with exceptional access to capital but almost no public operating visibility. The seed raise removes near-term financing risk in a headline sense, yet the company itself and third-party reports keep emphasizing research, prototypes, and a longer path to commercialization. That combination points to heavy capital consumption ahead of revenue rather than a conventional venture software curve.

    The likely use of proceeds is sensible for the stated mission — fund talent, prototype silicon, software-hardware co-design, and external research — but none of those uses establish present-day unit economics. Without private data on budget allocation, prototype cost, burn, and commercialization milestones, outside investors cannot test whether $475 million is conservative, adequate, or only the opening tranche of a much larger capital program.

    The underwriting blockers are therefore basic but decisive: actual customer evidence, product timing, price realization, gross margin potential, cash runway, and the detailed cap table. Until management supplies those materials, the public-data verdict is that Unconventional AI is a thesis-rich but financially opaque bet on future compute architecture rather than an operating company with measurable fundamentals.
