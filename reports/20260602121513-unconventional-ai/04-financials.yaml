- id: cost-structure
  title: Cost Structure, Capital Intensity, and Use of Proceeds
  body: |-
    Even without public financial statements, the cost structure is directionally clear: Unconventional AI is trying to fund a deep-tech hardware program before revenue. Official and investor materials describe analog or mixed-signal silicon, model-hardware co-design, and multiple prototype iterations aimed at reaching a 1000x energy-efficiency improvement. Those are expensive activities that must be funded ahead of any product shipment, with technical risk compounding the capital need.

    The likely uses of proceeds are visible in the work the company says it is already doing: recruiting hardware, software, algorithm, and systems talent; funding experimental chip and systems research; exploring new memory and data-movement approaches; and seeding outside research through the Unconventional Grant program. None of those outlays produce near-term revenue. They are pre-commercial investments intended to de-risk architecture choices and attract scarce technical talent.

    Capital intensity is therefore high by construction. A16z argues that new AI hardware design space must be explored beyond GPUs, while company and media sources say Unconventional will test several paradigms before settling on one that scales economically. That combination — novel silicon, uncertain architecture, and multi-year prototype loops — implies a business that will consume capital first and discover unit economics later. Public sources do not disclose gross margin targets, tape-out budgets, or working-capital requirements, so the underwriting burden remains on private diligence.
