    {
      "id": "named-proof-gap-and-commercialization-path",
      "title": "Named proof gap: commercialization intent is visible, but customer disclosure is still absent",
      "body": "The strongest public evidence for actual customers is still negative evidence. Across the reviewed official pages, investor essays, TechCrunch coverage, and Data Center Dynamics reporting, there are no named paying customers, no public design partners, no alpha-cohort disclosures, no procurement records, no usage metrics, and no public revenue markers tied to a customer account. That absence matters because this chapter is supposed to separate “interesting customer pain” from “validated customer adoption.” Right now the former is much stronger than the latter. Even the most concrete independent quote about commercialization is Rao’s statement that the next several years will involve trying ideas and prototypes. The grant program’s request for outside proposals to help build a 20 W computer points in the same direction: the company is still visibly in research and architecture formation mode.\n\nThe most reasonable interpretation is a staged hardware GTM. First, Unconventional would need to win attention from a very small number of counterparties who feel acute power pain. Then it would have to prove system-level efficiency on relevant workloads, demonstrate software and toolchain compatibility, survive qualification and procurement, and only then move toward limited production. That can absolutely create high-value lighthouse accounts if the technology works, but it is a long route to revenue. In other words, the company may already know who it wants to sell to, but the public file does not yet show that any such buyer has crossed the line from interest into disclosed adoption.",
