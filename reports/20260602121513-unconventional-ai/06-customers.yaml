    "number": 6,
    "title": "Customers",
    "summary": "Unconventional AI has a coherent target-customer map but no public customer proof. Official materials point first to hyperscalers, model labs, and other power-constrained inference operators, while edge OEM and defense/robotics buyers are plausible secondary segments. Buyer pain is real, but named customers, design partners, retention, concentration, and time-to-revenue are still undisclosed, so the customer story remains thesis-driven rather than validated."
  },
  "sections": [
    {
      "id": "customer-map-and-buyer-pain",
      "title": "Customer map and buyer pain: the ICP is visible even though the customer list is not",
      "body": "As of the 2026-06-02 run date, Unconventional’s public customer story is really an ICP story rather than an adoption story. The home page, launch post, and technical writing all frame the company around energy efficiency for AI, not around a finished end-product with named reference accounts. More specifically, the strongest official language focuses on datacenter inference, joules per token, memory movement, and hardware-software co-design. That points first to hyperscalers, model labs, and large AI platform operators whose real problem is not generic AI enthusiasm but serving more inference inside fixed power, cooling, and cost envelopes. In those accounts, the likely buyer is infrastructure or platform leadership, the users are model-serving and systems teams, and the payer is an infrastructure budget rather than a departmental software line item.\n\nBuyer-side sources reinforce that logic. Google says inference efficiency becomes more important as AI usage rises and describes Cloud customers using inference-optimized TPU infrastructure. Microsoft says Maia 200 improves performance per dollar and reduces power usage across Azure’s global fleet while serving OpenAI and Microsoft workloads. JLL says speed-to-power is now the primary site-selection criterion for AI infrastructure. Together, those sources do not prove Unconventional is already selling into those accounts, but they do show that the pain the company is aiming at is real and expensive. Edge OEM, robotics, and defense buyers also have a fit with the thesis, but that fit is mostly supported by adjacent sources rather than by Unconventional’s own top-level messaging today.",
