evidenceGaps:
  - type: missing-source
    severity: material
    topic: named-customers
    missingEvidence: Named downstream humanoid OEM customers, contract values, and shipment schedules for Flex 1 or Flex 2.
    whyItMatters: >-
      Order-book quality is central to judging whether Xynova is becoming a real Tier-1 supplier or is still mostly a
      capital-markets story.
    diligencePath: Request top-10 customer list, signed framework agreements, and 2026 delivered-unit schedule by customer.
    relatedQuestionRefs:
      - QO017
      - QO023
    relatedTableRefs:
      - TO003
      - TO004
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Board composition, shareholder percentages, voting rights, and any investor observer or protective provisions.
    whyItMatters: >-
      Founder concentration and strategic-investor influence affect capital-raising flexibility, downstream
      partnerships, and exit governance.
    diligencePath: >-
      Request post-A+ cap table, board list, shareholder agreement summary, and any strategic rights granted to
      industrial investors.
    relatedQuestionRefs:
      - QO006
      - QO024
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Revenue, gross margin, burn, cash runway, and realized ASP by product line.
    whyItMatters: >-
      The company can be valued at unicorn status in private markets while still lacking the unit economics needed for
      underwriting.
    diligencePath: Request 2025 audited financials, 2026 management accounts, and booked revenue vs shipment data.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: A reconciled view of total employees, contractors, and insured staff as of mid-2026.
    whyItMatters: >-
      The difference between insured-headcount filings and interview-reported team size may be benign, but it weakens
      confidence in scale claims.
    diligencePath: Request HR census by legal entity plus explanation for insured-employees vs total-staff reporting.
    relatedQuestionRefs:
      - QO007
      - QO021
    relatedTableRefs:
      - TO001
      - TO002
  - type: missing-source
    severity: material
    topic: xynova-revenue-by-vertical
    missingEvidence: Actual booked revenue or pipeline split by OEM, manufacturing, logistics, research, or service-robot vertical.
    whyItMatters: >-
      Without vertical revenue mix, the market-sizing bridge from TAM to SOM remains conceptual rather than
      underwritten.
    diligencePath: Request 2026 pipeline and booked revenue by customer vertical plus weighted pipeline by use case.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: minor
    topic: tam-range-precision
    missingEvidence: >-
      A reconciled third sizing lens for the dexterous-hand market rather than only humanoid-market proxies times
      component-share assumptions.
    whyItMatters: >-
      The current SAM/TAM bridge relies on top-down humanoid forecasts and a component-share heuristic, which is useful
      but not precise.
    diligencePath: Collect at least one component-specific market study or sell-side note on dexterous-hand or end-effector spend.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: named-oem-platforms
    missingEvidence: Named OEM platforms or signed launch customers using Xynova hands at volume.
    whyItMatters: >-
      The market looks large, but Xynova’s obtainable slice depends on a handful of platform wins that remain mostly
      undisclosed.
    diligencePath: Request customer list, platform names, integration stage, and expected 2026-2027 unit volumes.
    relatedQuestionRefs:
      - QM020
      - QM023
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: Realized ASPs, discount structures, and contract packaging terms for Xynova and close peers.
    whyItMatters: >-
      Without price visibility, feature comparisons can overstate differentiation that may disappear under procurement
      pressure.
    diligencePath: >-
      Request list pricing, pilot pricing, volume discounts, and service/support terms from Xynova and at least two peer
      quotes.
    relatedQuestionRefs:
      - QP011
      - QP019
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: named-xynova-customers
    missingEvidence: Named Xynova customers, signed contracts, and platform-win evidence versus integrated OEM rivals.
    whyItMatters: The clearest proof that Xynova can defend its position would be OEM wins that survive internal-build alternatives.
    diligencePath: Request top customer list, platform names, and delivered units by customer.
    relatedQuestionRefs:
      - QP012
      - QP016
      - QP024
    relatedTableRefs:
      - TP001
      - TP004
  - type: private-evidence-only
    severity: minor
    topic: matrix-unknowns
    missingEvidence: >-
      Independent proof for unsupported competitor matrix cells such as realized dexterity performance, serviceability,
      and integration burden.
    whyItMatters: >-
      Several matrix ratings are qualitative because public sources emphasize positioning more than apples-to-apples
      benchmarks.
    diligencePath: Collect side-by-side engineering evaluations, public benchmarks, or integrator interviews.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP002
  - type: missing-source
    severity: material
    topic: revenue-metrics
    missingEvidence: Revenue, gross margin, backlog, delivered units, and cash balance are not publicly disclosed.
    whyItMatters: >-
      These are the core metrics needed to determine whether the current valuation rests on real sell-through or mostly
      on strategic capital support.
    diligencePath: Request monthly revenue by SKU, gross margin bridge, backlog, shipped units, and cash/runway schedule.
    relatedQuestionRefs:
      - QI004
      - QI016
      - QI018
    relatedTableRefs:
      - TI001
      - TI004
      - TI005
  - type: missing-source
    severity: material
    topic: pricing-and-discounts
    missingEvidence: Realized ASPs, discounts, engineering-service revenue, and warranty terms remain undisclosed.
    whyItMatters: List-price opacity makes it impossible to model contribution margin or procurement elasticity.
