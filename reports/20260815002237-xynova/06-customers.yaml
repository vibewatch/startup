  evidenceGaps:
  - type: missing-source
    severity: material
    topic: named-xynova-customers
    missingEvidence: No reviewed source names the leading humanoid OEM(s) behind Xynova’s reported orders or discloses deployment outcomes by operator.
    whyItMatters: Without named operators and task-level results, it is impossible to test whether public demand reflects real adoption, pilot curiosity, or channel signaling.
    diligencePath: Request customer list, operator references, deployment sites, shipped units, and task-level outcome metrics.
    relatedQuestionRefs:
    - QU005
    - QU012
    - QU023
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: retention-and-renewal
    missingEvidence: No public NRR, GRR, renewal, churn, contract-length, or repeat-purchase data was found for Xynova.
    whyItMatters: A component supplier can show strong initial orders but still fail to convert pilots into recurring platform revenue.
    diligencePath: Request renewal rates, reorder cadence, contract terms, service attach rates, and cohort data by customer segment.
    relatedQuestionRefs:
    - QU017
    - QU018
    - QU025
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: minor
    topic: concentration
    missingEvidence: Top-customer revenue share and pipeline concentration are not public.
    whyItMatters: One or two OEM relationships could dominate near-term revenue and bargaining power.
    diligencePath: Request top-10 customer concentration and revenue by customer or platform.
    relatedQuestionRefs:
    - QU019
    - QU020
    relatedTableRefs:
    - TU005
