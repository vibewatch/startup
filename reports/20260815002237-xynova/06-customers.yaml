  - TU005
- id: customer-verdict
  title: The core customer verdict is “promising demand, incomplete proof”
  body: 'Customer diligence on Xynova should neither dismiss the company as pure hype nor overstate the public proof. The evidence is stronger than a zero-revenue science project: anonymous large OEM orders, multi-scenario adaptation claims, and manufacturing-focused investor overlap all point to real interest. At the same time, the company has not yet published the things that turn interest into durable customer proof: named operators, operator-side quotes, shipped-unit outcomes, renewal history, or production-line performance data. The right conclusion is that Xynova appears to have entered the real procurement funnel of top-tier OEMs, but not yet the publicly documented deployment tier that would make customer durability easy to underwrite.'
  claimRefs:
  - CU031
  - CU032
  - CU033
  - CU034
  - CU035
  - CU036
