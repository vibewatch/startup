chapter:
  number: 6
  title: Customers
  summary: Xynova appears to have entered the real procurement funnel of top-tier humanoid OEMs, with multiple sources pointing to large anonymous orders and cross-scenario adaptation. What the public record still lacks is named operator proof, retention data, and reusable case studies, so the correct customer verdict is “promising demand, incomplete proof.”
sections:
- id: buyers-users-and-payers
  title: The buyer is usually an OEM team, while the end user is the factory or service workflow
  body: 'Public evidence points to a layered customer map. Xynova is not selling directly to mass consumers; it is selling into humanoid OEMs, algorithm companies, research clients, and end-scenario customers. In practice, the immediate buyer is most likely an OEM engineering or procurement team evaluating how to give a robot dexterous manipulation capability. The end user sits further downstream in manufacturing, logistics, research, healthcare-assistance experiments, or other human-environment tasks. This distinction matters because the company’s adoption curve depends on platform qualification by robot makers before any final operator sees value. It also means the true payer can vary: an OEM may fund the subsystem bill of materials, while a factory or warehouse operator ultimately funds the robot program that embeds Xynova’s hand. The clearest public reading is therefore OEM-first, scenario-backed demand rather than direct end-market pull.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU019
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: public-adoption-proof
  title: Xynova has real order-language and scenario evidence, but the operators remain unnamed
  body: 'The good news is that Xynova does not look like a company with zero customer traction. Multiple reviewed sources say it has already won leading humanoid-OEM orders or large forward order commitments, and Hangzhou Daily specifically reports a ten-thousand-unit order from a leading humanoid-robot manufacturer. Zhaopin says Flex 1 adapted to multiple robot brands and multiple scenarios, while ChinaBizInsider and Shuziqushi both reinforce the idea that the company already has orders from top humanoid makers. The bad news is equally important: those reports still stop short of naming the customers, the deployment sites, or the task outcomes. As a result, the public record supports real market pull but not yet reusable named customer case studies. This is better than pure demo-stage speculation, but weaker than the operator-confirmed proof an investor would ideally want.'
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU008
  - CU009
  - CU010
  - CU035
  tableRefs:
  - TU002
  - TU003
  figureRefs:
  - FU002
- id: what-strong-proof-looks-like
  title: The broader market shows what stronger customer proof looks like—and Xynova is not there yet
  body: 'The quickest way to understand Xynova’s customer-proof gap is to compare it with the best disclosed deployments elsewhere in humanoids. Reuters, Jabil, Axis Intelligence, and adjacent deployment trackers show what higher-grade proof looks like: named customers, specific facilities, task categories, sometimes even output metrics. BMW/Figure, GXO/Agility, and Mercedes/Apptronik are not perfect comparables because they are full-system robots, not hands, but they show the procurement evidence standard serious industrial buyers eventually expect. Even within the hand market, OYMotion publishes more named-customer language than Xynova currently does. This does not mean Xynova lacks customers. It means its public evidence sits at the order-and-intent layer rather than the operator-verified production layer. For diligence, that distinction is decisive.'
  claimRefs:
  - CU011
  - CU015
  - CU016
  - CU017
  - CU018
  - CU030
  - CU031
  - CU034
  tableRefs:
  - TU006
  figureRefs:
  - FU003
- id: retention-expansion-and-concentration
  title: The expansion story is plausible, but retention and concentration remain largely unobservable
  body: 'Xynova’s best land-and-expand path is intuitive: once a hand is qualified on a humanoid platform, the company can try to sell more of the actuator, control, and manipulation stack into the same robot family. That could create real switching costs over time. But those costs materialize only after technical qualification and service reliability are proven. Before that point, buyers can still multi-home across vendors, especially when documentation, lead times, and integration support differ meaningfully. Public data on renewal behavior is essentially nonexistent. No reviewed source provides NRR, churn, reorder rates, or contract duration. Given the company’s youth and large reported OEM orders, concentration risk is likely high: a small number of platform wins probably determine most near-term revenue. This chapter therefore reads expansion as plausible, but durability as unproven.'
  claimRefs:
  - CU012
  - CU013
  - CU014
  - CU020
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
  - CU026
