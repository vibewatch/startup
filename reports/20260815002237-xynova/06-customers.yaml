  - - Research clients / labs
    - 'Buyer: lab or program lead; User: researchers'
    - Dexterous manipulation experiments and teleoperation
    - Useful for early adoption and feedback
    - Specific labs not named in reviewed sources
  - - End-scenario industrial customers
    - 'Buyer: factory / logistics operator via robot program; User: line or warehouse workflow'
    - Assembly, sorting, handling, precision operations
    - Ultimate economic driver for OEM demand
    - Typically reached indirectly through OEMs
  - - Healthcare / home-service exploration
    - 'Buyer: experimental or programmatic; User: assistive scenarios'
    - Medical-assistance and service scenarios
    - Longer-term option, lower proof quality today
    - No named production deployment evidence
  notes: The immediate customer is usually the robot maker or integrator, even when the economic problem belongs to a factory, warehouse, or service environment.
