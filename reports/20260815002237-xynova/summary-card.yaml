summary:
  headline: >-
    Xynova sits in a strategically attractive part of the humanoid stack: dexterous hands and actuators. The company has
    raised enough capital and attracted enough strategic interest to matter, but the public record still lacks the
    named-customer, reliability, economics, and financing-term evidence needed to underwrite the current unicorn
    valuation with high conviction.
