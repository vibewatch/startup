  evidenceGaps:
  - type: missing-source
    severity: material
    topic: third-party-validation
    missingEvidence: No independently published long-duration MTBF, field-failure rate, or service-interval dataset for Flex 2 was found.
    whyItMatters: A dexterous hand can look compelling on specs while still failing in repetitive factory duty if tendons, sensors, or interfaces degrade too quickly.
    diligencePath: Request reliability test protocol, fleet failure data, return rates, and customer service logs.
    relatedQuestionRefs:
    - QE010
    - QE020
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: documentation-depth
    missingEvidence: The public download center does not expose detailed developer docs, SDK references, or integration manuals.
    whyItMatters: Enterprise readiness depends on repeatable integration, not only on attractive hardware claims.
    diligencePath: Request API docs, wiring/interface guides, calibration procedures, and support SLAs.
    relatedQuestionRefs:
    - QE013
    - QE017
    - QE025
    relatedTableRefs:
    - TE003
    - TE004
  - type: private-evidence-only
    severity: minor
    topic: compliance-certifications
    missingEvidence: No public certification or third-party safety test matrix was found for the hand or actuator stack.
    whyItMatters: Safety and procurement review for enterprise or international customers may require evidence beyond marketing language and local policy support.
