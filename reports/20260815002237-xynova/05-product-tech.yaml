chapter:
  number: 5
  title: Product & Technology
  summary: 'Xynova’s product looks best understood as a full manipulation-subsystem platform: dexterous hands, actuators, control, and manufacturing packaged for humanoid OEMs. Public evidence supports unusually strong subsystem ambition and vertical integration for a young company, but still leaves meaningful gaps in documentation depth, third-party validation, and public quality disclosure.'
sections:
- id: product-definition
  title: Xynova is delivering a manipulation subsystem platform, not just one robotic hand
  body: 'Public sources consistently show that Xynova is building a manipulation-component platform for humanoid robots rather than a single showcase hand. The company describes itself as a core-component supplier, and the product surface already spans dexterous hands, rotary actuators, linear actuators, and micro cylinders. That matters because the product should be understood in customer-workflow terms: Xynova is trying to supply the end-effector and joint-motion layer that lets humanoid OEMs turn AI intent into precise physical action. The hand is the headline product, but the actuator and control stack are part of the same commercial offer. This makes the company more comparable to a subsystem platform than to a one-SKU hardware startup. It also means product quality has to be judged across integration, manufacturability, and control architecture, not only across individual hand parameters.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE019
  - CE033
  tableRefs:
  - TE001
  figureRefs: []
- id: architecture-and-stack
  title: The architecture combines hybrid-drive hands with a broader actuator and control stack
  body: 'The strongest product evidence sits in the architecture story. Flex 2 is publicly described as a 23-DOF, 400-gram hybrid-drive hand with multimodal sensing, adaptive grasping, and fine force and position control. Third-party reporting sharpens that story by explaining how Xynova places power sources into the forearm and combines tendon-drive advantages with direct-drive responsiveness. The actuator pages widen the picture: Xynova is not only shipping a hand, but also linear and rotary modules with self-developed motors, reducers, roller screws, thermal management, and multi-module APIs. In other words, the technology stack appears to run from electromechanical components through control algorithms and up into integration tooling. That layered architecture is exactly why the company can plausibly argue that it is building a general dexterous-operation solution rather than a gadget.'
  claimRefs:
  - CE004
  - CE005
  - CE006
  - CE007
  - CE008
  - CE009
  - CE010
  - CE011
  - CE012
  tableRefs:
  - TE003
  figureRefs:
  - FE001
- id: deployment-and-maturity
  title: Deployment readiness looks promising on product breadth and factory ambition, but only partly proven in the field
  body: 'Public evidence suggests real maturity progress but not full enterprise proof. Flex 1 already appears to have been adapted to multiple robot brands and scenarios, while Flex 2 adds lighter weight, better control, and stronger durability claims. Xynova and media coverage both emphasize production lines, vertical integration, and ambitious 2026 capacity targets, which is stronger product-maturity evidence than most early robotics startups provide. BotMarket adds a useful counterweight by reminding buyers that host-robot electrical and software compatibility still matter and can add engineering cost. The overall maturity picture is therefore mixed in a healthy way: the module family is broader than a lab prototype, and factory evidence suggests seriousness, yet long-duration field metrics, documented support surfaces, and independently verified reliability remain thin. The company looks past demo stage, but not yet fully transparent enough to treat enterprise readiness as proven.'
  claimRefs:
  - CE013
  - CE014
  - CE015
  - CE017
  - CE018
  - CE020
  - CE021
  - CE022
  - CE023
  - CE029
