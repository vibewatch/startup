- id: ecosystem-and-differentiation
  title: Differentiation comes from full-stack control and Hangzhou ecosystem leverage, not from specs alone
  body: 'Xynova’s moat claim is bigger than the number of degrees of freedom on one hand. About-us, Zhaopin, and independent coverage all point to the same differentiator: vertical ownership of motors, reducers, screws, control, assembly, and final hand integration. That is complemented by an ecosystem story in which Hangzhou’s embodied-AI regulation, pilot base, and data initiatives reduce friction around testing, procurement, and standards formation. RobotToday’s standard-system overview and the Hangzhou ecosystem sources imply that future winners may be the companies that align hardware, interfaces, tactile sensing, and data loops quickly enough to meet emerging standard expectations. In that framing, Xynova’s product advantage is not merely a light high-DOF hand. It is the possibility of co-evolving the hand, the actuators, the controls, the dataset loop, and the manufacturing process inside one local ecosystem.'
  claimRefs:
  - CE014
  - CE016
  - CE024
  - CE025
  - CE026
  - CE027
  - CE028
  - CE030
  - CE031
  - CE033
  - CE035
  tableRefs: []
  figureRefs:
  - FE003
- id: trust-quality-and-gaps
  title: Trust and safety posture remains more narrative-rich than documentation-rich
  body: 'The public trust profile is respectable for a young private hardware company, but it is still incomplete. Official pages do make concrete quality claims: anti-pinch seams, dust and drop resistance, anti-creep tendons, thermal control, and millions of actuation cycles. Policy and standard sources show that the surrounding ecosystem is moving toward more formal interface, safety, and tactile-performance expectations. What is missing is equally important. The public record does not show third-party certifications, detailed failure-rate reporting, published service procedures, or a real developer documentation surface beyond marketing-level signals. Filing sources also underline that Xynova is still a private Hangzhou company with limited public compliance disclosure. The right judgment is not that the product lacks substance; it is that the company’s transparency on quality systems and support maturity still trails its technical ambition.'
