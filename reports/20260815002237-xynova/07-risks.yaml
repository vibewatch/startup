  - - Compliance drift
    - No concrete standards / certification roadmap
    - Management cannot map product to local / national rules
    - Escalate regulatory diligence or pause
  - - Customer concentration risk
    - Backlog tied to one anonymous OEM
    - Single platform >40% of planned near-term volume
    - Assume fragile revenue and renegotiate valuation
  - - IP / trade-secret risk
    - No FTO or patent-defense process
    - Counsel cannot explain filing, monitoring, or dispute response
    - Increase legal reserve and diligence burden
