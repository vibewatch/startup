companyProfile:
  summary: "Xynova is a Hangzhou-based dexterous-hand robotics company operating under the legal entity Hangzhou Xynova Technology Co., Ltd. The company positions itself as a supplier of humanoid-robot dexterous hands, linear and rotary actuators, and related control-stack components rather than as a full humanoid OEM. Its flagship Flex 2 hand launched in May 2026 with 23 total degrees of freedom and a broader full-stack manipulation narrative. Xynova raised rapidly through angel, Pre-A, A, and A+ rounds, culminating in a Meituan-led July 2026 unicorn round, and has since emerged as one of China’s best-capitalized dexterous-hand startups despite still-limited public financial and customer disclosure."
  foundedDate: "2024-12-24"
  founders:
    - name: "Xia Yuxuan"
      role: "Founder and CEO"
      background: "Public profiles describe Xia Yuxuan as the company’s public face and legal representative, with physics and computer science training and prior experience at Morgan Stanley and CDH Investments. Registry data also ties chairman, manager, and finance-responsible roles closely to the founder."
      claimRefs: [CO006, CO007, CO008]
  foundingLocation: "Hangzhou, Zhejiang, China"
  headquarters: "Hangzhou, Zhejiang, China"
  productSummary: "Xynova’s product stack centers on the Flex 2 dexterous hand and a broader family of linear and rotary actuators. Public materials describe Flex 2 as a hybrid tendon-drive and direct-drive hand with 23 total degrees of freedom, 19 active and 4 passive degrees of freedom, about 400 grams palm/hand weight, up to 12 kg single-hand grasp load, and multimodal sensing. Official materials also position the company as vertically integrated across motors, motor controllers, screws, actuators, dexterous hands, and control algorithms."
  customerFocus: "Humanoid robot OEMs, integrators, algorithm companies, research clients, and downstream manufacturing/logistics scenarios that need dexterous manipulation subsystems."
  businessModel: "B2B hardware and subsystem sales: dexterous hands, actuators, and related manipulation components sold into humanoid robot platforms and industrial manipulation workflows, likely via quote-led enterprise sales plus integration support. Public pricing, revenue mix, and margin structure remain undisclosed."
  stage: "Series A+ (reported $1B valuation as of July 2026)"
  fundingStatus: "Public reporting describes an angel round above RMB100M in December 2025, a JD.com-led Pre-A in March 2026, a several-hundred-million-RMB A round in May 2026, and a RMB500M A+ round in July 2026 led by Meituan. Multiple reports say cumulative financing reached roughly RMB1.5B since founding."
  disclosureProfile: private-disclosed
  claimRefs: [CO001, CO002, CO004, CO014, CO016, CO027, CO029, CO033, CO034, CO037, CO040, CU035]

summary:
  headline: "Xynova sits in a strategically attractive part of the humanoid stack: dexterous hands and actuators. The company has raised enough capital and attracted enough strategic interest to matter, but the public record still lacks the named-customer, reliability, economics, and financing-term evidence needed to underwrite the current unicorn valuation with high conviction."
