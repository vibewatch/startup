  topStrengths:
    - "One of China’s best-capitalized dexterous-hand startups, with investors spanning Meituan, Xiaomi, JD.com, Li Auto, CATL-linked capital, and NIO-linked capital."
    - "Product scope is broader than a single hand SKU: Xynova sells hands plus linear and rotary actuators, improving its potential attach points per robot platform."
    - "Reported top-tier OEM order activity and a 5,400-square-meter factory ramp indicate real market pull rather than pure demo-stage positioning."
    - "Hangzhou and China policy support, standards activity, and supply-chain depth create a favorable home-market commercialization environment."
    - "If Xynova becomes a hard-to-replace Tier-1 manipulation supplier, the current valuation could still have material upside."
  topRisks:
    - "No public revenue, gross margin, backlog-conversion, or cash-burn data exists, making the current unicorn mark hard to underwrite on fundamentals."
    - "Customer proof remains mostly anonymous: public sources point to large OEM orders, but named deployments and repeat-order evidence are still absent."
    - "Quality, reliability, support, and compliance proof are sparse relative to the importance of those factors in dexterous-hand procurement."
    - "Platform OEMs may internalize more hand and actuator development over time, limiting long-term pricing power for subsystem suppliers."
    - "Financing terms, preference stack, and governance detail are not public, so the headline valuation may overstate the attractiveness of the actual entry economics."
  unresolvedGaps:
    - "No audited financial statements or public KPI pack covering revenue, gross margin, burn, or working-capital dynamics."
    - "No named-customer concentration table, renewal data, or operator-published deployment metrics."
    - "No public MTBF, return-rate, warranty, or field-failure dataset for Flex 2 or the actuator family."
    - "No public financing-doc view of liquidation preferences, option pool, board rights, or anti-dilution protections."
    - "No published standards-mapping or certification matrix tying Xynova products to emerging local and national embodied-robotics requirements."

