- id: adverse-competitive-evidence
  title: The bear case is internal build, pricing opacity, and narrative outrunning deployment evidence
  body: 'The most important adverse evidence is structural rather than sensational. First, public pricing and packaging data remain poor across the field, making it hard to know whether technical edge survives procurement negotiations. Second, integrated rivals have customer proof that Xynova has not yet matched in public: Apptronik has named agreements; Boston Dynamics speaks in workflow and fleet terms; major Chinese OEMs already ship thousands of robots. Third, public sources still emphasize category excitement, funding, and demos more than long-duration field evidence. MERICS and other market observers repeatedly warn that dexterity, cost, precision, and software maturity still limit broad adoption. This means Xynova may indeed be one of the best-funded hand specialists in China while still facing a future where the real economic surplus accrues to platform owners or automaker entrants. The diligence burden is therefore to prove that Xynova can become the indispensable Tier-1 hand supplier
    rather than merely a temporarily fashionable component startup.'
