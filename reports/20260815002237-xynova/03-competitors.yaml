- id: capability-and-packaging-comparison
  title: Capability breadth favors full-stack OEMs; component specialization favors Xynova in dexterity depth
  body: 'Public evidence suggests Xynova’s strongest positioning is in component-level specialization. Its official surfaces focus tightly on dexterous hands and actuators, and third-party reporting reinforces the claim that it owns more of the hand stack in-house than many peers. That can create genuine depth in weight, force control, actuator integration, and engineering iteration. Shadow remains a benchmark in research-grade dexterity, while Festo’s BionicSoftHand represents a softer, collaborative, factory-friendly alternative with lower DoF but clearer assembly and service use cases. Unitree shows how integrated OEMs can package the hand as just one option inside a broader robot offer; pricing visibility on G1 is a reminder that system-level vendors can pressure component economics. Apptronik and Boston Dynamics show another model: win trust through full-system deployment, workflow integrations, and manufacturability rather than by making the hand the product. The competitive tension
    is therefore not only feature-for-feature. It is whether buyers prefer the best specialist subsystem or the most integrated platform.'
