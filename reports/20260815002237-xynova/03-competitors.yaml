  evidenceGaps:
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: Realized ASPs, discount structures, and contract packaging terms for Xynova and close peers.
    whyItMatters: Without price visibility, feature comparisons can overstate differentiation that may disappear under procurement pressure.
    diligencePath: Request list pricing, pilot pricing, volume discounts, and service/support terms from Xynova and at least two peer quotes.
    relatedQuestionRefs:
    - QP011
    - QP019
    relatedTableRefs:
