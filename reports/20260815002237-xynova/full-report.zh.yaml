companyProfile:
  summary: >-
    Xynova 是一家位于杭州的灵巧手机器人公司，法律实体为 Hangzhou Xynova Technology Co., Ltd.。公司给自己的定位不是完整人形机器人 OEM，
    而是人形机器人灵巧手、线性和旋转执行器，以及控制栈配套组件的供应商。旗舰产品 Flex 2 于 May 2026 发布，具备 23 个总自由度，并配套更完整的全栈操作叙事。 Xynova 在天使轮、Pre-A、A 轮和 A+
    轮中快速融资，最终在 July 2026 完成由 Meituan 领投的独角兽轮。尽管公开财务和客户披露仍有限， 它已成为中国资本最充足的灵巧手初创公司之一。
  foundedDate: '2024-12-24'
  founders:
    - name: Xia Yuxuan
      role: 创始人兼 CEO
      background: >-
        公开资料把 Xia Yuxuan 描述为公司的对外代表和法定代表人，具备物理学和计算机科学训练，此前曾在 Morgan Stanley 和 CDH Investments 工作。
        工商登记数据也显示，董事长、经理和财务负责人等角色都紧密集中在创始人身上。
      claimRefs:
        - CO006
        - CO007
        - CO008
  foundingLocation: Hangzhou, Zhejiang, China
  headquarters: Hangzhou, Zhejiang, China
  productSummary: >-
    Xynova 的产品栈以 Flex 2 灵巧手为核心，同时覆盖更大的线性和旋转执行器家族。公开材料称，Flex 2 采用腱绳驱动与直接驱动混合架构， 共有 23 个自由度，其中 19 个主动自由度、4 个被动自由度；掌部 /
    手部重量约 400 grams，单手抓取负载最高 12 kg，并具备多模态感知。 官方材料还把公司定位为从电机、电机控制器、丝杠、执行器、灵巧手到控制算法都做垂直整合的公司。
  customerFocus: 需要灵巧操作子系统的人形机器人 OEM、集成商、算法公司、科研客户，以及下游制造 / 物流场景。
  businessModel: B2B 硬件和子系统销售：向人形机器人平台和工业操作流程销售灵巧手、执行器及配套操作组件，可能通过报价驱动的企业销售和集成支持落地。 公开定价、收入结构和利润率结构仍未披露。
  stage: Series A+ (reported $1B valuation as of July 2026)
