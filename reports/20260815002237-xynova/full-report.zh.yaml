      - number: '1.3'
        title: 融资路径、独角兽标记与产业股东逻辑
        blocks:
          - type: paragraph
            body: >-
              2026 年 Xynova 之所以值得关注，最清楚的外部原因是资本形成。公开报道支持这样一条不到两年的四轮融资路径：December 2025， 由 CATL 背景的 Puquan Capital 领投超过
              RMB100 million 天使轮；March 2026，JD.com 领投 Pre-A；May 2026， Li Auto Strategic Investment 和财务投资方领投 A 轮；July
              2026，Meituan 领投 RMB500 million A+ 轮，NIO Capital、 China Merchants Capital 和 Xiaomi 继续加码。Crunchbase July
              2026 的独角兽榜报道把投后估值定在 $1 billion， 多篇中英文报道则称累计融资约 RMB1.5 billion。产业股东阵容的质量可能不亚于标题数字本身。CATL、Xiaomi、JD.com、 Li
              Auto、Meituan 和 NIO 合在一起，覆盖 EV 制造、消费电子、电商物流和本地生活配送——这些正是人形或半人形机器人若能实现经济性， 灵巧末端执行器最可能发挥作用的应用区域。Meituan
              自己的表述把战略逻辑说得很直白：灵巧操作是 AI 决策与真实世界工作之间的桥梁。 这不能证明下游部署已经发生，但确实解释了为什么一家如此早期的公司能拿到独角兽估值。
