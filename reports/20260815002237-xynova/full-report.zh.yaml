      - number: '2.4'
        title: 驱动与约束：市场真实存在，但执行曲线仍然陡峭
        blocks:
          - type: paragraph
            body: >-
              Xynova 市场乐观情景建立在一种罕见共振上：中国政策体系已经明确优先支持具身 AI，工业机器人基础极大，EV 和电子供应链提供可迁移到机器人领域的零部件和经验技术， 头部 OEM
              也已出货或试点足够多的人形机器人，从而为灵巧子系统创造真实平台需求。悲观情景同样重要。MERICS 认为，中国人形机器人仍缺少精度和灵巧度， 成本过高，难以大规模部署，大多还停留在小规模试验。Goldman
              补充说，硬件成熟度已不再是唯一瓶颈——操作软件、实时控制和可靠交互依旧很难。 IFR 进一步警告，人形助手的大规模采用比许多标题暗示得更晚；短期内，传统工业机器人更可能先吸收
              AI。正确的市场结论既不是「全是炒作」， 也不是「万亿美元品类已经解题」。更准确地说，Xynova 指向一个真实且具有战略重要性的瓶颈，但增长曲线取决于 OEM 试点能否转化为可重复、具成本效率的部署。
