            body: >-
              灵巧手最难的风险不是故事，而是可重复性。多家独立来源从不同角度描述同一个问题：触觉感知仍然困难，控制复杂度高，装配依赖大量人工， 紧凑机电封装几乎没有容错空间。Xynova
              的快速进展并不会消除这些现实。甚至可以说，公司的速度和宽广雄心会让问题更尖锐， 因为手部、执行器和控制栈都必须同步成熟。公开现场指标缺失进一步放大了运营风险。没有已审阅来源发布 Xynova 的
              MTBF、退货率、 支持间隔或经运营方验证的部署结果。结果是，公司可能技术上令人印象深刻，但恰恰在规模制造最容易出问题的地方文档不足： 良率、可维护性和软件兼容性。
