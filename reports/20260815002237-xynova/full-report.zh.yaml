      - number: '4.2'
        title: 单位经济性的争论，本质是执行器成本、触觉感知、装配和可靠性
        blocks:
          - type: paragraph
            body: >-
              Xynova 不是披着机器人外衣的软件公司；它在做一个紧凑型机电一体化子系统，经济性将由制造现实决定。公开市场追踪和独立评论显示了主要经济压力点：
              电机和减速器、触觉与力感知、人工密集型装配、质量良率，以及售后可靠性。同一批来源也解释了机会为何有吸引力： 中国手部制造商正在快速压低成本，只要性能保持可接受，需求就可能被打开。Xynova
              因此面对经典硬件张力。市场价格下降可以释放销量， 但若公司良率和成本结构改善速度跑不过竞争者，毛利率也会被压缩。BotMarket 的集成提示同样重要：即便是轻量、高 DOF 的手部，
              对宿主机器人也可能带来不小的工程工作量，这会影响服务成本，并可能增加服务收入，也可能形成支持拖累。结论不是单位经济性很差， 而是公开证据尚无法验证。采购纪律和质保经验将极其重要。
