  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：Xynova 卖的是操作瓶颈，不是整个人形机器人梦想
        blocks:
          - type: paragraph
            body: >-
              做尽调时，合适的市场镜头应当比「全部人形机器人」更窄，也比「某一款机器人手 SKU」更宽。Xynova 位于灵巧操作层：
              关节化手部、执行器、电机、感知和控制子系统，让机器真正能够抓取、握持、对齐、分拣和操作不规则物体。这个区分很关键， 因为宽口径人形机器人 TAM 很容易引用，但用来承销组件供应商时可能误导。Xynova
              不需要赢下全身人形机器人竞赛；它需要的是底层机器人平台， 以及需要精细操作的工业流程能够放量。因此，TMTPost 的框架很有用：灵巧手可占整机成本约 15% 到 20%，并被视为堆栈中门槛最高、
              价值最集中的子系统之一。Meituan 的投资理由本质上也用战略语言表达了同一件事：灵巧操作是 AI 大脑与有用物理工作之间的桥梁。 实际含义是，Xynova 的真实市场包括人形机器人
              OEM、工业操作改造，以及相邻的协作手应用场景；不包括不需要灵巧抓取的运动系统、 基础模型或无关工厂自动化的大盘支出。
