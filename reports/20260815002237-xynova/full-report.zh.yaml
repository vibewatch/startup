            - 自研电机和减速器
        - label: 控制层
          modules:
            - 混合力位控制
            - 类小脑自适应控制
            - 上位机软件和 API
        - label: 制造与生态层
          modules:
            - 从机加工到灵巧手装配线
            - 杭州试点基地与标准生态
            - 数据集和测试闭环
  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: wide
    summary: 可能的部署路径是先经 OEM 评估，再做集成、调试和场景验证，之后才进入更大规模采购。
    approximationNotes: 该流程综合了官方集成说法，以及第三方关于兼容性和工程负担的记录。
    claimRefs:
      - CE017
      - CE018
      - CE019
      - CE020
      - CE021
      - CE030
    data:
      nodes:
        - id: n1
          label: OEM 识别灵巧操作缺口
        - id: n2
          label: Xynova 灵巧手 / 执行器评估开始
        - id: n3
          label: 电气 + 软件兼容性工作
        - id: n4
          label: 力、抓取和运动调试
        - id: n5
          label: 试点场景验证
        - id: n6
          label: 批量采购或更广泛模块采用
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n5
          to: n6
  - id: FE003
    title: 关键依赖图
    type: dag
    layout: wide
    summary: 产品准备度取决于组件自给、接口、标准、数据闭环以及 OEM 集成成败。
    approximationNotes: 该 DAG 聚焦公开来源提到的最高价值技术依赖，而不是 BOM 中每个零部件。
    claimRefs:
      - CE008
      - CE014
      - CE024
      - CE025
      - CE026
      - CE027
      - CE028
      - CE031
      - CE035
    data:
      nodes:
        - id: motors
          label: 自研电机 / 减速器
          note: 核心机电依赖
        - id: sensing
          label: 触觉 + 力传感
          note: 品类瓶颈和差异化来源
        - id: control
          label: 混合控制算法
          note: 自适应抓取与力 / 位置闭环
        - id: factory
          label: 装配 + 质量流程
          note: 把原型变成可重复出货
        - id: standards
          label: HEIS 2026 / 杭州规则
          note: 塑造接口和安全预期
        - id: dataset
          label: 灵巧手数据生态
          note: 训练和测试反馈闭环
        - id: oem
          label: 人形机器人 OEM 集成
          note: 下游采用瓶颈
        - id: readiness
          label: 企业级产品准备度
          note: 商业和技术结果
      edges:
        - from: motors
          to: factory
          label: 组件良率
        - from: sensing
          to: control
          label: 反馈质量
        - from: control
          to: oem
          label: 集成与调试
        - from: factory
          to: readiness
          label: 可重复硬件
        - from: standards
          to: oem
          label: 接口预期
        - from: dataset
          to: control
          label: 更好调试 / 数据闭环
        - from: oem
          to: readiness
          label: 现场部署证明
  - id: FE004
    title: 产品成熟度 / 能力图谱
    type: matrix
    layout: wide
    summary: 能力成熟度在子系统广度上最高，在公开文档和第三方验证上最低。
    approximationNotes: 强 / 中等 / 弱是基于证据的综合，不是审计后的内部成熟度评级。
    claimRefs:
      - CE015
      - CE022
      - CE024
      - CE026
      - CE029
      - CE030
      - CE034
      - CE036
    data:
      columns:
        - 能力
        - 公开成熟度
        - 具名证据
        - 主要缺口
      rows:
        - label: 灵巧手机械目标
          values:
            - 强
            - 强
            - Flex 2 官方页面 + 媒体报道
            - 独立耐久数据有限
        - label: 执行器产品广度
          values:
            - 强
            - 中等偏强
            - 线性和旋转产品页
            - 客户级性能数据有限
        - label: 工厂爬坡
          values:
            - 中等偏强
            - 中等
            - 关于我们页面、Zhaopin、Hangzhou Daily
            - 良率 / 质保 / 利用率未披露
        - label: 开发者 / 文档界面
          values:
            - 弱到中等
            - 弱
            - 开放生态表述 + 稀疏下载中心
            - 无可见 SDK 或公开集成手册
        - label: 信任 / 合规披露
          values:
            - 中等
            - 弱到中等
            - 存在政策和标准背景
            - 无公开认证矩阵或故障率文件
  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 真实客户旅程从 OEM 工程评估开始，之后才到终端运营方或重复采购阶段。
    claimRefs:
      - CU002
      - CU018
      - CU019
      - CU032
      - CU033
    data:
      items:
        - label: OEM 团队识别操作缺口
          detail: 买方通常是机器人制造商，而不是最终工厂
          tone: neutral
        - label: 工程评估启动
          detail: 评估文档、接口、载荷、力控和交付周期
          tone: neutral
        - label: 试点集成落地
          detail: 大范围运营方铺开前，先在某个平台上完成资格验证
          tone: warning
        - label: 场景买方验证价值
          detail: 工厂、仓库或研究工作流决定该子系统是否重要
          tone: positive
        - label: 证据站住脚后才扩张
          detail: 可靠性和服务跑通后，交叉销售和复购才会出现
          tone: warning
  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: wide
    summary: 公开证据支持其推进到早期漏斗阶段，但尚未进入有具名、指标支撑的运营方部署。
    claimRefs:
      - CU005
      - CU006
      - CU009
      - CU010
      - CU031
      - CU035
      - CU036
    data:
      nodes:
        - id: lead
          label: OEM 兴趣和战略渠道入口
        - id: eval
          label: 平台评估 / 场景适配
        - id: order
          label: 匿名订单或合作信号
        - id: ship
          label: 向具名运营方出货
        - id: ops
          label: 任务级部署指标
        - id: expand
          label: 复购 / 平台扩张
      edges:
        - from: lead
          to: eval
        - from: eval
          to: order
        - from: order
          to: ship
        - from: ship
          to: ops
        - from: ops
          to: expand
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: wide
    summary: Xynova 当前公开证据最强的是订单意向，最弱的是具名运营方验证。
    claimRefs:
      - CU010
      - CU011
      - CU016
      - CU017
      - CU030
      - CU031
    data:
      columns:
        - 具名客户可见度
        - 量产成熟度可见度
        - 结果具体度
        - 证据等级
      rows:
        - label: Xynova 匿名 OEM 订单
          values:
            - 弱
            - 中等
            - 弱
            - T3 类媒体 / 供应商信号
        - label: Xynova 多品牌适配
          values:
            - 弱
            - 弱到中等
            - 弱
            - T3 类招聘画像
        - label: Apptronik / Mercedes 或 GXO
          values:
            - 强
            - 中等
            - 中等
            - 具名交易对手
        - label: BMW / Figure 运营方证据
          values:
            - 强
            - 强
            - 强
            - T1/T2 运营方侧基准
        - label: OYMotion 具名批量订单措辞
          values:
            - 中等偏强
            - 中等
            - 弱到中等
            - 供应商侧证据，但更明确
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 最高剩余风险集中在规模化质量、匿名客户集中度和新兴合规义务。
    claimRefs:
      - CR003
      - CR007
      - CR025
      - CR029
      - CR039
      - CR040
      - CR041
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
      rows:
        - label: 规模化质量 / 可靠性
          values:
            - 高
            - 高
            - 低到中
        - label: 匿名 OEM 集中度
          values:
            - 中高
            - 高
            - 低
        - label: 合规 / 标准缺口
          values:
            - 中
            - 高
            - 中低
        - label: 专利 / 商业秘密争议
          values:
            - 中
            - 中高
            - 中
        - label: 文档 / 集成阻力
          values:
            - 中
            - 中高
            - 中低
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 运营和合规失误会很快传导到客户验证、融资议价能力和估值质量。
    claimRefs:
      - CR023
      - CR024
      - CR029
      - CR034
      - CR039
      - CR040
      - CR042
    data:
      nodes:
        - id: yield
          label: 良率 / 可靠性不达标
        - id: integration
          label: 集成阻力
        - id: compliance
          label: 合规缺口
        - id: customer
          label: 客户证据薄弱
        - id: margin
          label: 利润率 / 支持负担
        - id: funding
          label: 融资叙事更难讲
        - id: valuation
          label: 估值压力
      edges:
        - from: yield
          to: customer
          label: 部署表现不及预期
        - from: yield
          to: margin
          label: 返工 / 保修
        - from: integration
          to: customer
          label: 客户认证放慢
        - from: compliance
          to: customer
          label: 试点受限
        - from: customer
          to: funding
          label: 证据削弱
        - from: margin
          to: funding
          label: 经济性承压
        - from: funding
          to: valuation
          label: 溢价受质疑
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: 核心依赖从上游精密投入品和标准，传到工厂执行，再传到少数下游 OEM。
    claimRefs:
      - CR019
      - CR025
      - CR026
      - CR027
      - CR035
    data:
      nodes:
        - id: precision
          label: 精密投入品 / 专用零部件
          note: 部分高端投入品仍然敏感
        - id: standards
          label: 地方 + 国家标准
          note: HEIS 和杭州规则塑造合规边界
        - id: factory
          label: Xynova 工厂与 QA 体系
          note: 规模化风险集中在这里
        - id: investors
          label: 战略投资人 / 渠道
          note: 能帮忙，也可能扭曲需求
        - id: oems
          label: 头部人形机器人 OEM 客户
          note: 客户匿名，但可能高度集中
        - id: export
          label: 海外买家 / 支持渠道
          note: 文档和合规很关键
      edges:
        - from: precision
          to: factory
          label: 零部件质量
        - from: standards
          to: factory
          label: 安全 / 可追溯
        - from: factory
          to: oems
          label: 交付与质量
        - from: investors
          to: oems
          label: 渠道 / 冲突
        - from: factory
          to: export
          label: 文档与支持
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 市场强、战略角色明确，但客户与经济性证据不完整；在当前价格下，结论只能是观察 / 继续研究。
    data:
      nodes:
        - id: market
          label: 人形机器人大顺风
          detail: 需求背景和中国生态真实存在
        - id: role
          label: 潜在 Tier-1 零部件地位
          detail: 灵巧手加执行器，可能撬动配套切入点
        - id: proof
          label: 公开证据缺口
          detail: 订单匿名、没有收入、没有公开质量指标
        - id: risk
          label: 投资论证风险高
          detail: 集中度、可靠性和客户自研仍是开放问题
        - id: price
          label: 当前价格约 $1B
          detail: 叙事说得通，证据还不完整
        - id: track
          label: 当前判断：观察 / 继续研究
          detail: 保持跟进，但暂不按明确买入来承销
        - id: buy
          label: 上调触发条件
          detail: 具名客户 + 复购订单 + 质量 / 合规数据
        - id: pass
          label: 下调触发条件
          detail: 客户自研、可靠性失效，或下一轮清算优先权偏重
      edges:
        - from: market
          to: price
          label: 支撑上行
        - from: role
          to: price
          label: 支撑溢价叙事
        - from: proof
          to: risk
          label: 不确定性仍高
        - from: risk
          to: track
          label: 卡住立即买入
        - from: price
          to: track
          label: 合理但不够有吸引力
        - from: track
          to: buy
          label: 若证据补齐
        - from: track
          to: pass
          label: 若投资逻辑破裂
    claimRefs:
      - CV010
      - CV011
      - CV022
      - CV029
      - CV031
      - CV041
      - CV042
      - CV043
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 公允价值判断更多随客户证据、质量证据和融资条款而动，不只看宏观 TAM。
    data:
      items:
        - label: 具名 OEM 披露 + 复购订单
          value: 0.3
          unit: USD B delta
        - label: 公开可靠性 / 现场质量指标
          value: 0.2
          unit: USD B delta
        - label: 标准 / 合规路线图落地
          value: 0.1
          unit: USD B delta
        - label: 客户集中度高于预期
          value: -0.15
          unit: USD B delta
        - label: OEM 自研或价格压力
          value: -0.2
          unit: USD B delta
        - label: 下一轮清算优先权偏重 / 条款偏弱
          value: -0.15
          unit: USD B delta
        - label: 质量或合规受挫
          value: -0.3
          unit: USD B delta
    claimRefs:
      - CV022
      - CV024
      - CV025
      - CV026
      - CV027
      - CV038
      - CV039
      - CV042
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 示意估值和回报结果说明：当前入场只有在证据改善或保护条款很强时才可接受。
    data:
      items:
        - label: 悲观估值区间
          low: 0.3
          mid: 0.45
          high: 0.55
          unit: USD B
        - label: 基准估值区间
          low: 0.65
          mid: 0.85
          high: 0.95
          unit: USD B
        - label: 乐观估值区间
          low: 1.3
          mid: 1.6
          high: 2
          unit: USD B
        - label: 当前入场估值
          low: 1
          mid: 1
          high: 1
          unit: USD B
        - label: 当前入场的悲观回报
          low: 0.3
          mid: 0.45
          high: 0.55
          unit: x
        - label: 当前入场的基准回报
          low: 0.65
          mid: 0.85
          high: 0.95
          unit: x
        - label: 当前入场的乐观回报
          low: 1.3
          mid: 1.6
          high: 2
          unit: x
    claimRefs:
      - CV033
      - CV034
      - CV035
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 面向 IC 的评分显示，市场和技术定位强，但经济性披露薄弱，证据质量也只是中等。
    data:
      items:
        - label: 市场机会评分
          value: 4
          unit: /5
          note: 人形机器人顺风大、增长快，中国尤其明显
        - label: 技术 / 定位评分
          value: 4
          unit: /5
          note: 操作瓶颈和更宽的零部件栈是真正强项
        - label: 客户证据评分
          value: 2
          unit: /5
          note: 大额匿名订单有帮助，但缺少具名部署证据
        - label: 经济性披露评分
          value: 1
          unit: /5
          note: 没有公开收入、利润率或在手订单转化数据
        - label: 风险画像评分
          value: 2
          unit: /5
          note: 集中度、质量和客户自研风险仍未解答
        - label: 估值纪律评分
          value: 2
          unit: /5
          note: 当前价格不荒唐，但跑在证据前面
        - label: 证据质量评分
          value: 2
          unit: /5
          note: 战略信号不错，运营验证不完整
    claimRefs:
      - CV010
      - CV018
      - CV028
      - CV030
      - CV031
      - CV032
      - CV043
