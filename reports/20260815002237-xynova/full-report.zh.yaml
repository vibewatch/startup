      - number: '2.2'
        title: 机会测算：全球 TAM 很大，中国 SAM 更窄，灵巧手切片更窄
        blocks:
          - type: paragraph
            body: >-
              公开市场规模信号很大，但必须谨慎使用。MarketsandMarkets 预计全球人形机器人市场 2026 年为 USD 5.41 billion， 到 2035 年达到 USD 50.27
              billion；Goldman Sachs 的预测更保守，但到 2035 年仍有 USD 38 billion。针对中国， MarketsandMarkets 预计市场从 2025 年 USD 0.40
              billion 增长到 2030 年 USD 2.80 billion。这些数字对应的是完整人形机器人平台， 不是灵巧手。要把它们转成 Xynova 的世界，必须明确假设组件占比。按灵巧手成本占比 15% 到
              20% 计算，到 2030 年，中国组件 SAM 粗略约为 USD 0.42 billion 到 USD 0.56 billion；到 2035 年，全球灵巧手 TAM 约在 USD 5.7 billion 到
              USD 10.1 billion 量级， 取决于采用哪一份市场预测。这些仍是自上而下估算，但比把整个人形机器人市场都当作可直接触达市场更有决策价值。中国语境进一步强化了这个判断： IFR 和 MERICS
              都显示，中国已经拥有工业机器人装机基础、本土供应商深度和政策支持，因此比许多西方市场更可能把好奇心更快转化为实际组件需求。
