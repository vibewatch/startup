        - 把 Tier-1 上行空间变成脆弱的单项目敞口
        - 下调建议，或要求大幅价格让步
      - - 质量 / 可靠性证据仍缺失
        - 下一次估值抬升前，仍没有可信的正常运行时间、退货率或故障数据
        - 削弱“规模正在去风险”的主张
        - 不要给溢价倍数背书
      - - OEM 自研内化加速
        - 主要客户宣布内部手部 / 执行器路线图
        - 压住长期定价权和替代耐久性
        - 除非价格大幅重置，否则转为放弃
      - - 下一轮偏重优先权
        - 新融资在普通股之上增加强下行保护
        - 可能让头部估值对新进入者产生误导
        - 按完全摊薄后的分配瀑布重估回报
