              市场足够大，可以容纳许多赢家，因此决定性风险比「人形机器人可能被过度炒作」更具体。Xynova 的投资逻辑会在三种情况下破裂：
              质量数据在量产主张上升时仍不透明，新兴标准比公司的合规故事更快硬化，或支撑今天叙事的旗舰 OEM 需求最终并不耐久。这些风险都可以监测。
