      - number: '1.2'
        title: 创始人画像、团队厚度与治理集中度
        blocks:
          - type: paragraph
            body: >-
              公开领导层叙事异常集中在创始人兼 CEO Xia Yuxuan 身上。多家独立来源认定他为创始人兼 CEO，工商登记页面还把法定代表人、董事长、
              经理和财务负责人等正式角色放在他名下。一家成立仅一年的硬件初创公司出现这种集中并非天然负面，但它意味着公司看起来仍是创始人中心， 而不是制度化治理。媒体画像补充了创始人与市场匹配度：Xia
              被描述为接受过物理学和计算机科学训练、从投资人转型为经营者的人， 曾任职于 Morgan Stanley 和 CDH Investments，后来转向具身智能瓶颈。团队故事比正式治理故事更强。访谈称，公司到
              May 2026 已从寥寥数人快速扩张到近 300 人， 并汇集来自 DJI、KUKA、CATL、Schaeffler、Apple 和一流高校的人才。不过，工商年报只显示 2025 年参保员工 61
              人，公开材料也没有披露具名 CFO、 CTO 或独立董事会结构。更稳妥的结论是：Xynova 很可能具备实质技术厚度，但公开治理透明度仍有限，且围绕创始人的关键人物集中度真实存在。
