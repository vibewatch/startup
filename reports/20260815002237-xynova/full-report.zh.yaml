            body: >-
              公司最强的财务事实是资本可得性。公开报道支持一条截至 July 2026 的快速融资序列，最终形成据称的独角兽估值和约 RMB1.5 billion 累计资本。
              这是一个强信号，说明战略投资人相信公司切中了真实瓶颈。但这不等于证明业务可以自我供血。超过 10,000 只手和 200,000 个微型电缸的工厂计划、
              技术和制造岗位的持续招聘，以及同行人形机器人公司普遍可见的资本密集度，都指向持续现金消耗。短期更可能的结果是：公司有足够现金跑道去建设和出货， 但不一定有足够证据停止融资。在 Xynova
              披露积压订单转化、毛利率和营运资本动态之前，最安全的解读是：公司资金足以执行， 但要降低规模化风险仍依赖外部资本。
