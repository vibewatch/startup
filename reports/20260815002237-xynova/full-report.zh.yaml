      - number: '8.4'
        title: 当前价格下应选择观察：上行空间真实存在，但证据缺口仍承担了太多论证
        blocks:
          - type: paragraph
            body: >-
              如果今天给出买入结论，就等于假装战略热度和匿名订单已经接近经营证据。事实不是这样。Xynova
              完全可能兑现甚至超过当前估值，尤其是在中国人形机器人供应链加速、公司成为多个旗舰平台优先供应商的情况下。但公开证据还不足以让投资人有把握把这一结果写进投资假设。因此建议是观察或继续研究，不是永久放弃，也不是现在买入。该判断不是否定业务，而是针对缺失证据作出的价格敏感回应。更低的入场价格、更强的下行保护，或把近期分批投资与客户、质量里程碑绑定，都能改善交易设置。反过来，如果下一轮估值继续上台阶却没有明显更好的披露，估值会更难辩护，而不是更容易。
