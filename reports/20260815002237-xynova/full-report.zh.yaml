  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 正确估值框架应基于里程碑，因为价格可见但经济性不可见
        blocks:
          - type: paragraph
            body: >-
              在人形机器人相邻领域，Xynova 的定价问题不寻常，但并非独一无二。标题很容易理解：一家年轻的杭州灵巧手公司似乎在快速融资序列后达到独角兽估值。
              承销挑战更难。公开来源仍没有提供收入、毛利率、积压订单转化或合同经济性细节；没有分母，经典收入倍数估值只能靠编造。
              因此，正确框架应当基于情景、由里程碑驱动。投资人应追问：什么证据会让今天的价格显得便宜、公允或昂贵——具名 OEM 客户、重复订单、 可靠性指标，以及 Xynova 能成为难以替代的 Tier-1
              供应商，而不是技术出色但经济上可替换的组件厂商的证明。换句话说， 问题不是灵巧手是否重要——它们重要；问题是，公开记录是否已经足以支撑按 Xynova 已经赢下市场来付价。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV021
              - CV022
