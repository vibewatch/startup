    rows:
      - - 投资逻辑
        - Xynova 有机会成为多家头部人形机器人 OEM 的灵巧手 Tier-1 供应商
        - 全栈操控组件、战略投资人、强中国生态
        - 具名 OEM 背书加复购，会显著增强判断
      - - 投资逻辑
        - 组件供应商比单一 SKU 灵巧手厂商能捕获更多价值
        - 灵巧手加执行器，增加挂载点和潜在采购份额
        - 公开的多产品收入结构证据会提升置信度
      - - 反向逻辑
        - 组件供应商容易受买方压价和自研内化挤压
        - 学习曲线改善后，OEM 可能把手部设计收回内部
        - 客户若选择外部标准化、而不是自研内化，风险会下降
      - - 反向逻辑
        - 当前估值嵌入的证据强度高于公开记录
        - 没有公开收入、利润率或具名客户数据
        - 更低价格或更强下行保护会让反对理由变弱
      - - 反向逻辑
        - 质量与合规缺口比市场规模偏弱更快打破故事
        - 可靠性、支持和标准披露仍然稀疏
        - 第三方质量数据和认证映射会显著有帮助
    notes: 估值争议不是“好公司还是坏公司”；真正的问题是，公开证据尚未到位前，当前价格是否已经假设了瓶颈权力。
