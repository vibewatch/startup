              中国快速改善的供应链给 Xynova 提供缓冲，但不能让它摆脱依赖。上游方面，即便乐观追踪器也承认精密零部件、特种材料和部分工业投入仍有弱点。 下游更大的依赖是商业性的：匿名但看起来很大的 OEM
              订单。这些订单带来兴奋和制造信心，但如果少数机器人平台主导管线， 也意味着集中度和议价权风险。战略投资人可能加深这个问题，因为他们可能同时是渠道、设计伙伴，或未来内部自研竞争者。
              本地试点基础和杭州生态降低了测试和算力获取摩擦，却也让公司集中在一个快速变化的国内生态中，标准、伙伴和买方预期都可能迅速演化。 市场增长是真实的，但增长可能比解决压力更快地放大运营和定价压力。
