      - number: '3.2'
        title: 全栈 OEM 赢在能力宽度；Xynova 的组件专精赢在灵巧深度
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Xynova 最强的位置在组件层专精。其官方界面紧紧围绕灵巧手和执行器，第三方报道也强化了它比许多同行在手部堆栈上拥有更多内部能力的说法。
              这种模式可能在重量、力控、执行器集成和工程迭代上形成真实深度。Shadow 仍是科研级灵巧度的标杆；Festo 的 BionicSoftHand 则代表一种更柔性、
              适合协作、面向工厂的替代方案，自由度更低，但装配和服务用例更清楚。Unitree 展示了一体化 OEM 如何把手部打包成更大机器人产品里的一个选项； G1
              上的定价可见性也提醒人们，系统级厂商能够挤压组件经济性。Apptronik 和 Boston Dynamics 展示了另一种模型：通过完整系统部署、
              工作流集成和可制造性赢得信任，而不是把手本身变成产品。竞争张力因此不只是功能对功能，而是买家到底偏好最强的专业子系统，还是最集成的平台。
