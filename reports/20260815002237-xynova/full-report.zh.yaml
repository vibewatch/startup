      - number: '1.4'
        title: 里程碑、规模信号与仍待证明的问题
        blocks:
          - type: paragraph
            body: >-
              产品和工厂里程碑足以显示势头，但还不足以消除执行风险。第三方报道称，Xynova 在 2025 年发布 Flex 1，May 2026 推出 Flex 2， 在 ICRA 2026 展示，并计划在 WAIC
              2026 完成国内首秀。Flex 2 的技术主张很抓眼球：23 个总自由度、约 400 grams 手部重量、 多模态感知，以及旨在同时改善灵巧度和动态响应的腱绳加直接驱动混合架构。Tencent
              及后续英文报道称，公司正在爬坡一座 5,400-square-meter 工厂， 目标到 end-2026 形成年产 10,000 只灵巧手和 200,000
              个微型电缸的能力。但公开记录仍留下实质缺口。媒体提到头部 OEM 订单， 却没有完整披露客户名称或合同金额。没有任何已审阅来源披露收入、毛利率、烧钱速度或现金情况。来源集中唯一更审慎的分析认为，
              融资更多降低的是资金稀缺风险，而不是证明公司已准备好大规模部署，尤其是在安全标准、可靠性和软件兼容性仍未定型的情况下。 因此，Xynova
              的画像是：一家具有罕见势头和融资能力的年轻品类龙头组件公司，但在按面值承销其独角兽标记之前，仍缺少投资人想看到的经营披露。
