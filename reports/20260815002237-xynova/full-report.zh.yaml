      - number: '3.4'
        title: 悲观情景：内部自研、定价不透明、叙事跑在部署证据前面
        blocks:
          - type: paragraph
            body: >-
              最重要的反向证据不是戏剧性事件，而是结构问题。第一，全行业公开定价和打包数据都很贫乏，难以判断技术边际能否熬过采购谈判。 第二，一体化对手拥有 Xynova 尚未在公开层面匹配的客户证明：Apptronik
              有具名协议；Boston Dynamics 用工作流和机队语言讲述客户价值； 中国主要 OEM 已经出货数千台机器人。第三，公开来源仍更多强调品类热度、融资和演示，而不是长期现场证据。MERICS
              和其他市场观察者反复警告， 灵巧度、成本、精度和软件成熟度仍限制广泛采用。这意味着，Xynova 可能确实是中国资金最充足的手部专业厂商之一，
              但未来真实经济剩余也可能流向平台所有者或汽车厂商进入者。因此，尽调要证明的是：Xynova 能成为不可替代的 Tier-1 手部供应商， 而不只是一个阶段性受追捧的组件初创公司。
