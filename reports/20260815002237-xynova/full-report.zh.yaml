        title: 承销堵点不是拿钱能力，而是经营透明度
        blocks:
          - type: paragraph
            body: >-
              从财务角度看，Xynova 像是一家先解决融资、后解决外部报告的公司。已审阅来源支持一个雄心勃勃的制造扩张计划、真实投资人需求，
              以及在人形机器人部署放量时颇具吸引力的品类。但这些来源并不支持承销收入质量所需的一组经营指标：已实现 ASP、毛利率、现金消耗、
              积压订单质量、客户集中度、退货或质保准备金，以及营运资本消耗。这种错配很重要，因为早期硬件公司可以在工厂故事和战略股东名单上显得极其亮眼，
              底层经济性却高度不均。正确的尽调姿态不是「因为不透明就回避」，而是「没有经营证据，就不要接受估值主张」。如果报价订单能够干净转化为可重复出货和可接受毛利率， Xynova
              可能配得上溢价；但今天的公开数据不足以证明这一点。因此，尽调应把公司视为有前景但尚不能外部审计。
