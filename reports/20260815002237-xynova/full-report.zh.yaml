      - number: '8.5'
        title: 战略退出可选性存在，但下一次投资决策要卡在具体尽调要求和推翻投资逻辑的触发点上
        blocks:
          - type: paragraph
            body: >-
              Xynova 更像一个战略资产故事，离 IPO 就绪公司还很远。未来的产业买家、机器人 OEM 或大型自动化平台，可能会为了操作
              IP、供应商筹码或中国生态位置给公司估值。中期看，未来战略出售比依靠已披露单位经济和广泛客户可见度支撑上市更容易想象。投资人现在评估公司，下一步不该争论人形机器人 TAM
              的哲学问题，而是做结构化尽调。关键问题很直接：客户是谁、集中度多高、有没有质量和合规数据、融资文件到底给了哪些保护和潜在压力。只有当匿名需求转成可验证部署和重复订单，投资逻辑才应上调。如果垂直整合、质量事故或优先权过重的融资证明当前估值叙事厚、证据薄，就应迅速下调。
