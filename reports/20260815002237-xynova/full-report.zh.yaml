      - number: '8.3'
        title: 可比轮次和上市自动化龙头显示上行空间存在，但当前证据仍更支持叙事折价的基准情景
        blocks:
          - type: paragraph
            body: >-
              可比分析有用，但前提是用得克制。Apptronik、Figure AI 等未上市人形机器人龙头估值高得多，但它们拿到这些价格靠的是更完整的平台叙事和更明确的部署。Symbotic、Teradyne
              等上市自动化赢家说明，规模化机器人业务可以很值钱，但它们已经成熟，也有公开收入历史。上述参照只能框定讨论，不能直接给出答案。给 Xynova 做估值，最站得住的做法仍是按情景拆开。乐观情景里，公司成为多个主要
              OEM 默认的灵巧手 Tier-1
              供应商，并在规模化中证明可靠性。基准情景里，它拿下有意义但集中的需求，证据改善后继续融资。悲观情景里，客户把更多堆栈内化，或质量与合规缺口打断叙事。几个结果之间的跨度仍然很大，所以价格纪律才重要。
