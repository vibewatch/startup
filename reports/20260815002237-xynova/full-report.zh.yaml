      - number: '2.3'
        title: 买方、用户与付款方：先由 OEM 拉动，工厂和物流是第一批真实验证场
        blocks:
          - type: paragraph
            body: >-
              Xynova 早期概率最高的买方是人形机器人或先进自动化 OEM，但买方并不等于最终用户或预算所有者。在多数真实部署中，最初用户是把手部集成进机器人平台的工程团队； 付款方则可能是为机器人 BOM
              和试点集成买单的 OEM，也可能是为特定场景试点买单的工业运营方。Jabil 与 Apptronik 的合作给出了一张不错的蓝图：
              检测、分拣、配套拣选、线边配送、夹具放置和子装配，正是更灵巧操作能够创造可量化价值的重复流程。Brooks Rehabilitation 与 Fourier 的公开合作，
              展示了医疗和康复中的另一条路径，买方画像不同，但可靠机器人交互的需求不变。Figure 的家庭帮手定位指向更面向消费者的未来细分市场， 但商业证明看起来仍弱于制造或企业物流。具体到
              Xynova，投资人基础提示了最可信的第一波细分市场：EV 制造、电商物流、智能设备和本地生活机器人。 这不等于已入账收入，但确实让现实近端 SAM 的边界更清晰。
