chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、边界与公司使命
        blocks:
          - type: paragraph
            body: >-
              Xynova 更适合被理解为一家年轻的杭州灵巧操作组件公司，而不是完整人形机器人 OEM。Qichacha 和 Aiqicha 显示的法律实体均为 Hangzhou Xynova Technology Co.,
              Ltd.，2024-12-24 成立于杭州余杭区。官方英文网站内容不多，但指向一致： 围绕灵巧手、线性执行器、旋转执行器和 xynova.tech
              域名下的联系基础设施搭建品牌界面。这一点重要，因为它支撑了对商业模式的具体判断。 Xynova 想占住的是通用 AI
              与真实物理工作之间的机器人手部和执行器栈，而不是加入更宽、更烧钱的全身人形机器人竞赛。官方页面上的使命表述偏哲学，
              但访谈和产品页中的商业框架很清楚：用灵巧手和配套执行器，让生产和日常生活流程中精细、重复、难以自动化的物理任务更容易被机器处理。 从尽调角度看，Xynova 是对具身 AI
              操作层「卖铲人」的押注，而不是直接押注某一个机器人平台会赢。
