  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 买方通常是 OEM 团队，最终用户是工厂或服务工作流
        blocks:
          - type: paragraph
            body: >-
              公开证据指向分层客户图谱。Xynova 不是直接卖给大众消费者；它卖给人形机器人 OEM、算法公司、科研客户和最终场景客户。 实际上，最直接的买方很可能是 OEM
              工程或采购团队，他们评估如何让机器人具备灵巧操作能力。最终用户则位于更下游的制造、物流、科研、
              医疗辅助实验或其他人类环境任务中。这个区分很关键，因为公司的采用曲线取决于机器人厂商的平台认证，然后最终运营方才会看到价值。 这也意味着真正付款方可能不同：OEM 可能为子系统 BOM
              买单，而工厂或仓库运营方最终为嵌入 Xynova 手部的机器人项目买单。 因此，最清楚的公开解读是：需求先由 OEM 拉动，并由场景支撑，而不是直接来自终端市场。
