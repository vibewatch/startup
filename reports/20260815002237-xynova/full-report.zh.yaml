      - number: '8.2'
        title: 投资逻辑是战略瓶颈供应商；反向逻辑是瓶颈商品化比预期更快
        blocks:
          - type: paragraph
            body: >-
              Xynova
              的正向逻辑已经足够强，值得认真研究。公司卖的不是单款灵巧手设计；它拿到了成熟战略投资者的资金，也站在全球扩张最快的人形机器人生态里。如果灵巧操作真的变成瓶颈，胜出的灵巧手与执行器供应商，有机会在多个机器人平台上拿到准
              Tier-1 经济性。反向逻辑同样扎实。零部件供应商不会自动沉淀成持久护城河；垂直整合 OEM
              可能挤压它，买方也可能把供应商拖进价格竞争，另一个难点是把惊艳原型打磨成稳定、可靠、可交付的硬件。公开资料里，叙事仍多于经营证据：订单匿名、野心很大，但耐久性、支持能力和定价权的证明有限。叙事强、证据薄并不否定投资逻辑，却让当前入场点的反向逻辑强到不能忽视。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
