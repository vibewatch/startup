  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入很可能来自报价制组件销售，但公开价格发现很弱
        blocks:
          - type: paragraph
            body: >-
              公开证据足以识别 Xynova 可能的变现界面，但不足以识别已实现经济性。Xynova 的官方页面和招聘材料持续描述一家向人形机器人和工业操作流程销售灵巧手、 一体化关节、执行器和微型电缸的公司。这是 B2B
              硬件模式，销售方式更可能是工程牵头报价，而不是公开标价。最强证据恰恰来自反面： 官方产品页不发布价目表，第三方产品列表也明确说买方必须联系公司询价。实际看，这意味着真正的商业包很可能围绕手部本身包含集成工作、
              评估支持和其他隐性服务成本。结果是一种概念上清楚、财务上不透明的收入模型：硬件加技术支持；但在投资人真正关心的层面——ASP、折扣、 利润率、合同结构和收入确认时点——仍然看不清。
