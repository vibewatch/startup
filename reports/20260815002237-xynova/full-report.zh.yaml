  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 最可见的法律风险是合规漂移，最可能的法律风险是未来 IP 摩擦
        blocks:
          - type: paragraph
            body: >-
              目前没有已知公开案卷让 Xynova 显得有法律麻烦，但尽调不应因此松懈。真实法律图景分两层。第一，监管正在收紧： 杭州已经实施具身智能规则，HEIS 2026
              正在为人形系统及其组件建立全生命周期安全、接口和伦理基线。Xynova 位于灵巧手和执行器层， 因此直接暴露在这些演进中的组件和安全预期之下。第二，公司声称全栈自研产品，这并不会消除未来 IP
              风险，反而会创造新的 IP 风险。 一个拥有电机、减速器、丝杠、控制和算法的供应商，可以防守更多价值；但随着商业规模扩大，它也把自己暴露在更多专利、商业秘密和外国权利冲突中。
              公开来源今天没有显示活跃纠纷；它们显示的是一个此类纠纷常见、可执行且日益商业化的环境。
