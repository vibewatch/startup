        - 部署扩张时仍没有标准路线图或认证支持
        - 把政策顺风变成准入门槛风险
        - 推进前先升级技术和法律尽调
    notes: 下一轮融资和客户证据周期就能看到最重要的触发因素；没有一个需要等几年后再靠人形机器人宏观前景给出答案。
