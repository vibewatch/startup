      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入质量
        - 订单额、出货量、ASP、毛利率和烧钱速度
        - 没有这些，估值仍由叙事牵着走
        - 管理层 KPI 包和财务尽调
      - - 客户证据
        - 具名客户、头部客户占比、复购行为、部署指标
        - 这是判断当前价格能否站住脚的最大单一因素
        - 商业尽调和客户访谈
      - - 质量与可靠性
        - MTBF、现场故障、退货、保修准备、服务间隔
        - 可靠性证据薄弱时，硬件价值会坍塌
        - 运营审计和质量数据复核
      - - 合规准备度
        - 标准映射、认证清单、安全流程、可追溯设计
        - 公司必须真正满足正式要求，政策支持才有用
        - 技术 / 监管尽调
      - - 股权结构表和权利
        - 优先股堆叠、期权池、清算瀑布、按比例增资权和信息权
        - 如果权利不利，头部估值会夸大投资人经济性
        - 融资文件法律尽调
      - - 治理与报告
        - 董事会流程、升级路径、审计准备度、KPI 节奏
        - 任何走向公开市场或赢得后期投资人信心的路径都需要这些
        - 治理尽调和董事会材料复核
    notes: 这些问题得到正面答案，并不能保证买入；但前四项中任何一项答案为负，都会显著削弱投资案例。
    claimRefs:
      - CV003
      - CV004
      - CV015
      - CV037
      - CV038
      - CV039
      - CV041
