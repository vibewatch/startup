  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Xynova 交付的是操作子系统平台，不只是一只机器人手
        blocks:
          - type: paragraph
            body: >-
              公开来源一致显示，Xynova 正在为人形机器人构建操作组件平台，而不是单一展示型手部。公司自称核心组件供应商，产品界面已经覆盖灵巧手、旋转执行器、
              线性执行器和微型电缸。这一点重要，因为产品应当放到客户工作流里理解：Xynova 试图供应末端执行器和关节运动层，让人形机器人 OEM 把 AI 意图转成精确物理动作。
              手部是标题产品，但执行器和控制栈属于同一个商业方案。这让公司更像子系统平台，而不是单 SKU 硬件初创公司。也就是说， 判断产品质量不能只看单个手部参数，还要看集成、可制造性和控制架构。
