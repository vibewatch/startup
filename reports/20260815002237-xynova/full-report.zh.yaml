  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局分成专业厂商、一体化 OEM 与相邻替代品
        blocks:
          - type: paragraph
            body: >-
              Xynova 并不处在一个边界干净的市场中。直接专业厂商包括 Shadow Robot 和 Xynova 这样的灵巧手公司。相邻替代品包括 Festo 的 BionicSoftHand
              等协作型或科研优先的手部产品。 更危险的竞争者，是那些未来可能决定把手部内部化的人形机器人或自动化一体化 OEM。Unitree、Fourier、Figure、Boston Dynamics 和
              Apptronik 展示了这个更宽类别的不同变体：有的向工厂或家庭销售整机，有的来自康复或科研根基，有的试图从执行器到应用流程拥有整个平台。 China Daily
              还叠加了潜在进入者层：汽车厂商进入人形机器人，因为它们已经掌握制造经验、智能设备生态，以及许多组件技术。 这意味着 Xynova 不是只在和其他手部供应商赛跑；它还在和下游客户变成竞争对手的可能性赛跑。
