      - number: '3.3'
        title: 分销权力在下游，Xynova 的护城河更多是技术而非商业
        blocks:
          - type: paragraph
            body: >-
              Xynova 面临的最难竞争事实是，分销权力通常掌握在机器人 OEM 或工业运营方手中，而不是手部供应商手中。Jabil 和 U.S. News 显示，Apptronik
              这样的公司可以在完整系统层面拿下客户、试点和规模化伙伴。Rest of World 和 China Daily 显示，中国 OEM 和汽车厂商支持的进入者正在快速扩张，
              并可以借助体量把更多堆栈内部化。在这个背景下，Xynova 的护城河主张真实但狭窄：混合驱动架构、全栈手部工程和执行器所有权。
              公开资料还看不到的是通过装机基础、切换成本或长期服务合同形成的锁定效应。这并不意味着公司弱，而是意味着它的差异化必须持续跑赢客户垂直整合的动机。 在 Xynova
              能够拿出具名、高量平台胜利之前，其护城河应被视为强技术杠杆，但商业耐久度只有中等。
