- id: verdict-and-diligence-blockers
  title: The underwriting blocker is operating transparency, not access to money
  body: 'Financially, Xynova looks like a company that has solved fundraising before it has solved external reporting. The reviewed source set supports an ambitious manufacturing build-out, real investor demand, and an attractive category if humanoid deployments scale. What it does not support is the set of operating metrics needed to underwrite revenue quality: realized ASPs, gross margin, cash burn, backlog quality, customer concentration, returns or warranty reserves, and working-capital consumption. That mismatch matters because early-stage hardware companies can look extraordinary on factory stories and strategic cap tables while still generating highly uneven economics underneath. The right diligence posture is therefore not “avoid because opaque,” but “do not accept valuation claims without operating evidence.” Xynova may justify a premium if its quoted orders convert cleanly into repeatable shipments and acceptable gross margins; public data today is not enough to prove that case.
    That is why diligence should treat the company as promising but not yet externally auditable.'
