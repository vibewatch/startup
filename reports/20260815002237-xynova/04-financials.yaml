chapter:
  number: 4
  title: Financials
  summary: Xynova’s public financial picture is strongest on capital access and weakest on operating transparency. The evidence supports a quote-led B2B hardware model, large manufacturing ambitions, and enough strategic capital to fund near-term scale-up, but it does not yet support underwriting revenue quality, gross margin, or runway with precision.
sections:
- id: revenue-model-and-pricing
  title: Revenue likely comes from quote-based component sales, but public price discovery is weak
  body: 'Public evidence is sufficient to identify the probable monetization surface, but not the realized economics. Xynova’s official pages and recruiting materials consistently describe a company selling dexterous hands, integrated joints, actuators, and micro cylinders into humanoid-robot and industrial-manipulation workflows. That is a B2B hardware model, likely sold through engineering-led quoting rather than through posted pricing. The strongest evidence for this is negative: official product pages do not publish list pricing, and third-party product listings explicitly say buyers must contact the company for quotes. In practical terms, that means the true commercial package probably includes integration work, evaluation support, and other hidden cost-to-serve elements around the hand itself. The result is a revenue model that is conceptually clear—hardware plus technical support—but financially opaque at the level investors actually care about: ASP, discounts, margin, contract structure,
    and recognition timing.'
  claimRefs:
  - CI001
  - CI003
  - CI004
  - CI005
  - CI006
