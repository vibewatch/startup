- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact
  - Exact diligence path
  rows:
  - - Revenue by product line
    - Cannot assess commercial traction or mix quality
    - Request monthly revenue by hands, actuators, cylinders, and services
  - - Gross margin by SKU
    - Cannot test path to hardware profitability
    - Request COGS bridge including motors, sensors, labor, and warranty
  - - Signed backlog and conversion timing
    - Cannot map valuation to future shipments
    - Request backlog by customer, cancelability, and expected ship dates
  - - Cash balance and runway
    - Cannot test financing dependency
    - Request current cash, burn, and runway model
  - - Working capital profile
    - Cannot test inventory and receivables risk
    - Request inventory turns, receivables aging, payables terms
  - - Customer concentration
    - Cannot see revenue fragility
    - Request top-10 customer revenue concentration
  notes: These gaps are the difference between an exciting factory story and an investable financial profile.
