  - FI004
- id: capital-adequacy-and-burn
  title: Capital is abundant for now, but the business still looks financing-dependent
  body: The company’s strongest financial fact is access to capital. Public reporting supports a rapid funding sequence through July 2026, culminating in a reported unicorn valuation and cumulative capital around RMB1.5 billion. That is a powerful signal that strategic investors believe the company addresses a real bottleneck. It is not the same thing as proof that the business can self-fund. Factory plans above 10,000 hands and 200,000 micro cylinders, continued hiring across technical and manufacturing roles, and the general capital intensity visible in peer humanoid companies all point to ongoing cash consumption. The likely near-term result is adequate runway to build and ship, not necessarily adequate evidence to stop fundraising. Until Xynova discloses backlog conversion, gross margin, and working-capital dynamics, the safest interpretation is that the company is well-financed for execution but still dependent on external capital to derisk scale.
  claimRefs:
  - CI011
  - CI012
  - CI013
  - CI014
  - CI015
  - CI016
