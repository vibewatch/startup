      - number: '2.3'
        title: 'Buyer, user, and payer map: OEM-led first, with factories and logistics as the first real proving grounds'
        blocks:
          - type: paragraph
            body: >-
              The highest-probability early buyer for Xynova is the humanoid or advanced-automation OEM, but that is not
              the same as the end user or budget owner. In most real deployments, the initial user is an engineering
              team integrating a hand into a robot platform, while the payer is either the OEM funding robot BOM and
              pilot integration or an industrial operator funding a scenario-specific pilot. Jabil’s collaboration with
              Apptronik gives a good blueprint: inspection, sorting, kitting, lineside delivery, fixture placement, and
              sub-assembly are exactly the repetitive workflows where more dexterous manipulation can create measurable
              value. Brooks Rehabilitation’s public work with Fourier shows a parallel path in healthcare and rehab,
              where the buyer profile shifts but the need for reliable robotic interaction remains. Figure’s home-help
              positioning illustrates a more consumer-facing future segment, but one that still appears less
              commercially proven than manufacturing or enterprise logistics. For Xynova specifically, the investor base
              is a clue to the most credible first-wave segments: EV manufacturing, e-commerce logistics, smart devices,
              and local-services robotics. That does not equal booked revenue, but it does sharpen which markets belong
              in the realistic near-term SAM.
