      - number: '8.4'
        title: >-
          At the current price the correct call is track, because the upside is real but the proof gap is still doing
          too much work
        blocks:
          - type: paragraph
            body: >-
              A buy call today would require pretending that strategic excitement and anonymous orders are close
              substitutes for operating evidence. They are not. Xynova may absolutely grow into or beyond the current
              valuation, especially if China’s humanoid supply chain accelerates and the company becomes a preferred
              supplier for several flagship platforms. But the public evidence does not yet show enough to underwrite
              that outcome with conviction. The recommendation is therefore track or research more, not pass forever and
              not buy now. That call is not a dismissal of the business; it is a price-sensitive response to missing
              proof. A lower entry price, stronger downside protections, or a near-term tranche structure tied to
              customer and quality milestones could all improve the setup. Conversely, another step-up round without
              much better disclosure would make the valuation harder to defend, not easier.
