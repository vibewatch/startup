chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, scope, and company mission
        blocks:
          - type: paragraph
            body: >-
              Xynova is best understood as a young Hangzhou dexterous-manipulation component company, not as a full
              humanoid robot OEM. The legal entity shown on both Qichacha and Aiqicha is Hangzhou Xynova Technology Co.,
              Ltd., established on 2024-12-24 in Hangzhou’s Yuhang district. The official English site is sparse but
              consistent: it shows a branded surface around dexterous hands, linear actuators, rotary actuators, and
              contact infrastructure tied to the xynova.tech domain. That matters because it supports a concrete reading
              of the business model. Xynova is trying to own the robot hand and actuator stack that sits between
              generalized AI and real physical work, rather than compete in the broader and more capital-intensive
              full-body humanoid race. The mission language on official pages is philosophical, but the practical
              commercial framing is clear in interviews and product pages: use dexterous hands and supporting actuators
              to make delicate, repetitive, hard-to-automate physical tasks more addressable in production and
              daily-life workflows. For diligence purposes, this makes Xynova a picks-and-shovels bet on embodied AI
              manipulation rather than a direct bet on one robot platform winning.
