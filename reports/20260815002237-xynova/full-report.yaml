companyProfile:
  summary: >-
    Xynova is a Hangzhou-based dexterous-hand robotics company operating under the legal entity Hangzhou Xynova
    Technology Co., Ltd. The company positions itself as a supplier of humanoid-robot dexterous hands, linear and rotary
    actuators, and related control-stack components rather than as a full humanoid OEM. Its flagship Flex 2 hand
    launched in May 2026 with 23 total degrees of freedom and a broader full-stack manipulation narrative. Xynova raised
    rapidly through angel, Pre-A, A, and A+ rounds, culminating in a Meituan-led July 2026 unicorn round, and has since
    emerged as one of China’s best-capitalized dexterous-hand startups despite still-limited public financial and
    customer disclosure.
