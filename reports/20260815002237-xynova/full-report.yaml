      - number: '7.5'
        title: The thesis fails on quality, compliance, or customer proof long before it fails on market size
        blocks:
          - type: paragraph
            body: >-
              The market is large enough to support many winners, so the decisive risks are more specific than
              “humanoids may be overhyped.” For Xynova, the thesis breaks if quality data stays opaque while volume
              claims rise, if emerging standards harden faster than the company’s compliance story, or if the flagship
              OEM demand behind today’s narrative turns out to be non-durable. These are monitorable risks. A credible
              mitigation plan would show named customer references, repeat-order behavior, documented field reliability,
              and a concrete compliance roadmap for both domestic and foreign channels. Until then, the company’s risk
              posture should be treated as promising but conditional: strong enough to merit serious diligence, not
              strong enough to waive it.
            claimRefs:
              - CR034
              - CR039
