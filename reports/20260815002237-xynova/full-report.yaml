  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: The right valuation framework is milestone-based because the price is visible but the economics are not
        blocks:
          - type: paragraph
            body: >-
              Xynova’s pricing problem is unusual but not unique in humanoid-adjacent robotics. The headline is easy to
              understand: a young Hangzhou dexterous-hand company appears to have reached a unicorn valuation after a
              rapid fundraising sequence. The underwriting challenge is harder. Public sources still do not provide
              revenue, gross margin, backlog conversion, or contract-economics detail, which means classic
              revenue-multiple valuation is impossible without making up the denominator. The correct framework is
              therefore scenario-based and milestone-driven. Investors should ask what evidence would make today’s price
              look cheap, fair, or expensive: named OEM customers, repeat orders, reliability metrics, and proof that
              Xynova can become a hard-to-replace Tier-1 supplier instead of a technically impressive but economically
              interchangeable component vendor. In other words, the question is not whether dexterous hands matter—they
              do—but whether the public record already justifies paying as though Xynova has won the market.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV021
              - CV022
          - type: figure
