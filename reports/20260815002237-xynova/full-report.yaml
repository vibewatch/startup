      - number: '8.3'
        title: >-
          Comparable rounds and public automation winners suggest upside exists, but today’s proof still points to a
          discount-to-narrative base case
        blocks:
          - type: paragraph
            body: >-
              Comparable analysis is useful only if it is handled carefully. Private humanoid leaders such as Apptronik
              and Figure AI trade at far higher valuations, but those marks were earned with broader platform narratives
              and more visible deployments. Public automation winners like Symbotic and Teradyne show how valuable
              scaled robotics businesses can become, but they are mature companies with public revenue history. Those
              references therefore bound the debate rather than solve it. For Xynova, the most defensible valuation work
              remains scenario-based. In the bull case, the company becomes the default dexterous-hand Tier-1 supplier
              across multiple major OEMs and proves reliability at scale. In the base case, it wins meaningful but
              concentrated demand and keeps raising capital as proof improves. In the bear case, customers internalize
              more of the stack or quality and compliance gaps interrupt the narrative. The spread between those
              outcomes is still wide, which is exactly why price discipline matters.
