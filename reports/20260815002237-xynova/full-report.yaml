      - number: '1.4'
        title: Milestones, scale signals, and what remains unproven
        blocks:
          - type: paragraph
            body: >-
              The product and factory milestones are strong enough to show momentum, but not strong enough to remove
              execution risk. Third-party reporting says Xynova released Flex 1 in 2025, launched Flex 2 in May 2026,
              showed it at ICRA 2026, and planned a WAIC 2026 domestic debut. Technical claims around Flex 2 are
              eye-catching: 23 total degrees of freedom, roughly 400 grams of hand weight, multimodal sensing, and a
              hybrid tendon-plus-direct-drive architecture intended to improve both dexterity and dynamic response.
              Tencent and later English coverage say the company was ramping a 5,400-square-meter factory and targeting
              annual end-2026 capacity of 10,000 dexterous hands and 200,000 micro electric cylinders. But the public
              record still leaves real gaps. Media references to leading-OEM orders do not fully name customers or
              contract values. No reviewed source disclosed revenue, gross margin, burn, or cash. And the one more
              skeptical analysis in the source set argues that funding de-risks capital scarcity more than it proves
              readiness for mass deployment, especially because safety standards, reliability, and software
              compatibility remain unsettled. The picture, therefore, is of a category-leading young component startup
              with unusual momentum and financing, but still without the operating disclosure one would want before
              underwriting the unicorn mark at face value.
