      - number: '8.5'
        title: >-
          Strategic exit optionality exists, but the next investment decision should be gated by concrete diligence asks
          and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Xynova looks far closer to a strategic-asset story than to an IPO-ready company. A future industrial
              buyer, robot OEM, or large automation platform could value the company for access to manipulation IP,
              supplier leverage, or China ecosystem positioning. That is much easier to imagine in the medium term than
              a public listing supported by disclosed unit economics and wide customer visibility. For investors
              evaluating the company now, the right next step is not philosophical debate about humanoid TAM; it is
              structured diligence. The critical asks are straightforward: who the customers are, how concentrated they
              are, whether quality and compliance data exist, and what the financing documents actually say about
              protections and overhang. The thesis should upgrade only if anonymous demand converts into verified
              deployments and repeat orders. It should downgrade quickly if vertical integration, quality failures, or
              preference-heavy fundraising expose the current mark as narrative-rich and proof-light.
