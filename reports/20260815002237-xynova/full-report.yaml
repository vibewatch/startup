  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: The most visible legal risk is compliance drift, while the most probable legal risk is future IP friction
        blocks:
          - type: paragraph
            body: >-
              There is no known public case file making Xynova look legally troubled today, but that should not lull
              diligence into complacency. The real legal picture is two-layered. First, regulation is tightening:
              Hangzhou has already put embodied-intelligence rules in force, and HEIS 2026 is creating a full-lifecycle
              safety, interface, and ethics baseline for humanoid systems and their components. Because Xynova sits at
              the dexterous-hand and actuator layer, it is directly exposed to those evolving component and safety
              expectations. Second, the company’s full-stack in-house product claim creates future IP risk rather than
              eliminating it. A supplier that owns motors, reducers, screws, controls, and algorithms can defend more
              value, but it also exposes itself to more patent, trade-secret, and foreign-rights conflict as commercial
              scale grows. Public sources do not show an active dispute today; they do show an environment where such
              disputes are common, enforceable, and increasingly commercialized.
