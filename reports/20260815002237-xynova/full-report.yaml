  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue likely comes from quote-based component sales, but public price discovery is weak
        blocks:
          - type: paragraph
            body: >-
              Public evidence is sufficient to identify the probable monetization surface, but not the realized
              economics. Xynova’s official pages and recruiting materials consistently describe a company selling
              dexterous hands, integrated joints, actuators, and micro cylinders into humanoid-robot and
              industrial-manipulation workflows. That is a B2B hardware model, likely sold through engineering-led
              quoting rather than through posted pricing. The strongest evidence for this is negative: official product
              pages do not publish list pricing, and third-party product listings explicitly say buyers must contact the
              company for quotes. In practical terms, that means the true commercial package probably includes
              integration work, evaluation support, and other hidden cost-to-serve elements around the hand itself. The
              result is a revenue model that is conceptually clear—hardware plus technical support—but financially
              opaque at the level investors actually care about: ASP, discounts, margin, contract structure, and
              recognition timing.
