  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The landscape splits between specialists, integrated OEMs, and adjacent substitutes
        blocks:
          - type: paragraph
            body: >-
              Xynova does not compete in one clean market. The direct specialist set includes dexterous-hand companies
              such as Shadow Robot and Xynova itself. Adjacent substitutes include collaborative or research-first hands
              such as Festo’s BionicSoftHand. The more dangerous competitor class, however, is the integrated humanoid
              or automation OEM that can decide to internalize the hand over time. Unitree, Fourier, Figure, Boston
              Dynamics, and Apptronik all illustrate variations of that broader class: some sell whole robots into
              factories or homes, some come from rehab or research roots, and some are trying to own the entire platform
              from actuators through application workflows. China Daily adds a likely-entrant layer on top, with
              automakers moving into humanoids because they already own manufacturing expertise, smart-device
              ecosystems, and many of the component technologies. This means Xynova is not just racing other hand
              vendors; it is racing the possibility that downstream customers become rivals.
