              process discipline, and managerial oversight into a very short time window. That is precisely where
              quality systems, trade-secret hygiene, and cross-functional coordination often break down. Public
              governance visibility also remains limited. Registry and profile sources establish the company’s existence
              and key personnel, but they do not provide much comfort on board process, escalation structures, or how a
              serious recall, dispute, or customer failure would be handled. The diligence implication is clear:
              Xynova’s execution may be excellent, but the public record is too thin to assume mature governance around
              a rapidly expanding, safety-relevant hardware business.
            claimRefs:
              - CR021
              - CR022
              - CR037
              - CR038
          - type: table
            tableRef: TR004
            claimRefs:
