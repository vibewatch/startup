      - number: '8.2'
        title: >-
          The thesis is a strategic bottleneck supplier; the anti-thesis is that bottlenecks commoditize faster than
          hoped
        blocks:
          - type: paragraph
            body: >-
              The positive case for Xynova is strong enough to take seriously. The company is selling more than a single
              hand design, has attracted sophisticated strategic investors, and is operating inside the fastest-scaling
              humanoid ecosystem in the world. If dexterous manipulation becomes a true bottleneck, the winning
              hand-and-actuator supplier could earn quasi-Tier-1 economics across several robot platforms. The negative
              case is equally real. Component suppliers do not automatically become durable moats; they can end up
              squeezed by vertically integrated OEMs, by buyers forcing price competition, or by the operational
              challenge of turning brilliant prototypes into boringly reliable shipped hardware. Public sources still
              show more narrative than operating evidence: anonymous orders, broad ambition, but limited proof on
              durability, support, or pricing power. That combination does not kill the thesis, but it makes the
              anti-thesis too strong to ignore at the current entry point.
            claimRefs:
