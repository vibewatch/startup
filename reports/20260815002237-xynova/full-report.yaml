      - number: '3.3'
        title: Distribution power sits downstream, so Xynova’s moat is technical more than commercial
        blocks:
          - type: paragraph
            body: >-
              The hardest competitive fact for Xynova is that distribution power usually sits with the robot OEM or
              industrial operator, not with the hand supplier. Jabil and U.S. News show how a company like Apptronik can
              secure customers, pilots, and scaling partners at the full-system level. Rest of World and China Daily
              show that Chinese OEMs and automaker-backed entrants are scaling rapidly and can use their volume to
              internalize more of the stack. Against that backdrop, Xynova’s moat claim is real but narrow: hybrid-drive
              architecture, full-stack hand engineering, and actuator ownership. What it does not yet have in public is
              lock-in through installed base, switching costs, or long-term service contracts. That does not mean the
              company is weak. It means its differentiation must keep outrunning the vertical-integration incentives of
              its customers. Until Xynova can point to named high-volume platform wins, its moat should be treated as
              strong technical leverage but only moderate commercial durability.
