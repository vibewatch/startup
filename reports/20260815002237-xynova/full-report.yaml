            body: >-
              Xynova is not a software company wearing a robotics costume; it is building a compact electromechanical
              subsystem whose economics will be driven by manufacturing reality. Public market trackers and independent
              commentary show the main economic pressure points: motors and reducers, tactile and force sensing,
              manual-intensive assembly, quality yield, and post-sale reliability. The same sources also show why the
              opportunity is attractive: Chinese hand makers are driving costs down quickly, which can expand demand if
              performance stays acceptable. For Xynova, that creates a classic hardware tension. Falling market prices
              can unlock volume but also compress gross margin unless the company improves yield and cost structure
              faster than competitors do. BotMarket’s integration notes matter here too: even a lightweight, high-DOF
              hand can carry nontrivial engineering work for the host robot, which affects cost-to-serve and could
              either boost services revenue or create support drag. The conclusion is not that the unit economics are
              bad; it is that they cannot yet be verified from public evidence. Procurement discipline and warranty
