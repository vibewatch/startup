        title: The buyer is usually an OEM team, while the end user is the factory or service workflow
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a layered customer map. Xynova is not selling directly to mass consumers; it is
              selling into humanoid OEMs, algorithm companies, research clients, and end-scenario customers. In
              practice, the immediate buyer is most likely an OEM engineering or procurement team evaluating how to give
              a robot dexterous manipulation capability. The end user sits further downstream in manufacturing,
              logistics, research, healthcare-assistance experiments, or other human-environment tasks. This distinction
              matters because the company’s adoption curve depends on platform qualification by robot makers before any
              final operator sees value. It also means the true payer can vary: an OEM may fund the subsystem bill of
              materials, while a factory or warehouse operator ultimately funds the robot program that embeds Xynova’s
              hand. The clearest public reading is therefore OEM-first, scenario-backed demand rather than direct
