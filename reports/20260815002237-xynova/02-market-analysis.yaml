- id: market-size-and-china-context
  title: 'Sizing the opportunity: large global TAM, sharper China SAM, and an even sharper dexterous-hand slice'
  body: 'The public market-size signals are large but must be used carefully. MarketsandMarkets puts the global humanoid-robot market at USD 5.41 billion in 2026 and USD 50.27 billion by 2035, while Goldman Sachs uses a more conservative but still meaningful USD 38 billion by 2035. For China specifically, MarketsandMarkets projects growth from USD 0.40 billion in 2025 to USD 2.80 billion by 2030. Those numbers are for whole humanoid platforms, not for dexterous hands. Translating them into Xynova’s world requires an explicit assumption about component share. Using the 15% to 20% cost concentration cited for dexterous hands yields a rough China component SAM of about USD 0.42 billion to USD 0.56 billion by 2030 and a global dexterous-hand TAM on the order of USD 5.7 billion to USD 10.1 billion by 2035, depending on which market forecast one uses. These are still top-down estimates, but they are more decision-useful than treating the entire humanoid market as directly addressable. The China
    context strengthens the case further: IFR and MERICS both show that China already has the installed industrial-robot base, local supplier depth, and policy support that can translate curiosity into actual component demand faster than many western markets.'
