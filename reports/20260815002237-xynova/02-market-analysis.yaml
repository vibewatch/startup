- id: drivers-and-constraints
  title: 'Drivers and constraints: the market is real, but the execution curve is still steep'
  body: 'The bullish case for Xynova’s market rests on an unusual alignment: China’s policy system now explicitly prioritizes embodied AI, the industrial-robot base is already enormous, the EV and electronics supply chains provide parts and know-how that cross over into robotics, and leading OEMs are already shipping or piloting enough humanoids to create real platform demand for dexterous subsystems. The bearish case is equally important. MERICS argues that China’s humanoids still lack precision and dexterity, remain too expensive for broad deployment, and are mostly stuck in small-scale trials. Goldman adds that hardware maturity is no longer the only bottleneck—manipulation software, real-time control, and reliable interaction remain hard. IFR further warns that broad adoption of humanoid helpers is later-dated than many headlines imply, while traditional industrial robotics will likely absorb AI faster in the near term. The correct market conclusion is neither “this is all hype” nor
    “this is a solved trillion-dollar category.” It is that Xynova is pointed at a real and strategically important bottleneck, but one whose growth curve will be determined by whether OEM pilots convert into repeatable, cost-effective deployments.'
