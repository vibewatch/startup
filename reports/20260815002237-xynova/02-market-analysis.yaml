  evidenceGaps:
  - type: missing-source
    severity: material
    topic: xynova-revenue-by-vertical
    missingEvidence: Actual booked revenue or pipeline split by OEM, manufacturing, logistics, research, or service-robot vertical.
    whyItMatters: Without vertical revenue mix, the market-sizing bridge from TAM to SOM remains conceptual rather than underwritten.
    diligencePath: Request 2026 pipeline and booked revenue by customer vertical plus weighted pipeline by use case.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM002
  - type: conflicting-data
    severity: minor
    topic: tam-range-precision
    missingEvidence: A reconciled third sizing lens for the dexterous-hand market rather than only humanoid-market proxies times component-share assumptions.
    whyItMatters: The current SAM/TAM bridge relies on top-down humanoid forecasts and a component-share heuristic, which is useful but not precise.
    diligencePath: Collect at least one component-specific market study or sell-side note on dexterous-hand or end-effector spend.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: named-oem-platforms
    missingEvidence: Named OEM platforms or signed launch customers using Xynova hands at volume.
