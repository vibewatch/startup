chapter:
  number: 2
  title: Market Analysis
  summary: Xynova addresses the dexterous-manipulation bottleneck inside embodied-AI hardware rather than the full humanoid market, which makes broad robot TAM figures only partially relevant. Public sources support a large global opportunity, a sharper China-based near-term SAM, and a meaningful component-cost concentration around dexterous hands, but they also show that broad deployment still depends on cost, precision, software maturity, and real OEM platform wins.
sections:
- id: market-boundary-and-relevance
  title: 'Market boundary: Xynova sells into the manipulation bottleneck, not the whole humanoid dream'
  body: 'For diligence, the right market lens is narrower than “all humanoid robots” and broader than “one robotic hand SKU.” Xynova sits in the dexterous-manipulation layer: articulated hands, actuators, motors, sensing, and control subsystems that let machines actually grasp, hold, align, sort, and manipulate irregular objects. That distinction matters because broad humanoid TAM figures are easy to quote but can be misleading for underwriting a component supplier. Xynova does not need to win the full-body humanoid race; it needs the underlying robot platforms and industrial workflows that require fine manipulation to scale. TMTPost’s framing is therefore useful: dexterous hands can account for roughly 15% to 20% of total machine cost and are treated as one of the highest-barrier, most value-concentrated subsystems in the stack. Meituan’s investment rationale says essentially the same thing in strategic language: dexterous operation is the bridge between AI brains and useful physical work.
    The practical implication is that Xynova’s real market includes humanoid OEMs, industrial manipulation retrofits, and adjacent collaborative-hand use cases, while excluding broad spending on locomotion, foundation models, and unrelated factory automation that does not require dexterous grasping.'
