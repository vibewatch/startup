summary:
  headline: Xynova 卡在人形机器人栈里很有战略价值的位置：灵巧手和执行器。公司融资规模和战略关注度已足够重要，但公开记录仍缺少具名客户、可靠性、经济性和融资条款证据，尚不足以高信心承销当前独角兽估值。
