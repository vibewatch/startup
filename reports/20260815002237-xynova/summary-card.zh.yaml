  topStrengths:
    - 中国融资最充足的灵巧手创业公司之一，投资人覆盖 Meituan、Xiaomi、JD.com、Li Auto、CATL 相关资本和 NIO 相关资本。
    - 产品范围不止一个手部 SKU：Xynova 同时销售灵巧手、直线执行器和旋转执行器，提高了每个机器人平台上的潜在挂载点。
    - 披露的一线 OEM 订单活动和 5,400 平方米工厂爬坡，显示市场拉力真实，不只是 demo 阶段定位。
    - 杭州和中国政策支持、标准活动及供应链深度，共同塑造了有利的本土商业化环境。
    - 若 Xynova 成为难以替代的 Tier-1 操作部件供应商，当前估值仍可能有实质上行空间。
  topRisks:
    - 没有公开收入、毛利率、订单转化或现金消耗数据，当前独角兽标记很难靠基本面承销。
    - 客户证据大多匿名：公开来源指向大型 OEM 订单，但具名部署和复购证据仍缺位。
    - 质量、可靠性、支持和合规证据偏少，而这些因素在灵巧手采购中权重很高。
    - 平台 OEM 未来可能把更多手部和执行器开发内化，压制子系统供应商的长期定价权。
    - 融资条款、优先权结构和治理细节未公开，标题估值可能高估真实入场经济性的吸引力。
  unresolvedGaps:
    - 没有经审计财务报表，也没有覆盖收入、毛利率、烧钱速度或营运资本动态的公开 KPI 包。
    - 没有具名客户集中度表、续约数据或运营方发布的部署指标。
    - 没有 Flex 2 或执行器家族的公开 MTBF、退货率、质保或现场故障数据集。
    - 没有融资文件视角下的清算优先权、期权池、董事会权利或反稀释保护。
    - 没有已发布的标准映射或认证矩阵，把 Xynova 产品与正在形成的地方和国家具身机器人要求对应起来。
