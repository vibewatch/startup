- id: founder-team-and-governance
  title: Founder profile, team depth, and governance concentration
  body: 'The public leadership narrative is unusually concentrated around founder and CEO Xia Yuxuan. Multiple independent sources identify him as founder and CEO, while registry pages also place him in formal legal-representative, chairman, manager, and finance-responsible roles. That concentration is not inherently negative for a one-year-old hardware startup, but it does mean the company still looks founder-centric rather than institutionally governed. Media profiles add color on founder-market fit: Xia is described as a physics and computer-science trained investor-turned-operator who previously worked at Morgan Stanley and CDH Investments and then focused on embodied-intelligence bottlenecks. The team story is stronger than the formal governance story. Interviews say the company grew quickly from a handful of people to nearly 300 by May 2026 and assembled talent from DJI, KUKA, CATL, Schaeffler, Apple, and leading universities. Yet registry data shows only 61 insured employees in the
    2025 filing, and public materials do not disclose a named CFO, CTO, or independent board structure. The right conclusion is that Xynova likely has meaningful technical depth, but still limited public governance transparency and a genuine key-person concentration around the founder.'
