  evidenceGaps:
  - type: missing-source
    severity: material
    topic: named-customers
    missingEvidence: Named downstream humanoid OEM customers, contract values, and shipment schedules for Flex 1 or Flex 2.
    whyItMatters: Order-book quality is central to judging whether Xynova is becoming a real Tier-1 supplier or is still mostly a capital-markets story.
    diligencePath: Request top-10 customer list, signed framework agreements, and 2026 delivered-unit schedule by customer.
    relatedQuestionRefs:
    - QO017
    - QO023
    relatedTableRefs:
    - TO003
    - TO004
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Board composition, shareholder percentages, voting rights, and any investor observer or protective provisions.
    whyItMatters: Founder concentration and strategic-investor influence affect capital-raising flexibility, downstream partnerships, and exit governance.
    diligencePath: Request post-A+ cap table, board list, shareholder agreement summary, and any strategic rights granted to industrial investors.
    relatedQuestionRefs:
    - QO006
    - QO024
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Revenue, gross margin, burn, cash runway, and realized ASP by product line.
    whyItMatters: The company can be valued at unicorn status in private markets while still lacking the unit economics needed for underwriting.
    diligencePath: Request 2025 audited financials, 2026 management accounts, and booked revenue vs shipment data.
    relatedQuestionRefs:
    - QO020
    relatedTableRefs:
    - TO001
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: A reconciled view of total employees, contractors, and insured staff as of mid-2026.
    whyItMatters: The difference between insured-headcount filings and interview-reported team size may be benign, but it weakens confidence in scale claims.
    diligencePath: Request HR census by legal entity plus explanation for insured-employees vs total-staff reporting.
    relatedQuestionRefs:
    - QO007
    - QO021
    relatedTableRefs:
