callouts:
- calloutType: strength
  title: Industrial capital is the strongest external validation signal
  body: For a startup formed in late 2024, the investor roster is unusually strategic. The backers map directly to the sectors where dexterous manipulation matters most—EV manufacturing, logistics, consumer devices, and local-services robotics—which strengthens the case that Xynova is solving a real bottleneck rather than chasing a generic humanoid narrative.
  claimRefs:
  - CO025
  - CO026
  - CO027
  - CO030
  - CO031
- calloutType: risk
  title: Unicorn valuation arrived before public operating disclosure
  body: The July 2026 A+ round and Crunchbase’s unicorn-board coverage make the company financially notable, but they do not answer the core diligence questions on revenue, gross margin, customer concentration, or signed deployment schedules. The valuation headline is therefore ahead of public operating transparency.
