- id: capital-and-industrial-shareholders
  title: Funding arc, unicorn mark, and industrial-shareholder logic
  body: 'The clearest external reason Xynova matters in 2026 is capital formation. Public reporting supports a four-round sequence in less than two years: a December 2025 angel round above RMB100 million led by CATL-backed Puquan Capital, a March 2026 Pre-A led by JD.com, a May 2026 A round led by Li Auto Strategic Investment with financial sponsors, and a July 2026 RMB500 million A+ round led by Meituan with NIO Capital, China Merchants Capital, and Xiaomi continuing to back the company. Crunchbase’s July 2026 unicorn-board coverage puts the post-round valuation at $1 billion, while multiple Chinese and English reports say cumulative capital reached about RMB1.5 billion. The quality of the industrial shareholder roster may be as important as the headline number. CATL, Xiaomi, JD.com, Li Auto, Meituan, and NIO together map to EV manufacturing, consumer electronics, e-commerce logistics, and local-services delivery—exactly the application areas where dexterous end-effectors could matter if
    humanoid or semi-humanoid robots become economically useful. Meituan’s own quote makes the strategic thesis explicit: dexterous operation is the bridge between AI decision-making and real-world work. That does not prove downstream deployments, but it does explain why such an early company could command a unicorn valuation.'
