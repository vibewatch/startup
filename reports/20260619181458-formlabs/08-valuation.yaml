  - id: recommendation-final-stance
    title: Recommendation, Valuation Stance, and Final Diligence Asks
    body: >-
      Recommendation: Track. The recommendation is NOT a Buy at the $2 billion primary-round
      valuation, and NOT an Avoid on the underlying business quality. Formlabs is one of the
      strongest surviving private-market AM companies — profitable, growing, and with a durable
      installed base. However, the $2B entry price is simply not supportable by available
      evidence. The EV/Revenue implied multiple of approximately 8x at the primary mark is more
      than 4x the comparable public-market multiple (Stratasys ~1x, 3D Systems ~1.67x) and
      relies on a revenue acceleration and software-enrichment thesis that has not yet been
      evidenced in public disclosures. The secondary market at ~$727M is a more credible
      entry discipline anchor.

      Valuation stance: Expensive at the $2B primary mark; potentially Fair at the $700–$900M
      secondary-market range; potentially Attractive at any price below $700M on secondary
      platforms or in a negotiated transaction that reflects a meaningful discount to the 2021
      unicorn mark.

      Confidence in this recommendation is Medium due to the absence of segment-level financials,
      gross margin disclosure, and an audited balance sheet. The risk rating is High, primarily
      driven by the stale-valuation risk (large gap between primary mark and secondary pricing),
      tariff exposure from China manufacturing, the 8% royalty encumbrance, and platform
      concentration risk in dental. A combination of fresh audited financials, a disclosed
      exit timeline, and secondary market pricing below $800M would be required to upgrade this
      recommendation to Buy.

      Final diligence asks (ranked by materiality): (1) audited P&L and balance sheet for FY2024
      and FY2025, including gross margin by business line; (2) confirmed 3D Systems royalty scope,
      remaining term, and buy-out economics; (3) cap table showing liquidation preferences, option
      pool, and secondary transactions; (4) confirmed revenue by geography and vertical for tariff
      sensitivity modeling; (5) pipeline for Form Now and manufacturing services revenue, which
      would structurally support a higher exit multiple if proven recurring.
