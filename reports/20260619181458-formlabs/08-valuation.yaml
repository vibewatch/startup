company:
  name: Formlabs
chapter:
  number: 8
  title: Valuation
  summary: >-
    Formlabs' $2 billion private-market valuation — last set in May 2021 — has aged into a stale
    mark against a public AM peer multiple of roughly 1–1.7x EV/Revenue. Secondary-market platforms
    indicate an implied market cap of approximately $726–$727 million as of June 2026, a ~64%
    discount to the primary round price. Formlabs' disclosed revenue of more than $250 million in
    2025 and a >10% FCF margin distinguish it sharply from the SPAC-wrecked AM cohort, but the
    lack of audited financials, a five-year-old valuation anchor, and structurally compressed public
    comps leave no credible path to defending the $2B mark at a near-term exit. A base-case range
    of $700 million–$1.1 billion (2.8–4.4x revenue, 25–40x FCF) is supportable; the bull case
    reaching $1.3–$1.5 billion requires demonstrated revenue acceleration beyond $280M and a
    premium IPO or strategic premium. The recommendation is Track: the business quality is real,
    but the entry discipline at the 2021 unicorn mark is not supportable without fresh financials,
    a disclosed exit timeline, and secondary pricing closer to the $700–$900M range.

sections:
  - id: financing-history-and-current-mark
    title: Financing History and Current Valuation Mark
    body: >-
      Formlabs has raised approximately $254 million in total venture capital across eight rounds
      since its founding in September 2011. The funding history progresses from a $2.9 million
      Kickstarter campaign in 2012, through a $19 million Series A (DFJ Growth, 2013), a $35
      million Series B (Foundry Group with Autodesk, 2016), a $30 million Series C (Tyche Partners
      and Shenzhen Capital Group, 2018), a $15 million extension from NEA (August 2018) that
      pushed the valuation above $1 billion, and culminating in a $150 million Series E led by
      SoftBank Vision Fund 2 in May 2021 at a $2 billion post-money valuation. No new primary
      equity round has been announced since May 2021 — a gap of over five years as of June 2026.
      Formlabs has self-funded its operations and growth through internal cash generation during
      this period, consistent with its publicly disclosed profitability.

      The $2 billion primary-round mark is the only formally disclosed valuation and was set at
      the peak of the 2021 growth-equity boom — a period when technology multiples globally
      reached generational extremes. Since then, the AM sector has experienced the SPAC debacle
      (Desktop Metal, Markforged, Velo3D all destroyed the majority of their public market value),
      SoftBank Vision Fund 2 has recorded significant write-downs across its unicorn portfolio,
      and the Klarna IPO of 2025 demonstrated a 67% collapse from peak private-market valuation.
      Secondary-market platforms price Formlabs shares at an implied market capitalization of
      approximately $726–$727 million as of June 2026 — a ~64% discount to the $2B primary mark.
      This secondary-market signal is the most current public mark available and is treated as the
      best proxy for where arms-length transactions are clearing.

      Formlabs' June 2026 disclosure of revenue surpassing $250 million in 2025 and a greater
      than 10% free cash flow margin is the first financial data the company has ever released
      publicly. This confirms the company has crossed the revenue threshold at which public
      listings become viable and that it has avoided the capital-destructive path of its SPAC-listed
      peers. However, the absence of segment-level revenue, gross margin by business line,
      cash position, debt terms, and working capital data leaves critical underwriting inputs
      opaque. Entry pricing discipline requires anchoring on what is known, not on the stale $2B
      headline.
