  - id: exit-readiness-and-paths
    title: Exit Readiness, Paths, and Governance Signals
    body: >-
      Formlabs is assembling the governance infrastructure of a pre-exit company. The most visible
      signal is the February 2026 appointment of Rob Willett — former CEO of Nasdaq-listed Cognex
      for 14 years — to the Formlabs board, replacing founding-era board member Carl Bass (former
      Autodesk CEO). 3D Printing Industry characterized the move as "quietly reshaping governance"
      consistent with preparing for a public listing or maximizing valuation in a strategic sale.
      Co-founder and Chairman Natan Linder explicitly framed the transition as Formlabs' "evolution
      from breakthrough startup to enduring manufacturing platform," language that directly targets
      public-market and strategic-acquirer audiences. CEO Max Lobovsky has stated he wants Formlabs
      to be "large enough to be a successful public company" before a listing, and the $250M+
      revenue disclosure represents the first evidence Formlabs considers itself approaching that
      threshold.

      Three viable exit paths exist. An IPO is the most publicly discussed scenario, enabled by
      the Willett appointment, the first-ever revenue disclosure, and the broader 2025–2026 unicorn
      IPO recovery (40 traditional IPOs in 2025 at $207 billion combined value, with 2026 tracking
      higher). However, Formlabs as an industrial hardware company without a compelling AI or
      infrastructure narrative would face the same crowding-out dynamic that is pushing hardware
      unicorns to the back of the 2026 IPO queue. A strategic acquisition is equally plausible:
      logical acquirers include Danaher or Dentsply Sirona (dental vertical integration), HP Inc.
      or GE Vernova/Additive (expanding AM platform), or Siemens (industrial automation adjacency).
      Stratasys is a less likely acquirer at its current market cap ($774M) given the size and
      potential antitrust implications, but cannot be ruled out. A private equity recapitalization
      or leveraged buyout at the $700–$900M secondary-market valuation would offer early investors
      partial liquidity and allow Formlabs to operate independently while preparing for a cleaner
      IPO. The ~15-year venture holding period makes exit pressure real: limited partners that
      backed the 2013 Series A are in their second decade with no distributed returns.
