  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: audited-financials
      missingEvidence: >-
        Audited P&L and balance sheet for FY2024 and FY2025, including gross margin by business
        line (hardware, consumables, services), cash position, and working capital metrics.
      whyItMatters: >-
        Without segment-level gross margins, it is impossible to verify whether Formlabs'
        consumables business carries the 60–70%+ margins implied by the razor-and-blade model;
        the FCF margin and EV/Revenue multiple assumptions are entirely unverifiable on
        disclosed minimums alone.
      diligencePath: >-
        Request directly from Formlabs CFO/investor relations in formal diligence process;
        compare to Stratasys and 3D Systems segment disclosure as a structural benchmark.
      relatedQuestionRefs:
        - QV008
        - QV015
        - QV023

    - type: private-evidence-only
      severity: material
      topic: royalty-term
      missingEvidence: >-
        Confirmed remaining term of the 3D Systems royalty agreement, the specific products
        and revenues in scope, the annual payment quantum, and any buy-out or sunset provisions.
      whyItMatters: >-
        An 8% royalty on all net product sales at $250M revenue implies approximately $20M
        in annual deductions; if the royalty extends indefinitely and covers the Fuse X1 and
        all future products, it structurally limits FCF margin expansion and reduces enterprise
        value by $100–150M at a 25x FCF multiple.
      diligencePath: >-
        Legal review of December 2014 settlement agreement text; 3D Systems 10-K filings for
        any counter-party disclosure; direct dialogue with Formlabs general counsel.
      relatedQuestionRefs:
        - QV016
        - QV023

    - type: private-evidence-only
      severity: material
      topic: dilution-and-preferences
      missingEvidence: >-
        Full cap table showing Series E liquidation preferences, option pool overhang, historical
        secondary transactions and implied per-share prices, and per-share economics at various
        exit valuations.
      whyItMatters: >-
        SoftBank Vision Fund 2's typical deal structure includes liquidation preferences that
        could claim disproportionate proceeds in a below-$2B exit; understanding the preference
        stack is critical for modeling actual equity value available to common shareholders and
        option holders.
      diligencePath: >-
        Formal cap table request in due diligence; secondary market transaction data from
        platforms as a proxy for implied share prices; comparable SoftBank term-sheet benchmarks.
      relatedQuestionRefs:
        - QV013
        - QV020
        - QV023

    - type: stale
      severity: material
      topic: valuation
      missingEvidence: >-
        A current primary-round valuation reflecting post-2021 market conditions, or at minimum
        a formally disclosed secondary tender offer price that has been administratively confirmed
        by the company.
      whyItMatters: >-
        The $2B headline valuation is five years old and was set during generational-peak
        multiples; secondary market pricing (~$727M) provides the best proxy, but secondary
        market data from platforms is not formally audited or company-endorsed and carries
        its own noise.
      diligencePath: >-
        Monitor for any announced secondary tender offer, employee liquidity program, or formal
        company-confirmed repurchase program that would set a fresh administrative valuation.
      relatedQuestionRefs:
        - QV001
        - QV005
        - QV019
      relatedTableRefs:
        - TV004

