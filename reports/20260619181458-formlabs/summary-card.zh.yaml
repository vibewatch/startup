  topStrengths:
    - 130,000+ 台打印机装机基础带来可预测的树脂和粉末耗材经常性收入（剃刀 + 刀片模式）
    - FCF 利润率 >10%，且已连续 2+ 年盈利；在增材制造行业罕见，相比 SPAC 上市 AM 同业尤其突出
    - 在专业 SLA 和桌面 SLS 市场领先（全球桌面 SLS 出货份额约 55%）；也是 1980 年代以来创立的最大专业 3D 打印公司
    - 108 项美国实用专利和自研 LFD/SLS 技术构成护城河，2020–2025 年专利申请速度提升 250%
    - 董事会治理已向 IPO 靠拢：前 Cognex CEO Rob Willett 于 2026 年 2 月加入董事会，Carl Bass（前 Autodesk CEO）也继续任职
  topRisks:
    - $2B 一级估值意味着约 8x EV/Revenue，而公开 AM 同业（Stratasys、3D Systems）仅 1.0–1.67x；二级市场价格相当于较一级估值折价约 64%
    - 净产品销售额需向 3D Systems 支付 8% 版税（按披露收入水平约拖累 $20M/年），相较无负担竞争对手压缩 FCF 利润率
    - 中国采购制造带来直接美国关税敞口；CEO Max Lobovsky 公开承认关税不可预测性会打击长期规划
    - 财务不透明：没有审计报表、没有分部收入拆分、没有按业务线披露毛利率，关键承保输入仍拿不到
    - AM 硬件公司在公开市场审视下很难长期撑住软件式倍数；SPAC 同批公司（Desktop Metal、Markforged、Velo3D）已下跌 70–90%
  unresolvedGaps:
    - 审计财务报表和分部收入拆分（硬件 vs. 耗材 vs. Form Now 服务）未披露
    - 资本结构表、清算优先权和优先股反稀释条款未公开
    - 3D Systems 版税协议到期日和精确版税范围未获公开确认；SLA 核心专利 2017 年到期后义务是否仍存续尚未解决
    - 按业务线划分的毛利率，以及耗材客户任何净收入留存或流失指标均未知
    - IPO 或退出时间表未披露；Form Now 服务局收入贡献未披露；精确二级市场估值仍待验证交易数据确认
