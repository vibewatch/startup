summary:
  headline: Formlabs 是专业 3D 打印龙头，收入超过 $250M，能产生现金且罕见地实现 FCF 盈利；但按当前公开市场倍数，2021 年 $2B 估值锚点站不住，只有在 $700–$900M 老股价格区间才值得观察。
