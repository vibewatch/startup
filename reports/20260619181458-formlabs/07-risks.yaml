  - id: regulatory-compliance-risks
    title: Regulatory and Compliance Risks
    body: >-
      Formlabs operates in two high-compliance-intensity segments: medical/dental devices and
      dual-use manufacturing technology. On the medical device side, the FDA's Center for
      Devices and Radiological Health (CDRH) regulates 3D-printed medical devices under the
      same Class I/II/III framework as other devices, with most dental and healthcare products
      requiring Premarket Notification (510(k)) clearance. Formlabs has secured 510(k) clearances
      for several dental materials including Dental LT Clear Resin V2 and Dental LT Comfort
      Resin for mouthguard fabrication, and the Surgical Guide Resin is cleared for dental
      surgical guide production. The BioMed Clear Resin is cleared for short-term skin and
      tissue contact. Each new product or material formulation change requires its own submission,
      creating ongoing regulatory work and potential market-delay risk for dental product
      launches. The FDA has issued Technical Considerations for Additive Manufactured Devices
      guidance that imposes additional documentation, design, and testing requirements on
      manufacturers. Non-compliance with FDA 510(k) requirements could trigger warning letters,
      consent decrees, recalls, or injunctions with material revenue impact in the dental vertical,
      which is Formlabs' fastest-growing segment. On the export control side, Formlabs' SLS Fuse
      platform is increasingly used by defense contractors, drone manufacturers, and aerospace
      customers for end-use part production. SLS equipment capable of producing structural
      aerospace parts may be subject to the Export Administration Regulations (EAR), and certain
      defense-related 3D printing applications may require review under the International Traffic
      in Arms Regulations (ITAR). Formlabs has not made public any export control compliance
      program, but given its 100+ country distribution footprint and growing defense customer
      base, any classification gap creates legal and reputational risk. California Proposition 65
      warning obligations may also apply to certain resin formulations sold in California.
    claimRefs:
