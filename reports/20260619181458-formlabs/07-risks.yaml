company:
  name: Formlabs
chapter:
  number: 7
  title: Risks
  summary: >-
    Formlabs carries a concentrated set of addressable but structurally significant risks: a 2012
    patent settlement obligates the company to pay 3D Systems an 8% royalty on net product sales,
    and an unresolved European patent dispute with DWS (German Mannheim court found FORM 2
    infringing in 2018) creates ongoing EU litigation exposure. Regulatory risk is meaningful but
    well-managed — Formlabs has obtained multiple FDA 510(k) clearances for dental and medical
    products, though each new product launch requires its own submission. Operationally, the
    company's reliance on China-based manufacturing exposes it to material tariff-driven cost
    shocks: CEO Max Lobovsky explicitly acknowledged the trade-fight burden, and the Stratasys
    Q1 2026 results confirm tariff costs are compressing sector margins. The $2 billion valuation
    last set in 2021 creates a stale-pricing risk against an implied secondary-market discount of
    roughly 60%, and the absence of disclosed cash, burn, or segment financials limits underwriting
    visibility. Chinese FDM competition (Bambu Lab, Creality) has reshaped the prosumer tier,
    though Formlabs' SLA/SLS focus insulates it materially. Key person concentration in CEO
    Max Lobovsky and the February 2026 board transition (Carl Bass out, Rob Willett in) add
    governance watch items ahead of any exit.

sections:
  - id: legal-ip-risks
    title: Legal and Intellectual Property Risks
    body: >-

      Formlabs carries two historically significant patent entanglements that remain relevant to
      risk underwriting. In November 2012, 3D Systems sued Formlabs for alleged infringement
      of stereolithography process patents — one of the first patent lawsuits in the desktop
      3D printing era. After two years of litigation, the parties settled in December 2014 on
      terms disclosed in a 3D Systems Form 8-K: Formlabs agreed to pay a worldwide, non-exclusive,
      royalty-bearing license fee of 8.0% of net sales on Formlabs products. The 3D Systems
      SLA core patent (No. 5,597,520, granted 1997) expired in 2017, and the settlement's
      effective period tied to that patent has elapsed; however, the license structure and
      royalty obligation may extend to related patents in the settlement bundle, and no
      public statement confirms the royalty is fully extinguished on current Form 4, Form 4B,
      or Fuse X1 products. This royalty creates a standing COGS drag and should be confirmed
      in diligence. Second, DWS S.r.l. (Italy) filed patent infringement suits against
      Formlabs starting in 2017, primarily targeting the heating system of the Form 2 printer.
      In August 2018, the Mannheim Court (Germany) ruled that the Form 2 infringes the German
      portion of DWS European patent No. 8,945,456 covering SLA heating systems. DWS then
      filed US counterclaims in November 2018 seeking damages and an injunction. The Form 3,
      Form 4, and Form 4B use different Low Force Display (LFD) technology and may not be
      subject to the same heating patent, but the litigation status as of 2026 remains
      unresolved in public records. Formlabs counters with a 108-patent US portfolio (108 grants
      by 2025, +250% filing velocity over prior five years) that creates defensive IP depth
      across SLA, SLS, materials, and software, ranking it in the top 12% of tracked assignees
      by PlainPatent's Innovation Score (50.7/100).
