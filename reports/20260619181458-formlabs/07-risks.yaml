callouts:
  - calloutType: risk
    title: China Manufacturing is the Single Largest Operational Risk
    body: >-
      All Formlabs hardware is assembled in China. With US-China tariffs averaging ~33% on
      effective rates (and stacked sector rates higher), Formlabs faces COGS pressure that
      competitor Stratasys quantified at $5.3M in Q1 2026 alone. Formlabs has not disclosed
      a manufacturing diversification roadmap, creating a scenario where any tariff
      escalation or bilateral trade disruption directly compresses margins with limited
      short-term mitigation.
    claimRefs:
      - CR017
      - CR018
      - CR019
      - CR020

  - calloutType: risk
    title: Stale $2B Valuation Creates Significant Down-Round Risk
    body: >-
      The last formal valuation mark of $2 billion was set in July 2021. Secondary market
      estimates imply a 60–66% discount. Formlabs is profitable and growing, but if an IPO
      or primary raise is required before public markets re-rate the sector upward, investors
      at the 2021 price face substantial dilution or impairment. The absence of disclosed
      financial details (gross margin, cash, burn) makes this risk impossible to size precisely.
    claimRefs:
      - CR026
      - CR027
      - CR028
      - CR029

  - calloutType: recommendation
    title: Priority Diligence Asks Before Commitment
    body: >-
      Three items require resolution before committing capital at the $2B valuation: (1) legal
      confirmation that the 3D Systems royalty is extinguished or quantified for current products;
      (2) a legal opinion on DWS EU patent exposure for Form 4B and Fuse X1; (3) full financial
      disclosure including gross margin by product line, China manufacturing COGS breakdown,
      and FCF trajectory. Secondary asks: export control classification audit for Fuse X1 in
      defense-use cases; confirmed succession plan for CEO Lobovsky.
    claimRefs:
      - CR001
      - CR002
      - CR004
      - CR009
      - CR028
      - CR042

