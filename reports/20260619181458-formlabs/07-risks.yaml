  - id: people-governance-exit-risks
    title: People, Governance, and Exit Risks
    body: >-
      CEO Max Lobovsky has led Formlabs since its 2011 founding at MIT, serving as the public
      face of the company, primary product visionary, and driving force behind its market
      positioning. Co-founder Natan Linder serves as Chairman, and David Cranor is a co-founder
      who remains involved, providing some distributed founder governance. However, Lobovsky's
      central operational authority creates key-person concentration risk: any departure,
      incapacitation, or material transition would create organizational uncertainty at a
      critical scaling juncture. There is no disclosed succession plan or publicly named
      heir-apparent COO or President. In August 2024, Formlabs confirmed layoffs of approximately
      40 employees (under 5% of ~750 headcount), characterized as an efficiency-driven
      restructuring. The layoffs occurred in multiple waves over two years and affected roles
      in departments "below efficiency goals," signaling management actively manages labor cost
      discipline but also that operating efficiency required intervention. The February 2026
      board transition — Carl Bass (ex-Autodesk CEO, board member since 2017) stepping down,
      Rob Willett (ex-Cognex CEO, Nasdaq veteran) appointed — was widely interpreted by
      industry analysts as pre-IPO governance preparation. Willett's Cognex background
      (proprietary hardware + software + recurring revenue; public company for 30+ years)
      directly maps to the Formlabs business model, and 3DPI noted the appointment "carries
      its own commentary" about exit readiness. SoftBank Vision Fund 2 led the 2021 Series E
      and holds an equity stake at the $2B valuation; fund-level pressure to distribute
      capital (Vision Fund 2 has faced broader portfolio write-downs) may drive IPO timeline
      pressure that does not align with the company's preferred "take our time" positioning.
      If an IPO window opens in 2026-2027 but public market sentiment toward hardware companies
      is unfavorable, Formlabs could face a below-intrinsic-value pricing event.
