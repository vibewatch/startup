  - id: operational-supply-chain-risks
    title: Operational and Supply Chain Risks
    body: >-
      Formlabs manufactures its 3D printers in China, a decision CEO Max Lobovsky publicly
      acknowledged creates exposure to US-China trade tensions. In 2025-2026, stacked US
      tariffs on Chinese-assembled electronics and machinery average approximately 33% on an
      effective basis, with peak sector rates exceeding 100%. These tariffs compress margins
      for hardware sold in North America: Stratasys reported a $5.3 million tariff-driven
      profitability drag in Q1 2026 alone, providing a direct proxy for sector-wide cost
      pressure that Formlabs faces but has not disclosed. Formlabs has reportedly opened a
      US regional hub in Milwaukee and explored China+1 manufacturing diversification, but
      no published plan has confirmed a material production shift. The company's primary
      Shenzhen manufacturing relationship creates single-geography concentration risk: any
      escalation of tariffs, export restrictions, or bilateral trade disruption could interrupt
      production or severely increase landed costs in less than a quarter. Materials supply
      carries a parallel risk: Chinese suppliers dominated RAPID+TCT 2026 with aggressive
      pricing on resins and powders, and US additive manufacturing stakeholders have flagged
      overdependence on Chinese materials feedstock as a strategic vulnerability. For the SLS
      product line, nylon 12 and PA 11 powder handling creates OSHA-regulated combustible
      dust explosion hazards: OSHA identifies nylon as a combustible material and requires
      engineering controls, housekeeping, and grounding for dust-generating operations. NIOSH
      has separately documented that 3D printing workers face exposure to ultrafine particles
      and volatile organic compounds (VOCs) from SLA resin vats, with recommendations for
      local exhaust ventilation and PPE. The Fuse X1 also creates a nitrogen gas dependency:
      the printer requires an external nitrogen supply for the SLS powder bed atmosphere,
      adding a utility cost and logistical dependency that has no mitigation path besides
      industrial gas supply continuity. Formlabs provides Safety Data Sheets for all resins
      and materials guidelines on its website, which represents a minimum compliance baseline.
