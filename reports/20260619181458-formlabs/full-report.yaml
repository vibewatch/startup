      - number: '3.3'
        title: Specialty Resin Competitor — Carbon DLS
        blocks:
          - type: paragraph
            body: >-
              Carbon's Digital Light Synthesis (DLS) technology differs mechanically from Formlabs' Low Force Display
              SLA: DLS uses a continuous liquid interface production (CLIP) process with an oxygen dead zone that
              inhibits curing closest to the window, followed by a thermal dual-cure stage that produces isotropic,
              fully-dense parts comparable to injection-molded components. This renders Carbon-printed parts with
              consistent mechanical properties in all directions, a key advantage for end-use functional components and
              regulated dental appliances. Carbon operates exclusively on a subscription model, with annual costs
              reported around $25,000 per year for an M3 printer, inclusive of hardware, software updates, maintenance,
              and support. The M2 ReFLEX (pay-as-you-print) is an entry-level option for smaller dental labs, with
              per-part pricing as low as $7.27 for a surgical guide. Carbon and Keystone jointly produced more than one
              million dental parts, making Carbon a credible production platform for high-volume labs.

              Carbon's dental reach overlaps meaningfully with Formlabs: both serve dental labs and clinics with
              validated resin workflows for guides, dentures, splints, and aligners. The key differentiation is price
              tier and production scale: Carbon's subscription (~$25K/yr) targets labs printing thousands of parts
              monthly and needing end-use mechanical properties, while Formlabs Form 4B ($7,699 base) targets smaller
              labs and clinics. Carbon's closed materials ecosystem (proprietary resins with dual-cure chemistry)
              contrasts with Formlabs' Open Material Mode, which allows third-party resins, reducing per-part cost for
              price-sensitive operators. However, Carbon's subscription model removes large upfront capital barriers for
              well-capitalized labs, and Carbon's production repeatability (±37 µm on M3) is best-in-class for
              high-volume end-use dental manufacturing. For Formlabs, Carbon's presence signals that the top of the
              dental market is pulling toward production-scale platforms, raising expectations for Form 4B throughput
              and materials certification.
            claimRefs:
              - CP015
