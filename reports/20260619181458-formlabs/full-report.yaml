      - number: '4.3'
        title: Cost Structure and Gross Margin Profile
        blocks:
          - type: paragraph
            body: >-
              Formlabs does not publish audited financial statements, and no revenue breakdown by segment or gross
              margin by business line has been disclosed publicly. The best available evidence on cost structure comes
              from: (1) the company's self-reported >10% FCF margin on $250M+ revenue, (2) analog benchmarks from
              comparable industrial hardware-plus-consumables platforms such as Cognex and 3D Systems, and (3)
              structural analysis of the razor-and-blade model itself.


              Industry analysts and observers consistently characterize consumables (resins and powders) as carrying
              materially higher gross margins than hardware for industrial platform businesses. At Formlabs' scale, with
              130,000+ printers generating recurring resin and powder demand, the blended gross margin likely reflects a
              weighted average of a hardware margin in the 50–60% range and a consumables margin above 60–70%,
              consistent with the company's disclosed FCF margin of over 10%. This is far above the typical profile of
              SPAC-listed AM peers (Desktop Metal, Markforged, Velo3D), most of which operated at negative gross margins
              before collapsing or being acquired. The materials vertical integration from the Spectra acquisition
              further supports margin protection in the consumables segment by internalizing the photopolymer chemistry
              supply chain.


              From a cost structure standpoint, Formlabs bears meaningful capital intensity relative to pure-software
              companies: ongoing manufacturing capex, inventory investment across 45+ materials, global logistics
              infrastructure, R&D cycles for printer platforms (Form 4 launched April 2024, Fuse X1 June 2026), and a
              global workforce of approximately 750+ employees. Printer ecosystem add-ons (Form Wash, Form Cure, Fuse
              Sift, Fuse Blast) also require inventory and manufacturing investment, though they contribute incremental
              hardware revenue. SLS powder recyclability of up to 80% is a key cost efficiency narrative for customers
              but implies Formlabs must invest in packaging and logistics for powder return programs.


              The company's distributor network reduces realized gross margin versus list-price assumptions; resellers
              and distributors retain a portion of the margin spread between Formlabs' factory price and the list price
              collected from end customers. The exact channel margin split is not disclosed, but it is structurally
              typical of 15–30% for industrial hardware resellers.
