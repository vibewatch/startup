  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and Intellectual Property Risks
        blocks:
          - type: paragraph
            body: >-

              Formlabs carries two historically significant patent entanglements that remain relevant to risk
              underwriting. In November 2012, 3D Systems sued Formlabs for alleged infringement of stereolithography
              process patents — one of the first patent lawsuits in the desktop 3D printing era. After two years of
              litigation, the parties settled in December 2014 on terms disclosed in a 3D Systems Form 8-K: Formlabs
              agreed to pay a worldwide, non-exclusive, royalty-bearing license fee of 8.0% of net sales on Formlabs
              products. The 3D Systems SLA core patent (No. 5,597,520, granted 1997) expired in 2017, and the
              settlement's effective period tied to that patent has elapsed; however, the license structure and royalty
              obligation may extend to related patents in the settlement bundle, and no public statement confirms the
              royalty is fully extinguished on current Form 4, Form 4B, or Fuse X1 products. This royalty creates a
              standing COGS drag and should be confirmed in diligence. Second, DWS S.r.l. (Italy) filed patent
              infringement suits against Formlabs starting in 2017, primarily targeting the heating system of the Form 2
              printer. In August 2018, the Mannheim Court (Germany) ruled that the Form 2 infringes the German portion
              of DWS European patent No. 8,945,456 covering SLA heating systems. DWS then filed US counterclaims in
              November 2018 seeking damages and an injunction. The Form 3, Form 4, and Form 4B use different Low Force
              Display (LFD) technology and may not be subject to the same heating patent, but the litigation status as
              of 2026 remains unresolved in public records. Formlabs counters with a 108-patent US portfolio (108 grants
              by 2025, +250% filing velocity over prior five years) that creates defensive IP depth across SLA, SLS,
              materials, and software, ranking it in the top 12% of tracked assignees by PlainPatent's Innovation Score
              (50.7/100).
