  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              Formlabs occupies a distinctive position as the largest supplier of professional SLA and SLS 3D printing
              systems by unit volume, yet operates below the revenue scale of listed industrial leaders Stratasys
              (NASDAQ: SSYS) and 3D Systems (NYSE: DDD). The competitive arena divides into four meaningful clusters:
              (1) incumbent industrial OEMs (Stratasys, 3D Systems) with broad polymer and metal portfolios, strong
              services businesses, and distribution footprints built over three decades; (2) dental-vertical specialists
              (SprintRay, Carbon) whose workflow integrations and validated materials target the same lab and clinic
              buyer; (3) desktop SLS peers (Sinterit, the now-closed Sintratec) that competed on price before Formlabs'
              Fuse ecosystem displaced them; and (4) adjacent FDM/filament pressure from Bambu Lab, which captured over
              40% of the $1,000–$5,000 prosumer segment by early 2026 without directly attacking Formlabs' resin or SLS
              markets. The Wohlers Report 2026 recorded $24.2 billion in global AM revenues (2025 actuals), with
              printing services growing 15.5% versus 3.6% for machine sales, reinforcing the threat from service-bureau
              substitutes like Protolabs and Xometry. The industry's M&A cadence is accelerating: Stratasys agreed to
              acquire Markforged for $42.5 million (announced May 2026), and SprintRay acquired EnvisionTEC (announced
              2025/2026), consolidating the dental segment. These moves shape Formlabs' near-term competitive
              environment materially.
