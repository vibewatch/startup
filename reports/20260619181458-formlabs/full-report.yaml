            title: AM Market Maturity Signal May Constrain Hardware TAM Expansion
            body: >-
              Wohlers Report 2026 documents that hardware system sales grew only 3.6% in 2025 while AM services grew
              15.5%, indicating that buyers increasingly prefer outsourcing to service bureaus rather than purchasing
              in-house equipment. If this trend continues, the addressable hardware TAM for Formlabs grows more slowly
              than headline AM market figures suggest. Formlabs must therefore compete not only with rival printers but
