      - number: '5.6'
        title: Limitations, Roadmap, and Technology Risks
        blocks:
          - type: paragraph
            body: >-
              Formlabs' most frequently cited limitation is proprietary ecosystem lock-in: the standard Form 4 workflow
              requires Formlabs-branded resins and tanks by default, and Open Material Mode requires a paid unlock with
              incomplete third-party material certification. Users migrating from open-platform printers note that
              Formlabs resins cost significantly more per liter than open-market alternatives. The BBB business profile
              for Formlabs records customer complaints primarily related to support response times and hardware
              reliability, consistent with a mid-market hardware company at scale. Community forum discussions highlight
              high resin consumable costs (tanks from $125+) as an adoption friction point. PreForm does not offer
              G-code export or third-party slicer support, which limits workflow customization for technically advanced
              users.

              On the Fuse X1 specifically: the system requires an external nitrogen supply that is not integrated,
              adding facility requirements and operational complexity. The material library at launch is limited to
              Nylon 12; Nylon 11 is expected by end of 2026, while Nylon 12 GF and TPU 90A are targeted for Summer 2027.
              These gaps may delay adoption for applications requiring high-performance or flexible thermoplastics. The
              Fuse X1 is also unproven at scale with deliveries starting only in Q4 2026 and limited long-term field
              data available. From a competitive standpoint, Carbon DLS competes in medical device and consumer product
              segments; HP MJF competes for production volume; and legacy industrial SLS players (EOS, Farsoon) will
              defend their enterprise accounts. Formlabs' moat is being tested as industrial incumbents respond to its
              price-disruption strategy.
