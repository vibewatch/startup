      - number: '8.3'
        title: Public Comparables and M&A Benchmarks
        blocks:
          - type: paragraph
            body: >-
              The most directly comparable public companies are Stratasys (SSYS) and 3D Systems (DDD), both of which
              trade on US exchanges and serve overlapping professional and industrial AM end markets. As of June 18,
              2026, Stratasys had an enterprise value of approximately $563 million on trailing twelve-month revenues of
              approximately $547–$570 million, implying an EV/Revenue multiple of approximately 1.0x. 3D Systems had an
              enterprise value of approximately $649 million on trailing revenues of approximately $388 million,
              implying 1.67x EV/Revenue. Neither company is currently profitable on a GAAP basis: Stratasys guided to
              full-year 2026 adjusted EBITDA of only $25–$30 million on $565–$575 million revenue (EBITDA margin
              ~4.5–5.0%), while 3D Systems recorded negative LTM EBITDA of approximately negative $25 million. Formlabs'
              demonstrated profitability is a clear differentiation factor that should command a premium to these comps,
              but the premium is bounded by the AM sector's structural capital intensity and limited institutional
              investor demand for hardware-centric industrial companies.

              Cognex Corporation (CGNX) — the machine-vision company where incoming Formlabs board member Rob Willett
              was CEO for 14 years — is the aspirational ceiling. Cognex combines proprietary hardware with software and
              recurring revenue from industrial end markets; it has historically traded at 6–10x EV/Revenue reflecting
              high-margin software economics layered onto hardware. Formlabs aspires to a similar positioning, but its
              consumables model differs from Cognex's pure software-enriched architecture, and its dental and
              healthcare-focused verticals are less cyclical but also lower-margin than Cognex's semiconductor
              inspection market.

              The M&A data point in the sector is the Stratasys acquisition of Markforged from Nano Dimension for $42.5
              million in May 2026 — an implied acquisition multiple of approximately 0.6x trailing revenue (Markforged
              generated ~$70 million in 2025 revenue). This represents distressed-asset pricing for a company that was
              stripped from its parent and sold under strategic compulsion. Formlabs is not distressed, and a premium to
              this transaction is warranted, but the data point confirms that strategic buyers in the AM sector are
              price- disciplined and are not paying speculative multiples. According to the Investec Q1 2026 Industrial
              Technology Valuation Update, the sector trades at 16.7x EV/EBITDA on average, but only industrial software
              sub-sectors (21.8x) and sensors/vision tech (21.4x) sustain high-teens multiples; hardware-intensive
              machinery and engineering/SI businesses cluster around 8–10x. Strategic M&A in AM commanded 11–15x EBITDA
              for platform assets with IP and long-term production contracts.
            claimRefs:
