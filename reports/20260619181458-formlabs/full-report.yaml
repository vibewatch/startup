            title: $2B Valuation Is Five Years Stale
            body: >-
              The most recent publicly disclosed Formlabs valuation dates to May 2021, set during the peak of
              growth-asset pricing. With no new round or secondary transaction disclosed since then, any valuation
              discussion must account for the material repricing of hardware and industrial technology multiples since
              2022. Revenue multiples for comparable listed companies compressed 50–70% from 2021 highs. The $2B figure
              serves as a reference point but not as a current fair value.
