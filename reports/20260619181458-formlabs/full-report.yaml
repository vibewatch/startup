companyProfile:
  summary: >-
    Formlabs, founded in September 2011 by MIT Media Lab graduates Maxim Lobovsky, Natan Linder, and David Cranor,
    pioneered affordable professional 3D printing and has grown into the world's largest privately held 3D printing
    company by market presence and unit volume. Headquartered in Somerville, Massachusetts, with offices in Berlin,
    Tokyo, Shanghai, Singapore, Budapest, and Raleigh (North Carolina), Formlabs operates a hardware-materials-software
    platform across two core additive manufacturing technologies: stereolithography (SLA) using its proprietary Low
    Force Display (LFD) process, and selective laser sintering (SLS). As of June 2026, Formlabs has sold more than
    130,000 professional 3D printers worldwide, cumulatively produced over 500 million parts, and reported annual
    revenue exceeding $250 million in 2025 with a greater-than-10% free cash flow margin — marking more than two years
    of sustained profitability. The company has raised approximately $254 million in total venture capital, with its
    last primary round being the May 2021 Series E ($150 million at a $2 billion post-money valuation) led by SoftBank
    Vision Fund 2.
