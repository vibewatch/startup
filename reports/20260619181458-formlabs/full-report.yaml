  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Revenue stagnation
        - FY2026 revenue at or below $250M (disclosed 2025 minimum, zero growth)
        - Eliminates growth premium; base-case EV collapses toward bear case ($375M); FCF flat or declining
        - Exit/avoid; sell secondary positions at >$600M; no new investment
      - - Adverse royalty development
        - 3D Systems seeks royalty extension beyond current term, or new product lines brought into scope
        - >-
          Effective net revenue reduction of $20–25M per year; FCF margin compresses to below 7%; exit multiple
          discounted
        - Require royalty term confirmation and buy-out economics before any new commitment
      - - China tariff escalation
        - Effective tariff rate on printer imports rises above 50% or Formlabs unable to pass costs to customers
        - Hardware margin compression of 5–8 percentage points based on sector comps; FCF margin sub-5%
        - Pause; require manufacturing diversification plan with clear timeline and cost-to-execute
      - - IPO market closes to hardware unicorns
        - >-
          No viable hardware-centric industrial IPO completes in 2026–2027 at premium multiples; public comps trade
          below 1x EV/Revenue
        - Exit paths narrow to strategic acquisition or PE; multiple ceiling drops to 1.5–2x EV/Revenue
        - Downgrade to avoid at $2B primary; track for secondary purchase sub-$500M
      - - SoftBank forced exit
        - >-
          SoftBank Vision Fund 2 initiates secondary sale of Formlabs stake at significant discount, or Formlabs agrees
          to below-$700M acquisition to provide LP liquidity
        - Confirms secondary market pricing; may create opportunistic entry below base-case fair value
        - 'Monitor: potential opportunity if forced transaction prices Formlabs below $600M EV'
    notes: >-
      Trigger thresholds are analytical estimates based on disclosed financials and sector comps. No internal Formlabs
      financial data has been disclosed beyond the >$250M revenue and >10% FCF margin thresholds.
    claimRefs:
      - CV038
      - CV039
      - CV040
  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Audited financials
        - >-
          Audited P&L, balance sheet, and cash flow for FY2024 and FY2025; gross margin by business line (hardware,
          consumables, services)
        - >-
          Without segment margins, FCF is unverifiable and revenue quality is opaque; consumables margin is the primary
          valuation driver
        - Request directly from Formlabs CFO/investor relations; comparable private company disclosure precedent exists
      - - 3D Systems royalty
        - >-
          Confirmed remaining term of royalty agreement, products in scope, annual payment quantum, and buy-out
          economics
        - >-
          8% royalty on net sales implies $20M+ annual drag at $250M revenue; material impact on FCF, exit multiple, and
          acquirer willingness-to-pay
        - >-
          Legal review of December 2014 settlement agreement; 3D Systems 10-K filings for any disclosure; direct
          dialogue with Formlabs legal counsel
      - - Cap table and liquidation preferences
        - >-
          Full cap table including Series E liquidation preference terms, option pool size, secondary transaction
          history, and implied dilution at various exit valuations
        - >-
          SoftBank's Series E preference stack could claim a disproportionate share of proceeds below $2B exit; option
          pool overhang affects per-share economics
        - >-
          Request from company in formal due diligence; secondary platforms may indicate rough share price and implied
          preference coverage
      - - Manufacturing footprint and tariff risk
        - >-
          Revenue by geography for tariff sensitivity; manufacturing facility locations, production concentration, and
          near-term localization roadmap
        - >-
          If China manufacturing represents >80% of production, a 50% tariff rate could reduce hardware margins to near
          zero on US sales; critical for bear-case sizing
        - >-
          Company disclosures; customs/import databases; Stratasys Q1 2026 filings as sector proxy for tariff impact
          quantification
      - - Form Now and services trajectory
        - >-
          Monthly gross merchandise volume and gross margin for Form Now service bureau launched in 2026; customer
          retention rate and repeat order rate from the services layer
        - >-
          Form Now is the most significant new revenue and multiple-expansion lever; a 5–8% services contribution at
          higher margin would compress the EV/Revenue multiple and support 4x+ pricing
        - Request from company; third-party customer interviews; benchmarking against established service bureaus
    notes: >-
      Diligence asks ranked by materiality to valuation judgment. Items 1–3 are blocking for any commitment above
      secondary-market pricing. Items 4–5 are material for scenario probability weighting.
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV040
