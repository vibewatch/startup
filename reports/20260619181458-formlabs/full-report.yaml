  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Scope
        blocks:
          - type: paragraph
            body: >-
              The relevant market for Formlabs is professional and industrial desktop/benchtop additive manufacturing,
              bounded by systems priced approximately $3,500–$100,000 that use stereolithography (SLA) or selective
              laser sintering (SLS) workflows. This boundary excludes three classes of spend: consumer and hobbyist FDM
              printers (sub-$1,500, dominated by Bambu Lab and Creality), heavy industrial production systems above
              $200,000 that require dedicated operators and large facility footprints (EOS, 3D Systems ProX), and metal
              additive systems using powder-bed fusion or directed energy deposition.

              Within the professional desktop boundary, included spend encompasses SLA and SLS printer hardware
              (one-time capital purchase), proprietary materials (resins, SLS nylon powders—recurring consumable spend),
              post-processing hardware (wash/cure stations), workflow software (PreForm and Dashboard—recurring SaaS or
              bundled), and maintenance and service contracts. Adjacent spend includes intraoral scanners in the dental
              workflow, CAD/CAM software licenses, and digital supply chain integration services that feed part geometry
              to printers.

              The primary status-quo substitutes are outsourced rapid prototyping bureaus (Xometry, Protolabs,
              Shapeways), subtractive CNC machining of wax or soft aluminum tooling, injection-molding for production
              runs above a few hundred units, and manual dental laboratory fabrication. The buyer-side framing shifts
              from "which printer to buy" to "buy versus outsource" for every segment, meaning the addressable spend
              also includes the prototyping outsourcing budget that in-house adoption displaces.
            claimRefs:
              - CM001
              - CM002
              - CM003
