      - number: '5.4'
        title: Software, Workflow, and Fleet Management
        blocks:
          - type: paragraph
            body: >-
              PreForm is Formlabs' free print preparation software for Windows and macOS. It provides automated support
              generation with single-click operation, real-time printability checks with live printability previews,
              adaptive layer thickness, auto-orientation, and job information including estimated time and material
              usage. For the Fuse SLS platform, PreForm adds automatic 3D packing to maximize build chamber utilization
              and reduce powder waste. The software accepts STL, OBJ, and 3MF files and natively imports STEP,
              SolidWorks (.SLDPRT), CATIA, Creo, JT, and other CAD formats without additional export steps — eliminating
              a common friction point in CAD-to-print workflows. PreForm's print settings are pre-validated for every
              Formlabs material, and advanced users can customize exposure, layer height, and other parameters for Open
              Material Mode prints.

              Formlabs Dashboard is the web-based fleet management platform providing remote print status monitoring,
              printer health tracking, job queue management, material usage analytics, email and SMS alerts, printer
              grouping by team or project, and order history. The Dashboard camera integration enables live print
              monitoring and historical timelapse review. For enterprise users, Dashboard reduces operator overhead by
              centralizing visibility across multiple machines. Formlabs' GitHub organization hosts 504+ public
              repositories including API toolkits and internal engineering tools, reflecting an active developer-facing
              software presence. The Formlabs Community Forum serves as a practitioner-community channel for workflow
              support and user-contributed best practices.
