  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segments and Verticals
        blocks:
          - type: paragraph
            body: >-
              Formlabs serves customers across ten primary industry verticals. Dental/orthodontics is the
              fastest-growing and most strategically important segment: the Form 4B and Form 4BL are purpose-built for
              dental labs and clinical practices, and Formlabs reports having printed 15 million dental parts on its
              platforms. As of 2026, approximately 15% of U.S. dental practices own an on-site 3D printer — a
              penetration rate up from near-zero a decade ago — and the global dental 3D printing market is estimated at
              ~$5.2 billion as of 2024, with a forecast of ~$10 billion by 2033. Engineering and manufacturing is the
              second major vertical, serving product designers, R&D engineers, and production facilities at companies
              ranging from startups to Fortune 500 manufacturers. Healthcare beyond dental — surgical planning models,
              anatomical references, and custom medical devices — is a growing segment. Education (STEM labs, university
              research) provides steady, recurring institutional demand. Jewelry (custom casting patterns using Castable
              Wax and True Cast resins) and consumer goods (footwear, toys, accessories) represent adjacent verticals.
              Defense contractors and drone manufacturers such as ORQA FPV have increasingly adopted Fuse SLS printers
              for supply chain resilience and end-use parts. The buyer/payer profile varies substantially by vertical:
              dental practices and labs purchase directly through distributors such as Henry Schein; manufacturing
              facilities typically go through engineering resellers; and education/government buyers follow
              institutional procurement cycles. Formlabs printers are deployed in over 100 countries, with dedicated
