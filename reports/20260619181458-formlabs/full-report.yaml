      - number: '6.2'
        title: Adoption Trajectory and Installed Base
        blocks:
          - type: paragraph
            body: >-
              Formlabs' cumulative installed base exceeded 130,000 printers with 300+ million parts printed as of
              mid-2026, supported by 750+ employees across 8 global locations. Q4 2025 was the company's strongest
              quarter on record, with record revenue, printer shipments, and materials sales across all product
              categories. The Fuse SLS line was the standout growth driver, growing more than 25% year-over-year in Q4
              2025 as customers shifted from prototyping-only use cases toward factory floor tooling and end-use part
              production. The dental portfolio and large-format SLA systems (Form 4L) simultaneously reached all-time
              revenue highs. Usage data from Formlabs' fleet management (Dashboard) indicates that printers are being
              deployed more intensively over time, not less, suggesting retention and deepening engagement among
              existing customers. The adoption pattern mirrors a classic razor-and-blades trajectory: initial hardware
              placement drives recurring consumable (resin, powder) purchases that grow as customers run more parts and
              expand their fleets. Multiple case studies confirm this progression: Clove Dental scaled from a single
              Form 3B to a 10-printer Form 4B farm; Eaton expanded from SLA prototyping to SLS production tooling across
              more than 200 manufacturing sites. Defense contractors, drone builders, and contract manufacturers
              represent newer cohorts accelerating Fuse SLS fleet accumulation in industrial settings.
