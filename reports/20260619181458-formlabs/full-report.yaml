      - number: '2.5'
        title: Adoption Constraints and Market Headwinds
        blocks:
          - type: paragraph
            body: >-
              Three categories of adoption constraint limit the rate at which Formlabs can convert its TAM into SAM. The
              most persistent is process qualification and certification: the 3DPI 2026 Executive Survey ranks machine
              and process reliability as the #1 adoption barrier, and qualification and certification as #5. In medical,
              aerospace, and automotive applications, buyers must document process controls, material traceability, and
              dimensional conformance—creating compliance overhead even for benchtop systems. ISO 13485 quality
              management and FDA 510(k) clearance requirements constrain clinical deployment speeds even when hardware
              is technically capable.

              Capital intensity and switching costs form the second constraint category. Professional desktop SLA/SLS
              systems require $3,500–$100,000 in upfront hardware spend plus recurring materials. Formlabs' proprietary
              resin cartridge system creates meaningful switching costs for buyers who have standardized workflows on
              Formlabs hardware, but it also creates hesitancy among buyers who prefer open-material platforms.
              BuiltIn's 2026 overview notes Formlabs uses pricing moves and selective cost discipline to defend margins,
              signaling the company is sensitive to price competition.

              The third constraint is market maturity signals. Wohlers Report 2026 explicitly describes the AM industry
              as entering maturity, with system hardware growing only 3.6% while services (outsourced printing) grew
              15.5%—suggesting some buyers are moving demand to service bureaus rather than committing to in-house
              printers. The 3DPI Executive Survey 2026 characterizes the competitive landscape as "Darwinian filtering,"
              with businesses that cannot meet institutional, economic, and operational screens failing to survive. For
              Formlabs, this means TAM expansion requires buyers to commit capital budgets that many are currently
              deferring to service-bureau outsourcing.
