  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Line Map
        blocks:
          - type: paragraph
            body: >-
              Formlabs offers a vertically integrated portfolio of professional 3D printers spanning two core additive
              manufacturing technologies. The SLA line centers on the Form 4 family — Form 4 (desktop), Form 4L
              (large-format), and Form 4B (biocompatible/dental) — all powered by the proprietary Low Force Display
              (LFD) print engine introduced in April 2024. The Form 4 achieves print speeds up to 100 mm/hour and
              average speeds of 40 mm/hour at 100 µm layer height, a 3–5× improvement over the predecessor Form 3+. Its
              build volume is 20.0 × 12.5 × 21.0 cm. The Form 4L scales the same LFD engine to a 35.3 × 19.6 × 35.0 cm
              build volume, powered by 145 LEDs versus 60 on the Form 4, and can complete full-volume builds in under 6
              hours. The Form 4B is the biocompatible variant engineered for dental and medical settings, with 37
              validated materials including FDA-cleared dental resins; Clove Dental, India's largest dental chain, uses
              10 Form 4B units to produce 50,000 aligners per month.

              On the SLS side, the Fuse 1+ 30W is the established benchtop platform with a 165 × 165 × 300 mm build
              volume and 30W ytterbium fiber laser. In June 2026, Formlabs launched the Fuse X1, a large-format
              industrial SLS system with a 330 × 330 × 565 mm build volume (7.5× larger than the Fuse 1+), starting at
              $84,999 — less than one-third the cost of comparable industrial SLS systems. The Fuse X1 delivers 3× the
              throughput of comparable industrial SLS or HP Multi Jet Fusion systems at roughly half the upfront cost,
              with production-quality parts in under 24 hours. Rounding out the portfolio, Form Now is Formlabs'
              on-demand 3D printing service enabling customers to order parts — including Fuse X1 parts — without owning
              hardware.
