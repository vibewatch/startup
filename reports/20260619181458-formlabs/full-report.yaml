            body: >-
              The replacement of long-tenured director Carl Bass (Autodesk era) with Rob Willett (former Cognex CEO,
              public-company industrial tech veteran) in February 2026 is a textbook governance change for companies
              preparing to list. Willett's direct experience with Sarbanes-Oxley, earnings cycles, capital allocation
              discipline, and investor relations at an industrial hardware company is precisely what Formlabs needs for
              a potential IPO. The CEO's own stated preference to go public "when ready" combined with a 5-year-old $2B
              valuation and early investor liquidity pressure makes a 2026–2027 listing timeline plausible.
