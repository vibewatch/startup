      - number: '4.6'
        title: Public Traction Metrics vs. Private Data Gaps
        blocks:
          - type: paragraph
            body: >-
              The June 2026 Fuse X1 launch press release marked the first time Formlabs publicly disclosed financial
              metrics: annual revenue exceeding $250 million in 2025 and a free cash flow margin above 10% after more
              than two years of profitability. These disclosures are company-stated and unaudited. By contrast, a wide
              array of metrics critical to underwriting remain either entirely undisclosed or estimable only from
              third-party inference.


              Key metrics confirmed: (1) revenue >$250M in 2025 (company-stated), (2) FCF margin >10% (company-stated),
              (3) 130,000+ printers sold globally (company-stated), (4) 500M+ parts printed (company-stated), (5) Fuse
              SLS 25%+ YoY unit growth Q4 2025, (6) NPS of 60 for Form 4/4L, (7) $254M total equity raised, (8) $2B
              valuation (last set May 2021).


              Key metrics unavailable: (1) revenue breakdown hardware vs. consumables vs. services, (2) gross margin by
              segment or blended, (3) cash and cash equivalents on hand, (4) monthly burn rate, (5) runway in months,
              (6) net revenue retention, (7) customer count by segment, (8) customer acquisition cost, (9) geographic
              revenue split, (10) debt/credit facility terms, (11) revenue growth rate (2024 vs. 2025), (12) use of
              proceeds from 2021 Series E.


              The gap between the disclosed and unavailable metrics is unusually wide for a company at $250M+ revenue.
              This is typical of private companies but creates real diligence risk: a buyer or investor cannot
              independently verify the revenue quality, margin sustainability, or capital efficiency without accessing
              the data room. Third-party revenue databases such as Latka and PitchBook carry widely divergent Formlabs
              revenue estimates ($200M–$750M range), underscoring the unreliability of external inference.
