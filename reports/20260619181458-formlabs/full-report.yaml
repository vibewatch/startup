      - number: '1.3'
        title: Capital Structure and Investors
        blocks:
          - type: paragraph
            body: >-
              Formlabs has raised approximately $254 million in total venture funding across multiple rounds since
              founding. The company's funding trajectory spans a $19 million Series A in October 2013 led by DFJ Growth
              (with Pitango Venture Capital and Innovation Endeavors), a $35 million Series B in August 2016 led by
              Foundry Group (with a strategic co-investment from Autodesk), a $30 million Series C in April 2018 led by
              Tyche Partners (with Shenzhen Capital Group, a municipally owned Chinese venture firm), and a $15 million
              round from New Enterprise Associates in August 2018 that crossed the $1 billion valuation threshold.

              The most significant financing event was a $150 million Series E in May 2021 led by SoftBank Vision Fund
              2, which doubled the company's valuation to $2 billion. Deep Nishar (then SoftBank Investment Advisers,
              now General Catalyst) joined the board following this round. As of June 2026, no subsequent funding round
              has been publicly disclosed, leaving the $2 billion valuation as the most recent known figure — now five
              years old and therefore subject to material uncertainty given market conditions in additive manufacturing.

              Notable early angel investors included Mitch Kapor (Kapor Capital), Joi Ito (then MIT Media Lab director),
              and Eric Schmidt's Innovation Endeavors. J.P. Morgan served as placement agent on the Series E. Formlabs'
              capital structure is not fully disclosed; details on secondary transactions, preferred stock terms,
              liquidation preferences, anti-dilution rights, and management equity ownership are private. The absence of
              disclosed debt financing suggests the company has relied on equity and cash-flow from operations since
              achieving profitability.
