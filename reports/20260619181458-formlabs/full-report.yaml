      - number: '2.4'
        title: Growth Drivers
        blocks:
          - type: paragraph
            body: >-
              Four primary growth drivers are expanding Formlabs' serviceable market in 2026. First, the structural
              shift from prototyping to end-use part production is accelerating, especially in SLS: Formlabs reports
              that Fuse series unit sales grew more than 25% year-over-year in Q4 2025, driven by factories adopting
              SLS-printed nylon parts to replace machined tooling. This represents a qualitatively new revenue pool, as
              production applications require larger part volumes, more consumable spend, and higher fleet density.

              Second, the dental and healthcare verticals are structurally growing markets. Digital dentistry
              adoption—intraoral scanners, CAD/CAM workflows, and chairside printing of aligners, crowns, and surgical
              guides—is converging into a same-day production paradigm that directly benefits Formlabs' dental resin
              portfolio. Mordor Intelligence and MarketsandMarkets both project 15–20% CAGRs for dental 3D printing
              through 2031, and FDA regulatory pathways for Class I and Class II biocompatible photopolymer devices are
              well-established, enabling formal clinical procurement.

              Third, declining per-unit materials costs and expanded material libraries—45+ resins and SLS powders—are
              broadening addressable applications within each vertical. Engineering-grade resins (Rigid 10K, Tough
              2000), elastic (Flexible 80A), and FDA-cleared dental resins are each unlocking distinct application
              sub-segments that previously required different vendors or outsourcing.

              Fourth, the broader AM services growth rate (15.5% in 2025, vs. hardware's 3.6%) and Asia-Pacific regional
              growth (19.8%) signal both expanding global installed base and increasing utilization of that base. While
              Chinese competitors are disrupting the low-cost FDM market, professional-grade SLA and SLS remain
              differentiated by materials qualification and ecosystem integration, preserving Formlabs' addressable
              market from commodity-tier pressure.
