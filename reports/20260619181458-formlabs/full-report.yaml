      - number: '8.4'
        title: Scenario Analysis — Bull, Base, and Bear Valuations
        blocks:
          - type: paragraph
            body: >-
              Three scenarios frame the Formlabs valuation range, all anchored to publicly disclosed inputs (>$250M
              revenue, >10% FCF margin) with conservative expansion assumptions. Estimates below are explicitly labeled
              as models, not disclosed company data, and are provided solely to frame entry-price discipline.

              In the base case, Formlabs' 2026 revenue is estimated at approximately $265–$275 million (8–10% YoY growth
              from the disclosed $250M+ 2025 figure, consistent with Q4 2025 record results). Applying a 3.0x EV/Revenue
              multiple — a premium to AM peers reflecting Formlabs' profitability, consumables mix, and market
              leadership — implies an enterprise value of approximately $795–$825 million. At 30x FCF on an estimated
              $27–$28 million in FCF (>10% of $270M), the implied EV is approximately $800–$840 million. The base case
              converges at approximately $800–$850 million, broadly consistent with the secondary market's ~$727M signal
              and a moderate premium to reflect growth trajectory.

              In the bull case, 2026 revenue reaches $285–$295 million (14–18% growth, consistent with Fuse SLS
              segment's 25%+ Q4 2025 run rate), FCF margin expands toward 14–15% on operating leverage, and an IPO or
              acquisition premium lifts the exit multiple to 4.5–5x EV/Revenue or 40x FCF. This implies an EV of
              $1.28–$1.48 billion — still materially below the $2B primary mark but representing 75–105% upside to the
              secondary-market clearing price.

              In the bear case, multiple compression aligns Formlabs with its public AM peers at 1.5x EV/Revenue on $250
              million revenue — implying an enterprise value of approximately $375 million. This scenario is triggered
              by a combination of revenue growth stalling below 5%, tariff escalation squeezing hardware margins, IPO
              market conditions deteriorating (no AI/infrastructure premium to capture), or an aggressive entry by a
              well-funded industrial competitor displacing SLS market share. At these levels, investors entering at the
              $2B primary mark would face a loss exceeding 80%.

              The probability-weighted central estimate across these three scenarios, assigning roughly 15% probability
              to the bull, 65% to the base, and 20% to the bear, yields an implied EV of approximately $690–$740 million
              — consistent with the secondary market discount and supporting a Track/Research-More stance rather than a
              Buy at the 2021 primary valuation.
            claimRefs:
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
