      - number: '1.2'
        title: Leadership, Board, and Governance
        blocks:
          - type: paragraph
            body: >-
              Formlabs is led by co-founder and CEO Maxim Lobovsky, who has served as the company's chief executive
              since founding. Lobovsky is the primary technical and commercial spokesperson and holds a strong
              founder-market fit stemming from his MIT Media Lab and Fab@Home background. Natan Linder, another
              co-founder, serves as Chairman of the Board; he also co-founded Tulip, a manufacturing operations
              platform. David Cranor, the third co-founder, has a lower public profile post-founding but remains
              associated with the company's technical origins.

              The board of directors features a mix of investor representatives and independent operators. Jeff Immelt
              (former Chairman and CEO of General Electric) joined the board in August 2018 following the NEA funding
              round. Deep Nishar (Managing Partner, SoftBank Investment Advisers, later General Catalyst) joined as a
              director after the 2021 Series E, with Kirthiga Reddy serving as a board observer for SoftBank. Brad Feld
              (Foundry Group) and Barry Schuler (DFJ Growth) represent earlier institutional investors. In February
              2026, Rob Willett — the former Chief Executive Officer of Cognex Corporation, the machine-vision
              automation company that has traded publicly since 1989 — was appointed to the board. His appointment
              coincided with Carl Bass (former Autodesk CEO), a board member since 2017, stepping down. Industry
              observers have characterized the governance refresh as consistent with preparation for a public listing,
              noting Willett's 18 years of experience operating a publicly traded industrial hardware company through
              earnings cycles.

              Key-person risk is concentrated around Lobovsky: he is the sole named CEO, the primary product visionary
              cited in all major announcements, and has held the top role continuously since founding. The addition of
              experienced industrial operator Willett partially mitigates governance concentration, but succession
              planning and leadership depth below the co-founder layer are not publicly disclosed.
