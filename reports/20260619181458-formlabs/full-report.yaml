  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Business Architecture
        blocks:
          - type: paragraph
            body: >-
              Formlabs generates revenue through three interlocking streams that mirror the classic industrial hardware
              platform: hardware sales (one-time printer and peripheral purchases), consumables (recurring proprietary
              resins and powders required for every print job), and services (the newly launched Form Now on-demand
              print bureau). The hardware stream drives installed-base growth, which in turn fuels recurring consumables
              revenue — the economic engine of the business. This razor-and-blade architecture is explicitly vertically
              integrated: Formlabs designs its own printers, formulates its own resins and powders (augmented by the
              2019 Spectra acquisition), and controls the software layer (PreForm, Dashboard) that manages print
              workflows and monitors system performance.


              The consumables stream is the financial core of the model. Every printer sold creates a captive, ongoing
              demand for proprietary materials: SLA printers require Formlabs-certified resin cartridges and replacement
              Form tanks, while SLS printers consume Nylon 11 or Nylon 12 powder with each build. Higher-intensity use
              cases — production runs versus occasional prototyping — generate materially higher consumables spend per
              installed unit. The company's June 2026 Fuse X1 press release disclosed that customers have printed more
              than 500 million parts on Formlabs printers and materials, signaling deep utilization of the installed
              base rather than shelf-ware adoption. Fuse SLS unit sales grew over 25% year over year in Q4 2025, the
              fastest-growing segment and the highest-ASP segment, which is likely the primary driver behind record Q4
              2025 revenue and materials milestones.


              The Form Now service bureau, launched for US customers in 2026, adds a third revenue stream that is
              directly additive-manufacturing-as-a-service: customers upload STL/OBJ files, select from 15+ Formlabs
              materials, and receive parts in as few as two days starting at approximately $20 per part. At this early
              stage, Form Now is a margin and capacity-utilization play — Formlabs can deploy excess printer capacity
              internally at higher-than-wholesale returns while introducing potential future hardware buyers to the
              Formlabs ecosystem through direct product experience. The revenue contribution of Form Now is not
              disclosed.
