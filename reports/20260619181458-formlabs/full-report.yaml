      - number: '3.5'
        title: Desktop SLS Competition and Formlabs' Dominant Position
        blocks:
          - type: paragraph
            body: >-
              In the desktop and benchtop SLS segment, Formlabs has achieved structural dominance. The company's Chief
              Revenue Officer cited in a public LinkedIn post (September 2025) that approximately 55% of all SLS
              printers sold globally are Fuse systems, and that figure is rising. The competitive graveyard is
              instructive: Sintratec, a Swiss low-cost SLS startup, exited the market in 2025 unable to compete with
              Fuse economics. Sinterit, the remaining desktop SLS alternative (Lisa X, SUZY), shows signs of commercial
              stress and serves a niche of R&D labs favoring open powder parameters and nitrogen-chamber printing,
              rather than the higher-throughput production use cases where Fuse has its strongest ROI. EOS, the dominant
              industrial SLS vendor (P 396 and P3 systems), prices entry-level SLS above $300,000 — roughly 10x the Fuse
              1+ 30W starter package at $29,499. Formlabs closes this gap with a "fleet vs one machine" argument: a
              three-unit Fuse 1+ fleet ($88,000–$170,000 fully configured) can match a single EOS machine's throughput
              at lower total cost and with geographic distribution benefits.

              The June 2026 launch of Fuse X1 ($84,999) marks Formlabs' step into large-format industrial SLS, directly
              targeting the EOS P 396, HP MJF 5200, and 3D Systems sPro/SLS lines priced at $200,000–$500,000+. Fuse X1
              promises 330 × 330 × 565 mm build volume, 50% lower cost per part, 30%+ packing density (versus MJF's
              10–15%), AI-powered Print Intelligence failure prevention, and single-phase power installation in one hour
              — enabling office and factory floor deployment without facility upgrades. Early access customers Tesla,
              Radio Flyer, and Autotiv printed 30,000+ parts in under four months. If Fuse X1 delivers on claims at
              scale, it could commoditize the $150K–$300K industrial SLS price band, accelerating Formlabs' competitive
              displacement of entrenched industrial OEMs.
