      - number: '2.2'
        title: Market Sizing — TAM, SAM, and Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              The global additive manufacturing ecosystem reached $24.2 billion in revenue in 2025 according to Wohlers
              Report 2026, the most widely cited annual AM industry survey, representing 10.9% year-over-year growth.
              This figure covers the full product and services stack: AM printing services (48%), system hardware sales
              and servicing (26%), materials (20%), and software (6%). Multiple commercial market research firms produce
              estimates ranging from $16 billion (MarketsandMarkets 2025 hardware-weighted) to $34 billion (Precedence
              Research 2026 inclusive projection); the divergence reflects scope differences rather than fundamentally
              different observations of the same market.

              The segments most relevant to Formlabs—professional desktop/benchtop SLA and SLS systems priced below
              $100,000—are not separated at this granularity by any public analyst firm. An informed SAM estimate for
              this sub-market, anchored on the industrial printer share (~77% of market by revenue according to
              Precedence Research), the professional desktop fraction of industrial, and global hardware-plus-materials
              revenue, suggests a professional desktop AM SAM of roughly $3–4 billion in 2025. Formlabs' self-reported
              revenue of over $250 million implies it has captured a meaningful share of this segment. The professional
              dental sub-market represents a particularly well-defined and rapidly expanding sub-segment, with multiple
              analysts valuing the global dental 3D printing market at $4–6 billion in 2026 and projecting 16–26% CAGRs
              through 2031–2035.

              A critical caution: analyst TAM figures for AM are notorious for scope divergence. Wohlers uses a
              primary-data survey methodology based on 1,200+ responses from 570 companies; commercial research firms
              use top-down market models. Wohlers' $24.2B should be treated as the most reliable upper-bound measure of
              the industry-wide ecosystem, while sub-market segmentation figures from commercial firms carry higher
              uncertainty and should be used with explicit confidence caveats.
