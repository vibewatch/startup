      - number: '3.4'
        title: Dental Vertical Specialists — SprintRay and EnvisionTEC
        blocks:
          - type: paragraph
            body: >-
              SprintRay is the most direct feature-level competitor to Formlabs Form 4B in the dental segment. The
              SprintRay Pro 2 uses patent-pending Optical Panel technology with 385 nm UV-A light at 35 µm XY
              resolution, supporting 15+ validated dental workflows from night guards to hybrid dentures. Priced at
              approximately $10,995 standalone (or ~$20,000 for a complete ecosystem bundle including post-processing
              hardware), Pro 2 is 43% more expensive than the Form 4B base unit, but includes a higher-throughput DLP
              engine and SprintRay's AI-assisted PrintOS cloud software. Formlabs counters on price, service cost (cited
              as 26% lower first-year service cost than SprintRay Midas), and print speed: Form 4B prints 11 clear
              aligner models in 9 minutes versus 44 minutes for a benchmark DLP, an advantage Formlabs uses prominently
              in head-to-head marketing.

              SprintRay's 2025/2026 acquisition of EnvisionTEC, a pioneer in DLP dental printing (Micro DLP systems,
              validated materials, large installed dental lab base), creates a combined entity with broader material IP,
              extended global reach, and deeper lab distribution to rival Dentsply Sirona and Straumann. This
              consolidation signals that the dental segment is entering a phase where platform breadth, validated
              material libraries, and service/support infrastructure become key competitive weapons — areas where
              Formlabs' ecosystem advantage is directly tested. The combined SprintRay/EnvisionTEC portfolio's range of
              indications, established dental distributor channels, and potential cross-selling to EnvisionTEC's
              installed base represents a step-up in competitive intensity for Formlabs' largest vertical.
