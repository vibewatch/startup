      - number: '6.6'
        title: Limitations, Adverse Evidence, and Churn Risk
        blocks:
          - type: paragraph
            body: >-
              Public review and complaint data paint a mixed picture on customer satisfaction. Formlabs holds
              approximately 2.8 out of 5 on Trustpilot based on a small review sample, with complaints concentrated on
              refund policies (which prohibit returns on opened/used equipment), slow customer support responsiveness,
              and product quality issues in edge cases. Revdex complaints confirm a strict no-return policy for
              open/used printers, which creates dissatisfaction among buyers who experience buyer's remorse or early
              technical difficulties. The Institute of Digital Dentistry's extended clinical review of the Form 4B found
              that some materials available on the legacy Form 3B+ — including Dental SG, IBT, Permanent Crown, Soft
              Tissue, and Temporary CB resins — are not supported on the Form 4B, creating a compatibility gap that
              could delay or complicate upgrades for dental professionals relying on those formulations. Open Material
              Mode, while a positive step, was initially absent at Form 4B launch and required a firmware update.
              Formlabs' Trustpilot rating is depressed partly by self-selection (dissatisfied buyers disproportionately
              leave reviews), but it is materially below G2's PreForm software rating of 4.8/5 from professional users.
              Concentration risk exists in the dental vertical, which is believed to be a disproportionate share of
              revenue given the dedicated dental product line, branded subdomain, and named distribution partnership —
              though Formlabs does not disclose segment revenue. Broader equipment churn is limited by high switching
              costs but may accelerate if open-material competitors (SprintRay, Asiga) close the dental resin
              compatibility gap or if legacy customers resist periodic hardware refreshes. No customer-disclosed
              defections from Formlabs to a competitor have been publicly documented in 2026.
            claimRefs:
              - CU035
              - CU036
              - CU037
              - CU033
