      - number: '6.5'
        title: Retention, Switching Costs, and Expansion Dynamics
        blocks:
          - type: paragraph
            body: >-
              Formlabs has not publicly disclosed net revenue retention (NRR) or gross revenue retention (GRR) figures,
              which limits formal durability assessment. However, several structural and behavioral signals point to
              high retention. The proprietary resin ecosystem — 45+ validated materials with authentication logic and
              validated print profiles in PreForm — creates deep workflow integration. Switching printers means
              re-qualifying materials, retraining operators, and potentially recertifying workflows (particularly
              significant in regulated dental and medical settings). The Form 4-generation tank rated for ~75,000 layers
              (versus material-specific tanks with limited life on older Form 3+) actually reduces replacement friction
              while maintaining the consumable relationship. Behavioral expansion is well documented: Clove Dental
              upgraded from Form 3B to Form 4B and scaled to 10 printers in under two years; Eaton systematically
              standardized on Formlabs SLA and SLS across its 209-site global manufacturing network. Formlabs' 2025 Year
              in Review and Q4 2025 reporting confirms that usage intensity (parts printed per printer per period) has
              increased over time, consistent with deepening deployment rather than one-time purchases. Expansion
              pathways include: fleet scaling (more printers of the same line), cross-sell (dental practices adding Form
              4BL for high-volume production), and materials expansion as customers access new applications. The dental
              channel also benefits from the Henry Schein relationship, which provides consultative selling that can
              expose customers to additional Formlabs capabilities. No formal cohort survival data has been published;
              estimated annual retention rates for the dental segment (high integration, regulated materials) and
              manufacturing segment (tooling workflow dependency) are modeled as above 85% in years 1-3 based on capital
              equipment industry benchmarks, but these figures require direct disclosure to verify.
