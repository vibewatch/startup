      - number: '5.3'
        title: Materials Ecosystem and Open Platform Strategy
        blocks:
          - type: paragraph
            body: >-
              Formlabs offers 45+ validated materials across SLA resins and SLS powders, making materials breadth a
              central competitive differentiator. SLA resin categories span engineering grades (Tough 2000, Rigid 10K,
              Durable), dental and medical (8+ FDA-cleared and biocompatible resins), castable (Castable Wax 40),
              flexible and elastic (Flexible 80A, Elastic 50A), ceramic, flame retardant, silicone, and general-purpose
              (Grey, White, Clear, Draft). SLS powders for the Fuse ecosystem include Nylon 12 (tensile strength 50 MPa,
              modulus 1850 MPa), Nylon 11 (elongation at break up to 40%, tensile strength 49 MPa), Nylon 12 GF
              (glass-filled, enhanced thermal stability), and TPU 90A (flexible, Shore 90A hardness).

              Form 4 and Fuse 1+ support Open Material Mode (OMM), a paid unlock that enables users to print with
              certified third-party resins or SLS powders. This partially offsets proprietary lock-in criticism, but the
              unlock cost is not publicly disclosed and certification of third-party materials is incomplete for many
              specialty applications. The materials business follows a razor-and-blades model: hardware is a one-time
              purchase while resins and SLS powders generate recurring revenue. The Fuse X1 launches with Nylon 12 only;
              Nylon 11 settings are expected by year-end 2026, and Nylon 12 GF and TPU 90A are targeted for Summer 2027
              — creating a critical materials gap in the near term for applications requiring high-performance
              thermoplastics.
            claimRefs:
