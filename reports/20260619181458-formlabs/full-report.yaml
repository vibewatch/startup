      - number: '1.5'
        title: Milestones and Adverse Events
        blocks:
          - type: paragraph
            body: >-
              Formlabs' history spans a number of pivotal milestones from its founding through to the 2026 Fuse X1
              launch. The October 2012 Kickstarter campaign for the Form 1 raised $2,945,885 from 2,068 backers,
              validating professional desktop SLA as a market category and establishing the company's brand. A
              significant early adverse event was the November 2012 lawsuit filed by 3D Systems, which claimed Formlabs
              infringed patents covering the stereolithography printing process; the lawsuit was settled in December
              2014, with Formlabs agreeing to pay an 8% royalty on product sales. This established a recurring financial
              burden and introduced IP exposure as a structural feature of the company's early operating profile.

              The company's financing trajectory — Series A (2013), B (2016), C (2018), NEA round (2018), and Series E
              (2021) — tracks its expansion from desktop printing specialist to multi-technology manufacturing platform.
              Key product launches include the Fuse 1 SLS printer (first benchtop SLS globally), Form 4 (April 2024,
              major performance leap), and Fuse X1 (June 2026, industrial-scale SLS). The July 2025 acquisition of
              Micronics (Wisconsin-based SLS startup) was the company's first disclosed acquisition, extending its SLS
              technology and team. The February 2026 board refresh (Willett in, Bass out) is the most prominent
              governance event since the 2021 Series E and has prompted public speculation about IPO preparation, though
              Formlabs has not confirmed any public listing plans. CEO Lobovsky stated in 2021 that the company would go
              public only when "really ready to be an excellent public company."

              No material regulatory enforcement actions, product recalls, or data breaches involving Formlabs have been
              identified in public record as of June 2026. The principal adverse items of record are the historical 3D
              Systems patent lawsuit (settled) and market criticism of the broader SPAC-driven 3D printing industry
              collapse (Desktop Metal, Markforged, Velo3D), which Formlabs navigated by staying private and profitable.
