figures:
  - id: FP001
    title: Competitive Positioning Map — Professional AM Vendors (Scale vs Accessibility)
    type: quadrant
    layout: wide
    summary: >-
      Formlabs occupies the high-accessibility / mid-breadth quadrant, differentiated from industrial OEMs
      (Stratasys, 3D Systems, EOS) on accessibility and from dental specialists (Carbon, SprintRay) on
      product breadth.
    approximationNotes: >-
      X-axis (Product breadth 0–10): ordinal analyst scoring based on number of distinct printing
      technologies, markets served, and product price bands covered by each vendor's current portfolio.
      Y-axis (Accessibility 0–10): inverse of typical entry system price and installation complexity;
