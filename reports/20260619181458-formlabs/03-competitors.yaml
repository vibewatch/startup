callouts:
  - calloutType: strength
    title: Structural SLS Market Leadership
    body: >-
      With ~55% of global SLS printer units and two of three low-cost SLS competitors exiting or stressed
      by mid-2026, Formlabs has achieved near-monopoly positioning in the sub-$50K SLS segment. The June
      2026 Fuse X1 launch extends this position into the $85K–$200K industrial band previously owned by
      EOS, 3D Systems, and HP.
    claimRefs:
      - CP027
      - CP028
      - CP031

  - calloutType: risk
    title: Enterprise Software Gap Enables Incumbent Upsell
    body: >-
      Formlabs' fleet management Dashboard is insufficient for 100+ unit deployments per independent
      analysis, creating an opening for Stratasys (GrabCAD Print) and 3D Systems to retain or win
      large enterprise accounts that Formlabs cannot serve at scale. This gap is material because
      enterprise accounts generate disproportionate recurring consumable revenue.
    claimRefs:
      - CP038
      - CP007

  - calloutType: risk
    title: SprintRay/EnvisionTEC Consolidation Strengthens Dental Rival
    body: >-
      SprintRay's acquisition of EnvisionTEC creates a combined dental platform with broader validated
      material IP, established dental distributor relationships, and a large existing installed base
      that will be cross-sold SprintRay hardware. This is a material competitive event for Formlabs'
      largest vertical.
    claimRefs:
      - CP021
      - CP023

