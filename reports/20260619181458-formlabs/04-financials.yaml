  - id: unit-economics-and-working-capital
    title: Unit Economics and Working Capital Intensity
    body: >-
      Formlabs' unit economics are driven by the interplay between hardware acquisition cost (the
      "razor") and the stream of consumables purchases that follow (the "blades"). Each printer
      sale anchors an ongoing demand relationship: a Form 4 user purchasing standard resin at
      $79/L and printing one liter per month generates approximately $948 in annual consumables
      revenue per unit, rising to $1,788 if they use engineering resins at $149/L. A Fuse 1+ 30W
      customer consuming 6 kg of Nylon 12 powder per month at $100/kg generates $7,200 in annual
      powder revenue, potentially exceeding the $24,649 printer price within the first 3–4 years.
      High-utilization industrial and dental customers will have materially higher per-unit CLV.


      The dental segment represents the highest unit-economics tier: Form 4B pricing starts at
      $6,299 and dental resins range from $80 to $850 per liter depending on indication, with
      clinical production labs potentially consuming 10–20+ liters per month. Dental materials
      revenue per installed unit can dwarf standard SLA consumables economics. The NPS of 60 for
      Form 4 (company-reported) and sustained 2+ years of profitability are consistent with high
      retention and repeat purchase rates from the installed base.


      Working capital intensity for Formlabs is elevated relative to pure-software businesses. The
      company must carry: (1) finished goods inventory for printers and peripherals across multiple
      SKUs and regions, (2) raw material and finished goods inventory for 45+ proprietary materials,
      (3) accounts receivable from enterprise and channel sales with typical net-30–60 payment
      terms, and (4) warranty reserves for hardware products. The global distribution network
      (offices in Somerville, Berlin, Tokyo, Shanghai, Singapore, Budapest, Raleigh) implies working
      capital cycles across multiple currencies and jurisdictions. With $250M+ revenue, working
      capital requirements at typical hardware-company ratios (15–20% of revenue) imply $35–50M
      in working capital at normal operating scale. This is consistent with the ~$254M raised
      historically being partly deployed to fund the working capital base.
