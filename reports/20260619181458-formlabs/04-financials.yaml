  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue mix
      missingEvidence: Revenue breakdown by segment (hardware, consumables, services) with gross margin by line
      whyItMatters: >-
        Without segment-level revenue and margin data, the valuation case cannot be independently
        underwritten. The relative weight of recurring consumables vs. one-time hardware revenue
        determines whether a hardware or SaaS-style multiple is appropriate.
      diligencePath: >-
        Request segmented P&L and COGS breakdown in data room; request historical revenue by
        product line for FY2023, FY2024, and FY2025.
      relatedQuestionRefs:
        - QI001
        - QI022

    - type: private-evidence-only
      severity: blocking
      topic: gross margin
      missingEvidence: Audited or unaudited gross margin by segment; blended gross margin
      whyItMatters: >-
        Gross margin determines valuation multiple applicability and operating leverage. At $250M+
        revenue, a 10 percentage-point difference in gross margin implies ~$25M more or less gross
        profit annually, materially affecting EBITDA and capital requirements.
      diligencePath: >-
        Request financial statements or management accounts showing gross margin; ask for a
        reconciliation of FCF to GAAP operating income to understand stock-based comp and
        depreciation treatment.
      relatedQuestionRefs:
        - QI008
        - QI022
      relatedTableRefs:
        - TI003

    - type: private-evidence-only
      severity: material
      topic: revenue growth rate
      missingEvidence: FY2024 revenue baseline to calculate FY2025 YoY growth rate
      whyItMatters: >-
        The disclosed $250M+ figure is a floor for 2025; without the 2024 baseline the growth
        rate cannot be calculated, making it impossible to assess whether the business is
        accelerating or decelerating.
      diligencePath: >-
        Request FY2024 revenue from management; cross-reference with any Series E use-of-proceeds
        disclosures or investor updates.
      relatedQuestionRefs:
        - QI024

    - type: private-evidence-only
      severity: material
      topic: capital adequacy
      missingEvidence: Cash position, monthly operating cash flow, capex, and debt/credit facility terms
      whyItMatters: >-
        FCF positivity is asserted but the definition of FCF (pre or post capex, stock-based comp
        treatment) is unclear. Cash on hand and any credit facilities determine true runway and
        the company's options if revenue slows.
      diligencePath: >-
        Request balance sheet, cash flow statement, and any existing credit agreement terms;
        confirm there are no undisclosed SAFEs, convertible notes, or earn-outs from Spectra
        or Micronics acquisitions.
      relatedQuestionRefs:
        - QI010
        - QI027
      relatedTableRefs:
        - TI004

    - type: private-evidence-only
      severity: material
      topic: net revenue retention
      missingEvidence: Annual consumables spend per installed-base cohort; churn or upgrade rates
      whyItMatters: >-
        NRR is the single most important metric for validating the razor-and-blade CLV thesis.
        A NRR below 100% would indicate customers are reducing usage over time, while 120%+
        would confirm significant account expansion consistent with a high-quality recurring
        revenue model.
      diligencePath: >-
        Request cohort analysis of materials revenue by year of printer purchase; or net dollar
        retention calculation from billing data.
      relatedQuestionRefs:
        - QI001
      relatedTableRefs:
        - TI003

    - type: conflicting-data
      severity: minor
      topic: revenue estimates
      missingEvidence: >-
        Third-party revenue databases (Latka, PitchBook) carry wildly divergent Formlabs revenue
        estimates ($200M–$750M range), with Latka citing $750M ARR and Expanded Ramblings citing
        lower figures. The company-disclosed floor of $250M+ is the only reliable anchor.
      whyItMatters: >-
        The wide range of external estimates (3.5× spread) underscores the unreliability of
        inference-based revenue data for private companies; it signals that any third-party
        financial database number for Formlabs should be treated with low confidence.
      diligencePath: >-
        Rely only on the company-disclosed $250M+ figure; cross-reference with any audited
        third-party estimates available in a data room scenario.
      relatedQuestionRefs:
        - QI005

    - type: private-evidence-only
      severity: minor
      topic: headcount trend
      missingEvidence: >-
        Verified Formlabs headcount for FY2024 and FY2025 with a year-over-year comparison;
        available third-party data (approximately 750+ employees as of 2026) does not establish
        a directional trend or reconcile a reported 2024 restructuring with current staffing levels.
      whyItMatters: >-
        Headcount trajectory is a proxy for operating expense growth and organizational health.
        A restructuring in 2024 followed by rapid rehiring would indicate a different cost
        structure than stable, organic headcount growth.
      diligencePath: >-
        Request verified headcount by function and geography for FY2023, FY2024, and FY2025;
        ask for details on any RIF events, severance costs, and subsequent hiring to understand
        the net change in workforce and annual personnel cost trajectory.
      relatedQuestionRefs:
        - QI012

    - type: private-evidence-only
      severity: minor
      topic: Form Now service economics
      missingEvidence: >-
        Unit economics, gross margin contribution, order volume, and capacity utilization for
        the Form Now on-demand 3D printing service bureau; currently only list pricing (~$20/part
        starting) is publicly available; no margin or scale data is disclosed.
      whyItMatters: >-
        Form Now is Formlabs' third revenue stream, launched in 2026. Its margin profile is
        unknown — the service could either dilute blended gross margin (if run at cost for
        retention) or enhance it (if priced to yield bureau-level margins above 50%).
      diligencePath: >-
        Request Form Now P&L including cost per job (machine time, materials, labor, logistics),
        average selling price, order volume, and whether the business is run as a profit center
        or as an installed-base retention and customer-acquisition tool.
      relatedQuestionRefs:
        - QI019

