  - id: distribution-channel
    title: Sales, Distribution, and Channel Model
    body: >-
      Formlabs operates a hybrid distribution model combining direct sales with a global network of
      hundreds of authorized resellers and specialized distribution partners. The reseller finder on
      formlabs.com covers partners across Australia, Europe, Asia-Pacific, North America, and more,
      filterable by region, product line, and industry sector. For the dental vertical in North America,
      Formlabs made a decisive channel shift in February 2025: all Formlabs Dental products in the USA
      and Canada are now only available for purchase through partner resellers, with Henry Schein named
      as the preferred distributor. Henry Schein brings approximately 26,000 team members and a global
      network reaching 1 million+ healthcare customers, providing Formlabs direct access to dental labs
      and practices it could not efficiently reach through direct sales. This relationship builds on a
      prior history dating to 2017, when Henry Schein's Zahn Dental division first began distributing
      Formlabs dental products. The dental partnership was publicly announced February 20, 2025, with
      explicit endorsement from Henry Schein Chairman and CEO Stanley M. Bergman. Beyond dental, new
      engineering resellers continue to be added: GSC (an Ellison Technologies Company) announced a
      Formlabs reseller partnership on April 28, 2026, targeting the broader US manufacturing and
      engineering market. Formlabs also operates a Channel Partner Portal (partners.formlabs.com) for
      managing partner resources and training. While direct customer service (including dental service
      plans) is retained by Formlabs even for partner-sold products, the channel model for dental
      shifts acquisition economics to distributor margin in exchange for reach and customer trust.
    claimRefs:
      - CU009
      - CU010
      - CU011
      - CU012
