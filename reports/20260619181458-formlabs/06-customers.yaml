figures:
  - id: FU001
    title: Formlabs Customer Journey Map — Segments, Adoption Surfaces, and Expansion Loops
    type: journey-map
    layout: wide
    summary: >-
      Illustrates how buyers in Formlabs' key verticals discover, evaluate, deploy, and expand usage
      across the hardware-materials-software ecosystem.
    data:
      nodes:
        - id: j1
          label: Awareness / Discovery
          detail: >-
            Engineers, dental professionals, and product designers discover Formlabs via trade press,
            industry events (dental expos, engineering tradeshows), reseller demos, Form Now part orders,
            and peer recommendations. Defense/industrial buyers often enter via reseller channel (GSC, etc.).
          tone: neutral
        - id: j2
          label: Evaluation / Sample Request
          detail: >-
            Formlabs offers free sample parts and ROI calculators on its dental and engineering websites.
            Dental resellers (Henry Schein) provide in-person demos. Engineering buyers evaluate via
            PreForm trial and benchmarking against outsourced part costs.
          tone: positive
        - id: j3
          label: First Printer Purchase
          detail: >-
            Form 4 ($4,499), Form 4B ($6,299), or Fuse 1+ 30W ($18,499) entry point. Dental purchases
            routed through Henry Schein (North America) or authorized dental resellers. Engineering
            purchases through general resellers or Formlabs direct. One-year warranty included.
          tone: positive
        - id: j4
          label: Active Production Deployment
          detail: >-
            PreForm software, Dashboard fleet management, and proprietary resins deepen workflow
            integration. Material spend begins. Dental practices add resins; manufacturers add
            post-processing (Fuse Blast, Form Cure). Usage intensity increases.
          tone: positive
        - id: j5
          label: Fleet Expansion
          detail: >-
            High-throughput users scale to multi-printer farms (Clove Dental: 10× Form 4Bs; Eaton:
            SLA + SLS across 209 sites). Large-format (Form 4L, Form 4BL) added for volume. Materials
            mix expands.
          tone: positive
        - id: j6
          label: Friction / Churn Risk
          detail: >-
            Material compatibility gaps on upgrade (Form 3B+ → Form 4B), strict no-return policy,
            and service complaints create dissatisfaction risk. Open-material competitors may attract
            price-sensitive buyers. Hardware generation transitions (Form 3→Form 4) require requalification
            of some dental workflows.
          tone: warning
    claimRefs:
      - CU005
      - CU028
      - CU032
      - CU033
      - CU037

