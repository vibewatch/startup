      - TU002
    figureRefs:
      - FU002

  - id: named-customer-proof
    title: Named Customer Case Studies
    body: >-
      Formlabs maintains a substantial library of named production deployments, spanning dental labs,
      automotive OEMs, industrial manufacturers, consumer goods firms, and technology companies.
      Clove Dental, India's largest dental clinic chain (550+ clinics, 2.5 million patients), is among
      the most compelling examples: using 10 Form 4B printers with custom PreForm Dental print profiles
      at 120-micron layer height, the company produces up to 2,000 dental model arches per shift, scaling
      from 2,000 to 50,000 aligners per month between 2024 and February 2026. Ford Motor Company's PD
      Merkenich Rapid Technology Center — responsible for all European passenger vehicle design — uses
      Form 4 (one of the first beta customers), Form 3L, and Fuse 1+ 30W to prototype components for the
      Electric Explorer SUV, including mirrors, charging ports, and dashboard parts, enabling same-day
      delivery to other facilities and compressing injection mold tooling timelines from months to weeks.
      Eaton Corporation deployed Fuse SLS printers across its Olean, NY manufacturing plant, replacing
      90% of machined Delrin fixtures and achieving full ROI in 6 months against a 9-month plan,
      reducing per-part fixture cost by more than 90% on key components. Raspberry Pi independently
      documented Formlabs as a production customer, noting the Form 4's use of Raspberry Pi Compute
      Module 4 and confirming industrial deployment across engineering, manufacturing, automotive,
      aerospace, and medical industries. ZapWizard, a single-operator specialty manufacturer, shipped
      3,600 products and paid off a Fuse 1 investment within 7 months. These case studies span
      production (Clove Dental, Eaton) and development (Ford) use cases, and include outcomes across
      lead time, cost, and throughput dimensions.
