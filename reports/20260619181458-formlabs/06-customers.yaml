  - id: FU004
    title: Estimated Customer Retention Cohort by Segment (Year 1–3)
    type: cohort
    layout: standard
    summary: >-
      Estimated annual hardware-to-materials reorder retention rates by customer segment, modeled
      from capital equipment industry benchmarks and Formlabs case study behavioral patterns.
      Formlabs does not publicly disclose NRR or GRR data; values are directional estimates only.
    approximationNotes: >-
      All values are analyst estimates derived from: (1) professional capital equipment industry
      benchmarks (medical device, laboratory instrument, and industrial machinery analogs showing
      80–95% annual retention for deeply integrated equipment); (2) observable fleet expansion
      patterns in Formlabs case studies (Clove Dental, Eaton); (3) absence of documented large-scale
      churn events in public sources through June 2026. Values have a high uncertainty band of ±10
      percentage points. Dental is modeled higher due to regulatory compliance, validated materials
      requirements, and Henry Schein service continuity. Formlabs has not disclosed NRR, GRR, or
      cohort data, and the actual figures may differ materially from these estimates.
