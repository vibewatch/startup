  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-metrics
      missingEvidence: >-
        Net revenue retention (NRR), gross revenue retention (GRR), and cohort-level churn data
        broken out by vertical and hardware generation.
      whyItMatters: >-
        Without NRR/GRR data, the durability of the razor-and-blades consumable revenue model
        cannot be formally assessed. High switching costs are inferred but not quantified.
      diligencePath: >-
        Request NRR and GRR disclosures in any investor or partner diligence session; ask for
        cohort data by hardware generation (Form 3 vs. Form 4) and vertical (dental vs. engineering).
      relatedQuestionRefs:
        - QU013

    - type: private-evidence-only
      severity: material
      topic: segment-revenue
      missingEvidence: >-
        Revenue breakdown by vertical (dental, engineering, manufacturing, education) and by
        product line (hardware, resins/powders, services).
      whyItMatters: >-
        Dental concentration risk cannot be properly assessed without segment revenue data.
        Henry Schein channel dependency may represent material risk if dental is a large
        share of total company revenue.
      diligencePath: >-
        Request a revenue breakdown by vertical and by product type (hardware vs. materials
        vs. services) in any diligence session.
      relatedTableRefs:
        - TU005

    - type: missing-source
      severity: minor
      topic: competitive-displacement
      missingEvidence: >-
        Any documented case of a named Formlabs customer switching to a competitor (SprintRay,
        Carbon, Stratasys, 3D Systems) in 2025 or 2026.
      whyItMatters: >-
        Absence of documented churn is consistent with high retention but does not prove it.
        Competitive displacement data would quantify actual churn rates.
      diligencePath: >-
        Survey dental lab associations, manufacturing forums, and G2/Capterra reviews for
        documented platform switches; request any win/loss data from Formlabs.
      relatedQuestionRefs:
        - QU018

    - type: enumeration-incomplete
      severity: minor
      topic: dental-reseller-network
      missingEvidence: >-
        A complete listing of Formlabs' authorized dental resellers in North America, Europe,
        and Asia-Pacific beyond Henry Schein, including geographic coverage and revenue share.
      whyItMatters: >-
        Henry Schein is named as the preferred North American distributor, but other dental
        resellers may exist globally. Channel breadth affects total dental reach assessment.
      diligencePath: >-
        Review the Formlabs partner finder for dental-specific partners; interview European
        dental distributors and associations.
      relatedTableRefs:
        - TU005

    - type: missing-source
      severity: minor
      topic: competitive-channel-comparison
      missingEvidence: >-
        Comparable channel model details for Formlabs' key dental competitors (SprintRay, Carbon)
        that would enable a direct channel strategy comparison in North America and Europe.
      whyItMatters: >-
        Without competitor channel model data, it is not possible to fully assess whether
        Formlabs' Henry Schein exclusive arrangement is advantageous or disadvantageous
        relative to the broader dental 3D printing market.
      diligencePath: >-
        Review SprintRay and Carbon distribution announcements; interview dental industry
        analysts or dental lab association representatives for comparative channel context.
      relatedQuestionRefs:
        - QU024

    - type: enumeration-incomplete
      severity: minor
      topic: named-customer-proof-completeness
      missingEvidence: >-
        A comprehensive enumeration of Formlabs' production-scale enterprise customers across
        dental, engineering, manufacturing, defense, and education verticals. The 130,000+
        printer installed base implies thousands of active customers, but only a handful are
        publicly documented with outcome data.
      whyItMatters: >-
        TU003 enumerates only six named customers; the true breadth of enterprise adoption
        cannot be assessed from public sources alone. Any claim about vertical concentration
        or customer quality is therefore tentative.
      diligencePath: >-
        Request a customer reference list from Formlabs in any diligence session; review
        industry conference attendee lists and trade press for additional named deployments.
      relatedTableRefs:
        - TU003

acknowledgedWarnings:
  - dimension: tableNotes
    reason: >-
      All tables in this chapter include notes fields. The cohort figure (FU004) uses estimated
      values with explicit approximationNotes disclosing the estimation methodology and uncertainty
      range, as Formlabs does not publish NRR or GRR data. No table or figure note is omitted
      intentionally without reason.
