callouts:
  - calloutType: strength
    title: Dental Vertical Has Production-Scale Proof Points and Distribution Scale
    body: >-
      The Clove Dental case study demonstrates that Formlabs Form 4B printers can operate at 50,000
      aligners per month in a single facility — a production scale that validates the platform for
      industrial dental manufacturing. The Henry Schein partnership (February 2025) gives Formlabs
      access to a network of 1 million+ dental customers in North America without building out its
      own direct salesforce. This combination of production proof and distribution leverage is a
      meaningful competitive moat in the dental vertical.
    claimRefs:
      - CU006
      - CU007
      - CU009
      - CU012

  - calloutType: strength
    title: Manufacturing Adoption Shifts from Prototyping to End-Use Production
    body: >-
      The Fuse SLS line's 25%+ year-over-year growth in Q4 2025, driven by factory tooling and
      end-use part production (Eaton, ORQA FPV, Terra X, drone manufacturers), represents a
      qualitative shift in the customer value proposition from 'prototyping tool' to 'production
      asset.' This shift is associated with higher recurring materials spend, deeper workflow
      integration, and stronger retention dynamics than episodic prototyping use.
    claimRefs:
      - CU021
      - CU017
      - CU018
      - CU023

  - calloutType: risk
    title: No NRR or GRR Disclosure; Churn Risk Is Unquantifiable
    body: >-
      Formlabs has never disclosed net revenue retention, gross revenue retention, or cohort-level
      churn data. The qualitative evidence (fleet expansion, increasing usage intensity) is
      consistent with high retention, but without verified metrics, the durability of recurring
      consumable revenue cannot be formally assessed. Dental channel concentration via Henry Schein
      adds a single-distributor dependency risk in the largest growth vertical.
    claimRefs:
      - CU033
      - CU011
      - CU035

  - calloutType: risk
    title: Material Compatibility Gap on Upgrade May Slow Dental Fleet Refresh
    body: >-
      Several Form 3B+ dental materials — including Dental SG, IBT, Permanent Crown, Soft Tissue,
      and Temporary CB — are not supported on Form 4B, creating requalification friction for
      dental practices that depend on those formulations. This gap could slow Form 4B adoption
      among established Form 3B+ users and extend hardware cycles, reducing near-term upgrade revenue.
    claimRefs:
      - CU037

