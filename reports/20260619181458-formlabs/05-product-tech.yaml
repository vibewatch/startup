  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: ip-patents
      missingEvidence: >-
        Specific utility patent numbers protecting the LFD print engine's core light delivery
        mechanism (LED array, collimating optics, flexible film interaction). Design patents
        are publicly enumerated on Justia but LFD-specific utility patent claims are not
        separately categorized or mapped.
      whyItMatters: >-
        Understanding the breadth and enforceability of LFD utility patents is critical to
        assessing whether competitors can design around the core technology or whether Formlabs
        has durable IP protection in the MSLA print engine segment.
      diligencePath: >-
        Request Formlabs IP counsel for a patent claim mapping of the LFD engine. Alternatively,
        run a targeted USPTO search using Formlabs as assignee filtered to CPC subclass B29C64.
      relatedQuestionRefs:
        - QE024

    - type: missing-source
      severity: material
      topic: fuse-x1-roadmap
      missingEvidence: >-
        Formlabs has not publicly disclosed any materials roadmap for the Fuse X1 beyond
        Summer 2027 (Nylon 12 GF and TPU 90A). The full long-term materials pipeline —
        including potential carbon-fiber, glass-bead, or specialty engineering plastics —
        is unknown from public sources.
      whyItMatters: >-
        The materials roadmap depth is a key signal of Formlabs' SLS platform ambition and
        ability to compete with EOS and Stratasys in high-performance applications. A thin
        roadmap beyond nylons would limit long-term industrial addressable market.
      diligencePath: >-
        Engage Formlabs product management directly or review future product announcements
        at Formnext 2026 / RAPID+TCT 2027 for additional materials disclosures.
      relatedQuestionRefs:
        - QE025

    - type: access-blocked
      severity: material
      topic: biocompatible-materials
      missingEvidence: >-
        Specific FDA 510(k) clearance numbers and CE certificate identifiers for Form 4B
        dental resins are not listed on public Formlabs product pages or the dental
        subdomain. The dental product page confirms FDA-cleared status but does not provide
        actionable regulatory document references.
      whyItMatters: >-
        For a buyer in dental or medical device manufacturing, the specific clearance numbers
        determine whether the material is approved for their intended clinical use (e.g.,
        Class II surgical guide vs. Class I orthodontic model). Without this, compliance
        diligence is incomplete.
      diligencePath: >-
        Request the specific FDA 510(k) numbers and CE certificate document identifiers
        directly from Formlabs or their dental sales team. Search FDA CLIA/510(k) database
        using Formlabs as the applicant.
      relatedQuestionRefs:
        - QE023

    - type: private-evidence-only
      severity: minor
      topic: business-model
      missingEvidence: >-
        Formlabs has not disclosed the gross margin differential between its hardware
        (Form 4, Fuse 1+) and materials (resins, SLS powders) revenue segments. This
        breakdown is critical to understanding whether the razor-and-blades model generates
        disproportionate recurring revenue margin.
      whyItMatters: >-
        If materials margin is significantly higher than hardware margin (as typical for
        this model), the installed base becomes a much more valuable asset than the unit
        count alone suggests. Without the margin split, the quality of revenue cannot
        be fully assessed.
      diligencePath: >-
        Request segmented gross margin data in management discussions or financial due
        diligence calls. Look for any prior SPAC or IPO filing disclosures if a public
        offering proceeds.
      relatedQuestionRefs:
        - QE026
