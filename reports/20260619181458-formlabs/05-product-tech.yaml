  - id: core-print-technology
    title: "Core Print Technology Architecture"
    body: >-
      The Form 4 LFD print engine combines 60 LEDs, collimating lenses, advanced optical
      filters, and a flexible film tank in a Masked Stereolithography (MSLA) architecture.
      The Backlight Unit generates a uniform area-projection of ultra-high-power light, enabling
      simultaneous curing of an entire layer cross-section at 50 micron XY resolution with layer
      thicknesses from 25 to 300 microns. A Z-axis force sensor monitors peel forces on every
      layer and automatically adjusts Z-axis motion to minimize stress on parts during the
      separation step — this sensor-driven approach is foundational to achieving the 98.7%
      independently measured print success rate. The resin tank is rated for 75,000+ layers
      with any Formlabs material. The Build Platform Flex, equipped with patented Quick Release
      Technology, enables tool-free part removal in seconds.

      LFD succeeds Formlabs' Low Force Stereolithography (LFS) technology, introduced with the
      Form 3 in 2019, which used a flexible tank and line-scanning laser (Light Processing Unit)
      to reduce peel forces versus conventional fixed-bottom SLA. LFD replaces the laser/LPU
      module with an LED/LCD array, enabling significantly faster curing while retaining the
      flexible-tank peel-force advantage. The Form 4L uses the same engine scaled to 145 LEDs.

      The Fuse 1+ uses a 30W ytterbium fiber laser to sinter nylon powder without support
      structures, enabling very high part packing density. The Fuse X1 escalates this with
      13 independent thermal zones and Adaptive Thermal Control processing 700× more thermal
      data per second than the Fuse 1+ — enabling 30%+ volume packing density vs. 10–15% for
      HP Multi Jet Fusion and ~20% for legacy large-format SLS. AI-powered Print Intelligence
      uses computer vision with real-time thermal imaging to detect and exclude defective parts
      mid-build, reducing material waste and cycle-time losses.
