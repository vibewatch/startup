summary:
  headline: >-
    Formlabs is a cash-generative professional 3D printing leader with $250M+ revenue and rare FCF profitability, but
    the $2B 2021 valuation anchor is unsupportable at current public-market multiples; Track at secondary-market pricing
    of $700–$900M.
