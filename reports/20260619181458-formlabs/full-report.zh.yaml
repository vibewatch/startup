        - 增长驱动
        - 已在发生，2025–2026 年加速
        - 提高单客户材料支出和机群密度
        - 跟踪 SLS 收入占总收入比例；监测终端用途 vs. 原型的组合
      - - 数字牙科采用（CAD/CAM、口内扫描）
        - 增长驱动
        - 加速；牙科子市场 CAGR 15–25%
        - 扩大牙科垂直 TAM；材料附着率高
        - 核实牙科收入占 Formlabs 总收入比例；确认新树脂获批情况
      - - 扩展生物相容和工程级材料
        - 增长驱动
        - R&D 持续推进；每年新增 SKU
        - 打开新的临床、工业子细分市场
        - 跟踪新牙科 / 医疗树脂的 FDA 许可节奏
      - - AM 服务增长（15.5%）跑赢硬件（3.6%）
        - 逆风 / 结构性
