  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资历史与当前估值标记
        blocks:
          - type: paragraph
            body: >-
              Formlabs 自 2011 年 9 月创立以来，已在八轮融资中累计募集约 $254 million 风险资本。融资历程从 2012 年 $2.9 million Kickstarter 众筹开始，随后是
              $19 million Series A（DFJ Growth，2013 年）、$35 million Series B （Foundry Group 与 Autodesk，2016 年）、$30 million
              Series C（Tyche Partners 和 Shenzhen Capital Group，2018 年）、 来自 NEA 的 $15 million 延伸轮（2018 年 8 月，将估值推至 $1
              billion 以上），最终到 2021 年 5 月由 SoftBank Vision Fund 2 领投、投后估值 $2 billion 的 $150 million Series E。自 2021 年 5
              月以来，公司没有宣布新的一级股权融资——截至 2026 年 6 月已相隔超过五年。 这一期间，Formlabs 依靠内部现金生成自筹运营和增长，与其公开披露的盈利状态一致。

              $2 billion 一级轮估值是唯一正式披露的估值，定在 2021 年成长股权繁荣的顶点——当时全球科技倍数触及一代人高位。 此后，AM 行业经历了 SPAC 崩盘（Desktop
              Metal、Markforged、Velo3D 的公开市场价值均被摧毁大半），SoftBank Vision Fund 2 对其独角兽投资组合录得重大减记，2025 年 Klarna IPO
              也显示其估值较私人市场峰值下跌 67%。截至 2026 年 6 月， 二级市场平台给 Formlabs 股票定价对应的隐含市值约 $726–$727 million，较 $2B 一级估值折价约
              64%。这一二级市场信号是目前可见的最新公开标记， 也被视为公平交易正在成交位置的最佳代理。

              Formlabs 2026 年 6 月披露，2025 年收入超过 $250 million，自由现金流率高于 10%，这是公司首次公开发布财务数据。 这确认公司已跨过公开上市可行的收入门槛，也避开了 SPAC
              上市同行毁灭资本的路径。但缺少分部收入、按业务线划分的毛利率、现金状况、债务条款和营运资本数据， 关键承保输入仍不透明。入场价格纪律应锚定已知事实，而不是陈旧的 $2B 标题估值。
