            body: >-
              Stratasys 披露 2026 年 Q1 收入为 $132.7 million，全年指引为 $565–575 million，按收入仍是全球主导的聚合物 AM 公司，技术覆盖
              FDM、PolyJet、SAF（H350）、SLA（Neo 系列）和 P3 DLP（Origin One）。其 Stratasys Direct 零件业务在 2026 年 Q1 实现 23%
              同比有机增长，由无人机和国防需求驱动，展示出强劲的复购零件制造收入；Formlabs 当前还没有同等规模的收入流。Stratasys 待完成的 Markforged 收购（全现金，$42.5M，预计 2026 年
              H2 完成）将补充 Continuous Carbon Fiber FFF 能力，瞄准航空航天和国防生产。Stratasys 在 Formlabs Fuse 所处的低于 $50K SLS
              细分没有可比产品，但其大得多的渠道（全球经销商网络、100+ 名直销代表）让它在客户考虑从台式系统升级到生产现场系统时拥有超额触达能力。

              3D Systems 披露 2026 年 Q1 收入 $95.5 million，按剥离业务调整后同比增长 11%；Healthcare Solutions（含牙科）增长 21% 至 $50.1
              million，并超过 Industrial Solutions。公司 2025 年末推出的 NextDent 300 Jetted Denture Solution，被 CEO Jeffrey Graves
              称为五年来最成功的新产品发布；早期采用者 ROE Dental Laboratory 将产能提升至三倍。3D Systems 的牙科业务（NextDent 品牌、Figure 4 平台、SLA 系统，包括新的
              SLA 825 Dual）在专业树脂领域与 Formlabs 直接竞争。不过，3D Systems 牙科系统标价 $10,000–$20,000+，高于 Form 4B 的 $7,699；其工业 SLS
              系统价格也显著高于 Fuse 系列。两家既有厂商均在从多年 AM 市场下行中恢复，且仍有运营亏损，近期 R&D 进攻性受到约束。
