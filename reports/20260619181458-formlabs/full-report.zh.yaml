      - number: '7.7'
        title: 附录
        blocks:
          - type: callout
            title: 中国制造是最大的单一运营风险
            body: >-
              Formlabs 所有硬件都在中国组装。美中关税按有效税率平均约 33%（叠加行业税率更高），Formlabs 面临 COGS 压力；竞争对手 Stratasys 仅在 2026 年 Q1 就量化出 $5.3M
              拖累。Formlabs 没有披露制造多元化路线图，因此一旦关税升级或双边贸易中断， 利润率会被直接压缩，短期缓释空间有限。
            calloutType: risk
            claimRefs:
              - CR017
              - CR018
              - CR019
              - CR020
          - type: callout
            title: 陈旧的 $2B 估值带来显著下轮风险
            body: >-
              最近一次正式估值标记是 2021 年 7 月的 $2 billion。二级市场估计隐含 60–66% 折价。Formlabs 已盈利且仍在增长， 但如果在公开市场重新上调行业估值前需要 IPO 或一级融资，按
              2021 年价格进入的投资者将面临重大稀释或减值。未披露财务细节（毛利率、现金、烧钱率）使该风险无法精确量化。
            calloutType: risk
            claimRefs:
              - CR026
              - CR027
              - CR028
              - CR029
          - type: callout
            title: 投资前的优先尽调问题
            body: >-
              在按 $2B 估值投入资本前，三件事必须解决：(1) 法律确认 3D Systems 版税已消灭，或量化其对当前产品的影响；(2) 就 Form 4B 和 Fuse X1 的 DWS
              欧盟专利敞口取得法律意见；(3) 完整财务披露，包括按产品线划分的毛利率、中国制造 COGS 拆分和 FCF 轨迹。 次级问题：针对 Fuse X1 在国防用途场景中的出口管制分类审计；确认 CEO
              Lobovsky 的继任计划。
