      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              专业桌面 AM 买方可分为五个主要垂直领域，各自拥有不同预算归属、采购周期、用例驱动因素和忠诚度动态。牙科和医疗实验室构成最强的复购收入基础：实验室所有者或诊所经理既是付款方，也往往是用户；硬件采购周期为 3–5
              年，材料采购按月或按季度进行——与 Formlabs 的剃刀—刀片模式匹配。Formlabs 引用印度最大牙科连锁 Clove Dental 作为案例：该公司拥有 550+ 家诊所，使用 10 台 Form 4B
              打印机每月生产 50,000 个矫治器，展示了高产量、高忠诚度部署。

              工程和产品设计团队是第二大垂直领域。预算掌握在 R&D 主管或工程运营经理手中，主要触发因素是把外包 3–5 天的原型周期缩短为当天内部生产。Formlabs 通过工程页面直接触达该细分，强调相较外包最高可降低
              90% 成本。Ford 在开发新 Explorer 电动 SUV 时使用 Formlabs SLA 和 SLS 打印机，被作为工程工作流采用的突出案例。

              制造和生产买方——工厂经理或运营主管——评估 Formlabs Fuse SLS 时关注终端使用零件、工装、夹具和治具。这类买方需要 CapEx 审批，回收期通常低于 12–18 个月，因此 ROI
              文档至关重要。Formlabs CRO Nick Graham 提到的 2025 年 Q4 转变——客户正在「replacing traditionally manufactured tooling with
              Fuse printed parts」——表明该细分正在从试用转向嵌入生产。教育买方（大学院系、职业学校）价格敏感度强、采购周期更长；Formlabs 用 10%
              机构折扣应对。国防和政府买方优先考虑零件可靠性而非成本，并倾向于正式采购渠道。
