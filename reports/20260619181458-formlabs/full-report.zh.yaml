      - 阈值 / 事件
      - 行动含义
    rows:
      - - 中国关税冲击 / 制造中断
        - 美国对中国电子组件的关税率；Formlabs COGS 利润率
        - 中国制造 3D 打印机实际关税 >50%；确认生产停摆
        - 重新评估硬件单台经济性；加快近岸化尽调；重估投资模型
      - - DWS / 欧盟专利禁令
        - 德国联邦专利法院或 UPC 对 Form 3B / Form 4B 的裁决
        - 欧盟对任何 Formlabs SLA 产品发布临时或永久禁令
        - 升级法律处理；评估 Form 4/4B 敞口；评估欧盟收入风险；降低仓位
      - - FDA 执法行动
        - FDA 发出警告信、召回或同意令
        - 牙科或医疗健康产品发生任何 I 类或 II 类召回
        - 暂停牙科垂直领域投资论点；启动整改行动监测
      - - 估值减值 / 下轮融资
        - 新一轮一级或二级市场融资定价
        - 新一轮估值在 $800M 或以下（较 2021 年标记低 >60%）
        - 按修正倍数重新承销；压力测试回报情景；重审入场纪律
