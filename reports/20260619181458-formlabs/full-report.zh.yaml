  - id: TP004
    title: 护城河耐久性与竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 缓解措施 / 尽调问题
    rows:
      - - 专有已验证材料（树脂、粉末）
        - 开放材料 MSLA 打印机（$300–$500）把入门级商品化；第三方粉末用户绕开耗材 锁定
        - 高
        - 防御性扩大 Open Material Mode，留住价格敏感用户；在第三方缺乏认证的受监管用途（牙科 / 医疗） 上强化材料锁定
      - - 集成软件生态（PreForm、Dashboard）
        - 企业买家需要机群管理 CI/CD 和 MES 集成，而 Formlabs Dashboard 目前无法支撑 100+ 台部署
        - 高
        - 加速企业机群软件路线图；与 MES/ERP 厂商合作；在 Stratasys 用 GrabCAD Print 向客户追加销售前补齐缺口
      - - 已验证牙科工作流（Form 4B、30+ 种牙科树脂）
        - SprintRay/EnvisionTEC 整合催生验证更广的对手；Carbon 牙科网络在高产量技工所扩张
        - 中
        - 加深技工所分销商排他性；加快新适应症监管许可；用总拥有成本防守
      - - 品牌认知和装机基础（>100K 台打印机）
        - 低成本 Bambu Lab + Elegoo/Anycubic 侵蚀准专业用户优势；中国 SLA 厂商专业品质提升很快
        - 中
        - 跟踪 MSLA 品质提升速度；在可靠性上保持清晰性能护城河（98.7% 成功率基准）； 将信息传递聚焦专业工作流结果
      - - 全球经销渠道（3,000+ 个合作伙伴）
        - Stratasys 待完成的 Markforged 收购强化其航空航天 / 国防渠道；3D Systems 借 DSO 触达牙科渠道
        - 低-中
        - 加大牙科 DSO 和牙科学校管线的渠道深度投入；相对更大 OEM 保持渠道激励优势
      - - SLS 成本性能比（Fuse 1+ vs EOS）
        - EOS 和 3D Systems 可能用更低入门价 SLS 产品回应；HP MJF 继续探索低于 $100K
        - 中
        - Fuse X1 巩固工业定位；继续降低粉末成本；用打印智能软件把硬件差异化守住
      - - 材料校准和打印配置带来的切换成本
        - Open Material Mode 和更容易的 CAM 迁移降低切换门槛；服务局提供零资本开支替代方案
        - 中
        - 增加更难复制的自动化和后处理集成；围绕服务计划建立结果 SLA
      - - Formlabs $226M 收入 vs Stratasys $570M
        - 收入差距意味着 Formlabs 的 R&D 能力更弱，用于企业销售、经销商激励和监管审批的资源更少
