      - number: '7.5'
        title: 竞争与战略风险
        blocks:
          - type: paragraph
            body: >-
              Formlabs 的主要战略风险不是核心 SLA/SLS 板块中的直接替代，而是可服务市场边界从低端被侵蚀。总部位于深圳的 Bambu Lab 自 2022 年推出后三年内拿下 prosumer FDM
              打印机市场（$1,000–5,000 价格带）超过 40% 份额，以让专业 FDM 越来越商品化的价格提供多材料、高速桌面打印。 中国制造商 2025 年合计生产超过 500 万台 3D
              打印机，以激进定价侵蚀入门级市场。但 FDM 不是 Formlabs 的市场： SLA（树脂光聚合）和 SLS（粉末烧结）服务的是完全不同的表面质量、材料性能和终端用途要求。对 Formlabs
              更相关的竞争威胁来自： (1) 中国 SLA 竞争者（Phrozen、Elegoo、Anycubic、Bambu MSLA）以低于 $500 的价位进入中端树脂打印，压迫售价 $4,999 的 Form 4；
              (2) HP Multi Jet Fusion 和 EOS SLS 在工业 SLS 层级与 Fuse X1（$84,999）竞争；(3) SprintRay 在牙科 SLA 直接竞争。 Formlabs
              的专有树脂生态和已验证材料库带来强切换成本和经常性收入护城河，但也形成双重风险：如果开放材料打印（通过第三方树脂）获得法律或市场牵引力， 刀片刀架式耗材模型会被削弱。Stratasys 财务结果确认，2026
              年客户推迟设备投资，行业硬件需求普遍偏弱；这一风险跨越所有资本密集型硬件厂商，与产品质量无关。 桌面 3D 打印市场预计将从 2025 年的 $6.7 billion 增至 2031 年的 $13.26
              billion，CAGR 约 12%（Mordor Intelligence）， 提供增长顺风，但 APAC 增长不成比例地利好拥有低成本生产和政府支持的中国制造商。
