          description: Form 4：按 $79–$149/L 计约 $948–$1,788/年；Fuse 1+：按 6 kg/月计约 $7,200/年
        - id: channel-discount
          label: |-
            渠道折扣
            （收入漏损）
          description: 约 15–30% 标价流向分销商 / 经销商利润
        - id: retention-and-expansion
          label: |-
            留存与扩张
