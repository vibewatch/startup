      - number: '4.3'
        title: 成本结构与毛利率画像
        blocks:
          - type: paragraph
            body: >-
              Formlabs 不发布经审计的财务报表，也没有公开披露按板块划分的收入或按业务线划分的毛利率。关于成本结构，现有最佳证据来自三处：（1）公司自称在 $250M+ 收入上实现 >10% FCF
              利润率；（2）Cognex、3D Systems 等可比工业“硬件 + 耗材”平台的类比基准；（3）剃刀与刀片模式本身的结构分析。


              行业分析师和观察者普遍认为，在工业平台业务中，耗材（树脂和粉末）的毛利率显著高于硬件。Formlabs 目前有 130,000+ 台打印机带来持续的树脂和粉末需求；在这一规模下，综合毛利率很可能是 50–60%
              硬件毛利率与 60–70% 以上耗材毛利率的加权平均，和公司披露的 >10% FCF 利润率相吻合。这远好于通过 SPAC 上市的 AM 同行（Desktop
              Metal、Markforged、Velo3D）的典型画像；这些公司多数在倒下或被收购前仍处于负毛利。收购 Spectra 带来的材料垂直整合，把光聚合物化学供应链内化，也进一步保护了耗材板块毛利。


              从成本结构看，Formlabs 相比纯软件公司明显更重资产：持续制造资本开支（capex）、45+ 种材料的库存投入、全球物流基础设施、打印机平台研发周期（Form 4 于 2024 年 4 月推出，Fuse
              X1 于 2026 年 6 月推出），以及约 750+ 名员工的全球团队。打印机生态配件（Form Wash、Form Cure、Fuse Sift、Fuse
              Blast）也需要库存和制造投入，但会带来增量硬件收入。SLS 粉末最高 80% 可回收，是面向客户的关键成本效率叙事；但这也意味着 Formlabs 必须为粉末回收项目投入包装和物流。


              经销网络会让实际毛利率低于按标价推算的水平；转售商和分销商会在 Formlabs 出厂价与终端客户支付标价之间留下一部分价差。具体渠道利润分配未披露，但工业硬件转售商通常为 15–30%。
