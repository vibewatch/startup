  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与业务架构
        blocks:
          - type: paragraph
            body: >-
              Formlabs 通过三条相互咬合的收入流变现，映射经典工业硬件平台：硬件销售（一次性打印机和外设购买）、耗材（每次打印都需要的复购型专有树脂和粉末）以及服务（新推出的 Form Now
              按需打印机构）。硬件流推动装机基础增长，后者又拉动复购耗材收入——这是业务的经济引擎。这套剃刀—刀片架构明确采取垂直整合：Formlabs 自行设计打印机、配方树脂和粉末（2019 年收购 Spectra
              后增强），并控制管理打印工作流和监控系统性能的软件层（PreForm、Dashboard）。


              耗材流是模型的财务核心。每售出一台打印机，就产生对专有材料的持续锁定需求：SLA 打印机需要 Formlabs 认证树脂盒和替换 Form tanks，SLS 打印机每次成型都消耗 Nylon 11 或
              Nylon 12 粉末。高强度用例——生产批次而非偶发原型——会让每台装机的耗材支出显著提高。公司 2026 年 6 月 Fuse X1 新闻稿披露，客户已在 Formlabs 打印机和材料上打印超过 500
              million 个零件，表明装机基础有深度使用，而非货架化采用。Fuse SLS 单位销量在 2025 年 Q4 同比增长超过 25%，是增长最快、ASP 最高的细分，可能是 2025 年 Q4
              创纪录收入和材料里程碑背后的主要驱动。


              2026 年面向美国客户推出的 Form Now 服务机构，增加了第三条收入流，本质上是增材制造即服务：客户上传 STL/OBJ 文件，从 15+ 种 Formlabs 材料中选择，最快两天收到零件，起价约每件
              $20。在这一早期阶段，Form Now 是利润率和产能利用率打法——Formlabs 可以把内部多余打印机产能投入使用，获得高于批发的回报，同时通过直接产品体验把潜在未来硬件买方引入 Formlabs
              生态。Form Now 的收入贡献未披露。
