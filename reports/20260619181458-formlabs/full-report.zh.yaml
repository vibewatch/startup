      - number: '2.2'
        title: 市场规模——TAM、SAM 与测算视角
        blocks:
          - type: paragraph
            body: >-
              根据引用最广泛的年度 AM 行业调查 Wohlers Report 2026，全球增材制造生态系统 2025 年收入达到 $24.2 billion，同比增长 10.9%。该数字覆盖完整产品与服务栈：AM
              打印服务（48%）、系统硬件销售与服务（26%）、材料（20%）和软件（6%）。多家商业市场研究机构给出的估计从 $16 billion（MarketsandMarkets 2025，偏硬件口径）到 $34
              billion（Precedence Research 2026，包容性预测）不等；差异反映的是范围口径不同，而非对同一市场的观察存在根本分歧。

              与 Formlabs 最相关的细分——价格低于 $100,000 的专业桌面 / 台式 SLA 和 SLS 系统——没有任何公开分析机构按这一颗粒度单独拆分。基于工业打印机收入占比（据 Precedence
              Research 约为市场收入的 77%）、工业中的专业桌面占比，以及全球硬件加材料收入，可以作出一个有依据的 SAM 估计：2025 年专业桌面 AM SAM 约为 $3–4 billion。Formlabs
              自报收入超过 $250 million，意味着它已拿下该细分的可观份额。专业牙科子市场尤其边界清晰、扩张迅速；多家分析机构把 2026 年全球牙科 3D 打印市场估值为 $4–6 billion，并预计到
              2031–2035 年 CAGR 为 16–26%。

              关键提醒：AM 分析师 TAM 数字以口径分歧巨大而著称。Wohlers 采用基于 570 家公司 1,200+ 份回复的一手数据调查方法；商业研究机构采用自上而下市场模型。Wohlers 的 $24.2B
              应被视为全行业生态系统最可靠的上限指标，而商业机构给出的子市场拆分数字不确定性更高，使用时应明确附带信心限制。
