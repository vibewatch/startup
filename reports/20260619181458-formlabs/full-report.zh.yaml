      - number: '6.4'
        title: 销售、分销与渠道模式
        blocks:
          - type: paragraph
            body: >-
              Formlabs 采用混合分销模式，把直销与由数百家授权转售商和专业分销伙伴组成的全球网络结合起来。formlabs.com
              上的转售商查找器覆盖澳大利亚、欧洲、亚太、北美等地区伙伴，可按地区、产品线和行业筛选。针对北美牙科垂直领域，Formlabs 在 2025 年 2 月做出决定性渠道转向：美国和加拿大的所有 Formlabs
              Dental 产品现在只能通过合作转售商购买，Henry Schein 被指定为首选分销商。Henry Schein 拥有约 26,000 名团队成员，全球网络触达 100 万+ 医疗健康客户，让
              Formlabs 能直接接触牙科实验室和诊所；这些客户靠直销难以高效覆盖。这段关系可追溯到 2017 年，当时 Henry Schein 旗下 Zahn Dental 部门开始分销 Formlabs
              牙科产品。牙科合作于 2025 年 2 月 20 日公开宣布，并获得 Henry Schein 董事长兼 CEO Stanley M. Bergman
              明确背书。牙科之外，新的工程转售商仍在加入：GSC（Ellison Technologies 旗下公司）于 2026 年 4 月 28 日宣布与 Formlabs
              建立转售商合作，面向更广泛的美国制造与工程市场。Formlabs 还运营 Channel Partner
              Portal（partners.formlabs.com），用于管理合作伙伴资源和培训。即便产品由合作伙伴销售，直接客户服务（包括牙科服务计划）仍由 Formlabs
              保留；但牙科渠道模式用分销商利润换取触达范围和客户信任，改变了获客经济性。
            claimRefs:
