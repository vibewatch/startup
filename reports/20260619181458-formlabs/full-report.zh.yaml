      - number: '8.3'
        title: 上市可比公司与并购基准
        blocks:
          - type: paragraph
            body: >-
              最直接可比的上市公司是 Stratasys (SSYS) 和 3D Systems (DDD)，二者均在美国交易所上市，并服务重叠的专业与工业 AM 终端市场。 截至 2026 年 6 月 18
              日，Stratasys 企业价值约 $563 million，过去十二个月收入约 $547–$570 million，隐含 EV/Revenue 倍数约 1.0x。 3D Systems 企业价值约 $649
              million，过去十二个月收入约 $388 million，隐含 1.67x EV/Revenue。两家公司目前均未按 GAAP 盈利： Stratasys 指引 2026 全年调整后 EBITDA 仅
              $25–$30 million，对应 $565–$575 million 收入（EBITDA 率约 4.5–5.0%）， 而 3D Systems 录得过去十二个月 EBITDA 约负 $25
              million。Formlabs 已证明的盈利能力是清晰差异化，应相对这些可比公司获得溢价， 但溢价受 AM 行业结构性资本强度以及机构投资者对硬件中心型工业公司需求有限所约束。

              Cognex Corporation (CGNX)——即新任 Formlabs 董事 Rob Willett 曾担任 14 年 CEO 的机器视觉公司——是理想上限。 Cognex
              将专有硬件与软件、工业终端市场经常性收入结合，历史上曾以 6–10x EV/Revenue 交易，反映叠加在硬件上的高毛利软件经济性。 Formlabs 希望获得类似定位，但其耗材模型不同于 Cognex
              纯软件增强架构；其牙科和医疗保健聚焦垂直领域周期性更弱，但毛利率也低于 Cognex 的半导体检测市场。

              行业内的并购数据点是 Stratasys 于 2026 年 5 月从 Nano Dimension 手中以 $42.5 million 收购 Markforged——隐含收购倍数约为过去收入的
              0.6x（Markforged 2025 年收入约 $70 million）。这是一个被母公司剥离、在战略压力下出售的公司所对应的困境资产定价。 Formlabs
              并非困境资产，理应相对该交易享有溢价，但该数据点确认，AM 行业战略买家有价格纪律，不支付投机性倍数。根据 Investec 2026 年 Q1 Industrial Technology Valuation
              Update，该行业平均以 16.7x EV/EBITDA 交易，但只有工业软件子板块（21.8x） 和传感器 / 视觉技术（21.4x）能维持高十几倍倍数；硬件密集型机械和工程 / SI 企业集中在
              8–10x。AM 战略并购中，带有 IP 和长期生产合同的平台资产拿到 11–15x EBITDA。
