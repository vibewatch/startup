      - number: '5.6'
        title: 局限、路线图与技术风险
        blocks:
          - type: paragraph
            body: >-
              Formlabs 最常被提到的局限是专有生态锁定：标准 Form 4 工作流默认要求使用 Formlabs 品牌树脂和料槽，Open Material Mode
              需要付费解锁，第三方材料认证也不完整。从开放平台打印机迁移而来的用户指出，Formlabs 树脂每升成本显著高于开放市场替代品。Formlabs 的 BBB
              企业档案记录的客户投诉主要与支持响应时间和硬件可靠性有关，这符合一家规模化中端硬件公司的状态。社区论坛讨论将高树脂耗材成本（料槽 $125+ 起）视为采用摩擦点。PreForm 不提供 G-code
              导出或第三方切片器支持，限制了技术高阶用户的工作流自定义。

              具体到 Fuse X1：系统需要外部氮气供应且未集成，增加了设施要求和运营复杂度。发布时材料库仅限 Nylon 12；Nylon 11 预计 2026 年底推出，Nylon 12 GF 和 TPU 90A 目标为
              2027 年夏季。这些缺口可能拖慢需要高性能或柔性热塑性材料的应用采用。Fuse X1 的规模化也尚未验证，交付要到 2026 年 Q4 才开始，长期现场数据有限。从竞争看，Carbon DLS
              在医疗器械和消费品细分市场竞争；HP MJF 争夺生产量；传统工业 SLS 玩家（EOS、Farsoon）会防守企业账户。随着工业现有厂商回应 Formlabs 的价格破坏策略，Formlabs
              的护城河正在被测试。
