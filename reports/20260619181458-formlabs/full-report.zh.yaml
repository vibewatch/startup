      - number: '7.6'
        title: 人员、治理与退出风险
        blocks:
          - type: paragraph
            body: >-
              CEO Max Lobovsky 自 2011 年在 MIT 创立 Formlabs 以来一直领导公司，是公司的公共面孔、核心产品愿景来源，也是市场定位的推动者。 联合创始人 Natan Linder 担任
              Chairman，David Cranor 也是仍参与公司的联合创始人，提供了一定的分布式创始人治理。 但 Lobovsky
              的核心运营权威带来关键人集中风险：任何离职、失能或重大交接都会在关键扩张节点制造组织不确定性。公司没有披露继任计划，也没有公开指定的接班 COO 或 President。 2024 年 8 月，Formlabs
              确认裁员约 40 人（低于约 750 名员工的 5%），并称这是效率驱动的重组。裁员在两年内分多波发生， 影响“低于效率目标”的部门岗位，说明管理层主动控制人工成本纪律，也说明运营效率曾需要干预。2026 年 2
              月的董事会调整——Carl Bass （前 Autodesk CEO，自 2017 年起任董事）离任，Rob Willett（前 Cognex CEO、Nasdaq 资深人士）获任——被行业分析师广泛解读为
              IPO 前治理准备。 Willett 的 Cognex 背景（专有硬件 + 软件 + 经常性收入；上市公司 30+ 年）与 Formlabs 商业模式直接对应，3DPI
              指出这项任命本身“自带评论”，指向退出准备度。 SoftBank Vision Fund 2 领投 2021 年 Series E，并按 $2B 估值持有股权；基金层面的资本分配压力（Vision Fund 2
              曾面临更广泛的投资组合减记） 可能推动 IPO 时间表，而这未必符合公司偏好的“慢慢来”定位。若 2026-2027 年 IPO 窗口打开，但公开市场对硬件公司的情绪不利， Formlabs
              可能面临低于内在价值的定价事件。
