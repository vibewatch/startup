      - number: '4.2'
        title: 定价与变现
        blocks:
          - type: paragraph
            body: >-
              Formlabs 采用分层定价架构，覆盖四档硬件和多类耗材，用不同价位切入不同客户群，同时尽可能放大每台装机的生命周期收入。入门端，标准配置的 Form 4 SLA 打印机起价 $4,499，牙科配置的 Form
              4B 为 $6,299。Fuse 1+ 30W 台式 SLS 系统在美国市场起价约 $24,649；新推出的工业级大幅面 SLS 系统 Fuse X1 起价 $84,999，接近入门级 Form 4 的 20
              倍。Formlabs 没有放弃专业入门市场，而是有意向工业工作流扩张。


              耗材定价体现了专有材料的高端定位：标准 V5 SLA 树脂约 $79/L 起，工程树脂（Tough、Durable、Flexible、Rigid）为 $149–$349/L，特殊生物相容或牙科树脂最高达到
              $850/L。SLS Nylon 11 和 Nylon 12 粉末在标准采购量下约 $99–$116/kg 起，1,000+ kg 大宗订单的阶梯价可降至
              $45/kg。牙科材料价格最高，因此在耗材组合中很可能也贡献最高毛利。


              自 2026 年 1 月起，所有新出货的 Form 4B 和 Form 4BL 默认启用 Open Material Mode（OMM），客户可以使用兼容的第三方 385 nm 和 405 nm
              树脂。这既是对竞争性价格压力的防守性让步，也是 Formlabs 试图把自己定位成最开放的专业 SLA 平台。多家供应商提供与 Form 4 生态广泛兼容的第三方树脂，价格低至 $35/L，只有 Formlabs
              专有材料定价的一小部分；因此，OMM 对耗材收入模式构成潜在侵蚀风险。存量 Form 4 用户和 Form 3 装机基数若要使用 Open Material
              Mode，需要付费解锁；老一代用户不购买新打印机就无法获得该功能。


              Formlabs 的实际成交价会被两类折扣拉低：一是经销商利润，反映出相当一部分硬件通过全球转售网络销售；二是面向企业和牙科客户的批量 / 大宗定价。标价代表 Formlabs
              定价权的上限，渠道中的单台实际收入会低于标价。
