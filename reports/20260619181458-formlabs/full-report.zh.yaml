  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与范围
        blocks:
          - type: paragraph
            body: >-
              Formlabs 的相关市场是专业和工业桌面 / 台式增材制造，边界限定在价格约 $3,500–$100,000、采用立体光固化（SLA）或选择性激光烧结（SLS）工作流的系统。该边界排除三类支出：消费级和爱好者
              FDM 打印机（低于 $1,500，由 Bambu Lab 和 Creality 主导）；价格高于 $200,000、需要专职操作人员和大面积场地的重工业生产系统（EOS、3D Systems
              ProX）；以及采用粉末床熔融或定向能量沉积的金属增材系统。

              在专业桌面边界内，纳入的支出包括 SLA 和 SLS 打印机硬件（一次性资本购买）、专有材料（树脂、SLS 尼龙粉末——复购型耗材支出）、后处理硬件（清洗 / 固化站）、工作流软件（PreForm 和
              Dashboard——复购 SaaS 或捆绑）以及维护和服务合同。相邻支出包括牙科工作流中的口内扫描仪、CAD/CAM 软件许可，以及把零件几何数据送入打印机的数字供应链集成服务。

              主要现状替代方案是外包快速原型服务机构（Xometry、Protolabs、Shapeways）、蜡或软铝工装的减材 CNC
              加工、数百件以上生产批次的注塑，以及手工牙科技工室制作。买方视角从「买哪台打印机」转向每个细分市场里的「购买还是外包」，也就是说，可寻址支出还包括被内部采用替代的原型外包预算。
