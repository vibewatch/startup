    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与创立
        blocks:
          - type: paragraph
            body: >-
              Formlabs 是一家专业 3D 打印技术开发商和制造商，总部位于 Massachusetts 州 Somerville。公司由 Maxim Lobovsky、Natan Linder 和 David
              Cranor 于 2011 年 9 月创立，三人当时均为 MIT Media Lab 研究生；创立初衷是让专业级数字制造更容易获得。几位创始人在 MIT Media Lab 课程「How to Make
              (almost) Anything」中相识，并借鉴了 MIT Center for Bits and Atoms Fab Lab 项目经验，以及 Lobovsky 此前在 Cornell University
              参与 Fab@Home 开源 3D 打印机项目的经历。

              Formlabs 聚焦两项核心增材制造技术：立体光固化（SLA）用激光或 LCD
              光聚合液态树脂，生产高分辨率零件；选择性激光烧结（SLS）则烧结尼龙粉末，无需支撑结构即可制造耐用的功能性零件。公司生态包括打印机、专有材料（45+ 种树脂和粉末）以及 PreForm 设计与工作流软件。截至
              2026 年 6 月，Formlabs 至少在八个全球地点运营，包括 Somerville（总部）、Berlin、Tokyo、Shanghai、Singapore、Budapest 和 Raleigh（North
              Carolina）。

              Formlabs 被描述为 1980 年代以来创立的最大专业 3D 打印公司，也是全球专业 SLA 和 SLS 打印机销量第一的厂商。截至 2026 年 6
              月，公司仍为私营公司，不发布经审计财务数据。已披露指标——售出 130,000+ 台打印机、打印 500+ million 个零件、2025 年年收入
              $250M+——使其跻身全球增材制造行业最大玩家之列。商业模式把一次性硬件收入与复购耗材（树脂和粉末）及软件结合，形成剃刀—刀片结构；管理层称该结构是持续盈利的驱动因素。
