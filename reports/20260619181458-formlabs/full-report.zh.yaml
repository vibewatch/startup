      - number: '8.5'
        title: 退出准备、路径与治理信号
        blocks:
          - type: paragraph
            body: >-
              Formlabs 正在搭建退出前公司的治理基础设施。最显眼的信号是 2026 年 2 月任命 Rob Willett——曾任 Nasdaq 上市公司 Cognex CEO 14 年——加入 Formlabs
              董事会，替换创始阶段董事 Carl Bass（前 Autodesk CEO）。3D Printing Industry 将这一变动描述为“quietly reshaping governance”，
              与准备公开上市或在战略出售中最大化估值相一致。联合创始人兼 Chairman Natan Linder 明确将这次过渡表述为 Formlabs 从“breakthrough startup” 向“enduring
              manufacturing platform”的演进，这套语言直接面向公开市场和战略收购方受众。CEO Max Lobovsky 表示，他希望 Formlabs
              在上市前“足够大，能成为一家成功的上市公司”；$250M+ 收入披露是 Formlabs 认为自己正接近该门槛的首个证据。

              三条可行退出路径存在。IPO 是公开讨论最多的情景，Willett 任命、首次收入披露以及 2025–2026 年独角兽 IPO 复苏（2025 年 40 宗传统 IPO，合计价值 $207
              billion，2026 年节奏更高）共同支撑这一可能。但作为一家没有强 AI 或基础设施叙事的工业硬件公司， Formlabs 会面对同样的挤出效应：硬件独角兽被推到 2026 年 IPO
              队列后排。战略收购同样合理：潜在收购方包括 Danaher 或 Dentsply Sirona （牙科垂直整合）、HP Inc. 或 GE Vernova/Additive（扩展 AM 平台），或
              Siemens（工业自动化相邻）。以 Stratasys 当前市值 （$774M）看，鉴于交易规模和潜在反垄断影响，其收购可能性较低，但不能排除。按 $700–$900M
              二级市场估值进行私募股权资本重组或杠杆收购， 可为早期投资者提供部分流动性，同时让 Formlabs 保持独立运营，为更干净的 IPO 做准备。约 15 年的风险投资持有期使退出压力变得真实： 支持 2013 年
              Series A 的有限合伙人已进入第二个十年，仍未获得分配回报。
