  - id: TV005
    title: 论点失效与终止触发项
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 收入停滞
        - FY2026 收入在 $250M 或以下（披露的 2025 年下限，零增长）
        - 增长溢价消失；基准情景 EV 向熊市情景（$375M）坍缩；FCF 持平或下降
        - 退出 / 回避；在 >$600M 时出售二级仓位；不新增投资
      - - 特许权使用费负面变化
        - 3D Systems 寻求将特许权使用费延长至当前期限之后，或新产品线被纳入范围
        - 实际净收入每年减少 $20–25M；FCF 利润率压到 7% 以下；退出倍数打折
        - 任何新承诺前，要求确认特许权使用费期限和买断经济性
      - - 中国关税升级
        - 打印机进口实际关税率升至 50% 以上，或 Formlabs 无法向客户转嫁成本
        - 按板块可比公司估算，硬件利润率压缩 5–8 个百分点；FCF 利润率低于 5%
        - 暂停；要求有清晰时间线和执行成本的制造多元化计划
      - - IPO 市场对硬件独角兽关闭
        - 2026–2027 年没有可行的硬件中心型工业 IPO 以溢价倍数完成；上市可比公司交易低于 1x EV/Revenue
        - 退出路径收窄到战略收购或 PE；倍数上限降至 1.5–2x EV/Revenue
        - 在 $2B 一级市场价格下下调为回避；跟踪低于 $500M 的二级买入机会
      - - SoftBank 被迫退出
        - SoftBank Vision Fund 2 以大幅折价启动 Formlabs 股权二级出售，或 Formlabs 同意低于 $700M 的收购以向 LP 提供流动性
        - 确认二级市场定价；可能创造低于基准情景公允价值的机会型入场
        - 监测：若被迫交易将 Formlabs 定价低于 $600M EV，可能出现机会
    notes: 触发阈值是基于已披露财务和板块可比公司的分析估计。除收入 >$250M 和 FCF 利润率 >10% 门槛外，Formlabs 未披露内部财务数据。
