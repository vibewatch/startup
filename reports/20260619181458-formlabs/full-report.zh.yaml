              Wohlers Report 2026 记录，2025 年硬件系统销售仅增长 3.6%，而 AM 服务增长 15.5%，说明买方越来越偏好外包给服务机构，而非购买内部设备。如果这一趋势延续，Formlabs
              的可寻址硬件 TAM 增速会慢于头部 AM 市场数字所暗示的水平。因此，Formlabs 在每一次新客户争夺中，不仅要与竞品打印机竞争，也要与服务机构外包这一替代方案竞争。
