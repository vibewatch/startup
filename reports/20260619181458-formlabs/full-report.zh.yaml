  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分与垂直行业
        blocks:
          - type: paragraph
            body: >-
              Formlabs 服务十个主要行业垂直领域。牙科 / 正畸是增长最快、战略意义最大的细分市场：Form 4B 和 Form 4BL 专为牙科实验室和临床诊所打造，Formlabs 称其平台已打印 1500
              万个牙科零件。截至 2026 年，约 15% 的美国牙科诊所拥有现场 3D 打印机，渗透率较十年前接近零明显提升；全球牙科 3D 打印市场在 2024 年估计约 ~$5.2B，预计到 2033 年约
              ~$10B。工程与制造是第二大垂直领域，服务从初创公司到 Fortune 500 制造商中的产品设计师、研发工程师和生产设施。牙科以外的医疗——手术规划模型、解剖参考和定制医疗器械——正在增长。教育（STEM
              实验室、大学研究）提供稳定、重复的机构需求。珠宝（使用 Castable Wax 和 True Cast 树脂制作定制铸造模型）和消费品（鞋履、玩具、配件）是相邻垂直领域。国防承包商和 ORQA FPV
              等无人机制造商越来越多采用 Fuse SLS 打印机，用于供应链韧性和终端零件。买方 / 付款方画像因垂直行业差异很大：牙科诊所和实验室通过 Henry Schein
              等分销商直接采购；制造设施通常通过工程转售商采购；教育 / 政府买家遵循机构采购周期。Formlabs 打印机部署在 100 多个国家，并在美国、欧洲和亚太设有专门区域办公室。
