      - number: '5.3'
        title: 材料生态与开放平台策略
        blocks:
          - type: paragraph
            body: >-
              Formlabs 在 SLA 树脂和 SLS 粉末上提供 45+ 种经验证材料，材料广度成为核心竞争差异点。SLA 树脂类别覆盖工程级（Tough 2000、Rigid 10K、Durable）、牙科与医疗（8+
              种获 FDA 批准且生物相容的树脂）、铸造（Castable Wax 40）、柔性与弹性（Flexible 80A、Elastic
              50A）、陶瓷、阻燃、硅胶和通用材料（Grey、White、Clear、Draft）。Fuse 生态的 SLS 粉末包括 Nylon 12（拉伸强度 50 MPa，模量 1850 MPa）、Nylon
              11（断裂伸长率最高 40%，拉伸强度 49 MPa）、Nylon 12 GF（玻纤填充、热稳定性增强）和 TPU 90A（柔性，Shore 90A 硬度）。

              Form 4 和 Fuse 1+ 支持 Open Material Mode（OMM），用户付费解锁后即可使用经认证的第三方树脂或 SLS
              粉末打印。这部分缓解了专有锁定的批评，但解锁费用未公开，且许多专业应用的第三方材料认证并不完整。材料业务遵循剃刀与刀片模式：硬件是一次性购买，树脂和 SLS 粉末带来经常性收入。Fuse X1 发布时仅支持
              Nylon 12；Nylon 11 设置预计在 2026 年底前提供，Nylon 12 GF 和 TPU 90A 目标为 2027 年夏季——这让近期需要高性能热塑性材料的应用面临关键材料缺口。
