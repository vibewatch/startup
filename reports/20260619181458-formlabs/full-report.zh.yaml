      - number: '1.3'
        title: 资本结构与投资者
        blocks:
          - type: paragraph
            body: >-
              Formlabs 自创立以来多轮融资累计约 $254 million。公司的融资轨迹包括：2013 年 10 月由 DFJ Growth 领投的 $19 million Series A（Pitango
              Venture Capital 和 Innovation Endeavors 参投）；2016 年 8 月由 Foundry Group 领投的 $35 million Series B（Autodesk
              战略跟投）；2018 年 4 月由 Tyche Partners 领投的 $30 million Series C（Shenzhen Capital Group，这是一家市属中国创投机构，参投）；以及 2018
              年 8 月来自 New Enterprise Associates、使估值跨过 $1 billion 门槛的一轮 $15 million 融资。

              最重要的融资事件是 2021 年 5 月由 SoftBank Vision Fund 2 领投的 $150 million Series E，把公司估值翻倍至 $2 billion。Deep Nishar（当时在
              SoftBank Investment Advisers，现为 General Catalyst）在该轮后加入董事会。截至 2026 年 6 月，公司未公开披露后续融资轮次，因此 $2 billion
              估值仍是最近已知数字——距今已有五年，考虑到增材制造市场环境，存在重大不确定性。

              值得注意的早期天使投资者包括 Mitch Kapor（Kapor Capital）、Joi Ito（时任 MIT Media Lab 主任）以及 Eric Schmidt 的 Innovation
              Endeavors。J.P. Morgan 担任 Series E 配售代理。Formlabs
              的资本结构未完整披露；二级交易、优先股条款、清算优先权、反稀释权和管理层股权持有细节均为私人信息。未披露债务融资表明，公司在实现盈利后一直依靠股权和经营现金流。
