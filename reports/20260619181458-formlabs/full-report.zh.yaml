      - number: '6.5'
        title: 留存、切换成本与扩张动态
        blocks:
          - type: paragraph
            body: >-
              Formlabs 尚未公开披露净收入留存（NRR）或总收入留存（GRR），限制了正式的持久性评估。不过，多项结构和行为信号指向高留存。专有树脂生态——45+ 种经验证材料、认证逻辑以及 PreForm
              中经验证的打印配置——形成了深度工作流集成。更换打印机意味着重新认证材料、重新培训操作员，并且可能需要重新认证工作流；在受监管的牙科和医疗场景中，这一点尤其重要。Form 4 世代料槽额定寿命约 ~75,000
              层（相比老款 Form 3+ 上寿命有限且按材料区分的料槽），实际上在维持耗材关系的同时降低了更换摩擦。行为层面的扩张有充分记录：Clove Dental 在不到两年内从 Form 3B 升级到 Form
              4B，并扩大到 10 台打印机；Eaton 在其 209 个基地的全球制造网络中系统性标准化采用 Formlabs SLA 和 SLS。Formlabs 的 2025 Year in Review 和 2025
              年 Q4 报告确认，使用强度（每台打印机每期打印零件数）随时间提升，符合部署加深而非一次性购买的特征。扩张路径包括：机群扩张（同一产品线更多打印机）、交叉销售（牙科诊所增加 Form 4BL
              进行高产量生产），以及客户进入新应用后带来的材料扩张。牙科渠道也受益于 Henry Schein 关系；其顾问式销售可让客户接触更多 Formlabs
              能力。公司未发布正式客户队列存活数据；基于资本设备行业基准，模型估算牙科板块（高集成、受监管材料）和制造板块（依赖工装工作流）第 1–3 年年留存率高于 85%，但这些数字需要直接披露才能验证。
