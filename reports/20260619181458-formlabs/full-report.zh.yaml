      - number: '3.3'
        title: 专业树脂竞争者——Carbon DLS
        blocks:
          - type: paragraph
            body: >-
              Carbon 的 Digital Light Synthesis（DLS）技术在机械机理上不同于 Formlabs 的 Low Force Display SLA：DLS
              采用连续液体界面生产（CLIP）流程，利用氧阻聚死区抑制最靠近窗口处的固化，随后通过热双重固化阶段，产出各向同性、全致密、可与注塑件相比的零件。因此 Carbon
              打印零件在各方向具有一致机械性能，这是终端功能件和受监管牙科器械的关键优势。Carbon 完全采用订阅模式，据报道 M3 打印机年成本约 $25,000，包含硬件、软件更新、维护和支持。M2
              ReFLEX（按打印付费）是面向较小牙科实验室的入门选项，手术导板单件价格低至 $7.27。Carbon 与 Keystone 联合生产了超过 one million 个牙科零件，使 Carbon
              成为高产量实验室可信的生产平台。

              Carbon 的牙科覆盖与 Formlabs 有明显重叠：两者都用经过验证的树脂工作流服务牙科实验室和诊所，覆盖导板、义齿、夹板和矫治器。关键差异在价格层级和生产规模：Carbon 订阅（约
              $25K/yr）瞄准每月打印数千个零件、需要终端机械性能的实验室；Formlabs Form 4B（基础价 $7,699）瞄准较小实验室和诊所。Carbon 的封闭材料生态（带双固化化学的专有树脂）与
              Formlabs 的 Open Material Mode 形成对比；后者允许第三方树脂，为价格敏感运营者降低单件成本。不过，Carbon 订阅模式为资本充足的实验室移除了大额前置资本障碍，Carbon
              的生产重复性（M3 上 ±37 µm）也是高产量终端牙科制造中的同类最佳。对 Formlabs 而言，Carbon 的存在表明牙科市场高端正在向生产规模平台靠拢，从而抬高了市场对 Form 4B
              吞吐量和材料认证的预期。
