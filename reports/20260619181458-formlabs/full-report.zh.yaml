  - id: TV002
    title: 投资论点 vs. 反论点
    columns:
      - 支柱
      - 论点（牛市观点）
      - 反论点（熊市反驳）
      - 哪些证据会改变判断
    rows:
      - - 收入质量
        - 硬件 + 耗材 + 服务构成剃刀与刀片模式，130,000+ 台打印机装机基础带来经常性树脂 / 粉末收入
        - 硬件收入一次性确认，耗材又受开放材料模式挤压；Form Now 规模化尚未验证
        - 披露耗材 / 服务收入占比，并证明附着率稳定或增长
      - - 盈利能力
        - FCF 利润率连续 2+ 年 >10% — 在 AM 板块很少见；不像 SPAC 同业那样烧掉资本
        - FCF 利润率建立在未披露收入基数上；8% 特许权使用费和关税逆风未量化；没有 EBITDA 或毛利率数据
        - 经审计 P&L 披露分部毛利率；确认特许权使用费买断或到期
      - - 估值入场
        - 二级市场约 $727M，对应约 3x EV/Revenue — 对一个增长且盈利的硬件平台来说，是合理入场价
        - $2B 一级市场标记对应约 8x EV/Revenue，而上市可比公司只有 1–1.7x，无法支撑；未提交 IPO，也未达成收购
        - 确认低于 $800M 的二级交易；或披露近期 IPO，并给出簿记建档指引
      - - 退出路径
        - Rob Willett（前 Cognex CEO）进入董事会；Natan Linder 使用“enduring platform”表述；收入披露与 IPO 前准备相符
        - 未提交 S-1，未披露 IPO 日期；2026 年硬件独角兽 IPO 队列优先级低于 AI / 基础设施标的
        - 提交 S-1，或确认 M&A 流程并披露估值
      - - 竞争护城河
        - 桌面 SLS 全球出货份额约 55%；Fuse X1 切入工业级；45+ 种材料；专有生态
        - Open Material Mode 侵蚀耗材；Bambu Lab 抢占专业消费者 FDM；中国 SLS 竞争者出现；Stratasys 吸收 Markforged
        - 披露 SLS 市场份额数据，以及按队列年份划分的耗材附着率
      - - IP 与法律
        - 108 项美国实用专利；申请速度提升 >250%；Form 4/Fuse X1 技术不同于专利目标
        - 向 3D Systems 支付 8% 特许权使用费压低利润率；DWS 欧洲专利纠纷自 2018 年以来未解决
        - 确认 3D Systems 特许权使用费期限结束日；获取 DWS 诉讼状态更新和欧盟 IP 律师意见
    notes: 论点和反论点来自截至 June 2026 的公司披露、分析师覆盖和公开可得的竞争者数据。收入和 FCF 数字是已披露下限，不是经审计账目。
