  - id: FU001
    title: Formlabs 客户旅程图——客群、采用触点与扩张循环
    type: journey-map
    layout: wide
    summary: 展示 Formlabs 关键垂直领域买家如何发现、评估、部署，并在硬件—材料—软件生态中扩大使用。
    data:
      nodes:
        - id: j1
          label: 认知 / 发现
          detail: 工程师、牙科专业人士和产品设计师通过行业媒体、行业活动（牙科展、工程展会）、经销商演示、Form Now 零件订单和同行推荐发现 Formlabs。国防 / 工业买家常通过经销商渠道（GSC 等）进入。
          tone: neutral
        - id: j2
          label: 评估 / 样件申请
          detail: Formlabs 在牙科和工程网站上提供免费样件和 ROI 计算器。牙科经销商（Henry Schein）提供现场演示。工程买家通过 PreForm 试用，并对照外包零件成本做基准评估。
          tone: positive
        - id: j3
          label: 首台打印机购买
          detail: >-
            入口机型为 Form 4（$4,499）、Form 4B（$6,299）或 Fuse 1+ 30W（$18,499）。牙科采购通过 Henry Schein（北美）或授权牙科经销商；工程采购通过通用经销商或
            Formlabs 直销。包含一年质保。
          tone: positive
        - id: j4
          label: 活跃生产部署
          detail: PreForm 软件、Dashboard 机群管理和专有树脂把工作流集成做深。材料支出开始出现。牙科诊所增加树脂；制造商增加后处理（Fuse Blast、Form Cure）。使用强度上升。
          tone: positive
        - id: j5
          label: 机群扩张
          detail: 高吞吐用户扩展到多打印机农场（Clove Dental：10× Form 4B；Eaton：209 个站点部署 SLA + SLS）。为提升产能加入大幅面机型（Form 4L、Form 4BL）。材料组合扩大。
          tone: positive
        - id: j6
          label: 摩擦 / 流失风险
          detail: 升级时的材料兼容缺口（Form 3B+ → Form 4B）、严格不退货政策和服务投诉，会带来不满风险。开放材料竞争对手可能吸引价格敏感买家。硬件代际切换（Form 3→Form 4）要求部分牙科工作流重新认证。
          tone: warning
    claimRefs:
      - CU005
      - CU028
      - CU032
      - CU033
      - CU037
