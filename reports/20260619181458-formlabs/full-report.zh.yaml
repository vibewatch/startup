      - number: '4.6'
        title: 公开牵引力指标与私有数据缺口
        blocks:
          - type: paragraph
            body: >-
              2026 年 6 月 Fuse X1 发布新闻稿，是 Formlabs 首次公开披露财务指标：2025 年年收入超过 $250M，并在连续盈利超过两年后实现 >10%
              自由现金流利润率。这些披露由公司陈述，未经审计。相比之下，许多承销和投资判断关键指标要么完全未披露，要么只能靠第三方推断估算。


              已确认的关键指标包括：（1）2025 年收入 >$250M（公司陈述）；（2）FCF 利润率 >10%（公司陈述）；（3）全球售出 130,000+ 台打印机（公司陈述）；（4）打印 500M+
              个零件（公司陈述）；（5）Fuse SLS 在 2025 年 Q4 单位销量同比增长 25%+；（6）Form 4/4L 的 NPS 为 60；（7）累计股权融资 $254M；（8）估值 $2B（最后确定于
              2021 年 5 月）。


              未获得的关键指标包括：（1）硬件、耗材、服务收入拆分；（2）按板块或综合毛利率；（3）在手现金及现金等价物；（4）月度烧钱速度；（5）以月计的现金续航；（6）净收入留存；（7）按板块划分的客户数；（8）获客成本；（9）按地区划分的收入；（10）债务
              / 授信工具条款；（11）收入增长率（2024 vs. 2025）；（12）2021 年 Series E 募资用途。


              对一家 $250M+
              收入公司来说，已披露指标与未披露指标之间的落差异常大。这符合私营公司的常态，但会形成真实尽调风险：买方或投资人若不能进入资料室，就无法独立验证收入质量、毛利可持续性或资本效率。Latka、PitchBook
              等第三方收入数据库对 Formlabs 的收入估算分歧很大（$200M–$750M 区间），进一步说明外部推断并不可靠。
