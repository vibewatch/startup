  - id: TV006
    title: 最终尽调问题
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经审计财务
        - FY2024 和 FY2025 经审计 P&L、资产负债表和现金流；按业务线（硬件、耗材、服务）划分的毛利率
        - 没有分部利润率，FCF 无法核验，收入质量也不透明；耗材利润率是首要估值驱动
        - 直接向 Formlabs CFO / 投资者关系索取；已有可比私营公司披露先例
      - - 3D Systems 特许权使用费
        - 确认特许权使用费协议剩余期限、覆盖产品、年度付款金额和买断经济性
        - 按净销售额收取 8% 特许权使用费，收入 $250M 时意味着每年 $20M+ 拖累；对 FCF、退出倍数和收购方支付意愿影响重大
        - 法律审阅 December 2014 和解协议；查阅 3D Systems 10-K 备案中任何披露；直接与 Formlabs 法律顾问沟通
      - - 股权结构和清算优先权
        - 完整股权结构表，包括 Series E 清算优先权条款、期权池规模、二级交易历史，以及不同退出估值下的隐含稀释
        - 若退出低于 $2B，SoftBank 的 Series E 优先权堆叠可能拿走不成比例的收益；期权池悬垂影响每股经济性
        - 在正式尽调中向公司索取；二级平台可能提示粗略股价和隐含优先权覆盖
      - - 制造布局与关税风险
        - 用于关税敏感性分析的按地区收入；制造设施地点、生产集中度和近期本地化路线图
        - 如果中国制造占生产 >80%，50% 关税率可能把美国销售的硬件利润率压到接近零；这是熊市情景测算的关键
        - 公司披露；海关 / 进口数据库；Stratasys Q1 2026 备案可作为量化关税影响的板块代理
      - - Form Now 与服务轨迹
        - 2026 年推出的 Form Now 服务局月度 GMV 和毛利率；服务层客户留存率和复购率
        - Form Now 是最重要的新收入和倍数扩张杠杆；更高利润率下贡献 5–8% 服务收入，会压低 EV/Revenue 倍数并支撑 4x+ 定价
        - 向公司索取；第三方客户访谈；对标成熟服务局
    notes: 尽调问题按对估值判断的重要性排序。第 1–3 项会阻断任何高于二级市场定价的投资承诺。第 4–5 项对情景概率权重很重要。
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV040
