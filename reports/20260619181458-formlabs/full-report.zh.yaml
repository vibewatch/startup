      - number: '2.5'
        title: 采用约束与市场逆风
        blocks:
          - type: paragraph
            body: >-
              三类采用约束限制 Formlabs 把 TAM 转化为 SAM 的速度。最持久的是流程认证和资质确认：3DPI 2026 Executive Survey 将机器和流程可靠性列为采用障碍第 1
              位，将资质确认和认证列为第 5 位。在医疗、航空航天和汽车应用中，买方必须记录流程控制、材料可追溯性和尺寸符合性——即便是台式系统，也会产生合规开销。ISO 13485 质量管理和 FDA 510(k)
              批准要求，会在硬件技术上可行的情况下仍然限制临床部署速度。

              资本强度和切换成本构成第二类约束。专业桌面 SLA/SLS 系统需要 $3,500–$100,000 的前置硬件支出，再叠加复购材料。Formlabs 的专有树脂盒系统为已在 Formlabs
              硬件上标准化工作流的买方带来显著切换成本，但也让偏好开放材料平台的买方犹豫。BuiltIn 的 2026 年概览指出，Formlabs 通过定价动作和选择性成本纪律守住利润率，说明公司对价格竞争敏感。

              第三类约束是市场成熟信号。Wohlers Report 2026 明确称 AM 行业正在进入成熟阶段，系统硬件仅增长 3.6%，而服务（外包打印）增长
              15.5%——这说明部分买方把需求转向服务机构，而不是投入内部打印机。3DPI Executive Survey 2026 将竞争格局描述为「Darwinian
              filtering」，无法通过机构、经济和运营筛选的企业会被淘汰。对 Formlabs 而言，这意味着 TAM 扩张要求买方投入资本预算，而许多买方当前正把预算推迟到服务机构外包。
