      - number: '7.4'
        title: 财务与估值风险
        blocks:
          - type: paragraph
            body: >-
              Formlabs 最近一次正式估值为 $2 billion，来自 2021 年 7 月由 SoftBank Vision Fund 2 领投的 $150 million Series E。
              此后公司没有进行重大融资轮，也未披露新的估值标记——股权结构记录已陈旧近五年。私人二级市场估计显示，隐含市值显著低于 2021 年峰值， 部分估计提到 60–66% 折价（隐含约 $680-800M
              区间），但这些估计未经 Formlabs 验证。公司现已披露年收入超过 $250 million、自由现金流率高于
              10%，但未披露按业务线划分的毛利率、分部收入、营运资本状况、账面现金或烧钱率，核心承保输入仍不可得。 CEO Lobovsky 2021 年明确表示，公司在 IPO
              上会“慢慢来”，更愿意先打造更可预测、更盈利的业务。2026 年 2 月， Rob Willett（前 Cognex CEO、Nasdaq 资深人士）加入董事会，加剧了 IPO 猜测，但截至 2026 年 6
              月，公司没有宣布 IPO 申报或聘请投行。 行业层面的硬件需求是风险锚：Stratasys 报告 2025 全年收入从 2024 年的 $572.5 million 降至 $551.1 million， 2026
              年 Q1 打印机系统收入同比下降，毛利率从 44.3% 压缩至 41.7%。尽管 Formlabs 声称 2025 年 Q4 创纪录且已盈利， 但它处在同一硬件需求环境中，也面对同样的关税逆风。SoftBank
              Vision Fund 2 敞口是次级财务风险：Vision Fund 2 的投资组合经历了重大减记，虽然 Formlabs
              据称盈利（限制了近期杠杆压力），但投资人分配压力或基金重组可能围绕退出时点制造治理摩擦。 2021 年以来没有第二家大型机构投资者，说明 Formlabs
              不需要外部资本，这有利于运营独立性；但也意味着其估值没有当前价格的机构锚。
