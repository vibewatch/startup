      - number: '7.3'
        title: 运营与供应链风险
        blocks:
          - type: paragraph
            body: >-
              Formlabs 在中国制造其 3D 打印机，CEO Max Lobovsky 曾公开承认，这一选择使公司暴露于美中贸易紧张。2025-2026 年， 美国对中国组装电子和机械产品叠加关税后，有效平均税率约
              33%，部分行业峰值税率超过 100%。这些关税压缩北美硬件销售利润： Stratasys 报告称，仅 2026 年 Q1 关税就拖累盈利 $5.3 million，为 Formlabs
              面临但未披露的行业成本压力提供了直接参照。 据报道，Formlabs 已在 Milwaukee 开设美国区域枢纽，并探索 China+1 制造多元化，但没有已发布计划确认重大产能转移。
              公司主要的深圳制造关系带来单一地域集中风险：任何关税升级、出口限制或双边贸易中断，都可能在不到一个季度内打断生产或显著抬高到岸成本。 材料供应有平行风险：中国供应商在 RAPID+TCT 2026
              上以激进价格主导树脂和粉末，美国增材制造利益相关方已将过度依赖中国材料原料标为战略脆弱点。 对 SLS 产品线而言，nylon 12 和 PA 11 粉末处理会产生 OSHA 监管的可燃粉尘爆炸风险：OSHA 将
              nylon 认定为可燃材料，并要求对产尘作业采取工程控制、清洁管理和接地措施。 NIOSH 另行记录，3D 打印工人会暴露于 SLA 树脂槽产生的超细颗粒和挥发性有机化合物 (VOCs)，并建议使用局部排风和
              PPE。Fuse X1 还依赖氮气： 该打印机需要外部氮气供应来维持 SLS 粉床气氛，增加公用工程成本和物流依赖；除保证工业气体供应连续性外，没有其他缓释路径。 Formlabs 在官网提供所有树脂的
              Safety Data Sheets 和材料指南，这构成最低合规基线。
