      - number: '6.2'
        title: 采用轨迹与装机基数
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年中，Formlabs 累计装机基数超过 130,000 台打印机，已打印 3 亿+ 个零件，并由分布在 8 个全球地点的 750+ 名员工支撑。2025 年 Q4
              是公司有史以来最强季度，所有产品类别的收入、打印机出货和材料销售均创纪录。Fuse SLS 产品线是最突出的增长引擎；随着客户从仅用于原型制作转向工厂车间工装和终端零件生产，该线在 2025 年 Q4
              同比增长超过 25%。牙科组合和大幅面 SLA 系统（Form 4L）也同时达到历史收入高点。Formlabs
              机群管理（Dashboard）的使用数据表明，打印机使用强度随时间上升而非下降，说明现有客户留存和参与深度在增强。采用模式符合经典剃刀与刀片轨迹：初始硬件铺设带动经常性耗材（树脂、粉末）采购，客户运行更多零件、扩充机群后耗材购买继续增长。多个案例研究验证了这一过程：Clove
              Dental 从单台 Form 3B 扩展到 10 台 Form 4B 打印机集群；Eaton 从 SLA 原型制作扩展到覆盖 200 多个制造基地的 SLS
              生产工装。国防承包商、无人机制造商和合同制造商构成较新的客户群，正在工业场景中加速积累 Fuse SLS 机群。
