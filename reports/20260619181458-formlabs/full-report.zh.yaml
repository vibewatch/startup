  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品线地图
        blocks:
          - type: paragraph
            body: >-
              Formlabs 提供垂直整合的专业 3D 打印机组合，覆盖两种核心增材制造技术。SLA 产品线以 Form 4 家族为中心——Form 4（桌面）、Form 4L（大幅面）和 Form 4B（生物相容 /
              牙科）——全部搭载 2024 年 4 月推出的专有 Low Force Display（LFD）打印引擎。Form 4 最高打印速度 100 mm/hour，在 100 µm 层高下平均速度 40
              mm/hour，较前代 Form 3+ 提升 3–5 倍。其成型体积为 20.0 × 12.5 × 21.0 cm。Form 4L 将同一 LFD 引擎放大到 35.3 × 19.6 × 35.0 cm
              成型体积，LED 数量从 Form 4 的 60 颗增加到 145 颗，可在 6 小时内完成满体积打印。Form 4B 是面向牙科和医疗场景设计的生物相容版本，拥有 37 种经验证材料，包括获 FDA
              批准的牙科树脂；印度最大牙科连锁 Clove Dental 使用 10 台 Form 4B 每月生产 50,000 个矫治器。

              SLS 侧，Fuse 1+ 30W 是已成熟的台式平台，成型体积 165 × 165 × 300 mm，配备 30W 镱光纤激光器。2026 年 6 月，Formlabs 推出 Fuse X1，这是一套大幅面工业
              SLS 系统，成型体积 330 × 330 × 565 mm（比 Fuse 1+ 大 7.5 倍），起价 $84,999，不到可比工业 SLS 系统成本的三分之一。Fuse X1
              以前期成本约一半的水平，提供可比工业 SLS 或 HP Multi Jet Fusion 系统 3 倍的吞吐量，并在 24 小时内产出生产级零件。产品组合的补充是 Form Now，Formlabs 的按需 3D
              打印服务，客户无需拥有硬件即可订购零件，包括 Fuse X1 零件。
