        - 评估继任准备度；在投入增量资本前，与董事会沟通过渡计划
    notes: 触发阈值是承销中的指示性惯例，不是 Formlabs 正式政策。监测路径需要通过一手尽调、监管案卷监测和二级市场数据源主动收集数据。
