  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Formlabs 的位置很独特：按出货量看，它是专业 SLA 和 SLS 3D 打印系统最大供应商；但按收入规模看，它仍低于上市工业龙头 Stratasys（NASDAQ: SSYS）和 3D
              Systems（NYSE: DDD）。竞争场域可分为四个有意义的集群：（1）既有工业 OEM（Stratasys、3D
              Systems），拥有宽广的聚合物和金属组合、强服务业务，以及三十年建立的分销足迹；（2）牙科垂直专家（SprintRay、Carbon），其工作流集成和经验证材料瞄准同一批实验室和诊所买方；（3）桌面 SLS
              同行（Sinterit、现已关闭的 Sintratec），它们曾以价格竞争，后来被 Formlabs 的 Fuse 生态挤出；（4）来自 Bambu Lab 的相邻 FDM / 线材压力，到 2026
              年初，Bambu Lab 已拿下 $1,000–$5,000 prosumer 细分超过 40% 份额，但尚未直接攻击 Formlabs 的树脂或 SLS 市场。Wohlers Report 2026 记录全球
              AM 收入（2025 年实际）为 $24.2 billion，打印服务增长 15.5%，机器销售增长 3.6%，进一步强化了 Protolabs 和 Xometry 等服务机构替代品的威胁。行业 M&A
              节奏正在加快：Stratasys 同意以 $42.5 million 收购 Markforged（2026 年 5 月宣布），SprintRay 收购 EnvisionTEC（2025/2026
              年宣布），牙科细分正在整合。这些动作实质性塑造了 Formlabs 的近期竞争环境。
