      - number: '6.6'
        title: 局限、不利证据与流失风险
        blocks:
          - type: paragraph
            body: >-
              公开评价和投诉数据呈现出客户满意度的混合图景。Formlabs 在 Trustpilot 上基于小样本评论约为 2.8/5，投诉集中在退款政策（禁止已开封 /
              已使用设备退货）、客户支持响应慢，以及边缘案例中的产品质量问题。Revdex 投诉确认，Formlabs 对已开封 /
              已使用打印机执行严格不退货政策，这会让后悔购买或早期遇到技术困难的买家不满。Institute of Digital Dentistry 对 Form 4B 的长期临床评测发现，老款 Form 3B+
              可用的一些材料——包括 Dental SG、IBT、Permanent Crown、Soft Tissue 和 Temporary CB 树脂——不支持 Form
              4B，形成兼容性缺口；依赖这些配方的牙科专业人士升级时可能被延迟或复杂化。Open Material Mode 是积极一步，但 Form 4B 发布初期并未提供，需要固件更新。Formlabs 的
              Trustpilot 评分部分受自选择影响（不满买家更可能留下评论）而被压低，但仍显著低于专业用户在 G2 上给 PreForm 软件的 4.8/5
              评分。牙科垂直领域存在集中度风险；鉴于专用牙科产品线、品牌子域名和具名分销合作，该领域被认为贡献了不成比例的收入，尽管 Formlabs
              不披露分部收入。更广泛的设备流失受高切换成本限制，但如果开放材料竞争对手（SprintRay、Asiga）补上牙科树脂兼容性缺口，或老客户抵制周期性硬件更新，流失可能加速。2026 年尚未公开记录客户自行披露从
              Formlabs 转向竞争对手的案例。
