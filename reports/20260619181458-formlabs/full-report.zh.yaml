companyProfile:
  summary: >-
    Formlabs 由 MIT Media Lab 毕业生 Maxim Lobovsky、Natan Linder 和 David Cranor 于 2011 年 9 月创立，率先把专业 3D
    打印做到了可负担价格，并按市场覆盖和出货量成长为全球最大的私营 3D 打印公司。公司总部位于 Massachusetts 州 Somerville，并在
    Berlin、Tokyo、Shanghai、Singapore、Budapest 和 Raleigh（North Carolina）设有办公室。Formlabs 围绕两项核心增材制造技术运营硬件—材料—软件平台：使用专有 Low
    Force Display（LFD）工艺的立体光固化（SLA），以及选择性激光烧结（SLS）。截至 2026 年 6 月，Formlabs 已在全球售出超过 130,000 台专业 3D 打印机，累计生产超过 500 million
    个零件，并披露 2025 年年收入超过 $250 million、自由现金流利润率高于 10%——意味着公司已连续盈利超过两年。公司累计获得约 $254 million 风险投资，最近一轮主融资为 2021 年 5 月由
    SoftBank Vision Fund 2 领投的 Series E（$150 million，投后估值 $2 billion）。
