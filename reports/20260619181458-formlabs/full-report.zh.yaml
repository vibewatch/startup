            body: >-
              唯一公开披露的财务数据点是 2025 年收入超过 $250 million、FCF 率超过 10%。本章所有情景分析都以这些披露下限为基础输入； 8–18% 的收入增长假设来自公开可得的 2025 年 Q4
              增长指标（Fuse SLS 同比 +25%）和 AM 市场增长基准。这些是估计，不是 Formlabs 指引或内部预测。 任何情景都不应被解读为 Formlabs 作出或关于 Formlabs 的前瞻性陈述。
