          description: 舰队扩张、牙科升级、迁移至 Fuse X1、使用 Form Now
        - id: customer-ltv
          label: |-
            客户 LTV
            （多年）
          description: 在中等利用率下，Fuse CLV 可在 3–4 年内超过打印机 ASP
