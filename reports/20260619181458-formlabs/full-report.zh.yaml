      - number: '4.5'
        title: 单位经济模型与营运资本强度
        blocks:
          - type: paragraph
            body: >-
              Formlabs 的单位经济模型由硬件购置成本（“剃刀”）与后续耗材购买流（“刀片”）共同驱动。每卖出一台打印机，就锁定一段持续需求关系：一名 Form 4 用户以 $79/L 购买标准树脂、每月打印 1
              L，单台每年贡献约 $948 耗材收入；若使用 $149/L 的工程树脂，则升至 $1,788。一名 Fuse 1+ 30W 客户每月以 $100/kg 消耗 6 kg Nylon 12 粉末，每年产生
              $7,200 粉末收入，可能在最初 3–4 年内超过 $24,649 的打印机价格。高利用率的工业和牙科客户，单台 CLV 会显著更高。


              牙科板块是单位经济模型最高的一档：Form 4B 起价 $6,299，牙科树脂按适应症不同为 $80–$850/L，临床生产实验室每月可能消耗 10–20+ L。每台装机带来的牙科材料收入，可能远高于标准 SLA
              耗材经济性。公司披露 Form 4 的 NPS 为 60，并已持续盈利 2+ 年，这与装机基数的高留存和高复购率相一致。


              Formlabs 的营运资本强度高于纯软件业务。公司必须承担：（1）跨多个 SKU 和地区的打印机及外设成品库存；（2）45+ 种专有材料的原材料和成品库存；（3）企业与渠道销售形成的应收账款，典型账期为
              net-30–60；（4）硬件产品质保准备金。全球分销网络（办公室位于
              Somerville、Berlin、Tokyo、Shanghai、Singapore、Budapest、Raleigh）意味着营运资本周期横跨多种货币和司法辖区。在 $250M+
              收入规模下，按硬件公司典型比例（收入的 15–20%）估算，正常运营规模需要 $35–50M 营运资本。这与历史募集的约 $254M 中有一部分用于支撑营运资本基础相吻合。
