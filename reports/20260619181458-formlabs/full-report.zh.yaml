      - number: '7.2'
        title: 监管与合规风险
        blocks:
          - type: paragraph
            body: >-
              Formlabs 经营两个合规强度很高的板块：医疗 / 牙科器械，以及军民两用制造技术。医疗器械方面，FDA 的 Center for Devices and Radiological Health (CDRH)
              按与其他器械相同的 Class I/II/III 框架监管 3D 打印医疗器械，多数牙科和医疗产品需要 Premarket Notification (510(k)) 许可。Formlabs 已为多种牙科材料取得
              510(k) 许可，包括用于制作护齿器的 Dental LT Clear Resin V2 和 Dental LT Comfort Resin，以及用于牙科手术导板生产的 Surgical Guide
              Resin。 BioMed Clear Resin 获准用于短期皮肤和组织接触。每个新产品或材料配方变更都需要单独提交，给牙科产品发布带来持续监管工作和潜在上市延迟风险。 FDA 已发布 Technical
              Considerations for Additive Manufactured Devices 指南，对制造商施加额外的文件、设计和测试要求。 若不符合 FDA 510(k)
              要求，可能触发警告信、同意令、召回或禁令，并对牙科垂直领域收入造成实质影响；牙科也是 Formlabs 增长最快的板块。出口管制方面，Formlabs 的 SLS Fuse
              平台越来越多被国防承包商、无人机制造商和航空航天客户用于终端零件生产。 能生产结构性航空航天零件的 SLS 设备可能受 Export Administration Regulations (EAR)
              约束，部分国防相关 3D 打印应用可能需要按 International Traffic in Arms Regulations (ITAR) 审查。Formlabs 未公开任何出口管制合规计划，但考虑到其覆盖
              100+ 个国家的分销足迹和不断增长的国防客户群， 任何分类缺口都会带来法律和声誉风险。California Proposition 65 警示义务也可能适用于在加州销售的部分树脂配方。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
