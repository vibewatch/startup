      - number: '5.2'
        title: 核心打印技术架构
        blocks:
          - type: paragraph
            body: >-
              Form 4 的 LFD 打印引擎在 Masked Stereolithography（MSLA）架构中结合 60 颗 LED、准直透镜、先进光学滤镜和柔性薄膜料槽。Backlight Unit
              生成均匀的超高功率面投影光，可以在 50 micron XY 分辨率下同时固化整层截面，层厚范围为 25–300 microns。Z 轴力传感器监测每一层剥离力，并自动调整 Z
              轴运动，尽量降低分离步骤中零件受力；这一传感器驱动方法，是实现 98.7% 独立测得打印成功率的基础。树脂料槽在使用任何 Formlabs 材料时额定寿命为 75,000+ 层。配备专利 Quick
              Release Technology 的 Build Platform Flex，可在数秒内无工具取件。

              LFD 承接了 Formlabs 在 2019 年随 Form 3 推出的 Low Force Stereolithography（LFS）技术。LFS 使用柔性料槽和线扫描激光（Light Processing
              Unit），相比传统固定底 SLA 降低剥离力。LFD 用 LED/LCD 阵列取代激光 / LPU 模块，在保留柔性料槽剥离力优势的同时，大幅加快固化速度。Form 4L 使用同一引擎，并放大到 145 颗
              LED。

              Fuse 1+ 使用 30W 镱光纤激光器烧结尼龙粉末，不需要支撑结构，因此可实现很高的零件堆叠密度。Fuse X1 在此基础上升级为 13 个独立热区，并通过 Adaptive Thermal Control
              每秒处理比 Fuse 1+ 多 700 倍的热数据，使体积堆叠密度达到 30%+；相比之下，HP Multi Jet Fusion 为 10–15%，传统大幅面 SLS 约 20%。AI 驱动的 Print
              Intelligence 借助计算机视觉和实时热成像，在打印过程中检测并排除缺陷零件，减少材料浪费和周期时间损失。
