      - number: '1.5'
        title: 里程碑与负面事件
        blocks:
          - type: paragraph
            body: >-
              从创立到 2026 年 Fuse X1 发布，Formlabs 经历了多个关键里程碑。2012 年 10 月，Form 1 的 Kickstarter 活动从 2,068 名支持者处筹得
              $2,945,885，验证了专业桌面 SLA 作为市场类别的可行性，并建立了公司品牌。早期一项重要负面事件是 2012 年 11 月 3D Systems 提起诉讼，称 Formlabs
              侵犯覆盖立体光固化打印流程的专利；该诉讼于 2014 年 12 月和解，Formlabs 同意就产品销售支付 8% 权利金。这带来了持续财务负担，也把 IP 暴露变成公司早期经营画像中的结构性特征。

              公司的融资轨迹——Series A（2013）、B（2016）、C（2018）、NEA 轮（2018）和 Series E（2021）——对应其从桌面打印专家扩张为多技术制造平台的过程。关键产品发布包括 Fuse
              1 SLS 打印机（全球首款台式 SLS）、Form 4（2024 年 4 月，性能大幅跃升）和 Fuse X1（2026 年 6 月，工业规模 SLS）。2025 年 7 月收购 Wisconsin 州 SLS
              初创公司 Micronics，是公司首次披露的收购，扩展了 SLS 技术和团队。2026 年 2 月的董事会更新（Willett 加入、Bass 退出）是 2021 年 Series E
              以来最突出的治理事件，并引发外界关于 IPO 准备的公开猜测；不过 Formlabs 尚未确认任何上市计划。CEO Lobovsky 在 2021 年表示，公司只有在「really ready to be an
              excellent public company」时才会上市。

              截至 2026 年 6 月，公开记录中未发现涉及 Formlabs 的重大监管执法、产品召回或数据泄露。记录中的主要负面事项是历史上的 3D Systems 专利诉讼（已和解），以及市场对更广泛 SPAC 驱动
              3D 打印行业崩塌（Desktop Metal、Markforged、Velo3D）的批评；Formlabs 则通过保持私有和盈利穿越了该周期。
