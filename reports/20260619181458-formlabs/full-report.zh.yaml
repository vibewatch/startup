      - number: '5.4'
        title: 软件、工作流与机群管理
        blocks:
          - type: paragraph
            body: >-
              PreForm 是 Formlabs 面向 Windows 和 macOS
              的免费打印准备软件。它提供一键自动生成支撑、带实时可打印性预览的可打印性检查、自适应层厚、自动定向，以及包含预计时间和材料用量的作业信息。针对 Fuse SLS 平台，PreForm 增加自动 3D
              排布，以最大化成型仓利用率并减少粉末浪费。软件支持 STL、OBJ 和 3MF 文件，并可原生导入 STEP、SolidWorks（.SLDPRT）、CATIA、Creo、JT 等 CAD
              格式，无需额外导出步骤，从而消除 CAD 到打印工作流中的常见摩擦点。PreForm 针对每一种 Formlabs 材料预先验证打印设置，高阶用户可为 Open Material Mode
              打印自定义曝光、层高和其他参数。

              Formlabs Dashboard 是基于 Web 的机群管理平台，提供远程打印状态监控、打印机健康跟踪、作业队列管理、材料用量分析、邮件和 SMS
              警报、按团队或项目分组打印机，以及订单历史。Dashboard 的摄像头集成支持实时打印监控和历史延时视频回看。对企业用户而言，Dashboard 把多台设备的可见性集中起来，降低操作员负担。Formlabs 的
              GitHub 组织托管 504+ 个公开仓库，包括 API 工具包和内部工程工具，显示出活跃的开发者软件存在感。Formlabs Community Forum
              则作为从业者社区渠道，提供工作流支持和用户贡献的最佳实践。
