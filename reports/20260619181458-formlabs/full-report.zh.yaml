  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律与知识产权风险
        blocks:
          - type: paragraph
            body: >-

              Formlabs 仍背着两段历史上重要、也仍会影响风险承保的专利纠葛。2012 年 11 月，3D Systems 起诉 Formlabs，指称其侵犯立体光刻工艺专利——这是桌面 3D
              打印时代最早的一批专利诉讼之一。两年诉讼后，双方在 2014 年 12 月和解，条款披露在 3D Systems 的 Form 8-K 中：Formlabs 同意就 Formlabs 产品净销售额支付 8.0%
              的全球、非独占、有偿许可费。3D Systems 的 SLA 核心专利（编号 5,597,520，1997 年授权）已在 2017
              年到期，与该专利绑定的和解有效期也已过去；但许可结构和版税义务可能延伸至和解包内的相关专利，且没有公开声明确认当前 Form 4、Form 4B 或 Fuse X1 产品上的版税已完全消灭。这笔版税构成持续的
              COGS 拖累，应在尽调中确认。第二， DWS S.r.l.（意大利）自 2017 年起对 Formlabs 提起专利侵权诉讼，主要针对 Form 2 打印机的加热系统。2018 年 8 月，德国曼海姆法院裁定
              Form 2 侵犯 DWS 欧洲专利 No. 8,945,456 在德国部分所覆盖的 SLA 加热系统。随后 DWS 于 2018 年 11 月在美国提出反诉，寻求损害赔偿和禁令。Form 3、Form 4 和
              Form 4B 使用不同的 Low Force Display (LFD) 技术，可能不受同一加热专利约束，但截至 2026 年，公开记录中的诉讼状态仍未解决。Formlabs 以一个 108
              项美国专利组合反制（到 2025 年有 108 项授权，过去五年申请速度 +250%），在 SLA、SLS、材料和软件上形成防御性 IP 深度，按 PlainPatent 的 Innovation
              Score（50.7/100）位列其跟踪受让人的前 12%。
