      - number: '8.7'
        title: 附录
        blocks:
          - type: callout
            title: Track——不要按 2021 年一级估值买入
            body: >-
              Formlabs 是一家优质公司，有真实收入、已证明的 FCF 和强市场地位。但 $2 billion 一级轮估值意味着在已披露 $250M+ 收入上约 8x EV/Revenue——超过当前公开 AM
              同行区间的四倍。二级市场价格（约 $727M、约 64% 折价）是更可信的近期锚。建议为 Track： 监测 EV $800M 或以下的二级入场机会，前提是有新鲜的经审计财务和披露的退出时间表。
            calloutType: recommendation
