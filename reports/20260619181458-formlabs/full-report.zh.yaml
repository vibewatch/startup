      - number: '8.4'
        title: 情景分析——牛市、基准与熊市估值
        blocks:
          - type: paragraph
            body: >-
              三个情景界定 Formlabs 的估值区间，均锚定公开披露输入（>$250M 收入、>10% FCF 率），并采用保守扩张假设。下列估计明确标注为模型， 不是公司披露数据，仅用于约束入场价格纪律。

              基准情形下，估计 Formlabs 2026 年收入约 $265–$275 million（较已披露的 2025 年 $250M+ 增长 8–10%，与 2025 年 Q4 创纪录结果一致）。采用 3.0x
              EV/Revenue 倍数——相对 AM 同行有溢价，以反映 Formlabs 的盈利能力、耗材组合和市场领导地位——隐含企业价值约 $795–$825 million。按 30x FCF 和估计 $27–$28
              million FCF（>$270M 的 10%）计算，隐含 EV 约 $800–$840 million。基准情形收敛在约 $800–$850 million，大体符合二级市场约 $727M
              信号，并加入适度溢价反映增长轨迹。

              牛市情形下，2026 年收入达到 $285–$295 million（增长 14–18%，与 Fuse SLS 板块 2025 年 Q4 25%+ 运行率一致）， FCF 率借运营杠杆扩至 14–15%，IPO
              或收购溢价将退出倍数抬至 4.5–5x EV/Revenue 或 40x FCF。这隐含 EV 为 $1.28–$1.48 billion——仍显著低于 $2B 一级估值，但相对二级市场成交价有 75–105%
              上行空间。

              熊市情形下，倍数压缩使 Formlabs 与其上市 AM 同行看齐，在 $250 million 收入上按 1.5x EV/Revenue 计，隐含企业价值约 $375
              million。触发这一情形的组合包括：收入增长停滞在 5% 以下、关税升级挤压硬件利润、IPO 市场环境恶化（没有 AI / 基础设施溢价可捕获）， 或资金充足的工业竞争者激进入场并挤占 SLS
              市场份额。在这些水平上，以 $2B 一级估值进入的投资者将面临超过 80% 的损失。

              对三个情景做概率加权，粗略给牛市 15%、基准 65%、熊市 20% 权重，得到的隐含 EV 约 $690–$740 million——与二级市场折价一致， 支持“跟踪 / 继续研究”立场，而不是按 2021
              年一级估值买入。
