      - number: '8.6'
        title: 建议、估值立场与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              建议：Track。建议不是在 $2 billion 一级轮估值上 Buy，也不是因底层业务质量而 Avoid。Formlabs 是存活下来的私营 AM 公司中最强的一批——盈利、增长，且拥有耐久装机基础。 但
              $2B 入场价格无法被现有证据支撑。一级估值隐含的 EV/Revenue 倍数约 8x，是可比公开市场倍数（Stratasys 约 1x、3D Systems 约 1.67x）的四倍以上，
              并依赖收入加速和软件增强论点，而公开披露尚未证明这一点。约 $727M 的二级市场价格是更可信的入场纪律锚。

              估值立场：按 $2B 一级估值看偏贵；在 $700–$900M 二级市场区间可能合理；若在二级平台或谈判交易中低于 $700M，且相对 2021 年独角兽估值有实质折价， 则可能有吸引力。

              本建议置信度为中，原因是缺少分部层面财务、毛利率披露和经审计资产负债表。风险评级为高，主要由陈旧估值风险（一级估值与二级价格之间巨大差距）、中国制造带来的关税敞口、 8%
              版税负担以及牙科平台集中风险驱动。若要将建议上调至 Buy，需要新鲜的经审计财务、披露的退出时间表，以及低于 $800M 的二级市场价格。

              最终尽调问题（按重要性排序）：(1) FY2024 和 FY2025 经审计 P&L 与资产负债表，包括按业务线划分的毛利率；(2) 确认 3D Systems 版税范围、剩余期限和买断经济性；(3)
              股权结构表，显示清算优先权、期权池和二级交易；(4) 确认按地域和垂直领域划分的收入，用于关税敏感性建模； (5) Form Now 和制造服务收入管线；若证明具备经常性，该收入将从结构上支撑更高退出倍数。
            claimRefs:
