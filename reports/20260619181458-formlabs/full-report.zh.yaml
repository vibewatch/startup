      - number: '1.4'
        title: 产品、规模与商业模式
        blocks:
          - type: paragraph
            body: >-
              Formlabs 的产品组合横跨两项核心技术下的桌面和工业 3D 打印机。SLA 产品线包括 Form 系列（Form 1 至 Form 4、Form 3L/4L 大幅面系统、Form 4BL
              生物相容版本、Form Auto 自动化系统），使用 2024 年 4 月随 Form 4 推出的专有 Low Force Display（LFD）打印引擎。Form 4 垂直打印速度最高可达 100
              mm/hr，多数任务可在两小时内完成——约为 Form 3+ 的五倍。SLS 产品线包括 Fuse 1、Fuse 1+ 30W，以及 2026 年 6 月推出的 Fuse X1；Fuse X1
              是大幅面系统，成型体积 330×330×565 mm，起售价 $84,999。

              对一家私营硬件公司而言，截至 2026 年 6 月的规模指标相当可观：售出 130,000+ 台打印机，客户打印零件 500+ million 个（据 2026 年 2 月新闻稿），2025 年年收入超过
              $250 million，员工 750+ 人，专有材料 45+ 种。Formlabs 的 Fuse SLS 产品线在 2025 年 Q4 同比增长超过 25%，并占 2025 年全球所有已售 SLS 3D
              打印机的 55%。知名企业客户包括 Ford（EV 原型开发）、Tesla（Fuse X1 早期访问）、Mayo Clinic、Northwell Health、Google 和 New Balance。

              商业模式沿着硬件—材料—软件栈展开。打印机硬件提供装机入口；只要客户持续打印，专有树脂和 SLS 尼龙粉末就带来复购型耗材收入。PreForm 软件、后处理硬件（Form Wash、Form
              Cure）和自动化配件（Fuse Sift、Fuse Blast、Form Auto）进一步加深生态锁定。2025 年，Formlabs 还在美国推出在线 3D 打印服务 Form Now。Fuse X1
              发布材料披露，Formlabs 已连续盈利超过两年，自由现金流利润率高于 10%——在资本密集型亏损普遍存在的行业中，这是一个显著差异。
