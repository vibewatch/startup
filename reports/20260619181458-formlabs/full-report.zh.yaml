    approximationNotes: >-
      所有数值均为分析师估计，来源包括：（1）专业资本设备行业基准（医疗器械、实验室仪器和工业机械类比显示，深度集成设备年度留存率为 80–95%）；（2）Formlabs 案例研究中可观察到的机群扩张模式（Clove
      Dental、Eaton）；（3）截至 2026 年 6 月，公开来源中没有记录的大规模流失事件。数值存在 ±10 个百分点的高不确定区间。牙科模型值较高，原因是监管合规、已验证材料要求和 Henry Schein
