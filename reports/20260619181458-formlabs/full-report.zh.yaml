              2021 年 5 月 Series E 估值定在成长股权倍数峰值，反映的是已经不存在的市场条件。SoftBank Vision Fund 2 的更广泛投资组合经历了实质减记。 Klarna IPO
              较私人估值峰值折价 67%，Markforged 以 0.6x 收入被收购，共同确认 AM 和独角兽生态不会在退出时承认旧年份定价。 任何按 $2B 一级估值持有 Formlabs
              的投资者，都应把入场建模为仿佛按二级市场成交价（约 $727M）买入，而不是按一级标题估值。
            calloutType: risk
