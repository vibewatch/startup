            title: 盈利能力是真实且稀缺的差异化
            body: >-
              Formlabs 的 >10% FCF 率持续超过两年，在 AM 行业非常突出。直接可比公司 Stratasys 和 3D Systems 近年未实现稳定 GAAP 盈利， SPAC 上市 AM
              队列则完全毁灭资本。FCF 转正确认硬件-耗材刀片刀架模型已在规模上跑通，并降低融资风险，使 Formlabs 能抵御压垮同行的资本市场逆风。 这一质量属性支持其相对 1–1.67x 的公开 AM
              同行倍数获得溢价，也是基准情形采用 3x EV/Revenue 假设的主要依据。
