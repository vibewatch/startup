      - number: '1.2'
        title: 领导层、董事会与治理
        blocks:
          - type: paragraph
            body: >-
              Formlabs 由联合创始人兼 CEO Maxim Lobovsky 领导，他自创立以来一直担任公司首席执行官。Lobovsky 是主要的技术与商业发言人，凭借 MIT Media Lab 和 Fab@Home
              背景，创始人与市场匹配度较强。另一位联合创始人 Natan Linder 担任董事长；他还联合创立了制造运营平台 Tulip。第三位联合创始人 David Cranor
              在创立后公开曝光较少，但仍与公司的技术源头相关联。

              董事会由投资方代表和独立运营者组成。Jeff Immelt（General Electric 前董事长兼 CEO）在 2018 年 8 月 NEA 融资后加入董事会。Deep Nishar（SoftBank
              Investment Advisers 管理合伙人，后来加入 General Catalyst）在 2021 年 Series E 后出任董事，Kirthiga Reddy 代表 SoftBank
              担任董事会观察员。Brad Feld（Foundry Group）和 Barry Schuler（DFJ Growth）代表更早期机构投资者。2026 年 2 月，Rob Willett
              被任命为董事；他曾任机器视觉自动化公司 Cognex Corporation 首席执行官，而 Cognex 自 1989 年起公开交易。他加入董事会的同时，自 2017 年起担任董事的 Carl
              Bass（Autodesk 前 CEO）卸任。行业观察者认为，这次治理层更新符合上市准备节奏，并指出 Willett 拥有 18 年运营上市工业硬件公司的经验，经历过多个财报周期。

              关键人物风险集中在 Lobovsky 身上：他是唯一被点名的 CEO，是所有重大公告中引用的主要产品愿景负责人，并自创立以来持续担任最高职位。经验丰富的工业运营者 Willett
              加入后，部分缓解了治理集中问题，但联合创始人层以下的继任规划和领导梯队深度并未公开披露。
