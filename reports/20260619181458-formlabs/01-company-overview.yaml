  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: capitalization table
      missingEvidence: >-
        Full cap table including equity percentages for all investors, co-founders, and
        employees; preferred stock terms, liquidation preferences, and anti-dilution provisions;
        management voting rights versus economic rights structure.
      whyItMatters: >-
        Equity ownership concentration and liquidation preference stack determine effective
        control, dilution risk in future rounds, and per-share economics in any exit scenario.
      diligencePath: >-
        Request cap table and term sheets directly from Formlabs management during formal
        diligence; cross-check with Series E term sheets from SoftBank.
      relatedQuestionRefs:
        - QO003

    - type: private-evidence-only
      severity: material
      topic: financials
      missingEvidence: >-
        Audited annual financial statements showing gross margin, operating margin, EBITDA,
        ARR/recurring revenue split, net revenue retention from materials, and actual R&D
        spend. The company disclosed revenue and FCF margin directionally but has not published
        audited accounts.
      whyItMatters: >-
        Without audited financials, all revenue and profitability claims rest on company
        self-disclosure. Gross margin profile (hardware vs. materials vs. software) is
        critical to valuation methodology.
      diligencePath: >-
        Request audited financials and management accounts; obtain breakdown of hardware,
        materials, and services revenue; verify FCF margin calculation methodology.
      relatedQuestionRefs:
        - QO006
        - QO019

    - type: stale
      severity: material
      topic: valuation
      missingEvidence: >-
        Updated post-money valuation reflecting any market value change since May 2021. The
        $2B figure is five years old and preceded significant sector-wide de-ratings of
        additive manufacturing companies (Desktop Metal, Markforged, Velo3D all lost 80%+
        of value post-SPAC).
      whyItMatters: >-
        A stale $2B valuation may not reflect current market conditions. Multiples for
        hardware/materials businesses at this scale have compressed since 2021.
      diligencePath: >-
        Seek updated 409A valuation or board-approved internal valuation; model comparable
        revenue multiples from public AM peers and adjacent industrial tech companies.
      relatedQuestionRefs:
        - QO003
        - QO019

    - type: missing-source
      severity: minor
      topic: key-person succession
      missingEvidence: >-
        Any documented CEO succession plan, named deputy CEO or President, or organizational
        depth below co-founder layer for key engineering and commercial functions.
      whyItMatters: >-
        Lobovsky has been CEO since 2011 and is cited in all major announcements. Any
        transition risk or concentration is material for a hardware company with complex
        manufacturing and R&D dependencies.
      diligencePath: >-
        Request organizational chart and leadership bios from management; assess depth of
        SVP/VP layer in engineering, commercial, and operations.
      relatedQuestionRefs:
        - QO018

    - type: missing-source
      severity: minor
      topic: ipo planning
      missingEvidence: >-
        Confirmed SEC S-1 filing, formal management statement on IPO timeline,
        appointment of investment bank underwriters, or secondary transaction evidence
        that would confirm active IPO preparation as of June 2026.
      whyItMatters: >-
        IPO readiness affects exit visibility for existing investors and introduces
        disclosure obligations, lock-up dynamics, and market-timing risk for prospective
        investors. The most recent public CEO comment on IPO (2021) predates the current
        operating context.
      diligencePath: >-
        Monitor SEC EDGAR for S-1 or S-1/A filings; seek direct management comment
        on listing plans; review recent secondary market activity in Formlabs shares
        via platforms such as EquityZen or Forge.
      relatedQuestionRefs:
        - QO025

    - type: private-evidence-only
      severity: material
      topic: stakeholder or investor map completeness
      missingEvidence: >-
        Full investor registry confirming equity ownership percentages, preferred share
        classes, and anti-dilution provisions for all historical and current investors.
        The public record covers named lead investors from press releases but does not
        reveal minor-stake investors, secondary purchasers, or LP-level SoftBank exposure.
      whyItMatters: >-
        An incomplete investor map prevents reliable assessment of governance alignment,
        blocking-stake concentration, or conflicted-director situations. SoftBank's
        Vision Fund 2 co-investor structure is particularly opaque.
      diligencePath: >-
        Request full cap table with preferred stock register and investor rights agreement
        from management; cross-check against any Series E term sheet disclosures.
      relatedTableRefs:
        - TO003

