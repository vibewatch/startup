  - id: products-scale
    title: Products, Scale, and Business Model
    body: >-
      Formlabs' product portfolio spans desktop and industrial 3D printers across two core
      technologies. The SLA line includes the Form series (Form 1 through Form 4, Form 3L/4L
      large-format systems, Form 4BL biocompatible variant, Form Auto automation system) using
      the proprietary Low Force Display (LFD) print engine introduced with Form 4 in April 2024.
      The Form 4 delivers print speeds up to 100 mm/hr vertical and can complete most jobs in
      under two hours — approximately five times faster than the Form 3+. The SLS line includes
      the Fuse 1, Fuse 1+ 30W, and the Fuse X1 (launched June 2026), a large-format system
      with a 330×330×565 mm build volume priced from $84,999.

      Scale metrics as of June 2026 are significant for a private hardware company: 130,000+
      printers sold, 500+ million customer-printed parts (per February 2026 press release), annual
      revenue exceeding $250 million in 2025, 750+ employees, and 45+ proprietary materials.
      Formlabs' Fuse SLS line grew more than 25% year-over-year in Q4 2025 and accounted for
      55% of all SLS 3D printers sold worldwide in 2025. Notable enterprise customers include
      Ford (EV prototyping), Tesla (Fuse X1 early access), Mayo Clinic, Northwell Health,
      Google, and New Balance.

      The business model follows a hardware-materials-software stack. Printer hardware provides
      the installed-base entry point; proprietary resins and SLS nylon powders generate recurring
      consumables revenue as long as customers are printing. PreForm software, post-processing
      hardware (Form Wash, Form Cure), and automation accessories (Fuse Sift, Fuse Blast, Form
      Auto) extend the ecosystem lock-in. In 2025, Formlabs also launched Form Now, an online
      3D printing service in the US. The Fuse X1 launch materials disclosed that Formlabs has
      maintained profitability for more than two years with a greater-than-10% free cash flow
      margin — a notable distinction in an industry marked by capital-intensive losses.
