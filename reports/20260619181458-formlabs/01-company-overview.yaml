company:
  name: Formlabs
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Formlabs, founded in September 2011 by three MIT Media Lab graduates, pioneered
    affordable professional 3D printing and has grown into the world's largest privately held
    3D printing company. With approximately $254 million raised at a $2 billion valuation and
    annual revenue exceeding $250 million in 2025, Formlabs has built a durable
    hardware-materials-software platform across SLA and SLS technologies serving healthcare,
    engineering, manufacturing, and education.

sections:
  - id: company-identity
    title: Company Identity and Founding
    body: >-
      Formlabs is a professional 3D printing technology developer and manufacturer headquartered
      in Somerville, Massachusetts. Founded in September 2011 by Maxim Lobovsky, Natan Linder,
      and David Cranor — all graduate students at the MIT Media Lab — the company was
      established with the mission of democratizing access to professional-grade digital
      fabrication. The founders met while taking the MIT Media Lab course "How to Make
      (almost) Anything" and drew on experience with MIT's Center for Bits and Atoms Fab Lab
      program, as well as Lobovsky's prior work on the Fab@Home open-source 3D printer project
      at Cornell University.

      Formlabs focuses on two core additive manufacturing technologies: stereolithography (SLA),
      which uses laser or LCD-based photopolymerization of liquid resin to produce high-resolution
      parts, and selective laser sintering (SLS), which sinters nylon powder to create durable,
      functional parts without support structures. The company's ecosystem encompasses printers,
      proprietary materials (45+ resins and powders), and PreForm design and workflow software.
      As of June 2026, Formlabs operates from at least eight global locations including Somerville
      (HQ), Berlin, Tokyo, Shanghai, Singapore, Budapest, and Raleigh (North Carolina).

      Formlabs is described as the largest professional 3D printing company founded since the
      1980s and the number-one seller of professional SLA and SLS printers worldwide. The company
      remains privately held as of June 2026 and does not publish audited financials. Its
      disclosed metrics — 130,000+ printers sold, 500+ million parts printed, and $250M+ annual
      revenue in 2025 — position it among the largest players in the global additive manufacturing
      industry. The business model combines one-time hardware revenue with recurring consumables
      (resins and powders) and software, creating a razor-and-blades structure that management
      has cited as a driver of sustained profitability.
