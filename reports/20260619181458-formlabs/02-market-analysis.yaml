callouts:
  - calloutType: strength
    title: SLS Market Dominance Creates High-Loyalty Materials Base
    body: >-
      Formlabs' reported 55% global share of professional desktop SLS printer shipments, combined with
      the shift of those customers from prototyping to end-use production, creates a compounding
      materials-revenue base. Each additional Fuse printer deployed in a production context generates
      consistently higher annual powder consumption than a prototyping deployment, increasing lifetime
      customer value without requiring a new hardware sale.
    claimRefs:
      - CM026
      - CM028
      - CM029

  - calloutType: risk
    title: AM Market Maturity Signal May Constrain Hardware TAM Expansion
    body: >-
      Wohlers Report 2026 documents that hardware system sales grew only 3.6% in 2025 while AM services
      grew 15.5%, indicating that buyers increasingly prefer outsourcing to service bureaus rather than
      purchasing in-house equipment. If this trend continues, the addressable hardware TAM for Formlabs
      grows more slowly than headline AM market figures suggest. Formlabs must therefore compete not
      only with rival printers but with the service-bureau outsourcing alternative in each new customer
      engagement.
    claimRefs:
      - CM011
      - CM039
      - CM040

