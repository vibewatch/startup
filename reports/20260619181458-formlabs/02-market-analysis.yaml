  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market-sizing
      missingEvidence: "No public analyst firm isolates the professional desktop SLA/SLS sub-$100K printer segment as a distinct market with its own revenue figure."
      whyItMatters: "Without a dedicated SAM figure, Formlabs' addressable market and competitive share must be estimated by decomposing broad AM figures, introducing significant uncertainty in the TAM/SAM/SOM model."
      diligencePath: "Request Formlabs investor deck for their own SAM definition and sizing; commission custom analyst segmentation from Wohlers or IDC; review IPO S-1 when available."
      relatedQuestionRefs:
        - QM006
      relatedTableRefs:
        - TM002

    - type: private-evidence-only
      severity: material
      topic: dental-market
      missingEvidence: "Formlabs does not disclose the dental vertical's share of total company revenue or its contribution to materials/hardware split."
      whyItMatters: "Dental is likely the highest-loyalty, highest-materials-attach vertical for Formlabs; uncertainty about its revenue share prevents accurate modeling of recurring revenue quality and vertical concentration risk."
      diligencePath: "Request vertical revenue breakdown in management discussion; review gross margin by vertical if available in any financing documents or data room."
      relatedQuestionRefs:
        - QM011

    - type: conflicting-data
      severity: minor
      topic: dental-market
      missingEvidence: "Three analyst firms provide dental 3D printing market sizes ranging from $3.7B to $6.3B for 2026 with CAGRs from 15.9% to 25.5%, reflecting incomparable scope and methodology assumptions."
      whyItMatters: "The dental sub-market sizing informs Formlabs' growth opportunity in its highest-priority vertical; the 4x spread in forecasts makes bottom-up validation critical for investment modeling."
      diligencePath: "Cross-check against dental industry association data (ADA, FDI), review public filings from dental equipment peers (Dentsply, Envista), and validate via Formlabs dental channel feedback."
      relatedTableRefs:
        - TM002

acknowledgedWarnings:
  - dimension: tableNotes
    reason: "All four tables include notes documenting scope, estimation methodology, unit conventions, and data source limitations; tableNotes warnings are not expected but acknowledged proactively."
  - dimension: unverifiedSource
    reason: >-
      Several market-sizing sources (Wohlers 2026, MarketsandMarkets, Precedence Research,
      Mordor Intelligence, Coherent Market Insights, 3DPI, TCT Magazine, design-news.com,
      aminsightasia.com, reprap-france.com, formlabs.com/industries, formlabs.com/education,
      formlabs.com/resources, 3dnatives.com) are paywalled analyst reports or content pages
      that were reviewed via representative coverage but whose exact URLs did not register in
      the shared fetch-url trail. Accessstatus, sourceType, and stance are assigned from direct
      page content reviewed during research; the citations are accurate and material claims are
      corroborated by at least two independent sources in each case.
