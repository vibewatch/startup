callouts:
  - calloutType: "insight"
    title: "Low-Cost Credit Access vs. Balance Sheet Protection"
    body: "Kikoff's operational architecture decouples credit reporting from traditional balance-sheet lending risk. By reporting a revolving credit tradeline ($750 to $3,500) that can only be utilized for internal digital services, Kikoff provides credit bureau seasoning without extending cash advances or absorbing underwriting charge-off exposure."
    claimRefs:
      - "CO002"
      - "CO007"
  - calloutType: "risk"
    title: "Credit Reporting Accuracy as Primary Regulatory Vulnerability"
    body: "With 55.6% of its 7,101 CFPB consumer complaints citing incorrect information on consumer reports, Kikoff's automated furnishing pipeline faces ongoing operational and legal risk under the Fair Credit Reporting Act. Ensuring tradeline closure and dispute processing keeps pace with user acquisition remains a critical operational priority."
    claimRefs:
      - "CO006"
