  topStrengths:
    - 消费者覆盖面大，且在信用记录薄弱人群和零工群体中能看到信用评分提升。
    - 低门槛的多层级订阅模式，并通过非贷款业务变现。
    - 资本效率高，不承担传统资产负债表放贷风险。
  topRisks:
