    - 依赖征信机构报送和银行扣款流程，带来运营及监管风险。
  unresolvedGaps:
    - 按套餐层级拆分的当前 ARR、付费订阅用户数、留存、流失和群组经济性。
    - 核心订阅业务相较于相邻产品的毛利率、服务成本、CAC、LTV 和现金跑道。
    - 2025 年 1 月估值背后的确切条款，包括工具类型、投资者保护措施，以及该估值来自一级还是二级交易。
    - 债务协商、征信报送准确性和订阅计费方面的投诉解决率、退款结果及面向监管机构的控制措施。
