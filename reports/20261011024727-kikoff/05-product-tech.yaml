    title: Product Architecture Map
    type: stack
    summary: >-
      Architectural layers comprising Kikoff's client surfaces, tradeline engine, bureau furnishing pipeline, and
      enterprise B2B embedded platform.
    approximationNotes: >-
      Architecture layers synthesized from public technical disclosures, API documentation, and regulatory filing
      details.
