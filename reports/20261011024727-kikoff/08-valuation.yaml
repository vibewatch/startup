callouts:
  - calloutType: recommendation
    title: 'Diligence Recommendation: Research-More'
    body: Kikoff warrants a research-more stance rather than a capital commitment, pending verified cohort retention, churn metrics, and audited revenue statements that justify the $1.0B private valuation.
    claimRefs:
      - CV006
      - CV007
      - CV008
  - calloutType: risk
    title: Regulatory Complaint Acceleration
    body: CFPB complaint volume expanded 162% in 2025 to 2,740 filings, predominantly focused on credit reporting disputes, presenting ongoing compliance and servicing risk.
    claimRefs:
      - CV005
      - CV013
  - calloutType: insight
    title: Valuation Disconnect from Public Fintech Multiples
    body: At a reported $1.0B valuation, Kikoff trades at over 80x its last known annual revenue figure of $11.7M, compared to mature public fintech comparables trading between 2x and 6x revenue.
    claimRefs:
      - CV003
      - CV009
      - CV010
