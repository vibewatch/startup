    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Valuation / Stance
      - Decision Implication
    rows:
      - - Recommendation
        - research-more
        - stretched
        - Defer equity participation until verified subscriber unit economics and financial audit are disclosed.
      - - Confidence
        - medium
        - unverified private mark
