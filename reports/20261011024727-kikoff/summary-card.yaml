  topStrengths:
    - Large consumer reach and visible credit-score uplift among thin-file and gig-worker cohorts.
    - Low-friction subscription model with multiple tiers and non-loan monetization.
    - Capital-efficient model that avoids traditional balance-sheet lending risk.
  topRisks:
    - High CFPB complaint volume concentrated in credit-reporting and debt-collection disputes.
    - Opaque retention, ARR, and cohort economics make underwriting difficult.
    - Dependency on bureau furnishing and bank-debit flows creates operational and regulatory exposure.
  unresolvedGaps:
    - Current ARR, paying subscriber count, retention, churn, and cohort economics by plan tier.
    - >-
      Gross margin, servicing cost, CAC, LTV, and cash runway for the core subscription business versus adjacent
      products.
    - >-
      Exact terms behind the January 2025 valuation, including instrument type, investor protections, and whether the
      mark came from primary or secondary activity.
    - >-
      Complaint-resolution rates, refund outcomes, and regulator-facing controls for debt negotiation, furnishing
      accuracy, and subscription billing.
