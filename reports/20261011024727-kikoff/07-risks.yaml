callouts:
  - calloutType: "risk"
    title: "Bureau Dependency and High CFPB Dispute Volumes Create Compound Regulatory Vulnerability"
    body: "With 55.6 percent of its 7,101 CFPB consumer complaints concentrated in credit reporting accuracy, Kikoff faces ongoing regulatory exposure under the Fair Credit Reporting Act. Because its product utility depends entirely on voluntary credit bureau tradeline acceptance across Equifax, Experian, and TransUnion, elevated dispute rates threaten both regulatory standing and vital bureau partnerships."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR009"
  - calloutType: "insight"
    title: "The Service Bureau Acquisition Transforms Kikoff into a Two-Sided Credit Infrastructure Provider"
    body: "By acquiring The Service Bureau in July 2026, Kikoff absorbed over 1,000 enterprise data furnisher relationships alongside its consumer subscriber base. This horizontal expansion diversifies revenue beyond consumer subscriptions ($5-$35/mo) into B2B compliance infrastructure, yet introduces enterprise integration hurdles and SLA liabilities across regulated lending counterparties."
    claimRefs:
      - "CR008"
      - "CR010"
      - "CR011"
