evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: equity-terms-and-investor-rights
    missingEvidence: >-
      Audited term sheets, liquidation preferences, voting control agreements, and secondary transaction records
      underlying the reported $1.0B unicorn valuation.
    whyItMatters: >-
      Without primary cap table documentation, investors cannot determine whether the $1.0B headline valuation
      represents common share value, structured liquidation preferences, or secondary marks.
    diligencePath: >-
      Request confidential cap table summaries, Series B/C investor agreements, and audited 409A valuation appraisals
      under NDA.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: subscriber-retention-and-unit-economics
    missingEvidence: >-
      Audited ARR, active paying subscriber counts, monthly subscriber churn rates, and customer acquisition costs
      broken down by $5, $20, and $35 subscription tiers.
    whyItMatters: >-
      Lifetime user metrics (4 million) obscure active paying customer retention, making true revenue run-rate and
      ongoing cash generation impossible to independently underwrite.
    diligencePath: >-
      Obtain management reporting packages showing monthly recurring revenue, cohort retention curves, and gross margin
      by product line.
    relatedQuestionRefs:
      - QO009
