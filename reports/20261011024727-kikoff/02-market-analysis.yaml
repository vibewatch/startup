callouts:
  - calloutType: insight
    title: Alternative Data Integration as Addressable Expansion
    body: >-
      By partnering with Equifax to incorporate up to 24 months of retroactive rental history and recurring utility
      payments, Kikoff transforms non-credit recurring household obligations into verifiable bureau assets. This expands
      reachable demand into thin-file populations without exposing Kikoff to balance-sheet underwriting losses or
      conventional credit risk.
    claimRefs:
      - CM001
      - CM007
      - CM008
  - calloutType: risk
    title: Subscription Friction and Furnishing Scrutiny
    body: >-
      While Kikoff boasts a 100% timely response rate to CFPB inquiries, over 7,100 consumer complaints—concentrated in
      credit reporting accuracy and debt collection—highlight severe operational friction. Subscriber dissatisfaction
      with cancellation hurdles and limited tradeline utility outside the Kikoff store could cap long-term customer
      lifetime value and attract heightened regulatory attention.
    claimRefs:
      - CM005
      - CM012
      - CM013
      - CM014
