      - number: '1.4'
        title: 运营规模、公司里程碑与监管立场
        blocks:
          - type: paragraph
            body: >-
              从 2019 年成立到 2025 年底，Kikoff 从单一信用记录应用迅速扩展为多产品个人金融套件，涵盖自动化信用争议、AI 债务谈判、工资提前支取和金融市场平台。截至 2025
              年底，              Kikoff 报告历史用户超过 400 万、累计提升信用评分 2.4 亿分、帮助消费者节省债务 $21M（其中 $3.5M 来自 AI 债务谈判），并解锁超过 800,000
              个信用产品。尽管里程碑亮眼，消费者保护记录显示摩擦不小：Kikoff 在 CFPB 档案中累计有 7,101 起消费者投诉。超过 55% 的投诉指向信用报告错误，另有 28.4% 涉及债务催收。Kikoff
              虽保持 100% 的及时回复率，但 97.1% 的问题以解释结案，只有 0.1% 获得金钱救济，说明自动化获客与售后争议处理之间仍存在持续的运营张力。
            claimRefs:
              - CO001
              - CO006
              - CO009
