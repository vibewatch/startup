      - number: '3.2'
        title: 架构差异与信用记录机制
        blocks:
          - type: paragraph
            body: >-
              Kikoff 与其他信用建设产品的核心技术差异，在于信用记录架构。Self
              等传统信用建设产品属于分期贷款：还款额累积到锁定的银行存单中，并作为分期债务报送；消费者要支付可观利息，却不能改善信用卡利用率。相比之下，Kikoff 在 Basic 档建立 $750
              的循环信用记录，高档最高可达 $3,500。由于 Kikoff 把月度收费限制在自身订阅费内，账户向主要征信机构报送的信用利用率持续低于
              1%。这一机制同时瞄准还款历史和信用利用率，而二者合计约占标准信用评分模型的 65%。但这种架构也有关键功能限制：Kikoff
              的循环额度不能像担保信用卡那样购买杂货或汽油等外部商品，只是报送工具，不是可用于消费的流动性工具。
            claimRefs:
              - CP002
              - CP003
              - CP008
              - CP010
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP010
              - CP013
      - number: '3.3'
        title: 定价结构与信用持有总成本
        blocks:
          - type: paragraph
            body: >-
              信用建设行业的定价模式呈现出截然不同的客户变现方式。Self 每月收费 $25 至 $150，有效 APR 约为 15.5% 至
              15.9%；虽然期限结束时本金会返还，用户仍承担显著的利息和行政费用。传统担保卡通常要求预付 $200 至 $500 的现金保证金，对现金紧张的消费者构成难以逾越的流动性门槛。Kikoff
              完全取消前置资本要求，Basic 入门档每月 $5（每年 $60），信用账户不收利息和滞纳金。虽然这让 Kikoff 的前置成本比 Self 最低档低约
              80%，但订阅费本质上是不可退的服务支出，没有强制储蓄返还。更高档位每月 $20 至 $35，报送额度大幅增加，但相对于四至七倍的价格涨幅，只带来有限的评分增益。
            claimRefs:
              - CP004
              - CP005
              - CP008
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP008
              - CP012
      - number: '3.4'
        title: 护城河耐久性、转换成本与替代风险
        blocks:
          - type: paragraph
            body: >-
              Kikoff
              的竞争护城河受到消费者转换成本低、多平台使用倾向以及用户毕业的持续挤压。信用建设工具本来就是过渡性的；当用户把分数提升到优质信用门槛附近，自然就有资格申请标准无担保信用卡，后者提供返现奖励且不收月度维护费。此外，关闭已建立的
              Kikoff 账户会缩短消费者平均信用历史，造成暂时性分数摩擦，反而可能延迟取消。但 Chime Credit Builder
              等零费用数字银行组合持续带来替代威胁：它们不收月度订阅费，还允许用户直接用支票账户存款进行日常消费。随着数字银行和主流金融机构增强替代数据承保和自动化争议处理能力，独立信用建设平台正面临更强的商品化压力，长期客户终身价值可能受损。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 免手续费数字银行生态带来的替代脆弱性
            body: Kikoff 保持纯订阅低价品类领先，但缺少日常交易卡，使其在 Chime 等数字银行生态面前存在结构性脆弱性；这些平台把零费用信用建设直接嵌入主要的直接存款银行服务。
            calloutType: risk
            claimRefs:
              - CP005
              - CP010
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与订阅变现架构
        blocks:
          - type: paragraph
            body: >-
              Kikoff 主要是一家专注信用建设的消费者订阅软件公司。公司不收利息或贷款发起费，而是通过分层月度订阅收费。Basic 入门方案每月 $5，建立一条在 Equifax、Experian 和 TransUnion
              报送的 $750 循环信用记录。为提升客户终身价值，公司推出分层套餐：Premium 每月 $20，提供 $2,500 信用记录、租金和账单报告及 AI 债务谈判工具；Ultimate 每月 $35，提供
              $3,500 信用记录，并附带个人数据保护和身份盗窃保险。关键在于，报送的信用额度不能在 Kikoff 闭环生态之外提取或消费，因此底层本金几乎没有传统信用损失风险。除主要订阅费外，Kikoff
              还从市场平台获取附属联盟收入，把信用档案改善后的消费者介绍给第三方汽车贷款、信用卡和按揭产品。
            claimRefs:
