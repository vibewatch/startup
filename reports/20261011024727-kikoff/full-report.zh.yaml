        title: 展示项
        blocks:
          - type: callout
            title: 低成本信用获取与资产负债表保护
            body: Kikoff 的运营架构把信用报告与传统资产负债表放贷风险拆开。公司报送一条只能用于内部数字服务的循环信用记录（$750 至 $3,500），让用户获得信用记录积累，却不发放现金预支，也不承担承保后的核销风险。
            calloutType: insight
            claimRefs:
              - CO002
              - CO007
          - type: callout
            title: 信用报告准确性是首要监管漏洞
            body: >-
              Kikoff 的 7,101 起 CFPB 消费者投诉中，有 55.6%
              指向消费者报告中的错误信息，因此其自动化报送链在《公平信用报告法》下面临持续的运营和法律风险。让信用记录关闭和争议处理跟上获客速度，仍是关键运营优先事项。
            calloutType: risk
            claimRefs:
              - CO006
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、产品范围与替代方案
        blocks:
          - type: paragraph
            body: >-
              消费者信用建设市场处于传统银行信贷产品与信用修复咨询服务之间，边界相对清晰。信用合作社或社区银行提供的传统信用建设分期贷款会把借款本金存入托管账户；Kikoff
              则提供报送至主要征信机构的合成循环信用账户，不要求现金保证金或硬查询。但 Kikoff 严格限制这些账户的消费用途：名义 $750 至 $3,500
              的循环额度不能提取现金，也不能购买外部消费品，只能用于支付内部订阅计划费用。现有替代方案包括担保信用卡、Experian Boost
              等免费征信分数提升工具和同类金融科技应用；它们通常更能用于实际交易，但需要先交保证金。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM007
              - CM008
              - CM011
      - number: '2.2'
        title: 从多个视角测算可服务市场
        blocks:
          - type: paragraph
            body: >-
              评估 Kikoff 的市场机会，必须分别看不同的市场规模口径，不能只依赖一个宽泛的可服务市场估算。Equifax 估计，美国有 7,600
              万成年人要么完全没有信用记录，要么只有四个或更少账户的薄信用档案；这是被主流金融产品排除在外的消费者的宏观边界。在这一人群中，Kikoff Enterprise 面向约 3,200
              万名无法通过标准信用准入服务的信用空白者。若这批人全部订阅 Kikoff 每月 $5 的入门方案，隐含的年度可服务市场将达到 $1.92B。Kikoff 虽成为独角兽，并报告截至 2025 年底平台历史用户超过
              400 万，但公开披露没有经过审计的活跃付费用户与流失或休眠账户拆分，因此持续性净 ARR 仍是未经验证的尽调缺口。
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM010
              - CM015
