      - number: '4.3'
        title: 公开牵引指标与私人信息缺口
        blocks:
          - type: paragraph
            body: >-
              Kikoff 宣布了显著的漏斗顶端触达：公司在 2025 年末称历史用户已超过 4 million，帮助用户累计提升信用评分超过 240 million 分，并达到独角兽估值。管理层还称为用户节省的债务总额超过
              $21 million，其中 $3.5 million 来自自动化债务谈判引擎。尽管参与度里程碑亮眼，关键财务指标仍属机密。公司没有公开披露
              ARR、付费订阅用户数、净收入留存率或订阅流失率。消费者往往是为解决近期信用缺口才注册，因此订阅寿命是关键尽调不确定性。如果用户达到目标分数后就取消，高总流失率将迫使公司持续投入营销以补充订阅用户群，压低净运营利润率。
