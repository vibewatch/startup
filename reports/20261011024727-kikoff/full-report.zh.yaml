      - number: '2.3'
        title: 买方分层、支付意愿与 B2B 渠道
        blocks:
          - type: paragraph
            body: >-
              信用建设生态的采用者分为直接面向消费者的付费者和机构企业买家。消费者端的预算主要来自流动性受限的次级信用个人，他们每月直接从个人支票账户支付 $5 至
              $35，以建立可评分的还款记录。采用通常由具体交易触发，例如公寓租约被拒或汽车贷款被拒。与此同时，Kikoff 推出企业 API，打开了嵌入式金融 B2B
              渠道：第三方金融科技公司和数字银行支付批发集成费，以白标方式提供信用建设和租金报告。对企业伙伴而言，预算归属于产品工程和获客预算，战略目标是扩大可服务用户漏斗，把此前不符合资格的信用空白申请人转化为活跃银行客户。
            claimRefs:
              - CM003
              - CM004
              - CM008
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM007
              - CM008
              - CM011
              - CM012
      - number: '2.4'
        title: 增长驱动、征信合作与留存约束
        blocks:
          - type: paragraph
            body: >-
              替代数据报送的结构性顺风推动信用建设增长，但留存和消费者保护瓶颈也构成明显约束。Equifax 直接接入 Kikoff，可回溯补报最多 24
              个月的已验证租金支付，强力证明非传统支付历史可以迅速改善信用评分模型。但采用约束依然严重。竞品评论显示，用户对客服难以触达、取消月度自动扣款困难感到不满。更关键的是，公开监管记录显示 Kikoff 在 CFPB
              累计有 7,101 起消费者投诉，其中 55.6% 涉及信用报告错误，28.4% 涉及债务催收。Kikoff 虽对监管问询保持 100%
              及时回复率，但围绕征信报送准确性的反复争议，正实质威胁用户留存、客户终身价值和监管观感。
            claimRefs:
              - CM007
              - CM008
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 替代数据接入扩大可服务市场
            body: >-
              Kikoff 与 Equifax 合作，纳入最多 24
              个月的历史租金和经常性水电支付，把没有信用记录的家庭经常性支出转化为可验证的征信资产。这让公司无需暴露于资产负债表承保损失或传统信用风险，就能触达更多薄信用人群。
            calloutType: insight
            claimRefs:
              - CM001
              - CM007
              - CM008
          - type: callout
            title: 订阅摩擦与征信报送审查
            body: >-
              Kikoff 对 CFPB 问询保持 100% 及时回复率，但超过 7,100 起消费者投诉——集中在信用报告准确性和债务催收——暴露出严重的运营摩擦。取消订阅困难，以及信用记录在 Kikoff
              商城之外几乎没有使用价值，可能压低长期客户终身价值并招来更严格的监管关注。
            calloutType: risk
