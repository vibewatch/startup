  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品架构与交付模式
        blocks:
          - type: paragraph
            body: >-
              Kikoff 的核心产品是无抵押循环信用额度，可在三大全国性征信机构建立正式信用记录，无需硬查询或预付现金保证金。Kikoff Credit Account
              不提供可提取现金或在外部零售商消费的开放式信用额度，而是严格限制为在 Kikoff
              自有数字商店购买个人金融教育材料。平台把月度计划费用作为由内部循环信用记录直接融资的信用购买，并通过关联借记卡或自动清算所转账偿还，从而产生规律且可预测的月度还款活动。这个软件驱动的信用记录机制面向信用空白和薄信用消费者，绕开传统担保信用卡发行商高昂的保证金要求，同时建立还款历史，并扩大总循环额度，使报送的信用利用率保持在
              百分之十五以下。
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE007
          - type: figure
            figureRef: FE001
            claimRefs:
