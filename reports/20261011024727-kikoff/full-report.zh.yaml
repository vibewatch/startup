      - number: '4.4'
        title: 资本充足性、融资依赖与承保结论
        blocks:
          - type: paragraph
            body: >-
              资本端，风险投资数据库显示，Kikoff 截至 2021 年中已完成由 Portage Ventures 和 Lightspeed Venture Partners 领投的 B 轮融资，累计获得 $43
              million 股权资金。公司在 2025 年自称已跻身独角兽，但公开文件未说明这一估值究竟有大额一级市场成长股权注资支撑，还是仅源于内部重估。Kikoff
              不发放无抵押现金贷款，资本占用远低于信用卡发行商或资产负债表放贷机构，几乎不需要仓储债务。但站在投资判断角度，缺少经审计财务报表、单位贡献利润率和分群续约曲线，仍无法确证业务能否依靠自身财务持续运转。在管理层提供经审计的损益表和分群流失指标前，投资审批仍应暂缓。
