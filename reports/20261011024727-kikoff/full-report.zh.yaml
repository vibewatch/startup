chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、使命与产品架构
        blocks:
          - type: paragraph
            body: >-
              Kikoff 成立于 2019
              年，总部位于加利福尼亚州旧金山，是一家面向消费者的金融科技平台，服务于寻求负担得起的信用建设和债务解决方案的信用空白及次级信用消费者。公司的核心价值主张是提供低门槛、固定费用的信用服务，绕开传统信用建设贷款、行政负担和保证金要求。Kikoff
              的产品以循环信用额度记录为核心，每月向 Equifax、Experian 和 TransUnion 报送，订阅价格分别为每月 $5、$20 和 $35。用户可获得更高的报送信用额度（Basic 为
              $750、Premium 为 $2,500、Ultimate 为
              $3,500），以及水电账单报告、租金支付报送和身份保护。经常性订阅模式带来可预测现金流，同时避免按用户收取利息，但银行扣款费和客户账户透支费仍可能造成摩擦。
            claimRefs:
              - CO001
              - CO002
              - CO007
              - CO010
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO006
              - CO008
              - CO010
      - number: '1.2'
        title: 创始人、管理层与治理
        blocks:
          - type: paragraph
            body: >-
              Kikoff 由首席执行官 Cynthia Chen 和首席技术官 Christophe Chong 共同创立。Chen 曾在 Figure 担任联合创始人兼首席营收官，也曾在
              LendingHome、OnDeck 和 Capital One
              负责高管及风险工作，积累了丰富的金融科技和消费信贷风险经验。她拥有哥伦比亚大学运筹学和金融数学高级学位，为信用建模和资产负债表风险管理提供了技术基础。公司高度依赖 Chen
              负责战略、融资执行、对外沟通和监管立场。尽管 Chen 公开确认 Kikoff 致力于严格遵守《公平信用报告法》（FCRA）和
              UDAAP，并与监管机构合作，独立董事构成和更广泛的高管治理结构仍属于未披露的私人信息。
            claimRefs:
              - CO003
              - CO005
              - CO011
              - CO012
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO005
              - CO011
