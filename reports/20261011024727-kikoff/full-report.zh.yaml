      - number: '5.2'
        title: 产品模块、订阅层级与服务成熟度
        blocks:
          - type: paragraph
            body: >-
              Kikoff 将消费者商业产品分为三个标准订阅档位：Basic 每月五美元，提供七百五十美元循环信用记录；Premium 每月二十美元，提供二千五百美元信用记录；Ultimate
              每月三十五美元，提供三千五百美元信用记录。Basic 主要侧重三大征信机构报送和基础信用分跟踪，高档位则增加自动账单报告、三大征信机构分数监测和身份盗窃保护等辅助模块。为应对运营复杂性和单位经济效益，Kikoff
              正式停止实体担保信用卡业务，专注虚拟信用建设记录和软件服务。除核心信用记录外，公司在所有档位提供租金报告，把已验证的租金支付报送给 Equifax 和
              TransUnion；高档位还加入算法债务谈判工具，为未偿催收余额制定和解方案。
