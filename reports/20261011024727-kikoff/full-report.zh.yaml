  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群分层与目标人群
        blocks:
          - type: paragraph
            body: >
              Kikoff 的核心价值主张面向美国各地信用档案薄弱、信用空白和次级信用消费者 [CU001]。传统信用卡发行商和贷款机构要求既有信用历史或较高的前置保证金，实际上把数千万消费者挡在优质信用产品之外。Kikoff
              以每月 $5 起、零保证金的循环信用记录绕开传统承保摩擦，无需硬查询，也不收利息或罚金 [CU002]。这一模式形成了易于进入的漏斗顶端获客渠道，把平台历史用户账户推升至超过 400 万 [CU003]。


              客户群分为三类主要消费者群体，另有正在形成的企业分销渠道。第一类是信用空白的年轻人和移民，他们希望在不承担次级信用风险的情况下建立初始信用档案。第二类是信用重建者，拥有历史负面记录或低于 600
              的信用分，希望有结构地修复评分，从而获得主流融资 [CU004]。第三类是 1099 独立承包商和零工劳动者，他们需要改善信用，以取得汽车贷款、车辆租赁或租住房屋资格 [CU005,
              CU006]。虽然消费者自主注册贡献了绝大多数交易量，Kikoff 正积极发展企业 B2B2C 渠道，通过零工聚合平台把信用建设会员作为员工或平台福利分发。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
      - number: '6.2'
        title: 采用轨迹与生产指标
        blocks:
          - type: paragraph
            body: >
              Kikoff 报告的采用轨迹显示，平台在面向消费者的金融科技领域快速扩张。截至 2025 年底，公司称历史注册用户超过 4 million，自成立以来为用户累计带来超过 240 million 信用评分分数
              [CU003]。就单个账户而言，Kikoff 声称：起始信用分低于 600、持续按时支付每月 $5 信用记录费用的用户，12 个月内平均提升 84 至 86 分 [CU004]。


              支撑这一轨迹的运营机制，是专有的闭环融资结构。Kikoff 不发行可刷卡购买消费品的通用卡，而是把信用记录专门用于支付平台月度计划订阅费 [CU007]。每月按时支付的订阅费和较低的循环利用率都会直接报送给
              Equifax、Experian 和 TransUnion [CU008]。这种合成信用活动模拟传统循环债务行为，却不让次级信用借款人陷入过度负债。但 Kikoff
              没有披露月活用户、付费订阅用户数或用户群留存曲线，因此要判断增长轨迹是否耐久，仍需深入尽调客户生命周期。
            claimRefs:
              - CU003
              - CU004
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU010
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
