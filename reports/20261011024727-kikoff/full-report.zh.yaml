      - number: '1.3'
        title: 资本结构、估值与利益相关方
        blocks:
          - type: paragraph
            body: >-
              Kikoff 于 2025               年 1 月达到 $1.0B 的独角兽估值；此前公司披露融资 $42.5
              million，并称已实现运营盈利和资本高效扩张。其资本历史包括知名风险投资机构及关注包容性金融的资本伙伴对早期 A 轮和种子轮的投资。但关于 2025 年 1
              月估值标记的关键细节——估值究竟来自优先股主融资、老股转让，还是现有投资人的内部重估——仍未在公开登记资料中披露。Kikoff 的业务生态根本上依赖几类机构利益相关方：报送消费者信用记录的三大全国性征信机构
              Equifax、Experian 和 TransUnion，执行经常性扣款的合作银行，以及包括 CFPB 在内的联邦监管机构。
            claimRefs:
              - CO004
              - CO008
              - CO013
