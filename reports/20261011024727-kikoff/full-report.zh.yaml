  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 按时间展示 Kikoff 从成立到独角兽估值、产品扩张及监管投诉累积的轨迹。
    data:
      items:
        - date: '2019'
          label: 在旧金山成立
          detail: Cynthia Chen 与 Christophe Chong 共同创立 Kikoff，为消费者提供更易获得的信用建设服务。
          tone: neutral
          claimRefs:
            - CO003
        - date: 2021-06
          label: 累计股权资本 $42.5M
          detail: 披露的种子轮及各轮融资累计达到 $42.5M。
          tone: positive
          claimRefs:
            - CO008
        - date: '2024'
          label: 启动债务协商
          detail: 平台业务超越信用账户，开始提供债务协商和减免服务。
          tone: positive
          claimRefs:
            - CO009
        - date: 2025-01
          label: 获得独角兽地位
          detail: Kikoff 宣布公司以 $1.0B 估值达到据报道的独角兽地位，同时声称实现运营盈利。
          tone: positive
          claimRefs:
            - CO004
        - date: 2025-09
          label: 管理层战略披露
          detail: CEO Cynthia Chen 阐述以人为本的文化和审慎承担风险的管理原则。
          tone: neutral
          claimRefs:
            - CO005
        - date: 2025-12
          label: 400 万终身用户与 2.4 亿信用分
          detail: 里程碑达到 400 万终身用户、累计提升 2.4 亿信用分并节省 $21M 债务。
          tone: positive
          claimRefs:
            - CO001
        - date: 2026-10
          label: 记录 7,101 起 CFPB 投诉
          detail: CFPB 投诉记录显示消费者提交了 7,101 起投诉，主要涉及征信不准确。
          tone: negative
          claimRefs:
            - CO006
    approximationNotes: null
    claimRefs:
      - CO001
      - CO003
      - CO004
      - CO005
      - CO006
      - CO008
      - CO009
  - id: FM001
    title: 美国信用建设的受限市场金字塔
    type: pyramid
    summary: 分层规模金字塔从成年人口总量逐步收窄至 Kikoff 已报告的触达范围和未经核实的活跃订阅用户核心。
    approximationNotes: 人口和薄信用档案估算反映 Equifax 与 Kikoff 的披露；活跃付费核心用户未经审计报告核实。
    claimRefs:
      - CM001
      - CM002
      - CM010
      - CM012
      - CM014
    data:
      items:
        - label: 美国成年人口总量（宏观成人基数）
          value: 260
          detail: 估计 2.6 亿美国成年消费者，是宏观经济规模上限
          tone: neutral
        - label: 薄信用档案和信用记录缺失消费者（TAM）
          value: 76
          detail: 76 million 成年人拥有少于 4 个账户，或没有传统征信档案
          tone: neutral
        - label: 寻求获得信用资格的信用记录缺失成年人（SAM）
          value: 32
          detail: 3,200 万无法评分的成年人被标准信用门槛金融产品排除
          tone: neutral
        - label: 主动寻找信用建设方案的人群
          value: 12
          detail: 估计有 10–15 million 消费者正在主动寻找信用建设贷款或应用
          tone: opportunity
        - label: Kikoff 累计终身用户（已报告触达范围）
          value: 4
          detail: Kikoff 报告截至 2025 年 12 月拥有 400 万终身用户
          tone: positive
        - label: 活跃付费订阅用户核心（尽调缺口）
          value: 1
          detail: 按持续订阅计费估算的活跃付费用户基数；公司尚未核实
          tone: warning
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 对比不同信用建设替代方案在前期资金摩擦和日常交易效用上的相对定位。
    data:
      points:
        - label: Kikoff
          x: 2
          'y': 3
        - label: Self Financial
          x: 6.5
          'y': 4.5
        - label: Chime 信用建设
          x: 1.5
          'y': 9
        - label: Cleo 信用建设
          x: 5
          'y': 6
        - label: 传统担保卡
          x: 8.5
          'y': 8.5
        - label: MoneyLion Credit Builder Plus
          x: 7
          'y': 5
    approximationNotes: 评分采用 1–10 的序数尺度：X 轴反映资金摩擦（前期存款、利率和月度订阅成本）；Y 轴反映日常消费效用和交易广度。
    claimRefs:
      - CP006
      - CP007
      - CP011
  - id: FI001
    title: Kikoff 消费者信用建设与变现流程
    type: flow
    summary: 展示用户注册如何转化为经常性订阅收入和征信报送的端到端运营与变现流程。
    data:
      nodes:
        - label: 用户注册与身份验证
          detail: 消费者使用 SSN/TIN 注册，无需硬查询信用
        - label: 选择订阅方案
          detail: 用户选择 Basic（$5/月）、Premium（$20/月）或 Ultimate（$35/月）
        - label: 发放循环征信账户
          detail: Kikoff 开设 $750 至 $3,500 的指定信用额度，专用于信用建设
        - label: 收取月度订阅费
          detail: 从客户银行账户扣费，用于维护征信账户
        - label: 向三家征信机构报送
          detail: 向 Equifax、Experian 和 TransUnion 报送付款状态，建立信用记录
        - label: 交叉销售金融服务
          detail: 通过 AI 债务协商、租金报送和市场合作方优惠扩展生态
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI005
      - CI007
      - CI008
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 架构分层包括 Kikoff 的客户端界面、征信账户引擎、征信机构报送管线和企业 B2B 嵌入式平台。
    approximationNotes: 架构分层综合公开技术披露、API 文档和监管申报细节。
    claimRefs:
      - CE001
      - CE004
      - CE010
      - CE012
    data:
      layers:
        - label: 客户端呈现层
          modules:
            - 原生 iOS 和 Android 移动客户端应用
            - 用于注册和进度追踪的响应式网页门户
        - label: 循环征信账户与商店引擎
          modules:
            - 循环信用额度（$750 至 $3,500 循环额度管理）
            - 用于个人理财教育材料的内部数字商店
        - label: 征信机构报送与数据聚合管线
          modules:
            - Metro 2 月度征信账户报送网关（Equifax、Experian、TransUnion）
            - 租金和水电费支付数据聚合器（Equifax 和 TransUnion）
        - label: 信用智能与咨询层
          modules:
            - 提供分数因素洞察的自动化 AI 财务教练
            - VantageScore 3.0 实时监测和信用报告追踪器
        - label: 企业 B2B 嵌入式基础设施
          modules:
            - REST API 套件（/v1/members/enroll, /v1/furnish/tradeline, /v1/disputes/status）
            - 白标信用进阶和征信机构运营技术栈
        - label: 核心账本与合规基础
          modules:
            - 复式余额和服务账本（Kikoff Lending, LLC）
            - FCRA、ECOA 和州级贷款监管合规框架
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 从零押金注册到信用改善、方案升级和征信争议解决的端到端客户生命周期。
    data:
      items:
        - label: 1. 认知与发现
          detail: 通过社交媒体广告、零工平台转介和自然搜索触达信用记录缺失及次级消费者。
          touchpoints:
            - 面向信用建设的社交媒体营销和搜索广告
            - 零工平台论坛和同伴口碑
          tone: neutral
        - label: 2. 零摩擦注册
          detail: 几分钟内即可注册，需要 SSN/ITIN，但无需硬查询信用，也无需前期保证金。
          touchpoints:
            - 下载移动应用并通过邮箱 / SSN 注册
            - 无信用分门槛即时批准
          tone: positive
        - label: 3. 选择并激活方案
          detail: 用户选择 $5/月基础方案或更高档位；系统创建循环征信账户，为月度订阅提供融资。
          touchpoints:
            - 选择 $5/月信用账户
            - 通过绑定借记卡开通自动扣款
          tone: positive
        - label: 4. 月度征信账户报送
          detail: Kikoff 每月向 Equifax、Experian 和 TransUnion 报送按时付款、低使用率和账户年龄。
          touchpoints:
            - 自动处理月度扣款
            - 向主要征信机构报送征信账户信息
          tone: positive
        - label: 5. 信用分里程碑与扩展
          detail: 用户获得信用分（平均增加 +44 至 +86），并解锁争议工具、债务协商和担保卡等附加服务。
          touchpoints:
            - 信用分追踪和应用内里程碑通知
            - 交叉销售 Premium/Ultimate 方案和债务协商工具
          tone: opportunity
        - label: 6. 流失、升级或征信争议
          detail: 用户可能升级到主流信贷、因成本取消，或遭遇报送错误和客户支持摩擦。
          touchpoints:
            - 达到目标信用分后关闭账户
            - 就征信报送准确性提出支持咨询或 CFPB 争议
          tone: warning
    claimRefs:
      - CU002
      - CU007
      - CU008
      - CU011
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 按可能性、影响严重程度、缓解成熟度和剩余风险评估核心运营、监管及交易对手脆弱性。
    data:
      columns:
        - 风险类别
        - 可能性
        - 影响严重程度
        - 缓解成熟度
        - 剩余风险等级
      rows:
        - label: 暂停向征信机构报送
          values:
            - label: 合作伙伴依赖
            - label: 低
            - label: 严重
            - label: 中
            - label: 高
        - label: CFPB 报送与争议执法
          values:
            - label: 监管 / 法律
            - label: 中
            - label: 严重
            - label: 中
            - label: 高
        - label: 消费者银行资金不足 / 透支摩擦
          values:
            - label: 运营 / 财务
            - label: 高
            - label: 中
            - label: 低
            - label: 高
        - label: 信用修复监管重新分类
          values:
            - label: 监管 / 法律
            - label: 中
            - label: 高
            - label: 中
            - label: 中
        - label: TSB 企业客户收购后流失
          values:
            - label: 执行 / 并购
            - label: 中
            - label: 中
            - label: 中
            - label: 中
        - label: 合成欺诈与账户接管
          values:
            - label: 安全 / 质量
            - label: 低
            - label: 中
            - label: 高
            - label: 低
    approximationNotes: 可能性和影响等级是基于公开投诉量、平台架构约束和监管先例作出的定性尽调风险评估。
    claimRefs:
      - CR002
      - CR005
      - CR009
      - CR012
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 决策流程展示市场牵引力和精简资本如何被估值脱节及监管投诉量抵消，最终得出继续研究的结论。
    data:
      nodes:
        - id: scale
          label: 市场规模与触达
          description: 4M 以上终身用户，累计建立 240M 信用分，风险资本总融资额为 $42.5M。
        - id: unit-economics
          label: 产品与收入模型
          description: $5 至 $35/月的 SaaS 档位，ARR $11.7M 尚未核实，留存率未披露。
        - id: regulatory-scrutiny
          label: 监管与争议敞口
          description: CFPB 投诉总数 5,248 起；2025 年提交 2,740 起，其中 96.1% 已解释结案。
        - id: valuation-disconnect
          label: 估值脱节
          description: $1.0B headline 估值对应超过 80 倍历史 ARR，且没有经审计财务数据。
        - id: comparables-check
          label: 同业可比与倍数
          description: 上市金融科技同业的收入倍数为 2x-6x，说明存在严重的倍数压缩风险。
        - id: verdict
          label: 建议：继续研究
          description: 风险评级高、估值立场偏高；需要核实用户群留存和审计结果。
      edges:
        - from: scale
          to: unit-economics
          label: 转化为
        - from: unit-economics
          to: valuation-disconnect
          label: 支撑投资判断
        - from: regulatory-scrutiny
          to: verdict
          label: 将风险提升至
        - from: valuation-disconnect
          to: comparables-check
          label: 基准参照
        - from: comparables-check
          to: verdict
          label: 指向立场
    approximationNotes: 决策层级将主要实证输入映射到最终尽调立场。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV006
      - CV007
      - CV008
      - CV013
