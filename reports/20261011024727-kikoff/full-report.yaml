      - number: '4.2'
        title: Cost Structure, Servicing Dynamics, and Gross Margin Drivers
        blocks:
          - type: paragraph
            body: >-
              The core unit economics of Kikoff's model contrast sharply with conventional subprime lenders.
              Conventional installment lenders bear substantial capital costs, warehouse facility interest, and elevated
              default provisions. In contrast, Kikoff's cost structure is dominated by recurring credit bureau
              furnishing fees, banking API connectivity charges, cloud infrastructure, and customer servicing overhead.
              The company provides a 0% APR structure with no administrative or late fees. However, user account
              debiting carries operational friction; Kikoff explicitly disclaims liability for bank overdraft and
              non-sufficient funds penalties incurred when monthly subscription fees are collected. Operating leverage
              depends on maintaining high automated dispute processing efficiency. Public records show 7,101 consumer
              complaints filed with the CFPB against Kikoff Inc., over 55% of which center on credit reporting disputes
              and 28% on debt collection. Handling reporting accuracy disputes and bureau reinvestigations represents a
              significant ongoing servicing cost that directly impacts gross profit margins.
            claimRefs:
              - CI004
              - CI010
              - CI011
              - CI012
              - CI013
          - type: table
            tableRef: TI003
            claimRefs:
