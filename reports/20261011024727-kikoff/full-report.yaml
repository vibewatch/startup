        title: Exhibits
        blocks:
          - type: callout
            title: Low-Cost Credit Access vs. Balance Sheet Protection
            body: >-
              Kikoff's operational architecture decouples credit reporting from traditional balance-sheet lending risk.
              By reporting a revolving credit tradeline ($750 to $3,500) that can only be utilized for internal digital
              services, Kikoff provides credit bureau seasoning without extending cash advances or absorbing
              underwriting charge-off exposure.
            calloutType: insight
            claimRefs:
