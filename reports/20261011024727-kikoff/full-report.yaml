      - number: '2.4'
        title: Growth Drivers, Bureau Partnerships, and Retention Constraints
        blocks:
          - type: paragraph
            body: >-
              Growth in credit building is propelled by structural tailwinds in alternative data reporting, yet
              constrained by significant retention and consumer protection bottlenecks. Equifax's direct integration
              with Kikoff to backfill up to 24 months of verified rental payments provides powerful proof that
              non-traditional payment history can rapidly improve credit scoring models. However, severe adoption
              constraints persist. Competitor reviews highlight user frustration regarding customer service reachability
              and hurdles canceling monthly auto-debits. Crucially, public regulatory records reveal that Kikoff has
              accumulated 7,101 consumer complaints with the CFPB, with 55.6% citing credit reporting errors and 28.4%
              concerning debt collection practices. Although Kikoff demonstrates a 100% timely response rate to
              regulatory inquiries, recurring disputes over bureau furnishing accuracy represent a material threat to
              user retention, customer lifetime value, and supervisory posture.
            claimRefs:
              - CM007
              - CM008
              - CM012
              - CM013
              - CM014
