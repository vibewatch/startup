  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      End-to-end customer lifecycle from zero-deposit onboarding to credit improvement, plan expansion, and bureau
      resolution.
    data:
      items:
        - label: 1. Awareness & Discovery
          detail: >-
            Targeting credit-invisible and subprime consumers via social media ads, gig platform referrals, and organic
            search.
          touchpoints:
            - Social media marketing and search ads targeting credit building
            - Gig worker platform forums and peer word-of-mouth
          tone: neutral
        - label: 2. Zero-Friction Onboarding
          detail: Sign-up within minutes requiring SSN/ITIN but no hard credit inquiry and no upfront security deposit.
          touchpoints:
            - Mobile app download and email/SSN registration
            - Instant approval without credit score threshold
          tone: positive
        - label: 3. Plan Selection & Activation
          detail: >-
            Users select a basic $5/month plan or higher tier; revolving tradeline is created to finance the monthly
            subscription.
          touchpoints:
            - Selection of $5/month Credit Account
            - Autopay enrollment via linked debit card
          tone: positive
        - label: 4. Monthly Tradeline Furnishing
          detail: >-
            Kikoff reports on-time payments, low utilization, and account age monthly to Equifax, Experian, and
            TransUnion.
          touchpoints:
            - Automated monthly debit processing
            - Bureau tradeline reporting to major credit bureaus
          tone: positive
        - label: 5. Score Milestones & Expansion
          detail: >-
