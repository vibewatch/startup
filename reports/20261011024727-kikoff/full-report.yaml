              - CO010
      - number: '1.2'
        title: Founders, Executive Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              Kikoff was co-founded by Chief Executive Officer Cynthia Chen and Chief Technology Officer Christophe
              Chong. Chen brings substantial fintech and consumer credit risk expertise from prior executive and risk
              leadership positions at Figure (as Co-Founder and Chief Revenue Officer), LendingHome, OnDeck, and Capital
              One. Her educational background includes advanced degrees in Operations Research and Mathematics of
              Finance from Columbia University, providing technical grounding in credit modeling and balance-sheet risk.
              The company maintains heavy key-person dependency on Chen for executive strategy, fundraising execution,
              external communication, and regulatory posture. Although Chen has publicly affirmed Kikoff's commitment to
              strict Fair Credit Reporting Act (FCRA) and UDAAP compliance alongside collaborative regulatory
              engagement, independent board composition and broader C-suite governance structures remain undisclosed
              private data.
