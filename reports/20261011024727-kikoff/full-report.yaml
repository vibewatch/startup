      - number: '2.2'
        title: Addressable Market Sizing Across Multiple Lenses
        blocks:
          - type: paragraph
            body: >-
              Evaluating Kikoff's market opportunity requires analyzing distinct sizing lenses rather than relying on a
              single broad addressable estimate. Equifax estimates that 76 million American adults are either completely
              credit-invisible or maintain a thin file of four accounts or fewer, representing the macro boundary of
              consumers excluded from mainstream financial products. Within this universe, Kikoff Enterprise targets an
              estimated 32 million credit-invisible individuals who cannot qualify for standard credit-gated services.
              If this entire cohort enrolled at Kikoff's entry-level $5 per month subscription, the implied annual
              addressable market would reach $1.92 billion. While Kikoff achieved unicorn status and reported surpassing
              4 million lifetime platform users by year-end 2025, public disclosures provide no audited breakdown of
              active paying subscribers versus churned or dormant accounts, leaving ongoing net annual recurring revenue
              an unverified diligence gap.
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM010
              - CM015
