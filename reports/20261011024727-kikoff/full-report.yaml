  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundaries, Product Scope, and Substitutes
        blocks:
          - type: paragraph
            body: >-
              The consumer credit-building market occupies a distinct boundary between traditional banking credit
              products and credit-repair advisory services. Unlike conventional credit-builder installment loans offered
              by credit unions or community banks—which hold borrowed principal in escrow—Kikoff provides synthetic
              revolving credit accounts that report to major credit bureaus without requiring a cash deposit or hard
              credit check. However, Kikoff strictly circumscribes the spend utility of these accounts: the nominal $750
              to $3,500 revolving credit limits cannot be drawn as cash or spent on external consumer goods, functioning
              purely to finance internal subscription plan fees. Status-quo substitutes include secured credit cards,
              free bureau score boosters such as Experian Boost, and peer fintech apps, which often offer more practical
              transaction utility at the expense of upfront security deposits.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM003
              - CM004
              - CM005
