        - Medium (>1,000 enterprise accounts)
        - Churn of major enterprise data furnishing clients following TSB asset acquisition
        - Medium
        - Longstanding 30-year TSB customer relationships and managed service agreements
        - Medium
      - - Consumer Credit Product Affiliates
        - Auto lenders, mortgage brokers, personal loan issuers
        - Marketplace referral revenue and user graduation
        - Moderate
        - Affiliate commission compression or partner credit tightening for subprime borrowers
        - Medium
        - Proprietary subscription fees ($5-$35/mo) generate primary revenue independent of affiliate volume
        - Low
    notes: >-
      Counterparty risk ranked by structural operational impact. All tradeline utility depends on continued voluntary
      acceptance of micro-lines by Equifax, Experian, and TransUnion.
