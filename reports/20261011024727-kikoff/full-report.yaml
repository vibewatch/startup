      - number: '1.3'
        title: Capitalization, Valuation, and Stakeholder Profile
        blocks:
          - type: paragraph
            body: >-
              Kikoff achieved a headline unicorn valuation of $1.0B in January 2025, supported by reported operational
              profitability and capital-efficient expansion following $42.5 million in disclosed earlier venture capital
              funding. The company's capitalization history includes investments from prominent venture firms and
              inclusion-focused capital partners who supported its initial Series A and seed development. However,
              crucial details regarding the January 2025 unicorn mark—including whether the valuation was driven by a
              primary preferred financing round, secondary share transfers, or internal investor markups—remain
              undisclosed in public registries. Kikoff's business ecosystem depends fundamentally on key institutional
              stakeholders: the three nationwide credit bureaus (Equifax, Experian, and TransUnion) that furnish
              consumer tradelines, partner banking institutions executing recurring debits, and federal regulatory
              oversight bodies including the CFPB.
