chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Mission, and Product Architecture
        blocks:
          - type: paragraph
            body: >-
              Founded in 2019 and headquartered in San Francisco, California, Kikoff operates a direct-to-consumer
              fintech platform tailored for credit-invisible and subprime consumers seeking affordable credit building
              and debt resolution. The company's core value proposition centers on low-friction, fixed-fee credit
              services that bypass conventional credit-builder loans, administrative overhead, and security deposit
              requirements. Kikoff structures its offering around revolving line-of-credit tradelines reported monthly
              to Equifax, Experian, and TransUnion, with subscription pricing tiers set at $5, $20, and $35 per month.
              Subscribers access higher reported credit lines ($750 on Basic, $2,500 on Premium, and $3,500 on Ultimate)
              alongside utility bill reporting, rental payment furnishing, and identity protection. This recurring
              subscription model generates predictable cash flow while avoiding user-level interest charges, though bank
              debit fees and overdraft charges from customer accounts remain a potential friction point.
            claimRefs:
              - CO001
              - CO002
              - CO007
              - CO010
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO006
