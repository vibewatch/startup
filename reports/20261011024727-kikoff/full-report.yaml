      - number: '1.4'
        title: Operational Scale, Corporate Milestones, and Regulatory Posture
        blocks:
          - type: paragraph
            body: >-
              Between its 2019 founding and the close of 2025, Kikoff scaled rapidly from a single credit tradeline app
              to a multi-product personal finance suite encompassing automated credit disputes, AI-driven debt
              negotiation, earned wage access, and a financial marketplace. By year-end 2025, Kikoff reported over 4
              million lifetime users, 240 million total credit points boosted, $21 million in consumer debt savings
              (including $3.5 million achieved through AI debt negotiation), and over 800,000 credit products unlocked.
              Despite these milestone achievements, consumer protection records reveal substantial friction: Kikoff has
              accumulated 7,101 consumer complaints on file with the CFPB. Over 55% of complaints allege credit
              reporting inaccuracies, with debt collection accounting for an additional 28.4%. While Kikoff maintains a
              100% timely response rate, 97.1% of issues are closed with explanation and only 0.1% receive monetary
              relief, highlighting an ongoing operational tension between automated customer acquisition and
              post-servicing dispute resolution.
            claimRefs:
              - CO001
              - CO006
              - CO009
