            secured cards.
          touchpoints:
            - Credit score tracking and in-app milestone notifications
            - Cross-sell to Premium/Ultimate plans and debt negotiation tools
          tone: opportunity
        - label: 6. Churn, Graduation, or Bureau Disputes
