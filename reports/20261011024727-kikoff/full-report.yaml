      - number: '2.3'
        title: Buyer Segmentation, Willingness to Pay, and B2B Channels
        blocks:
          - type: paragraph
            body: >-
              Adoption within the credit-building ecosystem is bifurcated across direct-to-consumer payers and
              institutional enterprise buyers. On the consumer side, budget ownership resides primarily with
              liquidity-constrained subprime individuals who pay $5 to $35 monthly directly from personal checking
              accounts to establish scoreable payment records. Adoption triggers are typically transactional, such as
              apartment lease rejections or auto loan denials. Concurrently, Kikoff's launch of an enterprise API
              introduces a B2B embedded finance channel where third-party fintechs and neobanks pay wholesale
              integration fees to offer white-label credit building and rent reporting. For enterprise partners, budget
              ownership sits within product engineering and customer acquisition budgets, driven by the strategic
              objective to expand their addressable user funnel by converting previously unqualified credit-invisible
              applicants into active banking customers.
            claimRefs:
              - CM003
              - CM004
              - CM008
              - CM011
