  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Architecture and Delivery Model
        blocks:
          - type: paragraph
            body: >-
              Kikoff's core offering centers on an uncollateralized revolving line of credit that establishes a formal
              tradeline with the three major national credit bureaus without requiring a hard credit check or an upfront
              cash security deposit. Rather than providing an open-loop line of credit that can be drawn as cash or
              spent at external retail merchants, the Kikoff Credit Account is strictly restricted to purchasing
              personal finance educational materials within Kikoff's proprietary digital store. By structuring monthly
              plan fees as credit purchases financed directly through the internal revolving tradeline and repaid via
              linked debit card or automated clearing house transfers, the platform generates regular, predictable
              monthly payment activity. This software-driven tradeline mechanism targets credit-invisible and thin-file
              consumers who face prohibitive deposit requirements from traditional secured credit card issuers,
              simultaneously establishing credit payment history and expanding total revolving limits to maintain
              reported credit utilization ratios below fifteen percent.
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE007
          - type: figure
            figureRef: FE001
            claimRefs:
