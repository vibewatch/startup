  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Risk
      - Pivot / Kill Trigger
    rows:
      - - Market Scale
        - >-
          Over 4M lifetime users and 240M credit points created demonstrate massive demand from credit-invisible
          consumers.
        - Lifetime user signups mask active subscriber retention, churn, and revenue persistence across aging cohorts.
        - Active paying subscriber count falling below 20% of total reported lifetime signups.
      - - Product Utility
        - >-
          Accessible $5 to $35 monthly subscription tiers establish recurring SaaS-like consumer finance revenue without
          loan capital risk.
        - >-
          Entry-level credit tradeline products face intense price competition from neobanks and secured cards offering
          zero-fee alternatives.
        - Average revenue per active user compressing below blended customer acquisition cost.
      - - Capital Efficiency
        - >-
          Total raised capital of $42.5M through Series B demonstrates lean operation compared to heavily funded
          credit-builder peers.
        - >-
          Lack of primary equity funding since June 2021 suggests reliance on existing cash reserves or unverified
          profitability claims.
        - Down-round financing or structured liquidation preferences senior to common equity.
      - - Regulatory Posture
        - >-
          Clean 100% timely response rate to CFPB complaints indicates established customer service intake and
          operational responsiveness.
        - >-
          CFPB complaint volume surged 162% from 1,045 in 2024 to 2,740 in 2025, driven by credit reporting inaccuracy
          disputes.
        - Formal CFPB or FTC supervisory enforcement, civil money penalties, or consent orders.
    notes: >-
      Evaluates core investment pillars against operational and regulatory counter-evidence; triggers represent
      measurable thesis-break criteria.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV005
      - CV013
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Probability
      - Core Operating Assumptions
      - Implied Valuation
      - Key Downside / Upside Triggers
    rows:
      - - Bull Case
        - 15%
        - >-
          ARR accelerates to $50M+ via premium tiers ($20-$35/mo) and AI debt negotiation; churn stabilizes under 5%
          monthly.
        - $500M - $750M (10x-15x ARR)
        - Successful cross-sell into prime credit products and positive net income generation.
      - - Base Case
        - 50%
        - >-
          ARR remains between $20M and $30M with high gross margin but elevated churn; profitable on cash basis but
          growth moderates.
        - $150M - $250M (6x-8x ARR)
        - Multiple compression toward consumer fintech comps (Dave, SoFi, LendingClub 2x-5x revenue).
      - - Bear Case
        - 35%
        - >-
          Subscriber churn accelerates, CFPB regulatory scrutiny tightens furnishing rules, and ARR contracts below
          $15M.
        - $40M - $75M (1x-2x ARR / asset value)
        - Supervisory action, negative net retention, or forced recapitalization below liquidation preference.
    notes: >-
      Valuation ranges derived from comparable public consumer fintech trading multiples and private transaction
      benchmarks.
    claimRefs:
      - CV010
      - CV011
      - CV012
