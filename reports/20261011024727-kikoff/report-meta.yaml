companyProfile:
  summary: >-
    Kikoff is a consumer fintech company that helps credit-invisible and subprime consumers build credit through
    low-cost subscription tradelines, rent and bill reporting, and debt-resolution tools. The company pairs a
    closed-loop monthly subscription model with bureau furnishing across Equifax, Experian, and TransUnion, giving it
    meaningful consumer reach while leaving important questions about retention, economics, and complaint handling
    unresolved.
