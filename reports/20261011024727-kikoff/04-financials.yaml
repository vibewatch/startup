callouts:
  - calloutType: "insight"
    title: "Zero-Interest Closed-Loop Subscription Architecture"
    body: "Kikoff differentiates from traditional subprime credit-builder lenders by offering a 0% APR structure that monetizes purely through recurring subscription fees rather than interest or late penalty charges. Because tradelines cannot be withdrawn as unrestricted cash, credit default risk on principal is virtually eliminated."
    claimRefs:
      - "CI001"
      - "CI005"
      - "CI010"
  - calloutType: "risk"
    title: "Furnishing Disputes and Regulatory Servicing Overhead"
    body: "With over 7,100 consumer complaints on record at the CFPB—over half focusing on credit bureau reporting accuracy—Kikoff faces ongoing customer servicing friction. Managing disputes across three major bureaus without assessing late fees requires lean automated compliance systems to prevent operational margins from eroding."
    claimRefs:
      - "CI011"
      - "CI012"
      - "CI013"
