    {
      "id": "regulatory-legal-and-site-risk",
      "title": "Regulatory, Legal, and Site Risk",
      "body": "Focused Energy also faces a genuinely novel permitting problem. German radiation law and nuclear law both matter to the Biblis plan: Strahlenschutzgesetz section 10 requires licensing for facilities that generate ionizing radiation, while Atomgesetz section 7 remains relevant because Biblis is a former fission site still inside a decommissioning regime controlled by RWE. The company is therefore not just seeking a greenfield industrial permit; it is trying to layer a first-of-kind fusion development program onto a brownfield nuclear asset with no direct German precedent. The regulatory pathway is not stabilized at the European level either. In April 2026 the CEO publicly argued that the EU still lacked a dedicated fusion strategy, and in the United States the NRC had only a proposed fusion-machine framework outstanding as of February-May 2026 with a final rule still pending. That means Focused Energy is advancing while key comparative jurisdictions are still defining how fusion should be regulated. The Biblis project is attractive precisely because existing grid, land, and nuclear infrastructure exist, but that same site concentration creates risk: if RWE's decommissioning schedule, regulatory interpretation, or political support shifts, the entire roadmap can slip at once.",
      "claimRefs": [
        "CR012",
