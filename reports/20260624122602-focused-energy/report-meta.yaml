companyProfile:
  summary: >-
    Focused Energy is a German-American laser fusion company founded in July 2021 as a TU
    Darmstadt and National Energetics spinout. The company is developing a direct-drive,
    proton-fast-ignition inertial-confinement fusion architecture that aims to turn the
    National Ignition Facility's scientific validation into an industrial power plant.
    Focused Energy's current corporate thesis is to industrialize laser fusion from Germany,
    using Biblis as the flagship site and RWE as both strategic investor and industrial
    partner. The company is pre-revenue and remains in staged R&D and facility buildout.
  foundedDate: "2021-07-01"
  founders:
    - name: "Thomas Forner"
      role: "Co-Founder & CEO"
      background: >-
        Serial entrepreneur leading commercialization, financing, and industrialization of
        Focused Energy's laser-fusion strategy.
      claimRefs: [CO010]
    - name: "Prof. Dr. Markus Roth"
      role: "Co-Founder & CSO"
      background: >-
        TU Darmstadt professor and long-time laser and plasma physicist with decades of
        fusion-target and fast-ignition experience.
      claimRefs: [CO011]
    - name: "Prof. Todd Ditmire"
      role: "Co-Founder"
      background: >-
        University of Texas at Austin physicist and specialist in high-intensity laser-plasma
        interactions relevant to inertial fusion.
      claimRefs: [CO012]
  foundingLocation: "Darmstadt, Germany"
  headquarters: "Darmstadt, Germany"
  productSummary: >-
    A staged laser-fusion plant platform built around direct-drive deuterium-tritium targets,
    proton fast ignition, high-energy laser systems, target fabrication, diagnostics, and
    eventually a Biblis-based pilot plant feeding electricity to the grid.
  customerFocus: >-
    Future buyers are utilities, industrial heat users, and sovereign or strategic energy
    partners seeking firm carbon-free power; current public counterparties are primarily
    investors, research collaborators, and state-backed ecosystem partners rather than paying
    energy customers.
  businessModel: >-
    Long-term monetization is expected to come from fusion power-plant electricity and
    industrial heat sales, potentially supplemented by nearer-term laser-driver and
    diagnostics commercialization such as the SourceLight spinoff. No commercial energy
    revenue exists today.
  stage: "Series A"
  fundingStatus: >-
    May 2026 Series A raised $240M led by RWE with participation from SPRIND, the European
    Innovation Council Fund, Prime Movers Lab, and additional investors; total private capital
    is roughly $300M and total funding including grants is roughly $500M.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO010, CO011, CO012, CO020, CO022, CO025, CO031]

summary:
  headline: >-
    Focused Energy has emerged as Europe's strongest laser-fusion financing story, but absent
    valuation disclosure, customer contracts, or integrated high-repetition technical proof,
    the investable stance remains research-more pending Biblis execution, financing-roadmap
    clarity, and subsystem-to-system validation.
