- id: FE004
  title: Product maturity / capability map
  type: matrix
  layout: wide
  summary: >-
    Qualitative readiness assessment across six technology dimensions, showing where FE has public
    validation vs. where gaps remain as of June 2026.
  approximationNotes: >-
    Cells are qualitative summaries of public evidence available as of June 2026. TRL scores are
    indicative and not independently verified. "Validated subsystem" means published experimental or
    milestone evidence; "concept / planned" means company roadmap without independent confirmation.
  claimRefs:
  - CE004
  - CE007
  - CE012
  - CE033
  - CE036
  - CE038
  - CE040
  data:
    columns:
    - Evidence level
    - Basis for assessment
    - Remaining gap
    rows:
    - label: Target physics (NIF ignition heritage)
      values:
      - Strongly validated (external)
      - NIF peer-reviewed ignition; FE co-founders and CSO designed NIF target; APS DPP 2025 paper with 1D gain >50 designs
      - PFI-specific ignition has not been demonstrated in an integrated experiment; NIF used indirect drive
    - label: Proton beam focusing (PFI ignitor)
      values:
      - Subsystem validated
      - DOE Milestone 2 (Nov 2024) at Colorado State demonstrated laser-generated proton focusing and rep-rate target alignment
      - Full-scale PFI integrated experiment with compression + proton ignition has not been demonstrated
    - label: High-rep solid-state laser system (10 Hz DPSSL)
      values:
      - Concept / early development
      - Laser development hall at Biblis planned; no public 10 Hz kilojoule-class DPSSL demonstration reported
      - 10 Hz kilojoule lasers at commercial reliability and cost do not currently exist; represents a multi-year engineering challenge
    - label: Pearl target factory (10 Hz throughput)
      values:
      - Concept / early stage
      - In-house target lab exists and demonstrated rep-rate alignment (DOE milestone); no public factory-scale throughput
      - Commercial-scale target production (~864,000 capsules/day) is an unsolved manufacturing problem
    - label: Chamber wall and materials
      values:
      - Concept / undemonstrated
      - Problem framed in NEI article; no public materials programme, irradiation data, or prototype chamber
      - Neutron-flux material survivability over 2–3 year campaigns is a blocking engineering gap
    - label: Balance-of-plant and grid integration
      values:
      - Concept / conventional engineering
      - Conventional steam-cycle engineering; RWE grid expertise available; Biblis grid connection pre-existing
      - No public balance-of-plant design specific to laser-fusion thermal output has been disclosed
callouts:
- calloutType: strength
  title: NIF ignition heritage is an irreplaceable scientific moat
  body: >-
    Focused Energy is the only private fusion company whose founders and chief strategy officer
    directly produced the peer-reviewed ignition results at NIF. This provides a validated target
    physics foundation that competitors building from scratch cannot replicate quickly. The company's
    claim that laser fusion (inertial confinement) is the only fusion approach with a verified net
    energy gain is accurate as of June 2026.
  claimRefs:
  - CE002
  - CE024
  - CE033
- calloutType: risk
  title: Ten-shot-per-second laser and target systems are 2,000× beyond current NIF infrastructure
  body: >-
    NIF fires approximately 400 shots per year; a commercial Focused Energy plant needs 10 shots per
    second. No kilojoule-class 10 Hz DPSSL, target injection system, or integrated chamber has been
    demonstrated at anything approaching this rate. The gap between validated subsystem performance
    and commercial-scale integrated operation is the primary technical and financial risk for investors.
  claimRefs:
  - CE005
  - CE036
  - CE038
- calloutType: insight
  title: SourceLight opens a near-term revenue path from fusion technology
  body: >-
    The planned SourceLight spin-off monetises laser-driven radiation source technology for industrial
    inspection well before the FPP operates. This could provide early commercial validation of the
    laser-and-target stack, reduce FE's cash-consumption dependency on the long fusion timeline, and
    demonstrate that the Biblis campus is generating industrial value before first grid power.
  claimRefs:
  - CE019
  - CE020
  - CE034
