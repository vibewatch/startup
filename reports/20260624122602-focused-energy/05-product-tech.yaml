company:
  name: Focused Energy
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Focused Energy's product is a staged laser fusion plant program built around proton fast ignition (PFI)
    of direct-drive deuterium-tritium targets, with a commercial power plant as the end state and the
    former RWE nuclear site at Biblis as the chosen development campus. The company carries the strongest
    validated scientific basis in laser fusion—NIF ignition—but the technology stack from individual
    validated subsystems to an integrated, high-repetition-rate prototype has never been demonstrated
    end-to-end, and mass-manufactured target production, 10 Hz solid-state laser systems, and chamber
    wall survivability under sustained neutron flux remain open engineering problems.
sections:
- id: product-definition-and-fusion-plant-concept
  title: Product Definition and Fusion Plant Concept
  body: >-
    Focused Energy is not currently selling electricity, a reactor block, or a power-purchase agreement.
    Its present deliverable is a staged engineering programme culminating in a laser fusion power plant
    at gigawatt scale for utility, industrial, and national-security buyers. In customer-workflow terms
    the company is targeting large electricity and heat consumers—utilities, industrial sites, data centres,
    desalination facilities, and national security missions—that currently depend on grid power, gas
    infrastructure, and backup generation. The commercial promise is that a Focused Energy plant would
    provide firm, carbon-free, on-site or grid-connected baseload power from repeated fusion shots driving
    a conventional steam cycle. What distinguishes the product concept is the company's claim to sit on
    the only fusion path with a peer-reviewed, independently verified net energy gain: the NIF ignition
    shots at Lawrence Livermore, which the company's founders and chief strategy officer helped design.
    The co-founders' bet—that LLNL would achieve ignition and that the team could be recruited—has
    paid out on both counts. The current product stack consists of engineering R&D capabilities, a
    target laboratory, nascent facility infrastructure at the former Biblis nuclear site, and a
    technology-transfer vehicle (SourceLight) for near-term industrial applications of laser-driven
    radiation sources. None of these constitute a shipped commercial product; value creation is entirely
    contingent on the Biblis roadmap succeeding across a decade-plus development cycle.
