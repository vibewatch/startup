- id: direct-drive-proton-fast-ignition-architecture
  title: Direct-Drive Proton Fast Ignition Architecture
  body: >-
    Focused Energy's technology differs from the NIF in one critical dimension: it pursues direct-drive
    rather than indirect drive. NIF heats a precision-machined gold hohlraum to X-ray temperatures that
    then compress the fuel capsule; Focused Energy's lasers irradiate the capsule directly, eliminating
    the hohlraum and simplifying manufacturing. The second major departure is proton fast ignition (PFI).
    In standard central-hotspot ignition, the same laser energy compresses and ignites the target in one
    step. PFI separates these stages: an array of diode-pumped solid-state compression drivers at 351 nm
    wavelength implodes a cone-in-shell DT capsule to high density, then a short, high-intensity
    picosecond-scale pulse generates a focused beam of energetic protons via target normal sheath
    acceleration (TNSA), which deposits its energy into the compressed fuel to initiate the thermonuclear
    burn wave. The APS Division of Plasma Physics 2025 conference paper by the FE team identifies the
    three main physics risks: laser-plasma instabilities (LPI, including cross-beam energy transfer,
    stimulated Raman scatter, and two-plasmon decay), hydrodynamic instabilities, and low-mode asymmetry.
    One-dimensional design calculations show >50× fusion gain, providing margin against three-dimensional
    degradation; the target engineering gain required to run the plant is approximately 25×. The
    company's $6.9M collaboration with the University of Rochester's Laboratory for Laser Energetics
    (LLE)—the largest single industrial-sponsored research agreement LLE has ever received—uses LLE's
    FLUX broadband laser system to experimentally probe and suppress LPI, directly feeding into
    the Fusion Pilot Plant (FPP) target design. The proprietary "Pearl" capsule is designed for mass
    manufacture and high-repetition injection; a commercial power plant needs approximately 10 shots per
    second (≈864,000 shots per day), roughly 2,100 times NIF's annual shot rate. No publicly disclosed
    integrated PFI experiment has yet demonstrated end-to-end performance from compression driver through
    proton beam to fusion yield under FPP-relevant conditions.
