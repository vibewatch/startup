  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: integrated PFI system performance
    missingEvidence: No public end-to-end integrated PFI experiment has demonstrated compression, proton ignition, and fusion yield together under FPP-relevant conditions.
    whyItMatters: The entire commercial premise depends on PFI working as an integrated system; subsystem-level validation leaves the central technical risk open.
    diligencePath: Request access to internal simulation outputs, any unpublished experimental results, and independent physicist assessment of the PFI implosion design.
    relatedQuestionRefs:
    - QE009
    - QE018
  - type: missing-source
    severity: blocking
    topic: 10 Hz DPSSL system demonstration
    missingEvidence: No public demonstration of a kilojoule-class 10 Hz diode-pumped solid-state laser system at commercial reliability and cost exists anywhere.
    whyItMatters: The required laser shot rate is approximately 2,100× NIF's daily rate; absence of a working system prototype is the most immediate hardware bottleneck.
    diligencePath: Benchmark against best-published DPSSL repetition rates and efficiency data; seek independent laser-physics assessment of the development timeline.
    relatedQuestionRefs:
    - QE002
    - QE021
  - type: missing-source
    severity: material
    topic: target factory throughput demonstration
    missingEvidence: No public roadmap or independent analysis for producing and injecting approximately 864,000 Pearl capsules per day at acceptable cost has been published.
    whyItMatters: Target factory scale-up is a co-equal bottleneck with the laser system; without a credible manufacturing plan, plant economics are unverifiable.
    diligencePath: Request internal target-cost and throughput estimates; benchmark against semiconductor wafer or pharmaceutical capsule manufacturing analogues.
    relatedQuestionRefs:
    - QE015
    - QE022
  - type: missing-source
    severity: material
    topic: developer-signal GitHub or open-source surface
    missingEvidence: Focused Energy has no public GitHub repository, open-source software, or public API surface. Developer-signal has been satisfied via practitioner-community proxy (APS DPP conference paper, IFE-STAR and EuroHPC-funded projects).
    whyItMatters: Absence of open technical artefacts limits external validation of computational methods; consistent with a hardware-first deep-physics company at this stage.
    diligencePath: Track future publication records via APS DPP, Physics of Plasmas, and NIF Science portal for FE author contributions.
  - type: missing-source
    severity: minor
    topic: IAEA fusion engineering phase statement
    missingEvidence: A claim that IAEA called out fusion reaching the engineering phase and flagged Biblis was reported in secondary trade press but no direct IAEA source URL was accessible for verification.
    whyItMatters: An IAEA-sourced engineering-phase validation would be a significant third-party endorsement; without the direct citation the evidentiary weight relies on secondary reporting.
    diligencePath: Search iaea.org news/events for fusion engineering statements from 2025-2026; obtain direct URL or document.
    relatedQuestionRefs:
    - QE019
  - type: missing-source
    severity: minor
    topic: Biblis safety and compliance controls
    missingEvidence: Focused Energy has stated publicly that fusion is inherently safe and subject to radiation protection rather than nuclear law in Germany, but no detailed safety management plan, emergency preparedness framework, or regulatory filing is publicly available.
    whyItMatters: Biblis is a former nuclear site; detailed safety controls are required for licensing under German radiation protection law; absence of public disclosure limits independent assessment.
    diligencePath: Request safety framework documents from management; monitor Bundesamt für Strahlenschutz filings for Biblis fusion activities.
    relatedQuestionRefs:
    - QE027
  - type: private-evidence-only
    severity: material
    topic: chamber wall materials qualification
    missingEvidence: No published materials testing programme or irradiation data for first-wall candidates under laser-fusion neutron flux spectra has been identified.
    whyItMatters: First-wall survivability for 2–3 year campaigns is a mandatory engineering gate before FPP design lock; failure mode affects plant availability and LCOE.
    diligencePath: Request materials programme status, candidate material list, and any irradiation test plans from management.
    relatedQuestionRefs:
    - QE013
