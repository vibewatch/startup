- id: manufacturing-supply-chain-and-fuel-cycle
  title: Manufacturing, Supply Chain, and Fuel Cycle
  body: >-
    The commercial case for laser fusion depends as much on manufacturing economics as on plasma physics.
    A single gigawatt plant would require approximately 1,000 laser amplifiers, which must be produced
    like cars at industrial scale rather than as scientific instruments. Focused Energy CEO Thomas Forner
    explicitly frames this shift as one of the company's central strategic challenges. Key industrial
    partners mentioned in public statements include TRUMPF (industrial laser manufacturing), Schott AG
    (optical glass and precision materials), Amplitude/Short (laser systems), and Japanese and Korean
    suppliers including Sumitomo, Mitsui, Hamamatsu, and Samsung. None of these have disclosed signed
    supply agreements publicly; the relationships appear to be at MoU and co-location interest stage.
    The Pearl fuel capsule must be produced and injected at 10 shots per second; no public target factory
    has demonstrated this throughput. The closed DT fuel cycle breeds tritium from a lithium blanket
    around the reaction chamber, closing the supply chain on the fuel side but requiring complex
    tritium-handling and lithium-chemistry systems whose reliability at commercial repetition rates is
    undemonstrated. The reactor's first wall and structural components must survive neutron flux from
    continuous operation for 2–3 years without exchange; activated materials require approximately
    50 years of storage before recycling. SourceLight's planned PLANET collaborative project—launched
    2024 with industry and research partners—is the first industrial prototype of the LDRS technology
    at Biblis, demonstrating the company's intention to monetise near-term spinoff value while the
    fusion roadmap matures.
