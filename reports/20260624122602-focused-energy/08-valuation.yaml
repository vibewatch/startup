- id: peer-benchmarks-and-transferability
  title: Peer Benchmarks and Transferability
  body: The peer set gives scale but not a clean one-for-one multiple. Helion is the obvious ceiling reference because it disclosed a June 2026 mega-round at a $15.5 billion post-money valuation, has roughly $1.5 billion of lifetime funding, a Microsoft power purchase agreement, and construction progress on its Orion plant. CFS is another upper-tier reference because its capital raised is much larger and its commercial program is anchored by SPARC milestones and a Google energy agreement. TAE's proposed transaction above $6 billion shows public-market appetite for fusion narratives, but its capital base and maturity still exceed Focused Energy's. Pacific Fusion, Marvel Fusion, and Xcimer are more comparable on stage, yet each still needs a haircut for modality differences, geography, or partner mix. Focused Energy uses direct-drive laser fusion, not Helion's pulsed magneto-inertial path or CFS's tokamak model. It also lacks Helion-style customer validation and TAE-style disclosed price discovery.
    The result is that peer marks are useful only after very large transferability discounts.
