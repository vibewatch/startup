- id: TV005
  title: Capital Intensity and Dilution Schedule
  columns:
  - Financing stage
  - Indicative capital need
  - What it must fund
  - Dilution implication
  rows:
  - - Completed Series A
    - $240M
    - Physics scale-up, team expansion, site work, supply chain, and early program management
    - Known new-money event, but economic terms are undisclosed
  - - Next private de-risking round
    - $300M-$600M
    - Target, driver, and systems integration beyond current research scale
    - Moderate to high dilution if raised before external technical proof
  - - Pilot / demonstration plant financing
    - $2B-$4B
    - FOAK engineering, site buildout, balance of plant, and safety / licensing work
    - Severe dilution if equity-heavy; manageable only with subsidies or project finance
  - - Commercial fleet-scale expansion
    - $5B-$10B+
    - Replication of first plants and grid-connected deployment
    - Current investors depend on non-dilutive capital to preserve returns
  notes: Capital bands are sector-style estimates synthesized from fusion market and industry reports; they frame order of magnitude, not company guidance.
