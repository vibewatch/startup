  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: post-money-valuation
    missingEvidence: Exact post-money valuation, security type, share count, and preference stack for the May 2026 Series A.
    whyItMatters: The chapter can confirm round size and investor quality, but it cannot determine whether the implied price is fair or heavily structured without the actual round economics.
    diligencePath: Request the financing deck, term sheet, and post-close cap table from management or the lead investor.
    relatedQuestionRefs:
    - QV001
    - QV002
    - QV031
    - QV032
    relatedTableRefs:
    - TV001
    - TV004
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: pilot-financing-roadmap
    missingEvidence: Internal capex plan and financing roadmap from the current $240M balance to pilot-plant construction and first-grid delivery.
    whyItMatters: The key economic risk is not just today's valuation but how much new capital must be raised before revenue exists; without that map, dilution cannot be bounded.
    diligencePath: Obtain the management model for research spending, pilot-plant capex, subsidy assumptions, and required equity/debt rounds.
    relatedQuestionRefs:
    - QV023
    - QV032
    relatedTableRefs:
    - TV004
    - TV005
    - TV006
  - type: private-evidence-only
    severity: material
    topic: customer-demand-evidence
    missingEvidence: Customer discussions, offtake negotiations, signed LOIs, or other demand-side evidence not disclosed publicly.
    whyItMatters: Strategic and policy validation do not replace revenue validation; even early commercial demand would materially improve transferability from premium peers.
    diligencePath: Ask management for the commercial pipeline, counterparties under NDA, and any non-public LOIs or utility engagement materials.
    relatedQuestionRefs:
    - QV007
    - QV018
    - QV020
    relatedTableRefs:
    - TV002
    - TV006
  - type: missing-source
    severity: minor
    topic: comparable-valuation-table coverage
    missingEvidence: A broader independent private-market data set covering additional fusion rounds, secondaries, and undisclosed valuation marks beyond the seven comparables listed in TV003.
    whyItMatters: The comparable table is intentionally partial because many fusion peers still disclose funding without clean valuation terms, which limits exhaustiveness.
    diligencePath: Expand the comparable sheet with direct cap-table data services or secondary-market indications when available.
    relatedQuestionRefs:
    - QV016
    - QV028
    - QV029
    - QV030
    relatedTableRefs:
    - TV003
