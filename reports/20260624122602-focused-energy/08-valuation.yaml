- id: TV003
  title: Comparable valuation table
  columns:
  - Company
  - Latest disclosed funding / value signal
  - Why it matters
  - Transferability haircut to Focused Energy
  rows:
  - - Helion Energy
    - $465M June 2026 round at $15.5B post-money; ~$1.5B lifetime funding
    - Best private-market ceiling for fusion venture appetite
    - 'Very large haircut: Helion has customer validation, plant construction, and far greater disclosed scale'
  - - Commonwealth Fusion Systems
    - $1.8B Series B family and largest fusion capital base
    - Shows how large capital pools reward milestone-rich fusion programs
    - 'Large haircut: CFS has tokamak milestone depth and better disclosed commercialization pathway'
  - - TAE Technologies
    - '> $6B proposed public-market combination via TMTG 8-K'
    - Signals that fusion stories can command public-equity-style optionality
    - 'Large haircut: TAE has deeper capital history and an explicit market-clearing valuation signal'
  - - Pacific Fusion
    - $900M Series B round cited as a major inertial-fusion financing
    - Closer stage reference for capital appetite toward pulsed fusion
    - 'Moderate haircut: modality differs and valuation terms remain less transparent than ideal'
  - - Marvel Fusion
    - ~$400M raised with Siemens Energy strategic support
    - Most relevant European private peer for strategic-industrial sponsorship
    - 'Moderate haircut: partner set is different and public valuation is still undisclosed'
  - - Xcimer Energy
    - ~$100M Series A / laser-system progress referenced in 2026 sector coverage
    - Useful laser-fusion stage marker below the Helion/CFS tier
    - 'Smaller haircut: closer technical modality, but funding scale is much lower than Focused Energy'
  - - Focused Energy
    - $240M Series A; no post-money disclosed; pre-round declared funding $26.5M
    - Current company baseline
    - N/A — underwriting depends on missing pricing and demand evidence
  notes: Peer entries mix disclosed post-money values, capital raised, and sector signals; haircuts reflect stage, modality, customer proof, and disclosure quality differences.
