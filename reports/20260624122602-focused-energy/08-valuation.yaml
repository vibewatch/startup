- id: scenario-ranges-and-milestone-gating
  title: Scenario Ranges and Milestone Gating
  body: A scenario framework is more honest than a single number because Focused Energy has disclosed financing size but not pricing quality. In the bull case, the company discloses a clean post-money, extends the Biblis siting path, converts the LLE collaboration and DOE-linked milestones into credible technical de-risking, and signs a first demand signal from a utility or industrial buyer. Under that setup a $1.2 billion to $2.2 billion range becomes plausible, but only after milestones that do not exist yet. The base case assumes the $240 million round buys two to three years of technical progress, hiring, and siting while commercial revenue remains distant; that supports a roughly $450 million to $950 million analytical range. The bear case assumes commercialization slips, direct-drive milestones lag, and the company needs a heavily dilutive follow-on before any customer contract; that yields roughly $150 million to $400 million. This matters because commercial fusion plants likely require
    multi-billion-dollar financing, so a 2037 first-grid target implies several financing events between now and revenue, each with dilution risk unless grants, subsidies, or project finance absorb most of the capital burden.
