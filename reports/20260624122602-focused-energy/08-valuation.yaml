- id: TV002
  title: Thesis / Anti-Thesis
  columns:
  - Lens
  - Bull thesis
  - Anti-thesis
  - What would decide it
  rows:
  - - Round quality
    - $240M Series A and elite syndicate imply serious investor demand
    - No post-money, security terms, or cap-table data were disclosed
    - Release of the actual round terms and liquidation waterfall
  - - Technical platform
    - Direct-drive laser fusion plus LLE collaboration can create a differentiated European champion
    - Direct-drive commercial proof still trails NIF-style ignition headlines
    - A disclosed milestone showing meaningful gain or target-shot progress
  - - Strategic validation
    - RWE, SPRIND, EIC, and Hesse provide policy and infrastructure leverage
    - RWE as both investor and site partner muddies arm's-length price signaling
    - Independent external lead pricing or a third-party project-finance commitment
  - - Commerciality
    - Policy tailwinds could pull buyers toward early fusion champions
    - No disclosed offtake, PPA, or LOI means demand remains unpriced
    - Signed customer demand evidence with volume, timing, and credit quality
  notes: The table pairs the positive narrative with the specific evidence gap that prevents full valuation transfer from later-stage peers.
