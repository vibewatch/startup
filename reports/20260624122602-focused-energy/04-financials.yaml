callouts:
  - calloutType: strength
    title: "$240M Series A Is the Largest Secured Fusion Series A — Policy Capital Anchors the Round"
    body: >-
      The May 2026 $240M oversubscribed Series A is the largest fully secured Series A in global
      fusion history. The cap table — a European utility (RWE), two German federal agencies
      (SPRIND, HessenFonds), an EU science fund (EIC Fund), and a U.S. deep-tech VC (Prime
      Movers Lab) — is structurally distinctive: it combines commercial validation (RWE as future
      power buyer), public industrial policy (SPRIND, Hesse, EIC), and venture capital in a single
      round. This blended structure reduces the company's dependence on pure private capital for
      future rounds.
    claimRefs: [CI001, CI006, CI007, CI008, CI009]

  - calloutType: strength
    title: "~$200M in Grants Substantially De-risks the R&D Phase"
    body: >-
      The company's ~$200 million in public grants — from DOE, SPRIND, the Hesse state, and EU
      programs — provides non-dilutive capital that reduces the equity burden during the R&D phase.
      This is a significant structural advantage: most competing laser fusion companies must fund
      R&D entirely from equity. The German and EU political environment continues to expand
      grant availability, and EIB project-finance discussions suggest future debt-side de-risking
      as well.
    claimRefs: [CI003, CI004, CI005, CI010, CI011]

  - calloutType: risk
    title: "Structural Capital Gap: ~$500M Raised vs. €5-10B Pilot Plant Cost"
    body: >-
      Total funding of ~$500 million represents approximately 5-10% of the estimated €5-10 billion
      Biblis pilot plant cost. Closing this gap requires a combination of future equity rounds,
      government co-financing commitments (beyond current grants), and EIB-style project finance
      — all of which are contingent on technical milestones, regulatory approvals, and sustained
      political support that do not yet exist. Capital risk is the primary financial underwriting
      risk for this investment.
    claimRefs: [CI018, CI032, CI033, CI034]

  - calloutType: risk
    title: "All Key Financial Metrics Are Private or Structurally Unavailable"
    body: >-
      No post-money valuation, burn rate, cash position, unit economics, LCOE target, or commercial
      pricing has been disclosed. The SEC Form D for the Series A has not been located in EDGAR
      (expected by ~June 11, 2026 if US Reg D applies). Conventional financial underwriting of
      this company is structurally impossible without a data-room access; all external analysis
      is limited to directional estimates from public funding announcements.
    claimRefs: [CI026, CI027, CI028, CI029, CI030]

  - calloutType: insight
    title: "EIB Project-Finance Discussions Signal the Capital Structure Roadmap"
    body: >-
      CEO Forner's reference to ongoing European Investment Bank discussions in the EIC Scaling
      Club interview is strategically important. EIB project finance is the standard structure
      for large European energy infrastructure projects (e.g., offshore wind, LNG terminals).
      If Focused Energy can access EIB loan guarantees or direct loans for the Biblis construction
      phase, it could close a large portion of the pilot plant funding gap through debt at
      below-market rates — dramatically reducing dilution to existing equity holders and validating
      commercial readiness.
    claimRefs: [CI035, CI036]

