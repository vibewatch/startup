company:
  name: "Focused Energy"
chapter:
  number: 4
  title: Financials
  summary: >-
    Focused Energy is pre-revenue with no disclosed burn rate, post-money valuation, or unit
    economics, consistent with a pre-commercial deep-tech laser fusion company in its R&D phase.
    The company's May 2026 $240 million Series A — the largest fully secured fusion Series A
    globally — lifts public estimates of lifetime private capital into an approximately
    $255-300 million range against an estimated
    €5–10 billion Biblis pilot plant cost, creating a structural capital gap that makes future
    government co-investment, project finance, or additional equity rounds necessary before
    commercial deployment. Underwriting is structurally constrained: virtually every conventional
    financial metric is private, inapplicable, or structurally unavailable at this stage, and
    the business model will not generate revenue until pilot plant electricity delivery, targeted
    for 2037.

sections:
  - id: capital-structure-and-series-a
    title: Capital Structure and Series A Financing
    body: >-
      Focused Energy closed a $240 million Series A on 27 May 2026, the largest fully secured
      Series A in global fusion history per the company and corroborated by TechCrunch, The Next
      Web, and Business Wire. The round was oversubscribed, with the company stating it attracted
      investors willing to fund through to a commercial fusion power plant. RWE AG led the round
      and has been reported by InforCapital to have contributed approximately $60 million, though
      RWE has not officially confirmed the split. SPRIND (German Federal Agency for Breakthrough
      Innovation), the European Innovation Council (EIC) Fund, and returning lead Prime Movers Lab
      also participated, alongside unnamed investors from Germany, Europe, Asia, and the Gulf region.
      The Hesse state government financing vehicles HessenFonds Beteiligungen and Hessen Kapital
      (managed by BMH) contributed as well. No post-money valuation was disclosed.

      Prior to the Series A, the company raised a $15 million seed round in 2021 (confirmed by
      SEC Form D filing, CIK 0001870675, accession 0001214659-21-007256, first sale 2021-06-22),
      led by Prime Movers Lab with Alex Rodriguez, Marc Lore, and Tony Florence as co-investors.
      Between the seed and Series A, additional private equity rounds brought public estimates of
      lifetime private capital into an approximately $255-300 million range. The TechCrunch figure
      implies roughly $45 million of intermediate private financing beyond the disclosed $15 million
      seed, while the InforCapital profile points to a somewhat lower running total — suggesting
      some intermediate rounds remain only partially documented in public sources.

      Focused Energy has also received approximately $200 million in public grants, bringing total
      funding to approximately $500 million. Identified grant components include: $3 million from
      the U.S. Department of Energy, an estimated $50 million from SPRIND (per InforCapital),
      €2.5 million from the state of Hesse in 2024 (€500k state + €2M from the European Regional
      Development Fund), and €20 million from the state of Hesse in December 2025. The European
      Investment Bank (EIB) Vice President Nicola Beer appeared in the Series A announcement
      materials, and CEO Forner has confirmed ongoing EIB project-finance discussions.

      No debt, convertible notes, project-finance facilities, or credit lines have been publicly
      announced. The company appears exclusively equity- and grant-funded as of the run date.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007, CI008, CI009, CI010, CI011]
    tableRefs: [TI004]
    figureRefs: [FI004]

  - id: revenue-model-and-monetization
    title: Revenue Model and Monetization Path
    body: >-
      Focused Energy is pre-revenue as of June 2026. No revenue, ARR, GMV, signed customer
      contracts, power purchase agreements, or commercial offtake arrangements have been publicly
      disclosed. The company's current outputs are R&D milestones, engineering prototypes, and
      facility development — not commercial products or services.

      The primary long-run revenue mechanism is electricity sales via power purchase agreements
      (PPAs) or wholesale electricity sales at a commercial laser fusion power plant: revenue
      recognized on MWh delivered to the grid at a contracted or spot price. This model mirrors
      conventional nuclear and renewable project finance structures. No pricing, target LCOE,
      or offtake contract terms have been disclosed.

      Secondary or transitional revenue mechanisms are inferable but unconfirmed: (1) technology
      licensing — if Focused Energy patents key laser system or target fabrication intellectual
      property, licensing to third-party plant builders could generate royalty income; (2) research
      services — the $6.9 million University of Rochester LLE collaboration models an
      industry-to-academic research agreement, but the reverse (charging for access to Focused
      Energy's own facilities) has not been announced; (3) government co-funded R&D contracts —
      DOE ARPA-E programs and EU Horizon grants represent continuing non-commercial revenue
      analogs that reduce cash burn but are not operating revenue.

      The revenue recognition challenge for pre-commercial laser fusion is acute. Unlike software
      or marketplace businesses, Focused Energy has no list pricing, no pilot customers, no letter
      of intent, and no contract backlog from which to project revenue. Forward revenue models
      depend entirely on unproven technical milestones (pilot plant 2035, first grid MWh 2037),
      regulatory pathways not yet established for commercial laser fusion, and electricity market
      conditions that are over a decade away. RWE's dual role as investor and prospective future
      customer is the most commercially meaningful signal, but no offtake terms have been disclosed.

      The EIC Scaling Club interview quotes CEO Forner on EIB project-finance discussions, which
      is the typical financing structure for large power plant deployments — suggesting the company
      is already thinking about non-equity capital for the commercial plant. However, project
      finance requires demonstrated technology and regulatory approvals that do not yet exist.
    claimRefs: [CI012, CI013, CI014, CI015, CI016, CI017]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]

  - id: cost-structure-and-capital-intensity
    title: Cost Structure and Capital Intensity
    body: >-
      Focused Energy's capital intensity is substantial. The Biblis pilot plant project is
      estimated to cost €5-7 billion per Fusion Energy Insights' reporting on the MoU; the
      German Wikipedia article cites approximately €10 billion for a broader scope. The two-fold
      uncertainty range signals that no detailed independent engineering cost study has been
      published. The company's current private capital of ~$300 million represents approximately
      3-6% of the pilot plant cost at the low end, illustrating the structural capital gap that
      must be closed through government co-financing, project finance, or multiple future rounds.

      Current operating cost signals are available only through inference. The company operates
      across four locations (Darmstadt HQ, Berlin, Austin, San Francisco/Redwood City) with 160+
      staff as of mid-2026, growing from approximately 100 employees at the time of the EIC
      interview (early 2026). The Darmstadt facility includes precision target-fabrication
      equipment (micro-milling, microscopy, cryo systems, lasers), which implies significant
      ongoing capex and operating expenditure. The December 2025 BusinessWire press release
      confirms AI/digital twin development activities in the Bay Area. No burn rate has been
      disclosed; an estimated annual burn rate of $30-80 million is inferred from headcount
      and facility signals, but this estimate carries low confidence and is not company-stated.

      The laser system requirements for a commercial plant are daunting: the company has stated
      it needs approximately 1,000-1,500 individual high-energy lasers (each capable of delivering
      over a kilojoule), currently manufactured manually like satellites. The supply chain
      transformation to mass manufacturing of these lasers — comparable in complexity to semiconductor
      lithography systems — is the core capital and operational challenge that the hiring of
      Omar Biabani from ASML is designed to address.

      Key ongoing cost lines for which no public data exist: (1) fuel target manufacturing cost
      per pellet (the NIF's complex indirect-drive target is expensive; Focused Energy's simplified
      direct-drive target is intended to be cheaper but no $/target figure has been published);
      (2) laser system unit cost and depreciation rate; (3) tritium supply chain costs (tritium
      is a rare and controlled isotope, and supply-chain costs are a significant unknown); (4)
      site preparation and adaptation costs at Biblis; (5) regulatory licensing costs.
    claimRefs: [CI018, CI019, CI020, CI021, CI022, CI023, CI024, CI025]
    tableRefs: [TI003]
    figureRefs: [FI002]

  - id: financial-disclosure-and-underwriting-blockers
    title: Financial Disclosure Profile and Underwriting Blockers
    body: >-
      Focused Energy's financial disclosure posture is consistent with a private pre-commercial
      deep-tech company: no conventional financial metrics are publicly available. No gross
      margin, EBITDA, burn rate, cash position, or unit economics have been disclosed. No
      post-money valuation from the May 2026 Series A is public. No revenue forecast, commercial
      pricing model, or management accounts have been disclosed.

      On the regulatory filing side, Focused Energy Inc. (CIK 0001870675) filed one SEC Form D
      under Rule 506(b) in July 2021 for the $15 million seed round. As of the June 24, 2026
      run date — 28 days after the May 27, 2026 Series A first sale — a Form D for the Series A
      should have been filed within the SEC's 15-day window (by approximately June 11, 2026),
      but no corresponding filing was found in the EDGAR full-text search. This may reflect:
      the Series A being structured primarily as a non-US offering (German GmbH), the US Reg D
      exemption not applying, a filing under a different entity name, or a filing not yet indexed.
      The absence of a Series A Form D is a minor diligence gap that warrants direct inquiry with
      the company.

      The structural underwriting challenge is compounded by the absence of: realized revenue,
      signed customer contracts, commercially disclosed pricing, independent engineering cost
      validation of the Biblis facility, tritium supply chain economics, fuel target manufacturing
      cost models, or independently audited financial statements. Every material financial metric
      relevant to a conventional underwrite is private, pre-commercial, or structurally unavailable.

      The EIC Scaling Club interview provides the clearest view of the company's financial strategy:
      CEO Forner described RWE as bringing "the perspective of a customer" on operational costs, and
      noted ongoing discussions with the European Investment Bank about project financing for
      the construction phase. This suggests the company expects that EIB-style project-finance
      will be required for the commercial plant, separate from the current equity round.
    claimRefs: [CI026, CI027, CI028, CI029, CI030, CI031]
    tableRefs: [TI005]
    figureRefs: [FI003]

  - id: forward-capital-and-financing-environment
    title: Forward Capital Requirements and Financing Environment
    body: >-
      Focused Energy's capital requirements dwarf its current capitalization. The Biblis pilot
      plant cost is estimated at €5-10 billion; the company has raised ~$300 million in private
      equity and ~$200 million in grants (~$500 million total). Even at the low end of the cost
      range (€5 billion ≈ $5.4 billion), the gap between current total funding and pilot plant
      cost is approximately $4.9 billion, not counting ongoing operating expenses through 2035.

      The German and European policy environment is the company's primary structural advantage
      for closing this gap. The Biblis MoU has secured formal Hesse state government and RWE
      commitments. The German federal government has placed fusion on its High-Tech Agenda and
      2025 coalition agreement. The European Investment Bank has expressed project-finance interest.
      The $6.9 million LLE partnership and SPRIND involvement demonstrate public-sector willingness
      to co-invest in R&D stages.

      Industry-level capital context from the Fusion Industry Association shows that fusion has
      surpassed $9.7 billion in global cumulative investment, with more than $2.6 billion raised
      in 2024-2025 alone. The FIA median respondent estimated needing an additional $700 million
      to bring first plants online; combined industry-wide capital requirements exceed $77 billion.
      These figures suggest Focused Energy's capital gap, while large, is shared across the sector
      and addressable through a combination of government co-financing, project finance, and
      additional equity rounds.

      Three near-term financing risks: (1) construction permitting at Biblis — if regulatory
      approvals slip, the 2035 pilot plant timeline slips, which delays the first revenue event
      and may require bridge financing; (2) competitor funding — Inertia Enterprises' $450 million
      Series A competes directly for laser ICF talent and investor attention; (3) German political
      continuity — the current pro-fusion policy environment depends partly on the post-2025
      conservative coalition maintaining its High-Tech Agenda priorities.
    claimRefs: [CI032, CI033, CI034, CI035, CI036]
    tableRefs: []
    figureRefs: []

