  evidenceGaps:
  - type: missing-source
    severity: material
    topic: german-industrial-heat-market-size
    missingEvidence: A quantified estimate of the high-temperature industrial heat market in Germany and the EU addressable by laser fusion in the 2030–2040 window
    whyItMatters: Without a credible industrial-heat SAM figure, Focused Energy's European-differentiation thesis cannot be sized, and the premium over U.S.-only hyperscaler-only fusion narratives is unquantified
    diligencePath: Commission an industrial-energy market analysis from Fraunhofer, IEA, or McKinsey, or request internal FE analysis of identified German steel, chemicals, and cement plant candidates
    relatedQuestionRefs:
    - QM005
    - QM011
  - type: private-evidence-only
    severity: material
    topic: focused-energy-commercial-customers
    missingEvidence: Any publicly disclosed PPA, industrial-host agreement, or named offtake customer for Focused Energy beyond the Biblis MOU with RWE
    whyItMatters: Without contracted demand, the market-opportunity framing cannot be grounded in observable buyer willingness-to-pay, and the comparison to Helion and CFS cannot be made on equal terms
    diligencePath: Request FE management disclosure of any private commercial discussions, letters of intent, or MOU terms beyond those already public; cross-check with RWE's public filings and press releases
    relatedQuestionRefs:
    - QM010
    - QM026
  - type: missing-source
    severity: minor
    topic: lighthouse-specific-milestones
    missingEvidence: A set of specific, dated, falsifiable Lighthouse demonstration milestones published by Focused Energy beyond the general Biblis narrative
    whyItMatters: Timeline credibility is a known sector risk; without public milestones, investors cannot benchmark progress or assign probability to commercialisation dates
    diligencePath: Request FE's internal milestone schedule for Lighthouse and compare to peer public roadmaps (Xcimer whitepaper, Pacific Fusion updates)
    relatedQuestionRefs:
    - QM020
