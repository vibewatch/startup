- id: FM004
  title: Fusion adoption funnel — stages from public R&D to broad market deployment
  type: funnel
  layout: standard
  summary: Fusion plant deployment follows a staged funnel from government-backed demonstration through anchor offtake and FOAK project finance to commercial fleet rollout; Focused Energy is currently at stage two (demonstration funding secured) and has not yet reached stage three (anchor customer commitment).
  data:
    items:
    - label: 'Stage 1: Scientific feasibility — LLNL NIF ignition (2022) and Helion DT milestone (2025)'
      value: 100
      detail: ICF scientific feasibility established at NIF Dec 2022; Helion achieved 150M°C DT plasma in Polaris, setting commercial fusion industry records.
    - label: 'Stage 2: Series A and demonstration system funding (Focused Energy 2026)'
      value: 60
      detail: Focused Energy $240M Series A (May 2026) funds Lighthouse demonstration system at Biblis; Pacific Fusion and Xcimer also at this stage.
    - label: 'Stage 3: Anchor offtake or industrial-host commitment'
      value: 20
      detail: Helion (Microsoft, Nucor) and CFS (Eni PPA) have reached this stage; Focused Energy and most ICF peers have not yet disclosed anchor customers.
    - label: 'Stage 4: FOAK project finance and regulatory approval'
      value: 5
      detail: Requires bankable plant economics, permitting at Biblis, and structured debt or project finance; CFS leading with ARC Virginia site and Dominion Energy partnership.
    - label: 'Stage 5: First grid power delivery and fleet rollout'
      value: 1
