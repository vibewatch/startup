  title: Market sizing lens — from broad fusion TAM to zero public SOM
  type: pyramid
  layout: standard
  summary: The defensible sizing lens for Focused Energy narrows from broad fusion-ecosystem market forecasts down to a European-anchored firm-power and industrial-heat beachhead, while the company's disclosed current SOM remains zero public contracted demand.
