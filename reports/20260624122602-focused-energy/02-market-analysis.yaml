  rows:
  - - Hyperscaler and AI-campus firm power (Europe + global)
    - Long-term PPAs, behind-the-meter generation, capacity reservations, interconnection-ready plant development
    - Generic renewable offsets, colocation rent, software spend without firm-power need
    - Hyperscalers, AI-campus developers, energy-procurement and infrastructure teams
    - Directly matches Focused Energy's stated clean-firm-power use case; strongest near-term premium-buyer demand signal
  - - German and EU industrial process heat and power
    - On-site power blocks, high-temperature industrial heat supply, cogeneration, replacement of fossil-fuel process heat for steel, cement, chemicals
    - Energy-efficiency software, carbon-accounting tools, low-duty-cycle backup without process-heat need
    - Plant operations, energy procurement, sustainability leadership, project-finance sponsors
    - Distinctive European angle; Germany's industrial decarbonisation mandate and EU ETS carbon price elevate willingness to pay
  - - Utility and IPP grid-scale generation (European and German grid)
    - FOAK plant capex, regulated capacity procurement, utility or IPP development budgets, grid-integration spend
    - Generic peaker investment, existing renewable capacity procurement solved by incumbents
    - Utilities (RWE, Eni, Dominion analogs), IPPs, grid planners, public-private consortia
    - Biblis site positions Focused Energy for a utility-grade pilot; RWE is simultaneously investor and potential first utility buyer
  - - Sovereign and municipal water / district-heating infrastructure
    - Co-located power plus heat projects, sovereign infrastructure finance, stable high-load power supply
    - Routine water-utility O&M without new generation procurement
    - Water utilities, municipal energy agencies, sovereign infrastructure vehicles
    - Favours Focused Energy's compact, always-on generation; Germany has active district-heating expansion mandates
  - - European energy-security and supply-chain resilience
    - Government co-investment, public-private R&D grants, site-development subsidies for domestic fusion capacity
    - Pure fission R&D, unrelated defence or weapons programs
    - German federal government (SPRIND, BMWK), Hesse state, EIC Fund, EU programmes
    - SPRIND and EIC Fund already in cap table; Hesse EUR 20M commitment in 2026 validates public co-investment channel
  - - 'Adjacency: fusion enabling supply chain and R&D ecosystem'
    - Targets, optics, diode-pumped laser, fuel-cycle and lab-partnership spending enabling deployment
    - Counted in Focused Energy TAM only if company monetises components or services directly
    - DOE, LLNL, national labs, component suppliers, peer developers
    - Critical enabling ecosystem; not core commercial revenue for Focused Energy today
  notes: Included spend is limited to commercial plant and firm-power budgets aligned with Focused Energy's stated use cases. NIF stockpile stewardship, weapons R&D, and generic clean-energy procurement solved by renewables are treated as excluded or adjacent unless they directly enable a Focused Energy plant.
