callouts:
- calloutType: insight
  title: European energy-security angle is Focused Energy's most differentiated market entry
  body: While U.S. fusion developers compete primarily on hyperscaler and utility PPAs, Focused Energy's German base, RWE partnership, SPRIND/EIC Fund backing, and Biblis brownfield strategy create a European-energy-security narrative that no direct laser-ICF peer has matched. This could unlock public co-investment, regulatory fast-tracking, and industrial-heat offtake channels unavailable to U.S. competitors — but only if Lighthouse milestones land credibly.
  claimRefs:
  - CM003
  - CM007
  - CM008
  - CM028
  - CM035
- calloutType: risk
  title: Zero public SOM is a material diligence gap for market-size claims
  body: Every published fusion TAM is a future-revenue scenario, not a current-booking figure. Focused Energy has no disclosed PPAs, no named commercial customers, and no publicly confirmed offtake beyond the Biblis MOU with RWE. Until anchor demand is contracted, the market-opportunity framing carries substantial execution risk, and valuation multiples cannot be grounded in observable revenue.
  claimRefs:
  - CM009
  - CM010
  - CM029
  - CM038
  - CM040
