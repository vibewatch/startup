- id: TM004
  title: Growth drivers and adoption constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication for Focused Energy
  - Diligence ask
  rows:
  - - European energy-security urgency post-Ukraine
    - Tailwind
    - Immediate; political mandate active in 2026
    - Elevates willingness-to-pay for domestic firm power; Germany specifically backs Biblis plan with public funds
    - Can Focused Energy lock in government co-development commitments before a U.S. or Asian peer establishes European precedent?
  - - AI / data-centre electricity demand growth
    - Tailwind
    - 2024–2030 acute; longer-run structural
    - Creates premium clean-firm-power buyers globally; European hyperscaler expansion adds regional demand
    - Will hyperscalers sign forward PPAs with Focused Energy pre-Lighthouse as they have done with U.S. peers?
  - - Lighter fusion-specific regulation (ADVANCE Act / EU framework)
    - Tailwind
    - 2024 codified in US; EU framework evolving
    - Reduces regulatory-approval cost and timeline; Biblis brownfield site may have pre-existing grid and safety permits
    - What is the specific German regulatory pathway for Lighthouse at Biblis under the Atomgesetz successor framework?
  - - German industrial decarbonisation mandates and EU ETS carbon price
    - Tailwind
    - 2026–2035; EU ETS tightening
    - Elevates cost-of-fossil-fuel-alternative for heavy industry; direct-heat applications become economically viable earlier if fusion LCOE falls fast enough
    - Does Focused Energy have any discussions with German industrial operators (steel, chemicals) as potential anchor industrial customers?
  - - Capital intensity and FOAK project finance availability
    - Constraint
    - Critical 2027–2032 (Lighthouse to first commercial plant)
    - Even with $240M Series A, gap to first commercial plant is enormous; FOAK project finance requires bankable plant economics unavailable pre-demonstration
    - What is the path from $240M to commercial plant? What additional equity tranches and debt / project finance are needed?
  - - Direct-drive target manufacturing at industrial scale
    - Constraint
    - Blocking before commercial plant; critical R&D milestone at Lighthouse
    - 10 shots per second requires millions of pellets daily at sub-dollar cost; no public demonstration of this capability exists anywhere in industry
    - What is Focused Energy's current target-fabrication rate, cost per target, and path to industrial-scale production?
  - - Tritium and lithium-6 supply chain
    - Constraint
    - Material; SCSP flags as strategic bottleneck
    - DT fusion requires tritium breeding and lithium-6 enrichment; supply is concentrated in a few countries with competing uses
    - Does Focused Energy have a disclosed tritium supply strategy? Are they a member of any supply-chain consortia?
  - - Timeline credibility and public-trust risk
    - Constraint
    - Ongoing; worsens if milestones slip
    - Overpromised timelines can damage public confidence and investor appetite; Kleinman warns this is a sector-wide vulnerability
    - What specific, falsifiable Lighthouse milestones and dates has Focused Energy committed to publicly?
  notes: Timing labels are qualitative; "immediate" means active as of runDate 2026-06-24. Diligence asks reflect public-corpus gaps and should be validated in management discussions.
