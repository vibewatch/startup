- id: sizing-lenses-and-beachhead
  title: 'Sizing Lenses: Broad TAM, Demand Pull, and the Missing Focused Energy SOM'
  body: 'No public source isolates a Focused Energy-specific SAM or SOM. Published fusion market forecasts measure different things and produce a wide range. MarketsandMarkets sizes a broad nuclear fusion market at $18.0 billion in 2026, growing to $33.77 billion by 2031 at a 13.4 percent CAGR, counting fusion across technologies, fuels, end users, and regions. Future Markets describes a sector that could reach $40–$80 billion by 2036 and exceed $350 billion by 2050 if technical milestones land on time. The Fusion Industry Association''s 2025 survey offers a third, supply-side lens: the industry had raised $9.766 billion to date but said it still needed more than $77 billion additional capital to bring all surveyed companies to commercialisation. Those are directionally useful signals, not Focused Energy revenue forecasts.


    The cleanest demand-side lens comes from the buyer problems Focused Energy explicitly names. European energy security stands out: Germany''s dependence on imported gas, the political will to re-industrialise on domestic clean energy, and the Hesse state government''s commitment of up to EUR 20 million for fusion research in 2026 all point to a premium for carbon-free firm power made in Germany. On the hyperscaler side, S&P Global and IEA estimates point to electricity demand from data centres growing rapidly through 2030, creating a global premium-firm-power need that fusion developers invoke across their commercial narratives. The European Industrial Heat decarbonisation market — Germany''s steel, chemicals, and cement sectors alone — adds a distinct angle less prominent in U.S. fusion analyses.


    Focused Energy''s current SOM is best treated as zero in public contracted terms: no disclosed PPAs, no named offtake customers, and no public plant-host commitments beyond the Biblis MOU with RWE. That does not foreclose private discussions, but it does mean the commercial case rests on market-opportunity framing rather than contracted demand.'
