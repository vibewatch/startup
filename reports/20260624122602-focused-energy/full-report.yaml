      - number: '7.3'
        title: Capital, Timeline, and Competitive Risk
        blocks:
          - type: paragraph
            body: >-
              The May 2026 $240 million Series A is strategically important but not close to sufficient for a first
              laser-fusion power plant. Focused Energy's public roadmap runs from a first laser in 2028 to first grid
              megawatt-hours in 2037, implying an eleven-year development arc from the Series A close and multiple
              intermediate facilities that each require capital, permits, and technical success. No customer offtake,
              PPA, or revenue bridge has been publicly disclosed, so every delay before pilot-plant operation increases
              dependence on equity, grants, or project finance. Relative to peers, Focused Energy is better funded than
              many early fusion startups, but it is not the category capital leader: CFS has raised more than $1.8
              billion, Helion announced a far larger June 2026 financing at a $15.5 billion post-money valuation,
              Pacific Fusion publicized a $900 million raise, and TAE is pursuing a multibillion-dollar public-market
              transaction. Even within laser fusion, Marvel Fusion and other inertial-confinement programs compete for
              specialist talent, industrial partnerships, and political attention. The net result is that Focused Energy
              must execute on a timeline that is simultaneously longer than venture norms and shorter than the time
              usually required to industrialize first-of-a-kind power infrastructure.
