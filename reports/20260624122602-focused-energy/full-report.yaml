      - number: '5.3'
        title: Biblis Roadmap and Development Stages
        blocks:
          - type: paragraph
            body: >-
              The Biblis former nuclear power plant site in southern Hesse is the linchpin of the Focused Energy
              commercialisation timeline. A joint Arthur D. Little/Focused Energy feasibility study found that the
              existing turbine halls, storage buildings, and reinforced reactor domes can be repurposed for laser
              laboratories, target fabrication, high-power laser test stations, and eventually a demonstration
              plant—materially reducing capital costs and accelerating timelines vs. a greenfield build. Germany's
              October 2025 Fusion Action Plan reclassified fusion from nuclear law to radiation protection law, removing
              the most burdensome regulatory layer. The IAEA, in an assessment that explicitly names Biblis as a
              lighthouse project, has declared fusion has entered the engineering phase. As of the Series A close in May
              2026, Focused Energy plans its first warehouse and laser development hall at Biblis operational within
              12–24 months, a first integrated laser test facility in a cleared former machine hall by approximately
              2028–2030, a full Technology Readiness Level 6 facility by 2030 validating all major components, and a
              prototype Fusion Pilot Plant (FPP) by 2035–2036. Should the Biblis site win Germany's call for proposals
              for a national laser fusion hub, RWE has committed to accelerate decommissioning to make nuclear
              infrastructure available for fusion use as soon as possible. FE also announced the planned spin-off
              SourceLight in June 2026 to commercialise laser-driven radiation source (LDRS) technology—combining
              high-energy X-ray and neutron output from a single compact system—for near-term industrial applications in
              nuclear waste characterisation, port security, and non-destructive testing, with a first industrial
              prototype also planned at Biblis.
