  - id: FE004
    title: Product maturity / capability map
    type: matrix
    layout: wide
    summary: >-
      Qualitative readiness assessment across six technology dimensions, showing where FE has public validation vs.
      where gaps remain as of June 2026.
    approximationNotes: >-
      Cells are qualitative summaries of public evidence available as of June 2026. TRL scores are indicative and not
      independently verified. "Validated subsystem" means published experimental or milestone evidence; "concept /
      planned" means company roadmap without independent confirmation.
    claimRefs:
      - CE004
      - CE007
      - CE012
      - CE033
      - CE036
      - CE038
      - CE040
    data:
      columns:
        - Evidence level
        - Basis for assessment
        - Remaining gap
      rows:
        - label: Target physics (NIF ignition heritage)
          values:
            - Strongly validated (external)
            - >-
              NIF peer-reviewed ignition; FE co-founders and CSO designed NIF target; APS DPP 2025 paper with 1D gain
              >50 designs
            - PFI-specific ignition has not been demonstrated in an integrated experiment; NIF used indirect drive
        - label: Proton beam focusing (PFI ignitor)
          values:
            - Subsystem validated
            - >-
              DOE Milestone 2 (Nov 2024) at Colorado State demonstrated laser-generated proton focusing and rep-rate
              target alignment
            - Full-scale PFI integrated experiment with compression + proton ignition has not been demonstrated
        - label: High-rep solid-state laser system (10 Hz DPSSL)
          values:
            - Concept / early development
            - Laser development hall at Biblis planned; no public 10 Hz kilojoule-class DPSSL demonstration reported
            - >-
              10 Hz kilojoule lasers at commercial reliability and cost do not currently exist; represents a multi-year
              engineering challenge
        - label: Pearl target factory (10 Hz throughput)
          values:
            - Concept / early stage
            - >-
              In-house target lab exists and demonstrated rep-rate alignment (DOE milestone); no public factory-scale
              throughput
            - Commercial-scale target production (~864,000 capsules/day) is an unsolved manufacturing problem
        - label: Chamber wall and materials
          values:
            - Concept / undemonstrated
            - Problem framed in NEI article; no public materials programme, irradiation data, or prototype chamber
            - Neutron-flux material survivability over 2–3 year campaigns is a blocking engineering gap
        - label: Balance-of-plant and grid integration
          values:
            - Concept / conventional engineering
            - Conventional steam-cycle engineering; RWE grid expertise available; Biblis grid connection pre-existing
            - No public balance-of-plant design specific to laser-fusion thermal output has been disclosed
  - id: FU001
    title: Customer Journey Map — From Awareness to Potential Offtake
    type: journey-map
    insight: >-
      As of June 2026, the most advanced customer relationships — RWE and Land Hessen — are at the formal partnership
      and investment stage. No entity has reached the offtake readiness phase. The journey from investment/MoU to
      commercial power delivery requires approximately a decade of FPP development.
    claimRefs:
      - CU001
      - CU006
      - CU007
    data:
      nodes:
        - id: seg-sovereign
          label: Sovereign Funders (DOE, SPRIND, EIC)
          description: Government entities that validate technology and provide non-dilutive capital; current stage
          phase: 1
        - id: seg-utility
          label: Strategic Industrial Partner (RWE)
          description: Utility investor providing site access and grid expertise; at investment and MoU stage
          phase: 2
        - id: seg-hessen
          label: Land of Hessen (Government MoU)
          description: State government with signed MoU for first German FPP at Biblis; at formal partnership stage
          phase: 2
        - id: seg-research
          label: Research Partners (LLE, EU consortia)
          description: Science and technology validators with active programme funding; supporting technical credibility
          phase: 1
        - id: seg-gulf-asia
          label: Gulf and Asian Investor-Buyers
          description: Described as potential buyers; equity investors in Series A with no disclosed MoU
          phase: 1
        - id: offtake-gap
          label: Commercial Offtake (Gap — 2035+)
          description: No entity at this phase as of June 2026; first commercial power delivery targeted post-FPP prototype
          phase: 3
  - id: FU002
    title: Adoption Funnel — From Addressable Universe to Signed Commercial Contract
    type: funnel
    insight: >-
      The funnel narrows sharply below the programme-partner stage. Seven named relationships exist but only two have
      formal MoU or site commitments, and zero have signed commercial energy contracts. The gap between investment and
      offtake is the defining commercial risk.
    claimRefs:
      - CU001
      - CU004
      - CU019
    data:
      items:
        - label: Addressable universe (large utilities/governments globally capable of fusion offtake)
          value: 500
        - label: Fusion-aware policy participants (governments and utilities engaged in fusion dialogue)
          value: 50
        - label: Named FE strategic relationships (investors, programme partners, site partners)
          value: 7
        - label: Formal MoU or site commitment holders
          value: 2
        - label: Series A investors with stated buyer intent (Gulf/Asian cohort)
          value: 2
        - label: Signed commercial energy contracts or PPAs
          value: 0
  - id: FU003
    title: Customer Proof Quality Matrix
    type: matrix
    insight: >-
      RWE is the strongest proof-point, with two investment rounds and a physical site commitment, but even RWE lacks a
      commercial energy contract. All other relationships score as pre-commercial or grant-stage only, confirming that
      the customer proof base is investment and programme partnerships rather than commercial energy buyers.
    claimRefs:
      - CU001
      - CU004
      - CU022
      - CU023
      - CU037
    data:
      columns:
        - Evidence level
        - Outcome specificity
        - Retention visibility
        - Production maturity
      rows:
        - label: RWE
          values:
            - Formal investment (2 rounds over ~4 years)
            - Biblis site operator and grid engineering support; no power delivery
            - Continued through Series A; relationship expanding
            - Pre-commercial R&D co-location only
        - label: Land of Hessen
          values:
            - Signed MoU (March 2025)
            - First FPP site endorsement; no binding commercial terms
            - MoU not publicly renewed or superseded
            - Non-binding government agreement only
        - label: SPRIND and EIC Fund
          values:
            - Programme membership plus equity
            - Innovation mandate fulfilled; no energy delivery
            - Continued through 2026 Series A
            - Grant and early-equity stage only
        - label: DOE Milestone Programme
          values:
            - Two milestones completed (November 2024)
            - Technical validation milestones; no energy delivery
            - Active; ongoing programme
            - R&D validation phase only
        - label: Gulf and Asian investor-buyers
          values:
            - Series A capital commitment
            - CEO describes as future buyers; no MoU or LOI disclosed
            - Unknown; investor identities undisclosed
            - Pre-commercial financial investment only
