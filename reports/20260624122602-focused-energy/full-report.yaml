      - number: '2.3'
        title: Buyer, User, and Payer Segmentation for Fusion Power
        blocks:
          - type: paragraph
            body: >-
              Early fusion buyers are not abstract 'the grid' customers. Peer evidence shows that they are specific
              organisations with acute reliability pain and concentrated budget authority. Helion's Microsoft PPA (50 MW
              targeted by 2028, building underway in Malaga, Washington) and Nucor agreement (500 MW) demonstrate that
              hyperscalers and heavy industry can commit before utilities normalise the category. Commonwealth Fusion
              Systems' $1 billion-plus PPA with Italian utility Eni and CFS's Chesterfield County site selection show
              that utilities and IPPs can also act as anchor buyers once a credible plant plan exists. Focused Energy's
              stated use cases — clean firm power for Germany and Europe, industrial heat decarbonisation, and the
              Biblis-site industrial-host model — imply four buyer groups, each with distinct budget ownership.


              Hyperscaler and AI-campus operators buy on reliability and carbon-free attributes; budget sits with
              energy-procurement and data-centre infrastructure teams. German and European industrial operators (steel,
              chemicals, cement) need decarbonised process heat; budget sits with plant energy, capex, and
              sustainability leadership. Utilities and IPPs need dispatchable, low-carbon capacity; budget sits with
              asset development and generation investment teams. Sovereign and municipal infrastructure sponsors —
              water, district heating — need long-duration, location-independent power; budget sits with
              public-infrastructure finance. The adoption path across all segments looks similar: public-private
