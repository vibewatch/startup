  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role in system
      - Key dependency
      - Primary technology risk
    rows:
      - - Compression laser driver (diode-pumped solid-state, 351 nm)
        - Delivers kilojoule-scale, nanosecond pulses to implode the DT target at 10 Hz
        - Mass manufacturing of ~1,000 laser amplifiers per plant at acceptable cost
        - >-
          High-repetition laser reliability, thermal management, optics lifetime; 10 Hz kilojoule-class DPSSL does not
          yet exist at commercial scale
      - - Proton fast ignition (PFI) sub-system
        - Picosecond high-intensity pulse generates TNSA proton beam that ignites compressed fuel
        - Proton beam focus, timing synchronisation with compressed core, cone-in-shell capsule geometry
        - >-
          LPI during compression, hydrodynamic instabilities, proton ignitor beam characterisation; no end-to-end
          integrated PFI demonstration exists
      - - Pearl DT fuel capsule and target injection
        - Precision-manufactured capsule filled with cryogenic DT fuel; injected into chamber at 10 Hz
        - Mass-producible capsule with controlled surface finish; high-rep-rate cryogenic injection and alignment
        - Target factory throughput and cost at commercial scale; no public roadmap for ~864,000 capsules/day
      - - Reaction chamber and first wall
        - Contains fusion shots; absorbs neutron energy; tritium breed blanket surrounds the fuel
        - First-wall material capable of surviving neutron flux for 2–3 years; chamber debris clearing between shots
        - >-
          Materials survivability under sustained neutron flux undemonstrated; chamber maintenance and remote operation
          unsolved
      - - Lithium blanket and tritium fuel cycle
        - Breeds tritium from lithium; closes DT fuel cycle; enables energy capture via heat exchangers
        - Tritium handling infrastructure; lithium-chemistry corrosion control; tritium inventory management
        - >-
          Global tritium market is thin; lithium-blanket breeding demonstrated in fission but not in laser-fusion
          environment
      - - Balance-of-plant (steam cycle, grid connection)
        - Converts captured thermal energy to electricity; interfaces with transmission grid
        - Conventional power-plant engineering; RWE grid and site expertise
        - Limited public detail on balance-of-plant design for a laser fusion plant specifically
    notes: >-
      Architecture is based on public statements, conference papers, and third-party feasibility studies. No independent
      engineering validation of system integration has been publicly published.
