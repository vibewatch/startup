              operating expenses through 2035.

              The German and European policy environment is the company's primary structural advantage for closing this
              gap. The Biblis MoU has secured formal Hesse state government and RWE commitments. The German federal
              government has placed fusion on its High-Tech Agenda and 2025 coalition agreement. The European Investment
              Bank has expressed project-finance interest. The $6.9 million LLE partnership and SPRIND involvement
              demonstrate public-sector willingness to co-invest in R&D stages.

              Industry-level capital context from the Fusion Industry Association shows that fusion has surpassed $9.7
              billion in global cumulative investment, with more than $2.6 billion raised in 2024-2025 alone. The FIA
              median respondent estimated needing an additional $700 million to bring first plants online; combined
              industry-wide capital requirements exceed $77 billion. These figures suggest Focused Energy's capital gap,
              while large, is shared across the sector and addressable through a combination of government co-financing,
              project finance, and additional equity rounds.

              Three near-term financing risks: (1) construction permitting at Biblis — if regulatory approvals slip, the
              2035 pilot plant timeline slips, which delays the first revenue event and may require bridge financing;
              (2) competitor funding — Inertia Enterprises' $450 million Series A competes directly for laser ICF talent
              and investor attention; (3) German political continuity — the current pro-fusion policy environment
              depends partly on the post-2025 conservative coalition maintaining its High-Tech Agenda priorities.
