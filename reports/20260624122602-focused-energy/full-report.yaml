      - number: '7.4'
        title: Execution, Concentration, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Execution risk is unusually concentrated. Focused Energy still has a relatively small core team for the
              ambition level of building a fusion campus and eventually a pilot plant, and the company itself highlights
              the strategic importance of its founder-led scientific leadership. CEO Thomas Forner and co-founder Markus
              Roth anchor capital formation, technical credibility, and the policy narrative; there is no public
              evidence of a deep successor bench or a public contingency plan if either becomes unavailable. The
              dependency map is also narrow. RWE is simultaneously the lead investor, site counterpart, grid and utility
              relationship, and the operator managing Biblis decommissioning, so one stakeholder sits in multiple
              critical-path positions. Public support from SPRIND and other state-linked actors is helpful, but it also
              means the program remains exposed to government budgeting and industrial-policy continuity. The proposed
              SourceLight spin-out adds another management vector before the fusion core is de-risked. In practical
              diligence terms, the investment case should be treated as broken if high-repetition laser data remain
              private without credible third-party validation, if the Biblis construction window slips materially behind
              the published milestones, if no follow-on financing path emerges before the 2028-2031 build phase, or if
              RWE's strategic role narrows.
