              purchase agreement or offtake contract. Customer relationships fall into four primary categories:
              sovereign governments and public innovation funders — Germany's SPRIND, the European Innovation Council,
              and the US Department of Energy — who validate the technology and provide non-dilutive capital; strategic
              industrial investors with potential future offtake interest, principally RWE, a European utility operator
              and Biblis site partner; international investor-buyers from the Gulf and Asian markets described by CEO
              Thomas Forner as potential buyers of fusion energy; and research programme partners such as the University
              of Rochester's Laboratory for Laser Energetics and EU-funded consortia who co-develop the technology base
              without commercial energy purchase intent. No hyperscaler or data-centre customer has publicly expressed
              acquisition interest, and no industrial process-heat buyer has been publicly identified. Germany and
              Europe are the clear near-term geographic focus, driven by the Biblis site, RWE's involvement, Germany's
              October 2025 Fusion Action Plan, and the European Commission policy dialogue initiated through Focused
              Energy's open letter. Buyer segmentation spans sovereign, industrial, research, and emerging-market
              geographies, with commercial offtake as a 2035-plus horizon objective.
