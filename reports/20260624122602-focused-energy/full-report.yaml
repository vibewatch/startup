            title: RWE as Both Lead Investor and Infrastructure Partner
            body: >
              RWE's role is structurally unique among fusion investments: it is simultaneously the lead Series A
              investor, the provider of the Biblis decommissioned nuclear site (with existing grid connection, cooling
              infrastructure, regulatory frameworks, and nuclear-trained workforce), and the operational partner for the
              pilot plant. This structure compresses development timelines by years compared to a greenfield site and
