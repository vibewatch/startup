  - id: FM001
    title: Market sizing lens — from broad fusion TAM to zero public SOM
    type: pyramid
    layout: standard
    summary: >-
      The defensible sizing lens for Focused Energy narrows from broad fusion-ecosystem market forecasts down to a
      European-anchored firm-power and industrial-heat beachhead, while the company's disclosed current SOM remains zero
      public contracted demand.
    data:
      nodes:
        - label: 'Broad global fusion ecosystem TAM: $18.0B (2026) → $33.77B (2031)'
          detail: MarketsandMarkets counts all fusion approaches, fuels, end users, and regions; includes research spending.
          tone: positive
        - label: 'Long-horizon sector scenario: $40B–$80B (2036) to >$350B (2050)'
          detail: Future Markets scenario for fusion as a large energy-market category if milestones land on schedule.
          tone: positive
        - label: 'Premium firm-power demand pull: electricity demand 6x faster than energy demand (IEA, to 2035)'
