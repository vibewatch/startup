              The June 2026 announcement of the SourceLight spinoff, commercialising laser-driven radiation source
              technology for industrial inspection, creates a parallel revenue pathway independent of the fusion
              timeline. The first SourceLight prototype is reported to be in development at Biblis. If successful,
              SourceLight revenue could sustain investor confidence and cash flow during the 2026–2035 period before FPP
              demonstration. However, no SourceLight customer has been publicly disclosed, and the LDRS market is
              competitive and technically demanding.
            calloutType: insight
            claimRefs:
              - CU020
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Technology and Engineering Risk
        blocks:
          - type: paragraph
            body: >-
              Focused Energy's central technical risk is that its chosen pathway—direct-drive laser inertial confinement
              fusion using the proprietary Hybrid Shock target architecture—has never achieved public ignition, whereas
              the best-validated inertial-confinement milestone to date was achieved by NIF using indirect drive. That
              distinction matters because the company is not commercializing the exact configuration that already
              worked. Its March 2026 LLE collaboration is explicitly aimed at unresolved laser-plasma instability
              problems including CBET, SRS, and TPD, which indicates that some of the most important physics closure
              items are still being experimentally worked rather than engineered down. Even if the physics closes, the
              plant-design assumptions are severe: commercial operation requires roughly 10 shots per second, durable
              ultraviolet laser components at high repetition, and target fabrication and injection at industrial
              throughput with no public precedent at millions of targets per year. Focused Energy has not published a
              public cost model or throughput model for the Hybrid Shock target line, so investors cannot yet test
              whether the direct-drive concept is merely scientifically plausible or actually manufacturable at plant
              economics.
            claimRefs:
