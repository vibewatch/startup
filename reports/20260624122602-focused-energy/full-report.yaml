      - number: '4.3'
        title: Cost Structure and Capital Intensity
        blocks:
          - type: paragraph
            body: >-
              Focused Energy's capital intensity is substantial. The Biblis pilot plant project is estimated to cost
              €5-7 billion per Fusion Energy Insights' reporting on the MoU; the German Wikipedia article cites
              approximately €10 billion for a broader scope. The two-fold uncertainty range signals that no detailed
              independent engineering cost study has been published. The company's current private capital of ~$300
              million represents approximately 3-6% of the pilot plant cost at the low end, illustrating the structural
              capital gap that must be closed through government co-financing, project finance, or multiple future
              rounds.

              Current operating cost signals are available only through inference. The company operates across four
              locations (Darmstadt HQ, Berlin, Austin, San Francisco/Redwood City) with 160+ staff as of mid-2026,
              growing from approximately 100 employees at the time of the EIC interview (early 2026). The Darmstadt
              facility includes precision target-fabrication equipment (micro-milling, microscopy, cryo systems,
              lasers), which implies significant ongoing capex and operating expenditure. The December 2025 BusinessWire
              press release confirms AI/digital twin development activities in the Bay Area. No burn rate has been
              disclosed; an estimated annual burn rate of $30-80 million is inferred from headcount and facility
              signals, but this estimate carries low confidence and is not company-stated.

              The laser system requirements for a commercial plant are daunting: the company has stated it needs
              approximately 1,000-1,500 individual high-energy lasers (each capable of delivering over a kilojoule),
              currently manufactured manually like satellites. The supply chain transformation to mass manufacturing of
              these lasers — comparable in complexity to semiconductor lithography systems — is the core capital and
              operational challenge that the hiring of Omar Biabani from ASML is designed to address.

              Key ongoing cost lines for which no public data exist: (1) fuel target manufacturing cost per pellet (the
              NIF's complex indirect-drive target is expensive; Focused Energy's simplified direct-drive target is
              intended to be cheaper but no $/target figure has been published); (2) laser system unit cost and
              depreciation rate; (3) tritium supply chain costs (tritium is a rare and controlled isotope, and
              supply-chain costs are a significant unknown); (4) site preparation and adaptation costs at Biblis; (5)
              regulatory licensing costs.
