      - number: '2.4'
        title: Growth Drivers, Adoption Constraints, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Three structural forces strengthen the market thesis. First, European energy-security urgency: Germany's
              post-Ukraine gas-import dependence, the 2035 REPowerEU clean-power targets, and active Hesse and German
              federal fusion-funding commitments create a political-economy tailwind for domestic firm-power solutions
              that smaller fusion markets elsewhere do not match. Second, AI-driven power scarcity: IEA data shows
              electricity demand is set to grow six times as fast as overall energy demand through 2035, with data
              centres a primary driver; that pressure compresses the premium buyers are willing to pay for reliability.
              Third, U.S. and EU fusion regulation has been actively lightened — the ADVANCE Act codified lighter NRC
              oversight for fusion than for fission in the United States, and the European fusion regulatory framework
              is evolving in a similarly permissive direction.


              Against these tailwinds, the constraint stack remains heavier than the demand narrative. Focused Energy's
              direct-drive ICF approach still requires solving target-repetition rate at industrial scale (10 shots per
              second versus roughly 400 per year at NIF), target manufacturing economics at millions of pellets per day,
              laser wall-plug efficiency, and chamber survivability. SCSP's 2025 fusion supply-chain report flags
              tritium, lithium-6, and high-power laser-diode availability as strategic chokepoints shared across ICF
              approaches. Kleinman's analysis argues that first fusion plants may clear the grid at prices materially
              above gas or solar, which limits early adopter economics even for buyers with sustainability mandates. The
              Annual Reviews status paper notes that ICF ignition required more implosion energy than once projected and
              that significant engineering and research challenges remain before a commercial plant can be realised.


              Focused Energy's specific diligence gaps are: no public customer pipeline, no disclosed levelised cost
              estimate, no independently validated Lighthouse plant economics, no public target-manufacturing roadmap
              beyond the TechCrunch and TU Darmstadt narrative, and no disclosed fuel-cycle plan for tritium at
              commercial scale. Those omissions do not negate the market opportunity, but they keep the investment case
              firmly in 'significant option-value, evidence-constrained' territory pending demonstration milestones.
