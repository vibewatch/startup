            body: >
              The capital split is stark. CFS leads the private fusion field with $3B+ cumulative funding, its $863M
              Series B2 closed in December 2022, SPARC assembly is underway with 18 HTS magnets, and a $1B+ PPA from
              Italian utility Eni positions the ARC commercial plant (Chesterfield County VA, 400 MW) for early-2030s
