    title: Regulatory / legal risk register
    layout: wide
    columns:
      - Issue
      - Framework / actor
      - Current state
      - Timeline risk
      - Why it matters
      - Diligence ask
    rows:
      - - Radiation-construction license
        - German Strahlenschutzgesetz section 10
        - Facilities generating ionizing radiation require authorization
        - High
        - >-
          A neutron-producing laser fusion facility will likely require a construction and operating pathway under
          radiation law
        - Obtain external German radiation-law memo mapped to the Biblis build plan
      - - Brownfield nuclear-site interaction
        - German Atomgesetz section 7 / Biblis decommissioning
        - Biblis remains a former fission site under decommissioning responsibility
        - High
        - Site conversion timing may be constrained by the existing decommissioning regime and regulator interpretation
        - Request RWE decommissioning dependency chart and legal interface analysis
      - - Fusion-specific rulemaking uncertainty
        - EU and NRC
        - EU lacks a dedicated fusion strategy per FE CEO letter; NRC final fusion framework was still pending in 2026
        - Medium
        - Comparative precedent is still moving, so investors cannot assume a settled playbook
        - Track final NRC rule and any German/EU implementing guidance
      - - No German licensing precedent
        - German federal and Hesse regulators
        - No fusion power plant has yet been licensed or built in Germany
        - High
        - First-of-kind precedent risk can lengthen reviews, increase conditions, and raise appeal risk
        - Engage German nuclear/radiation counsel before any site-level underwriting
