      - number: '4.2'
        title: Revenue Model and Monetization Path
        blocks:
          - type: paragraph
            body: >-
              Focused Energy is pre-revenue as of June 2026. No revenue, ARR, GMV, signed customer contracts, power
              purchase agreements, or commercial offtake arrangements have been publicly disclosed. The company's
              current outputs are R&D milestones, engineering prototypes, and facility development — not commercial
              products or services.

              The primary long-run revenue mechanism is electricity sales via power purchase agreements (PPAs) or
              wholesale electricity sales at a commercial laser fusion power plant: revenue recognized on MWh delivered
              to the grid at a contracted or spot price. This model mirrors conventional nuclear and renewable project
              finance structures. No pricing, target LCOE, or offtake contract terms have been disclosed.

              Secondary or transitional revenue mechanisms are inferable but unconfirmed: (1) technology licensing — if
              Focused Energy patents key laser system or target fabrication intellectual property, licensing to
              third-party plant builders could generate royalty income; (2) research services — the $6.9 million
              University of Rochester LLE collaboration models an industry-to-academic research agreement, but the
              reverse (charging for access to Focused Energy's own facilities) has not been announced; (3) government
              co-funded R&D contracts — DOE ARPA-E programs and EU Horizon grants represent continuing non-commercial
              revenue analogs that reduce cash burn but are not operating revenue.

              The revenue recognition challenge for pre-commercial laser fusion is acute. Unlike software or marketplace
              businesses, Focused Energy has no list pricing, no pilot customers, no letter of intent, and no contract
              backlog from which to project revenue. Forward revenue models depend entirely on unproven technical
              milestones (pilot plant 2035, first grid MWh 2037), regulatory pathways not yet established for commercial
              laser fusion, and electricity market conditions that are over a decade away. RWE's dual role as investor
              and prospective future customer is the most commercially meaningful signal, but no offtake terms have been
              disclosed.

              The EIC Scaling Club interview quotes CEO Forner on EIB project-finance discussions, which is the typical
              financing structure for large power plant deployments — suggesting the company is already thinking about
              non-equity capital for the commercial plant. However, project finance requires demonstrated technology and
              regulatory approvals that do not yet exist.
