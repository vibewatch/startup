      - number: '1.4'
        title: Technology Milestones and Commercialization Roadmap
        blocks:
          - type: paragraph
            body: >
              Focused Energy has advanced from a TU Darmstadt academic spinout to the world's leading laser fusion
              company (by its own characterization and by funding scale) in four years, driven by a disciplined
              technical roadmap that builds directly on the NIF ignition heritage.

              The company's founding in 2021 coincided with rapid progress toward the NIF's December 2022 historic
              ignition — and the subsequent arrival of NIF scientists Debbie Callahan and Pravesh Patel on the Focused
              Energy team confirmed that the scientific community views the ignition milestone as a genuine inflection
              point. The commercial challenge, as both the company and independent analysts acknowledge, is to scale
              from the NIF's ~400 shots per year to 10 shots per second (864,000 shots per day) at industrial
              reliability — representing a transition from laboratory precision to manufacturing-line economics.

              Key technical sub-programs include: (1) target fabrication at scale — simplifying the NIF's complex
              hohlraum-based indirect-drive target to a simpler direct-drive pellet manufacturable at high volume; (2)
              laser system engineering — transforming laser systems produced like satellites (manually, one at a time)
              into systems produced like cars with a supply chain; and (3) facility integration — repurposing the Biblis
              nuclear plant infrastructure for fusion.

              The March 2025 MoU with RWE and the Hesse state government was a major institutional milestone, formally
              committing the parties to build a demonstration plant (Lighthouse) and eventually a power plant at Biblis
              by 2035. A feasibility study titled "From Fission to Fusion" was commissioned to validate the site's
              potential. Construction work to adapt an existing Biblis building was underway as of December 2025.

              In March 2026, Focused Energy announced a $6.9 million industrial-sponsored research collaboration with
              the University of Rochester's Laboratory for Laser Energetics (LLE) — the largest single
              industry-sponsored research agreement LLE has received — to address fundamental inertial fusion energy
              challenges. In April 2026, CEO Thomas Forner co-signed an open letter to the European Commission calling
              for an ambitious EU fusion strategy.

              The company's public technology roadmap targets: Seed (2023), First Laser at Biblis (2028), First Light in
              Diagnostics Chamber (2031), Implosion (2033), Pilot Plant (2035), First Grid MWh (2037).
