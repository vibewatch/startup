        title: Forward Capital Requirements and Financing Environment
        blocks:
          - type: paragraph
            body: >-
              Focused Energy's capital requirements dwarf its current capitalization. The Biblis pilot plant cost is
              estimated at €5-10 billion; the company has raised ~$300 million in private equity and ~$200 million in
              grants (~$500 million total). Even at the low end of the cost range (€5 billion ≈ $5.4 billion), the gap
