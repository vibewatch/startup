      - number: '3.3'
        title: Substitutes, Status-Quo Power, and Pricing Context
        blocks:
          - type: paragraph
            body: >
              Fusion competes against every technology offering clean firm power or low-carbon industrial heat.
              Utility-scale solar PV and onshore wind (LCOE ~$35–50/MWh in 2026) are already cost-competitive with gas
              CCGT ($55–90/MWh) for intermittent generation, but offer no dispatchable capacity guarantee. Gas CCGT
              remains the dominant dispatchable substitute; its decarbonisation pathway via CCUS carries high capital
              cost and regulatory uncertainty. Small modular reactors (SMRs) — NuScale, X-energy, Kairos Power,
              Rolls-Royce — target commercial deployment in the early 2030s at estimated LCOEs of $90–140/MWh, within
              the range where fusion could compete if it achieves projected efficiencies. Grid-scale battery storage
              (4-hour, $120–180/MWh) solves near-term intermittency but lacks the duration for firm industrial or
              baseload power. For industrial process heat above 150°C — Germany's steel, chemicals, and cement sectors —
              electrification via heat pumps is insufficient, and high-temperature nuclear (fusion or advanced fission)
              is the primary non-fossil candidate. Fusion's competitive differentiators vs. substitutes are: always-on
              dispatchable output, zero CO₂, no long-lived nuclear waste, and energy density advantage — all of which
              accrue primarily in post-2040 decarbonisation scenarios where interim solutions have been deployed. None
              of the fusion companies has disclosed a public tariff or plant LCOE estimate; the SCSP Fusion Supply Chain
              report and industry analysis project first-of- kind fusion LCOEs of $80–150/MWh, materially above solar
              but comparable to SMRs and below gas+CCUS in high-carbon-price scenarios.
            claimRefs:
              - CP030
