            title: Helion is the ceiling, not the default comp
            body: >-
              Helion's $15.5B mark is useful only as an upper-bound reference because it also brings a Microsoft
              contract, much larger lifetime funding, and plant-construction evidence that Focused Energy does not yet
              disclose.
