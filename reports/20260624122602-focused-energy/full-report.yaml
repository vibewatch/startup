appendices:
  - id: A
    title: Coverage Notes and Methodology
    blocks:
      - type: paragraph
        body: >-
          This report is based on public sources fetched during the 2026-06-24 diligence run. Focused Energy is a
          private pre-revenue deep-tech company, so most conventional operating and valuation metrics are unavailable or
          management-controlled. The report therefore emphasizes verifiable funding, roadmap, site, policy, and
          technical-proof evidence rather than unsupported commercial extrapolation.
        claimRefs: []
      - type: paragraph
        body: >-
          Valuation analysis is intentionally conservative because the company has not published a post-money figure,
          signed customer economics, or project-finance structure for Biblis. Scenario thinking is still useful, but the
          recommendation remains milestone- sensitive and price-sensitive rather than conviction-driven from public
          information.
        claimRefs: []
