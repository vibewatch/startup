            follows.
        - id: suppliers
          label: Laser and optics supply chain
          description: >-
            TRUMPF, Schott, Amplitude/Short, and Asian suppliers for laser amplifiers, optical glass, and precision
            components.
        - id: lpi
          label: LPI mitigation closure
          description: >-
            Experimental validation that broadband lasers and beam zooming suppress LPI to acceptable levels at FPP
            energy density.
        - id: target
          label: Pearl target factory
          description: >-
            High-rep-rate cryogenic capsule manufacturing and injection at 10 Hz commercial scale; no public
            demonstration yet.
        - id: wall
          label: Chamber wall materials
          description: >-
            First-wall materials surviving 2–3 year neutron-flux campaigns; requires materials science, manufacturing,
            and testing programme.
        - id: fpp
          label: Fusion Pilot Plant approval and build
          description: FPP construction at Biblis; conditional on all upstream technical closures and regulatory authorisation.
