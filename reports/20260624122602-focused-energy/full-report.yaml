              serves as Focused Energy's Chief Strategic Officer. Pravesh Patel, another NIF ignition scientist, has
              also joined. This direct transfer of NIF scientific expertise is rare and difficult to replicate —
              providing both technical credibility and a short path from laboratory ignition to commercial target
