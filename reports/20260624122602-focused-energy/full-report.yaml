      - number: '5.4'
        title: Manufacturing, Supply Chain, and Fuel Cycle
        blocks:
          - type: paragraph
            body: >-
              The commercial case for laser fusion depends as much on manufacturing economics as on plasma physics. A
              single gigawatt plant would require approximately 1,000 laser amplifiers, which must be produced like cars
              at industrial scale rather than as scientific instruments. Focused Energy CEO Thomas Forner explicitly
              frames this shift as one of the company's central strategic challenges. Key industrial partners mentioned
              in public statements include TRUMPF (industrial laser manufacturing), Schott AG (optical glass and
              precision materials), Amplitude/Short (laser systems), and Japanese and Korean suppliers including
              Sumitomo, Mitsui, Hamamatsu, and Samsung. None of these have disclosed signed supply agreements publicly;
              the relationships appear to be at MoU and co-location interest stage. The Pearl fuel capsule must be
              produced and injected at 10 shots per second; no public target factory has demonstrated this throughput.
              The closed DT fuel cycle breeds tritium from a lithium blanket around the reaction chamber, closing the
              supply chain on the fuel side but requiring complex tritium-handling and lithium-chemistry systems whose
              reliability at commercial repetition rates is undemonstrated. The reactor's first wall and structural
              components must survive neutron flux from continuous operation for 2–3 years without exchange; activated
              materials require approximately 50 years of storage before recycling. SourceLight's planned PLANET
              collaborative project—launched 2024 with industry and research partners—is the first industrial prototype
              of the LDRS technology at Biblis, demonstrating the company's intention to monetise near-term spinoff
              value while the fusion roadmap matures.
            claimRefs:
              - CE021
              - CE022
              - CE029
              - CE030
              - CE031
              - CE037
      - number: '5.5'
        title: Trust, Safety, Compliance, and Technology Risks
        blocks:
          - type: paragraph
            body: >-
              Focused Energy positions laser fusion as inherently safer than fission: no chain reaction is possible,
              long-term nuclear waste is absent (only activated first-wall materials requiring ~50 years interim
              storage), and operational radiological burdens are low compared to fission plants. Germany's Fusion Action
              Plan, published October 2025, formalised this by moving fusion from nuclear law to radiation protection
              law, giving Biblis a materially simpler regulatory baseline. The Biblis site already operates under
              radiation protection conventions from its fission decommissioning phase, creating a ready regulatory
              environment. No NRC, BfS, or equivalent regulator has yet issued a licence or formal review for a
              laser-fusion facility anywhere; the regulatory pathway remains prospective. The principal technology risks
              fall into six categories. First, LPI: despite the LLE/FLUX collaboration and IFE-COLoR consortium
              membership, LPI mitigation has not been experimentally closed at FPP-relevant energy and bandwidth
              conditions. Second, hydrodynamic and symmetry control: PFI implosion symmetry in a cone-in-shell geometry
              has no public integrated demonstration. Third, high-repetition laser systems: 10 Hz operation of
              kilojoule-class solid-state lasers at the reliability and cost required for commercial plants does not
              exist today; current advanced systems fire at far lower repetition rates with higher maintenance burden.
              Fourth, target fabrication throughput: no public roadmap for producing and injecting 10 Pearl capsules per
              second. Fifth, chamber wall survivability: materials capable of withstanding 2–3 years of neutron flux at
              commercial shot rates are unvalidated in a laser-fusion environment. Sixth, tritium supply: the global
              tritium market is thin; lithium breeding has not been demonstrated at commercial scale in any fusion
              configuration. No GitHub repository, open-source toolkit, or publicly traded software surface exists for
              Focused Energy, consistent with its deep-hardware, pre-product stage; practitioner community engagement is
              visible through academic conference papers (APS DPP 2025), publicly funded HPC simulation projects
              (EuroHPC/IFE-STAR), and consortium participation (IFE-COLoR, DOE INFUSE).
            claimRefs:
