              magnetic driver. Inertia Enterprises' $450M February 2026 raise is the second-largest single-round ICF
              commitment globally; its LLNL R&D partnership gives it privileged access to the same direct-ICF dataset
              that Focused Energy's co-founders helped build. Xcimer ($100M) is comparable to Focused Energy in capital
