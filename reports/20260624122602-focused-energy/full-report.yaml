    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >
              Focused Energy GmbH is a private German-American laser fusion company incorporated in Germany and in the
              United States (Focused Energy Inc., Delaware), headquartered at Im Tiefen See 45, 64293 Darmstadt,
              Germany, with additional offices at Linkstraße 2, Berlin; 600 Center Ridge Drive, Austin TX; and 201 Spear
              Street, San Francisco CA. The company was founded in July 2021 as a technology spinout of Technical
              University Darmstadt (TU Darmstadt) and National Energetics to commercialize inertial confinement fusion
              (ICF) energy using pulsed high-power lasers.

              Focused Energy's singular mission is to build the world's first commercial laser fusion power plant and
              deliver clean, inexhaustible fusion-generated electricity to the grid. Its technology approach is
              direct-drive inertial confinement fusion: arrays of solid-state high-energy pulsed lasers directly
              compress millimetre-scale deuterium-tritium fuel pellets to the density and temperature conditions
              required for fusion ignition — bypassing the hohlraum-based indirect-drive conversion step used at
              Lawrence Livermore's NIF. The company bases its design lineage on the December 2022 NIF ignition
              breakthrough, the only controlled fusion reaction to have demonstrated scientifically verified net energy
              gain, and employs scientists who contributed directly to that experiment.

              The business model is project-finance and power-purchase-agreement (PPA) oriented: a commercial laser
              fusion power plant would sell electricity by the megawatt-hour to utilities or industrial customers. The
              company is pre-revenue and capital-intensive; all current activities are research, engineering, and site
              development. The planned path to first revenue runs through the Lighthouse demonstration system at Biblis,
              a pilot plant at the same site by 2035, and first grid MWh delivery by 2037 per the company's public
              roadmap.

              As of the June 2026 run date, Focused Energy employs 160+ scientists, engineers, and operators drawn from
              world-leading institutions including NIF/LLNL, the Laboratory for Laser Energetics (LLE) at the University
              of Rochester, and ASML, and has established a core facility in Darmstadt equipped for fusion target
              fabrication including micro-milling, microscopy, lasers, and cryo systems.
