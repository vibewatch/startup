        title: Capital Structure and Series A Financing
        blocks:
          - type: paragraph
            body: >-
              Focused Energy closed a $240 million Series A on 27 May 2026, the largest fully secured Series A in global
              fusion history per the company and corroborated by TechCrunch, The Next Web, and Business Wire. The round
              was oversubscribed, with the company stating it attracted investors willing to fund through to a
              commercial fusion power plant. RWE AG led the round and has been reported by InforCapital to have
              contributed approximately $60 million, though RWE has not officially confirmed the split. SPRIND (German
              Federal Agency for Breakthrough Innovation), the European Innovation Council (EIC) Fund, and returning
              lead Prime Movers Lab also participated, alongside unnamed investors from Germany, Europe, Asia, and the
              Gulf region. The Hesse state government financing vehicles HessenFonds Beteiligungen and Hessen Kapital
              (managed by BMH) contributed as well. No post-money valuation was disclosed.

              Prior to the Series A, the company raised a $15 million seed round in 2021 (confirmed by SEC Form D
              filing, CIK 0001870675, accession 0001214659-21-007256, first sale 2021-06-22), led by Prime Movers Lab
              with Alex Rodriguez, Marc Lore, and Tony Florence as co-investors. Between the seed and Series A,
              additional private equity rounds brought public estimates of lifetime private capital into an
              approximately $255-300 million range. The TechCrunch figure implies roughly $45 million of intermediate
              private financing beyond the disclosed $15 million seed, while the InforCapital profile points to a
              somewhat lower running total — suggesting some intermediate rounds remain only partially documented in
              public sources.

              Focused Energy has also received approximately $200 million in public grants, bringing total funding to
              approximately $500 million. Identified grant components include: $3 million from the U.S. Department of
              Energy, an estimated $50 million from SPRIND (per InforCapital), €2.5 million from the state of Hesse in
              2024 (€500k state + €2M from the European Regional Development Fund), and €20 million from the state of
              Hesse in December 2025. The European Investment Bank (EIB) Vice President Nicola Beer appeared in the
              Series A announcement materials, and CEO Forner has confirmed ongoing EIB project-finance discussions.

              No debt, convertible notes, project-finance facilities, or credit lines have been publicly announced. The
              company appears exclusively equity- and grant-funded as of the run date.
