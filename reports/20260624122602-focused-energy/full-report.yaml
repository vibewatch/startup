      - number: '1.3'
        title: Funding History and Capital Structure
        blocks:
          - type: paragraph
            body: >
              Focused Energy has raised approximately $300 million in private equity capital and $200 million in public
              grants and government support, for total funding of approximately $500 million as of June 2026. This makes
              it one of the most heavily funded fusion startups globally.

              The Seed round of $15 million closed in June/July 2021, led by Prime Movers Lab with co-investors
              including Alex Rodriguez, Marc Lore, and Tony Florence; the SEC Form D (accession 0001214659-21-007256,
              filed 2021-07-06, CIK 0001870675) confirms a $15 million offering with first sale on 2021-06-22 under Rule
              506(b). Government grants received through approximately 2025 include $3 million from the U.S. Department
              of Energy, a major grant from the German Federal Agency for Breakthrough Innovation SPRIND (InforCapital
              estimates this contribution at $50 million), €2.5 million from the state of Hesse in 2024 (partly from the
              European Regional Development Fund), and €20 million from the state of Hesse in December 2025. The total
              grant picture brings public support to roughly $200 million, consistent with TechCrunch and The Next Web's
              reporting.

              Between the 2021 seed and the 2026 Series A, additional private rounds brought cumulative private capital
              to approximately $60 million before the Series A; the exact round structure and valuations for these
              intermediate tranches are not publicly disclosed.

              The $240 million Series A closed on 27 May 2026, the largest fully secured Series A in global fusion
              industry history. RWE led the round (contributing an estimated $60 million), with SPRIND, the European
              Innovation Council (EIC) Fund, and returning lead Prime Movers Lab participating alongside investors from
              Germany, Europe, Asia, and the Gulf region, including prospective energy buyers. The BusinessWire press
              release states the round was oversubscribed. The company has not disclosed a post-money valuation. The
              Series A announcement claims it makes Focused Energy the most valuable fusion company in Europe. No debt,
              convertible notes, project finance, or credit facilities have been publicly announced.

              Hesse state vehicles HessenFonds Beteiligungen and Hessen Kapital (managed by BMH) contributed to the
              broader financing ecosystem. The German government has placed fusion on its national High-Tech Agenda and
              included it in the coalition agreement, providing a policy tailwind for future public co-financing.
