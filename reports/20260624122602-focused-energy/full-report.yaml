      - number: '8.4'
        title: Recommendation and What Would Change It
        blocks:
          - type: paragraph
            body: >-
              The correct investment posture is research-more with track-on-milestones behavior, not an immediate
              valuation-driven buy. The supportive case is real: Focused Energy has assembled one of the strongest
              European fusion syndicates, gained government validation from SPRIND and the EIC ecosystem, secured a
              high-profile Biblis siting path with RWE and Hesse, and signed a meaningful $6.9 million research
              collaboration with the University of Rochester's Laboratory for Laser Energetics. But the missing evidence
              is decisive. There is still no public post-money valuation, no cap-table detail, no disclosed customer
              commitment, and no public proof that direct-drive commercialization risk has been reduced enough to
              transfer Helion-, CFS-, or TAE-like multiples. The recommendation would improve if management disclosed
              the actual Series A terms, showed a credible financing bridge from $240 million to pilot-plant scale, and
              produced signed demand evidence. The thesis would weaken sharply if Biblis stalled, the next round arrived
              before major technical milestones, or strategic backers proved to be marking value internally rather than
              validating it with arm's-length external buyers.
