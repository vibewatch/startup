  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included and Excluded Spend, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Focused Energy's market is frequently misdescribed as the fusion-research or deep-tech venture market. The
              company is pre-commercial and has not disclosed any power-purchase agreements, industrial offtake
              contracts, or commercial customers. Its stated mission is to industrialise laser-driven inertial
              confinement fusion (ICF) to produce firm, clean, and virtually inexhaustible energy. That makes the
              relevant market future firm-power generation capacity, long-term offtake agreements for hard-to-abate
              industrial and hyperscaler sites, and the decarbonisation of industrial process heat — not every dollar of
              global fusion R&D or generic clean-energy procurement.


              Included spend covers: FOAK fusion plant capital expenditure and engineering; long-duration firm-power
              PPAs or behind-the-meter supply agreements with hyperscalers, utilities, and heavy industrial operators;
              industrial-heat offtake contracts for decarbonisation of steel, cement, chemicals, and other process
              industries; and public-private grants and co-development budgets that unlock private commercialisation.
              Excluded spend comprises NIF and stockpile-stewardship R&D, weapons programmes, generic renewable
              procurement without firm-power requirements, and utility procurement solved cheaply by existing
              dispatchable or grid-management tools.


              Status-quo substitutes remain significant. Combined-cycle gas with optional carbon capture, conventional
              nuclear and advanced fission (PWR refurbishments, SMRs), offshore wind paired with long-duration storage,
              geothermal, and demand-response programmes all address the same buyer problem sooner than a mid-2030s
              fusion plant. In Germany specifically, the exit from coal and the final phase-out of nuclear fission in
              2023 have intensified reliance on gas imports and renewables, which reinforces the energy-security case
              for domestic fusion but also shows the urgency of interim solutions. RWE's simultaneous role as Biblis
              site-owner and lead investor in Focused Energy's Series A is the most tangible market-entry signal; it
              suggests at least one major European utility regards laser ICF as a credible future generation asset
              rather than a science project.
