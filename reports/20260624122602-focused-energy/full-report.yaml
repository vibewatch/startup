      - number: '4.4'
        title: Financial Disclosure Profile and Underwriting Blockers
        blocks:
          - type: paragraph
            body: >-
              Focused Energy's financial disclosure posture is consistent with a private pre-commercial deep-tech
              company: no conventional financial metrics are publicly available. No gross margin, EBITDA, burn rate,
              cash position, or unit economics have been disclosed. No post-money valuation from the May 2026 Series A
              is public. No revenue forecast, commercial pricing model, or management accounts have been disclosed.

              On the regulatory filing side, Focused Energy Inc. (CIK 0001870675) filed one SEC Form D under Rule 506(b)
              in July 2021 for the $15 million seed round. As of the June 24, 2026 run date — 28 days after the May 27,
              2026 Series A first sale — a Form D for the Series A should have been filed within the SEC's 15-day window
              (by approximately June 11, 2026), but no corresponding filing was found in the EDGAR full-text search.
              This may reflect: the Series A being structured primarily as a non-US offering (German GmbH), the US Reg D
              exemption not applying, a filing under a different entity name, or a filing not yet indexed. The absence
              of a Series A Form D is a minor diligence gap that warrants direct inquiry with the company.

              The structural underwriting challenge is compounded by the absence of: realized revenue, signed customer
              contracts, commercially disclosed pricing, independent engineering cost validation of the Biblis facility,
              tritium supply chain economics, fuel target manufacturing cost models, or independently audited financial
              statements. Every material financial metric relevant to a conventional underwrite is private,
              pre-commercial, or structurally unavailable.

              The EIC Scaling Club interview provides the clearest view of the company's financial strategy: CEO Forner
              described RWE as bringing "the perspective of a customer" on operational costs, and noted ongoing
              discussions with the European Investment Bank about project financing for the construction phase. This
              suggests the company expects that EIB-style project-finance will be required for the commercial plant,
              separate from the current equity round.
