  - id: FE001
    title: Product architecture map — laser fusion plant layers
    type: stack
    layout: wide
    summary: >-
      Six functional layers from fuel cycle through balance-of-plant, showing the integrated stack a commercial Focused
      Energy plant must close.
    claimRefs:
      - CE003
      - CE005
      - CE006
      - CE008
      - CE022
    data:
      layers:
        - id: bop
          label: Balance-of-plant and grid integration
          detail: >-
            Steam turbines, generators, heat exchangers, cooling systems, and transmission-grid interface convert
            thermal energy to exportable electricity.
          modules:
            - Steam cycle (turbines and generators)
            - Grid tie and power conditioning
            - Site utilities (cooling water, electrical distribution)
        - id: chamber
          label: Reaction chamber and first wall
          detail: >-
            Hardened chamber contains each fusion shot, absorbs neutrons via a lithium-bearing breeding blanket, sheds
            debris between shots, and captures thermal energy.
          modules:
            - First-wall structural material (2–3 year replacement cycle)
            - Lithium breeding blanket (tritium generation)
            - Neutron energy capture and heat-transfer loop
        - id: fuelcycle
          label: DT fuel cycle and tritium breeding
          detail: >-
            Closed cycle breeds tritium from lithium in the blanket, extracts and re-processes tritium for the next
            target fill, and manages deuterium supply.
          modules:
            - Tritium extraction and purification
            - Cryogenic DT loading of Pearl capsules
            - Deuterium supply (from seawater)
        - id: target
          label: Pearl target fabrication and injection
          detail: >-
            Mass-produced precision DT ice capsules are continuously manufactured, quality-checked, and injected into
            the chamber at 10 Hz with microsecond precision.
          modules:
            - Pearl capsule production line
            - Cryogenic handling and transport
            - High-repetition target injector and alignment
        - id: compression
          label: Compression laser driver (DPSSL, 351 nm)
          detail: >-
            Array of diode-pumped solid-state laser amplifiers generates nanosecond kilojoule pulses at 10 Hz to
            symmetrically implode the DT capsule.
          modules:
            - ~1,000 modular laser amplifiers per plant
            - Beam combination, shaping, and phase control
            - Final-optics and target-chamber interface
        - id: ignition
          label: Proton fast ignition sub-system
          detail: >-
            A separate high-intensity picosecond laser generates a focused TNSA proton beam that deposits energy into
            the compressed fuel core to ignite thermonuclear burn.
          modules:
            - High-contrast picosecond ignition laser
            - Proton beam focusing and cone-in-shell geometry
            - Timing synchronisation with compression pulse
  - id: FE002
    title: Customer workflow / operating flow — laser fusion plant shot cycle
    type: flow
    layout: wide
    summary: >-
      Single-shot operational loop from target injection through fusion energy capture to electricity export and
      recirculating power for the next shot.
    claimRefs:
      - CE003
      - CE005
      - CE006
      - CE008
      - CE009
    data:
      nodes:
        - id: fabricate
          label: Fabricate and cool Pearl capsule
          description: DT-filled precision capsule is produced, cryogenically loaded, and quality-checked in the target factory.
        - id: inject
          label: Inject and align target
          description: Capsule is delivered to chamber centre with microsecond timing; alignment ensures symmetric irradiation.
        - id: compress
          label: Fire compression laser array
          description: Array of ~1,000 DPSSL amplifiers delivers synchronized kilojoule nanosecond pulses, imploding the capsule.
        - id: ignite
          label: Fire PFI proton ignitor beam
          description: >-
            Picosecond high-intensity pulse generates focused proton beam that deposits energy into the compressed
            hotspot.
        - id: burn
          label: DT thermonuclear burn
          description: Fusion burn wave propagates through compressed DT fuel; ~864,000 shots per day at 10 Hz.
        - id: capture
          label: Neutron and thermal energy capture
          description: Lithium breeding blanket and heat exchangers absorb neutron flux, breed tritium, and extract thermal energy.
        - id: export
          label: Steam cycle and grid export
          description: Heat drives conventional steam turbines; electricity exported to grid minus recirculating plant power.
      edges:
        - id: e1
          source: fabricate
          target: inject
          label: Cryogenic capsule delivery
        - id: e2
          source: inject
          target: compress
          label: Target in position
        - id: e3
          source: compress
          target: ignite
          label: Compressed DT core ready
        - id: e4
          source: ignite
          target: burn
          label: Proton beam ignition
        - id: e5
          source: burn
          target: capture
          label: Neutrons and photons released
        - id: e6
          source: capture
          target: export
          label: Thermal energy to heat exchangers
        - id: e7
          source: capture
          target: fabricate
          label: Bred tritium recycled into next capsule
        - id: e8
          source: export
          target: compress
          label: Recirculating power for laser array
