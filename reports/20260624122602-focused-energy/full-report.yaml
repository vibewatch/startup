      - number: '1.2'
        title: Founders and Leadership Team
        blocks:
          - type: paragraph
            body: >
              Focused Energy was co-founded in July 2021 by four principals: Thomas Forner (CEO), Prof. Dr. Markus Roth
              (Chief Science Officer), Prof. Dr. Todd Ditmire (CTO at founding), and Dr. Anika Stein (COO at founding).
              The founders combine a serial entrepreneur, two world-class laser and plasma physicists with decades of
              fusion research, and an operational engineer with aerospace and defense background — a configuration
              designed to bridge scientific credibility with industrialization capability.

              Thomas Forner is an experienced entrepreneur and founder of multiple companies before Focused Energy; he
              leads corporate development, financing, and external strategy. Prof. Dr. Markus Roth is a professor of
              laser and plasma physics at TU Darmstadt who spent three decades on fusion target physics and was part of
              the team behind the 2022 NIF breakthrough; he continues as Chief Science Officer. Prof. Dr. Todd Ditmire,
              professor at the University of Texas Austin and world-leading expert in high-intensity laser-plasma
              physics, co-founded the company and has been central to the U.S.-side academic partnerships.

              In December 2025, Focused Energy expanded its executive leadership team significantly. Debbie Callahan —
              one of the principal target-design scientists at NIF who helped achieve the historic 2022 ignition — was
              appointed Chief Strategic Officer (CSO), with responsibility for translating scientific advances into
              industrial applications and simplifying the fuel target for mass production. Omar Biabani, formerly Vice
              President of Product Development at ASML with deep experience scaling highly complex technologies, was
              simultaneously appointed Chief Technology Officer (CTO), taking over the technological roadmap toward the
              commercial power plant. Chris Wendel serves as President and CFO, and Decker Gentili as COO.

              The leadership configuration reflects a deliberate pivot from science-led to industrialization-led
              management: Callahan brings NIF ignition expertise directly to target engineering; Biabani brings
              manufacturing-at-scale credibility from the world's most complex semiconductor lithography machine maker.
              Key-person risk remains concentrated in Thomas Forner (CEO, fundraising, and commercial relationships) and
              Markus Roth (scientific credibility and TU Darmstadt institutional relationships).
