  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Public Valuation Evidence
        blocks:
          - type: paragraph
            body: >-
              Focused Energy's May 2026 financing is unquestionably a real valuation event even though the company
              withheld the actual post-money number. The company, Business Wire syndication, and multiple follow-on news
              reports all agree that the round closed at $240 million and that management now describes Focused Energy
              as the most valuable fusion company in Europe. FIA's 2025 industry report provides the best pre-round
              anchor: only $26.5 million of declared funding before the Series A. That means the company jumped from a
              modest pre-2026 capital base to a very large strategic round backed by RWE, SPRIND, the EIC Fund,
              Hessen-linked investors, Futury Capital, and Prime Movers Lab. What is missing matters just as much as
              what is present. No public source discloses the share price, post-money valuation, liquidation
              preferences, or any customer offtake agreement. Without those, investors can confirm market interest but
              cannot confirm whether the round was clean, whether it embedded structured protection, or whether the
              implied value already discounts future commercial success.
