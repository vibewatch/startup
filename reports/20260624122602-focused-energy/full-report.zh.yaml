          - type: callout
            title: 当前所有关系都是投资、MoU 或项目伙伴——不是商业能源合同
            body: >-
              尽管 Focused Energy 完成了欧洲史上规模最大的私营聚变 Series A，公司没有已签购电协议、商业能源销售，也没有公开有约束力的包销承诺。RWE、Land Hessen、SPRIND 和 DOE
              是投资方、场址伙伴和政府验证者，不是付费能源客户。这些关系要转化为商业收入，需要可运行的 FPP、十年额外开发，以及在德国辐射防护法下完成许可流程。
