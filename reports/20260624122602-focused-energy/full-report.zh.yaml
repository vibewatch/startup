      - number: '4.6'
        title: 展示材料
        blocks:
          - type: callout
            title: $240M Series A 是已落地最大聚变 Series A——政策资本锚定本轮
            body: >-
              2026 年 5 月超额认购的 $240M Series A，是全球聚变史上规模最大的已完全落实 Series
              A。股东结构——一家欧洲公用事业公司（RWE）、两家德国联邦机构（SPRIND、HessenFonds）、一家 EU 科学基金（EIC Fund）和一家美国深科技 VC（Prime Movers
              Lab）——在结构上很特别：同一轮里同时有商业验证（RWE 作为未来电力买方）、公共产业政策（SPRIND、Hesse、EIC）和风险资本。这种混合结构降低了公司未来轮次对纯私人资本的依赖。
