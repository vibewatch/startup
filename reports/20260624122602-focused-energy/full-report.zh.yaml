            body: >-
              最强的具名客户邻近关系是 RWE。RWE 在种子阶段投资，并在 2026 年 5 月领投 $240 million Series A 中 €60 million 的部分。RWE 提供 Biblis
              核电场址访问、其电网工程专长，以及作为欧洲最大公用事业运营商之一的隐性背书。Hessen 州与 Focused Energy 于 2025 年 3 月签署谅解备忘录，计划在 Biblis 建立德国首座聚变电站，在
