  - id: FE003
    title: 关键依赖图谱
    type: dag
    layout: wide
    summary: Focused Energy 要证明工程增益聚变并推进至商业电站，外部和内部依赖都必须闭合。
    claimRefs:
      - CE011
      - CE013
      - CE025
      - CE030
      - CE032
      - CE035
      - CE038
    data:
      nodes:
        - id: fe
          label: Focused Energy 项目
          description: 核心系统集成——靶丸、激光、反应腔、电站经济性和 Biblis 园区。
        - id: lle
          label: LLE / OMEGA 用户设施
          description: 在 Omega 级设施开展 LPI 实验和靶设计验证，合作为期多年、金额 $6.9M。
        - id: doe
          label: DOE Milestone Programme 与 IFE-COLoR
          description: 美国联邦共享资金 $46M；LLE 牵头 IFE-COLoR 宽带 LPI 联盟，FE 是成员。
        - id: biblis
          label: RWE Biblis 场址与退役
          description: 旧裂变电站提供电网接入、清理后的基础设施和监管基线；退役节奏由 RWE 控制。
        - id: hub
          label: 德国激光聚变枢纽招标
          description: 联邦征集方案；如果 Biblis 中标，将带来额外公共共同资助，并推动 RWE 加快退役。
        - id: suppliers
          label: 激光与光学供应链
          description: TRUMPF、Schott、Amplitude/Short 以及亚洲供应商提供激光放大器、光学玻璃和精密部件。
        - id: lpi
          label: LPI 缓释闭合
          description: 需要实验验证：宽带激光和光束缩放能在 FPP 能量密度下把 LPI 压到可接受水平。
        - id: target
          label: Pearl 靶丸工厂
          description: 以 10 Hz 商业规模制造并注入高重复频率低温靶丸；目前还没有公开演示。
        - id: wall
