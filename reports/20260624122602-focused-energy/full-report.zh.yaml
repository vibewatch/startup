      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 6 月，Focused Energy 已筹集约 $300M 私募股权资本，以及 $200M 公共 grants 和政府支持，总融资约 $500M。这使其成为全球融资最充分的聚变初创公司之一。

              $15M 种子轮于 2021 年 6/7 月完成，由 Prime Movers Lab 领投，联合投资方包括 Alex Rodriguez、Marc Lore 和 Tony Florence；SEC Form
              D（accession 0001214659-21-007256，filed 2021-07-06，CIK 0001870675）确认该轮发行规模为 $15M，首次销售日期为 2021-06-22，适用 Rule
              506(b)。截至约 2025 年，公司获得的政府 grants 包括 U.S. Department of Energy 的 $3M、German Federal Agency for Breakthrough
              Innovation SPRIND 的一笔重大 grant（InforCapital 估计该项为 $50M）、2024 年 Hesse 州的 €2.5M（部分来自 European Regional
              Development Fund），以及 2025 年 12 月 Hesse 州的 €20M。整体 grant 图景把公共支持推至约 $200M，与 TechCrunch 和 The Next Web
              的报道一致。

              2021 年种子轮至 2026 年 Series A 之间，其他私募轮次使 Series A 前累计私人资本达到约 $60M；这些中间 tranche 的具体轮次结构和估值未公开披露。

              $240M Series A 于 2026 年 5 月 27 日完成，是全球聚变行业历史上规模最大的 fully secured Series A。RWE 领投（估计出资
              $60M），SPRIND、European Innovation Council（EIC）Fund、回归领投方 Prime Movers Lab 参投，投资方还来自 Germany、Europe、Asia 和
              Gulf region，包括潜在能源买方。BusinessWire 新闻稿称该轮获得超额认购。公司未披露投后估值。Series A 公告称，这使 Focused Energy
              成为欧洲估值最高的聚变公司。公司未公开宣布任何债务、可转债、项目融资或授信安排。

              Hesse 州工具 HessenFonds Beteiligungen 和 Hessen Kapital（由 BMH 管理）也参与了更广泛的融资生态。German government 已将聚变纳入国家
              High-Tech Agenda 和 coalition agreement，为未来公共共同融资提供政策顺风。
