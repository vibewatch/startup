      - number: '1.5'
        title: 负面信号与关键视角
        blocks:
          - type: paragraph
            body: >
              Focused Energy 的商业化雄心，面临聚变领域独立专家对技术和时间表的实质性质疑。

              NIF 点火与商业运营之间的核心工程缺口很大。NIF
              实现的净能量增益，是相对于打到靶上的能量计算，而不是相对于其激光系统消耗的总墙插能量计算——后者高出多个数量级。商业反应堆必须实现相对于系统总输入的增益（墙插效率），这要求激光效率和燃料靶产额都显著高于 NIF
              已展示水平。The Next Web 明确指出这一区别，并称其为 "the $500 million question." 目前还没有任何聚变实验展示过墙插净增益。

              重复频率挑战非常严峻：NIF 每年发射约 400 次（最好也只是大约每天一次）；Focused Energy 的商业运营目标是每秒 10 次。这相当于约 300
              万倍的阶跃变化，需要解决碎片管理（每次发射都会摧毁靶）、工业速度下亚毫米精度的靶注入，以及亚秒尺度的激光冷却和再充能——截至报告日期，这些都尚未通过实验展示。独立技术评论（经网络研究汇总）指出，"no one
              has ever operated a high-energy laser at this repetition rate."

              直接驱动激光聚变理论上能效更高，但要求激光照射和颗粒定位具备极端均匀性与精度。NIF 选择间接驱动，正是因为直接驱动对不对称性和激光—等离子体不稳定性高度敏感。Focused Energy
              关于技术简化（移除黑腔）的主张，尚未在净增益条件下得到实验验证。

              竞争压力正在加剧：Inertia Enterprises 于 2026 年 2 月完成 $450M Series A，瞄准自有惯性约束反应堆，以更大资本部署形成直接竞争。德国的 Marvel
              Fusion，以及美国的 Xcimer Energy 和 Pacific Fusion，也在推进重叠的惯性约束路径。

              试点电站成本估计高且不确定：Fusion Energy Insights 引用 €5-7B，而 German Wikipedia 文章引用约 €10B；两倍区间显示，在详细工程研究完成前，成本不确定性很高。
