      - number: '3.3'
        title: 替代方案、现有电力与定价背景
        blocks:
          - type: paragraph
            body: >
              聚变面对的是所有能提供清洁稳定电力或低碳工业热的技术。公用事业规模 solar PV 和陆上风电（2026 年 LCOE 约 $35–50/MWh）在间歇性发电上已可与 gas
              CCGT（$55–90/MWh）竞争，但不提供可调度容量保证。Gas CCGT 仍是主导的可调度替代方案；其借 CCUS
              脱碳的路径资本开支高，监管也不确定。小型模块化反应堆（SMR）——NuScale、X-energy、Kairos Power、Rolls-Royce——目标在 2030 年代初商业部署，估计 LCOE 为
              $90–140/MWh；如果聚变实现预计效率，就可能在这一区间竞争。电网级电池储能（4 小时，$120–180/MWh）能解决近期间歇性问题，但时长不足以支撑稳定工业或基荷电力。对于 150°C
              以上工业过程热——Germany 的钢铁、化工和水泥行业——热泵电气化不够，高温核能（聚变或先进裂变）是主要非化石候选。相对替代方案，聚变的竞争差异在于全天候可调度输出、零
              CO₂、没有长寿命核废料、能量密度优势；这些优势主要在过渡方案已部署后的 2040 年以后脱碳情景中体现。没有任何聚变公司披露公开电价或电站 LCOE 估计；SCSP Fusion Supply Chain
              报告和行业分析预计，首台套聚变 LCOE 为 $80–150/MWh，显著高于太阳能，但可与 SMR 对比，并在高碳价情景下低于 gas+CCUS。
