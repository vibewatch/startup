      - number: '2.2'
        title: 规模测算视角：宽口径 TAM、需求拉动，以及缺失的 Focused Energy SOM
        blocks:
          - type: paragraph
            body: >-
              公开来源没有单独拆出 Focused Energy 专属的 SAM 或 SOM。已发布的聚变市场预测衡量口径不同，结果跨度很大。MarketsandMarkets 将宽口径 nuclear fusion
              market 估为 2026 年 $18.0B，并按 13.4% CAGR 增至 2031 年 $33.77B，覆盖多种技术、燃料、终端用户和地区的聚变。Future Markets
              描述的行业若技术里程碑按时落地，到 2036 年可能达到 $40–$80B，到 2050 年超过 $350B。Fusion Industry Association 2025
              年调查提供了第三个供给侧视角：行业迄今已筹集 $9.766B，但表示仍需超过 $77B 额外资本，才能把所有受访公司推向商业化。这些都是方向性信号，不是 Focused Energy 的收入预测。


              最干净的需求侧视角来自 Focused Energy 明确点名的买方问题。欧洲能源安全最突出：Germany 对进口天然气的依赖、以国内清洁能源推动再工业化的政治意愿，以及 Hesse 州政府承诺 2026
              年最高 EUR 20M 聚变研究资金，都指向 Germany 制造的无碳稳定电力可以获得溢价。hyperscaler 侧，S&P Global 和 IEA 估计显示，数据中心用电需求到 2030
              年将快速增长，创造全球性的高溢价稳定电力需求；聚变开发商在商业叙事中都会援引这一需求。European Industrial Heat 脱碳市场——仅 Germany
              的钢铁、化工和水泥行业——又增加了一个在美国聚变分析中不那么突出的角度。


              Focused Energy 当前 SOM 最适合按公开已签约口径视为零：没有披露 PPA，没有具名承购客户，除与 RWE 的 Biblis MOU
              外，也没有公开电站东道主承诺。这不排除私下洽谈，但意味着商业论证依赖市场机会框架，而不是已签约需求。
