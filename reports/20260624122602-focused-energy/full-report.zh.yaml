              Pravesh Patel 也已加入。NIF 科学专长的直接转移稀缺且难以复制——它既提供技术可信度，也缩短了从实验室点火走向商业靶简化的路径。
            calloutType: strength
            claimRefs:
              - CO015
              - CO032
          - type: callout
            title: 基础工程缺口：从 NIF 每年发射到每秒 10 次
            body: >
              NIF 每年约发射 400 次；Focused Energy 的商业目标是每秒 10 次——重复频率约高 300
              万倍。以这种频率解决碎片管理、靶注入精度、激光重复率和热管理，没有已验证先例。从实验室科学转向制造规模商业运营，是最主要的技术和时间表风险。
            calloutType: risk
            claimRefs:
              - CO039
              - CO040
          - type: callout
            title: 未披露投后估值；试点电站成本高度不确定
            body: >
              Series A 的投后估值没有公开披露。试点电站成本估计从 €5-7B（Fusion Energy Insights）到约 €10B（German
              Wikipedia）不等；这个区间意味着，在详细工程研究完成前，成本仍存在重大不确定性。迄今筹集的 $300M 私人资本只占预计商业化成本的一小部分，未来还需要大量项目融资、政府共同出资或额外股权轮次。
            calloutType: risk
            claimRefs:
              - CO030
              - CO036
              - CO041
          - type: callout
            title: 德国与 EU 政策顺风：聚变进入国家议程
            body: >
              German government 已把聚变纳入 Hightech Agenda 和 coalition agreement；Germany Chancellor Friedrich Merz
              表达了对聚变商业化的支持。Hesse 州已承诺多年期 grants。EU 公开信行动和 EIC Fund
              参投表明，欧洲公共机构把激光聚变视为产业政策优先项。这一政策环境带来结构性共同融资优势，是纯私人资本竞争者难以获得的。
            calloutType: insight
