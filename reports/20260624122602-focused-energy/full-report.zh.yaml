      - number: '3.4'
        title: Focused Energy 差异化与护城河分析
        blocks:
          - type: paragraph
            body: >
              Focused Energy 的核心差异化建立在三项相互强化的主张上：（1）直接驱动激光 ICF 去掉了 NIF-style 间接驱动路径固有的约 10–20% X-ray
              转换效率损失，改善每焦耳投入对应的驱动器到燃料颗粒能量预算；（2）Biblis brownfield 场址具备既有高压并网、Rhine 河冷却水和 EU 监管熟悉度——这些是绿地 ICF
              场址不具备的——且当前没有美国 ICF 竞争者（Xcimer、Pacific Fusion、Inertia）建立同等欧洲存在；（3）RWE 对 $240M Series A
              的领投，在结构上把欧洲最大电力公用事业对齐为 anchor investor、未来客户和 Biblis 场址共同运营方。EIC Fund 共同领投为该轮增加 EU 层面的战略背书；SPRIND
              共同投资则提供德国联邦机构验证。Germany 的 Hesse 州承诺 2026 年提供 EUR 20M 聚变研究资金。Marvel Fusion 是唯一另一家德国 ICF
              公司，但阶段更早、资本更少，也没有公用事业 anchor。不过，护城河耐久性取决于能否在 $240M runway 内到达示范：如果 Lighthouse 前还需要额外资本，Biblis 和 RWE
              伙伴关系的战略价值仍在，但下一轮投资者承担的资本风险会显著加大。
