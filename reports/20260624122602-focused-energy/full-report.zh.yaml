      - number: '4.3'
        title: 成本结构与资本强度
        blocks:
          - type: paragraph
            body: >-
              Focused Energy 的资本强度很高。据 Fusion Energy Insights 对 MoU 的报道，Biblis 试点电站项目预计耗资 €5-7 billion；德语 Wikipedia
              文章在更宽口径下引用约 €10 billion。两倍的不确定区间说明，尚无详细、独立的工程成本研究发布。公司目前约 ~$300 million 的私人资本，只相当于试点电站低端成本的约
              3-6%，凸显必须靠政府共同出资、项目融资或多轮后续融资填补的结构性资本缺口。

              当前运营成本信号只能靠推断获得。公司在四地运营（Darmstadt 总部、Berlin、Austin、San Francisco/Redwood City），截至 2026 年中有 160+ 名员工，较 EIC
              访谈时（2026 年初）约 100 人增长。Darmstadt 设施包括精密靶制造设备（微铣削、显微镜、低温系统、激光器），意味着持续资本开支和运营支出不低。2025 年 12 月 BusinessWire
              新闻稿确认 Bay Area 有 AI / 数字孪生活动。公司没有披露 burn rate；根据人员和设施信号推断，年 burn rate 约为 $30-80 million，但该估算置信度低，且并非公司口径。

              商业电站对激光系统的要求很高：公司称需要约 1,000-1,500 台独立高能激光器（每台可输出超过 1
              千焦），目前仍像卫星一样手工制造。把这些激光器的供应链改造成规模化制造——复杂度可比半导体光刻系统——是核心资本和运营难题；公司从 ASML 招来 Omar Biabani，正是为了解决这个问题。

              几条关键持续成本线没有公开数据：（1）每颗燃料靶丸的制造成本（NIF 的复杂间接驱动靶很贵；Focused Energy 的简化直接驱动靶意在降低成本，但没有公布
              $/target）；（2）激光系统单台成本和折旧率；（3）氚供应链成本（氚是稀有且受管控的同位素，供应链成本仍是重大未知数）；（4）Biblis 场址准备和改造成本；（5）监管许可成本。
