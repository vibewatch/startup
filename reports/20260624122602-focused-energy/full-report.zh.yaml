              Rochester / LLE 合作——价值 $6.9 million，签于 2026 年 3 月——是最新正式承诺，建立为期三年的研究合作，目标是连接聚变科学与商业电力工程。参与 Series A 的 Gulf
              和亚洲投资者被 CEO 描述为潜在未来买方，但其身份和具体商业兴趣没有公开披露。这些关系都不构成商业能源购买协议；它们都是投资、拨款、场址伙伴或研究安排。
