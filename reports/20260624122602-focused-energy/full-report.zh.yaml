  - id: A
    title: 覆盖说明与方法论
    blocks:
      - type: paragraph
        body: >-
          本报告基于 2026-06-24 尽调运行期间抓取的公开来源。Focused Energy
          是一家未商业化收入的私人深科技公司，因此多数常规经营和估值指标不可得，或由管理层控制。报告因此强调可验证的融资、路线图、场址、政策和技术证据，而非缺乏支撑的商业外推。
        claimRefs: []
      - type: paragraph
        body: 估值分析刻意保守，因为公司尚未公布投后估值、已签客户经济条款，或 Biblis 的项目融资结构。情景思考仍有用，但建议依旧对里程碑和价格敏感，而不是仅凭公开信息形成高确信度判断。
        claimRefs: []
