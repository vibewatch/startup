      - number: '7.3'
        title: 资本、时间线与竞争风险
        blocks:
          - type: paragraph
            body: >-
              2026 年 5 月 $240 million Series A 具有战略意义，但距离首座激光聚变电站所需资金还很远。Focused Energy 的公开路线图从 2028 年第一台激光器推进到 2037
              年首批并网 MWh，意味着从 Series A 交割起还有 11 年开发弧线，中间多个设施都需要资本、许可和技术成功。公司没有公开披露客户包销、PPA
              或收入桥，因此试点电站运行前的每一次延误，都会增加对股权、拨款或项目融资的依赖。相对同行，Focused Energy 比许多早期聚变初创融资更充足，但不是该类别的资本领导者：CFS 已筹集超过 $1.8
              billion，Helion 在 2026 年 6 月宣布规模大得多的融资、投后估值 $15.5 billion，Pacific Fusion 公布 $900 million 融资，TAE
              正推进数十亿美元级公开市场交易。即便在激光聚变内部，Marvel Fusion 和其他惯性约束项目也在争夺专业人才、工业伙伴和政治注意力。净结果是，Focused Energy
              必须执行一条时间线：它既长于创投常规，又短于首创电力基础设施工业化通常需要的时间。
