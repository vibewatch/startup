      - 反向论点
      - 决定因素
    rows:
      - - 轮次质量
        - $240M Series A 和顶级财团意味着投资人需求强
        - 未披露投后估值、证券条款或股权表数据
        - 发布实际轮次条款和清算瀑布
      - - 技术平台
        - 直接驱动激光聚变加 LLE 合作，可能造出差异化的欧洲冠军
        - 直接驱动商业证明仍落后于 NIF 式点火头条
        - 披露一个显示显著增益或靶丸发射进展的里程碑
      - - 战略验证
        - RWE、SPRIND、EIC 和黑森州带来政策与基础设施杠杆
        - RWE 同时是投资人和站点伙伴，模糊了公平交易定价信号
