      - number: '8.4'
        title: 建议以及哪些变化会改变判断
        blocks:
          - type: paragraph
            body: >-
              正确的投资姿态是继续研究、盯里程碑推进，而不是按估值故事立刻买入。支持面确实存在：Focused Energy 拼出了欧洲最强的核聚变投资人组合之一，拿到 SPRIND 和 EIC 生态的政府背书，借 RWE 与
              Hesse 锁定了高曝光度的 Biblis 选址路径，还与 University of Rochester 的 Laboratory for Laser Energetics 签下了有分量的 $6.9
              million 研究合作。但缺口更关键：公司仍未公开投后估值、股权结构细节、已披露客户承诺，也没有公开证据证明直接驱动商业化风险已降到足以套用 Helion、CFS 或 TAE 类估值倍数。若管理层披露
              Series A 真实条款、给出从 $240 million 走到试点电站规模的可信融资桥，并拿出已签署需求证据，建议可以上调。若 Biblis
              停滞、下一轮融资早于重大技术里程碑，或战略支持方只是内部标记价值、而非由独立外部买家验证价值，投资论点会明显转弱。
