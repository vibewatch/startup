      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >
              Focused Energy GmbH 是一家私营德美激光聚变公司，在 Germany 和 United States（Focused Energy Inc., Delaware）注册，总部位于 Im
              Tiefen See 45, 64293 Darmstadt, Germany，另在 Linkstraße 2, Berlin；600 Center Ridge Drive, Austin TX；以及 201
              Spear Street, San Francisco CA 设有办公室。公司 2021 年 7 月作为 Technical University Darmstadt（TU Darmstadt）和
              National Energetics 的技术衍生公司成立，目标是用脉冲高功率激光将惯性约束聚变（ICF）能源商业化。

              Focused Energy
              的单一使命，是建成全球第一座商业激光聚变电站，并向电网交付清洁、近乎取之不尽的聚变电力。技术路径是直接驱动惯性约束聚变：固态高能脉冲激光阵列直接压缩毫米级氘氚燃料颗粒，使其达到聚变点火所需的密度和温度，绕开
              Lawrence Livermore 的 NIF 所采用的黑腔间接驱动转换环节。公司把设计谱系建立在 2022 年 12 月 NIF
              点火突破之上；这是迄今唯一经科学验证实现净能量增益的受控聚变反应，公司团队中也包括直接参与该实验的科学家。

              商业模式面向项目融资和购电协议（PPA）：商业激光聚变电站将按兆瓦时向公用事业或工业客户售电。公司尚无收入且资本开支很重；当前活动全部集中在研究、工程和场址开发。根据公司公开路线图，首次收入路径要经过
              Biblis 的 Lighthouse 示范系统、2035 年同场址试点电站，以及 2037 年首次向电网交付 MWh。

              截至 2026 年 6 月报告日期，Focused Energy 拥有 160+ 名科学家、工程师和运营人员，来自 NIF/LLNL、University of Rochester 的 Laboratory
              for Laser Energetics（LLE）、ASML 等全球领先机构；公司已在 Darmstadt 建成核心设施，配备微铣削、显微、激光和低温系统，可用于聚变靶制造。
