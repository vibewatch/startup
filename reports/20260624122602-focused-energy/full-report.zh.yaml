      - number: '5.2'
        title: 直接驱动质子快点火架构
        blocks:
          - type: paragraph
            body: >-
              Focused Energy 的技术与 NIF 有一个关键差异：它走直接驱动，而非间接驱动。NIF 将精密加工的黄金 hohlraum 加热到 X 射线温度，再压缩燃料胶囊；Focused Energy
              的激光直接照射胶囊，省掉 hohlraum，并简化制造。第二个重大差异是质子快点火（PFI）。标准中心热点点火中，同一份激光能量一步完成压缩和点火。PFI 将这些阶段拆开：一组 351 nm
              波长的二极管泵浦固态压缩驱动器，把 cone-in-shell DT
              胶囊内爆到高密度；随后一个短时、高强度、皮秒级脉冲通过靶法向鞘层加速（TNSA）产生聚焦高能质子束，把能量沉积到压缩燃料中，启动热核燃烧波。FE 团队在 APS Division of Plasma
              Physics 2025 会议论文中指出三项主要物理风险：激光等离子体不稳定性（LPI，包括交叉光束能量转移、受激 Raman 散射和双等离子体子衰变）、流体动力学不稳定性和低模非对称。一维设计计算显示 >50×
              聚变增益，为三维退化留出余量；电站运行所需靶工程增益约为 25×。公司与 University of Rochester Laboratory for Laser Energetics（LLE）的 $6.9M
              合作——也是 LLE 史上收到的最大单笔产业赞助研究协议——使用 LLE 的 FLUX 宽带激光系统实验探测并抑制 LPI，直接反馈到 Fusion Pilot
              Plant（FPP）靶设计。专有「Pearl」胶囊为批量制造和高重复注入而设计；商业电站约需每秒 10 次射击（≈864,000 次 / 天），约为 NIF 年射击次数的 2,100 倍。公开层面尚无集成 PFI
              实验证明，从压缩驱动器到质子束再到聚变产额，能够在 FPP 条件下端到端跑通。
