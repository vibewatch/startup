      - number: '5.4'
        title: 制造、供应链与燃料循环
        blocks:
          - type: paragraph
            body: >-
              激光聚变的商业逻辑不仅取决于等离子体物理，也同样取决于制造经济性。一座吉瓦级电站约需 1,000 台激光放大器，它们必须像汽车一样工业化生产，而不是像科学仪器一样定制。Focused Energy CEO
              Thomas Forner 明确把这一转变列为公司的核心战略挑战之一。公开表述中提到的关键工业伙伴包括 TRUMPF（工业激光制造）、Schott
              AG（光学玻璃和精密材料）、Amplitude/Short（激光系统），以及包括 Sumitomo、Mitsui、Hamamatsu 和 Samsung
              在内的日本、韩国供应商。这些伙伴都没有公开披露已签供应协议；关系似乎仍处于 MoU 和共址兴趣阶段。Pearl 燃料胶囊必须以每秒 10 次的频率生产并注入；公开层面没有任何靶工厂证明能达到这个吞吐量。闭合 DT
              燃料循环通过反应室周围的锂毯增殖氚，在燃料侧闭合供应链，但也需要复杂的氚处理和锂化学系统；这些系统在商业重复频率下的可靠性尚未证明。反应堆第一壁和结构部件必须在连续运行的中子通量下存活 2–3
              年而无需更换；活化材料回收前需储存约 50 年。SourceLight 计划中的 PLANET 协作项目——2024 年与产业和研究伙伴启动——是 Biblis 的首个 LDRS
              技术工业原型，显示公司希望在聚变路线图成熟前，把近期分拆价值变现。
            claimRefs:
              - CE021
              - CE022
              - CE029
              - CE030
              - CE031
              - CE037
      - number: '5.5'
        title: 信任、安全、合规与技术风险
        blocks:
          - type: paragraph
            body: >-
              Focused Energy 将激光聚变定位为天然比裂变更安全：不会发生链式反应，没有长期核废料（只有需要约 50 年临时储存的活化第一壁材料），运行中的放射性负担也低于裂变电站。德国 2025 年 10
              月发布的 Fusion Action Plan 通过把聚变从核法移入辐射防护法，把这一点制度化，为 Biblis 提供了显著更简单的监管基线。Biblis
              场址在裂变退役阶段已按辐射防护惯例运行，因此具备现成监管环境。NRC、BfS 或同类监管机构尚未在任何地方为激光聚变设施颁发许可或正式审查；监管路径仍是前瞻性命题。主要技术风险分为六类。第一，LPI：尽管有
              LLE/FLUX 合作和 IFE-COLoR 联盟成员身份，LPI 缓解尚未在 FPP 所需能量和带宽条件下由实验闭环验证。第二，流体动力学与对称控制：cone-in-shell 几何中的 PFI
              内爆对称性没有公开集成演示。第三，高重复激光系统：商业电站所需可靠性和成本下，千焦级固态激光器 10 Hz
              运行今天并不存在；当前先进系统的重复频率低得多，维护负担更高。第四，靶制造吞吐量：没有公开路线图说明如何每秒生产并注入 10 枚 Pearl 胶囊。第五，腔室壁寿命：可在商业射击频率下承受 2–3
              年中子通量的材料，尚未在激光聚变环境中验证。第六，氚供应：全球氚市场很薄；任何聚变构型都尚未在商业规模证明锂增殖。Focused Energy 没有 GitHub
              仓库、开源工具包或公开交易的软件界面，这与其深硬件、预产品阶段一致；从业者社区参与主要体现在学术会议论文（APS DPP 2025）、公共资助 HPC
              模拟项目（EuroHPC/IFE-STAR）和联盟参与（IFE-COLoR、DOE INFUSE）。
