            body: >-
              Focused Energy 处于预商业阶段，尚无商业能源买方签署购电协议或包销合同。客户关系主要分为四类：主权政府和公共创新资助方——德国 SPRIND、European Innovation Council
              和 US Department of Energy——它们验证技术并提供非稀释资本；具有潜在未来包销兴趣的战略工业投资方，主要是欧洲公用事业运营商、Biblis 场址伙伴 RWE；CEO Thomas
              Forner 称来自 Gulf 和亚洲市场、可能成为聚变能源买方的国际投资者买方；以及 University of Rochester Laboratory for Laser Energetics 和 EU
              资助联盟等研究项目伙伴，它们共同开发技术基础，但无商业购电意图。没有超大规模云厂商或数据中心客户公开表达采购兴趣，也没有公开识别的工业过程热买方。德国和欧洲显然是近期地理重点，这由 Biblis 场址、RWE
              参与、德国 2025 年 10 月 Fusion Action Plan，以及 Focused Energy 公开信引发的 European Commission
              政策对话共同推动。买方分层横跨主权、工业、研究和新兴市场地理区域，商业包销则是 2035 年之后的目标。
