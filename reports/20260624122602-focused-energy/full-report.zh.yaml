      - number: '2.4'
        title: 增长驱动、采用约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              三股结构性力量强化市场论点。第一，欧洲能源安全紧迫性：Ukraine 战争后 Germany 对进口天然气的依赖、2035 年 REPowerEU 清洁电力目标，以及 Hesse 和 German federal
              层面的积极聚变资助承诺，给国内稳定电力方案带来其他较小聚变市场难以匹配的政治经济顺风。第二，AI 驱动的电力稀缺：IEA 数据显示，到 2035
              年电力需求增速将是整体能源需求的六倍，数据中心是主要驱动；这种压力压缩了高端买方愿为可靠性支付溢价的决策窗口。第三，美国和 EU 的聚变监管一直在主动减负——ADVANCE Act 将美国 NRC
              对聚变的监管轻度写入法律，低于对裂变的监管；欧洲聚变监管框架也在朝类似宽松方向演进。


              面对这些顺风，约束堆栈仍比需求叙事更重。Focused Energy 的直接驱动 ICF 路径仍需在工业规模下解决靶重复频率（每秒 10 次，对比 NIF 每年约 400
              次）、每天数百万颗燃料颗粒的靶制造经济性、激光墙插效率和反应室可存活性。SCSP 2025 年聚变供应链报告将 tritium、lithium-6 和高功率激光二极管可得性标为 ICF
              路径共同面临的战略瓶颈。Kleinman 的分析认为，第一批聚变电站上网电价可能显著高于燃气或太阳能，即使买方有可持续发展 mandate，也会限制早期采用经济性。Annual Reviews
              状态论文指出，ICF 点火所需内爆能量高于此前预期，商业电站落地前仍有重大工程和研究挑战。


              Focused Energy 的具体尽调缺口包括：没有公开客户 pipeline，没有披露 levelised cost estimate，没有独立验证的 Lighthouse 电站经济性，没有超出
              TechCrunch 和 TU Darmstadt 叙事的公开靶制造路线图，也没有披露商业规模 tritium
              燃料循环计划。这些缺口并不否定市场机会，但在示范里程碑完成前，投资逻辑仍牢牢处于「显著期权价值、证据受限」区间。
