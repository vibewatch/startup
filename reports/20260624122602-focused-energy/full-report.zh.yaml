  - id: TM004
    title: 增长驱动与采用约束表
    columns:
      - 驱动 / 约束
      - 方向
      - 时点
      - 对 Focused Energy 的含义
      - 尽调问题
    rows:
      - - 乌克兰战争后欧洲能源安全紧迫性
        - 顺风
        - 立即；2026 年政治授权仍在
        - 抬高本土稳定电力的付费意愿；德国尤其用公共资金支持 Biblis 计划
        - 在美国或亚洲同业建立欧洲先例之前，Focused Energy 能否锁定政府共同开发承诺？
      - - AI / 数据中心用电需求增长
        - 顺风
        - 2024–2030 年最急迫；长期则是结构性需求
        - 在全球创造高溢价清洁稳定电力买方；欧洲超大规模云厂商扩张又带来区域需求
        - 超大规模云厂商会否像对美国同业那样，在 Lighthouse 前与 Focused Energy 签远期 PPA？
      - - 聚变专属监管更轻（ADVANCE Act / 欧盟框架）
        - 顺风
        - 2024 年已在美国成文；欧盟框架仍在演进
        - 降低监管审批成本和时间线；Biblis 棕地场址可能已有电网和安全许可基础
        - Lighthouse 在 Biblis 按 Atomgesetz 后继框架推进，具体德国监管路径是什么？
      - - 德国工业脱碳要求与 EU ETS 碳价
        - 顺风
        - 2026–2035 年；EU ETS 收紧
        - 推高重工业化石燃料替代方案的成本；若聚变 LCOE 下降足够快，直接供热应用会更早具备经济性
        - Focused Energy 是否与德国工业运营商（钢铁、化工）讨论过潜在锚定工业客户？
      - - 资本强度与 FOAK 项目融资可得性
        - 约束
        - 2027–2032 年关键（从 Lighthouse 到首座商业电站）
        - 即便已有 $240M Series A，距离首座商业电站仍有巨大缺口；FOAK 项目融资需要可放贷的电站经济性，而示范前拿不到
        - 从 $240M 走到商业电站的路径是什么？还需要哪些股权轮次和债务 / 项目融资？
      - - 直接驱动靶丸制造的工业化规模
        - 约束
        - 商业电站前会卡住；Lighthouse 的关键研发里程碑
        - 每秒 10 发意味着每天需要数百万个靶丸，且单价低于 $1；行业内尚无任何公开示范证明这种能力存在
        - Focused Energy 目前靶丸制造速率、单靶成本，以及走向工业化规模生产的路径是什么？
      - - 氚与 lithium-6 供应链
        - 约束
        - 实质性；SCSP 将其列为战略瓶颈
        - DT 聚变需要氚增殖和 lithium-6 富集；供应集中在少数国家，且有竞争性用途
        - Focused Energy 是否披露了氚供应策略？是否加入任何供应链联盟？
      - - 时间线可信度与公众信任风险
        - 约束
        - 持续存在；里程碑延误会加重风险
        - 过度承诺时间线会伤害公众信心和投资人胃口；Kleinman 警告这是全行业脆弱点
        - Focused Energy 公开承诺过哪些具体、可证伪的 Lighthouse 里程碑和日期？
    notes: 时点标签为定性判断；“立即”指截至 runDate 2026-06-24 仍然有效。尽调问题反映公开语料缺口，应在管理层访谈中验证。
