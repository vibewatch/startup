          - type: callout
            title: Helion 是上限，不是默认可比公司
            body: Helion 的 $15.5B 估值只能作为上限参考：它背后有 Microsoft 合同、规模大得多的累计融资，以及 Focused Energy 仍未披露的电站建设证据。
            calloutType: insight
