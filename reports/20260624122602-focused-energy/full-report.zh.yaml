      - number: '7.4'
        title: 执行、集中度与否决条件
        blocks:
          - type: paragraph
            body: >-
              执行风险异常集中。相对于建设聚变园区并最终建成试点电站的野心，Focused Energy 的核心团队仍偏小，公司也反复强调创始人主导的科学领导力具有战略重要性。CEO Thomas Forner 和联合创始人
              Markus Roth 支撑资本形成、技术可信度和政策叙事；公开层面没有证据显示公司有深厚继任梯队，或在任何一人无法履职时有公开应急计划。依赖图也很窄。RWE
              同时是领投方、场址对手方、电网和公用事业关系，以及管理 Biblis 退役的运营方，因此单一利益相关方占据多条关键路径。SPRIND
              和其他州关联主体的公共支持有帮助，但也意味着项目仍暴露于政府预算和产业政策连续性。拟议拆分
              SourceLight，会在聚变核心降险前又增加一条管理线。用尽调语言说，如果高重复激光数据继续保持私有且没有可信第三方验证，如果 Biblis 建设窗口明显落后于已发布里程碑，如果 2028-2031
              年建设阶段前没有后续融资路径浮现，或如果 RWE 的战略角色收窄，投资逻辑就应视为破裂。
