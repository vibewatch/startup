      - number: '6.5'
        title: 扩张路径、集中风险与市场进入缺口
        blocks:
          - type: paragraph
            body: >-
              Focused Energy 的商业集中风险很高。德国——具体说是 Hessen 和 RWE 的 Biblis 场址——是唯一具名商业地点；没有第二个具名场址、第二家公用事业伙伴，也没有除未披露 Gulf
              和亚洲投资者之外的国际包销锚点。如果 Biblis 遇到监管或施工延误，公开层面没有近期替代场址。Gulf 和亚洲投资者是最可信的地理多元化路径，但其投资仍处预商业阶段，没有 MoU 或意向书确认包销意图。据
              NEI 引用 CEO 的说法，UKAEA 表达过非正式兴趣，但没有正式合作协议宣布。CEO 致 European Commission 的公开信显示公司有意把 Brussels 打造成覆盖 EU
              的市场准入政策杠杆，但这是一项倡议行动，不是商业承诺。鉴于聚变具备高质量热输出，切入工业热市场或超大规模云厂商数据中心供电在理论上可行，但截至 2026 年 6 月没有公开客户管线。若 SourceLight
              工业检测收入在 2026–27 年落地，可降低聚变项目集中度，但不能直接解决电力客户缺口。近期最强扩张路径，是在德国或邻近欧洲市场签下第二份公用事业 MoU，借助德国 Fusion Action Plan
              的监管顺风和 European Commission 政策对话。
