      - number: '8.3'
        title: 情景区间与里程碑闸门
        blocks:
          - type: paragraph
            body: >-
              用情景框架比给单一数字更诚实，因为 Focused Energy 披露了融资规模，却没有披露定价质量。牛市情景下，公司披露干净的投后估值，延展 Biblis 选址路径，把 LLE 合作和 DOE
              牵连的里程碑转化为可信技术降险，并从公用事业或工业买方签下第一个需求信号。在这一设定下，$1.2 billion 到 $2.2 billion 区间变得可行，但前提是先实现目前尚不存在的里程碑。基准情景假设
              $240 million 本轮可购买两到三年的技术进展、招聘和选址，而商业收入仍很遥远；这支持约 $450 million 到 $950 million
              的分析区间。熊市情景假设商业化推迟、直接驱动里程碑落后，且公司在任何客户合同前就需要高稀释后续融资；这导向约 $150 million 到 $400
              million。关键在于，商业聚变电站可能需要数十亿美元融资，因此 2037 年首度并网目标意味着从现在到收入之间还有多次融资事件；除非拨款、补贴或项目融资吸收大部分资本负担，每一次都带来稀释风险。
