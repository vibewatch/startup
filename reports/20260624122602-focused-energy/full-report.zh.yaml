  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层 / 组件
      - 系统角色
      - 关键依赖
      - 主要技术风险
    rows:
      - - 压缩激光驱动器（二极管泵浦固态，351 nm）
        - 向 DT 靶输送千焦级纳秒脉冲，以 10 Hz 频率压缩内爆
        - 每座电站以可接受成本大规模制造约 1,000 个激光放大器
        - 高重复频率激光的可靠性、热管理、光学寿命；10 Hz 千焦级 DPSSL 尚未在商业规模上存在
      - - 质子快点火（PFI）子系统
        - 皮秒高强度脉冲生成 TNSA 质子束，点燃压缩燃料
        - 质子束聚焦、与压缩核心的定时同步、锥壳胶囊几何形状
        - 压缩阶段的 LPI、水动力不稳定性、质子点火束表征；尚无端到端集成 PFI 演示
      - - Pearl DT 燃料胶囊与靶丸注入
        - 精密制造胶囊，填充低温 DT 燃料；以 10 Hz 注入腔体
        - 可量产胶囊，表面光洁度可控；高重复频率低温注入与对准
        - 商业规模下靶丸工厂的产能和成本；尚无约 864,000 个胶囊 / 天的公开路线图
      - - 反应腔与第一壁
        - 容纳聚变发射；吸收中子能量；氚增殖包层包围燃料
        - 第一壁材料可承受 2–3 年中子通量；发射间隙清理腔体碎片
        - 材料在持续中子通量下能否存活尚未验证；腔体维护和远程操作仍未解决
      - - 锂包层与氚燃料循环
        - 用锂增殖氚；闭合 DT 燃料循环；借助热交换器捕获能量
        - 氚处理基础设施；锂化学腐蚀控制；氚库存管理
        - 全球氚市场很薄；锂包层增殖已在裂变环境中验证，但尚未在激光聚变环境中验证
      - - 电厂配套系统（蒸汽循环、并网）
        - 将捕获的热能转化为电力；接入输电网
        - 常规电厂工程；RWE 的电网和场址经验
        - 针对激光聚变电厂的电厂配套系统设计，公开细节有限
    notes: 架构判断来自公开表述、会议论文和第三方可行性研究。系统集成尚无公开发布的独立工程验证。
