  - id: FE004
    title: 产品成熟度 / 能力图谱
    type: matrix
    layout: wide
    summary: 六个技术维度的定性就绪度评估，展示截至 2026 年 6 月 FE 哪些已有公开验证，哪些仍有缺口。
    approximationNotes: 单元格为截至 2026 年 6 月公开证据的定性摘要。TRL 分数仅为指示性判断，未经独立验证。「已验证子系统」指有已发表实验或里程碑证据；「概念 / 计划中」指公司路线图，尚无独立确认。
    claimRefs:
      - CE004
      - CE007
      - CE012
      - CE033
      - CE036
      - CE038
      - CE040
    data:
      columns:
        - 证据等级
        - 评估依据
        - 剩余缺口
      rows:
        - label: 靶物理（NIF 点火遗产）
          values:
            - 强验证（外部）
            - NIF 经同行评审的点火；FE 联合创始人和 CSO 设计过 NIF 靶；APS DPP 2025 论文给出 1D 增益 >50 设计
            - PFI 专属点火尚未在集成实验中演示；NIF 使用的是间接驱动
        - label: 质子束聚焦（PFI 点火器）
          values:
            - 子系统已验证
            - DOE Milestone 2（2024 年 11 月）在 Colorado State 演示了激光产生质子聚焦和重复频率靶丸对准
            - 结合压缩与质子点火的全尺寸 PFI 集成实验尚未演示
        - label: 高重复频率固态激光系统（10 Hz DPSSL）
          values:
            - 概念 / 早期开发
            - Biblis 计划建设激光开发大厅；尚无公开的 10 Hz 千焦级 DPSSL 演示报道
            - 商业可靠性和成本下的 10 Hz 千焦激光目前不存在；这是多年工程挑战
        - label: Pearl 靶丸工厂（10 Hz 吞吐）
          values:
            - 概念 / 早期阶段
            - 自有靶实验室已建成，并演示重复频率对准（DOE 里程碑）；没有公开的工厂级吞吐
            - 商业规模靶丸生产（约 864,000 枚 / 天）仍是未解决的制造难题
        - label: 反应腔壁与材料
          values:
            - 概念 / 未演示
            - NEI 文章提出了问题；没有公开的材料计划、辐照数据或原型反应腔
            - 材料在 2–3 年中子通量运行周期内的可存活性，是阻塞性工程缺口
        - label: 电站配套系统与并网
          values:
            - 概念 / 常规工程
            - 常规蒸汽循环工程；可借助 RWE 电网经验；Biblis 既有电网连接
            - 尚未披露针对激光聚变热输出的公开电站配套系统设计
  - id: FU001
    title: 客户旅程图——从认知到潜在购电
    type: journey-map
    insight: 截至 2026 年 6 月，最成熟的客户关系——RWE 和 Hessen 州——处于正式合作与投资阶段。还没有任何主体进入购电就绪阶段。从投资 / MoU 到商业电力交付，大约还需要十年 FPP 开发。
    claimRefs:
      - CU001
      - CU006
      - CU007
    data:
      nodes:
        - id: seg-sovereign
          label: 主权资助方（DOE、SPRIND、EIC）
          description: 政府主体验证技术并提供非稀释资本；当前阶段
          phase: 1
        - id: seg-utility
          label: 战略工业伙伴（RWE）
          description: 公用事业投资方提供场址接入和电网经验；处于投资与 MoU 阶段
          phase: 2
        - id: seg-hessen
          label: Hessen 州（政府 MoU）
          description: 州政府已签署 MoU，支持德国首座 FPP 落地 Biblis；处于正式合作阶段
          phase: 2
        - id: seg-research
          label: 研究伙伴（LLE、欧盟联盟）
          description: 科学和技术验证方，有活跃项目资金；支撑技术可信度
          phase: 1
        - id: seg-gulf-asia
          label: 海湾与亚洲投资买方
          description: 被描述为潜在买方；Series A 股权投资者，但未披露 MoU
          phase: 1
        - id: offtake-gap
          label: 商业购电（缺口——2035+）
          description: 截至 2026 年 6 月，暂无主体处于该阶段；首次商业电力交付目标在 FPP 原型之后
          phase: 3
  - id: FU002
    title: 采用漏斗——从可触达总体到签署商业合同
    type: funnel
    insight: 漏斗在项目伙伴阶段以下急剧收窄。已有七个具名关系，但只有两个具备正式 MoU 或场址承诺，签署商业能源合同的为零。投资与购电之间的缺口，是核心商业风险。
