      - number: '4.2'
        title: 收入模式与变现路径
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 6 月，Focused Energy 仍未产生收入。公司没有公开披露收入、ARR、GMV、已签客户合同、购电协议或商业包销安排。当前产出是研发里程碑、工程原型和设施建设，不是商业产品或服务。

              长期来看，主要收入机制会来自商业激光聚变电站通过购电协议（PPA）售电，或在批发电力市场售电：按交付给电网的 MWh，以合同价或现货价确认收入。这个模型接近传统核电和可再生能源项目融资结构。公司尚未披露定价、目标
              LCOE 或包销合同条款。

              次级或过渡性收入机制可以推断，但尚未确认：（1）技术许可——如果 Focused Energy 围绕关键激光系统或靶制造知识产权取得专利，向第三方电站建设方授权可能产生版税收入；（2）研究服务——与
              University of Rochester LLE 的 $6.9 million 合作体现了产业方资助学术研究的模式，但反向做法（向外部收取使用 Focused Energy
              自有设施的费用）并未宣布；（3）政府共同资助研发合同——DOE ARPA-E 项目和 EU Horizon 拨款代表持续的非商业收入类比，能降低现金消耗，但不是经营收入。

              预商业激光聚变的收入确认挑战很尖锐。不同于软件或市场平台公司，Focused Energy 没有价目表、试点客户、意向书，也没有可用来预测收入的合同积压。前瞻收入模型完全取决于尚未验证的技术里程碑（2035
              年试点电站、2037 年首个并网 MWh）、商业激光聚变尚未建立的监管路径，以及十多年后的电力市场环境。RWE 同时作为投资方和潜在未来客户，是最有商业意义的信号，但公司没有披露任何包销条款。

              EIC Scaling Club 访谈引用了 CEO Forner 关于 EIB
              项目融资讨论的说法。大型电站部署通常采用这种融资结构，说明公司已经在为商业电站考虑非股权资本。不过，项目融资需要经过验证的技术和监管批准，而这些目前都不存在。
