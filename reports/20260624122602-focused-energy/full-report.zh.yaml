  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与聚变电站概念
        blocks:
          - type: paragraph
            body: >-
              Focused Energy
              目前并不销售电力、反应堆模块或购电协议。公司当前交付物是一套分阶段工程计划，最终目标是在吉瓦级规模上建成面向公用事业、工业和国家安全买家的激光聚变电站。从客户工作流看，公司瞄准的是大型电力和热力消费者——公用事业公司、工业场址、数据中心、海水淡化设施和国家安全任务——这些客户目前依赖电网、燃气基础设施和备用发电。商业承诺是：Focused
              Energy 电站通过反复聚变射击驱动常规蒸汽循环，提供稳定、零碳、现场或并网的基荷电力。产品概念的差异点在于，公司声称自己位于唯一一条拥有同行评议、独立验证净能量增益的聚变路径上：Lawrence
              Livermore 的 NIF 点火射击，而公司的创始人和首席战略官参与了这些射击的设计。联合创始人的押注——LLNL 会实现点火，且团队可以被招募——两项都兑现了。当前产品栈由工程研发能力、靶实验室、前
              Biblis 核电站场址的早期设施基础设施，以及用于激光驱动辐射源近期工业应用的技术转化载体 SourceLight 组成。这些都不构成已交付商业产品；价值创造完全取决于 Biblis
              路线图能否在十年以上开发周期中跑通。
