      - number: '6.4'
        title: 留存、耐久性与伙伴连续性
        blocks:
          - type: paragraph
            body: >-
              由于 Focused Energy 仍未产生收入，标准留存指标——net revenue retention、gross revenue retention 和 churn
              rate——不适用。可用代理指标是战略关系连续性：投资、项目和场址伙伴是否跨融资轮次与里程碑延续。RWE 在约四年内通过两轮投资延续合作，并在 Series A 中扩大而非退出持仓。SPRIND
              的关系从种子轮延续到 Series A，且仍在持续。DOE 里程碑项目在两个技术交付成功后仍保持活跃。LLE 研究合作于 2026 年 3 月新签，期限明确为三年。从同期群视角看，早期机构支持者没有流失；2026
              年 Series A 是创始投资者基础的扩张，而非替换。没有满意度调查、NPS 分数或有约束力的续约承诺公开可得。所有留存信号都是非商业性质；如果 FPP
              时间线大幅延迟、政府项目资金结束，或竞争性聚变路径率先进入工程阶段，这些信号都可能变化。主要留存风险是时间线延误：Biblis 若超过 2035–36 年目标延期，将考验多年前做出的战略伙伴承诺能否维持。
