      - number: '2.3'
        title: 聚变电力的买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              早期聚变买方不是抽象的「电网」客户。同业证据显示，它们是可靠性痛点强、预算权集中的具体组织。Helion 的 Microsoft PPA（目标 2028 年 50 MW，Washington 州 Malaga
              在建）和 Nucor 协议（500 MW）说明，在公用事业把品类正常化之前，hyperscaler 和重工业就能先行承诺。Commonwealth Fusion Systems 与意大利公用事业 Eni 签署的
              $1B+ PPA，以及 CFS 对 Chesterfield County 场址的选择，显示一旦可信电站计划存在，公用事业和 IPP 也能担任 anchor buyers。Focused Energy
              公开用例——Germany 和 Europe 的清洁稳定电力、工业热脱碳、Biblis 场址的工业东道主模式——指向四类买方，每类都有不同预算所有者。


              Hyperscaler 和 AI 园区运营商按可靠性和无碳属性采购；预算掌握在能源采购和数据中心基础设施团队手中。German 和 European
              工业运营商（钢铁、化工、水泥）需要脱碳过程热；预算掌握在工厂能源、资本开支和可持续发展负责人手中。公用事业和 IPP
              需要可调度低碳容量；预算掌握在资产开发和发电投资团队手中。主权和市政基础设施出资方——供水、区域供热——需要长时、位置无关的电力；预算掌握在公共基础设施融资部门手中。所有细分的采用路径相似：公私里程碑、Biblis
              的 Lighthouse 示范、监管批准、anchor offtaker 承诺、FOAK 项目融资、首台套电站投运，然后重复部署并扩大机组群。Focused Energy
              有买方叙事，欧洲政府伙伴关系也比仅在美国运营的竞争者更强，但还没有发布 Helion 和 CFS 已经可见的客户证据。
