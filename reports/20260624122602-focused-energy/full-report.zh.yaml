      - number: '6.3'
        title: 采用准备度与商业轨迹
        blocks:
          - type: paragraph
            body: >-
              Focused Energy 仍处预商业状态，因此采用轨迹指标受限。公司已筹集约 $300 million 私人资本和 $200 million 拨款；据 Clean Energy
              Wire，这是欧洲资本化程度最高的私营聚变公司。根本商业时钟绑定 Biblis FPP 时间表——Forner 目标是在 2035–36 年建成原型聚变试点电站，届时理论上可向包销伙伴交付首批能源。从现在到
              2035 年，市场开发将包括争取更多 MoU、维持政府项目资格，并与潜在公用事业买方预先验证技术。FIA 2025 Global Fusion Industry Report
              确认，尚无私营聚变公司向电网客户交付商业电力；Focused Energy 在这方面并不例外，但属于全球资本化水平最高的一批企业。2026 年 6 月宣布的 X 射线和中子检测技术 spinoff
              SourceLight，是 Focused Energy 从 LDRS 技术平台获得商业收入的首条近期路径。据报道，首个 SourceLight 原型正在 Biblis 开发。$6.9 million LLE
              合作是 LLE 史上最大商业伙伴合作，也是近期机构对该项目商业方向信心的最强信号。被描述为潜在能源买方的 Gulf 和亚洲投资者，代表早期商业市场播种，但公司没有披露任何条款或 MoU。
