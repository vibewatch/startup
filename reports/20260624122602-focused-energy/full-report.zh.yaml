  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入与排除支出、现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Focused Energy 的市场常被误称为聚变研究或 deep-tech
              风险投资市场。公司尚未商业化，也未披露任何购电协议、工业承购合同或商业客户。其公开使命是把激光驱动惯性约束聚变（ICF）工业化，生产稳定、清洁且近乎取之不尽的能源。因此，相关市场是未来稳定电力产能、面向难减排工业和
              hyperscaler 场址的长期承购协议，以及工业过程热脱碳；不是全球聚变 R&D 的每一美元，也不是泛清洁能源采购。


              纳入支出包括：FOAK 聚变电站资本开支和工程；hyperscaler、公用事业、重工业运营商签署的长时稳定电力 PPA 或表后供电协议；钢铁、水泥、化工等过程工业的工业热承购合同；以及撬动私人商业化的公私
              grants 和共同开发预算。排除支出包括 NIF 和 stockpile-stewardship
              R&D、武器项目、没有稳定电力要求的普通可再生能源采购，以及已可由现有可调度电源或电网管理工具低成本解决的公用事业采购。


              现状替代方案仍很重要。可选碳捕集的联合循环燃气、常规核电和先进裂变（PWR 翻新、SMR）、海上风电叠加长时储能、地热、需求响应项目，都能比 2030 年代中期聚变电站更早解决同一买方问题。在
              Germany，退出煤电并于 2023 年完成核裂变退役，加深了对天然气进口和可再生能源的依赖；这强化了国内聚变的能源安全叙事，也凸显了过渡方案的紧迫性。RWE 同时担任 Biblis 场址所有者和
              Focused Energy Series A 领投方，是最具体的市场进入信号；它表明至少一家欧洲大型公用事业把激光 ICF 视为可信的未来发电资产，而不只是科学项目。
