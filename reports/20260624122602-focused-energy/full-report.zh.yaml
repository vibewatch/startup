      - number: '3.5'
        title: 负面证据——时间表可信度与竞争风险
        blocks:
          - type: paragraph
            body: >
              针对 Focused Energy 竞争位置的最强负面案例，是资本充足性和时间表可信度。CFS 累计融资是其 12 倍（$3B+ 对 $240M），Helion 是其 4 倍，Pacific Fusion
              的承诺资本是其 3.75 倍。如果 ICF 示范需要 $500M–$1B——这是常见分析师估计——Focused Energy 可能需要在示范前完成大额 Series B，带来潜在稀释和延期。Inertia
              Enterprises 2026 年 2 月 $450M 融资直接瞄准 Focused Energy 也声称拥有的 LLNL direct-ICF 知识库，形成一个更有资本、贴近美国政府的竞争者，并在 2026
              年融资上领先三个月。Xcimer Energy（$100M，不同 KrF
              驱动器）占据相近但不同的利基。时间表可信度是整个行业的共同问题：没有任何聚变公司已向电网交付商业电力。多个示范项目已经延期——General Fusion 的 LM26 时间表从 2020 年代初拉长到 2020
              年代末，Helion 2028 年 Microsoft PPA 截止期也被一些分析师视为偏愿景，因为 Polaris 里程碑与商业净能量交付之间仍有缺口。Focused Energy 自己的 2037
              年目标要求约 10 年内示范成功，这超过核设施从破土到商业运营的历史平均建设周期。General Fusion 2026 年 SPAC 申请——在 deep-tech
              中通常是最后融资手段——可能表明，更广泛的聚变市场无法同时吸收所有并行示范项目的资本需求。
