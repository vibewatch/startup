    title: 估值驱动因素计分卡
    type: bar
    layout: wide
    summary: 主要驱动因素相对强弱，决定聚合同业估值可迁移性应扩大还是压缩。
    data:
      items:
        - label: 战略投资者质量
          value: 75
          note: RWE、SPRIND、EIC 和专业基金提高可信度
          tone: positive
        - label: 政策顺风
          value: 68
          note: 德国和欧盟聚变倡导提升长期可选性
          tone: positive
        - label: 技术新颖性
          value: 55
          note: 直接驱动激光聚变有差异化，但仍处早期
          tone: warning
        - label: 估值透明度
          value: 20
          note: 未披露投后估值或股价
          tone: negative
        - label: 客户验证
          value: 18
          note: 未披露购电或 PPA
          tone: negative
        - label: 资本强度负担
          value: 15
