      - number: '5.3'
        title: Biblis 路线图与开发阶段
        blocks:
          - type: paragraph
            body: >-
              德国南部 Hesse 的前 Biblis 核电站场址，是 Focused Energy 商业化时间表的枢纽。Arthur D. Little 与 Focused Energy
              的联合可行性研究认为，现有涡轮机大厅、仓储建筑和加固反应堆穹顶可改造成激光实验室、靶制造、高功率激光测试站，并最终改造成示范电站——相较绿地建设，可实质性降低资本成本并加快进度。德国 2025 年 10 月
              Fusion Action Plan 将聚变从核法重新归入辐射防护法，移除了最沉重的监管层。IAEA 在一份明确点名 Biblis 为灯塔项目的评估中宣称，聚变已进入工程阶段。截至 2026 年 5 月
              Series A 交割，Focused Energy 计划在 12–24 个月内让 Biblis 的首个仓库和激光开发大厅投入运行；约 2028–2030 年在已清理的前机器大厅建成首个集成激光测试设施；到
              2030 年建成完整 Technology Readiness Level 6 设施，验证所有主要部件；2035–2036 年建成原型 Fusion Pilot Plant（FPP）。如果 Biblis
              场址赢得德国国家激光聚变中心征案，RWE 已承诺加快退役拆除，尽快把核基础设施腾挪给聚变使用。FE 还在 2026 年 6 月宣布计划拆分
              SourceLight，将激光驱动辐射源（LDRS）技术商业化——在一个紧凑系统中结合高能 X 射线和中子输出——服务于核废料表征、港口安检和无损检测等近期工业应用，首个工业原型同样计划落地 Biblis。
