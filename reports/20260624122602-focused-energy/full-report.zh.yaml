  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 资本结构与 Series A 融资
        blocks:
          - type: paragraph
            body: >-
              Focused Energy 于 2026 年 5 月 27 日完成 $240M Series A；据公司披露，并由 TechCrunch、The Next Web 和 Business Wire
              佐证，这是全球聚变史上规模最大的 fully secured Series A。该轮获得超额认购，公司称吸引了愿意一路资助到商业聚变电站的投资者。RWE AG 领投；InforCapital 报道其出资约
              $60M，但 RWE 尚未正式确认分拆。SPRIND（German Federal Agency for Breakthrough Innovation）、European Innovation
              Council（EIC）Fund 和回归领投方 Prime Movers Lab 也参与其中，另有来自 Germany、Europe、Asia 和 Gulf region 的未具名投资者。Hesse
              州政府融资工具 HessenFonds Beteiligungen 和 Hessen Kapital（由 BMH 管理）也有出资。公司未披露投后估值。

              Series A 之前，公司在 2021 年完成 $15M 种子轮（SEC Form D filing 确认，CIK 0001870675，accession 0001214659-21-007256，首次销售
              2021-06-22），由 Prime Movers Lab 领投，Alex Rodriguez、Marc Lore 和 Tony Florence 共同投资。种子轮与 Series A
              之间，后续私募股权轮次使公开估计的累计私人资本进入约 $255-300M 区间。TechCrunch 的数字意味着，除已披露 $15M 种子轮外，中间还有约 $45M 私人融资；InforCapital
              profile 指向略低的累计总额——这说明部分中间轮次在公开来源中仍只有不完整记录。

              Focused Energy 还获得约 $200M 公共 grants，使总融资达到约 $500M。已识别的 grant 组成包括：U.S. Department of Energy 的 $3M、SPRIND
              的估计 $50M（据 InforCapital）、2024 年 Hesse 州 €2.5M（€500k 州资金 + €2M 来自 European Regional Development Fund），以及
              2025 年 12 月 Hesse 州 €20M。European Investment Bank（EIB）Vice President Nicola Beer 出现在 Series A 公告材料中，CEO
              Forner 也确认正在进行 EIB 项目融资讨论。

              没有公开宣布债务、可转债、项目融资工具或授信额度。截至报告日期，公司似乎完全由股权和 grants 资助。
