      - number: '7.2'
        title: 监管、法律与场址风险
        blocks:
          - type: paragraph
            body: >-
              Focused Energy 还面临真正新颖的许可问题。德国辐射法和核法都牵涉 Biblis 计划：Strahlenschutzgesetz 第 10 条要求产生电离辐射的设施取得许可；Atomgesetz 第
              7 条仍然重要，因为 Biblis 是前裂变场址，仍处在 RWE
              控制的退役制度中。因此，公司不是只申请一张绿地工业许可；它是在一个没有德国直接先例的棕地核资产上叠加首创聚变开发项目。欧洲层面的监管路径也没有稳定下来。2026 年 4 月，CEO 公开主张 EU
              仍缺少专门聚变战略；美国 NRC 截至 2026 年 2–5 月也只有拟议中的聚变机器框架，最终规则仍待出台。也就是说，Focused Energy
              在推进项目时，关键可比司法辖区仍在定义如何监管聚变。Biblis 项目有吸引力，正因为现成电网、土地和核基础设施存在；但同样的场址集中也制造风险：如果 RWE
              的退役时间表、监管解释或政治支持变化，整条路线图可能同时后移。
