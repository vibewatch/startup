  - id: FE001
    title: 产品架构图——激光聚变电站层级
    type: stack
    layout: wide
    summary: 从燃料循环到辅助系统的六个功能层，展示一座商业 Focused Energy 电站必须闭合的集成栈。
    claimRefs:
      - CE003
      - CE005
      - CE006
      - CE008
      - CE022
    data:
      layers:
        - id: bop
          label: 辅助系统与电网集成
          detail: 蒸汽轮机、发电机、换热器、冷却系统和输电网接口，把热能转成可外送电力。
          modules:
            - 蒸汽循环（轮机和发电机）
            - 并网和电能调节
            - 场地公用工程（冷却水、配电）
        - id: chamber
          label: 反应室和第一壁
          detail: 加固腔体容纳每次聚变发射，靠含锂增殖包层吸收中子，在两次发射之间排出碎屑，并捕获热能。
          modules:
            - 第一壁结构材料（2–3 年更换周期）
            - 锂增殖包层（产氚）
            - 中子能量捕获和传热回路
        - id: fuelcycle
          label: DT 燃料循环和氚增殖
          detail: 闭合循环在包层中用锂增殖氚，提取并再处理氚以填充下一个靶材，同时管理氘供应。
          modules:
            - 氚提取和纯化
            - Pearl 胶囊低温 DT 装填
            - 海水提取氘供应
        - id: target
          label: Pearl 靶丸制造与注入
          detail: 团队连续量产高精度 DT 冰靶丸，完成质检后，以 10 Hz 频率、微秒级精度注入反应腔。
          modules:
            - Pearl 靶丸生产线
            - 低温处理与运输
            - 高重复频率靶丸注入器与对准
        - id: compression
          label: 压缩激光驱动器（DPSSL，351 nm）
          detail: 二极管泵浦固态激光放大器阵列以 10 Hz 产生纳秒级千焦脉冲，对 DT 靶丸做对称内爆。
          modules:
            - 每座电站约 1,000 个模块化激光放大器
            - 光束合成、整形与相位控制
            - 终端光学与靶室接口
        - id: ignition
          label: 质子快点火子系统
          detail: 单独的高强度皮秒激光产生聚焦 TNSA 质子束，把能量沉积到压缩燃料核心，点燃热核燃烧。
          modules:
            - 高对比度皮秒点火激光
            - 质子束聚焦与锥壳结构
            - 与压缩脉冲同步定时
  - id: FE002
    title: 客户工作流 / 运行流程——激光聚变电站发射周期
    type: flow
    layout: wide
    summary: 从靶丸注入、聚变能捕获，到电力外送并为下一发循环供电的单发运行闭环。
    claimRefs:
      - CE003
      - CE005
      - CE006
      - CE008
      - CE009
    data:
      nodes:
        - id: fabricate
          label: 制造并冷却 Pearl 靶丸
          description: 靶丸工厂生产填充 DT 的高精度靶丸，完成低温装载和质检。
        - id: inject
          label: 注入并对准靶丸
          description: 靶丸以微秒级定时送至反应腔中心；对准确保辐照对称。
        - id: compress
          label: 发射压缩激光阵列
          description: 约 1,000 个 DPSSL 放大器阵列输出同步千焦纳秒脉冲，压缩靶丸内爆。
        - id: ignite
          label: 发射 PFI 质子点火束
          description: 皮秒高强度脉冲产生聚焦质子束，把能量沉积到压缩后的热点。
        - id: burn
          label: DT 热核燃烧
          description: 聚变燃烧波穿过压缩 DT 燃料；10 Hz 下每天约 864,000 发。
        - id: capture
          label: 中子与热能捕获
          description: 锂增殖包层和换热器吸收中子通量，增殖氚并提取热能。
        - id: export
