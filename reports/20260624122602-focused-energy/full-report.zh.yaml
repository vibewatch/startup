      - number: '1.2'
        title: 创始人与领导团队
        blocks:
          - type: paragraph
            body: >
              Focused Energy 于 2021 年 7 月由四位核心成员共同创立：Thomas Forner（CEO）、Prof. Dr. Markus Roth（Chief Science
              Officer）、Prof. Dr. Todd Ditmire（创立时 CTO）和 Dr. Anika Stein（创立时
              COO）。创始团队组合了连续创业者、两位拥有数十年聚变研究经验的世界级激光与等离子体物理学家，以及一名具备航空航天和国防背景的运营工程师——这个配置意在把科学可信度和工业化能力接起来。

              Thomas Forner 是经验丰富的创业者，在 Focused Energy 之前创立过多家公司；他负责公司发展、融资和外部战略。Prof. Dr. Markus Roth 是 TU Darmstadt
              激光与等离子体物理教授，三十年来研究聚变靶物理，并参与了 2022 年 NIF 突破背后的团队；他继续担任 Chief Science Officer。Prof. Dr. Todd Ditmire 是
              University of Texas Austin 教授，也是高强度激光—等离子体物理的世界级专家；他共同创立公司，并一直是美国侧学术合作的关键人物。

              2025 年 12 月，Focused Energy 大幅扩充高管团队。Debbie Callahan 是 NIF 的核心靶设计科学家之一，帮助实现了 2022 年历史性点火；她被任命为 Chief
              Strategic Officer（CSO），负责把科学进展转化为工业应用，并简化燃料靶以支持量产。Omar Biabani 曾任 ASML Product Development
              副总裁，深度参与极复杂技术的规模化；他同时被任命为 Chief Technology Officer（CTO），接手通往商业电站的技术路线图。Chris Wendel 担任 President and
              CFO，Decker Gentili 担任 COO。

              领导层配置显示，公司有意从科学主导转向工业化主导：Callahan 把 NIF 点火经验直接带入靶工程；Biabani 则带来全球最复杂半导体光刻机制造商的规模化制造背书。关键人风险仍集中在 Thomas
              Forner（CEO、融资和商业关系）与 Markus Roth（科学可信度和 TU Darmstadt 机构关系）。
