      - number: '6.6'
        title: 展示材料
        blocks:
          - type: callout
            title: RWE 重复投资是欧洲聚变最强商业证明点
            body: >-
              RWE 在约四年内跨两轮融资参与，并以 €60 million 锚定 $240 million Series A，是欧洲聚变版图中最强的单一客户代理信号。它提供 Biblis
              场址访问、电网工程领域知识，以及未来与一家大规模运营煤电、燃气和可再生能源资产的公用事业公司讨论包销的可信路径。欧洲没有其他私营聚变公司拥有与运营中公用事业公司同等的关系。
