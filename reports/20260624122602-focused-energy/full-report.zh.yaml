  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 技术与工程风险
        blocks:
          - type: paragraph
            body: >-
              Focused Energy 的核心技术风险在于，它选择的路径——使用专有 Hybrid Shock 靶架构的直接驱动激光惯性约束聚变——尚未公开实现点火；迄今最经验证的惯性约束里程碑，则由 NIF
              通过间接驱动实现。这一区别很关键，因为公司并不是在商业化已经跑通的同一构型。2026 年 3 月的 LLE 合作明确瞄准尚未解决的激光等离子体不稳定问题，包括 CBET、SRS 和
              TPD；这说明若干最重要的物理闭环项仍在实验攻关，而不是工程降险。即使物理闭环完成，电站设计假设也很苛刻：商业运行需要约每秒 10
              次射击、高重复下耐用的紫外激光部件，以及按工业吞吐量制造和注入靶；公开层面没有每年数百万个靶的先例。Focused Energy 没有发布 Hybrid Shock
              靶产线的公开成本模型或吞吐模型，因此投资者还无法检验直接驱动概念只是科学上可行，还是在电站经济性下真正可制造。
