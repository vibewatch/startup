        title: 竞争者画像——规模、融资、伙伴与商业证据
        blocks:
          - type: paragraph
            body: >
              资本分层非常鲜明。CFS 以累计 $3B+ 融资领跑私营聚变领域，2022 年 12 月完成 $863M Series B2，SPARC 组装已启动并拥有 18 块 HTS 磁体；来自意大利公用事业 Eni 的
              $1B+ PPA，让 ARC 商业电站（Chesterfield County VA，400 MW）定位于 2030 年代初并网交付。Helion 总融资 $1B+，包括 $425M Series F；它在
              2023 年确认 Polaris 中 1.5 亿度等离子体温度，签署全球首个聚变 PPA（Microsoft，50 MW，目标 2028），与 Nucor 达成 500 MW 工业 PPA 用于钢铁生产，并于
              2025 年 7 月在 Washington 州 Malaga 开始建设 Orion 商业机器。Pacific Fusion 的 $900M+ 承诺资本按里程碑释放；Sandia
              合作展示了与其脉冲磁驱动器相关的压缩靶物理。Inertia Enterprises 2026 年 2 月 $450M 融资，是全球 ICF 第二大单轮承诺；其 LLNL R&D 伙伴关系让它特权接触
              Focused Energy 共同创始人也参与构建的同一直接 ICF 数据集。Xcimer（$100M）在资本规模上可与 Focused Energy 对比，但聚焦不同的 KrF 驱动器。Marvel
              Fusion（估计约 $150M）阶段更早。Sacra 估计 CFS 在 SPARC 前收入低于 $10M；除 CFS 外，整个 ICF 和非 CFS 聚变领域都尚无收入，竞争的是投资者和政府承诺，而不是商业
              traction。Focused Energy 的 $240M 是聚变史上最大单笔 Series A，但在资本最充足的五个项目中累计总额最小。
