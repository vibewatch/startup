      - number: '8.5'
        title: 附录
        blocks:
          - type: callout
            title: 缺失投后估值比融资标题更要紧
            body: Focused Energy 的融资动能很清楚，但投资人仍看不到真实价格、优先权堆栈和稀释路径。因此，这轮融资能证明有资金需求，却不能证明承销质量。
            calloutType: risk
