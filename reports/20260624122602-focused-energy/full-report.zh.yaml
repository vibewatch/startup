      - number: '4.5'
        title: 前瞻资本需求与融资环境
        blocks:
          - type: paragraph
            body: >-
              Focused Energy 的资本需求远高于当前资本化水平。Biblis 试点电站成本估计为 €5-10 billion；公司已筹集约 ~$300 million 私人股权和 ~$200 million
              拨款（合计约 ~$500 million）。即便按成本区间低端（€5 billion ≈ $5.4 billion），当前总融资与试点电站成本之间仍有约 $4.9 billion 缺口，且还未计入到 2035
              年前的持续运营费用。

              德国和欧洲政策环境，是公司填补缺口的主要结构性优势。Biblis MoU 已获得 Hesse 州政府和 RWE 的正式承诺。德国联邦政府已把聚变纳入 High-Tech Agenda 和 2025
              年联合执政协议。European Investment Bank 表达了项目融资兴趣。$6.9 million LLE 合作和 SPRIND 参与，显示公共部门愿意共同投资研发阶段。

              Fusion Industry Association 给出的行业资本背景显示，全球聚变累计投资已超过 $9.7 billion，仅 2024-2025 年就募集超过 $2.6 billion。FIA
              受访者中位数估计，要让首批电站上线，还需额外 $700 million；全行业合计资本需求超过 $77 billion。这些数字说明，Focused Energy
              的资本缺口虽大，但并非个案；政府共同出资、项目融资和后续股权轮次的组合有可能解决。

              近期有三项融资风险：（1）Biblis 施工许可——如果监管批准延迟，2035 年试点电站时间表会后移，首个收入事件也会推迟，并可能需要过桥融资；（2）竞争对手融资——Inertia Enterprises 的
              $450 million Series A 会直接争夺 laser ICF 人才和投资者注意力；（3）德国政治连续性——当前支持聚变的政策环境，部分取决于 2025 年后保守派联盟继续维持 High-Tech
              Agenda 优先级。
