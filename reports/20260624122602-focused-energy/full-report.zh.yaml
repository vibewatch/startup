      - number: '1.4'
        title: 技术里程碑与商业化路线图
        blocks:
          - type: paragraph
            body: >
              Focused Energy 用四年时间从 TU Darmstadt 的学术衍生公司，推进为全球领先的激光聚变公司（按公司自身表述及融资规模衡量），背后是一条直接承接 NIF 点火遗产的严密技术路线图。

              公司 2021 年创立时，NIF 正快速逼近 2022 年 12 月的历史性点火；随后 NIF 科学家 Debbie Callahan 和 Pravesh Patel 加入 Focused
              Energy，确认科学共同体把点火里程碑视为真正拐点。公司和独立分析师都承认，商业挑战在于把 NIF 每年约 400 次发射，放大到每秒 10 次（每天 864,000
              次）且具备工业可靠性——这意味着从实验室精度切换到制造线经济性。

              核心技术子项目包括：（1）规模化靶制造——把 NIF
              复杂的黑腔间接驱动靶，简化为可大批量制造的直接驱动颗粒；（2）激光系统工程——把像卫星一样手工、逐台生产的激光系统，转成有供应链、像汽车一样生产的系统；（3）设施集成——把 Biblis
              核电站基础设施改造用于聚变。

              2025 年 3 月与 RWE 和 Hesse 州政府签署的 MoU，是一个重要机构里程碑，正式承诺各方到 2035 年在 Biblis 建设示范装置（Lighthouse），并最终建设电站。一项名为 "From
              Fission to Fusion" 的可行性研究已启动，用于验证该场址潜力。截至 2025 年 12 月，改造 Biblis 现有建筑的施工已经展开。

              2026 年 3 月，Focused Energy 宣布与 University of Rochester 的 Laboratory for Laser Energetics（LLE）达成一项 $6.9M
              产业赞助研究合作——这是 LLE 获得的最大单笔产业赞助研究协议——用于攻关惯性聚变能源的基础挑战。2026 年 4 月，CEO Thomas Forner 联署致 European Commission
              的公开信，呼吁制定有雄心的 EU 聚变战略。

              公司公开技术路线图目标为：Seed（2023）、First Laser at Biblis（2028）、First Light in Diagnostics
              Chamber（2031）、Implosion（2033）、Pilot Plant（2035）、First Grid MWh（2037）。
