  - id: FM001
    title: 市场规模视角——从宽口径聚变 TAM 到公开 SOM 为零
    type: pyramid
    layout: standard
    summary: Focused Energy 更可辩护的规模视角，要从宽口径聚变生态市场预测，收窄到以欧洲为锚的稳定电力和工业热能滩头；公司披露的当前 SOM 仍是零公开签约需求。
    data:
      nodes:
        - label: 宽口径全球聚变生态 TAM：$18.0B（2026）→ $33.77B（2031）
          detail: MarketsandMarkets 统计所有聚变路线、燃料、终端用户和地区；包括科研支出。
          tone: positive
        - label: 长期行业情景：$40B–$80B（2036）到 >$350B（2050）
          detail: Future Markets 情景假设里程碑按期落地，聚变成为大型能源市场品类。
          tone: positive
        - label: 高溢价稳定电力需求拉动：电力需求增速比能源需求快 6 倍（IEA，至 2035）
          detail: AI / 数据中心和工业电气化让全球愿意为可靠、无碳基荷付溢价，正好匹配 FE 的产品。
          tone: neutral
        - label: 欧洲能源安全 SAM 代理：德国 + EU 工业热能 + hyperscaler
          detail: Focused Energy 的欧洲优先策略瞄准一个比全球 TAM 更小、但在政策和共同投资上推进更快的独立细分市场。
          tone: neutral
        - label: Focused Energy 公开 SOM：0 已披露 MW，无 PPA，无具名商业客户
          detail: 公司尚未披露任何签约需求；与 RWE 的 Biblis MOU 是场地协议，不是购电承诺。
          tone: warning
    approximationNotes: 各层是不同规模视角，不是可相加的算术。上两层是市场价值预测；第三层是需求增长代理；第四层是定性的欧洲子细分；底层是公开记录中以已签约 MW 观察到的 SOM。
