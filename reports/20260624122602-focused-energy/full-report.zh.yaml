  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局——直接 ICF 同业与其他聚变路径
        blocks:
          - type: paragraph
            body: >
              FIA 2025 年报告显示，全球聚变行业共有 43 家私营公司，但与 Focused Energy 直接相关的 ICF
              子群不到十家。直接同业共享同一套激光压缩物理，差异在驱动器技术、靶几何和资本规模。Xcimer Energy（San Diego，2022）选择 KrF 准分子 UV 激光，2024 年 6 月融资
              $100M，以利用 NIF 展示的短波长耦合效率。Pacific Fusion（Livermore，2021）推进脉冲磁 ICF——用电磁压缩而不是直接激光烧蚀——并获得 $900M+ 承诺资本，按里程碑释放的
              Series A；它在 New Mexico 开设示范园区，并以 2030 年实现设施净能量增益为目标。Marvel Fusion（Munich/Denver，2019）使用 CO 基超快激光脉冲，并与
              Colorado State University 合作开展高功率激光 R&D。Inertia Enterprises（Livermore，2025）是最新且资本最充足的 ICF 新进入者：它直接从 LLNL
              衍生，2026 年 2 月融资 $450M，并立即与 LLNL 签署 R&D 合作，实际上把 NIF 项目的直接 ICF 知识库商业化。ICF 之外，CFS（Cambridge MA，总融资 $3B+）正在组装
              SPARC 的 HTS tokamak，Helion（Everett WA，总融资 $1B+）于 2025 年 7 月开始建设 Orion FRC 机器，TAE Technologies（Foothill
              Ranch CA，$1.2B+）瞄准 aneutronic hydrogen-boron FRC，General Fusion（Vancouver，$400M+）在 2026 年提交 SPAC
              上市申请。Focused Energy 的直接驱动激光 ICF 去掉了 NIF 采用的黑腔 X-ray 转换环节，目标是提高驱动器到靶的耦合效率；其 Biblis brownfield
              策略也创造了一个当前美国同业尚未匹配的欧洲优先护城河。
