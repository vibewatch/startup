callouts:
  - calloutType: strength
    title: "Largest Fully Secured Series A in Global Fusion History"
    body: >
      The May 2026 $240 million Series A — oversubscribed and led by RWE — is the largest fully
      secured Series A in global fusion to date, per company announcement corroborated by
      BusinessWire, TechCrunch, and multiple industry outlets. Combined with ~$200 million in
      public grants, Focused Energy's ~$500 million total funding positions it as one of the
      best-capitalized pre-commercial fusion startups globally.
    claimRefs: [CO025, CO020, CO022]

  - calloutType: strength
    title: "RWE as Both Lead Investor and Infrastructure Partner"
    body: >
      RWE's role is structurally unique among fusion investments: it is simultaneously the lead
      Series A investor, the provider of the Biblis decommissioned nuclear site (with existing grid
      connection, cooling infrastructure, regulatory frameworks, and nuclear-trained workforce), and
      the operational partner for the pilot plant. This structure compresses development timelines
      by years compared to a greenfield site and aligns commercial incentives across capital, land,
      and operations.
    claimRefs: [CO026, CO033, CO029]

  - calloutType: strength
    title: "NIF-Lineage Scientific Team: Callahan, Patel from Ignition"
    body: >
      Debbie Callahan, who co-designed the NIF fuel target that achieved the 2022 net-energy-gain
      breakthrough, serves as Focused Energy's Chief Strategic Officer. Pravesh Patel, another
      NIF ignition scientist, has also joined. This direct transfer of NIF scientific expertise is
      rare and difficult to replicate — providing both technical credibility and a short path from
      laboratory ignition to commercial target simplification.
    claimRefs: [CO015, CO032]

  - calloutType: risk
    title: "Fundamental Engineering Gap: NIF Shots/Year to 10 Shots/Second"
    body: >
      The NIF fires approximately 400 shots per year; Focused Energy's commercial target is 10 shots
      per second — approximately 3 million times higher repetition. Solving debris management,
      target injection precision, laser repetition rate, and thermal management at these rates has
      no demonstrated precedent. The transition from laboratory science to manufacturing-scale
      commercial operation is the primary technical and timeline risk.
    claimRefs: [CO039, CO040]

  - calloutType: risk
    title: "No Post-Money Valuation Disclosed; Pilot Plant Cost Highly Uncertain"
    body: >
      No post-money valuation from the Series A has been publicly disclosed. Pilot plant cost
      estimates range from €5-7 billion (Fusion Energy Insights) to ~€10 billion (German Wikipedia),
      a range that implies material uncertainty before detailed engineering studies are complete.
      The $300 million in private capital raised so far is a small fraction of the projected
      commercialization cost, requiring substantial future project-finance, government co-funding,
      or additional equity rounds.
    claimRefs: [CO030, CO036, CO041]

  - calloutType: insight
    title: "German and EU Policy Tailwind: Fusion on National Agenda"
    body: >
      The German government has included fusion on its Hightech Agenda and coalition agreement;
      Germany's Chancellor Friedrich Merz expressed support for fusion commercially. The state of
      Hesse has committed multi-year grants. The EU open letter campaign and EIC Fund participation
      signal that European public institutions view laser fusion as an industrial policy priority.
      This policy environment creates a structural co-financing advantage unavailable to purely
      private-capital competitors.
    claimRefs: [CO023, CO024, CO028, CO038]

