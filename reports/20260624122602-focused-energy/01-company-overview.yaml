company:
  name: "Focused Energy"
chapter:
  number: 1
  title: "Company Overview"
  summary: >
    Focused Energy is a German-American laser-inertial-confinement fusion company founded in July 2021
    as a spinout from the Technical University of Darmstadt, headquartered in Darmstadt with offices
    in Berlin, Austin, and San Francisco and a staff of 160+. On 27 May 2026 it closed a $240 million
    Series A — the largest fully secured Series A in global fusion history — led by RWE, bringing
    total private capital to approximately $300 million and total funding (including ~$200 million in
    public grants) to roughly $500 million. The company's Lighthouse demonstration system is planned
    for the decommissioned Biblis nuclear site in Hesse under a March 2025 MoU with RWE and the Hesse
    state government, targeting a pilot plant by 2035 and first grid megawatt-hour by 2037.

sections:
  - id: identity-and-business-model
    title: "Identity and Business Model"
    body: >
      Focused Energy GmbH is a private German-American laser fusion company incorporated in Germany and
      in the United States (Focused Energy Inc., Delaware), headquartered at Im Tiefen See 45,
      64293 Darmstadt, Germany, with additional offices at Linkstraße 2, Berlin; 600 Center Ridge
      Drive, Austin TX; and 201 Spear Street, San Francisco CA. The company was founded in July 2021
      as a technology spinout of Technical University Darmstadt (TU Darmstadt) and National Energetics
      to commercialize inertial confinement fusion (ICF) energy using pulsed high-power lasers.

      Focused Energy's singular mission is to build the world's first commercial laser fusion power
      plant and deliver clean, inexhaustible fusion-generated electricity to the grid. Its technology
      approach is direct-drive inertial confinement fusion: arrays of solid-state high-energy pulsed
      lasers directly compress millimetre-scale deuterium-tritium fuel pellets to the density and
      temperature conditions required for fusion ignition — bypassing the hohlraum-based indirect-drive
      conversion step used at Lawrence Livermore's NIF. The company bases its design lineage on the
      December 2022 NIF ignition breakthrough, the only controlled fusion reaction to have
      demonstrated scientifically verified net energy gain, and employs scientists who contributed
      directly to that experiment.

      The business model is project-finance and power-purchase-agreement (PPA) oriented: a commercial
      laser fusion power plant would sell electricity by the megawatt-hour to utilities or industrial
      customers. The company is pre-revenue and capital-intensive; all current activities are
      research, engineering, and site development. The planned path to first revenue runs through the
      Lighthouse demonstration system at Biblis, a pilot plant at the same site by 2035, and first
      grid MWh delivery by 2037 per the company's public roadmap.

      As of the June 2026 run date, Focused Energy employs 160+ scientists, engineers, and operators
      drawn from world-leading institutions including NIF/LLNL, the Laboratory for Laser Energetics
      (LLE) at the University of Rochester, and ASML, and has established a core facility in Darmstadt
      equipped for fusion target fabrication including micro-milling, microscopy, lasers, and cryo
      systems.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007, CO008, CO009]
    tableRefs: [TO001]
    figureRefs: [FO002]

  - id: founders-and-leadership
    title: "Founders and Leadership Team"
    body: >
      Focused Energy was co-founded in July 2021 by four principals: Thomas Forner (CEO), Prof. Dr.
      Markus Roth (Chief Science Officer), Prof. Dr. Todd Ditmire (CTO at founding), and Dr. Anika
      Stein (COO at founding). The founders combine a serial entrepreneur, two world-class laser and
      plasma physicists with decades of fusion research, and an operational engineer with aerospace and
      defense background — a configuration designed to bridge scientific credibility with
      industrialization capability.

      Thomas Forner is an experienced entrepreneur and founder of multiple companies before Focused
      Energy; he leads corporate development, financing, and external strategy. Prof. Dr. Markus Roth
      is a professor of laser and plasma physics at TU Darmstadt who spent three decades on fusion
      target physics and was part of the team behind the 2022 NIF breakthrough; he continues as Chief
      Science Officer. Prof. Dr. Todd Ditmire, professor at the University of Texas Austin and
      world-leading expert in high-intensity laser-plasma physics, co-founded the company and has been
      central to the U.S.-side academic partnerships.

      In December 2025, Focused Energy expanded its executive leadership team significantly. Debbie
      Callahan — one of the principal target-design scientists at NIF who helped achieve the historic
      2022 ignition — was appointed Chief Strategic Officer (CSO), with responsibility for
      translating scientific advances into industrial applications and simplifying the fuel target for
      mass production. Omar Biabani, formerly Vice President of Product Development at ASML with
      deep experience scaling highly complex technologies, was simultaneously appointed Chief
      Technology Officer (CTO), taking over the technological roadmap toward the commercial power
      plant. Chris Wendel serves as President and CFO, and Decker Gentili as COO.

      The leadership configuration reflects a deliberate pivot from science-led to
      industrialization-led management: Callahan brings NIF ignition expertise directly to target
      engineering; Biabani brings manufacturing-at-scale credibility from the world's most complex
      semiconductor lithography machine maker. Key-person risk remains concentrated in Thomas Forner
      (CEO, fundraising, and commercial relationships) and Markus Roth (scientific credibility and
      TU Darmstadt institutional relationships).
    claimRefs: [CO010, CO011, CO012, CO013, CO014, CO015, CO016, CO017, CO018]
    tableRefs: [TO002]

  - id: funding-history
    title: "Funding History and Capital Structure"
    body: >
      Focused Energy has raised approximately $300 million in private equity capital and $200 million
      in public grants and government support, for total funding of approximately $500 million as of
      June 2026. This makes it one of the most heavily funded fusion startups globally.

      The Seed round of $15 million closed in June/July 2021, led by Prime Movers Lab with
      co-investors including Alex Rodriguez, Marc Lore, and Tony Florence; the SEC Form D (accession
      0001214659-21-007256, filed 2021-07-06, CIK 0001870675) confirms a $15 million offering with
      first sale on 2021-06-22 under Rule 506(b). Government grants received through approximately
      2025 include $3 million from the U.S. Department of Energy, a major grant from the German
      Federal Agency for Breakthrough Innovation SPRIND (InforCapital estimates this contribution at
      $50 million), €2.5 million from the state of Hesse in 2024 (partly from the European Regional
      Development Fund), and €20 million from the state of Hesse in December 2025. The total grant
      picture brings public support to roughly $200 million, consistent with TechCrunch and The Next
      Web's reporting.

      Between the 2021 seed and the 2026 Series A, additional private rounds brought cumulative private
      capital to approximately $60 million before the Series A; the exact round structure and
      valuations for these intermediate tranches are not publicly disclosed.

      The $240 million Series A closed on 27 May 2026, the largest fully secured Series A in global
      fusion industry history. RWE led the round (contributing an estimated $60 million), with
      SPRIND, the European Innovation Council (EIC) Fund, and returning lead Prime Movers Lab
      participating alongside investors from Germany, Europe, Asia, and the Gulf region, including
      prospective energy buyers. The BusinessWire press release states the round was oversubscribed.
      The company has not disclosed a post-money valuation. The Series A announcement claims it makes
      Focused Energy the most valuable fusion company in Europe. No debt, convertible notes, project
      finance, or credit facilities have been publicly announced.

      Hesse state vehicles HessenFonds Beteiligungen and Hessen Kapital (managed by BMH) contributed
      to the broader financing ecosystem. The German government has placed fusion on its national
      High-Tech Agenda and included it in the coalition agreement, providing a policy tailwind for
      future public co-financing.
    claimRefs: [CO019, CO020, CO021, CO022, CO023, CO024, CO025, CO026, CO027, CO028, CO029, CO030]
    tableRefs: [TO003]
    figureRefs: [FO003]

  - id: milestones-and-roadmap
    title: "Technology Milestones and Commercialization Roadmap"
    body: >
      Focused Energy has advanced from a TU Darmstadt academic spinout to the world's leading laser
      fusion company (by its own characterization and by funding scale) in four years, driven by a
      disciplined technical roadmap that builds directly on the NIF ignition heritage.

      The company's founding in 2021 coincided with rapid progress toward the NIF's December 2022
      historic ignition — and the subsequent arrival of NIF scientists Debbie Callahan and Pravesh
      Patel on the Focused Energy team confirmed that the scientific community views the ignition
      milestone as a genuine inflection point. The commercial challenge, as both the company and
      independent analysts acknowledge, is to scale from the NIF's ~400 shots per year to 10 shots
      per second (864,000 shots per day) at industrial reliability — representing a transition from
      laboratory precision to manufacturing-line economics.

      Key technical sub-programs include: (1) target fabrication at scale — simplifying the NIF's
      complex hohlraum-based indirect-drive target to a simpler direct-drive pellet manufacturable at
      high volume; (2) laser system engineering — transforming laser systems produced like satellites
      (manually, one at a time) into systems produced like cars with a supply chain; and (3) facility
      integration — repurposing the Biblis nuclear plant infrastructure for fusion.

      The March 2025 MoU with RWE and the Hesse state government was a major institutional milestone,
      formally committing the parties to build a demonstration plant (Lighthouse) and eventually a
      power plant at Biblis by 2035. A feasibility study titled "From Fission to Fusion" was
      commissioned to validate the site's potential. Construction work to adapt an existing Biblis
      building was underway as of December 2025.

      In March 2026, Focused Energy announced a $6.9 million industrial-sponsored research
      collaboration with the University of Rochester's Laboratory for Laser Energetics (LLE) — the
      largest single industry-sponsored research agreement LLE has received — to address fundamental
      inertial fusion energy challenges. In April 2026, CEO Thomas Forner co-signed an open letter to
      the European Commission calling for an ambitious EU fusion strategy.

      The company's public technology roadmap targets: Seed (2023), First Laser at Biblis (2028),
      First Light in Diagnostics Chamber (2031), Implosion (2033), Pilot Plant (2035), First Grid
      MWh (2037).
    claimRefs: [CO031, CO032, CO033, CO034, CO035, CO036, CO037, CO038]
