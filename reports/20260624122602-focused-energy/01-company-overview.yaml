  - id: adverse-signals
    title: "Adverse Signals and Critical Perspectives"
    body: >
      Focused Energy's commercialization ambitions face substantial technical and timeline skepticism
      from independent experts in the fusion field.

      The core engineering gap between NIF ignition and commercial operation is substantial. The NIF
      achieved net energy gain measured against the energy delivered to the target, not against the
      total wall-plug energy consumed by its laser system — which is orders of magnitude larger. A
      commercial reactor must achieve gain measured against total system input (wall-plug efficiency),
      requiring both far more efficient lasers and higher-yield fuel targets than the NIF demonstrated.
      The Next Web noted this distinction explicitly and described it as "the $500 million question."
      No fusion experiment has yet demonstrated wall-plug net gain.

      The repetition-rate challenge is severe: the NIF fires approximately 400 shots per year (roughly
      once per day at best); Focused Energy targets 10 shots per second for commercial operation.
      This represents a step-change of approximately 3 million times and requires solving debris
      management (each shot destroys the target), target injection with sub-millimeter precision at
      industrial speed, and laser cooling and recharge on sub-second timescales — none of which has
      been demonstrated experimentally as of the run date. Independent technical commentary (collected
      via web research) notes that "no one has ever operated a high-energy laser at this repetition
      rate."

      Direct-drive laser fusion — though more energy-efficient in theory — requires extreme uniformity
      of laser illumination and pellet positioning precision. The NIF chose indirect drive precisely
      because of direct drive's sensitivity to asymmetries and laser-plasma instabilities. Focused
      Energy's technology simplification claim (removing the hohlraum) has not been experimentally
      validated at net-gain conditions.

      Competitive pressure is intensifying: Inertia Enterprises closed a $450 million Series A in
      February 2026 targeting its own inertial confinement reactor, representing direct competition
      at a larger capital deployment. Marvel Fusion, also German, and Xcimer Energy and Pacific Fusion
      in the U.S. are pursuing overlapping inertial confinement approaches.

      The pilot plant cost estimate is large and uncertain: Fusion Energy Insights cites €5-7 billion,
      while the German Wikipedia article references ~€10 billion — a two-fold range that signals high
      cost uncertainty before the detailed engineering study is complete.
    claimRefs: [CO039, CO040, CO041, CO042, CO043, CO044]

