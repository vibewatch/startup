  - CU004
  - CU005
  - CU016
- id: S-U-named-partners
  title: Named Partners and Investment-Aligned Buyers
  body: >-
    The strongest named customer-adjacent relationship is RWE, which invested at seed stage and
    led the €60 million tranche of the $240 million Series A in May 2026. RWE provides access to
    the Biblis nuclear site, its grid-engineering expertise, and implicit endorsement as one of
    Europe's largest utility operators. The State of Hessen and Focused Energy signed a memorandum
    of understanding in March 2025 to establish Germany's first fusion power plant at Biblis,
    providing political legitimacy and site facilitation at the Hessian administrative level. SPRIND
    and the EIC Fund provide government-backed innovation mandates that validate FE's importance to
    Germany and the EU. The US Department of Energy enrolled Focused Energy in the Milestone-Based
    Fusion Development Programme, with two milestones completed in November 2024. The University of
    Rochester / LLE partnership — valued at $6.9 million and signed in March 2026 — is the most
    recent formal commitment, establishing a three-year research collaboration intended to bridge
    fusion science and commercial power engineering. Gulf and Asian investors who participated in the
    Series A are described by the CEO as potential future buyers, though their identities and specific
    commercial interests have not been publicly disclosed. None of these relationships constitutes a
    commercial energy purchase agreement; all are investment, grant, site-partnership, or
    research arrangements.
  tableRefs:
