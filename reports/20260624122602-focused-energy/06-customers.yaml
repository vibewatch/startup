callouts:
- calloutType: strength
  title: RWE's repeat investment is the strongest commercial proof-point in European fusion
  body: >-
    RWE's participation across two funding rounds over approximately four years — anchoring the
    $240 million Series A at €60 million — is the strongest single customer-proxy signal in the
    European fusion landscape. It provides site access at Biblis, grid-engineering domain knowledge,
    and a credible pathway to a future offtake discussion with a utility that operates coal, gas, and
    renewable capacity at scale. No other private European fusion company has an equivalent
    relationship with an operating utility.
  claimRefs:
  - CU006
  - CU025
  - CU037
- calloutType: risk
  title: All current relationships are investment, MoU, or programme partnerships — not commercial energy contracts
  body: >-
    Despite raising the largest European private fusion Series A on record, Focused Energy has
    no signed power purchase agreement, no commercial energy sale, and no publicly binding offtake
    commitment. RWE, Land Hessen, SPRIND, and the DOE are investors, site partners, and government
    validators — not paying energy customers. The path from these relationships to commercial revenue
    requires a working FPP, a decade of additional development, and a successful licensing process
    under German radiation protection law.
  claimRefs:
  - CU001
  - CU004
  - CU022
- calloutType: insight
  title: SourceLight spinoff creates a near-term commercial revenue opportunity
  body: >-
    The June 2026 announcement of the SourceLight spinoff, commercialising laser-driven radiation
    source technology for industrial inspection, creates a parallel revenue pathway independent of
    the fusion timeline. The first SourceLight prototype is reported to be in development at Biblis.
    If successful, SourceLight revenue could sustain investor confidence and cash flow during the
    2026–2035 period before FPP demonstration. However, no SourceLight customer has been publicly
    disclosed, and the LDRS market is competitive and technically demanding.
  claimRefs:
  - CU020
