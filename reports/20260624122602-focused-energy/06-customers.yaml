  - CU027
  - CU028
  - CU029
- id: S-U-expansion-concentration
  title: Expansion Vectors, Concentration Risk, and Go-to-Market Gaps
  body: >-
    Focused Energy's commercial concentration risk is material. Germany — specifically Hessen and
    RWE's Biblis site — is the sole named commercial location; there is no second named site, no
    second utility partner, and no international off-take anchor outside the undisclosed Gulf and
    Asian investors. If Biblis encounters regulatory or construction delays, no near-term alternative
    site is publicly identified. The Gulf and Asian investors represent the most credible path to
    geographic diversification, but their investment is pre-commercial and no MoU or letter of intent
    confirms offtake intent. UKAEA has expressed informal interest according to a CEO quote in NEI,
    but no formal collaboration agreement has been announced. The CEO's open letter to the European
    Commission signals intent to make Brussels a policy lever for EU-wide market access, but this is
    an advocacy action rather than a commercial commitment. Expansion into industrial heat markets or
    hyperscaler data-centre power is theoretically possible given fusion's high-quality thermal output,
    but no public customer pipeline exists as of June 2026. SourceLight's industrial inspection revenue,
    if it materialises in 2026–27, would reduce concentration in the fusion programme but does not
    directly address the power-customer gap. The strongest near-term expansion path is a second utility
    MoU in Germany or a neighbouring European market, leveraging the Germany Fusion Action Plan
    regulatory tailwinds and the European Commission policy dialogue.
