  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: Gulf and Asian investor identities and offtake intent
    missingEvidence: The identity, country, and commercial intent of Gulf and Asian Series A investors described as potential energy buyers have not been publicly disclosed. No MoU, LOI, or term sheet with any Gulf or Asian party has been released.
    whyItMatters: If these investors are genuine offtake prospects rather than purely financial, they represent the most significant near-term customer pipeline outside Germany and Europe. Inability to verify identity prevents qualification as commercial leads.
    diligencePath: Request investor names and any signed MoU, expression of interest, or capacity reservation from Gulf/Asian parties; request management explanation of how these relationships will convert to offtake discussions.
    relatedQuestionRefs:
    - QU012
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: Land of Hessen MoU binding terms
    missingEvidence: The text of the March 2025 MoU between Focused Energy and the Land of Hessen has not been publicly released. It is unclear whether the MoU includes any binding financial commitment, capacity reservation, or commercial energy procurement terms.
    whyItMatters: If the MoU is purely non-binding, it provides political legitimacy but no commercial durability; a binding site commitment or government offtake obligation would be materially more valuable.
    diligencePath: Request full MoU text from company; seek Hessian government public affairs filings for any published terms.
    relatedQuestionRefs:
    - QU017
  - type: missing-source
    severity: material
    topic: Pathway from programme participation to commercial energy sale
    missingEvidence: No public document, investor presentation, or commercial roadmap describes the specific steps by which Focused Energy's current government programme memberships and strategic investment relationships will be converted into binding commercial energy contracts.
    whyItMatters: The absence of a public commercial pathway creates uncertainty about whether the company's go-to-market strategy is sufficiently developed; investors and offtake partners may require a defined conversion mechanism.
    diligencePath: Request commercial roadmap, business development milestones, and offtake conversion strategy from management; request any board-approved commercial plan.
    relatedQuestionRefs:
    - QU024
  - type: missing-source
    severity: informational
    topic: Industrial heat and process-heat customer interest
    missingEvidence: No public statement from any industrial process-heat user (steel, chemical, cement, or similar) has been identified expressing interest in procuring high-temperature thermal output from Focused Energy's fusion plant.
    whyItMatters: Industrial heat is a large addressable market that could provide offtake at lower technical maturity than grid-connected power; absence of any disclosed interest limits understanding of near-term commercial optionality.
    diligencePath: Conduct targeted outreach to large German industrial heat users; monitor FE news releases for any industrial customer announcements.
    relatedQuestionRefs:
    - QU027
