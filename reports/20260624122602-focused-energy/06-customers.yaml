company:
  name: Focused Energy
chapter:
  number: 6
  title: Customers
  summary: >-
    Focused Energy's customer record as of June 2026 is entirely pre-commercial: no power purchase
    agreement, no commercial energy contract, and no paying energy buyer exists. The strongest
    proof-points are RWE's repeated equity investment anchoring the Biblis site, the Land of Hessen
    MoU for Germany's first FPP, SPRIND and EIC Fund backing, and the $6.9 million LLE research
    collaboration. Gulf and Asian investors described as potential buyers are unnamed and unverifiable
    as commercial leads. SourceLight, the June 2026 LDRS spinoff, is the nearest-term commercial
    revenue vehicle. All retention metrics are non-applicable at the pre-revenue stage.
sections:
- id: S-U-customer-landscape
  title: Customer Landscape and Buyer Segmentation
  body: >-
    Focused Energy operates in a pre-commercial phase where no commercial energy buyer has yet
    signed a power purchase agreement or offtake contract. Customer relationships fall into four
    primary categories: sovereign governments and public innovation funders — Germany's SPRIND,
    the European Innovation Council, and the US Department of Energy — who validate the technology
    and provide non-dilutive capital; strategic industrial investors with potential future offtake
    interest, principally RWE, a European utility operator and Biblis site partner; international
    investor-buyers from the Gulf and Asian markets described by CEO Thomas Forner as potential
    buyers of fusion energy; and research programme partners such as the University of Rochester's
    Laboratory for Laser Energetics and EU-funded consortia who co-develop the technology base
    without commercial energy purchase intent. No hyperscaler or data-centre customer has publicly
    expressed acquisition interest, and no industrial process-heat buyer has been publicly identified.
    Germany and Europe are the clear near-term geographic focus, driven by the Biblis site, RWE's
    involvement, Germany's October 2025 Fusion Action Plan, and the European Commission policy
    dialogue initiated through Focused Energy's open letter. Buyer segmentation spans sovereign,
    industrial, research, and emerging-market geographies, with commercial offtake as a 2035-plus
    horizon objective.
  tableRefs:
  - TU001
  figureRefs:
  - FU001
  claimRefs:
  - CU001
