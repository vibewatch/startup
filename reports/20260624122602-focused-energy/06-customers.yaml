- id: S-U-adoption-trajectory
  title: Adoption Readiness and Commercial Trajectory
  body: >-
    Adoption trajectory metrics are constrained by Focused Energy's pre-commercial status. The
    company has raised approximately $300 million in private capital and $200 million in grants,
    making it the most highly capitalised private fusion company in Europe according to Clean Energy
    Wire. The fundamental commercial clock is tied to the Biblis FPP timeline — Forner targets a
    prototype fusion pilot plant by 2035–36, at which point the first energy delivery to an offtake
    partner could theoretically begin. Between now and 2035, market development will consist of
    securing additional MoUs, maintaining government programme eligibility, and pre-qualifying
    technology with potential utility buyers. The FIA 2025 Global Fusion Industry Report confirms
    that no private fusion company has yet delivered commercial power to a grid customer; Focused
    Energy is not exceptional in this regard but is among the best-capitalised ventures globally.
    SourceLight, the X-ray and neutron inspection technology spinoff announced in June 2026,
    represents the first near-term pathway to commercial revenue from Focused Energy's LDRS
    technology platform. A first SourceLight prototype is reported to be in development at Biblis.
    The $6.9 million LLE collaboration, the largest in LLE's history for a commercial partnership,
    is the strongest recent signal of institutional confidence in the commercial direction of the
    programme. Gulf and Asian investors, described as potential energy buyers, represent early
    commercial market seeding, but no terms or MoUs have been disclosed.
  tableRefs:
  - TU002
  figureRefs:
  - FU002
