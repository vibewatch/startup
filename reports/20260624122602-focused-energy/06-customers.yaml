- id: S-U-retention-durability
  title: Retention, Durability, and Partner Continuity
  body: >-
    Since Focused Energy is pre-revenue, standard retention metrics — net revenue retention,
    gross revenue retention, and churn rate — are non-applicable. The relevant proxy is strategic
    relationship continuity: the persistence of investment, programme, and site partnerships across
    funding rounds and milestones. RWE has continued its partnership through two investment rounds
    over approximately four years, expanding rather than exiting its position in the Series A. SPRIND's
    relationship has been sustained through the company's growth from seed to Series A and is ongoing.
    The DOE milestone programme remains active after two successful technical deliverables. The LLE
    research collaboration is newly signed in March 2026 with a defined three-year term. From a
    cohort perspective, early institutional supporters have not churned; the 2026 Series A represents
    an expansion of the founding investor base rather than a replacement. No satisfaction surveys, NPS
    scores, or binding renewal commitments are publicly available. All retention signals are
    non-commercial and are subject to change if the FPP timeline slips materially, if government
    programme funding ends, or if a competing fusion approach reaches the engineering phase first.
    The primary retention risk is timeline slippage: any delay beyond 2035–36 at Biblis would
    test the durability of strategic partner commitments made years earlier.
  tableRefs:
  - TU004
  figureRefs:
  - FU004
  claimRefs:
