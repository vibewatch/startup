chapter:
  number: 3
  title: Competitors
  summary: >
    Focused Energy competes in a narrow ICF peer group (Xcimer, Pacific Fusion, Marvel
    Fusion, Inertia Enterprises) sharing the same laser-compression physics, and a broader
    fusion industry where tokamak and FRC leaders (CFS, Helion) hold multi-billion-dollar
    capital advantages and earlier projected timelines. A third ring encompasses substitutes
    — solar, wind, gas, SMRs, and grid storage — that will shape offtake economics long
    before any fusion plant operates. Focused Energy's direct-drive laser ICF removes the
    hohlraum efficiency penalty of indirect-drive systems; its Biblis brownfield siting in
    Germany provides a regulatory, infrastructure, and political moat no US-only ICF peer
    can replicate. The adverse case centres on capital: Focused Energy's $240M Series A
    appears thin against the $1B–$3B+ held by CFS, Helion, and Pacific Fusion, and Inertia
    Enterprises ($450M Series A, February 2026) directly targets the same NIF-heritage
    direct-drive knowledge base with more capital and US government R&D access.

sections:
- id: landscape-and-direct-peers
  title: Landscape — Direct ICF Peers and Alternate Fusion Approaches
  body: >
    The global fusion industry counted 43 private companies as of the FIA's 2025 report,
    but the ICF subgroup directly relevant to Focused Energy is under a dozen. Direct peers
    share the same laser-compression physics; their divergence lies in driver technology,
    target geometry, and capital scale. Xcimer Energy (San Diego, 2022) chose KrF excimer
    UV lasers, raising $100M in June 2024, to exploit the shorter-wavelength coupling
    efficiency demonstrated at NIF. Pacific Fusion (Livermore, 2021) pursues pulsed
    magnetic ICF — electromagnetic compression rather than direct laser ablation — and
    secured $900M+ in committed milestone-gated Series A capital; it opened a New Mexico
    demonstration campus and targets net facility energy gain in 2030. Marvel Fusion
    (Munich/Denver, 2019) uses CO-based ultrafast laser pulses and partnered with Colorado
    State University for high-power laser R&D. Inertia Enterprises (Livermore, 2025) is
    the most recent and best-capitalised ICF entrant: a direct LLNL spinoff that raised
    $450M in February 2026 and immediately signed an R&D partnership with LLNL,
    effectively commercialising the NIF programme's direct-ICF knowledge base. Outside
    ICF, CFS (Cambridge MA, $3B+ total) is assembling SPARC's HTS tokamak, Helion
    (Everett WA, $1B+ total) started building its Orion FRC machine in July 2025, TAE
    Technologies (Foothill Ranch CA, $1.2B+) targets aneutronic hydrogen-boron FRC, and
    General Fusion (Vancouver, $400M+) filed to become public via SPAC in 2026.
    Focused Energy's direct-drive laser ICF eliminates the hohlraum X-ray conversion step
    used at NIF, targeting higher driver-to-target coupling efficiency, and its Biblis
    brownfield strategy creates a European-first moat no current US peer has matched.
