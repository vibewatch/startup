callouts:
- calloutType: risk
  title: Capital adequacy is the primary competitive risk
  body: >
    Focused Energy's $240M Series A is the largest single fusion Series A globally
    but represents a 12× capital shortfall relative to CFS ($3B+ cumulative) and 4×
    below Helion ($1B+). If ICF demonstration requires $500M–$1B — a common industry
    estimate — Focused Energy will likely need a substantial Series B before Lighthouse
    completion, increasing dilution and execution risk in a competitive fundraising
    environment where CFS, Helion, and Pacific Fusion also continue to raise.
  claimRefs:
  - CP038
  - CP040

- calloutType: insight
  title: RWE and Biblis create a European moat no US ICF peer can replicate
  body: >
    Focused Energy's Biblis siting and RWE lead investment are structural, not
    transactional. RWE co-invests because Biblis is its asset; EIC and SPRIND co-invest
    because a European fusion champion is a strategic EU priority. No current US ICF
    peer — Xcimer, Pacific Fusion, or Inertia — has established equivalent EU presence,
    utility anchor, or public co-investment channel. Marvel Fusion is the only comparable
    German-based ICF company but lacks a utility anchor and has less capital.
  claimRefs:
  - CP012
  - CP013
  - CP035

