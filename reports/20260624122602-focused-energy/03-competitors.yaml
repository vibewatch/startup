- id: adverse-evidence-and-risk
  title: Adverse Evidence — Timeline Credibility and Competitive Risks
  body: >
    The strongest adverse cases against Focused Energy's competitive position are capital
    adequacy and timeline credibility. CFS has raised 12× more cumulative capital ($3B+
    vs. $240M), Helion 4× more, Pacific Fusion 3.75× more in committed capital. If ICF
    demonstration requires $500M–$1B — a common analyst estimate — Focused Energy may
    need a substantial Series B before demonstration, with potential dilution and delay.
    Inertia Enterprises' $450M February 2026 raise directly targets the LLNL direct-ICF
    knowledge base that Focused Energy also claims, creates a US-government-adjacent
    competitor with more capital and a three-month head start in 2026 fundraising. Xcimer
    Energy ($100M, different KrF driver) occupies a comparable but distinct niche. Timeline
    credibility is a sector-wide concern: no fusion company has delivered commercial
    electricity to the grid. Multiple demonstrations have slipped — General Fusion's LM26
    timeline has stretched from the early 2020s to the late 2020s, and Helion's 2028
    Microsoft PPA deadline is viewed by some analysts as aspirational given the gap between
    Polaris milestones and commercial net-energy delivery. Focused Energy's own 2037 target
    requires demonstration success in ~10 years, which exceeds the historical average for
    nuclear facility construction from ground-breaking to commercial operation. General
    Fusion's SPAC filing in 2026 — typically a capital-of-last-resort strategy in deep-tech
    — may signal that the broader fusion market cannot absorb the capital requirements of
    all concurrent demonstration programmes simultaneously.
