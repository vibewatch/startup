- id: competitor-profiles-and-capital
  title: Competitor Profiles — Scale, Funding, Partners, and Commercial Proof
  body: >
    The capital split is stark. CFS leads the private fusion field with $3B+ cumulative
    funding, its $863M Series B2 closed in December 2022, SPARC assembly is underway with
    18 HTS magnets, and a $1B+ PPA from Italian utility Eni positions the ARC commercial
    plant (Chesterfield County VA, 400 MW) for early-2030s grid delivery. Helion has
    raised $1B+ total including a $425M Series F; it confirmed 150 million degree plasma
    temperature in Polaris in 2023, signed the world's first fusion PPA (Microsoft, 50 MW,
    target 2028), agreed a 500 MW industrial PPA with Nucor for steel production, and
    began constructing the Orion commercial machine in Malaga, Washington, in July 2025.
    Pacific Fusion's $900M+ committed capital is milestone-gated; a Sandia collaboration
    demonstrated compressed-target physics relevant to its pulsed magnetic driver. Inertia
    Enterprises' $450M February 2026 raise is the second-largest single-round ICF
    commitment globally; its LLNL R&D partnership gives it privileged access to the same
    direct-ICF dataset that Focused Energy's co-founders helped build. Xcimer ($100M) is
    comparable to Focused Energy in capital scale but focused on a different KrF driver.
    Marvel Fusion (~$150M estimated) is at an earlier stage. Sacra estimates CFS pre-SPARC
    revenue at below $10M; the entire ICF and non-CFS fusion field is pre-revenue,
    competing on investor and government commitment rather than commercial traction.
    Focused Energy's $240M is the largest single Series A in fusion history but the
    smallest cumulative total among the five best-capitalised programmes.
