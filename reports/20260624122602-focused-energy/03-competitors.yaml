  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Focused Energy patent portfolio and IP moat
    missingEvidence: No public patent filings related to Focused Energy's direct-drive laser ICF approach or Biblis engineering have been identified; the IP moat claim vs. Xcimer and Inertia cannot be verified.
    whyItMatters: IP moat is the primary durable technical advantage cited by management; if Xcimer or Inertia holds overlapping patents, the direct-drive ICF differentiation claim is weakened.
    diligencePath: USPTO/EPO patent search for Focused Energy GmbH, Thomas Forner, Markus Roth, and National Energetics lineage; cross-reference Xcimer and Inertia patent filings post-2021.
    relatedQuestionRefs:
    - QP013
    relatedTableRefs:
    - TP004

  - type: private-evidence-only
    severity: material
    topic: Fusion pricing and tariff disclosures
    missingEvidence: No fusion company has disclosed a commercial tariff, plant-level LCOE, or signed PPA price; buyer economics cannot be benchmarked against gas, storage, or SMR substitutes.
    whyItMatters: Without pricing evidence the competitive position of fusion vs. substitutes relies entirely on projections and analogies; the pricing comparison table uses estimated ranges only.
    diligencePath: Request plant-economics models, draft term sheets, or redacted customer pricing decks from FE management and compare against gas CCGT, SMR, and solar LCOE benchmarks.
    relatedQuestionRefs:
    - QP014
    - QP035
    relatedTableRefs:
    - TP003

  - type: private-evidence-only
    severity: minor
    topic: Xcimer and Marvel Fusion technical progress post-Series A
    missingEvidence: Neither Xcimer nor Marvel Fusion has published peer-reviewed results, milestone announcements, or employee count updates since their respective Series A fundraises; their technical maturity relative to Focused Energy cannot be assessed from public sources.
    whyItMatters: Competitive distance between FE and its two direct laser-ICF peers (Xcimer and Marvel Fusion) may be smaller or larger than the capital gap suggests.
    diligencePath: Review IEEE/APS conference proceedings for Xcimer and Marvel Fusion technical contributions; request unpublished milestone updates directly from management.
    relatedQuestionRefs:
    - QP012
    relatedTableRefs:
    - TP001

