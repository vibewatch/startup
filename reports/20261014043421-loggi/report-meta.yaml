  topStrengths:
    - National parcel network with 4,000+ municipality reach and 1,700+ pickup points
    - Large registered courier base and asset-light contractor model that support operating flexibility
    - Meaningful enterprise adoption across major Brazilian merchants and marketplaces
  topRisks:
    - Labor reclassification and regulatory risk remain structurally material
    - Audited financials, secondary pricing, and cash-runway visibility are still opaque
    - Customer concentration and marketplace insourcing pressure could compress volume and margins
  unresolvedGaps:
