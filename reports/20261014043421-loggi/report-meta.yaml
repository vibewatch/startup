companyProfile:
  summary: >-
    Loggi is a Brazilian logistics platform that combines merchant software, nationwide parcel delivery, and a physical
    pickup/drop-off network to move packages across the country. The company evolved from urban courier dispatch into a
    broader last-mile and sortation network serving SMBs, e-commerce merchants, and enterprise retail accounts.
  foundedDate: '2013-10-01'
  founders:
    - name: Fabien Mendez
      role: Co-founder & former CEO
      background: French-Brazilian entrepreneur with finance experience who helped launch Loggi in 2013.
    - name: Arthur Debert
      role: Co-founder
      background: Software engineer and technologist who helped build Loggi's platform architecture.
    - name: Eduardo Wexler
      role: Co-founder
      background: Product designer and early founding member of Loggi.
  foundingLocation: São Paulo, Brazil
  headquarters: São Paulo, Brazil
  productSummary: >-
    Merchant APIs, shipping-label and tracking workflows, last-mile parcel delivery, and pickup/drop-off logistics
    across Brazil.
  customerFocus: Brazilian e-commerce merchants, SMB shippers, and enterprise retail accounts
  businessModel: Shipping fees, logistics service charges, and enterprise delivery contracts
  stage: late-stage private
