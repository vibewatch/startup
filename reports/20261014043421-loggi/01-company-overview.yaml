chapter:
  number: 1
  title: "Company Overview"
  summary: "Founded in 2013 in São Paulo, Loggi has raised US$ 486 million in equity financing to transform Brazilian logistics from on-demand urban couriers into a nationwide e-commerce parcel delivery network reaching over 4,000 municipalities."
sections:
  - id: "corporate-identity-and-mission"
    title: "Corporate Identity, Mission, and Platform Architecture"
    body: "Loggi operates as a technology-enabled logistics infrastructure company founded in São Paulo, Brazil, in 2013. The company initially built an urban on-demand dispatch platform that matched corporate shippers and restaurants with motorcycle couriers across Greater São Paulo. Over its operating lifecycle, Loggi expanded beyond intra-city express courier services to construct a comprehensive national logistics network serving small businesses, direct-to-consumer retailers, and large enterprise marketplaces. Its core technology platform integrates automated dispatch algorithms, mobile application workflows, and ERP shipping integrations, allowing commercial shippers to automate parcel labeling, tracking, and route scheduling throughout Brazil."
    claimRefs:
      - "CO001"
      - "CO011"
      - "CO012"
    tableRefs:
      - "TO001"
  - id: "founding-leadership-and-governance"
    title: "Founding Team, Executive Governance, and Key-Person Structure"
    body: "Loggi was established by a cross-functional founding team comprising software engineer Arthur Debert, product designer Eduardo Wexler, and French-Brazilian entrepreneur Fabien Mendez. The founders combined technical software engineering and operational business analysis to digitize Brazil's traditionally fragmented and informal urban courier ecosystem. Executive leadership oversees platform operations, crossdock facilities, and corporate governance from São Paulo. A material leadership dimension involves regulatory compliance and public policy navigation, directed by Vanessa Isidoro, who spearheaded the company's labor litigation defense and municipal regulatory partnerships. Key-person reliance remains concentrated in early technical architects and legal strategists managing national contractor relations."
    claimRefs:
      - "CO002"
      - "CO003"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-investor-syndicate"
    title: "Capitalization History, Valuation Trajectory, and Investor Syndicate"
    body: "Loggi has raised approximately US$ 486 million across six primary equity financing rounds since its initial 2013 angel capitalization. Early backing from Qualcomm Ventures and Dragoneer Investment Group validated the company's mobile dispatch software model. In October 2018, SoftBank Vision Fund entered as lead sponsor with a US$ 100 million commitment, subsequently leading a US$ 150 million Series C round in June 2019 that elevated Loggi to unicorn status at a US$ 1.0 billion post-money valuation. In February 2021, Capsur Capital led a US$ 205 million Series D round that established an estimated US$ 2.0 billion private valuation anchor, supported by Microsoft, Verde Asset Management, Monashees, and Advent International."
    claimRefs:
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO013"
      - "CO014"
    tableRefs:
      - "TO003"
  - id: "operational-evolution-and-milestones"
    title: "Operational Milestones, Labor Precedents, and Network Expansion"
    body: "Loggi's operational trajectory demonstrates an adaptive evolution from urban same-day motorbike courier dispatch toward nationwide parcel sortation. During the COVID-19 pandemic, as office document deliveries declined, the company pivoted substantial network capacity toward national e-commerce parcel shipping in partnership with major merchants. Crucially, Loggi secured a landmark labor court victory in 2021 affirming that its registered delivery cyclists and drivers operate as independent contractors rather than formal employees, mitigating a major existential risk under Brazilian labor laws. The current physical network encompasses over 1,700 LoggiPonto drop-off locations, more than 200,000 registered partner couriers, and delivery capability across 4,000 Brazilian municipalities."
    claimRefs:
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO015"
    figureRefs:
      - "FO001"
