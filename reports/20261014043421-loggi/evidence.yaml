evidenceGaps:
  - type: missing-source
    severity: material
    topic: audited-financials-and-secondary-valuation
    missingEvidence: >-
      Audited financial statements confirming net revenue, operating cash flow, EBITDA, and verified secondary market
      trade prices post-2021.
    whyItMatters: >-
      Without reconciled financial reporting or recent secondary clearing data, Loggi's historical US$ 2.0B valuation
      anchor from 2021 cannot be verified against current commercial fundamentals.
    diligencePath: >-
      Request confidential management financial package, recent cap table summary, and 409A or equivalent independent
      valuation reports.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: complete-board-and-shareholder-ownership
    missingEvidence: >-
      Complete cap table detailing post-Series D equity ownership percentages, liquidation preferences, and current
      board of directors seats.
    whyItMatters: >-
      Public records disclose major institutional investors but omit exact equity stakes, voting control thresholds, and
      minority investor veto rights.
    diligencePath: >-
      Review commercial registry filings (JUCESP) and investor rights agreements during formal confirmatory legal
      diligence.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing-diligence
    missingEvidence: >-
      Audited third-party census data detailing Brazilian parcel delivery volumes and segment revenues across tier-2 and
      tier-3 municipalities.
    whyItMatters: >-
      Without segmented regional shipment volumes, TAM and SAM sizing must rely on top-down macroeconomic GDP
      expenditure ratios and private carrier disclosures.
    diligencePath: >-
      Obtain ANTT regulatory freight filings, Ebit/Nielsen e-commerce census reports, or audited logistics provider
      disclosures under NDA.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: marketplace-insourcing-risk
    missingEvidence: >-
      Granular breakdown of Loggi's shipment volume split between captive enterprise marketplaces (Mercado Libre,
      Amazon) versus independent SMB merchants, and realized contractual take-rates under competitive bidding.
    whyItMatters: >-
      If captive logistics investments by Mercado Envios and Amazon absorb the highest-density urban parcel routes,
      Loggi faces volume concentration risks and margin pressure on peripheral routes.
    diligencePath: >-
      Request customer cohort retention and lane-level gross margin data split by marketplace contracts versus direct
      e-commerce merchants in management diligence.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: financial-disclosure-gaps
    missingEvidence: >-
      Audited income statements, balance sheets, and cash flow statements detailing net revenue, gross margin, operating
      EBITDA, and monthly cash burn rate.
    whyItMatters: >-
      Public data is limited to round sizes and headline delivery volumes, making it impossible to independently verify
      unit economics, contribution margins, or forward runway without private disclosures.
    diligencePath: >-
      Request audited financial statements from FY2023 through 1H2026 and management accounts showing monthly burn and
      cash balances under NDA.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: stale
    severity: material
    topic: valuation-and-cap-table
    missingEvidence: >-
      Updated secondary clearing prices, current 409A valuation, share classes, liquidation preferences, and debt
      facilities post-2021.
    whyItMatters: >-
      The headline ~US$2B valuation anchor dates to the early 2021 Series F and does not reflect subsequent Latin
      American venture repricing, tech sector valuation compression, or workforce contractions.
    diligencePath: >-
      Review the latest fully diluted capitalization table, investor rights agreements, and any secondary liquidity
      transactions conducted on private platforms.
    relatedQuestionRefs:
      - QI008
  - type: private-evidence-only
    severity: material
    topic: proprietary-algorithm-verification
    missingEvidence: >-
      Audited performance benchmarks and latency specifications for Loggi's proprietary dispatch and route calculation
      algorithms.
    whyItMatters: >-
      Verifying whether Loggi's technology delivers measurable route efficiency over standard mapping software is
      essential for technical underwriting.
    diligencePath: >-
      Request engineering architecture documentation, dispatch latency metrics, and algorithmic optimization benchmarks
      during technical diligence.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: minor
    topic: cybersecurity-certifications
    missingEvidence: >-
      Third-party security and data protection audit reports (such as SOC 2 Type II or ISO 27001) evaluating Loggi's
      merchant data handling.
    whyItMatters: >-
      Enterprise retail partners require certified security assurances before routing mission-critical order and
      recipient data through third-party APIs.
    diligencePath: Request SOC compliance audit reports and LGPD data privacy documentation from Loggi's security compliance team.
  - type: private-evidence-only
    severity: material
    topic: customer-retention-concentration
    missingEvidence: >-
      Audited cohort retention data, Net Revenue Retention (NRR), Gross Revenue Retention (GRR), and revenue
      concentration metrics for top e-commerce marketplace accounts.
    whyItMatters: >-
      Without disclosure of customer cohort retention or concentration among broadline marketplaces like Mercado Livre
      and Amazon, underwriting the durability and pricing power of Loggi's customer base remains speculative.
    diligencePath: >-
      Request confidential management accounts breaking down revenue by customer cohort, top-10 customer concentration
      percentages, and multi-year churn rates across enterprise and SMB shipper tiers.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof-table
    missingEvidence: >-
      Comprehensive census of enterprise customer contracts, SLA performance metrics, and verified account volume tiers
      across all 25+ featured client brands.
    whyItMatters: >-
      Public customer references provide marketing proof of adoption but omit delivery share, SLA compliance rates, and
      churn risk relative to alternative logistics providers.
    diligencePath: >-
      Review customer contract schedules, SLA penalty reports, and carrier allocation shares for key enterprise accounts
      during confirmatory due diligence.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: Labor Litigation Reserves and Regulatory Risk Exposure
    missingEvidence: >-
      Detailed audited contingent liability reserves and settlement expenditure records for contractor-vs-employee labor
      lawsuits in Brazilian courts.
    whyItMatters: >-
      A reversal of independent contractor classification or massive class-action back-pay orders would severely impair
      operating margins and unit economics.
    diligencePath: >-
      Request audited legal contingent liability schedules and labor lawsuit case-by-case exposure assessments during
      confirmatory diligence.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: Marketplace Customer Concentration and Bilateral Terms
    missingEvidence: >-
      Breakdown of parcel delivery volumes and gross billings attributed to top anchor accounts (Amazon, Mercado Livre)
      versus long-tail SMB merchants.
    whyItMatters: >-
      High volume concentration in marketplace giants exposes Loggi to margin squeeze, contract termination risk, or
      in-housing of logistics by retail partners.
    diligencePath: >-
      Review top-10 customer revenue concentration metrics and bilateral master services agreements during management
      presentation.
  - type: private-evidence-only
    severity: material
    topic: financial-reporting
    missingEvidence: >-
      Audited financial statements confirming recent annual net revenue, gross margins, EBITDA, and balance-sheet cash
      reserves.
    whyItMatters: >-
      Without reconciled financial statements, revenue multiples and breakeven timelines cannot be validated against
      public peer benchmarks.
    diligencePath: Request audited financial disclosure pack and auditor review letters under non-disclosure agreement.
    relatedQuestionRefs:
      - QV009
  - type: missing-source
    severity: material
    topic: cap-table-liquidity
    missingEvidence: >-
      Fully diluted cap table schedule detailing liquidation preference seniority, participation rights, and recent
      secondary transaction clearing marks.
    whyItMatters: >-
      Later-stage preference stacks from CapSur and SoftBank could subordinate common equity or earlier preferred
      holders in an exit below US$2B.
    diligencePath: Review capitalization table, investor rights agreements, and private share transfer logs from company counsel.
    relatedQuestionRefs:
      - QV003
