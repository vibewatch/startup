  title: Customers
  summary: Loggi serves a bifurcated customer base spanning national enterprise retail accounts and regional SMB merchants across 4,000 municipalities, but lacks published retention, NRR, or cohort economics.
sections:
  - id: customer-segmentation
    title: Customer Base Segmentation & Multi-Tier Demand Structure
    body: Loggi operates a dual-tier commercial strategy serving both large enterprise e-commerce accounts and regional small-to-medium business (SMB) merchants across Brazil. In the enterprise tier, the company caters to broadline marketplaces, department store chains, and specialized national retailers that require reliable, nationwide package transportation and high-throughput peak volume management. Key corporate clients include global beauty giants such as Sephora, luxury jewelry brands like Pandora and Vivara, home decor retailers including Tok&Stok, and high-volume apparel chains like Lojas Torra. For these enterprise shippers, Loggi acts as a strategic logistics partner that bridges fulfillment centers with end consumers, providing scheduled pick-up, automated cross-docking through central hubs like Cajamar, and last-mile urban routing. In parallel, Loggi addresses the long-tail merchant segment through its mobile and web application platform, allowing individual entrepreneurs and local businesses to dispatch parcels starting from R$5.89 using either on-demand courier collection or an accredited network of over 1,700 LoggiPonto drop-off locations. This two-sided demand architecture allows Loggi to maintain base load utilization from enterprise contracts while capturing higher-margin transactional volume from long-tail commercial shippers.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU011
    tableRefs:
      - TU001
  - id: adoption-trajectory
    title: Adoption Trajectory & Operational Throughput Scale
    body: Loggi's operational footprint has scaled substantially from its origin as an urban motorcycle courier dispatch service into a nationwide logistics-as-a-service infrastructure provider. The platform's published distribution network spans more than 4,000 municipalities across Brazil, achieving near-universal reach in the country's urban and regional e-commerce markets. Supply-side network scale is supported by more than 200,000 registered partner couriers operating across motorcycles, bicycles, and delivery vans, coordinated alongside over 1,700 physical collection points. Historical operational disclosures indicate that Loggi previously executed approximately 300,000 daily delivery rounds across 3,500 communities, scaling from earlier reported baselines of 3 million monthly deliveries across 33 core metropolitan centers. The merchant journey illustrates how commercial accounts integrate with Loggi, beginning with digital onboarding and API integration, progressing through regional parcel dispatch and automated sortation, and culminating in last-mile courier execution with real-time tracking transparency. While third-party market data platforms record an unverified $1B annual revenue benchmark for 2025, rigorous diligence must distinguish cumulative registered partner numbers and marketing coverage claims from ongoing daily active throughput and paid package density.
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU006
      - CU011
      - CU013
    tableRefs:
      - TU002
    figureRefs:
      - FU001
  - id: named-customer-evidence
    title: Named Enterprise Accounts & Production Proof
    body: Public customer disclosures and case studies demonstrate verifiable enterprise adoption across several demanding commercial verticals in Brazil. In the sports and lifestyle retail sector, athletic apparel brand Track&Field credited Loggi with supporting a 5x expansion in its online sales during the pandemic, highlighting on-time delivery execution and brand customer experience. Similarly, Grupo SBF—the operating entity behind Brazilian sports retail giant Centauro and Nike's regional commercial operations—deployed Loggi to power omnichannel fulfillment and delivery diversification across multiple retail banners. Luxury and fragile goods retailers like Sephora and Pandora rely on Loggi's last-mile handling to preserve branded unboxing experiences, citing prompt operational responsiveness during exception handling. Furthermore, during the structural shift of Brazilian retail toward digital commerce, Loggi expanded strategic fulfillment relationships with broadline marketplace leaders including Amazon and Mercado Livre. Nonetheless, public case studies typically emphasize marketing-oriented success stories while omitting essential commercial details, such as contractual service level agreements (SLAs), on-time fulfillment penalty structures, and the exact share of wallet Loggi commands relative to competitors like Correios, Jadlog, and proprietary marketplace delivery fleets.
    claimRefs:
      - CU002
      - CU007
      - CU008
      - CU009
    tableRefs:
      - TU003
  - id: retention-concentration-adverse
    title: Retention Durability, Concentration Risks & Growth Deceleration
    body: 'Despite widespread enterprise brand adoption, Loggi faces significant commercial concentration risks, margin pressure, and observable indicators of platform traction deceleration. The company''s heavy reliance on large e-commerce platforms like Amazon and Mercado Livre exposes its sorting and linehaul network to substantial customer concentration risk, particularly as marketplace operators continuously invest in proprietary in-house logistics infrastructure and captive delivery networks. Furthermore, independent market benchmark tracking from RankmyAI highlights emerging competitive friction: Loggi''s overall platform ranking declined by 17 positions over a nine-month period to August 2026, accompanied by a 49-spot drop in web traffic ranking and a 64-spot decline in investment interest ranking. Commercial sustainability is also intrinsically linked to courier labor dynamics; while Brazilian labor courts ruled that platform couriers are autonomous contractors rather than formal employees, ongoing legal scrutiny and courier retention costs represent persistent structural risks to service reliability. Critical diligence metrics including Net Revenue Retention (NRR), Gross Revenue Retention (GRR), and multi-year customer cohort churn rates remain entirely undisclosed by management, leaving the long-term durability of Loggi''s customer economics an unresolved underwriting gap.'
    claimRefs:
      - CU008
      - CU010
      - CU012
      - CU014
