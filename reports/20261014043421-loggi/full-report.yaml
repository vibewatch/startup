              - CI009
              - CI011
          - type: callout
            title: Asset-light independent contractor model moderates fixed operational burn
            body: >-
              By utilizing an independent contractor network supported by Brazilian Labor Court rulings and expanding
              1,700+ partner drop-off points, Loggi shifts a substantial portion of logistics labor into variable costs.
              However, recent headcount reductions from 4,319 to 2,732 employees indicate ongoing pressure to streamline
              corporate and sortation overhead.
            calloutType: insight
            claimRefs:
