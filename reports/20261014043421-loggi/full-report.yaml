      - number: '1.4'
        title: Operational Milestones, Labor Precedents, and Network Expansion
        blocks:
          - type: paragraph
            body: >-
              Loggi's operational trajectory demonstrates an adaptive evolution from urban same-day motorbike courier
              dispatch toward nationwide parcel sortation. During the COVID-19 pandemic, as office document deliveries
              declined, the company pivoted substantial network capacity toward national e-commerce parcel shipping in
              partnership with major merchants. Crucially, Loggi secured a landmark labor court victory in 2021
              affirming that its registered delivery cyclists and drivers operate as independent contractors rather than
              formal employees, mitigating a major existential risk under Brazilian labor laws. The current physical
              network encompasses over 1,700 LoggiPonto drop-off locations, more than 200,000 registered partner
              couriers, and delivery capability across 4,000 Brazilian municipalities.
