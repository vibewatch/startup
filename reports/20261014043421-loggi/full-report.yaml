  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and Service Definition
        blocks:
          - type: paragraph
            body: >-
              Loggi operates a technology-driven delivery platform designed to resolve urban and intercity shipping
              friction across Brazil. The company delivers three primary service categories: express local delivery
              utilizing on-demand two-wheeled and light vehicle couriers for same-day intracity fulfillment, national
              parcel distribution serving e-commerce shippers, and drop-off consolidation via designated collection
              points. In merchant workflow terms, the service abstracts courier dispatch, route calculation, and package
              tracking behind programmatic endpoints and no-code connectors. Shippers initiate deliveries by calculating
              dynamic freight quotes, generating standardized shipping labels, and submitting packages either through
              doorstep courier pickup or drop-off at accredited regional partner points. Deliveries are routed through
              Loggi's distribution mesh, where mobile telemetry and real-time package status events keep merchants and
              end recipients continuously updated throughout the transit lifecycle.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
      - number: '5.2'
        title: Merchant Integrations and Operational Workflows
        blocks:
          - type: paragraph
            body: >-
              Integration into merchant operations occurs across two primary channels: developer-facing RESTful APIs and
              pre-built no-code connectors for Brazilian e-commerce systems. Through the public developer portal at
              docs.api.loggi.com, enterprise shippers access endpoints for authentication, real-time rate quotation,
              batch package creation, address modification, and cancellation. For small and medium-sized merchants
              lacking custom engineering resources, Loggi provides integrations with major regional platforms including
              Bling, Olist, Tray, and Shopify, alongside legacy EDI file exchange formats. Once an order is ingested,
              Loggi generates tracking numbers and standard carrier labels, enabling continuous end-to-end milestone
              monitoring. When fulfillment exceptions or delivery barriers occur in the field, mobile applications allow
              drivers to communicate directly with recipients via automated SMS and email notifications, mitigating
              failed delivery attempts and operational re-delivery expenses.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
      - number: '5.3'
        title: Technology Stack and Operating Architecture
        blocks:
          - type: paragraph
            body: >-
              Loggi's underlying technology architecture marries a cloud-based software stack with physical distribution
              hubs and mobile worker telemetry. The software infrastructure leverages modern web frameworks and backend
              services, supported by public developer repositories that catalog modular tools such as banking slip
              generation and optimization solvers. Courier routing relies on smartphone GPS positioning and algorithmic
              dispatch engines that calculate transit paths and multi-stop deliveries without requiring immediate
              routing through central postal sortation centers. At the physical layer, Loggi operates sortation centers,
              including a major automated cross-docking hub in Cajamar, São Paulo, alongside an accredited network of
              over 1,700 LoggiPonto drop-off and pickup locations across Brazil. This multi-tiered hybrid model combines
              centralized sorting for intercity parcel lines with distributed courier dispatch for urban final-mile
              execution.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE005
              - CE009
              - CE010
      - number: '5.4'
        title: Technical Differentiation, Reliability, and Compliance Controls
        blocks:
          - type: paragraph
            body: >-
              Loggi's technical differentiation centers on its proprietary dispatch algorithms and dense
              physical-digital integration, enabling nationwide delivery coverage reaching over 4,000 Brazilian
              municipalities and connecting more than 200,000 registered partner couriers. From a compliance and
              governance perspective, Loggi established legal precedent when Brazil's Labor Court confirmed that
              couriers operate as autonomous independent contractors rather than formal employees, providing structural
              flexibility to the operational model. However, notable technical and operational risks persist. The
              company's algorithm performance claims regarding artificial intelligence, robotics, and automated route
              optimization remain uncorroborated by independent technical audits or published benchmarks. Furthermore,
              reliance on consumer-grade mobile devices and GPS telemetry introduces field edge cases across dense
              Brazilian urban centers, while public third-party cybersecurity certifications remain undisclosed.
            claimRefs:
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated Developer and Logistics Mesh
            body: >-
              Loggi combines open developer APIs and turnkey e-commerce connectors with a dense physical footprint of
              over 1,700 drop-off points, providing programmatic accessibility and national shipping capabilities across
              Brazilian commerce.
            calloutType: strength
            claimRefs:
              - CE001
              - CE005
          - type: callout
            title: Uncorroborated Algorithm and Infrastructure Benchmarks
            body: >-
              While Loggi emphasizes AI, robotics, and advanced route calculation, empirical evidence demonstrating
              proprietary algorithm advantages or third-party cybersecurity certifications remains unverified in public
              disclosures.
            calloutType: risk
            claimRefs:
              - CE010
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation & Multi-Tier Demand Structure
        blocks:
          - type: paragraph
            body: >-
              Loggi operates a dual-tier commercial strategy serving both large enterprise e-commerce accounts and
              regional small-to-medium business (SMB) merchants across Brazil. In the enterprise tier, the company
              caters to broadline marketplaces, department store chains, and specialized national retailers that require
              reliable, nationwide package transportation and high-throughput peak volume management. Key corporate
              clients include global beauty giants such as Sephora, luxury jewelry brands like Pandora and Vivara, home
              decor retailers including Tok&Stok, and high-volume apparel chains like Lojas Torra. For these enterprise
              shippers, Loggi acts as a strategic logistics partner that bridges fulfillment centers with end consumers,
              providing scheduled pick-up, automated cross-docking through central hubs like Cajamar, and last-mile
              urban routing. In parallel, Loggi addresses the long-tail merchant segment through its mobile and web
              application platform, allowing individual entrepreneurs and local businesses to dispatch parcels starting
              from R$5.89 using either on-demand courier collection or an accredited network of over 1,700 LoggiPonto
              drop-off locations. This two-sided demand architecture allows Loggi to maintain base load utilization from
              enterprise contracts while capturing higher-margin transactional volume from long-tail commercial
              shippers.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU011
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU008
      - number: '6.2'
        title: Adoption Trajectory & Operational Throughput Scale
        blocks:
          - type: paragraph
            body: >-
              Loggi's operational footprint has scaled substantially from its origin as an urban motorcycle courier
              dispatch service into a nationwide logistics-as-a-service infrastructure provider. The platform's
              published distribution network spans more than 4,000 municipalities across Brazil, achieving
              near-universal reach in the country's urban and regional e-commerce markets. Supply-side network scale is
              supported by more than 200,000 registered partner couriers operating across motorcycles, bicycles, and
              delivery vans, coordinated alongside over 1,700 physical collection points. Historical operational
              disclosures indicate that Loggi previously executed approximately 300,000 daily delivery rounds across
              3,500 communities, scaling from earlier reported baselines of 3 million monthly deliveries across 33 core
              metropolitan centers. The merchant journey illustrates how commercial accounts integrate with Loggi,
              beginning with digital onboarding and API integration, progressing through regional parcel dispatch and
              automated sortation, and culminating in last-mile courier execution with real-time tracking transparency.
              While third-party market data platforms record an unverified $1B annual revenue benchmark for 2025,
              rigorous diligence must distinguish cumulative registered partner numbers and marketing coverage claims
              from ongoing daily active throughput and paid package density.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU011
              - CU013
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU011
              - CU002
              - CU010
      - number: '6.3'
        title: Named Enterprise Accounts & Production Proof
        blocks:
          - type: paragraph
            body: >-
              Public customer disclosures and case studies demonstrate verifiable enterprise adoption across several
              demanding commercial verticals in Brazil. In the sports and lifestyle retail sector, athletic apparel
              brand Track&Field credited Loggi with supporting a 5x expansion in its online sales during the pandemic,
              highlighting on-time delivery execution and brand customer experience. Similarly, Grupo SBF—the operating
              entity behind Brazilian sports retail giant Centauro and Nike's regional commercial operations—deployed
              Loggi to power omnichannel fulfillment and delivery diversification across multiple retail banners. Luxury
              and fragile goods retailers like Sephora and Pandora rely on Loggi's last-mile handling to preserve
              branded unboxing experiences, citing prompt operational responsiveness during exception handling.
              Furthermore, during the structural shift of Brazilian retail toward digital commerce, Loggi expanded
              strategic fulfillment relationships with broadline marketplace leaders including Amazon and Mercado Livre.
              Nonetheless, public case studies typically emphasize marketing-oriented success stories while omitting
              essential commercial details, such as contractual service level agreements (SLAs), on-time fulfillment
              penalty structures, and the exact share of wallet Loggi commands relative to competitors like Correios,
              Jadlog, and proprietary marketplace delivery fleets.
            claimRefs:
              - CU002
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU003
            claimRefs:
              - CU007
              - CU008
              - CU009
      - number: '6.4'
        title: Retention Durability, Concentration Risks & Growth Deceleration
        blocks:
          - type: paragraph
            body: >-
              Despite widespread enterprise brand adoption, Loggi faces significant commercial concentration risks,
              margin pressure, and observable indicators of platform traction deceleration. The company's heavy reliance
              on large e-commerce platforms like Amazon and Mercado Livre exposes its sorting and linehaul network to
              substantial customer concentration risk, particularly as marketplace operators continuously invest in
              proprietary in-house logistics infrastructure and captive delivery networks. Furthermore, independent
              market benchmark tracking from RankmyAI highlights emerging competitive friction: Loggi's overall platform
              ranking declined by 17 positions over a nine-month period to August 2026, accompanied by a 49-spot drop in
              web traffic ranking and a 64-spot decline in investment interest ranking. Commercial sustainability is
              also intrinsically linked to courier labor dynamics; while Brazilian labor courts ruled that platform
              couriers are autonomous contractors rather than formal employees, ongoing legal scrutiny and courier
              retention costs represent persistent structural risks to service reliability. Critical diligence metrics
              including Net Revenue Retention (NRR), Gross Revenue Retention (GRR), and multi-year customer cohort churn
              rates remain entirely undisclosed by management, leaving the long-term durability of Loggi's customer
              economics an unresolved underwriting gap.
            claimRefs:
              - CU008
              - CU010
              - CU012
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Bifurcated Logistics Architecture Across Shippers
            body: >-
              Loggi's customer base is structurally bifurcated between high-volume enterprise e-commerce platforms
              requiring nationwide cross-docking and long-tail merchants leveraging app-based drop-off points.
            calloutType: insight
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: callout
            title: Concentration and Traction Headwinds
            body: >-
              While enterprise references validate operational capability, top-account marketplace concentration and
              recent 9-month ranking declines in web traffic and investment signal competitive friction.
            calloutType: risk
            claimRefs:
              - CU008
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory Frameworks and Courier Labor Litigation
        blocks:
          - type: paragraph
            body: >-
              Loggi operates a distributed urban delivery model connecting shippers with motorcycle couriers and
              cyclists across Brazil. The platform's commercial viability historically hinges on the legal status of its
              courier workforce. While Loggi secured a landmark ruling from the Brazilian Labor Court establishing that
              couriers operate as autonomous independent contractors rather than salaried employees with mandatory
              statutory benefits, this legal foundation remains inherently precarious. Public prosecutors in Brazil have
              actively pursued class-action lawsuits challenging gig economy platforms, and legal directors acknowledge
              that appellate proceedings before the Superior Labor Court (TST) and shifts in political administration
              could reopen contractor reclassification scrutiny. A judicial reversal would impose crippling
              retrospective payroll taxes, mandatory severance funds (FGTS), and social security contributions across
              tens of thousands of active couriers, directly dismantling platform contribution margins.
            claimRefs:
              - CR001
              - CR002
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR012
      - number: '7.2'
        title: Operational Scalability and Data Architecture Fragility
        blocks:
          - type: paragraph
            body: >-
              At nationwide operational scale, Loggi must coordinate parcel intake, cross-docking, and last-mile
              dispatch across 27 Brazilian states, including remote logistical nodes in the Amazon basin. Operational
              stability depends heavily on digital routing and physical cross-dock sortation infrastructure. Internally,
              rapid expansion generated severe data engineering sprawl, characterized by 18,000 Looker dashboards and an
              eight-hour nightly ETL batch updating 500 Redshift tables. Latency or pipeline failure during this
              midnight batch directly delayed delivery schedule generation and courier dispatch, threatening customer
              service-level agreements. While adoption of OpenMetadata and elimination of 7,000 redundant tables reduced
              query runtimes by 30%, Loggi remains exposed to single-point-of-failure vulnerabilities in high-speed
              sortation hubs like Cajamar, where automated line sorters from BEUMER Group process massive parcel volumes
              that cannot be easily re-routed manually.
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR014
      - number: '7.3'
        title: Marketplace Dependencies and Macro Logistics Economics
        blocks:
          - type: paragraph
            body: >-
              Loggi's business model transitioned from on-demand document courier delivery toward national e-commerce
              parcel fulfillment, partnering with retail aggregators such as Amazon and Mercado Livre. This structural
              pivot creates substantial counterparty concentration and commercial vulnerability. Marketplace platforms
              possess immense bargaining leverage, allowing them to extract aggressive pricing concessions or establish
              proprietary fulfillment and delivery networks that displace third-party providers. Furthermore,
              macroeconomic conditions in Brazil present structural cost headwinds: logistics costs consume
              approximately 12.7 percent of Brazilian GDP compared to 7.8 percent in the United States, driven by
              substandard road infrastructure, cargo theft risks, and volatile fuel prices. Managing these structural
              overhead costs while scaling toward management's long-term target of five million daily parcels creates
              immense capital intensity and persistent operational execution risks.
            claimRefs:
              - CR005
              - CR008
              - CR010
              - CR011
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR008
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR008
              - CR010
              - CR013
      - number: '7.4'
        title: Risk Mitigation Maturity and Diligence Priorities
        blocks:
          - type: paragraph
            body: >-
              To safeguard enterprise valuation and advance toward sustainable profitability, Loggi has implemented
              operational mitigations across physical automation and data governance. Integrating modular line sorters
              preserves operational versatility without locking the company into rigid sortation architectures, and
              centralized data cataloging improves incident triage and daily route optimization. However, critical
              investment thesis break points remain unresolved for institutional investors. Confirmatory diligence must
              scrutinize pending labor litigation reserves, examine bilateral customer retention cohorts among anchor
              e-commerce accounts, and evaluate unit economics in remote non-metropolitan delivery lanes. An adverse
              appellate ruling on courier employment or volume loss from top marketplace partners would fundamentally
              alter Loggi's liquidity runway and pre-IPO capital requirements.
            claimRefs:
              - CR001
              - CR004
              - CR006
              - CR009
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Labor Contractor Reclassification as Existential Downside Risk
            body: >-
              Loggi's unit economics and operational flexibility depend on treating its 40,000+ active couriers as
              independent contractors. While the Brazilian Labor Court issued a pivotal ruling supporting this autonomy,
              legal risks persist due to potential appeals before the Superior Labor Court (TST) and evolving political
              scrutiny. Any forced reclassification would impose payroll taxes, mandated benefits, and severe back-pay
              liabilities that would invalidate current operating margins.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
          - type: callout
            title: Data Pipeline Hygiene as an Operational Linchpin
            body: >-
              Loggi's rapid expansion resulted in severe internal data sprawl, encompassing 18,000 Looker dashboards and
              a nightly eight-hour ETL job across 500 tables. In a logistics-as-a-service model where 300,000+ daily
              packages must be routed dynamically across 27 states, data latency directly causes dispatch delays and
              driver idle time. Automated governance via OpenMetadata and physical line sorters have stabilized
              throughput, but continuous monitoring remains essential.
            calloutType: insight
            claimRefs:
              - CR003
              - CR004
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Loggi operates a critical national delivery network in Brazil, combining proprietary mobile dispatch
              software, cross-docking sorting centers, and a base of over 40,000 registered couriers completing
              approximately 300,000 daily delivery rounds across urban and regional corridors. The core bull thesis
              rests on Brazil’s structural logistics deficit, where high transportation friction and fragmented carrier
              infrastructure create durable competitive barriers for an aggregated, tech-enabled platform. With next-day
              deliveries advertised from R$ 4 and ecommerce parcel shipping historically representing approximately 35%
              of platform volume, Loggi’s software-driven model captures delivery margins by eliminating traditional
              hub-and-spoke inefficiencies. Conversely, the anti-thesis highlights severe structural margin compression
              and ongoing operational risks. Low baseline delivery fees require immense volume density to generate
              positive platform contribution margins after paying courier fees. Furthermore, while the Brazilian Labor
              Court validated that Loggi couriers operate as independent contractors rather than payroll employees,
              company legal leadership has acknowledged that the legal framework remains vulnerable to judicial appeals
              and regulatory shifts in Brazil. A negative legal reinterpretation would immediately impair the platform’s
              unit economics and operational viability.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.2'
        title: Capitalization and Financing Context
        blocks:
          - type: paragraph
            body: >-
              Loggi’s capitalization history reflects substantial institutional backing from top-tier venture capital
              and growth equity investors. Following early seed and Series A rounds including US$3.3 million from
              Qualcomm Ventures and Dragoneer Investment Group, SoftBank deployed US$100 million in October 2018 as part
              of a US$111 million Series D financing round alongside KaszeK Ventures. In June 2019, SoftBank led a
              subsequent US$150 million investment round that valued Loggi at over US$1 billion, formally establishing
              the startup as a Brazilian unicorn. The company reached its peak reported private valuation in March 2021
              by securing US$205 million in Series F funding led by CapSur Capital with participation from Brazilian
              hedge fund Verde Asset Management, bringing its private post-money valuation close to US$2.0 billion.
              Despite this impressive primary financing pedigree, current secondary market evidence fails to validate
              this historical valuation anchor. Data from secondary trading platform Forge Global reveals limited
              private trading activity, with no recent matched transaction prices, no established post-money valuation
              marks, and no active liquidity clearing. Furthermore, private secondary share transactions carry severe
              illiquidity risks where investors cannot readily exit, leaving prospective participants exposed to
              significant potential capital impairment.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV007
              - CV012
              - CV014
      - number: '8.3'
        title: Valuation Scenarios and Benchmarking
        blocks:
          - type: paragraph
            body: >-
              Evaluating Loggi under prevailing macroeconomic conditions requires decoupling historical private peak
              marks from observable market multiples and operating performance. In our bull case, Loggi successfully
              achieves sustained operating profitability, defends its courier contractor model against legal appeals,
              and expands parcel throughput at over 25% annually. Under this trajectory, an eventual public listing or
              strategic buyout could value the business at US$2.0 billion to US$2.5 billion, reflecting 2.0x to 2.5x net
              platform revenue. In the base case, multiple contraction across global and Latin American
              technology-enabled logistics providers and slower consumer ecommerce growth compress the valuation to
              between US$1.0 billion and US$1.4 billion (1.2x to 1.5x net revenue), closely tracking the 2019 SoftBank
              unicorn benchmark. Under the bear case, continued operating cash burn, fuel and wage inflation, or an
              adverse legal reclassification of couriers would trigger a distressed recapitalization or asset sale
              valuing Loggi at US$400 million to US$600 million (0.5x net revenue). Given that senior preferred shares
              from CapSur and SoftBank likely hold liquidation preferences, a bear outcome would severely dilute common
              and early preferred equity holders.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV012
              - CV013
      - number: '8.4'
        title: Recommendation and Diligence Priorities
        blocks:
          - type: paragraph
            body: >-
              Based on verified public evidence, we assign Loggi an overall research-more recommendation with a medium
              confidence score, high risk rating, and stretched valuation stance. Loggi’s national operational reach,
              1,700+ collection points, and recognized brand provide undeniable enterprise strategic value. However, the
              lack of audited financial statements detailing recent net revenues, gross margins, EBITDA, and
              balance-sheet cash reserves precludes a buy recommendation at anywhere near the historical ~US$2.0B
              valuation anchor. Secondary market illiquidity on platforms such as Forge Global underscores that private
              price marks from early 2021 do not reflect current risk-adjusted valuations. Prospective investors must
              impose strict entry price discipline and condition any capital allocation on comprehensive private
              diligence. Crucial diligence milestones include reviewing audited post-2021 financial statements,
              analyzing cohort-level gross retention across ecommerce merchants, inspecting the senior liquidation
              preference stack, and stress-testing courier unit economics against potential regulatory changes in
              Brazilian labor law.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV012
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV012
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Valuation Stance: Research-More at Peak Private Multiples'
            body: >-
              Loggi’s strong brand, proprietary sorting assets, and verified 300,000 daily delivery scale make it an
              essential Brazilian logistics infrastructure asset. However, underwriting an entry at or near its 2021
              ~US$2.0B valuation is unsupportable without audited financial disclosures and secondary market price
              discovery.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV004
              - CV012
          - type: callout
            title: 'Downside Overhang: Private Share Illiquidity and Cap Table Subordination'
            body: >-
              In the absence of an active secondary trading market on Forge Global and with an IPO delayed beyond early
              expectations, prospective investors face severe liquidity lock-in and potential liquidation preference
              overhang from senior funding rounds.
            calloutType: risk
            claimRefs:
              - CV004
              - CV005
              - CV014
