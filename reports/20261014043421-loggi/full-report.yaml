  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Core Competitor Profiles
        blocks:
          - type: paragraph
            body: >-
              The Brazilian parcel and freight transportation market is characterized by severe geographic dispersion,
              infrastructure bottlenecks, and high logistical friction that historically consumed over 12 percent of
              gross domestic product. Within this operating environment, Loggi positions itself as a technology-first
              logistics layer competing across three distinct competitive tiers: state-owned postal infrastructure,
              established private contract carriers, and captive marketplace logistics networks. The incumbent
              foundation is anchored by state monopoly Correios, which retains unmatched universal coverage across every
              Brazilian municipality but suffers from bureaucratic service delivery and slower transit speeds in dense
              urban centers. Traditional private courier operators, notably Total Express and Jadlog, command extensive
              regional hub-and-spoke infrastructure and deep corporate contracts for enterprise parcel distribution, yet
              rely on legacy dispatch frameworks. Concurrently, rapid digitization has led e-commerce marketplaces to
              build or acquire captive logistics operations, most prominently Mercado Envios, alongside emerging
              on-demand courier networks like Lalamove and food delivery fleets including iFood and Rappi that contest
              local urban courier capacity. Loggi differentiates by offering an asset-light, algorithmically routed
              courier mesh that bridges local merchant dispatch with national parcel distribution.
            claimRefs:
              - CP001
              - CP002
              - CP008
              - CP011
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP008
              - CP011
      - number: '3.2'
        title: Capability Matrix and Competitive Positioning
        blocks:
          - type: paragraph
            body: >-
              Evaluating delivery platforms across the Brazilian retail landscape reveals sharp divergence in software
              architecture, physical cross-docking scale, and tracking visibility. Whereas traditional carriers route
              shipments through rigid postal sorting hubs—such as international models exemplified by UPS or FedEx—Loggi
              coordinates point-to-point urban dispatches and regional cross-docking via mobile routing software and
              algorithmic driver allocation. The platform ingested high-volume operational telemetry across ten national
              cross-docking hubs and its 40,000-square-meter Cajamar sorting center, capable of sorting up to 1 million
              parcels daily to shrink transit windows by up to five hours across the São Paulo metropolitan area. In
              contrast to Correios, whose milestone tracking relies on intermittent barcode scans at postal branches,
              Loggi delivers real-time GPS tracking and automated customer notifications via SMS and email. Furthermore,
              Loggi's extensive network of over 1,700 accredited LoggiPonto drop-off locations allows small businesses
              and independent merchants to bypass physical post office queues. However, against captive marketplace
              networks like Mercado Envios, Loggi lacks native checkout exclusivity, forcing the company to sustain
              superior routing efficiency and open developer APIs to defend multi-homed merchant volume.
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP005
              - CP012
              - CP014
      - number: '3.3'
        title: Pricing Models, Distribution Power, and Switching Costs
        blocks:
          - type: paragraph
            body: >-
              Pricing and packaging dynamics in Brazilian logistics reflect aggressive price transparency across SMB
              e-commerce channels alongside negotiated contract rates for large enterprise retailers. Loggi provides
              competitive list pricing starting from R$ 4.00 for next-day municipal deliveries and entry-level
              nationwide shipping from R$ 5.89 via its consumer and merchant mobile application, directly contesting
              baseline postal tariffs. To maximize distribution power, Loggi operates a hybrid model: merchants can
              tender shipments directly through Loggi's courier mesh or generate discounted Correios PAC and Sedex
              labels directly inside the Loggi application. This interoperability lowers customer adoption friction and
              enables merchants to multi-home across carrier options without managing separate operational workflows.
              Switching costs for small merchants remain low, as shipping aggregators and modular e-commerce platforms
              like Nuvemshop allow sellers to toggle between delivery providers based on price and transit time. To
              build retention moats, Loggi leverages its 1,700-point PUDO network and direct REST API integrations into
              merchant enterprise resource planning stacks, raising operational switching costs for mid-market retailers
              that rely on automated dispatch.
            claimRefs:
              - CP003
              - CP004
              - CP007
              - CP008
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP007
              - CP010
              - CP012
      - number: '3.4'
        title: Moat Durability, Commoditization, and Adverse Incumbent Threats
        blocks:
          - type: paragraph
            body: >-
              The long-term durability of Loggi's competitive moat faces structural headwinds from carrier
              commoditization, marketplace insourcing, and courier labor stability. While Loggi successfully overturned
              an adverse 2019 labor court ruling that had threatened to classify its courier base as formal employees
              under Brazilian labor statutes, maintaining an autonomous network of over 200,000 couriers requires
              continuous earnings incentives amid rising fuel and vehicle costs. More critically, Loggi's largest
              e-commerce partners, including Mercado Libre and Amazon, represent both major volume sources and
              existential displacement threats. As Mercado Envios expands its proprietary air fleet, fulfillment
              centers, and dedicated courier meshes across Brazil, volume from anchor marketplace contracts is
              structurally vulnerable to captive insourcing. Following the post-pandemic e-commerce normalization, Loggi
              laid off approximately 15 percent of its workforce in 2022 to realign its cost structure toward unit-level
              profitability. To resist commoditization against regional express carriers, Loggi must deepen its software
              integration with non-marketplace merchants and defend its urban cross-dock speed advantage.
            claimRefs:
              - CP005
              - CP010
              - CP012
              - CP013
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Marketplace Insourcing and Courier Unit Economics
            body: >-
              While Loggi has built substantial reach with over 1,700 PUDO points and nationwide coverage, its largest
              e-commerce partners like Mercado Libre also operate competing captive delivery networks, capping pricing
              leverage.
            calloutType: risk
            claimRefs:
              - CP004
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              Loggi operates a logistics-as-a-service platform that monetizes parcel shipping through on-demand local
              dispatch and national deliveries across Brazil [CI001]. The company's commercial architecture combines
              published introductory rates with distance- and weight-based rate schedules [CI002]. For high-volume
              e-commerce shippers, Loggi advertises next-day delivery tariffs starting from R$ 4.00, targeting merchants
              seeking lower shipping costs than traditional postal alternatives [CI002]. In consumer and retail parcel
              shipping, Loggi publishes entry rates starting from R$ 5.89 for national deliveries dispatched through its
              accredited drop-off points or scheduled address collection [CI003].


              Monetization dynamics bifurcate by customer profile: retail consumers pay flat dispatch fees, whereas
              commercial enterprise shippers contract on variable rate cards determined by route distance, volumetric
              package dimensions, and service-level urgency [CI004]. Commercial delivery represents the core volume
              driver, with e-commerce parcel fulfillment utilizing vans and small trucks contributing approximately 35
              percent of total sales volume [CI007]. Enterprise partnerships with major marketplaces and retailers,
              including Amazon and Mercado Livre, provide essential freight density across key urban corridors [CI010].
              However, because published tariffs reflect minimum baseline prices rather than realized net revenue
              yields, underwriters cannot establish average realized prices per delivery without contract-level volume
              disclosures.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI007
              - CI010
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI007
              - CI008
