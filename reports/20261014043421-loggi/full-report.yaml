chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Mission, and Platform Architecture
        blocks:
          - type: paragraph
            body: >-
              Loggi operates as a technology-enabled logistics infrastructure company founded in São Paulo, Brazil, in
              2013. The company initially built an urban on-demand dispatch platform that matched corporate shippers and
              restaurants with motorcycle couriers across Greater São Paulo. Over its operating lifecycle, Loggi
              expanded beyond intra-city express courier services to construct a comprehensive national logistics
              network serving small businesses, direct-to-consumer retailers, and large enterprise marketplaces. Its
              core technology platform integrates automated dispatch algorithms, mobile application workflows, and ERP
              shipping integrations, allowing commercial shippers to automate parcel labeling, tracking, and route
              scheduling throughout Brazil.
            claimRefs:
              - CO001
              - CO011
              - CO012
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO006
              - CO009
              - CO010
      - number: '1.2'
        title: Founding Team, Executive Governance, and Key-Person Structure
        blocks:
          - type: paragraph
            body: >-
              Loggi was established by a cross-functional founding team comprising software engineer Arthur Debert,
              product designer Eduardo Wexler, and French-Brazilian entrepreneur Fabien Mendez. The founders combined
              technical software engineering and operational business analysis to digitize Brazil's traditionally
              fragmented and informal urban courier ecosystem. Executive leadership oversees platform operations,
              crossdock facilities, and corporate governance from São Paulo. A material leadership dimension involves
              regulatory compliance and public policy navigation, directed by Vanessa Isidoro, who spearheaded the
              company's labor litigation defense and municipal regulatory partnerships. Key-person reliance remains
              concentrated in early technical architects and legal strategists managing national contractor relations.
            claimRefs:
              - CO002
              - CO003
