              - CO003
      - number: '1.3'
        title: Capitalization History, Valuation Trajectory, and Investor Syndicate
        blocks:
          - type: paragraph
            body: >-
              Loggi has raised approximately US$ 486 million across six primary equity financing rounds since its
              initial 2013 angel capitalization. Early backing from Qualcomm Ventures and Dragoneer Investment Group
              validated the company's mobile dispatch software model. In October 2018, SoftBank Vision Fund entered as
              lead sponsor with a US$ 100 million commitment, subsequently leading a US$ 150 million Series C round in
              June 2019 that elevated Loggi to unicorn status at a US$ 1.0 billion post-money valuation. In February
              2021, Capsur Capital led a US$ 205 million Series D round that established an estimated US$ 2.0 billion
              private valuation anchor, supported by Microsoft, Verde Asset Management, Monashees, and Advent
              International.
            claimRefs:
              - CO004
              - CO005
