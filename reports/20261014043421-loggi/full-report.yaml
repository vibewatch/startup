    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV012
      - CV014
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Investment Thesis (Bull View)
      - Anti-Thesis (Bear View)
      - Thesis-Break Triggers / Diligence Path
    rows:
      - - Market Scale & Deficit
        - Loggi provides national coverage across Brazil with 300,000 daily rounds addressing endemic logistics deficits
        - High operational fragmentation and unpaved infrastructure cause chronic capital expenditure requirements
        - Delivery failure rates exceeding 5% or sustained loss of tier-1 ecommerce shipping volume
      - - Unit Economics & Take-Rate
        - Dynamic algorithmic dispatch matches couriers with food and parcel orders to minimize downtime between peaks
        - Low base pricing (from R$ 4) compresses net platform take-rate after paying courier splits
        - Inability to demonstrate positive unit contribution margin across suburban and regional corridors
      - - Capitalization & Valuation
        - US$205M Series F demonstrated institutional support from CapSur and Verde Asset Management
        - Private ~US$2B valuation anchor represents peak 2021 market conditions without secondary validation
        - Down-round financing or severe dilution from senior liquidation preference overhang
      - - Labor & Regulatory Posture
        - Labor Court upheld independent contractor status for platform drivers across 300,000 daily routes
        - Litigation appeals and evolving Brazilian statutory labor regulations threaten systemic reclassification
        - Adverse appellate court reversal imposing retroactive employment benefits on courier base
    notes: Evaluates competing bull and bear operational arguments against observable secondary market and legal disclosures.
    claimRefs:
      - CV003
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core Operating Assumptions
      - Implied Valuation & Return Logic
      - Downside / Key Risks
      - Probability Signal
    rows:
      - - Bull Case
        - Annual parcel throughput expands >25% annually; regional sorting automation achieves EBITDA breakeven
        - US$2.0B to US$2.5B enterprise value based on 2.0x–2.5x forward net revenue in an eventual B3/US IPO
        - Execution delays at regional cross-docking centers and resurgence of fuel inflation
        - 20% probability
      - - Base Case
        - Moderate delivery volume growth; platform reaches operating cash breakeven with modest single-digit margins
        - US$1.0B to US$1.4B valuation reflecting historical 2019 unicorn benchmark and market multiple contraction
        - Margin pressure from competing carrier networks and ecommerce in-house logistics
        - 55% probability
      - - Bear Case
        - >-
          Sustained operating cash burn; contractor labor liabilities materialize or volume shifts to captive merchant
          fleets
        - US$400M to US$600M distressed recapitalization or asset sale at 0.5x revenue
        - Severe dilution for junior preferred and common equity holders via senior preference overhang
        - 25% probability
    notes: >-
      Valuation scenarios benchmarked against private 2021 ~US$2.0B peak round and prevailing emerging market logistics
      multiples.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV012
      - CV013
