          - type: callout
            title: Labor Classification Volatility as an Adoption Bottleneck
            body: >-
              While Brazilian judicial rulings have affirmed the independent contractor model for gig couriers, ongoing
              regulatory scrutiny and appeal risks maintain structural uncertainty over unit operating costs.
            calloutType: risk
