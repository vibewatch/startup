      - number: '2.3'
        title: Buyer Segmentation, Workflow Integration, and Budget Ownership
        blocks:
          - type: paragraph
            body: >-
              Loggi addresses four distinct commercial customer tiers, each operating under specific procurement
              workflows and budget authority. Enterprise digital commerce retailers represent the largest parcel volume
              tier, where procurement decisions are governed by supply chain directors focused on delivery reliability
              and programmatic API dispatch. For these merchants, Loggi offers automated freight quotation, real-time
              customer tracking notifications, and bulk pickup logistics. Mid-market online merchants and regional
              retail stores interact through self-service web portals, dropping packaged merchandise at accredited local
              collection points (LoggiPonto) starting at competitive baseline freight fees from R$ 4. Local commerce
              merchants and restaurants purchase on-demand motorcycle delivery funded through daily operating store
              budgets. Individual consumers book ad-hoc deliveries via mobile applications for personal parcels,
              bypassing postal queues.
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
              - CM012
      - number: '2.4'
        title: Structural Growth Drivers and Regulatory Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Loggi's commercial expansion is driven by secular e-commerce penetration, merchant demand for competitive
              shipping rates, and the proliferation of its national collection network. The company reports service
              coverage across more than 3,500 municipalities, reaching approximately 90 percent of Brazil's national
              footprint through over 1,700 collection points and 200,000 registered partner couriers. However, this
              growth trajectory faces critical structural headwinds. Central among these constraints is legal and
              regulatory scrutiny regarding courier employment status. Although Brazil's Labor Court issued a pivotal
              ruling affirming that couriers operate as autonomous independent contractors rather than payroll
              employees, ongoing judicial appeals and evolving municipal transport regulations present continuous
              operating and margin risks. Furthermore, capital intensity and physical infrastructure deficits in remote
              Brazilian regions constrain nationwide delivery economics.
            claimRefs:
              - CM003
              - CM007
              - CM008
              - CM009
              - CM010
              - CM012
              - CM014
