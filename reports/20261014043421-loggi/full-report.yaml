            title: Structural Logistics Cost Advantage in Brazil
            body: >-
              Brazil's high baseline logistics burden of 12.7 percent of GDP creates an intense economic imperative for
              digitized last-mile routing compared to developed markets.
            calloutType: insight
            claimRefs:
              - CM003
