          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI005
      - number: '4.2'
        title: Cost Structure and Unit Economics Levers
        blocks:
          - type: paragraph
            body: >-
              Loggi's cost structure is governed primarily by variable logistics execution and sortation infrastructure
              [CI005]. On each delivery transaction, Loggi allocates the majority of the gross fee to independent
              couriers, retaining the residual spread to fund technology development, routing algorithms, sortation
              hubs, and administrative overhead [CI005]. Operating flexibility is anchored on an independent contractor
              delivery model that was affirmed by Brazilian Labor Court rulings, which concluded that platform couriers
              operate autonomously rather than as formal payroll employees [CI006]. This legal precedent shields the
              company from substantial statutory payroll taxes and employment obligations that typically inflate
              Brazilian operating costs [CI006].


              To support national distribution without heavy real estate investment, Loggi expanded a network of more
              than 1,700 LoggiPonto partner drop-off locations and mobilized over 200,000 registered partner couriers
              [CI008]. Platform volume expanded from 100,000 daily packages in 2019 to approximately 300,000 daily
              delivery rounds across more than 3,500 municipalities [CI009]. Despite this physical scale, Loggi does not
              publicly report gross margin percentages, line-haul line costs, or localized hub contribution margins
              [CI005]. As a result, assessing whether parcel density in secondary cities covers sorting and line-haul
              transport remains an unresolved diligence barrier.
            claimRefs:
              - CI005
              - CI006
              - CI008
              - CI009
          - type: table
            tableRef: TI003
            claimRefs:
              - CI002
              - CI005
              - CI006
              - CI013
      - number: '4.3'
        title: Capital Adequacy and Financing Trajectory
        blocks:
          - type: paragraph
            body: >-
              Loggi's balance sheet was historically capitalized through major venture funding rounds, culminating in a
              Series F financing between US$ 205 million and US$ 212 million led by the SoftBank Latin America Fund in
              early 2021 at an estimated valuation near US$ 2 billion [CI011]. This followed a US$ 150 million Series D
              led by the SoftBank Vision Fund in 2019 that established unicorn status at a US$ 1 billion valuation and
              brought cumulative funding to approximately US$ 295 million [CI012]. However, Loggi has announced no
              primary equity financings since 2021, shifting investor scrutiny to operational runway and capital
              discipline [CI011].


              Recent workforce data signals active cost rationalization: tracked headcount contracted from 4,319
              employees in 2025 to 2,732 employees in 2026, representing a 37 percent reduction in formal corporate and
              operational staff [CI013]. Concurrently, secondary market data indicates liquidity constraints: private
              trading platforms report limited activity and no established clearing share price for Loggi equity
              [CI014]. Furthermore, external tracking shows Loggi's investment ranking declined 64 positions alongside a
              49-position drop in web traffic ranking through August 2026, indicating cooling external momentum amid an
              extended private funding pause [CI015].
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: Financial Verdict and Diligence Underwriting Blockers
        blocks:
          - type: paragraph
            body: >-
              From an underwriting perspective, Loggi demonstrates a viable, asset-light parcel delivery model with
              proven national reach, large-scale enterprise merchant integration, and a variable labor cost structure
              [CI001, CI005]. The company's legal victory confirming independent contractor classification protects its
              core unit economics against severe payroll inflation [CI006]. However, the business operates in a
              capital-intensive logistics sector with thin industry margins, intense courier competition, and high
              operational friction across fragmented Brazilian infrastructure [CI005, CI009].


              The absence of audited net revenue, gross margin per lane, operating EBITDA, and cash balance data creates
              significant underwriting barriers [CI001, CI011]. The stale 2021 US$ 2 billion valuation anchor cannot be
              validated against current market comparables given the subsequent macroeconomic reset in Latin American
              venture valuations and lack of secondary liquidity [CI011, CI014]. Prospective investors must prioritize
              obtaining audited FY2023-1H2026 financial statements, cohort retention curves for SMB merchants, and
              detailed unit contribution metrics across urban express versus cross-regional lines before committing
              capital.
            claimRefs:
              - CI001
              - CI005
              - CI006
              - CI009
              - CI011
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Disclosure opacity prevents independent gross margin and runway underwriting
            body: >-
              Loggi has not publicly disclosed audited financial statements, net revenues, or cash burn rates since its
              2021 Series F round. While delivery volume indicators demonstrate substantial physical scale across
              Brazil, underwriters cannot verify whether route density achieves positive unit economics without access
              to management accounts.
            calloutType: risk
            claimRefs:
