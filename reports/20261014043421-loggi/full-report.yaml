  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundaries, Spend Inclusions, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Loggi operates across two interconnected segments of the Brazilian freight landscape: intra-city on-demand
              motorcycle courier dispatch and nationwide e-commerce parcel logistics. The company's addressable boundary
              encompasses express small-package transportation, document courier routing, and business-to-consumer
              parcel delivery for digital commerce platforms. It explicitly excludes bulk industrial freight,
              inter-state heavy trucking, palletized cargo, and international customs clearance operations. In the urban
              courier segment, status-quo alternatives consist of informal motorcycle couriers (motoboys) whose
              fragmented dispatch networks historically lacked digital tracking, standardized pricing, and automated
              electronic invoicing. In nationwide parcel transportation, the primary incumbent substitute is the
              state-owned postal operator Correios alongside legacy regional freight carriers. By integrating route
              optimization software with decentralized drop-off points, Loggi converts informal courier capacity into
              structured commercial logistics.
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
      - number: '2.2'
        title: TAM/SAM Sizing Lenses and Macroeconomic Growth Benchmarks
        blocks:
          - type: paragraph
            body: >-
              Evaluating the addressable market for technology-enabled logistics in Brazil requires examining multiple
              structural expenditure lenses. At the macroeconomic tier, logistics operations in Brazil represent a
              substantial expenditure burden, absorbing approximately 12.7 percent of national GDP compared to 7.8
              percent in the United States. This structural cost differential reflects logistical complexities, regional
              distances, and fragmented road infrastructure that create substantial economic demand for digital
              efficiency. Within the regional last-mile and parcel delivery sector, independent research by McKinsey &
              Co. identified an annual growth rate of approximately 14 percent across Latin America. Furthermore,
              domestic e-commerce expansion, which scaled rapidly toward US$ 23 billion in retail transaction value,
              directly expands the addressable demand for flexible parcel fulfillment. While Loggi captured an estimated
              US$ 2 billion private valuation anchor during its 2021 funding cycle, private reporting standards in
              Brazilian logistics obscure audited shipment volumes across secondary municipalities.
            claimRefs:
              - CM003
              - CM004
              - CM011
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM011
              - CM013
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
