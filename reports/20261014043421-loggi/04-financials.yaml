company:
  name: Loggi
chapter:
  number: 4
  title: Financials
  summary: Loggi operates an asset-light parcel delivery model across Brazil that pairs published rates starting from R$ 4
    with variable business fees and an independent contractor fleet. While the platform has handled up to 300,000 daily delivery
    rounds across 1,700 collection points, the absence of audited net revenue, lane margins, and current cash burn disclosures
    leaves forward unit economics and capital adequacy un-underwriteable without private management accounts.
sections:
- id: revenue-streams-and-pricing-architecture
  title: Revenue Streams and Pricing Architecture
  body: 'Loggi operates a logistics-as-a-service platform that monetizes parcel shipping through on-demand local dispatch
    and national deliveries across Brazil [CI001]. The company''s commercial architecture combines published introductory
    rates with distance- and weight-based rate schedules [CI002]. For high-volume e-commerce shippers, Loggi advertises next-day
    delivery tariffs starting from R$ 4.00, targeting merchants seeking lower shipping costs than traditional postal alternatives
    [CI002]. In consumer and retail parcel shipping, Loggi publishes entry rates starting from R$ 5.89 for national deliveries
    dispatched through its accredited drop-off points or scheduled address collection [CI003].


    Monetization dynamics bifurcate by customer profile: retail consumers pay flat dispatch fees, whereas commercial enterprise
    shippers contract on variable rate cards determined by route distance, volumetric package dimensions, and service-level
    urgency [CI004]. Commercial delivery represents the core volume driver, with e-commerce parcel fulfillment utilizing vans
    and small trucks contributing approximately 35 percent of total sales volume [CI007]. Enterprise partnerships with major
    marketplaces and retailers, including Amazon and Mercado Livre, provide essential freight density across key urban corridors
    [CI010]. However, because published tariffs reflect minimum baseline prices rather than realized net revenue yields, underwriters
    cannot establish average realized prices per delivery without contract-level volume disclosures.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI007
  - CI010
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: cost-structure-and-unit-economics
  title: Cost Structure and Unit Economics Levers
  body: 'Loggi''s cost structure is governed primarily by variable logistics execution and sortation infrastructure [CI005].
    On each delivery transaction, Loggi allocates the majority of the gross fee to independent couriers, retaining the residual
    spread to fund technology development, routing algorithms, sortation hubs, and administrative overhead [CI005]. Operating
    flexibility is anchored on an independent contractor delivery model that was affirmed by Brazilian Labor Court rulings,
    which concluded that platform couriers operate autonomously rather than as formal payroll employees [CI006]. This legal
    precedent shields the company from substantial statutory payroll taxes and employment obligations that typically inflate
    Brazilian operating costs [CI006].


    To support national distribution without heavy real estate investment, Loggi expanded a network of more than 1,700 LoggiPonto
    partner drop-off locations and mobilized over 200,000 registered partner couriers [CI008]. Platform volume expanded from
    100,000 daily packages in 2019 to approximately 300,000 daily delivery rounds across more than 3,500 municipalities [CI009].
    Despite this physical scale, Loggi does not publicly report gross margin percentages, line-haul line costs, or localized
    hub contribution margins [CI005]. As a result, assessing whether parcel density in secondary cities covers sorting and
    line-haul transport remains an unresolved diligence barrier.'
  claimRefs:
  - CI005
  - CI006
  - CI008
  - CI009
  tableRefs:
  - TI003
  figureRefs: []
- id: capital-adequacy-and-financing-trajectory
  title: Capital Adequacy and Financing Trajectory
  body: 'Loggi''s balance sheet was historically capitalized through major venture funding rounds, culminating in a Series
    F financing between US$ 205 million and US$ 212 million led by the SoftBank Latin America Fund in early 2021 at an estimated
    valuation near US$ 2 billion [CI011]. This followed a US$ 150 million Series D led by the SoftBank Vision Fund in 2019
    that established unicorn status at a US$ 1 billion valuation and brought cumulative funding to approximately US$ 295 million
    [CI012]. However, Loggi has announced no primary equity financings since 2021, shifting investor scrutiny to operational
    runway and capital discipline [CI011].


    Recent workforce data signals active cost rationalization: tracked headcount contracted from 4,319 employees in 2025 to
    2,732 employees in 2026, representing a 37 percent reduction in formal corporate and operational staff [CI013]. Concurrently,
    secondary market data indicates liquidity constraints: private trading platforms report limited activity and no established
    clearing share price for Loggi equity [CI014]. Furthermore, external tracking shows Loggi''s investment ranking declined
    64 positions alongside a 49-position drop in web traffic ranking through August 2026, indicating cooling external momentum
    amid an extended private funding pause [CI015].'
  claimRefs:
  - CI011
  - CI012
  - CI013
  - CI014
  - CI015
  tableRefs: []
  figureRefs: []
- id: financial-verdict-and-diligence-blockers
  title: Financial Verdict and Diligence Underwriting Blockers
  body: 'From an underwriting perspective, Loggi demonstrates a viable, asset-light parcel delivery model with proven national
    reach, large-scale enterprise merchant integration, and a variable labor cost structure [CI001, CI005]. The company''s
    legal victory confirming independent contractor classification protects its core unit economics against severe payroll
    inflation [CI006]. However, the business operates in a capital-intensive logistics sector with thin industry margins,
    intense courier competition, and high operational friction across fragmented Brazilian infrastructure [CI005, CI009].


    The absence of audited net revenue, gross margin per lane, operating EBITDA, and cash balance data creates significant
    underwriting barriers [CI001, CI011]. The stale 2021 US$ 2 billion valuation anchor cannot be validated against current
    market comparables given the subsequent macroeconomic reset in Latin American venture valuations and lack of secondary
    liquidity [CI011, CI014]. Prospective investors must prioritize obtaining audited FY2023-1H2026 financial statements,
    cohort retention curves for SMB merchants, and detailed unit contribution metrics across urban express versus cross-regional
    lines before committing capital.'
  claimRefs:
  - CI001
  - CI005
  - CI006
  - CI009
  - CI011
  - CI014
  tableRefs: []
  figureRefs: []
tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Revenue Stream
  - Monetization Mechanism
  - Pricing Unit
  - Reported Scale / Status
  - Revenue Quality
  - Diligence Verification Ask
  rows:
  - - E-commerce B2B parcel delivery
    - Contracted variable rate based on parcel weight, distance, and SLA
    - Per delivered parcel
    - ~35% of total sales volume; serving retailers like Amazon and Mercado Livre
    - Recurring commercial demand with high volume density
    - Disclose customer contract terms, minimum volume commitments, and lane-level net revenue realization.
  - - Local on-demand express courier
    - Dynamic point-to-point dispatch fee based on distance and urgency
    - Per on-demand dispatch
    - 300,000 daily delivery rounds across 3,500 municipalities
    - Transactional with seasonal spikes; dependent on motoboy availability
    - Provide cohort order frequency, merchant retention, and gross take rate per dispatch.
  - - National drop-off and collection (LoggiPonto)
    - Flat base rate plus regional zone surcharges via drop-off points
    - Per national parcel shipment
    - 1,700+ collection points and nationwide distribution network
    - Expanding cross-regional volume; leverages partner collection infrastructure
    - Verify parcel sortation unit economics, drop-off point commission splits, and route density.
  - - Integrated logistics software and API access
    - Technology platform fee bundled into freight transactions or enterprise integrations
    - Per API quotation or software integration
    - Embedded in ERP and e-commerce platforms with custom tokens
    - Sticky technical integration driving core merchant freight volume
    - Quantify standalone software or platform subscription revenue separate from transportation fees.
  notes: Stream contributions and pricing mechanisms reflect public carrier disclosures and press reports; verified revenue
    breakdowns require private management financial reports.
