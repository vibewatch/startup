- id: TI002
  title: Pricing / monetization table
  columns:
  - Service Tier
  - Published List Price
  - Pricing Structure
  - Realized Pricing Dynamic
  - Discounts / Unknowns
  - Source Reference
  rows:
  - - Next-day e-commerce shipping
    - Starting from R$ 4.00
    - Base entry rate for high-volume commercial shippers
    - Scales with package dimensions, destination zone, and volume tiers
    - Enterprise negotiated volume discounts and fuel surcharges not published
    - Official website (loggi.com/en/para-ecommerce)
  - - National delivery (accredited point)
    - Starting from R$ 5.89
    - Base rate for sender drop-off at LoggiPonto point
    - Increases with inter-state distance, weight brackets, and delivery speed
    - Rebate structures for high-volume merchant integrations unknown
    - Official mobile app (Play Store listing)
  - - Local same-day courier dispatch
    - Estimated R$ 8.00 base (retail)
    - Flat fee for retail consumers; distance-adjusted for business users
    - Dynamic algorithm adjusts for route traffic, time of day, and driver availability
    - Surge pricing parameters and driver payout floor undisclosed
    - Vizologi business model canvas and media reports
  - - Postal label issuance (PAC / Sedex)
    - Correios carrier schedule tariff
    - Integrated label generation through Loggi app interface
    - Platform pass-through rate with potential brokerage margin
    - Commission share retained by Loggi on postal labels undisclosed
    - Official mobile app (Play Store listing)
  notes: Published list tariffs represent introductory base rates; enterprise volume discounting and realized net yield per
    shipment are undisclosed private metrics.
