figures:
- id: FI001
  title: Revenue model bridge
  type: flow
  summary: Structural conversion flow from customer parcel transaction dispatch to net platform logistics contribution.
  data:
    nodes:
    - label: Customer Order Creation
      detail: Shipper books local or national parcel delivery via API, web platform, or mobile app.
    - label: Dynamic Route & Fare Calculation
      detail: Platform algorithm calculates distance, parcel weight, and delivery SLA tariffs.
    - label: Courier Matching & Dispatch
      detail: On-demand dispatch matched to independent couriers across motorcycle, van, or collection points.
    - label: Gross Delivery Billing
      detail: Customer charged base fee (from R$ 4.00-R$ 5.89) plus distance and urgency surcharges.
    - label: Courier Payout Distribution
      detail: Majority of delivery fee transferred to independent contractor couriers as direct COGS.
    - label: Net Platform Margin Retention
      detail: Residual platform contribution retained to support technology, sortation hub, and SG&A expenses.
  approximationNotes: Flow illustrates qualitative conversion mechanics based on published business model descriptions; exact
    cost splits and margins are privately held.
