callouts:
- calloutType: risk
  title: Disclosure opacity prevents independent gross margin and runway underwriting
  body: Loggi has not publicly disclosed audited financial statements, net revenues, or cash burn rates since its 2021 Series
    F round. While delivery volume indicators demonstrate substantial physical scale across Brazil, underwriters cannot verify
    whether route density achieves positive unit economics without access to management accounts.
  claimRefs:
  - CI001
  - CI009
  - CI011
- calloutType: insight
  title: Asset-light independent contractor model moderates fixed operational burn
  body: By utilizing an independent contractor network supported by Brazilian Labor Court rulings and expanding 1,700+ partner
    drop-off points, Loggi shifts a substantial portion of logistics labor into variable costs. However, recent headcount
    reductions from 4,319 to 2,732 employees indicate ongoing pressure to streamline corporate and sortation overhead.
  claimRefs:
  - CI005
  - CI006
  - CI008
  - CI013
