- id: TI003
  title: Unit economics table
  columns:
  - Economic Metric
  - Reported Public Value
  - Estimation Confidence
  - Analytical Importance
  - Diligence Verification Ask
  rows:
  - - Average revenue per parcel (ARPU)
    - Undisclosed (~R$ 4 to R$ 15 est.)
    - low
    - Determines revenue generation baseline across local versus national shipments
    - Provide historical average net realized price per parcel segmented by delivery service tier.
  - - Courier cost share of delivery fee
    - Majority of gross fee split to driver
    - medium
    - Represents the primary cost of goods sold (COGS) and driver network sustainability
    - Disclose exact driver payout percentage, fuel support subsidies, and incentive expenditure.
  - - Gross margin percentage
    - null
    - low
    - Dictates operational profitability and ability to cover sorting hubs and SG&A
    - Audit management gross margin per package across sorting hubs and regional line-haul routes.
  - - Operating headcount overhead
    - 2,732 employees (2026)
    - medium
    - Demonstrates fixed cost trajectory following workforce reductions from 4,319 in 2025
    - Review personnel expenditure, restructuring expenses, and current engineering payroll burden.
  notes: Gross margin and parcel contribution economics are not publicly disclosed; figures reflect third-party estimates
    and workforce tracking databases.
