company:
  name: "Loggi"
chapter:
  number: 8
  title: "Valuation"
  summary: "Loggi represents a scaled Brazilian last-mile delivery network with substantial infrastructure and historical Tier-1 backing, but its stale 2021 ~US$2.0B valuation anchor remains stretched against absent secondary liquidity and opaque current financial disclosures."
sections:
  - id: "investment-thesis-and-anti-thesis"
    title: "Investment Thesis and Anti-Thesis"
    body: "Loggi operates a critical national delivery network in Brazil, combining proprietary mobile dispatch software, cross-docking sorting centers, and a base of over 40,000 registered couriers completing approximately 300,000 daily delivery rounds across urban and regional corridors. The core bull thesis rests on Brazil’s structural logistics deficit, where high transportation friction and fragmented carrier infrastructure create durable competitive barriers for an aggregated, tech-enabled platform. With next-day deliveries advertised from R$ 4 and ecommerce parcel shipping historically representing approximately 35% of platform volume, Loggi’s software-driven model captures delivery margins by eliminating traditional hub-and-spoke inefficiencies. Conversely, the anti-thesis highlights severe structural margin compression and ongoing operational risks. Low baseline delivery fees require immense volume density to generate positive platform contribution margins after paying courier fees. Furthermore, while the Brazilian Labor Court validated that Loggi couriers operate as independent contractors rather than payroll employees, company legal leadership has acknowledged that the legal framework remains vulnerable to judicial appeals and regulatory shifts in Brazil. A negative legal reinterpretation would immediately impair the platform’s unit economics and operational viability."
    claimRefs:
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV011"
    tableRefs:
      - "TV002"
  - id: "capitalization-and-valuation-context"
    title: "Capitalization and Financing Context"
    body: "Loggi’s capitalization history reflects substantial institutional backing from top-tier venture capital and growth equity investors. Following early seed and Series A rounds including US$3.3 million from Qualcomm Ventures and Dragoneer Investment Group, SoftBank deployed US$100 million in October 2018 as part of a US$111 million Series D financing round alongside KaszeK Ventures. In June 2019, SoftBank led a subsequent US$150 million investment round that valued Loggi at over US$1 billion, formally establishing the startup as a Brazilian unicorn. The company reached its peak reported private valuation in March 2021 by securing US$205 million in Series F funding led by CapSur Capital with participation from Brazilian hedge fund Verde Asset Management, bringing its private post-money valuation close to US$2.0 billion. Despite this impressive primary financing pedigree, current secondary market evidence fails to validate this historical valuation anchor. Data from secondary trading platform Forge Global reveals limited private trading activity, with no recent matched transaction prices, no established post-money valuation marks, and no active liquidity clearing. Furthermore, private secondary share transactions carry severe illiquidity risks where investors cannot readily exit, leaving prospective participants exposed to significant potential capital impairment."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
    figureRefs:
      - "FV001"
  - id: "valuation-scenarios-and-benchmarks"
    title: "Valuation Scenarios and Benchmarking"
    body: "Evaluating Loggi under prevailing macroeconomic conditions requires decoupling historical private peak marks from observable market multiples and operating performance. In our bull case, Loggi successfully achieves sustained operating profitability, defends its courier contractor model against legal appeals, and expands parcel throughput at over 25% annually. Under this trajectory, an eventual public listing or strategic buyout could value the business at US$2.0 billion to US$2.5 billion, reflecting 2.0x to 2.5x net platform revenue. In the base case, multiple contraction across global and Latin American technology-enabled logistics providers and slower consumer ecommerce growth compress the valuation to between US$1.0 billion and US$1.4 billion (1.2x to 1.5x net revenue), closely tracking the 2019 SoftBank unicorn benchmark. Under the bear case, continued operating cash burn, fuel and wage inflation, or an adverse legal reclassification of couriers would trigger a distressed recapitalization or asset sale valuing Loggi at US$400 million to US$600 million (0.5x net revenue). Given that senior preferred shares from CapSur and SoftBank likely hold liquidation preferences, a bear outcome would severely dilute common and early preferred equity holders."
    claimRefs:
      - "CV001"
      - "CV003"
      - "CV004"
      - "CV012"
      - "CV013"
    tableRefs:
      - "TV003"
  - id: "recommendation-and-diligence-path"
    title: "Recommendation and Diligence Priorities"
    body: "Based on verified public evidence, we assign Loggi an overall research-more recommendation with a medium confidence score, high risk rating, and stretched valuation stance. Loggi’s national operational reach, 1,700+ collection points, and recognized brand provide undeniable enterprise strategic value. However, the lack of audited financial statements detailing recent net revenues, gross margins, EBITDA, and balance-sheet cash reserves precludes a buy recommendation at anywhere near the historical ~US$2.0B valuation anchor. Secondary market illiquidity on platforms such as Forge Global underscores that private price marks from early 2021 do not reflect current risk-adjusted valuations. Prospective investors must impose strict entry price discipline and condition any capital allocation on comprehensive private diligence. Crucial diligence milestones include reviewing audited post-2021 financial statements, analyzing cohort-level gross retention across ecommerce merchants, inspecting the senior liquidation preference stack, and stress-testing courier unit economics against potential regulatory changes in Brazilian labor law."
    claimRefs:
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV012"
      - "CV014"
    tableRefs:
      - "TV001"
