      - number: '1.4'
        title: 运营里程碑、劳动判例与网络扩张
        blocks:
          - type: paragraph
            body: >-
              Loggi 的运营轨迹显示，公司已从城市当日摩托车快递调度转向全国包裹分拣，并持续调整业务模式。新冠疫情期间，办公室文件配送下降，公司将大量网络能力转向全国电商包裹配送，并与主要商户合作。关键在于，Loggi 于
              2021 年赢得具有里程碑意义的劳动法院诉讼，确认其注册配送骑手和司机属于独立承包商而非正式员工，从而缓解巴西劳动法下的重大生存风险。目前实体网络包括超过 1,700 个 LoggiPonto 投递点、超过 20
              万名注册合作配送员，并具备覆盖 4,000 个巴西市级行政区的配送能力。
            claimRefs:
