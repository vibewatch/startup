              万名注册合作配送员。合规和治理上，巴西劳动法院确认配送员是自主独立承包商而非正式员工，为运营模式提供结构性灵活性。然而，技术和运营风险仍然显著。公司关于人工智能、机器人和自动路线优化的算法性能主张，尚无独立技术审计或公开基准支持。此外，依赖消费级移动设备和
