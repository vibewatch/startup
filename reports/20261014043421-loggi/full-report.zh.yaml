  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群细分与多层需求结构
        blocks:
          - type: paragraph
            body: >-
              Loggi 在巴西同时服务大型企业电商客户和区域中小企业商户，采取双层商业策略。企业层面，公司服务综合型市场平台、百货连锁和专业全国零售商，这些客户需要可靠的全国包裹运输和高吞吐峰值管理。主要企业客户包括
              Sephora 等全球美容巨头、Pandora 和 Vivara 等奢侈珠宝品牌、Tok&Stok 等家居零售商，以及 Lojas Torra 等高货量服装连锁。对这些企业发货方而言，Loggi
              是连接履约中心与终端消费者的战略物流伙伴，提供预约取件、通过 Cajamar 等中央枢纽自动交叉转运，以及末端城市路由。同时，Loggi
              通过移动和网页应用平台服务长尾商户，使个人创业者和本地企业可通过即时快递收件或超过 1,700 个 LoggiPonto 认可投递点发货，起价为 R$5.89。这种双边需求架构让 Loggi
              以企业合同维持基础负载利用率，同时从长尾商业发货方获取更高利润率的交易量。
            claimRefs:
