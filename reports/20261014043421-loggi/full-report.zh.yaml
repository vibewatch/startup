      - number: '4.2'
        title: 成本结构与单位经济杠杆
        blocks:
          - type: paragraph
            body: >-
              Loggi 的成本结构主要由可变物流执行成本和分拣基础设施决定 [CI005]。每笔配送交易中，Loggi 将大部分总费用分配给独立配送员，保留剩余价差用于技术开发、路由算法、分拣枢纽和行政管理费用
              [CI005]。运营灵活性建立在独立承包商配送模式上，该模式得到巴西劳动法院裁决确认，法院认定平台配送员自主运营而非正式工资员工
              [CI006]。这一法律先例使公司免受通常会推高巴西运营成本的大额法定工资税和雇佣义务影响 [CI006]。

              为支持全国分销而无需大量房地产投资，Loggi 扩展了超过 1,700 个 LoggiPonto 合作投递点的网络，并动员超过 20 万名注册合作配送员 [CI008]。平台货量从 2019 年每日 10
              万件增长至覆盖超过 3,500 个市级行政区的每日约 30 万轮配送 [CI009]。尽管实体规模可观，Loggi 未公开报告毛利率、干线运输成本或本地枢纽贡献利润率
              [CI005]。因此，次级城市的包裹密度能否覆盖分拣和干线运输仍是未解决的尽调障碍。
            claimRefs:
              - CI005
              - CI006
              - CI008
              - CI009
