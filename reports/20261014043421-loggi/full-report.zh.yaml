  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Loggi
              横跨巴西货运领域的两个相互关联的细分市场：城内即时摩托车快递调度和全国电商包裹物流。其可服务边界包括小件快运、文件快递路线以及面向数字商业平台的企业对消费者包裹配送；明确不包括工业大宗货运、州际重型卡车运输、托盘货物和国际清关。在城市快递领域，现状替代方案是非正式摩托车快递员，其分散的调度网络过去缺乏数字追踪、标准化定价和自动电子开票。在全国包裹运输中，主要现有替代者是国有邮政运营商
              Correios 及传统区域货运商。Loggi 将路线优化软件与分散式投递点结合，把非正式快递运力转化为结构化商业物流。
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
      - number: '2.2'
        title: TAM/SAM 规模化视角与宏观增长基准
        blocks:
          - type: paragraph
            body: >-
              评估巴西技术驱动物流的可服务市场，需要从多个结构性支出角度考察。宏观来看，巴西物流运营约占全国 GDP 的 12.7%，高于美国的
              7.8%，构成显著支出负担。该成本差异反映物流复杂性、区域距离和分散的道路基础设施，也创造了对数字效率的经济需求。在区域末端和包裹配送领域，McKinsey & Co. 的独立研究发现拉丁美洲年增长率约为
              14%。此外，国内电商扩张至约 230 亿美元零售交易额，直接扩大了灵活包裹履约的需求。Loggi 在 2021 年融资周期形成据估计约 $2b
              亿美元私人估值锚点，但巴西物流行业的私人报告标准使次级城市的经审计货运量难以确认。
            claimRefs:
              - CM003
              - CM004
              - CM011
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM011
              - CM013
              - CM014
          - type: figure
