  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 将运营规模、资本历史、流动性限制及估值分析依次连接至“继续研究”建议的尽调流程。
    data:
      nodes:
        - label: 1. 运营规模与覆盖
          detail: 全国网络每日配送 300k 单，由专有调度及分拣技术提供支持。
        - label: 2. 风险投资历史
          detail: SoftBank、CapSur 和 Verde Asset Management 领投的累计股权融资超过 4.8 亿美元。
        - label: 3. 峰值估值锚点
          detail: 历史 20 亿美元估值源于 2021 年 3 月的 Series F 融资轮。
        - label: 4. 二级市场流动性不足
          detail: Forge Global 报告市场活动有限，没有匹配价格或公开交易。
        - label: 5. 财务与股权结构表缺口
          detail: 缺少 2021 年之后的经审计财务数据、利润率核对及优先股堆叠透明度。
        - label: 6. 继续研究建议
          detail: 估值立场偏高，要求定价严守在私人市场峰值水平以下。
    approximationNotes: 流程展示从运营证据到投资建议的定性分析决策路径。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV007
      - CV012
      - CV014
