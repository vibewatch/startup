            body: >-
              公开客户披露和案例研究证明，Loggi 已被巴西多个要求严苛的商业垂直领域采用。在运动和生活方式零售领域，运动服装品牌 Track&Field 认可 Loggi 在疫情期间支持其线上销售增长 5
