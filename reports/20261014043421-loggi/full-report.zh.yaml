            body: >-
              Loggi 利用受巴西劳动法院裁决支持的独立承包商网络，并扩展 1,700 多个合作投递点，将相当一部分物流劳动转为可变成本。但员工人数从 4,319 人降至 2,732
              人，表明公司和分拣管理费用仍承受持续精简压力。
            calloutType: insight
            claimRefs:
