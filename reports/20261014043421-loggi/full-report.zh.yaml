chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、使命与平台架构
        blocks:
          - type: paragraph
            body: >-
              Loggi 是一家技术驱动的物流基础设施公司，于 2013 年在巴西圣保罗成立。公司最初搭建城市即时调度平台，将企业发货方和餐厅与大圣保罗地区的摩托车配送员匹配。随着经营发展，Loggi
              从城内快递扩展至全国物流网络，为小企业、直接面向消费者的零售商和大型企业市场提供服务。其核心技术平台整合自动调度算法、移动应用流程和 ERP 发货集成，使商业发货方能够在巴西各地自动完成包裹贴标、追踪和路线排程。
            claimRefs:
              - CO001
              - CO011
              - CO012
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO006
              - CO009
              - CO010
      - number: '1.2'
        title: 创始团队、高管治理与关键人员结构
        blocks:
          - type: paragraph
            body: >-
              Loggi 由软件工程师 Arthur Debert、产品设计师 Eduardo Wexler 和法裔巴西企业家 Fabien Mendez
              组成的跨职能团队创立。创始人将软件工程和运营分析结合起来，推动巴西传统上分散且非正式的城市快递生态数字化。管理层在圣保罗负责平台运营、交叉转运设施和公司治理。关键管理维度包括监管合规和公共政策应对，由
              Vanessa Isidoro 负责，她主导了公司的用工诉讼抗辩及市级监管合作。关键人员依赖仍集中于负责全国承包商关系的早期技术架构师和法律策略人员。
            claimRefs:
              - CO002
              - CO003
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
              - CO003
      - number: '1.3'
        title: 资本化历史、估值轨迹与投资者联合体
        blocks:
          - type: paragraph
            body: >-
              自 2013 年天使轮资本化以来，Loggi 通过六轮主要股权融资累计筹集约 4.86 亿美元。Qualcomm Ventures 和 Dragoneer Investment Group
              的早期支持验证了公司的移动调度软件模式。2018 年 10 月，软银愿景基金以 1 亿美元承诺成为领投方；随后其在 2019 年 6 月领投 1.5 亿美元 C 轮，使 Loggi 以 10
              亿美元投后估值达到独角兽地位。2021 年 2 月，Capsur Capital 领投 2.05 亿美元 D 轮，形成据估计约 20 亿美元的私人估值锚点，Microsoft、Verde Asset
              Management、Monashees 和 Advent International 参与支持。
            claimRefs:
              - CO004
              - CO005
