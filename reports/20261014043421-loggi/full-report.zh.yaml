              - CI005
              - CI006
              - CI013
      - number: '4.3'
        title: 资本充足性与融资轨迹
        blocks:
          - type: paragraph
            body: >-
              Loggi 的资产负债表历史上由大型风险投资轮次资本化，最终在 2021 年初由软银拉美基金领投 $205m 至 $212m 的 F 轮融资，估值据估计约 $2b [CI011]。此前软银愿景基金于 2019
              年领投 $150m 的 D 轮，使公司以 $1b 估值获得独角兽地位，累计融资约 $295m [CI012]。然而，Loggi 自 2021 年以来没有宣布主要股权融资，投资者审查因此转向运营资金续航和资本纪律
              [CI011]。

              近期员工数据显示正在进行成本合理化：跟踪到的员工数从 2025 年的 4,319 人降至 2026 年的 2,732 人，正式公司及运营人员减少 37%
              [CI013]。与此同时，二级市场数据表明流动性受限：私人交易平台报告活动有限，且 Loggi 股权没有形成稳定的清算股价 [CI014]。此外，外部跟踪显示，截至 2026 年 8 月，Loggi
              的投资排名下降 64 位，网站流量排名下降 49 位，表明在私人融资长期暂停期间外部势头降温 [CI015]。
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: 财务结论与尽调承保障碍
        blocks:
          - type: paragraph
            body: >-
              从投资判断角度看，Loggi 展示了可行的轻资产包裹配送模式、已验证的全国触达、大规模企业商户集成和可变劳动成本结构 [CI001,
              CI005]。确认独立承包商分类的法律胜利保护了其核心单位经济，避免严重工资膨胀 [CI006]。但公司处于资本密集型物流行业，行业毛利率薄、配送竞争激烈，巴西分散的基础设施带来高运营摩擦 [CI005,
              CI009]。

              缺少经审计净收入、每条线路毛利率、运营 EBITDA 和现金余额数据，造成重大投资判断障碍 [CI001, CI011]。鉴于拉丁美洲风险投资估值随后经历宏观重置且二级流动性不足，陈旧的 2021 年 $2b
              亿美元估值锚点无法与当前市场可比对象验证 [CI011, CI014]。潜在投资者在投入资本前，必须优先取得经审计的 FY2023 至 2026
              年上半年财务报表、中小企业商户群组留存曲线，以及城市快递与跨区域线路的详细单位贡献指标。
            claimRefs:
              - CI001
              - CI005
              - CI006
              - CI009
              - CI011
              - CI014
      - number: '4.5'
        title: 展示项
        blocks:
          - type: callout
            title: 披露不透明阻碍独立毛利率和资金续航判断
            body: 自 2021 年 F 轮以来，Loggi 未公开披露经审计财务报表、净收入或现金消耗率。虽然配送量指标显示其在巴西具备较大实体规模，但在无法取得管理账目的情况下，投资判断方无法核实路线密度是否实现正单位经济。
