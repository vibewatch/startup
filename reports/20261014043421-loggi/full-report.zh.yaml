      - number: '6.4'
        title: 留存持久性、集中风险与增长放缓
        blocks:
          - type: paragraph
            body: >-
              尽管企业品牌采用广泛，Loggi 仍面临显著的商业集中风险、利润率压力及平台吸引力放缓的可观察迹象。公司高度依赖 Amazon 和 Mercado Livre
              等大型电商平台，使其分拣和干线网络暴露于较高客户集中风险，尤其是在市场平台运营商持续投资自有物流基础设施和专属配送网络之际。此外，RankmyAI 的独立市场基准跟踪显示竞争摩擦正在出现：截至 2026 年 8
              月的九个月内，Loggi 平台总排名下降 17 位，网站流量排名下降 49 位，投资兴趣排名下降 64
              位。商业可持续性也与配送员劳动动态内在相关；尽管巴西劳动法院裁定平台配送员是自主承包商而非正式员工，持续法律审查和配送员留存成本仍对服务可靠性构成结构性风险。包括净收入留存率（NRR）、毛收入留存率（GRR）及多年客户群组流失率在内的关键尽调指标，管理层均完全未披露，使
              Loggi 客户经济的长期持久性成为未解决的投资判断缺口。
            claimRefs:
              - CU008
              - CU010
              - CU012
              - CU014
      - number: '6.5'
        title: 展示项
        blocks:
          - type: callout
            title: 发货方之间的分化物流架构
            body: Loggi 的客户群在结构上分为两类：需要全国交叉转运的高货量企业电商平台，以及利用应用投递点的长尾商户。
            calloutType: insight
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: callout
            title: 集中度与吸引力阻力
            body: 企业客户背书验证了运营能力，但头部账户的市场平台集中度，以及网站流量和投资排名最近九个月的下降，显示出竞争摩擦。
            calloutType: risk
            claimRefs:
              - CU008
              - CU012
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管框架与配送员劳动诉讼
        blocks:
          - type: paragraph
            body: >-
              Loggi 运营分布式城市配送模式，将发货方与巴西各地的摩托车配送员和骑手连接起来。平台商业可行性历来取决于配送员队伍的法律身份。虽然 Loggi
              从巴西劳动法院取得里程碑式裁决，确认配送员是自主独立承包商而非享有法定福利的带薪员工，但这一法律基础本质上仍不稳固。巴西检察机关一直积极提起集体诉讼挑战零工经济平台，法律负责人也承认，最高劳动法院（TST）的上诉程序和政治行政变化可能重新开启承包商重新分类审查。司法逆转将对数万名活跃配送员征收高额追溯工资税、强制遣散基金（FGTS）及社会保障缴款，直接瓦解平台贡献利润。
            claimRefs:
              - CR001
              - CR002
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR012
      - number: '7.2'
        title: 运营可扩展性与数据架构脆弱性
        blocks:
          - type: paragraph
            body: >-
              在全国运营规模下，Loggi 必须协调 27
              个巴西州的包裹接收、交叉转运和末端调度，包括亚马孙流域的偏远物流节点。运营稳定性高度依赖数字路由和实体交叉转运分拣基础设施。内部快速扩张造成严重数据工程蔓延：18,000 个 Looker
              仪表板和每夜运行八小时、更新 500 张 Redshift 表的 ETL 批处理。午夜批处理中的延迟或管线故障会直接推迟配送计划生成和配送员调度，威胁客户服务水平协议。虽然采用 OpenMetadata 并删除
              7,000 张冗余表使查询运行时间缩短 30%，但 Loggi 仍暴露于 Cajamar 等高速分拣枢纽的单点故障漏洞；BEUMER Group 的自动化线式分拣机在这些枢纽处理无法轻易人工改道的巨大包裹量。
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR014
      - number: '7.3'
        title: 市场平台依赖与宏观物流经济
        blocks:
          - type: paragraph
            body: >-
              Loggi 的商业模式从即时文件快递转向全国电商包裹履约，并与 Amazon、Mercado Livre
              等零售聚合平台合作。这一结构性转向造成显著的交易对手集中度和商业脆弱性。市场平台拥有巨大的议价能力，可以要求激进的价格让步，或建立替代第三方供应商的自有履约和配送网络。此外，巴西宏观经济状况带来结构性成本阻力：物流成本约占巴西
              GDP 的 12.7%，而美国为 7.8%，原因包括道路基础设施不达标、货物盗窃风险和燃油价格波动。在迈向管理层长期目标——每日 500
              万件包裹——的同时管理这些结构性间接成本，会造成巨大的资本密集度和持续的运营执行风险。
            claimRefs:
              - CR005
              - CR008
              - CR010
              - CR011
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR008
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR008
              - CR010
              - CR013
      - number: '7.4'
        title: 风险缓释成熟度与尽调重点
        blocks:
          - type: paragraph
            body: >-
              为保护企业估值并迈向可持续盈利，Loggi
              已采取实体自动化和数据治理措施，缓解运营压力。集成模块化线式分拣机保留运营灵活性，避免公司被锁定在僵化分拣架构中；集中式数据编目则改善事件分诊和每日路线优化。然而，对机构投资者而言，关键投资论点断点仍未解决。确认性尽调必须审查待决劳动诉讼准备金、检查锚定电商账户的双边客户留存群组，并评估偏远非大都市配送线路的单位经济。配送员就业问题的不利上诉裁决，或头部市场平台伙伴的货量损失，将从根本上改变
              Loggi 的流动性续航和 IPO 前资本需求。
            claimRefs:
              - CR001
              - CR004
              - CR006
              - CR009
              - CR014
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 劳动承包商重新分类是生存性下行风险
            body: >-
              Loggi 的单位经济和运营灵活性取决于将其 40,000
              多名活跃配送员视为独立承包商。巴西劳动法院虽作出支持该自主性的关键裁决，但最高劳动法院（TST）可能受理上诉，加之政治审查不断变化，法律风险仍在。任何强制重新分类都会带来工资税、法定福利和严重补发工资负债，使当前运营利润率失效。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
          - type: callout
            title: 数据管线卫生是运营关键支点
            body: >-
              Loggi 快速扩张造成严重内部数据蔓延，包括 18,000 个 Looker 仪表板和跨 500 张表、每夜运行八小时的 ETL 作业。在每天必须跨 27 个州动态路由 300,000
              多件包裹的物流即服务模式中，数据延迟会直接造成调度延迟和司机闲置。OpenMetadata 自动治理和实体线式分拣机已稳定吞吐量，但持续监控仍不可或缺。
            calloutType: insight
            claimRefs:
              - CR003
              - CR004
              - CR014
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Loggi 在巴西运营着关键的全国配送网络，将自研移动调度软件、交叉转运分拣中心与超过 40,000 名注册骑手结合起来；这些骑手每天在城市及区域线路上完成约 300,000
              个配送班次。看多逻辑的核心是巴西结构性的物流缺口：运输摩擦高、承运商基础设施分散，为聚合型技术平台筑起持久的竞争壁垒。平台宣传次日达起价 R$ 4，电商包裹配送历史上约占平台运量的 35%；Loggi
              以软件驱动的模式，消除传统枢纽辐射网络的低效，从配送中获取利润。反过来看，看空逻辑聚焦于严重的结构性利润挤压和持续的运营风险。基础配送费低，只有形成极高的订单密度，支付骑手费用后平台才可能获得正贡献利润。此外，尽管巴西劳动法院已确认
              Loggi 骑手属于独立承包商而非雇员，公司法务负责人也承认，相关法律框架仍可能受到司法上诉和巴西监管变化的影响。一旦法律解释转向不利方向，平台的单位经济模型和运营可行性都会立刻受损。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.2'
        title: 资本结构与融资背景
        blocks:
          - type: paragraph
            body: >-
              Loggi 的资本化历程得到顶级风险投资和成长型股权投资机构的大力支持。早期种子轮和 A 轮融资中，Qualcomm Ventures 与 Dragoneer Investment Group 等投资了
              US$3.3 million；随后 SoftBank 于 2018 年 10 月投入 US$100 million，参与 KaszeK Ventures 同轮的 US$111 million D 轮融资。2019
              年 6 月，SoftBank 又领投 US$150 million 轮融资，使 Loggi 估值超过 US$1 billion，正式跻身巴西独角兽。2021 年 3 月，公司由 CapSur Capital
              领投、巴西对冲基金 Verde Asset Management 参与，获得 US$205 million 的 F 轮融资，公开报道的私有市场估值达到峰值，投后估值接近 US$2.0
              billion。尽管一级融资履历亮眼，当前二级市场证据却无法验证这一历史估值锚点。二级交易平台 Forge Global
              的数据表明，私募交易活动有限：近期没有撮合成交价，没有形成投后估值标记，也没有活跃的流动性清算。更重要的是，私募二级股份交易流动性极差，投资者难以退出，潜在参与者因此暴露于严重的资本减损风险。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV007
              - CV012
              - CV014
      - number: '8.3'
        title: 估值情景与基准比较
        blocks:
          - type: paragraph
            body: >-
              当前评估 Loggi 时，必须把历史私有市场峰值估值与可观察的市场倍数及经营表现拆开来看。乐观情景下，Loggi 实现持续经营盈利，抵御针对骑手承包商模式的法律上诉，并将包裹吞吐量每年扩大超过
              25%。沿着这条路径，未来上市或战略收购可能给公司 $2.0b 至 $2.5b 的估值，对应平台净收入的 2.0x 至
              2.5x。基准情景下，全球及拉美技术物流服务商的估值倍数收缩，叠加消费电商增长放缓，将估值压到 $1.0b 至 $1.4b（净收入的 1.2x 至 1.5x），大致回到 2019 年 SoftBank
              独角兽估值基准。悲观情景下，经营现金持续消耗、燃油和工资通胀，或骑手遭不利的法律重新归类，将触发困境式资本重组或资产出售，使 Loggi 估值落在 $400m 至 $600m（净收入的 0.5x）。由于
              CapSur 和 SoftBank 持有的优先股堆叠很可能享有清算优先权，悲观结果会严重稀释普通股和早期优先股持有人的权益。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV012
              - CV013
      - number: '8.4'
        title: 建议与尽调重点
        blocks:
          - type: paragraph
            body: >-
              根据已核实的公开证据，我们对 Loggi 的总体建议为继续研究，置信度中等、风险评级高，估值偏高。Loggi 的全国运营覆盖、1,700+
              个收寄点和知名品牌，确实构成不可忽视的企业战略价值。但公司没有披露涵盖近期净收入、毛利率、EBITDA 和资产负债表现金储备的经审计财务报表，因此不支持在接近历史 ~US$2.0B
              估值锚点的价位给出买入建议。Forge Global 等平台上的二级市场流动性不足也说明，2021
              年初的私有市场价格标记并不代表当前经风险调整的估值。潜在投资者必须严格控制入场价格，任何资本配置都应以全面的私有市场尽调为前提。关键尽调节点包括审阅 2021
              年之后的经审计财务报表、分析电商商户层面的毛收入留存率、检查高级别清算优先股堆叠，并针对巴西劳动法可能发生的监管变化压力测试骑手单位经济模型。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV012
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV012
              - CV014
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 估值立场：私有市场峰值倍数下继续研究
            body: >-
              Loggi 的强势品牌、自有分拣资产，以及经核实的 300,000 单日配送规模，使其成为巴西不可或缺的物流基础设施资产。然而，在没有经审计财务披露和二级市场价格发现的情况下，按其 2021 年 ~US$2.0B
              估值或接近该估值入场，无法得到支持。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV004
              - CV012
          - type: callout
            title: 下行悬顶：私募股份流动性不足与股权结构表次级地位
            body: Forge Global 没有活跃的二级交易市场，IPO 也比早期预期更晚，潜在投资者将面临严重的流动性锁定，以及高级融资轮次可能带来的清算优先权悬置。
            calloutType: risk
            claimRefs:
              - CV004
              - CV005
              - CV014
