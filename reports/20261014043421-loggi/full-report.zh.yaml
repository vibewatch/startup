  - id: FI001
    title: 收入模式桥接图
    type: flow
    summary: 从客户包裹交易调度到平台物流净贡献的结构性转化流程。
    data:
      nodes:
        - label: 创建客户订单
          detail: 发货人通过 API、网页平台或移动应用预订本地或全国包裹配送。
        - label: 动态路线与运费计算
          detail: 平台算法计算距离、包裹重量及配送 SLA 费率。
        - label: 骑手匹配与调度
          detail: 按需调度，将摩托车、厢式车或收集点的独立骑手进行匹配。
        - label: 配送总额计费
          detail: 向客户收取基础费用（R$ 4.00-R$ 5.89）及距离和加急附加费。
        - label: 骑手报酬分配
          detail: 大部分配送费直接转给独立承包骑手，计入直接销货成本。
        - label: 平台净利润率留存
          detail: 留存剩余的平台贡献，用于支持技术、分拣枢纽及销售、一般和行政费用。
    approximationNotes: 流程依据已公布的商业模式描述，展示定性转化机制；具体成本分摊及利润率属于私有信息。
    claimRefs:
      - CI001
      - CI002
      - CI004
      - CI005
  - id: FE001
    title: Loggi 技术与物流运营架构
    type: stack
    summary: 展示 Loggi 集成 API、算法路由引擎、分拣枢纽及骑手执行层的多层架构栈。
    data:
      layers:
        - label: 商户与渠道集成层
          detail: REST API（docs.api.loggi.com）、EDI 协议，以及面向 Shopify、Bling、Tray 和 Olist 等平台的预构建连接器。
        - label: 订单接入与标签生成服务
          detail: 动态运费报价、自动创建包裹、标准化标签打印，以及包裹修改 / 取消。
        - label: 算法调度与路线优化引擎
          detail: 自动化骑手匹配算法利用司机移动 GPS 遥测数据计算路线并安排节点顺序。
        - label: 实体分拣与越库基础设施
          detail: 区域物流设施，包括用于整合城际干线运输的 Cajamar 越库分拣中心。
        - label: 末端配送与投递网
          detail: 由 1,700 多个 LoggiPonto 投递点及注册摩托车和轻型车辆骑手组成的分布式网络。
        - label: 收件人沟通与遥测层
          detail: 自动发送短信 / 电子邮件配送节点通知，提供在线司机协助及公开追踪查询界面。
    approximationNotes: 架构分层综合自已公布的开发者文档、承运商概览及运营披露。
    claimRefs:
      - CE001
      - CE005
      - CE009
      - CE010
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 企业及中小商户从接入到全国履约及持续留存的采用旅程。
    approximationNotes: 代表商户从自助入驻到企业集成及持续扩张的典型生命周期阶段。
    claimRefs:
      - CU011
      - CU002
      - CU010
    data:
      nodes:
        - id: onboarding
          label: 探索与创建账户
          description: 商户通过 Loggi 移动应用或网页门户注册个人及商业配送方案。
          touchpoints:
            - Self-service web portal
            - Loggi mobile application
        - id: integration
          label: API 与电商集成
          description: 卖家接入物流 API，或直接与市场及电商平台集成。
          touchpoints:
            - Logistics API documentation
            - E-commerce platform plugins
        - id: dispatch
          label: 包裹交接与投递
          description: 发货人可选择按需上门收件，或将包裹投递到获认可的 LoggiPonto 网点。
          touchpoints:
            - 1,700+ LoggiPonto drop-off points
            - On-demand courier collection
        - id: sorting
          label: 越库与分拣
          description: 包裹经包括 Cajamar 在内的全国枢纽整合，完成自动化越库及干线运输。
          touchpoints:
            - Cross-docking facilities
            - Automated sortation centers
        - id: delivery
          label: 末端配送与追踪
          description: 独立骑手配送包裹，并提供实时 GPS 追踪及收件人通知。
          touchpoints:
            - Real-time recipient tracking portal
            - Courier mobile app
        - id: expansion
          label: 全渠道业务量扩张
          description: 商户从本地当日达扩展至覆盖 4,000 多个市镇的全国配送。
          touchpoints:
            - Dedicated account management
            - National shipping analytics dashboard
