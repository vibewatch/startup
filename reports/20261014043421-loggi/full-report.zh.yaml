  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Loggi 从城市骑手软件发展为全国性电商物流平台的时间脉络。
    approximationNotes: 里程碑反映已公布的融资日期、法律裁决及服务扩张披露。
    data:
      items:
        - date: 2013-10
          label: 公司成立
          detail: Arthur Debert、Eduardo Wexler 和 Fabien Mendez 在圣保罗创立 Loggi，将按需摩托车配送数字化。
          claimRefs:
            - CO001
            - CO002
        - date: 2014-11
          label: Series A 融资
          detail: Qualcomm Ventures 和 Dragoneer Investment Group 投资 330 万美元，拓展城市摩托车物流。
          claimRefs:
            - CO004
        - date: 2018-10
          label: SoftBank Series B 轮
          detail: SoftBank Vision Fund 投入 1 亿美元，加快在巴西全国建设配送基础设施。
          claimRefs:
            - CO004
            - CO005
        - date: 2019-06
          label: 独角兽地位（Series C）
          detail: Loggi 在 SoftBank 领投、Microsoft 和 Velt Partners 参与的融资中筹得 1.5 亿美元，估值达到 10 亿美元。
