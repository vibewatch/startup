            body: >-
              Loggi
              运营技术驱动的配送平台，旨在解决巴西境内城市和城际发货摩擦。公司提供三类主要服务：使用即时两轮车和轻型车辆配送员的同日城内快递、服务电商发货方的全国包裹配送，以及通过指定收集点进行的投递整合。在商户工作流中，该服务借助程序化端点和无代码连接器，将配送调度、路线计算和包裹追踪抽象出来。发货方计算动态运费报价、生成标准化运单标签，再通过上门快递收件或认可的区域合作点投递包裹，发起配送。包裹经
              Loggi 分销网络路由，移动遥测和实时包裹状态事件在整个运输生命周期内持续向商户和收件人更新信息。
