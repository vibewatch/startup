            body: >-
              Loggi 的运营版图已从城市摩托车快递调度服务大幅扩展为全国物流即服务基础设施提供商。平台公布的分销网络覆盖巴西超过 4,000 个市级行政区，在该国城市和区域电商市场实现接近普遍的触达。供给侧网络规模由超过
              20 万名注册合作配送员支持，配送员使用摩托车、自行车和货车，并与超过 1,700 个实体收集点协同。历史运营披露显示，Loggi 过去曾在 3,500 个社区执行每日约 30 万轮配送，早期基线则是覆盖 33
