  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与定价架构
        blocks:
          - type: paragraph
            body: >-
              Loggi 运营物流即服务平台，通过巴西境内的本地即时调度和全国配送实现包裹运输变现 [CI001]。商业架构结合公开的入门费率和按距离、重量计算的费率表 [CI002]。对于大批量电商发货方，Loggi
              宣传次日配送费率从 R$ 4.00 起，面向寻求低于传统邮政替代方案运费的商户 [CI002]。在消费者和零售包裹配送中，Loggi 通过认可的投递点或预约上门收件，公布全国配送入门费率从 R$ 5.89 起
              [CI003]。

              变现机制按客户类型分化：零售消费者支付固定调度费，企业商业发货方则按路线距离、包裹体积尺寸和服务紧迫程度确定可变费率卡 [CI004]。商业配送是核心货量驱动因素，使用厢式车和小型卡车的电商包裹履约约占总销售量的
              35% [CI007]。与 Amazon、Mercado Livre 等主要市场平台和零售商的企业合作，为关键城市走廊提供必要货运密度
              [CI010]。不过，公开费率反映的是最低基础价格而非实际实现的净收入收益率，因此在缺少合同级货量披露的情况下，承销方无法确定每次配送的平均实现价格。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI007
