      - number: '2.3'
        title: 买方细分、工作流集成与预算归属
        blocks:
          - type: paragraph
            body: >-
              Loggi 面向四类商业客户，每类都有特定采购流程和预算权限。企业数字商务零售商是包裹量最大的层级，采购由供应链负责人主导，关注配送可靠性和程序化 API 调度。Loggi
              为这些商户提供自动运费报价、实时客户追踪通知和批量取件物流。中型线上商户及区域零售店通过自助网页门户操作，将包装商品投放到认可的本地收集点（LoggiPonto），起始竞争性基础运费为 R$
              4。地方商业商户和餐厅从每日门店运营预算中支付即时摩托车配送费用。个人消费者通过移动应用预订个人包裹的临时配送，绕过邮政排队。
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
              - CM012
      - number: '2.4'
        title: 结构性增长驱动因素与监管采用约束
        blocks:
          - type: paragraph
            body: >-
              Loggi 的商业扩张由电商渗透率长期上升、商户对有竞争力运费的需求以及全国收集网络扩张推动。公司称服务覆盖超过 3,500 个市级行政区，通过逾 1,700 个收集点和 20 万名注册合作配送员触达巴西约
              90%
              的全国地域。然而，这一增长轨迹面临关键结构性阻力，其中核心是对配送员雇佣身份的法律和监管审查。尽管巴西劳动法院作出关键裁决，确认配送员是自主独立承包商而非工资员工，但持续的司法上诉和不断变化的市级交通法规带来持续运营及利润风险。此外，资本密集度和巴西偏远地区的实体基础设施缺口限制了全国配送经济性。
            claimRefs:
              - CM003
              - CM007
              - CM008
              - CM009
              - CM010
              - CM012
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 巴西的结构性物流成本优势
            body: 巴西物流成本基线高达 GDP 的 12.7%，相较发达市场形成强烈的末端配送数字化路线需求。
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
          - type: callout
            title: 劳动分类波动是采用瓶颈
            body: 巴西司法裁决虽确认零工配送员的独立承包商模式，但持续监管审查和上诉风险仍使单位运营成本存在结构性不确定性。
            calloutType: risk
            claimRefs:
              - CM009
              - CM010
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与主要竞争者画像
        blocks:
          - type: paragraph
            body: >-
              巴西包裹和货运运输市场具有地理分散严重、基础设施瓶颈和物流摩擦高等特征，历史上消耗超过 GDP 的 12%。在这一环境中，Loggi
              作为技术优先的物流层，横跨三类竞争层级：国有邮政基础设施、成熟的私人合同承运商和市场平台自有物流网络。现有基础由国有垄断企业 Correios
              支撑，其覆盖每个巴西市级行政区的能力无可匹敌，但服务官僚化且在密集城市中心运输较慢。Total Express 和 Jadlog
              等传统私人快递商拥有广泛的区域枢纽网络和企业合同，但依赖传统调度框架。与此同时，电商市场平台加速数字化，自建或收购自有物流，最突出的是 Mercado Envios；Lalamove 等即时快递网络以及
              iFood、Rappi 等餐饮配送车队也在争夺本地城市快递运力。Loggi 以轻资产、算法路由的快递网络实现差异化，连接本地商户调度与全国包裹配送。
            claimRefs:
              - CP001
              - CP002
              - CP008
              - CP011
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP008
              - CP011
      - number: '3.2'
        title: 能力矩阵与竞争定位
        blocks:
          - type: paragraph
            body: >-
              对巴西零售领域配送平台的评估显示，软件架构、实体交叉转运规模和追踪可见性存在明显差异。传统承运商通过僵化的邮政分拣枢纽运输包裹，而 Loggi
              依靠移动路由软件和算法司机分配，协调点对点城市调度和区域交叉转运。平台从十个全国交叉转运中心及 4 万平方米的 Cajamar 分拣中心吸收高量运营遥测数据，该中心每天最多可分拣 100 1m
              件包裹，使圣保罗大都会区运输窗口缩短最多五小时。与 Correios 在邮局分支间歇性扫描条码的里程碑追踪不同，Loggi 通过短信和电子邮件提供实时 GPS 追踪及自动客户通知。超过 1,700 个认可
              LoggiPonto 投递点让小企业和独立商户可以绕开实体邮局排队。但面对 Mercado Envios 等市场平台自有网络，Loggi 缺乏原生结账排他性，必须保持更高路由效率并开放开发者
              API，以守住多平台商户货量。
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP005
              - CP012
              - CP014
      - number: '3.3'
        title: 定价模式、分销能力与转换成本
        blocks:
          - type: paragraph
            body: >-
              巴西物流的定价和包装反映了中小企业电商渠道激烈的价格透明度，以及大型企业零售商的协商合同费率。Loggi 的次日市内配送列表价从 R$ 4.00 起，消费者和商户移动应用中的全国入门运费从 R$ 5.89
              起，直接挑战邮政基础费率。为提升分销能力，Loggi 采用混合模式：商户既可通过 Loggi 快递网络直接交付货件，也可在 Loggi 应用内生成折扣 Correios PAC 和 Sedex
              运单。这种互操作性降低客户采用摩擦，使商户无需分别管理运营流程即可在多家承运商之间选择。小商户转换成本仍低，因为 Nuvemshop
              等运输聚合器和模块化电商平台允许卖家按价格和运输时间切换配送商。为建立留存壁垒，Loggi 利用其 1,700 个取件/投递网络和嵌入商户 ERP 的 REST API
              集成，提高依赖自动调度的中型零售商的运营转换成本。
            claimRefs:
              - CP003
              - CP004
              - CP007
              - CP008
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP007
              - CP010
              - CP012
      - number: '3.4'
        title: 壁垒持久性、商品化与现有企业不利威胁
        blocks:
          - type: paragraph
            body: >-
              Loggi 竞争壁垒的长期持久性受到承运商商品化、市场平台内包和配送员劳动稳定性的结构性阻力。Loggi 虽成功推翻了 2019 年将配送员认定为巴西劳动法下正式员工的不利劳动裁决，但维持逾 20
              万名配送员的自主网络，需要在燃油和车辆成本上升时持续提供收入激励。更重要的是，Mercado Libre 和 Amazon 等最大电商合作伙伴既是主要货量来源，也是生存性替代威胁。随着 Mercado
              Envios 在巴西扩张自有航空机队、履约中心和专属配送网络，锚定市场平台合同的货量面临结构性内包风险。疫情后电商常态化后，Loggi 于 2022 年裁减约 15%
              员工，使成本结构重新对齐单位层面盈利能力。为抵御区域快递商的商品化，Loggi 必须深化与非市场平台商户的软件集成，并守住其城市交叉转运速度优势。
            claimRefs:
              - CP005
              - CP010
