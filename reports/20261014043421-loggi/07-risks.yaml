callouts:
  - calloutType: "risk"
    title: "Labor Contractor Reclassification as Existential Downside Risk"
    body: "Loggi's unit economics and operational flexibility depend on treating its 40,000+ active couriers as independent contractors. While the Brazilian Labor Court issued a pivotal ruling supporting this autonomy, legal risks persist due to potential appeals before the Superior Labor Court (TST) and evolving political scrutiny. Any forced reclassification would impose payroll taxes, mandated benefits, and severe back-pay liabilities that would invalidate current operating margins."
    claimRefs:
      - "CR001"
      - "CR002"

  - calloutType: "insight"
    title: "Data Pipeline Hygiene as an Operational Linchpin"
    body: "Loggi's rapid expansion resulted in severe internal data sprawl, encompassing 18,000 Looker dashboards and a nightly eight-hour ETL job across 500 tables. In a logistics-as-a-service model where 300,000+ daily packages must be routed dynamically across 27 states, data latency directly causes dispatch delays and driver idle time. Automated governance via OpenMetadata and physical line sorters have stabilized throughput, but continuous monitoring remains essential."
    claimRefs:
      - "CR003"
      - "CR004"
      - "CR014"

