evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited revenue bridge, ARR definition, gross margin, burn, and cash runway disclosure.
    whyItMatters: >-
      The public pool shows rapid valuation repricing but does not provide enough accounting detail to judge durability
      or capital efficiency.
    diligencePath: >-
      Request management reporting pack, audited or reviewed financials, and board materials that define revenue
      recognition, ARR, and infrastructure spend.
    relatedQuestionRefs:
      - QO004
  - type: missing-source
    severity: material
    topic: customer-scale
    missingEvidence: Current customer count, named enterprise references, concentration, and geographic revenue split.
    whyItMatters: >-
      Without customer-scale evidence, it is hard to translate model buzz into durable commercial adoption or assess
      concentration risk.
    diligencePath: >-
      Request cohort-level customer data, top-customer mix, enterprise case studies, and developer/API revenue
      segmentation.
    relatedQuestionRefs:
      - QO004
  - type: missing-source
    severity: material
    topic: governance-map
    missingEvidence: >-
      Current board composition, voting/control rights, and full operating-entity structure across onshore and offshore
      vehicles.
    whyItMatters: >-
      The IPO and litigation narrative makes control, authorization, and disclosure mechanics central to underwriting
      governance quality.
    diligencePath: >-
      Obtain cap table, shareholder agreements, board roster, and current entity chart with listing-prep restructuring
      steps.
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: minor
    topic: valuation-markers
    missingEvidence: A reconciled chronology separating completed valuation marks from aspirational fundraising or IPO targets.
    whyItMatters: >-
      Later readers could otherwise overstate certainty by treating distinct valuation references as a single closed
      financing fact.
    diligencePath: >-
      Build a round-by-round financing memo with transaction dates, post-money values, and whether each figure reflects
      a closed round, database estimate, or press target.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A public TAM/SAM/SOM study or filing-quality workload segmentation for Moonshot's target markets by geography and
      buyer type.
    whyItMatters: >-
      Without a comparable market baseline, valuation and market-share work depends on proxy lenses rather than a clean
      denominator.
    diligencePath: >-
      Obtain analyst market studies, IPO filing language, or management materials that isolate model/API, consumer, and
      enterprise segments.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-owners
    missingEvidence: >-
      Customer-count, retention, and segment revenue disclosures showing who pays across subscription, API, and
      partner-led enterprise channels.
    whyItMatters: >-
      The current buyer map is evidence-backed inference rather than disclosed segment economics, which limits
      conviction on adoption pace and expansion potential.
    diligencePath: >-
      Request management cohort, NRR, customer-count, and revenue-mix data split by consumer, developer, and enterprise
      motions.
    relatedQuestionRefs:
      - QM003
      - QM004
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: ipo-valuation
    missingEvidence: >-
      A filed prospectus, signed financing term sheet, or consistent management disclosure that reconciles the >$30B and
      up-to-$50B IPO valuation signals.
    whyItMatters: >-
      Capital-market pricing is being used as a market-confidence proxy, but the proxy is unstable if the valuation
      anchor itself is inconsistent across sources.
    diligencePath: >-
      Verify the latest financing and IPO guidance through filings, bankers, or primary reporting before using valuation
      as a sizing lens.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: enterprise-win-rates
    missingEvidence: Named enterprise win-loss data showing where Kimi displaces ChatGPT, Claude, DeepSeek, or internal builds.
    whyItMatters: Public model benchmarks do not prove durable procurement advantage or expansion potential.
    diligencePath: Request customer references, renewal data, and procurement notes segmented by buyer type and geography.
    relatedQuestionRefs:
      - QP002
      - QP005
    relatedTableRefs:
      - TP001
      - TP002
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: Realized API pricing, enterprise discounting, and minimum-commit terms for Kimi versus closed-model rivals.
    whyItMatters: >-
      Headline tiers and open-weight availability do not show whether Moonshot can defend monetization against cheaper
      substitutes.
    diligencePath: Obtain API rate cards, enterprise proposals, and customer invoices or procurement summaries.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: enterprise-trust
    missingEvidence: >-
      Public third-party security, compliance, or regulated-industry deployment evidence comparing Kimi with OpenAI and
      Anthropic.
    whyItMatters: >-
      The assigned adverse sources make trust a central competitive objection, but the public pool does not resolve how
      buyers are underwriting that risk.
    diligencePath: >-
      Request security certifications, regulated-customer case studies, and legal review memos covering export-control
      and IP exposure.
    relatedQuestionRefs:
      - QP006
      - QP008
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: revenue-recognition
    missingEvidence: >-
      Audited monthly recognized revenue, deferred revenue, and an ARR bridge from payment-volume or annualized-revenue
      proxies to booked revenue.
    whyItMatters: >-
      Public run-rate numbers can overstate quality if refunds, promotions, annual prepayments, or enterprise contract
      timing distort the picture.
    diligencePath: >-
      Request board or finance-pack revenue waterfalls, monthly cohort retention, and the company's revenue-recognition
      policy memo.
    relatedQuestionRefs:
      - QI001
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Realized pricing by plan, enterprise contract, geography, and channel plus discounting and refund behavior.
    whyItMatters: >-
      List-price visibility is weak, and realized pricing determines gross margin, payback, and whether open-weight
      distribution is expanding or diluting monetization.
    diligencePath: >-
      Request tariff cards, top-customer contracts, pricing-approval rules, and monthly realized price waterfalls by
      channel.
    relatedQuestionRefs:
      - QI002
      - QI004
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: gross-margin-and-burn
    missingEvidence: Gross margin by revenue stream, compute COGS, GPU commitments, monthly burn, and current runway.
    whyItMatters: >-
      Financing momentum can mask weak contribution economics in inference-heavy AI businesses, especially when pricing
      pressure is visible publicly.
    diligencePath: >-
      Request management P&L by product line, infrastructure contracts, capex and committed-spend schedules, and monthly
      cash-flow statements.
    relatedQuestionRefs:
      - QI005
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: concentration-and-governance
    missingEvidence: >-
      Customer concentration, enterprise retention, board-approved financing triggers, and downside plan if IPO timing
      slips.
    whyItMatters: >-
      The next financing event is publicly legible, but concentration and governance determine whether the valuation
      step-up is durable or just bridge capital.
    diligencePath: >-
      Request top-customer revenue concentration, retention cohorts, board materials on financing plans, and legal
      counsel's latest dispute summary.
    relatedQuestionRefs:
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: developer-telemetry
    missingEvidence: >-
      Direct repo, download, package, or community-usage metrics for kimi-cli, Kimi Code, or K-series open-weight
      releases.
    whyItMatters: >-
      Without ecosystem telemetry, the report can verify developer-facing surfaces but cannot judge whether those
      surfaces are meaningfully adopted or well maintained.
    diligencePath: >-
      Pull GitHub, Hugging Face, package-registry, and forum metrics for Kimi repos and model hubs, then compare release
      cadence against issue or discussion activity.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: material
