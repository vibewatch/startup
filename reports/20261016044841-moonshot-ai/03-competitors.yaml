      - ["Long-context / long-output", "Strongest public long-context signature in this set", "Public evidence in assigned pool is weaker than Kimi's long-context identity", "Strong, but public sources here do not show a self-hostable equivalent", "Strong on long documents, but closed deployment"]
      - ["Coding / agentic workflows", "Strong and repeatedly cited as the core wedge", "Strong on reasoning and coding value", "Strong, with broader tool ecosystem", "Strong, especially for careful reasoning and code review"]
      - ["Consumer-app polish", "Good but less polished than leading U.S. products in public commentary", "Unknown public proof in assigned pool", "Strong", "Strong"]
      - ["Enterprise trust / regulatory comfort", "Weaker because of distillation, export-control, and governance overhang", "Same China data caveats noted in public explainers", "Stronger default enterprise comfort", "Stronger default enterprise comfort"]
      - ["Ecosystem / downstream distribution", "Open weights broaden downstream use, but product ecosystem is narrower", "Open weights broaden downstream use", "Widest product and partner ecosystem", "Strong ecosystem, but narrower than ChatGPT"]
    notes: >-
      Ordinal matrix synthesized from assigned public sources; "unknown public
      proof" means the worker pool did not contain enough direct evidence for a
      stronger statement.
    enumerationScope:
      coverage: partial
      basis: >-
        Buying-criteria comparison limited to four most evidenced alternatives
