    claimRefs: [CP002, CP003, CP005, CP006, CP008, CP009, CP010, CP011]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Offer
      - Price / unit
      - Contract model
      - Included capabilities
      - Implication
    rows:
      - ["Kimi app", "Free Adagio; paid tiers from $19/mo to $199/mo", "Credit-metered subscriptions; new paid sign-ups paused in Aug. 2026", "Hosted assistant, web and mobile access, K2.6 conversations not consuming credits", "Aggressive headline pricing, but usage economics differ from per-message or flat-seat plans"]
      - ["Kimi open-weight models", "Weights downloadable; self-hosting cost depends on infrastructure", "Custom license / attribution conditions at large scale", "Open-weight deployment, coding and long-context model access", "Lowers technical lock-in but pushes cost and ops burden onto the buyer"]
      - ["ChatGPT", "Free tier; paid from $20/mo", "Hosted subscription", "General-purpose assistant, images, voice, broad ecosystem", "Higher ecosystem value, but lowest openness and no flagship self-host path"]
      - ["Claude", "Free tier; paid from $20/mo", "Hosted subscription", "Writing, careful reasoning, long documents, and code", "Strong enterprise-quality assistant, but still a closed stack"]
      - ["DeepSeek", "Low; can self-host free", "Hosted app plus self-hosted open weights", "Reasoning and coding at low cost", "Strong price-floor substitute that can compress Moonshot's monetization leverage"]
    notes: >-
      Public comparisons mix hosted subscriptions and open-weight licensing; the
      sources do not provide apples-to-apples realized enterprise contract
      pricing or discount data.
    enumerationScope:
      coverage: partial
      basis: >-
        Packaging comparison limited to offers with explicit pricing or
        deployment evidence in the assigned pool.
    claimRefs: [CP004, CP007, CP008, CP010]
figures:
  - id: FP001
    title: "Competitive positioning map: hosted assistants vs self-hosted open weights"
    type: quadrant
    summary: >-
      Ordinal map of openness or self-hostability versus out-of-box product
      polish for the most evidenced substitute surfaces in the assigned pool.
    data:
      xAxis:
        label: Openness / self-hostability
        min: 1
        max: 5
        lowLabel: Closed product
        highLabel: Self-hostable open weights
        scale: Ordinal
        description: >-
          Higher scores reflect published open-weight availability and realistic
          self-hosting paths; lower scores reflect closed flagship products.
      yAxis:
        label: Out-of-box product polish
        min: 1
        max: 5
        lowLabel: Build-it-yourself
        highLabel: Turnkey assistant
        scale: Ordinal
        description: >-
          Higher scores reflect public evidence of turnkey user experience and
          ecosystem depth rather than model quality alone.
      points:
        - label: Kimi app / API
          x: 4
          y: 3
          detail: Hosted product backed by open-weight models, but with less ecosystem depth than ChatGPT or Claude.
        - label: Self-hosted Kimi weights
          x: 5
          y: 2
          detail: Maximum deployment flexibility, but the buyer absorbs infrastructure and ops burden.
        - label: ChatGPT
          x: 1
          y: 5
          detail: Broadest turnkey ecosystem, but no flagship self-host path in the assigned evidence.
        - label: Claude
          x: 1
          y: 4
          detail: Strong turnkey enterprise assistant with careful reasoning, but still a closed stack.
        - label: DeepSeek app
          x: 4
          y: 3
          detail: Low-cost hosted substitute with similar China data caveats.
        - label: Self-hosted DeepSeek
          x: 5
          y: 2
          detail: Cheap and flexible for developers, but product polish depends on the buyer's stack.
    approximationNotes: >-
      Coordinates are evidence-backed ordinal synthesis from the cited sources,
      not benchmark percentages or measured customer-satisfaction scores.
    claimRefs: [CP005, CP007, CP008, CP010, CP011]
callouts:
  - calloutType: insight
    title: Moonshot's strongest substitute threat is not one rival model; it is the buyer's ability to multi-home.
    body: >-
      Public evidence repeatedly shows Kimi competing in a world where developers
      can route among hosted assistants, open-weight providers, and self-hosted
      deployments. That reduces pure model lock-in and makes product polish,
      trust, and enterprise process matter more than a one-cycle benchmark lead.
    claimRefs: [CP005, CP008, CP010]
  - calloutType: risk
    title: The most important competitive objection is trust and governance, not lack of raw capability.
    body: >-
      The assigned adverse sources do not argue that Moonshot lacks frontier
      ambition; they argue that legal, export-control, and shareholder-governance
      questions can slow enterprise comfort and make a future IPO more fragile.
    claimRefs: [CP011, CP012]
