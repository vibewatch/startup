      - ["Zhang Yutao", "CTO / launch-era operator in public dispute reporting", "Named by ThinkChina in the launch team and by Forbes in the Recurrent-origin dispute", "Bridges productization and governance-risk narrative", "High for governance diligence because allegations directly reference his conduct"]
    notes: "Coverage is partial and limited to leadership figures named in the assigned public pool; it is not a verified current board, executive committee, or legal-officer register."
    enumerationScope:
      coverage: partial
      basis: "Enumerates the founders and launch-era leaders explicitly named across the retained public sources for this refresh."
    claimRefs: [CO009, CO010, CO011, CO016]
  - id: TO003
    title: "Stakeholder or investor map"
    columns: ["Stakeholder", "Role", "Control / economic importance", "Diligence ask"]
    rows:
      - ["Alibaba", "Largest disclosed strategic outside backer", "Forbes says Alibaba acquired a 36% stake; CNBC also names it as a backer, making it the clearest disclosed economic anchor", "Confirm current stake, governance rights, cloud commitments, and any exclusivity or veto terms"]
      - ["Tencent", "Repeat financial / strategic backer", "CNBC and Multiples both place Tencent in Moonshot's funding stack", "Clarify ownership percentage, board access, and any commercial-distribution ties"]
      - ["IDG Capital", "Lead investor in Dec 2025 Series C per Multiples", "Important marker of prior institutional sponsorship before 2026 valuation step-up", "Review pro-rata rights, liquidation stack, and whether any special terms survived later rounds"]
      - ["National AI Industry Investment Fund", "Participant in July 2026 $3.5B round per Multiples", "Signals growing state-linked capital presence around later-stage financing", "Test for policy influence, information rights, and implications for overseas listing flexibility"]
      - ["Former Recurrent stakeholders / claimants", "Adverse governance stakeholder", "Forbes says claimants seek 10.5% of Moonshot's original shares and a $700M-equivalent remedy", "Obtain case documents, settlement status, and IPO disclosure assessment before underwriting governance quality"]
    notes: "This is a stakeholder-weighted map built from disclosed public references, not a cap-table reconstruction; undisclosed ownership, side letters, and board-rights detail remain open diligence items."
    enumerationScope:
      coverage: partial
      basis: "Lists the economically or governance-relevant stakeholders explicitly surfaced in retained public funding and litigation coverage."
    claimRefs: [CO005, CO006, CO009, CO010, CO015]
