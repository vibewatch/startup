    title: "Leadership and founder table"
    columns: ["Person", "Role", "Background", "Founder-market fit / coverage", "Key-person dependency"]
    rows:
      - ["Yang Zhilin", "Founder / CEO", "CMU-trained researcher highlighted across retained sources", "Technical and strategic center of gravity for model roadmap and capital narrative", "High — public positioning and governance dispute are both heavily tied to Yang"]
