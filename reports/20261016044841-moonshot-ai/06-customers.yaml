  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-disclosure
      missingEvidence: NRR, GRR, churn, renewal-rate, contract-length, or cohort-retention disclosure for Kimi app, API, or enterprise accounts.
      whyItMatters: Without retention evidence, public adoption signals cannot be converted into durable customer economics or judged against a land-and-expand thesis.
      diligencePath: Request cohort retention decks, renewal by product surface, and any board-level customer-health reporting from management.
      relatedQuestionRefs:
        - QU006
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: Named production customers with deployment scope, purchase path, renewal status, and measurable outcomes.
      whyItMatters: Current named proof is mostly partner or router distribution, which is weaker than direct enterprise-reference quality for underwriting concentration and expansion.
      diligencePath: Ask for three to five reference customers, split by consumer, API, and enterprise workflows, with permission to verify deployment depth and renewal.
      relatedQuestionRefs:
        - QU004
        - QU005
        - QU006
