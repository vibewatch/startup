company:
  name: Moonshot AI
chapter:
  number: 6
  title: Customers
  summary: Moonshot AI shows real adoption signals, but they are strongest in developer-led and self-serve channels rather than in disclosed enterprise accounts. Public evidence supports broad distribution through the consumer app, API, open-weight downloads, and partner/model-router surfaces, while retention, concentration, and named production customer proof remain thin.
sections:
  - id: customer-surfaces-and-segments
    title: Customer surfaces and segments
    body: |-
      Moonshot’s public go-to-market footprint is broader than a single chatbot. The official homepage positions Kimi for coding, analysis, sheets, slides, and deep reasoning, while independent profiles describe four visible surfaces: the consumer app, the Open Platform API, Kimi Code, and Kimi Work. That combination implies three practical customer cohorts: self-serve consumers who start in chat, developers who buy API or coding capacity, and organizations with enough infrastructure to self-host open weights. The strongest documented willingness-to-pay signal is not named enterprise logos, but the fact that Moonshot has built multiple monetizable surfaces around the same model family.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU010
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: adoption-proof-and-distribution
    title: Adoption proof and distribution
    body: |-
      The clearest adoption proof is developer and channel behavior rather than disclosed enterprise cohorts. Independent sources say Kimi K2 topped Hugging Face downloads on launch day, CNBC says Chinese AI models are gaining traction among Western companies, and one cited market observer says usage is still concentrated in the startup ecosystem rather than large corporates. Named third-party surfaces add another layer of proof: Lorphic points to Perplexity’s model picker, China AI Hub notes Coze and Dify integration surfaces, and Geotoolbox says OpenRouter carries Kimi models. Together, these signals show real market reach, but mostly through low-friction evaluation and distribution channels rather than disclosed direct production accounts.
    claimRefs:
      - CU004
      - CU005
      - CU006
      - CU007
      - CU008
      - CU009
    tableRefs:
      - TU002
      - TU003
  - id: durability-expansion-and-concentration-risk
    title: Durability, expansion, and concentration risk
    body: |-
      What remains missing is the enterprise-grade proof investors usually want for a customer chapter. The AI Rankings says Kimi’s monthly active users fell sharply from a 2024 peak, which weakens any simple consumer-retention narrative. At the same time, sensitive customers face trust friction: Geotoolbox says the API and consumer surfaces sit under different Singapore-versus-China operating entities, it cites an OECD.AI incident note about cross-user exposure, and Enterprise DNA warns that unresolved export-control or distillation allegations can jeopardize customer relationships. None of the assigned sources provide NRR, GRR, renewal rates, top-customer concentration, or named production enterprise deployments with spend, so durability and concentration remain material diligence gaps rather than solved questions.
    claimRefs:
      - CU003
      - CU011
      - CU012
      - CU013
      - CU014
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale / adoption signal
      - Revenue / strategic value
      - Gap
    rows:
      - - Consumer chat subscribers
        - Individual user / same / free or paid subscriber
        - General chat, document work, sheets, slides, lightweight knowledge work
        - Official site plus third-party profiles show a free tier and premium plans for the Kimi app
        - Brand reach and subscription revenue
        - No disclosed active-user count, paid conversion, or renewal data
      - - API builders
        - Engineering leader / developer team / company budget owner
        - Embed Kimi models into apps or workflows through the Open Platform API
        - Multiple profiles list a pay-as-you-go API and CNBC reports broader Western-company traction for Chinese models
        - Usage-based recurring spend and a bridge from trial to production
        - No public customer count, ACV, or cohort spend data
      - - Self-hosting organizations
        - Infra or ML lead / developer or platform team / company budget owner
        - Run open weights for privacy, control, or lower inference cost
        - Independent sources describe self-hosting as the standard path for organizations that want Kimi outside Moonshot-hosted data jurisdiction
        - Extends reach beyond Moonshot-hosted cloud and can seed later API upsell
        - No public conversion data from open-weight downloads into paid services
      - - Partner / router distribution
        - Platform operator / end user on partner surface / platform or end customer
        - Access Kimi through Perplexity, Coze, Dify, or OpenRouter surfaces
        - Named third-party surfaces show Kimi available inside other products and orchestration layers
        - Low-friction sampling and broader distribution
        - Availability on a surface does not prove direct revenue, renewal, or deployment depth
    notes: Public evidence supports segment definitions and channel surfaces, but not customer counts, paid conversion, or segment revenue mix; null-equivalent gaps are stated explicitly in the Gap column.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU005
      - CU010
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Open-weight developer adoption
        - Kimi K2 topped Hugging Face downloads on launch day
        - 2025-07
        - The AI Rankings; Lorphic
        - Medium
        - Developer discovery and experimentation accelerated after the open-weight pivot
        - Exact download count and conversion into paying usage are not disclosed
      - - Western-company demand signal
        - Chinese AI models are already gaining traction among Western companies
        - '2026-07-17'
        - CNBC
        - Medium
        - Moonshot benefits from a broader willingness to test Chinese open-weight models
        - Moonshot-specific customer share is not disclosed
      - - Current user mix
        - Most developers using technology like Kimi K3 are from the startup ecosystem, less from the large corporate side
        - '2026-07-17'
        - CNBC quoting Lu Zhang
        - Medium
        - Publicly visible adoption still looks startup-weighted, not enterprise-heavy
        - No segment count, spend, or retention cohort is published
      - - Consumer durability
        - Kimi monthly active users fell sharply from a 2024 peak
        - 2026-07 update
        - The AI Rankings
        - Medium
        - Consumer reach exists, but retention durability is not a clean growth story
        - No current MAU level or paid-subscriber trend is disclosed
    notes: This table preserves directional adoption signals exactly as reported; none of the cited sources disclose a full denominator for active users, paying accounts, or customer retention.
    claimRefs:
      - CU004
      - CU005
      - CU006
      - CU013
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / surface
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Perplexity model picker
        - End-user distribution / developer discovery
        - Makes Kimi available as a selectable model in a third-party AI product
        - Production distribution surface
        - Supports international awareness beyond Moonshot-owned properties
        - Shows availability, not direct contract value or usage depth
      - - Coze
        - Builder / orchestration platform
        - Routes model-node traffic to Kimi for agent-style workflows
        - Production distribution surface
        - Shows Kimi can appear inside a third-party builder ecosystem
        - Does not prove that Coze is a direct paying customer of Moonshot
      - - Dify
        - Developer / enterprise orchestration layer
        - Can orchestrate K-series models alongside other models
        - Production integration surface
        - Shows Kimi is available for multi-model workflow assembly
        - Integration support is not the same as disclosed customer deployment count
      - - OpenRouter
        - Developer trial and pay-per-use distribution
        - Serves Kimi models through an aggregator for easier evaluation
        - Production distribution surface
        - Lowers procurement friction for experimentation and overflow usage
        - Aggregator presence does not prove renewal, concentration, or end-customer retention
    notes: The named proof in this source pool is mostly third-party distribution evidence, not direct enterprise references; limitation text preserves that distinction row by row.
    enumerationScope:
      coverage: partial
      basis: This partial list is limited to named third-party surfaces explicitly described in the assigned July-September 2026 sources; the pool does not contain a complete customer registry or disclosed enterprise account list.
    claimRefs:
      - CU005
      - CU007
      - CU008
      - CU009
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Moonshot reaches users through self-serve, developer, and partner channels, but enterprise expansion still hits a trust-and-compliance gate.
    data:
      nodes:
        - label: Free Kimi app
          details: Self-serve discovery starts in chat and lightweight productivity use cases.
          touchpoints:
            - Free tier and premium app plans
            - Coding, analysis, sheets, and slides workflows
        - label: API or provider trial
          details: Developers can test Kimi through Moonshot's API or third-party providers.
          touchpoints:
            - Open Platform API
            - OpenRouter pay-per-use access
        - label: Open-weight self-hosting
          details: Organizations with infrastructure can adopt Kimi without sending data to Moonshot-hosted services.
          touchpoints:
            - Hugging Face/open-weight route
            - Privacy-sensitive evaluation path
        - label: Partner surfaces
          details: Named partner and router surfaces expand exposure beyond Moonshot-owned properties.
          touchpoints:
            - Perplexity model picker
            - Coze model node
            - Dify orchestration
        - label: Workflow expansion
          details: Successful users can deepen usage through coding and agentic knowledge-work products.
          touchpoints:
            - Kimi Code
            - Kimi Work
        - label: Enterprise trust gate
          details: Broader enterprise rollout depends on clearing data-jurisdiction, incident-response, and legal-lineage concerns.
          touchpoints:
            - Singapore API vs China consumer-service entities
            - Cross-user exposure incident
            - Distillation/export-control allegations
    approximationNotes: null
    claimRefs:
      - CU001
      - CU003
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
      - CU012
      - CU014
callouts:
  - calloutType: strength
    title: Reach is broadest where procurement is light
    body: Moonshot has credible distribution through free chat, API access, open weights, and third-party model surfaces, so sampling friction is low even without disclosed enterprise references.
    claimRefs:
