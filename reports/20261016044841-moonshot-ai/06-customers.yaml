  - calloutType: risk
    title: Durability proof still trails reach
    body: Public adoption signals are real, but retention, concentration, and trust-sensitive enterprise durability remain under-documented versus the amount of developer-market buzz.
    claimRefs:
      - CU006
      - CU011
      - CU012
      - CU013
      - CU014
