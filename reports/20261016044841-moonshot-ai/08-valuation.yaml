  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: cap-table-and-preferences
      missingEvidence: Current cap table, liquidation preferences, option pool size, and dilution mechanics for the July 2026 round and any follow-on pre-IPO security.
      whyItMatters: Entry discipline depends on economic rights, not just headline valuation, and the public pool does not show the terms that could subordinate new money.
      diligencePath: Request the latest cap-table summary, preference stack, board observer rights, and any side-letter or investor-protection terms from management and lead investors.
      relatedQuestionRefs:
        - QV003
        - QV008
    - type: missing-source
      severity: material
      topic: revenue-quality
      missingEvidence: Audited recognized revenue, gross margin, cohort retention, and customer concentration detail for 2026 by geography and product line.
      whyItMatters: ARR headlines can justify attention, but underwriting at a stretched multiple requires proof that monetization quality supports durable enterprise value.
      diligencePath: Obtain audited or board-level revenue reporting, a top-customer and channel mix table, and margin or compute-cost trend data before underwriting a premium entry.
