    title: Recommendation summary table
    columns:
      - Lens
      - Current call
      - Evidence basis
      - Decision implication
    rows:
      - [Recommendation, research-more, "Strong product and financing momentum, but price support is incomplete above the last confirmed close.", "Keep active diligence, but do not treat current public evidence as sufficient for a buy call."]
      - [Confidence, medium, "Multiple independent reports line up on momentum and IPO intent, yet the highest valuation step-up and core disclosure gaps remain unresolved.", "A filing, management diligence, or audited operating data could move confidence higher."]
      - [Risk rating, high, "Legal, regulatory, geopolitical, and disclosure risks can all widen the IPO discount even if product quality remains strong.", "Underwrite downside before underwriting upside."]
      - [Valuation stance, stretched, "The $35 billion July round is the clearest closed anchor in this pool; the $50 billion narrative is still incomplete.", "Treat the confirmed round as the discipline point and require better proof before paying the rumored next price."]
    notes: >-
      Judgment is intentionally price-sensitive: the table distinguishes the last confirmed
      valuation anchor from higher unconfirmed IPO or financing talk.
    claimRefs:
      - CV001
      - CV006
      - CV007
      - CV012
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Direction
      - Evidence signal
      - What would change the view
    rows:
      - [Frontier product proof, Thesis, "Kimi K3 gave Moonshot a credible frontier-scale product story and widened investor interest.", "A weak enterprise conversion curve after K3 would turn product leadership into a less valuable asset."]
      - [Strategic financing access, Thesis, "Alibaba alignment, large prior rounds, and active IPO preparation suggest capital-market access is real.", "If the $50 billion step-up fails to close cleanly, financing strength looks less durable."]
      - [Monetization disclosure gap, Anti-thesis, "Public ARR evidence is still sparse relative to the valuation discussion and does not yet show revenue quality in detail.", "Audited revenue, margin, and customer-concentration disclosure would reduce this discount."]
      - [Legal and geopolitical overhang, Anti-thesis, "The Recurrent dispute and the distillation/export-control allegations can raise both IPO friction and multiple compression risk.", "A resolved settlement plus no formal enforcement escalation would narrow this concern."]
    notes: >-
      Arguments summarize the decision frame rather than fixed probabilities; each row states
      the specific evidence that would strengthen or weaken the current call.
    claimRefs:
      - CV004
      - CV005
      - CV008
      - CV009
      - CV011
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "Verified ARR inflects far above the public June floor, overseas adoption persists, and IPO disclosures stay clean.", "A $50 billion or higher outcome becomes easier to defend only if the monetization step-up is verified rather than narrated.", "Execution slippage, margin compression, or hidden preference terms can still erode the premium.", "Possible, but not yet publicly proven."]
      - [Base, "Use the July 2026 $35 billion round as the last confirmed anchor and assume better but still incomplete monetization disclosure.", "Demand entry discipline around the last confirmed price and avoid paying the full rumored IPO premium in advance.", "The market may keep bidding the story before verification arrives.", "Best fit with current public evidence."]
      - [Bear, "The IPO slips, the $50 billion step-up stays unconfirmed, or legal/regulatory pressure worsens.", "Multiple compression or a down-round becomes plausible even without a product failure because disclosure risk dominates.", "Momentum investors may overlook risk until a filing forces clarity.", "Meaningful downside path if diligence quality does not improve."]
    notes: >-
      Scenario logic is directional instead of point-estimate DCF math because the assigned
      pool does not disclose enough audited operating data for false-precision modeling.
    claimRefs:
      - CV001
      - CV003
      - CV006
      - CV007
      - CV011
      - CV013
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Current evidence points to a wait-for-better-proof recommendation rather than a yes/no product verdict.
    data:
      nodes:
        - label: Frontier product proof
          detail: K3 improves the strategic story and keeps financing attention high.
        - label: On-record monetization floor
          detail: Public ARR evidence reaches $300 million, but quality and concentration remain thin.
        - label: Last confirmed price anchor
          detail: July 2026 at $35 billion is the clearest closed valuation point in this pool.
        - label: $50B step-up still incomplete
          detail: IPO and financing reports discuss the number, but do not fully verify a closed round.
        - label: Legal and geopolitical overhang
          detail: Lawsuit and distillation or export-control allegations can widen discount rates.
        - label: Decision today is research-more
          detail: Wait for verified monetization, clearer terms, and cleaner disclosure before paying up.
    approximationNotes: >-
      The sequence reflects underwriting logic, not a quantified probability tree or modeled
      causal weight for each node.
    claimRefs:
      - CV004
      - CV006
      - CV007
      - CV012
      - CV014
callouts:
  - calloutType: recommendation
    title: Price discipline matters more than product admiration
    body: >-
      Moonshot can still become investable at a premium, but the assigned pool supports that
      premium only up to the last confirmed valuation anchor. Paying the full $50 billion story
      before the filing, cap-table terms, and revenue bridge are visible would convert diligence
      risk into entry-price risk.
    claimRefs:
      - CV006
      - CV007
      - CV012
  - calloutType: risk
    title: The failure mode is disclosure, not just technology
    body: >-
      The most realistic downside is not that Kimi stops being relevant, but that financing and
      legal disclosures force the market to use a lower multiple than private momentum headlines
      currently imply.
    claimRefs:
      - CV008
      - CV009
      - CV013
