    rows:
      - ["MoE model core", "Routes each token through a subset of experts instead of firing the full network", "K3 model design and Moonshot training stack", "Architectural advantage is clear, but external reproduction and benchmarking depth remain limited in assigned pool"]
      - ["Long-context attention path", "Uses Kimi Delta Attention and attention residuals to support very long context windows", "Moonshot's own research and implementation claims", "Public evidence is strong on positioning but still light on third-party production validation"]
      - ["Closed product layer", "Assistant and API product operated directly by Moonshot", "Moonshot-managed infrastructure and policy controls", "Hosted use inherits Moonshot's uptime, data-handling, and jurisdiction choices"]
      - ["Open-weight distribution layer", "Lets developers self-host or integrate the model family outside Moonshot's own app", "Model weights, local infra, and integration work", "Custom K3 license and support boundaries can narrow the practical openness at scale"]
      - ["Regional deployment / compliance layer", "Supports in-country deployment paths for sensitive buyers", "Regional partners and customer infrastructure choices", "Assigned pool does not include direct audit, certification, or formal data-processing evidence"]
      - ["Capacity / support layer", "Handles signup growth, inference demand, and customer support", "Compute availability and operations scaling", "Art of the Start says new Kimi signups were paused after K3 launched because demand outran capacity"]
    notes: "This architecture view blends technical design with operating layers because the main diligence risk is not only model quality, but also how Moonshot distributes, governs, and supports that quality."
    claimRefs: ["CE003", "CE004", "CE009", "CE010", "CE011", "CE013"]
