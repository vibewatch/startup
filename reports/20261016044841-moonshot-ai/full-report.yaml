      - number: '5.4'
        title: Trust, compliance, and maturity risks
        blocks:
          - type: paragraph
            body: >-
              The biggest non-technical risks are not hypothetical. Enterprise DNA summarizes a White House-linked
              accusation that Moonshot copied Anthropic outputs and routed advanced GPUs through Thailand to evade
              export controls, while also noting that nothing has been adjudicated and the allegation should not be
              treated as proven fact. Separately, Forbes says Moonshot is managing a shareholder and IP dispute that
              could raise IPO friction and financial exposure. Product maturity risk is also visible in the operating
              layer: Art of the Start reports that Moonshot paused new Kimi signups after K3 launched because demand
              outran capacity. Together, those issues do not negate technical progress, but they do raise the bar for
              vendor diligence around provenance, licensing, infrastructure resilience, and contractual fallback
              options.
            claimRefs:
