            body: >-
              Moonshot’s public go-to-market footprint is broader than a single chatbot. The official homepage positions
              Kimi for coding, analysis, sheets, slides, and deep reasoning, while independent profiles describe four
              visible surfaces: the consumer app, the Open Platform API, Kimi Code, and Kimi Work. That combination
