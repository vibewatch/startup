  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      Public evidence layers reach, distribution model, monetization, and capital-market willingness to pay, but it
      still does not produce a clean TAM/SAM/SOM stack.
    data:
      items:
        - label: Consumer reach
          displayValue: 36M+ MAU (late 2024)
          detail: Reported monthly active users show the top of Moonshot's funnel before current monetization.
          claimRefs:
            - CM006
        - label: Distribution model
          displayValue: Open weights plus proprietary API
          detail: >-
            Moonshot can capture demand through hosted usage while still benefiting from open-weight discovery and
            trial.
          claimRefs:
            - CM012
        - label: ARR inflection
          displayValue: ~$100M to ~$300M ARR (Mar-Jun 2026)
          detail: Public reports show a sharp monetization step-up before the October 2026 refresh date.
          claimRefs:
            - CM004
        - label: Revenue mix
          displayValue: API >70% of revenue
          detail: API-heavy mix implies the spending base is skewing toward developer and enterprise use cases.
          claimRefs:
            - CM005
        - label: Post-K3 demand spike
          displayValue: 6x+ daily sales surge
          detail: The K3 launch created an observable near-term conversion spike in paid demand.
          claimRefs:
            - CM008
        - label: Price-performance pull
          displayValue: Cheaper than top U.S. offerings
          detail: Western-company interest rose as Chinese models closed the performance gap while staying cheaper.
          claimRefs:
