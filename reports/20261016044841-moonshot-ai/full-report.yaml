      - number: '5.2'
        title: Architecture and technical differentiation
        blocks:
          - type: paragraph
            body: >-
              The evidence suggests Moonshot's technical edge is architectural and workflow-specific, not a blanket
              claim of overall model leadership. The current flagship K3 is described across official and independent
              sources as a 2.8T-parameter, open-weight model oriented toward long-context reasoning, coding, and agentic
              use. Art of the Start describes a 896-expert MoE design with 16 experts active per token and Kimi Delta
              Attention, while CNBC notes that K3 still trails OpenAI and Anthropic on overall performance even as it
              beats some near-frontier peers on coding and agent benchmarks. That mix implies a sharp wedge: Moonshot
              appears strongest where buyers care about long context, tool use, and cost-conscious engineering, but
              buyers should not read the assigned pool as proof of category-wide dominance across every enterprise
              workload.
