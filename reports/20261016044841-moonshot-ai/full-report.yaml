      - number: '3.2'
        title: Capability, pricing, and distribution tradeoffs
        blocks:
          - type: paragraph
            body: >-
              Kimi's sharpest wedge is not a claim to universal superiority; it is a mix of strong coding and multi-step
              agentic performance, ultra-long context, and deployment flexibility that closed rivals do not match.
              Geotoolbox, Comparative AI, and China AI Hub all support the split between Moonshot's closed app or API
              surface and its open-weight model strategy. That split lowers technical switching cost because buyers can
              test the hosted product, move to third-party routing, or self-host the weights. The tradeoff is that
              ChatGPT and Claude still appear stronger on general polish and ecosystem depth, while Kimi's publicly
              visible pricing is more aggressive but less directly comparable because self-hosting economics,
              credit-based plans, and custom enterprise terms are not the same product.
            claimRefs:
              - CP002
              - CP004
              - CP005
