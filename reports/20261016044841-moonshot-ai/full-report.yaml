      - number: '2.3'
        title: What accelerates adoption, and what can slow it
        blocks:
          - type: paragraph
            body: >-
              Adoption momentum is coming from product economics and product form at the same time. CNBC reports that
              Chinese AI models are gaining traction among Western companies because they are closing the performance
              gap while staying cheaper than top U.S. offerings, and Investing.com's Bloomberg-cited summary frames K3
              as evidence of an "all-round catch-up" in size, performance, and pricing. GeoToolbox and China AI Hub also
              reinforce why the product is easy to trial: Moonshot offers open weights for the underlying models while
              keeping the hosted app and API proprietary, which lowers experimentation friction for developers who want
              optionality. The same model form creates constraints, though. Enterprise buyers still need orchestration
              and integration capability, and the 2026 distillation and export-control allegations create procurement,
              legal, and compliance friction even before any claim is adjudicated.
            claimRefs:
              - CM002
              - CM009
              - CM012
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set and where Moonshot sits
        blocks:
          - type: paragraph
            body: >-
              The relevant landscape is broader than "other Chinese model labs." Public evidence shows Moonshot
              competing against direct Chinese open-weight peers such as DeepSeek, Z.ai (ZhipuAI), and MiniMax; against
              U.S. frontier incumbents such as OpenAI and Anthropic on coding and agentic quality; and against
              substitute deployment modes such as self-hosting open weights rather than buying a closed assistant.
              Comparative AI and China AI Hub both describe Moonshot's identity as a long-context and coding-led Kimi
              product family, while CNBC places K3 directly against OpenAI and Anthropic on some benchmarks. That means
              buyer choice is not only vendor versus vendor; it is also hosted product versus open-weight model, Chinese
              stack versus U.S. incumbent, and consumer-led distribution versus enterprise trust.
            claimRefs:
              - CP001
              - CP002
              - CP003
