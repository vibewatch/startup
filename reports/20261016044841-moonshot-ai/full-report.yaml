  - id: FP001
    title: 'Competitive positioning map: hosted assistants vs self-hosted open weights'
    type: quadrant
    summary: >-
      Ordinal map of openness or self-hostability versus out-of-box product polish for the most evidenced substitute
      surfaces in the assigned pool.
    data:
      xAxis:
        label: Openness / self-hostability
        min: 1
        max: 5
        lowLabel: Closed product
        highLabel: Self-hostable open weights
        scale: Ordinal
        description: >-
          Higher scores reflect published open-weight availability and realistic self-hosting paths; lower scores
          reflect closed flagship products.
      yAxis:
        label: Out-of-box product polish
        min: 1
        max: 5
        lowLabel: Build-it-yourself
        highLabel: Turnkey assistant
        scale: Ordinal
        description: >-
          Higher scores reflect public evidence of turnkey user experience and ecosystem depth rather than model quality
          alone.
      points:
        - label: Kimi app / API
          x: 4
          'y': 3
          detail: Hosted product backed by open-weight models, but with less ecosystem depth than ChatGPT or Claude.
        - label: Self-hosted Kimi weights
          x: 5
          'y': 2
          detail: Maximum deployment flexibility, but the buyer absorbs infrastructure and ops burden.
        - label: ChatGPT
          x: 1
          'y': 5
          detail: Broadest turnkey ecosystem, but no flagship self-host path in the assigned evidence.
        - label: Claude
          x: 1
          'y': 4
          detail: Strong turnkey enterprise assistant with careful reasoning, but still a closed stack.
        - label: DeepSeek app
          x: 4
          'y': 3
          detail: Low-cost hosted substitute with similar China data caveats.
        - label: Self-hosted DeepSeek
          x: 5
          'y': 2
          detail: Cheap and flexible for developers, but product polish depends on the buyer's stack.
    approximationNotes: >-
      Coordinates are evidence-backed ordinal synthesis from the cited sources, not benchmark percentages or measured
      customer-satisfaction scores.
    claimRefs:
      - CP005
      - CP007
      - CP008
      - CP010
      - CP011
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence suggests Moonshot monetizes operated product surfaces while using open weights to widen demand,
      leaving gross-profit and burn conversion underdisclosed.
    data:
      nodes:
        - id: open-weights
          label: Open-weight flagship models
          note: Open weights widen adoption and developer reach but reduce proprietary-model pricing leverage.
          tone: neutral
        - id: closed-surfaces
          label: Closed Kimi app and API
          note: Moonshot monetizes the operated product surface rather than relying only on downloadable weights.
          tone: neutral
        - id: paid-usage
          label: Paid subscriptions and hosted usage
          note: Public sources show sharp subscription-order growth and a hosted Kimi Claw service layer.
          tone: positive
        - id: run-rate
          label: Revenue run-rate scaling
          note: >-
            Public reports cite roughly $200 million annualized revenue around the May raise and a $2 billion year-end
            annualized target.
          tone: positive
        - id: margin-pressure
          label: Gross profit pressure
          note: Cheaper pricing and open-weight economics can expand demand while compressing gross margin.
          tone: risk
        - id: financing
          label: Financing bridge
          note: >-
            Private rounds and IPO planning remain central because public burn, runway, and cash-flow visibility is
            limited.
          tone: risk
      edges:
        - from: open-weights
          to: closed-surfaces
          label: Distribution widens product funnel
        - from: closed-surfaces
          to: paid-usage
          label: Paid surfaces generate subscription and hosted billing activity
        - from: paid-usage
          to: run-rate
          label: Volume creates annualized revenue proxies
        - from: run-rate
          to: margin-pressure
          label: Revenue does not remove serving-cost pressure
        - from: margin-pressure
          to: financing
          label: External capital covers what margin disclosure does not
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI006
      - CI007
      - CI008
      - CI011
      - CI014
      - CI015
      - CI016
  - id: FE001
    title: Moonshot product architecture map
    type: stack
    summary: >-
      Moonshot layers frontier-model research into open-weight distribution, developer tooling, hosted products, and
      compliance-sensitive deployment paths.
    data:
      layers:
        - label: Research and model-design layer
          detail: Frontier model research shared publicly, with K3 positioned as the current flagship.
          items:
            - Research team / AGI orientation
            - Kimi Delta Attention
            - Attention residuals
          outputs:
            - K2/K2.5/K2.6/K2.7/K3 release cadence
        - label: Foundation model layer
          detail: Open-weight K-series foundation models anchored by K3.
          items:
            - 'K3: 2.8T parameters'
            - 'MoE routing: 896 experts / 16 active'
            - 1M-token context
            - Native multimodality
          outputs:
            - Coding
            - Knowledge work
            - Deep reasoning
        - label: Developer platform layer
          detail: Developer-facing access points expand distribution beyond the consumer app.
          items:
            - Kimi API Platform
            - platform.kimi.ai/docs
            - Kimi Code / kimi-cli
            - Open-weight downloads
        - label: Benchmark and proof layer
          detail: Moonshot also distributes benchmark surfaces and research artifacts that support developer discovery.
          items:
            - WorldVQA
            - PerceptionBench
            - CombiBench
            - Kimi Code Bench 2.0
        - label: Application layer
          detail: Moonshot monetizes managed experiences on top of the model family.
          items:
            - Kimi assistant
            - Hosted inference
            - Consumer subscriptions
            - Kimi Work
        - label: Deployment and governance layer
          detail: Enterprise adoption depends on where workloads run and how legal/compliance risk is handled.
          items:
            - Singapore-operated international API
            - China-operated consumer service
            - Regional-partner local deployment
            - Custom K3 license
            - Capacity scaling
    approximationNotes: This stack is a qualitative synthesis of verified layers and dependencies, not a literal internal systems diagram.
    claimRefs:
      - CE003
      - CE004
      - CE009
      - CE010
      - CE011
      - CE013
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Moonshot reaches users through self-serve, developer, and partner channels, but enterprise expansion still hits a
      trust-and-compliance gate.
    data:
      nodes:
        - label: Free Kimi app
          details: Self-serve discovery starts in chat and lightweight productivity use cases.
          touchpoints:
            - Free tier and premium app plans
            - Coding, analysis, sheets, and slides workflows
        - label: API or provider trial
          details: Developers can test Kimi through Moonshot's API or third-party providers.
          touchpoints:
            - Open Platform API
            - OpenRouter pay-per-use access
        - label: Open-weight self-hosting
          details: Organizations with infrastructure can adopt Kimi without sending data to Moonshot-hosted services.
          touchpoints:
            - Hugging Face/open-weight route
            - Privacy-sensitive evaluation path
        - label: Partner surfaces
          details: Named partner and router surfaces expand exposure beyond Moonshot-owned properties.
          touchpoints:
            - Perplexity model picker
            - Coze model node
            - Dify orchestration
        - label: Workflow expansion
          details: Successful users can deepen usage through coding and agentic knowledge-work products.
          touchpoints:
            - Kimi Code
            - Kimi Work
        - label: Enterprise trust gate
          details: >-
            Broader enterprise rollout depends on clearing data-jurisdiction, incident-response, and legal-lineage
            concerns.
          touchpoints:
            - Singapore API vs China consumer-service entities
            - Cross-user exposure incident
            - Distillation/export-control allegations
    approximationNotes: null
    claimRefs:
