        - Best fit with current public evidence.
      - - Bear
        - The IPO slips, the $50 billion step-up stays unconfirmed, or legal/regulatory pressure worsens.
        - >-
          Multiple compression or a down-round becomes plausible even without a product failure because disclosure risk
          dominates.
        - Momentum investors may overlook risk until a filing forces clarity.
        - Meaningful downside path if diligence quality does not improve.
    notes: >-
      Scenario logic is directional instead of point-estimate DCF math because the assigned pool does not disclose
      enough audited operating data for false-precision modeling.
    claimRefs:
      - CV001
      - CV003
      - CV006
      - CV007
      - CV011
      - CV013
