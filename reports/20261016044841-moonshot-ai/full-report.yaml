      - number: '3.3'
        title: Durability, multi-homing, and adverse pressure
        blocks:
          - type: paragraph
            body: >-
              Moonshot's moat looks more like a moving lead than a locked platform. Its advantages come from
              long-context branding, open-weight distribution, and the speed with which Kimi releases have reset
              attention inside the Chinese AI cohort. Those are meaningful, but they are also vulnerable to
              commoditization because buyers can multi-home, developers can swap back-end models, and every benchmark
              jump from a peer quickly reshuffles attention. The harder risk is trust: Enterprise DNA summarizes the
              distillation and export-control accusations as a legal and geopolitical due diligence problem, while
              Forbes shows the Recurrent shareholder dispute can complicate IPO disclosure and management focus. As a
              result, Moonshot's commercial durability is more proven in developer and consumer momentum than in a
              public enterprise lock-in story.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP014
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Moonshot's strongest substitute threat is not one rival model; it is the buyer's ability to multi-home.
            body: >-
              Public evidence repeatedly shows Kimi competing in a world where developers can route among hosted
              assistants, open-weight providers, and self-hosted deployments. That reduces pure model lock-in and makes
              product polish, trust, and enterprise process matter more than a one-cycle benchmark lead.
            calloutType: insight
            claimRefs:
              - CP005
              - CP008
              - CP010
          - type: callout
            title: The most important competitive objection is trust and governance, not lack of raw capability.
            body: >-
              The assigned adverse sources do not argue that Moonshot lacks frontier ambition; they argue that legal,
              export-control, and shareholder-governance questions can slow enterprise comfort and make a future IPO
              more fragile.
            calloutType: risk
            claimRefs:
              - CP011
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              The public revenue story is strongest on momentum, not on audited detail. TechCrunch reported that
              Moonshot was targeting $2 billion in annualized revenue by the end of 2026, double its reported August run
              rate, while Geotoolbox described Moonshot's May 2026 financing as happening on the back of roughly $200
              million in annualized revenue. Chinabizinsider adds earlier demand evidence: Kimi subscription orders
              reportedly jumped 8,280% month on month in January 2026 and another 123.8% in February, and the company
              reportedly generated more revenue in 20 late-January days than in all of 2025. That combination supports a
              real monetization ramp, but it is still run-rate and payment-volume evidence rather than a disclosed
              recognized-revenue bridge.
            claimRefs:
