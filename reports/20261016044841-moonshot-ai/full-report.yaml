            tableRef: TO002
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO016
      - number: '1.3'
        title: Capital formation, scale markers, and milestone path
        blocks:
          - type: paragraph
            body: >
              Moonshot's financing story is now moving faster than its disclosure quality. CNBC says the company raised
              $2 billion at more than a $20 billion valuation in May 2026, Multiples records a $35 billion July 2026
              valuation snapshot and $200 million of revenue as of May 2026, and Yahoo Finance-hosted Investing.com
              coverage says Moonshot was already discussing another round that could target as much as $50 billion
              before a Hong Kong IPO. ThinkChina further reports that the business pivoted away from ad-heavy consumer
              growth toward enterprise and developer monetization, and it cites June 2026 ARR of $300 million. Those
              figures point to real commercial traction, but they should not be collapsed into one clean trendline:
              revenue and ARR are different measures, and the latest valuation headlines mix completed financings,
              database snapshots, and IPO ambition. The chapter's base case is that Moonshot is commercially relevant
              and increasingly well capitalized, but still materially under-disclosed on customer count, headcount, and
              governance structure.
