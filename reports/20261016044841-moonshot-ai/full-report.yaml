    title: Company milestone timeline
    type: timeline
    summary: >-
      Moonshot's arc runs from 2023 founding, through successive valuation resets, into a 2026 K3 launch and IPO-prep
      narrative now shadowed by governance litigation.
    data:
      items:
        - period: Mar 2023
          label: Company founded
          detail: >-
            Multiples and independent explainers place Moonshot's founding in 2023, establishing the current refresh as
            a little over three years into company life.
          tone: positive
          claimRefs:
            - CO001
        - period: May 2026
          label: $2B financing at more than $20B
          detail: >-
            CNBC reported that Moonshot raised $2B at a valuation above $20B and named Alibaba and Tencent among its
            backers.
          tone: positive
          claimRefs:
            - CO005
        - period: May 2026
          label: $200M revenue datapoint
