      - number: '2.2'
        title: Sizing the opportunity with public proxies, not a clean TAM
        blocks:
          - type: paragraph
            body: >-
              The pool does not contain a robust third-party TAM/SAM/SOM study for Moonshot's specific workload mix, so
              the best public sizing uses multiple proxy lenses instead of one headline market number. Digital in Asia
              provides monetization markers: roughly $100 million ARR in March 2026, about $300 million by June, and a
              post-K3 sales surge that forced Moonshot to pause new subscriptions temporarily. Baidu Baike adds that API
              revenue accounted for over 70% of revenue and that products were available in more than 200 countries and
              regions. A separate demand lens comes from Digital in Asia's late-2024 user figure of more than 36 million
              MAUs. Capital-market signals are directionally useful but contradictory: one report points to an IPO
              target above $30 billion, while Investing.com, citing Bloomberg, says Moonshot could target as much as $50
              billion. Those figures show investor willingness to pay for exposure to the category; they are not a
              substitute for market-size evidence.
            claimRefs:
