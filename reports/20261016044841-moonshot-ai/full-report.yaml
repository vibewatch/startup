              - CU009
      - number: '6.3'
        title: Durability, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              What remains missing is the enterprise-grade proof investors usually want for a customer chapter. The AI
              Rankings says Kimi’s monthly active users fell sharply from a 2024 peak, which weakens any simple
              consumer-retention narrative. At the same time, sensitive customers face trust friction: Geotoolbox says
              the API and consumer surfaces sit under different Singapore-versus-China operating entities, it cites an
              OECD.AI incident note about cross-user exposure, and Enterprise DNA warns that unresolved export-control
              or distillation allegations can jeopardize customer relationships. None of the assigned sources provide
              NRR, GRR, renewal rates, top-customer concentration, or named production enterprise deployments with
              spend, so durability and concentration remain material diligence gaps rather than solved questions.
            claimRefs:
              - CU003
              - CU011
              - CU012
              - CU013
              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Reach is broadest where procurement is light
            body: >-
              Moonshot has credible distribution through free chat, API access, open weights, and third-party model
              surfaces, so sampling friction is low even without disclosed enterprise references.
            calloutType: strength
            claimRefs:
              - CU001
              - CU003
