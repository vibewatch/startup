  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Verified product surface and buyer workflow
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports a real product stack rather than a single chatbot brand. Moonshot's own
              English site presents Kimi K3 as the flagship model for coding, knowledge work, and deep reasoning, while
              China AI Hub independently lists the Kimi assistant, Kimi API Platform, Kimi Work, Kimi Code, and open
              K-series releases. That means the company is selling into at least three adjacent workflows: direct
              end-user assistance, developer/API adoption, and tooling for coding or agentic execution. The product
              architecture matters because Moonshot is not only monetizing a hosted chat surface; it is also using
              open-weight releases to widen developer reach and then monetizing managed inference, API access, and
              higher-level applications around that model family.
