      - number: '1.2'
        title: Leadership, founder-market fit, and governance overhang
        blocks:
          - type: paragraph
            body: >
              The assigned sources strongly center Moonshot on founder-CEO Yang Zhilin's research pedigree and on a
              technically deep founding group, but they are much less complete on current board composition and control
              rights. Geotoolbox names Yang, Zhou Xinyu, and Wu Yuxin as founders, while ThinkChina's Caixin-origin
              profile adds Zhang Yutao to the operational launch story and ties the company's formation directly to the
              post-ChatGPT window in early 2023. That combination supports founder-market fit on frontier-model
              development, yet it also explains why the Recurrent-origin dispute matters: Forbes reports that former
              stakeholders are challenging whether Moonshot was launched with proper authorization and whether key
              assets moved appropriately. Separately, Enterprise DNA relays unadjudicated U.S. official allegations
              about model distillation and export-control workarounds. Public evidence is therefore sufficient to
              identify the key people and the governance risks, but not to close diligence on the current board, entity
              map, or investor-rights stack.
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
              - CO016
