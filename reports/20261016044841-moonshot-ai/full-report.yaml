              - CR015
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary kill criteria
            body: >-
              Formal sanctions or Entity List action, a verified restricted-chip violation, or a substantiated repeat
              cross-user exposure without a credible post-mortem would materially break the current investment thesis.
            calloutType: risk
            claimRefs:
              - CR004
              - CR007
              - CR015
          - type: callout
            title: Self-hosting is a partial mitigation
            body: >-
              Open weights can keep sensitive prompts off Moonshot-hosted services, but they do not cure model-lineage,
              license, export-control, financing, or the operator's own infrastructure risks.
            calloutType: insight
            claimRefs:
              - CR013
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry stance
        blocks:
          - type: paragraph
            body: >-
              The cleanest public read is that Moonshot has earned the right to stay on the shortlist, but not yet the
              right to be underwritten at the rumored next price. The assigned pool shows a real step-up from the May
              2026 round above $20 billion to a July 2026 round at $35 billion, and it also shows why investors are
              willing to discuss even larger numbers: Kimi K3 sharpened Moonshot's frontier positioning and widened the
              IPO conversation. What the same pool does not show is equally important. The $50 billion level remains
              framed as an ask, an unnamed-source report, or a pre-IPO aspiration rather than a clean closed round with
              disclosed terms. At the same time, public ARR and revenue-quality detail remain too thin to treat the
              upside case as already proven.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV007
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV008
              - CV009
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV012
              - CV014
      - number: '8.2'
        title: Scenario underwriting
        blocks:
          - type: paragraph
            body: >-
              The scenario spread is wide because valuation is running ahead of disclosure quality. On-record
              monetization evidence in this pool reaches $300 million ARR as of June 2026, which is meaningful for a
              two-year-old model company but still a thin base for a $35 billion to $50 billion underwriting range. A
              bull case exists if K3's overseas adoption and enterprise distribution convert that ARR floor into a much
              higher verified run-rate before listing. A base case still requires entry discipline around the last
              confirmed close, while the bear case is not technological failure so much as financing or disclosure
              slippage: a delayed IPO, an unclosed $50 billion step-up, or new evidence that legal and geopolitical
              risks deserve a larger discount than today's narrative implies.
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV007
              - CV011
              - CV013
      - number: '8.3'
        title: Comparable context and exit path
        blocks:
          - type: paragraph
            body: >-
              Comparable context in the assigned pool argues against treating Moonshot's aspirational price as a routine
              peer multiple. Forbes says other China AI Tigers such as Z AI and MiniMax went public at roughly $6.5
              billion valuations, so Moonshot's $50 billion narrative is not a market average but a claim that the
              company has already separated from the peer pack on product leadership, distribution, and revenue
              momentum. That separation is plausible, especially after K3, but the proof burden is correspondingly
              higher. An IPO can work if a public filing converts the story into auditable metrics and resolves the
              governance questions; until then, the exit path is real but still more contingent than the headline
              valuation talk suggests.
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV010
      - number: '8.4'
        title: Diligence gates and thesis-breakers
        blocks:
          - type: paragraph
            body: >-
              The remaining work is not cosmetic. A serious entry decision still needs cap-table and preference
              visibility, a revenue bridge that moves from ARR headline to gross margin and concentration reality, and a
              cleaner read on whether the legal and geopolitical issues are containable disclosure items or true
              valuation impairments. The most important thesis-break triggers are a filing or diligence package that
              reveals aggressive preference terms, a slip in the Hong Kong IPO timetable, or escalation of the
              distillation and export-control allegations into formal enforcement action. Until those gates are cleared,
              the disciplined posture is to keep Moonshot active in diligence but resist price-taking behavior.
            claimRefs:
              - CV008
              - CV009
              - CV012
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price discipline matters more than product admiration
            body: >-
              Moonshot can still become investable at a premium, but the assigned pool supports that premium only up to
              the last confirmed valuation anchor. Paying the full $50 billion story before the filing, cap-table terms,
              and revenue bridge are visible would convert diligence risk into entry-price risk.
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV007
              - CV012
          - type: callout
            title: The failure mode is disclosure, not just technology
            body: >-
              The most realistic downside is not that Kimi stops being relevant, but that financing and legal
              disclosures force the market to use a lower multiple than private momentum headlines currently imply.
            calloutType: risk
            claimRefs:
              - CV008
              - CV009
              - CV013
