      - number: '6.2'
        title: Adoption proof and distribution
        blocks:
          - type: paragraph
            body: >-
              The clearest adoption proof is developer and channel behavior rather than disclosed enterprise cohorts.
              Independent sources say Kimi K2 topped Hugging Face downloads on launch day, CNBC says Chinese AI models
              are gaining traction among Western companies, and one cited market observer says usage is still
              concentrated in the startup ecosystem rather than large corporates. Named third-party surfaces add another
              layer of proof: Lorphic points to Perplexity’s model picker, China AI Hub notes Coze and Dify integration
              surfaces, and Geotoolbox says OpenRouter carries Kimi models. Together, these signals show real market
              reach, but mostly through low-friction evaluation and distribution channels rather than disclosed direct
              production accounts.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
