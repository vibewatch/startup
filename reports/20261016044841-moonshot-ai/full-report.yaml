      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              The clearest public financial facts are about capital raising rather than self-funded durability. CNBC
              reports Moonshot raised $2 billion at a valuation above $20 billion in May 2026, and Yahoo Finance's
              syndicated Investing.com article says a later summer round started at a $31.5 billion valuation before
              further capital discussions. Forbes then reports a confidential Hong Kong IPO filing framed around a $50
              billion valuation and $3 billion to $5 billion of proceeds. Those step-ups imply investors are willing to
              finance growth aggressively, but they do not answer whether operating cash flow, gross margin, or current
              cash burn can support the same plan without another external capital event.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
      - number: '4.4'
        title: Underwriting gaps and financial verdict
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is directionally positive on demand and clearly negative on public diligence
              completeness. Moonshot looks capable of turning product momentum into paid usage, but the evidence pool
              still lacks the basics needed to underwrite quality: revenue recognition policy, customer concentration,
              net retention, realized pricing by channel, gross margin, compute commitments, burn, debt, and
              runway.       The legal overhang also matters financially, not just reputationally: Forbes reports a
              shareholder claim tied to 10.5% of Moonshot's original shares, while Enterprise DNA describes separate,
              unadjudicated U.S. distillation and export-control accusations. On the current record, the company looks
              financeable, but not yet publicly transparent enough for conviction underwriting.
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI016
