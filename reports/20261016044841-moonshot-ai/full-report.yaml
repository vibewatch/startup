  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Boundary, substitutes, and where Moonshot actually sells
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence suggests Moonshot's addressable market is narrower than "all generative AI" but
              broader than a single consumer chatbot category. AIFunding and China AI Hub both describe Moonshot as a
              Beijing-based builder of the Kimi assistant plus an API platform, while Digital in Asia and GeoToolbox
              separately describe a two-engine model of consumer subscriptions and developer API access. That means
              included spend is paid assistant usage, model/API consumption, coding-agent and workflow spend, and
              partner-led enterprise deployments that rely on Moonshot models. Excluded spend is generic cloud capacity
              with no model usage, unrelated SaaS seats, and the broader consumer internet attention market. The
              practical substitutes are free domestic assistants such as Doubao, other Chinese frontier labs, Western
              closed APIs, and self-hosted open-weight stacks that solve the same long-context, coding, and
              knowledge-work jobs.
            claimRefs:
              - CM001
              - CM003
              - CM010
              - CM011
              - CM012
