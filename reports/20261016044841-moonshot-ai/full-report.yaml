chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and platform positioning
        blocks:
          - type: paragraph
            body: >
              Moonshot AI is consistently described in the retained pool as a Beijing-based model company founded in
              2023, not just a single consumer chatbot. The official site presents Kimi K3 as the current flagship and
              frames the broader product surface around coding, analysis, spreadsheets, slides, knowledge work, and deep
              reasoning, while third-party databases and explainers describe a business spanning consumer assistant
              usage, developer APIs, and enterprise-facing model access. That matters for later chapters because
              Moonshot should be analyzed as a foundation-model platform whose valuation is tied to model capability,
              distribution, and monetization mix, rather than as a narrow consumer app. CNBC's July coverage also
              suggests the company is now judged against the frontier U.S. labs on model quality, not only against
              domestic peers or context-length marketing claims.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
