  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal, regulatory, and governance exposure
        blocks:
          - type: paragraph
            body: >-
              Model lineage is the most severe current risk because the evidence has progressed beyond generalized
              geopolitical suspicion to specific, attributable allegations. CNBC reported that OpenAI disrupted a
              coordinated campaign, linked a core cluster to people associated with Moonshot AI, and observed no breach
              of encryption, databases, or stored conversations. Business Standard separately reported that U.S.
              authorities were considering sanctions, Entity List-style restrictions, and an investigation into access
              to restricted chips. These are allegations and policy signals rather than adjudicated violations, so the
              probability of enforcement cannot be quantified from the pool. Nevertheless, the downside is asymmetric:
              restrictions could affect compute access, distribution, counterparties, and IPO readiness together.
              Moonshot's reported plan to dismantle its offshore red-chip structure adds execution risk because the pool
              describes the intended step but does not confirm completion. The legal register therefore treats verified
              process status and a documented management response as conditions for reducing residual severity.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR009
              - CR013
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR009
              - CR013
              - CR015
      - number: '7.2'
        title: Operational, quality, and security exposure
        blocks:
          - type: paragraph
            body: >-
              Demand evidence doubles as capacity-risk evidence. Two independent explainers report that Moonshot paused
              new paid subscriptions after Kimi K3 demand exceeded available compute, while CNBC cites persistent
              hardware constraints in China. This does not establish a recurring outage or a breached service level, but
              it shows that compute headroom can constrain monetization and onboarding. Trust evidence is weaker:
              GeoToolbox describes a reported cross-user resume exposure, conflicting interpretations of whether it was
              hallucination or isolation failure, and no detailed first-party post-mortem. The same source says hosted
              consumer and API services sit under different China and Singapore entities and that API content may be
              used to improve services absent a separate enterprise arrangement. Those single-source assertions require
              primary confirmation. Self-hosting can reduce hosted-data exposure, but it does not address model-lineage,
              licensing, or restricted-hardware risk and may demand substantial infrastructure.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR012
              - CR014
      - number: '7.3'
        title: Dependencies, financial-model risk, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The business model remains dependent on capital markets, scarce compute, third-party model platforms, and
              developer-led adoption. Investing.com reporting syndicated by Yahoo Finance says Moonshot intended to seek
              a final private round before a Hong Kong IPO at a valuation target as high as $50 billion; that is a
              target, not an achieved valuation or cash balance. Aiera also cautions that Moonshot is private and does
              not publish audited financials, leaving revenue recognition, gross margin, burn, runway, and compute
              commitments unavailable for this chapter. CNBC reports that open-weight adoption is stronger among
              startups than large companies and that benchmark behavior may not carry into production, which raises
              conversion and support risk. Kill criteria should therefore be observable: formal sanctions or Entity List
              action; verified restricted-chip violations; another substantiated cross-user exposure without a credible
              post-mortem; failure to evidence red-chip restructuring before listing; or financing terms that reveal
              inadequate runway. Until those checks clear, product momentum does not offset the combined residual
              exposure.
            claimRefs:
              - CR004
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR004
