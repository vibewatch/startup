              - CU010
          - type: callout
            title: Durability proof still trails reach
            body: >-
              Public adoption signals are real, but retention, concentration, and trust-sensitive enterprise durability
              remain under-documented versus the amount of developer-market buzz.
            calloutType: risk
            claimRefs:
