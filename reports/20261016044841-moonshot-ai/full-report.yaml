        title: Deployment model, developer surfaces, and support constraints
        blocks:
          - type: paragraph
            body: >-
              Moonshot's delivery model gives customers flexibility, but the same split creates diligence work.
              Geotoolbox and China AI Hub both show multiple developer-facing surfaces, including open weights,
              platform.kimi.ai/docs, and kimi-cli/Kimi Code. At the same time, Geotoolbox says the international API is
              operated by a Singapore entity while the consumer service runs from a China entity, and Cathay frames
              local deployment through regional partners as the answer to data-residency questions. That is
              directionally attractive for regulated buyers, but the assigned pool does not provide direct repo/download
              telemetry, public SLA terms, or audited trust artifacts. Product delivery is therefore legible at the
              surface level, yet still under-documented on support depth, adoption breadth, and operational controls.
