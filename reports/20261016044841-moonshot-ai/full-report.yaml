        title: Pricing posture and unit-economics visibility
        blocks:
          - type: paragraph
            body: >-
              Moonshot's monetization design appears strategically coherent but financially opaque. Geotoolbox says the
              company keeps the Kimi app and API closed while publishing open model weights, which widens adoption but
              weakens the proprietary control that usually supports premium AI margins. The same source reports a free
              consumer tier and paid plans from $19 to $199 per month, while TechCrunch says Moonshot has far lower
              margins than closed-weight rivals and Data Innovation says the company joined sector price cuts. Together,
              the sources support a growth-through-access thesis, but list prices do not provide a clean view of
              realized pricing, gross profit, CAC, or payback.
