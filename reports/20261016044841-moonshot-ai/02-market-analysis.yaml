      - Relevance
    rows:
      - [Consumer assistant subscriptions, Paid Kimi plans and premium chat usage, General unpaid search and broad consumer-internet attention, Individual users paying directly, Shows self-serve demand but not enterprise durability]
      - [Developer API and agent workloads, Token-based model usage plus coding-agent and orchestration spend, Generic cloud or software spend with no Kimi model usage, Developers and AI platform teams, Best supported by the product mix described across API and open-weight sources]
      - [Partner-led enterprise deployments, Kimi Work and industry solutions delivered through partner channels, Full system-integration services or unrelated SaaS transformations, Enterprise departments with IT sponsorship, Explains the slower but higher-ticket motion into regulated workflows]
      - [Open-weight ecosystem influence, Self-hosting evaluation and benchmark-driven experimentation around K-series weights, Closed-model-only procurement with no self-host option, ML engineers and infrastructure owners, Important because open weights widen trial and substitution pathways]
    notes: >-
      Boundary table uses workflow evidence from the assigned pool; it distinguishes paid AI usage from adjacent cloud,
      SaaS, and general internet activity that should not be counted as Moonshot market demand.
    claimRefs: [CM001, CM003, CM010, CM011, CM012]
