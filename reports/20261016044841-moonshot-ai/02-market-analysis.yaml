    columns:
      - Publisher
      - Year
      - Geography
      - Value
      - CAGR
      - Methodology
      - Confidence
      - Limitation
    rows:
      - [Digital in Asia, "2026", China plus global users, "~$300M ARR by June 2026", n/a, Commercial-footprint lens based on reported ARR trajectory, medium, Revenue proxy rather than market size]
      - [Baidu Baike, "2026", Global footprint, "API revenue >70% of revenue", n/a, Revenue-mix lens from profile summary, low-medium, Secondary compilation with no audited denominator]
      - [Digital in Asia, "2024", China consumer base, "36M+ MAU by late 2024", n/a, Adoption lens using reported monthly active users, low-medium, User count is historical and not equivalent to paying customers]
      - [Baidu Baike, "2026", Global footprint, "200+ countries/regions", n/a, Geographic reach lens from company profile summary, medium, Reach does not disclose monetized penetration]
      - [AIFunding plus Investing.com/Bloomberg, "2026", China capital market / Hong Kong IPO context, "$23.3B July valuation; $31.5B financing; up to $50B IPO talk", n/a, Capital-market willingness-to-pay lens, medium, Financing and valuation are not TAM or customer-demand measurements]
    notes: >-
      Because the pool lacks a clean third-party TAM/SAM/SOM study, this table preserves multiple non-comparable
      lenses side by side instead of forcing one unsupported market-size number.
    claimRefs: [CM004, CM005, CM006, CM007, CM008, CM014, CM015, CM016]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - [Consumer subscriptions, Individual knowledge workers and students, Same as buyer, Same as buyer, Long-context search and personal productivity assistance, Personal productivity spend, Better model quality after K3 and premium feature access]
      - [Developer API platform, Startups and internal application builders, Engineers and AI product teams, Engineering or platform team, Embedding models into apps and coding agents, CTO / engineering infrastructure budget, Better price-performance or open-weight optionality]
      - [Partner-led enterprise solutions, Enterprise departments in finance healthcare and manufacturing, Function teams plus IT operators, Enterprise operating budget, Workflow automation and domain copilots delivered with partners, CIO / COO / digital-transformation owner, Need for deployment support and compliance comfort]
      - [Open-weight evaluators, Model labs and advanced enterprises, ML engineers, Infrastructure or innovation budget, Self-hosting tests benchmarking and vendor-redundancy planning, AI platform or infra owner, Need for control privacy or fallback optionality]
    notes: >-
      Buyer and budget-owner assignments are evidence-backed inferences from the product and channel mix in the pool;
      the assigned sources do not disclose a formal segment revenue split or named procurement owners.
    claimRefs: [CM003, CM010, CM011, CM012, CM013]
figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      Public evidence layers reach, distribution model, monetization, and capital-market willingness to pay, but it
      still does not produce a clean TAM/SAM/SOM stack.
    data:
      items:
        - label: Consumer reach
          displayValue: 36M+ MAU (late 2024)
          detail: Reported monthly active users show the top of Moonshot's funnel before current monetization.
          claimRefs: [CM006]
        - label: Distribution model
          displayValue: Open weights plus proprietary API
          detail: Moonshot can capture demand through hosted usage while still benefiting from open-weight discovery and trial.
          claimRefs: [CM012]
        - label: ARR inflection
          displayValue: ~$100M to ~$300M ARR (Mar-Jun 2026)
          detail: Public reports show a sharp monetization step-up before the October 2026 refresh date.
          claimRefs: [CM004]
        - label: Revenue mix
          displayValue: "API >70% of revenue"
          detail: API-heavy mix implies the spending base is skewing toward developer and enterprise use cases.
          claimRefs: [CM005]
        - label: Post-K3 demand spike
          displayValue: 6x+ daily sales surge
          detail: The K3 launch created an observable near-term conversion spike in paid demand.
          claimRefs: [CM008]
        - label: Price-performance pull
          displayValue: Cheaper than top U.S. offerings
          detail: Western-company interest rose as Chinese models closed the performance gap while staying cheaper.
          claimRefs: [CM009]
        - label: Capital-market lens
          displayValue: ">$30B to $50B IPO talk"
          detail: Market-value expectations are strong but vary by publisher and are not customer-demand evidence.
          claimRefs: [CM014, CM015]
    approximationNotes: >-
      These layers are ordered commercialization lenses rather than a comparable-population TAM/SAM/SOM funnel; each
      value keeps its source unit and should not be read as a conversion rate.
    claimRefs: [CM004, CM005, CM006, CM008, CM009, CM012, CM014, CM015, CM016]
