  - id: FE001
    title: Moonshot 产品架构图
    type: stack
    summary: Moonshot 将前沿模型研究分层为开放权重分发、开发者工具、托管产品和对合规敏感的部署路径。
    data:
      layers:
        - label: 研究与模型设计层
          detail: 公开分享前沿模型研究，K3 被定位为当前旗舰。
          items:
            - 研究团队 / AGI 方向
            - Kimi Delta Attention
            - 注意力残差
          outputs:
            - K2/K2.5/K2.6/K2.7/K3 发布节奏
        - label: 基础模型层
          detail: 以 K3 为核心的 K 系列开放权重基础模型。
          items:
            - K3：2.8T 参数
            - MoE 路由：896 个专家 / 16 个激活
            - 1M-token 上下文
            - 原生多模态
          outputs:
            - 编程
            - 知识工作
            - 深度推理
        - label: 开发者平台层
          detail: 面向开发者的入口将分发范围扩展到消费者应用之外。
          items:
            - Kimi API 平台
            - platform.kimi.ai/docs
            - Kimi Code / kimi-cli 工具
            - 开放权重下载
        - label: 基准测试与证明层
          detail: Moonshot 还分发基准测试界面和研究成果，帮助开发者发现产品。
          items:
            - WorldVQA
            - PerceptionBench
            - CombiBench
            - Kimi Code Bench 2.0
        - label: 应用层
          detail: Moonshot 在模型家族之上提供托管体验并实现货币化。
          items:
            - Kimi 助手
            - 托管推理
            - 消费者订阅
            - Kimi Work
        - label: 部署与治理层
          detail: 企业采用取决于工作负载运行地点，以及法律 / 合规风险如何处理。
          items:
            - 新加坡运营的国际 API
            - 中国运营的消费者服务
            - 区域合作伙伴本地部署
            - 定制 K3 许可
            - 容量扩展
    approximationNotes: 这一架构是对已验证层次和依赖关系的定性综合，不是内部系统的逐字架构图。
    claimRefs:
      - CE003
      - CE004
      - CE009
      - CE010
      - CE011
      - CE013
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Moonshot 通过自助、开发者和合作伙伴渠道触达用户，但企业扩张仍会卡在信任与合规门槛上。
    data:
      nodes:
        - label: 免费 Kimi 应用
          details: 自助式发现从聊天和轻量生产力用例开始。
          touchpoints:
            - Free tier and premium app plans
            - Coding, analysis, sheets, and slides workflows
        - label: API 或供应商试用
          details: 开发者可以通过 Moonshot API 或第三方供应商测试 Kimi。
          touchpoints:
            - Open Platform API
            - OpenRouter pay-per-use access
        - label: 开放权重自托管
          details: 拥有基础设施的组织无需将数据发送至 Moonshot 托管服务即可采用 Kimi。
          touchpoints:
            - Hugging Face/open-weight route
            - Privacy-sensitive evaluation path
        - label: 合作伙伴界面
          details: 指定合作伙伴和路由器界面将曝光范围扩展到 Moonshot 自有资产之外。
          touchpoints:
            - Perplexity model picker
            - Coze model node
            - Dify orchestration
        - label: 工作流扩展
          details: 成功用户可以通过编程和智能体知识工作产品加深使用。
          touchpoints:
            - Kimi Code
            - Kimi Work
        - label: 企业信任门槛
          details: 更大范围的企业落地取决于能否解决数据管辖权、事件响应和法律溯源方面的顾虑。
          touchpoints:
            - Singapore API vs China consumer-service entities
            - Cross-user exposure incident
            - Distillation/export-control allegations
