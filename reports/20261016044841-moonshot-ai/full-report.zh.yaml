      - number: '1.2'
        title: 领导层、创始人市场契合度与治理包袱
        blocks:
          - type: paragraph
            body: >
              指定来源高度聚焦创始人兼 CEO 杨植麟的研究背景及技术实力深厚的创始团队，但对现任董事会构成和控制权仍很不完整。Geotoolbox 将 Yang、Zhou Xinyu 和 Wu Yuxin
              列为创始人；ThinkChina 的财新来源简介则把 Zhang Yutao 纳入运营启动故事，并将公司成立直接联系到 2023 年初 ChatGPT
              之后的窗口期。这一组合支持其在前沿模型开发上的创始人市场契合度，也解释了 Recurrent 渊源争议为何重要：Forbes 报道称，前利益相关方质疑 Moonshot
              是否获得适当授权后成立，以及关键资产是否恰当转移。另据 Enterprise DNA
              转述，美国官方还提出了尚未裁决的模型蒸馏和规避出口管制指控。因此，公开证据足以识别关键人物和治理风险，但不足以完成对现任董事会、实体架构或投资人权利体系的尽调。
