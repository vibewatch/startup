      - number: '3.3'
        title: 持久性、多归属与不利压力
        blocks:
          - type: paragraph
            body: >-
              Moonshot 的护城河更像不断移动的领先，而不是锁定平台。优势来自长上下文品牌、开放权重分发，以及 Kimi 发布迭代在中国 AI
              圈迅速重置注意力的能力。这些优势有价值，却也容易商品化：买家可以多归属，开发者可以替换后端模型，同行每次基准跃升都会重排注意力。更难处理的是信任风险：Enterprise DNA
              将模型蒸馏和出口管制指控总结为法律与地缘政治尽调问题；Forbes 则显示，Recurrent 股东争议可能增加 IPO 披露和管理层注意力负担。因此 Moonshot
              的商业持久性更多已在开发者和消费者势头中得到证明，而不是在公开企业锁定故事中得到证明。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP014
      - number: '3.4'
        title: 图表
        blocks:
          - type: callout
            title: Moonshot 最强的替代威胁不是某个竞争模型，而是买家可以多归属。
            body: 公开证据反复显示，Kimi 所处的世界允许开发者在托管助手、开放权重供应商和自托管部署之间路由。这削弱了纯模型锁定，使产品打磨度、信任和企业流程比单轮基准领先更重要。
            calloutType: insight
            claimRefs:
              - CP005
              - CP008
              - CP010
          - type: callout
            title: 最重要的竞争质疑是信任与治理，而不是原始能力不足。
            body: 指定的不利来源并未称 Moonshot 缺乏前沿野心，而是指出法律、出口管制和股东治理问题可能降低企业接受度，并让未来 IPO 更脆弱。
            calloutType: risk
            claimRefs:
              - CP011
              - CP012
