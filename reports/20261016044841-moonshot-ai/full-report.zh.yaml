  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与平台定位
        blocks:
          - type: paragraph
            body: >
              保留资料池一致将 Moonshot AI 描述为一家 2023 年成立、总部位于北京的模型公司，而不只是一个消费者聊天机器人。官网将 Kimi K3
              定位为当前旗舰，并把更广的产品面延伸到编程、分析、表格、幻灯片、知识工作和深度推理；第三方数据库与解读则显示，其业务覆盖消费者助手、开发者 API 及面向企业的模型访问。后续章节必须据此把 Moonshot
              视为基础模型平台：估值取决于模型能力、分发和变现组合，而不是单一消费者应用。CNBC 7 月报道还表明，市场如今是拿它与美国前沿实验室比较模型质量，而不只是与国内同行或上下文长度营销说法比较。
