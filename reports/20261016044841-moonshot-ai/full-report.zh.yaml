      - number: '4.3'
        title: 资本充足度与融资依赖
        blocks:
          - type: paragraph
            body: >-
              最清晰的公开财务事实是融资，而不是自我造血的持久性。CNBC 报道 Moonshot 于 2026 年 5 月以超过 $20 billion 的估值融资 $2 billion；Yahoo Finance 刊载的
              Investing.com 文章称，之后夏季一轮融资起始估值为 $31.5 billion，随后又讨论更多资本。Forbes 进一步报道，一份保密的香港 IPO 申请以 $50 billion 估值和 $3
              billion 至 $5 billion 募资额为框架。这些估值跃升说明投资者愿意激进地为增长融资，但无法回答经营现金流、毛利率或当前现金消耗能否在没有下一次外部融资的情况下支撑同一计划。
