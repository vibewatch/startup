      - number: '4.4'
        title: 投资判断缺口与财务结论
        blocks:
          - type: paragraph
            body: >-
              财务结论对需求是偏正面的，但对公开尽调完整度明显偏负面。Moonshot
              看起来有能力把产品势头转成付费使用，但资料池仍缺少评估质量所需的基本信息：收入确认政策、客户集中度、净留存、按渠道实际价格、毛利率、算力承诺、烧钱、债务和 资金跑道。法律包袱也影响财务，不只是声誉：Forbes
              报道一项与 Moonshot 原始股份 10.5% 相关的股东索赔；Enterprise DNA
              则描述了另行存在、尚未裁决的美国模型蒸馏和出口管制指控。按当前记录，公司看起来能融资，但公开透明度还不足以支撑高确信度投资判断。
