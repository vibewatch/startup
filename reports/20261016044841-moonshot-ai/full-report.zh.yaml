  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、替代品与 Moonshot 的实际销售场景
        blocks:
          - type: paragraph
            body: >-
              指定证据显示，Moonshot 的可服务市场小于“全部生成式 AI”，但大于单一消费者聊天机器人品类。AIFunding 和 China AI Hub 将其描述为总部位于北京、同时打造 Kimi 助手和 API
              平台的公司；Digital in Asia 与 GeoToolbox 则指出消费者订阅和开发者 API 是两台增长引擎。纳入项包括付费助手、模型／API 用量、编程代理和工作流支出，以及依赖 Moonshot
              模型的合作伙伴企业部署；排除项包括无模型用量的通用云容量、无关 SaaS 席位和更广义的消费者互联网注意力市场。实际替代品包括 Doubao 等免费国内助手、其他中国前沿实验室、美国封闭 API
              和解决相同长上下文、编程与知识工作需求的自托管开放权重技术栈。
