            body: >-
              剩余工作不是装饰性的。严肃的入场决策仍需要清晰的 cap table 和优先权信息，需要把 ARR
              标题连接到毛利率和集中度现实的收入桥接表，也需要判断法律与地缘政治问题究竟是可控的披露事项还是实质估值减损。最重要的论点失效触发器包括：申报或尽调材料暴露激进优先权条款、香港 IPO
              时间表延误，或模型蒸馏和出口管制指控升级为正式执法。在这些关口通过前，应继续把 Moonshot 作为活跃尽调对象，但不要被动接受价格。
