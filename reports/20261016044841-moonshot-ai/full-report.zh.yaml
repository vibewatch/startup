  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 看多
        - 经验证的 ARR 大幅高于 6 月公开披露的底线，海外采用持续，且 IPO 披露保持清晰。
        - 只有货币化跃升得到验证、而不是只靠叙述时，$50 billion 或更高的结果才更容易站得住。
        - 执行滞后、利润率压缩或隐藏的优先权条款，仍可能侵蚀溢价。
        - 有可能，但尚未得到公开验证。
      - - 基准
        - 以 2026 年 7 月的 $35 billion 轮融资作为最后一个已确认锚点，并假设货币化披露有所改善但仍不完整。
        - 围绕最后确认的价格保持入场纪律，避免提前支付传闻中的全部 IPO 溢价。
        - 在验证结果出来前，市场可能继续为这个故事抬价。
        - 与当前公开证据最匹配。
      - - 看空
        - IPO 延后、$50 billion 的跃升仍未确认，或法律 / 监管压力恶化。
        - 即使产品没有失败，只要披露风险占主导，估值倍数压缩或下轮融资也会变得合理。
        - 在申报文件迫使情况明朗前，动量型投资者可能忽视风险。
        - 如果尽调质量没有改善，下行路径会很实质。
    notes: 由于指定来源池没有披露足够的经审计经营数据，情景逻辑采用方向性判断，而不是精确到点的 DCF 计算，以免制造虚假的精确度。
