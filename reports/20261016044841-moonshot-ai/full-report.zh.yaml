      - number: '3.2'
        title: 能力、定价与分发取舍
        blocks:
          - type: paragraph
            body: >-
              Kimi 最锋利的切口不是宣称全面领先，而是把强编程和多步骤代理表现、超长上下文与部署灵活性组合起来，这些是封闭竞争产品难以同时匹配的。Geotoolbox、Comparative AI 和 China AI
              Hub 都支持这一拆分：Moonshot 的应用或 API 界面封闭，但模型策略采用开放权重。买家可以先试托管产品、转向第三方路由，或自托管权重，因此技术切换成本更低。代价是 ChatGPT 和 Claude
              在整体打磨度及生态深度上仍更强；Kimi 的公开定价更激进，但自托管经济性、额度方案和定制企业条款并非同一产品，难以直接比较。
