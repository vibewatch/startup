  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与 Moonshot 的位置
        blocks:
          - type: paragraph
            body: >-
              相关竞争格局不只是“中国其他模型实验室”。公开证据显示，Moonshot 与 DeepSeek、Z.ai（ZhipuAI）和 MiniMax 等中国开放权重同行竞争，也在编程和代理能力上与
              OpenAI、Anthropic 等美国前沿公司竞争；同时还面对自托管开放权重、而非购买封闭助手的替代部署方式。Comparative AI 和 China AI Hub 将其定位为以长上下文和编程为核心的
              Kimi 产品家族，CNBC 则在部分基准测试中直接把 K3 与 OpenAI、Anthropic
              对比。因此买家选择不仅是供应商对供应商，也包括托管产品对开放权重模型、中国技术栈对美国在位者、消费者分发对企业信任。
