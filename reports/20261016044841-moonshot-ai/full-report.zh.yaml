  - id: TV001
    title: 建议摘要表
    columns:
      - 观察角度
      - 当前判断
      - 证据基础
      - 决策含义
    rows:
      - - 建议
        - research-more
        - 产品和融资势头强劲，但在最近一次已确认成交价之上，价格支撑尚不完整。
        - 保持积极尽调，但不要把当前公开证据视为足以作出买入判断。
      - - 置信度
        - medium
        - 多份独立报道都指向强劲势头和 IPO 意图，但最高一档估值跃升及核心披露缺口仍未解决。
        - 一份申报文件、管理层尽调结果或经审计的运营数据，可能提高置信度。
      - - 风险评级
        - high
        - 即使产品质量保持强劲，法律、监管、地缘政治和披露风险也都可能扩大 IPO 折价。
        - 先评估下行风险，再把上行空间计入投资判断。
      - - 估值立场
        - stretched
        - 7 月的 $35 billion 轮融资是本证据池中最明确的已完成估值锚点；$50 billion 的说法仍不完整。
        - 把已确认轮次作为估值纪律锚点，在支付传闻中的下一档价格前要求更充分的证明。
    notes: 该判断刻意对价格保持敏感：本表区分了最近一次已确认的估值锚点与更高但尚未确认的 IPO 或融资说法。
