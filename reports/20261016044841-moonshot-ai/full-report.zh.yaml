              Moonshot 的 $50 billion 叙事不是市场平均值，而是在主张公司已凭产品领导力、分发和收入势头脱离同行。尤其在 K3
              之后，这种脱离有一定可信度，但相应的证明负担更高。若公开申报能把故事转成可审计指标并解决治理问题，IPO 可以成立；在此之前，退出路径真实存在，但比估值标题所暗示的更具条件性。
