        title: 融资、规模指标与里程碑路径
        blocks:
          - type: paragraph
            body: >
              Moonshot 的融资故事如今跑在披露质量前面。CNBC 称公司 2026 年 5 月以超过 $20 billion 的估值融资 $2 billion；Multiples 记录了 2026 年 7 月 $35
              billion 的估值快照，以及截至 2026 年 5 月的 $200 million 收入；Yahoo Finance 刊载的 Investing.com 报道称，Moonshot 已在讨论另一轮融资，IPO
              前目标估值最高可达 $50 billion。ThinkChina 进一步报道，公司已从广告驱动的消费者增长转向企业和开发者变现，并引用 2026 年 6 月 $300 million 的
              ARR。这些数字说明商业势头确实存在，但不能压成一条干净的趋势线：收入和 ARR 是不同指标，最新估值标题也混合了已完成融资、数据库快照和 IPO 目标。本章的基准情景是：Moonshot
              已具商业相关性且资本日益充足，但客户数量、员工数和治理结构仍有重大披露缺口。
