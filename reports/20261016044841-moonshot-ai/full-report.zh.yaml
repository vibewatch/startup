              模型来源是当前最严重的风险，因为证据已从笼统地缘政治怀疑推进到具体且有明确归属的指控。CNBC 报道称，OpenAI 破获了一项协调行动，将核心集群与 Moonshot AI
              相关人士联系起来，同时未发现加密、数据库或已存对话遭到入侵。Business Standard
              另称，美国当局正在考虑制裁、类似实体清单的限制，以及调查其获取受限芯片的情况。这些是指控和政策信号，并非已裁决违规，资料池无法量化执法概率。但下行风险不对称：限制可能同时影响算力访问、分发、交易对手和 IPO
              准备度。Moonshot 据报道计划拆除离岸红筹结构，资料池描述了意图但未确认完成，因而增加执行风险。法律登记表把已核实的程序状态和有文件记录的管理层回应视为降低剩余严重度的条件。
