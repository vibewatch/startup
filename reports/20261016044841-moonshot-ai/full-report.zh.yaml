      - number: '2.3'
        title: 什么推动采用，又什么会拖慢采用
        blocks:
          - type: paragraph
            body: >-
              采用势头同时来自产品经济性和产品形态。CNBC 报道称，中国 AI 模型在西方企业中获得市场 traction，因为性能差距在缩小，价格仍低于美国顶尖产品；Investing.com 援引 Bloomberg 将
              K3 视为规模、性能和定价“全面追赶”的证据。GeoToolbox 和 China AI Hub 说明产品容易试用：Moonshot 开放底层模型权重，但保留托管应用和 API
              的专有性，为希望保留选择权的开发者降低试验摩擦。不过企业买家仍需编排和集成能力；即使尚未裁决，2026 年模型蒸馏和出口管制指控也会造成采购、法律和合规摩擦。
