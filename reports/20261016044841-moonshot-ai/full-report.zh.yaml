        title: 收入模式与公开商业势头
        blocks:
          - type: paragraph
            body: >-
              公开收入故事的强项是势头，而不是经审计细节。TechCrunch 报道称，Moonshot 目标是在 2026 年底达到 $2 billion 的年化收入，是其已披露 8 月 run rate
              的两倍；Geotoolbox 则称，Moonshot 2026 年 5 月融资时年化收入约 $200 million。Chinabizinsider 提供更早的需求证据：据报道，Kimi 订阅订单 2026 年
              1 月环比跃升 8,280%，2 月再增 123.8%；公司据称在 1 月下旬 20 天产生的收入超过 2025 年全年。这些信息支持真实的变现爬坡，但仍是 run rate
              和支付量证据，而不是披露的确认收入桥接表。
