              $35 billion，也说明投资者为何愿意讨论更高数字：Kimi K3 强化了 Moonshot 的前沿定位，扩大了 IPO 话题。但同一资料池没有证明同样重要的另一面：$50 billion
              仍被描述为要价、匿名来源报道或 IPO 前愿景，而不是条款披露完整的已完成融资。同时，公开 ARR 和收入质量细节仍太薄，不能把上行情景当作已证实。
