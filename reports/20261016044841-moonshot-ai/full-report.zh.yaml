          note: 更低的定价和开放权重经济性可以扩大需求，但会压缩毛利率。
          tone: risk
        - id: financing
          label: 融资桥接
          note: 私募轮次和 IPO 规划仍是核心，因为公开可见的烧钱、现金跑道和现金流信息有限。
          tone: risk
      edges:
        - from: open-weights
          to: closed-surfaces
          label: 分发扩大产品漏斗
        - from: closed-surfaces
          to: paid-usage
          label: 付费界面带来订阅和托管计费活动
