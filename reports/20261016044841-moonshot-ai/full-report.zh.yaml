  - id: FP001
    title: 竞争定位图：托管助手 vs 自托管开放权重
    type: quadrant
    summary: 对指定来源池中证据最充分的替代产品，按开放性或可自托管性与开箱即用的产品完善度进行序数定位。
    data:
      xAxis:
        label: 开放性 / 可自托管性
        min: 1
        max: 5
        lowLabel: Closed product
        highLabel: Self-hostable open weights
        scale: Ordinal
        description: >-
          Higher scores reflect published open-weight availability and realistic self-hosting paths; lower scores
          reflect closed flagship products.
      yAxis:
        label: 开箱即用的产品完善度
        min: 1
        max: 5
        lowLabel: Build-it-yourself
        highLabel: Turnkey assistant
        scale: Ordinal
        description: >-
          Higher scores reflect public evidence of turnkey user experience and ecosystem depth rather than model quality
          alone.
      points:
        - label: Kimi 应用 / API
          x: 4
          'y': 3
          detail: 由开放权重模型支撑的托管产品，但生态深度不及 ChatGPT 或 Claude。
        - label: 自托管 Kimi 权重
          x: 5
          'y': 2
          detail: 部署灵活性最高，但基础设施和运维负担由买方承担。
        - label: ChatGPT
          x: 1
          'y': 5
          detail: 端到端生态最广，但指定证据中没有旗舰级自托管路径。
        - label: Claude
          x: 1
          'y': 4
          detail: 推理能力审慎、端到端能力强的企业助手，但仍是封闭栈。
        - label: DeepSeek 应用
          x: 4
          'y': 3
          detail: 低成本托管替代品，存在类似的中国数据顾虑。
        - label: 自托管 DeepSeek
          x: 5
          'y': 2
          detail: 对开发者而言便宜且灵活，但产品完善度取决于买方技术栈。
    approximationNotes: 坐标是基于引用来源的序数综合判断，不是基准测试百分比，也不是测量得到的客户满意度分数。
