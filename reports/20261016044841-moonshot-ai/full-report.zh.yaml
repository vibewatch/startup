  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 当前证据指向“等待更充分证明”的建议，而不是对产品做简单的是 / 否判断。
    data:
      nodes:
        - label: 前沿产品证明
          detail: K3 强化了战略故事，也让融资关注度维持高位。
        - label: 有记录的货币化底线
          detail: 公开 ARR 证据达到 $300 million，但质量和集中度信息仍很薄弱。
        - label: 最后确认的价格锚点
          detail: 2026 年 7 月的 $35 billion 是来源池中最清晰的已完成估值节点。
        - label: $50B 跃升仍不完整
          detail: IPO 和融资报道都谈到这一数字，但没有充分验证已完成的轮次。
        - label: 法律与地缘政治拖累
          detail: 诉讼以及蒸馏或出口管制指控可能推高折现率。
        - label: 今日决策为继续研究
          detail: 在货币化得到验证、条款更清晰、披露更干净之前，先不要追价。
    approximationNotes: 这一顺序体现的是投资判断逻辑，不是量化概率树，也不是为每个节点建模的因果权重。
    claimRefs:
      - CV004
      - CV006
      - CV007
      - CV012
      - CV014
