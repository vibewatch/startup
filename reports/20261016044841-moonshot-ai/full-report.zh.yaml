        blocks:
          - type: paragraph
            body: >-
              资料池没有针对 Moonshot 特定工作负载组合的可靠第三方 TAM／SAM／SOM 研究，因此公开估算应结合多个代理视角，而不是引用一个市场总额。Digital in Asia 给出的变现指标包括：2026
              年 3 月 ARR 约 $100 million、6 月约 $300 million，以及 K3 发布后迫使 Moonshot 暂停新订阅的销售激增。Baidu Baike 补充称，API 收入占比超过
              70%，产品覆盖 200 多个国家和地区。Digital in Asia 还给出截至 2024 年底超过 36 million MAU 的需求指标。资本市场信号方向有用但相互矛盾：一篇报道指向超过 $30
              billion 的 IPO 目标，Investing.com 援引 Bloomberg 称目标最高可达 $50 billion。这些数字说明投资者愿意为该品类敞口付费，却不能替代市场规模证据。
