  evidenceGaps:
    - type: missing-source
      severity: material
      topic: model-lineage
      missingEvidence: >-
        Primary regulator or court records, Moonshot's documented response, and independently reviewed controls
        addressing the reported extraction activity and chip-sourcing allegations.
      whyItMatters: >-
        The available evidence establishes attributable allegations and possible enforcement paths, but not a
        violation, adjudication, complete actor map, or bounded financial consequence.
      diligencePath: >-
        Obtain platform notices, access logs, chip procurement records, regulator correspondence, and written
        opinions from export-control and intellectual-property counsel.
      relatedQuestionRefs:
        - QR001
      relatedTableRefs:
        - TR001
    - type: missing-source
      severity: material
      topic: privacy-incident
      missingEvidence: >-
        The original incident record, affected-user denominator, Moonshot's root-cause analysis, notification
        record, corrective controls, and independent validation.
      whyItMatters: >-
        A single secondary account cannot distinguish hallucination from data-isolation failure or establish the
        probability of recurrence for enterprise workloads.
      diligencePath: >-
        Request the incident ticket, privacy counsel memo, isolation test results, remediation evidence, and
        current penetration or security-assessment reports.
      relatedQuestionRefs:
        - QR003
      relatedTableRefs:
        - TR002
    - type: private-evidence-only
      severity: material
      topic: financial-disclosure
      missingEvidence: >-
        Audited revenue recognition, gross margin, monthly burn, cash balance, runway, compute commitments,
        financing terms, and cap-table effects of restructuring.
      whyItMatters: >-
        Funding raised and a target valuation do not establish cash available, sustainable unit economics, or
        capacity to fund frontier-model development through an IPO delay.
      diligencePath: >-
        Review audited statements, monthly management accounts, bank balances, financing documents, board
        budgets, cloud and GPU contracts, and the post-restructuring capitalization table.
      relatedQuestionRefs:
        - QR005
      relatedTableRefs:
        - TR003
    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: >-
        Named enterprise production deployments, retention, workload expansion, revenue concentration, channel
        mix, and regulated-customer procurement outcomes.
      whyItMatters: >-
        Developer interest and reported benchmark performance do not prove durable enterprise revenue or
        diversification away from capital-intensive consumer usage.
      diligencePath: >-
        Obtain customer-level revenue cohorts, top-account concentration, renewal records, deployment references,
        support burden, and lost-deal analysis by jurisdiction.
      relatedQuestionRefs:
        - QR009
      relatedTableRefs:
        - TR003
