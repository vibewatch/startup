  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: safety-governance
      missingEvidence: >
        No safety framework, responsible scaling policy, model card template, red-teaming
        protocol, or alignment research agenda exists in any public source.
      whyItMatters: >
        Ineffable is pursuing frontier-scale RL training aimed at superintelligence. Without a
        published safety governance framework, investors and regulators cannot assess what
        controls will govern training, evaluation, or deployment decisions. This is the highest-
        priority governance gap for a frontier AI lab at this stage.
      diligencePath: >
        Request draft RSP or equivalent internal governance document in the data room. Confirm
        whether David Silver has engaged with the UK AI Safety Institute or signed the Seoul
        Summit commitments. Ask for timeline to publish a public safety framework.
      relatedQuestionRefs:
        - QE005
        - QE006
        - QE022
        - QE026

    - type: missing-source
      severity: blocking
      topic: developer-surface
      missingEvidence: >
        No GitHub repositories, open-source code, API documentation, HuggingFace model page,
        or active developer community exists for Ineffable Intelligence.
      whyItMatters: >
        For a frontier AI lab, public developer presence — even pre-commercial — is a leading
        indicator of research velocity, transparency, and community building. Its complete absence
        means third parties cannot independently assess technical progress, architecture decisions,
        or research quality.
      diligencePath: >
        Request internal technical roadmap, architecture specification, and any code repositories
        or technical artefacts. Ask whether open-source or academic publication plans exist.
      relatedQuestionRefs:
        - QE008

    - type: private-evidence-only
      severity: material
      topic: partnership-terms
      missingEvidence: >
        Commercial terms (pricing, compute credits, exclusivity, SLA) of both the NVIDIA
        engineering collaboration and the Google Cloud partnership are not publicly disclosed.
      whyItMatters: >
        The compute cost structure, compute access guarantee, and concentration risk of the
        two-partner model cannot be assessed without the partnership terms. If Google Cloud
        credits offset cash spend significantly, the effective burn rate is lower; if the terms
        are time-limited or priced at market rates, capital adequacy is more constrained.
      diligencePath: >
        Request both partnership agreements (or key commercial terms) in the data room. Confirm
        whether the Google Cloud and NVIDIA arrangements include in-kind compute, pricing
        guarantees, or minimum commitments.
      relatedQuestionRefs:
        - QE004
        - QE015

    - type: missing-source
      severity: material
      topic: simulation-design
      missingEvidence: >
        No specification of Ineffable's simulation environments, reward model design, domain
        coverage strategy, or anti-reward-hacking measures has been published or disclosed.
      whyItMatters: >
        The simulation-to-real gap and reward hacking are the two core technical risks in
        experience-based RL. Without knowing the simulation design, it is impossible to assess
        whether Ineffable's approach can generalise beyond well-defined game domains to the
