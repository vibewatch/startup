  - id: TE002
    title: Ineffable Intelligence — Workflow / Use-Case Table
    columns:
      - User Job / Goal
      - Current Workflow (Pre-Superlearner)
      - Intended Ineffable Solution
      - Claimed Benefit
      - Limitation / Evidence Gap
    rows:
      - - Scientific knowledge discovery (e.g., new materials, drug targets)
        - Human researchers iterate on hypotheses using existing literature and experiments
        - Superlearner generates and tests hypotheses through RL in simulations at scale
        - Accelerated discovery beyond what human researchers can exhaustively explore
        - No deployed capability; no evidence of scientific output from any Ineffable system
      - - Mathematical proof discovery
        - Mathematicians use intuition and heuristic search; proof assistants verify
        - RL agent discovers novel proofs through experience (comparable to AlphaProof)
        - First AI system to solve Olympiad-level problems autonomously
        - AlphaProof was DeepMind, not Ineffable; no comparable Ineffable system exists
      - - Engineering optimisation (sorting, matrix multiplication)
        - Domain experts hand-craft algorithms; search is heuristic
        - RL agent discovers faster algorithms by trial-and-error in simulation
        - Demonstrated at DeepMind (sorting, matrix mult.) — not yet at Ineffable
        - Predecessors demonstrate concept; Ineffable has not replicated or extended
      - - General knowledge acquisition (any domain)
        - LLMs trained on internet-scale human data; knowledge bounded by human record
        - Superlearner generates own knowledge through experience; unbounded in principle
        - Escapes the "fossil fuel" constraint of human-data-bounded AI systems
        - Unproven at the general-knowledge scale; reward function design is the key blocker
    notes: >
      Workflow descriptions are based on David Silver's public statements, the NVIDIA-Ineffable
      blog, Wired interview, and precedents from Silver's DeepMind career. No Ineffable-specific
      use case has been deployed or demonstrated as of the run date. All benefit claims are
      speculative or attributed to DeepMind predecessors.
