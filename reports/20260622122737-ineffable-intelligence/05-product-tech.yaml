  - id: architecture-operating-model
    title: Architecture and Operating Model — RL Training Pipeline
    body: |
      The core operating model is an experience-based reinforcement-learning pipeline: agents act
      inside simulation environments, observations and rewards are generated, and model weights
      are updated in continuous loops. This differs fundamentally from pretraining on static
      datasets. As explained in the co-authored NVIDIA-Ineffable blog post, "the system has to
      act, observe, score and update continuously in tight loops, which puts pressure on
      interconnect, memory bandwidth and serving in ways that pretraining doesn't." The system
      will also train on "rich forms of experience quite distinct from human language," potentially
      requiring "novel model architectures and training algorithms."

      The founders bring deep technical precedent to this architecture. Lasse Espeholt, a
      co-founding team member, was lead author of the IMPALA architecture (2018), which
      established scalable distributed deep RL with importance-weighted actor-learner designs.
      The A3C framework (Mnih et al., 2016), foundational to asynchronous parallel RL training,
      is a direct ancestor of the approach Ineffable is scaling. The AdA paper (2023) by the
      DeepMind team — Human-Timescale Adaptation in an Open-Ended Task Space — demonstrated that
      large-scale multi-task RL can produce general agents that adapt across hundreds of tasks
      with human-timescale learning. These precedents inform but do not define Ineffable's
      system; the company has not published any architecture description, model specification,
      or design document for the actual superlearner.

      The operating flow is research-phase: simulation environments generate experiences, those
      experiences are scored by reward models, training updates are propagated through the model,
      and the cycle repeats at scale. The workflow table (TE002) maps this research workflow
      against the intended future use cases. The architecture table (TE003) maps the technical
      stack layers against their dependencies and risks. The operating flow figure (FE002)
      illustrates how experience generation, scoring, and training connect in the research
      pipeline.
