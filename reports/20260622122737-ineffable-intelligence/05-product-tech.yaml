  - id: infrastructure-dependencies
    title: Infrastructure — NVIDIA and Google Cloud Dependencies
    body: |
      Ineffable's compute infrastructure is built on a two-partner model. NVIDIA provides the
      hardware platform; Google Cloud provides the cloud deployment environment. The NVIDIA
      partnership, announced in May 2026, is an engineering-level collaboration to "co-design
      the infrastructure for large-scale reinforcement learning." Work started on NVIDIA Grace
      Blackwell and is "among the first to explore the upcoming NVIDIA Vera Rubin platform."
      The Vera Rubin NVL72 rack integrates 72 Rubin GPUs and 36 Vera CPUs connected via NVLink 6,
      and includes a dedicated CPU rack with 256 Vera CPUs purpose-built for RL environment
      simulation — a hardware capability that is directly relevant to Ineffable's experience-
      generation layer. The Vera Rubin platform achieves up to 10x higher inference throughput
      per watt than Blackwell and trains large models with one-quarter the GPU count.

      Google Cloud was selected in June 2026 as the preferred cloud partner following "a rigorous
      evaluation of the infrastructure market." Under the partnership, Ineffable will deploy "one
      of the largest clusters of A5X" on Google Cloud, powered by the Vera Rubin NVL72. Google
      Cloud's "AI Hypercomputer" architecture — combining Jupiter networking, performance-
      engineered GPUs, and optimised storage — was cited by David Silver as the deciding factor
      over a standard "box of chips" approach: "Training frontier models requires more than just
      raw compute; it requires a sophisticated orchestration of hardware and software." The
      partnership also covers Google Cloud's network fabric (Jupiter networking) and storage
      systems, enabling tight coupling between training and inference workloads.

      These infrastructure dependencies create material concentration risk. Ineffable's entire
      compute programme depends on NVIDIA's Vera Rubin production ramp (confirmed "in full
      production" at GTC 2026), on NVIDIA's software stack (CUDA, NVLink), and on Google Cloud's
      AI Hypercomputer availability and pricing at scale. The terms of both partnerships —
      pricing, compute credits, exclusivity, and service-level agreements — are not publicly
      disclosed. The critical dependency figure (FE003) maps the full dependency chain. The
      product architecture figure (FE001) shows the layered technical stack.
