  - id: trust-safety-compliance
    title: Trust, Safety, Compliance, and Quality Controls
    body: |
      Ineffable has made no public safety, alignment, or compliance disclosures as of 22 June
      2026. No model card, safety evaluation framework, alignment research agenda, red-teaming
      protocol, or responsible scaling policy equivalent has been published. No conformity
      assessment, AI Act compliance statement, or UK regulatory filing has been submitted or
      disclosed. The company has not publicly signed the Frontier AI Safety Commitments agreed
      at the Seoul AI Summit (May 2024), which by February 2025 had attracted additional
      signatories including major frontier labs.

      The absence of safety disclosures is not, by itself, evidence of unsafe practice — Ineffable
      is at a very early research stage with no trained system to evaluate. However, the pattern
      among frontier AI labs is to publish safety frameworks before training at scale, not after.
      Anthropic's Responsible Scaling Policy (now at version 3.3, updated May 2026) sets thresholds
      and governance gates for capability progression before training proceeds at each tier.
      OpenAI has published Preparedness Framework documents. The UK AI Safety Institute has
      published evaluation criteria for frontier model assessment. None of these have an Ineffable
      equivalent. This gap is itself material diligence evidence: investors and policymakers
      cannot assess what safety governance structure will govern training, evaluation, or
      deployment decisions.

      The UK regulatory environment is relevant but currently permissive. The UK AI Regulation
      White Paper (2023) takes a pro-innovation, sector-specific approach with no specific
      frontier AI rules. The EU AI Act imposes requirements on providers of general-purpose AI
      models with systemic risk, and would likely apply to any Ineffable model once training
      reaches threshold compute (10^25 FLOPs). Ineffable is domiciled in the UK (outside EU AI
      Act jurisdiction at present), but would face EU Act obligations if it deploys in Europe.
      No compliance pathway, data governance policy, or privacy framework has been disclosed.
      The trust and compliance table (TE004) maps all relevant controls against their current
      public status.
