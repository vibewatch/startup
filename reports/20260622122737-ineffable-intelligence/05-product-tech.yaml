company:
  name: Ineffable Intelligence
chapter:
  number: 5
  title: Product & Technology
  summary: |
    Ineffable Intelligence has no commercial product, API, or deployed system as of 22 June 2026.
    Its deliverable is a research and infrastructure programme: a frontier reinforcement-learning
    (RL) pipeline — the "superlearner stack" — designed to train AI agents that discover all
    knowledge from their own experience rather than from human data. The architecture is built on
    NVIDIA Grace Blackwell and the forthcoming Vera Rubin NVL72 platform co-designed with NVIDIA,
    deployed on Google Cloud's AI Hypercomputer with A5X clusters. Maturity is at concept /
    infrastructure-build-out stage. No model cards, safety disclosures, alignment frameworks,
    evaluation benchmarks, or public outputs exist. Technical risks include extreme compute
    dependence, unproven generalisation beyond game-playing domains, the simulation-to-real gap,
    and reliance on partner hardware and software roadmaps not under Ineffable's control.

sections:
  - id: product-platform-definition
    title: Product Definition — The Superlearner Research Platform
    body: |
      Ineffable Intelligence does not offer a commercial product, service, or API. Its current
      deliverable is a research programme and infrastructure stack oriented around building what
      it calls a "superlearner": an AI system that discovers all knowledge from its own experience
      through reinforcement learning, without relying on human-generated data. The company
      explicitly states that it is operating in "a window where ambitious research can thrive,
      without bending to the demands of incremental products and near-term profits." This is a
      deliberate pre-commercial posture, not a temporary gap.

      The superlearner concept has three functional components as described in public materials.
      First, an experience-generation layer: the system acts in simulation environments, generating
      its own training data rather than consuming a fixed dataset. Second, a scoring and reward
      layer: the system observes the outcomes of its actions, evaluates them against reward signals,
      and updates its internal state. Third, a training-inference loop: the system continuously
      refines its parameters based on scored experience in what NVIDIA describes as "tight loops"
      that place exceptional demands on interconnect, memory bandwidth, and serving infrastructure.
      David Silver has described the intended scope of the system as learning "from elementary
      motor skills through to profound intellectual breakthroughs," and as a "scientific
      breakthrough of comparable magnitude to Darwin."

      The platform is not a product in any commercial sense. There is no pricing, no customer, no
      deployment, and no documented capability outside the published descriptions of the founders'
      prior work at DeepMind. The closest analogy is an early-stage research compute programme:
      a set of infrastructure investments, hiring plans, and algorithm development sprints aimed
      at eventually producing a trained system of scientific significance. The product module
      table (TE001) maps the functional components of the research platform against their current
      maturity, intended users, differentiating factors, and diligence gaps.
