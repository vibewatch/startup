  - id: deployment-roadmap
    title: Deployment Status and Roadmap
    body: |
      Ineffable has no deployed product, API, or publicly accessible system as of 22 June 2026.
      The company is in pure research and infrastructure build-out phase. No release timeline,
      product roadmap, capability target, or training schedule has been publicly disclosed.
      The only evidence of forward planning comes from the infrastructure partnerships: the
      NVIDIA collaboration is described as exploring "the next generation of hardware and software
      that will be required as the AI world shifts beyond human data toward models that learn
      through simulation and experience"; the Google Cloud partnership describes deploying "one of
      the largest clusters of A5X" as a forward-looking infrastructure commitment rather than a
      current capability.

      Silver's public communications describe a multi-year research window: "a window of time and
      opportunity where ambitious research can thrive." This is consistent with $1.1 billion of
      seed capital designed to fund a research phase rather than a go-to-market sprint. The
      Sovereign AI co-investment explicitly frames the investment as supporting a "category-
      defining company" over the "long term," not a near-term product cycle. No capability
      milestones (e.g., first trained RL agent, first scientific discovery, first benchmark
      result) have been announced, committed to, or leaked.

      The roadmap table (TE005) maps the publicly observable stages of Ineffable's development
      programme. The entries are inferred from infrastructure partnership timelines, NVIDIA
      hardware availability, and the company's self-described research horizon; none are
      company-disclosed target dates. Significant uncertainty attaches to every stage beyond
      infrastructure build-out.
