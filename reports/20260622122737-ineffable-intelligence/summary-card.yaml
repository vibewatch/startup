  topStrengths:
    - >-
      David Silver is one of the few researchers globally with repeated proof that reinforcement learning can produce
      frontier breakthroughs, giving the company unusually strong founder-market fit.
    - >-
      The seed syndicate and infrastructure stack are elite by any standard: Sequoia, Lightspeed, NVIDIA, Google Cloud,
      and UK sovereign capital provide both endorsement and access to compute.
    - >-
      Ineffable occupies a differentiated strategic position in Europe as a UK-based frontier lab pursuing experiential
      reinforcement learning rather than another text-first LLM roadmap.
  topRisks:
    - >-
      The company has no disclosed revenue, customers, burn rate, headcount, financial statements, or commercial
      roadmap, making conventional underwriting impossible.
    - >-
      The technical thesis depends on reinforcement learning scaling beyond constrained environments into open-ended
      discovery, a premise that public evidence does not yet validate.
    - >-
      Core dependencies on David Silver, NVIDIA hardware roadmaps, Google Cloud infrastructure, and future financing
      rounds create compounded concentration risk.
    - >-
      UK public-sector investors appear to have limited governance leverage relative to US lead investors, raising
      unresolved sovereignty, IP-control, and public-benefit questions.
  unresolvedGaps:
    - >-
      Current burn rate, budgeted compute spend, runway assumptions, and financing plan through first technical
      milestone are undisclosed.
    - >-
      No public evidence defines the company’s milestone framework, benchmark design, safety governance process, or
      external evaluation regime.
    - >-
      No paying customers, pilots, contracts, or pricing surfaces are disclosed, so demand proof and monetization timing
      remain speculative.
    - >-
      Full cap table, liquidation preferences, pro-rata rights, board-control terms, and public-investor governance
      protections are not public.
