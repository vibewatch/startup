summary:
  headline: >-
    Ineffable Intelligence combines one of the strongest founder-led frontier AI theses in Europe with one of the least
    underwritable public valuation setups: $5.1 billion at seed, zero revenue, zero customers, and unresolved technical
    and governance risks.
