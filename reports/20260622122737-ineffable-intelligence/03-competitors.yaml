callouts:
  - calloutType: risk
    title: Compute Access Is a Structural Ceiling, Not Just a Bottleneck
    body: >
      Ineffable's Google Cloud partnership provides frontier compute access — but on a different
      footing from hyperscaler-backed competitors. Google DeepMind has unconditional access to
      Alphabet TPU infrastructure; OpenAI has contractually committed Azure capacity; Amazon's
      Anthropic investment includes AWS compute credits. Ineffable's cluster is procured via
      a commercial preferred-provider agreement subject to standard cloud terms, export-control
      exposure, and Google Cloud's strategic priorities. If a future export-control event disrupts
      NVIDIA Vera Rubin hardware supply — as occurred with H20 chips in FY2026 — Ineffable's
      training timeline could be materially delayed while Google DeepMind continues uninterrupted.
    claimRefs:
      - CP034
      - CP036

  - calloutType: insight
    title: Paradigm Distinctiveness Is Real — but Validation-Dependent
    body: >
      The framing that Ineffable is "different" from all five major competitors is factually
      accurate: no current competitor pursues pure experiential RL without human data at this
      capital scale. However, paradigm distinctiveness is only strategically durable if the
      paradigm produces demonstrable results before incumbents are motivated to replicate it.
      The history of frontier AI suggests that once a paradigm proves commercially viable,
      well-funded incumbents converge within two to three years. Ineffable's research timeline
      is unknown; its safety framework is absent; and its commercial model is undefined. The
      window for paradigm leadership to translate into durable competitive moat is real but
      finite, and the clock starts from the moment any credible research milestone is published.
    claimRefs:
      - CP039
      - CP040
      - CP026

