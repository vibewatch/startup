  - id: capability-and-feature-comparison
    title: Capability and Feature Comparison
    body: |
      Across all five major competitors, the single most important capability dimension is the
      technical paradigm boundary: all five use supervised pre-training on human-generated internet
      data as the foundation of their model architecture, with RL applied as an alignment and
      reasoning enhancement layer. None pursues Ineffable's proposed paradigm of experiential RL
      from scratch without human data. This means Ineffable occupies an empty cell in the
      capability matrix that no incumbent currently fills — a potential blue-ocean position and
      simultaneously a validation-risk position, since the paradigm has not yet been demonstrated
      at scale in the open-world domain.

      On commercial API availability, Ineffable has zero presence: OpenAI publishes per-token
      pricing for six models, Anthropic for three, and Mistral for multiple tiers. Google DeepMind
      offers Gemini through Google Cloud's Vertex AI and AI Studio. xAI offers the Grok API to
      developers. All of these represent commercial maturity points that Ineffable currently lacks
      and will require years of research success to reach.

      On safety frameworks, OpenAI (system cards, usage policy), Anthropic (Constitutional AI,
      RSP, Frontier Red Team), and Google DeepMind (Responsible AI team) all have published,
      auditable safety architectures. Ineffable has none as of the run date. For a UK-based lab
      operating under the AI Seoul Summit commitments, this is a gap that will need to be addressed
      before any deployment.

      On open-weight model availability — increasingly important for sovereign AI buyers who want
      control over model weights — only Mistral provides this as a core product category. OpenAI,
      Anthropic, Google DeepMind, and xAI do not release frontier weights publicly. Ineffable has
      made no announcement on this dimension.

      The feature/capability matrix (FP002) provides a competitor-by-capability view; unsupported
      cells are marked explicitly. The matrix confirms that Ineffable's only near-term competitive
      differentiation is in the experiential RL paradigm itself — all other capability dimensions
      favor incumbents heavily.
