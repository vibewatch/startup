  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础分层——收入前基线
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 6 月 22 日，Ineffable Intelligence 没有商业客户。公司按设计完全处于收入前阶段。它公开的使命是开展前沿 AI
              研究，尤其是构建一个能够从自身经验而非人类数据中发现新知识的「superlearner」系统。公司明确表示，它运营时「不屈从于渐进式产品和短期利润的要求」。目前没有产品、API、定价页、企业级产品或面向客户的服务。


              因此，Ineffable 有意义的客户分层只能是前瞻性的——也就是如果 superlearner 平台实现科学目标，谁可能购买或许可其产出。公开记录和公司叙事中浮现出五类潜在买方。第一，主权 AI 实验室和国家
              AI 项目（例如 UK Sovereign AI Fund 本身）是近期制度契合度最高的细分：承担建设本国 AI 能力使命的政府，可能寻求 superlearner
              发现成果的访问权。第二，超大规模云厂商——Google Cloud、AWS、Microsoft Azure——可能通过许可 superlearner 能力并嵌入自身 AI 服务而成为客户，这与 Google
              Cloud 现有基础设施合作关系一致。第三，制药、材料科学、气候研究和药物开发领域的科研组织，是能够独立发现新科学知识的 AI
              的高价值终端用户。第四，企业研发组织（在技术、工程和金融领域有内部研究任务的大公司）在能力阈值被证明后，构成更广泛商业市场。第五，寻求自主科学发现能力的国防和国家安全机构补足潜在买方图谱。


              除当前投资者 / 合作伙伴关系外，上述细分均没有披露与 Ineffable 的关系。客户分层表（TU001）把五类细分与买方 /
              付款方角色、用例、规模潜力、战略价值和证据缺口逐一对应。客户旅程图（FU001）展示不同细分的概念性采用路径。
