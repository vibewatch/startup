      - number: '5.5'
        title: 差异化与知识产权
        blocks:
          - type: paragraph
            body: >
              Ineffable 的差异化主要来自人力资本，而不是 IP、产品或已部署能力。David Silver 的履历是最清晰的差异点：AlphaGo、AlphaZero、AlphaStar、AlphaFold 和
              AlphaProof 代表了该领域历史上最重要的一组已发表 RL 成果，Silver 在每项成果中都担任领导或核心贡献角色。Wojciech Czarnecki、Lasse Espeholt 和 Junhyuk
              Oh 组成的联合创始团队，被描述为过去十年一直处在 RL 研究前沿；Espeholt 是 IMPALA 分布式 RL 架构的第一作者，该架构直接支撑 Ineffable 正在建设的这类规模化训练基础设施。


              技术赌注是把基于经验的学习作为 LLM 范式的替代路径。Silver 在 Wired 采访中提出，LLM「像某种化石燃料」——是一条捷径，但最终会耗尽，因为它受人类知识边界约束；而从自身经验中学习的 RL
              智能体则是「一种可再生燃料——可以不停地学、一直学、无限地学」。Silver 与 Sutton 合著的「Era of
              Experience」立场论文把这一论点形式化。没有任何具名现有巨头提出过与这一框架竞争的主张；最接近的类似物是 RL 增强型 LLM（OpenAI o-series、DeepSeek-R1），而 Silver
              的立场实际上把它们批评为渐进式改良，而非范式跃迁。


              Ineffable 没有披露专利、商业秘密、专有数据集或授权技术。公司名下没有发表论文、没有模型权重，也没有基准测试结果，无法在创始人履历之外支撑技术差异化主张。产品成熟度图（FE004）把 Ineffable
              当前能力状态映射到 superlearner 栈的相关维度。
