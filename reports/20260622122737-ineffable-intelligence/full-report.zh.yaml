      - number: '3.2'
        title: 前沿实验室竞争者画像
        blocks:
          - type: paragraph
            body: >
              OpenAI 是全球商业化最成熟的前沿 AI 实验室。公司成立时的使命是确保 AGI 造福全人类，如今以 OpenAI Group（公共利益公司）形式运营，由非营利组织 OpenAI Foundation
              治理。2024 年 10 月，OpenAI 完成 66 亿美元融资，投后估值 1570 亿美元——这是截至当时史上最大单笔私营科技融资。OpenAI 的产品组合包括 ChatGPT（据报每周活跃用户超过 2
              亿）、GPT-4o、o1/o3 推理链家族、DALL-E、Sora 和 OpenAI API，并公布了基于 token 的定价。OpenAI 的 RL
              投入集中在基于人类反馈的强化学习（RLHF）和思维链过程奖励模型（o1/o3 家族展示了这一点）——该范式仍依赖人类生成训练数据，与 Ineffable 的无数据方法在结构上不同。Microsoft 合作（130
              亿美元投资、Azure 集成）给了 OpenAI 企业分发和计算能力，Ineffable 无法复制。


              Anthropic 由 Dario Amodei、Daniela Amodei 及离开 OpenAI 的同事于 2021 年创立。其企业使命明确绑定 AI 安全：公司公开承认自己可能正在「building one
              of the most transformative and potentially dangerous technologies in history」，并坚持安全导向实验室必须站在前沿的论点。截至 2025
              年 1 月，Anthropic 据报正在以约 600 亿美元估值融资。Amazon 已承诺最高投资 40 亿美元。其产品组合包括 Claude 3 家族（Haiku、Sonnet、Opus）、Claude.ai
              和公布价格的 API。Constitutional AI 框架和 Responsible Scaling Policy 构成了行业内最系统化的公开安全机制。Anthropic 的技术范式以 LLM 为先，并用
              RLHF 增强对齐——并非没有人类数据的经验式 RL。


              Google DeepMind 是 Alphabet Inc. 旗下整合后的 AI 组织，由 Google Brain 和 DeepMind 于 2023 年合并而来——David Silver
              在这里工作了二十年。按其自身描述，它拥有「unparalleled computing infrastructure」，可访问 Google TPU pods，规模不是独立初创公司所能匹敌；研究组合覆盖
              Gemini、AlphaFold、AlphaProof、机器人和 AGI 对齐。Google Search、Android 和 Google Cloud Platform
              带来的全球分发，使其消费者和企业触达远超任何独立实验室。作为 Silver 领导下产出 AlphaGo、AlphaZero 和 AlphaProof 的机构，它拥有该领域最深厚的公开 RL 记录。


              xAI 由 Elon Musk 于 2023 年创立，并于 2025 年 3 月以约 800 亿美元估值融资 60 亿美元。其 Grok 聊天机器人嵌入 X（原 Twitter）平台（约 5
              亿注册用户），形成独特的消费者分发渠道。xAI 的 Colossus GPU 集群（据报约 100,000 块 H100 GPU）和「truth-seeking」AI 定位，使其区别于安全对齐型实验室。xAI
              尚未发布可与 OpenAI system cards 或 Anthropic RSP 相比的正式安全框架。


              Mistral AI 于 2023 年在法国创立，创始人来自 Google DeepMind 和 Meta Fundamental AI Research；公司在 2024 年 6 月以约 60 亿美元估值融资约
              6.4 亿美元。其产品组合包括 Mistral Large/Small API 模型、开源权重发布（Mistral 7B、Mixtral 8x7B）和 Le Chat（面向企业和消费者的 AI
              助手，支持本地部署和主权云部署选项）。按估值和产品广度计算，Mistral 是欧洲领先的前沿实验室；其对欧盟监管的适配，使其成为 Ineffable 面向欧盟和英国主权 AI 买方的主要相邻竞争者。
