      - number: '5.3'
        title: 基础设施——NVIDIA 与 Google Cloud 依赖
        blocks:
          - type: paragraph
            body: >
              Ineffable 的算力基础设施建立在双合作伙伴模式上。NVIDIA 提供硬件平台；Google Cloud 提供云部署环境。2026 年 5 月宣布的 NVIDIA
              合作是一项工程级协作，目标是「联合设计大规模强化学习基础设施」。工作从 NVIDIA Grace Blackwell 开始，并且「首批探索即将推出的 NVIDIA Vera Rubin 平台」。Vera
              Rubin NVL72 机架整合 72 个 Rubin GPU 和 36 个 Vera CPU，通过 NVLink 6 连接，并包含一个专用 CPU 机架，配备 256 个为 RL 环境模拟专门设计的 Vera
              CPU——这一硬件能力与 Ineffable 的经验生成层直接相关。Vera Rubin 平台每瓦推理吞吐量最高可达 Blackwell 的 10 倍，并能用四分之一 GPU 数量训练大型模型。


              2026 年 6 月，Google Cloud 在「对基础设施市场进行严格评估」后被选为首选云合作伙伴。根据合作安排，Ineffable 将在 Google Cloud 上部署「最大 A5X 集群之一」，由
              Vera Rubin NVL72 驱动。Google Cloud 的「AI Hypercomputer」架构——结合 Jupiter networking、性能工程化 GPU 和优化存储——被 David
              Silver 称为胜过标准「一箱芯片」方案的决定性因素：「训练前沿模型需要的不只是原始算力；它需要复杂的硬件和软件编排。」合作还覆盖 Google Cloud 的网络结构（Jupiter
              networking）和存储系统，使训练与推理负载能够紧密耦合。


              这些基础设施依赖带来实质性集中风险。Ineffable 的整个算力项目依赖 NVIDIA Vera Rubin 的生产爬坡（已确认在 GTC 2026「全面投产」）、NVIDIA
              的软件栈（CUDA、NVLink），以及 Google Cloud AI Hypercomputer
              的规模化可用性和定价。两项合作的条款——定价、算力额度、排他性和服务水平协议——均未公开披露。关键依赖图（FE003）映射完整依赖链。产品架构图（FE001）展示分层技术栈。
