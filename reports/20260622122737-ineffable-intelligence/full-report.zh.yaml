      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >
              David Silver 是 Ineffable Intelligence 的 CEO 和创始人。他曾任 Google DeepMind 强化学习副总裁，在创立 Ineffable 之前在 DeepMind
              工作约二十年。他是 University College London（UCL）计算机科学教授，被广泛视为过去十年最有影响力的 AI 研究者之一。他在 DeepMind
              参与的项目包括作为主要架构师或核心贡献者推动 AlphaGo、AlphaZero、AlphaStar、AlphaFold 和 AlphaProof——这些项目代表了强化学习和博弈求解 AI
              史上最突出的展示。AlphaGo 在 2016 年 3 月以 4:1 击败 18 次世界围棋冠军李世石，比赛观看人数超过 2 亿。Silver 于 2026 年 1 月 16 日被任命为该法律实体董事。对于一家以
              RL 为中心追求超级智能的实验室，他的创始人—市场匹配度极强：他在 Ineffable 所追逐的同一领域已有二十年经同行评议的发表成果。


              Sesamers（引用 tech.eu）报道称，另有三名创始团队成员同样来自 DeepMind：Wojciech Czarnecki、Lasse Espeholt 和 Junhyuk
              Oh——均被描述为过去十年一直处在强化学习研究前沿。这些人没有出现在 Companies House 的董事记录中，但 Sesamers 的说法与 Silver 本人关于 Ineffable
              团队将由「只为这一使命而来的杰出个人」组成的表述一致。在官方披露前，这一信息应视为二级来源报道，置信度中等。


              种子轮完成时，治理结构迅速成型。Sequoia Capital 合伙人 Alfred Lin——地址列为 2800 Sand Hill Road, Menlo Park——于 2026 年 4 月 17
              日获任董事。Ravi Mhatre 的地址列为 2200 Sand Hill Road, Menlo Park（Lightspeed 地址），同样于 2026 年 4 月 17 日获任董事。George
              Samuel Rose 是居住在加拿大的加拿大国民，也在 Companies House 记录中列为董事。Oakwood Corporate Secretary Limited
              在公司注册时获任公司秘书。Sequoia 和 Lightspeed 合伙人在种子轮首日即进入董事会，符合共同领投方获得董事会席位的安排。关键人物依赖高度集中于
              Silver；他主导科学愿景、外部叙事、资本形成故事和战略合作公告。若二级来源所称的创始团队得到确认，将降低但无法消除这种集中度。
