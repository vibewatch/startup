      - number: '8.5'
        title: 建议、信心与风险评级
        blocks:
          - type: paragraph
            body: >
              对 Ineffable Intelligence
              的建议是有条件的监测性兴趣——持观察仓位，而不是承诺出手。这不是温和对冲。证据清楚显示，正面因素极其突出（创始人质量、范式、资本、基础设施），但负面因素在现阶段对高确信仓位构成结构性否决：零收入、零客户、无烧钱速度、无商业路线图、无安全治理，且公共共同投资人没有
              IP 锁定。下一轮若要领投，投资人必须押注至少两个相互独立的不确定事件按顺序兑现：技术前提被证明成立，商业赌注在可融资时间表内跟上。


              对任何确定性估值判断的信心都低。公开信息中没有提交的财务报表、没有独立审计账目、没有披露资金用途，也没有商业证明。投资人承销的叙事风险不亚于业务风险。Sequoia 的「Act
              Two」分析明确警告，近期没有产品—市场匹配的 AI 实验室，会在算力成本膨胀和投资人耐心消退时面临融资风险——这一动态直接适用于 Ineffable 的轨迹。


              整体风险评级为极高。主要风险维度——David Silver 的关键人集中、范式级 RL 扩展不确定性、对 NVIDIA 和 Google Cloud
              的单一来源算力依赖、安全或对齐治理框架缺位，以及完全财务不透明——现阶段都无法单独管理。它们会相互叠加。任一风险触发，投资论点都会迅速恶化。


              估值立场偏紧，但符合先例。$5.1 billion 种子轮价格在欧洲风险投资史上前所未有，并按美国前沿 AI
              实验室惯例定价；而这些惯例通常要求真实收入和已部署产品。没有收入时，价格完全依赖叙事和背书信号价值。这个信号确实非同寻常——但叙事风险真实存在，市场对收入前 AI 实验室的重估可能迅速且严厉。


              即便在牛市情景下，合适投资周期也是 7–15 年。采用标准基金生命周期的投资人与 Ineffable 的商业化周期存在结构错配。长期资本工具——延续基金、主权财富结构、家族办公室——比传统十年期 VC
              结构更适合这个时间跨度。目前没有可见或披露的近期退出路径（IPO、M&A、二级交易）。表 TV001 以结构化形式总结建议。

              图 FV001 追踪建议逻辑链。图 FV004 给出可供 IC 使用的关键投资维度评分。
