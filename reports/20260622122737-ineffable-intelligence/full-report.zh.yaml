      - number: '8.6'
        title: 论点破裂触发器与最终尽调要求
        blocks:
          - type: paragraph
            body: >
              六类论点破裂事件会在任何计划内监测复盘节点之前，把建议从观察转为退出审查或减记。最紧迫的是 David Silver 在没有披露且可信继任者的情况下离开 CEO 职位。整个论点就是
              Silver：若他离开——且没有具名、声望相当的继任者——所有情景概率都必须立即重估。第二类是同行评审论文或可信技术发布确认 RL 扩展进入平台期，而 Ineffable
              没有反证。这会击穿范式前提，把熊市情景从低概率推成基准情景。第三类是 NVIDIA Vera Rubin 硬件配额实质减少或撤回，或 Google Cloud 合作终止——任一事件都会让研究时间表延后数年。


              第四类论点破裂是 Series A 估值低于或不高于 $5.1 billion
              种子轮投后估值。持平或下行轮说明市场已下调能力主张评级，里程碑证据不足以支撑估值上调，且跟融资风险升高。第五类是安全治理失败——监管调查、对齐事故，或归因于 Ineffable
              系统的对抗测试失败——它会同时固化监管、声誉和共同投资人风险。第六类是英国政府澄清，其主权投资并不相对外资投资人享有 IP 权利、治理权或发现成果优先访问权。


              监测这些触发器需要：持续观察 David Silver 的公开露面和 Ineffable 公告；按季度复盘 ArXiv 与同行评审场所的 RL 扩展文献；监测 NVIDIA 和 Google Cloud
              合作新闻；追踪任何监管问询或安全事故归因。表 TV005 定义每个触发器的阈值、传导路径和行动含义。


              最终数据室要求，是把观察转为未来轮次任何仓位的有条件承销所需最低证据。它们覆盖五个阻断性证据缺口：$1.1 billion 种子资金对应的烧钱速度和
              runway；经董事会批准的具体技术里程碑定义；完整股权结构和优先权结构，包括清算优先权与反稀释；内部安全治理和对齐框架文件；以及英国主权共同投资人持有的 IP 权利精确范围。这些问题没有一个能靠公开来源解决。表
              TV006 按负责人、路径和优先级列出各项要求。没有数据室访问，现阶段对 Ineffable 建立任何高确信仓位都只能靠信号。
