      - number: '3.6'
        title: 展示项
        blocks:
          - type: callout
            title: 计算获取是结构性天花板，不只是瓶颈
            body: >
              Ineffable 的 Google Cloud 合作提供了前沿计算获取——但基础不同于由超大规模厂商支持的竞争者。Google DeepMind 对 Alphabet TPU
              基础设施拥有无条件访问；OpenAI 拥有合同承诺的 Azure 容量；Amazon 对 Anthropic 的投资包含 AWS 计算额度。Ineffable
              的集群通过商业首选供应商协议采购，受标准云条款、出口管制敞口和 Google Cloud 战略优先级约束。若未来出口管制事件扰乱 NVIDIA Vera Rubin 硬件供应——就像 FY2026 发生在 H20
              芯片上的情况——Ineffable 的训练时间线可能实质性延后，而 Google DeepMind 仍能不受影响地继续推进。
            calloutType: risk
            claimRefs:
              - CP034
              - CP036
          - type: callout
            title: 范式独特性真实存在——但取决于验证
            body: >
              把 Ineffable 定位为与五大主要竞争对手「不同」，事实层面成立：现有竞争对手里，没有哪一家在这种资本规模下押注完全不依赖人类数据的纯体验式
              RL。但范式差异只有在现有巨头被迫复制之前产出可验证结果，才可能转化为持久战略优势。前沿 AI 的历史显示，一个范式一旦证明具备商业可行性，资金充足的现有巨头通常会在两到三年内收敛追上。Ineffable
              的研究时间表未知，安全框架缺位，商业模式也未定义。范式领先转化为持久竞争壁垒的窗口确实存在，但窗口有限；任何可信研究里程碑一经发布，倒计时就开始。
            calloutType: insight
            claimRefs:
              - CP039
              - CP040
              - CP026
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现路径
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 6 月 22 日，Ineffable Intelligence
              没有披露收入、客户或产品。公司的公开使命明确排斥近期商业产出：它寻求「一个让宏大研究能够繁荣的窗口，不必屈从于渐进式产品和短期利润的要求」。这是一种有意选择的战略姿态，不是暂时缺口。公司目前是纯研究实体，没有披露任何商业合同、价格表或合作伙伴收入安排。


              在没有确认收入来源的情况下，分析只能从公司的技术定位和可比先例推演未来可能的变现路径。四条路径站得住脚：（a）向企业、政府和研究机构许可已训练模型权重或 RL 能力——前沿 AI
              实验室能力成熟后的主流模式；（b）面向政府（B2G）的主权 AI 合同，英国政府通过 British Business Bank 和 Sovereign AI Fund
              共同投资，构成结构性入口；（c）当能力达到商业可用后，向已部署的 superlearner 提供 API 访问；以及（d）由系统自身产生的科学 IP
              和专利带来的版税或许可费，尤其是在科学、数学和工程领域。上述路径均未被公司确认、披露或给出时间戳。Sequoia 的「Act Two」分析（2023）警告，若 AI
              实验室短期内没有产品市场匹配，算力成本膨胀会带来融资风险，投资者对收入前估值的耐心也有历史上限。


              定价侧没有可分析的定价模型。任何关于 Ineffable 未来收入的模型，都必须假设商业部署时间、目标客户细分（主权、企业、研究机构）以及定价机制（API
              计量访问、权重许可、版税）。这些问题仍未解决，也未披露。收入流表（TI001）列出可能路径、机制及其证据质量。定价表（TI002）记录当前定价认知状态，以及数据室需要补充的材料。收入模式桥图（FI001）展示在最可能的许可场景下，客户互动如何转化为收入和毛利。
