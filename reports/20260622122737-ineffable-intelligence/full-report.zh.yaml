      - number: '5.6'
        title: 信任、安全、合规与质量控制
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 6 月 22 日，Ineffable 没有发布任何安全、对齐或合规披露。没有模型卡、安全评估框架、对齐研究议程、红队协议，也没有等同于 Responsible Scaling Policy
              的文件。没有提交或披露合格评定、AI Act 合规声明或英国监管备案。公司没有公开签署首尔 AI 峰会（2024 年 5 月）达成的 Frontier AI Safety Commitments；截至 2025
              年 2 月，该承诺已吸引包括主要前沿实验室在内的更多签署方。


              缺少安全披露本身并不证明实践不安全——Ineffable 还处在非常早期的研究阶段，尚无可评估的已训练系统。但前沿 AI 实验室的惯例是在大规模训练前发布安全框架，而不是训练之后。Anthropic 的
              Responsible Scaling Policy（现为 3.3 版，2026 年 5 月更新）在每一层级训练推进前，为能力进阶设定阈值和治理关口。OpenAI 已发布 Preparedness
              Framework 文件。UK AI Safety Institute 已发布前沿模型评估标准。Ineffable
              没有对应文件。这个缺口本身就是重大尽调证据：投资者和政策制定者无法评估训练、评估或部署决策将由什么安全治理结构约束。


              英国监管环境相关，但目前较宽松。UK AI Regulation White Paper（2023）采取支持创新、按行业监管的路径，没有专门的前沿 AI 规则。EU AI Act 对具有系统性风险的通用 AI
              模型提供方提出要求；一旦 Ineffable 模型训练达到阈值算力（10^25 FLOPs），很可能适用。Ineffable 注册地在英国（目前不在 EU AI Act 辖区内），但若在欧洲部署，将面临 EU
              Act 义务。公司没有披露合规路径、数据治理政策或隐私框架。信任与合规表（TE004）将所有相关控制项与其当前公开状态对应。
