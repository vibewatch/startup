          - type: callout
            title: 观察仓位——不是买入
            body: >
              卓越创始人质量和前所未有的资本形成，与收入前状态、缺少商业证明、RL
              扩展不确定性和财务不透明结合后，给出的明确建议是在种子轮估值下观察，而不是买入。极强的正面信号不能覆盖高确信领投仓位的结构性否决项。观察仓位需要在重新评估前设置具体里程碑闸门：发布开放式 RL
              里程碑、定义可衡量技术 OKR，以及 Series A 定价验证或否定种子轮隐含的 $5.1B。
            calloutType: recommendation
            claimRefs:
