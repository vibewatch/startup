              这一阶段公司的留存问题，应改用结构性持久性代理指标回答：研究合作模式的粘性、Sovereign AI Fund 承诺的持久性，以及 Ineffable 对 Google Cloud
              多年基础设施承诺所暗含的锁定。Google Cloud 基础设施合作和 NVIDIA 联合设计关系，都暗示研究项目具备中期运营连续性，但这些不是客户留存指标——它们是供给侧承诺。


              人才市场提供了一个间接持久性信号：招聘信息确认 Ineffable 仍在招聘高级研究员和工程师。公司能从 Google DeepMind
              和其他前沿实验室吸引研究员，是研究项目在技术社区内仍具可信度的代理指标。但在商业产品出现前，没有客户满意度调查、Net Promoter Score、评论平台条目或任何用户层反馈可用，也不应期待其出现。


