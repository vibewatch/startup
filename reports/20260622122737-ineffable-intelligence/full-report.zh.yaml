      - - 人才集中：前 DeepMind RL 专家团队，拥有十年前沿 RL 研究积累
        - 在位者用留任包抢夺人才；DeepMind、xAI 和 OpenAI 都在从同一 RL 人才池积极招聘
        - 中等
        - 前沿 AI 研究招聘竞争极其激烈；DeepMind、OpenAI 和 Anthropic 各自拥有数百名 ML 研究员。Ineffable 的次级创始团队公开确认有限。
