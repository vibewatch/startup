    sections:
      - number: '1.1'
        title: 身份、产品与运营版图
        blocks:
          - type: paragraph
            body: >
              Ineffable Intelligence Ltd（公司编号 16865241）于 2025 年 11 月 19 日在英格兰和威尔士注册为私人有限公司。其注册地址为 3rd Floor, 1 Ashley
              Road, Altrincham, Cheshire, WA14 2DT——这是英国新注册科技公司常见的专业服务地址；运营总部在伦敦，所有投资方、政府和新闻材料都一致引用这一地点。SIC 代码为
              74909（其他未另分类的专业、科学及技术活动），符合公司尚未产生收入的研究状态。官方网站为 https://www.ineffable.ai/。


              公司宣称的使命是通过创造所谓「超级学习者」来「与超级智能进行第一次接触」：一种能够从自身经验中发现全部知识的 AI
              系统，从基础运动技能一直到深刻的智力突破。核心技术押注在于，超级智能将靠经验式学习实现，而不是靠学习人类数据，并由全球最强大的强化学习（RL）算法驱动。不同于在互联网规模语料上训练的大语言模型，Ineffable
              的系统将实时生成并评估自身经验，对计算基础设施的互联、内存带宽以及训练—推理紧耦合循环提出极高要求。公司自注册后一直隐身运营，并在 2026 年 4 月 27 日宣布种子轮融资时同步公开亮相。


              截至本次报告日期，Ineffable
              没有披露产品、收入或客户基础；公司处在纯研究和基础设施阶段，这与其融资结构和网站使命表述一致。公司自称计划创造一段时间窗口，让「雄心勃勃的研究能够蓬勃发展，而不必屈从于渐进式产品和短期利润的要求」——这是对标准
              VC 支持产品路线图的有意偏离。所有公开证据都把它指向一家前沿 AI 研究实验室；短期产出预期是科学突破，而非商业产品。
