  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              Ineffable Intelligence 位于三个重叠竞争类别的交汇处。第一，它是与 OpenAI、Anthropic、Google DeepMind、xAI 等共享 AGI 使命的前沿 AI
              实验室的直接范式竞争者——这些机构都在朝越来越自主、越来越强大的 AI 系统推进，只是技术架构不同。第二，它是超大规模厂商内部研究团队的替代项：尤其是 Google DeepMind，它是 Ineffable
              创始人的制度来源，并继续在 Alphabet 的计算和分发基础设施内运营全球最深厚的强化学习项目。第三，它的英国 / 欧盟主权 AI 定位，使其成为 Mistral AI 的相邻竞争者；后者按估值（2024 年约
              60 亿美元）和已部署产品组合计算，均是欧洲领先的前沿实验室。


              一个潜在直接竞争者的独立类别——据行业评论者报道，包括 AMI Labs 和 Recursive Superintelligence——被称为正在追逐相关 AGI
              或自我改进系统范式。截至本次报告日期，这两个实体都缺少足够公开披露（官方网站、融资公告或发表研究），无法做有意义画像；它们的存在既代表该范式可信度的先例，也代表证据缺口。


              现状和内部自建替代方案与具名竞争者同样重要：未来可能部署超级学习者级系统的大型企业或政府，可以选择内部构建（通过超大规模厂商 API 访问前沿模型）、向 OpenAI 或 Anthropic
              采购，或继续使用当下基于 LLM 的工具——这些都构成 Ineffable 必须从需求端替代的选项。


              竞争定位图（FP001）把主要竞争者放在两个轴上：商业部署成熟度，以及强化学习 / 经验式学习聚焦度。Ineffable 在 RL 聚焦度上最高，在部署成熟度上最低——与 OpenAI
              构成战略镜像。作为研究实验室，这一象限位置有防御性；但若 incumbent 加大 RL 投入，同时继续握有分发优势，它在结构上会变得脆弱。
