      - number: '6.5'
        title: 扩张路径与集中风险分析
        blocks:
          - type: paragraph
            body: >
              Ineffable Intelligence
              走向商业客户，需要穿过几个不同阶段，每个阶段都依赖前一阶段成功。第一阶段——研究项目执行——必须证明可信的技术突破，商业接触才可能发生。第二阶段需要把突破转化为可部署能力或研究访问产品。第三阶段需要识别并签下首批客户合同；对前沿
              AI 研究产出而言，这通常是长周期企业或政府采购。只有在初始客户基础形成后，先落地再扩张的动态才会启动。


              在客户前阶段，集中风险极端。公司的整个基础设施依赖集中在单一云提供商（Google Cloud）和单一硬件合作伙伴（NVIDIA）。任何商业、技术或政治层面的关系扰动，都会实质威胁研究项目。公共部门侧，英国政府
              $20 million 股权相对 $1.1 billion 总融资太小，基本无法对 Ineffable 方向形成结构性杠杆；newspage.news 引述的 AI 治理专家称，这只带来「约百分之一影响力」。


              可能买方细分的采购摩擦很高。主权 AI 实验室和国家 AI 项目按年度预算周期运行，采购时间线跨多年。制药和材料科学科研组织有复杂的 IP 所有权要求，任何 AI 生成发现用于商业之前都必须先谈妥。企业 R&D
              买方在承诺前需要概念验证里程碑和供应商验证。扩张与集中风险表（TU005）按严重程度评估和尽调路径映射这些风险。
