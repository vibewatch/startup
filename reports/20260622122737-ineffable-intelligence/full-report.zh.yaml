      - number: '3.4'
        title: 分发、计算与结构性力量
        blocks:
          - type: paragraph
            body: >
              前沿 AI 中最持久的竞争优势不是模型质量或研究新意，而是分发能力、计算获取和人才密度。在这三个维度上，相比成熟玩家，Ineffable 都面临严重结构性劣势。


              分发能力：ChatGPT 每周活跃用户超过 2 亿（OpenAI）、Claude.ai（Anthropic）、集成进 Google Search 和 Android 的 Gemini（Google
              DeepMind）、嵌入 X 的 5 亿注册用户基础的 Grok（xAI），这些消费者和企业分发护城河耗费多年和数十亿美元才建成。Ineffable 分发为零——没有产品、没有 API、没有用户。即便
              Ineffable 产出突破性超级学习者系统，也需要从零建设分发，而 incumbent 已经握有全球企业和消费者 AI 买方的注意力和 API 关系。


              计算获取：Google DeepMind 在 Alphabet 的 TPU Pod 基础设施内运行，规模不是外部实体能够复制；Microsoft Azure 为 OpenAI
              的训练运行提供合同承诺计算；Amazon 对 Anthropic 的投资包含 AWS 计算额度。Ineffable 的 Google Cloud
              合作意义重大，但并不提供与超大规模厂商支持实验室相同水平的承诺分配、多十年组织关系或冗余计算基础设施。xAI 的 Colossus 集群（约 100,000 块 H100）在原始 GPU 数量上超过
              Ineffable 当前披露的集群（通过 Google Cloud 使用 NVIDIA Vera Rubin NVL72 驱动的 A5X）。


              超大规模厂商合作：五家具名竞争者均至少拥有一个主要超大规模厂商合作（OpenAI/Microsoft、Anthropic/Amazon+Google、Google DeepMind/Google
              内生、Mistral/Azure+Google）。Ineffable 拥有 Google Cloud 首选供应商和 NVIDIA 工程共同设计伙伴关系——有意义，但范围窄于部分竞争者享有的多超大规模厂商接入。


              人才：仅 Google DeepMind 就在全球雇用数百名 RL 研究者。OpenAI 和 Anthropic 各自拥有规模相当的研究组织。Ineffable 公开确认的研究团队包括 David Silver
              和另外三名 ex-DeepMind 创始人（Wojciech Czarnecki、Lasse Espeholt、Junhyuk
              Oh）——个人都很出色，但四人团队面对拥有数百乃至数千名研究者的组织，是资本无法迅速补齐的人才密度缺口。
            claimRefs:
              - CP030
              - CP031
              - CP034
              - CP036
              - CP015
              - CP019
      - number: '3.5'
        title: 护城河持久性、商品化与替代风险
        blocks:
          - type: paragraph
            body: >
              Ineffable 的主要护城河主张是范式领导力：现存唯一一个以可信资本规模阐明并融资推进纯经验式 RL 超级学习者愿景的团队，由全球被引用最多的活跃 RL
              研究者领导。今天这是真实差异化。护城河能否持久取决于两个因素：（i）资金充足的 incumbent 多久会追上这一范式；（ii）在复制发生之前，该范式能否产出可商业化部署的结果。


              快速跟随风险很高。Google DeepMind 可以在内部重组一个不依赖人类数据的经验式 RL 研究计划：它保留同一套公开 RL 研究语料，仍有 David Silver 过去的团队成员在职，并拥有远超
              Ineffable 的计算获取。如果超级学习者范式被证明可行，对 DeepMind 而言，将资源重新导向这一方向的增量努力远低于任何其他实体。AI 历史支撑这一担忧：一旦商业机会得到验证，OpenAI
              就从通用语言建模转向基于 RL 的推理（o1 家族）；DeepMind 本身也以极快速度和巨大影响从游戏 RL 转向蛋白质折叠（AlphaFold）。


              OpenAI 在 2025 年转为公共利益公司，削弱了此前将非营利锚定实验室与商业机构区分开来的治理差异。随着 OpenAI 如今商业化运营、Anthropic 获得 Amazon 深度资助，Ineffable
              所讲的「纯研究」定位已成为更拥挤的叙事——尽管 Ineffable 对反对短期产品的承诺比任何竞争者都更绝对。


              Newspage.news 及其引用评论者提出的负面证据引发担忧：Ineffable 的英国政府少数股权并不能阻止
              IP、人才或突破性发现流向控制董事会的美国总部投资者——这是一个治理缺口，不仅影响主权主张，也影响公司在主要投资者推动商业化时维持独立战略方向的能力。


              商品化风险真实存在，但属于中期：驱动 DeepMind 历史突破的核心 RL 算法已经发表且公开可得。如果 Ineffable
              的超级学习者路径纯粹依赖算法（而非依赖专有数据护城河或硬件整合），复制只需要足够的计算和人才——这两样 incumbent 都非常充足。


              护城河持久性和竞争风险登记表（TP004）以及竞争就绪 KPI 仪表盘（FP003）以结构化形式总结了六项护城河主张及其主要威胁。
