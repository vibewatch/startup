        - 在主合作伙伴之外，同时宣布多云或本地部署的主权算力安排
      - - 主权 / 政策顺风
        - UK Sovereign AI Fund + British Business Bank 共同投资；国务大臣亲自背书；AI 政策采用「促创新」框架
