      - number: '3.3'
        title: 能力与功能对比
        blocks:
          - type: paragraph
            body: >
              在五家主要竞争者中，最重要的单一能力维度是技术范式边界：五家均以人类生成互联网数据上的监督预训练作为模型架构基础，并把 RL 作为对齐和推理增强层。没有一家追逐 Ineffable
              所提出的、从零开始且不使用人类数据的经验式 RL 范式。这意味着 Ineffable 占据了能力矩阵中目前没有 incumbent
              填补的空白格——这既可能是蓝海位置，也同时是验证风险位置，因为该范式尚未在开放世界领域完成规模化验证。


              在商业 API 可用性上，Ineffable 为零：OpenAI 公布了六个模型的按 token 定价，Anthropic 公布了三个模型，Mistral 公布了多个层级。Google DeepMind 通过
              Google Cloud 的 Vertex AI 和 AI Studio 提供 Gemini。xAI 向开发者提供 Grok API。这些都代表 Ineffable
              当前不具备的商业成熟度；要达到这一水平，需要多年研究成功。


              在安全框架上，OpenAI（system cards、使用政策）、Anthropic（Constitutional AI、RSP、Frontier Red Team）和 Google
              DeepMind（Responsible AI team）均有公开、可审计的安全架构。截至本次报告日期，Ineffable 没有任何公开框架。作为一家在 AI Seoul Summit
              承诺下运营的英国实验室，这一缺口在任何部署前都需要补上。


              在开放权重模型可用性上——这对希望控制模型权重的主权 AI 买方越来越重要——只有 Mistral 将其作为核心产品类别。OpenAI、Anthropic、Google DeepMind 和 xAI
              都不公开发布前沿权重。Ineffable 在这一维度上没有任何公告。


              功能 / 能力矩阵（FP002）提供按竞争者和能力划分的视图；不支持的单元格明确标记。矩阵确认，Ineffable 唯一的近期竞争差异化在于经验式 RL 范式本身——所有其他能力维度都明显有利于
              incumbent。
