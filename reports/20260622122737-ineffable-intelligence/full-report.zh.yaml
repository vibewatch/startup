      - number: '8.3'
        title: 可比公司组
        blocks:
          - type: paragraph
            body: >
              标准估值方法——收入倍数、EBITDA 倍数、DCF——不适用于 Ineffable Intelligence，因为公司没有收入、没有披露财务数据，也没有商业时间表。唯一可用的基准框架，是其他前沿 AI
              实验室的可比私募轮次。表 TV004 列出主要可比样本，并注明所有重大限制。


              OpenAI 的 $157 billion 投后估值（2024 年 10 月）代表前沿 AI 实验室定价上限。不过，OpenAI 当时年化收入约 $4 billion——这与 Ineffable
              有关键区别。$157 billion 估值意味着约 39× 收入倍数，按历史科技基准本身也很激进，但至少锚定实际商业牵引力。Ineffable 收入为零，因此 OpenAI
              可比样本只能作为市场环境指标，不能作为直接定价参照。


              Anthropic（约 $60 billion，2025 年 1 月）和 xAI（约 $80 billion，2025 年 3 月）都已从已部署产品产生收入——分别是 Claude 和
              Grok——且都不是在可比的收入前种子阶段融资。Anthropic 的安全优先使命与 Ineffable 的研究取向有结构相似性，但 Anthropic 在大额估值轮之前已部署商业 API 产品。xAI
              是一家营利实体，并拥有已部署消费者产品；其公司页面已确认这一点，这与 Ineffable 的纯研究实验室商业姿态根本不同。


              Mistral AI 2024 年 6 月约 €6 billion（约 $6.4 billion）的估值，是最相关的欧洲前沿 AI 可比样本。不过，Mistral 当时已部署 Le Chat，并通过公开定价页产生
              API 收入，意味着其每美元收入估值低于 Ineffable 隐含倍数。作为拥有公开可见定价结构和产品的欧洲实验室，Mistral 在地域上更接近，但业务阶段不同。


              公开信息中没有任何可比样本是一家种子阶段、零收入、估值超过 $5 billion 的纯研究 AI 实验室。Ineffable
              的价格位于美国前沿实验室建立的层级，而那些实验室已经部署产品。收入前实验室是否配得上这一层级，完全取决于技术赌注能否兑现、商业化能否跟上——今天的公开证据无法做出这个判断。表 TV004
              及配套枚举范围文件记录了这一可比组的限制。
