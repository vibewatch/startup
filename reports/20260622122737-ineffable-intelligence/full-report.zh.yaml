        title: 附录
        blocks:
          - type: callout
            title: 关键人集中是单一最大投资风险
            body: >
              David Silver 离开 CEO 职位——且没有具名、可信、RL 声望相当的继任者——将构成立即的论点破裂事件。Ineffable
              投资论点的每个维度（范式独特性、研究可信度、基础设施伙伴关系、投资人信心）都追溯到 Silver 的个人智力资本。常规软件企业的 CEO 更替是治理事件；在
              Ineffable，这会是生死事件。公司没有具名联合创始人，没有披露继任计划，也没有介绍领导团队。这是整个论点中最容易监测的单一风险，应从第一天起列为持续观察事项。
            calloutType: risk
            claimRefs:
