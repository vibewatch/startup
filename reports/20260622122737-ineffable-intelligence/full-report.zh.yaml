      - number: '1.5'
        title: 负面信号与治理担忧
        blocks:
          - type: paragraph
            body: >
              公开记录中最主要的负面信号不是运营层面，而是结构层面：英国政府以少数股权身份与占主导地位的美国风投共同投资后，AI 行业评论者围绕治理和主权提出了一组担忧。


              Newspage.news（2026 年 4 月 30 日）刊登了两位 AI 顾问的评论。Rohit Parmar-Mistry（Pattrn
              Data）认为，「种子阶段的公共资金不应只换来一篇新闻稿和少数股权」，政府在没有治理权、下游用途透明度或可信保障的情况下参与投资，「有助于为上行风险去风险化，却让私人投资者捕获战略价值」。Katrina
              Young（KYC Digital）将英国政府的参与描述为对可能产生战略重要知识的系统拥有约 1% 的影响力，并警告称，「主权不是通过出现在股权表上实现的——它要靠控制、杠杆和问责来守住。」


              Electronics Weekly（2026 年 4 月 28 日）也观察到，作为投资的一部分，英国政府得到的是一个伦敦地址、一小笔股权和下一轮优先购买权——但没有结构性保证，能确保 Ineffable
              的发现、IP 或商业价值留在英国。


              截至本次报告日期，保留证据中未发现诉讼、监管调查、领导层争议、制裁或产品召回。公司成立不到八个月，限制了负面事件的暴露面。治理担忧对长期公共利益和英国 AI
              主权叙事具有实质意义，但目前并不构成公司的运营或法律风险。尽调应核实公共共同投资者实际持有哪些治理权；Sovereign AI Fund 将其投资条款描述为商业敏感。
