      - number: '5.7'
        title: 技术风险
        blocks:
          - type: paragraph
            body: >
              四类结构性技术风险已经存在且重要。第一，算力集中：整个研究项目依赖 NVIDIA Vera Rubin NVL72 的按时规模化交付，以及 Google Cloud AI Hypercomputer
              的可用性。NVIDIA 已确认 Vera Rubin 截至 GTC 2026「全面投产」，但供应约束、超大规模云厂商（Amazon、Microsoft、Google
              自身负载）之间的优先分配，以及软件成熟度仍未知。如果 NVIDIA Vera Rubin 爬坡慢于预期或供应被转移，Ineffable 的基础设施时间线会直接受威胁。Ineffable
              获得优先或保证供应的条款没有披露。


              第二，模拟到现实的落差：完全在模拟环境中训练的 RL 系统一旦应用到分布外环境，就有有据可查的失败模式。Ineffable
              用于生成经验的模拟环境质量和多样性未知。目标能力越抽象、越多样（例如科学发现、数学证明），就越难指定奖励函数和环境，使系统产生有用的泛化，而不是奖励黑客或狭窄解法。Ineffable
              没有披露任何模拟环境设计、奖励模型架构或领域覆盖策略。


              第三，泛化未被证明：Ineffable 在 DeepMind
              的前身成果（AlphaGo、AlphaZero、AlphaProof）在边界清晰、完全可观测、奖励信号明确的组合领域取得了超人表现。把这种方法泛化到开放式现实世界知识发现——奖励信号模糊、环境部分可观测、领域无边界——是难度质变的研究挑战。任何公开披露中都没有证据证明这一鸿沟已经跨越。


              第四，关键人物与团队扩张风险：使命与 David Silver 的研究愿景直接绑定。科学项目依赖留住 Silver 和创始团队，也依赖在竞争激烈的人才市场中招聘更多前沿 RL 研究员。Wired
              采访描述团队正在从「只献身于这一使命的杰出个体」中组建，暗示人才画像窄而深。创始团队任何波动，都可能实质影响科学项目和投资者信心。
            claimRefs:
              - CE006
              - CE007
              - CE026
              - CE027
              - CE028
              - CE029
              - CE039
