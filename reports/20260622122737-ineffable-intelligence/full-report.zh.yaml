      - number: '4.4'
        title: 公开财务缺口与单位经济模型
        blocks:
          - type: paragraph
            body: >
              Ineffable Intelligence
              的财务画像几乎完全处于私有状态。作为收入前研究实体，公司没有提交账目、没有披露产品定价，也没有客户指标，标准单位经济模型框架无法按常规方式适用。没有客户获取成本（CAC）、没有客户生命周期价值（LTV）、没有回本周期、没有
              ARR、没有 GMV，也没有单位量。这些缺口不是暂时披露延迟，而是公司刻意保持商业化前状态的结果。


              真正可分析的是商业化启动后，未来单位经济模型的结构性驱动因素。前沿规模 RL 算力的资本强度意味着，一旦开始产生收入，COGS
              将主要由算力成本而非人力劳动主导；结构上更接近超大规模云厂商或云原生软件毛利，而不是服务业务。如果 Ineffable 通过 API
              访问或权重许可变现，服务更多用户的边际成本可能较低（毛利率天花板较高），但摊销后的研究和基础设施成本基数会很重。即使缺少真实数字，单位经济模型桥图（FI002）也从结构上绘制了这一逻辑。市场进入动作完全未定：没有销售团队、没有渠道伙伴、没有披露的上市计划、没有客户引用，也没有销售管线数据。公开财务缺口表（TI005）逐项列出缺失指标及其具体尽调路径。单位经济模型表（TI003）记录每个关键指标已知、估算或不可得的状态，并给出明确信心等级。
