          - type: callout
            title: 单一硬件依赖制造灾难性失效模式
            body: >
              Ineffable 的 superlearner 围绕尚未普遍可用的 NVIDIA Vera Rubin NVL72 硬件共同设计。公司没有披露备用算力安排。一旦 NVIDIA
              生产延误、将产能重新分配给竞争性超大规模云厂商，或发生商业争议，Ineffable 的训练项目没有连续性路径。这与标准软件公司的算力依赖有本质区别：RL
              训练闭环与特定互连和内存带宽特性紧密耦合，而现有其他硬件无法复制这些特性。投资人应在下一轮前要求配额保证或可执行的备用计划。
            calloutType: risk
            claimRefs:
              - CR009
              - CR010
              - CR022
          - type: callout
            title: 关键人集中度按同业标准看也极端
            body: >
              David Silver 是唯一具名创始人、CEO 和科学权威。他没有联合创始人，没有具名科学联合负责人，没有披露继任计划，也没有独立董事会科学委员会。这种集中度超过前沿 AI
              实验室本就偏高的关键人风险：Anthropic 有八位联合创始人；OpenAI 有多名创始研究员。整套论点——全球领先 RL 研究者能够招人、融资并领导一个 superlearner
              项目——都压在一个人身上。Silver 离开不只是制造领导层缺口；它会拿掉整个投资论点的智力锚点。
            calloutType: risk
            claimRefs:
              - CR032
              - CR036
          - type: callout
            title: 负面治理声音可信且具体
            body: >
              Newspage 和 Electronics Weekly 在 2026 年 4–5 月引用的独立专家批评非常具体：英国政府通过 British Business Bank 和 Sovereign AI Fund
              持有少数股权，并没有确保对 superlearner 发现成果的 IP 主权、使用权或商业治理权。这不是泛泛的「治理担忧」——它指出，在一家商业化前 AI 实验室中投入公共资金，却没有董事会层面的权利、没有 IP
              契约、没有公共利益执行机制，只是给公司提供合法性，却没有给公众带来问责。投资人应要求确认政府持股究竟附带哪些治理权（如果有）。
            calloutType: risk
            claimRefs:
