      - number: '2.2'
        title: 市场规模：多重视角与相互矛盾的估算
        blocks:
          - type: paragraph
            body: >
              没有一个已发布数字能干净衡量 Ineffable 正进入的市场。下文使用三个视角，并明确方法，同时保留矛盾。


              视角一——AI 计算基础设施（最直接相关的代理指标）。NVIDIA 数据中心业务——全球领先 AI GPU 供应商的主导收入线——在 FY2026 第一季度（截至 2025 年 4 月 27 日的季度）实现
              391 亿美元收入，同比增长 73%，环比增长 10%。年化后，仅 NVIDIA 数据中心收入就约为每年 1570 亿美元；这本身仍低估总 AI 计算支出，因为它排除了 AMD、Google TPU、AWS
              Trainium 和定制芯片。这是覆盖所有买方层级、同时包含训练和推理计算支出的最宽指标，并不只包括 Ineffable 所瞄准的前沿研究。尽管美国对中国 H20 产品出口管制带来约 80
              亿美元逆风，NVIDIA 仍指引 FY2026 第二季度总收入约为 450 亿美元。


              视角二——投资 / 资本开支流。Goldman Sachs Research 预测，到 2025 年，全球 AI 相关投资将接近 2000 亿美元，美国将在大型企业采用中领先，尤其是信息服务和专业 /
              科学服务领域。Goldman Sachs 同时指出一个重要约束：AI 对生产率的影响可能要到本十年后半段才显现——这会实质性制约企业 ROI，也会影响超大规模厂商之外的可自由支配 AI 支出节奏。


              视角三——前沿 RL 训练计算（最贴近 Ineffable 的目标）。Epoch AI 的研究显示，自 2010 年以来，前沿 AI 模型训练计算量每年增长 4–5 倍；近年发布时算力排名前十的前沿模型约每年增长
              5 倍。训练单个前沿模型如今大约需要 10²⁴–10²⁵ FLOPs 计算量，每次训练成本估计在 5000 万美元到数十亿美元之间。关键是，Epoch AI 还指出 AlphaGo 和 AlphaGo Zero
              等 RL 重型模型是计算离群值——其训练消耗的计算量远高于同时代典型深度学习模型——这意味着纯 RL 超级学习者的训练成本可能高于传统前沿模型的趋势线。


              矛盾估算：新闻稿中引用的广义 AI 市场 TAM，从 Goldman Sachs 约 2000 亿美元投资流，到 Statista 对 2030 年数千亿美元市场的展望不等，但方法不可比（支出 vs. 投资
              vs. 收入 vs. 经济影响）。没有任何一个数字单独隔离经验式 RL 训练这一类别。超级学习者系统的具体 SAM 无法从独立来源获得；本文的规模分析由代理指标构建，应视为高不确定性估算。
