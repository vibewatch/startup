      - number: '5.2'
        title: 架构与运营模式——RL 训练管线
        blocks:
          - type: paragraph
            body: >
              核心运营模式是一条基于经验的强化学习管线：智能体在模拟环境中行动，生成观察和奖励，模型权重在连续循环中更新。这与静态数据集预训练有根本差异。NVIDIA 与 Ineffable
              联合署名博客解释称，「系统必须在紧密循环中持续行动、观察、打分并更新，这会以预训练不会出现的方式，对互联、内存带宽和服务能力施压。」系统还会在「与人类语言截然不同的丰富经验形态」上训练，可能需要「新型模型架构和训练算法」。


              创始团队为这种架构带来深厚技术先例。联合创始团队成员 Lasse Espeholt 是 IMPALA 架构（2018）的第一作者；该架构确立了可扩展分布式深度 RL，并采用重要性加权的 actor-learner
              设计。A3C 框架（Mnih 等，2016）是异步并行 RL 训练的基础，也是 Ineffable 正在扩展方法的直接祖先。DeepMind 团队的 AdA 论文（2023）——《Human-Timescale
              Adaptation in an Open-Ended Task Space》——证明大规模多任务 RL 可以产生通用智能体，并在数百项任务中以人类时间尺度学习并适应。这些先例提供背景，但并不定义
              Ineffable 的系统；公司没有发布任何关于实际 superlearner 的架构描述、模型规格或设计文档。


              运营流程仍处研究阶段：模拟环境生成经验，奖励模型给经验打分，训练更新传递进模型，然后循环在规模上重复。工作流表（TE002）把这一研究工作流与未来预期用例对应。架构表（TE003）把技术栈层级与依赖和风险对应。运营流程图（FE002）展示经验生成、打分和训练如何在研究管线中连接。
