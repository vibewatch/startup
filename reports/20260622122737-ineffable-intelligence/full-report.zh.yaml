      - number: '1.3'
        title: 融资、投资方与资本结构
        blocks:
          - type: paragraph
            body: >
              2026 年 4 月 27 日，Ineffable Intelligence 宣布完成 11 亿美元种子轮，投后估值 51 亿美元——这是欧洲史上最大种子轮，也是全球 AI 史上规模最大的首轮外部融资之一。本轮由
              Sequoia Capital 和 Lightspeed Venture Partners 共同领投。Cooley LLP（伦敦合伙人 Eric Davison）为公司融资提供法律顾问。按 UKTN
              报道所隐含汇率，英镑等值约为 8.14 亿英镑。


              参投方包括 NVIDIA、Google、Index Ventures、DST Global、EQT Ventures、Flying Fish Ventures、Evantic Capital、BOND
              Capital 和英国 Wellcome Trust，另有两家英国公共部门载体：British Business Bank（其自身新闻稿确认投资 2000 万美元 / 1480 万英镑）和 UK
              Sovereign AI Fund（金额「商业敏感」，政府披露显示其典型投资区间为 100 万至 1000 万英镑）。Sovereign AI Fund 和 British Business Bank
              让英国以共同投资者身份进入由美国风投主导的轮次。英国科学技术大臣 Liz Kendall 和 AI 大臣 Kanishka Narayan 均发表背书，将这笔投资定义为英国能够成为「AI maker, not
              taker」的证明。


              作为一家没有披露产品或收入的种子阶段公司，Ineffable 在这一轮之前没有融资历史；2026 年 4 月前的股权结构未知。51
              亿美元投后估值对一家仅成立数月、没有商业产品的实体而言极高，使其在种子轮即进入「五角兽」状态（估值超过 50
              亿美元的公司）。未见债务、信贷额度、老股转让或此前融资的报道或确认。公司承诺在一个「雄心勃勃的研究能够蓬勃发展，而不必屈从于渐进式产品和短期利润的要求」的窗口内运营，这将影响投资者预期商业回报的时间线。


              David Silver 已公开承诺，将其 Ineffable 股权产生的任何个人收益 100% 通过 Founders Pledge 网络捐给高影响力慈善机构。Sesamers
              报道称，按本轮隐含股权价值计算，这是 Founders Pledge 史上最大的一笔承诺。TechCrunch 和 Hotminute 也印证了这一承诺。Founders Pledge
              网站本身不公布个人成员承诺。
