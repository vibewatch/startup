      - number: '8.4'
        title: 牛、基准与熊三种情景
        blocks:
          - type: paragraph
            body: >
              Ineffable 的情景规划需要基于里程碑承销，而不是收入预测，因为公开证据看不到收入轨迹。以下三种情景都锚定可观察的技术和商业触发器，而非投机性收入条目。


              牛市情景假设 David Silver 在 2027–2028 年发布可验证 RL 里程碑，证明开放式环境扩展能力；Ineffable 在 2028–2029 年拿下首个主权或企业商业合同；Series B
              估值达到种子轮的 2× 或更高。在这种情景下，价值创造路径从约 2029 年开始的许可和 API 收入，延伸到 2032 年的战略收购或 IPO 候选资格。隐含企业价值区间为 $30–75
              billion。这个情景要求连续取得独立胜利——先技术里程碑，再商业证明，再融资里程碑——每一步都以前一步为条件。概率为低到中。主要敏感性驱动因素是已发布 RL 里程碑的规模和可信度。


              基准情景假设到 2028 年研究进展可见且可信，但商业部署推迟到 2030–2031 年。公司以温和估值上调完成一到两轮过桥融资，初始商业牵引力来自小众主权或科学许可细分市场。2032 年退出时隐含企业价值区间为
              $8–20 billion。这个情景最符合公开证据：技术进展先于即时商业化，正好匹配每一家前沿 AI 研究实验室已观察到的发展模式。


              熊市情景假设到 2027–2028 年出现 RL 扩展平台期证据，且 Ineffable 没有反证；Silver
              离开或改变公司方向；资本在商业证明前耗尽。在这种情景下，退出选项收缩为清仓出售、以低于种子轮估值的人才收购，或只剩残余 IP 价值。隐含企业价值区间为 $0.5–4 billion。如果 Ineffable
              在种子轮完成后 24–30 个月内没有产出公开可验证里程碑，这一情景的概率会上升。


              Stanford HAI AI Index（2025）记录，2024 年全球 AI 私人投资超过 $100 billion，其中前沿模型投资占主导——这确认了 Ineffable 种子轮定价所处的市场环境。表
              TV003 将三种情景对应到假设、价值路径和概率信号。图 FV002 分离关键敏感性驱动因素。图 FV003 绘制各情景下的企业价值区间。
