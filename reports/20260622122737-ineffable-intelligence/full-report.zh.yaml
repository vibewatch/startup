            body: >
              客户证明的尽调标准，需要具名部署、明确用例、可衡量结果，以及生产阶段使用或至少活跃试点的证据。截至 2026 年 6 月，Ineffable Intelligence
              一项标准也不满足。没有具名付费客户、没有披露试用、没有案例研究、没有 G2 或 Gartner Peer Insights 评论、没有具名用户的会议发言、没有政府采购记录，也没有引用客户产品使用的新闻稿。


              最接近客户类比关系的实体，必须清晰区分。NVIDIA 是技术伙伴和基础设施联合开发方——它与 Ineffable 工程师共同设计 RL 训练管线，但这是 Ineffable 受益于 NVIDIA
              硬件的供应商—客户关系，不是任何组织部署或购买 superlearner 产品的关系。Google Cloud 是 Ineffable 的首选基础设施提供方——Ineffable 是 Google Cloud
              的客户，而非相反。UK Sovereign AI Fund 和 British Business Bank
              是持有股权的财务投资者；政府宣布的「下一轮优先拒绝权」是投资选择权，不是产品购买或部署证据。按标准尽调口径，这些实体都不构成产品客户。


