  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义——Superlearner 研究平台
        blocks:
          - type: paragraph
            body: >
              Ineffable Intelligence 不提供商业产品、服务或
              API。它当前交付的是一个研究项目和基础设施栈，目标是打造公司所谓的「superlearner」：一个通过强化学习，从自身经验中发现全部知识、而不依赖人类生成数据的 AI
              系统。公司明确表示，自己处在「一个让宏大研究能够繁荣的时间窗口，不必屈从于渐进式产品和短期利润的要求」。这是有意选择的商业化前姿态，不是暂时缺口。


              根据公开材料，superlearner
              概念包含三个功能组件。第一，经验生成层：系统在模拟环境中行动，生成自己的训练数据，而不是消费固定数据集。第二，打分与奖励层：系统观察自身行动结果，依据奖励信号评估结果，并更新内部状态。第三，训练—推理循环：系统基于打分后的经验持续细化参数；NVIDIA
              称这种「紧密循环」对互联、内存带宽和服务基础设施提出异常高的要求。David Silver 曾把系统的预期范围描述为学习「从基础运动技能到深刻智力突破」的一切，并称其为「量级可与达尔文相比的科学突破」。


              从任何商业意义上看，这个平台都还不是产品。没有定价、没有客户、没有部署，也没有除创始人在 DeepMind
              既有工作公开描述之外的能力文档。最接近的类比是早期研究算力项目：一组基础设施投资、招聘计划和算法开发冲刺，目标是最终产出一个具备科学意义的训练系统。产品模块表（TE001）把研究平台的功能组件，与当前成熟度、目标用户、差异化因素和尽调缺口逐一对应。
