      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >
              AI 计算基础设施市场正经历前所未有的需求增长。NVIDIA CEO Jensen Huang 表示，AI 推理 token 生成量一年内增长了十倍；NVIDIA FY2026
              第一季度业绩也确认，数据中心需求「incredibly strong」，短期看不到需求饱和。NVIDIA 在沙特、阿联酋和欧洲扩展 AI factories，证明主权买方正在把政治承诺转化为真实计算采购。英国
              AI Opportunities Action Plan（2025 年 1 月）和在 Seoul Summit 签署的英国 Frontier AI Safety Commitments
              表明，英国政府政策与支持前沿 AI 发展一致，为 Ineffable 的融资提供了需求信号和合法性框架。


              RL scaling 正显示实际进展：Kimi k1.5 论文（2025 年 1 月）证明，将 RL 应用于 LLM 时，即使没有 Monte Carlo tree search 或 process reward
              models，也能在多个推理基准上匹配 OpenAI 的 o1。AlphaFold 的原子级蛋白质结构预测让 RL 和深度学习成为科学研究中不可或缺的工具。这些技术概念验证在监督学习等价物层面验证了 RL
              投资论点，但尚未验证 Ineffable 所追求的自主经验式学习。


              约束端有五个结构性障碍。第一，EU AI Act 的 GPAI 义务已于 2025 年 8 月 2 日生效，对高能力前沿模型引入安全评估、版权披露要求和系统性风险缓释；这会给 Ineffable
              在欧盟的任何商业部署增加合规成本和法律不确定性。第二，美国对 NVIDIA H20 芯片的出口管制造成 FY2026 第一季度约 45 亿美元费用和约 70
              亿美元被阻断或损失的收入，证明地缘政治供应冲击可实质打乱 AI 基础设施计划，与需求无关。第三，RL 训练天然比同等监督学习训练更消耗计算（Epoch AI 分析显示 AlphaGo
              系列系统是计算离群值）。第四，通用 AI 投资的 ROI 不确定：Goldman Sachs Research 明确指出生产率影响可能推迟到本十年后半段，引发对可自由支配支出节奏的疑问。第五，Ineffable
              没有任何商业产品、收入，甚至没有可展示的研究里程碑，这意味着截至本次报告日期，整个采用路径都是推测性的；英国政府稀薄股权（且没有可执行 IP 或主权条件）带来的治理担忧，也会增加合法性风险。
