  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >
              界定 Ineffable Intelligence 的可寻址市场需要先划清边界，因为公司追逐的是一种能力——通向超级智能的自主强化学习——而不是成熟产品类别中的某个产品。三个重叠视角最有分析价值：（1）前沿 AI
              训练基础设施，即训练全球最先进 AI 系统所需的硬件、软件和计算编排；（2）AI-for-science 和知识发现应用，在这些场景中，RL
              及相关深度学习方法正在替代传统科学模拟和人类专家工作流；（3）主权和战略 AI 能力，英国、欧盟及盟友政府正把前沿 AI 能力作为国家安全和产业政策议题积极投入。


              在没有商业产品的前提下，以下不应计入可寻址市场：（a）企业聊天机器人、推荐引擎、NLP-as-a-service 等通用 AI 应用，它们是下游消费者，不是买方；（b）作为大宗商品的 AI 硬件（NVIDIA
              芯片是 Ineffable 的投入成本，不是它销售的市场）；（c）面向 SME 或消费者买家的 AI 软件订阅。分析师引用的表面庞大的「全球 AI 市场」数字——从 2000 亿美元到 1
              万亿美元以上不等，取决于方法——混合了这些被排除的类别，不能在没有边界逻辑的情况下作为 Ineffable 的 TAM。


              Ineffable 所提出方案的现状替代品包括：基于人类整理数据训练的大语言模型（占主导的监督学习范式）；AI-for-science 场景中的人类科学专家和领域专用仿真软件；以及 Google
              DeepMind、OpenAI、Anthropic 等超大规模厂商和前沿实验室的内部研究项目，这些机构同时最可能成为早期合作伙伴 / 买方，也是最有能力的 incumbent。纯 RL 流水线 incumbent
              很少；David Silver 的团队曾是 DeepMind 中全球最突出的团队之一，因此替代威胁主要来自内部能力，而非外部供应商。
