        - $1.1B 欧洲最大种子轮；Tier-1 Sequoia + Lightspeed；NVIDIA 和 Google Cloud 作为经济共同投资者
        - 前沿 RL 算力每年增长 2–5×；未披露 burn rate；算力胃口可能在里程碑前耗尽资本
        - burn rate 确认低于 $100M/yr 且 runway 多年；或宣布上调估值的后续过桥融资
      - - 基础设施锁定
        - NVIDIA Grace Blackwell 和 Vera Rubin 联合设计；Google Cloud AI Hypercomputer 为首选提供商；两家公司均持股
