      - number: '6.2'
        title: 采用轨迹——合作伙伴信号与商业证明缺失
        blocks:
          - type: paragraph
            body: >
              传统采用轨迹指标——活跃用户数、部署实例、年度合同价值、复购率——并不存在于 Ineffable Intelligence，因为公司没有发布商业产品。现阶段无法用 SaaS、API 或企业软件客户指标评估公司。


              最接近采用准备度的公开代理指标，是 Ineffable 2026 年 4 月出隐身后数月内宣布的战略合作。NVIDIA 宣布一项工程级协作，共同设计强化学习基础设施栈，从 NVIDIA Grace
              Blackwell 起步，并延伸至即将推出的 Vera Rubin 平台。该协作涉及两家公司工程师共同建设训练管线，是 Ineffable 已披露的最具运营实质的外部关系。2026 年 6 月，Google
              Cloud 宣布首选合作伙伴协议，Ineffable 将在 Google Cloud AI Hypercomputer 上部署由 NVIDIA Vera Rubin NVL72 驱动的最大 A5X GPU
              集群之一。两项关系都传递出基础设施层面的技术可信度，但它们是「合作伙伴即基础设施客户」关系（Ineffable 是算力买方），不是产品客户关系。


              公共部门侧，UK Sovereign AI Fund 和 British Business Bank 合计向种子轮承诺约 $20 million；Sovereign AI Fund 还提供英国最大 AI
              超级计算机访问、签证支持，以及「英国国家的独特杠杆」。这代表对研究项目的制度性认可，但不构成产品采用。公司或任何第三方来源均未披露试点项目、意向书、商业化前协议或客户管线。采用轨迹表（TU002）在这一基线下记录所有可衡量信号，采用漏斗图（FU002）映射从研究走向商业化的理论路径各阶段，以及漏斗目前停住的位置。
