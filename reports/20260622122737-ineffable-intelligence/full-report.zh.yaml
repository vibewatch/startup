      - number: '7.7'
        title: 附录
        blocks:
          - type: callout
            title: 安全治理缺位是投资论点级风险
            body: >
              Ineffable Intelligence 正在打造一个明确以实现超级智能为目标的系统——能力超过人类水平。截至 2026 年 6 月 22
              日，公司没有披露负责任扩展政策、安全负责人、红队项目、对齐研究议程或外部安全顾问机构。这个缺口不能无限期后置：所有已经发布安全承诺的前沿实验室（Anthropic、OpenAI、Google
              DeepMind）都是在取得重大能力之前发布，而不是之后。鉴于 EU AI Act
              的系统性风险义务、潜在英国监管行动，以及任何以通用智能为目标的系统都伴随根本对齐不确定性，投资人应把安全治理缺位视为重大尽调阻断项——而不只是声誉风险。
