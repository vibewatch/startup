      - number: '7.3'
        title: 伙伴与基础设施依赖风险
        blocks:
          - type: paragraph
            body: >
              Ineffable Intelligence 的基础设施建在一组很窄的关键依赖之上；其中任何一个环节都可能独立损害研究项目。


              NVIDIA 是集中度最高的依赖。Vera Rubin NVL72 集群为 Ineffable 的 RL 工作负载定制共同设计；没有其他硬件能在 superlearner
              所需训练—推理紧密闭环中匹配其互连和内存带宽规格。NVIDIA 还对 Ineffable 进行了股权投资，因此同时扮演投资人和唯一硬件供应商。硬件协议的商业条款——定价、配额保证、排他性，以及升级到未来
              NVIDIA 世代的路径——完全未披露。


              Google Cloud 是第二个关键依赖，作为 Ineffable 部署 AI Hypercomputer A5X / Vera Rubin NVL72 集群的「首选云提供商」。这项合作于 2026 年 6
              月宣布；商业条款同样未披露。Google 也单独投资了 Ineffable，形成平行的投资人—云提供商双重角色。Google Cloud 同时服务 Google DeepMind、OpenAI（通过竞争对手
              Microsoft Azure），以及自身内部 AI 项目；Ineffable 没有披露相对于这些竞争优先事项的优先级或容量保证。


              资本依赖集中在领投人层面。Sequoia Capital 和 Lightspeed Venture Partners 共同领投种子轮并持有董事会席位。按 VC
              支持公司的惯例，种子轮领投人通常被期待为下一轮背书并继续领投。如果任一机构对技术进展或竞争格局产生保留，它们退出 Series A 背书会被其他投资人解读为强烈负面信号——也就是「抽梯子」情景。


              British Business Bank 和 UK Sovereign AI Fund 合计在种子轮投入约 $30–40 M。其治理权和信息权未公开披露。如果政府调整 AI
              政策，或认定投资中的公共利益条款没有得到满足，即便没有合同追索权，也可能制造声誉和政治压力。


              人才管线依赖 David Silver 的个人学术网络。已披露且具名来源的多数雇员来自 DeepMind 和 UCL。Silver 既是
              CEO，也是主要招聘者。如果他离开，不仅科学方向承压，人才管线也很可能同时枯竭。
