      - number: '1.4'
        title: 合作伙伴、基础设施与里程碑
        blocks:
          - type: paragraph
            body: >
              种子轮公告后的数周内，Ineffable 快速推进前沿强化学习所需的计算基础设施。公司已公开宣布两项重大基础设施合作。


              2026 年 5 月 13 日，Ineffable 与 NVIDIA 宣布开展工程层面的合作，共同构建大规模运行超级学习者系统所需的强化学习流水线。双方工程师正在共同设计训练基础设施，初期基于 NVIDIA
              Grace Blackwell 硬件，并计划成为最早探索 Vera Rubin 平台的团队之一。Jensen Huang 表示：「We are thrilled to partner with Ineffable
              Intelligence to codesign the infrastructure for large-scale reinforcement learning as they push the
              frontier of AI and pioneer a new generation of intelligent systems.」NVIDIA 已参投种子轮，因此既是投资方，也是深度工程合作伙伴。


              2026 年 6 月 16 日，Ineffable 与 Google Cloud 在 Google Cloud Summit London '26 上宣布战略合作。根据协议，Google Cloud 是
              Ineffable 的首选云服务商，将部署规模最大的 A5X 集群之一，底层由 NVIDIA Vera Rubin NVL72 驱动。合作中特别提到 Google Cloud 的 AI Hypercomputer
              架构——一种 GPU、网络和存储的系统级整合——是其区别于标准 GPU 租赁的关键。David Silver 表示：「We chose Google Cloud as the best fit for our
              reinforcement learning infrastructure. We aren't just looking for processors; we are building a resilient
              and scalable environment to make 'first contact' with superintelligence.」Google Cloud CEO Thomas Kurian
              也就获选发表了相应致辞。Google 同样参投了种子轮。


              这些里程碑合在一起说明，Ineffable 在走出隐身状态后 60 天内，已为其研究计划锁定两项关键的非资本投入——计算基础设施和工程人才。UCL 关联和其作为伦敦 AI 锚点的定位，也被 UCL 在伦敦 AI
              生态成长语境中引用。
