      - number: '7.5'
        title: 人员、执行与治理风险
        blocks:
          - type: paragraph
            body: >
              Ineffable 的人员风险结构性尖锐。David Silver 是唯一具名创始人、CEO 和主要科学权威。公司没有公开确认的联合创始人、COO、CTO、CFO 或首席安全官。Ashby
              招聘页面显示，公司仍在招聘高级 RL 研究员、ML 基础设施工程师和研究科学家——说明成立十二个月后、完成 $1.1 B
              融资两个月后，团队仍在搭建。这对一家隐身实验室并不罕见，但也让投资人看不到通常应支撑如此宏大论点的板凳深度证据。


              关键人集中度处在前沿 AI 实验室同业中的极端水平。Anthropic 由 Dario Amodei、Daniela Amodei 和另外六名 OpenAI 校友共同创立；OpenAI 拥有深厚管理梯队；即便
              Google DeepMind 也有分布式科学领导层。Ineffable 的全部智力资产——Silver 的 RL 研究议程、前沿研究员网络，以及与 NVIDIA 和 Google
              的关系——都集中在一个人身上，且没有披露继任计划。


              Silver 的研究科学家画像进一步放大执行风险，而非运营者画像。他的论文和公开评论显示出非凡科学深度，但没有证据表明他此前有打造、扩张或商业化一家科技公司的经验。前沿 AI
              实验室要同时面对多重执行挑战：招揽人才、采购算力、设计安全项目、维护投资人关系、开展监管沟通，最终还要开发产品。这些挑战与前沿研究在管理上不同，需要另一套能力。


              治理风险实质存在。公司是标准私人有限公司结构，没有披露公共利益契约、独立安全委员会、外部顾问委员会，也没有发布负责任 AI
              原则。英国政府少数股权制造了治理问责预期，但公司当前披露并未满足这一预期。Newspage 和 Electronics Weekly 引述的批评者称，现有安排是公共资金为公司提供合法性，却没有获得相称治理权。
