      - number: '4.5'
        title: 财务结论与尽调阻碍项
        blocks:
          - type: paragraph
            body: >
              传统意义上，Ineffable Intelligence 无法被财务承销。收入质量为零——没有收入。毛利率路径是推测——没有可建模的 COGS 结构。资本强度极高——前沿规模 RL 叠加 Vera Rubin
              NVL72 集群，只能由商业条款未披露的合作补贴部分抵消。烧钱率和资金续航未确认——公司没有发布财务报表，也没有公开烧钱估计。下一轮融资风险显著——Ineffable
              需要额外资本（很可能仍是十亿美元级）才能在初始研究阶段后维持前沿规模运营，融资时点也不确定。


              对种子阶段前沿 AI 研究投资而言，这并不构成一票否决。$1.1 billion 种子轮规模明确用于资助研究周期，而非商业里程碑；Sequoia、Lightspeed、NVIDIA、Google 和
              Wellcome Trust 的参与，也验证了资本形成假设。但若没有证据显示商业化时间表已经定义且可合理实现，投资者不应在标准 3-5
              年风险投资周期内建模正向现金流。核心尽调阻碍项包括：（1）没有任何已提交或审计财务报表；（2）没有披露烧钱率、现金头寸或资金续航；（3）没有 $1.1 billion
              种子轮资金用途拆分；（4）没有商业路线图或收入模式；（5）算力合作商业条款抵消资本需求，但结构未知；（6）没有公布员工人数或薪酬结构。每一项都是治理良好的 Series A 或更后期流程中标准的数据室问题。
