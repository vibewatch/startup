      - number: '7.6'
        title: 缓释措施、监测指标与终止标准
        blocks:
          - type: paragraph
            body: >
              每个优先风险簇都有不同的缓释路径、监测信号和明确阈值；一旦越过阈值，就构成投资论点破裂事件，需要投资人重新评估。


              监管风险方面，主要缓释措施是主动与 DSIT、AISI 和 ICO 沟通，并在下一轮融资前委托法律分析 NSI Act 持股限制和 EU AI Act GPAI 义务。监测信号是英国 AI 法案提交议会，以及欧盟
              GPAI 登记册发布；论点破裂阈值是具有约束力的算力或安全义务生效，而 Ineffable 若不对训练项目做实质重组就无法遵守。


              算力依赖方面，缓释措施是与 NVIDIA 和 Google Cloud 谈判合同化配额保证，并至少正式评估第二算力提供商（Lambda Labs、CoreWeave 或 AWS
              Trainium）的可行性。监测信号是 NVIDIA 公开业绩电话会中关于 Vera Rubin NVL72 爬坡时间表的表述；论点破裂事件是确认延迟超过十二个月，或明确把 NVL72
              产能重新优先分配给其他客户。


              RL 扩展不确定性方面，缓释措施是定义并发布技术里程碑路线图，包含可验证里程碑（具体基准成绩、能力展示），且可由独立方评估。监测信号是 Ineffable 及其前沿竞争者经同行评审的 RL
              泛化结果；论点破裂阈值是 Ineffable 开始训练后三十个月内，任何前沿来源都没有展示开放世界 RL 泛化改进，同时 Ineffable 也拿不出反证。


              关键人风险方面，缓释措施是任命至少一名等同联合创始人的科学联合负责人，形成书面继任计划，并与高级研究员签订留任安排。论点破裂事件是 David Silver 因任何原因离开 CEO 职位。


              下一轮融资方面，监测信号是前沿 AI 风险投资活动轨迹，以及 Sequoia / Lightspeed 投资组合公司的募资可比样本；论点破裂事件是在种子轮后三十六个月内无法以不低于 $5.1 B 估值完成
              Series A，或确认 runway 低于十二个月且没有已承诺跟投。


              汇总后的终止标准与缓释表（TR005）概括五个风险簇、触发事件和建议投资人行动。风险热力图（FR001）按可能性和严重性映射所有重大风险。传导图（FR002）展示主要风险如何传导至收入、估值和投资人回报结果。依赖图（FR003）可视化必须主动管理的关键外部依赖。
