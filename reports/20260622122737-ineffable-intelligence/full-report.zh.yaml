      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 买方集中带来双边垄断风险
            body: >
              前沿 RL 训练的可信近期付款方池极薄：全球大约五家超大规模厂商，加上少数主权项目。这让 Ineffable 几乎完全依赖一小撮付款方来获得商业验证，也让这些付款方在合同条款、计算定价和 IP
              访问上拥有强杠杆。既是基础设施合作伙伴（Google Cloud）又是股权投资者（Google、NVIDIA）的超大规模厂商，有结构性动机把 Ineffable 的研究方向塑造成符合自身平台利益的形态。
