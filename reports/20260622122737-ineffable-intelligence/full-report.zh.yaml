      - number: '4.2'
        title: 成本结构与资本强度
        blocks:
          - type: paragraph
            body: >
              现阶段，Ineffable 的成本结构几乎全是研究和基础设施成本。公开资料中没有销售成本（COGS）、毛利率或经营杠杆数据；公司也没有收入可用于衡量成本比例。


              最大成本驱动项是算力。与标准 transformer 预训练不同，强化学习负载需要紧密集成的训练—推理循环；NVIDIA 与 Ineffable
              联合署名博客称，这种循环会「以预训练不会出现的方式，对互联、内存带宽和服务能力施压」。系统必须持续行动、观察、打分并更新——与静态数据集预训练相比，对集群级编排提出数量级更高要求。算力强度是公司最重大的财务约束：Epoch
              AI 的分析（2025）显示，前沿模型训练成本自 2016 年以来每年增长 2.4 倍，硬件占前沿模型开发成本的 47–67%，研发人员占 29–49%，能源占 2–6%。Epoch AI 预计，若趋势延续，到
              2027 年最大规模训练运行单次成本将超过 $1 billion。


              Google Cloud 和 NVIDIA 两个合作关系都显著缓解了成本压力。Google Cloud 作为 Ineffable 的首选云提供商，正在部署由 NVIDIA Vera Rubin NVL72
              驱动的最大 A5X 集群之一——在标准云采购模式下，这类基础设施不需要 Ineffable 直接资本开支融资。NVIDIA
              的联合设计合作提供工程资源和硬件访问，否则公司需要直接采购。两个合作关系合在一起，把原本巨额资本开支（或前沿规模集群每年数亿美元级云租赁支出）转化为与合作商业条款绑定的更灵活成本结构——但相关细节并未公开披露。Arxiv
              研究（2022）发现，大规模 ML 模型所需算力比标准深度学习高 10-100×，深度学习时代训练算力约每 6 个月翻一倍，因此成本轨迹是长期结构性风险，不是静态成本项。


              研发人员是第二大成本类别。Ineffable 于 2026 年 2 月 5 日通过员工股票期权计划（含美国子计划），显示公司打算以有竞争力的股权薪酬水平招聘并留住人才。股份支付薪酬会按 IFRS 2
              或同等准则确认为非现金费用，即使现金人力成本尚未扩张，也会新增一条未来成本线。公司没有披露员工人数，也尚未提交任何财务报表。资本强度与现金流图（FI004）在这些约束下勾勒结构性成本流向。
