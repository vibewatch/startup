            body: >
              截至 2026 年 6 月 22 日，Ineffable 没有已部署产品、API 或公开可访问系统。公司仍处纯研究和基础设施建设阶段。没有公开披露发布时间表、产品路线图、能力目标或训练计划。

              唯一能证明前瞻规划的证据来自基础设施合作：NVIDIA 协作被描述为探索「当 AI 世界从人类数据转向通过模拟和经验学习的模型时所需的下一代硬件和软件」；Google Cloud 合作则描述部署「最大 A5X
              集群之一」，这是一项面向未来的基础设施承诺，而非当前能力。


              Silver 的公开沟通描述的是多年研究窗口：「一段让宏大研究能够繁荣的时间和机会窗口」。这与 $1.1 billion 种子资本用于资助研究阶段、而非上市冲刺的定位一致。Sovereign AI
              共同投资也明确把该投资框定为长期支持一家「定义品类的公司」，而不是近期产品周期。没有能力里程碑（例如首个已训练 RL 智能体、首个科学发现、首个基准测试结果）被宣布、承诺或泄露。


