      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >
              Ineffable 的买方图景与标准 B2B SaaS 市场截然不同，因为截至本次报告日期，公司没有产品、没有客户、没有收入。因此相关分层只能是前瞻性的：如果 Ineffable
              取得技术进展，谁会资助或采用超级学习者系统？


              第一层——超大规模厂商和云服务商。Google、Microsoft、Amazon 和 Meta 共同控制着全球最大的 AI 训练集群，也是前沿 AI 模型的主要建设者。Google Cloud 已与
              Ineffable 建立首选供应商关系，使其既是基础设施合作伙伴，也是 RL 能力的潜在买方。NVIDIA
              作为股权投资者和工程共同设计方，也拥有独特的双重角色。这些机构有预算（每年数百亿美元级资本开支）、有整合超级学习者系统的技术成熟度，也有在竞争对手之前获取能力的战略动机。采用触发点将是自主知识发现能力在规模上的可验证进展。


              第二层——主权和国家支持实验室。英国的 British Business Bank（2000 万美元）、Sovereign AI Fund 和美国 National AI Research
              Resource（NAIRR）代表了一个独立买方层级；其中采购由国家战略目标驱动，而非商业 ROI。欧盟的 AI factories 和 EuroHPC 计划是欧洲对应项。NVIDIA 在 ISC 2026
              宣布欧洲将新增 35 台 NVIDIA AI 超级计算机，包括 Forschungszentrum Jülich 的
              JUPITER，说明主权基础设施投资正在规模化落地。对这一买方层级而言，付款方是政府项目或公共研究机构，采用触发点是地缘政治紧迫性和科学雄心，而非短期商业回报。


              第三层——前沿 AI 实验室。其他前沿实验室（Anthropic、OpenAI、xAI、Mistral 等）是 Ineffable 的主要竞争对手；不过，Ineffable 开发的 RL
              特定能力也可能通过授权或协作方式部署，而非直接竞争。这些机构的计算预算相对超大规模厂商受限，近期不太可能成为大规模付款方。


              第四层——科学研发机构。AlphaFold 的成功——该项目由 Google DeepMind 在 David Silver 更广泛的 RL 研究体系下开发——证明制药公司、国家实验室和基因组学机构对
              AI-for-science 能力存在真实需求信号。这些买方按研究经费周期运作，当科学价值具有变革性时，对计算成本不那么敏感。但 Ineffable
              的超级学习者论点与可立即部署的科学工具之间仍有很大距离；这个买方层级至多属于中期机会。


              企业研发是投机性的长期层级，需要先有产品和业绩记录，采购才可能开始。
