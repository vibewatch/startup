      三条最强的传导路径是：（1）Silver 离职 → 人才流失 → 研究停摆 → 投资者信心崩塌；（2）NVIDIA 延误 → 训练停摆 →
      里程碑落空 → 下一轮融资失败；（3）RL 停滞 → 没有能力证明 → 商业化失败 → 投资论点破裂。
    claimRefs:
      - CR009
      - CR011
      - CR032
      - CR039
      - CR040
      - CR041
    data:
      nodes:
        - id: silver-departure
          label: David Silver 离职
          tone: risk
        - id: nvidia-delay
          label: NVIDIA / 算力延误
          tone: risk
        - id: rl-plateau
          label: RL 扩展停滞
          tone: risk
        - id: training-halt
          label: 训练计划停摆
          tone: risk
        - id: milestone-miss
          label: 研究里程碑落空
          tone: risk
        - id: no-capability
          label: 没有能力证明
          tone: risk
        - id: talent-attrition
          label: 人才流失
          tone: risk
        - id: investor-confidence
          label: 投资者信心崩塌
          tone: risk
        - id: nextround-failure
          label: 下一轮融资失败
          tone: risk
        - id: thesis-break
          label: 投资论点破裂 / 减记
          tone: adverse
      edges:
        - from: silver-departure
          to: talent-attrition
          label: 人脉网络坍塌
        - from: silver-departure
          to: investor-confidence
          label: 核心可信度锚点丢失
        - from: talent-attrition
          to: training-halt
          label: 研究能力被掏空
        - from: nvidia-delay
          to: training-halt
          label: 硬件无法到位
        - from: training-halt
          to: milestone-miss
          label: 时间线滑坡
        - from: rl-plateau
          to: no-capability
          label: 科学论点失效
        - from: milestone-miss
          to: investor-confidence
          label: 缺少证实论点的证据
        - from: no-capability
          to: investor-confidence
          label: 商业逻辑坍塌
        - from: investor-confidence
          to: nextround-failure
          label: 领投方释放退出信号
        - from: nextround-failure
          to: thesis-break
          label: 资本在里程碑前耗尽
  - id: FR003
    title: 关键依赖图
    type: dag
    layout: wide
    summary: |
      图中列出所有关键外部依赖。Ineffable Intelligence 位于中心；第一圈每个节点都代表一个依赖，一旦失效会直接传导到研究计划。
      NVIDIA 和 Google Cloud 是集中度最高的两个单点依赖。David Silver 是唯一的人类依赖节点。
      UK Government 提供合法性和监管入口，但直接运营杠杆有限。
    claimRefs:
      - CR009
      - CR017
      - CR023
      - CR024
      - CR032
    data:
      nodes:
        - id: ineffable
          label: Ineffable Intelligence
          tone: neutral
        - id: nvidia
          label: NVIDIA（硬件 + 投资者）
          tone: neutral
        - id: google-cloud
          label: Google Cloud（基础设施 + 投资者）
          tone: neutral
        - id: sequoia-ls
          label: Sequoia / Lightspeed（资本 + 董事会）
          tone: neutral
        - id: david-silver
          label: David Silver（CEO + 科学）
          tone: neutral
        - id: uk-govt
          label: UK Government（合法性 + 监管）
          tone: neutral
        - id: ucl-network
          label: UCL / 学术网络（人才）
          tone: neutral
      edges:
        - from: nvidia
          to: ineffable
          label: Vera Rubin NVL72 硬件；联合设计；股权投资
        - from: google-cloud
          to: ineffable
          label: AI Hypercomputer 部署；首选云；股权投资
        - from: sequoia-ls
          to: ineffable
          label: 董事会席位；$1.1 B 种子资本；Series A 信号
        - from: david-silver
          to: ineffable
          label: 科学方向；招聘；外部可信度
        - from: uk-govt
          to: ineffable
          label: BBB + Sovereign AI Fund 共同投资；监管对话；合法性
        - from: ucl-network
          to: ineffable
          label: 人才管线；学术同行评审；教授任职关系
        - from: ineffable
          to: uk-govt
          label: 国家 AI 能力；公共利益预期
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: |
      从证据输入（市场规模、创始人质量、资本、范式风险、零商业证明、治理缺口、估值语境）一路推导到最终建议：有条件的跟踪关注（观察仓位）。 图中展示正负因素如何合在一起，形成一个信心较低、风险极高的观察判断。
    claimRefs:
      - CV013
      - CV016
      - CV039
    data:
      nodes:
        - id: market-scale
          label: 市场规模
          detail: Frontier AI TAM 可能达到数万亿美元；Ineffable 切入价值最高的研究到产品环节
        - id: founder-quality
          label: 创始人质量
          detail: David Silver：AlphaGo/AlphaZero/AlphaProof；约 20 年 Google DeepMind 经历；代际级 RL 人才
        - id: capital-structure
          label: 资本与基础设施
          detail: $1.1B 种子轮；Sequoia + Lightspeed 共同领投；NVIDIA + Google Cloud 共同投资；董事会席位
        - id: paradigm-risk
          label: 范式风险
          detail: 无数据 RL 尚未在规模化下得到验证；同业证据显示扩展存在上限；在位公司有 12–36 个月复制窗口
        - id: zero-commercial-proof
          label: 没有商业证明
          detail: 截至 2026 年 6 月，零收入、零客户、零产品；未披露商业化时间表
        - id: governance-gap
          label: 治理与安全缺口
          detail: 没有安全 / 对齐框架；公司依赖 Silver 这个关键人；主权共同投资方没有 IP 锁定
        - id: valuation-context
          label: 估值语境
          detail: $5.1B 种子轮：欧洲史上最大；达到美国 Frontier AI 梯队，但没有收入锚点；由叙事驱动
        - id: external-risks
          label: 外部风险
          detail: RL 停滞风险；英国监管演进；算力集中；竞争对手快速跟进窗口
        - id: recommendation
          label: 推荐：观察
          detail: 有条件的跟踪关注 — 不领投；设置 Series A 里程碑门槛；风险评级极高
      edges:
        - from: market-scale
          to: recommendation
        - from: founder-quality
          to: recommendation
        - from: capital-structure
          to: recommendation
        - from: paradigm-risk
          to: recommendation
        - from: zero-commercial-proof
          to: recommendation
        - from: governance-gap
          to: recommendation
        - from: valuation-context
          to: recommendation
        - from: external-risks
          to: recommendation
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: >
      以 $5.1B 基准为参照，示意 Ineffable 企业价值对八个最关键正负变量的方向性敏感度，单位为估算的 $B 变化。 上行驱动主要来自技术里程碑兑现；下行驱动主要来自 Silver 离职和 RL
      停滞。该图不是财务预测——所有数值都是分析师基于情景分析和可比实验室案例作出的估算。
    approximationNotes: |
      数值仅为方向性分析师估算。Ineffable 没有公开收入、成本或融资数据。敏感度幅度依据 TV003 中的情景价值区间和可比实验室估值波动校准。 柱状条展示各驱动因素对基准估值假设的加性影响；驱动因素之间的相互作用未建模。
    claimRefs:
      - CV021
      - CV022
      - CV024
      - CV025
      - CV026
      - CV027
    data:
      items:
        - label: 技术突破发布（2027–28）
          value: 40
          detail: 经验证的开放式 RL 里程碑触发 Series B 重新定价和战略兴趣
        - label: 首个商业合同签署
          value: 20
          detail: 主权或企业合同验证商业可行性路径
        - label: Series A 定价高于 $7B
          value: 12
          detail: 市场验证信号；后续融资确认；稀释可控
        - label: NVIDIA 联合设计加深（Vera Rubin 2.0）
          value: 8
          detail: 获得下一代硬件，降低估值中的算力风险溢价
        - label: RL 扩展停滞被确认
          value: -35
          detail: 范式失败；熊市情景变成基准情景；基本投资论点受损
        - label: David Silver 离职
          value: -40
          detail: 关键人论点坍塌；所有情景概率立即下调
        - label: 算力访问中断
          value: -22
          detail: NVIDIA 配额削减，或 Google Cloud 合作终止；时间线延误多年
        - label: 估值下调的 Series A（≤$5.1B）
          value: -30
          detail: 市场下调估值信号；后续融资概率大幅下降
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: >
      牛市、基准和熊市情景下，2032 年退出时低 / 基准 / 高企业价值估算，单位为十亿美元。 图中展示潜在结果的完整光谱；区间很宽，反映缺少公开收入、成本或融资数据。熊市情景与种子轮估值重叠（$5.1B 基准情景下界），
      说明种子投资者在稀释和优先权之后，现实中可能获得零回报甚至负回报。
    approximationNotes: |
      数值为情景估算，来自基于里程碑的承销和可比 Frontier AI 实验室案例。不是财务预测。 所有数字均为稀释前，且未计入优先权堆叠；条款未披露，可能实质影响投资者层面的回报。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV024
    data:
      items:
        - label: 牛市情景（2032）
          low: 30
          mid: 52
          high: 75
          unit: $B enterprise value
          note: 要求：2028 年前实现技术里程碑，2029 年前拿下首个合同，Series B ≥2× 种子轮，具备 IPO / 收购候选资格
        - label: 基准情景（2032）
          low: 8
          mid: 14
          high: 20
          unit: $B enterprise value
          note: 假设：2028 年有研究进展，2030–31 年商业化，利基授权，结构化退出
        - label: 熊市情景（2032）
          low: 0.5
          mid: 2
          high: 4
          unit: $B enterprise value
          note: 假设：RL 停滞或 Silver 离职，资本耗尽，清仓出售或人才收购
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: >
      面向 IC 的评分，对 Ineffable Intelligence 的八个投资维度逐项打分，每项按 1–10 分计，依据截至 2026 年 6 月 22 日的公开证据。
      市场规模和创始人质量得分很高，但商业证明和治理得分极低，最终只能形成观察级信念。所有评分均不基于私人或非公开信息。
    claimRefs:
      - CV013
      - CV022
      - CV039
    data:
      items:
        - label: 市场规模
          value: 9/10
          note: Frontier AI TAM 可能达到数万亿美元；Ineffable 位于价值最高的研究到产品环节
        - label: 创始人质量
          value: 10/10
          note: David Silver：AlphaGo/AlphaZero/AlphaProof；可称全球最顶尖的 RL 研究者
        - label: 技术范式
          value: 7/10
          note: 新型无数据 RL 范式确实独特；尚未在规模化下验证；在位公司可在 12–36 个月复制
        - label: 商业证明
          value: 1/10
          note: 零客户、零收入、无产品、无路线图——商业牵引力得分只能取最低
        - label: 资本结构
          value: 7/10
          note: 一线 Sequoia + Lightspeed；NVIDIA + Google 共同投资；未披露烧钱速度，因此降至 7/10
        - label: 竞争护城河
          value: 5/10
          note: 范式目前独特；快速跟进窗口已打开；没有分发、产品或客户锁定
        - label: 治理与风险
          value: 3/10
          note: 关键人依赖；无安全框架；无 IP 锁定；监管暴露未处理；财务不透明
        - label: 估值与证据
          value: 4/10
          note: $5.1B 种子轮为欧洲史上最大；与美国 Frontier AI 梯队先例相符；没有收入锚点
