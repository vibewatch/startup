companyProfile:
  summary: >-
    Ineffable Intelligence 是一家总部位于伦敦的前沿 AI 初创公司，由 David Silver 于 2025 年底创立，目标是打造一种强化学习「超级学习者」，能从经验而非人类生成数据中发现知识。公司于 2026
    年 4 月公开亮相，同时宣布完成 11 亿美元种子轮，投后估值 51 亿美元，投资方包括 Sequoia、Lightspeed、NVIDIA、Google
