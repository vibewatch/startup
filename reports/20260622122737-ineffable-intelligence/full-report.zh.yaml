      - number: '7.2'
        title: 运营、技术与安全风险
        blocks:
          - type: paragraph
            body: >
              Ineffable Intelligence 的运营风险主要由三类相互咬合的问题主导：算力脆弱性、RL 扩展不确定性，以及安全与对齐治理完全缺位。


              算力脆弱性是眼下最可衡量的运营风险。Ineffable 的整条训练管线围绕 NVIDIA Grace Blackwell 和下一代 Vera Rubin NVL72 平台共同设计，并计划部署在 Google
              Cloud AI Hypercomputer 的 A5X 集群上。NVIDIA 于 2026 年 5 月发布 Vera Rubin NVL72；面向 Ineffable
              的生产配额时间表和容量承诺并未公开披露。NVIDIA 服务的超大规模客户队列庞大且仍在增长——Microsoft、Google、Meta、Amazon，以及全球主权 AI
              项目都可能争夺产能。没有披露的第二算力安排。一旦出现重大延误或产能重新分配，研究项目就会停摆。


              Ineffable 所需尺度和通用性的强化学习，在开放式环境中尚未被技术验证。此前里程碑式 RL
              成果——AlphaGo、AlphaZero、AlphaStar——都运行在边界清晰、奖励信号明确的游戏环境里。把这些方法扩展到开放世界知识发现，会引入尚未解决的挑战：奖励黑客（系统优化代理奖励，而非真实目标）、规格博弈（满足字面规格，而非其精神），以及仿真到现实的鸿沟（仿真中学到的技能无法迁移）。学术文献已充分记录这些失败模式，Ineffable
              也未披露任何缓释方法或评估框架。Technology Review 曾指出，多个研究项目中的 RL 扩展已撞墙。


              安全与对齐风险对系统性风险最关键。Ineffable 的既定目标是「与超级智能进行首次接触」——也就是打造能力超越人类水平的系统。截至 2026 年 6 月 22
              日，公司没有公开披露安全框架、负责任扩展政策（RSP）、对齐研究议程、红队项目，也没有披露安全负责人（没有安全主管、安全委员会或外部安全顾问机构）。Anthropic、OpenAI 和 Google
              DeepMind 都已发布 RSP 或等同安全承诺，Ineffable 却没有类似披露。这不只是治理缺口；它是商业化前的缺口，能力越往前推进，越难补上。Seoul Summit 的 Frontier AI
              Safety Commitments 已由主要前沿实验室签署，但 Ineffable 未公开背书。


              superlearner 尺度下，能源和基础设施风险也很实质。前沿 RL 需要紧密的训练—推理闭环，单位 FLOP 能耗高于标准预训练负载。总电力和冷却需求尚未披露。


              网络安全风险偏高。Ineffable 的模型权重和训练工件一旦积累起来，就是极其宝贵的知识产权。公司未披露任何网络安全态势、数据驻留政策或事故响应框架。
