      - number: '4.3'
        title: 资本充足性与现金续航
        blocks:
          - type: paragraph
            body: >
              Ineffable 于 2026 年 4 月 27 日完成 $1.1 billion 种子轮融资，投后估值 $5.1 billion。这是欧洲史上最大种子轮，由 Sequoia Capital 和
              Lightspeed Venture Partners 共同领投。已确认参与方包括 British Business Bank（确认 $20 million）、UK Sovereign AI
              Fund（金额未披露）、NVIDIA、Google、Index Ventures、DST Global、EQT Ventures、Flying Fish、Evantic Capital、BOND Capital
              和 Wellcome Trust。


              公司未公开披露任何债务工具、信贷额度、风险债或项目融资义务。Companies House 尚无年度账目；公司于 2025 年 11 月 19 日成立，首份账目尚未达到法定提交期限。Companies House
              备案历史显示三次股本声明：2025 年 11 月成立时 GBP 10；2026 年 1 月 21 日 GBP 320（与 Silver 被任命为董事及重要控制人相关）；2026 年 3 月 12 日 GBP
              350。这些是名义法定数值，不是实际募集的股本溢价；$1.1 billion 投资会以股份溢价流入，并在首份财务报表提交时出现。


              前沿 AI 实验室基准显示，$1.1 billion 融资支撑多年资金续航具备可能性。Anthropic 和 OpenAI
              在达到类似资本水平前，已用数亿美元级年度算力加人员预算运营。但这些比较并不精确：给定同等能力水平，Ineffable 以 RL 为中心的负载可能比 transformer
              预训练结构性地更耗算力，精确月烧钱额也未知。即便按每月 $60–100 million 的烧钱率计算，$1.1 billion 融资也只能提供约 11–18
              个月资金续航——明显低于使命所暗示的「多年研究周期」，除非 Google Cloud 和 NVIDIA
              的合作补贴能显著抵消直接支出。因此，资本充足性可以成立，但尚未被证明；公司的下一轮股权融资很可能由科学里程碑、种子资金耗尽或商业部署启动触发。UK AI Growth Zones 和更广泛的 DSIT
              政策环境可能带来非稀释资金入口，但目前没有公开宣布给 Ineffable 的此类补助。资本充足性表（TI004）和财务估算区间图（FI003）给出关键资本指标的结构化区间估计。
