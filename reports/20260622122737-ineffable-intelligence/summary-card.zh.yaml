  topStrengths:
    - David Silver 是全球少数多次证明强化学习能打出前沿突破的研究者，这给公司带来异常强的创始人与市场匹配。
    - 种子轮财团和基础设施组合堪称顶级：Sequoia、Lightspeed、NVIDIA、Google Cloud 和英国主权资本同时提供背书和算力入口。
    - 作为一家英国前沿实验室，Ineffable 在欧洲占据差异化战略位置：它追求体验式强化学习，而不是又一条文本优先的 LLM 路线。
  topRisks:
    - 公司没有披露收入、客户、烧钱速度、员工数、财务报表或商业路线图，常规承销几乎无从下手。
    - 技术逻辑依赖强化学习从受限环境扩展到开放式发现；公开证据还没有验证这个前提。
    - 公司核心依赖 David Silver、NVIDIA 硬件路线图、Google Cloud 基础设施和后续融资轮，集中度风险彼此叠加。
    - 与美国领投方相比，英国公共部门投资人似乎治理杠杆有限，由此留下主权、知识产权控制和公共利益问题。
  unresolvedGaps:
    - 当前烧钱速度、预算内算力支出、现金跑道假设，以及撑到首个技术里程碑的融资计划均未披露。
    - 没有公开证据说明公司的里程碑框架、基准设计、安全治理流程或外部评估机制。
    - 公司没有披露付费客户、试点、合同或定价界面，因此需求证明和商业化时间点仍属推测。
    - 完整股权结构表、清算优先权、按比例跟投权、董事会控制条款和公共投资人治理保护均未公开。
