      - - NVIDIA hardware dependency
        - High — entire architecture built on Vera Rubin NVL72 roadmap
        - Technical delay if Vera Rubin shipment slips or co-design relationship changes
        - Review hardware supply terms; confirm Blackwell fallback; stress-test NVL72 timeline
      - - UK government stake too small for governance rights
        - Material — <2% of round buys limited control; governance conditions absent per experts
        - Public-sector customer conversion risk; political withdrawal; adverse media narrative
