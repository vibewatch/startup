  - id: adoption-trajectory
    title: Adoption Trajectory — Partner Signals and the Absence of Commercial Proof
    body: |
      Conventional adoption trajectory metrics — active user counts, deployment instances, annual
      contract values, repeat purchase rates — do not exist for Ineffable Intelligence because no
      commercial product has been launched. The company cannot be assessed on SaaS, API, or
      enterprise-software customer metrics at this stage.

      The closest available proxies for adoption readiness are the strategic partnership announcements
      made in the months following Ineffable's April 2026 emergence from stealth. NVIDIA announced an
      engineering-level collaboration to co-design the reinforcement learning infrastructure stack,
      beginning on NVIDIA Grace Blackwell and extending to the forthcoming Vera Rubin platform. This
      collaboration involves engineers from both companies working together on the training pipeline
      and represents the most operationally concrete external relationship Ineffable has disclosed.
      In June 2026, Google Cloud announced a preferred-partner agreement under which Ineffable will
      deploy one of the largest clusters of A5X GPUs powered by NVIDIA Vera Rubin NVL72 on Google
      Cloud's AI Hypercomputer. Both relationships signal infrastructure-layer technical credibility
      but are partnerships-as-customers-of-infrastructure (Ineffable is the buyer of compute), not
      product-customer relationships.

      On the public-sector side, the UK Sovereign AI Fund and British Business Bank collectively
      committed approximately $20 million to the seed round, with the Sovereign AI Fund additionally
      providing access to the UK's largest AI supercomputers, visa support, and "the unique levers
      of the British state." This represents institutional validation of the research programme but
      does not constitute product adoption. No pilot programmes, letters of intent, pre-commercial
      agreements, or customer pipeline have been disclosed by the company or any third-party source.
      The adoption trajectory table (TU002) documents all measurable signals against this baseline,
      and the adoption funnel figure (FU002) maps the stages of the theoretical path from research
      to commercialisation and where the funnel currently terminates.
    claimRefs:
      - CU004
