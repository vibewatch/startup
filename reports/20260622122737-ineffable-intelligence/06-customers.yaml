  - id: named-customer-proof
    title: Named Customer Proof — Validators and Partners Are Not Customers
    body: |
      A diligence standard for customer proof requires named deployments with specified use cases,
      measurable outcomes, and evidence of production-stage usage or at least active pilot engagement.
      Ineffable Intelligence meets none of these criteria as of June 2026. There are no named paying
      customers, no disclosed trials, no case studies, no G2 or Gartner Peer Insights reviews, no
      conference talks by named users, no government procurement records, and no customer-quoted
      press releases referencing product use.

      The entities that are closest to a customer-analogue relationship must be clearly distinguished.
      NVIDIA is a technology partner and infrastructure co-developer — it is jointly designing the RL
      training pipeline with Ineffable's engineers, but this is a supplier-customer relationship
      where Ineffable benefits from NVIDIA's hardware, not a relationship where any organisation
      has deployed or purchased a superlearner product. Google Cloud is Ineffable's preferred
      infrastructure provider — Ineffable is Google Cloud's customer, not the reverse. The UK
      Sovereign AI Fund and British Business Bank are financial investors who hold an equity stake;
      the government's announced "first refusal on the next round" is an investment option, not
      evidence of product purchase or deployment. None of these entities qualify as a product
      customer under standard diligence.

      The named customer proof table (TU003) enumerates the three closest entities to customer
      status with explicit documentation of their actual relationship type, and the customer
      proof matrix (FU003) maps evidence quality across these dimensions. The absence of any
      qualifying row in TU003 is itself a material diligence finding. David Silver and the
      company have not disclosed any target customer engagements or commercial conversations, in
      line with their stated commitment to prioritise research over near-term commercialisation.
      Google Cloud's Thomas Kurian stated that Ineffable is "leveraging our full-stack AI
      Hypercomputer" — confirming Ineffable's role as an infrastructure consumer, not a product
      supplier with customers of its own.
    claimRefs:
