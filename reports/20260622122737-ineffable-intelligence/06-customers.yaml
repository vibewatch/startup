chapter:
  number: 6
  title: Customers
  summary: |
    Ineffable Intelligence has zero paying customers and zero revenue as of 22 June 2026; the company
    is in a fully pre-commercial research phase by design, with no disclosed product, pricing,
    go-to-market strategy, or customer pipeline. Its closest proof surfaces are technology
    infrastructure partnerships with NVIDIA and Google Cloud — both of which are partners and
    suppliers, not product customers — and minority equity backing from the UK Sovereign AI Fund
    and British Business Bank, which are investors, not users of any commercial product. AI
    governance experts have publicly questioned whether public money in the round buys "ceremonial
    association" rather than genuine customer-equivalent rights, and no pilot programs, letters of
    intent, or pre-commercial agreements have been disclosed.

sections:
  - id: customer-base-overview
    title: Customer Base Segmentation — A Pre-Revenue Baseline
    body: |
      Ineffable Intelligence has no commercial customers as of 22 June 2026. The company is entirely
      pre-revenue by design. Its published mission is to conduct frontier AI research, specifically
      the construction of a "superlearner" system capable of discovering new knowledge from its own
      experience rather than from human data. The company has explicitly stated it operates "without
      bending to the demands of incremental products and near-term profits." No product, API,
      pricing page, enterprise offering, or customer-facing service exists at this time.

      A meaningful customer segmentation for Ineffable can therefore only be prospective — a taxonomy
      of who might buy or license the outputs of the superlearner platform if and when it achieves
      its scientific goals. Five prospective buyer segments emerge from the public record and
      company framing. First, sovereign AI labs and national AI programmes (such as the UK Sovereign
      AI Fund itself) represent the most institutionally aligned near-term segment: governments
      mandated to build domestic AI capability may seek access rights to the superlearner's
      discoveries. Second, hyperscalers — Google Cloud, AWS, Microsoft Azure — could become
      customers by licensing superlearner capabilities to embed in their own AI services, an
      arrangement consistent with Google Cloud's existing infrastructure partnership. Third,
      science research organisations in pharma, materials science, climate research, and drug
      development represent high-value end-user segments for AI that can independently discover
      new scientific knowledge. Fourth, enterprise R&D organisations (large corporations with
      internal research mandates in technology, engineering, and finance) represent a broader
      commercial market once capability thresholds are demonstrated. Fifth, defence and national
      security agencies seeking autonomous scientific discovery capability round out the potential
      buyer landscape.

      None of these segments has a disclosed relationship with Ineffable beyond the current
      investor/partner relationships. The segmentation table (TU001) maps these five segments
      against buyer/payer role, use case, scale potential, strategic value, and evidence gap.
      The customer journey map (FU001) illustrates conceptual adoption pathways across segments.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU013
