  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: no-commercial-customers
      missingEvidence: Any disclosed paying customer, pilot programme, letter of intent, or pre-commercial agreement with Ineffable Intelligence
      whyItMatters: The absence of any customer is the single most material finding of this chapter; it means the entire commercial thesis is unvalidated and all future revenue is speculative
      diligencePath: Direct inquiry to company; review any future public announcements; monitor Series A fundraising materials for customer references
      relatedQuestionRefs:
        - QU001
        - QU013

    - type: private-evidence-only
      severity: material
      topic: governance-gap
      missingEvidence: Full term sheet for UK government / Sovereign AI Fund investment showing governance conditions, IP rights, and any product access provisions
      whyItMatters: Without knowing the governance terms, it is impossible to assess whether any public-sector entity has customer-equivalent rights, a question that affects sovereign AI buyer segment sizing
      diligencePath: FOI request to DSIT; direct request to Sovereign AI Fund for public disclosure of conditions; review any future parliamentary debates or public accounts committee hearings
      relatedQuestionRefs:
        - QU016
        - QU021

    - type: missing-source
      severity: material
      topic: procurement-friction
      missingEvidence: Any letter of intent, expression of interest, or procurement contact from a science research organisation, pharma company, or enterprise R&D buyer
      whyItMatters: The science research segment is the highest-value prospective buyer; absence of any early signals increases the probability that commercialisation depends on unproven buyer interest
      diligencePath: Check Ineffable conference presentations and technical publications for any named research institution partnerships; review any forthcoming preprints that list institutional affiliations
      relatedQuestionRefs:
        - QU010

    - type: missing-source
      severity: material
      topic: concentration-risk
      missingEvidence: Duration and exit terms of the Google Cloud preferred-partner agreement and NVIDIA co-development arrangement
      whyItMatters: Concentration in a single cloud provider and single hardware vendor creates existential programme risk if either relationship changes; without knowing contract terms, risk cannot be quantified
      diligencePath: Request contract summary as part of Series A due diligence; obtain SLA terms and break clauses; request multi-cloud contingency plan from management
      relatedQuestionRefs:
        - QU017

    - type: missing-source
      severity: material
      topic: commercialisation-timeline
      missingEvidence: Any internal roadmap, investor materials, or management guidance on expected time to first commercial revenue
      whyItMatters: Without a commercialisation timeline, it is impossible to model when capital returns might begin, making the investment thesis dependent on pure speculation about research breakthrough timing
      diligencePath: Request Series A investor deck; attend any future public technical presentations; review any statements to institutional investors about revenue expectations

