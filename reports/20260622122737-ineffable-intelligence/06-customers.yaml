callouts:
  - calloutType: risk
    title: Zero Commercial Customers — A Fundamental Diligence Gap
    body: |
      Ineffable Intelligence has no paying customers and no revenue as of 22 June 2026. This is not
      an evidence gap that additional research could close — it is a confirmed fact. The company has
      neither launched a product nor announced any commercial engagement. Customer concentration risk
      is therefore absolute: any future customer failure would represent 100% customer loss. Every
      claim to investor returns and commercial value creation depends on a chain of events —
      research breakthrough, product creation, customer acquisition — none of which has begun.
    claimRefs:
      - CU001
      - CU002
      - CU016

  - calloutType: risk
    title: Partners and Investors Are Not Customers — Distinction Is Material
    body: |
      NVIDIA, Google Cloud, and the UK Sovereign AI Fund are often cited in press coverage alongside
      language implying commercial traction. This chapter finds the distinction critical: NVIDIA is
      a supplier and co-development partner; Google Cloud is an infrastructure provider to whom
      Ineffable pays for compute; the Sovereign AI Fund and British Business Bank are equity investors.
      None of these relationships involves Ineffable selling a product or service to a paying customer.
      Treating partner or investor commitments as customer proof in a due-diligence context would
      materially misstate commercial readiness.
    claimRefs:
      - CU017
      - CU018
      - CU019
      - CU036

  - calloutType: risk
    title: Governance Gap — Public Money May Not Secure Customer-Equivalent Rights
    body: |
      The newspage.news article published in April 2026 cited multiple independent AI consultants
      and governance experts who argued that the UK government's small equity stake does not buy
      sovereignty over the technology's outputs or governance over how discoveries are used and
      commercialised. Katrina Young (KYC Digital) stated the public stake is "participation, not
      sovereignty" and that governance conditions are absent. Rohit Parmar-Mistry (Pattrn Data)
      characterised the arrangement as "ceremonial association." The governance gap is a material
      customer risk: if the technology succeeds, the entity that funded the initial risk-de-risking
      phase may have no customer-equivalent rights to access, license, or govern the output.
    claimRefs:
      - CU011
      - CU012
      - CU027
      - CU041

  - calloutType: insight
    title: Talent Demand as a Proxy for Research Seriousness
    body: |
      In the absence of customer metrics, active hiring is the most direct publicly observable
      signal of programme seriousness. Ineffable Intelligence's open roles confirm ongoing
      investment in research engineering and ML science, consistent with an active research
      programme. Critically, no sales, customer success, or account management roles are visible
