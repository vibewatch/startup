        - Blocking — no customer base exists to expand into; no reference customer for procurement
        - Inability to demonstrate adoption curve to future investors or acquire next-tier buyers
        - Prioritise securing one anchor customer (sovereign lab or science research org) in next 18 months
    notes: Risk levels are analyst-assessed based on public disclosure and comparable frontier AI research company dynamics. No operational data is available for validation. All diligence paths reflect minimum requirements before a growth-stage investment commitment.
