callouts:
  - calloutType: strength
    title: Exceptional founder-market fit
    body: >
      David Silver has spent nearly two decades producing the field's most consequential RL
      demonstrations — AlphaGo, AlphaZero, AlphaProof. There is arguably no researcher on Earth
      with stronger personal credibility to pursue an RL-centric superintelligence mission. The
      depth of technical bench, if the secondary-reported co-founders are confirmed, adds further
      signal.
    claimRefs:
      - CO009
      - CO010
      - CO011
      - CO012

  - calloutType: risk
    title: Governance and sovereignty gap
    body: >
      The UK government invested public money alongside dominant US venture capital but received
      no publicly disclosed structural protections — no IP-anchoring conditions, no enforceable
      UK-use requirements, and no clear regulatory oversight mechanism. Commentators argue this
      positions the UK as a reputational co-investor rather than a genuine sovereign AI backer.
      If Ineffable's superlearner produces strategically significant breakthroughs, the benefits
      and control may flow primarily to US investors and US cloud providers.
    claimRefs:
      - CO025
      - CO040
      - CO041
      - CO042

  - calloutType: risk
    title: Pre-revenue research lab with billion-dollar price tag
    body: >
      At $5.1 billion post-money with zero revenue, zero customers, and a stated intent to avoid
      near-term products, investors are pricing exclusively on the founder's track record and the
      plausibility of the RL thesis. If the research program takes longer than anticipated or does
      not produce systems that can be commercialized, the path to returns at this entry valuation
      is unclear.
    claimRefs:
      - CO020
      - CO043
      - CO044

  - calloutType: insight
    title: Infrastructure partnerships de-risk compute bottleneck
    body: >
      Frontier RL at superlearner scale requires enormously expensive infrastructure — continuous
      generate-evaluate-update loops that are qualitatively different from pretraining on static
      datasets. The NVIDIA and Google Cloud partnerships, secured within 60 days of emergence from
      stealth, effectively de-risk the compute bottleneck that would otherwise be the largest
      near-term execution risk.
    claimRefs:
      - CO033
      - CO034
      - CO036
      - CO037

