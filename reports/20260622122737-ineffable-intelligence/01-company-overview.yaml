  - id: partnerships-milestones
    title: Partnerships, Infrastructure, and Milestones
    body: |
      In the weeks following its seed round announcement, Ineffable has moved rapidly to establish
      the compute infrastructure required for frontier reinforcement learning. Two major infrastructure
      partnerships have been publicly announced.

      On 13 May 2026, Ineffable and NVIDIA announced an engineering-level collaboration to build the
      reinforcement learning pipeline required to operate superlearner systems at scale. Engineers
      from both companies are co-designing the training infrastructure, initially on NVIDIA Grace
      Blackwell hardware and with plans to be among the first to explore the Vera Rubin platform.
      Jensen Huang quoted: "We are thrilled to partner with Ineffable Intelligence to codesign the
      infrastructure for large-scale reinforcement learning as they push the frontier of AI and
      pioneer a new generation of intelligent systems." NVIDIA had already participated in the seed
      round, making this both an investor and a deep engineering partner.

      On 16 June 2026, Ineffable and Google Cloud announced a strategic partnership at Google Cloud
      Summit London '26. Under the agreement, Google Cloud is Ineffable's preferred cloud provider,
      deploying one of the largest clusters of A5X powered by NVIDIA Vera Rubin NVL72. The
      partnership specifically cites Google Cloud's AI Hypercomputer architecture — a systems-level
      integration of GPU, networking, and storage — as the differentiator over standard GPU-renting.
      David Silver stated: "We chose Google Cloud as the best fit for our reinforcement learning
      infrastructure. We aren't just looking for processors; we are building a resilient and scalable
      environment to make 'first contact' with superintelligence." Google Cloud CEO Thomas Kurian
      issued a reciprocal statement of honor at the selection. Google had also participated as an
      investor in the seed round.

      Together these milestones indicate that Ineffable has secured the two critical non-capital
      inputs for its research program — computational infrastructure and engineering talent — within
      60 days of emerging from stealth. The company's UCL affiliation and its positioning as a
      London-based AI anchor are also cited by UCL in the context of London's growing AI ecosystem.
