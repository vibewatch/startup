  - id: founders-leadership-governance
    title: Founders, Leadership, and Governance
    body: |
      David Silver is CEO and Founder of Ineffable Intelligence. He was formerly Vice President of
      Reinforcement Learning at Google DeepMind, where he spent approximately two decades before
      founding Ineffable. He is a Professor of Computer Science at University College London (UCL)
      and is widely regarded as one of the most consequential AI researchers of the past decade.
      His portfolio at DeepMind included being the principal architect or a lead contributor on
      AlphaGo, AlphaZero, AlphaStar, AlphaFold, and AlphaProof — programs that represent the most
      prominent demonstrations of reinforcement learning and game-solving AI in history. AlphaGo
      defeated 18-time world Go champion Lee Sedol 4-1 in March 2016, a match watched by more than
      200 million people. Silver was appointed as a director of the legal entity on 16 January 2026.
      His founder-market fit for an RL-centric superintelligence lab is exceptionally strong: he has
      two decades of published, peer-reviewed results in exactly the domain Ineffable is pursuing.

      Sesamers (citing tech.eu) reports three further founding team members who are also ex-DeepMind
      alumni: Wojciech Czarnecki, Lasse Espeholt, and Junhyuk Oh — all described as having spent the
      past decade at the frontier of reinforcement learning research. These individuals do not appear
      in the Companies House officer record as directors, but their inclusion in Sesamers' account
      is consistent with Silver's own note that Ineffable's team would be assembled from "exceptional
      individuals dedicated to this mission alone." This information should be treated as
      secondary-source reported with medium confidence pending official disclosure.

      Governance formalized rapidly at the close of the seed round. Alfred Lin — a Sequoia Capital
      partner whose address is listed as 2800 Sand Hill Road, Menlo Park — was appointed director on
      17 April 2026. Ravi Mhatre, whose address is listed at 2200 Sand Hill Road, Menlo Park (the
      Lightspeed address), was also appointed director on 17 April 2026. George Samuel Rose, a
      Canadian national resident in Canada, is also listed as a director in the Companies House
      record. Oakwood Corporate Secretary Limited was appointed as company secretary on incorporation.
      The presence of Sequoia and Lightspeed partners on the board of directors as of day one of
      the seed round is consistent with co-lead investor board representation. Key-person dependence
      is heavily concentrated on Silver, who drives the scientific vision, external messaging, capital
      formation narrative, and strategic partnership announcements. The secondary founding team, if
      confirmed, would reduce but not eliminate this concentration.
