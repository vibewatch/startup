  - id: adverse-governance-concerns
    title: Adverse Signals and Governance Concerns
    body: |
      The primary adverse signal in the public record is not operational but structural: a cluster
      of governance and sovereignty concerns raised by AI industry commentators in response to the
      UK government's minority co-investment alongside dominant US venture capital.

      Newspage.news (30 April 2026) published commentary from two AI consultants. Rohit Parmar-Mistry
      (Pattrn Data) argued that "public money at seed stage should buy more than a press release
      and a minority stake" and that government participation without governance rights, transparency
      on downstream use, or credible safeguards "helps de-risk the upside while private investors
      capture the strategic value." Katrina Young (KYC Digital) described the UK government's
      participation as roughly one percent influence over systems that could generate strategically
      significant knowledge, warning that "sovereignty is not achieved through presence on a cap
      table — it is secured through control, leverage and accountability."

      Electronics Weekly (28 April 2026) similarly observed that as part of its investment, the UK
      government receives a London address, a small equity stake, and first refusal on the next
      round — but no structural guarantee that Ineffable's discoveries, IP, or commercial value
      remain in the UK.

      No lawsuits, regulatory investigations, leadership disputes, sanctions, or product recalls
      were found in the retained evidence as of the run date. The company is less than eight months
      old, which limits the surface area for adverse events. The governance concerns are material
      to long-run public benefit and UK AI sovereignty framing but do not currently represent an
      operational or legal risk to the company itself. Diligence should verify what governance
      rights, if any, the public co-investors actually hold; the Sovereign AI Fund described its
      investment terms as commercially sensitive.
    claimRefs:
      - CO040
      - CO041
      - CO042
      - CO043
      - CO025

