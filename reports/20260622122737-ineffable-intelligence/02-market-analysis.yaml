company:
  name: Ineffable Intelligence
chapter:
  number: 2
  title: Market Analysis
  summary: |
    Ineffable Intelligence does not map to a single established market: the relevant addressable
    universe spans frontier AI training infrastructure (NVIDIA data-centre revenue running at
    ~$157 billion annualised in Q1 FY2026), AI-for-science applications where reinforcement
    learning has demonstrated transformative impact, and sovereign/state-backed AI capacity in
    the UK and EU. Buyer concentration is extreme — perhaps five hyperscalers and a handful of
    sovereign programs control the credible near-term payer pool — while EU AI Act GPAI
    obligations, US export controls on AI chips, and the absence of a proven commercial pathway
    for superlearner systems at scale create material adoption constraints alongside the
    structural demand tailwinds.

sections:
  - id: market-boundary
    title: Market Boundary, Included Spend, and Substitutes
    body: |
      Defining the addressable market for Ineffable Intelligence requires careful boundary work
      because the company is pursuing a capability — autonomous reinforcement learning to
      superintelligence — rather than a product in an established product category. Three
      overlapping lenses are most analytically useful: (1) frontier AI training infrastructure,
      the hardware, software, and compute orchestration used to train the world's most advanced
      AI systems; (2) AI-for-science and knowledge-discovery applications, where RL and related
      deep learning methods are displacing traditional scientific simulation and human-expert
      workflows; and (3) sovereign and strategic AI capacity, where UK, EU, and allied governments
      are actively funding frontier AI capability as a matter of national security and industrial
      policy.

      Excluded from the addressable market — absent a commercial product — are: (a) general AI
      applications such as enterprise chatbots, recommendation engines, and NLP-as-a-service,
      which are downstream consumers, not buyers; (b) AI hardware as a commodity (NVIDIA chips
      are an input cost for Ineffable, not the market it sells to); and (c) AI software
      subscriptions targeting SME or consumer buyers. Superficially large "global AI market"
      figures cited by analysts — ranging from $200 billion to $1+ trillion depending on
      methodology — conflate these excluded categories and must not be adopted as Ineffable's TAM
      without boundary logic.

      Status-quo substitutes for what Ineffable proposes include: large language models trained
      on human-curated data (the dominant supervised-learning paradigm); human scientific
      experts and domain-specific simulation software (in AI-for-science contexts); and the
      internal research programmes of hyperscalers and frontier labs such as Google DeepMind,
      OpenAI, and Anthropic, which are simultaneously the most likely early partners/buyers and
      the most capable incumbents. RL-only pipeline incumbents are few; David Silver's team was
      among the world's most prominent at DeepMind, so the substitution threat is largely from
      internal capability rather than external vendors.
