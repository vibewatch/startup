figures:
  - id: FM001
    title: "Market Sizing Pyramid — TAM to Near-Term Opportunity"
    type: pyramid
    layout: standard
    summary: >
      Three-layer sizing framework from the broad AI compute infrastructure market down
      to Ineffable's credible near-term opportunity, with all values evidence-constrained.
    data:
      items:
        - label: "TAM: Global AI Training + Inference Infrastructure"
          value: "~$157B+ annualised"
          note: "NVIDIA data-centre revenue Q1 FY2026 annualised; full market larger (AMD, TPUs, custom silicon)"
        - label: "SAM: Frontier RL + Sovereign AI + AI-for-Science"
          value: "~$20–50B estimated"
          note: "Rough slice: sovereign programs + hyperscaler frontier research + AI-science R&D budgets; not directly sourced"
        - label: "SOM: Labs at Frontier RL — Pre-Revenue Phase"
          value: "<$5B near-term"
          note: "Constrained by number of credible payers (5 hyperscalers + handful of sovereign programs); Ineffable has $1.1B raised"
        - label: "Current Commitment (Ineffable seed)"
          value: "$1.1B raised at $5.1B valuation"
          note: "Entire seed deployed as compute + research; no revenue contribution"
    approximationNotes: >
      TAM figure derived from NVIDIA Q1 FY2026 data-centre revenue ($39.1B) annualised; excludes
      non-NVIDIA compute and inference underweights training-specific spend. SAM is a diligence-team
      estimate with no independent source; range ($20–50B) reflects uncertainty in sovereign program
      budgets and hyperscaler RL allocations. SOM is not directly measurable pre-revenue.
