  - id: buyer-segmentation
    title: Buyer, User, and Payer Segmentation
    body: |
      Ineffable's buyer landscape differs sharply from a standard B2B SaaS market because the
      company has no product, no customers, and no revenue as of the run date. The relevant
      segmentation is therefore prospective: who would fund or adopt superlearner systems if
      Ineffable makes technical progress?

      Tier 1 — Hyperscalers and Cloud Providers. Google, Microsoft, Amazon, and Meta collectively
      control the world's largest AI training clusters and are the primary builders of frontier AI
      models. Google Cloud has already established a preferred-provider relationship with
      Ineffable, which positions it as both infrastructure partner and prospective buyer of RL
      capabilities. NVIDIA, as an equity investor and engineering co-designer, similarly occupies
      a unique dual role. These organisations have the budget (capex in the tens of billions per
      year each), the technical sophistication to integrate superlearner systems, and the strategic
      incentive to acquire capabilities before competitors. The adoption trigger would be
      demonstrated progress in autonomous knowledge discovery at scale.

      Tier 2 — Sovereign and State-Backed Labs. The UK's British Business Bank ($20 million),
      Sovereign AI Fund, and the US National AI Research Resource (NAIRR) represent a distinct
      buyer tier where national strategic objectives, rather than commercial ROI, drive
      procurement. The EU's AI factories and EuroHPC programme are the European equivalents.
      NVIDIA's announcement at ISC 2026 of 35 new NVIDIA AI supercomputers across Europe,
      including JUPITER at Forschungszentrum Jülich, demonstrates that sovereign infrastructure
      investment is materialising at scale. For this buyer tier, the payer is a government
      programme or a public research institution, and the adoption trigger is geopolitical urgency
      and scientific ambition rather than near-term commercial return.

      Tier 3 — Frontier AI Labs. Other frontier labs (Anthropic, OpenAI, xAI, Mistral, etc.)
      are Ineffable's primary competitors; however, RL-specific capabilities developed by
      Ineffable could be licensed or collaboratively deployed rather than directly competed.
      These organisations have constrained compute budgets relative to hyperscalers and are
      unlikely to be payers at scale in the near term.

      Tier 4 — Scientific R&D Organisations. The success of AlphaFold — developed by Google
      DeepMind under David Silver's broader RL research umbrella — demonstrates that pharmaceutical
      companies, national laboratories, and genomics organisations represent a genuine demand
      signal for AI-for-science capabilities. These buyers operate on research grant timelines
      and are less price-sensitive to compute cost when the scientific value is transformative.
      However, the gap between Ineffable's superlearner thesis and an immediately deployable
      scientific tool is large; this buyer tier is medium-term at best.

      Enterprise R&D is a speculative long-term tier that requires both a product and a track
      record before procurement can begin.
