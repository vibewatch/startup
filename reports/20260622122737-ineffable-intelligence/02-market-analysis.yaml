callouts:
  - calloutType: risk
    title: "Buyer Concentration Creates a Bilateral Monopoly Risk"
    body: >
      The credible near-term payer pool for frontier RL training is extremely thin: approximately
      five hyperscalers and a handful of sovereign programs globally. This makes Ineffable almost
      entirely dependent on a small set of payers for commercial validation, and gives those payers
      significant leverage over contract terms, compute pricing, and IP access. A hyperscaler that
      is both infrastructure partner (Google Cloud) and equity investor (Google, NVIDIA) has
      structural incentives to shape Ineffable's research direction toward its own platform interests.
    claimRefs:
      - CM017
      - CM018
      - CM027
      - CM034

  - calloutType: assumption
    title: "AI-for-Science Is the Earliest Credible Revenue Adjacency"
    body: >
      Of the four buyer tiers, scientific R&D organisations represent the most tractable near-term
      commercial adjacency because (a) AlphaFold has already established willingness-to-pay for
      AI-driven scientific discovery, (b) scientific grants are available without a commercial
      product, and (c) the RL-for-science narrative aligns with David Silver's DeepMind legacy.
      However, bridging from the superlearner thesis to a specific deployable scientific tool
      requires a product pivot that is not currently signalled in Ineffable's public mission.
    claimRefs:
      - CM022
      - CM023
      - CM024
      - CM028

