  - id: market-sizing
    title: "Market Sizing: Multiple Lenses and Contradictory Estimates"
    body: |
      No single published figure cleanly measures the market Ineffable is entering. The analysis
      below applies three lenses with explicit methodology, contradictions preserved.

      Lens 1 — AI Compute Infrastructure (most directly relevant proxy). NVIDIA's data centre
      segment — the dominant revenue line for the world's leading GPU supplier to AI — generated
      $39.1 billion in Q1 FY2026 (the quarter ending 27 April 2025), up 73% year-on-year and
      10% sequentially. Annualised, that implies approximately $157 billion per year in NVIDIA
      data centre revenue alone, which itself understates total AI compute spend since it excludes
      AMD, Google TPUs, AWS Trainium, and custom silicon. This is the broadest indicator of
      compute spend including both training and inference across all buyer tiers, not only the
      frontier research that Ineffable addresses. NVIDIA guided Q2 FY2026 revenue (total) at
      approximately $45 billion, despite an ~$8 billion headwind from US export controls on the
      H20 product for China.

      Lens 2 — Investment/Capex Flows. Goldman Sachs Research forecast that global AI-related
      investment would approach $200 billion by 2025, with the US leading adoption by larger
      enterprises, particularly in information and professional/scientific services. Goldman Sachs
      also noted, importantly, that AI productivity impact is likely to be delayed to the second
      half of the current decade — a material constraint on enterprise ROI and therefore on the
      pace of discretionary AI spend beyond hyperscalers.

      Lens 3 — Frontier RL Training Compute (most targeted to Ineffable). Epoch AI's research
      documents that training compute for frontier AI models has grown 4–5x per year since 2010,
      with frontier models (top-10 by compute at release) growing at approximately 5x per year
      in recent years. Training a single frontier model now requires on the order of 10²⁴–10²⁵
      FLOPs of compute and costs between an estimated $50 million and several billion dollars
      per run. Critically, Epoch AI also notes that RL-heavy models such as AlphaGo and AlphaGo
      Zero are compute outliers — their training runs consumed far more compute than typical deep
      learning models of their era — implying that a pure RL superlearner could face training
      costs that sit above the trend line for conventional frontier models.

      Contradictory estimates: The broad AI market TAM cited in press releases ranges from
      Goldman Sachs' ~$200 billion investment flow to Statista's multi-hundred-billion dollar
      market outlook for 2030, with methodologies that are incomparable (spend vs. investment
      vs. revenue vs. economic impact). None isolates experiential RL training as a category.
      A specific SAM for superlearner systems cannot be independently sourced; the sizing analysis
      herein is constructed from proxies and should be treated as high-uncertainty estimation.
