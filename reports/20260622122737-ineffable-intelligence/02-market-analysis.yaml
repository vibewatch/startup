  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: sizing-methodological-gap
      missingEvidence: >
        No published analyst report directly sizes the 'frontier RL training' or 'superlearner
        systems' market as a distinct category; all available market figures are proxies that
        mix training + inference, supervised + RL, or infrastructure + applications.
      whyItMatters: >
        Without a directly comparable market size, the SAM and SOM in the pyramid figure are
        diligence-team constructions, not sourced numbers. Investors relying on market sizing
        to justify the $5.1B valuation have no independent market research to reference.
      diligencePath: >
        Commission independent analyst sizing of frontier RL training infrastructure as a
        category; alternatively, request NVIDIA's internal breakdown of RL vs. supervised
        training workloads by revenue contribution.
      relatedQuestionRefs:
        - QM026
        - QM027
      relatedTableRefs:
        - TM002

    - type: private-evidence-only
      severity: material
      topic: commercialisation-gap
      missingEvidence: >
        Ineffable's internal compute budget projections, Phase 1 training cost estimates,
        and any privately shared technology roadmap or milestone plan that would define the
        adoption timeline from research to commercial product.
      whyItMatters: >
        Without understanding the burn rate, milestone gates, and compute requirements for
        Phase 1, it is impossible to model the SOM or validate whether the $1.1B seed provides
        sufficient runway to the next financing event at which market validation would be
        expected.
      diligencePath: >
        Request Ineffable's internal compute budget model, Phase 1 milestone definitions,
        and projected run dates for first significant research output.
      relatedQuestionRefs:
        - QM015
        - QM017

    - type: conflicting-data
      severity: material
      topic: AI-market-sizing
      missingEvidence: >
        Published AI market estimates range from Goldman Sachs' $200B investment flow to
        Statista's multi-hundred-billion revenue outlook and NVIDIA's annualised $157B data-
        centre revenue; these cannot be summed or directly compared. No source segments RL
        from supervised workloads.
      whyItMatters: >
        Contradictory and incomparable market estimates make it impossible to triangulate
        a credible TAM for Ineffable's specific market without additional primary research.
        The risk is that investors anchor on the largest available number without applying
        boundary logic.
      diligencePath: >
        Cross-reference hyperscaler capex disclosures (Google, Microsoft, Amazon annual
        reports) to estimate frontier training compute spend as a fraction of total AI capex;
        triangulate with Epoch AI's per-model compute cost estimates to derive an aggregate
        annual spend on frontier training runs.
      relatedQuestionRefs:
        - QM018
        - QM003
      relatedTableRefs:
        - TM002

    - type: private-evidence-only
      severity: material
      topic: export-controls-constraint
      missingEvidence: >
        The contractual terms of Ineffable's Google Cloud preferred-provider agreement,
        including whether compute commitments are firm under export-control scenarios, and
        whether NVIDIA's engineering partnership provides priority hardware access that
        bypasses standard allocation queues.
      whyItMatters: >
        Export controls caused ~$7B in NVIDIA revenue disruption in a single quarter; if
        Ineffable's cluster access is not contractually protected, a future export control
        event could delay planned training runs by months or years, threatening milestone timelines.
      diligencePath: >
        Request the Google Cloud contract and NVIDIA engineering partnership terms,
        specifically covering compute allocation commitments, hardware delivery timelines,
        and force-majeure or supply-disruption provisions.
      relatedQuestionRefs:
        - QM011

    - type: missing-source
      severity: minor
      topic: RL-compute-constraint
      missingEvidence: >
        Peer-reviewed or independently verified estimate of the compute cost for a
        superlearner-scale RL training run (experiential learning, not game-playing RL);
        the AlphaGo outlier data from Epoch AI is the closest proxy but is a decade old.
      whyItMatters: >
        The compute cost for a superlearner training run determines whether Ineffable's $1.1B
        seed is sufficient for a meaningful Phase 1 run or only for infrastructure setup;
        this directly affects the timeline to any research milestone and the credibility of
        the adoption pathway.
      diligencePath: >
        Request Ineffable's internal compute cost projections; alternatively seek published
        estimates from AI safety researchers or compute economists who have modelled
