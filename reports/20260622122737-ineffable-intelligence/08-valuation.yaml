  - id: TV002
    title: Thesis / Anti-Thesis Table
    columns:
      - Thesis Pillar
      - Supporting Evidence
      - Anti-Thesis
      - Evidence That Would Change the View
    rows:
      - - Founder Quality
        - David Silver co-authored AlphaGo, AlphaZero, AlphaStar, AlphaProof — most consequential RL portfolio in history; Lightspeed cited this as primary investment rationale
        - Single key-person concentration; no co-founder named; no succession plan disclosed
        - Named co-founder or CTO of comparable RL stature; board succession plan disclosed
      - - Paradigm Uniqueness
        - No known comparable lab pursues data-free experiential RL at this capital scale; unique paradigm differentiation as of June 2026
        - Incumbents (DeepMind above all) can replicate within 12–36 months; published evidence of RL scaling limits in open-ended environments
        - "Peer-reviewed Ineffable publication demonstrating open-ended RL scaling beyond constrained environments"
      - - Capital Adequacy
        - "$1.1B largest European seed; Tier-1 Sequoia + Lightspeed; NVIDIA and Google Cloud as economic co-investors"
        - Frontier RL compute growing 2–5× annually; no burn rate disclosed; compute appetite may exhaust capital before milestone
        - Burn rate confirmed below $100M/yr with multi-year runway; or follow-on bridge announced at step-up
      - - Infrastructure Lock-in
        - NVIDIA Grace Blackwell and Vera Rubin co-design; Google Cloud AI Hypercomputer as preferred provider; both companies hold equity
        - Single-provider dependency on each; no secondary compute fallback; NVIDIA allocation not contractually guaranteed beyond disclosed terms
        - Multi-cloud or on-prem sovereign compute arrangement announced alongside primary partnership
      - - Sovereign / Policy Tailwind
        - "UK Sovereign AI Fund + British Business Bank co-investment; Secretary of State personal endorsement; AI policy 'pro-innovation' framework"
        - "Government's ~2% stake secures no IP rights, governance control, or enforceable claim on discoveries; critics note minority stake buys political association, not sovereignty"
        - Formal IP licensing, equity-for-discovery, or priority-access agreement between Ineffable and UK government
      - - Exit / Commercialisation Path
        - "Long-term AGI market addressable in $trillions; strategic acquisition optionality from NVIDIA, Google, or sovereign buyers"
        - No proximate exit path; no product roadmap; commercial proof 7–15 years out; no secondary market trades reported
        - First signed commercial contract or strategic LOI for $100M+ with a named counterparty
    notes: |
      Anti-thesis is based on public evidence available as of 22 June 2026. Each pillar is independently
      assessable; all six anti-thesis conditions are currently active. No pivoting evidence has been disclosed.
