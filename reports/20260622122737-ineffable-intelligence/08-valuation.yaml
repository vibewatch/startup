        - Any time
    notes: |
      Kill triggers are based on publicly monitorable events. Internal information (board minutes, safety
      reports, compute allocation agreements) would provide earlier warning but is not accessible. Urgency
      refers to time horizon within which the trigger becomes resolvable from public evidence, not probability.
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV028

  - id: TV006
    title: Final Diligence Asks Table
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
      - Priority
    rows:
      - - Financial burn rate and runway
        - Monthly burn rate; use-of-funds breakdown by category; runway estimate against the $1.1B raised
        - Without burn data it is impossible to assess whether capital provides sufficient runway to a demonstrable milestone or whether a near-term financing cliff exists
        - CFO; data room; board-approved budget; ask for 24-month cash projection
        - Critical
      - - Technical milestone definitions
        - Concrete, measurable, time-bound definitions of 'superlearner' research milestones with board-approved OKRs
        - Without milestones there is no underwriting basis for any scenario; the technical bet cannot be tracked
        - CEO; technical team; board minutes; investor update materials
        - Critical
      - - Cap table and preference structure
        - Full cap table; liquidation preference stack depth; anti-dilution provisions; pro-rata rights per investor
        - Seed investors' preference stack directly determines actual return in base and bear scenarios; depth is unknown
        - Legal counsel; term sheet; cap table management tool (e.g. Carta)
        - Critical
      - - Safety and alignment framework
        - Internal safety governance documents; red-teaming programme; any responsible scaling policy or equivalent; AI Safety Institute engagement status
        - Regulatory exposure (EU AI Act GPAI), reputational risk, and liability are unquantifiable without a safety framework
        - CEO; CISO; external safety review; UK AI Safety Institute engagement documentation
        - Critical
      - - IP rights and sovereign governance
        - Precise contractual scope of IP rights held by UK Sovereign AI Fund and British Business Bank; any exclusivity, priority access, or royalty provisions
        - Sovereign AI tailwind thesis requires substance; absent formal rights the government position is reputational only and subject to reversal
        - Lawyers; government funding agreement; Sovereign AI UK term sheet; BBB investment agreement
        - High
    notes: |
      All five topics are blocking evidence gaps: conviction underwriting of any future round position requires
      resolution of each. None are addressable from public sources. All require direct management engagement
      or data-room access. Priority ratings are: Critical = cannot proceed without; High = significantly
      affects scenario probability weighting.
    claimRefs:
      - CV040

