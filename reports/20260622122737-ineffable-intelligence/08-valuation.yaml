  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financial-burn-rate
      missingEvidence: >
        Ineffable has not disclosed its monthly burn rate, runway estimate, or use-of-funds breakdown
        for the $1.1 billion seed round as of June 2026. No filed accounts, board-approved budget, or
        CFO disclosure has been made public.
      whyItMatters: >
        Without burn rate data, it is impossible to determine whether $1.1 billion provides sufficient
        runway to a demonstrable technical milestone or whether the company faces an early financing cliff
        before proof exists.
      diligencePath: >
        Request burn rate and 24-month cash projection in data room; review board-approved budget;
        interview CFO or equivalent financial officer.
      relatedQuestionRefs:
        - QV021

    - type: enumeration-incomplete
      severity: material
      topic: comparable-valuation
      missingEvidence: >
        No publicly disclosed comparable exists for a pure-research AI lab at seed stage with zero revenue
        and a $5 billion-plus valuation. All named comparables in TV004 had deployed commercial products
        and revenue at the time of their cited valuation round.
      whyItMatters: >
        The absence of a true like-for-like pre-revenue comparable means the valuation analysis can only
        benchmark by mission and stage approximation, not by revenue multiple or product traction, which
        weakens any conviction-level valuation anchor.
      diligencePath: >
        Review private market databases (PitchBook, CB Insights, FactSet) for any pre-revenue AI research
        lab that raised at seed stage at a valuation exceeding $1 billion; engage comparable-company
        analysis advisors specialising in frontier technology transactions.
      relatedTableRefs:
        - TV004

    - type: missing-source
      severity: material
      topic: ai-lab-failure-rate
      missingEvidence: >
        No comprehensive public study or data set tracks the historical failure, pivot, or write-down rate
        for AI research labs that raised more than $500 million at seed stage and failed to achieve
        commercial proof within a ten-year window.
      whyItMatters: >
        Without a base rate, probability estimates for bear-case scenarios rely entirely on qualitative
        judgment rather than statistical backing, reducing conviction in scenario probability weightings
        and making it difficult to anchor risk-adjusted return calculations.
      diligencePath: >
        Commission or procure a private market analysis from PitchBook or CB Insights on outcomes
        of large pre-commercial AI lab funding rounds in 2020–2026; include outcome data for Inflection AI,
        DeepMind pre-Alphabet, and other research-to-product transition cases.
      relatedQuestionRefs:
        - QV032
