  - id: bull-base-bear-scenarios
    title: Bull, Base, and Bear Scenarios
    body: |
      Scenario planning for Ineffable requires milestone-based underwriting rather than revenue projections,
      because no revenue trajectory is discernible from public evidence. All three scenarios below are anchored
      to observable technical and commercial triggers, not to speculative revenue line items.

      The bull case assumes David Silver publishes a verifiable RL milestone demonstrating open-ended
      environment scaling by 2027–2028, Ineffable secures its first sovereign or enterprise commercial contract
      by 2028–2029, and a Series B closes at 2× or more the seed valuation. Under this scenario, the value
      creation path runs from licensing and API revenues beginning approximately 2029 through to strategic
      acquisition or IPO candidacy by 2032. The implied enterprise value range is $30–75 billion. This scenario
      requires sequential independent wins — technical milestone, then commercial proof, then financing
      milestone — each conditional on the prior. Probability is low to medium. The primary sensitivity driver
      is the scale and credibility of the published RL milestone.

      The base case assumes research progress is visible and credible by 2028, but commercial deployment is
      delayed to 2030–2031. The company raises one or two bridge rounds at modest valuation step-ups, and its
      initial commercial traction is in niche sovereign or science-licensing segments. The implied enterprise
      value range at a 2032 exit is $8–20 billion. This scenario is most consistent with the public evidence:
      technical progress without immediate commercialisation matches every frontier AI research lab's observed
      development pattern.

      The bear case assumes RL scaling plateau evidence emerges by 2027–2028 without Ineffable counter-evidence,
      Silver departs or pivots the company's direction, and capital is exhausted before commercial proof. Under
      this scenario, exit options collapse to fire sale, acqui-hire at below-seed valuation, or residual IP
      value only. The implied enterprise value range is $0.5–4 billion. This scenario becomes more probable
      if Ineffable produces no publicly verifiable milestone within 24–30 months of the seed close.

      The Stanford HAI AI Index (2025) documented that global private investment in AI exceeded $100 billion in
      2024, with frontier model investments comprising the dominant share — confirming the market environment in
      which Ineffable's seed was priced. Table TV003 maps all three scenarios against assumptions, value paths,
      and probability signals. Figure FV002 isolates the key sensitivity drivers. Figure FV003 charts the
      resulting enterprise value range across scenarios.
