  - id: thesis-break-triggers-and-final-diligence-asks
    title: Thesis-Break Triggers and Final Diligence Asks
    body: |
      Six thesis-break events would move the recommendation from watch to exit review or write-off before any
      planned monitoring review point. The most urgent is David Silver's departure from the CEO role without
      a disclosed and credible succession. The entire thesis is Silver: his departure — without a named successor
      of comparable stature — triggers immediate reassessment of all scenario probabilities. The second is
      confirmed RL scaling plateau in peer-reviewed publication or credible technical release, without Ineffable
      counter-evidence. This breaks the paradigm premise, moving the bear case from low-probability to base
      case. The third is material reduction or withdrawal of NVIDIA's Vera Rubin hardware allocation or
      termination of the Google Cloud partnership — either would delay the research timeline by years.

      The fourth thesis-break is a Series A at or below the $5.1 billion seed post-money valuation. A flat or
      down round signals that the market has de-rated capability claims, that milestone evidence was not
      sufficient to justify step-up, and that follow-on financing risk is elevated. The fifth is a safety
      governance failure — regulatory investigation, alignment incident, or adversarial testing failure
      attributed to Ineffable's system — which crystallises regulatory, reputational, and co-investor risks
      simultaneously. The sixth is a UK government clarification that its sovereign investment carries no IP
      rights, governance rights, or priority access to discoveries over foreign investors.

      Monitoring these triggers requires: standing watch on David Silver's public presence and Ineffable
      announcements; quarterly review of RL scaling literature on ArXiv and peer-reviewed venues; monitoring
      of NVIDIA and Google Cloud partnership press; and tracking any regulatory inquiry or safety incident
      attribution. Table TV005 defines each trigger with threshold, transmission path, and action implication.

      The final data room asks represent the minimum evidence required to move from watch to conditional
      underwriting of any position in a future round. They cover five blocking evidence gaps: burn rate and
      runway from the $1.1 billion seed; concrete technical milestone definitions approved by the board;
      full cap table and preference structure including liquidation preferences and anti-dilution; internal
      safety governance and alignment framework documents; and the precise scope of IP rights held by UK
      sovereign co-investors. None of these can be resolved from public sources. Table TV006 enumerates
      each ask with owner, path, and priority. Absent this data room access, any conviction position in
      Ineffable at this stage rests on signal alone.
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV028
      - CV037
      - CV040
      - CV042
      - CV044
