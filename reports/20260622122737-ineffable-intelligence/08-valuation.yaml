callouts:
  - calloutType: risk
    title: Key-Person Concentration Is the Single Greatest Investment Risk
    body: >
      David Silver's departure from the CEO role — without a named, credible successor of comparable RL stature
      — would constitute an immediate thesis-break event. Every dimension of Ineffable's investment thesis
      (paradigm uniqueness, research credibility, infrastructure partnerships, investor confidence) traces
      back to Silver's personal intellectual capital. Unlike conventional software businesses where a CEO
      transition is a governance event, at Ineffable it would be an existential event. No co-founder has been
      named, no succession plan disclosed, and no leadership team introduced. This is the single most
      monitorable risk in the thesis and should be a standing watch item from day one.
    claimRefs:
      - CV026
      - CV013
  - calloutType: recommendation
    title: Watch Position — Not a Buy
    body: >
      The combination of extraordinary founder quality and unprecedented capital formation with pre-revenue
      status, absent commercial proof, RL scaling uncertainty, and financial opacity produces a definitively
      watch rather than buy recommendation at the seed valuation. The extraordinary positive signals do not
      override the structural disqualifiers for a conviction lead position. The watch position requires
      specific milestone gates before re-evaluation: publication of an open-ended RL milestone, definition of
      measurable technical OKRs, and Series A pricing that validates or contradicts the $5.1B implied by the
      seed round.
    claimRefs:
      - CV031
      - CV032

