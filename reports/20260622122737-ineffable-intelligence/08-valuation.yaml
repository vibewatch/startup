  - id: comparable-set
    title: Comparable Set
    body: |
      Standard valuation methodologies — revenue multiple, EBITDA multiple, DCF — do not apply to Ineffable
      Intelligence because the company has no revenue, no disclosed financials, and no commercial timeline. The
      only available benchmarking frame is comparable private rounds from other frontier AI labs. Table TV004
      enumerates the primary comps, with all material limitations noted.

      OpenAI's $157 billion post-money valuation (October 2024) represents the upper bound of frontier AI lab
      pricing. However, OpenAI was generating approximately $4 billion in annualised revenue at the time — a
      critical distinction from Ineffable. The $157 billion valuation implies a roughly 39× revenue multiple,
      which is itself aggressive by historical technology benchmarks but is at least anchored to actual
      commercial traction. Ineffable has zero revenue, making the OpenAI comp usable only as a
      market-environment indicator, not as a direct pricing reference.

      Anthropic (~$60 billion, January 2025) and xAI (~$80 billion, March 2025) are both generating revenue
      from deployed products — Claude and Grok respectively — and neither raised at a comparable pre-revenue
      seed stage. Anthropic's safety-first mission creates a structural parallel to Ineffable's research
      orientation, but Anthropic had deployed commercial API products before its large valuation rounds.
      xAI is a for-profit entity with a deployed consumer product, as confirmed by its company page, which
      is a fundamentally different commercial posture to Ineffable's pure research lab.

      Mistral AI's approximately €6 billion (around $6.4 billion) valuation in June 2024 is the most relevant
      European frontier AI comparison. However, Mistral had already deployed Le Chat and was generating API
      revenue with a published pricing page at the time of its round, meaning its valuation per revenue dollar
      is lower than Ineffable's implied multiple. As a European lab with a publicly visible pricing structure
      and product, Mistral is a closer geographic comparable but a different business stage comparable.

      No publicly disclosed comparable exists for a pure-research AI lab at seed stage with zero revenue and
      a $5 billion-plus valuation. Ineffable's price sits in a tier established by US frontier labs that had
      deployed products. Whether this tier is justified for a pre-revenue lab depends entirely on whether the
      technical bet materialises and commercialisation follows — a judgment that cannot be made from public
      evidence today. Table TV004 and the accompanying enumeration scope document the limitations of this
      comparable set.
