      role: Founder and CEO
      background: Former VP of Reinforcement Learning at Google DeepMind and UCL Professor whose work helped produce AlphaGo, AlphaZero, AlphaStar, AlphaFold, and AlphaProof.
      claimRefs: [CO009, CO010, CO011, CO012]
  foundingLocation: London, United Kingdom
  headquarters: London, United Kingdom
  productSummary: A still-precommercial reinforcement-learning research platform and infrastructure stack designed to train “superlearners” that generate experience, evaluate outcomes, and continuously improve without relying on human data.
