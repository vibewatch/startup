companyProfile:
  summary: Ineffable Intelligence is a London-headquartered frontier AI startup founded by David Silver in late 2025 to build a reinforcement-learning “superlearner” capable of discovering knowledge from experience rather than training on human-generated data. The company launched publicly in April 2026 with a $1.1 billion seed round at a $5.1 billion post-money valuation, backed by Sequoia, Lightspeed, NVIDIA, Google, and UK public-sector investors. It remains a pre-revenue research lab with no disclosed customers, financial statements, safety framework, or commercial timeline, but it has quickly secured strategic infrastructure partnerships with NVIDIA and Google Cloud.
  foundedDate: '2025-11-19'
  founders:
