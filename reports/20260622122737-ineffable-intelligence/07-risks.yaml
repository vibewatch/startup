- id: operational-technical-safety-risk
  title: Operational, Technical, and Safety Risk
  body: 'The operational risk profile of Ineffable Intelligence is dominated by three interlocking

    concerns: compute fragility, RL scaling uncertainty, and the complete absence of safety

    and alignment governance.


    Compute fragility is the most immediately measurable operational risk. Ineffable''s entire

    training pipeline has been co-designed around NVIDIA''s Grace Blackwell and next-generation

    Vera Rubin NVL72 platform, to be deployed on Google Cloud''s AI Hypercomputer with A5X

    clusters. NVIDIA announced the Vera Rubin NVL72 in May 2026; production allocation

    timelines and capacity commitments to Ineffable specifically are not publicly disclosed.

    NVIDIA serves a large and growing queue of hyperscaler customers — Microsoft, Google,

    Meta, Amazon, and sovereign AI programmes worldwide — that may compete for capacity.

    No disclosed secondary compute arrangement exists. A material delay or reallocation would

    halt the research programme.


    Reinforcement learning at the scale and generality Ineffable requires is technically

    unproven in open-ended environments. Prior landmark RL achievements — AlphaGo, AlphaZero,

    AlphaStar — operated in bounded game environments with well-defined reward signals.

    Scaling these methods to open-world knowledge discovery introduces unsolved challenges:

    reward hacking (the system optimises the proxy reward rather than the intended goal),

    specification gaming (solving the literal specification rather than the spirit), and the

    simulation-to-real gap (skills learned in simulation failing to transfer). The academic

    literature documents these failure modes extensively, and Ineffable has not disclosed any

    mitigation methodology or evaluation framework. Technology Review has noted that RL

    scaling has hit walls in multiple research programmes.


    The safety and alignment risk is the most consequential for systemic risk. Ineffable''s

    stated goal is to "make first contact with superintelligence" — a system operating beyond

    human-level capability. As of 22 June 2026, the company has no publicly disclosed safety

    framework, no responsible scaling policy (RSP), no alignment research agenda, no

    red-teaming programme, and no safety leadership disclosed (no head of safety, safety

    board, or external safety advisory body). Unlike Anthropic, OpenAI, or Google DeepMind

    — all of which have published RSPs or equivalent safety commitments — Ineffable has made

    no comparable disclosure. This is not merely a governance gap; it is a pre-commercial

    gap that will become harder to close as capability advances. The Seoul Summit''s Frontier

    AI Safety Commitments, signed by major frontier labs, have not been publicly endorsed by

    Ineffable.


    Energy and infrastructure risk is material at superlearner scale. Frontier RL requires

    tight training-inference loops that are more energy-intensive per FLOP than standard

    pre-training workloads. Total power and cooling requirements are not disclosed.


    Cybersecurity risk is elevated. Ineffable''s model weights and training artefacts, once

    accumulated, represent extraordinarily valuable intellectual property. No cybersecurity

    posture, data residency policy, or incident response framework has been disclosed.

    '
