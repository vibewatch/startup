- id: mitigations-kill-criteria
  title: Mitigations, Monitoring Indicators, and Kill Criteria
  body: 'Each priority risk cluster has a distinct mitigation pathway, monitoring signal, and

    defined threshold that would, if crossed, constitute a thesis-break event requiring

    investor re-evaluation.


    On regulatory risk, the primary mitigation is proactive engagement with DSIT, AISI, and

    the ICO, and commissioning legal analysis of NSI Act shareholding limits and EU AI Act

    GPAI obligations before the next funding round. The monitoring signal is the UK AI

    Bill''s introduction to Parliament and the EU GPAI register''s publication; the

    thesis-break threshold is the enactment of binding compute or safety obligations that

    Ineffable cannot comply with without material restructuring of its training programme.


    On compute dependency, the mitigation is negotiating contractual allocation guarantees

    with NVIDIA and Google Cloud, and establishing at minimum a formal feasibility

    assessment of a secondary compute provider (Lambda Labs, CoreWeave, or AWS Trainium).

    The monitoring signal is NVIDIA''s public earnings call language on Vera Rubin NVL72

    ramp timelines; the thesis-break event is a confirmed delay of more than twelve months

    or explicit re-prioritisation of NVL72 capacity to another customer.


    On RL scaling uncertainty, the mitigation is defining and publishing a technical

    milestone roadmap with verifiable milestones (specific benchmark achievements,

    capability demonstrations) that can be independently assessed. The monitoring signal is

    peer-reviewed RL generalisation results from Ineffable and its frontier competitors;

    the thesis-break threshold is no demonstrated open-world RL generalisation improvement

    from any frontier source within thirty months of Ineffable''s training start, combined

    with no Ineffable counter-evidence.


    On key-person risk, the mitigation is appointment of at least a co-founder–equivalent

    scientific co-lead, a documented succession plan, and retention arrangements with

    senior researchers. The thesis-break event is David Silver''s departure from the CEO

    role for any reason.


    On next-round financing, the monitoring signal is the trajectory of frontier AI venture

    activity and Sequoia/Lightspeed portfolio company fundraising comps; the thesis-break

    event is an inability to close a Series A within thirty-six months of the seed at or

    above the $5.1 B valuation, or a confirmed runway below twelve months without committed

    follow-on.


    The consolidated kill-criteria and mitigation table (TR005) summarises all five risk

    clusters with their trigger events and recommended investor actions. The risk heatmap

    (FR001) maps all material risks by likelihood and severity. The transmission map (FR002)

    shows how primary risks propagate to revenue, valuation, and investor return outcomes.

    The dependency map (FR003) visualises the critical external dependencies that must be

    actively managed.

    '
