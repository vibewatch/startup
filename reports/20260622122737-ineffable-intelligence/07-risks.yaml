  evidenceGaps:
  - id: EGR001
    type: private-evidence-only
    severity: blocking
    missingEvidence: Monthly burn rate or ballpark compute cost per training run. Runway estimate relative
      to planned training programme scope. Auditor appointment confirmation.
    diligencePath: Require burn rate and use-of-funds breakdown in data room. Request management accounts
      and CFO appointment confirmation. Ask for compute cost estimate from NVIDIA.
    whyItMatters: No burn rate, use-of-funds, headcount, or management accounts have been disclosed. The
      adequacy of $1.1 B for a full training run cannot be assessed without at least an estimated monthly
      compute cost from the company's internal projections.
  - id: EGR002
    type: private-evidence-only
    severity: blocking
    missingEvidence: NVIDIA partnership agreement or at minimum a term sheet summary including allocation
      guarantee, pricing tier, and exclusivity status. Google Cloud SLA terms and any capacity commitments.
    diligencePath: Request full partnership agreements as part of data room review. Obtain legal opinion
      on whether exclusivity provisions exist or can be negotiated.
    whyItMatters: Commercial terms of NVIDIA and Google Cloud partnerships are entirely undisclosed. Allocation
      guarantees, exclusivity, pricing, SLA terms, and upgrade path obligations cannot be assessed without
      access to the actual partnership agreements.
  - id: EGR003
    type: missing-source
    severity: material
    missingEvidence: Draft RSP, head of safety appointment, AISI engagement record, or equivalent safety
      governance documentation.
    diligencePath: Require RSP or equivalent as Series A closing condition. Request head of safety appointment
      and AISI engagement confirmation before investment committee approval.
    whyItMatters: No safety framework, RSP, or alignment research programme has been disclosed. The absence
      cannot be confirmed as intentional policy versus in-progress drafting without direct company disclosure.
    relatedQuestionRefs:
    - QR031
  - id: EGR004
    type: private-evidence-only
    severity: material
    missingEvidence: Shareholder agreement terms for BBB and Sovereign AI Fund stakes; any IP covenant
      or public benefit covenant disclosure.
    diligencePath: Request shareholder agreement summary confirming governance rights held by government
      investors. Confirm whether any Golden Share or information right exists.
    whyItMatters: Governance rights attached to UK government (British Business Bank and Sovereign AI
      Fund) minority stakes are not publicly disclosed. Whether the government holds information rights,
      board observer rights, IP covenants, or public benefit enforcement rights is unknown.
    relatedQuestionRefs:
    - QR014
    relatedTableRefs:
    - TR001
  - id: EGR005
    type: missing-source
    severity: material
    missingEvidence: IP assignment deed between Silver, UCL, DeepMind, and Ineffable. Freedom-to-operate
      legal opinion covering core RL algorithms. UCL IP policy confirmation for Ineffable.
    diligencePath: Request IP assignment agreements and freedom-to-operate opinion in data room. Confirm
      UCL's IP claims are resolved before any licensing or commercialisation.
    whyItMatters: David Silver's IP assignment arrangements with UCL and Google DeepMind for algorithms
      developed during prior employment have not been publicly disclosed. Freedom-to-operate analysis
      on the core RL methods has not been published.
