- id: TR005
  title: Mitigation and Kill Criteria Table
  columns:
  - Risk
  - Monitoring Trigger / Signal
  - Thesis-Break Threshold / Kill Event
  - Recommended Action on Trigger
  rows:
  - - Compute concentration (NVIDIA / Google Cloud)
    - NVIDIA public earnings calls; Vera Rubin NVL72 production ramp language; NVIDIA customer priority
      announcements; quarterly check
    - NVIDIA confirms Vera Rubin NVL72 delay >12 months OR explicit re-prioritisation of allocation away
      from Ineffable; Ineffable has no alternative compute arrangement within 60 days
    - Escalate to board; require secondary compute fallback within 90 days as covenant condition; if unresolved,
      downgrade conviction
  - - RL scaling plateau
    - Peer-reviewed RL generalisation results from Ineffable and frontier competitors; academic literature
      on RL scaling laws; internal milestone disclosure (if any); arXiv / NeurIPS / ICML
    - No demonstrated open-world RL generalisation progress by any frontier source within 30 months of
      Ineffable training start AND no Ineffable milestone disclosure to contradict the trend
    - Downgrade thesis to speculative; require technical milestone disclosure within 6 months; commission
      independent RL expert assessment
  - - Safety / alignment governance absence
    - Publication of RSP or equivalent; head of safety appointment announcement; AISI engagement confirmation;
      Seoul Summit commitment signature
    - No RSP, no head of safety, and no AISI engagement documented within 12 months of Series A close;
      OR regulatory enforcement action initiated
    - Require safety governance package (RSP + safety leadership + AISI engagement) as a Series A closing
      condition; material adverse change if enforcement commences
  - - Key person — David Silver departure
    - LinkedIn/public activity; press coverage; Companies House director changes; monthly check on director
      register
    - Silver announces departure from CEO role, extended health absence, or moves to non-compete-covered
      competitor
    - Immediate thesis re-evaluation; convene special investor committee within 10 business days; hold
      further capital deployment pending succession plan
  - - Next-round financing risk
    - Monthly estimated runway (compute invoices + headcount costs); Sequoia / Lightspeed Series A signalling;
      frontier AI private market valuations
    - Runway falls below 12 months without committed Series A term sheet at ≥$4 B valuation; OR Sequoia
      or Lightspeed publicly declines to lead Series A
    - Thesis break; initiate bridge or secondary liquidity process; re-evaluate position at estimated
      mark-to-market
  notes: 'Kill criteria are investor-facing triggers, not legal obligations. All thresholds are defined
    from publicly available information and may need adjustment once the data room is opened and burn
    rate, commercial terms, and technical roadmap are disclosed. Monitoring indicators should be reviewed
    quarterly.

