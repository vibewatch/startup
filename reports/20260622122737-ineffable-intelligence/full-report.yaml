  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product, and Footprint
        blocks:
          - type: paragraph
            body: |
              Ineffable Intelligence Ltd (company number 16865241) was incorporated in England and Wales on
              19 November 2025 as a private limited company. Its registered office is at 3rd Floor, 1 Ashley
              Road, Altrincham, Cheshire, WA14 2DT — a professional-services address common among newly
              incorporated UK tech ventures — while its operating headquarters are in London, the location
              consistently cited in all investor, government, and news materials. The SIC code is 74909
              (Other professional, scientific and technical activities not elsewhere classified), reflecting
              the company's pre-revenue research posture. Its official website is https://www.ineffable.ai/.

              The company's stated mission is to "make first contact with superintelligence" by creating what
              it calls a "superlearner": an AI system capable of discovering all knowledge from its own
              experience, from elementary motor skills through to profound intellectual breakthroughs. The
              core technical wager is that superintelligence will be achieved through experiential learning
              rather than learning from human data, driven by the world's most powerful reinforcement learning
              (RL) algorithms. Unlike large language models, which are trained on internet-scale corpora,
              Ineffable's system would generate and evaluate its own experiences in real time, placing
              extraordinary demands on compute infrastructure in terms of interconnect, memory bandwidth, and
              tightly integrated training-inference loops. The company was launched publicly at the same time
              as its seed round announcement on 27 April 2026, having operated in stealth since incorporation.

              Ineffable has no disclosed product, revenue, or customer base as of the run date; it is
              operating in a pure research-and-infrastructure phase, which is consistent with both the funding
              structure and the mission language on the site. The company self-describes as planning a window
              of time in which "ambitious research can thrive, without bending to the demands of incremental
              products and near-term profits" — a deliberate departure from the standard VC-backed product
              roadmap. All publicly available evidence positions it as a frontier AI research lab whose near-term
              output is expected to be scientific breakthroughs, not commercial products.
