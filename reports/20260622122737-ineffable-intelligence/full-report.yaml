      - number: '4.2'
        title: Cost Structure and Capital Intensity
        blocks:
          - type: paragraph
            body: |
              Ineffable's cost structure at this stage is almost entirely research and infrastructure costs.
              No cost of goods sold (COGS), gross margin, or operating leverage data is publicly available;
              the company has no revenue against which to measure cost ratios.

              The dominant cost driver is compute. Reinforcement learning workloads, unlike standard
              transformer pretraining, require tightly integrated training-inference loops that "put pressure
              on interconnect, memory bandwidth and serving in ways that pretraining doesn't," according to
              the co-authored NVIDIA-Ineffable blog post. The system must act, observe, score, and update
              continuously — placing orders-of-magnitude higher demands on cluster-level orchestration
              compared with static dataset pretraining. This compute intensity is the most material financial
              constraint on the company: Epoch AI analysis (2025) shows that frontier model training costs
              have grown at 2.4x per year since 2016, that hardware accounts for 47–67% of frontier model
              development cost, R&D staff for 29–49%, and energy for 2–6%. Epoch AI projects that the
              largest training runs will cost more than $1 billion by 2027 if this trend continues.

              Both the Google Cloud and NVIDIA partnerships materially mitigate this cost pressure. Google
              Cloud, as Ineffable's preferred cloud provider, is deploying one of the largest A5X clusters
              powered by NVIDIA Vera Rubin NVL72 — infrastructure that Ineffable does not finance through
              direct capital expenditure under a standard cloud-procurement model. NVIDIA's co-design
              partnership provides engineering resources and hardware access that would otherwise require
              direct procurement. Together these partnerships convert what would be substantial capital
              expenditure (or cloud rental spend in the hundreds of millions of dollars annually for a
              frontier-scale cluster) into a more flexible cost structure tied to the partnership commercial
              terms — details of which are not publicly disclosed. Arxiv research (2022) found that large-
              scale ML models required 10-100× more compute than standard deep learning, and that training
              compute has doubled approximately every 6 months during the deep learning era, making the cost
              trajectory a long-run structural risk rather than a static cost item.

              R&D staff represent the second major cost category. Ineffable adopted an employee share option
              plan (with a US sub-plan) on 5 February 2026, signalling an intent to recruit and retain at
              competitive equity-compensation rates. Share-based compensation will accrue as a non-cash
              charge under IFRS 2 or equivalent, adding a future cost line even before cash headcount
              expenses. No disclosed headcount figure is available; the company has not filed any accounts.
              The capital intensity and cash-flow map (FI004) sketches the structural cost flows given these
              constraints.
