      revenue, cost, or financing data. The bear case overlaps the seed valuation ($5.1B base case lower bound),
      indicating the realistic possibility of zero return or negative outcome for seed investors after dilution and
      preference.
    approximationNotes: >
      Values are scenario estimates derived from milestone-based underwriting and comparable frontier AI lab analogues.
      Not financial forecasts. All figures are pre-dilution and do not account for preference stacks, which are
      undisclosed and could materially affect investor-level returns.
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV024
    data:
      items:
        - label: Bull Case (2032)
          low: 30
          mid: 52
          high: 75
          unit: $B enterprise value
          note: 'Requires: technical milestone by 2028, first contract by 2029, Series B ≥2× seed, IPO/acquisition candidate'
        - label: Base Case (2032)
          low: 8
          mid: 14
          high: 20
          unit: $B enterprise value
          note: 'Assumes: research progress 2028, commercialisation 2030–31, niche licensing, structured exit'
        - label: Bear Case (2032)
          low: 0.5
          mid: 2
          high: 4
          unit: $B enterprise value
          note: 'Assumes: RL plateau or Silver departure, capital exhaustion, fire sale or acqui-hire'
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >
      IC-ready scoring of Ineffable Intelligence across eight investment dimensions, each scored on a 1–10 scale based
      on publicly available evidence as of 22 June 2026. High scores in market scale and founder quality are overwhelmed
      by very low scores in commercial proof and governance, producing an overall watch-level conviction. No score is
      based on private or non-public information.
    claimRefs:
      - CV013
      - CV022
      - CV039
    data:
      items:
        - label: Market Scale
          value: 9/10
          note: Frontier AI TAM potentially $trillions; Ineffable in highest-value research-to-product segment
        - label: Founder Quality
          value: 10/10
          note: 'David Silver: AlphaGo/AlphaZero/AlphaProof; arguably world''s foremost RL researcher'
        - label: Technical Paradigm
          value: 7/10
          note: Novel data-free RL paradigm is genuinely unique; unproven at scale; incumbents can replicate in 12–36 months
        - label: Commercial Proof
          value: 1/10
          note: Zero customers, zero revenue, no product, no roadmap — lowest possible score on commercial traction
        - label: Capital Structure
          value: 7/10
          note: Tier-1 Sequoia + Lightspeed; NVIDIA + Google co-invest; no burn rate disclosed reduces to 7/10
        - label: Competitive Moat
          value: 5/10
          note: Paradigm unique now; fast-follower window open; no distribution, product, or customer lock-in
        - label: Governance and Risk
          value: 3/10
          note: Key-person; no safety framework; no IP lock; regulatory exposure unaddressed; financial opacity
        - label: Valuation vs Evidence
          value: 4/10
          note: $5.1B at seed is largest European ever; US frontier AI tier precedent-consistent; no revenue anchor
