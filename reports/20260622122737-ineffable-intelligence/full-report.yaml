      - - 'Paradigm leadership: only lab pursuing data-free experiential RL at scale'
        - >-
          Google DeepMind or OpenAI redirects resources to the same paradigm; first-mover advantage erodes within 12–36
          months
        - High
        - >-
          DeepMind produced AlphaGo/AlphaZero under Silver; retains RL talent; has superior compute. OpenAI pivoted to
          RL-based reasoning (o1) within ~24 months of observing commercial viability.
        - >-
          Define and publish milestones that demonstrate progress before incumbents can close the gap; secure IP
          protections on key algorithmic innovations; monitor DeepMind RL publication cadence
      - - 'Founder pedigree: David Silver is the world''s most cited active RL researcher'
        - Key-person departure, incapacity, or departure of secondary founding team; concentration in one individual
        - Critical
        - >-
          All external messaging, strategic partnerships, and scientific credibility flow through Silver. Secondary
          founders (Czarnecki, Espeholt, Oh) are secondary-source reported only, not yet confirmed in official filings.
        - >-
          Confirm and disclose full founding team composition; establish succession and redundancy in scientific
          leadership; negotiate IP vesting terms that align incentives long-term
      - - Compute access via Google Cloud preferred-provider partnership
        - >-
          Export controls, supply disruption, or Google Cloud strategic de-prioritisation; lack of contract
          enforceability under force-majeure scenarios
        - Material
        - >-
          NVIDIA H20 export controls caused $4.5 B charge in a single NVIDIA quarter; Ineffable's cluster relies on
          NVIDIA Vera Rubin hardware procured via Google Cloud — subject to same geopolitical supply chain risks.
        - >-
          Obtain and review full Google Cloud contract terms including compute allocation commitments, hardware delivery
          guarantees, and force-majeure provisions; explore multi-cloud optionality
      - - 'UK sovereign AI positioning: British Business Bank + Sovereign AI Fund minority co-investor'
        - >-
          UK government minority stake provides no enforceable IP-anchoring or sovereignty conditions; breakthrough IP
          may flow to US investors who control the board
        - Material
        - >-
          Newspage.news commentary and cited experts explicitly question whether UK public capital achieves stated
          sovereign objectives given governance structure. US VC board control (Sequoia, Lightspeed) could override UK
          strategic interests.
        - >-
          Request and review Ineffable's investor rights agreement and board governance documents to assess whether UK
          government stake carries any IP-lock, veto rights, or sovereignty conditions; escalate as diligence blocker if
          none present
      - - First-mover advantage in experiential RL infrastructure co-design (NVIDIA partnership)
        - >-
          NVIDIA provides equivalent co-design support to other frontier labs (OpenAI, Google DeepMind); engineering
          partnership is not exclusive
        - Moderate
        - >-
          NVIDIA's blog post describes co-designing RL pipeline for Ineffable, but NVIDIA is also a partner and investor
          in OpenAI and a major supplier to DeepMind and xAI. No exclusivity has been disclosed.
        - >-
          Confirm whether the NVIDIA Ineffable co-design partnership includes any exclusive period or preferential
          access; clarify whether Vera Rubin NVL72 cluster access is exclusive or shared with other NVIDIA clients
      - - 'Talent concentration: team of ex-DeepMind RL experts with a decade of frontier RL research'
