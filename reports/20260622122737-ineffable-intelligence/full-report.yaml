      - number: '6.4'
        title: Retention, Durability, and Satisfaction — A Pre-Commercial Void
        blocks:
          - type: paragraph
            body: |
              Net revenue retention, gross revenue retention, customer churn, contract renewal rates, cohort
              retention, customer satisfaction scores, and NPS data do not exist for Ineffable Intelligence
              because no commercial product has generated revenue and no customers have been acquired. All
              standard retention and durability metrics are inapplicable at this stage.

              The retention question for this stage of company must instead be addressed through structural
              durability proxies: the stickiness of the research partnership model, the longevity of the
              Sovereign AI Fund's commitment, and the lock-in implied by Ineffable's multi-year infrastructure
              commitment to Google Cloud. The infrastructure partnership with Google Cloud and the co-design
              relationship with NVIDIA both imply medium-term operational continuity for the research
              programme, but these are not customer retention metrics — they are supply-side commitments.

              The talent market provides one indirect signal of durability: job listings confirm that Ineffable
              continues to hire senior researchers and engineers. The company's ability to attract researchers
              from Google DeepMind and other frontier labs is a proxy indicator that the research programme
              retains credibility within the technical community. However, no customer satisfaction survey,
              Net Promoter Score, review platform entry, or user-level feedback of any kind is available or
              expected to become available until a commercial product exists.

              The retention table (TU004) captures all available durability metrics with explicit null values
              and diligence asks for each missing data point. The retention cohort figure (FU004) presents
