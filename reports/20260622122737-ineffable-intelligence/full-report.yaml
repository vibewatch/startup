      - number: '7.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Safety Governance Absence Is a Thesis-Level Risk
            body: |
              Ineffable Intelligence is building a system explicitly designed to achieve
              superintelligence — capability beyond human-level. As of 22 June 2026, there is no
              disclosed responsible scaling policy, no head of safety, no red-teaming programme,
              no alignment research agenda, and no external safety advisory body. This is not a
              gap that can be deferred indefinitely: every frontier lab that has published safety
              commitments (Anthropic, OpenAI, Google DeepMind) did so before significant capability
              was achieved, not after. Investors should treat the absence of safety governance as a
              material diligence blocker — not merely a reputational risk — given EU AI Act systemic
              risk obligations, potential UK regulatory action, and the fundamental alignment
              uncertainty that comes with any system targeting general intelligence.
            calloutType: risk
            claimRefs:
              - CR013
              - CR036
              - CR037
          - type: callout
            title: Single-Hardware Dependency Creates Catastrophic Failure Mode
            body: |
              Ineffable's superlearner is co-designed around NVIDIA Vera Rubin NVL72 hardware that
              has not yet reached general availability. There is no disclosed fallback compute
              arrangement. In the event of NVIDIA production delays, reallocation of capacity to
              competing hyperscalers, or a commercial dispute, Ineffable's training programme has
              no continuity path. This is a qualitatively different risk from the compute
              dependencies of standard software companies: the RL training loop is tightly coupled
              to specific interconnect and memory bandwidth characteristics that no other available
              hardware replicates. Investors should require an allocation guarantee or an executable
              fallback plan before the next round.
            calloutType: risk
            claimRefs:
              - CR009
              - CR010
              - CR022
          - type: callout
            title: Key-Person Concentration Is Extreme by Peer Standards
            body: |
              David Silver is the sole named founder, CEO, and scientific authority. He has no
              co-founder, no named scientific co-lead, no disclosed succession plan, and no
              independent board scientific committee. This concentration exceeds the already-high
              key-person risk of peer frontier AI labs: Anthropic had eight co-founders; OpenAI
              had multiple founding researchers. The entire thesis — that the world's leading RL
              researcher can recruit, fund, and direct a superlearner programme — rests on one
              individual. A Silver departure does not merely create a leadership gap; it removes the
              intellectual anchor of the entire investment thesis.
            calloutType: risk
            claimRefs:
              - CR032
              - CR036
          - type: callout
            title: Adverse Governance Voices Are Credible and Specific
            body: |
              Independent experts quoted by Newspage and Electronics Weekly in April–May 2026
              were specific in their critique: the UK government's minority equity stake through
              the British Business Bank and Sovereign AI Fund does not secure IP sovereignty, usage
              rights, or commercial governance over discoveries made by the superlearner. This is
              not a generic "governance concern" — it is a specific observation that public money
              in a pre-commercial AI lab, without board-level rights, without IP covenants, and
              without a public-benefit enforcement mechanism, provides legitimacy to the company
              but not accountability to the public. Investors should request confirmation of what
              governance rights, if any, the government's stake actually carries.
            calloutType: risk
            claimRefs:
              - CR006
              - CR018
              - CR031
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >
              Ineffable Intelligence presents one of the highest-stakes investment propositions in the 2026 technology

              landscape: an elite, single-founder reinforcement learning laboratory backed by Tier-1 venture capital at

              a $5.1 billion seed-stage valuation, with zero revenue, zero product, and zero commercial timeline

              disclosed. The investment thesis rests on four pillars — founder quality, paradigm uniqueness, capital and

              infrastructure structure, and sovereign tailwind — each with a credible anti-thesis.


              The foundational thesis pillar is David Silver's exceptional track record. As the principal architect of

              AlphaGo, AlphaZero, AlphaStar, and AlphaProof at Google DeepMind, Silver demonstrated more than any other

              living researcher the ability to translate reinforcement learning from academic theory into
              paradigm-shifting

              results. AlphaGo's 4-1 defeat of 18-time world champion Lee Sedol in March 2016 was watched by 200 million

              people; AlphaFold transformed structural biology; AlphaProof advanced automated mathematical reasoning.

              Lightspeed Venture Partners, one of Ineffable's co-lead investors, specifically cited this track record as

              the investment rationale, describing Silver as having spent "nearly two decades turning reinforcement

              learning from a research idea into the results the rest of the field builds on." The anti-thesis is

              concentrated risk: Silver is the entire thesis. No co-founder has been named, no succession plan
              disclosed,

              and no research leadership team introduced publicly. The probability distribution on outcomes collapses

              dramatically if Silver departs.


              The second pillar is paradigm uniqueness. Ineffable's data-free experiential RL approach is, to public

              knowledge, the only seed-scale effort of this type globally. Unlike OpenAI, Anthropic, Google DeepMind,

              and xAI — all of which rely on human-generated training data and RLHF — Ineffable's system is designed to

              generate and evaluate its own experiences. The anti-thesis is competitive velocity: Google DeepMind, which

              has the deepest RL talent pool outside Ineffable and which was Silver's professional home, could redirect

              resources to the same paradigm within an estimated 12–36 months. MIT Technology Review analysis has

              published evidence suggesting data-free RL faces fundamental barriers in open-ended environments, and

              peer-reviewed literature increasingly identifies scaling limits in reward-based systems.


              The third pillar — the $1.1 billion capital structure with Tier-1 leads and NVIDIA/Google Cloud

              co-investment — creates both a multi-year runway argument and a high-quality endorsement signal. The

              anti-thesis: without a disclosed burn rate, capital adequacy cannot be verified. Frontier RL compute costs

              are growing at approximately 2–5× annually according to Epoch AI analysis, and the company's

              infrastructure partnerships, while partially mitigating capex, do not fully offset this structural

              pressure.


              The fourth pillar — UK Sovereign AI Fund and British Business Bank co-investment — provides political

              legitimacy and a policy tailwind. The UK government's Secretary of State described it as "backing them

              with the speed of venture and the strength of a nation." The anti-thesis, raised explicitly by independent

              governance experts, is that the government's approximately 2% stake and minority equity position secures

              no IP rights, no governance control, and no enforceable claim on discoveries. The investment buys

              political association, not structural sovereignty.


              Table TV002 maps these four pillars against supporting evidence and anti-thesis conditions, with

              the pivoting signals that would strengthen or break each argument.
