      - number: '3.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Compute Access Is a Structural Ceiling, Not Just a Bottleneck
            body: >
              Ineffable's Google Cloud partnership provides frontier compute access — but on a different footing from
              hyperscaler-backed competitors. Google DeepMind has unconditional access to Alphabet TPU infrastructure;
              OpenAI has contractually committed Azure capacity; Amazon's Anthropic investment includes AWS compute
              credits. Ineffable's cluster is procured via a commercial preferred-provider agreement subject to standard
              cloud terms, export-control exposure, and Google Cloud's strategic priorities. If a future export-control
              event disrupts NVIDIA Vera Rubin hardware supply — as occurred with H20 chips in FY2026 — Ineffable's
              training timeline could be materially delayed while Google DeepMind continues uninterrupted.
            calloutType: risk
            claimRefs:
