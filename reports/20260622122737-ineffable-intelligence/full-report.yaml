        - Silver exits CEO role without a named, credible successor of comparable stature
        - Entire RL thesis collapses; team cohesion at risk; paradigm uniqueness claim weakened
        - Monitor Ineffable press releases; board announcements; LinkedIn; Companies House director filings
        - Immediate — any time
      - - RL scaling plateau confirmed
        - >-
          Peer-reviewed or credible technical publication confirms data-free RL cannot scale in open-ended environments;
          no Ineffable counter-evidence within 6 months
        - Paradigm bet fails; bear case becomes base case; all scenario valuations compress
        - Monitor ArXiv RL scaling literature quarterly; track Ineffable publications
        - 12–30 months
      - - Compute access disruption
        - >-
          NVIDIA Vera Rubin allocation materially reduced or Google Cloud partnership terminated; no announced
          replacement
        - Core research infrastructure unavailable; multi-year timeline delay; burn rate accelerates
        - Monitor NVIDIA and Google Cloud partnership press; watch for compute re-allocation signals
        - 12–24 months
      - - Down-round or flat Series A
        - Next fundraising round priced at or below $5.1B post-money valuation
        - Market has de-rated capability claims; follow-on financing risk elevated; investor sentiment turning
        - Track all fundraising announcements; monitor secondary market data
        - 18–30 months
      - - Safety governance failure
        - >-
          Public safety incident, UK AI regulator investigation, or adversarial testing failure attributed to
          Ineffable's system
        - >-
          Regulatory, reputational, and investor risk crystallise simultaneously; sovereign co-investors face political
          pressure
        - Monitor UK AISI and ICO communications; track press for Ineffable-attributed incidents
        - Any time
    notes: |
      Kill triggers are based on publicly monitorable events. Internal information (board minutes, safety
      reports, compute allocation agreements) would provide earlier warning but is not accessible. Urgency
      refers to time horizon within which the trigger becomes resolvable from public evidence, not probability.
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV028
  - id: TV006
    title: Final Diligence Asks Table
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
      - Priority
    rows:
      - - Financial burn rate and runway
        - Monthly burn rate; use-of-funds breakdown by category; runway estimate against the $1.1B raised
        - >-
          Without burn data it is impossible to assess whether capital provides sufficient runway to a demonstrable
          milestone or whether a near-term financing cliff exists
        - CFO; data room; board-approved budget; ask for 24-month cash projection
        - Critical
      - - Technical milestone definitions
        - Concrete, measurable, time-bound definitions of 'superlearner' research milestones with board-approved OKRs
        - Without milestones there is no underwriting basis for any scenario; the technical bet cannot be tracked
        - CEO; technical team; board minutes; investor update materials
        - Critical
      - - Cap table and preference structure
        - Full cap table; liquidation preference stack depth; anti-dilution provisions; pro-rata rights per investor
        - >-
          Seed investors' preference stack directly determines actual return in base and bear scenarios; depth is
          unknown
        - Legal counsel; term sheet; cap table management tool (e.g. Carta)
        - Critical
      - - Safety and alignment framework
        - >-
          Internal safety governance documents; red-teaming programme; any responsible scaling policy or equivalent; AI
          Safety Institute engagement status
        - >-
          Regulatory exposure (EU AI Act GPAI), reputational risk, and liability are unquantifiable without a safety
          framework
        - CEO; CISO; external safety review; UK AI Safety Institute engagement documentation
        - Critical
      - - IP rights and sovereign governance
        - >-
          Precise contractual scope of IP rights held by UK Sovereign AI Fund and British Business Bank; any
          exclusivity, priority access, or royalty provisions
        - >-
          Sovereign AI tailwind thesis requires substance; absent formal rights the government position is reputational
          only and subject to reversal
        - Lawyers; government funding agreement; Sovereign AI UK term sheet; BBB investment agreement
        - High
    notes: |
      All five topics are blocking evidence gaps: conviction underwriting of any future round position requires
      resolution of each. None are addressable from public sources. All require direct management engagement
      or data-room access. Priority ratings are: Critical = cannot proceed without; High = significantly
      affects scenario probability weighting.
    claimRefs:
      - CV040
