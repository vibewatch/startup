      - number: '1.5'
        title: Adverse Signals and Governance Concerns
        blocks:
          - type: paragraph
            body: |
              The primary adverse signal in the public record is not operational but structural: a cluster
              of governance and sovereignty concerns raised by AI industry commentators in response to the
              UK government's minority co-investment alongside dominant US venture capital.

              Newspage.news (30 April 2026) published commentary from two AI consultants. Rohit Parmar-Mistry
              (Pattrn Data) argued that "public money at seed stage should buy more than a press release
              and a minority stake" and that government participation without governance rights, transparency
              on downstream use, or credible safeguards "helps de-risk the upside while private investors
              capture the strategic value." Katrina Young (KYC Digital) described the UK government's
              participation as roughly one percent influence over systems that could generate strategically
              significant knowledge, warning that "sovereignty is not achieved through presence on a cap
              table — it is secured through control, leverage and accountability."

              Electronics Weekly (28 April 2026) similarly observed that as part of its investment, the UK
              government receives a London address, a small equity stake, and first refusal on the next
              round — but no structural guarantee that Ineffable's discoveries, IP, or commercial value
              remain in the UK.

              No lawsuits, regulatory investigations, leadership disputes, sanctions, or product recalls
              were found in the retained evidence as of the run date. The company is less than eight months
              old, which limits the surface area for adverse events. The governance concerns are material
              to long-run public benefit and UK AI sovereignty framing but do not currently represent an
              operational or legal risk to the company itself. Diligence should verify what governance
              rights, if any, the public co-investors actually hold; the Sovereign AI Fund described its
              investment terms as commercially sensitive.
            claimRefs:
              - CO040
              - CO041
              - CO042
              - CO043
              - CO025
      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Exceptional founder-market fit
            body: >
              David Silver has spent nearly two decades producing the field's most consequential RL demonstrations —
              AlphaGo, AlphaZero, AlphaProof. There is arguably no researcher on Earth with stronger personal
              credibility to pursue an RL-centric superintelligence mission. The depth of technical bench, if the
              secondary-reported co-founders are confirmed, adds further signal.
            calloutType: strength
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
          - type: callout
            title: Governance and sovereignty gap
            body: >
              The UK government invested public money alongside dominant US venture capital but received no publicly
              disclosed structural protections — no IP-anchoring conditions, no enforceable UK-use requirements, and no
              clear regulatory oversight mechanism. Commentators argue this positions the UK as a reputational
              co-investor rather than a genuine sovereign AI backer. If Ineffable's superlearner produces strategically
              significant breakthroughs, the benefits and control may flow primarily to US investors and US cloud
              providers.
            calloutType: risk
            claimRefs:
              - CO025
              - CO040
              - CO041
              - CO042
          - type: callout
            title: Pre-revenue research lab with billion-dollar price tag
            body: >
              At $5.1 billion post-money with zero revenue, zero customers, and a stated intent to avoid near-term
              products, investors are pricing exclusively on the founder's track record and the plausibility of the RL
              thesis. If the research program takes longer than anticipated or does not produce systems that can be
              commercialized, the path to returns at this entry valuation is unclear.
            calloutType: risk
            claimRefs:
              - CO020
              - CO043
              - CO044
          - type: callout
            title: Infrastructure partnerships de-risk compute bottleneck
            body: >
              Frontier RL at superlearner scale requires enormously expensive infrastructure — continuous
              generate-evaluate-update loops that are qualitatively different from pretraining on static datasets. The
              NVIDIA and Google Cloud partnerships, secured within 60 days of emergence from stealth, effectively
              de-risk the compute bottleneck that would otherwise be the largest near-term execution risk.
