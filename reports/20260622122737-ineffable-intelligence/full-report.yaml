      - number: '4.4'
        title: Public Financial Gaps and Unit Economics
        blocks:
          - type: paragraph
            body: |
              Ineffable Intelligence's financial profile is almost entirely private. As a pre-revenue
              research entity with no filed accounts, no disclosed product pricing, and no customer metrics,
              the standard unit-economics analysis framework does not apply in its conventional form. There
              is no customer acquisition cost (CAC), no lifetime customer value (LTV), no payback period, no
              ARR, no GMV, and no unit volume. These gaps are not temporary disclosure delays — they reflect
              the company's deliberate pre-commercial posture.

              What can be analysed is the structural drivers of future unit economics once commercialisation
              begins. The capital intensity of RL compute at frontier scale implies that COGS — once revenue
              starts — will be dominated by compute costs rather than human labour, which structurally
              resembles hyperscaler or cloud-native software gross margins rather than services. If Ineffable
              monetises via API access or weight licensing, marginal cost of serving additional users could
              be low (high gross margin ceiling), but the amortised research and infrastructure cost base
              will be substantial. The unit economics bridge (FI002) maps this logic structurally even in
              the absence of real numbers. The GTM motion is completely unresolved: no sales team, no
              channel partners, no disclosed go-to-market plan, no customer references, and no pipeline data
              exist. The public financial gaps table (TI005) enumerates every missing metric with its
              specific diligence path. The unit economics table (TI003) documents what is known, estimated,
