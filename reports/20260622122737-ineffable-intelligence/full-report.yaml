            title: Governance Gap — Public Money May Not Secure Customer-Equivalent Rights
            body: |
              The newspage.news article published in April 2026 cited multiple independent AI consultants
              and governance experts who argued that the UK government's small equity stake does not buy
              sovereignty over the technology's outputs or governance over how discoveries are used and
              commercialised. Katrina Young (KYC Digital) stated the public stake is "participation, not
              sovereignty" and that governance conditions are absent. Rohit Parmar-Mistry (Pattrn Data)
              characterised the arrangement as "ceremonial association." The governance gap is a material
              customer risk: if the technology succeeds, the entity that funded the initial risk-de-risking
