      - number: '6.5'
        title: Expansion Pathway and Concentration Risk Analysis
        blocks:
          - type: paragraph
            body: |
              Ineffable Intelligence's path to commercial customers requires traversing several distinct
              phases, each dependent on the preceding one succeeding. The first phase — research programme
              execution — must demonstrate a credible technical breakthrough before any commercial engagement
              can occur. The second phase requires converting that breakthrough into a deployable capability
              or research access product. The third phase requires identifying and closing initial customer
              contracts, which for frontier AI research outputs are typically long-cycle enterprise or
              government procurements. Only after an initial customer base exists can land-and-expand dynamics
              operate.

              Concentration risk is extreme at this pre-customer stage. The company's entire infrastructure
              dependency is concentrated in a single cloud provider (Google Cloud) and a single hardware
              partner (NVIDIA). Any disruption to these relationships — commercial, technical, or political —
              would materially threaten the research programme. On the public-sector side, the UK government's
              $20 million stake is so small relative to the $1.1 billion total round that it provides
              essentially no structural leverage over Ineffable's direction; AI governance experts quoted in
              newspage.news characterised this as providing "roughly one percent influence" over strategic
              outcomes.

              Procurement friction for the likely buyer segments is high. Sovereign AI labs and national AI
              programmes operate on annual budget cycles with multi-year procurement timelines. Science
              research organisations in pharma and materials science have complex IP ownership requirements
              that must be negotiated before any AI-generated discovery can be used commercially. Enterprise
              R&D buyers require proof-of-concept milestones and vendor validation before commitment.
              The expansion and concentration risk table (TU005) maps these risks with severity assessments
              and diligence paths.
