          - type: callout
            title: Partners and Investors Are Not Customers — Distinction Is Material
            body: |
              NVIDIA, Google Cloud, and the UK Sovereign AI Fund are often cited in press coverage alongside
              language implying commercial traction. This chapter finds the distinction critical: NVIDIA is
              a supplier and co-development partner; Google Cloud is an infrastructure provider to whom
              Ineffable pays for compute; the Sovereign AI Fund and British Business Bank are equity investors.
              None of these relationships involves Ineffable selling a product or service to a paying customer.
              Treating partner or investor commitments as customer proof in a due-diligence context would
              materially misstate commercial readiness.
            calloutType: risk
            claimRefs:
