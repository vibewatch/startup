      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: |
              The AI compute infrastructure market is experiencing unprecedented demand growth. Jensen
              Huang, NVIDIA CEO, stated that AI inference token generation surged tenfold in a single
              year, and NVIDIA's Q1 FY2026 results confirm that data centre demand is "incredibly strong"
              with no demand saturation visible in the near term. NVIDIA's expansion into AI factories
              across Saudi Arabia, UAE, and Europe confirms that sovereign buyers are converting
              political commitments into real compute procurement. The UK AI Opportunities Action Plan
              (January 2025) and the UK Frontier AI Safety Commitments signed at the Seoul Summit
              confirm that UK government policy is aligned with supporting frontier AI development,
              providing both a demand signal and a legitimacy framework for Ineffable's raise.

              RL scaling is showing practical progress: the Kimi k1.5 paper (January 2025) demonstrates
              that RL applied to LLMs can match OpenAI's o1 on multiple reasoning benchmarks without
              Monte Carlo tree search or process reward models. AlphaFold's atomic-accuracy protein
              structure prediction established RL and deep learning as indispensable tools for scientific
              research. These technical proofs of concept validate the RL investment thesis at the level
              of supervised learning equivalents, though not yet the autonomous experiential learning
              Ineffable is pursuing.

              On the constraint side, five structural barriers are material. First, the EU AI Act's GPAI
              obligations became effective 2 August 2025, introducing safety assessments, copyright
              disclosure requirements, and systemic-risk mitigation for high-capability frontier models;
              these obligations add compliance cost and legal uncertainty for any Ineffable commercial
              deployment in the EU. Second, US export controls on NVIDIA's H20 chip caused an
              approximately $4.5 billion charge and ~$7 billion in blocked or lost revenue in Q1 FY2026
              alone, demonstrating that geopolitical supply shocks can materially disrupt AI infrastructure
              plans regardless of demand. Third, RL training is intrinsically more compute-intensive than
              equivalent supervised runs (Epoch AI's analysis shows AlphaGo-family systems are compute
              outliers). Fourth, the ROI of general AI investment is uncertain: Goldman Sachs Research
              explicitly notes that productivity impacts are likely delayed to the second half of this
              decade, raising questions about the pace of discretionary spend. Fifth, the absence of any
              commercial product, revenue, or even a demonstrable research milestone for Ineffable means
              the entire adoption pathway is speculative at the run date; governance concerns about the
              UK government's thin equity stake (without enforceable IP or sovereignty conditions) add
              to the legitimacy risk.
