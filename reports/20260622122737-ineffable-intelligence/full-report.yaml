      - number: '1.3'
        title: Funding, Investors, and Capital Structure
        blocks:
          - type: paragraph
            body: |
              On 27 April 2026, Ineffable Intelligence announced a $1.1 billion seed round at a $5.1 billion
              post-money valuation — the largest European seed round in history and one of the largest
              first-money-in rounds in global AI history. The round was co-led by Sequoia Capital and
              Lightspeed Venture Partners. Cooley LLP (London partner Eric Davison) advised the company on
              the financing. The sterling equivalent is approximately £814 million at the rate implied by
              UKTN's reporting.

              Participating investors include NVIDIA, Google, Index Ventures, DST Global, EQT Ventures,
              Flying Fish Ventures, Evantic Capital, BOND Capital, and the UK Wellcome Trust, alongside two
              UK public-sector vehicles: the British Business Bank (which invested $20 million / £14.8
              million confirmed in its own press release) and the UK Sovereign AI Fund (amount
              "commercially sensitive," with typical investments in the £1–10 million range per government
              disclosures). The Sovereign AI Fund and British Business Bank position the UK as co-investors
              alongside dominant US venture capital. UK Science and Technology Secretary Liz Kendall and AI
              Minister Kanishka Narayan both issued endorsements framing the investment as a demonstration
              that the UK can be an "AI maker, not taker."

              As a seed-stage company with no disclosed products or revenue, there is no funding history
              prior to this single round; the cap table prior to April 2026 is unknown. The $5.1 billion
              post-money valuation is exceptionally high for an entity only months old with no commercial
              product, placing it at "pentacorn" status (companies valued at more than $5 billion) immediately
              at seed. No debt, credit facilities, secondaries, or prior financing has been reported or
              confirmed. The company has committed to operating within a "window where ambitious research
              can thrive, without bending to the demands of incremental products and near-term profits,"
              which has implications for the timeline to commercial returns expected by investors.

              David Silver has publicly committed 100% of any personal proceeds from his Ineffable equity
              to high-impact charities via the Founders Pledge network. This commitment is reported by
              Sesamers as the largest pledge in Founders Pledge's history at the implied equity value
              of the round. TechCrunch and Hotminute corroborate the pledge. The Founders Pledge website
              itself does not publish individual member commitments.
