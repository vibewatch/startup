            title: No Safety Governance — Highest-Priority Diligence Gap
            body: |
              Ineffable Intelligence is building a frontier-scale RL system with the stated goal of
              achieving superintelligence, without any publicly disclosed safety framework, alignment
              research agenda, evaluation methodology, or responsible scaling policy as of 22 June 2026.
              This is the single most important product and technology risk for investors, regulators,
              and the broader public. The EU AI Act, UK Frontier AI Safety Commitments, and the standard
              practices of peer frontier labs (Anthropic, OpenAI, DeepMind) all establish governance
              artefacts before training at scale. Ineffable's silence on this dimension is not explained
              by stage or scale — it should be addressed proactively before training begins.
