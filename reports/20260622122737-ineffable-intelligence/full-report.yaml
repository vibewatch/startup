      - number: '4.5'
        title: Financial Verdict and Diligence Blockers
        blocks:
          - type: paragraph
            body: |
              Ineffable Intelligence cannot be financially underwritten in the conventional sense. Revenue
              quality is zero — there is no revenue. Gross margin path is speculative — no COGS structure
              exists to model. Capital intensity is extraordinary — RL at frontier scale with Vera Rubin
              NVL72 clusters, partially offset by partnership subsidies whose commercial terms are
              undisclosed. Burn rate and runway are unconfirmed — the company has published no financial
              statements and there is no public burn estimate. The next-round risk is material — Ineffable
              will require additional capital (likely at the billion-dollar scale) to sustain frontier-scale
              operations beyond the initial research phase, and the timing of that raise is uncertain.

              This is not disqualifying for a seed-stage frontier AI research investment. The $1.1 billion
              seed quantum is explicitly designed to fund a research horizon rather than commercial
              milestones, and the presence of Sequoia, Lightspeed, NVIDIA, Google, and the Wellcome Trust
              validates the capital formation thesis. However, investors should not model positive cash flows
              within a standard 3-5 year venture horizon without evidence that the commercialisation
              timeline is defined and plausibly achievable. The primary diligence blockers are: (1) absence
              of any filed or audited financial statements; (2) no burn rate, cash position, or runway
              disclosure; (3) no use-of-funds breakdown for the $1.1 billion seed; (4) no commercial
              roadmap or revenue model; (5) compute partnership commercial terms that offset capital
              requirements but whose structure is unknown; and (6) no headcount or compensation structure
              published. Each of these is a standard data room ask that a well-governed Series A or later-
              stage process would resolve.
