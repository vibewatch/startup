      - number: '5.7'
        title: Technical Risks
        blocks:
          - type: paragraph
            body: |
              Four structural technical risks are present and material. First, compute concentration:
              the entire research programme depends on timely delivery of NVIDIA Vera Rubin NVL72 at
              scale and on Google Cloud's AI Hypercomputer availability. NVIDIA has confirmed Vera Rubin
              is "in full production" as of GTC 2026, but supply constraints, priority allocation among
              hyperscalers (Amazon, Microsoft, Google's own workloads), and software maturity remain
              unknowns. If NVIDIA's Vera Rubin ramp is slower than expected or supply is diverted,
              Ineffable's infrastructure timeline is directly at risk. The terms under which Ineffable
              will receive preferential or guaranteed supply are not disclosed.

              Second, simulation-to-real gap: RL systems trained exclusively in simulation environments
              have a well-documented failure mode when applied to out-of-distribution environments. The
              quality and diversity of the simulation environments Ineffable uses to generate experience
              are unknown. The more abstract and diverse the target capability (e.g., scientific
              discovery, mathematical proof), the harder it is to specify a reward function and
              environment that drives useful generalisation rather than reward hacking or narrow
              solutions. Ineffable has not disclosed any simulation environment design, reward model
              architecture, or domain coverage strategy.

              Third, unproven generalisation: Ineffable's predecessors at DeepMind (AlphaGo, AlphaZero,
              AlphaProof) achieved superhuman performance in well-defined, fully observable, combinatorial
              domains with clear reward signals. Generalising this approach to open-ended real-world
              knowledge discovery — where reward signals are ambiguous, environments are partially
              observable, and the domain is unbounded — is a qualitatively harder research challenge.
              No evidence that this gap has been bridged exists in any public disclosure.

              Fourth, key-person and team-scaling risk: the mission is directly associated with David
              Silver's research vision. The scientific programme depends on retaining Silver and the
              founding team, and on recruiting additional frontier RL researchers in a highly competitive
              talent market. The Wired interview describes the team being assembled from "exceptional
              individuals dedicated to this mission alone," which implies a narrow but deep talent
              profile. Any disruption to the founding team could materially affect both the scientific
              programme and investor confidence.
            claimRefs:
              - CE006
              - CE007
              - CE026
              - CE027
              - CE028
              - CE029
              - CE039
