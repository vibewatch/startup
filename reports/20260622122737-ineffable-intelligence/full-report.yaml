  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal, and Sovereignty Risk
        blocks:
          - type: paragraph
            body: |
              Ineffable Intelligence operates in a rapidly evolving regulatory environment without the
              benefit of a settled legal framework. The United Kingdom, where the company is incorporated
              and primarily operates, had adopted a "pro-innovation" approach to AI regulation as of
              June 2026 — a deliberate policy choice to avoid sector-specific legislation and rely on
              existing regulators. While this posture reduces near-term compliance burden, it creates
              a forward regulatory risk: if a UK AI Bill is enacted with binding safety or compute
              obligations, Ineffable may face retroactive compliance costs or operational constraints
              on its training programme.

              The EU AI Act, which began phased enforcement in August 2024, presents a material
              extraterritorial risk. Ineffable's superlearner, once deployed or marketed in any EU
              jurisdiction, will almost certainly qualify as a General Purpose AI (GPAI) model under
              Article 3(63) of the Regulation. GPAI providers are required to prepare technical
              documentation, maintain an up-to-date model register entry, and — if classified as
              "systemic risk" under Article 51 — undergo adversarial testing and incident reporting.
              The company has not disclosed any EU AI Act compliance programme.

              The National Security and Investment (NSI) Act 2021 is a structural legal risk for
              investors. The Act gives the UK Secretary of State power to call in and block or impose
              conditions on acquisitions of material control over entities in the AI technology sector.
              Any future secondary fund raising that transfers material control to a non-UK investor
              could trigger a mandatory notification obligation. Sequoia Capital (US) and Lightspeed
              Venture Partners (US) already hold board seats; any further foreign stake increase
              warrants legal advice.

              The Information Commissioner's Office (ICO) guidance on AI and data protection establishes
              that organisations deploying AI must apply UK GDPR accountability and governance
              principles, including data protection by design, purpose limitation, and fairness in
              automated decision-making. Although Ineffable claims the superlearner learns without human
              data, the RL training loop generates, processes, and evaluates experiences. Whether the
              system encounters personal data in evaluation tasks remains undisclosed. The company has
              no publicly confirmed data protection officer, data processing agreement, or ICO
              engagement.

              On intellectual property: David Silver spent approximately two decades at Google DeepMind,
              and several co-workers have joined from DeepMind and UCL. IP assignment agreements between
              Silver, his UCL professorial role, and Ineffable's corporate entity have not been publicly
              disclosed. If any core algorithms were partly developed under DeepMind or UCL employment,
              IP ownership could become contested as commercialisation approaches. The company's
              registered office in Altrincham (a professional services address) does not indicate a
              formal IP holding entity distinct from the operating company.

              Sovereignty governance concerns have been raised directly by independent experts following
              the UK government's co-investment announcement. Commentators cited in Newspage and
              Electronics Weekly noted that a minority stake held through the British Business Bank and
              UK Sovereign AI Fund does not confer the government any oversight rights over IP created,
              discoveries made, or downstream use of the technology. The Sovereign AI Fund's own
              published investment strategy confirms that its mandate is financial return plus public
              benefit, but the specific governance protections attached to the Ineffable investment are
              not disclosed in any public document.
