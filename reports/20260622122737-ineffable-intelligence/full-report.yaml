      - number: '7.3'
        title: Partner and Infrastructure Dependency Risk
        blocks:
          - type: paragraph
            body: |
              Ineffable Intelligence has built its infrastructure on a narrow set of critical
              dependencies, each of which could independently impair the research programme.

              NVIDIA occupies the highest-concentration dependency position. The Vera Rubin NVL72
              cluster is custom co-designed for Ineffable's RL workload; no alternative hardware
              exists that matches its interconnect and memory bandwidth specifications for the
              training-inference tight loops the superlearner requires. NVIDIA has also made an equity
              investment in Ineffable, creating a dual role as investor and sole hardware supplier.
              The commercial terms of the hardware agreement — pricing, allocation guarantees,
              exclusivity, and upgrade path to future NVIDIA generations — are entirely undisclosed.

              Google Cloud holds the second critical dependency as Ineffable's "preferred cloud
              provider" for deployment of the AI Hypercomputer A5X / Vera Rubin NVL72 cluster. This
              partnership was announced in June 2026; its commercial terms are also undisclosed. Google
              has separately invested in Ineffable, creating a parallel investor-cloud provider dual
              role. Google Cloud also serves Google DeepMind, OpenAI (via Microsoft Azure, a competitor),
              and its own internal AI projects; Ineffable does not have a disclosed priority or capacity
              guarantee against these competing priorities.

              Capital dependency is concentrated at the lead investor level. Sequoia Capital and
              Lightspeed Venture Partners co-led the seed round and hold board seats. By convention in
              VC-backed companies, the lead investors in a seed round are expected to signal and lead
              the next round. If either firm develops reservations about technical progress or the
              competitive landscape, their withdrawal from Series A signalling would be read as a
              strong adverse signal by other investors — a "pull the ladder" scenario.

              The British Business Bank and UK Sovereign AI Fund together invested a total of
              approximately $30–40 M at seed. Their governance rights and information rights are not
              publicly disclosed. If the government changes AI policy or decides the public-benefit
              terms of its investment are not being met, it could create reputational and political
              pressure even without contractual recourse.

              Talent pipeline dependency is anchored in David Silver's personal academic network.
              The majority of disclosed hires with named affiliations come from DeepMind and UCL.
              Silver is both the CEO and the primary recruiter. If he departs, not only is the
              scientific direction at risk but the talent pipeline is likely to dry up simultaneously.
