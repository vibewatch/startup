  - id: capital-adequacy-and-runway
    title: Capital Adequacy and Runway
    body: |
      Ineffable raised $1.1 billion in a seed round on 27 April 2026 at a $5.1 billion post-money
      valuation. This is the largest European seed round in history and was co-led by Sequoia Capital
      and Lightspeed Venture Partners. Confirmed participants include the British Business Bank ($20
      million confirmed), the UK Sovereign AI Fund (amount undisclosed), NVIDIA, Google, Index
      Ventures, DST Global, EQT Ventures, Flying Fish, Evantic Capital, BOND Capital, and the
      Wellcome Trust.

      No debt instruments, credit facilities, venture debt, or project finance obligations have been
      publicly disclosed. No annual accounts have been filed with Companies House; the company was
      incorporated on 19 November 2025 and first accounts are not yet legally required. The
      Companies House filing history shows three statements of capital: GBP 10 at incorporation in
      November 2025, GBP 320 on 21 January 2026 (associated with Silver's appointment as director
      and person with significant control), and GBP 350 on 12 March 2026. These are nominal
      statutory values, not the actual equity premium raised; the $1.1 billion investment would flow
      as share premium, which will appear in the first financial statements when filed.

      Frontier AI lab benchmarks suggest multi-year runways are plausible from a $1.1 billion raise.
      Anthropic and OpenAI operated with multi-hundred-million-dollar annual compute-plus-staff
      budgets before reaching similar capital levels. However, those comparisons are imprecise:
      Ineffable's RL-centric workloads may be structurally more compute-intensive than transformer
      pretraining for a given capability level, and the precise monthly burn is unknown. A $1.1
      billion raise at even a $60–100 million monthly burn rate provides approximately 11–18 months
      of runway — demonstrably below the "multi-year research horizon" implied by the mission, unless
      Google Cloud and NVIDIA partnership subsidies meaningfully offset direct spend. Capital
      adequacy is therefore plausible but not demonstrated, and the company's next equity round will
      likely be triggered by either a scientific milestone, exhaustion of seed capital, or the onset
      of commercial deployment. UK AI Growth Zones and the broader DSIT policy environment provide
      potential access to non-dilutive funding, but no such grants have been publicly announced for
      Ineffable. The capital adequacy table (TI004) and financial estimate range figure (FI003)
      present structured range estimates for the key capital metrics.
