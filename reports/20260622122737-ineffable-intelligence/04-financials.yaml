callouts:
  - calloutType: risk
    title: Compute Cost Inflation Threatens Runway
    body: >
      Epoch AI analysis shows frontier AI training costs growing at 2.4x per year and projects
      costs exceeding $1 billion per single training run by 2027. Ineffable's RL-centric workloads
      are structurally more demanding than transformer pretraining, meaning its compute cost
      trajectory may be steeper than comparator AI labs. The $1.1 billion seed provides a finite
      buffer; if the Google Cloud and NVIDIA commercial terms do not substantially offset compute
      spend, runway could be materially shorter than the "multi-year research horizon" the mission
      implies.
    claimRefs:
      - CI016
      - CI018
      - CI036

  - calloutType: risk
    title: Financing Dependency — No Commercial Revenue to Buffer Burn
    body: >
      Ineffable has no revenue, no commercial plan, and no disclosed monetisation timeline.
      Its entire financial model depends on (a) the $1.1 billion seed round lasting long enough to
      reach a fundable scientific milestone, (b) Google Cloud and NVIDIA partnerships offsetting
      compute costs, and (c) a next round being raisable at attractive terms before capital is
      exhausted. Each of these links is unverifiable from public evidence. The Sequoia "Act Two"
      analysis warned of "unsustainable feeding frenzies" in AI and questioned whether labs without
      product-market fit could sustain their valuations.
    claimRefs:
      - CI025
      - CI027
      - CI037
      - CI039
      - CI040

  - calloutType: insight
    title: Infrastructure Partnerships Defer Capex — But Terms Are Undisclosed
    body: >
      The Google Cloud and NVIDIA partnerships convert what would otherwise be direct capital
      expenditure on GPU clusters (potentially hundreds of millions of dollars annually) into
      partnership-structured engagements. This materially improves the effective capital efficiency
      of the $1.1 billion seed, potentially doubling or tripling the effective research runway
      relative to a standalone cloud-rental model. However, the commercial terms — including any
      minimum usage commitments, equity provisions, IP-sharing clauses, or revenue-share provisions
      — are not disclosed, making it impossible to model the full cost structure.
    claimRefs:
      - CI013
      - CI021
      - CI022
      - CI026

  - calloutType: assumption
    title: Revenue Model Scenario Requires Explicit Assumptions
    body: >
      Any investor model of Ineffable's revenue must explicitly state: (a) estimated years to
      first commercial deployment; (b) target customer segment; (c) pricing mechanism; and (d)
      expected gross margin. Without these four inputs, no financial model can be constructed.
      All four are currently unavailable in the public domain and require data room access to
      address.
    claimRefs:
      - CI024
      - CI040

