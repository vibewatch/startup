  evidenceGaps:
    - id: EGI001
      type: private-evidence-only
      severity: blocking
      topic: burn-rate
      missingEvidence: "Monthly cash burn rate and cumulative cash position from management accounts or investor reporting."
      whyItMatters: "Without burn rate, runway cannot be calculated and the next-round timing cannot be modelled; capital adequacy analysis is structurally incomplete."
      diligencePath: "Request management accounts (income statement and cash flow statement) for the period April–June 2026 via data room."
      relatedQuestionRefs:
        - QI015

    - id: EGI002
      type: private-evidence-only
      severity: blocking
      topic: compute-costs
      missingEvidence: "Agreed commercial terms for the Google Cloud and NVIDIA partnerships, including any minimum usage commitments, compute credits, discount rates, IP provisions, and revenue-share or equity clauses."
      whyItMatters: "The effective capital efficiency of the $1.1B seed depends entirely on whether these partnerships offset compute spend materially; undisclosed terms make it impossible to model actual runway."
      diligencePath: "Request full commercial term sheets for both the Google Cloud preferred partner agreement and the NVIDIA co-design agreement; specifically request any 'cost-equivalent' valuation of in-kind compute."
      relatedQuestionRefs:
        - QI024

    - id: EGI003
      type: private-evidence-only
      severity: blocking
      topic: financial-statements
      missingEvidence: "Any financial statements (audited or management) covering the period from incorporation to the run date, including use-of-funds allocation from the seed round."
      whyItMatters: "No public financial data exists; without accounts, it is impossible to verify cash position, operating expenses, or accrued liabilities."
      diligencePath: "Request management accounts for Q1 and Q2 2026 and any board-approved budget or financial model from the data room."
      relatedQuestionRefs:
        - QI014

    - id: EGI004
      type: missing-source
      severity: material
      topic: headcount
      missingEvidence: "Current headcount, hiring plan, and compensation structure for Ineffable's R&D and operations teams."
      whyItMatters: "R&D staff represent 29–49% of frontier AI development cost; without headcount data, the cost model for the research programme is incomplete."
      diligencePath: "Request headcount by function, offer letter templates, and share option pool size and vesting terms; check LinkedIn for directional signal on team composition."
      relatedQuestionRefs:
        - QI021
