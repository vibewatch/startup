companyProfile:
  summary: >-
    Huihe Healthcare 以 H&H Medical 名义运营，是一家位于上海的未上市心血管介入医疗器械公司；公开证据最强的部分是产品、临床和早期商业化，而不是财务披露。公司把 K-Clip
    做成中国首个经导管三尖瓣瓣环成形产品，并于 2025 年 3 月获批；又用 C-Wave 系列切入冠脉和外周 IVL，并以通路和辅助器械组成更宽的平台，向外界呈现多产品线介入公司形象。2025
    年底的融资报道显示公司进入新的商业化阶段，但在把媒体报道中的独角兽估值视为充分尽调前，投资人仍需要直接取得经审计的 KPI。
