            body: >-
              今天 Huihe
              的护城河真实但脆弱。临床证据、新颖设计和上市后培训叠加，确实让公司在三尖瓣介入中拥有优势；但很多优势仍处于规模化之前。如果更大的竞争对手补齐证据，或医院偏好更宽的供应商，差异化可能很快被压缩。在冠脉 IVL
