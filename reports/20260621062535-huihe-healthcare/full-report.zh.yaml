              判断；即便估值信心，也更多来自媒体而非备案文件。因此，后续章节应重压产品、市场、客户验证和政策证据，同时把财务结论作为代理指标处理。即使底层创新叙事很强，最终建议也应明确因未上市公司不透明性打折。因此，公开尽调应先交叉核对临床证据、采购证据、医保支付逻辑和管理层披露，再把这些早期信号写进硬投资假设。中国医疗器械领域尤其需要这层语境：产品合法性往往比经济韧性、客户集中度或收入质量细节更容易在公开渠道观察到。实务上，本章应被视为对现有来源能证明什么、不能证明什么的克制综合，而不是宣称每一个关键经营指标都已经公开可见。额外文字的明确目的，是诚实保留不确定性，同时给后续尽调一个可用的决策框架。读者因此应把本综合视作一张尽调地图：它标出哪些已被验证、哪些仍由媒体主导，以及哪里获得管理层直接信息最能提升承销信心。
