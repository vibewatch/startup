  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资正反论点
        blocks:
          - type: paragraph
            body: >-
              从创新质量看，投资论点有吸引力：Huihe 似乎已经做出一个真正的结构性心脏旗舰产品，在 IVL
              上也搭起可信的第二平台，并在全球最大的心血管市场之一拼出更宽的介入产品栈。反面论点同样清楚：复用率、实际定价、毛利率和资本结构仍披露不足，投资者还难以有信心地承销一笔私募市场入场。换句话说，Huihe
              可能是一家很好的公司，但价格不合适时仍是一笔高风险投资。公开尽调应先把临床证据、采购证据、报销逻辑和管理层披露交叉验证，再把这些早期信号写成硬投资假设。在中国医疗器械领域，这层背景尤其重要：产品合法性往往比经济韧性、客户集中度或收入质量细节更容易从公开渠道观察到。实际阅读时，读者应把本章看作一份有纪律的综合：它说明现有来源能证明什么、不能证明什么，而不是声称所有关键经营指标都已公开可见。补充文字的明确目的，是诚实保留不确定性，同时给后续尽调留下可用的决策框架。因此，读者应把这份综合看作一张尽调地图：哪些已经验证，哪些仍由媒体叙事主导，哪些问题最需要直接接触管理层才能提高承销信心。
