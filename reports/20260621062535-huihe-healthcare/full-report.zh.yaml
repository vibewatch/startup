            body: >-
              公司画像很像典型高 burn 医疗器械平台：多个 III 类器械项目、多中心研究、高端制造能力、医生培训，以及不断扩张的产品组合。这些特征创造战略价值，也消耗资本。因此，即便没有披露精确金额，D
              轮报道仍有财务意义，因为它显示 K-Clip 获批后 Huihe 仍需要大量外部资本。资金用途从报道本身就能看清：商业化、渠道扩张和全球 rollout。缺失的是 runway
