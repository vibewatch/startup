      - number: '2.4'
        title: 市场结论
        blocks:
          - type: paragraph
            body: >-
              本章支持一个正面的需求结论，以及一个谨慎的变现结论。Huihe 所处市场规模大、临床意义强，并且仍向国产创新开放；但现有证据不足以支撑精确的独立 SOM
              或收入池判断。合理的尽调姿态，是把市场规模视为支撑因素而非决定因素：需求真实，所以有上行空间；但政策、采购和流程复杂度会决定其中多少需求能变成收入，因此仍要克制。因此，公开尽调应先交叉核对临床证据、采购证据、医保支付逻辑和管理层披露，再把这些早期信号写进硬投资假设。中国医疗器械领域尤其需要这层语境：产品合法性往往比经济韧性、客户集中度或收入质量细节更容易在公开渠道观察到。实务上，本章应被视为对现有来源能证明什么、不能证明什么的克制综合，而不是宣称每一个关键经营指标都已经公开可见。额外文字的明确目的，是诚实保留不确定性，同时给后续尽调一个可用的决策框架。读者因此应把本综合视作一张尽调地图：它标出哪些已被验证、哪些仍由媒体主导，以及哪里获得管理层直接信息最能提升承销信心。
