      - number: '8.3'
        title: 建议与尽调纪律
        blocks:
          - type: paragraph
            body: >-
              本报告给出的结论是继续研究，且信心较低。这不是否定技术，而是拒绝把创新证据误当成可投资性证据。有纪律的投资者在接受一个只靠独角兽叙事锚定的估值前，应先直接拿到 KPI
              包、头部客户集中度、报销兑现、各产品线收入、现金跑道，以及任何 IPO
              准备流程的清晰证据。在那之前，公司值得关注，但不值得被动量驱动的承销盲目追高。公开尽调应先把临床证据、采购证据、报销逻辑和管理层披露交叉验证，再把这些早期信号写成硬投资假设。在中国医疗器械领域，这层背景尤其重要：产品合法性往往比经济韧性、客户集中度或收入质量细节更容易从公开渠道观察到。实际阅读时，读者应把本章看作一份有纪律的综合：它说明现有来源能证明什么、不能证明什么，而不是声称所有关键经营指标都已公开可见。补充文字的明确目的，是诚实保留不确定性，同时给后续尽调留下可用的决策框架。因此，读者应把这份综合看作一张尽调地图：哪些已经验证，哪些仍由媒体叙事主导，哪些问题最需要直接接触管理层才能提高承销信心。
