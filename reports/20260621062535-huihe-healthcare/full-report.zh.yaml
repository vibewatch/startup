            body: >-
              Huihe 可见的客户范围由具备手术能力的医院、心脏团队和医生 champion
              定义，而不是匿名账户数量。大多数公开案例位于三甲、教学或标杆医院，这些机构有能力采纳复杂结构性心脏病或钙化处理流程。这说明公司仍在先通过专家中心建设。公开病例新闻覆盖的省份较广，令人鼓舞；但这不能消除集中风险，因为公开病例宣传往往偏向旗舰账户，而不是普通用户。因此，公开尽调应先交叉核对临床证据、采购证据、医保支付逻辑和管理层披露，再把这些早期信号写进硬投资假设。中国医疗器械领域尤其需要这层语境：产品合法性往往比经济韧性、客户集中度或收入质量细节更容易在公开渠道观察到。实务上，本章应被视为对现有来源能证明什么、不能证明什么的克制综合，而不是宣称每一个关键经营指标都已经公开可见。额外文字的明确目的，是诚实保留不确定性，同时给后续尽调一个可用的决策框架。读者因此应把本综合视作一张尽调地图：它标出哪些已被验证、哪些仍由媒体主导，以及哪里获得管理层直接信息最能提升承销信心。
