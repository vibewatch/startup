      - number: '2.2'
        title: 购买者、使用者与支付逻辑
        blocks:
          - type: paragraph
            body: >-
              医院采购和科室线负责人通常决定一个介入项目能否新增器械，医生和导管室团队则决定器械是否会被反复使用。这个分工对 Huihe 尤其关键：K-Clip 需要中心建设和医生培训，C-Wave
              则在成熟导管室流程中更直接地与既有冠脉工具竞争。公开证据足以推断，采纳同时依赖临床 champion 和机构预算负责人。实际含义是，Huihe 的 go-to-market
              不能只交付产品，还必须支撑流程改变、培训和证据生成。因此，公开尽调应先交叉核对临床证据、采购证据、医保支付逻辑和管理层披露，再把这些早期信号写进硬投资假设。中国医疗器械领域尤其需要这层语境：产品合法性往往比经济韧性、客户集中度或收入质量细节更容易在公开渠道观察到。实务上，本章应被视为对现有来源能证明什么、不能证明什么的克制综合，而不是宣称每一个关键经营指标都已经公开可见。额外文字的明确目的，是诚实保留不确定性，同时给后续尽调一个可用的决策框架。读者因此应把本综合视作一张尽调地图：它标出哪些已被验证、哪些仍由媒体主导，以及哪里获得管理层直接信息最能提升承销信心。
