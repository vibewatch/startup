        title: 收入质量与真正可见的部分
        blocks:
          - type: paragraph
            body: >-
              Huihe 的公开财务证据在结构上不完整。保留来源没有发布经审计收入、毛利率、burn 或现金，因此本章不能假装知道证据并不支持的单位经济。可见的是一组商业化代理指标：K-Clip 于 2025 年 3
              月获批，公司新闻显示 2026 年医院 rollout 很快，2025
              年底融资报道称新资本将加速中国和海外产品商业化。这一组合足以推断收入已经存在或即将出现，但不足以判断收入质量、复购性或利润率。因此，公开尽调应先交叉核对临床证据、采购证据、医保支付逻辑和管理层披露，再把这些早期信号写进硬投资假设。中国医疗器械领域尤其需要这层语境：产品合法性往往比经济韧性、客户集中度或收入质量细节更容易在公开渠道观察到。实务上，本章应被视为对现有来源能证明什么、不能证明什么的克制综合，而不是宣称每一个关键经营指标都已经公开可见。额外文字的明确目的，是诚实保留不确定性，同时给后续尽调一个可用的决策框架。读者因此应把本综合视作一张尽调地图：它标出哪些已被验证、哪些仍由媒体主导，以及哪里获得管理层直接信息最能提升承销信心。
