              现有最佳采纳证据，是上海、武汉、新疆、青岛、江苏、四川、山东等地一系列具名病例报道和培训活动。这一足迹意味着真实的一线活动。同时，大多数证据来自公司自有新闻中心，而不是医院独立披露的采购数据。结果是：证据足以相信
