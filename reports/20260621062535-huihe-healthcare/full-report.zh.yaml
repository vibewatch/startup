      - number: '6.3'
        title: 持久性、集中度与扩张风险
        blocks:
          - type: paragraph
            body: >-
              保留来源没有披露 NRR、GRR、合同期限、复购模式或前几大客户占比。因此，持久性只能从定性模式推断，例如反复临床教育、向偏远省份扩展，以及一站式联合手术叙事。这些是好信号，但不能替代 cohort
              数据。如果少数 KOL
              中心贡献大部分活动，客户集中度仍可能很高；公开证据也没有说明走出旗舰医院后的扩张在经济上是否顺滑。因此，公开尽调应先交叉核对临床证据、采购证据、医保支付逻辑和管理层披露，再把这些早期信号写进硬投资假设。中国医疗器械领域尤其需要这层语境：产品合法性往往比经济韧性、客户集中度或收入质量细节更容易在公开渠道观察到。实务上，本章应被视为对现有来源能证明什么、不能证明什么的克制综合，而不是宣称每一个关键经营指标都已经公开可见。额外文字的明确目的，是诚实保留不确定性，同时给后续尽调一个可用的决策框架。读者因此应把本综合视作一张尽调地图：它标出哪些已被验证、哪些仍由媒体主导，以及哪里获得管理层直接信息最能提升承销信心。
