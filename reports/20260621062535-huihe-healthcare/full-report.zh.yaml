      - number: '7.3'
        title: 缓释措施与 thesis-break 触发点
        blocks:
          - type: paragraph
            body: >-
              即便数据还不充分，主要的否决条件在概念上很清楚：早期标杆案例之后，K-Clip 的复用停滞；C-Wave 输给资本更充足的 IVL
              对手；公司只能以弱条款再融资；或高量冠脉产品比预期更早遭遇价格压力，投资逻辑都会很快变弱。公开记录偏薄，最好的缓释手段不是盲目乐观，而是有纪律的尽调。公开尽调应先把临床证据、采购证据、报销逻辑和管理层披露交叉验证，再把这些早期信号写成硬投资假设。在中国医疗器械领域，这层背景尤其重要：产品合法性往往比经济韧性、客户集中度或收入质量细节更容易从公开渠道观察到。实际阅读时，读者应把本章看作一份有纪律的综合：它说明现有来源能证明什么、不能证明什么，而不是声称所有关键经营指标都已公开可见。补充文字的明确目的，是诚实保留不确定性，同时给后续尽调留下可用的决策框架。因此，读者应把这份综合看作一张尽调地图：哪些已经验证，哪些仍由媒体叙事主导，哪些问题最需要直接接触管理层才能提高承销信心。
