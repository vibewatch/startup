      - number: '8.2'
        title: 当前估值背景与可比公司
        blocks:
          - type: paragraph
            body: >-
              媒体报道把 Huihe 描绘成一家后期、估值数十亿元级的 D 轮医疗科技公司；公开可比公司则显示，当增长和证据足够可见时，结构性心脏和 IVL 领域的类别龙头可以拿到强劲倍数。这个背景有帮助，但不足以验证
              Huihe 的精确估值标记，因为公开可比公司披露的经营数据也远多于 Huihe。因此，正确的可比逻辑只能是方向性的：Huihe
              拥有类似高溢价医疗科技故事的资产，但还缺少这些故事最终赢得长期高溢价倍数所需要的披露密度。公开尽调应先把临床证据、采购证据、报销逻辑和管理层披露交叉验证，再把这些早期信号写成硬投资假设。在中国医疗器械领域，这层背景尤其重要：产品合法性往往比经济韧性、客户集中度或收入质量细节更容易从公开渠道观察到。实际阅读时，读者应把本章看作一份有纪律的综合：它说明现有来源能证明什么、不能证明什么，而不是声称所有关键经营指标都已公开可见。补充文字的明确目的，是诚实保留不确定性，同时给后续尽调留下可用的决策框架。因此，读者应把这份综合看作一张尽调地图：哪些已经验证，哪些仍由媒体叙事主导，哪些问题最需要直接接触管理层才能提高承销信心。
