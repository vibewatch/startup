  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与流程角色
        blocks:
          - type: paragraph
            body: >-
              从客户流程看，Huihe 销售的是面向特定高危心血管手术、由医生操作的介入工具，而不是通用医院硬件。K-Clip 把外科瓣环成形理念转化为经皮流程，瞄准重度三尖瓣反流；C-Wave
              则用血管内冲击波在最终介入前改良钙化，瞄准钙化冠脉和外周病变。Vispearl、S-wan
              等支持产品线把公司覆盖范围扩展到通路、栓塞和平台支持。因此，产品故事是实用且绑定流程的，而不是抽象概念。因此，公开尽调应先交叉核对临床证据、采购证据、医保支付逻辑和管理层披露，再把这些早期信号写进硬投资假设。中国医疗器械领域尤其需要这层语境：产品合法性往往比经济韧性、客户集中度或收入质量细节更容易在公开渠道观察到。实务上，本章应被视为对现有来源能证明什么、不能证明什么的克制综合，而不是宣称每一个关键经营指标都已经公开可见。额外文字的明确目的，是诚实保留不确定性，同时给后续尽调一个可用的决策框架。读者因此应把本综合视作一张尽调地图：它标出哪些已被验证、哪些仍由媒体主导，以及哪里获得管理层直接信息最能提升承销信心。
