  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界及其重要性
        blocks:
          - type: paragraph
            body: >-
              Huihe 并不覆盖所有心血管支出。它最相关的市场，是复杂结构性心脏病或钙化冠脉病例需要受监管介入器械、医生培训和医院采纳的狭窄但高价值子赛道。这个边界很重要，因为宽泛的 CVD
              患病率数字只能证明未满足需求，不能证明可变现需求。K-Clip 属于重度三尖瓣反流的结构性心脏病路径；C-Wave 则作为钙化改良工具嵌在 PCI
              流程里。二者对应不同科室线、不同预算对话和不同竞争集合。因此，市场问题不是中国心脏病患者是否足够多——显然足够多——而是 Huihe
              能否在自身器械真正发挥作用的具体流程里拿到有经济意义的份额。因此，公开尽调应先交叉核对临床证据、采购证据、医保支付逻辑和管理层披露，再把这些早期信号写进硬投资假设。中国医疗器械领域尤其需要这层语境：产品合法性往往比经济韧性、客户集中度或收入质量细节更容易在公开渠道观察到。实务上，本章应被视为对现有来源能证明什么、不能证明什么的克制综合，而不是宣称每一个关键经营指标都已经公开可见。额外文字的明确目的，是诚实保留不确定性，同时给后续尽调一个可用的决策框架。读者因此应把本综合视作一张尽调地图：它标出哪些已被验证、哪些仍由媒体主导，以及哪里获得管理层直接信息最能提升承销信心。
