      - number: '2.3'
        title: 增长驱动、约束与变现现实
        blocks:
          - type: paragraph
            body: >-
              看多市场的逻辑很直接：中国心血管负担很重，监管仍支持创新器械审评，医院也继续扩充微创治疗能力。但几个约束会给这个故事降温。复杂器械面临较长证据周期、中心资质要求，并且对采购和医保政策敏感。冠脉器械还笼罩在既往带量采购的阴影下；相邻耗材价格已经被大幅压低。这不意味着
              Huihe
              做不成大业务，而是公司必须先证明经济韧性，市场规模才会变得可投资。因此，公开尽调应先交叉核对临床证据、采购证据、医保支付逻辑和管理层披露，再把这些早期信号写进硬投资假设。中国医疗器械领域尤其需要这层语境：产品合法性往往比经济韧性、客户集中度或收入质量细节更容易在公开渠道观察到。实务上，本章应被视为对现有来源能证明什么、不能证明什么的克制综合，而不是宣称每一个关键经营指标都已经公开可见。额外文字的明确目的，是诚实保留不确定性，同时给后续尽调一个可用的决策框架。读者因此应把本综合视作一张尽调地图：它标出哪些已被验证、哪些仍由媒体主导，以及哪里获得管理层直接信息最能提升承销信心。
