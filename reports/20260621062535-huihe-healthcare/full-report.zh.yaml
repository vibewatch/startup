  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重性排序的风险
        blocks:
          - type: paragraph
            body: >-
              Huihe 的风险栈由少数高严重性问题主导，而不是许多小问题。披露不透明是最即时的风险，因为它同时影响估值、runway
              和信心。临床与监管执行排在其后：公司处于高风险器械品类，不良事件率、上市后质量和试验证据都很关键。定价风险更滞后但仍重要，尤其在冠脉侧，中国已经显示出通过采购政策压低器械价格的意愿。因此，公开尽调应先交叉核对临床证据、采购证据、医保支付逻辑和管理层披露，再把这些早期信号写进硬投资假设。中国医疗器械领域尤其需要这层语境：产品合法性往往比经济韧性、客户集中度或收入质量细节更容易在公开渠道观察到。实务上，本章应被视为对现有来源能证明什么、不能证明什么的克制综合，而不是宣称每一个关键经营指标都已经公开可见。额外文字的明确目的，是诚实保留不确定性，同时给后续尽调一个可用的决策框架。读者因此应把本综合视作一张尽调地图：它标出哪些已被验证、哪些仍由媒体主导，以及哪里获得管理层直接信息最能提升承销信心。
