    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、边界与平台野心
        blocks:
          - type: paragraph
            body: >-
              Huihe Healthcare 更适合被理解为 Shanghai Huihe Medical Technology Co., Ltd.：一家位于松江的未上市医疗器械公司，以 H&H Medical
              为品牌，聚焦心血管介入器械，而不是泛医院设备。从官网、关于页面、产品中心到注册资料，公司一直围绕原创器械设计、制造能力和侵入性治疗商业化来讲医工结合战略。后续章节最重要的身份事实是，Huihe 已不只是一个
              K-Clip 故事：产品中心展示的平台覆盖三尖瓣修复、冠脉和外周钙化治疗、栓塞微球、可调弯通路系统。广度抬高了商业模式天花板，也要求尽调把旗舰产品 traction
              与平台叙事拆开看，因为公开财务披露仍然很薄。因此，公开尽调应先交叉核对临床证据、采购证据、医保支付逻辑和管理层披露，再把这些早期信号写进硬投资假设。中国医疗器械领域尤其需要这层语境：产品合法性往往比经济韧性、客户集中度或收入质量细节更容易在公开渠道观察到。实务上，本章应被视为对现有来源能证明什么、不能证明什么的克制综合，而不是宣称每一个关键经营指标都已经公开可见。额外文字的明确目的，是诚实保留不确定性，同时给后续尽调一个可用的决策框架。
