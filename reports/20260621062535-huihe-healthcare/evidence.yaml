evidenceGaps:
  - type: missing-source
    severity: material
    topic: funding-gap
    missingEvidence: Exact historical round-by-round amounts, exact D-round proceeds, and total capital raised.
    whyItMatters: Capital structure affects dilution history, runway, and valuation confidence.
    diligencePath: Pull shareholder filings, investor LP reports, or authenticated Chinese VC databases.
    relatedQuestionRefs:
      - QO024
  - type: missing-source
    severity: material
    topic: governance-gap
    missingEvidence: Board composition, committee structure, and independent-director evidence.
    whyItMatters: Governance quality matters for IPO readiness and key-person risk.
    diligencePath: Obtain prospectus drafts, counseling documents, or official board biographies.
    relatedQuestionRefs:
      - QO025
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: Signed valuation term sheets or regulatory filings supporting a specific $1.1B mark.
    whyItMatters: Reported unicorn language alone is not enough to underwrite entry price.
    diligencePath: Verify with investor announcements, paid databases, or listing-counseling materials.
    relatedQuestionRefs:
      - QO023
  - type: missing-source
    severity: material
    topic: metrics
    missingEvidence: Audited revenue, headcount, account count, and cash disclosures.
    whyItMatters: The report can only infer scale without them.
    diligencePath: Request management KPI pack or audited statements.
    relatedQuestionRefs:
      - QO014
  - type: missing-source
    severity: material
    topic: tam-gap
    missingEvidence: A bottom-up count of tricuspid-annuloplasty addressable cases and active centers in China.
    whyItMatters: Without it, TAM remains range-based and conceptual.
    diligencePath: Interview structural-heart KOLs and pull provincial procedure statistics.
    relatedQuestionRefs:
      - QM022
  - type: missing-source
    severity: material
    topic: pricing-gap
    missingEvidence: Realized hospital pricing and reimbursement recovery for K-Clip and C-Wave.
    whyItMatters: Monetization determines whether market size translates into enterprise value.
    diligencePath: Request channel pricing, tender outcomes, and reimbursement case logs.
    relatedQuestionRefs:
      - QM023
  - type: missing-source
    severity: material
    topic: market-estimates
    missingEvidence: Consistent methodology across third-party market reports.
    whyItMatters: Analyst reports disagree on category boundaries and CAGR.
    diligencePath: Triangulate with public-company filings and hospital volume data.
    relatedQuestionRefs:
      - QM021
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Tender-level pricing and win-loss evidence across key accounts.
    whyItMatters: Without it, competitive intensity is partly inferred.
    diligencePath: Request distributor and hospital tender data.
    relatedQuestionRefs:
      - QP024
  - type: missing-source
    severity: material
    topic: switching
    missingEvidence: Repeat-use and churn behavior by center.
    whyItMatters: Lock-in cannot be evaluated from launch-case publicity alone.
    diligencePath: Analyze account cohorts and reorder behavior.
    relatedQuestionRefs:
      - QP025
  - type: missing-source
    severity: material
    topic: cash-runway
    missingEvidence: Cash balance, debt, and monthly burn.
    whyItMatters: Runway is the core financial diligence blocker.
    diligencePath: Request internal monthly financial dashboard.
    relatedQuestionRefs:
      - QI023
  - type: missing-source
    severity: material
    topic: revenue
    missingEvidence: Product-level revenue and gross margin.
    whyItMatters: Without it, valuation is mostly narrative-driven.
    diligencePath: Obtain audited P&L by product line.
    relatedQuestionRefs:
      - QI024
  - type: missing-source
    severity: material
    topic: quality
    missingEvidence: Public plant-level GMP and post-market quality metrics.
    whyItMatters: Operational trust needs more than approval status.
    diligencePath: Request quality-system audits and complaint logs.
    relatedQuestionRefs:
      - QE024
  - type: missing-source
    severity: material
    topic: roadmap
    missingEvidence: Release timing and economics for non-core products.
    whyItMatters: Platform breadth may overstate near-term value if products are not equally commercial.
    diligencePath: Request product-line revenue and launch plan.
    relatedQuestionRefs:
      - QE025
  - type: missing-source
    severity: material
    topic: retention
    missingEvidence: Account-level reorder, retention, and contract data.
    whyItMatters: Customer durability is the main missing commercial proof.
    diligencePath: Request cohort dashboard by center.
    relatedQuestionRefs:
      - QU024
  - type: missing-source
    severity: material
    topic: concentration
    missingEvidence: Revenue share of top hospitals and physicians.
    whyItMatters: KOL concentration could materially raise risk.
    diligencePath: Request top-account and top-physician concentration analysis.
    relatedQuestionRefs:
      - QU025
  - type: missing-source
    severity: material
    topic: operations
    missingEvidence: Supply-chain and post-market quality data.
    whyItMatters: Operational resilience is hard to score without it.
    diligencePath: Request supplier concentration and complaint logs.
    relatedQuestionRefs:
      - QR024
  - type: missing-source
    severity: material
    topic: pricing-risk
    missingEvidence: Category-specific VBP probability for IVL and structural-heart products.
    whyItMatters: Price compression timing changes valuation materially.
    diligencePath: Engage policy experts and tender specialists.
    relatedQuestionRefs:
      - QR025
  - type: missing-source
    severity: material
    topic: valuation-terms
    missingEvidence: Exact post-money valuation, liquidation preferences, and share class structure.
    whyItMatters: Entry discipline depends on terms, not just headline valuation.
    diligencePath: Obtain term sheet or investor-side confirmation.
    relatedQuestionRefs:
      - QV024
  - type: missing-source
    severity: material
    topic: exit-readiness
    missingEvidence: Official IPO-counseling or listing-preparation documents.
    whyItMatters: Exit timing materially affects return expectations.
    diligencePath: Verify with exchange / CSRC records or company counsel.
    relatedQuestionRefs:
      - QV025
