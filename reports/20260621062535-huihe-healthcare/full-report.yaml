        title: Growth drivers, constraints, and monetization realism
        blocks:
          - type: paragraph
            body: >-
              The bullish market case is straightforward: China has very high cardiovascular burden, regulators still
              support innovative-device review, and hospitals continue to expand minimally invasive treatment
              capabilities. But several constraints temper that story. Complex devices face long evidence cycles, center
              qualification requirements, and sensitivity to procurement and reimbursement policy. Coronary devices also
              live under the shadow of prior volume-based procurement rounds that crushed prices in adjacent
              consumables. That does not mean Huihe cannot build a large business; it means the company must prove
              economic durability before market size becomes investable. Public diligence should therefore triangulate
              clinical proof, procurement evidence, reimbursement logic, and management disclosures before turning any
              of these early signals into hard investment assumptions. That additional context is especially important
