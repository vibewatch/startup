  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue quality and what can actually be seen
        blocks:
          - type: paragraph
            body: >-
              Huihe's public financial evidence is structurally incomplete. No retained source publishes audited
              revenue, gross margin, burn, or cash, so the chapter cannot pretend to know unit economics that the
              evidence does not support. What is visible instead is a commercialization proxy stack: K-Clip received
              approval in March 2025, company news shows rapid hospital rollout in 2026, and late-2025 financing
              coverage says new capital would accelerate product commercialization in China and overseas. That
              combination is enough to infer that revenue exists or was expected imminently, but not enough to classify
              the quality, recurrence, or margin of that revenue. Public diligence should therefore triangulate clinical
              proof, procurement evidence, reimbursement logic, and management disclosures before turning any of these
