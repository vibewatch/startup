    sections:
      - number: '2.1'
        title: Market boundary and why it matters
        blocks:
          - type: paragraph
            body: >-
              Huihe does not sell into all of cardiovascular spending. Its most relevant markets are the narrow but
              high-value subsegments where complex structural-heart or calcified-coronary cases need regulated
              interventional devices, physician training, and hospital adoption. That boundary matters because broad CVD
              prevalence numbers can prove unmet need without proving monetizable demand. K-Clip belongs to the
              structural-heart pathway around severe tricuspid regurgitation, while C-Wave belongs inside PCI workflows
              as a calcium-modification tool. Those are different service lines, different budget conversations, and
              different competitive sets. The market question is therefore not whether China has enough heart disease—it
              clearly does—but whether Huihe can capture economically meaningful share in the specific workflows where
              its devices matter. Public diligence should therefore triangulate clinical proof, procurement evidence,
              reimbursement logic, and management disclosures before turning any of these early signals into hard
              investment assumptions. That additional context is especially important in Chinese medical devices, where
              product legitimacy can be easier to observe publicly than economic durability, customer concentration, or
