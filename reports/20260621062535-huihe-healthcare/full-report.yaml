        blocks:
          - type: paragraph
            body: >-
              The investment thesis is attractive on innovation quality: Huihe appears to have built a real
              structural-heart flagship, a credible second platform in IVL, and a broader interventional stack in one of
              the world's largest cardiovascular markets. The anti-thesis is equally clear: investors still do not know
