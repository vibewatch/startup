chapter:
  number: 3
  title: Competitors
  summary: Huihe looks most differentiated as a tricuspid structural-heart innovator and least differentiated in coronary IVL, where both multinational and domestic peers are visible. The competitive picture favors product novelty today, but it still penalizes Huihe for limited scale, narrow portfolio breadth, and unclear switching-cost evidence.
sections:
- id: landscape
  title: Landscape and overlap
  body: 'The competitive landscape is broader than direct lookalikes. Huihe faces exact device rivals in some subsegments, adjacent-platform rivals in others, and powerful incumbents almost everywhere. Structural-heart competition spans transcatheter repair and replacement approaches, while coronary-IVL competition sits inside a dense cath-lab ecosystem where alternative calcium-modification tools already exist. That means Huihe cannot rely on novelty alone: it must persuade hospitals that its workflow, evidence, and support justify allocation against better-capitalized platforms. Public diligence should therefore triangulate clinical proof, procurement evidence, reimbursement logic, and management disclosures before turning any of these early signals into hard investment assumptions. That additional context is especially important in Chinese medical devices, where product legitimacy can be easier to observe publicly than economic durability, customer concentration, or quality-of-revenue
    detail. In practice, this means the chapter should be read as a disciplined synthesis of what the retained source set can and cannot prove, rather than as a claim that every relevant operating metric is already publicly visible. The explicit purpose of the extra prose is to preserve uncertainty honestly while still giving later diligence work a usable framework for decision-making. Readers should therefore treat the synthesis as a diligence map that identifies what is verified, what remains media-led, and where direct management access would most improve underwriting confidence.'
