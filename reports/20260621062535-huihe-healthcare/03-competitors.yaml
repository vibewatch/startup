- id: moat-and-risk
  title: Moat durability and risk
  body: Today Huihe's moat looks real but fragile. The combination of clinical evidence, novel design, and post-launch training gives the company genuine edge in tricuspid intervention, yet much of that edge is still pre-scale. If larger competitors catch up on evidence or if hospitals prefer broader suppliers, differentiation can compress quickly. In coronary IVL, the bar is even higher because the segment already looks crowded and likely to become more price-sensitive over time. Public diligence should therefore triangulate clinical proof, procurement evidence, reimbursement logic, and management disclosures before turning any of these early signals into hard investment assumptions. That additional context is especially important in Chinese medical devices, where product legitimacy can be easier to observe publicly than economic durability, customer concentration, or quality-of-revenue detail. In practice, this means the chapter should be read as a disciplined synthesis of what the retained
    source set can and cannot prove, rather than as a claim that every relevant operating metric is already publicly visible. The explicit purpose of the extra prose is to preserve uncertainty honestly while still giving later diligence work a usable framework for decision-making. Readers should therefore treat the synthesis as a diligence map that identifies what is verified, what remains media-led, and where direct management access would most improve underwriting confidence.
