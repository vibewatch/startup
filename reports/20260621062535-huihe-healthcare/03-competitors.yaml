- id: positioning
  title: Positioning by segment
  body: 'K-Clip is Huihe''s most differentiated competitive wedge because it benefits from first-commercial-annuloplasty status in China and a focused clinical story. C-Wave matters strategically, but in coronary IVL Huihe is contesting a space that already includes global benchmark Shockwave and multiple domestic registration-stage peers. Distribution power also matters: large cardiovascular companies can walk into hospitals with broader portfolios, deeper service coverage, and established procurement relationships. Huihe''s counter is specialization, physician training, and a domestic-innovation narrative. Public diligence should therefore triangulate clinical proof, procurement evidence, reimbursement logic, and management disclosures before turning any of these early signals into hard investment assumptions. That additional context is especially important in Chinese medical devices, where product legitimacy can be easier to observe publicly than economic durability, customer concentration,
    or quality-of-revenue detail. In practice, this means the chapter should be read as a disciplined synthesis of what the retained source set can and cannot prove, rather than as a claim that every relevant operating metric is already publicly visible. The explicit purpose of the extra prose is to preserve uncertainty honestly while still giving later diligence work a usable framework for decision-making. Readers should therefore treat the synthesis as a diligence map that identifies what is verified, what remains media-led, and where direct management access would most improve underwriting confidence.'
