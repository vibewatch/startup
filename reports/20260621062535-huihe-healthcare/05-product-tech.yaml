- id: roadmap
  title: Deployment, support, and roadmap
  body: Deployment evidence comes from training news, multicenter clinical-trial records, and post-launch case pages. Together they suggest a roadmap built around flagship commercialization, adjacent device launches, and next-generation pipeline work in tricuspid clipping and broader vascular intervention. Support appears high-touch and center-led, which fits the category but also limits how quickly the model can scale without more field resources. Public sources do not disclose roadmap timing beyond what individual pages imply. Public diligence should therefore triangulate clinical proof, procurement evidence, reimbursement logic, and management disclosures before turning any of these early signals into hard investment assumptions. That additional context is especially important in Chinese medical devices, where product legitimacy can be easier to observe publicly than economic durability, customer concentration, or quality-of-revenue detail. In practice, this means the chapter should be
    read as a disciplined synthesis of what the retained source set can and cannot prove, rather than as a claim that every relevant operating metric is already publicly visible. The explicit purpose of the extra prose is to preserve uncertainty honestly while still giving later diligence work a usable framework for decision-making. Readers should therefore treat the synthesis as a diligence map that identifies what is verified, what remains media-led, and where direct management access would most improve underwriting confidence.
