- id: cost-and-capital
  title: Cost structure, capital adequacy, and financing dependence
  body: 'The company profile reads like a classic high-burn medtech platform: multiple Class III device programs, multicenter studies, high-end manufacturing capability, physician training, and a growing product portfolio. Those features create strategic value but they also consume capital. D-round reporting is therefore financially meaningful even without exact amount disclosure because it signals that Huihe still needed substantial external capital after K-Clip approval. The likely use of funds is clear from the articles themselves: commercialization, channel expansion, and global rollout. The missing piece is runway duration, because no source discloses cash balance or monthly burn. Public diligence should therefore triangulate clinical proof, procurement evidence, reimbursement logic, and management disclosures before turning any of these early signals into hard investment assumptions. That additional context is especially important in Chinese medical devices, where product legitimacy
    can be easier to observe publicly than economic durability, customer concentration, or quality-of-revenue detail. In practice, this means the chapter should be read as a disciplined synthesis of what the retained source set can and cannot prove, rather than as a claim that every relevant operating metric is already publicly visible. The explicit purpose of the extra prose is to preserve uncertainty honestly while still giving later diligence work a usable framework for decision-making. Readers should therefore treat the synthesis as a diligence map that identifies what is verified, what remains media-led, and where direct management access would most improve underwriting confidence.'
  claimRefs:
  - CI005
  - CI006
  - CI007
  - CI008
  - CI009
