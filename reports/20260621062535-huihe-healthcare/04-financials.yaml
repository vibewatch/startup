- id: verdict
  title: Financial verdict under evidence constraints
  body: The best financial conclusion is cautious rather than bearish. Huihe does not look like a distressed science project; it looks like a real late-stage private medtech company that is still in the expensive part of the curve where approvals and early commercialization have happened but scale efficiency is unproven. That is investable only if the entry price compensates for opacity. Until management discloses revenue quality, repeat usage, and cash adequacy, financial conviction should remain low even if product conviction is higher. Public diligence should therefore triangulate clinical proof, procurement evidence, reimbursement logic, and management disclosures before turning any of these early signals into hard investment assumptions. That additional context is especially important in Chinese medical devices, where product legitimacy can be easier to observe publicly than economic durability, customer concentration, or quality-of-revenue detail. In practice, this means the chapter
    should be read as a disciplined synthesis of what the retained source set can and cannot prove, rather than as a claim that every relevant operating metric is already publicly visible. The explicit purpose of the extra prose is to preserve uncertainty honestly while still giving later diligence work a usable framework for decision-making. Readers should therefore treat the synthesis as a diligence map that identifies what is verified, what remains media-led, and where direct management access would most improve underwriting confidence.
