- id: capital-and-milestones
  title: Funding signal, milestone chronology, and what is still missing
  body: 'The strongest financing evidence comes from multiple late-December 2025 Chinese media reports that say Huihe completed a D round of several hundred million yuan led by Taiping Healthcare Fund with Sherpa follow-on investment. An English trade translation mirrors that story and adds commercialization and global expansion language, but none of the retained sources disclose exact proceeds, post-money shares, debt facilities, or a fully auditable valuation schedule. Milestone evidence is much stronger: K-Clip''s own product page gives a specific timeline from a 2018 concept through 2021 first human implant, 2022-2024 registration studies, and 2025 approval, while 2026 training and case-news pages show rollout across multiple hospitals. That asymmetry matters. Huihe''s product and clinical chronology is well substantiated; its capital structure is not. Public diligence should therefore triangulate clinical proof, procurement evidence, reimbursement logic, and management disclosures before
    turning any of these early signals into hard investment assumptions. That additional context is especially important in Chinese medical devices, where product legitimacy can be easier to observe publicly than economic durability, customer concentration, or quality-of-revenue detail. In practice, this means the chapter should be read as a disciplined synthesis of what the retained source set can and cannot prove, rather than as a claim that every relevant operating metric is already publicly visible. The explicit purpose of the extra prose is to preserve uncertainty honestly while still giving later diligence work a usable framework for decision-making.'
