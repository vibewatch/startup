  evidenceGaps:
  - type: missing-source
    severity: material
    topic: funding-gap
    missingEvidence: Exact historical round-by-round amounts, exact D-round proceeds, and total capital raised.
    whyItMatters: Capital structure affects dilution history, runway, and valuation confidence.
    diligencePath: Pull shareholder filings, investor LP reports, or authenticated Chinese VC databases.
    relatedQuestionRefs:
    - QO024
  - type: missing-source
    severity: material
    topic: governance-gap
    missingEvidence: Board composition, committee structure, and independent-director evidence.
    whyItMatters: Governance quality matters for IPO readiness and key-person risk.
    diligencePath: Obtain prospectus drafts, counseling documents, or official board biographies.
    relatedQuestionRefs:
    - QO025
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: Signed valuation term sheets or regulatory filings supporting a specific $1.1B mark.
    whyItMatters: Reported unicorn language alone is not enough to underwrite entry price.
    diligencePath: Verify with investor announcements, paid databases, or listing-counseling materials.
    relatedQuestionRefs:
    - QO023
  - type: missing-source
    severity: material
    topic: metrics
    missingEvidence: Audited revenue, headcount, account count, and cash disclosures.
    whyItMatters: The report can only infer scale without them.
    diligencePath: Request management KPI pack or audited statements.
    relatedQuestionRefs:
    - QO014
