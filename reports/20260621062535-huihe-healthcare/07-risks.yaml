- id: operational-and-dependency
  title: Operational and dependency risks
  body: Operationally, Huihe depends on manufacturing quality, physician training, and hospital adoption sequencing. Strategically, it also depends on founder credibility, investigator networks, and regulators. These dependencies can create speed when aligned, but they become fragility when any one of them breaks. Public sources do not disclose supply-chain concentration, recall history, or field-service capacity, so operational resilience cannot be scored confidently from public evidence alone. Public diligence should therefore triangulate clinical proof, procurement evidence, reimbursement logic, and management disclosures before turning any of these early signals into hard investment assumptions. That additional context is especially important in Chinese medical devices, where product legitimacy can be easier to observe publicly than economic durability, customer concentration, or quality-of-revenue detail. In practice, this means the chapter should be read as a disciplined synthesis
    of what the retained source set can and cannot prove, rather than as a claim that every relevant operating metric is already publicly visible. The explicit purpose of the extra prose is to preserve uncertainty honestly while still giving later diligence work a usable framework for decision-making. Readers should therefore treat the synthesis as a diligence map that identifies what is verified, what remains media-led, and where direct management access would most improve underwriting confidence.
  claimRefs:
  - CR005
  - CR006
  - CR007
  - CR008
  - CR009
  tableRefs:
  - TR003
  - TR004
  figureRefs:
  - FR002
  - FR003
- id: thesis-breakers
  title: Mitigation and thesis-break triggers
  body: 'The main kill criteria are conceptually clear even if data are not: if repeat K-Clip usage stalls after early flagship cases, if C-Wave loses out to better-capitalized IVL rivals, if new financing is needed on weak terms, or if pricing pressure reaches high-volume coronary products earlier than expected, the investment case weakens quickly. Because the public record is thin, the best mitigant is disciplined diligence rather than blind optimism. Public diligence should therefore triangulate clinical proof, procurement evidence, reimbursement logic, and management disclosures before turning any of these early signals into hard investment assumptions. That additional context is especially important in Chinese medical devices, where product legitimacy can be easier to observe publicly than economic durability, customer concentration, or quality-of-revenue detail. In practice, this means the chapter should be read as a disciplined synthesis of what the retained source set can and cannot
    prove, rather than as a claim that every relevant operating metric is already publicly visible. The explicit purpose of the extra prose is to preserve uncertainty honestly while still giving later diligence work a usable framework for decision-making. Readers should therefore treat the synthesis as a diligence map that identifies what is verified, what remains media-led, and where direct management access would most improve underwriting confidence.'
