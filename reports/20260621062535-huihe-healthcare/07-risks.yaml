chapter:
  number: 7
  title: Risks
  summary: 'The main risks are not hidden in esoteric edge cases: they are disclosure opacity, clinical and regulatory execution, pricing pressure in coronary categories, and concentration around founder and KOL networks. Huihe can still work as an investment, but only if these risks are acknowledged as central rather than peripheral.'
sections:
- id: severity-ranked
  title: Severity-ranked risks
  body: 'Huihe''s risk stack is dominated by a few high-severity issues rather than many small ones. Disclosure opacity is the most immediate because it affects valuation, runway, and confidence simultaneously. Clinical and regulatory execution sit next: the company operates in high-risk device categories where adverse-event rates, post-market quality, and trial evidence matter materially. Pricing risk is more delayed but still important, especially on the coronary side where China has already shown a willingness to crush device prices through procurement policy. Public diligence should therefore triangulate clinical proof, procurement evidence, reimbursement logic, and management disclosures before turning any of these early signals into hard investment assumptions. That additional context is especially important in Chinese medical devices, where product legitimacy can be easier to observe publicly than economic durability, customer concentration, or quality-of-revenue detail. In practice,
    this means the chapter should be read as a disciplined synthesis of what the retained source set can and cannot prove, rather than as a claim that every relevant operating metric is already publicly visible. The explicit purpose of the extra prose is to preserve uncertainty honestly while still giving later diligence work a usable framework for decision-making. Readers should therefore treat the synthesis as a diligence map that identifies what is verified, what remains media-led, and where direct management access would most improve underwriting confidence.'
