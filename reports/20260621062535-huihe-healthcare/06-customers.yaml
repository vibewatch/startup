company:
  name: Huihe Healthcare
chapter:
  number: 6
  title: Customers
  summary: 'Huihe''s customer evidence is strongest where it names hospitals and procedures and weakest where investors usually care most: repeat usage, concentration, and retention. The current read is that adoption is real and widening geographically, but durable customer economics remain mostly unverified.'
sections:
- id: customer-base
  title: Customer base segmentation
  body: Huihe's visible customer universe is defined by procedure-capable hospitals, heart teams, and physician champions rather than by anonymous account counts. Most public examples sit in tertiary, teaching, or reference hospitals that can adopt complex structural-heart or calcification workflows. That suggests the company is still building through expert centers first. The breadth of provinces represented in public case news is encouraging, but it does not eliminate concentration risk because public case publicity tends to favor flagship accounts over ordinary users. Public diligence should therefore triangulate clinical proof, procurement evidence, reimbursement logic, and management disclosures before turning any of these early signals into hard investment assumptions. That additional context is especially important in Chinese medical devices, where product legitimacy can be easier to observe publicly than economic durability, customer concentration, or quality-of-revenue detail. In
    practice, this means the chapter should be read as a disciplined synthesis of what the retained source set can and cannot prove, rather than as a claim that every relevant operating metric is already publicly visible. The explicit purpose of the extra prose is to preserve uncertainty honestly while still giving later diligence work a usable framework for decision-making. Readers should therefore treat the synthesis as a diligence map that identifies what is verified, what remains media-led, and where direct management access would most improve underwriting confidence.
  claimRefs:
  - CU001
  - CU002
  - CU003
  tableRefs:
  - TU001
  - TU002
  figureRefs:
  - FU001
- id: proof-and-adoption
  title: Named customer proof and adoption trajectory
  body: The best available adoption evidence is the sequence of named case reports and training events across Shanghai, Wuhan, Xinjiang, Qingdao, Jiangsu, Sichuan, and Shandong. That footprint implies real field activity. At the same time, most proof comes from the company's own newsroom rather than independently disclosed hospital purchasing data. The result is enough evidence to believe the rollout is genuine, but not enough to infer durable utilization or customer happiness with high confidence. Public diligence should therefore triangulate clinical proof, procurement evidence, reimbursement logic, and management disclosures before turning any of these early signals into hard investment assumptions. That additional context is especially important in Chinese medical devices, where product legitimacy can be easier to observe publicly than economic durability, customer concentration, or quality-of-revenue detail. In practice, this means the chapter should be read as a disciplined synthesis
    of what the retained source set can and cannot prove, rather than as a claim that every relevant operating metric is already publicly visible. The explicit purpose of the extra prose is to preserve uncertainty honestly while still giving later diligence work a usable framework for decision-making. Readers should therefore treat the synthesis as a diligence map that identifies what is verified, what remains media-led, and where direct management access would most improve underwriting confidence.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  tableRefs:
  - TU003
  figureRefs:
  - FU002
  - FU003
- id: durability-and-risk
  title: Durability, concentration, and expansion risk
  body: No retained source discloses NRR, GRR, contract length, repeat order patterns, or top-customer share. That means durability must be inferred from qualitative patterns such as repeated clinical education, expansion into remote provinces, and one-stop combined-procedure narratives. These are good signs but not substitutes for cohort data. Customer concentration could still be high if a small number of KOL centers generate most activity, and public proof does not tell us whether expansion beyond flagship hospitals is economically smooth. Public diligence should therefore triangulate clinical proof, procurement evidence, reimbursement logic, and management disclosures before turning any of these early signals into hard investment assumptions. That additional context is especially important in Chinese medical devices, where product legitimacy can be easier to observe publicly than economic durability, customer concentration, or quality-of-revenue detail. In practice, this means the chapter
    should be read as a disciplined synthesis of what the retained source set can and cannot prove, rather than as a claim that every relevant operating metric is already publicly visible. The explicit purpose of the extra prose is to preserve uncertainty honestly while still giving later diligence work a usable framework for decision-making. Readers should therefore treat the synthesis as a diligence map that identifies what is verified, what remains media-led, and where direct management access would most improve underwriting confidence.
  claimRefs:
  - CU004
  - CU005
  tableRefs:
  - TU004
  - TU005
  figureRefs:
  - FU004
