- id: drivers-and-constraints
  title: Growth drivers, constraints, and monetization realism
  body: 'The bullish market case is straightforward: China has very high cardiovascular burden, regulators still support innovative-device review, and hospitals continue to expand minimally invasive treatment capabilities. But several constraints temper that story. Complex devices face long evidence cycles, center qualification requirements, and sensitivity to procurement and reimbursement policy. Coronary devices also live under the shadow of prior volume-based procurement rounds that crushed prices in adjacent consumables. That does not mean Huihe cannot build a large business; it means the company must prove economic durability before market size becomes investable. Public diligence should therefore triangulate clinical proof, procurement evidence, reimbursement logic, and management disclosures before turning any of these early signals into hard investment assumptions. That additional context is especially important in Chinese medical devices, where product legitimacy can be easier to
    observe publicly than economic durability, customer concentration, or quality-of-revenue detail. In practice, this means the chapter should be read as a disciplined synthesis of what the retained source set can and cannot prove, rather than as a claim that every relevant operating metric is already publicly visible. The explicit purpose of the extra prose is to preserve uncertainty honestly while still giving later diligence work a usable framework for decision-making. Readers should therefore treat the synthesis as a diligence map that identifies what is verified, what remains media-led, and where direct management access would most improve underwriting confidence.'
