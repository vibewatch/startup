- id: buyers-and-users
  title: Buyer, user, and payer logic
  body: Hospital procurement and service-line leaders typically decide whether an interventional program can add a new device, while physicians and cath-lab teams decide whether it gets used repeatedly. That split is especially important for Huihe because K-Clip requires center-building and physician training, whereas C-Wave competes more directly against established coronary tools inside a mature cath-lab workflow. Public evidence is strong enough to infer that adoption depends on both a clinical champion and an institutional budget owner. The practical implication is that Huihe's go-to-market motion must support workflow change, training, and evidence generation—not just product delivery. Public diligence should therefore triangulate clinical proof, procurement evidence, reimbursement logic, and management disclosures before turning any of these early signals into hard investment assumptions. That additional context is especially important in Chinese medical devices, where product legitimacy
    can be easier to observe publicly than economic durability, customer concentration, or quality-of-revenue detail. In practice, this means the chapter should be read as a disciplined synthesis of what the retained source set can and cannot prove, rather than as a claim that every relevant operating metric is already publicly visible. The explicit purpose of the extra prose is to preserve uncertainty honestly while still giving later diligence work a usable framework for decision-making. Readers should therefore treat the synthesis as a diligence map that identifies what is verified, what remains media-led, and where direct management access would most improve underwriting confidence.
