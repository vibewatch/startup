companyProfile:
  summary: Huihe Healthcare, operating as H&H Medical, is a Shanghai-based private cardiovascular interventional medtech company whose strongest public proof sits in product, clinical, and early commercialization evidence rather than financial disclosure. The company built K-Clip into a first-in-China transcatheter tricuspid annuloplasty product approved in March 2025, expanded into coronary and peripheral IVL with the C-Wave family, and uses a broader platform of access and adjunct devices to present itself as a multi-line interventional company. Late-2025 financing coverage suggests the business entered a new commercialization phase, but investors still need direct access to audited KPIs before treating the reported unicorn valuation as fully underwritten.
  foundedDate: '2019-01-01'
  founders:
  - name: Lin Lin
    role: Founder / chairman
    background: Former Ruijin Hospital cardiologist repeatedly cited as the clinician-founder behind Huihe's medicine-and-engineering strategy.
    claimRefs:
    - CO003
  foundingLocation: Shanghai, China
  headquarters: Shanghai, China
  productSummary: Cardiovascular interventional devices including K-Clip for tricuspid regurgitation and C-Wave IVL systems for calcified coronary and peripheral lesions, plus access and embolization products.
  customerFocus: Chinese tertiary hospitals, structural-heart teams, cath-lab operators, and physician-led reference centers.
  businessModel: Regulated medical-device sales supported by physician training, hospital rollout, and multicenter clinical evidence generation.
  stage: Late-stage private
  fundingStatus: Reported several-hundred-million-yuan Series D completed in December 2025 led by Taiping Healthcare Fund, with exact terms not publicly disclosed in retained evidence.
