  title: Risks
summary: Zyphra’s risk profile is high but understandable. The biggest issues are not hidden technical defects; they are commercialization and control-system gaps around a very ambitious product scope. Public evidence supports real technical capability, real partners, and real product surfaces, but it also shows immature public compliance packaging, AMD and partner concentration, revenue opacity, and limited customer-proof depth. The company can plausibly mitigate these risks, but investors should require concrete proof on policy controls, customer quality, and operating discipline before treating the current narrative as fully de-risked.
sections:
- id: regulatory-and-legal-risk
  title: Regulatory and legal risk
  body: 'Zyphra’s legal and regulatory risk is not that it is already in public enforcement trouble; it is that the company is operating in categories where the rulebook is tightening faster than most early-stage AI startups can commercialize. The company’s own Terms of Use explicitly say public demos and playgrounds are for evaluation only, should not receive confidential or regulated data, and do not create SLAs or production commitments. That language is prudent, but it also underlines how far the public trust package still is from enterprise-grade assurance. At the same time, public attempts to locate a privacy-policy page, acceptable-use-policy page, security page, and data-processing-agreement page at straightforward website paths returned 404s during this run. That does not prove those materials do not exist elsewhere, but it does show that the public compliance surface is not easy to inspect.


    The external rule set is moving in the opposite direction — toward more disclosure, more traceability, and more liability. The FCC has already ruled that AI-generated voices in robocalls are covered by the TCPA, the FTC has warned that AI impersonation is amplifying fraud, and the EU AI Act is introducing transparency and GPAI obligations that specifically touch deepfakes, identifiable AI-generated content, traceability, and post-market monitoring. For a company whose public wedge includes voice cloning and open-weight releases, the risk is straightforward: product capability is arriving before a clearly visible public governance package. That gap does not break the thesis today, but it raises regulatory, procurement, and brand-risk exposure.'
