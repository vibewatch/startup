- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Regulatory / voice misuse risk
    - External legal or regulatory event
    - Any enforcement action, injunction, or material misuse incident tied to voice cloning
    - Pause or reprice until controls and response quality are proven
  - - Customer-quality opacity
    - Commercial proof
    - No named production customers or retention metrics despite continued infrastructure scaling
    - Treat thesis as research-only rather than investable growth story
  - - Hardware / partner concentration
    - Delivery performance
    - AMD, IBM, or TensorWave bottleneck materially delays service quality or roadmap
    - Increase required risk discount and scrutinize contingency plans
  - - Capital intensity
    - Financing need versus proof
    - Major capacity commitments without evidence of paying demand or improving unit economics
    - Assume higher dilution / runway risk
  - - Maia execution risk
    - Product maturity
    - Maia remains strategically central but still lacks real deployment proof over time
    - Reduce application-layer upside in the thesis
  - - Compliance packaging gap
    - Trust documentation visibility
    - Enterprise-facing privacy, security, DPA, and support materials remain hard to access
    - Assume slower procurement and lower enterprise close rates
