  topStrengths:
    - >-
      Coherent technical thesis across efficient open-weight models, voice synthesis, and AMD-native cloud
      infrastructure.
    - Real strategic validation from IBM, AMD, and TensorWave reduces the risk that Zyphra is only a research narrative.
    - >-
      Public developer and product surfaces are stronger than for many private AI labs, including open repos, Hugging
      Face models, and a live cloud playground.
  topRisks:
    - >-
      No public revenue, ARR, customer-retention, or named production-customer disclosure cleanly supports the current
      valuation.
    - >-
      AMD and partner concentration create operational and policy dependency risk across both training and cloud
      delivery.
    - >-
      Open-weight distribution broadens awareness but can weaken monetization if usage does not convert into durable
      hosted or workflow revenue.
    - >-
      Voice-cloning governance and broader GPAI regulation could slow adoption before commercial proof is fully
      established.
  unresolvedGaps:
    - Current revenue, gross-margin, burn, runway, and cloud unit-economics bridge.
    - >-
      Named production customers, revenue concentration, renewals, and attach rates from open adoption into paid cloud
      usage.
    - Maia maturity, deployments, seat counts, and evidence that the workflow layer is commercially sticky.
    - >-
      Enterprise-facing privacy, security, DPA, moderation, and SLA materials that would reduce procurement and
      regulatory uncertainty.
