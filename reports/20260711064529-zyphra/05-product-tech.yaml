- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Hybrid SSM-Transformer backbones
    - Core efficiency and latency advantage for language and multimodal models
    - Internal architecture research; PyTorch / model repos
    - May be harder to communicate and benchmark than simpler baselines
  - - MoE routing and sparse activation
    - Supports larger total parameter counts with smaller active footprint
    - Training stability, routing quality, serving stack
    - Complexity in training and inference orchestration
  - - Vision encoder + MLP adapter in Zamba2-VL
    - Maps image tokens into the Zamba2 backbone
    - Qwen2.5-VL vision encoder choice
    - Dependency on third-party encoder assumptions
  - - Speaker embeddings + DAC decoder in ZONOS2
    - Voice cloning control and audio generation
    - Speaker embedding quality, audio token decoder
    - Misuse risk and evaluation complexity
  - - AMD hardware + ROCm stack
    - Training and inference substrate
    - AMD silicon supply, ROCm maturity, partner infra
    - Concentrated hardware and software dependency
  - - Cloud serving layer
    - Turns research outputs into usable APIs and capacity products
    - Reserved capacity, serverless orchestration, monitoring
    - Enterprise reliability and support expectations
  - - Open-source distribution via Hugging Face / GitHub
    - Developer adoption and transparency channel
    - Third-party distribution platforms
    - Easy competitor comparison and low switching cost
  notes: The architecture is technically coherent, but several key layers rely on partner ecosystems or open distribution channels outside Zyphra’s direct control.
