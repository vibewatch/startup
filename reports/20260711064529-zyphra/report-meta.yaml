companyProfile:
  summary: Zyphra is a San Francisco-based private Series A AI company building efficient open-weight multimodal models, a real-time voice platform in ZONOS, and an AMD-native cloud and agent infrastructure layer through Zyphra Cloud and Maia. Public evidence supports a 2025 unicorn valuation, a 2023 seed round, strategic infrastructure relationships with IBM and AMD, and a product strategy that tries to move from open model adoption into hosted inference and higher-level enterprise workflows.
