- id: market-sizing
  title: Sizing Lenses Across Voice AI, Efficient Models, and Inference
  body: 'Public sources support several adjacent sizing lenses rather than a single clean TAM. On the application side, The Business Research Company sizes global voice AI at $11.71 billion in 2026 and $32.47 billion in 2030, while Grand View Research’s narrower AI voice generator category grows from $3.5 billion in 2023 to $21.75 billion by 2030. For efficient-model demand, Grand View sizes the small language model market at $11.1 billion in 2026 and $20.7 billion in 2030. For multimodal workloads, The Business Research Company estimates a $2.83 billion market in 2026 expanding to $8.24 billion by 2030. And underneath all of these sits the infrastructure layer: Grand View estimates AI inference at $97.24 billion in 2024 and $253.75 billion by 2030.


    These markets overlap, but they are not additive. A buyer using a small language model through a hosted inference endpoint may show up in software and infrastructure estimates simultaneously. The practical implication is that Zyphra’s broad opportunity is clearly large, but its serviceable market is more constrained: the buyers most relevant to Zyphra are those choosing efficient or open-weight voice and language workloads, often with an explicit sensitivity to unit economics, portability, or hardware flexibility. That is why the pyramid uses broad inference as the outer layer, voice and efficient-model software as middle layers, and an evidence-constrained open-weight deployment wedge as the realistic top layer. No source isolates that wedge directly, so any SAM framing should be treated as directional rather than precise.'
