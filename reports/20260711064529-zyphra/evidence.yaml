evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: founder-background
    missingEvidence: >-
      Primary biographies or interviews that spell out Tomás Figliolia and Danny Martinelli's pre-Zyphra backgrounds and
      current operating remits.
    whyItMatters: >-
      Founder-market fit is central to the diligence case, and two of four founders remain lightly documented in public
      materials.
    diligencePath: >-
      Request founder bios directly from the company or corroborate through LinkedIn, conference appearances, and
      primary interviews.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Board composition, observer rights, voting rights, and any control provisions tied to seed or Series A financing.
    whyItMatters: >-
      Without governance detail it is impossible to assess investor influence, founder control, or board-level oversight
      quality.
    diligencePath: >-
      Obtain financing documents, board lists, or investor-confirmed governance summaries from the company or lead
      investors.
    relatedQuestionRefs:
      - QO008
  - type: conflicting-data
    severity: material
    topic: funding-transparency
    missingEvidence: >-
      A primary cap-table or company-confirmed funding history resolving the disagreement on founding year, Series A
      date, round amount, and strategic investor participation.
    whyItMatters: >-
      Conflicting vendor databases make it harder to trust the exact chronology and composition of Zyphra's financing
      history.
    diligencePath: >-
      Cross-check Delaware filings, company press releases, investor announcements, and direct management confirmation
      on each round.
    relatedQuestionRefs:
      - QO011
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: commercial-disclosure
    missingEvidence: >-
      Audited or management-confirmed revenue, customer count, major customer references, and cohort economics for
      Zyphra Cloud and Maia.
    whyItMatters: >-
      The company can be valued and analyzed differently if it already has meaningful cloud revenue or if it remains
      largely pre-commercial.
    diligencePath: >-
      Request customer references, revenue bridge materials, and KPI snapshots during management meetings or data-room
      review.
