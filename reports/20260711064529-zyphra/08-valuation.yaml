- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Price runs to a ~$5B private round without better commercial proof
    - Higher mark before named customers / retention / revenue quality improve
    - Upside gets pre-priced; downside asymmetry worsens
    - Avoid premium entry and revisit only with materially better evidence
  - - Revenue-quality opacity persists
    - Still no named production customers or retention metrics over time
    - Current mark becomes harder to defend as an economic asset
    - Keep recommendation at research-more or worse
  - - AMD / partner bottleneck
    - Hardware, export-control, or partner-delivery issue hits roadmap or service quality
    - Differentiation thesis becomes dependency problem
    - Increase risk discount sharply
  - - Voice regulation / misuse incident
    - Material enforcement action or reputational event tied to cloning misuse
    - Adoption and brand risk both increase
    - Reassess speech upside and legal exposure
  - - Maia fails to materialize
    - Still no real workflow deployment evidence while narrative remains central
    - Application-layer upside shrinks
    - Reduce bull-case assumptions materially
  notes: Triggers are chosen for monitorability rather than rhetorical force.
