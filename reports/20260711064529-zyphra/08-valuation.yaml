- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Revenue and margin
    - ARR, gross margin, burn, runway, capex or committed capacity economics
    - Without this, valuation remains mostly narrative
    - Company finance diligence
  - - Customer quality
    - Named customers, contract sizes, renewals, concentration, retention
    - Customer proof is the single biggest gating factor for price support
    - Company GTM / references
  - - Cloud monetization
    - Usage-to-revenue conversion, support load, unit economics, SLA ownership
    - Needed to see whether infrastructure ambition is value-creating
    - Company ops + partner diligence
  - - Maia maturity
    - Current deployments, seat counts, workflow stickiness, product roadmap
    - Application-layer upside drives the strongest bull case
    - Product diligence and customer calls
  - - Policy and compliance
    - Privacy, DPA, security packaging, moderation controls, voice-governance processes
    - Regulatory and procurement risk directly influence valuation discount
    - Legal / security diligence
  notes: A positive diligence package could move the stance toward investable; a negative one could compress fair value sharply.
