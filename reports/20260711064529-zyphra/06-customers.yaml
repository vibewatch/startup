tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Scale / strategic value
  - Public evidence
  - Key gap
  rows:
  - - Open-weight developers and researchers
    - Buyer = individual or team engineer; user = developer/researcher; payer = self-serve or experimentation budget
    - Evaluate, fine-tune, or self-host ZONOS2, Zamba, or ZAYA assets
    - Broadest visible top-of-funnel; lowest direct monetization visibility
    - GitHub, Hugging Face, and public model pages show open access and measurable community traction
    - No conversion rate from open usage to paid cloud usage
  - - Startups and product teams using hosted inference
    - Buyer = engineering or platform lead; user = application team; payer = cloud/AI budget
    - Use serverless inference for long-context and agentic workloads
    - Potentially recurring usage if latency/cost are compelling
    - Zyphra Cloud launch materials position inference as available today for production workloads
    - No public pricing, account count, or spend per account
  - - Enterprises seeking dedicated or sovereign AI infrastructure
    - Buyer = enterprise platform/IT leadership; user = infrastructure and applied-AI teams; payer = central AI or infra budget
    - Dedicated capacity, bare metal, and sovereign/open-model deployment
    - High ACV if won; likely low account count
    - Official cloud materials and MI355X announcement describe reserved capacity and bare-metal options
    - No named production enterprise buyers disclosed
  - - Frontier AI hyperscalers
    - Buyer = compute/platform leadership; user = model-serving and training teams; payer = major infrastructure budget
    - Large-scale training and inference on AMD-native infrastructure
    - Very high strategic value, potentially concentrated
    - Multiple official and partner sources explicitly name frontier AI hyperscalers as the target cohort
    - No public list of actual hyperscaler accounts
  - - Enterprise knowledge-work teams via Maia
    - Buyer = operations or productivity leadership; user = knowledge workers and cross-functional teams; payer = software or transformation budget
    - Shared-context search, chat, and workflow orchestration
    - Could become the stickiest application layer if real
    - Company and partner sources repeatedly describe Maia for enterprise knowledge workers
    - No public proof of active Maia customer deployments
  - - Voice and media builders
    - Buyer = product or creative lead; user = creators, accessibility builders, assistant developers; payer = application budget
    - Voice cloning, narration, accessibility, and conversational audio
    - Broad use-case surface and visible public evaluation wedge
    - Official and review sources describe content creation, accessibility, learning, and assistant use cases
    - No named commercial customers or deployment outcomes
  notes: Rows distinguish visible audience fit from proven paying-customer depth; “scale / strategic value” refers to likely contract importance, not disclosed revenue.
