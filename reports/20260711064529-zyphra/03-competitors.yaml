- id: switching-costs-and-moats
  title: Switching Costs, Lock-In, and Where Competitive Power Really Sits
  body: 'At first glance, switching costs look low. Many inference and speech vendors are API-delivered, several advertise OpenAI compatibility, and Hugging Face explicitly markets a single interface across multiple providers. Replicate and self-hosted routes make internal build viable for more technical teams. This is why pricing transparency matters so much in the category: public token prices from Groq, Together, Fireworks, OpenAI, and Azure indicate that at least part of the market is already shopping on economics, throughput, and operating model, not just on branded model mystique. When products are close enough on interface, buyers gain leverage.


    The deeper lock-in points still matter, but they are softer than classic enterprise software moats. Voice vendors can accumulate sticky voice assets, prompt tuning, usage analytics, brand-voice workflows, moderation policy, and procurement approvals. Inference vendors can accumulate reserved throughput contracts, deployment automation, observability, and governance configuration. Yet these are implementation and workflow moats more than hard protocol moats. Zyphra therefore needs to win on an integrated bundle — open-weight models, distinctive voice quality, AMD economics, and deployment control — because any one feature can often be matched or routed around by another provider, marketplace, or internal build path. The competitive risk register should be read through that lens.'
