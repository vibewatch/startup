- id: cost-structure
  title: Cost Structure, Gross Margin Drivers, and Unit Economics
  body: 'Zyphra’s cost structure is likely a hybrid of frontier-model R&D and cloud infrastructure delivery. The most concrete public signals are technical rather than financial: Zamba’s initial training results were achieved by a team of seven people using 128 H100 GPUs over 30 days, underscoring both the company’s efficiency orientation and the absolute compute intensity of its work. Later official and partner sources show a deeper commitment to AMD infrastructure through an IBM Cloud cluster and a later 15MW capacity announcement. These are not the economics of a pure software company with trivial cost of goods sold. Even if Zyphra does not own every asset directly, the business depends on securing and operating expensive compute capacity with software layers on top.


    That makes gross margin path a central question. Software-like margin can be achieved where Zyphra sells orchestration, differentiated models, or enterprise workflow value on top of fixed infrastructure. Lower margin is more likely where the company competes as a raw or lightly-managed GPU and inference supplier. Public pricing from peers supports that reading: the market already exposes token, character, and dedicated-capacity pricing, meaning buyers can benchmark infra-like services aggressively. The positive case is that Zyphra’s open-weight research and AMD systems expertise let it extract better economics from hardware than generic hosts can. The skeptical case is that without strong utilization and software attach, cloud revenue can look more like compute resale than premium software.'
