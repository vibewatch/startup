  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              给 Zyphra 做市场规模前，必须先划清市场边界。公司的产品组合覆盖 ZONOS 和 Zonos2 语音生成、Zamba/Zamba2 中小型语言与多模态模型，以及作为 AMD 硬件推理层的 Zyphra
              Cloud。这意味着相关支出池不是一个单一、庞大的“AI 市场”，而是三个相连类别：语音 AI 与 TTS 软件、高效 / 开放权重语言和多模态模型，以及用于把这些模型部署到生产中的推理基础设施。因此，纳入支出从
              API 消费、企业语音工作流，延伸到模型托管、推理算力和相邻开发者平台支出。排除支出包括超大规模云厂商级别的前沿模型训练预算、通用消费设备销售，以及与语音、小模型部署或多模态应用工作流没有明显关联的 AI 类别。


              现状替代方案同样重要。买方可以用 OpenAI 或云巨头的闭源模型 API、Azure、Google 或 Amazon
              的通用语音服务、通过第三方主机部署的开源模型，或者自有基础设施上的内部构建，完成同样工作。对很多企业而言，真正替代选项仍然是不采用 AI 原生工作流：Deloitte 2026 年脉搏检查显示，许多组织部署了
              AI，却没有围绕 AI 重设计工作。这意味着标题层面的 AI 采用，并不会自动转化为 Zyphra 这类供应商的生产需求。实验与重设计之间的落差，是衡量公司真实可服务市场的核心，而不是重复最宽泛的分析师 TAM。
