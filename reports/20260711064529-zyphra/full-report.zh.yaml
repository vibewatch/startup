      - number: '6.2'
        title: 采用轨迹与证据质量
        blocks:
          - type: paragraph
            body: >-
              公开采用故事始于可访问性。Zyphra 已让多个入口可被发现、可被测试：开放权重模型页面、GitHub 仓库、Hugging Face 模型卡、公开音频
              playground，以及明确称服务已经可用的云发布。这些信号有意义，因为它们说明公司不只是发布研究叙事，也在开放外部用户真正能触达的制品和接口。可量化信号也吻合这一点。检索时，ZONOS2
              的公开热度明显强于语言模型家族：Hugging Face 下载量接近两千、点赞超过一百，GitHub 仓库有数百颗星且 issue 活跃。这个模式说明，语音和推理目前是最可见的获客入口。


              下一层证据来自合作伙伴和渠道验证。IBM、AMD 和 TensorWave 都公开描述了与 Zyphra 的活跃合作，包括用于训练的多年期 IBM Cloud 部署，以及基于 MI355X 的 Zyphra
              Cloud 发布。这些来源支撑一个判断：Zyphra
              已从概念阶段研究跨入真实基础设施交付。不过，这不等同于一份广泛的具名付费客户名单。检索到的来源没有给出由客户撰写的案例研究、采购记录，或面向具名企业买方且包含结果细节的部署文章。因此，公开证据确实存在，但集中在开发者热度和具名交易对手，而不是多元化的生产客户组合。
