      - number: '3.2'
        title: 语音竞争：专业厂商与云巨头
        blocks:
          - type: paragraph
            body: >-
              在语音生成领域，ElevenLabs 是最干净的直接专业对标。其产品页面强调逼真 AI 声音、免费起步的上手路径、大型声音市场、声音克隆，以及从文本转语音延伸到会话智能体和配音的宽产品菜单。OpenAI
              从不同角度竞争：其语音文档强调可提示的 TTS、内置声音、流式传输和更广 API 集成；其定价表面显示，音频和实时模型嵌入在一个更大的开发者平台内。大型云服务商有更强分发杠杆。Azure Speech
              覆盖语音转文本、文本转语音、翻译和说话人相关工作流，并配有企业定价和配额结构。Google Cloud Text-to-Speech 加入 Gemini-TTS、高清声音和即时自定义声音。Amazon Polly
              提供全托管语音服务，拥有 40+ 语言变体中的 100+ 声音，并明确说明不会保留提交内容的隐私措辞。


              Zyphra 在这一组里的差异化不是单纯分发或目录宽度，而是开放权重姿态，以及语音模型与更广高效模型栈之间更紧的耦合。对想要比纯闭源 API 更多控制或可移植性的买方来说，这可能重要。但这也意味着 Zyphra
              要对抗渠道更强、企业采购熟悉度更高、公开包装更清楚的供应商。语音买方通常可以多栖，因为这些产品通过 API
              交付，而且越来越可编程；更难的是证明独特的语音质量、成本或控制优势足够大，足以让买方从已经嵌入工作流的既有厂商切换。
