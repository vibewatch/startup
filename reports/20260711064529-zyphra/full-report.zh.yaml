      - number: '5.4'
        title: 信任、安全、质量与产品缺口
        blocks:
          - type: paragraph
            body: >-
              最强的公开质量证据是技术性，而非运营性。Zyphra 为 Zamba2-VL、ZAYA1 和 ZONOS2 发布面向基准的叙事；ZONOS2 尤其包含对评估方法、新基准构建，以及 WER
              与语音保真度取舍的延展讨论。这很有价值，因为它显示公司认真思考模型如何衡量，而不只是发布模型。GitHub 和 Hugging Face 上的开源分发，也提升了对成果、许可证和更新节奏的透明度。


              但技术透明与企业保障之间仍有明显信任缺口。公开来源没有展示 SOC 2、ISO、正式隐私或安全控制，也没有展示针对声音克隆的详细公开审核政策。The Register 2025 年对 Zyphra
              语音模型的报道说明了为什么这很重要：开放、低摩擦的声音克隆会制造滥用风险，让治理具备商业相关性，而不是可选项。OpenAI 自身 TTS 文档明确要求披露生成声音为 AI，这展示了 Zyphra
              未来可能需要匹配的可见控制规范。产品命题在效率和开放性上很强；但至少在公开层面，合规包装和安全披露较弱。
