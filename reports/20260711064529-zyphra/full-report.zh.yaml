      - number: '7.4'
        title: 缓释因素与打破投资论点的触发器
        blocks:
          - type: paragraph
            body: >-
              总体看，Zyphra
              的风险画像很高，但可读。公司不是黑箱：它发布大量技术细节，拥有真实战略伙伴，并且已明确从纯概念跨入在线产品界面。这些都是重要缓释因素。但主要风险是累积的，不是孤立的。围绕语音克隆的监管审视可能拖慢企业采用；不成熟的公开信任和支持包装可能拖慢采购；AMD
              和合作伙伴集中可能制造交付脆弱性；收入不透明也会让外部难以判断商业化是否跟得上野心。单看任何一项都不会杀死投资论点。合在一起，它们意味着投资者应把 Zyphra
              视为一家上行空间取决于证明运营纪律、合规包装和客户变现正在追上技术速度的公司。


              尽调应对因此要务实、可监测。投资者需要具名客户证据、留存和合同数据、合作伙伴 SLA 清晰度、政策与合规材料，以及 Maia
              不只是战略叙事的证据。正确的终止标准也同样具体：围绕语音滥用出现重大监管事件；无法拿出企业安全和数据条款；AMD 或出口管制瓶颈可见并损害交付；或在基础设施承诺上升的同时，客户质量指标仍持续缺席。Zyphra
              有可能缓释其中许多风险——但前提是它把公开势能转化为可重复的运营证据。
