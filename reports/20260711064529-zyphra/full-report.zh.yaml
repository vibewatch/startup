              2021 年到 2026 年中期的时间线显示，公司从低调研究走向公开产品化和基础设施扩张。关键里程碑包括 2023 年种子轮、2024 年 Zamba、同年稍后的 Zamba2 和 tree-attention
              工作、2025 年初 Zonos、2025 年 Series A、2025 年 10 月 IBM/AMD 训练集群公告、2025 年末 ZAYA1，以及 2026 年 Zyphra Cloud
              上线。故事的负面面同样重要。The Register 对 Zonos 的实测评论认为，该模型可以从短样本生成逼真的声音克隆，并强调围绕欺诈、冒名和合成政治信息的明显滥用路径。另一个问题是，Zyphra
