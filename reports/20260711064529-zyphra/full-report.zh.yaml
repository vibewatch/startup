              模型架构负责人；Martinelli 则一致被列为联合创始人，但公开履历补充很少。已审阅来源显示，公司还有更广的运营班底，包括 Paul White，以及可信度较低目录中的 Steven Brook、Ilya
              Brown 和 Quentin Anthony；但董事会构成和治理权利仍未公开。
