      - number: '4.5'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              Zyphra 有一个可信但未证明的财务模型。正面情形是，开放权重分发、差异化研究、合作伙伴支持的 AMD
              基础设施和云产品，可以从开发者采用到企业容量合同之间创造多层变现。负面情形是，关键证明点——实际收入、实际定价、毛利率、现金消耗或现金续航——都没有公开。财务质量因此无法按业绩评分，只能按未来业绩准备度评分。


              我的判断是，公司资本强度高，变现逻辑可信，融资依赖仍然实质存在。对一家接近前沿 AI
              的初创公司来说，如果增长和客户转化强，这可以接受；但公开记录还没有显示这种强度。投资者应把已披露融资和基础设施公告视为雄心证据，而不是去风险商业模式的证据。下一步尽调要强制具体化付费使用、预留容量利用率、分产品贡献毛利，以及任何
              2026 年融资的条款或状态。
