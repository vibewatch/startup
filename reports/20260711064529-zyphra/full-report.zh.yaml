    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Zyphra 将自己定位为一家位于旧金山的开放超级智能研究与产品公司。已审阅官方材料把公司拆成两块：Zyphra Research 在异构算力上训练多模态开放模型；Zyphra Cloud
              则把这些成果商业化，做成面向开发者、企业和前沿 AI 超大规模云厂商的 AMD
              原生平台。这个组合很关键：公司不只是发布研究成果，也在搭建基础设施和应用层，并打算靠它们变现。公开描述持续强调长程记忆、持续学习、参数效率和硬件感知系统设计，而不只是追逐前沿规模参数量。当前商业表面已经覆盖无服务器推理、智能体基础设施、裸金属和专用集群产品；在这一栈之上，产品叙事是
              Maia——面向知识工作生产力的通用超级智能体。
