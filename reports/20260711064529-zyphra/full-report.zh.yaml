      - number: '5.3'
        title: 部署、集成与运营模式
        blocks:
          - type: paragraph
            body: >-
              Zyphra 的部署模型与基础设施紧密耦合。官方页面描述，Zyphra Cloud 支持开源模型的无服务器端点、延迟敏感工作负载的预留容量，以及用于大规模训练和推理的裸金属或自定义超大规模 AMD
              基础设施。公司反复把系统工作描述为全生命周期：预训练、强化学习和后训练、长上下文推理，以及智能体推理。Maia 和长周期智能体工作流似乎位于这一层之上，显示公司不只想拥有模型权重，也想拥有部署和用户工作流。


              关键运营含义是依赖集中。AMD 硬件、ROCm 成熟度、IBM Cloud 合作和伙伴基础设施执行，都直接影响产品性能和交付。这可能成为差异化，因为 Zyphra 是更可见的 AMD 原生 AI
              供应商之一；也构成可靠性和供应链风险，因为公开叙事中的产品栈并非硬件无关。开发者信号证据显示，公司确实在发布成果——GitHub 仓库、Hugging Face
              模型、公开端点——但与成熟企业平台相比，公开资料中关于可用性、可观测性、事件响应、支持 SLA 或安全认证的细节仍很稀疏。
