      - number: '4.3'
        title: 资本充足性、融资依赖与现金续航不确定性
        blocks:
          - type: paragraph
            body: >-
              资本充足性是最重要的财务问题，因为 Zyphra 在没有任何公开收入证明前，就已经同步扩张研究和基础设施。公开来源支持其披露过 $11 million 种子轮，以及 2025 年 6 月 $100 million
              Series A，已知累计融资约 $111 million。同时，第三方来源对记录存在冲突：CB Insights 的公开页面仍显示总融资只有 $11 million，因为后续细节部分受限；同时又列出传闻中的
              2026 年 $500 million 融资。Forbes 另行报道，Zyphra 正洽谈以至少 $5 billion 估值融资 $500 million。组合起来看，投资者可以确信 Zyphra
              融到过有意义的资本，但无法确信当前现金余额或 Series A 后的精确资本结构图。


              2026 年云发布和 15MW 容量公告让融资依赖更加尖锐。如果 Zyphra 认真服务训练、强化学习和大规模推理工作负载，资本需求不会止步于 Series
              A。可能的下一轮触发因素不是简单现金消耗时间，而是扩张压力：更多预留容量、更多大型训练任务、更多 Maia 产品商业化，以及更多企业支持。如果传闻中的 2026
              年融资完成，融资风险会大幅下降。如果没有完成，承销方就必须假设 Zyphra 的资本基础要同时覆盖模型 R&D、云运营和商业化落地——在没有披露现金消耗或收入的情况下，这是一个没那么舒服的结构。
