      - number: '2.3'
        title: 买方细分、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              最相关买方群体比 SAM 的精确美元规模更容易识别。当前语音 AI 支出集中在客服、虚拟助手、转录、智能设备、无障碍、媒体和品牌化语音体验。小模型和多模态支出集中在开发者平台、构建 copilots
              或智能体的产品团队，以及希望以低于前沿 API
              的服务成本获得可接受模型质量的企业。推理层里，买方关注集成基础设施、加速器选择、延迟、隐私，以及跨云或混合环境部署多个模型的运维负担。因此预算归属会变化：联络中心和数字产品团队可能负责语音采购，工程或平台组织可能负责模型托管决策，基础设施或
              CTO 组织可能负责承诺度更高的推理合同。


              采用路径通常从实验走向一个生产工作流，再进入规模化重设计。Deloitte 2026 年调查在这里有用，因为它显示这条路径仍远未完成：48% 受访者引入了 AI，却没有重设计周边工作流；只有 12%
              报告完成规模化重设计。因此，Zyphra 最适合的场景是买方已经有正在运行的语音或智能体用例，并在主动比较开放权重与闭源 API 替代方案之间的成本、控制和模型质量取舍。这一动态可能先有利于 AI
              原生初创公司、开发者优先企业、媒体与内容团队，以及受监管或主权敏感组织，而不是仍卡在试点模式的普通大型企业。
