  - id: TV005
    title: 论点破裂和终止触发项表
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 价格在商业证明未改善时跑到 ~$5B 私募轮
        - 具名客户 / 留存 / 收入质量改善前估值先上台阶
        - 上行被提前定价；下行不对称恶化
        - 避免溢价进入，只在证据显著改善后重新审视
      - - 收入质量持续不透明
        - 长期仍没有具名生产客户或留存指标
        - 当前估值作为经济资产更难支撑
        - 维持继续研究或更差建议
      - - AMD / 伙伴瓶颈
        - 硬件、出口管制或伙伴交付问题打击路线图或服务质量
        - 差异化论点变成依赖问题
        - 大幅提高风险折扣
      - - 语音监管 / 滥用事件
        - 与克隆滥用有关的重大执法行动或声誉事件
        - 采用风险和品牌风险同时上升
        - 重新评估语音上行空间和法律敞口
      - - Maia 未能落地
        - 叙事仍居核心，但依然没有真实工作流部署证据
        - 应用层上行空间收缩
        - 大幅下调牛市假设
    notes: 触发项按可监测性选择，而不是按修辞力度选择。
    claimRefs:
      - CV037
      - CV039
      - CV040
      - CV042
    sourceRefs:
      - SV003
      - SV018
      - SV029
      - SV030
      - SV031
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入和利润率
        - ARR、毛利率、烧钱速度、跑道、capex 或已承诺容量经济性
        - 没有这些，估值基本仍是叙事
        - 公司财务尽调
      - - 客户质量
        - 具名客户、合同规模、续约、集中度、留存
        - 客户证明是价格支撑最大的门槛因素
        - 公司 GTM / 客户背书
      - - 云变现
        - 用量到收入的转化、支持负载、单位经济性、SLA 责任归属
        - 需要判断基础设施雄心是否创造价值
        - 公司运营 + 伙伴尽调
      - - Maia 成熟度
        - 当前部署、席位数、工作流黏性、产品路线图
        - 应用层上行空间支撑最强牛市情景
        - 产品尽调和客户访谈
      - - 政策和合规
        - 隐私、DPA、安全包装、审核控制、语音治理流程
        - 监管和采购风险直接影响估值折扣
        - 法务 / 安全尽调
    notes: 正面尽调材料可能把立场推向可投资；负面材料可能显著压缩公允价值。
