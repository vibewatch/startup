      - number: '2.2'
        title: 语音 AI、高效模型与推理的规模测算视角
        blocks:
          - type: paragraph
            body: >-
              公开来源支持的是几条相邻规模测算视角，而不是一个干净的单一 TAM。应用侧，The Business Research Company 估算全球语音 AI 市场 2026 年为 $11.71
              billion、2030 年为 $32.47 billion；Grand View Research 更窄的 AI 语音生成器类别则从 2023 年 $3.5 billion 增至 2030 年 $21.75
              billion。高效模型需求方面，Grand View 估算小语言模型市场 2026 年为 $11.1 billion、2030 年为 $20.7 billion。多模态工作负载方面，The Business
              Research Company 估算 2026 年市场为 $2.83 billion，到 2030 年扩至 $8.24 billion。所有这些之下是基础设施层：Grand View 估算 AI 推理市场
              2024 年为 $97.24 billion，到 2030 年为 $253.75 billion。


              这些市场彼此重叠，但不能相加。买方通过托管推理端点使用小语言模型，可能同时出现在软件和基础设施估算中。实际含义是，Zyphra 的广义机会显然很大，但其可服务市场更受约束：与 Zyphra
              最相关的买方，是选择高效或开放权重语音和语言工作负载的人，通常还明确在意单位经济、可移植性或硬件灵活性。因此，金字塔把广义推理放在外层，把语音和高效模型软件放在中层，把受证据约束的开放权重部署楔形市场放在现实顶层。没有来源直接隔离这一楔形市场，所以任何
              SAM 表述都应视为方向性，而非精确数值。
