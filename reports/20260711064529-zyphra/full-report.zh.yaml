      - number: '4.4'
        title: 公开牵引力代理指标与缺失的财务披露
        blocks:
          - type: paragraph
            body: >-
              Zyphra 不披露收入或 ARR，因此最好的公开牵引力信号是间接的。公司在 Hugging Face 和 GitHub 上有可见的开放权重分发，ZONOS2 显示出可衡量的下载、点赞、star 和
              fork。Tracxn 和 EverybodyWiki 显示，2025 到 2026 年公司约有 65 至 70
              人，这一员工规模足以意味着在重大算力开支之前，就已经有不小的月度工资和基础设施开销。云和基础设施公告也显示，公司有服务真实生产工作负载的雄心，而不只是发布模型。这些信号重要，因为它们让公司看起来有商业认真度，而不只是学术探索。


              但这些不能替代财务披露。下载不等于收入，点赞不等于留存，员工数也不等于商业效率。本章纳入 C3.ai、SoundHound 和 CoreWeave
              的上市公司文件，不是因为它们是估值上的直接可比公司，而是因为它们展示了成熟投资者最终需要的正式收入、利润率、流动性和亏损披露。Zyphra
              作为私营公司，并不需要公开提供这种细节。尽管如此，尽调结论很直接：公开记录支撑产品雄心和资本强度，但不支撑收入质量、销售效率、利润率持久性或现金续航。
