      - number: '8.3'
        title: 情景区间与可比锚点
        blocks:
          - type: paragraph
            body: >-
              可比锚点主要适合作护栏，而不是精确定价工具。光谱一端，C3 AI 和 SoundHound 这类上市 AI
              应用和语音公司的市值处于低个位数十亿美元。另一端，CoreWeave、Palantir、Snowflake、Arista、Microsoft 和 NVIDIA 等 AI
              基础设施与平台赢家占据大得多的估值区间，因为它们拥有 Zyphra 尚未证明的收入规模、分发和市场权力。这些上市可比不能告诉我们 Zyphra 今天应得多少倍数，但说明两件重要事实：第一，在 AI
              资本市场语境下，$1B 私有估值并不荒唐；第二，“有意思的 AI 公司”和“规模化 AI 平台”之间的价差巨大。


              这道价差说明，情景分析比平均可比倍数更重要。熊市情景中，Zyphra
              技术上仍受尊重，但难以把开放采用转化为可变现的云和企业工作流，公允价值会被压到当前估值以下。基准情景中，产品质量保持差异化，客户证据逐步改善，今天的 $1B 估值大致说得通，但也不显得便宜。牛市情景中，公司证明
              AMD 原生基础设施、Maia 和语音能共同形成商业上重要的平台，并支撑显著更高估值。因此，传闻中的 2026 年以 $5B 或更高估值融资，应被视作情绪信号，而不是可以盲目接受的价格。
