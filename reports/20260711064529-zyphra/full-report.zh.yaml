      - number: '5.2'
        title: 模型家族与核心架构选择
        blocks:
          - type: paragraph
            body: >-
              产品差异化扎根在架构里。Zamba 通过把 Mamba 状态空间模块与共享注意力结合，推出 Zyphra 的混合设计，明确目标是比普通 Transformers 降低训练和推理开销。Zamba2-VL
              把这一理念延伸到 1.2B、2.7B 和 7B 规模的视觉语言模型，声称在准确率上大体具备竞争力，同时首 token 延迟比可比开放权重 Transformer VLM
              低约一个数量级。其描述在技术上很具体：LLaVA 式模板、Qwen2.5-VL 视觉编码器、两层 MLP 适配器和 Zamba2 混合骨干。ZAYA1
              把效率故事推进到推理，采用混合专家设计、十亿以下活跃参数、AMD 原生预训练，以及名为 Markovian RSA 的测试时计算方法。


              ZONOS2 是 Zyphra 架构理念在用户可见领域里最清楚的产品化例子。它是一个稀疏 MoE 实时 TTS 模型，拥有 900 million 活跃参数和 8 billion 总参数，以 Apache 2.0
              发布，同时提供稳定和表现力模式。公司声称它有更好的说话人相似度和韵律保真度，支持最长一分钟的多语言和语码切换音频，并且尽管规模大得多，吞吐量仍比前代高 4x。几项设计选择值得注意：用原始 UTF-8
              字节分词，而不是显式音素化；使用 ECAPA-TDNN 说话人嵌入；训练音频从约 200,000 小时大幅扩至超过 600 万小时。整个产品组合里，Zyphra
              明显在优化智能密度和部署效率，而不是标题层面的参数量。
