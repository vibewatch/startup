  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 以客户工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              Zyphra 卖的不是单一模型端点。按工作流看，它提供几层相互连接的产品。第一层是模型层：Zamba 和 Zamba2 做高效语言建模，Zamba2-VL 做多模态视觉语言任务，ZAYA1 做推理，ZONOS2
              做实时文本转语音和声音克隆。第二层是部署层：Zyphra Cloud 在 AMD 硬件上提供无服务器推理、专用容量、裸金属集群和面向智能体的推理基础设施。第三层是应用层：Maia
              被描述为面向团队的通用智能体，支持搜索、聊天和工作流。因此，客户旅程可以从开放模型发现和实验开始，进入托管推理，最终走向更高接触度的企业或智能体工作流。


              这种结构很重要，因为产品比典型点解决方案更宽。客户可以把它当作研究成果、API
              或云基础设施服务，最终也可以当作更高层生产力产品来使用。这种宽度可能是优势，因为它创造了多个采用入口；也可能是挑战，因为每一层对可靠性、安全和支持的期待都不同。公开记录清楚展示了已发布成果和基础设施表面；但企业级包装和持续支持流程则展示得少得多。
