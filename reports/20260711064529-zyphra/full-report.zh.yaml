      - number: '4.2'
        title: 成本结构、毛利驱动与单位经济
        blocks:
          - type: paragraph
            body: >-
              Zyphra 的成本结构很可能是前沿模型 R&D 与云基础设施交付的混合体。最具体的公开信号是技术性而非财务性：Zamba 初始训练结果由 7 人团队使用 128 块 H100 GPU 跑 30
              天取得，这既凸显公司的效率取向，也凸显其工作的绝对算力强度。后续官方和合作伙伴来源显示，公司通过 IBM Cloud 集群和后来的 15MW 容量公告，更深地投入 AMD
              基础设施。这不是一家纯软件公司、成本极低的经济模型。即使 Zyphra 不直接拥有每项资产，业务也依赖获取并运营昂贵算力容量，再在其上叠加软件层。


              因此，毛利路径是核心问题。当 Zyphra 在固定基础设施之上销售编排、差异化模型或企业工作流价值时，才可能实现软件式利润率。当公司以原始或轻托管 GPU
              与推理供应商身份竞争时，利润率更可能较低。同行公开定价支持这一判断：市场已经暴露 token、字符和专用容量价格，意味着买方可以激进地对标基础设施型服务。正面情形是，Zyphra 的开放权重研究和 AMD
              系统专长，让它比通用主机更能从硬件中榨出经济性。怀疑情形是，如果没有强利用率和软件附着，云收入可能更像算力转售，而不是高溢价软件。
