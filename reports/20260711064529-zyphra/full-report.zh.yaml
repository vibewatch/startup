      - number: '6.3'
        title: 耐久性、重复使用与扩张
        blocks:
          - type: paragraph
            body: >-
              耐久性是公开证据最弱的地方。Zyphra 不披露客户数、NRR、GRR、流失率、续约率、合同期限，也没有任何关于重复使用的 cohort 视图。它也不发布客户撰写的 ROI
              案例或详细部署结果，无法让投资者间接推断留存质量。评测目录页面之所以有启发性，正因为它们很稀疏：SourceForge 没列出任何集成，评分面板为 0.0/5；Slashdot
              在检索时列出培训文档和在线支持字段，但没有集成。这些不是对产品本身的负面裁决，而是说明商业评测足迹仍然很浅。


              扩张故事更像是合理推演，还不是已被证明的事实。Zyphra 的栈覆盖开放模型、托管推理、专用容量、裸金属集群，以及 Maia 中最终可能出现的智能体工作流层。这形成了一条合乎逻辑的 land-and-expand
              路径：用户可能先试用开放模型，再迁移到托管推理，然后购买专用基础设施，最终采用更高层工作流。但在管理层披露转化、续约或多产品使用数据之前，这仍是假设。最稳妥的尽调立场是：留存未知，扩张可能，商业化成熟度仍早期，而非已经充分证明。
