      - number: '3.4'
        title: 切换成本、锁定与竞争力真正所在
        blocks:
          - type: paragraph
            body: >-
              乍看之下，切换成本很低。许多推理和语音供应商通过 API 交付，几家宣传 OpenAI 兼容，Hugging Face 还明确营销跨多个提供商的单一界面。Replicate
              和自托管路径让技术更强的团队更容易内部构建。这就是为什么定价透明度在这个类别如此重要：Groq、Together、Fireworks、OpenAI 和 Azure 的公开 token
              价格表明，至少部分市场已经在按经济性、吞吐量和运营模式购物，而不只是看品牌模型光环。只要产品界面足够接近，买方就获得杠杆。


              更深的锁定点仍重要，但比经典企业软件护城河更软。语音供应商可以积累黏性的声音资产、提示调优、使用分析、品牌声音工作流、审核政策和采购审批。推理供应商可以积累预留吞吐合同、部署自动化、可观测性和治理配置。但这些更多是实施和工作流护城河，而不是硬协议护城河。因此，Zyphra
              需要靠一个集成组合取胜——开放权重模型、独特语音质量、AMD 经济性和部署控制——因为任何单一功能通常都能被另一个提供商、市场或内部构建路径匹配或绕开。竞争风险登记表应放在这个视角下阅读。
