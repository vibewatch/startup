      - number: '7.2'
        title: 运营、质量与平台风险
        blocks:
          - type: paragraph
            body: >-
              从运营看，Zyphra 正在完成一段困难转型：从拥有亮眼公开发布的研究实验室，转向生产级基础设施公司。公开材料显示了真实进展：Zyphra Cloud 已上线，15MW MI355X
              足迹已经宣布，平台也以长上下文、智能体和裸金属工作负载为卖点。但同一批材料也暴露出，这个栈承载了很重的执行负担。公司试图同时交付模型、kernel、量化、大规模服务、工作流产品和合作伙伴管理的基础设施。其
              Terms of Use 一边否认公开 demo 的性能承诺，一边提示输出可能不准确或不适用；这属于正常法律文本，但也提醒投资者，公开界面仍不像成熟企业服务那样被定位。


              公开评测页面也强化了早期产品化的印象。SourceForge 和 Slashdot 列出了 Zyphra
              Cloud，但集成稀少，评测密度几乎没有；这不等于否定质量，却说明产品在商业引用度上仍处早期。更重要的是，整个基础设施故事都围绕 AMD 和合作伙伴交付展开。IBM、AMD 和 TensorWave
              都被呈现为规模化的关键赋能方。若执行保持强劲，这种集中在战略上有用；但它也让运营对合作伙伴路线图、支持质量、ROCm 成熟度和 Zyphra 不能直接控制的供应条件变得敏感。
