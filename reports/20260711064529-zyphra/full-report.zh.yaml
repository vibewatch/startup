              资本故事方向清楚，但细节并不完全干净。多家公开来源支持其在 2023 年完成约 $11 million 种子轮，并在 2025 年 6 月以 $1 billion 估值完成 Series A；AMD 和 IBM
              的合作伙伴新闻稿也确认，截至 2025 年 10 月，Zyphra 近期已按 $1 billion 估值完成 Series A。Nextomoro 和 EverybodyWiki 将这轮 Series A 归因于
              Jaan Tallinn，并称规模为 $100 million；CB Insights 支持 2025 年 6 月 $1 billion 估值，以及早期种子投资方 Intel Capital、Future
              Ventures 和 Bison Ventures。公开数据库随后在具体轮次条目上分化：Tracxn 列出 2025 年 10 月一轮由 IBM 和 AMD 参与的 Series A；CB Insights 显示
              2026 年 5 月传闻中的 $500 million 融资；Forbes 报道 Zyphra 正在以至少 $5 billion 估值筹集至少 $500 million，AMD 参与其中。实际结论是：Zyphra
              明确跨入独角兽区间，拥有来自主要算力伙伴的战略资本或战略协同，并且正在再次融资；但具体股权结构和轮次时间线在公开层面并不完全透明。
