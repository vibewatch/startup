      - number: '1.4'
        title: 产品、基础设施与公开规模信号
        blocks:
          - type: paragraph
            body: >-
              对一家仍为私营的 AI 初创公司来说，Zyphra 的公开产出异常宽。模型侧，Zamba2 是旗舰高效语言模型家族，明确开源，并定位为比同等规模稠密 Transformer 同行更快、更轻。ZONOS2
              把同一套效率命题扩展到语音，用稀疏 MoE 设计实现实时 TTS 和高保真声音克隆。ZAYA1 进入在 AMD 硬件上训练的推理模型；Maia 则是这些模型和基础设施押注要支撑的应用层。基础设施侧，IBM 和
              AMD 描述了一项多年计划，要在 IBM Cloud 上为 Zyphra 提供大型 MI300X 集群；Zyphra 自身材料称其在 2025 年 9 月获得早期访问，并随后通过 TensorWave 获得基于
              MI355X 的云容量。明显缺失的是硬商业披露：已审阅公开来源没有提供经审计收入、ARR 或具名客户标识，公开员工数估计也只在约 65 至 70 人之间。
