  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Zyphra 的法律和监管风险，不在于它已经陷入公开执法麻烦；而在于公司所处赛道的规则正在收紧，速度快过多数早期 AI 创业公司的商业化节奏。公司自己的 Terms of Use 明确写明，公开 demo 和
              playground 仅供评估，不应接收机密或受监管数据，也不构成 SLA
              或生产承诺。这套措辞审慎，但也凸显出，公开信任包距离企业级保障仍有多远。同时，本轮检索尝试在直观网站路径中查找隐私政策、可接受使用政策、安全页面和数据处理协议页面，结果均返回
              404。这不能证明这些材料不存在于其他地方，但说明公开合规界面不容易检查。


              外部规则集正朝相反方向移动——披露更多、可追溯性更强、责任更重。FCC 已裁定，robocall 中的 AI 生成语音受 TCPA 覆盖；FTC 警告 AI 冒充正在放大欺诈；EU AI Act 正在引入透明度和
              GPAI 义务，明确触及深度伪造、可识别的 AI
              生成内容、可追溯性和上市后监测。对一家公开切口包括语音克隆和开放权重发布的公司来说，风险很直接：产品能力先于清晰可见的公开治理包到来。这个缺口今天还不会打破投资论点，但会提高监管、采购和品牌风险暴露。
