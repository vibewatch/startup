  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础与分层
        blocks:
          - type: paragraph
            body: >-
              Zyphra 的公开客户分层，比单一模型创业公司更宽，但还没到成熟企业软件公司的广度。公司自己的云材料反复称，平台面向开发者、企业和前沿 AI 超大规模厂商；Maia
              则被包装成面向团队和知识工作者的协作式超级智能体。这意味着买方和用户有多层。开放权重模型的用户，可能从个人开发者或研究团队开始，他们通过 GitHub、Hugging Face 或公开云 playground
              评估 ZONOS2、Zamba 或 ZAYA。托管推理买方更像是创业公司和企业内部的工程或平台预算负责人，他们需要生产级服务、长上下文负载或专用 GPU 访问。若 Maia
              按现有描述商业化，用户会沿栈上移，变成重视共享上下文和工作流自动化的企业知识工作团队，而不只是需要原始模型访问。


              这种分层很关键，因为它解释了为什么公开需求证据最强的地方是开发者渠道，而企业级证据仍然稀疏。开发者端很容易观察：公开 repo、模型 hub 和可访问的评估流程。企业需求更难验证，因为公司没有公布具名客户
              logo、账户数量或分业务收入拆分。本章最有支撑的结论是，Zyphra 从个人构建者到大型基础设施买方之间有一条可信的分层阶梯；但公开记录对目标受众和产品适配的证明，仍远强于对已实现客户广度的证明。
