  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 景观定义：Zyphra 实际与谁竞争
        blocks:
          - type: paragraph
            body: >-
              不能只拿 Zyphra 和某一类公司对标。它的语音产品与 ElevenLabs 等专业语音平台竞争，也与 OpenAI、Azure、Google Cloud 和 Amazon
              的更广泛语音平台竞争。它的高效语言、多模态和云产品，则与 Groq、Together AI、Fireworks AI、Replicate、Hugging Face 提供商市场等开放模型主机和推理平台竞争，也与
              Mistral、Gemma 等开放模型生态竞争；这些生态让内部构建或第三方托管更有吸引力。因此，真正的现状替代方案是碎片化的：有的买方采购托管语音
              API，有的购买多模型推理平台，有的把开放模型与自管或市场基础设施组合起来。


              这种碎片化很重要，因为它改变了“直接竞争对手”的含义。ElevenLabs 是语音质量和声音克隆工作流的直接竞争者，但不是 Zyphra Cloud 的直接竞争者。Together 或 Fireworks
              是开放模型部署和成本敏感推理的直接竞争者，但不是终端用户语音品牌化的直接竞争者。Azure、Google 和 OpenAI
              是更广泛的既有巨头，可以把语音、模型、开发者工具和企业采购打包成一段关系。因此，本章按买方任务组织竞争地图：语音创作、模型访问和部署控制。这样比把所有对手强行塞进一个纯玩家桶里更准确。
