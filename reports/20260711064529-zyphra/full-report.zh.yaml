      - number: '8.4'
        title: 建议与尽调路径
        blocks:
          - type: paragraph
            body: >-
              正确建议是继续研究，而不是买入。Zyphra 的真实技术和战略相关性太强，不能忽视；但公开商业证据太少，不足以有把握地承销溢价进入。当前 $1B 估值可以被辩护为押注一个差异化 AI
              平台的期权，但它已经要求投资者相信未来变现，多过相信当前经济性。只有尽调能快速补上最大缺口时，这才可接受：具名客户、留存、使用到收入的转化、支持和政策包装，以及 Maia 成熟度。


              投资者应明确入场纪律。如果未来一轮在 Zyphra 拿出更好客户和经济性证据之前，真的以 $5B 成交，估值立场会更难支撑，下行不对称也会恶化。反过来，如果公司能展示强劲云变现、可见客户质量，并证明 Maia
              正在成为真实工作流产品，而不是愿景层，那么当前估值最终可能显得保守。在这些证据出现之前，最佳立场是保持接触、加深尽调，并把 Zyphra 视为一家可能重要、但当前估值仍更多依赖承诺而非充分商业证据的公司。
