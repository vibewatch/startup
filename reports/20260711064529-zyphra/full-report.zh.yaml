        - 公开市场结构和既有业务足迹不同
      - - CoreWeave
        - 公开市值
        - 2026 年 7 月为 $48.49B
        - 作为 AI 基础设施赢家有参考价值：若云经济性跑通，上行空间可观
        - 规模、披露和资本基础都远超今天的 Zyphra
      - - Palantir
        - 公开市值
        - 2026 年 7 月为 $303.95B
        - 展示工作流和平台软件可以达到极大市场价值
        - 比 Zyphra 成熟、多元且经验证得多
      - - Arista Networks
        - 公开市值
        - 2026 年 7 月为 $235.41B
        - 可用于观察基础设施质量和硬件邻近网络效应
        - 不是 AI 模型实验室或语音公司
      - - Snowflake
        - 公开市值
        - 2026 年 7 月为 $90.61B
        - 软件规模化结果下，云数据平台的估值锚
        - 产品经济性和客户基础不同
    notes: 该表是一组估值护栏，不是字面上的同业倍数混合。
