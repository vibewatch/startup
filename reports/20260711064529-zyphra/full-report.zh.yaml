      - number: '2.4'
        title: 增长驱动、摩擦与采用节奏含义
        blocks:
          - type: paragraph
            body: >-
              结构性增长驱动在多个来源中都很清楚。语音 AI 受益于多语言需求、API 变现，以及企业对更自然界面的兴趣。多模态 AI
              被会话系统、智能手机采用，以及文本、语音、图像和视频的更广泛组合使用往前拉。小语言模型的重要性上升，因为它们更容易定制、服务成本更低；推理市场也在扩张，因为企业需要更快部署、低延迟处理和更集成的算力平台。OpenRouter
              2026 年开放权重调查给 Zyphra 增加了一个尤其相关的视角：开放权重模型通常只落后闭源前沿实验室几个月，同时在规模化使用时往往能显著省成本。


              采用摩擦对估值同样重要。Deloitte 显示，组织常常部署 AI，却没有完成工作流重设计、治理成熟度建设或扎实的价值衡量。Bluelight
              认为，开放权重部署可以提升可审计性和可移植性，但往往牺牲部分能力，并把更多安全和 MLOps 负担转给买方。Voices 2026
              年调查显示，商业语音场景看重质量和真实性，而不只是基本功能。International AI Safety Report 还强调了更广的背景风险：随着先进 AI
              扩散，恶意使用、模型失败和系统性伤害会带来更大后果。对 Zyphra 来说，这意味着市场顺风真实存在，但收入转化取决于它能否证明：开放权重、AMD
              友好、高质量语音和语言工作负载，比既有替代方案更能跨过治理、质量和运营门槛。
