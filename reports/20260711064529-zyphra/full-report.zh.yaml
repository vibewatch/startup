      - number: '6.4'
        title: 集中度、渠道依赖与负面信号
        blocks:
          - type: paragraph
            body: >-
              核心客户风险是集中度。Zyphra 公开宣称的受众是开发者、企业和前沿 AI 超大规模厂商，但可见的高价值证据集中在少数主要交易对手：IBM、AMD 和
              TensorWave。这在战略上有用，因为这些名字带来可信度和分发杠杆；同时也有风险，因为客户价值部分受合作伙伴表现、芯片供应和联合 go-to-market 执行影响。如果 Zyphra
              拿下大客户，这些账户很可能战略重要且数量相对有限，会放大时间、采购和集中度风险。


              语音侧还存在特定细分市场的采用风险。ZONOS2
              的质量和实时访问能力构成了有吸引力的开发者切口，但关于语音克隆滥用的公开报道说明，部分企业买方在扩大使用前，可能需要更强的政策和治理保障。更广义地说，可见开发者活动与不可见的收入质量客户证据之间存在失衡，投资者不应把社区触达误判为耐久商业牵引。Zyphra
              似乎确实能进入重视开放、AMD 原生 AI 基础设施的客户细分，但公开记录仍要求对付费部署深度、集中度和工作流粘性做直接尽调。
