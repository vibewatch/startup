        - 一旦拿下，ACV 高；账户数可能偏少
        - 官方云材料和 MI355X 公告描述预留容量和裸金属选项
        - 未披露具名生产企业买家
      - - 前沿 AI 超大规模客户
        - 买方 = 计算 / 平台领导层；用户 = 模型服务和训练团队；付款方 = 重大基础设施预算
        - 在 AMD 原生基础设施上做大规模训练和推理
        - 战略价值很高，且可能高度集中
        - 多个官方和合作伙伴来源明确把前沿 AI 超大规模客户列为目标群体
        - 没有实际超大规模客户账户的公开名单
      - - 通过 Maia 触达的企业知识工作团队
        - 买方 = 运营或生产力领导层；用户 = 知识工作者和跨职能团队；付款方 = 软件或转型预算
