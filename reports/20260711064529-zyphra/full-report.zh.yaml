      - number: '3.3'
        title: 开放模型与推理竞争：主机、市场与模型生态
        blocks:
          - type: paragraph
            body: >-
              部署侧，Zyphra 面对另一类对手。Groq 强调自研芯片和极快推理，并明确给出每秒 token 数和按 token 定价。Together AI
              把自己定位为面向开源模型、研究优化的全栈云，提供无服务器、专用和训练产品，并为承诺容量提供 99% 可用性 SLA。Fireworks AI 强调开放模型经济性、微调，以及每天处理 30T+ tokens
              等规模标志。Replicate 提供围绕社区模型、微调和通过 Cog 部署自定义模型的灵活开发者路径，定价取决于算力使用，以及私有模型是否跑在专用硬件上。Hugging Face Inference
              Providers 又一次改变竞争框架：它把多个提供商聚合在一个 API 下，并明确营销低锁定和不对提供商费率加价。


              Mistral 和 Gemma 从模型层本身加深了 Zyphra 面临的压力。Mistral 的 Studio 信息强调混合、专用和自托管部署，以及治理和可观测性，这与 Zyphra
              想讲的控制导向企业故事重叠。Gemma 强调开放模型可以从云服务器跑到笔记本和手机，进一步说明高效、可移植模型已经不再是小众类别。含义很清楚：即使 Zyphra
              没有输给某个具名对手，也可能输给一条生态路径——买方从一个供应商挑开放模型，再通过另一个提供商托管。这样多栖很容易，商品化压力也会持续存在。
