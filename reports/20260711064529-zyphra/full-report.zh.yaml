      - - 使用托管推理的初创公司和产品团队
        - 买方 = 工程或平台负责人；用户 = 应用团队；付款方 = 云 / AI 预算
        - 用 serverless inference 支撑长上下文和 agentic 工作负载
        - 如果延迟和成本有吸引力，可能形成经常性使用
        - Zyphra Cloud 发布材料把推理定位为今天即可服务生产工作负载
