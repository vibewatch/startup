  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与变现逻辑
        blocks:
          - type: paragraph
            body: >-
              与当前收入相比，Zyphra 的变现模型更容易推断。官方页面显示，云业务围绕无服务器推理、专用容量、裸金属 GPU
              集群和自定义超大规模部署构建。这些表面意味着至少三条主要收入流：按量计费的云推理、预留或专用基础设施合同，以及围绕 Zyphra
              模型层搭建的企业软件或服务。公司的开放权重模型发布很可能同时承担产品和分发功能：它们可以带来开发者采用和可信度，再把用户拉入托管或企业部署产品。可能的商业逻辑类似漏斗：免费或开放模型访问创造注意力，托管端点捕获使用收入，专用基础设施或企业编排捕获更大合同。


              关键问题是，这些都没有公开量化。Zyphra 没有发布推理、预留容量或企业捆绑的标准价目表。这个缺口重要，因为同行会发布变现表面。OpenAI 给音频和实时 API 定价；Azure
              展示语音定价层级和配额；Groq、Together、Fireworks 和 Replicate 都以某种形式展示使用或部署价格。Zyphra
              可能仍在使用协商式企业定价，或因为云发布较新而仍在调整包装；但从尽调角度看，缺少标价意味着实际价格、折扣和收入结构仍未知。公司看起来有可信收入流，但收入质量尚不能从外部看清。
