              公开资料一致将 Krithik Puthalath、Beren Millidge、Tomás Figliolia 和 Danny Martinelli 认定为 Zyphra 创始团队。Krithik
              是业务最清晰的公开面孔：AMD、IBM、公司材料和财经新闻都以创始人兼 CEO 身份引用他，部分合作伙伴材料称其为 CEO 兼董事长。Millidge 在自述和第三方资料中都被描述为联合创始人，并领导
