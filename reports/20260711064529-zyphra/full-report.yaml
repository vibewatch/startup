      - number: '7.2'
        title: Operational, quality, and platform risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, Zyphra is attempting a difficult transition from a research lab with impressive public
              releases into a production infrastructure company. Public materials show real progress: Zyphra Cloud is
              live, a 15MW MI355X footprint has been announced, and the platform is marketed for long-context, agentic,
              and bare-metal workloads. But these same materials also reveal how much execution burden sits in the
              stack. The company is trying to deliver models, kernels, quantization, large-scale serving, workflow
              products, and partner-managed infrastructure at once. Its Terms of Use simultaneously disclaim performance
              commitments for public demos and note that outputs may be inaccurate or unsuitable, which is normal legal
              drafting but a reminder that the public surface is still not framed like a mature enterprise service.


              Public review surfaces reinforce that impression of early productization. SourceForge and Slashdot list
              Zyphra Cloud but show sparse integrations and almost no review density, which does not indict quality but
              does suggest the product is still early in commercial referenceability. More importantly, the entire
              infrastructure story is concentrated around AMD and partner delivery. IBM, AMD, and TensorWave are all
              presented as key enablers of scale. That concentration is strategically useful if execution stays strong,
              yet it creates operational sensitivity to partner roadmaps, support quality, ROCm maturity, and supply
              conditions outside Zyphra’s direct control.
