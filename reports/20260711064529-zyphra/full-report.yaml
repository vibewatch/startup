  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Status-Quo Alternatives
        blocks:
          - type: paragraph
            body: >-
              Zyphra’s market should be defined before it is sized. The company’s product set spans ZONOS and Zonos2
              voice generation, Zamba/Zamba2 small-to-mid-size language and multimodal models, and Zyphra Cloud as an
              inference layer on AMD hardware. That means the relevant spend pools are not a single monolithic “AI
              market,” but three connected categories: voice AI and TTS software, efficient/open-weight language and
              multimodal models, and inference infrastructure used to deploy those models in production. The included
              spend therefore ranges from API consumption and enterprise voice workflows to model hosting, inference
              compute, and adjacent developer platform spend. Excluded spend includes frontier-model training budgets at
              hyperscaler scale, generic consumer device sales, and AI categories with no obvious connection to voice,
              small-model deployment, or multimodal application workflows.


              The status quo substitutes are equally important. Buyers can solve the same jobs with closed-model APIs
              from OpenAI or cloud incumbents, general-purpose speech services from Azure, Google, or Amazon,
              open-source models served through third-party hosts, or internal builds on their own infrastructure. For
              many enterprises, the real alternative is still not adopting AI-native workflows at all: Deloitte’s 2026
              pulse check shows many organizations have deployed AI without redesigning work around it, which means
              headline AI adoption does not automatically translate into production demand for vendors like Zyphra. That
              gap between experimentation and redesign is central to sizing the company’s true served market rather than
              repeating the broadest possible analyst TAM.
            claimRefs:
              - CM001
              - CM016
              - CM019
              - CM020
