      - number: '5.4'
        title: Trust, Safety, Quality, and Product Gaps
        blocks:
          - type: paragraph
            body: >-
              The strongest public quality evidence is technical rather than operational. Zyphra publishes
              benchmark-oriented narratives for Zamba2-VL, ZAYA1, and ZONOS2, and ZONOS2 in particular includes an
              extended discussion of evaluation methodology, new benchmark construction, and tradeoffs between WER and
              voice-fidelity. That is valuable because it suggests the company thinks seriously about how models are
              measured, not just about shipping them. Open-source distribution on GitHub and Hugging Face also improves
              transparency into artifacts, licenses, and update cadence.


              However, there is a meaningful trust gap between technical transparency and enterprise assurance. Public
              sources do not surface SOC 2, ISO, formal privacy or security controls, or a detailed public moderation
              policy for voice cloning. The Register’s 2025 coverage of Zyphra’s speech model highlights why that
              matters: open, low-friction voice cloning creates misuse risk and makes governance commercially relevant,
              not optional. OpenAI’s own TTS documentation explicitly requires disclosure that generated voices are AI,
              illustrating the kind of visible control norm Zyphra may eventually need to match. The product thesis is
              strong on efficiency and openness; it is weaker, at least publicly, on compliance packaging and safety
              disclosure.
