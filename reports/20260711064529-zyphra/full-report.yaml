      - number: '2.4'
        title: Growth Drivers, Frictions, and What They Mean for Adoption Timing
        blocks:
          - type: paragraph
            body: >-
              The structural growth drivers are visible across multiple sources. Voice AI is benefiting from
              multilingual demand, API monetization, and enterprise interest in more natural interfaces. Multimodal AI
              is being pulled forward by conversational systems, smartphone adoption, and broader use of text, voice,
              image, and video together. Small language models are gaining relevance because they can be easier to
              customize and cheaper to serve, while the inference market is expanding as enterprises need faster
              deployment, low-latency processing, and more integrated compute platforms. OpenRouter’s 2026 open-weight
              survey adds a particularly relevant lens for Zyphra: open-weight models remain only a few months behind
              closed-model frontier labs while often offering meaningful cost savings at scale.


              The adoption frictions are just as important for valuation. Deloitte shows organizations frequently deploy
              AI without workflow redesign, governance maturity, or robust value measurement. Bluelight argues that
              open-weight deployment can improve auditability and portability but often trades off some capability and
              transfers more security and MLOps burden to the buyer. Voices’ 2026 survey suggests quality and
              authenticity matter in commercial voice settings, not just basic functionality. And the International AI
              Safety Report highlights the broader background risk: malicious use, model failures, and systemic harms
              become more consequential as advanced AI diffuses. For Zyphra, that means the market tailwind is real, but
              conversion to revenue will depend on proving that open-weight, AMD-friendly, high-quality voice and
              language workloads can clear governance, quality, and operations hurdles better than incumbent
              alternatives.
            claimRefs:
              - CM024
