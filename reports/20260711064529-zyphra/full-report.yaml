  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition in Customer Workflow Terms
        blocks:
          - type: paragraph
            body: >-
              Zyphra is not selling a single model endpoint. In workflow terms, it offers several interconnected layers.
              First is the model layer: Zamba and Zamba2 for efficient language modeling, Zamba2-VL for multimodal
              vision-language tasks, ZAYA1 for reasoning, and ZONOS2 for real-time text-to-speech and voice cloning.
              Second is the deployment layer: Zyphra Cloud exposes serverless inference, dedicated capacity, bare-metal
              clusters, and agent-oriented inference infrastructure on AMD hardware. Third is the application layer:
              Maia is described as a general agent for teams, with search, chat, and workflow support. The customer
              journey can therefore start with open model discovery and experimentation, then move into hosted
              inference, and finally into higher-touch enterprise or agent workflows.


              This structure matters because the product is broader than a typical point solution. Customers can engage
              it as a research artifact, as an API or cloud infrastructure service, or eventually as a higher-level
              productivity product. That breadth can be a strength because it creates multiple adoption entry points. It
              can also be a challenge because each layer carries different expectations for reliability, security, and
              support. The public record shows released artifacts and infrastructure surfaces clearly; it shows
              enterprise-grade packaging and ongoing support processes much less clearly.
            claimRefs:
