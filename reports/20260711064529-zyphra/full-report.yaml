  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Price context and valuation frame
        blocks:
          - type: paragraph
            body: >-
              Zyphra’s valuation problem is simple to describe and hard to solve cleanly: the company has a real product
              and research story, a confirmed unicorn mark from 2025, and a narrative that fits investor appetite for
              sovereign or open AI infrastructure — but it lacks the commercial disclosure that would let an outsider
              underwrite that price conventionally. Public sources support a $1 billion valuation around the 2025 Series
              A and suggest the round was roughly $100 million, but public databases disagree on some chronology details
              and no fetched source discloses revenue, ARR, gross margin, or customer concentration. That means the
              current mark cannot be justified using standard revenue multiple logic with any precision.


              Instead, valuation has to be framed as milestone and option value. Investors are effectively paying for
              the possibility that Zyphra’s efficient-model research, voice differentiation, AMD-native cloud, and Maia
              workflow layer become a commercially coherent platform. The trouble is that much of the evidence today
              supports the platform’s technical reality, not the price of its commercial future. In valuation terms,
              that moves the analysis away from “what multiple does this deserve on current fundamentals?” and toward
              “how much future proof is already priced in at $1 billion, and how much more proof is required before
              paying materially above that?”
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
