  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape Definition: Who Zyphra Actually Competes Against'
        blocks:
          - type: paragraph
            body: >-
              Zyphra should not be benchmarked against only one company class. Its voice products compete with
              specialist voice platforms such as ElevenLabs and with broader speech platforms from OpenAI, Azure, Google
              Cloud, and Amazon. Its efficient language, multimodal, and cloud products compete with open-model hosts
              and inference platforms such as Groq, Together AI, Fireworks AI, Replicate, and Hugging Face’s provider
              marketplace, plus open-model ecosystems like Mistral and Gemma that make internal build or third-party
              hosting more attractive. The real status quo alternative is therefore fragmented: some buyers purchase a
              managed speech API, some buy a multi-model inference platform, and some combine open models with
              self-managed or marketplace infrastructure.


              That fragmentation matters because it changes what “direct competitor” means. ElevenLabs is a direct
              competitor for voice quality and voice-cloning workflows, but not for Zyphra Cloud. Together or Fireworks
              are direct competitors for open-model deployment and cost-sensitive inference, but not for end-user voice
              branding. Azure, Google, and OpenAI are broader incumbents that can bundle speech, models, developer
              tooling, and enterprise procurement into a single relationship. In this chapter, the competitive map is
              therefore organized by buyer job: voice creation, model access, and deployment control. That produces a
              more accurate picture than trying to force all rivals into one pure-play bucket.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP021
