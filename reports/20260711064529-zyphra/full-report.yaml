      - number: '5.2'
        title: Model Families and Core Architectural Choices
        blocks:
          - type: paragraph
            body: >-
              The product differentiation is grounded in architecture. Zamba introduced Zyphra’s hybrid design by
              combining Mamba state-space blocks with shared attention, explicitly targeting lower training and
              inference overhead than vanilla Transformers. Zamba2-VL extends that philosophy into vision-language
              models at 1.2B, 2.7B, and 7B scales, claiming broadly competitive accuracy at roughly an order of
              magnitude lower time-to-first-token than comparable open-weight Transformer VLMs. Its description is
              technically explicit: a LLaVA-style template, Qwen2.5-VL vision encoder, two-layer MLP adapter, and Zamba2
              hybrid backbone. ZAYA1 pushes the efficiency story into reasoning, with a mixture-of-experts design,
              sub-billion active parameters, AMD-native pretraining, and a test-time compute method called Markovian
              RSA.


              ZONOS2 is the clearest productized example of Zyphra’s architecture philosophy in a user-facing domain. It
              is a sparse MoE real-time TTS model with 900 million active parameters and 8 billion total parameters,
              released under Apache 2.0, with both stable and expressive modes. The company claims better speaker
              similarity and prosodic fidelity, support for multilingual and code-switched audio up to one minute, and
              4x higher throughput than the prior model despite much larger size. Several design choices are notable:
              raw UTF-8 byte tokenization instead of explicit phonemization, ECAPA-TDNN speaker embeddings, and a large
              training expansion from roughly 200,000 hours to over six million hours of audio. Across the portfolio,
              Zyphra is clearly optimizing for intelligence density and deployment efficiency rather than headline
              parameter count.
