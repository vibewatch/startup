      - number: '2.3'
        title: Buyer Segments, Budget Owners, and Adoption Paths
        blocks:
          - type: paragraph
            body: >-
              The most relevant buyer groups are easier to identify than the exact dollar value of the SAM. Voice AI
              spending today clusters around customer service, virtual assistants, transcription, smart devices,
              accessibility, media, and branded voice experiences. Small-model and multimodal spending clusters around
              developer platforms, product teams building copilots or agents, and enterprises that want acceptable model
              quality at lower serving cost than frontier APIs. In the inference layer, buyers care about integrated
              infrastructure, accelerator choice, latency, privacy, and the operational burden of deploying multiple
              models across cloud or hybrid environments. Budget ownership therefore varies: contact-center and
              digital-product teams may own voice purchases, engineering or platform organizations may own model-hosting
              decisions, and infrastructure or CTO organizations may own higher-commitment inference contracts.


              The adoption path usually runs from experimentation to one workflow in production and only then to scaled
              redesign. Deloitte’s 2026 survey is useful here because it shows just how incomplete that motion remains:
              48% of respondents have introduced AI without redesigning the workflows around it, while only 12% report
              redesign at scale. Zyphra is therefore best positioned where a buyer already has a live voice or agentic
              use case and is actively comparing the cost, control, and model-quality tradeoffs among open-weight and
              closed API alternatives. That dynamic likely favors AI-native startups, developer-first enterprises, media
              and content teams, and regulated or sovereignty-sensitive organizations sooner than the median large
              enterprise still stuck in pilot mode.
