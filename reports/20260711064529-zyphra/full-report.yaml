      - number: '8.4'
        title: Recommendation and diligence path
        blocks:
          - type: paragraph
            body: >-
              The right recommendation is research-more, not buy. Zyphra has too much real technology and strategic
              relevance to dismiss, but too little public commercial evidence to underwrite a premium entry with
              confidence. The current $1 billion mark can be defended as an option on a differentiated AI platform, yet
              it already asks investors to believe in future monetization more than current economics. That is
              acceptable only if diligence can close the biggest gaps quickly: named customers, retention,
              usage-to-revenue conversion, support and policy packaging, and Maia maturity.


              For investors, entry discipline should be explicit. If a future round truly clears at $5 billion before
              Zyphra surfaces much better customer and economic proof, the valuation stance becomes harder to support
              and downside asymmetry worsens. Conversely, if the company can show strong cloud monetization, visible
              customer quality, and evidence that Maia is becoming a real workflow product rather than an aspirational
              layer, then the current mark could end up looking conservative. Until those proofs arrive, the best stance
              is to stay engaged, deepen diligence, and treat Zyphra as a potentially important company whose current
              valuation still rests more on promise than on fully evidenced commercial performance.
