      - number: '1.3'
        title: Funding and Capitalization
        blocks:
          - type: paragraph
            body: >-
              The capital story is directionally clear but not perfectly clean. Multiple public sources support a 2023
              seed round totaling about $11 million and a June 2025 Series A at a $1 billion valuation, while partner
              releases from AMD and IBM confirm that Zyphra had recently closed a Series A at a $1 billion valuation by
              October 2025. Nextomoro and EverybodyWiki attribute that Series A to Jaan Tallinn and size it at $100
              million; CB Insights supports the $1 billion June 2025 valuation and the earlier seed investors Intel
              Capital, Future Ventures, and Bison Ventures. Public databases then diverge on the precise round line
              items: Tracxn lists an October 2025 Series A with IBM and AMD attached, while CB Insights shows a May 2026
              rumored $500 million financing and Forbes reports Zyphra was raising at least $500 million at a valuation
              of at least $5 billion with AMD participating. The practical takeaway is that Zyphra clearly crossed into
              unicorn territory, has strategic capital or strategic alignment from major compute partners, and is
              fundraising again, but exact cap-table composition and round chronology are not fully transparent
              publicly.
