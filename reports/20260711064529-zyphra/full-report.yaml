chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              Zyphra presents itself as an open superintelligence research and product company based in San Francisco.
              The reviewed official materials split the company into Zyphra Research, which trains multimodal open
              models on heterogeneous compute, and Zyphra Cloud, which commercializes that work as an AMD-native
              platform for developers, enterprises, and frontier AI hyperscalers. That combination matters because the
              company is not just releasing research artifacts; it is also building an infrastructure and application
              layer intended to monetize them. Public descriptions consistently emphasize long-term memory, continual
              learning, parameter efficiency, and hardware-aware systems design rather than frontier-scale parameter
              counts alone. The commercial surface now spans serverless inference, agent infrastructure, bare-metal and
              dedicated cluster offerings, while the product story above that stack is Maia, a general-purpose
              superagent for knowledge-work productivity.
