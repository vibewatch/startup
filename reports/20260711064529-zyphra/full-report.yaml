      - number: '1.4'
        title: Products, Infrastructure and Public Scale Signals
        blocks:
          - type: paragraph
            body: >-
              Zyphra's public output is unusually broad for a still-private AI startup. On the model side, Zamba2 is the
              flagship efficient language-model family, explicitly open-sourced and positioned as faster and lighter
              than similarly sized dense transformer peers. ZONOS2 extends the same efficiency thesis into voice, using
              a sparse MoE design for real-time TTS and high-fidelity voice cloning. ZAYA1 pushes into reasoning models
              trained on AMD hardware, and Maia is the application layer those model and infrastructure bets are meant
              to power. On infrastructure, IBM and AMD describe a multi-year plan to give Zyphra a large MI300X cluster
              on IBM Cloud, and Zyphra's own materials claim early access in September 2025 plus later MI355X-based
              cloud capacity through TensorWave. What remains notably absent is hard commercial disclosure: reviewed
              public sources do not provide audited revenue, ARR, or named customer logos, and public headcount
              estimates only range from roughly 65 to 70 employees.
