      - number: '4.3'
        title: Capital Adequacy, Financing Dependency, and Runway Uncertainty
        blocks:
          - type: paragraph
            body: >-
              Capital adequacy is the most important financial question because Zyphra is scaling both research and
              infrastructure before any public revenue proof. Public sources support a disclosed seed round of $11
              million and a $100 million Series A in June 2025, for approximately $111 million of known raised capital.
              At the same time, third-party sources conflict about the record: CB Insights still shows only $11 million
              total raised on a public page because later details are partly gated, while also listing a rumored $500
              million 2026 financing. Forbes separately reported that Zyphra was in talks to raise $500 million at a
              valuation of at least $5 billion. The combination means investors can be confident that Zyphra raised
              meaningful capital, but not confident about current cash on hand or the exact post-Series-A capitalization
              picture.


              The 2026 cloud launch and 15MW capacity announcement make financing dependency more acute. If Zyphra is
              serious about serving training, reinforcement learning, and large-scale inference workloads, capital needs
              will not stop at the Series A. The likely next-round trigger is not simple time-to-cash but scaling
              pressure: more reserved capacity, more large training jobs, more Maia product commercialization, and more
              enterprise support. If the rumored 2026 round closes, financing risk falls sharply. If it does not,
              underwriters have to assume that Zyphra’s capital base must stretch across model R&D, cloud operations,
              and go-to-market simultaneously — a much less comfortable setup without disclosed burn or revenue.
