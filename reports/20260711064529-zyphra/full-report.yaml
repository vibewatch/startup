      - number: '7.4'
        title: Mitigations and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              On balance, Zyphra’s risk profile is high but legible. The company is not a black box: it publishes
              substantial technical detail, has real strategic partners, and has clearly crossed the line from pure
              concept into live product surfaces. Those are important mitigants. But the main risks are cumulative
              rather than isolated. Regulatory scrutiny on voice cloning can slow enterprise adoption; immature public
              trust and support packaging can slow procurement; AMD and partner concentration can create delivery
              fragility; and revenue opacity can make it hard to know whether commercialization is keeping pace with
              ambition. None of these alone kills the thesis. Together, they mean an investor should treat Zyphra as a
              company whose upside depends on proving that operational discipline, compliance packaging, and customer
              monetization are catching up with technical speed.


              The diligence response should therefore be practical and monitorable. Investors need named customer proof,
              retention and contract data, partner-SLA clarity, policy and compliance materials, and evidence that Maia
              is more than a strategic narrative. The right kill criteria are equally concrete: a material regulatory
              incident around voice misuse, inability to surface enterprise security and data terms, visible AMD or
              export-control bottlenecks that impair delivery, or continued absence of customer-quality metrics despite
              rising infrastructure commitments. Zyphra can plausibly mitigate many of these risks — but only if it
              turns public momentum into repeatable operational proof.
