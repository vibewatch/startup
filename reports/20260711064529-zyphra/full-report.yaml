      - number: '6.3'
        title: Durability, repeat usage, and expansion
        blocks:
          - type: paragraph
            body: >-
              Durability is where public evidence becomes weakest. Zyphra does not disclose customer count, NRR, GRR,
              churn, renewal rate, contract duration, or any cohort view of repeat usage. Nor does it publish
              customer-authored ROI stories or detailed deployment outcomes that would let an investor infer retention
              quality indirectly. The review-directory surfaces are revealing precisely because they are sparse:
              SourceForge lists no integrations and a 0.0/5 rating surface, while Slashdot lists training docs and
              online support fields but no integrations at the time of retrieval. Those are not negative verdicts on the
              product itself; they are evidence that the commercial review footprint is still shallow.


              The expansion story is more plausible than proven. Zyphra’s stack spans open models, hosted inference,
              dedicated capacity, bare-metal clusters, and an eventual agent workflow layer in Maia. That creates a
              logical land-and-expand arc: a user might start by trying an open model, then move into hosted inference,
              then buy dedicated infrastructure, and eventually adopt higher-level workflows. But that is still a
              hypothesis until management shares conversion, renewal, or multi-product usage data. The most defensible
              diligence stance is therefore to treat retention as unknown, expansion as possible, and commercialization
              maturity as early rather than fully proven.
