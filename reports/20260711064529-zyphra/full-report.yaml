      - number: '6.2'
        title: Adoption trajectory and proof quality
        blocks:
          - type: paragraph
            body: >-
              The public adoption story starts with accessibility. Zyphra has made multiple surfaces discoverable and
              testable: open-weight model pages, GitHub repositories, Hugging Face model cards, a public audio
              playground, and a cloud launch that explicitly says the service is available today. Those are meaningful
              because they show the company is not only publishing research narratives; it is also exposing artifacts
              and interfaces that outside users can actually touch. The measurable signals fit that story. At retrieval
              time, ZONOS2 had materially stronger public traction than the language-model family, with nearly two
              thousand Hugging Face downloads, over one hundred likes, and a GitHub repo with several hundred stars and
              active issues. That pattern suggests speech and inference are currently the most visible
              customer-acquisition surfaces.


              The next tier of proof is partner and channel validation. IBM, AMD, and TensorWave all publicly describe
              active collaboration with Zyphra, including a multi-year IBM Cloud deployment for training and the
              MI355X-based Zyphra Cloud launch. Those sources support the judgment that Zyphra has crossed from
              concept-stage research into real infrastructure delivery. However, they are not the same as a broad
              named-paying-customer roster. No fetched source produced a customer-authored case study, procurement
              record, or outcome-rich deployment writeup for a named enterprise buyer. Public proof therefore exists,
              but it is concentrated in developer traction and named counterparties rather than in a diversified
              portfolio of production customers.
