      - number: '1.5'
        title: Milestones and Adverse Signals
        blocks:
          - type: paragraph
            body: >-
              The timeline from 2021 through mid-2026 shows a company that moved from quiet research work into public
              productization and infrastructure scaling. Key milestones include the 2023 seed round, Zamba in 2024,
              Zamba2 and tree-attention work later that year, Zonos in early 2025, the 2025 Series A, the IBM/AMD
              training-cluster announcement in October 2025, ZAYA1 in late 2025, and the launch of Zyphra Cloud in 2026.
              The adverse side of the story is equally important. The Register's hands-on review of Zonos argued that
              the model could produce convincing voice clones from short samples and highlighted obvious abuse vectors
              around fraud, impersonation, and synthetic political messaging. Separately, Zyphra's strategic
              differentiation depends heavily on AMD-first infrastructure and on turning open-weight research into a
              commercial platform; that can be an advantage against NVIDIA supply constraints, but it also concentrates
              vendor risk and leaves commercialization harder to evaluate when revenue, customer concentration, and
              governance remain opaque.
