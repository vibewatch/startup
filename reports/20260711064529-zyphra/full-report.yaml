              enterprises, and frontier AI hyperscalers, while Maia is framed as a collaborative superagent for teams
              and knowledge workers. That implies multiple layers of buyer and user. Open-weight model users can begin
              as individual developers or research teams evaluating ZONOS2, Zamba, or ZAYA through GitHub, Hugging Face,
              or the public cloud playground. Hosted inference buyers look more like engineering or platform budget
              owners inside startups and enterprises that need production serving, long-context workloads, or dedicated
              GPU access. Maia, if it commercializes as described, shifts the user up-stack toward enterprise
              knowledge-work teams that value shared context and workflow automation rather than only raw model access.


              This layered segmentation matters because it helps explain why public demand evidence is strongest in
              developer channels while enterprise proof is still sparse. The developer surface is easy to observe:
              public repos, model hubs, and accessible evaluation flows. Enterprise demand is harder to verify because
              the company has not published named customer logos, account counts, or segment revenue splits. The
              chapter’s best-supported conclusion is that Zyphra has a credible segmentation ladder from individual
              builders to large infrastructure buyers, but the public record is still much stronger on intended audience
              and product fit than on realized customer breadth.
