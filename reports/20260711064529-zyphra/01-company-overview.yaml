company:
  name: Zyphra
chapter:
  number: 1
  title: Company Overview
  summary: Zyphra is a San Francisco AI lab and cloud platform centered on open-weight multimodal models, AMD-native infrastructure, and an in-development enterprise superagent called Maia. Public sources support a $1 billion Series A valuation in 2025, an earlier $11 million seed, and deep AMD/IBM infrastructure ties, but revenue, customers, board composition, and some founder-history details remain thinly disclosed or inconsistent across data vendors.
sections:
- id: identity-business-model
  title: Identity and Business Model
  body: Zyphra presents itself as an open superintelligence research and product company based in San Francisco. The reviewed official materials split the company into Zyphra Research, which trains multimodal open models on heterogeneous compute, and Zyphra Cloud, which commercializes that work as an AMD-native platform for developers, enterprises, and frontier AI hyperscalers. That combination matters because the company is not just releasing research artifacts; it is also building an infrastructure and application layer intended to monetize them. Public descriptions consistently emphasize long-term memory, continual learning, parameter efficiency, and hardware-aware systems design rather than frontier-scale parameter counts alone. The commercial surface now spans serverless inference, agent infrastructure, bare-metal and dedicated cluster offerings, while the product story above that stack is Maia, a general-purpose superagent for knowledge-work productivity.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO023
  - CO032
  - CO040
  tableRefs:
  - TO001
  figureRefs:
  - FO002
- id: founders-leadership
  title: Founders and Leadership
  body: 'Public profiles consistently identify Krithik Puthalath, Beren Millidge, Tomás Figliolia, and Danny Martinelli as Zyphra''s founding team. Krithik is the clearest public face of the business: AMD, IBM, company, and financial-news materials all quote him as founder and CEO, while some partner materials style him CEO and chairman. Millidge is both independently and third-party described as a cofounder who leads Zyphra''s technical teams; his prior background in Apollo Research, Conjecture, Oxford, and Edinburgh fits the company''s research-heavy positioning. Figliolia is publicly described as cofounder and head of AI model architecture, while Martinelli is consistently listed as cofounder but with little additional public biography. Reviewed sources suggest a broader operating bench that includes Paul White and, in lower-confidence directories, Steven Brook, Ilya Brown, and Quentin Anthony, but public board composition and governance rights remain undisclosed.'
  claimRefs:
  - CO006
  - CO007
  - CO008
  - CO009
  - CO010
  - CO036
