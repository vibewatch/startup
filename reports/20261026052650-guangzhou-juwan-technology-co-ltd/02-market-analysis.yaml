  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: buyer-validation
      missingEvidence: Juwan's named OEM and fleet customers, awarded programs, platform qualification status, repeat orders, contract terms, and budget owners.
      whyItMatters: Global deployment cannot be translated into Juwan serviceable demand without proving which buyer programs accept its product and who funds them.
      diligencePath: Obtain a revenue-ranked customer and program schedule with signed purchase orders, qualification milestones, platform volumes, contract duration, pricing, and customer references.
      relatedQuestionRefs:
        - QM004
      relatedTableRefs:
        - TM003
    - type: missing-source
      severity: blocking
      topic: company-specific-market-sizing
      missingEvidence: Product-level eligible vehicle platforms, geography, battery capacity per vehicle, obtainable share, realized price, and a reconciled Juwan SAM/SOM.
      whyItMatters: Global TWh deployment and country market shares have different units and do not establish addressable company revenue or growth.
      diligencePath: Build a bottom-up platform model from validated target OEM programs, vehicle production schedules, pack specifications, supply awards, and Juwan pricing; reconcile it to independent segment data.
      relatedQuestionRefs:
        - QM002
        - QM008
      relatedTableRefs:
        - TM002
    - type: missing-source
      severity: material
      topic: charging-performance-and-economics
      missingEvidence: Independent, like-for-like validation of Juwan charging time, safety, degradation, cycle life, yield, warranty, system cost, and charger/grid requirements.
      whyItMatters: Competitor-attributed charging claims do not demonstrate that Juwan can meet the same performance at production scale or that the full charging ecosystem is economically ready.
      diligencePath: Commission or obtain customer-witnessed third-party tests with defined state-of-charge windows, ambient conditions, pack size, charger power, cycle count, and warranty assumptions.
      relatedQuestionRefs:
        - QM006
        - QM007
      relatedTableRefs:
        - TM003
    - type: missing-source
      severity: material
      topic: market-methodology
      missingEvidence: Comparable underlying methodology and audited data for annual EV battery deployment, monthly China installations, and fast-charge-compatible subsegments.
      whyItMatters: Different periods and denominators cannot support a consistent CAGR or an addressable-market conversion, and no retained source provides a contrary Juwan-specific estimate.
      diligencePath: Reconcile IEA deployment methodology with CABIA installation statistics and obtain independent demand data by vehicle, chemistry, charging profile, region, and year.
      relatedQuestionRefs:
        - QM002
        - QM008
      relatedTableRefs:
        - TM002
