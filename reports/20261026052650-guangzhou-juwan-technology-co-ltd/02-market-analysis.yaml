chapter:
  number: 2
  title: Market Analysis
  summary: Global EV battery deployment is growing, but it is concentrated in China and increasingly shaped by chemistry mix, price pressure, and charging infrastructure economics. Public evidence supports market-level demand and competitive indicators, not a defensible Juwan-specific SAM, SOM, buyer budget, or adoption forecast.
sections:
  - id: market-boundary
    title: Market boundary and adjacent spend
    body: >-
      The investable core is batteries and battery systems supplied for road electric
      vehicles, with separate attention to passenger vehicles and commercial vehicles.
      The International Energy Agency (IEA) reports 1.2 TWh of global EV battery
      deployment in 2025, but that physical deployment measure is not battery-industry
      revenue, an annual contract value, or Juwan's addressable spend (CM001). Light-duty
      vehicles dominate that deployment, while electric trucks are a smaller but faster-
      growing application (CM003). Stationary storage, charging-network equipment, and
      aviation/eVTOL batteries are adjacent markets rather than additions to this road-EV
      denominator; the retained evidence describes such activity but does not establish
      that Juwan serves it (CM015, CM016). The market definition therefore excludes those
      categories from the core sizing and treats charging infrastructure as an adoption
      dependency rather than battery spend. Nor does a broad EV total establish which
      chemistries, charging profiles, vehicle platforms, geographies, or qualification
      windows Juwan can supply. Those product-fit and customer-selection details are
      necessary before converting deployment into a serviceable market.
    claimRefs:
      - CM001
      - CM003
      - CM014
      - CM015
      - CM016
    tableRefs:
      - TM001
  - id: market-size-and-trajectory
    title: Demand is measurable; Juwan's serviceable market is not
    body: >-
      The strongest global sizing lens is physical EV battery deployment: 1.2 TWh in
      2025, almost 30% above 2024 and more than seven times the 2020 level (CM001). The
      IEA's denominator is broad and includes more than one vehicle class; its regional
      split places about 60% of deployment in China, almost 15% in the European Union,
      and 10% in the United States (CM004). Its chemistry and application data also show
      that LFP exceeded 55% of global EV battery deployment in 2025, while light-duty
      vehicles accounted for more than 85%; neither is a Juwan-specific addressable
      share (CM003, CM005). As a separate China monthly lens, CNEVPost reports 76.5 GWh
      of domestic power-battery installations in June 2026, up 31.5% year on year; this
      is one month's installations, not annual sales or revenue (CM007). These distinct
      measures should not be summed or treated as a consistent TAM/SAM/SOM series. The
      IEA also reports an 8% average battery-price decline in 2025 and input-price
      volatility, while the China data show high supplier concentration (CM006, CM008).
      Those conditions make volume growth insufficient evidence of supplier economics.
      Hurun's broad private-company index offers only a capital-market backdrop: its
      physical-product category includes New Energy but is not an EV-battery valuation
      benchmark (CM013). No retained source isolates extreme-fast-charging battery
      demand, Juwan-compatible vehicle platforms, eligible geography, revenue per unit,
      or market share. Company-specific TAM/SAM/SOM and CAGR therefore remain
      unquantified rather than extrapolated from total EV deployment.
    claimRefs:
      - CM001
      - CM003
      - CM004
      - CM005
      - CM006
      - CM007
      - CM008
      - CM013
      - CM014
    tableRefs:
      - TM002
    figureRefs:
      - FM001
  - id: buyer-adoption-and-constraints
    title: Adoption depends on OEM qualification, economics, and infrastructure
    body: >-
      Vehicle manufacturers are the likely direct battery-system buyers; fleets and
      drivers experience the charging outcome, while the contract payer and budget owner
      can differ by vehicle program. This is an analytical segmentation, not evidence
      that Juwan has secured an OEM, fleet, or repeat-order relationship: the assigned
      sources do not identify Juwan customers, contract terms, qualification status, or
      budget ownership (CM014). The broader EV demand backdrop is positive but uneven.
      Roland Berger reports that more than one in four new vehicles sold worldwide was
      an EV in 2025, alongside a 73-million-plus EV parc across its 34 focus countries;
      it also describes regional divergence and a shift in public charging toward
      utilization economics (CM009, CM010). Ultra-fast charging can strengthen the user
      proposition, but it requires compatible vehicle electronics, high-power chargers,
      and adequate grid capacity; Gulf News reports CATL's and BYD's charging-time
      claims, not independently verified Juwan performance (CM011). Lower battery
      prices can support affordability, yet mineral volatility, supplier concentration,
      manufacturing economics, and emerging performance/lifecycle standards constrain
      margins and deployment (CM006, CM008, CM012). China standardization projects
      remain in drafting, so they signal an evolving compliance path rather than a
      finalized rule. Investment underwriting needs independently comparable safety,
      degradation, yield, charging, warranty, and total-cost data; no retained source
      supplies a Juwan-specific benchmark or evidence of failed/persistently delayed
      adoption.
    claimRefs:
      - CM006
      - CM008
      - CM009
      - CM010
      - CM011
      - CM012
      - CM014
    tableRefs:
      - TM003
tables:
  - id: TM001
    title: Core market boundary and adjacent categories
    columns:
      - Segment or category
      - Included spend or physical scope
      - Excluded spend or overlap
      - Buyer, user, or payer
      - Relevance and evidence limit
    rows:
      - - Road-EV battery deployment
        - Battery cells and packs installed in electric road vehicles; global deployment is measured in GWh/TWh.
        - Vehicle revenue, charging-network capex, and stationary storage are not battery deployment.
        - The sources do not identify Juwan's contracting buyer or battery-procurement budget owner.
        - Core market boundary; IEA measures deployment volume, not Juwan revenue or share.
      - - Passenger BEV and PHEV batteries
        - Batteries for light-duty road vehicles, with BEV and PHEV battery sizes differing by geography.
        - Vehicle sales value and charging equipment are outside the battery-only boundary.
        - Passenger-vehicle users are in scope; the battery buyer and budget owner are not identified.
        - Light-duty vehicles exceed 85% of 2025 EV battery deployment; Juwan platform fit is not established.
      - - Commercial-vehicle and truck batteries
        - Batteries installed in road trucks and other commercial EVs.
        - Charging depots and fleet vehicle purchases are not battery-supplier revenue.
        - Commercial-vehicle operators are users; the battery buyer and payer are not established.
        - Truck battery demand more than doubled in 2025, but represented about 8% of global EV battery deployment.
      - - Charging infrastructure and ultra-fast charging
        - Adoption-enabling chargers, grid connections, and vehicle-compatible charging capability.
        - Charger hardware, network services, and grid upgrades are not included in battery deployment.
        - Charging-point operators and vehicle users have roles distinct from battery procurement.
        - Relevant adoption constraint and ecosystem adjacency; not evidence of Juwan sales.
      - - Stationary storage and eVTOL batteries
        - Separate storage or aviation battery applications with distinct use, safety, and qualification needs.
        - Excluded from road-EV battery TAM absent evidence of Juwan products or sales in these categories.
        - The sources do not establish Juwan's buyer, payer, or contracted volumes in either adjacency.
        - Retained evidence illustrates adjacency only and cannot be added to the road-EV total.
    notes: >-
      Boundary is an analytical classification, not a verified Juwan product or customer
      map. EV battery deployment is physical volume, not revenue; charging infrastructure,
      stationary storage, and eVTOL are excluded to avoid double counting.
    claimRefs:
      - CM001
      - CM003
      - CM009
      - CM010
      - CM014
      - CM015
      - CM016
  - id: TM002
    title: Sizing lenses and what each denominator establishes
    columns:
      - Publisher and period
      - Geography or segment
      - Reported metric
      - Method or denominator
      - Confidence and limitation
    rows:
      - - IEA, 2025
        - Global EV batteries
        - 1.2 TWh deployed; almost 30% above 2024.
        - Deployment calculated from volume-weighted average battery size and vehicle sales by mode and region.
        - High-confidence global volume benchmark; not revenue or company-specific TAM.
      - - IEA, 2025
        - Global regional distribution
        - China 60%; European Union almost 15%; United States 10% of deployment.
        - Shares of global EV battery deployment.
        - High-confidence regional mix; rounded shares and remaining markets are not a Juwan SAM.
      - - IEA, 2025
        - Global chemistry mix
        - LFP accounted for over 55% of EV batteries deployed globally.
        - Share of global EV battery deployment, up from nearly 50% in 2024.
        - High-confidence chemistry mix; does not identify extreme-fast-charging-compatible demand.
      - - CNEVPost citing CABIA, June 2026
        - China power-battery installations
        - 76.5 GWh; up 31.5% year on year and 6.4% from May.
        - One month's domestic power-battery installations.
        - Medium-confidence reported monthly volume; not an annualized estimate or revenue.
      - - CNEVPost citing CABIA, June 2026
        - China overall power-battery supplier shares
        - CATL 42.70%; BYD 18.49%; together 61.19%.
        - Supplier share of China's June 2026 power-battery market.
        - Medium-confidence concentration signal; one month and not a Juwan market-share measure.
      - - Hurun Research Institute, 2026 index
        - Global private-company context
        - 26% of listed unicorns sell physical products; New Energy is one of several named sectors.
        - Hurun's index of private companies valued at USD 1 billion or more, with 1 January 2026 cut-off.
        - Medium-confidence broad index context only; not battery-sector demand, funding, or valuation evidence.
    notes: >-
      These are distinct measures, vintages, geographies, and denominators; no CAGR is
      derived. TWh/GWh deployment and installation volumes are not revenue. The Hurun
      universe is not an EV battery market estimate.
    claimRefs:
      - CM001
      - CM004
      - CM005
      - CM007
      - CM008
      - CM013
  - id: TM003
    title: Buyer, user, payer, and adoption path hypotheses
    columns:
      - Segment or buying context
      - Likely direct buyer
      - User or operating beneficiary
      - Budget owner or payer
      - Adoption trigger and evidence gap
    rows:
      - - Passenger EV platform
        - Vehicle OEM procurement and engineering teams.
        - Vehicle owner/driver and OEM product organization.
        - OEM platform program; final economics may flow through vehicle price.
        - Range, charge time, safety, durability, cost, and validated platform fit; no Juwan program or contract is evidenced.
      - - Commercial EV or truck
        - Commercial-vehicle OEM or battery-system integrator.
        - Fleet operator, driver, and vehicle maintenance team.
        - OEM or fleet operator depending on procurement and ownership structure.
        - Utilization, payload, charging downtime, warranty, and total cost; no Juwan fleet pilot or repeat order is evidenced.
      - - Ultra-fast charging ecosystem
        - Vehicle OEM and charging-system partners coordinate compatibility.
        - Drivers and fleets benefit from lower charging time.
        - OEM, charging operator, utility, or site host may fund distinct equipment.
        - High-power chargers and grid capacity must align with battery capability; no Juwan ecosystem contract is evidenced.
      - - Stationary storage or eVTOL adjacency
        - Storage integrator/operator or aircraft manufacturer.
        - Grid/storage operator or aircraft operator.
        - Project developer, utility, or aircraft purchaser.
        - Separate application economics and qualification; excluded from core sizing absent Juwan product/customer proof.
    notes: >-
      Buyer and payer entries are hypotheses about category purchasing structures, not
      observed Juwan customer evidence. Public sources in this pool do not disclose
      Juwan's named buyers, budget owners, contract economics, or adoption conversion.
    claimRefs:
      - CM009
      - CM010
      - CM011
      - CM014
      - CM015
      - CM016
figures:
  - id: FM001
    title: "EV battery sizing boundary: volume benchmark to unquantified Juwan SAM"
    type: pyramid
    summary: >-
      Available sources establish global deployment and some segment shares, but not
      the product-, platform-, or customer-specific serviceable market for Juwan.
    data:
      items:
        - label: Global EV battery deployment
          value: 1.2 TWh
          detail: 2025 global deployment; physical volume, not revenue.
          valueNote: IEA estimate; almost 30% higher than 2024.
        - label: Light-duty vehicle batteries
          value: ">85% of global EV battery deployment"
          detail: 2025 application mix; not Juwan-addressable demand.
          valueNote: IEA-reported share; category is broader than Juwan's evidenced fit.
        - label: Electric-truck batteries
          value: About 8% of global EV battery deployment
          detail: 2025 share; truck battery demand more than doubled year on year.
          valueNote: IEA-reported share; commercial-platform eligibility is unknown.
        - label: China deployment
          value: About 60% of global EV battery deployment
          detail: 2025 regional share.
          valueNote: IEA-reported regional share; not a company sales estimate.
        - label: Extreme-fast-charging-compatible spend
          value: Not separately quantified
          detail: No retained source isolates volume by charging profile and eligible platform.
          valueNote: Do not infer a share from total EV battery deployment.
        - label: Juwan-specific SAM or SOM
          value: Not established
          detail: Product fit, geography, qualification, customer volume, and realized price are unavailable.
          valueNote: Requires company and customer evidence; not a zero-market finding.
    approximationNotes: >-
      The levels are an evidence-scope sequence, not proportionally scaled market sizes:
      the displayed values have different regional/application dimensions, and the
      narrower Juwan-specific market is unsupported. Do not read the pyramid's taper as
      a measured conversion or value share.
    claimRefs:
      - CM001
      - CM003
      - CM004
      - CM005
      - CM007
      - CM014
