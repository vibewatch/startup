chapter:
  number: 5
  title: Product & Technology
  summary: "A September 2026 job-listing snapshot points to engineering work in cell materials, thermal management, controls, simulation, and pilot-line quality, but it does not establish Juwan's shipped product configuration or validated performance. Independent battery and charging evidence shows that chemistry, manufacturing maturity, charging infrastructure, and grid behavior are coupled technical constraints; Juwan-specific architecture, IP, safety, and field evidence remain diligence gaps."
sections:
  - id: company-evidence
    title: Company-specific evidence is limited to engineering signals
    body: >-
      The assigned current evidence does not identify a verified Juwan product SKU, cell chemistry, cell format, pack design, charging specification, or production deployment. A Jobui page displayed Guangzhou listings dated 2026-09-02 for battery thermal-management, cell-materials development, structural simulation, embedded development, electrical engineering, electrochemical simulation, pilot-line supervision, cell-process quality, process technician, and solid-state battery engineering roles. This is a company-issued hiring signal reproduced on a third-party job platform, not independent validation of a product or operating capability. It suggests engineering workstreams worth testing, but does not prove that every role was filled, that a named technology reached production, or that Juwan has a solid-state product. Exact module ownership, customer workflow, maturity, and measurable benefit therefore remain open.
    claimRefs:
      - CE001
      - CE014
    tableRefs:
      - TE001
  - id: battery-technology-context
    title: Chemistry and manufacturing choices define the external benchmark
    body: >-
      The IEA reports that lithium iron phosphate (LFP) represented over 55% of global EV battery deployment in 2025, up from nearly 50% in 2024; that mix is industry context, not evidence that Juwan uses LFP. The IEA also describes sodium-ion's lower cell energy density relative to current LFP and nickel-manganese-cobalt cells, and says solid-state manufacturing and pack integration remain more complex than lithium-ion. A separate industry-news account reports a 480 Wh/kg EHang/Inx Energy solid-state battery flight, but the reported aircraft, battery developers, and result are not Juwan evidence or a comparable EV-battery benchmark. The practical diligence question is not whether a chemistry can produce a notable demonstration, but whether Juwan can validate its own design, safety, durability, yield, and cost at automotive scale.
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE006
      - CE013
    tableRefs:
      - TE003
    figureRefs:
      - FE001
  - id: system-integration
    title: Fast charging is a battery, vehicle, infrastructure, and grid problem
    body: >-
      Published competitor charging claims illustrate the system boundary rather than establish Juwan performance. Gulf News attributes sub-ten-minute charge claims to CATL and BYD, while Electrek reports CATL's stated internal-resistance and cold-temperature figures; these are manufacturer claims reproduced in media, not independent like-for-like benchmark tests or evidence of Juwan performance. The Gulf News account notes that very high charging rates also require high-power chargers, suitable vehicle electronics, and grid capacity. Separately, Roland Berger describes a 2025 shift in public charging from installation growth toward utilization and network performance. A peer-reviewed three-city simulation using 769,225 public charging orders found that modeled ultra-fast charging deployment could increase load peak-to-valley differences. These sources make charging compatibility, thermal control, power electronics, site capacity, and operating controls material diligence items, while leaving Juwan's actual integration and field reliability unverified.
    claimRefs:
      - CE008
      - CE009
      - CE010
      - CE011
      - CE012
    tableRefs:
      - TE002
  - id: diligence-gaps
    title: Product maturity and trust claims need primary proof
    body: >-
      No eligible fetched source in this chapter's assigned pool verifies Juwan's battery chemistry, pack architecture, measured charge curve, cycle life, thermal-runaway controls, certification status, production yield, warranty performance, or customer deployment. The hiring snapshot is a lead for diligence, not a substitute for test reports or production records. Investors should request a SKU-level bill of materials and architecture, cell and pack test protocols with sample sizes and conditions, third-party safety and regulatory certificates, pilot-to-production yield and defect histories, warranty and field-incident denominators, and vehicle or charging-system integration records. Until those records are reviewed, neither a job title nor an industry demonstration supports a conclusion about Juwan's product maturity or differentiated performance.
      An allocated PatSnap page titled as a 2026 solid-state patent landscape displayed only an update notice, so it did not provide a usable view of Juwan's patent position. Investors should also request patent ownership and freedom-to-operate records.
    claimRefs:
      - CE001
      - CE014
