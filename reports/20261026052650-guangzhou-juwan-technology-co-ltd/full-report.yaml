      - number: '8.2'
        title: Market demand is real; company capture remains unproven
        blocks:
          - type: paragraph
            body: >-
              Independent market sources describe EV adoption and battery demand growth, but their estimates use
              different denominators. MarketsandMarkets sizes the EV-battery market, while Grand View Research sizes the
              broader battery-electric-vehicle market; neither is Juwan's serviceable market or a company revenue
              forecast. Axis Intelligence Research reports falling average pack prices, a structural cost opportunity
              for adoption but also a potential squeeze on supplier pricing. The company-specific evidence is narrower:
              Just Auto's 2023 report describes production and named supply relationships, and InsideEVs recounts a 2022
              vehicle charge test. Those dated reports support technical and commercialization history, not current
              customer retention, field reliability, production yield, or willingness to pay. A current underwriting
              case therefore needs verified customer and plant data before converting market growth into company value.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
