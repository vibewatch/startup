        - >-
          IEA reports early-2026 lithium prices were over twice the same-period 2025 level; Juwan's chemistry,
          contracts, and pass-through are unknown.
        - Price movement is observed; Juwan exposure is unknown
        - Potentially material to margin if costs cannot be passed through
        - Contract and hedging maturity not evidenced
        - Review chemistry-level bill of materials, indexed contracts, inventory, and margin sensitivities.
      - - 4 — conditional priority
        - Production ramp and quality consistency
        - >-
          WiserAsia reported 2022 production in GAC Aion models, but the assigned evidence has no current yield,
          capacity-utilization, warranty, or field denominator.
        - Not estimable for current operations
        - Potentially material if scale-up degrades quality or delivery
        - Current process controls not evidenced
        - Reconcile current output, lot-level yield, defect rates, capacity utilization, and on-time delivery.
      - - 5 — conditional priority
        - Competitive fast-charge claims
        - >-
          CNEVPost attributes test results to FAW Hongqi; the article says no production timeline was disclosed, and it
          is not an independent Juwan comparison.
        - Competitive claims are reported; Juwan outcome is unknown
        - Potentially material to OEM selection and pricing
        - Matched-condition benchmarking not evidenced
        - Commission independent tests of charge curve, thermal limits, cycle life, and cost on matched protocols.
    notes: >-
      The ordering is a conditional impact/diligence priority, not a probability score or assertion of a Juwan incident;
      company likelihood and mitigation maturity remain unverified.
