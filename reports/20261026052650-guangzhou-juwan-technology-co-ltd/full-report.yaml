  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and adjacent spend
        blocks:
          - type: paragraph
            body: >-
              The investable core is batteries and battery systems supplied for road electric vehicles, with separate
              attention to passenger vehicles and commercial vehicles. The International Energy Agency (IEA) reports 1.2
              TWh of global EV battery deployment in 2025, but that physical deployment measure is not battery-industry
              revenue, an annual contract value, or Juwan's addressable spend (CM001). Light-duty vehicles dominate that
              deployment, while electric trucks are a smaller but faster- growing application (CM003). Stationary
              storage, charging-network equipment, and aviation/eVTOL batteries are adjacent markets rather than
              additions to this road-EV denominator; the retained evidence describes such activity but does not
              establish that Juwan serves it (CM015, CM016). The market definition therefore excludes those categories
              from the core sizing and treats charging infrastructure as an adoption dependency rather than battery
              spend. Nor does a broad EV total establish which chemistries, charging profiles, vehicle platforms,
              geographies, or qualification windows Juwan can supply. Those product-fit and customer-selection details
              are necessary before converting deployment into a serviceable market.
            claimRefs:
              - CM001
              - CM003
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM009
              - CM010
              - CM014
              - CM015
              - CM016
      - number: '2.2'
        title: Demand is measurable; Juwan's serviceable market is not
        blocks:
          - type: paragraph
            body: >-
              The strongest global sizing lens is physical EV battery deployment: 1.2 TWh in 2025, almost 30% above 2024
              and more than seven times the 2020 level (CM001). The IEA's denominator is broad and includes more than
              one vehicle class; its regional split places about 60% of deployment in China, almost 15% in the European
              Union, and 10% in the United States (CM004). Its chemistry and application data also show that LFP
              exceeded 55% of global EV battery deployment in 2025, while light-duty vehicles accounted for more than
              85%; neither is a Juwan-specific addressable share (CM003, CM005). As a separate China monthly lens,
              CNEVPost reports 76.5 GWh of domestic power-battery installations in June 2026, up 31.5% year on year;
              this is one month's installations, not annual sales or revenue (CM007). These distinct measures should not
              be summed or treated as a consistent TAM/SAM/SOM series. The IEA also reports an 8% average battery-price
              decline in 2025 and input-price volatility, while the China data show high supplier concentration (CM006,
              CM008). Those conditions make volume growth insufficient evidence of supplier economics. Hurun's broad
              private-company index offers only a capital-market backdrop: its physical-product category includes New
              Energy but is not an EV-battery valuation benchmark (CM013). No retained source isolates
              extreme-fast-charging battery demand, Juwan-compatible vehicle platforms, eligible geography, revenue per
              unit, or market share. Company-specific TAM/SAM/SOM and CAGR therefore remain unquantified rather than
              extrapolated from total EV deployment.
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM007
              - CM008
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM007
              - CM014
      - number: '2.3'
        title: Adoption depends on OEM qualification, economics, and infrastructure
        blocks:
          - type: paragraph
            body: >-
              Vehicle manufacturers are the likely direct battery-system buyers; fleets and drivers experience the
              charging outcome, while the contract payer and budget owner can differ by vehicle program. This is an
              analytical segmentation, not evidence that Juwan has secured an OEM, fleet, or repeat-order relationship:
              the assigned sources do not identify Juwan customers, contract terms, qualification status, or budget
              ownership (CM014). The broader EV demand backdrop is positive but uneven. Roland Berger reports that more
              than one in four new vehicles sold worldwide was an EV in 2025, alongside a 73-million-plus EV parc across
              its 34 focus countries; it also describes regional divergence and a shift in public charging toward
              utilization economics (CM009, CM010). Ultra-fast charging can strengthen the user proposition, but it
              requires compatible vehicle electronics, high-power chargers, and adequate grid capacity; Gulf News
              reports CATL's and BYD's charging-time claims, not independently verified Juwan performance (CM011). Lower
              battery prices can support affordability, yet mineral volatility, supplier concentration, manufacturing
              economics, and emerging performance/lifecycle standards constrain margins and deployment (CM006, CM008,
              CM012). China standardization projects remain in drafting, so they signal an evolving compliance path
              rather than a finalized rule. Investment underwriting needs independently comparable safety, degradation,
              yield, charging, warranty, and total-cost data; no retained source supplies a Juwan-specific benchmark or
              evidence of failed/persistently delayed adoption.
            claimRefs:
              - CM006
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM014
              - CM015
              - CM016
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not capitalize a broad EV battery TAM as Juwan demand
            body: >-
              Global deployment is a volume benchmark, not Juwan revenue, share, or serviceable spend. Underwriting
              requires product compatibility, awarded programs, customer volumes, realized pricing, and independent
              performance evidence.
            calloutType: risk
            claimRefs:
              - CM001
              - CM014
          - type: callout
            title: Charging speed is an ecosystem proposition
            body: >-
              Fast charging can support adoption, but battery performance, vehicle electronics, charger power, and grid
              capacity must work together; third-party coverage of competitor claims is not a Juwan benchmark.
            calloutType: insight
            claimRefs:
              - CM010
              - CM011
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Scale and product breadth favor established suppliers
        blocks:
          - type: paragraph
            body: >-
              The most consequential competitive constraint is incumbent scale, not a single public charging-time
              comparison. The IEA reports that Chinese producers supplied almost 75% of global electric-car battery
              deployment in 2025, and that China held over 80% of global lithium-ion battery manufacturing capacity at
              year-end. The same source says new entrants typically need longer to ramp than established producers with
              advanced manufacturing and supply-chain experience. Bloomberg's account of CATL and BYD describes distinct
              product approaches: CATL's LFP Shenxing fast-charge line and nickel-rich Qilin, and BYD's LFP Blade
              platform. Those company-reported specifications are not independently matched tests. The table therefore
              distinguishes direct incumbents from adjacent energy-storage and future-chemistry competitors, and leaves
              commercial scale, customer mix, and realized prices blank when the assigned evidence does not establish
              them.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP009
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP009
              - CP010
              - CP011
              - CP014
      - number: '3.2'
        title: Fast-charge claims are not a comparable benchmark
        blocks:
          - type: paragraph
            body: >-
              CATL's reported third-generation Shenxing and BYD's reported second- generation Blade charging windows
              create a visible performance challenge for any supplier positioning around extreme-fast charging.
              Bloomberg attributes the headline charge rates to the companies; it does not establish identical test
              conditions, cell format, temperature, starting state of charge, charging infrastructure, or vehicle-level
              validation. SVOLT's SNEC announcement describes a fast-charging residential-storage cell, but that product
              is not a passenger-EV cell-to-cell comparator. The only Juwan-specific technology evidence in this pool is
              a reported solid-state patent description. No source here establishes Juwan's current production yield,
              charge curve, cycle life, warranty, realized pricing, or customer deployment, so those cells stay
              explicitly unknown rather than being inferred from the patent.
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP007
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP007
              - CP009
      - number: '3.3'
        title: Alternative chemistries and buyer build-or-buy options
        blocks:
          - type: paragraph
            body: >-
              Competition also comes from chemistry choices and the buyer's sourcing decision. Bloomberg describes
              CATL's sodium-ion and nickel-rich routes alongside LFP, while the IEA reports that LFP exceeded 55% of
              global EV battery deployment in 2025; the latter notes that lower prices partly reflect stationary-storage
              applications and should not be read as an apples-to-apples EV cost benchmark. Internal production is a
              real but difficult substitute: the IEA says Tesla's fully in-house EV battery production remained limited
              and that it continued to source most EV batteries from established suppliers. Solid-state efforts for
              eVTOL aircraft and storage products are adjacent arenas, not direct evidence of a qualified passenger-EV
              supply alternative. Buyers can therefore multi-source or pursue internal build, but the assigned sources
              do not quantify OEM switching costs, lock-in, multi-homing, distribution power, qualification timelines,
              or Juwan's access to customer programs and supply partners.
            claimRefs:
              - CP005
              - CP008
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP011
              - CP013
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP008
              - CP009
              - CP010
      - number: '3.4'
        title: Differentiation durability depends on manufacturing proof
        blocks:
          - type: paragraph
            body: >-
              Juwan's reported patent addresses a solid-solid interface design, but a patent description is evidence of
              a disclosed design, not proof of validated cell performance or a defensible commercial moat. Independent
              reporting on solid-state development identifies manufacturing yield, materials engineering, durability,
              and cycle life as barriers to deployment; the IEA separately notes that entrants generally take longer to
              ramp battery production than established manufacturers. A fast-charge proposition also depends on vehicle
              electronics and high-power charging infrastructure, while the Roland Berger index describes continued
              growth in ultra-fast public charging and a shift toward network utilization economics. The pool does not
              supply matched independent benchmarking, pricing, contract terms, buyer switching costs, or a Juwan
              production and repeat-order record. These gaps prevent a source-grounded claim that Juwan's patent or
              charge-speed positioning is durable against CATL, BYD, or other established suppliers.
            claimRefs:
              - CP007
              - CP009
              - CP012
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Patent evidence is not production proof
            body: >-
              The assigned source reports a Juwan solid-state patent but does not show matched cell tests, production
              yield, customer qualification, or repeat orders. Incumbent scale and solid-state manufacturing barriers
              therefore remain central diligence risks.
            calloutType: risk
            claimRefs:
              - CP001
              - CP007
              - CP009
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: 'Underwriting verdict: financials remain unverified'
        blocks:
          - type: paragraph
            body: >-
              No source in the assigned pool provides Juwan-specific financial statements, realized prices, gross
              margin, cash, burn, debt, or runway; the limitation is an evidence gap, not evidence that these values are
              zero. The available financial disclosure from BYD is an audited, diversified-group comparison: its FY2025
              revenue and gross margin cannot be carried over to Juwan or interpreted as battery-segment economics
              (CI001, CI002). The IEA reports lower battery prices and notes pressure on upstream material producers,
              while also describing substantial capacity and ramp-up demands (CI003, CI004, CI005, CI006, CI009). These
              are sector conditions, not Juwan results. Until company statements and operating records are available,
              underwriting should not infer revenue scale, positive contribution margin, cash adequacy, or the ability
              to fund plant ramp-up from market growth or another manufacturer's scale. The specific diligence items are
              set out below (CI016).
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
              - CI009
              - CI016
      - number: '4.2'
        title: 'Sector economics: demand does not guarantee returns'
        blocks:
          - type: paragraph
            body: >-
              Market indicators are growing but measure different activities and periods. The IEA reports global EV
              battery deployment of 1.2 TWh in 2025, nearly 30% above 2024, while CNEVPost, citing SNE Research, reports
              461.3 GWh of energy-storage battery shipments in the first half of 2026, up 71% year on year (CI010,
              CI011). Those figures are not additive or a proxy for Juwan shipments. The same IEA report says average
              battery prices fell 8% in 2025 and LFP packs averaged more than 40% below NMC per kWh, with part of that
              gap reflecting lower energy-density requirements in stationary storage (CI003, CI004). It also reports an
              18% 2025 operating margin for CATL and substantial capital expenditure and margin pressure among other
              producers (CI007, CI008, CI009). These manufacturer-specific outcomes reflect scale, product mix,
              location, policy support, and accounting choices; they are not a clean benchmark for a private battery
              developer.
            claimRefs:
              - CI003
              - CI004
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
      - number: '4.3'
        title: Revenue recognition and realized pricing require primary records
        blocks:
          - type: paragraph
            body: >-
              The evidence does not establish whether Juwan earns revenue from cells, packs, charging systems,
              integration, licensing, or after-sales services, nor does it identify contract terms, recognition timing,
              discounts, or customer payment schedules (CI016). The planned revenue and pricing schedules therefore
              separate candidate transaction types from verified results; every value remains unavailable rather than
              being inferred from a competitor's annual report or a market-volume series. Independent diligence should
              reconcile signed orders, deliveries and customer acceptance to invoices, recognized revenue, receivables,
              returns, and cash receipts. Battery-Tech reports intent orders and a price for an unnamed Guangzhou
              multicopter; its article separately discusses GAC's Govy AirCab and does not establish Juwan as a supplier
              or establish Juwan revenue (CI015, CI016). Fast-charge positioning also depends on compatible vehicle
              electronics and high-power grid infrastructure, so battery pricing alone would not reveal the complete
              customer proposition or channel economics (CI014).
            claimRefs:
              - CI016
              - CI014
          - type: table
            tableRef: TI001
            claimRefs:
              - CI016
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI003
              - CI016
      - number: '4.4'
        title: Capital adequacy and unit economics are blocking diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Public market evidence cannot answer whether Juwan has enough cash to reach sustained production. The IEA
              says global lithium-ion nameplate capacity exceeded 4 TWh at the end of 2025, while most facilities can
              take more than five years from start-up to approach nominal output (CI005, CI006). BloombergNEF likewise
              describes a major capacity and grid buildout as necessary under its energy-transition outlook, but
              supplies no Juwan financing evidence (CI013). Separately, Roland Berger reports that public charging
              infrastructure additions in 2025 shifted toward utilization and economics, a downstream deployment signal
              rather than evidence of battery orders (CI014). The underwriting file needs monthly cash balances and
              operating cash flows, committed and contingent debt, capex by facility, working-capital needs, and
              milestones that trigger additional financing. It also needs SKU-level cost, yield, utilization, warranty,
              and repeat-order records before any margin path or runway can be modeled (CI016).
            claimRefs:
              - CI005
              - CI006
              - CI013
              - CI014
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI008
              - CI009
              - CI016
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not underwrite a margin or runway case yet
            body: >-
              Obtain audited statements, customer-level revenue and collection records, SKU-level unit costs, and a
              funded capacity plan before assigning Juwan a revenue multiple or cash runway.
            calloutType: recommendation
            claimRefs:
              - CI006
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Company-specific evidence is limited to engineering signals
        blocks:
          - type: paragraph
            body: >-
              The assigned current evidence does not identify a verified Juwan product SKU, cell chemistry, cell format,
              pack design, charging specification, or production deployment. A Jobui page displayed Guangzhou listings
              dated 2026-09-02 for battery thermal-management, cell-materials development, structural simulation,
              embedded development, electrical engineering, electrochemical simulation, pilot-line supervision,
              cell-process quality, process technician, and solid-state battery engineering roles. This is a
              company-issued hiring signal reproduced on a third-party job platform, not independent validation of a
              product or operating capability. It suggests engineering workstreams worth testing, but does not prove
              that every role was filled, that a named technology reached production, or that Juwan has a solid-state
              product. Exact module ownership, customer workflow, maturity, and measurable benefit therefore remain
              open.
            claimRefs:
              - CE001
              - CE014
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE014
      - number: '5.2'
        title: Chemistry and manufacturing choices define the external benchmark
        blocks:
          - type: paragraph
            body: >-
              The IEA reports that lithium iron phosphate (LFP) represented over 55% of global EV battery deployment in
              2025, up from nearly 50% in 2024; that mix is industry context, not evidence that Juwan uses LFP. The IEA
              also describes sodium-ion's lower cell energy density relative to current LFP and nickel-manganese-cobalt
              cells, and says solid-state manufacturing and pack integration remain more complex than lithium-ion. A
              separate industry-news account reports a 480 Wh/kg EHang/Inx Energy solid-state battery flight, but the
              reported aircraft, battery developers, and result are not Juwan evidence or a comparable EV-battery
              benchmark. The practical diligence question is not whether a chemistry can produce a notable
              demonstration, but whether Juwan can validate its own design, safety, durability, yield, and cost at
              automotive scale.
