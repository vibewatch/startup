              - CO006
              - CO011
              - CO014
      - number: '1.4'
        title: Milestones show product activity, not proven operating scale
        blocks:
          - type: paragraph
            body: >-
              The profile records a 2021 pack-factory and vehicle-launch sequence, a 2022 charging-ecosystem alliance, a
              2023 Phoenix Battery announcement and factory opening, and 2024 battery-module and pack-line
              commissioning. Baike further reports an eVTOL battery-development collaboration with EHang and a December
