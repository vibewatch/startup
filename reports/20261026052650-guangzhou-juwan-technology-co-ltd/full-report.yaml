      - number: '7.3'
        title: Historical plans and rival claims do not resolve current economics
        blocks:
          - type: paragraph
            body: >-
              WiserAsia's 2022 account reported an RMB 8 billion valuation, battery production in GAC Aion models, and a
              plan with Tianshu Energy for 1,000 charging stations across 100 cities during 2022–2024 with investment
              above RMB 1 billion. These are historical reported figures and plans, not current valuation, available
              cash, completed investment, recurring revenue, or verified customer concentration. CNEVPost attributes FAW
              Hongqi fast-charge test results to the competitor and reports no mass-production timeline; those
              company-stated results are not an independent benchmark of Juwan. Roland Berger's 2026 index says charging
              infrastructure growth shifted toward utilization and economics in 2025. Reconcile current customer
              volumes, station utilization, partner commitments, cap table, cash needs, and independently witnessed
              battery performance. A missed contracted rollout milestone, loss of a critical OEM route, or an
              unfinanceable downside case should break the expansion thesis; the sources do not support numeric
              thresholds.
            claimRefs:
