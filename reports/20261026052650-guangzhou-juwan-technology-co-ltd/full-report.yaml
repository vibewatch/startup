              - CE012
      - number: '5.4'
        title: Product maturity and trust claims need primary proof
        blocks:
          - type: paragraph
            body: >-
              No eligible fetched source in this chapter's assigned pool verifies Juwan's battery chemistry, pack
              architecture, measured charge curve, cycle life, thermal-runaway controls, certification status,
              production yield, warranty performance, or customer deployment. The hiring snapshot is a lead for
              diligence, not a substitute for test reports or production records. Investors should request a SKU-level
              bill of materials and architecture, cell and pack test protocols with sample sizes and conditions,
              third-party safety and regulatory certificates, pilot-to-production yield and defect histories, warranty
              and field-incident denominators, and vehicle or charging-system integration records. Until those records
              are reviewed, neither a job title nor an industry demonstration supports a conclusion about Juwan's
              product maturity or differentiated performance. An allocated PatSnap page titled as a 2026 solid-state
              patent landscape displayed only an update notice, so it did not provide a usable view of Juwan's patent
              position. Investors should also request patent ownership and freedom-to-operate records.
            claimRefs:
              - CE001
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not underwrite hiring signals as product proof
            body: >-
              The job listings point to technical workstreams but do not verify a shipped design, measured performance,
              safety certification, or production yield.
            calloutType: risk
            claimRefs:
              - CE001
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segments and buying context
        blocks:
          - type: paragraph
            body: >-
              The available evidence points to commercial-vehicle fleets as the clearest Juwan-linked customer surface:
              a February 2025 release describes heavy trucks equipped with Juwan batteries delivered at a ceremony
              involving Chongzuo Urban Construction, Shaanxi Western Zhilian, and other industry parties (CU001, CU002).
              It does not identify a purchasing entity, units delivered, contract terms, or revenue. Independently, the
              IEA reports electric trucks were a growing share of 2025 battery deployment, while Xinhua describes
              commercial heavy-truck use across logistics, ports, and mines (CU005, CU006, CU007). These sources
              establish relevant market settings, not Juwan deployments. Passenger EVs and emerging mobility are
              adjacent demand contexts only; the pool contains no evidence tying those named programs to Juwan (CU009,
              CU013). Xinhua also describes road-access, regulatory, perception, and liability barriers to scaling
              intelligent heavy trucks; this is a segment-level caveat, not a finding about Juwan (CU016).
            claimRefs:
