      - number: '6.2'
        title: Adoption signals and proof quality
        blocks:
          - type: paragraph
            body: >-
              The strongest company-specific adoption signal is the reported delivery ceremony for
              Juwan-battery-equipped commercial trucks in Chongzuo; the announcement calls this a multi-party
              commercial-vehicle collaboration, but remains a single company-oriented account rather than independent
              customer confirmation (CU001, CU002). The same release attributes fast charging and operating-efficiency
              figures to the delivered system, including a 10%-to-80% charge in 15 minutes and a claimed 15-minute
              charge-to-four-hour-operation pattern (CU003, CU004). These are reported product propositions, not audited
              fleet outcomes. IEA and Roland Berger describe broad EV and battery adoption trends, while separate
              coverage reports GAC's claim of more than 10,000 Aion V orders after launch; none verifies a Juwan supply
              relationship (CU007, CU008, CU009, CU010). Accordingly, logos, adjacent-market demand, and supplier claims
              should not be treated as Juwan customer count or production-scale proof.
            claimRefs:
              - CU001
