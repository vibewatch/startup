      - number: '6.3'
        title: Durability, expansion, and concentration remain unproven
        blocks:
          - type: paragraph
            body: >-
              No source in this assigned pool reports Juwan customer-level repeat orders, renewal or retention rates,
              active fleet utilization, warranty experience, or a revenue-ranked customer mix. The delivery release
              names several parties and describes planned future commercial-vehicle models, but does not disclose their
              respective buyer, payer, or channel roles, nor whether the reported delivery converted into recurring
              supply (CU002, CU014). Broader evidence shows that battery makers pursue automaker and infrastructure
              partnerships, but CATL's reported network and SVOLT's exhibition discussions belong to competitors and are
              not benchmarks for Juwan's conversion or expansion (CU011, CU012). The customer thesis therefore depends
              on private diligence: identify the contracting buyer, confirm serial-production status and deliveries, and
              reconcile repeat orders and customer concentration to audited revenue. Retention and adverse customer
              experience remain open questions, not evidence of either success or failure (CU015).
            claimRefs:
