  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Decision: research more before assigning a price'
        blocks:
          - type: paragraph
            body: >-
              The available record does not support a current company valuation or an entry price. Just Auto reported in
              2023 that Juwan had started XFC battery production and described a 4 GWh annual nameplate capacity at a
              new Guangzhou plant; InsideEVs separately reported a 2022 charge test on a GAC Aion V. Both are historical
              operating or product signals, not evidence of present utilization, repeat orders, realized revenue,
              margin, or cash generation. Industry pack-price and EV-market estimates provide context, not a Juwan
              forecast or a valuation multiple. Accordingly, the recommendation is research-more, confidence is low, and
              valuation stance is unknown rather than an extrapolation from an earlier reported mark. The underwriting
              risk is high because price, dilution, preferences, and current operating economics are unresolved.
            claimRefs:
