  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal exposure is plausible but company-specific status is unverified
        blocks:
          - type: paragraph
            body: >-
              Two 2026 legal summaries describe Chinese courts' treatment of technology-related disputes, including
              patents, trade secrets, employee inventions, and technical fact finding. They establish relevant legal
              pathways, not litigation involving Juwan: the cases concern other parties, and the assigned sources do not
              verify Juwan's patent ownership, freedom to operate, employee-invention assignments, or any pending case.
              The distinction matters because a battery developer's IP position can affect product launch, licensing
              economics, and access to OEM programs, while an adverse case could create damages or injunction exposure.
              Treat the legal risk as unresolved rather than as a recorded incident; obtain counsel-reviewed schedules
              of owned/licensed patents, material disputes, and employee assignments before underwriting the residual
              risk. A verified injunction risk or a material ownership gap affecting core technology should pause
              investment approval; the assigned sources do not support a probability or damages estimate for Juwan.
            claimRefs:
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR005
              - CR006
      - number: '7.2'
        title: Concentrated inputs and unverified qualification create execution downside
        blocks:
          - type: paragraph
            body: >-
              The IEA estimates that China represented around 80% of global lithium-ion battery supply-chain production
              capacity in 2024; its 2024 disruption analysis estimates that each month of interruption in battery
              exports from the largest supplier could affect USD 17 billion of electric-car plant output elsewhere.
              These are sector measures, not a map of Juwan's suppliers or its loss exposure. Marsh separately
              identifies geopolitical, weather, labor, cyber, and cost shocks as supply-chain risks. The IEA's 2026
              battery outlook also reports lithium prices at the beginning of 2026 were more than twice those in the
              same period of 2025, while still around 70% below the 2022 peak. WiserAsia's 2022 article records market
              uncertainty about graphene-battery reliability and safety; this is a historical concern, not a current
              test result or incident report. Obtain Juwan's supplier map, price pass-through terms, alternate-source
              qualifications, and independently witnessed safety, degradation, cycle-life, yield, and field data. A
              failed agreed safety gate or a critical single-source input without a qualified alternative should trigger
              a pause; public evidence does not justify a numeric threshold.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR012
              - CR014
              - CR015
              - CR016
