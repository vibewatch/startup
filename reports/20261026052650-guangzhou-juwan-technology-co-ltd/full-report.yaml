      - number: '8.3'
        title: Scenario cases and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The scenarios below are conditional decision cases, not forecasts. The bull case requires repeat
              production orders, independently verified yield and durability, positive contribution economics, and an
              entry price that reflects financing rights and dilution. The base case is to wait: historical product and
              capacity signals remain encouraging, but current company-level inputs are missing. The bear case is that
              high-volume production or customer conversion disappoints while established suppliers and falling pack
              prices constrain differentiation and margins. No probability percentages, enterprise values, or target
              returns are assigned because the source pool contains neither Juwan financials nor matched private-round,
              transaction, or public-company multiples. A price change alone would not resolve the evidence gaps;
              data-room verification is the gating step.
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV011
              - CV012
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV011
              - CV012
              - CV014
              - CV016
      - number: '8.4'
        title: Exit readiness and diligence gates
        blocks:
          - type: paragraph
            body: >-
              The eligible evidence does not establish an exit path, current liquidity, or the capitalization terms
              available to a minority investor. The BYD filing-index page is a competitor reference, not a valuation
              benchmark, and the market-research reports provide no matched company multiples. Before pricing an
              investment, obtain audited or otherwise reconciled revenue and margin history, plant utilization and
              yield, repeat-order and customer-concentration data, cell-level safety and degradation results, current
              debt and cash runway, the fully diluted cap table, liquidation preferences, and transfer or exit rights.
              Re-underwrite only after these inputs can be reconciled to a defined financing price. A verified step-up
              in repeat volume and margins could move the view toward track; unresolved economics or restrictive terms
              should keep the company out of a priced decision.
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: No price-supported entry on this evidence
            body: >-
              The current evidence set does not support a company valuation, return target, or valuation-stanced price.
              Request current operating and financing data before investing.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
