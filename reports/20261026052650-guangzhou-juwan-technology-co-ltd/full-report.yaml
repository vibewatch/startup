      - number: '5.3'
        title: Fast charging is a battery, vehicle, infrastructure, and grid problem
        blocks:
          - type: paragraph
            body: >-
              Published competitor charging claims illustrate the system boundary rather than establish Juwan
              performance. Gulf News attributes sub-ten-minute charge claims to CATL and BYD, while Electrek reports
              CATL's stated internal-resistance and cold-temperature figures; these are manufacturer claims reproduced
              in media, not independent like-for-like benchmark tests or evidence of Juwan performance. The Gulf News
              account notes that very high charging rates also require high-power chargers, suitable vehicle
              electronics, and grid capacity. Separately, Roland Berger describes a 2025 shift in public charging from
              installation growth toward utilization and network performance. A peer-reviewed three-city simulation
              using 769,225 public charging orders found that modeled ultra-fast charging deployment could increase load
              peak-to-valley differences. These sources make charging compatibility, thermal control, power electronics,
              site capacity, and operating controls material diligence items, while leaving Juwan's actual integration
              and field reliability unverified.
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
