  - id: TV003
    title: Bull / base / bear decision cases
    columns:
      - Case
      - Explicit assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger or diligence gate
    rows:
      - - Bull
        - Repeat orders, scaled output, safe and durable fast charging, and positive contribution economics are independently verified
        - Upside may be underwritten only against verified company cash flows and a price accounting for dilution and preferences; no numeric range supported
        - Not quantified; depends on unverified operating milestones
        - Failure to convert announced capacity into repeat profitable shipments
      - - Base
        - Historical technical milestones remain valid but current operating and financing data remain unavailable
        - Defer price and return modeling until revenue, margins, utilization, cap table, and terms are reconciled
        - Current decision case; not a statistical probability estimate
        - No access to reconciled financials or investor rights before investment
      - - Bear
        - Slow commercialization, weak utilization or yield, adverse customer concentration, or incumbent price competition
        - Material downside is possible, but cannot be quantified without cash burn, debt, runway, and security terms
        - Not quantified; the evidence pool cannot support calibrated odds
        - No repeat orders, deteriorating unit economics, safety / degradation failures, or restrictive preferences
    notes: "These are conditional underwriting scenarios, not company forecasts. No precise valuation, probability, or return is supplied because current company financials, comparable transactions, and financing terms are absent."
    claimRefs:
