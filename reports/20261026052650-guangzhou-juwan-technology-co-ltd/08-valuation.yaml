company:
  name: Guangzhou Juwan Technology Co., Ltd.
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports historical XFC product and plant milestones and a large, competitive EV-battery market, but it does not establish Juwan's current revenue, margins, utilization, financing terms, or a defensible company valuation. The price-sensitive call is research-more, with no numerical valuation or return range asserted.
sections:
  - id: decision
    title: "Decision: research more before assigning a price"
    body: >-
      The available record does not support a current company valuation or an entry price. Just Auto reported in 2023 that Juwan had started XFC battery production and described a 4 GWh annual nameplate capacity at a new Guangzhou plant; InsideEVs separately reported a 2022 charge test on a GAC Aion V. Both are historical operating or product signals, not evidence of present utilization, repeat orders, realized revenue, margin, or cash generation. Industry pack-price and EV-market estimates provide context, not a Juwan forecast or a valuation multiple. Accordingly, the recommendation is research-more, confidence is low, and valuation stance is unknown rather than an extrapolation from an earlier reported mark. The underwriting risk is high because price, dilution, preferences, and current operating economics are unresolved.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV007
      - CV008
      - CV016
    tableRefs:
      - TV001
  - id: market-and-commercial-proof
    title: Market demand is real; company capture remains unproven
    body: >-
      Independent market sources describe EV adoption and battery demand growth, but their estimates use different denominators. MarketsandMarkets sizes the EV-battery market, while Grand View Research sizes the broader battery-electric-vehicle market; neither is Juwan's serviceable market or a company revenue forecast. Axis Intelligence Research reports falling average pack prices, a structural cost opportunity for adoption but also a potential squeeze on supplier pricing. The company-specific evidence is narrower: Just Auto's 2023 report describes production and named supply relationships, and InsideEVs recounts a 2022 vehicle charge test. Those dated reports support technical and commercialization history, not current customer retention, field reliability, production yield, or willingness to pay. A current underwriting case therefore needs verified customer and plant data before converting market growth into company value.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV013
    tableRefs:
      - TV002
    figureRefs:
      - FV001
  - id: cases-and-entry-discipline
    title: Scenario cases and entry discipline
    body: >-
      The scenarios below are conditional decision cases, not forecasts. The bull case requires repeat production orders, independently verified yield and durability, positive contribution economics, and an entry price that reflects financing rights and dilution. The base case is to wait: historical product and capacity signals remain encouraging, but current company-level inputs are missing. The bear case is that high-volume production or customer conversion disappoints while established suppliers and falling pack prices constrain differentiation and margins. No probability percentages, enterprise values, or target returns are assigned because the source pool contains neither Juwan financials nor matched private-round, transaction, or public-company multiples. A price change alone would not resolve the evidence gaps; data-room verification is the gating step.
    claimRefs:
      - CV002
      - CV004
      - CV005
      - CV011
      - CV012
      - CV014
      - CV016
    tableRefs:
      - TV003
  - id: exit-and-diligence
    title: Exit readiness and diligence gates
    body: >-
      The eligible evidence does not establish an exit path, current liquidity, or the capitalization terms available to a minority investor. The BYD filing-index page is a competitor reference, not a valuation benchmark, and the market-research reports provide no matched company multiples. Before pricing an investment, obtain audited or otherwise reconciled revenue and margin history, plant utilization and yield, repeat-order and customer-concentration data, cell-level safety and degradation results, current debt and cash runway, the fully diluted cap table, liquidation preferences, and transfer or exit rights. Re-underwrite only after these inputs can be reconciled to a defined financing price. A verified step-up in repeat volume and margins could move the view toward track; unresolved economics or restrictive terms should keep the company out of a priced decision.
    claimRefs:
      - CV013
      - CV014
      - CV015
      - CV016
