  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Investment question
      - Evidence-supported thesis
      - Anti-thesis or unresolved counterpoint
      - What would change the view
    rows:
      - - Product differentiation
        - A 2022 report describes a GAC Aion V test reaching 80% charge from 29% in 10 minutes
        - One historical test does not establish fleet reliability, warranty performance, yield, or current product specifications
        - Independent repeat tests plus cell-level degradation and safety data
      - - Commercialization
        - A 2023 report says production started and names GAC Aion and Hycan supply relationships
        - No current volume, repeat order, realized price, or customer concentration is established
        - Customer-confirmed shipments, repeat orders, and contribution margins
      - - Market opportunity
        - Published sources report EV adoption and battery-market growth
        - Vehicle-market and battery-market estimates are not interchangeable and neither measures Juwan's addressable revenue
        - A segment-level serviceable market and verified win-rate / share evidence
      - - Economics and competition
        - Battery costs and large-scale deployment make fast charging a relevant market attribute
        - Falling pack prices and concentrated incumbent supply can limit pricing power; company economics are unknown
        - Current cost curve, yield, utilization, contract pricing, and defensible customer switching evidence
    notes: "Company milestones are historical third-party reports; market estimates retain each publisher's market definition. Competitor listings are qualitative context, not independent valuation benchmarks."
