  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: current-valuation-and-financing
      missingEvidence: Current financing round price, valuation basis, fully diluted cap table, debt, liquidation preferences, dilution mechanics, and minority-investor protections.
      whyItMatters: Without price and security terms, public evidence cannot establish entry value, downside priority, ownership dilution, or expected return.
      diligencePath: Request the current financing deck, term sheet, fully diluted cap table, debt schedule, preference waterfall, and investor-rights documents; reconcile them with the proposed investment price.
      relatedQuestionRefs:
        - QV004
      relatedTableRefs:
        - TV001
        - TV003
    - type: private-evidence-only
      severity: blocking
      topic: current-operating-financials
      missingEvidence: Current revenue, gross margin, contribution margin, cash burn, runway, plant utilization, yield, and cash conversion.
      whyItMatters: These inputs determine whether announced capacity can generate cash and whether a revenue or earnings valuation method is appropriate.
      diligencePath: Obtain audited or reconciled monthly financials and plant KPIs, then tie shipments, realized prices, unit costs, and cash movement to customer invoices and production records.
      relatedQuestionRefs:
        - QV004
      relatedTableRefs:
        - TV001
        - TV003
    - type: missing-source
      severity: material
      topic: current-customer-evidence
