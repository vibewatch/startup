company:
  name: Guangzhou Juwan Technology Co., Ltd.
chapter:
  number: 4
  title: Financials
  summary: The assigned evidence does not establish Juwan's revenue, realized pricing, margins, cash, burn, or financing needs. Battery-industry evidence shows falling prices, long manufacturing ramps, and uneven producer profitability, so peer and market indicators cannot substitute for Juwan's private operating data.
sections:
  - id: underwriting-verdict
    title: "Underwriting verdict: financials remain unverified"
    body: >-
      No source in the assigned pool provides Juwan-specific financial statements,
      realized prices, gross margin, cash, burn, debt, or runway; the limitation is
      an evidence gap, not evidence that these values are zero. The available
      financial disclosure from BYD is an audited, diversified-group comparison:
      its FY2025 revenue and gross margin cannot be carried over to Juwan or
      interpreted as battery-segment economics (CI001, CI002). The IEA reports
      lower battery prices and notes pressure on upstream material producers,
      while also describing substantial capacity and ramp-up demands (CI003,
      CI004, CI005, CI006, CI009). These are sector conditions, not Juwan results.
      Until company statements and operating records are available, underwriting
      should not infer revenue scale, positive contribution margin, cash adequacy,
      or the ability to fund plant ramp-up from market growth or another
      manufacturer's scale. The specific diligence items are set out below
      (CI016).
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI009
      - CI016
  - id: sector-economics
    title: "Sector economics: demand does not guarantee returns"
    body: >-
      Market indicators are growing but measure different activities and periods.
      The IEA reports global EV battery deployment of 1.2 TWh in 2025, nearly 30%
      above 2024, while CNEVPost, citing SNE Research, reports 461.3 GWh of
      energy-storage battery shipments in the first half of 2026, up 71% year on
      year (CI010, CI011). Those figures are not additive or a proxy for Juwan
      shipments. The same IEA report says average battery prices fell 8% in 2025
      and LFP packs averaged more than 40% below NMC per kWh, with part of that
      gap reflecting lower energy-density requirements in stationary storage
      (CI003, CI004). It also reports an 18% 2025 operating margin for CATL and
      substantial capital expenditure and margin pressure among other producers
      (CI007, CI008, CI009). These manufacturer-specific outcomes reflect scale,
      product mix, location, policy support, and accounting choices; they are
      not a clean benchmark for a private battery developer.
    claimRefs:
      - CI003
      - CI004
      - CI007
      - CI008
      - CI009
      - CI010
      - CI011
  - id: revenue-and-pricing
    title: Revenue recognition and realized pricing require primary records
    body: >-
      The evidence does not establish whether Juwan earns revenue from cells,
      packs, charging systems, integration, licensing, or after-sales services,
      nor does it identify contract terms, recognition timing, discounts, or
      customer payment schedules (CI016). The planned revenue and pricing
      schedules therefore separate candidate transaction types from verified
      results; every value remains unavailable rather than being inferred from
      a competitor's annual report or a market-volume series. Independent
      diligence should reconcile signed orders, deliveries and customer
      acceptance to invoices, recognized revenue, receivables, returns, and
      cash receipts. Battery-Tech reports intent orders and a price for an
      unnamed Guangzhou multicopter; its article separately discusses GAC's
      Govy AirCab and does not establish Juwan as a supplier or establish Juwan
      revenue (CI015, CI016). Fast-charge positioning
      also depends on compatible vehicle electronics and high-power grid
      infrastructure, so battery pricing alone would not reveal the complete
      customer proposition or channel economics (CI014).
    claimRefs:
      - CI016
      - CI014
    tableRefs:
      - TI001
      - TI002
  - id: capital-and-unit-economics
    title: Capital adequacy and unit economics are blocking diligence gaps
    body: >-
      Public market evidence cannot answer whether Juwan has enough cash to reach
      sustained production. The IEA says global lithium-ion nameplate capacity
      exceeded 4 TWh at the end of 2025, while most facilities can take more
      than five years from start-up to approach nominal output (CI005, CI006).
      BloombergNEF likewise describes a major capacity and grid buildout as
      necessary under its energy-transition outlook, but supplies no Juwan
      financing evidence (CI013). Separately, Roland Berger reports that public
      charging infrastructure additions in 2025 shifted toward utilization and
      economics, a downstream deployment signal rather than evidence of battery
      orders (CI014). The underwriting file needs monthly cash balances and
      operating cash flows, committed and contingent debt, capex by facility,
      working-capital needs, and milestones that trigger additional financing.
      It also needs SKU-level cost, yield, utilization, warranty, and repeat-order
      records before any margin path or runway can be modeled (CI016).
    claimRefs:
      - CI005
      - CI006
      - CI013
      - CI014
      - CI016
    tableRefs:
      - TI003
    figureRefs:
      - FI001
tables:
  - id: TI001
    title: "Revenue streams: candidate mechanisms, not verified Juwan revenue"
    columns:
      - Candidate stream to verify
      - Mechanism / unit to establish
      - Current value or status
      - Diligence evidence required
    rows:
      - - Cell or battery product sales
        - Contracted unit and accepted quantity
        - Not disclosed in assigned evidence
        - Reconcile customer contracts, shipments, acceptance and invoices
      - - Battery pack or system sales
        - Pack/system scope, bundled components and warranty obligation
        - Not disclosed in assigned evidence
        - Obtain SKU-level contracts, delivery records and revenue policy
      - - Charging-system or integration revenue
        - Hardware, installation and recurring service components
        - Not disclosed in assigned evidence
        - Separate hardware, installation, service and pass-through amounts
      - - Licensing or after-sales services
        - License, maintenance or support fee and recognition period
        - Not established by assigned evidence
        - Confirm executed agreements, renewal terms and recognized revenue
    notes: Candidate categories are diligence prompts, not confirmed Juwan revenue streams; assigned evidence contains no Juwan revenue breakdown.
    claimRefs:
      - CI016
  - id: TI002
    title: "Pricing and monetization: no public realized-price evidence"
    columns:
      - Metric
      - Current evidence
      - Underwriting treatment
      - Specific diligence request
    rows:
      - - List price by cell, pack or system
        - Not disclosed for Juwan
        - Unknown; do not substitute peer claims
        - Obtain dated price lists by SKU and customer segment
      - - Realized price and discounting
        - Not disclosed for Juwan
        - Unknown; list price would not equal net sales
        - Reconcile invoices to rebates, credits and contract discounts
      - - Contract duration and committed volume
        - No Juwan customer contract in assigned pool
        - No backlog or take-or-pay assumption
        - Review executed agreements, amendments, cancellations and minimums
      - - Payment and collection terms
        - No Juwan terms or receivables data in assigned pool
        - Cash conversion cannot be estimated
        - Obtain aging, deposits, milestone terms and subsequent receipts
    notes: All company-specific pricing and contract fields remain unavailable; the public peer and market figures cited in the chapter are not Juwan realized prices.
    claimRefs:
      - CI001
      - CI003
      - CI016
  - id: TI003
    title: "Unit economics and capital adequacy: private data required"
    columns:
      - Metric
      - Value
      - Why it matters
      - Specific diligence request
    rows:
      - - Gross margin by SKU and customer
        - null
        - Product mix and realized price may conceal loss-making contracts
        - Reconcile net revenue, bill of materials, conversion cost and warranty
      - - Cost per kWh and material exposure
        - null
        - Battery chemistry and material-price exposure drive contribution margin
        - Obtain dated costed BOMs, supplier quotes and hedging or pass-through terms
      - - Yield, scrap and nameplate utilization
        - null
        - Ramp-up affects sellable output and fixed-cost absorption
        - Request monthly line data for yield, scrap, uptime and utilization
      - - Working capital and cash conversion
        - null
        - Receivables, inventory and supplier terms can consume cash despite sales
        - Obtain monthly cash-flow statements, aging, inventory turns and payables
      - - Cash runway, debt and committed capex
        - null
        - Determines whether the company can fund qualification and production ramp
        - Review current cash, monthly burn, debt schedule, covenants and approved capex
    notes: null means no Juwan-specific value was disclosed in the assigned evidence; it is not zero. Peer capex and margins are context only.
    claimRefs:
      - CI005
      - CI006
      - CI008
      - CI009
      - CI016
