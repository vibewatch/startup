  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: company-financial-disclosure
      missingEvidence: Audited annual and current monthly Juwan financial statements, including revenue by product, recognition policies, gross margin, cash, operating cash flow, debt, and committed capex.
      whyItMatters: Without the core statements, neither operating performance nor the ability to finance qualification and manufacturing ramp can be assessed.
      diligencePath: Request audited statements for the last three fiscal years, monthly management accounts through the latest quarter, bank confirmations, debt schedules, and an approved facility-level cash and capex plan.
    - type: private-evidence-only
      severity: material
      topic: realized-pricing-and-orders
      missingEvidence: Customer-level executed contracts, committed order volumes, delivered and accepted quantities, realized prices, discounts, cancellation rights, receivables, and cash collections.
      whyItMatters: Announced intent orders, list prices, or market shipment growth do not establish Juwan backlog, repeat revenue, collection quality, or customer concentration.
      diligencePath: Reconcile the top-customer contract register to shipments, acceptance certificates, invoices, credit notes, receivables aging, and subsequent receipts.
    - type: private-evidence-only
      severity: blocking
      topic: unit-economics-and-ramp
      missingEvidence: SKU-level bill of materials, conversion costs, yield, scrap, utilization, warranty costs, working-capital requirements, and capacity ramp milestones.
      whyItMatters: Industry prices and peer margins cannot establish Juwan contribution margin, fixed-cost absorption, or the cash required to reach nominal output.
      diligencePath: Obtain costed BOMs and monthly production/quality data by line and SKU, then reconcile those records to inventory, warranty claims, customer deliveries, and the facility budget.
    - type: missing-source
