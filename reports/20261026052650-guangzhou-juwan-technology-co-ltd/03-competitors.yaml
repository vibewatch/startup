      - ["LFP versus NMC pack benchmark", "The IEA reports average LFP packs were more than 40% cheaper per kWh than NMC alternatives in 2025; this is not a vendor quote.", "Chemistry-level pack comparison; the IEA says stationary-storage applications partly contribute to the price gap.", "No Juwan-, CATL-, or BYD-specific price, discount, or contract is provided.", "Use only as a chemistry-level reference and adjust for application and pack configuration."]
