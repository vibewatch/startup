company:
  name: Guangzhou Juwan Technology Co., Ltd.
chapter:
  number: 3
  title: Competitors
  summary: >-
    Public evidence places Juwan in a battery market where Chinese incumbents
    have scale, multiple chemistry and product routes, and fast-charge claims,
    while Juwan's assigned evidence chiefly documents a solid-state patent
    filing rather than comparable production or performance. The available
    sources support a competitive map, not a like-for-like ranking: prices,
    customer wins, yields, and tested cell performance remain unverified.
sections:
  - id: incumbent-landscape
    title: Scale and product breadth favor established suppliers
    body: >-
      The most consequential competitive constraint is incumbent scale, not a
      single public charging-time comparison. The IEA reports that Chinese
      producers supplied almost 75% of global electric-car battery deployment
      in 2025, and that China held over 80% of global lithium-ion battery
      manufacturing capacity at year-end. The same source says new entrants
      typically need longer to ramp than established producers with advanced
      manufacturing and supply-chain experience. Bloomberg's account of CATL
      and BYD describes distinct product approaches: CATL's LFP Shenxing
      fast-charge line and nickel-rich Qilin, and BYD's LFP Blade platform.
      Those company-reported specifications are not independently matched
      tests. The table therefore distinguishes direct incumbents from
      adjacent energy-storage and future-chemistry competitors, and leaves
      commercial scale, customer mix, and realized prices blank when the
      assigned evidence does not establish them.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP009]
    tableRefs: [TP001]
  - id: capability-and-pricing
    title: Fast-charge claims are not a comparable benchmark
    body: >-
      CATL's reported third-generation Shenxing and BYD's reported second-
      generation Blade charging windows create a visible performance
      challenge for any supplier positioning around extreme-fast charging.
      Bloomberg attributes the headline charge rates to the companies; it
      does not establish identical test conditions, cell format, temperature,
      starting state of charge, charging infrastructure, or vehicle-level
      validation. SVOLT's SNEC announcement describes a fast-charging
      residential-storage cell, but that product is not a passenger-EV
      cell-to-cell comparator. The only Juwan-specific technology evidence in
      this pool is a reported solid-state patent description. No source here
      establishes Juwan's current production yield, charge curve, cycle life,
      warranty, realized pricing, or customer deployment, so those cells stay
      explicitly unknown rather than being inferred from the patent.
    claimRefs: [CP003, CP004, CP006, CP007]
    tableRefs: [TP002]
  - id: adjacency-and-substitutes
    title: Alternative chemistries and buyer build-or-buy options
    body: >-
      Competition also comes from chemistry choices and the buyer's sourcing
      decision. Bloomberg describes CATL's sodium-ion and nickel-rich routes
      alongside LFP, while the IEA reports that LFP exceeded 55% of global EV
      battery deployment in 2025; the latter notes that lower prices partly
      reflect stationary-storage applications and should not be read as an
      apples-to-apples EV cost benchmark. Internal production is a real but
      difficult substitute: the IEA says Tesla's fully in-house EV battery
      production remained limited and that it continued to source most EV
      batteries from established suppliers. Solid-state efforts for eVTOL
      aircraft and storage products are adjacent arenas, not direct evidence
      of a qualified passenger-EV supply alternative. Buyers can therefore
      multi-source or pursue internal build, but the assigned sources do not
      quantify OEM switching costs, lock-in, multi-homing, distribution power,
      qualification timelines, or Juwan's access to customer programs and
      supply partners.
    claimRefs: [CP005, CP008, CP010, CP011, CP012]
    tableRefs: [TP003]
    figureRefs: [FP001]
  - id: durability-and-evidence-gaps
    title: Differentiation durability depends on manufacturing proof
    body: >-
      Juwan's reported patent addresses a solid-solid interface design, but a
      patent description is evidence of a disclosed design, not proof of
      validated cell performance or a defensible commercial moat. Independent
      reporting on solid-state development identifies manufacturing yield,
      materials engineering, durability, and cycle life as barriers to
      deployment; the IEA separately notes that entrants generally take
      longer to ramp battery production than established manufacturers. A
      fast-charge proposition also depends on vehicle electronics and
      high-power charging infrastructure, while the Roland Berger index
      describes continued growth in ultra-fast public charging and a shift
      toward network utilization economics. The pool does not supply matched
      independent benchmarking, pricing, contract terms, buyer switching
      costs, or a Juwan production and repeat-order record. These gaps prevent
      a source-grounded claim that Juwan's patent or charge-speed positioning
      is durable against CATL, BYD, or other established suppliers.
    claimRefs: [CP007, CP009, CP012]
