callouts:
  - calloutType: risk
    title: Patent evidence is not production proof
    body: >-
      The assigned source reports a Juwan solid-state patent but does not show
      matched cell tests, production yield, customer qualification, or repeat
      orders. Incumbent scale and solid-state manufacturing barriers therefore
      remain central diligence risks.
    claimRefs: [CP001, CP007, CP009]
