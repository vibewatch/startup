company:
  name: Guangzhou Juwan Technology Co., Ltd.
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Guangzhou Juwan Technology Research is described as a Guangzhou-based developer
    of extreme-fast-charging batteries and energy-storage systems, with products
    spanning passenger and commercial vehicles and an emerging eVTOL effort.
    Available evidence documents product and factory milestones but does not establish
    current revenue, utilization, customer concentration, or cash runway; reported
    funding labels and dates also conflict.
sections:
  - id: identity-and-business
    title: Identity, operating perimeter, and product claims
    body: >-
      Tracxn describes Guangzhou Juwan Technology as founded in 2020 and headquartered
      in Guangzhou; Baidu Baike gives the formal name Guangzhou Juwan Technology
      Research Co., Ltd., a September 2020 founding date, and Nansha District as its
      headquarters. Baike characterizes it as a mixed-ownership enterprise incubated
      within GAC Group, while Tracxn describes its business as extreme-fast-charging
      batteries and energy-storage systems. Baike reports R&D, production, sales, and
      service across batteries and energy-storage devices, and attributes a 0–80%
      charging-in-7.5-minutes claim to its battery product. That charging figure is
      a reported product claim, not an independently reproduced test: the source
      excerpt does not provide a test protocol, pack conditions, or comparable
      vehicle-level result. The operating model therefore appears to combine battery
      development and manufacturing with a charging ecosystem, but current revenue
      contribution by line is unavailable.
    claimRefs: [CO001, CO002, CO003, CO012]
    tableRefs: [TO001]
  - id: capital-and-scale
    title: Financing and scale remain poorly evidenced
    body: >-
      Tracxn lists two funding rounds, Seed in July 2021 and Series A on April 15,
      2022, with amounts undisclosed. Baike instead labels the July 2021 event
      Pre-A and places Series A in May 2022. These accounts differ on both the
      round label and the later date, so the public record in this pool does not
      support a reconciled round chronology or total equity raised. Baike separately
      reports more than RMB 150 million of climate-loan support in December 2025;
      that is debt/credit support, not evidence of equity raised or cash still
      available. Tracxn displays five employees as of September 30, 2026, a
      directory estimate that is not corroborated here and should not be equated
      with factory staffing or production capacity. Current revenue, run-rate,
      customer count, valuation, gross margin, burn, and runway remain unsupported
      in the assigned evidence.
    claimRefs: [CO006, CO007, CO008, CO009]
    tableRefs: [TO002]
  - id: leadership-and-governance
    title: Leadership visibility and governance diligence
    body: >-
      Baike names Huang Xiangdong and Pei Feng as founders and lists Huang as
      chairman/CTO and Pei as president. Tracxn calls “Feng Pei” the current CEO;
      the reversed name order may refer to the same person, but the available
      sources do not resolve identity or whether the CEO and president titles
      describe the same current role. Baike's profile also describes Juwan as
      GAC-incubated and mixed-ownership, but the pool contains no current cap table,
      board composition, shareholder rights, leadership succession detail, or
      independent confirmation of key-person dependencies. The technical credentials
      attributed to the named executives provide relevant founder-market context,
      but claims about their backgrounds are profile-level reporting rather than
      independently verified biographies. Diligence should obtain current corporate
      registry extracts, an organization chart, board materials, and role-confirmed
      references before relying on the listed titles.
    claimRefs: [CO011]
    tableRefs: [TO003]
  - id: milestones-and-execution
    title: Milestones show product activity, not proven operating scale
    body: >-
      The profile records a 2021 pack-factory and vehicle-launch sequence, a 2022
      charging-ecosystem alliance, a 2023 Phoenix Battery announcement and factory
      opening, and 2024 battery-module and pack-line commissioning. Baike further
      reports an eVTOL battery-development collaboration with EHang and a December
      2025 climate-loan event. These milestones support a history of product,
      manufacturing, and adjacency activity, but several are profile-reported or
      company-claim-based and do not establish current yield, throughput, customer
      repeat orders, or utilization. Sector evidence reinforces why those gaps
      matter: the IEA says most battery facilities can take more than five years
      from start of operations to approach nominal output, while Roland Berger
      describes charging economics shifting toward utilization. Neither is a
      Juwan-specific performance assessment. The timeline preserves dated events;
      the unverified commercial and operating metrics are explicit diligence gaps.
    claimRefs: [CO013, CO014, CO015, CO017, CO018, CO019, CO020]
    figureRefs: [FO001]
