callouts:
  - calloutType: risk
    title: Production milestones do not establish scale economics
    body: >-
      Factory and product milestones are profile-reported, while current revenue,
      output, yield, utilization, repeat orders, and cash runway are absent from
      the assigned evidence. Treat plant scale and commercial traction as diligence
      questions rather than established outcomes.
    claimRefs: [CO008, CO009, CO013, CO015]
  - calloutType: insight
    title: Funding chronology needs primary-document reconciliation
    body: >-
      Tracxn and Baidu Baike differ on the 2021 round label and the 2022 Series A
      date. Baike's separate 2025 climate-loan account should not be combined with
      equity funding or treated as available cash.
    claimRefs: [CO006, CO007, CO008]
