evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-operating-and-financial-scale
    missingEvidence: >-
      Current revenue, product-line mix, gross margin, cash burn, runway, customer count, and plant-level output, yield,
      utilization, and scrap rates.
    whyItMatters: >-
      Without operating data, the reported factory and product milestones cannot establish repeatable commercial scale,
      unit economics, or financing needs.
    diligencePath: >-
      Request audited financial statements and monthly management accounts, plus plant-level production and quality
      dashboards reconciled to customer shipments.
    relatedQuestionRefs:
      - QO005
      - QO007
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: funding-round-chronology
    missingEvidence: >-
      Primary financing announcements, corporate registry filings, or investor confirmations for the 2021 and 2022 round
      dates, labels, amounts, and instruments.
    whyItMatters: >-
      Conflicting round labels and dates prevent a reliable funding history and could obscure dilution, ownership, or
      debt-versus-equity distinctions.
    diligencePath: >-
      Reconcile the cap table and financing documents directly with the company and named investors, including the
      reported December 2025 climate loan.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-governance
    missingEvidence: >-
      Current executive and board roster, legal name/identity confirmation, share register, governance documents, and
      minority-investor protections.
    whyItMatters: >-
      Profile-level titles do not establish current control, key-person dependence, board oversight, or rights after
      later financing and credit events.
    diligencePath: >-
      Obtain current registry extracts, shareholder and board records, role-confirmed executive biographies, and
      investor-rights documents.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: adverse-company-evidence
    missingEvidence: >-
      Independent adverse reporting or primary records on litigation, regulatory enforcement, product safety incidents,
      layoffs, or material operating failures.
    whyItMatters: >-
      The assigned pool contains no company-specific adverse source, so absence of such evidence here cannot establish
      absence of adverse events.
    diligencePath: >-
      Run a documented legal, regulatory, safety, and adverse-media search and obtain company incident and warranty
      records.
    relatedQuestionRefs:
      - QO007
  - type: private-evidence-only
    severity: material
    topic: commercial-and-customer-validation
    missingEvidence: >-
      Revenue-ranked customer list, signed production agreements, repeat-order history, warranty exposure, and eVTOL
      program status.
    whyItMatters: >-
      The reported partnerships, alliances, and product applications may reflect cooperation or announced deployment
      rather than durable revenue.
    diligencePath: >-
      Request redacted contracts, shipment and invoice data, customer references, repeat-order cohorts, and EHang
      program certification milestones.
    relatedQuestionRefs:
      - QO007
      - QO008
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: blocking
    topic: buyer-validation
    missingEvidence: >-
      Juwan's named OEM and fleet customers, awarded programs, platform qualification status, repeat orders, contract
      terms, and budget owners.
    whyItMatters: >-
      Global deployment cannot be translated into Juwan serviceable demand without proving which buyer programs accept
      its product and who funds them.
    diligencePath: >-
      Obtain a revenue-ranked customer and program schedule with signed purchase orders, qualification milestones,
      platform volumes, contract duration, pricing, and customer references.
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: blocking
    topic: company-specific-market-sizing
    missingEvidence: >-
      Product-level eligible vehicle platforms, geography, battery capacity per vehicle, obtainable share, realized
      price, and a reconciled Juwan SAM/SOM.
    whyItMatters: >-
      Global TWh deployment and country market shares have different units and do not establish addressable company
      revenue or growth.
    diligencePath: >-
      Build a bottom-up platform model from validated target OEM programs, vehicle production schedules, pack
      specifications, supply awards, and Juwan pricing; reconcile it to independent segment data.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: charging-performance-and-economics
    missingEvidence: >-
      Independent, like-for-like validation of Juwan charging time, safety, degradation, cycle life, yield, warranty,
      system cost, and charger/grid requirements.
    whyItMatters: >-
      Competitor-attributed charging claims do not demonstrate that Juwan can meet the same performance at production
      scale or that the full charging ecosystem is economically ready.
    diligencePath: >-
      Commission or obtain customer-witnessed third-party tests with defined state-of-charge windows, ambient
      conditions, pack size, charger power, cycle count, and warranty assumptions.
    relatedQuestionRefs:
      - QM006
      - QM007
