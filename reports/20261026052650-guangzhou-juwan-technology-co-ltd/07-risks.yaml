  evidenceGaps:
    - type: missing-source
      severity: material
      topic: company-litigation-status
      missingEvidence: A current, authoritative Juwan litigation, regulatory-enforcement, IP ownership, and employee-invention schedule.
      whyItMatters: The available court examples concern other parties and cannot establish Juwan's legal exposure or freedom to operate.
      diligencePath: Obtain a counsel-certified disputes and IP schedule, then verify material cases and patent assignments against the relevant court and patent-office records.
      relatedQuestionRefs: [QR002]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: battery-validation
      missingEvidence: Product-specific safety, degradation, cycle-life, yield, recall, and field-incident data with test protocols and production denominators.
      whyItMatters: Sector commentary and competitor claims do not measure Juwan's own failure rates, product maturity, or mitigation effectiveness.
      diligencePath: Request independently witnessed test reports, lot-level yield and warranty data, and a complete incident/recall log for deployed products.
      relatedQuestionRefs: [QR004, QR008]
      relatedTableRefs: [TR002]
    - type: stale
      severity: material
      topic: current-financial-and-channel-exposure
      missingEvidence: Current valuation, cash runway, capital needs, station rollout completion/economics, customer revenue concentration, and active partner commitments.
      whyItMatters: The available RMB valuation and infrastructure plans date to 2022 and do not establish present liabilities, recurring revenue, or dependency mitigation.
      diligencePath: Reconcile audited financials, cap table, current cash forecast, station-level utilization, customer sales by account, and signed partner contracts.
      relatedQuestionRefs: [QR006, QR007]
      relatedTableRefs: [TR003]
    - type: private-evidence-only
      severity: material
      topic: company-supply-chain-and-mitigation
      missingEvidence: Juwan's critical-component supplier map, contracted or indexed input prices, inventory cover, qualified alternatives, and supply-chain cybersecurity and continuity controls.
      whyItMatters: IEA and Marsh describe sector-wide concentration and disruption pathways but do not establish Juwan's actual sourcing or mitigation maturity.
      diligencePath: Obtain the bill of materials and supplier list by critical component, verify alternate-source qualification and inventory cover, and review continuity, cyber-control, and price-pass-through evidence.
      relatedQuestionRefs: [QR003, QR010]
      relatedTableRefs: [TR002]
