  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: customer-retention
      missingEvidence: Customer-level repeat orders, renewals, contract terms, active deployments, and cohort retention for Juwan battery programs.
      whyItMatters: A delivery announcement cannot establish recurring demand, customer durability, or the conversion of pilots and launches into production supply.
      diligencePath: Obtain a revenue-ranked customer schedule with contract status, order and delivery history, renewal dates, and customer references; reconcile it to audited revenue.
      relatedQuestionRefs: [QU004, QU010]
    - type: missing-source
      severity: material
      topic: customer-concentration-and-adverse-feedback
      missingEvidence: Vehicle and order volumes, independent customer confirmations, customer-level revenue concentration, and documented complaints, failed deployments, or service outcomes.
      whyItMatters: Without buyer-level verification, the report cannot assess concentration, channel dependence, field durability, or adverse customer experience.
      diligencePath: Request a top-customer concentration schedule and permission to interview fleet operators and vehicle partners about production status, uptime, warranty claims, and repeat orders.
      relatedQuestionRefs: [QU002, QU005, QU009]
      relatedTableRefs: [TU003]
