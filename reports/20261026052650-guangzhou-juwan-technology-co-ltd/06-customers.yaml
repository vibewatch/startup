  - id: TU002
    title: Adoption metrics and evidence quality
    columns: [Metric or signal, Reported value and period, Source and attribution, Interpretation and missing denominator]
    rows:
      - ["Juwan-battery truck delivery", "Delivery ceremony on 2025-02-18; vehicle count not stated", "PRCWT release (CU001, CU002)", "Named event, not a disclosed order book, confirmed fleet size, or revenue."]
      - ["Charging window", "10%-80% in 15 minutes; release does not provide independent test protocol", "Company-oriented PRCWT release (CU003)", "Product claim; independent field validation and vehicle/battery configuration are not supplied."]
      - ["Operating-efficiency proposition", "15 minutes charging and four hours operation; release also claims efficiency benefits", "Company-oriented PRCWT release (CU004)", "No named fleet, baseline, measurement period, or independently verified outcome."]
      - ["Electric truck battery demand", "More than doubled in 2025; about 8% of global EV battery deployment", "IEA (CU007, CU008)", "Industry-wide metric; it is not Juwan revenue, shipments, or share."]
      - ["Commercial-truck scale-up constraints", "Xinhua reported the sector remained between pilot demonstrations and large-scale commercialization on 2026-06-17", "Xinhua reporting on the broader intelligent heavy-truck sector (CU016)", "Road-access, regulatory-coordination, perception, and liability issues are not Juwan-specific and do not quantify their effect on Juwan orders."]
      - ["Aion V launch orders", "GAC claimed over 10,000 orders in less than two hours after launch", "Carsifu report (CU009)", "Different automaker and product; no Juwan battery linkage."]
    notes: >-
      Values retain each source's metric, period, and attribution. Company and
      automaker claims are not independently verified; unavailable customer
      counts and denominators are not estimated.
    claimRefs: [CU001, CU002, CU003, CU004, CU007, CU008, CU009, CU016]
  - id: TU003
    title: Named customer proof table
    columns: [Named organization, Reported role or evidence, Status supported by source, Diligence limitation]
    enumerationScope:
      coverage: partial
      basis: Named parties are limited to one company-oriented delivery release and do not represent a complete customer list.
    rows:
      - ["Chongzuo Urban Construction", "Co-sponsored the 2025 delivery ceremony and was described as contributing operating and resource-integration capabilities (CU002).", "Named participant in a company-oriented release.", "Contracting buyer, payment, vehicle count, and repeat orders are not disclosed."]
      - ["Shaanxi Western Zhilian", "Named among the parties to the delivery and described as having commercial-vehicle application scenarios (CU002).", "Named industry partner in the release.", "The source does not establish the precise customer, distributor, or payer role."]
      - ["Shaanxi Heavy Duty Truck", "A commercial-vehicle party at the ceremony for trucks described as equipped with Juwan batteries (CU001, CU002).", "Named vehicle-industry participant; delivery described by the release.", "No independent customer confirmation, serial volume, contract value, or recurring supply data."]
    notes: >-
      Illustrative named-party evidence from one company-oriented release, not a
      complete customer enumeration. Event participation alone does not prove
      that each organization purchased batteries directly from Juwan. Xinhua
      corroborates only the wider commercial-truck operating context, not the
      identities or customer roles of these named parties.
    claimRefs: [CU001, CU002, CU005, CU006, CU016]
