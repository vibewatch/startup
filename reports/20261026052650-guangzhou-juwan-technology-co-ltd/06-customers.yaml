company:
  name: Guangzhou Juwan Technology Co., Ltd.
chapter:
  number: 6
  title: Customers
  summary: Public evidence identifies a Juwan-battery heavy-truck delivery ceremony involving named commercial-vehicle partners, but the source is a company-oriented release and does not establish order size, repeat purchases, or customer economics. Independent market evidence supports commercial trucks as a growing battery-use segment, not Juwan-specific adoption.
sections:
  - id: customer-segments
    title: Segments and buying context
    body: >-
      The available evidence points to commercial-vehicle fleets as the clearest
      Juwan-linked customer surface: a February 2025 release describes heavy
      trucks equipped with Juwan batteries delivered at a ceremony involving
      Chongzuo Urban Construction, Shaanxi Western Zhilian, and other industry
      parties (CU001, CU002). It does not identify a purchasing entity, units
      delivered, contract terms, or revenue. Independently, the IEA reports
      electric trucks were a growing share of 2025 battery deployment, while
      Xinhua describes commercial heavy-truck use across logistics, ports, and
      mines (CU005, CU006, CU007). These sources establish relevant market
      settings, not Juwan deployments. Passenger EVs and emerging mobility are
      adjacent demand contexts only; the pool contains no evidence tying those
      named programs to Juwan (CU009, CU013). Xinhua also describes road-access,
      regulatory, perception, and liability barriers to scaling intelligent
      heavy trucks; this is a segment-level caveat, not a finding about Juwan
      (CU016).
    claimRefs: [CU001, CU002, CU005, CU006, CU007, CU009, CU013, CU016]
    tableRefs: [TU001]
  - id: adoption-proof
    title: Adoption signals and proof quality
    body: >-
      The strongest company-specific adoption signal is the reported delivery
      ceremony for Juwan-battery-equipped commercial trucks in Chongzuo; the
      announcement calls this a multi-party commercial-vehicle collaboration,
      but remains a single company-oriented account rather than independent
      customer confirmation (CU001, CU002). The same release attributes fast
      charging and operating-efficiency figures to the delivered system,
      including a 10%-to-80% charge in 15 minutes and a claimed 15-minute
      charge-to-four-hour-operation pattern (CU003, CU004). These are reported
      product propositions, not audited fleet outcomes. IEA and Roland Berger
      describe broad EV and battery adoption trends, while separate coverage
      reports GAC's claim of more than 10,000 Aion V orders after launch; none
      verifies a Juwan supply relationship (CU007, CU008, CU009, CU010).
      Accordingly, logos, adjacent-market demand, and supplier claims should
      not be treated as Juwan customer count or production-scale proof.
    claimRefs: [CU001, CU002, CU003, CU004, CU007, CU008, CU009, CU010]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: durability-and-concentration
    title: Durability, expansion, and concentration remain unproven
    body: >-
      No source in this assigned pool reports Juwan customer-level repeat orders,
      renewal or retention rates, active fleet utilization, warranty experience,
      or a revenue-ranked customer mix. The delivery release names several
      parties and describes planned future commercial-vehicle models, but does
      not disclose their respective buyer, payer, or channel roles, nor whether
      the reported delivery converted into recurring supply (CU002, CU014).
      Broader evidence shows that battery makers pursue automaker and
      infrastructure partnerships, but CATL's reported network and SVOLT's
      exhibition discussions belong to competitors and are not benchmarks for
      Juwan's conversion or expansion (CU011, CU012). The customer thesis
      therefore depends on private diligence: identify the contracting buyer,
      confirm serial-production status and deliveries, and reconcile repeat
      orders and customer concentration to audited revenue. Retention and
      adverse customer experience remain open questions, not evidence of either
      success or failure (CU015).
    claimRefs: [CU002, CU011, CU012, CU014, CU015]
    tableRefs: [TU003]
