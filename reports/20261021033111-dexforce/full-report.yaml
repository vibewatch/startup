  - id: FP001
    title: Evidence-constrained competitive positioning
    type: quadrant
    summary: >-
      Analyst-created ordinal positions compare software/simulation integration with public deployment breadth; they are
      not measured performance scores.
    data:
      xAxis:
        label: Software and simulation integration
        min: 1
        max: 5
        low: Hardware or workflow specialization
        high: Integrated simulation-to-robot stack
        description: Ordinal analyst assessment from retained product descriptions
        scale: ordinal
      yAxis:
        label: Public deployment breadth
        min: 1
        max: 5
        low: Prototype or limited public evidence
        high: Broad established deployment signal
        description: Ordinal analyst assessment, not installed-base measurement
        scale: ordinal
      points:
        - label: DexForce
          x: 5
          'y': 3
          detail: Integrated simulation, world-model, and humanoid stack; deployment outcomes remain thin.
        - label: Geekplus
          x: 2
          'y': 5
          detail: Public warehouse-automation specialist with the largest funding signal in Tracxn's set.
        - label: Hai Robotics
          x: 2
          'y': 4
          detail: Later-stage warehouse-automation specialist with narrower public scope.
        - label: Robust
          x: 2
          'y': 2
          detail: Earlier-stage AMR and workflow-software vendor.
        - label: Yaskawa
          x: 1
          'y': 5
          detail: Established industrial robot and controls incumbent; retained source lacks embodied-AI comparison.
        - label: Rainbow Robotics
          x: 3
          'y': 2
          detail: Humanoid, collaborative, and mobile platform company; current deployment scale is unavailable.
    approximationNotes: >-
