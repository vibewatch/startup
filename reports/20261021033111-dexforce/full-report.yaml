  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              DexForce's relevant market is narrower than all industrial robotics and broader than humanoid hardware
              alone. Its official product description combines simulation, world models, data tooling, sensing, and a W1
              Pro platform, while independent descriptions emphasize software that creates virtual workplaces and
              transfers learned tasks to physical robots. That supports an addressable boundary covering embodied-AI
              training software, models and data infrastructure, humanoid platforms, and implementation work sold into
              industrial and commercial settings. It excludes unrelated fixed automation and general-purpose robotics
              spend unless DexForce's stack participates in the workflow. Conventional industrial robots, autonomous
              mobile robots, manual data collection, customer-built simulation, and internal integration teams remain
              status-quo substitutes. This boundary matters because a broad robotics TAM would include spend DexForce
              cannot presently serve or capture.
            claimRefs:
              - CM001
              - CM002
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM009
              - CM010
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The best retained sizing evidence is a Morgan Stanley forecast reported by CNBC: China's humanoid market
              reaches $2 billion in 2026 and $15 billion in 2030, with external shipments rising from 50,000 to 446,000.
              The denominator explicitly excludes prototypes, pre-order trials, and internal use, which makes it more
              useful than an undifferentiated production figure but still broader than DexForce's obtainable market. The
              implied four-year growth rates are approximately 65.5% for value and 72.8% for units; they are
              calculations from forecast endpoints, not publisher-stated CAGRs. Confidence is reduced by a later
              secondary article that attributes a 28,000-unit 2026 forecast to Morgan Stanley, preserving a material
              conflict rather than selecting the higher number. No retained source isolates spend by buyer, application,
              or vendor share well enough to establish DexForce SAM or SOM.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM015
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM010
              - CM011
              - CM015
      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Near-term demand appears enterprise-led. Industrial manufacturers and logistics operators can buy
              simulation, integration, or hardware through automation and engineering budgets; robotics engineers and
              plant automation teams are the users, while operations or capital committees are likely payers. Commercial
              venues form a second segment for customer service tasks, and research laboratories can use a
              ROS-compatible platform for development. A third-party product listing displays a $78,000 W1 Pro price,
              but the listing does not establish realized transaction prices, discounts, support, or integration cost.
              Adoption should therefore be evaluated as a staged path from simulated task design to physical pilot,
              reliability validation, workflow integration, and scaled deployment. DexForce's claim of more than 50
              active deployments provides an early footprint signal, not a revenue-weighted market-share measure.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM012
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM008
              - CM009
              - CM010
              - CM012
              - CM013
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Adoption is supported by policy, supply-chain investment, and the economic appeal of reducing repetitive
              real-world data collection. CNBC reports Chinese policy support through local subsidies and favorable
              lending, while DexForce says simulation can be faster and cheaper than generating precise examples through
              repeated human demonstrations. The central constraint is commercial verification: useful work in
              factories, offices, and homes requires reliable perception, navigation, and adaptation, and the
              simulation-to-reality gap remains unresolved in the retained evidence. Geopolitical tension and local
              compliance requirements add friction to overseas expansion. For valuation, rapid category growth can
              support strategic optionality, but it cannot replace evidence of deployment durability, buyer budgets,
              utilization, unit economics, or a defensible share of the externally sold market.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Market growth is not DexForce SAM
            body: >-
              The $15 billion 2030 forecast covers China's external humanoid sales, not DexForce's reachable software,
              hardware, or service revenue.
            calloutType: insight
            claimRefs:
              - CM003
              - CM005
              - CM016
          - type: callout
            title: Forecast conflict is material
            body: >-
              Retained sources attribute both 50,000 and about 28,000 China shipments in 2026 to Morgan Stanley; the gap
              is too large to hide as rounding.
            calloutType: risk
            claimRefs:
              - CM004
              - CM007
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape spans software, robots, and incumbent automation
        blocks:
          - type: paragraph
            body: >-
              The relevant market is broader than humanoid-robot startups. Tracxn places DexForce in a 702-company
              active field and compares it with warehouse and mobile-robot specialists such as Geekplus, Robust, and Hai
              Robotics, the industrial incumbent Yaskawa, and the humanoid-platform company Rainbow Robotics. Caixin's
              sector framing adds a more direct strategic split: hardware-first mobility vendors compete on bodies and
              locomotion, while software-centric vendors compete on manipulation, perception, cognition, and training
              data. Status-quo alternatives include fixed industrial automation, task-specific warehouse robots, and
              customers building or integrating their own perception and control stack. This breadth means DexForce must
              win both against newer embodied-AI architectures and against established systems that may offer narrower
              capability but lower deployment risk.
            claimRefs:
              - CP005
              - CP006
              - CP008
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP005
              - CP006
              - CP010
              - CP011
              - CP016
      - number: '3.2'
        title: Simulation-first integration is distinctive, not yet independently superior
        blocks:
          - type: paragraph
            body: >-
              DexForce's clearest differentiation is vertical integration from simulated workplaces and world models
              through transfer to physical machines and an owned W1 Pro platform. Reuters describes a workflow in which
              the company creates digital versions of tasks, trains robots in simulation, and moves the learned behavior
              to hardware; an industry directory lists a wheeled W1 Pro with 34 degrees of freedom and an eight-hour
              stated runtime. Yet hybrid simulated and real-world data is common across Chinese robot makers, and
              high-quality training data remains a shared bottleneck. Public maturity signals also conflict: Reuters
              reports manufacturing-software users and service deployments, while RobotHub still labels the company
              "Prototype." The positioning map therefore uses explicit analyst-created ordinal scores, not benchmark
              results, and should be read as a diligence hypothesis rather than proof of leadership.
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP007
              - CP009
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP007
              - CP009
              - CP015
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP005
              - CP006
              - CP016
      - number: '3.3'
        title: Public packaging signals exist, but contract economics remain opaque
        blocks:
          - type: paragraph
            body: >-
              The only retained public hardware price is Humanoid.Guide's USD 78,000 listing for W1 Pro; it is not an
              official quote, a realized transaction price, or evidence of gross margin. EmbodiedGlobal reports a
              separate "Physical Token" concept in which a customer buys the robot and then pays per physical action,
              but no token rate, minimum commitment, service-level term, discount schedule, or renewal condition is
              disclosed. Distribution evidence is likewise directional: Reuters names manufacturers using DexForce
              software and reports public-facing service operations in more than 15 Chinese cities, without defining
              contract scope or measured outcomes. These omissions prevent a reliable comparison of total cost of
              ownership with warehouse automation, industrial integrators, or internal build, and they leave switching
              cost, multi-homing, and channel power unproven.
            claimRefs:
              - CP002
              - CP003
              - CP013
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP013
      - number: '3.4'
        title: Capital and product breadth buy time, while commoditization risk remains
        blocks:
          - type: paragraph
            body: >-
              DexForce has meaningful resources: Reuters reported a RMB 1 billion Series B, while Tracxn reports USD 161
              million raised across four rounds. Gasgoo says the new capital is intended for world-model algorithms, the
              physics engine, data infrastructure, humanoid capability, and deployment. Those investments can deepen an
              integrated software-to-hardware loop, but they do not establish a durable moat when more than 150 Chinese
              humanoid companies are reported to be active and direct peers are also pursuing world models, synthetic
              simulation, real-world data centers, and owned robots. The decisive evidence would be independently
              measured task success, adaptation time, uptime, intervention rate, deployment cost, and customer retention
              against named alternatives. None appears in the retained pool, so scale claims and strategic direction
              should not be converted into a superior-performance conclusion.
            claimRefs:
              - CP008
              - CP010
              - CP011
              - CP012
              - CP014
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiation is architectural
            body: >-
              DexForce exposes a coherent simulation-to-deployment thesis and combines software with an owned robot,
              creating more integration surface than a single-purpose hardware vendor.
            calloutType: strength
            claimRefs:
              - CP001
              - CP004
              - CP012
          - type: callout
            title: The decisive proof is still private
            body: >-
              Public materials do not compare paid task success, uptime, intervention, adaptation time, or total cost
              against a named alternative, so the apparent technical differentiation cannot yet be translated into
              durable pricing power or lock-in.
            calloutType: risk
            claimRefs:
              - CP007
              - CP009
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue architecture is broader than a robot sale
        blocks:
          - type: paragraph
            body: >-
              Public commercial descriptions point to several monetizable layers: industrial 3D vision hardware and
              guided cells, DexVerse-related software and simulation capabilities, and W1 Pro humanoid deployments. A
              separate report attributes to management a proposed Physical Token model under which a customer buys the
              robot body and then pays for physical actions. That structure could blend upfront system revenue,
              integration work, recurring software, and usage revenue, but public evidence does not quantify the mix or
              establish that action-based billing is broadly deployed. The distinction matters because hardware, project
              integration, software licensing, and usage fees carry different recognition, working-capital, support, and
              margin profiles.
            claimRefs:
              - CI001
              - CI002
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI009
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI010
              - CI016
      - number: '4.2'
        title: Headline traction is visible; revenue quality is not
        blocks:
          - type: paragraph
            body: >-
              Pricing evidence is not internally consistent enough to underwrite realized economics. Humanoid.Guide
              displays USD 78,000 for W1 Pro, while reseller descriptions state that price depends on configuration and
              deployment scope and requires a quotation. On traction, two outlets report RMB 100 million of H1 2026
              revenue; Gasgoo says the company was on track to exceed RMB 300 million for the full year, while
              EmbodiedGlobal reports management guidance of three to four times 2025 revenue. Those are useful scale
              markers, not audited revenue, ARR, cash collection, or gross profit. Several hundred H1 2026 humanoid
              shipments provide an additional activity proxy but lack disclosed unit price, acceptance status, returns,
              or mix.
            claimRefs:
              - CI003
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI003
              - CI004
      - number: '4.3'
        title: Simulation may lower training cost, but the margin bridge is missing
        blocks:
          - type: paragraph
            body: >-
              Reuters reports that DexForce uses synthetic data to cut training costs and improve efficiency, and that
              management considers the process faster and cheaper than repeated human demonstrations. This is a
              plausible cost advantage, but it is not a disclosed unit economic. The roughly 500-person organization,
              continued world-model and physics-engine investment, data infrastructure, robot hardware, integration, and
              field support all imply a material cost base. No reviewed source supplies gross margin, bill of materials,
              deployment labor, warranty burden, customer acquisition cost, payback, sales cycle, channel take rate, or
              working-capital metrics. Independent coverage also flags the reality gap and high production costs as
              unresolved sector constraints.
            claimRefs:
              - CI010
              - CI011
              - CI015
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI014
              - CI015
      - number: '4.4'
        title: Fresh capital extends options, not proven runway
        blocks:
          - type: paragraph
            body: >-
              Multiple current sources report a RMB 1 billion Series B at a valuation above RMB 10 billion. Reported
              uses include world-model iteration, physics-engine upgrades, data infrastructure, humanoid capability, and
              real-world deployment. Those uses are growth investments rather than evidence of current liquidity.
              Funding raised is not cash available: the reviewed evidence does not disclose cash on hand, monthly burn,
              runway, debt, project-finance obligations, receivables, inventory, or a next-round trigger. The financial
              verdict is therefore conditional. Public traction justifies deeper diligence, but revenue quality, margin
              path, sales efficiency, and capital adequacy remain ununderwritable until management provides audited
              statements and operating cohorts.
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital raised is not runway
            body: >-
              The RMB 1 billion Series B funds an ambitious model, infrastructure, product, and deployment program, but
              no public cash balance, burn rate, debt schedule, or runway supports a capital adequacy conclusion.
            calloutType: risk
            claimRefs:
              - CI012
              - CI013
              - CI014
          - type: callout
            title: Gate underwriting on an audited operating pack
            body: >-
              Require audited 2025 and H1 2026 statements, monthly revenue and cash collections, product gross-margin
              bridges, customer cohorts, and a fully diluted cash and debt schedule before treating reported growth as
              durable financial traction.
            calloutType: recommendation
            claimRefs:
              - CI004
              - CI014
              - CI015
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What the product delivers
        blocks:
          - type: paragraph
            body: >-
              DexForce is presented as both a robotics-software platform and an integrated automation supplier rather
              than a single humanoid SKU. The core customer workflow begins with a digital representation of a workplace
              or task, generates varied synthetic training data in simulation, trains and evaluates robot-learning
              models, and transfers the learned behavior to physical systems. Public descriptions extend that workflow
              into 3D perception, robot control, industrial cells, and the W1 Pro wheeled humanoid. This breadth can
              reduce task-specific programming and data collection, but buyers still need to distinguish reusable
              platform capability from engineering services and one-off integration work.
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE005
              - CE007
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE007
              - CE012
      - number: '5.2'
        title: Architecture and developer surface
        blocks:
          - type: paragraph
            body: >-
              The disclosed architecture is coherent at a conceptual level: simulated environments and generated data
              feed learning workflows, models are evaluated for transfer, runtime perception and control connect to the
              robot, and the physical deployment returns evidence from real tasks. EmbodiChain adds a concrete developer
              surface with GPU simulation, automated data pipelines, standardized robot-learning interfaces, training
              and evaluation workflows, and modular extension points. However, the repository labels itself alpha and
              under active development. Public descriptions of dual-PC control and real-time joint control add
              implementation texture, but do not establish production topology, deterministic latency, cybersecurity
              boundaries, or deployment observability.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE006
              - CE015
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE009
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE015
      - number: '5.3'
        title: Maturity, deployment, and roadmap
        blocks:
          - type: paragraph
            body: >-
              Maturity varies sharply by surface. EqualOcean reported commercial deployments of the integrated product
              matrix in semiconductor, automotive, and photovoltaic settings, while Technology.org reported software use
              by named manufacturers and robot service activity in more than 15 Chinese cities. Humanoid.Guide lists W1
              Pro as business-ready and provides detailed specifications, but those values remain a directory assessment
              rather than audited acceptance data. EmbodiChain is explicitly alpha, and W1 Pro was observed by Reuters
              in a headquarters test setting. The evidence therefore supports real product activity, but not a uniform
              conclusion that every module is repeatable, production-hardened, or supported at scale.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE008
              - CE014
      - number: '5.4'
        title: Differentiation, trust, and technical risk
        blocks:
          - type: paragraph
            body: >-
              DexForce's plausible differentiation is vertical integration across synthetic-data generation, simulation,
              perception, learning, controls, and physical deployment. That integration could shorten iteration cycles,
              but public evidence does not quantify the reality gap, deployment labor, uptime, failure rates, or cost
              savings against conventional automation. The risk is material: a Morgan Stanley analysis summarized by
              China Biz Insider highlighted limited working capability, integration complexity, dexterity, thermal
              management, reliability, safety, component inconsistency, and uncertain Sim2Real effectiveness across the
              humanoid sector. The retrieved official surfaces also did not provide usable trust-center, certification,
              privacy, security, incident, or service-level evidence, so diligence should treat those controls as
              unverified rather than absent.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Production proof is the gating technical question
            body: >-
              Public materials establish a credible simulation-to-robot product thesis, but they do not establish
              certified safety, sustained uptime, field-failure rates, security controls, or the labor and cost required
              to deploy each new task.
            calloutType: risk
            claimRefs:
              - CE009
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Two customer motions, with different buyers and proof standards
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to two customer motions rather than one homogeneous base. The industrial motion
              sells simulation-trained models and integration capability to manufacturers and automation teams;
              secondary coverage names Toyota, Samsung, Panasonic, Foxconn, Midea, CRRC, and Wuling, while company
              materials claim deployment across more than 30 industries. The service motion places W1 Pro robots into
              malls, tourist sites, parks, and retail counters, where venue operators or integrators are the likely
              economic buyers and visitors are end users. RBTX also exposes a partner-led procurement route. These
              surfaces demonstrate addressable use cases, but they do not disclose payer identity, contract structure,
              or segment revenue, so strategic value cannot yet be translated into customer economics.
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU011
              - CU012
              - CU015
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU005
              - CU006
              - CU011
              - CU012
              - CU015
      - number: '6.2'
        title: Adoption indicators are broad, recent, and mostly unaudited
        blocks:
          - type: paragraph
            body: >-
              DexForce's own current social feed reports more than 2,000 embodied-intelligence products shipped across
              more than 50 applications. It also describes a National Day deployment of more than 30 service stations
              that drew more than 110,000 visits, averaged more than 500 orders per robot per day, and contributed to
              more than 25,000 cumulative uninterrupted operating hours. Separate trade coverage reports several hundred
              humanoid units shipped in the first half of 2026 and more than 1,000 deployments across over 50
              sub-sectors. These measures indicate activity and replication, not a coherent customer cohort: products,
              units, projects, stations, visits, orders, and operating hours have different denominators and cannot be
              combined into a conversion rate or recurring-revenue estimate.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU007
              - CU008
              - CU009
      - number: '6.3'
        title: Named manufacturers improve credibility, but production depth is unverified
        blocks:
          - type: paragraph
            body: >-
              Technology.org reports that Toyota, Samsung, Panasonic, and Foxconn use DexForce software, while Embodied
              Global reports model deployments at Midea, CRRC, and Wuling for bin picking, assembly, and insertion. This
              is stronger than an unexplained logo wall because the sources identify either a use category or deployment
              relationship. It remains weaker than customer-primary evidence: retained materials do not state which
              plants are live, whether deployments are pilots or production, how many robots or lines are involved, what
              outcomes were achieved, or whether contracts renewed. The named-account table is therefore a sourced
              sample rather than an exhaustive roster, and each row carries the same diligence limitation rather than
              implying independently verified durability.
            claimRefs:
              - CU005
              - CU006
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU006
      - number: '6.4'
        title: Replication is visible; retention and concentration are not
        blocks:
          - type: paragraph
            body: >-
              The evidence suggests a two-track expansion loop: manufacturing deployments can extend from one task to
              adjacent automation tasks, while service robots can move from a single venue to replicated stations and
              cities. Marketplace availability and a quoted three-week delivery time indicate a procurement surface, but
              neither proves implementation speed or repeat demand. The broader Chinese market is moving from trials
              toward orders, yet Reuters emphasizes that reliable useful work remains the commercial test, and China's
              new lifecycle standards add an operating and safety compliance layer. No retained source reports NRR, GRR,
              churn, renewal, contract length, segment revenue, top-customer share, or channel concentration. Those
              omissions prevent a durability or concentration judgment despite visible deployment breadth.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Deployment breadth is not retention proof
            body: >-
              Products, projects, stations, visits, and operating hours show activity, but none discloses renewal,
              churn, expansion revenue, or top-customer exposure; customer durability remains a material diligence gap.
            calloutType: risk
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU007
              - CU008
              - CU009
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk view
        blocks:
          - type: paragraph
            body: >-
              The leading thesis risk is execution across the simulation-to-reality boundary. Reuters frames reliable
              useful work, rather than athletic demonstrations, as the harder commercial test for humanoids, while
              Technology.org says investors still need proof that software-trained robots perform on factory floors.
              That combination supports a high residual rating for operational reliability even though it does not
              establish that DexForce has suffered a field failure. Capital intensity ranks next: reported proceeds are
              earmarked simultaneously for world-model algorithms, the physics engine, data infrastructure, robot
              capability, and deployments. Legal and regulatory exposure is also material, but the assigned evidence
              cannot establish licenses, certifications, litigation, enforcement, or incident history; those items
              therefore remain diligence conditions rather than alleged violations.
            claimRefs:
              - CR001
              - CR004
              - CR009
              - CR013
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR004
              - CR006
              - CR007
              - CR009
              - CR010
              - CR011
              - CR015
      - number: '7.2'
        title: Regulatory, safety, and legal exposure
        blocks:
          - type: paragraph
            body: >-
              The evidence set is insufficient to clear regulatory and safety risk. Humanoid.Guide labels the W1 Pro
              safe with humans but provides no certification or test record in the fetched listing and reports ingress
              protection as unavailable. DexForce's fetched media page supplies corporate contact and location
              information, not a compliance, incident, privacy, or certification record. These observations do not prove
              non-compliance or an adverse event; they show that public proof in the assigned pool is inadequate for
              underwriting human-adjacent deployments. Before investment, counsel and technical diligence should obtain
              jurisdiction-by-jurisdiction approvals, safety files, cybersecurity and privacy controls, IP ownership
              schedules, incident logs, and insurance coverage, with material exceptions treated as a closing condition.
            claimRefs:
              - CR005
              - CR006
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR013
      - number: '7.3'
        title: Operational and business-model execution
        blocks:
          - type: paragraph
            body: >-
              DexForce's simulation-first approach may reduce dependence on expensive manual data collection, but it
              concentrates technical risk in transfer quality from virtual scenes to changing physical environments. The
              company says simulation is faster and cheaper; the same evidence also describes high-quality training data
              as an industry bottleneck, so the cost advantage is not yet equivalent to independently measured uptime,
              task success, or lower total cost of ownership. Reported H1 revenue and deployments indicate commercial
              activity, but the available figures do not disclose audited recognition policy, renewals, failure rates,
              warranty costs, or customer concentration. The proposed hardware-purchase plus pay-per-action model adds
              metering, utilization, and service obligations that should be tested through customer contracts and cohort
              economics.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Financing, dependencies, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Funding reduces near-term financing pressure but is not cash available or proof of sustainable margins.
              Tracxn reports $161 million raised across four rounds, while other sources describe a RMB 1 billion Series
              B and continued spending on algorithms, infrastructure, hardware, and deployment. Preliminary Hong Kong
              IPO discussions could widen financing access, but an unlaunched transaction should not be underwritten as
              liquidity. The investment thesis should break if independent pilots fail agreed task-success or safety
              thresholds, if certification blocks target use cases, if gross margin remains negative after warranty and
              field-service costs, or if a small number of customers or capital providers can halt deployment. Monthly
              monitoring should cover qualified pipeline conversion, repeat deployments, uptime, intervention rate, loss
              incidents, cash use, supplier concentration, and IPO readiness.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR007
              - CR008
              - CR009
              - CR012
              - CR014
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Core thesis-break risk
            body: >-
              Simulation economics matter only if independent deployments meet task-success, uptime, safety, and
              intervention thresholds outside controlled demonstrations.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR004
          - type: callout
            title: Closing conditions
            body: >-
              Require customer-level reliability and concentration data, audited cash and margin evidence, certification
              files, incident history, and a component-supply contingency plan before treating reported scale or IPO
              interest as de-risking.
            calloutType: recommendation
            claimRefs:
              - CR005
              - CR007
              - CR010
              - CR012
              - CR013
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The clearest price signal is the June 2026 Series B: Reuters, Gasgoo, and Embodied Global report RMB 1
              billion raised at a valuation above RMB 10 billion. Dollar translations range from about $1.38 billion to
              $1.5 billion, which should be treated as foreign-exchange and rounding variation rather than as separate
              valuation events. Lifetime funding is less settled: Tracxn reports $161 million over four rounds, while
              Multiples records $148 million in one round. That disagreement prevents a reliable reconstruction of
              pre-money value, dilution, or cash available. Entry discipline should therefore anchor to the RMB terms
              and require the financing documents rather than treating database estimates as a cap table.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV010
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV006
              - CV008
              - CV013
              - CV014
      - number: '8.2'
        title: Thesis, anti-thesis, and proof burden
        blocks:
          - type: paragraph
            body: >-
              The investable thesis is that DexForce can turn simulation-led training into a lower-cost path to useful
              industrial automation. Reuters reports use by major manufacturers, and the Series B proceeds are directed
              toward the world model, physics engine, data infrastructure, and real-world deployment. The anti-thesis is
              that named users and product demonstrations do not establish durable contract value, gross margin,
              retention, or field reliability. Independent coverage calls out the simulation-to-real "reality gap,"
              while The Bot Scout notes that even basic W1 Pro commercial and operating specifications remain
              unpublished. The valuation can work only if deployment proof converts into repeatable, economically
              attractive revenue.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV011
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV011
              - CV014
      - number: '8.3'
        title: Scenario framework and comparable evidence
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports scenario logic, not a defensible point estimate. Gasgoo reports RMB 100 million
              of first-half revenue and a company trajectory above RMB 300 million for the year, but there is no audited
              trailing-revenue denominator, gross margin, backlog conversion, or cash-burn disclosure. Multiples lists
              UBTECH at $4.4 billion, $300 million of revenue, and 8.8x revenue, yet DexForce lacks the equivalent
              verified operating base needed for a like-for-like multiple. The bull case requires audited growth and
              repeatable deployments; the base case preserves optionality but demands price protection; the bear case is
              triggered by weak field transfer, revenue slippage, or financing terms that subordinate new money.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV008
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV008
              - CV012
              - CV015
              - CV016
      - number: '8.4'
        title: Recommendation, exit readiness, and final diligence
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more, with medium confidence, high risk, and a stretched valuation stance.
              A potential Hong Kong listing is only a reported consideration, not evidence of timing, regulatory
              readiness, liquidity, or an exit price. Before an investment committee sets a target return, it should
              obtain audited 2025 and 2026 financials, customer-level contract and renewal data, deployment reliability
              cohorts, the full capitalization table, and all preference and governance documents. The call should
              improve only if those materials support a coherent revenue multiple and downside protection; it should
              deteriorate if field performance, booked revenue, or financing seniority fails that test.
            claimRefs:
              - CV006
              - CV008
              - CV012
              - CV013
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV007
              - CV008
              - CV011
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive conclusion
            body: >-
              Do not convert the June round headline into a buy recommendation without audited economics and the actual
              preference stack. A lower price, milestone tranches, or stronger downside rights could change the decision
              before company quality alone does.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV006
              - CV013
              - CV014
              - CV015
