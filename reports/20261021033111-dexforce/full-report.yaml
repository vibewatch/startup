      - CP016
  - id: FI001
    title: Economic conversion path and unresolved gross-profit bridge
    type: flow
    summary: >-
      Public evidence describes the commercial sequence but does not quantify conversion from customer activity to
      recognized revenue and gross profit.
    data:
      nodes:
        - label: Customer scope
          detail: Buyer defines robot, vision-cell, software, and deployment requirements.
        - label: Configuration and quote
          detail: System scope and channel terms shape the upfront commercial package.
        - label: Hardware or software delivery
          detail: Robot bodies, vision systems, cells, or software enter the customer workflow.
        - label: Integration and acceptance
          detail: Deployment labor, acceptance timing, and support obligations are undisclosed.
        - label: Physical activity
          detail: Tasks or physical actions may create a usage-metered revenue opportunity.
        - label: Revenue and gross profit
          detail: Recognition, recurring share, direct cost, and gross margin remain unavailable.
    approximationNotes: Ordered conceptual flow only; no conversion rates, contract allocations, or margin values are publicly supported.
