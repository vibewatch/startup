  - id: FE001
    title: DexForce simulation-to-physical product architecture
    type: stack
    summary: >-
      A source-grounded conceptual stack shows how disclosed simulation, data, learning, transfer, runtime, and physical
      layers connect without asserting an undisclosed production topology.
    data:
      layers:
        - label: Digital workplace or task
          modules:
            - Scene and object representation
            - Task definition
            - Environmental variation
        - label: Simulation foundation
          modules:
            - Physics and sensor simulation
            - Procedural generation
            - High-throughput GPU environments
        - label: Data pipeline
          modules:
            - Synthetic observations
            - Trajectory and joint data
            - Automated processing
        - label: Robot learning
          modules:
            - Imitation learning
            - Reinforcement learning
            - Model training and evaluation
        - label: Sim2Real and runtime
          modules:
            - Transfer and calibration
            - 3D perception
            - Planning and real-time control
        - label: Physical deployment
          modules:
            - Industrial robot cells
            - W1 Pro humanoid
            - Service and research settings
    approximationNotes: >-
      Layer ordering is an analytical synthesis of the disclosed workflow; it does not represent verified internal
      service boundaries or a production network topology.
    claimRefs:
      - CE001
      - CE002
      - CE006
      - CE015
  - id: FU001
    title: Evidence-based customer journey and expansion loop
    type: journey-map
    summary: >-
      Public evidence reaches deployment and replication, but the renewal and account-expansion stage remains
      unverified.
    data:
      items:
        - stage: '1'
          label: Define task
          detail: Manufacturer or venue identifies an automation or service workflow.
          touchpoints:
            - Direct enterprise sale
            - Integrator consultation
        - stage: '2'
          label: Procure platform
          detail: W1 Pro appears through direct and marketplace channels, with a three-week marketplace delivery indication.
          touchpoints:
            - DexForce
            - RBTX marketplace
        - stage: '3'
          label: Integrate and validate
          detail: Models or robots are adapted to tasks such as bin picking, assembly, insertion, or service.
          touchpoints:
            - Simulation workflow
            - Site integration
        - stage: '4'
          label: Operate
          detail: Company-reported station, order, visit, and operating-hour metrics indicate field activity.
          touchpoints:
            - Factory workflow
            - Service station
        - stage: '5'
          label: Replicate
          detail: Reported projects, applications, sub-sectors, stations, and cities indicate breadth across deployments.
          touchpoints:
            - Adjacent task
            - Additional venue
        - stage: '6'
          label: Renew and expand
          detail: Renewal, churn, contract length, account expansion, and concentration remain undisclosed.
          touchpoints:
            - Renewal decision
            - Account expansion
    approximationNotes: The ordered stages are an analytical workflow, not a measured conversion funnel; no conversion rates are inferred.
    claimRefs:
      - CU010
      - CU011
      - CU012
      - CU013
      - CU014
      - CU015
