      - ["Warehouse or AMR specialist", "Unavailable in retained pool", "Unknown", "Narrow warehouse and logistics automation", "Hardware, software, integration, and support prices", "Narrower products may be easier to underwrite"]
      - ["Industrial incumbent or integrator", "Unavailable in retained pool", "Unknown", "Robot, controls, integration, and service", "Installed-base economics, customization, and maintenance", "Distribution and service coverage may offset lower flexibility"]
      - ["Internal build or manual process", "Unavailable in retained pool", "Capex, engineering labor, and operating labor", "Customer-controlled workflow and data", "Full loaded cost, schedule, failure risk, and opportunity cost", "Remains the benchmark when automation ROI is unproven"]
