callouts:
  - calloutType: strength
    title: Differentiation is architectural
    body: >-
      DexForce exposes a coherent simulation-to-deployment thesis and combines
      software with an owned robot, creating more integration surface than a
      single-purpose hardware vendor.
    claimRefs: [CP001, CP004, CP012]
  - calloutType: risk
    title: The decisive proof is still private
    body: >-
      Public materials do not compare paid task success, uptime, intervention,
      adaptation time, or total cost against a named alternative, so the apparent
      technical differentiation cannot yet be translated into durable pricing
      power or lock-in.
    claimRefs: [CP007, CP009, CP016]
