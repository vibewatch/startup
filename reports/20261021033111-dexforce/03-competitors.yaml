      - ["Industrial deployment evidence", "Named manufacturers reportedly use software", "Geekplus, Hai Robotics, and Yaskawa target established industrial workflows", "Existing automation may already meet narrow tasks", "Request site-level scope, paid status, uptime, and productivity deltas"]
