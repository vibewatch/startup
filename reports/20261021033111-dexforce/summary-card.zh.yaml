  topStrengths:
    - 一体化技术栈覆盖仿真、合成数据、模型训练、感知、控制以及自有的人形机器人硬件。
    - 独立报道点名了使用 DexForce 软件的主要制造商，并描述了其在工业和服务场景中的部署。
    - 2026 年 6 月完成的 B 轮融资为深化世界模型、物理基础设施、机器人能力和现实场景部署提供了资金。
