companyProfile:
  summary: >-
    Founded in 2021 and headquartered in Shenzhen, DexForce develops an integrated physical-AI stack spanning simulated
    task environments, synthetic data, model training, perception and control, and transfer to physical robots. Founder
    and CEO Jia Kui is a machine-learning professor at the Chinese University of Hong Kong, Shenzhen. Public evidence
    shows substantial financing, named manufacturing users, and early industrial and commercial deployments, but not
    audited economics, independently benchmarked reliability, or complete governance terms.
