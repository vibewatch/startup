    title: Market scale and adoption reference points
    type: bar
    summary: >-
      Separate panels preserve the distinct units and denominators of value,
      forecast shipments, realized global shipments, and DexForce deployments.
    data:
      series:
        - name: China external humanoid sales value
          unit: USD billions
          points:
            - label: "2026 forecast"
              value: 2
              note: Morgan Stanley estimate reported by CNBC
            - label: "2030 forecast"
              value: 15
              note: Morgan Stanley estimate reported by CNBC
        - name: China external humanoid shipments
          unit: units
          points:
            - label: "2026 forecast"
              value: 50000
              note: Revised Morgan Stanley estimate reported by CNBC
            - label: "2030 forecast"
              value: 446000
              note: Morgan Stanley estimate reported by CNBC
        - name: Worldwide humanoid shipments
          unit: units
          points:
            - label: "2025 reported"
              value: 13000
              note: Approximate Omdia figure reported by CNBC
        - name: DexForce active deployments
          unit: deployments
          points:
            - label: "2026 company claim"
              value: 50
              note: Lower bound because the source says more than 50
        - name: China humanoid shipments, conflicting secondary forecast
          unit: units
          points:
            - label: "2026 forecast"
              value: 28000
              note: Approximate Morgan Stanley figure stated by Technology.org
        - name: W1 Pro third-party listed price
          unit: USD
          points:
            - label: "Current listing"
              value: 78000
              note: Displayed by Humanoid.Guide; not a verified transaction price
    approximationNotes: >-
      Values are shown in independent panels and are not additive or nested.
      The 50-deployment point is plotted at its disclosed lower bound; forecast
      figures retain their original geography and external-sales denominator.
    claimRefs: [CM003, CM004, CM005, CM006, CM007, CM010, CM011, CM015]
callouts:
  - calloutType: insight
    title: Market growth is not DexForce SAM
    body: >-
      The $15 billion 2030 forecast covers China's external humanoid sales, not
      DexForce's reachable software, hardware, or service revenue.
    claimRefs: [CM003, CM005, CM016]
  - calloutType: risk
    title: Forecast conflict is material
    body: >-
      Retained sources attribute both 50,000 and about 28,000 China shipments in
      2026 to Morgan Stanley; the gap is too large to hide as rounding.
    claimRefs: [CM004, CM007]
