  topStrengths:
    - >-
      An integrated stack spans simulation, synthetic data, model training, perception, controls, and owned humanoid
      hardware.
    - >-
      Independent reporting names major manufacturers using DexForce software and describes deployments across
      industrial and service settings.
    - >-
      The June 2026 Series B provides capital to deepen world models, physics infrastructure, robot capabilities, and
      real-world deployment.
  topRisks:
    - Audited revenue, gross margin, cash burn, runway, and product-level unit economics remain undisclosed.
    - >-
      Reliable simulation-to-reality transfer, production uptime, intervention rates, field failures, and safety
      performance lack independent validation.
    - >-
      Customer retention, contract scope, concentration, renewal, and expansion are not established by public deployment
      or logo claims.
    - >-
      The reported valuation above RMB 10 billion lacks a verified operating denominator and complete financing terms
      for defensible return modeling.
    - >-
      Board rights, liquidation preferences, certifications, cybersecurity controls, incident history, and IPO readiness
      remain unresolved.
  unresolvedGaps:
    - >-
      Audited 2025 and 2026 financials, revenue recognition, gross margin, cash balance, monthly burn, runway, debt, and
      working-capital requirements.
    - >-
      Customer-level contracts and cohorts covering paid production status, retention, churn, expansion, concentration,
      contract value, and renewals.
    - >-
      Independent deployment telemetry for uptime, task success, intervention, field failures, safety events, support
      performance, and economic payback.
    - >-
      The fully diluted cap table, financing terms, liquidation preferences, governance rights, board composition, and
      any filed IPO materials.
    - >-
      Product-safety certifications, privacy and cybersecurity controls, quality audits, incident records, insurance
      coverage, and jurisdictional approvals.
