              SKU。核心客户工作流从工作场所或任务的数字表示开始，在仿真中生成多样的合成训练数据，训练和评估机器人学习模型，再把学到的行为迁移到实体系统。公开描述还将这套工作流延伸到 3D
              感知、机器人控制、工业单元和轮式人形机器人 W1 Pro。这种广度可以减少针对单一任务的编程和数据采集，但买方仍需区分可复用的平台能力、工程服务和一次性集成工作。
