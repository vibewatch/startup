              - CO011
              - CO012
              - CO014
      - number: '1.2'
        title: 创始人主导的领导层与治理透明度
        blocks:
          - type: paragraph
            body: >-
              公开领导层证据集中在 Jia Kui 身上。Reuters 将其称为创始人兼
              CEO，并称其为香港中文大学（深圳）的机器学习教授。这一背景与仿真驱动的机器人战略形成清晰的创始人与市场技术匹配。不过，现有合格证据没有识别董事长、董事、CFO、COO
              或其他职能高管。因此尽调视角仍以创始人为中心：产品方向和对外叙事通过 Jia 可见，但继任梯队、财务控制、董事会独立性和保留事项均不可见。这是信息披露缺口，不代表这些职能或控制不存在。
            claimRefs:
              - CO003
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO016
      - number: '1.3'
        title: 融资、估值与利益相关方图谱
        blocks:
          - type: paragraph
            body: >-
              融资记录显示这是一家资金充足的私营公司，但公开数字需要谨慎标注。Tracxn 报告四轮累计融资 $161 million，并将最新一轮日期定为 2026 年 6 月 30 日。Gasgoo 另报 RMB 1
              billion B 轮融资，估值超过 RMB 10 billion；EmbodiedGlobal 将同一轮描述为约 $138 million，Yahoo 转载的 Reuters 报道则给出约 $147
              million。这些美元数字只是同一轮融资金额的换算，不是不同融资。已披露投资人组合混合了风险资本、战略资本和带有国资背景的资本。以上金额均不能证明当前现金可用性、持股比例、清算优先权或董事会控制权。
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
          - type: table
            tableRef: TO003
            claimRefs:
              - CO008
              - CO009
              - CO010
      - number: '1.4'
        title: 规模信号与剩余验证负担
        blocks:
          - type: paragraph
            body: >-
              近期报道给出多个规模信号，但都需要与一手财务和客户记录核对。Reuters 称公司约有 500 名员工。Gasgoo 报告 2026 年上半年收入为 RMB 100 million，全年轨迹超过 RMB 300
              million；EmbodiedGlobal 另报 2025 年收入超过 RMB 100 million，并称公司指引 2026 年增长三到四倍。这些是收入口径，不是
              ARR、烧钱速度或账面现金。EmbodiedGlobal 还报告 2026 年上半年发运数百台人形机器人、在 50 多个子行业完成超过 1,000 次部署；Technology.org
              则报告软件用户和服务部署覆盖 15 个以上城市。反向证据同样明确：独立报道称，投资人仍需验证仿真训练的机器人能否可靠迁移到工厂现场。因此，经审计收入、利润率、续约行为、部署定义和现场可靠性仍是核心尽调要求。
