      - CR015
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 公开证据支持继续尽调，但不足以无条件认可该价格。
    data:
      nodes:
        - id: round-anchor
          label: RMB 1B B 轮
          detail: 据报道估值超过 RMB 10B
        - id: commercial-signal
          label: 工业采用信号
          detail: 已点名的制造商及部署活动
        - id: revenue-signal
          label: 据报道的收入轨迹
          detail: 媒体报道，来源材料未经过审计
        - id: proof-gap
          label: 运营验证缺口
          detail: 利润率、留存、可靠性和合同经济性
        - id: terms-gap
          label: 融资与退出缺口
          detail: 优先权、稀释、治理和 IPO 时间
        - id: decision
          label: 继续研究
          detail: 高风险；估值偏高；尽调对价格敏感
    approximationNotes: 该序列为定性判断，不赋予概率、转化率或隐含价值。
