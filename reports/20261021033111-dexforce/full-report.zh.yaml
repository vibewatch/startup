        title: 图表
        blocks:
          - type: callout
            title: 差异化来自架构
            body: DexForce 展示出连贯的仿真到部署逻辑，并将软件与自有机器人结合，相比单一用途硬件厂商拥有更大的集成面。
            calloutType: strength
            claimRefs:
              - CP001
              - CP004
              - CP012
          - type: callout
            title: 决定性证据仍在私人材料中
            body: 公开材料没有把付费任务成功率、正常运行时间、人工干预、适应时间或总拥有成本与具名替代方案进行比较，因此表面上的技术差异化尚不能转化为持久定价权或锁定效应。
            calloutType: risk
            claimRefs:
