              模式：客户购买机器人本体，再为实体动作付费。这种结构可能混合前置系统收入、集成服务、经常性软件和使用收入，但公开证据没有量化组合，也未证明按动作计费已广泛部署。这个区别很重要，因为硬件、项目集成、软件许可和使用费的收入确认、营运资金、支持和利润率特征不同。
