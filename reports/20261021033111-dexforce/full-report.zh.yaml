              核心投资逻辑风险在于能否跨越仿真到现实的边界。Reuters 将可靠地完成有用工作，而不是展示运动能力，视为人形机器人的更难商业考验；Technology.org
              也称投资人仍需证明软件训练的机器人能在工厂现场工作。这一组合支持对运营可靠性给出较高剩余风险评级，但并不证明 DexForce 曾发生现场故障。资本密集度风险紧随其后：据报道的融资收益同时用于
              世界模型算法、物理引擎、数据基础设施、机器人能力和部署。法律与监管风险同样重大，但现有证据无法证明许可、认证、诉讼、执法或事件历史，因此这些项目仍是尽调条件，而非被指称的违规。
