  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              DexForce 的相关市场小于全部工业机器人市场，但又不止人形机器人硬件。其官方产品描述把仿真、世界模型、数据工具、传感和 W1 Pro
              平台结合起来；独立描述则强调，软件创建虚拟工作场所，并把学到的任务迁移到实体机器人。由此可将可服务边界定义为具身 AI 训练软件、模型与数据基础设施、人形机器人平台，以及面向工业和商业场景销售的实施服务。除非
              DexForce 的技术栈参与工作流，否则应排除无关的固定自动化和通用机器人支出。传统工业机器人、自动移动机器人、人工数据采集、客户自建仿真和内部集成团队，都是现状替代方案。这个边界很重要，因为宽泛的机器人
              TAM 会纳入 DexForce 当前无法服务或获取的支出。
            claimRefs:
              - CM001
              - CM002
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM009
              - CM010
      - number: '2.2'
        title: 受证据约束的市场规模测算
        blocks:
          - type: paragraph
            body: >-
              现有最有用的规模证据是 CNBC 报道的 Morgan Stanley 预测：中国人形机器人市场在 2026 年达到 $2 billion，2030 年达到 $15 billion；对外发运量从 50,000
              增至 446,000。该分母明确排除了原型机、预购试用和内部使用，因此比不加区分的产量数字更有用，但仍宽于 DexForce 可获取的市场。按预测端点计算，四年价值增速约为 65.5%，数量增速约为
              72.8%；这是基于端点的计算，并非发布方给出的 CAGR。另一篇较晚的二手文章将 2026 年 28,000 台预测归因于 Morgan
              Stanley，令置信度下降；我们保留这一重大冲突，而不选择较高数字。现有来源没有按买方、应用或供应商份额拆分支出，无法充分建立 DexForce 的 SAM 或 SOM。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM015
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM010
              - CM011
              - CM015
      - number: '2.3'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              短期需求看起来由企业客户主导。工业制造商和物流运营商可以从自动化或工程预算中购买仿真、集成或硬件；机器人工程师和工厂自动化团队是用户，运营或资本委员会可能是付费方。商业场所构成第二个细分市场，使用机器人完成客服任务；研究实验室则可用兼容
              ROS 的平台进行开发。第三方产品目录显示 W1 Pro 价格为
              $78,000，但这不能证明实际成交价、折扣、支持或集成成本。因此，应把采用路径拆成仿真任务设计、实体试点、可靠性验证、工作流集成和规模化部署几个阶段。DexForce 声称已有 50
              多个活跃部署，这提供了早期覆盖信号，但不是按收入加权的市场份额。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM012
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM008
              - CM009
              - CM010
              - CM012
              - CM013
      - number: '2.4'
        title: 增长驱动、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              政策、供应链投资，以及减少重复现实数据采集的经济吸引力，都在支持采用。CNBC 报道，中国的政策支持来自地方补贴和优惠贷款；DexForce
              则称，靠反复人工示范生成精确样本，速度和成本都不如仿真。核心约束是商业验证：工厂、办公室和家庭中的有用工作都要求可靠的感知、导航和适应能力，而现有证据仍未解决仿真到现实的差距。地缘政治紧张和本地合规要求也会增加海外扩张摩擦。对估值而言，品类快速增长可以提供战略选择权，但不能替代对部署持久性、买方预算、利用率、单位经济性或外部销售市场可防守份额的证据。
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM016
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 市场增长不等于 DexForce 的 SAM
            body: $15 billion 的 2030 年预测覆盖中国对外销售的人形机器人，不是 DexForce 可触达的软件、硬件或服务收入。
            calloutType: insight
            claimRefs:
              - CM003
              - CM005
              - CM016
          - type: callout
            title: 预测冲突重大
            body: 现有来源把 2026 年中国发运量 50,000 台和约 28,000 台都归因于 Morgan Stanley；差距太大，不能用四舍五入解释。
            calloutType: risk
            claimRefs:
              - CM004
              - CM007
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局横跨软件、机器人与既有自动化
        blocks:
          - type: paragraph
            body: >-
              相关市场不止人形机器人初创公司。Tracxn 将 DexForce 放在一个有 702 家活跃公司的领域中，并将其与 Geekplus、Robust、Hai Robotics 等仓储和移动机器人专家、工业老牌厂商
              Yaskawa，以及人形机器人平台公司 Rainbow Robotics 比较。Caixin
              的行业框架给出更直接的战略划分：硬件优先的移动厂商在机身和运动能力上竞争，软件中心型厂商则在操作、感知、认知和训练数据上竞争。固定工业自动化、特定任务仓储机器人，以及客户自建或集成感知控制技术栈，也都是现状替代方案。因此，DexForce
              不仅要赢过新一代具身 AI 架构，还要赢过成熟系统；后者能力可能更窄，但部署风险也可能更低。
            claimRefs:
              - CP005
              - CP006
              - CP008
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP005
              - CP006
              - CP010
              - CP011
              - CP016
      - number: '3.2'
        title: 仿真优先的集成具有特色，但尚未被独立证明更优
        blocks:
          - type: paragraph
            body: >-
              DexForce 最清晰的差异化在于：从仿真工作场所和世界模型，一路纵向集成到实体机器迁移，并拥有自有 W1 Pro 平台。Reuters
              描述的工作流是，公司创建任务数字版本，在仿真中训练机器人，再把学到的行为移植到硬件；行业目录列出的轮式 W1 Pro 有 34 个自由度，标称续航 8
              小时。但混合仿真与现实数据在中国机器人厂商中并不罕见，高质量训练数据仍是共同瓶颈。公开成熟度信号也相互冲突：Reuters 报道制造业软件用户和服务部署，而 RobotHub
              仍将公司标为“Prototype”。因此，定位图采用分析师创建的序数评分，而不是基准测试结果，应视为尽调假设，不能视为领先证明。
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP007
              - CP009
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP007
              - CP009
              - CP015
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP005
              - CP006
              - CP016
      - number: '3.3'
        title: 公开产品包装信号存在，但合同经济性仍不透明
        blocks:
          - type: paragraph
            body: >-
              现有唯一公开硬件价格是 Humanoid.Guide 为 W1 Pro 列出的 USD 78,000；它不是官方报价、实际成交价，也不能证明毛利率。EmbodiedGlobal 报道了另一种“Physical
              Token”概念：客户购买机器人，然后按实体动作付费，但没有披露 token 单价、最低承诺、服务水平条款、折扣安排或续约条件。分销证据同样只是方向性信号：Reuters 点名使用 DexForce
              软件的制造商，并报道其在中国 15 个以上城市开展面向公众的服务运营，却未定义合同范围或衡量结果。这些缺口使其无法与仓储自动化、工业集成商或内部自建可靠比较总拥有成本，也让切换成本、多归属和渠道议价权仍未验证。
            claimRefs:
              - CP002
              - CP003
              - CP013
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP013
      - number: '3.4'
        title: 资本与产品广度换来时间，但商品化风险仍在
        blocks:
          - type: paragraph
            body: >-
              DexForce 具备可观资源：Reuters 报道 RMB 1 billion B 轮融资，Tracxn 报告四轮累计融资 USD 161 million。Gasgoo
              称新增资金将用于世界模型算法、物理引擎、数据基础设施、人形机器人能力和部署。这些投入可以加深软件到硬件的一体化闭环，但在据报道已有 150
              多家中国人形机器人公司活跃、直接同业也在推进世界模型、合成仿真、现实数据中心和自有机器人时，它们并不能建立持久护城河。决定性证据应是相对于具名替代方案、经独立测量的任务成功率、适应时间、正常运行时间、人工干预率、部署成本和客户留存。现有材料池中没有这些证据，因此不能把规模说法和战略方向转化为性能领先结论。
            claimRefs:
              - CP008
              - CP010
              - CP011
              - CP012
              - CP014
              - CP016
