  - id: FE001
    title: DexForce 从仿真到物理世界的产品架构
    type: stack
    summary: 基于来源的概念技术栈展示了已披露的仿真、数据、学习、迁移、运行时和物理层如何连接，但不宣称存在未披露的生产拓扑。
    data:
      layers:
        - label: 数字工作场景或任务
          modules:
            - 场景和对象表示
            - 任务定义
            - 环境变化
        - label: 仿真基础
          modules:
            - 物理和传感器仿真
            - 程序化生成
            - 高吞吐 GPU 环境
        - label: 数据管线
          modules:
            - 合成观测
            - 轨迹和关节数据
            - 自动化处理
        - label: 机器人学习
          modules:
            - 模仿学习
            - 强化学习
            - 模型训练和评估
        - label: Sim2Real 和运行时
          modules:
            - 迁移和校准
            - 3D 感知
            - 规划和实时控制
        - label: 物理部署
          modules:
            - 工业机器人单元
            - W1 Pro 人形机器人
            - 服务和研究场景
    approximationNotes: 层级顺序是对已披露工作流的分析性综合，不代表经验证的内部服务边界或生产网络拓扑。
    claimRefs:
      - CE001
      - CE002
      - CE006
      - CE015
  - id: FU001
    title: 基于证据的客户旅程和扩张循环
    type: journey-map
    summary: 公开证据覆盖部署和复制，但续约与账户扩张阶段仍未验证。
    data:
      items:
        - stage: '1'
          label: 定义任务
          detail: 制造商或场所识别自动化或服务工作流。
          touchpoints:
            - 直接企业销售
            - 集成商咨询
        - stage: '2'
          label: 采购平台
          detail: W1 Pro 通过直销和市场渠道出现，市场渠道显示交付时间约三周。
          touchpoints:
            - DexForce
            - RBTX 市场
        - stage: '3'
          label: 集成和验证
          detail: 模型或机器人适配拣箱、装配、插入或服务等任务。
          touchpoints:
            - 仿真工作流
            - 现场集成
        - stage: '4'
          label: 运营
          detail: 公司披露的工位、订单、访问量和运行时长指标显示存在现场活动。
          touchpoints:
            - 工厂工作流
            - 服务站
        - stage: '5'
          label: 复制
          detail: 已报道的项目、应用、子行业、工位和城市显示部署覆盖面较广。
          touchpoints:
            - 相邻任务
            - 其他场所
        - stage: '6'
          label: 续约和扩张
          detail: 续约、流失、合同期限、账户扩张和集中度仍未披露。
          touchpoints:
            - 续约决策
            - 账户扩张
    approximationNotes: 这些有序阶段是分析性工作流，不是实测转化漏斗；不推断转化率。
    claimRefs:
      - CU010
      - CU011
      - CU012
      - CU013
      - CU014
      - CU015
      - CU016
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 分析师依据指定公开证据评估发生可能性、影响、缓释成熟度和剩余严重性；这不是已确认事故记录。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余严重性
      rows:
        - label: 仿真到真实的可靠性
          values:
            - 高
            - 高
            - 早期
            - 高
          note: 独立报道将可靠地产生有用工作视为商业检验。
        - label: 人类近旁安全和认证
          values:
            - 中
            - 高
            - 未验证
            - 高
          note: 指定证据缺少认证和事故记录。
        - label: 资本密集度和融资
          values:
            - 中
            - 高
            - 发展中
            - 高
          note: 融资规模可观，但报道的资金用途覆盖多个高成本工作流。
        - label: 客户和部署集中度
          values:
            - 中
            - 高
            - 未验证
            - 高
          note: 未披露集中度、续约或客户队列分母。
        - label: 按用量变现
          values:
            - 中
            - 中
            - 早期
            - 中
          note: 公开报道描述按动作收费，但没有客户队列经济性。
        - label: IPO 执行
          values:
            - 中
            - 中
            - 初步
            - 中
          note: 据报道的讨论尚处于初步阶段，不能据此认定交易已正式备案。
    approximationNotes: 定性判断来自分析师观点，并非来源提供的概率；未据此推导数值转换、事件发生率或基准。
