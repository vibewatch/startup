            body: 只有当独立部署在受控演示之外达到任务成功率、正常运行时间、安全和人工干预阈值时，仿真经济性才有意义。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR004
          - type: callout
            title: 交割条件
            body: 在把据报道的规模或 IPO 兴趣视为风险下降前，要求提供客户层面的可靠性与集中度数据、经审计的现金和利润率证据、认证文件、事件历史及零部件供应应急方案。
            calloutType: recommendation
            claimRefs:
              - CR005
              - CR007
              - CR010
              - CR012
              - CR013
              - CR015
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              最清晰的价格信号是 2026 年 6 月 B 轮：Reuters、Gasgoo 和 Embodied Global 报告融资 RMB 1 billion，估值超过 RMB 10 billion。美元换算约在
              $1.38 billion 至 $1.5 billion 之间，应视为汇率和四舍五入差异，而不是不同估值事件。累计融资则不一致：Tracxn 报告四轮 $161 million，Multiples 记录一轮
              $148 million。这一分歧阻碍了对投前估值、稀释或可用现金的可靠重建。因此，入场纪律应锚定 RMB 条款并要求融资文件，而不是把数据库估算当作股权结构表。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV010
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV006
              - CV008
              - CV013
              - CV014
      - number: '8.2'
        title: 投资逻辑、反向逻辑与验证负担
        blocks:
          - type: paragraph
            body: >-
              可投资逻辑是：DexForce 能把仿真训练转化为更低成本的工业自动化有用途径。Reuters 报道其被大型制造商使用，B
              轮资金将投入世界模型、物理引擎、数据基础设施和现实部署。反向逻辑是，具名用户和产品演示并不能证明持久合同价值、毛利率、留存或现场可靠性。独立报道指出仿真到现实的“现实差距”，The Bot Scout 还称 W1
              Pro 最基本的商业与运营规格仍未公开。只有当部署证明转化为可重复且具经济吸引力的收入时，估值逻辑才成立。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV011
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV011
              - CV014
      - number: '8.3'
        title: 情景框架与可比证据
        blocks:
          - type: paragraph
            body: >-
              公开证据支持情景逻辑，但不足以支持可靠的点估值。Gasgoo 报告上半年收入 RMB 100 million，全年轨迹超过 RMB 300
              million，但没有经审计的滚动收入分母、毛利率、积压转化或烧钱披露。Multiples 将 UBTECH 列为 $4.4 billion 估值、$300 million 收入和 8.8x 收入倍数，但
              DexForce 缺少可比的经验证运营基础，无法进行同口径倍数比较。乐观情景要求经审计增长和可重复部署；基准情景保留选择权但要求价格保护；悲观情景由现场迁移疲弱、收入滑坡或使新资金次位受偿的融资条款触发。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV008
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV008
              - CV012
              - CV015
              - CV016
      - number: '8.4'
        title: 建议、退出准备度与最终尽调
        blocks:
          - type: paragraph
            body: >-
              建议为继续研究，置信度中等、风险高，估值立场偏高。潜在香港上市只是据报道的考虑事项，不是时点、监管准备度、流动性或退出价格的证据。投资委员会设定目标回报前，应取得经审计的 2025 年和 2026
              年财务报表、客户层面的合同和续约数据、部署可靠性队列、完整资本化表，以及所有优先权和治理文件。只有当这些材料支持连贯的收入倍数和下行保护时，结论才应改善；若现场表现、已确认收入或融资受偿顺序未通过检验，结论应恶化。
            claimRefs:
              - CV006
              - CV008
              - CV012
              - CV013
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV007
              - CV008
              - CV011
              - CV014
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 对价格敏感的结论
            body: 没有经审计的经济数据和实际优先股堆叠，不要把六月融资头条转化为买入建议。更低价格、里程碑分期或更强的下行权利，可能在公司质量本身改变之前就改变决策。
            calloutType: recommendation
            claimRefs:
              - CV003
