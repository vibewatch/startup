chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              DexForce 于 2021 年成立，并将总部设在广东深圳。其运营逻辑以仿真优先：软件先创建工作场所或任务的数字版本，在其中训练机器人，再把学到的行为迁移到实体机器。软件层与 W1 Pro
              配套；这是一款轮式人形机器人，提供全身和上半身两种配置。官方规格列出全身配置 34 个自由度、110 千克平台、10 千克手臂负载，以及至少 8 小时续航。Humanoid.Guide 另将该平台列为生产 /
              商业就绪产品，价格为 $78,000；但这只是外部目录价格，并非有日期的公司报价，仍应直接确认。
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO005
              - CO006
