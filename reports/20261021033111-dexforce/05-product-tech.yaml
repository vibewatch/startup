      - ["W1 Pro wheeled humanoid", "Industrial, service, and research operators", "Listed as business-ready by Humanoid.Guide; observed at a headquarters test facility", "Wheeled mobility combined with humanoid manipulation and the DexForce software stack", "Delivered-unit count, acceptance tests, safety certification, uptime, and field-failure rates"]
      - ["Control and deployment layer", "System integrators and plant operators", "Third-party profile describes dual-PC architecture and real-time joint control", "Integration of sensors, algorithms, simulation, controls, and physical deployment", "Interface specifications, deterministic latency, observability, remote support, and SLA evidence"]
    notes: "Status is based on the cited public sources as of 2026-10-21; directory specifications and company-attributed deployment claims are not treated as independently audited performance."
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE006]
  - id: "TE002"
    title: "Workflow and use-case assessment"
    columns: ["User job", "Current workflow", "DexForce solution", "Publicly stated benefit", "Limitation"]
    rows:
      - ["Teach a robot a new task", "Collect repeated demonstrations and engineer task-specific behavior", "Build a digital task replica, vary conditions, train in simulation, and transfer to a physical robot", "Lower dependence on manual data collection and faster iteration", "No independent transfer-success benchmark or total deployment-cost comparison"]
      - ["Automate variable industrial handling", "Program and tune vision-guided cells for parts and environments", "Combine synthetic data, 3D perception, manipulation models, and robot control", "Greater adaptability across bin-picking, loading, and related tasks", "No public denominator for parts, sites, error rates, or human intervention"]
      - ["Deploy a humanoid in service or industrial settings", "Integrate mobility, perception, manipulation, safety, and task software", "Use W1 Pro with the broader DexForce simulation and control stack", "One platform is positioned for industrial, service, and research applications", "Public specifications are not a substitute for delivered-unit, uptime, safety, or ROI evidence"]
      - ["Develop embodied-AI models", "Assemble separate simulators, data pipelines, robot environments, and training tools", "Use EmbodiChain's modular GPU-accelerated framework", "A unified environment can shorten experimentation and Sim2Real iteration", "Repository is alpha; public adoption, maintenance capacity, and compatibility evidence are limited"]
    notes: "Benefits are source-attributed product propositions, not independently measured customer outcomes; unavailable denominators and operating metrics are stated as limitations."
    claimRefs: [CE001, CE003, CE004, CE007, CE012]
  - id: "TE003"
    title: "Technology and operating architecture"
    columns: ["Layer", "Role", "Public evidence", "Critical dependency", "Technical risk"]
    rows:
      - ["Environment and simulation", "Represent tasks, objects, sensors, and physical variation", "Reuters and EqualOcean describe digital-task simulation and disturbance generation", "Accurate assets, physics, sensor models, and scenario coverage", "Synthetic environments may not capture contact, wear, edge cases, or operating variation"]
      - ["Data and learning", "Generate training data and support imitation or reinforcement learning", "EmbodiChain describes automated pipelines and standardized learning interfaces", "Data quality, model architecture, compute, labels, and evaluation design", "Effectiveness of synthetic data and VLA approaches remains externally unbenchmarked"]
      - ["Evaluation and transfer", "Test behavior and move learned capability to physical systems", "Multiple sources describe Sim2Real transfer as the central mechanism", "Calibration, domain adaptation, reproducible tests, and rollback controls", "Reality-gap failures can surface only after physical deployment"]
      - ["Runtime perception and control", "Sense, plan, navigate, manipulate, and control joints", "Tracxn describes visual sensors, AI algorithms, dual-PC architecture, and real-time joint control", "Sensors, networks, compute, software timing, actuators, and control safety", "No public latency, redundancy, fault-containment, or cybersecurity validation"]
      - ["Hardware and deployment operations", "Execute tasks in industrial and service environments", "W1 Pro and industrial automation deployments are described by third parties", "Supply quality, integration labor, site readiness, support, and maintenance", "Component consistency, thermal limits, reliability, safety, and ROI remain sector-wide barriers"]
    notes: "This is a conceptual architecture synthesized from public descriptions, not a disclosed production design; dependencies and risks are analytical interpretations."
    claimRefs: [CE001, CE002, CE006, CE009, CE012]
