callouts:
  - calloutType: "risk"
    title: "Capital raised is not runway"
    body: >-
      The RMB 1 billion Series B funds an ambitious model, infrastructure, product, and deployment
      program, but no public cash balance, burn rate, debt schedule, or runway supports a capital
      adequacy conclusion.
    claimRefs:
      - "CI012"
      - "CI013"
      - "CI014"
  - calloutType: "recommendation"
    title: "Gate underwriting on an audited operating pack"
    body: >-
      Require audited 2025 and H1 2026 statements, monthly revenue and cash collections, product
      gross-margin bridges, customer cohorts, and a fully diluted cash and debt schedule before
      treating reported growth as durable financial traction.
    claimRefs:
      - "CI004"
      - "CI014"
      - "CI015"
      - "CI016"
