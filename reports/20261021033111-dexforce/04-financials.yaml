  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "capital-adequacy"
      missingEvidence: >-
        Current cash balance, monthly burn, runway, debt and covenant schedule, working-capital
        needs, and next-round trigger.
      whyItMatters: >-
        Financing proceeds do not reveal remaining liquidity or whether planned product and
        deployment investment can be funded through the next operating milestone.
      diligencePath: >-
        Obtain a current balance sheet, 24-month cash forecast, monthly burn bridge, debt schedule,
        receivables aging, inventory roll-forward, and board-approved financing plan.
      relatedQuestionRefs:
        - "QI008"
      relatedTableRefs:
        - "TI003"
    - type: "private-evidence-only"
      severity: "material"
      topic: "unit-economics"
      missingEvidence: >-
        Product-level gross margin, hardware bill of materials, deployment labor, warranty and
        support cost, CAC, payback, channel take rate, and cohort retention.
      whyItMatters: >-
        Revenue growth cannot establish a scalable margin path or capital-efficient sales motion
        without direct and acquisition-cost evidence.
      diligencePath: >-
        Reconcile audited revenue to invoices and cash, then review product, customer, and channel
        cohorts with fully loaded contribution margins.
      relatedQuestionRefs:
        - "QI005"
        - "QI006"
        - "QI009"
      relatedTableRefs:
        - "TI001"
        - "TI002"
        - "TI003"
    - type: "conflicting-data"
      severity: "material"
      topic: "pricing"
      missingEvidence: >-
        Company-confirmed W1 Pro list pricing and realized ASP by configuration, geography,
        delivery scope, support package, and order size.
      whyItMatters: >-
        A third-party displayed price and quotation-based reseller language cannot establish
        realized revenue per unit or hardware gross margin.
      diligencePath: >-
        Obtain the current price book, approved discount matrix, signed-order sample, invoice
        sample, and revenue allocation for hardware, integration, software, and support.
      relatedQuestionRefs:
        - "QI002"
      relatedTableRefs:
        - "TI002"
