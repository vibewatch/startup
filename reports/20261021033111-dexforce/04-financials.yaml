company:
  name: "DexForce"
chapter:
  number: 4
  title: "Financials"
  summary: >-
    DexForce reports meaningful 2026 revenue and shipment traction, but the public record remains
    management-led and does not disclose gross margin, realized pricing, cash, burn, or runway.
    The financing supports continued scale-up, yet it cannot substitute for an audited operating
    model or evidence that simulation-led cost savings convert into durable gross profit.
sections:
  - id: "revenue-architecture"
    title: "Revenue architecture is broader than a robot sale"
    body: >-
      Public commercial descriptions point to several monetizable layers: industrial 3D vision
      hardware and guided cells, DexVerse-related software and simulation capabilities, and W1 Pro
      humanoid deployments. A separate report attributes to management a proposed Physical Token
      model under which a customer buys the robot body and then pays for physical actions. That
      structure could blend upfront system revenue, integration work, recurring software, and
      usage revenue, but public evidence does not quantify the mix or establish that action-based
      billing is broadly deployed. The distinction matters because hardware, project integration,
      software licensing, and usage fees carry different recognition, working-capital, support,
      and margin profiles.
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI004"
    tableRefs:
      - "TI001"
    figureRefs:
      - "FI001"
  - id: "pricing-and-traction"
    title: "Headline traction is visible; revenue quality is not"
    body: >-
      Pricing evidence is not internally consistent enough to underwrite realized economics.
      Humanoid.Guide displays USD 78,000 for W1 Pro, while reseller descriptions state that price
      depends on configuration and deployment scope and requires a quotation. On traction, two
      outlets report RMB 100 million of H1 2026 revenue; Gasgoo says the company was on track to
      exceed RMB 300 million for the full year, while EmbodiedGlobal reports management guidance
      of three to four times 2025 revenue. Those are useful scale markers, not audited revenue,
      ARR, cash collection, or gross profit. Several hundred H1 2026 humanoid shipments provide an
      additional activity proxy but lack disclosed unit price, acceptance status, returns, or mix.
    claimRefs:
      - "CI003"
      - "CI005"
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI009"
    tableRefs:
      - "TI002"
  - id: "cost-and-sales-efficiency"
    title: "Simulation may lower training cost, but the margin bridge is missing"
    body: >-
      Reuters reports that DexForce uses synthetic data to cut training costs and improve
      efficiency, and that management considers the process faster and cheaper than repeated
      human demonstrations. This is a plausible cost advantage, but it is not a disclosed unit
      economic. The roughly 500-person organization, continued world-model and physics-engine
      investment, data infrastructure, robot hardware, integration, and field support all imply a
      material cost base. No reviewed source supplies gross margin, bill of materials, deployment
      labor, warranty burden, customer acquisition cost, payback, sales cycle, channel take rate,
      or working-capital metrics. Independent coverage also flags the reality gap and high
      production costs as unresolved sector constraints.
    claimRefs:
      - "CI010"
      - "CI011"
      - "CI015"
      - "CI016"
    tableRefs:
      - "TI003"
  - id: "capital-adequacy-verdict"
    title: "Fresh capital extends options, not proven runway"
    body: >-
      Multiple current sources report a RMB 1 billion Series B at a valuation above RMB 10 billion.
      Reported uses include world-model iteration, physics-engine upgrades, data infrastructure,
      humanoid capability, and real-world deployment. Those uses are growth investments rather
      than evidence of current liquidity. Funding raised is not cash available: the reviewed
      evidence does not disclose cash on hand, monthly burn, runway, debt, project-finance
      obligations, receivables, inventory, or a next-round trigger. The financial verdict is
      therefore conditional. Public traction justifies deeper diligence, but revenue quality,
      margin path, sales efficiency, and capital adequacy remain ununderwritable until management
      provides audited statements and operating cohorts.
    claimRefs:
      - "CI012"
      - "CI013"
      - "CI014"
      - "CI015"
      - "CI016"
