company:
  name: DexForce
chapter:
  number: 1
  title: Company Overview
  summary: >-
    DexForce is a Shenzhen physical-AI company founded in 2021 that combines
    simulation and world-model software with its own W1 Pro humanoid platform.
    Independent reporting supports a sizable 2026 financing and early operating
    scale, but audited economics, board rights, and durable customer evidence
    remain unavailable.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      DexForce was founded in 2021 and identifies its headquarters in Shenzhen,
      Guangdong. Its operating thesis is simulation-first: software creates a
      digital version of a workplace or task, trains a robot in that environment,
      and transfers the learned behavior to physical machines. That software
      layer is paired with the W1 Pro, a wheeled humanoid offered in full-body
      and upper-body configurations. The official specification lists a
      34-degree-of-freedom full-body configuration, a 110-kilogram platform,
      10-kilogram arm payload, and at least eight hours of battery operation.
      Humanoid.Guide separately lists the platform as production/business-ready
      at $78,000, but that price is an external listing rather than a dated
      company quotation and should be confirmed directly.
    claimRefs: [CO001, CO002, CO004, CO005, CO006]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Founder-led leadership and governance visibility
    body: >-
      Public leadership evidence centers on Jia Kui, whom Reuters identifies as
      founder and chief executive and as a machine-learning professor at the
      Chinese University of Hong Kong, Shenzhen. That background provides clear
      technical founder-market fit for a simulation-led robotics strategy.
      However, the eligible evidence set does not identify a board chair,
      directors, chief financial officer, chief operating officer, or other
      functional executives. The resulting diligence posture is founder-centric:
      product direction and external narrative are visible through Jia, while
      succession depth, financial controls, board independence, and reserved
      matters are not. This is a disclosure gap, not evidence that those
      functions or controls are absent.
    claimRefs: [CO003]
    tableRefs: [TO002]
  - id: financing-and-stakeholders
    title: Financing, valuation, and stakeholder map
    body: >-
      The financing record indicates a heavily funded private company, but the
      public figures require careful labeling. Tracxn reports $161 million raised
      across four rounds and dates the latest round to June 30, 2026. Gasgoo
      separately reports a RMB 1 billion Series B and a valuation above RMB
      10 billion; EmbodiedGlobal describes the same round as approximately $138
      million, while Reuters reporting carried by Yahoo gives approximately
      $147 million. Those dollar figures are conversions of the round amount,
      not separate financings. The disclosed investor roster mixes venture,
      strategic, and state-linked capital. None of these amounts establishes
      current cash availability, ownership percentages, liquidation preferences,
      or board control.
    claimRefs: [CO007, CO008, CO009, CO010]
    tableRefs: [TO003]
  - id: scale-milestones-and-proof-gaps
    title: Scale signals and the remaining proof burden
    body: >-
      Recent reporting gives several scale signals, all of which need
      reconciliation with primary financial and customer records. Reuters
      describes roughly 500 employees. Gasgoo reports RMB 100 million of revenue
      in the first half of 2026 and a full-year trajectory above RMB 300 million;
      EmbodiedGlobal separately reports more than RMB 100 million in 2025 revenue
      and a company guide for three-to-four-times growth in 2026. These are
      revenue claims, not ARR, cash burn, or cash on hand. EmbodiedGlobal also
      reports several hundred humanoids shipped in H1 2026 and more than 1,000
      deployments across over 50 subsectors, while Technology.org reports
      software users and service deployments in more than 15 cities. The
      counterweight is explicit: independent coverage says investors still need
      proof that simulation-trained robots transfer reliably to factory floors.
      Audited revenue, margins, renewal behavior, deployment definitions, and
      field reliability therefore remain central diligence asks.
    claimRefs: [CO011, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
