callouts:
  - calloutType: strength
    title: Integrated software and hardware thesis
    body: >-
      DexForce combines simulation and world-model software with an owned
      humanoid platform, giving it a direct path from synthetic training to
      physical deployment rather than a software-only product boundary.
    claimRefs: [CO004, CO005]
  - calloutType: risk
    title: Public scale exceeds public verification
    body: >-
      Funding and operating claims are substantial, but the retained evidence
      does not include audited financials, a complete cap table, board rights,
      customer contracts, or field-reliability datasets.
    claimRefs: [CO008, CO012, CO014, CO016]
