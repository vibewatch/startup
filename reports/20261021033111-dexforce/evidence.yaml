evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Complete cap table, board roster, voting rights, reserved matters, liquidation preferences, and succession plan.
    whyItMatters: Without these records, investor control, founder dependence, and downside economics cannot be assessed.
    diligencePath: >-
      Request the post-Series-B cap table, amended charter, shareholder agreement, board minutes, and executive
      organization chart.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Audited 2025 and H1 2026 revenue, revenue recognition policy, gross margin, cash burn, and reconciled FY2026
      guidance.
    whyItMatters: Media-reported revenue cannot establish recurring revenue, margin quality, liquidity, or runway.
    diligencePath: >-
      Obtain audited statements, monthly management accounts, bank statements, bookings-to-revenue reconciliation, and
      board-approved forecast.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: deployment-quality
    missingEvidence: >-
      Customer contracts, paid deployment counts, renewals, uptime, field-failure rates, and acceptance criteria for
      reported shipments.
    whyItMatters: Shipment and deployment totals do not establish durable adoption or reliable production performance.
    diligencePath: >-
      Sample contracts and invoices, interview named customers, and reconcile serial numbers to installation,
      acceptance, and service records.
    relatedQuestionRefs:
      - QO006
      - QO008
  - type: missing-source
    severity: minor
    topic: adverse-events
    missingEvidence: Authoritative legal, regulatory, recall, outage, or safety-incident records tied specifically to DexForce.
    whyItMatters: >-
      The assigned searches returned no retained direct evidence, which cannot be treated as proof that no incident
      exists.
    diligencePath: >-
      Run jurisdiction-specific court, regulator, product-safety, labor, and cybersecurity database checks with the
      Chinese legal entity names.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: material
    topic: sam-som-gap
    missingEvidence: >-
      Segment-level spend, target geography, buyer budgets, realized pricing, attach rates, and DexForce revenue or
      deployment share.
    whyItMatters: >-
      Without these denominators, the broad China forecast cannot be converted into an investable company-specific SAM,
      SOM, or market-share estimate.
    diligencePath: >-
      Obtain management's bottom-up account plan and customer-level pipeline, then reconcile units, pricing, geography,
      and attach rates to audited revenue and externally sourced segment demand.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: market-shipments
    missingEvidence: >-
      The dated Morgan Stanley source note and consistent definitions behind the 50,000-unit and 28,000-unit 2026 China
      forecasts.
    whyItMatters: >-
      The difference materially changes the near-term adoption curve and any valuation narrative based on shipment
      acceleration.
    diligencePath: >-
      Obtain the underlying Morgan Stanley notes and reconcile publication date, external-sales definition, forecast
      vintage, and shipment scope.
    relatedQuestionRefs:
      - QM002
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Contract duration, renewal and churn data, integration dependencies, multi-homing behavior, channel economics, and
      customer switching costs.
    whyItMatters: >-
      Without contract and workflow evidence, product integration cannot be translated into durable retention or pricing
      power.
    diligencePath: >-
      Review a cohort-level contract schedule and interview at least three customers about integration effort,
      alternatives considered, and renewal.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: reliability-benchmark
    missingEvidence: >-
      Independent, like-for-like task success, uptime, intervention, safety, certification, adaptation-time, and
      total-cost results against named peers.
    whyItMatters: >-
      The positioning thesis depends on simulation transferring into reliable and economical field operation rather than
      demonstrations.
    diligencePath: >-
      Run a controlled proof of value on identical tasks and obtain third-party validation of uptime, interventions,
      safety events, and labor displacement.
    relatedQuestionRefs:
      - QP010
    relatedTableRefs:
      - TP002
  - type: conflicting-data
    severity: material
    topic: maturity
    missingEvidence: >-
      Reconciliation of RobotHub's prototype label with reported industrial software users and public-facing robot
      deployments.
    whyItMatters: >-
      Product maturity changes the appropriate competitor set, implementation risk, revenue quality, and valuation
      framework.
    diligencePath: >-
      Obtain a deployment ledger separating paid production, paid pilot, unpaid pilot, demonstration, and internal test
      sites.
    relatedTableRefs:
      - TP001
      - TP002
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Official hardware quotes, Physical Token rates, integration and support fees, discount schedules, warranties, and
      comparable competitor proposals.
    whyItMatters: >-
      Public list and concept-level pricing cannot establish total cost, gross-margin potential, or relative customer
      value.
    diligencePath: >-
      Collect standardized quotes for the same workflow from DexForce, two specialists, one incumbent integrator, and
      the customer's internal team.
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current cash balance, monthly burn, runway, debt and covenant schedule, working-capital needs, and next-round
      trigger.
    whyItMatters: >-
      Financing proceeds do not reveal remaining liquidity or whether planned product and deployment investment can be
      funded through the next operating milestone.
    diligencePath: >-
      Obtain a current balance sheet, 24-month cash forecast, monthly burn bridge, debt schedule, receivables aging,
      inventory roll-forward, and board-approved financing plan.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Product-level gross margin, hardware bill of materials, deployment labor, warranty and support cost, CAC, payback,
      channel take rate, and cohort retention.
    whyItMatters: >-
      Revenue growth cannot establish a scalable margin path or capital-efficient sales motion without direct and
