      - [System integrators and distributors, "Integrator or distributor", "Deployment and support teams", "Workflow integration and resale of W1 Pro", "DexForce solicits integrators and RBTX lists the product", "No partner count, sell-through, service obligation, or channel concentration"]
      - [Research and automation developers, "Laboratory or engineering organization", "Robotics researchers and developers", "ROS-compatible research and industrial integration", "Third-party product listings describe research and industrial applications", "No named research customers, active-user data, or support economics"]
