      - [Samsung, Electronics manufacturing, "Uses DexForce software", Not disclosed, Not disclosed, "Secondary report; no customer-primary confirmation or site scope"]
      - [Panasonic, Electronics manufacturing, "Uses DexForce software", Not disclosed, Not disclosed, "Secondary report; no customer-primary confirmation or site scope"]
      - [Foxconn, Electronics manufacturing, "Uses DexForce software", Not disclosed, Not disclosed, "Secondary report; no customer-primary confirmation or site scope"]
      - [Midea, Appliance manufacturing, "AI models for bin picking, assembly, or insertion", Not disclosed, Not disclosed, "Trade report aggregates task examples across named accounts"]
      - [CRRC, Rail equipment manufacturing, "AI models for bin picking, assembly, or insertion", Not disclosed, Not disclosed, "Trade report aggregates task examples across named accounts"]
      - [Wuling, Automotive manufacturing, "AI models for bin picking, assembly, or insertion", Not disclosed, Not disclosed, "Trade report aggregates task examples across named accounts"]
    notes: >-
      Sample of organizations explicitly named in retained current sources; the sources do not establish
      an exhaustive customer roster, production status, deployment size, outcomes, renewal, or contract value.
    enumerationScope:
      coverage: sample
      basis: >-
        Organizations explicitly named in the two retained current secondary sources that discuss DexForce use.
    claimRefs: [CU005, CU006]
figures:
  - id: FU001
    title: Evidence-based customer journey and expansion loop
    type: journey-map
    summary: >-
      Public evidence reaches deployment and replication, but the renewal and account-expansion stage remains unverified.
    data:
      items:
        - stage: "1"
          label: Define task
          detail: "Manufacturer or venue identifies an automation or service workflow."
          touchpoints: ["Direct enterprise sale", "Integrator consultation"]
        - stage: "2"
          label: Procure platform
          detail: "W1 Pro appears through direct and marketplace channels, with a three-week marketplace delivery indication."
          touchpoints: ["DexForce", "RBTX marketplace"]
        - stage: "3"
          label: Integrate and validate
          detail: "Models or robots are adapted to tasks such as bin picking, assembly, insertion, or service."
          touchpoints: ["Simulation workflow", "Site integration"]
        - stage: "4"
          label: Operate
          detail: "Company-reported station, order, visit, and operating-hour metrics indicate field activity."
          touchpoints: ["Factory workflow", "Service station"]
        - stage: "5"
          label: Replicate
          detail: "Reported projects, applications, sub-sectors, stations, and cities indicate breadth across deployments."
          touchpoints: ["Adjacent task", "Additional venue"]
        - stage: "6"
          label: Renew and expand
          detail: "Renewal, churn, contract length, account expansion, and concentration remain undisclosed."
          touchpoints: ["Renewal decision", "Account expansion"]
    approximationNotes: >-
      The ordered stages are an analytical workflow, not a measured conversion funnel; no conversion rates are inferred.
    claimRefs: [CU010, CU011, CU012, CU013, CU014, CU015, CU016]
callouts:
  - calloutType: risk
    title: Deployment breadth is not retention proof
    body: >-
      Products, projects, stations, visits, and operating hours show activity, but none discloses
      renewal, churn, expansion revenue, or top-customer exposure; customer durability remains a material diligence gap.
    claimRefs: [CU002, CU003, CU004, CU007, CU008, CU009, CU016]
