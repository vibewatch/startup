      - Reported value
      - Period / date
      - Source posture
      - Confidence
      - Implication and missing denominator
    rows:
      - ["Industries reached", "30+", "Current company profile accessed 2026-10-21", "Company claim", Medium, "Broad applicability claim; no customer or revenue mix by industry"]
      - ["Products shipped / applications", "2,000+ / 50+", "Company post current at 2026-10-21 access", "Company claim", Medium, "Distribution breadth; product definition and unique-customer denominator absent"]
      - ["Service stations / visits", "30+ / 110,000+", "2026 National Day holiday", "Company claim", Medium, "Replicated public deployment; paid-order and repeat-visitor denominators absent"]
      - ["Orders per robot / operating hours", "500+ per robot per day / 25,000+ hours", "Company post current at 2026-10-21 access", "Company claim", Medium, "Usage intensity signal; fleet size, uptime method, and revenue conversion absent"]
      - ["Humanoid shipments", "Several hundred units", "H1 2026", "Independent trade report citing company/media", Medium, "Hardware activity; booked, delivered, accepted, and paid status not separated"]
      - ["Projects / sub-sectors / customers", "1,000+ deployments / 50+ sub-sectors / 100+ customers", "2025-2026 reports", "Secondary reports", Low, "Breadth signal; definitions, overlap, active status, and reconciliation absent"]
    notes: >-
      Metrics retain their original units and periods; rows are not a common funnel, and none supplies
      a recurring-customer, revenue-retention, or paid-production denominator.
    claimRefs: [CU001, CU002, CU003, CU004, CU007, CU008, CU009]
  - id: TU003
