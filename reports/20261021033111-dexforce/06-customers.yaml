    notes: >-
      Segment assignments synthesize company, independent-media, analyst, and partner-listing evidence;
      payer identity and revenue contribution are not publicly disclosed.
    claimRefs: [CU001, CU003, CU005, CU006, CU011, CU012, CU015]
