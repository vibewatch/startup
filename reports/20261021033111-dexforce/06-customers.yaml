schemaVersion: "report-v2"
artifact: customers
slug: dexforce
runDate: 2026-10-21
company:
  name: DexForce
chapter:
  number: 6
  title: Customers
  summary: >-
    DexForce shows breadth across industrial software and service-robot deployments, with
    company-claimed shipment, station, visit, and operating-hour metrics plus secondary
    reports naming major manufacturers. The public record still does not establish
    account-level production status, retention, expansion, or concentration.
sections:
  - id: customer-segments
    title: Two customer motions, with different buyers and proof standards
    body: >-
      Public evidence points to two customer motions rather than one homogeneous base.
      The industrial motion sells simulation-trained models and integration capability
      to manufacturers and automation teams; secondary coverage names Toyota, Samsung,
      Panasonic, Foxconn, Midea, CRRC, and Wuling, while company materials claim
      deployment across more than 30 industries. The service motion places W1 Pro robots
      into malls, tourist sites, parks, and retail counters, where venue operators or
      integrators are the likely economic buyers and visitors are end users. RBTX also
      exposes a partner-led procurement route. These surfaces demonstrate addressable
      use cases, but they do not disclose payer identity, contract structure, or segment
      revenue, so strategic value cannot yet be translated into customer economics.
    claimRefs: [CU001, CU005, CU006, CU011, CU012, CU015]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption indicators are broad, recent, and mostly unaudited
    body: >-
      DexForce's own current social feed reports more than 2,000 embodied-intelligence
      products shipped across more than 50 applications. It also describes a National
      Day deployment of more than 30 service stations that drew more than 110,000 visits,
      averaged more than 500 orders per robot per day, and contributed to more than
      25,000 cumulative uninterrupted operating hours. Separate trade coverage reports
      several hundred humanoid units shipped in the first half of 2026 and more than
      1,000 deployments across over 50 sub-sectors. These measures indicate activity and
      replication, not a coherent customer cohort: products, units, projects, stations,
      visits, orders, and operating hours have different denominators and cannot be
      combined into a conversion rate or recurring-revenue estimate.
    claimRefs: [CU002, CU003, CU004, CU007, CU008, CU009]
    tableRefs: [TU002]
  - id: named-customer-proof
    title: Named manufacturers improve credibility, but production depth is unverified
    body: >-
      Technology.org reports that Toyota, Samsung, Panasonic, and Foxconn use DexForce
      software, while Embodied Global reports model deployments at Midea, CRRC, and
      Wuling for bin picking, assembly, and insertion. This is stronger than an
      unexplained logo wall because the sources identify either a use category or
      deployment relationship. It remains weaker than customer-primary evidence:
      retained materials do not state which plants are live, whether deployments are
      pilots or production, how many robots or lines are involved, what outcomes were
      achieved, or whether contracts renewed. The named-account table is therefore a
      sourced sample rather than an exhaustive roster, and each row carries the same
      diligence limitation rather than implying independently verified durability.
    claimRefs: [CU005, CU006]
    tableRefs: [TU003]
  - id: durability-expansion-and-friction
    title: Replication is visible; retention and concentration are not
    body: >-
      The evidence suggests a two-track expansion loop: manufacturing deployments can
      extend from one task to adjacent automation tasks, while service robots can move
      from a single venue to replicated stations and cities. Marketplace availability
      and a quoted three-week delivery time indicate a procurement surface, but neither
      proves implementation speed or repeat demand. The broader Chinese market is moving
      from trials toward orders, yet Reuters emphasizes that reliable useful work remains
      the commercial test, and China's new lifecycle standards add an operating and
      safety compliance layer. No retained source reports NRR, GRR, churn, renewal,
      contract length, segment revenue, top-customer share, or channel concentration.
      Those omissions prevent a durability or concentration judgment despite visible
      deployment breadth.
    claimRefs: [CU010, CU011, CU012, CU013, CU014, CU015, CU016]
    figureRefs: [FU001]
