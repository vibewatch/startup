    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Evidence basis
      - Unresolved gap
    rows:
      - [Simulation-to-real transfer fails outside controlled tasks, High, High, Early, High, "Independent reporting identifies reliable useful work and the reality gap as core tests", "Task-level success, intervention, and failure distributions"]
      - [Safety or environmental protection proves inadequate, Medium, High, Unverified, High, "Third-party listing says safe with humans but shows ingress protection as N/A", "Certification, ingress rating, test protocol, and incident history"]
      - [Deployment economics deteriorate under service and warranty load, Medium, High, Unverified, High, "Reported revenue and deployments lack margin, warranty, and field-service detail", "Audited gross margin and fully loaded cohort economics"]
      - [Usage metering or utilization underperforms, Medium, Medium, Early, Medium, "Reported model combines hardware purchase with per-action charges", "Contract terms, metering controls, utilization, renewal, and dispute data"]
    notes: >-
      Analyst risk rankings use cited public claims; no row represents a confirmed incident, and null
      operating metrics are treated as diligence gaps rather than zero.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR010, CR011, CR012]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty / role
      - Concentration evidence
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - [External capital, "Venture, strategic, and state-backed investors", "No ownership or provider concentration disclosed", "Follow-on capital or IPO window closes before economics mature", High, "Milestone-based runway plan and committed alternatives", High]
      - [Industrial customers and deployment partners, "Named manufacturers and deployment sites", "No revenue or renewal concentration disclosed", "Pilot conversion, renewal, or site expansion stalls", High, "Contract and cohort review with reference calls", High]
      - ["Simulation, data, and hardware stack", "Internal models plus sensors, compute, and robot components", "Supplier and component concentration not disclosed", "Component restriction or model-transfer weakness interrupts delivery", High, "Dual-source bill of materials and measured transfer gates", High]
    notes: >-
      Counterparty roles come from independent reporting and market-data sources; concentration,
      contractual protection, and contingency maturity are not disclosed in the assigned evidence.
    claimRefs: [CR002, CR007, CR008, CR009, CR012, CR014, CR015]
figures:
