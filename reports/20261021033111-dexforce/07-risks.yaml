    title: Residual risk heatmap
    type: matrix
    summary: >-
      Analyst assessment of likelihood, impact, mitigation maturity, and residual severity from the
      assigned public evidence; it is not a record of confirmed incidents.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Simulation-to-real reliability
          values: [High, High, Early, High]
          note: "Independent reporting identifies reliable useful work as the commercial test."
        - label: Human-adjacent safety and certification
          values: [Medium, High, Unverified, High]
          note: "Assigned evidence lacks certification and incident records."
        - label: Capital intensity and financing
          values: [Medium, High, Developing, High]
          note: "Funding is substantial, but reported proceeds span multiple expensive workstreams."
        - label: Customer and deployment concentration
          values: [Medium, High, Unverified, High]
          note: "No concentration, renewal, or cohort denominator is disclosed."
        - label: Usage-based monetization
          values: [Medium, Medium, Early, Medium]
          note: "Public reporting describes per-action charging without cohort economics."
        - label: IPO execution
          values: [Medium, Medium, Preliminary, Medium]
          note: "Reported discussions were preliminary and do not establish a filed transaction."
    approximationNotes: >-
      Qualitative positions are analyst judgments, not source-provided probabilities; no numeric
      conversion, incident rate, or benchmark is inferred.
    claimRefs: [CR001, CR004, CR006, CR007, CR009, CR010, CR011, CR015]
callouts:
  - calloutType: risk
    title: Core thesis-break risk
    body: >-
      Simulation economics matter only if independent deployments meet task-success, uptime, safety,
      and intervention thresholds outside controlled demonstrations.
    claimRefs: [CR001, CR002, CR004]
  - calloutType: recommendation
    title: Closing conditions
    body: >-
      Require customer-level reliability and concentration data, audited cash and margin evidence,
      certification files, incident history, and a component-supply contingency plan before treating
      reported scale or IPO interest as de-risking.
    claimRefs: [CR005, CR007, CR010, CR012, CR013, CR015]
