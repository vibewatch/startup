callouts:
  - calloutType: recommendation
    title: Price-sensitive conclusion
    body: >-
      Do not convert the June round headline into a buy recommendation without audited
      economics and the actual preference stack. A lower price, milestone tranches, or
      stronger downside rights could change the decision before company quality alone does.
    claimRefs: [CV003, CV006, CV013, CV014, CV015]
