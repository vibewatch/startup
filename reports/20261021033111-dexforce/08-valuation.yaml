company:
  name: DexForce
chapter:
  number: 8
  title: Valuation
  summary: >-
    DexForce's June 2026 Series B establishes a public valuation anchor above RMB 10
    billion, but the available revenue figures are unaudited media reports and funding
    databases disagree on cumulative capital raised. The appropriate stance is
    research-more with high risk and a stretched valuation until contract economics,
    audited revenue, cap-table terms, and field performance are disclosed.
sections:
  - id: financing-context
    title: Financing context and entry discipline
    body: >-
      The clearest price signal is the June 2026 Series B: Reuters, Gasgoo, and
      Embodied Global report RMB 1 billion raised at a valuation above RMB 10 billion.
      Dollar translations range from about $1.38 billion to $1.5 billion, which should
      be treated as foreign-exchange and rounding variation rather than as separate
      valuation events. Lifetime funding is less settled: Tracxn reports $161 million
      over four rounds, while Multiples records $148 million in one round. That
      disagreement prevents a reliable reconstruction of pre-money value, dilution, or
      cash available. Entry discipline should therefore anchor to the RMB terms and
      require the financing documents rather than treating database estimates as a
      cap table.
    claimRefs: [CV001, CV002, CV003, CV010, CV013]
    tableRefs: [TV001]
  - id: thesis-and-antithesis
    title: Thesis, anti-thesis, and proof burden
    body: >-
      The investable thesis is that DexForce can turn simulation-led training into a
      lower-cost path to useful industrial automation. Reuters reports use by major
      manufacturers, and the Series B proceeds are directed toward the world model,
      physics engine, data infrastructure, and real-world deployment. The anti-thesis
      is that named users and product demonstrations do not establish durable contract
      value, gross margin, retention, or field reliability. Independent coverage calls
      out the simulation-to-real "reality gap," while The Bot Scout notes that even
      basic W1 Pro commercial and operating specifications remain unpublished. The
      valuation can work only if deployment proof converts into repeatable,
      economically attractive revenue.
    claimRefs: [CV007, CV008, CV009, CV011, CV014]
    tableRefs: [TV002]
  - id: scenarios-and-comparables
    title: Scenario framework and comparable evidence
    body: >-
      Public evidence supports scenario logic, not a defensible point estimate. Gasgoo
      reports RMB 100 million of first-half revenue and a company trajectory above RMB
      300 million for the year, but there is no audited trailing-revenue denominator,
      gross margin, backlog conversion, or cash-burn disclosure. Multiples lists UBTECH
      at $4.4 billion, $300 million of revenue, and 8.8x revenue, yet DexForce lacks the
      equivalent verified operating base needed for a like-for-like multiple. The bull
      case requires audited growth and repeatable deployments; the base case preserves
      optionality but demands price protection; the bear case is triggered by weak
      field transfer, revenue slippage, or financing terms that subordinate new money.
    claimRefs: [CV004, CV005, CV006, CV008, CV015, CV016]
    tableRefs: [TV003]
  - id: decision-and-exit-readiness
    title: Recommendation, exit readiness, and final diligence
    body: >-
      The recommendation is research-more, with medium confidence, high risk, and a
      stretched valuation stance. A potential Hong Kong listing is only a reported
      consideration, not evidence of timing, regulatory readiness, liquidity, or an
      exit price. Before an investment committee sets a target return, it should obtain
      audited 2025 and 2026 financials, customer-level contract and renewal data,
      deployment reliability cohorts, the full capitalization table, and all
      preference and governance documents. The call should improve only if those
      materials support a coherent revenue multiple and downside protection; it should
      deteriorate if field performance, booked revenue, or financing seniority fails
      that test.
    claimRefs: [CV006, CV008, CV012, CV013, CV014, CV015]
    figureRefs: [FV001]
