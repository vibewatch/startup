      - [Thesis, "New capital is earmarked for core models, infrastructure, and deployment", "Milestone reporting that links spending to commercial output"]
      - [Anti-thesis, "Simulation-to-real performance remains an acknowledged industry proof burden", "Repeatable uptime, task-success, safety, and intervention-rate data"]
      - [Anti-thesis, "Public W1 Pro price, purchase terms, runtime, and payload remain absent", "Standardized product economics and procurement documentation"]
    notes: "The table separates reported evidence from diligence conditions; named users do not by themselves prove contract quality or retention."
    claimRefs: [CV007, CV008, CV009, CV011, CV014]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Case, Assumptions, Valuation and return logic, Key downside trigger]
    rows:
      - [Bull, "Audited growth validates the reported trajectory; deployments repeat with attractive margins", "A premium could be supportable only after verified revenue and retention make a comparable multiple meaningful", "Field performance or renewal evidence falls short"]
      - [Base, "Commercial proof improves, but revenue quality and exit timing remain incomplete", "Preserve option value through staged capital, milestones, and downside-protective terms", "Diligence cannot reconcile revenue, backlog, or financing rights"]
      - [Bear, "Reality-gap costs persist; revenue misses the reported trajectory; later capital is senior", "RMB 10B+ compresses without a verified operating denominator and a credible liquidity path", "Weak transfer to production sites or adverse preference overhang"]
    notes: "No numeric return range is presented because audited trailing revenue, margin, dilution, preferences, and exit timing are not public."
    claimRefs: [CV001, CV004, CV005, CV008, CV012, CV015, CV016]
