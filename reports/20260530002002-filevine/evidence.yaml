evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-and-cap-table
    missingEvidence: >-
      Current board roster, ownership percentages, control rights, and liquidation preference terms for Filevine's
      private rounds.
    whyItMatters: >-
      Governance concentration and investor rights affect downside protection, acquisition optionality, and later-stage
      financing risk.
    diligencePath: >-
      Request the current board list, cap table, investor-rights summary, and financing documents from management or
      counsel.
    relatedQuestionRefs:
      - QO009
      - QO026
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: current-economics
    missingEvidence: Audited 2024-2025 revenue, ARR, gross margin, burn, and cash figures from primary company materials.
    whyItMatters: >-
      Public estimates diverge and valuation discipline depends on knowing whether growth is efficient, durable, and
      cash generative.
    diligencePath: >-
      Request audited financial statements, board materials, or banker data room materials covering 2024-2025 operating
      metrics.
    relatedQuestionRefs:
      - QO017
      - QO026
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: >-
      One current primary-source headcount and location distribution disclosure instead of mixed 2022, 2025, and
      database estimates.
    whyItMatters: >-
      Hiring intensity and operating leverage affect both execution risk and how much of the 2025 capital raise is still
      needed for scaling.
    diligencePath: Ask management for the latest employee count by function and geography, plus the date of measurement.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO001
      - TO002
  - type: conflicting-data
    severity: minor
    topic: valuation-and-total-raised
    missingEvidence: >-
      A primary or higher-grade independent source that explicitly states the 2025 post-money valuation and reconciles
      lifetime capital raised.
    whyItMatters: >-
