  topStrengths:
    - >-
      Real category traction: nearly 6,000 customers, 100,000 users, and >120% net dollar retention show Filevine is
      more than a concept-stage AI wrapper.
    - >-
      Broad workflow ownership across matters, documents, billing, payments, and AI gives Filevine a stickier
      system-of-record position than point-solution legal AI vendors.
    - >-
      The 2025 $400M financing and support from Insight, Accel, Halo, Meritech, StepStone, Run Ventures, and Album
      provide ample capital and market validation.
    - >-
      Government-ready security and compliance work, including FedRAMP-related materials, expand the plausible customer
      set beyond plaintiff firms.
  topRisks:
    - >-
      The current ~$3B valuation implies a premium ARR multiple even on third-party revenue estimates, while public
      evidence on gross margin, burn, and cap-table terms remains thin.
    - >-
      Filevine handles privileged legal data inside increasingly agentic workflows, so any security, privacy, or
      reliability failure can create outsized customer and reputational damage.
    - >-
      Implementation complexity, partner dependence, and user complaints about hidden costs or service quality could
      erode renewals and expansion if not controlled.
    - >-
      Competition is widening from incumbent legal systems, vertical AI overlays, and general-purpose LLM workflows that
      can compress pricing and weaken differentiation.
  unresolvedGaps:
    - >-
      Audited financial statements, current gross margin, cash burn, and free-cash-flow profile are not publicly
      disclosed.
    - >-
      Liquidation preferences, secondary-market marks, and other cap-table terms are not public, limiting true
      entry-price analysis.
    - Customer concentration, cohort retention by segment, and realized AI attach rates are not publicly available.
    - Current board composition and governance details are only partially visible from public evidence.
