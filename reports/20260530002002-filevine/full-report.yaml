  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Privacy, and AI Governance Risk
        blocks:
          - type: paragraph
            body: >-
              Filevine now frames its product as an AI-native legal operating system for enterprises and government
              agencies rather than a narrow case-management tool. That positioning broadens regulatory exposure because
              the platform is handling privileged legal data, public-sector workflows, and increasingly autonomous
              AI-assisted actions. Filevine's own 2026 AI Trust Index says adoption is real but still conditional on
              accuracy, security, confidentiality, and integration, which means the company is selling into a market
              where trust failure can stop expansion even when feature demand is high.


              The legal/privacy stack is meaningful but not frictionless. Filevine's privacy policy and January 2026 DPA
              rely on SCC-style transfer mechanics, data-retention rights, and subprocessor governance for EEA, UK, and
              Swiss data. Its terms also say some services rely on third-party AI providers and that customers must
              independently fact-check outputs and decide when human review is necessary. That is a sensible legal
              disclaimer, but it also confirms Filevine cannot fully internalize model risk. The EU AI Act adds another
              moving layer because transparency obligations for generative AI are already live and some higher-risk uses
              face tighter controls.


              Mitigation exists, but scope matters. Filevine highlights SOC 2 Type II, HIPAA-aligned controls, CJIS
              alignment, and a FedRAMP Low authorization path. However, the FedRAMP announcement also says coverage is
              product-by-product and that Moderate remains a roadmap item, so compliance breadth across the full
              platform is still uneven. For diligence, the key question is not whether Filevine talks about security and
              privacy; it is which products, environments, and AI workflows are actually inside each audited boundary
              today.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
