      - number: '7.4'
        title: Financial, Valuation, and Execution Risk
        blocks:
          - type: paragraph
            body: >-
              The September 2025 $400 million all-equity raise is a strength in balance-sheet terms but a risk in
              underwriting terms. A round of that size raises the bar for growth durability, enterprise execution, and
              eventual margin proof. Filevine has not publicly disclosed the detailed financial statements investors
              would need to judge burn, gross margin, or payback, so outside observers are left with company-issued
              growth narratives and rough third-party pricing estimates. That opacity matters more now that the company
              is simultaneously selling a higher-stakes AI story, entering government-compliance markets, and
              integrating acquisitions.


              Pricing evidence suggests there is real room for customer pushback. itQlick's 2026 review estimates base
              pricing around $49-$87 per user per month but says onboarding, AI fields, advanced document management,
              integrations, and migration can push total cost much higher. Software Advice reviews reinforce that risk
              by describing implementation friction and separate automation tooling. For a product that competes in
              crowded legal operations categories, cost-of-ownership can become the decisive metric even when customers
              like the platform.


              Execution risk is also people-heavy. Filevine's own 2025 news flow shows rapid expansion into the Czech
              Republic with plans to hire dozens of engineers, while Ryan Anderson personally fronts the financing,
              acquisition, and FedRAMP narrative. That combination creates both upside and concentration risk: the
              company is scaling fast enough to need more engineering capacity, but the public execution story still
              runs heavily through a small leadership core. If growth slows, integration slips, or the CEO narrative
              loses credibility, the 2025 financing can flip from validation into valuation pressure.
            claimRefs:
              - CR028
              - CR029
