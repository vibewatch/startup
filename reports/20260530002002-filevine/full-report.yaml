    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing architecture
        blocks:
          - type: paragraph
            body: >-
              Filevine’s current public pricing posture is intentionally quote-led rather than transparent list-pricing
              SaaS. The official pricing page says all packages are custom built for each organization, while the
              subscription agreement makes clear that usage is governed by sales orders and that each Filevine license
              maps to one authorized user. That still leaves enough public evidence to identify the revenue stack.
              Filevine markets a core case-and-matter system, AI products under LOIS, billing and payments, analytics,
              deadline management, integrations, lead-intake products, depositions, and e-signatures. The Sacra profile
              adds an important monetization nuance: base subscriptions appear seat-based, but several AI packages are
              billed per project and some adjacent layers such as DataBridge and automation carry usage-style overages.
              The billing and payments pages reinforce that monetization is not limited to software seats; Filevine also
              sells transaction-enabling billing workflows, online payments, and adjacent administrative tooling.
              Independent reviews sharpen the same picture from the other side: Filevine is widely viewed as powerful
              but custom-quoted, with public estimates only approximating what customers really pay after onboarding,
              integrations, AI add-ons, and support choices. The financial takeaway is that Filevine’s model is
              recurring and expandable, but realized ASP and product-level mix remain private.
