        title: Milestones, scope expansion, and adverse signals
        blocks:
          - type: paragraph
            body: >-
              The milestone trail shows a company moving from litigation workflow software toward a broader
              legal-intelligence platform. Filevine's 2023 quarterly update highlighted AI launches such as DemandsAI,
              AI Fields, ImmigrationAI, and SidebarAI; 2025 then concentrated several strategic moves in rapid
              succession: the $400 million financing, the formal LOIS launch at LEX Summit, FedRAMP Marketplace entry,
              and growing government orientation. By early 2026, the Pincites acquisition extended the product into
              Word-native drafting and contract redlining, complementing the earlier Parrot acquisition and pushing
              Filevine beyond a pure litigation-case-management story. The adverse record is not empty, however. A 2025
              responsible-disclosure post documented a serious but apparently isolated non-production exposure involving
              nearly 100,000 confidential files tied to one law-firm environment, and BBB maintains a complaints page
              even though the retained page text does not expose specifics. Together, those signals do not overturn the
              growth story, but they do mean buyers should diligence security controls, implementation quality, and
              trust posture rather than assuming scale automatically implies operational smoothness.
