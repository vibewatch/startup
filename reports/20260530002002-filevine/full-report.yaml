      - number: '4.3'
        title: Cost structure and margin proxies
        blocks:
          - type: paragraph
            body: >-
              Public evidence suggests Filevine should be analyzed as a software business with meaningful service,
              implementation, and payment-processing complexity rather than as a pure seat-license tool. Filevine’s own
              2023 update disclosed a 72.5% blended gross margin and said research and development represented more than
              one third of employee headcount, implying a meaningful ongoing product-investment burden even before the
              2025 AI push. The partner ecosystem and pricing FAQ also show that onboarding and configuration are not
              lightweight; hundreds of implementations have been handled by certified partners, and independent reviews
              repeatedly describe costly setup, third-party automation work, and demanding onboarding. Public
              comparables support the idea that margins can stay attractive while still carrying services friction.
              Intapp’s March 2026 filing reported 76% gross margin, 123% cloud NRR, and explicit professional-services
              revenue and cost tied to implementation, upgrades, and migrations. CS Disco’s March 2026 filing showed a
              much more usage-heavy mix, with 91% of revenue usage-based and only 9% subscription, illustrating how
              legal-tech economics can move away from clean seat-SaaS visibility. For Filevine, that means the margin
              path is probably good enough to justify continued aggressive product investment, but public evidence does
              not reveal where blended margin now sits after AI, payments, onboarding, and support. Independent adverse
              reviews reinforce that services and support burden can materially affect realized customer economics.
