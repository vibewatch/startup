      - number: '8.2'
        title: Why Filevine earns a premium conversation
        blocks:
          - type: paragraph
            body: >-
              The company does earn a premium conversation. Filevines own materials now describe LOIS as an AI-native
              legal operating intelligence layer that spans data, documents, workflows, and teams rather than a point
              tool bolted onto case management. That positioning is supported by usage and monetization signals from the
              financing package: Halo Fund said AI revenue was growing about 130% year over year and that Filevines
              cross-platform AI chat tool was still compounding weekly usage. The product story also appears broader
              than a narrow plaintiff-firm workflow. Filevine markets LOIS to boutique firms, government agencies, and
              Fortune 500 enterprises, and its security materials point to SOC 2 Type II, HIPAA, CJIS, and
              FedRAMP-related work that can help enterprise and public-sector sales. In other words, the pro-thesis is
              not speculative category creation. Filevine has credible adoption, a widening product surface, and real
              compliance work. What is still missing is proof that those strengths convert into software-quality
              margins, repeatable enterprise expansion, and investor terms that leave room for a new buyer at the
              current mark.
            claimRefs:
