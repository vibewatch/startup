  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Filevine sits inside the legal-workflow software boundary rather than the whole legal-services or
              horizontal enterprise-software universe. The platform, LOIS, and practice-type pages show a matter-centric
              stack that connects intake, case or matter management, documents, billing, analytics, contracts, and AI
              assistance across the same record. That means included spend is software spend tied to moving legal work
              through a system of record. It does not include attorney labor, court fees, expert-witness spend, media
              buying for lead generation, or every adjacent category such as broad ERP, generic collaboration suites, or
              standalone e-discovery services. The relevant substitute is usually a fragmented stack: paper, email,
              spreadsheets, point practice tools, custom agency systems, and disconnected document repositories. For
              plaintiff firms the wedge is high-volume case throughput; for in-house it is contract and matter control;
              for government it is compliance-heavy caseload management. That boundary logic matters because broad
              legal-software estimates overstate what Filevine can realistically monetize without a workflow-centered
              deployment motion.
