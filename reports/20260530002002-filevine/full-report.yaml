        title: Capital adequacy and financing dependence
        blocks:
          - type: paragraph
            body: >-
              Filevine’s near-term financing risk looks lower than that of an early-stage legal-tech vendor because the
              company raised a very large equity round recently and paired it with sticky retention metrics. The latest
              official announcement says Filevine raised $400 million in all-equity financing across two rounds over 15
              months, with the money earmarked for AI products, product acceleration, hiring, go-to-market, and deeper
              enterprise and government penetration. Sacra further estimates that the 2025 package included a $260
              million Series E and a $140 million D-2 round, with lifetime primary equity of roughly $555 million and
              total funding shown at $626.1 million. Artificial Lawyer also notes a prior $108 million 2022 round,
              confirming that the company entered this financing cycle from an already well-capitalized base. That said,
              capital adequacy is only partially visible. No reviewed public source disclosed cash on hand, monthly
              burn, runway months, debt facilities, covenant packages, or even a clean statement that no debt exists.
              The practical read-through is that fresh equity likely reduced immediate financing dependence, but the
              underwriting case still lacks the treasury detail needed to test downside resilience, next-round timing,
