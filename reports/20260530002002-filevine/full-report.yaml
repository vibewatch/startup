            body: >-
              Filevine has outgrown its origin as a plaintiff-side case-management product, but the public evidence
              still shows a customer base anchored in litigation-heavy law firms. Sacra and Above the Law both point to
              plaintiff and broader litigation workflows as the center of gravity, while GetApp reviewer metadata shows
              that most visible usage still comes from law-practice organizations and legal case-management jobs. At the
              same time, the customer roster is no longer monolithic: current references span family law, immigration,
              public defense, a large state agency, and enterprise or corporate legal operators on the 2026 LEX Summit
              speaker list. The economic buyer varies by segment—managing partner, COO, practice manager, general
              counsel, or agency leadership—but the daily users are consistently attorneys, paralegals, intake staff,
              operations personnel, finance staff, and administrators. For government buyers, security and procurement
              channels matter more than for small firms; Carahsoft and the public-sector case studies make that
              explicit. The practical implication is that Filevine has real segment breadth, but the publicly nameable,
