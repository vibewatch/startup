  - id: FU001
    title: Filevine customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Shows how different customer segments discover, deploy, and expand inside Filevine, with different procurement
      triggers by segment.
    data:
      items:
        - label: Plaintiff / litigation firm
          stage: 'Segment: Plaintiff / litigation firm'
          entryPoint: Peer referral, legal-tech search, LEX Summit, demo process
          coreProducts: Core case management, docs, demands, depositions, billing
          expansionPath: Core -> AI drafting / chronologies -> deposition tools -> payments / analytics
          trigger: Handle more cases without proportional headcount
        - label: Defense litigation firm
          stage: 'Segment: Defense litigation firm'
          entryPoint: Competitive tool bake-off and customization evaluation
          coreProducts: Core, Docs+, Vinesign, Periscope, deposition tools, LOIS
          expansionPath: Configuration depth -> full-suite adoption
          trigger: Reduce administrative noise and improve case visibility
        - label: Family law firm
          stage: 'Segment: Family law firm'
          entryPoint: Operations and billing improvement search
          coreProducts: Billing, reporting, document generation, intake, payments
          expansionPath: Template build-out -> analytics -> practice-specific workflows
          trigger: Cut labor cost and improve realization
        - label: Immigration / high-volume specialist
          stage: 'Segment: Immigration specialist'
          entryPoint: Need for form automation and cross-department coordination
          coreProducts: Case management, document assembly, ImmigrationAI, reporting
          expansionPath: Immigration team -> multi-department adoption
          trigger: Scale filings and motions without adding staff at the same pace
        - label: Government / public sector
          stage: 'Segment: Government / public sector'
          entryPoint: Security, reporting, and procurement review
          coreProducts: Secure case management, OCR docs, mobile access, reporting
          expansionPath: Agency rollout -> more case types -> wider reporting dependence
          trigger: Need for compliance-ready workflow system and budget visibility
    approximationNotes: >-
      Journey stages are synthesized from customer stories, review data, and public-sector channel materials; Filevine
      does not publish a single official adoption flow by segment.
    claimRefs:
      - CU001
      - CU006
      - CU007
      - CU041
      - CU045
      - CU055
      - CU059
  - id: FU002
    title: Adoption and expansion flow
    type: flow
    layout: wide
    summary: >-
      Maps the path from vendor evaluation to core deployment, data concentration, AI/module expansion, and public
      advocacy.
    data:
      nodes:
        - id: evaluate
          label: Evaluate vendors
          detail: >-
            Prospects often run a consultative selection process; Saalfield Shad demoed more than a dozen alternatives
            before choosing Filevine for customization.
          tone: neutral
        - id: deploy-core
          label: Deploy core system
          detail: >-
            Firms centralize case records, documents, tasks, calendars, billing, and communications in one system of
            record.
          tone: positive
        - id: configure
          label: Configure workflows
          detail: >-
            Templates, deadline chains, role-based tasks, document assembly, and reporting are customized to the
            practice.
          tone: neutral
        - id: expand
          label: Expand into modules and AI
          detail: >-
            Named accounts adopt DemandsAI, Docs+, ImmigrationAI, deposition tools, or broader LOIS workflows as
            confidence grows.
          tone: positive
        - id: advocate
          label: Become public advocate
          detail: A subset of customers appears in case studies, awards, webinars, or LEX Summit speaking slots.
          tone: positive
        - id: upmarket
          label: Move into enterprise and government
          detail: >-
            Government channels, agency stories, and in-house legal ops speakers show some upmarket motion, but public
            density still trails law-firm references.
          tone: warning
      edges:
        - from: evaluate
          to: deploy-core
        - from: deploy-core
          to: configure
        - from: configure
          to: expand
        - from: expand
          to: advocate
        - from: expand
          to: upmarket
    approximationNotes: >-
      The flow describes a common deployment pattern drawn from public customer stories and reviews rather than a
      disclosed conversion funnel with stage-by-stage percentages.
