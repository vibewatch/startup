          - type: paragraph
            body: >-
              Filevine's capital formation is better documented than its private-company economics. The 2022 company
              blog clearly disclosed a $108 million round from StepStone, Golub, Signal Peak, and Meritech. The 2025
              financing story is even stronger: official company announcements, PR Newswire, and independent coverage
              all support $400 million of all-equity financing across two rounds over roughly 15 months, led first by
              Insight and then by Accel and Halo alongside Insight, with Meritech, Stepstone, Run Ventures, and Album
              participating. LawNext adds a plausible internal split of roughly $150 million and $260 million. Public
              scale signals are similarly strong on breadth: retained 2025-2026 sources converge around nearly 6,000
              customers and 100,000 legal professionals, with best-in-class retention and heavy document throughput.
              What is not equally strong is valuation or current economics. One market-data source lists a $3 billion
              valuation and another estimates 2025 ARR at $205 million, but retained primary financing documents do not
              disclose valuation or audited revenue. Those figures are usable as directional context, not as hard fact
              without diligence follow-up.
