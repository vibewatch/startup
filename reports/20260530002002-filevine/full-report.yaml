      - number: '3.4'
        title: Switching cost, lock-in, multi-homing, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Filevine’s defensibility is strongest where data gravity and workflow ownership reinforce each other. Once
              intake, documents, communications, billing, payments, templates, and timelines all live inside one
              operating surface, replacing the system creates retraining cost, migration effort, and operational risk.
              That is why full-stack products remain sticky even when AI point solutions appear faster in a single
              workflow. Litify’s Salesforce configuration depth shows the far end of this lock-in spectrum, while Clio
              and MyCase show how pricing transparency can coexist with real retention surfaces in payments, accounting,
              portals, and app ecosystems.


              The problem is that lock-in is no longer absolute. Bloomberg’s skepticism toward generic tools is helpful
              background, but the more important risk is specialization. EvenUp and Supio can wedge themselves into
              high-value plaintiff workflows without owning the rest of the matter. Harvey can win enterprise legal AI
              budgets without becoming the billing or case ledger. As AI drafting, summarization, review, and workflow
              suggestions spread across Filevine, Clio, Litify, EvenUp, Supio, and Harvey, the AI layer itself looks
              increasingly commoditized. That pushes Filevine back toward a harder question: can it protect the
              system-of-record position and monetization surface faster than adjacent vendors peel off high-margin AI
              use cases? The likely answer is mixed. Multi-homing should rise first, especially in personal injury and
              litigation. Displacement will follow only if buyers conclude that a lighter core plus best-of-breed
              overlays beats one consolidated platform on cost, trust, and results.
