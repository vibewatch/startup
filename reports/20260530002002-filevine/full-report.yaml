  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct practice-management peers
        blocks:
          - type: paragraph
            body: >-
              Filevine’s direct competition still comes from other systems-of-record vendors, not from pure AI
              assistants. Clio and MyCase compete most directly for firms that want one product to run intake, matters,
              documents, billing, payments, and client communication. Clio adds the broadest public app ecosystem and
              the clearest self-serve ladder: transparent starting pricing, add-on products, and 250+ integrations make
              it easy for a solo or small firm to compare Clio against spreadsheets and then expand into accounting,
              payments, document automation, and AI. MyCase is similarly strong in SMB and lower-mid-market motions
              because it publishes seat pricing, wraps LawPay and accounting into the product story, and claims 18,000+
              firms already use the stack. In both cases, transparent pricing and clear package boundaries reduce sales
              friction in a way Filevine’s demo-led packaging does not.


              Litify is the direct peer on the opposite end of the market. Its Salesforce foundation, no-code
              automation, and services-heavy deployment model point it toward larger firms and legal departments that
              accept implementation work in exchange for configurability. That creates a meaningful segment split:
              Filevine competes as a unified legal-work platform, Clio and MyCase compete as broadly packaged
              practice-management suites, and Litify competes as an enterprise legal operations platform that can go
              deeper on workflow tailoring. The result is a crowded core market where Filevine does not enjoy a single
              obvious direct-comparable gap; instead it wins only when buyers prefer one connected legal-work surface
              over Clio’s distribution machine, MyCase’s transparent SMB bundle, or Litify’s Salesforce-centric
              enterprise lock-in.
