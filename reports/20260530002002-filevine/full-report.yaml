  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: Decision chain linking Filevines real operating proof to the current research-more recommendation at the $3B mark.
    data:
      nodes:
        - id: traction
          label: Real traction
          detail: Scale, retention, and AI usage are credible.
        - id: breadth
          label: Broader platform
          detail: LOIS and compliance work expand the addressable story.
        - id: price
          label: $3B anchor
          detail: Implies about 14.6x ARR on the best public estimate.
        - id: opacity
          label: Economic opacity
          detail: Margins, mix, preferences, and secondaries stay private.
        - id: support
          label: Incomplete valuation support
          detail: Public comps and private medians do not clearly clear the mark.
        - id: decision
          label: 'Recommendation: research-more'
          detail: Wait for diligence proof or a lower entry price.
