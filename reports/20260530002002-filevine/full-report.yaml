      - number: '3.3'
        title: Pricing, distribution, and trust differences
        blocks:
          - type: paragraph
            body: >-
              Pricing transparency is one of the clearest go-to-market separators in this landscape. Clio and MyCase
              publish seat-based entry points that help budget-conscious buyers compare tools quickly and move from
              manual workflows without a long enterprise sales cycle. Filevine’s reviewed pages do not show public
              pricing; instead they push buyers toward demos and platform-level positioning. Litify, EvenUp, Supio, and
              Harvey also rely on consultative or custom pricing in public materials, which fits enterprise or
              high-value specialist sales but sacrifices the conversion benefits of public list pricing. That difference
              matters because legal software decisions often start with office managers or small-firm partners trying to
              replace spreadsheets, email, or generic project tools. Transparent pricing helps Clio and MyCase win those
              first conversations.


              Distribution power is also uneven. Clio’s app ecosystem and product menu create broad top-of-funnel reach;
              MyCase’s 18,000+ firm claim implies an already-large SMB installed base; Litify compounds lock-in through
              Salesforce plus implementation and customer-success services; Harvey leverages elite-firm adoption and
              capital strength. Filevine’s answer is breadth and workflow consolidation, but the platform still has to
              overcome lower public price clarity than Clio and MyCase and less obvious enterprise channel leverage than
              Litify or Harvey. Trust posture narrows some of that gap. Filevine, Clio, Supio, and Harvey all foreground
              security and compliance, which suggests buyers now expect AI and workflow vendors alike to prove privacy,
              auditability, and data-boundary controls before any feature discussion can close the deal.
