          - type: paragraph
            body: >-
              Ryan Anderson is the clear public anchor. Retained 2025-2026 materials consistently identify him as
              co-founder and CEO, and outside coverage ties his credibility to direct legal-practice experience rather
              than a generic software pedigree. Utah Business adds the cleanest retained founder roster, naming Nathan
              Morris and the late Jim Blake alongside Anderson and fixing the founding year at 2014. Filevine's own
              about page and 2022 funding essay reinforce the origin logic: the company was built because its founders
              were practicing lawyers who could not find software that fit how legal work actually gets done. The
              broader leadership bench is less transparent. Filevine publicly disclosed the addition of Scott Brown as
              CTO and Ian Charles as CFO in 2022, and later coverage highlights an operating-model pivot away from
              internal implementations toward a partner ecosystem, but retained public sources still do not expose a
              clean current board roster, ownership map, or investor-control framework. That makes governance opacity a
              real diligence gap, not a cosmetic caveat.
