    data:
      items:
        - label: Bear repricing band
          low: 1100
          high: 1700
          unit: USD M
          detail: Growth cools and the multiple compresses toward public workflow norms.
        - label: Base underwriting band
          low: 1800
          high: 2400
          unit: USD M
