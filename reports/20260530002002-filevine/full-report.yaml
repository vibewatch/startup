      - number: '7.5'
        title: Mitigations, Monitoring, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Filevine is not entering this risk set defenseless. Public materials show real mitigations: SOC
              2/HIPAA-style control language, a January 2026 DPA, a FedRAMP authorization foothold, an explicit status
              page, and evidence that the company handled at least one serious disclosure with speed and transparency.
              Those are meaningful positives because they show management is not ignoring privacy, security, or
              compliance. The problem is that most of the public mitigations are boundary-setting statements rather than
              quantitative operating proof. Investors still lack public RTO/RPO data, full subprocessor concentration,
              detailed gross-margin disclosure, and a complete litigation schedule.


              As a result, the right way to underwrite Filevine is with monitorable triggers rather than static labels.
              Thesis breaks if privileged-data incidents recur after the 2025 disclosure, if outage cadence remains
              elevated and starts hitting authentication or core matter workflows, if the FedRAMP/enterprise compliance
              story stalls at narrow product scope, or if pricing complaints force discounting just as competitors
              normalize AI features. The company can probably absorb one of those issues in isolation; it is the
              combination of reliability noise, AI-governance scrutiny, and packaging friction that would compress
              renewal confidence and valuation support at the same time.


              Diligence should therefore focus on hard evidence that converts narrative into control: current
              subprocessor lists, provider concentration by spend and workflow, penetration-test summaries, renewal
              cohorts by product line, enterprise/government expansion economics, and documented incident postmortems.
              If Filevine can produce those, much of the current risk looks manageable. If it cannot, the investment
              case remains highly dependent on management claims rather than auditable proof.
            claimRefs:
              - CR011
              - CR014
              - CR017
              - CR024
