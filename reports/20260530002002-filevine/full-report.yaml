    document management, billing and payments, analytics, e-signature, and a growing LOIS AI
    layer. Public product evidence supports real API and integration surfaces, partner-assisted
    implementation, and security/compliance investments, but some deeper architecture and roadmap
    claims remain marketing-led rather than fully transparent.
  customerFocus: |
    Filevine's base remains strongest in plaintiff and litigation-heavy law firms, but public
    references also show deployments in family law, immigration, public-sector legal teams,
    public defenders, and larger enterprise legal environments.
  businessModel: |
