        title: Public traction, retention, and GTM motion
        blocks:
          - type: paragraph
            body: >-
              The strongest public quality signals sit in Filevine’s scale and expansion metrics. The September 2025
              funding announcement, corroborated by independent coverage, says Filevine serves nearly 6,000 customers
              and 100,000 legal professionals and processes more than 20 million document pages per day. The same
              announcement cites gross retention above 96% for Filevine Core and net dollar retention above 120%, while
              the 2023 operating update reported over 50% ending-ARR growth, 72.5% blended gross margin, 142% NDRR, and
              churn below 5%. Those are unusually strong public software-quality signals for a private legal-tech
              company. GTM also appears to be broadening. Management says the latest financing will deepen enterprise
              and government penetration, and both Sacra and Carahsoft show Filevine being positioned beyond
              plaintiff-firm roots into enterprise legal departments, prosecutors, public defenders, agencies, and other
              complex organizations. The partner program matters here: implementation partners, consultants, and channel
              partners reduce deployment friction and support larger, more customized accounts. Customer proof supports
              the enterprise thesis directionally. Case studies show heavier workflow usage, more cases per team, and
              meaningful admin-time savings once firms centralize work in Filevine. What remains private is the precise
              conversion from customer growth and retention into recognized revenue, segment ACV, or sales efficiency by
