      - number: '3.2'
        title: AI substitutes, complements, and workflow overlays
        blocks:
          - type: paragraph
            body: >-
              EvenUp, Supio, and Harvey change the competitive frame because they do not need to replace Filevine to
              capture budget. EvenUp and Supio are personal-injury and plaintiff-law overlays that promise faster
              demands, chronologies, intake review, negotiation support, and case analysis on top of a firm’s existing
              case-management system. Their own messaging makes the complement dynamic explicit: both emphasize
              extracting from, connecting to, or working alongside the firm’s current CMS. That means they threaten
              Filevine most in the premium AI workflow layer, not in the core billing or matter ledger. EvenUp’s proof
              points are concentrated in plaintiff outcomes and settlement acceleration, while Supio leans on
              document-heavy plaintiff workflows and security controls to make adoption acceptable inside sensitive
              practices.


              Harvey is a different substitute. It is not plaintiff-specific, and it is not a practice-management suite.
              Instead it is an enterprise legal AI budget magnet. CNBC and TechCrunch show that Harvey has reached
              unusual scale for a vertical software vendor: a multibillion-dollar valuation, reported nine-figure ARR,
              and adoption by many top AmLaw firms. That does not make Harvey a direct replacement for Filevine’s
              workflow foundation, but it does make Harvey a credible competitor for the discretionary AI layer of spend
              inside sophisticated legal organizations. In practice, this produces a multi-homing market. A firm can
              keep Filevine, Clio, or MyCase as the system of record while buying EvenUp or Supio for plaintiff workflow
              acceleration and Harvey for broader drafting, review, or enterprise AI use cases. For Filevine, that means
              adjacent AI vendors are complements tactically but substitutes strategically because they weaken the share
              of wallet controlled by the core platform.
