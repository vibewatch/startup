      - number: '4.5'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a constructive but incomplete financial verdict. Filevine appears to have genuine
              revenue quality: the core model is subscription-based, the company publicly cites best-in-class retention,
              independent analysis points to roughly $205 million of ARR in 2025, and customer proofs show real workflow
              embedment that should reinforce expansion. The monetization stack is also broadening in economically
              sensible ways through AI, billing, payments, analytics, and implementation/channel leverage. Against that,
              the company’s disclosure profile is still far too thin for a clean underwriting model. There is no public
              bridge from logos to recognized revenue, no realized ASP or discount waterfall, no cohort retention by
              segment, no CAC or payback disclosure, no cash or burn data, and no visibility into debt or covenant
              exposure. Adverse review evidence also shows that onboarding, support, and add-on pricing can create
              hidden customer-acquisition and servicing friction. The right financial conclusion is therefore balanced:
              Filevine likely has the scale, retention, and capital base to keep compounding, but a price-sensitive
              investor still needs management-package data before underwriting margin durability, normalized
              free-cash-flow potential, or financing independence with high confidence.
