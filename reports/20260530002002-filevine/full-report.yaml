      - number: '6.4'
        title: Retention and durability
        blocks:
          - type: paragraph
            body: >-
              The strongest public durability signal around Filevine is the retention stack disclosed around the
              September 2025 financing. Filevine and LawNext both cite gross retention above 96% for Filevine Core and
              net dollar retention above 120%, while Sacra independently repeats the >120% NDR framing. Historical
              disclosures are even stronger on expansion: Q2 2023 reported NDR above 140% and available-to-renew churn
              below 5%, and Q3 2023 reported 142.6% NDR plus more license and ancillary-product spend from existing
              customers. That pattern lines up with the named customer stories, where firms expand from core case
              management into DemandsAI, document assembly, reporting, Docs+, deposition tools, and broader AI
              workflows. Independent review sites broadly support the idea that users find value in the
              platform—Software Advice and TrustRadius scores are solid—but they do not validate renewal economics
              directly. The key gap is segmentation: public materials do not show contract length, renewal timing, gross
              churn by customer band, or whether SMB cohorts behave materially worse than enterprise or public-sector
              cohorts. So the retention story is strong but still materially management-shaped.
