      - number: '7.2'
        title: Product, Security, and Reliability Risk
        blocks:
          - type: paragraph
            body: >-
              Filevine's operating risk is no longer hypothetical. A December 2025 security disclosure described a
              non-production law-firm environment connected to Filevine where a live Box admin token exposed nearly
              100,000 confidential files. The researcher also said Filevine responded professionally and patched the
              issue, which is a positive governance signal, but the episode still shows how quickly privileged data can
              become a trust-breaking event when AI or document workflows are misconfigured. In legal software, the
              reputational cost of even one contained exposure can exceed the direct technical blast radius because
              customers are outsourcing sensitive work product, medical records, and court-protected materials.


              Reliability evidence is similarly mixed. Filevine's own support article instructs users to watch a status
              page for degraded performance and incidents, while IsDown says it has tracked 95 incidents since June 2023
              and specifically logged a 2024 Azure outage impacting Lead Docket plus a May 2026 2FA access problem.
              Those trackers are imperfect, but they are directionally important because they show repeated operational
              events touching access, ancillary products, and customer confidence. The security page advertises
              encryption and business-continuity capabilities, yet public materials do not disclose concrete RTO/RPO
              metrics or resilience test outcomes.


              Implementation risk also matters because Filevine is not a light-touch product. Software Advice review
              material describes migrations requiring upfront payments, data backups, repeated upload changes, and long
              project timelines; another review says advanced automation often pushes customers toward Workato, a
              separate complex system. That combination creates a credible failure mode where technical ambition
              outpaces deployment quality, leading to slower time-to-value, higher services burden, and renewal drag.
            claimRefs:
