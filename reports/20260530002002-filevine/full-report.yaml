        title: Constrained sizing shows a large shell but no clean SAM or SOM
        blocks:
          - type: paragraph
            body: >-
              The strongest public sizing approach for Filevine is a constrained shell, not a single headline TAM.
              Official workforce data show a large U.S. legal user base, with the ABA counting more than 1.3 million
              active lawyers and BLS counting 864,800 lawyer jobs. Those figures support breadth, but not a
              Filevine-ready software denominator, because they do not reveal office count, practice mix, budget
              authority, or case-management penetration by buyer type. Analyst estimates widen the uncertainty further.
              Business Research Insights pegs the 2026 legal practice management market at $3.15 billion, while Coherent
              puts 2026 legal case management at $9.8 billion. ResearchAndMarkets expands the category definition to
              include government agencies, law firms, and solo practitioners across billing, CRM, calendaring, document
              management, and task workflows. The contradiction is informative rather than fatal: it shows
              Filevine-adjacent demand is real, but category labels move the apparent ceiling by more than 3x. Public
              evidence is therefore sufficient for a bounded market shell and contradictory estimate range, but
              insufficient for a defendable plaintiff-versus-government-versus-in-house SAM or SOM.
