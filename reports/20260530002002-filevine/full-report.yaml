      - number: '8.3'
        title: Valuation bridge and comparables
        blocks:
          - type: paragraph
            body: >-
              The cleanest valuation bridge is a hybrid of public workflow software and private legal-AI leaders. On
              current public market snapshots, Thomson Reuters, Procore, AppFolio, Guidewire, and Veeva trade between
              4.94x and 9.61x TTM price-to-sales, with a selected median of roughly 5.72x. Private software M&A
              benchmarks are also disciplined: Aventis puts the H2 2025 median at 3.1x EV/revenue and describes 2026 as
              a stable, not fully re-rated, market. Against that frame, Filevines implied 14.6x ARR multiple is hard to
              defend on current public evidence alone. The counterargument is that pure legal-AI leaders command far
              more extreme marks: Harveys March 2026 financing implied nearly 58x ARR and Legoras April 2026 round
              implied about 56x. Those examples matter because they show the market will pay enormous premiums for
              AI-first legal platforms. They are also a warning, because they are concentrated in a tiny set of leaders
              and sit inside a market where exits remain weak and disclosed prices scarce. Filevine therefore screens as
              too expensive for a workflow comp, but not obviously expensive enough to match the most exuberant
              AI-leader prints either.
