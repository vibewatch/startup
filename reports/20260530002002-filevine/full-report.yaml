  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              Filevine is no longer a question of product-market fit; it is a question of price discipline. Public
              evidence supports a real company: the 2025 financing brought in $400 million of all-equity capital, the
              platform reported nearly 6,000 customers and 100,000 legal professionals, and management paired that scale
              with over 96% gross retention and net dollar retention above 120%. Those are serious operating signals.
              The underwriting problem is that the current financing anchor is already demanding. Tracxn and SuperbCrew
              both place Filevine at roughly $3 billion, and Sacras 2025 ARR estimate of $205 million implies an entry
              multiple of about 14.6x. That is materially above the selected public workflow-software bridge and still
              comes with missing information on margins, revenue mix, cash generation, preferences, and secondary-market
              clearing prices. The evidence-backed call is therefore RESEARCH-MORE, with high risk and an expensive
              valuation stance. At todays mark, new money is being asked to pay for an AI-premium future before the
              public record proves that the economics, governance, and exit path deserve it.
            claimRefs:
