            body: >-
              The retained primary sources make Filevine's category shift unusually visible. The homepage and LOIS
              materials no longer pitch a generic practice-management tool; they frame Filevine as legal AI and legal
              operating intelligence for complex legal work. That framing is credible because the product surface is
              broad even before the AI layer is added. Filevine's own product pages show one platform spanning case
              management, document assembly, document management, billing, payments, analytics, and government-grade
              workflows, while the LOIS page explains how those underlying records are used to generate grounded
              answers, drafts, and workflow actions. Headquarters are easier to verify than economics: the contact page
              gives a Salt Lake City headquarters and four additional office locations, while the 2025 funding
              announcement adds a global-office descriptor. Scale is directionally strong but not perfectly synchronized
              across official surfaces. The about page mixes newer scale tiles with older narrative copy, so customer
              and workforce counts need date labels rather than blind averaging.
