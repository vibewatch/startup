schemaVersion: report-v2
artifact: financials
slug: filevine
runDate: '2026-05-30'
company:
  name: Filevine
chapter:
  number: 4
  title: Financials
  summary: >-
    Filevine’s public financial picture now points to a quote-led legal-work SaaS platform with strong retention,
    AI-led expansion, and fresh capital: official 2025 materials cite nearly 6,000 customers, 100,000 legal
    professionals, more than 20 million pages uploaded daily, gross retention above 96%, net dollar retention above
    120%, and $400 million of new equity. Public sources also show monetization beyond core seats through AI,
    billing, payments, analytics, and partner-assisted implementations, but exact ARR, realized pricing, revenue
    mix, cash, burn, runway, and debt terms remain too private for a complete underwrite.
sections:
  - id: revenue-model-and-pricing
    title: Revenue model and pricing architecture
    body: >-
      Filevine’s current public pricing posture is intentionally quote-led rather than transparent list-pricing SaaS.
      The official pricing page says all packages are custom built for each organization, while the subscription
      agreement makes clear that usage is governed by sales orders and that each Filevine license maps to one
      authorized user. That still leaves enough public evidence to identify the revenue stack. Filevine markets a core
      case-and-matter system, AI products under LOIS, billing and payments, analytics, deadline management,
      integrations, lead-intake products, depositions, and e-signatures. The Sacra profile adds an important
      monetization nuance: base subscriptions appear seat-based, but several AI packages are billed per project and
      some adjacent layers such as DataBridge and automation carry usage-style overages. The billing and payments
      pages reinforce that monetization is not limited to software seats; Filevine also sells transaction-enabling
      billing workflows, online payments, and adjacent administrative tooling. Independent reviews sharpen the same
      picture from the other side: Filevine is widely viewed as powerful but custom-quoted, with public estimates only
      approximating what customers really pay after onboarding, integrations, AI add-ons, and support choices. The
      financial takeaway is that Filevine’s model is recurring and expandable, but realized ASP and product-level mix
      remain private.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007, CI030, CI031, CI039, CI040, CI042]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-retention-and-gtm
    title: Public traction, retention, and GTM motion
    body: >-
      The strongest public quality signals sit in Filevine’s scale and expansion metrics. The September 2025 funding
      announcement, corroborated by independent coverage, says Filevine serves nearly 6,000 customers and 100,000
      legal professionals and processes more than 20 million document pages per day. The same announcement cites
      gross retention above 96% for Filevine Core and net dollar retention above 120%, while the 2023 operating
      update reported over 50% ending-ARR growth, 72.5% blended gross margin, 142% NDRR, and churn below 5%.
      Those are unusually strong public software-quality signals for a private legal-tech company. GTM also appears to
      be broadening. Management says the latest financing will deepen enterprise and government penetration, and both
      Sacra and Carahsoft show Filevine being positioned beyond plaintiff-firm roots into enterprise legal departments,
      prosecutors, public defenders, agencies, and other complex organizations. The partner program matters here:
      implementation partners, consultants, and channel partners reduce deployment friction and support larger,
      more customized accounts. Customer proof supports the enterprise thesis directionally. Case studies show heavier
      workflow usage, more cases per team, and meaningful admin-time savings once firms centralize work in Filevine.
      What remains private is the precise conversion from customer growth and retention into recognized revenue,
      segment ACV, or sales efficiency by cohort.
    claimRefs: [CI008, CI009, CI010, CI011, CI012, CI013, CI014, CI015, CI016, CI018, CI019, CI023, CI024, CI025, CI026, CI027, CI028, CI029, CI043]
    tableRefs: [TI003]
    figureRefs: [FI002]
  - id: cost-structure-and-margin-proxies
    title: Cost structure and margin proxies
    body: >-
      Public evidence suggests Filevine should be analyzed as a software business with meaningful service,
      implementation, and payment-processing complexity rather than as a pure seat-license tool. Filevine’s own 2023
      update disclosed a 72.5% blended gross margin and said research and development represented more than one third
      of employee headcount, implying a meaningful ongoing product-investment burden even before the 2025 AI push.
      The partner ecosystem and pricing FAQ also show that onboarding and configuration are not lightweight; hundreds
      of implementations have been handled by certified partners, and independent reviews repeatedly describe costly
      setup, third-party automation work, and demanding onboarding. Public comparables support the idea that margins
      can stay attractive while still carrying services friction. Intapp’s March 2026 filing reported 76% gross margin,
      123% cloud NRR, and explicit professional-services revenue and cost tied to implementation, upgrades, and
      migrations. CS Disco’s March 2026 filing showed a much more usage-heavy mix, with 91% of revenue usage-based and
      only 9% subscription, illustrating how legal-tech economics can move away from clean seat-SaaS visibility. For
      Filevine, that means the margin path is probably good enough to justify continued aggressive product investment,
      but public evidence does not reveal where blended margin now sits after AI, payments, onboarding, and support.
      Independent adverse reviews reinforce that services and support burden can materially affect realized customer
      economics.
    claimRefs: [CI005, CI006, CI015, CI016, CI017, CI023, CI025, CI032, CI033, CI035, CI036, CI037, CI040, CI042]
    figureRefs: [FI003]
  - id: capital-adequacy-and-financing-dependence
    title: Capital adequacy and financing dependence
    body: >-
      Filevine’s near-term financing risk looks lower than that of an early-stage legal-tech vendor because the company
      raised a very large equity round recently and paired it with sticky retention metrics. The latest official
      announcement says Filevine raised $400 million in all-equity financing across two rounds over 15 months, with the
      money earmarked for AI products, product acceleration, hiring, go-to-market, and deeper enterprise and government
      penetration. Sacra further estimates that the 2025 package included a $260 million Series E and a $140 million
      D-2 round, with lifetime primary equity of roughly $555 million and total funding shown at $626.1 million.
      Artificial Lawyer also notes a prior $108 million 2022 round, confirming that the company entered this financing
      cycle from an already well-capitalized base. That said, capital adequacy is only partially visible. No reviewed
      public source disclosed cash on hand, monthly burn, runway months, debt facilities, covenant packages, or even a
      clean statement that no debt exists. The practical read-through is that fresh equity likely reduced immediate
      financing dependence, but the underwriting case still lacks the treasury detail needed to test downside resilience,
      next-round timing, or how much of current growth is being bought with elevated spending.
    claimRefs: [CI008, CI009, CI010, CI020, CI021, CI022, CI038, CI043]
    tableRefs: [TI004]
    figureRefs: [FI004]
  - id: financial-verdict-and-diligence-blockers
    title: Financial verdict and diligence blockers
    body: >-
      Public evidence supports a constructive but incomplete financial verdict. Filevine appears to have genuine revenue
      quality: the core model is subscription-based, the company publicly cites best-in-class retention, independent
      analysis points to roughly $205 million of ARR in 2025, and customer proofs show real workflow embedment that
      should reinforce expansion. The monetization stack is also broadening in economically sensible ways through AI,
      billing, payments, analytics, and implementation/channel leverage. Against that, the company’s disclosure profile
      is still far too thin for a clean underwriting model. There is no public bridge from logos to recognized revenue,
      no realized ASP or discount waterfall, no cohort retention by segment, no CAC or payback disclosure, no cash or
      burn data, and no visibility into debt or covenant exposure. Adverse review evidence also shows that onboarding,
      support, and add-on pricing can create hidden customer-acquisition and servicing friction. The right financial
      conclusion is therefore balanced: Filevine likely has the scale, retention, and capital base to keep compounding,
      but a price-sensitive investor still needs management-package data before underwriting margin durability,
      normalized free-cash-flow potential, or financing independence with high confidence.
    claimRefs: [CI011, CI013, CI018, CI030, CI031, CI032, CI033, CI034, CI038, CI039, CI040]
    tableRefs: [TI005]
