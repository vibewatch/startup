  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: revenue-mix
      missingEvidence: Exact current revenue mix across core seat subscriptions, AI products, billing and payments, analytics, implementation, and partner-mediated services, plus realized ASP and discount waterfalls by segment.
      whyItMatters: Without stream-level mix and realized pricing, investors cannot judge gross-margin durability, expansion quality, or how much growth comes from high-quality recurring software versus lower-margin services and payment activity.
      diligencePath: Request a 2024-2026 revenue bridge by product family with ARR, recognized revenue, ASP, discounting, and gross margin by stream.
      relatedQuestionRefs: [QI024]
      relatedTableRefs: [TI001, TI002, TI005]
    - type: private-evidence-only
      severity: material
      topic: sales-efficiency
      missingEvidence: Current CAC, payback, funnel conversion, quota productivity, and sales and marketing spend segmented by SMB, mid-market, enterprise, government, and AI-attached cohorts.
      whyItMatters: Filevine is explicitly moving upmarket into enterprise and government, but no public data shows whether the new growth motion remains capital efficient as contract size and implementation demands rise.
      diligencePath: Request a board-ready GTM dashboard with CAC, payback, pipeline stages, win rates, and expansion by segment for the last eight quarters.
      relatedQuestionRefs: [QI025]
      relatedTableRefs: [TI003, TI005]
    - type: private-evidence-only
      severity: blocking
      topic: cash-runway
      missingEvidence: Current unrestricted cash, restricted cash, monthly burn, hiring-adjusted burn, and runway scenarios after the 2025 financing.
      whyItMatters: The latest raise lowers obvious financing stress, but cash and burn determine whether the company is truly self-funding growth or simply better capitalized on the path to another round.
      diligencePath: Request monthly treasury reports, cash-flow statements, and a 12-24 month runway model under base and downside cases.
      relatedTableRefs: [TI003, TI004, TI005]
    - type: private-evidence-only
      severity: material
      topic: debt-obligations
      missingEvidence: Any debt facilities, covenant packages, minimum-liquidity terms, security interests, or vendor financing obligations, or an explicit management representation that none exist.
      whyItMatters: Hidden leverage could materially change equity downside, flexibility, and the practical effect of the 2025 equity financing.
      diligencePath: Request the complete debt schedule, signed credit agreements, covenant calculations, and legal confirmation of any off-balance-sheet commitments.
      relatedTableRefs: [TI004, TI005]
    - type: private-evidence-only
      severity: material
      topic: retention-cohorts
      missingEvidence: Cohort GRR, NRR, logo churn, and gross churn by firm size, product attach, practice area, and enterprise versus government versus law-firm cohorts.
      whyItMatters: High company-level retention can still mask weak low-end cohorts, expensive enterprise churn, or uneven economics in newer AI or payments modules.
      diligencePath: Request cohort retention tables segmented by product, contract size, and sales motion for the last eight quarters.
      relatedTableRefs: [TI003, TI005]
    - type: stale
      severity: material
      topic: margin-disclosure
      missingEvidence: Updated 2025-2026 gross-margin disclosure and cost-of-revenue detail for Filevine itself beyond the historical 2023 operating snapshot.
      whyItMatters: The AI and payments push could have improved or compressed margins materially since 2023, and public comparables cannot replace company-specific current data.
      diligencePath: Request recent management P&L detail with software, AI, payments, and services gross margin plus hosting, support, and implementation cost components.
      relatedTableRefs: [TI003, TI005]
