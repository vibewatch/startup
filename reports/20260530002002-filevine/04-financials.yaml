        - id: lead
          label: Quote-led account sale
          detail: Pricing is customized by organization and sold via tailored plans and sales orders.
        - id: core-seats
          label: Core per-user subscription
          detail: Base access is licensed per authorized user under the subscription agreement.
        - id: ai-layer
          label: LOIS and AI project activation
          detail: AI monetization expands beyond seats through per-project tiers and usage-linked activity.
        - id: billing-payments
          label: Billing and payment workflows
          detail: Timekeeping, invoicing, collections, and payment rails deepen monetization inside the same matter flow.
        - id: adjacent-modules
          label: Analytics, deadlines, leads, docs, and depositions
          detail: Additional modules increase account value as more of the workflow moves into Filevine.
        - id: recurring-revenue
          label: Recurring and expanding revenue base
          detail: Retention and expansion convert adoption into durable recurring revenue.
      edges:
        - from: lead
          to: core-seats
          label: Contract and onboard
        - from: core-seats
          to: ai-layer
          label: Activate AI
        - from: core-seats
          to: billing-payments
          label: Bill and collect in-platform
        - from: core-seats
          to: adjacent-modules
          label: Add workflows
        - from: ai-layer
          to: recurring-revenue
          label: Higher ARPU
        - from: billing-payments
          to: recurring-revenue
          label: More monetized workflows
        - from: adjacent-modules
          to: recurring-revenue
          label: Cross-sell and stickiness
    approximationNotes: This bridge is mechanistic and source-backed, not a company-disclosed revenue-recognition waterfall.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007, CI040]
