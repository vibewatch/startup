    data:
      nodes:
        - id: scale
          label: Nearly 6,000 customers / 100,000 professionals
          detail: Public 2025 customer scale anchor.
        - id: retention
          label: '>96% GRR and >120% NDR'
          detail: Official retention metrics imply durable installed-base economics.
        - id: ai-growth
          label: 130% YoY AI revenue growth
          detail: AI appears to be a major expansion driver on top of the core platform.
        - id: customer-roi
          label: Customer workflow savings and case-growth proof
          detail: Case studies show more cases handled and less unbillable admin time.
        - id: hidden-friction
          label: Implementation and support burden
          detail: Reviews point to hidden fees, outside consultants, and uneven support.
        - id: blocked-underwrite
          label: CAC, ASP, and mix still private
          detail: Public proxies are good, but full unit economics remain undisclosed.
      edges:
        - from: scale
          to: retention
          label: Usage compounds
        - from: retention
          to: ai-growth
          label: Expansion surface grows
        - from: retention
          to: customer-roi
          label: Stickier workflow
        - from: customer-roi
          to: hidden-friction
          label: More value, but more services complexity
        - from: ai-growth
          to: blocked-underwrite
          label: Revenue quality still needs mix detail
        - from: hidden-friction
          to: blocked-underwrite
          label: Support and setup costs remain unclear
    approximationNotes: Uses public customer metrics, retention metrics, and customer proofs rather than management-model CAC data.
    claimRefs: [CI011, CI013, CI014, CI026, CI027, CI028, CI032, CI033, CI039]
