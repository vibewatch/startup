  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: capital structure
    missingEvidence: Full cap table, liquidation preferences, anti-dilution provisions, warrants, side letters, and any debt-like seniority tied to the 2025 financing.
    whyItMatters: Headline valuation is not realized return without knowing how new money sits in the waterfall.
    diligencePath: Obtain signed financing documents and build a full waterfall model with counsel and finance.
    relatedQuestionRefs:
    - QV012
    - QV030
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: revenue quality
    missingEvidence: Audited ARR definition, gross margin, AI versus core revenue mix, services burden, and contribution margin by major module.
    whyItMatters: These metrics determine whether Filevine deserves an AI-premium multiple or should be priced like a vertical workflow platform.
    diligencePath: Request an audited CFO pack with ARR, margin, and segment bridge detail.
    relatedQuestionRefs:
    - QV011
    - QV027
    relatedTableRefs:
    - TV003
    - TV006
  - type: private-evidence-only
    severity: material
    topic: secondary price discovery
    missingEvidence: Recent secondaries, mutual-fund marks, banker feedback, and evidence that the current mark clears outside the primary syndicate.
    whyItMatters: Without external price discovery, the current round may overstate broad market-clearing value and exit readiness.
    diligencePath: Collect broker checks, board materials, and any mark-to-market documentation used by existing investors.
    relatedQuestionRefs:
    - QV013
    - QV029
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: material
    topic: comp precision
    missingEvidence: A refreshed late-stage comp set with more directly comparable legal and professional-workflow names plus live margin data at the time of investment.
    whyItMatters: A wider, more current comp bridge could tighten or loosen the supportable valuation band materially.
    diligencePath: Refresh the comp table with live market data and filing-derived revenue-quality metrics immediately before pricing.
    relatedQuestionRefs:
    - QV014
    - QV017
    relatedTableRefs:
    - TV004
