- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Case
  - Key assumptions
  - Implied EV band
  - Headline return logic
  - Probability signal
  rows:
  - - Bull
    - Filevine pushes well beyond the public $205M ARR estimate, keeps expansion near the current >120% signal, and proves that LOIS-led AI monetization and enterprise/government expansion deserve a high-end software premium.
    - US$2.8B-US$3.6B
    - Current $3B entry works, but upside is only moderate unless growth and margin quality are materially better than public evidence shows today.
    - Requires the AI and enterprise narrative to convert into auditable economics, not just customer anecdotes.
  - - Base
    - Growth remains healthy but not extreme, AI improves product value more than realized margins, and investors apply a premium-to-public but sub-AI-leader multiple.
    - US$1.8B-US$2.4B
    - Meaningful downside from the current financing anchor; the company can still be fundamentally solid while the round price proves too full.
    - Most consistent with current public disclosure quality and comp evidence.
  - - Bear
    - Expansion slows, AI monetization proves narrower than management messaging, or legal-tech multiples compress further as the exit market stays weak.
    - US$1.1B-US$1.7B
    - Large mark-to-market downside without requiring a business failure.
    - A repricing scenario driven by multiple compression and evidence gaps, not a collapse in relevance.
  notes: Bands are enterprise-value style ranges before any preference waterfall, warrant effects, or exact dilution math because those terms are not public.
