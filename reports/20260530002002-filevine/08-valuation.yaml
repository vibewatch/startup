- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - ARR quality disappoints
    - Audited ARR or renewal quality comes in materially below the public $205M / >120% signal
    - Breaks the argument that Filevine deserves a premium multiple to public workflow peers.
    - Reset valuation toward the base/bear range and do not proceed at the current price.
  - - AI monetization proves thinner than messaging
    - AI revenue or usage lacks durable paid attach outside a few flagship workflows
    - Collapses the case that Filevine should be valued closer to AI leaders than workflow incumbents.
    - Treat the company as a vertical workflow platform, not a legal-AI premium asset.
  - - Capital structure is investor-unfriendly
    - Preference stack, warrants, ratchets, or debt-like terms materially subordinate new money
    - Can destroy realized return even if enterprise value holds near the mark.
    - Pause underwriting until the full waterfall is modeled.
  - - Exit market stays weak
    - Legal-tech exits remain sparse and disclosed prices stay limited while secondaries do not clear near the round price
    - Raises the risk that the headline mark is not broadly financeable.
    - Do not rely on the primary round as proof of realizable value.
  - - Market multiple compression resumes
    - Public workflow and software multiples roll lower without offsetting Filevine growth outperformance
    - Shrinks the comp-supported valuation band quickly.
    - Treat as a valuation kill trigger for any new-money case near $3B.
  notes: Each trigger is observable from diligence materials, market data, or later disclosures and ties directly to realized valuation support.
