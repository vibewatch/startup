- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence anchor
  - What would change the view
  rows:
  - - 'Pro-thesis: Filevine has real scale and retention, not just narrative momentum.'
    - Public sources support nearly 6,000 customers, 100,000 legal professionals, >96% gross retention, and >120% net dollar retention.
    - Downgrade if diligence shows those retention metrics have decayed or depend on a narrow cohort of plaintiff-side firms.
  - - 'Pro-thesis: LOIS and compliance work broaden the company beyond basic case management.'
    - Official LOIS and security materials show AI-native workflow ambition plus SOC 2, HIPAA, CJIS, and FedRAMP-related effort that can help enterprise and government expansion.
    - Upgrade only if management proves those capabilities translate into repeatable enterprise wins and durable gross-margin lift.
  - - 'Anti-thesis: The current mark already bakes in a meaningful AI premium.'
    - Using the best public ARR estimate, the $3B financing implies about 14.6x ARR, above the selected public workflow-software median.
    - A much higher forward ARR run-rate or audited premium economics would narrow that valuation gap.
  - - 'Anti-thesis: Capital-structure and revenue-quality opacity still matter more than the growth story admits.'
    - Public sources do not disclose gross margin, audited revenue mix, preferences, warrants, or secondary-market clears for the current round.
    - A cleaner waterfall and audited quality-of-revenue package could move the recommendation closer to track or buy.
  notes: The table separates “good company” evidence from “good price” evidence so the recommendation remains underwriting-specific rather than admiration-driven.
