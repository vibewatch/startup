- id: exit-readiness-and-final-diligence
  title: Exit readiness and final diligence
  body: 'Filevine looks more exit-ready than many legal-AI point solutions because it already sells a multi-module platform, markets to enterprises and agencies, and has invested meaningfully in compliance. That helps the thesis. It does not remove the final diligence burden. Public investors can benchmark transparent filing issuers such as Procore, Veeva, and Toast every day; a Filevine buyer cannot do the same for margins, cap-table seniority, or secondary-market clearing levels. PM Insights publicly advertises sections for secondary activity, bid-ask ratios, mutual-fund valuations, and cap-table details, but the actual figures are withheld. That means the investor still cannot tell whether the current mark is broadly financeable or just the result of a specific syndicate and moment. The final work therefore has to be practical and price-moving: confirm ARR quality, gross margin mix, AI contribution, preference waterfall, debt or warrant overhang, and the real state of exit preparation.
    Until those items are in hand, Filevine remains a compelling company with an unproven entry price.'
