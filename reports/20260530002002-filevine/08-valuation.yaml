- id: bull-base-and-bear-underwriting
  title: Bull, base, and bear underwriting
  body: 'The scenario math is what turns admiration into discipline. The bull case assumes that the public $205 million ARR estimate is already stale on the upside, that expansion remains above the current >120% signal, and that LOIS-driven AI monetization really does move Filevine closer to an AI-premium platform than a workflow incumbent. In that world, a value around or modestly above the current $3 billion mark can work. The base case is less generous and, today, more evidence-consistent: Filevine is a strong vertical platform, but not yet a transparently premium software asset. That points to a supportable range below the current financing anchor. The bear case is a repricing story rather than an operational collapse. If growth slows toward public-comp norms, if AI proves more assistive than revenue-transformative, or if the legal-AI bubble narrative cools further, the multiple can compress sharply even while the business remains healthy. That is why the current decision is not “avoid
    Filevine forever”; it is “do not underwrite this price until the company grows into it or opens the books enough to justify it.”'
