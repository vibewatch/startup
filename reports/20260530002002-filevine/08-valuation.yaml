- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Cap table and preference waterfall
    - Liquidation preferences, anti-dilution terms, warrants, side letters, and any debt-like seniority
    - Headline enterprise value is not realized investor outcome without knowing the waterfall.
    - Finance lead plus counsel; review signed financing documents and a full waterfall model.
  - - Audited revenue quality
    - Booked ARR definitions, deferred revenue bridge, churn cohorts, and AI versus core revenue split
    - Needed to decide whether Filevine deserves an AI premium or a workflow-software multiple.
    - CFO diligence package plus revenue-recognition workpapers.
  - - Gross margin and contribution margins
    - Blended gross margin, module-level contribution margin, and implementation/services burden
    - Current public evidence is strong on growth but weak on economic quality.
    - Audited segment bridge and board materials.
  - - Enterprise and government expansion
    - Pipeline conversion, reference accounts, contract lengths, and compliance-driven win rates
    - The bull case depends on Filevine scaling beyond its legacy base into more durable enterprise/government revenue.
    - Sales leadership review and customer references.
  - - Secondary market and exit preparation
    - Recent secondaries, mutual-fund marks, banker views, and IPO or strategic-preparation materials
    - Tests whether the $3B mark is broadly financeable or specific to the primary syndicate.
    - Broker checks, board decks, and investor-relations preparation materials.
  - - Public-comp refresh at signing
    - Live market-data update for workflow and legal-information peers immediately before pricing
    - A volatile comp tape can move the supportable range quickly.
    - Refresh the comp set with live market data and public filings immediately before any investment committee decision.
  notes: These asks are prioritized by how much they can change realized return, not by generic diligence hygiene.
