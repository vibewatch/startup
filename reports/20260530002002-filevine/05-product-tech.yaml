  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sla-gap
    missingEvidence: A current master service agreement or trust-center artifact stating numeric uptime targets, service credits, and recent availability performance.
    whyItMatters: Public status tooling exists, but without numeric SLA and remedy terms investors cannot underwrite service-level exposure or compare Filevine’s reliability commitments to peers.
    diligencePath: Request the current MSA/SLA package plus the last 12 months of incident reports or customer status summaries from Filevine sales or security teams.
    relatedQuestionRefs:
    - QE028
    relatedTableRefs:
    - TE004
    - TE005
  - type: private-evidence-only
    severity: material
    topic: ai-architecture
    missingEvidence: A technical architecture briefing covering tenant isolation, data residency, model routing, retention boundaries, and named integration depth for larger adjacent systems.
    whyItMatters: The public workflow story is strong, but architecture opacity makes it hard to underwrite operational risk, compliance scope, and enterprise implementation effort.
    diligencePath: Ask Filevine for a solution-architecture session, security whitepaper, and product-specific integration design docs for enterprise buyers.
    relatedQuestionRefs:
    - QE029
    relatedTableRefs:
    - TE003
  - type: stale
    severity: minor
    topic: roadmap-certifications
    missingEvidence: Issued certificates, attestation letters, or dated roadmap milestones for ISO 27701, ISO 27017, ISO 27018, FIPS 140-3, and future LOIS integration scope.
    whyItMatters: The current public pages show positive direction, but open-ended “pursuing” and “building” language should not be treated as completed milestones in diligence models.
    diligencePath: Request issuance dates, audit letters, and release-roadmap dates from Filevine’s security and product teams before crediting these items as delivered.
    relatedQuestionRefs:
    - QE027
    relatedTableRefs:
    - TE004
    - TE005
