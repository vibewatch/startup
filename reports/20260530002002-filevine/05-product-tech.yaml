chapter:
  number: 5
  title: Product & Technology
  summary: Filevine now markets a unified legal-work platform whose connective tissue is LOIS, an intelligence layer spanning intake, matter management, document workflows, billing, depositions, deadlines, and reporting. Public evidence shows real product breadth plus a public API, GitHub repos, Microsoft surfaces, automation partners, and a public trust center, but deeper architecture details, formal SLA terms, and several roadmap claims remain only partially verifiable from open sources.
sections:
- id: product-definition-and-module-map
  title: Product definition and module map
  body: |-
    Filevine’s current product story is no longer just “case management software.” The platform page organizes the company around one connected legal-work system that combines core workflows, specialized legal tools, data-system services, and security/compliance controls, with LOIS positioned as the intelligence layer that ties those surfaces together. In practical workflow terms, the public stack starts with lead capture and client intake, flows into matter management and document handling, then extends into drafting, signatures, depositions, chronologies, billing, payments, and analytics. That breadth matters because Filevine is trying to be the system of record and the system of execution at the same time: case data, documents, deadlines, communications, and AI-assisted work all sit inside one branded environment. The main diligence takeaway is that Filevine’s module breadth and workflow adjacency are clearly visible, but public materials still stop short of a full architectural map showing how each module shares data, permissions, and model execution behind the scenes.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE007
  - CE008
  - CE009
  - CE010
  - CE030
  tableRefs:
  - TE001
- id: ai-workflow-and-operating-architecture
  title: AI workflow and operating architecture
  body: |-
    The observable operating model is a layered legal workflow. Matters and related records act as the organizing spine; documents are ingested into Docs+, searched with OCR, and mined by AIFields for structured data; LOIS and the AI legal assistant then use that context to answer questions, draft, redline, and help advance work. Several specialized modules show Filevine applying that same pattern to legal sub-workflows: MedChron converts medical records into timelines, Timely converts trigger dates into jurisdiction-specific deadlines, and ValidationAI checks whether a matter phase is truly complete before a team advances it. Public deployment evidence points to cloud delivery rather than local software: Filevine’s privacy policy calls the services cloud-based, case-management materials emphasize browser access from any internet-connected computer, and GitHub plus the platform page show migration tooling and data-migration surfaces. The strength here is workflow continuity from intake through execution; the weakness is that open materials do not disclose model routing, tenant isolation, or data residency design in enough detail for technical underwriting.
