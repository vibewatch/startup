  - Limitation
  rows:
  - - Qualify and onboard a new matter
    - Capture lead details, summarize intake, and convert to active work
    - Lead Docket plus LeadsAI feeding Filevine matters
    - Reduces manual data entry and accelerates client onboarding
    - No public conversion-rate or intake-accuracy metrics
  - - Organize active case work
    - Track contacts, tasks, notes, calendars, and documents in one matter
    - Case management workspace
    - Single record system accessible from any internet-connected computer
    - Public materials do not expose schema, data residency, or tenant design
  - - Review and structure document sets
    - Upload files, search text, extract key facts, and populate fields
    - Docs+ plus AIFields
    - OCR and field mapping reduce manual review time
    - No public extraction-quality or exception-handling metrics
  - - Draft, redline, and finalize legal documents
    - Generate drafts from matter data and work inside Microsoft Word
    - Document Assembly plus LOIS for Word
    - Connected variables and contextual AI keep drafts closer to source data
    - Roadmap language is stronger than public proof for future integrations
  - - Run depositions and post-deposition review
    - Schedule, transcribe, track goals, summarize, and review evidence
    - Depositions by Filevine plus Depo CoPilot
    - Real-time analysis shortens post-deposition review work
    - No public model-evaluation or certified-transcript process detail
  - - Track deadlines and advance phases
    - Calculate rules-based deadlines and block incomplete phase transitions
    - Timely plus ValidationAI
    - Improves procedural consistency and reduces missed steps
    - Public sources do not quantify false positives or missed-rule rates
  notes: Benefits are based on public product claims and workflow descriptions, not on independently audited outcome studies.
