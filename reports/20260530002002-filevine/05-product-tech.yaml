- id: reliability-support-security-and-compliance
  title: Reliability, support, security, and compliance
  body: |-
    Filevine’s public trust posture is stronger than its public reliability posture. Security materials describe a formal program of risk assessments, privacy impact analysis, penetration testing, vulnerability scanning, workforce training, and cross-functional security governance, while the trust center publishes FedRAMP-oriented deliverables and a controls library. The security page also discloses concrete backup mechanics on AWS, including redundant backups across multiple availability zones and regions at least every 15 minutes with AES-256 at-rest encryption. The privacy policy and subprocessor page add useful transparency about the operational footprint, naming vendors such as AWS, Anthropic, AssemblyAI, Deepgram, CloverDX, Drata, and Coalfire. Reliability is more mixed. Filevine does maintain a public status page with uptime history, incident categories, and subscription alerts, but the reviewed public sources do not publish a numeric uptime SLA, service-credit terms, or detailed public postmortem metrics. For diligence, that means security/compliance evidence is fairly strong for an open-source review, while service-level underwriting still needs private materials.
  claimRefs:
  - CE023
  - CE024
  - CE025
  - CE026
  - CE027
  - CE028
  - CE029
  - CE031
  - CE037
  - CE039
