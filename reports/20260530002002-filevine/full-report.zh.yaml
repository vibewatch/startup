companyProfile:
  summary: |
    Filevine 是一家位于 Salt Lake City 的法律科技公司。2014 年，Ryan Anderson 和其他创始人因为自己的律所工作流需求，
    先做出了这套软件。公司现在把 LOIS 定位为 AI 原生的法律运营智能系统，覆盖线索接入、事项管理、文档工作流、计费、
    支付、报表以及相邻法律工作工具。公开证据显示，Filevine 正从原本的原告律所根基，扩展到更广泛的律所、政府机构和企业法务团队；
    2025 年大额股权融资和越来越偏合规的 GTM 动作支撑了这条扩张线。
  foundedDate: '2014-01-01'
  founders:
    - name: Ryan Anderson
      role: 联合创始人兼 CEO
      background: 前执业律师。创始团队当年找不到适合自己律所工作流的软件，他因此参与创建 Filevine。
