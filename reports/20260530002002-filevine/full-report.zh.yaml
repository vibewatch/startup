    title: 客户
    sections:
      - number: '6.1'
        title: 分层与买方地图
        blocks:
          - type: paragraph
            body: >-
              Filevine 已经走出原告侧案件管理产品的起点，但公开证据仍显示客户基础锚定在诉讼密集型律所。Sacra 和 Above the Law 都指向原告及更广泛诉讼工作流 作为重心，GetApp
              评论者元数据也显示，最可见的使用仍来自律所组织和法律案件管理岗位。同时，客户名单已经不再单一：当前引用覆盖家事法、移民、 公设辩护、一个大型州机构，以及 2026 年 LEX Summit
              演讲名单上的企业或公司法务运营者。经济买方因细分市场而异，可以是管理合伙人、COO、执业经理、
              总法律顾问或机构领导；但日常用户稳定地包括律师、律师助理、线索接入人员、运营人员、财务人员和管理员。政府买方比小律所更看重安全和采购渠道； Carahsoft
              和公部门案例研究把这一点说得很明确。实际含义是，Filevine 具备真实细分广度，但能公开点名且有结果支撑的客户，在诉讼导向律所中 仍远比企业法务部门密集。
