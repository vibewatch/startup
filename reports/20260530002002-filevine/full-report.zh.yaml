      - number: '6.4'
        title: 留存与耐久性
        blocks:
          - type: paragraph
            body: >-
              Filevine 最强的公开耐久性信号，是 2025 年 9 月融资前后披露的留存栈。Filevine 和 LawNext 都引用 Filevine Core 总留存率超过 96%、净美元留存率 超过
              120%，Sacra 也独立重复了 >120% NDR 表述。历史披露在扩张上更强：2023 年 Q2 报告 NDR 超过 140%、可续约流失率低于 5%；2023 年 Q3 报告 142.6%
              NDR，以及来自既有客户的更多许可证和相邻产品支出。这一模式与具名客户故事相吻合：律所从核心案件管理扩展到 DemandsAI、文档生成、报表、 Docs+、证言工具和更广泛 AI
              工作流。独立评论网站大体支持用户能从平台获得价值这一点——Software Advice 和 TrustRadius 评分稳健——但它们没有直接验证续约经济性。
              关键缺口在细分：公开材料没有显示合同期限、续约时点、按客户层级划分的总流失率，或 SMB 客群是否显著差于企业或公部门客群。因此，留存叙事很强， 但仍在实质上由管理层塑造。
