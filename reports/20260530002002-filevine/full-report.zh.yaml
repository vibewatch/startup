        blocks:
          - type: paragraph
            body: >-
              里程碑轨迹显示，公司正从诉讼工作流软件走向更宽的法律智能平台。Filevine 的 2023 年季度更新突出 DemandsAI、AI Fields、 ImmigrationAI、SidebarAI 等 AI
              发布；到 2025 年，多个战略动作快速集中出现：$400 million 融资、在 LEX Summit 正式发布 LOIS、 进入 FedRAMP Marketplace，以及政府方向增强。到 2026
              年初，收购 Pincites 又把产品延伸到 Word 原生起草和合同红线审阅， 与此前收购 Parrot 形成补充，也把 Filevine 推出纯诉讼案件管理叙事之外。不过，负面记录并非空白。2025
              年一篇负责任披露文章 记录了一起严重但看似孤立的非生产环境暴露，涉及近 100,000 份与一家律所环境相关的机密文件；BBB 也保留投诉页面，尽管留存页面文本
              没有暴露具体内容。合在一起，这些信号不会推翻增长叙事，但买方需要尽调安全控制、实施质量和信任姿态，不能假定规模自然等于运营顺滑。
