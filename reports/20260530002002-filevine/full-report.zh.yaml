      - number: '2.2'
        title: 约束式测算显示外壳很大，但没有干净的 SAM 或 SOM
        blocks:
          - type: paragraph
            body: >-
              对 Filevine 来说，最强的公开测算方法是约束式外壳，而不是单一标题 TAM。官方劳动力数据表明，美国法律用户基数很大： ABA 统计活跃律师超过 1.3 million，BLS 统计律师岗位为
              864,800 个。这些数字支持广度，但不能给出 Filevine 可触达的软件分母， 因为它们不揭示办公室数量、执业组合、预算权限或不同买方类型的案件管理渗透率。分析师估算进一步拉宽不确定性。 Business
              Research Insights 把 2026 年法律执业管理市场定在 $3.15 billion，Coherent 则把 2026 年法律案件管理市场定在 $9.8
              billion。ResearchAndMarkets 又把品类定义扩展到政府机构、律所和个人执业者，覆盖计费、CRM、日程、文档管理和任务工作流。 矛盾本身有信息量，而不是致命问题：它说明 Filevine
              相邻需求真实存在，但品类标签会让表观上限移动超过 3 倍。因此，公开证据 足以支撑一个有边界的市场外壳和相互矛盾的估算区间，却不足以支撑可辩护的原告律所、政府、企业法务分拆 SAM 或 SOM。
