      - number: '3.4'
        title: 切换成本、锁定、多栖与替代风险
        blocks:
          - type: paragraph
            body: >-
              Filevine 的防御力在数据重力和工作流所有权互相强化时最强。一旦线索接入、文档、通信、计费、支付、模板和时间线都落在一个运营表面里， 替换系统就会带来再培训成本、迁移工作和运营风险。这也是为什么即便 AI
              单点方案在单一工作流上显得更快，全栈产品仍然有黏性。Litify 的 Salesforce 配置深度展示了这条锁定光谱的远端；Clio 和 MyCase
              则说明，定价透明也可以与支付、会计、门户和应用生态里的真实留存表面共存。


              问题在于，锁定已经不再绝对。Bloomberg 对通用工具的怀疑是有用背景，但更重要的风险是专业化。EvenUp 和 Supio 可以嵌入高价值原告工作流， 而不拥有其余事项。Harvey 可以赢得企业法律 AI
              预算，而不成为计费或案件账本。当 AI 起草、摘要、审阅和工作流建议在 Filevine、Clio、Litify、EvenUp、 Supio 和 Harvey 之间扩散，AI 层本身越来越像商品化能力。这把
              Filevine 拉回一个更难的问题：它能否比相邻供应商剥离高毛利 AI 用例更快地守住
              记录系统位置和变现表面？可能答案是混合的。多栖会先上升，尤其在人身伤害和诉讼领域。只有当买方认定，更轻的核心加最佳单点覆盖层在成本、信任和结果上 胜过一个整合平台时，替代才会跟进。
