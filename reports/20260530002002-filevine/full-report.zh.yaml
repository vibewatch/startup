  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议和价格纪律
        blocks:
          - type: paragraph
            body: >-
              Filevine 不再是产品市场契合度问题；它是价格纪律问题。公开证据支持它是一家真实公司：2025 年融资带来 $400 million 全股权资本，平台报告近 6,000 名客户和 100,000
              名法律专业人士，管理层将这一规模与超过 96% 的总留存率和高于 120% 的净美元留存率相配套。这些都是严肃的运营信号。承销问题在于当前融资锚点已经要求很高。Tracxn 和 SuperbCrew 都把
              Filevine 估在约 $3 billion，Sacra 的 2025 年 ARR 估计 $205 million 意味着约 14.6x
              的进入倍数。这显著高于所选公开工作流软件桥接组，同时仍缺少利润率、收入结构、现金生成、优先权和二级市场清算价格信息。因此，基于证据的判断是
              RESEARCH-MORE，风险高且估值立场昂贵。在今天的标记下，新资金被要求先为 AI 溢价未来付费，而公开记录尚未证明经济性、治理和退出路径值得这一价格。
