      - number: '4.2'
        title: 公开牵引、留存与 GTM 动作
        blocks:
          - type: paragraph
            body: >-
              最强的公开质量信号来自 Filevine 的规模和扩张指标。经独立报道佐证的 2025 年 9 月融资公告称，Filevine 服务近 6,000 个客户、 100,000 名法律专业人士，每天处理超过 20
              million 页文档。同一公告称 Filevine Core 总留存率超过 96%，净美元留存率超过 120%； 2023 年运营更新则报告期末 ARR 增长超过 50%、混合毛利率 72.5%、NDRR
              142%、流失率低于 5%。对一家私营法律科技公司来说， 这些是异常强的公开软件质量信号。GTM 也似乎在拓宽。管理层称最新融资将深化企业和政府渗透，Sacra 与 Carahsoft 都显示 Filevine
              的定位 已经越过原告律所根基，进入企业法务部门、检察官、公设辩护人、机构和其他复杂组织。伙伴计划在这里很关键：实施伙伴、顾问和渠道伙伴降低部署摩擦，
              并支持更大、更定制化的账户。客户证据在方向上支持企业化论点。案例研究显示，一旦律所把工作集中到 Filevine，更重的工作流使用、每团队更多案件、
              以及有意义的行政时间节省都会出现。仍未公开的是客户增长和留存如何精确转化为确认收入、细分 ACV 或按客群计算的销售效率。
