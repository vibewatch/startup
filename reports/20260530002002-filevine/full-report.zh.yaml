  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 直接执业管理同业
        blocks:
          - type: paragraph
            body: >-
              Filevine 的直接竞争仍来自其他记录系统供应商，而不是纯 AI 助手。Clio 和 MyCase 最直接争夺那些想用一个产品跑通线索接入、事项、 文档、计费、支付和客户沟通的律所。Clio
              增加了最宽的公开应用生态和最清晰的自助升级阶梯：透明入门价、附加产品和 250+ 个集成， 让个人律师或小律所容易把 Clio 与电子表格比较，再扩展到会计、支付、文档自动化和 AI。MyCase 在 SMB
              和中低端中型市场动作中也很强， 因为它公开按席位定价，把 LawPay 和会计包装进产品叙事，并声称已有 18,000+ 家律所使用这套技术栈。两种情况下，透明定价和清晰套餐边界 都降低了销售摩擦，而
              Filevine 的演示驱动包装做不到这一点。


              Litify 是市场另一端的直接同业。它基于 Salesforce、无代码自动化、重服务部署模型，指向愿意用实施工作换取可配置性的大型律所和法律部门。 这形成了有意义的细分差异：Filevine
              以统一法律工作平台竞争，Clio 和 MyCase 以广泛打包的执业管理套件竞争，Litify 则以企业法律运营平台竞争， 能在工作流定制上走得更深。结果是核心市场拥挤，Filevine
              并没有一个显而易见的直接可比空位；只有当买方更偏好一体连接的法律工作表面， 而不是 Clio 的分发机器、MyCase 的透明 SMB 套餐或 Litify 以 Salesforce
              为中心的企业锁定时，它才会赢。
