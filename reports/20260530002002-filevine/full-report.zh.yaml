    sections:
      - number: '1.1'
        title: 身份、平台边界与运营足迹
        blocks:
          - type: paragraph
            body: >-
              留存的一手来源让 Filevine 的品类转向显得异常清楚。官网和 LOIS 材料已经不再推一个通用的律所管理工具； 它们把 Filevine 定义为面向复杂法律工作的法律 AI
              和法律运营智能。这一定位有可信度，因为即便不计入 AI 层， 产品表面也已经很宽。Filevine 自有产品页显示，一个平台覆盖案件管理、文档生成、文档管理、计费、支付、分析和政府级工作流； LOIS
              页面则解释这些底层记录如何被用来生成有依据的回答、草稿和工作流动作。总部比经济指标更容易核验：联系页面给出 Salt Lake City 总部和另外四个办公室，2025
              年融资公告还加入了全球办公室的表述。规模方向上很强，但官方页面之间并未完全同步。 关于页面把更新的规模卡片和较旧的叙述文案混在一起，因此客户数和员工数需要标注日期，不能盲目取平均。
