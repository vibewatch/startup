  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              Filevine 当前产品叙事已经不只是「案件管理软件」。平台页面把公司组织成一个互联的法律工作系统，结合核心工作流、专业法律工具、数据系统服务和 安全 / 合规控制；LOIS
              则定位为把这些表面绑在一起的智能层。按实际工作流看，公开技术栈从线索捕获和客户接入开始，流入事项管理和文档处理， 再延伸到起草、签名、证言、时间线、计费、支付和分析。这种广度重要，因为 Filevine
              试图同时成为记录系统和执行系统：案件数据、文档、截止日期、 通信和 AI 辅助工作都位于一个品牌环境内。主要尽调结论是，Filevine 的模块广度和工作流邻接性清晰可见，但公开材料仍没有给出完整架构图，
              展示各模块如何在幕后共享数据、权限和模型执行。
