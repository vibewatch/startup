      - number: '6.5'
        title: 扩张、采购摩擦与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Filevine 的“先落地再扩张”引擎很明显，但可能拖慢这一引擎的摩擦也同样明显。现有客户显然会随着时间购买更多席位和相邻模块，具名账户也常常从核心事项管理扩展到计费、文档、AI
              起草、时间线、取证笔录或适配政府的工作流。然而，赢单所依赖的同一种定制化也会拉长采购和实施周期。Saalfield Shad 在选择 Filevine 的可配置性之前演示了十多种替代方案；Burnham
              的网络研讨会强调搭建和运营设计，而不是即插即用式入门。独立评论网站反复指出设置复杂、付费集成、培训昂贵、支持缓慢和账单摩擦。对于公共部门买家，合规和渠道结构又增加了一层：Carahsoft、面向 CJIS
              的案例研究以及机构安全措辞，都暗示其销售周期比 SMB 律所采用更长、更正式。战略上，最大的集中度风险在于，最醒目的公开引用仍来自原告和诉讼律所。Filevine
              显然正在上移至企业和政府市场，但有结果背书的企业徽标公开密度，仍落后于律所引用的密度。这很重要，因为如果同一批以诉讼为重的客户群持续购买更多产品，集中度可能隐藏在表面强劲的 NDR 之中。
