      - number: '2.3'
        title: 原告、政府和企业法务的买方、用户、付款方差异很大
        blocks:
          - type: paragraph
            body: >-
              Filevine 并不是卖给一个通用买方画像。原告律所里，买方通常是管理合伙人、业务负责人或运营负责人；律师、律师助理和线索接入团队
              是日常用户；律所预算或风险代理费经济模型构成付款逻辑。企业法务动作为另一套逻辑：产品围绕总法律顾问、法务运营、合同经理和 外部律师协调来包装，法律预算负责人往往还需要向高管证明成本跟踪和 KPI
              可见度。政府动作又不同。公设辩护人、州或市政、联邦页面 强调高案量、集中记录、权限、审计轨迹，以及 CJIS 或 FedRAMP 式控制等合规要求。BLS 雇主数据解释了为什么律所按用户数仍是最大的外壳；
              但公部门和企业法务买方同样重要，因为它们的工作流密集、合规敏感，而且一旦嵌入通常更难替换。结论是，Filevine 的用户、付款方和 采用路径必须按工作流负担和控制环境拆分，而不能只按律所规模拆分。
