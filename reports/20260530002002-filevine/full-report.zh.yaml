  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 决策链：把 Filevine 的真实运营证据，与当前在 $3B 估值标记下“继续研究”的建议连起来。
    data:
      nodes:
        - id: traction
          label: 真实牵引力
          detail: 规模、留存和 AI 使用数据可信。
        - id: breadth
          label: 平台边界扩大
          detail: LOIS 和合规业务把可覆盖的市场叙事拉宽。
        - id: price
          label: $3B 锚点
          detail: 按最乐观的公开估计，约相当于 ARR 的 14.6x。
        - id: opacity
          label: 经济面不透明
          detail: 利润率、收入结构、优先权和老股交易仍未公开。
        - id: support
          label: 估值支撑不足
          detail: 上市可比公司和私募中位数都没有明确支撑这一估值标记。
        - id: decision
          label: 建议：继续研究
          detail: 等尽调证据补齐，或等更低入场价格。
      edges:
        - from: traction
          to: support
        - from: breadth
          to: support
        - from: price
          to: support
        - from: opacity
          to: support
        - from: support
          to: decision
    approximationNotes: 这是一张逻辑图，不是折现现金流，也不是概率树。
    claimRefs:
      - CV008
      - CV011
      - CV018
      - CV040
      - CV041
      - CV043
      - CV047
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 最可能推动 Filevine 可支撑估值区间变化的因素，以 0-10 相对敏感度评分呈现。
    data:
      items:
        - label: 经审计 ARR 质量与流失
          value: 10
          unit: /10
          note: 最直接检验公开增长故事是否耐久。
        - label: 毛利率与 AI 收入结构
          value: 10
          unit: /10
          note: 决定 Filevine 是否配得上更高的软件倍数。
        - label: 优先权瀑布与稀释
          value: 10
          unit: /10
          note: 实际回报可能与名义估值大幅偏离。
        - label: 企业 / 政府客户转化
          value: 8
          unit: /10
          note: 乐观情景要超越既有客户密度，必须看到企业 / 政府转化。
        - label: 老股交易 / 退出市场信号
          value: 8
          unit: /10
          note: 检验这轮新股标记能否在财团外部站得住。
        - label: 上市可比倍数环境
          value: 7
          unit: /10
          note: 外部市场行情可能很快移动可支撑区间。
    approximationNotes: 分数是定性敏感度排序，不是百分比变化。
    claimRefs:
      - CV020
      - CV029
      - CV030
      - CV043
      - CV049
      - CV050
      - CV051
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 悲观、基准、乐观三档企业价值区间，说明为什么当前 $3B 估值标记要成立，需要足够支撑溢价的证据。
    data:
      items:
        - label: 悲观重定价区间
          low: 1100
          high: 1700
          unit: USD M
          detail: 增长降温，倍数向上市工作流软件常态压缩。
        - label: 基准投资测算区间
          low: 1800
          high: 2400
          unit: USD M
          detail: 公司很强，但公开证据还撑不起完整的私募市场 AI 溢价。
        - label: 乐观执行区间
          low: 2800
          high: 3600
          unit: USD M
          detail: 需要 Filevine 靠优质经济性和干净条款，把业绩长进这个估值标记。
    approximationNotes: 由于详细瀑布条款未公开，区间按企业价值口径呈现，且未计优先权和认股权证。
    claimRefs:
      - CV018
      - CV039
      - CV052
      - CV053
      - CV054
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 仅基于公开证据，对当前 Filevine 投资案例作 IC 风格评分。
    approximationNotes: 分数是基于各章证据综合出的 0-10 定性判断，不是正式评分引擎的输出。
    data:
      items:
        - label: 市场需求
          value: 8
          unit: /10
          detail: 法律工作流和 AI 自动化仍是大且粘性强的品类。
        - label: 产品深度
          value: 8
          unit: /10
          detail: LOIS 让产品跳出基础案件管理。
        - label: 客户证据
          value: 8
          unit: /10
          detail: 从公开记录看，规模和留存指标都强。
        - label: AI 变现证据
          value: 7
          unit: /10
          detail: 使用量和增长信号可观，但仍主要来自公司披露。
        - label: 披露质量
          value: 3
          unit: /10
          detail: 核心经济性和资本结构细节仍未公开。
        - label: 股权结构透明度
          value: 2
          unit: /10
          detail: 公开资料看不到瀑布、优先权或认股权证细节。
        - label: 估值纪律
          value: 3
          unit: /10
          detail: 当前标记已经计入不小溢价。
        - label: 退出准备度
          value: 5
          unit: /10
          detail: 强于单点方案同行，但能否被市场出清，证据仍薄。
    claimRefs:
      - CV003
      - CV004
      - CV008
      - CV011
      - CV018
      - CV020
      - CV042
      - CV047
      - CV050
