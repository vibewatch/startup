      - number: '8.3'
        title: 估值桥接和可比公司
        blocks:
          - type: paragraph
            body: >-
              最清晰的估值桥接是公开工作流软件和私人法律 AI 领军者的混合。按当前公开市场快照，Thomson Reuters、Procore、AppFolio、Guidewire 和 Veeva 的 TTM 市销率在
              4.94x 到 9.61x 之间，所选中位数约为 5.72x。私人软件 M&A 基准也很克制：Aventis 将 H2 2025 中位数定为 3.1x EV/revenue，并把 2026
              年描述为稳定、并未完全重估的市场。在这一框架下，仅凭当前公开证据很难为 Filevine 隐含的 14.6x ARR 倍数辩护。反论是，纯法律 AI 领军者获得的估值极端得多：Harvey 2026 年 3
              月融资隐含近 58x ARR，Legora 2026 年 4 月轮次隐含约 56x。这些例子很重要，因为它们显示市场会为 AI
              优先法律平台支付巨大溢价。它们也是警告，因为它们集中在极少数领军者中，并处于退出仍弱、披露价格稀少的市场。Filevine 因此看起来对工作流可比公司而言太贵，但也没有贵到明显匹配最亢奋的 AI 领军者估值记录。
