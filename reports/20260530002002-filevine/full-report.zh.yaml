      - number: '3.2'
        title: AI 替代、补充与工作流覆盖层
        blocks:
          - type: paragraph
            body: >-
              EvenUp、Supio 和 Harvey 改变了竞争框架，因为它们不必替换 Filevine 也能拿走预算。EvenUp 和 Supio 是人身伤害和原告律所覆盖层，
              承诺在律所既有案件管理系统之上，更快生成索赔函、时间线，支持线索接入审查、谈判和案件分析。它们自己的信息表达把补充关系讲得很明白： 两者都强调从律所现有 CMS 提取、连接或协同工作。这意味着它们对
              Filevine 最大的威胁在高价 AI 工作流层，而不是核心计费或事项账本。 EvenUp 的证据点集中在原告结果和和解提速，Supio 则依靠文档密集型原告工作流和安全控制，让敏感执业场景中的采用变得可接受。


              Harvey 是另一类替代品。它不是原告专用，也不是执业管理套件，而是企业法律 AI 预算磁铁。CNBC 和 TechCrunch 显示，Harvey 已达到垂直软件供应商中
              罕见的规模：数十亿美元估值、据报道九位数 ARR，以及许多顶级 AmLaw 律所采用。这并不让 Harvey 成为 Filevine 工作流基础的直接替代， 但足以让它在成熟法律组织内部争夺可自由支配的 AI
              层支出。实际市场因此走向多栖。一家律所可以保留 Filevine、Clio 或 MyCase 作为记录系统， 同时购买 EvenUp 或 Supio 来加速原告工作流，再购买 Harvey
              处理更广的起草、审阅或企业 AI 用例。对 Filevine 来说，相邻 AI 供应商在战术上是补充， 在战略上是替代，因为它们会削弱核心平台控制的钱包份额。
