  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >-
              Filevine 当前的公开定价姿态是有意以报价为主，而不是透明标价 SaaS。官方定价页面称所有套餐都为每个组织定制；订阅协议则说明， 使用受销售订单约束，每个 Filevine
              许可证对应一名授权用户。公开证据仍足以识别收入栈。Filevine 销售核心案件与事项系统、LOIS 旗下 AI 产品、 计费和支付、分析、截止日期管理、集成、线索接入产品、证言和电子签名。Sacra
              画像补充了一个重要变现细节：基础订阅看起来按席位收费， 但若干 AI 套餐按项目计费，DataBridge 和自动化等相邻层则带有用量式超额收费。计费和支付页面进一步说明，变现不限于软件席位； Filevine
              还销售支持交易发生的计费工作流、在线支付和相邻行政工具。独立评论从另一侧强化了同一幅图：Filevine 被广泛视为功能强但定制报价， 公开估算只能近似客户在上线、集成、AI
              附加件和支持选择之后真正支付的金额。财务结论是，Filevine 模式具备经常性和可扩张性， 但实际 ASP 和产品级组合仍是私有信息。
