      - number: '4.3'
        title: 成本结构与利润率代理指标
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Filevine 应被视为一家带有实质服务、实施和支付处理复杂度的软件公司，而不是纯席位授权工具。Filevine 自己的 2023 年更新披露 混合毛利率为
              72.5%，并称研发人员占员工数超过三分之一，说明即便在 2025 年 AI 推进之前，公司也承担着有意义的持续产品投入负担。伙伴生态和 定价 FAQ
              也显示，上线和配置并不轻；数百个实施项目由认证伙伴处理，独立评论反复提到高昂设置成本、第三方自动化工作和要求很高的上线过程。 公开可比公司支持这样一个判断：即使带着服务摩擦，利润率仍可保持吸引力。Intapp
              2026 年 3 月申报文件报告 76% 毛利率、123% 云 NRR， 并明确列出与实施、升级和迁移相关的专业服务收入与成本。CS Disco 2026 年 3 月申报文件显示出更重的用量型组合，91%
              收入按用量计费、仅 9% 为订阅， 说明法律科技经济模型可能远离干净的席位 SaaS 可见度。对 Filevine 来说，这意味着利润率路径大概率足以支撑继续激进投入产品； 但公开证据没有揭示在
              AI、支付、上线和支持之后，当前混合毛利率落在哪里。独立负面评论也强化了一点：服务和支持负担会实质影响实际客户经济性。
