      - number: '4.5'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一个建设性但不完整的财务结论。Filevine 看起来有真实收入质量：核心模式基于订阅，公司公开引用一流留存，独立分析指向 2025 年约 $205 million
              ARR，客户证据显示真实工作流嵌入，应能强化扩张。变现栈也通过 AI、计费、支付、分析以及实施 / 渠道杠杆，以经济上合理的方式拓宽。
              但相对而言，公司的披露画像仍然太薄，无法支撑干净的承销模型。公开材料没有从具名客户到确认收入的桥，没有实际 ASP 或折扣瀑布，没有按细分市场的 客群留存，没有 CAC
              或回本期披露，没有现金或资金消耗数据，也看不到债务或契约敞口。负面评论证据还显示，上线、支持和附加定价会制造隐藏的获客和服务摩擦。 因此，正确的财务结论应是平衡的：Filevine
              很可能拥有继续复合增长所需的规模、留存和资本基础，但价格敏感型投资人仍需要管理层资料包， 才能高置信度承销利润率耐久性、正常化自由现金流潜力或融资独立性。
