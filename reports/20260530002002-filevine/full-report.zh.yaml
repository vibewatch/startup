  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、隐私和 AI 治理风险
        blocks:
          - type: paragraph
            body: >-
              Filevine 现在将其产品定位为面向企业和政府机构的 AI 原生法律操作系统，而不是狭义的案件管理工具。该定位扩大了监管暴露，因为平台正在处理特权法律数据、公共部门工作流以及越来越自主的 AI
              辅助操作。Filevine 自己的 2026 AI Trust Index 表示，采用是真实的，但仍取决于准确性、安全性、保密性和集成，这意味着公司正在面向一个即使功能需求很高、信任失效也会阻止扩张的市场销售。


              法律/隐私栈有意义，但并非无摩擦。Filevine 的隐私政策和 2026 年 1 月 DPA 依赖 SCC 式传输机制、数据保留权利以及针对 EEA、UK
              和瑞士数据的子处理方治理。其条款还表示，一些服务依赖第三方 AI 提供商，客户必须独立核查输出事实，并决定何时需要人工审核。这是合理的法律免责声明，但也确认 Filevine 无法完全内化模型风险。EU AI
              Act 又增加了一层变化，因为生成式 AI 的透明度义务已经生效，一些更高风险用途面临更严格控制。


              缓释措施存在，但范围很重要。Filevine 强调 SOC 2 Type II、符合 HIPAA 的控制、CJIS 对齐以及 FedRAMP Low 授权路径。不过，FedRAMP
              公告也表示覆盖是逐产品的，Moderate 仍是路线图项目，因此全平台的合规广度仍不均衡。尽调的关键问题不是 Filevine 是否谈论安全和隐私；而是哪些产品、环境和 AI
              工作流今天实际处于每个经审计边界之内。
