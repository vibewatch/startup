        - US$2.8B-US$3.6B
        - 当前 $3B 入场价可以成立，但除非增长和利润率质量明显好于今天的公开证据，上行空间只是中等。
        - 需要 AI 与企业叙事转化为可审计的经济性，而不只是客户轶事。
      - - 基准
        - 增长保持健康但不极端；AI 更多提升产品价值，而非兑现利润率；投资人给予高于上市同业、但低于 AI 领导者的倍数。
        - US$1.8B-US$2.4B
        - 相比当前融资锚点有明显下行；公司基本面仍可扎实，但本轮价格可能过满。
        - 最符合当前公开披露质量和可比公司证据。
      - - 熊市
