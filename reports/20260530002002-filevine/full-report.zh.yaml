  - id: TV005
    title: 投资逻辑破裂与一票否决触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - ARR 质量不及预期
        - 经审计 ARR 或续约质量明显低于公开的 $205M / >120% 信号
        - 会打穿 Filevine 相比上市工作流同行应享受溢价倍数的论点。
        - 将估值重置到基准 / 悲观区间；不要按当前价格推进。
      - - AI 变现比宣传更薄
        - 除少数旗舰工作流外，AI 收入或使用缺乏持久付费挂载
        - Filevine 应更接近 AI 领跑者而非既有工作流厂商的估值理由会坍塌。
        - 按垂直工作流平台看待，而不是按法律 AI 溢价资产看待。
      - - 资本结构对新投资人不友好
        - 优先股堆叠、认股权证、棘轮条款或债务式条款明显压低新钱顺位
        - 即使企业价值维持在接近标记价，也可能吃掉实际回报。
        - 完整建模分配瀑布前，暂停承保 / 投资测算。
      - - 退出市场持续疲弱
        - 法律科技退出仍稀少，披露价格有限；同时老股交易无法在接近本轮价格清算
        - 名义标记价并非广泛可融资的风险会升高。
        - 不要把新股轮当作可实现价值的证明。
      - - 市场倍数重新压缩
        - 上市工作流与软件倍数下行，而 Filevine 没有足够增长超额表现抵消
        - 可比公司支撑的估值区间会迅速收窄。
        - 若新钱案例接近 $3B，应视为估值否决触发因素。
    notes: 每个触发因素都可从尽调材料、市场数据或后续披露观察到，并直接对应实际估值支撑。
    claimRefs:
      - CV018
      - CV020
      - CV029
      - CV030
      - CV039
      - CV046
      - CV049
      - CV050
  - id: TV006
    title: 最终尽调追问表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 股权结构表与优先权瀑布
        - 清算优先权、反稀释条款、认股权证、附属协议，以及任何类债务优先级
        - 不了解分配瀑布，名义企业价值不等于投资人实际结果。
        - 财务负责人和法律顾问；审阅已签署融资文件与完整瀑布模型。
      - - 经审计收入质量
        - 入账 ARR 定义、递延收入桥、流失队列，以及 AI 与核心收入拆分
        - 用来判断 Filevine 应拿 AI 溢价，还是只按工作流软件倍数定价。
        - CFO 尽调包和收入确认工作底稿。
      - - 毛利率与贡献利润率
        - 综合毛利率、模块级贡献利润率，以及实施 / 服务负担
        - 现有公开证据能证明增长，但经济质量披露薄弱。
        - 经审计分部桥表和董事会材料。
      - - 企业与政府扩张
        - 管线转化、参考客户、合同期限和合规驱动赢率
        - 乐观情景取决于 Filevine 能否从传统客群扩到更耐久的企业 / 政府收入。
        - 销售负责人复盘和客户参考访谈。
      - - 老股市场与退出准备
        - 近期老股交易、共同基金估值标记、投行观点，以及 IPO 或战略出售准备材料
        - 检验 $3B 标记价是广泛可融资，还是只由新股辛迪加支撑。
        - 经纪商访谈、董事会材料和投资者关系准备材料。
      - - 签署前更新上市可比公司
        - 定价前即刻更新工作流和法律信息同行的实时市场数据
        - 可比公司行情波动会迅速挪动可支撑区间。
        - 任何投委会决策前，立即用实时市场数据和公开文件刷新可比公司组合。
    notes: 这些追问按能改变实际回报的幅度排序，而不是按通用尽调卫生排序。
    claimRefs:
      - CV019
      - CV020
      - CV042
      - CV049
      - CV050
      - CV051
