      - number: '7.2'
        title: 产品、安全和可靠性风险
        blocks:
          - type: paragraph
            body: >-
              Filevine 的运营风险不再是假设。2025 年 12 月的一份安全披露描述了一个与 Filevine 相连的非生产律所环境，其中一个有效的 Box 管理员令牌暴露了近 100,000
              份机密文件。研究人员还表示 Filevine 的回应专业并修补了问题，这是积极的治理信号，但该事件仍显示，当 AI
              或文档工作流配置错误时，特权数据多快会变成破坏信任的事件。在法律软件中，即使一次受控暴露的声誉成本，也可能超过直接技术影响范围，因为客户正在外包敏感工作成果、医疗记录和法院保护材料。


              可靠性证据同样喜忧参半。Filevine 自己的支持文章指示用户查看状态页以了解性能下降和事件，而 IsDown 表示自 2023 年 6 月以来已跟踪 95 起事件，并专门记录了影响 Lead Docket 的
              2024 年 Azure 中断以及 2026 年 5 月的 2FA
              访问问题。这些跟踪器并不完美，但方向上很重要，因为它们显示反复发生的运营事件触及访问、附属产品和客户信心。安全页面宣传加密和业务连续性能力，但公开材料没有披露具体 RTO/RPO 指标或韧性测试结果。


              实施风险也很重要，因为 Filevine 不是轻触式产品。Software Advice 的评论材料描述了需要预付款、数据备份、反复上传变更和漫长项目周期的迁移；另一条评论称，高级自动化经常把客户推向
              Workato 这一单独且复杂的系统。这种组合形成了可信的失败模式：技术雄心超过部署质量，导致价值实现更慢、服务负担更高，并拖累续约。
