        title: 融资历史、规模信号与利益相关方地图
        blocks:
          - type: paragraph
            body: >-
              Filevine 的资本形成记录比其私营公司经济指标更清楚。2022 年公司博客明确披露了一轮来自 StepStone、Golub、Signal Peak 和 Meritech 的 $108 million
              融资。2025 年融资叙事更强：公司官方公告、PR Newswire 和独立报道都支持其在约 15 个月内完成两轮 合计 $400 million 的全股权融资，先由 Insight 领投，随后由 Accel 和
              Halo 联合 Insight 领投，Meritech、Stepstone、Run Ventures 和 Album 参投。LawNext 还给出一个可信的内部分拆，约为 $150 million 和 $260
              million。公开规模信号在覆盖广度上同样强： 留存的 2025–2026 年来源大致收敛到近 6,000 个客户和 100,000 名法律专业人士，并伴随一流留存和高文档吞吐。估值和当前经济指标
              没有同样强。一家市场数据来源列出 $3 billion 估值，另一家估算 2025 年 ARR 为 $205 million；但留存的一手融资文件没有披露估值或
              经审计收入。这些数字可作为方向性背景使用，不能在没有后续尽调的情况下当作硬事实。
