  - id: TM001
    title: 市场定义和现状替代方案
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 相关性
    rows:
      - - 统一法律工作流操作系统
        - 进件、事项或案件管理、文档、计费、分析和工作流自动化
        - 律师劳务、法院费用、专家支出和非法律企业软件
        - 律所负责人、法律运营或机构法律领导层
        - 这是 Filevine 最清晰的边界：通过一个事实来源推动法律工作的软件。
      - - 原告诉讼工作流
        - 线索进件、索赔函、取证笔录支持、医疗时间线、客户沟通和案件状态跟踪
        - 媒体购买、专家证人服务、医疗护理和和解款项
        - 管理合伙人或原告业务负责人；由律所经济性支付
        - 原告律所是核心切入口，因为吞吐量和案件复杂性是可见痛点。
      - - 企业内部法律运营
        - 事项跟踪、合同生命周期、法律保全、外部律师协调、报告和预算跟踪
        - ERP、采购系统以及法律之外更广泛的企业工作流平台
        - 总法律顾问或法律运营；由企业法务预算支付
        - 买方更关心合同、控制和可见性，而不是法庭流程。
      - - 公设辩护和检方
        - 案件量管理、截止期限、文件、文档自动化、审计追踪和安全协作
        - 法院 CMS、监狱系统、执法记录系统以及更广泛司法基础设施
        - 办公室领导或机构法律管理层；由拨款预算支付
        - 政府买家需要合规密集型工作流控制，而不是消费者式 SaaS 便利性。
      - - 州、市和联邦法律团队
        - 调查、合规、法律建议、合同、文档、任务和运营工作流
        - 法律运营之外的通用机构 IT 现代化
        - 机构法律领导层和采购
        - 这些细分将 Filevine 扩展到原告律所以外，但销售周期更慢、更重信任。
      - - 现状替代栈
        - 纸质文件、电子邮件、电子表格、点工具、断开的存储库和定制机构系统
        - 虚构的单一供应商基线
        - 合伙人、法律运营、财务和 IT 之间的多个所有者
        - Filevine 通常对抗的是碎片化，而不是单一直接替代品。
    notes: 纳入支出是与法律工作执行相关的工作流软件支出；排除支出处于软件系统记录边界之外。
