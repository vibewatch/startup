      - number: '3.3'
        title: 定价、分发与信任差异
        blocks:
          - type: paragraph
            body: >-
              定价透明度是这个格局中最清晰的 GTM 分水岭之一。Clio 和 MyCase 公开按席位计算的入门价，帮助预算敏感买方快速比较工具，并在没有漫长企业销售周期的情况下 从手工工作流迁移。被审阅的 Filevine
              页面不展示公开价格，而是把买方推向演示和平台级定位。Litify、EvenUp、Supio 和 Harvey 在公开材料中也依赖顾问式
              或定制定价，这适合企业或高价值专家型销售，但牺牲了公开标价带来的转化收益。这一区别很重要，因为法律软件决策常常始于办公室经理或小律所合伙人， 他们想替换电子表格、邮件或通用项目工具。透明定价帮助 Clio 和
              MyCase 赢下这些最初对话。


              分发能力同样不均。Clio 的应用生态和产品菜单创造宽广的漏斗顶部触达；MyCase 的 18,000+ 家律所主张意味着它已经有很大的 SMB 装机基础； Litify 靠 Salesforce
              加实施和客户成功服务复合锁定；Harvey 借助精英律所采用和资本实力。Filevine 的答案是广度和工作流整合，但平台仍要克服两个问题： 公开价格清晰度低于 Clio 和 MyCase，企业渠道杠杆也不如
              Litify 或 Harvey 显眼。信任姿态缩小了部分差距。Filevine、Clio、Supio 和 Harvey 都把安全和合规 放在前台，说明买方现在希望 AI
              和工作流供应商先证明隐私、可审计性和数据边界控制，再进入任何功能讨论。
