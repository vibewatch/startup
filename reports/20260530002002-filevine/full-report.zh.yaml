  - id: TV002
    title: 正向论点 / 反向论点表
    columns:
      - 论点
      - 证据锚点
      - 什么会改变判断
    rows:
      - - 正向论点：Filevine 有真实规模和留存，不只是叙事动能。
        - 公开来源支撑近 6,000 家客户、100,000 名法律专业人士、>96% 总留存和 >120% 净美元留存。
        - 如果尽调显示这些留存指标已经衰退，或依赖一小批原告侧律所，则下调判断。
      - - 正向论点：LOIS 和合规工作把公司带出基础案件管理。
        - 官方 LOIS 和安全材料显示，公司有 AI 原生工作流野心，也在推进 SOC 2、HIPAA、CJIS 和 FedRAMP 相关工作，能支撑企业与政府扩张。
        - 只有管理层证明这些能力能转化为可重复的企业签单和持久毛利率提升，才上调判断。
      - - 反向论点：当前估值已经计入可观 AI 溢价。
        - 按最佳公开 ARR 估算，$3B 融资隐含约 14.6x ARR，高于选取的上市工作流软件中位数。
        - 更高的远期 ARR run-rate，或经审计的溢价经济性，才会收窄估值差距。
      - - 反向论点：资本结构和收入质量不透明，仍比增长故事承认的更重要。
        - 公开来源没有披露当前轮次的毛利率、经审计收入结构、优先权、认股权证或二级市场成交。
        - 更清晰的分配瀑布和经审计收入质量包，可能把建议推近跟踪或买入。
    notes: 本表把“好公司”证据和“好价格”证据拆开，确保建议服务于承销判断，而不是被欣赏情绪驱动。
