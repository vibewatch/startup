      - number: '8.5'
        title: 退出准备度和最终尽调
        blocks:
          - type: paragraph
            body: >-
              Filevine 看起来比许多法律 AI 点解决方案更具退出准备度，因为它已经销售多模块平台，面向企业和机构营销，并在合规方面投入颇多。这有助于投资论点。但它没有消除最终尽调负担。公开市场投资者每天都能对
              Procore、Veeva 和 Toast 等透明申报发行人进行基准比较；Filevine 买家无法同样比较利润率、资本结构优先顺位或二级市场清算水平。PM Insights
              公开宣传二级活动、买卖价差比例、共同基金估值和资本结构细节等板块，但实际数字被隐藏。这意味着投资者仍无法判断当前标记是广泛可融资的，还是只是特定财团和时点的结果。最后工作因此必须务实且能影响价格：确认 ARR
              质量、毛利率结构、AI 贡献、优先权瀑布、债务或认股权证悬而未决，以及退出准备的真实状态。在这些项目到手前，Filevine 仍是一家有吸引力但进入价格未经证明的公司。
