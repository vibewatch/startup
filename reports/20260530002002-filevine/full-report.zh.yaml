      - number: '8.4'
        title: 牛市、基准和熊市承销
        blocks:
          - type: paragraph
            body: >-
              情景数学把欣赏转化为纪律。牛市情形假设公开的 $205 million ARR 估计已经在上行方向过时，扩张仍高于当前 >120% 信号，并且 LOIS 驱动的 AI 变现确实使 Filevine 更接近 AI
              溢价平台而非工作流既有者。在那种世界里，接近或略高于当前 $3 billion 标记的价值可以成立。基准情形较不慷慨，并且在今天更符合证据：Filevine
              是强大的垂直平台，但尚不是透明的溢价软件资产。这指向低于当前融资锚点的可支持区间。熊市情形是重新定价故事，而不是运营崩塌。如果增长放缓到公开可比公司常态，如果 AI 被证明更多是辅助而非收入转型，或者如果法律
              AI 泡沫叙事进一步冷却，倍数可能急剧压缩，即使业务仍然健康。这就是为什么当前决定不是“永远避开 Filevine”；而是“在公司成长到该价格或充分开账本证明该价格之前，不要按这个价格承销”。
