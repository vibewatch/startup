  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Filevine 位于法律工作流软件边界内，而不是整个法律服务或横向企业软件宇宙。平台、LOIS 和按执业类型划分的页面显示， 它是一套以事项为中心的技术栈，把线索接入、案件或事项管理、文档、计费、分析、合同和
              AI 辅助连接在同一条记录上。 因此，纳入的支出是与把法律工作推进记录系统相关的软件支出，不包括律师人工、法院费用、专家证人支出、获客媒体投放， 也不包括宽泛
              ERP、通用协作套件或独立电子证据开示服务等每一个相邻品类。真正的替代方案通常是碎片化堆栈：纸张、邮件、
              电子表格、单点执业工具、定制机构系统和彼此断开的文档库。原告律所的切入点是高容量案件吞吐；企业法务是合同和事项控制； 政府则是合规负担重的案量管理。这个边界逻辑很重要，因为宽口径法律软件估算会高估
              Filevine 在没有工作流中心化部署动作时 能现实变现的空间。
