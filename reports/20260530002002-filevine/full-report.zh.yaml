      - number: '1.2'
        title: 创始人、领导层纵深与治理可见度
        blocks:
          - type: paragraph
            body: >-
              Ryan Anderson 是清晰的公开锚点。留存的 2025–2026 年材料持续把他列为联合创始人兼 CEO，外部报道也把他的可信度 归因于直接法律执业经验，而不是泛软件背景。Utah Business
              提供了最干净的留存创始人名单：除 Anderson 外，还列出 Nathan Morris 和已故的 Jim Blake，并把创立年份定在 2014 年。Filevine 自己的关于页面和 2022
              年融资文章强化了同一套起源逻辑： 公司之所以成立，是因为创始人作为执业律师，找不到真正贴合法律工作方式的软件。更广的领导层纵深透明度较低。Filevine 曾在 2022 年公开披露 Scott Brown
              加入担任 CTO、Ian Charles 加入担任 CFO，后续报道也强调公司运营模式从内部实施转向伙伴生态；
              但留存的公开来源仍没有给出干净的现任董事会名单、所有权地图或投资人控制框架。因此，治理不透明是真正的尽调缺口， 不是装饰性免责声明。
