      - number: '5.2'
        title: AI 工作流与运营架构
        blocks:
          - type: paragraph
            body: >-
              可观察的运营模型是一套分层法律工作流。事项和相关记录充当组织主干；文档被摄入 Docs+，通过 OCR 搜索，并由 AIFields 挖掘结构化数据； LOIS 和 AI
              法律助手再利用这些上下文回答问题、起草、红线审阅并推动工作。多个专业模块显示 Filevine 把同一模式应用到法律子工作流： MedChron 把医疗记录转成时间线，Timely
              把触发日期转成特定司法辖区的截止日期，ValidationAI 检查团队推进前某个事项阶段是否真正完成。 公开部署证据指向云交付，而不是本地软件：Filevine
              隐私政策称服务基于云，案件管理材料强调可从任何联网电脑通过浏览器访问，GitHub 和平台页面
              也显示迁移工具和数据迁移表面。强项在于从接入到执行的工作流连续性；弱项是开放材料没有充分披露模型路由、租户隔离或数据驻留设计， 不足以支持技术承销。
