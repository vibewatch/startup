      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              相比早期法律科技供应商，Filevine 的近期融资风险看起来更低，因为公司刚完成一轮很大的股权融资，并配有黏性留存指标。最新官方公告称， Filevine 在 15 个月内通过两轮全股权融资筹集 $400
              million，资金用途包括 AI 产品、产品加速、招聘、GTM 以及加深企业和政府渗透。 Sacra 进一步估算，2025 年组合包括 $260 million Series E 和 $140 million
              D-2 轮，累计一级股权约 $555 million，总融资额显示为 $626.1 million。Artificial Lawyer 也提到此前 2022 年 $108 million
              轮融资，确认公司进入本轮融资周期时已经资本充足。话虽如此， 资本充足性只部分可见。被审阅的公开来源没有披露账上现金、月度资金消耗、现金可支撑月数、债务工具、契约包，甚至没有清楚说明不存在债务。
              实际解读是，新鲜股权很可能降低了即时融资依赖，但承销案例仍缺少财资细节，无法测试下行韧性、下一轮时点，或当前增长中有多少靠高支出买来。
