      - number: '5.4'
        title: 可靠性、支持、安全与合规
        blocks:
          - type: paragraph
            body: >-
              Filevine 的公开信任姿态强于公开可靠性姿态。安全材料描述了正式的风险评估、隐私影响分析、渗透测试、漏洞扫描、员工培训和跨职能安全治理计划； 信任中心发布了面向 FedRAMP
              的交付物和控制库。安全页面还披露了 AWS 上的具体备份机制，包括至少每 15 分钟跨多个可用区和区域做冗余备份， 并使用 AES-256 静态加密。隐私政策和子处理方页面也补充了运营足迹透明度，列出
              AWS、Anthropic、AssemblyAI、Deepgram、CloverDX、Drata 和 Coalfire 等供应商。可靠性更混合。Filevine
              确实维护公开状态页，包含可用性历史、事件类别和订阅提醒；但被审阅的公开来源没有发布数字化 可用性 SLA、服务积分条款或详细公开事后复盘指标。尽调层面，这意味着安全 /
              合规证据对公开来源审阅而言相当强，但服务水平承销仍需要私有材料。
