          coreProducts: Core, Docs+, Vinesign, Periscope, deposition tools, LOIS
          expansionPath: Configuration depth -> full-suite adoption
          trigger: Reduce administrative noise and improve case visibility
        - label: 家事律所
          stage: 细分：家事律所
          entryPoint: Operations and billing improvement search
          coreProducts: Billing, reporting, document generation, intake, payments
          expansionPath: Template build-out -> analytics -> practice-specific workflows
          trigger: Cut labor cost and improve realization
        - label: 移民 / 高客量专科
          stage: 细分：移民专科
          entryPoint: Need for form automation and cross-department coordination
          coreProducts: Case management, document assembly, ImmigrationAI, reporting
          expansionPath: Immigration team -> multi-department adoption
          trigger: Scale filings and motions without adding staff at the same pace
        - label: 政府 / 公共部门
          stage: 细分：政府 / 公共部门
          entryPoint: Security, reporting, and procurement review
          coreProducts: Secure case management, OCR docs, mobile access, reporting
          expansionPath: Agency rollout -> more case types -> wider reporting dependence
          trigger: Need for compliance-ready workflow system and budget visibility
    approximationNotes: 旅程阶段综合客户故事、评论数据和公共部门渠道材料；Filevine 未按细分发布单一官方采用流程。
    claimRefs:
      - CU001
      - CU006
      - CU007
      - CU041
      - CU045
      - CU055
      - CU059
  - id: FU002
    title: 采用与扩张流程
    type: flow
    layout: wide
    summary: 绘制从供应商评估到核心部署、数据集中、AI / 模块扩展和公开倡导的路径。
    data:
      nodes:
        - id: evaluate
          label: 评估供应商
          detail: 潜在客户往往会跑一套咨询式选型流程；Saalfield Shad 在选择 Filevine 的定制能力前， 演示了十多个替代方案。
          tone: neutral
        - id: deploy-core
          label: 部署核心系统
          detail: 律所把案件记录、文档、任务、日历、计费和通信集中到一个记录系统。
          tone: positive
        - id: configure
          label: 配置工作流
          detail: 模板、期限链、基于角色的任务、文档生成和报告会按执业场景定制。
          tone: neutral
        - id: expand
          label: 扩展到模块和 AI
          detail: 随着信心增强，具名账户会采用 DemandsAI、Docs+、ImmigrationAI、取证工具或更广的 LOIS 工作流。
          tone: positive
        - id: advocate
          label: 成为公开倡导者
          detail: 部分客户会出现在案例研究、奖项、网络研讨会或 LEX Summit 演讲席位中。
          tone: positive
        - id: upmarket
          label: 进入企业和政府
          detail: 政府渠道、机构故事和内部法务运营演讲者显示出向高端市场推进的迹象，但公开案例密度仍落后于律所背书。
          tone: warning
      edges:
        - from: evaluate
          to: deploy-core
        - from: deploy-core
          to: configure
        - from: configure
          to: expand
        - from: expand
          to: advocate
        - from: expand
          to: upmarket
    approximationNotes: 该流程描述了从公开客户故事和评论提炼出的常见部署模式，不是披露的逐阶段百分比转化漏斗。
    claimRefs:
      - CU004
      - CU010
      - CU041
      - CU045
      - CU049
      - CU053
      - CU055
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: wide
    summary: 从结果具体性、生产成熟度、新鲜度信号和独立性为最强的具名 Filevine 客户证据打分。
