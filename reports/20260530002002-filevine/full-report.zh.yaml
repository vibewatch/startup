  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: 截至 2026 年，Filevine 面临最高公开风险主题的可能性 / 影响矩阵。
    data:
      columns:
        - 中等影响
        - 高影响
        - 关键影响
        - 生存级影响
      rows:
        - label: 高可能性
          values:
            - 定价摩擦 / 附加模块抵触
            - AI 输出审核负担
            - 事件频率 / 迁移拖累
            - 商品化 + 续约压力
        - label: 中等可能性
          values:
            - 跨境隐私治理
            - FedRAMP 边界缺口
            - 第三方 AI / 供应商暂停
            - 特权数据暴露
        - label: 较低可能性
          values:
            - 仲裁争议复发
            - 收购整合滑坡
            - 监管执法事件
            - 政府 / 客户信任冲击
    approximationNotes: 可能性和影响是基于当前公开证据得出的分析估计；不是 Filevine 提供的风险评分。
