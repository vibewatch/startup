- id: TU006
  title: Expansion and concentration risk table
  columns:
  - driver / risk
  - evidence
  - impact
  - diligence path
  rows:
  - - Module and AI upsell engine
    - Existing customers bought more licenses and ancillary products; named accounts add DemandsAI, Docs+, deposition tools, and ImmigrationAI
    - Supports >120% NDR but makes growth partly dependent on continued product quality
    - Request attach rates by module and AI product
  - - Litigation / plaintiff concentration
    - Sacra and Above the Law both point to litigation-heavy customer density
    - A downturn in plaintiff-tech spend could hit a large share of visible references
    - Request ARR split by plaintiff, defense, family, immigration, in-house, and government
  - - Enterprise and government expansion
    - Public named examples exist, but they are fewer than law-firm examples
    - Upmarket thesis may be real but still under-proven publicly
    - Request named top enterprise and public-sector accounts with ACV bands
  - - Customization-driven onboarding
    - Saalfield Shad demoed more than a dozen tools; Burnham webinar centers on build-out and process design
    - Longer sales cycles and heavier services burden can slow net-new wins
    - Request median implementation time and services attach rate
  - - Support, training, and pricing friction
    - GetApp, Software Advice, TrustRadius, and SourceForge all surface setup or support complaints
    - Could depress SMB retention and create negative word of mouth despite strong headline ratings
    - Request support SLA attainment and gross churn for sub-50-seat accounts
  - - Vendor lock-in and data gravity
    - Above the Law warned the expanding bundle can make switching harder over time
    - Helps expansion economics but raises future pricing-power and customer-backlash risk
    - Request pricing history, renewal uplift policy, and win-back data
  notes: Risk register emphasizes customer-side expansion and friction rather than product or legal risk; several issues are supported by indirect signals because Filevine does not disclose cohort-level churn or concentration.
