- id: expansion-friction-and-concentration
  title: Expansion, procurement friction, and concentration risk
  body: 'Filevine''s land-and-expand engine is visible, but so are the frictions that can slow it. Existing customers clearly buy more seats and adjacent modules over time, and named accounts often widen from core matter management into billing, documents, AI drafting, chronologies, depositions, or government-ready workflows. However, the same customization that wins deals also lengthens procurement and implementation. Saalfield Shad demoed more than a dozen alternatives before choosing Filevine for configurability; Burnham''s webinar emphasizes build-out and operating design, not plug-and-play onboarding. Independent review sites repeatedly call out setup complexity, paid integrations, expensive training, slow support, and billing friction. For public-sector buyers, compliance and channel structure add another layer: Carahsoft, CJIS-oriented case studies, and agency security language imply longer and more formal sales cycles than SMB law-firm adoption. Strategically, the biggest concentration
    risk is that the loudest public references still come from plaintiff and litigation firms. Filevine is clearly moving upmarket into enterprise and government, but the public density of outcome-backed enterprise logos still lags the density of law-firm references. That matters because concentration can hide inside otherwise strong NDR if the same litigation-heavy cohort keeps buying more products.'
