  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-coverage
    missingEvidence: A comprehensive, dated list of active named customers by segment with deployment status, start date, and product bundle.
    whyItMatters: Without a full population, public case studies can overrepresent the happiest and largest accounts and understate concentration or failed deployments.
    diligencePath: Request a current top-100 customer list by ARR plus a broader named-reference roster split by law firm, enterprise, and government.
    relatedQuestionRefs:
    - QU008
    - QU026
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: retention-cohorts
    missingEvidence: Cohort retention, contract length, gross logo churn, and renewal timing by segment and product bundle.
    whyItMatters: Headline GRR and NDR can hide weak cohorts or short contracts if the same successful segment keeps expanding faster than others churn.
    diligencePath: Request cohort tables for SMB, mid-market, enterprise, and government customers, including renewal term, seat growth, and downsell.
    relatedQuestionRefs:
    - QU019
    - QU027
  - type: private-evidence-only
    severity: material
    topic: multi-product-penetration
    missingEvidence: Installed-base product attach rates and the percentage of customers using multiple Filevine modules or AI tools.
    whyItMatters: Expansion is central to the thesis, but public stories show only the best-known accounts and cannot quantify how broad module adoption really is.
    diligencePath: Request attach-rate dashboards by module, AI feature, and customer segment, plus penetration trends over the last eight quarters.
    relatedQuestionRefs:
    - QU028
  - type: private-evidence-only
    severity: material
    topic: top-customer-concentration
    missingEvidence: Revenue concentration by top 10 customers, top segment, and public-sector share.
    whyItMatters: If a narrow litigation cohort or a handful of large accounts drive most expansion, the NDR profile could be less durable than headline metrics suggest.
    diligencePath: Request ARR concentration tables, logo count by segment, and gross retention by the top-customer cohort.
    relatedQuestionRefs:
    - QU023
    - QU026
    relatedTableRefs:
    - TU006
