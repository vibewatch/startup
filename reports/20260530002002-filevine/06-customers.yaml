  title: Customer segmentation table
  columns:
  - segment
  - buyer / user / payer
  - core use case
  - named proof
  - strategic value
  - gap
  rows:
  - - Plaintiff and litigation firms
    - Managing partner / COO buys; attorneys, paralegals, intake, case managers use; firm pays
    - Core case management, demands, documents, deposition prep, billing
    - C&B, Heuser & Heuser, Laffey Bucci, Strong & Hanni
    - Largest visible cohort; drives module upsell and reference density
    - Public materials do not quantify share of revenue or seats by this segment
  - - Defense litigation firms
    - Shareholder or practice leader buys; litigators and legal assistants use; firm pays
    - Matter management, deadlines, deposition summaries, AI case queries
    - Saalfield Shad
    - Shows Filevine works outside pure plaintiff PI
    - Only a small number of named defense references are public
  - - Family law firms
    - Founder / managing partner buys; attorneys, paralegals, billing team use; firm pays
    - Time and billing, reporting, intake, document assembly, payments
    - Burnham Law
    - Proves cross-practice applicability and monetization outside contingency PI
    - Public seat counts and renewal terms are not disclosed
  - - Immigration firms
    - Partner or operations lead buys; attorneys, paralegals, HR, ops use; firm pays
    - Case management, document assembly, ImmigrationAI, reporting
    - Sanabria & Associates
    - High-volume workflow with clear AI automation ROI
    - Public win-rate and retention by immigration cohort are not disclosed
  - - Public sector and quasi-government
    - Agency leadership or county administrators buy; attorneys, field staff, legal ops use; taxpayer-funded entity pays
    - Secure case management, reporting, OCR docs, mobile access, deadline tracking
    - Utah County Public Defenders; large state agency
    - Opens budget-backed, stickier contracts if compliance gates are met
    - Named public-sector roster is still thin and sales cycles are likely slower
  - - Enterprise and corporate legal teams
    - GC or legal ops buys; in-house legal staff and compliance teams use; enterprise budget pays
    - Matter visibility, document handling, analytics, legal ops coordination
    - Adtalem Global Education; SRM Concrete; Utah Jazz / Kroger / Ministry of Ontario cited in company news
    - Upmarket vector beyond law firms
    - Public outcome case studies are much thinner than law-firm references
  notes: Segment map uses current public references, review-platform metadata, and customer stories; Filevine does not publish a formal customer-mix breakdown by revenue or seat count.
