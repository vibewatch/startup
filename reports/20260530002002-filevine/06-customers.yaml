callouts:
- calloutType: strength
  title: Durability signals are unusually strong for a private legal-tech vendor
  body: 'Public retention disclosures are strong by private SaaS standards: >96% gross retention on Filevine Core and >120% net dollar retention in 2025, with even higher 2023 NDR disclosures. Named customers also show obvious multi-product expansion paths rather than one-module use.'
  claimRefs:
  - CU036
  - CU037
  - CU038
  - CU039
  - CU041
  - CU042
- calloutType: risk
  title: Customer proof is deep but mostly company-curated
  body: Filevine has many named case studies and fresh advocacy signals, but the best ROI numbers still come from Filevine-hosted pages, webinars, or conference channels. That means the chapter can confirm production use and outcome direction, but not independently verify the magnitude of the ROI claims.
  claimRefs:
  - CU051
  - CU052
  - CU053
  - CU054
  - CU056
- calloutType: risk
  title: Implementation, support, and lock-in are the main customer-side risks
  body: Independent review sites consistently surface slow support, setup complexity, training cost, and integration friction. Above the Law adds a strategic warning that Filevine's broader workflow bundle can increase switching costs and eventually give the vendor more pricing leverage over dependent customers.
  claimRefs:
  - CU045
  - CU046
  - CU047
  - CU048
  - CU049
