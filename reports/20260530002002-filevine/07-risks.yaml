  evidenceGaps:
  - type: missing-source
    severity: material
    topic: cloud-concentration
    missingEvidence: A current product-by-product map of Filevine cloud, storage, and identity vendors plus spend / traffic concentration.
    whyItMatters: Without provider concentration, investors cannot judge how much outage or vendor-policy risk is actually single-threaded.
    diligencePath: Request the current subprocessor register, cloud-architecture diagram, and workload concentration by major vendor.
    relatedQuestionRefs:
    - QR014
    - QR027
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: resilience-metrics
    missingEvidence: RTO/RPO targets, disaster-recovery test cadence, penetration-test summaries, and Sev-1 incident postmortems for the last 12 months.
    whyItMatters: Public trust language is not enough to assess whether Filevine can contain a repeat of access, outage, or document-exposure events.
    diligencePath: Request the last 12 months of incident postmortems, DR test results, and third-party security assessment summaries.
    relatedQuestionRefs:
    - QR010
    - QR011
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: material
    topic: financial-visibility
    missingEvidence: Current ARR, gross margin, services margin, burn, and net-retention data by product and customer segment.
    whyItMatters: The $400 million raise and enterprise push create valuation pressure that cannot be underwritten from company narrative alone.
