- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Privileged-data / AI security failure
    - New public incident involving confidential legal data or AI-connected workflow exposure
    - Any repeat of a Box-like exposure or any multi-tenant incident
    - Pause underwriting until root-cause, blast-radius, and control redesign evidence is reviewed
  - - Compliance-scope gap
    - FedRAMP or comparable enterprise boundary stalls
    - No expansion beyond current Low-impact scope by next major government expansion milestone
    - Treat public-sector / enterprise moat claims as unproven and haircut multiple support
  - - Reliability erosion
    - Sev-1 access or core-workflow incidents remain frequent
    - Two or more major access/reliability incidents in a rolling quarter
    - Assume renewal drag and higher services burden; revisit growth and margin assumptions
  - - Provider dependency shock
    - AI vendor suspension or major subprocessor change
    - Material change to model-provider terms, availability, or privacy commitments
    - Re-score Filevine AI feature durability and request contingency-provider plan
  - - Packaging / renewal pressure
    - Customer complaints or reviews increasingly emphasize hidden fees and complex automation
    - Meaningful increase in discounting, implementation concessions, or AI add-on pushback
    - Model lower net retention and slower upsell in 2026-2027
  - - Execution / leadership concentration
    - Key executive departure or acquisition integration miss
    - CEO/CISO transition, Czech hiring miss, or stalled Pincites / Parrot integration milestones
    - Escalate diligence on bench depth, roadmap ownership, and board intervention capacity
  notes: These triggers are monitoring heuristics derived from current public evidence; they should be converted into diligence requests and post-investment reporting KPIs.
