      "body": "The strongest overview signal is breadth anchored to one system of record: matters, documents, billing, analytics, AI, and government-ready workflows are all being sold as one platform. That helps explain why the 2025 investor group backed a large all-equity raise instead of treating Filevine as a narrow workflow add-on.",
