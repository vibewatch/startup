  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Filevine presents as an AI-native legal operations and case-management platform anchored in Salt Lake City, with a product stack that spans matters, documents, billing, analytics, and government-ready security. Public evidence strongly supports the 2025 $400 million all-equity financing, 2022 $108 million round, and 2025-2026 scale claims around 6,000 customers and 100,000 users, but valuation, current headcount, governance, and primary financial disclosure remain materially less transparent."
  },
  "sections": [
    {
      "id": "identity-product-and-footprint",
      "title": "Identity, platform scope, and operating footprint",
      "body": "The retained primary sources make Filevine's category shift unusually visible. The homepage and LOIS materials no longer pitch a generic practice-management tool; they frame Filevine as legal AI and legal operating intelligence for complex legal work. That framing is credible because the product surface is broad even before the AI layer is added. Filevine's own product pages show one platform spanning case management, document assembly, document management, billing, payments, analytics, and government-grade workflows, while the LOIS page explains how those underlying records are used to generate grounded answers, drafts, and workflow actions. Headquarters are easier to verify than economics: the contact page gives a Salt Lake City headquarters and four additional office locations, while the 2025 funding announcement adds a global-office descriptor. Scale is directionally strong but not perfectly synchronized across official surfaces. The about page mixes newer scale tiles with older narrative copy, so customer and workforce counts need date labels rather than blind averaging.",
