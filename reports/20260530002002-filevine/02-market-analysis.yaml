'company':
  'name': 'Filevine'
'chapter':
  'number': 2
  'title': 'Market Analysis'
  'summary': 'Filevine sells into a real but boundary-sensitive legal-workflow software market that spans plaintiff law firms, government legal teams, and in-house departments. Public evidence supports a sizable outer shell and strong 2026 AI-driven demand, but category definitions, opaque pricing, and missing segment data prevent a clean SAM or SOM. The investable question is therefore not whether legal-workflow demand exists, but whether Filevine can convert workflow trust, compliance, and AI proof into repeatable segment-by-segment expansion.'
'sections':
- 'id': 'market-boundary'
  'title': 'Market boundary and substitutes'
  'body': 'Filevine sits inside the legal-workflow software boundary rather than the whole legal-services or horizontal enterprise-software universe. The platform, LOIS, and practice-type pages show a matter-centric stack that connects intake, case or matter management, documents, billing, analytics, contracts, and AI assistance across the same record. That means included spend is software spend tied to moving legal work through a system of record. It does not include attorney labor, court fees, expert-witness spend, media buying for lead generation, or every adjacent category such as broad ERP, generic collaboration suites, or standalone e-discovery services. The relevant substitute is usually a fragmented stack: paper, email, spreadsheets, point practice tools, custom agency systems, and disconnected document repositories. For plaintiff firms the wedge is high-volume case throughput; for in-house it is contract and matter control; for government it is compliance-heavy caseload management.
    That boundary logic matters because broad legal-software estimates overstate what Filevine can realistically monetize without a workflow-centered deployment motion.'
