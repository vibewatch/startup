companyProfile:
  summary: |
    Filevine is a Salt Lake City legal-technology company founded in 2014 after Ryan Anderson
    and fellow founders built software for their own law-firm workflow needs. The business now
    positions LOIS as an AI-native legal operating intelligence system spanning intake, matter
    management, document workflows, billing, payments, reporting, and adjacent legal-work tools.
    Public evidence shows Filevine expanding from its plaintiff-law-firm roots into broader law
    firms, government agencies, and enterprise legal teams, supported by a large 2025 equity
    financing and an increasingly compliance-oriented go-to-market motion.
  foundedDate: "2014-01-01"
  founders:
    - name: Ryan Anderson
      role: Co-founder and CEO
      background: Former practicing lawyer who built Filevine after struggling with law-firm software that fit the founders' own workflow.
      claimRefs: [CO023, CO054]
    - name: Nathan Morris
      role: Co-founder
      background: Publicly identified as part of the original founding team in 2026 profile coverage.
      claimRefs: [CO022]
    - name: Jim Blake
      role: Co-founder
      background: Publicly identified as part of the original founding team in 2026 profile coverage.
      claimRefs: [CO022]
  foundingLocation: "Salt Lake City, Utah"
  headquarters: "Salt Lake City, Utah"
  productSummary: |
    Filevine sells a cloud-delivered legal-work platform organized around intake, matter and
    document management, billing and payments, analytics, e-signature, and a growing LOIS AI
    layer. Public product evidence supports real API and integration surfaces, partner-assisted
    implementation, and security/compliance investments, but some deeper architecture and roadmap
    claims remain marketing-led rather than fully transparent.
  customerFocus: |
    Filevine's base remains strongest in plaintiff and litigation-heavy law firms, but public
    references also show deployments in family law, immigration, public-sector legal teams,
    public defenders, and larger enterprise legal environments.
  businessModel: |
    Custom-quoted SaaS subscriptions with per-user licensing and add-on monetization across AI,
    billing, payments, analytics, integrations, and adjacent workflow modules, complemented by a
    certified partner ecosystem for implementations and extensions.
  stage: growth
  fundingStatus: "$400M all-equity financing in 2025, following a $108M round in 2022; third-party sources estimate roughly $555M of lifetime primary equity."
  disclosureProfile: private-undisclosed
  claimRefs: [CO021, CO023, CO029, CO054, CE001, CE002, CE017, CI007, CU001, CU006]

summary:
  headline: "Credible legal-workflow leader, but the current ~$3B mark is ahead of public proof on margins, investor terms, and realized AI economics."
  overallScore: 5.9
  recommendation: research-more
