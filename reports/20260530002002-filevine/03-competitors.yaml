    - Status quo substitute
    - Email, Word, spreadsheets, generic workflow tools remain common
    - Cost-sensitive or slow-moving legal teams
    - Low immediate spend and familiar habits
    - Fragmented data, missed deadlines, weak security structure, poor reporting
