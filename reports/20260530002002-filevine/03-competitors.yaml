  - - EvenUp
    - Substitute / PI AI layer
    - 2,000+ PI firms; 10,000 cases processed weekly
    - Personal injury firms
    - Outcome-oriented PI AI from intake through trial
    - Not a full matter, billing, or payments system
  - - Supio
    - Substitute / plaintiff AI layer
    - Plaintiff-law specialist; no public pricing retained
    - Plaintiff law and mass tort firms
    - Connectors/APIs into current systems; strong trust controls
    - Narrower practice-area focus and limited independent ROI validation
  - - Harvey
    - Adjacent substitute / enterprise AI layer
    - $11B valuation; $100M+ ARR; 50 top AmLaw 100 customers reported
