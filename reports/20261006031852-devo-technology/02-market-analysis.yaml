callouts:
  - calloutType: "insight"
    title: "The Architectural Transition from Index-on-Ingest to Streaming Analytics"
    body: "The defining secular shift in security analytics is the departure from traditional index-on-ingest architectures, which introduce 15 to 30 minutes of processing latency and fail during data spikes [CM001, CM005]. Modern security data platforms emphasize indexing at query time and retaining raw events in active hot storage, enabling sub-second threat detection and immediate investigation across historical datasets [CM001, CM008]."
    claimRefs:
      - "CM001"
      - "CM005"
      - "CM008"
  - calloutType: "risk"
    title: "Ingestion Pricing Sensitivity and Observability Overlap"
    body: "Ingest-based pricing models present material adoption barriers as enterprise log volumes expand unpredictably [CM007, CM008]. Customer feedback indicates that organizations often evaluate lower-cost observability tooling like Elasticsearch for non-critical logging workloads, limiting the security data platform's footprint strictly to high-priority compliance and incident detection feeds [CM007, CM008]."
    claimRefs:
      - "CM007"
      - "CM008"
