      - number: '7.2'
        title: Regulatory, legal, and compliance exposure
        blocks:
          - type: paragraph
            body: >
              Devo markets into financial services, where its own page highlights PCI-DSS and GDPR obligations; this
              demonstrates the compliance surface but not compliance with every customer or jurisdiction. The available
              SOC 3 opinion supports that specified controls operated effectively from April 2023 through March 2024,
              while also documenting inherent control limitations and an AWS carve-out. Separately, Trellis reports that
              Simpplr filed a commercial contract complaint in July 2026 and records allegations rather than an
              adjudicated liability. A UK tribunal previously found unfair dismissal while rejecting discrimination,
              victimisation, and harassment claims and reducing compensation by 80%. Direct dockets, current
              registrations, and a newer assurance period are required before assigning monetary exposure or treating
              historical procedure failures as systemic.
            claimRefs:
              - CR001
