  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and Packaging
        blocks:
          - type: paragraph
            body: >-
              Devo packages its cloud-native security operations suite across several core modules designed for
              enterprise security operations centers and managed security service providers. The core offering is Devo
              Intelligent SIEM, which ingests, normalizes, and correlates streaming machine data across heterogeneous IT
              and security environments. To complement core SIEM detection, Devo provides Devo SOAR for automated
              incident response orchestration and Devo UEBA for user and entity behavior anomaly detection. The platform
              interface provides Activeboards, an interactive visualization environment that allows SOC analysts and
              engineers to build visual dashboards, track key performance indicators, and interrogate live or historical
              telemetry using intuitive visual workflows or direct LINQ and SQL syntax. By offering all-inclusive
              subscription packaging based on daily data ingestion volumes rather than compute or indexing tiers, Devo
              positions itself to lower operational complexity for high-volume enterprise environments.
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
