  - id: FM001
    title: Security Data Platform Market Sizing Hierarchy
    type: pyramid
    summary: >-
      Hierarchical breakdown of market sizing tiers from broad cybersecurity analytics down to the target obtainable
      market.
    data:
      items:
        - label: Total Addressable Market (TAM)
          value: Global Cybersecurity Analytics & Operations
          valueNote: >-
            Broad enterprise expenditure on threat detection, logging, and incident response solutions across all
            architectures.
        - label: Serviceable Addressable Market (SAM)
          value: Cloud-Native SIEM & Security Data Platforms
          valueNote: >-
            Hybrid and multi-cloud organizations requiring high-scale ingestion, real-time analytics, and integrated
            automation.
        - label: Serviceable Obtainable Market (SOM)
          value: Vendor-Neutral High-Retention SOC Deployments
          valueNote: >-
            Organizations and MSSPs seeking multi-cloud telemetry correlation without hyperscaler lock-in or legacy
            indexing lag.
        - label: High-Volume Multi-Cloud Tier
          value: Petabyte-Scale Ingestion Enterprises
          valueNote: >-
            Sub-segment of SOM demanding 1PB+ daily ingestion capacity and zero-lag query performance across distributed
            clouds.
        - label: Automated SOC & MSSP Tier
          value: Multi-Tenant Managed Security Providers
          valueNote: >-
            MSSPs and shared SOCs requiring cross-client data segregation, multi-tenant active boards, and integrated
            SOAR playbooks.
        - label: Compliance & Extended Retention Tier
          value: Regulated Long-Term Hot Data Retention
          valueNote: >-
            Financial services and critical infrastructure entities requiring 400-day hot searchable log storage for
            compliance mandates.
    approximationNotes: >-
