  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Multi-tier cloud-native architecture illustrating edge ingestion, event distribution, data storage, and visual
      analytics engines.
    data:
      layers:
        - label: Presentation & Visualization Layer
          detail: Devo Web GUI, Activeboards, LINQ/SQL visual query builders, and RESTful administrative APIs.
        - label: Analytics & Automation Engines
          detail: Correlation Engine, Alert Engine, Aggregation Engine, and Machine Learning modules for anomaly scoring.
        - label: Query Federation & Coordination Layer
          detail: Meta Nodes executing distributed query routing, syntax translation, and multi-tier result aggregation.
        - label: Data Ingestion & Storage Nodes
          detail: >-
            Data Nodes executing independent collectors and query engines, raw disk persistence, and daily immutable
            micro-indexes.
        - label: Traffic Management & Transport
          detail: Devo Event Load Balancers distributing decrypted event streams across scalable commodity data node clusters.
        - label: Edge Collection & Ingestion Layer
          detail: On-premise/hybrid Devo Relays and Devo Cloud Collectors tagging, encrypting, and forwarding machine logs.
