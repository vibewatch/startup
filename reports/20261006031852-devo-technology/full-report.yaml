    title: Devo Technology Commercial Ingestion-to-Revenue Conversion Flow
    type: flow
    summary: >-
      Visual mapping of customer data generation into platform ingestion licensing, infrastructure cost absorption, and
      enterprise gross profit realization.
    data:
      nodes:
        - id: node-enterprise-telemetry
