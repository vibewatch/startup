      - number: '7.3'
        title: Operational, quality, and security execution
        blocks:
          - type: paragraph
            body: >
              Public evidence presents both a mitigation and a product-fit risk. The SOC 3 auditor gave a favorable
              opinion for the stated 2023-2024 period, and a managed-service reviewer reported a 99.85% SLA and rapid
              AWS-backed deployment. The same reviewer said Devo's security operations center and advanced detection
              capabilities needed improvement and were not used for that customer's advanced detections. That is one
              customer account, not a fleet-wide defect rate, but it is a credible diligence lead because detection
              depth is central to the product. Ingestion-based pricing also transfers data-volume discipline to
              customers; unit economics, parser quality, recovery performance, and any post-period incidents remain
              unquantified in the assigned evidence.
