  - id: TE002
    title: Workflow / use-case table
    columns:
      - User Job
      - Current Workflow
      - Devo Solution
      - Measurable Benefit
      - Technical Limitation
    rows:
      - - Security Log Ingestion & Storage
        - Index-on-ingest pipelines with heavy parsing and storage tiering
        - Raw format disk persistence with 10:1 LZ/LZW compression and out-of-band micro-indexing
        - Eliminates ingest bottlenecks and maintains 400 days of active hot storage
        - Requires high-bandwidth network connectivity and AWS/GCP storage resources
      - - Real-Time Threat Detection
        - Periodic scheduled batch queries against centralized relational or inverted indices
        - Continuous stream querying and correlation engine evaluating rules as events arrive
        - Sub-second alert triggering with zero indexing delay on streaming events
        - Correlation rules depend on pre-configured parser definitions
      - - Historical Incident Investigation
        - Retrieving archived logs from cold/warm tiers with slow re-indexing delays
        - Query-time parsing across unified hot storage utilizing LINQ/SQL syntax
        - Searches across 400-day attack chains without re-indexing overhead
        - Complex multi-table queries rely on virtual unions rather than full relational joins
      - - Automated Incident Containment
        - Manual ticket creation and external firewall rule modification
        - Integrated SOAR playbooks triggering automated IOC blocking on firewalls and proxies
        - Reduces mean time to remediate (MTTR) by automating repetitive blocking actions
        - Playbooks primarily trigger on scheduled jobs rather than immediate manual runs
    notes: >-
      Operational workflows and practitioner benefits derived from AWS Marketplace customer evaluations and technical
      documentation; MTTR benefits vary by SOC maturity.
    claimRefs:
      - CE003
      - CE004
      - CE009
      - CE011
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Architecture Layer
      - Role & Components
      - Key Dependencies
      - Technical & Operational Risk
    rows:
      - - Ingestion & Edge Forwarding
        - Devo Relays and Cloud Collectors compress, encrypt, and tag inbound machine data
        - Customer on-premise infrastructure, host VMs, network routing
        - Non-standard database ports (e.g., JDBC 1433, Oracle 1521) require manual configuration
      - - Load Balancing & Distribution
        - Devo Event Load Balancers decrypt data and distribute traffic across data nodes
        - Redundant cloud compute instances, high-throughput network fabrics
        - Single-region network bottlenecks if ingress exceeds configured load balancer capacity
      - - Data & Query Processing
        - Data Nodes hosting independent collector and query engine software processes
        - Multi-core commodity servers (e.g. 64-core), high-speed NVMe flash storage
        - CPU-bound query performance during simultaneous multi-terabyte unindexed scans
      - - Query Routing & Federation
        - Meta Nodes distribute incoming queries to Data Nodes and aggregate virtual results
        - Network latency between meta nodes and data nodes, RHEL host OS
        - Tiered meta-node federation latency when aggregating massive distributed result sets
    notes: >-
      Architecture components and operational dependencies sourced from Devo SOC 3 audit report and technical platform
      datasheet; failure domains depend on customer cloud hosting configuration.
    claimRefs:
      - CE004
      - CE007
      - CE008
      - CE010
