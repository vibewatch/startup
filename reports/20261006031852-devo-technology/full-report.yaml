      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: AWS is both an enabler and a concentration point
            body: >
              The SOC 3 report identifies AWS as the hosting subservice organization but excludes AWS controls from the
              examination; a customer review separately attributes scalability to AWS.
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
          - type: callout
            title: Treat current legal and liquidity status as gating diligence
            body: >
              Do not convert a filed complaint into a liability estimate or historical funding into runway. Require
              direct docket evidence, current cash and burn, debt terms, and the latest assurance package.
            calloutType: recommendation
            claimRefs:
              - CR009
