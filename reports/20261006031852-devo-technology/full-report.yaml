      - number: '4.2'
        title: Unit Economics, Cost Structure, and Margin Drivers
        blocks:
          - type: paragraph
            body: >
              Devo's underlying cost structure is governed by cloud infrastructure expenditures, multi-tenant compute,
              and distributed data indexing workloads managed under its proprietary HyperStream real-time analytics
              technology. Because Devo ingests massive volumes of operational and security telemetry into cloud object
              storage and managed compute clusters, cloud hosting and data egress fees represent the primary components
              of cost of goods sold (COGS). Independent commercial assessments award Devo a Cyborg Score of 8/10,
              synthesizing its platform business model, leadership, and competitive positioning across hundreds of
              enterprise data points.


              However, as a privately held Delaware corporation operating without consolidated public financial
              disclosures, Devo's audited GAAP gross margins, customer acquisition costs (CAC), and net retention rates
              (NRR) remain strictly private. Third-party firmographic evaluations place Devo's annual revenue within the
              $100M to $500M bracket, while classifying the business under Data Centers and Hosting Services (NAICS
              51821). These revenue evaluations are statistical estimates based on filings and headcount models rather
              than audited accounting disclosures. In the UK operational subsidiary (Devo Technology UK Ltd), official
              employment tribunal filings document lean regional operational staffing, expanding from 2 employees in
              January 2020 to 9 by early 2021, illustrating that regional pre-sales and solutions engineering teams are
              deployed to support enterprise sales motions without heavy local administrative overhead.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
