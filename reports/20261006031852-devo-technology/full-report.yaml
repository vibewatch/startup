      - number: '4.3'
        title: Capital Adequacy, Financing Dependency, and Operational Commitments
        blocks:
          - type: paragraph
            body: >
              Devo's capitalization history is anchored by major institutional growth equity rounds, including a $250
              million Series E financing in October 2021 led by TCV alongside General Atlantic, Eurazeo, and existing
              backers Insight Partners, Bessemer Venture Partners, and Georgian. That round valued Devo at $1.5 billion
              and brought total lifetime equity funding past $400 million, while management reported nearly 100%
              year-over-year revenue expansion and over 100% customer growth. Later capital infusions, including a $100
              million Series F led by Eurazeo, brought cumulative equity financing to approximately $500 million at a
              $2.0 billion post-money valuation.


              Despite substantial cumulative funding, Devo's current cash runway, operating cash burn, and debt
              facilities are unverified in the public domain. Material operational liabilities have surfaced through
              adverse commercial litigation. In July 2026, corporate intranet vendor Simpplr, Inc. filed a commercial
              breach of contract lawsuit against Devo Technology, Inc. in Suffolk County Superior Court, Massachusetts
              (Case 2684CV02096), alleging non-payment of multi-year SaaS subscription invoices due in July 2024 and
              July 2025 following automatic renewal. The lawsuit also highlighted that Devo's corporate registration in
              Massachusetts was involuntarily revoked as of December 31, 2024. This vendor litigation reflects working
              capital friction and administrative lapses, reinforcing that formal underwriting requires verified banking
              disclosures, cash burn audits, and cap-table preference terms.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Financial Opacity and Vendor Contract Litigation Challenge Underwriting
            body: >-
              While Devo commands institutional backing and an estimated $100M-$500M revenue scale, its commercial
              profile is clouded by commercial litigation in Suffolk County Superior Court alleging failure to pay
              multi-year software invoices, alongside an involuntary corporate registration revocation in Massachusetts
              as of December 31, 2024. Without audited GAAP gross margins or verified cash runway, investment
              underwriting cannot confirm forward capital adequacy.
            calloutType: risk
            claimRefs:
