      - number: '7.4'
        title: Partner, financing, and execution dependencies
        blocks:
          - type: paragraph
            body: >
              The dependency register separates disclosed facts from investment inferences. AWS is named in the SOC 3
              report; channel and integration expansion is a company-issued objective in a Devo release syndicated by
              General Atlantic; and a company-hosted customer quote describes global analysis without moving data
              outside a country. Those points indicate operating dependencies but do not quantify concentration,
              contractual protections, or portability. Tracxn lists $500 million raised and a $100 million Series F in
              June 2022, while the allocated financing sources disclose neither current cash nor burn. Investors should
              monitor current liquidity, renewal and partner concentration, cloud commitments, and regional
              data-processing terms. A financing need before independently verified operating milestones, or a single
              counterparty becoming operationally irreplaceable, should trigger re-underwriting.
            claimRefs:
