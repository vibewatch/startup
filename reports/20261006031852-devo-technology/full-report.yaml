          description: Enterprise IT, multi-cloud logs, and endpoint sensor feeds ingested via Devo collectors
        - id: node-hyperstream-processing
          label: HyperStream Analytics Processing
          description: Proprietary real-time indexing and correlation engine processing high-throughput telemetry
        - id: node-tiered-saas-subscription
          label: Tiered SaaS Contract Realization
          description: Recurring revenue realized via committed ingestion volume tiers (GB/TB per day) and retention duration
        - id: node-cogs-cloud-infrastructure
          label: COGS & Hosting Deduction
          description: Cloud computing, storage, and networking costs absorbed to support continuous querying and ingestion
        - id: node-operating-expense-allocation
