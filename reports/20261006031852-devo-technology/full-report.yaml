  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Perspective
      - Core Argument
      - Supporting Evidence
      - What Would Change the View
    rows:
      - - Investment Thesis
        - >-
          High-throughput cloud-native logging architecture addresses petabyte-scale SOC analytics demand superior to
          legacy architectures.
        - >-
          Devo HyperStream engine processes petabyte data, supported by major investors including TCV, Insight, and
          Eurazeo.
        - >-
          Independent enterprise benchmark demonstrating substantial latency or cost advantages over next-gen
          competitors.
      - - Investment Thesis
        - >-
          Demonstrated historical ability to double revenue, customer count, and enterprise adoption across regulated
          verticals.
        - Previous announcements documented 100% year-over-year revenue and customer expansion during Series E scale-up.
        - Verification that net revenue retention exceeds 120% across enterprise accounts over trailing twelve months.
      - - Anti-Thesis
        - Substantial valuation overhang from $2.0B peak Series F valuation without updated ARR verification.
        - >-
          Funding aggregators confirm Series F in June 2022 at $2.0B post-money, but no ARR updates released since late
          2024.
        - Audited confirmation that ARR exceeds $150M with sustainable positive free cash flow margins.
      - - Anti-Thesis
        - >-
          Opaque capitalization structure and potential preference stack creating severe dilution and downside risk for
          common equity.
        - >-
          Cumulative equity funding of $481M-$500M raised across 6-7 rounds, with $350M raised in late-stage Series E
          and F.
        - >-
          Receipt of certified cap table showing clean pari passu liquidation structure and minimal participating
          preferred overhang.
    notes: Synthesizes primary growth drivers against structural capital risks based on publicly disclosed funding records.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV006
      - CV011
      - CV012
      - CV014
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Operating & Financial Assumptions
      - Valuation & Multiple Logic
      - Key Risks & Downside Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          ARR scales to $180M-$200M driven by large enterprise SIEM migrations; NRR holds >125%; cash flow reaches
          breakeven.
        - >-
          10.0x EV/ARR forward multiple yields $1.8B-$2.0B enterprise valuation upon public offering or strategic
          acquisition.
        - >-
          Execution failure in enterprise direct sales; renewed platform pricing pressure from consolidated security
          suites.
        - 'Low (15-20%): Requires flawless sales execution and macro acceleration in enterprise cloud security spend.'
      - - Base Case
        - >-
          ARR expands moderately to $100M-$120M; enterprise churn limits NRR to 105-110%; ongoing moderate operating
          burn.
        - >-
          8.0x EV/ARR forward multiple implies $800M-$960M enterprise valuation, representing a 50-60% reset from Series
          F.
        - Down-round recapitalization; management turnover; key customer attrition to cloud hyperscaler native tools.
        - 'Moderate (50-55%): Aligns with broader market multiple compression observed across high-growth cloud peers.'
      - - Bear Case
        - >-
          ARR stalls below $80M; gross margins compress due to cloud infrastructure compute overhead; elevated cash
          burn.
        - >-
          5.0x EV/ARR multiple yields $400M valuation, resulting in complete equity write-down for junior holders after
          debt/preferences.
        - >-
          Liquidity crunch requiring emergency structured financing; loss of key technology leadership; vendor
          consolidation.
        - 'Moderate-High (25-30%): Significant risk given $500M total capital invested and multi-year valuation gap.'
    notes: >-
      Scenario ranges and valuation multiples modeled by diligence author referencing prevailing private cyber comp
      multiples.
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV008
      - CV010
      - CV013
