  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis for Devo Technology centers on its proprietary HyperStream real-time analytics
              engine and cloud-native architecture, which position the platform to ingest petabyte-scale security
              telemetry without the indexing bottlenecks common to legacy SIEM architectures. Supported by tier-one
              growth investors including TCV, Insight Partners, Georgian, Bessemer Venture Partners, General Atlantic,
              and Eurazeo, Devo demonstrated strong historical commercial expansion, doubling revenue and customer count
              in the period leading into its Series E round. Enterprise customers in telecom, financial services, and
              retail leverage Devo as an operational system of truth for security operations center workflows including
              threat detection, SIEM, SOAR, and UEBA. However, the anti-thesis is substantial: Devo's headline $2.0B
              post-money valuation established in June 2022 reflects a frothy software multiple era that lacks
              contemporary ARR validation. Private market aggregators report cumulative funding of $481M to $500M across
              6 to 7 completed rounds, but no audited consolidated GAAP financials or updated ARR metrics have been
              disclosed since late 2024. In the absence of confirmed revenue scale, sustained net revenue retention, and
              gross margin profile, prospective capital faces material downside risk from potential down-round
              repricing, liquidation preference overhang, and intensifying competition from established security giants.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV011
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV011
              - CV012
              - CV014
      - number: '8.2'
        title: Recommendation Stance, Valuation Context, and Financing Structure
        blocks:
          - type: paragraph
            body: >-
              We assign Devo Technology an investment recommendation of track, paired with high risk rating, low
              confidence, and an expensive valuation stance. The company's capitalization history reflects aggressive
              capital accumulation during the 2020 to 2022 cloud market expansion, progressing from a $60M Series D led
              by Georgian in September 2020 to a $250M Series E at a $1.5B post-money valuation led by TCV in October
              2021, and culminating in a $100M Series F led by Eurazeo in June 2022 that priced the business at $2.0B.
              While earlier disclosures highlighted strong top-line momentum—including approximately 100% year-over-year
              revenue expansion and 100% customer account growth under former leadership—the absence of fresh operating
              disclosures creates severe analytical opacity. At the last known estimated run-rate of approximately
              $70.6M ARR from prior diligence periods, Devo's $2.0B valuation would imply an enterprise-value-to-revenue
              multiple approaching 28x, representing an unsustainable premium over current public security software
              medians of 6x to 9x forward revenue. Furthermore, liquidation preference stacks from late-stage preferred
              equity tranches ($350M across Series E and F) introduce severe overhang for common equity and newer junior
              capital unless top-line revenue has scaled past $150M ARR with positive unit economics. Entry discipline
              requires waiting for authenticated price discovery, secondary trade data, or verified financial milestones
              before committing new capital.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV009
              - CV010
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV009
              - CV010
      - number: '8.3'
        title: Scenario Analysis, Comparable Benchmarks, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Evaluating Devo's prospective return distribution requires modeling bull, base, and bear scenarios against
              comparable cybersecurity and enterprise data platforms. In a bull scenario, Devo successfully leverages
              enterprise demand for cloud-native SIEM and SOAR automation, accelerating ARR toward $180M to $200M while
              achieving operating cash flow breakeven. Under a healthy 10x EV/ARR multiple, an enterprise exit or
              initial public offering could yield an enterprise valuation of $1.8B to $2.0B, allowing Series F investors
              to recover capital and generate modest positive returns. In the base case, Devo's ARR grows moderately to
              $100M-$120M amid enterprise budget consolidation and competition from vendors such as Splunk and Palo Alto
              Networks. Applying an 8x multiple implies a fair enterprise value of $800M to $960M, necessitating a 50%
              down-round reset relative to the 2022 peak. In the bear scenario, customer churn and lack of product
              differentiation stall growth below $80M ARR, compressing the multiple to 5x ($400M valuation), triggering
              full preference wipeouts for common shareholders. Crucial pre-investment diligence must prioritize: (1)
              consolidated audited income statement and balance sheet verification, (2) trailing-twelve-month ARR
              breakdown by product and geography, (3) detailed cap-table liquidation preferences across Series E and F
              rounds, and (4) current cash balance, net burn rate, and runway through 2027.
            claimRefs:
              - CV003
              - CV005
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV008
              - CV010
              - CV013
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Entry Discipline and Capital Allocation Guidance
            body: >-
              Prospective investors should refrain from bidding at or near Devo's historic $2.0B headline valuation.
              Until the company provides transparent, audited GAAP financial statements and updated trailing ARR
              metrics, any secondary transaction should demand at least a 50% discount to Series F preference values to
              align with current market software multiples.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV008
              - CV009
              - CV010
          - type: callout
            title: Liquidation Preference and Overhang Warning
            body: >-
              With over $350M invested across Series E and Series F late-stage rounds, the liquidation preference stack
              creates material structural downside for new common or non-senior equity. In an exit below $800M, senior
              preference holders will absorb available proceeds, wiping out junior capitalization.
            calloutType: risk
            claimRefs:
              - CV002
              - CV004
              - CV008
              - CV013
