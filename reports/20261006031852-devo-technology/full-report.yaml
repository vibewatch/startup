      - number: '5.2'
        title: Core Architecture and the HyperStream Engine
        blocks:
          - type: paragraph
            body: >-
              The foundation of the Devo Platform is HyperStream, a proprietary real-time distributed analytics
              technology built for multi-petabyte machine data scale. Devo operates a horizontally scalable, multi-tier
              architecture composed of Data Nodes, Meta Nodes, and proprietary Event Load Balancers hosted within Amazon
              Web Services or Google Cloud Platform environments. Inside each Data Node, two decoupled software
              processes execute independently: collectors receive incoming log streams and write them directly to
              persistent disk in raw, unparsed format, while query engines scan and retrieve data on demand in response
              to user searches. Data is structured by time, tenant, technology, and type, with out-of-band tokenized
              micro-indexes generated asynchronously throughout the day and rendered immutable at day close. Meta Nodes
              manage distributed query routing, translating user syntax, fanning execution across relevant Data Nodes,
              and federating partial results into unified virtual tables without requiring expensive relational database
              joins.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE004
