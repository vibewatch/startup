        - "Partial: expected AWS controls and reported multi-region scalability"
        - "Subservice controls were outside the SOC 3 examination"
        - "Availability, recovery time, ingestion backlog, AWS concentration"
        - "No current resilience test, recovery objective, or portability evidence"
      - - "Control assurance becomes stale or misses a material exception"
        - "Report period ended 2024-03-31"
        - "High for trust-sensitive enterprise sales"
        - "Moderate for the historical period"
        - "No post-period opinion or incident list in the assigned pool"
        - "New SOC report date, exceptions, penetration findings, incident notices"
        - "Current assurance package and exception remediation"
      - - "Advanced detection does not meet sophisticated buyer needs"
        - "One managed-service reviewer reported a limitation"
        - "Medium"
        - "Partial: core ingestion and search were positively reviewed"
        - "Possible feature-workaround burden or buyer churn; prevalence unknown"
        - "Win/loss reasons, module adoption, support tickets, detection efficacy"
