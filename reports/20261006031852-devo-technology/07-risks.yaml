    title: Residual risk evidence heatmap
    type: matrix
    summary: >
      Qualitative comparison of impact, evidence-bounded likelihood, and mitigation maturity for six
      decision-relevant risks.
    data:
      columns:
        - label: Impact
          detail: Potential consequence if the risk materializes.
        - label: Likelihood evidence
          detail: What the assigned public evidence establishes, not a numerical probability.
        - label: Mitigation maturity
          detail: Strength of mitigants visible in the assigned public evidence.
      rows:
        - label: "AWS concentration"
          note: "Named subservice organization with excluded control testing."
          values:
            - label: "High"
            - label: "Dependency corroborated; event probability unknown"
            - label: "Partial"
        - label: "Stale assurance"
          note: "SOC 3 opinion period ended March 2024."
          values:
            - label: "High"
            - label: "Current evidence gap"
            - label: "Historical controls favorable"
        - label: "Contract complaint"
          note: "Allegations are not an adjudicated liability."
          values:
            - label: "Medium"
            - label: "Filing observed; outcome unknown"
            - label: "Unknown"
        - label: "Advanced detection fit"
          note: "Based on one managed-service reviewer."
          values:
            - label: "Medium"
            - label: "Single adverse customer signal"
            - label: "Core platform reviewed positively"
        - label: "Liquidity and financing"
          note: "Funding raised is not cash available."
          values:
            - label: "High until verified"
            - label: "No current cash or burn in assigned evidence"
            - label: "Historical funding only"
        - label: "Partner and regional execution"
          note: "Concentration and fallback terms are undisclosed."
          values:
            - label: "Medium"
            - label: "Strategic reliance disclosed"
            - label: "Global operating claims; contracts unknown"
    approximationNotes: >
      Qualitative analyst ratings only; no loss probability, cash balance, outage rate, or damages amount
      is inferred from the sources.
    claimRefs:
      - CR004
      - CR006
      - CR008
      - CR009
      - CR012
      - CR015
callouts:
  - calloutType: risk
    title: AWS is both an enabler and a concentration point
    body: >
      The SOC 3 report identifies AWS as the hosting subservice organization but excludes AWS controls
      from the examination; a customer review separately attributes scalability to AWS.
    claimRefs:
      - CR003
      - CR004
  - calloutType: recommendation
    title: Treat current legal and liquidity status as gating diligence
    body: >
      Do not convert a filed complaint into a liability estimate or historical funding into runway.
      Require direct docket evidence, current cash and burn, debt terms, and the latest assurance package.
    claimRefs:
      - CR009
      - CR011
      - CR012
