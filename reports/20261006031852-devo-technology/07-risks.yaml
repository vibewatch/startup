  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Public concentration evidence
      - Failure scenario
      - Severity
      - Mitigation and residual exposure
    rows:
      - - "Cloud hosting"
        - "Amazon Web Services"
        - "Cloud data-center hosting for the Security Data Platform"
        - "Named subservice organization; exact spend and portability undisclosed"
        - "Outage, adverse terms, security failure, or delayed capacity"
        - "High"
        - "Expected AWS controls and reported regional scale mitigate; audit carve-out and portability remain"
      - - "Growth capital"
        - "Late-stage investor syndicate"
        - "Financing and governance support"
        - "Historical rounds disclosed; current cash, debt, and preference terms absent"
        - "Down-round, constrained investment, or unfavorable recapitalization"
        - "High until runway is verified"
        - "Large historical funding is a buffer, not proof of cash available; obtain current balance sheet and terms"
      - - "Channel, integration, and regional operating partners"
        - "MSSPs, cloud/integration partners, and local processing arrangements"
        - "Distribution, deployment, integrations, and data-residency execution"
        - "Company emphasizes these relationships; concentration is not quantified"
        - "Partner loss, integration lag, or inability to meet regional requirements"
        - "Medium"
        - "Multi-tenant deployment and global use claims mitigate; contracts, renewal mix, and fallback capacity remain unknown"
    notes: >
      This register does not treat named investors or partners as proof of current support; missing
      concentration, contractual, and financial terms are preserved as diligence gaps.
    claimRefs:
