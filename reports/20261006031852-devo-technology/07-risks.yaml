company:
  name: Devo Technology
chapter:
  number: 7
  title: Risks
  summary: >
    The strongest evidenced risks are AWS concentration, a current contract complaint, stale public
    assurance coverage, and unquantified liquidity after Devo's last disclosed financing in 2022.
    Public controls and customer testimony provide mitigants, but current incident history, cash
    runway, counterparty concentration, and direct legal records remain material diligence gaps.
sections:
  - id: ranked-risk-frame
    title: Ranked risk frame and investment consequences
    body: >
      The highest residual exposure is operational concentration: Devo's 2024 SOC 3 report identifies
      AWS as the cloud-hosting subservice organization and expressly excludes that subservice
      organization's controls from the auditor's examination. A PeerSpot customer review independently
      ties scalability to AWS, corroborating dependence without establishing a quantified outage
      probability. The next tier combines a July 2026 contract complaint, assurance evidence that ends
      in March 2024, and unknown cash runway after the last funding event listed by Tracxn in June 2022.
      The heatmap therefore uses qualitative, evidence-bounded ratings rather than invented probabilities.
      A thesis break would be an unresolved material legal judgment, failure to produce current control
      reports, or evidence that a cloud disruption cannot be contained within contracted recovery terms.
    claimRefs:
      - CR004
      - CR008
      - CR009
      - CR011
      - CR012
    figureRefs:
      - FR001
  - id: regulatory-legal
    title: Regulatory, legal, and compliance exposure
    body: >
      Devo markets into financial services, where its own page highlights PCI-DSS and GDPR obligations;
      this demonstrates the compliance surface but not compliance with every customer or jurisdiction.
      The available SOC 3 opinion supports that specified controls operated effectively from April 2023
      through March 2024, while also documenting inherent control limitations and an AWS carve-out.
      Separately, Trellis reports that Simpplr filed a commercial contract complaint in July 2026 and
      records allegations rather than an adjudicated liability. A UK tribunal previously found unfair
      dismissal while rejecting discrimination, victimisation, and harassment claims and reducing
      compensation by 80%. Direct dockets, current registrations, and a newer assurance period are
      required before assigning monetary exposure or treating historical procedure failures as systemic.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR008
      - CR009
      - CR010
    tableRefs:
      - TR001
  - id: operations-quality-security
    title: Operational, quality, and security execution
    body: >
      Public evidence presents both a mitigation and a product-fit risk. The SOC 3 auditor gave a
      favorable opinion for the stated 2023-2024 period, and a managed-service reviewer reported a
      99.85% SLA and rapid AWS-backed deployment. The same reviewer said Devo's security operations
      center and advanced detection capabilities needed improvement and were not used for that
      customer's advanced detections. That is one customer account, not a fleet-wide defect rate, but it
      is a credible diligence lead because detection depth is central to the product. Ingestion-based
      pricing also transfers data-volume discipline to customers; unit economics, parser quality,
      recovery performance, and any post-period incidents remain unquantified in the assigned evidence.
    claimRefs:
      - CR002
      - CR003
      - CR004
      - CR005
      - CR006
      - CR007
      - CR014
      - CR015
      - CR016
    tableRefs:
      - TR002
  - id: dependencies-finance-triggers
    title: Partner, financing, and execution dependencies
    body: >
      The dependency register separates disclosed facts from investment inferences. AWS is named in the
      SOC 3 report; channel and integration expansion is a company-issued objective in a Devo release
      syndicated by General Atlantic; and a company-hosted customer quote describes global analysis
      without moving data outside a country. Those points indicate operating dependencies but do not
      quantify concentration, contractual protections, or portability. Tracxn lists $500 million raised
      and a $100 million Series F in June 2022, while the allocated financing sources disclose neither
      current cash nor burn. Investors should monitor current liquidity, renewal and partner
      concentration, cloud commitments, and regional data-processing terms. A financing need before
      independently verified operating milestones, or a single counterparty becoming operationally
      irreplaceable, should trigger re-underwriting.
    claimRefs:
      - CR004
      - CR011
      - CR012
      - CR013
      - CR014
      - CR015
    tableRefs:
      - TR003
tables:
