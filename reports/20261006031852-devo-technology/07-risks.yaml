    title: Regulatory / legal risk register
    columns:
      - Risk or matter
      - Jurisdiction and status
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Diligence path or kill criterion
    rows:
      - - "Financial-services privacy and compliance obligations"
        - "Multi-jurisdictional; Devo cites PCI-DSS and GDPR requirements"
        - "High: obligations are inherent to the target use case"
        - "High if controls fail"
        - "Partial: favorable SOC 3 period, but AWS controls were carved out"
        - "Current assurance and customer-specific compliance remain unverified"
        - "Obtain current SOC 2/SOC 3, data-flow maps, exceptions, and regional processing terms; stop if material exceptions remain open"
      - - "Simpplr contract complaint"
        - "Massachusetts Superior Court; complaint filed 2026-07-16"
        - "Observed filing; outcome unknown"
        - "Medium pending direct damages and status"
        - "Unknown from assigned evidence"
        - "Alleged unpaid subscription fees, interest, costs, and a registration issue"
        - "Review direct docket, answer, registration record, invoices, and reserves; re-underwrite if liability is material or controls failed"
      - - "Collins employment tribunal"
        - "United Kingdom; judgment following February 2022 hearing"
        - "Historical finding"
        - "Low-to-medium as a governance signal"
        - "Unknown; no remediation evidence in assigned pool"
        - "Unfair-dismissal procedure failure, offset by rejected discrimination claims and 80% compensation reduction"
        - "Review subsequent claims and HR remediation; escalate if similar procedural findings recur"
    notes: >
      Partial public-source register, ordered by assessed residual severity; likelihood and severity are
      qualitative analyst judgments tied to the cited facts, not quantified probabilities or legal advice.
    enumerationScope:
      coverage: partial
      basis: >
        The assigned pool covers identified compliance material and two public legal matters, not every
        jurisdiction, claim, regulator, corporate registration, or confidential settlement.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR008
      - CR009
      - CR010
