evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-operating-scale
    missingEvidence: Current revenue, ARR, gross margin, customer count, headcount, cash balance, debt, burn rate, and runway.
    whyItMatters: >-
      Historical growth rates and a 2022 financing mark cannot establish current scale, capital adequacy, or valuation
      support.
    diligencePath: >-
      Obtain audited financial statements, monthly management accounts, ARR and customer bridges, payroll records, debt
      schedules, and a cash-runway model.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: current-leadership-and-governance
    missingEvidence: >-
      Founders, founding date, current executives, full board and committee roster, ownership percentages, preference
      stack, voting rights, debt, and secondaries.
    whyItMatters: >-
      Historical executive names and investor participation do not establish current control, succession coverage,
      key-person dependence, or downside economics.
    diligencePath: >-
      Review formation records, the current capitalization table, charter and bylaws, board minutes, voting agreements,
      financing documents, and executive agreements.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: minor
    topic: funding-total
    missingEvidence: >-
      A reconciled financing ledger explaining Devo's more-than-$500-million statement versus Tracxn's exact $500
      million total.
    whyItMatters: The difference affects capitalization precision and may reflect rounding, omitted financing, or database coverage.
    diligencePath: >-
      Reconcile cash proceeds, primary versus secondary consideration, and all debt or strategic investments against
      executed financing documents.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: legal-status
    missingEvidence: Current disposition of the Simpplr complaint and current Massachusetts corporate registration status.
    whyItMatters: >-
      A filed complaint is not an adjudication, and a historical revocation reference does not prove that the
      registration remains unresolved.
    diligencePath: >-
      Obtain the complete court docket, company response, settlement or judgment records, and a current Massachusetts
      certificate of good standing.
    relatedQuestionRefs:
      - QO008
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Third-party market share percentages and specific dollar TAM/SAM/SOM breakdown for Devo Technology within the
      global SIEM market
    whyItMatters: >-
      Independent revenue and market share sizing are required to objectively assess market penetration and growth
      potential relative to public competitors like Splunk and Microsoft
    diligencePath: >-
      Obtain published Gartner Market Share: Security Operations or IDC Worldwide SIEM Software market sizing reports
      and private financial disclosures
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: realized-win-loss-rates
    missingEvidence: >-
      Audited enterprise win/loss records and head-to-head migration telemetry comparing Devo directly against Splunk
      and Microsoft Sentinel.
    whyItMatters: >-
      Direct enterprise displacement claims are heavily self-reported by vendors; independent win/loss ratios are
      required to measure true moat durability.
    diligencePath: >-
      Review blinded customer procurement decisions, RFP outcome scorecards, and customer references via Gartner or
      PeerSpot reviews.
    relatedQuestionRefs:
      - QP006
  - type: missing-source
    severity: minor
    topic: enterprise-discounting-data
    missingEvidence: Realized enterprise net pricing data and volume discounting tables across multi-terabyte daily ingestion tiers.
    whyItMatters: Vendor list comparisons do not reflect effective post-discount TCO in competitive head-to-head enterprise bids.
    diligencePath: >-
      Examine sanitized reseller and channel partner quotes, procurement filings, and enterprise master service
      agreements.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Audited statement of cash flows, current cash balance, monthly cash burn rate, and committed debt facility
      agreements.
    whyItMatters: >-
      Determines whether Devo requires near-term external capital or debt restructuring to sustain high-throughput cloud
      infrastructure operations.
    diligencePath: Request monthly management accounts, banking facility statements, and 2025-2026 cash flow projections under NDA.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Consolidated GAAP gross margin schedule, cloud hosting cost breakdown, and cohort net revenue retention (NRR)
      figures.
    whyItMatters: >-
      Validates whether Devo's ingestion-based pricing covers data egress and compute hosting expenses with durable
      software-grade gross margins.
    diligencePath: >-
      Obtain audited financial statements, cloud infrastructure billing statements, and cohort NRR analysis from
      management.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: support-and-feature-gaps
    missingEvidence: >-
      Third-party audited support SLA achievement data and product roadmap timelines for native network traffic analysis
      capabilities.
    whyItMatters: >-
      Enterprise SOC operations require guaranteed response times for high-severity incidents, and network traffic
      analysis is increasingly critical for comprehensive detection.
    diligencePath: >-
      Request customer support SLA tier documentation, ticket resolution metrics, and the formal 2026-2027 product
      engineering roadmap during management diligence.
    relatedQuestionRefs:
      - QE009
  - type: private-evidence-only
    severity: minor
    topic: infrastructure-efficiency-claims
    missingEvidence: >-
      Independent laboratory or analyst benchmark validating Devo's 75% hardware savings claim against current versions
      of Splunk and Elasticsearch.
    whyItMatters: >-
      Hardware reduction assertions are derived from company whitepapers and have not been validated by independent
      technical auditors under enterprise workloads.
    diligencePath: >-
      Obtain customer POC benchmarking logs comparing Devo and competitor compute/storage footprints under identical
      event ingestion rates.
  - type: private-evidence-only
    severity: material
    topic: customer-retention
    missingEvidence: Audited gross retention rate (GRR), account-level churn data, and cohort expansion curves.
    whyItMatters: Without audited GRR and churn metrics, durability of Devo 120% NRR cannot be verified against logo attrition.
    diligencePath: Request customer cohort retention schedules and annual churn history during formal diligence.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU002
      - TU003
  - type: enumeration-incomplete
    severity: material
    topic: regulatory legal risk register
    missingEvidence: >-
      A complete jurisdiction-by-jurisdiction inventory of litigation, regulatory inquiries, licenses, registrations,
      privacy obligations, and settlements.
    whyItMatters: >-
      The public pool supports only a partial register, so legal exposure and remediation patterns cannot be
      exhaustively assessed.
    diligencePath: >-
      Obtain counsel's litigation schedule, regulator correspondence, current entity registrations, privacy assessments,
      and direct dockets for identified matters.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: counterparty-concentration
    missingEvidence: >-
      Customer, channel, integration-partner, cloud-spend, and reseller concentration with renewal terms and fallback
      capacity.
    whyItMatters: A material dependency could amplify churn, distribution, pricing, or service-continuity risk.
    diligencePath: >-
      Request top-20 customer and partner cohorts, revenue and pipeline concentration, cloud commitments, renewal
      schedules, and tested fallback plans.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR003
  - type: stale
    severity: material
    topic: current-assurance-and-incidents
    missingEvidence: >-
      Post-March-2024 SOC reports, exceptions, penetration-test findings, uptime history, security incidents, customer
      notices, and recovery-test results.
    whyItMatters: >-
      Historical control effectiveness does not establish current effectiveness or prove the absence of subsequent
      incidents.
    diligencePath: >-
      Review the latest SOC 2 Type II and SOC 3 reports, bridge letters, incident register, status history, penetration
      reports, and disaster-recovery exercises.
    relatedQuestionRefs:
      - QR010
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: liquidity-and-capital-structure
    missingEvidence: Current cash, monthly burn, runway, debt, preference stack, liquidation terms, and financing plan.
    whyItMatters: >-
      Funding raised is not cash available, and the public record cannot establish capital adequacy or downside
      ownership outcomes.
    diligencePath: >-
      Obtain current audited financials, monthly management accounts, cap table, debt schedule, financing documents, and
      a downside liquidity plan.
    relatedQuestionRefs:
      - QR006
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: unresolved-arr-and-burn
    missingEvidence: Current audited ARR, gross margins, cash burn rate, and remaining treasury balance from the 2022 Series F round.
    whyItMatters: >-
      Without audited ARR or operating cash flow figures, enterprise valuation multiples and balance sheet runway cannot
      be independently verified.
    diligencePath: >-
      Request audited GAAP financial statements, trailing twelve month management accounts, and cash runway projections
      under non-disclosure agreement.
    relatedQuestionRefs:
      - QV008
    relatedTableRefs:
      - TV001
      - TV003
