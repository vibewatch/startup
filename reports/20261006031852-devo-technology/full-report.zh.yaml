              120%，反映出客户摄入量随多年合同增长而带来的显著扩张。历史商业披露称，客户数曾有同比超过 100% 的增长期，企业客户的每日日志量扩展到多 TB 乃至 PB 级。定价采用 12 个月订阅模式，以滚动 30
              天窗口的平均每日数据摄入量为基准，并允许域内用户无限访问，以消除分析师团队的按席位许可成本。但独立市场尽调指出多个逆风：七位数企业合同的销售周期依然漫长，品牌认知落后于传统竞争者，而且自 2024 年末以来
