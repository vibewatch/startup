  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序框架与投资后果
        blocks:
          - type: paragraph
            body: >
              最大剩余敞口是运营集中度：Devo 的 2024 年 SOC 3 报告将 AWS 列为云托管分包服务机构，并明确将该机构的控制排除在审计师检查之外。PeerSpot 客户评价独立地将可扩展性与 AWS
              联系起来，印证依赖关系，但没有证明可量化的宕机概率。下一层风险包括 2026 年 7 月合同诉讼、截至 2024 年 3 月的保证证据，以及 Tracxn 列出的最近一次融资事件（2022 年 6
              月）之后未知的现金跑道。因此，热力图采用受证据约束的定性评级，而非编造概率。若重大法律判断长期未决、无法提供当前控制报告，或证据显示云服务中断无法在合同恢复条款内得到控制，投资论点就会失效。
            claimRefs:
              - CR004
              - CR008
              - CR009
              - CR011
              - CR012
