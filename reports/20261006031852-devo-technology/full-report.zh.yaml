  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 架构层
      - 角色与组件
      - 关键依赖
      - 技术与运营风险
    rows:
      - - 摄入与边缘转发
        - Devo Relay 和 Cloud Collector 压缩、加密并标记传入的机器数据
        - 客户本地部署基础设施、主机 VM、网络路由
        - 非标准数据库端口（例如 JDBC 1433、Oracle 1521）需要手动配置
      - - 负载均衡与分发
        - Devo Event Load Balancer 解密数据，并将流量分发到各数据节点
        - 冗余云计算实例、高吞吐网络架构
        - 如果入口流量超过配置的负载均衡器容量，单区域网络会出现瓶颈
      - - 数据与查询处理
        - Data Node 承载独立的采集器与查询引擎软件进程
        - 多核通用服务器（例如 64 核）、高速 NVMe 闪存存储
        - 同时执行多 TB 未建索引扫描时，查询性能受 CPU 限制
      - - 查询路由与联邦
        - Meta Node 将传入查询分发到 Data Node，并汇总虚拟结果
