      - number: '5.2'
        title: 核心架构与 HyperStream 引擎
        blocks:
          - type: paragraph
            body: >-
              Devo Platform 的基础是 HyperStream，这是一项为 PB 级机器数据打造的专有实时分布式分析技术。Devo 采用水平扩展、多层架构，由 Data Nodes、Meta Nodes 和专有
              Event Load Balancers 组成，运行于 Amazon Web Services 或 Google Cloud Platform 环境。每个 Data Node
              内部有两个解耦的软件进程独立运行：采集器接收传入日志流，并以原始、未解析格式直接写入持久化磁盘；查询引擎按需扫描并检索数据，以响应用户搜索。数据按时间、租户、技术和类型组织，并在全天异步生成脱离主数据的令牌化微索引，于日终变为不可变。Meta
              Nodes 管理分布式查询路由，把用户语法转换为执行计划，在相关 Data Nodes 上分发执行，并将部分结果汇聚为统一虚拟表，无需昂贵的关系数据库连接。
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
