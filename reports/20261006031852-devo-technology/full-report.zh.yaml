      - number: '5.3'
        title: 部署模式、数据摄入与集成生态
        blocks:
          - type: paragraph
            body: >-
              Devo 在 AWS 和 GCP 上以全托管云服务交付平台，同时通过轻量级软件转发器支持混合企业拓扑。为采集本地遥测数据，客户在本地网络或虚拟私有云中部署 Devo
              Relays；中继器先缓冲、标记、压缩并加密日志流量，再通过安全的出站 TLS 隧道转发至云负载均衡器。对于云到云遥测，Devo Cloud Collectors 直接从第三方 API
              和云基础设施服务摄入数据。在实际运营中，安全从业者认为初始设置简单、主流企业防火墙和服务器连接器覆盖广，但也指出混合部署存在集成摩擦。具体而言，Devo Relays 没有为 JDBC 端口 1433 或
              Oracle 端口 1521 等常见数据库监听器提供默认端口配置，需要手动调网络；SOAR 剧本执行也受限于定时批次，不能由分析师临时触发。
            claimRefs:
              - CE009
              - CE010
              - CE011
      - number: '5.4'
        title: 技术差异化与性能经济性
        blocks:
          - type: paragraph
            body: >-
              Devo 的核心技术差异化来自与索引无关的摄入范式，它颠覆了 Splunk 和 ArcSight 等传统 SIEM 平台的常规架构。传统 SIEM
              在摄入时索引机器数据，形成集中且脆弱的倒排索引，消耗大量计算和内存，拖慢持续摄入，并迫使旧数据进入冷存储或冻结存储层。Devo 通过以原始格式持久化数据、采用 10:1 的 LZ/LZW 压缩将磁盘占用减少
              90%，并把解析推迟到查询时，避开这一瓶颈。公司基准测试声称，单个 64 核 Data Node 每天可持续摄入 2 TB，每秒处理最多 1.2 million 个事件，并在 4,000 个并发搜索中每秒执行
              48 million 个查询事件。在长期留存场景中，Devo 维持 400 天的活跃热可搜索数据，使安全团队无需重新索引即可追踪数月攻击链，并据报告为客户节省 10% 至 15% 成本。
            claimRefs:
              - CE005
              - CE006
              - CE012
              - CE013
      - number: '5.5'
        title: 安全架构、合规控制与运营风险
        blocks:
          - type: paragraph
            body: >-
              企业安全和治理控制依据 AICPA Trust Services Criteria 接受审计，Devo 维护一份涵盖安全性、可用性、处理完整性和保密性的 SOC 3 合规报告。Devo
              在多租户云基础设施中严格隔离逻辑租户，防止组织间数据泄漏，并通过有记录的变更控制、事件响应和软件开发生命周期政策限制管理员访问。Devo 不运营实体数据中心，因此平台继承 AWS 和 GCP
              的底层实体安全与数据中心可用性控制；Devo 自身管理云防火墙、租户密钥和主机操作系统安全。显著运营风险包括依赖客户维护中继器、客户对工单响应时间的支持满意度仅约
              7.5/10，以及缺乏原生深度网络流量分析，迫使企业 SOC 依赖补充型网络检测工具。
            claimRefs:
              - CE007
              - CE014
              - CE015
