              - CM005
      - number: '2.3'
        title: 买方画像、采购路径与采用约束
        blocks:
          - type: paragraph
            body: >-
              企业采购安全数据平台时，企业治理层级中存在不同的买方、用户和付款方角色 [CM006, CM010]。经济赞助和预算所有权通常归 CISO 或安全工程副总裁，他们通过降低风险、做好合规审计准备和提高 SOC
              分析师效率来证明资本配置合理性 [CM006, CM010, CM011]。日常用户包括 1 至 3 级 SOC 分析师、威胁猎手和检测工程师，他们直接使用查询控制台、活动看板和自动化剧本 [CM006,
              CM009]。但采用过程面临严重摩擦和企业约束 [CM007, CM012]。按摄入量计费会在安全事件期间遥测激增时造成预算不可预测，促使部分组织限制摄入量，或把非安全工作负载迁移到 Elasticsearch
              等更便宜的平台 [CM007, CM008]。此外，替换现有 SIEM 需要承担高昂切换成本，包括重建自定义检测逻辑、重新设计数据采集器中继和培训安全人员 [CM007,
              CM009]。企业服务合同纠纷和国际子公司的雇佣治理等商业、运营执行风险，也暴露出快速扩张伴随的组织复杂性 [CM013, CM014]。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
