  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现机制
        blocks:
          - type: paragraph
            body: >
              Devo Technology
              是云原生安全数据平台，提供高吞吐量安全信息与事件管理（SIEM）、集中式日志管理，以及安全编排、自动化与响应（SOAR）。其商业架构以经常性软件即服务（SaaS）订阅为核心，把平台访问层级与摄入量许可结合起来。在企业合同中，变现规模主要随每日或年度的
              GB 和 TB 摄入额度增长，使客户可以在分布式 IT 基础设施、云资产和端点传感器中摄入遥测数据，而不因查询频率受到惩罚。


              客户证据显示，企业买方将 Devo 部署为全包 SaaS 分析方案，以实现传统安全运营中心现代化。Bitkub、Ulta Beauty 和 OneMain Financial
              等重点参考客户利用该平台，在多个国家和地区汇聚安全数据流，同时维持本地数据驻留。这些企业部署采用多年期经常性合同，通常按年度或多年承诺计费。2025 年 10 月，Devo 与 DeepSeas
              建立集成式托管检测与响应（MDR）合作关系，商业拓展进一步加速，将渠道分销延伸到采购捆绑式安全分析与第三方运营管理的中型市场和大型企业安全团队。
