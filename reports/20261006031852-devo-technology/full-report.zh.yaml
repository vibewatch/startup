      - number: '4.3'
        title: 资本充足性、融资依赖与运营承诺
        blocks:
          - type: paragraph
            body: >
              Devo 的资本化历史由大型机构成长股权轮次支撑，包括 2021 年 10 月由 TCV 领投的 $250 million Series E，General Atlantic、Eurazeo 以及现有投资人
              Insight Partners、Bessemer Venture Partners 和 Georgian 共同参与。该轮对 Devo 的估值为 $1.5 billion，使累计股权融资超过 $400
              million；管理层同时报告收入同比增长接近 100%、客户数增长超过 100%。之后，Eurazeo 领投的 $100 million Series F 将累计股权融资推至约 $500
              million，投后估值为 $2.0 billion。


              尽管累计融资可观，Devo 当前现金跑道、经营现金消耗和债务额度仍未得到公开证据验证。商业诉讼暴露出重大运营负债。2026 年 7 月，企业内联网供应商 Simpplr, Inc.
              在马萨诸塞州萨福克县高等法院起诉 Devo Technology, Inc. 商业违约（案件号 2684CV02096），指控自动续约后应于 2024 年 7 月和 2025 年 7 月支付的多年 SaaS
              订阅发票未获支付。诉讼还指出，Devo 在马萨诸塞州的公司登记已于 2024 年 12 月 31
              日被非自愿撤销。这起供应商诉讼反映营运资金摩擦和行政疏漏，说明正式投资判断需要经过验证的银行披露、现金消耗审计和股权结构优先权条款。
            claimRefs:
              - CI010
