  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 经营与财务假设
      - 估值与倍数逻辑
      - 关键风险与下行触发因素
      - 概率信号
    rows:
      - - 乐观情景
        - ARR 增长至 $180M-$200M，驱动因素是大型企业 SIEM 迁移；NRR 保持在 >125%；现金流达到盈亏平衡。
        - 10.0 倍 EV/ARR 远期倍数在 IPO 或战略收购时带来 $1.8B-$2.0B 企业估值。
        - 企业直销执行失败；整合后的安全套件重新带来平台定价压力。
        - 低（15-20%）：需要销售执行毫无瑕疵，且宏观环境推动企业云安全支出加速。
      - - 基准情景
        - ARR 温和增长至 $100M-$120M；企业流失率使 NRR 限于 105-110%；经营现金持续适度消耗。
        - 8.0 倍 EV/ARR 远期倍数意味着 $800M-$960M 企业估值，相比 Series F 下调 50-60%。
        - 下轮融资资本重组；管理层更替；关键客户流失至云超大规模厂商的原生工具。
        - 中等（50-55%）：符合高增长云计算可比公司普遍出现的市场倍数压缩。
      - - 悲观情景
        - ARR 停滞在 $80M 以下；云基础设施计算开销挤压毛利率；现金消耗加剧。
        - 5.0 倍 EV/ARR 倍数带来 $400M 估值，在偿还债务和优先权后，初级持有人股权完全减记。
        - 流动性紧张，需要紧急结构化融资；关键技术领导者流失；供应商整合。
        - 中高（25-30%）：考虑到总计 $500M 的资本投入和持续多年的估值缺口，风险显著。
    notes: 情景区间和估值倍数由尽调作者参考当时主流的私营网络安全可比公司倍数建模。
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV008
      - CV010
      - CV013
