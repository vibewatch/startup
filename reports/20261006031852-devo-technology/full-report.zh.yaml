  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、支出范围与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              企业安全数据平台市场覆盖混合云和多云企业环境中的集中式日志汇聚、实时安全遥测关联、合规监控和事件响应运营
              [CM001]。现代企业安全运营中心（SOC）越来越多地采集云工作负载、端点检测与响应（EDR）、身份提供商、网络设备和 SaaS 审计日志的遥测数据 [CM001]。该细分市场纳入的企业支出包括核心 SIEM
              软件订阅、云摄入容量许可、集成式安全编排、自动化与响应（SOAR）能力、用户与实体行为分析（UEBA）模块，以及面向托管安全服务提供商（MSSP）的多租户管理工具 [CM001,
              CM006]。相反，排除项包括通用非安全数据仓储（如企业通用 Snowflake 或 BigQuery 基础设施）、单点漏洞扫描器、端点杀毒客户端许可和专门的人工事件响应顾问费 [CM001,
              CM007]。不部署专用安全数据平台的组织通常依赖现状替代方案，尤其是传统本地 SIEM、Microsoft Sentinel 或 Google Chronicle 等超大规模云厂商原生日志分析器，以及
              Elasticsearch 或 Datadog 等开发者可观测性技术栈 [CM002, CM007, CM008]。
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM006
              - CM007
      - number: '2.2'
        title: 市场规模视角、增长驱动与细分动态
        blocks:
          - type: paragraph
            body: >-
              评估现代安全数据平台的可服务市场，需要把广义网络安全支出拆成不同的可触达层级，而不是依赖单一总量估计
              [CM003]。总可寻址市场（TAM）覆盖更广的企业网络安全分析与运营软件市场，全球组织在其中投入预算，以防护不断扩大的数字攻击面并满足法定数据审计要求 [CM003,
              CM004]。在这一宽口径下，可服务市场（SAM）聚焦于云原生 SIEM、安全分析和自动化 SOC 调查平台，服务具备多云基础设施的中型市场至大型企业 [CM003,
              CM004]。可获得市场（SOM）进一步收窄至正在寻找与厂商无关、按摄入量计费的替代方案的企业 SOC 和 MSSP，这些方案需替代传统重索引 SIEM 和云厂商封闭生态 [CM003, CM004,
              CM008]。市场扩张由多项宏观驱动因素推动：多云安全日志生成量指数级增长、要求保留数月取证数据的监管审计标准趋严，以及通过自动化分诊缩短平均检测时间（MTTD）和平均响应时间（MTTR）的运营要求
              [CM001, CM005, CM009]。
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM008
              - CM009
