        - 独立企业基准测试证明，相较下一代竞争者存在显著的延迟或成本优势。
      - - 投资论点
        - 在受监管行业中，历史上实现收入、客户数和企业采用率翻倍的能力已得到展示。
        - 此前公告记录了 Series E 扩张期收入和客户数同比增长 100%。
        - 验证企业客户过去 12 个月的净收入留存率超过 120%。
      - - 反论点
        - $2.0B 峰值 Series F 估值形成重大估值压顶，但没有更新的 ARR 验证。
        - 融资信息聚合平台确认 Series F 于 2022 年 6 月按 $2.0B 投后估值完成，但自 2024 年末以来没有发布 ARR 更新。
        - 经审计确认 ARR 超过 $150M，且自由现金流利润率持续为正。
      - - 反论点
        - 资本结构不透明，潜在的优先股堆叠可能给普通股带来严重稀释和下行风险。
        - 累计股权融资额为 $481M-$500M，分布于 6-7 轮，其中后期 Series E 和 F 共融资 $350M。
        - 收到经认证的股权结构表，证明清晰的同等顺位清算结构以及极少的参与型优先股压顶。
    notes: 根据公开披露的融资记录，综合比较主要增长驱动因素与结构性资本风险。
