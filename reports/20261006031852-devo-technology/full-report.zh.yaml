      - number: '4.2'
        title: 单位经济、成本结构与利润率驱动因素
        blocks:
          - type: paragraph
            body: >
              Devo 的底层成本结构由云基础设施支出、多租户计算和分布式数据索引工作负载决定，这些工作负载由其自有 HyperStream 实时分析技术管理。由于 Devo
              将海量运营和安全遥测摄入云对象存储及托管计算集群，云托管和数据出口费用构成销售成本（COGS）的主要部分。独立商业评估给 Devo 评出 8/10 的 Cyborg
              Score，综合考察其平台商业模式、领导层和竞争定位，覆盖数百个企业数据点。


              但 Devo 是一家私营特拉华州公司，没有合并公共财务披露，因此其经审计 GAAP 毛利率、客户获取成本（CAC）和净留存率（NRR）仍严格不公开。第三方企业画像评估将 Devo 年收入置于 $100M 至
              $500M 区间，并按数据中心和托管服务（NAICS 51821）归类。这些收入评估基于申报文件和员工数模型，是统计估计而非经审计会计披露。在英国运营子公司 Devo Technology UK
              Ltd，官方就业法庭文件记录其区域运营人员从 2020 年 1 月的 2 人增至 2021 年初的 9 人，说明区域售前和解决方案工程团队被部署来支持企业销售，而本地行政开支并不高。
            claimRefs:
