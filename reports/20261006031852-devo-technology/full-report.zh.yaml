            body: >
              依赖登记表将已披露事实与投资推断分开。SOC 3 报告点名 AWS；General Atlantic 联合发布的 Devo
              新闻稿把渠道和集成扩张列为公司目标；公司托管的客户引语描述了全球分析，但称数据不离开所在国家。这些信息显示运营依赖，但没有量化集中度、合同保护或可移植性。Tracxn 列出累计募资 $500 million 和
              2022 年 6 月的 $100 million Series
              F，而分配到的融资来源既未披露当前现金，也未披露现金消耗。投资人应监测当前流动性、续约和合作伙伴集中度、云承诺以及区域数据处理条款。若在运营里程碑得到独立验证前就需要融资，或某一交易对手变得不可替代，就应重新进行投资判断。
