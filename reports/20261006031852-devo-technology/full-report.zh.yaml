      - number: '2.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 从摄入即索引到流式分析的架构转变
            body: >-
              安全分析最重要的长期转变，是离开传统的摄入即索引架构；后者会带来 15 至 30 分钟处理延迟，并在数据激增时失效 [CM001,
              CM005]。现代安全数据平台强调在查询时索引，并把原始事件保存在活跃热存储中，从而实现亚秒级威胁检测，并能立即调查历史数据集 [CM001, CM008]。
            calloutType: insight
            claimRefs:
              - CM001
              - CM005
              - CM008
          - type: callout
            title: 摄入计费敏感度与可观测性重叠
            body: >-
              随着企业日志量不可预测地增长，按摄入量计费会形成明显的采用障碍 [CM007, CM008]。客户反馈显示，组织经常评估 Elasticsearch
              等低成本可观测性工具来承载非关键日志工作负载，因此把安全数据平台的使用范围严格限制在高优先级合规和事件检测数据流 [CM007, CM008]。
            calloutType: risk
            claimRefs:
              - CM007
              - CM008
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              企业安全数据平台和 SIEM 市场可分为三类竞争群体：传统在位厂商、云原生日志与 SIEM 平台，以及超大规模云厂商生态 [CP001]。Splunk、IBM Security QRadar 和 Micro
              Focus / OpenText ArcSight 等传统分析服务商，在全球企业安全运营中心（SOC）拥有深厚历史客户基础 [CP002]。Sumo Logic、Elastic、Exabeam、Securonix
              和 Logz.io 等云原生平台，直接争夺现代 SaaS 导向的日志摄入、安全分析和自主 SOC 工作流 [CP003, CP004]。此外，以 Microsoft Sentinel 和 Google Cloud
              Chronicle 为代表的超大规模云厂商，利用既有企业协议、原生遥测摄入和捆绑生产力套件，争取新部署及迁移中的企业客户 [CP005]。随着企业攻击面在多云环境中扩大，现代 SOC
              买方会比较摄入延迟、查询响应、总拥有成本（TCO）和自动化案件管理 [CP006]。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
      - number: '3.2'
        title: 能力与架构差异化
        blocks:
          - type: paragraph
            body: >-
              Devo 将其 Security Data Platform 定位在实时搜索、流式分析和自动化检测上，由自有 HyperStream 引擎驱动 [CP007, CP008]。根据厂商发布的对比材料，Devo
              强调即时搜索，避免 Splunk 等传统架构常见的数分钟索引延迟 [CP009]。与单点解决方案和外挂式收购产品相比，例如 Sumo Logic 集成 Jask 或 Exabeam 的索引限制，Devo
              推广统一案件管理、内置威胁搜寻，以及 2026 年推出的原生智能代理日志分析 [CP010, CP011]。但厂商自述的竞争优势必须与独立架构权衡结合评估：Microsoft Sentinel
              等超大规模云方案可在原生云基础设施上无缝开箱摄入，而第三方和本地数据源则需要专用连接器和数据管道配置 [CP012]。
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP007
              - CP008
              - CP009
              - CP010
              - CP015
      - number: '3.3'
        title: 定价、包装与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              与传统 SIEM 厂商常见、会因数据量惩罚客户的摄入层级不同，Devo 强调可预测的全包定价，支持无限查询和分析师席位
              [CP013]。但安全分析领域的企业切换成本仍极高，因为客户已经沉淀了检测规则、自定义遥测解析器、合规报告模板，以及与下游 SOAR 和工单系统的工作流集成 [CP014]。Microsoft Sentinel
              的超大规模云厂商捆绑，以及 Cisco 收购 Splunk，都会对 Devo 这类独立 SIEM 专家形成显著商业压力 [CP015]。此外，通用云数据湖快速把基础日志摄入商品化，迫使安全数据平台持续围绕 AI
              驱动的智能代理分诊和自动调查创新，才能维持软件溢价 [CP016]。
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
