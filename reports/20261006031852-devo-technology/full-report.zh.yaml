  - id: FM001
    title: Security Data Platform 市场规模层级
    type: pyramid
    summary: 将市场规模层级从广义网络安全分析逐层拆解到目标可获取市场。
    data:
      items:
        - label: 总可寻址市场（TAM）
          value: Global Cybersecurity Analytics & Operations
          valueNote: 所有架构下，企业在威胁检测、日志记录和事件响应解决方案上的广泛支出。
        - label: 可服务可寻址市场（SAM）
          value: Cloud-Native SIEM & Security Data Platforms
          valueNote: 需要大规模摄取、实时分析和集成自动化的混合云与多云组织。
        - label: 可服务可获取市场（SOM）
          value: Vendor-Neutral High-Retention SOC Deployments
          valueNote: 寻求多云遥测关联、同时避免被超大规模云厂商锁定或传统索引延迟的组织和 MSSP。
        - label: 高容量多云层
          value: Petabyte-Scale Ingestion Enterprises
          valueNote: SOM 的子细分市场，要求每天摄取 1PB+，并在分布式云之间实现零延迟查询。
        - label: 自动化 SOC 与 MSSP 层
          value: Multi-Tenant Managed Security Providers
          valueNote: 需要跨客户数据隔离、多租户主动看板和集成 SOAR 剧本的 MSSP 与共享 SOC。
        - label: 合规与延长留存层
          value: Regulated Long-Term Hot Data Retention
          valueNote: 需要为合规要求保留 400 天可热搜索日志存储的金融服务和关键基础设施实体。
    approximationNotes: 这是基于功能范围和架构边界划分的概念性市场层级；指定证据池未披露金额。
    claimRefs:
      - CM003
      - CM004
      - CM005
  - id: FP001
    title: 竞争格局定位矩阵
    type: quadrant
    summary: 从架构云原生性和安全分析集成深度两个维度评估主要安全数据与 SIEM 平台。
    data:
      xAxis:
        label: 架构云原生性与实时速度
        min: 0
        max: 10
      yAxis:
        label: 统一 SOC 与分析集成深度
        min: 0
        max: 10
      points:
        - label: Devo Technology
          x: 8.5
          'y': 8
          detail: 实时 HyperStream 引擎与统一的智能代理日志分析平台
        - label: Splunk (Cisco)
          x: 4.5
          'y': 8.5
          detail: 深厚的企业检测能力，但架构依赖传统索引
        - label: Microsoft Sentinel
          x: 8
          'y': 7
          detail: 云原生超大规模厂商部署，并深度集成 Azure 安全生态
        - label: Sumo Logic
          x: 7.5
          'y': 6
          detail: 云原生日志监控，配有收购而来的附加式 SIEM 和案件管理
        - label: Elastic
          x: 6.5
          'y': 6.5
          detail: 由搜索驱动的分析，支持在混合环境中灵活部署
        - label: Exabeam
          x: 5.5
          'y': 6
          detail: 专注行为分析，但独立索引的扩展能力有限
    approximationNotes: 分数是基于厂商架构规格和第三方竞争情报作出的序数评估。
    claimRefs:
      - CP001
      - CP007
      - CP008
      - CP009
      - CP010
      - CP015
  - id: FI001
    title: Devo Technology 商业摄取到收入转化流程
    type: flow
    summary: 可视化展示客户数据生成、平台摄取许可、基础设施成本吸收以及企业毛利实现之间的关系。
    data:
      nodes:
        - id: node-enterprise-telemetry
          label: 企业遥测摄取
          description: 企业 IT、多云日志和端点传感器数据流经 Devo 收集器摄取
        - id: node-hyperstream-processing
          label: HyperStream 分析处理
          description: 专有实时索引和关联引擎处理高吞吐遥测数据
        - id: node-tiered-saas-subscription
          label: 分层 SaaS 合同兑现
          description: 按承诺的摄取量级（每天 GB/TB）和留存期限计收经常性收入
        - id: node-cogs-cloud-infrastructure
          label: COGS 与托管扣除
          description: 吸收云计算、存储和网络成本，以支持持续查询和摄取
        - id: node-operating-expense-allocation
          label: 运营费用分配
          description: 销售、营销、工程和行政运营支出
        - id: node-net-software-gross-profit
          label: 软件净贡献利润率
          description: 可用于支持公司运营和增长的贡献利润
      edges:
        - from: node-enterprise-telemetry
          to: node-hyperstream-processing
          label: 持续数据流
        - from: node-hyperstream-processing
          to: node-tiered-saas-subscription
          label: 用量层级许可
        - from: node-tiered-saas-subscription
          to: node-cogs-cloud-infrastructure
          label: 云基础设施利用
        - from: node-cogs-cloud-infrastructure
          to: node-operating-expense-allocation
          label: 毛利率
        - from: node-operating-expense-allocation
          to: node-net-software-gross-profit
          label: 经营利润实现
    approximationNotes: 流程架构根据客户合同和技术文档所述的商业转化机制建模；具体 COGS 比例属于非公开信息。
    claimRefs:
      - CI001
      - CI002
      - CI005
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 多层云原生架构，展示边缘摄取、事件分发、数据存储和可视化分析引擎。
    data:
      layers:
        - label: 展示与可视化层
          detail: Devo Web GUI、Activeboards、LINQ/SQL 可视化查询构建器和 RESTful 管理 API。
        - label: 分析与自动化引擎
          detail: 关联引擎、告警引擎、聚合引擎以及用于异常评分的机器学习模块。
        - label: 查询联邦与协调层
          detail: Meta Nodes 执行分布式查询路由、语法转换和多层结果聚合。
        - label: 数据摄取与存储节点
          detail: Data Nodes 执行独立收集器和查询引擎、原始磁盘持久化以及每日不可变微索引。
        - label: 流量管理与传输
          detail: Devo Event Load Balancers 将解密后的事件流分发到可扩展的商用数据节点集群。
        - label: 边缘收集与摄取层
          detail: 本地部署 / 混合部署的 Devo Relays 和 Devo Cloud Collectors 为机器日志打标签、加密并转发。
    approximationNotes: null
    claimRefs:
      - CE002
      - CE004
      - CE007
      - CE008
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 企业客户从初步评估、部署、生产扩展到长期合同续约的完整生命周期。
    data:
      items:
        - label: 初步评估
          touchpoints:
            - 传统 SIEM 成本审查
            - 数据量预测
            - 架构 POC
        - label: 上线与摄取
          touchpoints:
            - 数据源集成
            - 解析器配置
            - SOC 分析师培训
        - label: 运营价值
          touchpoints:
            - 实时威胁检测
            - Content Stream 激活
            - 降低误报告警
        - label: 用量扩展
          touchpoints:
            - 多云遥测摄取
            - 无限用户推广
            - 扩大的每日 GB/TB 档位
        - label: 合同续约
          touchpoints:
            - 年度用量重新校准
            - 净留存扩张（约 120% NRR）
            - 长期合作关系审查
        - label: 平台成熟度
          touchpoints:
            - 自主 SOC 采用
            - SOAR 剧本自动化
            - 企业级可观测性
    approximationNotes: 综合 Devo 定价模型、技术上线审查和战略留存基准得出。
    claimRefs:
      - CU005
      - CU007
      - CU008
      - CU013
  - id: FR001
    title: 剩余风险证据热力图
    type: matrix
    summary: |
      对六项与决策相关的风险，比较其影响、证据限定的可能性和缓释措施成熟度。
    data:
      columns:
        - label: 影响
          detail: 风险发生时可能造成的后果。
        - label: 可能性证据
          detail: 指定公开证据所能证明的内容，而非数值概率。
        - label: 缓释成熟度
          detail: 指定公开证据中可见的缓释措施强度。
      rows:
        - label: AWS 集中度
          note: 已指名的子服务组织，且控制测试被排除在外。
          values:
            - label: 高
            - label: 依赖关系已得到佐证；事件概率未知
            - label: 部分
        - label: 鉴证过时
          note: SOC 3 意见期间于 2024 年 3 月结束。
          values:
            - label: 高
            - label: 当前证据缺口
            - label: 历史控制有利
        - label: 合同诉讼
          note: 指控不等于经裁判认定的责任。
          values:
            - label: 中
            - label: 已观察到诉讼；结果未知
            - label: Unknown
        - label: 高级检测适配度
          note: 基于一名托管服务评审者。
          values:
            - label: 中
            - label: 单一不利客户信号
            - label: 核心平台获得正面评审
        - label: 流动性与融资
          note: 已筹融资额不等于可用现金。
          values:
            - label: 在验证前为高
            - label: 指定证据中没有当前现金或现金消耗数据
            - label: 仅有历史融资
        - label: 合作伙伴与区域执行
          note: 集中度和备用条款未披露。
          values:
            - label: 中
            - label: 已披露战略依赖
            - label: 已声明全球运营；合同未知
    approximationNotes: |
      仅为分析师的定性评级；没有根据来源推断损失概率、现金余额、中断率或损害金额。
    claimRefs:
      - CR004
      - CR006
      - CR008
      - CR009
      - CR012
      - CR015
