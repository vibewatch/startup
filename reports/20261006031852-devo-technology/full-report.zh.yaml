      - number: '7.2'
        title: 监管、法律与合规风险
        blocks:
          - type: paragraph
            body: >
              Devo 向金融服务行业销售产品，其自有页面强调 PCI-DSS 和 GDPR 义务；这说明合规范围，但不证明其符合每位客户或每个司法辖区的要求。现有 SOC 3 意见支持指定控制在 2023 年 4 月至
              2024 年 3 月有效运行，同时记录固有控制局限和 AWS 例外。另据 Trellis，Simpplr 于 2026 年 7
              月提起商业合同诉讼，记录的是指控而非已裁判的责任。英国法庭此前认定不公平解雇，同时驳回歧视、受害和骚扰主张，并将赔偿额减少
              80%。在确定金钱敞口，或把历史程序失败视为系统性问题之前，需要直接案卷、当前登记信息和更新的保证期间。
