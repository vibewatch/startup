      - number: '3.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 超大规模云厂商捆绑挤压
            body: 对 Devo 这类独立安全数据厂商的主要结构性威胁，不是替换传统 SIEM 的摩擦，而是 Microsoft Sentinel 等超大规模云平台的引力。它们利用既有企业云承诺和无缝遥测采集，压缩第三方软件预算。
            calloutType: insight
            claimRefs:
              - CP005
              - CP012
              - CP015
          - type: callout
            title: 切换成本与数据管道摩擦
            body: 迁移企业 SOC 运营需要重写数百条自定义检测规则、重新培训分析师，并重新验证监管合规日志。这种高切换摩擦会拉长企业销售周期，即使在位厂商已暴露性能和成本痛点，也能保护其地位。
            calloutType: risk
            claimRefs:
              - CP002
              - CP006
