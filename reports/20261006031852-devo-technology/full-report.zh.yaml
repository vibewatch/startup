      - number: '7.3'
        title: 运营、质量与安全执行
        blocks:
          - type: paragraph
            body: >
              公开证据同时呈现缓解因素和产品匹配风险。SOC 3 审计师对所述 2023-2024 年期间发表了有利意见，托管服务评审者报告 SLA 为 99.85%，并称 AWS 支持的部署迅速。同一评审者表示，Devo
              的安全运营中心和高级检测能力需要改进，且该客户没有使用其进行高级检测。这只是单一客户账户，不是全平台缺陷率，但由于检测深度是产品核心，它仍是可信的尽调线索。按摄入量计费也把数据量管理责任转移给客户；指定证据没有量化单位经济、解析器质量、恢复表现和期末后的任何事件。
