            body: >-
              Devo 面向企业安全运营中心和托管安全服务提供商，将云原生安全运营套件打包为多个核心模块。核心产品 Devo Intelligent SIEM 可在异构 IT
              和安全环境中摄入、规范化并关联流式机器数据。为补充核心 SIEM 检测，Devo 提供用于自动化事件响应编排的 Devo SOAR，以及用于用户和实体行为异常检测的 Devo UEBA。平台界面提供
              Activeboards，这是交互式可视化环境，SOC 分析师和工程师可以用直观的可视化工作流或直接使用 LINQ 和 SQL 语法创建仪表盘、跟踪关键绩效指标并查询实时或历史遥测数据。Devo
              按每日数据摄入量而非计算或索引层级提供全包订阅，旨在降低高数据量企业环境的运营复杂度。
            claimRefs:
