callouts:
  - calloutType: "recommendation"
    title: "Entry Discipline and Capital Allocation Guidance"
    body: "Prospective investors should refrain from bidding at or near Devo's historic $2.0B headline valuation. Until the company provides transparent, audited GAAP financial statements and updated trailing ARR metrics, any secondary transaction should demand at least a 50% discount to Series F preference values to align with current market software multiples."
    claimRefs:
      - "CV002"
      - "CV008"
      - "CV009"
      - "CV010"
  - calloutType: "risk"
    title: "Liquidation Preference and Overhang Warning"
    body: "With over $350M invested across Series E and Series F late-stage rounds, the liquidation preference stack creates material structural downside for new common or non-senior equity. In an exit below $800M, senior preference holders will absorb available proceeds, wiping out junior capitalization."
    claimRefs:
      - "CV002"
      - "CV004"
      - "CV008"
      - "CV013"
