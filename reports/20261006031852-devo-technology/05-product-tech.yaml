chapter:
  number: 5
  title: "Product & Technology"
  summary: "Devo provides a cloud-native security data platform centered on the proprietary HyperStream real-time analytics engine, combining index-independent ingestion, query-time parsing, and 400-day hot retention to support enterprise SIEM and SOAR workloads while introducing reliance on hyperscaler infrastructure and specialized ingest configurations."
sections:
  - id: "product-portfolio-and-packaging"
    title: "Product Portfolio and Packaging"
    body: "Devo packages its cloud-native security operations suite across several core modules designed for enterprise security operations centers and managed security service providers. The core offering is Devo Intelligent SIEM, which ingests, normalizes, and correlates streaming machine data across heterogeneous IT and security environments. To complement core SIEM detection, Devo provides Devo SOAR for automated incident response orchestration and Devo UEBA for user and entity behavior anomaly detection. The platform interface provides Activeboards, an interactive visualization environment that allows SOC analysts and engineers to build visual dashboards, track key performance indicators, and interrogate live or historical telemetry using intuitive visual workflows or direct LINQ and SQL syntax. By offering all-inclusive subscription packaging based on daily data ingestion volumes rather than compute or indexing tiers, Devo positions itself to lower operational complexity for high-volume enterprise environments."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
    tableRefs:
      - "TE001"
      - "TE002"
  - id: "core-architecture-and-hyperstream"
    title: "Core Architecture and the HyperStream Engine"
    body: "The foundation of the Devo Platform is HyperStream, a proprietary real-time distributed analytics technology built for multi-petabyte machine data scale. Devo operates a horizontally scalable, multi-tier architecture composed of Data Nodes, Meta Nodes, and proprietary Event Load Balancers hosted within Amazon Web Services or Google Cloud Platform environments. Inside each Data Node, two decoupled software processes execute independently: collectors receive incoming log streams and write them directly to persistent disk in raw, unparsed format, while query engines scan and retrieve data on demand in response to user searches. Data is structured by time, tenant, technology, and type, with out-of-band tokenized micro-indexes generated asynchronously throughout the day and rendered immutable at day close. Meta Nodes manage distributed query routing, translating user syntax, fanning execution across relevant Data Nodes, and federating partial results into unified virtual tables without requiring expensive relational database joins."
    claimRefs:
      - "CE004"
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE008"
    figureRefs:
      - "FE001"
    tableRefs:
      - "TE003"
  - id: "deployment-and-integration-ecosystem"
    title: "Deployment Models, Data Ingestion, and Integration Ecosystem"
    body: "Devo delivers its platform as a fully managed cloud service across AWS and GCP while supporting hybrid enterprise topologies through lightweight software forwarders. To capture on-premise telemetry, customers deploy Devo Relays within their local networks or virtual private clouds; relays buffer, tag, compress, and encrypt log traffic before forwarding it over secure outbound TLS tunnels to cloud load balancers. For cloud-to-cloud telemetry, Devo Cloud Collectors ingest data directly from third-party APIs and cloud infrastructure services. In operational practice, security practitioners report straightforward initial setup and broad connector coverage across mainstream enterprise firewalls and servers, but highlight integration frictions in hybrid deployments. Specifically, Devo Relays do not provide default port configurations for common database listeners such as JDBC port 1433 or Oracle port 1521, requiring manual network tuning, while SOAR playbook executions are constrained to scheduled batches rather than analyst-triggered ad-hoc runs."
    claimRefs:
      - "CE009"
      - "CE010"
      - "CE011"
  - id: "technical-differentiation-and-performance"
    title: "Technical Differentiation and Performance Economics"
    body: "Devo's core technical differentiation stems from its index-independent ingestion paradigm, which inverts the conventional architecture used by legacy SIEM platforms such as Splunk and ArcSight. Traditional SIEM systems index machine data during ingest, creating centralized, brittle inverted indexes that consume extensive compute and memory, slow down sustained ingest rates, and force older data into cold or frozen storage tiers. Devo avoids this bottleneck by persisting data in raw format, applying 10:1 LZ/LZW compression to achieve a 90% disk footprint reduction, and deferring parsing until query time. Company benchmarks assert that a single 64-core Data Node can sustain 2 TB per day of ingest, process up to 1.2 million events per second, and execute 48 million query events per second across 4,000 concurrent searches. In long-term retention scenarios, Devo maintains 400 days of active, hot searchable data, enabling security teams to trace multi-month attack chains without re-indexing penalties while yielding reported customer cost savings of 10% to 15%."
    claimRefs:
      - "CE005"
      - "CE006"
      - "CE012"
      - "CE013"
  - id: "security-compliance-and-operational-controls"
    title: "Security Architecture, Compliance Controls, and Operational Risk"
    body: "Enterprise security and governance controls are audited under AICPA Trust Services Criteria, with Devo maintaining a SOC 3 compliance report covering Security, Availability, Processing Integrity, and Confidentiality. Devo enforces strict logical tenant segregation across its multi-tenant cloud infrastructure, preventing cross-organization data leakage and restricting administrative access through documented change-control, incident response, and software development lifecycle policies. Because Devo does not operate physical data centers, the platform inherits underlying physical security and data center availability controls from AWS and GCP, while Devo manages cloud firewalls, tenant keys, and host operating system security. Notable operational risks include dependencies on customer relay maintenance, moderate customer support satisfaction ratings around 7.5 out of 10 regarding ticket turnaround times, and the absence of native deep network traffic analysis, which forces enterprise SOCs to rely on supplementary network detection tools."
    claimRefs:
      - "CE007"
      - "CE014"
      - "CE015"
