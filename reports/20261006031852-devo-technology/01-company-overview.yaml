company:
  name: "Devo Technology"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Devo Technology currently describes itself as a Boston-headquartered security data
    platform provider, while its last disclosed priced financing remains a $100 million
    Series F at a $2 billion valuation in June 2022. The assigned evidence establishes
    historical product, financing, scale, and leadership milestones, but not current
    revenue, customers, headcount, founders, executive roster, or capitalization terms.
sections:
  - id: "identity-and-operating-footprint"
    title: "Identity and Operating Footprint"
    body: >-
      Devo describes its offering as a real-time security data platform spanning
      data-powered threat detection, automated case management, autonomous
      investigations, and threat hunting [CO001]. Its technical documentation says the
      platform is powered by HyperStream and combines real-time analytics with AI-assisted
      security workflows [CO001]. The undated official Board and Investors page identifies
      Boston, Massachusetts as headquarters and lists operations in North America, Europe,
      and Asia Pacific [CO002]. This is more current than the June 2022 financing release,
      which described Cambridge as headquarters, so the chapter treats Boston as the
      current company-stated location without inferring when the move occurred. Founding
      date, legal-entity structure, current operating stage, and current location-level
      staffing are not established by the retained source texts and remain diligence gaps.
    claimRefs:
      - "CO001"
      - "CO002"
    tableRefs:
      - "TO001"
  - id: "financing-and-historical-scale"
    title: "Financing and Historical Scale"
    body: >-
      The strongest independently corroborated financing event is the June 2, 2022 Series
      F: Devo, Tracxn, and VentureBeat each report a $100 million round at a $2 billion
      valuation, led by Eurazeo [CO003]. The cumulative total is less precise. Devo said
      the round brought capital raised to more than $500 million, whereas Tracxn reports
      exactly $500 million across seven rounds [CO004, CO005]. The difference may reflect
      rounding or database coverage, but the available evidence does not resolve it.
      Historical scale claims are also dated: Devo said it had surpassed 500 employees in
      2022 and reported nearly 100% annual revenue growth and nearly 100% customer growth
      for the fiscal year preceding the announcement [CO006, CO007, CO008]. None of those
      disclosures establishes current revenue, ARR, customer count, or headcount.
    claimRefs:
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
    tableRefs:
      - "TO003"
    figureRefs:
      - "FO001"
  - id: "leadership-and-governance"
    title: "Leadership and Governance"
    body: >-
      The retained texts provide a historical, not current, view of executive coverage.
      Marc van Zadelhoff was identified as chief executive in the June 2022 company
      announcement and contemporaneous VentureBeat reporting [CO009]. The same company
      announcement identified Gunter Ollmann as chief technology officer and leader of a
      newly formed SciSec team [CO010]. It also said Eurazeo managing director Guillaume
      d'Audiffret joined Devo's board following the Series F, but the assigned Board and
      Investors extract does not expose a current named roster [CO003]. Accordingly, no
      current CEO, founder, independent director, committee structure, ownership
      percentage, or key-person concentration is asserted. Those omissions prevent a
      present-tense assessment of founder-market fit, succession coverage, or investor
      control rights.
    claimRefs:
      - "CO003"
      - "CO009"
      - "CO010"
    tableRefs:
      - "TO002"
  - id: "milestones-adverse-signals-and-open-diligence"
    title: "Milestones, Adverse Signals, and Open Diligence"
    body: >-
      Product and financing evidence shows an expansion agenda rather than proof of
      present operating performance. Devo announced that its Kognos acquisition was
      intended to advance automated threat investigation and its autonomous-SOC roadmap
      [CO011]. Separately, Tracxn records seven financing rounds from November 2013 through
      June 2022 [CO012]. Two legal records add execution risk without establishing a broad
      pattern: a UK Employment Tribunal found Devo Technology UK Ltd unfairly dismissed an
      employee, while rejecting the claimant's race-discrimination, victimisation, and
      race-harassment claims [CO013]; and Trellis reports that Simpplr filed a commercial
      breach-of-contract complaint in July 2026 [CO014]. The latter source also says the
      complaint noted an involuntary Massachusetts registration revocation effective
      December 31, 2024 [CO015]. These are case-specific records; the pending complaint is
      an allegation, and the assigned evidence does not provide its disposition or current
      registration status.
    claimRefs:
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
callouts:
  - calloutType: "risk"
    title: "The $2 billion mark is historical, not a current valuation"
    body: >-
      The $2 billion figure is tied to the June 2022 Series F [CO003]. Without a newer
      priced round, audited operating metrics, secondary transaction, or capitalization
      schedule in the assigned evidence, it should not be presented as a current fair
      value.
    claimRefs:
      - "CO003"
