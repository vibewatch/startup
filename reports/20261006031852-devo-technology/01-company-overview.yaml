  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "current-operating-scale"
      missingEvidence: >-
        Current revenue, ARR, gross margin, customer count, headcount, cash balance, debt,
        burn rate, and runway.
      whyItMatters: >-
        Historical growth rates and a 2022 financing mark cannot establish current scale,
        capital adequacy, or valuation support.
      diligencePath: >-
        Obtain audited financial statements, monthly management accounts, ARR and customer
        bridges, payroll records, debt schedules, and a cash-runway model.
      relatedQuestionRefs:
        - "QO009"
      relatedTableRefs:
        - "TO001"
    - type: "enumeration-incomplete"
      severity: "material"
      topic: "current-leadership-and-governance"
      missingEvidence: >-
        Founders, founding date, current executives, full board and committee roster,
        ownership percentages, preference stack, voting rights, debt, and secondaries.
      whyItMatters: >-
        Historical executive names and investor participation do not establish current
        control, succession coverage, key-person dependence, or downside economics.
      diligencePath: >-
        Review formation records, the current capitalization table, charter and bylaws,
        board minutes, voting agreements, financing documents, and executive agreements.
      relatedQuestionRefs:
        - "QO010"
      relatedTableRefs:
        - "TO002"
        - "TO003"
    - type: "conflicting-data"
      severity: "minor"
      topic: "funding-total"
      missingEvidence: >-
        A reconciled financing ledger explaining Devo's more-than-$500-million statement
        versus Tracxn's exact $500 million total.
      whyItMatters: >-
        The difference affects capitalization precision and may reflect rounding, omitted
        financing, or database coverage.
      diligencePath: >-
        Reconcile cash proceeds, primary versus secondary consideration, and all debt or
        strategic investments against executed financing documents.
      relatedQuestionRefs:
        - "QO004"
      relatedTableRefs:
        - "TO001"
        - "TO003"
    - type: "missing-source"
      severity: "material"
      topic: "legal-status"
      missingEvidence: >-
        Current disposition of the Simpplr complaint and current Massachusetts corporate
        registration status.
      whyItMatters: >-
        A filed complaint is not an adjudication, and a historical revocation reference
        does not prove that the registration remains unresolved.
      diligencePath: >-
        Obtain the complete court docket, company response, settlement or judgment records,
        and a current Massachusetts certificate of good standing.
      relatedQuestionRefs:
        - "QO008"
