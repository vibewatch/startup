callouts:
  - calloutType: "insight"
    title: "The Hyperscaler Bundling Squeeze"
    body: "The primary structural threat to independent security data vendors like Devo is not legacy SIEM replacement friction, but the gravitational pull of hyperscaler platforms like Microsoft Sentinel. Hyperscalers leverage existing enterprise cloud commitments and seamless telemetry capture to compress third-party software budgets."
    claimRefs:
      - "CP005"
      - "CP012"
      - "CP015"
  - calloutType: "risk"
    title: "Switching Costs and Pipeline Friction"
    body: "Migrating enterprise SOC operations requires rewriting hundreds of custom detection rules, retraining analysts, and re-validating regulatory compliance logs. This high switching friction prolongs enterprise sales cycles and protects incumbent vendors despite known performance and cost pain points."
    claimRefs:
      - "CP002"
      - "CP006"
      - "CP014"
