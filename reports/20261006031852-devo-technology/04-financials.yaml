  title: "Financials"
  summary: "Devo Technology monetizes its cloud-native security data platform through ingestion-based subscription pricing, reaching an estimated $100M-$500M revenue bracket with an 8/10 commercial viability rating, yet private financial disclosures leave GAAP gross margin, burn rate, and capital runway opaque for underwriting."
sections:
  - id: "revenue-model-and-pricing-architecture"
    title: "Revenue Model and Monetization Mechanics"
    body: |
      Devo Technology operates as a cloud-native security data platform delivering high-throughput security information and event management (SIEM), centralized log management, and security orchestration, automation, and response (SOAR). Its commercial architecture is structured around recurring software-as-a-service (SaaS) subscriptions, combining platform access tiers with ingestion volume licensing. In enterprise contracts, monetization scales primarily with daily or annual gigabyte and terabyte ingestion allowances, enabling customers to ingest telemetry across distributed IT infrastructure, cloud estates, and endpoint sensors without penalizing query frequency.

      Customer evidence demonstrates that enterprise buyers deploy Devo as an all-inclusive SaaS analytics solution to modernize legacy security operations centers. Key reference accounts, including Bitkub, Ulta Beauty, and OneMain Financial, utilize the platform to consolidate security data streams across multi-national jurisdictions while maintaining local data residency. These enterprise deployments reflect a recurring multi-year contract structure with standard annual or multi-year billing commitments. Commercial traction expanded further through an October 2025 integrated managed detection and response (MDR) partnership with DeepSeas, extending Devo's channel distribution into midmarket and enterprise security teams that procure security analytics bundled with third-party operational management.
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"

  - id: "unit-economics-and-cost-structure"
    title: "Unit Economics, Cost Structure, and Margin Drivers"
    body: |
      Devo's underlying cost structure is governed by cloud infrastructure expenditures, multi-tenant compute, and distributed data indexing workloads managed under its proprietary HyperStream real-time analytics technology. Because Devo ingests massive volumes of operational and security telemetry into cloud object storage and managed compute clusters, cloud hosting and data egress fees represent the primary components of cost of goods sold (COGS). Independent commercial assessments award Devo a Cyborg Score of 8/10, synthesizing its platform business model, leadership, and competitive positioning across hundreds of enterprise data points.

      However, as a privately held Delaware corporation operating without consolidated public financial disclosures, Devo's audited GAAP gross margins, customer acquisition costs (CAC), and net retention rates (NRR) remain strictly private. Third-party firmographic evaluations place Devo's annual revenue within the $100M to $500M bracket, while classifying the business under Data Centers and Hosting Services (NAICS 51821). These revenue evaluations are statistical estimates based on filings and headcount models rather than audited accounting disclosures. In the UK operational subsidiary (Devo Technology UK Ltd), official employment tribunal filings document lean regional operational staffing, expanding from 2 employees in January 2020 to 9 by early 2021, illustrating that regional pre-sales and solutions engineering teams are deployed to support enterprise sales motions without heavy local administrative overhead.
    claimRefs:
      - "CI005"
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI009"
    tableRefs:
      - "TI003"

  - id: "capital-adequacy-and-financing-dependency"
    title: "Capital Adequacy, Financing Dependency, and Operational Commitments"
    body: |
      Devo's capitalization history is anchored by major institutional growth equity rounds, including a $250 million Series E financing in October 2021 led by TCV alongside General Atlantic, Eurazeo, and existing backers Insight Partners, Bessemer Venture Partners, and Georgian. That round valued Devo at $1.5 billion and brought total lifetime equity funding past $400 million, while management reported nearly 100% year-over-year revenue expansion and over 100% customer growth. Later capital infusions, including a $100 million Series F led by Eurazeo, brought cumulative equity financing to approximately $500 million at a $2.0 billion post-money valuation.

      Despite substantial cumulative funding, Devo's current cash runway, operating cash burn, and debt facilities are unverified in the public domain. Material operational liabilities have surfaced through adverse commercial litigation. In July 2026, corporate intranet vendor Simpplr, Inc. filed a commercial breach of contract lawsuit against Devo Technology, Inc. in Suffolk County Superior Court, Massachusetts (Case 2684CV02096), alleging non-payment of multi-year SaaS subscription invoices due in July 2024 and July 2025 following automatic renewal. The lawsuit also highlighted that Devo's corporate registration in Massachusetts was involuntarily revoked as of December 31, 2024. This vendor litigation reflects working capital friction and administrative lapses, reinforcing that formal underwriting requires verified banking disclosures, cash burn audits, and cap-table preference terms.
    claimRefs:
      - "CI010"
      - "CI011"
      - "CI012"
      - "CI013"
      - "CI014"

