              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU003
      - number: '6.3'
        title: Expansion is visible; durability and concentration are not
        blocks:
          - type: paragraph
            body: >-
              Talos shows tangible workflow expansion beyond core crypto execution. Public materials tie the same OEMS
              and RFQ stack to ETF create-redeem workflows, prediction-market trading, and new exchange connectivity
              such as Crypto.com, which supports a land-and-expand thesis inside existing institutional customer
              workflows. The risk is that the same public record is thin on the metrics investors usually want for
              customer durability: net retention, gross retention, churn, renewal cadence, contract length, wallet
              share, and top-customer concentration are not disclosed in the sources reviewed here. Public disclaimers
              also matter: clients still need to negotiate bilateral arrangements with liquidity providers, and some
              workflows are limited to eligible institutional users or non-US persons. Those caveats do not negate
              product-market fit, but they do mean the strongest public evidence today is adoption surface expansion
              rather than proven durability or broad, frictionless deployability.
            claimRefs:
              - CU003
              - CU007
              - CU009
              - CU010
              - CU013
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Named references are better than logo-only proof
            body: >-
              Talos's public customer evidence includes named organizations and workflow-specific quotes, which is
              materially stronger than generic logo placement even though the evidence remains mostly curated by Talos
              or friendly profiles.
            calloutType: strength
            claimRefs:
              - CU002
              - CU003
          - type: callout
            title: Retention quality is still the key missing dataset
            body: >-
              Open sources support breadth of institutional workflow coverage, but they do not establish NRR, churn,
              renewal frequency, or customer concentration, which keeps durability risk open.
            calloutType: risk
            claimRefs:
              - CU007
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              The highest-confidence risk pattern in the assigned evidence is not that Talos lacks product breadth; it
              is that Talos sits in the middle of a partner-heavy institutional workflow whose regulatory and control
              boundary is still easy to misread. Company and partner materials consistently position Talos as software
              infrastructure rather than a broker, while third-party reporting shows Talos expanding into prediction
              markets, tokenized collateral, and additional exchange connectivity. That expansion helps the growth
              story, but it also means legal scope, venue dependency, and control validation matter more than feature
              count. The heatmap and registers therefore rank regulatory perimeter and partner dependence above pure
              feature-execution risk, with disclosure gaps on incident history and financial resilience remaining
              material.
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR008
              - CR012
              - CR014
          - type: figure
