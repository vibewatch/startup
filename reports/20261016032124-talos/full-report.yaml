              - CR009
              - CR010
              - CR011
              - CR013
      - number: '7.3'
        title: Dependency, financial, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Dependency risk is structural because Talos's value proposition is to sit on top of external venues,
              brokers, custodians, lenders, and market-data providers rather than replace them. That architecture can
              scale if the integrations remain reliable, but it also creates concentration and counterparty questions
              that public materials do not quantify. The same is true financially: open sources disclose large financing
              and volume milestones, yet they do not disclose margins, burn, runway, retention, or outage-linked
              customer impact, so there is no public bridge from product breadth to durable economics. A practical
              kill-criteria framework is therefore: (1) any evidence that Talos is treated as taking on regulated
              intermediary duties without matching approvals, (2) any major venue or partner failure that materially
              impairs client workflow, or (3) diligence materials that fail to substantiate uptime, control
              effectiveness, or capital efficiency at the level implied by the current valuation.
            claimRefs:
              - CR002
              - CR007
              - CR008
              - CR011
              - CR012
              - CR013
              - CR014
