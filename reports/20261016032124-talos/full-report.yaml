  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal scores reflect publicly evidenced workflow breadth and institution-first positioning, not benchmarked
      execution quality.
    xAxisLabel: Workflow breadth (1=point solution or substitute, 5=multi-workflow platform)
    yAxisLabel: Institutional-fit signal (1=generic/protocol skew, 5=institution-first)
    data:
