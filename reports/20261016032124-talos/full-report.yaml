    sections:
      - number: '3.1'
        title: Landscape and substitutes
        blocks:
          - type: paragraph
            body: >-
              The assigned pool supports a broad competitive frame rather than one narrow peer set. Tracxn says Talos
              has 92 active competitors and names Orderly Network, Kemet Trading, and Tria among the top set, while a
              separate independent profile argues the practical substitute is often not another branded vendor at all
              but a desk stitching together exchange-native terminals, OTC relationships, and bilateral venue
              connectivity. YesPress adds two more important alternative classes: CoinRoutes as an institutional-routing
              specialist and Wyden as a workflow product for banks and brokerages. That mix matters because Talos is not
              just defending against another crypto OEMS; it is defending against point solutions on one side and
              internal build on the other.
