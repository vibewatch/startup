      - number: '2.2'
        title: Buyers, users, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is multi-sided, but the common thread is operational complexity. Public materials
              consistently position Talos for hedge funds, banks, brokers, asset managers, ETF issuers, payment
              companies, and institutional trading desks that need to work across multiple venues and provider
              relationships. Users are the trading, capital-markets, and operations teams that have to route orders,
              monitor liquidity, settle positions, and reconcile risk across fragmented venues. The payer is usually the
              desk, platform, or business-line owner that bears the cost of maintaining direct venue connectivity and
              supporting client-facing digital-asset workflows. Adoption starts when a firm no longer wants separate
              crypto tooling outside its main operating environment: banks and brokerages want white-label access under
              their own brand, asset managers want create-redeem and RFQ workflows inside existing portfolio processes,
              and private-wealth platforms want digital assets inside the broader client relationship rather than on a
              disconnected external app.
            claimRefs:
              - CM003
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM006
              - CM007
              - CM008
      - number: '2.3'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The assigned pool does not provide an independent TAM, SAM, or SOM estimate specific to institutional
              digital-asset execution and operating platforms, so the chapter cannot defend a single headline
              market-size figure. The usable public evidence is instead a set of constrained sizing proxies that show
              breadth and momentum without proving revenue capture: Talos-linked materials cite 31 countries, 100+
              providers, more than USD 1 trillion of cumulative notional volume, 70+ trading venues, and 60+
              integrations, while the 2026 fundraising release says revenues and client count roughly doubled in each of
              the prior two years. Those data points are directionally useful because they indicate a widening
              institutional workflow footprint, but they are not interchangeable denominators. They do not isolate the
              serviceable paid account base, software budget, or take-rate that would be required for a true TAM/SAM/SOM
              bridge.
            claimRefs:
              - CM002
              - CM009
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM009
              - CM012
      - number: '2.4'
        title: Drivers, constraints, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption drivers are structural. Digital assets are expanding beyond spot crypto into
              tokenized and always-on market workflows, and institutions want that exposure routed through the same
              governance, risk, and settlement controls they already use for mainstream assets. Talos is well positioned
              when venue fragmentation, RFQ complexity, and post-trade workload make direct integrations expensive to
              maintain. The main constraints are also structural: Talos does not collapse counterparty onboarding into a
              single credit relationship, does not eliminate jurisdiction-specific availability limits, and does not
              publish standardized pricing that would let a buyer compare total cost quickly. As a result, the market
              can be described credibly as strategically relevant and expanding, but not as a transparently sized
              software budget category. Underwriting still needs direct diligence on pricing, win rates, and
              segment-level ACV before a valuation case can rely on this market thesis.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM011
              - CM012
