    summary: >-
      The company narrative moves from a 2018 institutional-crypto tooling gap to 2023-2026 product expansion through
      acquisitions, partnerships, and financing.
    data:
      items:
        - date: '2018'
          label: Founding
          detail: >-
            Anton Katz and Ethan Feldman founded Talos after finding institutional crypto-trading infrastructure too
            fragmented to buy.
          tone: positive
          claimRefs:
            - CO001
        - date: '2019'
          label: First trade
          detail: Independent coverage says the first trade passed through the Talos platform in 2019.
          tone: positive
          claimRefs:
            - CO002
        - date: '2021'
          label: Series A
          detail: Publicly disclosed financing included a $40 million Series A round.
          tone: positive
          claimRefs:
            - CO007
        - date: '2022'
          label: Series B
          detail: Publicly disclosed financing included a $105 million Series B round before the later extension.
          tone: positive
          claimRefs:
            - CO007
        - date: '2023'
          label: D3X acquisition
          detail: Talos broadened from execution into portfolio engineering through the D3X Systems acquisition.
          tone: positive
          claimRefs:
            - CO010
        - date: 2024-04
          label: Cloudwall acquisition
          detail: Cloudwall added digital-asset risk technology to the platform footprint.
          tone: positive
          claimRefs:
            - CO010
        - date: 2024-05
          label: Skolem acquisition
          detail: Skolem added institutional DeFi infrastructure to the product set.
          tone: positive
          claimRefs:
            - CO010
        - date: '2025'
