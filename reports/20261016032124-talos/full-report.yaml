      - number: '3.4'
        title: Bottom line on durability
        blocks:
          - type: paragraph
            body: >-
              On current public evidence, Talos looks stronger than a routing-only tool because it layers workflow
              breadth, institutional packaging, and ecosystem connectivity into one surface. That should help it defend
              against status-quo internal builds and against narrower crypto execution vendors. However, pricing
              opacity, conflicting secondary valuation trackers, and the lack of independent desk-level execution
              benchmarking leave a meaningful diligence gap. The competitive conclusion is therefore that Talos appears
              well positioned in institutional digital-asset infrastructure, but the public record proves positioning
              more clearly than it proves durable economic superiority.
