      - number: '1.3'
        title: Milestones, expansion path, and underwriting caveats
        blocks:
          - type: paragraph
            body: >-
              The clearest strategic arc is product broadening around the original execution core. Talos says the
              platform covers portfolio engineering, trading, analytics, treasury, settlement, and liquidity
              connectivity; independent and trade-publication coverage then shows that scope being widened by
              acquisitions and integrations. D3X Systems added portfolio engineering in 2023, Cloudwall added
              digital-asset risk technology in April 2024, Skolem added institutional DeFi infrastructure in May 2024,
              and Coin Metrics added data and index capabilities in 2025. By October 2025 Talos also announced a
              Crypto.com Exchange integration for eligible institutional users, and independent coverage described a
              March 2026 Nasdaq partnership around tokenized collateral management. The main caution is not the absence
              of product motion but the scarcity of operating disclosure: Talos's own disclaimers state that clients
              must negotiate bilateral venue arrangements themselves and that services vary by jurisdiction, while
              independent commentary says feature breadth and cumulative volume still do not prove retention, margins,
              contract quality, or execution superiority. Those caveats should travel with any later reuse of the
              company's current scale or valuation narrative.
