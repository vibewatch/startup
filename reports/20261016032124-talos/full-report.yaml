  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Talos should be framed as institutional workflow infrastructure for digital assets, not as a retail crypto
              app or a pure exchange-connection utility. The broad demand boundary described in the source pool starts
              with cryptocurrencies but expands to stablecoins, tokenised deposits, funds, and conventional securities
              represented digitally, all of which still need familiar trading, risk, treasury, and settlement processes
              before large institutions can adopt them at scale. That means the included spend is the software and
              operating layer that normalizes fragmented venue access, execution, RFQ, portfolio, risk, and post-trade
              workflows. The excluded spend is equally important: Talos does not replace exchange economics, prime
              financing, custody balance sheet, or issuer economics. Its practical substitutes are direct exchange and
              OTC integrations, prime-broker bundles, and internal buildouts rather than consumer wallets or simple
              charting tools.
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM010
              - CM012
