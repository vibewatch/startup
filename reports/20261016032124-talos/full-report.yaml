  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              Talos still looks strategically important in institutional digital-asset market structure: the January
              2026 extension brought in Robinhood, Sony Innovation Fund, IMC, QCP, and Karatage alongside returning
              investors a16z crypto, BNY, and Fidelity, and management framed most of those investors as existing
              clients or partners. That combination matters because it suggests product relevance and ecosystem fit, not
              just passive financial sponsorship. Even so, the current underwriting problem is price support. Public
              sources support the existence of the round and the approximate $1.5 billion mark, but they do not disclose
              the operating bridge that would let a new investor test whether that price already discounts most of the
              near-term upside. With public evidence still thin on ARR, gross margin, burn, runway, NRR, customer
              concentration, and liquidation preferences, the cleanest call remains to track rather than buy at face
              value.
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV012
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV012
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV009
              - CV012
              - CV013
              - CV014
      - number: '8.2'
        title: What supports the bull case vs. what blocks underwriting today
        blocks:
          - type: paragraph
            body: >-
              The bull case is understandable from open evidence. Talos presents itself as institutional workflow
              infrastructure spanning execution, settlement, portfolio management, and risk; the company also highlights
              a growing network of distribution and liquidity relationships, including the Crypto.com integration and
              DTCC working-group participation. Independent profile pages and market-data aggregators likewise describe
              broad institutional use cases, international reach, acquisitions, and large cumulative trading volumes.
              The anti-thesis is that most of those signals are either company-originated or top-line scale indicators.
              Public databases disagree on lifetime funding totals, and even the more detailed independent profile
              explicitly warns that cumulative trading volume does not answer the harder underwriting questions around
              customer retention, contract durability, margins, or how much operating work the software actually
              removes. That means product breadth is real, but valuation support remains inferential rather than fully
              demonstrated.
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.3'
        title: Scenario framing, comparables, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Public evidence is enough to frame scenarios, but not enough to set a precise entry price. In the bull
              case, Talos converts recent strategic financing, partner distribution, and adjacent-asset expansion into
              sustained software growth and can justify valuation support above the last round. In the base case, Talos
              remains a credible institutional platform but the current mark mostly holds rather than rerates because
              open evidence still does not prove durable software economics. In the bear case, revenue quality or
              concentration turns out weaker than the headline narrative, or the next financing has to absorb multiple
              compression without stronger disclosure. The final diligence asks are therefore unusually specific:
              management-level ARR and NRR detail, gross margin and burn, concentration by customer and venue,
              implementation depth after acquisitions, and the preference stack behind the 2026 round. Those would move
              the recommendation materially more than another partner logo or cumulative-volume update.
            claimRefs:
              - CV005
              - CV008
              - CV009
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV008
              - CV009
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive conclusion
            body: >-
              Talos looks strategically credible, but the present evidence set supports a track call rather than a buy
              because the January 2026 mark is better documented than the operating bridge behind it.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV012
              - CV014
          - type: callout
            title: What would move the rating fastest
            body: >-
              The fastest route to a more constructive view is not another partnership headline; it is disclosed ARR
              quality, margins, burn, concentration, and preference-stack evidence that can anchor a defensible
              underwriting case.
            calloutType: assumption
            claimRefs:
              - CV012
              - CV015
