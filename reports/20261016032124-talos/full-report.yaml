      - number: '3.3'
        title: Lock-in, pricing opacity, and moat limits
        blocks:
          - type: paragraph
            body: >-
              The strongest lock-in mechanism visible in the assigned evidence is process integration: once a desk uses
              one environment for venue connectivity, execution logic, portfolio/risk, treasury, and settlement,
              replacing the stack should be harder than swapping a single router. But the same sources also show why
              durability is not proven. Talos's own disclaimer says clients still negotiate liquidity-provider
              relationships bilaterally and Talos is not party to those arrangements, which limits venue access as a
              proprietary moat. YesPress also warns that a long feature list does not by itself prove better execution
              for a given desk, and public pricing remains opaque enough that buyers cannot make an apples-to-apples
              comparison from open sources. The resulting moat case is credible but still incomplete without win/loss,
              churn, and realized-performance evidence.
