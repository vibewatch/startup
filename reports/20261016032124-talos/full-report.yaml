              - CR014
      - number: '7.2'
        title: Regulatory, legal, and operational control risks
        blocks:
          - type: paragraph
            body: >-
              Public evidence suggests Talos is trying to lower control friction for institutions, but it does not show
              that the control burden disappears. Talos and partner materials repeatedly state that clients still own
              their bilateral venue arrangements and, in white-label settings, their own licensing and compliance
              duties. The Kalshi announcement adds a further jurisdictional qualifier because wider dealer distribution
              is still pending jurisdictional clearance. Separately, Cointelegraph frames the Nasdaq surveillance
              partnership against a backdrop of wash trading, spoofing, layering, and other abuse concerns in crypto
              markets, implying that institutional tooling reduces workflow friction without proving the underlying
              market is clean. Talos's own resilience claims and support model are directionally positive, but the
              public pool does not provide uptime histories, postmortems, or independently scoped security-control
              evidence that would let an investor clear those risks.
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR006
              - CR009
              - CR010
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
