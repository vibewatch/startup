      - number: '1.2'
        title: Leadership, capital, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Public evidence in the assigned pool supports a founder-led narrative more clearly than a full governance
              map. Anton Katz is explicitly named as CEO and co-founder, while Ethan Feldman is identified as
              co-founder; the independent profile also ties both founders to prior institutional trading-system
              experience at AQR, Broadway Technology, and Microsoft. Publicly disclosed capital formation is easier to
              verify than board structure: the company announced a $40 million Series A in 2021, a $105 million Series B
              in 2022, and a $45 million January 2026 extension, which together imply at least $190 million of announced
              equity financing across those rounds. Talos said the extension took Series B financing to $150 million at
              an approximately $1.5 billion post-money valuation and added Robinhood Markets, Sony Innovation Fund, IMC,
              QCP, and Karatage alongside returning investors a16z crypto, BNY, and Fidelity Investments. What remains
              missing is the governance layer needed for deeper underwriting: the assigned sources do not freshly
              evidence board composition, legal-entity structure, or a clean chronology of leadership changes, which
              makes key-person and control analysis necessarily incomplete at this stage.
