        title: Public traction is visible, but capital adequacy still cannot be underwritten
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence shows platform breadth and some scale but not the core unit-economic disclosures
              investors need. Public references describe 60+ integrations in 2023, almost 100 service providers in 2026,
              and 100+ exchanges or OTC desks on the official trading page; a YesPress company profile also says Talos
              had reported $1 trillion in cumulative notional trading volume by August 2026. On capital formation, the
              same profile reports a $40 million Series A, a $105 million Series B, and a $45 million 2026 extension at
              roughly a $1.5 billion post-money valuation. What remains missing is more important for underwriting than
              those headline figures: the reviewed public sources do not disclose cash on hand, monthly burn, runway,
              debt facilities, gross margin, or net revenue retention, so financing dependency and margin quality are
