  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Talos appears to monetize institutional workflow orchestration and module breadth rather than direct venue spreads
      or balance-sheet intermediation.
    data:
      nodes:
        - id: institutional-clients
          label: Institutional clients
          detail: Asset managers, hedge funds, brokers, banks, and market makers bring trading workflows onto the platform.
        - id: talos-interface
          label: Talos interface and APIs
          detail: GUI plus FIX, REST, and WebSocket access create the customer entry point.
        - id: provider-network
          label: Liquidity and service-provider network
          detail: Exchanges, OTC desks, prime brokers, custodians, and related providers sit behind the interface.
        - id: execution-analytics
          label: Execution and analytics layer
          detail: >-
            Fee-aware routing, algorithms, transaction-cost analysis, and order analytics are the monetizable workflow
            value.
        - id: adjacent-modules
          label: Portfolio, risk, settlement, and data modules
          detail: Cloudwall, D3X, Coin Metrics, and settlement tooling widen potential contract scope.
        - id: contracted-revenue
          label: Contracted software revenue
          detail: >-
            Public pricing is undisclosed, so the visible bridge ends at enterprise contracts, bundles, and white-label
            deployments.
      edges:
        - from: institutional-clients
          to: talos-interface
          label: connect
        - from: talos-interface
          to: provider-network
          label: route
        - from: provider-network
          to: execution-analytics
          label: execute
        - from: execution-analytics
          to: adjacent-modules
          label: extend
        - from: adjacent-modules
          to: contracted-revenue
          label: bundle or upsell
    approximationNotes: >-
      This is a qualitative workflow bridge built from public product descriptions; it does not quantify take rates,
      realized pricing, or gross profit.
    claimRefs:
      - CI001
      - CI002
      - CI006
      - CI007
      - CI012
      - CI013
  - id: FE001
    title: Talos product architecture map
    type: stack
    summary: >-
      The public product story is a layered institutional workflow stack spanning client interfaces, execution
      orchestration, post-trade controls, and data/provider connectivity.
    data:
      layers:
        - label: Client interfaces
          detail: >-
            Institutions can access Talos through a GUI, APIs, or white-label surfaces rather than building bespoke
            venue front ends.
          modules:
            - label: GUI trading workspace
            - label: APIs (FIX / REST / WebSocket)
            - label: White Label brokerage surface
        - label: Execution orchestration
          detail: Core workflows concentrate price discovery, routing, RFQ, execution algorithms, and portfolio-aware trading.
          modules:
            - label: Liquidity sourcing and venue access
            - label: Smart order routing / execution algorithms
            - label: RFQ and dealer workflow tools
        - label: Post-trade controls
          detail: >-
            Public materials extend the stack into risk, analytics, treasury, settlement, and portfolio-engineering
            functions.
          modules:
            - label: Risk management (Cloudwall)
            - label: Portfolio engineering (D3X Systems)
            - label: Treasury, settlement, and analytics
        - label: Data and intelligence
          detail: >-
            Coin Metrics gives Talos an owned data, index, status, and developer-tools surface around the execution
            stack.
          outputs:
            - label: Datasets, metrics, and search
            - label: Indexes and pricing resources
            - label: APIs, status, and developer tools
        - label: Provider network
          detail: >-
            Talos still depends on external venues and service providers for liquidity, custody, lending, and brokerage
            relationships.
          outputs:
            - label: Exchanges and OTC desks
            - label: Prime brokers, custodians, and lenders
            - label: Additional partner integrations
        - label: Coverage boundary
          detail: >-
            Talos abstracts workflow connectivity, but customers still carry bilateral provider setup and
            jurisdiction-specific eligibility work.
          outputs:
            - label: Client-negotiated provider arrangements
            - label: Jurisdiction-dependent service availability
    approximationNotes: >-
      Public sources support the layer ordering and named modules, but they do not verify internal service boundaries,
      data flows, or which modules are broadly deployed versus newly attached.
    claimRefs:
      - CE002
      - CE003
      - CE005
      - CE008
      - CE010
      - CE012
      - CE014
