chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating scope
        blocks:
          - type: paragraph
            body: >-
              Talos positions itself as infrastructure for institutional digital-asset activity rather than as a
              balance-sheet intermediary. Across the homepage, brochure, and current insights copy, the company
              consistently describes a single-entry platform that connects institutions to venues, brokers, custodians,
              and other providers for the full trade lifecycle. Independent coverage ties that positioning back to a
              2018 founding problem: Anton Katz and Ethan Feldman first wanted to run a crypto hedge fund, then pivoted
              when they found institutional tooling too fragmented to buy off the shelf. Scale is visible but mostly
              company-reported: as of end Q2 2026 Talos cites $964 billion of volume since inception and clients in 33
              countries, while independent coverage later cited $1 trillion of cumulative notional volume by August
              2026. The assigned current source pool does not freshly restate headquarters, current revenue run-rate,
              customer count, or headcount, so those fields should remain explicit diligence gaps. A minor but practical
              identity caveat is that plain-keyword web results still collide with the unrelated Talos Energy name, so
              later chapters should reuse Talos identity only when anchored to talos.com or the institutional
              digital-asset descriptor set.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
              - CO015
              - CO016
