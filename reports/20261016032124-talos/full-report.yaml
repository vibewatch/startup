  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model is workflow software, not principal risk-taking
        blocks:
          - type: paragraph
            body: >-
              The strongest public signal is that Talos monetizes institutional workflow software rather than spreads,
              custody, or principal balance-sheet intermediation. Its trading page describes a single interface spanning
              price discovery, execution, analytics, settlement, and API connectivity, while Talos's own disclaimer says
              clients must negotiate arrangements with liquidity providers bilaterally and that Talos does not sit in
              the flow of funds. That makes the revenue model look more like enterprise SaaS and connectivity contracts
              whose quality depends on retention, module attachment, and support burden instead of transaction take
              rate. The open issue is pricing opacity: official pages route buyers to demos, and the public source set
              never shows list or realized pricing, so the bridge from workflow value to recognized revenue remains
              indirect.
