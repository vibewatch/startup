      - number: '6.2'
        title: Public adoption proof is real but mostly curated
        blocks:
          - type: paragraph
            body: >-
              The chapter has enough evidence to conclude that Talos has real institutional usage, but the proof comes
              disproportionately from company-curated references and ecosystem announcements rather than independent
              retention or spend disclosures. YesPress and Talos's own reference page both name customers such as Abra,
              OSL, and Caleb & Brown, while Talos's official materials also cite broader client categories, claims of
              geographic reach, and current venue integrations. That is stronger than unlabeled logo walls because it
              ties the platform to specific user organizations and workflows, yet it still leaves open questions on
              revenue concentration, deployment scale by client, and renewal quality. Public usage breadth is therefore
              credible at the workflow level, but not yet independently quantified at the account or contract level.
            claimRefs:
              - CU002
              - CU004
              - CU008
              - CU011
              - CU012
              - CU015
          - type: table
