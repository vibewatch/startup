  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Institutional buyer segments and workflow fit
        blocks:
          - type: paragraph
            body: >-
              Talos is consistently positioned for institutional rather than retail deployment. Across the reviewed
              public materials, the recurring buyer and user set is buy-side and sell-side trading organizations: asset
              managers, hedge funds, banks, brokers, trading firms, and market makers. The product value proposition is
              less about consumer acquisition and more about reducing the workflow friction of operating across
              fragmented venues, liquidity providers, and post-trade systems. Public product pages and profile pieces
              describe Talos as the infrastructure layer that lets institutions keep existing operating models while
              adding digital-asset execution, liquidity aggregation, settlement, and analytics. That is a meaningful
              segmentation signal: Talos appears to sell into complex desks that already have counterparties, balances,
              and execution processes to coordinate, not into first-time retail or prosumer users.
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU014
