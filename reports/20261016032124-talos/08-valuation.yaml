  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: software-economics
      missingEvidence: Audited or board-level ARR, gross margin, burn, runway, and net revenue retention.
      whyItMatters: Those metrics determine whether the January 2026 mark reflects durable software economics or mostly strategic narrative and market positioning.
      diligencePath: Request KPI package and board-ready operating model for the last eight quarters, including retention and contribution margins.
    - type: private-evidence-only
      severity: material
      topic: cap-table-terms
      missingEvidence: Preference stack, liquidation preferences, secondary activity, and dilution terms tied to the January 2026 extension.
      whyItMatters: Entry discipline depends on whether new money is buying simple common-equivalent upside or stepping behind meaningful preference overhang.
      diligencePath: Obtain financing documents, cap-table waterfall, and any side-letter or structured-settlement terms used in the extension.
    - type: missing-source
      severity: material
      topic: customer-quality
      missingEvidence: Customer concentration, contract duration, ACV distribution, venue mix, and module-attachment depth after acquisitions.
      whyItMatters: Strategic logos matter less than proof that revenue is diversified, sticky, and expanding across the broader workflow.
      diligencePath: Review customer cohort data, top-account concentration, and post-acquisition product-usage dashboards during management diligence.
