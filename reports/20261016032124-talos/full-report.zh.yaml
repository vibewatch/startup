      - 有证据支持的论点
      - 哪些信息会改变判断
    rows:
      - - 投资论点
        - 战略投资者和合作伙伴参与了 2026 年 1 月的追加融资，支持 Talos 位于重要机构级工作流层的判断。
        - 第三方若能证明 ARR 持续增长、客户持续扩张，信心将明显增强。
      - - 投资论点
        - 公开材料显示，产品覆盖交易执行、风险、资金管理、结算，以及相邻的数据和投资组合工作流。
        - 若能验证交叉销售率、部署深度和收购后的整合情况，信心会进一步提升。
      - - 反论点
        - 公开材料对 $1.5 billion 估值的支撑仍然薄弱，因为公开来源没有披露 ARR、毛利率、烧钱速度、NRR 或客户集中度。
        - 经审计或董事会层面的 KPI 披露，可能让立场从偏贵转向合理。
      - - 反论点
        - 独立来源警告，累计交易量和功能广度并不能证明商业模式具备持久性，也不能证明风险已经转移。
        - 若有证据表明 Talos 在生产环境中降低了交易对手、实施或留存风险，下行情景会收窄。
    notes: 各行将战略支持与投资判断中的信息缺口分开；公开事实和投资者引述不能替代软件单位经济披露。
