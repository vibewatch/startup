      - number: '3.2'
        title: 产品范围与分销
        blocks:
          - type: paragraph
            body: >-
              Talos 的公开材料始终把自己包装成超越纯智能路由的宽平台。公司称其支持完整的数字资产投资生命周期；Digital Banker 和 London Strategic Edge
              都将其描述为覆盖执行、投资组合、风险、资金管理、结算和白标分销的平台。相较单点替代方案，这种广度是公开可见的主要差异化。Tracxn 的竞争者名单包含 Orderly Network 和 Kemet
              Trading 等更窄的专业厂商，YesPress 也明确将 Talos 与 CoinRoutes、Wyden 对比，而不是把后两者描述成 Talos
              组合式技术栈的完整复制品。因此，公开证据支持这样的判断：Talos 争夺的是机构工作流的控制权，而不只是下一笔订单的路由。
