          x: 1
          'y': 3
          detail: 独立的交易所原生终端、场外交易工作流和双边场所关系。
          note: 对机构而言具备运营可行性，但公开描述显示其较为分散。
    approximationNotes: 评分是分析师根据有来源支持的产品范围和买家定位线索做出的序数估计，不是经过基准比较的市场份额或执行评分。
    claimRefs:
      - CP006
      - CP007
      - CP008
      - CP012
      - CP013
      - CP014
      - CP015
  - id: FI001
    title: 收入模型桥接图
    type: flow
    summary: Talos 似乎靠机构工作流编排和模块广度变现，而不是靠直接赚取场所价差或资产负债表中介收入。
    data:
      nodes:
        - id: institutional-clients
          label: 机构客户
          detail: 资产管理公司、对冲基金、经纪商、银行和做市商将交易工作流接入平台。
        - id: talos-interface
          label: Talos 界面和 API
          detail: GUI 加上 FIX、REST 和 WebSocket 接入，构成客户入口。
        - id: provider-network
          label: 流动性和服务商网络
          detail: 交易所、场外交易台、主经纪商、托管机构和其他相关服务商位于界面之后。
        - id: execution-analytics
          label: 执行和分析层
          detail: 费用感知路由、算法、交易成本分析和订单分析，构成可变现的工作流价值。
        - id: adjacent-modules
          label: 投资组合、风险、结算和数据模块
          detail: Cloudwall、D3X、Coin Metrics 和结算工具扩大了潜在合同范围。
        - id: contracted-revenue
          label: 合同软件收入
          detail: 公开定价未披露，因此可见的桥接止于企业合同、打包方案和白标部署。
      edges:
        - from: institutional-clients
          to: talos-interface
          label: 连接
        - from: talos-interface
          to: provider-network
          label: 路由
        - from: provider-network
          to: execution-analytics
          label: 执行
        - from: execution-analytics
          to: adjacent-modules
          label: 延展
        - from: adjacent-modules
          to: contracted-revenue
          label: 打包或增购
    approximationNotes: 这是根据公开产品描述搭建的定性工作流桥接图；不量化抽成率、实际定价或毛利。
    claimRefs:
      - CI001
      - CI002
      - CI006
      - CI007
      - CI012
      - CI013
  - id: FE001
    title: Talos 产品架构图
    type: stack
    summary: 公开产品叙事是一套分层的机构工作流栈，覆盖客户界面、执行编排、交易后控制以及数据和服务商连接。
    data:
      layers:
        - label: 客户界面
          detail: 机构可以通过 GUI、API 或白标界面访问 Talos，无需自行构建定制化场所前端。
          modules:
            - label: GUI 交易工作区
            - label: API（FIX / REST / WebSocket）
            - label: 白标经纪界面
        - label: 执行编排
          detail: 核心工作流集中处理价格发现、路由、RFQ、执行算法和投资组合感知交易。
          modules:
            - label: 流动性获取和场所接入
            - label: 智能订单路由 / 执行算法
            - label: RFQ 和交易商工作流工具
        - label: 交易后控制
          detail: 公开材料显示，这套技术栈还延伸到风险、分析、资金管理、结算和投资组合工程功能。
          modules:
            - label: 风险管理（Cloudwall）
            - label: 投资组合工程（D3X Systems）
            - label: 资金管理、结算和分析
        - label: 数据和情报
          detail: Coin Metrics 让 Talos 围绕执行技术栈拥有数据、指数、状态和开发者工具能力。
          outputs:
            - label: Datasets, metrics, and search
            - label: Indexes and pricing resources
            - label: APIs, status, and developer tools
        - label: 服务商网络
          detail: Talos 仍依赖外部场所和服务商来提供流动性、托管、借贷和经纪关系。
          outputs:
            - label: Exchanges and OTC desks
            - label: Prime brokers, custodians, and lenders
            - label: Additional partner integrations
        - label: 覆盖边界
          detail: Talos 抽象了工作流连接，但客户仍需自行完成双边服务商接入和特定司法辖区的资格工作。
          outputs:
            - label: Client-negotiated provider arrangements
            - label: Jurisdiction-dependent service availability
    approximationNotes: 公开来源支持层级顺序和模块名称，但无法验证内部服务边界、数据流，或哪些模块已广泛部署、哪些只是新接入。
    claimRefs:
      - CE002
      - CE003
      - CE005
      - CE008
      - CE010
      - CE012
      - CE014
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 机构采用似乎从连接和执行开始，随后扩展到风险、结算及相邻交易工作流。
    data:
      items:
        - label: 连接交易场所和流动性
          actor: 交易台
          phase: 交易前
          channel: GUI 或 API
          touchpoints:
            - 100+ 家交易所和场外交易台
            - 价格发现
            - 历史和实时市场数据
        - label: 路由并执行订单
          actor: 交易员或做市商
          phase: 交易
          channel: OEMS 和算法
          touchpoints:
            - 智能订单路由
            - Iceberg、Pegged、Sniper、TWAP、POV
            - 多腿执行
        - label: 处理大额或特殊流程
          actor: ETF 发行人或大宗交易台
          phase: 交易
          channel: RFQ
          touchpoints:
            - 申购 / 赎回工作流
            - 多交易商 RFQ
            - 场外流动性提供商
        - label: 监控风险和分析
          actor: 投资组合和风险团队
          phase: 交易后
          channel: 分析和风险工具
          touchpoints:
            - 交易成本分析
            - 投资组合工程
            - 统一风险视图
        - label: 协调结算和资金管理
          actor: 运营和资金团队
          phase: 交易后
          channel: 结算工具
          touchpoints:
            - 交易对手义务
            - 信贷和营运资金工作流
            - 一键结算
        - label: 扩展到新产品和渠道
          actor: 现有机构客户
          phase: 扩张
          channel: 同一 OEMS / 白标技术栈
          touchpoints:
            - 预测市场
            - 白标经纪分销
            - 额外的交易所连接，例如 Crypto.com
    claimRefs:
      - CU001
      - CU007
      - CU008
      - CU009
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 监管边界和合作伙伴依赖度评分最高，因为公开证据显示业务扩张面广，但独立控制证明有限。
    data:
      columns:
        - 可能性
        - 影响
        - 缓解措施成熟度
      rows:
