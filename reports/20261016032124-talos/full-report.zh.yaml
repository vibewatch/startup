            title: 对价格敏感的结论
            body: Talos 在战略上看起来可信，但当前证据集支持跟踪而非买入，因为 2026 年 1 月的估值记录比其背后的运营桥接数据更完整。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV012
              - CV014
          - type: callout
            title: 哪些信息最能快速改变评级
            body: 乐观情景的最快实现路径不是又一条合作新闻，而是披露 ARR 质量、利润率、烧钱、集中度和优先股堆叠证据，从而支撑可辩护的投资评估。
            calloutType: assumption
            claimRefs:
