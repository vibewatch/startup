              工作组。独立简介和市场数据聚合商同样描述了广泛的机构用例、国际覆盖、收购和大额累计交易量。反方论点是，这些信号大多来自公司本身，或只是顶线规模指标。公开数据库对历史融资总额说法不一；即便更详细的独立简介也明确警告，累计交易量无法回答客户留存、合同持久性、利润率或软件究竟减少多少运营工作的关键问题。因此，产品广度是真实的，但估值支撑仍是推断，尚未得到充分证明。
            claimRefs:
