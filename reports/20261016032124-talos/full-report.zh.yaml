      - CV011
      - CV012
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观情景
        - 战略投资者转化为更广泛的分销渠道，Talos 也在更宽的产品栈上证明软件经济性具备持续性。
        - 如果后续披露确认经常性收入质量强、客户集中度低，公司或许能支撑高于上一轮的估值。
        - 收购资产商业化或代币化资产扩张令人失望。
        - 需要披露 ARR 增长质量，并证明整合能转化为持久收入。
      - - 基准
        - Talos 仍具战略意义并继续增长，但关于利润率和留存的公开证据仍然有限。
        - 当前估值可能守住，但上行空间受限，因为新投资者仍需在披露缺口下做投资判断。
        - 估值不变的窗口期会让入场时几乎没有容错空间。
        - 如果经营披露缓慢改善、战略势头延续，这一情景最可能发生。
      - - 悲观情景
        - 收入质量或客户集中度弱于叙事，或者下一轮融资面对更低的市场倍数。
        - 由于公开证据始终不足以支撑溢价估值，下轮融资降价或估值持平的风险变得现实。
        - 倍数压缩、客户流失，或收购后的整合拖累。
        - 如果管理层无法在尽调中提供 KPI 级别的支持，这一情景更可能发生。
    notes: 情景区间是方向性的，而非点估计，因为公开证据没有提供精确估值模型所需的 KPI 集合。
    claimRefs:
      - CV005
      - CV008
      - CV009
      - CV012
      - CV013
      - CV014
      - CV015
