              - CP012
              - CP016
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式是工作流软件，而非自营风险承担
        blocks:
          - type: paragraph
            body: >-
              最强的公开信号是，Talos 变现的是机构工作流软件，而不是点差、托管或自营资产负债表中介。其交易页面描述了覆盖价格发现、执行、分析、结算和 API 连接的单一界面；Talos
              自己的免责声明则称，客户必须与流动性提供商双边协商，Talos 不介入资金流。因此，这种收入模式更像企业 SaaS
              和连接服务合同，质量取决于留存、模块附加率和支持负担，而不是交易抽成率。未解决的问题是价格不透明：官方页面把买方引向演示，公开来源从未展示目录价或实际成交价，工作流价值到确认收入之间的桥接仍然间接。
