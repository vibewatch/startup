      - number: '1.3'
        title: 里程碑、扩张路径与投资评估注意事项
        blocks:
          - type: paragraph
            body: >-
              最清晰的战略主线，是围绕原有执行核心不断扩展产品。Talos 表示平台覆盖投资组合工程、交易、分析、资金管理、结算和流动性连接；独立报道及行业媒体显示，公司又通过收购和集成扩大了范围。D3X Systems 于
              2023 年补充投资组合工程，Cloudwall 于 2024 年 4 月带来数字资产风险技术，Skolem 于 2024 年 5 月加入机构 DeFi 基础设施，Coin Metrics 于 2025
              年补充数据和指数能力。到 2025 年 10 月，Talos 还宣布为符合条件的机构用户接入 Crypto.com Exchange；独立报道则提到 2026 年 3 月围绕代币化抵押品管理与 Nasdaq
              建立合作。主要问题不是产品没有推进，而是运营披露稀少：Talos
              自己的免责声明称，客户必须自行与交易场所双边协商，服务可用性因司法辖区而异；独立评论也指出，功能广度和累计交易量仍不能证明留存、利润率、合同质量或执行优势。今后引用公司的当前规模或估值叙事时，应一并保留这些限制。
