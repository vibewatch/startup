      - number: '3.3'
        title: 锁定效应、价格不透明与护城河边界
        blocks:
          - type: paragraph
            body: >-
              当前证据中最明显的锁定机制是流程集成：交易台一旦在同一环境中处理交易场所连接、执行逻辑、投资组合与风险、资金管理和结算，替换整套系统应比更换单一路由器困难。但同一批来源也说明，持久性尚未得到证明。Talos
              自己的免责声明称，客户仍需与流动性提供商双边协商，Talos 不参与这些安排，因此交易场所接入很难构成专有护城河。YesPress
              还提醒，功能列表很长并不等于某个交易台执行更好；公开价格也不透明，买方无法仅凭公开来源进行同口径比较。没有输赢单、流失率和实际表现证据，护城河判断仍不完整。
            claimRefs:
              - CP004
              - CP008
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP007
              - CP008
              - CP011
              - CP012
      - number: '3.4'
        title: 持久性的结论
        blocks:
          - type: paragraph
            body: >-
              按当前公开证据，Talos
              强于单纯路由工具，因为它把工作流广度、机构化包装和生态连接整合到一个界面。这应能帮助它抵御现有内部自建系统和更窄的加密执行厂商。但价格不透明、二手估值追踪数据相互冲突，以及缺少独立的交易台级执行基准，仍留下明显尽调缺口。因此，竞争结论是：Talos
              在机构数字资产基础设施领域位置不错，但公开记录更能证明其定位，而不能充分证明其经济优势具有持久性。
            claimRefs:
              - CP004
              - CP009
              - CP010
