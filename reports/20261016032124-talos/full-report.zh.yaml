chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营范围
        blocks:
          - type: paragraph
            body: >-
              Talos
              将自己定位为机构数字资产业务的基础设施，而非承担资产负债表风险的中介。官网、宣传册和最新洞察内容都反复强调：平台以单一入口连接机构与交易场所、经纪商、托管机构及其他服务商，覆盖完整交易生命周期。独立报道把这一定位追溯到
              2018 年的创立动因：Anton Katz 和 Ethan Feldman 原本想运营一家加密对冲基金，后来发现机构工具过于零散、无法直接采购，便转向创业。规模已有体现，但主要来自公司自报：截至 2026
              年第二季度末，Talos 称成立以来交易量达 9640 亿美元，客户遍布 33 个国家；独立报道随后称截至 2026 年 8 月累计名义交易量已达 1t
              美元。当前分配的来源池没有重新披露总部、当前收入运行率、客户数或员工数，这些字段应继续明确标为待尽调缺口。还有一个实际的身份风险：普通关键词搜索结果仍会与无关的 Talos Energy 混淆，后续章节只有在以
              talos.com 或机构数字资产描述为锚点时，才应沿用 Talos 的身份。
