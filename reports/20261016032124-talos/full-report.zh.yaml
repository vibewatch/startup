  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 新的定价证据已经出现，但经营数据桥接仍缺失，因此建议维持跟踪。
    data:
      nodes:
        - id: financing
          label: 新融资对应约 $1.5B
          detail: 2026 年 1 月的 B 轮追加融资确定了最新公开估值。
        - id: validation
          label: 战略投资者和客户验证
          detail: 新投资者和回流投资者包括生态机构；管理层称其中大多数是现有客户或合作伙伴。
        - id: product
          label: 广泛工作流和分销叙事
          detail: 公开材料指向交易执行、风险、结算、投资组合工具和合作伙伴扩张。
        - id: gaps
          label: 公开 KPI 披露缺口
          detail: ARR、NRR、毛利率、烧钱速度、现金跑道、客户集中度和优先权条款仍未披露。
        - id: comps
          label: 可比公司支持仅具方向性
          detail: 现有可比公司集合和数据库统计有助于框定市场，但无法形成干净的投资判断可比样本。
        - id: decision
          label: 跟踪 / 高风险 / 偏贵
          detail: 只有更充分的披露或更好的价格才能改变推荐。
      edges:
        - from: financing
          to: validation
          label: 确认融资
        - from: validation
          to: product
          label: 支持论点
        - from: product
          to: gaps
          label: 但仍未弥合
        - from: gaps
          to: comps
          label: 留下
        - from: comps
          to: decision
          label: 因此
    approximationNotes: 这是分析顺序，不是量化模型。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV009
      - CV012
      - CV013
      - CV014
