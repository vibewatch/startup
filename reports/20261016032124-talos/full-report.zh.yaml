  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Talos
              应被定义为数字资产机构工作流基础设施，而不是零售加密应用或单纯的交易所连接工具。来源池所描述的需求边界从加密货币出发，延伸至稳定币、代币化存款、基金和以数字形式表示的传统证券；大型机构要规模化采用这些资产，仍需熟悉的交易、风险、资金管理和结算流程。因此，纳入的支出是将分散的交易场所接入、执行、RFQ、投资组合、风险及交易后流程标准化的软件和运营层。排除项同样重要：Talos
              不取代交易所经济、主经纪融资、托管资产负债表或发行方经济。实际替代方案是直接接入交易所和场外市场、主经纪商打包方案及内部自建，而不是消费级钱包或简单图表工具。
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM010
              - CM012
