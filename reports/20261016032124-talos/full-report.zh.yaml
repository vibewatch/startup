        title: 管理层、资本与治理透明度
        blocks:
          - type: paragraph
            body: >-
              当前来源池对创始人主导叙事的支持，明显强于对完整治理结构的呈现。Anton Katz 被明确列为 CEO 兼联合创始人，Ethan Feldman 被列为联合创始人；独立简介还将两人此前在
              AQR、Broadway Technology 和 Microsoft 的机构交易系统经历联系起来。公开披露的融资情况比董事会结构更容易核实：公司宣布 2021 年完成 4000 万美元 A 轮、2022 年完成
              1.05 亿美元 B 轮、2026 年 1 月追加融资 4500 万美元，合计意味着这些轮次至少有 1.9 亿美元股权融资。Talos 表示，追加融资后 B 轮总额达到 1.5 亿美元，投后估值约 15
              亿美元；Robinhood Markets、Sony Innovation Fund、IMC、QCP 和 Karatage 加入，既有投资者 a16z crypto、BNY 和 Fidelity
              Investments 继续跟投。更深层尽调所需的治理信息仍然缺失：当前来源没有重新提供董事会构成、法律实体结构或清晰的管理层变动时间线，因此现阶段无法完整分析关键人和控制权风险。
