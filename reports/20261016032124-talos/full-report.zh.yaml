      - number: '8.3'
        title: 情景框架、可比对象与最终尽调请求
        blocks:
          - type: paragraph
            body: >-
              公开证据足以构建情景，却不足以设定精确入场价。乐观情景下，Talos 将近期战略融资、合作伙伴分销和相邻资产扩张转化为持续软件增长，估值可高于上一轮。基准情景下，Talos
              仍是可信的机构平台，但公开证据尚未证明持久的软件经济模型，当前估值大体维持而非重估。悲观情景下，收入质量或集中度弱于 headline
              叙事，或下一轮融资在披露没有改善的情况下不得不承受估值倍数压缩。最终尽调请求应非常具体：管理层口径 ARR 和 NRR 细节、毛利率与烧钱、按客户和交易场所拆分的集中度、收购后的实施深度，以及 2026
              年融资背后的优先股堆叠条款。这些信息对建议的影响会明显大于又一个合作伙伴 Logo 或累计交易量更新。
            claimRefs:
