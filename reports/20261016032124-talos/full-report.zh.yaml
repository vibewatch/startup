      - number: '2.2'
        title: 买方、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方结构多元，但共同点是运营复杂。公开材料一贯将 Talos 定位于需要跨多个交易场所和服务商关系开展业务的对冲基金、银行、经纪商、资产管理公司、ETF
              发行方、支付公司和机构交易台。用户是负责路由订单、监控流动性、结算头寸，并在分散场所之间核对风险的交易、资本市场和运营团队。付款方通常是承担直接交易场所连接成本、并支持面向客户的数字资产工作流的交易台、平台或业务线负责人。当企业不再希望把加密工具置于主运营环境之外时，采用就会启动：银行和经纪公司希望以自有品牌提供白标接入，资产管理公司希望把申购赎回和
              RFQ 工作流嵌入现有投资组合流程，私人财富平台则希望把数字资产纳入更广泛的客户关系，而不是放在割裂的外部应用里。
            claimRefs:
              - CM003
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM006
              - CM007
              - CM008
      - number: '2.3'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              当前来源池没有提供机构数字资产执行和运营平台的独立 TAM、SAM 或 SOM 估算，因此本章无法支持一个单一的市场规模
              headline。可用的公开证据是一组受限的规模代理指标：它们能显示覆盖面和势头，却不能证明收入捕获。Talos 相关材料提到 31 个国家、100 多家服务商、累计名义交易量超过 1t 美元、70
              多个交易场所和 60 多项集成；2026 年融资公告则称此前两年收入和客户数每年大致翻倍。这些数据点在方向上有用，因为它们表明机构工作流覆盖正在扩大，但不能互换为同一分母，也无法拆出真正 TAM/SAM/SOM
              桥接所需的可服务付费账户基数、软件预算或抽成率。
            claimRefs:
              - CM002
              - CM009
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM009
              - CM012
      - number: '2.4'
        title: 驱动因素、约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              最强的采用驱动因素来自结构变化。数字资产正从现货加密货币扩展到代币化、全天候运行的市场工作流；机构希望借助与主流资产相同的治理、风险和结算控制来管理这类敞口。当交易场所分散、RFQ
              复杂、交易后工作量使直接集成难以维护时，Talos 的位置更有利。约束同样是结构性的：Talos
              不会把对手方接入压缩为单一授信关系，也不能消除司法辖区的可用性限制，更没有公布标准化价格让买方快速比较总成本。因此，这个市场可以可信地描述为具有战略意义且正在扩张，但不能说是规模透明的软件预算类别。在估值判断依赖这一市场逻辑前，仍需直接尽调价格、赢单率和分客户群
              ACV。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM011
              - CM012
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 市场格局与替代方案
        blocks:
          - type: paragraph
            body: >-
              当前来源池支持的是宽泛的竞争框架，而不是狭窄的可比公司集合。Tracxn 称 Talos 有 92 家活跃竞争者，并将 Orderly Network、Kemet Trading 和 Tria
              列入主要竞争者；另一份独立简介则认为，实际替代方案往往不是另一个品牌供应商，而是交易台将交易所原生终端、场外关系和双边交易场所连接拼在一起。YesPress 还补充了两类重要替代方案：专注机构路由的
              CoinRoutes，以及面向银行和经纪公司的工作流产品 Wyden。这一点很关键，因为 Talos 不只是在对抗另一款加密 OEMS，也要面对一侧的单点方案和另一侧的内部自建。
