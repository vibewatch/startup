      - number: '4.2'
        title: GTM 以企业销售为主，价值主张围绕集成节省
        blocks:
          - type: paragraph
            body: >-
              Talos 面向已经管理复杂交易场所、授信和结算关系的机构开展商业销售。官方和第三方简介将客户群定位为资产管理公司、对冲基金、银行、经纪商、做市商及其他交易公司；Talos 的 White Label
              产品让经纪商或银行无需自行搭建整套技术栈就能增加数字资产交易。产品话术集中在减少工程工作量、通过考虑费用的路由和分析降低执行摩擦，以及把更多相邻工作流打包到单一平台。这些都是可信的企业销售抓手，但没有披露销售周期、赢单率、实施投入，或客户合同中核心执行与高价值模块扩展各占多少。
            claimRefs:
