        - null
        - Company-reported operating-scale proxy quoted in an interview/article
        - Medium
        - Adoption proxy, not market size, software budget, or monetization rate
      - - WalletInvestor review
        - 2026
        - Global
        - 70+ trading venues
        - null
        - Review summarizes current Talos execution-network breadth
        - Medium
        - Connectivity breadth is not the same as addressable spend
      - - The Digital Banker
        - 2023
        - Global
        - 60+ integrations
        - null
        - External profile cites completed integrations at time of publication
        - Medium
        - Older metric and not directly comparable with later venue-count claims
      - - PR Newswire / Talos
        - 2026
        - Global
        - Revenues and client count roughly doubled each year for the past 2 years
        - null
        - Fundraising release used as demand-momentum proxy
        - Low
        - Company-reported growth with no disclosed denominator, segment split, or TAM bridge
      - - Hubbis citing Talos
        - 2026
        - Global
        - '>USD 1B first-week BlackRock Aladdin RFQ workflow volume'
        - null
        - Company-reported workflow proof point for ETF-related demand
        - Medium
        - Product-specific demand signal rather than market-size estimate
    notes: >-
      Public sources in the assigned pool support proxy sizing only. They do not provide an
      independent TAM, SAM, or SOM for institutional digital-asset operating platforms.
    claimRefs: [CM009, CM012]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Hedge funds and trading desks
        - CIO or head of trading
        - Traders and trading operations
        - Desk P&L
        - Multi-venue execution, RFQ, analytics, and settlement
        - Head of trading or COO
        - Direct venue connectivity and post-trade workload become expensive to maintain
      - - Asset managers and ETF issuers
        - Digital-asset or capital-markets lead
        - Portfolio managers, traders, and operations teams
        - Product or capital-markets budget
        - Create-redeem, RFQ, portfolio, and risk workflows
        - Capital-markets or operations leadership
        - Need crypto and tokenized workflows inside existing operating systems
      - - Banks and brokerages
        - Platform or digital-asset business lead
        - Execution, treasury, and support teams
        - Business-line P&L
        - White-label client access plus aggregated liquidity and routing
        - GM, CTO, or product owner
        - Want institutional digital-asset access without rebuilding the customer stack
      - - Private-wealth platforms
        - Wealth-product lead
        - Advisors and trading support
        - Wealth-platform P&L
        - Integrate digital assets into the broader advisory relationship
        - Wealth-platform GM
        - Avoid sending clients to separate external exchanges or apps
      - - Sell-side dealers and liquidity distributors
        - Dealer-desk lead
        - Sales traders and hedge desk
        - Market-making or distribution budget
        - Client RFQ, hedging, and upstream liquidity connectivity
        - Desk head
        - Need standardized client routing without building every venue connector internally
    notes: >-
      Buyer, user, payer, and budget-owner fields are inferred from the workflows described in
      public sources; Talos does not disclose segment-level ACV or procurement structures.
    claimRefs: [CM003, CM006, CM007, CM008]
figures:
