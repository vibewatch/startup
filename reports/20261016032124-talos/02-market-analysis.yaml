    title: Market sizing lens
    type: pyramid
    summary: >-
      Public evidence supports a scope-narrowing demand lens for Talos rather than a numeric
      TAM/SAM/SOM.
    data:
      items:
        - label: Broad digital-asset market
          detail: Includes cryptocurrencies plus stablecoins, tokenised deposits, funds, and conventional securities represented digitally.
          claimRefs: [CM001, CM012]
        - label: Institutional workflow need
          detail: Buyers need those products tied to familiar trading, risk, treasury, and settlement processes.
          claimRefs: [CM001, CM006]
        - label: Multi-venue execution buyers
          detail: Core buyer segments include hedge funds, banks, brokers, and institutional desks operating across fragmented venues.
          claimRefs: [CM003, CM010]
        - label: Asset-manager and ETF workflows
          detail: RFQ, create-redeem, and portfolio workflows expand relevance to asset managers and ETF issuers.
          claimRefs: [CM003, CM012]
        - label: White-label distributors
          detail: Sell-side firms and private-wealth platforms can add digital assets without rebuilding their client-facing stack.
          claimRefs: [CM006, CM007, CM008]
        - label: Serviceable slice
          detail: The practical market narrows to eligible institutional clients that can secure bilateral onboarding and jurisdictional approval.
          claimRefs: [CM004, CM005, CM011]
    approximationNotes: >-
      No public independent TAM/SAM/SOM figure is available in the assigned pool, so the chart
      intentionally shows qualitative narrowing layers instead of unsupported numeric market
      totals.
    claimRefs: [CM001, CM003, CM004, CM006, CM007, CM008, CM010, CM011, CM012]
