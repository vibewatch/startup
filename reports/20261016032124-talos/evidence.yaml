evidenceGaps:
  - type: missing-source
    severity: material
    topic: cover-metrics
    missingEvidence: Current revenue run-rate, customer count, headcount, and freshly sourced headquarters confirmation.
    whyItMatters: >-
      These are core cover metrics for judging present scale, efficiency, and whether the 2026 valuation mark is
      grounded in current operations.
    diligencePath: >-
      Request current board-approved KPI pack or audited management reporting and verify headquarters through a fresh
      primary corporate source.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, investor rights, legal-entity map, and a clean chronology of leadership changes.
    whyItMatters: >-
      Governance opacity limits assessment of control, key-person risk, refresh responsibility, and any investor
      influence beyond the financing headlines.
    diligencePath: Request cap-table summary, board materials, corporate registry extracts, and management-organizational charts.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: underwriting-risk
    missingEvidence: >-
      Customer concentration, contract duration, net revenue retention, margin profile, and evidence of workflow
      stickiness by module.
    whyItMatters: >-
      Independent coverage already warns that product breadth and cumulative volume do not by themselves prove
      commercial durability or execution quality.
    diligencePath: >-
      Request cohort retention cuts, concentration analysis, gross-margin history, and customer reference calls
      segmented by module and institution type.
    relatedQuestionRefs:
      - QO006
      - QO008
  - type: missing-source
    severity: material
    topic: numeric-market-sizing
    missingEvidence: >-
      Independent TAM, SAM, or SOM research specific to institutional digital-asset execution and operating platforms,
      ideally with software-budget framing rather than venue-volume framing.
    whyItMatters: >-
      A valuation case cannot translate Talos's operating proxies into addressable revenue opportunity without a
      defensible denominator and segmentation bridge.
    diligencePath: >-
      Obtain recent analyst-market-data or public-company disclosures that isolate spend on institutional digital-asset
      execution, OEMS, RFQ, and post-trade infrastructure.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-and-acv
    missingEvidence: Public pricing architecture, ACV ranges, module attachment, and segment-level procurement patterns by buyer type.
    whyItMatters: >-
      Without pricing and packaging transparency, the chapter can describe relevance and demand but cannot estimate
      serviceable budget capture or payback by segment.
    diligencePath: >-
      Request customer references, pricing decks, and sales collateral showing seat, module, venue, and volume-based
      monetization across hedge funds, banks, and asset managers.
    relatedQuestionRefs:
      - QM003
      - QM006
  - type: private-evidence-only
    severity: minor
    topic: proxy-to-paying-customer-conversion
    missingEvidence: >-
      Conversion from network metrics such as venues, providers, and notional volume into paying accounts, retained
      clients, and segment mix.
    whyItMatters: >-
      Proxy metrics can overstate commercial reach if many connections are potential rather than monetized or if
      activity is concentrated in a narrow buyer set.
    diligencePath: >-
      Ask management for cohort data, customer-count segmentation, and revenue concentration by buyer class before using
      operating-scale proxies in valuation work.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: pricing-opacity
    missingEvidence: >-
      Public list pricing, minimum contract structure, discounting logic, and seat or usage units for Talos, Wyden, and
      CoinRoutes.
    whyItMatters: >-
      Without commercial terms, public analysis can compare scope but cannot prove whether Talos is expensive, fairly
      packaged, or vulnerable to undercutting.
    diligencePath: >-
      Request current pricing decks, sample MSAs or order forms, and recent buyer screenshots from Talos and directly
      comparable alternatives.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Win-loss data, churn, module-attachment rates, migration timelines, and evidence of customers replacing incumbent
      stacks with Talos.
    whyItMatters: >-
      Workflow breadth implies switching cost, but economic durability depends on whether customers actually stay,
      expand, and displace alternatives.
    diligencePath: >-
      Review customer cohorts, pipeline win-loss notes, implementation case studies, and reference-call evidence from
      recent Talos deployments.
    relatedQuestionRefs:
      - QP006
      - QP007
  - type: missing-source
    severity: material
    topic: execution-benchmarking
    missingEvidence: >-
      Independent execution-quality or TCA evidence comparing Talos-backed routing and workflow outcomes against direct
      alternatives.
    whyItMatters: >-
      Public feature lists do not prove a better desk-level outcome, so moat quality remains under-validated without
      measured performance evidence.
    diligencePath: >-
      Obtain benchmark studies, customer-side TCA outputs, or controlled evaluation data across Talos and substitute
      workflows.
    relatedQuestionRefs:
      - QP007
  - type: private-evidence-only
    severity: material
    topic: pricing-realization
    missingEvidence: Contract-level pricing tiers, discounts, module attachment rates, and renewal behavior by segment.
    whyItMatters: Public product descriptions show value but do not prove revenue quality, ACV expansion, or retention.
    diligencePath: >-
      Request top-customer contracts, price books, renewal cohorts, and module attach analysis for the last twelve
      months.
    relatedQuestionRefs:
      - QI002
      - QI003
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: enterprise-unit-economics
    missingEvidence: Audited gross margin, hosting and support cost allocation, CAC, payback, and net revenue retention.
    whyItMatters: These metrics determine whether Talos behaves like scalable software or a services-heavy infrastructure business.
    diligencePath: >-
      Obtain audited management accounts plus cohort-level sales-efficiency and retention reporting from the same
      period.
    relatedQuestionRefs:
      - QI004
      - QI005
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: liquidity-runway
    missingEvidence: Latest cash balance, monthly burn, runway, debt facilities, covenants, and downside financing plan.
    whyItMatters: Funding history and valuation do not establish present capital adequacy or next-round dependency.
    diligencePath: Request current balance sheet, cash flow, debt schedule, and management runway case through the next 18 months.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Customer concentration, venue concentration, top-counterparty exposure, and module-level adoption by account.
    whyItMatters: Concentration can weaken revenue quality even when connectivity breadth and notional volume look strong.
    diligencePath: Ask for top-10 customer revenue, venue mix, counterparty exposure, and module attach by cohort.
    relatedQuestionRefs:
      - QI005
      - QI008
    relatedTableRefs:
      - TI001
      - TI003
  - type: missing-source
    severity: material
    topic: security-controls
    missingEvidence: >-
      Third-party or regulator-anchored proof of security certifications, privacy controls, uptime history, and incident
      response performance.
    whyItMatters: >-
      Institutions placing critical trading workflows on Talos need evidence beyond marketing language to assess
      operational, cyber, and compliance risk.
    diligencePath: >-
      Request SOC or ISO materials, security whitepapers, customer security reviews, status-page uptime history, and any
      incident/postmortem disclosures.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: module-adoption
    missingEvidence: >-
      Module-level attach rates, deployment times, renewal metrics, and usage depth across execution, risk, data, and
      post-trade products.
    whyItMatters: >-
      Product breadth is strategically valuable only if customers actually deploy multiple modules and keep them in
      production.
    diligencePath: >-
      Ask management for product-line ARR mix, attach-rate cohorts, implementation timelines, and reference customers by
      module.
    relatedQuestionRefs:
      - QE002
      - QE004
    relatedTableRefs:
      - TE001
      - TE002
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: A public repo, package, practitioner forum, or other developer-signal proxy tied to Talos's product adoption.
    whyItMatters: >-
      Product-tech diligence benefits from external technical usage signals rather than relying only on company and
      partner descriptions.
    diligencePath: >-
      Request product documentation on public APIs, public SDK footprints, or practitioner references; if none exist,
      document why a developer-signal proxy is structurally unavailable.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: durability-gap
    missingEvidence: Customer-level NRR, GRR, churn, renewal rate, and contract-length data.
    whyItMatters: >-
      Without durability metrics, the public record cannot distinguish sticky workflow adoption from transactional or
      pilot usage.
    diligencePath: >-
      Request cohort retention, renewal, and contract-duration data by major customer segment from management or data
      room materials.
    relatedQuestionRefs:
      - QU006
  - type: missing-source
    severity: material
    topic: concentration-risk
    missingEvidence: Top-customer revenue share, venue concentration, and module-attachment depth across the installed base.
    whyItMatters: >-
      Concentration can materially change underwriting because a workflow platform may appear broad while depending on a
      small set of logos or venues.
    diligencePath: Request the top-10 customers by ARR or revenue, venue concentration, and module penetration by cohort.
    relatedTableRefs:
      - TU002
      - TU003
  - type: private-evidence-only
    severity: minor
    topic: deployment-scale
    missingEvidence: Production seat counts, active-user measures, and product-level utilization by named customer.
    whyItMatters: >-
      Named references prove some live usage but do not quantify how deeply Talos is embedded inside each customer
      workflow.
    diligencePath: Ask management for implementation scope, active-user counts, and workflow share for the largest named references.
    relatedTableRefs:
      - TU003
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-register
    missingEvidence: >-
      A jurisdiction-by-jurisdiction legal inventory covering Talos products, white-label use cases, and distribution
      restrictions.
    whyItMatters: >-
      The public pool is enough to rank perimeter risk, but not enough to confirm where Talos may inherit
      regulated-intermediary obligations.
    diligencePath: >-
      Request outside-counsel or internal legal matrix by product, jurisdiction, and customer type, plus any launch
      gating tied to Kalshi or dealer software.
    relatedQuestionRefs:
      - QR001
      - QR005
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: resilience-proof-gap
    missingEvidence: >-
      Independent uptime history, incident logs, postmortems, customer severity metrics, and scoped security-control
      attestations.
    whyItMatters: Operational diligence cannot clear resiliency and security risk from marketing claims alone.
    diligencePath: >-
      Request the last 12-24 months of uptime/SLA attainment, Sev-1 and Sev-2 incident history, SOC 2 or similar control
      scope, and penetration-test summary.
    relatedQuestionRefs:
      - QR004
      - QR006
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: partner-concentration
    missingEvidence: >-
      Customer-level concentration by venue, exchange, custodian, and strategic partner, plus termination rights and
      failover plans.
    whyItMatters: >-
      A partner-led infrastructure layer can look diversified in marketing while remaining operationally concentrated in
      practice.
    diligencePath: >-
      Ask for partner revenue exposure, venue usage concentration, redundancy metrics, and any material
      minimum-commitment or exclusivity clauses.
    relatedQuestionRefs:
      - QR003
      - QR005
      - QR007
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Current burn, runway, margin profile, customer retention, and module-attachment data.
    whyItMatters: >-
      Public funding and scale signals do not prove capital efficiency or resilience if markets weaken or implementation
      costs rise.
    diligencePath: >-
      Request board-style KPI packs covering ARR or run-rate revenue definition, gross margin, burn, runway, NRR/GRR,
      and implementation/support cost by customer cohort.
    relatedQuestionRefs:
      - QR008
  - type: private-evidence-only
    severity: material
    topic: software-economics
    missingEvidence: Audited or board-level ARR, gross margin, burn, runway, and net revenue retention.
    whyItMatters: >-
      Those metrics determine whether the January 2026 mark reflects durable software economics or mostly strategic
      narrative and market positioning.
    diligencePath: >-
      Request KPI package and board-ready operating model for the last eight quarters, including retention and
      contribution margins.
  - type: private-evidence-only
    severity: material
    topic: cap-table-terms
    missingEvidence: >-
      Preference stack, liquidation preferences, secondary activity, and dilution terms tied to the January 2026
      extension.
    whyItMatters: >-
      Entry discipline depends on whether new money is buying simple common-equivalent upside or stepping behind
      meaningful preference overhang.
    diligencePath: >-
      Obtain financing documents, cap-table waterfall, and any side-letter or structured-settlement terms used in the
      extension.
  - type: missing-source
    severity: material
    topic: customer-quality
    missingEvidence: >-
      Customer concentration, contract duration, ACV distribution, venue mix, and module-attachment depth after
      acquisitions.
    whyItMatters: >-
      Strategic logos matter less than proof that revenue is diversified, sticky, and expanding across the broader
      workflow.
    diligencePath: >-
      Review customer cohort data, top-account concentration, and post-acquisition product-usage dashboards during
      management diligence.
