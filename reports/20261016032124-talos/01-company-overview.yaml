artifact: company-overview
slug: talos
runDate: 2026-10-16
company:
  name: Talos
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Talos is a private, Series B-funded institutional digital-asset infrastructure company whose
    official materials now describe a broad workflow spanning execution, risk, treasury, settlement,
    and portfolio management. The current public story shows meaningful product breadth and a
    January 2026 $1.5 billion mark, but independent evidence still leaves revenue quality,
    customer concentration, governance, and several cover metrics too thin for high-conviction
    underwriting.
sections:
  - id: identity-and-scale
    title: Identity and operating scope
    body: >-
      Talos positions itself as infrastructure for institutional digital-asset activity rather than
      as a balance-sheet intermediary. Across the homepage, brochure, and current insights copy, the
      company consistently describes a single-entry platform that connects institutions to venues,
      brokers, custodians, and other providers for the full trade lifecycle. Independent coverage
      ties that positioning back to a 2018 founding problem: Anton Katz and Ethan Feldman first
      wanted to run a crypto hedge fund, then pivoted when they found institutional tooling too
      fragmented to buy off the shelf. Scale is visible but mostly company-reported: as of end Q2
      2026 Talos cites $964 billion of volume since inception and clients in 33 countries, while
      independent coverage later cited $1 trillion of cumulative notional volume by August 2026.
      The assigned current source pool does not freshly restate headquarters, current revenue
      run-rate, customer count, or headcount, so those fields should remain explicit diligence gaps.
      A minor but practical identity caveat is that plain-keyword web results still collide with the
      unrelated Talos Energy name, so later chapters should reuse Talos identity only when anchored
      to talos.com or the institutional digital-asset descriptor set.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
      - CO015
      - CO016
    tableRefs:
      - TO001
  - id: leadership-capital-and-governance
    title: Leadership, capital, and governance visibility
    body: >-
      Public evidence in the assigned pool supports a founder-led narrative more clearly than a full
      governance map. Anton Katz is explicitly named as CEO and co-founder, while Ethan Feldman is
      identified as co-founder; the independent profile also ties both founders to prior institutional
      trading-system experience at AQR, Broadway Technology, and Microsoft. Publicly disclosed
      capital formation is easier to verify than board structure: the company announced a $40 million
      Series A in 2021, a $105 million Series B in 2022, and a $45 million January 2026 extension,
      which together imply at least $190 million of announced equity financing across those rounds.
      Talos said the extension took Series B financing to $150 million at an approximately $1.5
      billion post-money valuation and added Robinhood Markets, Sony Innovation Fund, IMC, QCP, and
      Karatage alongside returning investors a16z crypto, BNY, and Fidelity Investments. What remains
      missing is the governance layer needed for deeper underwriting: the assigned sources do not
      freshly evidence board composition, legal-entity structure, or a clean chronology of leadership
      changes, which makes key-person and control analysis necessarily incomplete at this stage.
    claimRefs:
      - CO001
      - CO007
      - CO008
      - CO009
      - CO013
    tableRefs:
      - TO002
      - TO003
  - id: milestones-and-underwriting-caveats
    title: Milestones, expansion path, and underwriting caveats
    body: >-
      The clearest strategic arc is product broadening around the original execution core. Talos says
      the platform covers portfolio engineering, trading, analytics, treasury, settlement, and
      liquidity connectivity; independent and trade-publication coverage then shows that scope being
      widened by acquisitions and integrations. D3X Systems added portfolio engineering in 2023,
      Cloudwall added digital-asset risk technology in April 2024, Skolem added institutional DeFi
      infrastructure in May 2024, and Coin Metrics added data and index capabilities in 2025. By
      October 2025 Talos also announced a Crypto.com Exchange integration for eligible institutional
      users, and independent coverage described a March 2026 Nasdaq partnership around tokenized
      collateral management. The main caution is not the absence of product motion but the scarcity of
      operating disclosure: Talos's own disclaimers state that clients must negotiate bilateral venue
      arrangements themselves and that services vary by jurisdiction, while independent commentary says
      feature breadth and cumulative volume still do not prove retention, margins, contract quality, or
      execution superiority. Those caveats should travel with any later reuse of the company's current
      scale or valuation narrative.
    claimRefs:
      - CO004
      - CO010
      - CO011
      - CO012
      - CO014
    figureRefs:
      - FO001
