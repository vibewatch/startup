chapter:
  number: 7
  title: Risks
  summary: >-
    Talos's most material public risks are regulatory perimeter, partner and venue
    dependency, and the lack of independent proof that its institutional-grade
    resilience claims translate into audited controls or incident-free
    performance. Recent expansion into Kalshi, Nasdaq-linked tokenized
    collateral workflows, and additional exchange integrations broadens the
    addressable surface, but it also increases jurisdictional, surveillance, and
    integration complexity while public disclosure on uptime, security
    operations, and unit economics remains thin.
sections:
  - id: ranked-risk-posture
    title: Ranked risk posture
    body: >-
      The highest-confidence risk pattern in the assigned evidence is not that
      Talos lacks product breadth; it is that Talos sits in the middle of a
      partner-heavy institutional workflow whose regulatory and control boundary
      is still easy to misread. Company and partner materials consistently
      position Talos as software infrastructure rather than a broker, while
      third-party reporting shows Talos expanding into prediction markets,
      tokenized collateral, and additional exchange connectivity. That expansion
      helps the growth story, but it also means legal scope, venue dependency,
      and control validation matter more than feature count. The heatmap and
      registers therefore rank regulatory perimeter and partner dependence above
      pure feature-execution risk, with disclosure gaps on incident history and
      financial resilience remaining material.
    claimRefs: [CR001, CR004, CR005, CR008, CR012, CR014]
    figureRefs: [FR001]
  - id: regulatory-operational-risks
    title: Regulatory, legal, and operational control risks
    body: >-
      Public evidence suggests Talos is trying to lower control friction for
      institutions, but it does not show that the control burden disappears.
      Talos and partner materials repeatedly state that clients still own their
      bilateral venue arrangements and, in white-label settings, their own
      licensing and compliance duties. The Kalshi announcement adds a further
      jurisdictional qualifier because wider dealer distribution is still
      pending jurisdictional clearance. Separately, Cointelegraph frames the
      Nasdaq surveillance partnership against a backdrop of wash trading,
      spoofing, layering, and other abuse concerns in crypto markets, implying
      that institutional tooling reduces workflow friction without proving the
      underlying market is clean. Talos's own resilience claims and support
      model are directionally positive, but the public pool does not provide
      uptime histories, postmortems, or independently scoped security-control
      evidence that would let an investor clear those risks.
    claimRefs: [CR001, CR003, CR004, CR005, CR006, CR009, CR010, CR013]
    tableRefs: [TR001, TR002]
  - id: dependency-financial-and-diligence-triggers
    title: Dependency, financial, and thesis-break triggers
    body: >-
      Dependency risk is structural because Talos's value proposition is to sit
      on top of external venues, brokers, custodians, lenders, and market-data
      providers rather than replace them. That architecture can scale if the
      integrations remain reliable, but it also creates concentration and
      counterparty questions that public materials do not quantify. The same is
      true financially: open sources disclose large financing and volume
      milestones, yet they do not disclose margins, burn, runway, retention, or
      outage-linked customer impact, so there is no public bridge from product
      breadth to durable economics. A practical kill-criteria framework is
      therefore: (1) any evidence that Talos is treated as taking on regulated
      intermediary duties without matching approvals, (2) any major venue or
      partner failure that materially impairs client workflow, or (3) diligence
      materials that fail to substantiate uptime, control effectiveness, or
      capital efficiency at the level implied by the current valuation.
    claimRefs: [CR002, CR007, CR008, CR011, CR012, CR013, CR014]
    tableRefs: [TR003]
