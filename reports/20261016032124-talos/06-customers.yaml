      - Production vs pilot signal
      - Reported outcome
      - Limitation
    rows:
      - [Abra, Institutional asset manager / broker, "Uses Talos product suite and market connectivity to access digital assets for an end-customer offering", "Company-hosted named testimonial plus external mention as a public reference", "\"allowed us to improve our trading capabilities and offering to our end-customers\"", "No contract value, renewal, or volume disclosed"]
      - [OSL, Institutional brokerage / exchange-linked sales trading, "Uses the Talos interface, support, and customer connectivity for its product offering", "Company-hosted named testimonial plus external mention as a public reference", "\"allows us to grow our business further\"", "No independent implementation detail, seat count, or economics disclosed"]
      - [Arc Capital, Institutional investment manager, "Uses Talos algorithms in its trade-execution workflow across exchanges and instruments", "Company-hosted named portfolio-manager testimonial describing an integral workflow", "\"enabling reliable algorithms that ensure cost-efficient order fills\"", "No external corroboration, deployment scale, contract value, or renewal disclosed"]
    notes: Rows cover the strongest named customer references visible in open sources; absence from this table is not evidence of non-use.
    enumerationScope:
      coverage: sample
      basis: Sample of named customer references explicitly identified in reviewed public materials as of the 2026-10-16 run date.
    claimRefs: [CU002, CU003]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Institutional adoption appears to start with connectivity and execution, then widen into risk, settlement, and adjacent trading workflows.
    data:
      items:
        - label: Connect venues and liquidity
          actor: Trading desk
          phase: Pre-trade
          channel: GUI or API
          touchpoints:
            - 100+ exchanges and OTC desks
            - Price discovery
            - Historical and real-time market data
        - label: Route and execute orders
          actor: Trader or market maker
          phase: Trade
          channel: OEMS and algos
          touchpoints:
            - Smart order routing
            - Iceberg, Pegged, Sniper, TWAP, POV
            - Multi-leg execution
        - label: Work larger or specialized flows
          actor: ETF issuer or block desk
          phase: Trade
          channel: RFQ
          touchpoints:
            - Create / redeem workflows
            - Multi-dealer RFQ
            - OTC liquidity providers
        - label: Monitor risk and analytics
          actor: Portfolio and risk teams
          phase: Post-trade
          channel: Analytics and risk tools
          touchpoints:
            - Transaction cost analysis
            - Portfolio engineering
            - Unified risk views
        - label: Coordinate settlement and treasury
          actor: Operations and treasury
          phase: Post-trade
          channel: Settlement tools
          touchpoints:
            - Counterparty obligations
            - Credit and working capital workflows
            - One-click settlement
        - label: Expand into new products and channels
          actor: Existing institutional client
          phase: Expansion
          channel: Same OEMS / white-label stack
          touchpoints:
            - Prediction markets
            - White-label brokerage distribution
            - Additional exchange connectivity such as Crypto.com
    claimRefs: [CU001, CU007, CU008, CU009, CU014]
callouts:
  - calloutType: strength
    title: Named references are better than logo-only proof
    body: >-
      Talos's public customer evidence includes named organizations and workflow-specific quotes,
      which is materially stronger than generic logo placement even though the evidence remains
      mostly curated by Talos or friendly profiles.
    claimRefs: [CU002, CU003]
  - calloutType: risk
    title: Retention quality is still the key missing dataset
    body: >-
      Open sources support breadth of institutional workflow coverage, but they do not establish
      NRR, churn, renewal frequency, or customer concentration, which keeps durability risk open.
    claimRefs: [CU007, CU013]
