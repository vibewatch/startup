      - ["Provider / workflow integrations completed", "60+ integrations", "2023-11-09", "The Digital Banker", "medium", "Shows breadth of ecosystem coverage around the customer workflow", "Integrations are not the same as paying customers or active usage"]
      - ["Liquidity venues connected", "100+ exchanges and OTC desks", "accessed 2026-10-16", "Talos trading page", "medium", "Supports value proposition for multi-venue institutional desks", "Active venue utilization per client is not disclosed"]
