  evidenceGaps:
    - type: missing-source
      severity: material
      topic: durability-gap
      missingEvidence: Customer-level NRR, GRR, churn, renewal rate, and contract-length data.
      whyItMatters: Without durability metrics, the public record cannot distinguish sticky workflow adoption from transactional or pilot usage.
      diligencePath: Request cohort retention, renewal, and contract-duration data by major customer segment from management or data room materials.
      relatedQuestionRefs: [QU006]
    - type: missing-source
      severity: material
      topic: concentration-risk
      missingEvidence: Top-customer revenue share, venue concentration, and module-attachment depth across the installed base.
      whyItMatters: Concentration can materially change underwriting because a workflow platform may appear broad while depending on a small set of logos or venues.
      diligencePath: Request the top-10 customers by ARR or revenue, venue concentration, and module penetration by cohort.
      relatedTableRefs: [TU002, TU003]
    - type: private-evidence-only
      severity: minor
      topic: deployment-scale
      missingEvidence: Production seat counts, active-user measures, and product-level utilization by named customer.
      whyItMatters: Named references prove some live usage but do not quantify how deeply Talos is embedded inside each customer workflow.
      diligencePath: Ask management for implementation scope, active-user counts, and workflow share for the largest named references.
      relatedTableRefs: [TU003]
