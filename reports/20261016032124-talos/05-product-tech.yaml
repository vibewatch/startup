  evidenceGaps:
    - type: missing-source
      severity: material
      topic: security-controls
      missingEvidence: Third-party or regulator-anchored proof of security certifications, privacy controls, uptime history, and incident response performance.
      whyItMatters: Institutions placing critical trading workflows on Talos need evidence beyond marketing language to assess operational, cyber, and compliance risk.
      diligencePath: Request SOC or ISO materials, security whitepapers, customer security reviews, status-page uptime history, and any incident/postmortem disclosures.
      relatedQuestionRefs: [QE007]
      relatedTableRefs: [TE003]
    - type: private-evidence-only
      severity: material
      topic: module-adoption
