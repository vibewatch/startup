    title: AI21 product architecture map
    type: stack
    summary: AI21's public architecture runs from controlled knowledge inputs through retrieval and orchestration to model execution, validation, and application delivery.
    data:
      layers:
        - label: Controlled inputs
          modules:
            - label: Enterprise files and knowledge bases
              detail: Uploaded or connected business knowledge used by the agent.
            - label: Web search and tools
              detail: Optional external information and tool actions.
        - label: Retrieval and planning
          modules:
            - label: Semantic retrieval
              detail: Finds relevant passages for knowledge-agent tasks.
            - label: Maestro planner
              detail: Builds a task-specific sequence of model and tool calls.
        - label: Model execution
          modules:
            - label: Jamba first-party models
              detail: AI21 long-context model family.
            - label: Managed third-party and BYOK models
              detail: Alternative model providers exposed through Maestro.
        - label: Assurance and delivery
          modules:
            - label: Validation and correction
