  evidenceGaps:
    - type: missing-source
      severity: material
      topic: assurance
      missingEvidence: Current independent uptime, latency percentiles, incident history, security certification scope, and prompt-injection or hallucination benchmarks for the selected AI21 deployment.
      whyItMatters: Enterprise buyers cannot underwrite production reliability, security exposure, or support cost from capability descriptions alone.
      diligencePath: Request the current SOC or equivalent assurance package, status and incident history, SLA terms, data-retention policy, and workload-specific evaluation results under NDA.
      relatedQuestionRefs: [QE008]
    - type: private-evidence-only
      severity: material
      topic: adoption
      missingEvidence: Independently verified production deployments, usage scale, and measured customer outcomes for Maestro.
      whyItMatters: Product maturity and technical differentiation may not translate into repeatable enterprise adoption or implementation economics.
      diligencePath: Obtain referenceable customer calls, anonymized usage cohorts, deployment timelines, renewal evidence, and representative evaluation reports.
      relatedQuestionRefs: [QE001, QE008]
    - type: missing-source
      severity: minor
      topic: developer-signal
      missingEvidence: Current public repository activity, release cadence, package downloads, or issue-resolution metrics tied specifically to AI21's maintained developer surfaces.
      whyItMatters: Documentation and ecosystem references show access paths but not sustained developer engagement or maintenance velocity.
      diligencePath: Verify official repositories, package registries, release notes, SDK versions, and support response data during technical diligence.
      relatedQuestionRefs: [QE010]
