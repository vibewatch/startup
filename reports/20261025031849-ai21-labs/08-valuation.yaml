    notes: "Assessment uses public evidence available by 2026-10-25; missing private-company metrics are not treated as zero."
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV015]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - ["Enterprise workflow wedge", "Maestro plans and validates multi-step work; Jamba supports long-context and private deployment.", "Demonstrated paid expansion, retention, and gross margin by product."]
      - ["Distribution and model choice", "Together AI integration exposes additional open-model choice through Maestro.", "Repeatable partner-sourced bookings with disclosed economics."]
      - ["Price and competition risk", "Current public materials omit revenue, margin, and retention while open models pressure pricing.", "Current cap table, preference stack, and a price with downside margin."]
      - ["Capital-mark efficiency", "The 2023 financing established a $1.4B mark but newer public operating evidence is limited.", "A refreshed financing or secondary transaction with terms and date."]
    notes: "Rows separate company-issued product evidence from the independent financing report and identify the diligence needed to convert a thesis into an investable underwriting case."
    claimRefs: [CV002, CV003, CV006, CV007, CV008, CV009, CV010, CV016]
  - id: TV003
    title: Bull, base, and bear valuation logic
    columns: [Scenario, Assumptions, Valuation or return logic, Probability signal, Downside trigger]
    rows:
      - ["Bull", "Maestro expansion, durable retention, and acceptable serving margins are demonstrated.", "Potentially above the last disclosed $1.4B mark; no numeric target is supportable from public data.", "Low until current operating proof is supplied", "Two consecutive periods of weak expansion or material margin deterioration."]
      - ["Base", "Product differentiation persists but revenue, margin, and cap-table disclosure remains incomplete.", "Around or below the last disclosed mark depending on financing terms, dilution, and preferences.", "Highest current signal", "New financing below the prior mark or inability to document recurring revenue quality."]
      - ["Bear", "Model-price compression, customer concentration, implementation burden, or a down-round emerges.", "Below the last disclosed mark; loss severity cannot be quantified without cap-table and preference data.", "Material tail risk", "Down-round, senior preference overhang, or failed commercialization milestones."]
    notes: "These are qualitative scenario bands anchored to the August 2023 $1.4B reported valuation; they are not forecasts or a substitute for a current financing price."
    claimRefs: [CV001, CV003, CV010, CV011, CV012, CV013, CV014, CV015, CV016]
