          label: Product proof
          description: Maestro orchestration and Jamba deployment capabilities are documented.
        - id: enterprise-wedge
          label: Enterprise wedge
          description: Private deployment, long-context work, and model choice can support high-value workflows.
        - id: commercial-proof
          label: Commercial proof
          description: Customer expansion, retention, margins, and bookings remain incompletely disclosed.
        - id: price-context
          label: Price context
          description: Last clearly reported mark was $1.4B in August 2023; current price terms are unverified.
        - id: downside
          label: Downside controls
          description: Dilution, preferences, concentration, and model-price compression require diligence.
        - id: recommendation
          label: Track
          description: Reassess after current operating and financing evidence is obtained.
    claimRefs: [CV006, CV008, CV010, CV012, CV013, CV014, CV016]
