      - [Open-model integration, "Maestro access to Together AI and Jamba models", "Current company-announced integration", "Distribution option; no realized revenue disclosed", "Obtain attached revenue, usage, commercial terms, and partner economics"]
      - [Developer access, "Documentation and API resources", "Public developer surface remains available", "No usage, price, or revenue mix disclosed", "Obtain active paid accounts, usage cohorts, churn, and segment revenue"]
    notes: "Statuses combine current company descriptions and independent reporting; no row establishes ARR, accounting revenue, or gross margin."
    claimRefs: [CI001, CI002, CI004, CI005, CI006, CI007]
  - id: TI002
    title: Pricing and sales-efficiency evidence
    columns: [Offer or metric, Public value, What is known, What remains unknown, Diligence ask]
    rows:
      - [Maestro customer price, null, "Customers can set execution budgets", "Billing unit, list price, discount, minimum, and realized price", "Obtain price book and ten representative contracts"]
      - [Third-party model access, null, "Managed and bring-your-own-key options are documented", "Provider markup, pass-through policy, and gross margin", "Obtain provider invoices and customer billing bridge"]
      - [Enterprise contract scale, "Tens of millions of dollars in aggregate", "Reported for major international customers including Nebius", "Number, duration, recognition, renewals, and cash collection", "Inspect executed agreements and accounts-receivable aging"]
      - [Sales efficiency, null, "No eligible public metric in the retained sources", "Sales cycle, win rate, CAC, payback, and channel fees", "Provide quarterly funnel and cohort economics"]
    notes: "Null means the assigned prefetched evidence does not disclose a value; it does not mean zero."
    claimRefs: [CI002, CI007, CI008, CI009, CI013]
  - id: TI003
    title: Unit economics and capital-adequacy checklist
    columns: [Metric, Public value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Current revenue or ARR, null, low, "Establishes scale and a valuation denominator", "Provide monthly recognized revenue and ARR by product"]
      - [Gross or contribution margin, null, low, "Tests whether orchestration can produce software-like economics", "Provide revenue-to-gross-profit bridge by product"]
      - [Inference and tool cost, null, low, "Multi-step execution may create variable delivery cost", "Provide per-task model, tool, cloud, and support costs"]
      - [Retention and concentration, null, low, "Tests durability of the reported contracts", "Provide renewal, expansion, churn, and top-customer shares"]
      - ["Cash, burn, debt, and runway", null, low, "Determines financing dependency after the reset", "Provide cash statements, monthly burn, debt schedule, and runway case"]
      - [Workforce reset, "Approximately 180 to around 70 employees", medium, "Indicates a substantial operating-cost reset, not cash burn", "Provide severance, restructuring charges, and post-reset operating plan"]
    notes: "All nulls are evidence gaps; funding raised, contract headlines, and layoffs are not substitutes for accounting or cash-flow data."
    claimRefs: [CI003, CI010, CI011, CI013, CI014, CI015]

figures:
  - id: FI001
    title: Maestro revenue-model bridge
    type: flow
    summary: "The disclosed operating path reaches enterprise agreements, but public evidence stops before recognized revenue, gross profit, and cash conversion."
    data:
      nodes:
        - id: customer-task
          label: "Enterprise task"
          detail: "A data-intensive workflow is defined with cost and latency requirements."
        - id: planning
          label: "Maestro planning"
          detail: "The system determines a sequence of model and tool actions."
        - id: routing
          label: "Model and tool routing"
          detail: "First-party, managed third-party, or BYOK models can be selected."
        - id: execution
          label: "Multi-step execution"
          detail: "Calls may form a tree and use more effort at higher budgets."
        - id: validation
          label: "Validation and correction"
          detail: "Outputs are checked against customer requirements."
        - id: commercial-output
          label: "Enterprise agreement"
          detail: "Reported contract value exists, but revenue and margin conversion are undisclosed."
      edges:
        - [customer-task, planning]
        - [planning, routing]
        - [routing, execution]
        - [execution, validation]
        - [validation, commercial-output]
    approximationNotes: "This qualitative bridge shows disclosed operating stages; it is not a funnel, revenue forecast, or quantitative waterfall."
    claimRefs: [CI005, CI008, CI014, CI016]

callouts:
  - calloutType: risk
    title: Capital adequacy is not publicly underwritable
    body: "Historical funding, contract headlines, and a workforce reduction do not disclose current cash, burn, debt, runway, or cash conversion."
    claimRefs: [CI003, CI010, CI011, CI012, CI015]
  - calloutType: insight
    title: Contract quality matters more than headline value
    body: "The Maestro thesis improves only if reported agreements are recurring, collectible, and sufficiently high-margin after model, tool, and implementation costs."
    claimRefs: [CI002, CI008, CI013, CI016]

