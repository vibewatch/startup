      - [Model choice and multi-homing, "Maestro supports AI21, managed third-party, and BYOK models", "Usually provider-specific at the API layer", "Framework can connect to selected providers", "Fully configurable but internally maintained"]
      - [Planning and validation, "Maestro dynamically plans actions and validates outputs", "Provider-specific tools vary; no comparable evidence in pool", "Graph/workflow control and deployment path documented", "Customizable but requires engineering and evaluation"]
      - [Deployment control, "AI21 states partner, self-hosted, and private deployment options", "Provider and cloud policies vary", "Managed cloud deployment plus repository-based workflow", "Highest control, highest operating burden"]
      - [Governance and traceability, "Maestro provides execution traces and validation reports", "Not independently benchmarked in assigned sources", "Operational tooling is documented; governance depth is not established", "Can be tailored, but auditability must be built"]
      - [Enterprise outcome proof, "Customer and outcome breadth not quantified in assigned evidence", "Large ecosystem implied but not comparable here", "Deployment mechanics are evidenced, outcomes are not", "Depends on internal measurement"]
    notes: "Cells distinguish source-backed capabilities from unknowns; no unsupported feature parity or benchmark score is inferred."
    claimRefs: [CP005, CP006, CP007, CP008, CP009]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [Option, Public price or unit, Included capability, Discount or contract visibility, Competitive implication]
    rows:
      - [AI21 Maestro, null, "Planning, model/tool selection, validation, traces, and budget controls", "No public price or realized contract terms retained", "Must prove lower total cost or higher reliability than assembled alternatives"]
      - [AI21 Jamba, null, "Foundation models with long-context and efficiency positioning", "No comparable public realized pricing retained", "Technical efficiency may matter where inference cost is material"]
      - [LangSmith Cloud / LangGraph deployment, null, "Managed infrastructure, scaling, background execution, and API deployment", "Plan-specific pricing not present in fetched text", "Distribution and developer convenience can compress orchestration differentiation"]
      - [Promptitude, "100K free tokens advertised for trial", "Prompt management, assistants, flows, tools, and model integrations", "Commercial pricing not captured in assigned text", "Low-friction workflow adoption is a substitute for some application use cases"]
      - [Internal build, null, "Customer-owned models, tools, data, and evaluation stack", "Internal labor and infrastructure not disclosed", "Avoids vendor markup but increases execution and maintenance burden"]
      - [Cloud model catalog, null, "Managed access through existing cloud procurement", "Contract and discount terms are customer-specific", "Can win on security review, procurement, and integration rather than raw model differentiation"]
    notes: "Null price cells mean no comparable public price was retained, not free service or zero cost. Promptitude's trial token offer is a promotional allowance, not realized revenue or a comparable unit price."
    claimRefs: [CP010, CP011, CP012]
figures:
  - id: FP001
    title: Competitive positioning by control and orchestration scope
    type: quadrant
    summary: AI21 occupies a high-control, high-orchestration position in the assigned evidence, while platform and model alternatives cluster on different tradeoffs.
    data:
      points:
        - {label: "AI21 Maestro", x: 0.82, y: 0.86, note: "Model-agnostic planning, validation, and deployment-control claims"}
        - {label: "Frontier model providers", x: 0.42, y: 0.68, note: "Strong model layer and distribution; comparable orchestration evidence not retained"}
        - {label: "LangChain / LangGraph", x: 0.72, y: 0.62, note: "Developer workflow and managed deployment evidence"}
        - {label: "Promptitude", x: 0.46, y: 0.40, note: "Prompt/workflow layer with multi-provider integrations"}
        - {label: "Internal build", x: 0.94, y: 0.91, note: "Potential maximum control, but evidence does not establish execution quality"}
        - {label: "Status quo", x: 0.18, y: 0.16, note: "Low orchestration and low change burden"}
      xAxis: "Control over deployment, data, and workflow"
      yAxis: "Orchestration and validation scope"
    approximationNotes: "Ordinal coordinates are analyst judgments anchored to the cited capability descriptions, not market-share measurements or benchmark scores."
    claimRefs: [CP005, CP007, CP008, CP009, CP010]
callouts:
  - calloutType: strength
    title: Systems-level wedge
    body: AI21 combines a foundation-model story with model-agnostic orchestration, validation, and deployment control, giving it a broader enterprise buying proposition than a model-only API.
    claimRefs: [CP005, CP006]
  - calloutType: risk
    title: Distribution can overwhelm differentiation
    body: Model providers, clouds, and developer platforms can multi-home the same underlying models or bundle orchestration into existing workflows; current customer win-rate and retention evidence is missing.
    claimRefs: [CP007, CP013, CP014]
  - calloutType: recommendation
    title: Track pending proof
    body: Treat AI21 as a credible but unproven competitive position until current production deployments, repeatable customer outcomes, realized pricing, and retention are disclosed.
    claimRefs: [CP010, CP014, CP016]
