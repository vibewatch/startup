        title: Financing, scale, and the 2026 strategic reset
        blocks:
          - type: paragraph
            body: >-
              The last consistently reported valuation is $1.4 billion from the 2023 Series C, but the financing amounts
              conflict. Globes reported a $155 million round and $283 million total raised in August 2023; Turing Post's
              original December 2023 account described a $208 million round and $336 million total, with The Innovator
