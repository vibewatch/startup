        title: Founders, leadership, and governance concentration
        blocks:
          - type: paragraph
            body: >-
              AI21's current About page identifies Ori Goshen as CEO and co-founder and Yoav Shoham as chairman and
              co-founder. Independent reporting continues to identify Amnon Shashua as the third founder, but the
              current official page does not state his operating or governance role. The public materials list academic
              strategic advisors, yet they do not provide a complete board, executive roster, ownership schedule, or
              succession plan. That leaves meaningful key-person dependence: the visible leadership narrative is
              concentrated in Goshen and Shoham, while the company's ability to execute after a roughly 60% workforce
              reduction cannot be assessed from a complete post-reset organization chart.
