      - number: '4.2'
        title: Product controls are visible; customer pricing is not
        blocks:
          - type: paragraph
            body: >-
              Maestro documentation exposes operating levers rather than a price card. Customers can select first-party,
              managed third-party, or bring-your-own-key models, and a budget parameter changes the balance among speed,
              cost, and reliability. Those controls indicate usage-sensitive delivery economics, but they do not reveal
              the billing unit, list price, negotiated discount, minimum commitment, cloud pass-through, implementation
              fee, or realized price. The developer hub confirms that AI21 maintains documentation and API resources,
              but the retained evidence does not quantify pipeline conversion, sales cycle, CAC, payback, channel fees,
              or expansion. Public contract value therefore cannot be translated into sales efficiency or recurring
              revenue.
            claimRefs:
              - CI005
              - CI007
              - CI008
              - CI009
