  - id: FI001
    title: Maestro revenue-model bridge
    type: flow
    summary: >-
      The disclosed operating path reaches enterprise agreements, but public evidence stops before recognized revenue,
      gross profit, and cash conversion.
    data:
      nodes:
        - id: customer-task
          label: Enterprise task
          detail: A data-intensive workflow is defined with cost and latency requirements.
        - id: planning
          label: Maestro planning
          detail: The system determines a sequence of model and tool actions.
        - id: routing
          label: Model and tool routing
          detail: First-party, managed third-party, or BYOK models can be selected.
        - id: execution
          label: Multi-step execution
          detail: Calls may form a tree and use more effort at higher budgets.
        - id: validation
          label: Validation and correction
          detail: Outputs are checked against customer requirements.
        - id: commercial-output
          label: Enterprise agreement
          detail: Reported contract value exists, but revenue and margin conversion are undisclosed.
      edges:
        - - customer-task
          - planning
        - - planning
          - routing
        - - routing
          - execution
        - - execution
          - validation
        - - validation
          - commercial-output
    approximationNotes: >-
