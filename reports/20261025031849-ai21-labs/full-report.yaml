              - CI014
              - CI015
      - number: '4.4'
        title: Historical funding does not establish present liquidity
        blocks:
          - type: paragraph
            body: >-
              Globes reported a $155 million Series C at a $1.4 billion valuation in August 2023 and said the round
              brought cumulative funding to $283 million. Startup Nation Central later reports $326.5 million across
              seven rounds; the different totals may reflect timing or inclusion conventions and should not be collapsed
              into a single current figure without reconciliation. More importantly, funding raised is not cash
              available. None of the retained evidence discloses current cash, monthly burn, debt, runway, working
              capital, or a next-round trigger. The contracts and cost reset may improve the forward profile, but their
              cash conversion and margin are unknown. The financial verdict is therefore conditional: revenue quality
              may improve under Maestro, while liquidity and unit economics remain underwriting blockers.
            claimRefs:
              - CI002
              - CI003
              - CI010
              - CI011
              - CI012
              - CI013
