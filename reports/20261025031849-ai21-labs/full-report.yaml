  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Boundary and buyer
        blocks:
          - type: paragraph
            body: >-
              AI21's addressable market is best defined as enterprise software and services that help organizations run
              language models and knowledge agents inside data-intensive workflows. The included spend is model/API
              consumption, orchestration, evaluation, deployment, and post-training or implementation services tied to
              those workflows. It excludes general consumer AI usage, unrelated cloud infrastructure, and broad
              consulting revenue that is not attributable to language-model or agent work. AI21's own product materials
              identify long-context question answering, financial analysis, retrieval-augmented generation,
              productivity, customer service, and internal knowledge agents as target workflows. The buyer is therefore
              usually an enterprise technology or business-function owner with a defined workflow, while security, data,
              procurement, and finance stakeholders influence approval. Internal development and managed agent
              infrastructure such as LangSmith Cloud are substitutes for parts of this stack. This boundary is narrower
              than a generic AI market and avoids treating all AI spending as AI21's opportunity.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM010
              - CM011
              - CM012
      - number: '2.2'
        title: Sizing through multiple lenses
        blocks:
          - type: paragraph
            body: >-
              Available estimates support a large and rapidly expanding category, but they should not be collapsed into
              one TAM. Polaris reports a large-language-model market of USD 7.81 billion in 2025, USD 10.65 billion in
              2026, and USD 129.97 billion in 2034, with a 36.7% CAGR from 2026 to 2034; its methodology covers software
              and services with different regional and offering definitions. Axis presents an AI-agent market forecast
              with 2030 estimates ranging from roughly USD 47 billion to USD 57 billion and a higher USD 182.97 billion
              2033 estimate, explicitly noting that firms include different combinations of software, infrastructure,
              and services. Its separate Gartner-attributed software-spending lens is USD 86.4 billion in 2025, USD
              206.5 billion in 2026, and USD 376.3 billion in 2027. These figures are directional category evidence, not
              a company-specific SAM or SOM. AI21's own disclosed revenue is unavailable; the third-party estimate of
              approximately USD 350 million annualized revenue in 2026 is explicitly unconfirmed and must not be used as
              ARR or cash generation.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
      - number: '2.3'
        title: Adoption drivers and constraints
        blocks:
          - type: paragraph
            body: >-
              Demand is moving from experiments toward production, especially among larger enterprises. McKinsey reports
              that 44% of respondents say AI is scaling across their enterprise, 40% of respondents from organizations
              above USD 1 billion in annual revenue report scaling agents in at least one function, and 60% expect AI
              investment to increase in the next year. Deloitte similarly reports that 34% of surveyed organizations are
              deeply transforming with AI, while 30% are redesigning key processes around AI. These signals create a
              plausible adoption path for an orchestration layer that improves quality, latency, and cost across models.
              The constraint is that adoption is not equivalent to economic value: McKinsey reports 37% of respondents
              attributing positive EBIT impact to AI and about one in five reporting operating-cost constraints.
              Deloitte identifies skills, infrastructure, data, risk, and talent readiness as barriers, while Polaris
              highlights compute cost, privacy, hallucination, bias, and regulatory challenges. For AI21, market capture
              depends on proving repeatable workflow ROI and governance fit, not only model quality.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: Market implications and unresolved sizing
        blocks:
          - type: paragraph
            body: >-
              AI21's Maestro positioning is differentiated by dynamic planning, model-agnostic orchestration,
              validation, traceability, and explicit budget controls. Those capabilities map to a buyer problem that is
              broader than selecting a single model: enterprises need to balance reliability, latency, cost, data
              control, and workflow integration. The market evidence nevertheless leaves the commercial boundary
              unresolved. The retained sources do not disclose AI21's current recurring revenue, segment mix, win rate,
              retention, or the portion of category spending reachable through Maestro versus model APIs, private
              deployments, and services. AI21 also faces a build-versus-buy risk: McKinsey reports that 32% of
              respondents decided against buying at least one software product because agentic coding tools enabled
              internal construction. The next diligence step is a segment-level bookings and pipeline bridge with
              customer cohorts, deployment economics, and evidence that Maestro expands beyond a limited lighthouse set.
            claimRefs:
              - CM002
              - CM008
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Clear problem fit
            body: >-
              Maestro's model selection, validation, traceability, and budget controls align with enterprise adoption
              barriers around cost, reliability, and governance.
            calloutType: strength
            claimRefs:
