  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and buyer workflow
        blocks:
          - type: paragraph
            body: >-
              AI21's current public product surface is a two-layer offering. Jamba supplies long-context language
              models, while Maestro is the application layer for knowledge agents that search, reason, validate, and
              answer from business knowledge. This maps to an enterprise workflow in which a team supplies approved
              documents or a knowledge base, connects tools, chooses or permits model selection, and receives an answer
              with a validation loop. The model and agent layers can be consumed through the platform, REST API, Python
              SDK, playground, and documented ecosystem integrations. That is a more concrete workflow than a generic
              chatbot, but public material does not establish production volumes, service-level commitments, or realized
              customer outcomes.
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE008
              - CE009
              - CE013
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE005
              - CE006
              - CE007
              - CE008
              - CE015
      - number: '5.2'
        title: Architecture, deployment, and integration
        blocks:
          - type: paragraph
            body: >-
              Maestro's documented execution model is dynamic rather than a fixed prompt wrapper: it can build a tree of
              calls to language models and other tools, select a model, allocate a budget, and apply self-validation and
              correction. The platform therefore exposes a control plane for model choice and workflow execution, while
              Jamba supplies first-party models and the documentation also describes third-party and bring-your-own-key
              paths. AI21 documents cloud-hosted VPC, on-premises, and custom hybrid deployment paths for Jamba, which
              can matter for controlled data environments. REST, Python, and cloud-provider access broaden integration
              options. The main diligence gap is operational: the public sources describe capability and configuration,
              not measured latency distributions, uptime, isolation controls, incident response, or the implementation
              burden of each path.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
