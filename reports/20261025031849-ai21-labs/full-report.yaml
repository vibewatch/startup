    summary: >-
      The chronology shows a progression from writing software and proprietary models to Jamba, Maestro, and a sharply
      smaller agent-optimization company.
    data:
      items:
        - date: '2017'
          label: AI21 Labs founded
          detail: Ori Goshen, Yoav Shoham, and Amnon Shashua founded the Tel Aviv company.
          tone: neutral
          claimRefs:
            - CO001
        - date: 2020-10
          label: Wordtune launched
          detail: The consumer writing assistant became AI21's first public product.
          tone: positive
          claimRefs:
            - CO015
        - date: 2021-09
          label: Jurassic-1 model milestone
          detail: Independent accounts place AI21's large proprietary model in the 2021 scale race.
          tone: positive
          claimRefs:
            - CO015
        - date: 2023-08
          label: Globes reports Series C
          detail: Globes reported $155 million raised, $283 million cumulative funding, and a $1.4 billion valuation.
          tone: positive
          claimRefs:
            - CO006
            - CO007
            - CO008
        - date: 2023-11
          label: Later financing account differs
          detail: Turing Post described the Series C as $208 million and cumulative funding as $336 million.
          tone: warning
          claimRefs:
            - CO009
            - CO010
        - date: 2024-03
          label: Jamba released
          detail: The hybrid Mamba-Transformer model marked a new foundation-model architecture.
          tone: positive
          claimRefs:
            - CO016
        - date: 2025-03
          label: Maestro announced
          detail: AI21 shifted its product story toward planning and orchestration for enterprise agents.
