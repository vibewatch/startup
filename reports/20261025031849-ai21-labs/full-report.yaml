      - CE005
      - CE006
      - CE007
      - CE008
      - CE009
  - id: FU001
    title: Customer journey from self-serve reach to enterprise expansion
    summary: >-
      Public evidence shows a progression from broad writing-product reach through developer access to workflow pilots
      and potential expansion, with retention and revenue denominators still unresolved.
    type: journey-map
    data:
      items:
        - label: Reach
          stage: Reach
          title: Wordtune
          description: >-
            Consumer and professional writing assistance with millions of users reported by a World Economic Forum
            profile.
          touchpoints:
            - Web editor
            - Browser extensions
            - Writing and summarization
        - label: Build
          stage: Build
          title: Developer platform
          description: SDK, REST API, model access, and RAG-oriented documentation.
          touchpoints:
            - Python SDK
            - REST API
            - Cloud platforms
        - label: Land
          stage: Land
          title: Named workflow
          description: Concrete business workflow such as retail after-sales, game writing, or advertising scripts.
          touchpoints:
            - Operational data
            - Existing tools
            - Human review
        - label: Validate
          stage: Validate
          title: Phased deployment
          description: Pilot-to-production governance and staged rollout are described for the Fnac Darty case.
          touchpoints:
            - Pilot region
            - Stakeholder review
            - Production readiness
        - label: Expand
          stage: Expand
          title: Additional processes
          description: Maestro's stated value proposition is reusable orchestration across more data-intensive tasks.
          touchpoints:
            - More workflows
            - More teams
            - Private deployment
        - label: Retain
          stage: Retain
          title: Durability proof
          description: NRR, churn, renewals, contract length, and customer concentration are not publicly disclosed.
          touchpoints:
            - Cohorts
            - Renewals
            - Expansion revenue
