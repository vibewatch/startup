chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and current business model
        blocks:
          - type: paragraph
            body: >-
              AI21 Labs was founded in 2017 in Tel Aviv by Ori Goshen, Yoav Shoham, and Amnon Shashua. Its current
              public positioning has moved beyond a simple foundation-model vendor: the company website emphasizes
              post-training models on customer data, while product documentation presents Maestro as a model-agnostic
              planning and orchestration system that selects tools and models, validates outputs, and manages cost and
              latency. This supports a current enterprise-services and software thesis built around specialized
              intelligence and agent optimization. It does not establish adoption, recurring revenue, or gross margin,
              and the retained sources do not provide a current financing-stage label beyond showing that AI21 remains
              privately financed.
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO013
