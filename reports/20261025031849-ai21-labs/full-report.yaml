      - number: '4.3'
        title: Multi-step orchestration creates an unquantified cost stack
        blocks:
          - type: paragraph
            body: >-
              Each Maestro call can construct a tree of model and tool calls, while higher budget settings permit more
              execution steps and validation. This makes model inference, third-party provider fees, tool usage, and
              support or implementation labor plausible cost drivers. It does not prove that those costs are borne by
              AI21, passed through to customers, or recovered at a software-like margin. The public evidence contains no
              gross margin, contribution margin, utilization, retention, or cohort data. The May 2026 reduction from
              roughly 180 employees to about 70 signals a large reset in the operating expense base, but accounting loss
              and cash burn cannot be inferred from a workforce change.
            claimRefs:
              - CI003
              - CI008
              - CI010
              - CI011
              - CI013
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
