company:
  name: AI21 Labs
chapter:
  number: 6
  title: Customers
  summary: AI21 shows credible enterprise adoption signals through named production-oriented use cases and a growing Maestro workflow wedge, but public evidence does not establish recurring revenue, retention, or customer concentration. The strongest proof is use-case-specific rather than a complete customer base disclosure.
sections:
  - id: customer-segmentation
    title: Buyer and use-case segmentation
    body: >-
      AI21's customer surface spans two distinct motions. Wordtune is a self-serve
      writing and reading product aimed at professionals, students, and content
      creators, while the developer and enterprise motion sells model access,
      private deployment, and workflow systems to organizations. The company
      describes Maestro and Jamba around data-intensive business workflows, and
      the public customer examples map to retail after-sales service, game-content
      production, and media advertising. This is a useful segmentation by buyer
      job, but it is not a disclosed revenue segmentation: public sources do not
      provide active-account counts, paid conversion, revenue by product, or the
      share of customers using AI21-hosted versus private deployments. The
      customer thesis therefore rests on named workflow adoption rather than on
      an independently verified installed-base number.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-and-durability
    title: Adoption trajectory and durability
    body: >-
      The visible adoption trajectory is progressing from broad consumer reach
      and developer access toward enterprise workflow deployment. A World Economic
      Forum profile describes millions of Wordtune users, while AI21 documents a
      public API and SDK surface and private or on-premises Jamba deployment. The clearest recent
      enterprise signal is Fnac Darty's December 2025 partnership, where Maestro
      is applied to historical and real-time after-sales data and technician
      support. Apps Run The World records a 2025 initial scope in France with
      staged pilot-to-production progression, while the announcement itself
      describes an intended path to broader automation and savings rather than
      realized savings. This supports a credible land-and-expand hypothesis,
      but no source in the assigned pool reports NRR, GRR, churn, renewal rates,
      contract duration, cohort retention, or a denominator for active enterprise
      accounts. Those omissions materially limit durability underwriting.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
  - id: named-proof-and-risks
    title: Named proof, expansion, and concentration risk
    body: >-
      Named customer evidence is strongest when it describes a concrete workflow
      and implementation boundary. Fnac Darty's case is an enterprise strategic
      partnership beginning in after-sales service; Apps Run The World also
      lists Ubisoft's content-production use and Write Label's advertising-script
      workflow. These examples indicate multiple verticals and use cases, but
      they do not prove that every deployment is production-scale or recurring.
      Review evidence for Wordtune is directionally positive on usability and
      integrations, while also identifying limits on free-plan usage, support,
      billing, and contextual accuracy. The public record does not disclose
      top-customer revenue share, channel dependence, procurement cycle length,
      or whether the Fnac Darty and other deployments expanded beyond their
      initial scopes. The main customer risks are therefore concentration and
      conversion risk: a small set of lighthouse implementations may carry more
      strategic weight than the undisclosed paying base, and pilots may not
      convert into durable production economics.
    claimRefs: [CU010, CU011, CU012, CU013, CU014]
    tableRefs: [TU003]
  - id: customer-evidence-gaps
    title: Diligence gaps
    body: >-
      AI21 should provide a customer bridge that reconciles Wordtune users,
      API accounts, enterprise deployments, pilots, and paying customers at a
      common reporting date. That bridge should separate logos from active use,
      production from pilot, and direct customers from partner-mediated access.
      Investors also need cohort-level retention and expansion data by product,
      including gross and net retention, churn reasons, renewal terms, usage
      intensity, and the revenue contribution of the largest customers. For
      Maestro specifically, diligence should test implementation time, human
      review requirements, realized accuracy and cost improvements, and the
      conversion rate from initial workflow to additional business processes.
      Without those denominators, public customer proof supports product-market
      plausibility but not a high-confidence durability or concentration judgment.
    claimRefs: [CU015, CU016]
