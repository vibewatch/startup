    rows:
      - [Fnac Darty, European retail, "Maestro for after-sales triage, diagnostic decision support, and technician guidance", "Strategic partnership with phased rollout; initial use case", "Targeted reduction of errors, turnaround time, and unnecessary home visits", "Announcement describes aims, not realized savings or retention"]
      - [Ubisoft, Game development/media, "Language-model output for game writing, NPC dialogue, and fine-tuning data", "Implementation reported in 2023", "Apps Run The World reports faster authoring and more training data", "Current contract status and measured denominator unavailable"]
      - [Write Label, US media/advertising, "J2 Jurassic-2 API workflow for script variants and near-real-time generation", "Production use reported in 2024", "Reported hours-to-seconds turnaround and approximately 95% lower writing cost", "Single case-study result; attribution and current expansion require verification"]
      - [Wordtune users, Consumer/professional writing, "Browser and web-editor rewriting, summarization, and tone workflows", "Product usage, not named enterprise deployment", "AI21 says millions of users; reviewers cite ease of use and integrations", "User count is company-claimed and retention/paid share are unknown"]
    notes: "Named proof is partial and heterogeneous: a strategic partnership, reported implementations, and a broad consumer product signal are not interchangeable evidence of recurring enterprise revenue."
    claimRefs: [CU006, CU010, CU011, CU012, CU013]
figures:
