evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-scale
    missingEvidence: >-
      Current ARR and recognized revenue by product, bookings and backlog, gross margin, burn, runway, active-customer
      count, retention, and customer concentration.
    whyItMatters: >-
      The historical valuation and reported strategic reset cannot be translated into current commercial scale or
      financial durability.
    diligencePath: >-
      Request a current management financial pack, signed-contract schedule, revenue bridge, customer cohorts, and bank
      and debt statements under confidentiality.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: >-
      Complete executive, board, observer, strategic-advisor, and post-restructuring organization rosters with reporting
      lines and succession coverage.
    whyItMatters: >-
      Public founder biographies do not establish governance independence, decision rights, or operational depth after
      the workforce reduction.
    diligencePath: >-
      Obtain the current organization chart, board and committee roster, governance documents, and key-person succession
      plan.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      A complete financing ledger and current cap table reconciling the reported $155 million versus $208 million Series
      C and $283 million versus $336 million cumulative totals.
    whyItMatters: >-
      Round size, ownership, preferences, and total capital raised affect dilution, liquidation economics, and the
      interpretation of the historical valuation.
    diligencePath: >-
      Request executed financing documents, the fully diluted cap table, preference waterfall, debt schedule, and
      records of any secondaries.
    relatedQuestionRefs:
      - QO004
      - QO010
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: sizing
    missingEvidence: AI21's current revenue by product, customer segment, geography, and recurring versus services mix.
    whyItMatters: Without a segment revenue bridge, broad category forecasts cannot be converted into an AI21-specific SAM or SOM.
    diligencePath: >-
      Request a management revenue bridge, bookings pipeline, customer cohorts, and product-level gross-margin
      contribution under NDA.
    relatedQuestionRefs:
      - QM009
  - type: missing-source
    severity: material
    topic: buyer
    missingEvidence: Named customer procurement and budget-owner evidence for Maestro deployments.
    whyItMatters: The adoption map is based on product requirements and industry surveys rather than observed AI21 buying processes.
    diligencePath: >-
      Obtain reference calls and redacted order forms showing buyer, payer, contract scope, implementation time, and
      renewal terms.
    relatedQuestionRefs:
      - QM005
      - QM009
  - type: enumeration-incomplete
    severity: minor
    topic: market-size
    missingEvidence: A consistent, primary market dataset separating model APIs, orchestration, deployment, and services.
    whyItMatters: Current estimates use incompatible scopes and may overstate the budget pool relevant to Maestro.
    diligencePath: >-
      Triangulate paid analyst datasets with public-company segment disclosures and procurement benchmarks using one
      explicit taxonomy.
    relatedQuestionRefs:
      - QM003
      - QM004
  - type: missing-source
    severity: material
    topic: adoption-constraints
    missingEvidence: AI21-specific evidence on implementation cost, deployment duration, conversion, and retention.
    whyItMatters: Category adoption rates and enterprise AI surveys do not prove repeatable unit economics for AI21.
    diligencePath: >-
      Request a cohort-level deployment funnel from pilot to production, including time-to-value, gross margin,
      expansion, churn, and support intensity.
    relatedQuestionRefs:
      - QM007
      - QM009
  - type: private-evidence-only
    severity: material
    topic: competitive-proof
    missingEvidence: Current customer-level win rates, retention, expansion, and benchmarked outcomes by competitor or use case.
    whyItMatters: >-
      Without comparative outcomes, technical and orchestration differentiation cannot be translated into durable share
      or pricing power.
    diligencePath: >-
      Request a cohort and competitive-win data room cut covering the last four quarters, with customer references and
      deployment scope.
    relatedQuestionRefs:
      - QP007
      - QP008
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      AI21 list pricing, realized pricing, discounts, gross margin, and contract structure compared with model and
      platform alternatives.
    whyItMatters: >-
      Pricing and total cost of ownership determine whether orchestration value offsets incumbent distribution and
      open-source substitution.
    diligencePath: >-
      Obtain representative contracts, usage-based invoices, discount schedules, and customer total-cost-of-ownership
      analyses.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: stale
    severity: material
    topic: technical-differentiation
    missingEvidence: Current 2026 independent benchmarks for Jamba and Maestro against frontier models and orchestration frameworks.
    whyItMatters: >-
