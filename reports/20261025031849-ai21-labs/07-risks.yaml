      - ["Copyright policy and training-content summary", "EU; Article 53 duty for in-scope GPAI providers", "High if an offered model is in scope", "High", "Unverified in the retained pool", "High because compliance evidence is absent here", "Review copyright-reservation controls, provenance records, and the public training-content summary."]
      - ["Enterprise privacy and data access", "Global; contract and deployment dependent", "Medium", "High", "Partial: VPC/on-premises deployment and logged access are described", "Medium-high until controls are audited", "Review DPA, retention, subprocessors, tenant isolation, access logs, and customer-specific data flows."]
      - ["Model safety and evolving standards", "US and global; voluntary standards continue to develop", "Medium", "High", "Partial: guardrails and internal red-teaming are reported", "Medium-high without independent results", "Obtain current model cards, red-team reports, abuse monitoring, and external evaluation results."]
    notes: "Coverage is partial; likelihood, severity, maturity, and residual exposure are analyst assessments, not legal conclusions or recorded violations."
    enumerationScope:
      coverage: partial
      basis: "Public regulatory and legal exposure categories supported by the assigned evidence as of 2026-10-25; private contracts and undisclosed proceedings are excluded."
    claimRefs: [CR005, CR006, CR007, CR008, CR015]
  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - ["Compounded error across planning, retrieval, tools, and models", "Medium", "High", "Partial: self-validation and execution traces are described", "High for consequential workflows without independent error distributions", "Representative precision, recall, citation, escalation, and human-override evidence."]
      - ["Reliability-cost-latency trade-off", "High", "High", "Documented control through selectable budgets", "Medium-high because stronger validation consumes more resources", "Per-workflow quality and unit-cost curves at low, medium, and high budgets."]
      - ["Security or vendor incident obscured by limited public evidence", "Unknown", "High", "Unverified", "High until incident and assurance records are reviewed", "Breach, outage, vulnerability, postmortem, penetration-test, and notification history."]
      - ["External model or API behavior changes", "Medium", "High", "Partial: model selection and customer-key options exist", "Medium-high until fallbacks are tested", "Provider-specific SLOs, regression tests, version pinning, and failover evidence."]
    notes: "No retained source provides a complete current incident register or independently measured Maestro production-quality distribution; unknown is not scored as zero."
    claimRefs: [CR001, CR002, CR003, CR004, CR009, CR013, CR014]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty or layer
      - Role
      - Concentration or reliance
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - ["Third-party foundation models", "OpenAI, Anthropic, Google, and other supported providers", "Managed or customer-key model execution", "Potentially material by workflow", "Outage, policy change, model regression, or price increase", "High", "Model-agnostic selection and BYOK", "Medium-high until tested across provider failures."]
      - ["Cloud and toolchain platforms", "Leading cloud providers, LangChain, LlamaIndex, and customer infrastructure", "Hosting, access, and integration", "Distributed but operationally complex", "Regional outage, integration break, or data-residency conflict", "High", "REST/SDK access plus cloud and private deployment choices", "Medium until portability and recovery are demonstrated."]
      - ["Customer data and environment", "Enterprise customer", "Retrieval corpus, evaluation set, and deployment perimeter", "High for customized outcomes", "Poor data quality or access controls degrade results or delay deployment", "High", "Customer-perimeter deployment and scoped access", "Medium-high without customer-specific acceptance evidence."]
      - ["Capital providers and financing market", "Existing and future investors", "Funding model development and enterprise support", "Current reliance is undisclosed", "Cash needs outpace commercial proof or financing terms deteriorate", "High", "Historical institutional backing", "High because 2023 funding raised is not current cash available."]
    notes: "The table distinguishes integration availability from tested redundancy and historical funding from current liquidity; concentration levels are not publicly quantified."
    claimRefs: [CR002, CR005, CR011, CR012, CR015]
