  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: business-line-revenue-mix
    missingEvidence: HomeLight does not disclose current revenue by line across referrals, Buy Before You Sell, Home Loans, Simple Sale, or EVA/closing. The reviewed public corpus provides traction metrics and pricing signals, but not business-line mix, close rates, or revenue recognition by product.
    whyItMatters: Without line-level revenue mix, it is impossible to judge whether HomeLight is still mainly a referral marketplace, already predominantly a bridge-and-closing platform, or cross-subsidizing newer products with legacy referral economics.
    diligencePath: Request trailing-twelve-month revenue by business line, contribution margin by line, and take-rate or attach-rate waterfalls from referral lead through funded or closed transaction.
    relatedQuestionRefs:
    - QI008
    relatedTableRefs:
    - TI001
    - TI002
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-and-covenants
    missingEvidence: HomeLight does not publicly disclose cash on hand, monthly burn, runway, debt covenants, warehouse-line availability, or current lender-facility terms.
    whyItMatters: The company has layered debt onto equity in 2021, 2022, and 2026, so capital adequacy cannot be underwritten without knowing available liquidity, covenant headroom, and whether bridge or closing products depend on additional off-balance-sheet funding capacity.
    diligencePath: Request current cash, trailing-twelve-month burn, monthly cash bridge, all debt agreements, covenant package, warehouse/repurchase capacity, and management runway plan under base and stressed transaction-volume cases.
    relatedQuestionRefs:
    - QI013
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: bbys-credit-performance
    missingEvidence: No public source in the reviewed corpus discloses Buy Before You Sell default rates, loss severity, repurchase obligations, or the realized spread or fee economics behind the advertised 0% bridge-loan offer.
    whyItMatters: Bridge and equity-unlock products can look attractive at the top of the funnel while hiding meaningful credit losses, warehouse costs, or exceptions handling in the back book. That can materially change gross-margin quality and cash needs.
    diligencePath: Request BBYS cohort performance, delinquency and loss curves, warehouse-cost schedule, partner economics, exception rates, and contribution margin per funded client by vintage.
    relatedQuestionRefs:
    - QI005
    - QI021
    relatedTableRefs:
    - TI003
    - TI004
  - type: private-evidence-only
    severity: material
    topic: current-revenue-and-margin
    missingEvidence: The last clear revenue anchor in the reviewed public corpus is TechCrunch's report that HomeLight expected annual revenue above $300M in 2021; there is no comparable 2024-2026 revenue, gross-margin, or EBITDA disclosure.
    whyItMatters: That leaves investors unable to distinguish between a still-large but cyclical platform, a shrinking business held together by fresh debt, or a product mix that has successfully shifted toward higher-quality closing and financing revenue.
    diligencePath: Request 2021-2026 audited or management revenue bridge, gross profit by line, EBITDA history, and forward budget assumptions tied to transaction-volume scenarios.
    relatedQuestionRefs:
    - QI001
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
