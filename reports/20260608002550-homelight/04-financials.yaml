tables:
- id: TI001
  title: Revenue Streams Table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value/status
  - Quality
  - Diligence ask
  rows:
  - - Agent referral marketplace
    - HomeLight matches consumers to agents and collects a share of agent commission after close
    - Referral fee on agent commission
    - Current contract terms say 30% or 33%
    - Best public pricing anchor; realized close-rate and share-of-wallet unknown
    - Request close-rate by lead cohort, realized referral fee by side, and share of matched agents' annual volume
  - - Buy Before You Sell / bridge-equity unlock
    - Bridge product removes home-sale contingency and unlocks equity before sale
    - Bridge financing plus attached transaction economics
    - Current pages market 0% bridge loan; up to 90% CLTV and up to $2M equity access
    - List pricing is visible but monetization path is not
    - Request spread/fee schedule, loss rates, partner economics, and contribution margin by funded client
  - - HomeLight Home Loans / lender referrals
    - Mortgage origination or lender handoff following matched purchase intent
    - Mortgage revenue, referral revenue, or partner fee
    - Brand and licensing are visible; current public economics are not
    - Operational presence is clear; revenue model is opaque
    - Request funded-loan volume, gain-on-sale economics, partner rev share, and attach rate from matched customers
  - - Simple Sale / investor network
    - Seller can skip listing and route to investor or cash-buyer network
    - Referral or transaction fee
    - Current site positions the path, but no public fee card appears
    - Revenue exists conceptually; public monetization details are thin
    - Request investor-network take rate, win/loss rate versus listing path, and average revenue per converted seller
  - - Closing / EVA automation
    - AI-powered escrow workflow automates 80+ tool interactions and about 120 closing tasks
    - Closing-service fee, workflow software fee, or bundled transaction revenue
    - Public traction and financing are disclosed; public pricing is not
    - Good product disclosure, weak economics disclosure
    - Request per-file revenue, labor-hours saved, gross margin, and attach to referrals or loans
  - - Cross-product platform monetization
    - Household can begin with an agent match and expand into financing and closing
    - Attach-rate uplift across lifecycle
    - HomeLight discloses cumulative scale metrics, not business-line revenue mix
    - Strong strategic logic, weak segment disclosure
    - Request funnel from matched lead to financed client to closed transaction with revenue per step
  notes: Public sources support the existence of multiple monetization lines, but only agent referral terms and top-of-funnel traction are directly disclosed; realized mix remains private.
