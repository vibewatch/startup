  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-visibility
    missingEvidence: Segmented NRR, GRR, churn, contract length, and repeat-usage cohorts for consumers, agents, lenders, and closing-services partners.
    whyItMatters: Without retention cohorts, public satisfaction and testimonial evidence cannot be translated into durable revenue quality.
    diligencePath: Request cohort tables by product and partner type, plus top-quartile versus bottom-quartile complaint and renewal outcomes.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: attach-rate-visibility
    missingEvidence: Attach rates from agent-match entrants into Simple Sale, BBYS, Home Loans, and Closing Services, with approval and fallout funnels.
    whyItMatters: HomeLight’s platform thesis depends on cross-sell economics, but public sources only show product availability and curated success stories.
    diligencePath: Request product funnel data from inquiry through funded loan or closed transaction, broken out by consumer entry channel and geography.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: concentration-visibility
    missingEvidence: Active-user counts, top-customer concentration, and revenue concentration across agents, lenders, and closing-services partners.
    whyItMatters: Large cumulative reach claims can mask weak current activity or dependence on a smaller set of productive partners.
    diligencePath: Request monthly active customer and partner counts, top-20 revenue concentration, and productivity distribution across the agent network.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: TU003 named customer proof remains partial and curated
    missingEvidence: A broader roster of independently verifiable named HomeLight customers across seller, buyer, BBYS, lender, and closing-service use cases.
    whyItMatters: The public proof set is strong on curated examples but still too selective to establish segment-level coverage or representativeness.
    diligencePath: Request a dated customer reference list with product used, geography, tenure, and whether each reference is still active.
    relatedQuestionRefs:
    - QU013
    - QU014
    - QU015
    relatedTableRefs:
    - TU003
