- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Public evidence
  - Revenue / strategic implication
  - Concentration or execution risk
  - Diligence path
  rows:
  - - Agent match to Simple Sale
    - Official reviews content says sellers can compare agent and investor routes
    - Raises consumer monetization beyond pure referral
    - Bait-and-switch complaints can undermine trust at the first cross-sell
    - Request conversion by source page and by route taken
  - - Agent match to BBYS
    - Official BBYS pages pitch certainty for buy-sell households
    - Potentially higher-value multi-product household revenue
    - Opaque eligibility, fees, and timelines can increase support burden
    - Request BBYS attach rate from agent-match entrants by cohort
  - - BBYS to Home Loans or lender partner workflow
    - ConsumerAffairs and lender pages position loan officers inside the journey
    - Keeps more financing economics inside the HomeLight orbit
    - No public attach rate, approval-rate, or fallout disclosure
    - Request funnel data from BBYS inquiry to funded mortgage
  - - Transaction to Closing Services
    - HomeLight markets modern title and escrow plus strong partner testimonials
    - Can deepen monetization late in the transaction and improve control
    - Poor handoffs or opaque settlement communication can damage the full brand
    - Request closing-services attach, defect, and repeat-partner data
  - - Performance-based professional loop
    - Referrals, metrics, and achievements reward stronger operators
    - Better agents could improve consumer outcomes and lead ROI
    - The same ranking pressure can encourage aggressive follow-up and complaints
    - Request conversion, complaint, and quality outcomes by agent cohort
  notes: Expansion logic is strategically coherent, but public evidence does not quantify attach rates or concentration, so the model remains directionally plausible rather than fully underwritten.
  claimRefs:
