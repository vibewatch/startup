  - TU006
- id: expansion-loops-and-concentration-risk
  title: Expansion loops and concentration risk
  body: 'HomeLight’s expansion story is intuitive even if the economics are still opaque. The company can acquire a household through free agent matching or a Simple Sale inquiry, move that customer into Buy Before You Sell or Home Loans when timing becomes the bottleneck, and then keep part of the transaction inside HomeLight Closing Services. On the professional side, agents and lenders can start with lead flow and expand into BBYS, cash buyers, or closing coordination. That means the platform has real cross-sell potential on both consumer and professional sides. The problem is visibility. No reviewed source disclosed attach rates into Home Loans or Closing Services, active-user counts, top-customer concentration, or cohort renewal behavior. Even some secondary review pages are access-limited or dynamically rendered, which narrows independent verification. The scale facts should therefore stay aligned with chapter 1: HomeLight clearly has meaningful reach. But from a customer-risk perspective,
    the main unresolved question is not whether users exist; it is whether enough of them compound into durable, multi-product relationships without trust leakage along the way.'
