- id: TU006
  title: Adverse review and complaint pattern table
  columns:
  - Pattern
  - Source evidence
  - Affected segment
  - Severity
  - Implication
  - Current company response
  rows:
  - - Persistent calls, texts, and emails after signup
    - BBB reviews, BBB complaints, and editorial review sites
    - Consumers entering match, value, or Simple Sale flows
    - high
    - Top-of-funnel trust can degrade before a transaction starts
    - Often promises manual removal from internal systems
  - - Data shared to more agents or investors than expected
    - BBB complaints cite information sent to at least eight parties in one case
    - Consumers expecting limited outreach
    - high
    - Lead-distribution model can look deceptive or uncontrolled
    - HomeLight says users may still need to tell third parties to stop
  - - Simple Sale / cash-offer bait-and-switch perception
    - BBB reviews say investor requests turned into agent outreach
    - Sellers seeking quick cash certainty
    - high
    - Cross-sell tactics can weaken conversion and brand trust
    - Responses emphasize apology and internal review rather than structural redesign
  - - BBYS / equity-advance communication and document confusion
    - BBB adverse review alleges unclear DTI impact, wrong documents, and vague HUD math
    - BBYS households and partner professionals
    - high
    - Downstream execution risk can jeopardize high-value transactions
    - No public operational SLA or error-rate disclosure
  - - Agent-member support and cancellation issues
    - BBB complaints describe months of unanswered support and ongoing charges
    - Professional users paying for features or referrals
    - medium
    - Partner satisfaction risk can lower network quality over time
    - HomeLight responses often cite internal investigation and refunds
  - - Access-limited review surfaces
    - Real Estate Bees required reader fallback and still displayed no customer reviews found
    - Analysts and diligence teams
    - low
    - Independent verification is narrower than raw web search suggests
    - Use primary complaint sources like BBB and direct official pages instead
  notes: This table focuses only on recurring adverse patterns visible during the run, not on isolated one-off complaints.
