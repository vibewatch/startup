- id: satisfaction-complaints-and-durability-gaps
  title: Satisfaction, complaints, and durability gaps
  body: 'The adverse record centers on trust and handoff quality. BBB’s live profile showed a middling 3.51 out of 5 review average and 27 complaints over three years, while editorial roundups cite broader aggregates in the 3.9 to 4.3 range. The directional takeaway is not that HomeLight is failing universally; it is that the strongest public complaints are consistent. Consumers repeatedly describe aggressive calls, texts, and emails after entering information, unexpected distribution of their contact details to several agents or investors, and frustration when asking to be removed. More serious complaints extend into execution: one BBB review tied to an Orchard/HomeLight equity-advance handoff alleged unclear DTI effects, poor coverage while a loan officer was away, wrong documents, and vague settlement math. That matters because HomeLight’s public proof is about trust as much as matching quality. There is no public NRR, GRR, churn, or renewal data, so these complaint patterns become the
    main public durability proxy.'
  claimRefs:
  - CU024
  - CU025
  - CU026
  - CU027
  - CU028
  - CU029
