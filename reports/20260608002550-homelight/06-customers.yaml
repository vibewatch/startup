company:
  name: HomeLight
chapter:
  number: 6
  title: Customers
  summary: HomeLight’s customer proof is strongest across consumers who need fast agent matching or buy-before-you-sell certainty and across professionals who monetize referral, lending, and closing workflows. Public evidence supports meaningful reach and real transaction usage, but the same record also shows recurring spam/contact complaints, some BBYS and closing-service execution frustration, and little public retention or concentration data.
sections:
- id: customer-segments-and-decision-drivers
  title: Customer segments and decision drivers
  body: 'HomeLight’s customer base is broader than a single homeowner clicking a match form. On the consumer side, the company serves sellers who want an agent quickly, buyers who want local guidance, homeowners who want a cash-offer or investor route, and households that need to buy before they sell. On the professional side, it serves partner agents, loan officers, and closing teams who use HomeLight as a lead source or execution layer. The common decision driver on the consumer side is convenience and certainty: fast agent comparison, a no-obligation starting point, and ways to remove timing stress from a move. Price is notably weaker as a decision driver. Independent reviewers repeatedly say HomeLight is free to try but usually routes consumers to standard-commission agents, which makes the product strongest for people optimizing for speed, local expertise, or optionality instead of lowest fees. That split matters because it explains both customer traction and a core pricing risk.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU016
  - CU023
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: two-sided-network-and-channel-economics
  title: Two-sided network and channel economics
  body: 'HomeLight’s economics are two-sided. Consumers are told the search experience is free, but professionals fund the system through referral fees and adjacent product attach. On the agent side, HomeLight publishes a meritocratic story: achievements and matching are supposed to come from verified performance, while referral quality depends on operational metrics such as speed to lead, connection rate, meeting rate, listing rate, and close rate. The professional promise is that better execution earns better future leads and access to more monetizable products. The referrals page’s Julie Wyss example suggests this can be economically meaningful for high performers. On the company side, that creates a reinforcing loop: more consumer demand generates more behavioral data, and more behavioral data can be used to rank supply. But it also creates pressure. The same automated outreach and performance logic that improves conversion can also make the product feel aggressive or spammy when customers
    did not expect how quickly their information would circulate.'
  claimRefs:
  - CU008
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  tableRefs:
  - TU002
  figureRefs:
  - FU002
- id: customer-proof-and-adoption-quality
  title: Customer proof and adoption quality
  body: 'Public customer proof is real, but it is strongest on completed transactions rather than enduring relationships. Official HomeLight materials say the company has helped almost or more than two million buyers and sellers and works with around 30,000 agents. The best proof is more specific: homeowner BBYS stories say the product reduced stress and enabled better sale outcomes; lender testimonials describe concrete equity unlock amounts, non-contingent offers, and a 16-day closing; and the closing-services site carries multiple agent quotes about transparency and responsiveness. Those are useful because they cover both consumer and professional participants, not only a logo wall. Still, the corpus is curated. It demonstrates that people and partners really use the platform for agent match, BBYS, and closing, but it does not show what share of users become repeat customers or how many downstream products are attached per household. In diligence terms, the public record supports production
    usage and channel relevance, not a fully underwritten durability story.'
  claimRefs:
  - CU005
  - CU006
  - CU016
  - CU017
  - CU018
  - CU019
