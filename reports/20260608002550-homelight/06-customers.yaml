tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Core job-to-be-done
  - Decision drivers
  - Public proof
  - Main gap
  rows:
  - - Seller seeking a full-service listing agent
    - Seller / seller / seller via agent commission
    - Compare local agents and get to market quickly
    - Speed, local expertise, low research effort
    - Free agent matching, fast recommendations, 30k+ network claims
    - No built-in fee discount and no active-conversion disclosure
  - - Buyer seeking local representation
    - Buyer / buyer / buyer or seller-funded commission
    - Find a buyer's agent and navigate offers, pricing, and timing
    - Fast shortlist, neighborhood fit, easier coordination
    - HomeLight buyer-match flow and editorial reviews of quick matching
    - No public close-rate by buyer cohort
  - - Buy-before-you-sell household
    - Homeowner / homeowner, agent, lender / homeowner plus loan economics
    - Unlock equity, make a non-contingent offer, move once
    - Certainty, timing flexibility, less stress
    - BBYS official pages, homeowner case studies, lender testimonials
    - No public cohort economics, fallout rate, or repeat-use data
  - - Simple Sale / investor-path seller
    - Seller / seller / seller via sale proceeds
    - Get a quick cash-offer option and compare certainty versus open market
    - Speed, no repairs, optionality
    - Simple Sale narratives in official reviews content and ConsumerAffairs summary
    - Adverse complaints allege bait-and-switch into agent outreach
  - - Partner agent teams
    - Agent / agent team / agent via referral fee
    - Acquire qualified leads and monetize adjacent services
    - Lead quality, conversion potential, no upfront lead spend
    - Referrals page, metrics help docs, pay-at-closing editorial ranking
    - 30% to 33% fee take and ranking pressure can squeeze economics
  - - Loan officers and closing participants
    - Loan officers, escrow teams / professionals and shared clients / professional commissions and transaction revenue
    - Use BBYS, Home Loans, and closing services to keep transactions moving
    - Faster close, better DTI flexibility, smoother handoffs
    - BBYS testimonials, Closing Services site, help-center modules
    - Attach rates and repeat partner usage are not publicly disclosed
  notes: Consumer and professional segments are mixed because HomeLight monetizes both sides of the residential transaction flow rather than only the homeowner relationship.
