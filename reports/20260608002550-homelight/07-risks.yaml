- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Buyer-side marketplace disruption
    - Post-settlement lead-to-tour and tour-to-close conversion
    - Material decline versus pre-Aug. 2024 baseline without offsetting lower CAC
    - Treat marketplace revenue durability as impaired and re-underwrite growth.
  - - Lead-gen compliance risk
    - TCPA, RESPA, or steering complaints and internal exceptions
    - Any regulator inquiry, consent-audit failure, or repeat vendor breach
    - Freeze expansion assumptions until routing, consent, and ranking controls are audited.
  - - Capital dependence
    - Debt-facility renewals, pricing, and concentration
    - Higher spreads, lower availability, or reliance on one capital partner for BBYS / closing scale
    - Apply tighter downside case and lower confidence in multi-product expansion.
  - - Automation quality risk
    - EVA manual-override rate, wiring defects, and loss events
    - Persistent rise in exceptions or any material funds-transfer incident
    - Cap closing-margin upside and treat EVA as an execution experiment, not a proven moat.
  - - Housing-cycle stress
    - DTI, fallout, attach, and transaction-volume sensitivity by rate band
    - Worsening DTI/fallout while rates stay high or affordability stalls
    - Assume weaker loan and BBYS attach plus higher support burden across the stack.
  notes: 'These are the cleanest public-to-private diligence bridges: each row names a measurable signal that can validate or break the convenience-plus-cross-sell thesis.'
