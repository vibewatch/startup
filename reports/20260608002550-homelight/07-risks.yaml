- id: trust-privacy-and-operational-execution-risk
  title: Trust, privacy, and operational execution risk
  body: HomeLight’s public adverse record centers on trust leakage and process complexity. The company’s privacy policy allows for broad collection, cross-source enrichment, targeted advertising, and sharing with affiliates, business partners, and service providers; its terms authorize multi-channel contact; and its referral updates show why TCPA process discipline matters operationally. Independent reviews line up with that risk. BBB pages captured both a real complaint base and a middling live review average, while multiple review roundups say users often complain about persistent calls, texts, emails, or the absence of commission savings. Those complaints are especially important because HomeLight no longer operates as a narrow matchmaker. It now spans agent matching, bridge-like equity unlock, mortgage licensing, in-house closing, and AI-enabled escrow operations. That breadth can be strategically attractive, but it also multiplies handoffs. The same organization now needs to govern
    marketing consent, partner routing, loan and escrow timing, complaint resolution, and AI-assisted money-movement workflows. The EVA launch sharpens the tradeoff. Automating a majority of closing work across 80-plus tools and 120-plus task types may lower cost and increase throughput, but it also creates new failure points around document ordering, title, HOA coordination, lender interfaces, and wires. In a company with a visible complaint record and a multi-state licensing footprint, a small number of repeatable execution errors could travel quickly from support queues into regulator-facing issues.
