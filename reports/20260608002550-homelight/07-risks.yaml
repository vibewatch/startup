  evidenceGaps:
  - type: missing-source
    severity: material
    topic: warehouse-lines-and-capital-partners
    missingEvidence: Current warehouse lines, debt covenants, SPV structures, lender concentration, and any concentration or renewal terms tied to BlackRock or other capital partners.
    whyItMatters: HomeLight bridge and closing products are capital- and timing-sensitive, so opaque financing terms limit confidence in downside durability.
    diligencePath: Request current facility agreements, debt maturity schedule, borrowing-base methodology, counterparty concentration, and any 2025-2026 covenant amendments.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: buy-before-you-sell-loss-rates
    missingEvidence: Approval funnel, pull-through, forced-purchase frequency, average holding period, realized loss rates, and equity-loss outcomes for Buy Before You Sell cohorts.
    whyItMatters: The public record shows product mechanics but not whether bridge and backup-offer economics remain attractive through weaker markets.
    diligencePath: Request monthly BBYS operating KPIs, cohort loss data, forced-purchase counts, and board materials on product profitability by vintage.
    relatedQuestionRefs:
    - QR029
  - type: missing-source
    severity: material
    topic: state-by-state-regulatory-and-complaint-data
    missingEvidence: State regulator exam outcomes, product-level complaint counts, arbitration volumes, cease-and-desist history, and any post-2024 buyer-agreement or TCPA complaint spikes.
    whyItMatters: The chapter can point to rule exposure and public complaints, but not to regulator-measured compliance quality or incident concentration by product and state.
    diligencePath: Request complaint logs by product and state, regulator correspondence, legal reserve memos, and quarterly compliance dashboards since January 2025.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: eva-control-metrics
    missingEvidence: EVA exception rates, fraud-loss events, wiring errors, manual-override rates, recovery-time metrics, and human-review requirements by workflow.
    whyItMatters: Automation can improve closing throughput, but investors need to know how often the system fails and what those failures cost when money movement and title tasks are involved.
    diligencePath: Request post-launch EVA incident logs, human override policies, SOC or internal control materials, and monthly defect or error dashboards.
    relatedQuestionRefs:
    - QR020
    - QR030
    relatedTableRefs:
    - TR002
