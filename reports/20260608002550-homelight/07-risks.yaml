company:
  name: HomeLight
chapter:
  number: 7
  title: Risks
  summary: HomeLight’s risk profile is dominated by rule change and execution coupling rather than a single isolated defect. The company sits in the blast radius of post-August 2024 buyer-agent reforms, tighter lead-generation and telemarketing standards, persistent affordability pressure, and a capital-sensitive Buy Before You Sell plus closing stack. The public record supports real product breadth, but also shows down-round financing, past layoffs, consumer-outreach complaints, and limited visibility into warehouse lines, BBYS losses, regulator exams, or EVA defect rates.
sections:
- id: market-structure-and-regulatory-risk
  title: Market-structure and regulatory risk
  body: 'HomeLight’s single biggest risk is that the rules around buyer acquisition, referral monetization, and lender lead flow are changing at the same time. The post-August 2024 NAR settlement removed MLS-displayed buyer-broker compensation and forced written buyer agreements before touring, which does not eliminate commissions but does make compensation more explicit and more negotiable. For a company whose marketplace pitch is speed and convenience rather than guaranteed fee savings, that matters: buyers now face more visible agency paperwork, while agents and consumers have more reason to compare low-cost alternatives. The risk is not limited to brokerage. HomeLight’s own terms and referral updates show how close the company sits to telemarketing, TCPA, and referral-fee compliance. The company discloses percentage-of-commission referral monetization, 30%-33% agent terms, transaction-level charging, dual-representation implications, and broad consent language for calls and texts. At
    the same time, CFPB and FTC guidance has become stricter about steering, kickbacks, and lead generators that present themselves as neutral while routing consumers based on compensation. The new trigger-lead regime raises the bar again for mortgage marketing. Put together, this means HomeLight is not just exposed to housing demand; it is exposed to a tightening compliance perimeter around how real-estate and mortgage demand is sourced, routed, disclosed, and monetized.'
