- id: competition-margin-and-underwriting-implications
  title: Competition, margin pressure, and underwriting implications
  body: 'From an investor perspective, the question is not whether HomeLight has real products; it clearly does. The question is whether a multi-product transaction stack can hold attractive unit economics when commissions are more contested, mortgage lead rules are tighter, and consumers are more sensitive to fees and outreach quality. The review corpus consistently says HomeLight is fast and convenient, but also that it rarely saves customers money. That leaves the company exposed if explicit buyer-agent compensation discussions, low-commission brokers, or neutral-ranking requirements reduce conversion or willingness to pay referral takes. The same dynamic applies to lending and closing. Better 2026 rate expectations help, but they do not remove affordability strain, DTI pressure, or lock-in. That means the underwriting should focus on measurable breakpoints, not narrative optionality. The most important kill criteria are straightforward: a material post-settlement drop in buyer-side conversion,
    evidence that trigger-lead or steering rules disrupt mortgage attach, worsening complaint or regulator trends, loss of capital flexibility for BBYS and closing, or EVA-related defect rates that raise support and loss costs faster than automation lowers them. If HomeLight cannot prove that compliance discipline and cross-product execution improve as the stack expands, the main risk is not one product failing in isolation. It is the entire convenience thesis turning into a margin-compressing support burden.'
