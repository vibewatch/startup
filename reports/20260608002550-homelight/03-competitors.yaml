- id: brokerage-mortgage-and-closing-stack-rivals
  title: Brokerages and workflow vendors raise the bar on full-stack transaction control
  body: 'A third competitor class attacks HomeLight from below and above the funnel at the same time. Compass shows what a scaled brokerage can do when it controls agents, listings, and attached services. Its seller workflow starts with private exclusives and coming-soon marketing, uses a 340,000-agent network for early discovery, and then expands publicly while keeping serious inquiries routed to the Compass agent. After the Anywhere combination, Compass is also large enough to disclose revenue, cash, agent count, title-and-escrow throughput, and product attach trends. Redfin’s combination with Rocket points in the same strategic direction: brokerage traffic paired directly with mortgage incentives. HomeLight has pieces of that stack, but the incumbents are making the bundle more explicit.


    Meanwhile, a separate group of vendors competes for the closing and lender workflow even when they do not compete for the consumer at all. Blend sells faster digital closings to lenders, Qualia sells a shared closing infrastructure to title and escrow professionals, and Snapdocs markets sub-15-minute borrower closings plus secondary-market-ready eNotes. These companies do not need to win the initial home-search click in order to displace parts of HomeLight’s later-stage story. Their value proposition is operational efficiency, integration, and partner adoption. That means HomeLight’s later-stage products face not only portal and brokerage competitors, but also specialist infrastructure vendors whose economics are anchored in B2B workflow budgets instead of agent referral fees.'
