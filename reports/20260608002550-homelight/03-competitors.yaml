- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - threat
  - severity
  - mitigation / diligence ask
  rows:
  - - Breadth from agent match into finance and closing
    - Portals and integrated brokerages can own the consumer while copying later-stage workflow pieces
    - High
    - Measure attach rates from match to mortgage, BBYS, and closing against Zillow, Redfin/Rocket, and Compass equivalents
  - - HomeLight can stay asset-light versus iBuyers
    - Public iBuyers can still pressure seller expectations on speed and certainty when they improve inventory turns
    - Medium-High
    - Request current win/loss reasons against Opendoor and Offerpad by market and seller cohort
  - - Referral network can scale without large fixed cost
    - Agents can multi-home across Zillow, ReadyConnect, and other referral networks with low switching cost
    - High
    - Quantify repeat-agent retention, share of wallet, and close-rate uplift by channel
  - - Lender and title partnerships expand distribution
    - Specialist workflow vendors can sell directly to lenders and title teams without depending on HomeLight for consumer acquisition
    - Medium-High
    - Provide partner NPS, implementation time, and workflow ROI versus Blend, Qualia, and Snapdocs
  - - Private competitors are less durable than public incumbents
    - Orchard and Flyhomes still show enough funding and partner momentum to stay credible in the category
    - Medium
    - Gather current warehouse-line terms, growth rates, and loss curves for private certainty providers
  - - Consumer convenience can offset lack of price leadership
    - Low-fee matchmakers like Clever and integrated savings plays like Redfin make price transparency a persistent switching trigger
    - High
    - Test conversion by fee-sensitive cohort and disclose whether HomeLight can match or beat low-fee alternatives in practice
  notes: Severity reflects likely impact on HomeLight’s ability to defend share over the next 12-24 months, not a legal or solvency judgment.
