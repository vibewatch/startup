- id: certainty-products-and-balance-sheet-rivals
  title: Cash-offer, bridge, and power-buyer rivals compete on certainty, capital, and partner reach
  body: 'HomeLight’s second battlefield is transaction certainty: getting a homeowner into the next purchase before the old home sells, or giving sellers an all-cash alternative when speed matters more than price discovery. Here the right comparison set is Orchard, Flyhomes, Opendoor, and Offerpad. Orchard’s Move First pitch is operationally close to HomeLight Buy Before You Sell: unlock equity, make a non-contingent offer, and let a dedicated agent handle the old-home prep and sale. But Orchard’s latest funding release shows a more explicit marketplace repositioning, arguing that it has become a broader open real-estate platform rather than just a lending product. Flyhomes is different again. Its homepage now centers partner distribution through 30,000-plus loan officers and case-study style financing outcomes, while HousingWire says the company added fresh equity and a new warehouse line.


    Those facts make the power-buyer category look less like a lead-generation contest and more like a capital-and-distribution contest. That also explains why the adverse evidence matters. GeekWire’s report that Flyhomes exited brokerage to focus on financing products shows how hard it is to defend a broad consumer-facing model in this segment. Public iBuyers underline the same lesson from the balance-sheet side. Opendoor is improving cohorts and inventory health, but it still reported a large net loss in Q1 2026. Offerpad likewise frames itself as a multi-path seller platform, yet its value proposition still depends on being able to fund cash offers, run a marketplace, and keep seller economics attractive. HomeLight participates in this category, but it does not appear to dominate it on either capital scale or owned consumer demand.'
