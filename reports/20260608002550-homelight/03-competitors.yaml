company:
  name: HomeLight
chapter:
  number: 3
  title: Competitors
  summary: 'HomeLight competes across several transaction layers at once: referral marketplaces, discount brokerages, bridge and cash-offer products, and lender or closing workflows. The evidence suggests HomeLight is broader than pure matchmakers like Clever or UpNest, but weaker than Zillow, Redfin/Rocket, Compass, and Realtor.com on channel control and public financial durability, while Orchard, Flyhomes, Opendoor, Offerpad, Blend, Qualia, and Snapdocs pressure its certainty and workflow adjacencies from narrower but still credible positions.'
sections:
- id: portal-referral-and-price-disruption
  title: Portals, referral networks, and discount matchmakers set the switching baseline
  body: 'HomeLight no longer looks like a simple referral site, but the core direct battlefield is still top-of-funnel agent selection. HomeLight’s own surfaces show a broader stack that can start with agent matching and extend into lenders, home search, cash-investor selling options, and closing guidance. The problem is that the strongest rivals in this layer own either the traffic, the consumer savings story, or both. Zillow is still the clearest traffic heavyweight: it sells Premier Agent connections every four seconds, openly prices connections by metro, and backs the channel with 220 million average monthly unique users and a large surrounding product stack. Redfin attacks from a different angle, promising sellers “half the fee” and claiming brokerage-web traffic that is far ahead of the next closest rival, while Realtor.com combines ReadyConnect’s screened referral network with UpNest’s open proposal marketplace.


    The most uncomfortable comparison for HomeLight is not only the portals, but the low-fee matchmakers. Clever explicitly leads with a 1.5% listing fee, and independent review evidence says HomeLight still usually leaves the consumer paying standard commission. That matters because referral networks are easy to multi-home. Agents can buy Zillow leads, accept Flex-style pay-at-close referrals, stay active in Realtor.com’s concierge network, and still use HomeLight. In that environment, HomeLight’s agent-matching wedge is useful, but it is not naturally locked in. The buyer or seller can switch based on price transparency, brand familiarity, or the speed of agent comparison rather than on any deep product dependency.'
