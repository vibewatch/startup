  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: homelight-fee-disclosure
    missingEvidence: A current official HomeLight pricing page that explicitly discloses referral-fee economics and Buy Before You Sell pricing terms.
    whyItMatters: Without a first-party fee schedule, the chapter must rely on independent review evidence for HomeLight’s own pricing claims, which weakens exact apples-to-apples pricing comparisons.
    diligencePath: Request current partner agreement templates, consumer pricing schedules, and any 2026 HomeLight fee FAQs from management or the sales team.
    relatedQuestionRefs:
    - QP026
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: homelight-attach-rates
    missingEvidence: Current attach rates from HomeLight’s agent-matching funnel into Buy Before You Sell, Home Loans, and closing products, broken out by market and partner type.
    whyItMatters: The real moat question is whether HomeLight converts early-intent users into later-stage monetizable workflows better than portals, brokerages, and specialty lenders.
    diligencePath: Ask for cohort conversion funnels, attach rates by product, contribution margin by product, and partner-retention data for 2025-2026 cohorts.
    relatedQuestionRefs:
    - QP027
  - type: private-evidence-only
    severity: minor
    topic: private-bbys-loss-rates
    missingEvidence: Current loss rates, take rates, and unit economics for private move-first providers such as Orchard and Flyhomes.
    whyItMatters: Public funding announcements show durability direction, but not whether private certainty products are economically stronger than HomeLight’s equivalent offers.
    diligencePath: Request warehouse-line terms, loss curves, and attach economics from management or lenders that distribute these products.
