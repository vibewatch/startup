- id: TP003
  title: Pricing / packaging comparison
  columns:
  - company
  - public pricing / commission model
  - included capabilities
  - discounts / unknowns
  - implication
  rows:
  - - HomeLight
    - Official pages emphasize free matching; independent review says typical listing commission remains ~2.5%-3% and referral fee to HomeLight is 33%
    - Agent match, lenders, search, cash-investor option, BBYS, closing guidance
    - Current first-party fee schedule is not clearly disclosed on retained official pages
    - HomeLight competes more on convenience and product span than on explicit savings
  - - Zillow Premier Agent
    - Average cost per connection $223 in major metros and $139 in non-major metros; optional 6-month contracts
    - Lead generation, live calls, tours, analytics, ROI reporting
    - Total spend varies by market and package
    - Agent economics are explicit and performance-marketing-like rather than commission-discounted
  - - Redfin
    - Half the fee other brokerages often charge
    - Brokerage service, online workflow, Rocket mortgage linkage
    - Exact fee varies by market and bundle
    - Savings is part of the consumer message, which pressures neutral-priced matchmakers
  - - Clever
    - 1.5% listing fee; free to use
    - Matched full-service agents and savings-centric consumer pitch
    - Minimum fee and buyer cash-back vary by market
    - Strongest pure price challenger in the matching category
  - - Realtor.com / UpNest
    - Proposal marketplace and concierge referrals; fee schedule not emphasized on retained pages
    - 3-5 proposals within 12 hours or screened agent introduction
    - Consumer-facing referral economics not clearly disclosed in retained official material
    - Open choice can appeal to sellers who want comparison rather than a closed system
  - - Orchard
    - No simple headline fee on retained Move First page
    - Equity unlock, non-contingent offer, agent-led sale process
    - Exact take rate and financing economics remain private
    - Packaging is convenience-led and capital-backed rather than low-fee
  - - Flyhomes
    - No simple headline fee on retained page; promotes 5% down and no early-payoff penalties
    - Bridge financing, partner distribution, move-once path, cash-offer support
    - Program economics depend on financing qualification and partner structure
    - Competes through financing flexibility and partner incentives
  - - Opendoor / Offerpad
    - Cash-offer convenience; Offerpad also highlights transparent service fees and hybrid path
    - Direct sale, listing alternative, marketplace paths, local move perk at Offerpad
    - Final economics vary by home, repairs, and market conditions
    - Seller certainty remains valuable, but economics are less transparent than discount-brokerage rates
  notes: Public pricing is easiest to compare in referral and discount-brokerage products; certainty and workflow players disclose packaging more often than exact take rates.
