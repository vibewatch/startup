evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board roster, committee structure, and any board-observer map for major investors.
    whyItMatters: >-
      Governance visibility is too weak to assess succession resilience, investor control, or oversight quality from
      public materials alone.
    diligencePath: Request the latest board deck, org chart, and corporate governance summary from management.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: capital-total
    missingEvidence: >-
      A reconciled cap table and debt schedule that explains how equity, debt, and extensions roll into one cumulative
      capital number.
    whyItMatters: >-
      Public totals range from $645 million to $762.5 million, which affects ownership, leverage, and valuation
      analysis.
    diligencePath: Request a financing ledger by round, security type, investor, and outstanding principal as of run date.
    relatedQuestionRefs:
      - QO016
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Current revenue, run-rate, margin, and product-level monetization data for referrals, lending, and closing.
    whyItMatters: Stage, quality of growth, and valuation defensibility cannot be judged cleanly without current financial output.
    diligencePath: Request audited or board-level revenue and gross-margin reporting for 2024-2026 plus product mix.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: A current employee count with functional and geographic splits.
    whyItMatters: >-
      Operating leverage, restructuring history, and execution capacity remain hard to evaluate without current
      workforce data.
    diligencePath: Request HRIS headcount by function and office plus net hires since the 2022 layoff.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-map
    missingEvidence: >-
      Current ownership percentages, board rights, debt covenants, and partner concentration data for named
      stakeholders.
    whyItMatters: >-
      The stakeholder map is directionally useful but may understate who actually controls economics or go-to-market
      leverage.
    diligencePath: Request the current cap table, major commercial agreements, and debt term sheet summary.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO003
  - type: access-blocked
    severity: minor
    topic: complaints
    missingEvidence: >-
      An accessible independent complaint corpus beyond BBB, including the currently blocked ConsumerAffairs page and
      any regulator complaint logs.
    whyItMatters: Adverse customer evidence may be understated if one of the visible complaint surfaces cannot be reviewed fully.
    diligencePath: >-
      Review complaint portals manually in-browser and supplement with state regulator or CFPB complaint databases where
      applicable.
    relatedQuestionRefs:
      - QO023
  - type: missing-source
    severity: material
    topic: bridge-loan-volume
    missingEvidence: >-
      National 2025-2026 bridge-loan origination counts or funded dollar volume broken out by purchase-before-sale use
      case.
    whyItMatters: >-
      ICE’s second-lien data proves homeowner demand for equity access, but it does not reveal how large the true
      bridge-financing market is for HomeLight-like products.
    diligencePath: >-
      Request HomeLight and lender-partner bridge funding vintages, warehouse-line disclosures, or warehouse lender
      commentary that isolates bridge production.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: closing-workflow-software-spend
    missingEvidence: >-
      A public breakout of title and escrow software spend separate from title premiums, settlement fees, and carrier
      economics.
    whyItMatters: >-
      ALTA proves the closing economy is large, but HomeLight’s real software and workflow SAM cannot be underwritten
      from premium pools alone.
    diligencePath: >-
      Request title-partner software budgets, per-file workflow spend, and EVA-style implementation metrics from
      management and channel partners.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: referral-take-rates
    missingEvidence: >-
      Lead-to-close conversion, referral fee schedules, attach by market, and repeat-transactor mix for agent-matching
      channels.
    whyItMatters: >-
      The broad commission pool materially overstates monetizable revenue if consumer intent is weak or referral terms
      are thinner than public marketplace heuristics.
    diligencePath: >-
      Request cohort funnel data from lead through tour, agreement, preapproval, offer, and closed transaction by metro
      and customer source.
    relatedQuestionRefs:
      - QM017
      - QM021
  - type: stale
    severity: minor
    topic: buyer-direct-pay-incidence
    missingEvidence: >-
      A longer multi-quarter dataset showing how often buyers directly pay commissions versus receiving seller
      concessions after the settlement.
    whyItMatters: >-
      Early post-settlement evidence shows sticky commissions, but market behavior could still shift as more
      transactions cycle through the new rules.
    diligencePath: >-
      Refresh Redfin and NAR commission evidence after another full spring selling season and compare by price tier and
      metro.
    relatedQuestionRefs:
      - QM012
      - QM013
  - type: private-evidence-only
    severity: material
    topic: homelight-fee-disclosure
    missingEvidence: >-
      A current official HomeLight pricing page that explicitly discloses referral-fee economics and Buy Before You Sell
      pricing terms.
    whyItMatters: >-
      Without a first-party fee schedule, the chapter must rely on independent review evidence for HomeLight’s own
      pricing claims, which weakens exact apples-to-apples pricing comparisons.
    diligencePath: >-
      Request current partner agreement templates, consumer pricing schedules, and any 2026 HomeLight fee FAQs from
      management or the sales team.
    relatedQuestionRefs:
      - QP026
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: homelight-attach-rates
    missingEvidence: >-
      Current attach rates from HomeLight’s agent-matching funnel into Buy Before You Sell, Home Loans, and closing
      products, broken out by market and partner type.
    whyItMatters: >-
      The real moat question is whether HomeLight converts early-intent users into later-stage monetizable workflows
      better than portals, brokerages, and specialty lenders.
    diligencePath: >-
      Ask for cohort conversion funnels, attach rates by product, contribution margin by product, and partner-retention
      data for 2025-2026 cohorts.
    relatedQuestionRefs:
      - QP027
  - type: private-evidence-only
    severity: minor
    topic: private-bbys-loss-rates
    missingEvidence: Current loss rates, take rates, and unit economics for private move-first providers such as Orchard and Flyhomes.
    whyItMatters: >-
      Public funding announcements show durability direction, but not whether private certainty products are
      economically stronger than HomeLight’s equivalent offers.
    diligencePath: >-
      Request warehouse-line terms, loss curves, and attach economics from management or lenders that distribute these
      products.
  - type: private-evidence-only
    severity: blocking
    topic: business-line-revenue-mix
    missingEvidence: >-
      HomeLight does not disclose current revenue by line across referrals, Buy Before You Sell, Home Loans, Simple
      Sale, or EVA/closing. The reviewed public corpus provides traction metrics and pricing signals, but not
      business-line mix, close rates, or revenue recognition by product.
    whyItMatters: >-
      Without line-level revenue mix, it is impossible to judge whether HomeLight is still mainly a referral
      marketplace, already predominantly a bridge-and-closing platform, or cross-subsidizing newer products with legacy
      referral economics.
    diligencePath: >-
      Request trailing-twelve-month revenue by business line, contribution margin by line, and take-rate or attach-rate
      waterfalls from referral lead through funded or closed transaction.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-and-covenants
    missingEvidence: >-
      HomeLight does not publicly disclose cash on hand, monthly burn, runway, debt covenants, warehouse-line
      availability, or current lender-facility terms.
    whyItMatters: >-
      The company has layered debt onto equity in 2021, 2022, and 2026, so capital adequacy cannot be underwritten
      without knowing available liquidity, covenant headroom, and whether bridge or closing products depend on
      additional off-balance-sheet funding capacity.
    diligencePath: >-
      Request current cash, trailing-twelve-month burn, monthly cash bridge, all debt agreements, covenant package,
      warehouse/repurchase capacity, and management runway plan under base and stressed transaction-volume cases.
    relatedQuestionRefs:
      - QI013
    relatedTableRefs:
      - TI004
