      - number: '5.3'
        title: 信任、合规与运营瓶颈
        blocks:
          - type: paragraph
            body: >-
              信任和合规直接嵌在 HomeLight 的产品工作流里。在获客侧，转介协议已为 TCPA 合规和交易级费用逻辑更新，意味着线索引擎本身受通信和佣金规则约束。在融资侧，州牌照和 NMLS 披露显示
              HomeLight Home Loans 不只是软性转介概念，而是落在受监管按揭边界内。隐私政策又加一层：HomeLight
              处理移动应用和网页数据，使用第三方支付处理，并收集产权或交割工作流可能需要的结算相关信息。


              贷款和交割周围的监管叠加很重。CFPB 和 FDIC 材料指向 TRID、Closing Disclosure 时点、ATR/QM、RESPA、SAFE
              Act、服务、洪水和托管要求，这些都是核心按揭控制面；OCC 2026 年托管规则则强调托管管理中有多少运营判断。这意味着 HomeLight
              的执行风险不只是软件正常运行时间，还包括承保、披露、资金流动和文件处理能否保持在监管容忍范围内。


              因此，瓶颈出现在公开证据最具体的地方：承保中的估值和文件收集、供给网络里经纪人的响应速度和阶段纪律，以及跨贷款机构、HOA、政府办公室和托管专员的交割协调。HomeLight
              可以简化消费者叙事，但无法消除先买后卖融资交易背后的运营卡点。
