  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: HomeLight 最高的残余敞口，落在规则变化、触达合规和资本敏感型产品重叠的地方。
    data:
      columns:
        - 发生可能性
        - 影响
        - 缓释成熟度
        - 残余严重度
      rows:
        - label: 市场结构 / 佣金变化
          values:
            - label: 高
              tone: negative
              detail: 和解后，买方行为已经出现结构性变化。
            - label: 高
              tone: negative
              detail: 线索转化率和抽成率假设都可能波动。
            - label: 中
              tone: warning
              detail: 教育引导有帮助，但恢复不了旧有 MLS 经济模型。
            - label: 高
              tone: negative
              detail: HomeLight 卖的是便利，不是省佣金，残余风险因此仍高。
        - label: 线索获客 / 隐私合规
          values:
            - label: 中高
              tone: warning
              detail: 导流、触发式线索和电话营销规则都收紧了。
            - label: 高
              tone: negative
              detail: 监管审查可能同时冲击经济性和品牌信任。
            - label: 中
              tone: warning
              detail: 条款和政策有了，但执行证据偏薄。
            - label: 中高
              tone: warning
              detail: 投诉分布说明风险不是假设。
        - label: 资本 / 房地产周期压力
          values:
            - label: 中高
              tone: warning
              detail: 利率环境可能改善，但住房负担能力和 DTI 仍承压。
            - label: 高
              tone: negative
              detail: BBYS 和贷款附加率直接受交易量和资本影响。
            - label: 中低
              tone: warning
              detail: 近期融资有帮助，但授信安排细节仍不透明。
            - label: 高
              tone: negative
              detail: 市场走弱可能同时挤压多个产品。
        - label: 交割 / 自动化执行
          values:
            - label: 中
              tone: warning
              detail: 流程牵涉大量合作方、任务和交接。
            - label: 高
              tone: negative
              detail: 一旦出错，可能波及资金、产权或客户信任。
            - label: 中低
              tone: warning
              detail: EVA 还新，公开控制数据缺失。
            - label: 中高
              tone: warning
              detail: 缺陷数据可见之前，残余敞口仍偏高。
    approximationNotes: null
    claimRefs:
