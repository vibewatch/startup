  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资信号
      - 目标细分市场
      - 差异化
      - 相比 HomeLight 的局限
    rows:
      - - HomeLight
        - 基准
        - 私有公司；覆盖较宽交易工作流，但公开财务披露有限
        - 选择经纪人的消费者，以及后段融资和交割伙伴
        - 覆盖经纪人匹配、贷款、现金报价路径和交割支持
        - 不掌握门户级流量，公开挂接率披露也很薄
      - - Zillow
        - 门户 / 转介市场平台
        - Q1 2026 收入 $708M；月独立用户 220M
        - 全国搜索规模下的经纪人和买方
        - 掌握漏斗顶部流量，并直接向经纪人变现
        - 消费者省钱不是核心卖点，经纪人经济性取决于付费线索支出
      - - Redfin / Rocket
        - 折扣经纪 + 按揭
        - Redfin 流量叠加 Rocket 按揭集成和价格激励
        - 想要低费率、线上优先全服务路径的买卖双方
        - 省钱信息叠加经纪和按揭集成
        - 模式更封闭；相比 HomeLight 或 UpNest，开放市场平台属性更弱
      - - Compass
        - 全服务传统经纪公司
        - Q1 2026 收入 $2.70B；84,187 名经纪人；现金 $484M
        - 品牌经纪平台内需要更高触达的卖方和经纪人
        - 控制经纪人网络、预营销、产权和托管挂接，以及卖方工作流
        - 相比 Redfin 或 Clever，消费者折扣属性不明显
      - - Realtor.com 生态
        - 门户 + 转介市场平台
        - Move 在 2026 财年 Q2 收入 $143M；UpNest 加 ReadyConnect
        - 使用开放报价或筛选转介的卖家和经纪人
        - 结合受众、礼宾式转介和卖方市场平台工具
        - 自身不拥有封闭经纪公司或按揭产品栈
      - - Clever
        - 低佣金经纪人匹配
        - 全国折扣经纪市场平台，主打 1.5% 挂牌费
        - 价格敏感但仍想要全服务经纪人的卖方
        - 直接把消费者省钱说清楚，而不只是匹配经纪人
        - 经纪人引荐之外产品宽度较窄
      - - Orchard
        - 过桥 / 强买方市场平台
        - 2025 年收入增长 40%，2026 年融资 $30M
        - 需要释放权益并获得转售引导的换房卖方
        - Move First 叠加开放市场平台定位
        - 私有经济性和损失率仍未披露
      - - Flyhomes
        - 合作伙伴分发的强买方服务
        - 30,000+ 名信贷员；$15M D 轮；$200M 仓储授信
        - 由信贷员和经纪人主导的先买后卖使用场景
        - 大型合作伙伴渠道和融资专业化
        - 退出经纪业务后，消费者关系变窄
      - - Opendoor / Offerpad
        - iBuyer / 卖方确定性
        - 公开上市的资产负债表运营商，提供现金报价和市场平台路径
        - 优先考虑速度、确定性或直接出售的卖方
        - 确定性价值主张强，现金报价品牌也有辨识度
        - 资产负债表和库存风险仍是核心
      - - Blend / Qualia / Snapdocs
        - 数字按揭和交割工作流
        - 在放款机构 / 产权工作流中覆盖面大；有公开效率主张
        - 放款机构、产权机构和结算运营方
        - 直接争夺运营工作流预算
        - 不掌握开启购房旅程的消费者意图时刻
    notes: 各行刻意混合直接转介对手、确定性产品和工作流相邻公司，因为 HomeLight 横跨多个交易层竞争，而不是只处在单一软件细分赛道。
