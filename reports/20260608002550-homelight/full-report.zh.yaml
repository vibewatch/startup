  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值可信度和融资背景
        blocks:
          - type: paragraph
            body: >-
              HomeLight 的估值故事最容易理解为一串越来越混杂的信号，而不是一个干净标记。2021 年，公司还可以合理支撑一个溢价私募估值叙事：它筹集了 $363M 新资本，其中包括 $100M Series D
              股权和超过 $263M 债务；TechCrunch 报道称，当年收入预计超过 $300M。2022 年，公司又以 $60M 股权和 $55M 债务延展该轮，收购 Accept.inc，并把估值小幅推到
              $1.7B。如果随后在 2024 或 2025 年又有一轮新的上轮融资，投资者仍可把 $1.7B 视为锚点。但公开记录不是这样。下一条股权信号是 2024 年 8 月 $20M Series D-2；Prime
              Unicorn 明确称其为降价轮，投后估值约 $1.06B，而 Business Wire 联合发布稿和 O’Melveny 将这笔融资描述为对 Buy Before You Sell
              扩张的定向支持，而非公司整体重估。2026 年融资信号也不是股权。EVA 伴随的是 BlackRock 管理的 $40M 债务；这很重要，因为它支持规模扩张，但不会重置股价。换句话说：上一个 $1.7B
              标记是真实历史，但已经陈旧。更新的公开证据指向的是一家公司仍在拓宽产品栈，同时依赖外部资本，并在更艰难的住房行情中接受更低的股权参考点。
