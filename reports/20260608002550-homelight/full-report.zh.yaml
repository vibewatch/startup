  - id: FM001
    title: 经纪人匹配市场规模视角
    type: pyramid
    layout: standard
    summary: 从转售到推荐的分层视角显示，HomeLight 的经纪人匹配切口远小于住房总支出，但按美元计仍然很大。
    data:
      nodes:
        - id: n1
          label: 美国存量房交易外壳
          description: 2026 年 4 月转售节奏和中位价意味着年化转售价值约 $1679.2B。
        - id: n2
          label: 买方经纪人介导的转售需求
          description: 套用 NAR 88% 的买方经纪人使用率，约 $1477.7B 交易价值会流经经纪人建议的交易。
        - id: n3
          label: 估计买方佣金池
          description: Redfin 2.40% 的平均买方经纪人佣金意味着，在该介导外壳上买方佣金约 $35.5B。
