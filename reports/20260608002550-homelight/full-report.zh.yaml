  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 收入指标
      - 估值 / 市值
      - 隐含倍数或状态
      - 与 HomeLight 的相关性
      - 主要限制
    rows:
      - - Compass
        - TTM 收入约 $8.31B
        - 市值约 $5.76B
        - ~0.7x 销售额
        - 科技赋能经纪 / 推荐基准
        - 经纪业务组合利润率薄，贷款敞口也轻于 HomeLight 当前业务栈。
      - - Zillow
        - 2026 Q1 收入 $708M；年化约 $2.8B
        - 市值约 $8.02B
        - ~2.8x-3.0x 销售额
        - 轻资产市场 + 按揭附加业务基准
        - 品牌、受众规模和消费者流量远强于 HomeLight。
      - - Redfin
        - 仅有最后已知公开市值快照
        - 最后已知市值约 $1.43B（2025 年 9 月）
        - 最后已知公开标记；此处未刷新倍数
        - 面向消费者住房平台的经纪 / 搜索基准
        - 这是收购前的过时参考，不是 2026 年中仍在交易的倍数。
      - - Opendoor
        - TTM 收入约 $3.94B
        - 市值约 $4.26B
        - ~1.1x 销售额
        - 资本密集型确定性 / 交易基准
        - 库存和资产负债表敞口远高于 HomeLight。
      - - Offerpad
        - 2026 Q1 收入 $80.1M；年化约 $320M
        - 市值约 $29.2M
        - ~0.1x 年化销售额
        - 交易重型模式的下行压力案例
        - 困境股权可能低估更健康企业的价值。
      - - Rocket
        - 2026 Q1 调整后收入 $2.82B；年化约 $11.3B
        - 市值约 $35.79B
        - ~3.0x 年化销售额
        - 规模化按揭 / 线索生成 / 服务基准
        - 公开市场规模、流动性和盈利能力都显著优于 HomeLight 的披露集。
      - - Blend
        - 2026 Q1 收入 $30.8M；年化约 $123M
        - 市值约 $0.39B
        - ~3.1x 年化销售额
        - 按揭基础设施的工作流软件基准
        - 比 HomeLight 更接近纯软件，直接过桥风险敞口也更低。
    notes: 公开可比公司倍数使用抓取的市值页面，加上申报文件或分析师市场数据快照中的过去十二个月或年化收入。
    enumerationScope:
