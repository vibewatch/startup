      - number: '2.2'
        title: 住房周转、可负担性与买卖方痛点
        blocks:
          - type: paragraph
            body: >-
              2026 年住房背景边际改善，但仍紧到足以压制交易量。NAR 2026 年 4 月报告显示，成屋销售经季调年化为 4.02 million 套，市场上有 1.47 million 套房源，供应为 4.4
              个月。Realtor.com 全年展望只小幅好到 4.13 million 套；而 NAR 在 2025 年底早些时候的评论曾暗示反弹更强。实际结论是，相比历史常态，HomeLight
              仍处在低周转市场，即便库存恢复已经足以让议价权一定程度转向买方。


              可负担性改善了，但主要是从非常紧张的水平改善。NAR 称 2026 年 4 月住房可负担性指数从一年前的 101.4 升至 110.6；Realtor.com 预计 2026 年典型按揭还款将降至收入中位数的
              30% 以下。但按揭利率仍锚在低 6% 区间，Redfin 基于 FHFA 的锁定效应分析显示，85.7% 有按揭的业主利率仍低于 6%。这让许多业主从经济上不愿卖出再买，直接限制了 HomeLight
              潜在交易供给。


              消费者痛点也按资产负债表分化。NAR 2026 年买方和卖方研究显示，首次购房者只占购房者的 21%，而婴儿潮一代占买方 42%、卖方
              55%。年轻家庭继续提到可负担性、租金和学生贷款负担；净值充足的现有业主仍是最有能力搬家的群体。这个信号对 HomeLight
              很强：卖方确定性工具、过桥融资、首付或预批准支持不是可有可无的相邻业务，而是对住宅周转核心摩擦的回应。
