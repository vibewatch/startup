      - number: '7.4'
        title: 竞争、利润率压力和承保含义
        blocks:
          - type: paragraph
            body: >-
              从投资者角度看，问题不是 HomeLight 有没有真实产品；它显然有。问题是，当佣金更受争议、抵押贷款线索规则更紧、消费者对费用和触达质量更敏感时，一个多产品交易栈能否守住有吸引力的单位经济性。评测语料一致认为
              HomeLight 快、方便，但也很少为客户省钱。如果显性买方经纪人报酬讨论、低佣金经纪商或中立排序要求削弱转化，或削弱客户支付推荐抽成的意愿，公司就会暴露。同样的动态也适用于贷款和成交。2026
              年更好的利率预期有帮助，但不会消除可负担性压力、DTI
              压力或锁定效应。因此，承保应聚焦可衡量的断点，而不是叙事上的可选性。最重要的否决条件很直接：和解后买方转化出现实质下滑；有证据显示触发线索或引导规则扰乱抵押贷款挂载；投诉或监管趋势恶化；BBYS
              和成交的资本灵活性丧失；或 EVA 缺陷率让支持和损失成本上升，速度快过自动化降本。如果 HomeLight
              不能证明合规纪律和跨产品执行会随着栈扩张而改善，主要风险就不是某个产品孤立失败，而是整个便利性逻辑变成压缩利润率的支持负担。
