      - number: '4.3'
        title: 资本结构、债务依赖与住房周期暴露
        blocks:
          - type: paragraph
            body: >-
              第 1 章的融资时间线在财务章节更重要，因为它揭示 HomeLight 多频繁地需要股权和债务一起支撑扩张。2021 年，公司以 $1.6 billion 估值融资 $100 million 股权和 $263
              million 债务。2022 年，它又以 $1.7 billion 估值新增 $60 million 股权和 $55 million 债务，管理层明确表示这笔融资是为了在不确定性中一边进攻一边防守。2024
              年，HomeLight 增加 $20 million 股权以扩张 Buy Before You Sell；2026 年，它又从 BlackRock 管理基金获得 $40 million 债务，用于扩展
              EVA。这个模式不是一次性过桥，而是反复证明 HomeLight 的产品集比简单软件或转介网络营运资本画像更依赖外部资本。


              反向证据强化了这一点。TechCrunch 报道称，管理层在 2022 年密切关注烧钱、放慢招聘，并优先考虑盈利能力和现金跑道。融资后数日内，RealTrends 和 The Real Deal
              报道了裁员，说明新资本没有消除成本控制需求。Prime Unicorn 随后估算 2024 延伸轮是下调估值融资，投后约 $1.06 billion，比此前 D 和 D-1 定价低约
              38.7%。这些来源单独看都不能证明 2026 年陷入困境，但合在一起说明，HomeLight 在交易市场疲弱时已经不得不调成本，并接受不那么好看的资本信号。

              宏观背景对一家绑定按揭敏感型家庭搬迁的公司仍不宽容。HomeLight 自己的 2025 年 Q3 贷款机构调查称，80% 的贷款机构看到消费者 DTI 上升，81%
              看到更多以房屋净值借款。HousingWire 2026 年关于公司 Q2 贷款机构调查的报道又称，33% 的借款人询问首付援助，45% 询问零首付项目，42%
              的贷款机构预计止赎增加。这些条件正是过桥贷款、贷款机构附加和交割产品具备战略意义的原因——但它们也可能增加信用压力、降低交易确定性并推高融资成本。没有公开现金、契约或仓储额度披露，HomeLight
              真实资本充足性仍是尽调问题，而不是公开事实。
