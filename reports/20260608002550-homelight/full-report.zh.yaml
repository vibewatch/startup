      - number: '2.4'
        title: TAM 框架、相邻市场与采用约束
        blocks:
          - type: paragraph
            body: >-
              衡量 HomeLight 市场规模，最干净的方法不是抛出一个总 TAM，而是用分层交易口径。仅 2026 年 4 月转售活动，就意味着约 $1679.2 billion 的年化成屋交易额：NAR 4.02
              million 套销售节奏乘以 $417,700 中位价。用 NAR 88% 的买方经纪人使用率作为需求侧代理，可得到约 $1477.7 billion 的经纪人介导交易额；再套用 Redfin 2.40%
              的平均买方经纪人佣金，这个壳对应估计 $35.5 billion 的买方佣金池。如果转介平台捕获其中约 20% 到 35% 的佣金，可变现转介费外壳约为 $7.1 billion 到 $12.4
              billion，还未扣除合作伙伴组合、成交率流失和复购行为。


              相邻市场也足够大，即便公开数据不完美。MBA 预测 2026 年购房贷款发放额为 $1.46 trillion，Fannie Mae 预计单户总发放额为 $2.32 trillion，且再融资占比上升。ICE
              又补充了一个重要的流动性代理：2025 年 Q3 二顺位房屋净值提取约 $33 billion，占全部净值提取的 59%，显示业主在不放弃低一顺位利率的情况下获取住房财富的需求很强。这不等于过桥贷款
              TAM，但有力证明净值获取产品处在一个有意义的相邻流量里。


              交割经济也很大，但映射到软件支出没那么干净。ALTA 显示 2025 年产权保险保费为 $18.5 billion，仅 2025 年 Q1 就有 $3.9 billion；CFPB 的 Closing
              Disclosure 规则让文件准确性和时点成为每笔放款购房的核心。含义是，HomeLight 可以指向转介、按揭和产权周边的大外部池子，但真正的 SAM
              仍取决于更窄的私有指标：经纪人成交率、过桥转化、贷款机构附加和交割自动化吞吐量。公开数据证明市场存在；单靠它们不能证明 HomeLight 能拿到多少份额。
