            body: >-
              公开客户证据是真实的，但最强的部分是已完成交易，而不是长期关系。HomeLight 官方材料称，公司已经帮助接近或超过 200 万名买卖双方，并与约 30,000 名经纪人合作。更有价值的证据更具体：房主
              BBYS 故事称产品降低了压力、带来更好的出售结果；贷款方证言描述了具体释放的房屋净值金额、无附带条件报价和 16
              天成交；成交服务网站也有多条经纪人关于透明度和响应速度的引述。这些证据有用，因为它们同时覆盖消费者和专业参与者，而不只是一个标识墙。不过，语料仍经过筛选。它证明人和合作伙伴确实用这个平台做经纪人匹配、BBYS
              和成交，但没有显示多少用户会成为复购客户，也没有显示每个家庭会挂载多少下游产品。按尽调口径，公开记录支持生产级使用和渠道相关性，但还不足以承保一个完整的耐久性故事。
