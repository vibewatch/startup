        title: 里程碑与反向信号
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示清晰的平台扩张路径。HomeLight 以经纪人匹配起步，2017 年 Series B 引入 Menlo，2019 年通过收购 Eave 进入按揭贷款，2020 年初推出 Trade-In 和
              Cash Offer，同年晚些时候加入 Disclosures.io，并借 2022 年 Accept.inc 交易加深面向经纪人的现金报价能力。2024 年 Buy Before You Sell 扩张和
              2026 年 EVA 发布延续同一模式：HomeLight 不再停留在漏斗顶部线索生成，而是持续向下游融资、协调和交割推进。

              同一时间线也保留了最重要的反向证据。RealTrends 和 The Real Deal 均报道称，HomeLight 在 2022 年 6 月宣布新融资后不久裁员
              19%，提醒我们资本可得性并未让公司免受按揭市场下行冲击。Prime Unicorn 对 2024 下调估值融资的估算指向估值压缩；BBB 和 ConsumerAffairs
              上的投诉入口也说明不满客户的证据存在，尽管公开语料不均衡，且 ConsumerAffairs 部分被反机器人控制挡住。

              第 1 章最后的读法是，HomeLight 仍在一个受可负担性压力挤压的市场里运营，释放房屋净值和融资工具很重要。HousingWire 2026
              年关于公司贷款机构调查的报道显示，借款人对首付援助需求很强，贷款机构也更担心止赎。这个背景还不该放进完整市场分析，但它解释了为什么在 2021 年后资本环境更不稳的情况下，HomeLight
              仍继续投入过桥贷款、贷款和交割产品。
