  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、定价信号与已披露牵引
        blocks:
          - type: paragraph
            body: >-
              HomeLight 仍首先从经纪人一侧变现，但公开记录现在显示的财务栈比旧的“经纪人匹配市场”标签更宽。最干净的已发布定价信号来自帮助中心转介协议页面：有效协议包含 30% 或 33%
              的佣金条款。这是真实变现锚，因为面向消费者的评测仍把 HomeLight 描述为免费使用，且通常不打佣金折扣；Real Estate Witch 称典型挂牌费仍约为
              2.5%-3%。合起来看，在任何后期附加收入之前，匹配挂牌交易的卖方转介外壳大约是成交价的 0.75%-0.99%。不过，HomeLight
              官方页面不显示已实现抽成率、合作伙伴返利或按渠道转化，因此即便这个外壳也只是局部视图。


              公司的新产品用确定性和可负担性语言营销，而不是给出明确价格透明度。当前 Buy Before You Sell 页面强调 0% 过桥贷款、最高 90% CLTV 和最高 $2 million 净值获取；2024
              年发布稿描述了当天即可获取最高 70% 净值，并扩展至 47 个州，平台已有 40 家贷款机构。这个变化很关键：当前入口围绕借款人杠杆和贷款机构效用优化，而不是披露 HomeLight
              自身如何收费。同样，HomeLight Home Loans 网站展示了品牌存在，但几乎没有公开经济性；主站呈现的产品组合横跨经纪人匹配、投资者网络销售、过桥融资、贷款机构分发和交割。


              EVA 把收入故事继续向下游推。2026 年公告把 BlackRock 管理基金提供的 $40 million 债务额度，与一款交割产品配在一起；该产品可配合 80 多个工具，并自动化约 120
              项托管任务。HomeLight 还声称已匹配超过 2 million 名买方和卖方、释放超过 $1 billion
              净值，并有数十亿美元年交易量。这些都是有意义的牵引信号，但它们是公司自称的累计运营指标，而非经审计收入。结果是：纸面上的收入模式多元，公开披露里的收入模式仍不透明。
