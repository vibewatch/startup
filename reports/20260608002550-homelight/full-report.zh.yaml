  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 核心产品与客户工作流
        blocks:
          - type: paragraph
            body: >-
              HomeLight 已不再像单一用途的“找经纪人”线索网站。当前公开入口显示的是一套交易栈：从数据支撑的经纪人匹配开始，分叉到经纪人主导的挂牌或 Simple Sale 投资者路由，再延伸到 Buy Before
              You Sell 融资，最后进入按揭和交割执行。在经纪人一侧，HomeLight 自己的帮助内容说明，匹配质量不是静态市场库存：排名系统持续奖励线索响应速度、阶段维护质量和过往 HomeLight
              转化成功。这意味着产品一部分是软件，一部分是对经纪人网络的行为管理。


              Simple Sale 是 HomeLight 保留可选性、而不是强迫单一工作流的最清晰例子。面向卖方页面把“顶级房地产经纪人”和投资者网络放进同一个信息收集流程，因此 HomeLight
              可以按适配度把房主路由向确定性，或路由向传统挂牌。Buy Before You Sell 更进一步，把 HomeLight 变成搬家协调者。公开 BBYS
              文件显示审批—报价—搬家—出售顺序、公开费率表、严格时点门槛，以及若待售旧居未及时卖出时的明确备选报价机制。这个产品不只是一个过桥贷款标题，而是一套紧密排序的运营工作流，依赖承保、挂牌执行和交割。


              Home Loans 和交割服务让公司成为下游附加平台。牌照页面显示其按揭贷款存在，帮助中心材料显示经纪人在 HomeLight 门户内开立并跟踪交割订单。实际上，HomeLight
              试图用一个软件加服务的外壳变现多个交易步骤，而不是在第一次转介后把客户交出去。
