      - number: '8.2'
        title: 公开可比框架和住房周期背景
        blocks:
          - type: paragraph
            body: >-
              可比框架不支持机械沿用 HomeLight 旧峰值。公开房地产和抵押贷款相邻股票大致分成两条区间。Compass、Opendoor 和 Offerpad 等交易重模型约按 0.1x 至 1.1x
              销售额交易，反映低利润经纪经济性或直接资产负债表风险。Zillow、Rocket 和 Blend 等更轻资产的市场和工作流公司更接近 3x 销售额。Redfin
              被收购前最后已知的独立公开市值提醒我们：住房条件转弱时，消费者经纪业务基准可以快速重置。HomeLight 处在这些区间之间，因为它既不只是线索市场，也不是纯工作流 SaaS
              供应商。推荐市场和成交自动化支持相对普通经纪业务的溢价；BBYS、抵押贷款相邻和债务支持产品则支持相对纯软件的折价。宏观背景也支持谨慎，而非绝望。NAR、Fannie Mae 和 MBA 都预计 2026
              年销售和发放量增加，但 HomeLight 自己的贷款方调查仍显示 DTI 和房屋净值借款处在高位。这意味着周期可以改善交易量，却不能消除可负担性压力或融资敏感性。估值上，宏观行情帮助上行情景，但不会自动让
              HomeLight 适用更高的 Zillow 或 Blend 式倍数。
