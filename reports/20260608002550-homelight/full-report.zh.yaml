      - number: '1.3'
        title: 资本基础、投资人和规模能见度
        blocks:
          - type: paragraph
            body: >-
              HomeLight 融资历史规模不小，层次也越来越多。Menlo Ventures 围绕最初的经纪人匹配市场领投 $40 million Series B。TechCrunch 随后记录了 2021 年 $100
              million Series D 加 $263 million 债务融资，估值 $1.6 billion；随后 2022 年 6 月在收购 Accept.inc 的同时，以 $1.7 billion
              估值延伸融资，新增 $60 million 股权和 $55 million 债务。2024 年 8 月，HomeLight 又获得 Zeev Ventures 领投的 $20 million 股权；2026 年
              4 月，公司宣布从 BlackRock 管理基金获得新的 $40 million 债务额度，用于扩展 EVA。

              投资人阵容看起来稳定，但仅靠公开来源看不清资本堆叠。官方 2024 和 2026 公司公告把 Zeev Ventures、Menlo Ventures、Group 11、Crosslink
              Capital、Bullpen Capital、Montage Ventures、Stereo Capital、Citi Ventures 和 Google Ventures 列为主要支持方。O’Melveny
              另行确认 Zeev 领投 2024 延伸轮，Menlo 自己的 2017 文章解释了为什么支持卖方市场模式。这些来源足够勾勒核心利益相关方，但不足以推断所有权、清算优先权或董事会控制。

              最大未解数字是累计融资额。TechCrunch 称 HomeLight 在 2022 延伸轮后已融资 $645 million；CB Insights 当前给出 $714.6 million，并把最新一轮标为
              Debt IV；HousingWire 援引 Crunchbase 估算称 15 轮合计 $762.5 million。Prime Unicorn 提供了更负面的资本信号，认为 2024 融资价格比此前 D 和
              D-1 轮低约 38.7%，隐含约 $1.06 billion 投后估值。因此，公司的融资历史显然真实，但确切资本基础和当前估值在公开资料中尚未完全对齐。
