chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与运营模式
        blocks:
          - type: paragraph
            body: >-
              HomeLight 现在更像一个更宽的住宅交易平台，而不是狭窄的转介网站。当前首页营销买方和卖方经纪人匹配、Simple Sale 现金报价、Buy Before You Sell
              过桥融资、贷款机构工具、交割支持和 HomeLight Home Loans 申请路径。当前 /home-loans URL 本身已经转入 Buy Before You Sell
              流程，说明贷款入口被打包进解除交易附带条件和释放房屋净值的工作流，而不是作为独立目的地。

              当前最清晰的公司锚点是 Arizona 的 Scottsdale。HomeLight 首页和新闻页脚列出 1375 N Scottsdale Road；同一批页面把 HomeLight Home Loans
              标识为同一栋楼 suite 125 的单独持牌按揭实体。与此同时，贷款机构专用网站页脚仍写 San Francisco，官方 2024 和 2026 公告也列出 Scottsdale、San
              Francisco、Dallas 和 Chicago 办公室。组合起来，Scottsdale 是当前总部的最佳判断，但也显示 HomeLight 仍有多个对外地址。

              当前最强的规模信号来自运营而不是财务。HomeLight 自己的 2026 公告称，公司已匹配超过 2 million 名买方和卖方、释放超过 $1 billion
              客户房屋净值，并且每年促成数十亿美元住宅交易。产品页也宣传大型经纪人和贷款机构网络。这些都是有意义的平台指标，但它们是公司累计口径的自述，而不是经审计收入披露，所以后续尽调需要把营销触达和已变现交易量拆开。
