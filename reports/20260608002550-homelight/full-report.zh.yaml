  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议从过时的峰值估值历史出发，结合更新的重估信号、上市公司可比区间和缺失的私有证据，落到观察决策。
    data:
      nodes:
        - id: peak_mark
          label: 峰值估值 — $1.7B (2022)
          detail: 真实历史估值不假，但相对 2024-2026 年证据已经过时。
          tone: positive
        - id: reset_signal
          label: 重估信号 — ~$1.06B (2024)
          detail: Prime Unicorn 将 2024 年 D-2 轮标为下行融资，较此前 D / D-1 定价低约 38.7%。
          tone: warning
        - id: debt_signal
          label: 债务信号 — $40M BlackRock 授信额度 (2026)
          detail: 支持 EVA 规模化，但债务融资不能确立新的股权估值。
          tone: risk
        - id: comp_band
          label: 可比公司区间 — ~0.1x 至 ~3x 收入
          detail: 交易属性重的上市可比公司落在低端；工作流和市场平台公司靠近高端。
          tone: neutral
        - id: recommendation
          label: 建议 — 观察 / 继续研究
          detail: 基准情景集中在 $0.9B-$1.3B 附近；只有做完私有收入、利润率和债务尽调后，才考虑按峰值定价。
          tone: neutral
    claimRefs:
      - CV006
      - CV008
      - CV027
      - CV032
      - CV035
      - CV051
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 在不同收入倍数下，收入（以百万美元计）需要达到多少，才能支撑旧 $1.7B 估值或 2024 年 ~$1.06B 估值。
    data:
      items:
        - label: $1.06B，4.0x 收入
          value: 265
        - label: $1.06B，3.0x 收入
          value: 353
        - label: $1.7B，5.0x 收入
          value: 340
        - label: $1.7B，4.0x 收入
          value: 425
        - label: $1.7B，3.0x 收入
          value: 567
        - label: 过时的 2021 年收入锚点
          value: 300
    approximationNotes: 图表只做简单收入倍数测算，并使用已过时的 2021 年 >$300M 收入锚点，因为当前收入未披露。
    claimRefs:
      - CV002
      - CV012
      - CV030
      - CV031
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 基于公开证据给出 HomeLight 的乐观、基准、悲观估值区间；2022 年峰值和 2024 年重估影响中点，但不决定中点。
    data:
      items:
        - label: 悲观情景估值 ($B)
          low: 0.4
          mid: 0.6
          high: 0.8
          displayValue: $0.4B-$0.8B
          detail: 周期和债务风险占主导；过桥和交割经济性更像重资本业务，而不是高溢价的工作流业务。
          tone: negative
        - label: 基准情景估值 ($B)
          low: 0.9
          mid: 1.1
          high: 1.3
          displayValue: $0.9B-$1.3B
          detail: 收入大致守住或小幅超过过时的 2021 年锚点；混合倍数需扣除不透明折价。
          tone: neutral
        - label: 乐观情景估值 ($B)
          low: 1.4
          mid: 1.6
          high: 1.8
          displayValue: $1.4B-$1.8B
          detail: 需要当前收入显著更强，也要证明 EVA 与交割附加率配得上接近工作流公司的倍数。
          tone: positive
    approximationNotes: 区间是情景带，不是点估值；未纳入私有尽调输入或优先股堆叠调整。
    claimRefs:
      - CV032
      - CV033
      - CV034
      - CV051
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: IC 式评分强调真实产品广度和改善中的宏观环境，但惩罚估值支撑、资本强度和证据质量。
    data:
      items:
        - label: 业务广度
          value: High
          detail: 推荐、过桥、房贷相邻业务和交割工作流带来的可选项，多于单一市场平台佣金流。
        - label: 宏观支撑
          value: Medium
          detail: 2026 年房屋销售和贷款发放应会改善，但住房负担能力和 DTI 压力仍是实质约束。
        - label: 资本强度
          value: High
          detail: 多轮股权加债务融资和 BBYS 敞口，使融资风险始终是估值核心。
        - label: 可比公司支撑
          value: Medium-Low
          detail: 上市可比公司支撑的混合区间更接近 2024 年重估，而不是 2022 年峰值。
        - label: 证据质量
          value: Low
          detail: 当前收入、利润率、债务条款和优先股堆叠仍未公开。
        - label: 决策匹配度
          value: Track
          detail: 这里更需要价格纪律和私有尽调，而不是再找一轮叙事材料。
    claimRefs:
      - CV017
      - CV027
      - CV037
      - CV039
      - CV040
      - CV050
