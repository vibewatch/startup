      - number: '5.4'
        title: 相对替代方案的差异化与产品技术结论
        blocks:
          - type: paragraph
            body: >-
              HomeLight 的差异化在于覆盖面和编排能力。Zillow Premier Agent 主要还是面向经纪人的付费获客和分析产品。Orchard 和 Flyhomes
              更接近可比对象，因为两者都承诺先买后卖的确定性，但 Orchard 更偏一套有经纪人引导的工作流，Flyhomes 则更偏贷款合作伙伴和融资机制。Opendoor
              更靠近纯确定性出售的一端，强调直接现金报价，并让卖家不用看房展示。Blend、Qualia 和 Snapdocs 则展示了专业化成交软件市场的样子：供应商聚焦 eClose
              基础设施，而不是把整条消费者旅程都吃下来。


              HomeLight 夹在这些类别中间。它没有成交软件供应商那么开放、那么纯软件，也不像 Zillow 或 Opendoor
              那样单一。公司试图拿下从经纪人发现、融资到成交的转换链条，这给它更多挂载点，也带来更多运营拖累。公开语料支持 BBYS 工作流设计、经纪人网络数据化和成交自动化野心已经具备真实成熟度；但还不能清楚看见 EVA
              生产率、BBYS 信贷经济性，或 Home Loans 的挂载经济性。


              因此，产品技术结论是：工作流野心值得肯定，证据仍需谨慎。HomeLight 看起来更像交易运营平台，而不是简单市场；瓶颈也都是硬问题：承保质量、经纪人供给质量，以及大规模成交执行。
