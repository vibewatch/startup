      - number: '8.3'
        title: 情景区间和建议
        blocks:
          - type: paragraph
            body: >-
              关键算术很直接。以 2021 年最后公开收入锚点约 $300M 计算，2024 年降价轮标记约等于 3.5x 收入，而 2022 年峰值约等于 5.7x。若要用 4x 销售额支撑 $1.7B，HomeLight
              当前收入需要约 $425M；若按 3x，则需要约 $567M。这不是不可能，但抓取到的来源没有证明接近这一水平。因此，可比框架支持一个更接近约 $0.9B 至 $1.3B 的基准情景：高到足以承认
              HomeLight 比基础推荐网站有更宽产品线，低到足以反映周期压力、债务依赖和当前披露缺失。如果当前收入明显高于 2021 年锚点，且 EVA
              加成交挂载能把组合推向更高倍数的工作流收入，同时不增加信用损失或运营缺陷，那么约 $1.4B 至 $1.8B 的乐观情景存在。如果过桥和贷款经济性弱于叙事所暗示，或住房反弹不及预期，则适用约 $0.4B 至
              $0.8B 的悲观情景。因此建议是观察 / 继续研究，而不是买入。公开证据不支持按 2022 年标题价付款。入场纪律应绑定到两个条件之一：价格更接近 2024/2026
              信号区间，或私下尽调能证明经济性显著强于公开记录。
