  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 相关性
    rows:
      - - 经纪人匹配和推荐市场
        - 消费者获客、线索资格筛选、经纪人介绍，以及已成交交易推荐费
        - 完整经纪业务 P&L、通用挂牌广告，以及完全由服务经纪人保留的佣金
        - 买方或卖方在成交时通过佣金经济性间接为池子买单
        - HomeLight 的核心旧有切入点；经纪人使用率仍高，因此仍有意义。
      - - 卖方附带条件移除 / 过桥净值工具
        - 过桥贷款、换购式产品、现金报价撮合，以及与搬家绑定的净值释放产品
        - 与搬家无关的永久房屋净值贷款，以及平台不承担的 iBuyer 库存风险
        - 房主借款人加资本提供方，通常由售房所得或再融资偿还
        - 直接解决低换手市场中的锁定效应和换房摩擦。
      - - 购房抵押贷款发放
        - 预批、锁定利率、承保，以及已放款购房抵押贷款
        - 仅再融资的服务经济性、仓储融资和非住房消费信贷
        - 借款人、贷款专员和贷款方共同塑造经济性
        - HomeLight 覆盖从经纪人需求捕获到贷款方交接，因此相关。
      - - 产权 / 成交工作流
        - 产权搜索、托管协调、披露审查、签字、防欺诈检查，以及 clear-to-close 操作
        - 承保机构资本、县级登记收入，以及交易工作流之外的不相关法律工作
        - 贷款方、产权机构、结算服务商和借款人共同为工作流买单
        - 与 EVA 式自动化和成交编排相关。
      - - 门户线索变现 / 挂牌分发
        - 挂牌曝光、线索路由、优先展示、重定向，以及与房源搜索绑定的经纪人营销
        - MLS 数据创建本身，以及从未触达门户的线下熟人 / 推荐行为
        - 通常由经纪人、经纪公司或门户营销预算支付
        - 决定市场的渠道权力和获客成本。
      - - 现状替代栈
        - 直接熟人推荐、经纪公司网站、MLS 搜索，以及人工贷款方 / 产权协调
        - 不是单独的支出池；这是平台的既有替代方案
        - 消费者和经纪人依赖既有关系和碎片化工具
        - 显示 HomeLight 竞争的是碎片化既有体系，而不是单一供应商。
    notes: 工作流边界比“全部房地产科技”更窄：它包括与交易绑定的收入池，排除资产负债表或非交易住房支出。
