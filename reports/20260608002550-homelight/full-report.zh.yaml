  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 门户、转介网络和折扣匹配平台设定切换基线
        blocks:
          - type: paragraph
            body: >-
              HomeLight 已不再像一个简单的转介网站，但核心直接战场仍是漏斗顶部的经纪人选择。HomeLight
              自己的页面显示一套更宽的组合，可从经纪人匹配开始，延伸到贷款机构、房源搜索、现金投资者售房选项和交割指导。问题在于，这一层最强的对手要么拥有流量，要么拥有消费者省钱叙事，或者两者兼有。Zillow
              仍是最清晰的流量巨头：它每 4 秒卖出一个 Premier Agent 连接，公开按都市区为连接定价，并用 220 million 月均独立用户和庞大的周边产品栈支撑这个渠道。Redfin
              从另一角度进攻，承诺卖方“半价佣金”，并声称其经纪网站流量远超第二名；Realtor.com 则把 ReadyConnect 的筛选转介网络与 UpNest 的开放提案市场结合起来。


              HomeLight 最不舒服的对比不只是门户，还有低费率匹配平台。Clever 明确以 1.5% 挂牌费打头，独立评测证据则称 HomeLight
              通常仍让消费者支付标准佣金。这很重要，因为转介网络很容易多栖。经纪人可以买 Zillow 线索、接受 Flex 式成交后付费转介、留在 Realtor.com 的礼宾网络里，同时继续使用
              HomeLight。在这种环境中，HomeLight 的经纪人匹配楔子有用，但天然锁定效应不强。买方或卖方可以按价格透明度、品牌熟悉度或经纪人比较速度切换，而不是受制于深层产品依赖。
