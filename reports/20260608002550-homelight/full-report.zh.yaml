      - number: '4.2'
        title: 单位经济代理指标、交易量锚点与成本结构
        blocks:
          - type: paragraph
            body: >-
              HomeLight 公开单位经济图景由一个旧收入锚、少数交易代理和大量推断拼成。TechCrunch 报道管理层预计 2021 年年收入超过 $300 million，同一报道称 Trade-In 和 Cash
              Offer 自推出以来增长超过 700%。2022 年，TechCrunch 又称 HomeLight 与 Accept 在 2022 年 Q1 合计转介交易量超过 $3 billion，且截至 2022 年 4
              月，Cash Offer 单独的交易量同比增长 500%。这些披露有方向价值：它们显示公司在 2022 年后住房放缓前已有真实交易量和真实变现。但它们是历史数据。此后 HomeLight
              没有更新公开收入、毛利率、EBITDA 或收入结构，外部无法判断新产品是在增厚经济性，还是只是保住交易量。


              模型结构至少指向两个非常不同的经济引擎。转介收入在成交后从经纪人佣金中收取，因此可能比确定性产品轻资本得多。相比之下，Buy Before You Sell 被包装成 0%
              借款人过桥产品，可解除交易附带条件并降低 DTI。这几乎肯定意味着 HomeLight 需要在交易其他位置赚钱——通过附加融资、合作伙伴经济、交割收入或某种未披露变现路径——因为公开页面没有呈现利差故事。EVA
              暗示第三个引擎：类似软件或服务的交割收入，可以通过自动化 120 项任务提高劳动生产率；但公司同样没有披露公开价格表或利润率画像。


              公开可比公司展示了这些相邻业务在披露充分时可能长什么样。Zillow 2026 年 Q1 文件显示一个大型附加模型，收入 $708 million，其中按揭收入 $64 million、购房贷款发放 $1.5
              billion，并有 $788 million 现金和投资支撑。Compass 披露了一体化经纪经济：收入 $2.70 billion、现金 $484 million，单季产权和托管交易超过 30,000
              笔。Opendoor 给出反面教训：确定性产品可以带来 $720 million 季度收入，但当库存和利润率纪律不够强，仍会亏损 $173 million。Offerpad
              的发布稿有价值，因为它突出更轻资本的组合转向：2026 年 Q1 转介量已经超过 2025 全年，Renovate 利润率为 20%-30%。合在一起，这些可比公司说明 HomeLight
              后期变现可以有价值，但前提是公司管理资本强度、合作伙伴附加和工作流生产率的能力，强于当前公开记录能证明的程度。
