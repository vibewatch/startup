      - number: '6.2'
        title: 双边网络和渠道经济性
        blocks:
          - type: paragraph
            body: >-
              HomeLight 的经济性是双边的。消费者被告知搜索体验免费，但专业人士用推荐费和相邻产品挂载为系统买单。经纪人侧，HomeLight
              讲的是能力择优的故事：业绩和匹配应来自经过验证的表现，而推荐质量取决于响应速度、接通率、会面率、挂牌率和成交率等运营指标。给专业人士的承诺是：执行越好，未来线索越好，也越能接触更多可变现产品。推荐页面中
              Julie Wyss
              的案例显示，这对高绩效者可能有真实经济意义。公司侧，这形成一个强化循环：更多消费者需求生成更多行为数据，更多行为数据又可以用来给供给排序。但压力也随之而来。同样能提升转化的自动触达和绩效逻辑，在客户没有预期自己的信息会这么快流转时，也会让产品显得咄咄逼人或像垃圾营销。
