      - number: '7.2'
        title: 资本、住房周期和产品结构风险
        blocks:
          - type: paragraph
            body: >-
              第二个主要风险是，HomeLight 把类贷款产品和成交自动化叠加到一个仍受利率和可负担性约束的市场上。Buy Before You Sell
              有吸引力，因为它帮助家庭释放净值、拿掉附带条件，并在卖出前先搬家；但帮助中心材料也揭示了产品为什么运营上很脆弱：费用会随项目路径变化，杠杆可达 90% CLTV，旧房卖出前资金会电汇进购房托管账户，如果旧房
              120 天内卖不掉，HomeLight 可能最终买下这套待售房。这让业务依赖资本可得性、承保纪律，以及准确的房产 / 负债假设。公司自己的融资历史强化了这种暴露。HomeLight 在 2022
              年抵押贷款低迷期裁掉 19% 员工，接受了明显更弱的 2024 年轮次，随后又在 2026 年从 BlackRock 获得新债务融资以扩展
              EVA。单看任何一件事都不能证明困境，但合在一起，它们显示这家公司已经围绕更弱的交易市场做过缩编和再融资。即便宏观基准情景也只是温和支持：Fannie Mae 预计利率下降、发放量增加，但 NAR 和 NAHB
              仍把可负担性和首次购房者压力描述为结构性拖累。对 HomeLight 来说，这意味着更好的行情可能改善 BBYS、贷款和成交挂载，但它们不会因此免疫于新一轮交易量或信用压力。
