      - number: '3.2'
        title: 现金报价、过桥和先买后卖服务商拼的是确定性、资本与合作覆盖
        blocks:
          - type: paragraph
            body: >-
              HomeLight 的第二战场是交易确定性：让房主在旧房卖出前买到下一套房，或者在速度比价格发现更重要时，给卖方一个全现金替代方案。这里合适的可比对象是 Orchard、Flyhomes、Opendoor 和
              Offerpad。Orchard 的 Move First 主张在运营上接近 HomeLight Buy Before You Sell：释放净值、发出无附带条件报价，并由专门经纪人处理旧房准备和出售。但
              Orchard 最新融资稿显示更明确的市场平台再定位，称自己已成为更宽的开放房地产平台，而不只是贷款产品。Flyhomes 又不同。它的首页现在围绕 30,000
              多名贷款专员的合作伙伴分发和案例式融资结果展开；HousingWire 称公司获得了新股权和新的仓储信贷额度。


              这些事实让先买后卖服务商这一类看起来不太像线索生成竞赛，更像资本与分发竞赛。这也解释了反向证据为何重要。GeekWire 报道 Flyhomes
              退出经纪业务、转向融资产品，说明在该细分里防守宽泛的面向消费者模式有多难。上市 iBuyer 从资产负债表一侧强调同样教训。Opendoor 正在改善队列和库存健康度，但 2026 年 Q1
              仍报告大额净亏损。Offerpad 同样把自己定义为多路径卖方平台，但其价值主张仍取决于能否为现金报价提供资金、运营市场，并让卖方经济性保持吸引力。HomeLight
              参与这一类别，但无论在资本规模还是自有消费者需求上，都看不出占据主导。
