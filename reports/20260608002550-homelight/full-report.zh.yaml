  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 信心
      - 依据
    rows:
      - - 建议
        - 观察 / 继续研究
        - 中
        - 公开证据支持其业务真实存在，但不足以在峰值估值框架下给出完整尽调支撑的买入判断。
      - - 风险评级
        - 高
        - 中
        - 债务依赖、混合业务模式和当前披露缺失，让下行不确定性仍然偏高。
      - - 估值立场
        - 相比 2022 峰值，接近 2024 重置价更可信
        - 中
        - 与已经陈旧的 $1.7B 标记相比，2024 降估值融资轮和 2026 债务工具是更新的公开信号。
      - - 中心区间
        - $0.9B-$1.3B
        - 低至中
        - 假设收入大致持平或略高于已经陈旧的 2021 锚点，折价后混合经济性接近 3x-4x 风格。
      - - 改变判断的因素
        - 当前收入、BBYS 经济性、债务条款和优先股堆叠
        - 高
        - 私下尽调对立场的上修或下修幅度，可能远大于再做一轮叙事来源梳理。
    notes: 建议仅基于公开证据；信心反映证据质量，而非底层产品野心或客户效用。
