companyProfile:
  summary: >-
    HomeLight 是一家成立于 2012 年的私营住宅交易平台，目前公开重心在 Arizona 的 Scottsdale。公司从经纪人匹配扩展到 Simple Sale、Buy Before You
    Sell、贷款机构分发、住房贷款相邻业务和交割自动化，比纯转介市场有更多变现面。公开证据支持有意义的累计触达，包括匹配超过 2 million 名买方和卖方、释放超过 $1 billion
    的客户房屋净值，但当前尽调图景仍不透明：收入、利润率、员工数和资本结构细节仍是私有信息；公开估值叙事自 2022 年高点以来已明显重置。
