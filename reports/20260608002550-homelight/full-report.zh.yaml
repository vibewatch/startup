      - number: '1.2'
        title: 领导层、治理与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              Drew Uher 仍然锚定 HomeLight 的公共身份。当前官方公告和第三方高管数据库都称他为创始人兼首席执行官；在 2024 Buy Before You Sell 扩张和 2026 EVA
              发布中，他的表述承载公司产品、融资和战略叙事。Craft 的高管名单给出了 CEO 以下最清晰的当前公开视图，列出运营、财务、技术、住房业务和交割服务负责人。

              治理透明度弱于产品透明度。已审阅的官方 HomeLight 页面提供产品、联系方式、招聘内容和新闻材料，但没有公布当前董事会名单、委员会结构或清晰控制图。Zeev Ventures、Menlo
              Ventures、Group 11 等投资方反复出现在官方融资材料中，强烈暗示投资人仍有影响力；但本报告审阅的公开记录不足以把这些治理权利看得足够清楚，不能当作确定事实。

              实际尽调含义是关键人依赖。Uher 看起来不仅是原始创始人-市场匹配的中心，也掌握资本形成、产品方向和公司当前 AI 交割扩张逻辑。HomeLight 在运营上不像一人公司，但公开记录仍过度依赖一位创始人 CEO
              和部分可见的高管梯队。因此，继任计划、董事会监督和业务线问责都是重要跟进项。
