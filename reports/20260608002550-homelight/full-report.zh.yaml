      - 方向
      - 时点
      - 影响
      - 尽调问题
    rows:
      - - 库存从历史低位修复
        - 顺风
        - 当前
        - 即便换手率仍低迷，待售房源增加也应带来更多经纪人匹配和交割机会。
        - 按都市圈索取线索量相对本地库存增长的弹性。
      - - 按揭利率锁定效应
        - 逆风
        - 当前
        - 持有低于市场利率按揭的业主推迟挂牌，压缩中介可服务的交易供给。
        - 量化 HomeLight 用户队列中仍持有低于 4% 或低于 6% 老按揭的占比。
      - - 首次购房者承受力压力
        - 逆风
        - 当前
        - 高利率、高租金和首付压力压低低净值家庭的转化。
        - 按买方队列和收入带索取审批到交割率与流失率。
      - - 现房主权益集中
        - 顺风
        - 当前
        - 年龄更大的卖方和换房卖方手里有内嵌权益，更适合过桥和现金报价产品。
        - 索取高权益卖方的过桥转化、损失率和重复使用数据。
      - - NAR 和解带来的透明度变化
        - 多空交织
        - 当前
        - 买方协议和 MLS 外佣金让谈判更显性，但也增加流程摩擦。
        - 审计费用披露或协议签署时点阻断看房或转介交接的频率。
      - - MLS 治理和反垄断不确定性
        - 逆风
        - 当前
        - 即便佣金字段消失，数据访问规则对门户和市场平台仍有战略重要性。
        - 按 MLS 和门户伙伴拆解流量、线索和数据依赖。
      - - 门户流量集中与线索归属
        - 逆风
        - 当前
        - 门户仍可通过展位、线索路由和付费曝光产品抽走注意力租金。
        - 比较自然、门户、经纪公司和转介渠道的 CAC 与成交率。
      - - 购房贷款发放反弹
        - 顺风
        - '2026'
        - 即便按揭市场温和修复，也会拓宽放款机构软件和预批机会。
        - 将放款机构经济性拆分为购房、再融资和权益产品。
      - - 产权工作流自动化需求
        - 顺风
        - '2026'
        - 面对再融资、违约和 HELOC 结构变化，产权伙伴更偏好集成、低触点工作流。
        - 衡量 EVA 实施成本、产权周期时间缩短和错误率影响。
      - - 公开 SAM 不透明
        - 逆风
        - 当前
        - 总交易池夸大了 HomeLight 的真实 SAM，因为转化、挂接和留存数据都不公开。
        - 按产品和市场索取从线索到成交的队列漏斗数据。
    notes: 这些影响把当前市场数据与渠道结构证据合在一起看；开放尽调问题聚焦于把宽口径市场池转成可承销份额假设所需的私有指标。
