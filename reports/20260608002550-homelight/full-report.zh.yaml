        - 数据支撑的排序，加上跟进速度和阶段纪律反馈循环，让供给质量部分由算法决定，而不只是目录
        - 需要按队列拆分的转化、匹配接受率和按渠道拆分的推荐变现
      - - Simple Sale 投资者路由
        - 卖家
        - 已上线的面向消费者入口和投资者网络路径
        - 混合路径保留投资者确定性和经纪人比较，不强迫单一出售模式
        - 需要现金买家覆盖、抽成率机制，以及进入其他 HomeLight 产品的附加率
      - - Buy Before You Sell 核心项目
        - 经纪人、贷款机构、借款人
        - 规模化生产工作流，公开时间线、费用、资格和门户阶段
        - 在一条流程里结合净值释放、取消前置条件、定时挂牌纪律和备用报价逻辑
        - 需要从审批到交割的漏斗、流失率，以及按地域或合作伙伴队列拆分的表现
      - - Equity Boost / HELOC + 资产层
        - 贷款专员、借款人
        - BBYS 的线上附加模块，输入和条件有文档说明
        - 靠 HELOC 或资产证明扩展融资能力，而不是单一静态过桥结构
        - 需要资金来源、使用率、缺口频率和实际经济性
      - - HomeLight Home Loans
        - 借款人、贷款专员
        - 有牌照的运营界面，但公开产品细节稀疏
        - 按揭牌照和附加潜力让 HomeLight 能把经济性留在交易内，而不只是导流出去
        - 需要当前借款人旅程、定价、服务模型，以及 BBYS 或经纪人匹配流量带来的附加
      - - Closing Services / EVA
        - 经纪人、托管官、贷款机构
        - 已在市场中的交割工作流，加 2026 年 AI 自动化发布
        - 内部交割加 AI 工作流自动化，可以压缩竞争对手常留给第三方的交接
        - 需要发布后生产率、缺陷率，以及按市场拆分的客户采用
