      - number: '5.2'
        title: 运营架构与技术证据
        blocks:
          - type: paragraph
            body: >-
              最好的公开技术证据是运营性的，而不是深层架构性的。帮助中心工作流显示，BBYS 承保要经过贷款机构提交、问卷和照片收集、预批准、文件上传和资金电汇，贷款机构门户会展示每个阶段。Equity Boost
              又加一层：HomeLight 可以通过新购住宅上的无提款 HELOC 或资产证明支持来提高可用净值，但这需要传统按揭文件，比如 1003、1008、Clear to Close
              文件、信用和收入文件以及近期对账单。这是真实承保栈，不是简单营销小组件。


              交割服务把栈延伸到托管运营。经纪人用一组受限必填字段从门户开单，然后在托管专员处理文件的同时管理任务、进度、文件和交易对手。EVA 是本章最清晰的产品化技术锚：HomeLight 称这款 AI 托管代理可配合
              80 多个工具，自动化约 120 项交割任务中的大多数，并触达贷款机构、HOA、政府办公室、文件订购和资金流动。这些说法更像是在伙伴丰富的运营图谱上做工作流自动化，而不是纯自助 SaaS 功能。


              还有证据表明，HomeLight 仍围绕网络维护一套软件仪表盘。转介指标移动端、Greenhouse 职位、RealSynch 集成页面和隐私政策，都指向一个包含身份、分析、CRM
              同步、门户埋点和移动层的生态。缺失的是公开开发者门户、可用性历史或工程文档；这些材料本可让外部像评估更开放的基础设施公司那样评估可靠性。
