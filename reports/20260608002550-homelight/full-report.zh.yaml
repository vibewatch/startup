      - number: '2.3'
        title: 佣金规则变化与经纪人市场动态
        blocks:
          - type: paragraph
            body: >-
              NAR 和解改变的是佣金如何呈现，不是佣金是否存在。和解及后续执业变化禁止在 MLS 挂牌中发布买方经纪人佣金报价，并要求看房前签署书面买方协议，佣金要写进协议。NAR 2026
              年道德规范更新更进一步，把披露义务缩窄到 REALTOR® 自己的客户，并删除了旧的可变费率佣金规则；那条规则原本假设 MLS
              存在单边佣金报价。换句话说，旧佣金字段从共享数据库层消失了，但谈判负担转入买方、卖方和经纪人的双边工作流。


              这种变化对经纪人匹配市场很关键。旧模式下，MLS 佣金能见度支撑了更简单的合作规范。和解后，市场运营方必须帮助经纪人证明价值、管理买方协议时点，并在不引导交易的前提下协调 MLS
              之外的佣金或让利。法律环境也仍未落定：DOJ 和 FTC 在 2026 年重新开放竞争者协作指引；NAR 和 CMLS 则借该流程主张 MLS 仍是促进竞争的基础设施，其数据共享规则降低搜索成本并保护小型公司。


              目前证据指向调整，而不是坍塌。Redfin 2025 年 Q1 佣金分析发现，买方经纪人平均佣金为 2.40%，只略低于和解前水平，且通常仍由卖方支付。与此同时，Homes.com
              明确把挂牌经纪人的线索归属和曝光变现。这些事实意味着，HomeLight 的市场经济现在更少依赖隐性的 MLS 规范，更依赖明确的费用讨论、可信介绍，以及在正确时点把消费者导入合适的人和融资工作流的能力。
