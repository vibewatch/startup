  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值区间
      - 概率信号
      - 关键下行或上行触发因素
    rows:
      - - 乐观
        - 收入稳稳高于 $350M，交割业务 / EVA 提高收入组合质量，债务仍是助推器，而不是压力点。
        - $1.4B-$1.8B
        - 有可能，但公开证据尚未证明
        - 需要证明类工作流收入和利润率如今足以接近软件公司估值倍数。
      - - 基准
        - 收入接近持平或小幅高于过时的 2021 年基准；债务和透明度不足仍让公开可比公司倍数打折。
        - $0.9B-$1.3B
        - 从公开证据看最可信
        - 最符合打折后的 3x-4x 混合区间，折扣来自缺少收入和融资细节。
      - - 悲观
        - 住房复苏不及预期，过桥业务经济性弱于预期，或又出现一次定价偏弱的融资。
        - $0.4B-$0.8B
        - 一旦债务或信用压力浮现，存在真实下行
        - 可比结果会转向资本密集型交易模式，而不是高溢价工作流公司。
    notes: 情景区间是判断带，不是虚假的精确点估值，因为公司没有公开披露当前收入基数。
