  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 市场结构和监管风险
        blocks:
          - type: paragraph
            body: >-
              HomeLight 最大的单一风险，是买方获客、推荐变现和贷款方线索流的规则同时在变化。2024 年 8 月后 NAR 和解取消了 MLS
              展示的买方经纪人报酬，并要求看房前签署书面买方协议；这没有消灭佣金，但让报酬更显性、也更可谈判。对一家市场卖点是速度和便利、而不是保证省费的公司来说，这很关键：买方现在要面对更可见的代理文件，经纪人和消费者也更有理由比较低成本替代方案。风险不限于经纪业务。HomeLight
              自己的条款和推荐更新显示，公司离电话营销、TCPA 和推荐费合规很近。公司披露按佣金百分比变现推荐、30%-33% 的经纪人条款、按交易层面收费、双重代理影响，以及针对电话和短信的广泛同意语言。与此同时，CFPB
              和 FTC 对引导、回扣，以及自称中立却按报酬路由消费者的线索生成器，监管指引变得更严格。新的触发线索制度又提高了抵押贷款营销门槛。合在一起，HomeLight
              暴露的不只是住房需求；它还暴露在不断收紧的合规边界之下，而这个边界管的是房地产和抵押贷款需求如何被获取、路由、披露和变现。
