  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 维度
      - 乐观论点
      - 悲观反驳
      - 改变判断的证据
    rows:
      - - 业务宽度
        - HomeLight 已从推荐扩展到过桥、房贷相邻和成交工作流，可提高钱包份额。
        - 同一扩张也让模型比纯市场更依赖资本、运营更复杂。
        - 展示按业务线拆分的当前收入和利润率，证明新产品是增厚而非防守。
      - - 资本结构
        - 如果过桥和成交产品拉动强、损失内容低，债务可以高效。
        - 多次股权加债务融资表明，产品扩张仍依赖外部资本。
        - 提供债务期限表、契约、借款基数机制和按产品拆分的现金生成。
      - - 宏观背景
        - NAR、Fannie 和 MBA 都预期 2026 销售和放款发起增加，有利于交易量。
        - 可负担性、DTI 压力和利率敏感度仍高，足以压制附着和拉动。
        - 展示按利率区间和借款人画像拆分的队列转化与放款量。
      - - 估值信号
        - 如果收入显著高于 2021 锚点且组合上移，超过 $1.4B 的估值说得通。
        - 2024 年约 $1.06B 的降估值融资轮是更新的股权信号，可能已经是市场出清参考点。
        - 提供更新后的收入、利润率和董事会估值标记数据，支撑相对 2024 重置价的溢价。
      - - AI / 成交上行
        - EVA 可能创造类似工作流的经济性，并支撑高于经纪业务可比公司的倍数。
        - AI 成交自动化也可能只是包在债务资助运营里的低利润服务。
        - 披露每个文件收入、自动化节省、缺陷率，以及从推荐到成交的附着。
    notes: 各行围绕哪些证据会推动估值变化来框定决策，而不是围绕泛泛的质量叙事。
    claimRefs:
