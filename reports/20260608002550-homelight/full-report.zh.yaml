        title: 图表
        blocks:
          - type: callout
            title: HomeLight 现在更适合被看作交易运营平台
            body: 公开产品集覆盖发现、融资和成交，因此尽调应把 HomeLight 视为市场、抵押贷款和运营混合业务，而不只是线索市场。
            calloutType: insight
            claimRefs:
              - CE007
              - CE025
              - CE029
              - CE046
          - type: callout
            title: 闸门风险在执行，不在功能宽度
            body: BBYS 和 EVA 在公开材料中都显得真实，但两者都依赖承保纪律、交易对手和文件级运营；这些东西比顶部漏斗线索流入难扩展得多。
            calloutType: risk
            claimRefs:
