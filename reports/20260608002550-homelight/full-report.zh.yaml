  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分群和决策驱动因素
        blocks:
          - type: paragraph
            body: >-
              HomeLight
              的客户基础不只是一个点开匹配表单的房主。消费者端，公司服务几类人：想快速找到经纪人的卖家、需要本地指导的买家、想走现金报价或投资者路线的房主，以及必须先买后卖的家庭。专业端，它服务合作经纪人、贷款专员和成交团队；这些人把
              HomeLight 用作线索来源或执行层。消费者侧共同的决策驱动因素是便利和确定性：快速比较经纪人、无义务的起点，以及缓解搬家时间压力的办法。价格作为决策驱动明显更弱。独立评测反复指出，HomeLight
              可以免费试用，但通常把消费者转给标准佣金经纪人；因此，最适合的是优先考虑速度、本地专业能力或选择空间，而不是最低费用的人。这一区分很重要，因为它同时解释了客户牵引力和核心定价风险。
