            body: >-
              HomeLight 的扩张故事直观，哪怕经济性仍不透明。公司可以通过免费经纪人匹配或 Simple Sale 咨询获客；当时间安排成为瓶颈时，把客户转入 Buy Before You Sell 或 Home
              Loans；随后再把交易的一部分留在 HomeLight Closing Services 里。专业端，经纪人和贷款方可以先从线索流开始，再扩展到
              BBYS、现金买家或成交协调。这意味着平台在消费者端和专业端都有真实交叉销售潜力。问题在于可见度。受审阅来源没有披露进入 Home Loans 或 Closing Services
