      - number: '3.3'
        title: 经纪公司和工作流供应商同时抬高全栈交易控制门槛
        blocks:
          - type: paragraph
            body: >-
              第三类竞争者从漏斗下方和上方同时攻击 HomeLight。Compass 展示了规模化经纪公司在控制经纪人、挂牌和附加服务后能做什么。其卖方工作流从私域独家房源和即将上市营销开始，利用 340,000
              名经纪人网络做早期发现，然后再公开扩展，同时把严肃询盘路由给 Compass 经纪人。与 Anywhere 合并后，Compass
              规模也足以披露收入、现金、经纪人数、产权和托管吞吐量，以及产品附加趋势。Redfin 与 Rocket 的组合指向同一战略方向：经纪流量直接配按揭激励。HomeLight
              拥有这套栈的一些部分，但既有玩家正在把组合做得更明确。


              与此同时，另一组供应商争夺交割和贷款机构工作流，即使它们根本不争夺消费者。Blend 向贷款机构销售更快的数字交割，Qualia 向产权和托管专业人士销售共享交割基础设施，Snapdocs 则营销 15
              分钟内借款人交割和可进入二级市场的 eNotes。这些公司不需要赢得最初的房源搜索点击，也能替代 HomeLight 后期故事中的部分环节。它们的价值主张是运营效率、集成和合作伙伴采用。这意味着
              HomeLight 后期产品面对的不仅是门户和经纪公司竞争者，还有专业基础设施供应商；它们的经济性锚在 B2B 工作流预算，而不是经纪人转介费。
