  - id: TV005
    title: 投资逻辑破裂和止损触发因素表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 当前收入不及预期
        - 私下尽调显示收入显著低于约 $250M，或收入组合质量偏弱
        - 2022 年峰值估值几乎无法自圆其说，价值会被推向悲观情景区间
        - 不要按高于接近下轮降价的区间承销；用悲观 / 基准框架重设估值。
      - - 融资压力再现
        - 新债或新股条件明显走弱，或契约压力变得可见
        - 证明资本是约束，而不是增长加速器
        - 转为回避，或要求更深的入场折扣。
      - - 过桥 / BBYS 亏损内容上升
        - 分批数据暴露亏损率、强制购买频率或转化恶化
        - HomeLight 会更接近资本密集型交易可比公司，而不是高溢价工作流可比公司
        - 下调估值，并将债务依赖视为结构性问题。
      - - EVA / 交割复杂度损害质量
        - 自动化增长带来的缺陷、合规或客户摩擦成本快过节省的人力
        - 削弱乐观情景所需的高溢价工作流倍数
        - 在单位经济性得到证明前，剔除模型中的软件式上行。
    notes: 止损触发因素聚焦会推翻高溢价倍数投资逻辑的证据，而不是泛泛的市场波动。
    claimRefs:
      - CV033
      - CV034
      - CV038
      - CV040
      - CV042
      - CV043
      - CV048
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 尽调路径
    rows:
      - - 按业务线拆分的当前收入
        - 最新季度和月度收入，按推荐、BBYS、贷款方、贷款和交割拆分
        - 锚定每个估值情景，并检验公司是否守住或超过 2021 年收入基数
        - 索取管理层报告包，以及从 2021 年到最近季度的分项桥接。
      - - 毛利率和附加业务经济性
        - 按业务线拆分的利润率，以及从市场业务到融资和交割的附加率
        - 决定 HomeLight 应拿到类工作流还是类交易倍数
        - 索取贡献利润率瀑布，以及按来源渠道拆分的附加率队列。
      - - BBYS 分批表现
        - 按队列拆分的亏损率、强制购买频率、资金成本和回收时点
        - 检验资本支持的便利产品是在增加还是毁损股权价值
        - 从承保、服务和财务团队拉取队列数据。
      - - 债务、仓储额度和契约包
        - 授信规模、到期日、抵押条款和贷款方集中度
        - 反复使用债务意味着融资风险可在弱市中主导股权价值
        - 审阅债务文件、契约模型和借款基数测算。
      - - 股权结构表和优先权
        - 当前优先股堆叠条款、清算优先权和任何可靠的二级市场价格发现
        - 如果优先权悬挂很大，企业价值直觉可能大幅高估普通股价值
        - 索取当前股权结构表导出、409A 和所有优先股条款清单。
    notes: 这些问题按能最快提升新投资人价格纪律的程度排序。
    claimRefs:
      - CV037
      - CV041
      - CV050
