    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流
      - HomeLight 方案
      - 可衡量收益主张
      - 限制 / 瓶颈
    rows:
      - - 找到合适的挂牌经纪人
        - 消费者提交线索，HomeLight 将其路由给排序后的经纪人
        - Agent Matching 权衡交易历史、匹配度、评价、响应速度和过往 HomeLight 成功记录
        - 相比无差别目录，排序更快、匹配质量更高
        - 质量仍取决于经纪人快速响应，并维护门户资料和流程纪律
      - - 不承受完整挂牌摩擦也能快速出售
        - 卖方输入地址并查看估算报价
        - Simple Sale 在一个入口流程里比较头部经纪人和投资者买家
        - 房主不用跳过经纪人比较，也有确定性路径
        - 公开页面没有披露投资者赢单率或费用实现
      - - 先买下一套房，再卖现有住房
        - 审批当前房产，提出非或有报价，搬家后再卖旧房
        - BBYS 取消卖房前置条件，并围绕 21 天和 120 天时间线安排旧房处置
        - HomeLight 声称 24 小时审批，且空置房屋出售条件更好
        - 如果估值、文件或最终卖房不配合，工作流就会断裂
      - - 释放更多净值用于首付或准备
        - 借款人需要比基础 BBYS 释放额更多的资金
        - Equity Boost 增加 HELOC 和资产证明选项，最高 90% CLTV
        - 无需等旧居出售即可提高购买力
        - 需要更多文件、更复杂的承保，以及潜在缺口处理
      - - 在平台内跑交割文件
        - 经纪人在门户创建订单并跟踪文件状态
        - Closing Services 集中管理任务、进度、文件、人员和托管官沟通
        - 减少只靠邮件的交接，更清楚下一步
        - 没有该工作流的公开 SLA 或缺陷率证据
      - - 自动化重复交割工作
        - 托管文件需要订购文件、协调各方并调拨资金
        - EVA 跨 80+ 个工具和 120 项任务自动化大部分文件处理
        - HomeLight 声称数分钟而非数小时即可开单，且人工输入更少
        - 没有关于准确性、异常处理或回退流程的公开审计
