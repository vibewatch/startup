      - number: '3.4'
        title: HomeLight 差异化真实存在，但最强护城河仍掌握在流量所有者和一体化既有玩家手里
        blocks:
          - type: paragraph
            body: >-
              本章的持久结论是，HomeLight 的差异化更多来自宽度，而不是控制力。它确实有一个正当战略形态：用户可以从经纪人匹配开始，进入融资或净值释放，再继续到交割支持。这比 Clever、UpNest 或单独的
              Zillow Premier Agent 更宽，也比纯粹以 iBuyer 身份赢市场更轻资产。但宽度不等于防御力。Zillow、Redfin/Rocket、Compass 和 Realtor.com
              要么拥有更多受众，要么拥有更直接的经纪杠杆，要么有更多已披露资本来持续改善组合。


              切换动态让这一点尤其重要。在漏斗顶部转介里，买方和经纪人几乎无摩擦多栖，因此价格清晰度和品牌习惯被放大。在过桥、按揭和交割工作流中，切换成本上升，因为资本额度、集成和合作伙伴培训更重要；但专业供应商和纵向一体化既有玩家已经挤进这些层。公开耐久性也不利于
              HomeLight：Zillow、Compass 和 Move/Realtor.com 能展示当前收入和现金规模证据；私营细分玩家只能通过选择性融资公告透露耐久性。因此判断需要分层。HomeLight
              并未困在单一脆弱楔子里，但凡是流量所有者、低费率匹配平台或一体化经纪-金融栈能复制足够工作流、又比 HomeLight 更好控制客户关系的地方，HomeLight 仍会暴露。
