    title: 收入流表
    columns:
      - 收入流
      - 机制
      - 单位
      - 当前数值 / 状态
      - 质量
      - 尽调问题
    rows:
      - - 经纪人推荐市场
        - HomeLight 将消费者匹配给经纪人，并在成交后收取经纪人佣金的一部分
        - 经纪人佣金推荐费
        - 当前合同条款写明 30% 或 33%
        - 最好的公开定价锚点；实际成交率和钱包份额未知
        - 按线索队列索取成交率、按交易方索取实际推荐费，以及匹配经纪人年度业务量占比
      - - Buy Before You Sell / 过桥净值释放
        - 过桥产品取消卖房前置条件，并在出售前释放房屋净值
        - 过桥融资加附带交易经济性
        - 当前页面营销 0% 过桥贷款、最高 90% CLTV，以及最高 $2M 净值额度
        - 标价可见，变现路径不可见
        - 索取利差 / 费用表、损失率、合作伙伴经济性，以及每个获资客户的贡献毛利
      - - HomeLight Home Loans / 贷款机构推荐
        - 匹配到购房意向后，发起按揭或转交贷款机构
        - 按揭收入、推荐收入或合作伙伴费用
        - 品牌和牌照可见；当前公开经济性不可见
        - 运营存在感清楚；收入模型不透明
        - 索取放款量、出售收益经济性、合作伙伴收入分成，以及匹配客户的附加率
      - - Simple Sale / 投资者网络
        - 卖方可跳过挂牌，进入投资者或现金买家网络
        - 推荐费或交易费
        - 当前网站展示该路径，但没有公开费率表
        - 概念上存在收入；公开变现细节很少
        - 索取投资者网络抽成率、相对挂牌路径的赢单 / 输单率，以及每个转化卖方的平均收入
      - - 交割 / EVA 自动化
        - AI 驱动的托管工作流自动处理 80+ 个工具交互和约 120 项交割任务
        - 交割服务费、工作流软件费或打包交易收入
        - 公开披露了牵引力和融资；公开定价没有披露
        - 产品披露较好，经济性披露偏弱
        - 索取单文件收入、节省工时、毛利率，以及与推荐或贷款的附加情况
      - - 跨产品平台变现
        - 家庭可以从经纪人匹配开始，再延伸到融资和交割
        - 生命周期内附加率提升
        - HomeLight 披露累计规模指标，而非业务线收入结构
        - 战略逻辑强，分部披露弱
        - 索取从匹配线索到获资客户再到完成交割交易的漏斗，以及每一步收入
    notes: 公开来源支持多条变现线存在，但只有经纪人推荐条款和漏斗顶部牵引力得到直接披露；实际结构仍属私有信息。
