      - number: '8.4'
        title: 尽调问题和投资逻辑破裂触发点
        blocks:
          - type: paragraph
            body: >-
              剩下的工作是私下证据工作。可信的投资决策需要当前分业务收入、毛利率、BBYS
              队列表现、债务和仓储条款，以及优先股堆叠。没有这些数据集，投资者就是在多个故事之间选择，而不是承保概率平衡。能把建议上调的故事很清楚：HomeLight 证明收入在 2021
              年后守住或重新加速，新成交和抵押贷款工作流改善组合，而不只是消耗资本，债务仍是赋能工具而非拐杖。让投资逻辑破裂的故事同样清楚：又一轮弱定价融资，过桥损失或契约压力，或证据显示 EVA /
              成交增长增加复杂度的速度快过增加利润率。由于公开记录同时显示真实产品栈和真实降价轮，尽调应先反证溢价情景。如果公司不能展示耐久收入、可控融资条款，以及过桥和成交中可接受的经济性，正确结论不是业务没有价值，而是公开市场类比更接近
              2024 年重置，而不是 2022 年峰值。
