  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与渠道基础设施
        blocks:
          - type: paragraph
            body: >-
              HomeLight
              的可触达市场最好定义为美国住宅转售交易工作流，而不是所有房地产科技或全部住房支出。相关支出落在四个相邻池子：经纪人获客与转介经济、解除附带条件和房屋净值过桥产品、购房按揭发放、产权与交割协调。这个边界重要，因为
              HomeLight 不暴露在住宅建造、商业地产，也不承接产权保险公司和贷款机构的完整资产负债表经济。它参与的是买卖双方把意向转成一笔完成的转售交易的环节，因此存量房周转率是主要市场量锚。


              这套工作流底下的基础设施也是共享的，并未被单一参与者垄断。NAR 和 CMLS 仍把 MLS
              定义为促进竞争的基础设施，因为它们汇总已核验挂牌数据、降低搜索成本，并把数据输送给下游经纪商、门户、贷款机构、估价和消费者体验。与此同时，门户仍控制流量、商品化展示和线索分发，这也是 Homes.com
              如此强势向挂牌经纪人营销“你的挂牌，你的线索”的原因。和解可能改变了 MLS 佣金字段里可以出现的内容，但没有消除经纪商和门户争夺消费者注意力和线索归属的需要。


              这也是经纪人匹配仍有经济意义的原因。NAR 2026 年代际和买方 / 卖方研究仍显示，交易两端都压倒性地使用经纪人。如果消费者仍聘请经纪人处理定价、谈判、融资和交割，HomeLight
              这样的市场即使从不直接触碰完整佣金堆叠，也可以有价值。市场问题因此不是“住房支出够不够大？”，而是“在仍由经纪人居中交易里，哪些渠道控制介绍、信任和工作流交接？”
