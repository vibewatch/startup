      - 公开定价 / 佣金模型
      - 包含能力
      - 折扣 / 未知项
      - 影响
    rows:
      - - HomeLight
        - 官方页面强调免费匹配；独立评测称，典型挂牌佣金仍约为 2.5%-3%，支付给 HomeLight 的转介费为 33%
        - 经纪人匹配、放款机构、搜索、现金投资者选项、BBYS、交割指导
        - 留存的官方页面没有清楚披露当前一手费用表
        - HomeLight 更靠便利性和产品覆盖宽度竞争，而不是明确省钱
      - - Zillow Premier Agent
        - 主要都市圈每次连接平均成本 $223，非主要都市圈为 $139；可选 6 个月合同
        - 线索生成、实时电话、看房、分析、ROI 报告
        - 总支出随市场和套餐变化
        - 经纪人经济性很显性，更像效果营销，而不是佣金折扣
      - - Redfin
        - 通常收取其他经纪公司一半的费用
        - 经纪服务、线上工作流、Rocket 按揭联动
        - 具体费用随市场和组合变化
        - 省钱是消费者信息的一部分，会挤压中性定价的匹配平台
      - - Clever
        - 1.5% 挂牌费；免费使用
        - 匹配全服务经纪人，并主打以省钱为中心的消费者卖点
        - 最低费用和买方返现随市场变化
        - 匹配品类里最强的纯价格挑战者
      - - Realtor.com / UpNest 平台
        - 报价市场平台和礼宾式转介；留存页面未突出费用表
        - 12 小时内给出 3-5 份报价，或介绍筛选过的经纪人
        - 留存官方材料没有清楚披露面向消费者的转介经济性
        - 开放选择能吸引想比较方案、而不是进入封闭系统的卖方
      - - Orchard
        - 留存的 Move First 页面没有简单的一句话费用
        - 释放权益、无附带条件报价、经纪人主导销售流程
        - 准确抽成率和融资经济性仍属私有
        - 套餐更偏便利性、由资本支撑，而不是低费率
      - - Flyhomes
        - 留存页面没有简单的一句话费用；宣传 5% 首付和无提前还款罚金
        - 过桥融资、合作伙伴分销、一次搬家路径、现金报价支持
        - 项目经济性取决于融资资格和合作伙伴结构
        - 靠融资灵活性和合作伙伴激励竞争
      - - Opendoor / Offerpad
        - 现金报价便利性；Offerpad 还强调透明服务费和混合路径
        - 直接出售、挂牌替代、市场平台路径、Offerpad 本地搬家权益
        - 最终经济性随房屋、维修和市场状况而变
        - 卖方确定性仍有价值，但经济性不如折扣经纪费率透明
    notes: 公开定价在推荐和折扣经纪产品里最容易比较；确定性和工作流玩家更常披露套餐，而不是准确抽成率。
