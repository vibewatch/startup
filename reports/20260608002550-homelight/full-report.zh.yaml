      - number: '7.3'
        title: 信任、隐私和运营执行风险
        blocks:
          - type: paragraph
            body: >-
              HomeLight 的公开反向记录集中在信任漏损和流程复杂度。公司隐私政策允许广泛收集、跨来源补充、定向广告投放，并与关联方、业务合作伙伴和服务提供商共享；条款授权多渠道联系；推荐更新也说明了 TCPA
              流程纪律在运营上为什么重要。独立评测与这项风险相互印证。BBB 页面同时捕捉到真实投诉基础和中等实时评分，多篇评测汇总称，用户经常抱怨持续电话、短信、邮件，或没有佣金节省。这些投诉尤其重要，因为
              HomeLight 已经不再是狭义撮合方。它现在覆盖经纪人匹配、类过桥净值释放、抵押贷款牌照、自营成交，以及 AI
              赋能的托管运营。宽度有战略吸引力，但也放大了交接。现在同一个组织需要管住营销同意、合作伙伴路由、贷款和托管时点、投诉解决，以及 AI 辅助的资金流工作流。EVA 发布让取舍更尖锐。跨 80 多种工具和 120
              多类任务自动化大部分成交工作，可能降低成本、提高吞吐，但也在文件排序、产权、HOA
              协调、贷款方接口和电汇周围制造新的故障点。对一家有可见投诉记录、并在多州持牌的公司来说，少数可重复执行错误就可能很快从支持队列变成面向监管的问题。
