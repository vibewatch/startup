  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: current-revenue-disclosure
    missingEvidence: Current 2025-2026 revenue by business line, including referral, BBYS, lender, home-loan, and closing/EVA revenue.
    whyItMatters: Without a current revenue base, the public comp framework can only bracket valuation rather than underwrite it.
    diligencePath: Request monthly revenue bridge from 2021 through the latest quarter, broken out by line and contribution margin.
    relatedQuestionRefs:
    - QV030
  - type: private-evidence-only
    severity: material
    topic: debt-and-warehouse-terms
    missingEvidence: Current debt maturity profile, warehouse-line capacity, covenants, collateral terms, and BlackRock facility documentation.
    whyItMatters: HomeLight's repeated debt use means equity value can be more sensitive to financing terms than headline revenue alone.
    diligencePath: Request debt summary schedule, covenant package, borrowing-base mechanics, and lender concentration by facility.
    relatedQuestionRefs:
    - QV029
  - type: private-evidence-only
    severity: material
    topic: bbys-loss-and-vintages
    missingEvidence: Vintage performance, loss rates, forced-purchase frequency, and margin by cohort for Buy Before You Sell and adjacent products.
    whyItMatters: Bridge-like products can look strategically valuable while still destroying equity value if losses or funding friction rise.
    diligencePath: Request quarterly BBYS cohort tables with funding cost, attach rate, pull-through, loss severity, and recovery timing.
    relatedQuestionRefs:
    - QV031
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preferences
    missingEvidence: Current cap table, liquidation preferences, participation rights, and any reliable 2025-2026 secondary pricing or tender data.
    whyItMatters: A public enterprise-value range can still misstate common-equity value if the preference stack or secondary liquidity is unfavorable.
    diligencePath: Request cap-table export, preferred terms summary, board-approved 409A, and any organized tender or secondary transaction records.
    relatedQuestionRefs:
    - QV032
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-set-coverage
    missingEvidence: Fresh revenue-plus-market-cap benchmarks for Redfin post-takeout and private workflow or title/closing peers such as Qualia.
    whyItMatters: The comparable table captures the main public reference points but still misses some transaction-software and title-workflow edge cases.
    diligencePath: Expand the comp set after obtaining stable public or private marks for closer title/closing workflow peers.
    relatedTableRefs:
    - TV004
