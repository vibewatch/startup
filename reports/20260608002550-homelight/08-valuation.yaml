- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Current revenue disappoints
    - Private diligence shows revenue materially below ~$250M or weak mix quality
    - Makes the 2022 peak mark very hard to defend and pushes value toward bear-case bands
    - Do not underwrite above the down-round-adjacent range; reset valuation to bear/base framework.
  - - Financing stress reappears
    - New debt or equity arrives on clearly weaker terms, or covenant pressure becomes visible
    - Confirms that capital is a constraint rather than a growth accelerant
    - Move to avoid or demand a steeper entry discount.
  - - Bridge / BBYS loss content rises
    - Vintage data shows loss rates, forced purchases, or pull-through deterioration
    - Shifts HomeLight closer to capital-heavy transaction comps than premium workflow comps
    - Re-rate downward and treat debt dependence as structural.
  - - EVA / closing complexity hurts quality
    - Automation growth raises defect, compliance, or customer-friction costs faster than it saves labor
    - Undercuts the premium workflow multiple needed for the bull case
    - Remove software-style upside from the model until unit economics are proven.
  notes: Kill triggers focus on evidence that would invalidate the premium-multiple thesis rather than on generic market volatility.
