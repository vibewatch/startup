- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Valuation range
  - Probability signal
  - Key downside or upside trigger
  rows:
  - - Bull
    - Revenue is comfortably above $350M, closing / EVA raises mix quality, and debt remains an enabler not a stress point.
    - $1.4B-$1.8B
    - Possible but not publicly proven
    - Requires evidence that workflow-like revenue and margins now deserve near-software comp treatment.
  - - Base
    - Revenue is near flat to modestly above the stale 2021 anchor and public-comp discounts still apply for debt and opacity.
    - $0.9B-$1.3B
    - Most credible on public evidence
    - Best fits a blended 3x-4x style range with a discount for missing revenue and financing detail.
  - - Bear
    - Housing recovery underdelivers, bridge economics are worse than expected, or another weakly priced financing appears.
    - $0.4B-$0.8B
    - Real downside if debt or credit stress emerges
    - Comparable outcome shifts toward capital-heavy transaction models rather than premium workflow names.
  notes: Scenario ranges are judgment bands rather than false-precision point estimates because no current revenue base is publicly disclosed.
