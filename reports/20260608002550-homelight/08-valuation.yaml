- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Bull argument
  - Bear counter-argument
  - What would change the view
  rows:
  - - Business breadth
    - HomeLight has expanded from referral into bridge, mortgage-adjacent, and closing workflows, which can raise wallet share.
    - The same expansion makes the model more capital-sensitive and operationally complex than a clean marketplace.
    - Show current revenue and margin by line proving newer products are accretive rather than defensive.
  - - Capital structure
    - Debt can be efficient if bridge and closing products have strong pull-through and low loss content.
    - Repeated equity-plus-debt raises suggest product expansion still leans on external capital.
    - Provide debt schedule, covenants, borrowing-base mechanics, and cash generation by product.
  - - Macro backdrop
    - NAR, Fannie, and MBA all expect more sales and originations in 2026, helping transaction volume.
    - Affordability, DTI pressure, and rate sensitivity remain high enough to restrain attach and pull-through.
    - Show cohort conversion and funded volume by rate band and borrower profile.
  - - Valuation signal
    - A value above $1.4B is plausible if revenue materially exceeds the 2021 anchor and mix shifts upward.
    - The 2024 down-round at roughly $1.06B is the fresher equity signal and may already be the market-clearing reference point.
    - Produce updated revenue, margin, and board-mark data that justify a premium to the 2024 reset.
  - - AI / closing upside
    - EVA could create workflow-like economics and justify a multiple above brokerage comps.
    - AI closing automation can still be low-margin services wrapped in debt-funded operations.
    - Disclose per-file revenue, automation savings, defect rates, and attach from referral into closing.
  notes: Rows frame the decision around what evidence would move valuation rather than around generic quality claims.
