- id: public-comp-framework-and-cycle
  title: Public comp framework and housing-cycle context
  body: The comp framework argues against reflexively carrying HomeLight at the old peak. Public real-estate and mortgage-adjacent equities cluster into two broad bands. Transaction-heavy models like Compass, Opendoor, and Offerpad trade at roughly 0.1x to 1.1x sales, reflecting low-margin brokerage economics or direct balance-sheet risk. More asset-light marketplace and workflow names such as Zillow, Rocket, and Blend sit closer to 3x sales. Redfin's last known standalone public market cap before its takeout is a reminder that consumer brokerage benchmarks can reset quickly when housing conditions weaken. HomeLight belongs somewhere between these bands because it is neither just a lead marketplace nor a pure workflow SaaS vendor. Its referral marketplace and closing automation argue for a premium to plain brokerage; its BBYS, mortgage-adjacent, and debt-backed products argue for a discount to pure software. The macro backdrop also supports caution rather than despair. NAR, Fannie Mae, and
    MBA all see more sales and more originations in 2026, but HomeLight's own lender survey still shows elevated DTI and home-equity borrowing. That means the cycle can improve volumes without eliminating affordability stress or funding sensitivity. In valuation terms, the macro tape helps the upside scenario, but it does not grant HomeLight automatic eligibility for the richer Zillow or Blend-style multiple.
