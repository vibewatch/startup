- id: scenario-range-and-recommendation
  title: Scenario range and recommendation
  body: 'The critical math is straightforward. Using the last public revenue anchor of roughly $300 million from 2021, the 2024 down-round mark implies about 3.5x revenue, while the 2022 peak implies about 5.7x. To justify $1.7 billion at 4x sales, HomeLight would need about $425 million of current revenue; at 3x it would need about $567 million. That is not impossible, but no fetched source proves anything close to it. The comp framework therefore supports a base case closer to roughly $0.9 billion to $1.3 billion: high enough to recognize that HomeLight has more product breadth than a basic referral site, but low enough to reflect cycle pressure, debt dependence, and lack of current disclosures. A bull case around $1.4 billion to $1.8 billion exists if current revenue is comfortably above the 2021 anchor and EVA plus closing attach shift the mix toward higher-multiple workflow revenue without adding credit losses or operational defects. A bear case around $0.4 billion to $0.8 billion applies
    if bridge and lending economics are weaker than the narrative implies or if the housing rebound underdelivers. That leads to a track / research-more recommendation, not a buy. Public evidence does not justify paying off the 2022 headline. Entry discipline should be tied either to a price much closer to the 2024/2026 signal band or to private diligence that can prove materially stronger economics than the public record shows.'
