companyProfile:
  summary: >-
    HomeLight is a private residential transaction platform founded in 2012 and
    now publicly centered in Scottsdale, Arizona. The company has expanded from
    agent matching into Simple Sale, Buy Before You Sell, lender distribution,
    home-loan adjacencies, and closing automation, giving it more monetization
    surfaces than a pure referral marketplace. Public evidence supports
    meaningful cumulative reach, including more than 2 million buyers and
    sellers matched and more than $1 billion of equity unlocked, but the current
    underwriting picture is still opaque: revenue, margins, headcount, and
    capital structure details remain private, while the public valuation story
    has reset meaningfully since the 2022 peak.
  foundedDate: '2012-01-01'
  founders:
    - name: Drew Uher
      role: Founder and CEO
      background: Remains the primary public face across product launches, financing updates, and company strategy.
      claimRefs: [CO013, CO017]
  foundingLocation: San Francisco, California
  headquarters: Scottsdale, Arizona
  productSummary: HomeLight sells a multi-step residential transaction workflow that combines agent matching, investor-network selling paths, Buy Before You Sell bridge and equity-unlock products, lender and mortgage surfaces, and closing-services automation.
  customerFocus: Homebuyers, sellers, partner agents, loan officers, and closing participants navigating U.S. residential resale transactions.
  businessModel: Consumers typically enter through free matching or seller/bridge workflows, while HomeLight monetizes agent referral fees and adjacent attach across bridge, lender, investor-network, and closing products.
  stage: Private
  fundingStatus: Public financing signals include the 2024 $20M Series D extension tied to Buy Before You Sell expansion and a 2026 $40M debt facility from BlackRock-managed funds for EVA; the public equity anchor appears reset below the 2022 $1.7B mark.
  disclosureProfile: private-undisclosed
  claimRefs: [CO002, CO003, CO005, CO023, CO029, CO032, CU001, CI001, CI027, CV006]
summary:
  headline: HomeLight has built a real multi-product residential transaction platform with meaningful reach and credible customer pain-point fit, but opaque current financials, capital-sensitive product mix, regulatory exposure, and a post-2022 valuation reset keep the recommendation at research-more.
  overallScore: 5.4
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: fair
