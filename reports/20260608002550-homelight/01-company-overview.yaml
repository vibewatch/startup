  evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board roster, committee structure, and any board-observer map for major investors.
    whyItMatters: Governance visibility is too weak to assess succession resilience, investor control, or oversight quality from public materials alone.
    diligencePath: Request the latest board deck, org chart, and corporate governance summary from management.
    relatedQuestionRefs:
    - QO008
    relatedTableRefs:
    - TO002
  - type: conflicting-data
    severity: material
    topic: capital-total
    missingEvidence: A reconciled cap table and debt schedule that explains how equity, debt, and extensions roll into one cumulative capital number.
    whyItMatters: Public totals range from $645 million to $762.5 million, which affects ownership, leverage, and valuation analysis.
    diligencePath: Request a financing ledger by round, security type, investor, and outstanding principal as of run date.
    relatedQuestionRefs:
    - QO016
    relatedTableRefs:
    - TO001
    - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Current revenue, run-rate, margin, and product-level monetization data for referrals, lending, and closing.
    whyItMatters: Stage, quality of growth, and valuation defensibility cannot be judged cleanly without current financial output.
    diligencePath: Request audited or board-level revenue and gross-margin reporting for 2024-2026 plus product mix.
    relatedQuestionRefs:
    - QO018
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: A current employee count with functional and geographic splits.
    whyItMatters: Operating leverage, restructuring history, and execution capacity remain hard to evaluate without current workforce data.
    diligencePath: Request HRIS headcount by function and office plus net hires since the 2022 layoff.
    relatedQuestionRefs:
    - QO019
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-map
    missingEvidence: Current ownership percentages, board rights, debt covenants, and partner concentration data for named stakeholders.
    whyItMatters: The stakeholder map is directionally useful but may understate who actually controls economics or go-to-market leverage.
    diligencePath: Request the current cap table, major commercial agreements, and debt term sheet summary.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO003
  - type: access-blocked
    severity: minor
    topic: complaints
    missingEvidence: An accessible independent complaint corpus beyond BBB, including the currently blocked ConsumerAffairs page and any regulator complaint logs.
    whyItMatters: Adverse customer evidence may be understated if one of the visible complaint surfaces cannot be reviewed fully.
    diligencePath: Review complaint portals manually in-browser and supplement with state regulator or CFPB complaint databases where applicable.
    relatedQuestionRefs:
    - QO023
