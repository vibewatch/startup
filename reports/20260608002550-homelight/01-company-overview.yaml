- id: capital-investors-and-scale-visibility
  title: Capital base, investors, and scale visibility
  body: >-
    HomeLight’s financing history is substantial and increasingly layered. Menlo Ventures led a $40 million Series B around the original agent-matching marketplace. TechCrunch then documented a $100 million Series D plus $263 million of debt in 2021 at a $1.6 billion valuation, followed by a June 2022 extension of $60 million equity and $55 million debt at a $1.7 billion valuation alongside the Accept.inc acquisition. In August 2024, HomeLight added another $20 million of equity led by Zeev Ventures, and in April 2026 it announced a fresh $40 million debt facility from BlackRock-managed funds to scale EVA.

                    The investor set looks durable, but the capital stack is not fully transparent from public sources alone. Official 2024 and 2026 company announcements list Zeev Ventures, Menlo Ventures, Group 11, Crosslink Capital, Bullpen Capital, Montage Ventures, Stereo Capital, Citi Ventures, and Google Ventures among key backers. O’Melveny separately confirmed Zeev’s leadership of the 2024 extension, and Menlo’s own 2017 post explains why it backed the seller-side marketplace model. Those sources are enough to map the core stakeholder set, but not enough to infer ownership, liquidation preferences, or board control.

                    The biggest unresolved number is cumulative capital raised. TechCrunch said HomeLight had raised $645 million after the 2022 extension; CB Insights currently says $714.6 million and labels the latest round as Debt IV; HousingWire, citing Crunchbase estimates, says $762.5 million across 15 rounds. Prime Unicorn adds a more negative capital signal by arguing the 2024 raise was priced about 38.7% below the prior D and D-1 rounds, implying roughly a $1.06 billion post-money valuation. The company’s funding history is therefore clearly real, but its exact capital base and current mark are not fully reconciled in public.
