company:
  name: HomeLight
chapter:
  number: 1
  title: Company Overview
  summary: HomeLight is a private proptech platform founded in 2012 that now spans agent matching, cash-offer and bridge-loan products, financing, and AI-enabled closing automation from a Scottsdale-centered operating footprint. Public evidence supports repeat fundraising and meaningful platform scale, but exact cumulative capital, current revenue and headcount, and board transparency remain incomplete, while 2022 layoffs and a 2024 down-round signal complicate the growth narrative.
sections:
- id: identity-products-and-operating-model
  title: Identity, products, and operating model
  body: >-
    HomeLight now presents as a broader residential-transaction platform rather than a narrow referral site. Its current homepage markets buyer- and seller-side agent matching, Simple Sale cash offers, Buy Before You Sell bridge financing, lender tools, closing support, and a HomeLight Home Loans application path. The current /home-loans URL itself now resolves into the Buy Before You Sell flow, which suggests the lending surface is being packaged with contingency-removal and equity-unlock workflows instead of as a standalone destination.

                    The clearest current corporate anchor is Scottsdale, Arizona. HomeLight’s homepage and press footer list 1375 N Scottsdale Road, while the same surfaces identify HomeLight Home Loans as a separately licensed mortgage entity at suite 125 in the same building. At the same time, the lender-specific site still carries a San Francisco footer, and official 2024 and 2026 announcements list offices in Scottsdale, San Francisco, Dallas, and Chicago. That mix supports Scottsdale as the best current headquarters read, but it also shows HomeLight still operating with multiple public-facing addresses.

                    The strongest current scale signals are operating rather than financial. HomeLight’s own 2026 announcement says it has matched more than 2 million buyers and sellers, unlocked more than $1 billion of client equity, and facilitates billions of dollars of residential transactions each year. Product pages also advertise large agent and lender networks. Those are meaningful platform indicators, but they are cumulative company claims rather than audited revenue disclosures, so later diligence should separate marketing reach from monetized transaction volume.
