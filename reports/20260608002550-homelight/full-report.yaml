  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing signals, and disclosed traction
        blocks:
          - type: paragraph
            body: >-
              HomeLight still monetizes first from the agent side, but the public record now shows a broader financial
              stack than the old “agent-match marketplace” label suggests. The cleanest posted pricing signal is in the
              help-center referral agreement page: active agreements include commission terms of either 30% or 33%. That
              is a real monetization anchor because the consumer-facing reviews still describe HomeLight as free to use
              and generally not commission-discounted; Real Estate Witch says typical listing fees remain about 2.5%-3%.
              Taken together, that implies a seller-side referral shell of roughly 0.75%-0.99% of sale price on matched
              listing transactions, before any later-stage attach. Official HomeLight pages, however, do not show
              realized take rates, partner rebates, or conversion by channel, so even this shell is only a partial view.


              The company’s newer products are marketed with certainty and affordability language rather than explicit
              price transparency. Current Buy Before You Sell pages emphasize a 0% bridge loan, up to 90% CLTV, and up
              to $2 million of equity access, while the 2024 launch release described same-day access to up to 70% of
              equity and expansion into 47 states with 40 lenders already on the platform. That shift matters: the
              current surface is optimized around borrower leverage and lender utility, not around disclosing how
              HomeLight itself gets paid. Likewise, the HomeLight Home Loans site exposes brand presence but almost no
              public economics, and the main site presents a product bundle spanning agent match, investor-network
              selling, bridge financing, lender distribution, and closing.


              EVA pushes the revenue story even further downstream. The 2026 announcement pairs a $40 million
              BlackRock-managed debt facility with a closing product that works with 80-plus tools and automates roughly
              120 escrow tasks. HomeLight also claims more than 2 million buyers and sellers matched, more than $1
              billion of equity unlocked, and billions of dollars of annual transaction volume. Those are meaningful
              traction signals, but they are cumulative company-claimed operating metrics rather than audited revenue.
              The result is a diversified revenue model on paper and an opaque one in public disclosure.
