  - id: TM001
    title: Market definition table
    columns:
      - segment/category
      - included spend
      - excluded spend
      - buyer/payer
      - relevance
    rows:
      - - Agent-matching and referral marketplace
        - Consumer acquisition, lead qualification, agent introductions, and closed-transaction referral fees
        - Full brokerage P&L, generic listing advertising, and commissions retained entirely by the servicing agent
        - Buyer or seller indirectly funds the pool through commission economics at close
        - Core legacy wedge for HomeLight and still meaningful because agent usage remains high.
      - - Seller contingency removal / bridge-equity tools
        - Bridge loans, trade-in style products, cash-offer facilitation, and equity-unlock products tied to a move
        - Permanent home-equity lending unrelated to a move and iBuyer inventory risk not borne by the platform
        - Homeowner borrower plus capital provider, usually repaid from sale proceeds or refinance
        - Directly addresses lock-in and move-up friction in a low-turnover market.
      - - Purchase mortgage origination
        - Preapproval, rate lock, underwriting, and funded purchase mortgages
        - Refinance-only servicing economics, warehouse finance, and non-housing consumer credit
        - Borrower, loan officer, and lender jointly shape the economics
        - Relevant because HomeLight spans agent demand capture into lender handoff.
      - - Title / closing workflow
        - Title search, escrow coordination, disclosure review, signatures, fraud checks, and clear-to-close operations
        - Carrier capital, county recording revenue, and unrelated legal work outside the transaction workflow
        - Lender, title agency, settlement provider, and borrower collectively fund the workflow
        - Relevant to EVA-style automation and closing orchestration.
      - - Portal lead monetization / listing distribution
        - Listing exposure, lead routing, premium placement, retargeting, and agent marketing tied to property search
        - MLS data creation itself and offline sphere/referral behavior that never touches a portal
        - Agent, brokerage, or portal marketing budget typically pays
        - Determines channel power and customer-acquisition cost for marketplaces.
      - - Status-quo substitute stack
        - Direct sphere referrals, brokerage websites, MLS search, and manual lender/title coordination
        - Not a separate spend pool; this is the incumbent alternative to a platform
        - Consumers and agents rely on existing relationships and fragmented tools
        - Shows HomeLight competes against fragmented incumbency rather than a single vendor.
    notes: >-
      Workflow boundary is narrower than “all proptech”: it includes transaction-linked revenue pools and excludes
      balance-sheet or non-transaction housing spend.
