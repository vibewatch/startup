            body: >-
              HomeLight’s economics are two-sided. Consumers are told the search experience is free, but professionals
              fund the system through referral fees and adjacent product attach. On the agent side, HomeLight publishes
              a meritocratic story: achievements and matching are supposed to come from verified performance, while
              referral quality depends on operational metrics such as speed to lead, connection rate, meeting rate,
              listing rate, and close rate. The professional promise is that better execution earns better future leads
              and access to more monetizable products. The referrals page’s Julie Wyss example suggests this can be
              economically meaningful for high performers. On the company side, that creates a reinforcing loop: more
              consumer demand generates more behavioral data, and more behavioral data can be used to rank supply. But
              it also creates pressure. The same automated outreach and performance logic that improves conversion can
              also make the product feel aggressive or spammy when customers did not expect how quickly their
