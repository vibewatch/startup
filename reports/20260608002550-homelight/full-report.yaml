  - id: TP001
    title: Competitor profile table
    columns:
      - competitor
      - category
      - scale/funding signal
      - target segment
      - differentiation
      - limitation versus HomeLight
    rows:
      - - HomeLight
        - Baseline
        - Private; broad transaction workflow but limited public financial disclosure
        - Consumers choosing agents plus later-stage financing and closing partners
        - Spans agent match, lending, cash-offer paths, and closing support
        - Does not own portal-scale traffic and public attach-rate disclosure is thin
      - - Zillow
        - Portal / referral marketplace
        - Q1 2026 revenue $708M; 220M monthly unique users
        - Agents and buyers at national search scale
        - Owns top-of-funnel traffic and monetizes agents directly
        - Consumer savings are not the core pitch and agent economics depend on paid lead spend
      - - Redfin / Rocket
        - Discount brokerage + mortgage
        - Redfin traffic plus Rocket mortgage integration and pricing incentives
        - Buyers and sellers who want a lower-fee, online-forward full-service path
        - Savings message plus integrated brokerage and mortgage
        - More captive model; less open marketplace than HomeLight or UpNest
      - - Compass
        - Full-service incumbent brokerage
        - Q1 2026 revenue $2.70B; 84,187 brokerage agents; $484M cash
        - Higher-touch sellers and agents inside a branded brokerage platform
        - Controls agent network, pre-marketing, title and escrow attach, and seller workflow
        - Less obviously consumer-discounted than Redfin or Clever
      - - Realtor.com ecosystem
        - Portal + referral marketplace
        - Move revenue $143M in fiscal Q2 2026; UpNest plus ReadyConnect
        - Home sellers and agents using open proposals or screened referrals
        - Combines audience, concierge referrals, and seller-marketplace tooling
        - Does not itself own a captive brokerage or mortgage stack
      - - Clever
        - Low-commission agent matching
        - National discount brokerage marketplace with 1.5% listing-fee pitch
        - Price-sensitive sellers who still want full-service agents
        - Makes consumer savings explicit instead of only the agent match
        - Less product breadth beyond the agent intro
      - - Orchard
        - Bridge / power-buyer marketplace
        - 40% 2025 revenue growth and $30M 2026 funding
        - Move-up sellers who need equity unlock and a guided resale
        - Move First plus open-marketplace positioning
        - Private economics and loss rates remain undisclosed
      - - Flyhomes
        - Partner-distributed power buyer
        - 30,000+ loan officers; $15M Series D; $200M warehouse line
        - Loan-officer- and agent-led buy-before-you-sell use cases
        - Large partner channel and financing specialization
