companyProfile:
  summary: >-
    HomeLight is a private residential transaction platform founded in 2012 and now publicly centered in Scottsdale,
    Arizona. The company has expanded from agent matching into Simple Sale, Buy Before You Sell, lender distribution,
    home-loan adjacencies, and closing automation, giving it more monetization surfaces than a pure referral
    marketplace. Public evidence supports meaningful cumulative reach, including more than 2 million buyers and sellers
    matched and more than $1 billion of equity unlocked, but the current underwriting picture is still opaque: revenue,
    margins, headcount, and capital structure details remain private, while the public valuation story has reset
    meaningfully since the 2022 peak.
