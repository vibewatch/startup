      - number: '2.2'
        title: Housing turnover, affordability, and buyer/seller pain
        blocks:
          - type: paragraph
            body: >-
              The 2026 housing backdrop is improving at the margin but still tight enough to suppress transaction
              volume. NAR's April 2026 report put existing-home sales at a 4.02 million seasonally adjusted annual rate,
              with 1.47 million homes on the market and a 4.4-month supply. Realtor.com's full-year outlook is only
              modestly better at 4.13 million sales, while earlier late-2025 NAR commentary implied a sharper rebound.
              The practical takeaway is that HomeLight still operates in a low-turnover market relative to historical
              norms, even if inventory has recovered enough to shift negotiating power somewhat toward buyers.


              Affordability has improved, but mostly from very stressed levels. NAR said the April 2026 Housing
              Affordability Index rose to 110.6 from 101.4 a year earlier, and Realtor.com expects the typical mortgage
              payment to slip below 30% of median income in 2026. Yet mortgage rates are still anchored in the low-6%
              range, and Redfin's FHFA-based lock-in analysis shows 85.7% of mortgaged homeowners still sit below 6%.
              That makes many owners economically reluctant to sell and rebuy, which directly limits the supply of
              potential HomeLight transactions.


              Consumer pain is also split by balance sheet. NAR's 2026 buyer and seller work shows first-time buyers
              fell to just 21% of purchasers, while baby boomers represented 42% of buyers and 55% of sellers. Younger
              households continue to cite affordability, rent, and student-loan burdens, whereas equity-rich existing
              owners remain the group most able to move. For HomeLight, that is a strong signal that seller-side
              certainty tools, bridge financing, and down-payment or preapproval support are not optional adjacencies;
              they are responses to the core frictions still defining residential turnover.
