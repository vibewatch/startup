      - number: '7.2'
        title: Capital, housing-cycle, and product-structure risk
        blocks:
          - type: paragraph
            body: >-
              The second major risk is that HomeLight has layered lending-like products and closing automation onto a
              market that is still rate-sensitive and affordability constrained. Buy Before You Sell is attractive
              because it helps households unlock equity, remove contingencies, and move before selling, but the
              help-center materials also reveal why the product is operationally delicate: fees vary by program path,
              leverage can reach 90% CLTV, funds are wired into purchase escrow before the old home is sold, and
              HomeLight can end up purchasing the departing home if it fails to sell within 120 days. That makes the
              business dependent on capital availability, disciplined underwriting, and accurate property/liability
              assumptions. Company-specific financing history reinforces that exposure. HomeLight cut 19% of staff in
              2022 in the middle of a mortgage downturn, accepted a clearly weaker 2024 round, and then added fresh 2026
              debt financing from BlackRock to scale EVA. None of those events alone proves distress, but together they
              show a business that has already needed to resize and refinance around a weaker transaction market. Even
              the macro base case is only moderately supportive: Fannie Mae expects lower rates and more originations,
              but NAR and NAHB still describe affordability and first-time-buyer pressure as structural drags. For
              HomeLight, that means BBYS, loans, and closing attach may improve in a better tape without becoming immune
              to renewed volume or credit stress.
