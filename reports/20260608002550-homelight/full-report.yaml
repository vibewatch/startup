    layout: wide
    summary: >-
      Bull, base, and bear valuation bands for HomeLight on public evidence, with the 2022 peak and 2024 reset informing
      the midpoint rather than dictating it.
    data:
      items:
        - label: Bear case valuation ($B)
          low: 0.4
          mid: 0.6
          high: 0.8
          displayValue: $0.4B-$0.8B
          detail: >-
            Cycle and debt risk dominate; bridge and closing economics look more capital-heavy than premium
            workflow-like.
          tone: negative
        - label: Base case valuation ($B)
          low: 0.9
          mid: 1.1
          high: 1.3
          displayValue: $0.9B-$1.3B
          detail: Revenue roughly held or modestly exceeded the stale 2021 anchor; blended multiple with opacity discount.
          tone: neutral
        - label: Bull case valuation ($B)
          low: 1.4
          mid: 1.6
          high: 1.8
          displayValue: $1.4B-$1.8B
          detail: >-
            Requires materially stronger current revenue and proof that EVA plus closing attach deserve near-workflow
            multiples.
          tone: positive
    approximationNotes: >-
      Ranges are scenario bands, not point estimates; no private diligence inputs or preference-stack adjustments are
      included.
    claimRefs:
      - CV032
      - CV033
      - CV034
      - CV051
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: compact
    summary: >-
      IC-style scoring emphasizes real product breadth and improving macro, but penalizes valuation support, capital
      intensity, and evidence quality.
    data:
      items:
        - label: Business breadth
          value: High
          detail: >-
            Referral, bridge, mortgage-adjacent, and closing workflows create more optionality than a single marketplace
            fee stream.
        - label: Macro support
          value: Medium
          detail: 2026 should improve sales and originations, but affordability and DTI stress remain material.
        - label: Capital intensity
          value: High
          detail: Repeated equity-plus-debt financing and BBYS exposure keep funding risk central to valuation.
        - label: Comp support
          value: Medium-Low
          detail: Public comps support a blended range closer to the 2024 reset than the 2022 peak.
        - label: Evidence quality
          value: Low
          detail: Current revenue, margin, debt terms, and preference stack are still not public.
        - label: Decision fit
          value: Track
          detail: Price discipline and private diligence matter more here than another round of narrative sourcing.
    claimRefs:
      - CV017
      - CV027
      - CV037
      - CV039
      - CV040
      - CV050
