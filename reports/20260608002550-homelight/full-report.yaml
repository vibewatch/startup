      - number: '5.2'
        title: Operating architecture and technical evidence
        blocks:
          - type: paragraph
            body: >-
              The best public technical evidence is operational rather than deeply architectural. Help-center workflows
              show that BBYS underwriting moves through lender submission, questionnaire and photo collection,
              pre-approval, document upload, and fund wiring, with the lender portal exposing each stage. Equity Boost
              adds another layer: HomeLight can increase usable equity through a no-draw HELOC on the incoming residence
              or proof-of-assets support, but that requires classic mortgage documentation such as the 1003, 1008, Clear
              to Close documentation, credit and income files, and recent statements. That is a real underwriting stack,
              not a simple marketing widget.


              Closing Services extends the stack into escrow operations. Agents open orders from the portal using a
              constrained set of required fields, then manage tasks, progress, documents, and counterparties while an
              Escrow Officer works the file. EVA is the clearest productized technical anchor in the chapter: HomeLight
              says the AI escrow agent works with more than 80 tools, automates most of roughly 120 closing tasks, and
              touches lenders, HOAs, government offices, document ordering, and fund movement. Those claims read like
              workflow automation over a partner-rich operating graph, not like a pure self-serve SaaS feature.


              There is also evidence that HomeLight still maintains a software instrument panel around the network. The
              referral-metrics mobile surface, Greenhouse openings, RealSynch integration page, and privacy policy all
              point to an ecosystem with identity, analytics, CRM sync, portal instrumentation, and a mobile layer. What
              is missing is the kind of public developer portal, uptime history, or engineering documentation that would
              let an outsider assess reliability the way they could for a more open infrastructure company.
