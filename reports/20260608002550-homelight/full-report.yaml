      - number: '1.2'
        title: Leadership, governance, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Drew Uher still anchors HomeLight’s public identity. He is named as founder and chief executive in current
              official announcements and in third-party executive databases, and his voice carries the company’s
              product, financing, and strategy narrative across the 2024 Buy Before You Sell expansion and the 2026 EVA
              launch. Craft’s executive roster gives the clearest current public look below the CEO layer, naming
              operational, finance, technology, homes, and closing-services leaders.

                              Governance transparency is weaker than product transparency. The reviewed official HomeLight pages provide products, contact information, careers content, and press materials, but they do not publish a current board roster, committee structure, or clear control map. Investors such as Zeev Ventures, Menlo Ventures, and Group 11 are repeatedly named in official financing materials, which strongly implies continued investor influence, but the public record reviewed here does not make those governance rights legible enough to treat them as settled facts.

                              The practical diligence implication is key-person dependence. Uher appears central not only to original founder-market fit, but also to capital formation, product direction, and the company’s current AI-closing expansion thesis. HomeLight does not look like a one-person company operationally, yet the public record still relies disproportionately on a single founder-CEO and a partially visible executive bench. That makes succession planning, board oversight, and business-line accountability material follow-ups.
