      - number: '4.2'
        title: Unit economics proxies, transaction-volume anchors, and cost structure
        blocks:
          - type: paragraph
            body: >-
              HomeLight’s public unit-economics picture is a mix of one old revenue anchor, a few transaction proxies,
              and a lot of inference. TechCrunch reported that management expected annual revenue above $300 million in
              2021, and the same reporting said Trade-In and Cash Offer had grown more than 700% since launch. In 2022,
              TechCrunch added that HomeLight and Accept represented more than $3 billion of combined referred
              transaction volume in Q1 2022 and that Cash Offer alone had seen 500% year-over-year transaction-volume
              growth by April 2022. Those disclosures are directionally useful: they show the company had real volume
              and real monetization before the post-2022 housing slowdown. But they are historical. HomeLight has not
              since updated public revenue, gross margin, EBITDA, or revenue mix, so no one outside the company can tell
              whether newer products are accretive or simply volume-preserving.


              The structure of the model points to at least two very different economic engines. Referral revenue is
              collected from agent commissions after close and is therefore probably much lighter on capital than
              certainty products. Buy Before You Sell, by contrast, is marketed as a 0% borrower bridge product that
              removes contingencies and reduces DTI. That almost certainly means HomeLight needs to earn elsewhere in
              the transaction — through attached financing, partner economics, closing revenue, or some other
              undisclosed monetization path — because the public pages do not present an interest-spread story. EVA
              hints at a third engine: software-like or services-like closing revenue that could improve labor
              productivity by automating 120 tasks, but again the company discloses no public price card or margin
              profile.


              Public comparables show what those adjacent businesses can look like when disclosed. Zillow’s Q1 2026
              filings show a large attach model with $708 million of revenue, including $64 million of mortgage revenue
              and $1.5 billion of purchase originations, backed by $788 million of cash and investments. Compass
              discloses integrated brokerage economics with $2.70 billion of revenue, $484 million of cash, and more
              than 30,000 title-and-escrow transactions in a single quarter. Opendoor shows the opposite lesson:
              certainty products can drive $720 million of quarterly revenue and still lose $173 million when inventory
              and margin discipline are not strong enough. Offerpad’s release is useful because it highlights a more
              capital-light mix shift: referral volume exceeded full-year 2025 in Q1 2026, and Renovate carries 20%-30%
              margins. Read together, those comps imply that HomeLight’s later-stage monetization can be valuable, but
              only if the company manages capital intensity, partner attach, and workflow productivity better than the
              public record currently proves.
