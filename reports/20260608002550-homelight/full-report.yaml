  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and decision drivers
        blocks:
          - type: paragraph
            body: >-
              HomeLight’s customer base is broader than a single homeowner clicking a match form. On the consumer side,
              the company serves sellers who want an agent quickly, buyers who want local guidance, homeowners who want
              a cash-offer or investor route, and households that need to buy before they sell. On the professional
              side, it serves partner agents, loan officers, and closing teams who use HomeLight as a lead source or
              execution layer. The common decision driver on the consumer side is convenience and certainty: fast agent
              comparison, a no-obligation starting point, and ways to remove timing stress from a move. Price is notably
              weaker as a decision driver. Independent reviewers repeatedly say HomeLight is free to try but usually
              routes consumers to standard-commission agents, which makes the product strongest for people optimizing
              for speed, local expertise, or optionality instead of lowest fees. That split matters because it explains
              both customer traction and a core pricing risk.
