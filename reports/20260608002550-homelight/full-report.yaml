      - number: '8.4'
        title: Diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The remaining work is private-evidence work. A credible investment decision needs current revenue by line,
              gross margin, BBYS cohort performance, debt and warehouse terms, and the preference stack. Without those
              datasets, the investor is choosing between stories rather than underwriting a balance of probabilities.
              The story that can move the recommendation up is clear: HomeLight proves that revenue held or
              reaccelerated after 2021, that newer closing and mortgage workflows improve mix rather than just consume
              capital, and that debt remains an enablement tool rather than a crutch. The story that breaks the thesis
              is equally clear: another weakly priced financing, bridge-loss or covenant stress, or evidence that
              EVA/closing growth adds complexity faster than it adds margin. Because the public record shows both a real
              product stack and a real down-round, diligence should focus on falsifying the premium case first. If the
              company cannot show durable revenue, manageable funding terms, and acceptable economics in bridge and
              closing, the right conclusion is not that the business lacks value. It is that the public market analogue
              sits closer to the 2024 reset than to the 2022 peak.
            claimRefs:
