      - number: '1.4'
        title: Milestones and adverse signals
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows a clear platform expansion path. HomeLight started with agent matching, brought
              in Menlo through the 2017 Series B, entered mortgage lending with the Eave acquisition in 2019, launched
              Trade-In and Cash Offer in early 2020, added Disclosures.io later that year, and used the 2022 Accept.inc
              deal to deepen agent-focused cash offers. The 2024 Buy Before You Sell expansion and the 2026 EVA launch
              extend that same pattern: HomeLight keeps moving downstream into financing, coordination, and closing
              rather than staying only in top-of-funnel lead generation.

                              The same timeline also preserves the most material adverse evidence. RealTrends and The Real Deal both reported that HomeLight cut 19% of its workforce in June 2022 shortly after announcing new financing, a reminder that capital access did not insulate the company from the mortgage-market downturn. Prime Unicorn’s 2024 down-round estimate points to valuation compression, and complaint surfaces at BBB and ConsumerAffairs indicate that dissatisfied-customer evidence exists even if the public corpus is uneven and, in ConsumerAffairs’ case, partly blocked by anti-bot controls.

                              A final chapter-1 read-through is that HomeLight is still operating in an affordability-stressed market where equity-unlock and financing tools matter. HousingWire’s 2026 coverage of the company’s lender survey shows strong borrower demand for down-payment assistance and more lender concern about foreclosures. That context does not belong in full market analysis yet, but it helps explain why HomeLight is still investing in bridge-loan, lending, and closing products despite a shakier post-2021 capital environment.
