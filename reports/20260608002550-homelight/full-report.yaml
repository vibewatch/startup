      - - AI / closing upside
        - EVA could create workflow-like economics and justify a multiple above brokerage comps.
        - AI closing automation can still be low-margin services wrapped in debt-funded operations.
        - Disclose per-file revenue, automation savings, defect rates, and attach from referral into closing.
    notes: Rows frame the decision around what evidence would move valuation rather than around generic quality claims.
