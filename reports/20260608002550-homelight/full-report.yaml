  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Diligence path
    rows:
      - - Current revenue by line
        - Latest quarterly and monthly revenue split across referral, BBYS, lender, loans, and closing
        - Anchors every valuation scenario and tests whether the company has held or exceeded the 2021 revenue base
        - Request management reporting package and line-item bridge from 2021 to the latest quarter.
      - - Gross margin and attach economics
        - Margin by line plus attach from marketplace into financing and closing
        - Determines whether HomeLight deserves workflow-like or transaction-like multiples
        - Request contribution-margin waterfall and attach-rate cohorts by source channel.
      - - BBYS vintage performance
        - Loss rates, forced-purchase frequency, funding cost, and recovery timing by cohort
        - Tests whether capital-backed convenience products add or destroy equity value
        - Pull cohort data from underwriting, servicing, and finance teams.
      - - Debt, warehouse, and covenant package
        - Facility size, maturity, collateral terms, and lender concentration
        - Repeated debt use means financing risk can dominate equity value in weak markets
        - Review debt documents, covenant model, and borrowing-base calculations.
      - - Cap table and preferences
        - Current preferred-stack terms, liquidation preference, and any reliable secondary price discovery
        - Enterprise-value intuition can materially overstate common-equity value when preference overhang is large
        - Request current cap-table export, 409A, and all preferred term sheets.
    notes: These asks are ordered by what would most quickly sharpen price discipline for a new investor.
    claimRefs:
      - CV037
      - CV041
      - CV050
