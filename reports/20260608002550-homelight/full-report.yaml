    automation.
  customerFocus: >-
    Homebuyers, sellers, partner agents, loan officers, and closing participants navigating U.S. residential resale
    transactions.
  businessModel: >-
    Consumers typically enter through free matching or seller/bridge workflows, while HomeLight monetizes agent referral
    fees and adjacent attach across bridge, lender, investor-network, and closing products.
