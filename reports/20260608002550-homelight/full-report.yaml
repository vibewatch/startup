  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation credibility and financing context
        blocks:
          - type: paragraph
            body: >-
              HomeLight's valuation story is easiest to understand as a sequence of increasingly mixed signals rather
              than a single clean mark. In 2021 the company could plausibly support a premium private valuation
              narrative: it raised $363 million of new capital, including $100 million of Series D equity and more than
              $263 million of debt, and TechCrunch reported that revenue was expected to exceed $300 million that year.
              In 2022 the company extended the round with another $60 million of equity and $55 million of debt,
              acquired Accept.inc, and nudged the mark up to $1.7 billion. If that had been followed by a fresh 2024 or
              2025 up-round, investors could still treat $1.7 billion as the anchor. But that is not what the public
              record shows. The next equity signal was a $20 million August 2024 Series D-2 that Prime Unicorn
              explicitly called a down round at roughly $1.06 billion post-money, while Business Wire syndication and
              O’Melveny framed the raise as targeted support for Buy Before You Sell expansion rather than a
              company-wide re-rating. The 2026 financing signal was also not equity. EVA came with $40 million of
              BlackRock-managed debt, which matters because it supports scale but does not reset the share price. Put
              differently: the last $1.7 billion mark is real history, but it is stale history. The more recent public
              evidence points to a company still broadening its product stack while leaning on external capital and
              accepting a lower equity reference point in a tougher housing tape.
            claimRefs:
