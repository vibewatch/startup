        - NAR, Fannie, and MBA all expect more sales and originations in 2026, helping transaction volume.
        - Affordability, DTI pressure, and rate sensitivity remain high enough to restrain attach and pull-through.
        - Show cohort conversion and funded volume by rate band and borrower profile.
      - - Valuation signal
        - A value above $1.4B is plausible if revenue materially exceeds the 2021 anchor and mix shifts upward.
        - >-
