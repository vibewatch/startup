  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and channel infrastructure
        blocks:
          - type: paragraph
            body: >-
              HomeLight's addressable market is best defined as the U.S. residential resale transaction workflow rather
              than as all proptech or all housing spend. The relevant spend sits in four adjacent pools: agent
              acquisition and referral economics, contingency-removal and equity-bridge products, purchase-mortgage
              origination, and title/closing coordination. That boundary matters because HomeLight is not exposed to
              homebuilding, commercial real estate, or the full balance-sheet economics of title insurers and lenders.
              It participates where buyers and sellers convert intent into a completed resale, and that means turnover
              in the existing-home market is the primary market-volume anchor.


              The infrastructure underneath that workflow is also shared, not monopolized by any single actor. NAR and
              CMLS continue to frame MLSs as procompetitive infrastructure because they compile verified listing data,
              lower search costs, and feed downstream broker, portal, lender, appraisal, and consumer experiences. At
              the same time, portals still control traffic, merchandising, and lead routing, which is why Homes.com now
              markets "Your Listing, Your Lead" so aggressively to listing agents. The settlement may have changed what
              can appear inside MLS compensation fields, but it did not remove the need for brokers and portals to
              compete for consumer attention and lead ownership.


              That structure is why agent matching remains economically relevant. NAR's 2026 generational and
              buyer/seller research still shows overwhelming agent usage on both sides of the transaction. If consumers
              still hire agents to navigate pricing, negotiation, financing, and closing, a marketplace like HomeLight
              can matter even when it never touches the full commission stack directly. The market question is therefore
              less "is there enough housing spend?" and more "which channels control introductions, trust, and workflow
              handoffs during a still-agent-mediated transaction?"
