      - number: '3.4'
        title: >-
          HomeLight’s differentiation is real, but the strongest moats still sit with traffic owners and integrated
          incumbents
        blocks:
          - type: paragraph
            body: >-
              The durable takeaway from this chapter is that HomeLight is more differentiated on breadth than on
              control. It does have a legitimate strategic shape: a user can begin with an agent match, move into
              financing or equity unlock, and continue into closing support. That is broader than Clever, UpNest, or
              Zillow Premier Agent alone, and it is also less balance-sheet-intensive than trying to win the market
              purely as an iBuyer. But breadth is not the same thing as defensibility. Zillow, Redfin/Rocket, Compass,
              and Realtor.com all own either more audience, more direct brokerage leverage, or more disclosed capital to
              keep improving their bundle.


              Switching dynamics make this especially important. In top-of-funnel referral, buyers and agents can
              multi-home with minimal friction, so price clarity and brand habit matter disproportionately. In bridge,
              mortgage, and closing workflows, switching costs rise because capital lines, integrations, and partner
              training matter more, but specialist vendors and vertically integrated incumbents are already crowding
              those layers. Public durability also tilts away from HomeLight: Zillow, Compass, and Move/Realtor.com can
              show current revenue and cash-scale evidence, while private niche players reveal durability only through
              selective funding announcements. The result is a nuanced judgment. HomeLight is not boxed into a single
              fragile wedge, but it is still exposed wherever traffic owners, low-fee matchmakers, or integrated
              brokerage-finance stacks can copy enough of the workflow while controlling the customer relationship
              better than HomeLight does today.
