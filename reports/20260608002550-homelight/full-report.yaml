      - number: '4.3'
        title: Capital structure, debt dependence, and housing-cycle exposure
        blocks:
          - type: paragraph
            body: >-
              The financing chronology from chapter 1 becomes more important in a financials chapter because it reveals
              how often HomeLight has needed both equity and debt to keep expanding. In 2021 the company raised $100
              million of equity and $263 million of debt at a $1.6 billion valuation. In 2022 it added another $60
              million of equity and $55 million of debt at a $1.7 billion valuation, with management explicitly saying
              the raise was meant to play offense and defense while weathering uncertainty. In 2024 HomeLight added $20
              million more of equity to expand Buy Before You Sell, and in 2026 it added another $40 million of debt
              from BlackRock-managed funds to scale EVA. That pattern is not a one-off bridge; it is repeated evidence
              that HomeLight’s product set pulls on external capital beyond a simple software or referral-network
              working-capital profile.


              The adverse evidence reinforces that point. TechCrunch reported that management was watching burn closely,
              slowing hiring, and prioritizing profitability and runway in 2022. Within days of that financing,
              RealTrends and The Real Deal reported a workforce reduction, showing that fresh capital did not eliminate
              the need for cost control. Prime Unicorn later estimated the 2024 extension was a down round at roughly a
              $1.06 billion post-money mark, about 38.7% below the prior D and D-1 pricing. None of those sources by
              itself proves distress in 2026, but together they show that HomeLight has already had to adjust costs and
              accept less flattering capital signals during a weak transaction market.

              The macro backdrop still looks unforgiving for a company tied to mortgage-sensitive household moves.
              HomeLight’s own Q3 2025 lender survey said 80% of lenders saw higher consumer DTI and 81% saw more
              borrowing against home equity. HousingWire’s 2026 coverage of the company’s Q2 lender survey added that
              33% of borrowers ask about down-payment assistance, 45% ask about zero-down programs, and 42% of lenders
              expect higher foreclosures. Those are exactly the conditions that make bridge-loan, lender-attach, and
              closing products strategically relevant — but they are also the conditions that can increase credit
              stress, lower transaction certainty, and raise funding costs. Without public cash, covenant, or
              warehouse-line disclosure, HomeLight’s true capital adequacy remains a diligence question rather than a
              public fact.
