- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - HomeLight solution
  - Measurable benefit claim
  - Limitation / bottleneck
  rows:
  - - Find the right listing agent
    - Consumer enters lead and HomeLight routes to ranked agents
    - Agent Matching weighs transaction history, fit, reviews, response speed, and past HomeLight success
    - Faster ranking and higher-quality matches than an undifferentiated directory
    - Quality still depends on agents responding quickly and maintaining portal hygiene
  - - Sell quickly without full listing friction
    - Seller enters address and explores estimated offer
    - Simple Sale compares top agents and investor buyers in one intake flow
    - Certainty path exists without forcing the homeowner to skip agent comparison
    - Public pages do not disclose investor win rates or fee realization
  - - Buy next home before selling current one
    - Approve current property, make non-contingent offer, move, then sell old home
    - BBYS removes home-sale contingency and stages the old-home disposition around a 21-day and 120-day timeline
    - HomeLight claims 24-hour approval and better sale conditions for a vacant home
    - Workflow breaks if valuation, docs, or eventual home sale do not cooperate
  - - Unlock more equity for down payment or prep
    - Borrower needs more proceeds than base BBYS unlock
    - Equity Boost adds HELOC and proof-of-assets options up to 90% CLTV
    - Can increase purchase power without waiting to sell the old residence
    - Requires more documentation, higher underwriting complexity, and potential shortfall handling
  - - Run a closing file inside the platform
    - Agent opens order and tracks file status in portal
    - Closing Services centralizes tasks, progress, documents, people, and escrow-officer communication
    - Fewer email-only handoffs and better visibility into next steps
    - No public SLA or defect-rate evidence for the workflow
  - - Automate repetitive closing work
    - Escrow file requires ordering docs, coordinating parties, and moving funds
    - EVA automates much of the file across 80+ tools and 120 tasks
    - HomeLight claims order opening in minutes instead of hours and less manual input
    - No public audit of accuracy, exception handling, or fallback procedures
  notes: Benefits are company-claimed or inferred from live workflow docs; no independent cohort study was found for conversion, approval speed, or close-quality outcomes.
