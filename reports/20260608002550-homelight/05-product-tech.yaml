- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Key dependency
  - Risk
  rows:
  - - Agent-ranking and portal instrumentation
    - Ranks referral recipients and tracks conversion behavior
    - Verified transaction history, portal events, mobile metrics, and referral-stage updates
    - Lead quality degrades if signal quality is weak or agent behavior goes stale
  - - Consumer / seller intake surfaces
    - Capture addresses, offer interest, and buy-before-sell submissions
    - Web forms, questionnaires, photos, and centralized routing logic
    - Low-friction intake can mask downstream underwriting or ops complexity
  - - BBYS underwriting engine
    - Approves property, borrower, and equity-unlock amount
    - Valuation inputs, photos, 1003/1008 data, Clear to Close package, credit and income docs
    - Approval speed and loss outcomes depend on document quality and disciplined underwriting
  - - Lender portal and funding workflow
    - Moves deals from submission through clear-to-fund and completion
    - Portal stage logic, lender relationship management, wire operations, and escrow coordination
    - Pipeline stalls if counterparties miss documents, signatures, or funding windows
  - - Closing Services and EVA orchestration
    - Runs escrow tasks, party coordination, document ordering, and fund movement
    - Escrow officers, 80+ tools, lenders, HOAs, government offices, and AI automation
    - Automation or integration failure can create closing delays, errors, or manual rework
  - - Identity, analytics, and partner integration layer
    - Supports SSO, instrumentation, CRM sync, and lead/transaction data sharing
    - Google-based identity or analytics tools, Hotjar, RealSynch, and partner CRMs
    - Vendor changes or privacy constraints can weaken attribution, workflow sync, or agent visibility
  notes: Architecture is reconstructed from workflow docs, privacy disclosures, partner integrations, and jobs rather than from a formal public system diagram or API reference.
