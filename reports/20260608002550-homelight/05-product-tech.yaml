summary: 'HomeLight''s public product surface now spans agent ranking, investor-network selling, move-before-sell financing, mortgage licensing, and AI-assisted closing rather than a single referral marketplace. The product breadth is real, but the hardest proof points remain private: BBYS credit economics, EVA productivity, and the reliability controls behind HomeLight''s underwriting and closing operations.'
sections:
- id: core-products-and-user-workflows
  title: Core products and customer workflows
  body: |-
    HomeLight no longer looks like a single-purpose “find an agent” lead site. The current public surface shows a transaction stack that starts with data-backed agent matching, branches into either agent-led listing or Simple Sale investor routing, extends into Buy Before You Sell financing, and then reaches into mortgage and closing execution. On the agent side, HomeLight's own help content makes clear that match quality is not static marketplace inventory: the ranking system continuously rewards speed to lead, stage hygiene, and prior HomeLight conversion success. That means the product is partly software and partly behavior management of the agent network.

    Simple Sale is the cleanest example of HomeLight preserving optionality rather than forcing one workflow. The seller-facing page combines “top real estate agents” with the investor network in one intake flow, so HomeLight can route a homeowner toward certainty or toward a conventional listing depending on fit. Buy Before You Sell goes further by turning HomeLight into a move coordinator. Public BBYS docs show an approve-offer-move-sell sequence, public fee schedules, hard timing gates, and explicit backup-offer mechanics if the departing residence does not sell in time. The product is not just a bridge-loan headline; it is a tightly sequenced operating workflow with underwriting, listing execution, and closing dependencies.

    Home Loans and Closing Services turn the company into a downstream attach platform. Licensing pages show mortgage-lending presence, while help-center material shows agents opening and monitoring closing orders inside a HomeLight portal. In effect, HomeLight is trying to monetize multiple transaction steps with one software-and-services envelope rather than handing the customer off after the first referral.
