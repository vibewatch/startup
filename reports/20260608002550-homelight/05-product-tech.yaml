- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Current maturity / status
  - Differentiation
  - Diligence gap
  rows:
  - - Agent Matching + referral ranking
    - Buyers, sellers, agents
    - Established production marketplace with portal instrumentation
    - Data-backed ranking plus speed-to-lead and stage-discipline feedback loops make supply quality partly algorithmic, not only directory based
    - Need conversion by cohort, match acceptance rates, and referral monetization by channel
  - - Simple Sale investor routing
    - Sellers
    - Established consumer-facing intake and investor-network path
    - Hybrid route preserves both investor certainty and agent comparison instead of forcing a single sale mode
    - Need cash-buyer coverage, take-rate mechanics, and attach rate into other HomeLight products
  - - Buy Before You Sell core program
    - Agents, lenders, borrowers
    - Scaled production workflow with public timelines, fees, eligibility, and portal stages
    - Combines equity unlock, contingency removal, timed listing discipline, and backup-offer logic in one flow
    - Need approval-to-close funnel, fallout rates, and performance by geography or partner cohort
  - - Equity Boost / HELOC + assets layer
    - Loan officers, borrowers
    - Production add-on to BBYS with documented inputs and conditions
    - Extends financing power through HELOC or proof-of-assets rather than a single static bridge structure
    - Need funding source, utilization rates, shortfall frequency, and realized economics
  - - HomeLight Home Loans
    - Borrowers, loan officers
    - Licensed operating surface with sparse public product detail
    - Mortgage licensing and attach potential let HomeLight keep economics inside the transaction rather than only referring out
    - Need current borrower journey, pricing, servicing model, and attach from BBYS or agent-match traffic
  - - Closing Services / EVA
    - Agents, escrow officers, lenders
    - In-market closing workflow plus 2026 AI automation launch
    - In-house closing plus AI workflow automation can compress handoffs that competitors often leave to third parties
    - Need post-launch productivity, defect rate, and customer adoption by market
  notes: Public module map is partial and built from live product pages, help-center workflows, jobs, and the 2026 EVA launch release rather than a formal product catalog.
