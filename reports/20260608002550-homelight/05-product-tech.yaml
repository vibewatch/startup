  title: Trust / quality / compliance table
  columns:
  - Control / requirement
  - Current status
  - Scope
  - Why it matters
  - Gap
  rows:
  - - Referral TCPA and transaction-level fee changes
    - Live since 2025 per help-center terms update
    - Agent lead intake, communications, and referral charging
    - Lead engine monetization has direct compliance exposure, not just sales-policy exposure
    - No public monitoring or enforcement metrics disclosed
  - - NMLS and state mortgage licensing
    - 'Live with NMLS #1529229 and broad multi-state licensing list'
    - HomeLight Home Loans origination and servicing perimeter
    - Licensing turns Home Loans into a regulated product surface rather than a soft lead handoff
    - Sparse public product detail leaves actual borrower workflow opaque
  - - TRID and Closing Disclosure requirements
    - Current federal mortgage-compliance baseline
    - Loan Estimate, Closing Disclosure, fee review, timing, and origination exams
    - Disclosure timing constrains underwriting and closing operations
    - No public evidence of HomeLight-specific control implementation
  - - Escrow administration requirements
    - Current and reinforced by 2026 OCC rule
    - Escrow accounts, fee judgment, and operational risk management
    - Closing and lender products depend on disciplined escrow handling and lawful fee design
    - No public detail on HomeLight's escrow controls, reserves, or audit program
  - - Privacy, payments, and data governance
    - Current privacy policy covers app, services, Stripe processing, tracking, and settlement data use
    - Consumer, agent, lender, and closing data across the platform
    - Sensitive financial and closing data flows through HomeLight's stack and partners
    - No public model-governance, incident-history, or vendor-control package surfaced
  - - In-house closing process knowledge
    - Company-claimed strength
    - Escrow officers, tasks, progress, documents, and party coordination
    - Same-system knowledge may reduce handoff friction in BBYS closings
    - No public benchmark proves better outcomes than external title or eClose vendors
