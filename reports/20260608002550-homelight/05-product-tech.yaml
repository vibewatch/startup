- id: trust-compliance-and-operational-bottlenecks
  title: Trust, compliance, and operational bottlenecks
  body: |-
    Trust and compliance sit directly inside HomeLight's product workflow. On the customer-acquisition side, referral agreements were updated for TCPA compliance and transaction-level fee logic, which means the lead engine itself is governed by communications and compensation rules. On the financing side, state licensing and NMLS disclosure show that HomeLight Home Loans is not just a soft referral concept; it sits inside a regulated mortgage perimeter. The privacy policy adds another layer by showing that HomeLight handles mobile-app and web data, uses third-party payment processing, and collects settlement-related information that title or closing workflows may need.

    The regulatory overlay around lending and closing is heavy. CFPB and FDIC materials point to TRID, Closing Disclosure timing, ATR/QM, RESPA, SAFE Act, servicing, flood, and escrow requirements as core mortgage-control surfaces, while the OCC's 2026 escrow rule underscores how much operational judgment lives inside escrow administration. That means HomeLight's execution risk is not just software uptime; it is also whether underwriting, disclosures, fund movement, and document handling stay within regulated tolerances.

    The bottlenecks therefore show up where public evidence is most concrete: valuation and document collection at underwriting, agent responsiveness and stage discipline in the supply network, and closing coordination across lenders, HOAs, government offices, and escrow officers. HomeLight can simplify the consumer narrative, but it cannot eliminate the operational choke points that sit behind a financed move-before-sell transaction.
