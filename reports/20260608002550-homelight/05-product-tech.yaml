  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: closing-automation-metrics
    missingEvidence: File-level EVA and Closing Services KPI data such as cycle time, touch reduction, exception rate, and post-close defect rate.
    whyItMatters: Without post-launch productivity or reliability metrics, the public record proves feature intent but not whether EVA materially improves escrow throughput or error rates.
    diligencePath: Request post-launch dashboards, pre/post EVA operations metrics, and cohort-level turnaround or fallout comparisons by escrow team.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: blocking
    topic: bbys-credit-economics
    missingEvidence: Current BBYS and Home Loans cohort economics including funding cost, defaults, shortfalls, warehouse terms, and contribution margin.
    whyItMatters: HomeLight markets 0% and certainty terms, but public sources do not reveal whether those benefits are subsidized, profitable, or risk-heavy under stress.
    diligencePath: Request warehouse-line documents, loan performance curves, advance rates, loss-severity data, and contribution-margin bridges for BBYS and Home Loans.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE004
    - TE005
  - type: missing-source
    severity: material
    topic: platform-reliability-docs
    missingEvidence: Public architecture, incident-history, status-page, or model-governance documentation for EVA, the lender portal, and Closing Services.
    whyItMatters: The reviewed corpus proves workflow breadth but leaves reliability, fallback procedures, vendor concentration, and AI-governance controls largely opaque.
    diligencePath: Request architecture review material, vendor inventory, model-governance controls, incident logs, and business continuity procedures for closing and lending operations.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: home-loans-public-surface
    missingEvidence: A fuller current public product surface for HomeLight Home Loans showing borrower workflow, pricing, and servicing handoffs.
    whyItMatters: Licensing proves regulatory presence, but sparse public product detail makes it hard to tell whether Home Loans is primarily origination, referral, or attach infrastructure.
    diligencePath: Request a current borrower journey, product demo, rate-lock and underwriting process notes, and attach-rate data from BBYS into Home Loans.
    relatedQuestionRefs:
    - QE014
    - QE025
    relatedTableRefs:
    - TE001
    - TE005
