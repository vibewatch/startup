summary:
  headline: >-
    HomeLight has built a real multi-product residential transaction platform with meaningful reach and credible
    customer pain-point fit, but opaque current financials, capital-sensitive product mix, regulatory exposure, and a
    post-2022 valuation reset keep the recommendation at research-more.
