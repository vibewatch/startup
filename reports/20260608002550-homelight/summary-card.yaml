  topStrengths:
    - >-
      Product breadth is real: HomeLight spans agent matching, Simple Sale, Buy Before You Sell, lender distribution,
      and closing automation rather than a single referral wedge.
    - >-
      Public scale signals indicate production usage, including 2M+ cumulative buyer and seller matches, $1B+ equity
      unlocked, and a large agent/lender network.
    - >-
      The platform addresses real market pain around affordability, contingency removal, equity access, and closing
      coordination in a still-frictional housing market.
    - >-
      If EVA and downstream attach work as advertised, HomeLight could support better mix quality than a pure brokerage
      or lead marketplace.
  topRisks:
    - >-
      Current revenue, gross margin, cash, debt terms, and business-line mix are undisclosed, leaving underwriting
      dependent on stale 2021 revenue and company-claimed traction.
    - >-
      Repeated equity-plus-debt financing, 2022 layoffs, a 2024 down-round signal, and 2026 debt expansion suggest a
      more capital-sensitive business than the marketplace narrative alone implies.
    - >-
      Post-settlement brokerage rules, CFPB steering scrutiny, trigger-lead restrictions, and TCPA or RESPA exposure
      raise compliance risk across acquisition and lender-routing workflows.
    - >-
      BBB and review-site evidence shows recurring trust leakage around aggressive outreach, information sharing, and
      some BBYS or handoff frustration.
    - >-
      Competition from traffic owners and integrated brokerage, mortgage, and closing stacks limits moat durability and
      can compress take rates.
  unresolvedGaps:
    - Current revenue by line, gross margin, EBITDA, and business-line mix remain private.
    - Cash balance, warehouse capacity, covenant headroom, and detailed BlackRock or other debt terms remain private.
    - >-
      Buy Before You Sell cohort performance, loss rates, forced-purchase frequency, and realized unit economics remain
      private.
    - Cap-table terms, liquidation preferences, and any reliable 2025-2026 secondary or 409A pricing remain private.
    - >-
      Active-customer counts, attach rates, retention cohorts, and partner concentration across agents, lenders, and
      closing participants remain private.
