- id: tam-framing-and-adoption-constraints
  title: TAM framing, adjacencies, and adoption constraints
  body: |-
    The cleanest way to size HomeLight's market is with layered transaction lenses rather than one headline TAM. April 2026 resale activity alone implies about $1679.2 billion of annualized existing-home transaction value when NAR's 4.02 million sales pace is multiplied by the $417,700 median price. Using NAR's 88% buyer-agent usage as a demand-side proxy yields roughly $1477.7 billion of agent-mediated value, and applying Redfin's 2.40% average buyer-agent commission to that shell produces an estimated $35.5 billion buy-side commission pool. If referral platforms capture roughly 20% to 35% of those commissions, the monetizable referral-fee shell lands around $7.1 billion to $12.4 billion before partner mix, close-rate leakage, and repeat behavior.

    Adjacencies are also large enough to matter even when the public data are imperfect. MBA forecasts $1.46 trillion of purchase originations in 2026, while Fannie Mae sees $2.32 trillion of total single-family originations with a growing refinance share. ICE then adds an important mobility proxy: second-lien equity withdrawals reached about $33 billion in Q3 2025 and represented 59% of all equity withdrawals, showing strong homeowner demand to access housing wealth without surrendering low first-lien rates. That is not the same thing as bridge-loan TAM, but it is strong evidence that equity-access products sit in a meaningful adjacent flow.

    Closing economics are sizable too, but less cleanly mapped into software spend. ALTA shows $18.5 billion of title insurance premiums in 2025 and $3.9 billion in Q1 2025 alone, while CFPB's Closing Disclosure rules make document accuracy and timing central to every funded purchase. The implication is that HomeLight can point to big external pools around referrals, mortgage, and title, but the real SAM still depends on narrower private metrics: agent close rates, bridge pull-through, lender attach, and closing-automation throughput. Public data prove the market exists; they do not by themselves prove what share HomeLight can capture.
