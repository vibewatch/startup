  evidenceGaps:
  - type: missing-source
    severity: material
    topic: bridge-loan-volume
    missingEvidence: National 2025-2026 bridge-loan origination counts or funded dollar volume broken out by purchase-before-sale use case.
    whyItMatters: ICE’s second-lien data proves homeowner demand for equity access, but it does not reveal how large the true bridge-financing market is for HomeLight-like products.
    diligencePath: Request HomeLight and lender-partner bridge funding vintages, warehouse-line disclosures, or warehouse lender commentary that isolates bridge production.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: closing-workflow-software-spend
    missingEvidence: A public breakout of title and escrow software spend separate from title premiums, settlement fees, and carrier economics.
    whyItMatters: ALTA proves the closing economy is large, but HomeLight’s real software and workflow SAM cannot be underwritten from premium pools alone.
    diligencePath: Request title-partner software budgets, per-file workflow spend, and EVA-style implementation metrics from management and channel partners.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: referral-take-rates
    missingEvidence: Lead-to-close conversion, referral fee schedules, attach by market, and repeat-transactor mix for agent-matching channels.
    whyItMatters: The broad commission pool materially overstates monetizable revenue if consumer intent is weak or referral terms are thinner than public marketplace heuristics.
    diligencePath: Request cohort funnel data from lead through tour, agreement, preapproval, offer, and closed transaction by metro and customer source.
    relatedQuestionRefs:
    - QM017
    - QM021
  - type: stale
    severity: minor
    topic: buyer-direct-pay-incidence
    missingEvidence: A longer multi-quarter dataset showing how often buyers directly pay commissions versus receiving seller concessions after the settlement.
    whyItMatters: Early post-settlement evidence shows sticky commissions, but market behavior could still shift as more transactions cycle through the new rules.
    diligencePath: Refresh Redfin and NAR commission evidence after another full spring selling season and compare by price tier and metro.
    relatedQuestionRefs:
    - QM012
    - QM013
