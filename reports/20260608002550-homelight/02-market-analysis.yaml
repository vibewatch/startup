  - - Move-up / bridge finance
    - Existing owner who wants to buy before selling
    - Homeowner
    - Borrower plus capital provider; usually repaid from sale or refinance
    - Preapproval to contingency removal to resale payoff
    - Bridge or mortgage product P&L
    - Rate lock-in plus accumulated equity makes flexibility valuable.
  - - Purchase mortgage / lender partner
    - Loan officer, branch manager, or digital lender product lead
    - Borrower and loan officer
    - Borrower via loan economics and lender recapture logic
    - Prequal to rate lock to funded purchase loan
    - Lender product and branch economics
    - Need to turn housing demand into funded purchase volume efficiently.
  - - Title / closing partner
    - Title agency, lender ops, or brokerage closing leader
    - Borrower, closer, agent, and lender
