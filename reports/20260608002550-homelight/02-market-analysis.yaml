- id: TM004
  title: Growth drivers and constraints table
  columns:
  - driver/constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - Inventory recovery from historic lows
    - tailwind
    - current
    - More homes for sale should create more agent-match and closing opportunities even if turnover stays subdued.
    - Request lead-volume elasticity versus local inventory growth by metro.
  - - Mortgage-rate lock-in
    - headwind
    - current
    - Owners with below-market mortgages postpone listing, shrinking the supply of transactions to intermediaries.
    - Quantify HomeLight user cohorts with legacy sub-4% or sub-6% mortgages.
  - - First-time-buyer affordability stress
    - headwind
    - current
    - High rates, high rents, and down-payment strain suppress conversion among lower-equity households.
    - Ask for approval-to-close and fallout rates by buyer cohort and income band.
  - - Equity concentration among existing owners
    - tailwind
    - current
    - Older and move-up sellers with embedded equity are better candidates for bridge and cash-offer products.
    - Request bridge pull-through, loss rates, and repeat usage for equity-rich sellers.
  - - NAR settlement transparency shift
    - mixed
    - current
    - Buyer agreements and off-MLS compensation create more explicit negotiation but also more process friction.
    - Audit how often fee disclosure or agreement timing blocks a tour or referral handoff.
  - - MLS governance and antitrust uncertainty
    - headwind
    - current
    - Data-access rules remain strategically important to portals and marketplaces even after compensation fields disappeared.
    - Map traffic, lead, and data dependencies by MLS and portal partner.
  - - Portal traffic concentration and lead ownership
    - headwind
    - current
    - Portals can still tax attention through merchandising, lead routing, and paid exposure products.
    - Compare CAC and close rates across organic, portal, brokerage, and referral channels.
  - - Purchase-origination rebound
    - tailwind
    - '2026'
    - Even a modest mortgage recovery widens lender-software and preapproval opportunity.
    - Split lender economics between purchase, refinance, and equity products.
  - - Title workflow automation demand
    - tailwind
    - '2026'
    - Title partners facing refi, default, and HELOC mix shifts prefer integrated, lower-touch workflows.
    - Measure EVA implementation cost, title-cycle-time reduction, and error-rate impact.
  - - Public SAM opacity
    - headwind
    - current
    - Gross transaction pools overstate HomeLight’s real SAM because conversion, attach, and retention data are private.
    - Request cohort funnel data from lead to close, by product and market.
  notes: Implications combine current market data with channel-structure evidence; the open diligence asks focus on the private metrics needed to convert broad market pools into underwriteable share assumptions.
