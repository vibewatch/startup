    - Search to tour to offer
    - Broker/agent acquisition budget
    - Need trusted representation and fee clarity before touring homes.
  - - Seller-side agent match
    - Homeowner choosing a listing path
    - Seller
    - Seller proceeds via listing and referral economics
    - Valuation to listing to contract
    - Listing broker acquisition budget
