- id: commission-rule-changes-and-agent-marketplace-dynamics
  title: Commission-rule changes and agent-marketplace dynamics
  body: |-
    The NAR settlement changed how compensation is surfaced, not whether compensation exists. The settlement and follow-on practice changes prohibit publication of buyer-broker compensation offers on MLS listings and require written buyer agreements before touring a home, with compensation spelled out in that agreement. NAR's 2026 ethics updates go further by narrowing disclosure obligations to a REALTOR®'s own client and by deleting the old variable-rate-commission rule that had assumed unilateral MLS compensation offers. In other words, the old compensation field disappeared from the shared database layer, but the negotiation burden moved into bilateral buyer, seller, and broker workflows.

    That shift matters for agent-matching marketplaces. Under the old model, MLS compensation visibility supported a simpler cooperation norm. In the post-settlement model, the marketplace operator has to help agents prove value, manage buyer-agreement timing, and coordinate off-MLS compensation or concessions without steering. The legal environment also remains unsettled: DOJ and FTC reopened competitor-collaboration guidance in 2026, while NAR and CMLS used that process to argue that MLSs are still procompetitive infrastructure whose data-sharing rules reduce search costs and protect smaller firms.

    The evidence so far suggests adjustment, not collapse. Redfin's Q1 2025 commission analysis found the average buyer-agent commission at 2.40%, only slightly below pre-settlement levels and still usually seller-funded. Homes.com, meanwhile, is explicitly monetizing lead ownership and exposure for listing agents. Those facts imply that HomeLight's marketplace economics now depend less on hidden MLS norms and more on explicit fee discussions, trusted introductions, and the ability to route the consumer into the right human and financing workflow at the right moment.
