    - Portal growth or brokerage marketing lead
    - Searcher and listing agent
    - Agent subscription, ad spend, or marketing package
    - Listing exposure and lead routing
    - Agent marketing budget
    - Need lead ownership and exposure without handing listing traffic to competing agents.
