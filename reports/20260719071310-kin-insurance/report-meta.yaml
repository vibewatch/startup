companyProfile:
  summary: >-
    Kin Insurance is a Chicago-headquartered, founder-led homeowners insurtech founded in 2016. Public
    evidence describes a direct-to-consumer digital insurer built for catastrophe-prone and otherwise hard-to-
    place U.S. home-insurance markets, with a business model anchored in data-rich underwriting, reciprocal
    carrier structures, and layered reinsurance. The product surface now extends beyond core homeowners into
    landlord, condo, mobile-home, flood, auto, home-finance, and partner-led protection offers. Public 2025-
    2026 releases show meaningful revenue scale and improving renewal-driven economics, but the company remains
    private and still does not disclose enough carrier-level or cap-table detail for a fully underwriteable
    conclusion.
  foundedDate: '2016-01-01'
  founders:
    - name: Sean Harper
      role: Co-founder & CEO
      background: Public sources describe Harper as a financial-technology entrepreneur who built Kin around catastrophe-market pricing and direct distribution.
      claimRefs: [CO005, CO006, CO021]
    - name: Lucas Ward
      role: Co-founder & CTO
