    landlord, condo, mobile-home, flood endorsement, auto, home-finance, claims support, and partner-led home
    services in catastrophe-prone markets.
  customerFocus: >-
    Underserved U.S. homeowners and adjacent property owners in catastrophe-prone states who need affordable,
    customizable coverage and often value direct digital access plus human support.
  businessModel: >-
    Direct-to-consumer insurance distribution with revenue tied to new and renewal premium written through
    managed reciprocal exchanges and certain third-party carriers, reinforced by data-led underwriting,
    reinsurance, and emerging cross-sell into auto insurance and home finance.
  stage: Late-stage private (Series E completed September 2025)
  fundingStatus: >-
