- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Reinsurance-cost shock
    - Renewal reinsurance pricing or shrinking attachment capacity
    - Material repricing without offsetting rate power
    - Treat as thesis break unless state-level economics remain strong
  - - State-level underwriting deterioration
    - Loss ratios or reserve development worsen in key states
    - Two major renewal periods of negative adverse trends
    - Pause growth underwriting assumptions and re-evaluate capital need
  - - Claims-operations failure
    - Storm-response cycle times, complaints, or supplement disputes spike
    - Major-event service metrics materially miss internal targets
    - Expect retention, regulator, and review damage
  - - Privacy / cyber issue
    - Regulatory inquiry, breach notice, or major vendor incident
    - Material data incident involving claims or geolocation data
    - Re-rate trust, legal, and remediation cost assumptions immediately
  - - Capital-market tightening
    - Debt milestone miss or cat-bond / reinsurance access weakens
    - Growth requires expensive or unavailable capital
    - Reduce valuation and growth assumptions
  - - Bundle / platform disappointment
    - Auto, finance, and add-on attachments stall
    - Cross-sell remains negligible after several renewal cycles
    - Treat customer-LTV expansion thesis as unproven
  notes: These triggers turn diffuse insurer risks into monitorable underwriting checks.
