- id: TM005
  title: Contradictions and diligence gaps
  columns:
  - Question
  - Best public answer
  - Remaining gap
  - Why it matters
  rows:
  - - How big is the category?
    - $169.55B homeowners DPW in 2024
    - Need cleaner state-by-state splits by peril and admitted status
    - Category TAM is clear, but reachable share is not.
  - - How large is Kin’s SAM?
    - Company says 13-14 states cover >50% of TAM
    - No audited split between licensed, non-admitted, or product-limited reach
    - Serviceability matters more than narrative TAM.
  - - How much pain creates switching?
    - Survey shows claims, premium hikes, and repair bills trigger shopping
    - No state-level conversion or bind-rate data
    - Demand intensity affects acquisition efficiency.
  - - How stable are core states?
    - Florida improved in 2024; California still highly stressed
    - Future catastrophe years can reverse both trends
    - Timing matters for pricing and growth.
  - - How visible is complaint intensity?
    - Consumer-help infrastructure exists in key states
    - No standardized complaint-rate comparison in fetched pages
    - Retention and brand durability depend on service quality.
  notes: This table deliberately preserves what remains unresolved rather than forcing a false precision around Kin’s true serviceable market or customer-acquisition efficiency.
