chapter:
  number: 2
  title: Market Analysis
  summary: Kin addresses a very large and structurally stressed homeowners-insurance market rather than a niche insurtech category. Public evidence strongly supports a $169.55 billion U.S. homeowners premium pool, double-digit 2025 growth, and acute supply stress in Florida and California; what remains unresolved is exactly how much of Kin’s >50% TAM claim is practically serviceable given admitted-status limits, reinsurance intensity, and state-by-state regulatory friction.
sections:
- id: market-boundary-and-sizing
  title: Market boundary and sizing
  body: 'Kin is not pursuing the whole property-casualty universe; it is targeting homeowners insurance and adjacent coverage in climate-stressed regions where legacy carriers are shrinking supply. That narrower boundary still matters because it sits inside a very large premium pool. S&P puts U.S. P&C direct premiums written at $1.05 trillion in 2024, with homeowners alone contributing $169.55 billion and growing 11.1% year over year. Triple-I adds that homeowners represented 15.6% of all P&C premiums in 2024 and was still expected to post 11.8% premium growth in 2025 despite weak profitability. For Kin specifically, the company’s own framing evolved from a 2021 footprint covering roughly 21% of the home-insurance market to a 13-14 state platform covering more than half of its stated TAM by late 2025 and early 2026. The important caveat is that TAM is not the same as currently reachable spend: admitted-versus-surplus structure, reinsurance capacity, and product availability still compress
    the real serviceable market.'
