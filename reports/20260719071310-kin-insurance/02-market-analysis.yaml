- id: TM004
  title: Growth drivers and constraints
  columns:
  - Theme
  - Bullish driver
  - Constraint or risk
  - Evidence anchor
  rows:
  - - Climate volatility
    - More homeowners need tailored coverage in hard markets
    - Catastrophe losses can outpace rate and reinsurance relief
    - Swiss Re, Munich Re, LexisNexis
  - - Replacement-cost inflation
    - Higher insured values expand premium opportunity
    - Affordability worsens and claim severities rise
    - Triple-I, LexisNexis
  - - Legacy-carrier retreat
    - Carrier pullback opens space for specialists like Kin
    - Market repair can also attract new entrants and compress unit economics
    - Kin California launch, Florida recovery articles
  - - Insurtech / AI
    - Better property data may improve risk segmentation and customer trust
    - Consumers and regulators still need transparency and proof of fairness
    - Triple-I, Cape/Kin logic
  - - Regulatory reform
    - Litigation reform can improve market profitability
    - State rules on pricing, nonrenewal, and admitted status still limit speed
    - S&P, Insurance Journal, Kin state pages
  notes: 'This table is analytical rather than exhaustive: it isolates the main forces that explain both why the market is attractive and why it remains hard to underwrite.'
