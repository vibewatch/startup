- id: TM002
  title: Core-state market pressure indicators
  columns:
  - State
  - Pressure pattern
  - Evidence
  - Why Kin cares
  rows:
  - - Florida
    - High catastrophe and reinsurance dependence
    - 2024 positive underwriting after reforms, but 519.4% reinsurance dependence vs 62.2% U.S. average
    - Capacity can return, but economics remain tightly tied to reinsurance and storm seasons.
  - - California
    - Wildfire-driven availability crisis
    - Nonrenewals more than tripled; FAIR Plan exposure reached $696B; 1.2M homes at extreme wildfire risk
    - Creates demand for surplus or specialized underwriting models.
  - - Texas
    - Hail, tornado, and coastal wind stress
    - Hail was highest-loss-cost peril in 2024; 2026 law tightened denial/nonrenewal explanations
    - Large premium pool with multiple peril regimes, but still regulated and volatile.
  - - Louisiana
    - Hurricane and affordability stress
    - Kin cites disaster-prone areas with policies of $10K+ and highlights 2026 stated-value law
    - Opportunity exists, but affordability and replacement-cost debates are intense.
  notes: The state indicators mix independent market data with Kin product-page commentary because public statewide premium and availability data are uneven across geographies.
