  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: som-gap
    missingEvidence: State-by-state quote volume, bind rates, policy counts, and retention by product line.
    whyItMatters: Without those operating cuts, TAM and SAM can be discussed but not converted into a high-confidence SOM forecast or efficient-growth model.
    diligencePath: Request state-by-state operating dashboards or board materials that show conversion, retention, and policy concentration.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM001
  - type: conflicting-data
    severity: material
    topic: tam-boundary
    missingEvidence: A clearer split between addressable homeowners spend, reachable admitted/surplus spend, and actual currently serviceable spend in each state.
    whyItMatters: Kin’s >50% TAM framing is persuasive for narrative positioning but too coarse for investment underwriting without a tighter SAM boundary.
    diligencePath: Rebuild TAM/SAM using state program filings, licensing constraints, and actual product availability before the next refresh.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM001
  - type: missing-source
    severity: minor
    topic: complaints
    missingEvidence: Comparable state complaint-index and complaint-detail data across Florida, California, Texas, and Louisiana.
    whyItMatters: Complaint infrastructure is visible, but the fetched public pages do not provide enough standardized volume data to compare customer friction across states.
    diligencePath: Pull regulator complaint indices and complaint logs directly during a later refresh focused on customer and risk analytics.
    relatedQuestionRefs:
    - QM020
    relatedTableRefs:
    - TM005
acknowledgedWarnings:
- dimension: figureType
  reason: This chapter uses two high-signal figures plus six tables because the retained evidence is better suited to sizing and state-comparison tables than to four distinct visual forms.
