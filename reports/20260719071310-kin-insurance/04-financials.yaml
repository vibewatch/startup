- id: unit-economics-and-operating-leverage
  title: Unit economics and operating leverage
  body: 'Kin’s public releases are unusually explicit about margin architecture, but they still require careful handling. The company reports gross profit and operating metrics using non-GAAP definitions, and those definitions matter: cost of sales includes customer servicing and internal claims labor, meaning the headline gross margin is not equivalent to a pure software gross margin. Even so, the published numbers are strong. Gross margin held around 94% in both 2025 and Q1 2026, while baseline operating margin improved from 33% in 2024 to roughly 49% for full-year 2025 and 50% in Q1 2026. Management also gives rare acquisition-economics proxies. In Q1 2026, Kin spent about $30.7 million on growth expenses to acquire roughly $15.8 million of new ARR-equivalent revenue and said that spend would break even at first renewal, roughly a year later, on an ARR stream with about 10% net churn. Those are encouraging signals, but they still stop short of a full underwriteable model because public
    sources do not disclose consolidated cash flow, CAC by state, or realized loss-ratio performance by product cohort.'
