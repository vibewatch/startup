- id: capital-adequacy-and-risk-transfer
  title: Capital adequacy and risk transfer
  body: 'For Kin, capital adequacy cannot be separated from reinsurance. The company’s own materials show a layered capital stack consisting of equity capital at the parent, reciprocal exchange surplus, catastrophe bonds, and traditional reinsurance. Public evidence supports real depth here. Kin says its carriers hold Demotech A financial-stability ratings, it has backing from more than 40 highly rated or collateralized reinsurers, and its programs have included $770 million of catastrophe coverage in 2022, $860 million of Florida protection in 2023, and a $175 million catastrophe bond upsized from a $100 million target in 2022. Management also said recent cat-bond pricing came in 300 basis points better than the broader market. The larger industry context matters, however: Florida carriers returned to underwriting profitability in 2024, but they still remain far more reinsurance-dependent than the national property-insurance average, and global catastrophe losses continue to run at elevated
    levels. So Kin’s financing story is not just “we raised equity.” It is “we maintain access to multiple forms of risk capital in a structurally volatile market.”'
