  rows:
  - - Recent equity capital
    - 2019 $47M; 2021 Series C $69.2M; 2022 Series D first close $82M with $18M more committed; 2025 Series E $50M
    - Shows repeated access to growth capital
    - Medium
    - Reconcile primary vs secondary proceeds and cash still on balance sheet
  - - Carrier financial strength
    - Kin says both reciprocal carriers hold Demotech A financial-stability ratings
    - External trust signal for claims-paying capacity
    - Medium
    - Verify latest rating reports directly from Demotech
  - - Traditional reinsurance partners
    - More than 40 reinsurers or collateralized support on public description
    - Diversifies catastrophe risk transfer
    - Medium
    - Obtain counterparty list, attachment points, and treaty terms
  - - 2022 catastrophe reinsurance
    - About $770M hurricane coverage; 160-year first-event protection
    - Shows scale of catastrophe shield relative to carrier size
    - Medium
    - Review treaty deck and probability assumptions
  - - 2023 Florida reinsurance
    - About $860M and 1-in-200 year first-event protection
    - Indicates ability to renew despite hard market
    - Medium
    - Review Florida-specific reinsurance program economics
  - - Cat bond capital
    - $175M catastrophe bond in 2022, upsized from $100M target
    - Alternative capital access reduces dependence on one channel
    - Medium
    - Inspect bond terms, triggers, and cost over time
  - - Residual capital buffer
    - Kin says it still had more than $30M capital beyond modeled reinsurance exceedance
    - Important backstop if catastrophe losses overshoot treaties
    - Low
    - Validate with statutory surplus and stress tests
  - - Cash on hand / runway
    - Not publicly disclosed
    - Biggest unresolved capital-adequacy gap
    - Low
    - Request current balance sheet, monthly burn, and downside plan
  notes: Capital adequacy for a catastrophe insurer is inseparable from reinsurance structure, treaty quality, and access to renewal markets; equity rounds alone are insufficient.
