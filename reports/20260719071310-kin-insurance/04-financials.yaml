    - 2025 new revenue $61.8M; Q1 2026 $15.8M
    - Real but non-GAAP and premium-linked
    - Obtain reconciliation from written premium to GAAP revenue by product and carrier
  - - Renewal revenue
    - Fee revenue tied to renewal written premium
    - US$M
    - 2025 renewal revenue $139.8M; Q1 2026 $40.8M
    - Highest-quality visible stream because it rides an aging book
    - Request retention and repricing by cohort and state
  - - Shareholder-level revenue
    - Combination of new and renewal revenue plus related fee streams
    - US$M
    - 2025 total revenue $201.6M; 2024 $156.1M; Q1 2026 $56.6M
    - Strong public growth signal
    - Request audited GAAP statements with segment detail
  - - Auto insurance cross-sell
    - Adjacency tied to homeowner relationship
    - status
    - Launched in 2025; still early in 2026
    - Promising but immature
    - Request premium, attach, and loss-ratio data for auto book
  - - Home finance
    - Mortgage/refi/equity monetization attached to homeownership workflow
    - status
    - Launched in 2025; early growth stage
    - Strategically relevant but not yet quantified as a stand-alone stream
    - Request unit economics, conversion, and profitability by financing product
  notes: Kin’s public materials distinguish operational throughput (gross written premium) from shareholder-interest revenue. That distinction is central to any valuation or margin read.
