- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Current public substitute
  - Why substitute is insufficient
  - Exact diligence path
  rows:
  - - Cash balance
    - Cannot size runway or downside flexibility
    - Fundraising history and positive operating-income commentary
    - Fresh capital does not prove current liquidity
    - Request latest balance sheet and treasury roll-forward
  - - Monthly burn / cash flow
    - Cannot separate profitable growth from capital consumption
    - Baseline operating margin and operating income
    - Margins do not reveal cash taxes, working capital, or financing outflows
    - Request monthly cash-flow statement and board package
  - - Consolidated GAAP including VIEs
    - Cannot reconcile parent economics with carrier economics
    - Shareholder-interest non-GAAP releases
    - VIE exclusion hides some statutory insurance dynamics
    - Request audited consolidated statements and VIE reconciliation
  - - State-by-state loss ratios
    - Cannot tell whether growth is driven by the strongest or weakest books
    - Companywide adjusted loss ratios
    - Aggregate ratios can mask state-level strain
    - Request state and product profitability triangles
  - - Reserve development
    - Cannot judge whether current profit is overstated by optimistic reserving
    - Demotech ratings and management commentary
    - Ratings are not reserve analyses
    - Request actuarial reserve reviews and adverse-development history
  - - Regulatory capital by carrier
    - Cannot assess capacity for future growth or shock absorption
    - Demotech A ratings and surplus snippets
    - Ratings do not show exact capital buffer by legal entity
    - Request statutory statements for KIN and Nexus
  - - Realized CAC and retention by cohort
    - Cannot validate payback or lifetime-value math
    - Management’s one-year payback and 10% net churn comments
    - Commentary is useful but unaudited
    - Request cohort CAC, retention, and rate-change analysis by vintage
  notes: These are the missing metrics that prevent a full underwriting-grade verdict despite unusually informative public releases for a private company.
