- id: growth-quality-and-multiple-work
  title: Growth quality and multiple work
  body: Kin’s valuation deserves more credit than many late-stage private insurtechs because the company has moved from fast growth toward something closer to scaled earnings power. Revenue rose from $105.2 million in 2023 to $156.1 million in 2024 and $201.6 million in 2025, while the renewal portion of written premium became the dominant growth driver. Using the Series E price anchor, the round values Kin at roughly 9.9x 2025 revenue, about 3.2x 2025 gross written premium, and about 8.8x annualized Q1 2026 revenue. Those are rich multiples for an insurer, but not absurd for a still-growing specialty platform if the baseline-margin story holds. The critical nuance is that the market softened in 2026 and management admitted customer acquisition became harder, which means future multiple support depends on renewals, cross-sell, and underwriting discipline more than on endless new-customer acceleration. In other words, Kin is transitioning from “growth narrative” valuation toward “quality
    of compounding” valuation. That makes the current price supportable, but it also reduces room for error.
