- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold
  - transmission to thesis
  - action implication
  rows:
  - - Reinsurance reprices sharply upward or capacity tightens
    - Two consecutive renewal cycles materially worse than management implies
    - Destroys the premium-multiple case by hitting margin, growth, and customer pricing at once
    - Move valuation stance from fair to rich or broken
  - - State-level loss ratios deteriorate
    - Core-state profitability weakens despite revenue growth
    - Shows the public earnings narrative is masking underwriting strain
    - Pause investment until state data is reconciled
  - - Cross-sell stagnates
    - Auto and home-finance attachments remain immaterial after more renewal cycles
    - Narrows LTV and makes the business look more like a single-line carrier
    - Remove bundle premium from the model
  - - Cap-table or debt terms disappoint
    - Preferences, dilution, or debt covenants reduce common-equity economics
    - Headline $2B overstates what new money is buying
    - Re-underwrite from effective rather than headline valuation
  - - Public comp sentiment weakens
    - Digital-insurance comps compress materially while Kin is still private
    - Exit path and round-support logic get worse quickly
    - Demand a lower entry price or more proof
  notes: These are valuation-specific kill triggers, not a restatement of operating risks from Chapter 7.
  claimRefs:
  - CV026
  - CV030
  - CV035
  - CV036
  - CV038
  - CV040
- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner or diligence path
  rows:
  - - Carrier-level profitability
    - State and product loss ratios, reserve development, and statutory capital by entity
    - This determines whether public parent-level margins are durable or cosmetic
    - Request statutory statements, actuarial reviews, and state P&Ls
  - - Cap-table economics
    - Preferences, participation, dilution, employee tender size, and primary vs secondary mix
    - Headline valuation may not equal effective common-equity entry price
    - Review financing docs and waterfall model
  - - Liquidity and leverage
    - Current cash balance, monthly burn, debt milestones, and covenant flexibility
    - Needed to know whether Kin can self-fund growth or needs future capital under stress
    - Request treasury pack and debt agreement
  - - Cross-sell quality
    - Auto, finance, and add-on attach, retention, and contribution margin
    - Bundle expansion is central to upside but lightly disclosed publicly
    - Request cohort dashboards by product and original homeowner vintage
  - - Public-market readiness
    - Audit quality, close discipline, governance, and IPO readiness
    - A later public or crossover round is the most likely premium-validation path
    - Request CFO readiness plan and auditor materials
  - - Reinsurance durability
    - Counterparty quality, attachment structure, and repricing scenarios
    - Valuation can compress fast if the risk-transfer stack becomes expensive or scarce
    - Request reinsurance deck and catastrophe-stress cases
  notes: 'These asks are intentionally narrow and price-linked: each could change the fair value range, not just generic comfort level.'
