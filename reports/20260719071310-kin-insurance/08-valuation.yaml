  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: effective entry economics
    missingEvidence: Series E security terms, preferences, dilution, any secondary or tender mix, and debt-covenant interactions.
    whyItMatters: A headline $2B valuation can be economically misleading if common-equity entry differs from the headline.
    diligencePath: Request financing docs, cap-table waterfall, and debt agreements.
    relatedQuestionRefs:
    - QV010
    - QV024
    relatedTableRefs:
    - TV001
    - TV005
    - TV006
  - type: private-evidence-only
    severity: material
    topic: carrier-level durability
    missingEvidence: State-level loss ratios, reserve development, regulatory capital, and multi-year catastrophe stress outcomes by carrier.
    whyItMatters: Private valuation support depends on proving that current margins are not flattered by benign periods or aggregation.
    diligencePath: Request statutory statements, actuarial reviews, and catastrophe stress cases.
    relatedQuestionRefs:
    - QV014
    - QV026
    relatedTableRefs:
    - TV003
    - TV006
  - type: missing-source
    severity: minor
    topic: public comp completeness
    missingEvidence: A cleaner current public-market value extraction for Hippo and a broader set of specialty-insurance public comps.
    whyItMatters: The retained comp set is directionally useful but still incomplete on direct home-insurtech market values.
    diligencePath: Expand comp work with additional market-data providers and current equity research.
    relatedQuestionRefs:
    - QV016
    - QV020
    relatedTableRefs:
    - TV004
