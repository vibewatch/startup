- id: comparable-set-and-scenario-view
  title: Comparable set and scenario view
  body: 'The public comparable set is imperfect but still useful. Lemonade is the cleanest digital-insurance growth comp because it combines consumer brand, app-led distribution, and public-market transparency; as of July 2026 it carried about $5.16 billion of market cap and reported $258 million of Q1 revenue with $1.33 billion of in-force premium. Hippo is a closer home-insurance peer in product spirit, but its hybrid partner model and weaker public extraction from retained sources make valuation comparison less precise. Allstate is not a venture-style comp, but it is useful as an upper-bound reminder of how much scale and diversification mature insurers command: about $64.3 billion of market cap in July 2026. Against that landscape, Kin’s $2 billion sits in a plausible middle zone—well below large incumbent scale and below Lemonade’s current market value, yet high enough that investors are already paying for meaningful future compounding. That means scenario work matters more than headline
    comp tables. If Kin can keep renewal economics strong, attach more auto and finance products, and avoid major catastrophe dislocations, it can grow into and beyond this price. If those assumptions crack, the private mark has room to compress.'
