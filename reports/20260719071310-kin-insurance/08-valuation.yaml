- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - Kin has graduated from speculative insurtech to profitable specialty platform with real revenue and renewal compounding.
    - Evidence that reported baseline margins do not translate into durable carrier-level economics would weaken this quickly.
  - - Catastrophe specialization and direct distribution deserve a premium to ordinary insurers.
    - If reinsurance repricing or litigation inflation overwhelms pricing power, specialty status becomes a discount, not a premium.
  - - Cross-sell into auto and home finance can deepen LTV and reduce churn.
    - If attachment stalls or economics disappoint, Kin remains a narrower homeowners writer than the round implies.
  - - Private valuation discipline has looked better than 2021 hype-era peers.
    - Unfavorable preferences, heavy secondary mix, or hidden leverage could make the headline price misleading.
  notes: The anti-thesis rows focus on what would invalidate the price, not generic business risks already covered in Chapter 7.
