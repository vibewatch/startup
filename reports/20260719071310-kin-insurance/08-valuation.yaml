- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - scenario
  - assumptions
  - valuation / return logic
  - key risks
  - probability signal
  rows:
  - - Bull
    - Revenue moves toward $275M-$300M over the next 12-18 months, renewal economics stay strong, cross-sell deepens, and reinsurance markets remain workable.
    - $2.6B-$3.2B valuation support becomes plausible, giving meaningful upside from the current mark.
    - Requires continued cat resilience and no sharp multiple compression in public insurtech comps.
    - low-medium
  - - Base
    - Revenue annualizes around the current run-rate and edges higher while margins remain strong but growth moderates.
    - $1.9B-$2.4B looks defensible, suggesting the current round is roughly fair.
    - Even decent execution may only validate, not clearly exceed, the current price.
    - medium
  - - Bear
    - Growth slows, catastrophe losses or reinsurance costs worsen, and investors value Kin more like a cyclical specialty insurer than a premium-growth platform.
    - $1.2B-$1.6B becomes easier to justify, implying real downside from the Series E mark.
    - Downside can arrive through multiple compression even without a collapse in customer demand.
    - medium
  notes: Scenario ranges use revenue-quality and multiple logic rather than a DCF because public carrier-level cash-flow detail is insufficient.
