evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A current board roster, voting-rights map, and any investor protective provisions.
    whyItMatters: >-
      Governance concentration and control rights matter for underwriting management quality and future financing
      leverage.
    diligencePath: Request a current board deck or financing summary that names directors, observers, and major control terms.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
      - TO005
  - type: conflicting-data
    severity: material
    topic: total-raised
    missingEvidence: >-
      A reconciled schedule showing whether Series D extensions and later financings are included in the cumulative
      equity total.
    whyItMatters: >-
      The difference between $286M and $330M affects dilution analysis and how much capital Kin has really required to
      reach scale.
    diligencePath: Ask finance for a round-by-round capitalization table or investor memo that reconciles cumulative primary equity.
    relatedQuestionRefs:
      - QO016
    relatedTableRefs:
      - TO003
  - type: access-blocked
    severity: minor
    topic: complaints
    missingEvidence: >-
      A complaint-level view that shows issue categories, resolution patterns, and trend direction across BBB,
      regulators, or NAIC data.
    whyItMatters: >-
      The public profile confirms review infrastructure exists, but not enough detail to test whether customer
      satisfaction hides concentrated complaint themes.
    diligencePath: >-
      Pull regulator complaint indices and the fully expanded BBB complaint log during a refresh focused on customer and
      risk signals.
    relatedQuestionRefs:
      - QO023
  - type: missing-source
