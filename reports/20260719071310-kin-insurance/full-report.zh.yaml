  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与解决方案类型
        blocks:
          - type: paragraph
            body: >-
              Kin 面对的不只是一类竞争者。直接数字同业包括 Lemonade、Hippo、Branch 和 Openly，但它们切入房主需求的方式各不相同。Lemonade 是 App
              驱动的全栈保险公司，销售多条个人险种。Hippo 混合房屋保护、服务层和承保伙伴网络。Branch 强调房屋加车险捆绑购买，以及由贷款机构驱动的分销。Openly 更像赋能代理人的 MGA /
              项目管理方，而不是纯粹直接面向消费者的品牌。放在这组同业中，Kin 位于一个具体生态位：数字分销的房主险，面向巨灾高发或其他难以定价的市场，运营模式围绕细颗粒物业数据和更低代理人成本搭建。另一类竞争者是由
              Allstate 和 State Farm 代表的传统承保商。它们数字化动作更慢，但仍掌握信任、多险种宽度和既有代理人关系，这些都会塑造买方惯性。因此，真实市场不是“Kin 对保险科技公司”，而是 Kin
              对消费者留在可信老牌承保商的意愿，再叠加 Kin 对拥有更强 App 或捆绑故事的新数字品牌。
