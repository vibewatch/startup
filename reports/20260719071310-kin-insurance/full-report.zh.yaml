      - number: '3.2'
        title: 分销、体验与捆绑
        blocks:
          - type: paragraph
            body: >-
              分销架构是这个市场最清晰的分水岭之一。Kin 和 Lemonade 讲的是更直接面向消费者的故事，哪怕两者在需要时仍使用真人支持。Branch
              把数字报价与贷款机构和合作伙伴分销结合起来，可以在按揭时点降低获客摩擦。Openly 明确以代理人为中心，因此更多是通过提高独立代理机构效率来竞争，而不是取代它们。Hippo
              介于这些模式之间：网站承诺轻松在线比较，但专属专家或代理人仍是选择保单的核心。传统巨头靠本地代理人、既有客户关系、托管账户熟悉度和宽产品捆绑维持力量。这很重要，因为房主险有黏性；除非出现价格冲击、服务失败，或搬家、再融资等人生事件，用户不会每年换保。Kin
              年轻的车险和房屋金融产品具备战略意义，因为它们试图缩小捆绑缺口；但管理层评论和第三方报道仍把它们定位为早期布局，而不是成熟优势。
