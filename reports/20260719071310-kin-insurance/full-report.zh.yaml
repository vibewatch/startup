      - number: '7.2'
        title: 运营、安全与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Kin 的品牌承诺依赖于在灾害密集市场中快速完成承保和理赔，因此运营和依赖风险格外关键。公司自己的 Ian
              飓风更新展示了积极一面：自动短信、安否检查、航拍影像和理赔分流帮助其处理数千件理赔，同时把预计净暴露维持在相对低位。但同一事件也凸显了底层脆弱性。突发事件可能压垮人员、理赔员容量、承包商、合作伙伴或内部工作流工具。公开材料显示，Kin
              依赖第三方平台和数据源，例如用 Cape Analytics 做物业智能、用 Snapsheet 做理赔自动化，并从 Oncourse 和 Cinch
              获得合作伙伴主导的房屋保护服务。这些选择合理，但会制造供应商集中和 SLA 风险。隐私和法律披露又加了一层：Kin
              收集敏感客户、理赔、地理位置和营销数据，使用广告与分析合作伙伴，并可能在关联方和服务提供商之间共享信息。公开证据没有披露详细网络安全认证、数据泄露历史、模型治理控制或供应商审计纪律。对一家建立在数据和数字工作流上的保险公司来说，这个缺口很重要。
