      - number: '7.3'
        title: 资本、人才与执行风险
        blocks:
          - type: paragraph
            body: >-
              Kin 的资本结构降低了一些风险，也制造了另一些风险。再保险、巨灾债券和外部融资帮助公司持续写业务并吸收事件冲击，但这些保护也让 Kin 依赖有利的外部资本市场。如果巨灾损失维持高位，或投资人对 Florida
              和沿海风险的胃口恶化，容量的成本或可获得性会迅速变化。Kin 的 $145M 债务授信有帮助，但按里程碑分期拨付的结构本身会带来执行和类似契约条款的风险。扩张也会放大运营负担。收购一家拥有 43
              个州牌照的承保主体扩大了可选项，但每进入一个新州都会增加合规、人员、承保和服务复杂度。因此，人才风险有分量：公司需要足够的理赔、承保、法务、工程和客户服务人才，同时支撑增长和风暴响应峰值。公开材料显示 Kin
              意识到这一点并投入招聘，但没有证明团队深度、控制职能和治理是否与保费规模同步扩张。这一点尤其重要，因为一家巨灾保险公司在平常时期可以看起来高效；一旦进入压力期，如果人才、准备金和供应商协同没有同时就绪，就会变得脆弱。
