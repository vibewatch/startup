      - number: '2.3'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              这个市场正被两股力量同时拉扯。一边，气候波动、重置成本通胀和传统承保商撤退，正在制造对新承保容量和更细颗粒风险选择的需求。LexisNexis 显示，巨灾理赔已经占理赔件数的 42%、损失额的
              64%；Triple-I 则称重置成本五年内上涨近 30%。Swiss Re 和 Munich Re 在再保险层面也显示同样压力：2024 年已保险巨灾损失为 $137B，2025 年趋势指向
              $145B。另一边，同样的力量也抬高了增长门槛。Florida 仍依赖再保险，California 的 FAIR Plan 已膨胀，关于不续保、定价灵活性和盈余线结构的州别规则也限制供给扩张速度。换句话说，Kin
              服务的是一个真有需求、但并不容易的市场。增长更可能来自承保商退出、费率充足性、减灾技术和更好的承保准确度，而不是无摩擦的全国铺开。
