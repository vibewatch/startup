  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与增长
        blocks:
          - type: paragraph
            body: >-
              Kin
              不是传统软件公司，不该按软件公司分析。公开发布清楚显示，股东层面的收入主要是与互助保险交易所和部分第三方承保主体的保险产量挂钩的费用收入，分为新保单收入和续保收入。这个结构很关键：总承保保费是运营吞吐量指标，而报告收入只是叠在保险活动之上的更窄货币化层。公开结果显示
              Kin 两条线都在扩张：总承保保费从 2023 年 $346.3M 增至 2024 年 $495.3M、2025 年 $634.4M；总收入则从 $105.2M 增至 $156.1M，再到
              $201.6M。保费账本也在成熟：2025
              年，续保承保保费成为更大的增长驱动，这具备战略意义，因为续保的经济性往往优于首年获客。车险和房屋金融延展了收入叙事，但公开证据仍把它们描述为核心房主关系上的早期附着，而不是独立利润中心。
