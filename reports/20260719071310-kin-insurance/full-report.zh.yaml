      - number: '3.3'
        title: 定价、信任与切换成本
        blocks:
          - type: paragraph
            body: >-
              保险领域大多数公开定价证据都停留在营销层，而不是真实成交费率；这里也一样。被评估的竞争者里，只有 Lemonade 清晰发布房主险起步价，Branch、Hippo、Kin
              和传统承保商则强调个性化报价、节省金额或保障指导。因此，更持久的竞争判断来自信任和切换摩擦，而不是引流价。Lemonade 和 Hippo 受益于上市公司披露和可识别的数字品牌。State Farm 和
              Allstate 受益于庞大存量客户、多险种捆绑和代理人熟悉度。Kin 则用围绕 Demotech 评级、投保人持有的互助保险结构和广泛再保险支持的强公开财务实力表述来回应。不过，评测报道仍强调一些限制：Kin
              的地理范围比传统巨头窄，保障宽度更聚焦，CNBC 仍指出其没有移动 App。结果是一幅混合图景：Kin 可以在困难市场靠专业匹配和价格胜出，但许多买方仍会看重传统承保商捆绑的便利，或数字同业更成熟的移动体验。
