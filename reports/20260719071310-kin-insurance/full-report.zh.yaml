  - id: TV005
    title: 投资逻辑破裂与终止触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 再保险价格大幅上行或容量收紧
        - 连续两个续约周期明显差于管理层暗示
        - 同时打击利润率、增长和客户定价，摧毁溢价倍数逻辑
        - 将估值立场从合理下调为偏高或破裂
      - - 州级亏损率恶化
        - 尽管收入增长，核心州盈利能力仍走弱
        - 说明公开盈利叙事掩盖了承保压力
        - 暂停投资，直到州级数据完成对账
      - - 交叉销售停滞
        - 更多续约周期后，车险和住房金融附加购买仍不重要
        - 压窄 LTV，让业务更像单险种承保主体
        - 从模型中剔除捆绑溢价
      - - 股权结构或债务条款不及预期
        - 优先权、稀释或债务契约削弱普通股经济性
        - 表面 $2B 高估新资金真正买到的东西
        - 按有效估值而非表面估值重新承保
      - - 公开可比公司情绪转弱
        - Kin 仍为私企时，数字保险可比公司倍数显著压缩
        - 退出路径和轮次支撑逻辑会快速恶化
        - 要求更低进入价格或更多证据
    notes: 这些是估值特定的终止触发项，不是第 7 章运营风险的重述。
    claimRefs:
      - CV026
      - CV030
      - CV035
      - CV036
      - CV038
      - CV040
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 承保主体层面盈利能力
        - 按实体划分的州级和产品亏损率、准备金发展与法定资本
        - 它决定公开披露的母公司层面利润率能否持续，还是只是表面好看
        - 索取法定报表、精算审查和州级 P&L
      - - 股权结构经济性
        - 优先权、参与权、稀释、员工出售规模，以及新股与老股组合
        - 表面估值不一定等于普通股有效进入价格
        - 审查融资文件和分配瀑布模型
      - - 流动性和杠杆
        - 当前现金余额、月度烧钱、债务里程碑和契约灵活性
        - 需要判断 Kin 在压力下能否自筹增长资金，还是需要未来资本
        - 索取资金管理包和债务协议
      - - 交叉销售质量
        - 车险、金融和附加产品的附加购买、留存和贡献利润率
        - 捆绑扩张是上行空间的核心，但公开披露很少
        - 按产品和原始房主队列索取队列看板
      - - 公开市场准备度
        - 审计质量、关账纪律、治理和 IPO 准备度
        - 后续上市或跨界融资轮次，是最可能验证溢价的路径
        - 索取 CFO 准备计划和审计师材料
      - - 再保险耐久性
        - 对手方质量、分保结构和重新定价情景
        - 如果风险转移堆栈变贵或稀缺，估值会快速压缩
        - 索取再保险材料和巨灾压力情景
    notes: 这些问题刻意收窄并与价格挂钩：每一个都可能改变公允价值区间，而不只是提升一般舒适度。
    claimRefs:
      - CV015
      - CV016
      - CV026
      - CV030
      - CV035
      - CV036
