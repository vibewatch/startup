      - number: '8.4'
        title: 投资逻辑破坏点与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              估值强度取决于尽调缺口是否足够小，而 Kin 的部分缺口仍然实质性。第一，公开数据对一家私营公司来说很丰富，但仍不完整：没有一座完整公开桥梁，把母公司层面的非 GAAP
              盈利能力连接到按州、按产品划分的承保主体法定韧性。第二，公开保险科技公司历史要求投资人保持谦逊。仅 Lemonade
              的市值历史就显示，即便底层公司持续增长，投资人情绪也可能剧烈摇摆。第三，巨灾专业化有利有弊。它在困难市场创造稀缺性和定价权，也让 Kin
              暴露于再保险重新定价和突然的多变量冲击。最后，股权结构表和融资细节很重要。Series D 延期轮维持同一估值、SPAC
              终止都显示管理层有纪律，但投资人在自信承保新一轮之前，仍需要知道精确条款、稀释、债务义务和任何老股流动性成分。估值结论因此偏正面但有条件：按表面看合理到略贵；只有当尽调确认当前利润率质量和巨灾韧性比公开怀疑者可能认为的更持久时，才算有吸引力。
