companyProfile:
  summary: >-
    Kin Insurance 总部在 Chicago，由创始人带队，2016
    年成立。公开证据显示，这是一家直面消费者的数字保险公司，服务巨灾高发和其他难以承保的美国房主保险市场，商业模式靠高密度数据承保、互助保险主体结构和分层再保险支撑。产品面已经从核心房主险扩到房东险、公寓业主险、移动房屋险、洪水、车险、房屋金融以及合作伙伴牵头的保护服务。2025–2026
    年公开发布显示，公司已有可观收入规模，续保驱动的经济性也在改善；但公司仍是私营公司，承保主体层面和股权结构表披露仍不足以支撑完全可承保的结论。
