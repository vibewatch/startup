      - number: '1.2'
        title: 创始人、领导层与治理可见度
        blocks:
          - type: paragraph
            body: >-
              创始人记录最清楚的是 Sean Harper 和 Lucas Ward。多方来源把 Harper 的创业起点与他长期关注金融和软件联系起来，公开访谈也持续显示，他把 Kin
              定义为一次改造隐形、软件含量很高的保险供应链的尝试。Ward 在长篇报道中出现较少，但引用到他的来源显示，他承担了深度技术角色，横跨保单管理、巨灾建模和定价基础设施。Kin 还在 2022
              年末补强高管层，引入金融、法务、人事和产品等领域的资深负责人，说明公司在为规模化运营做准备，而不是单靠创始人直觉运转。披露缺口不在领导层身份，而在治理。公开材料容易找到投资人和高管名单，但没有当前董事会名单、观察员分布，也没有关于投票控制权集中的硬证据。这个遗漏不推翻运营叙事，却限制了对监督质量和投资人影响力的尽调。
