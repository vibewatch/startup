      - - Hippo
        - 500K+ 房主；70+ 承保主体合作伙伴；有公开 10-K
        - 上市同业；留存来源难以提取当前市值
        - 房屋保险和家庭保障领域的可参考同业
        - 混合承保主体-合作伙伴模式，且留存来源中的估值可见度较弱
      - - Allstate
        - 大型在位多险种保险商
        - 2026 年 7 月市值约 $64.32B
        - 可作为规模和信任上限参照
