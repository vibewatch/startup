      - number: '8.2'
        title: 增长质量与倍数测算
        blocks:
          - type: paragraph
            body: >-
              相比许多后期私营保险科技公司，Kin 的估值应该获得更多信用，因为公司已经从高速增长走向更接近规模化盈利能力的状态。收入从 2023 年 $105.2M 增至 2024 年 $156.1M、2025 年
              $201.6M，同时续保承保保费成为主导增长驱动。以 Series E 价格锚点计算，该轮对 Kin 的估值约为 2025 年收入的 9.9x、2025 年总承保保费的约 3.2x，以及 Q1 2026
              年化收入的约 8.8x。对保险公司来说，这些倍数偏高；但如果基准利润率故事成立，对一个仍在增长的专业化平台来说并不荒唐。关键细节是，2026
              年市场变软，管理层承认获客变难，这意味着未来倍数支撑更多依赖续保、交叉销售和承保纪律，而不是无尽的新客户加速。换句话说，Kin 正从“增长叙事”估值转向“复合质量”估值。这让当前价格可以支撑，但也降低了犯错空间。
