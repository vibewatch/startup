            body: >-
              Kin 最清楚的技术差异化仍是承保颗粒度。公司反复把平台描述为数据密集型，数千个——在一份 2021 年发布中为超过 10,000 个——物业数据点会进入定价和保障决策。Cape Analytics
              合作让这一点更具体：Kin 使用地理空间影像、计算机视觉和机器学习，摄取屋顶状况、树木覆盖、泳池存在，以及与风灾、野火和水害风险相关的特征。这很重要，因为 Kin
              不只是在自动化文书。公司用外部数据和内部搭建的保单与定价基础设施，判断哪些房屋更有韧性、保障应该收多少钱。Lucas Ward 2019 年关于自建保单管理系统、巨灾建模专长和定价深度的描述，支持了 Kin
              掌握核心保险逻辑的判断，而不是只包了一层别家承保商的评级引擎。代价是依赖风险：公开证据没有展示详细模型治理、供应商 SLA 或可用性指标。
