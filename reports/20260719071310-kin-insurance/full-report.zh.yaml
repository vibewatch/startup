  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模
        blocks:
          - type: paragraph
            body: >-
              Kin 并不追逐整个财产与意外险宇宙；它瞄准的是气候压力地区的房主险及相邻保障，而这些地区传统承保商正在收缩供给。边界更窄，但仍落在一个很大的保费池里。S&P 显示，2024 年美国 P&C 直接承保保费为
              $1.05T，其中仅房主险就贡献 $169.55B，并同比增长 11.1%。Triple-I 补充说，2024 年房主险占全部 P&C 保费的 15.6%，尽管盈利能力偏弱，2025 年仍预计实现 11.8%
              保费增长。对 Kin 来说，公司自己的口径也从 2021 年覆盖约 21% 房屋保险市场，演进到 2025 年末和 2026 年初覆盖其所称 TAM 一半以上的 13–14 州平台。关键提醒是，TAM
              不等于当前可触达支出：准入保险与盈余线结构、再保险容量和产品可用性仍会压缩真实可服务市场。
