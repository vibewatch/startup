      - number: '8.3'
        title: 可比公司与情景视角
        blocks:
          - type: paragraph
            body: >-
              公开可比集不完美，但仍有用。Lemonade 是最干净的数字保险增长可比，因为它结合了消费者品牌、App 驱动分销和公开市场透明度；截至 2026 年 7 月，其市值约 $5.16B，并报告 Q1 收入
              $258M、有效保费 $1.33B。Hippo 在产品精神上更接近房屋保险同业，但其混合合作伙伴模式，以及从留存来源中提取出的公开信息较弱，让估值比较不够精确。Allstate
              不是风投式可比，但它作为上限提醒有用：成熟保险公司能掌握多大的规模和多元化，2026 年 7 月市值约 $64.3B。放在这个格局里，Kin 的 $2B 处于合理中间地带——远低于大型传统巨头规模，也低于
              Lemonade 当前市场价值，但已经高到投资人正在为有意义的未来复合增长付费。因此，情景测算比标题可比表更重要。如果 Kin
              能保持强续保经济性，附加更多车险和金融产品，并避开重大巨灾错位，它可以逐步消化并超过这个价格。如果这些假设破裂，私募估值仍有压缩空间。
