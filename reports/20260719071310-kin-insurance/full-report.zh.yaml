  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品面与客户流程
        blocks:
          - type: paragraph
            body: >-
              Kin 已不再是单一产品的房主险初创公司。公开产品面现在包括核心房主险，以及公寓业主险、房东险、移动房屋险、洪水、车险和房屋金融扩展。贯穿这些产品的一致设计选择，是直接面向消费者的简单性：Kin
              强调在线报价、数字定制和直接服务，而不是分支机构加代理人网络。即便是各州产品页，也像引导式配置流程，用直白语言解释住宅、责任、免赔额和附加保障选择。产品宽度具备战略意义，因为它让 Kin
              能随着时间在同一房主身上加深钱包份额；但公司显然仍以房屋作为主要关系。车险和金融被描述为相邻的房主服务，而不是离开财产保险的转向。主要结构细节在于，法律产品形态会随州变化。California
              使用盈余线分销结构，其他州则依靠互助保险承保主体或更接近标准房主险组合的背书形式。
