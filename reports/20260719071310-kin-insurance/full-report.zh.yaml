        - 新融资不能证明当前流动性
        - 索取最新资产负债表和资金滚动表
      - - 月度烧钱速度 / 现金流
        - 无法区分盈利性增长和资本消耗
        - 基线经营利润率和营业利润
        - 利润率看不出现金税、营运资本或融资现金流出
        - 索取月度现金流量表和董事会材料
      - - 包含 VIE 的合并 GAAP
        - 无法核对母公司经济性与承保主体经济性
        - 股东权益口径的 non-GAAP 披露
        - 排除 VIE 会遮住部分法定保险动态
        - 索取经审计合并报表和 VIE 调节表
      - - 分州赔付率
        - 无法判断增长来自最强还是最弱的业务账簿
        - 全公司调整后赔付率
        - 汇总比例会掩盖州层面的压力
        - 索取按州和产品划分的盈利能力三角表
      - - 准备金发展
        - 无法判断当前利润是否被乐观准备金高估
        - Demotech 评级和管理层评论
        - 评级不是准备金分析
        - 索取精算准备金审查和不利发展历史
      - - 按承保主体划分的监管资本
        - 无法评估未来增长承载力或抗冲击能力
        - Demotech A 评级和盈余片段披露
        - 评级不显示各法人的精确资本缓冲
        - 索取 KIN 和 Nexus 法定报表
      - - 按队列披露的实际 CAC 和留存
        - 无法验证回本周期或客户终身价值（LTV）计算
        - 管理层关于一年回本和 10% 净流失的评论
        - 评论有用，但未经审计
        - 按承保批次索取队列 CAC、留存和费率变动分析
    notes: 这些缺失指标使外界无法给出完整的承保级判断，尽管 Kin 作为私人公司，公开披露已经异常充分。
