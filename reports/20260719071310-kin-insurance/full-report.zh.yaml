      - number: '6.3'
        title: 满意度、证明与留存信号
        blocks:
          - type: paragraph
            body: >-
              Kin 的公开客户证明在满意度上强于留存。公司已在 Google、BBB 和 Trustpilot
              上积累大量评价，数量看起来还在增长，这支持了它服务的不是一个很小试点队列，而是有意义的存量客户基础。公开材料还呈现了具名客户故事和具体用例：飓风前主动联系、快速协助防风减灾步骤，以及相较此前保费的大额节省。公司自己的评价中心还加入自报
              NPS 80，接近其引用行业平均值的两倍。但这些证明有真实边界。很多内容由公司选择或放大。具名故事生动但仍是轶事，就算外部评价平台，也更擅长衡量近期满意度，而不是长期留存或客户终身价值。最有信息量的反向信号来自
              Kin 自己委托的调查：重大理赔和天气损害会制造情绪压力，并可能推动房主在损失后考虑换保险公司。因此，客户证明偏正面，但耐久性证明仍不完整。
