      - number: '4.3'
        title: 资本充足性与风险转移
        blocks:
          - type: paragraph
            body: >-
              对 Kin 来说，资本充足性离不开再保险。公司材料显示，其分层资本栈由母公司股权资本、互助保险交易所盈余、巨灾债券和传统再保险组成。公开证据支持这里有真实深度。Kin 称旗下承保主体持有 Demotech A
              财务稳定评级，获得 40 多家高评级或抵押化再保险公司的支持，项目包括 2022 年 $770M 巨灾保障、2023 年 $860M Florida 保护，以及 2022 年一笔从 $100M 目标上调到
              $175M 的巨灾债券。管理层还称，近期巨灾债券定价比大盘好 300 个基点。不过，更大的行业背景同样重要：Florida 承保商 2024
              年恢复承保盈利，但仍远比全国财产保险平均水平更依赖再保险，全球巨灾损失也继续处于高位。因此，Kin 的融资故事不只是“我们融到了股权”，而是“我们在结构性波动市场中仍能获得多种风险资本”。
