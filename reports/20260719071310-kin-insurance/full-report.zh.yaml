chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、结构与运营版图
        blocks:
          - type: paragraph
            body: >-
              Kin Insurance
              更应该被看作一家围绕巨灾高发市场搭建的数字优先房主险公司，而不是一家泛化保险代理机构。无论官方材料还是独立报道，公司都持续把自己描述为直接面向消费者的供应商：砍掉外部代理人，依靠数千个物业层面数据点，试图比仍依赖粗颗粒地理均值的传统承保商更精准地给房屋定价。结构很关键：Kin
              没有止步于分销商。2019 年，它在 Florida 推出 Kin Interinsurance Network 作为互助保险承保主体，同时在其他州继续做 MGA 和经纪业务；到 2024–2026
              年，公司已称自己管理两个互助保险交易所。版图也明显扩张，从最初聚焦 Florida，到 2025 年 Series E 公告时覆盖 13 个州，再到 2026 年 3 月季度覆盖 14 个州。实际结论是，Kin
              已不再是狭窄的 Florida 试验，而是一家仍集中于高风险房主地理区域、但已经规模化的多州保险公司。
