      - number: '4.2'
        title: 单位经济性与经营杠杆
        blocks:
          - type: paragraph
            body: >-
              Kin 的公开发布对利润率架构披露得异常明确，但仍需要谨慎处理。公司用非 GAAP
              定义报告毛利和经营指标，这些定义很重要：销售成本包含客户服务和内部理赔人力，意味着标题毛利率并不等同于纯软件毛利率。即便如此，已发布数字仍然强劲。2025 年和 Q1 2026 毛利率都维持在约
              94%，基准经营利润率则从 2024 年的 33% 提升到 2025 全年的约 49% 和 Q1 2026 的 50%。管理层还给出了罕见的获客经济性代理指标。Q1 2026，Kin 花费约 $30.7M
              增长费用，获取约 $15.8M 新 ARR 等价收入，并称这笔支出会在首次续保时、约一年后，在约 10% 净流失率的 ARR
              流上打平。这些信号令人鼓舞，但距离完整可承保模型仍有距离，因为公开来源没有披露合并现金流、各州 CAC，或按产品队列实现的赔付率表现。
