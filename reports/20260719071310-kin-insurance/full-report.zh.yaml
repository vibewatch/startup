  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 价格锚点与建议框架
        blocks:
          - type: paragraph
            body: >-
              估值讨论从我们唯一干净的私募市场价格锚点开始：Kin 2025 年 9 月按 $2B 估值完成的 Series E。这个标题数字必须放在两种相互竞争的现实中判断。正面看，Kin 已不再是规模前的保险科技故事。公开
              2025 年结果显示，公司收入 $201.6M、总承保保费 $634.4M、报告毛利率很高，基准经营利润率创纪录。公司进入 2026
              年时还有更大的续保基础，这正是投资人希望在一家曾经像纯增长故事的保险公司里看到的东西。谨慎面看，Kin
              仍在巨灾暴露市场运营，再保险成本、诉讼条件和天气严重程度都可能快速改变估值。因此，实际建议既不是“无论如何都太贵”，也不是“显然便宜”。更合适的是有条件推进：如果近期经济性真实且可持续，$2B
              标记在可辩护区间内；但新资金在把该轮视为明确有吸引力之前，应要求更好的承保主体层面赔付率、股权结构表条款和资本充足性尽调。
