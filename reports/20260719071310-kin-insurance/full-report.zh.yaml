      - number: '1.3'
        title: 融资路径、估值标记与运营规模
        blocks:
          - type: paragraph
            body: >-
              作为私营保险公司，Kin 的资本历史覆盖度异常高，但并没有完全对齐。公司公开路径从 2017 年宣布 $4M 种子轮，走到 2021 年 $69.2M Series C、2022 年首关 $82M
              且计划二次交割的 Series D、2023 年与独角兽身份相关的延期轮，再到 2025 年 9 月按 $2B 投前估值完成 Series E。2025 年这笔融资尤其重要，因为它把股权融资与 $200M
              债务授信放在一起，而且发生在 Kin 已经证明具备实质运营规模之后。公开文件和新闻报道支持 2024 年总承保保费 $495.3M、2025 年 $634.4M，以及 Q1 2026 有效保费
              $666.8M。仍然混乱的是累计股权融资额：Kin 自己的 Series E 页面写 $330M，而 PR Newswire 和独立报道写
              $286M。相对企业价值，这个差异不大；但对稀释测算和资本效率分析来说，差异已经足够重要。
