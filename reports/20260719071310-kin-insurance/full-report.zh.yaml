      - number: '6.2'
        title: 获客与购买旅程
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Kin 获客靠数字发现、直接报价和真人跟进的组合，而不是纯自助漏斗。Mary Dickson
              的评测故事有用，并不是因为它具备统计代表性，而是因为它揭示了公司设想的旅程：房主在线搜索防风减灾等实际需求，填写简短申请，迅速获得真人跟进，得到验房或换保协调帮助，然后基于更好保障和更低价格转化。评测报道和州页面也强化了这个模式。Kin
              强调清晰的保障选择、减灾和无理赔折扣，以及通过电话、邮件、聊天或现场代表提问的能力。The Zebra 提到 89% 的 Kin
              客户会与真人代理合作，这一点重要，因为它把客户旅程重新定义为数字发起、但仍由建议支持。对巨灾高发市场来说，这种混合旅程大概率是优势，因为房主需要安心感；但它也意味着 Kin 不是一家零接触消费者 App 公司。
