      - number: '7.4'
        title: 风险结论与监控
        blocks:
          - type: paragraph
            body: >-
              总体风险判断是严重但并非致命。Kin 比典型初创公司有更多可见缓释，因为它按真实保险机制运营：Demotech 评级承保主体、巨灾债券、再保险塔、互助保险结构和有记录的风暴响应程序。这让业务比一个单纯营销驱动的
              MGA
              叙事更有韧性。与此同时，风险彼此高度耦合。气候波动推高已保险损失；更高损失推高再保险成本；更高再保险成本挤压价格和容量；价格压力影响需求和留存；风暴中的运营失误又可能迅速变成监管、财务和声誉问题。实际含义是，尽调应少看抽象的“AI
              原生”说法，多看可监控阈值：再保险成本趋势、州级赔付率、事件后响应时间、投诉模式、数据治理成熟度，以及外部资本附带条件。如果这些指标守得住，Kin 的专业化仍可防守；如果它们一起恶化，业务可能很快被下调估值。
