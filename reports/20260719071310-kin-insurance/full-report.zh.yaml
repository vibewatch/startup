      - number: '1.4'
        title: 客户证明、公开里程碑与剩余缺口
        blocks:
          - type: paragraph
            body: >-
              运营叙事可信，是因为支撑它的不只是融资标题。Kin 在 2021 年达到 $100M 年经常性保费里程碑，随后在 2024 和 2025
              年继续复合增长，同时保持正经营利润和较高基准利润率。公开评价信号也确实有分量：到 2025 年末和 2026 年初，Kin 已公布数千条 Google、BBB 和 Trustpilot 评价，并披露内部 NPS
              为 80。对一个直接面向消费者的品牌来说，这些证明点有意义，因为信任和理赔体验会驱动续保经济性。即便如此，公开记录在后期尽调关键领域仍不完整。独立评测提到 Kin 缺少移动 App，J.D. Power
              可见度较低；BBB 页面本身不足以判断投诉严重程度；当前可信的公开员工数和董事会图谱也仍缺失。结果是，这家公司在私营保险公司中运营披露异常好，但还不足以把所有后期指标都视为已经完全解决。
