      - number: '2.2'
        title: 买方、细分与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方和付款方通常是房主家庭，但采用路径更多受按揭贷款机构和巨灾焦虑塑造，而不只是自主比价购物。公开消费者评测和各州产品页反复指出，即便法律没有强制，按揭贷款机构也常要求房主购买保险。房屋一旦融资，这个品类就变成非可选支出；巨灾暴露则决定既有市场能否以可承受价格供给保障。Kin
              披露的产品页显示出务实的细分方法：标准房主险、公寓业主险、房东险、移动房屋险、洪水，以及后来叠加到核心房屋拥有流程上的车险和金融产品。在这个框架里，最缺服务的客户不是普通低风险郊区家庭，而是身处野火、飓风、冰雹、洪水和诉讼密集市场的业主，他们面对承保商退出、不续保或保费大幅上涨。客户调研证据也强化了这种痛点。理赔和保费冲击会触发换保、装修投入，甚至搬家；只要承保能通过，客户就有真实意愿尝试新保险公司。
