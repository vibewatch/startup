      - number: '6.4'
        title: 扩张与集中风险
        blocks:
          - type: paragraph
            body: >-
              客户扩张有可能，集中风险也真实存在。围绕车险和房屋金融的公开评论显示，Kin 正试图把房主关系从年度保单延伸得更深；第三方报道称，这些产品在符合条件客户中数月内已达到约 10%
              附加率。这具备战略意义，因为多险种互动可以改善留存、降低获客依赖。与此同时，客户基础仍集中在巨灾高发州，以及面对极端天气暴露、保费压力或保障稀缺的房主中。制造需求的同一批环境因素，也会在重大理赔、保费上涨或恶劣天气季之后制造流失压力。Kin
              的调查结果凸显了这个风险：许多房主会在重大理赔后考虑换保，有些人在保险赔付之后仍支付大额自付费用。依赖评价的证据和州落地页也无法告诉我们头部州集中度、各州获客成本、续保留存或按细分的盈利能力。结果是，客户故事有前景但仍不完整：细分匹配强、满意度信号好，但气候和集中风险很可能让客户基础比标题评级暗示的更脆弱。
