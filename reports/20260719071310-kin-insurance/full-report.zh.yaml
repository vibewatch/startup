  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 巨灾与监管风险
        blocks:
          - type: paragraph
            body: >-
              Kin 的定义性优势和定义性风险是同一件事：它有意在巨灾高发、难做的保险市场写房主险业务。这创造了差异化需求，也把公司放进美国财产保险体系中最波动的部分。Florida
              是最清楚的例子。独立报道显示，该州市场在多年亏损和诉讼改革后于 2024 年改善，但结构上仍比全国平均水平更依赖再保险。California、Mississippi、Louisiana
              和其他暴露州又增加了野火、飓风、冰雹和龙卷风复杂度。Swiss Re、Munich Re、LexisNexis 和 NOAA
              的全球巨灾成本数据进一步说明，这不是单一州问题，而是上升中的结构趋势。叠在物理风险之上的，是逐州法律复杂性：California 的盈余线结构、各州不同承保和分销实体、Florida 与 AOB
              相关的理赔滥用，以及 Kin 进入更多司法辖区后上升的许可负担。这里的风险不只是发生损失，而是频繁损失、监管变化和法律摩擦可能同时复合，推高再保险成本和保费，带来客户流失，并收紧增长容量。
