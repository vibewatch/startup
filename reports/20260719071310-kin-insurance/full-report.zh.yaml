  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 细分与地理匹配
        blocks:
          - type: paragraph
            body: >-
              Kin
              的核心客户不是美国中位数房主。公司明确瞄准那些在受飓风、野火、冰雹或其他气候波动影响的市场中需要房屋保险的人；它许多公开页面也写成教育优先的指南，面向可能难以从传统承保商那里获得有吸引力保障的客户。可见细分同时按地理和产品展开。地理重要，是因为
              Kin 活跃州集中在 Florida、California、Texas、Louisiana
              和更广泛美国东南部等高风险或价格承压地区。产品重要，是因为公司不只销售单一标准房主险表单，还覆盖房东、公寓业主、移动房屋业主，以及如今通过车险和房屋金融触达的相邻房主。这意味着 Kin
              的“客户”实际上是一组由巨灾暴露和价格敏感性连在一起的房主细分。好处是与服务不足家庭高度匹配；风险是客户集中度仍偏向波动州和理赔密集风险池。
