      - number: '3.4'
        title: 护城河耐久度与反向竞争信号
        blocks:
          - type: paragraph
            body: >-
              Kin 的护城河可信，但有条件。证据最扎实的差异化不是泛泛的“AI
              原生”表述，而是巨灾市场承保意愿、物业层面承保颗粒度，以及能在困难地区持续写业务的资本栈组合。这比改进结账流程更难让传统巨头快速复制。但护城河并非不会被侵蚀。Lemonade 仍在扩大客户基础，公开市场仍给
              App 驱动保险以数十亿美元价值，Hippo 的房屋保护逻辑也与 Kin 试图成为更广义房屋拥有平台的努力重叠。Branch 和 Openly
              说明，其他挑战者也能用合作伙伴、交易所和代理机构来降低获客成本或扩大建议覆盖，而不必自建纯直接面向消费者引擎。公开证据也留下缺口：可比口径的保费比较很弱，竞争者留存经济性大多私有，依赖证言的来源会高估服务质量。因此，竞争结论是平衡的：Kin
              看起来有足够差异化，值得重视，但并不能免疫捆绑压力、移动体验压力，或价格改善后传统巨头重新收缩回巨灾市场带来的压力。
