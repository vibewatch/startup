      - number: '4.4'
        title: 财务结论与缺口
        blocks:
          - type: paragraph
            body: >-
              财务结论方向偏正面，但仅靠公开来源还无法完全承保。Kin
              的收入真实且在增长，续保组合在改善，公司也证明了自己能在继续投入增长和技术的同时产生正经营利润。它看起来还拥有可信的股权和再保险市场入口；对一家暴露于巨灾风险的保险公司来说，这并不简单。但公开材料仍留下关键未知数。股东利益口径展示排除了互助保险交易所和自保公司等可变利益实体，因此最清晰的法定承保主体视角仍不在母公司层面的发布里。手头现金、月度烧钱速度、准备金发展、逐州盈利能力和压力下资本充足性，都没有以足以支撑充分确信承保结论的形式公开披露。Lemonade
              和 Hippo 的公开同业文件有助于界定“好披露”长什么样，但不能替代 Kin
              自己缺失的数字。结果是，这家公司看起来比许多后期风投支持的初创公司财务更强，却仍需要私下尽调，才能把盈利能力和现金跑道视为结论性验证。
