        - 未来 12-18 个月收入向 $275M-$300M 靠拢，续约经济性保持强劲，交叉销售加深，再保险市场仍可用。
        - $2.6B-$3.2B 的估值支撑变得可信，相比当前标记价格有可观上行。
        - 需要巨灾韧性持续，且公开保险科技可比公司的倍数不明显压缩。
        - 低至中
      - - 基准
        - 收入按当前运行率年化并小幅上行，利润率保持强劲，但增长放缓。
        - $1.9B-$2.4B 看起来站得住，说明当前轮次大致合理。
        - 即使执行不错，也可能只是验证当前价格，而不是明显超过它。
        - 中
      - - 悲观
        - 增长放缓，巨灾损失或再保险成本恶化，投资人更像给周期性专业保险商定价，而不是给保费增长平台定价。
        - $1.2B-$1.6B 更容易解释，意味着相对 Series E 标记价格存在真实下行。
        - 即便客户需求没有崩塌，倍数压缩也能带来下行。
        - 中
    notes: 由于公开的承保主体层面现金流细节不足，情景区间采用收入质量和倍数逻辑，而不是 DCF。
