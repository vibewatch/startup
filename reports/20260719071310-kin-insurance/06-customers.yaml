    - Florida page, review stories, and storm-outreach references
    - Largest and most strategically important concentration zone
    - No public state-level retention or profitability
  - - California wildfire and rebuild-cost-aware households
    - Homeowner / homeowner / homeowner
    - Need education around rebuild, ordinance, solar, ADU, and earthquake adjacency
    - California page provides detailed education-first content
    - Shows Kin can win informed buyers in tough markets
    - No public conversion or close-rate data
  - - Landlords, condo owners, and mobile-home owners
    - Property owner / property owner / property owner
