- id: acquisition-and-buying-journey
  title: Acquisition and buying journey
  body: 'Public evidence suggests Kin acquires customers through a mix of digital discovery, direct quoting, and human follow-up rather than through a purely self-serve funnel. Mary Dickson’s review story is useful here not because it is statistically representative, but because it reveals the intended journey: a homeowner searches online for a practical need such as wind mitigation, fills out a short application, receives rapid human follow-up, gets help coordinating an inspection or switch, and then converts based on better coverage and lower price. Review coverage and state pages reinforce this pattern. Kin emphasizes clear coverage choices, discounts for mitigation and claims-free behavior, and the ability to ask questions by phone, email, chat, or live representative. The Zebra’s note that 89% of Kin customers work with live agents is important because it reframes the customer journey as digitally initiated but still advice-supported. That hybrid journey is probably a strength in catastrophe-prone
    markets where homeowners need reassurance, but it also means Kin is not simply a zero-touch consumer app business.'
  claimRefs:
