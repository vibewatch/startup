  - - Auto and home-finance cross-sell households
    - Existing Kin homeowner / homeowner / homeowner
    - Bundled protection and financing simplification
    - Q1 2026 release + cross-sell reporting
    - Important retention and LTV lever
    - Economics and attachment by segment still thin
  notes: The visible segmentation is mostly geography- and use-case-based because Kin does not publish a detailed customer-count or segment-revenue breakdown.
