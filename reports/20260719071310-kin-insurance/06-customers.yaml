  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: Annual and cohort renewal retention by state, product, and claim history.
    whyItMatters: Review scores can look excellent even while retention weakens after claims or rate increases.
    diligencePath: Request customer cohorts showing renewal rates, premium changes, and post-claim churn.
    relatedQuestionRefs:
    - QU014
    - QU020
    relatedTableRefs:
    - TU004
    - TU005
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Customer, premium, and loss concentration by state and top acquisition channel.
    whyItMatters: Kin’s apparent fit in catastrophe-prone markets may also mean outsized exposure to a few geographies or acquisition surfaces.
    diligencePath: Request state-level policy counts, premium mix, and channel-sourced new-business volumes.
    relatedQuestionRefs:
    - QU005
    - QU021
    relatedTableRefs:
    - TU001
    - TU005
    - TU006
  - type: missing-source
    severity: minor
    topic: adjacency-adoption
    missingEvidence: Segmented adoption and renewal data for auto insurance, home finance, and partner-led add-ons.
    whyItMatters: Cross-sell is strategically important, but public evidence only gives early attachment anecdotes.
    diligencePath: Request attach, retention, and contribution metrics by product and by original homeowner cohort.
    relatedQuestionRefs:
    - QU017
    - QU024
    relatedTableRefs:
    - TU001
    - TU002
    - TU005
  - type: missing-source
    severity: minor
    topic: named customer proof sampling
    missingEvidence: A fuller, independently corroborated set of named customer proofs across states, products, and claim outcomes.
    whyItMatters: The named stories in public sources are useful but selective, so they cannot stand in for a representative customer-proof ledger.
    diligencePath: Request broader customer-reference lists, complaint summaries, and renewal cohorts that pair named use cases with outcome metrics.
    relatedQuestionRefs:
    - QU020
    relatedTableRefs:
    - TU003
