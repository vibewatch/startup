- id: expansion-and-concentration-risks
  title: Expansion and concentration risks
  body: 'Customer expansion is plausible, but concentration risk is real. Public commentary around auto insurance and home finance shows Kin trying to deepen the homeowner relationship beyond the annual policy, and third-party coverage says these products already achieved roughly 10% attachment within months among eligible customers. That is strategically important because multiline engagement can improve retention and reduce acquisition dependence. At the same time, the customer base remains concentrated in catastrophe-prone states and in homeowners facing extreme-weather exposure, premium stress, or coverage scarcity. The same environmental factors that create demand can also create churn pressure after major claims, premium increases, or bad weather seasons. Kin’s survey results underscore that risk: many homeowners consider switching after a major claim, and some pay large out-of-pocket amounts even after insurance payouts. Review-heavy evidence and state landing pages also do not tell
    us top-state concentration, customer acquisition cost by state, renewal retention, or profitability by segment. The result is a promising but still incomplete customer story: strong niche fit and good satisfaction signals, offset by the probability that climate and concentration risk make the customer base more fragile than headline ratings imply.'
