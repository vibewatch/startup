- id: claims-and-service-delivery
  title: Claims and service delivery
  body: 'Claims are where Kin’s product promise becomes operationally testable. The company offers a clearly digitized claims workflow: losses can be reported 24/7 online, through the customer portal, or by phone; customers are told to expect specialist contact within 24 hours and often within minutes; and payouts can move by direct deposit, e-check, or mailed check. Snapsheet deepens this picture by giving Kin an external platform for omnichannel intake, automated workflows, and digital settlements from first notice through payment. Service promises extend beyond claims filing. Kin’s reviews page says the company reaches out before, during, and after major weather events, and the state product pages heavily emphasize discounts for mitigation, water detection, and claims-free behavior. That creates a blended model of insurance plus homeowner guidance. The caution is that public materials mostly show designed process, not measured operational outcomes, so cycle-time and automation claims
    should still be treated as directionally positive rather than fully audited.'
  claimRefs:
  - CE011
  - CE012
