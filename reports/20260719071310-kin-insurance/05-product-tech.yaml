- id: underwriting-data-and-architecture
  title: Underwriting data and architecture
  body: 'Kin’s clearest technical differentiation remains underwriting granularity. The company repeatedly describes its platform as data-rich, with thousands—and in one 2021 release, more than 10,000—property data points feeding pricing and coverage decisions. The Cape Analytics partnership makes that concrete: Kin uses geospatial imagery, computer vision, and machine learning to ingest roof condition, tree coverage, pool presence, and hazard-specific features tied to wind, wildfire, and water risks. That matters because Kin is not just automating paperwork. It is using external data and internally built policy and pricing infrastructure to decide which homes are more resilient and how much coverage should cost. Lucas Ward’s 2019 description of an in-house policy-administration system, catastrophe-modeling expertise, and pricing depth supports the idea that Kin owns core insurance logic rather than merely wrapping another carrier’s rating engine. The tradeoff is dependency risk: public
    evidence does not show detailed model governance, vendor SLAs, or uptime metrics.'
  claimRefs:
  - CE019
  - CE020
  - CE021
  - CE022
  - CE023
  - CE024
  - CE025
  - CE041
