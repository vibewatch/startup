- id: TE003
  title: Claims workflow and service promises
  columns:
  - Step
  - Publicly described process
  - Why it matters
  - Open question
  rows:
  - - FNOL
    - Report online, via portal, or by phone 24/7
    - Low-friction intake is table stakes for a digital insurer
    - No public disclosure of first-response SLA attainment
  - - Specialist assignment
    - Contact within 24 hours, usually within minutes
    - Signals human support behind the digital workflow
    - No published staffing ratio or queue data
  - - Inspection
    - Home or virtual depending on claim type
    - Allows remote and flexible adjustment
    - No public virtual-adjustment success metrics
  - - Coverage review
    - Specialist estimates damages and explains available coverage
    - Important for trust and payout clarity
    - No published dispute or supplement rate
  - - Payment
    - Direct deposit, e-check, or mailed check
    - Convenient digital settlement is differentiating for D2C
    - No payout-time distribution disclosed
  - - Fraud / rights support
    - NICB hotline and state rights references
    - Shows some trust and compliance scaffolding
    - Complaint-resolution data still thin
  notes: This is a process map built from claims and partnership pages, not a measured operations dashboard.
