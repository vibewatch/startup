- id: compliance-trust-and-product-gaps
  title: Compliance, trust, and public product gaps
  body: 'Kin’s public materials are unusually explicit about state-by-state compliance constraints, which is a positive signal for a regulated product. The California pages and legal disclosures clearly flag surplus-lines distribution and non-admitted underwriting, while the legal page also explains how the company uses different policy forms and agency entities by state. That said, transparency is strongest at the customer-form level, not at the systems-control level. There is little public detail on cyber-security, model-risk governance, or claims-vendor oversight. Consumer-review coverage also surfaces a more mundane product gap: CNBC still described Kin as lacking a mobile app despite its otherwise digital experience. Finally, Kin’s partner network with Oncourse and Cinch shows ambition to make homeownership more manageable and preventive, but public evidence does not quantify attachment, claims reduction, or margin contribution from those add-ons. Overall, the product and technology
    story is credible, but the control and economics layers are still under-disclosed.'
