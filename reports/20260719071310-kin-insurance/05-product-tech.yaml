- id: TE004
  title: State-specific product and legal structure
  columns:
  - State / context
  - Structure
  - Key disclosed nuance
  - Implication
  rows:
  - - California
    - Surplus-lines distribution + non-admitted carrier
    - Policies marketed through Kin Distributor Insurance Services
    - Reach expands, but admitted-market simplicity is lower.
  - - Florida
    - Reciprocal carrier / direct home products
    - Flood endorsement can be bundled with homeowners coverage
    - Product integration is strongest in Kin’s original market.
  - - Outside FL/LA owner-occupied homes
    - Kin House & Property + owner-occupied endorsement
    - Base form differs from standard homeowners naming
    - Readers must not assume one form nationwide.
  - - Landlord use case
    - HD3-style base policy logic
    - Rental use relies on a different coverage configuration
    - Supports product flexibility without a separate stack.
  - - Texas auto
    - Separate adjacent policy class
    - Adds vehicle coverage to homeowner relationship
    - Extends wallet share beyond the house itself.
  notes: The legal page and state launch materials make clear that product structure varies materially by jurisdiction and use case.
