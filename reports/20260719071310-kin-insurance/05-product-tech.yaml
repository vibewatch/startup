- id: TE006
  title: Partner and dependency map
  columns:
  - Partner / dependency
  - Function
  - Why Kin uses it
  - Risk if dependency weakens
  rows:
  - - Cape Analytics
    - Remote property intelligence
    - Speeds underwriting and improves hazard granularity
    - Data quality or access degradation could reduce pricing edge.
  - - Snapsheet
    - Claims workflow and settlement software
    - Supports omnichannel claims automation
    - Vendor issues could slow or complicate claims operations.
  - - Oncourse Home Solutions
    - Water / sewer protection programs
    - Broadens homeowner protection beyond standard policy perils
    - Attach rates and customer value are not publicly disclosed.
  - - Cinch Home Services
    - Home service plans / preventive support
    - Extends engagement into day-to-day homeownership
    - Economic contribution and customer uptake remain unclear.
  - - Reciprocal carriers and agency entities
    - Risk bearing and distribution
    - Allow Kin to control more of the journey than a pure marketplace
    - Adds compliance and operational complexity relative to broker-only models.
  notes: This map is intentionally partial. It captures the external dependencies visible in reviewed sources, not the full vendor or internal-service ecosystem.
