chapter:
  number: 5
  title: Product & Technology
  summary: Kin’s product surface has expanded from core homeowners coverage into a broader homeownership platform spanning flood, landlord, condo, mobile-home, auto, financing, and protection add-ons. The strongest evidence supports a data-rich underwriting stack built around proprietary pricing logic, Cape Analytics property intelligence, and Snapsheet-driven claims automation; the biggest remaining gaps are module-level economics, operational reliability metrics, and deeper security and vendor-governance disclosure.
sections:
- id: product-surface-and-customer-workflow
  title: Product surface and customer workflow
  body: 'Kin is no longer a single-product homeowners start-up. The public product surface now includes core homeowners coverage plus condo, landlord, mobile-home, flood, auto, and home-finance extensions. The consistent design choice across those products is direct-to-consumer simplicity: Kin emphasizes online quotes, digital customization, and direct service rather than a branch-and-agent network. Even its state product pages read like guided configuration flows, explaining dwelling, liability, deductible, and endorsement choices in plain language. The breadth is strategically important because it lets Kin deepen wallet share with the same homeowner over time, but the company is still clearly centered on the home as the primary relationship. Auto and financing are framed as adjacent homeowner services rather than a pivot away from property insurance. The main structural nuance is that the legal product form changes by state. California uses a surplus-lines distribution structure, while
    other states rely on reciprocal carriers or endorsed forms that are closer to standard homeowners packages.'
