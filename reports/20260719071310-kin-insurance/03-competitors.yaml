- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Why it matters
  - Mitigation / diligence ask
  rows:
  - - Catastrophe specialization
    - Incumbents re-enter high-risk states if pricing hardens
    - High
    - Kin could lose some scarcity premium if large carriers regain appetite
    - Track state-by-state filing and competitor appetite changes
  - - Direct digital economics
    - App-led peers like Lemonade out-execute on mobile UX
    - Medium
    - Acquisition and retention can shift toward the most convenient experience
    - Request mobile adoption, retention, and claims-satisfaction data
  - - Homeownership-platform expansion
    - Hippo and Branch already push broader bundle/service stories
    - Medium
    - Kin’s adjacent products may remain too narrow to close bundle gap
    - Ask for attach rates, CAC by product, and product-line contribution margin
  - - Reciprocal / reinsurance-backed trust
    - Public-company peers offer deeper disclosure and comparables
    - Medium
    - Private status can make capital adequacy harder for buyers and investors to assess
    - Request statutory detail, renewal retention, and reinsurance counterpart data
  - - Agency bypass
    - Openly and incumbents can use trusted advisors to preserve distribution
    - Medium
    - Consumers may still prefer local advice over direct purchase
    - Measure close rates with and without live-agent assistance
  - - Specialty-market fit
    - Public review sites still flag limited availability and coverage breadth
    - Medium
    - Niche fit can look like narrowness outside core states
    - Track expansion success and bundle attach outside Florida/Texas
  notes: Severity is qualitative and evidence-backed rather than numerically modeled because competitor-level retention and margin data remain mostly private.
