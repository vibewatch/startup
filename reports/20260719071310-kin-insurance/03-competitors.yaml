  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: premium-comparability
    missingEvidence: Normalized quote comparisons for the same property profile across Kin, insurtech peers, and incumbents.
    whyItMatters: Teaser prices and review-site savings claims are not enough to judge who really wins on price for the same risk.
    diligencePath: Run broker-style mystery-shopping scenarios across standardized homes in Florida, Texas, and California.
    relatedQuestionRefs:
    - QP014
    - QP018
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: retention-economics
    missingEvidence: Competitor-level retention, renewal pricing change, CAC, and loss-ratio data for private peers such as Kin, Branch, and Openly.
    whyItMatters: Competitive durability in insurance is mostly economic, but the most decision-useful metrics are private for much of the peer set.
    diligencePath: Request internal cohort retention, quote-to-bind, and loss-ratio data by state and product.
    relatedQuestionRefs:
    - QP020
    - QP024
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: minor
    topic: service-benchmarking
    missingEvidence: Independent like-for-like claims-cycle and claims-satisfaction benchmarking across Kin, Hippo, Lemonade, Branch, and incumbents.
    whyItMatters: Testimonial-heavy sources can overstate service quality and understate edge-case handling.
    diligencePath: Collect NAIC complaint trends, app-store ratings over time, and third-party claims-service benchmarks.
    relatedQuestionRefs:
    - QP011
    - QP019
    relatedTableRefs:
    - TP002
