- id: pricing-trust-and-switching-costs
  title: Pricing, trust, and switching costs
  body: 'Most public pricing evidence in insurance is marketing-layer evidence, not realized-rate evidence, and that is true here. Lemonade is the only reviewed competitor that cleanly publishes a homeowners starting price, while Branch, Hippo, Kin, and incumbents emphasize personalized quotes, savings, or coverage guidance. As a result, the more durable competitive read comes from trust and switching frictions rather than teaser rates. Lemonade and Hippo benefit from public-company disclosure and recognizable digital brands. State Farm and Allstate benefit from massive installed bases, multiline bundles, and agent familiarity. Kin counters with strong public financial-strength language around Demotech ratings, policyholder-owned reciprocal structures, and broad reinsurance backing. Yet review coverage still highlights some limits: Kin remains geographically narrower than incumbents, its coverage breadth is more focused, and CNBC still flagged the absence of a mobile app. The result is a
    mixed picture: Kin can win on specialty fit and price in hard markets, but many buyers will still value the convenience of incumbent bundling or the polished mobile experience of digital peers.'
