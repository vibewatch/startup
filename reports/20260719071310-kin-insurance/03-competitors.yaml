  rows:
  - - Kin
    - Direct-to-consumer cat-focused insurer
    - Private; 2025 Series E at $2B; 2025 GWP $634.4M
    - Homeowners in catastrophe-prone or hard-to-place markets
    - Property-level underwriting and catastrophe specialization
    - Narrower multiline bundle and lighter app/mobile polish than some peers
  - - Hippo
    - Hybrid digital insurer / home-protection platform
    - Public company; 500K+ homeowners; 70+ carrier partners
    - Mainstream homeowners plus add-ons and home services
    - Homeownership services, app support, partner capacity
    - Less purely direct than Kin; agent/expert remains in the flow
  - - Openly
    - Agent-centric MGA / program administrator
    - Private; distributed through independent agencies
    - Higher-coverage homeowners via agents
    - Agent efficiency and high-liability positioning
    - Not a direct brand in the same way as Kin or Lemonade
  - - Branch
    - Bundled digital insurer / exchange model
    - Private; partner-led distribution through lenders and ecosystem channels
    - Home + auto households, especially at purchase/refi moments
    - Bundled savings and embedded distribution
    - Geographic limits and higher partner dependence
  - - Lemonade
    - App-led full-stack digital carrier
    - Public company; 3.14M customers; $1.33B IFP Q1 2026
    - Broad consumer personal-lines buyers
    - Fast UX, app claims, broad personal-lines adjacency
    - Less specialized than Kin in high-cat homeowners
  - - Allstate
    - Incumbent multiline carrier
    - Large national brand and installed customer base
    - Mass-market homeowners and bundle seekers
    - Brand trust, multiline bundling, agent reach
    - Legacy experience and less cat-specialized positioning
  - - State Farm
    - Incumbent multiline carrier
    - Large national brand and agency network
    - Mass-market homeowners and long-tenure households
    - Agent trust, multiline relationship, household stickiness
    - Digital simplicity may lag digital-first challengers
  notes: This table uses public signal strength rather than normalized premium or loss data because private insurers disclose far less than public peers and pricing is heavily quote-specific.
