- id: distribution-experience-and-bundling
  title: Distribution, experience, and bundling
  body: 'Distribution architecture is one of the sharpest separators in this market. Kin and Lemonade tell a more direct-to-consumer story, even if both still use human support where needed. Branch combines digital quoting with lender and partner distribution, which can lower customer-acquisition friction around the mortgage moment. Openly is explicitly agent-centric and therefore competes more by making independent agencies more efficient than by replacing them. Hippo falls between these models: the site promises easy online comparison, but a dedicated expert or agent remains central to selecting a policy. Incumbents preserve their power through local agents, existing customer relationships, escrow familiarity, and broad bundling. That matters because homeowners insurance is sticky; people do not switch every year unless there is a pricing shock, service failure, or a life event such as a move or refinance. Kin’s young auto and home-finance products are strategically important because they
    are attempts to reduce that bundling gap, but management commentary and third-party coverage still frame them as early rather than mature advantages.'
