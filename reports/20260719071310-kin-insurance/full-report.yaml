      - number: '7.3'
        title: Capital, people, and execution risks
        blocks:
          - type: paragraph
            body: >-
              Kin’s capital structure reduces some risks while creating others. Reinsurance, catastrophe bonds, and
              outside financing have helped the company keep writing business and absorb events, but those protections
              also make Kin dependent on favorable external capital markets. If catastrophe losses remain high, or if
              investor appetite for Florida and coastal risk deteriorates, the cost or availability of capacity can
              change quickly. Kin’s $145 million debt facility is helpful, but milestone-based tranches create their own
              execution and covenant-style risk. Expansion also multiplies operational burden. Acquiring a carrier with
              licenses in 43 states broadens optionality, yet every new state adds compliance, staffing, underwriting,
              and service complexity. People risk is therefore meaningful: the company needs sufficient claims,
              underwriting, legal, engineering, and customer-service talent to support growth and storm-response surges
              simultaneously. Public materials suggest Kin is aware of this and has invested in hiring, but they do not
              show whether bench depth, control functions, and governance have scaled at the same pace as premium
              volume. This is especially important because a catastrophe insurer can look efficient in normal periods
              and brittle during stress if talent, reserves, and vendor coordination are not all ready at once.
