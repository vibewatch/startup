  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Price anchor and recommendation frame
        blocks:
          - type: paragraph
            body: >-
              The valuation discussion starts with the only clean private-market price anchor we have: Kin’s September
              2025 Series E at a $2 billion valuation. That headline must be judged against two competing realities. On
              the positive side, Kin is no longer a pre-scale insurtech story. Public 2025 results show $201.6 million
              of revenue, $634.4 million of gross written premium, very high reported gross margins, and record baseline
              operating margins. The company also entered 2026 with a larger renewal base, which is exactly what
              investors want to see in an insurer that once looked like a growth-only story. On the cautionary side, Kin
              still operates in catastrophe-exposed markets where reinsurance costs, litigation conditions, and weather
              severity can change valuation quickly. The practical recommendation is therefore neither “overpriced no
              matter what” nor “obvious bargain.” It is a conditional advance: the $2 billion mark is within a
              defendable range if recent economics are real and durable, but fresh capital should require better
              diligence on carrier-level loss ratios, cap-table terms, and capital adequacy before treating the round as
              clearly attractive.
