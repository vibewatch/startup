      - number: '7.4'
        title: Risk verdict and monitoring
        blocks:
          - type: paragraph
            body: >-
              The overall risk verdict is serious but not fatal. Kin has more visible mitigation than a typical startup
              because it operates with real insurer mechanics: Demotech-rated carriers, catastrophe bonds, reinsurance
              towers, reciprocal structures, and documented storm-response procedures. That makes the business more
              resilient than a simple marketing-led MGA narrative would imply. At the same time, the risks are tightly
              coupled. Climate volatility raises insured losses; higher losses raise reinsurance costs; higher
              reinsurance costs pressure prices and capacity; price pressure affects demand and retention; and
              operational missteps during a storm can quickly become regulatory, financial, and reputational problems.
              The practical implication is that diligence should focus less on abstract “AI-native” claims and more on
              monitorable thresholds: reinsurance cost trends, state-level loss ratios, response times after events,
              complaint patterns, data-governance maturity, and the conditions attached to external capital. If those
              indicators hold, Kin’s specialization remains defendable. If they deteriorate together, the business could
              de-rate very quickly.
