      - number: '1.2'
        title: Founders, leadership, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              The founder record is strongest around Sean Harper and Lucas Ward. Multiple sources tie Harper’s origin
              story to a long-standing interest in finance and software, and public interviews consistently show him
              framing Kin as an attempt to modernize a hidden software-heavy insurance supply chain. Ward appears less
              frequently in long-form profiles, but the sources that do quote him show a deeply technical role spanning
              policy administration, catastrophe modeling, and pricing infrastructure. Kin also broadened its executive
              bench in late 2022 by recruiting experienced leaders across finance, legal, people, and product, which
              suggests a company preparing for scaled operations rather than living purely off founder intuition. The
              disclosure gap is governance, not leadership identity. Public materials readily name investors and
              executives, but they do not provide a current board roster, observer map, or hard evidence on
              voting-control concentration. That omission does not invalidate the operating story, but it limits
              diligence on oversight quality and investor influence.
