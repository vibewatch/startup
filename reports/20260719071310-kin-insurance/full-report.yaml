    sections:
      - number: '6.1'
        title: Segments and geographic fit
        blocks:
          - type: paragraph
            body: >-
              Kin’s core customer is not the median U.S. homeowner. The company explicitly targets people who need home
              insurance in markets shaped by hurricanes, wildfires, hail, or other climate-driven volatility, and many
              of its public pages are written as education-first guides for customers who may have difficulty securing
              attractive coverage from legacy carriers. The visible segmentation is both geographic and product-based.
              Geography matters because Kin’s active states cluster in high-risk or price-stressed regions such as
              Florida, California, Texas, Louisiana, and the broader Southeast. Product matters because the company does
              not just sell a single standard homeowners form: it also addresses landlords, condo owners, mobile-home
              owners, and now adjacent homeowners through auto and home-finance offers. This means Kin’s “customer” is
              really a family of homeowner segments tied together by catastrophe exposure and affordability sensitivity.
              The benefit is sharp fit with underserved households; the risk is that customer concentration remains
              skewed toward volatile states and claim-heavy risk pools.
