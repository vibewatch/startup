  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and growth
        blocks:
          - type: paragraph
            body: >-
              Kin is not a conventional software company and should not be analyzed like one. The public releases make
              clear that shareholder-level revenue is primarily fee revenue tied to insurance production at the
              reciprocal exchanges and certain third-party carriers, split between new-policy revenue and renewal
              revenue. That structure matters because gross written premium is the operating-throughput metric, while
              reported revenue is a narrower monetization layer on top of that insurance activity. Public results show
              Kin scaling along both dimensions: gross written premium rose from $346.3 million in 2023 to $495.3
              million in 2024 and $634.4 million in 2025, while total revenue moved from $105.2 million to $156.1
              million and then $201.6 million. The book is also maturing: renewal written premium became the larger
              driver of growth in 2025, which is strategically important because renewals tend to carry better economics
              than first-year customer acquisition. Auto insurance and home finance extend the revenue story, but public
              evidence still frames them as early attachments to the core homeowners relationship rather than as
              independent profit centers.
