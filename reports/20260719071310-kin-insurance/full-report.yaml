        title: Customer proof, public milestones, and the remaining gaps
        blocks:
          - type: paragraph
            body: >-
              The operating narrative is credible because it is supported by more than financing headlines. Kin reached
              a $100 million annual recurring premium milestone in 2021, then continued compounding through 2024 and
              2025 while preserving positive operating income and a high baseline margin. Public review signals also
              appear genuinely substantial: by late 2025 and early 2026 Kin was publishing thousands of Google, BBB, and
              Trustpilot reviews plus an internal NPS claim of 80. Those proof points are meaningful for a
              direct-to-consumer brand in an industry where trust and claims experience drive renewal economics. Still,
              the public record remains incomplete in areas that matter for later-stage diligence. Independent review
              coverage flags the lack of a mobile app and thin J.D. Power visibility, the BBB page is not enough on its
              own to assess complaint severity, and there is still no trusted current public headcount or board map. The
              result is a company with unusually good operating disclosure for a private insurer, but not enough to
              treat all late-stage metrics as fully resolved.
