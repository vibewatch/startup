  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and solution classes
        blocks:
          - type: paragraph
            body: >-
              Kin is not fighting only one competitor archetype. The direct digital peer set includes Lemonade, Hippo,
              Branch, and Openly, but each attacks the homeowners job differently. Lemonade is an app-led, full-stack
              insurer that sells multiple personal lines. Hippo mixes home protection, service layers, and a network of
              carrier partners. Branch emphasizes bundled home-and-auto buying and lender-driven distribution. Openly is
              more of an agent-enablement MGA/program administrator than a pure direct-to-consumer brand. Against that
              peer set, Kin sits in a specific niche: digitally distributed homeowners coverage aimed at
              catastrophe-prone or otherwise hard-to-price markets, with an operating model built around granular
              property data and lower agent overhead. The other competitor class is the incumbent carrier universe
              represented here by Allstate and State Farm. Those firms are slower-moving digitally, but they still
              control trust, multiline breadth, and established agent relationships that shape buyer inertia. So the
              real market is not “Kin versus insurtech”; it is Kin versus consumers’ willingness to stay with a trusted
              incumbent, plus Kin versus newer digital brands with stronger app or bundling stories.
