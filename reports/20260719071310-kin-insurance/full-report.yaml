      - transmission to thesis
      - action implication
    rows:
      - - Reinsurance reprices sharply upward or capacity tightens
        - Two consecutive renewal cycles materially worse than management implies
        - Destroys the premium-multiple case by hitting margin, growth, and customer pricing at once
        - Move valuation stance from fair to rich or broken
      - - State-level loss ratios deteriorate
        - Core-state profitability weakens despite revenue growth
        - Shows the public earnings narrative is masking underwriting strain
