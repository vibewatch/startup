      - number: '1.3'
        title: Funding path, valuation marks, and operating scale
        blocks:
          - type: paragraph
            body: >-
              Kin’s capital history is unusually well covered for a private insurer, but not perfectly reconciled. The
              company’s public path moves from a $4 million seed announcement in 2017 to a $69.2 million Series C in
              2021, an $82 million Series D first close in 2022 with a planned second close, a 2023 extension tied to
              unicorn status, and then a September 2025 Series E at a $2 billion pre-money valuation. The 2025 package
              is particularly important because it combined equity with a $200 million debt facility and arrived after
              Kin had already proven material operating scale. Public filings and news coverage support $495.3 million
              of 2024 gross written premium, $634.4 million of 2025 gross written premium, and $666.8 million of premium
              in force by Q1 2026. What remains messy is the cumulative equity figure: Kin’s own Series E page says $330
              million, while PR Newswire and independent coverage say $286 million. That discrepancy is small relative
              to the enterprise value but large enough to matter for dilution math and capital-efficiency analysis.
