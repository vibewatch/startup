  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Catastrophe and regulatory risks
        blocks:
          - type: paragraph
            body: >-
              Kin’s defining strength and defining risk are the same: it deliberately writes homeowners business in
              catastrophe-prone and difficult insurance markets. That creates differentiated demand, but it also places
              the company inside the most volatile parts of the U.S. property-insurance system. Florida remains the
              clearest example. Independent reporting shows the state’s market improved in 2024 after years of losses
              and litigation reform, yet it also remains structurally more reinsurance-dependent than the national
              average. California, Mississippi, Louisiana, and other exposed states add wildfire, hurricane, hail, and
              tornado complexity. Global catastrophe-cost data from Swiss Re, Munich Re, LexisNexis, and NOAA reinforces
              that this is not a one-state problem but a rising structural trend. Layered on top of physical risk is
              state-by-state legal complexity: surplus-lines structures in California, different carrier and distributor
              entities by state, AOB-related claims abuse in Florida, and licensing burdens that increase as Kin enters
              more jurisdictions. The risk here is not merely that losses happen; it is that frequent losses, shifting
              regulation, and legal friction can all compound into higher reinsurance costs, higher premiums, customer
              churn, and tighter growth capacity at once.
