      - number: '2.3'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The market is being pulled in two directions at once. On one side, climate volatility, replacement-cost
              inflation, and legacy-carrier retreat are creating demand for new underwriting capacity and more granular
              risk selection. LexisNexis shows catastrophe claims already represent 42% of claims and 64% of losses,
              while Triple-I says replacement costs are up almost 30% over five years. Swiss Re and Munich Re show the
              same pressure at the reinsurance layer, with 2024 insured catastrophe losses at $137 billion and 2025 on
              trend toward $145 billion. On the other side, those same forces raise the bar for growth. Florida remains
              dependent on reinsurance, California’s FAIR Plan has ballooned, and state-specific rules on nonrenewal,
              pricing flexibility, and surplus-lines structures limit how quickly supply can scale. In other words, Kin
              is addressing a market with genuine need, but not an easy one. Growth is likely to be driven by carrier
              withdrawal, rate adequacy, mitigation technologies, and better underwriting accuracy—not by frictionless
              national roll-out.
