      - number: '2.2'
        title: Buyers, segments, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer and payer are usually the homeowner household, but the adoption path is heavily shaped by
              mortgage lenders and catastrophe anxiety rather than discretionary shopping alone. Public consumer-review
              and state product pages repeatedly note that homeowners insurance is often lender-required even where it
              is not legally mandated. That makes the category non-discretionary once a home is financed, while
              catastrophe exposure determines whether the incumbent market can supply coverage at a tolerable price.
              Kin’s disclosed product pages show a practical segmentation approach: standard homeowners, condo,
              landlord, mobile-home, flood, and later auto and financing products layered onto core homeownership
              workflows. Within that frame, the most underserved customers are not average low-risk suburban households;
              they are owners in wildfire, hurricane, hail, flood, and litigation-heavy markets who face carrier
              withdrawal, nonrenewal, or sharply rising premiums. The customer survey evidence reinforces that pain.
              Claims and premium shocks can trigger switching, renovation spending, or even relocation, creating real
              willingness to try new insurers when availability survives underwriting.
