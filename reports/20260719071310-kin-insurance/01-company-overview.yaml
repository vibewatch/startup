company:
  name: Kin Insurance
chapter:
  number: 1
  title: Company Overview
  summary: Kin Insurance is a Chicago-founded, direct-to-consumer home insurer that has grown from a Florida-focused insurtech into a multi-state reciprocal-platform operator with public evidence of substantial premium scale and profitability. The strongest support is around its 2019 carrier launch, 2021-2026 premium and revenue growth, and the September 2025 Series E at a $2 billion pre-money valuation; the biggest unresolved items are cumulative equity reconciliation, current headcount, and board-level governance visibility.
sections:
- id: identity-structure-and-footprint
  title: Identity, structure, and operating footprint
  body: 'Kin Insurance is best understood as a digital-first homeowners insurer built around catastrophe-prone markets rather than as a generalist agency. Across official and independent coverage, the company consistently describes itself as a direct-to-consumer provider that removes external agents, relies on thousands of property-level data points, and tries to price homes more precisely than legacy carriers that still rely on blunt geographic averages. The structure matters: Kin did not stop at acting as a distributor. By 2019 it launched the Kin Interinsurance Network as a Florida reciprocal carrier while continuing MGA and brokerage activities in other states, and by 2024-2026 it was describing itself as manager of two reciprocals. The footprint has expanded materially over time, from Florida-focused origins to a 13-state network by the 2025 Series E announcement and 14 states by the March 2026 quarter. The practical takeaway is that Kin is no longer a narrow Florida experiment; it
    is a scaled, multi-state insurer still concentrated in high-risk homeowner geographies.'
