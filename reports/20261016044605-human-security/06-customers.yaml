      conversion sequence or as revenue-equivalent measures.
    claimRefs: [CU002, CU003, CU004, CU009, CU010, CU011]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / counterparty
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Madhive
        - Ad-tech platform / local-ad buyer channel
        - HUMAN included in Madhive's Fraud Free Guarantee stack for local ad buyers
        - Production market program
        - Madhive positioned the program as protection for local ad spend and HUMAN called the relationship long-standing
        - Public evidence does not disclose contract size, duration, or exclusivity
      - - Amazon Web Services
        - Infrastructure partner to HUMAN
        - SageMaker, Glue, EC2, and automation supporting MediaGuard model deployment
        - Production case study
        - AWS says HUMAN validated 15 trillion interactions weekly and tripled deployment cadence
        - HUMAN is the customer in this relationship, so it proves operating scale rather than HUMAN's own customer adoption
      - - Mindtickle
        - Vendor to HUMAN / internal enablement platform
        - Sales training, content management, digital sales rooms, and AI role plays
        - Production multi-year usage
        - Mindtickle says the relationship has lasted five years and improved discovery quality and forecasting
        - HUMAN is the customer here, so the proof is about commercial-process maturity, not end-customer retention
    notes: >-
      This enumeration is a partial public sample of named commercial references visible in the
      assigned pool as of 2026-10-16. Only Madhive is direct external proof of HUMAN inside another
      company's customer-facing workflow; the other two rows validate operating or commercial
      infrastructure around HUMAN rather than HUMAN's end-customer logo list.
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly named commercial references available in the assigned prefetched customer pool on
