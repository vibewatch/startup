schemaVersion: report-v2
artifact: customers
slug: human-security
runDate: 2026-10-16
company:
  name: HUMAN Security
chapter:
  number: 6
  title: Customers
  summary: >-
    HUMAN Security has credible public proof of scaled production usage in digital-fraud and
    bot-defense workflows: its homepage says the platform verifies more than 20 trillion
    interactions weekly across 3 billion devices, and SiliconANGLE reported telemetry across more
    than 500 global brands. The assigned pool still leaves the key underwriting questions open,
    because public materials do not disclose retention, churn, contract duration, or customer
    concentration, and the only adverse customer-signal in the pool is competitor-hosted rather
    than an independent review corpus.
sections:
  - id: customer-segments
    title: Segment coverage is broad, but mostly described at workflow level rather than by disclosed logo set
    body: >-
      Public evidence consistently frames HUMAN around high-volume digital operators rather than a
      narrow single-vertical niche. The official site and SiliconANGLE both position the platform
      across advertising, application, and account-protection workflows, while the Mindtickle
      customer story quotes HUMAN saying its customers span advertising, e-commerce, digital
      platforms, publishing, and enterprises with heavy web, mobile, and API activity. That
      implies a buyer set anchored in media, fraud, and security teams that manage monetized or
      abuse-prone digital surfaces. The same pool also shows a consultative coverage model instead
      of product-led self-serve: the careers page highlights account-executive and technical
      account-manager roles, and the 2024 SiliconANGLE funding article says new capital would be
      used to deepen public-sector engagement and brand/agency click-fraud defense rather than
      launch a low-touch channel.
    claimRefs: [CU001, CU005, CU006, CU012]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof
    title: Adoption proof is strongest on interaction scale and partner-attested production use
    body: >-
      The strongest adoption evidence is scale, not disclosure of customer economics. HUMAN says it
      verifies more than 20 trillion digital interactions weekly, and its homepage adds 3 billion
      unique devices; SiliconANGLE separately reported more than 500 global brands using that
      telemetry in 2024. The AWS case study provides older but still useful operating proof: it
      says HUMAN validated 15 trillion online interactions every week at the time of publication
      and tripled deployment cadence after automating model releases, which supports the idea that
      HUMAN runs live, high-volume production workflows. Named public proof in this assigned pool is
      thinner. The clearest external reference is Madhive, which publicly described HUMAN as a
      trusted partner in its Fraud Free Guarantee program for local ad buyers and was described by
      HUMAN's CEO as a long-standing partner. By contrast, the homepage advertises customer case
      studies without identifying customer names in the fetched excerpt, so reference quality is
      directionally positive but still incomplete for diligence on deployment breadth.
    claimRefs: [CU002, CU003, CU004, CU007, CU008, CU009, CU010, CU015]
    tableRefs: [TU002, TU003]
  - id: durability-and-concentration
    title: Durability, concentration, and procurement-friction remain the central customer blind spots
    body: >-
      The assigned pool does not support a clean view of customer durability. None of the retained
      public sources disclose NRR, GRR, logo churn, renewal rates, average contract duration, or
      top-customer concentration, so the chapter cannot distinguish impressive traffic volume from
      sticky recurring revenue. The available adverse signal is also weakly evidenced: cside's
      competitor comparison says HUMAN does not publish pricing publicly, requires an enterprise
      sales process, and is sometimes perceived as a black box with limited rule-adjustment
      flexibility. Those points are relevant because they suggest procurement friction outside
      HUMAN's largest buyers, but they should be weighted as low-confidence competitor testimony
      rather than verified churn evidence. Overall, the customer story looks enterprise-led and
      strategically important, yet still under-disclosed on the metrics that matter most for
      durability and concentration underwriting.
    claimRefs: [CU011, CU013, CU014, CU016]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Public scale signal
      - Revenue / strategic value
      - Gap
    rows:
      - - Advertising brands, agencies, and media platforms
        - Media, fraud, and monetization teams funding invalid-traffic defense
        - MediaGuard, click-fraud defense, ad-quality protection
        - SiliconANGLE says HUMAN serves more than 500 global brands; Madhive uses HUMAN in a fraud-guarantee offer for local ad buyers
        - Core legacy wedge and partner-led reach into ad spend protection
        - No segment-level customer count or revenue mix disclosed
      - - Digital platforms, publishers, and e-commerce operators
        - Security, trust, and platform-operations teams protecting web, mobile, and API traffic
        - Bot mitigation, scraping defense, account protection, transaction-abuse defense
        - Mindtickle quotes HUMAN saying customers span e-commerce, digital platforms, and publishing
        - Cross-sell path from ad-fraud heritage into broader platform security
        - No disclosed deployment counts by vertical or geography
      - - Large enterprises with high-volume digital surfaces
        - Enterprise buyers using consultative sales and post-sale support
        - Advertising, application, and account protection in one platform
        - Careers page shows account-executive and technical-account-manager roles; homepage says HUMAN safeguards millions in daily transactions for leading enterprises
        - Suggests higher-ACV, services-aware enterprise motion
        - No public pricing, contract-size, or renewal data
      - - Public-sector and regulated workloads
        - Agency or regulated-enterprise buyers evaluating account protection and fraud controls
        - Expansion beyond commercial ad-tech into public-sector security workflows
        - SiliconANGLE said 2024 funding would expand public-sector engagement
        - Strategic adjacency that could diversify customer mix
        - No named public-sector customer proof in the assigned pool
    notes: >-
      Segment rows synthesize workflow-level evidence from official and third-party sources; public
      sources do not disclose revenue concentration, customer counts by vertical, or segment-level
      renewal behavior.
    claimRefs: [CU001, CU004, CU005, CU006, CU007, CU012, CU013]
