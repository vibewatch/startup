    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence suggests an enterprise-led journey that starts with high-volume digital abuse
      problems, expands across multiple fraud surfaces, and deepens through partner channels and
      consultative support rather than self-serve usage.
    data:
      items:
        - label: High-volume digital operators
          description: Buyers are organizations with large web, mobile, API, and programmatic-ad exposure.
          touchpoints:
            - Advertising, e-commerce, digital platforms, publishing
            - Enterprise security and emerging public-sector demand
        - label: Problem-led evaluation
          description: Evaluation focuses on invalid traffic, account abuse, scraping, and click-fraud workflows.
          touchpoints:
            - Advertising, application, and account protection
            - Large-scale digital operations
        - label: Production deployment proof
          description: Public proof centers on live telemetry scale and named partner-operated workflows.
          touchpoints:
            - More than 20 trillion weekly interactions
            - More than 500 global brands telemetry
            - Madhive Fraud Free Guarantee
        - label: Post-sale coverage
          description: Roles and tooling indicate a consultative enterprise-sales and customer-success motion.
          touchpoints:
            - Technical Account Manager, Customer Success
            - Account Executive
            - Five-year Mindtickle relationship
        - label: Expansion loop
          description: Growth appears to extend from ad-tech heritage into application, account, and public-sector protection.
          touchpoints:
            - Click-fraud defense for brands and agencies
            - Public-sector expansion
        - label: Procurement friction
          description: The pool's adverse signal points to enterprise sales, opaque pricing, and low buyer transparency.
          touchpoints:
            - No public pricing
            - Enterprise sales process
            - Black-box perception in competitor-hosted review commentary
    claimRefs: [CU001, CU005, CU006, CU007, CU012, CU013, CU014]
callouts:
  - calloutType: strength
    title: Scale proof is stronger than logo disclosure
    body: >-
      Independent and official sources converge on very large interaction volume and wide brand
      reach, which makes production adoption credible even though the public logo set is still thin.
    claimRefs: [CU002, CU004]
  - calloutType: risk
    title: Durability is still unproven in public evidence
    body: >-
      The retained public pool does not disclose retention, renewal, churn, contract duration, or
      concentration, so customer quality still has to be diligenced off-platform.
    claimRefs: [CU016]
