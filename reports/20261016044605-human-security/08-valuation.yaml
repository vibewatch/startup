    title: Recommendation summary table
    columns:
      - Decision factor
      - Assessment
      - Evidence anchor
      - Decision implication
    rows:
      - [Recommendation, track, "Scale and category relevance are visible, but underwriting data are incomplete.", "Do not commit at an undisclosed or premium price."]
      - [Confidence, medium-low, "The source pool has real operating and product evidence, but no current financing disclosure.", "Require management diligence before changing posture."]
      - [Risk rating, high, "Missing capital-structure, retention, margin, and launch-monetization detail widen downside uncertainty.", "Model downside first and avoid assumption-heavy pricing."]
      - [Valuation stance, fair-at-best, "DoubleVerify's public multiples provide a transparent floor-style reference; HUMAN's current terms are undisclosed.", "Only underwrite if the entry price discounts disclosure risk."]
      - [Decision implication, wait for diligence or better pricing, "A stronger call needs proof on revenue quality, preferences, debt, and broader product adoption.", "Stay engaged, but do not stretch on valuation today."]
    notes: "Assessment rows synthesize retained evidence plus explicit public-information gaps; fair-at-best is not a quoted company valuation."
    claimRefs: [CV007, CV011, CV015, CV016]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Current support
      - What would change the view
    rows:
      - ["Pro-thesis: category-scale telemetry and recognition support strategic relevance.", "HUMAN cites more than 20 trillion weekly interactions and Forrester leadership in bot and agent trust management.", "Independent disclosure of win rates, retention, or margin improvement would make the scale story more financeable."]
      - ["Pro-thesis: commercial execution appears to be improving.", "Mindtickle says HUMAN's reps are running stronger discovery conversations that are already leading to more qualified deals and more accurate forecasting.", "Segmented pipeline conversion, ARR expansion, and churn data would show whether the anecdote scales."]
      - ["Anti-thesis: public evidence does not justify premium pricing yet.", "PPC Land says the OpenX launch discloses no pricing, detection-rate, false-positive, or latency data, and the chapter lacks current financing terms.", "Current-round valuation, preference stack, debt details, and launch KPIs could move the call from track to investable."]
    notes: "Rows mix confirming and adverse evidence; the anti-thesis reflects missing public underwriting inputs rather than a claim that commercialization is failing."
    claimRefs: [CV001, CV007, CV011, CV012, CV016]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "Agentic-trust positioning broadens addressable spend; new platform products add monetized distribution beyond current named launch partner; customer quality metrics hold up.", "Could justify paying above the transparent public-peer baseline if growth quality and margins are materially better than disclosed peers.", "Execution against H1 2027 roadmap, partner concentration, and lack of disclosed efficiency metrics.", "Would need disclosed customer expansion, pricing proof, and cleaner unit-economics evidence."]
      - [Base, "HUMAN remains strategically relevant, but public disclosure on ARR quality, margin, debt, and preferences stays limited.", "Use public comp discipline rather than narrative-premium underwriting; returns depend on entry discount and follow-on transparency.", "Information asymmetry, down-round or preference-overhang risk, and slower-than-hoped product monetization.", "Best matches the current source set."]
      - [Bear, "Launch proof remains thin, broader adoption lags, and later financing reveals weaker revenue quality or more investor protections than expected.", "Limited pricing visibility plus modest public comp multiples can compress upside while leaving meaningful downside.", "Commercial slippage, capital-structure overhang, and adverse re-pricing.", "Most likely if management cannot close the documented diligence gaps."]
    notes: "Scenario ranges are qualitative because the retained source set does not disclose current HUMAN valuation, round terms, or full operating metrics."
    claimRefs: [CV001, CV007, CV010, CV011, CV015, CV016]
