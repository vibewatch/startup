    approximationNotes: null
    claimRefs: [CV001, CV007, CV012, CV015, CV016]
callouts:
  - calloutType: recommendation
    title: Price sensitivity matters more than company quality here
    body: The evidence is strong enough to keep HUMAN on the active watchlist, but not strong enough to justify paying for upside without current financing and revenue-quality disclosure.
    claimRefs: [CV011, CV015, CV016]
  - calloutType: risk
    title: Product momentum does not yet equal valuation support
    body: The OpenX launch adds relevance, but the retained coverage still lacks pricing, detection, and latency metrics that would let investors convert product news into valuation confidence.
    claimRefs: [CV010, CV011]
