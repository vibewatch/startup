company:
  name: HUMAN Security
chapter:
  number: 8
  title: Valuation
  summary: HUMAN Security still looks strategically relevant in bot and fraud prevention, with category-scale telemetry, independent product scrutiny, and a credible customer proof point. The public valuation record available to this chapter is too thin to justify a priced buy call, so the supportable posture remains track with a fair-at-best stance until management discloses current financing, unit economics, and launch performance.
sections:
  - id: recommendation-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      HUMAN has visible category scale and external category recognition, which
      is enough to keep the company investable as a cyberfraud and digital-trust
      platform rather than a speculative concept. The strongest support is still
      qualitative and operating-scale oriented: HUMAN says it verifies more than
      20 trillion interactions a week across 3 billion devices, and a customer
      case study says commercial execution is improving. The missing bridge is
      price. The retained public evidence still does not disclose current
      valuation, liquidation preferences, debt terms, retention, or margins,
      while the nearest public peer benchmark in this pool shows a much more
      transparent company trading on modest revenue and EBITDA multiples. That
      combination supports a track recommendation, not a commit-now underwriting
      call.
    claimRefs: [CV001, CV007, CV011, CV015, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: public-valuation-context
    title: Public valuation context remains thin
    body: >-
      The public evidence supports the idea that HUMAN addresses a broad, real
      market, but it does not support paying a premium on narrative alone.
      GlobalData describes the company as serving finance, travel and
      entertainment, advertising, retail, and e-commerce, which helps explain
      why the platform can achieve large interaction volume and broad
      distribution. At the same time, PPC Land's coverage of the OpenX launch
      says the new platform product names only one launch partner, leaves
      pricing undisclosed, and omits detection-rate, false-positive, and
      latency metrics. The only retained comp in this chapter is DoubleVerify,
      whose public market value and trading multiples are observable. Without
      current HUMAN financing terms or operating-quality disclosures, that peer
      is an anchor for entry discipline, not proof that HUMAN deserves a
      premium.
    claimRefs: [CV005, CV010, CV011, CV014, CV015]
    tableRefs: [TV002]
  - id: scenarios-and-probability-signals
    title: Scenarios and probability signals
    body: >-
      The bull case depends on HUMAN converting category leadership and
      telemetry scale into monetized expansion faster than peers and with
      evidence that the new agentic-trust and platform products expand both
      wallet share and exit appeal. The base case assumes the company remains
      strategically relevant and commercially improving, but that investors
      still face incomplete disclosure on recurring revenue quality, gross
      margin, and capital structure, keeping valuation closer to public
      cyber-ad-tech peers than premium software narratives. The bear case is
      not that the company lacks real technology; it is that insufficient
      disclosure and limited launch proof force investors to underwrite
      downside first, especially if platform product rollouts slip beyond the
      H1 2027 roadmap or fail to show measurable pricing power.
    claimRefs: [CV001, CV007, CV010, CV012, CV015, CV016]
    tableRefs: [TV003]
  - id: final-diligence-asks-and-breakers
    title: Final diligence asks and thesis-break triggers
    body: >-
      The next diligence step is straightforward: ask management to prove that
      the operating-scale story converts into durable, high-quality revenue at
      an acceptable entry price. Specifically, the investment case should not
      upgrade until HUMAN can show current ARR or revenue scale, retention,
      gross margin, sales efficiency, debt balance and covenants, and the
      liquidation-preference stack around the current round. Product-side proof
      also needs to improve: the newest platform launch should disclose pricing
      structure, adoption beyond OpenX, and evidence that accuracy, latency,
      and false-positive performance are good enough to sustain enterprise
      pricing. A thesis break would be any financing or commercialization
      update that reveals weak retention, heavy preference overhang, expensive
      debt, or delayed platform adoption.
    claimRefs: [CV010, CV011, CV016]
tables:
