callouts:
  - calloutType: insight
    title: The category is narrower than generic cybersecurity
    body: Public evidence consistently points to bot management, digital fraud prevention, and trusted-traffic verification workflows, which is strategically meaningful but much smaller than undifferentiated "cybersecurity TAM" framing.
    claimRefs: [CM001, CM009]
  - calloutType: risk
    title: Market conviction is limited by weak public budget sizing
    body: The assigned evidence shows large operating scope but does not reveal clean TAM/SAM/SOM, buyer-title precision, or reconciled segment mix, which limits how confidently investors can translate demand signals into valuation assumptions.
    claimRefs: [CM012, CM013, CM014]
