chapter:
  number: 2
  title: Market Analysis
  summary: HUMAN participates in a narrow but tangible market centered on bot management, digital fraud prevention, and trusted-traffic verification across advertising, application, and account workflows. The assigned evidence supports operational scale and multi-vertical demand, but it does not support a spend-based TAM/SAM/SOM; buyer-title and budget-owner precision remain diligence gaps that matter for valuation.
sections:
  - id: market-boundary-and-scope
    title: Market boundary and scope
    body: >-
      The assigned sources place HUMAN in a bounded category around bot mitigation,
      fraud prevention, and digital-traffic trust rather than in the whole
      cybersecurity budget. Independent and official descriptions repeatedly frame
      the platform around advertising integrity, application protection, account
      protection, and related anti-abuse workflows, while Gartner's vendor listing
      anchors the company inside an online-fraud-detection context and KuppingerCole
      describes advanced bot and fraud detection across finance and e-commerce. That
      boundary matters because the reachable market should exclude broad endpoint,
      identity, and offensive-cyber spend that the public evidence does not tie to
      HUMAN's product set. The practical substitute set therefore looks fragmented:
      workflow-specific anti-fraud controls, internal review, or point tools in ad
      integrity and application-account defense, not a generic cyber platform budget.
    claimRefs: [CM001, CM002, CM008, CM009, CM016]
    tableRefs: [TM001]
  - id: buyer-segments-and-adoption
    title: Buyer segments, budget paths, and adoption triggers
    body: >-
      Demand appears to come from operators of large-scale digital properties where
      fraudulent traffic creates measurable revenue leakage, trust damage, or
      operational burden. Mindtickle's customer story says HUMAN serves advertising,
      e-commerce, digital-platform, publishing, and enterprise web-mobile-API
      environments, while SecurityWeek and Altss extend that picture into account
      security, digital payments, and public-sector election-security initiatives.
      The evidence supports a multi-budget story: advertising integrity can map to
      media quality or ad-operations budgets, while account and application defense
      more likely sit with fraud, trust, or security owners. But those titles are
      still inferred from workflow descriptions rather than directly disclosed by
      customers, so the adoption path is clearer than the exact budget owner. The
      strongest adoption triggers are fraud-loss reduction, lower false positives,
      and better trust in high-volume digital interactions.
    claimRefs: [CM005, CM006, CM010, CM011, CM014, CM015]
    tableRefs: [TM003]
  - id: sizing-proxies-and-constraints
    title: Evidence-constrained sizing, drivers, and constraints
    body: >-
      Public evidence supports operational-scope proxies, not a clean monetary TAM.
      The official homepage says HUMAN verifies more than 20 trillion digital
      interactions weekly across 3 billion unique devices, and SecurityWeek echoed
      the weekly interaction figure while describing expansion in digital account
      protection, media security, and public sector work. Those numbers indicate a
      large attack surface and a potentially broad installed telemetry base, but they
      are not spend figures and should not be converted into revenue opportunity
      without outside benchmarks. A further limitation is inconsistency in public
      scale references: Altss cites more than 20 billion daily interactions, which
      does not reconcile neatly with the official weekly framing. For valuation, the
      takeaway is that the market looks real and multi-segment, yet public evidence
      still under-specifies monetizable budget pools, growth rates, and the exact
      split between advertising, account-security, and application-security demand.
    claimRefs: [CM003, CM004, CM007, CM012, CM013]
    tableRefs: [TM002]
    figureRefs: [FM001]
