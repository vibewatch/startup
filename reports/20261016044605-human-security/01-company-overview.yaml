company:
  name: HUMAN Security
chapter:
  number: 1
  title: Company Overview
  summary: >-
    HUMAN Security presents as a private cybersecurity platform company founded in 2012, headquartered in
    New York, and focused on stopping bots, fraud, and digital abuse across advertising, application, and
    account workflows. The strongest current public evidence in the assigned pool is company-issued: it
    supports large operating-scale claims and an October 2024 $50+ million growth round, while current
    valuation, revenue, debt, and independently verified headcount remain thin or unavailable.
sections:
  - id: identity-and-scale
    title: Identity, product scope, and public operating scale
    body: >-
      HUMAN Security describes itself as a cybersecurity company built to protect the customer journey from
      bots, fraud, and digital abuse, with product coverage spanning advertising, applications, and accounts.
      The current overview is strongest on platform scope and operating telemetry rather than audited company
      metrics: official pages repeatedly state that HUMAN verifies more than 20 trillion digital interactions
      each week, and the homepage adds 3 billion unique devices, 2,500-plus signals per interaction, and
      400-plus algorithms and adaptive machine-learning models. Those figures establish material operating
      reach, but they remain company-claimed scale signals rather than independently audited financial or
      customer-disclosure metrics. The same evidence set supports a New York identity and multi-office
      footprint, but not a management-confirmed current headcount or revenue run rate.
    claimRefs: [CO002, CO003, CO004, CO005, CO006, CO013]
    tableRefs: [TO001]
  - id: leadership-and-organization
    title: Founding narrative, leadership refresh, and organizational footprint
    body: >-
      HUMAN ties its origin story to four founders—Tamer Hassan, Michael Tiffany, Dan Kaminsky, and Ash
      Kalb—and places the company's early formation in Brooklyn in 2012. The assigned refresh pool does not
      expose a full governance roster or board matrix, but it does show one material leadership update: the
      October 2024 funding announcement says Stu Solomon joined as CEO in January 2024 to broaden product use
      cases and commercial execution. The public careers surface reinforces a scaled operating footprint rather
      than a narrow startup profile, listing offices in New York, Santa Clara, Miami, and Tel Aviv and
      publishing employee quotes from threat intelligence, product, customer success, and sales functions.
      That supports broad functional coverage, but key-person dependence still centers on the post-2024 CEO
      transition because the assigned pool is thin on board structure and deeper executive biographies.
    claimRefs: [CO001, CO006, CO007, CO013, CO014]
    tableRefs: [TO002]
  - id: capital-and-stakeholders
    title: Funding history and stakeholder map
    body: >-
      The clearest capital event in the assigned pool is the October 9, 2024 growth financing. Both the
      company release and SiliconANGLE report that HUMAN raised more than $50 million, led by WestCap with
      additional participation from Goldman Sachs, ClearSky, NightDragon, and Vertex. SiliconANGLE further
      reports cumulative funding of roughly $300 million, including a $100 million January 2022 round, which
      is useful directional context but still secondary reporting rather than a current capitalization table.
      The investor mix suggests continued backing from security- and growth-oriented capital providers, yet
      the assigned evidence does not disclose current ownership concentration, liquidation preferences,
      secondary volume, or the status of any debt/credit facility. As a result, the stakeholder picture is
      supportable at the named-investor level but not yet at the control-rights or valuation-waterfall level.
    claimRefs: [CO011, CO012]
    tableRefs: [TO003]
  - id: milestone-and-evidence-risk
    title: Milestones, customer proof, and remaining evidence risk
    body: >-
      Public milestones in this pool cluster around recognition, financing, and sales-enablement maturity
      rather than a full product-launch chronology. Company materials cite 2024 recognition from Forrester,
      G2, and an industry award, while the 2026 homepage continues to market HUMAN as a current category
      leader. A partner case study from Mindtickle adds a narrower but useful operating signal: HUMAN's sales
      enablement team says it has used the platform for about five years and introduced AI role plays in 2024
      to improve discovery and coaching. The main diligence risk is not absence of growth signals but weak
      independent corroboration. The assigned pool has one usable independent news recap, but two directory
      candidates degraded during refresh—F6S returned a bot challenge and Mandos rendered only a loading
      state—so current valuation, headcount, board composition, debt status, and adverse reporting remain
      under-supported.
    claimRefs: [CO008, CO009, CO010, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
