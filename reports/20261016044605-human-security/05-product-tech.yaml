artifact: product-tech
slug: human-security
runDate: '2026-10-16'
company:
  name: HUMAN Security
chapter:
  number: 5
  title: Product & Technology
  summary: HUMAN Security publicly presents a broad fraud-defense platform that spans advertising, application, account, client-side, and emerging AI-agent trust workflows. The strongest evidence supports breadth, telemetry scale, and recent third-party recognition, but public materials are still thin on implementation depth, reliability metrics, and independently verified security-assurance artifacts.
sections:
- id: product-scope
  title: Product scope in customer-workflow terms
  body: HUMAN positions the Human Defense Platform as a workflow-spanning control layer rather than a point tool. Official and marketplace materials consistently describe coverage from advertising fraud and malicious traffic through application abuse, account takeover, and client-side script governance, while a partner case study adds that customers operate large web, mobile, and API footprints across advertising, e-commerce, publishing, and enterprise settings. That breadth matters because the platform value proposition is not only blocking bad bots; it is carrying the same trust, fraud, and abuse decisioning logic across multiple steps of the customer journey where false positives, fragmented tools, or missing telemetry would otherwise create operational gaps.
  claimRefs:
  - CE001
  - CE005
  - CE006
  - CE007
  - CE013
  - CE016
  tableRefs:
  - TE001
  - TE002
- id: architecture
  title: Decisioning architecture and operating model
  body: 'Public evidence describes an architecture centered on large-scale telemetry, a real-time decision engine, and mitigation layers that can plug into existing customer controls. HUMAN says it verifies more than 20 trillion digital interactions weekly, scores each interaction with 2,500-plus signals, and applies 400-plus algorithms and adaptive machine-learning models; the 2026 Forrester-syndicated release extends that stack with Sightline, AgenticTrust, and integrations into WAF, CDN, IAM, and Adobe Experience Platform environments. The resulting picture is a layered operating model: collect behavior across the journey, enrich it with Satori threat intelligence, decide quickly, then apply policy or mitigation at the relevant workflow surface.'
  claimRefs:
  - CE002
  - CE003
  - CE004
  - CE010
  - CE011
  - CE012
  tableRefs:
  - TE003
  figureRefs:
  - FE001
- id: maturity-differentiation
  title: Current maturity and differentiation
  body: HUMAN's clearest externally refreshed maturity signal is recognition in 2026 around threat research and AI-agent trust management. The official site and a June 2026 GlobeNewswire-syndicated release both state that Forrester named the company a Leader in Bot and Agent Trust Management Software and gave highest-possible scores on nine criteria, while the same release attributes differentiation to attack analytics, a threat-research team, and granular AI-agent permissions. Those are meaningful signals that the company is trying to move from classic bot mitigation toward a wider agentic-trust control plane, but most of the evidence is still company-curated rather than coming from public product documentation or neutral benchmark detail.
  claimRefs:
  - CE002
  - CE009
  - CE010
  - CE012
  - CE014
  - CE015
- id: assurance-gaps
  title: Trust, compliance, and diligence gaps
  body: Public materials support the existence of privacy and client-side control messaging, but they do not yet provide enough independent proof on operating quality for underwriting. The AWS Marketplace listing says Client-side Defense simplifies compliance with privacy regulations and PCI DSS 4, and the 2026 release cites customer praise for "best-in-class 24/7 support," yet the assigned pool does not provide primary public evidence for certifications such as SOC 2 or ISO 27001, reference architectures, uptime targets, incident history, false-positive rates, or implementation timelines by module. The chapter therefore supports the product narrative more strongly than it supports deployment-risk, assurance, or reliability conclusions.
  claimRefs:
  - CE008
  - CE011
  - CE014
  - CE015
tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary buyer / user
  - Status / maturity
  - Differentiation signal
  - Diligence gap
  rows:
  - - Advertising Protection (MediaGuard)
    - Ad-tech platforms, publishers, media teams
    - Publicly packaged current module
    - Purpose-built ad fraud, malvertising, and ad quality protection with ecosystem visibility
    - No public precision, false-positive, or major-customer deployment metrics by module
  - - Application Protection (Bot Defender)
    - Security / fraud teams for web and mobile apps
    - Publicly packaged current module
    - Handles web scraping, transaction abuse, automated engagements, client-side attacks, and wanted-bot handling
    - No public implementation pattern, SDK/API depth, or latency/SLA disclosures
  - - Account Protection (Account Defender)
    - Identity, fraud, and account-security owners
    - Publicly packaged current module
    - Pre-, at-, and post-login defenses for account takeover and fake/compromised accounts
    - No public efficacy split by takeover, fake-account, or post-login abuse scenario
  - - Client-side Defense (Code Defender)
    - Web security, privacy, and digital-experience teams
    - Publicly packaged current module
    - Browser-side script inventory/control with privacy and PCI DSS 4 positioning
    - No external certification detail, script-governance benchmark, or incident-response workflow evidence
  notes: Rows reflect publicly exposed product surfaces from AWS Marketplace and official site text; maturity is public-package visibility, not verified customer adoption depth.
  claimRefs:
  - CE001
  - CE005
  - CE006
  - CE007
  - CE008
- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow problem
  - HUMAN solution
  - Measurable benefit
  - Limitation
  rows:
  - - Protect ad inventory and media spend
    - Ad fraud, malvertising, and low-quality traffic erode marketplace trust
    - Advertising Protection / MediaGuard
    - Company claims comprehensive protection plus actionable ecosystem visibility
    - No public customer ROI or benchmarked fraud-reduction figures in assigned evidence
  - - Defend web and mobile applications
    - Scraping, transaction abuse, automated engagement, and malicious client-side activity
    - Application Protection with policy-based control for bots and scripts
    - Broader workflow than simple bot blocking because wanted bots / AI scrapers can be handled selectively
    - No public reference architecture, deployment time, or uptime/support SLA detail
  - - Reduce account takeover and fake-account abuse
    - Fraud spans pre-login, login, and post-login states
    - Account Protection across the account lifecycle
    - Lifecycle framing suggests fewer gaps between identity and fraud controls
    - No public loss-rate improvement, step-up-friction, or recovery-cost metrics
  - - Govern client-side scripts and browser trust
    - Unmanaged third-party scripts can create data leakage and compliance risk
    - Client-side Defense / Code Defender
    - Visibility into all client-side code plus automated policy enforcement
    - No public independent proof of compliance outcomes or script-remediation workflow depth
  - - Extend trust controls to AI agents and agentic commerce
    - New automation introduces actor-classification and permissioning needs
    - Sightline with AgenticTrust
    - Fresh 2026 evidence shows AI-agent detection, classification, and granular permissions entering the product narrative
    - Public proof is still mostly company-curated rather than detailed docs or neutral tests
  notes: Benefits summarize source-backed workflow claims; missing quantitative outcomes remain explicit diligence gaps rather than inferred conversion or risk reductions.
  claimRefs:
  - CE001
  - CE006
  - CE007
  - CE008
  - CE010
  - CE013
- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process
  - Role
  - Dependency
  - Risk
  rows:
  - - Journey telemetry intake
    - Collect signals across ads, applications, accounts, and client-side environments
    - Requires broad event coverage and customer instrumentation
    - Public sources do not document telemetry schema depth, edge footprint, or ingestion SLAs
  - - Decision engine
    - Scores each interaction using 2,500-plus signals in milliseconds
    - Depends on model quality, feature freshness, and tuning against false positives
    - No public evaluation methodology, drift controls, or module-level performance metrics
  - - Algorithms and ML models
    - Apply 400-plus algorithms and adaptive machine-learning models to drive decisions
    - Depends on labeled threat data and feedback loops
    - Marketing-level disclosure stops short of feature lineage, governance, or retraining cadence
  - - Threat research and attack analytics
    - Satori research plus Sightline attack profiles enrich detections and investigations
    - Depends on sustained research output and rapid intelligence productization
    - Public materials show differentiation claims but not staffing depth, update cadence, or customer-facing workflow detail
  - - Mitigation and ecosystem integrations
    - Push controls into WAF, CDN, IAM, Adobe Experience Platform, and client-side policy layers
    - Depends on integration maintenance and customer-specific orchestration
    - Assigned evidence lacks public API docs, versioning, or reliability commitments for the integration layer
  notes: This table reconstructs the operating stack from public prose; it is a diligence map, not a confirmed internal architecture diagram.
  claimRefs:
  - CE003
  - CE004
  - CE010
  - CE011
  - CE012
  - CE015
