evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Current post-2024 valuation, share classes, liquidation preferences, and ownership concentration.
    whyItMatters: A conviction investment view needs current pricing context rather than only the amount raised.
    diligencePath: Request the latest financing materials, cap table, and board deck from management.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue-and-arr
    missingEvidence: Management-confirmed revenue, ARR, growth, margin, and churn metrics.
    whyItMatters: Public operating-scale claims do not substitute for commercial quality or unit-economics evidence.
    diligencePath: Request KPI pack, audited statements, and current board reporting for revenue quality and retention.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Current board roster, committee structure, and named executive biographies beyond Stu Solomon.
    whyItMatters: >-
      Governance visibility affects key-person risk, control-rights interpretation, and diligence on decision-making
      depth.
    diligencePath: Pull a current board list and management bios from company materials or investor data room.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: access-blocked
    severity: material
    topic: independent-corroboration
    missingEvidence: Additional usable independent sources on headcount, customer count, adverse events, and current company profile.
    whyItMatters: The assigned pool is heavy on company-issued evidence and lacks a clearly adverse retained source.
    diligencePath: >-
      Re-run discovery or manually review independent databases and adverse reporting sources outside this worker's
      fixed pool.
    relatedQuestionRefs:
      - QO007
      - QO008
  - type: missing-source
    severity: material
    topic: monetary-market-sizing
    missingEvidence: >-
      Independent market reports or public-company disclosures that quantify bot-management, online-fraud-detection, or
      adjacent trusted-traffic spend by geography and growth rate.
    whyItMatters: >-
      Without an external spend denominator, investors cannot translate HUMAN's telemetry scale into a supportable TAM,
      SAM, or SOM for valuation work.
    diligencePath: >-
      Collect current Gartner, IDC, Forrester, Juniper, or public-company 10-K category estimates and reconcile them to
      HUMAN's product boundary.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyer-budget-owners
    missingEvidence: >-
      Customer procurement proof naming the executive owner, buying center, budget line, and approval path for each
      major workflow.
    whyItMatters: >-
      Adoption timing and expansion potential depend on whether HUMAN sells into ad operations, fraud operations,
      platform engineering, or centralized security budgets.
    diligencePath: >-
      Request customer references, procurement case studies, or partner-channel material that names buyer titles and
      budget authority by segment.
    relatedQuestionRefs:
      - QM006
      - QM007
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: interaction-scale
    missingEvidence: >-
      A current third-party benchmark or company explanation reconciling daily and weekly traffic metrics and clarifying
      methodology.
    whyItMatters: >-
      Conflicting scale references weaken confidence in any attempt to estimate penetration or infer market share from
      operational volume.
    diligencePath: >-
      Ask management to reconcile the traffic metrics, methodology, and reporting period, then cross-check against
      independent analyst or partner documentation.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: named-direct-peers
    missingEvidence: >-
      Independent or primary-source profiles for named direct competitors with public product scope, customer segment,
      funding or scale, and strategic direction.
    whyItMatters: >-
      Without named-peer evidence, the chapter can only compare competitor classes and cannot test whether HUMAN's
      breadth or telemetry claims are unique in the current peer set.
    diligencePath: >-
      Collect validated analyst, review, procurement, or competitor-official pages for vendors in the bot-management and
      ad-verification peer sets, then rebuild the profile and capability matrix with named rows.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: Price cards, contract structures, or procurement examples for HUMAN and its main alternative classes.
    whyItMatters: >-
      Price and packaging determine whether breadth wins economically or whether platforms and point tools can undercut
      HUMAN on bundle economics.
    diligencePath: >-
      Request customer procurement records, current pricing collateral, or public pricing pages from peers and map them
      to comparable units.
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: switching-and-multi-homing
    missingEvidence: >-
      Customer migration stories, replacement references, or churn data showing whether HUMAN displaces incumbents,
      coexists with them, or gets displaced by platform-native controls.
    whyItMatters: >-
      Moat durability depends on whether the product becomes embedded in workflows or remains easy to multi-home or
      replace.
    diligencePath: >-
      Prioritize customer case studies, RFP language, or integration references that describe replacement, coexistence,
      or budget-owner behavior across multiple security tools.
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Current ARR or revenue run rate, growth, segment mix, renewal basis, and any revenue-recognition policy detail.
    whyItMatters: Revenue scale and quality cannot be underwritten from platform-scale metrics alone.
    diligencePath: Request management revenue bridge, board deck KPI pages, and finance-level segment reporting.
    relatedQuestionRefs:
      - QI003
      - QI009
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, CAC, payback, net revenue retention, churn, average contract term, and services mix.
    whyItMatters: Without unit economics, the margin path and efficiency of incremental growth remain unverified.
    diligencePath: Request cohort retention, margin waterfall, sales funnel conversion, CAC, and payback by segment.
    relatedQuestionRefs:
      - QI004
      - QI007
      - QI009
    relatedTableRefs:
      - TI002
      - TI003
  - type: missing-source
    severity: blocking
    topic: cash-and-debt
    missingEvidence: >-
      Current cash balance, monthly burn, runway, and the outstanding balance, maturity, and covenants of the 2022
      Blackstone credit facility.
    whyItMatters: Capital adequacy cannot be judged if debt obligations or cash burn could force a near-term financing event.
    diligencePath: Request treasury cash schedule, debt agreements, covenant package, and current board-approved operating plan.
    relatedQuestionRefs:
      - QI008
      - QI009
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: funding-reconciliation
    missingEvidence: >-
      A reconciled round-by-round financing ledger that explains whether recapitalization and later growth capital are
      counted consistently.
    whyItMatters: Conflicting cumulative funding figures impair dilution analysis and any capital-intensity conclusion.
    diligencePath: >-
      Reconcile prior financing materials, cap table, and investor communications against management's official round
      ledger.
    relatedQuestionRefs:
      - QI005
      - QI006
      - QI009
    relatedTableRefs:
      - TI003
  - type: access-blocked
    severity: minor
    topic: search-ambiguity
    missingEvidence: Cleaner company-specific discovery and public market-data surfaces with fewer ambiguous matches.
    whyItMatters: >-
      Name ambiguity raises manual review burden and makes weak directory results easier to misread as financial
      evidence.
    diligencePath: >-
      Anchor follow-up diligence on authoritative management materials and direct, company-specific URLs rather than
      generic keyword discovery.
    relatedQuestionRefs:
      - QI009
  - type: missing-source
    severity: material
    topic: implementation-assurance
    missingEvidence: >-
      Public API or integration documentation, deployment architecture references, uptime or latency commitments, and
      implementation timelines by module.
    whyItMatters: >-
      Without these materials, it is difficult to underwrite deployment complexity, integration effort, and reliability
      risk for enterprise buyers.
    diligencePath: >-
      Request current solution briefs, implementation guides, reference architectures, and customer deployment case
      studies broken out by module.
    relatedQuestionRefs:
      - QE004
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: security-assurance
    missingEvidence: >-
      Primary public proof for certifications, incident history, false-positive rates, model-governance practices, and
      independent validation of privacy or PCI-related claims.
    whyItMatters: >-
      Security-assurance and quality-control evidence is central to evaluating trust, regulatory posture, and
      operational risk in fraud-defense products.
    diligencePath: >-
      Request SOC 2 / ISO reports, recent security questionnaires, incident postmortems, and controlled efficacy
      reporting by module.
    relatedQuestionRefs:
      - QE006
      - QE008
  - type: private-evidence-only
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      Independent practitioner-community, open-source, package-registry, or developer-doc usage signals tied to HUMAN's
      product surfaces.
    whyItMatters: >-
      The chapter can only use a careers-page proxy for public technical signal, which is weaker than real developer
      adoption or implementation evidence.
    diligencePath: >-
      Look for public docs, SDK/package telemetry, engineer talks, integration-partner technical posts, or request
      private product-usage telemetry from management.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: material
    topic: durability-gap
    missingEvidence: Segment-level NRR, GRR, logo churn, renewal rates, and average contract duration for HUMAN's major product lines.
    whyItMatters: These metrics determine whether high interaction volume translates into sticky, compounding revenue.
    diligencePath: >-
      Request cohort retention data, renewal schedules, and customer-level contract metadata from management or the data
      room.
    relatedQuestionRefs:
      - QU004
  - type: missing-source
    severity: material
    topic: concentration-gap
    missingEvidence: Top-customer concentration, channel-partner contribution, average contract value, and public-sector mix.
    whyItMatters: Concentration can make the customer story materially riskier than the topline scale metrics imply.
    diligencePath: >-
      Obtain CRM exports or board reporting that breaks revenue by top customers, channel, and segment for the trailing
      twelve months.
    relatedQuestionRefs:
      - QU005
  - type: enumeration-incomplete
    severity: minor
    topic: named-proof
    missingEvidence: A fuller named-customer set with production status, outcomes, and freshness across major segments.
    whyItMatters: >-
      The public pool supports scale and one clear partner deployment, but it does not validate breadth of referenceable
      logos.
    diligencePath: >-
      Ask for a current customer-reference list or a sanitized deployment roster that can be cross-checked against
      public case studies.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: direct-regulatory-status
    missingEvidence: >-
      Current litigation docket, regulator correspondence, privacy/compliance certifications, and any 2025-2026
      enforcement or incident disclosures specific to HUMAN.
    whyItMatters: >-
      Without direct company-specific legal and compliance records, the chapter can rank sector risk but cannot
      distinguish ordinary exposure from an already-emerging liability problem.
    diligencePath: >-
      Request management's legal/regulatory tracker, current compliance pack, outside-counsel summary, and
      customer-facing privacy/security exhibits.
    relatedQuestionRefs:
      - QR001
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: resilience-architecture
    missingEvidence: >-
      Region failover design, incident history, rollback controls, precision metrics, and SLA/RTO/RPO evidence for
      customer-facing deployments.
    whyItMatters: >-
      Public marketing proves scale and partner surface area, but it does not prove that HUMAN can absorb outages or
      decisioning mistakes without material customer damage.
    diligencePath: Obtain architecture review, recent incident postmortems, customer escalation playbooks, and model-governance KPIs.
    relatedQuestionRefs:
      - QR003
      - QR004
      - QR005
    relatedTableRefs:
      - TR002
  - type: access-blocked
    severity: minor
    topic: discovery-and-concentration
    missingEvidence: >-
      Direct concentration metrics, third-party profile corroboration, and more independent evidence on brand
      distinctiveness and partner dependence.
    whyItMatters: >-
      Ambiguous discovery surfaces and blocked profiles do not prove a business problem, but they reduce outside
      visibility into concentration, distribution, and category differentiation.
    diligencePath: >-
      Ask for top-partner and top-customer concentration, traffic-allocation data across delivery partners, and
      buyer-search or pipeline attribution evidence.
    relatedQuestionRefs:
      - QR006
      - QR007
      - QR008
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: capital-structure-disclosure
    missingEvidence: >-
      Current valuation, round date and size, liquidation preferences, option overhang, and outstanding debt balance
      with maturity and covenants.
    whyItMatters: >-
      Entry discipline and downside protection depend on knowing where new money would sit in the stack and how much
      financing risk remains.
    diligencePath: Request the latest cap table, financing docs, debt schedule, and board-approved round materials.
    relatedQuestionRefs:
      - QV006
  - type: missing-source
    severity: material
    topic: unit-economics-disclosure
    missingEvidence: Current ARR or revenue run rate, growth, gross margin, retention, churn, and segment mix.
    whyItMatters: >-
      Without revenue quality and margin data, investors cannot determine whether HUMAN deserves a premium to public
      cyber-ad-tech peers.
    diligencePath: Request audited or management-certified KPI packs with cohort retention and gross-margin bridges by product line.
    relatedQuestionRefs:
      - QV007
  - type: missing-source
    severity: material
    topic: launch-monetization-proof
    missingEvidence: >-
      Pricing, customer count, attach rate, accuracy benchmarks, false-positive rates, and latency data for Ad Integrity
      Suite for Platforms.
    whyItMatters: >-
      The newest product narrative may matter to upside, but valuation should not capitalize it before commercialization
      proof exists.
    diligencePath: Ask for launch pipeline, win-loss evidence, launch-customer references, and product-performance dashboards.
    relatedQuestionRefs:
      - QV004
      - QV005
