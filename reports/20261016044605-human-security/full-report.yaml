  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Visible scale and product relevance keep HUMAN investable, but missing underwriting data block a premium-priced
      recommendation.
    data:
      nodes:
        - id: scale
          label: Category-scale telemetry
          detail: '>20T weekly interactions, 3B devices, 2,500-plus signals per interaction.'
        - id: proof
          label: External proof points
          detail: Forrester leader recognition and customer testimony indicate market relevance.
        - id: commercialization
          label: Commercial signal
          detail: Mindtickle cites stronger discovery quality and better forecast accuracy.
        - id: gap
          label: Underwriting gap
          detail: No retained current HUMAN valuation, retention, margin, debt, or preference disclosure.
        - id: comp
          label: Comparable anchor
          detail: DoubleVerify provides the only transparent public-multiple reference in this pool.
        - id: call
          label: Recommendation
          detail: Track / fair-at-best until diligence closes the data gap or pricing improves.
      edges:
