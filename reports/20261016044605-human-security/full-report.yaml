      - number: '1.2'
        title: Founding narrative, leadership refresh, and organizational footprint
        blocks:
          - type: paragraph
            body: >-
              HUMAN ties its origin story to four founders—Tamer Hassan, Michael Tiffany, Dan Kaminsky, and Ash Kalb—and
              places the company's early formation in Brooklyn in 2012. The assigned refresh pool does not expose a full
              governance roster or board matrix, but it does show one material leadership update: the October 2024
              funding announcement says Stu Solomon joined as CEO in January 2024 to broaden product use cases and
              commercial execution. The public careers surface reinforces a scaled operating footprint rather than a
              narrow startup profile, listing offices in New York, Santa Clara, Miami, and Tel Aviv and publishing
              employee quotes from threat intelligence, product, customer success, and sales functions. That supports
              broad functional coverage, but key-person dependence still centers on the post-2024 CEO transition because
              the assigned pool is thin on board structure and deeper executive biographies.
