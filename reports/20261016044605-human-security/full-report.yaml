  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope in customer-workflow terms
        blocks:
          - type: paragraph
            body: >-
              HUMAN positions the Human Defense Platform as a workflow-spanning control layer rather than a point tool.
              Official and marketplace materials consistently describe coverage from advertising fraud and malicious
              traffic through application abuse, account takeover, and client-side script governance, while a partner
              case study adds that customers operate large web, mobile, and API footprints across advertising,
              e-commerce, publishing, and enterprise settings. That breadth matters because the platform value
              proposition is not only blocking bad bots; it is carrying the same trust, fraud, and abuse decisioning
              logic across multiple steps of the customer journey where false positives, fragmented tools, or missing
              telemetry would otherwise create operational gaps.
