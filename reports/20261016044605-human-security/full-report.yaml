          - type: paragraph
            body: >-
              The strongest adoption evidence is scale, not disclosure of customer economics. HUMAN says it verifies
              more than 20 trillion digital interactions weekly, and its homepage adds 3 billion unique devices;
              SiliconANGLE separately reported more than 500 global brands using that telemetry in 2024. The AWS case
              study provides older but still useful operating proof: it says HUMAN validated 15 trillion online
              interactions every week at the time of publication and tripled deployment cadence after automating model
              releases, which supports the idea that HUMAN runs live, high-volume production workflows. Named public
              proof in this assigned pool is thinner. The clearest external reference is Madhive, which publicly
              described HUMAN as a trusted partner in its Fraud Free Guarantee program for local ad buyers and was
              described by HUMAN's CEO as a long-standing partner. By contrast, the homepage advertises customer case
              studies without identifying customer names in the fetched excerpt, so reference quality is directionally
              positive but still incomplete for diligence on deployment breadth.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU007
              - CU008
              - CU009
              - CU010
              - CU015
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
              - CU015
      - number: '6.3'
        title: Durability, concentration, and procurement-friction remain the central customer blind spots
        blocks:
          - type: paragraph
            body: >-
              The assigned pool does not support a clean view of customer durability. None of the retained public
              sources disclose NRR, GRR, logo churn, renewal rates, average contract duration, or top-customer
              concentration, so the chapter cannot distinguish impressive traffic volume from sticky recurring revenue.
              The available adverse signal is also weakly evidenced: cside's competitor comparison says HUMAN does not
              publish pricing publicly, requires an enterprise sales process, and is sometimes perceived as a black box
              with limited rule-adjustment flexibility. Those points are relevant because they suggest procurement
              friction outside HUMAN's largest buyers, but they should be weighted as low-confidence competitor
              testimony rather than verified churn evidence. Overall, the customer story looks enterprise-led and
              strategically important, yet still under-disclosed on the metrics that matter most for durability and
              concentration underwriting.
            claimRefs:
              - CU011
              - CU013
              - CU014
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale proof is stronger than logo disclosure
            body: >-
              Independent and official sources converge on very large interaction volume and wide brand reach, which
              makes production adoption credible even though the public logo set is still thin.
            calloutType: strength
            claimRefs:
              - CU002
              - CU004
          - type: callout
            title: Durability is still unproven in public evidence
            body: >-
              The retained public pool does not disclose retention, renewal, churn, contract duration, or concentration,
              so customer quality still has to be diligenced off-platform.
            calloutType: risk
            claimRefs:
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and regulatory exposure is elevated relative to the public evidence available
        blocks:
          - type: paragraph
            body: >-
              HUMAN's public messaging and employee testimony show a company operating directly in fraud, account
              protection, and increasingly agentic-AI workflows, which places it inside a 2026 liability backdrop that
              independent reporting describes as materially harsher for technology vendors than management teams
              expected entering the year. That does not prove HUMAN has an active enforcement or litigation problem
              today, but it does mean privacy, breach-response, and AI-governance controls matter to valuation and
              underwriting. The sharper risk is not only a single incident; it is the combination of product claims,
              customer-critical transaction flows, and a legal environment where cyber and AI disputes can quickly
              become class-action or multi-jurisdiction matters. Because the assigned pool did not surface direct court,
              regulator, or certification records for HUMAN, the residual exposure remains high until diligence can
              confirm the company's actual 2026 posture rather than the sector backdrop alone.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR011
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR011
              - CR013
              - CR015
      - number: '7.2'
        title: Platform quality and dependency risk matter because HUMAN sits in live transaction paths
        blocks:
          - type: paragraph
            body: >-
              HUMAN's own scale claims imply that outages, model drift, or false-positive spikes would not be
              back-office nuisances; they would land in customer acquisition, monetization, and security workflows that
              are already operating at very large traffic volumes. Independent product coverage also describes a
              deployment model that relies on numerous integration surfaces across CDNs, cloud-delivery layers, and
              server environments, which expands the number of places where a partner outage or configuration break can
              impair service quality. The relevant external comparable is not a HUMAN-specific incident in this pool,
              but a 2026 AWS single-availability-zone event that still propagated to more than 150 downstream services.
              That makes resilience architecture, failover design, alerting, and customer-remediation evidence the
              critical diligence path rather than simple product marketing.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR008
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR008
              - CR010
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR010
              - CR012
              - CR014
              - CR015
      - number: '7.3'
        title: Commercial execution and discovery friction are secondary but real underwriting risks
        blocks:
          - type: paragraph
            body: >-
              Public evidence suggests HUMAN is investing in internal sales enablement and distributed talent while
              trying to sustain category leadership in a crowded, adjacent cybersecurity market. Those are healthy
              signs, but they also create execution risk: commercial process quality appears to depend partly on
              external tooling, distributed teams raise coordination burden, and the phrase "human security" is broad
              enough that some adjacent vendors use it generically. In practice that can weaken search discoverability,
              lengthen buyer education, and complicate outside diligence when third-party profile surfaces are
              inaccessible or ambiguous. None of these issues is individually thesis-breaking today, yet together they
              argue for diligence on retention of key operators, dependency on enablement systems, and whether the brand
              has enough distinctiveness to preserve efficient enterprise go-to-market motion.
            claimRefs:
              - CR004
              - CR009
              - CR010
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR009
              - CR012
              - CR013
              - CR014
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Kill criteria to test directly in diligence
            body: >-
              Treat the thesis as impaired if management cannot show current litigation/compliance posture, recent
              resilience evidence for customer-facing infrastructure failures, or measured false-positive and
              remediation controls for live transaction traffic. A new material incident, unresolved privacy dispute, or
              inability to evidence partner-failover readiness would move this chapter from high risk to thesis-break
              territory quickly.
            calloutType: risk
            claimRefs:
              - CR005
              - CR008
              - CR014
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              HUMAN has visible category scale and external category recognition, which is enough to keep the company
              investable as a cyberfraud and digital-trust platform rather than a speculative concept. The strongest
              support is still qualitative and operating-scale oriented: HUMAN says it verifies more than 20 trillion
              interactions a week across 3 billion devices, and a customer case study says commercial execution is
              improving. The missing bridge is price. The retained public evidence still does not disclose current
              valuation, liquidation preferences, debt terms, retention, or margins, while the nearest public peer
              benchmark in this pool shows a much more transparent company trading on modest revenue and EBITDA
              multiples. That combination supports a track recommendation, not a commit-now underwriting call.
            claimRefs:
              - CV001
              - CV007
              - CV011
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV007
              - CV011
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV007
              - CV012
              - CV015
              - CV016
      - number: '8.2'
        title: Public valuation context remains thin
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports the idea that HUMAN addresses a broad, real market, but it does not support
              paying a premium on narrative alone. GlobalData describes the company as serving finance, travel and
              entertainment, advertising, retail, and e-commerce, which helps explain why the platform can achieve large
              interaction volume and broad distribution. At the same time, PPC Land's coverage of the OpenX launch says
              the new platform product names only one launch partner, leaves pricing undisclosed, and omits
              detection-rate, false-positive, and latency metrics. The only retained comp in this chapter is
              DoubleVerify, whose public market value and trading multiples are observable. Without current HUMAN
              financing terms or operating-quality disclosures, that peer is an anchor for entry discipline, not proof
              that HUMAN deserves a premium.
            claimRefs:
              - CV005
              - CV010
              - CV011
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV007
              - CV011
              - CV012
              - CV016
      - number: '8.3'
        title: Scenarios and probability signals
        blocks:
          - type: paragraph
            body: >-
              The bull case depends on HUMAN converting category leadership and telemetry scale into monetized expansion
              faster than peers and with evidence that the new agentic-trust and platform products expand both wallet
              share and exit appeal. The base case assumes the company remains strategically relevant and commercially
              improving, but that investors still face incomplete disclosure on recurring revenue quality, gross margin,
              and capital structure, keeping valuation closer to public cyber-ad-tech peers than premium software
              narratives. The bear case is not that the company lacks real technology; it is that insufficient
              disclosure and limited launch proof force investors to underwrite downside first, especially if platform
              product rollouts slip beyond the H1 2027 roadmap or fail to show measurable pricing power.
            claimRefs:
              - CV001
              - CV007
              - CV010
              - CV012
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV007
              - CV010
              - CV011
              - CV015
              - CV016
      - number: '8.4'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The next diligence step is straightforward: ask management to prove that the operating-scale story
              converts into durable, high-quality revenue at an acceptable entry price. Specifically, the investment
              case should not upgrade until HUMAN can show current ARR or revenue scale, retention, gross margin, sales
              efficiency, debt balance and covenants, and the liquidation-preference stack around the current round.
              Product-side proof also needs to improve: the newest platform launch should disclose pricing structure,
              adoption beyond OpenX, and evidence that accuracy, latency, and false-positive performance are good enough
              to sustain enterprise pricing. A thesis break would be any financing or commercialization update that
              reveals weak retention, heavy preference overhang, expensive debt, or delayed platform adoption.
            claimRefs:
              - CV010
              - CV011
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price sensitivity matters more than company quality here
            body: >-
              The evidence is strong enough to keep HUMAN on the active watchlist, but not strong enough to justify
              paying for upside without current financing and revenue-quality disclosure.
            calloutType: recommendation
            claimRefs:
              - CV011
              - CV015
              - CV016
          - type: callout
            title: Product momentum does not yet equal valuation support
            body: >-
              The OpenX launch adds relevance, but the retained coverage still lacks pricing, detection, and latency
              metrics that would let investors convert product news into valuation confidence.
            calloutType: risk
            claimRefs:
              - CV010
              - CV011
