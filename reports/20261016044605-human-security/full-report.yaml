        title: Funding history and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              The clearest capital event in the assigned pool is the October 9, 2024 growth financing. Both the company
              release and SiliconANGLE report that HUMAN raised more than $50 million, led by WestCap with additional
              participation from Goldman Sachs, ClearSky, NightDragon, and Vertex. SiliconANGLE further reports
              cumulative funding of roughly $300 million, including a $100 million January 2022 round, which is useful
              directional context but still secondary reporting rather than a current capitalization table. The investor
              mix suggests continued backing from security- and growth-oriented capital providers, yet the assigned
              evidence does not disclose current ownership concentration, liquidation preferences, secondary volume, or
              the status of any debt/credit facility. As a result, the stakeholder picture is supportable at the
              named-investor level but not yet at the control-rights or valuation-waterfall level.
