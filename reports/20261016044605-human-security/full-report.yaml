          to: proof
          label: Supports strategic relevance
        - from: proof
          to: commercialization
          label: Suggests real demand
        - from: commercialization
          to: gap
          label: Still not enough
        - from: gap
          to: comp
          label: Forces peer discipline
        - from: comp
          to: call
          label: Sets entry posture
