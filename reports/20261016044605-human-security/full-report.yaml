        title: Competitive landscape is visible by class, not by named peer
        blocks:
          - type: paragraph
            body: >-
              The retained pool supports a competitive map organized around solution classes rather than a source-backed
              roster of named rivals. Company and third-party pages consistently place HUMAN in bot management, bot and
              agent trust management, digital fraud prevention, and ad-verification-adjacent workflows rather than in
