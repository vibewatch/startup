      - number: '3.3'
        title: Switching-cost evidence is real but incomplete, and pricing opacity keeps moat durability unresolved
        blocks:
          - type: paragraph
            body: >-
              The available sources point to some switching friction, but not enough to underwrite a hard moat. The
              Mindtickle case study shows HUMAN investing in a structured go-to-market system across sales, customer
              success, marketing, and partnerships, and says the team has used the vendor's platform for five years.
              That suggests HUMAN's commercial motion depends on repeatable enablement and partner tooling, not just
              product claims, which can make displacement harder once the platform is embedded. At the same time, the
              October 2026 launch release contains its own adverse signal: verification is described as table stakes,
              implying that incumbents, platforms, and adjacent suites can narrow the gap if they match baseline
              detection and win on distribution, transparency, or bundle economics. Public pricing is not disclosed in
              the retained pool for HUMAN or for the alternative classes, so packaging comparisons remain about
              visibility and likely procurement motion, not about source-backed dollar gaps.
