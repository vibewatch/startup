company:
  name: "HUMAN Security"
chapter:
  number: 3
  title: "Competitors"
  summary: "Retained evidence supports a class-based competition view rather than a named-vendor league table: HUMAN is positioned in bot and agent trust management, ad verification, and fraud-prevention workflows that touch advertising, applications, accounts, and platform supply paths. The strongest differentiation evidence is breadth and telemetry scale, while the biggest diligence gap is the lack of retained independent head-to-head pricing and named direct-peer profiles."
sections:
  - id: "competitive-landscape"
    title: "Competitive landscape is visible by class, not by named peer"
    body: "The retained pool supports a competitive map organized around solution classes rather than a source-backed roster of named rivals. Company and third-party pages consistently place HUMAN in bot management, bot and agent trust management, digital fraud prevention, and ad-verification-adjacent workflows rather than in broad endpoint or network-security categories. The home page describes one platform spanning advertising, applications, and accounts, while the October 2026 platform launch extends the same verification stack into DSP, SSP, exchange, and marketplace workflows. That breadth means the relevant alternatives include point bot-account-defense vendors, point ad-verification suites, platform-native trust features, internal detection stacks, and the status quo of rules-based or pass-fail verification. The assigned pool does not contain validated public profiles for named direct competitors, so the chapter keeps the landscape class-based and flags the missing peer detail as a material diligence gap rather than guessing the matrix from memory."
    claimRefs: ["CP001", "CP004", "CP006", "CP012", "CP014", "CP015", "CP016"]
    tableRefs: ["TP001"]
  - id: "differentiation-and-distribution"
    title: "Differentiation evidence centers on breadth, telemetry, and embedded distribution"
    body: "HUMAN's strongest public differentiation signal is scope plus telemetry density. Retained official and news evidence says the company verifies more than 20 trillion digital interactions weekly, covers more than 3 billion unique devices, and evaluates 2,500-plus signals per interaction with more than 400 algorithms and adaptive machine-learning models. Those claims matter competitively because the same platform is described as supporting ad fraud prevention, application protection, account protection, and newer platform-side viewability and brand-safety use cases. Distribution also looks meaningful: the October 2026 Ad Integrity Suite for Platforms announcement names OpenX as the first platform adopter, suggesting HUMAN can sell both to enterprises directly and into supply-side infrastructure where verification signals become embedded in partner workflows. Category recognition in Forrester and G2 helps trust posture, but the retained evidence still proves positioning better than durable win rates."
    claimRefs: ["CP002", "CP003", "CP004", "CP005", "CP006", "CP008", "CP015"]
    tableRefs: ["TP002"]
    figureRefs: ["FP001"]
  - id: "switching-costs-pricing-and-moat-risk"
    title: "Switching-cost evidence is real but incomplete, and pricing opacity keeps moat durability unresolved"
    body: "The available sources point to some switching friction, but not enough to underwrite a hard moat. The Mindtickle case study shows HUMAN investing in a structured go-to-market system across sales, customer success, marketing, and partnerships, and says the team has used the vendor's platform for five years. That suggests HUMAN's commercial motion depends on repeatable enablement and partner tooling, not just product claims, which can make displacement harder once the platform is embedded. At the same time, the October 2026 launch release contains its own adverse signal: verification is described as table stakes, implying that incumbents, platforms, and adjacent suites can narrow the gap if they match baseline detection and win on distribution, transparency, or bundle economics. Public pricing is not disclosed in the retained pool for HUMAN or for the alternative classes, so packaging comparisons remain about visibility and likely procurement motion, not about source-backed dollar gaps."
    claimRefs: ["CP009", "CP010", "CP011", "CP013", "CP015", "CP016"]
    tableRefs: ["TP003"]
