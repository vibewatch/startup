- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Revenue / ARR
    - Not publicly disclosed in retained sources
    - Low
    - Without a current numerator, revenue quality and growth cannot be underwritten.
    - Management revenue bridge, ARR definition, and latest trailing-twelve-month revenue.
  - - Gross margin
    - Not publicly disclosed
    - Low
    - Distinguishes software-like economics from services, intelligence, and support burden.
    - Cost-of-revenue split by product line and gross-margin trend.
  - - CAC / payback
    - Not publicly disclosed; Mindtickle only suggests stronger qualification and forecasting
    - Low
    - Needed to evaluate sales efficiency and incremental growth economics.
    - Pipeline funnel, CAC by segment, sales cycle, and payback by motion.
  - - NRR / churn / contract duration
    - Not publicly disclosed
    - Low
    - Recurring-revenue quality cannot be judged without retention and term data.
    - Gross retention, net retention, logo churn, and average contract term by segment.
  - - Headcount scale
    - 450-469 estimated by SetterVC; 201-500 company size on Mindtickle
    - Medium
    - Operating scale is visible, but payroll cost and productivity are not.
    - Current FTE by function and fully loaded compensation.
  - - Capital raised
    - '>$50M in Oct. 2024; cumulative total disputed between ~$300M and $179M'
    - Medium
    - Capital history informs dilution, runway, and financing dependency.
    - Reconcile round ledger, cap table, and post-2024 financing history.
  - - Debt / runway
    - No public current disclosure located
    - Low
    - Credit obligations or cash burn could dominate the next financing need.
    - Current cash, monthly burn, Blackstone facility balance, maturity, and covenants.
  notes: Null-like statuses mean the retained public evidence did not expose an underwritable value; range estimates remain third-party and caution-labeled.
