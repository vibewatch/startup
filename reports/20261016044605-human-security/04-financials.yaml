company:
  name: HUMAN Security
chapter:
  number: 4
  title: Financials
  summary: Public evidence supports a real enterprise bot-and-fraud platform with meaningful operating scale and a fresh 2024 capital raise, but it does not disclose enough about pricing, realized revenue, margin, retention, or debt to underwrite revenue quality. The financial read-through is therefore directionally positive on demand and product breadth, but still blocker-heavy on unit economics and capital adequacy.
sections:
- id: revenue-model-and-monetization-transparency
  title: Revenue model and monetization transparency
  body: >-
    Public evidence shows HUMAN selling one bot-and-fraud platform across
    advertising, application, and account-protection workflows, with platform
    scale described in interactions, devices, and decision signals rather than
    in disclosed revenue. That is enough to identify the surfaces the company
    monetizes, but not enough to underwrite revenue mix, contract basis, or
    revenue-recognition quality. The public traction markers that do appear are
    operational: the official site emphasizes weekly interactions and devices,
    while SetterVC adds an estimated protected-brand count. Neither the
    official site nor the retained third-party review surfaces in this pool
    publish list pricing, realized pricing, or segment contribution, so the
    right conclusion is breadth of monetizable workflows rather than verified
    revenue composition.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI013
  - CI015
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: gtm-efficiency-and-operating-cost-proxies
  title: GTM efficiency and operating-cost proxies
  body: >-
    The clearest public GTM evidence is operational rather than financial.
    HUMAN's Mindtickle case study describes a go-to-market organization
    spanning sales, customer success, marketing, and partnerships, and says
    newer coaching workflows are improving qualification and forecast accuracy
    while potentially shortening sales cycles. The careers page adds evidence
    of continued hiring-process discipline and equity-linked compensation.
    Together these sources support a direct, consultative enterprise-sales
    motion and ongoing operating spend, but they still do not quantify CAC,
    payback, services mix, or gross-margin absorption. They also imply that
    execution leverage currently shows up in sales-process quality before it
    shows up in reported financial efficiency metrics.
  claimRefs:
  - CI005
  - CI006
  - CI007
  - CI008
  - CI015
  tableRefs:
  - TI003
- id: capital-adequacy-and-underwriting-blockers
  title: Capital adequacy and underwriting blockers
  body: >-
    The freshest hard financing datapoint in the retained pool is the October
    2024 growth round of more than $50 million, which supports the view that
    HUMAN still supplements operating progress with outside capital. The harder
    issue is reconciliation: SiliconANGLE reports roughly $300 million raised
    to date, while SetterVC lists $179 million across six rounds and
    explicitly warns that its funding and valuation marks may be incomplete,
    stale, erroneous, or revised. The Nasdaq secondary-market page likewise
    does not expose transaction pricing in the retained fetch, and one
    assigned search result is an unrelated geopolitical "human security"
    document, underscoring that public discovery noise remains high while
    cash, debt, margin, and runway data stay undisclosed.
  claimRefs:
  - CI008
  - CI009
  - CI010
  - CI011
  - CI012
  - CI014
  - CI015
  - CI016
