callouts:
  - calloutType: risk
    title: Kill criteria to test directly in diligence
    body: |-
      Treat the thesis as impaired if management cannot show current litigation/compliance posture, recent resilience evidence for customer-facing infrastructure failures, or measured false-positive and remediation controls for live transaction traffic. A new material incident, unresolved privacy dispute, or inability to evidence partner-failover readiness would move this chapter from high risk to thesis-break territory quickly.
    claimRefs: [CR005, CR008, CR014, CR015]
