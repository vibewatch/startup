company:
  name: HUMAN Security
chapter:
  number: 7
  title: Risks
  summary: HUMAN's public risk picture centers on legal liability from cyber/privacy and agentic-AI use cases, operational dependence on high-volume decisioning and third-party delivery infrastructure, and softer but still material execution friction around tooling, distributed operations, and brand discoverability. The current pool shows meaningful mitigation assets in scale, research depth, and ecosystem breadth, but it does not provide enough direct public evidence on live litigation, compliance posture, resilience architecture, or concentration metrics to reduce those risks to low.
sections:
  - id: legal-and-regulatory-exposure
    title: Legal and regulatory exposure is elevated relative to the public evidence available
    body: |-
      HUMAN's public messaging and employee testimony show a company operating directly in fraud, account protection, and increasingly agentic-AI workflows, which places it inside a 2026 liability backdrop that independent reporting describes as materially harsher for technology vendors than management teams expected entering the year. That does not prove HUMAN has an active enforcement or litigation problem today, but it does mean privacy, breach-response, and AI-governance controls matter to valuation and underwriting. The sharper risk is not only a single incident; it is the combination of product claims, customer-critical transaction flows, and a legal environment where cyber and AI disputes can quickly become class-action or multi-jurisdiction matters. Because the assigned pool did not surface direct court, regulator, or certification records for HUMAN, the residual exposure remains high until diligence can confirm the company's actual 2026 posture rather than the sector backdrop alone.
    claimRefs: [CR005, CR006, CR007, CR011, CR015]
    tableRefs: [TR001]
  - id: operational-and-platform-risk
    title: Platform quality and dependency risk matter because HUMAN sits in live transaction paths
    body: |-
      HUMAN's own scale claims imply that outages, model drift, or false-positive spikes would not be back-office nuisances; they would land in customer acquisition, monetization, and security workflows that are already operating at very large traffic volumes. Independent product coverage also describes a deployment model that relies on numerous integration surfaces across CDNs, cloud-delivery layers, and server environments, which expands the number of places where a partner outage or configuration break can impair service quality. The relevant external comparable is not a HUMAN-specific incident in this pool, but a 2026 AWS single-availability-zone event that still propagated to more than 150 downstream services. That makes resilience architecture, failover design, alerting, and customer-remediation evidence the critical diligence path rather than simple product marketing.
    claimRefs: [CR001, CR002, CR003, CR004, CR008, CR014]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: execution-and-discovery-friction
    title: Commercial execution and discovery friction are secondary but real underwriting risks
    body: |-
      Public evidence suggests HUMAN is investing in internal sales enablement and distributed talent while trying to sustain category leadership in a crowded, adjacent cybersecurity market. Those are healthy signs, but they also create execution risk: commercial process quality appears to depend partly on external tooling, distributed teams raise coordination burden, and the phrase "human security" is broad enough that some adjacent vendors use it generically. In practice that can weaken search discoverability, lengthen buyer education, and complicate outside diligence when third-party profile surfaces are inaccessible or ambiguous. None of these issues is individually thesis-breaking today, yet together they argue for diligence on retention of key operators, dependency on enablement systems, and whether the brand has enough distinctiveness to preserve efficient enterprise go-to-market motion.
    claimRefs: [CR004, CR009, CR010, CR012, CR013]
    tableRefs: [TR003]
