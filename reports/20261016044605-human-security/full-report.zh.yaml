      - number: '3.3'
        title: 切换成本真实但不完整，定价不透明使护城河持久性仍无法判断
        blocks:
          - type: paragraph
            body: >-
              现有来源指向一定的切换摩擦，但不足以据此承保一条坚固护城河。Mindtickle 案例研究显示，HUMAN
              在销售、客户成功、营销和合作伙伴关系之间投入结构化的市场拓展体系，并称团队已使用该供应商平台五年。HUMAN 的商业动作因此依赖可重复的赋能和合作伙伴工具，而不只是产品主张；平台一旦嵌入，替换难度可能上升。但
              2026 年 10 月的发布公告也包含不利信号：核验被称为基本门槛，意味着现有厂商、平台和相邻套件只要匹配基础检测能力，并在分发、透明度或捆绑经济性上取胜，就能缩小差距。留存来源池没有披露 HUMAN
              或替代类别的公开定价，因此包装比较只能讨论可见性和可能的采购路径，不能讨论有来源支撑的金额差距。
