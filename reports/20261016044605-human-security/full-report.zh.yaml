  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据显示，这是一条以企业客户为主导的旅程：从高流量数字滥用问题起步，扩展到多个欺诈界面，并通过合作伙伴渠道和咨询式支持加深，而非依靠自助使用。
    data:
      items:
        - label: 高流量数字化运营方
          description: 买方是拥有大型 Web、移动端、API 和程序化广告曝光面的组织。
          touchpoints:
            - 广告、电商、数字平台、出版
            - 企业安全与新兴公共部门需求
        - label: 问题驱动的评估
          description: 评估聚焦于无效流量、账户滥用、爬取和点击欺诈工作流。
          touchpoints:
            - 广告、应用和账户保护
            - 大规模数字化运营
        - label: 生产环境部署验证
          description: 公开验证集中在实时遥测规模和由具名合作伙伴运营的工作流。
          touchpoints:
            - 每周超过 20 万亿次交互
            - 超过 500 个全球品牌的遥测
            - Madhive Fraud Free Guarantee
        - label: 售后覆盖
          description: 岗位和工具表明，这是一套咨询式的企业销售与客户成功动作。
          touchpoints:
            - Technical Account Manager、Customer Success
            - Account Executive
            - 与 Mindtickle 保持五年合作关系
        - label: 扩张循环
          description: 增长似乎从广告科技传统领域延伸到应用、账户和公共部门保护。
          touchpoints:
            - 面向品牌和代理商的点击欺诈防御
            - 公共部门扩张
        - label: 采购摩擦
          description: 该来源集的负面信号指向企业销售、定价不透明和买方信息不足。
          touchpoints:
            - 没有公开定价
            - 企业销售流程
            - 竞争对手主导的评论中对黑盒的印象
    claimRefs:
