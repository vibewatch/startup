          detail: 每周超过 20T 次交互、3B 台设备、2,500+ 个信号和 400+ 种算法，是公开披露的规模标记。
        - id: n4
          label: 企业 GTM 动作
          detail: 公开 GTM 信号显示，其在销售、客户成功、市场营销和合作伙伴关系等环节设有直销与赋能团队。
        - id: n5
          label: 合同经济性
          detail: 公开来源没有披露目录价、实际成交价、折扣、ACV 或合同期限。
        - id: n6
          label: 投资评估输出
          detail: 收入质量、毛利率、CAC/回本期、现金 runway 和债务仍需管理层披露。
      edges:
        - from: n1
          to: n2
          label: 威胁暴露推动需求
        - from: n2
          to: n3
          label: 平台处理流量与交易
        - from: n3
          to: n4
          label: 规模支撑企业销售
        - from: n4
          to: n5
          label: 销售动作转化为合同
        - from: n5
          to: n6
          label: 缺少价格和利润数据，无法完成投资评估
    approximationNotes: 由于留存的公开证据只描述产品覆盖、平台规模和 GTM 代理指标，未披露合同价格、转化率或毛利计算，这一流程图仅作定性展示。
