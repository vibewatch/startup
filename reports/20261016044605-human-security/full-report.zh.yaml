        title: GTM 效率与运营成本代理指标
        blocks:
          - type: paragraph
            body: >-
              最清晰的公开 GTM 证据是运营性的，而非财务性的。HUMAN 的 Mindtickle
              案例研究描述了横跨销售、客户成功、营销和合作伙伴关系的市场拓展组织，并称较新的辅导工作流正在改善资格判断和预测准确度，同时可能缩短销售周期。招聘页面还显示其持续保持招聘流程纪律，并采用与股权挂钩的薪酬。合在一起，这些来源支持直接、顾问式的企业销售模式和持续运营支出，但仍没有量化
              CAC、回收期、服务收入构成或毛利吸收能力。它们也暗示，执行杠杆目前先体现在销售流程质量上，尚未体现在已报告的财务效率指标上。
