            body: >-
              乐观情景取决于 HUMAN
              能否比同业更快地将品类领导地位和遥测规模转化为变现扩张，并证明新的代理信任和平台产品能够同时扩大钱包份额和退出吸引力。基准情景假设公司仍具战略相关性且商业表现改善，但投资者仍面临经常性收入质量、毛利率和资本结构披露不完整的问题，使估值更接近公开网络安全/广告科技同业，而非溢价软件叙事。悲观情景并非公司没有真正的技术，而是披露不足和发布证明有限，迫使投资者先按下行风险进行投资判断；尤其是当平台产品发布晚于
              H1 2027 路线图，或无法展示可量化的定价能力时。
            claimRefs:
              - CV001
              - CV007
              - CV010
              - CV012
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV007
              - CV010
              - CV011
              - CV015
              - CV016
      - number: '8.4'
        title: 最终尽调要求与投资论点破裂触发因素
        blocks:
          - type: paragraph
            body: >-
              下一步尽调很直接：要求管理层证明运营规模故事能够以可接受的入场价格转化为持久且高质量的收入。具体而言，在 HUMAN 展示当前 ARR
              或收入规模、留存率、毛利率、销售效率、债务余额和契约，以及当前轮次的优先股堆叠之前，投资判断不应升级。产品侧证明也需要加强：最新平台发布应披露定价结构、OpenX
              之外的采用情况，并证明准确度、延迟和误报表现足以支撑企业定价。任何融资或商业化更新若显示留存疲弱、优先权负担过重、债务昂贵或平台采用延迟，都会打破投资论点。
            claimRefs:
              - CV010
              - CV011
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 这里价格敏感度比公司质量更重要
            body: 证据足以让 HUMAN 留在主动观察名单中，但在当前融资和收入质量披露出现之前，不足以支持为上行空间付费。
            calloutType: recommendation
            claimRefs:
              - CV011
              - CV015
              - CV016
          - type: callout
            title: 产品动能尚不等于估值支撑
            body: OpenX 发布增加了相关性，但留存报道仍缺少定价、检测和延迟指标，投资者无法据此将产品新闻转化为估值信心。
            calloutType: risk
            claimRefs:
              - CV010
              - CV011
