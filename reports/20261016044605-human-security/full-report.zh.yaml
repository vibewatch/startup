              - CO006
              - CO012
              - CO013
      - number: '1.2'
        title: 创业叙事、领导层更新与组织布局
        blocks:
          - type: paragraph
            body: >-
              HUMAN 将起源归于四位创始人——Tamer Hassan、Michael Tiffany、Dan Kaminsky 和 Ash Kalb——并将公司早期组建地点定在 2012
              年的布鲁克林。本次刷新来源池没有完整的治理名单或董事会矩阵，但显示出一项重要领导层更新：2024 年 10 月融资公告称 Stu Solomon 于 2024 年 1 月加入并担任
              CEO，以拓展产品用例和商业执行。公开招聘页面呈现的是规模化运营足迹，而非狭窄的初创公司画像，列出纽约、圣克拉拉、迈阿密和特拉维夫办公室，并发布威胁情报、产品、客户成功和销售职能员工的引述。这支持广泛的职能覆盖，但由于来源池对董事会结构和更深层高管履历披露有限，关键人依赖仍集中在
              2024 年后的 CEO 过渡上。
            claimRefs:
              - CO001
              - CO006
              - CO007
              - CO013
              - CO014
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO006
              - CO007
              - CO013
      - number: '1.3'
        title: 融资历史与利益相关方图谱
        blocks:
          - type: paragraph
            body: >-
              来源池中最清晰的资本事件是 2024 年 10 月 9 日的增长融资。公司公告和 SiliconANGLE 均报道 HUMAN 融资超过 $50 million，由 WestCap 领投，Goldman
              Sachs、ClearSky、NightDragon 和 Vertex 追加参与。SiliconANGLE 还报道累计融资约 $300 million，其中包括 2022 年 1 月的 $100 million
              轮；这提供了方向性背景，但仍是二手报道，不等于当前股权结构表。投资者构成显示安全和增长导向资本仍在持续支持，但现有证据没有披露当前持股集中度、清算优先权、老股转让规模或任何债务/授信安排的状态。因此，利益相关方图景可以支持到具名投资者层面，但还不足以判断控制权利或估值瀑布。
            claimRefs:
              - CO011
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO011
              - CO012
      - number: '1.4'
        title: 里程碑、客户证明与剩余证据风险
        blocks:
          - type: paragraph
            body: >-
              本来源池的公开里程碑主要集中于认可、融资和销售赋能成熟度，而非完整的产品发布时间线。公司材料引用了 Forrester、G2 和一项行业奖项在 2024 年给予的认可；2026 年主页仍将 HUMAN
              作为当前品类领导者推广。合作伙伴 Mindtickle 的案例研究补充了一项范围更窄但有用的运营信号：HUMAN 销售赋能团队称已使用该平台约五年，并于 2024 年引入 AI
              角色演练以改善客户发现和辅导。主要尽调风险不是缺少增长信号，而是独立佐证薄弱。本来源池只有一篇可用的独立新闻综述；刷新期间两个目录候选来源也失效——F6S 返回机器人验证挑战，Mandos
              只呈现加载状态——因此当前估值、员工数、董事会构成、债务状态和负面报道仍缺乏充分支持。
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO013
              - CO014
              - CO015
              - CO016
