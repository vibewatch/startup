  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开来源描绘了一套分层信任栈：从多界面遥测，延伸到决策、威胁情报、集成和针对具体工作流的防御。
    data:
      layers:
        - label: 流量与工作流信号
          detail: 覆盖客户旅程的广告、应用、账户和浏览器事件
          items:
            - 广告交互
            - Web 与移动应用活动
            - 账户生命周期事件
            - 客户端脚本行为
        - label: 决策核心
          detail: 实时异常检测与策略决策
          modules:
            - 每次交互 2,500+ 个信号
            - 400+ 种算法与自适应机器学习模型
            - 毫秒级异常检测
        - label: 威胁情报
          detail: 以研究为基础的丰富信息与调查背景
          modules:
            - Satori 威胁情报与研究
            - 攻击画像
            - 威胁网络与战术背景
        - label: 缓解与集成
          detail: 在客户安全与体验工具中应用控制措施
          modules:
            - 可定制的缓解措施
            - WAF / CDN / IAM 集成
            - Adobe Experience Platform 集成
            - 客户端策略执行
        - label: 工作流界面
          detail: 与买方工作流匹配的打包式防御
          outputs:
            - Advertising Protection
            - Application Protection
            - Account Protection
            - Client-side Defense
            - AgenticTrust / Sightline
        - label: 客户运营结果
          detail: 决策支持欺诈减少、信任治理和客户体验控制
          outputs:
            - 欺诈与滥用缓解
            - 可信机器人 / 代理权限
            - 调查背景
            - 客户旅程信任决策
    approximationNotes: 该图是基于来源综合出的公开运营模式，不是公司披露的内部系统图。
