  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局按类别可见，而非按具名同业可见
        blocks:
          - type: paragraph
            body: >-
              留存来源支持按解决方案类别组织竞争图谱，而不支持一份有来源支持的具名竞争者名单。公司和第三方页面始终将 HUMAN
              放在机器人管理、机器人和代理信任管理、数字欺诈防范及邻近广告验证工作流中，而不是广泛的终端或网络安全类别。主页描述一个覆盖广告、应用和账户的平台；2026 年 10 月的平台发布又将同一核验栈扩展至
              DSP、SSP、交易所和市场平台工作流。因此，相关替代方案包括机器人/账户防护点产品商、广告验证套件、平台原生信任功能、内部检测栈，以及基于规则或通过/不通过核验的现状方案。指定来源池没有经过验证的具名直接竞争者公开画像，因此本章维持按类别分析，并将缺少同业细节标记为重要尽调缺口，而不是凭记忆猜测矩阵。
