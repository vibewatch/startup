  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与范围
        blocks:
          - type: paragraph
            body: >-
              指定来源将 HUMAN 放在机器人缓解、欺诈防范和数字流量信任这一有限品类中，而不是整个网络安全预算。独立及官方描述反复将平台定位于广告完整性、应用防护、账户防护及相关反滥用工作流；Gartner
              的供应商列表将公司置于在线欺诈检测场景，KuppingerCole 则描述其在金融和电子商务中的高级机器人与欺诈检测。这个边界很重要，因为可触达市场应排除公开证据没有与 HUMAN
              产品集建立联系的广泛终端、身份和进攻性网络安全支出。因此，实际替代方案较为分散：特定工作流的反欺诈控制、内部审核，或广告完整性及应用/账户防护中的点工具，而不是泛化的网络安全平台预算。
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM009
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM009
              - CM016
      - number: '2.2'
        title: 买方细分、预算路径与采用触发因素
        blocks:
          - type: paragraph
            body: >-
              需求似乎来自大型数字业务运营者：欺诈流量会造成可量化的收入流失、信任损害或运营负担。Mindtickle 客户故事称 HUMAN 服务广告、电商、数字平台、出版以及企业级 Web、移动和 API
              环境；SecurityWeek 和 Altss
              又将范围延伸到账户安全、数字支付和公共部门选举安全项目。证据支持多预算来源：广告完整性可能对应媒体质量或广告运营预算，而账户和应用防护更可能由欺诈、信任或安全负责人负责。不过，这些职位仍是根据工作流描述推断，并非客户直接披露，因此采用路径比确切预算负责人更清晰。最强的采用触发因素是减少欺诈损失、降低误报，以及提升高流量数字交互的信任度。
            claimRefs:
              - CM005
              - CM006
              - CM010
              - CM011
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM010
              - CM011
              - CM014
              - CM015
      - number: '2.3'
        title: 受证据约束的市场规模、驱动因素与限制
        blocks:
          - type: paragraph
            body: >-
              公开证据支持运营范围代理指标，而非清晰的货币化 TAM。官方主页称 HUMAN 每周在 30 亿台独立设备上核验超过 20 万亿次数字交互；SecurityWeek
              也引用每周交互量，并描述其向数字账户防护、媒体安全和公共部门业务扩张。这些数字说明攻击面很大、已部署遥测基础可能广泛，但它们不是支出数据，在没有外部基准时不应直接换算为收入机会。另一个限制是公开规模口径不一致：Altss
              称每日交互量超过 200 亿次，与官方每周口径无法自然对齐。对估值而言，结论是市场真实且覆盖多个细分领域，但公开证据仍未充分说明可变现预算池、增长率，以及广告、账户安全和应用安全需求之间的准确拆分。
            claimRefs:
              - CM003
              - CM004
              - CM007
              - CM012
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM007
              - CM008
              - CM012
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM008
              - CM009
              - CM012
              - CM015
      - number: '2.4'
        title: 展示项
        blocks:
          - type: callout
            title: 该品类窄于泛网络安全
            body: 公开证据持续指向机器人管理、数字欺诈防范和可信流量核验工作流，战略意义明确，但规模远小于不加区分的“网络安全 TAM”口径。
            calloutType: insight
            claimRefs:
              - CM001
              - CM009
          - type: callout
            title: 公开预算规模薄弱限制市场判断
            body: 指定证据显示运营范围很大，但没有清晰的 TAM/SAM/SOM、买方职位精度或可调和的细分构成，因此投资者很难有把握地将需求信号转化为估值假设。
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
