  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 牛市
        - 智能体信任定位扩大可服务支出；新的平台产品在当前具名上线合作伙伴之外增加可变现分发；客户质量指标经得住检验。
        - 如果增长质量和利润率明显优于已披露同行，可能足以支持支付高于透明公开同行基准的价格。
        - H1 2027 路线图执行、合作伙伴集中度，以及效率指标缺失。
        - 需要披露客户扩张、定价证明和更清晰的单位经济证据。
      - - 基准
        - HUMAN 仍具战略相关性，但 ARR 质量、利润率、债务和优先权的公开披露仍然有限。
        - 应采用公开可比公司纪律，而不是按叙事溢价做投资判断；回报取决于入场折价和后续透明度。
        - 信息不对称、下轮融资或优先权悬置风险，以及产品变现慢于预期。
        - 当前来源集最能匹配这一情形。
      - - Bear
        - 上市验证仍然薄弱，广泛采用落后；后续融资可能暴露出比预期更弱的收入质量，或投资人保护条款更多。
        - 定价透明度有限，加上公开可比公司倍数偏低，可能压缩上行空间，同时留下不可忽视的下行风险。
        - 商业进展失速、资本结构拖累，以及不利的重新定价。
        - 如果管理层无法补齐已记录的尽调缺口，最可能出现这一情形。
    notes: 由于留存来源集没有披露 HUMAN 当前估值、融资轮条款或完整经营指标，情景区间仅作定性判断。
