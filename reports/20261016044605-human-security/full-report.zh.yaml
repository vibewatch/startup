  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 在平台关键性、外部基础设施依赖和 2026 年法律升级交汇之处，若缺少直接公开尽调证据，剩余风险严重度最高。
    data:
      columns:
        - 可能性
        - 影响
        - 缓解成熟度
        - 剩余严重度
      rows:
        - label: AI / 隐私责任
          note: 外部 2026 年诉讼调查，加上 HUMAN 自身的代理式 AI 信号。
          values:
            - label: 中
            - label: 高
            - label: 发展中
            - label: 高
        - label: 平台 / 依赖项中断
          note: 交易规模大，以及对合作伙伴界面的依赖。
          values:
            - label: 中
            - label: 高
            - label: 中等
            - label: 高
        - label: 误报 / 模型漂移
          note: 信号量大、模型复杂，若调优失误，客户摩擦的后果会加重。
          values:
            - label: 中
            - label: 高
            - label: 中等
            - label: 高
        - label: 覆盖边界错配
          note: HUMAN 看起来是传统 WAF 的补充，而非完整替代品。
          values:
            - label: 中
            - label: 中
            - label: 中等
            - label: 中高
        - label: 对销售工具的依赖
          note: 赋能证据显示出真实的工作流价值，但也表明其依赖外部工具。
          values:
            - label: 中
            - label: 中
            - label: 中等
            - label: 中
        - label: 执行 / 发现摩擦
          note: 工具、分布式团队和品牌歧义都很重要，但通常不会立刻危及生存。
          values:
            - label: 中
            - label: 中
            - label: 中等
            - label: 中
    approximationNotes: 热力图等级是根据引用的公开证据作出的定性综合，不是公司披露的内部风险分数。
    claimRefs:
      - CR010
      - CR012
      - CR014
      - CR015
  - id: FV001
    title: 投资建议逻辑
    type: flow
    summary: 可见的规模和产品相关性让 HUMAN 仍具投资价值，但缺少投资评估数据，无法支持溢价定价的建议。
    data:
      nodes:
        - id: scale
          label: 品类级遥测规模
          detail: 每周超过 20T 次交互、3B 台设备、每次交互 2,500+ 个信号。
        - id: proof
          label: 外部验证点
          detail: Forrester 领导者认可和客户证言表明其具备市场相关性。
        - id: commercialization
          label: 商业信号
          detail: Mindtickle 提到发现阶段质量更高、预测准确度更好。
        - id: gap
          label: 投资评估缺口
          detail: 留存材料没有 HUMAN 当前估值、留存率、利润率、债务或优先权披露。
        - id: comp
          label: 可比公司锚点
          detail: DoubleVerify 是该来源池中唯一透明的公开市场倍数参照。
        - id: call
          label: 建议
          detail: 在尽调补齐数据缺口或价格改善前，维持跟踪；最多按公允价考虑。
      edges:
        - from: scale
          to: proof
          label: 支持战略相关性
        - from: proof
          to: commercialization
          label: 暗示真实需求
        - from: commercialization
          to: gap
          label: 仍然不够
        - from: gap
          to: comp
          label: 迫使同业纪律
        - from: comp
          to: call
          label: 确定入场姿态
    approximationNotes: null
    claimRefs:
      - CV001
      - CV007
      - CV012
      - CV015
      - CV016
