chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品范围与公开运营规模
        blocks:
          - type: paragraph
            body: >-
              HUMAN Security 将自己描述为一家网络安全公司，旨在保护客户旅程免受机器人、欺诈和数字滥用影响，产品覆盖广告、应用和账户。当前概览对平台范围和运营遥测的证据强于经审计的公司指标：官方页面反复称
              HUMAN 每周核验超过 20 万亿次数字交互，主页还列出 30 亿台独立设备、每次交互 2,500 多个信号，以及 400
              多种算法和自适应机器学习模型。这些数字说明其运营触达规模可观，但仍是公司自称的规模信号，而非独立审计的财务或客户披露指标。同一证据集支持其纽约身份和多办公室布局，却不能证明管理层确认的当前员工数或收入运行率。
            claimRefs:
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
              - CO013
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
