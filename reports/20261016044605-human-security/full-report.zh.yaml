      - number: '3.2'
        title: 差异化证据集中于广度、遥测与嵌入式分发
        blocks:
          - type: paragraph
            body: >-
              HUMAN 最强的公开差异化信号是覆盖范围加遥测密度。留存的官方和新闻证据称，公司每周核验超过 20 万亿次数字交互，覆盖超过 30 亿台独立设备，并用每次交互 2,500 多个信号及 400
              多种算法和自适应机器学习模型评估这些交互。这些主张在竞争上重要，因为同一平台被描述为支持广告欺诈防范、应用防护、账户防护，以及更新的平台侧可见性和品牌安全用例。分发也显得有意义：2026 年 10 月的 Ad
              Integrity Suite for Platforms 公告将 OpenX 列为首个采用平台，说明 HUMAN 既能直接向企业销售，也能进入供应侧基础设施，让核验信号嵌入合作伙伴工作流。Forrester 和
              G2 的品类认可有助于建立信任，但留存证据对定位的证明仍强于对持久赢单率的证明。
