chapter:
  number: 6
  title: "Customers"
  summary: >-
    Global Eggs reaches retail, foodservice, industrial, and export channels through a broad
    conventional-to-specialty egg portfolio, with acquired U.S. businesses supplying the clearest
    channel evidence. Public sources show scale and brand breadth but do not identify end customers,
    retention, renewal, or concentration, so acquisition-led distribution reach should not be
    mistaken for demonstrated customer durability.
sections:
  - id: "buyer-and-channel-map"
    title: "Buyer, user, and payer segmentation"
    body: >-
      Global Eggs' customer surface is best understood as a multi-channel food supply platform rather
      than a single consumer brand. The company says it operates in table and hatching eggs and has
      exported to more than twenty countries, while WATT describes conventional, cage-free,
      free-range, and specialty production. In the United States, Hillandale is described by its
      transaction adviser as serving retail, foodservice, and industrial customers, and Hillandale's
      own site adds grocery retailers and food distributors. Pearl Valley broadens the offer into
      premium free-range, organic, conventional, liquid foodservice products, and fertilizer brands.
      These sources establish buyer and use-case breadth, but they disclose neither channel revenue
      mix nor named purchasing organizations.
    claimRefs: ["CU001", "CU002", "CU004", "CU007", "CU008"]
    tableRefs: ["TU001"]
  - id: "adoption-and-footprint"
    title: "Scale is visible; customer adoption is not"
    body: >-
      The strongest public adoption proxies are production footprint, channel access, and acquired
      brands. Houlihan Lokey reports that Global Eggs completed the $1.1 billion Hillandale acquisition
      on May 12, 2025. WATT's 2026 survey places the U.S. division at 21 million layers and fourth among
      U.S. producers, while NeXus reports that the pending Pearl Valley transaction would add about
      two million hens and eight brands. Those facts indicate capacity and route-to-market expansion,
      not active-account growth, sell-through, repeat purchase, or production deployment at a named
      customer. The public record therefore supports an acquisition-led footprint thesis but does not
      support a customer-count or utilization trajectory.
    claimRefs: ["CU003", "CU005", "CU006", "CU016"]
    tableRefs: ["TU002"]
  - id: "demand-durability-and-economics"
    title: "Demand tailwinds coexist with price and contract risk"
    body: >-
      Independent market evidence is directionally supportive but not uniformly strong. Food Business
      News reports a ten-year global egg-market growth forecast of 22%, with roughly 90% of growth
      expected in emerging markets, and Research and Markets projects the cage-free segment from
      $5.8 billion in 2025 to $7.5 billion in 2032. Yet category mix does not guarantee volume:
      Food Business News notes that value-added shifts need not increase total egg demand and reports
      weak U.S. demand after high prices. CoBank estimates about 120 million U.S. layers were cage-free
      and says those volumes are commonly contracted annually at fixed or cost-plus prices, creating
      a different exposure from spot markets. With only about 2% of global production exported, local
      channel execution and contract quality matter more than a generalized export-growth narrative.
    claimRefs: ["CU009", "CU010", "CU011", "CU012", "CU013", "CU014", "CU015"]
    figureRefs: ["FU001"]
  - id: "proof-quality-and-diligence"
    title: "Reference quality and underwriting implications"
    body: >-
      Available sources repeatedly describe customer classes but stop short of naming buyers,
      confirming production deployments, or reporting outcomes. Hillandale's broad retail,
      foodservice, and industrial relationships are commercially plausible and useful for segment
      mapping, while Pearl Valley's brands offer a route into specialty retail and foodservice.
      Neither proves renewal, pricing power, retention, contract length, or concentration. The
      reviewed evidence set also lacks NRR, GRR, churn, cohorts, satisfaction, top-customer exposure,
      and channel-margin data. Underwriting should therefore treat distribution breadth as a strength
      but reserve judgment on durability until management supplies a customer-level revenue bridge,
      representative contracts, renewal history, and independently referenceable accounts.
    claimRefs: ["CU002", "CU006", "CU007", "CU008", "CU011", "CU015", "CU016"]
    tableRefs: ["TU003"]
