callouts:
  - calloutType: "risk"
    title: "Durability remains unproven"
    body: >-
      Industry demand weakened after high prices, while cage-free contracting can separate fixed or
      cost-plus economics from spot markets. Without customer-level renewal and margin evidence,
      channel breadth alone cannot establish durable growth.
    claimRefs: ["CU011", "CU015", "CU016"]
