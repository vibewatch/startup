company:
  name: Global Eggs
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Global Eggs is a founder-led, vertically integrated table-egg platform assembled across the
    Americas and Europe. Its March 2026 financing announcement disclosed an approximately $8
    billion transaction valuation and an investment commitment of up to $1 billion, but public
    evidence does not establish cash funded, consolidated current revenue, debt, headcount, or
    customer concentration.
sections:
  - id: identity-and-operating-footprint
    title: Identity and operating footprint
    body: >-
      Global Eggs says Ricardo Faria founded the company in 2018 and remains executive chairman.
      Its operating model spans pullet breeding, feed formulation, packaging, and logistics, with
      regional brands including Hillandale Farms in the United States, Granja Faria and Prodhin in
      South America, and Hevo Group in Europe. Company and investor-issued materials describe more
      than 45 million birds, more than 50 farms across three continents, and a 2026 production
      trajectory above 15 billion eggs. Those scale figures are current management or transaction
      claims, not audited operating statistics. The retained sources identify a Luxembourg holding
      company but do not establish a single operating headquarters. They also disclose neither
      employee count nor named-customer count, so those cover metrics remain unavailable rather
      than estimated.
    claimRefs: [CO001, CO002, CO003, CO010, CO011, CO012]
    tableRefs: [TO001]
  - id: ownership-capital-and-governance
    title: Ownership, capital, and governance
    body: >-
      The clearest current capital marker is Warburg Pincus's agreement to invest up to $1 billion
      at an announced $8 billion valuation. "Up to" is a commitment ceiling: it is not evidence that
      $1 billion has been funded, that the amount is entirely primary equity, or that the company
      has that cash available. Latham & Watkins described the same transaction while acting for
      Warburg Pincus, and industry reporting independently repeated the headline terms. Allison Ross
      was announced as joining the board, adding an investor representative alongside founder and
      executive chairman Ricardo Faria. However, a full board roster, voting rights, shareholder
      percentages, debt and covenant terms, and use-of-proceeds allocation were not disclosed in
      the retained public evidence. Governance therefore remains demonstrably founder-centered but
      cannot be reduced to a verified control percentage.
    claimRefs: [CO001, CO007, CO008, CO009]
    tableRefs: [TO002, TO003]
  - id: expansion-record-and-diligence-implications
    title: Expansion record and diligence implications
    body: >-
      The visible expansion sequence is acquisition-led: Hevo Group in Spain in November 2024, a
      $1.1 billion Hillandale Farms agreement announced in March 2025, the Warburg Pincus investment
      announced in March 2026, and Pearl Valley Farms announced in April 2026. WATT reported that
      the constituent businesses generated more than $2 billion of combined revenue in 2024; this
      is neither ARR nor a verified 2026 run rate and should not be presented as either. The
      homepage's one-day-delivery and very-high-stable-margin language is also company marketing
      without a disclosed service-level denominator or accounting margin. Independent retailer
      evidence adds a counterweight: Walmart and Kroger revised cage-free timelines amid supply,
      cost, and consumer-price constraints. The core diligence issue is therefore whether acquisition
      integration, funding drawdown, customer mix, and premium-product demand can convert reported
      physical scale into durable cash earnings.
    claimRefs: [CO004, CO005, CO006, CO007, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
