callouts:
  - calloutType: risk
    title: Valuation and funding are not liquidity
    body: >-
      The $8 billion figure is the announced transaction valuation, while $1 billion is an "up to"
      investment commitment. Neither figure proves cash funded, cash available, enterprise value,
      debt capacity, or total historical capital raised.
    claimRefs: [CO007, CO008]
  - calloutType: insight
    title: Scale is visible; earnings quality is not
    body: >-
      Public materials support a large physical footprint, but the only retained revenue period is
      2024 and the margin language is unquantified company marketing. Audited consolidation and
      segment economics are required before treating scale as durable cash generation.
    claimRefs: [CO010, CO011, CO012, CO013, CO015]
