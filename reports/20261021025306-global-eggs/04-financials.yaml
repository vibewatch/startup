    title: Revenue and gross-profit operating bridge
    type: flow
    summary: "The disclosed operating sequence shows where revenue is created and where unquantified costs intervene; it is not a value-proportional bridge."
    data:
      nodes:
        - id: input-base
          label: Pullet breeding and feed formulation
          detail: Company-disclosed upstream activities; cost contribution is unavailable.
        - id: flock-production
          label: Layer and hatching-egg production
          detail: More than 45 million birds were reported in March 2026.
        - id: product-mix
          label: Conventional cage-free free-range and specialty mix
          detail: Product categories are disclosed but revenue mix is unavailable.
        - id: grading-packaging
          label: Grading and packaging
          detail: Packaging is part of the vertically integrated model; unit cost is unavailable.
        - id: logistics
          label: Distribution and logistics
          detail: Company-disclosed downstream activity; route and spoilage economics are unavailable.
        - id: market-channels
          label: Regional brands and export channels
          detail: The company reports exports to more than twenty countries.
        - id: revenue
          label: Customer revenue
          detail: Combined businesses were reported above US$2 billion for 2024.
        - id: gross-profit
          label: Gross profit after production and delivery costs
          detail: No public gross-profit value or margin was found.
    approximationNotes: "The order reflects disclosed operating stages; node widths and sequence do not represent value, conversion, margin, or cash flow."
    claimRefs: [CI003, CI004, CI007, CI008, CI009, CI015]
callouts:
  - calloutType: risk
    title: Commitment is not liquidity
    body: >-
      The announced financing is capped at up to US$1 billion, while draw timing, transaction
      structure, proceeds use, cash balance, debt, and runway remain undisclosed.
    claimRefs: [CI001, CI010, CI011]
