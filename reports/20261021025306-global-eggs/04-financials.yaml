    columns: [Metric, Public value, Confidence, Why it matters, Specific diligence ask]
    rows:
      - [Combined 2024 revenue, "More than US$2 billion", Medium, Establishes scale but not consolidation quality, Audited consolidated revenue and elimination schedule]
      - [Gross margin, null, Unavailable, Tests pricing power against feed labor and logistics costs, Monthly gross margin by region and product system]
      - [Feed and production cost per dozen, null, Unavailable, Measures the largest physical cost drivers and cage-free burden, Feed conversion mortality yield and cost per dozen by farm]
      - [Customer and channel economics, null, Unavailable, Reveals concentration rebates logistics and contract exposure, Top customers retention contract duration rebates and channel margin]
      - [Maintenance and growth capex, null, Unavailable, Determines free cash conversion and funding dependency, Three-year historical capex and five-year site-level plan]
      - [Working-capital cycle, null, Unavailable, Tests liquidity sensitivity to inventory receivables and volatile prices, DSO DIO DPO spoilage and seasonal peak funding]
      - [Cash net debt and covenants, null, Unavailable, Determines true balance-sheet capacity, Current cash debt maturities interest cost covenants and headroom]
      - [Burn runway and next-round trigger, null, Unavailable, Separates committed investment from available liquidity, Monthly cash flow funding draw schedule primary-secondary split and trigger plan]
    notes: "The revenue value is third-party reported; every null denotes unavailable private evidence rather than a zero value or analyst estimate."
    claimRefs: [CI001, CI005, CI009, CI010, CI011, CI012, CI015, CI016]
figures:
