  evidenceGaps:
    - type: "missing-source"
      severity: "material"
      topic: "regulatory-legal"
      missingEvidence: "Current permits, licenses, regulatory dockets, inspection findings, litigation, enforcement actions, certifications, and remediation status by material entity and site."
      whyItMatters: "Transaction-adviser scope and historical approval language do not establish current operating compliance or absence of claims."
      diligencePath: "Obtain the legal-entity register, regulator correspondence, permit matrix, litigation schedule, inspection reports, certifications, and counsel confirmation."
      relatedQuestionRefs:
        - "QR003"
      relatedTableRefs:
        - "TR001"
    - type: "private-evidence-only"
      severity: "material"
      topic: "biosecurity-quality"
      missingEvidence: "Site-level HPAI prevention, mortality, downtime, depopulation, repopulation, recall, quality, audit, and insurance-recovery performance."
      whyItMatters: "Industry-level HPAI severity cannot establish Global Eggs' mitigation maturity or quantify expected loss."
      diligencePath: "Review three years of monthly site scorecards, veterinary audits, incident logs, insurer claims, business-continuity tests, and recovery timelines."
      relatedQuestionRefs:
        - "QR009"
    - type: "private-evidence-only"
      severity: "material"
      topic: "financial-resilience"
      missingEvidence: "Net leverage, debt maturities, covenant headroom, maintenance and cage-free capital expenditure, working-capital sensitivity, hedging, and insurance limits."
      whyItMatters: "Revenue, transaction value, and committed investment are not cash availability, margin, free cash flow, or loss absorption."
      diligencePath: "Obtain audited consolidated statements, debt documents, covenant calculations, capex plan, price-risk policy, insurance schedules, and downside stress tests."
      relatedQuestionRefs:
        - "QR005"
        - "QR008"
    - type: "enumeration-incomplete"
      severity: "material"
      topic: "dependency-concentration"
      missingEvidence: "Customer, channel, supplier, feed-input, logistics, and site concentration plus contract duration and renewal economics."
      whyItMatters: "Vertical integration changes where dependencies sit but does not quantify concentration or substitution capacity."
      diligencePath: "Request top-20 customer and supplier schedules, channel margins, contract terms, alternate-source capacity, and single-point-of-failure maps."
      relatedQuestionRefs:
        - "QR007"
        - "QR008"
