callouts:
  - calloutType: "risk"
    title: "Disease risk is structural, not a one-period variance"
    body: >-
      Industry evidence shows persistent flock depopulation, slow biological replacement, and large
      price responses; diligence should therefore test prevention, containment, insurance, and
      recovery at each material site.
    claimRefs:
      - "CR008"
      - "CR010"
      - "CR011"
      - "CR016"
  - calloutType: "recommendation"
    title: "Condition underwriting on an operating-risk data room"
    body: >-
      Require site-level biosecurity, compliance, loss, cage-free capacity, integration, leverage,
      covenant, and concentration evidence before treating scale or sponsor support as sufficient
      mitigation.
    claimRefs:
      - "CR006"
      - "CR007"
      - "CR013"
      - "CR016"
