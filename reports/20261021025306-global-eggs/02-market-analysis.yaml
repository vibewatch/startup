figures:
  - id: FM001
    title: Evidence-constrained market sizing hierarchy
    type: pyramid
    summary: >-
      Public evidence narrows from a broad category estimate to operating scale, but stops
      before a defensible company-specific SAM or SOM.
    data:
      items:
        - label: Broad global eggs category
          value: "USD 257.00B"
          detail: "Data Bridge 2024 estimate; includes animal-based and plant-based eggs."
        - label: Animal-based component
          value: "75.5% share"
          detail: "Data Bridge 2024 category share; not converted into dollars here."
        - label: Emerging-market growth contribution
          value: "About 90%"
          detail: "Share of forecast ten-year growth reported by Food Business News from RaboResearch/WEO."
        - label: International trade
          value: "About 2%"
          detail: "Share of global production exported, indicating predominantly local supply."
        - label: Global cage-free specialty segment
          value: "USD 5.8B"
          detail: "Research and Markets 2025 estimate; a narrower category with separate methodology."
        - label: Global Eggs company-specific SAM and SOM
          value: "Not public"
          detail: "Requires geography-, format-, channel-, and price-level company data."
    approximationNotes: >-
      This is a hierarchy of evidence boundaries, not a proportional or nested TAM/SAM/SOM
      calculation; values use different years, units, populations, and methodologies.
    claimRefs: [CM003, CM007, CM008, CM015, CM016]
callouts:
  - calloutType: insight
    title: A large category does not establish a large company-specific SAM
    body: >-
      Broad market estimates include categories and geographies that may not be reachable by
      Global Eggs; underwriting should use company shipments and realized prices by region,
      format, and channel.
    claimRefs: [CM001, CM003, CM008, CM016]
  - calloutType: risk
    title: Supply shocks can overwhelm demand-led forecasts
    body: >-
      HPAI losses, cage-free capacity gaps, and rapid wholesale-price reversals make near-term
      market value a poor proxy for normalized demand or sustainable margin.
    claimRefs: [CM010, CM011, CM012, CM013, CM014]
