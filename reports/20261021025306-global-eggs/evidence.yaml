evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: A complete current executive team, board roster, committee map, voting-rights schedule, and succession plan.
    whyItMatters: >-
      Founder dependence and the investor director's actual governance influence cannot be assessed from two named
      leaders.
    diligencePath: >-
      Request the current organization chart, board materials, governance documents, and key-person succession plan from
      management.
    relatedQuestionRefs:
      - QO002
      - QO006
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: funding
    missingEvidence: >-
      Closing documents showing funded proceeds, security type, primary-versus-secondary allocation, use of proceeds,
      debt, maturities, and covenants.
    whyItMatters: >-
      An investment of up to $1 billion and an $8 billion valuation do not establish liquidity, leverage, or capital
      available for expansion.
    diligencePath: >-
      Obtain the signed transaction documents, post-close capitalization table, debt schedule, bank statements, and
      covenant compliance certificates.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: cover-metrics
    missingEvidence: >-
      Audited consolidated current revenue, segment margins, customer count and concentration, headcount, site list, and
      operating headquarters.
    whyItMatters: >-
      Physical scale and a 2024 combined-revenue figure cannot establish current earnings quality or organizational
      complexity.
    diligencePath: >-
      Request audited consolidated financials, segment reporting, customer concentration schedules, HR census, and
      legal-entity/site registers.
    relatedQuestionRefs:
      - QO004
  - type: enumeration-incomplete
    severity: material
    topic: ownership
    missingEvidence: >-
      Full capitalization and stakeholder records covering all equity holders, lenders, minority interests, and related
      parties.
    whyItMatters: Publicly named stakeholders do not reveal control, dilution, minority claims, or intercompany economic rights.
    diligencePath: >-
      Reconcile the cap table, shareholder register, lender schedule, minority-interest ledger, and related-party
      transactions.
    relatedQuestionRefs:
      - QO003
      - QO006
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: company-addressable-market
    missingEvidence: Company shipment volumes, realized prices, capacity, and market shares by geography, format, and channel.
    whyItMatters: >-
      Without these inputs, broad category estimates cannot be converted into a defensible company-specific SAM, SOM, or
      capture rate.
    diligencePath: >-
      Obtain management's volume-price-mix bridge and reconcile it to audited revenue and third-party production
      statistics.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: >-
