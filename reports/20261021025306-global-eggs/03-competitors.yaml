      Ordinal x score uses disclosed layer-count bands: 5 for at least 40m, 4 for 20m-39.99m,
      and 3 for 10m-19.99m. Ordinal y score is an analyst classification of the number and
      breadth of product families stated in Egg Industry, not market share, quality, or margin.
    claimRefs: [CP001, CP002, CP003, CP008, CP015]
callouts:
  - calloutType: insight
    title: Scale is necessary but not distinctive
    body: >-
      Global Eggs has crossed the threshold into the top U.S. producer group, but nearly every
      material product category is available from incumbents. Durable upside depends on proving
      integration, multinational procurement or distribution advantages, and customer outcomes.
    claimRefs: [CP001, CP004, CP008, CP015, CP016]
  - calloutType: risk
    title: Benchmark pricing and litigation complicate trust
    body: >-
      Common benchmark-linked contracts may narrow nominal pricing differentiation, while
      unresolved industry litigation creates conduct and reputation risk. The allegations
      are not findings, and company-specific exposure requires legal diligence.
    claimRefs: [CP012, CP013, CP014]
