              - CI008
              - CI009
              - CI015
      - number: '4.2'
        title: Pricing, margin, and unit economics
        blocks:
          - type: paragraph
            body: >-
              No reviewed source discloses Global Eggs' realized price per dozen, contract duration, customer rebates,
              gross margin, EBITDA, or contribution margin. Industry evidence shows why a revenue headline is
              insufficient: CoBank reported that U.S. egg prices had risen 250% since 2019 amid supply disruption, while
              cage-free production requires more space, infrastructure, labor attention, and feed. Those conditions can
              lift revenue and costs at the same time. The company's product breadth may support mix premiums, but
              neither the premium nor its durability is quantified. Sales efficiency should be assessed through
              physical-market measures such as utilization, sell-through, spoilage, logistics cost, customer
              concentration, and contract-versus-spot exposure rather than SaaS metrics. The absence of those measures
              prevents a defensible gross-profit bridge or payback calculation.
            claimRefs:
              - CI007
              - CI009
              - CI012
              - CI015
          - type: table
            tableRef: TI002
            claimRefs:
              - CI007
              - CI012
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI005
              - CI009
              - CI010
              - CI011
              - CI012
              - CI015
              - CI016
      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Warburg Pincus agreed in March 2026 to invest up to US$1 billion at a stated US$8 billion valuation, with
              several transaction and trade sources corroborating the headline terms. "Up to" is a commitment ceiling,
              not proof that the full amount has funded, and it is not a cash-on-hand disclosure. The issuing release
              describes the investor's capital-solutions mandate as flexible across balance-sheet optimization,
              shareholder liquidity, M&A, and growth, but does not allocate this transaction among those uses.
              Independent coverage also notes that specific financial details remain undisclosed. The historical funding
              and acquisition chronology is addressed in Company Overview; the financial question here is forward
              adequacy. Without funding schedule, primary-versus-secondary split, debt maturities, covenant headroom,
              capex plan, burn, and cash balance, runway and the next financing trigger cannot be underwritten.
            claimRefs:
              - CI001
              - CI002
              - CI010
              - CI011
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The public file supports a scale thesis, not an earnings-quality thesis. More than US$2 billion of
              reported combined 2024 revenue, more than 45 million birds, and a large proposed equity investment
              indicate substantial operating reach and financing access. They do not establish recurring revenue,
              gross-margin resilience, free cash flow, or adequate liquidity. The principal downside is a
              capital-intensive platform facing biological and price shocks: CoBank documents sharp flock and price
              volatility, while the 2026 FAO/WHO/WOAH assessment continues to describe far-reaching implications of
              avian influenza for poultry populations. The investable conclusion is therefore conditional. Revenue scale
              is credible enough for continued diligence, but audited consolidation, segment economics, working-capital
              behavior, leverage, and transaction proceeds must be obtained before assigning value to synergies or
              treating the new commitment as runway.
            claimRefs:
              - CI001
              - CI003
              - CI005
              - CI011
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Commitment is not liquidity
            body: >-
              The announced financing is capped at up to US$1 billion, while draw timing, transaction structure,
              proceeds use, cash balance, debt, and runway remain undisclosed.
            calloutType: risk
            claimRefs:
              - CI001
              - CI010
              - CI011
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Global Eggs is primarily a physical-product platform serving business buyers rather than a software or
              marketplace product. Independent market data describes its customer focus as B2B and its revenue model as
              product sales. The publicly described portfolio covers conventional, cage-free, free-range, and specialty
              eggs, while the company also identifies table eggs and hatching eggs as operating segments. That breadth
              addresses different retailer, distributor, foodservice, and production-system requirements, but public
              sources do not disclose SKU-level volumes, realized premiums, service levels, or customer-specific
              specifications. The company says it has exported to more than 20 countries, indicating a cross-border
              distribution capability without proving the consistency, economics, or certification status of each route.
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: table
            tableRef: TE001
            claimRefs:
