      - number: '1.3'
        title: Expansion record and diligence implications
        blocks:
          - type: paragraph
            body: >-
              The visible expansion sequence is acquisition-led: Hevo Group in Spain in November 2024, a $1.1 billion
              Hillandale Farms agreement announced in March 2025, the Warburg Pincus investment announced in March 2026,
              and Pearl Valley Farms announced in April 2026. WATT reported that the constituent businesses generated
              more than $2 billion of combined revenue in 2024; this is neither ARR nor a verified 2026 run rate and
              should not be presented as either. The homepage's one-day-delivery and very-high-stable-margin language is
              also company marketing without a disclosed service-level denominator or accounting margin. Independent
              retailer evidence adds a counterweight: Walmart and Kroger revised cage-free timelines amid supply, cost,
              and consumer-price constraints. The core diligence issue is therefore whether acquisition integration,
              funding drawdown, customer mix, and premium-product demand can convert reported physical scale into
              durable cash earnings.
