  - id: FV001
    title: Evidence-to-recommendation decision path
    type: flow
    summary: >-
      The current evidence progresses from category demand and operating scale to a transaction mark, then stops at
      missing normalization inputs and a research-more decision.
    data:
      nodes:
        - id: demand
          label: Category demand
          value: 22% ten-year global egg-market growth forecast
          detail: A supportive demand floor, not a company-specific earnings forecast.
        - id: scale
          label: Operating scale
          value: More than 45 million birds and over 15 billion eggs annually
          detail: Scale is reported by transaction participants.
        - id: revenue
          label: Revenue anchor
          value: Over US$2 billion combined revenue in 2024
          detail: Independent industry reporting; not ARR or audited cash flow.
        - id: transaction
          label: Current transaction mark
          value: Up to US$1 billion invested at an announced US$8 billion valuation
          detail: Houlihan Lokey reports the transaction closed April 8, 2026.
        - id: missing-inputs
          label: Normalization gap
          value: No audited EBITDA, net debt, valuation basis, dilution, or preference terms
          detail: The headline mark cannot be converted into an enterprise multiple or target return.
        - id: decision
          label: Decision
          value: Research more; valuation stance stretched
          detail: Advance only after capitalization, earnings quality, leverage, and downside liquidity are verified.
    approximationNotes: >-
      Values are displayed as reported or as explicit evidence gaps; the ordered flow does not imply mathematical
      conversion or a probability-weighted valuation.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV009
      - CV012
