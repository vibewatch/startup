      - number: '1.2'
        title: Ownership, capital, and governance
        blocks:
          - type: paragraph
            body: >-
              The clearest current capital marker is Warburg Pincus's agreement to invest up to $1 billion at an
              announced $8 billion valuation. "Up to" is a commitment ceiling: it is not evidence that $1 billion has
              been funded, that the amount is entirely primary equity, or that the company has that cash available.
              Latham & Watkins described the same transaction while acting for Warburg Pincus, and industry reporting
              independently repeated the headline terms. Allison Ross was announced as joining the board, adding an
              investor representative alongside founder and executive chairman Ricardo Faria. However, a full board
              roster, voting rights, shareholder percentages, debt and covenant terms, and use-of-proceeds allocation
              were not disclosed in the retained public evidence. Governance therefore remains demonstrably
              founder-centered but cannot be reduced to a verified control percentage.
