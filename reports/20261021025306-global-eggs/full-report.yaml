      - number: '3.2'
        title: Capability parity and moat durability
        blocks:
          - type: paragraph
            body: >-
              Global Eggs competes with a portfolio spanning conventional, cage-free, free-range, specialty, shell, and
              processed formats, but the leading peers also cover many of those same categories. Cal-Maine combines the
              largest flock with brands and value-added food acquisitions; Rose Acre adds substantial breaking and
              liquid-egg capacity; and regional networks can aggregate distribution and format breadth. Global Eggs
              therefore appears differentiated less by a unique SKU than by a multinational footprint, acquisition
              execution, and access to expansion capital. The Hillandale transaction and the later Warburg Pincus
              commitment reinforce that strategic direction, while also increasing the burden of proving integration,
              operating consistency, and returns on acquired capacity.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP007
              - CP008
              - CP009
              - CP010
              - CP015
      - number: '3.3'
        title: Pricing, distribution, and switching friction
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not support a clean producer-by-producer price comparison. The retained legal
              reporting says plaintiffs allege that more than 95% of U.S. eggs are sold under contracts linked to the
              Urner Barry benchmark; that allegation describes an industry mechanism, not Global Eggs' realized terms. A
              common benchmark may make nominal price formulas comparable, while service levels, product certification,
              packing, freight, continuity of supply, and retailer relationships determine practical switching friction.
              International trade is only about 2% of global production, according to RaboResearch as reported by Food
              Business News, which increases the value of local capacity and distribution. No retained source quantifies
              Global Eggs' customer concentration, retention, discounts, contract duration, or multi-homing.
            claimRefs:
              - CP011
              - CP012
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP008
              - CP010
              - CP012
              - CP014
              - CP016
      - number: '3.4'
        title: Incumbent response and adverse competitive evidence
        blocks:
          - type: paragraph
            body: >-
              Incumbents are not static. Cal-Maine has expanded into value-added foods, Rose Acre announced major
              western processing capacity, and multiple large producers offer the same welfare and specialty formats
              that Global Eggs markets. At the same time, federal civil complaints have named Cal-Maine, Rose Acre,
              Daybreak, Versova, and Hillandale among defendants in alleged egg price-fixing litigation. These are
              allegations rather than findings, but they highlight regulatory and reputational exposure across a
              concentrated industry. The investment implication is that scale alone is not a durable moat: Global Eggs
              must demonstrate superior integration, biosecurity, customer service, and capital allocation while
              avoiding commoditization and conduct risks that can erode trust across the entire producer group.
            claimRefs:
              - CP008
              - CP009
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale is necessary but not distinctive
            body: >-
              Global Eggs has crossed the threshold into the top U.S. producer group, but nearly every material product
              category is available from incumbents. Durable upside depends on proving integration, multinational
              procurement or distribution advantages, and customer outcomes.
            calloutType: insight
            claimRefs:
              - CP001
              - CP004
              - CP008
              - CP015
              - CP016
          - type: callout
            title: Benchmark pricing and litigation complicate trust
            body: >-
              Common benchmark-linked contracts may narrow nominal pricing differentiation, while unresolved industry
              litigation creates conduct and reputation risk. The allegations are not findings, and company-specific
              exposure requires legal diligence.
            calloutType: risk
            claimRefs:
              - CP012
              - CP013
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              Global Eggs monetizes physical egg production rather than a recurring software contract. Its disclosed
              portfolio spans conventional, cage-free, free-range, and specialty table eggs, while the official
              corporate description also includes hatching eggs and exports to more than twenty countries. Vertical
              integration from pullet breeding and feed formulation through packaging and logistics gives the group
              control over multiple operating stages, but it also embeds feed, flock, processing, and distribution costs
              inside the revenue model. WATT Poultry reports that the businesses now grouped under Global Eggs generated
              more than US$2 billion of combined 2024 revenue. That historical combined figure should not be treated as
              audited consolidated revenue: the company's earlier Hillandale announcement separately described US$2
              billion as the annual revenue that the transaction would bring. Public evidence offers no revenue mix by
              geography, channel, brand, or egg category.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
          - type: table
            tableRef: TI001
            claimRefs:
              - CI005
