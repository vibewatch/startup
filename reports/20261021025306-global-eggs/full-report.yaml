              - CE002
              - CE003
              - CE008
      - number: '5.2'
        title: Operating architecture and maturity
        blocks:
          - type: paragraph
            body: >-
              The disclosed operating model is a vertically integrated physical chain rather than a proprietary digital
              stack. Reporting attributes more than 50 farms, more than 45 million birds, and planned 2026 output above
              15 billion eggs to the platform. Pulse 2 describes the company-wide chain as spanning pullet breeding,
              feed formulation, packaging, and logistics; Global Eggs separately says Hillandale integrates the egg
              value chain. Industry evidence adds laying, grading, packing, and distribution as typical stages for large
              integrated producers, but those benchmark stages should not be treated as verified at every Global Eggs
              site. The public file therefore demonstrates scale and broad integration, while leaving process
              harmonization, systems architecture, throughput, downtime, and site-level control evidence unresolved.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
              - CE011
          - type: table
            tableRef: TE003
            claimRefs:
              - CE007
              - CE008
              - CE011
              - CE012
              - CE013
          - type: figure
            figureRef: FE001
            claimRefs:
