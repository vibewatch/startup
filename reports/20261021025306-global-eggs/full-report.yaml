        - 'Positive: audited synergy realization, conservative leverage, and investor terms aligned with new capital.'
    notes: >-
      Scale figures originate from transaction participants and are corroborated by industry reporting; market forecasts
      are third-party estimates, not company guidance.
    claimRefs:
