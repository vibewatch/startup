  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Global Eggs says Ricardo Faria founded the company in 2018 and remains executive chairman. Its operating
              model spans pullet breeding, feed formulation, packaging, and logistics, with regional brands including
              Hillandale Farms in the United States, Granja Faria and Prodhin in South America, and Hevo Group in
              Europe. Company and investor-issued materials describe more than 45 million birds, more than 50 farms
              across three continents, and a 2026 production trajectory above 15 billion eggs. Those scale figures are
              current management or transaction claims, not audited operating statistics. The retained sources identify
              a Luxembourg holding company but do not establish a single operating headquarters. They also disclose
              neither employee count nor named-customer count, so those cover metrics remain unavailable rather than
              estimated.
