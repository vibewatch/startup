  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Scenario
      - Evidence-led assumptions
      - Valuation and return logic
      - Probability signal
      - Downside or upgrade trigger
    rows:
      - - Bull
        - >-
          Integration delivers measurable synergies; margins and cash conversion remain durable; category and cage-free
          demand expand.
        - >-
          Value above the US$8 billion mark is supportable only if audited earnings growth and deleveraging produce an
          acceptable entry-to-exit return.
        - Audited EBITDA growth, positive free cash flow, lower leverage, and stable flock productivity.
        - Upgrade only after transaction terms and recurring earnings validate the price.
      - - Base
        - Scale is strategically credible, but earnings quality, leverage, and ownership economics remain unverified.
        - The US$8 billion mark is a financing reference, not a defensible valuation range or enterprise multiple.
        - Results broadly track the reported revenue base while integration and disease costs remain manageable.
        - Remain research-more until the capitalization and audited financial package is available.
      - - Bear
        - Synergies underdeliver while HPAI, normalization of egg prices, or welfare capex compresses cash generation.
        - >-
          Fair value would be below the announced mark if leverage or recurring earnings cannot support the transaction
          price; no precise floor is evidenced.
        - Flock losses, covenant tightening, weak cash conversion, or customer attrition.
        - Thesis break if the company cannot reconcile price to audited cash generation and downside liquidity.
    notes: >-
      Scenarios are directional because public sources do not disclose audited EBITDA, free cash flow, net debt,
      security preferences, ownership acquired, or management forecasts; no probability or valuation range is estimated.
    claimRefs:
      - CV005
      - CV006
      - CV008
      - CV009
      - CV012
      - CV014
      - CV015
      - CV016
