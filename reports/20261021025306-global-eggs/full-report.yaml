      - number: '2.2'
        title: Buyers, users, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The public evidence identifies two broad end-user pools: retail or household consumption and foodservice.
              Within those pools, the economic buyer is typically a retailer, distributor, restaurant operator, or food
              manufacturer, while the end user may be a household consumer, commercial kitchen, or production line. Data
              Bridge reports that retail or household demand was the largest end-user segment in 2024 and expects
              foodservice to grow fastest; it also expects processed eggs to outgrow shell eggs because bakeries,
              confectionery producers, and ready-to-eat manufacturers value consistency, convenience, and shelf life.
              The route to adoption therefore differs by format: shell eggs depend on category placement, freshness,
              price, and welfare claims, while processed products depend on formulation performance, supply assurance,
              and procurement qualification. Public sources do not disclose Global Eggs' customer mix, contract
              structure, channel margins, or budget-owner concentration, so the buyer map is directional rather than a
              measured revenue segmentation.
            claimRefs:
              - CM004
              - CM005
              - CM009
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM008
              - CM009
              - CM011
              - CM012
      - number: '2.3'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              Long-run demand is supported by eggs' role as an affordable protein, income growth and urbanization in
              emerging markets, and the shift toward specialty and value-added formats. Food Business News reports that
              about 90% of forecast ten-year growth is expected from emerging markets, but also that only about 2% of
              global production is exported. This combination favors local or regional production platforms rather than
              a single global export pool. The main constraint is supply volatility. CoBank reported that more than 100
              million U.S. table-egg layers had been affected by highly pathogenic avian influenza over the three years
              through January 2025. USDA subsequently reported a nearly 50% decline in wholesale prices between February
              26 and March 19, 2025, illustrating how quickly shortage economics can reverse. Welfare conversion adds
              another capital burden: public secondary analysis reports higher production costs for cage-free,
              free-range, and pasture-raised systems, while CoBank found cage-free capacity below earlier implied
              corporate sourcing requirements.
            claimRefs:
              - CM007
              - CM008
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Company relevance and investment implication
        blocks:
          - type: paragraph
            body: >-
              Global Eggs has meaningful operating relevance to these market shifts, but public scale claims are not the
              same as addressable-market proof. Warburg Pincus reported in March 2026 that the company had more than 45
              million birds across more than 50 farms on three continents and was on track to produce over 15 billion
              eggs that year; Private Equity Wire repeated the annual production figure. That footprint creates exposure
              to regional demand, specialty formats, and procurement scale, but it also concentrates underwriting on
              biosecurity, local regulation, feed and logistics execution, and post-acquisition integration. The
              evidence supports a large category and a scaled operator, not a precise market share or capture rate.
              Investment diligence should therefore model geography, format, channel, and production system separately,
              reconcile the competing market forecasts, and obtain company shipment volumes, realized pricing, customer
              concentration, and cage-free capacity before using a market multiple or claiming a defined SAM/SOM.
            claimRefs:
              - CM002
              - CM006
              - CM008
              - CM011
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: A large category does not establish a large company-specific SAM
            body: >-
              Broad market estimates include categories and geographies that may not be reachable by Global Eggs;
              underwriting should use company shipments and realized prices by region, format, and channel.
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
              - CM008
              - CM016
          - type: callout
            title: Supply shocks can overwhelm demand-led forecasts
            body: >-
              HPAI losses, cage-free capacity gaps, and rapid wholesale-price reversals make near-term market value a
              poor proxy for normalized demand or sustainable margin.
            calloutType: risk
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape, scale, and alternatives
        blocks:
          - type: paragraph
            body: >-
              The immediate U.S. competitive set is concentrated among Cal-Maine, Rose Acre, Daybreak, Global Eggs'
              former Hillandale operations, and interconnected regional groups such as Versova. Egg Industry ranked
              Global Eggs' U.S. division fourth with 21.00 million layers at year-end 2025, behind Cal-Maine at 50.86
              million, Rose Acre at 25.97 million, and Daybreak at 24.00 million. That position provides national-scale
              relevance but not leadership. Adjacent competition includes processed-egg specialists, private-label
              suppliers, and specialty producers; buyer alternatives also include multi-sourcing, product reformulation,
              and other proteins. Internal production is a theoretical substitute, but the sector's vertically
              integrated, capital-intensive, biosecurity-sensitive operating model makes it an unattractive path for
              most retail and foodservice buyers.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP008
              - CP010
              - CP011
          - type: table
            tableRef: TP001
            claimRefs:
