  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and sizing
        blocks:
          - type: paragraph
            body: >-
              The investable market should be bounded around animal-based table eggs sold through retail, foodservice,
              and industrial channels, with processed egg products and specialty formats treated as adjacent segments.
              Plant-based substitutes belong in competitive context rather than the core addressable market, even though
              one commercial market study includes them in a $257.00 billion 2024 global "eggs" category and reports
              animal-based products as 75.5% of that total. Published growth lenses do not reconcile: Data Bridge
              forecasts $428.54 billion by 2032 at a 6.60% CAGR, whereas RaboResearch and the World Egg Organization, as
              reported by Food Business News, forecast 22% growth over ten years, or about 2% annually. A separate
              cage-free study estimates only the specialty segment at $5.8 billion in 2025 and $7.5 billion by 2032.
              These estimates use different boundaries, periods, and likely value-versus-volume methods, so none is a
              defensible Global Eggs TAM, SAM, or SOM without paid methodology and company shipment data.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM007
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM015
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM007
              - CM008
              - CM015
