companyProfile:
  summary: >-
    Global Eggs is a founder-led, acquisition-built egg platform operating regional brands across the United States,
    South America, and Europe. Its vertically integrated model spans pullet breeding, feed formulation, egg production,
    packaging, and logistics, while current transaction materials describe more than 45 million birds and more than 50
    farms.
