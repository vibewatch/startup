      - number: '3.2'
        title: 能力同质化与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              Global Eggs 的产品组合覆盖普通、无笼、散养、特色、带壳和加工形式，但领先同行也覆盖其中许多品类。Cal-Maine 将最大鸡群与品牌和增值食品收购结合；Rose Acre
              增加了可观的破蛋和液蛋产能；区域网络则能汇总配送和形式宽度。因此，Global Eggs 的差异化似乎不在独特 SKU，而在跨国版图、收购执行和扩张资本获取。Hillandale 交易及后续 Warburg
              Pincus 承诺强化了这一战略方向，同时也提高了证明整合、运营一致性和收购产能回报的要求。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP007
