      - number: '2.2'
        title: 买方、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              公开证据确认两类广义终端用户：零售或家庭消费，以及餐饮服务。在这两类用户中，经济买方通常是零售商、分销商、餐厅运营商或食品制造商；终端用户可能是家庭消费者、商用厨房或生产线。Data Bridge 称 2024
              年零售或家庭需求是最大的终端用户分部，并预计餐饮服务增长最快；其还预计加工蛋品增速超过带壳鸡蛋，因为烘焙店、糖果生产商和即食食品制造商看重一致性、便利性和保质期。因此，不同产品形式的采用路径不同：带壳鸡蛋取决于品类陈列、新鲜度、价格和动物福利声明；加工产品则取决于配方表现、供应保障和采购认证。公开来源未披露
              Global Eggs 的客户组合、合同结构、渠道利润率或预算决策人集中度，因此买方地图只是方向性判断，并非经测量的收入分层。
            claimRefs:
              - CM004
              - CM005
              - CM009
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM008
              - CM009
              - CM011
              - CM012
      - number: '2.3'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              长期需求受鸡蛋作为可负担蛋白质的地位、新兴市场收入增长和城市化，以及特色化、增值化形式转移的支撑。Food Business News 报道称，未来十年预测增长约 90% 来自新兴市场，但全球产量中只有约 2%
              出口。这一组合更利于本地或区域生产平台，而非单一全球出口池。主要约束是供应波动。CoBank 报告称，截至 2025 年 1 月的三年间，超过 100 million
              只美国餐桌蛋产蛋鸡受到高致病性禽流感影响。USDA 随后报告，2025-02-26 至 2025-03-19 期间批发价近乎下降
              50%，说明短缺经济可能迅速反转。福利标准转换还会增加资本负担：公开二手分析称无笼、散养和牧场饲养体系的生产成本更高，而 CoBank 发现无笼产能低于此前隐含的企业采购要求。
            claimRefs:
              - CM007
              - CM008
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: 公司相关性与投资含义
        blocks:
          - type: paragraph
            body: >-
              Global Eggs 与这些市场变化有实质运营关联，但公开规模声明不等于可服务市场证明。Warburg Pincus 于 March 2026 称，公司在三大洲超过 50 座农场拥有超过 45 million
              只禽鸟，并有望当年生产超过 15 billion 枚鸡蛋；Private Equity Wire
              重复了年度产量。该版图带来区域需求、特色形式和采购规模敞口，也让投资判断集中于生物安全、地方监管、饲料和物流执行以及收购后整合。证据支持一个大品类和一家规模化运营商，但不支持精确市场份额或捕获率。投资尽调应分别建模地域、形式、渠道和生产体系，调和相互冲突的市场预测，并在采用市场倍数或声称有明确
              SAM/SOM 前取得公司出货量、实际定价、客户集中度和无笼产能。
            claimRefs:
              - CM002
              - CM006
              - CM008
              - CM011
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 大品类不等于公司特定 SAM 很大
            body: 广泛市场估算包含 Global Eggs 可能无法触达的品类和地域；投资判断应按地区、形式和渠道使用公司出货量及实际价格。
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
              - CM008
              - CM016
          - type: callout
            title: 供应冲击可能压过需求驱动的预测
            body: HPAI 损失、无笼产能缺口和批发价快速反转，使近期市场价值难以代表正常化需求或可持续利润率。
            calloutType: risk
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局、规模与替代方案
        blocks:
          - type: paragraph
            body: >-
              美国直接竞争格局集中在 Cal-Maine、Rose Acre、Daybreak、Global Eggs 原 Hillandale 业务，以及 Versova 等相互关联的区域集团。Egg Industry 按
              2025 年末产蛋鸡数量将 Global Eggs 美国分部列为第四，为 21.00 million 只，落后于 Cal-Maine 的 50.86 million、Rose Acre 的 25.97
              million 和 Daybreak 的 24.00
              million。这一位置具备全国规模意义，但不是领先地位。相邻竞争包括加工蛋品专业商、零售自有品牌供应商和特色生产商；买方还可选择多源采购、产品改配和其他蛋白质。内部生产是理论替代方案，但该行业垂直一体化、资本密集且对生物安全敏感，大多数零售和餐饮服务买方都不太可能自行走这条路。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP008
              - CP010
              - CP011
