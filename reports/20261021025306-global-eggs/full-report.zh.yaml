              - CP009
              - CP010
              - CP015
      - number: '3.3'
        title: 定价、分销与转换摩擦
        blocks:
          - type: paragraph
            body: >-
              公开证据不足以支持逐家生产商的清晰价格比较。现有法律报道称，原告声称超过 95% 的美国鸡蛋按与 Urner Barry 基准挂钩的合同销售；这一指控描述的是行业机制，不是 Global Eggs
              的实际条款。共同基准可能使名义价格公式可比，但服务水平、产品认证、包装、运费、供应连续性和零售商关系才决定实际转换摩擦。据 Food Business News 报道，RaboResearch
              称国际贸易仅占全球产量约 2%，因此本地产能和分销更有价值。现有来源未量化 Global Eggs 的客户集中度、留存、折扣、合同期限或多供应商采购。
            claimRefs:
              - CP011
              - CP012
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP008
              - CP010
              - CP012
              - CP014
              - CP016
      - number: '3.4'
        title: 既有厂商反应与不利竞争证据
        blocks:
          - type: paragraph
            body: >-
              既有厂商并非静止不动。Cal-Maine 已扩展到增值食品，Rose Acre 宣布大规模西部加工产能，多家大型生产商也提供 Global Eggs 营销的相同福利和特色形式。同时，联邦民事诉状将
              Cal-Maine、Rose Acre、Daybreak、Versova 和 Hillandale
              列为涉嫌鸡蛋价格操纵诉讼的被告。这些是指控而非裁定，但凸显了集中行业的监管和声誉敞口。投资含义是：规模本身不是持久护城河；Global Eggs
              必须证明整合、生物安全、客户服务和资本配置更优，同时避免商品化及行为风险侵蚀整个生产商群体的信任。
