  - id: FV001
    title: 从证据到建议的决策路径
    type: flow
    summary: 当前证据从品类需求和运营规模推进至交易估值锚点，随后止步于缺少正常化输入数据以及“继续研究”的决策。
    data:
      nodes:
        - id: demand
          label: 品类需求
          value: 22% ten-year global egg-market growth forecast
          detail: 支撑性的需求底线，不是公司特定的盈利预测。
        - id: scale
          label: 运营规模
          value: More than 45 million birds and over 15 billion eggs annually
          detail: 交易参与方报告了公司规模。
        - id: revenue
          label: 收入锚点
          value: Over US$2 billion combined revenue in 2024
          detail: 独立行业报道；不是 ARR 或经审计现金流。
        - id: transaction
          label: 当前交易估值锚点
          value: Up to US$1 billion invested at an announced US$8 billion valuation
          detail: Houlihan Lokey 报告交易于 2026 年 4 月 8 日完成交割。
        - id: missing-inputs
          label: 正常化缺口
          value: No audited EBITDA, net debt, valuation basis, dilution, or preference terms
          detail: 标题估值锚点无法换算成企业价值倍数或目标回报。
        - id: decision
          label: 决策
          value: Research more; valuation stance stretched
          detail: 只有在资本结构、盈利质量、杠杆和下行流动性得到验证后，才推进。
    approximationNotes: 数值按已报告数据或明确的证据缺口展示；有序流程不代表数学转换或按概率加权的估值。
