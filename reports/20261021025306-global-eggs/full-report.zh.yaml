        blocks:
          - type: paragraph
            body: >-
              公开材料支持规模论点，而非盈利质量论点。超过 US$2 billion 的 2024 年合计收入、超过 45 million
              只禽鸟和大额拟议股权投资，说明运营触达和融资渠道可观，但不能证明经常性收入、毛利韧性、自由现金流或流动性充足。主要下行风险是资本密集平台遭遇生物和价格冲击：CoBank 记录了鸡群和价格的剧烈波动，2026 年
              FAO/WHO/WOAH 评估仍称禽流感对家禽种群影响深远。因此，可投资结论是有条件的。收入规模足以继续尽调，但在把协同效应计入价值或将新承诺视为现金续航
