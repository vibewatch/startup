    columns:
      - 立场
      - 论点
      - 证据信号
      - 哪些事实会改变判断
    rows:
      - - 正论
        - 已具规模的跨国平台
        - 据报道，公司拥有 4500 万只以上蛋鸡、50 多座农场，年产蛋量超过 150 亿枚。
        - 负面：经审计的产能或利用率明显低于已报告的运营足迹。
      - - 正论
        - 持久的品类需求与消费升级
        - 行业来源预测，全球鸡蛋市场将在十年内增长 22%，无笼养市场到 2032 年的 CAGR 为 3.6%。
        - 负面：需求持续收缩，或福利资本开支无法获得足够回报。
      - - 反论
        - 疾病与价格周期敞口
        - CoBank 描述了持续的 HPAI 损失、美国蛋鸡存栏减少以及异常的价格波动。
        - 正面：多年生物安全与正常化利润率数据表明损失严重程度较低。
      - - 反论
        - 整合与资本结构不透明
        - US$1.1 billion 的 Hillandale 收购扩大了平台规模，但融资结构、杠杆和资金用途仍未披露。
        - 正面：经审计的协同效应兑现、保守的杠杆，以及与新增资本相匹配的投资者条款。
    notes: 规模数据来自交易参与方，并有行业报道交叉印证；市场预测是第三方估计，不是公司指引。
