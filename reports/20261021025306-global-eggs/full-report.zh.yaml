  - id: FU001
    title: 客户旅程与扩张证据图
    type: journey-map
    summary: 证据支持从产品组合向渠道扩张，但账户转化率和留存仍未量化。
    data:
      nodes:
        - label: 产品组合匹配
          detail: 常规、无笼养、自由放养、有机、特种、液蛋、食用蛋和种蛋等形式，分别满足不同买方的需求。
          touchpoints:
            - Retail assortment planning
            - Foodservice format selection
        - label: 渠道准入
          detail: 据报道，Hillandale 在美国提供零售、餐饮、工业、杂货和分销商渠道。
          touchpoints:
            - Grocery procurement
            - Distributor relationships
        - label: 签约
          detail: CoBank 报告称，大多数无笼养产量按年签约，采用固定价格或成本加成定价。
          touchpoints:
            - Annual sourcing commitments
            - Fixed or cost-plus terms
        - label: 履约
          detail: 大规模蛋鸡足迹支撑供给，但缺少账户层面的服务、订单满足率和利用率证据。
          touchpoints:
            - Production and distribution
            - Customer service levels not disclosed
        - label: 复购与续约
          detail: 指定来源中未找到公开的留存、流失、续约、满意度或队列指标。
          touchpoints:
            - Renewal proof required
            - Customer references required
        - label: 扩张
          detail: Pearl Valley 的特种产品组合和品牌可能扩大钱包份额，但取决于交易交割以及客户关系能否保留。
          touchpoints:
            - Specialty retail cross-sell
            - Foodservice liquid-product expansion
    approximationNotes: 仅为概念性证据图；节点顺序不代表转化率、客户数量或已测量的漏斗表现。
