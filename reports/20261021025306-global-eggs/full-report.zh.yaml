            body: >-
              最高的剩余风险来自生物和运营层面：CoBank 报告称截至 January 2025，超过 100 million 只美国餐桌蛋产蛋母鸡受到高致病性禽流感影响，而短生物生产周期仍无法立即恢复供应。Global
              Eggs 的规模和垂直整合可分散采购与物流，但超过 50
              座农场也增加了必须维持一致生物安全、福利、质量和事故控制的站点数量。财务敞口来自同一运营模式。鸡蛋价格高度波动，无笼体系需要额外资本和人工，公开证据也未说明对冲、保险或站点层面的缓释结果。因此，热力图将
              HPAI、整合、价格波动、无笼转型、多司法辖区合规和融资执行列为核心尽调风险，而不是声称某项未披露事故已经发生。
