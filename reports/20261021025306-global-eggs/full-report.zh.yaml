        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Warburg Pincus 于 March 2026 同意按已声明的 US$8 billion 估值投资至多 US$1
              billion，多个交易和贸易来源印证主要条款。“至多”是承诺上限，不证明全额已到账，也不是手头现金披露。发行公告称投资方的资本解决方案授权可灵活用于资产负债表优化、股东流动性、并购和增长，但未说明本交易在这些用途间如何分配。独立报道也指出具体财务细节仍未披露。历史融资和收购时间线已在公司概览讨论；此处关注未来充足性。没有资金时间表、原始与老股拆分、债务到期、契约余量、资本开支计划、现金消耗和现金余额，就无法评估
              现金续航或下一次融资触发点。
