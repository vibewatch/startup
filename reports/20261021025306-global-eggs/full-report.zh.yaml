            title: 规模可见，盈利质量不可见
            body: 公开材料支持较大的实体版图，但现有收入数据仅覆盖 2024 年，利润率表述也只是未量化的公司营销。要把规模视为可持续现金创造，仍需经审计的合并报表和分部经济性。
