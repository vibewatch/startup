            - 自由放养鸡蛋
            - 特种鸡蛋
            - 种蛋
          detail: 已披露产品类别；SKU 经济性和产品组合未披露。
        - label: 区域平台
          modules:
            - Hillandale Farms
            - Granja Faria
            - Hevo Group
          detail: 区域品牌和资产构成了通过收购建立的运营足迹。
        - label: 繁育与鸡群
          modules:
            - 雏鸡繁育
            - 产蛋鸡群
          detail: 公司层面已披露繁育情况；鸡群控制细节未披露。
        - label: 农场生产
          modules:
            - 饲料配方
            - 常规鸡舍
            - 替代性饲养系统
          detail: 已披露饲料配方；各站点的鸡舍产能不可得。
        - label: 产品处理
          modules:
            - 收集
            - 分级
            - 包装
          detail: 已披露包装；分级和自动化是行业基准项。
        - label: 市场交付
          modules:
            - 物流
            - 区域分销
            - 出口渠道
          detail: 已披露物流和出口，但没有服务水平指标。
