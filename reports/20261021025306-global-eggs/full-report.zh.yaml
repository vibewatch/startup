      - number: '1.2'
        title: 所有权、资本与治理
        blocks:
          - type: paragraph
            body: >-
              当前最清晰的资本信号是 Warburg Pincus 同意按已宣布的 $8 billion 估值投资至多 $1 billion。“至多”是承诺上限，并不证明 $1 billion
              已到账、全部属于新增股权，或公司已有这笔可用现金。Latham & Watkins 代表 Warburg Pincus 介绍了同一交易，行业报道也独立重复了主要条款。公告称 Allison Ross
              将加入董事会，成为创始人兼执行董事长 Ricardo Faria
              之外的投资方代表。不过，现有公开证据未披露完整董事名单、投票权、股东持股比例、债务和契约条款或资金用途分配。因此，治理明显以创始人为中心，但不能简化为已验证的控制比例。
            claimRefs:
