        blocks:
          - type: paragraph
            body: >-
              HPAI 是最容易观察到的运营冲击：鸡群扑杀会迅速削减产量，而替代母鸡约需 18 至 22 周成熟，鸡蛋也无法长期囤积。这种缺乏弹性的供应响应会放大价格波动；CoBank 报告鸡蛋价格自 2019 年上涨
              250%。无笼增长带来第二重结构负担，因为开放体系可能需要更多空间、人工、饲料和基础设施；没有有效控制时，疾病和伤害风险也会上升。这些压力不证明 Global Eggs
              经济性较弱，但说明收入不足以代表现金创造：公司的收购预测和 WATT 报告的合计收入都未披露利润率、营运资本、维护性资本开支、债务服务、保险赔付或损失集中度。
