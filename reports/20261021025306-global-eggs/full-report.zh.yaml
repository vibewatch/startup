  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与公开进展
        blocks:
          - type: paragraph
            body: >-
              Global Eggs 通过实体鸡蛋生产变现，而不是经常性软件合同。已披露组合覆盖普通、无笼、散养和特色餐桌鸡蛋；官方公司描述还包括孵化蛋及出口至超过 twenty
              个国家。集团从青年鸡繁育、饲料配方到包装和物流实现纵向整合，能够控制多个运营环节，但也把饲料、鸡群、加工和分销成本嵌入收入模式。WATT Poultry 报道称，如今归入 Global Eggs 的业务 2024
              年合计收入超过 US$2 billion。该历史合计数字不应视为经审计的合并收入：公司早期 Hillandale 公告另称，交易将带来 US$2 billion
              的年收入。公开证据未给出按地域、渠道、品牌或蛋品类别划分的收入组合。
