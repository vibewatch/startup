            title: 估值和融资不等于流动性
            body: $8 billion 是已宣布的交易估值，$1 billion 是“至多”投资承诺。两者都不能证明现金已到账、现金可用、企业价值、债务承载能力或历史累计融资总额。
            calloutType: risk
            claimRefs:
