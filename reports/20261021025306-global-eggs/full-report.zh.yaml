      - number: '1.3'
        title: 扩张记录与尽调含义
        blocks:
          - type: paragraph
            body: >-
              可见的扩张路径由收购驱动：November 2024 收购西班牙 Hevo Group，March 2025 宣布 $1.1 billion 的 Hillandale Farms 协议，March 2026 宣布
              Warburg Pincus 投资，April 2026 宣布 Pearl Valley Farms。WATT 报道称，这些组成业务 2024 年合计收入超过 $2 billion；该数字既不是
              ARR，也不是经过验证的 2026 年运行率，不应按任一口径呈现。官网关于一日送达和极高且稳定利润率的表述也是公司营销，未给出服务水平分母或会计利润率。独立零售商证据构成反向参照：Walmart 和 Kroger
              在供应、成本和消费者价格约束下调整了无笼鸡蛋时间表。核心尽调问题是：收购整合、资金拨付、客户组合和高端产品需求，能否把已报告的实体规模转化为持久现金收益。
            claimRefs:
