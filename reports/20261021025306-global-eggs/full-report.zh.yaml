    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营版图
        blocks:
          - type: paragraph
            body: >-
              Global Eggs 称 Ricardo Faria 于 2018 年创办公司，并继续担任执行董事长。运营模式覆盖青年鸡繁育、饲料配方、包装和物流，区域品牌包括美国的 Hillandale Farms、南美的
              Granja Faria 和 Prodhin，以及欧洲的 Hevo Group。公司和投资方材料称平台拥有超过 45 million 只禽鸟、横跨三大洲的超过 50 座农场，并预计 2026 年产量超过 15
              billion 枚鸡蛋。这些规模数字来自现任管理层或交易披露，并非经审计的运营统计。现有来源只确认一家卢森堡控股公司，无法确认单一运营总部；员工数和具名客户数也未披露，因此封面指标应视为暂无数据，而非估算值。
            claimRefs:
              - CO001
