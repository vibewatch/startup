              - CR006
              - CR007
              - CR009
              - CR012
              - CR014
              - CR015
      - number: '7.5'
        title: 缓释、监测与论点失效触发点
        blocks:
          - type: paragraph
            body: >-
              可见的缓释手段包括垂直整合、地域分散、广泛产品组合、交易顾问和即将到位的投资方治理。仅凭公开披露无法评估其成熟度。投资前应要求按月提供站点层面鸡群损失、HPAI
              停机、重新投放、死亡率、召回和保险赔付数据；各州无笼产能及已承诺需求；收购协同和整合里程碑；净杠杆、契约余量和维护性资本开支；以及头部客户、饲料供应商和渠道集中度。论点失效触发点应包括多站点反复扑杀、重大未投保损失、阻止计划产能使用的监管限制、未伴随利润恢复的整合里程碑失误、契约余量跌破约定缓冲，或证据表明已签约无笼需求无法覆盖转换经济性。这些是基于已观察行业机制提出的尽调控制，并非声称公司已违反它们。
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR016
      - number: '7.6'
        title: 展示项
        blocks:
          - type: callout
            title: 疾病风险是结构性的，不是一期波动
            body: 行业证据显示鸡群持续扑杀、生物替代缓慢且价格反应剧烈；因此尽调应在每个重要站点测试预防、遏制、保险和恢复能力。
            calloutType: risk
            claimRefs:
              - CR008
              - CR010
              - CR011
              - CR016
          - type: callout
            title: 以运营风险数据室为投资判断前提
            body: 在把规模或投资方支持视为充分缓释前，要求站点层面的生物安全、合规、损失、无笼产能、整合、杠杆、契约和集中度证据。
            calloutType: recommendation
            claimRefs:
              - CR006
              - CR007
              - CR013
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              建议为继续研究，信心中等、风险高；按已宣布的 US$8 billion 估值，价格立场偏贵。融资足以作为当前价格参考：Warburg Pincus 宣布投资至多 US$1 billion，Houlihan
              Lokey 报告交易已于 April 8, 2026
              完成。但公开记录未说明该估值是股权价值还是企业价值，也未披露净债务、清算优先权、购买的所有权比例、稀释，或增长资本与股东流动性之间的分配。这些缺口阻止可靠判断目标回报、持有期或退出价值。因此，在经审计的盈利和资本结构证据把
              标题估值转化为可投资的入场案例前，应暂不支持该价格。
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV009
              - CV010
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV009
              - CV010
              - CV014
              - CV016
      - number: '8.2'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              投资论点建立在规模、品类持久性，以及垂直整合可能把分散且依赖本地供应的品类转化为高效跨国平台之上。Global Eggs 和交易参与方称拥有超过 45 million 只禽鸟、超过 50 座农场，年产量超过 15
              billion 枚鸡蛋；独立行业报道则称 2024 年合计收入超过 US$2 billion。行业预测指向长期鸡蛋需求增长及新兴市场更快扩张。反论点同样具体：平台已吸收一笔 US$1.1 billion
              收购，鸡蛋供应和定价暴露于持续 HPAI 干扰，福利驱动的生产变化需要资本。规模可以改善采购和分销，但也会放大整合、生物安全和资本配置失败的模式。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV007
              - CV009
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.3'
        title: 乐观、基准与悲观框架
        blocks:
          - type: paragraph
            body: >-
              公开证据支持方向性情景，不支持精确估值区间。乐观情景是：经审计结果显示利润持久、杠杆受控，Hillandale、Granja Faria 和 Hevo
              产生协同，同时品类和无笼需求增长。基准情景承认战略规模，但在盈利、债务和交易条款可得前，将已宣布估值视为未验证。悲观情景包括整合交付不足、HPAI
              导致鸡群损失、供应正常化后的鸡蛋价格走弱，以及闲置或盈利不足的福利资本开支。因此，概率信号应来自运营证据：经审计 EBITDA
              和现金转化、杠杆及契约余量、农场级生物安全、收购协同和客户集中度。由于公开档案缺乏校准概率所需的分母证据，不赋予数值概率。
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV009
              - CV012
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV009
              - CV012
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 退出准备度与论点失效尽调
        blocks:
          - type: paragraph
            body: >-
              Warburg Pincus
              参与、新增投资方董事席位和已完成的机构交易改善治理与未来退出选择，但不能证明已具备退出条件。可信的下一轮、投资方之间转手或公开市场案例需要经审计合并财务、跨鸡蛋价格周期正常化的盈利、透明杠杆，以及证明收购协同能经受疾病和福利资本开支冲击。若管理层无法将
              US$8 billion
              估值与经审计现金创造对账，杠杆为鸡群重建留下的余量不足，或整合无法带来持久利润和客户留存，论点就会失效。近期尽调应索取交易资本表、优先权和流动性权利、债务及契约时间表、三年经审计分部结果、月度鸡群和 HPAI
              损失数据、协同实现情况及具名客户集中度。
            claimRefs:
              - CV002
              - CV009
              - CV010
              - CV011
              - CV014
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV009
              - CV012
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 入场纪律
            body: 将 US$8 billion 视为谈判形成的交易标记，而非公允价值。在投资判断回报前，要求经审计合并盈利、净债务、购买的所有权、证券优先权和资金用途。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV008
              - CV009
              - CV010
              - CV016
          - type: callout
            title: 论点失效触发点
            body: 若经审计现金创造无法与已宣布估值对账，或杠杆和疾病损失使整合及鸡群重建缺乏足够流动性，则停止推进。
            calloutType: risk
            claimRefs:
              - CV009
              - CV014
              - CV016
