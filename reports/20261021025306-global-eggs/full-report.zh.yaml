  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 证据驱动的假设
      - 估值与回报逻辑
      - 概率信号
      - 下行或升级触发条件
    rows:
      - - 乐观
        - 整合带来可量化的协同效应；利润率与现金转化保持韧性；品类需求和无笼养需求继续扩张。
        - 只有在经审计的盈利增长和去杠杆带来可接受的入场至退出回报时，价值才有可能高于 US$8 billion 的估值锚点。
        - 经审计 EBITDA 增长、自由现金流为正、杠杆下降，以及鸡群生产率稳定。
        - 只有在交易条款和经常性盈利验证价格合理后，才会上调判断。
      - - 基准
        - 规模在战略上可信，但盈利质量、杠杆和所有权经济性仍未得到验证。
        - US$8 billion 估值锚点是融资参考，不是可辩护的估值区间或企业价值倍数。
        - 业绩大体跟随已报告的收入基础，同时整合与疾病成本保持可控。
        - 在资本结构和经审计财务资料包可得前，继续研究。
      - - 悲观
        - 协同效应低于预期，同时 HPAI、鸡蛋价格正常化或福利资本开支压缩现金创造。
        - 如果杠杆或经常性盈利无法支撑交易价格，公允价值将低于已宣布的估值锚点；现有证据无法确定精确底价。
        - 鸡群损失、契约收紧、现金转化疲弱或客户流失。
        - 如果公司无法将价格与经审计的现金创造和下行流动性对上，投资论点失效。
    notes: 由于公开来源未披露经审计 EBITDA、自由现金流、净债务、证券优先权、收购的所有权比例或管理层预测，情景只能作方向性判断；本文不估计概率或估值区间。
    claimRefs:
      - CV005
      - CV006
      - CV008
      - CV009
      - CV012
      - CV014
      - CV015
      - CV016
