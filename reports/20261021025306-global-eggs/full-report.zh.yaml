  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模
        blocks:
          - type: paragraph
            body: >-
              可投资市场应围绕通过零售、餐饮服务和工业渠道销售的动物蛋类餐桌鸡蛋界定；加工蛋品和特色形式作为相邻分部。植物基替代品应放在竞争背景中，而非核心可服务市场，尽管一项商业研究将其纳入 2024 年全球“鸡蛋”类目
              $257.00 billion，并称动物蛋品占 75.5%。已发布的增长口径无法相互调和：Data Bridge 预计 2032 年达到 $428.54 billion，CAGR 为
              6.60%；RaboResearch 和 World Egg Organization 经 Food Business News 报道则预计十年增长 22%，即年均约 2%。另一项无笼研究仅将特色分部估为
              2025 年 $5.8 billion、2032 年 $7.5 billion。这些估算的边界、期间和可能采用的价值或销量方法各不相同；没有付费方法论和公司出货数据，任何一个都不足以作为 Global Eggs
              的可信 TAM、SAM 或 SOM。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM007
              - CM015
