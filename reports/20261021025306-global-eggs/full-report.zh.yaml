              billion、覆盖美国、南美和欧洲的扩张计划上。超过 50
              座农场、垂直整合的饲料、包装和物流，以及已收购区域业务，降低对单一外部供应商的依赖，却把依赖转移到集团内部：共同控制、管理报告、质量体系和资本配置必须跨司法辖区运转。公开证据未披露投资拨付条件、清算或治理权利、债务契约、供应商集中度、客户集中度或应急产能，因此这些项目仍属重大事项，不能假定无害。
