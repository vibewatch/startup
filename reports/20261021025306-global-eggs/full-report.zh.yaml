          detail: 20.25m 只蛋鸡；拥有丰富的特种蛋和加工形式。
        - label: Herbruck's Poultry Ranch
          x: 3
          'y': 4
          detail: 14.32m 只蛋鸡；覆盖特种、有机及机构客户产品形式。
    approximationNotes: >-
      序数 x 分数采用已披露的蛋鸡数量区间：至少 40m 只计 5 分，20m–39.99m 计 4 分，10m–19.99m 计 3 分。序数 y 分数是分析师根据 Egg Industry
      所述产品家族的数量和广度作出的分类，不代表市场份额、质量或利润率。
