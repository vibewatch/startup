  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: systems-standardization
      missingEvidence: Site-level process maps, common ERP or operations systems, integration milestones, and harmonized operating KPIs.
      whyItMatters: Acquisition scale does not establish that production, quality, and logistics controls operate consistently across the estate.
      diligencePath: Request site architecture, systems inventory, integration workplan, uptime history, and monthly KPI packs for each regional platform.
      relatedQuestionRefs: [QE008]
      relatedTableRefs: [TE003]
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: Public engineer, practitioner-community, integration-partner, repository, package, technical-talk, or recruiting evidence tied to Global Eggs' operating technology.
      whyItMatters: The assigned evidence pool contains no eligible developer or practitioner proxy for validating technical depth or implementation maturity.
      diligencePath: Obtain engineering organization materials, vendor and integrator references, technical recruiting history, and operator interviews.
      relatedQuestionRefs: [QE008]
    - type: private-evidence-only
      severity: material
      topic: quality-and-compliance
      missingEvidence: Current food-safety and animal-welfare certificates, audit reports, recall history, traceability coverage, biosecurity KPIs, and incident logs by site.
      whyItMatters: General quality claims and industry benchmarks do not verify controls, exceptions, or remediation performance across acquired facilities.
      diligencePath: Review certificates and audit findings, sample traceability tests, disease-response playbooks, recall logs, and corrective-action closure records.
      relatedQuestionRefs: [QE005, QE008]
    - type: missing-source
      severity: material
      topic: product-roadmap
      missingEvidence: Facility conversion schedule, automation roadmap, product launch plan, capex by production system, and quantified implementation milestones.
      whyItMatters: Geographic expansion intent does not establish which products, facilities, or technologies will drive future differentiation.
      diligencePath: Request the board-approved three-year product, facility, technology, and capital roadmap with accountable milestones.
      relatedQuestionRefs: [QE007]
