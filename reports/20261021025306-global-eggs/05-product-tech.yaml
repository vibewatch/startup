      - [Hatching eggs, "Poultry-production buyers", "Company-identified operating segment", "Extends beyond consumer table eggs", "Volume, geography, buyer concentration, and quality specifications"]
      - ["Regional platforms: Hillandale, Granja Faria, and Hevo", "Regional retail and distribution channels", "Operating brands reported across the United States, South America, and Europe", "Local brands and production assets within a multinational portfolio", "Common systems, cross-site standards, and integration progress"]
    notes: "Sources identify categories and operating brands, but do not provide SKU-level mix, realized pricing, margins, certification coverage, or site-level capacity by production system."
    claimRefs: [CE001, CE002, CE003, CE008]
  - id: TE002
    title: Workflow and use-case evidence
    columns:
      - User job
      - Current workflow
      - Global Eggs solution
      - Measurable public benefit
      - Limitation
    rows:
      - ["Source eggs across product systems", "Buyers specify conventional or higher-welfare formats", "Portfolio includes conventional, cage-free, free-range, and specialty eggs", "No buyer-level outcome is publicly quantified", "Mix, fill rates, quality rejects, and realized premiums are unavailable"]
      - ["Secure high-volume U.S. supply", "Retailers and distributors source from large regional producers", "U.S. division reported at 21 million layers in WATT's 2026 survey", "Scale ranking and layer count are public", "Utilization, service levels, and customer concentration are unavailable"]
      - ["Expand regional supply coverage", "Add or contract farms, packing, and distribution capacity", "Acquisition-led expansion in the United States and Spain", "Legaria capacity was reported at about 350,000 laying hens", "Integration milestones, synergy KPIs, and standardized controls are unavailable"]
    notes: "Public evidence measures asset scale rather than customer outcomes; unreported benefits remain explicitly unquantified."
    claimRefs: [CE002, CE009, CE010, CE016]
  - id: TE003
    title: Technology and operating architecture
    columns:
      - Layer or component
      - Disclosed role
      - Key dependency
      - Principal risk
    rows:
      - [Pullet breeding and flock base, "Upstream bird supply for egg production", "Flock health, genetics, housing, and biosecurity", "Disease transmission and uneven site controls"]
      - [Feed formulation and laying operations, "Convert feed and flock capacity into eggs", "Feed inputs, welfare system, farm equipment, and labor", "Feed-cost volatility and cage-free operating complexity"]
      - ["Collection, grading, packaging, and quality control", "Prepare consistent products for channels", "Automation, inspection, sanitation, and traceability", "No public site-level throughput, reject-rate, audit, or certification data"]
      - [Logistics and regional brands, "Move products to market through local platforms", "Cold chain, distribution network, demand planning, and integration", "Fragmented systems and unquantified service reliability"]
    notes: "Company-specific disclosures support breeding, feed, packaging, logistics, and broad integration; grading, automation, vaccination, and cold-chain practices are industry benchmarks, not verified uniformly across Global Eggs."
    claimRefs: [CE007, CE008, CE011, CE012, CE013]
