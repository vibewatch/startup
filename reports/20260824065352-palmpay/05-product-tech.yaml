  title: Technology / operating architecture table
  columns:
  - Layer
  - Role
  - Evidence
  - Dependency
  - Risk if weak
  rows:
  - - Consumer app layer
    - User acquisition and self-service wallet
    - Official home/app-store surfaces
    - Mobile OS and app quality
