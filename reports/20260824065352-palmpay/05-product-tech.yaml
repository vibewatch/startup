tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module
  - Primary user
  - Public evidence
  - Current maturity
  - Differentiation
  - Key gap
  rows:
  - - Consumer wallet + transfers
    - Consumers
    - Official home, about, app stores
    - Core and mature
    - Unlimited free transfers plus broad daily-finance utility
    - No public ledger or routing architecture
  - - Savings / wealth
    - Consumers
    - Official home and about; app stores
    - Core and mature
    - High-yield positioning with daily access and large active base
    - No public gross-spread or reserve structure
  - - Debit cards / local card rails
    - Consumers and merchants
    - Official home + AfriGO + Verve coverage
    - Scaling
    - Moves PalmPay beyond app-only usage into offline spend
    - No public card economics or processor stack
  - - Business account / pay-in / payout
    - Merchants and business users
    - Official about and press pages
    - Live and expanding
    - API-led collections and payouts across multiple rails
    - No public API reference or settlement-bank map
  - - POS / pay-with-transfer / agent network
    - Merchants and agents
    - Official pages + Jumia integration
    - Live and scaling
    - Bridges online and offline commerce through same brand
    - No public hardware-fleet or SLA telemetry
  - - Credit and insurance layer
    - Consumers
    - Official home/about + TechCabal expansion
    - Live but partner-mediated
    - Super-app convenience and first-borrower inclusion
    - Underwriting and partner economics are opaque
  - - Smartphone device financing
    - First-time smartphone owners
    - Official home/about + TechCrunch
    - Live in selected markets
    - Turns hardware into onboarding channel
    - Country economics and repossession flows undisclosed
  - - Cross-border business payments
    - Merchants / B2B users
    - TechCrunch 2025 + official about page
    - Emerging but meaningful
    - Single API across selected African markets
    - Cross-border settlement internals and regulatory stack are thin publicly
  notes: Maturity is inferred from documentation depth and repetition across official and independent sources rather than from internal release data.
