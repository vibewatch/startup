- id: roadmap-and-dependency-risks
  title: Roadmap and dependency risks
  body: 'PalmPay’s roadmap looks evolutionary and distribution-led rather than dependent on one dramatic technical breakthrough. Public evidence points to deeper Nigerian coverage, more offices, more cards, further market launches, and ongoing improvement in security, reliability, and product depth. That is consistent with a company whose biggest moat is operational execution across messy real-world payment environments. PalmPay’s partner-heavy model also explains why roadmap risk is inseparable from dependency risk: the super-app bundle relies on banks, card schemes, insurers, asset managers, lending partners, merchants, regulators, and device channels all continuing to work in sync.


    The main product-tech diligence risk is therefore not that PalmPay lacks features. It is that the company still discloses less than a technical buyer or public investor would ideally want about how those features are powered. Device-financing metrics conflict across official pages, cross-border and credit internals remain lightly documented, and architecture specifics are still thin relative to enterprise PSP norms. PalmPay clearly has a real and extensive product stack; the open question is how durable and exportable that stack is once partner, regulator, or funding assumptions change.'
