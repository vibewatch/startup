- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Signal
  - What PalmPay claims or shows
  - Why it matters
  - Independent support
  - Gap
  rows:
  - - PCI DSS / encryption
    - Official pages cite PCI DSS and advanced encryption
    - Shows baseline payments-security posture
    - Press page and home page repeat the claim
    - No public audit summary retained
  - - Biometric / facial verification
    - Official pages cite extra authentication layers
    - Reduces account takeover risk
    - Nairametrics aligns on biometrics and phone binding
    - No false-positive or failure metrics
  - - AI fraud detection
    - Official pages cite AI-powered monitoring
    - Critical in high-fraud payment environment
    - Nairametrics describes anomaly detection
    - No fraud-loss ratio or alert precision
  - - Complaint and regulator channels
    - Complaints page lists app, phone, email, court orders, regulator requests
    - Shows formal escalation routes
    - Directly observable official workflow
    - Response-time SLA not public
  - - Success-rate claims
    - Official site says 99.95%; external quote says 99.5%
    - Reliability is core product promise
    - Two public claims point same direction
    - Methodology and time window unclear
  - - Regulatory badges
    - CBN/NDIC/NDPC/FCCPC references visible on official pages
    - Supports trust and compliance signaling
    - Observable on official pages
    - Exact scope by entity and market not fully explained
  notes: This table captures signal quality, not proof that the controls perform exactly as marketed under all conditions.
