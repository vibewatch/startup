    - Official pages + Nairametrics fraud article
    - Internal risk teams and regulator coordination
    - Account harm or reputational damage
  - - Distribution hardware channel
    - Device financing and Transsion-enabled onboarding
    - Official pages + TechCrunch + Transsion
    - OEMs, financing operations, repayment controls
    - CAC rises if hardware channel weakens
