      - number: '2.3'
        title: Buyer, User, Payer, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              PalmPay’s market is multi-sided. The first buyer-user cluster is the mass-market consumer using PalmPay
              for transfers, bill pay, airtime, savings, and increasingly cards; in that segment, the user and economic
              decision-maker are usually the same person, and the adoption trigger is reliability, price, and
              convenience versus a bank app or cash. The second cluster is the merchant or mobile-money agent that needs
              deposit, withdrawal, transfer, and acceptance workflows close to the customer. In that segment, trust and
              liquidity matter more than flashy product breadth. A third cluster sits around embedded or partner
              checkout, where merchants care about simple pay-by-bank settlement and lower friction at the point of
              payment. NIBSS’s QR architecture and PalmPay’s Jumia integration show how these rails broaden from pure
              P2P usage into merchant and commerce workflows. Budget ownership in PalmPay’s core segments therefore
              skews toward individual consumers, small merchants, and field agents rather than procurement-led
              enterprise buyers. Adoption also remains channel-diverse: smartphone-led for some, app-plus-agent-assisted
              for many, and still constrained in regions where inclusion, power, or connectivity remain weaker.
            claimRefs:
              - CM004
