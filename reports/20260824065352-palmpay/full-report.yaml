      - number: '8.2'
        title: Comparable set and valuation discipline
        blocks:
          - type: paragraph
            body: >-
              PalmPay should be triangulated against both African private fintech rounds and larger disclosed public
              comps. The African private set shows what investors have been willing to pay for scaled payments platforms
              with regional ambition: OPay at $2 billion in 2021, Flutterwave above $3 billion in 2022, Moniepoint at
              $1B+ in 2024, and Wave at $1.7 billion in 2021. That makes a $1B+ PalmPay valuation directionally
              believable. In fact, PalmPay at just above $1 billion fits reasonably well between the strongest recent
              Nigerian comp and the top-tier African fintech peaks.


              The public-comp set serves a different purpose. Nu, Paytm, PayPal, MercadoLibre, and Adyen are not direct
              pricing formulas for PalmPay because they are bigger, more diversified, and publicly disclosed. But they
              do impose discipline. They remind investors that public capital rewards scale and proof, not just
              storytelling. The most important lesson from the public set is not the exact market-cap level. It is the
              disclosure contrast. Nu, MercadoLibre, and PayPal can be examined through SEC and investor-reporting
              infrastructure; PalmPay still cannot. That means public-comparable transfer should stay conservative until
              PalmPay supplies comparable transparency.
