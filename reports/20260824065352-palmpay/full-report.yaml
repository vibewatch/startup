  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and inclusion story
        blocks:
          - type: paragraph
            body: >-
              PalmPay’s customer base should not be treated as one homogeneous consumer-wallet cohort. The retained
              evidence supports at least four major customer groups: everyday consumers who want fast transfers and
              bills; agent and merchant users who provide cash access and assisted service; merchants or checkout
              partners using pay-from-account and business-payment features; and first-time finance users whose entry
              point is either the app itself or smartphone financing. This segmentation matters because PalmPay’s public
              growth story is not only about digital-native urban users. It is explicitly about bringing new users into
              formal finance through a lower-friction, cheaper, and more physically accessible interface than legacy
              banks usually provide.


              That inclusion angle is not vague branding. TechCrunch reported that 25% of PalmPay users say it was their
              first-ever financial account and that the figure rises to 60% among borrowers. Official impact copy
              reinforces the same idea with first-time loan-recipient and smartphone-financing claims. The strongest
              reading is that PalmPay is acquiring both mainstream payment users and category creators — people for whom
              the app is a first formal financial relationship, not just a cheaper substitute for an existing bank app.
