  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: compact
    summary: >-
      IC-style scoring of PalmPay’s valuation setup as of 2026-08-24, emphasizing the tension between real operating
      proof and still-insufficient pricing disclosure.
    data:
      items:
        - label: Scale / category position
          score: 8
          detail: PalmPay looks like a real scaled African consumer-fintech platform.
        - label: Monetization proof
          score: 5
          detail: Profitability is reported, but audited take-rate quality is still missing.
        - label: Disclosure quality
          score: 2
          detail: No issuer-level prospectus or audited public financial package.
        - label: Private-comp support
          score: 7
          detail: African private-fintech comps support unicorn-plus plausibility.
        - label: Public-comp discipline
          score: 5
          detail: Public comps support ambition but also show how much disclosure is missing.
        - label: Regulatory resilience
          score: 4
          detail: Nigeria concentration and control sensitivity still matter materially.
        - label: Margin of safety above $1.5B
          score: 3
          detail: Thin without a disclosure step-up.
        - label: Overall composite
          value: 4.9
          score: null
          detail: Track / research-more until price and proof align better.
    approximationNotes: >-
      Scores are analyst judgments on a 1-10 scale synthesising the chapter’s evidence rather than reported company
      metrics.
    claimRefs:
      - CV017
      - CV023
      - CV024
      - CV035
      - CV036
      - CV038
      - CV041
      - CV047
