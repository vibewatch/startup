  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product suite and user jobs
        blocks:
          - type: paragraph
            body: >-
              PalmPay’s public surface now looks much broader than the simple wallet it launched with in 2019. The
              official consumer pages emphasize free transfers, savings, debit cards, credit, rewards, bill payments,
              and one-app convenience, while the company pages describe a full-stack digital bank for emerging markets.
              The official about page extends that further by adding business tools, enterprise B2B payments, device
              financing, and cross-market expansion. In practical terms, PalmPay is no longer positioning itself as a
              point-solution for peer-to-peer transfers; it is positioning itself as the primary financial operating
              layer for consumers, agents, merchants, and selected business clients.


              The public evidence also shows PalmPay designing for different entry points in different markets. In
              Nigeria the anchor job is everyday money movement. In Tanzania and Bangladesh the stated entry wedge is
              smartphone financing with the PalmPay app pre-installed, which turns hardware distribution into product
              onboarding. That is strategically important because it suggests PalmPay’s product stack is built to travel
              through multiple channels: app-led consumer use, agent-assisted use, merchant acceptance, and hardware-led
              first access. The result is a wider product footprint than most pure consumer wallets disclose publicly.
