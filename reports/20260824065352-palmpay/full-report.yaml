  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      Decision flow linking PalmPay’s scale, reported unicorn financing, disclosure gap, risk profile, and final
      recommendation.
    data:
      nodes:
        - id: n1
          label: Real operating scale exists
          detail: Users, transactions, and merchant reach support strategic relevance.
        - id: n2
          label: Reported unicorn financing support exists
          detail: 2026 reporting points to >$1B valuation around a $200M raise.
        - id: n3
          label: Disclosure gap remains large
          detail: No issuer-level audited prospectus-style package is public.
        - id: n4
          label: Nigeria / trust / regulatory risk persists
          detail: Concentration and control quality still shape discount rate.
        - id: n5
          label: Premium above unicorn line needs proof
          detail: Higher pricing requires audited profitability and monetization.
        - id: n6
          label: 'Recommendation: research-more / track'
          detail: Fair near the reported floor; stretched far above it.
        - id: n7
          label: Upgrade trigger
          detail: Audited numbers plus cleaner risk and cap-table disclosure.
      edges:
        - from: n1
          to: n6
          label: supports interest
        - from: n2
          to: n6
          label: sets anchor
        - from: n3
          to: n6
          label: blocks buy call
        - from: n4
          to: n6
          label: raises risk
        - from: n5
          to: n6
          label: limits premium
        - from: n6
          to: n7
          label: conditions to upgrade
