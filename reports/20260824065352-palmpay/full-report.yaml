      - number: '8.4'
        title: Recommendation and final diligence conditions
        blocks:
          - type: paragraph
            body: >-
              The clean recommendation is research-more / track with medium confidence, high risk, and a
              fair-to-stretched valuation stance. PalmPay is too real operationally to dismiss. A likely unicorn outcome
              is consistent with its user scale, payments habit, profitability narrative, and strategic backers. But the
              public evidence is not yet strong enough to justify paying a large premium above the unicorn threshold in
              advance of audited disclosure. Too many important valuation determinants remain unresolved:
              geography-level revenue mix, take-rate durability, cap-table economics, fraud and freeze metrics, and
              regulator correspondence.


              That is why the final diligence pack should be unusually concrete. Investors should ask for audited FY2025
              and FY2026 financials, revenue-to-TPV bridges, market-by-market user and profit mix, complaint and freeze
              dashboards, fraud-loss and appeal data, and a fully diluted cap-table plus preference stack. If PalmPay
              can supply that package and the numbers validate the current story, the case can move from track to buy.
              If it cannot, the right interpretation is not that PalmPay lacks value. It is that the price is trying to
              outrun the evidence.
