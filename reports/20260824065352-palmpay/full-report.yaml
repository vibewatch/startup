      - number: '7.4'
        title: Governance and disclosure quality lag the scale narrative
        blocks:
          - type: paragraph
            body: >-
              PalmPay’s public operating story is better than its public governance package. The company has strong
              growth and inclusion signals, an official regulatory footprint, and reported profitability. But the public
              record still does not provide enough clean detail on group structure, product-line economics, regulator
              correspondence, or operational quality metrics to underwrite downside with confidence. Public metrics
              drift across sources; profitability is media-mediated rather than fully audited; and the legal entity
              boundaries around lending or other regulated activities are still only partly visible through public
              pages.


              That gap is why the diligence ask list matters so much. Investors should request regulator exam or
              correspondence history, freeze and appeal data, complaint-resolution SLAs, fraud-loss and false-positive
              rates, and market-by-market revenue or user splits. Without that pack, the right interpretation is not
              that PalmPay is broken. It is that PalmPay is a control-sensitive platform whose risk quality remains only
              partially observable from the outside.
