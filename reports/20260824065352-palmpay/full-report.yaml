            body: >-
              PalmPay’s moat is inseparable from its dependencies. The Transsion relationship and handset footprint are
              a strategic advantage, but they also mean part of PalmPay’s customer-acquisition engine sits outside a
              purely proprietary banking or payments stack. Likewise, PalmPay depends on national identity systems,
              regulators, payment rails, telecom reliability, and broader infrastructure resilience. CBN’s PSV 2025
              makes clear that safety, resilience, contactless capability, and open-banking readiness are system
              priorities. PalmPay therefore operates in an environment where the burden of being large is rising.


              Geographic concentration amplifies all of this. The strongest customer, transaction, and operational
              evidence remains Nigeria-centric even though PalmPay talks about a broader Africa-and-Asia narrative. That
              concentration is not merely a macro footnote. It means regulatory, trust, fraud, and competitive shocks
              are more correlated. The 2026 national-license shift also suggests competition will intensify because
              PalmPay and peers are being normalized into broader formal reach. For risk underwriting, Nigeria
              concentration is the amplifier that makes otherwise manageable issues potentially reprice the whole
              thesis.
            claimRefs:
