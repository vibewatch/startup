      - number: '8.3'
        title: Scenario range, entry discipline, and what breaks the case
        blocks:
          - type: paragraph
            body: >-
              Because the disclosure set is incomplete, scenario analysis is more useful than a single-number fair value
              claim. The base case should stay close to the unicorn threshold implied by the 2026 newsflow: roughly
              $0.95B-$1.25B. That range assumes the profitability story is broadly real, scale metrics are directionally
              correct, and PalmPay continues to deepen its Nigerian franchise without a fresh regulatory or trust shock.
              The bull case can move higher — perhaps $1.25B-$1.7B — but only if audited earnings quality, take-rate
              durability, and multi-market execution all prove stronger than the current public record can demonstrate.
              The bear case naturally sits below the unicorn line if fundraising slips or disclosure quality
              disappoints.


              This is why entry discipline matters more than the headline label. Investors are not deciding whether
              PalmPay is an interesting company; it obviously is. They are deciding whether the current price
              conversation already embeds too much faith in future disclosure. If PalmPay prices near the unicorn floor,
              the case is easier to support. If it tries to price far above that without audited financials and a clean
              risk pack, the margin of safety narrows quickly.
