  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold or event
      - Transmission to thesis
      - Action implication
    rows:
      - - Audited monetization disappoints
        - Financial statements show weaker take rates, lower margins, or less durable profitability than implied
        - Base and bull cases compress immediately because the quality premium disappears
        - Move to avoid or require a reprice toward the bear range.
      - - Raise or IPO slips materially
        - Financing momentum fades or a public process is deferred without a strong explanation
        - Signals demand or disclosure readiness may be weaker than headlines implied
        - Delay investment pending clarity and new anchor.
      - - Fresh regulatory or compliance action
        - New onboarding restrictions, material enforcement, or significant remediation burden
        - Raises discount rate and weakens growth durability assumptions
        - Treat as thesis break unless offset by stronger audited proof.
      - - Trust deterioration becomes visible
        - Complaint, freeze, or fraud narratives worsen materially
        - Hurts retention assumptions and increases support or compliance cost expectations
        - Reduce fair range and wait for operating proof.
      - - Opaque cap table or preferences emerge
        - Late diligence reveals ratchets, stack complexity, or poor IPO conversion economics
        - Headline valuation no longer maps to effective economics for new investors
        - Re-underwrite on fully diluted and net-economics terms before investing.
    notes: >-
      Triggers are framed as monitorable events that would change the valuation case rather than as generic operating
      risks.
    claimRefs:
      - CV029
      - CV040
      - CV041
      - CV042
      - CV043
      - CV045
      - CV047
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Diligence path
    rows:
      - - Audited financials
        - FY2025 and FY2026 audited revenue, gross margin, EBIT/EBITDA, and cash-flow statements
        - Core prerequisite for direct multiple work and earnings-quality underwriting
        - Obtain auditor package, board-approved accounts, or draft prospectus materials.
      - - Revenue-quality bridge
        - TPV-to-revenue, take-rate, product-mix, and cohort monetization bridge
        - Separates free-feeling payment habit from monetized economics
        - Request banker deck plus monthly cohort monetization tables.
      - - Geography mix
        - Country-level users, TPV, revenue, and profit contribution
        - Determines how much Nigeria concentration should discount valuation
        - Request management operating review by market.
      - - Risk and control pack
        - Fraud-loss data, freeze rates, appeal outcomes, complaint aging, and regulator correspondence
        - Directly affects discount rate, retention assumptions, and trust durability
        - Review board risk pack and outside-counsel summaries.
      - - Cap table and preferences
        - Ownership, preference stack, anti-dilution terms, and IPO conversion mechanics
        - Headline valuation can diverge materially from effective entry economics
        - Review dataroom cap table and counsel memo on financing terms.
      - - Governance and listing readiness
        - Board composition, committees, internal controls, and IPO workplan
        - Explains whether public-market disclosure can arrive without surprises
        - Require governance memo and listing-readiness assessment.
    notes: >-
      These are the minimum diligence conditions for moving from “interesting likely unicorn” to “buyable at a premium
      price.”
    claimRefs:
      - CV027
      - CV039
