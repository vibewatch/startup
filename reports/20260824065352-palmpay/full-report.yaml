  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation anchors and what the unicorn claim actually means
        blocks:
          - type: paragraph
            body: >-
              PalmPay’s valuation narrative is no longer speculative in the abstract. By mid-2025, TechCrunch was
              already reporting profitability and a potential $100 million raise. By August 2026, several additional
              outlets were reporting a larger financing discussion: roughly $200 million at a valuation above $1
              billion, tied to possible Hong Kong IPO ambitions. That is enough to say PalmPay belongs in the unicorn
              conversation. It is not enough to say the price is fully underwritten. The strongest current anchor is
              still a reported private-market discussion, not a public prospectus, a priced listed market, or an
              issuer-level audited filing.


              That distinction matters. A company can deserve a unicorn label and still be hard to price precisely.
              PalmPay’s official pages and independent operating coverage support a real scaled business — tens of
              millions of users, high transaction frequency, merchant reach, and a credible inclusion story.
              Profitability reporting adds more support. But public disclosure is still too light to convert that
              narrative into a crisp intrinsic valuation model. The right reading is therefore: the unicorn threshold
              looks plausible, the precision beyond that threshold remains weak.
            claimRefs:
              - CV001
              - CV002
