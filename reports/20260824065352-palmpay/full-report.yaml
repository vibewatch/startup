      - number: '2.2'
        title: Sizing Lenses and Adoption Scale
        blocks:
          - type: paragraph
            body: >-
              Public market-sizing data for PalmPay’s addressable market is abundant but non-uniform. The CBN’s
              e-payment statistics measure raw system throughput: H1 2024 alone showed 22.42 billion total e-payment
              transactions worth about ₦1.56 quadrillion, with mobile money operators at 7.18 billion transactions and
              ₦78.2 trillion of value, and POS at 6.40 billion transactions and ₦85.9 trillion of value. Those are not
              revenue figures, but they establish that PalmPay operates in a market where user activity is already
              massive. TechCabal’s 2025 mobile-money analysis pushed the lens further forward, citing ₦20.71 trillion in
              MMO transaction value in Q1 2025 and arguing that PalmPay and OPay dominate the non-telecom-led MMO
              category. Inclusion and device data add the adoption frame: EFInA’s 2023 survey put formal inclusion at
              64% and overall inclusion at 74%, yet still showed high rural and northern exclusion, while mobile-phone
              penetration was high but smartphone usage remained materially lower. The right conclusion is not one
              heroic TAM number but a layered view: a huge payments-flow market, a still-open inclusion gap, and a large
              serviceable segment for any provider that can combine low-cost transfers, agents, interoperability, and
              trust.
