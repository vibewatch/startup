  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and compliance transmission is the hardest downside path
        blocks:
          - type: paragraph
            body: >-
              PalmPay’s key risk is not that fintech is generally risky; it is that PalmPay operates at system-relevant
              scale inside a Nigerian payments regime that is getting stricter exactly as PalmPay broadens its product
              scope. The 2026 public record is notable: Techpoint characterized 2026 as an enforcement year, while
              Legit.ng reported new CBN rules around ring-fencing, ownership disclosure, market concentration, and AML.
              Those changes matter more for PalmPay than for a small wallet because PalmPay already claims tens of
              millions of users, daily transaction scale, and a multi-product stack spanning payments, savings, cards,
              merchant services, and credit-adjacent products.


              The public evidence also shows that regulatory risk can hit growth directly. TechCabal’s 2024 reporting
              documented a CBN-driven onboarding freeze affecting PalmPay and peers, followed by a restart only after
              tighter KYC and anti-crypto controls. That sequence is the cleanest proof that PalmPay’s growth engine can
              be throttled without a dramatic licence cancellation. PalmPay’s own complaints page makes the legal
              perimeter visible: general complaints, court orders, and regulator or law-enforcement requests are all
              explicit channels. That is reassuring in one sense, but it also proves that legal and regulatory
              intervention is an everyday operating reality, not a theoretical tail event.
