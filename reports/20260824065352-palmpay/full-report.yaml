  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              PalmPay should be analyzed inside Nigeria’s regulated digital-payments stack rather than as a generic
              “African fintech” label. The CBN’s provider roster places PalmPay Limited in the mobile money operator
              category, while PalmPay’s own app descriptions show a bundle that spans bank transfers, bills, cards,
              airtime, savings, insurance, and agent-assisted access. That means PalmPay’s real market boundary includes
              consumer wallet behavior, merchant acceptance, cash-in and cash-out, card issuance and usage, and the
              account-based rails that connect banks, mobile money operators, and switching infrastructure. NIBSS’s QR
              framework sharpens that view: merchants, consumers, wallet apps, banks, and payment processors all
              interact through interoperable account-based flows rather than through one closed wallet loop. The main
              substitutes are still cash, branch-assisted banking, standard bank-app transfers, bank-issued cards, and
              agent POS services run by banks or rival fintechs. PalmPay’s role is therefore best understood as daily
              retail finance infrastructure for mass-market Nigerians, not simply as a lending app or a generic
              neo-bank.
            claimRefs:
              - CM001
              - CM002
              - CM003
