- id: TI004
  title: Capital adequacy table
  columns:
  - Capital or cost vector
  - Current signal
  - Public status
  - Risk to cash generation
  - Diligence ask
  rows:
  - - Disclosed historical equity
    - ~$140M before new round
    - Observed from seed + Series A history
    - Low immediate solvency concern, but stale as balance-sheet proxy
    - Get current cap table and cash balance
  - - 2025-2026 new financing
    - Raise / IPO discussions ongoing
    - Observed in TechCrunch and Launch Base Africa
    - Could be growth capital, mixed debt/equity, or pre-IPO positioning
    - Clarify use of proceeds and any debt terms
  - - Agent and merchant network
    - 1M+ nodes implied
    - Observed but not financially broken out
    - Commission and support burden may be large
    - Disclose channel CAC and servicing cost
  - - Cards rollout
    - 5M cards planned
    - Observed growth signal
    - Inventory, issuance, and fraud costs may rise ahead of revenue
    - Disclose card unit economics
  - - Wealth balances
    - Large implied from payout and actives
    - Indirect only
    - Treasury and safeguarding quality matter
    - Disclose AUM, partner structure, and reserve treatment
  - - Credit / insurance partnerships
    - Products present but economics opaque
    - Indirect only
    - Hidden balance-sheet or revenue-share exposures possible
    - Clarify principal versus agency role
  notes: Capital adequacy is not a solvency alarm; it is a disclosure problem. Public sources do not show enough to judge reserves, debt, or burn precisely.
