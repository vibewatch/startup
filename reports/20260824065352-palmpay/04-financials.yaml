chapter:
  number: 4
  title: Financials
  summary: PalmPay’s public financial picture is directionally strong but not audit-grade. The retained record supports roughly $140 million of disclosed historical funding, reported profitability by 2025, revenue around $64 million in 2023 and reportedly above $128 million in 2024, plus very high consumer and wealth engagement. But merchant pricing, blended take rate, capital adequacy, fraud-loss burden, and partner revenue shares remain materially opaque. The correct underwriting posture is constructive on scale and monetization optionality, cautious on disclosure quality.
sections:
- id: revenue-model-and-scale
  title: Revenue model and transaction scale
  body: 'PalmPay’s public evidence is stronger on economic shape than on audited financial statements. The company built its consumer brand around zero-fee transfers, low-friction onboarding, and a large offline network, but the monetization story extends beyond that visible free layer. TechCrunch’s 2025 reporting described revenue of about $64 million in 2023, said revenue had more than doubled since, and highlighted new business-oriented and cross-border payment products. Launch Base Africa went further, reporting revenue above $128 million in 2024, 2025 profitability, and a 2026 round targeting about $200 million. Whether every number in that secondary trail is perfectly reconciled or not, the common message is clear: PalmPay is no longer just a promotional wallet; it is a scaled payments network with several monetization attachments.


    The challenge is that those attachments are easier to name than to quantify. Public evidence supports business payments, cards, wealth products, and partner-led insurance or credit economics, but PalmPay does not publish a merchant price card comparable to PSP peers. That leaves investors with a business that is obviously large yet still difficult to convert into a clean blended take-rate model. The right framing is therefore a low visible-fee consumer surface layered over narrower monetized merchant, card, partner, and business-payment rails.'
