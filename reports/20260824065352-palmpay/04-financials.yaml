    - Partner-led revenue may be higher quality than direct lending risk
  - - Agent and merchant services
    - Commissions and service economics around assisted payments
    - 1M+ agents and merchants with 13M monthly served customers
    - Medium
    - Net revenue after commissions and support
    - Offline distribution is both asset and cost center
