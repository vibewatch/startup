- id: cost-structure-and-capital-intensity
  title: Cost structure, fraud, and capital intensity
  body: 'PalmPay should not be modeled like a pure software PSP with trivial field cost. The company’s structure is visibly operating-expense heavy: a 1 million-plus agent and merchant network must be recruited, supported, and supervised; user issues need resolution across digital and physical channels; fraud and account-security controls require active spend; and card issuance plus local office expansion create fulfillment and service overhead that software-only businesses do not face. Nairametrics’ 2025 scale report and fraud deep dive both support that view, while the CBN mobile-money framework explains why KYC, safeguarding, AML controls, and dispute handling are not optional overheads.


    This matters because PalmPay’s strongest moat drivers — dense distribution, assisted trust, fast transfers, and broad consumer reach — are also cost centers. Even if unit economics are positive, public sources do not reveal how much of gross revenue is absorbed by commissions, reversals, support, partner payouts, or compliance. The consequence is a financially appealing but partially hidden engine: PalmPay looks more scalable than a branch bank, but much more operationally burdened than a light consumer app.'
