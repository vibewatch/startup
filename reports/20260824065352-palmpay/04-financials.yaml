    - TechCrunch says hundreds of millions monthly via API
    - Medium
    - Net take rate and margin by corridor
    - Business rails may be more monetizable than consumer rails
  - - Cards (AfriGO / Verve / debit)
    - Card issuance, spend, and balance retention
    - 5M card target and local card rollouts
    - High
