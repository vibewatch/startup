- id: unit-economics-and-product-mix
  title: Unit economics and product-mix logic
  body: 'PalmPay’s public operating statistics are impressive enough to imply real scale but not precise unit economics. Nairametrics reported 15 million daily transactions in Q1 2025, 35 million users, about 50 transactions per user per month, and roughly 80% retention. The same report added 9 million monthly active wealth users and ₦4 billion of interest paid out, which is important because it suggests PalmPay’s financial engine cannot rest solely on transfer or bill-pay flows. A product with that many active wealth users and a large interest payout is also managing meaningful balances, even if public disclosures do not explain exactly how spread, commissions, or partner economics are shared.


    Cards reinforce the same point. AfriGO and Verve partnerships expand the opportunity to retain deposits, capture interchange-like economics, and attach PalmPay more tightly to daily spend. Yet the absence of public merchant pricing still matters. If PalmPay’s revenue was just over $128 million in 2024 while annual payment flow was already in the tens of billions, monetization must be a tiny slice of gross payment value. That is not a flaw by itself, but it means the company likely depends on a careful blend of attach products and support efficiency rather than on simple headline fee extraction.'
