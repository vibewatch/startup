- id: retention-repeat-usage-and-support
  title: Retention, repeat usage, and support quality
  body: 'PalmPay’s retention engine appears to be utility plus trust rather than novelty. The strongest retained signals are everyday frequency, broad use-case coverage, easy support access, and the product’s perceived advantage against cash or unreliable bank channels. Official surfaces and APKMirror descriptions repeatedly push free transfers, zero maintenance fees, 24/7 support, and flexible savings or credit as reasons to keep the app central. Nairametrics’ 80% retention claim and high monthly transaction frequency support that narrative, though they do not replace audited cohort analysis.


    The FOLIO benchmark adds a more independent behavioral angle. PalmPay ranked second overall and led the category on clarity, while its personal trust response outperformed market expectations. That suggests the product experience is sticky for reasons beyond pure discounting. Still, retention quality is not fully cleared. PalmPay does not publish clean cohort data, support-response SLAs, or formal NPS / CSAT. Public evidence is enough to believe repeat usage is high; it is not enough to precisely model how resilient that usage is after service failures or regulatory shocks.'
