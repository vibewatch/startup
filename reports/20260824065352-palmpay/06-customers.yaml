tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Main jobs-to-be-done
  - Scale / proof
  - Why they stay / main risk
  rows:
  - - Everyday consumers
    - Same individual is buyer, user, and payer
    - Transfers, bills, savings, debit card, basic credit
    - 40M users claimed; 35M in independent reporting
    - Stay for utility and free-feeling transfers; risk is trust shock
  - - First-time formal-finance users
    - New end user
    - Open first account, save, borrow, get access to digital finance
    - 25% first-account claim; 57% first-time borrowers claimed
    - Stay if onboarding remains simple; risk is education and support burden
  - - Merchants / business users
    - Merchant owner or operator
    - Receive payments, checkout, business account, payouts
    - 1M businesses claimed; Jumia + 100 partner signal
    - Stay for payment conversion; risk is thin public enterprise proof
  - - Agents / merchants as local outlets
    - Agent is buyer/operator, walk-in user is payer
    - Cash access, assisted onboarding, local trust bridge
    - 1M+ agents and merchants; 13M customers served monthly
    - Stay for local economics; risk is compliance or commission pressure
  - - Borrowers / insurance users
    - Individual end user
    - Instant credit, protection, liquidity smoothing
    - Partner-led product surface plus first-time borrower claims
    - Stay for convenience; risk is adverse collection experience
  - - Device-financing users
    - First-time smartphone buyer
    - Get phone plus app access
    - Smartphone financing highlighted in official pages
    - Stay if financing works; risk is repayment stress
  notes: Public evidence is strongest on Nigeria consumer, merchant, and agent segments; international segments remain earlier-stage.
