- id: adverse-evidence-and-concentration
  title: Adverse evidence, concentration, and unresolved risk
  body: 'The adverse record matters because customer trust is a central asset in Nigerian payments. TechCabal’s 2023 debt-collection investigation documented allegations of harassment, privacy breaches, and reputational damage around PalmPay-linked lending practices. PalmPay denied those behaviors were company policy, but the story still shows how quickly a credit-adjacent product can contaminate the broader brand. The 2024 onboarding freeze adds a different kind of customer risk: even if existing users were not directly shut out, new-user acquisition stopped for weeks, which is a reminder that customer growth depends on regulatory trust as much as on downloads or cashback.


    Geographic concentration is the other important caveat. PalmPay talks about multiple markets, but the strongest customer and transaction evidence remains Nigeria-centric. That is not fatal — Nigeria is large enough to matter enormously — but it does mean the customer story is less diversified than the top-line app narrative may suggest. The prudent customer judgment is therefore positive on reach and utility, but still cautious on adverse-loan exposure, regulatory interruption risk, and country concentration.'
