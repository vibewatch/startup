    - Jumia is helpful but not enough alone
    - Hard to judge merchant concentration or retention
    - Medium
    - Provide top merchant / partner case studies
  - - Support-quality opacity
    - Complaints channels visible but SLA absent
    - Resolution delays can increase churn quickly
    - Medium
    - Provide response-time and resolution metrics
  notes: The biggest open questions are not whether PalmPay has customers, but how concentrated, durable, and supportable those customers are under stress.
