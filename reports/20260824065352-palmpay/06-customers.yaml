- id: growth-proof-and-named-evidence
  title: Growth proof and named customer evidence
  body: 'Public proof of PalmPay’s customer scale is abundant, though not perfectly standardized. Official pages claim 40 million users and 1 million businesses, while independent 2025 reporting commonly used 35 million users, over 1 million agents and merchants, and 15 million daily transactions. Nairametrics added 13 million customers served monthly, 50 transactions per user per month, and about 80% retention. Those figures are not interchangeable, but together they describe a platform with real mass-market activity rather than an over-marketed app with shallow usage.


    Named proof is thinner, but it exists. PalmPay’s official home page includes a specific user story from Damilola in Ekiti State. TechCabal’s Jumia coverage provides a concrete merchant-side customer proof by showing PalmPay as a payment option on a major ecommerce platform. The company also says more than 100 partners already use its online payment solution. The right conclusion is that PalmPay has strong scale proof, some real customer-origin proof, and still-limited public named-enterprise disclosure relative to that scale.'
