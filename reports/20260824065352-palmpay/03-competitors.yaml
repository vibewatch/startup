- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Provider
  - Public pricing signal
  - Packaging model
  - What is clearly included
  - Unknown or opaque area
  - Implication
  rows:
  - - PalmPay
    - Free transfers emphasized in market reporting and app positioning
    - Consumer wallet bundle
    - Transfers, bills, airtime, cards, savings, insurance adjacencies
    - Merchant pricing, take rate, and unit economics are not clearly published
    - Great for adoption; hard to benchmark monetization
  - - OPay
    - Free-feeling transfer positioning and no-maintenance card messaging
    - Consumer wallet bundle
    - Transfers, cards, savings, support, bill pay
    - Exact merchant economics are thin publicly
    - Consumer acquisition remains easy to understand; revenue capture does not
  - - Moniepoint
    - Business value is clearer than public line-item pricing
    - Merchant and business-banking bundle
    - POS, accounts, bookkeeping, loans, card acquiring
    - Standardized public merchant price card is limited in retained evidence
    - Can win merchants on workflow depth even without maximal public pricing clarity
  - - Flutterwave
    - 2% local collections in Nigeria (1.4% fee + 0.6% platform fee)
    - Merchant/enterprise PSP
    - Checkout, payouts, POS, integrations, cross-border services
    - Custom discounting and enterprise terms vary
    - Transparent pricing helps formal online merchants compare quickly
  - - Paystack
    - Detailed local, international, transfer, VA, and terminal pricing
    - Developer and merchant PSP
    - Checkout, transfers, virtual accounts, terminals, T+1 settlement
    - Large-volume discounts are negotiated
    - Pricing clarity is itself a sales advantage
  - - Wave
    - Free deposits/withdrawals/bills and 1% sends
    - Low-fee wallet / agent model
    - Cash handling, transfers, bill pay, support
    - Nigeria product availability is not the issue because it is a benchmark, not the main local peer
    - Shows how hard fees can be pushed down in mobile money
  - - 'Status quo: cash + bank transfer'
    - Cash has no app sticker price; bank transfer costs vary by bank
    - Existing relationship / behavior
    - No onboarding into a new fintech required
    - Reliability and time cost are often hidden rather than absent
    - Fintechs win by making convenience visible, not just by undercutting listed fees
  notes: Public pricing varies sharply by business model. Wallet leaders are clearer on user benefit than on merchant economics, while PSPs disclose far more explicit commercial terms.
