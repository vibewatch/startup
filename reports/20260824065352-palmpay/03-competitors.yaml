company:
  name: PalmPay
chapter:
  number: 3
  title: Competitors
  summary: 'PalmPay is one of Nigeria’s strongest consumer-wallet and agent-distribution franchises, but the competitive map fragments by job. OPay is the closest mass-market wallet rival, Moniepoint is stronger in merchant and SME operating workflows, Flutterwave and Paystack are stronger where online merchants need documented pricing and APIs, and Wave remains the clearest low-fee mobile-money benchmark. PalmPay’s moat is therefore real but specific: strongest in handset-assisted acquisition, everyday transfer habit, and offline support, weaker in public merchant pricing, SME software depth, and enterprise payment infrastructure.'
sections:
- id: landscape-by-job
  title: Landscape by Job to Be Done
  body: 'PalmPay’s competitive set only makes sense when separated by job to be done. For mass-market Nigerian consumers deciding where to send money, pay a bill, top up airtime, or withdraw through a nearby agent, PalmPay competes most directly with OPay and, to a lesser extent, other wallet-first mobile money apps. For merchants that need a business account, POS reliability, bookkeeping, staff controls, or working-capital access, Moniepoint becomes the more relevant benchmark. For online sellers or software-led merchants, Flutterwave and Paystack matter more because they publish checkout, API, settlement, and merchant-pricing detail that consumer-wallet rivals usually do not.


    The substitute set is broader than just fintech peers. Cash, bank apps, and bank-transfer rails remain the real status quo in many daily workflows, while NIBSS interoperability means users can move among providers without fully locking into one closed system. Telco-linked services remain part of the African mobile-money story, but the strongest recent Nigeria and West Africa evidence shows non-MNO players such as PalmPay and OPay capturing a large share of the current mobile-money narrative. The result is a fragmented field where PalmPay is strongest in consumer-wallet habit and assisted distribution, not in every payments workload.'
