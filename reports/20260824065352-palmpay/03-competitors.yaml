- id: moat-durability-and-entrant-risk
  title: Moat Durability, Entrant Risk, and Adverse Evidence
  body: 'PalmPay’s moat is real, but it is not universal. The strongest retained evidence supports a defensible position in handset-led acquisition, brand familiarity among mass-market users, and dense offline support through agents and merchants. The weakest areas are also clear: SME operating software and credit depth are more visible at Moniepoint, while documented enterprise PSP breadth and merchant economics are stronger at Flutterwave and Paystack. That means PalmPay’s best path is to keep deepening the everyday-wallet and agent workflow rather than trying to win every layer of African payments on the same terms.


    The harder risk is convergence. Moniepoint is already broadening from merchant acquiring into remittances, savings, cards, and business software. Flutterwave and Paystack are defending the formal merchant and API layer while adding more regulated structure. Even the trust picture remains unsettled: FOLIO’s ranking suggests PalmPay’s clarity and trust are improving, but wallets remain exposed to compliance shocks, fraud narratives, and price pressure. The prudent conclusion is that PalmPay has a strong consumer fintech moat in Nigeria, yet still faces credible encroachment from merchant-led, PSP-led, and low-fee substitute models.'
