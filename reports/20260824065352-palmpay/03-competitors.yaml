- id: pricing-switching-and-multi-homing
  title: Pricing, Switching Costs, and Multi-Homing
  body: 'Pricing transparency is one of the clearest dividing lines in the peer set. Flutterwave publishes a Nigeria collections price card, Paystack discloses transfer, virtual-account, online, and terminal pricing, and Wave openly markets free deposits and withdrawals plus a 1% send fee. By contrast, PalmPay, OPay, and Moniepoint all signal low-cost or free-feeling user value, but they do not publish the same level of merchant-pricing detail. For investors, that means user growth and payment scale cannot be translated cleanly into take-rate assumptions from public data alone.


    Switching costs also vary by user type. Consumers can easily multi-home: one more app download and an interoperable bank-transfer rail are usually enough. That makes PalmPay’s low-friction acquisition engine important, but it also means habit can shift if trust, fees, or reliability move against it. Merchant switching is harder when a provider also controls POS hardware, agent liquidity, bookkeeping, or credit. That favors Moniepoint on SME workflows and gives PalmPay a narrower but still meaningful moat in the everyday consumer-and-agent segment. The core underwriting point is that PalmPay’s user moat looks much stronger than its publicly visible pricing moat.'
