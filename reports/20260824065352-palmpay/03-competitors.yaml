- id: TP001
  title: Competitor profile table
  columns:
  - Competitor / class
  - Category
  - Scale / funding signal
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - PalmPay
    - Wallet / mobile money / agent ecosystem
    - 35M users; 15M daily transactions; 1M+ agents and merchants reported
    - Mass consumers, micro-merchants, first-finance-app users
    - Transsion distribution, free-transfer habit, strong clarity and broad consumer-finance bundle
    - Public merchant pricing and deep SME tooling remain less visible than some rivals
  - - OPay
    - Wallet / mobile money / agent ecosystem
    - $400M 2021 round at $2B valuation; mass-market Nigeria wallet brand
    - Consumers, cash-in/out users, agents
    - Fast transfer habit, cards, savings, strong public support messaging
    - Trust and compliance perception remain live issues; enterprise depth is thinner publicly
  - - Moniepoint
    - Merchant acquiring / business banking / agent banking
    - '>$200M Series C; 14B transactions and ₦412T in 2025 reported'
    - SMEs, merchants, agents
    - POS, business accounts, bookkeeping, credit, card acquiring
    - Less obviously built around pure consumer-wallet habit than PalmPay or OPay
  - - Flutterwave
    - Enterprise PSP / checkout / payouts
    - 2022 $3B valuation signal; broad product expansion
    - Online merchants, startups, cross-border businesses
    - APIs, checkout, payouts, POS, cross-border and regulated expansion
    - Offline consumer distribution is weaker than consumer-wallet rivals
  - - Paystack
    - Developer-first PSP / terminals / payments OS
    - 300K+ merchants and group profitability reported
    - SMEs, developers, ecommerce merchants
    - Transparent pricing, developer tooling, settlement clarity, terminal economics
    - Agent network and offline assisted distribution are thinner than wallet-led rivals
  - - Wave
    - Low-fee mobile money benchmark
    - 2021 $200M round at $1.7B valuation
    - West African wallet users and agents
    - Free deposits/withdrawals, free bill pay, 1% send fee
    - Not a current Nigeria-scale direct peer
  - - Telco-led wallets / self-service apps
    - Telco distribution substitute
    - Large telecom reach but thinner retained Nigeria-specific wallet detail in this source set
    - Mass-market mobile users
    - SIM and airtime relationship can reduce acquisition friction
    - West Africa growth evidence increasingly highlights non-MNO fintech winners instead
  - - 'Status quo: cash + bank transfer apps'
    - Substitute / internal build / incumbent rails
    - Entrenched daily behavior and interoperable bank rails
    - Nearly all consumers and merchants
    - No new app behavior required; existing bank relationship and cash familiarity
    - Reliability problems and branch-era friction create openings for fintechs
  notes: Rows separate direct wallet peers from merchant-led, PSP-led, telco-led, and status-quo substitutes. Scale signals mix company claims and reputable reporting rather than provider-level market share.
