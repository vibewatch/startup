- id: distribution-capability-and-channel-power
  title: Distribution, Capability, and Channel Power
  body: 'PalmPay’s best public edge is still distribution. Launch reporting tied the company to Transsion’s handset ecosystem, and later reporting described PalmPay at 35 million users, 15 million daily transactions, and more than 1 million agents and merchants. That combination matters because it blends on-device discovery with an offline trust bridge. OPay is the nearest mirror image: it also markets frictionless transfers, cards, savings, and rapid support, and it has been capitalized heavily enough to keep competing for everyday transaction habit at national scale.


    The field diverges more sharply once the buying criterion becomes merchant operations rather than simple retail payments. Moniepoint’s public footprint is deeper in POS, business accounts, bookkeeping, credit, and card acquiring. Flutterwave and Paystack diverge in a different direction, emphasizing checkout, developer tools, and formal merchant economics. Wave is not a current Nigeria-scale direct rival, but its public 1% send-fee model shows how low-fee mobile money can still be economically disruptive when distribution and trust line up. PalmPay’s public evidence therefore supports breadth in mass retail finance, but not equal strength across business software, lending, or enterprise PSP layers.'
