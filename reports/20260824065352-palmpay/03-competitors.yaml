- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat or risk theme
  - Threat / comparator
  - Severity
  - Why it matters
  - Mitigation or diligence ask
  rows:
  - - Transsion-driven distribution moat
    - OPay can still match transfer habit without PalmPay’s handset channel
    - Medium
    - PalmPay’s acquisition edge is structural, but not exclusive once brand habit forms
    - Quantify what share of new users still comes from device channels
  - - Agent and merchant density
    - Moniepoint can outcompete in merchant operations and agent economics
    - High
    - Merchant-side workflows create stickier switching costs than pure consumer wallets
    - Request PalmPay split between agents, merchants, and pure consumers
  - - Pricing opacity
    - Paystack and Flutterwave disclose economics more clearly
    - Medium
    - Better pricing transparency can win formal merchants even if PalmPay user growth stays strong
    - Obtain PalmPay merchant pricing, MDRs, and contribution margins
  - - Trust / compliance exposure
    - Wallet peers and regulators can trigger onboarding or KYC friction
    - High
    - Consumer habit is fragile if trust or account-access narratives turn negative
    - Review freeze history, fraud losses, and compliance staffing
  - - Convergence from PSPs and merchant banks
    - Flutterwave, Paystack, and Moniepoint are expanding outward
    - Medium-High
    - PalmPay may face more competition in checkout, cards, remittance, or business rails over time
    - Track adjacent launch velocity and partnership dependence
  - - Low-fee benchmark pressure
    - Wave-like economics show visible fees can be pushed down hard
    - Medium
    - PalmPay may have to defend adoption with low fees longer than investors expect
    - Stress-test margins under prolonged low-fee competition
  notes: Severity is analytical rather than company-reported. The register focuses on threats most likely to weaken PalmPay’s consumer-and-agent differentiation story.
