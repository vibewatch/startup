  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: founders-and-board
    missingEvidence: Named founders, current board composition, investor board rights, and governance committees.
    whyItMatters: A late-stage fintech seeking unicorn pricing should have clear founder and board visibility so investors can assess control, succession, and oversight.
    diligencePath: Request cap-table, board-deck, and governance documents directly from management.
    relatedQuestionRefs:
    - QO008
    - QO009
    relatedTableRefs:
    - TO002
  - type: conflicting-data
    severity: material
    topic: country-footprint
    missingEvidence: A reconciled, management-approved list of live markets by product line and legal entity.
    whyItMatters: Public country-footprint claims conflict across 2025-2026 sources, which affects TAM, regulatory complexity, and revenue-diversification analysis.
    diligencePath: Obtain an entity map and current market-operating matrix covering consumer, merchant, and credit products.
    relatedQuestionRefs:
    - QO022
    relatedTableRefs:
    - TO004
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: Audited 2024-2025 revenue, profit, balance-sheet, and cash-flow statements plus product-level take-rate data.
    whyItMatters: The valuation debate depends on whether PalmPay’s reported profitability and revenue growth are broad-based, repeatable, and cash-generative.
    diligencePath: Request audited financials, management accounts, and cohort economics for wallet, wealth, cards, and lending.
    relatedQuestionRefs:
    - QO012
    - QO013
    - QO014
    - QO017
  - type: missing-source
    severity: minor
    topic: headcount
    missingEvidence: Reliable employee headcount and organizational distribution by engineering, operations, support, and field sales.
    whyItMatters: Headcount is a basic operating-scale metric and helps evaluate cost structure, compliance staffing, and execution readiness for IPO-track governance.
    diligencePath: Request current HR snapshot or verified headcount from management or employee-benefit filings.
    relatedQuestionRefs:
    - QO018
  - type: private-evidence-only
    severity: material
    topic: 2026-round-terms
    missingEvidence: Closed round size, price, investor names, share class, liquidation preference, and IPO-preparation workstreams.
    whyItMatters: The current unicorn narrative is driven by reported discussions rather than closed terms, so valuation and dilution effects remain uncertain.
    diligencePath: Review signed financing documents or updated cap table once the round closes.
