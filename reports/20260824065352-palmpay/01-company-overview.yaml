company:
  name: PalmPay
chapter:
  number: 1
  title: Company Overview
  summary: PalmPay is a Nigeria-led mobile money and digital banking company that built early scale from Transsion-backed handset distribution, no-fee consumer payments, and a dense offline merchant network. Public evidence supports a 2019 Nigerian launch, $140 million raised before the current fundraising cycle, profitability by 2025, roughly 35 million users by 2025, and an active 2026 process that could value the company above $1 billion, but founder identity, current country footprint, headcount, and audited financial detail remain materially under-disclosed or inconsistent.
sections:
- id: identity-distribution-model
  title: Identity, Product Model, and Distribution Advantage
  body: 'PalmPay entered Nigeria in 2019 as a mass-market consumer wallet and payments app backed by Transsion-linked capital and distribution. The launch proposition was deliberately simple: peer-to-peer transfers, bill pay, airtime, rewards, and merchant acceptance, all delivered through an app designed for Nigeria’s price-sensitive, smartphone-first informal economy. The strongest public distribution fact is the Transsion relationship. TechCabal and TechCrunch both tied PalmPay’s launch to Transsion and its TECNO brand, and early coverage said the app would be pre-installed on tens of millions of Tecno, Infinix, and itel devices. That matters because Transsion remains Africa’s biggest smartphone seller, giving PalmPay a customer-acquisition path that many standalone fintechs do not have. PalmPay’s current app-store descriptions still present the service as a broad digital bank for Nigeria, spanning free bank transfers, ATM cards, airtime, data bundles, savings, insurance, and digital
    loans while also stressing NDIC-insured deposits and CBN-regulated mobile-money status. The result is not just a wallet, but a distribution-led financial super-app with both digital and agent-assisted usage patterns.'
  claimRefs:
