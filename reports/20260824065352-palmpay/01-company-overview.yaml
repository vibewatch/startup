- id: regulatory-and-trust-signals
  title: Regulatory Position and Trust-Stress Signals
  body: 'PalmPay’s regulatory posture is meaningful but not risk-free. The Central Bank of Nigeria’s payments-service-provider roster lists PalmPay Limited in the mobile money operator licence category, and PalmPay’s own app-store descriptions emphasize CBN regulation and NDIC insurance. That gives the company a real place inside Nigeria’s formal payments perimeter. Yet the public record also shows recurring trust stress. In April 2024 the CBN ordered PalmPay and several peers to halt new-customer onboarding amid KYC and crypto-related scrutiny; the restriction was lifted in June after additional compliance conditions were imposed. Separate customer-trust risk appears in PalmPay’s lending history: TechCabal documented widespread online complaints and meme culture around aggressive debt-collection tactics, including allegations of contact-list shaming and borrower harassment, even as PalmPay denied affiliation with the most abusive actors and said it was auditing Flexi-related processes.
    By 2025, PalmPay was publicly emphasizing fraud controls such as biometric authentication, anomaly detection, transaction screening, and selective account freezes. Those responses are directionally positive, but they also confirm that fraud management, consumer protection, and compliance discipline are central diligence topics rather than peripheral issues.'
