callouts:
- calloutType: strength
  title: Distribution moat is the core differentiator
  body: PalmPay’s Transsion relationship means the company is not just buying demand through discounts; it can also originate demand through handset placement, which is structurally different from many app-only African fintechs.
  claimRefs:
  - CO004
  - CO029
  - CO030
- calloutType: risk
  title: Governance disclosure still lags the valuation narrative
  body: PalmPay’s public traction is strong, but the reviewed public record still lacks a clean founder list, board map, audited financials, and a reconciled operating-footprint disclosure. Those gaps matter more now that a unicorn valuation is in play.
  claimRefs:
  - CO026
  - CO027
  - CO042
- calloutType: assumption
  title: Treat 2026 fundraising and IPO reporting as indicative, not closed fact
  body: Multiple 2025-2026 sources point to new capital and a Hong Kong IPO path, but no filed prospectus or closed round terms were public in the reviewed record. The underwriting base should therefore use the historical $140M raise as hard fact and treat new valuation marks as provisional.
  claimRefs:
  - CO008
  - CO011
  - CO026
  - CO027
