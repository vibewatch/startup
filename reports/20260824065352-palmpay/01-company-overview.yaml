- id: leadership-capital-scale
  title: Leadership Visibility, Capital Base, and Scale Signals
  body: 'PalmPay discloses much more about product traction than about corporate leadership. Publicly named operating leaders include Chika Nwosu as managing director or CEO for PalmPay Nigeria, Sofia Zab as global chief marketing officer, and Femi Hanson as the Nigerian marketing and public-relations head hired in late 2024. That is enough to show an operational bench, but not enough to give a clean founder or board map. The reviewed public record still does not surface a reliable founder list, board composition, or formal governance structure commensurate with a late-stage fintech. Capital formation is clearer. PalmPay launched with a $40 million seed round in 2019, then raised a $100 million Series A in August 2021, taking disclosed capital before the current fundraising cycle to about $140 million. By mid-2025, TechCrunch reported the company was profitable and in talks to raise another $50 million to $100 million, while August 2026 coverage pointed to an ongoing round nearer $200 million
    that could push valuation above $1 billion. Public scale signals are also strong: 35 million users, 15 million daily transactions in Q1 2025, 1 million agents and merchants, and over 1 million business relationships all suggest a real payments platform rather than a lightly used promotional wallet. But revenue, headcount, and capitalization after the ongoing round remain insufficiently disclosed for clean underwriting.'
