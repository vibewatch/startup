- id: milestones-products-footprint
  title: Milestones, Product Expansion, and Geographic Footprint
  body: 'PalmPay’s milestone path shows consistent product broadening after the initial wallet launch. The company added merchant tools, offline POS acquiring, debit cards, wealth products, Jumia pay-by-bank checkout, AfriGO contactless cards, and Verve-linked debit cards between 2021 and 2025. It also increasingly positioned itself as infrastructure rather than just an app: BusinessDay reported PalmPay had completed a live transaction on Nigeria’s National Payment Stack and was more deeply integrated into NIBSS rails. Expansion evidence, however, is mixed and should be handled carefully. TechCrunch tied PalmPay to Ghana as early as 2022. TechCabal in May 2025 said the company would expand into South Africa, Côte d’Ivoire, Uganda, and Tanzania following earlier launches in Ghana and Kenya. Launch Base Africa in August 2026 instead described consumer operations in Nigeria, Tanzania, and Bangladesh plus business-payment services in Ghana and South Africa. Those statements can all be directionally
    true while still leaving the live country footprint unclear. The safe diligence takeaway is that PalmPay is demonstrably Nigeria-centric, has credible multi-market ambitions, and has some non-Nigeria operating evidence, but the exact footprint should be re-confirmed directly with management before relying on any country-count metric.'
