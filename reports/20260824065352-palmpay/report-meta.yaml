companyProfile:
  summary: PalmPay is a Nigeria-led mobile payments and digital-banking platform that combines consumer wallet utility, merchant and agent distribution, cards and credit-adjacent products, and handset-linked acquisition into a mass-market financial-services network. Its strongest public proof remains Nigeria-centric, but the company now frames itself as an Africa-and-Asia platform and is reportedly aligning global operations with Hong Kong ahead of a possible listing path.
  foundedDate: '2019-01-01'
  founders: []
  foundingLocation: Lagos, Nigeria
  headquarters: Lagos, Nigeria operating base; Hong Kong global operations base
  productSummary: PalmPay offers mobile wallets, transfers, bill payment, airtime, merchant services, cards, savings, loans, insurance-adjacent products, and device-financing-linked financial access.
  customerFocus: Mass-market consumers, micro-merchants, agents, and SMEs, especially users entering formal finance for the first time.
  businessModel: Low-friction payments distribution monetized through merchant and POS services, transaction economics, float or financial-product income, and cross-sold financial services.
  stage: late-stage private / IPO-prep
  fundingStatus: PalmPay publicly disclosed roughly US$140 million raised through seed and Series A before an active 2026 process reported at about US$200 million and a valuation above US$1 billion, potentially alongside a Hong Kong IPO path.
  claimRefs: [CO001, CO008, CO010, CO026, CO028, CU003, CU012, CV002, CV003]
