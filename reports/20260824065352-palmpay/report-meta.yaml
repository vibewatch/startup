  topStrengths:
    - Real user, merchant, and transaction scale support PalmPay as more than a promotional wallet story.
    - Transsion-linked handset distribution, merchant and agent reach, and inclusion positioning create a distinctive acquisition moat.
    - Reported profitability and an active 2026 unicorn-plus financing process suggest the business has matured beyond pure subsidized growth.
  topRisks:
    - Audited issuer-level revenue, margin, cash-flow, and cap-table disclosure remains absent.
    - Nigeria concentration makes regulatory, macro, trust, and compliance shocks highly correlated.
    - Fraud, frozen-account disputes, and debt-collection spillover can damage valuation through trust rather than only through direct losses.
    - A premium valuation above the unicorn floor would ask investors to pay up before PalmPay proves IPO-grade disclosure readiness.
  unresolvedGaps:
    - Audited FY2025 and FY2026 financial statements with product-level monetization and take-rate bridges.
    - Geography-level users, TPV, revenue, gross profit, and complaint concentration outside Nigeria.
    - Current cap table, liquidation preferences, anti-dilution terms, and any Hong Kong IPO conversion mechanics.
    - Fraud-loss, freeze, appeal, complaint-resolution, and regulator-correspondence data.
