  topStrengths:
    - 真实用户、商户和交易规模证明 PalmPay 不只是促销钱包故事。
    - Transsion 关联的手机分发、商户和代理网络，以及普惠金融定位，拼出差异化获客护城河。
    - 据报道已经盈利，并在推进 2026 年独角兽以上估值融资，说明业务已走出单纯补贴增长阶段。
  topRisks:
    - 审计后的发行主体层面收入、毛利率、现金流和股权结构披露仍缺位。
    - 业务集中在 Nigeria，使监管、宏观、信任和合规冲击高度相关。
    - 欺诈、账户冻结争议和催收外溢，不只会带来直接损失，也会通过信任伤估值。
    - 若估值高于独角兽门槛，投资人等于在 PalmPay 证明 IPO 级披露能力之前就先支付溢价。
  unresolvedGaps:
    - 经审计的 FY2025 和 FY2026 财务报表，以及产品层面变现和 take-rate 桥接。
    - Nigeria 以外按地区拆分的用户、TPV、收入、毛利和投诉集中度。
    - 当前股权结构表、清算优先权、反稀释条款，以及任何 Hong Kong IPO 转换机制。
    - 欺诈损失、冻结、申诉、投诉解决和监管往来数据。
