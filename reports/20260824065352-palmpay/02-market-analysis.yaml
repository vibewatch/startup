- id: FM001
  title: Market Sizing Lens
  type: pyramid
  layout: standard
  summary: PalmPay’s addressable market is best viewed as layers of throughput, serviceable payment workflows, and a narrower monetizable revenue pool.
  data:
    items:
    - label: Outer TAM — Nigeria digital payment throughput
      value: ₦1.559 quadrillion
      unit: H1 2024 observed flow
      note: CBN all-channel e-payment value; throughput, not revenue
    - label: Core category lens — MMO + POS + transfer workflows
      value: ₦164.1T+
      unit: H1 2024 MMO + POS value
      note: Only two major rails relevant to PalmPay; excludes web and app transfers outside MMO lens
    - label: PalmPay SAM — consumer payments + merchant/agent access
      value: Directionally very large but revenue pool is much smaller than flow
      unit: 2026E
      note: Requires separate take-rate and monetization assumptions
  approximationNotes: This figure intentionally mixes flow layers and a serviceable-market layer because public sources are stronger on throughput than on provider-level revenue.
