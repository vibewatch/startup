- id: growth-drivers-and-constraints
  title: Growth Drivers, Adoption Constraints, and Diligence Gaps
  body: 'PalmPay’s market benefits from durable structural tailwinds. Mobile money globally crossed $2 trillion in transaction value in 2025, and West Africa remains a major driver of new-account growth. Nigeria-specific drivers include CBN support for a more digital payment system, NIBSS work on QR and lower-cost instant transfers, rising non-bank inclusion, and periods when bank glitches or cash shortages send users toward more reliable fintech apps. PalmPay in particular has benefited from free-transfer economics, aggressive distribution, and a Transsion-linked acquisition funnel. But the constraints are equally real. Cash is still the reference competitor for low-ticket transactions. Smartphone access remains less universal than basic-phone access. Fraud, insider risk, and weak KYC controls raise operating costs and can trigger regulatory intervention, as PalmPay’s own 2024 onboarding freeze illustrated in chapter 1. New digital-payments policies also shift economics: interchange, card
    rules, and compliance expectations can help formalize the market while raising cost-to-serve. The key diligence posture is therefore to preserve contradictory estimates, distinguish payment throughput from monetizable revenue, and stress-test PalmPay’s serviceable market under regulation, device constraints, and trust frictions rather than assuming every digital-payment statistic flows cleanly into TAM.'
