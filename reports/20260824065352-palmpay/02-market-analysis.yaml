callouts:
- calloutType: insight
  title: Preserve multiple market lenses
  body: For PalmPay, public sources are far stronger on throughput and inclusion than on revenue TAM. The right analytical move is to keep payment-flow, inclusion, smartphone, and monetization lenses separate instead of forcing them into a single headline market number.
  claimRefs:
  - CM006
  - CM011
  - CM015
  - CM042
- calloutType: strength
  title: PalmPay is in the right corridor of growth
  body: The company sits in the segment of Nigerian finance where policy, user behavior, and infrastructure are all tilting toward more digital transactions, especially for low-ticket consumer and agent-mediated use cases.
  claimRefs:
  - CM011
  - CM015
  - CM019
  - CM023
  - CM030
- calloutType: risk
  title: Usage growth does not equal monetization certainty
  body: Nigeria’s payments market can scale fast while still keeping margins under pressure because cash is cheap, users are fee-sensitive, smartphone access is uneven, and compliance or fraud controls keep getting more expensive.
  claimRefs:
  - CM025
  - CM026
  - CM036
  - CM040
  - CM041
