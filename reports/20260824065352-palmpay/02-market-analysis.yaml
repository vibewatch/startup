- id: TM004
  title: Growth Drivers and Constraints Table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Rising non-bank inclusion
    - Driver
    - Current / structural
    - More Nigerians are entering formal finance through fintech and other non-bank channels
    - Track whether PalmPay converts inclusion gains into retained active accounts
  - - Agent density
    - Driver
    - Current / structural
    - Large agent footprints lower the last-mile barrier for consumers who still rely on cash handling
    - Request PalmPay split between agents, merchants, and purely digital users
  - - Free or very low transfer economics
    - Driver
    - Current
    - Low perceived cost is a major acquisition and retention lever versus banks and cash
    - Model how long PalmPay can subsidize or optimize transfer pricing
  - - Transsion handset distribution
    - Driver
    - Current
    - Embedded acquisition lowers customer-friction for app downloads and early onboarding
    - Quantify what share of new users still arrive through device channels
  - - QR and lower-cost payments infrastructure
    - Driver
    - 2025-2026
    - NIBSS QR and fee-reduction plans can broaden low-ticket merchant acceptance
    - Assess whether PalmPay can capture QR-heavy merchant workflows
  - - Cash dominance
    - Constraint
    - Persistent
    - Cash remains the real competitor for low-value transactions and everyday retail
    - Stress-test adoption if digital transactions are not meaningfully cheaper or easier than cash
  - - Smartphone gap
    - Constraint
    - Persistent
    - Phone ownership is high, but smartphone penetration remains uneven across rural and lower-income users
    - Model agent-assisted and USSD-like usage as durable, not transitional, channels
  - - Fraud / KYC burden
    - Constraint
    - Current / rising
    - Fraud controls, transaction screening, and regulator expectations increase cost-to-serve
    - Review compliance staffing, fraud loss rates, and false-positive account freezes
  - - Policy and rule changes
    - Constraint
    - 2025-2026
    - Interchange, card, and payments-policy changes can alter economics even when digital usage grows
    - Monitor MDR caps, settlement rules, and license obligations for profitability impact
  notes: The table treats adoption and monetization separately. Some market drivers increase usage but do not automatically improve net revenue or trust.
