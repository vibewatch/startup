company:
  name: PalmPay
chapter:
  number: 2
  title: Market Analysis
  summary: PalmPay competes inside Nigeria’s rapidly formalizing digital-payments market rather than a vague pan-African fintech TAM. The strongest public evidence shows a huge and still-growing payments-flow market, improving but uneven financial inclusion, strong agent-led and phone-led adoption tailwinds, and a regulatory agenda that both expands digital finance and raises compliance cost. For PalmPay specifically, the serviceable market is best framed as Nigeria consumer payments plus merchant, agent, and adjacent savings/card use cases, with geographic upside and market-size claims that should be kept in multiple lenses rather than compressed into one headline number.
sections:
- id: market-boundary-and-substitutes
  title: Market Boundary, Included Spend, and Status-Quo Substitutes
  body: 'PalmPay should be analyzed inside Nigeria’s regulated digital-payments stack rather than as a generic “African fintech” label. The CBN’s provider roster places PalmPay Limited in the mobile money operator category, while PalmPay’s own app descriptions show a bundle that spans bank transfers, bills, cards, airtime, savings, insurance, and agent-assisted access. That means PalmPay’s real market boundary includes consumer wallet behavior, merchant acceptance, cash-in and cash-out, card issuance and usage, and the account-based rails that connect banks, mobile money operators, and switching infrastructure. NIBSS’s QR framework sharpens that view: merchants, consumers, wallet apps, banks, and payment processors all interact through interoperable account-based flows rather than through one closed wallet loop. The main substitutes are still cash, branch-assisted banking, standard bank-app transfers, bank-issued cards, and agent POS services run by banks or rival fintechs. PalmPay’s role
    is therefore best understood as daily retail finance infrastructure for mass-market Nigerians, not simply as a lending app or a generic neo-bank.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
