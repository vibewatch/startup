  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market-size-lenses
    missingEvidence: A reconciled PalmPay-ready TAM/SAM model that bridges CBN throughput, PalmPay share, and realistic take-rate monetization.
    whyItMatters: Observed payment flows are huge, but they do not reveal PalmPay’s revenue capture or net unit economics; compressing them into one TAM would overstate certainty.
    diligencePath: Model revenue pool separately by transfers, agent services, cards, wealth, and merchant acceptance using internal PalmPay take-rate data.
    relatedQuestionRefs:
    - QM024
    - QM025
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: minor
    topic: regional-smartphone-penetration
    missingEvidence: A clean official Nigeria-only realized smartphone-penetration series for 2024-2026 rather than a mix of survey snapshots and projections.
    whyItMatters: Device access materially affects whether PalmPay adoption is app-led or agent-led and therefore influences CAC, support costs, and retention assumptions.
    diligencePath: Request regulator or operator device-penetration data from GSMA, NCC, or handset-channel partners.
    relatedQuestionRefs:
    - QM013
  - type: private-evidence-only
    severity: material
    topic: palmpay-market-share
    missingEvidence: PalmPay’s internal share by transfer volume, active users, merchant acceptance, and agent transactions relative to Nigeria MMO peers.
    whyItMatters: Public commentary says PalmPay is a leader, but underwriting needs precise category share to judge moat durability and pricing power.
    diligencePath: Request PalmPay management dashboards or audited market-share benchmarking against peers.
    relatedQuestionRefs:
    - QM010
    - QM025
  - type: private-evidence-only
    severity: material
    topic: monetization-by-segment
    missingEvidence: Segment-level unit economics for free transfers, agent services, cards, and wealth products.
    whyItMatters: PalmPay can sit in a large market and still under-earn if free transfers, agent support, or compliance costs offset revenue from adjacent products.
    diligencePath: Request cohort-level margin and revenue data by product line.
    relatedQuestionRefs:
    - QM021
    - QM025
  - type: missing-source
    severity: minor
    topic: merchant-qr-adoption
    missingEvidence: Current merchant adoption and transaction-value statistics for NQR and comparable account-based QR flows relevant to PalmPay.
    whyItMatters: QR can broaden merchant acceptance beyond cards, but current adoption intensity remains under-documented in the reviewed public record.
    diligencePath: Obtain NIBSS or PalmPay merchant QR adoption data and live merchant counts.
