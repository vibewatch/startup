tables:
- id: TM001
  title: Market Definition Table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to PalmPay
  rows:
  - - Consumer wallet and bank transfers
    - Peer-to-peer transfers, bill payments, airtime, bank transfers, wallet-linked daily payments
    - Mortgages, treasury products, corporate credit
    - Individual user is usually both buyer and payer
    - Core daily-use market visible in PalmPay app-store descriptions
  - - Merchant and agent cash-in/cash-out
    - Deposits, withdrawals, assisted transfers, small-merchant payment facilitation
    - ATM network economics and branch-counter transactions
    - Merchant/agent operator plus end consumer transaction payer
    - Critical to PalmPay’s offline reach and trust bridge in underbanked areas
  - - Card and checkout workflows
    - Debit-card usage, pay-by-bank checkout, merchant settlement
    - Closed-loop loyalty spending with no payment rail relevance
    - Consumer or merchant depending on workflow
    - Increasingly relevant after AfriGO, Verve, and Jumia integrations
  - - Account-based QR payments
    - Merchant-presented QR collection and interoperable scan-to-pay flows
    - Proprietary POS workflows that never touch account rails
    - Merchant accepts, customer initiates, bank/MMO settles
    - Relevant because NQR broadens merchant acceptance beyond cards
  - - Savings / insurance adjacency
    - Wallet-linked savings, insurance or partner financial products that deepen account usage
    - Standalone mutual fund AUM not connected to payment account behavior
    - Individual end user
    - Important for retention and monetization but secondary to payments
  - - Pan-African expansion option
    - New-country consumer or business payment deployments
    - All Africa fintech revenue regardless of product fit
    - Management/investor lens rather than current budget owner
    - Useful outer bound, not a current Nigeria serviceable market
  notes: Boundary rows distinguish PalmPay’s core Nigeria payment and access workflows from broader fintech adjacencies. The chapter deliberately avoids collapsing throughput TAM and revenue TAM into one definition.
