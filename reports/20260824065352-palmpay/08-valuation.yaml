- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Bull thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Scale and habit
    - PalmPay has real mass-market scale and high-frequency usage, not just app-install vanity.
    - Scale definitions drift across sources and may not map cleanly to monetization quality.
    - A KPI glossary plus audited usage-to-revenue bridge would strengthen the thesis.
  - - Profitability narrative
    - Reported 2025 profitability means PalmPay may already have crossed an important maturity threshold.
    - Profitability is still media-mediated rather than issuer-audited.
    - Audited FY2025/FY2026 accounts would sharply improve confidence.
  - - Strategic position
    - Transsion-linked distribution and inclusion positioning justify a premium to generic wallets.
    - Moat quality is real but still exposed to Nigeria concentration and trust risk.
    - Non-Nigeria contribution and retention economics would clarify true premium quality.
  - - Private-market support
    - A $1B+ valuation fits regional private-fintech precedent.
    - Private-fintech precedent alone cannot justify an unlimited premium in a colder market.
    - Cleaner cap-table, demand, and preference terms would help.
  - - IPO optionality
    - Hong Kong IPO planning could unlock new capital and credibility.
    - IPO ambition is only helpful if disclosure quality rises enough for public investors.
    - Draft IPO-grade metrics and governance readiness would be decisive.
  - - Comparable discipline
    - PalmPay is small versus public comps, leaving room to grow into value.
    - Public comps are larger because they are much more disclosed and diversified.
    - Revenue, margin, and geography disclosure are needed before any premium transfer.
  notes: The anti-thesis is driven primarily by disclosure quality and correlated Nigeria risk rather than by disbelief in PalmPay’s operating scale.
