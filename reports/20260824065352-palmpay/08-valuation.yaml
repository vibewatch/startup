    - Private financing discussion, 2026
    - '>$1.0B valuation on ~$200M reported round talk'
    - Current pricing conversation for the asset itself
    - Reported discussion, not a public or fully documented financing close
  - - Moniepoint
    - Private round, 2024
    - US$1B+ valuation
    - Closest recent Nigerian fintech unicorn check with profitability narrative
    - Merchant / SME mix differs from PalmPay’s consumer-wallet bias
  - - Wave
    - Private round, 2021
    - US$1.7B valuation
    - Useful mobile-money comp for transaction-heavy, inclusion-led fintech
    - Different geography and older funding environment
  - - OPay
    - Private round, 2021
    - US$2.0B valuation
    - Shows upper-tier African consumer-fintech scale can clear far above unicorn status
    - Older round and richer capital backdrop
  - - Flutterwave
    - Private round, 2022
    - US$3B+ valuation
    - Shows regional ceiling for high-profile African fintech brands
    - More enterprise/API-heavy model and different market mood
  - - Nu Holdings
    - Public, Aug 2026
    - ~US$70.4B market cap
    - Large disclosed digital-finance comp for ambition and public-market discipline
    - Far larger, listed, and diversified
  - - Paytm
    - Public, Aug 2026
    - ~US$10.8B market cap
    - Relevant emerging-market wallet/payments reference
    - India-specific regulation and economics differ
  - - MercadoLibre
    - Public, Aug 2026
    - ~US$97.5B market cap
    - Useful for emerging-market wallet + merchant scale imagination
    - Includes a very large e-commerce business
  - - PayPal
    - Public, Aug 2026
    - ~US$53.1B market cap
    - Disclosed mature payments-platform reference
    - Mature global PSP, not a PalmPay analogue
  - - Adyen
    - Public, Aug 2026
    - ~US$39.7B market cap
    - Useful merchant-payments quality benchmark
    - Merchant-PSP model differs sharply from PalmPay
  notes: Public comparables are intentionally mixed with private African rounds because PalmPay lacks audited revenue and margin data. The table is for triangulation, not for mechanically forcing a single multiple onto an opaque asset.
