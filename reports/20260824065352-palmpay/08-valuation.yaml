- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Decision implication
  rows:
  - - Recommendation
    - research-more / track
    - Interesting company, but not yet a blind buy at a premium valuation.
  - - Valuation stance
    - fair-to-stretched
    - Support is strongest near the unicorn floor and weaker far above it.
  - - Confidence
    - medium
    - Direction of the story is clear; precision of price support is not.
  - - Risk rating
    - high
    - Nigeria concentration, regulatory sensitivity, and trust risk all matter to valuation.
  - - Cleanest current anchor
    - Reported 2026 unicorn-plus financing discussion
    - Useful as a floor-like anchor, not as a market-clearing price.
  - - Entry discipline
    - Prefer near ~US$1.0B-US$1.1B or post-disclosure
    - Waiting for audited evidence can be wiser than pre-paying a wide premium.
  - - Upgrade trigger
    - Audited profitability and monetization bridge
    - Would convert narrative plausibility into underwritable value.
  - - Primary downside trigger
    - Raise/IPO slip or disclosure disappointment
    - Could move fair value back below the unicorn line.
  notes: Assessment is explicitly price-sensitive rather than a generic company-quality judgment. “Fair” refers to support from current public anchors, not intrinsic certainty.
