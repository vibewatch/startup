- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Probability signal
  - Valuation range
  - What must be true
  - Main failure mode
  rows:
  - - Bear
    - 25%
    - US$0.65B-US$0.95B
    - Fundraise or IPO momentum fades; disclosure and monetization quality disappoint; risk incidents raise the discount rate.
    - Valuation falls back below the unicorn line because investors stop paying for forward narrative.
  - - Base
    - 50%
    - US$0.95B-US$1.25B
    - Profitability is broadly real, scale is directionally right, and no new major regulatory shock hits during financing.
    - Story remains good but not disclosed well enough to clear a large premium above unicorn status.
  - - Bull
    - 25%
    - US$1.25B-US$1.70B
    - Audited profitability is strong, take rates hold, expansion works, and Hong Kong IPO readiness becomes credible.
    - Investors decide PalmPay is still too Nigeria-concentrated or too opaque for premium pricing.
  - - Probability-weighted central view
    - 100%
    - approx. US$1.05B-US$1.15B
    - Evidence improves modestly, but not enough to justify a wide step-up above the current reported range.
    - Paying far above that level before disclosure arrives leaves little margin of safety.
  notes: Scenario ranges are analyst estimates in USD billions anchored on reported financing context, comparable-set discipline, and identified downside channels rather than on a direct audited revenue model.
