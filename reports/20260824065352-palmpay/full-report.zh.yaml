      - number: '4.3'
        title: 成本结构、欺诈与资本强度
        blocks:
          - type: paragraph
            body: >-
              PalmPay 不能按线下成本近乎为零的纯软件 PSP 来建模。公司的结构明显偏运营费用重：超过 1 million
              的代理和商户网络需要招募、支持和监督；用户问题需要横跨数字和实体渠道解决；欺诈和账户安全控制需要持续投入；发卡加本地办公室扩张会带来纯软件业务没有的履约和服务开销。Nairametrics 的 2025
              年规模报道和欺诈深度报道都支持这一判断，而 CBN 移动货币框架也解释了为什么 KYC、资金保障、AML 控制和争议处理不是可选开销。


              这一点重要，因为 PalmPay
              最强的护城河驱动——密集分发、辅助信任、快速转账和广泛消费者触达——本身也是成本中心。即便单位经济为正，公开来源也没有说明毛收入中有多少被佣金、冲正、支持、合作伙伴分成或合规吃掉。结果是一个财务上有吸引力但部分隐藏的引擎：PalmPay
              看起来比网点银行更可扩张，但比轻量消费应用背负更多运营负担。
