chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品模型与分发优势
        blocks:
          - type: paragraph
            body: >-
              PalmPay 于 2019 年进入尼日利亚，定位是面向大众市场的消费者钱包和支付应用，背后有 Transsion
              关联资本与渠道支持。发布时的价值主张刻意做得很简单：点对点转账、账单支付、话费充值、奖励和商户受理，全部装进一个为尼日利亚价格敏感、智能手机优先的非正规经济设计的应用。最强的公开分发证据是 Transsion
              关系。TechCabal 和 TechCrunch 都把 PalmPay 的上线与 Transsion 及其 TECNO 品牌联系起来，早期报道还称该应用会预装在数千万台 Tecno、Infinix 和 itel
              设备上。这一点重要，因为 Transsion 仍是非洲最大的智能手机卖家，给了 PalmPay 一条许多独立金融科技公司没有的获客路径。PalmPay
              当前应用商店描述仍把服务包装成面向尼日利亚的广义数字银行，覆盖免费银行转账、ATM 卡、话费、数据包、储蓄、保险和数字贷款，同时强调存款受 NDIC 保险覆盖、移动货币业务受 CBN
              监管。最后呈现出来的不是一个钱包，而是一个分发驱动的金融超级应用，同时承接纯数字和代理辅助的使用模式。
