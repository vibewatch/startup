      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              PalmPay 的市场是多边的。第一类买方—用户群是大众消费者，他们用 PalmPay
              转账、缴费、充话费、储蓄，并越来越多地用卡；在这个人群里，用户和经济决策者通常是同一个人，采用触发点是相对银行应用或现金的可靠性、价格和便利。第二类是需要在客户身边完成存款、取款、转账和受理流程的商户或移动货币代理。在这个人群里，信任和流动性比炫目的产品广度更重要。第三类围绕嵌入式或合作伙伴结账展开，商户看重简单的按银行账户支付结算，以及支付点更低的摩擦。NIBSS
              的 QR 架构和 PalmPay 的 Jumia 集成显示，这些轨道如何从纯 P2P 使用扩展到商户和电商流程。因此，PalmPay
              核心客群的预算所有权偏向个人消费者、小商户和一线代理，而不是采购驱动的企业买家。采用渠道也仍然多元：有些用户由智能手机带动，很多用户是应用加代理辅助，另一些地区仍受普惠覆盖、电力或连接质量拖累。
