      - number: '5.4'
        title: 路线图与依赖风险
        blocks:
          - type: paragraph
            body: >-
              PalmPay
              的路线图看起来是渐进式、分发驱动的，而不是依赖某个戏剧性技术突破。公开证据指向更深的尼日利亚覆盖、更多办公室、更多银行卡、进一步市场上线，以及安全、可靠性和产品深度的持续改进。这符合一家护城河主要来自混乱真实支付环境中运营执行力的公司。PalmPay
              依赖合作伙伴的模式也解释了为什么路线图风险离不开依赖风险：这个超级应用组合需要银行、卡组织、保险公司、资产管理人、贷款伙伴、商户、监管机构和设备渠道持续同步运转。


              因此，主要产品技术尽调风险不是 PalmPay
              缺功能，而是公司对这些功能如何被支撑的披露，仍少于技术买家或公开市场投资者理想中想看的水位。设备融资指标在官方页面之间相互冲突，跨境和信贷内部机制记录偏轻，架构细节相对企业 PSP 标准仍然偏薄。PalmPay
              显然拥有真实且广泛的产品栈；开放问题是，一旦合作伙伴、监管或融资假设改变，这套产品栈的耐久性和跨市场迁移能力有多强。
