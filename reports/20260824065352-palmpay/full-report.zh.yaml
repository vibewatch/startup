      - number: '2.4'
        title: 增长驱动、采用约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              PalmPay 的市场享有持久的结构性顺风。2025 年全球移动货币交易额跨过 $2 trillion，西非仍是新增账户增长的重要驱动。尼日利亚本土驱动包括 CBN 支持更数字化的支付系统、NIBSS 推动 QR
              和更低成本即时转账、非银行普惠覆盖上升，以及银行故障或现金短缺时期用户转向更可靠的金融科技应用。PalmPay 本身尤其受益于免费转账经济、激进分发和与 Transsion
              绑定的获客漏斗。但约束同样真实。现金仍是低客单价交易的基准竞争对手。智能手机覆盖不如功能机普遍。欺诈、内部人风险和薄弱 KYC 控制会抬高运营成本，并可能触发监管干预，PalmPay 2024
              年的开户冻结已经说明这一点。新的数字支付政策也会改变经济性：交换费、卡规则和合规预期能帮助市场正规化，同时提高服务成本。因此，关键尽调姿态是保留相互矛盾的估计，区分支付吞吐量与可变现收入，并在监管、设备约束和信任摩擦下压力测试
              PalmPay 的可服务市场，而不是假设每一项数字支付统计都能干净地流入 TAM。
