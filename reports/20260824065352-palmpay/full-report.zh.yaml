      - number: '7.3'
        title: 尼日利亚集中度和外部依赖会放大其他所有风险
        blocks:
          - type: paragraph
            body: >-
              PalmPay 的护城河离不开依赖项。Transsion 关系和手机版图是战略优势，但也意味着 PalmPay 获客引擎的一部分位于纯自有银行或支付栈之外。同样，PalmPay
              依赖国家身份系统、监管机构、支付轨道、电信可靠性和更广泛基础设施韧性。CBN 的 PSV 2025 清楚说明，安全、韧性、非接触能力和开放银行准备度都是系统优先事项。因此，PalmPay
              所处环境里，做大之后的负担正在上升。


              地理集中度会放大所有这些问题。尽管 PalmPay 讲述更广的非洲和亚洲叙事，最强的客户、交易和运营证据仍以尼日利亚为中心。这种集中度不只是宏观脚注。它意味着监管、信任、欺诈和竞争冲击更相关。2026
              年全国牌照变化还暗示竞争会加剧，因为 PalmPay 和同业正在被纳入更广泛的正规触达范围。对风险承销而言，尼日利亚集中度就是放大器，可能让原本可管理的问题重新定价整个投资逻辑。
