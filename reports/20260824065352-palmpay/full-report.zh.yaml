  - id: TM004
    title: 增长驱动与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 含义
      - 尽调追问
    rows:
      - - 非银行金融覆盖上升
        - 驱动
        - 当前 / 结构性
        - 更多尼日利亚人正通过金融科技和其他非银行渠道进入正规金融
        - 跟踪 PalmPay 是否把金融覆盖增量转化为留存活跃账户
      - - 代理网点密度
        - 驱动
        - 当前 / 结构性
        - 大规模代理网点降低仍依赖现金存取的消费者的最后一公里门槛
        - 要求 PalmPay 拆分代理、商户和纯数字用户占比
      - - 免费或极低费率转账经济性
        - 驱动
        - 当前
        - 相比银行和现金，低感知成本是获客和留存的主要杠杆
        - 测算 PalmPay 还能补贴或优化转账定价多久
      - - Transsion 手机分发
        - 驱动
        - 当前
        - 预装 / 嵌入式获客降低 App 下载和早期开户摩擦
        - 量化仍来自设备渠道的新用户占比
      - - QR 和低成本支付基础设施
        - 驱动
        - 2025-2026
        - NIBSS QR 和降费计划可扩大低客单价商户受理
        - 评估 PalmPay 能否拿下 QR 密集型商户工作流
      - - 现金主导
        - 约束
        - 持续
        - 对小额交易和日常零售，现金仍是真正对手
        - 如果数字交易并不明显比现金更便宜或更方便，需压力测试采用率
      - - 智能手机缺口
        - 约束
        - 持续
        - 手机拥有率高，但农村和低收入用户中的智能手机渗透仍不均衡
        - 将代理协助和类 USSD 用法建模为长期渠道，而非过渡渠道
      - - 欺诈 / KYC 负担
        - 约束
        - 当前 / 上升
        - 欺诈控制、交易筛查和监管预期抬高服务成本
        - 审查合规人手、欺诈损失率和误报导致的账户冻结
      - - 政策和规则变化
        - 约束
        - 2025-2026
        - 即使数字使用增长，交换费、银行卡和支付政策变化也可能改变经济性
        - 监测 MDR 上限、结算规则和牌照义务对盈利能力的影响
    notes: 本表把采用和变现分开看。有些市场驱动会提高使用量，但不会自动改善净收入或信任。
