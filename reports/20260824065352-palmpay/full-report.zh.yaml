companyProfile:
  summary: >-
    PalmPay
    是一个以尼日利亚为核心的移动支付和数字银行平台。它把消费者钱包、商户与代理网络、卡与信贷邻近产品，以及手机渠道获客拼在一起，形成面向大众市场的金融服务网络。最强的公开验证仍集中在尼日利亚，但公司现在把自己讲成覆盖非洲和亚洲的平台，并据报正把全球运营与香港对齐，为潜在上市路径做准备。
  foundedDate: '2019-01-01'
  founders: []
  foundingLocation: Lagos, Nigeria
  headquarters: Lagos, Nigeria operating base; Hong Kong global operations base
  productSummary: PalmPay 提供移动钱包、转账、账单支付、话费充值、商户服务、银行卡、储蓄、贷款、保险邻近产品，以及与设备融资绑定的金融入口。
  customerFocus: 大众消费者、微型商户、代理和 SME，尤其是首次进入正规金融体系的用户。
  businessModel: 低摩擦支付分发网络，靠商户与 POS 服务、交易经济、资金沉淀或金融产品收入，以及交叉销售金融服务变现。
