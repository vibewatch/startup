      - number: '1.2'
        title: 管理层可见度、资本基础与规模信号
        blocks:
          - type: paragraph
            body: >-
              PalmPay 对产品牵引力披露很多，对公司领导层披露少得多。公开点名的运营负责人包括 PalmPay Nigeria 董事总经理或 CEO Chika Nwosu、全球首席营销官 Sofia Zab，以及
              2024 年末加入、负责尼日利亚市场营销和公关的 Femi
              Hanson。这足以说明公司有运营班底，但不足以拼出清晰的创始人或董事会图谱。公开记录仍没有浮现可靠的创始人名单、董事会构成，或与后期金融科技公司相匹配的正式治理结构。融资脉络更清楚。PalmPay 2019
              年以 $40 million 种子轮启动，随后在 2021 年 8 月完成 $100 million Series A，使当前融资周期前已披露资本达到约 $140 million。到 2025
              年中，TechCrunch 报道公司已盈利，并在洽谈再融资 $50 million 至 $100 million；而 2026 年 8 月的报道指向一轮更接近 $200 million
              的进行中融资，可能把估值推高至 $1 billion 以上。公开规模信号同样强：35 million 用户、2025 年 Q1 15 million 日交易笔数、1 million 代理和商户，以及超过 1
              million 个商业关系，都说明这是真实运转的支付平台，而不是浅使用的促销钱包。但在收入、员工数以及进行中融资后的资本结构上，公开披露仍不足以支撑干净的承销判断。
