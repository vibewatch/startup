      - number: '3.3'
        title: 定价、切换成本与多平台共用
        blocks:
          - type: paragraph
            body: >-
              定价透明度是同业集合里最清楚的分界线之一。Flutterwave 公布尼日利亚收款价目表，Paystack 披露转账、虚拟账户、线上和终端定价，Wave 公开宣传免费存款和取款加 1%
              转账费。相比之下，PalmPay、OPay 和 Moniepoint
              都释放低成本或体感免费的用户价值，但没有公布同等层级的商户定价细节。对投资者而言，这意味着仅凭公开数据，无法把用户增长和支付规模干净地转成抽成率假设。


              切换成本也因用户类型而异。消费者很容易多平台并用：多下载一个应用，再加上一条可互操作的银行转账轨道，通常就够了。这让 PalmPay
              的低摩擦获客引擎变得重要，但也意味着一旦信任、费用或可靠性对它不利，使用习惯可能转移。商户切换更难，尤其当某个提供商同时控制 POS 硬件、代理流动性、记账或信贷时。这有利于 Moniepoint 的 SME
              流程，也让 PalmPay 在日常消费者加代理细分里拥有更窄但仍有意义的护城河。核心承销判断是，PalmPay 的用户护城河看起来远强于公开可见的定价护城河。
