    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: PalmPay 的公开时间线从 Transsion 支持下的启动，延伸到监管压力、银行卡合作，以及 2026 年可能跨上独角兽估值台阶。
    data:
      items:
        - date: '2019'
          label: 尼日利亚上线
          detail: PalmPay 以 $40M 种子轮和与 Visa 绑定的启动合作上线。
          tone: positive
        - date: '2020'
          label: 设备分发护城河
          detail: PalmPay 应用瞄准数百万台 Transsion 手机的预装触达。
          tone: positive
        - date: 2021-08
          label: Series A 扩张资金
          detail: PalmPay 完成 $100M Series A，进一步接近独角兽规模。
          tone: positive
        - date: '2022'
          label: 披露 5M 用户
          detail: TechCrunch 报道称 PalmPay 声称拥有 5M 用户，并扩张到加纳。
          tone: positive
        - date: 2023-05
          label: 催收反弹
          detail: 公开投诉和梗图让放贷实践承受声誉压力。
          tone: negative
        - date: 2024-04
          label: 开户冻结
          detail: CBN 指令暂停新增注册，凸显合规审查压力。
          tone: negative
        - date: 2024-12
          label: Jumia 集成
          detail: pay-by-bank 扩张把钱包接入主要电商结账量。
          tone: neutral
        - date: 2025-03
          label: 本地银行卡合作
          detail: AfriGO 和 Verve 合作推动 PalmPay 进入银行卡和非接触式支付。
          tone: positive
        - date: 2025-Q1
          label: 15M 日交易
