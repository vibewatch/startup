      - number: '8.3'
        title: 情景区间、入场纪律与投资逻辑失效点
        blocks:
          - type: paragraph
            body: >-
              披露材料不完整，比起给出单一公允价值，情景分析更有用。基准情景应贴近 2026 年新闻流暗示的独角兽门槛：约 $0.95B-$1.25B。该区间假设盈利叙事大体成立，规模指标方向正确，且 PalmPay
              继续加深尼日利亚业务，没有新的监管或信任冲击。乐观情景可以更高——也许
              $1.25B-$1.7B——但只有审计后盈利质量、抽佣率持久性和多市场执行都强于现有公开记录所能证明时才成立。若融资推进不顺或披露质量令人失望，悲观情景自然落在独角兽线以下。


              所以，入场纪律比头条标签更重要。投资人要判断的不是 PalmPay 是否有意思；答案显然是有。真正的问题是，当前价格讨论是否已经预支了过多对未来披露的信任。若 PalmPay
              的定价接近独角兽底部，投资逻辑更容易支撑。若公司在没有审计财务和干净风险包的情况下试图大幅高于这个区间定价，安全边际会迅速变窄。
