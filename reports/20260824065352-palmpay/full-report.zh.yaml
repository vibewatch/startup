      - number: '8.2'
        title: 可比样本与估值纪律
        blocks:
          - type: paragraph
            body: >-
              给 PalmPay 定价，需要同时看非洲私募金融科技融资轮和披露更充分的大型上市可比公司。非洲私募样本显示，投资人愿意为具备区域扩张野心的规模化支付平台付多少钱：OPay 2021 年估值 $2
              billion，Flutterwave 2022 年超过 $3 billion，Moniepoint 2024 年 $1B+，Wave 2021 年 $1.7 billion。因此，PalmPay $1B+
              的估值方向上可信。事实上，略高于 $1 billion 的 PalmPay，放在近期最强尼日利亚可比公司与非洲金融科技顶峰之间，还算合理。


              上市可比公司的作用不同。Nu、Paytm、PayPal、MercadoLibre 和 Adyen 不能直接套成 PalmPay
              的定价公式，因为它们规模更大、业务更多元、披露更充分。但它们能约束估值。它们提醒投资人，公开资本市场奖励的是规模和证据，不只是故事。上市样本最重要的启发不是具体市值，而是披露差距。Nu、MercadoLibre
              和 PayPal 可以通过 SEC 和投资者报告体系来研究；PalmPay 还不行。因此，在 PalmPay 给出同等透明度之前，公开可比估值迁移应该保持保守。
