  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 截至 2026-08-24，对 PalmPay 估值配置做投委会风格打分，重点看真实运营证据与定价披露仍不足之间的张力。
    data:
      items:
        - label: 规模 / 品类地位
          score: 8
          detail: PalmPay 看起来是真正做出规模的非洲消费金融科技平台。
        - label: 变现证明
          score: 5
          detail: 据报道公司已盈利，但审计后的抽佣率质量仍缺失。
        - label: 披露质量
          score: 2
          detail: 没有发行人层面的招股书或审计版公开财务材料包。
        - label: 私募可比支撑
          score: 7
          detail: 非洲私募金融科技可比公司让独角兽以上估值更说得通。
        - label: 公开可比纪律
          score: 5
          detail: 公开可比公司既支撑上行想象，也暴露披露缺口。
        - label: 监管韧性
          score: 4
          detail: Nigeria 集中度和控制敏感性仍有实质影响。
        - label: 高于 $1.5B 的安全边际
          score: 3
          detail: 披露不升级时很薄。
        - label: 整体综合
          value: 4.9
          score: null
          detail: 价格与证据更匹配之前，保持观察 / 继续研究。
    approximationNotes: 分数是分析师基于 1-10 分量表、综合本章证据作出的判断，并非公司披露指标。
