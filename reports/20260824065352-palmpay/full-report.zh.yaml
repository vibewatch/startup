      - number: '3.2'
        title: 分发、能力与渠道权力
        blocks:
          - type: paragraph
            body: >-
              PalmPay 最强的公开优势仍是分发。上线报道把公司与 Transsion 的手机生态联系起来，后续报道则描述 PalmPay 拥有 35 million 用户、15 million 日交易笔数，以及超过 1
              million 代理和商户。这个组合重要，因为它把设备端发现和线下信任桥接在一起。OPay
              是最接近的镜像：它同样主打低摩擦转账、银行卡、储蓄和快速支持，而且资本化程度足够高，可以继续在全国尺度上争夺日常交易习惯。


              一旦购买标准从简单零售支付转向商户运营，这个市场的分化就更尖锐。Moniepoint 在 POS、企业账户、记账、信贷和银行卡收单上的公开版图更深。Flutterwave 和 Paystack
              走向另一条路，强调结账、开发者工具和正式商户经济。Wave 目前不是尼日利亚规模的直接对手，但它公开的 1% 转账费模型说明，只要分发和信任对齐，低费率移动货币仍能造成经济性冲击。因此，PalmPay
              的公开证据支持其在大众零售金融上的广度，但不支持其在商业软件、贷款或企业 PSP 层面拥有同等强度。
