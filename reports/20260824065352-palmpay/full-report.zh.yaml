  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分群与普惠金融叙事
        blocks:
          - type: paragraph
            body: >-
              PalmPay
              的客户群不应被当成一个同质化消费者钱包队列。保留证据支持至少四类主要客户：想要快速转账和缴费的日常消费者；提供现金入口和辅助服务的代理与商户用户；使用账户支付和企业支付功能的商户或结账合作伙伴；以及首次接触金融服务、入口可能是应用本身或智能手机融资的用户。这种分群重要，因为
              PalmPay 的公开增长故事不只关乎数字原生城市用户。公司明确在讲一个故事：用比传统银行通常更低摩擦、更便宜、也更容易线下接触的界面，把新用户带入正规金融。


              这个普惠金融角度不是空泛品牌叙事。TechCrunch 报道称，25% 的 PalmPay 用户表示这是他们有史以来第一个金融账户；在借款人中，这一数字升至
              60%。官方影响力文案也用首次贷款获得者和智能手机融资主张强化同一思路。最有力的解读是，PalmPay
              同时在获取主流支付用户和品类开创型用户——对后者来说，这个应用是第一段正规金融关系，而不只是现有银行应用的更便宜替代品。
