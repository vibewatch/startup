      - number: '8.4'
        title: 建议与最终尽调条件
        blocks:
          - type: paragraph
            body: >-
              清晰建议是继续研究 / 观察：中等信心、高风险，估值处于合理至偏高。PalmPay
              的运营真实度太高，不能简单否定。其用户规模、支付习惯、盈利叙事和战略股东，都支持它大概率进入独角兽行列。但在审计披露前，公开证据还不足以支撑投资人以显著高于独角兽门槛的价格买入。太多关键估值变量仍未解：分地域收入结构、抽佣率持久性、股权结构经济条款、欺诈和冻结指标、监管沟通记录。


              因此，最终尽调包必须格外具体。投资人应索取 FY2025 和 FY2026 审计财务报表、收入与 TPV
              的桥接、分市场用户和利润结构、投诉和冻结仪表盘、欺诈损失和申诉数据，以及完全摊薄股权结构表和优先股堆叠。如果 PalmPay 能交出这套材料，且数字验证当前故事，投资判断可以从观察转为买入。否则，正确解释不是
              PalmPay 没有价值，而是价格跑得比证据更快。
