      - number: '2.2'
        title: 规模测算视角与采用规模
        blocks:
          - type: paragraph
            body: >-
              PalmPay 可服务市场的公开测算数据很多，但口径并不统一。CBN 的电子支付统计衡量系统原始吞吐量：仅 2024 年 H1，总电子支付交易就达到 22.42 billion 笔、金额约 ₦1.56
              quadrillion，其中移动货币运营商贡献 7.18 billion 笔和 ₦78.2 trillion 交易额，POS 贡献 6.40 billion 笔和 ₦85.9 trillion
              交易额。这些不是收入数字，但足以说明 PalmPay 所在市场的用户活动已经很大。TechCabal 的 2025 年移动货币分析把视角进一步前推，引用 2025 年 Q1 ₦20.71 trillion 的
              MMO 交易额，并认为 PalmPay 和 OPay 主导了非电信运营商主导的 MMO 类别。普惠金融与设备数据补上采用框架：EFInA 的 2023 年调查显示，正规普惠金融覆盖率为
              64%，总体普惠金融覆盖率为 74%，但农村和北部排除率仍高；手机普及率高，智能手机使用率却明显更低。正确结论不是拍出一个宏大的 TAM
              数字，而是分层看：巨大的支付流水市场、仍未关闭的普惠金融缺口，以及任何能结合低成本转账、代理、互操作性和信任的提供商都能服务的一大块人群。
