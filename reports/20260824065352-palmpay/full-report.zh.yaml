      - number: '1.3'
        title: 里程碑、产品扩张与地理版图
        blocks:
          - type: paragraph
            body: >-
              PalmPay 的里程碑路径显示，初始钱包上线后，公司持续拓宽产品。2021 至 2025 年间，PalmPay 增加了商户工具、线下 POS 收单、借记卡、财富产品、Jumia 按银行账户支付结账、AfriGO
              非接触式卡，以及与 Verve 关联的借记卡。公司也越来越把自己定位成基础设施，而不只是一个应用：BusinessDay 报道称，PalmPay 已在尼日利亚 National Payment Stack
              上完成实时交易，并更深接入 NIBSS 轨道。不过，扩张证据并不一致，需要谨慎处理。早在 2022 年，TechCrunch 就把 PalmPay 与加纳联系起来。TechCabal 在 2025 年 5
              月称，公司将在此前进入加纳和肯尼亚之后，继续扩张至南非、科特迪瓦、乌干达和坦桑尼亚。Launch Base Africa 在 2026 年 8
              月则描述了尼日利亚、坦桑尼亚和孟加拉的消费者业务，以及加纳和南非的企业支付服务。这些表述方向上都可能成立，但实际在运营国家版图仍不清楚。稳妥的尽调结论是：PalmPay
              明显以尼日利亚为核心，有可信的多市场野心，也有一些尼日利亚以外的运营证据；但在依赖任何国家数量指标前，应直接向管理层重新确认具体版图。
