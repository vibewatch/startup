        - 钱包 / 移动货币 / 代理生态
        - 据称 35M 用户；15M 日交易；1M+ 代理和商户
        - 大众消费者、微型商户、首个金融 App 用户
        - Transsion 分发、免费转账习惯、定位清晰且消费者金融组合宽
        - 公开商户定价和深度 SME 工具比部分对手更不透明
      - - OPay
        - 钱包 / 移动货币 / 代理生态
        - 2021 年融资 $400M，估值 $2B；尼日利亚大众钱包品牌
        - 消费者、现金存取用户、代理
        - 快速转账习惯、卡、储蓄和强势公开客服信息
        - 信任和合规感知仍是现实问题；公开层面的企业深度较薄
      - - Moniepoint
        - 商户收单 / 企业银行 / 代理银行
        - 据报道 Series C 轮 >$200M；2025 年 14B 笔交易、₦412T 交易额
        - SME、商户、代理
        - POS、企业账户、记账、信贷、银行卡收单
        - 相比 PalmPay 或 OPay，不那么明显围绕纯消费者钱包习惯搭建
      - - Flutterwave
        - 企业 PSP / 结账 / 付款
        - 2022 年 $3B 估值信号；产品线广泛扩张
        - 在线商户、创业公司、跨境企业
        - API、结账、付款、POS、跨境和受监管扩张
        - 线下消费者分发弱于消费者钱包对手
      - - Paystack
        - 开发者优先 PSP / 终端 / 支付 OS
        - 据报道 300K+ 商户且集团盈利
        - SME、开发者、电商商户
        - 透明定价、开发者工具、结算清晰度、终端经济性
        - 代理网络和线下协助式分发弱于钱包主导型对手
      - - Wave
        - 低费率移动货币标杆
        - 2021 年融资 $200M，估值 $1.7B
        - 西非钱包用户和代理
        - 免费存取款、免费账单支付、1% 转账费
        - 目前不是尼日利亚规模的直接对手
      - - 电信运营商主导钱包 / 自助服务 App
        - 电信渠道替代方案
        - 电信覆盖广，但本资料集中保留的尼日利亚钱包细节较少
        - 大众移动用户
        - SIM 和话费关系可降低获客摩擦
        - 西非增长证据越来越多指向非 MNO 金融科技赢家
      - - 现状：现金 + 银行转账 App
        - 替代方案 / 自建 / 既有轨道
        - 根深蒂固的日常行为和可互通银行轨道
        - 几乎所有消费者和商户
        - 无需形成新的 App 行为；既有银行关系和对现金的熟悉度足够
        - 可靠性问题和网点时代摩擦给金融科技公司留下机会
    notes: 行把直接钱包对手，与商户主导、PSP 主导、电信主导和现状替代方案分开。规模信号混合公司说法 和可信报道，并非提供商级别市占率。
