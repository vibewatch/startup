  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 状态 / 日期
      - 估值或倍数锚点
      - 与 PalmPay 的关联
      - 局限
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most decision-useful public and private valuation references for PalmPay as of the 2026-08-24 run
        date, combining PalmPay’s own financing narrative, African private-fintech rounds, and larger disclosed public
        comps rather than every possible bank or payments stock.
    rows:
      - - PalmPay 据报道的 2026 年融资背景
        - 私募融资讨论，2026
        - 基于约 $200M 传闻轮次的 >$1.0B 估值
        - PalmPay 自身当前定价讨论
        - 媒体报道中的讨论，不是公开或资料完备的融资交割
      - - Moniepoint
        - 私募轮次，2024
        - US$1B+ 估值
        - 最接近的近期尼日利亚金融科技独角兽参照，且同样有盈利叙事
        - 商户 / 中小企业组合不同于 PalmPay 偏消费钱包的结构
      - - Wave
        - 私募轮次，2021
        - US$1.7B 估值
        - 适合作为交易密集、普惠驱动型金融科技的移动货币可比对象
        - 地域不同，融资环境也更早
      - - OPay
        - 私募轮次，2021
        - US$2.0B 估值
        - 显示一线非洲消费金融科技规模可以远高于独角兽状态
        - 轮次更早，资本背景更宽松
      - - Flutterwave
        - 私募轮次，2022
        - US$3B+ 估值
        - 显示高知名度非洲金融科技品牌的区域上限
        - 企业 / API 模式更重，市场情绪也不同
      - - Nu Holdings
        - 上市，2026 年 8 月
        - 约 US$70.4B 市值
        - 大型、披露充分的数字金融可比对象，可校准野心和公开市场纪律
        - 体量大得多，已上市，且业务更多元
      - - Paytm
        - 上市，2026 年 8 月
        - 约 US$10.8B 市值
        - 新兴市场钱包 / 支付参照
        - 印度特定监管和经济性不同
      - - MercadoLibre
        - 上市，2026 年 8 月
        - 约 US$97.5B 市值
        - 有助于想象新兴市场钱包 + 商户规模
        - 包含一个非常大的电商业务
      - - PayPal
        - 上市，2026 年 8 月
        - 约 US$53.1B 市值
        - 披露充分的成熟支付平台参照
        - 成熟全球 PSP，不是 PalmPay 的类比对象
      - - Adyen
        - 上市，2026 年 8 月
        - 约 US$39.7B 市值
        - 有用的商户支付质量基准
        - 商户 PSP 模式与 PalmPay 差异很大
    notes: 有意把上市可比公司与非洲私募轮次混在一起，因为 PalmPay 缺少经审计的收入和利润率数据。这张表用于三角校准，不是把单一倍数机械套到一个不透明资产上。
