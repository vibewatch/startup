        - 近乎免费的转账定位和免维护卡信息
        - 消费者钱包组合
        - 转账、卡、储蓄、客服、账单支付
        - 公开可见的商户经济性细节很少
        - 消费者获客容易理解；收入捕获不容易
      - - Moniepoint
        - 商业价值比公开逐项定价更清楚
        - 商户和企业银行组合
        - POS、账户、记账、贷款、银行卡收单
        - 保留证据中的标准化公开商户价目表有限
        - 即使公开定价不够清晰，也能靠工作流深度赢下商户
      - - Flutterwave
        - 尼日利亚本地收款 2%（1.4% 费用 + 0.6% 平台费）
        - 商户 / 企业 PSP
        - 结账、付款、POS、集成、跨境服务
        - 定制折扣和企业条款各不相同
        - 透明定价帮助正规在线商户快速比较
      - - Paystack
        - 详细的本地、国际、转账、VA 和终端定价
        - 开发者和商户 PSP
        - 结账、转账、虚拟账户、终端、T+1 结算
        - 大额折扣需谈判
        - 定价透明本身就是销售优势
      - - Wave
        - 存款、取款、缴费免费，转账 1%
        - 低费率钱包 / 代理模式
        - 现金处理、转账、账单支付、支持
        - 尼日利亚产品可用性不是问题，因为这里把它当基准，而非主要本地对手
        - 说明移动钱包费率还能大幅下压
      - - 现状：现金 + 银行转账
        - 现金没有 App 标价；银行转账费用因银行而异
        - 既有关系 / 行为习惯
        - 无需转入新的金融科技平台
        - 可靠性和时间成本往往只是隐藏了，并非不存在
        - 金融科技公司胜出的关键是把便利性做可见，而不只是压低标价
    notes: 公开定价随商业模式差异很大。钱包龙头更愿意讲清用户获益，却很少讲商户经济性；PSP 披露的商业条款要明确得多。
