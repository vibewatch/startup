      - number: '4.2'
        title: 单位经济与产品组合逻辑
        blocks:
          - type: paragraph
            body: >-
              PalmPay 的公开运营统计已经足够亮眼，能暗示真实规模，但还不足以给出精确单位经济。Nairametrics 报道称，2025 年 Q1 公司有 15 million 日交易笔数、35 million
              用户、每用户每月约 50 笔交易，以及约 80% 留存。同一报道还补充了 9 million 月活财富用户和 ₦4 billion 已支付利息，这很重要，因为它说明 PalmPay
              的金融引擎不能只靠转账或账单支付流水支撑。拥有这么多活跃财富用户并支付大额利息的产品，也在管理有意义的余额，即便公开披露没有解释利差、佣金或合作伙伴经济到底如何分配。


              银行卡也强化了同一点。AfriGO 和 Verve 合作扩大了留住存款、捕捉类似交换费经济，并把 PalmPay 更紧地贴近日常消费的机会。但缺少公开商户定价仍然重要。如果 PalmPay 2024 年收入略高于
              $128 million，而年度支付流水已经达到数百亿美元，变现一定只是总支付额中的极小一片。这本身不是缺陷，但意味着公司很可能依赖附着产品与支持效率的精细组合，而不是简单抽取头条费率。
