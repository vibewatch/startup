  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 按用户任务拆分竞争格局
        blocks:
          - type: paragraph
            body: >-
              PalmPay 的竞争集合只有按用户要完成的任务拆开才说得通。对要决定用哪里转钱、缴费、充话费，或通过附近代理取现的尼日利亚大众消费者而言，PalmPay 最直接竞争的是
              OPay，其次才是其他钱包优先的移动货币应用。对需要企业账户、POS 可靠性、记账、员工控制或营运资金入口的商户而言，Moniepoint 是更相关的标杆。对线上卖家或软件驱动型商户而言，Flutterwave
              和 Paystack 更重要，因为它们公开结账、API、结算和商户定价细节，而消费者钱包竞争者通常不会。


              替代品范围比金融科技同业更宽。现金、银行应用和银行转账轨道仍是很多日常流程里的真实现状方案，而 NIBSS
              的互操作性意味着用户可以在提供商之间移动，不必完全锁进一个封闭系统。电信运营商绑定服务仍是非洲移动货币故事的一部分，但最近尼日利亚和西非最强的证据显示，PalmPay 和 OPay 等非 MNO
              玩家正在拿走当前移动货币叙事中的很大份额。结果是一个碎片化战场：PalmPay 最强的是消费者钱包习惯和辅助分发，而不是每一类支付任务。
