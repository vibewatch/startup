  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代品
        blocks:
          - type: paragraph
            body: >-
              分析 PalmPay 时，应把它放进尼日利亚受监管的数字支付栈，而不是笼统贴上“非洲金融科技”标签。CBN 的提供商名录把 PalmPay Limited 归入移动货币运营商类别，PalmPay
              自己的应用描述也显示，其组合横跨银行转账、账单、银行卡、话费、储蓄、保险和代理辅助入口。这意味着 PalmPay
              的真实市场边界包括消费者钱包行为、商户受理、现金存取、发卡和用卡，以及连接银行、移动货币运营商和交换基础设施的账户型轨道。NIBSS 的 QR
              框架让这一判断更清楚：商户、消费者、钱包应用、银行和支付处理商通过可互操作的账户型资金流互动，而不是关在一个封闭钱包回路里。主要替代品仍是现金、网点辅助银行服务、标准银行应用转账、银行发行卡，以及由银行或竞争金融科技公司运营的代理
              POS 服务。因此，PalmPay 最适合被理解为面向尼日利亚大众的日常零售金融基础设施，而不是单纯的贷款应用或泛泛的新银行。
