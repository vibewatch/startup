  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 购买方 / 付款方
      - 对 PalmPay 的意义
    rows:
      - - 消费者钱包和银行转账
        - 点对点转账、账单支付、话费充值、银行转账、钱包关联日常支付
        - 按揭贷款、资金管理产品、企业信贷
        - 个人用户通常同时是购买方和付款方
        - PalmPay 应用商店描述中可见的核心日用市场
      - - 商户和代理现金存取
        - 存款、取款、辅助转账、小商户收款支持
        - ATM 网络经济性和网点柜台交易
        - 商户 / 代理经营者，加上终端消费者交易付款方
        - 对 PalmPay 触达线下和在银行服务不足地区搭建信任桥梁很关键
      - - 卡与结账流程
        - 借记卡使用、按银行付款结账、商户结算
        - 与支付轨道无关的闭环忠诚度消费
        - 取决于流程，可能是消费者或商户
        - AfriGO、Verve 和 Jumia 集成后重要性上升
      - - 基于账户的 QR 支付
        - 商户展示 QR 收款，以及可互操作扫码支付流程
        - 不触达账户轨道的专有 POS 流程
        - 商户收款，客户发起，银行 / MMO 结算
        - NQR 将商户受理范围扩展到卡以外，因此有意义
      - - 储蓄 / 保险邻近业务
        - 与钱包关联的储蓄、保险或合作伙伴金融产品，加深账户使用
        - 与支付账户行为无关的独立共同基金 AUM
        - 个人终端用户
        - 对留存和货币化重要，但次于支付
      - - 泛非扩张选项
        - 新进入国家的消费者或企业支付部署
        - 不管产品契合度的全非金融科技收入
        - 管理层 / 投资人视角，而非当前预算所有者
        - 有助于设定外沿边界，但不是当前尼日利亚可服务市场
    notes: 边界行把 PalmPay 在尼日利亚的核心支付和接入流程，与更宽泛的金融科技邻近业务区分开。本章刻意避免把吞吐量 TAM 和收入 TAM 混成一个定义。
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
      - CM033
