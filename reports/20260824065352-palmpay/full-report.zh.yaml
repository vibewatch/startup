  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值锚点与“独角兽”说法的真实含义
        blocks:
          - type: paragraph
            body: >-
              PalmPay 的估值叙事已经不再只是抽象猜测。到 2025 年中，TechCrunch 已报道称公司已经盈利，并可能融资 $100 million。到 2026 年 8 月，又有多家媒体报道更大一轮融资讨论：约
              $200 million，估值超过 $1 billion，并可能关联香港 IPO 计划。这足以把 PalmPay
              放进独角兽候选名单；但还不足以证明这个价格已经被充分验证。目前最强锚点仍是据报道的私募市场讨论，不是公开招股书、已定价的上市市场，也不是发行人层面的审计文件。


              这个差别很关键。一家公司可以配得上独角兽标签，同时仍然难以精确定价。PalmPay
              官方页面和独立运营报道支撑了一个真实放大的业务：数千万用户、高频交易、商户触达，以及可信的普惠金融故事。盈利报道又加了一层支撑。但公开披露仍太薄，无法把这套叙事转成清晰的内在估值模型。因此，正确读法是：独角兽门槛看起来可信，门槛之上的精确度仍然弱。
