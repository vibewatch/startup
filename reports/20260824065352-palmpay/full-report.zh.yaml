      - number: '5.2'
        title: 支付轨道、集成与运营架构
        blocks:
          - type: paragraph
            body: >-
              理解 PalmPay 架构，最简单的方式是把它看成对受监管支付轨道的编排，而不是一个完全封闭的自有网络。官网称，企业 API 支持跨银行、钱包、银行卡和移动货币轨道的收款、付款和嵌入式金融，结算可做到 T+1
              或更快。TechCrunch 的 2025 年报道补充称，PalmPay 的企业产品已经在已上线市场每月处理数亿美元交易，并被设计成供跨境商户使用的单一 API。TechCabal 的 Jumia
              报道显示，公司也为大型电商场景搭出了按银行账户支付和合作伙伴结账流程。


              公司没有公布的，是包含处理器冗余、数据流、账本边界或结算银行拓扑的真实系统图。因此，架构主张方向上可信，但在系统设计层面的证据偏薄。不过，保留证据已经足以推断出一套连贯结构：消费者钱包和商户流位于 CBN 监管的
              MMO 规则、NIBSS 关联支付轨道、合作伙伴金融产品，以及不断增加的结账或 API 集成之上。PalmPay 的技术强项看起来在编排与最后一公里分发的交汇处，而不是在深度公开基础设施文档上。
