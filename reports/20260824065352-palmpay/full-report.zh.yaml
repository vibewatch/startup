  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 概率信号
      - 估值区间
      - 必须成立的条件
      - 主要失败模式
    rows:
      - - 悲观
        - 25%
        - US$0.65B-US$0.95B
        - 融资或 IPO 动能减弱；披露和变现质量不及预期；风险事件推高折现率。
        - 估值跌回独角兽线下，因为投资者停止为前瞻叙事付费。
      - - 基准
        - 50%
        - US$0.95B-US$1.25B
        - 盈利大体真实，规模方向正确，融资期间没有新的重大监管冲击。
        - 故事仍好，但披露不足，无法证明应比独角兽状态大幅溢价。
      - - 乐观
        - 25%
        - US$1.25B-US$1.70B
        - 经审计的盈利能力强，抽成率守住，扩张跑通，香港 IPO 准备度变得可信。
        - 投资者认定 PalmPay 仍过度集中在尼日利亚，或过于不透明，难以给出溢价定价。
      - - 概率加权中枢判断
        - 100%
        - 约 US$1.05B-US$1.15B
        - 证据小幅改善，但还不足以支撑在当前报道区间上大幅上调。
        - 披露到位之前，若远高于该水平买入，安全边际很薄。
    notes: 情景区间是分析师估计，以报道中的融资背景、可比公司约束和已识别下行通道为锚，而不是直接来自经审计收入模型。
