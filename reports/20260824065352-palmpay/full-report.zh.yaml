  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 维度
      - 乐观逻辑
      - 反向逻辑
      - 改变判断的证据
    rows:
      - - 规模与使用习惯
        - PalmPay 有真实的大众市场规模和高频使用，不只是应用安装量的虚胖。
        - 不同来源对规模的口径会漂移，也未必能干净映射到变现质量。
        - 一套 KPI 口径表，加上经审计的使用量到收入桥，会强化投资逻辑。
      - - 盈利叙事
        - 据报道 2025 年盈利，意味着 PalmPay 可能已经跨过重要成熟度门槛。
        - 盈利仍来自媒体转述，而不是发行主体审计。
        - 经审计的 FY2025/FY2026 账目会显著提高信心。
      - - 战略位置
        - 与 Transsion 绑定的分发，以及金融普惠定位，足以支撑相对普通钱包的溢价。
        - 护城河确实存在，但仍暴露于尼日利亚集中度和信任风险。
        - 非尼日利亚贡献和留存经济性会厘清真正的溢价质量。
      - - 私募市场支撑
        - $1B+ 估值符合区域私募金融科技先例。
        - 市场转冷时，仅靠私募金融科技先例，无法支撑无限溢价。
        - 更清晰的股权结构、需求和优先权条款会有帮助。
      - - IPO 可选性
        - 香港 IPO 规划可能撬动新资本，也提升可信度。
        - 只有披露质量升到足以打动公开市场投资者时，IPO 目标才有价值。
        - IPO 级指标草稿和治理准备度将是决定性证据。
      - - 可比公司约束
        - 相比上市可比公司，PalmPay 体量仍小，还有成长进估值的空间。
        - 上市可比公司更大，是因为披露充分得多，业务也更分散。
        - 先披露收入、利润率和地域结构，才谈得上把溢价迁移过来。
    notes: 反向逻辑主要由披露质量和与尼日利亚集中度绑定的风险驱动，而不是不相信 PalmPay 的经营规模。
