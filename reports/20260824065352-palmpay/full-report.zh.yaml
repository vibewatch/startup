  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与合规传导是最难处理的下行路径
        blocks:
          - type: paragraph
            body: >-
              PalmPay 的关键风险不是金融科技一般都有风险，而是公司在尼日利亚支付制度内已经达到系统相关规模，而这套制度正好在 PalmPay 拓宽产品范围时变得更严格。2026 年公开记录值得注意：Techpoint
              把 2026 年描述为执法年，Legit.ng 则报道 CBN 围绕隔离、所有权披露、市场集中度和 AML 的新规则。相比小钱包，这些变化对 PalmPay 更重要，因为 PalmPay
              已经声称拥有数千万用户、日交易规模，以及横跨支付、储蓄、银行卡、商户服务和信贷邻近产品的多产品栈。


              公开证据也显示，监管风险可以直接打击增长。TechCabal 2024 年的报道记录了 CBN 推动的开户冻结，影响 PalmPay 及同业；只有在更严格的 KYC
              和反加密货币控制之后，注册才重启。这一顺序是最干净的证明：即使没有戏剧性的牌照吊销，PalmPay 的增长引擎也能被节流。PalmPay
              自己的投诉页面让法律边界变得可见：一般投诉、法院命令、监管或执法请求都是明确通道。这在一个意义上让人安心，但也证明法律和监管介入是日常运营现实，而不是理论上的尾部事件。
