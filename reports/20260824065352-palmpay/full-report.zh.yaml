  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与交易规模
        blocks:
          - type: paragraph
            body: >-
              PalmPay 的公开证据更能说明经济形态，而不是经审计财务报表。公司围绕零费率转账、低摩擦开户和庞大线下网络打造消费者品牌，但变现故事已经超出可见的免费层。TechCrunch 2025
              年报道称，PalmPay 2023 年收入约 $64 million，收入此后已翻倍以上，并重点提到新的企业向和跨境支付产品。Launch Base Africa 进一步报道，2024 年收入超过 $128
              million，2025 年实现盈利，并在 2026 年寻求约 $200 million 融资。无论这串二手数字是否能完全对齐，共同信息很清楚：PalmPay
              已不再只是一个促销钱包，而是一个带有多种变现附着点的规模化支付网络。


              问题在于，这些附着点好命名、难量化。公开证据支持企业支付、银行卡、财富产品，以及合作伙伴主导的保险或信贷经济，但 PalmPay 没有发布可与 PSP
              同业相比的商户价目表。投资者面对的是一家显然很大的业务，却仍难把它转成干净的混合抽成率模型。因此，正确框架是：一个可见费率很低的消费者表层，下面叠着范围更窄、可变现的商户、银行卡、合作伙伴和企业支付轨道。
