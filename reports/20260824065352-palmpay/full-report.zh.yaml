      - number: '6.2'
        title: 增长验证与具名客户证据
        blocks:
          - type: paragraph
            body: >-
              PalmPay 客户规模的公开验证很多，但口径并不完全标准化。官方页面声称 40 million 用户和 1 million 企业，而 2025 年独立报道常用 35 million 用户、超过 1
              million 代理和商户，以及 15 million 日交易笔数。Nairametrics 还补充了每月服务 13 million 客户、每用户每月 50 笔交易，以及约 80%
              留存。这些数字不能互换，但放在一起，描述的是一个真实拥有大众市场活动的平台，而不是一个营销过度、使用很浅的应用。


              具名证据更薄，但并非没有。PalmPay 官方首页包含来自 Ekiti State 用户 Damilola 的具体故事。TechCabal 对 Jumia 的报道给出了商户侧的具体客户验证，显示 PalmPay
              是一个大型电商平台上的支付选项。公司还称，已有超过 100 个合作伙伴使用其在线支付解决方案。正确结论是：PalmPay 有强规模验证，也有一些真实客户来源验证，但相对其规模，公开的具名企业披露仍有限。
