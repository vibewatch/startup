      - number: '6.3'
        title: 留存、重复使用与支持质量
        blocks:
          - type: paragraph
            body: >-
              PalmPay 的留存引擎看起来是实用性加信任，而不是新鲜感。最强的保留信号包括日常高频、广泛使用场景、容易触达的支持，以及产品相对现金或不可靠银行渠道的感知优势。官方界面和 APKMirror
              描述反复强调免费转账、零维护费、24/7 支持，以及灵活储蓄或信贷，作为让应用保持中心位置的理由。Nairametrics 提出的 80% 留存和高月度交易频次支撑这一叙事，尽管它们不能替代经审计队列分析。


              FOLIO 基准加入了一个更独立的行为视角。PalmPay 综合排名第二，并在清晰度类别领先，个人信任回应也好于市场预期。这表明产品体验之所以粘，不只是靠折扣。不过，留存质量还没有完全厘清。PalmPay
              不公布干净队列数据、支持响应 SLA，也没有正式 NPS / CSAT。公开证据足以让人相信重复使用率高；但还不足以精确建模服务故障或监管冲击后，这种使用有多抗压。
