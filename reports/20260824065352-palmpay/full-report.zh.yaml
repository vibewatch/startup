      - number: '6.4'
        title: 反向证据、集中度与未解风险
        blocks:
          - type: paragraph
            body: >-
              负面记录重要，因为客户信任是尼日利亚支付里的核心资产。TechCabal 2023 年的催收调查记录了围绕 PalmPay 相关放贷做法的骚扰、隐私泄露和声誉损害指控。PalmPay
              否认这些行为是公司政策，但该报道仍显示，信贷邻近产品能多快污染更广泛品牌。2024
              年开户冻结增加了另一类客户风险：即便存量用户没有被直接关在门外，新用户获取也暂停了数周，提醒投资者客户增长不仅依赖下载或返现，也同样依赖监管信任。


              地理集中度是另一个重要警示。PalmPay
              谈的是多市场，但最强客户和交易证据仍集中在尼日利亚。这并不致命——尼日利亚足够大，意义巨大——但它确实说明，相比顶层应用叙事可能暗示的样子，客户故事的多元化程度更低。因此，审慎的客户判断是：覆盖和实用性为正面，但仍需警惕负面贷款暴露、监管中断风险和国家集中度。
