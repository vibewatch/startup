  - id: TV005
    title: 投资逻辑破裂与放弃触发因素表
    columns:
      - 触发因素
      - 阈值或事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 经审计变现不及预期
        - 财报显示抽成率更弱、利润率更低，或盈利耐久度不及暗示
        - 基准和乐观情景会立刻压缩，因为质量溢价消失
        - 转为回避，或要求估值重定价到悲观区间。
      - - 融资或 IPO 明显延后
        - 融资动能减弱，或公开流程在没有有力解释的情况下推迟
        - 暗示需求或披露准备度可能弱于头条叙事
        - 等到清晰度和新锚点出现后再投资。
      - - 新监管或合规行动
        - 新增开户限制、重大执法，或显著整改负担
        - 推高折现率，并削弱增长耐久度假设
        - 除非更强的审计证据抵消，否则视为投资逻辑破裂。
      - - 信任恶化可见化
        - 投诉、冻结或欺诈叙事明显恶化
        - 伤害留存假设，并抬高客服或合规成本预期
        - 下调合理区间，等待经营证据。
      - - 出现不透明股权结构或优先权
        - 后期尽调发现棘轮条款、结构复杂，或 IPO 转换经济性差
        - 名义估值不再对应新投资者的有效经济性
        - 投资前按完全摊薄和净经济性条款重新承做。
    notes: 触发因素被表述为可监控、会改变估值判断的事件，而不是泛泛运营风险。
    claimRefs:
      - CV029
      - CV040
      - CV041
      - CV042
      - CV043
      - CV045
      - CV047
  - id: TV006
    title: 最终尽调请求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 经审计财务
        - FY2025 和 FY2026 经审计收入、毛利率、EBIT/EBITDA 和现金流量表
        - 开展直接倍数分析和盈利质量承做的核心前提
        - 获取审计师包、董事会批准账目或招股书草稿材料。
      - - 收入质量桥
        - TPV 到收入、抽成率、产品组合和队列变现桥
        - 区分看似免费的支付习惯与已经变现的经济性
        - 索取银行家材料和月度队列变现表。
      - - 地域组合
        - 国家层面的用户、TPV、收入和利润贡献
        - 决定尼日利亚集中度应给估值打多少折
        - 索取按市场划分的管理层经营复盘。
      - - 风险与控制材料包
        - 欺诈损失数据、冻结率、申诉结果、投诉账龄和监管往来
        - 直接影响折现率、留存假设和信任耐久度
        - 审阅董事会风险材料包和外部律师摘要。
      - - 股权结构与优先权
        - 持股、优先股堆叠、反稀释条款和 IPO 转换机制
        - 名义估值可能与有效进入经济性显著偏离
        - 审阅资料室股权结构表和融资条款律师备忘录。
      - - 治理与上市准备度
        - 董事会构成、委员会、内控和 IPO 工作计划
        - 说明公开市场级披露能否在不爆出意外的情况下到位
        - 要求治理备忘录和上市准备度评估。
    notes: 这些是从「有意思、很可能是独角兽」推进到「能以溢价买入」的最低尽调条件。
