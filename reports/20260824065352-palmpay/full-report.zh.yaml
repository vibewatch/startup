  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品套件与用户任务
        blocks:
          - type: paragraph
            body: >-
              PalmPay 现在的公开产品表面，已经比 2019
              年上线时那个简单钱包宽得多。官方消费者页面强调免费转账、储蓄、借记卡、信贷、奖励、账单支付和一个应用完成所有事的便利，公司页面则描述了面向新兴市场的全栈数字银行。官方关于页面又进一步加入企业工具、企业 B2B
              支付、设备融资和跨市场扩张。落到实际，PalmPay 不再把自己定位成点对点转账的单点方案，而是在把自己定位成消费者、代理、商户和部分企业客户的主要金融操作层。


              公开证据还显示，PalmPay 会在不同市场为不同入口设计产品。在尼日利亚，锚定任务是日常资金流转。在坦桑尼亚和孟加拉，所述切入楔子是预装 PalmPay
              应用的智能手机融资，把硬件分发转成产品开户。战略上，这很重要，因为它说明 PalmPay 的产品栈可以穿过多条渠道：应用主导的消费者使用、代理辅助使用、商户受理，以及硬件主导的首次接入。结果是，PalmPay
              披露出的产品版图比多数纯消费者钱包更宽。
