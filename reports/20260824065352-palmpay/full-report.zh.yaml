      - number: '1.4'
        title: 监管位置与信任压力信号
        blocks:
          - type: paragraph
            body: >-
              PalmPay 的监管站位有分量，但并非无风险。Central Bank of Nigeria 的支付服务提供商名录把 PalmPay Limited 列在移动货币运营商牌照类别下，PalmPay
              自己的应用商店描述也强调 CBN 监管和 NDIC 保险。这让公司真实处在尼日利亚正规支付监管边界内。但公开记录也显示反复出现的信任压力。2024 年 4 月，CBN 在 KYC 和加密货币相关审查下，命令
              PalmPay 及若干同业暂停新客注册；6 月，在附加合规条件后限制解除。PalmPay 的信贷历史里还出现了另一类客户信任风险：TechCabal
              记录了网上围绕激进催收手法的大量投诉和梗图文化，包括通讯录羞辱和骚扰借款人的指控，尽管 PalmPay 否认与最恶劣行为方存在关联，并称正在审计 Flexi 相关流程。到 2025 年，PalmPay
              公开强调生物识别、异常检测、交易筛查和选择性账户冻结等欺诈控制。这些回应方向上是正面的，但也确认了欺诈管理、消费者保护和合规纪律是核心尽调议题，而不是边缘问题。
