      - number: '8.2'
        title: 可比交易与市场基准
        blocks:
          - type: paragraph
            body: >-
              在 Incode 的精确规模和增长率上，没有完美 IDV 可比公司，但四个私募轮次可比和两个上市公司可比可以框定分析。私营成长公司侧，Persona 2025 年 4 月 Series D 按约 $141
              million ARR 获得 $2.0 billion 估值，隐含 14.2x EV/ARR——这是最近且结构最接近的类比（B2B IDV SaaS、AI 原生、高增长）。因此 Persona
              是锚定可比。Incode 17.6x 要价较 Persona 溢价约 24%，需要由更确定的增长、更深护城河或更好的利润率画像支撑——而这些都未被公开资料充分证明。Socure 2021 年 11 月 $4.5B
              Series E 隐含约 60x ARR，年份太久且处在零利率巅峰期价格环境，不能作为实时基准。Veriff 2022 年 1 月 $1.5B 估值同样嵌入过时年份倍数（按 2024 ARR 约
              36x），无法反映当前市场条件。


              M&A 退出侧，Entrust 2024 年 4 月以确认的 $650 million 收购 Onfido；Onfido 年收入超过 $140 million，隐含约 4.6x EV/Revenue
              倍数。这是最清晰的近期退出可比，也凸显 IDV 的 M&A 退出倍数大致为 4–5x ARR，远低于 17.6x 的成长轮要价。退出倍数和成长轮倍数之间存在价差很常见，但会制造有意义的退出风险：如果 Incode
              无法 IPO，或只能找到战略收购方，退出倍数可能显著压缩。


              上市可比中，Mitek Systems（MITK）按 FY2025 收入 $179.7 million 和约 $775 million 市值计算，约以 4.3x 市销率交易。CLEAR Secure（NYSE:
              YOU）按 FY2024 收入 $900.8 million 和约 $7 billion 市值计算，约以 7.6x 交易。两者都是公开且有流动性的公司，但 CLEAR 是消费生物识别公司，Mitek
              增速较慢（同比 4%）——都不能直接捕捉 Incode 的高增长 AI 原生画像。2026 年 3 月，公开 SaaS 板块 EV/Revenue 中位数降至 3.4x，反映 AI
              颠覆担忧和增速放缓推动的宏观倍数压缩。只有 AI 原生、高 NRR、通过 Rule of 40 的公司，才能在私募交易中维持 9–12x 以上倍数；即便如此，顶部四分位也低于 Incode 17.6x 目标。
