            body: >-
              Incode 的轨迹说明，公司不到十年就从 2015 年的消费者照片分享创业公司，转成全球 AI 身份基础设施供应商。关键拐点包括：2018 年战略转向生物识别身份；2021 年独角兽轮注入
              $220M，并带来蓝筹投资者背书；2025 年 8 月收购 AuthenticID，在未披露财务条款的情况下，合并客户覆盖大致翻倍。


              美国政府业务在 2025 年末加速：2025 年 11 月取得 FedRAMP Ready 认证，随后在 2025 年 12 月获得 $37.4M Login.gov 合同。合作方面，Okta（2025 年 2
