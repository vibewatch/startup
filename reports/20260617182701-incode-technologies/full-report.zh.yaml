      - number: '7.5'
        title: 风险综合与投资含义
        blocks:
          - type: paragraph
            body: >-
              相比典型企业 SaaS 公司，Incode 风险画像更高，原因是三项因素叠加：（1）它处在生物识别和金融服务合规交汇处——这两个领域最容易吸引监管和诉讼关注；（2）它在地域上集中于 LATAM /
              墨西哥，在运营风险之上增加国家和货币风险；（3）它在一个倍数压缩仍是现实威胁的市场中，以溢价估值（约 17.6x ARR）寻求资本。

              监管风险是结构上最难回避的向量。EU AI Act、Mexico LFPDPPP、BIPA、Texas CUBI 和 FTC 执法共同构成不断扩大的多司法辖区合规负担，无论 Incode
              内部如何选择，成本和复杂度都会上升。BIPA 和解证明这不是理论风险：Incode 已经支付 $4M，并同意改进合规。未来来自新 BIPA 案件（每年 100+ 起）、Texas CUBI / TRAIGA，或
              EU AI Act 执法行动的敞口，可能大得多。

              Deepfake 带来的技术风险同时是威胁和市场机会——Incode
              竞争的核心就是击败欺诈，欺诈环境越恶化，已被证明的解决方案越有价值。但这也造成不对称声誉风险：一次在大型银行客户处发生的高曝光绕过，如果造成重大欺诈，可能同时触发客户流失和监管审查。

              投资者需要警惕的论点失效触发因素包括：伊利诺伊州出现新的重大生物识别集体诉讼（尤其是 2024 年 BIPA 修正案追溯适用问题被不利解决后）；EU AI Act 执法行动指控 Incode
              高风险系统不合规；大型银行客户流失；证据显示 $3B 估值融资以低于 2022 年 Series B 的折价轮完成；或 Incode 活体系统被记录发生高流量 deepfake 绕过。
