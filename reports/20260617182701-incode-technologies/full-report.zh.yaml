      - number: '5.7'
        title: 路线图与新兴能力
        blocks:
          - type: paragraph
            body: >
              2025 年末，Incode 最重要的产品延伸是 Agentic Identity。该系统于 2025 年 10 月发布，并在 2025 年第四季度进入试点。它把抗 deepfake 的生物识别用于验证自主 AI
              agent，通过有生物识别背书的加密 scope token，把每个 agent 绑定到一个已验证的人类所有者，并支持可编程过期和撤销。系统可持续监控 agent 行为，发现异常或被攻陷的 agent
              后触发自动或人工响应。Agentic Identity 与 Incode 现有身份套件集成，支持 MCP 和其他 agentic 协议，用来回应企业对 AI agent
              冒名、未授权交易以及自主工作流问责的担忧。首席产品官 Roman Karachinsky 对目标的表述是：让企业部署 AI agent 时「不牺牲反欺诈或合规」。Risk AI Agent
              能力则为真人验证旅程提供互补的会话层整体决策，它持续从每个客户的欺诈和转化模式中学习，不需要手工配置规则。合规路线图上，FedRAMP Ready 状态让 Incode 可以在 2026 年通过机构赞助方推进完整
              Authorization to Operate。政府部门路线图还受到 Login.gov 合同支撑；该合同于 2025 年 12 月宣布，用于下一代身份核验，由分包商 Diamond Capture
              Associates 交付。这些能力显示，Incode 正有意从私营部门金融服务，扩展到受监管的政府和员工身份市场。
            claimRefs:
              - CE036
              - CE037
              - CE040
              - CE045
      - number: '5.8'
        title: 展品
        blocks:
          - type: callout
            title: 全球首个 iBeta Level 2 + NIST FRTE
            body: >
              Incode 的生物识别核心，是唯一同时拥有 NIST FRTE 全方案提供商最高排名（2024 年）和全球首个 iBeta ISO 30107-3 Level 2 被动活体认证的主要 IDV
              提供商。两项独立评估为销售和合规沟通提供了客观锚点，而多数竞争对手缺少这类证据。再加上连续两年获得 Gartner 领导者认可，公司形成了强有力、且难以快速复制的第三方验证叙事。
            calloutType: strength
