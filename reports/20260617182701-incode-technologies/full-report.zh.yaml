      - number: '1.5'
        title: 风险与不利事件
        blocks:
          - type: paragraph
            body: >-
              Incode 面临多项重大风险，尽调必须把这些风险与商业动能一起权衡。最具体的不利事件是 BIPA 集体诉讼（Aspel v. Incode Technologies, Case No.
              2023LA59）：Incode 以 $4M 和解，但不承认不当行为；原告指称公司在 2018 年 11 月至 2024 年 8 月之间，未取得适当 BIPA 同意就收集 Illinois
              居民的人脸几何数据。这暴露出生物识别数据采集核心流程的合规缺口。随着美国各州和国际范围内生物识别隐私监管扩张，Incode 的同意与披露做法会持续受审查，并在隐私敏感行业形成重大企业采购风险。


              创始人兼 CEO Ricardo Amper 的关键人物集中度是结构性隐忧：他是公开门面、融资主导者和产品架构师。作为私营公司，Incode 的董事会构成和接班规划仍不透明。不同来源给出的员工数估计从 556 到
              668 不等，引发 AuthenticID 团队收购后整合问题。未确认的 $150–300M 融资、$3B 目标估值，相比最后确认的 $1.25B，意味着 140%
              估值跃升，但独立佐证有限。PremierAlts 冲突的 $407M 累计融资数字进一步说明，新投资关闭前必须完整披露 cap table。
