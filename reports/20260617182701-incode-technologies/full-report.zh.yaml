companyProfile:
  summary: >-
    Incode Technologies 是一家总部位于 San Francisco 和 Mexico City 的身份验证公司，由 Ricardo Amper 于 2015 年创立。平台把证件验证、生物识别人脸比对、主动 /
    被动活体检测组合成端到端编排层，服务金融机构、金融科技、电信、游戏运营商和政府机构，在拉丁美洲根基尤其深。公司在 2021 年 12 月以 $1.25B Series B 跻身独角兽；到 2025 年末，据报公司凭借约 $170M
    年度经常性收入，正以最高 $3B 估值筹集新资本。
