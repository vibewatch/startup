      - number: '8.6'
        title: 建议与确信度
        blocks:
          - type: paragraph
            body: >-
              建议：跟踪 / 继续研究。置信度：中。风险评级：高。估值立场：偏高。


              Incode 是 AI 驱动生物识别身份验证领域真正的品类领导者，拥有强客户验证、亮眼增长主张，并在美国政府市场持续取得进展。但 $3B 目标估值对应 17.6x EV/ARR，已经按完美执行定价——显著高于公开
              SaaS 中位数、最新私有 IDV 可比公司（Persona 为 14.2x），以及最近一次 IDV 并购退出（Onfido 为 4.6x）。自 2026 年初以来，公开 SaaS
              已遭遇倍数压缩（EV/Revenue 中位数现为 3.4x），这提高了本轮以更低估值关闭、甚至无法关闭的风险。


              建议不是回避：Incode 的增长、客户质量和市场位置，最终可能支撑这一区间的估值。但要对 $3B 形成确信，需要审计财务确认 $170M ARR 和增长率，需要完整披露优先权悬挂与债务条款，需要 Rule of
              40 指标，也需要 NRR 数据。没有这些披露，以 $3B 入场的安全边际有限。若投资者能谈到更低入场价（例如 12–15x ARR = $2.0–2.5B），或拿到结构化下行保护，风险 /
              回报会完全不同。升级为买入之前，应跟踪本轮交割条款，并等待下一次年度收入更新来确认增速。
            claimRefs:
