  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台概览与编排
        blocks:
          - type: paragraph
            body: >
              Incode Omni 是一套统一的端到端身份验证与反欺诈平台，核心是一层无代码编排中枢。平台把证件验证、人脸生物识别、活体检测、设备风险分析、KYC 和 AML
              合规集中到一个可配置的工作流中心，客户通过拖拽式流程构建器即可使用。常见场景下，客户不用工程团队介入，就能把模块、业务规则和条件逻辑组合成多步骤验证旅程；完整 SDK 和 REST API
              则支撑更深的定制集成。编排仪表盘把实时决策、案件管理、欺诈分析和绩效报告放在同一处。Incode Omni 把自己定位为贯穿客户和员工全生命周期的身份单一记录系统——从最初开户和
              KYC，到持续认证、重新验证，再到员工服务台自动化。公司称，截至 2026 年中，客户群累计处理 71 亿次信任检查，其中 2024 日历年完成 41 亿次身份验证。受信部署覆盖美国前十大银行中的 8
              家、美国前九大电信运营商中的 8 家，以及全球前三大新银行。
