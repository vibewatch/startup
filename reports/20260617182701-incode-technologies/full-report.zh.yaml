      - number: '8.7'
        title: 附录
        blocks:
          - type: callout
            title: Persona 是核心可比锚点
            body: >-
              Persona 2025 年 4 月 Series D 融资，估值 $2B / ARR $141M = 14.2x EV/ARR，是最近且结构上可比的私有 IDV 融资轮。Incode $3B 目标估值对应
              17.6x，较 Persona 溢价 24%——这项溢价必须由更高且经验证的增长、更好的 NRR 或更强护城河来支撑。仅靠公开渠道无法确认这些条件。
            calloutType: insight
            claimRefs:
              - CV021
              - CV023
              - CV036
              - CV037
          - type: callout
            title: 债务留置权是未披露的复杂因素
            body: >-
              USPTO 专利转让记录显示，J.P. Morgan Chase Bank 于 2024 年 7 月 1 日取得 Incode 资产的担保权益（REEL/FRAME
              067887/0333），TriplePoint Capital LLC 于 2025 年 7 月 18 日登记了进一步担保权益（REEL/FRAME
              071781/0603）。这些留置权没有出现在任何公开融资公告中，并会削弱新投资者按 $3B 标题价格可获得的净股权价值。
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV044
          - type: callout
            title: $3B 时跟踪；12–15x ARR 时买入
            body: >-
              当前 $3B 要价下，建议为跟踪。若能以 12–15x ARR（$2.0–2.5B）入场，安全边际将更接近 Persona 最新可比轮和当前私有 SaaS 市场条件。升级为买入需要：（1）审计财务确认
              $170M+ ARR；（2）确认本轮关闭并披露优先权条款；（3）NRR 和 Rule of 40 数据高于同业门槛；（4）厘清 JPMorgan/TriplePoint 债务义务。
            calloutType: recommendation
            claimRefs:
              - CV005
