  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >
              身份验证市场涵盖通过数字渠道验证个人真实世界身份的解决方案。纳入支出包括证件验证（护照、国家 ID、驾照）、生物识别活体检测、人脸识别、指纹扫描、虹膜采集、自动化 e-KYC 入驻流程，以及开户环节的 AI
              驱动欺诈筛查。相邻支出包括反洗钱（AML）交易监测、开放银行同意基础设施，以及持续
              perpetual-KYC（pKYC）刷新服务。核心市场边界之外，则是与身份核验无关的通用网络安全平台、线下网点公证、信用评分引擎和支付网关基础设施本身。Incode 主要竞争于该市场的生物识别活体和 e-KYC
              细分，重点聚焦 LATAM 金融机构。金融服务（BFSI）约占身份验证总支出的 30–33%，是主导需求引擎。云部署目前占 65–69% 市场份额，支持快速 API 集成和持续模型更新——这些特征正是
              Incode 平台架构的核心。现状替代方案包括线下网点人工 KYC、外包 BPO 身份审核，以及缺乏实时生物识别活体能力的旧式规则证件验证工具。
