          tone: positive
        - label: 种子轮 — $10M
          date: '2019-10-01'
          detail: DILA Capital 领投 $10M 种子轮，验证身份战略。
          tone: positive
        - label: Series A — $25M
          date: '2021-03-01'
          detail: DN Capital、3L Capital 等参与的 $25M Series A，为美国和拉美扩张提供资金。
          tone: positive
        - label: Series B 独角兽 — $220M
          date: '2021-12-07'
          detail: General Atlantic 和 SoftBank 共同领投 $220M Series B，投后估值 $1.25B；公司进入独角兽行列。
          tone: positive
        - label: BIPA 集体诉讼提起
          date: '2023-01-01'
          detail: Aspel v. Incode Technologies 在伊利诺伊州提起；2024 年因生物识别数据同意违规达成 $4M 和解。
          tone: negative
        - label: Okta 合作
          date: '2025-02-01'
