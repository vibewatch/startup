          - type: callout
            title: FedRAMP ATO 依赖给联邦收入带来时点风险
            body: >
              FedRAMP Ready 是有意义的里程碑，但完整 Authorization to Operate 仍需要机构赞助方，通常还要 12–24 个月。Incode 有 Login.gov
              分包合同作为过渡项目，但在拿到 ATO 前，联邦合同规模仍会受限。赞助机构关系一旦延后，就会拉长公司兑现美国政府完整机会的时间线，而这正是 FedRAMP 投入试图打开的市场。
