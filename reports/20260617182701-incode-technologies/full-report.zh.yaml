  - id: TE002
    title: 验证工作流与用例地图
    columns:
      - 用户任务 / 工作流
      - 当前状态 / 痛点
      - Incode 方案
      - 声称的可衡量收益
      - 已知限制
    rows:
      - - 新客户开户（KYC）
        - 人工证件审核、队列慢、欺诈风险
        - 单一流程自动完成 OCR + 人脸匹配 + 活体检测；无需新账户或新 app
        - 几乎即时开户；完成率较竞争对手提升 20%
        - 完成率数字为公司口径；无独立基准
      - - 合成身份欺诈防范
        - AI 生成的 ID 和人脸能绕过传统检查
        - Deepsight 多层方案：注入拦截 + 感知 AI + GSOR 确定性交叉校验
        - 中等严重程度下 99.65% 合成 ID 检测率；FPR 优势为次优系统的 68x
        - 99.65% 指标的严重程度阈值定义未披露
      - - 电子护照 NFC 验证
        - 需要实物证件检查；光学 OCR 存在欺诈
        - 通过移动 SDK 读取 NFC 芯片密码学数据；将芯片数据与光学采集交叉验证
        - 芯片认证用 BAC / EAC 协议防止证件伪造
        - NFC SDK 可作为可选 React Native 变体使用；广泛设备兼容性未做基准
      - - 员工身份（入职 + 帮助台）
        - IAM 凭证通过深度伪造 / 社会工程被盗；SIM-swap 绕过 MFA
        - 员工生命周期每个关键时刻，用实时自拍匹配已验证生物特征档案
        - 消除招聘、MFA 重置和帮助台操作中的冒充
        - 与特定 ITSM 平台（ServiceNow、Jira 等）的集成深度未获独立确认
      - - 年龄验证（受监管服务）
        - 赌博、社交媒体或酒类场景的年龄检查依赖人工，或容易绕过
        - 人脸年龄估计使用多元人口统计数据训练；符合 Age Check Certification Scheme（ACCS）
        - NIST 年龄估计排名第一；获得 ACCS 认证
        - 临近年龄阈值等边缘场景下，年龄估算误差范围未披露
      - - 政府公民服务（FedRAMP）
        - 传统身份核验速度慢，也容易被 AI 欺诈攻破
        - FedRAMP Ready 平台，符合 NIST IAL2；无状态架构；无需留存 PII
        - 支撑 Login.gov 下一代身份核验合同（$37.4M 中标）
        - 尚未取得完整 FedRAMP ATO；正在由机构赞助方推进
    notes: 收益主张来自 Incode 官方产品页和新闻稿。公开资料中没有可用的转化率和欺诈检测指标独立验证。
