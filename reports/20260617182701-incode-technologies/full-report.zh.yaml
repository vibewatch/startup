  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景与当前进入点
        blocks:
          - type: paragraph
            body: >-
              Incode 上一次由外部定价的事件，是 2021 年 12 月 Series B：由 General Atlantic 和 SoftBank 的 LatAm Vision Fund 共同领投，融资 $220
              million，投后估值 $1.25 billion。距离当前融资讨论，已经相隔约 4.5 年。2025 年 11 月，Bloomberg 报道且多家媒体确认，Incode 正进行初步谈判，计划按最高 $3
              billion 估值融资 $150–300 million，并引用约 $170 million 年经常性收入。$3B / $170M ARR 的算术意味着 EV/ARR 倍数约 17.6x——较 2021
              年估值标记上调 140%。


              二级市场数据聚合商 PremierAlts 列示，Incode 截至 2026 年的市场隐含估值为 $3.0 billion，与 Bloomberg 数字一致。Latka 独立报告约 $170M
              ARR。但公司没有发布经审计财务，没有宣布已完成新一轮融资，该轮结构（包括优先权条款）也未披露。公司还背负两项有担保债务义务：J.P. Morgan Chase Bank 于 2024 年 7 月 1 日获授
              Incode 资产上的担保权益，TriplePoint Capital LLC 于 2025 年 7 月 18 日记录了进一步担保权益——两者均可在 USPTO
              专利转让记录中看到。这些债务层级对资产拥有优先请求权，会降低净股权价值，且没有反映在 $3B 谈判估值标题数字中。累计融资额（Crunchbase / Tracxn 的 $262M vs. PremierAlts
              的 $407M）也仍未对齐，暗示可能存在未披露融资批次或二级交易。
