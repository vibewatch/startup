  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              2026 年的身份验证（IDV）、KYC 和生物识别认证市场，已有 100 多家供应商，分布在多个竞争层级：纯 IDV
              专家（Jumio、Veriff、Sumsub、Persona、Entrust/Onfido）、AI
              原生欺诈决策平台（Socure）、生物识别专家（iProov、AU10TIX）、合规优先的数据平台（Trulioo、Mitek），以及政府 / 企业既有巨头（IDEMIA、Thales）。Gartner 2024
              年首份 Identity Verification Magic Quadrant 将 11 家供应商划入四个象限；Leaders 包括 Sumsub、Socure、Entrust、Jumio 和 Incode
              Technologies。2025 年同样评估 11 家供应商，Persona 从 Challenger 升至 Leader（拥有最高 Ability to Execute 得分），Sumsub 在
              Completeness of Vision 上进步最远，Incode 连续第二年保持 Leader 地位。市场整合正在加速——Entrust 于 2024 年 4 月收购
              Onfido——竞争也分化为全平台编排商和特定用例点解决方案。AI 生成欺诈（deepfake、合成身份、注入攻击）正在重塑采购标准，使买方转向独立活体认证、agentic AI 防御和端到端编排。IDEMIA
              和 Thales 主要竞争于政府身份和边境管控，不出现在商业 IDV Magic Quadrant 中。Mitek Systems 是市场上唯一一家上市纯 IDV 公司（NASDAQ:
              MITK）。下方竞争定位图按地理广度与平台集成完整度放置关键玩家。
