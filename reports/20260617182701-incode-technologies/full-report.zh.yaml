      - number: '6.5'
        title: 集中度风险与负面证据
        blocks:
          - type: paragraph
            body: >-
              Incode 客户基础存在可识别的集中度风险，沿两条轴线展开：地域和垂直行业。2025 年，墨西哥一国贡献全球 70 亿次验证中的 20 亿次（约 29%），LATAM 银行业——尤其是
              Banorte、Citibanamex 和 Banco Dondé——构成证据最深的客户关系。在银行业集中度本来就高的市场（少数大型银行主导）中，失去一个一线银行关系就可能带来实质性验证量下滑。S&P
              Global 的 2026 年银行风险评述指出，LATAM 银行越来越依赖第三方金融科技供应商推进数字化转型；如果关键提供商中断，系统性风险会被放大。meritra.co 的 LatAm Banking Risk
              2026 分析记录，欺诈和网络风险如今位列 LATAM 银行董事会级风险前两位，这既给 Incode 创造机会，也带来依赖风险。产品集成风险上，G2 评论者指出 Incode 定价「对小型运营方偏贵」（3
              次提及），且对不熟悉 KYC 流程的团队，集成复杂度可能成为障碍（2 次提及）。2026 年 3 月一条 Gartner Peer Insights 评论批评 Incode 的
              API「不够中立」，要求过多客户端决策逻辑——这一信号可能增加部分部署的切换成本，但也可能在中端市场层级推动流失。公开记录中未见重大企业客户流失事件。Rappi 经常在营销中被列为 Incode 客户，但截至
              2026 年 6 月，双方都没有公开确认有生产部署记录。
