      - number: '4.2'
        title: 增长轨迹与收入表现
        blocks:
          - type: paragraph
            body: >-
              Incode 的 ARR 轨迹是其财务画像中最强的数据点。GetLatka 记录 2023 年 12 月 ARR 为 $86.7M；2025 年 6 月，Incode 达到 $170M ARR——约 18
              个月累计增长 96%。公司在 2025 年 8 月 AuthenticID 收购新闻稿中称，平台在无机贡献之前实现 80% 同比有机增长，这与观察到的轨迹一致。Biometric Update 和
              Bloomberg 在 2025 年 11 月融资报道中，也独立印证了 $170M ARR 数字。


              公司在 2024 日历年处理 4.1B 次身份检查，到 2026 年 3 月总 trust checks 升至 7.1B——这样的量级凸显了企业定价下按检查收费收入模式的耐久性。按 $170M ARR /
              GetLatka 556 名员工计算，人均收入估计约 $305,000，达到或高于同等收入规模企业 SaaS 公司的 best-in-class 基准。缺乏审计财务报表、GAAP 收入确认披露，或更后期
              trailing-twelve-month（TTM）收入数字，限制了验证 ARR 动能是否延续到 2026 年的能力。
