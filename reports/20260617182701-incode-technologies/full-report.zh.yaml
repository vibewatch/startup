  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Incode 所处赛道，是企业软件中监管最重的细分之一：面向金融服务的大规模生物识别身份验证。公司已经产生直接法律风险：2024 年，Incode 以 $4 million 和解 Aspel v. Incode
              Technologies, Inc.（N.D. Ill. 1:23-cv-17093），解决其在未取得 BIPA 要求书面同意的情况下采集伊利诺伊州居民面部几何数据的指控。案件集体覆盖 2018 年 11 月至
              2024 年 8 月的用户，说明同意流程可能多年不足。

              往前看，Incode 相关的每个地理市场监管都在收紧。美国方面，Illinois BIPA 每年仍产生超过 100 起新的集体诉讼；尽管 2024 年 BIPA
              修正案限制了「按每次扫描」计算的损害赔偿，法院对追溯适用仍有分歧。第七巡回法院将在 2026 年作出有约束力的裁决，可能大幅重塑全行业存量案件敞口。Texas CUBI（Tex. Bus. & Com. Code
              §503.001）在 2025 年 6 月 TRAIGA AI 法的强化下，现已明确适用于采集生物识别标识符的 AI 系统，并增加最高每次违规 $25,000 的民事罚款，由 Texas Attorney
              General 执法。FTC 通过 2023 年生物识别政策声明，承诺依据 FTC Act Section 5 打击不公平或欺骗性生物识别实践——且已经禁止 Rite Aid 使用人脸识别五年。

              欧盟方面，AI Act 将于 2026 年 8 月 2 日全面可执行。执法部门在公共空间做任何实时生物识别识别均被禁止；高风险生物识别系统必须接受符合性评估、准备风险文档，罚款可达 €35 million
              或年全球营业额的 7%。墨西哥——Incode 最大收入地区——在 2025 年 3 月全面修订 LFPDPPP，并解散独立监管机构 INAI，将执法权转至行政部门
              SABG。生物识别数据仍被明确列为敏感数据，要求具体、知情、自由的同意。SABG 的配套细则仍未出台，带来合规不确定性。

              Clearview AI 先例（通过股权权益达成 $51.75M BIPA 和解）显示，对拥有庞大用户群的生物识别公司，集体诉讼敞口可能接近压垮公司。Incode
              代表银行和电信客户执行身份检查，会持续产生潜在暴露的伊利诺伊州居民管道。
