      - number: '4.4'
        title: 单位经济与运营效率
        blocks:
          - type: paragraph
            body: >-
              Incode 不公开披露毛利率、获客成本（CAC）、净收入留存（NRR）或流失率。作为私营公司，外部唯一可量化的单位经济代理指标是人均收入——约 $305K；对 ARR 超过 $100M 的企业 SaaS
              公司而言，这一水平具备竞争力。鉴于交付模式主要基于软件，没有硬件制造或有意义的实物库存，毛利率结构上有利；可比身份验证 SaaS 公司的分析师基准显示毛利率在 70–80% 区间，但这只是估计，不是公司报告数字。


              获客成本和 CAC 回本期未知。面向大型银行和电信运营商的企业直销动作意味着销售周期长（一份 SWOT
              分析也独立指出这是弱点），单笔交易销售成本可能较高；能够抵消的是多年合同的耐久性，以及大型企业账户内扩张潜力。NRR 是关键未知数：美国前 10 大银行中的 8 家、北美前 9 大电信运营商中的 8
              家都是客户，这个 cohort 暗示留存高；但没有披露数据，不能负责任地给出 NRR 估计。所有单位经济单元格均保持 null，并标记为需要 data room 访问的证据缺口。
