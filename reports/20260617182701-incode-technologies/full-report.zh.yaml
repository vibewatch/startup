              Agentic Identity 于 2025 年 10 月推出，回应了 AI agent 部署加速后真实且增长中的企业需求。Incode 的做法——把 agent
              与已验证的人类所有者做生物识别绑定——技术上自洽，并延伸既有生物识别基础设施，而不需要另起一个平台。但截至 2026 年中，公司尚未披露生产部署、客户案例研究或独立评估。试点转生产的转化率，以及 MCP 和其他
