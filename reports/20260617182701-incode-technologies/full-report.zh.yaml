      - number: '4.5'
        title: 政府合同与机构收入
        blocks:
          - type: paragraph
            body: >-
              Incode 的联邦收入流在 2025 年末成形。2025 年 11 月，Incode 取得 FedRAMP Ready 状态，扫清美国联邦采购的一项关键前置条件。2025 年 12 月，Incode 作为
              Diamond Capture Associates 的分包商，参与 General Services Administration（GSA）Technology Transformation
              Services（TTS）在 Login.gov Next Generation Identity Proofing Blanket Purchase Agreement（NG BPA）下授予的 $37.4M
              合同。该任务订单覆盖 Login.gov 数字身份平台的 Remote Unsupervised Identity Proofing Solutions，该平台为数百万美国公民接入参与政府服务提供入口。


              $37.4M 总额中 Incode 的份额未单独披露；作为分包商，各方拆分是尽调缺口。即便如此，该合同仍是迄今最具体的美国政府收入证据；已取得的 FedRAMP 授权等级，也支持 2026 年及以后扩展联邦
              pipeline。美国之外，2026 年 5 月 Interac
              独家合作通过加拿大国家支付网络引入准政府渠道，覆盖加拿大市场的政府部门数字身份验证用例。这些机构合同共同建立了多元化公共部门收入基础，降低对私营部门银行和电信客户的依赖。
            claimRefs:
              - CI012
