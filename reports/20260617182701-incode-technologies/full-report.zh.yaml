      - number: '2.4'
        title: 增长驱动因素与监管顺风
        blocks:
          - type: paragraph
            body: >
              四股结构性力量正在扩大身份验证市场。第一，截至 2026 年，AI 生成 deepfake 欺诈三年内增长超过 2,100%；62% 组织在过去 12 个月经历过 deepfake 事件（Gartner
              n=302），deepfake 目前约占身份平台追踪的全球全部欺诈尝试的 7%。全球生物识别身份检查基础设施支出在 2024 年超过 USD 4.8B，驱动力是遵守 FATF 修订 CDD
              要求的紧迫性。第二，监管要求正变得结果导向且更具规定性：FATF 2025 年 10 月更新强调可证明的 KYC 有效性，而非打勾式合规；欧盟 AMLA 自 2025 年 7 月运行，必须在 2026 年 7
              月前交付 RTS；FinCEN 的 CDD Final Rule 要求美国机构执行四支柱 KYC；2024 年全球 AML 执法行动金额超过 USD 4.3B，创纪录新高。第三，LATAM
              数字银行扩张创造结构性需求：Brazil 的 PIX 采用率约 90%，Mexico 数字信贷规模自 2020 年以来增长 900% 至 MX$450B，LATAM 金融科技生态自 2017 年以来增长
              340%。移动技术为 LATAM 经济贡献 USD 600B（占 GDP 8.6%），GSMA 预计到 2030 年达到 USD 700B。第四，Mexico 的 Biometric CURP（2026 年 2
              月）建立国家身份基础设施；分析师估计，数字身份采用可通过减少欺诈和扩大金融包容，把 Mexico GDP 最多抬升 13%。重大约束包括 SME 实施成本高、Mexico 持续偏好现金（MX$500 以下交易
              85%+ 仍为现金）、LATAM 平台间互操作碎片化，以及身份盗窃欺诈损失在 2024 年激增 77% 至 MX$11.3B 所造成的信任缺口。
