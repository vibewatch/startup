      - number: '1.2'
        title: 融资历史、投资者与估值
        blocks:
          - type: paragraph
            body: >-
              Incode 在三轮主要融资中合计筹集约 $260M。2019 年 10 月由 DILA Capital 领投的 $10M Seed，带来第一轮机构背书。2021 年 3 月来自 DN Capital、3L
              Capital 和 Walter Ventures 的 $25M Series A，为美国和 LatAm 扩张提供资金。关键节点是 2021 年 12 月 7 日的 $220M Series B，由
              General Atlantic 和 SoftBank 的 LatAm Vision Fund 共同领投，J.P. Morgan、Capital One Ventures、Coinbase Ventures 和
              SVCI 参投，使公司以 $1.25B 投后估值进入独角兽行列。


              截至 2025 年 11 月，Bloomberg 报道 Incode 正寻求以最高 $3B 估值融资 $150–300M，理由是约 $170M ARR，以及收购 AuthenticID
              和拿下美国政府合同后市场地位扩大。PremierAlts 列出 2026 年市场隐含估值为 $3B，但尚无已完成轮次公开确认。PremierAlts 的累计融资 $407M 与 Tracxn 和
              Crunchbase 报告的 $260M 冲突，留下未披露分批融资或二级交易活动的尽调问题。新一轮仍未确认，构成估值入场点分析的重大缺口。
