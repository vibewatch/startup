  - id: TV005
    title: 论点破裂与终止触发因素表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 轮次以 $1.25B 或更低估值完成
        - 确认估值低于 2021 年 Series B，构成下轮
        - 说明市场不再接受增长叙事；背后很可能是 ARR 或增长未达预期
        - 立即推翻投资论点；完整诊断前避免进一步投入
      - - ARR 增长确认低于同比 25%
        - 审计或独立验证收入显示增长 < 25%
        - 将基准情景倍数降至 8–12x；$3B 进入价结构性偏贵
        - 将合理进入价修正至 ≤12x ARR；取决于 NRR 和利润率数据
      - - 美国政府管线未能转化
        - Login.gov 后 18 个月内没有后续联邦合同
        - 削弱 TAM 扩张故事；政府板块原本是牛市情景关键催化剂
        - 若同时伴随商业增长放缓，从跟踪下调至回避
      - - 主要 IDV 客户转投竞争对手
        - 公开披露流失一家前 5 大银行客户（美国 Tier-1 银行）
        - 说明产品或定价有缺口；集中度风险上升；NRR 可能受损
        - 重新评估竞争护城河和 NRR；熊市情景可能加速
      - - 违反债务契约或被迫重组
        - J.P. Morgan 或 TriplePoint 触发重大不利变化条款
        - 股权价值承压；既有债权可能抹掉新投资人价值
        - 立即退出或回避；重组需要完整股本结构尽调
    notes: 触发因素可通过公开披露监控；内部 KPI 阈值需要数据室访问。
    claimRefs:
      - CV007
      - CV008
      - CV036
      - CV041
      - CV044
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 审计财务
        - 完整 GAAP 审计 P&L 和资产负债表，确认 $170M ARR、毛利率和 NRR
        - 没有审计数字，所有估值倍数都建立在公司口径数据上；任何短缺都会显著重定进入价
        - 要求 FY2024 和 FY2025 四大会计师事务所审计报表，作为 term sheet 条件
      - - 资本结构与债务条款
        - 完整 cap table、2021 年 Series B 的优先权堆栈、JPMorgan 债务条款、TriplePoint 债务条款和偿付顺位 waterfall
        - 两笔债务的既有主张会把净股权价值压到名义 $3B 以下
        - 要求公司法律顾问提供完整 cap table；通过 USPTO 担保权益备案（REEL/FRAME 067887/0333 和 071781/0603）核验
      - - Rule of 40 与运营效率
        - EBITDA 利润率、自由现金流、CAC 回收期和 NRR 数据
        - 这些指标决定 17.6x 是否相对压缩环境仍有支撑；Persona 在 $2B 轮次中可信披露了 Rule of 40
        - 要求 CFO 指标包；与大型企业客户访谈交叉核验
      - - 轮次条款与优先权悬顶
        - 新轮次的清算优先权、反稀释条款、pay-to-play 和下轮保护
        - 条款不利时，除大型 IPO 以外的任何结果都会侵蚀普通股价值
        - 要求 term sheet 和章程修正案；用优先权 waterfall 建模退出情景
      - - 政府合同管线
        - Login.gov 合同以及任何待定联邦授标的完整价值、范围和排他性条款
        - 政府板块是牛市情景的主要催化剂；集中度和续约风险很重要
        - 通过 FOIA（GS-10F 或类似）或公司直接提供，要求合同披露
    notes: 尽调要求按重要性排序；第 1 和第 2 项是任何接近或达到 $3B 投资的门槛条件。
    claimRefs:
      - CV007
      - CV008
      - CV042
      - CV043
      - CV044
