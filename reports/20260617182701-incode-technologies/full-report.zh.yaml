            body: >-
              汇总层面，截至 2025 年末，Incode 每年处理超过 40 亿次身份检查；按 Axis Negocios 访谈，2025 年全球累计完成 70 亿次验证。仅墨西哥在 2025 年就贡献 2,000
              million（20 亿）次验证——这一数字凸显 LATAM 集中度，以及与墨西哥金融机构集成的深度。1% 至 3% 的验证涉及直接欺诈尝试，说明 Incode
              客户群的使用场景风险很高。Incode（私营公司）没有公开披露留存数据，但替代信号非常正面：截至 2025 年 11 月（Winter 2026 徽章周期），G2 上 52 条已验证评论给出满分 5.0/5.0
              平均分，五星率 100%。Incode 在 Winter 2026 报告中获得 19 个 G2 徽章——身份验证 12 个、年龄验证 4 个、反洗钱 3 个——并在中端市场和企业市场均处于领先。Gartner
              在首个 2025 年身份验证魔力象限中把 Incode 认定为领导者，反映企业买方信心。客户评论强调反欺诈质量、集成便利性和响应迅速的支持。轻微负面信号包括：G2 中提到小型运营方成本偏高（3 次提及）、没有既往
              KYC 经验的团队会遇到集成复杂度（2 次提及），以及 2026 年 3 月一条 Gartner Peer Insights 批评性评论称 API「不够
              agnostic」，需要过多客户端决策。公开记录中没有观察到大型企业客户流失；截至 2026 年，持续存在的新闻稿和案例研究显示 Citibanamex、Banorte、Jumeirah 和 MaxBet
              部署仍在运行。
