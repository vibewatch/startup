              Banorte CEO Marcos Ramírez Miguel 确认：「我们让用户可以完全数字化地成为 Banorte 客户，用手机完成，并立即获得一个没有限制的银行账户。」Jumeirah Group
              合作（2021 年 12 月）覆盖中东 4 处豪华酒店物业，部署生物识别入住，入住时间最快达到 1.5 分钟；Jumeirah IT 负责人 Sanjay Sharma
