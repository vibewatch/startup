      - number: '5.6'
        title: 合规、认证与信任
        blocks:
          - type: paragraph
            body: >
              在身份验证提供商中，Incode 维护的合规组合属于最广的一类。截至 2026 年 6 月，其信任中心（trust.incode.com）确认仍有效的认证和鉴证包括：SOC 2 Type
              II（安全性、可用性和保密性控制）、ISO/IEC 27001（信息安全管理）、ISO/IEC 30107-3:2023（与 iBeta 测试方法对齐的生物识别呈现攻击检测）、ISO/IEC
              42001:2023（AI 管理体系）、HIPAA，以及 Kantara Identity Assurance Level 2（IAL2）。2025 年 11 月，Incode 获得 FedRAMP Ready
              的 High Baseline 状态，由 FedRAMP 认可的 3PAO 完成就绪评估，评估结果经 FedRAMP Program Management Office 审阅。该状态让 Incode
              可以争取美国联邦机构合同，并为公司申请完整 FedRAMP Authorization to Operate 铺路。Incode 还与政府 IT 解决方案分销商 Carahsoft
              合作，把其身份平台带入美国公共部门。在 2024 年和 2025 年 Gartner 身份验证魔力象限中，Incode 均被认定为领导者；2024 年版本中，公司在愿景完整性维度位置最靠前。Incode
              的无状态架构选项支持零数据留存，也就是说验证完成后无需存储任何个人可识别信息或生物识别图像，从而回应全球数据最小化和隐私监管要求。
