      - number: '2.3'
        title: 买方分层与采用模式
        blocks:
          - type: paragraph
            body: >
              身份验证解决方案的主要买方可分为五类，各自预算归属和采用触发因素不同。Tier-1 LATAM 商业银行——包括 Incode 客户 BBVA Mexico、Banorte 和 Santander
              Mexico——通过年度 IT 和合规预算采购，驱动力是 AML 要求和降低欺诈成本的 ROI。LATAM neobank 和数字放贷机构，如 Kueski、Clip 和
              Nubank，则通过敏捷工程预算采用，动机是提高入驻转化率和降低流失。Telcel 等电信运营商也是披露的 Incode 客户，它们受监管 SIM
              欺诈要求推动。政府电子平台需要为福利发放和公共服务核验公民身份；Mexico 在 2026 年 2 月推出 Biometric CURP 后，该细分获得新的动力。美国和跨境金融机构面对 FinCEN
              Corporate Transparency Act（CTA）的受益所有权要求，可服务市场向北扩张。Veriff 发布的 LATAM 案例研究覆盖 Kueski、Comun、Solventa 和 Juancho
              te Presta，也印证 LATAM 金融科技需要能在规模化场景下平衡入驻转化和欺诈预防的 IDV 方案。银行预算归 CTO 和 CRO
              角色管理；跨境机构则由合规和法务负责人管理。采用通常由事件触发：监管变化、欺诈激增或新数字产品发布会打开采购周期。
