        title: 市场进入架构与渠道合作
        blocks:
          - type: paragraph
            body: >-
              Incode 的市场进入通过三条主要渠道运转：直销企业客户、渠道 / 经销合作，以及与主要企业软件厂商的平台集成。渠道侧，有记录的伙伴包括 NTT Data（服务金融、医疗和公共部门的全球
              SI）、Carahsoft Technology（面向联邦、州和地方政府的美国公共部门 IT 聚合商）、Optiv（网络安全解决方案集成商）、SHI International（Fortune 1000 IT
              采购）和 Guidepoint Security（企业安全 VAR）。平台集成把 Incode 生物识别引擎带入 Experian 的 Ascend Platform（服务金融服务、汽车、医疗等领域 1,800+
              全球客户）、Temenos（核心银行开户）、HubSpot CRM，以及 Verifone/Digital Check 硬件验证终端。Okta 集成把生物识别员工 IAM
              能力加入企业安全栈。Interac（加拿大借记网络）拥有在加拿大交付 Incode 驱动证件验证的独家权利，目标是在 2026 年第三季度分阶段上线。这套生态策略让 Incode
              能触达仅靠直销拿不下的账户——尤其是美国政府（通过 Carahsoft）和 LATAM 企业（通过 NTT Data 及区域 SI）。FedRAMP Ready 里程碑（2025 年 11 月）与
              Login.gov 合同，共同验证了 Incode 面向美国联邦政府的可销售性。渠道伙伴收入未披露，但生态广度显示间接收入贡献可能有意义。Experian SVP Marika Vilen
