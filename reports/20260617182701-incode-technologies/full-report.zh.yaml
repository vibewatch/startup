        title: 主要竞争对手画像
        blocks:
          - type: paragraph
            body: >-
              Jumio 是 PE 支持的 IDV 领导者，每秒处理 120 笔交易，覆盖 5,000+ 证件类型，拥有 300+ 项专利，并以 30M+ 已知身份的 Identity Graph
              支撑持续欺诈情报。Entrust/Onfido 由 Entrust 2024 年 4 月收购 Onfido 组成，提供最广的身份中心安全组合：AI 驱动活体、覆盖 195 个国家的 2,500
              种证件、无代码工作流编排，以及收购时 1,200+ 全球客户和 $140M+ 年收入装机基础。Sumsub 是主要 Leaders 中融资最少者，但在 Gartner Completeness of
              Vision（2025）领先，覆盖 14,000+ 证件类型、端到端 AML/KYC/交易监测，以及 20+ 国家合规的非证件验证，最快 4.5 秒完成。Veriff 每次会话分析 1,000+ 信号，平均 6
              秒出决策，覆盖 230+ 国家和 12,500+ 政府证件，背后有 $192M+ 融资和 $1.5B 估值。Persona 以 $2B 估值完成 $200M Series D（2025 年 4 月），在 2025
              Gartner MQ 中拥有最高 Ability to Execute；2024 年处理 300M+ 次验证，收入和客户数同比翻倍。Socure 以 2026 年 Q1 $340M+ ARR（同比
              +62%）、$4.5B 估值、134% 净美元留存、美国前 20 大银行中的 18 家，以及 FedRAMP 授权 AI 决策平台（RiskOS）主导美国市场。AU10TIX 对每个身份执行 180+
              自动检查，并在 60+ 公司间运营联盟欺诈检测，已认证 1B+ 身份并阻止超过 $24B 欺诈。iProov 是全球首家独立认证的 deepfake 韧性被动活体供应商（CEN/TS 18099 High +
              Ingenium Level 4），但不提供证件验证，因此更像互补供应商而非全栈竞争者。Mitek（NASDAQ: MITK）服务 7,000+ 组织，2026 年 1 月被 Datos Insights 评为
              Market Leader，其 Fraud and Identity Solutions 分部在 FY26 Q1 同比增长 30%。Trulioo 以全球数据广度领先——450+ 数据源、195 个国家、5B+
              可触达消费者——但缺少生物识别和活体能力。IDEMIA Public Security 和 Thales 运营政府级身份项目（分别覆盖 600+ 机构和 115+ 国家），竞争于高保证政府层级，而非商业 SaaS
