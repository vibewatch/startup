      - number: '4.3'
        title: 资本充足性与融资画像
        blocks:
          - type: paragraph
            body: >-
              公司概览章节记录了完整融资时间线。概括而言：Incode 完成 $10M Seed（2019 年 10 月，DILA Capital）、$25M Series A（2021 年 3 月，DN Capital /
              3L Capital / Walter Ventures），以及 $220M Series B（2021 年 12 月，General Atlantic 和 SoftBank LatAm Vision Fund
              共同领投，J.P. Morgan、Capital One Ventures、Coinbase Ventures 和 SVCI 参投）。确认累计融资约 $255M（$10M + $25M +
              $220M）。Tracxn 独立报告累计融资 $260M，与三轮披露融资接近。PremierAlts 列出冲突的 $407M——这是重大差异，公开资料没有解释，可能反映未披露分批融资、债务工具或二级交易。


              2025 年 11 月，Bloomberg 报道 Incode 正初步洽谈以最高 $3B 隐含估值融资 $150M–$300M。二级数据库 Gaebler（来源为 VentureDeal）记录，2025 年 11
              月 20 日有一轮 $300M 融资已「secured」，并称 General Atlantic、Capital One 和 Coinbase Ventures 为支持方。尚未找到正式新闻稿或 SEC Form
              D 文件确认该轮已关闭；Bloomberg 原始报道使用的是「in talks」和「preliminary」措辞。这个冲突很重要：如果该轮如 Gaebler 所述已关闭，Incode 累计融资升至约
              $555M，$3B 估值可能已落定；如果仍未关闭，资本充足性更不确定。


              截至 2021 年 Series B，公司约融资 $255M，距今已过四年多；核心资本充足性问题，是月度现金消耗相对 Series B 剩余余额的水平。公开资料没有现金头寸、烧钱率或 runway 数字。强劲
              ARR 增长轨迹暗示，如果业务接近现金流盈亏平衡，对烧钱的依赖会下降，但尚无这类确认。
