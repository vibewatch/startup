      - number: '8.3'
        title: 牛、基准与熊估值情景
        blocks:
          - type: paragraph
            body: >-
              三个情景用不同 ARR 增长、倍数和退出路径假设，框定结果区间。牛市情景下，Incode 继续保持 40%+ 增长，到 2027 年达到 $250–300 million ARR，借 $37.4M
              Login.gov 奖项（及后续订单）拿下大型美国联邦政府合同，IPO 条件按 12–14x 远期 ARR 重新打开——对应 $3.5–4.5 billion 企业价值，并支撑 $3B
              进入价格。这需要多个相互依赖的催化剂：增长持续高于同业中位数、经审计财务验证当前 ARR，以及自 2022 年以来基本关闭的私营 SaaS IPO 窗口重新开启。基准情景下，增长正常化至 20–30% YoY，到
              2027 年 ARR 达到 $200–220M，公司按 12–16x ARR 区间定价一轮融资——与 Persona 2025 年 4 月可比一致——隐含 $2.4–3.2B 估值。当前 $3B
              要价位于基准区间高端，但若近期执行保持，并非不可达到。熊市情景下，增长放缓至 15% 以下（行业宏观压缩），公开 SaaS 倍数停留在 3–5x，M&A 收购方按 5–8x ARR 给退出定价，隐含
              $0.9–1.5B 估值——可能低于 2021 年 $1.25B 标记，形成折价轮。熊市情景并非小概率，原因是：（a）该轮尚未关闭；（b）ARR
              是公司声称且未经审计；（c）若公司需要重组，债权人（JPMorgan、TriplePoint）拥有优先请求权。
            claimRefs:
