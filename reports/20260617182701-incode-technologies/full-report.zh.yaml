  - id: TV004
    title: 牛 / 基准 / 熊情景表
    columns:
      - 情景
      - 核心假设
      - 示例估值区间（USD）
      - 概率信号
      - 关键下行触发因素
    rows:
      - - 牛
        - ARR 到 2027 年维持 40%+ 增长，达到 $250–300M；美国政府管线转化；IPO 窗口以 12–14x 远期 ARR 重新打开；轮次以 $3B 完成且优先权条款干净
        - $3.5B–$4.5B
        - 低至中；需要多个催化剂同时兑现，并拿出审计财务
        - 增长放缓至 25% 以下，轮次低于 $3B 完成，或 IPO 窗口持续关闭
      - - 基准
        - ARR 到 2027 年同比增长 20–30%，达到 $200–220M；轮次以 12–16x ARR 完成，与 Persona 可比公司一致；银行 / 电信客户继续留存；没有重大竞争流失
        - $2.4B–$3.2B
        - 中；最符合现有可比证据；$3B 是该区间上沿
        - ARR 未达预期或 NRR 低于 100%；宏观倍数压缩延续；轮次推迟到 2026 年以后
      - - 熊
        - ARR 增长放缓至 15% 以下；公开 SaaS 倍数维持在压缩后的 3–5x；战略收购方按 5–8x 退出倍数定价；轮次未完成或以下轮估值完成
        - $0.9B–$1.5B
        - 考虑公司当前势头为低至中，但宏观逆风下并非可以忽略
        - 轮次失败或低于 $1.25B 完成；收入增长明显落空；触发债务契约
    notes: 估值区间是分析师基于公开证据和可比数据得出的估计；不是管理层指引，也不是投资建议。
