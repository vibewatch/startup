      - number: '5.2'
        title: 核心生物识别技术栈
        blocks:
          - type: paragraph
            body: >
              Incode 的生物识别引擎由三根支柱构成：人脸识别、活体检测和证件验证。人脸识别上，自研深度学习模型把现场自拍与身份证件照片或政府生物识别数据库比对，人脸匹配在 20 毫秒内完成，公司声称误匹配率为
              0.01%。在 2024 年 NIST 人脸识别技术评测（FRTE）1:N 识别测试中，Incode 在 Visa-Border、Mugshot-Webcam、Visa-Kiosk
              等多个图库类型上，位列所有全方案身份验证提供商第一；测试覆盖 160 万名身份主体，误报识别率阈值为 0.003。活体检测支持主动模式（提示用户完成动作）和被动模式（全自动）。公司称，其被动活体系统是全球首个通过
              iBeta ISO 30107-3 Level 2 评测的系统；该测试覆盖 3D 面具、AI 生成 deepfake 等高级欺骗攻击。证件验证使用自研 OCR，Incode 称其在竞争测试中比开源替代方案准确
              25%，并结合 NFC 芯片读取电子护照和其他生物识别证件。平台通过 AAMVA 驾照数据验证（DLDV）和州 DMV 连接，支持直接接入政府记录系统（GSOR），从而对权威签发源做确定性的实时凭证核验。
