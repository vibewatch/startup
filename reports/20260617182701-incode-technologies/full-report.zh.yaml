      - number: '7.4'
        title: 运营、基础设施与执行风险
        blocks:
          - type: paragraph
            body: >-
              Incode 的运营风险主要来自三者交汇：对数字基础设施的依赖、快速地域扩张，以及在碎片化监管制度中扩展合规运营的难度。

              云基础设施集中度是任何 SaaS 身份平台都天然存在的问题。Incode 依赖公有云（主要是 AWS）提供计算、存储和全球低延迟交付。任何重大 AWS 故障、价格变化或服务等级违约，都会直接影响 Incode
              服务实时银行开户流程的能力——这是任务关键工作流，哪怕停机几分钟，也可能让金融客户损失数百万。Incode 的 FedRAMP Ready 状态（2025 年 11 月获得）打开了美国联邦合同入口，但尚未达到
              FedRAMP Authorized，这限制了最敏感联邦机构部署，并形成多年采购周期。

              MetaMap 和 AuthenticID 收购带来整合和文化风险。三家 AI
              工程组织拥有不同技术栈、合规历史和地域足迹，同时整合在运营上要求很高。整合窗口期内，任何生物识别数据泄漏、系统错误或客户支持失败，都可能在 Incode 正试图证明 $3B 估值合理性时损害其品牌。

              LATAM 执行风险包括墨西哥和更广区域的数字欺诈；据报告数据，仅 2024 年损失就超过 14,500 million MXN。Incode
              在这种环境中服务金融机构，欺诈一旦漏过，公司就承担声誉风险；若服务等级承诺未达成，还承担合同风险。ACLU 和 EFF 曾把生物识别监控广泛描述为容易出现系统性错误，并伴随种族和人口统计差异；如果 Incode
              技术与高曝光失败相关联，就会产生倡导组织和媒体风险。
