            title: 分析机构市场规模估算相差约 USD 3B——规模不确定性重大
            body: >
              六家分析机构给出的 2026 年全球 IDV 市场估算从 USD 14.1B 到 USD 17.3B 不等，跨度
              23%，反映核心身份验证、相邻欺诈预防和开放银行认证层之间确有范围模糊。投资者和运营者不应把任何单一分析师数字视作权威 TAM；更稳妥的工作假设，是共识中点（约 USD 16B）加 ±USD 1.5B 置信区间。
