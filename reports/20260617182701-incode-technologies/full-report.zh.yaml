      - number: '3.5'
        title: 护城河耐久性与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Incode 的竞争护城河来自 LATAM 客户锁定、基于区域数据训练的专有生物识别模型，以及能减少银行管理供应商数量的端到端平台。多项风险威胁耐久性。资金更雄厚的竞争者——Persona（累计融资
              $418M）、Socure（$650–$744M）、Trulioo（$477M）——可能大幅增加 LATAM 市场投入，利用更大资产负债表补贴获客。平台趋同正在加速：Sumsub 在 Gartner 2025
              Completeness of Vision 上进步最远，Socure 62% ARR 增长也显示强劲全球扩张野心。商品化是真实威胁：AI
              成本下降正在压缩每次验证经济性，降低进入门槛，并挤压全行业单笔交易利润率。iProov 的 CEN/TS 18099 High 活体认证可能成为采购标准，所有生物识别供应商——包括
              Incode——都必须匹配。企业 IDV 多供应商并用很常见：采购团队常部署 2–3 家供应商覆盖区域证件缺口，限制 Incode 在 Jumio 或 Entrust
              已经深嵌市场中替换既有供应商的能力。缺乏独立审计财务报表，限制投资者验证 Incode $170M ARR
              声明、利润率结构和客户集中度，是一个重要尽调缺口。下方护城河耐久性登记表把每条护城河主张映射到主要威胁、严重度和尽调路径。
