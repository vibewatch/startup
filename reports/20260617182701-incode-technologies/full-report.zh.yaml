    title: 正方 / 反方论点表
    columns:
      - 支柱
      - 看多论点
      - 反方论点
      - 什么会改变判断
    rows:
      - - 增长与 ARR 轨迹
        - 2024 年同比增长 80%、ARR 达 $170M、处理 4.1B 次核验，说明需求有韧性
        - 收入来自公司口径且未经审计；增长放缓程度未披露
        - 审计财务确认 ARR 超过 $170M，且 NRR 保持稳定
      - - 客户证明与市场位置
        - 美国前 10 大银行中的 8 家、北美前 9 大电信运营商中的 8 家；全球首个 iBeta Level 3
        - 过度集中在拉美 / 银行业；政府管线尚未规模化验证
        - 披露美国联邦合同预订额，企业 NRR 高于 115%
      - - 估值进入价格
        - $3B / $170M ARR = 17.6x；Persona（2025 年 4 月 14.2x）和 Socure（2021 年 60x）给出区间边界；对一家高溢价成长公司而言，$3B 仍在可解释范围内
        - 17.6x 是公开 SaaS 中位数（3.4x）的 5x；M&A 可比公司 Onfido 以 4.6x 退出
        - 按低于 $3B 的披露条款确认轮次完成，并明确优先权 / 债务
      - - 债务与资本结构
        - 拿到 JPMorgan 和 TriplePoint 债务，显示机构信贷认可
