      - number: '5.4'
        title: 反欺诈与 Deepfake 防御
        blocks:
          - type: paragraph
            body: >
              Incode 的 Deepsight 是公司的多层 deepfake 防御系统。Purdue Machine Learning Lab 主任、助理教授 Shu Hu 做过一项独立基准，评估 9 个主要商业
              deepfake 检测系统；结果显示，Incode 检测器准确率最高，相比次优商业系统，误报率好 68 倍，误接受率低 2.5 倍。Deepsight 覆盖四个攻击面：（1）通过原生 SDK
              防止注入攻击，在采集开始前阻断虚拟摄像头和设备模拟；（2）在感知层分析生物识别信号，包括模糊度、虹膜呈现、光线反射和纹理异常，以识别合成图像和视频；（3）与政府记录系统做确定性核验，提供权威交叉检查；（4）依靠
              Incode 内部研发团队和 Fraud Lab 持续重训模型。平台可检测一整套攻击类型：2D 面具、3D 硅胶面具、纸质打印件、视频回放、换脸、脸部变形、2D AI 合成素材，以及人脸重演视频。互补产品
              Risk AI Agent 在会话层做整体欺诈决策，它把所有风险信号放在上下文中评估，不需要手工配置阈值，并会自动适配每个客户自身的欺诈和转化模式。Incode 报告称，截至 2026
              年中之前的三年里，deepfake 欺诈尝试激增 21 倍，这是推动上述能力的重要市场因素。
            claimRefs:
              - CE012
              - CE016
              - CE029
              - CE030
              - CE031
              - CE040
      - number: '5.5'
        title: 开发者集成与 SDK 生态
        blocks:
          - type: paragraph
            body: >
              Incode 提供覆盖 Web、移动端和服务器环境的完整开发者集成面。Web SDK 以 @incodetech/welcome 名称发布在 npm 上；截至 2026 年 6 月，版本已到
              1.90.0，累计发布版本超过 2,128 个。该 SDK 兼容 TypeScript，提供三类方法：配置与初始化、数据采集（基于摄像头的证件和自拍采集），以及流程数据方法（证件验证、Face Match
              和政府验证调用）。移动端方面，Incode 提供 Android 原生 SDK（最低 API level 23，覆盖 98.4% 的 Android 设备）和 iOS 原生 SDK（最低 iOS 13，覆盖
              99.6% 的 iOS 设备）。React Native 包（@incode-sdks/react-native-incode-sdk）支持可选 NFC、Face Login 和视频通话变体。iOS 依赖通过私有
              GitHub Packages registry 分发，需要凭证访问。示例集成仓库公开维护在 github.com/Incode-Technologies-Example-Repos，包括一个展示核心开户流程的
              Next.js 示例。developer.incode.com 开发者中心提供结构化文档，覆盖完整 SDK 集成、低代码和无代码路径、API 参考，以及按语言划分的快速开始。所有集成都必须在 HTTPS
              上运行，会话 token 必须由服务器端管理，以保护 API key。Web SDK 明确不支持 Webview 和社交媒体应用内浏览器。
