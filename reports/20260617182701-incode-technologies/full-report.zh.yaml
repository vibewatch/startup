  - id: TE001
    title: Incode 平台产品模块与资产矩阵
    columns:
      - 模块 / 产品
      - 用户分部
      - 成熟度 / 状态
      - 核心差异化
      - 尽调缺口
    rows:
      - - Incode Omni（编排平台）
        - 企业 B2B、金融服务、政府
        - GA — 全量可用，规模化生产运行
        - 在一个仪表盘里统一无代码流程构建器、实时案件管理和欺诈分析
        - 具体 SLA 条款、正常运行时间历史和多区域架构未公开披露
      - - Facial Recognition 模块
        - 客户开户、重新验证、KYC
        - GA — 20ms 匹配，0.01% 误匹配率
        - NIST FRTE 2024 全方案 IDV 提供商第 1；自研模型，并声称具有人口统计公平性
        - 未发布独立人口统计偏差审计；自报 99% 成功率需要第三方旁证
      - - Liveness Detection（被动 + 主动）
        - 消费者和企业身份检查
        - GA — 全球首个 iBeta Level 2 ISO 30107-3 认证
        - 被动优先设计在降低摩擦的同时检测 2D / 3D 面具、视频重放、深度伪造和人脸重演
        - 具体活体数据集上的 0% APCER 基准 — 数据集范围和测试方法未获独立审计
      - - Document Verification + OCR
        - 开户、KYC、电子护照、证件检查
        - GA — 在中等严重程度下检测出 99.65% 合成 ID 欺诈
        - 专有 OCR 比开源方案准确 25%；支持电子护照 NFC 芯片读取；Deepsight 处理 AI 生成文档
        - 对罕见证件格式和特定国家模板的覆盖未公开量化
      - - Incode Workforce（KYE）
        - 企业 HR、IT 帮助台、IAM 团队
        - GA — 深度集成 IAM、HR、ITSM 工具
        - 在员工全生命周期绑定生物特征；拦截深度伪造候选人、帮助台冒充和 SIM-swap 攻击
        - 企业 HR 集成的合同条款和定价未公开；客户留存指标不可得
      - - Deepsight（深度伪造防御）
        - 金融服务、游戏、政府
        - GA — 多层注入 + 感知 + GSOR 防御
        - Purdue 基准：FPR 比次优商业系统好 68x；误接受率低 2.5x
        - Purdue 研究的基准样本量和测试条件未公开详细说明；无正式 NIST PAD 发布
      - - Agentic Identity
        - 部署自主 AI agent 的企业
        - 试点 — 2025 年 Q4 早期访问，2026 年推出
        - 通过加密范围 token 为 AI agent 提供率先上市的生物特征绑定；持续行为监控
        - 截至 2026 年 6 月，商业可用性、定价和生产规模案例研究尚未公开
      - - Risk AI Agent
        - 所有使用验证的企业
        - GA — 无需手动阈值规则即可自适应决策
        - 评估完整会话上下文；减少误拒，同时拦截更多欺诈；部署后无需调参
        - 模型更新节奏和版本控制治理未披露；未确认客户专属模型隔离
    notes: 产品状态基于截至 2026-06-17 的 Incode 官方产品页（incode.com）、开发者文档和新闻稿。Agentic Identity 状态来自 2025 年 Q4 BusinessWire 公告。
