      - number: '3.3'
        title: 能力与定价对比
        blocks:
          - type: paragraph
            body: >-
              证件验证深度、被动活体认证、AML / 观察名单筛查、无代码工作流编排，以及 LATAM 特定证件支持，是企业 IDV 买方评估 Incode 及同业时的主要采购标准。功能矩阵表基于抓取的产品页面和公开文档，用
              Yes / Partial / No / Unknown 标识展示主要供应商在这些维度上的表现。Sumsub 和 Entrust/Onfido 在 AML 覆盖和无代码编排广度上领先。Persona
              在模块化工作流可定制性和 agentic AI 编排上领先，为企业合规团队提供最深配置能力。Socure 在预测性欺诈评分和美国身份网络数据深度上领先。Incode 在 LATAM 证件覆盖和区域 ID
              格式生物识别准确率上领先，并拥有面向拉丁美洲常见低连接移动环境打造的专有被动活体。iProov 是独立认证等级最高的活体供应商，但不提供证件验证，买方需要再集成第二家供应商。Trulioo
              在全球数据覆盖上领先，但完全缺乏生物识别和活体能力。定价方面，少数供应商公开费率。Sumsub 是例外，公布每次验证 $1.35–$1.85（基础 / 合规层级）。Veriff 估计在规模化后为
              $1.50–$3+。Jumio、Socure 和 Entrust 采用定制企业合同，没有公开标价。Incode 未公开定价。能力图按五个竞争维度，对六家关键供应商进行评分比较。
