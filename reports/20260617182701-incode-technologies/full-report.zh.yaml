      - number: '8.5'
        title: 退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              Incode 尚未上市，也没有披露 IPO 时间表。公司的强劲收入增长、头部客户基础和政府合同斩获，都是未来具备公开市场准备度的正面信号，但若干结构性前提仍缺位。第一，公开渠道没有审计财务报表，无法独立验证
              $170M ARR 和 80% 增长的说法。第二，2021 年 Series B 的优先权堆栈，加上 2024 年 J.P. Morgan 和 2025 年 TriplePoint
              债务义务，形成复杂资本结构，未来 S-1 文件可能需要大量披露。第三，Rule of 40 指标、NRR、毛利率和 CAC 回收期——IPO
              投资者和后期买家最看重的关键输入——全部未披露。缺少这些指标，很难高置信度承销 $3B 要价。


              最可信的退出路径，是被大型企业安全玩家（Entrust、Microsoft、Ping Identity/Thales 或支付网络）战略收购，或由后期私募买断。Onfido 先例（4.6x
              ARR）显示，该细分市场的并购退出倍数较成长期融资倍数有显著折价。IPO 需要审计财务、明确的盈利路径，以及偏好 SaaS 的 IPO 窗口；这些条件自 2022 年以来只间歇出现。
