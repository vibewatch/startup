      - number: '7.2'
        title: 技术风险——Deepfake、活体欺骗与准确性偏差
        blocks:
          - type: paragraph
            body: >-
              Incode 的核心价值主张是生物识别准确性和反欺诈，因此任何削弱准确性的技术风险，都会对客户信心构成生存级威胁。两类风险最突出：生成式 AI 呈现攻击，以及人脸识别中的人口统计准确性偏差。

              Deepfake 和合成身份欺诈以异常速度增长。2021 至 2023 年间，用于绕过生物识别活体检查的 deepfake 攻击激增 700%+；到 2025 年，注入攻击——欺诈者用预渲染 deepfake
              视频替换实时摄像头画面——同比上升 40%。2023 年，全球合成身份欺诈损失超过 $35 billion。2025 年一项覆盖 408 名专业人士的 arXiv
              调查发现一个鲜明悖论：公众因便利而信任生物识别，但专家对人脸和语音等静态模态被欺骗表达了「严重担忧」。人工审核员正确识别高质量 AI 生成假证件的概率只有约 50%，意味着 AI 辅助检测已不再可选。Incode
              每年处理 41 亿次身份检查，即使绕过率很小，也代表数百万次欺诈开户，可能伤害银行客户并触发合同责任。

              NIST FRVT 数据（最后更新于 2025 年 3 月）确认，所有提交算法的人脸识别错误率中，人口统计差异仍然存在。深肤色人群在弱光条件下的假阴性率（同一人匹配失败）更高——这正是 LATAM
              移动开户流程中常见的条件。假阳性差异（错误匹配）也会随年龄、性别和种族变化。这些差异会在反歧视法下制造监管风险（FTC 已把偏差列为核心关注点）、诉讼风险，以及系统大规模部署后产生差别化结果时的声誉风险。

              Deepfake 生成器和活体检测器之间的军备竞赛正在加速。Incode 已投入被动活体和 agentic AI 检测，但 deepfake 技术生态已经民主化：工具最低只要
              $20，Fraud-as-a-Service 平台可大规模分发即用型欺骗套件。要让检测准确性跑在威胁曲线前面，公司必须持续投入研发，且永远不能宣布问题永久解决。
