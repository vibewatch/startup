        - 向 CFO 要求分部毛利率明细；区分 API 费用与专业服务
      - - 净收入留存（NRR）
        - 企业 B2B 中产品粘性和增购健康度的首要信号
        - 大客户品牌强（头部银行 / 电信）并不等于 NRR 高，除非有数据
        - 要求按 vintage 年份（2019–2024）披露 cohort 级 NRR
      - - 月度烧钱率和 runway
        - 判断 2025 年 11 月融资是被现金需求驱动，还是增长机会驱动
