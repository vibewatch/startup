      - number: '5.3'
        title: AI/ML 模型基础设施
        blocks:
          - type: paragraph
            body: >
              Incode 技术差异化的核心，是一座内部机器学习工厂。机器学习工程副总裁 Alex Golunov 公开表示，Incode 运行超过 100 个自研机器学习模型，用来认证每一次开户会话；这些模型基于超过
              10TB 的自有数据集训练，覆盖数亿个数据点，包括图像、视频、结构化文本和表格数据。Incode 用 ClearML 的 MLOps 平台管理该基础设施，通过自动扩缩容，在 AWS EC2 实例和本地 GPU
              硬件之间动态分配 GPU。最新一代模型包括：基于 200 多个地区的全球身份和证件数据训练的视觉语言模型（VLM），可用少样本适配新的攻击类型和未见过的证件格式；基于自有欺诈数据集、行为序列和设备信号训练的
              Fraud LLM；以及用于风险情报的 Reasoning Agents。VLM 在生产基准中已经展现关键性能提升：假证检测错误减少 67%，证件篡改准确率提升 4%，签名欺诈检测错误减少 25%，训练周期约快
              80%，并在一个高难度活体基准数据集上实现 0% 攻击呈现分类错误率（APCER）。Incode 还运营专门的内部 Fraud Lab，配备 35 个以上聚焦证件和生物识别欺诈模式的专用 AI 模型，并持续用
              Incode 客户部署网络中的真实世界数据训练。
