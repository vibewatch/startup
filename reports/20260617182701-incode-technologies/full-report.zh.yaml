      - number: '2.2'
        title: 市场规模：TAM、SAM 与估算不确定性
        blocks:
          - type: paragraph
            body: >
              分析机构对 2026 年全球身份验证市场的估算，从 Future Market Insights 的 USD 14.1B 到 Business Research Company 的 USD 17.3B
              不等；CAGR 预测随市场范围不同，在 11% 到 17% 之间。Mordor Intelligence 采用较保守口径，把 2026 年市场规模估为 USD 15.78B，并预计到 2031 年 CAGR 为
              11.18%。Grand View Research 预测更宽口径的数字身份解决方案市场，到 2030 年达到 USD 33.93B，2023 年起 CAGR 为 16.7%。Market Research
              Future 于 2026 年 6 月 17 日更新，给出的 2026 年数字为 USD 16.89B，并预计到 2035 年 CAGR 为
              12.18%。估算差异反映范围差异——有些机构只纳入核心证件和生物识别解决方案，另一些则把相邻欺诈分析和开放银行认证层也计入。IMARC Group 估算，仅 e-KYC 子细分在 2025 年价值 USD
              948.8M，到 2034 年 CAGR 为 16.35%。在全球市场内，BFSI 仍保有约 32–33% 收入份额，意味着 2026 年金融服务 SAM 约为 USD 5B。没有主要分析机构发布独立的
              LATAM-only 身份验证市场规模；区域 SAM 估算必须把 LATAM 金融科技 / 银行市场份额代理套用到全球 TAM 上——这是一个重要证据缺口，限制了精确 SOM 计算。
