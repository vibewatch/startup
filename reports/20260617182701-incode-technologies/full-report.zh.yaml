chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Incode Technologies, Inc. 由 Ricardo Amper 于 2015 年 6 月 17 日在 California 州 San Francisco 创立，公司总部仍位于 101
              Mission Street, Suite 900，并在 Mexico City 和 Belgrade 设有办公室。Incode 的核心使命是借助 AI
              驱动的生物识别身份验证，支撑一个可信世界；企业可用人脸识别、活体检测、证件分析和光学字符识别，覆盖完整身份生命周期——客户入驻（KYC/AML 合规）、持续认证和欺诈预防。


              公司采用 B2B SaaS 模式，服务金融服务、电信、政府、医疗、酒店和电商行业，通过企业软件许可和 API 用量变现。Incode 最初是一款消费者照片分享应用；2018 年，管理层看到更大的市场机会后，转向
              AI 生物识别身份。COVID-19 随后在全球推高数字入驻需求，这次转型踩准了时间点。


              Incode 获得多项重要独立认可：Gartner 在首份 Identity Verification Magic Quadrant 中将其评为 Leader；它在 NIST
              多个人脸识别准确率类别中位列前十；也是全球首家在 iOS 和 Android 上以零错误获得 iBeta Level 3 被动活体检测认证的供应商。合规资质包括 SOC 2 Type II、ISO/IEC
              27001、ISO/IEC 30107-3 对齐和 Kantara IAL2，直接支撑受监管的政府和企业垂直场景。
