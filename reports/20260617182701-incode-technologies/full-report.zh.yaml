  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现机制
        blocks:
          - type: paragraph
            body: >-
              Incode 的收入架构是 B2B SaaS 模式，靠分层企业合同把身份验证量变现。核心机制是按用量计费的 API
              模式——企业客户按处理的每次验证「check」付费，量级更高时阶梯价格降低单价。合同通常是年度或多年承诺，并设最低年度支出门槛，从而锚定驱动 ARR
              的经常性收入基础。公司不公布标价；所有交易都由直销完成，并根据预计验证量、功能范围（活体、证件验证、KYC/AML 编排、deepfake 检测）和集成复杂度定制报价。


              Incode 横跨三条产品线：Incode Smile（银行、支付、零售——数字入驻和认证）、Incode Guard（执法和实体安全，通过智能眼镜和执法记录仪），以及一款消费者照片分享产品（Flashback
              / 转型前遗留）。企业身份平台贡献主要收入，Incode Smile 支撑 BBVA 和 Banorte 等金融服务与电信客户。2025 年 11 月取得 FedRAMP Ready 认证、2025 年 12
              月获得 $37.4M Login.gov 分包后，政府身份核验成为独立且增长中的收入流。Interac 加拿大独家合作（2026 年 5 月，2026 年 Q3 推出）增加了伙伴中介渠道，把 Incode
              的活体和 deepfake 检测技术许可给加拿大金融机构。这些收入流之间的收入结构未公开披露。
