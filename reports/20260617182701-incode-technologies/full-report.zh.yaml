  - id: FE001
    title: Incode 平台架构栈
    type: stack
    layout: standard
    summary: |
      Incode 平台是六层栈：顶部是面向用户的无代码体验，底部是权威政府与外部数据源；所有生物识别和证件处理都经过专有 AI/ML 模型层。
    data:
      layers:
        - label: 体验与封装
          detail: 无代码工作流构建器（拖拽式）、品牌化 UI 定制、用于自定义集成的 Web SDK 和移动 SDK；Incode Omni 仪表盘负责案件管理和欺诈分析
        - label: 产品套件与用例模块
          detail: >-
            Incode Omni（KYC/AML 编排）、Incode Workforce（KYE）、Deepsight（深度伪造防御）、Agentic Identity（AI agent 验证）、Risk AI
            Agent（自适应整体决策）
        - label: 核心生物识别与证件验证
          detail: 人脸识别（20ms，0.01% 错配率）、活体检测（被动 + 主动，iBeta Level 2）、证件 OCR（比开源方案好 25%）、NFC 电子护照芯片读取
        - label: 专有 AI/ML 模型层
          detail: >-
            100+ 个 ML 模型在 10TB+ 数据集上训练；Vision-Language Model（200+ 地区）、Fraud LLM（行为 / 设备信号）、Reasoning Agents；内部 Fraud Lab
            拥有 35+ 个专用模型
        - label: 开发者集成与安全层
          detail: >-
            Web SDK（@incodetech/welcome npm，2,128+ 版本）、Android/iOS/React Native/Flutter SDK；要求 HTTPS；服务端会话令牌管理；原生 SDK
            阻断注入
        - label: 权威与外部数据层
          detail: 连接 AAMVA DLDV 和州 DMV，用于实时证件验证；政府 System of Record（GSOR）用于确定性交叉核验；NIST FRTE 评测基准
    claimRefs:
      - CE003
      - CE005
      - CE007
      - CE008
      - CE010
      - CE013
      - CE014
      - CE028
      - CE032
      - CE033
      - CE042
  - id: FE002
    title: 客户身份验证工作流（Incode Omni）
    type: flow
    layout: standard
    summary: |
      标准 Incode Omni 验证旅程从用户发起采集开始，经过多层 AI 处理，可选升级到 GSOR 确定性核验，最后实时给出通过 / 复核 / 拒绝决定——除非升级，否则无需人工审证。
    data:
      nodes:
        - id: n1
          label: 用户发起验证
          detail: 用户通过 Web SDK、移动 App 或嵌入链接打开验证流程；无需创建账户或下载 App
        - id: n2
          label: 证件采集与 OCR
          detail: 用户拍摄政府签发 ID 或通过 NFC 读取；专有 OCR 提取并校验证件字段；AI 检测合成或篡改证件
        - id: n3
          label: 带活体检测的自拍采集
          detail: 设备摄像头采集实时自拍；被动活体 AI 检查深度伪造、面具和视频重放，无需用户动作提示（主动模式可选）
        - id: n4
          label: 生物识别人脸匹配
          detail: 人脸识别模型将自拍与 ID 照片或 GSOR 生物识别记录比对；20ms 完成匹配，错配率 0.01%
        - id: n5
          label: 深度伪造与注入检测
          detail: Deepsight 层检查设备完整性、分析感知信号，并与 GSOR 交叉验证，以阻断 AI 注入内容
        - id: n6
          label: Risk AI Agent 整体评分
          detail: 在上下文中汇总所有会话信号（设备、行为、生物识别、证件）；批准边界会话或标记复核，无需人工阈值规则
        - id: n7
          label: GSOR 确定性验证（可选）
          detail: 对高保证验证实时查询 AAMVA DLDV 或州 DMV；不再依赖肉眼证件检查
        - id: n8
          label: 实时通过 / 复核 / 拒绝
          detail: 编排层即时出具决定；获批用户立即继续；只有真正的边缘案例进入复核队列
        - id: n9
          label: 持续监控与重新验证
          detail: 在关键生命周期节点（帮助台、MFA 重置、高价值交易）继续用已存生物识别档案做身份检查
