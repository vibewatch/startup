      - number: '3.4'
        title: Incode 差异化与定位
        blocks:
          - type: paragraph
            body: >-
              Incode 在三个持久向量上区别于竞争者。第一，LATAM-first 身份基础设施：没有 Gartner Leader 竞争者建立了可比的 LATAM 产品深度和分销能力。拉丁美洲领先数字金融服务平台
              Bitso 选择 Incode 作为 Mexico、Argentina、Colombia 和 Brazil 的区域身份基础设施伙伴，理由是 Incode 能在不牺牲安全性的前提下交付无缝体验。Socure（美国前
              20 大银行中的 18 家）和 Persona（客户以 OpenAI、LinkedIn、Block 为代表）等美国中心竞争者，主要服务美国和全球北方金融科技；其 LATAM 证件支持和区域合规集成落后于
              Incode。第二，端到端编排：2025 年 Gartner 认可强调，Incode 与权威生物识别签发源的深度连接，以及用于证件评估的视觉语言模型，是差异化创新，把 Incode 从点解决方案推入 Leader
              平台类别。第三，带 deepfake 防御的专有被动活体：Incode 每年处理 7B+ 次身份验证，并观察到自动化 AI 驱动攻击从 2024 年检出欺诈的 3% 升至最近一个季度的 40%，凸显其活体和
              deepfake 防御投资的紧迫性。虽然 iProov 拥有最高独立活体认证（CEN/TS 18099 High），但 iProov 需要单独的证件验证供应商；Incode 的一体化单平台做法，降低了 LATAM
              银行和金融科技规模化部署的运营复杂度。
