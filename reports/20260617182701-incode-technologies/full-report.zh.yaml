          tone: positive
        - label: 收购 AuthenticID
          date: '2025-08-01'
          detail: 收购西雅图的 AuthenticID；合并后实体每年为美国前 10 大银行中的 8 家处理 4.1B+ 次身份核验。
          tone: positive
        - label: FedRAMP Ready
          date: '2025-11-14'
          detail: 获得 FedRAMP Ready 状态——这是进入美国联邦机构身份验证合同的关键门槛。
          tone: positive
        - label: Login.gov 合同 — $37.4M
          date: '2025-12-16'
          detail: 作为 Diamond Capture Associates 分包商，获得 $37.4M GSA 合同，为 Login.gov 提供身份核验。
