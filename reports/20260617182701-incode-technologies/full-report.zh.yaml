      - number: '1.3'
        title: 规模、客户与市场牵引
        blocks:
          - type: paragraph
            body: >-
              Incode 在蓝筹金融服务和电信客户中的渗透，凸显其企业级资质。截至 2025 年 8 月收购后的合并实体，Incode 服务美国 10 大银行中的 8 家、北美前 9 大电信运营商中的 8 家、拉丁美洲前 5
              大银行中的 4 家，以及全球前 3 大 neobank 全部客户。已具名或可公开推断的拉丁美洲客户包括 BBVA 和 Banorte。平台在 2024 年处理 4.1B 次身份检查。


              收入指标显示增长强劲：ARR 据报从 2023 年约 $86.7M 升至 2025 年中约 $170M，两年累计增长约 96%。公司在 2025 年 8 月宣布收购 AuthenticID 时称，平台实现 80%
              同比有机增长。截至 2026 年，公司在 San Francisco、Mexico City 和 Belgrade 约有 650–668
              名员工；相对收入规模，团队精简，意味着人均收入生产率较高。由于这家私营公司没有公开审计财务报表，财务指标大多仍来自公司声明或第三方估算。
