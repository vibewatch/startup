              LATAM，Banorte（墨西哥第二大银行）、Citibanamex（按资产第二大）和 Banco Dondé（聚焦社会包容）等大型银行，均有记录显示是 Incode Omni
              的生产客户，用于远程开户、生物识别开户和反欺诈。在美国，Incode 称其服务美国前十大银行中的 8 家、前八大电信运营商中的 7 家；这一说法得到 FedRAMP
              新闻材料和多份官方新闻稿印证。政府客户包括墨西哥 INE（Instituto Nacional Electoral）的生物识别验证、美国联邦 Login.gov 项目（$37.4M 合同），以及至少一个未具名
              LATAM 国家曾用 Incode 做安全远程电子投票。酒店部署包括 Jumeirah Group（中东 4 处物业），博彩部署包括东欧 MaxBet 和美国 iGaming 领域的 Aristotle
              Integrity。Banco Dondé 合作面向墨西哥服务不足人群的金融包容，说明 Incode 的覆盖不止于一线机构。NTT Data、Carahsoft、Optiv 和 SHI International
