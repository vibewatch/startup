  - id: named-proof
    title: Named Customer Deployments and Proof of Adoption
    body: >-
      Incode maintains a set of publicly documented case studies across its core verticals. The Citibanamex deployment
      is the most quantitatively rich public case study: Citi Mexico's second-largest bank achieved an 80% reduction
      in onboarding costs, increased new accounts, and reduced fraud attempts after deploying Incode Omni with
      face recognition, OCR, and iBeta Level 2 passive liveness detection. Citibanamex selected Incode ahead of
      competitors for its in-house developed core technology, orchestration capabilities, full automation, and edge
      computation. The Banorte integration, announced in November 2022, enabled customers to open accounts and sign up
      for financial products entirely via mobile using the Banorte Mobil app — the first such remote account registration
      capability at a major Mexican bank. Marcos Ramírez Miguel, CEO of Grupo Financiero Banorte, confirmed: "We offer
      users the possibility of becoming Banorte customers in a completely digital way, from their cell phones and with
      immediate access to a bank account without limits." The Jumeirah Group partnership (December 2021) covers 4
      luxury hotel properties in the Middle East where biometric check-in is deployed, achieving check-in times as
      fast as 1.5 minutes; Sanjay Sharma, Head of IT at Jumeirah, cited "seamless and secure guest experience, setting
      a new standard for the industry." In gaming, MaxBet (Eastern Europe) became the first gambling operator in the
      region to deploy Incode's AI-powered passive liveness detection for player onboarding across physical and online
      properties, covering over 4,600 document types. Aristotle Integrity integrated Incode into its AutoDoc platform,
      which is licensed in 22 US states and powers onboarding for most of the largest US gambling operators. Banco
      Dondé, a Mexico social-inclusion bank, deployed Incode for remote biometric Level 4 account opening across
      nearly 400 branches, with CEO Eduardo Dondé confirming Incode met all security, accuracy, and scalability
      requirements. At federal scale in the United States, Incode won a $37.4M contract with Diamond Capture
      Associates to support Login.gov's Next Generation Identity Proofing initiative via the GSA's Technology
      Transformation Services.
