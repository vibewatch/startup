  - id: concentration-risk
    title: Concentration Risk and Adverse Evidence
    body: >-
      Incode's customer base carries identifiable concentration risk along two axes: geographic and vertical. Mexico
      alone accounted for 2 billion of the 7 billion global verifications in 2025 (approximately 29%), and the
      LATAM banking vertical — particularly Banorte, Citibanamex, and Banco Dondé — represents the deepest evidenced
      customer relationships. In a market where banking sector concentration is structurally high (a small number of
      large banks dominate), loss of a single tier-1 bank relationship could represent a material volume decline.
      S&P Global's 2026 Banking Risk review notes that LATAM banks are increasingly reliant on third-party fintech
      vendors for digital transformation, amplifying systemic risk if a key provider experiences disruption. The
      meritra.co LatAm Banking Risk 2026 analysis documents that fraud and cyber now rank as the top two board-level
      risks for LATAM banks, creating both opportunity and dependency risk for Incode. On product integration risk,
      G2 reviewers note that Incode's pricing is "expensive for smaller operations" (3 mentions) and that integration
      complexity can be a barrier for teams unfamiliar with KYC processes (2 mentions). A March 2026 Gartner Peer
      Insights review criticized Incode's APIs for not being "agnostic enough," requiring excess client-side decision
      logic — a signal that may increase switching costs in some deployments but could also drive churn at the mid-market
      tier. No major enterprise churn events are documented in the public record. Rappi, frequently cited as an Incode
      customer in marketing, has no publicly confirmed production deployment documented by either party as of June 2026.
    claimRefs:
