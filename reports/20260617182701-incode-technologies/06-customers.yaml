  - id: scale-retention
    title: Customer Scale, Retention Signals, and Satisfaction
    body: >-
      At the aggregate level, Incode processed over 4 billion identity checks annually as of late 2025, with 7 billion
      global verifications completed across 2025 according to the Axis Negocios interview. Mexico alone accounted for
      2,000 million (2 billion) of those validations in 2025 — a figure that underscores the LATAM concentration and
      the depth of integration with Mexican financial institutions. Between 1% and 3% of verifications involve direct
      fraud attempts, indicating high-stakes use across Incode's customer base. Retention data is not disclosed
      publicly by Incode (a private company), but proxy signals are strongly positive: G2 reports a perfect 5.0/5.0
      average from 52 verified reviews as of November 2025 (Winter 2026 badges cycle), with 100% five-star ratings.
      Incode earned 19 G2 badges in the Winter 2026 reports — 12 in Identity Verification, 4 in Age Verification,
      3 in Anti-Money Laundering — leading in both mid-market and enterprise segments. Gartner recognized Incode as
      a Leader in its inaugural 2025 Magic Quadrant for Identity Verification, reflecting enterprise buyer confidence.
      Customer reviews highlight fraud prevention quality, ease of integration, and responsive support. Minor adverse
      signals include G2 mentions of cost being elevated for smaller operations (3 mentions), integration complexity
      for teams without prior KYC experience (2 mentions), and a Gartner Peer Insights critical review in March 2026
      noting APIs are "not agnostic enough" and require excess client-side decision-making. Churn among large enterprise
      customers is unobserved in the public record; the Citibanamex, Banorte, Jumeirah, and MaxBet deployments remain
      active based on continued press and case study availability as of 2026.
