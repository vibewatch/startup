callouts:
  - calloutType: strength
    title: Tier-1 Banking and Federal Government Validation
    body: >-
      Incode's documented customer base — 8 of the top 10 US banks, Citibanamex and Banorte in Mexico, and a $37.4M
      US federal Login.gov contract — provides rare enterprise-grade proof for a private identity verification company.
      These reference customers serve as powerful validators for enterprise sales cycles globally, where regulators
      and IT buyers seek proof of mission-critical deployments at comparable institutions.
    claimRefs:
      - CU001
      - CU007
      - CU018

  - calloutType: risk
    title: LATAM Concentration and Undisclosed Revenue Mix
    body: >-
      Mexico alone accounted for approximately 29% of Incode's 7 billion global verifications in 2025. A handful of
      major Mexican banks represent the deepest documented customer relationships. Without disclosed NRR, GRR, or
      per-customer revenue data, it is impossible to size this concentration risk precisely — but the structural
      dependence on LATAM banking is a material diligence concern, particularly if macroeconomic, regulatory, or
      competitive conditions shift in Mexico.
    claimRefs:
      - CU004
      - CU005
      - CU022

  - calloutType: recommendation
    title: Validate Named US Bank and Telco References Under NDA
    body: >-
      Incode's claim to power "8 of the top 10 US banks" and "7 of the top 8 US telecom providers" is stated in
      official press releases but not corroborated by independent named-customer evidence. Before closing any
      investment thesis, request a reference call with at least one named US bank (under NDA) and validate
      customer concentration, contract terms, and renewal rates against the aggregate claims.
    claimRefs:
      - CU001
      - CU002

