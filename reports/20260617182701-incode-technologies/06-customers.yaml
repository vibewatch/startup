  - id: gtm-partners
    title: Go-to-Market Architecture and Channel Partnerships
    body: >-
      Incode's go-to-market operates through three primary channels: direct enterprise sales, channel/reseller
      partnerships, and platform integrations with major enterprise software vendors. On the channel side, documented
      partners include NTT Data (global SI for financial services, healthcare, and public sector), Carahsoft Technology
      (US public sector IT aggregator for federal, state, and local government), Optiv (cybersecurity solutions
      integrator), SHI International (Fortune 1000 IT procurement), and Guidepoint Security (enterprise security VAR).
      Platform integrations bring Incode's biometric engine into Experian's Ascend Platform (servicing 1,800+ global
      clients across financial services, automotive, healthcare), Temenos (core banking onboarding), HubSpot CRM,
      and Verifone/Digital Check hardware verification terminals. The Okta integration adds biometric workforce IAM
      capabilities to the enterprise security stack. Interac (Canada's debit network) holds exclusive Canadian rights
      to deliver Incode-powered document verification, targeting a Q3 2026 phased launch. This ecosystem strategy
      enables Incode to reach accounts it would not close through direct sales — particularly US government (via
      Carahsoft), and LATAM enterprise (via NTT Data and regional SIs). The FedRAMP Ready milestone (November 2025)
      and the Login.gov contract together validate Incode's US federal government addressability. Revenue from
      channel partners is not disclosed but the breadth of the ecosystem suggests meaningful indirect revenue
      contribution. The Experian partnership quote from SVP Marika Vilen — "empowering organizations to make faster,
      smarter decisions while tailoring their fraud and risk strategies" — signals partner confidence in the platform.
    claimRefs:
      - CU016
      - CU017
      - CU019
      - CU026
      - CU027
      - CU034
