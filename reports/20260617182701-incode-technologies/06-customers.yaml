chapter:
  number: 6
  title: Customers
  summary: >-
    Incode Technologies serves a broad set of enterprise customers across banking, telco, government, hospitality, gaming,
    and fintech verticals, with verified production deployments at Citibanamex (80% onboarding cost reduction), Banorte
    (remote account opening via INE biometric verification), Jumeirah Group (4 hotel properties), and MaxBet (first
    gaming operator in Eastern Europe to deploy Incode). The company reports powering 8 of the top 10 US banks and
    7 of the top 8 US telecom providers, processing over 4 billion identity checks annually. Customer sentiment on G2
    (5.0/5.0, 52 reviews) and Gartner Peer Insights is strong, though integration complexity and pricing draw minor
    complaints. Material concentration risk exists around LATAM/Mexico banking, where a small set of tier-1 banks
    represents a disproportionate share of volume.

sections:
  - id: seg-vertical
    title: Customer Base and Vertical Segmentation
    body: >-
      Incode serves six primary verticals — financial services/banking, telecommunications, government, hospitality,
      gaming/iGaming, and fintech/crypto marketplaces — with banking as the dominant segment by both revenue weight
      and public evidence depth. In Mexico and broader LATAM, major banks including Banorte (Mexico's second-largest),
      Citibanamex (second-largest by assets), and Banco Dondé (social-inclusion focus) are documented production
      customers using Incode Omni for remote account opening, biometric onboarding, and fraud prevention. In the United
      States, Incode claims to power eight of the top ten US banks and seven of the top eight telecom providers, a
      statement corroborated by FedRAMP press materials and multiple official press releases. Government customers span
      Mexico's INE (Instituto Nacional Electoral) biometric verification, the US federal Login.gov program ($37.4M
      contract), and at least one unnamed LATAM nation that used Incode for secure remote electronic voting. Hospitality
      deployments include Jumeirah Group (4 properties in the Middle East), while gaming deployments include MaxBet in
      Eastern Europe and Aristotle Integrity in the US iGaming sector. The Banco Dondé partnership targets financial
      inclusion for underserved populations in Mexico, demonstrating Incode's reach beyond tier-1 institutions.
      Channel partners including NTT Data, Carahsoft, Optiv, and SHI International extend Incode's reach to
      enterprise and government buyers in North America and globally.
    claimRefs:
