figures:
  - id: FU001
    title: Incode Customer Journey Map
    type: journey-map
    layout: wide
    summary: >-
      Incode's customer journey moves from vertical identification and pilot scoping through integration, production
      deployment, and expansion into additional modules and geographies.
    data:
      nodes:
        - id: j1
          label: Vertical discovery
          detail: >-
            Enterprise buyer (bank, telco, government, casino) identifies KYC/AML, fraud prevention, or onboarding
            problem; discovers Incode via Gartner MQ, G2, partner ecosystem (Experian, NTT Data, Carahsoft), or
            direct outreach.
          tone: neutral
        - id: j2
          label: Pilot / proof of concept
          detail: >-
            Incode provides sandbox access and integration support; buyer evaluates Incode Omni's biometric accuracy,
            liveness detection, and document coverage (4,900+ IDs from 200 countries) against incumbent vendors.
          tone: neutral
        - id: j3
          label: Regulatory and compliance review
          detail: >-
            Buyer validates iBeta Level 2/3 certifications, SOC 2 Type II, ISO 27001, NIST scores, and local
            regulatory acceptance (Mexico CNBV, US FedRAMP, EU GDPR). Incode acts as compliance advisor.
          tone: warning
        - id: j4
          label: Production deployment
          detail: >-
            Incode Omni is embedded into digital onboarding, mobile app, or hospitality check-in workflow; edge
            computation processes biometric data on-device to minimize latency and privacy exposure.
          tone: positive
        - id: j5
          label: Steady-state operations and expansion
          detail: >-
            Customer expands from one module (KYC onboarding) to adjacent modules (authentication, AML, age
            verification, workforce IAM via Okta). Volume scales as customer's user base grows.
          tone: positive
        - id: j6
          label: Channel-mediated access
          detail: >-
            New buyers access Incode via Experian Ascend Platform, NTT Data SI engagement, Carahsoft government
            vehicle, or Interac Canada distribution, bypassing direct sales motion.
          tone: positive
    claimRefs:
      - CU001
      - CU007
      - CU008
      - CU016
      - CU019
      - CU023

