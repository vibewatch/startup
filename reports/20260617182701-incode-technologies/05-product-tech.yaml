callouts:
  - calloutType: strength
    title: First-Globally iBeta Level 2 + NIST FRTE #1 Creates Dual Third-Party Validation
    body: >
      Incode's biometric core is the only major IDV provider with both NIST FRTE top ranking
      among full-solution providers (2024) and first-globally iBeta ISO 30107-3 Level 2
      passive liveness certification. These two independent evaluations provide objective
      anchors for sales and compliance conversations that most competitors lack. Combined
      with the Gartner Leader recognition for two consecutive years, the company has a
      strong third-party validation story that is difficult to replicate quickly.
    claimRefs: [CE007, CE010, CE023, CE024]

  - calloutType: strength
    title: 100+ Proprietary In-House ML Models Eliminates Vendor Dependency Risk
    body: >
      Incode's declared 100+ proprietary ML models, trained on a 10TB+ dataset, are built
      entirely in-house with no reliance on third-party foundation models for core identity
      decisions. This architecture provides full control over model iteration speed — a
      critical advantage as generative AI attacks evolve — and eliminates the risk of a
      third-party model provider changing terms, pricing, or performance characteristics.
      The ClearML case study provides independent confirmation of the engineering depth
      behind this model factory.
    claimRefs: [CE005, CE006, CE043, CE044]

  - calloutType: risk
    title: FedRAMP ATO Dependency Creates Timing Risk for Federal Revenue
    body: >
      While FedRAMP Ready status is a meaningful milestone, full Authorization to Operate
      requires an agency sponsor and typically takes 12-24 additional months. Incode has
      the Login.gov subcontract as a bridging engagement, but federal contract volumes
      will remain constrained until ATO is obtained. Any delay in the sponsoring agency
      relationship extends the timeline for capturing the full U.S. government opportunity
      that the FedRAMP investment was designed to unlock.
    claimRefs: [CE017]

  - calloutType: insight
    title: Agentic Identity Is a Credible First-Mover Bet But Lacks Production Evidence
    body: >
      Agentic Identity, launched in October 2025, addresses a real and growing enterprise
      need as AI agent deployments accelerate. Incode's approach — biometric binding of
      agents to verified human owners — is technically coherent and extends existing
      biometric infrastructure rather than requiring a new platform. However, as of
      mid-2026, there are no disclosed production deployments, customer case studies,
      or independent assessments. Pilot-to-production conversion rates and the maturity
      of MCP and other agentic protocol integrations require diligence validation.
    claimRefs: [CE036, CE037, CE045]

