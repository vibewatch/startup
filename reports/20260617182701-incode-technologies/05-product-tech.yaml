  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: platform-architecture
      missingEvidence: "Incode has not publicly disclosed its cloud infrastructure provider(s), on-premises deployment options, data residency configurations, or regional availability of the Incode Omni SaaS platform."
      whyItMatters: "Regulated enterprise buyers in the EU, APAC, and U.S. government sectors often require on-premises or sovereign-cloud deployment, data residency guarantees, and documented uptime SLAs. Without this, total addressable market in regulated verticals is uncertain."
      diligencePath: "Request cloud architecture documentation, IaaS provider identity, regional data center locations, uptime SLA terms, and on-premises deployment availability directly from Incode."
      relatedQuestionRefs: [QE014, QE022]
      relatedTableRefs: [TE003]

    - type: missing-source
      severity: material
      topic: deepfake-defense
      missingEvidence: "No independent peer-reviewed study or published technical paper has been identified that replicates or independently validates the Purdue Machine Learning Lab benchmark cited on Incode's Deepsight product page. The Purdue endorsement appears only on Incode's own website."
      whyItMatters: "A benchmark cited solely by the vendor without independent publication limits the epistemic strength of Incode's 68x FPR claim and 2.5x FAR advantage. Competitors may dispute the methodology or sample selection."
      diligencePath: "Request the full Purdue study methodology, dataset description, and benchmark conditions. Seek independent replication or confirmation of the Purdue benchmark from Shu Hu's lab directly."
      relatedQuestionRefs: [QE028]
      relatedTableRefs: [TE001]

    - type: private-evidence-only
      severity: minor
      topic: FedRAMP
      missingEvidence: "Incode has achieved FedRAMP Ready status but has not publicly identified its agency sponsor or provided a timeline for full Authorization to Operate (ATO). Full federal contract eligibility requires ATO completion."
      whyItMatters: "The federal revenue opportunity that justifies FedRAMP investment depends on ATO completion. Without an identified agency sponsor, the timeline for full ATO is highly uncertain, typically ranging from 12 to 24 months after Ready status."
      diligencePath: "Confirm agency sponsor identity and expected ATO completion date. Track Login.gov subcontract as a possible path to ATO through the diamond capture relationship."
      relatedQuestionRefs: [QE014]
      relatedTableRefs: [TE004, TE005]

    - type: missing-source
      severity: minor
      topic: AI-ML-infrastructure
      missingEvidence: "No independent demographic fairness audit or bias testing report has been identified for Incode's facial recognition or liveness models. The Incode face recognition page mentions demographic fairness and 'globally inclusive training data' but provides no published audit."
      whyItMatters: "Demographic bias in biometric systems is a significant legal and reputational risk, particularly in regulated use cases (government, financial services, healthcare). Illinois BIPA litigation (settled for $4M) illustrates biometric privacy exposure. Without a published audit, enterprise buyers cannot independently verify fairness across demographics."
      diligencePath: "Request published demographic fairness audit results, breakdown of FNIR/FPIR by skin tone and demographic segment, and methodology for inclusive training data curation."
      relatedQuestionRefs: [QE013, QE028]
      relatedTableRefs: [TE001]

