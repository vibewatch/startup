figures:
  - id: FE001
    title: Incode Platform Architecture Stack
    type: stack
    layout: standard
    summary: >
      The Incode platform is structured as a six-layer stack from user-facing no-code
      experience at the top down to authoritative government and external data sources
      at the base; all biometric and document processing runs through the proprietary
      AI/ML model layer.
    data:
      layers:
        - label: Experience and packaging
          detail: "No-code workflow builder (drag-and-drop), branded UI customization, Web SDK and mobile SDK for custom integration; Incode Omni dashboard for case management and fraud analytics"
        - label: Product suite and use-case modules
          detail: "Incode Omni (KYC/AML orchestration), Incode Workforce (KYE), Deepsight (deepfake defense), Agentic Identity (AI agent verification), Risk AI Agent (adaptive holistic decisioning)"
        - label: Core biometric and document verification
          detail: "Facial recognition (20ms, 0.01% false match), liveness detection (passive + active, iBeta Level 2), document OCR (25% better than open-source), NFC e-passport chip reading"
        - label: Proprietary AI/ML model layer
          detail: "100+ ML models trained on 10TB+ dataset; Vision-Language Model (200+ regions), Fraud LLM (behavioral/device signals), Reasoning Agents; Internal Fraud Lab with 35+ specialized models"
        - label: Developer integration and security layer
          detail: "Web SDK (@incodetech/welcome npm, 2,128+ versions), Android/iOS/React Native/Flutter SDKs; HTTPS-required; server-side session token management; injection-block via native SDK"
        - label: Authoritative and external data layer
          detail: "AAMVA DLDV and state DMV connections for real-time credential validation; government System of Record (GSOR) for deterministic cross-checks; NIST FRTE evaluation benchmark"
    claimRefs: [CE003, CE005, CE007, CE008, CE010, CE013, CE014, CE028, CE032, CE033, CE042]

  - id: FE002
    title: Customer Identity Verification Workflow (Incode Omni)
    type: flow
    layout: standard
    summary: >
      A standard Incode Omni verification journey begins with user-initiated capture,
      passes through multi-layer AI processing, optionally escalates to GSOR deterministic
      checks, and concludes with a real-time pass/review/decline decision — all without
      manual document review unless escalated.
    data:
      nodes:
        - id: n1
          label: User initiates verification
          detail: "User opens verification flow via web SDK, mobile app, or embedded link; no account creation or app download required"
        - id: n2
          label: Document capture and OCR
          detail: "User photographs or NFC-reads government-issued ID; proprietary OCR extracts and validates data fields; AI detects synthetic or tampered documents"
        - id: n3
          label: Selfie capture with liveness
          detail: "Device camera captures live selfie; passive liveness AI checks for deepfakes, masks, and video replays without user action prompts (active mode optional)"
        - id: n4
          label: Biometric face match
          detail: "Facial recognition model compares selfie against ID photo or GSOR biometric record; 20ms matching with 0.01% false match rate"
        - id: n5
          label: Deepfake and injection detection
          detail: "Deepsight layer checks device integrity, analyzes perception signals, and cross-validates against GSOR to block AI-injected content"
        - id: n6
          label: Risk AI Agent holistic scoring
          detail: "Aggregates all session signals (device, behavioral, biometric, document) in context; approves borderline sessions or flags for review without manual threshold rules"
        - id: n7
          label: GSOR deterministic validation (optional)
          detail: "Real-time check against AAMVA DLDV or state DMV for high-assurance verification; bypasses reliance on visual document inspection"
        - id: n8
          label: Real-time pass / review / decline
          detail: "Orchestration layer issues instant decision; approved users proceed immediately; review queue populated only for genuine edge cases"
        - id: n9
          label: Ongoing monitoring and reverification
          detail: "Identity checks continue at critical lifecycle moments (helpdesk, MFA reset, high-value transactions) using stored biometric profile"
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n5
          to: n6
        - from: n6
          to: n7
        - from: n7
          to: n8
        - from: n8
          to: n9
