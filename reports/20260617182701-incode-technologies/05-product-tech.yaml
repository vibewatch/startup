company:
  name: Incode Technologies
chapter:
  number: 5
  title: Product & Technology
  summary: >
    Incode's unified identity platform (Incode Omni) combines an orchestration dashboard,
    100+ proprietary ML models, deepfake-resistant biometrics, and first-globally iBeta
    Level 2–certified passive liveness detection. The platform earned FedRAMP Ready status
    in November 2025, holds SOC 2 Type II, ISO 27001, ISO 42001, and Kantara IAL2, and
    ranked first among full-solution IDV providers in the 2024 NIST FRTE 1:N evaluation.
    Agentic Identity (launched Q4 2025) extends biometric accountability to autonomous AI
    agents. The developer ecosystem is mature, with 2,128+ npm package versions and SDKs
    across Web, Android, iOS, React Native, and Flutter. Key evidence gaps remain around
    on-premises deployment terms, independent demographic fairness audits, and the path to
    full FedRAMP Authorization to Operate.

sections:
  - id: sec-platform-overview
    title: Platform Overview & Orchestration
    body: >
      Incode Omni is a unified, end-to-end identity verification and fraud prevention platform
      built around a central no-code orchestration layer. The platform centralizes document
      verification, facial biometrics, liveness detection, device risk analysis, KYC, and AML
      compliance into a single configurable workflow hub accessible through a drag-and-drop
      flow builder. Customers configure multi-step verification journeys by combining modules,
      business rules, and conditional logic without engineering involvement for common use cases;
      a full SDK and REST API surface supports deep custom integration. The orchestration
      dashboard provides real-time decisioning, case management, fraud analytics, and
      performance reporting in one place. Incode Omni positions itself as the single system
      of record for identity across the entire customer and employee lifecycle — from initial
      onboarding and KYC through ongoing authentication, reverification, and workforce
      helpdesk automation. The company claims 7.1 billion trust checks processed across its
      customer base as of mid-2026, including 4.1 billion identity verifications completed
      in calendar year 2024. Trusted deployments span eight of the ten largest U.S. banks,
      eight of nine top U.S. telecom providers, and the three largest global neobanks.
    claimRefs: [CE001, CE002, CE003, CE025, CE026, CE042]
    tableRefs: [TE001, TE002]
    figureRefs: [FE002]

  - id: sec-biometric-core
    title: Core Biometric Technology Stack
    body: >
      Incode's biometric engine comprises three foundational pillars: facial recognition,
      liveness detection, and document verification. For facial recognition, proprietary
      deep learning models compare live selfie captures against ID document photos or
      government biometric databases, with facial matching completing in 20 milliseconds
      and a claimed 0.01% false match rate. In the 2024 NIST Face Recognition Technology
      Evaluation (FRTE) 1:N identification test, Incode ranked first among all full-solution
      identity verification providers across multiple gallery types including Visa-Border,
      Mugshot-Webcam, and Visa-Kiosk datasets, evaluated against 1.6 million identity
      subjects with a False Positive Identification Rate threshold of 0.003. Liveness
      detection supports both active (user-prompted action) and passive (fully automated)
      modes. The passive liveness system was claimed to be the first globally to achieve
      iBeta's ISO 30107-3 Level 2 evaluation, a test covering advanced spoofing attacks
      including 3D masks and AI-generated deepfakes. Document verification uses proprietary
      OCR that Incode claims is 25% more accurate than open-source alternatives in
      competitive testing, combined with NFC chip reading for e-passports and other
      biometric documents. The platform supports direct government system of record (GSOR)
      integrations via AAMVA Driver License Data Verification (DLDV) and state DMV
      connections, enabling deterministic real-time credential checks against authoritative
      issuing sources.
    claimRefs: [CE005, CE007, CE008, CE009, CE010, CE011, CE012, CE013, CE038, CE039]
    tableRefs: [TE003]
    figureRefs: [FE001]

  - id: sec-ai-ml-infrastructure
    title: AI/ML Model Infrastructure
    body: >
      At the core of Incode's technical differentiation is an in-house machine learning
      factory. Alex Golunov, VP of ML Engineering, has publicly stated that Incode operates
      more than 100 proprietary machine learning models that authenticate every onboarding
      session, trained on a proprietary dataset exceeding 10 terabytes and spanning hundreds
      of millions of data points including images, video, structured text, and tabular
      datasets. Incode manages this infrastructure through ClearML's MLOps platform, using
      dynamic GPU allocation across AWS EC2 instances and on-premises GPU hardware through
      automated autoscaling. The latest model generation includes a Vision-Language Model
      (VLM) trained on global identity and document data across 200-plus regions, capable
      of few-shot adaptation to new attack types and unseen document formats; a Fraud LLM
      trained on proprietary fraud datasets, behavioral sequences, and device signals; and
      Reasoning Agents for risk intelligence. The VLM has demonstrated key performance
      improvements in production benchmarks: 67% fewer errors in fake ID detection, 4%
      gain in document tampering accuracy, 25% fewer errors in signature fraud detection,
      approximately 80% faster training cycles, and 0% Attack Presentation Classification
      Error Rate (APCER) on a challenging liveness benchmark dataset. Incode also operates
      a dedicated Internal Fraud Lab with 35-plus specialized AI models focused on document
      and biometric fraud patterns, continuously trained with real-world data from across
      Incode's network of customer deployments.
    claimRefs: [CE005, CE006, CE032, CE033, CE034, CE035, CE043, CE044]
    tableRefs: []
    figureRefs: [FE003]

  - id: sec-anti-fraud
    title: Anti-Fraud & Deepfake Defense
    body: >
      Incode's Deepsight product is the company's multi-layered deepfake defense system.
      An independent benchmark by Shu Hu, Assistant Professor and Director of the Purdue
      Machine Learning Lab, evaluated nine major commercial deepfake detection systems and
      found Incode's detector achieved the highest accuracy, with a 68x better false-positive
      rate and 2.5x lower false-acceptance rate compared to the next-best commercial system.
      Deepsight defends across four attack surfaces: (1) injection attack prevention via
      native SDKs that block virtual cameras and device emulation before the capture
      process begins; (2) perception-layer analysis of biometric signals including
      blurriness, iris presentation, light reflection, and texture anomalies to identify
      synthetic images and videos; (3) deterministic verification against government systems
      of record to provide authoritative cross-checks; and (4) continuous model retraining
      via Incode's in-house R&D team and Fraud Lab. The platform detects a broad taxonomy
      of attacks: 2D masks, 3D silicone masks, paper printouts, video replays, face swaps,
      face morphs, 2D synthetic AI-generated assets, and face reenactment videos. The
      Risk AI Agent, a complementary product, provides session-level holistic fraud
      decisioning by evaluating all risk signals in context without manual threshold
      configuration, adapting automatically to each customer's specific fraud and conversion
      patterns. Incode reports a 21x surge in deepfake fraud attempts over the three years
      prior to mid-2026 as a key market driver for these capabilities.
    claimRefs: [CE012, CE016, CE029, CE030, CE031, CE040]
    tableRefs: []
    figureRefs: []

  - id: sec-developer-ecosystem
    title: Developer Integration & SDK Ecosystem
    body: >
      Incode provides a comprehensive developer integration surface spanning web, mobile,
      and server environments. The Web SDK is published on npm as @incodetech/welcome, which
      had reached version 1.90.0 with over 2,128 published versions as of June 2026. The
      SDK is TypeScript-compatible and provides three method categories: configuration and
      initialization, data capture (camera-based ID and selfie capture), and process data
      methods (ID validation, Face Match, and government validation calls). For mobile,
      Incode offers native SDKs for Android (minimum API level 23, covering 98.4% of
      Android devices) and iOS (minimum iOS 13, covering 99.6% of iOS devices). A React
      Native package (@incode-sdks/react-native-incode-sdk) supports optional NFC, Face
      Login, and video-call variants. iOS dependencies are distributed through a private
      GitHub Packages registry with credential-based access. Example integration repositories
      are maintained publicly at github.com/Incode-Technologies-Example-Repos, including a
      Next.js example showcasing core onboarding flows. The developer hub at
      developer.incode.com provides structured documentation for full SDK integration,
      low-code and no-code paths, API reference, and language-specific quickstarts. All
      integrations are required to run over HTTPS, and session tokens must be managed
      server-side to protect API keys. Webviews and social-media in-app browsers are
      explicitly unsupported for the Web SDK.
    claimRefs: [CE013, CE014, CE015, CE041]
    tableRefs: [TE005]
    figureRefs: []

  - id: sec-compliance-trust
    title: Compliance, Certifications & Trust
    body: >
      Incode maintains one of the broadest compliance portfolios among identity verification
      providers. As of June 2026, its trust center (trust.incode.com) confirms active
      certifications and attestations covering: SOC 2 Type II (security, availability,
      and confidentiality controls), ISO/IEC 27001 (information security management),
      ISO/IEC 30107-3:2023 (biometric presentation attack detection aligned with the
      iBeta test methodology), ISO/IEC 42001:2023 (AI management systems), HIPAA, and
      Kantara Identity Assurance Level 2 (IAL2). In November 2025, Incode achieved
      FedRAMP Ready status at the High Baseline level, completing a Readiness Assessment
      by a FedRAMP-accredited 3PAO with findings reviewed by the FedRAMP Program Management
      Office. This status enables Incode to pursue contracts with U.S. federal agencies
      and positions the company to seek full FedRAMP Authorization to Operate. Incode has
      also partnered with Carahsoft, the government IT solutions distributor, to bring its
      identity platform to the U.S. public sector. In both the 2024 and 2025 Gartner Magic
      Quadrant for Identity Verification, Incode was recognized as a Leader, placing
      furthest for Completeness of Vision in the 2024 edition. Incode's stateless
      architecture option supports zero data retention, meaning no personally identifiable
      information or biometric images need be stored after a verification is complete,
      addressing data minimization and privacy regulatory requirements globally.
    claimRefs: [CE017, CE018, CE019, CE020, CE021, CE022, CE023, CE024, CE027, CE028]
    tableRefs: [TE004]
    figureRefs: [FE004]

  - id: sec-roadmap
    title: Roadmap & Emerging Capabilities
    body: >
      Incode's most significant product extension in late 2025 was Agentic Identity,
      announced in October 2025 and entering pilot programs in Q4 2025. This system
      applies deepfake-resistant biometrics to verify autonomous AI agents, binding each
      agent to a verified human owner through biometric-backed cryptographic scope tokens
      with programmable expiration and revocation. The system enables continuous behavioral
      monitoring of agent activity, detecting anomalies or compromised agents and
      triggering automated or human responses. Agentic Identity integrates with Incode's
      existing identity suite and supports MCP and other agentic protocols, addressing
      enterprise concerns about AI agent impersonation, unauthorized transactions, and
      accountability in autonomous workflows. Chief Product Officer Roman Karachinsky
      described the goal: enabling enterprises to deploy AI agents "without compromising
      on fraud prevention or compliance." The Risk AI Agent capability provides
      complementary session-level holistic decisioning for human verification journeys,
      learning continuously from each customer's fraud and conversion patterns without
      requiring manual rule configuration. On the compliance roadmap, FedRAMP Ready status
      positions Incode to work toward full Authorization to Operate through an agency
      sponsor in 2026. The government sector roadmap is further supported by the
      Login.gov contract (announced December 2025) for next-generation identity proofing,
      delivered through subcontractor Diamond Capture Associates. These capabilities signal
      a deliberate expansion from private-sector financial services into regulated government
      and workforce identity markets.
    claimRefs: [CE036, CE037, CE040, CE045]
    tableRefs: []
    figureRefs: []

