callouts:
  - calloutType: risk
    title: "BIPA Precedent: $4M Settlement Sets Replication Template"
    body: >-
      Incode settled Aspel v. Incode Technologies (1:23-cv-17093) for $4 million in
      November 2024 without admitting wrongdoing. The settlement covered Illinois
      residents who uploaded biometrics to Incode-powered apps between November 2018
      and August 2024. This establishes that (a) Incode's historical consent workflows
      were legally contestable, and (b) plaintiffs' attorneys now have a proven template.
      With 100+ BIPA class actions filed in 2025 and the Seventh Circuit's retroactivity
      ruling pending, the legal risk vector is not closed—it is actively managed.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR007

  - calloutType: risk
    title: "Deepfake Arms Race: Liveness Spoofing Is the Product Threat"
    body: >-
      Deepfake attacks on biometric liveness checks surged 700%+ between 2021 and 2023,
      injection attacks rose 40% year-on-year, and synthetic identity fraud losses
      exceeded $35 billion globally in 2023. Incode's commercial differentiation rests
      on superior fraud detection; a documented high-volume bypass at a major bank
      customer would simultaneously threaten contractual renewals, trigger regulatory
      scrutiny, and undermine the valuation case. This risk cannot be permanently
      resolved—it requires ongoing R&D investment with no clear endpoint.
    claimRefs:
      - CR017
      - CR018
      - CR019

  - calloutType: risk
    title: "EU AI Act August 2026: Biometric High-Risk Compliance Now Mandatory"
    body: >-
      The EU AI Act becomes fully enforceable August 2, 2026—132 days from the date of
      this report. Real-time biometric identification in public is banned for law
      enforcement with narrow exceptions; high-risk systems require conformity assessments,
      technical documentation, and post-market monitoring. Fines reach €35 million or 7%
      of annual global turnover. Incode's EU revenue exposure is not publicly disclosed,
      making this a partially unquantifiable risk that requires an urgent diligence ask.
    claimRefs:
      - CR010
      - CR011
      - CR012

