  - id: technology-risk
    title: Technology Risk — Deepfakes, Liveness Spoofing, and Accuracy Bias
    body: >-
      Incode's core value proposition is biometric accuracy and fraud prevention, making
      technology risks that undermine accuracy an existential threat to customer confidence.
      Two categories dominate: generative-AI presentation attacks and demographic accuracy
      bias in face recognition.

      Deepfake and synthetic-identity fraud has grown at extraordinary rates. Deepfake
      attacks to bypass biometric liveness checks surged 700%+ between 2021 and 2023, and
      injection attacks—where a fraudster replaces the live camera feed with a pre-rendered
      deepfake video—rose 40% year-on-year by 2025. Synthetic identity fraud losses exceeded
      $35 billion globally in 2023. A 2025 arXiv survey of 408 professionals found a stark
      paradox: while the public trusts biometrics for convenience, experts express "grave
      concerns" about the spoofing of static modalities like face and voice. Human reviewers
      correctly identify high-quality AI-generated fake documents only ~50% of the time,
      meaning AI-assisted detection is no longer optional. For Incode, which processes 4.1
      billion identity checks annually, even a small bypass rate represents millions of
      fraudulent onboardings that could damage bank customers and trigger contractual
      liability.

      NIST FRVT data (last updated March 2025) confirms that demographic differentials in
      face recognition error rates persist across all submitted algorithms. False negative
      rates (failures to match the same person) are elevated for dark-skinned individuals
      in poor lighting conditions—exactly the conditions prevalent in mobile onboarding
      flows in LATAM. False positive differentials (incorrect matches) also vary by age,
      sex, and race. These differentials create regulatory risk under anti-discrimination
      law (the FTC has cited bias as a core concern), litigation risk, and reputational
      risk if deployed systems produce disparate outcomes at scale.

      The arms race between deepfake generators and liveness detectors is accelerating.
      Incode has invested in passive liveness and agentic AI detection, but the deepfake
      technology ecosystem is democratized: tools are available for as little as $20,
      and Fraud-as-a-Service platforms distribute ready-to-use spoofing kits at volume.
      Maintaining detection accuracy ahead of the threat curve requires continuous R&D
      investment and can never be declared permanently resolved.
    claimRefs:
      - CR017
      - CR018
      - CR019
      - CR020
      - CR021
      - CR022
      - CR023
      - CR024
      - CR039
