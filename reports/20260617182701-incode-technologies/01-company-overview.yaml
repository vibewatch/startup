  - id: funding-investors-valuation
    title: Funding History, Investors, and Valuation
    body: >-
      Incode has raised approximately $260 million across three substantive
      rounds. A $10 million Seed in October 2019 (led by DILA Capital) provided
      first institutional validation. A $25 million Series A in March 2021 from
      DN Capital, 3L Capital, and Walter Ventures funded U.S. and LatAm
      expansion. The pivotal event was the December 7, 2021 Series B of $220
      million, co-led by General Atlantic and SoftBank's LatAm Vision Fund with
      J.P. Morgan, Capital One Ventures, Coinbase Ventures, and SVCI — granting
      unicorn status at a $1.25 billion post-money valuation.


      As of November 2025, Bloomberg reported Incode was seeking $150–300M at
      a valuation of up to $3 billion, citing approximately $170M ARR and
      expanded market position following the AuthenticID acquisition and
      U.S. government contract wins. PremierAlts lists a market-implied
      valuation of $3 billion as of 2026, though no completed round has been
      publicly confirmed. A conflicting total-raised figure of $407M on
      PremierAlts versus the $260M reported by Tracxn and Crunchbase raises an
      unresolved diligence question about undisclosed tranches or secondary
      activity. The new round remaining unconfirmed is a material gap for
      valuation entry-point analysis.
    claimRefs:
      - CO010
      - CO011
      - CO012
      - CO013
      - CO023
      - CO035
      - CO036
      - CO038
      - CO039
      - CO040
    tableRefs:
      - TO003

  - id: scale-customers-traction
    title: Scale, Customers, and Market Traction
    body: >-
      Incode's customer penetration in blue-chip financial services and telecom
      underscores its enterprise credentials. As of the August 2025
      post-acquisition combined entity, Incode serves 8 of the 10 largest U.S.
      banks, 8 of the top 9 North American telcos, 4 of the top 5 Latin American
      banks, and all 3 of the world's top neobanks. Named or publicly inferable
      Latin American customers include BBVA and Banorte. The platform processed
      4.1 billion identity checks in 2024.


      Revenue metrics show strong growth: ARR was reported at approximately
      $86.7 million in 2023 and climbed to approximately $170 million by
      mid-2025 — roughly 96% cumulative growth over two years. The company
      claimed 80% year-on-year organic growth at the AuthenticID acquisition
      announcement in August 2025. With approximately 650–668 employees as of
      2026 across San Francisco, Mexico City, and Belgrade, Incode maintains a
      lean headcount relative to revenue scale, implying high revenue
      productivity per employee. Financial metrics remain largely
      company-claimed or third-party estimated, as no audited financials are
      publicly available for this private company.
    claimRefs:
      - CO005
      - CO014
      - CO015
