  evidenceGaps:
    - type: missing-source
      severity: material
      topic: arr-growth-comparison
      missingEvidence: >-
        Independent peer comparison of Incode's 80% YoY growth rate against
        publicly reported peers such as Jumio, IDEMIA, or Onfido
      whyItMatters: >-
        Without peer context, the 80% growth claim cannot be assessed as
        exceptional vs. category-average; this affects growth-premium
        valuation judgment
      diligencePath: >-
        Request management-provided peer benchmarking deck; consult Gartner
        or Forrester IDV market growth reports for 2024–2025 cohort
      relatedQuestionRefs:
        - QO018

    - type: private-evidence-only
      severity: material
      topic: fundraising-status-2026
      missingEvidence: >-
        Confirmed closed status, terms, and new investors in the reported
        $150–300M fundraising round as of June 2026
      whyItMatters: >-
        An unclosed round at a $3B target vs. last confirmed $1.25B implies
        a 140% valuation step-up with no independent corroboration; critical
        for valuation entry-point analysis and dilution modeling
      diligencePath: >-
        Require full cap-table disclosure including round closing
        confirmation, share price, and any SAFE or convertible instruments;
        request board minutes if round has closed
      relatedQuestionRefs:
        - QO009
        - QO028

    - type: missing-source
      severity: material
      topic: key-person-succession
      missingEvidence: >-
        Board composition, succession planning documentation, or CEO
        employment contract terms for Ricardo Amper
      whyItMatters: >-
        Amper is the sole public spokesperson, fundraising lead, and product
        visionary; absence of board structure and succession plan is a
        material governance gap for institutional diligence
      diligencePath: >-
        Request board observer/director list, governance documents, and
        confirm existence of key-man provisions or employment terms
      relatedQuestionRefs:
        - QO023

    - type: private-evidence-only
      severity: minor
