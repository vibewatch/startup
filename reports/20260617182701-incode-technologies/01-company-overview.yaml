      - CO041

  - id: milestones-strategic-events
    title: Key Milestones and Strategic Events
    body: >-
      Incode's trajectory illustrates a company that moved from a consumer
      photo-sharing startup in 2015 to a global AI identity infrastructure
      provider in under a decade. Key inflection points include the 2018
      strategic pivot to biometric identity, the 2021 unicorn round that
      injected $220M and blue-chip investor validation, and the August 2025
      AuthenticID acquisition that roughly doubled the combined customer
      footprint without disclosing financial terms.


      U.S. government ambitions accelerated in late 2025: FedRAMP Ready
      certification was achieved in November 2025, followed by a $37.4 million
      Login.gov contract in December 2025. On the partnership front, Okta
      (February 2025), Experian (August 2025), and Interac (May 2026, with
      exclusive Canadian rights) extend distribution reach into enterprise IAM,
      global fraud prevention, and the Canadian market. The milestone table
      below provides the authoritative chronology of all dated events,
      including adverse ones.
    claimRefs:
      - CO022
      - CO024
      - CO025
      - CO029
      - CO030
      - CO031
      - CO037
    tableRefs:
      - TO004
    figureRefs:
      - FO001

  - id: risks-and-adverse-events
    title: Risks and Adverse Events
    body: >-
      Incode faces several material risks that diligence must weigh alongside
      its commercial momentum. The most concrete adverse event is the BIPA class
      action lawsuit (Aspel v. Incode Technologies, Case No. 2023LA59), in which
      Incode settled for $4 million — without admitting wrongdoing — allegations
      that it collected facial geometry data from Illinois residents without
      proper BIPA consent between November 2018 and August 2024. This signals
      a compliance gap in core biometric data collection workflows. As biometric
      privacy regulations expand across U.S. states and internationally, Incode's
      consent and disclosure practices will face ongoing scrutiny, creating
      material enterprise procurement risk in privacy-sensitive sectors.


      Key-person concentration on founder and CEO Ricardo Amper is a structural
      concern: he is the public face, fundraising lead, and product architect.
      Board composition and succession planning remain opaque for this private
      company. Headcount estimates vary across sources ($556 to $668), raising
      questions about post-acquisition integration of the AuthenticID team.
      The unconfirmed $150–300M fundraise at a $3B target — versus the last
      confirmed $1.25B — represents a 140% valuation step-up with limited
      independent corroboration. PremierAlts' conflicting $407M total-raised
      figure further underlines the need for full cap-table disclosure before
      a new investment closes.
    claimRefs:
      - CO005
      - CO026
      - CO027
      - CO028
      - CO040

