            title: 'EU AI Act August 2026: Biometric High-Risk Compliance Now Mandatory'
            body: >-
              The EU AI Act becomes fully enforceable August 2, 2026—132 days from the date of this report. Real-time
              biometric identification in public is banned for law enforcement with narrow exceptions; high-risk systems
              require conformity assessments, technical documentation, and post-market monitoring. Fines reach €35
              million or 7% of annual global turnover. Incode's EU revenue exposure is not publicly disclosed, making
              this a partially unquantifiable risk that requires an urgent diligence ask.
