  - id: FE001
    title: Incode Platform Architecture Stack
    type: stack
    layout: standard
    summary: >
      The Incode platform is structured as a six-layer stack from user-facing no-code experience at the top down to
      authoritative government and external data sources at the base; all biometric and document processing runs through
      the proprietary AI/ML model layer.
    data:
      layers:
        - label: Experience and packaging
          detail: >-
            No-code workflow builder (drag-and-drop), branded UI customization, Web SDK and mobile SDK for custom
            integration; Incode Omni dashboard for case management and fraud analytics
        - label: Product suite and use-case modules
          detail: >-
            Incode Omni (KYC/AML orchestration), Incode Workforce (KYE), Deepsight (deepfake defense), Agentic Identity
            (AI agent verification), Risk AI Agent (adaptive holistic decisioning)
        - label: Core biometric and document verification
          detail: >-
            Facial recognition (20ms, 0.01% false match), liveness detection (passive + active, iBeta Level 2), document
            OCR (25% better than open-source), NFC e-passport chip reading
        - label: Proprietary AI/ML model layer
          detail: >-
            100+ ML models trained on 10TB+ dataset; Vision-Language Model (200+ regions), Fraud LLM (behavioral/device
            signals), Reasoning Agents; Internal Fraud Lab with 35+ specialized models
        - label: Developer integration and security layer
          detail: >-
            Web SDK (@incodetech/welcome npm, 2,128+ versions), Android/iOS/React Native/Flutter SDKs; HTTPS-required;
            server-side session token management; injection-block via native SDK
        - label: Authoritative and external data layer
          detail: >-
            AAMVA DLDV and state DMV connections for real-time credential validation; government System of Record (GSOR)
            for deterministic cross-checks; NIST FRTE evaluation benchmark
