      - number: '2.2'
        title: 'Market Sizing: TAM, SAM, and Estimation Uncertainty'
        blocks:
          - type: paragraph
            body: >
              Analyst estimates for the global identity verification market in 2026 range from USD 14.1 billion (Future
              Market Insights) to USD 17.3 billion (Business Research Company), with CAGR projections spanning 11% to
              17% depending on market scope. Mordor Intelligence, publishing a conservative estimate, sizes the 2026
              market at USD 15.78 billion with an 11.18% CAGR through 2031. Grand View Research projects a broader
              digital identity solutions market reaching USD 33.93 billion by 2030 at 16.7% CAGR from 2023. Market
              Research Future, updated as of June 17 2026, puts the 2026 figure at USD 16.89 billion with a 12.18% CAGR
              through 2035. The spread across estimates reflects differences in scope—some firms include only core
              document and biometric solutions while others incorporate adjacent fraud analytics and open banking
              authentication layers. The e-KYC sub-segment alone is valued at USD 948.8 million in 2025 by IMARC Group,
              growing at 16.35% CAGR through 2034. Within the global market, BFSI retains approximately 32–33% of
              revenue share, implying a financial services SAM of approximately USD 5 billion in 2026. No major analyst
              publishes a standalone LATAM-only identity verification market size; regional SAM estimates must be
              derived by applying LATAM fintech/banking market share proxies to the global TAM—a meaningful evidence gap
              that constrains precise SOM calculation.
