  - id: FE002
    title: Customer Identity Verification Workflow (Incode Omni)
    type: flow
    layout: standard
    summary: >
      A standard Incode Omni verification journey begins with user-initiated capture, passes through multi-layer AI
      processing, optionally escalates to GSOR deterministic checks, and concludes with a real-time pass/review/decline
      decision — all without manual document review unless escalated.
    data:
      nodes:
        - id: n1
          label: User initiates verification
          detail: >-
            User opens verification flow via web SDK, mobile app, or embedded link; no account creation or app download
            required
        - id: n2
          label: Document capture and OCR
          detail: >-
            User photographs or NFC-reads government-issued ID; proprietary OCR extracts and validates data fields; AI
            detects synthetic or tampered documents
        - id: n3
          label: Selfie capture with liveness
          detail: >-
            Device camera captures live selfie; passive liveness AI checks for deepfakes, masks, and video replays
            without user action prompts (active mode optional)
        - id: n4
          label: Biometric face match
          detail: >-
            Facial recognition model compares selfie against ID photo or GSOR biometric record; 20ms matching with 0.01%
            false match rate
        - id: n5
          label: Deepfake and injection detection
          detail: >-
            Deepsight layer checks device integrity, analyzes perception signals, and cross-validates against GSOR to
            block AI-injected content
        - id: n6
          label: Risk AI Agent holistic scoring
          detail: >-
            Aggregates all session signals (device, behavioral, biometric, document) in context; approves borderline
            sessions or flags for review without manual threshold rules
        - id: n7
          label: GSOR deterministic validation (optional)
          detail: >-
            Real-time check against AAMVA DLDV or state DMV for high-assurance verification; bypasses reliance on visual
            document inspection
        - id: n8
          label: Real-time pass / review / decline
          detail: >-
            Orchestration layer issues instant decision; approved users proceed immediately; review queue populated only
            for genuine edge cases
        - id: n9
          label: Ongoing monitoring and reverification
          detail: >-
            Identity checks continue at critical lifecycle moments (helpdesk, MFA reset, high-value transactions) using
            stored biometric profile
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n5
          to: n6
        - from: n6
          to: n7
        - from: n7
          to: n8
        - from: n8
          to: n9
    claimRefs:
