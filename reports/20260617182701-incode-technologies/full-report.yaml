              software-based delivery model with no hardware manufacturing or meaningful physical inventory; analyst
              benchmarks for comparable identity-verification SaaS companies suggest gross margins in the 70–80% range,
              but these are estimates, not reported figures.


              Customer acquisition cost and CAC payback period are unknown. The enterprise direct-sales motion targeting
              large banks and telcos implies long sales cycles (a SWOT analysis independently identifies this as a
              weakness) and potentially high selling costs per deal; counterbalancing this is the durability of
              multi-year contracts and expansion potential within large enterprise accounts. NRR is a critical unknown:
