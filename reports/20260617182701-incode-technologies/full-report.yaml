          - type: callout
            title: 'Deepfake Arms Race: Liveness Spoofing Is the Product Threat'
            body: >-
              Deepfake attacks on biometric liveness checks surged 700%+ between 2021 and 2023, injection attacks rose
              40% year-on-year, and synthetic identity fraud losses exceeded $35 billion globally in 2023. Incode's
              commercial differentiation rests on superior fraud detection; a documented high-volume bypass at a major
              bank customer would simultaneously threaten contractual renewals, trigger regulatory scrutiny, and
              undermine the valuation case. This risk cannot be permanently resolved—it requires ongoing R&D investment
              with no clear endpoint.
