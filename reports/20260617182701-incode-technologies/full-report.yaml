      - number: '3.2'
        title: Key Competitor Profiles
        blocks:
          - type: paragraph
            body: >-
              Jumio is a PE-backed IDV leader processing 120 transactions per second with 5,000+ document types, 300+
              patents, and an Identity Graph of 30 million+ known identities for continuous fraud intelligence.
              Entrust/Onfido, formed by Entrust's April 2024 acquisition, offers the broadest identity-centric security
              portfolio: AI-powered liveness, 2,500 document types across 195 countries, no-code workflow orchestration,
              and an installed base of 1,200+ global customers at $140M+ in annual revenue at acquisition. Sumsub is the
              smallest funded among major Leaders but leads on Gartner Completeness of Vision (2025), covering 14,000+
              document types, end-to-end AML/KYC/transaction monitoring, and non-document verification compliant in 20+
              countries in as little as 4.5 seconds. Veriff analyzes 1,000+ signals per session with 6-second average
