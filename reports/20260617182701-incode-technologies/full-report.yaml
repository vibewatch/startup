      - number: '2.3'
        title: Buyer Segmentation and Adoption Patterns
        blocks:
          - type: paragraph
            body: >
              The primary buyers of identity verification solutions cluster into five segments with distinct budget
              ownership and adoption triggers. Tier-1 LATAM commercial banks—including Incode customers BBVA Mexico,
              Banorte, and Santander Mexico—procure through annual IT and compliance budgets, driven by AML mandates and
              fraud cost reduction ROI. LATAM neobanks and digital lenders such as Kueski, Clip, and Nubank adopt
              through agile engineering budgets, motivated by onboarding conversion rates and drop-off reduction. Telcos
              such as Telcel, another disclosed Incode customer, are compelled by regulatory SIM fraud mandates.
              Government e-platforms require citizen identity proofing for benefit distribution and public services—a
              segment energized by Mexico's Biometric CURP launch in February 2026. US and cross-border financial
              institutions face FinCEN's Corporate Transparency Act (CTA) beneficial ownership requirements, expanding
              the addressable market northward. Veriff's published LATAM case studies with Kueski, Comun, Solventa, and
              Juancho te Presta corroborate that LATAM fintechs require IDV solutions that balance onboarding conversion
              against fraud prevention at scale. Budget ownership lies with CTO and CRO roles at banks and with
              compliance and legal leadership at cross-border institutions. Adoption is event-driven: regulatory
              changes, fraud surges, or new digital product launches typically open procurement cycles.
            claimRefs:
              - CM015
