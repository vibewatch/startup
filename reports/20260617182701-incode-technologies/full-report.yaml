    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              Incode Technologies, Inc. was founded on June 17, 2015 by Ricardo Amper in San Francisco, California,
              where the company remains headquartered at 101 Mission Street, Suite 900. Additional offices are
              maintained in Mexico City and Belgrade. Incode's core mission is to power a world of trust through
              AI-driven biometric identity verification, enabling enterprises to authenticate users via facial
              recognition, liveness detection, document analysis, and optical character recognition across the full
              identity lifecycle — customer onboarding (KYC/AML compliance), continuous authentication, and fraud
              prevention.


              The company serves financial services, telecommunications, government, healthcare, hospitality, and
              e-commerce sectors under a B2B SaaS model, monetizing through enterprise software licensing and API usage.
              Incode began as a consumer photo-sharing application before pivoting to AI-based biometric identity in
              2018 when management recognized a larger market opportunity. This pivot proved timely as COVID-19
              accelerated digital onboarding demand globally.


              Incode has earned significant independent recognition: Gartner named it a Leader in its inaugural Magic
              Quadrant for Identity Verification; it ranks in the NIST top ten for facial recognition accuracy in
              multiple categories; and it is the first provider globally to achieve iBeta Level 3 passive liveness
              detection certification on iOS and Android with zero errors. Compliance credentials include SOC 2 Type II,
              ISO/IEC 27001, ISO/IEC 30107-3 alignment, and Kantara IAL2, directly supporting regulated government and
              enterprise verticals.
