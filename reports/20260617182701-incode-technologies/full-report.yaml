            body: >-
              Incode does not publicly disclose gross margin, customer acquisition cost (CAC), net revenue retention
              (NRR), or churn figures. As a private company the only quantifiable unit-economics proxy available
              externally is revenue-per-employee — approximately $305K — which is competitive with enterprise SaaS
