  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              The identity verification (IDV), KYC, and biometric authentication market of 2026 features more than 100
              vendors across multiple competitive tiers: pure-play IDV specialists (Jumio, Veriff, Sumsub, Persona,
              Entrust/Onfido), AI-native fraud decisioning platforms (Socure), biometric specialists (iProov, AU10TIX),
              compliance-first data platforms (Trulioo, Mitek), and government/enterprise incumbents (IDEMIA, Thales).
              The 2024 inaugural Gartner Magic Quadrant for Identity Verification placed 11 vendors across four
              quadrants; Leaders were Sumsub, Socure, Entrust, Jumio, and Incode Technologies. In 2025, with 11 vendors
              again evaluated, Persona rose from Challenger to Leader (holding the highest Ability to Execute score),
              Sumsub gained the furthest Completeness of Vision, and Incode retained Leader status for the second
              consecutive year. Market consolidation is accelerating — Entrust acquired Onfido in April 2024 — and
              competition is bifurcating between full-platform orchestrators and point solutions for specific use cases.
              AI-generated fraud (deepfakes, synthetic identities, injection attacks) is reshaping buying criteria
              toward independent liveness certification, agentic AI defense, and end-to-end orchestration. IDEMIA and
              Thales compete primarily in government identity and border control and do not appear in the commercial IDV
              Magic Quadrant. Mitek Systems is the market's only public-company pure-play IDV provider (NASDAQ: MITK).
              The competitive positioning map below situates the key players on geographic breadth versus platform
              integration completeness.
