      - number: '7.4'
        title: Operational, Infrastructure, and Execution Risk
        blocks:
          - type: paragraph
            body: >-
              Incode's operational risks are dominated by the intersection of digital infrastructure dependence, rapid
              geographic expansion, and the challenge of scaling compliance operations across fragmented regulatory
              regimes.

              Cloud infrastructure concentration is inherent to any SaaS identity platform. Incode relies on public
              cloud (primarily AWS) for compute, storage, and global low-latency delivery. Any significant AWS outage,
              pricing change, or service-level breach would directly affect Incode's ability to serve real-time bank
              onboarding flows—a mission- critical workflow where even minutes of downtime can cost financial customers
              millions. Incode's FedRAMP Ready status (achieved November 2025) opens US federal contracts but has not
              yet reached FedRAMP Authorized, which constrains the most sensitive federal agency deployments and creates
              a multi-year procurement cycle.

              The MetaMap and AuthenticID acquisitions introduce integration and culture risk. Merging three
              AI-engineering organizations with different technology stacks, compliance histories, and geographic
              footprints simultaneously is operationally demanding. Any biometric data leak, system error, or customer
              support failure during the integration window could damage the Incode brand at the moment it is seeking to
              justify a $3B valuation.

              LATAM execution risk includes Mexican and broader regional digital fraud, which topped 14,500 million MXN
              in losses in 2024 alone per reported data. As Incode serves financial institutions across this
              environment, the company bears reputational risk when fraud slips through and contractual risk if
              service-level commitments are not met. ACLU and EFF have characterized biometric surveillance broadly as
              prone to systematic error with racial and demographic disparities, creating advocacy and media risk if
              Incode's technology is associated with high-profile failures.
