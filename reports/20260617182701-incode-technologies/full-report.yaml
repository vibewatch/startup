        title: AI/ML Model Infrastructure
        blocks:
          - type: paragraph
            body: >
              At the core of Incode's technical differentiation is an in-house machine learning factory. Alex Golunov,
              VP of ML Engineering, has publicly stated that Incode operates more than 100 proprietary machine learning
              models that authenticate every onboarding session, trained on a proprietary dataset exceeding 10 terabytes
              and spanning hundreds of millions of data points including images, video, structured text, and tabular
              datasets. Incode manages this infrastructure through ClearML's MLOps platform, using dynamic GPU
              allocation across AWS EC2 instances and on-premises GPU hardware through automated autoscaling. The latest
              model generation includes a Vision-Language Model (VLM) trained on global identity and document data
              across 200-plus regions, capable of few-shot adaptation to new attack types and unseen document formats; a
              Fraud LLM trained on proprietary fraud datasets, behavioral sequences, and device signals; and Reasoning
              Agents for risk intelligence. The VLM has demonstrated key performance improvements in production
              benchmarks: 67% fewer errors in fake ID detection, 4% gain in document tampering accuracy, 25% fewer
              errors in signature fraud detection, approximately 80% faster training cycles, and 0% Attack Presentation
              Classification Error Rate (APCER) on a challenging liveness benchmark dataset. Incode also operates a
              dedicated Internal Fraud Lab with 35-plus specialized AI models focused on document and biometric fraud
              patterns, continuously trained with real-world data from across Incode's network of customer deployments.
