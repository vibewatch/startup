  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform Overview & Orchestration
        blocks:
          - type: paragraph
            body: >
              Incode Omni is a unified, end-to-end identity verification and fraud prevention platform built around a
              central no-code orchestration layer. The platform centralizes document verification, facial biometrics,
              liveness detection, device risk analysis, KYC, and AML compliance into a single configurable workflow hub
              accessible through a drag-and-drop flow builder. Customers configure multi-step verification journeys by
              combining modules, business rules, and conditional logic without engineering involvement for common use
              cases; a full SDK and REST API surface supports deep custom integration. The orchestration dashboard
              provides real-time decisioning, case management, fraud analytics, and performance reporting in one place.
              Incode Omni positions itself as the single system of record for identity across the entire customer and
              employee lifecycle — from initial onboarding and KYC through ongoing authentication, reverification, and
              workforce helpdesk automation. The company claims 7.1 billion trust checks processed across its customer
              base as of mid-2026, including 4.1 billion identity verifications completed in calendar year 2024. Trusted
              deployments span eight of the ten largest U.S. banks, eight of nine top U.S. telecom providers, and the
              three largest global neobanks.
