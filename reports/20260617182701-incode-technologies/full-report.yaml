      - number: '5.5'
        title: Developer Integration & SDK Ecosystem
        blocks:
          - type: paragraph
            body: >
              Incode provides a comprehensive developer integration surface spanning web, mobile, and server
              environments. The Web SDK is published on npm as @incodetech/welcome, which had reached version 1.90.0
              with over 2,128 published versions as of June 2026. The SDK is TypeScript-compatible and provides three
              method categories: configuration and initialization, data capture (camera-based ID and selfie capture),
              and process data methods (ID validation, Face Match, and government validation calls). For mobile, Incode
              offers native SDKs for Android (minimum API level 23, covering 98.4% of Android devices) and iOS (minimum
              iOS 13, covering 99.6% of iOS devices). A React Native package (@incode-sdks/react-native-incode-sdk)
              supports optional NFC, Face Login, and video-call variants. iOS dependencies are distributed through a
              private GitHub Packages registry with credential-based access. Example integration repositories are
              maintained publicly at github.com/Incode-Technologies-Example-Repos, including a Next.js example
              showcasing core onboarding flows. The developer hub at developer.incode.com provides structured
              documentation for full SDK integration, low-code and no-code paths, API reference, and language-specific
              quickstarts. All integrations are required to run over HTTPS, and session tokens must be managed
              server-side to protect API keys. Webviews and social-media in-app browsers are explicitly unsupported for
              the Web SDK.
