  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Boundary
        blocks:
          - type: paragraph
            body: >
              The identity verification market encompasses solutions that authenticate a person's real-world identity
              through digital channels. Included spend covers document validation (passports, national IDs, driver's
              licenses), biometric liveness detection, facial recognition, fingerprint scanning, iris capture, automated
              e-KYC onboarding workflows, and AI-driven fraud screening at account opening. Adjacent spend includes
              anti-money laundering (AML) transaction monitoring, open banking consent infrastructure, and ongoing
              perpetual-KYC (pKYC) refresh services. Excluded from the core market boundary are general cybersecurity
              platforms unrelated to identity proofing, physical branch-based notarization, credit scoring engines, and
              payment gateway infrastructure itself. Incode competes primarily in the biometric liveness and e-KYC
              segments of this market, with a pronounced focus on LATAM financial institutions. Financial services
              (BFSI) accounts for approximately 30–33% of total identity verification spend and is the dominant demand
              engine. Cloud-based deployment now commands a 65–69% market share, enabling rapid API integration and
              continuous model updates—characteristics central to Incode's platform architecture. Status-quo substitutes
              include manual branch KYC, outsourced BPO identity review, and older rule-based document verification
              tools that lack real-time biometric liveness.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
