            title: 'BIPA Precedent: $4M Settlement Sets Replication Template'
            body: >-
              Incode settled Aspel v. Incode Technologies (1:23-cv-17093) for $4 million in November 2024 without
              admitting wrongdoing. The settlement covered Illinois residents who uploaded biometrics to Incode-powered
              apps between November 2018 and August 2024. This establishes that (a) Incode's historical consent
              workflows were legally contestable, and (b) plaintiffs' attorneys now have a proven template. With 100+
              BIPA class actions filed in 2025 and the Seventh Circuit's retroactivity ruling pending, the legal risk
              vector is not closed—it is actively managed.
