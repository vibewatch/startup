      - number: '1.5'
        title: Risks and Adverse Events
        blocks:
          - type: paragraph
            body: >-
              Incode faces several material risks that diligence must weigh alongside its commercial momentum. The most
              concrete adverse event is the BIPA class action lawsuit (Aspel v. Incode Technologies, Case No. 2023LA59),
              in which Incode settled for $4 million — without admitting wrongdoing — allegations that it collected
              facial geometry data from Illinois residents without proper BIPA consent between November 2018 and August
              2024. This signals a compliance gap in core biometric data collection workflows. As biometric privacy
              regulations expand across U.S. states and internationally, Incode's consent and disclosure practices will
              face ongoing scrutiny, creating material enterprise procurement risk in privacy-sensitive sectors.


              Key-person concentration on founder and CEO Ricardo Amper is a structural concern: he is the public face,
              fundraising lead, and product architect. Board composition and succession planning remain opaque for this
              private company. Headcount estimates vary across sources ($556 to $668), raising questions about
              post-acquisition integration of the AuthenticID team. The unconfirmed $150–300M fundraise at a $3B target
              — versus the last confirmed $1.25B — represents a 140% valuation step-up with limited independent
              corroboration. PremierAlts' conflicting $407M total-raised figure further underlines the need for full
              cap-table disclosure before a new investment closes.
            claimRefs:
              - CO005
              - CO026
              - CO027
              - CO028
              - CO040
