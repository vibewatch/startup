      - number: '1.3'
        title: Scale, Customers, and Market Traction
        blocks:
          - type: paragraph
            body: >-
              Incode's customer penetration in blue-chip financial services and telecom underscores its enterprise
              credentials. As of the August 2025 post-acquisition combined entity, Incode serves 8 of the 10 largest
              U.S. banks, 8 of the top 9 North American telcos, 4 of the top 5 Latin American banks, and all 3 of the
              world's top neobanks. Named or publicly inferable Latin American customers include BBVA and Banorte. The
              platform processed 4.1 billion identity checks in 2024.


              Revenue metrics show strong growth: ARR was reported at approximately $86.7 million in 2023 and climbed to
              approximately $170 million by mid-2025 — roughly 96% cumulative growth over two years. The company claimed
              80% year-on-year organic growth at the AuthenticID acquisition announcement in August 2025. With
              approximately 650–668 employees as of 2026 across San Francisco, Mexico City, and Belgrade, Incode
              maintains a lean headcount relative to revenue scale, implying high revenue productivity per employee.
              Financial metrics remain largely company-claimed or third-party estimated, as no audited financials are
              publicly available for this private company.
