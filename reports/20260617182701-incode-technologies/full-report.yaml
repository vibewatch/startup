      - number: '5.4'
        title: Anti-Fraud & Deepfake Defense
        blocks:
          - type: paragraph
            body: >
              Incode's Deepsight product is the company's multi-layered deepfake defense system. An independent
              benchmark by Shu Hu, Assistant Professor and Director of the Purdue Machine Learning Lab, evaluated nine
              major commercial deepfake detection systems and found Incode's detector achieved the highest accuracy,
              with a 68x better false-positive rate and 2.5x lower false-acceptance rate compared to the next-best
              commercial system. Deepsight defends across four attack surfaces: (1) injection attack prevention via
              native SDKs that block virtual cameras and device emulation before the capture process begins; (2)
              perception-layer analysis of biometric signals including blurriness, iris presentation, light reflection,
              and texture anomalies to identify synthetic images and videos; (3) deterministic verification against
              government systems of record to provide authoritative cross-checks; and (4) continuous model retraining
              via Incode's in-house R&D team and Fraud Lab. The platform detects a broad taxonomy of attacks: 2D masks,
              3D silicone masks, paper printouts, video replays, face swaps, face morphs, 2D synthetic AI-generated
              assets, and face reenactment videos. The Risk AI Agent, a complementary product, provides session-level
              holistic fraud decisioning by evaluating all risk signals in context without manual threshold
              configuration, adapting automatically to each customer's specific fraud and conversion patterns. Incode
              reports a 21x surge in deepfake fraud attempts over the three years prior to mid-2026 as a key market
              driver for these capabilities.
            claimRefs:
              - CE012
              - CE016
              - CE029
              - CE030
              - CE031
