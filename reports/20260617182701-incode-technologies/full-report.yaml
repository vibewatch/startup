      - number: '7.5'
        title: Risk Synthesis and Investment Implications
        blocks:
          - type: paragraph
            body: >-
              Incode's risk profile is elevated relative to a typical enterprise SaaS company, reflecting three
              compounding factors: (1) it operates at the intersection of biometrics and financial-services
              compliance—two sectors that attract the most regulatory and litigation attention; (2) it is concentrated
              geographically in LATAM/Mexico, which creates country and currency risk on top of operational risk; and
              (3) it is seeking capital at a premium valuation (~17.6x ARR) in a market where multiple compression is a
              live threat.

              The regulatory risk vector is the most structurally unavoidable. The EU AI Act, Mexico LFPDPPP, BIPA,
              Texas CUBI, and FTC enforcement constitute an expanding multi-jurisdictional compliance burden that will
              increase in cost and complexity regardless of Incode's internal choices. The BIPA settlement demonstrates
              this is not a theoretical risk: Incode has already paid $4M and agreed to compliance improvements. Future
              exposure from new BIPA filings (100+ per year), from Texas CUBI/TRAIGA, or from an EU AI Act enforcement
              action could be materially larger.

              The technology risk from deepfakes is simultaneously a threat and a market opportunity—Incode competes on
              its ability to defeat fraud, and the worse the fraud environment becomes, the more valuable a proven
              solution is. However, this creates an asymmetric reputation risk: one high-profile bypass that enables
              significant fraud at a major bank customer could trigger customer churn and regulatory scrutiny
              simultaneously.

              Thesis-break triggers for investors include: a new material biometric class action in Illinois (especially
              if post-2024 BIPA amendment retroactivity is resolved adversely); an EU AI Act enforcement action citing
              Incode for high-risk system non-compliance; a major bank customer churn event; evidence that the $3B
              valuation fundraise closed at a down-round to the 2022 Series B; or a documented high-volume deepfake
              bypass of Incode's liveness system.
            claimRefs:
              - CR001
              - CR010
              - CR027
              - CR028
              - CR044
