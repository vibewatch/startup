      - number: '5.7'
        title: Roadmap & Emerging Capabilities
        blocks:
          - type: paragraph
            body: >
              Incode's most significant product extension in late 2025 was Agentic Identity, announced in October 2025
              and entering pilot programs in Q4 2025. This system applies deepfake-resistant biometrics to verify
              autonomous AI agents, binding each agent to a verified human owner through biometric-backed cryptographic
              scope tokens with programmable expiration and revocation. The system enables continuous behavioral
              monitoring of agent activity, detecting anomalies or compromised agents and triggering automated or human
              responses. Agentic Identity integrates with Incode's existing identity suite and supports MCP and other
              agentic protocols, addressing enterprise concerns about AI agent impersonation, unauthorized transactions,
              and accountability in autonomous workflows. Chief Product Officer Roman Karachinsky described the goal:
              enabling enterprises to deploy AI agents "without compromising on fraud prevention or compliance." The
              Risk AI Agent capability provides complementary session-level holistic decisioning for human verification
              journeys, learning continuously from each customer's fraud and conversion patterns without requiring
              manual rule configuration. On the compliance roadmap, FedRAMP Ready status positions Incode to work toward
              full Authorization to Operate through an agency sponsor in 2026. The government sector roadmap is further
              supported by the Login.gov contract (announced December 2025) for next-generation identity proofing,
              delivered through subcontractor Diamond Capture Associates. These capabilities signal a deliberate
              expansion from private-sector financial services into regulated government and workforce identity markets.
