      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: LATAM Is a Structural Growth Market, Not a Niche
            body: >
              GSMA data shows LATAM mobile technology contributing USD 600 billion to the regional economy (8.6% of GDP)
              in 2025, with 795 active fintechs in Mexico alone and the Biometric CURP creating a national identity
              infrastructure for 130 million citizens. For Incode, LATAM is not a niche geography—it is a high-growth
              home market with regulatory, infrastructure, and customer tailwinds aligned to its core product thesis.
            calloutType: insight
            claimRefs:
              - CM017
              - CM015
              - CM022
          - type: callout
            title: Analyst Market Size Estimates Diverge by ~USD 3B—Sizing Uncertainty Is Material
            body: >
              The 2026 global IDV market estimates span USD 14.1B to USD 17.3B across six analyst firms—a 23%
              spread—reflecting genuine scope ambiguity between core identity verification, adjacent fraud prevention,
              and open banking authentication layers. Investors and operators should not treat any single analyst figure
              as the authoritative TAM; instead, the consensus midpoint (~USD 16B) with a ±USD 1.5B confidence interval
              is a more defensible working assumption.
            calloutType: risk
            claimRefs:
              - CM012
              - CM011
          - type: callout
            title: Regulatory Tailwinds Are Structural, Not Cyclical
            body: >
              FATF's effectiveness mandate, EU AMLA RTS (due July 2026), FinCEN's CTA requirements, and record USD 4.3
              billion in AML enforcement actions in 2024 collectively ensure sustained procurement demand for
              demonstrable KYC solutions. These are structural regulatory shifts rather than one-time compliance cycles,
              creating durable revenue visibility for vendors—like Incode—that offer defensible, audit-ready identity
              verification.
            calloutType: strength
            claimRefs:
              - CM024
              - CM025
