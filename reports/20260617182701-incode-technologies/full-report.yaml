            body: >-
              Incode's federal revenue stream crystallised in late 2025. In November 2025 Incode achieved FedRAMP Ready
              status, clearing a key prerequisite for U.S. federal procurement. In December 2025, Incode served as
              subcontractor to Diamond Capture Associates on a $37.4M contract awarded by the General Services
              Administration (GSA) Technology Transformation Services (TTS) under the Login.gov Next Generation Identity
              Proofing Blanket Purchase Agreement (NG BPA). The task order covers Remote Unsupervised Identity Proofing
              Solutions for the Login.gov digital identity platform, which provides access to participating government
              services for millions of U.S. citizens.


              The Incode share of the $37.4M total is not separately disclosed; as subcontractor the per-party split is
              a diligence gap. The contract nevertheless represents the most concrete evidence of U.S. government
              revenue to date, and the FedRAMP authorization level achieved supports expanded federal pipeline
              development in 2026 and beyond. Outside the United States, the May 2026 Interac exclusive partnership
              introduces a quasi-governmental channel through Canada's national payment network, covering
              government-sector use cases for digital identity verification across the Canadian market. Together these
              institutional contracts establish a diversified public-sector revenue base that reduces dependence on
              private-sector banking and telecom customers.
