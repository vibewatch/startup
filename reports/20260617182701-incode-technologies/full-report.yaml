      - number: '1.2'
        title: Funding History, Investors, and Valuation
        blocks:
          - type: paragraph
            body: >-
              Incode has raised approximately $260 million across three substantive rounds. A $10 million Seed in
              October 2019 (led by DILA Capital) provided first institutional validation. A $25 million Series A in
              March 2021 from DN Capital, 3L Capital, and Walter Ventures funded U.S. and LatAm expansion. The pivotal
              event was the December 7, 2021 Series B of $220 million, co-led by General Atlantic and SoftBank's LatAm
              Vision Fund with J.P. Morgan, Capital One Ventures, Coinbase Ventures, and SVCI — granting unicorn status
              at a $1.25 billion post-money valuation.


              As of November 2025, Bloomberg reported Incode was seeking $150–300M at a valuation of up to $3 billion,
              citing approximately $170M ARR and expanded market position following the AuthenticID acquisition and U.S.
              government contract wins. PremierAlts lists a market-implied valuation of $3 billion as of 2026, though no
              completed round has been publicly confirmed. A conflicting total-raised figure of $407M on PremierAlts
              versus the $260M reported by Tracxn and Crunchbase raises an unresolved diligence question about
              undisclosed tranches or secondary activity. The new round remaining unconfirmed is a material gap for
              valuation entry-point analysis.
