        - Signals market no longer accepts growth narrative; likely ARR or growth miss behind it
        - Immediate thesis invalidation; avoid further commitment pending full diagnostics
      - - ARR growth confirmed below 25% YoY
        - Audited or independently verified revenue showing growth < 25%
        - Reduces base-case multiple to 8–12x; makes $3B entry structurally expensive
        - Revise fair entry to ≤12x ARR; conditional on NRR and margin data
      - - U.S. government pipeline fails to convert
        - No follow-on federal contracts after Login.gov within 18 months
        - Reduces TAM expansion story; government segment was a key bull-case catalyst
        - Downgrade from track to avoid if also paired with slower commercial growth
      - - Major IDV customer defects to competitor
