  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization Mechanics
        blocks:
          - type: paragraph
            body: >-
              Incode's revenue architecture is a B2B SaaS model that monetises identity verification volume through
              tiered enterprise contracts. The primary mechanism is a usage-based API model — enterprise clients pay per
              verification "check" processed, with volume tiers offering declining per-unit costs at higher volumes.
              Contracts are typically structured as annual or multi-year commitments with minimum annual spend
              thresholds,  anchoring a recurring-revenue base that drives ARR. The company does not publish list
              pricing; all deals are closed via direct sales with custom quotes based on projected verification volume,
              feature scope (liveness, document verification, KYC/AML orchestration, deepfake detection), and
              integration complexity.


              Incode operates across three product families: Incode Smile (banking, payments, retail — digital
              onboarding and authentication), Incode Guard (law enforcement and physical security via smart glasses and
              body cameras), and a consumer photo-sharing product (Flashback/legacy pre-pivot). The enterprise identity
              platform is the dominant revenue contributor, with Incode Smile powering financial services and telecom
              clients including BBVA and Banorte. Government identity proofing has emerged as a distinct and growing
              revenue stream following the FedRAMP Ready certification in November 2025 and the $37.4M Login.gov
              subcontract in December 2025. The Interac exclusive Canadian partnership (May 2026, Q3 2026 rollout) adds
              a partner-mediated channel, licensing Incode's liveness and deepfake-detection technology to Canadian
              financial institutions. Revenue mix between these streams is not publicly disclosed.
            claimRefs:
