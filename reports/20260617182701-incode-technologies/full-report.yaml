  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              Incode operates in one of the most heavily regulated niches of enterprise software: biometric identity
              verification at scale in financial services. The company has already incurred direct legal exposure: in
              2024 it settled Aspel v. Incode Technologies, Inc. (N.D. Ill. 1:23-cv-17093) for $4 million, resolving
              allegations that it captured Illinois residents' facial geometry without the written consent required by
              BIPA. The case class covered users from November 2018 through August 2024, indicating a multi-year period
              during which consent workflows may have been insufficient.

              Looking forward, the regulatory landscape is tightening on every geographic front relevant to Incode. In
              the United States, Illinois BIPA continues to generate over 100 new class-action filings per year, and
              while the 2024 BIPA amendment limits "per-scan" damages, courts remain divided on retroactivity. The
              Seventh Circuit will issue a binding ruling in 2026 that could dramatically reshape pending-case exposure
              across the industry. Texas CUBI (Tex. Bus. & Com. Code §503.001), reinforced by the June 2025 TRAIGA AI
              law, now explicitly applies to AI systems that capture biometric identifiers, adding civil penalties up to
              $25,000 per violation enforced by the Texas Attorney General. The FTC, via its 2023 biometric policy
              statement, has committed to Section 5 FTC Act enforcement against unfair or deceptive biometric
              practices—and has already banned Rite Aid from facial recognition use for five years.

              In the EU, the AI Act becomes fully enforceable on August 2, 2026. Any real-time biometric identification
              in public spaces by law enforcement is banned; high-risk biometric systems face conformity assessments,
              risk documentation, and fines reaching €35 million or 7% of annual global turnover. Mexico—Incode's
              largest revenue geography—overhauled its LFPDPPP in March 2025 and dissolved the independent regulator
              INAI, transferring enforcement to the executive-branch SABG. Biometric data remains explicitly sensitive
              data requiring specific, informed, and free consent. Secondary regulations from SABG are still pending,
              creating compliance uncertainty.

              The Clearview AI precedent ($51.75M BIPA settlement via equity stake) demonstrates that class-action
              exposure can approach company-ending levels for biometric firms with large user populations. Incode's
              identity checks on behalf of bank and telco customers create a continuous pipeline of potentially exposed
              Illinois residents.
