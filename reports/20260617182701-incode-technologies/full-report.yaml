companyProfile:
  summary: >-
    Incode Technologies is a San Francisco- and Mexico City-based identity verification company founded in 2015 by
    Ricardo Amper. Its platform combines document verification, biometric face matching, and active/passive liveness
    detection into an end-to-end orchestration layer used by financial institutions, fintechs, telecoms, gaming
    operators, and government agencies, with an especially deep presence in Latin America. The company reached unicorn
    status with a $1.25B Series B in December 2021 and, by late 2025, was reported to be raising new capital at a
    valuation of up to $3 billion on the back of roughly $170M in annual recurring revenue.
