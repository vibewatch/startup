      - number: '5.2'
        title: Core Biometric Technology Stack
        blocks:
          - type: paragraph
            body: >
              Incode's biometric engine comprises three foundational pillars: facial recognition, liveness detection,
              and document verification. For facial recognition, proprietary deep learning models compare live selfie
              captures against ID document photos or government biometric databases, with facial matching completing in
              20 milliseconds and a claimed 0.01% false match rate. In the 2024 NIST Face Recognition Technology
              Evaluation (FRTE) 1:N identification test, Incode ranked first among all full-solution identity
              verification providers across multiple gallery types including Visa-Border, Mugshot-Webcam, and Visa-Kiosk
              datasets, evaluated against 1.6 million identity subjects with a False Positive Identification Rate
              threshold of 0.003. Liveness detection supports both active (user-prompted action) and passive (fully
              automated) modes. The passive liveness system was claimed to be the first globally to achieve iBeta's ISO
              30107-3 Level 2 evaluation, a test covering advanced spoofing attacks including 3D masks and AI-generated
              deepfakes. Document verification uses proprietary OCR that Incode claims is 25% more accurate than
