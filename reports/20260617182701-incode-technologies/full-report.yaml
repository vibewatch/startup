  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation Context and Current Entry Point
        blocks:
          - type: paragraph
            body: >-
              Incode's last externally price-setting event was its December 2021 Series B: $220 million raised at a
              $1.25 billion post-money valuation co-led by General Atlantic and SoftBank's LatAm Vision Fund. That marks
              an approximately 4.5-year gap to the current fundraise discussions. In November 2025 Bloomberg reported,
              and multiple outlets confirmed, that Incode was in preliminary talks to raise $150–300 million at a
              valuation of up to $3 billion, citing approximately $170 million in annual recurring revenue. The
              $3B/$170M ARR arithmetic implies an EV/ARR multiple of approximately 17.6x — a 140% step-up from the 2021
              mark.


              Secondary-market data aggregator PremierAlts lists Incode's market-implied valuation at $3.0 billion as of
              2026, consistent with the Bloomberg figure. Latka independently reports ~$170M ARR. However, no audited
              financials have been published, no completed round has been announced, and the round's structure
              (including preference terms) is undisclosed. The company also carries two secured debt obligations: J.P.
              Morgan Chase Bank was granted a security interest on Incode's assets on July 1, 2024, and TriplePoint
              Capital LLC recorded a further security interest on July 18, 2025 — both visible in USPTO patent
              assignment records. These debt tranches create prior claims on assets that reduce net equity value and are
              not reflected in the headline $3B talk valuation. Total capital raised ($262M per Crunchbase/Tracxn vs.
              $407M per PremierAlts) also remains unreconciled, suggesting possible undisclosed tranches or secondary
              activity.
