  - id: incode-differentiation-and-positioning
    title: Incode Differentiation and Positioning
    body: >-
      Incode differentiates from the competitive field on three durable vectors. First, LATAM-first
      identity infrastructure: no Gartner Leader competitor has built comparable LATAM product depth
      and distribution. Bitso — the leading digital financial services platform in Latin America —
      selected Incode as its regional identity infrastructure partner across Mexico, Argentina, Colombia,
      and Brazil, citing Incode's ability to deliver seamless experiences without compromising security.
      US-centric rivals including Socure (18 of 20 top US banks) and Persona (customers led by OpenAI,
      LinkedIn, Block) serve primarily US and global-north fintechs; their LATAM document support and
      regional compliance integration lag Incode. Second, end-to-end orchestration: the 2025 Gartner
      recognition highlighted Incode's deep connectivity to authoritative biometric issuing sources and
      vision-language models for document assessment as differentiating innovations, positioning Incode
      beyond a point solution into a Leader platform category. Third, proprietary passive liveness with
      deepfake defense: Incode processes 7B+ identity validations annually and observes automated
      AI-driven attacks rising from 3% of detected fraud in 2024 to 40% in the most recent quarter,
      underscoring the urgency of its liveness and deepfake defense investments. While iProov holds
      the highest independent liveness certification (CEN/TS 18099 High), iProov requires a separate
      document verification vendor — Incode's integrated single-platform approach reduces operational
      complexity for LATAM banks and fintechs deploying at scale.
    claimRefs:
      - CP007
      - CP015
      - CP018
      - CP019
      - CP023
      - CP033
      - CP036

  - id: moat-durability-and-competitive-risks
    title: Moat Durability and Competitive Risks
    body: >-
      Incode's competitive moat rests on LATAM customer lock-in, proprietary biometric models trained
      on regional data, and an end-to-end platform that reduces the number of vendors banks need to
      manage. Multiple risks threaten durability. Better-funded competitors — Persona ($418M total
      raised), Socure ($650–$744M), Trulioo ($477M) — could materially increase LATAM go-to-market
      investment, leveraging larger balance sheets to subsidize customer acquisition. Platform
      convergence is accelerating: Sumsub gained the furthest Completeness of Vision in Gartner 2025
      and Socure's 62% ARR growth signals formidable global expansion ambition. Commoditization is a
      real threat: AI cost reductions are compressing per-verification economics, reducing barriers to
      entry and squeezing per-transaction margins across the sector. iProov's CEN/TS 18099 High
      liveness certification could become a procurement standard that all biometric vendors — including
      Incode — will be required to match. Multi-homing is common in enterprise IDV: procurement teams
      frequently deploy 2–3 vendors to cover regional document gaps, limiting Incode's ability to
      displace incumbents in markets where Jumio or Entrust are already embedded. The absence of
      independent audited financials limits investors' ability to validate Incode's $170M ARR claim,
      margin structure, and customer concentration, representing a meaningful diligence gap. The moat
      durability register below maps each moat claim to its primary threat, severity, and diligence path.
    claimRefs:
