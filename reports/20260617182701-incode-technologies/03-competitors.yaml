  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: Incode-financials
      missingEvidence: >-
        Independent verification of Incode's $170M ARR, gross margin, and customer concentration
        (top-10 customers as share of ARR).
      whyItMatters: >-
        Without audited financials or independent verification, the ARR and margin claims supporting
        the LATAM moat narrative cannot be validated; overstatement risk affects moat durability
        assessment.
      diligencePath: >-
        Request audited P&L, top-customer concentration schedule, and net revenue retention data
        from management under NDA.
      relatedQuestionRefs:
        - QP013
        - QP021

    - type: missing-source
      severity: material
      topic: Incode-liveness-certification
      missingEvidence: >-
        Independent third-party certification for Incode's passive liveness (NIST FRVT, ISO 30107-3
        iBeta PAD Level 2, or CEN/TS 18099) to compare directly with iProov's Ingenium Level 4
        certification.
      whyItMatters: >-
        iProov's CEN/TS 18099 High certification is becoming a procurement standard (referenced in
        NIST 800-63-4); if Incode lacks comparable independent certification, it faces a risk of
        losing bids in high-assurance regulated markets.
      diligencePath: >-
        Request any existing iBeta PAD Level 2 or ISO 30107-3 certifications for Incode's liveness
        module; commission independent evaluation if not yet certified.
      relatedQuestionRefs:
        - QP015
        - QP023

    - type: missing-source
      severity: material
      topic: customer-switching
      missingEvidence: >-
        Documented evidence of customer switching or multi-homing rates in enterprise LATAM IDV
        deployments — specifically whether BBVA, Banorte, or Telcel Mexico run Incode alongside
        Jumio, Entrust, or Sumsub.
      whyItMatters: >-
        Multi-homing is common in IDV (enterprises run 2–3 vendors for regional coverage); if major
        LATAM anchor customers are also running alternative IDV vendors, the lock-in moat is weaker
