chapter:
  number: 3
  title: Competitors
  summary: >-
    The identity verification (IDV) and KYC market features more than 100 vendors across pure-play IDV
    specialists, AI fraud platforms, biometric point solutions, and government incumbents. In the 2025
    Gartner Magic Quadrant for Identity Verification (11 vendors evaluated), Incode retained its Leader
    position for the second consecutive year alongside Persona, Sumsub, Socure, and Entrust/Onfido.
    Incode differentiates on LATAM-first infrastructure, end-to-end biometric orchestration, and
    proprietary passive liveness; its primary risks are better-funded global competitors entering LATAM,
    pricing commoditization from AI, and limited independent financial disclosure to validate moat claims.

sections:
  - id: competitive-landscape-overview
    title: Competitive Landscape Overview
    body: >-
      The identity verification (IDV), KYC, and biometric authentication market of 2026 features more
      than 100 vendors across multiple competitive tiers: pure-play IDV specialists (Jumio, Veriff,
      Sumsub, Persona, Entrust/Onfido), AI-native fraud decisioning platforms (Socure), biometric
      specialists (iProov, AU10TIX), compliance-first data platforms (Trulioo, Mitek), and
      government/enterprise incumbents (IDEMIA, Thales). The 2024 inaugural Gartner Magic Quadrant for
      Identity Verification placed 11 vendors across four quadrants; Leaders were Sumsub, Socure,
      Entrust, Jumio, and Incode Technologies. In 2025, with 11 vendors again evaluated, Persona rose
      from Challenger to Leader (holding the highest Ability to Execute score), Sumsub gained the
      furthest Completeness of Vision, and Incode retained Leader status for the second consecutive year.
      Market consolidation is accelerating — Entrust acquired Onfido in April 2024 — and competition is
      bifurcating between full-platform orchestrators and point solutions for specific use cases.
      AI-generated fraud (deepfakes, synthetic identities, injection attacks) is reshaping buying
      criteria toward independent liveness certification, agentic AI defense, and end-to-end
      orchestration. IDEMIA and Thales compete primarily in government identity and border control and
      do not appear in the commercial IDV Magic Quadrant. Mitek Systems is the market's only
      public-company pure-play IDV provider (NASDAQ: MITK). The competitive positioning map below
      situates the key players on geographic breadth versus platform integration completeness.
    claimRefs:
      - CP024
      - CP032
      - CP015
      - CP014
      - CP010
    figureRefs:
      - FP001

  - id: key-competitor-profiles
    title: Key Competitor Profiles
    body: >-
      Jumio is a PE-backed IDV leader processing 120 transactions per second with 5,000+ document
      types, 300+ patents, and an Identity Graph of 30 million+ known identities for continuous fraud
      intelligence. Entrust/Onfido, formed by Entrust's April 2024 acquisition, offers the broadest
      identity-centric security portfolio: AI-powered liveness, 2,500 document types across 195
      countries, no-code workflow orchestration, and an installed base of 1,200+ global customers at
      $140M+ in annual revenue at acquisition. Sumsub is the smallest funded among major Leaders but
      leads on Gartner Completeness of Vision (2025), covering 14,000+ document types, end-to-end
      AML/KYC/transaction monitoring, and non-document verification compliant in 20+ countries in as
      little as 4.5 seconds. Veriff analyzes 1,000+ signals per session with 6-second average decisions
      across 230+ countries and 12,500+ government documents, underpinned by $192M+ in funding at a
      $1.5B valuation. Persona raised $200M Series D at $2B valuation (April 2025) and holds the highest
      Ability to Execute in the 2025 Gartner MQ, processing 300M+ verifications in 2024 with doubled
      revenue and customer count year-over-year. Socure dominates the US market with $340M+ ARR in Q1
      2026 (+62% YoY), a $4.5B valuation, 134% net dollar retention, 18 of 20 top US banks, and a
      FedRAMP-authorized AI decisioning platform (RiskOS). AU10TIX performs 180+ automated checks per
      identity and operates consortium fraud detection across 60+ companies, having authenticated 1B+
      identities and prevented over $24B in fraud. iProov is the world's first independently certified
      deepfake-resilient passive liveness provider (CEN/TS 18099 High + Ingenium Level 4) but offers no
      document verification, making it a complementary rather than full-stack competitor. Mitek (NASDAQ:
      MITK) serves 7,000+ organizations, was recognized as a Market Leader by Datos Insights in January
      2026, and grew its Fraud and Identity Solutions segment 30% YoY in Q1 FY26. Trulioo leads on
      global data breadth — 450+ data sources, 195 countries, 5B+ addressable consumers — but lacks
      biometric and liveness capabilities. IDEMIA Public Security and Thales operate in government-grade
      identity programs (600+ agencies and 115+ countries respectively) and compete in high-assurance
      government tiers, not the commercial SaaS IDV market.
