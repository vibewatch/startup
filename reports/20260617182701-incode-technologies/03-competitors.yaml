  - id: capability-and-pricing-comparison
    title: Capability and Pricing Comparison
    body: >-
      Document verification depth, passive liveness certification, AML/watchlist screening, no-code
      workflow orchestration, and LATAM-specific document support are the primary buying criteria for
      enterprise IDV buyers evaluating Incode and its peers. The feature matrix table shows the main
      vendors on these dimensions using Yes / Partial / No / Unknown designations based on fetched
      product pages and public documentation. Sumsub and Entrust/Onfido lead on AML coverage and
      no-code orchestration breadth. Persona leads on modular workflow customizability and agentic AI
      orchestration, with the deepest configurability for enterprise compliance teams. Socure leads on
      predictive fraud scoring and US identity network data depth. Incode leads on LATAM document
      coverage and biometric accuracy for regional ID formats, with proprietary passive liveness built
      for low-connectivity mobile environments that are prevalent in Latin America. iProov is the
      highest-independently-certified liveness provider but offers no document verification, requiring
      buyers to integrate a second vendor. Trulioo leads on global data coverage but lacks biometric
      and liveness capabilities entirely. On pricing, few vendors publicly disclose rates. Sumsub is an
      exception with stated rates of $1.35–$1.85 per verification (basic/compliance tiers). Veriff is
      estimated at $1.50–$3+ at scale. Jumio, Socure, and Entrust operate on custom enterprise contracts
      without public list pricing. Incode's pricing is not publicly disclosed. The capability map figure
      provides a scored comparison of six key vendors across five competitive dimensions.
    claimRefs:
