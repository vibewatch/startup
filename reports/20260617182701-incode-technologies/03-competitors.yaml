callouts:
  - calloutType: strength
    title: LATAM Lock-In as a Validated Competitive Moat
    body: >-
      Incode's selection by Bitso as the regional identity infrastructure partner across Mexico,
      Argentina, Colombia, and Brazil validates the LATAM moat at a meaningful scale. No other
      Gartner Leader competitor has a comparable LATAM-first product and go-to-market layer.
      With automated AI-driven fraud rising from 3% to 40% of detected attempts at Incode in
      a single year, the urgency for LATAM fintechs to adopt purpose-built liveness and
      deepfake defenses is intensifying, favoring Incode's positioning.
    claimRefs:
      - CP018
      - CP019
      - CP023
      - CP036

  - calloutType: risk
    title: Funding Asymmetry Creates LATAM Displacement Risk
    body: >-
      Socure ($650–$744M raised, $4.5B valuation, 62% ARR growth), Persona ($418M raised, $2B
      valuation), and Trulioo ($477M raised) all have materially larger balance sheets than
      Incode ($220M Series B at $1.25B, Dec 2021). If any of these competitors invests
      aggressively in LATAM go-to-market, they could displace Incode on price or by offering
      bundled US/LATAM coverage. The absence of an Incode capital raise since 2021 (pending
      reported 2025 fundraise at up to $3B valuation) extends this asymmetry.
    claimRefs:
      - CP005
      - CP008
      - CP009
      - CP017
      - CP036

  - calloutType: insight
    title: Gartner MQ Leader Status Validates Platform Positioning
    body: >-
      Incode's retention as a Gartner Leader in the 2025 Magic Quadrant for Identity Verification
      — for the second consecutive year, out of only 5 Leaders from 11 evaluated vendors —
      confirms its transition from a LATAM-regional point solution to a global enterprise
      identity platform. Gartner cited deep connectivity to authoritative biometric sources
      and vision-language models for document assessment as differentiating strengths.
    claimRefs:
      - CP015
      - CP026
      - CP033

