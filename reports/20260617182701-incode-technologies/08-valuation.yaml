  - id: thesis-antithesis
    title: Investment Thesis and Anti-Thesis
    body: >-
      The bull thesis rests on four compounding facts: Incode is growing fast
      in a structurally expanding market (identity fraud expected to grow 20%+
      annually), has blue-chip customer proof (8 of 10 largest U.S. banks, 8
      of 9 top North American telcos), has the only iBeta Level 3 passive
      liveness certification globally, and has demonstrated inorganic
      execution via the AuthenticID acquisition. The U.S. government pipeline
      — FedRAMP Ready status and the $37.4M Login.gov contract — represents
      a new growth surface that could push ARR significantly above the
      current $170M. If growth continues above 40% and Incode reaches
      $250M+ ARR with improving unit economics, the $3B entry becomes
      retrospectively attractive.


      The anti-thesis centers on valuation discipline. The 17.6x EV/ARR
      is ~5x above the public SaaS median (3.4x), ~25% above the freshest
      private IDV comp (Persona 14.2x), and 3.8x above the most recent IDV
      M&A exit (Onfido at 4.6x). Revenue is unaudited. The fundraise has
      not closed. Debt obligations from J.P. Morgan (2024) and TriplePoint
      (2025) create secured claims ahead of new equity. The company has not
      disclosed its path to profitability, EBITDA margin, or NRR — all of
      which are essential inputs for underwriting a 17.6x multiple. The
      competitive landscape is intensifying (Persona's $200M fresh round,
      Socure's ecosystem expansion, Veriff's authentication volume surge)
      and customers may push back on single-vendor concentration. Any
      significant macro SaaS multiple compression would bring the fair value
      of an entry at $3B underwater within 12–18 months.
