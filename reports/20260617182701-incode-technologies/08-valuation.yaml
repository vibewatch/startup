  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Round closes at or below $1.25B
        - Confirmed close at down-round valuation from the 2021 Series B
        - Signals market no longer accepts growth narrative; likely ARR or growth miss behind it
        - Immediate thesis invalidation; avoid further commitment pending full diagnostics
      - - ARR growth confirmed below 25% YoY
        - Audited or independently verified revenue showing growth < 25%
        - Reduces base-case multiple to 8–12x; makes $3B entry structurally expensive
        - Revise fair entry to ≤12x ARR; conditional on NRR and margin data
      - - U.S. government pipeline fails to convert
        - No follow-on federal contracts after Login.gov within 18 months
        - Reduces TAM expansion story; government segment was a key bull-case catalyst
        - Downgrade from track to avoid if also paired with slower commercial growth
      - - Major IDV customer defects to competitor
        - Loss of a top-5 banking client (Tier-1 U.S. bank) disclosed publicly
        - Signals product or pricing gap; raises concentration risk; NRR likely impaired
        - Reassess competitive moat and NRR; possible bear-case acceleration
      - - Debt covenant breach or forced restructuring
        - J.P. Morgan or TriplePoint triggers a material adverse change clause
        - Equity value at risk; prior debt claims could wipe out new investors
        - Immediate exit or avoid; restructuring would require full cap table diligence
    notes: >-
      Triggers are monitorable from public disclosures; internal KPI thresholds
      would require data-room access.
