chapter:
  number: 8
  title: Valuation and Investment Recommendation
  summary: >-
    Incode's $3 billion target valuation implies a ~17.6x EV/ARR multiple on
    $170M of company-claimed ARR — well above the March 2026 public SaaS
    median of 3.4x but broadly comparable to Persona's 14.2x fresh private
    round in April 2025. The target is supportable only if high growth (80%+
    YoY) continues, the government pipeline converts, and no audited
    financials surface a material shortfall. Debt obligations to J.P. Morgan
    (July 2024) and TriplePoint Capital (July 2025) add lien risk absent from
    any public disclosure. The recommendation is TRACK / research-more:
    compelling company, stretched entry price, insufficient evidence to
    underwrite at $3B with conviction.

sections:
  - id: valuation-context
    title: Valuation Context and Current Entry Point
    body: >-
      Incode's last externally price-setting event was its December 2021 Series
      B: $220 million raised at a $1.25 billion post-money valuation co-led by
      General Atlantic and SoftBank's LatAm Vision Fund. That marks an
      approximately 4.5-year gap to the current fundraise discussions. In
      November 2025 Bloomberg reported, and multiple outlets confirmed, that
      Incode was in preliminary talks to raise $150–300 million at a valuation
      of up to $3 billion, citing approximately $170 million in annual recurring
      revenue. The $3B/$170M ARR arithmetic implies an EV/ARR multiple of
      approximately 17.6x — a 140% step-up from the 2021 mark.


      Secondary-market data aggregator PremierAlts lists Incode's
      market-implied valuation at $3.0 billion as of 2026, consistent with the
      Bloomberg figure. Latka independently reports ~$170M ARR. However, no
      audited financials have been published, no completed round has been
      announced, and the round's structure (including preference terms) is
      undisclosed. The company also carries two secured debt obligations:
      J.P. Morgan Chase Bank was granted a security interest on Incode's
      assets on July 1, 2024, and TriplePoint Capital LLC recorded a further
      security interest on July 18, 2025 — both visible in USPTO patent
      assignment records. These debt tranches create prior claims on assets
      that reduce net equity value and are not reflected in the headline $3B
      talk valuation. Total capital raised ($262M per Crunchbase/Tracxn vs.
      $407M per PremierAlts) also remains unreconciled, suggesting possible
      undisclosed tranches or secondary activity.
