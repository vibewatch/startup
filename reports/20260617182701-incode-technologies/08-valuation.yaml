callouts:
  - calloutType: insight
    title: Persona Is the Anchor Comp
    body: >-
      Persona's April 2025 Series D at $2B / $141M ARR = 14.2x EV/ARR is the
      most recent, structurally comparable private IDV round. Incode's $3B
      target at 17.6x carries a 24% premium to Persona — a premium that must
      be justified by higher verified growth, superior NRR, or stronger moat.
      Neither can be confirmed from public sources alone.
    claimRefs:
      - CV021
      - CV023
      - CV036
      - CV037

  - calloutType: risk
    title: Debt Liens Are an Undisclosed Complication
    body: >-
      USPTO patent assignment records show J.P. Morgan Chase Bank granted a
      security interest on Incode's assets on July 1, 2024 (REEL/FRAME
      067887/0333), and TriplePoint Capital LLC recorded a further security
      interest on July 18, 2025 (REEL/FRAME 071781/0603). These liens are not
      mentioned in any public funding announcement and reduce the net equity
      value that new investors would access at the $3B headline price.
    claimRefs:
      - CV007
      - CV008
      - CV044

  - calloutType: recommendation
    title: Track at $3B; Buy at 12–15x ARR
    body: >-
      The recommendation is TRACK at the current $3B ask. Entry at 12–15x
      ARR ($2.0–2.5B) would provide a margin of safety consistent with
      Persona's fresh comp and current private SaaS market conditions.
      Upgrading to buy requires: (1) audited financials confirming $170M+
      ARR; (2) confirmed round close with disclosed preference terms; (3)
      NRR and Rule of 40 data above peer thresholds; and (4) clarity on
      JPMorgan/TriplePoint debt obligations.
    claimRefs:
      - CV005
      - CV033
      - CV036
      - CV042
      - CV044

