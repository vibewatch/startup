  - id: recommendation
    title: Recommendation and Conviction
    body: >-
      Recommendation: TRACK / research-more. Confidence: Medium. Risk rating:
      High. Valuation stance: Stretched.


      Incode is a genuine category leader in AI-powered biometric identity
      verification with strong customer proof, impressive growth claims, and
      expanding U.S. government traction. However, the $3B target at 17.6x
      EV/ARR is priced for perfection — well above the public SaaS median,
      the freshest private IDV comp (Persona at 14.2x), and the last IDV M&A
      exit (Onfido at 4.6x). The multiple compression that has hit public
      SaaS since early 2026 (median EV/Revenue now 3.4x) increases the risk
      that the round closes at a lower valuation or not at all.


      The recommendation is not avoid: Incode has the growth, customer
      quality, and market position to eventually justify a valuation in this
      range. But conviction at $3B requires audited financials confirming
      the $170M ARR and growth rate, full transparency on the preference
      overhang and debt terms, Rule of 40 metrics, and NRR data. Absent
      those disclosures, entry at $3B provides limited margin of safety.
      Investors who can negotiate a lower entry price (e.g., 12–15x ARR =
      $2.0–2.5B) or structured downside protection would face a materially
      different risk/return. Monitor the round close for terms and the next
      annual revenue update for growth-rate confirmation before upgrading to
      buy.
