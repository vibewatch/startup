  - id: scenarios
    title: Bull, Base, and Bear Valuation Scenarios
    body: >-
      Three scenarios bound the range of outcomes under different
      assumptions about ARR growth, multiple, and exit path. In the bull
      case, Incode continues at 40%+ growth, reaches $250–300 million ARR
      by 2027, secures large U.S. federal government contracts via the $37.4M
      Login.gov award (with follow-on), and IPO conditions reopen at 12–14x
      forward ARR — implying a $3.5–4.5 billion enterprise value and
      supporting the $3B entry price. This requires multiple dependent
      catalysts: sustained growth above peer median, audited financials that
      validate current ARR, and an IPO window that has remained largely
      closed for private SaaS since 2022. In the base case, growth
      normalizes to 20–30% YoY, ARR reaches $200–220M by 2027, and the
      company prices a round in the 12–16x ARR range — consistent with
      Persona's April 2025 comp — implying a $2.4–3.2B valuation. The
      current $3B ask sits at the high end of the base range but is not
      unreachable if near-term execution holds. In the bear case, growth
      slows below 15% (sector macro compression), public SaaS multiples
      remain at 3–5x, and M&A acquirers price exits at 5–8x ARR, implying
      a $0.9–1.5B valuation — a potential down-round from the $1.25B 2021
      mark. The bear scenario is non-trivial given that: (a) the round has
      not yet closed; (b) ARR is company-claimed and unaudited; and (c)
      debt holders (JPMorgan, TriplePoint) have prior claims if the company
      needed a restructuring.
