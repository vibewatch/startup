  - id: comparable-benchmarks
    title: Comparable Transactions and Market Benchmarks
    body: >-
      No perfect IDV comparable exists at Incode's exact scale and growth rate,
      but four private-round comps and two public-company comps bound the
      analysis. On the private-growth side, Persona's April 2025 Series D at
      $2.0 billion on roughly $141 million ARR implies 14.2x EV/ARR — the most
      recent and structurally closest analog (B2B IDV SaaS, AI-native,
      high-growth). This makes Persona the anchor comp. Incode's 17.6x ask
      carries a ~24% premium to Persona, which must be justified by higher
      growth certainty, deeper moat, or better margin profile — none of which
      are fully documented publicly. Socure's $4.5B Series E in November 2021
      at an implied ~60x ARR is too dated and priced at peak-ZIRP to serve as
      a live benchmark. Veriff's $1.5B at January 2022 also embeds a dated
      vintage multiple (~36x on 2024 ARR) that does not reflect current market
      conditions.


      On the M&A exit side, Entrust's April 2024 acquisition of Onfido for
      confirmed $650 million — on more than $140 million in annual revenue —
      implies a ~4.6x EV/Revenue multiple. That is the clearest recent exit
      comp and underscores that M&A exit multiples for IDV are roughly 4–5x
      ARR, far below the growth-round ask of 17.6x. The spread between exit
      and growth-round multiples is typical but creates meaningful exit risk:
      if Incode cannot IPO or finds only strategic acquirers, the exit multiple
      could compress materially.


      Among public comps, Mitek Systems (MITK) trades at roughly 4.3x
      price/revenue on $179.7 million in FY2025 revenue and a ~$775 million
      market cap. CLEAR Secure (NYSE: YOU) trades at roughly 7.6x on $900.8
      million in FY2024 revenue and a ~$7 billion market cap. Both are public
      and liquid, but CLEAR is a consumer biometrics company and Mitek is
      slower-growing (4% YoY) — neither directly captures Incode's
      high-growth AI-native profile. The public SaaS sector median
      EV/Revenue fell to 3.4x in March 2026, reflecting macro-driven multiple
      compression from AI disruption fears and slowing growth rates. Only
      AI-native, high-NRR, Rule of 40-passing companies sustain multiples
      above 9–12x in private deals, and even that top quartile sits below
      Incode's target of 17.6x.
