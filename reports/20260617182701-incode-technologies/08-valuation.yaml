  - id: TV006
    title: Final Diligence Asks Table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Audited financials
        - Full GAAP-audited P&L and balance sheet confirming $170M ARR, gross margin, and NRR
        - Without audited figures, all valuation multiples are built on company-claimed data; any shortfall re-prices entry materially
        - Request Big-4 audited statements for FY2024 and FY2025 as condition of term sheet
      - - Capital structure and debt terms
        - Full cap table, preference stack from 2021 Series B, JPMorgan debt terms, TriplePoint debt terms, and seniority waterfall
        - Prior claims from two debt tranches reduce net equity value below the headline $3B
        - Require full cap table from company counsel; verify via USPTO security interest filings (REEL/FRAME 067887/0333 and 071781/0603)
      - - Rule of 40 and operating efficiency
        - EBITDA margin, free cash flow, CAC payback period, and NRR data
        - These metrics determine whether 17.6x is justified vs. compressed; Persona disclosed Rule of 40 credibly at its $2B round
        - Request CFO metrics package; cross-reference with large enterprise reference calls
      - - Round terms and preference overhang
        - Liquidation preferences, anti-dilution provisions, pay-to-play, and down-round protection from the new round
        - Unfavorable terms can erode common equity value in any outcome other than a large IPO
        - Request term sheet and charter amendment; model exit scenarios with preference waterfall
      - - Government contract pipeline
        - Full value, scope, and exclusivity terms of Login.gov contract and any pending federal awards
        - Government segment was the primary bull-case catalyst; concentration and renewal risk matter
        - Request contract disclosures via FOIA (GS-10F or similar) or direct company provision
    notes: >-
      Diligence asks are ordered by materiality; items 1 and 2 are gating
      conditions for any investment at or near $3B.
