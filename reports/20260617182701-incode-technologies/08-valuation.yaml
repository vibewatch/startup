  - id: exit-readiness
    title: Exit Readiness and Final Diligence Asks
    body: >-
      Incode is not publicly listed and has no disclosed IPO timeline.
      The company's strong revenue growth, blue-chip customer base, and
      government contract wins are positive signals for eventual public
      market readiness, but several structural prerequisites are absent.
      First, no audited financial statements are publicly available, making
      independent verification of the $170M ARR and 80% growth claim
      impossible from public sources. Second, the preference stack from the
      2021 Series B plus the 2024 J.P. Morgan and 2025 TriplePoint debt
      obligations creates a complex capital structure that could require
      significant disclosure in an S-1 filing. Third, Rule of 40 metrics,
      NRR, gross margin, and CAC payback — the key inputs that IPO investors
      and late-stage buyers scrutinize — are all undisclosed. Without these
      metrics, the $3B ask is difficult to underwrite with high conviction.


      The most credible exit path is a strategic acquisition by a large
      enterprise security player (Entrust, Microsoft, Ping Identity/Thales,
      or a payments network) or a late-stage private buyout. The Onfido
      precedent (4.6x ARR) suggests M&A exits in this segment trade at a
      significant discount to growth-round multiples. An IPO would require
      audited financials, demonstrated profitability path, and an IPO window
      that favors SaaS — conditions that have been intermittent since 2022.
