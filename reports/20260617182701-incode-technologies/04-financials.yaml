  - id: TI005
    title: Public Financial Gaps — Diligence Blockers
    columns:
      - Missing Metric
      - Why It Matters for Underwriting
      - Consequence if Unavailable
      - Diligence Path
    rows:
      - - Audited GAAP revenue and ARR reconciliation
        - Validates company-claimed $170M ARR against recognized revenue
        - Cannot distinguish ARR from GAAP revenue; recognition policy for multi-year deals opaque
        - Request prior-2-year audited financial statements with revenue footnotes
      - - Gross margin (software vs. services split)
        - Drives LTV, payback period, and ultimate unit-economics viability
        - Cannot determine whether SaaS premium is justified or eroded by services costs
        - Request segment gross margin schedule from CFO; distinguish API fees vs. professional services
      - - Net Revenue Retention (NRR)
        - Primary signal for product stickiness and upsell health in enterprise B2B
        - High customer brand (top banks/telcos) does not guarantee high NRR without data
        - Request cohort-level NRR by vintage year (2019–2024)
      - - Monthly burn rate and runway
        - Determines whether the November 2025 raise was necessity-driven or growth-opportunistic
        - If undisclosed and round not confirmed closed, capital adequacy is uncertain
        - Request trailing-12-month cash P&L; confirm board-approved runway projection
      - - New-round valuation and close confirmation
        - $3B target vs. $1.25B confirmed; 140% step-up without verified close is unpriced risk
        - Entry-point investors face unknown reference price if no confirmed round exists
        - Obtain signed term sheet or disclosure memo; check SEC EDGAR Form D filings by Incode Technologies Inc
      - - Total raised discrepancy ($260M vs. $407M)
        - Material conflict between Tracxn/Crunchbase ($260M) and PremierAlts ($407M)
        - Unexplained $147M gap may represent undisclosed debt, secondary, or data error
        - Request complete cap-table history with closing dates and amounts from counsel
      - - Customer concentration (revenue by top-10 accounts)
        - 8 of 10 U.S. top banks as customers implies potential single-vertical concentration
        - Churning 2–3 anchor accounts could materially impact ARR and growth rate
        - Disclose percentage of ARR from top-5 and top-10 customers
      - - Incode's subcontractor revenue share ($37.4M Login.gov)
        - Total BPA value is $37.4M; Incode's share as subcontractor is unknown
        - Overstates government revenue if Incode share is, e.g., 20–30% of the total
        - Obtain task-order subcontract disclosing Incode's scope, deliverables, and revenue
    notes: >-
      This table documents financial information gaps that currently prevent a
      fully grounded underwriting of Incode's financial position. Items are
      ordered roughly by materiality. "Diligence Path" entries assume investor
      access to a data room for a contemplated primary or secondary transaction.
