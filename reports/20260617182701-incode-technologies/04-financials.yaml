  - id: capital-adequacy-funding
    title: Capital Adequacy and Funding Profile
    body: >-
      The Company Overview chapter documents the full funding chronology.
      In summary: Incode raised a $10M Seed (October 2019, DILA Capital),
      a $25M Series A (March 2021, DN Capital / 3L Capital / Walter Ventures),
      and a $220M Series B (December 2021, General Atlantic and SoftBank
      LatAm Vision Fund co-lead, with J.P. Morgan, Capital One Ventures,
      Coinbase Ventures, and SVCI). Total confirmed capital raised is
      approximately $255M ($10M + $25M + $220M). Tracxn independently
      reports $260M total raised (near-match for the three disclosed rounds).
      PremierAlts carries a conflicting $407M figure — a material discrepancy
      with no public explanation, possibly reflecting undisclosed tranches,
      debt facilities, or secondary activity.


      In November 2025, Bloomberg reported Incode was in preliminary talks to
      raise $150M–$300M at an implied valuation of up to $3B. The secondary
      database Gaebler (sourcing VentureDeal) records a $300M round as
      "secured" on November 20, 2025, naming General Atlantic, Capital One,
      and Coinbase Ventures as backers. No formal press release or SEC
      Form D filing has been located confirming a closed round, and Bloomberg's
      original reporting used the language "in talks" and "preliminary." This
      conflict is material: if the round closed as Gaebler states, Incode's
      total raised rises to approximately $555M and the $3B valuation may be
      set; if still open, capital adequacy is more uncertain.


      With approximately $255M raised through the 2021 Series B and four-plus
      years elapsed, the key capital adequacy question is monthly cash
      consumption relative to the residual Series B balance. No public cash
      position, burn rate, or runway figures exist. The strong ARR growth
      trajectory suggests reduced burn dependency if the business is
      approaching cash-flow breakeven, but no such confirmation has been made.
