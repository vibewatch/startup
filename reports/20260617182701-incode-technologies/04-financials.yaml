callouts:
  - calloutType: risk
    title: Unconfirmed New Round Is the Top Financial Risk
    body: >-
      Bloomberg reported Incode in "preliminary talks" to raise $150M–$300M
      at up to $3B valuation in November 2025. A secondary database (Gaebler/
      VentureDeal) records a $300M close on November 20, 2025. No official
      press release, SEC Form D, or investor announcement has been located.
      Investors should independently confirm close status before accepting
      the $3B as a reference valuation. If the round has not closed, runway
      from the 2021 Series B — now more than four years old — is a material
      capital-adequacy concern.
    claimRefs:
      - CI009
      - CI010
      - CI020
      - CI022

  - calloutType: strength
    title: Revenue-per-Employee Signals High Operating Leverage
    body: >-
      At ~$305K ARR per employee (based on $170M ARR / 556 staff), Incode
      compares favourably to enterprise SaaS benchmarks for companies in the
      $100M–$200M ARR range, which typically achieve $200K–$350K per head.
      The absence of hardware manufacturing or large-scale professional services
      headcount supports the thesis that gross margins are structurally high.
      This is a corroborated proxy for capital efficiency even without
      disclosed margin data.
    claimRefs:
      - CI015
      - CI016
      - CI035

  - calloutType: risk
    title: 17.6x ARR Multiple Requires Sustained Hyper-Growth to Justify
    body: >-
      The $3B valuation target implies ~17.6x trailing ARR ($170M). Public
      enterprise SaaS companies traded at 8–12x revenue in 2024–2026.
      Incode would need to sustain 40%+ annual growth for 3+ years while
      approaching profitability to defend this multiple at a future liquidity
      event. Any macro-driven slowdown, competitive pricing pressure, or
      customer concentration event (e.g., loss of a large bank contract) could
      require a down-round at the next primary raise.
    claimRefs:
      - CI011
      - CI031
      - CI025
      - CI026

