  - id: government-contracts-institutional
    title: Government Contracts and Institutional Revenue
    body: >-
      Incode's federal revenue stream crystallised in late 2025. In November
      2025 Incode achieved FedRAMP Ready status, clearing a key prerequisite
      for U.S. federal procurement. In December 2025, Incode served as
      subcontractor to Diamond Capture Associates on a $37.4M contract awarded
      by the General Services Administration (GSA) Technology Transformation
      Services (TTS) under the Login.gov Next Generation Identity Proofing
      Blanket Purchase Agreement (NG BPA). The task order covers Remote
      Unsupervised Identity Proofing Solutions for the Login.gov digital
      identity platform, which provides access to participating government
      services for millions of U.S. citizens.


      The Incode share of the $37.4M total is not separately disclosed; as
      subcontractor the per-party split is a diligence gap. The contract
      nevertheless represents the most concrete evidence of U.S. government
      revenue to date, and the FedRAMP authorization level achieved supports
      expanded federal pipeline development in 2026 and beyond. Outside the
      United States, the May 2026 Interac exclusive partnership introduces
      a quasi-governmental channel through Canada's national payment network,
      covering government-sector use cases for digital identity verification
      across the Canadian market. Together these institutional contracts
      establish a diversified public-sector revenue base that reduces dependence
      on private-sector banking and telecom customers.
    claimRefs:
      - CI012
      - CI013
      - CI023
      - CI024
    tableRefs: []

  - id: financial-risk-assessment
    title: Financial Risk and Adverse Assessment
    body: >-
      The most significant financial risk is valuation multiple compression.
      Incode's $3B target valuation represents approximately 17.6x its $170M
      ARR — a multiple materially above typical enterprise SaaS public comps
      (which traded at 8–12x in 2024–2026) and above best-in-class private-
      market benchmarks for companies at this ARR scale. The 140% step-up
      from the confirmed 2021 valuation of $1.25B is justified by ARR nearly
      doubling, but requires sustained growth well above 50% annually to
      avoid multiple compression at exit.


      A SWOT analysis of Incode identifies the following structural weaknesses:
      brand awareness lagging Jumio and Onfido; long enterprise sales cycles
      that strain resources and delay revenue; pricing pressure from lower-cost
      alternatives; and heavy reliance on financial services and telecom
      verticals, which are susceptible to macro-driven budget cuts. The
      deepfake-driven commoditization threat — where big-tech players bundle
      liveness detection into cloud platforms at near-zero marginal cost —
      could erode Incode's pricing power. Profitability timing is unknown:
      the company does not disclose whether it is EBITDA positive, cash-flow
      positive, or still burning capital from the 2021 Series B.


      Burn rate uncertainty is material. If the $300M new round has not
      closed, Incode may be approaching the end of its 2021 Series B runway
      in 2026. No layoff signals, restructuring notices, or credit-facility
      disclosures have been identified, which is a mild positive indicator —
      but the absence of adverse signals for a private company does not
      constitute positive evidence of a strong cash position.
    claimRefs:
      - CI011
      - CI025
      - CI026
      - CI027
      - CI028
      - CI031
      - CI020
