  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: fundraising
      missingEvidence: >-
        Confirmed close documentation for the November 2025 funding round
        (term sheet, SEC Form D, or official press release)
      whyItMatters: >-
        Bloomberg says Incode was "in talks" (Nov 19, 2025); Gaebler records
        a $300M close on Nov 20, 2025. If the round is unclosed, the $3B
        reference valuation is unset and runway from the 2021 Series B is
        in question.
      diligencePath: >-
        Check SEC EDGAR for Form D filings by Incode Technologies Inc.; request
        investor confirmation letter or signed term sheet directly from
        management.
      relatedQuestionRefs:
        - QI009
        - QI023
        - QI024

    - type: private-evidence-only
      severity: material
      topic: burn-rate
      missingEvidence: >-
        Monthly cash burn rate, cash on hand as of the most recent quarter,
        and board-approved runway projection
      whyItMatters: >-
        With four-plus years elapsed since the 2021 Series B, the residual
        cash balance and burn profile determine whether the new fundraise is
        defensive (near-zero runway) or opportunistic. Without this data,
        capital adequacy cannot be assessed.
      diligencePath: >-
        Request trailing-12-month P&L, balance sheet, and cash-flow statement
        from CFO as part of data-room access; cross-reference headcount
        growth for a rough burn proxy.
      relatedQuestionRefs:
        - QI023

    - type: private-evidence-only
      severity: material
      topic: gross-margin
      missingEvidence: >-
        Audited gross margin, broken down between software (API fees) and
        professional services components
      whyItMatters: >-
        Gross margin is the primary determinant of long-run profitability
        and LTV in enterprise SaaS. If professional services are 20%+ of
        revenue at sub-50% margin, blended gross margin may be substantially
        below the 70–80% SaaS benchmark.
      diligencePath: >-
        Request GAAP income statement with revenue and cost-of-goods-sold
        by segment; clarify whether government task-order revenue carries
        different margin profile.
      relatedQuestionRefs:
        - QI019

    - type: private-evidence-only
      severity: material
      topic: NRR
      missingEvidence: >-
        Net Revenue Retention (NRR) by cohort vintage (2019–2024) with
        gross churn and expansion components separately identified
      whyItMatters: >-
        NRR is the most critical forward-looking revenue-quality metric.
        Given 80% reported growth, decomposing organic vs. expansion ARR
        vs. new-logo ARR is essential to assess durability.
      diligencePath: >-
        Request cohort-level ARR waterfall from VP Sales/RevOps; obtain
        logo retention rate and NRR by geography (LatAm vs. US vs. Canada).
      relatedQuestionRefs:
        - QI019

    - type: conflicting-data
      severity: material
      topic: total-raised
      missingEvidence: >-
        Reconciliation of the $147M discrepancy between the confirmed three-round
        total ($255–260M) and PremierAlts' $407M figure
      whyItMatters: >-
        The unexplained $147M could represent venture debt, a bridge note,
        secondary liquidity, or a fourth undisclosed round. Each has different
        dilution, governance, and covenant implications.
      diligencePath: >-
        Obtain cap table from counsel with all equity and debt instruments;
        search PremierAlts methodology for whether they include venture debt
        or secondary transactions.
      relatedQuestionRefs:
        - QI007

    - type: missing-source
      severity: minor
      topic: business-registration
      missingEvidence: >-
        Formal business registration filing for Incode Technologies Inc.
        confirming Delaware C-corporation status, registered agent, and
        date of incorporation
      whyItMatters: >-
        Jurisdiction of incorporation affects governance, fiduciary duties,
        liquidation preference waterfall, and tax structure. OpenCorporates
        returned a captcha-blocked response; the company's exact legal entity
        structure was not independently verified in this research cycle.
      diligencePath: >-
        Query Delaware Division of Corporations search tool or OpenCorporates
        directly; request certificate of good standing from legal counsel.
      relatedQuestionRefs:
        - QI013

    - type: missing-source
      severity: minor
      topic: sales-efficiency
      missingEvidence: >-
        CAC, CAC payback period, and typical enterprise sales cycle length
        for Incode's identity verification deals
      whyItMatters: >-
        Without CAC data, the 80% growth rate cannot be translated into
        a sustainable unit-economics model; high CAC could offset the
        strong ARR-per-employee metric.
      diligencePath: >-
        Request historical sales and marketing spend vs. new ARR from CFO;
        interview Incode's head of sales for cycle-length benchmarks.
      relatedQuestionRefs:
        - QI029

    - type: missing-source
      severity: minor
      topic: cost-structure
      missingEvidence: >-
        Disaggregated cost-of-revenue breakdown showing compute/inference
