company:
  name: Incode Technologies
chapter:
  number: 4
  title: Financials
  summary: >-
    Incode Technologies reported ~$170M ARR in mid-2025 on 80% year-on-year
    organic growth, confirming a capital-efficient SaaS scale-up with a reported
    revenue-per-employee of ~$305K. The company's last confirmed post-money
    valuation of $1.25B (December 2021 Series B) contrasts sharply with a
    $3B target valuation disclosed in November 2025 talks — implying an
    ~18x ARR multiple that stretches peer benchmarks. A $37.4M U.S. government
    contract (December 2025) anchors public-sector traction. Core financial
    unknowns — burn rate, gross margin, NRR, and new-round close status —
    remain private and unverifiable, constituting material diligence blockers.

sections:
  - id: revenue-model-monetization
    title: Revenue Model and Monetization Mechanics
    body: >-
      Incode's revenue architecture is a B2B SaaS model that monetises identity
      verification volume through tiered enterprise contracts. The primary
      mechanism is a usage-based API model — enterprise clients pay per
      verification "check" processed, with volume tiers offering declining
      per-unit costs at higher volumes. Contracts are typically structured as
      annual or multi-year commitments with minimum annual spend thresholds, 
      anchoring a recurring-revenue base that drives ARR. The company does not
      publish list pricing; all deals are closed via direct sales with custom
      quotes based on projected verification volume, feature scope (liveness,
      document verification, KYC/AML orchestration, deepfake detection), and
      integration complexity.


      Incode operates across three product families: Incode Smile (banking,
      payments, retail — digital onboarding and authentication), Incode Guard
      (law enforcement and physical security via smart glasses and body cameras),
      and a consumer photo-sharing product (Flashback/legacy pre-pivot). The
      enterprise identity platform is the dominant revenue contributor, with
      Incode Smile powering financial services and telecom clients including
      BBVA and Banorte. Government identity proofing has emerged as a distinct
      and growing revenue stream following the FedRAMP Ready certification
      in November 2025 and the $37.4M Login.gov subcontract in December 2025.
      The Interac exclusive Canadian partnership (May 2026, Q3 2026 rollout)
      adds a partner-mediated channel, licensing Incode's liveness and
      deepfake-detection technology to Canadian financial institutions.
      Revenue mix between these streams is not publicly disclosed.
    claimRefs:
      - CI018
      - CI034
      - CI035
      - CI032
      - CI036
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI002

  - id: growth-trajectory-revenue
    title: Growth Trajectory and Revenue Performance
    body: >-
      Incode's ARR trajectory is the strongest data point in its financial
      profile. GetLatka recorded $86.7M ARR in December 2023, and in June 2025
      Incode hit $170M ARR — a cumulative 96% gain in approximately 18 months.
      The company's own press materials citing the August 2025 AuthenticID
      acquisition attributed 80% year-on-year organic growth to the platform
      prior to inorganic contribution, which is consistent with the observed
      trajectory. Biometric Update and Bloomberg independently corroborated the
      $170M ARR figure in November 2025 fundraising coverage.


      The company processed 4.1 billion identity checks in calendar year 2024,
      rising to 7.1 billion total trust checks by March 2026 — a volume scale
      that underscores the durability of the per-check revenue model at
      enterprise pricing. Revenue per employee is estimated at approximately
      $305,000 (based on $170M ARR / 556 employees per GetLatka), which is
      at or above best-in-class benchmarks for enterprise SaaS companies at
      comparable revenue scale. The absence of audited financials, GAAP revenue
      recognition disclosures, or trailing-twelve-month (TTM) revenue figures
      for a later period limits the ability to validate whether ARR momentum
      has continued into 2026.
    claimRefs:
      - CI001
