  - id: unit-economics-efficiency
    title: Unit Economics and Operating Efficiency
    body: >-
      Incode does not publicly disclose gross margin, customer acquisition cost
      (CAC), net revenue retention (NRR), or churn figures. As a private
      company the only quantifiable unit-economics proxy available externally
      is revenue-per-employee — approximately $305K — which is competitive
      with enterprise SaaS benchmarks for companies above $100M ARR.
      Gross margin is structurally favorable given the primarily software-based
      delivery model with no hardware manufacturing or meaningful physical
      inventory; analyst benchmarks for comparable identity-verification SaaS
      companies suggest gross margins in the 70–80% range, but these are
      estimates, not reported figures.


      Customer acquisition cost and CAC payback period are unknown. The
      enterprise direct-sales motion targeting large banks and telcos implies
      long sales cycles (a SWOT analysis independently identifies this as a
      weakness) and potentially high selling costs per deal; counterbalancing
      this is the durability of multi-year contracts and expansion potential
      within large enterprise accounts. NRR is a critical unknown: with 8 of
      the top 10 U.S. banks and 8 of the top 9 North American telcos as
      customers, the cohort suggests high retention, but without disclosed
      data, no NRR estimate can be responsibly stated. All unit-economics cells
      remain null and are flagged as evidence gaps requiring data-room access.
    claimRefs:
      - CI015
