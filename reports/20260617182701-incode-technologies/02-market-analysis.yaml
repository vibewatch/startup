  - id: buyer-segmentation
    title: Buyer Segmentation and Adoption Patterns
    body: >
      The primary buyers of identity verification solutions cluster into five segments with distinct
      budget ownership and adoption triggers. Tier-1 LATAM commercial banks—including Incode customers
      BBVA Mexico, Banorte, and Santander Mexico—procure through annual IT and compliance budgets, driven
      by AML mandates and fraud cost reduction ROI. LATAM neobanks and digital lenders such as Kueski,
      Clip, and Nubank adopt through agile engineering budgets, motivated by onboarding conversion rates
      and drop-off reduction. Telcos such as Telcel, another disclosed Incode customer, are compelled by
      regulatory SIM fraud mandates. Government e-platforms require citizen identity proofing for benefit
      distribution and public services—a segment energized by Mexico's Biometric CURP launch in February
      2026. US and cross-border financial institutions face FinCEN's Corporate Transparency Act (CTA)
      beneficial ownership requirements, expanding the addressable market northward. Veriff's published
      LATAM case studies with Kueski, Comun, Solventa, and Juancho te Presta corroborate that LATAM
      fintechs require IDV solutions that balance onboarding conversion against fraud prevention at scale.
      Budget ownership lies with CTO and CRO roles at banks and with compliance and legal leadership at
      cross-border institutions. Adoption is event-driven: regulatory changes, fraud surges, or new
      digital product launches typically open procurement cycles.
    claimRefs:
      - CM015
      - CM016
      - CM017
      - CM018
      - CM019
      - CM022
    tableRefs:
      - TM003
    figureRefs:
      - FM003

  - id: growth-drivers-constraints
    title: Growth Drivers and Regulatory Tailwinds
    body: >
      Four structural forces are expanding the identity verification market. First, AI-generated deepfake
      fraud has increased by over 2,100% in three years as of 2026; 62% of organizations experienced a
      deepfake incident in the prior 12 months (Gartner n=302), and deepfakes now constitute
      approximately 7% of all global fraud attempts tracked by identity platforms. Global biometric
      identity check infrastructure spending surpassed USD 4.8 billion in 2024, driven by urgency to
      comply with FATF's revised CDD requirements. Second, regulatory mandates are becoming
      outcome-focused and prescriptive: FATF's October 2025 update emphasizes demonstrable KYC
      effectiveness over checkbox compliance; the EU's AMLA—operational since July 2025—must deliver
      RTS by July 2026; FinCEN's CDD Final Rule mandates four-pillar KYC for US institutions; and global
      AML enforcement actions in 2024 exceeded USD 4.3 billion, the highest on record. Third, LATAM's
      digital banking expansion creates structural demand: Brazil's PIX achieves approximately 90%
      adoption, Mexico's digital credit volume grew 900% to MX$450 billion since 2020, and the LATAM
      fintech ecosystem has grown 340% since 2017. Mobile technology contributes USD 600 billion to
      LATAM's economy (8.6% of GDP), with GSMA forecasting USD 700 billion by 2030. Fourth, Mexico's
      Biometric CURP launch (February 2026) establishes a national identity infrastructure, with analysts
      estimating digital identity adoption could lift Mexico's GDP by up to 13% through fraud reduction
      and greater financial inclusion. Material constraints include high implementation costs for SMEs,
      Mexico's persistent cash preference (85%+ of sub-MX$500 transactions remain cash), fragmented
      interoperability across LATAM platforms, and a trust deficit driven by the 77% surge in
      identity-theft fraud losses to MX$11.3 billion in 2024.
