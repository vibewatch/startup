chapter:
  number: 2
  title: Market Analysis
  summary: >
    The global identity verification market is sized at USD 14–17 billion in 2026 by major analysts,
    growing at 11–17% CAGR toward a USD 27–51 billion range by 2031–2034. LATAM is a high-growth zone
    driven by Mexico's Biometric CURP launch, a 340%-expanded fintech ecosystem, and surging deepfake
    fraud that has made biometric liveness a strategic priority. Regulatory tailwinds from FATF, EU AMLA,
    and FinCEN create recurring procurement demand, though high SME implementation costs and Mexico's
    persistent cash preference represent material adoption constraints.

sections:
  - id: market-definition
    title: Market Definition and Boundary
    body: >
      The identity verification market encompasses solutions that authenticate a person's real-world
      identity through digital channels. Included spend covers document validation (passports, national
      IDs, driver's licenses), biometric liveness detection, facial recognition, fingerprint scanning,
      iris capture, automated e-KYC onboarding workflows, and AI-driven fraud screening at account
      opening. Adjacent spend includes anti-money laundering (AML) transaction monitoring, open banking
      consent infrastructure, and ongoing perpetual-KYC (pKYC) refresh services. Excluded from the core
      market boundary are general cybersecurity platforms unrelated to identity proofing, physical
      branch-based notarization, credit scoring engines, and payment gateway infrastructure itself.
      Incode competes primarily in the biometric liveness and e-KYC segments of this market, with a
      pronounced focus on LATAM financial institutions. Financial services (BFSI) accounts for
      approximately 30–33% of total identity verification spend and is the dominant demand engine.
      Cloud-based deployment now commands a 65–69% market share, enabling rapid API integration and
      continuous model updates—characteristics central to Incode's platform architecture. Status-quo
      substitutes include manual branch KYC, outsourced BPO identity review, and older rule-based
      document verification tools that lack real-time biometric liveness.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
    tableRefs:
      - TM001

  - id: market-sizing
    title: "Market Sizing: TAM, SAM, and Estimation Uncertainty"
    body: >
      Analyst estimates for the global identity verification market in 2026 range from USD 14.1 billion
      (Future Market Insights) to USD 17.3 billion (Business Research Company), with CAGR projections
      spanning 11% to 17% depending on market scope. Mordor Intelligence, publishing a conservative
      estimate, sizes the 2026 market at USD 15.78 billion with an 11.18% CAGR through 2031. Grand View
      Research projects a broader digital identity solutions market reaching USD 33.93 billion by 2030
      at 16.7% CAGR from 2023. Market Research Future, updated as of June 17 2026, puts the 2026 figure
      at USD 16.89 billion with a 12.18% CAGR through 2035. The spread across estimates reflects
      differences in scope—some firms include only core document and biometric solutions while others
      incorporate adjacent fraud analytics and open banking authentication layers. The e-KYC sub-segment
      alone is valued at USD 948.8 million in 2025 by IMARC Group, growing at 16.35% CAGR through 2034.
      Within the global market, BFSI retains approximately 32–33% of revenue share, implying a financial
      services SAM of approximately USD 5 billion in 2026. No major analyst publishes a standalone
      LATAM-only identity verification market size; regional SAM estimates must be derived by applying
      LATAM fintech/banking market share proxies to the global TAM—a meaningful evidence gap that
      constrains precise SOM calculation.
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM008
      - CM009
      - CM010
      - CM011
      - CM012
      - CM013
      - CM014
