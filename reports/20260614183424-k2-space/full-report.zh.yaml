  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景与资本结构
        blocks:
          - type: paragraph
            body: >-
              K2 Space 自 2022 年成立以来完成了六轮不同融资，累计股权融资超过 $450 million。最早的两笔——2022 年 6 月 $8 million pre-seed 和 2023 年 6 月
              $8.5 million seed——由 First Round Capital、Republic Capital，以及 Countdown Capital、Boost VC、Alpine Space
              Ventures 等一批专注太空经济的基金支持。2024 年 2 月 $50 million Series A 引入 Altimeter Capital，并扩大 Alpine 的持仓，用于加州 Torrance
              初始工厂建设和核心子系统开发。


              估值拐点出现在 2025 年 2 月的 $110 million Series B，由 Lightspeed Venture Partners 与 Altimeter Capital 共同领投，宣布时恰逢 K2
              首次成功完成在轨部件演示。当时公司已获得超过 $50 million 的政府和商业合同，并正从 25 名员工扩张到 90 名。Series B 未公开披露投后估值；按这些合同指标融资 $110
              million，行业分析师可能会把 Series B 估值估在 $500 million–$1 billion。


              对估值最关键的事件是 2025 年 12 月 11 日 Series C：Redpoint Ventures 领投，T. Rowe Price Associates、Hedosophia、Altimeter
              Capital、Lightspeed Venture Partners 和 Alpine Space Ventures 参投，以 $3 billion 投前估值融资 $250 million。该轮在 K2
              首颗完整卫星发射（GRAVITAS 于 2026 年 3 月搭乘 SpaceX Transporter-16）前约三个月完成，是卫星制造史上首飞前估值最高的融资之一。$3 billion
              估值背后是商业与美国政府客户合计 $500 million 已签合同，Series C 的合同积压 / 估值倍数约 6x——这一比例符合高增长硬件公司的定价，但对一家交割时尚未交付完整卫星的公司来说要求很高。


              后续稀释路径未知：K2 未披露股权结构、优先股层级、清算优先权或期权池。若按典型 late-Series-C 优先股结构假设，普通股投资者在任何下行情形退出中都要面对多层清算优先权，分配可能被实质压低。截至
              2026 年 6 月，公司累计融资超过 $450 million；相对 $3 billion 投后估值并不低，意味着机构 Series A–C 投资者可能持有较集中股权。
