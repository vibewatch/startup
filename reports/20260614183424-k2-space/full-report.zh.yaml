  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 资本密集与财务风险
        blocks:
          - type: paragraph
            body: >
              K2 Space 进入 2026 年 6 月时，五轮融资累计超过 $450 million，已签合同达到 $500 million，但公司尚未从卫星制造产生任何已报告经营收入。2025 年 12
              月、首颗运营卫星发射前确定的 $3 billion Series C 估值，相当于任何合理近期收入估计的约 30–50 倍企业价值，把巨大执行压力压在 2026–2028
              年任务序列上。把卫星业务制造到规模化极度资本密集：原材料、耐辐射部件、推进剂耗材（Krypton）、洁净室运营、发射舱位和地面支持基础设施，每一项都对应单星数百万美元成本。K2 声称 Mega-class
              平台单价 $15 million、计划年产 100 颗卫星，满产年收入约 $1.5 billion；但要达到该产能，需要同等巨大的营运资本，而公司没有披露 burn rate、毛利率或 cash
              runway。Series C 由 Redpoint 领投，T. Rowe Price、Hedosophia、Altimeter、Lightspeed 和 Alpine Space Ventures 参与；除
              STRATFI 配套资金外，没有公开披露贷款人或非稀释性融资，使再融资风险集中在风险投资市场，而 2023 年以来后期航天硬件公司在该市场已承压。SES
              里程碑付款到来前，若要继续投入以达到量产规模，可能需要以稀释性条款完成 Series D，或者在 risk-off 环境中根本拿不到资金。
