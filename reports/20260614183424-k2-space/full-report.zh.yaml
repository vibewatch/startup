      - number: '4.3'
        title: 资本结构、融资依赖与工厂经济性
        blocks:
          - type: paragraph
            body: >-
              K2 Space 自成立以来已完成五轮股权融资。融资时间线（详见 Company Overview 章节）以 2025 年 12 月 11 日完成的 $250M Series C 告一段落，该轮投后估值
              $3B，由 Redpoint 领投，T. Rowe Price Associates 管理账户、Hedosophia、Altimeter Capital、Lightspeed Venture Partners 和
              Alpine Space Ventures 参与。Series C 后，总股权融资超过 $450M。Series B（$110M，2025 年 2 月）由 Lightspeed 和 Altimeter
              共同领投；此前 pre-seed、seed 和 Series A 合计约 $66.5M。

              K2 计划把 Series C 资金用于扩大加州 Torrance 180,000 sq ft 工厂的制造能力，该工厂设计年产能最高 100 颗高功率卫星。按每颗 $15M、满产计算，理论年收入产能为
              $1.5B。不过，截至 2026 年中，公司没有公开披露达到满产所需的资本开支、当前工厂利用率或生产吞吐。工厂意味着庞大的固定成本基础；K2 称该工厂已经开放并投入运营，但产能爬坡投资取决于 Mega Class
              发射是否成功。

              月度 burn rate、现金余额和 runway 均未披露。以 150+ 人团队（根据 SVIC profile 截至 2025 年 12 月估算）和航空航天制造成本结构测算，月度 burn 估计在
              $8M–$18M 区间（参考类似早期卫星制造商推断）；如果 burn 没有大幅加速，Series B 和 C 合计融资可支撑多年 runway。但这是没有一手来源支持的分析师估算；实际 burn 和 runway
              需要私有尽调确认。

              STRATFI 项目的 50/50 结构（政府 + 风险投资共同投资）值得注意：它是一种非稀释性资本机制，在不追加股权的情况下部分资助了 Gravitas 任务，补充了核心风险资本结构。SES
              表示，meoSphere 计划已经纳入其「此前宣布的 2026 全年 capex」，说明 SES 正在为自身开发部分出资，但 SES 与 K2 之间制造成本和付款里程碑如何分配并未公开。
