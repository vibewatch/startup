      - number: '3.4'
        title: 轨道替代方案、替代品和现状选项
        blocks:
          - type: paragraph
            body: >-
              考虑 K2 Space 的买方面临多种可行替代方案，它们服务同一底层任务需求。最重要的 “substitute” 是 incumbent 采购路径：从 Boeing、Airbus 或 Thales Alenia
              购买单颗精致 GEO 卫星，价格 $200M–$500M，建造周期 3–5
              年。对预算大、排期不紧的运营商来说，这条路径仍有吸引力，因为它把载荷、heritage、保险和监管审批集中到一个已有数十年先例的单一项目中。Boeing 的 $2.8B ESS
              项目（两颗卫星）说明这种模式在核指挥与控制领域仍然活跃。

              国防星座应用的现状替代方案，是 Space Development Agency 模式，使用 Rocket Lab Lightning bus（约 3kW，仅
              LEO）或类似小卫星平台。尽管单星功率更低，这些平台在许多任务中已有飞行验证，政府采购路径清晰，运行环境也更容易理解。该替代路径最适用于 LEO ISR 和通信场景，在这些场景里，高功率不如低时延或重访率关键。

              对大型国防 primes 来说，内部建造是一个小但不可忽视的替代方案。Boeing、Northrop Grumman 和 Airbus 都有卫星制造能力，使它们能以集成商身份投标政府项目，同时内部建造
              bus。随着政府采用商业采购路径（IDIQ、OTA），primes 也通过推出商业衍生产品来守住市场份额。Boeing 的 Millennium Space Systems
              子公司，正是其面向这一细分市场的快速星座响应工具。

              SES meoSphere 项目本身说明了替代选择的计算方式：SES 过去曾向 Thales Alenia Space 采购卫星（O3b），但下一代 MEO 网络转向
              K2，理由是敏捷性、成本和速度优势。这一替代事件是 K2 竞争论点最强的经验证据，尽管它只代表一个买方和一代采购。SES O3b mPOWER 星座（由 Thales Alenia 交付）证明了 MEO
              需求存在，K2 则站在服务下一代需求的位置上。
