      - number: '7.7'
        title: 附录
        blocks:
          - type: callout
            title: 抬轨完成是近期投资论点的关键检验
            body: >
              截至 2026 年 6 月 14 日，Gravitas（3 月 30 日发射）仍在用 20 kW Hall-effect thruster 执行 90 天 LEO 至 MEO
              抬轨——这是人类首次尝试以这一功率等级穿越 Van Allen 辐射带。若 2026 年 6 月下旬至 7 月能确认入轨，且推进器和航电健康，SES meoSphere 进度、PTS-G 供应商角色和
              Series D 融资的风险都会显著下降。若此时失败或只取得部分成功，三条线的投资论点都需要同时重估。
            calloutType: risk
