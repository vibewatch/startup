      - number: '8.2'
        title: 估值方法与可比分析
        blocks:
          - type: paragraph
            body: >-
              K2 Space 未披露收入，没有公开审计财务，也没有说明盈利时间表。传统收入或 EBITDA
              倍数无法直接套用。更有用的是三套方法框架：（1）合同积压倍数；（2）部分产能爬坡下的隐含远期收入倍数；（3）与上市卫星制造商及近期 M&A 的可比公司 / 交易分析。


              合同积压法：$3 billion 估值对应 $500 million 已签合同，企业价值 / 积压订单约
              6x。对一家资本密集、平台仍新的硬件公司而言，这一溢价反映市场相信：（a）未签合同仍有显著上行空间；（b）星座运营后，平台经济性可反复兑现；（c）Giga 级路线图具备期权价值。2026 年 3 月宣布的 SES
              28 星订单，按每星 $15 million 价格点，单独就隐含约 $420 million 合同价值；若转成正式已签金额，可能在此前积压基础上再增加 80% 以上。


              远期收入倍数法：如果 K2 到 2028 年爬坡至每年交付 30–50 颗卫星，平均售价 $15 million，则隐含 2028E 收入为 $450–750 million。按 $3 billion 估值，对应
              4–7x 远期收入倍数——按增长科技标准不激进，但对一家面临重大交付和性能不确定性的第一代硬件制造商来说要求很高。若套用 Rocket Lab（RKLB）在 FY2025 $601.8 million
              收入上享有的 13–20x 后视收入倍数，且 K2 能在 2027–2028 年达到可比收入，其股权价值可达 $6–12 billion——说明只要执行守住，仍有升值空间。


              可比组：上市卫星制造商只能提供部分基准。Rocket Lab（RKLB）报告 FY2025 收入 $601.8 million（据其 2026 年 2 月 SEC
              10-K），交易价格包含明显增长溢价，反映其发射与空间系统一体化业务。Intuitive Machines（LUNR）报告 FY2025 收入约 $210 million，截至 2025 年 12 月 31
              日合同积压 $213.1 million（据其 2026 年 3 月 SEC 10-K），并在投资者材料中将自己定位为服务商业、民用和国家安全客户的多板块空间基础设施公司；相比纯发射商或 GEO
              传统厂商，它更接近 K2 的上市可比。LUNR 的市值隐含约 6–8x 后视收入，但受合同亏损和 NASA 预算风险压缩。MDA Space（TSX/NYSE:
              MDA）是规模更大的加拿大老牌卫星系统制造商，现已在两地交易所上市，可作为按收入规模校准的锚。Terran Orbital 是一家小卫星制造商，2024 年被 Lockheed Martin 以约 $450
              million 收购；它提供了一个警示先例：执行失速或合作伙伴整合时，估值可以压缩得很快。


              CounterFlow Solutions 对 Series C 的分析将 K2
              描述为推进「missions-to-markets」产品化策略——为特定任务设计航天器，再把平台经济性做成可复用模式——并指出政府需求仍是主锚，商业需求才刚出现。该框架意味着，估值支撑需要公司持续拿下政府项目，并在
              IPO 吸引广泛投资者兴趣之前，至少部分商业化 Mega 平台。
