      - - 收入与损益
        - FY2024 和 FY2025 经审计财务报表；2026 年季度管理账
        - 缺少这些材料，就无法判断烧钱速度、利润率或资本充足性
        - 向 K2 CFO 索取；任何承诺出资前必须拿到
      - - 股权结构与优先权堆栈
        - 完整资本化表，列明所有股份类别、优先权、反稀释条款和期权池
        - 不同退出价格下普通股真实价值仍不清楚；若以 $4–5B 退出，优先权可能吃掉收益
        - 向 K2 法律顾问索取；按牛市 / 基准 / 熊市退出情景搭建分配瀑布
      - - GRAVITAS 轨道抬升性能数据
        - LEO 至 MEO 转移期间的推进器输出、发电和航电定量数据
        - 在轨验证才是平台论点的最终考验；未来销售都押在这件事上
        - K2 工程团队；轨道抬升完成后关注公开新闻稿更新
      - - SES 合同条款
        - 28 颗卫星 meoSphere 订单的正式签约金额、付款里程碑、取消条款和履约保证
        - SES 订单是最大的商业锚点；条款决定收入确认节奏
        - 向 K2 销售副总裁索取；SES 新闻稿确认了范围，但未披露条款
      - - 制造爬坡计划与成本模型
        - 详细单机经济性：制造一颗 Mega 卫星的成本、工厂间接费用分摊，以及年产 20/50/100 颗卫星时的利润率
        - 投资逻辑取决于规模化后的利润率爬升；若 CapEx 过高，公司可能在盈利前还要再融一轮
        - K2 COO / 制造负责人；独立工厂审计
      - - 政府管线与中标概率
        - 总管线（STRATFI、太空军星座、Golden Dome、OPIR）及按概率加权的预期价值
        - 政府项目目前撑起收入主干；管线不透明让基准收入难以判断
        - 商务拓展访谈；通过 FOIA 查询已授合同；SpaceWERX 项目追踪器
    notes: 对 Series C 阶段硬件制造商来说，这些请求都是标准动作，反映的是公开证据缺口，而不是公司特有红旗。缺少这些信息不代表恶意；这个阶段的私营公司通常不会公开。
    claimRefs:
