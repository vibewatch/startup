          - type: callout
            title: SES 集中度既是最大机会，也是最大风险
            body: >
              SES 初始订购 28 颗卫星，是迄今宣布给初创公司的最大商业卫星制造承诺。该订单验证了 K2 的技术路线图，也给产能爬坡提供了理由。但 SES
              明确称其为「迭代式、敏捷、开发性」安排，意味着完整星座尚未形成约束性承诺。SES CEO Al-Saleh 表示，公司会根据市场需求「从数量角度同时调整」，这给 SES 留下了缩减订单的真实选择权，而 K2
              没有对应选择权。
            calloutType: risk
            claimRefs:
              - CR021
              - CR022
