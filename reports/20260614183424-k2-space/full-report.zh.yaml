      - number: '1.3'
        title: 领导团队、创始人和治理
        blocks:
          - type: paragraph
            body: >
              K2 Space 由 Karan Kunjur 和 Neel Kunjur 两兄弟共同创立，Karan 担任 CEO，Neel 担任 CTO。Karan 有 BCG 管理咨询背景，转向航天行业前曾带领一家 AI
              初创公司完成九位数收购。Neel 曾在 SpaceX 负责 Dragon 飞船航电，并担任 Mission Director；这让创始团队同时具备业务拓展和卫星系统工程的直接经验。

              创始人之外，K2 在关键职能岗位聚集了一批 SpaceX 资深校友。John Plumb 曾是五角大楼首位经参议院确认的 Assistant Secretary of Defense for Space
              Policy，如今担任 Head of Strategy，为公司庞大的 DoD 客户基础带来政府关系和监管专业能力。Rafael Martinez 曾负责 SpaceX Starlink
              霍尔效应推力器设计，现负责推进。Pieter Kranenburg 曾在 SpaceX 创建 Starshield 项目，并把团队从 15 人扩到 300 多人，加入 K2 后担任 Head of
              National Security Programs。Jesse Klekamp 曾负责 SpaceX 人才招聘，现任 Head of People。Drew Miller 曾负责 Dragon 2
              机构件，现负责结构；Michael Saqr 曾负责 F9 和 Dragon 2 固件以及 Starship 航电，现负责软件。

              K2 Space 未公开董事会构成、独立董事安排或投资人董事席位分配。领导层高度集中于 SpaceX 校友，既带来强技术文化，也带来关键人依赖风险，尤其集中在 Karan Kunjur
              兼任主要融资人和公司外部代表这一点上。John Plumb 加入后，管理团队向政府领域专业能力明显扩展，降低了运营集中度风险，但没有消除。
