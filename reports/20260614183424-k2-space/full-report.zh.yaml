      - number: '3.3'
        title: New-Space Satellite Bus 挑战者
        blocks:
          - type: paragraph
            body: >-
              从商业模式和垂直整合路径看，Rocket Lab 是与 K2 Space 最可比的 new-space bus 制造商。Rocket Lab 的航天器家族包括
              Explorer（行星际、深空）、Lightning（LEO 高功率，约 3 kW，寿命 12+ 年）、Pioneer（中等 delta-V，可再入）、Photon（LEO / 地月空间集成）和
              Flatellite（LEO 星座）。按其官方产品页，Rocket Lab 有 40+ 航天器 backlog，已发射 4 个航天器。其 $515 million SDA Tranche 2 Transport
              Layer-Beta 合同（18 颗卫星，使用定制 Lightning 平台）让它成为国家安全应用中 LEO 政府星座 bus 的主要供应商。在 PTS-G 项目中，Rocket Lab 被选为 Viasat 的
              GEO MILSATCOM segment bus 供应商——直接与 K2 竞争，后者在同一项目中服务 SES。

              不过，Rocket Lab 的 Lightning 平台提供约 3 kW 在轨功率，约为 K2 Mega Class 最大值的七分之一；它为 LEO 和 12+ 年寿命设计，而非多轨道运行。Rocket Lab
              位于加州 Long Beach 的航天器综合体（11,000 sq ft cleanroom）明显小于 K2 的 180,000 sq ft Torrance 工厂。两家公司在政府 bus
              供应上直接竞争，但在商业功率等级、轨道范围和载荷能力上重叠很小。

              Astranis 为需要高地球轨道连接的运营商建造紧凑、软件定义的 micro-GEO 卫星。按其最近公开披露，Astranis 有 10 多颗卫星在合同中，对应已售卫星服务超过 $1
              billion。其差异化窄聚焦于 GEO 轨道的固定宽带连接——它不提供 LEO 或 MEO 轨道能力，功率画像也低于 K2 Mega Class。Astranis 只在边缘场景与 K2
              竞争，即运营商同时考虑单轨道 micro-GEO 方案和多轨道高功率方案。两家公司服务的用例和客户类型大多不同。

              Viasat 的 ViaSat-3 平台在 GEO 细分超过 25 kW 在轨功率，证明高功率 GEO 卫星是已验证概念；但 Viasat 为自有服务建造平台，而不是向第三方销售 satellite
              bus，因此它是 K2 服务的替代方案，而非直接 bus 制造商竞争对手。SpaceX Starlink V3 卫星据称目标功率约 20 kW，同样是为内部星座使用，而非第三方客户。
