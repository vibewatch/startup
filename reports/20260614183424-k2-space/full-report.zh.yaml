          - type: callout
            title: 80% 部件自制会放大规模生产中的故障传导风险
            body: >-
              TechCrunch 2026 年 3 月指出，85% 卫星部件自制意味着任何供应链中断或设计缺陷都会在 satellite bus 上广泛传导。这种集中度降低成本，但也把质量风险集中到 K2
              自身制造能力上；而该能力尚未经历 28 颗 SES 订单所隐含生产节奏的压力测试。GRAVITAS 结果将是完整 K2 自建平台在轨表现的第一个有意义数据点。
            calloutType: risk
