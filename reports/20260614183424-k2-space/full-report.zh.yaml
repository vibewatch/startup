      - number: '1.4'
        title: 融资历史和投资人基础
        blocks:
          - type: paragraph
            body: >
              K2 Space 自 2022 年创立以来累计完成超过 $450 million 股权融资。即便在资金充裕的航天初创公司中，其融资节奏也相当快：最早从 First Round Capital 获得约 $22
              million 种子轮；2023 年末完成由 Altimeter Capital 共同领投的约 $50 million Series A；2024 年 12 月获得美国 Space Force 的 $60
              million STRATFI 奖项（结构为 $30 million 政府资金配套 $30 million 私人资本）；2025 年 2 月完成由 Lightspeed Venture Partners 和
              Altimeter Capital 共同领投的 $110 million Series B；2025 年 12 月完成 Redpoint 领投的 $250 million Series C，post-money
              估值 $3 billion。

              Series C 引入了 T. Rowe Price、Hedosophia 和 Alpine Space Ventures，同时老股东继续参与。K2 不到四年就达到独角兽以上估值。Series C
              公告时，公司还已拿到超过 $500 million 的商业和政府已签合同；考虑到当时首个完整任务尚未发射，这样的资本图景对一家公司来说异常强劲。

              投资人组合横跨顶级风投（Redpoint、Lightspeed、Altimeter、First Round）、成长股权（T. Rowe
              Price）、跨界成长基金（Hedosophia）和航天专项资本（Alpine Space
              Ventures），说明市场对短期合同轨迹和高功率卫星长期市场都有广泛信心。鉴于早期资本形成高度围绕两位联合创始人，Karan Kunjur 作为投资人关系主要负责人的关键人依赖，是合理假设。
