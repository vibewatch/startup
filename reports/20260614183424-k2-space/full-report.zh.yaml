      - number: '1.5'
        title: 客户、合同和战略伙伴
        blocks:
          - type: paragraph
            body: >
              K2 Space 在 2025 年 12 月 Series C 公告时称，已签合同超过 $500 million，覆盖美国政府和商业客户。公开点名的最大政府客户是美国 Space Force，后者于 2024 年
              12 月授予 $60 million STRATFI 合同，用于 GRAVITAS 任务。GRAVITAS 于 2026 年 3 月搭载 SpaceX Falcon 9 Transporter-16
              rideshare 发射，携带 DoD 载荷，为 Mega Class 平台争取后续政府和商业订单完成资格验证。2026 年 5 月，美国 Air Force Secretary Troy Meink 到访 K2
              Space Torrance 工厂，确认发射后 DoD 高层仍在持续接触。

              最大商业客户和合作伙伴是 SES。2025 年 9 月，SES 与 K2 Space 宣布合作，共同开发 SES 未来的 MEO 网络。2026 年 3 月 24 日，在 Satellite 2026
              大会上，SES 将合作正式化，为其 meoSphere 星座订购 28 颗 Mega Class 卫星，目标在 2030 年实现完整运营能力。meoSphere 卫星设计在约 8,000 km 高度运行，每颗输出
              20 kW，配备光学星间链路和 100 Gbps crosslinks，以满足 5G-NTN 合规要求。按 K2 宣称的单星 $15 million 价格，28 颗卫星订单意味着来自单一运营商的名义制造
              backlog 约 $420 million。

              另外，2026 年 K2 Space 被选为 SES 参与美国 Space Force Protected Tactical Satcom-Global（PTS-G）项目的 satellite bus
              供应商。PTS-G 是一项 $4 billion IDIQ，SES 与 Viasat 分享 $437.7 million 初始授标，航天器计划于 2029 年投入服务。该角色横跨 LEO、MEO 和
              GEO，验证了 K2 Space 的多轨道战略，并在 GRAVITAS 之外显著降低其政府收入前景的不确定性。
