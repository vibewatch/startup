      - number: '3.2'
        title: 传统 GEO incumbent bus 制造商
        blocks:
          - type: paragraph
            body: >-
              Boeing Satellite Systems 已交付通信卫星超过 60 年，覆盖 20 多个国家。其产品组合包括大型 GEO bus 702 系列，被 Viasat 等运营商采用（ViaSat-3 输出超过
              25 kW）；通过 Millennium Space Systems，Boeing 还为国家安全和商业客户提供敏捷小卫星星座生产。Boeing 还赢得 $2.8 billion ESS 核指挥与控制合同（击败
              Northrop Grumman），确认其在受保护 MILSATCOM 中仍占主导地位。Boeing 的软件定义、灵活载荷架构面向希望无需硬件更换即可动态分配带宽和波束成形的商业运营商。

              Northrop Grumman 提供安全、受保护、可生存的 MILSATCOM，重点服务最关键政府任务。其通信卫星组合面向高保证、抗核加固架构——K2
              目前不参与这一细分——尽管没有赢得第一批生产授标，Northrop 仍是 PTS-G pool 中五家合格供应商之一。Northrop 的航天姿态强调独特性和数十年 heritage，而不是商业成本竞争力。

              Airbus Defence and Space 为欧洲政府和商业客户制造电信、导航和地球观测卫星。其 Eurostar Neo 系列是 Eutelsat 等运营商以及 SES 过去采购周期使用的主要 GEO
              telecom bus。Airbus 与欧洲运营商和监管机构有深厚机构关系，这为其在非美国市场带来分销优势，也是 K2 必须跨过的门槛。

              Thales Alenia Space 是 Thales（67%）和 Leonardo（33%）的合资公司，拥有 40 多年航天制造历史，生产 Spacebus 系列，覆盖 GEO
              电信、导航（Galileo）和科学任务。其客户基础横跨欧洲机构和国际运营商。Airbus 与 Thales 都是欧洲 incumbents，在 EU 运营商合同和 IRIS2 等 EU 机构项目上拥有本土优势。

              没有一家传统 incumbent 公开提供一款多轨道、低于 $50M、面向 LEO、MEO、GEO proliferated 部署且三个月内交付的 satellite bus。截至 2026
              年中，它们是否会竞争性回应仍处于潜伏状态——这既是 K2 近期关键机会，也是其主要潜在护城河风险。
