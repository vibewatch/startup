      - number: '6.2'
        title: 采用轨迹与部署时间线
        blocks:
          - type: paragraph
            body: >-
              K2 的采用轨迹在 15 个月内，从在轨部件演示走到完整卫星任务。首次技术验证是 2025 年 1 月 D-Orbit ION Satellite Carrier 上的托管载荷飞行（SpaceX
              Transporter-12 rideshare），演示了飞行计算机、反作用飞轮、嵌入式 avionics 和飞行软件。随后，K2 首颗完全集成的 Mega Class 卫星 GRAVITAS 于 2026 年
              3 月 30 日发射，携带 12 个载荷模块，并点火有史以来飞上轨道的最强电推进器。该任务验证了完整技术栈——电源、推进和 avionics——也让 K2 的首批客户关系进入运营形态。


              下一阶段在 GRAVITAS 后约 21 个月展开，K2 计划再发射十颗 Mega Class 卫星，其中两颗专门用于 SES meoSphere pathfinder 测试。计划 2027 年执行的
              Trinity 任务，将用一枚 SpaceX Falcon 9 把三颗卫星部署至 LEO、MEO 和 geostationary transfer orbit（GTO），同时支持政府和商业客户。K2 Series
              C 新闻稿称，商业和国家安全运营星座将从 2028 年开始部署，SES meoSphere Phase 1 初始星队目标 2029 年交付。每枚 Falcon 9 可将七颗 meoSphere
              卫星堆叠送入低地球轨道，再由机载电推进在约两到三个月内抬轨至 MEO。


              K2 CEO Kunjur 披露，GRAVITAS 载荷客户「正在考虑 10 到 50 颗卫星不等」，说明除 SES 外，还有一批未具名星座候选管线。截至 2025 年 12 月，总已签合同达到
              $500M+，但商业与政府拆分以及客户身份仍未披露。从首个 pilot 到首次量产交付，节奏约四年（2025 年演示 → 2029 年交付）；这对 MEO
              卫星制造并不异常，但会在近期把收入集中风险压在少数政府项目上。
