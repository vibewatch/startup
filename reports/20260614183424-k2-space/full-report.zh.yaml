  - id: FR001
    title: 风险热力图——可能性 vs. 影响矩阵
    type: matrix
    layout: standard
    summary: 按严重程度排序的风险版图，将 K2 Space 主要风险类别映射到发生可能性与任务 / 财务影响。
    data:
      columns:
        - 低影响
        - 中等影响
        - 高影响
        - 关键影响
      rows:
        - label: 低可能性
          values:
            - DFARS 合规缺口
            - 氪供应中断
            - Rocket Lab PTS-G 替代
            - Starship 商业延误（卡住 Giga）
        - label: 中等可能性
          values:
            - FCC/ITU 轨位冲突
            - 人员扩张不足
            - ITAR 出口许可延误（SES）
            - 辐射 / 航电故障（MEO 转移）
        - label: 高可能性
          values:
            - 披露不透明（投资人能见度）
            - 发射排期滑移（SpaceX 拼车）
            - SES 探路条件未满足
            - 轨道提升推进器故障（Gravitas）
        - label: 近乎确定
          values:
            - 竞争加剧
            - 政府预算波动
            - ''
            - 客户集中（SES + DoD）
    approximationNotes: |
      可能性和影响评估为定性判断，来自公开证据和行业基准。卫星初创公司在 MEO 轨道的失败率没有公开精算数据。
