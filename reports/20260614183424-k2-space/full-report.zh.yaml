      - number: '2.5'
        title: 采用约束和市场风险因素
        blocks:
          - type: paragraph
            body: >-
              最重要的采用约束是国防采购惯性。Dr. John Plumb 特别提到 ESPA ring 要求这一遗留约束，它迫使军方项目使用更小载荷，无法适配 K2 的更大平台。ESPA rings
              标准化了次级载荷和运载火箭之间的接口，改革这些要求需要 Space Force 采购项目内部发生机构变化，可能耗时多年。Plumb 表示军方必须 “get out of legacy requirements
              if we're going to achieve new effects at lower cost”，等于承认采购改革并不确定。若改革不到位，K2 的政府 TAM 上限仍会被限制在主动选择非 ESPA
              采购的项目上（STRATFI、SBIR 或未来专门设计项目）。

              第二个约束是 MEO 辐射风险。中地球轨道带受 Van Allen belts 强辐射影响。传统小卫星 bus 和商业 LEO 平台并非为在 MEO 长期生存而设计。K2 的差异化来自抗辐射航电和冗余系统，但截至
              2026 年 6 月，只有 Gravitas 任务在 MEO 运行，且公开性能数据有限。商业运营商和政府买家采购价值数亿美元的 MEO 星座项目时，会要求多年可靠性验证，而不是早期任务数据。缺少长周期 MEO
              飞行 heritage，仍是大型星座项目的实质采用障碍。

              第三个约束是 Giga Class 路线图面对 Starship 和 New Glenn 时间线风险。K2 的 Giga Class（100 kW）依赖超重型运载实现商业可用。截至 2026
              年中，Starship 尚未取得商业卫星载荷认证，New Glenn 也刚开始商业运营。任一项目延迟，都会把 Giga Class 市场推后数年。另外，ByteIota 分析提出了可信的负面批评：Varda
              Space Industries 独立测算轨道计算成本按每瓦约为地面 3 倍，且当前 $1,500–3,000/kg 的发射成本必须降至 $200–500/kg，大规模轨道计算才可行。这对部分投资人可能与 K2
              平台关联起来的轨道计算市场叙事构成偏空约束。K2 的主要商业价值驱动（面向 MEO 网络的 satellite bus，而非轨道计算本身）受这项批评影响较小，但媒体报道把这些用例混在一起，会带来投资人认知风险。
