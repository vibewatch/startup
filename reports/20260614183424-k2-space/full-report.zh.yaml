      - number: '2.4'
        title: 增长驱动因素和市场动能
        blocks:
          - type: paragraph
            body: >-
              主要需求驱动是重型运载经济性。K2 CEO 曾表示，Falcon 9 以及最终的 Starship 会 “completely change the trade around mass versus
              cost”，让运营商不必继续围绕航天器质量做优化，而是围绕能力做优化。K2 可以每次 Falcon 9 rideshare 部署 10 颗 Mega Class 卫星：先发射到 LEO，再用机载电推进在 90
              天内抬升到 MEO。这比直接发射到 MEO 的卫星密度高 4 倍，也大幅降低单星发射成本。Giga Class 平台（100 kW，面向 Starship 和 New Glenn 设计）进一步延伸了这套逻辑：如果
              Starship 实现商业可用，它会打开当下卫星市场无法服务的全新性能层级。

              第二个驱动是 MEO 轨道经济性。K2 面向运营商的核心市场叙事，是覆盖效率：相对于 LEO，从 MEO 实现全球覆盖需要的卫星更少。按 K2 管理层估计，50 颗 MEO 卫星在覆盖上可以替代 150 颗
              LEO 卫星。再叠加 $15M 的 bus 价格，MEO 星座首次在财务上可与大型 LEO 部署竞争。Via Satellite 报道称，SES CEO 将 “capital investment wars”
              描述为运营商面临的核心压力，并强调需要聚合资本来对抗 Starlink 这类垂直整合玩家。高功率 MEO 平台提供了资本效率更高的替代方案。

              第三个驱动是国防需求增长。乌克兰冲突后，NATO 盟国提高国防预算；美国政府则推进 PWSA 架构和需要天基资产的 Golden Dome 导弹防御。K2 的 Gravitas 任务专门由 Space Force
              出资验证 MEO 能力，显示出正式采购项目之前的机构兴趣。SDA 的 HALO Europa 项目（2026）显示政府继续投资 proliferated space architectures，尽管该具体项目偏向
              LEO。管理层还称，K2 适配 Resilient GPS 项目；该项目希望用具备 MEO 能力的平台增强 GPS。
