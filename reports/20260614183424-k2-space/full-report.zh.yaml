      - number: '5.5'
        title: 信任、安全与技术风险画像
        blocks:
          - type: paragraph
            body: >
              K2 的风险画像来自三大领域：任务履历深度、技术新颖性和商业市场不确定性。截至 2026 年 6 月，公司在轨履历包括一次托管载荷演示（2025 年 1 月）和一次完整卫星发射（GRAVITAS，2026 年 3
              月）。两个里程碑都具备运营意义，但完整系统在长程 LEO 至 MEO 抬轨、长期 MEO 运行，以及 10 年任务寿命内辐射导致 avionics 退化方面，仍未完成验证。20 kW Hall thruster
              是有史以来飞行功率最高的同类设备，已完成地面测试并正在在轨运行，但其长期侵蚀特征和持续在轨效率仍是开放问题。K2 的自主 Rust 语言抬轨 GNC 算法具备新颖性；没有公开披露独立安全分析。


              商业市场侧，支撑 Giga Class 路线图的在轨计算用例面临相当多质疑。Varda Space Industries 行业分析师测算，在当前发射价格下，在轨计算每瓦成本约为地面同类的 3
              倍。University of Hong Kong Laboratory for Space Research 的 Quentin A. Parker 表示，K2
              的在轨计算论点经过严格成本分析后「并不真的站得住」。OpenAI 联合创始人 Sam Altman 也认为这一概念为时过早。K2 的反驳是，真空冷却和高 8 倍的太阳照射使能源成本较地面降低 15
              倍；该说法缩小了经济性差距，但没有消除差距。


              政府合规侧，K2 的 $60 million STRATFI 奖项和 OPIR/SMI 参与验证了任务质量，但政府项目也带来严格 ITAR
              管制、进度问责和质量管理要求。公司没有公开披露质量认证（AS9100、CMMI 或同等认证）或独立审计结果。K2 的 GitHub 组织只有一个 forked repository，近期活动很少，说明 K2
              没有公开软件开发者社区界面——这对硬件公司合理，但限制了外部对其软件栈的验证。
