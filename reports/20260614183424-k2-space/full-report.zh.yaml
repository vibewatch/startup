      - number: '8.5'
        title: 最终尽调问题与退出准备度
        blocks:
          - type: paragraph
            body: >-
              主要尽调缺口集中在三块：私人财务不透明、资本结构未知、在轨性能确认。K2 未披露收入、毛利率、运营烧钱速度或现金头寸——这些信息是任何 Series C 阶段投资备忘录的标准内容，也是建模判断资本是否足以支撑
              Giga 级路线图的必要输入。投资者必须要求审计财务报表、董事会批准的预测，以及详细现金跑道分析，作为任何承诺资本的前置条件。


              股权结构和优先股层级尽调同样关键。公司六轮融资合计 $450 million，创始股权基础大概率还包括大量期权授予；在不同退出情景下，Series C
              投资者实际可拿到的普通股价值未知。必须做一份覆盖所有既往轮次清算优先权、反稀释条款和 pay-to-play 条款的瀑布分析。T. Rowe Price
              作为有流动性要求的机构资产管理人参投，即便提前流动性事件不符合普通股持有人最佳利益，也可能带来这种压力。


              在轨性能尽调应聚焦 GRAVITAS LEO 至 MEO 抬轨的完整结果——具体包括 20 kW Hall-effect thruster 在太空中的效率和衰减、太阳能阵列在初始 LEO
              辐射暴露后的输出，以及航电在完整 MEO 转移过程中的表现。这些数据点将最终验证或否定 K2 的平台论点。退出准备度中等：如果执行守住，K2 具备 2028–2030 年 IPO
              所需的画像和牵引力；对希望垂直整合进高功率卫星制造的国防主承包商来说，它也是潜在战略收购目标。公司未宣布或暗示任何 IPO 或 M&A 活动。
            claimRefs:
              - CV036
              - CV037
              - CV040
              - CV044
