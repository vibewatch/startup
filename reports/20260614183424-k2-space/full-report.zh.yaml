      - number: '2.3'
        title: 买方和细分市场地图
        blocks:
          - type: paragraph
            body: >-
              K2 Space 面向三个清晰买方细分，每类都有不同预算负责人、采用触发点和采购周期。第一类也是最大的已确认细分，是商业宽带 / 通信运营商，主要代表是 SES。SES 完成 Intelsat
              收购后（合并收入约每年 €3.5B）下了 28 颗 meoSphere 订单，并把采购转向迭代模式，而非多年期批量卫星项目。SES 的买方是 CEO
              和网络战略团队；技术决策者是网络架构团队；预算来源是下一代基础设施资本开支。SES CEO Adel Al-Saleh 2025 年 9 月表示，“we can't have five-to-seven-year
              development cycles”，并把 pathfinder missions 描述为一种新采购模式。这代表大型运营商采购卫星方式的结构性转变——从庞大的瀑布式采购转向敏捷、迭代承诺。

              第二类是美国政府和国防。SDA 是最活跃的买方信号，2025 年 12 月为 PWSA 项目 72 颗 Tracking Layer Tranche 3 卫星拨付 $3.5B。K2 通过 SpaceWERX 为
              Gravitas 任务获得 $60M STRATFI 合同，管理层还把 Golden Dome 导弹防御架构列为未来机会。DoD 内部买方是 Space Force、SDA 和 Air Force
              Research Laboratory 的项目办公室；预算权力通过 FYDP 和 STRATFI / SBIR 项目流转。K2 的 Head of Strategy、前五角大楼 space policy
              chief Dr. John Plumb 曾表示，“both government and commercial partners are demanding more power, more
              capability, and lower cost.” 第三类规模更小、边界更不清晰，是寻求独立宽带和侦察星座的盟国及主权政府运营方。地缘政治扰动（Telesat CEO 称其为 “the biggest
              commercial opportunities for Telesat and the rest of us”）正在加速主权方对专用空间基础设施的需求。SES 的 meoSphere
              也设计为支持主权政府应用，提供军用 Ka-band 容量和专用波形。这些主权运营方未来可能通过卫星运营商中介成为 K2 bus 客户。
