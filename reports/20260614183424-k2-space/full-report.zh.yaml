              - CR024
          - type: callout
            title: ITAR 限制国际上行空间
            body: >
              K2 的增长论点要求公司从美国政府和 SES 扩展到更广泛的商业客户群。带有国家安全载荷履历的航天器受 ITAR 约束；如果没有美国国务院许可，K2
              很难向非美国条约盟友阵营的商业运营商销售卫星平台，而单笔许可通常需要 60–120 天，且不保证获批。国际市场扩张因此存在结构性摩擦；在 K2 清晰切分受 ITAR
              管制的防务平台与纯商业平台之前，其可服务市场实际上被封顶。
