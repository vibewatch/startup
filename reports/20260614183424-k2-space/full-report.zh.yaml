  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台组合与产品线
        blocks:
          - type: paragraph
            body: >
              K2 Space 提供两档能力不同的卫星平台。Mega Class 是公司已具备量产准备的产品线，采用 3 m × 2.7 m 平板式平台，可提供 30 kW 峰值载荷功率、3,000 kg 可用载荷质量和 40
              米展开翼展。该平台尺寸适配 Falcon 9、Vulcan、Ariane 6 等主力火箭，并针对堆叠发射优化——每枚 Falcon 9 最多搭载 10 颗 Mega 卫星，单次发射提供 200 kW
              在轨功率。这种堆叠几何重写了星座部署经济性：K2 称，相比直接送入 MEO，每次发射可带来 4 倍卫星数量，每颗卫星再用机载 Hall-effect thruster 自主抬轨。GRAVITAS 卫星是首颗完整
              Mega Class 飞行单元，2026 年 3 月 30 日搭乘 SpaceX Transporter-16 发射，携带来自 DoD 和商业客户的 12 个未披露载荷模块；截至 2026 年 6
              月，该卫星已在轨运行，并正在完成 LEO 至 MEO 抬轨。


              Giga Class 是 K2 的第二条产品线，明确为 SpaceX Starship 和 Blue Origin New Glenn 等超重型运载器设计。Giga 每颗卫星提供 110 kW
              阵列功率、15,000 kg 载荷质量和 6.2 m × 6.2 m 载荷甲板，由四台 K2 20 kW Hall-effect thruster 驱动。该平台瞄准目前难以规模化实现的任务类型：AI
              在轨计算、批量生产巨型望远镜以及高吞吐深空中继网络。Giga 仍处于设计阶段，尚未公布发射日期；Starship 对第三方客户商业可用是前提。K2 在整个 180,000 sq ft Torrance
              工厂地面铺开了 Giga 设计模型。


              两条产品线都把多轨道机动性作为核心差异化。竞争对手普遍采用特定轨道设计，而 Mega 和 Giga 都做了辐射加固，可在 LEO、MEO 和 GEO 运行，并携带高 Δv
              推进，实现自主跨轨道区间转移。公司创立命题是：Falcon 9、Starship、New Glenn 等高运力发射器崛起后，一种新的卫星架构成为可能——更大、更高功率、单位能力更便宜；传统 smallsat
              时代的设计约束做不到这一点。
