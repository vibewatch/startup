      - number: '1.2'
        title: 产品平台和技术里程碑
        blocks:
          - type: paragraph
            body: >
              K2 Space 的旗舰产品是 Mega Class 卫星。公开规格显示，该平台通过自研太阳能阵列产生 20 kW 在轨功率，3m x 2.7m 载荷平台最多承载 3,000 kg 载荷，在轨湿重约 2
              metric tons，太阳翼展开跨度约 40 meters。平台采用机载霍尔效应推进系统，设计为覆盖 LEO、MEO、GEO 和地月空间轨道。

              K2 约 80% 的卫星部件自制，包括反作用飞轮、飞行计算机、太阳能阵列和霍尔效应推力器。垂直整合是公司压低成本、缩短交付周期的主要杠杆。2025 年 5 月，K2 在 Torrance
              总部以全功率点火测试了一台 20 kW、氪气供给的霍尔效应推力器；这是私营公司设施中运行过的最高功率霍尔效应推力器，也在首个完整任务前验证了核心推进系统。

              首次在轨技术演示于 2025 年 1 月搭载 D-Orbit ION 飞行器发射，发射任务为 SpaceX Transporter-12，验证了飞行计算机、反作用飞轮和嵌入式航电栈。首个完整 Mega Class
              任务 GRAVITAS 为美国 Space Force 搭载 DoD 载荷，隶属 STRATFI 项目，并于 2026 年 3 月随 SpaceX Falcon 9 Transporter-16
              rideshare 发射。除 Mega Class 外，K2 还公开描述了 Giga Class 卫星，目标功率 100 kW，面向 Starship 和 New Glenn 大幅降低发射成本后的时代。计划于
              2027 年 2 月执行的 Trinity 任务，目标是在三条轨道部署三颗卫星并搭载光学 mesh 载荷，把多轨道战略延伸到光通信架构。
