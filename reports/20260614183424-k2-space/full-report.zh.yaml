              SES meoSphere 星座 28 颗 Mega Class 卫星订单，加上 K2 Space 被选为 PTS-G GEO 国防项目的 bus 供应商，让公司在创立四年内就获得了横跨 LEO、MEO 和
              GEO 的生产可见度。一个具名商业运营商叠加一个 DoD 项目，验证了多轨道战略，也提供了生产锚点，降低了近期工厂爬坡风险。
            calloutType: strength
