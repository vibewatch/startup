  - id: TR001
    title: 监管 / 法律风险登记表
    columns:
      - 规则 / 许可 / 框架
      - 司法辖区
      - 状态
      - 可能性
      - 严重性
      - 缓释措施
      - 剩余敞口
      - 尽调路径
    rows:
      - - ITAR（USML Cat XV——航天器系统）
        - 美国 / State Dept DDTC
        - 有效 / 需要持续合规
        - 高
        - 关键
        - 内部合规项目；按项目申请出口许可；涉密设施协议
        - SES（LU）合作需要 DSP-5 出口许可；涉密载荷访问控制至关重要
        - 索取 DDTC 许可状态；核验 SES meoSphere 项目的 TAA/MLA 是否已就位
      - - FCC 授权（频谱 + 轨道槽位）
        - 美国 / FCC
        - 尚未公开披露
        - 高
        - 高
        - 约 8,000 km MEO 槽位需要与 ITU 和外国主管机关协调
        - 未公开可查到 FCC 申报或 ITU 协调记录；构成重大缺口
        - 索取 meoSphere MEO 槽位的 FCC 许可申请状态和 ITU 申报位置
      - - SpaceWERX STRATFI 项目条款
        - 美国 / Space Force
        - 有效——2024 年 12 月获授 $60M STRATFI 合同
        - 中
        - 高
        - SBIR Phase III 配套结构；必须满足政府里程碑才能付款
        - STRATFI 合同可能重组或不续约；技术过渡到 Program of Record 没有保证
        - 获取 STRATFI 合同条款；核验里程碑付款计划和持续 Phase III 义务
      - - EAR（Commerce Dept——两用物项）
        - 美国 / BIS
        - 有效 / 持续合规
        - 中
        - 中
        - 商业卫星组件需在 EAR 与 ITAR 边界之间分类
        - ITAR 航天器类别与商业组件 EAR 覆盖存在重叠，带来分类风险
        - 法律审查组件分类；确认 BIS 许可例外是否适用于 SES 和 IRIS² 项目
      - - Defense Federal Acquisition Regulation（DFARS 法规）
        - 美国 / DoD
        - 有效——适用于 PTS-G 和 STRATFI
        - 低
        - 中
        - 主承包商（SES、Viasat）承担 DFARS 合规义务；K2 是分包商
        - 作为分包商，K2 必须满足网络安全（CMMC）、假冒零部件和供应链风险等下传条款
        - 核验 CMMC Level 2 或 3 认证状态；审计 PTS-G 分包合同中的下传合规义务
    notes: >
      各行按严重性排序。ITAR 状态来自公开合同披露（STRATFI、PTS-G、国家安全载荷）；没有 K2 Space 的公开 DDTC 许可记录。FCC 和 ITU 状态未经验证——这是重大尽调缺口。STRATFI 条款来自
      K2 和 SpaceWERX 新闻披露。
    enumerationScope:
      coverage: partial
      basis: >
        Known regulatory frameworks applicable to US satellite manufacturers under DoD contracts; limited to publicly
        disclosed program information. FCC and ITU status, DDTC individual license applications, and internal compliance
        program details are non-public.
