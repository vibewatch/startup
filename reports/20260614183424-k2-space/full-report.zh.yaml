    title: 客户流程——卫星部署与运行流
    type: flow
    layout: standard
    summary: 一颗 K2 Mega Class 卫星从发射、调试到任务周期内运行的部署路径。
    data:
      nodes:
        - id: payload-integration
          label: 在 Torrance 集成载荷
          detail: 客户载荷安装在 Mega Class 平板平台上（最多 12 个模块）；与 K2 协商 ICD；75–85% 自研卫星围绕载荷搭建
        - id: launch
          label: 发射至 LEO（Falcon 9 拼车）
          detail: 每枚 Falcon 9 最多堆叠 10 颗 Mega 卫星；单星发射约 $7.2M（客户费率）；Transporter 拼车模式相比专属发射降本
        - id: leo-commissioning
          label: LEO 检查与调试
          detail: 载荷激活；系统健康检查；太阳能阵列展开；推进器初始检查
        - id: orbit-raise
          label: LEO→MEO 轨道提升（20 kW 霍尔推进器）
          detail: 霍尔推进器连续点火；转移约 90 天；消耗总推进剂的 35%；卫星爬升时辐射环境增强
        - id: meo-operations
