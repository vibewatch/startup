      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: 持有 / 跟踪——等待 GRAVITAS 在轨验证
            body: >-
              K2 Space 是过去十年出现的技术可信度最高的卫星制造初创公司之一，拥有差异化平台、出色创始团队，以及 $500 million 已签合同带来的真实需求侧证据。但 $3 billion Series C
              入场价计入了执行期权，只有等 GRAVITAS 完成 LEO 至 MEO 抬轨，并确认 20 kW 推进器的在轨表现后，这些期权才会被定价清楚。没有这些数据就以 $3B
              进入，是一笔不对称下注：牛市回报（2–3x）不足以补偿下轮融资降估的熊市风险。应积极跟踪；在在轨结果确认核心技术论点后再承诺资本。
            calloutType: recommendation
            claimRefs:
              - CV031
              - CV032
              - CV033
              - CV034
          - type: callout
            title: 关键未知——优先股层级与资本结构不透明
            body: >-
              K2 Space 六轮融资共募得 $450 million，但未披露股权结构、清算优先权或反稀释条款。以 $3 billion 进入时，早期投资者——以显著更低估值买入——带来的优先权负担，会在任何低于 $4–5
              billion 的退出中给 Series C 投资者制造有意义的下行风险。考虑到 T. Rowe Price
              参投，这一点尤其重要：作为机构资产管理人，它可能要求流动性条款或拖售权，从而影响退出时点和条件。完整资本结构披露应成为任何承诺资本的前置条件。
            calloutType: risk
            claimRefs:
              - CV037
              - CV040
          - type: callout
            title: SES meoSphere 订单——近期最大商业锚
            body: >-
              2026 年 3 月，SES 宣布为 meoSphere 星座初始订购 28 颗 K2 Mega-class 卫星，按每颗约 $15 million 计算，单一 Tier-1 运营商就隐含约 $420
              million 合同价值。SES CEO Adel Al-Saleh 表示，最终 MEO 星队目标约为 100 颗卫星，暗示这段长期关系可能带来 $1.5 billion
              或更多收入。该订单部分降低了商业论点风险，并提供了一个需求锚，其分量远超 $3 billion Series C 价格中嵌入的 GRAVITAS 前投机成分。
            calloutType: insight
            claimRefs:
              - CV009
              - CV010
              - CV039
              - CV042
          - type: callout
            title: Giga Class 估值期权——高度投机
            body: >-
              K2 的 Giga-class 卫星平台（100 kW、15,000 kg 载荷、Starship 尺寸）是牛市估值叙事的重要组成。但 Giga 仍处于设计阶段，没有宣布发射日期，也没有披露客户承诺。截至
              2026 年 6 月，第三方载荷使用商业 Starship 的可获得性仍具投机性。投资者应在任何近期估值模型中把 Giga-class 期权权重设为零，并把它当作一个针对超大可服务市场的免费看涨期权——只有在
              K2 成功执行 Mega 爬坡、且 Starship 达到商业发射节奏后才有实质价值。
            calloutType: assumption
            claimRefs:
              - CV027
              - CV028
