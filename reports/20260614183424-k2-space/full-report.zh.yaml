      items:
        - label: Bear 情景退出企业价值
          low: 1200
          high: 2500
          unit: $M
          note: GRAVITAS 表现不及预期或 SES 推迟触发；大概率下轮估值下调
        - label: Base 情景退出企业价值
          low: 3000
          high: 5000
          unit: $M
          note: 部分执行到位；Series C 投资人稀释前总回报 1–1.5x
        - label: Bull 情景退出企业价值
          low: 6000
          high: 10000
          unit: $M
          note: SES 完整交付 + DoD 扩张；Series C 稀释前总回报 2–3x
        - label: Series C 入场（参照）
          low: 3000
          high: 3000
          unit: $M
          note: 2025 年 12 月投前估值锚点
