  - id: FI001
    title: 收入模型桥——从客户活动到毛利
    type: flow
    layout: wide
    summary: 一笔 K2 客户合作如何从签约流向卫星交付、收入确认和毛利；各阶段利润率均未披露。
    data:
      nodes:
        - id: customer
          label: 政府或商业客户
          detail: 美国太空军、SES 或未披露星座运营商。客户自带载荷；K2 供应卫星平台。
        - id: contract
          label: 签署合同（标价 $15M/颗）
          detail: 客户承诺购买卫星。实际付款里程碑、预付款和取消条款未披露。
        - id: manufacturing
          label: 内部制造（75% 垂直整合）
          detail: K2 制造反作用轮、飞行计算机、太阳能阵列和霍尔效应推进器。公司称交付周期 <3 个月。
        - id: payload-integration
          label: 载荷集成与测试
          detail: 客户载荷在 Torrance 集成进 K2 平台。Gravitas 搭载 12 个未披露载荷模块飞行。
        - id: launch
          label: 发射（SpaceX Falcon 9，约 $7.2M/颗）
          detail: 发射成本与平台成本分开。按当前 Falcon 9 客户价格，每颗卫星增加约 $7.2M。Giga Class 需要 Starship（截至 2026 年中尚不可用）。
        - id: delivery
          label: 在轨交付与运营移交
          detail: K2 使用 20 kW 霍尔推进器执行轨道抬升（<90 天从 LEO 到 MEO）。交付后客户接手运营。
        - id: revenue
          label: 收入确认（时点未披露）
          detail: K2 未披露收入是在签约、里程碑完成还是在轨交付时确认。没有可用经审计财务报表。
        - id: gross-profit
          label: 毛利（利润率未披露）
          detail: 毛利率未披露。公开可比卫星制造商 Rocket Lab 在 FY2025 产品收入上实现约 20–35% 毛利率。
