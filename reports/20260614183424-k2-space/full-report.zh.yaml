      - number: '7.4'
        title: 客户集中与政府项目依赖
        blocks:
          - type: paragraph
            body: >
              K2 Space 宣布的 $500 million 已签合同集中在两组关系上，它们既是最强商业验证，也是最大的单点故障风险。商业侧，SES 于 2026 年 3 月为其 meoSphere MEO 星座首批订购
              28 颗 K2 Mega-class 卫星，SES CEO Adel Al-Saleh 还勾勒出最终 100 颗卫星的星队。按每个平台 $15 million 计算，首批 28 颗卫星订单意味着 K2 约
              $420 million 潜在收入——这是初创制造商已披露的最大单笔商业卫星制造合同。不过，SES 明确表示，订单取决于 pathfinder 任务验证：2026–2027 年计划多次 pathfinder
              任务，并逐步提高载荷复杂度；SES 也表示会根据市场需求「从数量角度作出调整」。pathfinder 失败或 SES 战略转向，都会拿掉公司的主要商业收入来源。政府侧，K2 是 SES Protected
              Tactical Satcom-Global（PTS-G）授标的平台供应商；该项目是 Space Force 一份 $437.7 million 通信合同。K2 还参与 OPIR Space
              Modernization Initiative（SMI，FY2027 预算 $180 million）和最初来自 SpaceWERX 的 $60 million STRATFI
              奖项。这些项目易受国会拨款不确定性、Department of Defense 优先级变化，以及 Golden Dome 和导弹防御架构政治意愿变化影响。以往 SBIR/STRATFI 项目在技术未能转入
              Program of Record 时，曾被重组或取消。商业和政府收入都集中在美国防务相邻市场，也限制了 K2 的定价权，并引入采购周期风险。
