            title: 破纪录推进系统撑起首创多轨道部署模型
            body: >
              K2 的 20 kW Krypton-fed Hall-effect thruster，是有史以来飞上太空的最强同类设备，功率为此前任何已飞 Hall thruster 的 4 倍；它是 K2
              成本模型能跑通的技术底座。每枚 Falcon 9 把 10 颗 Mega 卫星送入 LEO（而不是专门 MEO 发射的一两颗），再用 Hall thruster 在 90 天内自主抬轨，K2
              将每次发射部署密度提高 4 倍。这不是边际改善，而是 MEO 星座经济性的结构性变化；没有同等级 thruster 的竞争对手今天无法复制。
            calloutType: strength
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
          - type: callout
            title: Giga Class 商业可行性取决于两项未验证依赖
            body: >
              Giga Class 是 K2 最大的收入机会，但它同时需要：（1）超重型运载器（Starship / New Glenn）商业可用，且价格足以跑通在轨计算经济性；（2）规模化在轨计算商业需求得到证明。截至
              2026 年中，两者都未被验证。包括 Varda Space 分析师和 University of Hong Kong 研究人员在内的行业批评者认为，当前发射价格下在轨计算经济性无法闭合；因此，Giga
              的商业案例建立在双重依赖之上，而 K2 和任何其他公司都无法控制这两项依赖。
            calloutType: risk
            claimRefs:
              - CE007
              - CE030
              - CE031
              - CE035
              - CE036
          - type: callout
            title: 承销 Mega 星座合同前，先验证长期 MEO 性能
            body: >
              GRAVITAS 是 K2 首次完整系统在轨测试，截至 2026 年 6 月，LEO 至 MEO 抬轨仍在进行。投资人和采购官在把 Mega Class 性能视为完全去风险之前，应索取覆盖完整抬轨、初始 MEO
              运行、载荷表现和 thruster 健康遥测的 GRAVITAS 任务数据。SES 的 28 颗卫星订单以及任何政府星座合同，都是对一个在轨履历不足 12 个月的平台作出的重大承诺。
            calloutType: recommendation
            claimRefs:
              - CE005
              - CE006
              - CE023
              - CE025
  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与具名客户证明
        blocks:
          - type: paragraph
            body: >-
              K2 Space 采用双轨客户模式：美国政府和国家安全机构今天提供锚定收入和项目验证，商业卫星运营商则为长期生产管线提供锚点，目前具名商业锚点只有 SES。U.S. Space Force 通过
              SpaceWERX 于 2024 年 12 月授予 K2 一份 $60 million Strategic Funding Increase（STRATFI）合同，用于 GRAVITAS——K2 首颗 Mega
              Class 卫星。多个 Department of the Air Force 机构共同资助该任务，包括 Space Domain Awareness and Combat Power PEO、Space
              Development Agency、Space Warfighting Acquisition Delta、DoD Space Test Program、Space Force National Space
              Test and Training Complex 和 Air Force Research Laboratory。GRAVITAS 于 2026 年 3 月 30 日搭乘 SpaceX Falcon
              9（Transporter-16）发射，携带来自国家安全和商业客户的 12 个未披露载荷模块。


              商业侧，SES 于 2025 年 9 月 16 日在 Paris 的 World Space Business Week 宣布与 K2 建立战略合作。2026 年 3 月 24 日，双方在 Washington
              的 Satellite 2026 大会上宣布 Phase 1 meoSphere MEO 星座的正式 28 颗卫星量产订单，合作升级为正式订单。SES CEO Adel Al-Saleh 确认，SES 在
              GRAVITAS 上搭载了多个载荷，使其成为首颗 meoSphere pathfinder 卫星。K2 CEO Karan Kunjur 表示，K2 计划在 GRAVITAS 之后 21
              个月内发射十颗测试卫星，其中两颗专用于 SES pathfinder 任务。meoSphere Phase 1 架构规定，28 颗卫星分布在约 8,000 km 高度的四个倾斜轨道面，目标到 2030
              年形成完整运行能力。Advanced Television 称这笔 28 颗卫星订单「也许是卫星行业有史以来最大的中地球轨道订单」。


              除 STRATFI 和 SES 外，五角大楼还选择 K2 参与 Overhead Persistent Infrared（OPIR）Space Modernization
              Initiative（SMI），这是一个独立 R&D 项目，FY2027 预算为 $180 million（其中 $7.3 million 用于 crosslink demonstrations），目标是在
              MEO 测试光学星间链路，以支持 Golden Dome 导弹防御架构。K2 战略负责人 John Plumb 称这些实验对 Golden Dome「绝对关键」。所有其他 GRAVITAS 载荷客户以及更广泛的
              $500M+ 已签 backlog 仍未披露，这限制了三项具名项目之外的客户基础可见度。
