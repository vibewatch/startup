      - number: '3.5'
        title: 护城河评估和不利竞争证据
        blocks:
          - type: paragraph
            body: >-
              K2 Space 的竞争护城河建立在四根支柱上：功率等级差异化；通过垂直整合实现制造成本优势；一套当前没有 incumbent 能以可负担 proliferated bus 复制的多轨道架构；以及通过 SES
              合作形成的早期客户锁定，覆盖 meoSphere（商业 MEO）和 PTS-G（MILSATCOM GEO）。每根支柱近期都有耐久性，但长期都更脆弱。

              功率等级优势（单星 20–30 kW）截至 2026 年中是真实的——没有竞争者以 K2 宣称价格提供同功率等级的可比 proliferated bus——但它无法申请专利保护，并依赖 K2
              自研霍尔效应推力器和太阳能阵列继续保持成本优势。如果 Boeing 或 Northrop Grumman 追赶一个竞争性高功率商业 bus 项目，它们会带来 K2 仍缺乏的数十年抗辐射经验和政府关系。

              制造成本护城河（75–85% 自制、180,000 sq ft 工厂、100 颗 /
              年产能）是近期最可防守的优势，因为复制它需要资本投入和供应链开发，通常要花数年。但创造效率的同一套垂直整合，也制造了单点故障风险：任何设计缺陷或供应链中断都会传导到 Torrance 工厂建造的所有卫星。

              多轨道架构护城河取决于客户是否重视轨道灵活性。随着 proliferated LEO 星座成熟，MEO / GEO 切换的增量价值可能没那么关键。DoD 和商业运营商已经在使用替代路径——从不同制造商采购专用
              LEO 和 GEO bus 的组合。

              不利证据集中在三点。第一，截至 2026 年 6 月，K2 只有一颗完整 Mega Class 卫星（GRAVITAS）发射，在这一功率等级下承受 MEO 辐射暴露的运营 heritage
              有限。第二，Boeing 和 Northrop Grumman 仍在 PTS-G 合格竞争者 pool 中，意味着 incumbents 可以在未来授标周期带着专门设计的产品重新进入。第三，K2
              商业收入集中于单一合作伙伴 SES；如果 SES 调整 meoSphere 节奏或财务状况恶化，客户集中度风险就会暴露。

              Incumbents 的竞争回应迄今仍处于潜伏状态——Boeing 聚焦 ESS 核项目和 Millennium Space 的 LEO 工作；Northrop 聚焦 AEHF 后继需求。但 $4B PTS-G
              IDIQ、Golden Dome 导弹防御计划，以及对 proliferated MEO 卫星需求的增长，都会激励 incumbents 在未来 3–5 年开发或收购竞争性高功率 bus 能力。
