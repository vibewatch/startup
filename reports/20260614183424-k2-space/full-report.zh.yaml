            body: >-
              K2 Space 将约 80% 的卫星部件自制，包括全球功率最高的商业霍尔效应推力器、反作用飞轮、飞行计算机和太阳能阵列，因此做到约 $15M
              单星定价和三个月内交付；传统供应商链条在结构上很难给出这样的组合。这是公司价格差异化的主要基础，也是 SES meoSphere 订单的支撑。
