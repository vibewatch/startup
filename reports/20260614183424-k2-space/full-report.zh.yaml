      - number: '6.3'
        title: 留存、扩张路径与集中风险
        blocks:
          - type: paragraph
            body: >-
              按任何常规口径，K2 Space 都仍处于收入前阶段：公司尚未完成量产卫星交付，也没有公开披露 NRR、GRR 或 churn 数据。现有最强留存信号，是 SES 从战略合作（2025 年 9 月）升级为正式
              28 颗卫星量产订单（2026 年 3 月），六个月推进显示客户愿意在 pathfinder 证据后扩大财务承诺。五角大楼选择 K2 参与 OPIR/SMI，是第二个独立政府项目，说明 DoD 在初始
              STRATFI 范围之外仍有重复兴趣。


              不过，客户集中是本章主导风险。SES 是唯一具名、且有正式平台订单的商业星座客户；$500M+ backlog 中嵌入的其他商业关系全部匿名。政府侧，U.S. Space Force 通过 STRATFI
              成为唯一锚点，而 STRATFI 需要国会年度拨款。$60M STRATFI 合同采用混合工具结构（政府资金 + SBIR 配套 + 私人共同投资），意味着仅靠政府拨款并不覆盖全部价值，后续 follow-on
              合同尚未宣布。


              独立航天行业分析机构 Counterflow Solutions 在 2025 年指出，「政府仍然是 K2 当前收入画像的经济支柱」，商业需求尚未规模化兑现。SES CEO Al-Saleh
              确认，meoSphere 已有选项可扩至约 100 颗卫星，但这些选项与 SES 的另一项表述并存：meoSphere 已纳入 FY2026
              资本开支指引，并将通过跨大西洋双供应链建设。这种表述强化了采购意图和预算承诺，但执行风险和 pathfinder 转化风险仍压在单一商业运营商身上。将 meoSphere 扩至约 100 颗卫星的选项，仍取决于
              pathfinder 成功和 SES 需求增长。land-and-expand 故事在结构上有吸引力——一个运营商已签 28 颗卫星，并带有 100 颗卫星选项——但量产收入距离兑现还有三到四年；在此期间，K2
              依赖政府任务持续拨款、投资人资本以及 pathfinder 表现成功。
