      - number: '7.6'
        title: 竞争、披露不透明与任务保障
        blocks:
          - type: paragraph
            body: >
              K2 Space 最主要的竞争风险并非 Boeing、Northrop、Thales、Airbus
              等仍绑定在成本加成式精密卫星项目上的传统主承包商，而是同时拿下国防卫星合同的相邻新航天平台厂商。SpaceNews 在 2026 年 6 月确认，Rocket Lab 通过 Viasat 团队获得了 PTS-G
              的平行卫星平台供应商角色——这使 Rocket Lab 在未来政府卫星通信订单上直接与 K2/SES 竞争。商用高功率卫星平台市场一旦成形，其他已拥有运载火箭关系或历史项目积累的制造商，可能以更低执行风险复制
              K2 的多轨道平台概念。K2 逆向押注「更大的卫星」，其结构性风险在于：Starship 打开可负担的超重型运力后，所有制造商都会同等受益；如果 K2
              在资本充足的竞争者进入前没有完成产能爬坡，先发优势可能被削弱。披露层面，K2 仍是私人公司，没有公开财务报表，不披露烧钱速度、收入确认节奏，也不提供合同里程碑或付款触发条件细节。所谓 $500
              million「已签合同」没有区分有约束力订单与意向书，也没有区分里程碑付款与固定承诺，投资者和客户无法独立验证财务健康。任务保障风险同样不透明：Gravitas 抬轨最长要 90 天穿越 Van Allen
              辐射带，在地球轨道可用的最严苛辐射环境中测试子系统可靠性，而集成 20 kW 平台此前没有在轨履历。若抬轨失败，K2 的全部商业和政府日程将倒退 12–18 个月；这是重新建造、测试并发射替代卫星所需的最短时间。
            claimRefs:
