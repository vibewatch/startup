      - number: '8.4'
        title: 投资建议与投资论点风险评估
        blocks:
          - type: paragraph
            body: >-
              建议：持有 / 跟踪——在 GRAVITAS 任务结果得到验证前，不要以 $3 billion 进入。K2 Space 的投资故事在逻辑上很有吸引力：技术差异化的卫星平台、前 SpaceX
              工程师组成的可信创始团队、以 SES 28 星 meoSphere 订单为锚的 $500 million 已签合同积压，以及围绕重型运力时代经济性建立的可防守产品论点。但 Series C
              价格计入了大量尚未去风险的执行期权。截至 2026 年 6 月，GRAVITAS 仍在执行 LEO 至 MEO
              抬轨；公开记录尚未确认结果。现在进入的投资者要面对：（a）公司史上最大技术演示仍处于收入前执行风险中；（b）此前 $450 million
              股权融资带来的未知优先权负担；（c）没有公开财务来校准烧钱速度、利润率或资本强度；（d）$3 billion 入场价要求一切都顺利——政府需求持续、SES 交付、Mega 产能爬坡——才有令人满意的 2–3x
              毛回报。


              置信度：中。合同证据强，团队履历异常突出，SES 合作为需求侧提供了有意义的锚。但 K2
              财务的私人不透明性，使尽调深度不足以把置信度提升到高。风险评级：高。收入前深科技硬件制造商的标准风险，被单一产品依赖、新颖在轨环境，以及资金充足的国防主承包商和 York Space
              Systems、Intuitive Machines Lanteris 等新进入制造商的竞争威胁进一步放大。


              估值立场：偏贵，但在基准情景下仍可辩护。入场纪律应要求满足以下之一：（a）GRAVITAS 任务完成在轨验证（预计 2026 年底前）；（b）SES 书面确认超过 $400 million
              的积压订单；或（c）在二级市场以低于 Series C 价格进入。投资论点破裂触发条件包括 GRAVITAS 任务失败、SES 推迟，或连续两个及以上季度的项目滑期，显示工厂没有达到节奏目标。
            claimRefs:
