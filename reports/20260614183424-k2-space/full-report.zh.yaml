      - number: '7.2'
        title: 技术执行与制造扩产风险
        blocks:
          - type: paragraph
            body: >
              K2 Space 的竞争论点建立在一组尚未按量产规模验证的工程主张上：在 MEO 飞行的 20 kW Hall-effect thruster（同类首例）、双 10 kW 太阳翼、面向多年 MEO 运行的耐辐射
              avionics、高压电力系统，以及无需按轨道重新设计即可跨 LEO、MEO、GEO 互通的平台架构。Gravitas（2026 年 3 月 30 日搭乘 SpaceX Transporter-16
              发射）是这些子系统首次同时完成集成飞行，把传统项目分三到五次资格任务完成的工作压缩成一次平台演示。「一次测试全部系统」是有意的风险取舍——它加快进度，但任何单一子系统失败都会升级为任务级失败，延后客户交付和收入确认。80%
              垂直整合模式——反作用飞轮、飞行计算机、avionics、thrusters 和太阳翼自制——降低供应商依赖，却集中制造风险：设计缺陷或工装故障会传导到生产批次中的每一台。K2 的 180,000 sq ft
              Torrance 工厂按每年 100 颗卫星设计，但公司从未制造超过一颗完全集成卫星。从 1 到 10 再到 100
              台，需要供应链认证、员工扩张、工艺可重复性和质量保证基础设施；成熟卫星制造商通常也要多年才能完成。Trinity 任务（三颗卫星共乘 2027 年单枚 Falcon
              9）是下一个关键规模演示，但在商业和政府审视下并行制造三台高功率平台，执行风险相较 Gravitas 明显上升。
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR002
            claimRefs: []
      - number: '7.3'
        title: 发射依赖、抬轨与推进风险
        blocks:
          - type: paragraph
            body: >
              K2 Space 的商业模式在两个时间层面结构性依赖发射器可用性。近期（2026–2028 年），Mega-class 策略依赖 SpaceX Falcon 9 rideshare 舱位：Gravitas 搭乘
              Transporter-16，Trinity 已签约 2027 年 Falcon 9，计划中的 2026–2028 年多任务节奏需要持续获得价格有竞争力的 rideshare 舱位。SpaceX 掌握全球
              rideshare 运力超过 60%，而 SpaceflightNow 发射清单中其他 rideshare 任务多次延迟，说明进度滑坡可能级联为载荷交付延后、客户不满和收入流失。长期（2028
              年后），Giga-class 平台（每颗卫星 100 kW）明确按 Starship 或 New Glenn 超重型运载设计；如果 Starship 商业载荷服务延迟到 2028–2029
              年之后，或成本高于模型假设，Giga-class 项目将面临延期或重新设计。2026 年 5 月 28 日 Blue Origin New Glenn 爆炸损坏 Launch Complex 36
              后，重型运载可选性明显更脆弱；这是该公司唯一运营发射台，尽管管理层仍称目标是在年底前复飞，客户短期内没有替代发射场。抬轨推进带来叠加技术风险：Gravitas 依赖 20 kW Krypton-fed
              Hall-effect thruster 在 90 天内从 LEO 转移至 MEO，并将在数周内穿越 Van Allen 辐射带——Earth-Moon
              系统中俘获高能电子和质子通量最高的区域。这是商业航天首次尝试用 20 kW 电推进穿越 Van Allen belts；thruster
              侵蚀、意外等离子体—表面相互作用以及穿越期间太阳翼退化，都是有可能出现的失效模式，公开工程先例有限。K2 仅用 35%
              推进剂完成抬轨，为在轨机动保留余量，但穿越本身会让卫星承受累积辐射剂量，可能把部件寿命压低到计划 10 年任务寿命以下。截至 runDate（2026 年 6 月 14 日），抬轨仍在进行中（Gravitas 3
              月 30 日发射），结果尚未公开确认为完成。
