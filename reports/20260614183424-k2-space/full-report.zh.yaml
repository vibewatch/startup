chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部和商业模式
        blocks:
          - type: paragraph
            body: >
              K2 Space 由 Karan Kunjur（CEO）和 Neel Kunjur（CTO）两兄弟于 2022 年在加州 Torrance 创立。两人都是前 SpaceX 工程师，曾参与 Dragon
              飞船航电和任务系统。公司称自己在打造全球最强大的商业可售卫星，同时强调价格可负担、交付周期短，目标是填补小型 rideshare 星座与传统 GEO 通信卫星之间的空档；后者单星价格通常高达数亿美元。

              核心商业模式是卫星制造：K2 设计、建造并销售 Mega Class satellite bus 平台，客户包括商业运营商、政府机构和国防客户。旗舰 Mega Class 卫星可产生 20 kW
              在轨功率，约为同尺寸商业星座输出的 10 倍；其 3m x 2.7m 载荷平台最多可承载 3,000 kg 载荷，并设计为可在 LEO、MEO、GEO 和地月空间轨道运行。按单星约 $15
              million、三个月内交付的价格和周期，K2 把该平台定位成传统多年期、上亿美元采购周期的颠覆性替代方案。

              截至 2026 年 6 月 14 日这一标准运行日期，K2 Space 已进入后期成长阶段。公司于 2026 年 3 月发射首个完整 Mega Class 任务 GRAVITAS，拿到超过 $500M
              的已签合同，并运营一座位于 Torrance、面积 180,000 sq ft、年产能 100 颗卫星的工厂。公司未公开收入或详细 backlog 拆分。
