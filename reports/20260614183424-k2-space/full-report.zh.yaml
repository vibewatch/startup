      - CV021
      - CV022
      - CV023
      - CV024
  - id: FV004
    title: 投资 KPI 评分卡
    type: kpi
    layout: standard
    summary: 基于截至 2026 年 6 月 14 日的公开证据，对 K2 Space 七个投资维度给出 IC 可用的 1–10 分评分。
    data:
      items:
        - label: 市场规模与增长
          value: 8
          note: 卫星制造 TAM 扩大；国防和商业需求都在加速；SES 资本投入验证需求
        - label: 产品差异化
          value: 8
          note: 20 kW 霍尔效应推进器创世界纪录（比上一代高 4x）；多轨道机动；在 $15M 价格上，功率为可比方案 10x
        - label: 客户证据 / 合同
          value: 7
          note: 已签合同 $500M；SES 28 颗卫星订单；STRATFI；Space Force 激光通信——证据强，但尚未转化为现金
        - label: 财务指标
          value: 3
          note: 收入前；未披露 P&L；烧钱速度和毛利未知；已融 $450M 股权，资本强度令人担忧
        - label: 团队与执行
          value: 8
          note: 前 SpaceX 创始团队；前 Pentagon 官员 Dr. John Plumb 任战略负责人；3 年内员工从 25 人扩至 150+ 人
        - label: 估值入场纪律
          value: 5
          note: 收入前 $3B 估值要求高；相当于积压合同 6x、约 10x 2028E 收入；定价已计入显著选择权
        - label: 证据质量与尽调信心
          value: 5
          note: 公开证据强，但限于已确认合同和定性里程碑；私有财务完全不透明
    approximationNotes: 评分是作者基于公开证据基础给出的 1–10 分判断；10 代表可观察证据达到同类最佳。评分不反映未披露信息。
    claimRefs:
      - CV008
      - CV011
      - CV031
      - CV032
      - CV033
