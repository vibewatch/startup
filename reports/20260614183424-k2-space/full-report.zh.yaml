  - id: TU005
    title: 扩张和集中度风险
    columns:
      - 因素
      - 影响
      - 严重性
      - 尽调路径
    rows:
      - - SES 单一客户商业集中度
        - SES 是唯一公开具名的商业星座客户；如果 SES 订单流失或缩减，主导商业管线会消失，K2 的收入画像将更像政府单一驱动
        - 高
        - 确认 28 颗卫星订单是否包含有约束力且不可取消的承诺或违约金；从 $500M 积压订单中识别 2–3 个额外具名商业星座客户
      - - U.S. Space Force / STRATFI 预算依赖
        - 政府收入由一个实验性资助机制锚定；STRATFI 需要国会年度授权，也不是永久采购路径
        - 高
        - 审阅 STRATFI 合同条款；跟踪 FY2026 和 FY2027 Space Force 拨款；评估 DoD 后续项目采用传统 FAR 采购，还是继续使用 STRATFI/OTA 工具
      - - OPIR/SMI 项目级风险（Golden Dome 依赖）
        - OPIR SMI 是 R&D 项目，不是星座合同；如果 Golden Dome 架构变化或资金转向，K2 第二条政府路径可能削弱
        - 中
        - 监测 DoD FY2027 NDAA 关于 Golden Dome 的条款；跟踪 K2 是否出现在 R&D 演示之外的量产合同中；评估竞争替代方案（如 SpaceX Starshield）
      - - SES meoSphere 期权行权上行空间（落地后扩张）
        - SES CEO 确认已为最多约 100 颗卫星设置期权；若行权，K2 产量将翻倍到三倍，并借助制造规模降低单星成本
        - 正面 / 有条件
        - 跟踪 SES meoSphere 用户增长、O3b mPOWER 利用率，以及 SES 对 meoSphere 资本开支的投资者指引；期权行权决策预计在 2027–2028 年
      - - 匿名管线客户转化风险
        - K2 CEO 暗示 12 个 GRAVITAS 载荷客户正在考虑 10–50 颗卫星星座；从载荷测试客户转为星座买家的转化率未知且未经验证
        - 中
        - 向 K2 索取转化漏斗数据；要求从 $500M 积压订单中提供至少两个额外商业星座客户的具名参考
    notes: 严重性评级（高 / 中）基于已披露事实，由作者评估；没有独立财务模型。SES 期权的“正面 / 有条件”反映真实上行空间，但前提是先导成功和 SES 需求增长。
