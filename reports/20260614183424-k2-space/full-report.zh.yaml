      - number: '2.6'
        title: 图表
        blocks:
          - type: callout
            title: SES meoSphere 订单是唯一已确认的商业锚点
            body: >-
              截至 2026 年 6 月，SES 为 meoSphere 星座首批订购的 28 个 Mega Class 平台，是 K2 高功率 bus 唯一已确认的商业需求锚点。隐含合同价值（按 $15M / bus 约
              $420M）具有实质意义，但 meoSphere 完整部署目标为 2030 年，交付周期横跨多年。投资人对 TAM 叙事的信心，很大程度取决于 SES 项目完成前是否有第二家商业运营商下单。
            calloutType: insight
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM032
          - type: callout
            title: 高功率 bus 细分没有独立 TAM——规模测算需保留
            body: >-
              公开市场中缺少当前、可取得、专门针对高功率 satellite bus 的分析师 TAM，这是实质缺口。本章引用的所有 TAM 和 SAM 数字，要么来自 SIA 历史数据（2013
              年口径），要么来自代理估算，或自下而上的合同汇总。投资人不应把估值锚定在任何特定 SAM 数字上，除非先委托独立市场研究。
            calloutType: risk
            claimRefs:
              - CM005
              - CM032
          - type: callout
            title: 偏空情景——MEO heritage 滞后和采购改革失败
            body: >-
              如果 Gravitas 暴露出抗辐射问题，或轨道抬升未能达到 90 天时间线，商业 MEO 市场逻辑至少会坍塌两到三年，直到重新积累 heritage。同样，如果 DoD 采购改革未放宽 ESPA ring
              和外形尺寸要求，政府 TAM 仍会局限在需要 K2 管理层逐个多年游说的专门项目上。这两个不利情景叠加，构成一个合理的市场 bear case。
            calloutType: risk
