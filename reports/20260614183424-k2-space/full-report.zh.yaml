      - number: '2.2'
        title: 市场规模——多重视角和证据约束
        blocks:
          - type: paragraph
            body: >-
              公开可得材料中，没有独立分析师报告专门拆出高功率 satellite bus（>10 kW）的 TAM。Satellite Industry Association 的 State of the
              Satellite Industry Report 提供了历史基线：全球卫星制造收入 2013 年为 $15.7B，此后继续增长，但 SIA 未按功率等级拆分。整个高功率细分嵌在一个包含所有轨道和所有 bus
              类型的更大市场里。任何关于 K2 具体细分市场的公开 SAM 数字，都建立在代理估算而非一手来源数据上。

              三个视角约束市场规模测算。第一是自上而下看全球卫星制造。基于 SIA 历史基线和推断市场增长轨迹，2024–2026 年全球卫星制造总收入估计约
              $20–25B（代理估算，无当前一手来源）。如果高功率细分（大致包括 5 kW 以上 LEO 星座加 MEO / GEO bus）占该市场 15–30%，则高功率 TAM 约为每年
              $3–7B。由于缺少独立、当前、分细分市场的报告，该估算标记为低置信度。第二是自下而上看已确认需求信号。SES 为 meoSphere 星座下了首批 28 颗卫星订单，按 K2 宣称的 $15M 价格，意味着
              bus 合同价值约 $420M。SDA 2025 年 12 月为 72 颗 Tracking Layer Tranche 3 卫星授予 $3.5B 合同，但这些合同分给多个供应商，且代表比 K2 单独 bus
              更复杂的系统。K2 自称已签商业和政府合同 $500M，覆盖 bus 销售和托管载荷安排。若外推 Payload Space 的报道，即每个 Gravitas 载荷客户都在“考虑 2027 年部署 10 到 50
              颗卫星”，则 50–200 颗额外卫星的 pipeline 合理但未确认。

              第三是工厂产能上限。K2 位于 Torrance、面积 180,000 sq ft 的工厂额定年产 100 颗高功率卫星。按宣称的 $15M 价格，满产对应约 $1.5B 年收入。这更适合作为 K2
              近期可获得服务市场的上限，而不是市场规模数字。若没有关于竞争运营商预算、国防采购拨款以及 Gravitas 后 MEO 星座经济性验证速度的分析师数据，SAM 和 SOM
              仍很难剥离。市场规模尽调缺口在证据缺口章节详述。
