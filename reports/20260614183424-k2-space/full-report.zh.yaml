      - number: '7.5'
        title: 监管、出口管制与法律风险
        blocks:
          - type: paragraph
            body: >
              为美国国防客户制造并运营卫星，使 K2 Space 直接落入《国际武器贸易条例》（ITAR）范围；该条例由美国国务院国防贸易管制局（DDTC）执行。K2 的卫星——尤其是承载 STRATFI、PTS-G 和
              OPIR 等国家安全载荷的卫星——按 USML Category XV（航天器系统及相关设备）归为防务物项。没有许可证或适用豁免，外籍人员不得接触制造设施、技术数据和硬件。SES 总部在卢森堡，并在
              Euronext Paris 上市；meoSphere
              合作中，每一次技术转移、与外籍人员的技术会议，以及发往非美国司法辖区的装运，都需要政府间协议或美国国务院单项出口许可证。审批拖延、许可证被拒或无意披露，都可能让客户项目暂停。频谱和轨道位置还要拿 FCC
              授权；K2 尚未公开披露其 FCC 许可申请、与国际运营商的协调状态，或 meoSphere 计划在约 8,000 km MEO 轨位上的 ITU 申报位置。截至 runDate，公开记录中未发现针对 K2
              Space 的诉讼、监管处罚或执法行动，但公司增长很快，又参与涉密项目；每拿下一个新的政府奖项，合规暴露面都会继续扩大。
