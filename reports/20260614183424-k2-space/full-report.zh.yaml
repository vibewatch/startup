            title: Giga Class 路线图依赖尚未实现的 Starship 成本下降
            body: >-
              K2 的创立假设包括：Starship 会把发射成本从 Falcon 9 每个 manifest slot 约 $7.2M 降至约 $600K。Giga Class 100 kW
              平台就是为这一未来发射经济性设计的。在 Starship 能提供可靠、可负担的商业 rideshare 前，Giga Class 产品线仍取决于 K2 无法控制的开发结果。Mega Class
              在现有运载工具上仍具备商业可行性，但长期路线图依赖 SpaceX 执行。
            calloutType: risk
            claimRefs:
