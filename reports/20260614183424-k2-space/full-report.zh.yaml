companyProfile:
  summary: >-
    K2 Space 是一家位于 Torrance 的私营卫星制造商，2022 年由 Karan 和 Neel Kunjur 两兄弟创立。公司正在打造高功率 Mega Class 卫星，面向 LEO、MEO、GEO
    以及未来的地月空间轨道；更长期还规划了适配重型运载火箭的 Giga 平台。公开证据显示，K2 已拿到有分量的早期验证：股权融资超过 $450 million、Series C 估值 $3 billion、已签合同超过 $500
    million、2026 年 3 月 GRAVITAS 发射，以及 SES meoSphere 的 28 颗卫星订单。真正的问题不是有没有需求，而是 K2
    能否在下一次重大融资前，把首次飞行验证和合同兴趣转化为可复制制造、已交付卫星和可持续经济性。
