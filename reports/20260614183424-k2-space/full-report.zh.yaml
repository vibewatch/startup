      - - SpaceX Starship / Blue Origin New Glenn（Giga 级）
        - SpaceX / Blue Origin
        - Giga 级 100 kW 卫星所必需（2028 年后）
        - 严重 — Giga 无法搭载现有火箭发射
        - Starship 商业服务延迟或载荷能力受限，会完全卡住 Giga 项目
        - 高
        - Mega 级提供收入过桥；K2 近期任务并非只依赖 Starship
        - Giga 级商业排期取决于 Starship 跑出运营可靠性 — 截至 2026 年中仍处开发阶段
      - - SES（meoSphere — 28 颗 Mega 卫星 + 探路任务链）
        - SES S.A.
        - 主要商业客户；唯一披露的大批量订单
        - 严重 — 隐含合同价值约 $420M（28 × $15M）
        - SES 财务承压、战略转向或探路任务失败，会缩减订单或完全取消
        - 严重
        - 2026–2027 年探路任务按阶段为星座订单逐步降风险
        - SES 已表示会根据市场调整数量；每个里程碑下的绑定承诺未知
      - - US Space Force / DoD 项目（STRATFI、PTS-G、OPIR SMI）
        - US Government
        - 主要政府收入来源；提供任务资金和需求信号
        - 高 — 已披露合同大多与 DoD 相邻
        - 国会拨款削减、项目取消或主承包商更换，会移除合同
        - 高
        - 多个项目（STRATFI、PTS-G、OPIR）在 DoD 条线之间提供一定分散
        - 单一拨款周期可能同时影响所有项目；未披露商业政府合同
      - - SES 作为 PTS-G 主承包商（K2 分包商）
        - SES S.A.
        - K2 为 SES 面向 Space Force 的 $437.7M PTS-G 卫星合同供应平台
        - 高 — PTS-G 是近期主要政府收入路径
        - SES 在 PTS-G 重新竞标中失利；平台供应商角色转给其他厂商
        - 中-高
        - PTS-G 不定量交付合同上限为 $4 billion；2028 年起计划追加订单
        - 未来 PTS-G 订单可能重新竞标；K2 不能保证在后续授标中入选
    notes: |
      各行按严重性排序。合同价值根据已披露单价估算（每颗 Mega 平台 $15M）。PTS-G 结构反映 SpaceNews 2026 年 6 月报道；单项授标条款属政府保密信息。
