      - number: '8.3'
        title: 牛市、基准与熊市情景分析
        blocks:
          - type: paragraph
            body: >-
              鉴于 K2 未披露收入、利润率和资本结构，情景分析必然高度依赖假设。以下三种情景锚定公开确认的数据点——$500 million 合同积压、SES 28 星订单、STRATFI 资助的 GRAVITAS
              任务，以及每星 $15 million 价格——再叠加交付节奏、增量合同获取和市场倍数演变的合理区间假设。


              牛市情景假设 GRAVITAS 执行完美，到 2026 年底完成 LEO 至 MEO 抬轨，在严酷 MEO 环境中验证 20 kW Hall-effect thruster
              和耐辐射航电，并为商业运营商验证多轨道平台。在这一情景下，SES meoSphere 28 星订单于 2029 年开始交付，星座到 2030 年达到初始作战能力。DoD 客户把承诺扩展到 STRATFI
              框架之外，再新增两个或更多星座项目。K2 在 2027 年以 $5–7 billion 投前估值融资 Series D，并于 2028–2029 年按 8–15x 远期收入倍数提交 IPO，基于 $600–700
              million 年收入隐含 $6–10 billion 市值。以 $3 billion 进入的 Series C 投资者在 4–5 年持有期内约有 2–3x 毛回报，具体取决于稀释。


              基准情景假设 GRAVITAS 完成主要任务目标，出现轻微异常但仍足以为商业销售验证平台；SES 订单按计划推进，但有适度延迟。K2 从政府或商业客户再赢得一到两个星座订单，到 2028 年把制造爬坡至每年约
              20–30 颗卫星，并以约 $4–5 billion 估值融资 Series D。IPO 或 M&A 事件在 2029–2030 年变得可行，企业价值约 $3–5 billion，取决于利润率兑现。以 $3
              billion 投资的 Series C 投资者大致持平至 1.5x；结果对 Series D 稀释和任何可转债工具高度敏感。


              熊市情景由 GRAVITAS 任务部分或完全失败、SES 在在轨验证前重新谈判或推迟 meoSphere 订单，或 DoD 预算环境明显恶化触发。在该情景下，K2 必须以低于 Series C 估值融资过桥——即
              $1.5–2.5 billion 的「down-round」——损害早期投资者，触发反稀释棘轮，并显著压低普通股价值。SES 订单尚未被正式确认为已签积压订单增量，构成近期风险。Payload Space 将
              $3 billion 估值描述为「尚未发射过卫星之前」发生，准确概括了当前价格内嵌的根本不确定性。
