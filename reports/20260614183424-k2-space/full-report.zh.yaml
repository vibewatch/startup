  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局和 K2 的市场位置
        blocks:
          - type: paragraph
            body: >-
              K2 Space 在 satellite bus 和航天器制造市场竞争，覆盖三个相互重叠的细分：商业 MEO 宽带星座、商业和政府 GEO 通信平台，以及 LEO、MEO、GEO 中的 proliferated
              国家安全星座。公司宣称的价值主张，是提供一个功率密度高、具备多轨道能力的 bus，价格和交付周期此前在小卫星层级之外几乎无法实现。

              传统 GEO incumbents——Boeing Satellite Systems、Airbus Defence and Space、Thales Alenia Space 和 Northrop
              Grumman——主导大型政府和商业 GEO 通信卫星采购周期。这些项目建造周期多年，单价通常高达数亿美元，并与主要运营商和政府机构建立了根深蒂固的客户关系。Boeing 获得 $2.8 billion
              ESS（Evolved Strategic Satellite）核指挥与控制合同，说明 incumbent 在政府 MILSATCOM 中的规模和安全性。Northrop Grumman 的 AEHF
              heritage 让它成为受保护军用卫星通信的典型 incumbent。

              在 new-space 细分，Rocket Lab（通过 Lightning、Pioneer 和 Flatellite 平台）与 Astranis（micro-GEO）是最可比的独立 bus 制造商。Rocket
              Lab 运营与 K2 类似的垂直整合模式，但瞄准低功率 LEO 任务（Lightning 约 3 kW），并通过 SDA Tranche 2 Transport Layer 项目拿到政府星座需求。Astranis
              聚焦 micro-GEO 利基市场，用紧凑、软件定义载荷服务高轨连接。两家公司都不直接竞争 K2 的 20–30 kW 多轨道画像。

              K2 必须替代的真正 “status quo” 不是某个具体竞争者，而是一种采购范式：运营商从 Boeing 或 Airbus 购买精致的单轨道 GEO 通信卫星，或政府项目依赖内部建造团队。K2
              的竞争论点建立在一个判断上：发射成本下降、对高功率轨道能力的需求上升，会让采购迁移到 proliferated、可负担的高功率 bus。SES meoSphere 订单和 PTS-G
              入选已部分验证这一命题，但尚未在生产规模上证明。
