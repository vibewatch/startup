        title: 任务履历与开发路线图
        blocks:
          - type: paragraph
            body: >
              K2 Space 已完成三个连续硬件验证里程碑，最终走到首颗完整卫星发射。2025 年 1 月，公司在 D-Orbit ION Satellite Carrier（SpaceX Transporter-12
              rideshare）上进行托管载荷演示，在 LEO 验证飞行计算机、反作用飞轮、电机控制器、嵌入式 avionics 和飞行软件。所有部件表现正常，显著降低了 GRAVITAS 风险。2025 年 7 月，K2
              在地面以满功率热试车 20 kW Hall-effect thruster。2026 年 3 月 30 日，GRAVITAS 搭乘 SpaceX Falcon 9 Transporter-16 发射；截至
              2026 年 6 月，它已在轨运行，搭载 12 个客户载荷模块，并执行 LEO 至 MEO 抬轨。该卫星参与 U.S. Space Force OPIR/SMI 项目，测试 Golden Dome
              导弹防御架构所需的光交叉链路。


              Trinity（K2-2、K2-3、K2-4）是 K2 下一项已签约任务：三颗卫星共乘一枚 SpaceX Falcon 9，已预订 2027 年 2 月发射，将部署至 LEO、MEO 和 GTO。Trinity
              将测试多轨道星座运行和远距离光学网状链路，同时服务政府和商业客户，包括 SES。另行，SES 已为其 meoSphere 下一代 MEO 星座首批订购 28 颗 K2 Mega Class
              卫星，pathfinder 任务计划横跨 2026–2027 年，完整运行部署目标为 2030 年。K2 计划在 GRAVITAS 之后两年内发射约 11 颗卫星，并从 2028
              年开始向客户供应商业星座。Giga Class 开发已经启动，但尚无排期，取决于 Starship 商业可用性。
