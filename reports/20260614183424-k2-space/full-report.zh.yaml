  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >-
              K2 Space 的核心收入模式，是向商业和政府客户销售垂直整合的 Mega Class 卫星平台。公司不运营卫星，也不销售带宽；K2
              设计、制造并交付卫星平台，客户把自己的载荷装上去。这种「平台即产品」模式带来清晰的收入节点：签约、生产里程碑和在轨交付。公开渠道没有披露收入数据；截至 canonical run date，K2
              仍处于量产收入前阶段。

              Mega Class 卫星平台公开标价为每台 $15M。这个数字出现在 K2 自己的 STRATFI 新闻稿（2024 年 12 月），也得到 Payload Space 报道、SpaceNews 对 SES
              合作的报道（“built for under $15 million each”）以及 Advanced Television 文章的印证；后者确认，每颗 meoSphere 卫星中 K2 平台部分成本约
              $15M（€12.9M）。CEO Karan Kunjur 承认，行业里很多人把这个价格称为「不可能」匹配其能力，并把 Gravitas 任务定义为定价模型的概念验证。

              K2 把目标价格压到 $15M，靠的是约 75% 卫星部件自制，包括反作用飞轮、飞行计算机、太阳翼以及 20 kW Hall-effect
              thruster。垂直整合压缩了第三方利润叠加，也把单星交付周期缩短到三个月以内。按客户价格估算，搭乘 SpaceX Falcon 9 每颗卫星约增加 $7.2M 发射成本（根据公开 Falcon 9
              rideshare 定价推算），载荷集成前的单星交付总成本约 $22M。相比之下，传统定制大型卫星历史上单价为 $100M 至 $1B+。K2 战略负责人 John Plumb 曾公开表示，K2 约用 $1
              billion 就能交付一整套星座，而不是一颗传统卫星资产。

              收入确认节奏未知。考虑到卫星制造属于定制硬件、交付周期长，K2 很可能按里程碑或交付确认收入。公司没有公开披露 backlog aging、交付计划或收入确认政策。
