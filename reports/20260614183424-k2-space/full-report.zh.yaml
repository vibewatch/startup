  - id: TM004
    title: 增长驱动因素与采用约束——评估矩阵
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 对 K2 的影响
      - 尽调问题
    rows:
      - - 重型运载发射经济性（Falcon 9 拼车）
        - 驱动因素
        - 当前——Falcon 9 已运行；每次发射 10 颗卫星
        - 支撑 K2 的降本论点；相比直接发往 MEO，单星发射成本更低
        - 验证 Falcon 9 拼车未来对重型（约 2T）卫星的运力和定价
      - - Giga Class 超重型运载（Starship / New Glenn）
        - 驱动因素（未来）
        - 2027–2030，取决于 Starship 商业认证
        - 打开 100 kW Giga Class 市场；若 Starship 认证滑坡，收入也会后延
        - 跟踪 Starship 商业发射清单和定价；评估 K2 延误情景下的后备方案
      - - MEO 轨道效率（覆盖比例相对 LEO 为 3:1）
        - 驱动因素
        - 结构性——由物理决定
        - 降低星座规模要求；压低运营商实现全球覆盖的 CapEx
        - 用独立轨道力学分析验证覆盖测算；检查 Ka-band 替代方案
      - - 防务开支增加（NATO、Golden Dome）
        - 驱动因素
        - 当前，2025–2030
        - 扩大政府 TAM；Gravitas 探路任务验证防务产品市场匹配
        - 量化 Golden Dome 招标时间线；确认与 Resilient GPS 项目的匹配度
      - - SES meoSphere 迭代式采购模型
        - 驱动因素
        - 当前——2026 年 3 月已下 28 颗卫星订单
        - 验证商业锚定需求；若其他运营商跟进，可降低 K2 收入集中度风险
        - 评估其他商业 MEO 运营商是否会采用类似敏捷采购模型
      - - MEO 辐射环境和履历缺口
        - 约束
        - 结构性——直到有 2–3 年 MEO 运营数据（预计 2028 年）
        - 在 Gravitas 给出多年性能数据前，二线商业运营商采用会放慢
        - 要求 K2 向潜在客户分享 Gravitas 遥测和抗辐射测试数据
      - - 防务采购惯性（ESPA 环要求）
        - 约束
        - 多年期——改革需要政策变化
        - 将军事 TAM 限在能借 STRATFI 或定制采购绕开 ESPA 约束的项目
        - 跟踪 Space Force 采购改革进展；评估 K2 级卫星平台获得 ESPA 豁免的概率
      - - 竞争性 LEO 架构（Starlink、Amazon Kuiper、Telesat Lightspeed）
        - 约束（部分）
        - 当前——Starlink 主导 LEO 经济性
        - LEO 规模上的垂直整合竞争者，削弱运营商新建 MEO 网络的动力
        - 评估运营商从传统 MEO（SES）转向 LEO VSAT 替代方案的流失；检查 SES meoSphere IRR
      - - Starship / Giga Class 时间线风险
        - 约束
        - 存在 2–5 年延误风险
        - Giga Class 收入后延；公司必须单靠 Mega Class 量产爬坡撑住
        - 假设 Giga Class 延至 2030 年以后，建模 K2 现金消耗和工厂利用率
      - - 资本强度和运营商优先事项竞争
        - 约束
        - 结构性——卫星 CapEx 是数亿美元级承诺
        - 考虑 MEO 的运营商，必须把 K2 排在 LEO、GEO 升级等竞争性投资之前
        - 评估运营商 CapEx 预算，以及和竞争项目相比的资本配置优先级
    notes: 驱动因素 / 约束分类和时间判断，反映管理层评论以及引文来源中的独立分析。影响是智能体基于报道证据形成的评估。尽调问题面向未来；尚未通过客户访谈独立验证。
