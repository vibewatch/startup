  - id: FV003
    title: 分情景估值与回报区间
    type: range
    layout: standard
    summary: 以 $3B Series C 入场为参照，展示下次流动性事件（估计 2028–2030 年）在 Bull、Base、Bear 三种情景下的低到高估值区间。
