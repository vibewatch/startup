  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和定义
        blocks:
          - type: paragraph
            body: >-
              K2 Space 的相关市场，具体是 satellite bus 与平台市场中需要高在轨功率（10–20 kW 区间）和覆盖 LEO、MEO、GEO
              多轨道能力的细分市场。这个边界有意窄于整体卫星制造业或更宽泛的航天经济。市场边界包括：向商业运营商（宽带、通信、地球观测）和政府 / 国防客户（Space Force、SDA、盟国政府）销售的高功率
              satellite bus 平台收入，这些任务受益于明显高于当前小卫星产品的功率成本比。市场不包括：约 2 kW 以下的小卫星 bus（York Space、Terran Orbital、D-Orbit
              类产品）、运载火箭收入、地面段设备、卫星服务收入，以及单价超过 $200M、K2 并不直接替代的传统 cost-plus GEO 通信卫星。

              K2 的市场定义建立在一个核心轨道经济学论点上：其 CEO 曾称，150 颗 LEO 卫星在覆盖上等同于 50 颗 MEO 卫星，意味着 3:1 的效率优势；当单星成本降到 $15M 水平时，MEO
              在经济上就更合理。现状替代方案既包括高端单星成本 $150–300M 的传统大型 GEO bus（Boeing BSS-702、Airbus Eurostar、Northrop
              GeoStar），也包括需要大量发射、由数百颗小卫星组成的 proliferated LEO 星座。两类替代方案都没有直接解决 K2 瞄准的高功率 MEO / 中轨频段。相邻市场是天基计算和托管载荷，K2 的
              Gravitas 任务搭载了 12 个国家安全和商业载荷，其中包括 ByteIota 所称的轨道数据中心实验；但该应用在商业上仍未验证，独立分析师之间争议很大。

              这个市场确实处于早期。当前只有 SES 的 O3b mPOWER 系统运营一个 MEO 宽带星座，约 8 颗卫星运行在约 8,000 km 高度。K2 认为 meoSphere 合作（首批 28
              颗卫星）验证了新一代 proliferated MEO 需求，而现有市场尚未服务这类需求。需要尽调的关键市场假设是：SES 之外是否会有多个商业运营商为 MEO 星座出资，还是 SES
              会在相当长时期内仍是唯一锚定客户。
