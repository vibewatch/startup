  - id: FV001
    title: 建议逻辑链
    type: flow
    layout: standard
    summary: 从核心证据支柱到估值评估、再到最终建议的决策树，展示每一层证据如何约束下一步判断。
    data:
      nodes:
        - id: market
          label: 卫星市场需求已验证（SES 28 颗订单；DoD STRATFI；$500M 合同）
        - id: tech
          label: 技术证据：GRAVITAS 已发射；20kW 推进器完成地面测试；2025 年太空演示
        - id: valuation
          label: $3B Series C 估值（积压合同 6x；基础爬坡情景下约 10x 2028E 收入）
        - id: risk
          label: 关键风险：收入前；资本结构未知；GRAVITAS 轨道提升待验证；竞争
        - id: entry
          label: 入场纪律：等待在轨验证，或以低于 $3B 的折价二级份额进入
        - id: recommendation
          label: 建议：持有 / 跟踪——根据 2026 年 Q3-Q4 GRAVITAS 结果重新评估
      edges:
