      - number: '4.2'
        title: 合同积压与政府授标
        blocks:
          - type: paragraph
            body: >-
              截至 2025 年 12 月 Series C 完成，K2 Space 已在商业和美国政府客户中累计获得超过 $500M 已签合同。公司没有披露积压订单的政府 / 商业拆分、单项合同金额或付款结构。$500M
              数字来自 Series C 新闻稿，并得到多家独立新闻来源印证。

              已披露的最大政府合同，是美国 Space Force 授予 Gravitas 任务的 $60M STRATFI（Strategic Funding Increase）奖项，结构为 Space Force 出资
              $30M，风险投资共同投资者通过 SBIR 配套 $30M。多个 Department of Air Force 机构支持了 Gravitas 任务，包括 Space Domain Awareness and
              Combat Power PEO、Space Development Agency、Space Warfighting Acquisition Delta、DoD 的 Space Test Program 和
              Air Force Research Lab。

              最大的单一商业锚定合同是 SES meoSphere 交易。2026 年 3 月，SES 在 Washington 的 Satellite 2026 展会上宣布，为下一代 meoSphere MEO
              宽带星座首批订购 28 颗 K2 Space Mega Class 卫星。按每颗 $15M 标价，仅 K2 平台部分就意味着约 $420M 的合同底线，不过实际合同条款、价格调整条款和可选项均未披露。首批
              meoSphere 卫星目标在 2029 年交付，2030 年形成完整运行能力。SES CEO Adel Al-Saleh 表示，MEO 星队最终将包含约 100 颗卫星，暗示后续订单空间。

              除 STRATFI 和 SES 外，五角大楼预算文件把 K2 列为 OPIR Space Modernization Initiative（SMI）的制造合作伙伴，该项目 FY2027 预算为 $180M。K2
              还在 Protected Tactical SATCOM Geostationary（PTS-G）项目中取得供应商角色；该项目是一个 $4B IDIQ 工具，K2 与 SES（主集成商）共同参与，并计划从
              2028 年起追加订单。K2 计划在 2027 年再发射十颗卫星，搭载政府和商业客户载荷，为星座级生产积累飞行履历。
