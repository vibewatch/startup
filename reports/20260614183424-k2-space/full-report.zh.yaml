      - number: '5.2'
        title: 核心技术栈
        blocks:
          - type: paragraph
            body: >
              K2 的技术差异化建立在五个自有子系统上：电推进、高功率太阳翼、耐辐射 avionics、热管理，以及自主机载软件栈——全部在 Torrance 工厂设计和制造。


              电推进是关键。20 kW Krypton-fed Hall-effect thruster 是有史以来飞上太空的最强 Hall-effect thruster，功率约为此前任何已飞 Hall-effect
              thruster 的 4 倍；2025 年 7 月，它在 K2 位于 Torrance 的定制推进测试舱以满功率成功热试车，该测试舱也是全球最大同类设施之一。K2 选择 Krypton 而非传统 Xenon，因为
              Krypton 密度更高、成本更低，在高功率区间仍有可接受的电离效率。在轨时，该 thruster 让 Mega 卫星仅用总推进剂的 35%，就能在 90 天内从 LEO 抬升至 MEO，为 10
              年设计寿命内的长期 MEO 定点保持留下充足余量。


              太阳翼系统展开两块 10 kW 面板（Mega 总计 20 kW；Giga 为 110 kW），采用高压架构，在高电流下尽量降低欧姆损耗。耐辐射 avionics 套件已于 2025 年 1 月在 D-Orbit
              ION Satellite Carrier 上完成在轨验证，包括飞行计算机、反作用飞轮、电机控制器和嵌入式飞行软件，均针对 MEO 强粒子辐射环境优化。K2 以 Rust
              编程语言编写的自主软件栈，负责机载辐射恢复、任务数据处理，以及多轨道运行所需的 guidance-navigation-control（GNC）。热管理覆盖 LEO、MEO 和 GEO
              轨道环境中的双位数千瓦热通量。
