      - number: '5.3'
        title: 制造与垂直整合
        blocks:
          - type: paragraph
            body: >
              K2 把垂直整合设计成一项主动竞争策略，在加州 Torrance 自有工厂设计和制造每颗卫星约 75–85% 的部分。自制子系统包括 20 kW Hall-effect
              thruster、高压太阳翼、飞行计算机、反作用飞轮、嵌入式 avionics、结构组件、释放 / 部署系统和热控硬件。在可靠商业供应商存在的环节——部分电子元件、材料和标准紧固件——K2
              选择商用现货输入。如此大范围内制，让 K2 能紧抓供应链风险、质量和 IP，并把从设计到飞行测试的持续创新闭环跑起来。


              180,000 sq ft Torrance 工厂按满产约每年 100 颗高功率卫星设计，体现 K2 长期为大型商业星座供货的野心。该设施还拥有全球最大定制推进测试舱之一，20 kW thruster 于
              2025 年 7 月在其中热试车。Mega Class MEO 卫星平台目标价约 $15 million——K2 称，这让其比传统承包商同等能力卫星更便宜，同时比同价 smallsats
              更强。按客户价格，Falcon 9 rideshare 发射成本约为每颗 $7.2 million；一旦 Starship 商业服务成熟，潜在成本可降至 $600,000。


              垂直整合也引入集中风险：Torrance 的质量故障、工装问题或设施中断，可能同时停掉整条生产线。公司没有公开披露第三方质量认证（例如 AS9100）或独立安全审计；这些未来可能成为某些政府采购项目的门槛。
