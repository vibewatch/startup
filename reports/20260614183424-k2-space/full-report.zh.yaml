      - number: '4.4'
        title: 单位经济、反向证据与财务尽调缺口
        blocks:
          - type: paragraph
            body: >-
              K2 Space 的毛利率、COGS、EBITDA 和现金转换周期完全未披露。唯一公开财务指标，是 Mega Class 卫星平台 $15M
              的标价。要做有意义的单位经济分析，必须拿到私有公司数据。作为参照，Rocket Lab 2025 10-K 显示，收入结构同样混合政府 / 商业的新兴商业卫星制造商，产品收入毛利率在 20%–35% 区间；但
              Rocket Lab 的发射与空间系统服务组合，与 K2 纯制造模式存在实质差异。

              卫星制造的资本密集度是结构性风险。Viasat CEO Mark Dankberg 在 SATShow Week 2026
              表示，卫星通信是「世界上最资本密集的行业之一」，需要聚合的资本要能与「无限获得资本」的实体竞争。K2
              的垂直整合策略旨在降低单位成本，但也提高了制造端资本需求：自有工装、测试舱和生产设备必须靠尚未规模化出现的产量摊销。

              另有两项明显的反向依赖。第一，Giga Class 卫星收入（面向 100 kW 与 Starship 级发射器设计）完全取决于 Starship 和 New Glenn
              能否向外部客户商业可用，时间线仍不确定。第二，K2 近期收入集中在 SES（已知最大商业订单）和美国政府项目；二者都带来客户集中和项目取消风险。28 颗 SES 订单的收入确认需要从约 2029 年开始交付，这让
              K2 最大商业合同产生现金前存在多年空档。

              独立分析师和行业观察者已经注意到，据 CEO Kunjur 本人所说，K2 Mega Class 卫星能力对应的 $15M 价位，被未具名行业参与者称为「不可能」。这让 Gravitas
              同时成为技术和财务上的概念验证。Gravitas 轨道提升和在轨运行结果，将实质影响 K2 按既定经济模型执行 SES 合同的能力。
