  evidenceGaps:
    - type: missing-source
      severity: material
      topic: compliance-gaps
      missingEvidence: "Third-party quality certifications (AS9100, CMMI) or independent quality audit reports for K2 Space's manufacturing and mission assurance processes"
      whyItMatters: "Without disclosed quality certifications, institutional government buyers and commercial satellite operators with fiduciary duty cannot confirm that K2's manufacturing processes meet minimum acceptable quality standards for mission-critical satellites"
      diligencePath: "Request quality management certification documentation directly from K2 Space; verify with registrar databases (IAQG OASIS, etc.); review STRATFI award technical requirements for any quality gate specifications"
      relatedQuestionRefs: [QE019]

    - type: missing-source
      severity: minor
      topic: vertical-integration-benchmarking
      missingEvidence: "Independent third-party cost and cycle-time benchmarks comparing K2's 75–85% vertically integrated model to traditional primes (Airbus Defence & Space, Maxar, Northrop Grumman NG1300 bus) on equivalent-power satellite buses"
      whyItMatters: "K2 claims its vertical integration yields a $15M Mega bus price — roughly 3–5× lower than comparable legacy buses — but no independent cost audit or competitive teardown has been published; the claim is company-stated only"
      diligencePath: "Request K2 build cost breakdown and supplier list under NDA; commission independent cost comparison with Maxar and Airbus bus specifications; review Space Foundation annual reports for per-unit satellite cost benchmarks"
      relatedQuestionRefs: [QE012]

    - type: private-evidence-only
      severity: material
      topic: gravitas-mission
      missingEvidence: "GRAVITAS on-orbit performance telemetry — actual Hall thruster in-orbit firing data, LEO-to-MEO orbit raise progress metrics, payload health data, and avionics performance in MEO radiation through June 2026"
      whyItMatters: "As of runDate, GRAVITAS launched March 30, 2026 but the orbit raise is reportedly still in progress. Actual on-orbit thruster performance, avionics stability in MEO radiation, and payload functionality data are not publicly released, making the central product claim unverifiable from public sources."
      diligencePath: "Request mission telemetry summaries, payload performance reports, and thruster characterization data from K2 Space under NDA; monitor public communications for orbit raise completion announcement"
      relatedQuestionRefs: [QE005, QE003]

    - type: missing-source
      severity: material
      topic: giga-class-risk
      missingEvidence: "Giga Class development schedule, preliminary design review (PDR) status, funding plan for Giga development, and binding commercial commitments contingent on Starship availability"
      whyItMatters: "Giga represents K2's largest potential revenue opportunity but rests on two external dependencies (Starship commercial service, orbital compute market) neither of which is under K2's control; without a development schedule, the option value cannot be calibrated"
      diligencePath: "Request Giga Class PDR/CDR status, internal design documentation, and any signed Giga customer letters-of-intent from K2 Space; monitor SpaceX Starship commercial service announcements"
      relatedQuestionRefs: [QE015]

    - type: missing-source
      severity: minor
      topic: developer-signal
      missingEvidence: "Developer community engagement data for K2's software platform — practitioner forum discussions, conference presentations by K2 software engineers, or equivalent proxy signals for a hardware company without a public API/SDK"
      whyItMatters: "K2's GitHub has no native code and no developer community; for a company whose competitive moat includes a novel Rust-language autonomy stack, the absence of external software validation signals limits independent assessment of software quality and novelty"
      diligencePath: "Search conference proceedings (AIAA, SmallSat, SPIE) for K2 software engineering presentations; search Reddit r/spaceflight and engineering forums for practitioner commentary; request software architecture review from K2 under NDA"
      relatedQuestionRefs: []

    - type: missing-source
      severity: material
      topic: orbital-compute-skepticism
      missingEvidence: "Independent techno-economic analysis of orbital compute viability under K2's stated parameters — vacuum cooling benefit, MEO solar exposure factor, and launch cost amortization at realistic Falcon 9 vs. Starship scenarios"
      whyItMatters: "The orbital compute use case is the primary commercial driver for the Giga Class; contradictory cost estimates (3× more expensive per critics vs. 15× cheaper per K2) reflect a genuine analytical gap that materially affects Giga revenue projections"
      diligencePath: "Commission independent techno-economic analysis; compare with Varda Space, Lumen Orbit, and SpaceFab cost-per-watt published analyses; model sensitivity to launch cost assumptions at $1,500, $500, and $200/kg"
      relatedQuestionRefs: [QE020]

