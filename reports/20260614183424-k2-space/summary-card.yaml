summary:
  headline: >-
    Track: K2 Space has stronger contract proof and more differentiated product ambition than most private satellite
    manufacturers, but the $3 billion entry price still requires on-orbit validation, manufacturing execution, and much
    better financial transparency.
  overallScore: 6.3
