  topStrengths:
    - >-
      K2 combines unusually strong early demand proof — $500M+ signed contracts and a 28-satellite SES order — with a
      clear high-power satellite wedge.
    - >-
      Mega Class offers a differentiated technical proposition around 20 kW power, multi-orbit operation, and a
      proprietary high-power Hall-effect thruster.
    - >-
      The founding and leadership bench is unusually relevant for execution, drawing heavily from SpaceX and senior U.S.
      space-policy talent.
    - >-
      A 180,000 sq ft Torrance factory and 75–85% vertical integration create a plausible path to industrial-scale
      production if first-flight proof holds.
  topRisks:
    - >-
      The company remains effectively pre-revenue with no public disclosure of margins, burn, or cash runway despite a
      $3 billion valuation.
    - SES is the only named commercial production customer, creating material concentration and backlog-conversion risk.
    - >-
      GRAVITAS is the first full-system validation of K2's propulsion, power, and radiation-hardening architecture; a
      mission underperformance would hit both demand and financing.
    - The longer-term Giga roadmap depends on uncertain heavy-lift launch availability and cost curves.
    - >-
      Cap table, liquidation preferences, and other downside-protection terms are undisclosed, limiting entry-discipline
      confidence for outside investors.
  unresolvedGaps:
    - Audited or management financials showing current revenue, gross margin, burn, and cash runway
    - Cap table, preference stack, option pool, and any investor rights negotiated at Series C
    - Backlog breakdown by customer, milestone, cancellation rights, and payment timing
    - Public confirmation that GRAVITAS completed its LEO-to-MEO orbit raise and met mission performance targets
    - >-
      Evidence that the SES order and other disclosed demand can translate into repeatable factory utilization before
      another large fundraise
