  - id: recommendation
    title: Investment Recommendation and Thesis Risk Assessment
    body: >-
      Recommendation: Hold / Track — do not enter at $3 billion without validated GRAVITAS
      mission results. The investment case for K2 Space is intellectually compelling: a
      technically differentiated satellite platform, a credible founding team of former SpaceX
      engineers, a signed $500 million contract backlog anchored by the SES 28-satellite
      meoSphere order, and a defensible product thesis built around the heavy-lift era's economics.
      However, the Series C price embeds significant execution optionality that has not yet been
      de-risked. GRAVITAS is still conducting its LEO-to-MEO orbit raise as of June 2026; the
      results are not yet confirmed in the public record. Investors entering now face:
      (a) pre-revenue execution risk on the largest technical demonstration in the company's
      history; (b) unknown preference overhangs from $450 million in prior equity; (c) no
      public financials by which to calibrate burn rate, margin, or capital intensity; and
      (d) a $3 billion entry price that requires everything to go right — sustained government
      demand, SES delivery, Mega production ramp — for a satisfying 2–3x gross return.


      Confidence: Medium. The contract evidence is strong, the team credentials are exceptional,
      and the SES partnership provides meaningful demand-side anchoring. However, the private
      opacity of K2's financials prevents the kind of diligence depth needed to convert
      confidence to high. Risk rating: High. The standard risk factors for a pre-revenue deeptech
      hardware manufacturer are amplified by the single-product dependency, the novel on-orbit
      environment, and the competitive threat from well-funded defense primes and other
      new-entrant manufacturers like York Space Systems and Intuitive Machines Lanteris.


      Valuation stance: Rich but defensible at the base case. Entry discipline should require
      either (a) on-orbit validation of the GRAVITAS mission (expected by late 2026), (b) written
      backlog confirmation from SES above $400 million, or (c) a secondary market entry at a
      discount to the Series C price. Thesis-break triggers include GRAVITAS mission failure,
      SES deferral, or two or more consecutive quarters of program slippage that indicate the
      factory is not meeting cadence targets.
