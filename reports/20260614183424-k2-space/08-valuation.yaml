  - id: valuation-methodology
    title: Valuation Methodology and Comparable Analysis
    body: >-
      K2 Space has no disclosed revenue, no publicly audited financials, and no stated timeline
      to profitability. Conventional revenue or EBITDA multiples cannot be directly applied.
      Instead, three methodological frameworks are useful: (1) contract backlog multiple, (2) implied
      forward revenue multiple at partial-ramp production, and (3) comparable company/transaction
      analysis against public satellite manufacturers and recent M&A.


      Contract backlog approach: At $3 billion valuation versus $500 million in signed contracts,
      the enterprise value-to-backlog ratio is approximately 6x. For a capital-intensive hardware
      company with a novel platform, this premium reflects market belief in (a) significant
      upside from contracts not yet signed, (b) recurring platform economics once a constellation
      is operational, and (c) the option value of the Giga-class roadmap. The SES 28-satellite
      order announced in March 2026 alone implies approximately $420 million in contract value
      at the $15 million per-satellite price point, potentially adding more than 80% of the prior
      backlog if converted to a formal signed figure.


      Forward revenue multiple approach: If K2 ramps to 30–50 satellite deliveries per year by 2028
      at a $15 million average selling price, implied 2028E revenue would be $450–750 million. At
      $3 billion valuation, this represents a 4–7x forward revenue multiple — not aggressive by
      growth-tech standards, but demanding for a first-generation hardware manufacturer facing
      significant delivery and performance uncertainty. Applying the 13–20x trailing revenue multiple
      that Rocket Lab (RKLB) commands on its $601.8 million FY2025 revenues would imply a $6–12
      billion equity value for K2 if it achieves comparable revenue by 2027–2028 — suggesting room
      for appreciation if execution holds.


      Comparable set: Public satellite manufacturers offer partial benchmarks. Rocket Lab (RKLB)
      reported FY2025 revenue of $601.8 million (per its February 2026 SEC 10-K) and trades at a
      substantial growth premium reflecting the combined launch and space systems franchise.
      Intuitive Machines (LUNR) reported FY2025 revenue of approximately $210 million with a
      contracted backlog of $213.1 million as of December 31, 2025 (per its March 2026 SEC 10-K),
      and positions itself in investor materials as a multi-segment space infrastructure company
      serving commercial, civil, and national security customers, making it a closer public
      comp for K2 than pure launch providers or GEO incumbents. LUNR commands a market capitalization that implies roughly 6–8x trailing revenue, compressed
      by contract losses and NASA budget risks. MDA Space (TSX/NYSE: MDA), a larger established
      Canadian satellite systems manufacturer now listed on both exchanges, offers a revenue-scaled
      anchor. Terran Orbital, a smallsat manufacturer acquired by Lockheed Martin in 2024 for
      approximately $450 million, provides a cautionary precedent for how quickly valuations
      can compress when execution falters or partners consolidate.


      The CounterFlow Solutions analysis of the Series C characterizes K2 as pursuing a
      "missions-to-markets" productization strategy — designing mission-specific spacecraft
      for repeatable platform economics — and notes that government demand remains the dominant
      anchor while commercial demand is emerging. This framing suggests that valuation support
      requires sustained government program wins and at least partial commercialization of the
      Mega platform before an IPO would attract broad investor interest.
