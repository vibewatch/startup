  - id: orbit-alternatives-substitutes
    title: Orbit Alternatives, Substitutes, and Status-Quo Options
    body: >-
      A buyer considering K2 Space faces several viable alternatives that address the same
      underlying mission requirements. The most consequential "substitute" is the incumbent
      procurement path: a single exquisite GEO satellite from Boeing, Airbus, or Thales Alenia
      at $200M–$500M with a 3–5 year build cycle. For operators with large budgets and low
      schedule urgency, this path remains attractive because it concentrates payload, heritage,
      insurance, and regulatory approval into a single program with decades of precedent. Boeing's
      ESS program at $2.8B (two satellites) illustrates that this model is alive and well for
      nuclear command and control.

      For defense constellation applications, the status-quo alternative is the Space Development
      Agency model using Rocket Lab Lightning buses (~3kW, LEO-only) or similar small-sat
      platforms. While lower in per-satellite power, these offer flight-proven heritage across
      many missions, clear government acquisition pathways, and a well-understood operating
      environment. This substitution path is most relevant for LEO ISR and communications where
      high power is less critical than latency or revisit rate.

      Internal build represents a small but non-negligible alternative for large defense primes.
      Boeing, Northrop Grumman, and Airbus all have satellite manufacturing capabilities that allow
      them to bid on government programs as integrators while building buses in-house. As
      governments adopt commercial acquisition pathways (IDIQ, OTA), primes have responded by
      offering commercial derivatives to preserve market share. Boeing's Millennium Space Systems
      subsidiary is its rapid-constellation response vehicle for exactly this market segment.

      The SES meoSphere program itself illustrates the substitution calculus: SES had previously
      procured satellites from Thales Alenia Space (O3b), but shifted to K2 for its next-generation
      MEO network, citing agility, cost, and speed advantages. This substitution event is the
      strongest empirical validation of K2's competitive thesis, though it represents one buyer
      and one generation of procurement. The SES O3b mPOWER constellation (delivered by Thales
      Alenia) demonstrated the demand for MEO, and K2 is positioned to serve the next generation
      of that demand.
