callouts:
  - calloutType: strength
    title: K2 Occupies a Power-Density White Space with No Immediate Direct Competitor
    body: >-
      As of mid-2026, no competitor offers a proliferated, multi-orbit satellite bus delivering
      20–30 kW of on-orbit power at a target price of ~$15M/unit with sub-3-month delivery.
      Boeing and Airbus build at this power class but at multi-year, multi-hundred-million-dollar
      price points. Rocket Lab and Astranis are price-competitive but capped at 3–5 kW. This
      white space, validated by the SES meoSphere order and PTS-G bus selection, gives K2 a
      durable near-term competitive position.
    claimRefs:
      - CP001
      - CP002
      - CP016
      - CP033
      - CP038

  - calloutType: risk
    title: Boeing and Northrop Grumman Remain Qualified PTS-G Competitors for Future Awards
    body: >-
      While K2 Space won the PTS-G bus role for SES's first production satellite, Boeing and
      Northrop Grumman remain among the five qualified vendors in the $4 billion IDIQ pool.
      Future production tranches beginning in 2028 may reopen competition, giving incumbents
      an opportunity to respond with purpose-built commercial bus offerings. The incumbents'
      multi-decade government trust, security clearances, and supply chain depth represent
      durable competitive assets that K2 has not yet matched.
    claimRefs:
      - CP006
      - CP007
      - CP008
      - CP040
      - CP044

  - calloutType: risk
    title: Single Full-Satellite Heritage as of June 2026 Is K2's Weakest Competitive Credential
    body: >-
      K2 Space's competitive position depends critically on proving GRAVITAS's long-duration
      performance in the MEO radiation environment — a regime its competitors have not validated
      in a proliferated bus at this power level either, but where Boeing, Northrop Grumman, and
      Thales Alenia have decades of adjacent GEO heritage. Any anomaly or performance shortfall
      in GRAVITAS would revive incumbent alternatives in SES meoSphere procurement and government
      programs. The 28-satellite meoSphere order and PTS-G selection both increase rather than
      reduce the stakes of this flight heritage gap.
    claimRefs:
      - CP003
      - CP004
      - CP041
      - CP042
      - CP043

