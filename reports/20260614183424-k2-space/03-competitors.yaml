  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing
      missingEvidence: >-
        Confirmed contracted unit pricing from SES or other customers for Mega Class satellite
        buses, including volume discounts and margin structure.
      whyItMatters: >-
        K2's $15M target price is company-stated; without customer-confirmed pricing, it is
        impossible to verify realized pricing or understand margin compression risk at scale.
      diligencePath: >-
        Request SES meoSphere contract pricing details in investor diligence; compare to third-
        party cost estimates from industry analysts covering commercial satellite procurement.
      relatedQuestionRefs:
        - QP013

    - type: missing-source
      severity: material
      topic: airbus
      missingEvidence: >-
        Published price list or disclosed contract pricing for Airbus Eurostar Neo or Thales
        Alenia Spacebus platforms for commercial GEO operator procurement.
      whyItMatters: >-
        Without incumbent pricing benchmarks, it is difficult to quantify K2's price advantage
        over Airbus and Thales Alenia in the commercial GEO market, limiting competitive analysis.
      diligencePath: >-
        Seek commercial satellite operator disclosures, analyst reports from NSR or Euroconsult,
        or procurement filings from publicly listed operators (Eutelsat, SES) that disclose
        satellite acquisition costs.
      relatedQuestionRefs:
        - QP022

    - type: missing-source
      severity: material
      topic: incumbent-competition
      missingEvidence: >-
        Any public announcement by Boeing, Northrop Grumman, Airbus, or Thales Alenia indicating
        plans for a proliferated, high-power multi-orbit commercial bus competing with K2's
        Mega Class by 2026 or 2027.
      whyItMatters: >-
        If incumbents begin publicly developing competing high-power proliferated bus programs,
        K2's white-space position narrows rapidly; absence of such announcements is a positive
        signal but not dispositive.
      diligencePath: >-
        Monitor SATELLITE conference announcements, defense acquisition pipeline disclosures,
        and earnings calls from Boeing and Northrop Grumman for satellite manufacturing strategy
        updates in 2026 and beyond.
      relatedQuestionRefs:
        - QP018

    - type: private-evidence-only
      severity: minor
      topic: manufacturing
      missingEvidence: >-
        Independent verification of K2 Space's sub-3-month satellite delivery lead time through
        customer testimony or third-party audits of the manufacturing process.
      whyItMatters: >-
        The lead time claim is a key competitive differentiator; if it is not achievable at
        production scale (post-prototype), K2's positioning versus incumbents weakens.
      diligencePath: >-
        Request customer references from K2 and review any operational delivery data as
        meoSphere manufacturing ramps toward 2029 initial fleet delivery.
      relatedQuestionRefs:
        - QP013

    - type: missing-source
      severity: minor
      topic: airbus
      missingEvidence: >-
        Confirmed capability specifications (power output, orbit range, delivery timeline) for
        Airbus Eurostar Neo and Thales Alenia Spacebus in a multi-orbit MEO-capable variant.
      whyItMatters: >-
        Airbus and Thales have the engineering capability to develop MEO-capable buses; absence
        of public products does not exclude future development that could compete with meoSphere.
      diligencePath: >-
        Review ESA MEO program solicitations and European satellite operator procurement
        disclosures; contact Airbus and Thales investor relations for roadmap inquiries.
      relatedQuestionRefs:
        - QP012

    - type: missing-source
      severity: material
      topic: incumbent-response
      missingEvidence: >-
        Public strategic announcements from Boeing, Northrop Grumman, Airbus, or Thales Alenia
        specifically targeting the proliferated high-power MEO/GEO commercial bus market to
        compete with K2's Mega Class at a comparable price point or production model.
      whyItMatters: >-
        Absence of incumbent response is currently K2's clearest competitive moat; if any
        major prime announces a competing high-power proliferated bus program, K2's addressable
        market and pricing power would be significantly affected.
      diligencePath: >-
        Monitor annual reports, earnings calls, and SATELLITE/AIAA conference announcements
        from Boeing Space, Northrop Grumman, and European primes for any 2026-2027 strategic
        pivots toward commercial proliferated satellite bus manufacturing.
      relatedQuestionRefs:
        - QP015
