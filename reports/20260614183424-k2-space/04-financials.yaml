  - id: unit-economics-and-financial-gaps
    title: Unit Economics, Adverse Evidence, and Financial Diligence Gaps
    body: >-
      K2 Space's gross margins, COGS, EBITDA, and cash conversion cycle are entirely undisclosed.
      The only public financial metric is the $15M list price for the Mega Class satellite bus.
      Meaningful unit-economics analysis requires private-company data access. For context, Rocket
      Lab's 2025 10-K filing shows that emerging commercial satellite manufacturers with similar
      government/commercial revenue mix generate gross margins in the 20%–35% range on product
      revenue, though Rocket Lab's mix of launch and space systems services differs materially
      from K2's pure-play manufacturing model.

      The capital intensity of satellite manufacturing is a structural risk. Viasat CEO Mark
      Dankberg stated at SATShow Week 2026 that satellite communications is "one of the most
      capital intensive industries in the world," requiring capital aggregation competitive with
      entities that have "unlimited access to capital." K2's vertical integration strategy is
      intended to reduce unit cost, but it also increases the manufacturing capital requirement:
      in-house tooling, test chambers, and production equipment must be amortized over production
      volume that has not yet materialized at scale.

      Two additional adverse dependencies are evident. First, Giga Class satellite revenue (designed
      for 100 kW and Starship-class launch vehicles) is entirely contingent on Starship and New
      Glenn becoming commercially available for external customers—a timeline that remains uncertain.
      Second, K2's near-term revenue is concentrated in SES (which represents the largest known
      commercial order) and US government programs; both introduce customer concentration and
      program cancellation risk. Revenue recognition on the 28-satellite SES order requires
      deliveries beginning around 2029, creating a multi-year gap before K2's largest commercial
      contract generates cash.

      Independent analysts and industry observers have noted that K2's $15M price point for Mega
      Class satellite capability has been characterized as "impossible" by unnamed industry
      participants, according to CEO Kunjur himself. This positions Gravitas as both a technical
      and financial proof-of-concept. The outcome of the Gravitas orbit raise and on-orbit
      operations will materially affect K2's ability to execute the SES contract at the stated
      economics.
