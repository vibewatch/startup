callouts:
  - calloutType: strength
    title: "$500M+ Backlog and Anchor SES Order Provide Multi-Year Revenue Visibility"
    body: >-
      K2 has secured over $500M in signed contracts before delivering a single production
      satellite, anchored by a 28-satellite order from SES for the meoSphere MEO constellation.
      At a $15M per satellite list price — confirmed by the STRATFI press release, SpaceNews, and
      Advanced Television — the platform portion of the SES order alone implies a ~$420M contract
      floor. Combined with the $60M STRATFI award, OPIR SMI participation, and PTS-G IDIQ
      supplier role, K2 has established a multi-program government and commercial revenue base
      before entering production-scale operations.
    claimRefs:
      - CI004
      - CI005
      - CI006
      - CI009
      - CI014
      - CI015

  - calloutType: risk
    title: "Capital Intensity, Undisclosed Margins, and Long Cash-Conversion Cycle"
    body: >-
      The $15M price target per satellite is publicly acknowledged by the CEO as an "impossible"
      benchmark by industry competitors, making unit economics validation critical and currently
      unavailable. Gross margins, COGS, burn rate, and cash runway are entirely undisclosed. The
      SES meoSphere order delivers revenue in 2029 at the earliest, creating a 3-year cash
      conversion gap. Satellite manufacturing is capital-intensive by nature; Viasat's CEO
      publicly described the industry as "one of the most capital intensive in the world."
      Factory scale-up capex, launch dependency on SpaceX, and pre-revenue stage collectively
      make capital adequacy a blocking diligence item.
    claimRefs:
      - CI022
      - CI024
      - CI025
      - CI042
      - CI043

  - calloutType: risk
    title: "Giga Class Revenue Depends on Starship Commercial Availability"
    body: >-
      K2's next-generation Giga Class satellite (100 kW) is designed exclusively for Starship
      and New Glenn. As of mid-2026, neither vehicle has begun regular commercial customer
      service at the payload volume K2's Giga Class requires. If Starship commercial operations
      are delayed beyond 2028–2029, K2's Giga Class revenue scenario does not materialize,
      increasing dependence on the Mega Class backlog for capital efficiency.
    claimRefs:
      - CI021

  - calloutType: insight
    title: "Golden Dome / OPIR Demand Creates Structural Government Revenue Tailwind"
    body: >-
      K2's selection for OPIR Space Modernization Initiative demonstrations and its PTS-G
      supplier role position it to benefit from the US government's stated push toward
      proliferated MEO satellite architectures for missile defense. Pentagon budget documents
      explicitly name K2 spacecraft for FY2027 OPIR SMI demonstrations. John Plumb (K2's Head
      of Strategy, former Pentagon space policy chief) confirmed K2 is "absolutely key to
      Golden Dome, or any other missile defense architecture that relies on space sensors."
      This policy-driven demand provides a structural government revenue tailwind that reduces
      commercial contract concentration risk.
    claimRefs:
      - CI015
      - CI023
      - CI039

