  - id: contract-backlog-and-government-awards
    title: Contract Backlog and Government Awards
    body: >-
      As of the Series C closing in December 2025, K2 Space had accumulated over $500M in signed
      contracts across commercial and US government customers. The company has not disclosed the
      government/commercial split, individual contract values, or payment structures for the
      backlog. The $500M figure is stated in the Series C press release and corroborated by
      multiple independent news sources.

      The largest disclosed government contract is a $60M STRATFI (Strategic Funding Increase)
      award from the US Space Force for the Gravitas mission, structured as $30M from Space Force
      plus $30M in SBIR matching funds from venture co-investors. Multiple Department of Air Force
      organizations supported the Gravitas mission including the Space Domain Awareness and Combat
      Power PEO, Space Development Agency, Space Warfighting Acquisition Delta, the DoD's Space
      Test Program, and the Air Force Research Lab.

      The single largest commercial contract anchor is the SES meoSphere deal. In March 2026, at
      the Satellite 2026 show in Washington, SES announced an initial order of 28 K2 Space Mega
      Class satellites for its next-generation meoSphere MEO broadband constellation. At the
      $15M per satellite list price, the K2 platform portion of this order alone implies a contract
      floor of approximately $420M, though actual contract terms, escalators, and optionality
      are undisclosed. The first meoSphere satellites are targeted for delivery in 2029, with
      full operational capability by 2030. SES CEO Adel Al-Saleh stated the MEO fleet would
      eventually contain around 100 satellites, suggesting potential follow-on orders.

      Beyond STRATFI and SES, K2 is named in Pentagon budget documents as the manufacturing
      partner for the OPIR Space Modernization Initiative (SMI), which has a $180M FY2027 budget.
      K2 also won a supplier role in the Protected Tactical SATCOM Geostationary (PTS-G) program,
      a $4B IDIQ vehicle alongside SES (the prime integrator), with additional orders planned
      from 2028. K2 plans to launch ten more satellites in 2027 carrying government and commercial
      customer payloads, building flight heritage for constellation-scale production.
