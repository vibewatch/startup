callouts:
  - calloutType: strength
    title: Vertical integration creates a defensible manufacturing cost and lead-time moat
    body: >-
      By building approximately 80% of satellite components in-house—including the world's most
      powerful commercial Hall-effect thruster, reaction wheels, flight computers, and solar
      arrays—K2 Space achieves ~$15M per satellite pricing and under-three-month delivery windows
      that are structurally unavailable through the traditional vendor supply chain. This is the
      primary basis for the company's pricing differentiation and the SES meoSphere order.
    claimRefs:
      - CO011
      - CO013
      - CO015
      - CO016
      - CO021

  - calloutType: strength
    title: SES meoSphere and PTS-G anchor multi-orbit strategy and 2026–2030 production cadence
    body: >-
      An order for 28 Mega Class satellites for the SES meoSphere constellation, combined with
      K2 Space's selection as bus supplier for the PTS-G GEO defense program, gives the company
      production visibility across LEO, MEO, and GEO within four years of founding. The combination
      of a named commercial operator and a DoD program validates the multi-orbit strategy and
      provides a production anchor that de-risks the near-term factory ramp-up.
    claimRefs:
      - CO018
      - CO019
      - CO031

  - calloutType: risk
    title: 80% in-house component manufacturing amplifies failure propagation risk at production scale
    body: >-
      TechCrunch noted in March 2026 that building 85% of satellite components in-house means
      any supply chain disruption or design fault propagates broadly across the satellite bus.
      This concentration lowers costs but concentrates quality risk on K2's own manufacturing
      capability, which has not yet been stress-tested at the production cadence implied by the
      28-satellite SES order. GRAVITAS results will be the first meaningful data point on
      on-orbit performance of a fully K2-built platform.
    claimRefs:
      - CO015
      - CO033
      - CO038

  - calloutType: risk
    title: Giga Class roadmap depends on Starship cost reductions not yet available
    body: >-
      K2's founding thesis included the assumption that Starship would reduce launch costs from
      ~$7.2M per manifest slot on Falcon 9 to ~$600K. The Giga Class 100 kW platform is designed
      for this future launch economics context. Until Starship offers reliable, affordable
      commercial rideshare, the Giga Class product line remains contingent on a development
      outcome outside K2's control. The Mega Class remains commercially viable on existing
      launch vehicles, but the long-term roadmap depends on SpaceX execution.
    claimRefs:
      - CO025
      - CO033

