  - id: customers-and-contracts
    title: Customers, Contracts, and Strategic Partnerships
    body: >
      K2 Space reported over $500 million in signed contracts as of its December 2025 Series C
      announcement, spanning US government and commercial customers. The largest publicly named
      government customer is the US Space Force, which awarded the $60 million STRATFI contract in
      December 2024 for the GRAVITAS mission. GRAVITAS launched in March 2026 on a SpaceX Falcon 9
      Transporter-16 rideshare carrying DoD payloads, qualifying the Mega Class platform for future
      government and commercial orders. Air Force Secretary Troy Meink visited the K2 Space Torrance
      facility in May 2026, confirming continued senior DoD engagement post-launch.

      The largest commercial customer and partner is SES. In September 2025, SES and K2 Space
      announced a partnership to co-develop SES's future MEO network. At the Satellite 2026
      conference on March 24, 2026, SES formalized this by ordering 28 Mega Class satellites for its
      meoSphere constellation targeting full operational capability in 2030. The meoSphere satellites
      are designed to orbit at approximately 8,000 km altitude, each producing 20 kW, with optical
      inter-satellite links and 100 Gbps crosslinks for 5G-NTN compliance. At K2's stated $15 million
      per satellite price point, a 28-satellite order represents a notional $420 million of
      manufacturing backlog from a single operator.

      Separately, in 2026 K2 Space was selected as the satellite bus supplier for SES's entry in the
      US Space Force Protected Tactical Satcom-Global (PTS-G) program—a $4 billion IDIQ with SES and
      Viasat sharing $437.7 million in initial awards, with spacecraft planned to enter service in
      2029. This role spans LEO through MEO through GEO, validating K2 Space's multi-orbit strategy
      and substantially de-risking its government revenue outlook beyond GRAVITAS alone.
