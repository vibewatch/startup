  - id: capital-and-investors
    title: Funding History and Investor Base
    body: >
      K2 Space has raised more than $450 million in equity since its 2022 founding. The funding
      history follows a rapid cadence uncommon even among well-funded space startups: an initial
      seed round of approximately $22 million from First Round Capital; a Series A of approximately
      $50 million co-led by Altimeter Capital in late 2023; a $60 million STRATFI award from the
      US Space Force in December 2024 (structured as $30 million in government funding matched by
      $30 million in private capital); a $110 million Series B co-led by Lightspeed Venture Partners
      and Altimeter Capital in February 2025; and a $250 million Series C at a $3 billion post-money
      valuation led by Redpoint in December 2025.

      The Series C brought in T. Rowe Price, Hedosophia, and Alpine Space Ventures alongside
      returning investors. At $3 billion, K2 reached unicorn-plus status in under four years of
      operation. The company had also secured over $500 million in signed commercial and government
      contracts by the time of the Series C announcement, making the capital picture unusually strong
      for a company that had not yet launched its first full mission at that point.

      The investor syndicate spans blue-chip venture (Redpoint, Lightspeed, Altimeter, First Round),
      growth equity (T. Rowe Price), cross-over growth funds (Hedosophia), and space-specialized
      capital (Alpine Space Ventures), suggesting broad conviction in both the near-term contract
      trajectory and the long-term market for high-power satellites. Key-person dependency on Karan
      Kunjur as the primary relationship owner with investors is a reasonable assumption given the
      concentration of capital formation around the co-founder pair at early stages.
