  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue-backlog
      missingEvidence: >-
        K2 Space does not disclose revenue, ARR, or detailed backlog composition. The $500M+ in
        signed contracts is company-stated but the breakdown across commercial versus government,
        payment milestone timing, and whether any contracts include cancellation clauses is
        not in the public record.
      whyItMatters: >-
        Revenue and backlog quality are the primary inputs to valuation assessment; without
        revenue data the $3B post-money valuation cannot be evaluated against a revenue multiple
        or cash-flow model.
      diligencePath: >-
        Request contract list with customer names, payment milestones, and termination-right
        clauses from data room; obtain audited financial statements for the most recent
        completed fiscal year including P&L and balance sheet.
      relatedQuestionRefs:
        - QO009

    - type: missing-source
      severity: material
      topic: board-governance
      missingEvidence: >-
        K2 Space has not publicly disclosed its board composition, number of independent
        directors, investor board or observer seat allocations, or key governance documents
        such as the certificate of incorporation or stockholder rights agreement.
      whyItMatters: >-
        Board composition and investor consent rights determine how capital deployment, strategic
        partnerships, acquisition offers, and IPO decisions are governed; absence of disclosure
        is a governance opacity flag for late-stage diligence.
      diligencePath: >-
        Request cap table, board composition list, and investor rights agreement from data room;
        check Delaware Secretary of State for Certificate of Incorporation amendments.
      relatedQuestionRefs:
        - QO013
      relatedTableRefs:
        - TO002
        - TO003

    - type: missing-source
      severity: material
      topic: on-orbit-performance
      missingEvidence: >-
        No independent public documentation of K2 Space on-orbit performance data, anomaly reports,
        or third-party technical audit of GRAVITAS mission results is available as of June 2026.
        The in-space demonstration and GRAVITAS mission lack public acceptance test reports or
        government mission assurance reviews in the open record.
      whyItMatters: >-
        First-mission anomalies or undisclosed performance gaps could materially affect confidence
        in the SES 28-satellite order and the PTS-G bus selection; vertical integration at production
        scale may not yet be fully validated by on-orbit results.
      diligencePath: >-
        Request DoD and SpaceWERX mission acceptance documentation; obtain GRAVITAS mission
        operations reports and any in-orbit performance data from K2 Space or the USSF customer;
        check for any public SpaceWERX after-action documentation.
      relatedQuestionRefs:
        - QO025
      relatedTableRefs:
        - TO004

    - type: missing-source
      severity: minor
      topic: giga-class-economics
      missingEvidence: >-
        K2 Space has not published any financial model or technical roadmap document detailing
        the launch cost assumptions, development timeline, or fallback plan for the Giga Class
        satellite if Starship commercial rideshare service does not reach projected pricing by
        2028–2030.
      whyItMatters: >-
        If Starship does not deliver anticipated launch cost reductions, the Giga Class product
        line may be uneconomical; the long-term roadmap beyond the Mega Class depends partly on
        a launch market development outcome outside K2's control.
      diligencePath: >-
        Request K2 Space internal product roadmap and launch cost sensitivity analysis from
        data room; monitor SpaceX Starship commercial launch pricing as it is disclosed.
      relatedQuestionRefs:
        - QO027

    - type: missing-source
      severity: minor
      topic: vertical-integration-process
      missingEvidence: >-
        K2 Space has not published detailed manufacturing process documentation, supplier
        relationships, or production throughput data that would explain specifically how
        vertical integration of 80%+ components translates into sub-three-month lead times
        at scale rather than merely in the prototype phase.
      whyItMatters: >-
        Lead time and cost claims are the primary basis for K2's pricing differentiation;
        without understanding the specific production flow, it is difficult to assess whether
        the advertised lead times are achievable at the 28-satellite SES order cadence.
      diligencePath: >-
        Request manufacturing process flow documentation, actual historic lead time data per
        satellite build, and supplier concentration analysis from data room; conduct factory
        tour and interview production operations leaders.
      relatedQuestionRefs:
        - QO022

    - type: missing-source
      severity: minor
      topic: funding-trajectory-benchmarks
      missingEvidence: >-
        No publicly available comparative analysis of K2 Space's funding trajectory and
        speed-to-orbit timing versus comparable satellite bus startups (e.g., Apex, Orbit Fab,
        Sidus Space, or earlier Terran Orbital) has been found. K2's $450M raise in four years
        is exceptional but lacks independent benchmark context in available sources.
      whyItMatters: >-
        Comparative trajectory data would help assess whether K2's capital efficiency and
        time-to-first-mission are industry-leading or whether risk factors have been priced
        into the funding pace; without benchmarks, the $3B valuation context is harder to judge.
      diligencePath: >-
        Obtain Crunchbase or Pitchbook peer comparison for LEO/MEO satellite bus manufacturers
        at equivalent stage; review public funding histories for Apex Space, York Space, and
        Terran Orbital as reference comps.
      relatedQuestionRefs:
        - QO023
