evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-backlog
    missingEvidence: >-
      K2 Space does not disclose revenue, ARR, or detailed backlog composition. The $500M+ in signed contracts is
      company-stated but the breakdown across commercial versus government, payment milestone timing, and whether any
      contracts include cancellation clauses is not in the public record.
    whyItMatters: >-
      Revenue and backlog quality are the primary inputs to valuation assessment; without revenue data the $3B
      post-money valuation cannot be evaluated against a revenue multiple or cash-flow model.
    diligencePath: >-
      Request contract list with customer names, payment milestones, and termination-right clauses from data room;
      obtain audited financial statements for the most recent completed fiscal year including P&L and balance sheet.
    relatedQuestionRefs:
      - QO009
  - type: missing-source
    severity: material
    topic: board-governance
    missingEvidence: >-
      K2 Space has not publicly disclosed its board composition, number of independent directors, investor board or
      observer seat allocations, or key governance documents such as the certificate of incorporation or stockholder
      rights agreement.
    whyItMatters: >-
      Board composition and investor consent rights determine how capital deployment, strategic partnerships,
      acquisition offers, and IPO decisions are governed; absence of disclosure is a governance opacity flag for
      late-stage diligence.
    diligencePath: >-
      Request cap table, board composition list, and investor rights agreement from data room; check Delaware Secretary
      of State for Certificate of Incorporation amendments.
    relatedQuestionRefs:
      - QO013
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: on-orbit-performance
    missingEvidence: >-
      No independent public documentation of K2 Space on-orbit performance data, anomaly reports, or third-party
      technical audit of GRAVITAS mission results is available as of June 2026. The in-space demonstration and GRAVITAS
      mission lack public acceptance test reports or government mission assurance reviews in the open record.
    whyItMatters: >-
      First-mission anomalies or undisclosed performance gaps could materially affect confidence in the SES 28-satellite
      order and the PTS-G bus selection; vertical integration at production scale may not yet be fully validated by
      on-orbit results.
    diligencePath: >-
      Request DoD and SpaceWERX mission acceptance documentation; obtain GRAVITAS mission operations reports and any
      in-orbit performance data from K2 Space or the USSF customer; check for any public SpaceWERX after-action
      documentation.
    relatedQuestionRefs:
