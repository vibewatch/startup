    severity: minor
    topic: giga-class-economics
    missingEvidence: >-
      K2 Space has not published any financial model or technical roadmap document detailing the launch cost
      assumptions, development timeline, or fallback plan for the Giga Class satellite if Starship commercial rideshare
      service does not reach projected pricing by 2028–2030.
    whyItMatters: >-
      If Starship does not deliver anticipated launch cost reductions, the Giga Class product line may be uneconomical;
      the long-term roadmap beyond the Mega Class depends partly on a launch market development outcome outside K2's
      control.
    diligencePath: >-
      Request K2 Space internal product roadmap and launch cost sensitivity analysis from data room; monitor SpaceX
      Starship commercial launch pricing as it is disclosed.
    relatedQuestionRefs:
      - QO027
  - type: missing-source
    severity: minor
    topic: vertical-integration-process
    missingEvidence: >-
      K2 Space has not published detailed manufacturing process documentation, supplier relationships, or production
      throughput data that would explain specifically how vertical integration of 80%+ components translates into
      sub-three-month lead times at scale rather than merely in the prototype phase.
    whyItMatters: >-
      Lead time and cost claims are the primary basis for K2's pricing differentiation; without understanding the
      specific production flow, it is difficult to assess whether the advertised lead times are achievable at the
      28-satellite SES order cadence.
    diligencePath: >-
      Request manufacturing process flow documentation, actual historic lead time data per satellite build, and supplier
