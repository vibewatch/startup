  - type: missing-source
    severity: minor
    topic: funding-trajectory-benchmarks
    missingEvidence: >-
      No publicly available comparative analysis of K2 Space's funding trajectory and speed-to-orbit timing versus
      comparable satellite bus startups (e.g., Apex, Orbit Fab, Sidus Space, or earlier Terran Orbital) has been found.
      K2's $450M raise in four years is exceptional but lacks independent benchmark context in available sources.
    whyItMatters: >-
      Comparative trajectory data would help assess whether K2's capital efficiency and time-to-first-mission are
      industry-leading or whether risk factors have been priced into the funding pace; without benchmarks, the $3B
      valuation context is harder to judge.
    diligencePath: >-
