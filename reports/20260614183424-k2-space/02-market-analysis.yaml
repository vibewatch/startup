  - id: adoption-constraints
    title: Adoption Constraints and Market Risk Factors
    body: >-
      The most significant adoption constraint is defense acquisition inertia. Dr. John Plumb specifically cited
      ESPA ring requirements as a legacy constraint forcing military programs into smaller payloads incompatible
      with K2's larger platform. ESPA rings standardize the interface between secondary payloads and launch
      vehicles, and reforming those requirements requires institutional change within Space Force acquisition
      programs that can take years. Plumb stated the military must "get out of legacy requirements if we're going
      to achieve new effects at lower cost," acknowledging that acquisition reform is not guaranteed. Without it,
      K2's maximum government TAM remains constrained to programs that voluntarily opt into non-ESPA procurement
      (STRATFI, SBIR, or future purpose-built programs).

      The second constraint is MEO radiation risk. The medium Earth orbit band is subject to intense radiation
      from the Van Allen belts. Traditional small satellite buses and commercial LEO platforms were not designed
      to survive in MEO for extended periods. K2's differentiation rests on its radiation-tolerant avionics and
      redundant systems, but as of June 2026 only the Gravitas mission has operated in MEO, with limited public
      performance data available. Commercial operators and government buyers purchasing MEO constellation programs
      worth hundreds of millions of dollars will demand demonstrated reliability over multiple years, not just
      early mission data. The lack of long-duration MEO heritage remains a material adoption barrier for large
      constellation programs.

      A third constraint is Starship and New Glenn timeline risk for the Giga Class roadmap. K2's Giga Class
      (100 kW) depends on super-heavy lift becoming commercially available. Starship has not yet been certified
      for commercial satellite payloads as of mid-2026, and New Glenn has only recently begun commercial
      operations. Delays in either program would defer the Giga Class market by several years. Additionally,
      the ByteIota analysis surfaced credible criticism: Varda Space Industries has independently calculated
      orbital compute costs at approximately 3× terrestrial per watt, and current launch costs of $1,500–3,000/kg
      must fall to $200–500/kg for mass orbital compute to be viable. This represents a bearish constraint on
      the orbital compute market narrative that some investors may associate with K2's platform. K2's primary
      commercial value drivers (satellite buses for MEO networks, not orbital compute per se) are less exposed
      to this critique, but the conflation of these use cases in media coverage creates investor perception risk.
