  - id: growth-drivers
    title: Growth Drivers and Market Momentum
    body: >-
      The primary demand driver is heavy-lift launch economics. K2's CEO has stated that Falcon 9 and eventually
      Starship will "completely change the trade around mass versus cost," enabling operators to stop optimizing
      spacecraft for mass and instead optimize for capability. K2 can deploy 10 Mega Class satellites per Falcon
      9 rideshare by launching to LEO and then using onboard electric propulsion to raise orbit to MEO in under
      90 days. This is four times the satellite density achievable on direct MEO launches and dramatically lowers
      the per-satellite launch cost. The Giga Class platform (100 kW, designed for Starship and New Glenn) extends
      this logic further: if Starship achieves commercial availability, it unlocks an entirely new performance
      tier that today's satellite market cannot serve.

      The second driver is MEO orbit economics. K2's core market pitch to operators is the coverage efficiency
      argument: fewer satellites are needed to achieve global coverage from MEO relative to LEO. A constellation
      of 50 MEO satellites could replace 150 LEO satellites in coverage terms, per K2's management estimate.
      Combined with a $15M bus price, this makes MEO constellations financially competitive with large LEO
      deployments for the first time. Via Satellite reported that SES's CEO described "capital investment wars"
      as the defining pressure on operators, with the need to aggregate capital to compete against vertically
      integrated players like Starlink. High-power MEO platforms offer a capital-efficient alternative.

      The third driver is defense demand growth. NATO allies have increased defense budgets following the Ukraine
      conflict, and the U.S. government is pursuing both the PWSA architecture and Golden Dome missile defense
      requiring space-based assets. K2's Gravitas mission was specifically funded by the Space Force to validate
      MEO capabilities, signaling institutional interest that precedes formal acquisition programs. The SDA's
      HALO Europa program (2026) demonstrates continued government investment in proliferated space architectures,
      though this specific program favors LEO. K2 is also cited by management as a fit for the Resilient GPS
      program, which seeks to augment GPS with MEO-capable platforms.
