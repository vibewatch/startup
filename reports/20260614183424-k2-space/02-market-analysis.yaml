callouts:
  - calloutType: insight
    title: SES meoSphere Order Is the Only Confirmed Commercial Anchor
    body: >-
      As of June 2026, SES's initial order of 28 Mega Class platforms for the meoSphere constellation is the
      sole confirmed commercial demand anchor for K2's high-power bus. The implied contract value (~$420M at
      $15M/bus) is material, but full meoSphere deployment targets 2030, spanning a multi-year delivery schedule.
      Investor confidence in the TAM narrative depends heavily on whether a second commercial operator places
      an order before the SES program is complete.
    claimRefs:
      - CM008
      - CM009
      - CM010
      - CM032

  - calloutType: risk
    title: No Independent TAM for High-Power Bus Segment — Sizing Caveat
    body: >-
      The absence of a publicly available, current analyst TAM specifically for high-power satellite buses is a
      material gap. All TAM and SAM figures cited in this chapter are either derived from SIA historical data
      (2013 vintage), agent estimation, or bottom-up contract aggregation. Investors should commission an
      independent market study before anchoring valuation to any specific SAM figure.
    claimRefs:
      - CM005
      - CM032

  - calloutType: risk
    title: Bearish Scenarios — MEO Heritage Lag and Acquisition Reform Failure
    body: >-
      If Gravitas reveals radiation-tolerance issues or the orbit raise fails to meet the 90-day timeline, the
      commercial MEO market case collapses for at least two to three years while heritage is rebuilt. Similarly,
      if DoD acquisition reform does not relax ESPA ring and form-factor requirements, the government TAM remains
      limited to purpose-built programs that individually require multi-year advocacy from K2 management.
      These two adverse scenarios together represent a plausible bear case for the market.
    claimRefs:
      - CM026
      - CM028
      - CM029
      - CM041

