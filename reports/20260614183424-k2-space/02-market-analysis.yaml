  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market-sizing
      missingEvidence: >-
        A current (2024–2026) independent analyst report from a recognized market research firm (Novaspace,
        Bryce, NSR, Euroconsult/Novaspace, Morgan Stanley) isolating the TAM for high-power satellite buses
        (>10 kW) with segmented data by orbit type and end-market.
      whyItMatters: >-
        Without an independent TAM, the market size analysis is entirely bottom-up and can only bracket the
        opportunity. Investors cannot benchmark K2's SAM assumptions against third-party projections, creating
        uncertainty in valuation models.
      diligencePath: >-
        Commission or purchase a Bryce/NSR satellite manufacturing market report; alternatively, request K2
        management to share any third-party market analysis they used in the fundraising process.
