  - id: TM004
    title: Growth Drivers and Adoption Constraints — Assessment Matrix
    columns:
      - Driver / Constraint
      - Direction
      - Timing
      - Implication for K2
      - Diligence Ask
    rows:
      - - Heavy-lift launch economics (Falcon 9 rideshare)
        - Driver
        - Current — Falcon 9 operational; 10 sats/launch
        - Enables K2's cost-reduction thesis; reduces per-satellite launch cost vs. direct MEO launch
        - Validate Falcon 9 rideshare capacity and pricing for heavy (~2T) satellites going forward
      - - Giga Class super-heavy lift (Starship / New Glenn)
        - Driver (future)
        - 2027–2030 dependent on Starship commercial certification
        - Unlocks 100 kW Giga Class market; deferred if Starship certification slips
        - Track Starship commercial manifest and pricing; assess K2's contingency if delayed
      - - MEO orbit efficiency (3:1 coverage ratio vs. LEO)
        - Driver
        - Structural — physics-based
        - Reduces constellation size requirement; lowers operator CapEx for global coverage
        - Verify coverage math with independent orbital mechanics analysis; check Ka-band alternatives
      - - Defense spending increase (NATO, Golden Dome)
        - Driver
        - Current 2025–2030
        - Expands government TAM; Gravitas pathfinder validates defense product-market fit
        - Quantify Golden Dome solicitation timeline; confirm Resilient GPS program fit
      - - SES meoSphere iterative procurement model
        - Driver
        - Current — 28-satellite order placed March 2026
        - Validates commercial anchor demand; reduces K2 revenue concentration risk if other operators follow
        - Assess whether other commercial MEO operators will adopt similar agile procurement models
      - - MEO radiation environment and heritage gap
        - Constraint
        - Structural — until 2–3 year MEO operational data available (est. 2028)
        - Slows second-tier commercial operator adoption until Gravitas provides multi-year performance data
        - Require K2 to share Gravitas telemetry and radiation-hardening test data with prospective customers
      - - Defense acquisition inertia (ESPA ring requirements)
        - Constraint
        - Multi-year — reform requires policy change
        - Limits military TAM to programs that bypass ESPA constraints via STRATFI or bespoke procurement
        - Track Space Force acquisition reform progress; assess probability of ESPA waiver for K2-class buses
      - - Competing LEO architectures (Starlink, Amazon Kuiper, Telesat Lightspeed)
        - Constraint (partial)
        - Current — Starlink dominates LEO economics
        - Vertically integrated competitors at LEO scale reduce operator incentive to build new MEO networks
        - Assess operator churn from legacy MEO (SES) toward LEO VSAT alternatives; check SES meoSphere IRR
      - - Starship / Giga Class timeline risk
        - Constraint
        - 2–5 year delay risk
        - Giga Class revenue is deferred; company must sustain through Mega Class production ramp alone
        - Model K2 cash burn and factory utilization assuming Giga Class delayed to 2030+
      - - Capital intensity and competing operator priorities
        - Constraint
        - Structural — satellite CapEx is multi-hundred-million-dollar commitment
        - Operators considering MEO must prioritize K2 over competing investments (LEO, GEO upgrades)
        - Assess operator CapEx budgets and capital allocation priority versus competing programs
    notes: >-
      Driver/constraint classification and timing reflect management commentary and independent analysis from
      cited sources. Implications are agent assessments informed by reported evidence. Diligence asks are
      prospective; none have been independently validated through customer interviews.
