    summary: >-
      Three nested lenses bracket the market from a broad global satellite manufacturing base down to K2's
      factory-capacity ceiling; each successive layer reflects higher data confidence but narrower scope.
    data:
      nodes:
        - label: "TAM: Global High-Power Satellite Bus Market (>5 kW)"
          detail: >-
            Estimated $3–7B/yr based on inferred 15–30% share of $20–25B total satellite manufacturing market.
            No independent segmented analyst report available; confidence is very low.
          tone: neutral
        - label: "SAM: MEO/GEO Proliferated + US/Allied Gov Demand"
          detail: >-
            Agent estimate of $1–4B/yr by 2030, anchored by SES meoSphere ($420M implied), SDA PWSA (billions
            across vendors), and K2's undisclosed pipeline. Confidence is low; highly dependent on
            operator adoption rate post-Gravitas.
