  evidenceGaps:
    - type: missing-source
      severity: material
      topic: Starship commercial payload manifest
      missingEvidence: SpaceX has not published a confirmed commercial payload manifest for Starship flights in 2026–2028; delivery dates and pricing for the Giga-class program remain speculative.
      whyItMatters: K2's Giga-class platform (100 kW) requires Starship or New Glenn; if commercial launch service is unavailable or priced above model assumptions, the entire Giga program is blocked.
      diligencePath: Monitor SpaceX Starship commercial service announcements; track New Glenn manifest and pricing releases from Blue Origin as alternative; request K2 Giga-class schedule contingency plan.
      relatedQuestionRefs:
        - QR018

    - type: missing-source
      severity: blocking
      topic: FCC and ITU authorization
      missingEvidence: FCC license applications, ITU coordination records, and orbital slot filings for K2 Space's planned MEO satellite operations and meoSphere frequency coordination.
      whyItMatters: Without confirmed spectrum authorization, K2 satellites cannot legally operate or interfere protection cannot be established; a surprise denial could block the SES meoSphere program.
      diligencePath: Request FCC IBFS filing search for K2 Space; contact ITU Bureau for coordination submissions; verify SES ITU filings for meoSphere orbital positions.
      relatedQuestionRefs:
        - QR008
        - QR019
      relatedTableRefs:
        - TR001

    - type: private-evidence-only
      severity: blocking
      topic: burn rate and financial runway
      missingEvidence: K2 Space's monthly burn rate, cash position, gross margin per satellite, and estimated runway to commercial revenue from SES pathfinder programs.
      whyItMatters: Without burn visibility, investors and customers cannot assess whether K2 can survive the 18–24 months between the Series C (Dec 2025) and initial SES production payments (2028+).
      diligencePath: Request quarterly financial statements; obtain Series C investment terms including milestones and liquidation preferences; model cash-flow from STRATFI payment schedule.
      relatedQuestionRefs:
        - QR004
        - QR022

    - type: stale
      severity: material
      topic: Gravitas orbit raise completion status
      missingEvidence: Public confirmation that Gravitas has successfully completed its LEO-to-MEO orbit raise, achieved MEO insertion, and demonstrated 20 kW thruster health in the radiation environment.
      whyItMatters: Orbit-raise success is the single most important near-term technical milestone; it gates SES pathfinder confidence, OPIR SMI program progress, and Series D fundraising.
      diligencePath: Monitor K2 Space press releases; watch SpaceNews and Payload Space for mission status updates through July 2026.
      relatedQuestionRefs:
        - QR007
        - QR016

    - type: private-evidence-only
      severity: material
      topic: SES meoSphere contract terms and payment schedule
      missingEvidence: The milestone structure, payment triggers, cancellation terms, and binding volume commitments in the SES 28-satellite manufacturing contract.
      whyItMatters: If the contract has no binding commitments before pathfinder validation, the $420M implied value may be largely contingent and not bankable collateral for working capital financing.
      diligencePath: Request executed contract or term sheet from K2 or SES; review SES FY2026 CapEx disclosures for meoSphere line item specificity.
      relatedQuestionRefs:
        - QR010
        - QR024

    - type: missing-source
      severity: material
      topic: Hall-effect thruster MEO in-space performance data
      missingEvidence: On-orbit performance data for the 20 kW Hall-effect thruster operating under MEO radiation conditions, including thrust efficiency, specific impulse, and erosion rate during the Van Allen belt traverse.
      whyItMatters: MEO radiation can alter plasma dynamics and accelerate channel erosion in Hall-effect thrusters; without in-space data, the 10-year mission life claim is unvalidated.
      diligencePath: Request Gravitas mission telemetry reports once orbit raise is complete; consult published Hall-effect thruster MEO radiation test literature.
      relatedQuestionRefs:
        - QR006
        - QR023

    - type: missing-source
      severity: minor
      topic: ITAR export license applications for SES partnership
      missingEvidence: State Department DDTC license filings or Technology Assistance Agreement (TAA) status for K2 Space's technology transfers to SES under the meoSphere program.
      whyItMatters: A pending or denied export license would delay hardware delivery to SES and create a potential contractual breach.
      diligencePath: Request DDTC license application status from K2 Space; review any publicly disclosed Foreign Military Sales or Direct Commercial Sales agreements covering meoSphere.
      relatedQuestionRefs:
        - QR008
        - QR013

