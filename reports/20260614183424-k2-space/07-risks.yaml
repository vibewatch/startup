  - id: TR002
    title: Operational and Technical Risk Register
    columns:
      - Failure Mode
      - Likelihood
      - Severity
      - Mitigation Maturity
      - Residual Exposure
      - Unresolved Gap
    rows:
      - - Hall-effect thruster failure or underperformance during LEO-to-MEO transit
        - Medium
        - Critical
        - Ground hot-fire at 20 kW validated; no prior in-space operation at full power in MEO environment
        - Orbit raise failure = mission loss; 12–18 month delay to next satellite delivery
        - Confirm Gravitas orbit-raise completion; request thruster operating hours and erosion data
      - - Radiation-induced electronics failure in Van Allen belts during transit
        - Medium
        - Critical
        - Radiation-tolerant avionics designed for MEO; heritage from Jan 2025 LEO component demo
        - First full system in Van Allen transit; cumulative dose exposure unvalidated at system level
        - Request TID/SEE test reports for each avionics subsystem; confirm shielding margins
      - - Manufacturing defect propagating across multi-unit production run
        - Low-Medium
        - High
        - 80%+ in-house; quality-control process maturity unknown at multi-unit scale
        - Single-design-defect could affect multiple satellites simultaneously
        - Request quality management system certification (AS9100); audit production process controls
      - - Solar array deployment failure or power degradation in MEO radiation
        - Medium
        - High
        - Twin 10 kW arrays tested in ground environment; first in-space deployment on Gravitas
        - Power loss reduces payload capacity, orbit-raise speed, and mission duration
        - Confirm in-space deployment status on Gravitas; request beginning-of-life vs end-of-life power margin data
      - - Supply disruption for Krypton propellant (Hall-effect thruster feedstock)
        - Low
        - High
        - Krypton is commercially available industrial gas; no documented sole-source dependency
        - Limited historical precedent for Krypton supply constraints in space applications at scale
        - Identify Krypton supply contracts; confirm multi-supplier strategy for constellation-scale demand
      - - Radiation-tolerant ASIC or space-qualified component shortfall
        - Low-Medium
        - Medium
        - Space-qualified electronics supply has known lead-time constraints (12–24 months)
        - Production ramp to 100 satellites/year may outstrip current radiation-tolerant IC supply
        - Request bill-of-materials for space-qualified long-lead items; confirm purchase order status for 2027 production
    notes: >
      Likelihood and severity assessments are based on industry benchmarks for first-flight integrated satellite platforms and available public disclosure. Mitigation maturity reflects K2's own disclosures; independent technical assessment not possible without access to test reports.

  - id: TR003
    title: Partner and Dependency Risk Register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration
      - Failure Scenario
      - Severity
      - Mitigation
      - Residual Exposure
    rows:
      - - SpaceX Falcon 9 rideshare (Transporter / dedicated)
        - SpaceX
        - Primary launch provider for Mega-class satellites (2026–2028)
        - High — SpaceX holds >60% global rideshare capacity
        - Slot unavailability, price increase, or schedule delay cascades into missed delivery windows
        - High
        - Contract with SpaceX in place for Trinity (2027); rideshare market has added alternatives (RocketLab, Ariane 6)
        - Rideshare slot scarcity and SpaceX schedule pressure remain; no disclosed backup launch contract
      - - SpaceX Starship / Blue Origin New Glenn (Giga class)
        - SpaceX / Blue Origin
        - Required for Giga-class 100 kW satellites (post-2028)
        - Critical — Giga cannot fly on current rockets
        - Starship commercial service delays or payload capacity limitations block Giga program entirely
        - High
        - Mega class provides revenue bridge; K2 is not solely dependent on Starship for near-term missions
        - Giga-class commercial schedule depends on Starship achieving operational reliability — still developmental as of mid-2026
      - - SES (meoSphere — 28 Mega satellites + pathfinder chain)
        - SES S.A.
        - Primary commercial customer; sole disclosed large-volume order
        - Critical — ~$420M implied contract value (28 × $15M)
        - SES financial distress, strategy pivot, or pathfinder failure reduces order or cancels entirely
        - Critical
        - Pathfinder missions in 2026–2027 are structured to incrementally de-risk the constellation order
        - SES has stated it will adjust volumes based on market; binding commitments per milestone unknown
      - - US Space Force / DoD Programs (STRATFI, PTS-G, OPIR SMI)
        - US Government
        - Principal government revenue source; provides mission funding and demand signal
        - High — majority of disclosed contracts are DoD-adjacent
        - Congressional appropriations cut, program cancellation, or prime contractor change removes contracts
        - High
        - Multiple programs (STRATFI, PTS-G, OPIR) provide some diversification across DoD lines
        - Single appropriations cycle could simultaneously affect all programs; no commercial government contract disclosures
      - - SES as PTS-G prime contractor (K2 subcontractor)
        - SES S.A.
        - K2 supplies bus for SES's $437.7M PTS-G satellite contract with Space Force
        - High — PTS-G is a major near-term government revenue path
        - SES loses PTS-G re-compete; bus supplier role moves to different vendor
        - Medium-High
        - PTS-G indefinite-delivery contract has ceiling of $4 billion; additional orders planned from 2028
        - Future PTS-G orders may be re-competed; K2 is not guaranteed selection in successive awards
    notes: >
      Rows ordered by severity. Contract values are estimates based on disclosed per-unit pricing ($15M per Mega bus). PTS-G structure reflects SpaceNews reporting (June 2026); individual award terms are government-classified.

  - id: TR004
    title: People and Execution Risk Register
    columns:
      - Role / Function
      - Dependency or Gap
      - Likelihood
      - Severity
      - Mitigation
      - Diligence Path
    rows:
      - - CEO and Co-Founder (Karan Kunjur)
        - Single executive controls vision, investor relationships, customer deals, and government liaison
        - Low
        - Critical
        - No disclosed succession plan or co-CEO arrangement; brother Neel Kunjur is CTO
        - Confirm board independence, succession policy, D&O insurance, and equity vesting schedule
      - - CTO and Co-Founder (Neel Kunjur)
        - Primary technical authority for satellite bus design; loss would create engineering leadership gap
        - Low
        - High
        - Core engineering team from SpaceX; VP-level technical staff hired 2023–2025
        - Confirm key-person retention terms; identify next technical leadership tier
      - - Head of Strategy (Dr. John Plumb)
        - Former Pentagon space policy chief; critical to DoD relationship management and Golden Dome positioning
        - Low-Medium
        - High
        - Relationship credibility cannot be transferred immediately to replacement; deep DoD network is a key asset
        - Verify retention incentives; assess whether government relationships are institutionalized vs. personal
      - - Production / Manufacturing Scale-Up Workforce
        - Company scaled from 25 to 150+ employees 2022–2025; scaling to 100 sats/year requires additional 300–500+ production workers
        - Medium
        - High
        - Torrance (LA) labor market is competitive; SpaceX and others compete for aerospace talent
        - Request current workforce plan, hiring pipeline, and retention metrics; confirm quality-assurance staff capacity
      - - Propulsion Engineering (Hall-Effect Thruster Team)
        - Specialized Krypton-fed 20 kW HET expertise is rare; team led by Rafael Martinez (ex-SpaceX)
        - Low-Medium
        - High
        - Proprietary thruster design is a core moat; loss of team compresses competitive advantage
        - Confirm key propulsion engineers are on equity retention plans; assess hiring pipeline for scale-up
    notes: >
      Severity assessments reflect the early-stage company's dependence on a small number of technical and business leaders. Likelihood is based on publicly observable company health (strong funding, mission success so far) rather than internal turnover data.

  - id: TR005
    title: Mitigation and Kill Criteria
    columns:
      - Risk
      - Monitorable Trigger
      - Threshold / Event
      - Action Implication
    rows:
      - - Gravitas orbit raise / propulsion failure
        - Gravitas MEO insertion confirmation in public disclosures
        - No public confirmation of MEO orbit insertion by Q3 2026
        - "Thesis-break: immediately reassess SES meoSphere schedule, government contract deliveries, and fundraising timeline"
      - - SES meoSphere cancellation or major delay
        - SES capital expenditure guidance, pathfinder mission announcements
        - SES pulls meoSphere from CapEx plan or delays constellation order beyond 2028
        - Customer concentration risk materializes; immediate financial model review and emergency fundraise assessment
      - - Starship commercial launch delay beyond 2029
        - SpaceX Starship commercial manifest updates
        - No commercial payload manifest for Starship by end of 2027
        - Giga-class program is blocked; strategic pivot to Mega-class only or seek alternative super-heavy lift
      - - DoD budget cut eliminating PTS-G or OPIR programs
        - Congressional NDAA / appropriations bills; program of record status announcements
        - PTS-G loses funding or OPIR SMI is not continued in FY2028
        - Government revenue stream contracts by >50%; immediate diversification required
      - - ITAR violation or export license denial for SES program
        - DDTC enforcement notices; program stop-work orders; SEC/DoJ filings
        - State Department issues stop-work on any K2 export license
        - Program delivery halted; remediation required before commercial SES deliveries can resume
      - - Manufacturing defect found in production run after Gravitas
        - Customer acceptance testing; quality nonconformance reports
        - Two or more satellites in a production batch fail acceptance testing for the same root cause
        - "Recall-equivalent: production pause; root cause analysis; redesign; potential delivery delay of 6-12 months"
      - - Competitive displacement in PTS-G follow-on awards
        - Space Force PTS-G solicitations from 2028
        - SES fails to win PTS-G follow-on; Rocket Lab/Viasat team wins majority of future awards
        - K2 loses its primary government-funded production ramp; accelerate SES commercial and diversify customer base
    notes: >
      Triggers are monitorable through public disclosures, congressional records, and customer announcements. Thresholds reflect material adverse changes to K2's financial model and were constructed from available contract and program information.

