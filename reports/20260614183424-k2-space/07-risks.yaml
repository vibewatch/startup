tables:
  - id: TR001
    title: Regulatory / Legal Risk Register
    columns:
      - Rule / License / Framework
      - Jurisdiction
      - Status
      - Likelihood
      - Severity
      - Mitigation
      - Residual Exposure
      - Diligence Path
    rows:
      - - ITAR (USML Cat XV — spacecraft systems)
        - US / State Dept DDTC
        - Active / ongoing compliance required
        - High
        - Critical
        - In-house compliance program; export license applications per program; cleared-facility protocols
        - SES (LU) partnership requires DSP-5 export licenses; classified payload access controls critical
        - Request DDTC licensing status; verify TAA/MLA in place for SES meoSphere program
      - - FCC Authorization (spectrum + orbital slots)
        - US / FCC
        - Not publicly disclosed
        - High
        - High
        - Coordination with ITU and foreign administrations required for ~8,000 km MEO slots
        - No FCC filing or ITU coordination records publicly available; constitutes a material gap
        - Request FCC license application status and ITU filing positions for meoSphere MEO slots
      - - SpaceWERX STRATFI Program Terms
        - US / Space Force
        - Active — $60M STRATFI contract awarded Dec 2024
        - Medium
        - High
        - SBIR Phase III matching structure; government milestones must be satisfied for payment
        - STRATFI contracts can be restructured or not renewed; technology-transition to Program of Record not guaranteed
        - Obtain STRATFI contract terms; verify milestone payment schedule and continuing Phase III obligations
      - - EAR (Commerce Dept — dual-use items)
        - US / BIS
        - Active / ongoing compliance
        - Medium
        - Medium
        - Classification of commercial satellite components under EAR vs. ITAR boundary
        - Overlap between ITAR spacecraft category and EAR for commercial components creates classification risk
        - Legal review of component classifications; confirm BIS license exceptions applicable to SES and IRIS² program
      - - Defense Federal Acquisition Regulation (DFARS)
        - US / DoD
        - Active — applies to PTS-G and STRATFI
        - Low
        - Medium
        - Prime contractors (SES, Viasat) hold the DFARS compliance obligation; K2 is subcontractor
        - As subcontractor, K2 must satisfy flow-down clauses on cybersecurity (CMMC), counterfeit parts, and supply-chain risk
        - Verify CMMC Level 2 or 3 certification status; audit flow-down compliance obligations in PTS-G subcontract
    notes: >
      Rows ordered by severity. ITAR status derived from public contract disclosures (STRATFI, PTS-G, national security payloads); no DDTC licensing records are publicly available for K2 Space. FCC and ITU status is unverified — a material diligence gap. STRATFI terms sourced from K2 and SpaceWERX press disclosures.
    enumerationScope:
      coverage: partial
      basis: >
        Known regulatory frameworks applicable to US satellite manufacturers under DoD contracts; limited to publicly disclosed program information. FCC and ITU status, DDTC individual license applications, and internal compliance program details are non-public.
    claimRefs:
      - CR028
      - CR029
      - CR030
      - CR031
      - CR032
