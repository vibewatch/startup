  - id: customer-government-concentration
    title: Customer Concentration and Government Program Dependence
    body: >
      K2 Space's declared $500 million in signed contracts is concentrated in two relationships that represent both its greatest commercial validation and its greatest single-point-of-failure risk. On the commercial side, SES placed an initial order of 28 K2 Mega-class satellites for its meoSphere MEO constellation in March 2026, with an eventual 100-satellite fleet outlined by SES CEO Adel Al-Saleh. At $15 million per bus, the initial 28-satellite order implies approximately $420 million in potential K2 revenue—the single largest commercial satellite manufacturing contract disclosed for a startup manufacturer. However, SES has been explicit that the order is contingent on pathfinder mission validation: multiple pathfinder missions with "progressively greater payload complexity" are planned for 2026–2027, and SES has stated it will "adjust both from a volume point of view" based on market needs. A pathfinder failure or SES strategic pivot would remove the company's primary commercial revenue source. On the government side, K2 is a platform supplier for SES's Protected Tactical Satcom-Global (PTS-G) award—a combined $437.7 million Space Force communications contract—as well as a participant in the OPIR Space Modernization Initiative (SMI, $180 million FY2027 budget) and the original $60 million STRATFI award from SpaceWERX. These programs are vulnerable to Congressional appropriations uncertainty, Department of Defense priority shifts, and changes in the political appetite for Golden Dome and missile-defense architectures. Prior SBIR/STRATFI programs have been restructured or cancelled when technology transition to Program of Record failed. The concentration of both commercial and government revenue in US defense-adjacent markets also limits K2's pricing power and introduces procurement-cycle risk.
    claimRefs:
      - CR021
      - CR022
      - CR023
      - CR024
