  - id: TU005
    title: Expansion and Concentration Risk
    columns:
      - Factor
      - Impact
      - Severity
      - Diligence Path
    rows:
      - - SES single-customer commercial concentration
        - SES is the only publicly named commercial constellation customer; loss or reduction of SES order removes the dominant commercial pipeline and validates government-only revenue profile
        - High
        - Obtain confirmation that the 28-satellite order includes a binding non-cancellable commitment or break fee; identify 2–3 additional named commercial constellation customers from the $500M backlog
      - - U.S. Space Force / STRATFI budget dependency
        - Government revenue anchored by one experimental funding mechanism; STRATFI requires annual Congressional authorization and is not a permanent acquisition pathway
        - High
        - Review STRATFI contract terms; track FY2026 and FY2027 Space Force appropriations; assess whether DoD follow-on programs use traditional FAR acquisition or continue STRATFI/OTA vehicles
      - - OPIR/SMI program-level risk (Golden Dome dependency)
        - OPIR SMI is an R&D program, not a constellation contract; if Golden Dome architecture changes or funding shifts, K2's second government pathway could weaken
        - Medium
        - Monitor DoD FY2027 NDAA provisions for Golden Dome; track whether K2 is named in production contracts beyond R&D demos; assess competitive alternatives (e.g., SpaceX Starshield)
      - - SES meoSphere option-exercise upside (land-and-expand)
        - SES CEO confirmed options in place for up to ~100 satellites; exercising options would double-to-triple K2's production volumes and reduce per-unit cost through manufacturing scale
        - Positive / Contingent
        - Track SES meoSphere subscriber growth, O3b mPOWER utilization, and SES investor guidance on capital expenditure for meoSphere; option-exercise decision expected 2027–2028
      - - Anonymous pipeline customer conversion risk
        - K2 CEO implies 12 GRAVITAS payload customers are contemplating 10–50 satellite constellations; conversion rate from payload tester to constellation buyer is unknown and unverified
        - Medium
        - Request conversion funnel data from K2; request named references for at least two additional commercial constellation customers from the $500M backlog
    notes: >-
      Severity ratings (High/Medium) reflect the author's assessment based on disclosed
      facts; no independent financial model is available. "Positive/Contingent" for SES
      options reflects genuine upside conditioned on pathfinder success and SES demand growth.
