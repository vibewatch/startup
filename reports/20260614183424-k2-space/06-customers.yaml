  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: commercial customer identities beyond SES
      missingEvidence: >-
        Names, signed contract terms, delivery schedule, and values for the commercial
        customers embedded in K2's $500M+ backlog other than SES.
      whyItMatters: >-
        Without identifying additional commercial customers, the customer concentration
        in SES cannot be properly assessed, and the quality of the $500M+ backlog figure
        cannot be independently verified or disaggregated.
      diligencePath: >-
        Request K2 management to name at least two to three additional commercial customers
        from the $500M backlog, with confirmation of binding versus conditional contracts,
        delivery timeline, and approximate value per customer.
      relatedQuestionRefs:
        - QU011
        - QU021
        - QU023
      relatedTableRefs:
        - TU003

    - type: missing-source
      severity: material
      topic: GRAVITAS anonymous payload customers
      missingEvidence: >-
        Identities of the 12 GRAVITAS payload customers, their intent to order constellations,
        and any outcome data from the pathfinder mission available as of June 2026.
