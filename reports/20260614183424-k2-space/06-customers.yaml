  - id: adoption-trajectory-deployment
    title: Adoption Trajectory and Deployment Timeline
    body: >-
      K2's adoption trajectory moved from in-space component demonstration to a full
      satellite mission in fifteen months. The first technology validation was a hosted-payload
      flight on D-Orbit's ION Satellite Carrier in January 2025 (SpaceX Transporter-12 rideshare),
      which demonstrated the flight computer, reaction wheel, embedded avionics, and flight
      software. GRAVITAS, K2's first fully integrated Mega Class satellite, then launched
      March 30, 2026, carrying 12 payload modules and firing the most powerful electric thruster
      ever flown in orbit. The mission validated the complete stack—power, propulsion, and
      avionics—and established K2's first customer relationships in their operational form.


      The next phase runs over approximately 21 months post-GRAVITAS, with K2 planning ten more
      Mega Class satellites, two of which are dedicated to SES meoSphere pathfinder testing.
      The Trinity mission planned for 2027 will deploy three satellites across LEO, MEO, and
      geostationary transfer orbit (GTO) on a single SpaceX Falcon 9 launch, supporting both
      government and commercial customers. K2's Series C press release stated that operational
      commercial and national security constellations will begin deployment in 2028, with the
      SES meoSphere Phase 1 initial fleet delivery targeted for 2029. Seven meoSphere satellites
      can be stacked per Falcon 9 launch to low Earth orbit, then orbit-raise to MEO via onboard
      electric propulsion in approximately two to three months.


      K2 CEO Kunjur disclosed that GRAVITAS payload customers are "contemplating anywhere between
      10 to 50 satellites," suggesting a pipeline of unnamed constellation candidates beyond SES.
      Total signed contracts reached $500M+ as of December 2025, though the commercial-versus-
      government split and customer identities remain undisclosed. The cadence from first pilot to
      first production delivery spans approximately four years (2025 demo → 2029 delivery), a
      timeline not unusual for MEO satellite manufacturing but one that creates significant
      near-term revenue concentration risk in a handful of government programs.
