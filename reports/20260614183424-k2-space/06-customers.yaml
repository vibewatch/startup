  - id: retention-concentration-risk
    title: Retention, Expansion Path, and Concentration Risk
    body: >-
      K2 Space is pre-revenue in any conventional sense: the company has not yet completed
      a production satellite delivery and has no publicly disclosed NRR, GRR, or churn data.
      The strongest available retention signal is the SES escalation from strategic partnership
      (September 2025) to a formal 28-satellite production order (March 2026), a six-month
      progression that demonstrates the customer's willingness to expand financial commitment
      following pathfinder evidence. The OPIR/SMI selection by the Pentagon represents a second
      independent government program, signaling repeat interest from the DoD beyond the initial
      STRATFI scope.


      Customer concentration is, however, the dominant risk in this chapter. SES is the only
      named commercial constellation customer with a formal bus order; all other commercial
      relationships embedded in the $500M+ backlog are anonymized. On the government side,
      the U.S. Space Force via STRATFI is the singular anchor, and STRATFI requires annual
      Congressional appropriation. The $60M STRATFI contract was structured as a blended
      instrument (government funds + SBIR matching + private co-investment), meaning
      government appropriation alone does not cover its full value, and future follow-on
      contracts are not yet announced.


      Counterflow Solutions, an independent space-industry analyst, noted in 2025 that
      "government remains the economic backbone" for K2's current revenue profile and
      that commercial demand had not yet materialized at scale. SES CEO Al-Saleh confirmed
      options in place to expand meoSphere to approximately 100 satellites, but those options
      sit alongside SES's statement that meoSphere is already embedded in its FY2026 capital
      expenditure guidance and will be built with a dual supply chain across the Atlantic.
      That language strengthens procurement intent and budget commitment, but it still leaves
      execution and pathfinder-conversion risk with a single commercial operator.
      Options in place to expand meoSphere to approximately 100 satellites remain contingent
      on pathfinder success and SES demand growth. The land-and-expand story
      is structurally compelling—28 contracted satellites with a 100-satellite option from a
      single operator—but the production revenues are three to four years away from realization,
      during which time K2 depends on continued government mission funding, investor capital,
      and successful pathfinder performance.
