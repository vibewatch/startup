    - type: missing-source
      severity: low
      topic: GRAVITAS orbit-raise completion status
      missingEvidence: >-
        Whether the GRAVITAS satellite successfully completed its orbit-raise from low Earth
        orbit (Transporter-16 insertion, ~500 km) to the target MEO altitude (~8,000 km)
