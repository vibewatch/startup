acknowledgedWarnings:
  - dimension: figureType
    reason: >-
      The retention/repeat cohort figure type (planned as a time-series retention table)
      cannot be produced for K2 Space because the company has completed zero production
      satellite deliveries as of the June 14, 2026 run date; no historical retention or
      cohort data exists. The FU004 Procurement Pathway flow figure is substituted as the
      nearest available proxy, showing the sequential customer engagement stages from initial
      pathfinder to constellation delivery.
  - dimension: tableNotes
    reason: >-
      TU001 (Customer Segmentation) and TU004 (Retention Indicators) are not pure factual
      snapshot tables; both contain estimated values, derived metrics, and qualitative
      assessments. Notes are included in those tables per the standard requirement.
      This acknowledgment covers the cases where inline notes may not appear in every
      sub-column given the compound nature of the cells.
