chapter:
  number: 6
  title: Customers
  summary: >-
    K2 Space's customer base as of June 2026 is anchored by two named relationships:
    the U.S. Space Force (via a $60M STRATFI contract for the GRAVITAS pilot mission launched
    March 30, 2026) and SES, which placed an initial 28-satellite production order for its
    meoSphere MEO constellation on March 24, 2026. GRAVITAS carried 12 undisclosed payloads
    from both national security and commercial customers, and K2 has disclosed $500M+ in
    signed contracts without breaking out the government-versus-commercial mix; the SES
    order is the only public production contract, with delivery targeted for 2029–2030,
    leaving customer concentration and near-term revenue visibility as the primary diligence risks.

sections:
  - id: customer-segments-named-proof
    title: Customer Segments and Named Customer Proof
    body: >-
      K2 Space operates a dual-track customer model: U.S. government and national-security
      agencies provide the anchor revenue and program validation today, while commercial
      satellite operators—led exclusively by SES—anchor the long-range production pipeline.
      The U.S. Space Force, via SpaceWERX, awarded K2 a $60 million Strategic Funding Increase
      (STRATFI) contract in December 2024 for GRAVITAS, K2's first Mega Class satellite.
      Multiple Department of the Air Force organizations co-funded the mission, including the
      Space Domain Awareness and Combat Power PEO, Space Development Agency, Space Warfighting
      Acquisition Delta, DoD Space Test Program, Space Force National Space Test and Training
      Complex, and Air Force Research Laboratory. GRAVITAS launched March 30, 2026, on SpaceX
      Falcon 9 (Transporter-16), carrying 12 undisclosed payload modules from national security
      and commercial customers.


      On the commercial side, SES announced a strategic collaboration with K2 on September 16,
      2025, at World Space Business Week in Paris. This escalated to a formal 28-satellite
      production order announced at the Satellite 2026 conference in Washington on March 24, 2026,
      for the Phase 1 of the meoSphere MEO constellation. SES CEO Adel Al-Saleh confirmed SES
      had multiple payloads on GRAVITAS, making it the first meoSphere pathfinder satellite.
      K2 CEO Karan Kunjur stated that two of K2's planned ten test satellites (to be launched in
      the 21 months after GRAVITAS) are dedicated to SES pathfinder missions. The meoSphere
      Phase 1 architecture specifies 28 satellites across four inclined orbital planes at
      approximately 8,000 km altitude, targeting full operational capability by 2030.
      Advanced Television called the 28-satellite order "perhaps the satellite industry's
      largest ever for medium-Earth orbit."


      Beyond STRATFI and SES, the Pentagon selected K2 for its Overhead Persistent Infrared
      (OPIR) Space Modernization Initiative (SMI), a separate R&D program with a $180 million
      FY2027 budget (including $7.3 million for crosslink demonstrations), aimed at testing
      optical inter-satellite links in MEO to support Golden Dome missile defense architectures.
      K2's head of strategy John Plumb described these experiments as "absolutely key to
      Golden Dome." All other GRAVITAS payload customers and the broader $500M+ signed
      backlog remain undisclosed, limiting customer-base visibility beyond these three named
      programs.
