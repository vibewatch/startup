callouts:
  - calloutType: strength
    title: "SES 28-Satellite Order — Largest MEO Satellite Contract Ever Placed"
    body: >-
      SES's formal 28-satellite production order for meoSphere, announced March 24, 2026,
      represents the single largest MEO satellite bus order in the industry's history. At
      $15 million per bus, the Phase 1 order alone implies approximately $420 million in
      satellite bus revenue for K2, with SES CEO options in place to expand to
      approximately 100 satellites (~$1.5B total). The six-month escalation from strategic
      partnership to production order demonstrates credible customer validation from one of
      the world's most established satellite operators.
    claimRefs:
      - CU009
      - CU010
      - CU011
      - CU013
      - CU034

  - calloutType: risk
    title: "Two-Customer Concentration Creates Material Revenue Dependency"
    body: >-
      K2's near-to-medium-term revenue is anchored exclusively in two named relationships:
      U.S. Space Force (STRATFI) and SES (meoSphere). All other commercial pipeline customers
      from the $500M+ backlog are anonymous, and no production satellite has yet been delivered.
      The STRATFI mechanism requires annual Congressional authorization, and SES's 28-satellite
      order delivers no production revenue until 2029. If either relationship encounters
      budget, political, or technical disruption before constellation delivery, K2's path
      to self-sustaining commercial revenue is materially at risk.
    claimRefs:
      - CU036
      - CU037
      - CU038
      - CU039
      - CU043

  - calloutType: insight
    title: "Hosted-Payload Model Bridges Pilots to Production Orders"
    body: >-
      K2's strategy of filling GRAVITAS with 12 hosted payload slots—from both national security
      and commercial customers—creates a low-friction entry point that converts demonstration
      payloads into potential constellation orders. CEO Kunjur has explicitly linked each
      GRAVITAS payload to a customer contemplating 10–50 satellite constellations. The
      SES pathway (payload on GRAVITAS → dedicated pathfinder sats → 28-satellite production
      order) validates the model, but the conversion rate from payload tester to constellation
      buyer remains unproven at scale across the remaining 11 anonymous GRAVITAS customers.
    claimRefs:
      - CU005
      - CU040
      - CU045
      - CU019

