chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Headquarters, and Business Model
        blocks:
          - type: paragraph
            body: >
              K2 Space was incorporated in 2022 in Torrance, California by brothers Karan Kunjur (CEO) and Neel Kunjur
              (CTO), both former SpaceX engineers who worked on Dragon capsule avionics and mission systems. The company
              describes itself as building the most powerful commercially available satellite in the world at affordable
              prices and short lead times, targeting the perceived gap between small rideshare constellations and legacy
              GEO comsats priced in the hundreds of millions of dollars.

              The core business model is satellite manufacturing: K2 designs, builds, and sells Mega Class satellite bus
              platforms to commercial operators, government agencies, and defense customers. The flagship Mega Class
              satellite generates 20 kW of onboard power—roughly ten times the output of comparably sized commercial
              constellations—carries up to 3,000 kg of payload on a 3m by 2.7m deck, and is designed to operate across
              LEO, MEO, GEO, and cislunar orbits. At an approximate price of $15 million per satellite with delivery in
              under three months, K2 positions the platform as a disruptive alternative to multi-year,
              hundred-million-dollar traditional procurement cycles.

              As of the canonical run date of June 14, 2026, K2 Space is a late-stage, growth-phase company. It launched
              its first full Mega Class mission (GRAVITAS) in March 2026, secured over $500M in signed contracts, and is
              operating a 180,000 sq ft Torrance factory rated for 100 satellites per year. The company does not
              publicly disclose revenue or detailed backlog breakdowns.
