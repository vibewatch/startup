      - number: '3.2'
        title: Legacy GEO Incumbent Bus Manufacturers
        blocks:
          - type: paragraph
            body: >-
              Boeing Satellite Systems has delivered communications satellites for more than six decades and in 20+
              countries. Its portfolio includes the 702 family of large GEO buses used by operators including Viasat
              (ViaSat-3 generating more than 25 kW), and through Millennium Space Systems it offers agile small-sat
              constellation production for national security and commercial customers. Boeing also won the $2.8 billion
              ESS nuclear command and control contract (beating Northrop Grumman), confirming its continued dominance in
              protected MILSATCOM. Boeing's software-defined, flexible payload architecture targets commercial operators
              seeking dynamic bandwidth allocation and beamforming without hardware swaps.

              Northrop Grumman delivers secure, protected, and survivable MILSATCOM with a focus on the most critical
              government missions. Its communications satellite portfolio is oriented toward high-assurance,
              nuclear-hardened architectures — a segment where K2 does not currently compete — and it remains one of
              five qualified vendors in the PTS-G pool despite not winning the first production award. Northrop's space
              posture emphasizes uniqueness and multi-decade heritage over commercial cost competitiveness.

              Airbus Defence and Space builds telecommunications, navigation, and Earth observation satellites for
              European government and commercial customers. Its Eurostar Neo family is the primary GEO telecom bus used
              by operators like Eutelsat and SES in its prior procurement cycles. Airbus has deep institutional
              relationships with European operators and regulators that give it distribution advantages K2 must overcome
              in non-US markets.

              Thales Alenia Space — a joint venture between Thales (67%) and Leonardo (33%) with 40+ years of space
              manufacturing history — produces the Spacebus series, covering GEO telecom, navigation (Galileo), and
              science missions. Its customer base spans European agencies and international operators. Both Airbus and
              Thales are European incumbents with home-field advantages for EU operator contracts and EU institutional
              programs like IRIS2.

              None of the legacy incumbents publicly offers a multi-orbit, sub-$50M satellite bus designed for
              proliferation across LEO, MEO, and GEO with sub-3-month delivery. Their competitive response, if any,
              remains latent as of mid-2026 — representing both the key near-term opportunity for K2 and its primary
              latent moat risk.
