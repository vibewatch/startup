      - number: '1.2'
        title: Product Platform and Technical Milestones
        blocks:
          - type: paragraph
            body: >
              K2 Space's flagship product is the Mega Class satellite. Published specifications list 20 kW of onboard
              power generated through proprietary in-house solar arrays, a 3m by 2.7m payload deck carrying up to 3,000
              kg of payload, and an on-orbit wet mass of approximately 2 metric tons with a solar panel wingspan of
              approximately 40 meters. The platform is designed for multi-orbit operations spanning LEO, MEO, GEO, and
              cislunar trajectories using an onboard Hall-effect propulsion system.

              K2 builds approximately 80 percent of its satellite components in-house, including reaction wheels, flight
              computers, solar arrays, and the Hall-effect thruster. This vertical integration is the company's primary
              lever for cost and lead time reduction. In May 2025, K2 test-fired the highest-power Hall-effect thruster
              ever run at a private company facility—a 20 kW Krypton-fed unit—at full power at its Torrance
              headquarters, validating the core propulsion system ahead of the first full mission.

              The first in-space technology demonstration flew in January 2025 as a hosted payload on a D-Orbit ION
              vehicle launched on SpaceX Transporter-12, validating the flight computer, reaction wheels, and embedded
              avionics stack. The first full Mega Class mission, GRAVITAS, carried a DoD payload for the US Space Force
              under the STRATFI program and launched in March 2026 on SpaceX Falcon 9 as part of the Transporter-16
              rideshare. Beyond the Mega Class, K2 has publicly described a Giga Class satellite producing 100 kW of
              power, intended for the era when Starship and New Glenn reduce launch costs substantially. The Trinity
              mission planned for February 2027 targets three satellites across three orbits with an optical mesh
              payload, extending the multi-orbit strategy into an optical communications architecture.
