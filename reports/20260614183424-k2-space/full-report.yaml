      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Hold / Track — Await GRAVITAS On-Orbit Validation
            body: >-
              K2 Space is one of the most technically credible satellite manufacturing startups to emerge in a decade,
              with a differentiated platform, exceptional founding team, and $500 million in signed contracts providing
              real demand-side evidence. However, the $3 billion Series C entry price embeds execution optionality that
              will only be resolved once GRAVITAS completes its LEO-to-MEO orbit raise and the 20 kW thruster's in-space
              performance is confirmed. Entering at $3B without that data is an asymmetric bet: the bull case return
              (2–3x) does not compensate for the bear case risk of a down-round. Track aggressively; commit after
              on-orbit results confirm the core technical thesis.
            calloutType: recommendation
            claimRefs:
              - CV031
              - CV032
              - CV033
              - CV034
          - type: callout
            title: Critical Unknown — Preference Stack and Cap Structure Opacity
            body: >-
              K2 Space has raised $450 million across six rounds without disclosing its capitalization table,
              liquidation preferences, or anti-dilution provisions. At a $3 billion entry, the preference overhang from
              earlier investors — who bought at substantially lower valuations — creates meaningful downside risk for
              Series C investors in any exit below $4–5 billion. This is particularly relevant given T. Rowe Price's
              participation: as an institutional asset manager, it may demand liquidity provisions or drag-along rights
              that shape exit timing and terms. Full cap structure disclosure should be a pre-condition for any
              committed capital.
            calloutType: risk
            claimRefs:
              - CV037
              - CV040
          - type: callout
            title: SES meoSphere Order — Largest Near-Term Commercial Anchor
            body: >-
              The March 2026 announcement of SES's initial order of 28 K2 Mega-class satellites for the meoSphere
              constellation, at approximately $15 million per satellite, implies roughly $420 million in contract value
              from a single Tier-1 operator. SES CEO Adel Al-Saleh has indicated the eventual MEO fleet target is
              approximately 100 satellites, suggesting a long-term relationship that could generate $1.5 billion or more
              in revenue. This order partially de-risks the commercial thesis and provides a demand anchor that goes
              well beyond the pre-GRAVITAS speculation embedded in the $3 billion Series C price.
            calloutType: insight
            claimRefs:
              - CV009
              - CV010
              - CV039
              - CV042
          - type: callout
            title: Giga Class Valuation Optionality — Highly Speculative
            body: >-
              K2's Giga-class satellite platform (100 kW, 15,000 kg payload, Starship-sized) is a significant component
              of the bull-case valuation narrative. However, Giga is in the design phase with no announced launch date
              and no disclosed customer commitments. Commercial Starship availability for third-party payloads remains
              speculative as of June 2026. Investors should apply zero weight to Giga-class optionality in any near-term
              valuation model and treat it as a free call option on a very large addressable market — material only if
              K2 successfully executes the Mega ramp and Starship achieves commercial cadence.
            calloutType: assumption
            claimRefs:
              - CV027
              - CV028
