      - number: '6.2'
        title: Adoption Trajectory and Deployment Timeline
        blocks:
          - type: paragraph
            body: >-
              K2's adoption trajectory moved from in-space component demonstration to a full satellite mission in
              fifteen months. The first technology validation was a hosted-payload flight on D-Orbit's ION Satellite
              Carrier in January 2025 (SpaceX Transporter-12 rideshare), which demonstrated the flight computer,
              reaction wheel, embedded avionics, and flight software. GRAVITAS, K2's first fully integrated Mega Class
              satellite, then launched March 30, 2026, carrying 12 payload modules and firing the most powerful electric
              thruster ever flown in orbit. The mission validated the complete stack—power, propulsion, and avionics—and
              established K2's first customer relationships in their operational form.


              The next phase runs over approximately 21 months post-GRAVITAS, with K2 planning ten more Mega Class
              satellites, two of which are dedicated to SES meoSphere pathfinder testing. The Trinity mission planned
              for 2027 will deploy three satellites across LEO, MEO, and geostationary transfer orbit (GTO) on a single
              SpaceX Falcon 9 launch, supporting both government and commercial customers. K2's Series C press release
              stated that operational commercial and national security constellations will begin deployment in 2028,
              with the SES meoSphere Phase 1 initial fleet delivery targeted for 2029. Seven meoSphere satellites can be
