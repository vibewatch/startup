companyProfile:
  summary: >-
    K2 Space is a Torrance-based private satellite manufacturer founded in 2022 by brothers Karan and Neel Kunjur. The
    company is building high-power Mega Class satellites that target LEO, MEO, GEO, and future cislunar orbits, with a
    longer-term Giga platform sized for heavy-lift launch vehicles. Public evidence shows meaningful early validation:
    more than $450 million of equity financing, a $3 billion Series C valuation, more than $500 million in signed
    contracts, a March 2026 GRAVITAS launch, and a 28-satellite SES meoSphere order. The open question is not whether
    demand exists, but whether K2 can convert first-flight proof and contracted interest into repeatable manufacturing,
    delivered satellites, and durable economics before another major capital raise is needed.
