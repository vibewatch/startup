      - number: '3.3'
        title: New-Space Satellite Bus Challengers
        blocks:
          - type: paragraph
            body: >-
              Rocket Lab is the most comparable new-space bus manufacturer to K2 Space in terms of business model and
              vertical integration approach. Rocket Lab's spacecraft family spans Explorer (interplanetary, deep-space),
              Lightning (LEO high-power, ~3 kW, 12+ year lifetime), Pioneer (medium delta-V, re-entry capable), Photon
              (LEO/cislunar integrated), and Flatellite (LEO constellation). As of its official product page, Rocket Lab
              has 40+ spacecraft in backlog and 4 spacecraft launched. Its $515 million SDA Tranche 2 Transport
              Layer-Beta contract (18 satellites using tailored Lightning platforms) makes it the primary government
              constellation bus supplier in LEO for national security applications. In the PTS-G program, Rocket Lab was
              selected as Viasat's bus supplier for the GEO MILSATCOM segment — directly competing with K2, which serves
              SES in the same program.

              However, Rocket Lab's Lightning platform delivers approximately 3 kW of on-orbit power — roughly
              one-seventh of K2's Mega Class maximum — and is designed for LEO with a 12+ year life rather than
              multi-orbit operations. Rocket Lab's spacecraft complex in Long Beach, California (11,000 sq ft cleanroom)
              is substantially smaller than K2's 180,000 sq ft Torrance factory. The two companies are direct
              competitors in government bus supply, but with minimal overlap in commercial power class, orbit range, and
              payload capacity.

              Astranis builds compact, software-defined micro-GEO satellites for operators requiring connectivity in
              high Earth orbit. As of its most recent public disclosures, Astranis has more than 10 satellites on
              contract representing over $1 billion in satellite services sold. Its differentiation is focused narrowly
              on GEO orbit for fixed broadband connectivity — it does not offer LEO or MEO orbit capability, and its
              power profile is lower than K2's Mega Class. Astranis competes with K2 only at the margins — in situations
              where an operator considers both a single-orbit micro-GEO solution and a multi-orbit high-power solution.
              The two companies serve largely different use cases and customer archetypes.

              Viasat's ViaSat-3 platform exceeds 25 kW of on-orbit power in the GEO segment, demonstrating that
              high-power GEO satellites are a proven concept — but Viasat builds platforms for its own service rather
              than selling satellite buses to third parties, making it a substitute for K2's services rather than a
              direct bus manufacturer competitor. SpaceX Starlink V3 satellites are reported to target approximately 20
              kW, again built for internal constellation use rather than third-party customers.
