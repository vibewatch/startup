      - number: '1.3'
        title: Leadership, Founders, and Governance
        blocks:
          - type: paragraph
            body: >
              K2 Space was co-founded by brothers Karan Kunjur, who serves as CEO, and Neel Kunjur, who serves as CTO.
              Karan has a management consulting background from BCG and previously led an AI startup to a nine-figure
              acquisition before turning to the space sector. Neel led Dragon capsule avionics at SpaceX and served as a
              Mission Director before co-founding K2, giving the founding team direct experience in both business
              development and satellite systems engineering.

              Beyond the founders, K2 has assembled a team of senior SpaceX alumni in key functional roles. John
              Plumb—the Pentagon's first Senate-confirmed Assistant Secretary of Defense for Space Policy—joined as Head
              of Strategy, providing government relationships and regulatory expertise directly relevant to the
              company's large DoD customer base. Rafael Martinez, who led the design of SpaceX Starlink Hall-effect
              thrusters, heads Propulsion. Pieter Kranenburg founded the Starshield program at SpaceX and grew it from
              15 to over 300 employees before joining K2 as Head of National Security Programs. Jesse Klekamp, who led
              SpaceX talent acquisition, serves as Head of People. Drew Miller, who led Dragon 2 mechanisms, heads
              Structures, and Michael Saqr, who oversaw F9 and Dragon 2 firmware plus Starship avionics, heads Software.

              K2 Space has not publicly disclosed board composition, independent director structure, or investor board
              seat allocations. The concentration of leadership among SpaceX alumni creates both a strong technical
              culture and a key-person dependency risk, particularly around Karan Kunjur's dual role as primary
              capital-raiser and external face of the company. John Plumb's addition represents a meaningful broadening
              of the executive team toward government-sector expertise, reducing—but not eliminating—the operational
              concentration risk.
