            Up to 10 Mega satellites stacked per Falcon 9; launch at ~$7.2M per satellite (customer rate); Transporter
            rideshare model reduces cost vs. dedicated launch
        - id: leo-commissioning
          label: LEO Checkout and Commissioning
          detail: Payload activation; system health verification; solar array deployment; thruster initial checkout
        - id: orbit-raise
          label: LEO→MEO Orbit Raise (20 kW Hall thruster)
          detail: >-
            Hall thruster fires continuously; ~90 day transit; uses 35% of total propellant; radiation environment
            increases as satellite climbs
        - id: meo-operations
          label: MEO Operations (Multi-year)
          detail: >-
            Payload operations at target MEO altitude; high-power sensing, comms, and compute; station-keeping with
            remaining propellant
        - id: deorbit
          label: End-of-Life Deorbit
          detail: >-
            Remaining propellant used for compliant deorbit per space debris mitigation guidelines; 10-year mission life
            target
      edges:
        - from: payload-integration
          to: launch
          label: integration complete
        - from: launch
          to: leo-commissioning
          label: separation from Falcon 9
        - from: leo-commissioning
          to: orbit-raise
          label: health nominal
        - from: orbit-raise
          to: meo-operations
          label: MEO insertion
        - from: meo-operations
          to: deorbit
          label: mission complete / fuel reserve
    approximationNotes: >-
      Orbit raise duration (<90 days) is company-stated based on ground test performance; in-orbit confirmation pending
      GRAVITAS mission data.
    claimRefs:
      - CE004
      - CE005
      - CE011
      - CE016
      - CE020
      - CE039
