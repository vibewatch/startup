figures:
  - id: FO001
    title: Company Milestone Timeline
    type: timeline
    layout: wide
    summary: >-
      K2 Space's progression from founding to first on-orbit mission spans four years, with financing rounds, technical
      milestones, and customer anchors compressing what typically takes a decade in satellite manufacturing.
    data:
      items:
        - date: '2022'
          label: Founded
          detail: Karan and Neel Kunjur establish K2 Space in Torrance, California.
          tone: positive
        - date: 2023-Q4
          label: Series A ~$50M
          detail: Altimeter Capital and First Round Capital lead initial institutional round.
          tone: positive
        - date: 2024-12
          label: STRATFI $60M contract
