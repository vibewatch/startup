      - number: '8.3'
        title: Bull, Base, and Bear Scenario Analysis
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis for K2 is necessarily assumption-heavy given the absence of disclosed revenue, margins,
              and cap structure. The three scenarios below are anchored to publicly confirmed data points — the $500
              million contract backlog, the SES 28-satellite order, the STRATFI-funded GRAVITAS mission, and the $15
              million per-satellite price — and then layered with plausible range assumptions for delivery cadence,
              additional contract wins, and market multiple evolution.


              The bull case assumes GRAVITAS executes flawlessly, completing the LEO-to-MEO orbit raise by late 2026,
              demonstrating the 20 kW Hall-effect thruster and radiation-tolerant avionics in a harsh MEO environment,
              and validating the multi-orbit platform for commercial operators. In this scenario, the SES meoSphere
              order for 28 satellites begins deliveries in 2029 and the constellation reaches initial operational
              capability by 2030. DoD customers expand their commitments beyond the STRATFI framework, adding two or
              more constellation programs. K2 raises a Series D at a $5–7 billion pre-money in 2027 and files for IPO in
              2028–2029 at an 8–15x forward revenue multiple, implying a $6–10 billion market capitalization on $600–700
              million in annual revenue. Series C investors entering at $3 billion face approximately 2–3x gross return
              over a 4–5 year hold, subject to dilution.


              The base case assumes GRAVITAS completes its primary mission goals with minor anomalies, validates the
              platform adequately for commercial sales, and the SES order proceeds on schedule but with modest delays.
              K2 wins one or two additional constellation orders from government or commercial customers, ramps
              manufacturing to approximately 20–30 satellites per year by 2028, and raises a Series D at approximately
              $4–5 billion. An IPO or M&A event becomes feasible in 2029–2030 at roughly $3–5 billion enterprise value,
              depending on margin attainment. Series C investors at $3 billion are roughly flat-to-1.5x, with the
              outcome highly sensitive to dilution from the Series D and any convertible debt instruments.


              The bear case is triggered by partial or full GRAVITAS mission failure, SES renegotiating or deferring the
              meoSphere order pending on-orbit validation, or a materially adverse DoD budget environment. In this
              scenario, K2 must raise a bridge at a discount to the Series C valuation — a "down-round" at $1.5–2.5
              billion — impairing earlier investors, creating anti-dilution ratchets, and reducing common equity value
              substantially. The SES order is not yet formally confirmed as a signed backlog addition, creating
              near-term risk. Payload Space's framing of the $3 billion valuation as occurring "before ever launching a
              satellite" captures the fundamental uncertainty embedded in the current price.
            claimRefs:
