            body: >-
              As of June 2026, SES's initial order of 28 Mega Class platforms for the meoSphere constellation is the
              sole confirmed commercial demand anchor for K2's high-power bus. The implied contract value (~$420M at
              $15M/bus) is material, but full meoSphere deployment targets 2030, spanning a multi-year delivery
              schedule. Investor confidence in the TAM narrative depends heavily on whether a second commercial operator
              places an order before the SES program is complete.
