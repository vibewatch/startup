        - id: manufacturing
          label: In-House Manufacturing (75% vertical integration)
          detail: >-
            K2 manufactures reaction wheels, flight computers, solar arrays, and Hall-effect thrusters. Lead time <3
            months claimed.
        - id: payload-integration
          label: Payload Integration and Testing
          detail: Customer payload integrated into K2 bus at Torrance. Gravitas flew 12 undisclosed payload modules.
        - id: launch
          label: Launch (SpaceX Falcon 9, ~$7.2M/sat)
          detail: >-
            Launch is separate from bus cost. At current Falcon 9 customer rates, adds ~$7.2M per satellite. Giga Class
            requires Starship (unavailable as of mid-2026).
        - id: delivery
          label: On-Orbit Delivery and Operations Handover
          detail: >-
            K2 performs orbit raise (LEO to MEO in <90 days) using 20 kW Hall thruster. Customer assumes operations
            post-delivery.
        - id: revenue
          label: Revenue Recognition (Timing Undisclosed)
          detail: >-
            K2 does not disclose whether revenue is recognized at contract signing, milestone completion, or on-orbit
            delivery. No audited financials available.
        - id: gross-profit
          label: Gross Profit (Margin Undisclosed)
          detail: >-
            Gross margin not disclosed. Public-comp satellite manufacturer Rocket Lab generated ~20–35% gross margin on
            product revenue in FY2025.
