      - number: '7.2'
        title: Technical Execution and Manufacturing Scale-Up Risk
        blocks:
          - type: paragraph
            body: >
              K2 Space's competitive thesis rests on engineering claims that have never been validated at production
              scale: a 20 kW Hall-effect thruster flying in MEO (first of its kind), twin 10 kW solar arrays,
              radiation-tolerant avionics for multi-year MEO operations, high-voltage power systems, and a bus
              architecture interoperable across LEO, MEO, and GEO without orbit-specific redesign. Gravitas (launched
              March 30, 2026 on SpaceX Transporter-16) is the first integrated flight of all these subsystems
              simultaneously, compressing what traditional programs spread across three to five qualification missions
              into a single platform demonstration. This "test everything at once" approach is a deliberate risk
              trade—it accelerates the schedule but converts any single subsystem failure into a mission-level failure
              that delays customer deliveries and revenue recognition. The 80% vertical integration model—reaction
              wheels, flight computers, avionics, thrusters, and solar arrays built in-house—reduces supplier
              dependencies but concentrates manufacturing risk: a design defect or tooling failure propagates across
              every unit in the production run. K2's 180,000 sq ft Torrance factory is sized for 100 satellites per
              year, but the company has never manufactured more than one fully integrated satellite. Scaling from 1 to
              10 to 100 units involves supply chain qualification, workforce expansion, process repeatability
              challenges, and quality-assurance infrastructure that typically take years for established satellite
              manufacturers. The Trinity mission (three satellites on a single 2027 Falcon 9) is the next critical scale
              demonstration, but manufacturing three high-power buses in parallel under commercial and government
              scrutiny substantially increases execution risk relative to Gravitas.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR002
            claimRefs: []
      - number: '7.3'
        title: Launch Dependence, Orbit-Raise, and Propulsion Risk
        blocks:
          - type: paragraph
            body: >
              K2 Space's commercial model is structurally dependent on launch vehicle availability in two time horizons.
              In the near term (2026–2028), the Mega-class strategy relies on SpaceX Falcon 9 rideshare slots: Gravitas
              flew on Transporter-16, Trinity is contracted on a 2027 Falcon 9, and the planned 2026–2028 multi-mission
              cadence requires repeated rideshare slots at competitive prices. SpaceX commands over 60% of global
              rideshare capacity, and schedule slippage—illustrated by multiple delays to other rideshare missions
              listed on the SpaceflightNow launch manifest—can cascade into delayed payload delivery, customer
              dissatisfaction, and lost revenue. In the long term (post-2028), the Giga-class platform (100 kW per
              satellite) is explicitly sized for Starship or New Glenn super-heavy lift; if Starship commercial payload
              services are delayed beyond 2028–2029 or prove more expensive than modeled, the Giga-class program faces
              either schedule delay or redesign. That heavy-lift optionality became visibly more fragile after Blue
              Origin's May 28, 2026 New Glenn explosion damaged Launch Complex 36, the company's only operational pad,
              leaving customers without a near-term alternate launch site even though management still targeted a return
              to flight before year-end. Orbit-raise propulsion introduces a compounded technical risk: Gravitas relies
              on the 20 kW Krypton-fed Hall-effect thruster to transit from LEO to MEO in under 90 days, traversing the
              Van Allen radiation belts—the highest-flux region for trapped energetic electrons and protons in the
              Earth-Moon system—for weeks. This is the first commercial attempt to transit the Van Allen belts under
              electric propulsion at 20 kW; thruster erosion, unexpected plasma-surface interactions, and solar array
              degradation during the traverse are all plausible failure modes with limited public engineering precedent.
              K2 uses just 35% of propellant for the orbit raise, preserving margin for on-orbit maneuvers, but the
              transit itself exposes the satellite to cumulative radiation doses that may shorten component lifetimes
              below the planned 10-year mission life. As of the runDate (June 14, 2026), the orbit raise is in progress
              (Gravitas launched March 30) and its outcome has not been publicly confirmed as complete.
            claimRefs:
