        title: Exhibits
        blocks:
          - type: callout
            title: Record-setting propulsion enables first-of-kind multi-orbit deployment model
            body: >
              K2's 20 kW Krypton-fed Hall-effect thruster—the most powerful ever flown in space and 4× the power of any
              prior flown Hall thruster—is the technical foundation that makes K2's cost model work. By launching 10
              Mega satellites per Falcon 9 to LEO (rather than one or two per dedicated MEO launch) and self-raising
              with the Hall thruster in under 90 days, K2 achieves 4× deployment density per launch. This is not a
              marginal improvement; it is a structural change to MEO constellation economics that competitors without an
              equivalent thruster cannot replicate today.
            calloutType: strength
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
          - type: callout
            title: Giga Class commercial viability contingent on two unproven dependencies
            body: >
              Giga Class—K2's largest revenue opportunity—requires both (1) commercial availability of super-heavy lift
              vehicles (Starship / New Glenn) at prices that close orbital compute economics, and (2) demonstrated
              commercial demand for orbital compute at scale. Both remain unproven as of mid-2026. Industry critics
              including Varda Space analysts and University of Hong Kong researchers argue that orbital compute
              economics do not close at current launch prices; Giga's business case therefore rests on a dual dependency
              that neither K2 nor any other company controls.
            calloutType: risk
            claimRefs:
              - CE007
              - CE030
              - CE031
              - CE035
              - CE036
          - type: callout
            title: Verify long-duration MEO performance before underwriting Mega constellation contracts
            body: >
              GRAVITAS represents K2's first full system test in orbit, and the LEO-to-MEO orbit raise is still in
              progress as of June 2026. Before treating Mega Class performance as fully de-risked, investors and
              procurement officers should seek GRAVITAS mission data covering the complete orbit raise, initial MEO
              operations, payload performance, and thruster health telemetry. SES's 28-satellite order and any
              government constellation contract represent significant commitments against a platform with less than 12
              months of on-orbit history.
