      - number: '5.5'
        title: Trust, Safety, and Technical Risk Profile
        blocks:
          - type: paragraph
            body: |
              K2's risk profile stems from three primary areas: mission heritage depth, technology
              novelty, and commercial market uncertainty. As of June 2026, the company's in-space
              heritage consists of one hosted-payload demonstration (January 2025) and one full satellite
              launch (GRAVITAS, March 2026). While both milestones are operationally significant, full
              system heritage across extended LEO-to-MEO orbit raise, long-duration MEO operations, and
              radiation-induced avionics degradation over a 10-year mission life remains unverified. The
              20 kW Hall thruster—the most powerful ever flown—has been ground-tested and is now operating
              in orbit, but its long-term erosion characteristics and sustained on-orbit efficiency remain
              open questions. K2's autonomous Rust-language orbit-raise GNC algorithm is novel; no
              independent safety analysis has been publicly disclosed.

              On the commercial market side, the orbital compute use case that underpins the Giga Class
              roadmap faces substantial skepticism. Industry analysts at Varda Space Industries calculate
              orbital compute costs at approximately 3× more per watt than terrestrial equivalents at
              current launch prices. Quentin A. Parker of the Laboratory for Space Research at the
              University of Hong Kong has stated that K2's orbital compute thesis "doesn't really stand up
              to scrutiny" when subjected to rigorous cost analysis. OpenAI co-founder Sam Altman has
              dismissed the concept as premature. K2's counter-argument—that vacuum cooling and 8× higher
              solar exposure reduce energy costs by 15× versus terrestrial—narrows but does not eliminate
              the economic gap.

              On the government compliance side, K2's $60 million STRATFI award and OPIR/SMI participation
              provide validation of mission quality, but government programs also impose stringent ITAR
              controls, schedule accountability, and quality-management requirements. The company has not
              publicly disclosed quality certifications (AS9100, CMMI, or equivalent) or independent audit
              results. K2's GitHub organization has only one forked repository with minimal recent activity,
              confirming that K2 has no public software developer community surface—appropriate for a
              hardware company but limiting external validation of its software stack.
            claimRefs:
              - CE030
              - CE031
              - CE032
              - CE033
              - CE034
              - CE035
              - CE036
