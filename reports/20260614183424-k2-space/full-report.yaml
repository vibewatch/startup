      - number: '7.6'
        title: Competition, Disclosure Opacity, and Mission Assurance
        blocks:
          - type: paragraph
            body: >
              K2 Space's principal competitive risk is not the incumbent prime contractors (Boeing, Northrop, Thales,
              Airbus) who remain wedded to cost-plus exquisite satellite programs, but rather adjacent new-space
              platform builders that are simultaneously winning defense satellite contracts. SpaceNews confirmed in June
              2026 that Rocket Lab won a parallel bus supplier role in PTS-G through the Viasat team—placing Rocket Lab
              in direct competition with K2/SES for future government satcom orders. As the commercial high-power
              satellite bus market develops, other manufacturers with existing launch vehicle relationships or heritage
              programs may replicate K2's multi-orbit bus concept with lower execution risk. The structural risk of the
              contrarian "bigger satellite" thesis is that Starship's opening of affordable super-heavy lift will
              benefit all manufacturers equally, potentially reducing K2's first-mover advantage if the company does not
              achieve its production ramp before well-capitalized competitors enter. On disclosure, K2 remains a private
              company with no public financial statements, no disclosed burn rate, no revenue recognition schedule, and
              no detail on contract milestones or payment triggers. The $500 million "signed contracts" figure does not
              distinguish binding orders from letters of intent, or milestone-based payments from fixed commitments,
              leaving investors and customers unable to independently verify financial health. Mission assurance risk is
              similarly opaque: the Gravitas orbit raise—traversing the Van Allen belts for up to 90 days—tests
              subsystem reliability in the harshest radiation environment available in Earth orbit without prior
              on-orbit heritage for the integrated 20 kW platform. A failure during orbit raise would set back K2's
              entire commercial and government schedule by 12–18 months, the minimum time to build, test, and launch a
              replacement satellite.
            claimRefs:
