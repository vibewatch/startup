          label: Government or Commercial Customer
          detail: >-
            US Space Force, SES, or undisclosed constellation operators. Customer brings own payload; K2 supplies the
            bus.
        - id: contract
          label: Contract Signing ($15M/sat list)
          detail: >-
            Customer commits to satellite purchase. Actual payment milestones, downpayments, and cancellation provisions
