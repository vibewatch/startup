  - id: TR002
    title: Operational and Technical Risk Register
    columns:
      - Failure Mode
      - Likelihood
      - Severity
      - Mitigation Maturity
      - Residual Exposure
      - Unresolved Gap
    rows:
      - - Hall-effect thruster failure or underperformance during LEO-to-MEO transit
        - Medium
        - Critical
        - Ground hot-fire at 20 kW validated; no prior in-space operation at full power in MEO environment
        - Orbit raise failure = mission loss; 12–18 month delay to next satellite delivery
        - Confirm Gravitas orbit-raise completion; request thruster operating hours and erosion data
      - - Radiation-induced electronics failure in Van Allen belts during transit
        - Medium
        - Critical
        - Radiation-tolerant avionics designed for MEO; heritage from Jan 2025 LEO component demo
        - First full system in Van Allen transit; cumulative dose exposure unvalidated at system level
        - Request TID/SEE test reports for each avionics subsystem; confirm shielding margins
      - - Manufacturing defect propagating across multi-unit production run
        - Low-Medium
        - High
        - 80%+ in-house; quality-control process maturity unknown at multi-unit scale
        - Single-design-defect could affect multiple satellites simultaneously
        - Request quality management system certification (AS9100); audit production process controls
      - - Solar array deployment failure or power degradation in MEO radiation
        - Medium
        - High
        - Twin 10 kW arrays tested in ground environment; first in-space deployment on Gravitas
        - Power loss reduces payload capacity, orbit-raise speed, and mission duration
        - Confirm in-space deployment status on Gravitas; request beginning-of-life vs end-of-life power margin data
      - - Supply disruption for Krypton propellant (Hall-effect thruster feedstock)
        - Low
        - High
        - Krypton is commercially available industrial gas; no documented sole-source dependency
        - Limited historical precedent for Krypton supply constraints in space applications at scale
        - Identify Krypton supply contracts; confirm multi-supplier strategy for constellation-scale demand
      - - Radiation-tolerant ASIC or space-qualified component shortfall
        - Low-Medium
        - Medium
        - Space-qualified electronics supply has known lead-time constraints (12–24 months)
        - Production ramp to 100 satellites/year may outstrip current radiation-tolerant IC supply
        - >-
          Request bill-of-materials for space-qualified long-lead items; confirm purchase order status for 2027
          production
    notes: >
      Likelihood and severity assessments are based on industry benchmarks for first-flight integrated satellite
      platforms and available public disclosure. Mitigation maturity reflects K2's own disclosures; independent
      technical assessment not possible without access to test reports.
