  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Capital Intensity and Financial Risk
        blocks:
          - type: paragraph
            body: >
              K2 Space entered June 2026 with more than $450 million raised across five funding rounds and $500 million
              in signed contracts, yet the company has generated no reported operating revenue from satellite
              manufacturing. The $3 billion Series C valuation—struck in December 2025 before the first operational
              satellite had flown—implies an enterprise value roughly 30–50× any reasonable near-term revenue estimate,
              placing enormous execution weight on the 2026–2028 mission sequence. Manufacturing a satellite business at
              scale is acutely capital-intensive: raw materials, radiation-hardened components, propulsion consumables
              (Krypton), cleanroom operations, launch slots, and ground support infrastructure each carry
              multi-million-dollar line items per unit. K2's stated $15 million price point per Mega-class bus—and
              planned output of 100 satellites per year—implies annual revenues of approximately $1.5 billion at full
              rate, but that rate requires commensurately large working capital, and the company has not disclosed burn
              rate, gross margins, or cash runway. The Series C was led by Redpoint with participation from T. Rowe
              Price, Hedosophia, Altimeter, Lightspeed, and Alpine Space Ventures; no lenders or non-dilutive financings
              beyond STRATFI matching funds have been publicly disclosed, concentrating refinancing risk in venture
              markets that have shown stress on late-stage space hardware companies since 2023. Capital calls to reach
              production scale before SES milestone payments arrive could require a Series D at terms that are dilutive
              or unavailable in a risk-off environment.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
