      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Vertical integration creates a defensible manufacturing cost and lead-time moat
            body: >-
              By building approximately 80% of satellite components in-house—including the world's most powerful
              commercial Hall-effect thruster, reaction wheels, flight computers, and solar arrays—K2 Space achieves
              ~$15M per satellite pricing and under-three-month delivery windows that are structurally unavailable
              through the traditional vendor supply chain. This is the primary basis for the company's pricing
              differentiation and the SES meoSphere order.
            calloutType: strength
            claimRefs:
              - CO011
              - CO013
              - CO015
              - CO016
              - CO021
          - type: callout
            title: SES meoSphere and PTS-G anchor multi-orbit strategy and 2026–2030 production cadence
            body: >-
              An order for 28 Mega Class satellites for the SES meoSphere constellation, combined with K2 Space's
              selection as bus supplier for the PTS-G GEO defense program, gives the company production visibility
              across LEO, MEO, and GEO within four years of founding. The combination of a named commercial operator and
              a DoD program validates the multi-orbit strategy and provides a production anchor that de-risks the
              near-term factory ramp-up.
            calloutType: strength
            claimRefs:
              - CO018
              - CO019
              - CO031
          - type: callout
            title: 80% in-house component manufacturing amplifies failure propagation risk at production scale
            body: >-
              TechCrunch noted in March 2026 that building 85% of satellite components in-house means any supply chain
              disruption or design fault propagates broadly across the satellite bus. This concentration lowers costs
              but concentrates quality risk on K2's own manufacturing capability, which has not yet been stress-tested
              at the production cadence implied by the 28-satellite SES order. GRAVITAS results will be the first
              meaningful data point on on-orbit performance of a fully K2-built platform.
            calloutType: risk
            claimRefs:
              - CO015
              - CO033
              - CO038
          - type: callout
            title: Giga Class roadmap depends on Starship cost reductions not yet available
            body: >-
              K2's founding thesis included the assumption that Starship would reduce launch costs from ~$7.2M per
              manifest slot on Falcon 9 to ~$600K. The Giga Class 100 kW platform is designed for this future launch
              economics context. Until Starship offers reliable, affordable commercial rideshare, the Giga Class product
              line remains contingent on a development outcome outside K2's control. The Mega Class remains commercially
              viable on existing launch vehicles, but the long-term roadmap depends on SpaceX execution.
            calloutType: risk
            claimRefs:
              - CO025
              - CO033
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: >-
              K2 Space's relevant market is specifically the segment of the satellite bus and platform market that
              demands high onboard power (in the 10–20 kW range) and multi-orbit capability spanning LEO, MEO, and GEO.
              This is deliberately narrower than the overall satellite manufacturing industry or the broader space
              economy. The market boundary includes: revenue from high-power satellite bus platforms sold to commercial
              operators (broadband, communications, Earth observation) and government/defense customers (Space Force,
              SDA, allied governments) for missions that benefit from significantly higher power-to-cost ratios than
              current small satellite offerings. Excluded from this market are: small satellite buses below ~2 kW (York
              Space, Terran Orbital, D-Orbit class products), launch vehicle revenue, ground segment equipment,
              satellite services revenue, and traditional cost-plus GEO comsats priced above $200M per unit that K2 is
              not directly substituting.

              K2's market definition rests on a core orbit-economics argument: its CEO has stated that 150 LEO
              satellites are equivalent in coverage to 50 MEO satellites, implying a 3:1 efficiency advantage that makes
              MEO economically rational when per-satellite cost drops to the $15M level. The status-quo substitutes
              include both legacy large GEO buses (Boeing BSS-702, Airbus Eurostar, Northrop GeoStar), which cost
              $150–300M per unit at the high end, and proliferated LEO constellations with hundreds of small satellites
              requiring many launches. Neither substitute directly addresses the high-power MEO/mid-orbit band that K2
              is targeting. The adjacent market is the space-based compute and hosted-payload segment, where K2's
              Gravitas mission carried 12 national security and commercial payloads, including what ByteIota
              characterized as orbital data center experiments, though that application remains commercially unproven
              and highly contested among independent analysts.

              The market is genuinely early-stage. Only SES's O3b mPOWER system currently operates a MEO broadband
              constellation, running approximately eight satellites at ~8,000 km altitude. K2 argues the meoSphere
              partnership (28 initial satellites) validates a new generation of proliferated MEO demand that the
              existing market has not served. The key market assumption requiring diligence is whether multiple
              commercial operators beyond SES will fund MEO constellations, or whether SES remains the only anchor
              customer for an extended period.
