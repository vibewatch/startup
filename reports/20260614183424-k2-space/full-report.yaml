      - number: '5.2'
        title: Core Technology Stack
        blocks:
          - type: paragraph
            body: |
              K2's technology differentiation rests on five proprietary subsystems: electric propulsion,
              high-power solar arrays, radiation-tolerant avionics, thermal management, and an autonomous
              onboard software stack—all designed and built in-house at the Torrance facility.

              Electric propulsion is the keystone. The 20 kW Krypton-fed Hall-effect thruster is the most
              powerful ever flown in space—approximately four times more powerful than any prior flown
              Hall-effect thruster—and was successfully hot-fired at full power in July 2025 at K2's custom
              propulsion test chamber in Torrance, one of the world's largest such facilities. K2 chose
              Krypton rather than conventional Xenon because Krypton offers higher density, lower cost, and
              acceptable ionization efficiency for high-power regimes. In orbit, the thruster enables the
              Mega satellite to raise from LEO to MEO in under 90 days using only 35% of its total propellant
              load, leaving ample margin for extended MEO station-keeping over a 10-year design life.

              The solar array system deploys twin 10 kW panels (20 kW total on Mega; 110 kW on Giga),
              designed with a high-voltage architecture to minimize ohmic losses at high current levels. The
              radiation-tolerant avionics suite—validated in-space in January 2025 aboard a D-Orbit ION
              Satellite Carrier—includes a flight computer, reaction wheel, motor controller, and embedded
              flight software, all optimized for the intense particle radiation of MEO. K2's autonomous
              software stack, written in the Rust programming language, handles onboard radiation recovery,
              mission-data processing, and guidance-navigation-control (GNC) for multi-orbit operations.
              Thermal management handles double-digit kilowatt heat flux across LEO, MEO, and GEO orbital
              environments.
