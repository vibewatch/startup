      - number: '2.3'
        title: Buyer and Segment Map
        blocks:
          - type: paragraph
            body: >-
              K2 Space sells into three distinct buyer segments, each with different budget owners, adoption triggers,
              and procurement timelines. The first and largest confirmed segment is commercial broadband/communications
              operators, primarily represented by SES. SES placed the 28-satellite meoSphere order after completing the
              Intelsat acquisition (combined revenue approximately €3.5B annually), shifting its procurement to an
              iterative model rather than multi-year batch satellite programs. The buyer at SES is the CEO and network
              strategy team; the technical decision-maker is the network architecture group; the budget source is
              capital expenditure for next-generation infrastructure. SES CEO Adel Al-Saleh stated in September 2025
              that "we can't have five-to-seven-year development cycles" and described pathfinder missions as a new
              procurement model. This represents a structural shift in how large operators buy satellites — favoring
              agile, iterative commitments over massive waterfall procurements.

              The second segment is U.S. government and defense. The SDA is the most active buyer signal, with the PWSA
              program funding 72 Tracking Layer Tranche 3 satellites for $3.5B in December 2025. K2 received a $60M
              STRATFI contract under SpaceWERX for the Gravitas mission, and management has cited Golden Dome missile
              defense architectures as a future opportunity. The buyer at the DoD is program offices within the Space
              Force, SDA, and Air Force Research Laboratory; budget authority runs through the FYDP and STRATFI/SBIR
              programs. K2's head of strategy, Dr. John Plumb (former Pentagon space policy chief), has stated that
              "both government and commercial partners are demanding more power, more capability, and lower cost." The
              third segment, smaller and less defined, is allied and sovereign government operators seeking independent
              broadband and surveillance constellations. Geopolitical disruptions (cited by Telesat CEO as "the biggest
              commercial opportunities for Telesat and the rest of us") are accelerating sovereign demand for dedicated
              space infrastructure. SES's meoSphere is also designed to support sovereign government applications with
              military Ka-band capacity and dedicated waveforms. These sovereign operators could become future K2 bus
              customers through their satellite operator intermediary.
