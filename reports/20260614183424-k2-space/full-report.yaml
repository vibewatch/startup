      - number: '7.5'
        title: Regulatory, Export Control, and Legal Risk
        blocks:
          - type: paragraph
            body: >
              Satellite manufacturing and operations for US defense customers places K2 Space squarely within the
              International Traffic in Arms Regulations (ITAR), administered by the State Department's Directorate of
              Defense Trade Controls (DDTC). K2's satellites—particularly those carrying national security payloads
              under the STRATFI, PTS-G, and OPIR programs—are classified as defense articles under USML Category XV
              (spacecraft systems and associated equipment), restricting foreign national access to manufacturing
              facilities, technical data, and hardware without a license or applicable exemption. SES is headquartered
              in Luxembourg and listed on the Euronext Paris exchange; the meoSphere partnership requires a
              government-to-government agreement or individual export license from the State Department for every
              technology transfer, technical meeting with foreign personnel, and shipment to a non-US jurisdiction.
              Processing delays, license denials, or inadvertent disclosures can pause customer programs. FCC
              authorization for spectrum and orbital slots adds another regulatory layer; K2 has not publicly disclosed
              its FCC license filings, coordination status with international operators, or ITU filing positions for
              meoSphere's planned MEO slots at ~8,000 km. No litigation, regulatory citations, or enforcement actions
              against K2 Space have been identified in public records as of the runDate, but the company's rapid growth
              and classified program involvement create compliance surface area that will expand with each new
              government award.
            claimRefs:
