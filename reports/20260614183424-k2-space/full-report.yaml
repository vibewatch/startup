  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing Context and Capitalization
        blocks:
          - type: paragraph
            body: >-
              K2 Space has raised capital through six distinct rounds since its 2022 founding, accumulating over $450
              million in equity financing. The earliest tranches — $8 million pre-seed in June 2022 and $8.5 million
              seed in June 2023 — were backed by First Round Capital, Republic Capital, and a cohort of specialist
              space-economy funds including Countdown Capital, Boost VC, and Alpine Space Ventures. The $50 million
              Series A in February 2024 brought in Altimeter Capital and expanded Alpine's position, funding the initial
              factory build-out in Torrance, California and core subsystem development.


              The inflection came in February 2025 with the $110 million Series B, co-led by Lightspeed Venture Partners
              and Altimeter Capital, announced coincidentally with K2's first successful in-space component
              demonstration. At that stage, the company had booked over $50 million in government and commercial
              contracts and was scaling from 25 to 90 employees. No public post-money valuation was disclosed for the
              Series B; the $110 million raise on those contract metrics implies a Series B valuation that industry
              analysts might estimate at $500 million–$1 billion.


              The pivotal event for valuation purposes is the December 11, 2025 Series C: $250 million at a $3 billion
              pre-money valuation, led by Redpoint Ventures with participation from T. Rowe Price Associates,
              Hedosophia, Altimeter Capital, Lightspeed Venture Partners, and Alpine Space Ventures. The round closed
              roughly three months before K2's first full satellite launch (GRAVITAS on SpaceX Transporter-16 in March
              2026), representing one of the largest pre-first-launch valuations in satellite manufacturing history. The
              $3 billion mark followed $500 million in signed contracts across commercial and U.S. government customers,
              giving the Series C a contract-backlog-to-valuation multiple of approximately 6x — a ratio consistent with
              high-growth hardware companies but demanding for a firm that had not yet delivered a complete satellite at
              time of closing.


              The dilution path forward is unknown: K2 has not disclosed its cap table, preference stack, liquidation
              preferences, or option pool. Assuming a typical late-Series-C preference structure, common equity
              investors face multiple layers of liquidation preference that could materially reduce distributions in any
              downside exit. The total raised as of June 2026 is $450 million plus, which is significant relative to the
              $3 billion post-money, implying equity ownership concentration among the institutional Series A–C
              investors.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
