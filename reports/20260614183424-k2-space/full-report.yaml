      - number: '7.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Orbit-Raise Completion Is the Near-Term Thesis Test
            body: >
              As of June 14, 2026, Gravitas (launched March 30) is still executing its 90-day LEO-to-MEO orbit raise
              using the 20 kW Hall-effect thruster—the first such maneuver ever attempted at this power level through
              the Van Allen radiation belts. If orbit insertion is confirmed by late June–July 2026 with full thruster
              and avionics health, it substantially de-risks the SES meoSphere schedule, PTS-G supplier role, and Series
              D fundraising. A failure or partial success at this juncture would trigger a thesis re-evaluation across
              all three dimensions simultaneously.
            calloutType: risk
            claimRefs:
              - CR015
              - CR016
              - CR017
              - CR022
          - type: callout
            title: SES Concentration Is Both the Biggest Opportunity and the Biggest Risk
            body: >
              SES's 28-satellite initial order represents the largest commercial satellite manufacturing commitment ever
              announced for a startup. It validates K2's technical roadmap and provides a production ramp rationale. But
              SES's explicit framing—"iterative, agile, and developmental"—means the full constellation is not yet
              binding. SES CEO Al-Saleh stated the company will "adjust both from a volume point of view" based on
              market needs, introducing a real option for SES to scale back the order that has no equivalent option for
              K2.
            calloutType: risk
            claimRefs:
              - CR021
              - CR022
              - CR023
              - CR024
          - type: callout
            title: ITAR Constrains the International Upside
            body: >
              K2's growth thesis requires scaling from US government and SES to a broader commercial customer base. ITAR
              constraints on spacecraft with national security payload heritage severely limit K2's ability to sell
              buses to non-US-treaty-aligned commercial operators without State Department licensing, which can take
              60–120 days per transaction and is not guaranteed. This creates structural friction in international
              market expansion and effectively caps K2's addressable market until it establishes a clear product
              segmentation between ITAR-controlled defense buses and commercial-only platforms.
            calloutType: insight
            claimRefs:
