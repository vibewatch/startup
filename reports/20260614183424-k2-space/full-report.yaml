            body: >-
              K2 Space has raised equity across five rounds since founding. The funding chronology (detailed in the
              Company Overview chapter) culminates in a $250M Series C closed December 11, 2025 at a $3B post-money
              valuation, led by Redpoint with participation from accounts advised by T. Rowe Price Associates,
              Hedosophia, Altimeter Capital, Lightspeed Venture Partners, and Alpine Space Ventures. Total equity
              funding exceeded $450M after the Series C. The Series B ($110M, February 2025) was co-led by Lightspeed
              and Altimeter; the prior rounds total approximately $66.5M across pre-seed, seed, and Series A.

              K2 planned to use Series C proceeds to scale manufacturing at its 180,000 sq ft Torrance, California
              facility, which is designed to produce up to 100 high-power satellites per year. At $15M per satellite and
              full utilization, this equates to a theoretical annual revenue capacity of $1.5B. However, the company has
              not publicly disclosed the capital expenditure required to reach full-rate production, current factory
              utilization, or production throughput as of mid-2026. The factory represents a substantial fixed-cost
              base; K2 described it as already open and operational, with ramp-up investment contingent on Mega Class
              launch success.

              Monthly burn rate, cash balance, and runway are not disclosed. At a 150+ person headcount (estimated from
              the SVIC profile as of December 2025) and an aerospace manufacturing cost structure, monthly burn is
              estimated in the $8M–$18M range (inferred from analogous early-stage satellite manufacturers), implying a
              multi-year runway from the combined Series B and C raises if burn is not dramatically accelerated.
              However, this is an analyst estimate with no primary-source backing; the actual burn and runway require
              private diligence.

              The STRATFI program's 50/50 structure (government + venture co-investment) is notable as a non-dilutive
              capital mechanism that partially funded the Gravitas mission without additional equity, supplementing the
              core venture capital structure. SES has stated that its meoSphere initiative is included in its
              "previously announced full-year 2026 capex," suggesting SES is funding its portion of the development, but
              the allocation of manufacturing cost and payment milestones between SES and K2 is not public.
