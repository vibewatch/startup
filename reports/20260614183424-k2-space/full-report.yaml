      - number: '8.5'
        title: Final Diligence Asks and Exit Readiness
        blocks:
          - type: paragraph
            body: >-
              The principal diligence gaps cluster around three areas: private financial opacity, cap structure
              unknowns, and on-orbit performance confirmation. K2 has not disclosed revenue, gross margin, operating
              burn rate, or cash position — information that is standard in any Series C-stage investment memo and
              essential for modeling capital adequacy through the Giga-class roadmap. Investors must request audited
              financial statements, board-approved projections, and a detailed cash runway analysis as pre-conditions
              for any committed capital.


              Cap table and preference stack diligence is equally critical. With $450 million raised across six rounds
              and a founding equity base that presumably includes substantial option grants, the actual common equity
              value available to Series C investors in various exit scenarios is unknown. A waterfall analysis covering
              liquidation preferences, anti-dilution provisions, and pay-to-play provisions across all prior rounds is
              essential. T. Rowe Price's participation — an institutional asset manager with liquidity requirements —
              may create pressure for an early liquidity event even if it is not in the best interest of common holders.


              On-orbit performance diligence should focus on the complete results of the GRAVITAS LEO-to-MEO orbit raise
              — specifically, the in-space efficiency and degradation of the 20 kW Hall-effect thruster, the solar array
              output after initial LEO radiation exposure, and the avionics performance over the full MEO transit. These
              data points will be the definitive validation or invalidation of the K2 platform thesis. Exit readiness is
              moderate: K2 has the profile and traction for a 2028–2030 IPO if execution holds, and is a potential
              strategic acquisition target for defense primes seeking vertical integration into high-power satellite
              manufacturing. No IPO or M&A activity has been announced or implied by the company.
            claimRefs:
              - CV036
              - CV037
              - CV040
              - CV044
