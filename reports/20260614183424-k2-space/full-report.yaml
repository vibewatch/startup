      - number: '2.2'
        title: Market Sizing — Multiple Lenses and Evidence Constraints
        blocks:
          - type: paragraph
            body: >-
              No independent analyst report isolates a TAM specifically for high-power satellite buses (>10 kW) in
              publicly accessible form. The Satellite Industry Association's State of the Satellite Industry Report
              provides a historical baseline: global satellite manufacturing revenues were $15.7B in 2013 and have grown
              since, but the SIA does not disaggregate by power class. The entire high-power segment is embedded within
              a broader market that includes all bus types across all orbits. Agent estimation, not primary source data,
              underlies any published SAM figure for K2's specific segment.

              Three lenses constrain the sizing exercise. The first lens is top-down from global satellite
              manufacturing. Using the SIA's historical baseline and an inferred market growth trajectory, total
              satellite manufacturing revenues are estimated to have reached approximately $20–25B globally by 2024–2026
              (agent estimate, no current primary source). If the high-power segment (roughly LEO constellations above 5
              kW plus MEO/GEO buses) represents 15–30% of that market, the high-power TAM ranges from approximately
              $3–7B annually. This estimate is flagged as low confidence due to the absence of an independent, current,
              segmented market report. The second lens is bottom-up from confirmed demand signals. SES placed an initial
              28-satellite order for the meoSphere constellation, implying approximately $420M in bus-contract value at
              K2's $15M stated price. The SDA awarded $3.5B for 72 Tracking Layer Tranche 3 satellites in December 2025,
              though those contracts are split among multiple vendors and represent more complex systems than K2's bus
              alone. K2 itself reports $500M in signed commercial and government contracts, spanning both bus sales and
              hosted payload arrangements. Extrapolating Payload Space's report that each Gravitas payload customer is
              "contemplating 10 to 50 satellites rolling out in 2027," a pipeline of 50–200 additional satellites is
              plausible but unconfirmed.

              The third lens is the factory capacity ceiling. K2's 180,000 sq ft Torrance facility is rated to produce
              100 high-power satellites annually. At the stated $15M price point, full production yields approximately
              $1.5B in annual revenue. This is a useful upper bound on K2's near-term serviceable obtainable market
              rather than a market-size figure. SAM and SOM remain difficult to isolate without analyst data on
              competing operator budgets, defense acquisition allocations, and the pace at which MEO constellation
              economics prove out post-Gravitas. Sizing diligence gaps are detailed in the evidence-gaps section.
            claimRefs:
