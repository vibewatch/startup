  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              K2 Space's primary revenue model is the sale of vertically integrated Mega Class satellite bus platforms
              to commercial and government customers. The company does not operate satellites or sell bandwidth; instead
              it designs, builds, and delivers the satellite platform on which customers host their own payloads. This
              bus-as-a-product model creates distinct revenue events: contract signing, production milestones, and
              on-orbit delivery. No public revenue figures have been disclosed; K2 is pre-production-revenue as of the
              canonical run date.

              The publicly stated list price for the Mega Class satellite bus is $15M per unit. This figure was cited in
              K2's own STRATFI press release (December 2024), corroborated by Payload Space reporting, the SpaceNews
              coverage of the SES partnership ("built for under $15 million each"), and the Advanced Television article
              confirming the K2 portion of each meoSphere satellite costs approximately $15M (€12.9M). CEO Karan Kunjur
              acknowledged that many in the industry called this price "impossible" for the stated capability, framing
              the Gravitas mission as the proof-of-concept for the pricing model.

              K2 achieves the $15M target by manufacturing approximately 75% of satellite components in-house, including
              reaction wheels, flight computers, solar arrays, and the 20 kW Hall-effect thruster. This vertical
              integration strategy reduces third-party margin stack and lead times to under three months per satellite.
              Launching on SpaceX Falcon 9 adds approximately $7.2M per satellite at customer rates (estimated from
              published Falcon 9 rideshare pricing), bringing the total delivered cost per satellite to roughly $22M
              before payload integration. For comparison, traditional mission-specific large satellites have
              historically cost $100M to $1B+ per unit. K2's Head of Strategy John Plumb stated publicly that for
              approximately $1 billion, K2 could deliver an entire constellation rather than a single traditional asset.

              Revenue recognition timing is unknown. K2 is likely to recognize revenue on milestone or delivery basis
              given the custom hardware and long lead nature of satellite manufacturing. No backlog aging, delivery
              schedule, or revenue recognition policy has been publicly disclosed.
