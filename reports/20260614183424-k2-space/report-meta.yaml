companyProfile:
  summary: >-
    K2 Space is a Torrance-based private satellite manufacturer founded in 2022 by brothers Karan
    and Neel Kunjur. The company is building high-power Mega Class satellites that target LEO,
    MEO, GEO, and future cislunar orbits, with a longer-term Giga platform sized for heavy-lift
    launch vehicles. Public evidence shows meaningful early validation: more than $450 million of
    equity financing, a $3 billion Series C valuation, more than $500 million in signed contracts,
    a March 2026 GRAVITAS launch, and a 28-satellite SES meoSphere order. The open question is not
    whether demand exists, but whether K2 can convert first-flight proof and contracted interest
    into repeatable manufacturing, delivered satellites, and durable economics before another major
    capital raise is needed.
  founders:
    - name: Karan Kunjur
      role: Co-founder and CEO
      background: Former SpaceX engineer; previously led an AI startup after a BCG career.
      claimRefs: [CO002, CO003]
    - name: Neel Kunjur
      role: Co-founder and CTO
      background: Former SpaceX engineer focused on Dragon avionics and mission systems.
      claimRefs: [CO002, CO003]
  foundingLocation: Torrance, California
  headquarters: Torrance, California
  productSummary: >-
    K2 sells high-power satellite platforms, led by the Mega Class bus with roughly 20 kW of power
    and 3,000 kg of payload capacity, plus a future Giga platform targeting 100 kW for the heavy-
    lift era. The proposition is a multi-orbit satellite architecture with vertically integrated
    propulsion, power, avionics, and manufacturing.
  customerFocus: >-
    Primary customers are national-security and civil-government buyers plus large commercial
    satellite operators that need higher-power, multi-orbit satellite buses. Named public proof is
    concentrated in the U.S. Space Force and SES.
  businessModel: >-
    The model is high-value satellite manufacturing: K2 wins mission contracts, hosted-payload
    demonstrations, and constellation bus orders, then monetizes platform production, integration,
    and follow-on deployment at industrial scale.
  stage: private, Series C / pre-scale manufacturing
  fundingStatus: >-
    K2 has raised more than $450 million across early rounds through a $250 million Series C closed
    in December 2025 at a $3 billion valuation. Public debt, project-finance, and preference-stack
    details are undisclosed.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO005, CO007, CO010, CO013, CO017, CE001, CE007, CU009, CU053]
