  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台定义与模块
        blocks:
          - type: paragraph
            body: >-
              Talkdesk 现在围绕客户体验自动化定义产品：专业 AI 智能体与人类员工在客户旅程中协同工作。在这次叙事转向之下，CX Cloud
              仍是核心企业平台，把自助服务、全渠道互动、员工队伍管理、员工协作和分析打包在一起。Autopilot 是旗舰 AI 虚拟助手，可以跨语音和数字渠道自主解决问题并触发工作流。Copilot 是 Talkdesk
              的实时座席助手，会推荐下一步动作、调取知识并总结互动。Navigator 和互动分析把 AI
              层从自助服务延展到路由、辅导和质量监督。平台明确是全渠道，公开材料提到语音、电子邮件、聊天、SMS、社交消息、移动应用触达和转真人座席。垂直云仍是产品策略关键，医疗、保险 / 金融服务、零售 /
              电商都有专属体验云。客户故事显示，产品价值往往来自多个模块一起打包，例如在同一部署中组合
              CXA、Copilot、Navigator、分析和行业云。因此，产品尽调不应只测试功能广度，还要验证这套技术栈能否在混乱企业工作流和受监管数据环境中可靠运行。
