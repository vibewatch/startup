              2021 年融资公告称，Talkdesk 在 2020 年员工数翻倍后，团队已接近 2,000 人。当前领导层页面称 Talkdesk 扩张到 1,500 多名员工，与一家大型全球私营 SaaS
              公司的劳动力规模大体一致。Munil Shah 负责产品、技术和客户运营，说明 Talkdesk 围绕 AI 部署采用产品、工程、客户一体化负责模式。公开可见的领导梯队还包括 CMO Neville
              Letzerich、CLO David Middler，以及负责全球人员与人才的 Shauna Geraghty。Talkdesk 董事会披露的现任董事包括 Tiago Paiva、Viking 董事总经理
              Brian Rose 和 Threshold 联合创始人 Josh Stein。合作伙伴生态以 Salesforce、AWS、Microsoft、Zoom 等大型战略盟友为中心。Talkdesk 称
              AppConnect 目前提供 80 多个市场产品；更广泛的合作伙伴网络还通过分销商覆盖 10,000 多个下游伙伴。
