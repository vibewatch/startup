      - number: '2.2'
        title: 市场规模口径与细分结构
        blocks:
          - type: paragraph
            body: >-
              Grand View Research 以早期 2021 年基数为起点，预测 CCaaS 市场到 2028 年达到约 $10.8 billion，CAGR 为 15.7%。Fortune Business
              Insights 估算 2024 年市场为 $6.08 billion、2032 年为 $24.45 billion，隐含 CAGR 19.0%。Strategic Market Research 估算 2024
              年市场为 $7.8 billion、2030 年为 $23.2 billion，隐含 CAGR 19.7%。Fortune 与 Strategic 的估算差距说明，TAM
              很大程度取决于品类定义和纳入的解决方案层。Strategic Market Research 称大型企业约占 2024 年 CCaaS 支出的 69.5%，强化了 Talkdesk
              的企业级取向。同一来源称，全渠道路由是最大解决方案池，约占收入 34.2%。在 Strategic 的 2024 年快照中，自助服务和 AI 机器人已占市场收入约 17.3%，说明 AI
              已不再是边缘功能。BFSI 在 Strategic 模型中是最大垂直行业，占 27.8%，之后是零售 23.6%、电信 19.4%、医疗 16.2%。北美在 Strategic 模型中仍是最大区域市场，占
              38.6%，欧洲 27.1%、亚太 24.8% 随后。Fortune Business Insights 另行强调，北美是关键地区，因为领先厂商和云采用集中在那里。整体市场证据支持 Talkdesk
              聚焦大型企业、全渠道、AI 加持和受监管行业部署，而不是商品化 SMB 电话系统。
