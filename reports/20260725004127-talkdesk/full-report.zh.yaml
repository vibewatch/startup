      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              AWS 将 Amazon Connect 定位为云原生联络中心，覆盖语音、聊天、任务、分析和生成式 AI 功能。Amazon Connect
              定价高度按用量计费，推动市场转向消费经济，而不是纯按命名席位收费。NICE 称 CXone 每年支撑 25 billion 次以上互动，体现全球企业买家要求的规模。Five9
              定价展示了一种套件架构，把数字渠道、AI、CRM 适配器和劳动力工具分层放入不同席位套餐。Genesys 定价现在把 AI experience tokens 和多项原生 AI 功能纳入标准版本，说明 AI
              正被捆入核心平台。EU AI Act 给 AI 系统增加更强治理层，也会抬高供应商自动化客户对话的合规工作量。HIPAA 云指南提高了涉及受保护健康信息的医疗部署门槛。FCC TCPA 框架以及
              BakerHostetler 2024 年关于拟议 AI 通话披露的文章显示，外呼语音 AI 面临明确监管摩擦。FTC 的 AI 门户显示，美国监管机构正在围绕 AI
              实践组织执法和指南，包括欺骗性或不安全部署模式。因此，合规、集成复杂度和数据安全不是边缘问题；在受监管垂直行业里，它们是一阶采用约束。由于公开市场估算差异很大，合理的尽调模型应使用区间，并保留相互矛盾的 TAM
              口径，而不是锚定一个巨大的单一市场数字。
