      - number: '5.2'
        title: 架构、开发者接口与依赖
        blocks:
          - type: paragraph
            body: >-
              Talkdesk 的集成层是重要产品资产，因为公司承诺连接 CRM、EHR、理赔、计费和第三方劳动力系统。AppConnect 市场开放 80 多个合作伙伴产品，说明 Talkdesk
              把扩展视为产品界面的一部分，而不只是实施附属项。Talkdesk 公开开发者门户和 API 参考文档确认，平台为用户、联系人、通话、录音、报告及其他可编程资源开放 API。API
              参考文档还说明，所有请求使用区域特定 base URL 和 OAuth
              2.0，指向具备受控访问模式的多区域企业架构。相比封闭套件厂商，这种开发者姿态是重要差异化，因为它降低了定制工作流和嵌入式自动化门槛。Talkdesk 当前产品运营模式是云原生，而非本地部署；信任页面和 CX
              Cloud 材料强调正常运行时间、分布式通信基础设施和远程运营。公司称 Data Cloud 会把转录、录音、案例备注和客户记录转成 AI
              智能体可用的实时知识，说明数据层是编排核心。这套架构高度依赖企业系统上下文，使集成和数据权利成为核心依赖，而不是边缘功能。开发者生态和市场给 Talkdesk
              更快扩展的选择权，但也带来合作伙伴依赖和质量控制挑战。因此，产品尽调不应只测试功能广度，还要验证这套技术栈能否在混乱企业工作流和受监管数据环境中可靠运行。
