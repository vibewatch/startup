      - number: '1.3'
        title: 融资历史、估值与当前规模信号
        blocks:
          - type: paragraph
            body: >-
              Talkdesk 2021 年 8 月完成 $230 million D 轮融资，估值超过 $10 billion。2021 年 D 轮引入 Whale Rock、TI Platform Management 和
              Alpha Square 等新投资方，也包括 Franklin Templeton、Viking Global 等老股东。D 轮公告发布时，Talkdesk 累计融资 $498 million。Nasdaq
              Private Market 和 GetLatka 都保留了更早的融资序列：$230 million D 轮之前，公司先完成 $143 million C 轮和 $100 million B 轮。Nasdaq
              Private Market 还记录了更早的种子轮和 A 轮融资，说明爆发式增长轮之前已有多轮风险融资。2026 年引用的第三方私募市场追踪平台仍把 Talkdesk
              描述为私营公司，而非上市发行人。VCBacked 和 Equitybee 显示 Talkdesk 在 2025 年新增约 $95 million 债务融资，尽管公开细节仍很少。GetLatka 估计
              Talkdesk 2024 年收入约 $420.1 million，2023 年约 $298 million。GetLatka 仍列示公司估值为 $10 billion、累计融资约 $508.5
              million，略高于 2021 年公布的 $498 million。Talkdesk 信任页面称平台获得 75 个国家 1,800 多家企业信任。2021 年 D 轮新闻稿也单独称，全球 1,800
              多家企业当时依赖 Talkdesk。CX Cloud 产品页面称 Talkdesk 服务 100 多个国家的企业客户，暗示其地域覆盖已超过信任页面提到的 75 个国家。
