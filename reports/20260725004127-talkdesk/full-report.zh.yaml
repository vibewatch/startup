    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、定位与平台范围
        blocks:
          - type: paragraph
            body: >-
              Tiago Paiva 赢下黑客松后，Talkdesk 于 2011 年创立；公司至今仍由他以创始人兼 CEO 身份掌舵。到 2026 年，Talkdesk 把自己定义为 AI
              优先的客户体验自动化公司，核心是人类员工与 AI 智能体组成的混合劳动力。公司从 San Francisco 运营，也保留了深厚的 Lisbon 根基，尽管本次抓取到的公开总部证据更偏美国。Talkdesk CX
              Cloud 是核心企业平台，把自助服务、全渠道互动、劳动力工具、协作、分析、AI 与自动化放在同一个云平台上。当前产品叙事已从 CCaaS 转向客户体验自动化，强调在 CX
              生命周期里编排自主多智能体。现行定价架构覆盖 Digital Essentials、Voice Essentials、Elite 和行业体验云；Talkdesk Express 则面向 50 人以下企业。
