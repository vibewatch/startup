      - number: '3.3'
        title: 平台相邻竞争与定价压力
        blocks:
          - type: paragraph
            body: >-
              Twilio Flex 以可组合架构和用户数加用量经济性竞争，而不是提供完全预设的套件。Twilio 将 Flex 定位为延展现有技术栈的软件，服务那些想保留现有应用并深度定制的公司。Salesforce 通过把
              AI、数据和服务工作流嵌入 CRM 系统竞争；许多企业已经把支持运营锚定在 CRM 里。因此，当买家更偏好应用整合而非专门 CCaaS 功能时，Service Cloud 对 Talkdesk
              威胁最大。Amazon Connect 具有结构性颠覆性，因为 AWS 先按消费量给产品定价，并与原生云服务和生成式 AI 搭配。采购已在 AWS
              上标准化、买家更看重基础设施集成而非打包垂直工作流时，Amazon Connect 尤其强。Genesys 定价显示，原生 AI 如今已打包进标准版本，AI
              功能成为入场券，而不是溢价差异化。Twilio、Amazon 和 Salesforce 都从更宽的平台发起进攻，拥有 Talkdesk 无法直接匹配的巨大分发足迹。Talkdesk
              的反向定位是垂直专业化、合作伙伴带动交付，以及比可编程替代方案更有主张的企业 CX 套件。Salesforce 显示，平台套件可以吸收更多支持工作流，降低企业独立选择最佳单项 CCaaS
              的必要性。进入正式企业软件选型流程、确定入围名单前，买家还会比较采购杠杆、迁移摩擦，以及每家厂商 AI 和合规叙事的可信度。
