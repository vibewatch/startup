      - number: '1.4'
        title: 里程碑、合作伙伴覆盖与负面信号
        blocks:
          - type: paragraph
            body: >-
              Talkdesk 正用 2026 年认证和产品发布支撑从云联络中心供应商转向 AI 主导的客户体验自动化平台的重新定位。公司 2026 年 1 月获得 ISO 42001 认证，用来验证其 AI
              治理框架。Talkdesk 2026 年 3 月获得 BSI C5 认证，并把它定位为进入德国金融、保险、医疗和政府等受监管买家的通道。医疗集成新闻稿显示，Talkdesk
              仍在扩展垂直行业集成，而不是只依赖通用联络中心功能。评论平台仍提示延迟、缺陷、通话记录问题和管理复杂度，说明产品成熟度还没有完全匹配公司的高端叙事。TrustRadius
              评论者明确提到偶发掉线、转接计数问题，以及 AI 配置中的管理摩擦。Capterra 评论者和定价分析人士把 Talkdesk 描述为相对昂贵、实施较重的产品，与更简单的客服软件替代品形成对比。Talkdesk
              继续借外部奖项和基准材料强化商业可信度，包括 G2 Summer 2026 发布和 2024 KPI 报告。KPI 基准信息图显示，Talkdesk
              把自身运营数据包装成品类思想领导力，而不只是产品营销。由于收入、客户数量和债务细节仍主要来自公司声明或私募市场数据库，尽调应把未经支撑的点估计视为方向性，而非经审计事实。规模信号强、私营公司不透明度仍高，这组组合是
              Talkdesk 进入 2026 年中时最关键的高层事实。
