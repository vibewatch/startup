  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - $420M+ 规模属实；AI 附加销售扩大 ACV；留存强；披露改善
        - ~$8B-$10B 区间仍可辩护
        - 需要溢价软件倍数持续
        - 披露改善且 IPO 前需求强
      - - 基准
        - 业务扎实，但估值向压缩后的软件倍数重定价
        - ~$5B-$8B 区间
        - 公开可比公司仍远低于 2021 年估值
        - 增长温和，披露更好但仍不完美
      - - 悲观
        - 债务 / 流动性压力或续约疲弱迫使重置
        - ~$3B-$5B 区间
        - 客户流失、利润率疲弱或市场窗口不佳
        - IPO 延迟、契约压力或队列数据疲软
    notes: 区间有意设得较宽，因为公开输入只具方向性，不是管理层质量的预测。
    claimRefs:
      - CV020
      - CV021
      - CV022
      - CV023
      - CV035
      - CV036
      - CV037
  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: sample
      basis: >-
        Representative set of the most decision-relevant public and private comparables available in the fetched
        evidence pack; not an exhaustive list of every adjacent software or CX asset.
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考价值
      - 局限
    rows:
      - - Five9
        - 上市 CCaaS
        - ~1.57x EV/Sales；~$1.77B 市值
        - 最接近的上市纯业务参考
        - 上市公司，增长 / 盈利能力不同
      - - NICE
        - 上市 CX / 分析套件
        - ~$5.12B 市值 / 净值
        - 具规模且盈利的企业体验可比公司
        - 业务更宽，也比 Talkdesk 更成熟
      - - Twilio
        - 上市通信平台
        - ~$29.06B 市值 / 净值
        - 展示平台规模上限
        - 业务过宽，难以直接推导纯 CCaaS 倍数
      - - Salesforce
        - 上市企业平台
        - ~$134.04B 市值 / 净值
        - 战略买方 / 平台语境
        - 不是直接的独立 CCaaS 可比公司
      - - 8x8
        - 上市通信厂商
        - ~$246.7M 市值 / 净值
        - 低增长通信厂商的下行参考
        - 业务组合差异显著
      - - Genesys
        - 私营大型 CCaaS 领导者
        - 2025 年投资隐含倍数远低于 2021 年软件高点
        - 最好的具规模私营联络中心参考
        - 私营估值细节较不透明
    notes: 可比表混合了纯业务、相邻平台和私营参考，因为没有单一上市可比公司能干净回答估值问题。
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
  - id: TV005
    title: 论点破裂与叫停触发项表
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 留存不及预期
        - NRR 或 GRR 明显低于溢价软件常模
        - 打破先落地再扩张的溢价叙事
        - 除非价格重置，否则转向回避
      - - 估值重置
        - 下一轮或 IPO 价格远低于历史估值
        - 改变稀释和预期回报基准
        - 重新评估股权结构和员工激励风险
      - - AI 合规成本飙升
        - 监管 / 客户控制负担急剧上升
        - 压低利润率并拖慢销售周期
        - 下调合理倍数并延长尽调
      - - 服务强度持续
        - 实施负担仍高
        - 削弱软件质量论点
        - 估值向服务占比高的同业靠拢
    notes: 这些触发项重要，因为它们同时撬动倍数和增长叙事。
    claimRefs:
      - CV029
      - CV038
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 经审计财务
        - 2024-2026 年收入、利润率、现金、烧钱
        - 支撑溢价倍数所必需
        - 管理层 + 财务资料室
      - - 留存
        - NRR、GRR、队列续约、logo 流失
        - 收入质量核心证明
        - 管理层经营复盘
      - - 债务条款
        - 贷款方、到期日、契约、抵押品
        - 决定流动性灵活度
        - 法务 + CFO 尽调
      - - 收入结构
        - 软件 vs 服务、地区、垂直行业、伙伴来源 ARR
        - 检验集中度和利润率韧性
        - FP&A + 销售运营
      - - 头部账户集中度
        - Top 10 / 20 账户 ARR
        - 用于测算客户流失带来的下行
        - RevOps / 客户成功
    notes: 这些要求是捍卫溢价私募入场价格前所需的最低资料包。
    claimRefs:
      - CV015
      - CV027
      - CV028
