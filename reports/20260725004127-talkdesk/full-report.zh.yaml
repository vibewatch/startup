      - number: '3.2'
        title: 直接企业级 CCaaS 同行
        blocks:
          - type: paragraph
            body: >-
              Genesys 是这组公司里最大的私营基准，2026 财年初报告 ARR 近 $2.1 billion，覆盖 100 多个国家 8,000 多家组织。CX Today 报道 Genesys 的年度经常性
              CCaaS 收入已达到约 $1.8 billion，同比增长 40%，NRR 超过 120%。Genesys 还在 2025 年获得 Salesforce 和 ServiceNow 的 $1.5 billion
              投资，强化了战略深度和股东流动性。NICE 将 CXone 定位为支撑客户体验的 AI 平台，每年处理 25 billion 次以上互动。NICE
              强调主权就绪基础设施、合规、加密和治理，以此区分面向全球企业的方案。Five9 依靠可配置套件竞争，把渠道、AI 座席辅助、WEM 和 CRM 适配器合并在按席位计费之下。Five9 的数字套餐起价为每席
              $119，核心全渠道套餐起价为每席 $159，为原本不透明的市场提供了公开价格点。StockAnalysis 显示，2026 年 7 月 24 日 Five9 市值仅约 $1.77
              billion，EV/Sales 约 1.57x，与 Talkdesk 静态 $10 billion 私募估值形成强烈反差。进入正式企业软件选型流程、确定入围名单前，买家还会比较采购杠杆、迁移摩擦，以及每家厂商
              AI 和合规叙事的可信度。
