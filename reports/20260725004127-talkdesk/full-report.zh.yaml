      - number: '7.2'
        title: 监管与法律敞口
        blocks:
          - type: paragraph
            body: >-
              Talkdesk 的 AI 战略带来监管风险，因为自主语音和消息工作流处在快速变化的执法环境里。FTC 指南明确指出，使用 AI 的公司仍需为欺骗、不公平或歧视性结果负责，即使自动化形式很新。EU AI Act
              提高了企业 AI 系统的合规负担，尤其当文档、治理和人工监督成为正式采购要求时。BakerHostetler 指出 FCC 正在考虑对 AI 生成通话提出新要求，直接关系到自动外呼或语音智能体用例。医疗部署增加
              HIPAA 处理风险，因为公有云架构和 AI 摘要会制造更多需要 PHI 控制持续有效的接触面。Talkdesk
              公开隐私政策确认，公司在多项活动中处理业务联系信息、录音、聊天文本和其他个人数据，增加了隐私治理复杂度。服务条款也明确，客户协议覆盖许可费、用量费、专业服务费和第三方产品，可能在企业争议中制造商业和责任复杂度。Talkdesk
              产品依赖通信服务、通话录音、转录和第三方产品，意味着故障会沿着比简单帮助台工具更大的技术和合同界面扩散。公开可见的最强缓释因素是不断增强的信任与治理姿态，包括 ISO 42001、BSI C5
              认证和庞大的合规足迹。这些认证能降低采购摩擦，但本身不能证明 AI 公平、幻觉率低或生产性能有韧性。关键尽调挑战不是列出可能风险，而是在估值倍数压缩的制度下，判断哪些风险真的会打破投资案例。
            claimRefs:
