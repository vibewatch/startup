      - CE006
      - CE023
      - CE024
  - id: FE003
    title: 关键依赖图
    type: dag
    layout: wide
    summary: 产品表现取决于上游系统、治理和合作伙伴应用。
    data:
      nodes:
        - id: systems
          label: 记录系统
        - id: apis
          label: API / OAuth
        - id: data
          label: Data Cloud
        - id: ai
          label: AI 智能体 / AI 副驾
        - id: apps
          label: AppConnect 伙伴
        - id: trust
          label: 安全 / 合规控制
      edges:
        - from: systems
          to: apis
        - from: apis
          to: data
        - from: data
          to: ai
        - from: apps
          to: ai
        - from: trust
          to: ai
    approximationNotes: 依赖图标出故障会拖累客户成效的环节，即便功能广度看起来很强。
    claimRefs:
      - CE011
      - CE012
      - CE013
      - CE014
      - CE015
      - CE021
      - CE022
      - CE035
  - id: FE004
    title: 产品成熟度 / 能力图
    type: matrix
    layout: wide
    summary: 可见成熟度最强的是垂直化、集成和信任；最不透明的是生产环境 AI 经济性。
    data:
      columns:
        - 公开证据深度
        - 部署证明
        - 剩余未知项
      rows:
        - label: 垂直工作流
          values:
            - 高
            - 高
            - 中
        - label: 开发者 / API 面
          values:
            - 高
            - 中
            - 中
        - label: 信任 / 合规
          values:
            - 高
            - 中高
            - 中
        - label: AI 单位经济性 / 可观测性
          values:
            - 低
            - 中
            - 高
    approximationNotes: 序数成熟度矩阵把证据强度转成尽调视角，而不是评价工程质量。
    claimRefs:
      - CE013
      - CE017
      - CE018
      - CE019
      - CE029
      - CE031
      - CE032
      - CE036
  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Talkdesk 通常从一个服务痛点切入，嵌入工作流系统，再扩张到 AI 和分析。
    data:
      items:
        - label: 痛点
          note: 渠道分散、响应慢或自助解决率低，推动客户进入评估
        - label: 落地
          note: 核心 CCaaS 路由和全渠道部署
        - label: 嵌入
          note: CRM、EHR、理赔或 Salesforce 集成上线
        - label: 扩张
          note: Autopilot、Copilot、分析或垂直工作流抬高 ACV
    approximationNotes: 旅程图概括客户故事中最常见的路径。
    claimRefs:
      - CU004
      - CU005
      - CU019
      - CU021
      - CU029
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: 可见客户标识中，只有一部分披露生产结果；披露持续性指标的更少。
    data:
      items:
        - label: 公开客户数
          value: 1800
        - label: 具名客户案例
          value: 24
        - label: 量化结果的案例
          value: 15
        - label: 有续约可见度的案例
          value: 2
    approximationNotes: 漏斗使用公开证据材料，而不是内部 CRM 数量；公开案例很少讨论合同持续性，因此续约可见度仍只是近似判断。
    claimRefs:
      - CU001
      - CU017
      - CU018
      - CU025
      - CU026
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: 最强的证明来自生产部署和结果具体性；公开留存可见度最弱。
    data:
      columns:
        - 结果具体性
        - 生产环境置信度
        - 留存可见度
      rows:
        - label: 银行
          values:
            - 高
            - 高
            - 低
        - label: 保险
          values:
            - 中高
            - 高
            - 低
        - label: 医疗
          values:
            - 高
            - 高
            - 低
        - label: 零售
          values:
            - 高
            - 高
            - 低
        - label: 旅行 / 软件
          values:
            - 中
            - 中高
            - 低
    approximationNotes: 矩阵评分的是证据质量，不是客户价值。
    claimRefs:
      - CU003
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
      - CU012
      - CU013
      - CU016
  - id: FU004
    title: 留存 / 续约队列
    type: cohort
    layout: standard
    summary: 公开证据支持一个方向性判断：大型受监管部署的留存应好于较轻量的中端市场账户，但精确留存未披露。
    data:
      columns:
        - 第 0 年
        - 第 1 年留存（估计）
        - 第 2 年留存（估计）
      rows:
        - label: 受监管企业队列
          values:
            - 100
            - 92
            - 84
        - label: 广义企业队列
          values:
            - 100
            - 88
            - 78
        - label: SMB / 轻量部署队列
          values:
            - 100
            - 80
            - 68
    approximationNotes: 留存单元格是启发式尽调估计，依据集成深度和工作流关键性，并非公司披露的队列。
    claimRefs:
      - CU021
      - CU022
      - CU026
      - CU030
      - CU035
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 估值重置和 AI 监管暴露落在剩余严重度最高的象限。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
      rows:
        - label: 估值 / 流动性重置
          values:
            - 高
            - 高
            - 中
        - label: AI 合规 / 法律暴露
          values:
            - 中
            - 高
            - 中
        - label: 运营中断 / 通话质量
          values:
            - 中
            - 高
            - 中高
        - label: 定价 / 竞争挤压
          values:
            - 高
            - 中高
            - 中
        - label: 客户集中度未知
          values:
            - 中
            - 中高
            - 低
    approximationNotes: 热力图用公开证据给剩余风险评分，不能替代内部风险台账。
    claimRefs:
      - CR001
      - CR005
      - CR013
      - CR021
      - CR027
      - CR035
      - CR036
      - CR038
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 最危险的风险会传导到收入耐久性、融资灵活性和退出价值。
    data:
      nodes:
        - id: ai
          label: AI / 合规风险
        - id: ops
          label: 运营事故
        - id: price
          label: 价格挤压
        - id: renew
          label: 续约质量
        - id: cash
          label: 现金 / 债务压力
        - id: value
          label: 估值结果
      edges:
        - from: ai
          to: renew
        - from: ops
          to: renew
        - from: price
          to: cash
        - from: renew
          to: cash
        - from: cash
          to: value
    approximationNotes: 传导图强调因果路径，而不是数值情景分析。
    claimRefs:
      - CR003
      - CR005
      - CR014
      - CR021
      - CR025
      - CR035
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: Talkdesk 建在基础设施、数据和合作伙伴层之上，而这些层不完全由它控制。
    data:
      nodes:
        - id: cloud
          label: 云 / 电话
        - id: systems
          label: 客户记录系统
        - id: partners
          label: 第三方应用
        - id: talkdesk
          label: Talkdesk 编排层
        - id: customers
          label: 客户成效
      edges:
        - from: cloud
          to: talkdesk
        - from: systems
          to: talkdesk
        - from: partners
          to: talkdesk
        - from: talkdesk
          to: customers
    approximationNotes: 依赖图突出外部控制点：即使 Talkdesk 自身代码正常，这些环节也可能失败。
    claimRefs:
      - CR012
      - CR013
      - CR018
      - CR023
      - CR024
      - CR031
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议来自真实规模、真实缺口，以及仍显得过高的估值锚点。
    data:
      nodes:
        - id: scale
          label: 规模 / 客户证明
        - id: gaps
          label: 披露缺口
        - id: risk
          label: 高剩余风险
        - id: price
          label: $10B 历史估值标记
        - id: call
          label: 继续研究
      edges:
        - from: scale
          to: call
        - from: gaps
          to: call
        - from: risk
          to: call
        - from: price
          to: call
    approximationNotes: 建议逻辑是定性判断，但直接扎根于最强的公开证据组合。
    claimRefs:
      - CV024
      - CV031
      - CV032
      - CV033
      - CV039
      - CV040
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 入场估值对投资人采用哪一类可比公司高度敏感。
    data:
      items:
        - label: 低端上市可比区间
          value: 4
          unit: USD B
        - label: 基准压缩区间
          value: 6.5
          unit: USD B
        - label: 高溢价软件区间
          value: 9
          unit: USD B
        - label: 历史私募估值标记
          value: 10
          unit: USD B
    approximationNotes: 柱状条展示估值类别，不是经审计的公司公允价值。
    claimRefs:
      - CV017
      - CV018
      - CV019
      - CV035
      - CV036
      - CV037
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 公开证据支持一个宽而不对称的估值区间，中心低于历史私募估值标记。
    data:
      items:
        - label: 悲观
          low: 3
          high: 5
          unit: USD B
        - label: 基准
          low: 5
          high: 8
          unit: USD B
        - label: 乐观
          low: 8
          high: 10
          unit: USD B
    approximationNotes: 情景区间经过取整，并受证据约束，不是精确的折现现金流测算结果。
    claimRefs:
      - CV035
      - CV036
      - CV037
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 规模是最强 KPI；估值支撑质量最弱。
    data:
      items:
        - label: 2024 年收入
          value: ~$420M
          claimRefs:
            - CV002
        - label: 历史估值
          value: $10B
          claimRefs:
            - CV001
        - label: 上市可比公司锚点
          value: ~1.57x EV/Sales (Five9)
          claimRefs:
            - CV004
        - label: 投资建议
          value: Research more
          claimRefs:
            - CV024
        - label: 风险评级
          value: High
          claimRefs:
            - CV033
        - label: 估值立场
          value: Stretched
          claimRefs:
            - CV034
    approximationNotes: KPI 概括的是投委会判断框架，不是运营细节。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV024
      - CV033
      - CV034
