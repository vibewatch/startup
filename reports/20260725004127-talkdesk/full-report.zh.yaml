  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分与采购中心
        blocks:
          - type: paragraph
            body: >-
              Talkdesk 称平台有 1,800 多家企业使用；信任页面说这些客户覆盖 75 个国家，CX Cloud 页面则说覆盖 100 多个国家。2021 年 D 轮公告另称，1,800 多家企业依赖
              Talkdesk，为大型企业采用提供了多年锚点，而不是单季营销快照。客户证据集中在受监管和服务密集型垂直行业，包括银行、保险、医疗、零售、旅游、家政服务和游戏。可能的经济买家是联络中心或客户体验负责人，日常用户包括一线座席、主管和数字自助服务负责人。点名客户也暗示企业客户偏重：Patagonia
              为迁移培训了 300 多名 CX 团队成员，Michaels 运营 1,200 多家门店，Farfetch 服务 190 多个国家的客户。Talkdesk Academy
              和合作伙伴交付资源显示，公司投入赋能；这很重要，因为许多企业部署需要培训和变革管理。Salesforce、AWS、Microsoft、Zoom 以及下游分销商组成的合作伙伴网络，可能把 Talkdesk
              触达扩展到其并非现有通信供应商的企业账户。零售证明也有意义，因为 Rocky Brands、Michaels、Patagonia、Humann 和 Farfetch 都提到全渠道或 AI
              驱动收益，说明公司能扩展到受监管利基之外。公开客户证据暗示，美洲仍是主要收入地区；EMEA 通过 Farfetch 和 Patagonia
              有证明，但比美国引用更薄。客户图景因此足以确认真实企业采用，但还不足以用公开市场披露级信心量化续约韧性。
