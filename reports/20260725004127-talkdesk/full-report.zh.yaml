      - number: '6.3'
        title: 留存、扩张与集中度
        blocks:
          - type: paragraph
            body: >-
              由于许多案例研究突出 Salesforce、Epic 或其他系统集成，当 Talkdesk 嵌入记录系统，而不只是替换语音电话时，采用似乎更有黏性。Talkdesk
              最强客户证明来自金融服务和医疗，合规和工作流深度可以抬高切换成本。当前记录没有披露客户集中度、平均合同价值或按垂直行业收入，使笼统客户数量主张对投资支撑的用处有限。留存质量同样不透明；尽管客户故事营销很多，Talkdesk
              并不发布 NRR、GRR、logo 流失或 cohort 续约指标。独立定价评论也把 Talkdesk 描述为昂贵且需定制谈判，即使买家兴趣高，也可能拉长采购周期。公司的 AI
              主导扩张故事可信，因为多个客户在初始平台部署后提到 Copilot、Autopilot、分析或自动化。该模式支持 先落地再扩张：核心 CCaaS 成为楔子，AI 模块随时间提高
              ACV。不过，公开记录仍未显示扩张能否强到足以抵消流失，进而产生可与上市公司比较的 NRR。而且，几乎所有客户证明都来自 Talkdesk 自有页面，续约韧性和客户背书
              质量的独立验证仍有限。整体看，Talkdesk 似乎拥有真实生产采用和企业级客户背书，但客户基础的耐久性仍来自案例研究推断，而不是硬留存披露证明。尽调中最重要的下一组问题是客户集中度、净扩张、多年续约率，以及
              1,800 多家客户中真正大型企业账户的占比。客户图景因此足以确认真实企业采用，但还不足以用公开市场披露级信心量化续约韧性。
