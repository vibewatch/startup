companyProfile:
  summary: >-
    Talkdesk 是云原生联络中心和客户体验自动化平台，2011 年由 Tiago Paiva 与 Cristina Fonseca 创立。公司销售企业级 CCaaS 软件、AI 智能体、真人座席
    Copilot、分析工具，以及面向银行、保险、医疗、零售等受监管行业的垂直工作流云。公开证据支持其已具规模——2024 年收入约 $420M、客户超过 1,800
    家、地域覆盖广、已部署的大型企业客户基础可观——但当前财务质量、续约韧性和债务条款仍只披露了一部分。
