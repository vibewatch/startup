      - number: '7.3'
        title: 运营、产品与依赖风险
        blocks:
          - type: paragraph
            body: >-
              从运营上看，平台的关键链路包括语音交付、登录、API、安全支付、AppConnect、Conversation Orchestrator，以及状态页列出的主要 CRM
              连接器。覆盖面越宽，单点故障或依赖降级越容易同时打到多个产品线，放大支持压力和客户不满。本轮抓取的事件历史页信息稀疏，公开证据无法独立证明组件出故障的频率或事件严重程度。评论平台仍提到
              bug、通话质量问题、转接计数问题和后台管理摩擦，说明即便规模已经起来，产品成熟度风险仍然真实存在。Talkdesk 大力营销 AI
              智能体，一旦演示效果和生产环境准确率不匹配，就可能在企业买方面前放大声誉风险。OpenAI、Google、AWS 和 Microsoft 都在改进实时或智能体式客服工具，Talkdesk 差异化 AI
              能力被更快商品化、还没来得及变现的风险因此上升。Dialogflow CX 尤其把语音和文本流程与生成式工具结合起来；Dynamics 365 Contact Center 则把智能体式服务和上下文感知 AI
              放进既有 CRM 环境。合作伙伴和平台依赖也是实质风险，因为产品叙事依赖 CRM、EHR、计费和身份系统等 Talkdesk 无法控制的集成。上游系统一旦改 API、数据权限或安全姿态，即便根因不在
              Talkdesk，运营责任也可能落到 Talkdesk
              头上。从运营角度看，正式状态页和广泛组件清单是缓释信号，说明事件管理流程已经更成熟。运营可靠性风险实质存在，但有公开信任与状态基础设施部分对冲，因此比估值压缩更容易监控。尽调的关键不在于列出可能风险，而在于排序：在估值被压缩的情境下，哪些风险真的能打穿投资逻辑。
