chapter:
  number: 4
  title: Financials
  summary: Public evidence points to a real large-scale SaaS business—roughly $420M of 2024 revenue with multiple upsell levers across AI and industry clouds—but almost every quality-of-revenue question remains undisclosed. The financial debate is therefore not whether Talkdesk has scale, but whether margins, retention, and cash generation justify the still-unrefreshed 2021 valuation anchor.
