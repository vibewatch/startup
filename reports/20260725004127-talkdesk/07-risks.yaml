  evidenceGaps:
  - type: missing-source
    severity: material
    topic: TR001 regulatory risk register coverage limits
    missingEvidence: Broader jurisdiction-by-jurisdiction mapping of privacy, telecom, and AI-specific obligations beyond the highest-priority public items in TR001.
    whyItMatters: The regulatory risk register is intentionally partial because public evidence surfaces the largest issues but not every contract, license, or enforcement exposure that could matter in diligence.
    diligencePath: Request legal compliance matrices, DPA templates, outbound-calling governance documents, and jurisdictional product-control mappings.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: blocking
    topic: liquidity and debt terms
    missingEvidence: Debt lender, maturity, covenants, cash balance, and burn profile.
    whyItMatters: Residual financial risk cannot be ranked precisely without balance-sheet evidence.
    diligencePath: Request board materials, debt agreements, and monthly cash bridge.
    relatedQuestionRefs:
    - QR027
    - QR029
  - type: missing-source
    severity: blocking
    topic: AI control evidence
    missingEvidence: Measured false-positive / hallucination rates, human-override rates, and regulated-workflow incident logs.
    whyItMatters: Certifications and product launches do not prove safe production AI.
    diligencePath: Request risk-control dashboards and customer incident reviews.
