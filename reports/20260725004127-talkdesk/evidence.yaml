evidenceGaps:
  - type: missing-source
    severity: material
    topic: debt terms
    missingEvidence: Detailed 2025 debt facility size, lender identity, maturity, covenants, and use of proceeds.
    whyItMatters: Debt capital can materially affect runway and downside risk at private-market valuations.
    diligencePath: Obtain debt documents or lender-side reporting from the company data room.
    relatedQuestionRefs:
      - QO022
      - QO024
  - type: missing-source
    severity: blocking
    topic: profitability
    missingEvidence: Audited gross margin, cash burn, and EBITDA or free-cash-flow data.
    whyItMatters: Private revenue scale alone does not prove software quality or IPO readiness.
    diligencePath: Request audited financial statements and board materials covering 2024-2026.
    relatedQuestionRefs:
      - QO025
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: A current exact headcount and geographic employee distribution.
    whyItMatters: Execution risk depends heavily on whether hiring and operations remain concentrated in a few hubs.
    diligencePath: Request current HR census by function and geography.
    relatedQuestionRefs:
      - QO023
  - type: enumeration-incomplete
    severity: minor
    topic: TO002 leadership table completeness
    missingEvidence: A full current executive org chart and director roster beyond the public leadership page.
    whyItMatters: >-
      Leadership diligence is stronger when public marketing bios can be reconciled to a formal management and board
      list.
    diligencePath: Request the latest org chart and board list from the company.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: TO003 stakeholder map completeness
    missingEvidence: >-
      A current cap table, board observer list, and debt-provider disclosure covering all economically relevant
      stakeholders.
    whyItMatters: Investor and creditor rights determine governance leverage and future liquidity pressure.
    diligencePath: Request the latest cap table, board schedule, and financing summary from the company.
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 milestone chronology completeness
    missingEvidence: A fuller historical timeline covering early product launches, office openings, and any restructurings.
    whyItMatters: Chronology helps test whether growth came from durable product milestones or financing alone.
    diligencePath: Request a corporate timeline or internal board-history deck.
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: market methodology
    missingEvidence: A raw, apples-to-apples 2026 market model that normalizes all three research-firm definitions.
    whyItMatters: Conflicting TAM baselines can overstate or understate valuation upside.
    diligencePath: Build a bottoms-up model from seats, interactions, and AI-attach assumptions.
    relatedQuestionRefs:
      - QM022
      - QM024
  - type: missing-source
    severity: minor
    topic: buyer budget ownership
    missingEvidence: Primary-survey evidence on who signs multi-year AI CCaaS deals by vertical.
    whyItMatters: Budget ownership affects sales cycle, CAC, and partner strategy.
    diligencePath: Interview channel partners and enterprise buyers across BFSI, healthcare, and retail.
    relatedQuestionRefs:
      - QM023
      - QM025
  - type: missing-source
    severity: material
    topic: win-loss evidence
    missingEvidence: Current win-loss data by vertical and incumbent displacement pattern.
    whyItMatters: Positioning claims are stronger when tied to actual competitive takeouts.
    diligencePath: Request internal win-loss analysis segmented by industry, incumbent, and deployment size.
    relatedQuestionRefs:
      - QP022
      - QP024
  - type: missing-source
    severity: material
    topic: realized pricing
    missingEvidence: Net realized pricing after discounts across the top five CCaaS vendors.
    whyItMatters: List prices overstate monetization power in enterprise negotiations.
    diligencePath: Gather channel checks or procurement benchmarks for large-enterprise deals.
    relatedQuestionRefs:
      - QP023
      - QP025
  - type: missing-source
    severity: blocking
    topic: cash generation
    missingEvidence: Audited cash, burn, and free-cash-flow statements for 2024-2026.
    whyItMatters: The public record cannot distinguish a high-quality software business from a capital-hungry growth story.
    diligencePath: Request audited financials, board reporting packs, and debt schedules.
    relatedQuestionRefs:
      - QI022
      - QI024
  - type: missing-source
    severity: blocking
    topic: retention and margin quality
    missingEvidence: Gross margin, NRR, GRR, revenue mix, and services share.
    whyItMatters: Without these, the company cannot be benchmarked cleanly against public SaaS comps.
    diligencePath: Request cohort retention, segment gross margin, and regional ARR disclosures.
    relatedQuestionRefs:
      - QI023
      - QI025
  - type: missing-source
    severity: material
    topic: production performance
    missingEvidence: Measured latency, accuracy, and containment benchmarks for AI agents by workflow.
    whyItMatters: The main technology risk is whether autonomous workflows stay reliable and economic at enterprise scale.
    diligencePath: Request benchmark dashboards, model-cost curves, and incident reviews.
    relatedQuestionRefs:
      - QE022
      - QE023
  - type: missing-source
    severity: material
    topic: product economics
    missingEvidence: Gross margin by module, partner dependency by workflow, and services effort per deployment.
    whyItMatters: Feature breadth matters less if complex deployments dilute software economics or create brittle implementations.
    diligencePath: Request product P&L by module and implementation playbooks by vertical.
    relatedQuestionRefs:
      - QE024
      - QE025
  - type: missing-source
    severity: material
    topic: TU003 named customer proof table sample limits
    missingEvidence: >-
      Independent renewal, churn, or deployment-status corroboration for the broader customer universe beyond the
      sampled named proof table.
    whyItMatters: >-
      The named customer proof table is intentionally sampled from the strongest public case studies, so diligence still
      needs broader evidence on whether the visible success stories generalize across the installed base.
    diligencePath: >-
      Request a customer reference list segmented by vertical and tenure, plus independent renewal or satisfaction data
      that can validate whether the sampled case studies are representative.
    relatedQuestionRefs:
      - QU023
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: blocking
    topic: retention disclosure
    missingEvidence: NRR, GRR, logo churn, renewal term, and cohort data by customer segment.
    whyItMatters: >-
      Customer proof is strong, but valuation and durability underwriting still hinge on whether existing accounts
      expand enough to offset churn.
    diligencePath: Request renewal dashboards, cohort tables, and top-50 account retention analysis.
    relatedQuestionRefs:
      - QU022
      - QU024
  - type: missing-source
    severity: material
    topic: customer concentration
    missingEvidence: Revenue concentration by top customer, top ten customers, vertical, region, and partner channel.
    whyItMatters: A large customer-count headline can still mask concentrated ARR or channel dependence.
    diligencePath: Request ARR concentration, partner-influenced pipeline share, and vertical mix.
    relatedQuestionRefs:
      - QU023
      - QU025
  - type: missing-source
    severity: material
    topic: TR001 regulatory risk register coverage limits
    missingEvidence: >-
      Broader jurisdiction-by-jurisdiction mapping of privacy, telecom, and AI-specific obligations beyond the
      highest-priority public items in TR001.
    whyItMatters: >-
      The regulatory risk register is intentionally partial because public evidence surfaces the largest issues but not
      every contract, license, or enforcement exposure that could matter in diligence.
    diligencePath: >-
      Request legal compliance matrices, DPA templates, outbound-calling governance documents, and jurisdictional
      product-control mappings.
    relatedQuestionRefs:
      - QR026
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: blocking
    topic: liquidity and debt terms
    missingEvidence: Debt lender, maturity, covenants, cash balance, and burn profile.
    whyItMatters: Residual financial risk cannot be ranked precisely without balance-sheet evidence.
    diligencePath: Request board materials, debt agreements, and monthly cash bridge.
    relatedQuestionRefs:
      - QR027
      - QR029
  - type: missing-source
    severity: blocking
    topic: AI control evidence
    missingEvidence: Measured false-positive / hallucination rates, human-override rates, and regulated-workflow incident logs.
    whyItMatters: Certifications and product launches do not prove safe production AI.
    diligencePath: Request risk-control dashboards and customer incident reviews.
    relatedQuestionRefs:
      - QR028
      - QR030
  - type: missing-source
    severity: material
    topic: TV004 comparable-set completeness
    missingEvidence: >-
      Additional late-stage private and public comparables with known revenue, growth, and margin context beyond the
      sampled set in TV004.
    whyItMatters: >-
      The comparable valuation table is intentionally sampled around the most decision-relevant names, but a final
      investment committee view would be stronger with a broader comp basket and cleaner normalization.
    diligencePath: >-
      Expand the comp set with additional enterprise CX, workflow, and AI platform names and normalize them for growth,
      margin, and business-model differences.
    relatedQuestionRefs:
      - QV026
    relatedTableRefs:
      - TV004
  - type: missing-source
    severity: blocking
    topic: quality-of-revenue proof
    missingEvidence: Audited gross margin, NRR/GRR, services mix, and cash generation.
    whyItMatters: >-
      These metrics determine whether Talkdesk deserves a premium to public CCaaS comps or a discount to the historical
      private mark.
    diligencePath: Request audited financial statements and board KPI packs.
    relatedQuestionRefs:
      - QV027
      - QV029
  - type: missing-source
    severity: blocking
    topic: capital-structure clarity
    missingEvidence: Debt terms, employee-equity overhang, and preference stack implications.
    whyItMatters: >-
      Return analysis can change materially if liquidity timing or dilution pressure is worse than the public record
      suggests.
    diligencePath: Request debt docs, cap-table waterfall, and latest investor-rights summary.
    relatedQuestionRefs:
      - QV028
      - QV030
