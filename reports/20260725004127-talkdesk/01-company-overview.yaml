chapter:
  number: 1
  title: Company Overview
  summary: Talkdesk is an AI-first cloud contact-center company founded in 2011 and still privately valued off its 2021 $10B Series D. Public evidence supports meaningful scale—roughly $420M of 2024 revenue, 1,800+ customers, broad geographic reach, and a large workforce—but many current financial details still come from company statements or private-market trackers rather than audited disclosures.
