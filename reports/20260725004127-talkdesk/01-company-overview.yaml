- id: identity-platform
  title: Identity, positioning, and platform scope
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO025
  tableRefs:
  - TO001
  figureRefs:
  - FO001
  - FO003
  body: Talkdesk was founded in 2011 after Tiago Paiva won a hackathon and remains led by him as founder and CEO. Talkdesk presents itself in 2026 as an AI-first customer experience automation company built around a hybrid workforce of humans and AI agents. The company operates from San Francisco and maintains material roots in Lisbon even though the fetched public headquarters evidence is U.S.-centric. Talkdesk CX Cloud is the core enterprise platform, combining self-service, omnichannel engagement, workforce tools, collaboration, analytics, AI, and automation on one cloud platform. The company’s current product narrative has shifted from CCaaS toward Customer Experience Automation, emphasizing autonomous multi-agent orchestration across the CX lifecycle. The current pricing architecture spans Digital Essentials, Voice Essentials, Elite, and industry experience clouds, while Talkdesk Express targets businesses under 50 employees.
