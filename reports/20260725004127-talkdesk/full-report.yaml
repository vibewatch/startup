      - number: '7.4'
        title: Financial, customer, and execution risk
        blocks:
          - type: paragraph
            body: >-
              Amazon Connect continues to pressure the lower end of contact-center pricing through usage-based economics
              and adjacent AWS integration. Public pricing commentary indicates Talkdesk is often viewed as expensive
              and negotiation-heavy, which becomes riskier when alternatives converge on baseline capabilities.
              Competitive pressure is therefore not just logo-by-logo displacement; it is cumulative pressure on
              pricing, procurement velocity, and perceived differentiation. Financially, the lack of public
              gross-margin, burn, or cash disclosure creates model risk because investors cannot see whether AI growth
              is accretive or compute-heavy. The company may still be healthy, but the disclosure gap means downside can
              surface late—especially if debt, services intensity, or slower expansion weaken cash generation.
              Customer-concentration risk remains unresolved because Talkdesk discloses many logos and outcomes but not
              top-account ARR or churn. Commercially, the deepest mitigation against competition is customer embedding
              into regulated workflows such as healthcare, insurance, and banking. But that same embedding raises
              switching friction only if renewal economics are strong; the public record does not prove that. People
              risk also matters because founder-CEO continuity is a strength, but it concentrates strategic narrative
              and external credibility in Tiago Paiva and the senior bench. Portugal remains an important talent base,
              so labor-market or geographic dislocation risk could affect engineering continuity even if headquarters
              messaging is U.S.-centric. The key diligence challenge is not identifying possible risks; it is ranking
              which ones could genuinely break the investment case under a compressed valuation regime.
            claimRefs:
              - CR020
              - CR021
              - CR022
              - CR025
              - CR026
              - CR027
              - CR031
