      - number: '1.3'
        title: Funding history, valuation, and current scale signals
        blocks:
          - type: paragraph
            body: >-
              Talkdesk raised a $230 million Series D in August 2021 at a valuation above $10 billion. The 2021 Series D
              included new investors Whale Rock, TI Platform Management, and Alpha Square plus existing investors
              including Franklin Templeton and Viking Global. Talkdesk had raised $498 million in total funding at the
              time of the Series D announcement. Nasdaq Private Market and GetLatka both preserve the earlier sequence
              of a $143 million Series C and a $100 million Series B before the $230 million Series D. Nasdaq Private
              Market also records earlier seed and Series A financings, supporting a multi-round venture history before
              the breakout growth rounds. Third-party private-market trackers cited in 2026 continue to describe
              Talkdesk as a private company rather than a listed issuer. VCBacked and Equitybee indicate that Talkdesk
              added a roughly $95 million debt financing in 2025, although public details remain sparse. GetLatka
              estimates Talkdesk reached roughly $420.1 million of revenue in 2024 after roughly $298 million in 2023.
              GetLatka still lists the company at a $10 billion valuation and about $508.5 million of cumulative
              funding, slightly above the $498 million figure publicized in 2021. Talkdesk’s trust page says the
              platform is trusted by more than 1,800 businesses in 75 countries. The 2021 Series D press release
              separately said more than 1,800 enterprises relied on Talkdesk around the world. The CX Cloud product page
              says Talkdesk serves enterprise customers in more than 100 countries, suggesting its geographic reach
              broadened beyond the 75-country trust-page claim.
