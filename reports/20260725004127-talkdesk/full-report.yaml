  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying centers
        blocks:
          - type: paragraph
            body: >-
              Talkdesk says more than 1,800 businesses use the platform and that those customers span 75 countries on
              the trust page and more than 100 countries on the CX Cloud page. The 2021 Series D announcement separately
              said more than 1,800 enterprises relied on Talkdesk, giving a multi-year anchor for large-enterprise
              adoption rather than a one-quarter marketing snapshot. Customer evidence is concentrated in regulated and
              service-heavy verticals including banking, insurance, healthcare, retail, travel, home services, and
              gaming. The likely economic buyer is a contact-center or customer-experience leader, while day-to-day
              users include frontline agents, supervisors, and digital self-service owners. Named references also imply
              an enterprise bias: Patagonia trained 300-plus CX team members on the migration, Michaels operates
              1,200-plus stores, and Farfetch serves customers in more than 190 countries. Talkdesk Academy and partner
              delivery resources suggest the company invests in enablement, which matters because many enterprise
              deployments require training and change management. The partner network with Salesforce, AWS, Microsoft,
              Zoom, and downstream distributors likely expands reach into enterprise accounts where Talkdesk is not the
              incumbent communications provider. Retail proof is also meaningful because Rocky Brands, Michaels,
              Patagonia, Humann, and Farfetch all cite omnichannel or AI-driven gains, suggesting the company can scale
              beyond regulated niches. Public customer evidence implies the Americas remain the primary revenue
              geography, while EMEA proof is present through Farfetch and Patagonia but thinner than U.S. references.
              The customer picture is therefore good enough to confirm real enterprise adoption, but not yet good enough
              to quantify renewal durability with public-grade confidence.
