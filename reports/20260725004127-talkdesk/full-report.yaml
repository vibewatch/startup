            body: >-
              GetLatka estimates Talkdesk reached about $420.1 million of revenue in 2024, up from roughly $298 million
              in 2023. On those same GetLatka figures, growth from 2023 to 2024 was roughly 41%, implying solid scale
              but below the hypergrowth rates that once supported 2021 software multiples. GetLatka also preserves
              earlier estimates of roughly $229.5 million in 2021 and $124 million in 2020, suggesting sustained
              multi-year expansion. The trust page and customer proof suggest Talkdesk serves large regulated customers
              globally, which normally supports multi-year subscription contracts and lower churn. Public case studies
              also imply that AI modules such as Copilot, Navigator, and analytics are increasingly tied to deployments,
              potentially improving average contract value. Because Talkdesk does not publish seat counts, NRR, or
              contract-length disclosure, revenue quality remains more inferred than proven. The 2024 KPI report and G2
              2026 release indicate Talkdesk still emphasizes operating outcomes and customer awards as substitutes for
              audited financial transparency. Talkdesk’s likely gross-margin profile is software-favorable, but service,
              telephony, AI compute, and integration costs remain unquantified in public evidence. The absence of
              explicit public headcount efficiency metrics or revenue-per-employee data also limits sales-efficiency
              analysis. Even so, the combination of global customer reach, enterprise verticalization, and active AI
              upsell suggests Talkdesk still has multiple levers for ACV expansion. Financial diligence therefore hinges
              on whether private evidence can convert these directional public signals into audited unit-economics
              proof.
