      - number: '3.2'
        title: Direct enterprise CCaaS peers
        blocks:
          - type: paragraph
            body: >-
              Genesys is the largest private benchmark in the set, reporting nearly $2.1 billion of ARR in early fiscal
              2026 and more than 8,000 organizations across 100+ countries. CX Today reported Genesys had already
              reached about $1.8 billion in annual recurring CCaaS revenues with 40% year-over-year growth and 120%+
              NRR. Genesys also secured a $1.5 billion investment from Salesforce and ServiceNow in 2025, reinforcing
              strategic depth and shareholder liquidity. NICE frames CXone as an AI platform for customer experience
              that powers more than 25 billion interactions a year. NICE emphasizes sovereign-ready infrastructure,
              compliance, encryption, and governance as differentiators for global enterprises. Five9 competes on
              configurable bundles that combine channels, AI agent assist, WEM, and CRM adapters under per-seat pricing.
              Five9 pricing starts at $119 per seat for a digital package and $159 for a core all-channel package,
              putting public price points on an otherwise opaque market. StockAnalysis shows Five9 had only about $1.77
              billion of market cap and about 1.57x EV/Sales on July 24, 2026, a sharp contrast with Talkdesk’s static
              $10 billion private mark. Buyers also compare procurement leverage, migration friction, and the
              credibility of each vendor AI and compliance story before naming a finalist in a formal enterprise
              software selection process.
