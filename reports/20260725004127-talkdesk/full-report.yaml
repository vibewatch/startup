      - number: '7.2'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Talkdesk’s AI strategy introduces regulatory risk because autonomous voice and messaging workflows sit
              inside a fast-evolving enforcement environment. FTC guidance makes clear that companies using AI remain
              responsible for deceptive, unfair, or discriminatory outcomes even when automation is novel. The EU AI Act
              raises compliance burdens for enterprise AI systems, especially where documentation, governance, and human
              oversight become formal buyer requirements. BakerHostetler notes the FCC is considering new requirements
              for AI-generated calls, which is directly relevant to automated outbound or voice-agent use cases.
              Healthcare deployments add HIPAA handling risk, because public cloud architecture and AI summarization
              create more surfaces where PHI controls must work consistently. Talkdesk’s public privacy policy confirms
              it processes business contact information, recordings, chat text, and other personal data across multiple
              activities, increasing privacy-governance complexity. The terms of service also make clear that customer
              agreements cover license fees, usage fees, professional-services fees, and third-party products, which can
              create commercial and liability complexity in enterprise disputes. Talkdesk’s product depends on
              communication services, call recordings, transcripts, and third-party products, meaning failures can
              propagate across a larger technical and contractual surface than a simple help-desk tool. The strongest
              mitigation visible publicly is a growing trust and governance posture, including ISO 42001 and BSI C5
              certifications plus a large compliance footprint. Those certifications reduce procurement friction, but
              they do not by themselves prove AI fairness, low hallucination rates, or resilient production performance.
              The key diligence challenge is not identifying possible risks; it is ranking which ones could genuinely
              break the investment case under a compressed valuation regime.
