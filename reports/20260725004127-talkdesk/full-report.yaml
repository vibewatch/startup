      - number: '3.4'
        title: Switching costs, distribution, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Five9 supports customer choice around CRM and WEM adapters, which can reduce rip-and-replace friction for
              mid-market and enterprise buyers. Genesys advertises prebuilt Salesforce integration and multiple add-ons,
              reinforcing ecosystem breadth and platform lock-in. NICE highlights day-one integrations and no/low-code
              tools, suggesting it competes heavily on implementation breadth and ecosystem depth. Twilio offers the
              lowest structural lock-in for engineering-led customers because it can fit into an existing stack without
              full platform standardization. Salesforce and AWS both bring cross-sell leverage that can compress
              customer acquisition cost and improve enterprise access. Ericsson ownership gives Vonage a larger parent
              balance sheet but not necessarily a category-leading CCaaS product narrative. Avaya remains a transition
              competitor because enterprises moving off legacy environments often evaluate Avaya’s cloud path against
              specialist vendors. The public-market benchmark set implies that private CCaaS valuations no longer
              receive 2021-style revenue multiples without stronger profitability evidence. Multiples.vc and Yahoo
              Finance indicate that broader software comp sets still reward AI narratives, but not uniformly across
              contact-center players. Genesys’s scale makes it the hardest direct benchmark for Talkdesk because it
              combines private ownership, large ARR, and strategic capital support. NICE’s compliance posture and
              enterprise footprint make it formidable in highly regulated deals where governance and durability matter
              more than startup agility. Amazon Connect and Twilio show that programmable or infra-linked models can
              commoditize baseline routing and channel capabilities. Five9’s public pricing transparency can make
              Talkdesk’s quote-led pricing feel expensive or opaque in competitive bake-offs. For Talkdesk, the moat
              question is therefore less about owning the whole market and more about defending regulated, AI-heavy,
              vertically specialized enterprise workflows. Buyers also compare procurement leverage, migration friction,
              and the credibility of each vendor AI and compliance story before naming a finalist in a formal enterprise
              software selection process.
