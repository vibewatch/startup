  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform definition and modules
        blocks:
          - type: paragraph
            body: >-
              Talkdesk now frames its product around Customer Experience Automation, where specialized AI agents and
              humans work together across the customer journey. CX Cloud remains the core enterprise platform underneath
              this messaging shift, bundling self-service, omnichannel engagement, workforce engagement, employee
              collaboration, and analytics. Autopilot is the flagship AI virtual assistant that can autonomously resolve
              issues and trigger workflows across voice and digital channels. Copilot is Talkdesk’s real-time agent
              assistant that recommends next actions, surfaces knowledge, and summarizes interactions. Navigator and
              interaction analytics extend the AI layer from self-service into routing, coaching, and quality oversight.
              The platform is explicitly omnichannel, with public references to voice, email, chat, SMS, social
              messaging, mobile-app outreach, and live-agent escalation. Vertical clouds remain a key part of product
              strategy, with dedicated experience clouds for healthcare, insurance/financial services, and
              retail/ecommerce. Customer stories show product value often comes from bundling multiple modules
              together—for example CXA plus Copilot, Navigator, analytics, and industry clouds in one deployment.
              Product diligence should therefore test not just feature breadth, but whether the stack performs reliably
              inside messy enterprise workflows and regulated data environments.
