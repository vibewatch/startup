      - number: '8.4'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The lack of public gross-margin, burn, NRR, and cash disclosure means investors cannot justify a premium
              multiple with the usual quality-of-revenue evidence. In that sense, Talkdesk’s current valuation debate is
              less about topline scale than about missing proof on software quality and cash conversion. The most likely
              exit path remains IPO or strategic recapitalization rather than a near-term trade sale, given scale,
              investor base, and the still-large valuation expectation. Potential strategic-buyer logic exists for broad
              platform companies such as Salesforce or ServiceNow-like ecosystems, but no public evidence supports a
              near-term process. Final diligence should focus on audited 2024-2026 financials, NRR/GRR, debt terms,
              services mix, and top-account concentration before any premium valuation is entertained. A down-round or
              IPO below the historical private mark would not necessarily break the company, but it would materially
              change the entry-return equation for new capital. Conversely, if Talkdesk can prove strong retention,
              healthy margins, and sustained AI-driven upsell, the valuation could stabilize at a premium to commodity
              CCaaS vendors even after compression. The decisive question is therefore not whether Talkdesk is a real
              company, but whether new money can enter at a price that preserves upside after public-multiple reality
              and remaining diligence gaps are accounted for.
            claimRefs:
              - CV015
              - CV016
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
