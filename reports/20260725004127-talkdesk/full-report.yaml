      - number: '1.2'
        title: Leadership, board, and organizational scale
        blocks:
          - type: paragraph
            body: >-
              The 2021 funding announcement said Talkdesk had nearly 2,000 employees after doubling headcount during
              2020. The current leadership page says Talkdesk scaled to more than 1,500 employees, which is
              directionally consistent with a large global private SaaS workforce. Munil Shah leads product, technology,
              and customer operations, reflecting a combined product-engineering-customer ownership model around AI
              deployment. The visible leadership bench also includes Neville Letzerich as CMO, David Middler as CLO, and
              Shauna Geraghty running global people and talent. Talkdesk’s board disclosures name Tiago Paiva, Viking
              managing director Brian Rose, and Threshold co-founder Josh Stein among current directors. The partner
              ecosystem centers on large strategic allies including Salesforce, AWS, Microsoft, and Zoom. Talkdesk says
              AppConnect now offers more than 80 marketplace offerings, while the broader partner network includes more
              than 10,000 downstream partners through distributors.
