      - CV031
      - CV032
      - CV033
      - CV039
      - CV040
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: Entry value is highly sensitive to which comp class investors use.
    data:
      items:
        - label: Low public-comp band
          value: 4
          unit: USD B
        - label: Base compressed band
          value: 6.5
          unit: USD B
        - label: Premium software band
          value: 9
          unit: USD B
        - label: Historical private mark
          value: 10
          unit: USD B
    approximationNotes: Bars illustrate valuation classes, not audited company fair value.
    claimRefs:
      - CV017
      - CV018
      - CV019
      - CV035
      - CV036
      - CV037
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: Public evidence supports a broad but asymmetric valuation range centered below the historical private mark.
    data:
      items:
        - label: Bear
          low: 3
          high: 5
          unit: USD B
        - label: Base
          low: 5
          high: 8
          unit: USD B
        - label: Bull
          low: 8
          high: 10
          unit: USD B
    approximationNotes: Scenario ranges are rounded and evidence-constrained rather than precise discounted-cash-flow outputs.
    claimRefs:
      - CV035
      - CV036
      - CV037
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: The strongest KPI is scale; the weakest is valuation support quality.
    data:
      items:
        - label: 2024 revenue
          value: ~$420M
          claimRefs:
            - CV002
        - label: Historical valuation
          value: $10B
          claimRefs:
            - CV001
        - label: Public comp anchor
