      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              AWS positions Amazon Connect as a cloud-native contact center spanning voice, chat, tasks, analytics, and
              generative-AI features. Amazon Connect pricing is heavily usage-based, which pushes the market toward
              consumption economics rather than pure named-seat pricing. NICE says CXone powers more than 25 billion
              interactions a year, indicating the scale demanded by global enterprise buyers. Five9 pricing shows a
              bundle architecture that layers digital channels, AI, CRM adapters, and workforce tools into distinct seat
              packages. Genesys pricing now includes AI experience tokens and multiple native AI features in standard
              editions, signaling that AI is being bundled into the core platform. The EU AI Act introduces a stronger
              governance layer around AI systems and will raise compliance work for vendors automating customer
              conversations. HIPAA cloud guidance raises the bar for healthcare deployments that touch protected health
              information. The FCC TCPA framework and the 2024 BakerHostetler note on proposed AI-call disclosures show
              that outbound voice AI faces explicit regulatory friction. The FTC’s AI portal shows that U.S. regulators
              are actively organizing enforcement and guidance around AI practices, including deceptive or unsafe
              deployment patterns. Compliance, integration complexity, and data security are therefore not side issues;
              they are first-order adoption constraints in regulated verticals. Because public market estimates vary
              widely, a sensible diligence model should use ranges and preserve contradictory TAM lenses instead of
              anchoring to a single giant market number.
