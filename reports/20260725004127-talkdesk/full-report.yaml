  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              CCaaS packages voice, digital channels, routing, analytics, and workforce functions as cloud-delivered
              customer-engagement infrastructure instead of on-premise telephony stacks. The market boundary includes
              omnichannel routing, IVR, recordings, analytics, WEM, and increasingly AI bots and copilots. CRM-only help
              desks and generic UCaaS seats are adjacent categories, but they are not the same as a full enterprise
              CCaaS platform. Twilio Flex sells a composable contact-center layer with user-plus-usage pricing, making
              developer-led deployments a credible alternative to turnkey suites. Salesforce Service Cloud competes
              indirectly by embedding service automation, data, and AI into an existing CRM estate. 8x8, Avaya, and
              Vonage remain relevant as UCaaS or legacy-enterprise adjacency options rather than pure best-of-breed
              AI-first CCaaS challengers. Status-quo substitutes still include legacy on-premise call-center systems,
              outsourced BPO capacity, and internal build on programmable communications APIs.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM022
              - CM023
