  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Retention disappointment
        - NRR or GRR materially below premium-software norms
        - Breaks land-and-expand premium story
        - Move toward avoid unless price resets
      - - Valuation reset
        - Next round or IPO well below historical mark
        - Changes dilution and expected return base
        - Re-underwrite cap-table and employee incentive risk
      - - AI compliance cost spike
        - Regulatory / customer-control burden rises sharply
        - Reduces margin and slows sales cycles
        - Lower fair multiple and extend diligence
      - - Services intensity persists
        - Implementation burden remains high
        - Weakens software-quality thesis
        - Treat valuation closer to services-heavy peers
    notes: These triggers matter because they move both the multiple and the growth narrative.
    claimRefs:
      - CV029
      - CV038
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Audited financials
        - 2024-2026 revenue, margin, cash, burn
        - Needed to justify premium multiple
        - Management + finance data room
      - - Retention
        - NRR, GRR, cohort renewals, logo churn
        - Core quality-of-revenue proof
        - Management operating review
      - - Debt terms
        - Lender, maturity, covenants, collateral
        - Determines liquidity flexibility
        - Legal + CFO diligence
      - - Revenue mix
        - Software vs services, region, vertical, partner-sourced ARR
        - Tests concentration and margin durability
        - FP&A + sales ops
      - - Top-account concentration
        - ARR from top 10 / 20 accounts
        - Needed to size downside from customer loss
        - RevOps / customer success
    notes: These asks are the minimum package needed before defending a premium private entry price.
    claimRefs:
      - CV015
      - CV027
      - CV028
