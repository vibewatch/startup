companyProfile:
  summary: >-
    Talkdesk is a cloud-native contact-center and customer-experience automation platform founded in 2011 by Tiago Paiva
    and Cristina Fonseca. The company sells enterprise CCaaS software, AI agents, live-agent copilots, analytics, and
    regulated vertical workflow clouds for sectors such as banking, insurance, healthcare, and retail. Public evidence
    supports meaningful scale—roughly $420M of 2024 revenue, 1,800-plus customers, broad geographic reach, and a large
    installed enterprise base—but current financial quality, renewal durability, and debt terms remain only partially
    disclosed.
  foundedDate: '2011-01-01'
