    approximationNotes: Dependency map highlights external control points that can fail even when Talkdesk’s own code works.
    claimRefs:
      - CR012
      - CR013
      - CR018
      - CR023
      - CR024
      - CR031
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: The recommendation follows from real scale plus real gaps plus a valuation anchor that still looks too demanding.
    data:
      nodes:
        - id: scale
          label: Scale / customer proof
        - id: gaps
          label: Disclosure gaps
        - id: risk
          label: High residual risk
        - id: price
          label: $10B historical mark
        - id: call
          label: Research more
      edges:
        - from: scale
          to: call
        - from: gaps
          to: call
        - from: risk
          to: call
        - from: price
          to: call
    approximationNotes: Recommendation logic is qualitative but directly grounded in the strongest public evidence clusters.
    claimRefs:
