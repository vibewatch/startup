      - number: '8.2'
        title: Current valuation context and comparable set
        blocks:
          - type: paragraph
            body: >-
              That implied multiple sits far above Five9’s public valuation yardsticks in 2026, including about 1.57x
              EV/Sales on StockAnalysis and roughly $1.77 billion market cap on CompaniesMarketCap. Macrotrends also
              shows Five9’s market cap around $1.34 billion as of February 2026, reinforcing the view that public CCaaS
              comps trade far below 2021 private peaks. NICE’s StockAnalysis page shows about $5.12 billion of market
              cap / net worth, placing it above Five9 but still at a scale where public investors reward profitability
              and disclosure. 8x8’s roughly $247 million market cap on StockAnalysis shows how severely lower-growth
              communication vendors can be de-rated in public markets. Twilio’s valuation is far larger in absolute
              dollars, but it also reflects platform breadth well beyond CCaaS; its presence is useful mainly as an
              upper-bound platform reference, not a clean peer. Salesforce is an even broader platform comp; its massive
              market cap underscores strategic buyer capacity more than stand-alone CCaaS multiple relevance. Genesys is
              the most relevant large private comp, and 2025 reports of a $1.5 billion investment tied to around $2.1
              billion of ARR imply a much lower revenue multiple than Talkdesk’s stale mark. A reasonable public-market
              framing is that contact-center software leaders and adjacent service platforms in 2026 trade on a much
              lower range than 2021 private software rounds. If Talkdesk were valued more like a premium but still
              public-style software asset, a mid-teens revenue multiple would likely require stronger disclosure than is
              currently available. If valued closer to CCaaS public comps, the company could screen materially below $10
              billion despite genuine scale. The decisive question is therefore not whether Talkdesk is a real company,
              but whether new money can enter at a price that preserves upside after public-multiple reality and
              remaining diligence gaps are accounted for.
