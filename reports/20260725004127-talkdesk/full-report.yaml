  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and competitor taxonomy
        blocks:
          - type: paragraph
            body: >-
              Genesys, NICE, and Five9 are the clearest direct CCaaS peers to Talkdesk in enterprise cloud contact
              centers. Amazon Connect, Twilio Flex, and Salesforce Service Cloud are powerful adjacencies because they
              can replace layers of the contact-center stack from different entry points. 8x8, Vonage, and Avaya remain
              relevant mainly as UCaaS or legacy-transition options rather than as AI-first leaders. No single
              competitor wins every segment; the market is fragmented between suite vendors, infrastructure platforms,
              and specialized AI-first providers. Buyers also compare procurement leverage, migration friction, and the
              credibility of each vendor AI and compliance story before naming a finalist in a formal enterprise
              software selection process.
