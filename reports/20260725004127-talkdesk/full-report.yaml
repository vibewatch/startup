      - number: '5.3'
        title: Trust, compliance, and operating controls
        blocks:
          - type: paragraph
            body: >-
              The trust page says Talkdesk serves more than 1,800 businesses in 75 countries and holds more than 30
              security and compliance certifications. Talkdesk also claims 99.999% uptime for Healthcare Experience
              Cloud and positions ISO 22301 business continuity certification as a differentiator. ISO 42001
              certification gives Talkdesk a public AI-governance credential at a time when enterprises are scrutinizing
              autonomous-agent control frameworks. BSI C5 certification adds localized trust proof for German regulated
              enterprises that require cloud-security validation before procurement. The roadmap evidence available
              publicly is launch-oriented rather than deep engineering disclosure, with 2026 announcements on outbound
              AI agents and healthcare integrations. Talkdesk’s differentiator is therefore not a single algorithm; it
              is the combination of vertical workflows, orchestration, integration surface, and trust credentials.
              Product diligence should therefore test not just feature breadth, but whether the stack performs reliably
