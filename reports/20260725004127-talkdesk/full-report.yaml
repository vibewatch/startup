      - number: '4.3'
        title: Capital structure and adequacy
        blocks:
          - type: paragraph
            body: >-
              The 2021 funding announcement said Talkdesk would use the Series D capital to expand internationally, keep
              innovating, and scale customer support and workforce diversity. Private-market trackers indicate Talkdesk
              remained private through 2026 and likely supplemented equity capital with about $95 million of debt in
              2025. That debt could extend runway without repricing equity, but absent disclosed covenants it may also
              embed liquidity pressure ahead of any IPO or recapitalization. Capital intensity appears modest compared
              with hardware or marketplace businesses because the product is cloud software, but AI compute and partner
              services can still pressure unit economics. The company’s main next-round trigger is probably not survival
              financing but a liquidity event that reconciles the 2021 $10 billion valuation with current public SaaS
              multiples. A debt-backed extension strategy can work if revenue continues compounding and public comps
              recover, but it raises downside if growth decelerates before an exit window opens. From a diligence
              perspective, the hardest questions are cash generation, debt terms, renewal quality, and the mix of
              software versus services revenue. Financial diligence therefore hinges on whether private evidence can
              convert these directional public signals into audited unit-economics proof.
