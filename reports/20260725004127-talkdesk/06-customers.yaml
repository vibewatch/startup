chapter:
  number: 6
  title: Customers
  summary: 'Talkdesk has credible production customer proof across banking, insurance, healthcare, retail, travel, and software, with several 2026 case studies documenting measurable operational outcomes from AI-led deployments. The core missing piece is durability: public evidence proves adoption better than it proves retention, renewal quality, or concentration.'
