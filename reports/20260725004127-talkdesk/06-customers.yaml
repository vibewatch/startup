  - TU005
  figureRefs:
  - FU004
  body: Because many case studies highlight Salesforce, Epic, or other system integrations, adoption appears stickier when Talkdesk becomes embedded in systems of record rather than only replacing voice telephony. Talkdesk’s strongest customer proof comes from financial services and healthcare, where compliance and workflow depth can raise switching costs. The current record does not disclose customer concentration, average contract value, or revenue by vertical, making broad customer-count claims less useful for underwriting. Retention quality is similarly opaque because Talkdesk does not publish NRR, GRR, logo churn, or cohort renewal metrics despite abundant customer-story marketing. Independent pricing commentary also frames Talkdesk as expensive and custom-negotiated, which can lengthen procurement cycles even when buyer interest is high. The company’s AI-led expansion story is credible because multiple customers mention Copilot, Autopilot, analytics, or automation after the initial
    platform deployment. That pattern supports a land-and-expand motion where core CCaaS becomes the wedge and AI modules increase ACV over time. However, the public record still does not show whether expansion offsets churn strongly enough to produce public-comparable NRR. But because almost all customer proof lives on Talkdesk-owned pages, independent validation of renewal durability and reference quality remains limited. Overall, Talkdesk appears to have genuine production adoption with enterprise-grade references, yet the durability of that base is still inferred from case studies rather than proven through hard retention disclosure. For diligence purposes, the most important next questions are customer concentration, net expansion, multiyear renewal rates, and what share of the 1,800-plus customers are truly large enterprise accounts. The customer picture is therefore good enough to confirm real enterprise adoption, but not yet good enough to quantify renewal durability with public-grade
    confidence.
