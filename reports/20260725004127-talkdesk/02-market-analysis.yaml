chapter:
  number: 2
  title: Market Analysis
  summary: 'The CCaaS market is growing at a high-teens pace, but public estimates differ materially on the 2024 starting base, ranging from roughly $6B to $8B. The most attractive segment for Talkdesk is narrower than headline TAM: large-enterprise, regulated, omnichannel workflows where trust, integrations, and AI automation matter more than lowest-cost telephony.'
