- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Audited financials
    - 2024-2026 revenue, margin, cash, burn
    - Needed to justify premium multiple
    - Management + finance data room
  - - Retention
    - NRR, GRR, cohort renewals, logo churn
    - Core quality-of-revenue proof
    - Management operating review
  - - Debt terms
    - Lender, maturity, covenants, collateral
    - Determines liquidity flexibility
    - Legal + CFO diligence
  - - Revenue mix
    - Software vs services, region, vertical, partner-sourced ARR
    - Tests concentration and margin durability
    - FP&A + sales ops
  - - Top-account concentration
    - ARR from top 10 / 20 accounts
    - Needed to size downside from customer loss
    - RevOps / customer success
  notes: These asks are the minimum package needed before defending a premium private entry price.
