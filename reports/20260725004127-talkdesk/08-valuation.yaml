chapter:
  number: 8
  title: Valuation
  summary: 'Talkdesk looks like a real scaled private software asset, but the public record still anchors the company to a 2021-era $10B mark that appears hard to defend against 2026 contact-center and software multiples. The prudent call is Research More: the business merits attention, but the price and remaining disclosure gaps do not yet support a high-conviction premium entry.'
