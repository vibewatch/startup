        - "20% probability: Requires flawless execution and swift containment of biometric legal exposure"
      - - "Base Case"
        - "Revenue grows at moderate 25% CAGR reaching $180M; gross margins stabilize at 65%; BIPA class-action resolves with modest settlement reserve"
        - "7.0x ARR multiple yielding $1.26B valuation (-37% contraction from $2.0B Series D mark)"
        - "Pricing pressure from competitors like Sumsub and Zyphe compressing per-verification fees"
