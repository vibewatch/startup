  title: "Customers"
  summary: "Persona demonstrates substantial enterprise adoption across consumer internet platforms, fintechs, and high-volume AI providers including LinkedIn, Etsy, Affirm, and OpenAI, processing more than 300 million verifications annually. However, customer concentration in large anchor accounts and reputational vulnerabilities stemming from exposed government infrastructure (which triggered Discord's termination of its UK age-verification trial) highlight serious durability and retention risks."
sections:
  - id: "customer-segmentation-structure"
    title: "Customer Base Segmentation and Buyer Economics"
    body: "Persona's customer architecture spans four core commercial segments: enterprise digital platforms and marketplaces, regulated financial institutions and fintechs, AI and high-throughput API platforms, and mid-market commercial businesses. Enterprise consumer platforms such as LinkedIn and Etsy deploy Persona to solve decentralized account trust, seller integrity, and marketplace onboarding friction, while digital lenders and payments networks like Affirm rely on Persona for CIP compliance, KYC verification, and transaction risk mitigation. The high-growth AI segment, anchored by OpenAI's 'Verified Organization' requirement for tier-4 model access and advanced developer capabilities, drives massive automated screening volumes, with OpenAI processing over 99% of user checks frictionlessly behind the scenes. For smaller commercial enterprises and emerging startups, Persona packages a lightweight Business Verification solution on its Essential Plan to handle baseline US company entity checks and KYB workflows. Across these segments, purchasing authority is split between engineering and product leaders seeking high-conversion API workflows, and compliance, risk, and legal executives mandated to satisfy federal KYC/AML, SAR/STR, and beneficial ownership reporting rules."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-scale"
    title: "Adoption Trajectory, Throughput Scale, and Reported Customer Counts"
    body: "Persona's operating scale expanded dramatically between 2023 and 2025, driven by surging enterprise demand for automated identity verification, biometric liveness validation, and regulatory compliance infrastructure. According to late-stage funding disclosures accompanying the company's $200 million Series D raise at a $2.0 billion valuation in April 2025, Persona's customer count and annual revenue both doubled year-over-year in 2024, with the company completing more than 300 million identity verifications over the course of that year. Commercial tracking disclosures reported 575 active enterprise customers generating $141.2 million in 2024 revenue, reflecting an early customer base heavily concentrated in mid-to-late stage technology companies and fast-growing fintechs requiring continuous re-verification. Analysts from Gartner recognized this operational execution by naming Persona a Leader in the 2026 Gartner Magic Quadrant for Identity Verification for the second consecutive year, while positioning the company highest for Ability to Execute for the third consecutive year and ranking it #1 in Risk Mitigation and Consumer use cases. Despite these high-level throughput milestones, Persona does not publicly publish granular customer cohorts, average contract values, or gross dollar retention figures."
    claimRefs:
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU011"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "production-deployments-durability"
    title: "Production Proof, Churn Dynamics, and Account Concentration Vulnerabilities"
    body: "Evaluating Persona's customer durability requires balancing verified enterprise deployments against acute concentration risks and post-controversy churn. Production references at scale include OpenAI, which routes millions of monthly developer and organization identity checks through Persona, and publicly referenced platform leaders LinkedIn, Etsy, and Affirm. However, customer retention is vulnerable to security posture breakdowns and privacy controversies. In February 2026, cybersecurity researchers discovered exposed infrastructure belonging to Persona's government dashboard, revealing 269 verification checks and internal biometric data retention configurations that contrasted sharply with public marketing disclosures. Following the disclosure, gaming platform Discord, which had been trialling Persona for its UK age-verification rollout, terminated its vendor engagement within a month amid severe consumer pushback over centralized biometric data harvesting. Simultaneously, Persona faces consumer class-action litigation under the Illinois Biometric Information Privacy Act (BIPA) and common-law negligence, alleging unauthorized retention of biometric facial scans and government ID records from millions of end users. These controversies create reputational contagion, increasing procurement friction and potential contract churn among consumer-facing brands."
    claimRefs:
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"
    tableRefs:
      - "TU003"
