callouts:
  - calloutType: "risk"
    title: "Account Concentration and Controversy-Driven Churn"
    body: "While Persona has achieved landmark customer wins with mega-cap technology platforms like OpenAI, LinkedIn, and Etsy, the company's reliance on high-throughput anchor accounts introduces structural vulnerability. The sudden termination of Discord's age-verification deployment following exposed infrastructure and user backlash demonstrates that consumer-facing brands face severe reputational spillover from identity vendor controversies, creating latent churn risk across privacy-sensitive enterprise clients."
    claimRefs:
      - "CU012"
      - "CU015"
      - "CU016"
  - calloutType: "insight"
    title: "Expansion Economics Through Modular Product Cross-Selling"
    body: "Persona's net revenue retention is fundamentally tied to its ability to expand customers from point-solution KYC checks into comprehensive identity infrastructure. By packaging KYB business verification, automated watchlist screening, and unified fraud case management into tiered Growth and Enterprise plans, Persona increases customer switching costs and drives expansion beyond raw sign-up volumes."
    claimRefs:
      - "CU004"
      - "CU006"
      - "CU010"
