callouts:
  - calloutType: "insight"
    title: "Scope Is Evident; Market Size Is Not"
    body: "The sources consistently describe a broad workflow surface and diverse buyer set, but none supplies a supportable market-spend denominator, CAGR, or Persona share. Product breadth and global technical coverage therefore define a demand boundary, not a quantified TAM."
    claimRefs:
      - "CM009"
      - "CM015"
  - calloutType: "risk"
    title: "Auditability Limits Adoption Confidence"
    body: "Persona's configurability does not eliminate customer compliance responsibility. Buyers still need jurisdiction-specific coverage validation, privacy and retention controls, pilot conversion data, and independent accuracy evidence; StartWithIdentity reports that public NIST and false-accept or false-reject benchmarks are absent."
    claimRefs:
      - "CM012"
      - "CM013"
