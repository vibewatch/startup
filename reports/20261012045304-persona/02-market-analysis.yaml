chapter:
  number: 2
  title: "Market Analysis"
  summary: "Persona addresses the enterprise identity-verification market through configurable KYC, KYB, AML-screening, fraud, and case-management workflows rather than a single document check. The retained evidence supports a broad regulated buyer set and a published entry price, but it does not support a monetary TAM, CAGR, or obtainable-share estimate; those quantities remain explicit diligence gaps."
sections:
  - id: "market-boundary-scope"
    title: "Market Boundary and Demand"
    body: "Persona's relevant market is narrower than all cybersecurity or compliance spending. It includes software used to verify individuals and businesses, orchestrate KYC and KYB checks, screen watchlists and sanctions, assess fraud signals, route exceptions into cases, and monitor identity risk after onboarding. It excludes core banking ledgers, transaction-monitoring systems, payment processing, corporate-credit underwriting, and the regulated customer's own policy decisions. This boundary matters because Persona's value proposition is workflow composition: sources describe modular checks that can add friction when risk rises rather than forcing every applicant through one fixed path. Demand comes from regulated digital onboarding, marketplace seller verification, fraud pressure, and the need to connect automated checks with manual review. Persona and third-party reviews identify fintech, payments, crypto, marketplaces, lending, and enterprise platforms as relevant buyers, but the breadth of use cases should not be mistaken for measured addressable spend."
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM003"
      - "CM004"
      - "CM005"
      - "CM011"
    tableRefs:
      - "TM001"
  - id: "market-sizing-dynamics"
    title: "Evidence-Constrained Sizing"
    body: "The assigned evidence does not provide a credible publisher-sourced TAM, SAM, SOM, CAGR, or market methodology. It instead supports three defensible sizing boundaries. The broad demand boundary is global digital identity verification, with Persona reported to support government IDs across more than 200 countries and territories. The serviceable boundary is organizations that need configurable KYC, KYB, AML, fraud, and review workflows; the public Essential offer starts at $250 per month with a 12-month minimum, while advanced tiers are custom-priced. The obtainable boundary cannot be quantified from public sources because customer verification volumes, tier mix, discount schedules, win rates, retention, and revenue are absent. A funding amount or valuation would not answer this market question and is deliberately excluded. The sizing table therefore reports supported scope and pricing anchors while marking unsupported monetary market values as unavailable."
    claimRefs:
      - "CM006"
      - "CM009"
      - "CM010"
      - "CM015"
    tableRefs:
      - "TM002"
    figureRefs:
      - "FM001"
  - id: "buyer-segmentation-constraints"
    title: "Buyer Segmentation and Adoption Constraints"
    body: "The economic buyer varies with the workflow. Compliance and risk teams own KYC, AML, sanctions, and business-verification policy; fraud or trust-and-safety teams own coordinated-abuse investigations; product and engineering teams integrate the user journey; and the enterprise operating the platform is the payer while applicants and merchants are end users. This mapping is an analytical inference from the workflows described in the retained sources, not a disclosed Persona budget survey. Adoption benefits from progressive risk segmentation because it can reserve extra checks and manual review for higher-risk cases. Constraints are equally material: broad configurability increases implementation work, customers retain responsibility for regulatory decisions and privacy controls, advanced pricing is private, and StartWithIdentity reports no public NIST face benchmark or published false-accept and false-reject rates for Persona. The Essential business-verification package is also US-focused and excludes UBO KYC and international registry verification, narrowing the entry-tier serviceable segment."
    claimRefs:
      - "CM006"
      - "CM007"
      - "CM008"
      - "CM010"
      - "CM011"
      - "CM012"
      - "CM013"
      - "CM016"
    tableRefs:
      - "TM003"
