      - number: '2.3'
        title: 买方分层与采用约束
        blocks:
          - type: paragraph
            body: >-
              经济买方随工作流而变化。合规和风险团队负责
              KYC、AML、制裁及企业核验政策；欺诈或信任与安全团队负责协同滥用调查；产品和工程团队负责接入用户旅程；运营平台的企业是付款方，申请人和商户则是终端用户。这一映射来自保留来源所描述工作流的分析性推断，并非
              Persona
              公布的预算调研。渐进式风险分层有助于采用，因为额外检查和人工复核可以留给高风险案件。但约束同样明显：高度可配置会增加实施工作，客户仍要承担监管决策和隐私控制责任，高级定价不公开；StartWithIdentity
              报告称没有公开的 NIST 人脸基准，也没有 Persona 的误接受率和误拒绝率。Essential 企业核验套餐还以美国为主，不包括 UBO KYC 和国际登记库核验，因而缩小了入门层可服务市场。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM010
              - CM011
              - CM012
              - CM013
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM005
              - CM007
              - CM008
              - CM016
      - number: '2.4'
        title: 展示项
        blocks:
          - type: callout
            title: 范围清晰，市场规模不清晰
            body: 来源一致描述了广泛的工作流覆盖面和多样买方，但没有任何来源提供可支撑的市场支出分母、CAGR 或 Persona 市占率。因此，产品广度和全球技术覆盖定义的是需求边界，而不是量化 TAM。
            calloutType: insight
            claimRefs:
              - CM009
              - CM015
          - type: callout
            title: 可审计性限制采用信心
            body: Persona 的可配置性并未消除客户的合规责任。买方仍需验证分辖区覆盖、隐私与留存控制、试点转化数据和独立准确性证据；StartWithIdentity 报告称公开 NIST 以及误接受、误拒绝基准均不存在。
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 格局与竞争架构
        blocks:
          - type: paragraph
            body: >-
              Persona 横跨多个采购类别竞争，不能压缩成一张功能清单。Persona、Jumio 等直接核验供应商执行证件、生物识别和数据库检查；Socure 把自有模型与外部数据结合；Alloy
              主要编排其他供应商。Sumsub 等更广泛套件争夺整合式 KYC、KYB、AML 和监控预算；当买方不需要完整身份运营层时，Stripe Identity
              这样的单项核验也会形成竞争。现状同样重要：买方可以保留现有核验供应商并在内部维护决策逻辑。因此 Persona 的胜负不仅取决于另一个模型，还取决于所有权、集成和治理负担不同的技术栈架构。
            claimRefs:
              - CP004
              - CP005
              - CP012
              - CP016
