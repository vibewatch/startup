            body: >-
              评估 Persona 客户持久性，需要在已验证的企业部署与严重集中风险、争议后的流失之间取得平衡。规模化生产参考包括 OpenAI——每月通过 Persona 路由数百万开发者和组织身份检查——以及公开提及的
              LinkedIn、Etsy 和 Affirm。但安全姿态失效和隐私争议会削弱客户留存。2026 年 2 月，网络安全研究人员发现属于 Persona 政府仪表盘的基础设施暴露，显示 269
              项核验和内部生物识别数据留存配置，与公开营销披露形成鲜明反差。披露后，游戏平台 Discord 原本正试用 Persona
