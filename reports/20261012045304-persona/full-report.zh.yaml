  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与定价架构
        blocks:
          - type: paragraph
            body: >-
              Persona 通过混合模式实现身份核验平台变现：既有承诺式年度订阅层，也有按使用量收取的单次核验费。公司将解决方案打包为 Essential、Growth 和 Enterprise
              方案，随着客户开户需求成熟，形成结构化的商业升级路径。对早期及低量客户，Essential Plan 提供核心证件和自拍核验工作流；自动化 Know Your
              Business（KYB）、最终受益人（UBO）发现和国际登记库集成等高级能力，则被限定在 Growth 和 Enterprise 层。为加快欧洲变现，Persona 扩展平台，在 30 个欧洲司法辖区依据
              DAC7、DSA 和 AMLD6 等区域监管要求自动化合规。通过整合零散单点方案，这种监管打包使 Persona 能够收取更高的合同价格。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI013
