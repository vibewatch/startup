        - 据称涉及美国 / 伊利诺伊州暴露
        - 低信誉技术文章；没有独立审计
        - 不确定
        - 可能很高
        - 缺少公开的实施证据
        - 留存行为和受影响记录均未核实
        - 测试删除任务，并核对代码、合同、通知和生产设置
      - - 数据驻留与跨境传输合规
        - 欧盟及其他受监管司法辖区
        - 公司说明存在正在履行的法律要求和控制选项
        - 持续
        - 高
        - 公司声称具备欧盟数据驻留、DPA、SOC 2 Type II 和 ISO 27001
        - 客户层面的配置和子处理商合规仍未核实
