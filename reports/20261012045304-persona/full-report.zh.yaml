      - number: '5.4'
        title: 信任、安全与技术风险
        blocks:
          - type: paragraph
            body: >-
              Persona 平台页面称其安全和隐私实践符合公认标准并持有认证，但指定页面没有说明认证名称、范围、审计期间或覆盖服务。当前外部报道提出了更具体的尽调问题：Cybernews
              报道某早期政府部署的源映射公开暴露，并引述 Persona 承认发布属于疏忽，且当时尚未开始深入安全审查或渗透测试。Cybernews
              还称研究人员没有证明消费者系统与政府系统之间存在直接双向数据管道，这限制了更广泛监控叙事的外延。另一篇 UBOS
              文章指称留存政策存在差异，但在依赖前必须取得一手文件。买方应要求事件复盘、范围明确的审计、留存控制、子处理方映射和客户特定的数据流证据。
            claimRefs:
              - CE012
              - CE013
              - CE014
              - CE015
