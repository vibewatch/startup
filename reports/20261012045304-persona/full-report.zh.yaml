        - 客户可能滥用
        - 对被禁止的下游决策影响高
        - 已记录合同限制
        - 指定证据未显示防止被禁止用途的控制
        - 审计产品权限、客户条款、监控和不利行动保障
    notes: 本登记表仅基于指定的预取证据池；可能性和影响的定性判断保留未核实状态，未估算责任金额。
