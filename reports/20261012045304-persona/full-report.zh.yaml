      - number: '3.3'
        title: 定价、分销与切换经济
        blocks:
          - type: paragraph
            body: >-
              公开价格不能直接比较。第三方来源报告 Persona Essential 入门价为每月 $250、最低 12 个月，而按交易收费的替代方案公布的是每次检查价格，最低承诺和包含内容不同。Vendr
              的匿名合同分析显示 Persona
              企业支出区间宽得多，但这些数字只是观察值，不是价目表，也不能证明特定买方的实际成交价。正确分母应是每个获批客户的有效成本，需计入重试、升级、复核人工、实施和保留的供应商层。迁移也有运营成本，因为切换前必须映射并双跑查询模板、检查、分支逻辑、案件状态、webhook
              语义、留存义务和审计事件。
            claimRefs:
              - CP006
