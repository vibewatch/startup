              2023 至 2025 年间，企业对自动身份核验、生物识别活体验证和监管合规基础设施的需求激增，推动 Persona 运营规模大幅扩大。据公司 2025 年 4 月以 $2.0B 估值完成 $200M D
              轮融资时披露的信息，Persona 2024 年客户数和年度收入均同比翻倍，并在当年完成超过 3 亿次身份核验。商业跟踪披露称 575 个活跃企业客户贡献了 2024 年 $141.2M
              收入，早期客户基础高度集中于需要持续重新核验的中后期科技公司和高速增长金融科技公司。Gartner 分析师认可这一运营执行力，连续第二年将 Persona 评为 2026 Gartner Magic
