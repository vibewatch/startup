            body: >-
              已记录的运营模式是可配置的流程序列，而不是公开的物理部署架构。Persona 表示客户控制增强逻辑和核验决策；官方 KYC
              指南则描述证件采集、信息提取、验证、风险评估，以及自拍、负面媒体报告和观察名单等可选检查。企业核验文档还加入工作流触发器、TIN
              与登记库检查、报告和人工操作的案件层。这一结构支持差异化风险政策，但也产生实施依赖：客户必须配置决策逻辑、集成、升级路径、数据处理和复核运营。已分配证据无法证明生产负载下的延迟、可用性、误报率、模型准确性或集成工作量。
