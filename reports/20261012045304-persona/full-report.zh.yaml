      - number: '7.3'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              暴露代码事件很重要，因为 Persona 运营的是可配置决策面：Wikipedia 页面称平台最多可执行 269 项、分属 14 类检查，同时记录 Persona
              的回应，即没有客户一次使用全部检查。覆盖面可以提高能力，但也增加配置、审计、误报和变更控制要求。公司文档显示，即便是轻量 Business Verification 产品，也协调 TIN
              和登记库检查、观察名单与负面媒体报告、工作流、案件和人工决策。文档还说明了实质范围限制：Essential 方案以美国为主，不包括 UBO KYC
              和国际登记库核验。因此满意的缓解方案需要独立复盘、渗透测试、逐项准确率与人工覆盖数据、客户特定控制映射和经过测试的回退流程。
            claimRefs:
