      - number: '1.4'
        title: 运营脆弱性、负面审查与合同后果
        blocks:
          - type: paragraph
            body: >-
              2026 年 2 月，独立网络安全研究人员发现，约 2,500 个未压缩前端文件、合计 53 MB，被托管在可公开访问的政府授权服务器端点上，Persona
              因此受到严重公开审查。暴露文件显示了内部核验工作流、筛查模块和配置记录，引发外界对供应商处理生物识别及企业身份数据方式的担忧。CEO Rick Song
              公开反驳将该事件描述为重大安全漏洞，称暴露资产全部是已分发到用户设备的客户端前端代码，无法访问后端数据库或执法部门连接。但声誉影响迅速且实质性地显现：社交通信平台 Discord 在部署不到一个月后终止与
              Persona 的身份核验合作，说明企业身份基础设施中一旦被认为存在安全疏漏和数据处理不当，客户会高度敏感。
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO013
