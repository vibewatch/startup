      - number: '1.3'
        title: 平台能力、分析师认可与里程碑演进
        blocks:
          - type: paragraph
            body: >-
              Persona 已将核心技术栈从基础的个人证件检查逐步升级为一体化、模块化身份平台。系统最多执行 269 项核验，整合自动人脸生物识别比对、活体检测、深度伪造识别、全球观察名单筛查，以及覆盖 150
              多个国家的商业登记查询。2025 年 3 月，Persona 发布统一 KYC 与 KYB 平台，新增自动企业冒名检测和所有权结构分析，用于缓解多实体欺诈网络及协同账户接管。行业认可也随之而来：2025
              年第三季度，Persona 入选 The Forrester Wave for Identity Verification Solutions 的 Leader，在战略、愿景和企业身份核验维度取得最高分，并在
              Gartner Magic Quadrant for Identity Verification 的 Ability to Execute 维度获评 Leader。
