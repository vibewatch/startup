  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础分层与买方经济
        blocks:
          - type: paragraph
            body: >-
              Persona 的客户结构覆盖四个核心商业分段：企业数字平台和市场、受监管金融机构与金融科技公司、AI 及高吞吐 API 平台，以及中型商业企业。LinkedIn、Etsy 等企业消费平台部署
              Persona，以解决分散式账户信任、卖家完整性和市场开户摩擦；Affirm 等数字贷款机构和支付网络则依靠 Persona 满足 CIP 合规、KYC 核验和交易风险缓解。高增长 AI 分段以 OpenAI 的
              “Verified Organization” 要求为锚，面向四级模型访问和高级开发者能力，驱动大规模自动筛查；OpenAI 在后台无摩擦地处理超过 99%
              的用户检查。对较小商业企业和新兴初创公司，Persona 在 Essential Plan 提供轻量级企业核验方案，处理基础美国公司实体检查和 KYB 工作流。在这些分段中，采购权分布于寻求高转化 API
              工作流的工程与产品负责人，以及必须满足联邦 KYC/AML、SAR/STR 和受益所有权报告规则的合规、风险和法律高管之间。
