              Act（BIPA）和普通法过失提起的消费者集体诉讼，被指未经授权留存数百万终端用户的人脸生物识别扫描和政府身份证件记录。这些争议会造成声誉传染，增加面向消费者品牌的采购摩擦和潜在合同流失。
