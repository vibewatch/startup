chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、运营阶段与管理层
        blocks:
          - type: paragraph
            body: >-
              Persona Identities, Inc. 由 Rick Song 和 Charles Yeh 于 2018
              年在旧金山创立，旨在解决企业身份核验中的结构性瓶颈、繁重人工环节和复杂欺诈。作为企业级身份平台，Persona 把消费者 Know Your Customer（KYC）身份检查与商业 Know Your
              Business（KYB）核验统一到一个自动化引擎中。公司主要采用软件即服务模式，按核验量收费并销售打包工作流订阅，既服务使用 Essential 方案的高增长初创公司，也服务需要在 150
              多个国家进行定制编排的全球企业平台。管理层仍高度依赖两位联合创始人：首席执行官 Rick Song 负责战略愿景、融资和对外沟通，首席技术官 Charles Yeh
              负责核验算法与系统架构。在身份核验市场竞争日益激烈的情况下，平台信誉和投资者关系高度依赖创始人持续任职，因而这一领导结构带来显著的关键人物依赖。
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO012
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
      - number: '1.2'
        title: 资本结构、估值历史与主要股东
        blocks:
          - type: paragraph
            body: >-
              自 2018 年成立以来，Persona 通过多轮机构融资累计募得约 $417M。早期扩张得到一线风投支持，包括 2021 年由 Founders Fund 领投的 B 轮，以及 2022 年的 $50M C
              轮；到 2023 年，公司估值基准达到 $1.5B。2025 年 4 月，Persona 完成由 Founders Fund 和 Ribbit Capital 共同领投的 $200M D 轮融资，投后股权估值达到
              $2.0B，并成为企业系统及新兴智能代理应用的重要身份基础设施层。机构持股集中在主要硅谷风投手中，Founders Fund 拥有显著治理影响力并参与董事会。不过，Persona
              仍是私营公司，财务细节未公开：已确认 ARR、各核验层级毛利率、净收入留存率（NRR）和净现金消耗等关键经营指标均未出现在公开申报中，因此 $2.0B 估值倍数能否持续，取决于私人投资者尽调。
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO014
