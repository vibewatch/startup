      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Persona 自有教育材料解释，数据驻留要求规定个人数据可在哪里存储和处理，不合规可能导致罚款、监管行动，甚至限制在某国运营。Persona 声称采取了欧盟数据驻留、数据处理协议、SOC 2 Type II 和
              ISO 27001 等缓解措施；这些是相关控制，但不能证明客户层面已实施、删除表现达标或在每个辖区都合规。另有 Lawfold 指称存在生物识别隐私集体诉讼，UBOS
              则指称公开留存表述与实施细节冲突。由于这些来源信誉较低，且指定资料没有一手案卷，法律状态和金额敞口仍未验证。尽调门槛应包括逐辖区数据地图、同意记录、删除日志、保险明细和一手诉讼记录。
