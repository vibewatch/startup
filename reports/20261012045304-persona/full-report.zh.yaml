  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与需求
        blocks:
          - type: paragraph
            body: >-
              Persona 所处市场小于全部网络安全或合规支出，涵盖用于核验个人和企业、编排 KYC 与 KYB
              检查、筛查观察名单及制裁名单、评估欺诈信号、把例外路由到案件并在开户后监控身份风险的软件。市场不包括核心银行账簿、交易监控系统、支付处理、企业信用承销以及受监管客户自身的政策决定。这一边界很重要，因为
              Persona
              的价值在于工作流组合：来源描述的是一组模块化检查，风险升高时可以增加摩擦，而不是让所有申请人走同一条固定路径。需求来自受监管的数字开户、平台卖家核验、欺诈压力，以及把自动检查与人工复核连接起来的需要。Persona
              和第三方评论把金融科技、支付、加密、平台、借贷和企业平台列为相关买方，但用例广泛不等于可量化的可服务支出。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM007
              - CM008
      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              已分配证据没有提供可信的出版商来源 TAM、SAM、SOM、CAGR 或市场方法论，只支持三条可辩护的规模边界。广义需求边界是全球数字身份核验；据报道 Persona 支持覆盖 200
              多个国家和地区的政府身份证件。可服务边界是需要可配置 KYC、KYB、AML、欺诈和复核工作流的组织；公开 Essential 方案起价为每月 $250，最低 12
              个月，高级层级则定制定价。可获取边界无法依据公开来源量化，因为客户核验量、层级组合、折扣安排、胜率、留存率和收入均未公开。融资额或估值不能回答这一市场问题，因此被有意排除。规模表只报告有证据支持的范围和定价锚点，并将无支撑的货币市场数值标为不可用。
            claimRefs:
              - CM006
              - CM009
              - CM010
              - CM015
