  - id: TV002
    title: 核心投资论点与反论点驱动因素
    columns:
      - 支柱
      - 论点
      - 反论点
      - 哪些情况会改变判断
    rows:
      - - 市场领导地位
        - 位于 Gartner Magic Quadrant 第一梯队，并与 OpenAI、Roblox、LinkedIn 完成关键集成
        - Sumsub、Veriff、Zyphe 等激进的低价替代方案，给报价制定价带来压力
        - 证明净收入留存率扩大至 125% 以上，且企业合同规模保持稳定
      - - 产品广度
        - 将 KYC、KYB、活体检测和自动化 AML / 监控名单合规整合在一个可配置平台中
        - Onyx 政府部署代码暴露，会在重视隐私的企业买家中引发声誉和商业阻力
        - 独立 SOC2 Type II 审计和正式 FedRAMP 安全审查，澄清所有未经授权访问的指控
      - - 收入规模
        - 增长迅速，2024 年收入达到 $141.2M，已处理超过 3 亿次身份核验
        - 缺少公开的经常性 SaaS 指标，交易量波动和毛利率结构因此不明
        - 提供经审计 GAAP 财务数据，证明毛利率超过 70%，且经常性 ARR 可预测
      - - 估值与资本结构
        - 资本实力强，总融资额 $418M，并获得 Founders Fund、Ribbit 和 Coatue 的一线支持
        - Series D 优先权形成的压力和 14.2 倍倍数，要求持续大幅增长才能实现风险投资级回报
        - 私募二级市场估值回落至 ARR 的 6 倍–8 倍，或加速推进上市准备
    notes: 论点和反论点驱动因素，用于评估商业防御力能否抵御监管、隐私和竞争逆风。
