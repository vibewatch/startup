      - number: '3.4'
        title: 持久性与不利情景
        blocks:
          - type: paragraph
            body: >-
              证据支持的护城河是运营集成，而非经独立证明的核验优越性。配置好的流程、复核程序、案件历史和审计逻辑可能嵌入客户控制环境，形成低价单次检查也未必能抵消的切换摩擦。如果专注型供应商以更低成本满足核心需求，套件整合更多相邻功能，或编排层让买方无需更换政策逻辑就能替换底层检查，这一优势就会削弱。Zyphe
              的负面信息攻击集中式数据架构，但 Zyphe 在自己的比较中明确表明是供应商，因此该说法属于竞争定位而非独立验证。可辩护的决策需要在买方自身样本上并行测试完成率、通过率、误报率、欺诈损失、延迟和人工复核结果。
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
