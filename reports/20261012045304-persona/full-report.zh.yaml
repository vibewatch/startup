      - number: '3.2'
        title: 产品范围与差异化
        blocks:
          - type: paragraph
            body: >-
              证据最能支持的 Persona 定位是集成式运营层。其文档描述了可配置 KYB-KYC 流程、自动决策规则、统一 Cases，以及报告和核验库。较轻量的 Essential
              方案企业核验套餐同时展现了覆盖面和限制：包含美国企业注册、TIN、观察名单、负面媒体、证件、工作流和案件组件，但不含 UBO KYC、国际企业登记库核验及若干更丰富报告。这一边界具有竞争意义。Persona
              可以减少复杂流程的拼接工作，但需要广泛国际、税务或监控覆盖的客户，必须确认所需模块是否包含在内，或是否仍需额外供应商。
            claimRefs:
