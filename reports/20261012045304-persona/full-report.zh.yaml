        - Essential 计划的限制已有记录
        - 实施和扩展风险中等
        - 限制已有记录；更完整的计划可用
        - 轻量方案不提供 UBO KYC 或国际注册信息核验
        - 将客户需求映射到计划、司法辖区和人工审核工作量
      - - 工作流或案件审核失败
        - 多步骤依赖已有记录
