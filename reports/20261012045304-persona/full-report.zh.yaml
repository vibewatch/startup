  - id: TV003
    title: 乐观、基准与悲观情景估值模型
    columns:
      - 情景
      - 运营假设
      - 目标倍数与隐含估值
      - 关键风险因素与下行触发点
      - 概率信号
    rows:
      - - 乐观情景
        - AI 核验需求推动 ARR 到 2027 年加速达到 $250M+；毛利率扩大至 75%；诉讼以低于 $20M 的有利金额和解
        - 12.0 倍 ARR 倍数对应 $3.0B 估值（1.5 倍 MOIC，较 Series D 价格约 15% IRR）
        - 企业客户抵触面向政府的功能；开源 KYC 模型出现
        - 20% 概率：要求执行毫无瑕疵，并迅速控制生物识别法律风险
      - - 基准情景
        - 收入以适中的 25% CAGR 增长至 $180M；毛利率稳定在 65%；BIPA 集体诉讼以适度和解准备金解决
        - 7.0 倍 ARR 倍数对应 $1.26B 估值（较 $2.0B Series D 定价收缩 37%）
        - Sumsub、Zyphe 等竞争对手带来定价压力，压低单次核验费用
        - 55% 概率：符合全行业金融科技倍数正常化和成熟市场增长
      - - 悲观情景
        - 隐私争议下增长放缓至 10% 以下；客户流失加速；BIPA 和解或不利判决金额超过 $75M
        - 4.0 倍 ARR 倍数对应 $600M 估值（Series D 普通股 / 初级股权资本减值 70%）
        - 严重声誉损害、客户取消合同，或依据 BIPA 采取监管执法行动
        - 25% 概率：鉴于集体诉讼已获认证且安全披露已公开，概率偏高
      - - 加权预期价值
        - 各情景的概率加权估值合计 $1.44B
        - 隐含加权收入倍数为 8.0 倍，对比 $2.0B 投后估值定价
        - 未对冲的 Series D 入场具有显著负向非对称回报特征
        - 100% 综合：说明为何跟踪观察是纪律严明的机构建议
    notes: 情景模型截至 2026-10-12 以公开可比公司倍数和私募金融科技折价率为基准。
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV007
      - CV009
      - CV013
      - CV014
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Persona 从 2018 年成立、风险投资规模化到产品发布及 2026 年安全审查的时间演变。
    data:
      items:
        - label: '2018: 公司成立'
          date: '2018'
          detail: Rick Song 和 Charles Yeh 在旧金山创立 Persona，旨在自动化身份核验。
          tone: positive
        - label: '2021: Series B 融资'
          date: '2021'
          detail: 完成由 Founders Fund 领投的 Series B 融资，用于扩大身份核验工作流。
          tone: positive
        - label: '2022: Series C 融资'
          date: '2022'
          detail: 收入快速增长、企业客户采用增加后，完成 $50M Series C 融资。
          tone: positive
        - label: '2023: $1.5B 估值里程碑'
          date: '2023'
          detail: 身份核验市场整合期间，投后估值达到 $1.5B 基准。
          tone: positive
        - label: '2025-03: 统一 KYC-KYB 发布'
          date: 2025-03
          detail: 发布新一代平台，将客户身份核验（KYC）与企业身份核验（KYB）整合在一起。
          tone: positive
        - label: '2025-04: Series D，估值 $2.0B'
          date: 2025-04
          detail: 完成由 Founders Fund 和 Ribbit Capital 共同领投的 $200M Series D 融资，估值达到 $2.0B。
          tone: positive
        - label: '2025-09: Forrester Wave 领导者'
          date: 2025-09
          detail: 在 2025 年第三季度的 The Forrester Wave 身份核验解决方案评测中被列为领导者。
          tone: positive
        - label: '2026-02: 公开代码暴露事件'
          date: 2026-02
          detail: 网络安全研究人员发现政府服务器上的前端文件暴露，导致 Discord 终止合作。
          tone: adverse
