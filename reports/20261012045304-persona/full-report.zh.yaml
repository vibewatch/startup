          'y': 3
          detail: 原生预测模型加混合外部数据层。
        - label: Alloy
          x: 1
          'y': 5
          detail: 以编排为先的层，依赖已连接的核验提供商。
        - label: Jumio
          x: 5
          'y': 3
          detail: 直接文件和生物识别深度，加上额外监控模块。
        - label: Sumsub
          x: 4
          'y': 4
          detail: 根据对比来源，提供更广泛的 KYC、KYB、AML 和监控套件。
        - label: Stripe Identity
          x: 3
          'y': 1
          detail: 专注于托管式或 API 检查，而非完整的身份运营套件。
    approximationNotes: 评分是分析师根据保留描述做出的序数定位，不是厂商指标或独立测试结果；没有针对具体买家的概念验证（PoC），单点差异没有意义。
    claimRefs:
      - CP004
      - CP012
      - CP016
  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 展示客户身份核验请求如何转化为计费收入和净利润率的结构化工作流。
    approximationNotes: 运营流程结构源自产品文档；具体货币数值和利润率为非公开信息。
    claimRefs:
      - CI001
      - CI005
      - CI006
    data:
      nodes:
        - id: user-inquiry
          label: 1. 终端用户核验触发
          detail: 消费者或员工提交政府身份证件、自拍生物特征或企业实体数据。
        - id: workflow-orchestration
          label: 2. Persona 动态编排
          detail: 自动化风险规则将请求导入定制核验和合规工作流。
        - id: third-party-checks
          label: 3. 第三方数据与注册信息查询
          detail: 直接查询政府数据库（AAMVA、eCBSV）和商业监控名单。
        - id: cost-of-goods-sold
          label: 4. 可变数据销货成本累计
          detail: 每次查询的 API 费用和数据库转收费从毛利率中扣除。
        - id: commercial-billing
          label: 5. 按用量与层级计费
          detail: 核验量按合同承诺或月度超额层级计费。
        - id: net-revenue-contribution
          label: 6. 毛利与平台利润率
          detail: 剩余贡献利润用于软件工程、销售 GTM 和企业运营。
  - id: FE001
    title: 公开记录的身份运营技术栈
    type: stack
    summary: Persona 的公开材料描述了从接入到监控的六个功能层，但底层基础设施和生产环境表现未披露。
    data:
      items:
        - label: 1. 体验与接入
          detail: 可配置界面采集企业、身份、文件和上下文信息。
          note: 具体字段和同意流程取决于客户配置。
        - label: 2. 信号采集
          detail: 被动、主动、行为、文件和自报信号用于评估风险。
          note: 指定证据未列举每项信号或提供商。
        - label: 3. 核验与信息增强
          detail: 可选择政府身份证件、数据库、注册信息、监控名单、负面媒体及相关检查。
          note: 覆盖范围和准确率因方法和地域而异，且未经独立基准测试。
        - label: 4. 风险与决策逻辑
          detail: 客户配置信息增强逻辑、阈值、自动决策和升级规则。
          note: 客户编写规则的治理和测试仍是尽调事项。
        - label: 5. 调查与案件
          detail: 运营人员审核汇总证据、时间线、报告、评论和边缘案件。
          note: 审核员生产力和控制有效性未公开量化。
        - label: 6. 监控与运营
          detail: 持续监控和身份数据管理将工作流延伸至客户接入之后。
          note: 留存、删除、事件响应和审计范围需要合同层面的证据。
    approximationNotes: 仅为概念性功能栈；顺序遵循公开工作流描述，不代表 Persona 未披露的基础设施拓扑。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE009
      - CE015
  - id: FU001
    title: 客户生命周期与扩展旅程图
    type: journey-map
    summary: 以视觉方式呈现客户经历 Persona 模块化接入、扩展和留存阶段的过程。
    data:
      items:
        - label: 阶段 1：初步了解与试用
          description: 技术创始人和风险负责人测试 Persona API、体验沙盒工作流，并评估核验文档。
          touchpoints:
            - 开发者文档和 API 密钥
            - 沙盒文件测试
            - Dynamic Flow UI 配置
          duration: 1-2 Weeks
          sentiment: Positive
        - label: 阶段 2：签约与基线设置
          description: 客户进入 Essential 或 Growth 层级，配置初始 API 限额和基础 KYC 或 KYB 企业核验。
          touchpoints:
            - Essential 或 Growth 计划配置
            - Webhook 和回调配置
            - 美国企业注册基线检查
          duration: 2-4 Weeks
          sentiment: Positive
        - label: 阶段 3：生产量爬坡
          description: 在客户接入漏斗中全面部署到生产环境；自动化检查处理大规模用户流量。
          touchpoints:
            - 自动化生物识别自拍检查
            - 全球政府身份证件核验
            - 实时监控名单筛查
          duration: 1-3 Months
          sentiment: Positive
        - label: 阶段 4：多产品扩展
          description: 账户从基础 KYC 扩展至 KYB 商户审核、Cases 工作流管理和持续 AML 交易监控。
          touchpoints:
            - Cases 仪表板集成
            - 定制风险规则编排
            - 自动化 SAR / STR 合规申报
          duration: 3-6 Months
          sentiment: Positive
        - label: 阶段 5：企业治理与安全审计
          description: 企业安全和法务团队审计供应商子处理商访问权限、FedRAMP 授权和生物识别数据留存政策。
          touchpoints:
            - 供应商安全问卷
            - 生物识别数据留存核验
            - BIPA 合规与同意审查
          duration: 6-9 Months
          sentiment: Mixed
        - label: 阶段 6：年度续约与用量重新谈判
          description: 企业采购部门谈判合同续约、年度核验承诺层级和多年期价格折扣。
          touchpoints:
            - 合同用量承诺
            - 分层定价重新评估
            - 平台多归属评估
          duration: Annual Renewal
          sentiment: Mixed
    approximationNotes: 生命周期阶段和触点综合自已发布的产品文档、定价计划结构和企业采购模式。
    claimRefs:
      - CU004
      - CU006
      - CU010
      - CU012
      - CU014
      - CU016
  - id: FR001
    title: 风险热力图与投资门槛
    type: matrix
    summary: 定性定位区分已观察事件、指控和未知概率，并为每项风险设置可衡量的门槛。
    data:
      columns:
        - label: 可能性证据
          detail: 已观察、被指控、持续中或未知；不是建模概率。
        - label: 影响
          detail: 失败发生时的定性下行影响。
        - label: 缓释措施成熟度
          detail: 仅限有公开证据的控制措施。
        - label: 投资门槛
          detail: 批准前所需的证据。
      rows:
        - label: 代码暴露复发
          note: 据报 2026 年发生过暴露；尚未确认复发。
          values:
            - label: 已观察一次；复发未知
              tone: risk
            - label: 高
              tone: risk
            - label: 事后复盘未公开
              tone: warning
            - label: 独立审计且不再发生暴露
              tone: neutral
        - label: 生物识别法律责任
          note: 指定证据中的公开指控缺少主要案卷。
          values:
            - label: 被指控；概率未知
              tone: warning
            - label: 可能较高
              tone: risk
            - label: 无法评估
              tone: warning
            - label: 主要案卷、准备金和保险
              tone: neutral
        - label: 数据驻留不合规
          note: 公司指出了多司法辖区要求和控制选项。
          values:
            - label: 持续暴露
              tone: warning
            - label: 高
              tone: risk
            - label: 公司声称的控制措施
              tone: warning
            - label: 客户级数据地图和删除测试
              tone: neutral
        - label: 外部数据依赖
          note: 已引用权威数据库，但缺少集中度和备用数据。
          values:
            - label: 持续依赖
              tone: warning
            - label: 高
              tone: risk
            - label: 可配置工作流
              tone: neutral
            - label: 备用覆盖范围和 SLA 历史
              tone: neutral
        - label: 产品范围不匹配
          note: Essential 计划的地域和 UBO 限制已有记录。
          values:
            - label: 已记录的限制
              tone: warning
            - label: 中等
              tone: warning
            - label: 透明的计划边界
              tone: neutral
            - label: 需求匹配和工作量测试
              tone: neutral
        - label: 续航与财务不透明
          note: 融资历史无法证明当前流动性。
          values:
            - label: 当前状况未知
              tone: warning
            - label: 高
              tone: risk
            - label: 没有经审计的公开桥接表
              tone: warning
            - label: 经审计的烧钱额和 18 个月下行情景续航
              tone: neutral
    approximationNotes: 仅为定性矩阵；不估算概率、负债、客户集中度或现金续航。
    claimRefs:
      - CR001
      - CR002
      - CR004
      - CR007
      - CR009
      - CR011
      - CR013
      - CR015
      - CR016
  - id: FV001
    title: Persona 投资决策与建议逻辑
    type: flow
    summary: 按顺序评估规模、企业验证、法律逆风、估值倍数和尽调门槛的分析框架。
    data:
      nodes:
        - id: scale
          label: 1. 市场规模与采用
          description: 已证明具备商业采用，收入 $141.2M，已在 200 多个国家处理 300M+ 次核验
        - id: product
          label: 2. 产品与企业级验证
          description: 与 OpenAI、Coursera 和 LinkedIn 的一线企业部署，将 KYC、KYB 与 AML 工作流结合起来
        - id: risks
          label: 3. 法律与监管阻力
          description: 正在进行的 BIPA 生物识别集体诉讼，以及 2026 年政府监控代码库暴露，带来重大潜在责任
        - id: valuation
          label: 4. 估值倍数与价格
          description: $2.0B 的 Series D 估值对应 14.2x 的滚动收入倍数，明显高于公开可比公司 5x-8x 的中位数
        - id: diligence
          label: 5. 尽调要求
          description: 经审计 NRR、毛利率拆分、诉讼准备金和优先权悬置均未经核实，因此必须保持谨慎
        - id: recommendation
          label: 6. 建议立场
          description: 建议纳入审慎跟踪：继续积极覆盖，但在条款更清晰前暂缓投入资金
      edges:
        - from: scale
          to: product
          label: 商业验证
        - from: product
          to: risks
          label: 隐私风险暴露
        - from: risks
          to: valuation
          label: 下行影响
        - from: valuation
          to: diligence
          label: 倍数审视
        - from: diligence
          to: recommendation
          label: 审慎姿态
    approximationNotes: 该框架梳理定性与定量的门槛因素，最终导向机构的审慎跟踪建议。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV006
      - CV007
      - CV011
