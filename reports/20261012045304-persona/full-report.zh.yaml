      - number: '7.4'
        title: 依赖、财务不透明与否决标准
        blocks:
          - type: paragraph
            body: >-
              Persona 依赖区域云安排、外部权威数据库和客户信任。其 KYC 材料把 AAMVA
              及电子同意式社会安全号码核验列为外部核验输入，数据驻留材料则指向云供应商和合同控制。这些依赖带来可用性、数据质量、本地化和供应商治理风险，尽管指定证据没有量化集中度或服务水平表现。财务韧性同样不透明：第三方报道称经审计收入和盈利能力没有公开，而已报道的
              $200M D 轮和 $2B 估值说明的是融资历史，并非当前现金、消耗或 runway。若 Persona 无法提供经审计财务桥接、至少 18 个月下行情景
              runway、头部客户和子处理方集中度、成功的独立安全测试以及重大法律指控的一手解决材料，应暂缓投资批准。
            claimRefs:
              - CR002
              - CR005
              - CR011
              - CR013
              - CR014
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR005
              - CR011
              - CR013
              - CR014
              - CR016
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 不要对未经验证的法律金额作投资判断
            body: 指定证据包含生物识别责任指控，但没有一手案卷、监管命令、和解、准备金或保险明细。应把敞口视为重大且未解决，而不是把低信誉说法换算成精确责任金额。
            calloutType: risk
            claimRefs:
              - CR006
              - CR007
              - CR015
          - type: callout
            title: 核心批准门槛
            body: 投资批准前，要求独立安全修复、一手法律记录、客户和子处理方集中度、经审计的收入到现金核对、消耗、runway、留存控制以及客户层面的数据驻留测试。
            calloutType: recommendation
