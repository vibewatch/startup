            title: 核心核验架构
            body: Persona 将自动化 KYC、KYB 和欺诈检测整合到可配置平台中，协调查询国际政府登记库和商业数据库。
            calloutType: insight
            claimRefs:
              - CO006
              - CO007
          - type: callout
            title: 客户端代码暴露与声誉传染
            body: 2026 年 2 月的端点事件表明，即使暴露的前端代码本身不构成漏洞，也可能触发急剧的声誉反弹、以 Discord 离开为代表的合作伙伴快速流失，以及更严厉的监管和商业审查。
