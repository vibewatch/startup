      - ["KYC onboarding building blocks", "Teams onboarding individual users", "Documented in Persona's 2024 KYC guidance", "Configurable checks, risk segmentation, and third-party data", "No production latency, conversion, or false-positive evidence in the assigned pool"]
      - ["Full KYB and KYC solution", "Compliance teams onboarding businesses and beneficial owners", "Launched in 2022 with named users", "Combines business checks, UBO KYC, decision logic, and case review", "Current customer usage, geographic coverage, and outcome metrics are not substantiated"]
      - ["Business Verification on Essential", "US startups needing foundational business checks", "Current help-center documentation", "Packaged TIN, registration, watchlist, adverse-media, and case workflow", "Excludes UBO KYC, international registry verification, and several report types"]
      - ["Investigation and case layer", "Risk analysts and manual reviewers", "Documented across official platform and help materials", "Connects automated checks to operator decisions and event history", "Review queues, permissions, audit exports, and service levels require customer-specific validation"]
    notes: "Package scope reflects the assigned official pages; maturity and performance are not independently benchmarked, and plan entitlements may change."
    claimRefs: [CE001, CE004, CE005, CE006, CE007, CE009]
  - id: TE002
    title: Workflow and use-case evidence
    columns:
      - User job
      - Documented workflow
      - Persona solution
      - Publicly supported benefit
      - Limitation
    rows:
      - ["Onboard an individual", "Collect identity data, extract and compare fields, validate, assess risk, and run additional checks", "Configurable KYC building blocks", "Allows checks to vary with user and risk signals", "No assigned evidence quantifies conversion, speed, or decision accuracy"]
      - ["Verify a US business on Essential", "Collect business name, address, EIN, and documents; trigger TIN, registry, and report checks", "Business Verification", "Packages foundational checks into a workflow and case", "Limited to the documented US scope and excluded reports"]
      - ["Verify a business and its owners", "Collect business and UBO data, run checks, automate decisions, and flag edge cases", "Full KYB and KYC solution", "Joins business and individual verification in one configured process", "The 2022 launch evidence does not prove present production performance"]
      - ["Monitor and investigate identity risk", "Use ongoing monitoring, link analysis, reports, and manual review", "Platform investigation and monitoring capabilities", "Supports post-onboarding risk operations", "No assigned evidence establishes alert precision, review burden, or incident response time"]
    notes: "Benefits are limited to capabilities described in company-issued materials; absent production metrics are stated as diligence gaps rather than estimates."
    claimRefs: [CE003, CE005, CE006, CE008, CE009]
  - id: TE003
    title: Technology and operating architecture
    columns:
      - Layer or process
      - Documented role
      - Key dependency
      - Principal risk or diligence ask
    rows:
      - ["Signal collection", "Collect passive, active, behavioral, document, and self-reported inputs", "Customer-selected inquiry design and lawful data collection", "Map every field, purpose, consent basis, retention period, and subprocessor"]
      - ["Verification and enrichment", "Apply configured verification methods, databases, and risk signals", "Third-party data quality and customer decision thresholds", "Obtain accuracy, bias, false-positive, and geographic coverage tests"]
      - ["Decision orchestration", "Automate decisions and route edge cases for manual review", "Workflow logic, integrations, and policy governance", "Test change controls, rollback, permissions, and explainability"]
      - ["Investigation and cases", "Consolidate results, event history, comments, and approve-or-decline actions", "Reviewer staffing, access controls, and auditability", "Inspect role design, queue performance, audit exports, and exception handling"]
      - ["Security and privacy boundary", "Protect centralized identity data and support configurable storage controls", "Certification scope, deployment controls, and incident response", "Review audit reports and the 2026 source-map exposure postmortem"]
    notes: "This is a functional operating model derived from public documentation, not a network, hosting, or data-residency schematic."
    claimRefs: [CE002, CE003, CE005, CE008, CE012, CE015]
figures:
  - id: FE001
    title: Publicly documented identity-operations stack
    type: stack
    summary: >-
      Persona's public materials describe six functional layers from intake through monitoring,
      while leaving the underlying infrastructure and production performance undisclosed.
    data:
      items:
        - label: "1. Experience and intake"
          detail: "Configurable screens collect business, identity, document, and contextual information."
          note: "Exact fields and consent flows depend on the customer configuration."
        - label: "2. Signal collection"
          detail: "Passive, active, behavioral, document, and self-reported signals inform risk."
          note: "The assigned evidence does not enumerate every signal or provider."
        - label: "3. Verification and enrichment"
          detail: "Government ID, database, registry, watchlist, adverse-media, and related checks can be selected."
          note: "Coverage and accuracy vary by method and geography and were not independently benchmarked."
        - label: "4. Risk and decision logic"
          detail: "Customers configure enrichment logic, thresholds, automated decisions, and escalation rules."
          note: "Governance and testing of customer-authored rules remain diligence items."
        - label: "5. Investigation and cases"
          detail: "Operators review consolidated evidence, timelines, reports, comments, and edge cases."
          note: "Reviewer productivity and control effectiveness are not publicly quantified."
        - label: "6. Monitoring and operations"
          detail: "Ongoing monitoring and identity-data management extend the workflow beyond onboarding."
          note: "Retention, deletion, incident response, and audit scope require contract-level evidence."
    approximationNotes: "Conceptual functional stack only; ordering follows public workflow descriptions and does not represent Persona's undisclosed infrastructure topology."
    claimRefs: [CE001, CE002, CE003, CE009, CE015]
callouts:
  - calloutType: risk
    title: Current incident evidence requires bounded interpretation
    body: >-
      Cybernews reported exposed source maps and quoted Persona acknowledging an oversight, but the
      same report says researchers did not prove a direct consumer-to-government data pipeline.
      Underwriting should focus on the verified exposure, remediation, and control review rather
      than treating the broader surveillance theory as established.
    claimRefs: [CE012, CE013]
  - calloutType: recommendation
    title: Convert trust claims into scoped technical evidence
    body: >-
      Require certification names and scope, recent penetration testing, architecture and data-flow
      diagrams, retention and deletion tests, reliability histories, model-performance breakdowns,
      and customer-specific subprocessor mappings before treating the platform's trust posture as
      verified.
    claimRefs: [CE015]
