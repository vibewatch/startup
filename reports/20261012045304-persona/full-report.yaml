  - id: FV001
    title: Persona Investment Decision and Recommendation Logic
    type: flow
    summary: >-
      Sequential analytical framework evaluating scale, enterprise proof, legal headwinds, valuation multiples, and
      diligence gating.
    data:
      nodes:
        - id: scale
          label: 1. Market Scale & Adoption
          description: Proven commercial adoption with $141.2M revenue and 300M+ verifications processed across 200+ countries
        - id: product
          label: 2. Product & Enterprise Proof
          description: Tier-1 enterprise deployment with OpenAI, Coursera, and LinkedIn combining KYC, KYB, and AML workflows
        - id: risks
          label: 3. Legal & Regulatory Headwinds
          description: >-
            Active BIPA biometric class-action lawsuit and 2026 government surveillance codebase exposure create
            substantial liability
        - id: valuation
          label: 4. Valuation Multiples & Price
          description: $2.0B Series D valuation implies a stretched 14.2x trailing revenue multiple vs 5x-8x public comp median
        - id: diligence
          label: 5. Diligence Requirements
          description: Unverified audited NRR, gross margin breakdown, litigation reserves, and preference overhang mandate caution
        - id: recommendation
          label: 6. Recommendation Stance
          description: >-
            Disciplined Track recommendation: maintain active coverage while deferring capital entry pending clearer
            terms
      edges:
        - from: scale
          to: product
          label: Commercial validation
        - from: product
          to: risks
          label: Privacy exposure
        - from: risks
          to: valuation
          label: Downside impact
        - from: valuation
          to: diligence
          label: Multiple scrutiny
        - from: diligence
          to: recommendation
          label: Disciplined posture
    approximationNotes: Framework maps qualitative and quantitative gating factors leading to the institutional Track recommendation.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV006
      - CV007
      - CV011
