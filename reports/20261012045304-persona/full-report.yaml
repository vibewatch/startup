  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Demand
        blocks:
          - type: paragraph
            body: >-
              Persona's relevant market is narrower than all cybersecurity or compliance spending. It includes software
              used to verify individuals and businesses, orchestrate KYC and KYB checks, screen watchlists and
              sanctions, assess fraud signals, route exceptions into cases, and monitor identity risk after onboarding.
              It excludes core banking ledgers, transaction-monitoring systems, payment processing, corporate-credit
              underwriting, and the regulated customer's own policy decisions. This boundary matters because Persona's
              value proposition is workflow composition: sources describe modular checks that can add friction when risk
              rises rather than forcing every applicant through one fixed path. Demand comes from regulated digital
              onboarding, marketplace seller verification, fraud pressure, and the need to connect automated checks with
              manual review. Persona and third-party reviews identify fintech, payments, crypto, marketplaces, lending,
              and enterprise platforms as relevant buyers, but the breadth of use cases should not be mistaken for
              measured addressable spend.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
