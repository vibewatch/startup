      - number: '7.2'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Persona's own educational material explains that data-residency requirements govern where personal data
              may be stored and processed, and that noncompliance can lead to fines, regulatory action, or even limits
              on operating in a country. Persona claims mitigations including EU data residency, data-processing
              agreements, SOC 2 Type II, and ISO 27001; these are relevant controls but do not prove customer-level
              implementation, deletion performance, or compliance in every jurisdiction. Separately, Lawfold alleges a
              biometric privacy class action, while UBOS alleges a conflict between public retention language and
              implementation details. Because these sources are low-reputation and the assigned pool has no primary
              docket, the legal status and monetary exposure remain unverified. The diligence gate is a
              jurisdiction-by-jurisdiction data map, consent record, deletion log, insurance schedule, and primary
              litigation record.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR009
              - CR015
      - number: '7.3'
        title: Operational, quality, and security exposure
        blocks:
          - type: paragraph
            body: >-
              The exposed-code report matters because Persona operates a configurable decision surface: the Wikipedia
              page says the platform was capable of as many as 269 checks across 14 categories, while noting Persona's
              response that no customer used all checks at once. Breadth can improve coverage, but it also increases
              configuration, audit, false-positive, and change-control demands. Company documentation shows that even
              the lightweight Business Verification product coordinates TIN and registry checks, watchlist and
              adverse-media reports, workflows, cases, and manual decisions. It also documents meaningful scope limits:
              the Essential offering is U.S.-focused and excludes UBO KYC and international registry verification. A
              satisfactory mitigation package therefore requires an independent postmortem, penetration testing,
              per-check accuracy and override data, customer-specific control mappings, and tested fallback procedures.
            claimRefs:
              - CR001
              - CR003
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR009
              - CR010
              - CR012
      - number: '7.4'
        title: Dependencies, financial opacity, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Persona depends on regional cloud arrangements, external authoritative databases, and customer trust. Its
              KYC material cites AAMVA and electronic consent-based Social Security number verification as external
              verification inputs, while its residency material points to cloud providers and contractual controls.
              Those dependencies create availability, data-quality, localization, and vendor-governance risk even though
              the assigned evidence does not quantify concentration or service-level performance. Financial resilience
              is also opaque: third-party coverage says audited revenue and profitability are not publicly available,
              while the reported $200 million Series D and $2 billion valuation establish financing history rather than
              current cash, burn, or runway. Investment approval should be withheld if Persona cannot provide audited
              financial bridges, at least 18 months of downside runway, top-customer and subprocessor concentration,
              successful independent security testing, and primary resolution of material legal allegations.
            claimRefs:
              - CR002
              - CR005
              - CR011
              - CR013
              - CR014
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR005
              - CR011
              - CR013
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not underwrite an unverified legal amount
            body: >-
              The assigned evidence includes biometric-liability allegations but no primary docket, regulator order,
              settlement, reserve, or insurance schedule. Treat exposure as material and unresolved rather than
              converting low-reputation claims into a precise liability.
            calloutType: risk
            claimRefs:
              - CR006
              - CR007
              - CR015
          - type: callout
            title: Core approval gates
            body: >-
              Require independent security remediation, primary legal records, customer and subprocessor concentration,
              audited revenue-to-cash reconciliation, burn, runway, retention controls, and customer-level
              data-residency testing before investment approval.
            calloutType: recommendation
            claimRefs:
              - CR005
              - CR013
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Recommendation, and Decision Framework
        blocks:
          - type: paragraph
            body: >-
              Persona presents a compelling enterprise software profile defined by configurable orchestration across
              Know Your Customer, Know Your Business, and automated compliance workflows. The company has secured
              leading positioning across industry benchmarks and supports high-profile accounts including OpenAI,
              LinkedIn, and Coursera. However, the $2.0B post-money valuation established in its Series D financing
              round leaves negligible cushion for execution missteps. Active consumer privacy class-action litigation
              under the Illinois Biometric Information Privacy Act introduces substantial unquantified settlement
              exposure that could impair balance-sheet liquidity. Compounding this risk, public identity and fraud
              verification peers trade at normalized multiples well below private venture marks. Consequently, the
              institutional posture on Persona is Track with Medium confidence, High risk, and a Stretched valuation
              stance until audited SaaS retention, margin bridges, and litigation reserves are verified.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV011
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV007
              - CV011
      - number: '8.2'
        title: Valuation Multiples, Financing Context, and Anti-Thesis Drivers
        blocks:
          - type: paragraph
            body: >-
              Persona completed a $200M Series D funding round in April 2025 co-led by Founders Fund and Ribbit Capital,
              stepping up from its $1.5B Series C valuation in 2021 to a $2.0B post-money mark. Against third-party
              reported 2024 annual revenue of $141.2M, this transaction implies an enterprise-value multiple of
              approximately 14.2x trailing revenue. While Persona's cumulative $418M in equity capital provides
              substantial operating runway, it also creates an imposing liquidation preference overhang for junior
              capital. Furthermore, aggressive price competition from alternative vendors such as Sumsub, Veriff, and
              Zyphe threatens per-check unit economics against Persona's quote-based model. Emerging disclosures
              regarding exposed government-facing infrastructure also introduce reputational friction among
              privacy-sensitive enterprise buyers, reinforcing the anti-thesis that multiple compression and customer
              pushback will erode private valuation premiums.
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV008
              - CV010
              - CV011
              - CV012
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV008
              - CV010
              - CV011
              - CV012
      - number: '8.3'
        title: Scenario Valuation Modeling, Downside Triggers, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Valuation scenario analysis highlights a sharply asymmetric return profile across bull, base, and bear
              operating cases. In the bull case, rapid AI agent verification adoption accelerates ARR to $250M at a
              12.0x multiple, yielding a $3.0B valuation and modest venture returns. In the base case, revenue growth
              moderates to 25% while multiples normalize to 7.0x forward revenue, contracting enterprise value to $1.26B
              and generating capital losses for Series D investors. In the bear case, acute BIPA class-action
              liabilities and customer churn trigger multiple contraction to 4.0x, compressing valuation to $600M.
              Progression to an active investment posture requires strict Phase 2 diligence asks: audited GAAP
              statements reconciling recurring ARR against transactional usage, customer cohort net retention schedules,
              and dedicated legal opinions on biometric consent exposure.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV009
              - CV013
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Disciplined Investment Stance: Track Pending Private Transparency'
            body: >-
              While Persona demonstrates impressive commercial traction and top-tier customer logos, the $2.0B Series D
              valuation leaves no margin of safety given active BIPA litigation and an unverified private gross margin
              profile. Institutional capital should track execution while insisting on full visibility into litigation
              reserves and recurring retention metrics.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV006
              - CV007
          - type: callout
            title: Biometric Legal Exposure and Multi-Million Dollar Settlement Precedents
            body: >-
              Class-action exposure under Illinois BIPA represents an acute asymmetric risk. With typical statutory
              settlements ranging from $50 to over $1,000 per claimant across a class potentially exceeding 10 million
              users, any adverse legal outcome could wipe out substantial operating liquidity.
            calloutType: risk
            claimRefs:
              - CV003
              - CV007
              - CV013
