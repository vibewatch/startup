        title: Operating architecture and implementation dependencies
        blocks:
          - type: paragraph
            body: >-
              The documented operating model is a configurable sequence rather than a disclosed physical deployment
              architecture. Persona says customers control enrichment logic and verification decisions, while official
              KYC guidance describes document collection, information extraction, validation, risk assessment, and
              optional checks such as selfies, adverse-media reports, and watchlists. The Business Verification
              documentation adds workflow triggers, TIN and registry checks, reports, and a human-operated case layer.
              This structure can support differentiated risk policies, but it also creates implementation dependencies:
              customers must configure decision logic, integrations, escalation paths, data handling, and review
              operations. The assigned evidence does not establish latency, uptime, false-positive rates, model
              accuracy, or integration effort under production load.
