          Revenue grows at moderate 25% CAGR reaching $180M; gross margins stabilize at 65%; BIPA class-action resolves
          with modest settlement reserve
        - 7.0x ARR multiple yielding $1.26B valuation (-37% contraction from $2.0B Series D mark)
        - Pricing pressure from competitors like Sumsub and Zyphe compressing per-verification fees
        - '55% probability: Consistent with industry-wide fintech multiple normalization and mature market growth'
      - - Bear Case
        - >-
          Growth decelerates below 10% amid privacy controversies; customer churn accelerates; material BIPA settlement
          or adverse judgment exceeding $75M
        - 4.0x ARR multiple yielding $600M valuation (-70% capital impairment for Series D common/junior equity)
        - Severe reputational damage, customer contract cancellations, or regulatory enforcement actions under BIPA
        - '25% probability: Elevated given active class-action certification and publicized security disclosures'
      - - Weighted Expected Value
        - Blended probability-weighted valuation of $1.44B across scenarios
        - Implied 8.0x weighted revenue multiple vs $2.0B post-money valuation mark
        - Significant negative asymmetric return profile for unhedged Series D entry
        - '100% composite: Highlights why a Track stance is the disciplined institutional recommendation'
    notes: Scenario models benchmarked against public comp multiples and private fintech discount rates as of 2026-10-12.
