              - CM015
          - type: callout
            title: Auditability Limits Adoption Confidence
            body: >-
              Persona's configurability does not eliminate customer compliance responsibility. Buyers still need
              jurisdiction-specific coverage validation, privacy and retention controls, pilot conversion data, and
              independent accuracy evidence; StartWithIdentity reports that public NIST and false-accept or false-reject
              benchmarks are absent.
            calloutType: risk
            claimRefs:
