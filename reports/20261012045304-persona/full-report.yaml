chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Stage, and Executive Leadership
        blocks:
          - type: paragraph
            body: >-
              Persona Identities, Inc. was founded in 2018 in San Francisco by Rick Song and Charles Yeh to address
              structural bottlenecks, high manual friction, and sophisticated fraud in business identity verification.
              Operating as an enterprise-grade identity platform, Persona unifies consumer Know Your Customer (KYC)
              identity checks and commercial Know Your Business (KYB) verifications into a single automated engine. The
              business operates primarily on a software-as-a-service model with volume-based verification fees and
              packaged workflow subscriptions, serving both high-growth startups on its Essential plan and global
              enterprise platforms requiring custom orchestration across 150+ countries. Executive governance remains
              closely tied to the co-founders: Chief Executive Officer Rick Song drives strategic vision, fundraising,
              and public communications, while Chief Technology Officer Charles Yeh oversees verification algorithms and
              systems architecture. This leadership structure represents substantial key-person dependence, as platform
              credibility and investor relationships heavily rely on executive founder continuity amidst an increasingly
              competitive identity verification market.
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO012
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
      - number: '1.2'
        title: Capitalization Structure, Valuation History, and Key Stakeholders
        blocks:
          - type: paragraph
            body: >-
              Persona has raised approximately $417 million in total venture capital across multiple institutional
              funding rounds since its 2018 inception. Early scaling was backed by premier venture capital sponsors,
              including a Series B round led by Founders Fund in 2021 and a $50 million Series C financing round in 2022
              that achieved a $1.5 billion valuation benchmark by 2023. In April 2025, Persona completed a $200 million
              Series D financing round co-led by Founders Fund and Ribbit Capital, establishing a $2.0 billion
              post-money equity valuation and positioning Persona as a critical identity infrastructure layer for
              enterprise systems and emerging agentic artificial intelligence applications. Institutional shareholding
              is concentrated among major Silicon Valley venture firms, with Founders Fund holding prominent governance
              influence and board participation. However, Persona operates as a private business with undisclosed
              financial details: key operational performance metrics, including recognized annual recurring revenue
              (ARR), gross profit margins by verification tier, net revenue retention (NRR), and net cash burn, remain
              unavailable in public filings, leaving the sustainability of its $2.0 billion valuation multiple
              contingent on private investor diligence.
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
