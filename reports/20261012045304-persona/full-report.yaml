  - id: FI001
    title: Revenue Model Bridge
    type: flow
    summary: >-
      Structural workflow showing how customer identity verification inquiries translate into billed revenue and net
      margin.
    approximationNotes: >-
      Operational flow structure is derived from product documentation; exact monetary values and margin percentages are
      private.
    claimRefs:
      - CI001
      - CI005
      - CI006
    data:
      nodes:
        - id: user-inquiry
          label: 1. End-User Verification Trigger
          detail: Consumer or employee submits government ID, selfie biometrics, or business entity data.
        - id: workflow-orchestration
          label: 2. Persona Dynamic Orchestration
          detail: Automated risk rules route inquiry through custom verification and compliance workflows.
        - id: third-party-checks
          label: 3. Third-Party Data & Registry Inquiries
          detail: Direct queries executed against government databases (AAMVA, eCBSV) and commercial watchlists.
        - id: cost-of-goods-sold
          label: 4. Variable Data COGS Accrual
          detail: Per-lookup API query fees and database pass-through expenses deducted from gross margin.
        - id: commercial-billing
          label: 5. Consumption & Tier Billing
          detail: Verification volume billed against contract commitments or monthly overage tiers.
        - id: net-revenue-contribution
          label: 6. Gross Profit & Platform Margin
          detail: Residual contribution margin funding software engineering, sales GTM, and enterprise operations.
  - id: FE001
    title: Publicly documented identity-operations stack
    type: stack
    summary: >-
      Persona's public materials describe six functional layers from intake through monitoring, while leaving the
      underlying infrastructure and production performance undisclosed.
    data:
      items:
        - label: 1. Experience and intake
          detail: Configurable screens collect business, identity, document, and contextual information.
          note: Exact fields and consent flows depend on the customer configuration.
        - label: 2. Signal collection
          detail: Passive, active, behavioral, document, and self-reported signals inform risk.
          note: The assigned evidence does not enumerate every signal or provider.
        - label: 3. Verification and enrichment
          detail: Government ID, database, registry, watchlist, adverse-media, and related checks can be selected.
          note: Coverage and accuracy vary by method and geography and were not independently benchmarked.
        - label: 4. Risk and decision logic
          detail: Customers configure enrichment logic, thresholds, automated decisions, and escalation rules.
          note: Governance and testing of customer-authored rules remain diligence items.
        - label: 5. Investigation and cases
          detail: Operators review consolidated evidence, timelines, reports, comments, and edge cases.
          note: Reviewer productivity and control effectiveness are not publicly quantified.
        - label: 6. Monitoring and operations
          detail: Ongoing monitoring and identity-data management extend the workflow beyond onboarding.
          note: Retention, deletion, incident response, and audit scope require contract-level evidence.
    approximationNotes: >-
      Conceptual functional stack only; ordering follows public workflow descriptions and does not represent Persona's
      undisclosed infrastructure topology.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE009
      - CE015
  - id: FU001
    title: Customer Lifecycle and Expansion Journey Map
    type: journey-map
    summary: Visual mapping of customer progression through Persona's modular onboarding, expansion, and retention stages.
    data:
      items:
        - label: 'Phase 1: Initial Discovery & Trial'
          description: >-
            Technical founders and risk leads test Persona APIs, sample sandbox workflows, and evaluate verification
            documentation.
          touchpoints:
            - Developer documentation and API keys
            - Sandbox document testing
            - Dynamic Flow UI configuration
          duration: 1-2 Weeks
          sentiment: Positive
        - label: 'Phase 2: Contract Signing & Baseline Setup'
          description: >-
            Customer enters Essential or Growth tier, provisioning initial API limits and foundational KYC or KYB
            business verification.
          touchpoints:
            - Essential or Growth plan provisioning
            - Webhook and callback configurations
            - Baseline US business registration checks
          duration: 2-4 Weeks
          sentiment: Positive
        - label: 'Phase 3: Production Volume Ramp'
          description: >-
            Full production deployment across customer onboarding funnel; automated checks process high-volume user
            traffic.
          touchpoints:
            - Automated biometric selfie checks
            - Global government ID validation
            - Real-time watchlist screening
          duration: 1-3 Months
          sentiment: Positive
        - label: 'Phase 4: Multi-Product Expansion'
          description: >-
            Account expands from basic KYC into KYB merchant review, Cases workflow management, and continuous AML
            transaction monitoring.
          touchpoints:
            - Cases dashboard integration
            - Custom risk rule orchestration
            - Automated SAR/STR compliance filing
          duration: 3-6 Months
          sentiment: Positive
        - label: 'Phase 5: Enterprise Governance & Security Audit'
          description: >-
            Enterprise security and legal teams audit vendor subprocessor access, FedRAMP authorizations, and biometric
            retention policies.
          touchpoints:
            - Vendor security questionnaire
            - Biometric data retention verification
            - BIPA compliance and consent review
          duration: 6-9 Months
          sentiment: Mixed
        - label: 'Phase 6: Annual Renewal & Volume Renegotiation'
          description: >-
            Enterprise procurement negotiates contract renewal, annual verification commitment tiers, and multi-year
            pricing discounts.
          touchpoints:
            - Contract volume commitments
            - Tiered pricing re-evaluation
            - Platform multi-homing assessment
          duration: Annual Renewal
          sentiment: Mixed
    approximationNotes: >-
      Lifecycle phases and touchpoints synthesized from published product documentation, pricing plan structures, and
      enterprise procurement patterns.
