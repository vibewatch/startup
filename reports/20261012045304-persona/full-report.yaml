      - number: '1.3'
        title: Platform Capabilities, Analyst Recognition, and Milestone Evolution
        blocks:
          - type: paragraph
            body: >-
              Persona has steadily evolved its core technology stack from baseline individual document inspection into
              an integrated, modular identity platform. The system conducts up to 269 verification checks, integrating
              automated facial biometric comparisons, liveness inspection, deepfake detection, global watchlist
              screening, and commercial registry lookups across more than 150 countries. In March 2025, Persona expanded
              its business verification capabilities by releasing a unified KYC and KYB platform featuring automated
              corporate impersonation detection and ownership structure analysis, designed to mitigate multi-entity
              fraud networks and coordinated account takeovers. These capabilities have earned prominent industry
              recognition: in Q3 2025, Persona was named a Leader in The Forrester Wave for Identity Verification
              Solutions, securing top scores in strategy, vision, and business identity verification, alongside
              placement as a Leader in the Gartner Magic Quadrant for Identity Verification for Ability to Execute.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO011
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO007
              - CO008
              - CO009
              - CO010
      - number: '1.4'
        title: Operational Vulnerabilities, Adverse Scrutiny, and Contract Fallout
        blocks:
          - type: paragraph
            body: >-
              In February 2026, Persona encountered severe public scrutiny when independent cybersecurity researchers
              identified approximately 2,500 uncompressed front-end files totaling 53 megabytes hosted on a publicly
              accessible government-authorized server endpoint. The exposed files revealed internal verification
              workflows, screening modules, and configuration records, sparking concerns regarding the vendor-level
              handling of biometric and corporate identity data. CEO Rick Song publicly disputed characterizations of
              the incident as a critical security vulnerability, asserting that the exposed assets consisted exclusively
              of client-side front-end code already distributed across user devices and lacked access to backend
              databases or law enforcement connections. Nevertheless, the reputational impact was immediate and
              material: social communications platform Discord terminated its identity verification engagement with
              Persona less than one month after deployment, demonstrating client-level sensitivity to perceived security
              lapses and data mishandling in enterprise identity infrastructure.
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO013
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Core Verification Architecture
            body: >-
              Persona combines automated KYC, KYB, and fraud detection into a single configurable platform that
              coordinates checks across international government registries and commercial databases.
            calloutType: insight
            claimRefs:
              - CO006
              - CO007
          - type: callout
            title: Client-Side Code Exposure and Reputational Contagion
            body: >-
              The February 2026 endpoint incident demonstrated that even non-vulnerability front-end code exposures can
              trigger acute reputational backlash, rapid partner churn such as Discord's departure, and intensified
              regulatory and commercial scrutiny.
            calloutType: risk
            claimRefs:
              - CO009
