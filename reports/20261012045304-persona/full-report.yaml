      - number: '3.2'
        title: Product scope and differentiation
        blocks:
          - type: paragraph
            body: >-
              Persona's strongest evidence-backed position is an integrated operating layer. Its documentation describes
              configurable KYB-KYC flows, automated decision rules, consolidated Cases, and a library of reports and
              verifications. The lighter Essential-plan Business Verification package demonstrates both packaging reach
              and limits: it covers US business registration, TIN, watchlist, adverse-media, document, workflow, and
              case components, but excludes UBO KYC, international business-registry verification, and several richer
              reports. That boundary matters competitively. Persona can reduce stitching work for complex flows, yet a
              customer needing broad international, tax, or monitoring coverage must verify whether the required modules
              are included or whether additional vendors remain necessary.
            claimRefs:
              - CP001
