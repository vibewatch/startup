      - CU006
      - CU010
      - CU012
      - CU014
      - CU016
  - id: FR001
    title: Risk heatmap and investment gates
    type: matrix
    summary: >-
      Qualitative positioning distinguishes observed events from allegations and unknown probabilities, with a
      measurable gate for each risk.
    data:
      columns:
        - label: Likelihood evidence
          detail: Observed, alleged, ongoing, or unknown; not a modeled probability.
        - label: Impact
          detail: Qualitative downside if the failure occurs.
        - label: Mitigation maturity
          detail: Publicly evidenced controls only.
        - label: Investment gate
          detail: Evidence required before approval.
      rows:
        - label: Code exposure recurrence
          note: A 2026 exposure was reported; recurrence is not established.
          values:
            - label: Observed once; recurrence unknown
              tone: risk
            - label: High
              tone: risk
            - label: Postmortem not public
              tone: warning
            - label: Independent audit and no repeat exposure
              tone: neutral
        - label: Biometric legal liability
          note: Public allegations lack a primary docket in the assigned evidence.
          values:
            - label: Alleged; probability unknown
              tone: warning
            - label: Potentially high
              tone: risk
            - label: Not assessable
              tone: warning
            - label: Primary docket, reserves, and insurance
              tone: neutral
        - label: Data residency noncompliance
          note: The company identifies multi-jurisdiction requirements and control options.
          values:
            - label: Ongoing exposure
              tone: warning
            - label: High
              tone: risk
            - label: Company-claimed controls
              tone: warning
            - label: Customer-level data maps and deletion tests
              tone: neutral
        - label: External-data dependency
          note: Authoritative databases are cited, but concentration and fallback data are absent.
          values:
            - label: Ongoing dependency
              tone: warning
            - label: High
              tone: risk
            - label: Configurable workflows
              tone: neutral
            - label: Fallback coverage and SLA history
              tone: neutral
        - label: Product-scope mismatch
          note: The Essential plan has documented geographic and UBO limitations.
          values:
            - label: Documented limitation
              tone: warning
            - label: Medium
              tone: warning
            - label: Transparent plan boundaries
              tone: neutral
            - label: Fit-to-requirement and workload test
              tone: neutral
        - label: Runway and financial opacity
          note: Financing history does not establish current liquidity.
          values:
            - label: Current condition unknown
              tone: warning
            - label: High
              tone: risk
            - label: No audited public bridge
              tone: warning
            - label: Audited burn and 18-month downside runway
              tone: neutral
    approximationNotes: Qualitative matrix only; it does not estimate probabilities, liabilities, customer concentration, or cash runway.
