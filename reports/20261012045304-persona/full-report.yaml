              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and competing architectures
        blocks:
          - type: paragraph
            body: >-
              Persona competes across several purchasing categories that should not be collapsed into one feature list.
              Direct verification vendors such as Persona and Jumio execute document, biometric, and database checks;
              Socure combines native models with external data; Alloy primarily orchestrates other providers. Broader
              suites such as Sumsub compete for consolidated KYC, KYB, AML, and monitoring budgets, while a focused
              check such as Stripe Identity competes when the buyer does not need a full identity-operations layer. The
              status quo is also material: a buyer can retain existing verification vendors and maintain decision logic
              internally. Persona therefore wins or loses not only against another model, but against different stack
              architectures with different ownership, integration, and governance burdens.
            claimRefs:
              - CP004
              - CP005
              - CP012
              - CP016
