      - number: '4.2'
        title: Cost Structure, Unit Economics, and Margin Drivers
        blocks:
          - type: paragraph
            body: >-
              The economics of identity verification are governed by a complex cost of goods sold structure driven by
              variable third-party data access fees. To complete identity inquiries, Persona programmatically queries
              authoritative government databases including the American Association of Motor Vehicle Administrators
              (AAMVA) and electronic Consent Based Social Security Number Verification (eCBSV), alongside commercial
              watchlists and international business registries. Because each external database lookup incurs direct
              per-transaction access fees, Persona's gross margin varies significantly based on workflow complexity and
              geographic mix. While software orchestration commands software-like leverage, high-volume document parsing
              and biometric liveness checks consume compute and external data subsidies that compress unit
              profitability. Persona has not disclosed audited GAAP gross margins or net revenue retention cohorts,
              leaving unit economics as a primary diligence focus for institutional underwriters.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI006
              - CI007
              - CI014
      - number: '4.3'
        title: Commercial Scale and Public Traction Benchmarks
        blocks:
          - type: paragraph
            body: >-
              Third-party market estimates indicate that Persona reached $141.2 million in annual revenue in 2024,
              representing approximate year-over-year doubling from prior periods. The company supported 575 active
              customers while processing over 300 million identity verifications across more than 200 countries and
              territories. This commercial profile implies an average revenue per account (ARPA) of approximately
              $245,000, underscoring Persona's successful transition from developer-centric self-serve signups to
              enterprise-scale contracts. Enterprise customer acquisition is propelled by direct enterprise sales teams
              and reinforced by integration partnerships in the Persona Marketplace with enterprise systems including
              Salesforce, Slack, and Clearbit. However, public disclosures do not disaggregate transactional usage
              spikes from committed recurring ARR, creating ambiguity around base revenue predictability.
            claimRefs:
              - CI004
              - CI007
              - CI008
      - number: '4.4'
        title: Security Exposure, Incident Backlash, and Contract Durability
        blocks:
          - type: paragraph
            body: >-
              Commercial momentum encountered severe scrutiny in February 2026 when security researchers discovered
              2,456 frontend source files and 53 megabytes of Persona's government deployment exposed on a public
              FedRAMP server. The exposed codebase revealed 269 verification checks, direct Suspicious Activity Report
              filing capabilities to FinCEN and FINTRAC, and three-year biometric retention practices. Consumer backlash
              quickly prompted Discord, which had been conducting a UK age verification trial using Persona, to
              terminate its partnership within a month of deployment. This high-profile cancellation revealed that
              outsourced identity infrastructure carries profound headline sensitivity. For prospective enterprise
              buyers and current compliance customers, the incident raised switching-cost questions and highlighted
              potential churn vulnerability among consumer-facing platforms facing user privacy concerns.
            claimRefs:
              - CI009
              - CI010
      - number: '4.5'
        title: Capital Adequacy and Financial Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              From a balance sheet perspective, Persona maintains substantial capital adequacy following its $200
              million Series D funding round in 2024, which brought total cumulative equity raised to $418 million at a
              $2.0 billion post-money valuation. While Persona does not face near-term liquidity pressure or an
              immediate requirement to raise capital, its financial underwriting score remains tempered. The combination
              of opaque GAAP gross margins, undisclosed cohort churn rates, and reputational risk following the FedRAMP
              code exposure creates material underwriting uncertainty. Investors cannot confirm whether the $2.0 billion
              valuation multiple reflects durable high-margin software revenue or volume-sensitive transaction fees
              without auditing confidential contribution margins, renewal schedules, and customer concentration data in
              private due diligence.
            claimRefs:
              - CI011
              - CI012
              - CI014
      - number: '4.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Enterprise Churn and Incident Reputational Exposure
            body: >-
              The swift cancellation of the Discord partnership following the February 2026 code exposure highlights
              that enterprise identity contracts carry headline sensitivity. While Persona holds substantial balance
              sheet liquidity, heightened regulatory scrutiny and prospective customer hesitation could suppress net
              expansion rates and lengthen sales cycles.
            calloutType: risk
            claimRefs:
              - CI009
              - CI010
          - type: callout
            title: High ARPA Masks Unit-Level Gross Margin Uncertainty
            body: >-
              An implied 2024 ARPA of approximately $245,000 indicates meaningful enterprise penetration among
              high-volume customers. However, because verification pricing relies on external database lookups with
              variable cost pass-throughs, realized gross margins remain opaque and cannot be verified without private
              contribution margin data.
            calloutType: insight
            claimRefs:
              - CI006
              - CI007
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Persona is sold as configurable identity infrastructure rather than a single verification check. Its
              official platform describes a workflow that collects passive, active, and behavioral signals, applies
              verification and enrichment methods, supports investigations, and centralizes identity operations. Public
              materials show meaningful packaging differences: the Essential-plan Business Verification product is a
              limited US-focused workflow, while the broader KYB product was launched with UBO verification,
              configurable collection, automated decisions, and manual review for edge cases. The practical customer job
              is therefore not merely confirming an ID; it is assembling a risk-based onboarding and monitoring process.
              However, each buyer must determine which checks, reports, geographies, and operator actions are actually
              included in its plan and implementation.
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE005
              - CE006
