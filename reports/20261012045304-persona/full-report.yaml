      - number: '3.3'
        title: Pricing, distribution, and switching economics
        blocks:
          - type: paragraph
            body: >-
              Public prices are not directly comparable. A third-party source reports Persona's Essential entry at $250
              per month with a twelve-month minimum, whereas transaction-based alternatives publish per-check rates with
              different minimums and inclusions. Vendr's anonymized contract analysis describes a much wider Persona
              enterprise spend range, but those figures are observations rather than a rate card and do not establish
              realized price for a specific buyer. The correct denominator is effective cost per approved customer after
              retries, escalations, review labor, implementation, and retained vendor layers. Migration also carries
              operational cost because inquiry templates, checks, branch logic, case states, webhook semantics,
              retention duties, and audit events must be mapped and dual-run before cutover.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
