      - number: '2.3'
        title: Buyer Segmentation and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The economic buyer varies with the workflow. Compliance and risk teams own KYC, AML, sanctions, and
              business-verification policy; fraud or trust-and-safety teams own coordinated-abuse investigations;
              product and engineering teams integrate the user journey; and the enterprise operating the platform is the
              payer while applicants and merchants are end users. This mapping is an analytical inference from the
              workflows described in the retained sources, not a disclosed Persona budget survey. Adoption benefits from
              progressive risk segmentation because it can reserve extra checks and manual review for higher-risk cases.
              Constraints are equally material: broad configurability increases implementation work, customers retain
              responsibility for regulatory decisions and privacy controls, advanced pricing is private, and
              StartWithIdentity reports no public NIST face benchmark or published false-accept and false-reject rates
              for Persona. The Essential business-verification package is also US-focused and excludes UBO KYC and
              international registry verification, narrowing the entry-tier serviceable segment.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM010
              - CM011
              - CM012
              - CM013
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM005
              - CM007
              - CM008
              - CM016
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Scope Is Evident; Market Size Is Not
            body: >-
              The sources consistently describe a broad workflow surface and diverse buyer set, but none supplies a
              supportable market-spend denominator, CAGR, or Persona share. Product breadth and global technical
              coverage therefore define a demand boundary, not a quantified TAM.
            calloutType: insight
            claimRefs:
