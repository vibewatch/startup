              - CP008
              - CP009
              - CP010
      - number: '3.4'
        title: Durability and the adverse case
        blocks:
          - type: paragraph
            body: >-
              The moat supported by this evidence is operational integration, not independently proven verification
              superiority. Configured flows, reviewer procedures, case histories, and audit logic can become embedded in
              a customer's control environment, creating switching friction that a lower per-check quote may not offset.
              That advantage can erode if focused vendors meet the core requirement more cheaply, suites consolidate
              more adjacent functions, or orchestration layers let buyers swap underlying checks without replacing
              policy logic. Adverse messaging from Zyphe attacks centralized data architecture, but Zyphe expressly
              identifies itself as a vendor in its own comparison, so the claim is competitive positioning, not
              independent validation. A defensible decision requires a parallel test on the buyer's own population
              measuring completion, approval, false-positive, fraud-loss, latency, and manual-review outcomes.
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Performance moat remains unproven
            body: >-
              The retained evidence distinguishes architectures and operating scope but provides no independent,
              cohort-matched benchmark showing Persona outperforms direct peers on approval, fraud loss, false
              positives, latency, or review load.
            calloutType: risk
            claimRefs:
              - CP004
              - CP013
              - CP015
          - type: callout
            title: Normalize on approved-customer economics
            body: >-
              Compare quotes only after adding retries, escalations, manual review, implementation, minimum commitments,
              and any underlying providers; then validate the result through a parallel run on representative traffic.
            calloutType: recommendation
            claimRefs:
              - CP010
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              Persona monetizes its identity verification platform through a hybrid model that combines committed annual
              subscription tiers with usage-based per-verification fees. The company packages its solutions into
              Essential, Growth, and Enterprise plans, creating structured commercial upsell paths as customer
              onboarding requirements mature. For early-stage and lower-volume customers, the Essential Plan provides
              core document and selfie verification workflows, while advanced capabilities such as automated Know Your
              Business (KYB), ultimate beneficial owner (UBO) discovery, and international registry integrations are
              gated behind Growth and Enterprise tiers. To accelerate European monetization, Persona expanded its
              platform to automate compliance under regional mandates including DAC7, DSA, and AMLD6 across 30 European
              jurisdictions. This regulatory packaging enables Persona to command premium contract pricing by
              consolidating fragmented point solutions into a unified orchestration platform.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI013
          - type: table
            tableRef: TI001
            claimRefs:
