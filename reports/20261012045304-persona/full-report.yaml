      - number: '2.2'
        title: Evidence-Constrained Sizing
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not provide a credible publisher-sourced TAM, SAM, SOM, CAGR, or market
              methodology. It instead supports three defensible sizing boundaries. The broad demand boundary is global
              digital identity verification, with Persona reported to support government IDs across more than 200
              countries and territories. The serviceable boundary is organizations that need configurable KYC, KYB, AML,
              fraud, and review workflows; the public Essential offer starts at $250 per month with a 12-month minimum,
              while advanced tiers are custom-priced. The obtainable boundary cannot be quantified from public sources
              because customer verification volumes, tier mix, discount schedules, win rates, retention, and revenue are
              absent. A funding amount or valuation would not answer this market question and is deliberately excluded.
              The sizing table therefore reports supported scope and pricing anchors while marking unsupported monetary
              market values as unavailable.
            claimRefs:
