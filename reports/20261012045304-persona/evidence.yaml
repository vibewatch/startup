evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure-gaps
    missingEvidence: >-
      Audited annual recurring revenue (ARR), gross margin percentages by product tier, net revenue retention (NRR), and
      cash burn rate.
    whyItMatters: >-
      Essential for verifying whether Persona's $2.0B Series D valuation is supported by durable revenue quality and
      capital efficiency.
    diligencePath: >-
      Request audited GAAP financial statements, ARR bridge by product line, and detailed customer cohort retention
      schedules under NDA.
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-cap-table-enumeration
    missingEvidence: >-
      Full cap table showing exact percentage ownership, option pool reserves, liquidation preferences, and secondary
      transaction records.
    whyItMatters: >-
      Necessary to assess downside protection, founder economic dilution, and voting control distribution across
      institutional holders.
    diligencePath: Review certified cap table, investor rights agreements, and secondary sale transfer logs in the virtual data room.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Publisher-sourced market values and growth methodology, plus Persona customer volumes, tier mix, realized pricing,
      win rates, retention, and recognized revenue.
    whyItMatters: >-
      Without consistent market denominators and company operating inputs, neither serviceable spend nor Persona's
      obtainable share can be estimated without false precision.
    diligencePath: >-
      Commission a category-spend study with explicit inclusion rules and reconcile it to management-provided customer
      cohorts, contracts, usage volumes, retention, and recognized revenue.
    relatedQuestionRefs:
      - QM002
      - QM010
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: independent-performance-benchmark
    missingEvidence: >-
      An independent, cohort-matched benchmark of approval rate, false positives, fraud loss, completion, latency, and
      manual-review load across Persona and direct peers.
    whyItMatters: >-
      Without outcome evidence, workflow breadth and vendor claims cannot establish a durable accuracy or conversion
      moat.
    diligencePath: >-
      Run a blinded parallel proof of concept on representative geographies, document types, risk bands, and known-fraud
      cohorts with pre-agreed outcome definitions.
    relatedQuestionRefs:
      - QP006
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-and-lock-in
    missingEvidence: >-
      Customer contracts, realized invoices, minimum commitments, overage schedules, module entitlements, renewal terms,
      and migration-service costs for comparable deployments.
    whyItMatters: >-
      Public and anonymized pricing signals use incompatible denominators and cannot establish total cost or contractual
      lock-in for the target buyer.
    diligencePath: >-
      Collect redacted quotes and contracts from Persona and at least two architecture-matched alternatives, then
      normalize all costs per approved customer under the same traffic assumptions.
    relatedQuestionRefs:
      - QP003
      - QP005
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics-opacity
    missingEvidence: >-
      Audited GAAP gross margin breakdown by product line (document verification, biometric match, KYB data
      pass-through) and net revenue retention (NRR) cohorts.
    whyItMatters: >-
      Gross margin and cohort retention determine long-term unit economics, gross profit durability, and whether
      customer expansion offsets high third-party data COGS.
    diligencePath: >-
      Request audited financials and management contribution margin reports by customer cohort during private dataroom
      inspection.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: contract-churn-and-arr
    missingEvidence: >-
      Current active ARR, contract renewal rates, and churn impact across enterprise accounts following the February
      2026 FedRAMP code exposure incident.
    whyItMatters: >-
      Public controversy led to the swift cancellation of the Discord partnership; underwriters must quantify whether
      pipeline velocity or contract renewals slowed across other enterprise clients.
    diligencePath: >-
      Perform reference checks with enterprise compliance buyers and review renewal cohort tables in confidential
      diligence.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI001
  - type: missing-source
    severity: material
    topic: performance-claims
    missingEvidence: >-
      Independent Persona-specific latency, uptime, verification accuracy, false-positive, bias, and conversion
      benchmarks by method and geography.
    whyItMatters: >-
      Without denominators and production conditions, configurability cannot be translated into technical or customer
      outcomes.
    diligencePath: >-
      Obtain recent service-level histories, model cards, benchmark protocols, cohort results, and reference calls from
      production customers.
    relatedQuestionRefs:
      - QE004
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public repository activity, SDK or package adoption, API changelog cadence, developer-forum activity, or a
      credible practitioner-community proxy.
    whyItMatters: The assigned pool cannot establish developer adoption, integration quality, release velocity, or ecosystem health.
    diligencePath: >-
      Request private API and SDK release histories, package usage, integration-support metrics, and practitioner
      references from customer engineering teams.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: security-assurance
    missingEvidence: >-
      Certification names and scope, current audit reports, penetration tests, subprocessor mappings, data-residency
      diagrams, and retention and deletion test results.
    whyItMatters: A general standards claim does not establish which products, regions, or controls were independently assessed.
    diligencePath: >-
      Review the trust-center evidence under NDA and map every control and exception to the proposed customer
      deployment.
    relatedQuestionRefs:
      - QE005
  - type: missing-source
    severity: material
    topic: security-incident
    missingEvidence: >-
      A complete Persona postmortem for the 2026 source-map exposure, including affected assets, access logs,
      remediation, external testing, and customer notification.
    whyItMatters: >-
      The available report establishes an acknowledged oversight but not exposure duration, exploitation, data impact,
      or control effectiveness after remediation.
    diligencePath: >-
      Request the incident report, forensic timeline, remediation evidence, subsequent penetration-test results, and
      board or risk-committee review.
    relatedQuestionRefs:
      - QE005
  - type: missing-source
    severity: minor
    topic: roadmap
    missingEvidence: >-
      A dated roadmap and lifecycle policy for modules, integrations, reports, verification methods, and plan
      entitlements.
    whyItMatters: >-
      Public pages describe current and historical capabilities but do not establish delivery commitments or deprecation
      risk.
    diligencePath: >-
      Review the product roadmap, release notes, deprecation notices, and contractual support commitments with product
      leadership.
    relatedQuestionRefs:
      - QE002
      - QE003
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: >-
      Audited net revenue retention (NRR), gross revenue retention (GRR), and logo churn curves across annual customer
      cohorts.
    whyItMatters: >-
      Without NRR and cohort churn data, investors cannot verify whether Persona's revenue expansion is driven by
      expanding software adoption within existing accounts or vulnerable to high account turnover.
    diligencePath: >-
      Request confidential management presentations detailing historical cohort retention bridges, gross dollar churn,
      and expansion ARR by product line under NDA.
    relatedQuestionRefs:
      - QU002
      - QU007
    relatedTableRefs:
      - TU002
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Granular revenue breakdown by customer showing percentage share of ARR contributed by the top 5 and top 10
      accounts, specifically OpenAI.
    whyItMatters: >-
      Given the immense verification volume generated by anchor accounts like OpenAI, loss of a key client or pricing
      renegotiation could severely impair operating cash flow and valuation multiples.
    diligencePath: >-
      Obtain an audited top-20 customer revenue concentration schedule showing annual contract values, contract
      duration, and renewal dates.
    relatedQuestionRefs:
      - QU001
      - QU007
    relatedTableRefs:
      - TU001
      - TU003
  - type: conflicting-data
    severity: minor
    topic: active-customer-count
    missingEvidence: Audited count of active enterprise clients paying more than $10,000 ARR compared to overall registered accounts.
    whyItMatters: >-
      Market tracking reports 575 active customers in 2024, whereas earlier marketing materials and press releases cited
      broader customer numbers without clarifying account tier or activity thresholds.
    diligencePath: >-
      Verify customer count definitions in billing system exports, segmenting between self-serve Essential users and
      contracted enterprise Growth/Enterprise accounts.
    relatedQuestionRefs:
      - QU002
    relatedTableRefs:
      - TU002
  - type: enumeration-incomplete
    severity: material
    topic: legal-evidence-gap
    missingEvidence: >-
      Primary dockets, regulator records, current case status, claimed damages, reserves, and applicable insurance for
      every material legal matter.
    whyItMatters: >-
      Without primary records, neither the existence, status, probability, nor monetary exposure of alleged proceedings
      can be underwritten.
    diligencePath: >-
      Require outside-counsel letters, docket identifiers, pleadings, settlement documents, regulator correspondence,
      reserve workpapers, and insurance schedules.
    relatedQuestionRefs:
      - QR001
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited revenue, gross margin, cash, burn, working capital, runway, customer concentration, financing preferences,
      and downside liquidity plan.
    whyItMatters: Funding raised is not cash available, and public estimates cannot support a runway or solvency judgment.
    diligencePath: >-
      Review audited statements, monthly management accounts, bank balances, cash-flow forecast, cohort economics, cap
      table, and financing documents.
    relatedQuestionRefs:
      - QR004
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: security-incident
    missingEvidence: >-
      Independent incident postmortem, affected-data scope, root cause, remediation validation, penetration test, and
      customer notification record.
    whyItMatters: >-
      Public code exposure is established only at a reporting level; recurrence risk and actual data impact remain
      unknown.
    diligencePath: >-
      Obtain the final incident report, independent forensic opinion, remediation evidence, security-test results, and
      board or customer communications.
    relatedQuestionRefs:
