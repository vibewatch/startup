company:
  name: Persona
chapter:
  number: 1
  title: Company Overview
  summary: Persona is a San Francisco-based identity verification and automated fraud prevention platform founded in 2018, valued at $2.0B post-money following a $200M Series D round in April 2025. Co-founded by CEO Rick Song and CTO Charles Yeh, the company provides integrated KYC and KYB verification workflows across 150+ countries. Despite recognized technical leadership from Forrester and Gartner, Persona faces heightened market scrutiny following a February 2026 public code exposure incident that prompted customer churn, including the departure of Discord.
sections:
  - id: corporate-identity-and-leadership
    title: Corporate Identity, Operating Stage, and Executive Leadership
    body: 'Persona Identities, Inc. was founded in 2018 in San Francisco by Rick Song and Charles Yeh to address structural bottlenecks, high manual friction, and sophisticated fraud in business identity verification. Operating as an enterprise-grade identity platform, Persona unifies consumer Know Your Customer (KYC) identity checks and commercial Know Your Business (KYB) verifications into a single automated engine. The business operates primarily on a software-as-a-service model with volume-based verification fees and packaged workflow subscriptions, serving both high-growth startups on its Essential plan and global enterprise platforms requiring custom orchestration across 150+ countries. Executive governance remains closely tied to the co-founders: Chief Executive Officer Rick Song drives strategic vision, fundraising, and public communications, while Chief Technology Officer Charles Yeh oversees verification algorithms and systems architecture. This leadership structure represents substantial key-person dependence, as platform credibility and investor relationships heavily rely on executive founder continuity amidst an increasingly competitive identity verification market.'
    claimRefs:
      - CO001
      - CO002
      - CO006
      - CO012
    tableRefs:
      - TO002
    figureRefs: []
  - id: capitalization-and-valuation-history
    title: Capitalization Structure, Valuation History, and Key Stakeholders
    body: 'Persona has raised approximately $417 million in total venture capital across multiple institutional funding rounds since its 2018 inception. Early scaling was backed by premier venture capital sponsors, including a Series B round led by Founders Fund in 2021 and a $50 million Series C financing round in 2022 that achieved a $1.5 billion valuation benchmark by 2023. In April 2025, Persona completed a $200 million Series D financing round co-led by Founders Fund and Ribbit Capital, establishing a $2.0 billion post-money equity valuation and positioning Persona as a critical identity infrastructure layer for enterprise systems and emerging agentic artificial intelligence applications. Institutional shareholding is concentrated among major Silicon Valley venture firms, with Founders Fund holding prominent governance influence and board participation. However, Persona operates as a private business with undisclosed financial details: key operational performance metrics, including recognized annual recurring revenue (ARR), gross profit margins by verification tier, net revenue retention (NRR), and net cash burn, remain unavailable in public filings, leaving the sustainability of its $2.0 billion valuation multiple contingent on private investor diligence.'
    claimRefs:
      - CO003
      - CO004
      - CO005
      - CO014
    tableRefs:
      - TO001
      - TO003
    figureRefs: []
  - id: platform-capabilities-and-milestones
    title: Platform Capabilities, Analyst Recognition, and Milestone Evolution
    body: 'Persona has steadily evolved its core technology stack from baseline individual document inspection into an integrated, modular identity platform. The system conducts up to 269 verification checks, integrating automated facial biometric comparisons, liveness inspection, deepfake detection, global watchlist screening, and commercial registry lookups across more than 150 countries. In March 2025, Persona expanded its business verification capabilities by releasing a unified KYC and KYB platform featuring automated corporate impersonation detection and ownership structure analysis, designed to mitigate multi-entity fraud networks and coordinated account takeovers. These capabilities have earned prominent industry recognition: in Q3 2025, Persona was named a Leader in The Forrester Wave for Identity Verification Solutions, securing top scores in strategy, vision, and business identity verification, alongside placement as a Leader in the Gartner Magic Quadrant for Identity Verification for Ability to Execute.'
    claimRefs:
      - CO006
      - CO007
      - CO008
      - CO011
    tableRefs: []
    figureRefs:
      - FO001
  - id: adverse-events-and-risk-scrutiny
    title: Operational Vulnerabilities, Adverse Scrutiny, and Contract Fallout
    body: 'In February 2026, Persona encountered severe public scrutiny when independent cybersecurity researchers identified approximately 2,500 uncompressed front-end files totaling 53 megabytes hosted on a publicly accessible government-authorized server endpoint. The exposed files revealed internal verification workflows, screening modules, and configuration records, sparking concerns regarding the vendor-level handling of biometric and corporate identity data. CEO Rick Song publicly disputed characterizations of the incident as a critical security vulnerability, asserting that the exposed assets consisted exclusively of client-side front-end code already distributed across user devices and lacked access to backend databases or law enforcement connections. Nevertheless, the reputational impact was immediate and material: social communications platform Discord terminated its identity verification engagement with Persona less than one month after deployment, demonstrating client-level sensitivity to perceived security lapses and data mishandling in enterprise identity infrastructure.'
    claimRefs:
      - CO009
      - CO010
      - CO011
      - CO013
    tableRefs: []
    figureRefs: []
