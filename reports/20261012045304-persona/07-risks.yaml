chapter:
  number: 7
  title: "Risks"
  summary: "Persona's highest-evidence risk is trust and execution damage from the February 2026 public code exposure, including a reported end to Discord's trial in certain territories. Legal liability, customer concentration, burn, and runway remain material diligence gaps because the assigned evidence contains allegations and company statements but no primary court record, audited financials, incident postmortem, or concentration schedule."
sections:
  - id: "priority-risk-posture"
    title: "Priority risk posture"
    body: >-
      The risk hierarchy is led by security execution and trust, not by a quantified legal
      reserve. Wikipedia's synthesis reports that publicly exposed code revealed information
      about Persona's verification pipeline and that Discord would end its trial in certain
      territories. That is a concrete commercial warning, although the assigned evidence does
      not establish the incident's data impact, recurrence probability, or revenue effect. A
      low-reputation legal article and a low-reputation technology article make broader biometric
      retention and liability allegations, but neither substitutes for a court docket, regulator
      record, or independent forensic report. The investment implication is therefore high
      residual uncertainty: require primary legal and security evidence before underwriting a
      liability amount, while treating repeat exposure, an adverse audit, or verified material
      customer losses as thesis-break events.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR006"
      - "CR007"
      - "CR015"
    figureRefs:
      - "FR001"
  - id: "regulatory-and-legal"
    title: "Regulatory and legal exposure"
    body: >-
      Persona's own educational material explains that data-residency requirements govern where
      personal data may be stored and processed, and that noncompliance can lead to fines,
      regulatory action, or even limits on operating in a country. Persona claims mitigations
      including EU data residency, data-processing agreements, SOC 2 Type II, and ISO 27001;
      these are relevant controls but do not prove customer-level implementation, deletion
      performance, or compliance in every jurisdiction. Separately, Lawfold alleges a biometric
      privacy class action, while UBOS alleges a conflict between public retention language and
      implementation details. Because these sources are low-reputation and the assigned pool has
      no primary docket, the legal status and monetary exposure remain unverified. The diligence
      gate is a jurisdiction-by-jurisdiction data map, consent record, deletion log, insurance
      schedule, and primary litigation record.
    claimRefs:
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR007"
      - "CR015"
    tableRefs:
      - "TR001"
  - id: "operational-quality-security"
    title: "Operational, quality, and security exposure"
    body: >-
      The exposed-code report matters because Persona operates a configurable decision surface:
      the Wikipedia page says the platform was capable of as many as 269 checks across 14
      categories, while noting Persona's response that no customer used all checks at once.
      Breadth can improve coverage, but it also increases configuration, audit, false-positive,
      and change-control demands. Company documentation shows that even the lightweight Business
      Verification product coordinates TIN and registry checks, watchlist and adverse-media
      reports, workflows, cases, and manual decisions. It also documents meaningful scope limits:
      the Essential offering is U.S.-focused and excludes UBO KYC and international registry
      verification. A satisfactory mitigation package therefore requires an independent
      postmortem, penetration testing, per-check accuracy and override data, customer-specific
      control mappings, and tested fallback procedures.
    claimRefs:
      - "CR001"
      - "CR003"
      - "CR009"
      - "CR010"
      - "CR011"
      - "CR012"
    tableRefs:
      - "TR002"
  - id: "dependencies-financial-kill-criteria"
    title: "Dependencies, financial opacity, and kill criteria"
    body: >-
      Persona depends on regional cloud arrangements, external authoritative databases, and
      customer trust. Its KYC material cites AAMVA and electronic consent-based Social Security
      number verification as external verification inputs, while its residency material points
      to cloud providers and contractual controls. Those dependencies create availability,
      data-quality, localization, and vendor-governance risk even though the assigned evidence
      does not quantify concentration or service-level performance. Financial resilience is also
      opaque: third-party coverage says audited revenue and profitability are not publicly
      available, while the reported $200 million Series D and $2 billion valuation establish
      financing history rather than current cash, burn, or runway. Investment approval should be
      withheld if Persona cannot provide audited financial bridges, at least 18 months of
      downside runway, top-customer and subprocessor concentration, successful independent
      security testing, and primary resolution of material legal allegations.
    claimRefs:
      - "CR002"
      - "CR005"
      - "CR011"
      - "CR013"
      - "CR014"
      - "CR016"
    tableRefs:
      - "TR003"
