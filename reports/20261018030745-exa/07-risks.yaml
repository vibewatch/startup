callouts:
  - calloutType: risk
    title: Thesis-break triggers to monitor now
    body: >-
      The clearest thesis-break signals are benchmarked retrieval quality failing primary-source
      tests, accepted-source cost curves becoming unattractive at buyer-scale usage, evidence that
      customer concentration is narrower than the public narrative implies, or new financing terms
      that effectively reprice the May 2026 valuation story.
    claimRefs: [CR009, CR011, CR014, CR015, CR016]
  - calloutType: recommendation
    title: Public-web mitigations are visible but incomplete
    body: >-
      The assigned evidence does show mitigations—partner-side encryption and approval controls,
      meaningful product depth, and enough capital to fund infrastructure—but those mitigations are
      not yet a substitute for direct diligence on governance, customer mix, and current economics.
    claimRefs: [CR001, CR005, CR013, CR016]
