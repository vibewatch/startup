      - Public evidence
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - - Retrieval quality drifts from semantic relevance into low-authority outputs
        - >-
            DiscoverAI warns that semantic similarity is not factual authority and explicitly calls
            for a controlled benchmark before adoption.
        - High
        - High
        - Early
        - High
        - >-
            No public benchmark in the assigned pool proves accepted-source precision on the buyer's
            real workload.
      - - Integration surface lacks spec-driven maturity for governed deployments
        - >-
            Ultrametric reports no machine-readable OpenAPI spec at the probed Exa documentation
            paths, which increases friction for generated clients, policy checks, and contract
            testing.
        - Medium
        - Medium
        - Early
        - Medium
        - >-
            Need clarity on official schema artifacts, client-generation support, and the roadmap
            for controlled integration changes.
      - - Runaway usage and cost expansion in multi-call workflows
        - >-
            External reviews warn that workflows can search, fetch, expand links, and retry, and
            another analysis says the cost difference at 10,000 queries per day is material.
        - High
        - Medium
        - Early
        - Medium
        - >-
            Missing public cost curves for accepted-source precision at the buyer's intended query
            concurrency and retry behavior.
      - - Team capacity lags roadmap breadth and infrastructure scale targets
        - >-
            Exa says its technical team is small and growing quickly, while funding coverage says
            the company plans to scale toward hundreds of thousands of searches per second.
        - Medium
        - High
        - Moderate
        - Medium
        - >-
            Need staffing plan, reliability KPIs, hiring fill rates, and on-call evidence for the
            broader product surface.
    notes: >-
      Severity is residual severity after visible mitigations; quality and cost rows require
      customer-specific workload testing rather than generic vendor claims.
    claimRefs: [CR004, CR005, CR006, CR010, CR011, CR015]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty / concentration
      - Role
      - Concentration
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - AI-coding customer wedge
        - Cursor, Cognition, and similar agent-native accounts
        - Demand concentration
        - Public narrative still highlights coding-heavy anchor customers
        - >-
            If coding-tool customers internalize retrieval or standardize elsewhere, growth and the
            reference set behind Exa's positioning can weaken quickly.
        - High
        - >-
            Show revenue and renewal breadth outside coding, including non-coding enterprise cohorts
            and expansion behavior.
        - High
      - - Exa Connect and external-data ecosystem
        - Exa-selected premium data partners
        - Product capability dependency
        - Public evidence shows partner attachment, not user-supplied tool flexibility
        - >-
            Limited bring-your-own-tool support could constrain complex enterprise workflows or push
            customers toward broader orchestration layers.
        - Medium
        - >-
            Publish a clearer partner roadmap and whether customers can safely compose their own
            tool estate around Exa workflows.
        - Medium
      - - Partner-routed distribution and approvals
        - Composio and similar control planes
        - Integration and go-to-market dependency
        - Some deployments may reach Exa through third-party auth and approval surfaces
        - >-
            A partner outage, policy mismatch, or control gap can interrupt approved workflows even
            if Exa itself remains available.
        - Medium
        - >-
            Preserve direct integration options and document which controls are first-party versus
            partner-owned.
        - Medium
      - - Capital-provider expectations at the May 2026 mark
        - Current and future investors
        - Financing and pricing discipline
        - $2.2 billion valuation with no public EV/Rev disclosure in the assigned pool
        - >-
            If growth, margin, or adoption breadth underperform the implied expectations, future
            marks or financing terms can compress before the platform moat is proven.
        - High
        - >-
            Provide current revenue, gross margin, burn, cohort behavior, and downside financing
            scenarios.
        - High
    notes: >-
      Concentration refers to visible public evidence, not audited revenue mix; customer and
      financing dependencies still need management-side data to size accurately.
    claimRefs: [CR007, CR008, CR009, CR012, CR014, CR016]
