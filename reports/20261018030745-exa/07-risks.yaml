      - Public evidence
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Diligence path
    rows:
      - - Source-rights, attribution, and personal-data governance in retrieved content
        - >-
            Exa's own AI-generated microsite warns of inaccuracies, while an external review says
            semantic retrieval is not factual authority and requires governance for copyright,
            personal data, and source attribution.
        - Medium
        - High
        - Early
        - High
        - >-
            Obtain the current enterprise DPA, retention defaults, subprocessor list, and policy
            for handling copyrighted or personal data in retrieved content.
      - - Approval-chain and credential-risk when Exa is routed through partner tooling
        - >-
            In the Composio integration path, approvals follow the agent framework's configured
            policy and account actions can require partner-side approval prompts, although the same
            partner says tokens and keys are encrypted and its controls are SOC 2 Type 2 compliant.
        - Medium
        - Medium
        - Moderate
        - Medium
        - >-
            Review the end-to-end auth architecture, customer-managed controls, and incident
            obligations for both Exa and the partner control plane.
      - - Public compliance posture remains under-disclosed for enterprise underwriting
        - >-
            The assigned pool does not surface a decisive public legal violation, but it also does
            not close the diligence loop on retention, residency, incident disclosure, or
            first-party compliance artifacts for buyers with stricter data obligations.
        - Medium
        - Medium
        - Early
        - Medium
        - >-
            Request the current trust pack, audit scope, security questionnaire, and any incident
            or regulatory correspondence relevant to enterprise deployments.
    notes: >-
      Public-web register only; rows rank visible diligence risk, not proven violations, and the
      third row is a disclosure gap rather than evidence of a recorded breach.
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly visible legal, privacy, and partner-governance signals in the assigned source
        pool as of the 2026-10-18 run date.
    claimRefs: [CR002, CR010, CR012, CR013]
