evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-financials
    missingEvidence: Board-approved 2025 and 2026 revenue, ARR, gross margin, and customer mix by product line.
    whyItMatters: >-
      The public valuation step-up is clear, but later financial and valuation chapters cannot judge efficiency or
      durability from conflicting secondary estimates.
    diligencePath: >-
      Request current board deck or audited management accounts that tie revenue, ARR, gross margin, and net dollar
      retention to the post-Series C story.
    relatedQuestionRefs:
      - QO003
      - QO004
  - type: private-evidence-only
    severity: material
    topic: governance-and-cap-table
    missingEvidence: >-
      Current board roster, voting control, liquidation stack, debt, secondary liquidity, and option-pool terms after
      the Series C.
    whyItMatters: >-
      Governance depth and investor rights determine downside protection and how much founder concentration remains
      after the new financing.
    diligencePath: >-
      Obtain the current cap table, investor rights agreement summary, board list, and any debt or tender documents from
      the company.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: headcount-and-scale
    missingEvidence: A single management-backed headcount and customer-definition snapshot that reconciles public tracker differences.
    whyItMatters: >-
      Public trackers range from about 30 to 121 employees and use different scale conventions, which affects later
      judgments on efficiency and go-to-market maturity.
    diligencePath: >-
      Request an org chart, current employee count by function, and a definitions note for customers, developers, and
      paid accounts.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: sam-som-gap
    missingEvidence: >-
      A segment-level public spend estimate or management disclosure that isolates the paid AI-search /
      research-workflow budget Exa can realistically serve.
    whyItMatters: >-
      Without a cleaner SAM or SOM, the market case relies on broad AI-agent growth and usage proxies rather than on a
      directly monetizable addressable market.
    diligencePath: >-
      Request management's segment revenue mix, ACV bands, query-volume mix, and paid customer breakdown by coding,
      enterprise assistant, and research workflows.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercial-conversion
    missingEvidence: >-
      Retention, conversion, and pricing data showing how the reported 5,000 companies and 400,000 developers translate
      into durable spend.
    whyItMatters: >-
      Adoption counts validate interest, but they do not show whether Exa owns a meaningful recurring budget line or
      just a broad free / low-end developer footprint.
    diligencePath: >-
      Ask for cohort retention, self-serve-to-enterprise conversion, paid customer counts, and gross-margin contribution
      by product line.
    relatedQuestionRefs:
      - QM004
      - QM005
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: minor
    topic: benchmark-neutrality
    missingEvidence: >-
      A neutral benchmark comparing Exa with Google, Bing, Perplexity, and Tavily on latency, retrieval quality, and
      extraction efficiency.
    whyItMatters: >-
      Current differentiation claims are directionally plausible, but most quantified comparisons in the assigned pool
      come from company-linked or synthesis sources.
    diligencePath: >-
      Run a controlled benchmark on representative coding, research, and GTM queries using identical prompts, rate
      limits, and quality scoring.
    relatedQuestionRefs:
      - QM006
      - QM007
  - type: private-evidence-only
    severity: material
    topic: enterprise-economics
    missingEvidence: >-
      Exa and competitor realized enterprise pricing, volume discounts, minimum commitments, and retention terms for
      production accounts.
    whyItMatters: >-
      Public list prices overstate comparability if real buying decisions depend on enterprise discounts or bundled
      commitments.
    diligencePath: >-
      Request recent customer contracts or board pricing materials and compare them against at least two direct
      alternatives in the same usage band.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: win-loss-and-lock-in
    missingEvidence: >-
      Verified win-loss data, churn drivers, and migration reasons across Exa, Tavily, Firecrawl, Parallel, Perplexity,
      and Brave in enterprise deployments.
    whyItMatters: >-
      Public product descriptions and competitor marketing do not prove whether Exa's special indexes and workflow
      features translate into durable retention.
    diligencePath: Obtain CRM win-loss summaries, top-account renewal notes, and product telemetry on Websets or special-index usage.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Board-approved 2025 and year-to-date 2026 revenue, ARR, and gross margin by product line.
    whyItMatters: >-
      Without product-line revenue and margin detail, it is impossible to judge mix quality, true monetization leverage,
      or whether infrastructure costs are scaling efficiently.
    diligencePath: Request monthly management reporting or board materials with revenue and gross-margin bridges by SKU.
    relatedQuestionRefs:
      - QI003
      - QI007
  - type: conflicting-data
    severity: material
    topic: pricing
    missingEvidence: >-
      Current contract language or invoice evidence showing whether content extraction is separately billed or bundled
      into search pricing.
    whyItMatters: The pricing conflict changes revenue mix assumptions and could materially alter modeled gross profit per workflow.
    diligencePath: Review current pricing pages, sample invoices, and enterprise order forms by product tier.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, payback, funnel conversion, net revenue retention, and paid-versus-free cohort data.
    whyItMatters: The public record shows demand, but not whether Exa converts adoption into efficient, durable enterprise revenue.
    diligencePath: Request cohort dashboards, CAC/payback analyses, and segment-level retention and expansion data.
    relatedQuestionRefs:
      - QI004
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current cash balance, monthly burn, runway, debt facilities, secondary liquidity terms, and round-specific
      preferences.
    whyItMatters: >-
      Fresh funding alone does not prove the company can finance its infrastructure plan without another round or
      balance-sheet pressure.
    diligencePath: Request the latest cap table, debt schedule, cash waterfall, and board-approved financing plan.
    relatedQuestionRefs:
      - QI006
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: >-
      Primary trust documentation covering current SOC 2 scope, data-processing terms, default retention behavior,
      uptime/SLO commitments, and customer-visible incident history.
    whyItMatters: >-
      Enterprise adoption and regulated-workload suitability depend on operating controls, not only product positioning
      or low-reputation directory summaries.
    diligencePath: >-
      Request the current security center package, DPA, audit letter, retention defaults, and a 12-month availability
      and incident summary from management.
    relatedQuestionRefs:
      - QE006
  - type: missing-source
    severity: material
    topic: durability-gap
    missingEvidence: >-
      Public or management-provided NRR, GRR, logo churn, renewal rate, contract length, and top-customer concentration
      data.
    whyItMatters: >-
      Without durability metrics, the visible 5,000-company and 400,000-developer counts cannot be translated into
      dependable recurring revenue quality.
    diligencePath: >-
      Request cohort retention, renewal, and top-10-customer concentration from management or the data room, split by
      self-serve versus enterprise contracts.
    relatedQuestionRefs:
      - QU007
  - type: enumeration-incomplete
    severity: material
    topic: named customer proof table completeness
    missingEvidence: >-
      A complete referenceable list of named customers with deployment stage, workload, outcome, and whether each
      account is pilot, production, or expanded.
    whyItMatters: Logo-level proof can overstate customer quality if most references are exploratory or unmonetized deployments.
    diligencePath: >-
      Ask management for a customer-reference list covering current production customers, contract status, and one
      measurable outcome per account.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: enterprise-governance
    missingEvidence: >-
      Current DPA, data-retention defaults, subprocessor list, and enterprise trust documentation for Exa's own
      platform.
    whyItMatters: >-
      These artifacts are needed to judge whether public governance claims are sufficient for sensitive enterprise
      workloads.
    diligencePath: >-
      Request the latest trust pack, DPA, retention controls, and customer-admin governance documentation directly from
      the company.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: reliability-and-quality
    missingEvidence: >-
      Controlled benchmark data showing accepted-source precision, freshness, latency, and failure behavior on the
      buyer's real query set.
    whyItMatters: >-
      Product quality is central to the thesis, but the assigned evidence set still relies on commentary and recommended
      tests more than published benchmark proof.
    diligencePath: >-
      Run the recommended benchmark with primary-source labels, negative controls, and full cost accounting before
      underwriting production usage.
    relatedQuestionRefs:
      - QR003
      - QR008
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: customer-and-revenue-concentration
    missingEvidence: Revenue mix by customer segment, renewal behavior, and non-coding vertical expansion data.
    whyItMatters: >-
      Public traction breadth is visible, but concentration risk cannot be sized accurately without cohort, renewal, and
      revenue data.
    diligencePath: >-
      Ask management for current segment revenue, top-customer concentration, retention, and expansion data by vertical
      and buyer type.
    relatedQuestionRefs:
      - QR005
      - QR007
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: valuation-calibration
    missingEvidence: Current revenue, gross margin, burn, and scenario assumptions supporting the May 2026 valuation.
    whyItMatters: >-
      The public record shows the mark moved sharply upward, but not the operating detail needed to judge whether that
      mark is durable.
    diligencePath: >-
      Obtain current financials, unit economics, financing terms, and downside cases before treating the latest round as
      validated price support.
    relatedQuestionRefs:
      - QR007
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: financing-terms
    missingEvidence: >-
      Signed Series C term sheet, cap table, liquidation preferences, option-pool refresh, debt, and any
      secondary-liquidity arrangements.
    whyItMatters: Downside protection and true entry price discipline cannot be assessed from the public headline valuation alone.
    diligencePath: Request the current cap table, signed financing documents, and board financing summary in the data room.
  - type: missing-source
    severity: material
    topic: revenue-opacity
    missingEvidence: Current 2026 ARR, revenue mix, gross margin, paid-customer cohorts, expansion, and retention metrics.
    whyItMatters: These metrics determine whether Exa deserves infrastructure-style premium pricing or a tracking-only posture.
    diligencePath: >-
      Obtain board-approved 2025 actuals plus current-year monthly KPI reporting and cohort retention cuts from
      management.
