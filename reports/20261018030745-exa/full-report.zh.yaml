  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：智能体检索基础设施，而非消费者搜索
        blocks:
          - type: paragraph
            body: >-
              市场边界很重要，因为“搜索”这个标签过于宽泛，无法准确描述 Exa 实际销售的产品。公司的产品定位是为 AI
              系统提供程序化检索：语义搜索、全文提取、按查询生成重点摘要，以及逐渐打包起来的研究工作流。因此，相关支出属于开发者基础设施、AI 产品、研究和工作流自动化预算，而不是消费者搜索广告或普通网页导航。最接近的替代品是
              Google/Bing API、Perplexity Sonar、Tavily
              和人工研究工作流，而非传统消费者目的地。公开证据还表明，该产品旨在嵌入编程助手、聊天智能体和研究工具，相关市场因此收窄到重视机器可读检索质量、确定性延迟和下游 token 效率的买家。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM011
      - number: '2.2'
        title: 规模化视角：AI 智能体需求广泛真实，但 Exa 的公开 SAM 尚未证实
        blocks:
          - type: paragraph
            body: >-
              指定资料支持多种市场观察角度，但没有一套能单独构成 Exa 完整 TAM/SAM/SOM 的模型。AgentMarketCap 提供最宽泛的需求视角：预计 2025 年 AI 智能体市场约为 $7.6
              billion，2033 年达到 $183 billion；同一来源称，2024—2025 年 AI 搜索 API 类别在 45 笔交易中吸引了 $2.8
              billion。这些数字说明资本和品类势头强劲，但范围大于 Exa 当前的切入点。最接近自下而上的视角是采用足迹：公开融资摘要和公司资料聚合器反复称，截至 2026 年 5 月有 5,000-plus 家公司和
              400,000-plus 名开发者使用 Exa。这足以验证需求，却不足以拆分开发者搜索 API、高层研究工作流和更广泛智能体基础设施之间的实际支出。
            claimRefs:
              - CM004
              - CM007
              - CM008
              - CM009
              - CM010
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM007
              - CM008
              - CM009
              - CM015
      - number: '2.3'
        title: 买方、用户和付费方集中在智能体产品构建者
        blocks:
          - type: paragraph
            body: >-
              公开用例显示，买方主要是把新鲜网页检索作为输入的产品构建组织。编程助手厂商是最清晰的细分市场，因为它们需要模型训练截止时间之外的最新文档和问题发现。第二类是需要带引用答案和新闻搜索的企业聊天或知识产品。第三类是金融、咨询、GTM
              和数据运营中的重研究工作流，多步骤发现和结构化输出比消费者式搜索更重要。Exa 从原始搜索端点转向 Exa Agent
              及相关工作流产品，说明公司希望从这些高价值研究任务中获取更多预算，而不只是为底层检索调用收费。下方图表不是 SAM
              模型，而是一套商业化结构，展示公开证据如何从声称的数据覆盖范围逐步收窄到实际使用足迹和产品控制信号。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM011
              - CM013
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM011
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
