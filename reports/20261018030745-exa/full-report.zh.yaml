      - number: '4.2'
        title: 牵引力与 GTM 动作
        blocks:
          - type: paragraph
            body: >-
              Exa 的公开牵引力故事可信，但指标仍混杂。公司称截至 2026 年 5 月平台已有超过 5,000 家公司和 400,000 名开发者；独立摘要也重复这些数字，并列出
              Cursor、Cognition、HubSpot、Databricks、AWS、Vercel 和 Anysphere 等客户。这些引用说明该产品已不只是爱好者的实验性基础设施，而是嵌入能够产生重复 API
              需求的智能体和开发者工作流。

              GTM 动作看起来也是混合型的。Exa 面向开发者的 API 分发似乎能带来漏斗顶部采用，公司同时也在建设更传统的企业覆盖：C 轮公告称 Marcus Holm 加入担任 CRO，负责全球 GTM
              组织；技术博客仍称团队“规模小且增长很快”。缺失的是把这些信号变成可投资判断的效率层。公开资料没有 CAC、回本期、管道转化、扩张或留存数据，因此最佳公开结论是需求存在，但销售生产率仍不透明。
