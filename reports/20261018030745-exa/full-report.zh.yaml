      - number: '1.3'
        title: 融资路径、规模信号与里程碑节奏
        blocks:
          - type: paragraph
            body: >-
              Exa 的融资曲线在 2025—2026 年明显变陡。公开追踪平台一致认可 2025 年 9 月的 $85 million B 轮及 $700 million 估值，也认可 2026 年 5 月 $250
              million 的 C 轮及 $2.2 billion 估值，但对更早轮次规模、乃至 C
              轮后的累计融资额存在分歧。因此，本章确认融资方向，同时保留累计到账金额和经济条款的不确定性。公开规模信号也需要谨慎解读：客户数和开发者数总体向好，但各追踪平台的收入、员工数，甚至“最新估值”字段都不一致，后续章节只能复用这里记录的区间和明确标注的冲突。

              尽管如此，产品和公司里程碑仍显示出真实的交付节奏。官方研究页面记录了从 2024 年初到 2026 年末的技术里程碑，RuntimeWire 称 Exa Agent 于 2026 年 6 月 16
              日上线，成为更高层的研究端点。这一节奏支持 Exa 从原始检索扩展到智能体工作流基础设施的判断。同时，独立评论仍提示实质执行风险：自建爬虫和索引资本开支高，大型 AI
              与搜索平台竞争明显，而公开市场仍缺少证据证明其收入质量能相对于新估值长期站得住。
