      - number: '3.2'
        title: 能力广度与定价带来多条迁移路径
        blocks:
          - type: paragraph
            body: >-
              公开证据表明，买方会根据缺失能力将 Exa 与不同对手比较。团队若想用一个供应商同时完成搜索、提取、爬取、地图和研究，Tavily 是更直接的替代品；工作流从已知 URL
              开始并需要抓取、爬取或交互式提取时，Firecrawl 更强；Parallel 以更低的目录价和灵活搜索模式竞争；Perplexity 则面向希望获得带引用答案而非直接检索控制的开发者。对于 Websets 以及
              people、企业、scholarly 等特殊索引，Exa 仍然更难替代。因此，实际切换成本集中在这些专业化产品面，而不是基础公开网络搜索本身。
