              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 建议
            body: 在上一公开披露价格下，跟踪 Exa 而不是买入。品类逻辑很有吸引力，但当前公开证据仍缺少按风险调整回报投资判断这一轮次所需的经济和结构细节。
            calloutType: recommendation
            claimRefs:
              - CV001
