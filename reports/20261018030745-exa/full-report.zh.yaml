chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与产品定位
        blocks:
          - type: paragraph
            body: >-
              Exa 将自己定位为 AI 智能体的基础设施，而不是面向普通消费者的目的地。公司主页将产品概括为“面向 AI 智能体的世界数据”，并称开发者用 Exa
              搜索公开网络和私有信息；研究页面则称团队训练并提供自有搜索索引和模型。独立资料与这一定位基本一致：AI Engineer 将 Exa 描述为 AI
              应用的网络搜索基础设施，覆盖编程助手、聊天智能体和企业工具等用例；第三方公司资料则将其描述为以 API 为中心、提供语义搜索、内容提取和研究工作流的业务。

              同一批来源也支持其稳定的核心身份，尽管规模指标存在分歧。公开资料将 Exa 认定为一家 2021 年成立、位于旧金山的公司，法律实体为 Exa Labs Inc.，其中一份公司资料还写有“前身为 Metaphor
              Systems”。因此，本章可作为报告的身份锚点：Exa 是一家为 AI 系统构建搜索、检索和内容提取基础设施的私有 C 轮公司，但精确的当前经营指标仍需管理层确认，不能只看公开追踪平台。
            claimRefs:
