              - CM016
      - number: '2.4'
        title: 增长驱动与约束决定这一品类能否保持独立
        blocks:
          - type: paragraph
            body: >-
              主要采用驱动因素都很实际：语义召回优于关键词搜索、输出完整文档而不是摘要、节省 token 的提取、领域过滤，以及足够低的延迟以嵌入多步骤智能体循环。当买方产品质量依赖比通用搜索 API
              更新或更精确的检索时，这些优势最有价值。约束同样清晰。公开差异化主张仍大量依赖公司关联或 AI 生成的综合来源，而非中立基准。              Google 和 Bing 可以用捆绑式搜索上下文注入
              反击；维护专门的爬取和索引栈资本密集；邻近厂商整合也可能压缩独立定价能力。因此，Exa 的长期市场定义取决于“面向智能体的搜索”能否继续作为付费基础设施层存在，而不是变成模型提供商捆绑的功能。
            claimRefs:
              - CM006
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 可投资市场窄于“AI 搜索”
            body: Exa 当前最适合被理解为面向构建者的智能体检索基础设施：它们需要在软件工作流中获得语义召回、全文提取和可预测延迟，而不是声称能够获得全部搜索支出。
            calloutType: insight
            claimRefs:
              - CM001
              - CM006
              - CM013
          - type: callout
            title: 品类势头比品类规模更清晰
            body: 公开来源显示采用和融资兴趣强劲，但仍未证明 Exa 这一细分领域拥有清晰的独立 SAM 或持久预算项，能够脱离更广泛的 AI 智能体软件和工作流支出单独成立。
            calloutType: risk
            claimRefs:
              - CM004
              - CM009
              - CM015
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局覆盖直接 API、邻近工作流和现有技术栈
        blocks:
          - type: paragraph
            body: >-
              指定资料不支持将竞争简化为“Exa 对一个直接克隆”。Exa
              自己强调语义发现、自有索引和模型、重点摘要、整页检索，以及面向智能体工作流的更深推理模式；竞争者和独立来源则描述了多种只解决部分同一任务的邻近替代方案。Tavily
              将自己定位为生产级检索层，捆绑搜索、提取、爬取、地图和研究；Firecrawl 以提取为先构建网页数据栈；Brave 依靠独立索引搜索和隐私；Perplexity
              则把搜索与答案生成结合起来。现有技术栈本身也是重要替代方案：团队可以从多家厂商拼装发现、提取和网页解锁能力，而不是只标准化使用 Exa。Exa Agent 又把竞争边界向上推移，因为 Exa
              从原始检索延伸到结构化研究工作流，不再局限于纯搜索 API。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP006
