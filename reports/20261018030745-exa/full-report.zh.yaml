    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 搜索质量和代理工作流成为有黏性的企业层，私下数据证明留存和扩张表现强劲。
        - 只有当前 ARR、利润率和客户群行为显示出真实的规模经济，才可能支持按接近或高于上一轮的价格买入。
        - 如果差异化消退，大型平台的打包销售仍会压缩上行空间。
        - 需要管理层级别的 2026 年 KPI 披露，或同等程度的尽调访问权限。
      - - 基准
        - 采用广度确实存在，但当前经济性仍只能部分看见，融资条款继续处于私下状态。
        - 这支持继续跟踪公司，等待更好的价格或更充分的证据，而不是在当前公开估值下勉强买入。
        - 叙事强度跑在经投资判断验证的基本面之前。
        - 最符合今天指定证据所支持的判断。
      - - 悲观
        - 检索变得更加商品化，或隐私 / 合规限制削弱其向敏感企业工作流扩张的能力。
        - 这将支持避开本轮融资，或要求比上一公开估值明显更好的入场条件。
        - Exa 证明持久的企业变现能力之前，估值倍数就已压缩。
        - 如果尽调显示付费转化弱、留存差，或优先权负担不利，就会触发该情景。
    notes: 由于指定的公开证据没有披露足够的当前财务细节，情景逻辑采用定性判断，无法支持精确的估值区间。
