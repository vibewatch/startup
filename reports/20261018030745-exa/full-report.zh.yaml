  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 品类地位强、产品覆盖广都是真实优势，但估值支撑仍卡在缺失的经济性和条款细节上。
    data:
      nodes:
        - id: adoption
          label: 采用证明
          value: 5,000+ companies; 400,000+ developers
          note: 官方和二手来源都指向早期使用范围广。
        - id: expansion
          label: 产品扩张
          value: Search API -> research workflows
          note: Exa 正从检索延伸到结构化代理式研究。
        - id: category
          label: 品类上行空间
          value: Potential infrastructure layer
          note: 投资者和市场来源将原生 AI 检索描述为规模大且持久的品类。
        - id: economics
          label: 经济性缺口
          value: ~$10M Sep-2025 run-rate estimate
          note: 公开证据缺少当前经审计的 2026 年 ARR、利润率和留存率。
        - id: terms
          label: 条款缺口
          value: $2.2B round headline only
          note: 指定来源没有披露资本表、优先权、债务或流动性条款。
        - id: call
          label: 建议
          value: Track
          note: 在升级为买入前，等待私下尽调或更好的入场条件。
      edges:
        - from: adoption
          to: expansion
        - from: expansion
          to: category
        - from: category
          to: economics
        - from: economics
          to: terms
        - from: terms
          to: call
