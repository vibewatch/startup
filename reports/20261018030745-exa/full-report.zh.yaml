      - number: '3.3'
        title: 迁移成本真实存在，但最强于专业产品面和企业定位
        blocks:
          - type: paragraph
            body: >-
              Exa 持久性的最强公开依据不是不存在替代品，而是其产品组合把专业搜索产品面与企业友好型包装结合起来。独立和官方来源都称 Exa 运营自己的爬取和索引栈，依靠更深的研究模式支持快速搜索，并在企业套餐中主张 SOC
              2 Type II、零数据留存和 HIPAA 等控制。独立资料还将超过 400,000 名开发者、5,000 家公司，以及进入 Firefox Smart Window 和 iOS Quick Answers
              的分发归因于 Exa。即便如此，指定资料没有公开实际成交价、承诺用量条款或与竞争对手的已验证胜负数据，因此公开牵引力仍弱于有文件支持的锁定故事。
            claimRefs:
              - CP001
              - CP007
              - CP009
              - CP013
              - CP014
      - number: '3.4'
        title: 反向证据集中在商品化、捆绑和竞争者基准主张
        blocks:
          - type: paragraph
            body: >-
              最清晰的不利信号是，多家竞争者都声称自己能在其最看重的工作流环节击败 Exa。Firecrawl 在自有评测中公布了优于 Exa 的覆盖率和 F1 分数，Parallel
              宣传更低的搜索价格和相近的基准定位，Brave 则强调索引独立性和隐私，而不是 Exa 式语义发现。这些点单独看都不能推翻 Exa
              的差异化，因为这里最强的负面证据均由供应商撰写，且局限于各自偏好的用例。但合在一起，它们确实显示出商品化风险：买方可以在专业工具之间多重采购，或自行捆绑技术栈；只要客户更看重提取深度、目录价节省或生成答案，而不是
              Exa 的特殊索引和语义发现工作流，就会压缩 Exa 的空间。
            claimRefs:
              - CP004
              - CP005
              - CP011
              - CP012
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价
        blocks:
          - type: paragraph
            body: >-
              公开证据支持按使用量计费的 API 变现模式，而非传统按席位计费的 SaaS。Preqin 描述了神经搜索、关键词搜索和内容检索中的多个计费单位；AlphaSignal 则称 Exa“主要采用按使用量计费的
              API 定价，而不是按席位收费”。这很重要，因为收入质量取决于请求量、结构和实际单位价格，而不是简单的席位扩张。公开产品集合还暗示不止一条收入流：搜索 API 调用、内容检索、Exa Agent
              等高层研究工作流，以及 Websets 或企业与个人索引等 GTM/数据产品。

              但定价记录仍不够干净，无法直接用于投资判断。Preqin 称 Exa 对内容检索单独收费；2026 年 8 月 SVIC 资料页却称 Exa 在 2026 年 3
              月把内容提取“捆绑进基础搜索成本”。冲突可能来自产品变更、套餐层级差异或过时的第三方文档；在没有合同样本的情况下，不能假定当前实际价格、附加率，或收入中提取与搜索调用的占比。因此，财务尽调应把公开目录价只当作方向性证据，而不是收入确认或毛利率建模的依据。
