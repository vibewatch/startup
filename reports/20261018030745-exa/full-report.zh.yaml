        - label: Parallel
          x: 7
          'y': 7
          note: 定价和基准测试营销力度强，但有证据支持的专业索引较少。
        - label: Perplexity
          x: 6
          'y': 5
          note: 相比完整的检索控制面，更擅长生成带引用的答案。
        - label: Brave
          x: 6
          'y': 6
          note: 依靠隐私和独立索引形成差异化，而不是依靠语义发现工作流深度。
    approximationNotes: 坐标是基于所引论据编制的序数综合，不是基准测试分数；反映指定证据中公开检索界面的相对广度和原生代理搜索差异化程度。
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP005
      - CP006
      - CP008
      - CP011
      - CP012
  - id: FI001
    title: 收入模式桥接
    type: flow
    summary: 公开证据指向按使用量计费的循环，但其经济性仍取决于未披露的基础设施效率和市场拓展效率。
    data:
      nodes:
        - id: demand
          label: 需求基础
          value: 5,000+ companies; 400K+ developers
          note: 截至 2026 年 5 月公开披露的采用基础。
        - id: accounts
          label: 付费账户转化
          value: Undisclosed
          note: 公开需求指标没有显示多少使用量能转化为付费且留存的支出。
        - id: requests
          label: 可计费活动
          value: Search, retrieval, and research workflow calls
          note: 开发者和企业用例都依赖重复 API 使用。
        - id: pricing
          label: 按使用量定价
          value: USD 5 per 1,000 searches; USD 1 per 1,000 retrievals
          valueNote: Public sources disagree on whether retrieval remains separately billed.
        - id: delivery
          label: 服务交付成本
          value: Undisclosed
          note: 自有爬虫、索引、向量数据库、GPU 训练和高 QPS 服务。
        - id: capital
          label: 资本支持
          value: USD 250M Series C
          note: 管理层称融资所得将用于模型、基础设施和市场拓展。
      edges:
        - from: demand
          to: accounts
          label: 广泛采用必须转化为付费客户群
        - from: accounts
          to: requests
          label: 付费账户产生经常性查询量
        - from: requests
          to: pricing
          label: 请求转化为按使用量计费的账单
        - from: pricing
          to: delivery
          label: 计算、抓取和提取成本侵蚀收入
        - from: delivery
          to: capital
          label: 由于利润率效率未披露，后续融资仍然重要
    approximationNotes: 定价节点反映公开标价，不应解读为实际净收入或毛利润。
    claimRefs:
      - CI003
      - CI004
      - CI005
      - CI006
      - CI008
      - CI012
      - CI013
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开证据显示，Exa 的分层栈从客户端集成延伸到检索和提取，再到其索引搜索基础设施。
    data:
      layers:
        - label: 客户端与合作伙伴入口
          detail: 开发者或下游产品通过直接 API 和合作伙伴工具发起搜索或研究任务。
          modules:
            - 直接 SDK/API 调用
            - 例如 Strands Agents 的合作伙伴集成
            - 例如 Firefox Smart Window 的下游产品嵌入
          outputs:
            - 搜索请求
            - 研究任务
        - label: 任务编排界面
          detail: 不同界面分别提供原始检索和更高阶的研究工作流。
          modules:
            - Search API
            - Exa Agent
            - Websets / 丰富化界面
          outputs:
            - 按模式选择的搜索调用
            - 异步研究任务
        - label: 检索控制
          detail: 搜索请求可以按模式和筛选条件变化，而不只是关键词查询。
          modules:
            - 语义搜索模式
            - 类别和域名筛选器
            - 日期限制
          outputs:
            - 排名后的候选页面
        - label: 内容提取与落地
          detail: 选定页面会转化为 LLM 可用的文本、highlights 和结构化输出。
          modules:
            - exa_get_contents（内容提取）
            - Highlights
            - 结构化输出
          outputs:
            - 段落
            - 全页文本
            - 结构化字段
        - label: 索引与模型层
          detail: 官方和独立来源都称 Exa 运营自有的大规模索引、嵌入模型和代码搜索模型。
          modules:
            - 自有搜索索引
            - 嵌入模型
            - 代码搜索调优
          outputs:
            - 语义匹配
            - 开发者文档检索
        - label: 服务基础设施
          detail: 公司把检索质量和延迟视为基础设施问题，而不只是界面问题。
          modules:
            - Highlights server
            - 定制向量数据库
            - 查询路由 / 编排
          outputs:
            - 低延迟响应
            - 高查询量服务
    approximationNotes: 该图将公开描述综合为运营层，不代表公司披露了精确的内部服务边界。
    claimRefs:
      - CE001
      - CE002
      - CE006
      - CE007
      - CE009
      - CE010
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 从公开材料看，Exa 的客户路径从开发者和编码代理团队起步，随后尝试扩展到更广泛的研究和企业工作流，最终受公开证据质量限制。
    data:
      nodes:
        - label: 发现原生 AI 搜索缺口
          actor: Developers and ML engineers
          phase: Discovery
          touchpoints:
            - Need live-web retrieval beyond model training data
            - Benchmark semantic relevance, latency, and clean text extraction
        - label: 评估 API 与工作流匹配度
          actor: Product and engineering teams
          phase: Technical evaluation
          touchpoints:
            - Test search, answers, and deep-research workflows
            - Review per-query pricing and zero-data-retention positioning
        - label: 在编码和研究代理中采用
          actor: AI-native application builders
          phase: Initial production
          touchpoints:
            - Cursor and Cognition fit the coding-agent wedge
            - Finance, GTM, and data workflows appear in partner and press coverage
        - label: 靠开发者带动扩散
          actor: Self-serve developers and internal champions
          phase: Expansion
          touchpoints:
            - Public profiles cite 400,000+ developers and 5,000+ companies
            - Broader usage can create internal references before formal enterprise sale
        - label: 寻求企业标准化
          actor: Security, procurement, and platform owners
          phase: Commercialization
          touchpoints:
            - Larger logos imply enterprise interest
            - Public sources do not disclose contract terms, retention, or concentration
        - label: 触及证据质量上限
          actor: Investors and new buyers
          phase: Diligence
          touchpoints:
            - Named logos are helpful but mostly logo-level
            - Official demo warns outputs may contain errors or omissions
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU009
      - CU011
      - CU013
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 剩余风险最高的领域集中在权威性 / 治理、估值纪律和工作流成本控制，而不是 Exa 是否打造出了真正的产品。
