      - number: '4.3'
        title: 成本结构与资本需求
        blocks:
          - type: paragraph
            body: >-
              Exa 不像轻量级套壳业务。官方和第三方来源一致描述其自建搜索栈：自有爬虫、大型搜索索引、定制向量数据库，以及内部训练的嵌入和提取模型。SVIC 资料页还给出具体基础设施信号，包括扩充至 144 台 H200 和
              3,456 个 CPU 的 GPU 集群；C 轮公告称公司计划扩展到“每秒数十万次搜索”。这些细节合在一起说明，在叠加销售和营销之前，交付模型已经需要可观的算力、存储和工程成本。

              2026 年 5 月融资应能缓解眼前的募资压力，但不会消除资本风险问题。Exa 称 $250 million 轮融资将用于下一代模型、基础设施容量和 GTM
              扩张，这符合公司仍在收入基础形成前大举投入的状态。公开记录没有显示实际现金余额、月度烧钱、毛利率、债务或类似项目融资的义务。因此，投资者可以确认 Exa
              拿到了新资本，却不能据此判断其利润结构已经持久或融资效率已经良好。
            claimRefs:
              - CI001
              - CI002
              - CI012
              - CI013
              - CI014
              - CI016
      - number: '4.4'
        title: 财务结论与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              财务案例有吸引力但不完整。收入质量看起来优于纯粹的“试点收入”故事，因为公开证据指向可重复的使用量计费、真实客户采用，以及向高价值工作流产品扩张。但现有收入数字并不可直接比较：AlphaSignal 引用
              Sacra 对 2025 年 9 月约 $10 million ARR 的估算；UpMarket 则引用 2025 年 $12 million
              收入，二者不能混为一谈。定价历史也足够混乱，使实际每次查询净收入仍不确定。

              更大的阻碍是利润率和融资透明度。Exa 最终可能成为强大的基础设施业务，但公开数据没有说明其爬取、索引、GPU 和 GTM
              投入是否已经转化为有吸引力的毛利率和回本期。负面财务情景也很明确：如果模型平台把搜索内化，或客户将工作负载转向自有数据，独立搜索 API
              的查询增长可能大幅放缓。投资判断前，投资者应要求按产品线提供董事会批准的收入和毛利率明细、客户群留存与扩张数据，以及当前资本结构和资金可支撑期材料。
            claimRefs:
              - CI008
              - CI010
              - CI013
              - CI014
              - CI016
