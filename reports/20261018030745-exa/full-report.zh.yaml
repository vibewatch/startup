      - number: '1.2'
        title: 领导层、治理与关键人物集中度
        blocks:
          - type: paragraph
            body: >-
              公开报道仍高度聚焦 Exa 的创始人。TechCompanyNews 将 Will Bryk 列为 CEO、Jeffrey Wang 列为联合创始人；AI Engineer 还补充了他们此前的经营背景，将
              Bryk 与 Cresta、Wang 与 Plaid 联系起来。产品叙事、融资故事和发布报道仍主要依靠创始人主导的技术可信度，说明创始人与市场匹配度较强；但 Exa
              在早期技术客户之外继续扩张时，也存在明显的关键人物依赖。

              治理开始扩大，但指定证据只显示出局部变化。最明确的扩展点是 2026 年 5 月 C 轮：多家来源称 Andreessen Horowitz 的 Sarah Wang 加入董事会；TechCompanyNews
              还称 Marcus Holm 加入公司担任 CRO，以增强市场拓展能力。这些信号说明 Exa 正在引入外部监督和商业领导，但指定公开来源仍未提供完整董事名单、投票控制结构，或已点名高管之外的创始人继任梯队。
            claimRefs:
              - CO004
              - CO006
