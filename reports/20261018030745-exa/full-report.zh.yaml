  - id: TV002
    title: 正论 / 反论表
    columns:
      - 视角
      - 当前证据
      - 哪些事实会改变判断
    rows:
      - - 正论
        - Exa 正在打造差异化的 AI 代理检索层，已有可见采用度，也获得了强劲的投资者支持。
        - 私下的 2026 年客户群数据若确认企业扩张，将显著增强正论。
      - - 反论
        - 大型 AI 或云平台可能把够用的检索能力打包进产品，压缩价格和估值倍数。
        - 若证据显示企业留存稳固，且相对大型平台方案的胜率清晰，反论的力度会减弱。
      - - 运营变现
        - 如果客户在生产环境采用，产品扩展到代理式研究可提升单个账户的支出。
        - 若能证明 Agent 和更高阶工作流显著改善扩张收入，判断会向上调整。
      - - 投资判断缺口
        - 公开证据仍缺少当前收入质量、利润率和优先权结构数据。
        - 董事会级财务数据和已签署的融资条款将补上最大的估值障碍。
    notes: 这张表把战略性公司质量与价格支撑分开；它不假设公开叙事强度足以支撑估值判断。
