company:
  name: "Exa"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Exa is now clearly positioned as AI-native search and research infrastructure rather than a consumer search product, with official materials emphasizing its own search index, extraction stack, and large developer base. The May 2026 Series C at a reported $2.2 billion valuation established category credibility, but public disclosures on revenue quality, cap table terms, headcount, and governance depth remain thin or inconsistent across trackers."
sections:
  - id: "identity-positioning"
    title: "Identity and product posture"
    body: |
      Exa presents itself as infrastructure for AI agents, not as a general consumer destination. The company homepage frames the product around "the world's data for AI agents" and says developers use Exa to search public-web and private information, while the research page says the team trains and serves its own search index and models. Independent profiles line up with that positioning: AI Engineer describes Exa as web search infrastructure for AI applications and notes use cases across coding assistants, chat agents, and business tools, while third-party company profiles describe an API-centric business with semantic search, content extraction, and research workflows.

      The same sources support a stable core identity even when scale metrics diverge. Public profiles identify Exa as a San Francisco company founded in 2021, with Exa Labs Inc. listed as the legal entity and "formerly Metaphor Systems" appearing in one company profile. That combination makes the chapter reusable as the report's identity anchor: Exa is a private Series C company building search, retrieval, and content-extraction infrastructure for AI systems, but precise current operating metrics still need confirmation from management rather than public trackers.
    claimRefs: ["CO001", "CO002", "CO003", "CO004", "CO005", "CO015"]
    tableRefs: ["TO001"]
  - id: "leadership-governance"
    title: "Leadership, governance, and key-person concentration"
    body: |
      Public coverage still centers Exa heavily on its founders. TechCompanyNews names Will Bryk as CEO and Jeffrey Wang as co-founder, and AI Engineer adds prior operating context by tying Bryk to Cresta and Wang to Plaid. The product narrative, fundraising story, and launch coverage all continue to route through founder-led technical credibility, which suggests strong founder-market fit but also meaningful key-person dependency while Exa scales beyond early technical customers.

      Governance has started to widen, but only partially in the assigned evidence. The clearest public expansion point is the May 2026 Series C, where multiple sources say Sarah Wang of Andreessen Horowitz joined the board; TechCompanyNews also says Marcus Holm joined as CRO to build go-to-market depth. Those signals matter because they show Exa is adding external oversight and commercial leadership, yet the assigned public sources still do not provide a full board roster, voting control picture, or founder succession depth below the named executives.
    claimRefs: ["CO004", "CO006", "CO013"]
    tableRefs: ["TO002", "TO003"]
  - id: "capitalization-scale-and-milestones"
    title: "Funding path, scale signals, and milestone cadence"
    body: |
      Exa's financing arc steepened materially in 2025-2026. Public trackers agree on an $85 million Series B in September 2025 at a $700 million valuation and on a May 2026 Series C of $250 million at a $2.2 billion valuation, but they disagree on earlier round sizing and even on total capital raised after the Series C. The chapter therefore treats funding direction as verified while preserving uncertainty on exact cumulative proceeds and economic terms. Public scale signals also need caution: customer and developer counts are directionally strong, but revenue, headcount, and even "latest valuation" fields differ across trackers, so later chapters should reuse only the ranges and explicitly marked conflicts captured here.

      Product and company milestones nevertheless show a real shipping cadence. The official research page records technical milestones from early 2024 through late 2026, and RuntimeWire says Exa Agent launched on June 16, 2026 as a higher-level research endpoint. That cadence supports the thesis that Exa is broadening from raw retrieval into agent workflow infrastructure. At the same time, independent commentary still flags material execution risk: maintaining its own crawler and index is capital intensive, competition from large AI and search platforms is obvious, and the public market still lacks clean evidence on durable revenue quality relative to the new valuation.
    claimRefs: ["CO006", "CO007", "CO008", "CO009", "CO010", "CO011", "CO012", "CO014"]
    figureRefs: ["FO001"]
