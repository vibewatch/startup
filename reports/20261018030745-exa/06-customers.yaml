  evidenceGaps:
    - type: missing-source
      severity: material
      topic: durability-gap
      missingEvidence: >-
        Public or management-provided NRR, GRR, logo churn, renewal rate, contract length, and
        top-customer concentration data.
      whyItMatters: >-
        Without durability metrics, the visible 5,000-company and 400,000-developer counts cannot
        be translated into dependable recurring revenue quality.
      diligencePath: >-
        Request cohort retention, renewal, and top-10-customer concentration from management or the
        data room, split by self-serve versus enterprise contracts.
      relatedQuestionRefs: [QU007]
    - type: enumeration-incomplete
      severity: material
      topic: named customer proof table completeness
      missingEvidence: >-
        A complete referenceable list of named customers with deployment stage, workload, outcome,
        and whether each account is pilot, production, or expanded.
      whyItMatters: >-
        Logo-level proof can overstate customer quality if most references are exploratory or
        unmonetized deployments.
      diligencePath: >-
        Ask management for a customer-reference list covering current production customers, contract
        status, and one measurable outcome per account.
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
