      whyItMatters: Downside protection and true entry price discipline cannot be assessed from the public headline valuation alone.
      diligencePath: Request the current cap table, signed financing documents, and board financing summary in the data room.
    - type: missing-source
      severity: material
      topic: revenue-opacity
      missingEvidence: Current 2026 ARR, revenue mix, gross margin, paid-customer cohorts, expansion, and retention metrics.
      whyItMatters: These metrics determine whether Exa deserves infrastructure-style premium pricing or a tracking-only posture.
      diligencePath: Obtain board-approved 2025 actuals plus current-year monthly KPI reporting and cohort retention cuts from management.
