  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Current evidence
      - What would change the view
    rows:
      - [Thesis, "Exa is building a differentiated retrieval layer for AI agents with visible adoption and strong investor support.", "Private 2026 cohort data confirming enterprise expansion would strengthen the thesis materially."]
      - [Anti-thesis, "Good-enough retrieval could be bundled by larger AI or cloud platforms, compressing pricing and multiples.", "Evidence of sticky enterprise retention and clear win rates against large-platform alternatives would weaken the anti-thesis."]
      - ["Operational monetization", "Product expansion into agentic research can lift spend per account if customers adopt it in production.", "Proof that Agent and higher-level workflows materially improve expansion revenue would move the view up."]
      - ["Underwriting gap", "Public evidence still lacks current revenue quality, margin, and preference-stack data.", "Board-level financials and signed financing terms would close the biggest valuation blocker."]
    notes: >-
      This table separates strategic company quality from price support; it does not assume public
      narrative strength is sufficient for valuation underwriting.
    claimRefs: [CV002, CV003, CV005, CV007, CV010, CV011, CV012]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "Search quality and agent workflows become a sticky enterprise layer, with retention and expansion proving strong in private data.", "Could justify paying near or above the last round only if current ARR, margin, and cohort behavior show real scale economics.", "Bundling by larger platforms still compresses upside if differentiation fades.", "Would need management-grade 2026 KPI disclosure or equivalent diligence access."]
      - [Base, "Adoption breadth is real, but current economics remain only partially visible and financing terms stay private.", "Supports tracking the company and waiting for better price or better evidence rather than stretching at the current headline mark.", "Narrative strength outruns underwritten fundamentals.", "Best fit for the assigned evidence today."]
      - [Bear, "Retrieval becomes more commoditized, or privacy/compliance limits reduce expansion into sensitive enterprise workflows.", "Would argue for avoiding the round or requiring a materially better entry setup than the last public valuation.", "Multiple compression arrives before Exa proves durable enterprise monetization.", "Triggers if diligence shows weak paid conversion, poor retention, or unfavorable preference overhang."]
    notes: >-
      Scenario logic is qualitative because the assigned public evidence does not disclose enough
      current financial detail to support precise valuation ranges.
    claimRefs: [CV005, CV007, CV008, CV010, CV012, CV013, CV014, CV015]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Strong category position and product breadth are real, but valuation support still breaks on missing economics and term detail.
    data:
      nodes:
        - id: adoption
          label: Adoption proof
          value: "5,000+ companies; 400,000+ developers"
          note: Official and secondary sources both point to broad early usage.
        - id: expansion
          label: Product expansion
          value: "Search API -> research workflows"
          note: Exa is moving beyond retrieval into structured agentic research.
        - id: category
          label: Category upside
          value: "Potential infrastructure layer"
          note: Investor and market sources frame AI-native retrieval as a large, durable category.
        - id: economics
          label: Economics gap
          value: "~$10M Sep-2025 run-rate estimate"
          note: Public evidence lacks current audited 2026 ARR, margin, and retention.
        - id: terms
          label: Terms gap
          value: "$2.2B round headline only"
          note: The assigned sources do not disclose cap-table, preference, debt, or liquidity terms.
        - id: call
          label: Recommendation
          value: Track
          note: Wait for private diligence or better entry conditions before upgrading to buy.
      edges:
        - from: adoption
          to: expansion
        - from: expansion
          to: category
        - from: category
          to: economics
        - from: economics
          to: terms
        - from: terms
          to: call
    approximationNotes: null
    claimRefs: [CV001, CV002, CV003, CV008, CV010, CV013]
callouts:
  - calloutType: recommendation
    title: Recommendation
    body: >-
      Track Exa rather than buy at the last disclosed price. The category case is compelling, but
      current public evidence still lacks the economic and structural detail needed to underwrite
      the round on risk-adjusted return.
    claimRefs: [CV001, CV003, CV011, CV013]
  - calloutType: risk
    title: Most important downside trigger
    body: >-
      If larger platforms make retrieval good-enough and privacy-sensitive buyers hesitate on
      self-serve plans, Exa could face multiple compression before public evidence ever catches up
      to the 2026 valuation.
    claimRefs: [CV005, CV007, CV014]
