        blocks:
          - type: paragraph
            body: >
              The most credible technical through-line in the assigned pool is that Exa controls more of the retrieval
              stack than a wrapper on a general search engine. Exa's own research page says it trains, embeds, and
              serves its own large-scale search index and models, and the same page highlights 2026 work on Dynamic
              Highlights, Canon search orchestration, and highlights-serving efficiency. External practitioner-oriented
              sources add the infrastructure detail that makes the product thesis coherent: AWS documents configurable
              search modes and filters at the API edge, while AI Engineer says Exa built a custom vector database for
              high query volumes and tuned embeddings for code search. The most defensible synthesis is a layered
              system: semantic retrieval and indexing at the base, extraction and highlighting in the middle, and newer
              research-orchestration endpoints above that. [Sources: Exa Research, AWS, AI Engineer, Runany,
              RuntimeWire]
