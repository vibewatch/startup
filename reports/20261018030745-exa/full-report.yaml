  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public evidence points to a layered stack from client integrations through retrieval and extraction to Exa's
      indexed search infrastructure.
    data:
      layers:
        - label: Client and partner entry points
          detail: Developers or downstream products initiate searches or research jobs through direct APIs and partner tools.
          modules:
            - Direct SDK/API calls
            - Partner integrations such as Strands Agents
            - Downstream product embeds such as Firefox Smart Window
          outputs:
            - Search requests
            - Research tasks
        - label: Task orchestration surfaces
          detail: Different surfaces expose raw retrieval versus higher-order research workflows.
          modules:
            - Search API
            - Exa Agent
            - Websets / enrichment surfaces
          outputs:
            - Mode-selected search calls
            - Async research jobs
        - label: Retrieval controls
          detail: Search requests can vary by mode and filters instead of only keyword queries.
          modules:
            - Semantic search modes
            - Category and domain filters
            - Date constraints
          outputs:
            - Ranked candidate pages
        - label: Content extraction and grounding
          detail: Selected pages are converted into LLM-usable text, highlights, and structured outputs.
          modules:
            - exa_get_contents
            - Highlights
            - Structured outputs
          outputs:
            - Passages
            - Full-page text
            - Structured fields
        - label: Indexing and model layer
          detail: >-
            Official and independent sources describe Exa as operating its own large-scale index, embeddings, and
            code-search models.
          modules:
            - Own search index
            - Embedding models
            - Code-search tuning
          outputs:
            - Semantic matches
            - Developer-doc retrieval
        - label: Serving infrastructure
          detail: The company presents retrieval quality and latency as an infrastructure problem, not just a UI problem.
          modules:
            - Highlights server
            - Custom vector database
            - Query routing/orchestration
          outputs:
            - Low-latency responses
            - High-query-volume serving
    approximationNotes: >-
      This figure synthesizes public descriptions into operating layers; it does not imply disclosure of exact internal
      service boundaries.
