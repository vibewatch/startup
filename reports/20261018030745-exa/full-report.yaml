      - number: '4.2'
        title: Traction and GTM motion
        blocks:
          - type: paragraph
            body: >
              Exa's public traction story is credible but still metric-mixed. The company says it had more than 5,000
              companies and 400,000 developers on the platform by May 2026, and independent summaries repeat those
              figures alongside named customers such as Cursor, Cognition, HubSpot, Databricks, AWS, Vercel, and
              Anysphere. Those references suggest the product is not just experimental infrastructure for hobbyists; it
              is already embedded in agent and developer workflows that can generate repeat API demand.


              The GTM motion also looks hybrid. Exa's developer-first API distribution appears to create top-of-funnel
              adoption, while the company is simultaneously building more traditional enterprise coverage: the Series C
              announcement says Marcus Holm joined as CRO to lead a global GTM organization, and the technical blog
              still says the team is "small and growing quickly." What is missing is the efficiency layer that would
              turn this into an underwritable sales model. There is no public CAC, payback, pipeline conversion,
              expansion, or retention data, so the best public read is that demand exists but sales productivity remains
              opaque.
            claimRefs:
              - CI003
              - CI004
              - CI009
              - CI010
              - CI011
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
