              - CI010
              - CI013
              - CI014
              - CI015
      - number: '4.3'
        title: Cost structure and capital needs
        blocks:
          - type: paragraph
            body: >
              Exa does not present like a light wrapper business. Official and third-party sources consistently describe
              a self-built search stack: proprietary crawlers, a large search index, custom vector databases, and
              internally trained embedding and extraction models. The SVIC tear sheet adds specific infrastructure
              markers, including an expanded GPU cluster of 144 H200s and 3,456 CPUs, while the Series C announcement
              says the company plans to scale to "100s of thousands of searches per second." Taken together, those
              details imply a delivery model with meaningful compute, storage, and engineering cost before sales and
              marketing are layered on top.


              The May 2026 financing should reduce immediate fundraising pressure, but it does not eliminate
              capital-risk questions. Exa said the $250 million round will fund next-generation models, infrastructure
              capacity, and GTM expansion, which is consistent with a business still investing heavily ahead of the
              revenue base. What the public record does not show is the actual cash balance, monthly burn, gross margin,
              debt, or any project-finance-like obligations. Investors can therefore conclude that Exa has fresh
              capital, but not that it already has a durable or efficiently financed margin structure.
            claimRefs:
              - CI001
              - CI002
              - CI012
              - CI013
              - CI014
              - CI016
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >
              The financial case is promising but incomplete. Revenue quality looks better than a pure "pilot revenue"
              story because public evidence points to repeatable usage billing, real customer adoption, and expansion
              into higher-value workflow products. At the same time, the available revenue numbers are not directly
              comparable: AlphaSignal cites a Sacra estimate of roughly $10 million ARR in September 2025, while
              UpMarket cites $12 million of 2025 revenue, and those should not be treated as interchangeable. The
              pricing history is also muddy enough that realized net revenue per query remains uncertain.


              The bigger blocker is margin and financing visibility. Exa may ultimately be a strong infrastructure
              business, but public data does not show whether its own crawl, indexing, GPU, and GTM investments are
              already compounding into attractive gross margins and payback. The adverse financial scenario is also
              clear: if model platforms internalize search or customers shift workloads toward proprietary data, query
              growth for a standalone search API could compress materially. Before underwriting, investors should
              require board-approved revenue and gross-margin detail by product line, customer-cohort retention and
              expansion data, and a current capitalization-and-runway package.
            claimRefs:
              - CI008
              - CI010
              - CI013
              - CI014
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Usage beats seats
            body: >-
              The clearest public signal is that Exa bills on API activity rather than per-user seats, which makes usage
              intensity and retained query volume more important than logo count alone.
            calloutType: insight
            claimRefs:
              - CI005
              - CI006
          - type: callout
            title: Margin path is still opaque
            body: >-
              Owning search infrastructure may create technical differentiation, but it also means the public story
              still lacks the gross-margin and burn disclosures needed to prove attractive unit economics.
            calloutType: risk
            claimRefs:
              - CI013
              - CI014
              - CI015
          - type: callout
            title: Underwrite only after private operating data
            body: >-
              The next diligence step is not another valuation headline; it is board-approved revenue, margin,
              retention, and runway data broken out by product line and customer cohort.
            calloutType: recommendation
            claimRefs:
              - CI008
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and workflow fit
        blocks:
          - type: paragraph
            body: >
              In customer-workflow terms, Exa is trying to remove the glue work between "search the web," "read the
              page," and "hand useful context to an LLM." AWS's Strands integration describes Exa as an AI-native
              retrieval layer that returns structured content directly into an agent loop, while the same integration
              exposes separate search and content-retrieval tools for discovery versus full-page grounding. Independent
              write-ups extend that picture beyond raw search: Exa is repeatedly described as a single programmable
              surface for live search, extraction, deep research, and structured outputs. That matters because the
              product is not just a faster SERP substitute; it is a workflow primitive for developers building research
              agents, coding assistants, and market-intelligence automations that need current web evidence in
              model-ready form. [Sources: AWS, AI Hackers, Runany, i-scoop, RuntimeWire]
