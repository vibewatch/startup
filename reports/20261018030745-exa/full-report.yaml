  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape spans direct APIs, adjacent workflows, and the status quo stack
        blocks:
          - type: paragraph
            body: >-
              The assigned pool does not support a narrow "Exa vs one direct clone" framing. Exa's own positioning
              emphasizes semantic discovery, its own index and models, highlights, full-page retrieval, and deeper
              reasoning modes for agent workflows, while competitor and independent sources describe several adjacent
              alternatives that solve only part of the same job. Tavily presents itself as a production retrieval layer
              that bundles search, extraction, crawl, map, and research; Firecrawl competes as an extraction-first web
              data stack; Brave competes on independent-index search and privacy; and Perplexity competes by coupling
              search with answer generation. The status quo substitute is also material: teams can assemble discovery,
              extraction, and web-unlocking from multiple vendors instead of standardizing on Exa alone. Exa Agent
              further broadens the field, because it pushes Exa upward from raw retrieval into structured research
              workflows rather than keeping the company inside a pure search-API box.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP006
              - CP008
              - CP012
