chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and product posture
        blocks:
          - type: paragraph
            body: >
              Exa presents itself as infrastructure for AI agents, not as a general consumer destination. The company
              homepage frames the product around "the world's data for AI agents" and says developers use Exa to search
              public-web and private information, while the research page says the team trains and serves its own search
              index and models. Independent profiles line up with that positioning: AI Engineer describes Exa as web
              search infrastructure for AI applications and notes use cases across coding assistants, chat agents, and
              business tools, while third-party company profiles describe an API-centric business with semantic search,
              content extraction, and research workflows.


              The same sources support a stable core identity even when scale metrics diverge. Public profiles identify
              Exa as a San Francisco company founded in 2021, with Exa Labs Inc. listed as the legal entity and
              "formerly Metaphor Systems" appearing in one company profile. That combination makes the chapter reusable
              as the report's identity anchor: Exa is a private Series C company building search, retrieval, and
              content-extraction infrastructure for AI systems, but precise current operating metrics still need
              confirmation from management rather than public trackers.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO015
