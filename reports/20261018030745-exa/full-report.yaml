      - number: '1.2'
        title: Leadership, governance, and key-person concentration
        blocks:
          - type: paragraph
            body: >
              Public coverage still centers Exa heavily on its founders. TechCompanyNews names Will Bryk as CEO and
              Jeffrey Wang as co-founder, and AI Engineer adds prior operating context by tying Bryk to Cresta and Wang
              to Plaid. The product narrative, fundraising story, and launch coverage all continue to route through
              founder-led technical credibility, which suggests strong founder-market fit but also meaningful key-person
              dependency while Exa scales beyond early technical customers.


              Governance has started to widen, but only partially in the assigned evidence. The clearest public
              expansion point is the May 2026 Series C, where multiple sources say Sarah Wang of Andreessen Horowitz
              joined the board; TechCompanyNews also says Marcus Holm joined as CRO to build go-to-market depth. Those
              signals matter because they show Exa is adding external oversight and commercial leadership, yet the
              assigned public sources still do not provide a full board roster, voting control picture, or founder
              succession depth below the named executives.
