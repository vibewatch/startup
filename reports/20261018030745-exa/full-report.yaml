  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Exa's visible customer motion starts with developers and coding-agent teams, then tries to expand into broader
      research and enterprise workflows before public proof quality becomes the limiting factor.
    data:
      nodes:
        - label: Discover AI-native search gap
          actor: Developers and ML engineers
          phase: Discovery
          touchpoints:
            - Need live-web retrieval beyond model training data
            - Benchmark semantic relevance, latency, and clean text extraction
        - label: Evaluate API and workflow fit
          actor: Product and engineering teams
          phase: Technical evaluation
          touchpoints:
            - Test search, answers, and deep-research workflows
            - Review per-query pricing and zero-data-retention positioning
        - label: Adopt in coding and research agents
          actor: AI-native application builders
          phase: Initial production
          touchpoints:
            - Cursor and Cognition fit the coding-agent wedge
            - Finance, GTM, and data workflows appear in partner and press coverage
        - label: Spread through developer-led usage
          actor: Self-serve developers and internal champions
          phase: Expansion
          touchpoints:
            - Public profiles cite 400,000+ developers and 5,000+ companies
            - Broader usage can create internal references before formal enterprise sale
        - label: Seek enterprise standardization
          actor: Security, procurement, and platform owners
          phase: Commercialization
          touchpoints:
            - Larger logos imply enterprise interest
            - Public sources do not disclose contract terms, retention, or concentration
        - label: Hit proof-quality ceiling
          actor: Investors and new buyers
          phase: Diligence
          touchpoints:
            - Named logos are helpful but mostly logo-level
            - Official demo warns outputs may contain errors or omissions
    claimRefs:
