          strong in private data.
        - >-
          Could justify paying near or above the last round only if current ARR, margin, and cohort behavior show real
          scale economics.
        - Bundling by larger platforms still compresses upside if differentiation fades.
        - Would need management-grade 2026 KPI disclosure or equivalent diligence access.
      - - Base
        - >-
          Adoption breadth is real, but current economics remain only partially visible and financing terms stay
          private.
        - >-
          Supports tracking the company and waiting for better price or better evidence rather than stretching at the
          current headline mark.
        - Narrative strength outruns underwritten fundamentals.
        - Best fit for the assigned evidence today.
      - - Bear
        - >-
          Retrieval becomes more commoditized, or privacy/compliance limits reduce expansion into sensitive enterprise
          workflows.
        - >-
          Would argue for avoiding the round or requiring a materially better entry setup than the last public
          valuation.
        - Multiple compression arrives before Exa proves durable enterprise monetization.
        - Triggers if diligence shows weak paid conversion, poor retention, or unfavorable preference overhang.
    notes: >-
      Scenario logic is qualitative because the assigned public evidence does not disclose enough current financial
      detail to support precise valuation ranges.
    claimRefs:
      - CV005
      - CV007
      - CV008
