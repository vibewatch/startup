  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: agent retrieval infrastructure, not consumer search'
        blocks:
          - type: paragraph
            body: >-
              The market boundary matters because "search" is too broad a label for what Exa is actually selling. The
              company is positioned around programmatic retrieval for AI systems: semantic search, full-content
              extraction, query-specific highlights, and increasingly packaged research workflows. That puts the
              included spend in developer infrastructure, AI product, research, and workflow automation budgets rather
              than in consumer search advertising or general web navigation. The closest substitutes are Google/Bing
              APIs, Perplexity Sonar, Tavily, and manual research workflows, not conventional consumer destinations.
              Public evidence also suggests the product is meant to be embedded inside coding assistants, chat agents,
              and research tools, which narrows the relevant market to buyers that care about machine-readable retrieval
              quality, deterministic latency, and downstream token efficiency.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM011
      - number: '2.2'
        title: 'Sizing lenses: broad AI-agent demand is real, but Exa''s public SAM remains unproven'
        blocks:
          - type: paragraph
            body: >-
              The assigned pool supports multiple market lenses, but none is a full standalone TAM/SAM/SOM stack for
              Exa. AgentMarketCap gives the broadest demand lens with a 2025 AI-agents market estimate of roughly $7.6
              billion and a 2033 projection of $183 billion, while the same source says the AI-search-API category
              attracted $2.8 billion across 45 deals in 2024-2025. Those figures show capital and category momentum, but
              they are wider than Exa's immediate wedge. The closest bottom-up lens is adoption footprint: public round
              summaries and company profile aggregators repeat 5,000-plus companies and 400,000-plus developers using
              Exa by May 2026. That is enough to validate demand, but not enough to isolate how much spend sits in
              developer search APIs versus higher-level research workflows or broader agent infrastructure.
            claimRefs:
              - CM004
              - CM007
              - CM008
              - CM009
              - CM010
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM007
              - CM008
              - CM009
              - CM015
      - number: '2.3'
        title: Buyer, user, and payer segments cluster around builders of agentic products
        blocks:
          - type: paragraph
            body: >-
              Public use cases point to a buyer map centered on organizations building products that need fresh web
              retrieval as an input. Coding-assistant vendors are the clearest segment because they need current
              documentation and issue discovery outside model training cutoffs. A second segment is enterprise chat or
              knowledge products that need cited answers and news search. A third segment is research-heavy workflows in
              finance, consulting, GTM, and data operations, where multi-step discovery and structured outputs matter
              more than consumer-style search. Exa's move from raw search endpoints toward Exa Agent and related
              workflow products suggests the company is trying to capture more budget from those higher-value research
              tasks rather than only charging for low-level retrieval calls. The figure below is not a SAM model; it is
              a commercialization stack that shows how public evidence narrows from claimed data coverage to actual
              usage footprint and product-control signals.
            claimRefs:
              - CM004
