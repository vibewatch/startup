        title: Capability breadth and pricing create multiple migration paths
        blocks:
          - type: paragraph
            body: >-
              Public evidence suggests that buyers compare Exa against different rivals depending on the missing
              capability. Tavily is the cleaner substitute when a team wants one vendor for search plus extraction,
              crawl, map, and research; Firecrawl is stronger when the workflow starts from known URLs and requires
              scrape, crawl, or interactive extraction; Parallel competes on lower list pricing and flexible search
              modes; and Perplexity targets use cases where the developer wants a cited answer rather than direct
              retrieval control. Exa still appears harder to replace for Websets and special indexes such as people,
              company, and scholarly search, so the practical switching cost is concentrated in those specialized
              surfaces rather than in basic public-web search alone.
