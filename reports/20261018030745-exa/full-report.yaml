      - number: '2.4'
        title: Growth drivers and constraints determine whether the category stays distinct
        blocks:
          - type: paragraph
            body: >-
              The main adoption drivers are practical ones: better semantic recall than keyword-oriented search,
              full-document outputs instead of snippets, token-efficient extraction, domain filtering, and latency low
              enough to sit inside multi-step agent loops. Those benefits are most valuable when the buyer's product
              quality depends on fresher or more precise retrieval than a general search API can provide. The
              constraints are equally clear. Public differentiation claims still lean heavily on company-linked or
              AI-generated synthesis sources rather than on neutral benchmarks. Google and Bing can respond with bundled
              search grounding, maintaining a specialized crawl/index stack is capital-intensive, and consolidation
              around adjacent vendors could compress standalone pricing power. That leaves Exa's long-term market
              definition tied to whether "search for agents" remains a paid infrastructure layer instead of becoming a
              bundled model-provider feature.
            claimRefs:
              - CM006
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The investable market is narrower than 'AI search'
            body: >-
              Exa's current wedge is best read as agent-retrieval infrastructure for builders that need semantic recall,
              full-content extraction, and predictable latency inside software workflows, not as a claim on all search
              spend.
            calloutType: insight
            claimRefs:
              - CM001
              - CM006
              - CM013
          - type: callout
            title: Category momentum is clearer than category sizing
            body: >-
              Public sources show strong adoption and financing interest, but they still do not prove a clean standalone
              SAM or durable budget line for Exa's niche apart from broader AI-agent software and workflow spending.
            calloutType: risk
            claimRefs:
