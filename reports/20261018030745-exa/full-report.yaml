      - number: '3.3'
        title: Switching costs are real, but strongest in specialist surfaces and enterprise posture
        blocks:
          - type: paragraph
            body: >-
              The strongest public case for Exa durability is not that alternatives do not exist, but that its product
              bundle mixes specialist search surfaces with enterprise-friendly packaging. Independent and official
              sources both describe Exa as operating its own crawling and indexing stack, supporting fast search through
              deeper research modes, and claiming enterprise controls such as SOC 2 Type II, zero data retention, and
              HIPAA on the enterprise plan. Independent profiles also attribute meaningful adoption to Exa, including
              more than 400,000 developers, 5,000 companies, and distribution into Firefox Smart Window and iOS Quick
              Answers. Even so, the assigned pool does not show public realized pricing, committed-use terms, or
              verified win-loss data against rivals, so public traction is still weaker than a documented lock-in story.
            claimRefs:
              - CP001
              - CP007
              - CP009
              - CP013
              - CP014
      - number: '3.4'
        title: Adverse evidence centers on commoditization, bundles, and rival benchmark claims
        blocks:
          - type: paragraph
            body: >-
              The clearest adverse signal is that several rivals argue they can beat Exa on the part of the workflow
              they care about most. Firecrawl publishes better coverage and F1 scores than Exa in its own evaluation,
              Parallel advertises lower search pricing and comparable benchmark positioning, and Brave emphasizes index
              independence and privacy rather than Exa-style semantic discovery. None of those points, by itself,
              disproves Exa's differentiation because the strongest negative evidence here is vendor-authored and narrow
              to each rival's preferred use case. But taken together they show a real commoditization risk: buyers can
              multi-home across specialized tools or bundle their own stack, which pressures Exa anywhere the customer
              values extraction depth, list-price savings, or generated answers more than Exa's special indexes and
              semantic-discovery workflow.
            claimRefs:
              - CP004
              - CP005
              - CP011
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing
        blocks:
          - type: paragraph
            body: >
              Public evidence supports a usage-based API monetization model rather than classic seat-based SaaS. Preqin
              describes multiple billable units across neural search, keyword search, and content retrieval, while
              AlphaSignal says Exa monetizes "primarily through usage-based API pricing rather than seats." That matters
              because revenue quality depends on request volume, mix, and realized unit pricing instead of simple seat
              expansion. The public product set also implies more than one revenue stream: search API calls, content
              retrieval, higher-level research workflows such as Exa Agent, and GTM/data products such as Websets or the
              company-and-people index.


              The pricing record is still not clean enough for underwriting. Preqin says Exa separately charges for
              content retrieval, but the August 2026 SVIC tear sheet says Exa "bundled content extraction into base
              search costs" in March 2026. That conflict could reflect a product change, a plan-tier difference, or
              stale third-party documentation; without contract examples, it is not safe to assume current realized
              pricing, attach rates, or how much revenue sits in extraction versus search calls. Financial diligence
              should therefore treat public list pricing as directional evidence only, not as a basis for revenue
              recognition or gross-margin modeling.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
          - type: table
            tableRef: TI001
            claimRefs:
              - CI005
              - CI006
