      - number: '1.3'
        title: Funding path, scale signals, and milestone cadence
        blocks:
          - type: paragraph
            body: >
              Exa's financing arc steepened materially in 2025-2026. Public trackers agree on an $85 million Series B in
              September 2025 at a $700 million valuation and on a May 2026 Series C of $250 million at a $2.2 billion
              valuation, but they disagree on earlier round sizing and even on total capital raised after the Series C.
              The chapter therefore treats funding direction as verified while preserving uncertainty on exact
              cumulative proceeds and economic terms. Public scale signals also need caution: customer and developer
              counts are directionally strong, but revenue, headcount, and even "latest valuation" fields differ across
              trackers, so later chapters should reuse only the ranges and explicitly marked conflicts captured here.


              Product and company milestones nevertheless show a real shipping cadence. The official research page
              records technical milestones from early 2024 through late 2026, and RuntimeWire says Exa Agent launched on
              June 16, 2026 as a higher-level research endpoint. That cadence supports the thesis that Exa is broadening
              from raw retrieval into agent workflow infrastructure. At the same time, independent commentary still
              flags material execution risk: maintaining its own crawler and index is capital intensive, competition
              from large AI and search platforms is obvious, and the public market still lacks clean evidence on durable
              revenue quality relative to the new valuation.
            claimRefs:
