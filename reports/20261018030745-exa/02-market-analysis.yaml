callouts:
  - calloutType: "insight"
    title: "The investable market is narrower than 'AI search'"
    body: >-
      Exa's current wedge is best read as agent-retrieval infrastructure for builders that need
      semantic recall, full-content extraction, and predictable latency inside software workflows,
      not as a claim on all search spend.
    claimRefs: ["CM001", "CM006", "CM013"]
  - calloutType: "risk"
    title: "Category momentum is clearer than category sizing"
    body: >-
      Public sources show strong adoption and financing interest, but they still do not prove a
      clean standalone SAM or durable budget line for Exa's niche apart from broader AI-agent
      software and workflow spending.
    claimRefs: ["CM004", "CM009", "CM015"]
