    rows:
      - ["Search API", "Usage-based API billing on neural or keyword search requests", "Per 1,000 searches", "Public list pricing exists", "Supported by third-party pricing summaries; realized net price unknown", "Provide customer contracts and realized ASP by tier."]
      - ["Content retrieval / extraction", "Billable retrieval or extraction events attached to search workflows", "Per 1,000 retrievals or bundled into search", "Public evidence conflicts on separate billing versus bundling", "Material pricing ambiguity", "Provide current pricing page history and invoice examples."]
      - ["Exa Agent / higher-level research workflows", "Higher-level structured research endpoint layered on top of search infrastructure", "Likely usage-based, but public unit pricing not disclosed", "Commercial motion visible; monetization unit not public", "Product evidence is stronger than revenue evidence", "Disclose SKU packaging, minimums, and contribution margin."]
      - ["Websets / company-and-people data workflows", "GTM enrichment and lead-generation workflow products built on Exa's index", "Unknown", "Use case is public; revenue contribution is not", "Expansion path visible but revenue mix unavailable", "Break out revenue by product family and customer segment."]
    notes: "List pricing and product availability come from public summaries; rows distinguish disclosed list mechanics from still-private realized pricing and revenue mix."
    claimRefs: [CI005, CI006, CI007, CI008, CI011]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - SKU / motion
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - ["Neural search (1-25 results)", "USD 5 per 1,000 searches", "Public list price only", "No realized pricing, minimum-commit, or overage disclosures", "Preqin"]
      - ["Neural search (26-100 results)", "USD 25 per 1,000 searches", "Public list price only", "Unknown enterprise discounts or committed-use pricing", "Preqin"]
      - ["Keyword search (1-100 results)", "USD 25 per 1,000 searches", "Public list price only", "Unknown product mix versus neural search", "Preqin"]
      - ["Content retrieval / extraction", "Preqin says USD 1 per 1,000 retrievals; SVIC says content extraction was bundled into base search costs in Mar 2026", "Conflicting public evidence", "Current policy, customer exemptions, and invoice treatment are undisclosed", "Preqin; SVIC"]
    notes: "This table is about public list or summary pricing, not realized customer pricing or recognized revenue."
    claimRefs: [CI006, CI007, CI008]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["Customer count", "5,000+ companies (May 2026)", "Medium", "Shows distribution breadth and possible repeat API demand", "Provide paid vs free accounts, top-customer concentration, and cohort retention."]
      - ["Developer adoption", "400,000+ developers (May 2026)", "Medium", "Suggests developer-led funnel and ecosystem reach", "Provide active developers, conversion to paid use, and usage concentration."]
      - ["ARR estimate", "~USD 10M ARR (Sep 2025 estimate)", "Low", "Directional scale marker only; not the same as GAAP revenue", "Provide board-approved ARR bridge and methodology."]
      - ["Annual revenue estimate", "USD 12M revenue in 2025 after USD 5.7M in 2024", "Low", "Shows possible growth, but metric source differs from ARR estimate", "Provide audited or board-approved revenue by quarter and product line."]
      - ["Gross margin", null, "Low", "Core to judging whether Exa is infrastructure-like or software-like economically", "Provide gross margin by product line, hosting/crawl costs, and support burden."]
      - ["CAC / payback / NRR", null, "Low", "Needed to underwrite the developer-to-enterprise GTM model", "Provide CAC, payback, expansion, and net retention by segment."]
      - ["Cash burn / runway / debt", null, "Low", "Fresh capital does not prove financing durability without burn and obligation data", "Provide cash balance, monthly burn, debt facilities, and liquidation preferences."]
      - ["Infra intensity proxy", "144 H200 GPUs; 3,456 CPUs; own crawl/index stack", "Medium", "Explains why gross margin and capex/opex discipline are major diligence questions", "Provide compute spend, reserved-capacity commitments, and utilization."]
    notes: "Null means the metric is not publicly disclosed in the assigned evidence; ARR, revenue, and infrastructure proxies are not interchangeable."
    claimRefs: [CI003, CI004, CI009, CI010, CI013, CI014, CI015]
figures:
