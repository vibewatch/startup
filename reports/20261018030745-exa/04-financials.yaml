          value: "Search, retrieval, and research workflow calls"
          note: "Developer and enterprise use cases both depend on repeat API usage."
        - id: pricing
          label: Usage-based pricing
          value: "USD 5 per 1,000 searches; USD 1 per 1,000 retrievals"
