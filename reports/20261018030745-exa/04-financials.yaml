    summary: "The public evidence points to a usage-based billing loop whose economics still depend on undisclosed infrastructure and GTM efficiency."
    data:
      nodes:
        - id: demand
          label: Demand base
          value: "5,000+ companies; 400K+ developers"
          note: "Publicly disclosed adoption base as of May 2026."
        - id: accounts
