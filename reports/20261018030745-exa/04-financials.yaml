        - id: capital
          label: Capital support
          value: "USD 250M Series C"
          note: "Management says proceeds fund models, infrastructure, and GTM expansion."
      edges:
        - from: demand
          to: accounts
          label: "Broad adoption has to convert into paid customer cohorts"
        - from: accounts
          to: requests
          label: "Paid accounts generate recurring query volume"
        - from: requests
          to: pricing
          label: "Requests convert into usage-based billings"
        - from: pricing
          to: delivery
          label: "Revenue is reduced by compute, crawl, and extraction costs"
        - from: delivery
          to: capital
          label: "Fresh financing still matters because margin efficiency is undisclosed"
    approximationNotes: "Pricing nodes reflect public list pricing and should not be read as realized net revenue or gross profit."
    claimRefs: [CI003, CI004, CI005, CI006, CI008, CI012, CI013]
callouts:
  - calloutType: insight
    title: Usage beats seats
    body: "The clearest public signal is that Exa bills on API activity rather than per-user seats, which makes usage intensity and retained query volume more important than logo count alone."
    claimRefs: [CI005, CI006]
  - calloutType: risk
    title: Margin path is still opaque
    body: "Owning search infrastructure may create technical differentiation, but it also means the public story still lacks the gross-margin and burn disclosures needed to prove attractive unit economics."
    claimRefs: [CI013, CI014, CI015]
  - calloutType: recommendation
    title: Underwrite only after private operating data
    body: "The next diligence step is not another valuation headline; it is board-approved revenue, margin, retention, and runway data broken out by product line and customer cohort."
    claimRefs: [CI008, CI014]
