  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Provider
      - Free tier / entry point
      - Search pricing signal
      - Included or adjacent capabilities
      - Implication
    rows:
      - [Exa, "20,000 free requests per month", "$7 per 1,000 search requests; $12-$15 per 1,000 deep or deep-reasoning requests; $1 per 1,000 contents pages", "Highlights, full-page text, answer endpoint, contents, monitors, enterprise plan", "Pricing is broad but no longer obviously cheapest for generic search workloads"]
      - [Tavily, "1,000 credits per month", "$5-$8 per 1,000 basic searches", "Extract, Map, Crawl, Research", "Competes well when buyers want predictable retrieval-stack pricing rather than special indexes"]
      - [Firecrawl, "1,000 credits per month", "About $1.66-$6.40 per 1,000 searches on paid plans", "Scrape, Crawl, Interact, Alexandria data providers", "Can replace multiple tools when extraction depth matters most"]
      - [Parallel, "$5 monthly credits", "$1 per 1,000 Turbo or Fast searches; $5 Basic or Advanced", "Extract, Task API, FindAll, Monitor, hosted keyless MCP", "Most direct public price undercut to Exa among the assigned sources"]
      - [Perplexity, "No free tier listed in assigned pool", "$5 per 1,000 requests or $1 with Fast Search", "Search plus answer generation in one call", "Good fit when the buyer values direct answers more than retrieval control"]
      - [Brave, "$5 monthly credits with card requirement", "$5 per 1,000 requests", "Independent index plus LLM Context endpoint", "Alternative for privacy or index independence rather than a perfect Exa replacement"]
    notes: >-
      Prices are public list signals from the assigned pool and are appropriate for packaging
      comparison, not realized enterprise economics. Discounts, committed-use terms, and overage
      behavior remain unresolved.
    claimRefs: [CP004, CP005, CP006, CP009]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Higher x values indicate broader retrieval-stack breadth, while higher y values indicate
      stronger agent-native search differentiation based on the cited product descriptions.
    data:
      points:
        - label: Exa
          x: 8
          y: 9
          note: Own index, highlights, Websets, and deep reasoning keep Exa closest to a specialist agent-search platform.
        - label: Tavily
          x: 9
          y: 7
          note: Broader retrieval stack than Exa, but less evidence of differentiated special indexes.
        - label: Firecrawl
          x: 10
          y: 6
          note: Broadest extraction and crawl stack in the assigned pool, but more extraction-led than discovery-led.
        - label: Parallel
          x: 7
          y: 7
          note: Strong pricing and benchmark marketing, but fewer specialist indexes are evidenced.
        - label: Perplexity
          x: 6
          y: 5
          note: Stronger as a cited-answer engine than as a full retrieval-control surface.
        - label: Brave
          x: 6
          y: 6
          note: Differentiates on privacy and independent index rather than on semantic-discovery workflow depth.
    approximationNotes: >-
      Coordinates are an authored ordinal synthesis from the cited claims, not benchmark scores.
      They reflect relative breadth of public retrieval surfaces and relative agent-native search
      differentiation in the assigned evidence.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP006, CP008, CP011, CP012]
