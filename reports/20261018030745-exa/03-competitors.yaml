      - ["Integrated extraction / crawl / map", "Partial: search plus contents and monitors", "Yes: extract, map, crawl, research", "Yes: search, scrape, interact, crawl", "Partial: extract plus task/research APIs", "Not evidenced in the assigned pool as a full extraction stack", "Partial: LLM Context returns extracted context"]
      - ["Specialized entity or list-building surfaces", "Yes: Websets plus people/company/scholarly references", "Not evidenced in assigned pool", "Not evidenced in assigned pool", "Not evidenced in assigned pool", "Not evidenced in assigned pool", "Not evidenced in assigned pool"]
      - ["Cited answer generation in same workflow", "Answer endpoint and deep reasoning", "Research endpoint, but positioned as retrieval infrastructure", "Can return scraped content, not positioned as answer engine", "Task API for deep research and enrichment", "Core positioning", "LLM Context helps, but not positioned as a full answer engine"]
    notes: >-
      The matrix uses only public descriptions in the assigned pool. "Not evidenced" means this
      worker did not find support in the pool, not that the provider categorically lacks the
