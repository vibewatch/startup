      - number: '4.2'
        title: 成本结构、单体经济模型与经营性现金流
        blocks:
          - type: paragraph
            body: >-
              决定 Verda 财务表现的核心经营变量，在于其北欧基础设施布局带来的结构性成本优势。其运营的数据中心位于芬兰和冰岛，电力全部来自当地水力与风力等 100%
              可再生能源。这种地理集中度大幅压降了每度电费成本，并通过自然风冷显著缩减机械制冷开支，形成了优良的经营杠杆。关键在于，Verda 报道称在 2026
              年初已实现经营性现金流为正，在处于早期成长期、高资本密集型的基础设施厂商中，这一进展并不多见。然而在投资评估中，公开宣称的现金流转正不能与可持续的会计毛利率混为一谈。每 GPU
              机时的营业成本、硬件折旧年限、获客成本（CAC）及净留存率（NRR）等核心单体经济指标仍处于严格保密状态。缺少经审计的数据以验证现金流是否主要受短期预付定金或阶段性算力短缺所支撑，跨越硬件迭代周期的远期单体盈利能力便无法得到独立核实。
            claimRefs:
