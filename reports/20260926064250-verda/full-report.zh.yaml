            body: >-
              2026 年，在全球前沿 GPU 产能极度紧缺与企业对专用 AI 基础设施需求攀升的双重驱动下，Verda 商业化进程陡峭上扬。2026 年第一季度其年化收入运行率翻番并突破 51.3 million 欧元，远超
              2025 年底 A 轮融资期估算不足两千万欧元的水平。截至 2026 年 7 月，Verda 披露年化收入运行率已达 $165
              million，半年内实现三倍扩张，一跃成为欧洲增速最快的基础设施厂商之一。与此同时，管理层声称已实现经营性现金流为正，表明其携手 Supermicro 部署的 NVIDIA Blackwell B200 和
              B300 机群具备良好的单体经济效益。但对这一亮眼运行率需保持审慎推敲：Verda
              未披露分客户群留存指标、净留存率（NRR），亦未公开多年期预留合同与易波动的按需/现货实例之间的收入占比。在缺少公开客户留存率与合同期限数据的情况下，投资人无法验证这条陡峭增长曲线的底层持续性。
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
