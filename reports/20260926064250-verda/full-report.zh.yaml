  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 涵盖各客群从接入上线到企业级生产全流程的生命周期阶段、触点与扩张动态。
    data:
      nodes:
        - label: 阶段 1：发现与评估
          stage: Discovery & Evaluation
          segment: AI 工程师与科研团队
          touchpoints:
            - Self-service web console
            - API & documentation review
            - Community forums
          description: 工程师评估可用 GPU 架构，并对照超大规模云厂商进行基准价格比对。
        - label: 阶段 2：原型搭建与试点
          stage: Prototyping & Pilot
          segment: 早期 AI 初创企业
          touchpoints:
