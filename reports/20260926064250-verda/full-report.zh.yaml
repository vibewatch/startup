      - number: '7.2'
        title: 监管、法律与环境风险敞口
        blocks:
          - type: paragraph
            body: >-
              Verda 自述符合 GDPR，并持有 SOC 2 Type II 以及 ISO 27001、27017、27018 和 27701
              认证。这些表态证明公司进行了合规投入，但不能视作完备的法律抗辩结论：现有核查材料中并未包含具体的审计报告、证书原件、审计范围、豁免项、数据处理协议（DPA）、次级数据处理方清单，亦缺少针对 US Cloud
              Act
              豁免主张的专业法律论证。随着公司计划进军美国市场，股权控制层级、数据跨境流动与算力部署属地边界将面临更严苛的审视。此外，关于可再生能源的宣称虽经公司、某投资人及某供应商多方背书，但现有证据仍无法证实购电协议（PPA）的实配比例、电网接入瓶颈，以及规划产能所需的落地许可。
            claimRefs:
              - CR002
              - CR005
              - CR010
              - CR014
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR005
              - CR010
