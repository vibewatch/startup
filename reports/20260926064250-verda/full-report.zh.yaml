      - number: '1.4'
        title: 运营规模、基础设施里程碑与战略阻力
        blocks:
          - type: paragraph
            body: >-
              2025 至 2026 年间，公司的商业化与运营规模呈超高速扩张态势。2026 年第一季度，其年化收入运行率翻番并突破 $60 million，随后在 2026 年下半年跨过 $100 million ARR
              的里程碑门槛。团队规模亦同步扩张，从 2025 年不足 60 人增至 2026 年底涵盖 27 个国籍的 200 多名团队成员，并在伦敦和旧金山设立了区域商业办公室。基础设施布局上，Verda
              扩建了芬兰的数据中心业务，推进在 Akaa 设立专属站点的规划，并向欧盟委员会递交了建设容纳 100,000 张加速卡的 AI 超级工厂（AI GigaFactory）重大提案。尽管扩张迅猛，Verda
              仍面临严峻的战略阻力，包括来自全球公有云巨头 AWS、Azure 和 Google Cloud 的激烈价格战、AI 半导体供应链的严苛配额瓶颈，以及对照上市基础设施同业时所面临的一级市场估值倍数审视。
            claimRefs:
