      - number: '1.5'
        title: 重点图表
        blocks:
          - type: callout
            title: 垂直整合的绿色基础设施优势
            body: Verda 自主持有从数据中心可再生电力到上层编排工具的完整基础设施栈，借此拉开与普通算力撮合中介的差距。依托北欧气候与 100% 清洁电力运营，既实现了可持续的成本优势，又缓解了欧洲本土对数据主权的关切。
            calloutType: strength
