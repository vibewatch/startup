      - number: '7.3'
        title: 运营、质量与安全风险敞口
        blocks:
          - type: paragraph
            body: >-
              公司宣称其历史可用性超过 99.9%、设有合理的 SLA
              及故障赔付机制，但在指定维度的反向检索中并未发现收录的宕机事件、安全违规或历史状态记录。这一记录缺失并不能证明事故从未发生。产能扩张同步推高了算力交付、人员招聘与跨区域落地的执行难度：据报道的规划包括新招 100
              多名员工、进军英美市场，以及在 2027 年实现 250 MW 的运营目标。Supermicro 发布的客户案例虽提供了切实交付证据（包括 Blackwell 系统与 20 至 30
              分钟的集群开通速度），但该材料系合作伙伴口径，并未对全网机群可靠性、安全控制或交付履约进行独立测试。
            claimRefs:
              - CR001
              - CR005
              - CR010
              - CR012
              - CR013
