            - Credit card self-service billing
            - CLI and Terraform tools
          description: 团队在 20 至 30 分钟内拉起带 InfiniBand 互联的 16x-128x B200 GPU 实例。
        - label: 阶段 3：推理规模扩张
          stage: Inference Scaling
          segment: 高吞吐应用开发者
          touchpoints:
            - Serverless GPU endpoints
            - Autoscaling policies
            - Object storage attachment
          description: 工作负载从零弹性扩容至数百颗 GPU，以应对日常查询峰值。
        - label: 阶段 4：生产级模型训练
          stage: Production Training
          segment: 基础模型实验室
          touchpoints:
            - Dedicated rack-scale clusters
            - In-house AI Lab co-engineering
            - Custom Slurm / Kueue schedulers
          description: 驻场工程师协助优化算子核心效率，保障长时间稳定训练。
        - label: 阶段 5：企业级安全加固
          stage: Enterprise Hardening
          segment: 受监管企业与医疗机构
          touchpoints:
            - Confidential Computing TEE
            - SSO and IAM audit logging
            - SOC 2 Type II compliance reviews
          description: 硬件级隔离与符合 GDPR 的欧盟数据驻留打通了企业级采购通路。
