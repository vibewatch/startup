      - number: '6.4'
        title: 客户扩张动态、采购阻力与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Verda 的拓客扩张（Land-and-Expand）依托两段式路径：先以零摩擦的自助按需实例吸引开发者切入，待客户算力规模扩张后再转化为专属预留集群。研发团队可通过自动化 Web 控制台、CLI 工具及
              Terraform Provider，在 20 至 30 分钟内开通含 16 至 128 张 NVIDIA B200 GPU
              的即时集群，并通过标准信用卡完成结算。待客户业务演进为大规模模型训练或线上生产推理后，客户便转入由专项工程团队保障的多机架预留容量协议。然而，Verda
              仍面临结构性采购摩擦与客户集中度风险。其商业条款执行严苛的欠费追偿机制，明确规定一旦逾期将暂停访问乃至直接删除数据，这直观反映出前沿硬件采购租赁的高资本压力。更深层的挑战在于，尽管 Verda 已达成 $165
              million 的运行率，但相较坐拥庞大企业生态的 AWS 和 Microsoft Azure，其仍属小体量玩家。为防止客户回流至公有云巨头或倒向更低廉的新兴算力云，Verda 必须持续砸入数亿美元用于硬件换代。
            claimRefs:
              - CU012
              - CU013
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU012
              - CU013
      - number: '6.5'
        title: 重点图表
        blocks:
          - type: callout
            title: 负载驱动的客户粘性 vs 算力同质化风险
            body: >-
              Verda 将自研 AI Lab 团队深度嵌入客户工作流（如为 Magnific 深度优化推理算子，为 Epsilon Health 联合设计数据管线），从而与纯粹的 GPU
              转租中介拉开差距。这种工程深度提升了前沿大模型客户的切换成本，但标准按需 GPU 租赁依然容易受到现货价格战的冲击。
            calloutType: insight
            claimRefs:
              - CU008
              - CU012
          - type: callout
            title: 超大规模云生态广度与资本密集度壁垒
            body: >-
              尽管 Verda 展现出亮眼的客户扩张势头并将运行率推升至 $165M，但 AWS 和 Azure
              依然构筑了难以逾越的生态广度与资产负债表规模壁垒。持续的硬件迭代与高资本密集度意味着，客户留存必须能够转化出稳健的长效现金流，方能覆盖产能扩张带来的债务本息与资本回报要求。
            calloutType: risk
            claimRefs:
              - CU006
              - CU014
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险全景
        blocks:
          - type: paragraph
            body: >-
              最核心的残留风险在于资本密集度与交付速度之间的拉扯碰撞。据 Channel Insider 报道，垂直整合需要巨额前期资本开支，而 Verda 设定了 2027 年运营规模超过 250 MW
              的目标，后续可能寻求规模大得多的融资。账面已筹资金并不等于即时可用现金，且无论是融资公告还是收入运行率报道，均未披露非受限流动性、已承诺的项目贷款、签约保底利用率或单体经济数据。次级风险是供应商与硬件平台集中度：当前交付高度绑定
              NVIDIA 加速卡与 Supermicro 整机系统。至于监管、安全、可用性与环保声明，公司虽给出了既定缓解措施，但其实际覆盖范围及独立第三方验证仍存疑问。
            claimRefs:
              - CR006
              - CR007
              - CR010
              - CR011
              - CR012
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
