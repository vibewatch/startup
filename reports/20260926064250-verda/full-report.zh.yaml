              - CM015
      - number: '2.3'
        title: 买方细分、工作流分配与采购触发机制
        blocks:
          - type: paragraph
            body: >-
              专业 AI
              基础设施平台领域的企业采购决策由特征鲜明的买方群体驱动，涵盖具身自主机器人先锋、超大规模内容生成平台，以及对隐私合规有严格要求的科技企业。预算审批权通常掌握在工程副总裁、基础设施主管和首席技术官手中，他们统管集中式算力配额，并极力规避传统企业级云协议动辄数月的漫长采购周期。驱动这些买方下单的核心因素包括：即时获取紧俏的新一代加速芯片、摆脱刚性多年最低承诺的弹性扩缩容，以及总体拥有成本（TCO）的显著降低。商业对标数据显示，在同等原始算力机时下，专业
              GPU 云宣称的单价相较 AWS、Microsoft Azure 和 Google Cloud Platform 等传统超大规模云厂商最高可降低
              90%。但机构采购团队必须在表面每小时费率优势与内部编排集成诉求、平台管理开销以及数据迁移现实难度之间权衡取舍。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: 结构性增长驱动因素与应用约束
        blocks:
          - type: paragraph
            body: >-
              专业 AI 云基础设施的长期扩张由强大的宏观驱动力支撑，尤以向自主多智能体系统的范式转移以及欧洲科技主权的战略刚需最为显著。围绕跨境数据传输的监管压力以及面临 US CLOUD Act
              穿透管辖的风险，推升了对部署在欧盟境内、完全合规且符合 100% 可再生能源规范的主权基础设施需求。硬件生态合作（如 Verda 携手 Supermicro 联合研发基于 Blackwell 的机密虚拟机）实现了
              20 至 30
              分钟内的即时集群交付，同时提供硬件级物理隔离的加密内存保护。尽管具备这些增长催化剂，企业级落地仍面临实质约束，需在尽调中严加审核：主要阻碍包括未公开的数据出向流量（egress）资费、缺少标准化的企业支持服务定价梯度、连接现有数据湖的复杂混合组网，以及在持续分布式训练中可能导致服务意外中断的预付费余额扣减机制。
            claimRefs:
              - CM011
              - CM013
              - CM014
      - number: '2.5'
        title: 重点图表
        blocks:
          - type: callout
            title: 欧洲 AI 基础设施中的主权算力刚需
            body: >-
              欧洲对美国超大规模云厂商的依赖，使其持续暴露在 US CLOUD Act 等长臂管辖风险之下，并面临日益加剧的 GPU 采购瓶颈。区域专业服务商将北欧可再生能源与 NVIDIA Blackwell
              硬件隔离机密计算相结合，把监管主权从被动的合规约束转化为决定性的采购差异化壁垒。
            calloutType: insight
            claimRefs:
              - CM011
              - CM012
              - CM013
          - type: callout
            title: 采购阻力：未公开的出向流量费与预付费停机机制
            body: >-
              尽管公开算力标价相比超大规模云厂商牌价最高可节省 90%，但企业买方仍面临出向流量费、定制网络互联及预付费账户扣费机制的不透明；在长时间分布式训练中，预付费机制存在实例被中断停机的风险。正式 SLA
              与用量信用额度条款仍是投资与采购尽调不可或缺的前提。
            calloutType: risk
            claimRefs:
              - CM014
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与细分市场
        blocks:
          - type: paragraph
            body: >-
              人工智能云基础设施市场已分化为三大阵营：老牌美国超大规模云厂商、美国专业 GPU 新兴云（Neocloud），以及正在崛起的欧洲本土主权基础设施新锐。传统云巨头（如 Amazon Web
              Services、Microsoft Azure 和 Google Cloud）坐拥主导性的企业分销渠道，但在 GPU 配额排期、复杂的计费体系，以及受制于 US Cloud Act
              的欧洲数据主权担忧上，频频遭遇企业客户的抵触。在专业 GPU 赛道，CoreWeave 和 Lambda Labs
              等美国厂商依托数十亿美元的集群预留订单与标杆硬件合作，抢占了可观的市场份额。在欧洲本土，Verda 的核心竞争对手为 Nebius 和
              Nscale，二者同样在竞相打造区域性超大规模云替代方案。竞争对手多着力于长期企业预留或工业级数据中心建设，而 Verda
              则凭借开发者驱动的自助式交付、芬兰与冰岛的清洁能源经济效益，以及已实现盈利的运营单体经济模型形成差异化。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
      - number: '3.2'
        title: 技术架构与产品能力差异化
        blocks:
          - type: paragraph
            body: >-
              评估竞争壁垒需综合衡量集群网络吞吐量、前沿芯片获取能力、租户隔离机制及主权运营管控力。Verda 联合研发了基于 Nvidia Blackwell 架构的机密计算，将硬件认证的隔离能力延伸至多 GPU
              配置，以承载机器人与 VPN 推理等对安全性极度敏感的企业级负载。此外，Verda 依托低延迟 InfiniBand 互联架构提供即时集群（Instant Clusters），支持自助式分布式训练，在
              SemiAnalysis ClusterMAX 基准评测中与 Google Cloud Platform
              并列斩获铜奖。公司位于芬兰和冰岛的数据中心利用北欧充沛的水电与风电可再生资源，并结合环境自然风冷，相比法兰克福或弗吉尼亚等传统数据中心枢纽具备结构性运营成本优势。作为 Nvidia 官方 Preferred
              Partner，Verda 在 Blackwell B200、B300 及 GB300 加速卡上锁定了优先硬件配额，避开了中小算力聚合商普遍遭遇的缺卡瓶颈。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP014
          - type: table
