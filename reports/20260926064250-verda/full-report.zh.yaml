      - number: '3.3'
        title: 定价体系、计费机制与总体拥有成本
        blocks:
          - type: paragraph
            body: >-
              Verda 将商业模式锚定在透明、自助的公开定价上，不设强制性前期长期承诺：其 H100 SXM5 按需算力挂牌价在每小时 $2.29 至 $3.25 之间，可中断现货（spot）算力在每小时 $0.80 至
              $1.63 之间。相比之下，Spheron 等聚合平台裸金属 H100 实例标价为每小时 $2.01，Nebius 收取每小时 $2.95，而 CoreWeave 企业级 HGX 系统费率约为每小时
              $4.76。但采购分析显示 Verda 计费机制存在明显摩擦：算力使用按 10 分钟向上取整，意味着 45 分钟的训练任务会被按 50 分钟扣费，而 Spheron 和 RunPod
              等竞品均精确到秒级计费。此外，虽然持久化 NVMe 与共享存储按每 GiB-月 $0.20 透明计费，但 Verda 公开价目表中隐去了明确的出向带宽资费与正式企业级 SLA
              赔付标准，给数据密集型训练部署的总体拥有成本（TCO）带来不确定性。
            claimRefs:
