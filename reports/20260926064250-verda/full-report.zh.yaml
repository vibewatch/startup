              Verda 运营全栈 AI 云基础设施模型，兼顾弹性按需算力消耗与专用长期集群预留两种商业变现途径。商业化基本盘扩张迅猛：年化收入运行率在 2026 年第一季度翻番并突破 $60 million（报道折合逾
