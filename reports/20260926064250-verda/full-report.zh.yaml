      - number: '1.2'
        title: 管理团队、技术创始人与公司治理
        blocks:
          - type: paragraph
            body: >-
              Verda 由创始人兼首席执行官 Ruben Bryon 掌舵，其深耕 GPU 虚拟化和云基础设施软件，自公司成立起便一直统领全局。核心管理团队兼具底层基础设施工程能力与严谨的学术界 AI 研究背景。首席技术官
              Arturs Polis 主导自底层硬件向上的系统设计与 ML 基础设施路线图；首席运营官 Jorge Santos 则负责数据中心建设、物流供应链及核心硬件采购。研发端由首席研究总监 Antonio J.
              Dominguez 挂帅，其带领的专属 AI Lab 团队直接与超大规模企业客户联合研发，将前沿研究需求反哺至生产环境功能中。随着拥有 20 年企业发展与投行经验的首席财务官 Mikko
              Einiö，以及负责统筹各业务区域 SOC 2 Type II 和 ISO 严格合规认证的首席信息安全官 Michael Champion 相继加盟，公司的财务风控与治理架构显著强化。
            claimRefs:
              - CO001
              - CO003
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO003
      - number: '1.3'
        title: 融资历程、债权银团与机构股东
        blocks:
          - type: paragraph
            body: >-
              欧洲市场对主权算力需求激增，驱动 Verda 获得的机构资金支持快速提速。继 2021 年 11 月完成 $1 million 的种子前轮融资后，公司于 2024 年 10 月完成 $8 million
              种子轮融资，由 byFounders 领投，J12 Ventures 及多位知名天使创业者跟投。2025 年 9 月，Verda 斩获由 byFounders、Skaala、Tesi 和 Varma Mutual
              Pension Insurance Company 联合领投的 $64 million A 轮融资，并获得北欧贷款机构的债权配套资金。2026 年 4 月，融资势头进一步爆发，公司敲定规模达 $117
              million（EUR 100 million）的综合融资，由 Lifeline Ventures 领投，包含由 Nordea、Armada Credit Partners、Danske Bank、Norion
              Bank 和 LocalTapiola 组成的庞大债权银团。2026 年 9 月，Verda 获美国机构 Emergence Capital 领投的 $189 million B
              轮融资，正式跻身独角兽行列；累计融资总额达到 $378 million 至 $450 million，投后估值至少达 $1.0 billion。
            claimRefs:
