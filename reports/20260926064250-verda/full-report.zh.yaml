      - number: '3.4'
        title: 护城河韧性、供应链依赖与战略定位
        blocks:
          - type: paragraph
            body: >-
              Verda 的长期竞争护城河取决于其能否顺着技术栈向上攀升至编排层、托管推理终端与 Serverless 开发者服务，而非单纯依赖原始算力租赁。随着全球 GPU
              产能爬坡，同质化的硬件租赁不可避免地遭遇价格侵蚀与大宗商品化压力。此外，欧洲主权主张面临结构性局限：尽管 Verda 确保了数据存储免受 US Cloud Act 管辖，但其核心技术栈高度依赖美国供应商，即依靠
              Nvidia 供应加速芯片、Supermicro 提供服务器平台，并依靠美国风投机构补充成长期资金。欧洲初创与美国龙头之间的资本鸿沟依然悬殊：CoreWeave 单季营收即达 €2.25
              billion，年度资本开支高达 €30 billion，而 Verda 年化运行率仅为 €144 million，累计融资额仅 €390 million。要想保持持久的差异化，Verda
              必须在超大规模资本整合欧洲市场之前，借助北欧成本优势建立起实质性的开发者生态绑定。
            claimRefs:
