  - id: FI001
    title: 端到端算力变现与现金流传导桥
    type: flow
    summary: 运营转化传导模型：展示客户算力需求如何依托北欧基础设施效率转化为经营性现金流为正的业务运作。
    data:
      nodes:
        - id: workload-demand
          label: 客户工作负载需求
          detail: AI 初创企业与企业客户提交按需推理及模型训练任务请求
        - id: automated-provisioning
          label: 即时集群编排调度
          detail: 通过 Kubernetes 与 Slurm 进行自助开通，在 20 至 30 分钟内完成部署，无商务合同摩擦
        - id: nordic-execution
          label: 北欧数据中心计算执行
          detail: 在芬兰与冰岛设施中执行算力任务，100% 采用水电与风电等可再生能源供电
        - id: usage-metering
          label: 计量收入生成
          detail: 通过秒级计费实例、无服务器请求以及多月期承诺集群向客户收取费用
        - id: cost-absorption
          label: 基础设施成本吸收
          detail: 低成本可再生电力、自然环境冷却以及通过债务融资的硬件租赁降低了运营营业成本（COGS）
        - id: cash-flow-positive
          label: 经营现金流兑现
          detail: 产生正向经营现金流，支撑对 GPU 算力的再投资及国际化业务扩张
      edges:
        - from: workload-demand
          to: automated-provisioning
          label: 提交任务
        - from: automated-provisioning
          to: nordic-execution
          label: 分配集群
        - from: nordic-execution
          to: usage-metering
          label: 消耗 GPU 机时
        - from: usage-metering
          to: cost-absorption
          label: 总营收
        - from: cost-absorption
          to: cash-flow-positive
          label: 净营业利润率
    approximationNotes: 该流程展示了结合 Verda 技术架构及财务披露提炼出的概念化运营模型；其内部成本分摊比例未公开披露。
