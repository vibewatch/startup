      - number: '7.4'
        title: 合作伙伴、财务状况与投资逻辑打破触发点
        blocks:
          - type: paragraph
            body: >-
              Verda 持续获得股权与债权融资，但已披露的资金结构在提供现金跑道支撑的同时，也埋下了再融资、贷款限制性条款、股权稀释与算力闲置等多重风险。据 Tesi
              报道，公司实现了经营性现金流为正且第一季度年化收入运行率超过 $60 million；Channel Insider 则报道 7 月年化收入运行率达 $165
              million——这些仅为发债或融资方自述的运行率切片，并非经审计的年度收入、ARR、实际烧钱速度或在手现金储备。因此，投资逻辑打破的触发点应重点关注：重大产能承诺前未能敲定全额确认的资金支持、实际算力利用率持续跌破投资测算的盈亏平衡点、产能交付实质性延期、失去
              NVIDIA 或 Supermicro 的核心供货配额、合规认证过期或范围缩水，以及可用性表现跌破合同约定的 SLA。
            claimRefs:
