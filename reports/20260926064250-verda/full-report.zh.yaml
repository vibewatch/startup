chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位、架构体系与商业模式
        blocks:
          - type: paragraph
            body: >-
              Verda 由 Ruben Bryon 于 2020 年在赫尔辛基创立，原名 DataCrunch，现已成长为全栈垂直整合的人工智能云基础设施提供商。公司于 2025 年 11 月正式由 DataCrunch
              更名为 Verda，体现出对算法真实性与欧洲本土可持续算力交付的双重重视。不同于转售第三方算力的云资源聚合商或撮合中介，Verda 直接自主设计并管理物理服务器集群、网络基础设施、数据中心以及自研 AI
              开发者工具链。其位于芬兰和冰岛的数据中心完全采用 100% 可再生能源，并借助北欧天然自然风冷构建起结构性运营成本优势。作为 NVIDIA Preferred Partner，Verda 提供按需调用的高性能
              GPU 算力，包括搭载多 GPU 机密计算能力的前沿 NVIDIA Blackwell HGX 系统。该平台依托灵活的订阅制与按用量计费模式，服务 Nokia、1X、ExpressVPN 和 Freepik
              等成熟企业及高增长初创团队的商业化机器学习负载。
            claimRefs:
              - CO001
              - CO002
              - CO008
              - CO009
              - CO010
              - CO013
