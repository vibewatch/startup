        - 在注资之前，必须进行核心客户访谈核实并审查债务契约
      - - 风险评级
        - 高
        - 高度依赖债务、通过 Supermicro 开展供应商融资，以及潜在的 GPU 供给常态化
        - 在投资条款清单中对下行保护及股权结构表上的清算优先权压制进行建模
      - - 估值判断
        - 合理
        - 隐含的 6.1 倍收入运行率倍数，介于公开上市托管服务商（1.6 倍 - 5.9 倍）与美国新型云厂商之间
        - 在软件利润率未获验证前，避免支付超过 6.5 倍远期收入的增长溢价
    notes: 综合归纳 Verda 在 2026 年 9 月完成 B 轮融资后的核心投资观点、置信度、风险评级与估值判断。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV008
      - CV010
      - CV011
      - CV013
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 视角
      - 核心论点
      - 支撑证据
      - 逻辑证伪触发项
    rows:
      - - 投资逻辑：主权护城河
        - 欧洲企业与受监管实体需要脱离美国《云法案》（Cloud Act）管辖的本地数据驻留
        - 依托北欧清洁能源吸引了遍布 50 多个国家的客户，包括 Aleph Alpha、1X 及 Freepik
        - 欧盟通过全欧范围的云主权豁免条款，或超大规模云厂商建立经审计的本地隔离设施
      - - 投资逻辑：一体化效率
        - 自建数据中心与平台软件相比传统超大规模云厂商可带来高达 90% 的成本优势
        - 部署 Blackwell GB300 系统，且收入运行率从一季度的 $51.3M 快速扩张至 7 月的 $165M
        - NVIDIA 加速器交付出现严重供应链延误，或电力基础设施成本通胀
      - - 反向逻辑：公用事业级利润率
        - 全栈自有模式将高昂的软件估值倍数转化为公用事业级别的设备折旧周期
        - Seedtable 及行业分析均指出，一旦 GPU 紧缺缓解，利润率将面临压缩
        - 在来自 CoreWeave 与 AWS 的竞争性降价压力下，GAAP 毛利率跌破 35%
      - - 反向逻辑：供应商融资
        - 硬件供应商入股表明在采购昂贵 GPU 集群时受到刚性资金约束
        - Supermicro 与政府背景基础设施基金（Tesi、Varma）一同参与 B 轮股权投资
        - Supermicro 或二级硬件供应链中断，影响 2027 年规划中的 250 MW 扩建
    notes: 将欧洲主权云的结构性驱动因素，与资本开支需求及公用事业级估值风险进行对比。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV008
      - CV009
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设条件
      - 估值与倍数逻辑
      - 下行触发项与风险
      - 概率信号
    rows:
      - - 乐观情景
        - 2027 年底前收入运行率达到 $330M；确保 250 MW 电力；维持 55%+ 毛利率
        - 基于 6.5 倍远期收入倍数对应 $2.15B 估值，反映稀缺的主权算力溢价
        - Blackwell 架构延期交付，或美亚国际扩张遭遇执行阻力
        - 25%——在走向大宗商品化的算力市场中执行门槛极高
      - - 基准情景
        - 收入运行率增长至 $230M；欧洲企业稳步采用；综合毛利率达 45%
        - 基于 4.5 倍远期收入倍数对应 $1.04B 估值，与同类专业基础设施可比公司对齐
        - GPU 现货价格逐步受压，早期 AI 实验室客户存在一定集中度
        - 50%——兼顾需求与资本约束的最可能路径
      - - 悲观情景
        - 随 GPU 获取常态化，收入运行率停滞在 $140M；与美国新型云厂商打价格战；偿债压力沉重
        - 基于 2.5 倍倍数对应 $350M 估值，反映重资产托管特征
        - 超大规模云厂商大幅削减欧洲推理定价；面临高额固定债务偿还义务
        - 25%——若自研模型减少总体算力需求，则构成实质性风险
    notes: 情景分析针对 12 至 18 个月内的经营业绩、GPU 供需格局及市场倍数进行估值敏感性建模。
    claimRefs:
      - CV004
      - CV007
      - CV008
      - CV009
      - CV010
      - CV014
