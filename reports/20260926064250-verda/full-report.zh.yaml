      - number: '6.3'
        title: 标杆客户实证与生产级负载
        blocks:
          - type: paragraph
            body: >-
              Verda 在多个关键 AI 业务场景落地了经核实的生产环境部署，证明其基础设施已脱离浅层实验概念验证（PoC），切入实际核心运营。在基础大模型研发领域，Aleph Alpha 将 Verda 的 GPU
              集群作为核心研发底座，派驻现场工程师与 Verda 联合研发底层集群编排软件。在高并发内容生成领域，Magnific 在 Verda 平台上每月处理超过 300 million 次推理请求，调用超 500 张
              GPU 的弹性托管机群动态应对昼夜流量峰谷，同时将端到端推理延迟锁定在 2 秒目标线以内。在医疗领域，Epsilon Health 在专属集群上训练放射学基础模型，直接受益于 Verda 自研 AI Lab
              定制开发的数据流传输架构。此外，独立推理供应商 DeepInfra 部署了搭载 Supermicro 的 Blackwell 系统以扩充高性能服务能力；人形机器人独角兽 1X 则在其 NEO
              机器人上运行视频世界模型，达成低于 12 秒的“指令到动作（prompt-to-action）”执行响应。这些多元化的标杆案例印证了 Verda
              覆盖模型全生命周期的技术落地能力，但关键大客户的收入集中度仍未对外披露。
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
