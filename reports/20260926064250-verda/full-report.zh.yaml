  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、业务分类与排除支出
        blocks:
          - type: paragraph
            body: >-
              专业 AI 基础设施平台市场是加速计算中一个结构独立的细分领域，核心聚焦于专用 GPU
              实例、高吞吐集群网络以及生产级推理算力。随着企业级人工智能从实验性模型探索转向大规模基础训练与低延迟生产推理，企业采购决策层日益将专业 AI
              云与通用超大规模云基础设施严格区分开来。本市场边界明确排除了通用云计算产品组合、关系型数据库托管、传统企业级虚拟化以及应用层 SaaS
              软件。此外，本尽调范围严格将该领域与同名但无关联的企业（如加州独立医疗福利机构 Verda Healthcare, Inc.）隔离开来。紧扣加速计算实例、InfiniBand 多节点集群与 Serverless
              推理架构界定严格边界，采购团队与投资人方能精准对标平台经济模型，避免通用云或软件支出扭曲算力指标。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 市场规模测算、TAM/SAM/SOM 边界与增长视角
        blocks:
          - type: paragraph
            body: >-
              第三方行业独立测算显示，2026 年全球 AI 云基础设施市场规模约为 $58.5 billion，预计到 2034 年将以 22.5% 的复合年增长率持续扩张至 $297
              billion。这一庞大增量主要由前沿加速芯片极度的全球供需失衡所驱动，企业算力需求持续超出超大规模云厂商的可用供给。在广阔的总可用市场（TAM）中，区域化与定制化算力诉求界定了可服务市场（SAM），尤其是在欧洲企业对主权数据本地化、GDPR
              合规及可再生能源配套的迫切需求下。在这一可服务市场格局中，Verda 展现出迅猛的商业化势头：年化收入运行率从 2026 年第一季度的 €51.3 million 攀升至 2026 年 6 月的 $100
              million，并在完成 $189 million B 轮融资后于 2026 年 7 月达到 $165
              million。不过，非上市厂商披露有限及现货市场价格波动掩盖了独立云服务商群体的实际多租户利用率基准与长期集群预留留存率，令测算精确度受到一定市场不透明度的制约。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
