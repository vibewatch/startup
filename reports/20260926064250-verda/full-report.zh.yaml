      - number: '4.3'
        title: 资本充裕度、债务负担与融资依赖性
        blocks:
          - type: paragraph
            body: >-
              为维持硬件部署速度，Verda 构建了结合风险股权与专项债权工具的混合资本结构。自 2020 年成立以来，Verda 历经五轮融资，累计筹集资金已超 $450 million。最新一笔是 2026 年 9
              月完成的超额认购 $189 million B 轮融资，由 Emergence Capital 领投，Supermicro、MUFG Innovation Partners、Varma 及 Lifeline
              Ventures 参投。在此之前，公司于 2026 年 4 月完成 $117 million 股债综合融资，并在 2025 年完成了 $64 million A 轮融资。尤为关键的是，Verda 深度引入了由
              Nordea、Armada Credit Partners、Danske Bank、Norion Bank 及 LocalTapiola 等北欧知名金融机构提供的设备债权融资。公司计划将新增资金用于扩充 GPU
              算力储备并采购新一代 NVIDIA Blackwell 系统。然而，相较于 Nscale（累计融资 $3.6B）和 CoreWeave 等美国专业竞争对手，Verda 累计 $450 million
              的资本体量依然偏小，随着集群部署规模扩大，后续可能遭遇资本充裕度瓶颈。
            claimRefs:
              - CI001
