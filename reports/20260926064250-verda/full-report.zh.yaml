            title: 融资总额不等于可用流动性
            body: 公开披露的融资总额混杂了股权与债权，不能证明其实际拥有非受限现金、剩余借款额度、贷款契约缓冲空间，亦无法反映规划扩建项目中已有资金的覆盖比例。
            calloutType: risk
