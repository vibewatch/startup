evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-and-financial-metrics
    missingEvidence: Audited customer account counts, gross margin percentages, and net revenue retention rates.
    whyItMatters: >-
      Verda operates as a private company without disclosing unit economics or customer concentration figures necessary
      to verify growth quality.
    diligencePath: >-
      Request confidential customer retention metrics, cohort churn rates, and audited management accounts under NDA
      during diligence.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: minor
    topic: total-capital-raised-reconciliation
    missingEvidence: >-
      Exact reconciliation between Multiples.vc's reported $378M lifetime raised and the company blog editor note citing
      over $450M.
    whyItMatters: >-
      Discrepancies in total funding figures can obscure whether debt facilities or convertible instruments are included
      in reported equity totals.
    diligencePath: >-
      Review cap table and debt facility drawdown schedules to confirm cumulative paid-in equity versus available debt
      lines.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Audited multi-tenant utilization benchmarks and third-party verified European regional market share breakdowns for
      sovereign AI compute clusters.
    whyItMatters: >-
      Without independent utilization rates and verified regional market share data, estimates of serviceable obtainable
      market (SOM) rely heavily on vendor run-rate claims rather than audited capacity consumption.
    diligencePath: >-
      Request third-party infrastructure auditor reports or customer reference utilization logs across European clusters
      during commercial diligence.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: egress-and-sla-pricing
    missingEvidence: Official public egress data transfer tariffs and contractual enterprise SLA credit terms for Verda.
    whyItMatters: >-
      Procurement teams cannot model total cost of ownership for multi-terabyte dataset ingress/egress without published
      network bandwidth rates.
    diligencePath: >-
      Request vendor rate cards during commercial RFP review and negotiate explicit egress fee caps and uptime guarantee
      credits.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: minor
    topic: long-term-reserved-discounts
    missingEvidence: Volume discount tiers and multi-year reserved commitment schedules across B200 and GB300 clusters.
    whyItMatters: >-
      Prevents exact comparison against multi-year hyperscaler enterprise discount programs (EDPs) and CoreWeave
      multi-million dollar reservations.
    diligencePath: Obtain customized quote schedules under NDA to evaluate committed-use versus on-demand economics.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: unit-economics-and-margins
    missingEvidence: >-
      Audited breakdown of gross margins across on-demand compute versus long-term customer reservations, electricity
      cost per GPU-hour, and customer payback periods.
    whyItMatters: >-
      Essential to underwrite whether the reported cash-flow positive status reflects sustainable structural unit
      margins or short-term spot GPU supply shortages.
    diligencePath: >-
      Request management financial package containing monthly cohort revenue retention, realized compute utilization
      rates, and power purchasing agreements (PPAs).
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: debt-service-and-capex-commitments
    missingEvidence: >-
      Complete debt schedule detailing maturity dates, covenants, amortization schedules, and collateral pledges for
      equipment debt from Nordic banks.
    whyItMatters: >-
      Identifies debt service burdens on operating cash flow and borrowing capacity available for upcoming Blackwell
      hardware deployments.
    diligencePath: Review credit facility agreements with Nordea, Armada Credit Partners, Danske Bank, Norion Bank, and LocalTapiola.
    relatedQuestionRefs:
      - QI004
  - type: missing-source
    severity: material
    topic: independent-performance-benchmarking
    missingEvidence: >-
      Third-party, peer-reviewed benchmarking data comparing Verda's Blackwell and InfiniBand clusters against AWS and
      Azure under standardized MLPerf training workloads.
    whyItMatters: >-
      Current performance and startup speed claims rely predominantly on vendor press releases and self-reported
      customer testimonials.
    diligencePath: >-
      Request customer deployment telemetry, MLPerf benchmark logs, and independent network latency audit records under
      nondisclosure agreement.
  - type: private-evidence-only
    severity: minor
    topic: data-center-lease-and-pue-audits
    missingEvidence: >-
      Audited Power Usage Effectiveness (PUE) metrics and long-term lease agreements for Nordic colocation and
      construction facilities in Finland and Sweden.
    whyItMatters: >-
      Verda's low-cost sustainability narrative hinges on power efficiency and long-term facility access in Nordic
      energy markets.
    diligencePath: Review data center lease contracts, power purchase agreements (PPAs), and utility district heating agreements.
  - type: private-evidence-only
    severity: material
    topic: customer-retention-cohorts
    missingEvidence: >-
      Verifiable net revenue retention (NRR), gross revenue retention (GRR), and customer cohort churn percentages over
      trailing 12-month periods.
    whyItMatters: >-
      Without verified retention metrics, it is impossible to establish whether rapid ARR expansion is driven by durable
      organic account expansion or continuous high-churn customer replacement.
    diligencePath: >-
      Request historical customer cohort retention tables, expansion ARR breakdowns, and logo churn schedules during
      formal data room review.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-contracts
    missingEvidence: >-
      Comprehensive census of enterprise customer accounts, contract lengths, minimum spending commitments, and top-ten
      customer revenue concentration.
    whyItMatters: >-
      Public customer lists selectively highlight marquee success stories (Aleph Alpha, Magnific, Epsilon Health) while
      obscuring enterprise concentration risk and customer dependency on a small number of AI labs.
    diligencePath: >-
      Examine anonymized customer revenue concentration schedules and top-customer billing records under non-disclosure
      agreements.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: compliance
    missingEvidence: >-
      Current SOC 2 report, ISO certificates and scope, audit exceptions, DPA, subprocessor map, transfer-impact
      assessment, and legal analysis of the Cloud Act positioning.
    whyItMatters: >-
      Public certification labels do not establish the services, sites, periods, or legal entity boundaries covered by
      the controls.
    diligencePath: >-
      Obtain documents from Verda's trust process, verify certificates with their issuers, and have privacy counsel
      reconcile coverage to the product and planned US structure.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: reliability
    missingEvidence: >-
      Complete incident, breach, outage, root-cause, fleet availability, and SLA-credit history for at least the prior
      24 months.
    whyItMatters: >-
      A company uptime statement and an empty retained adverse result set cannot establish the absence, frequency,
      severity, or customer impact of incidents.
    diligencePath: >-
      Review status history, security notifications, postmortems, support records, SLA credits, insurer disclosures, and
      customer references under NDA.
    relatedQuestionRefs:
      - QR003
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Revenue concentration, contracted capacity, utilization, renewal, churn, backlog, and channel contribution by the
      largest customers.
    whyItMatters: >-
      A broad company-count claim does not establish diversified revenue or durable utilization for capital-intensive
      infrastructure.
    diligencePath: >-
      Obtain a customer-level revenue and gross-margin cohort, top-20 concentration schedule, signed capacity
      commitments, renewal history, and channel attribution.
    relatedQuestionRefs:
      - QR006
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: financial-capacity
    missingEvidence: >-
      Audited revenue, ARR definition if used internally, cash burn, unrestricted cash, debt covenants and maturities,
      committed facilities, capex schedule, utilization, and unit economics.
    whyItMatters: >-
      Funding totals and revenue-run-rate snapshots do not show cash available to fund the expansion or the utilization
      required to earn an adequate return.
    diligencePath: >-
      Reconcile audited statements and monthly management accounts to bank balances, debt documents, board-approved
      capex, facility contracts, and customer-backed utilization.
    relatedQuestionRefs:
      - QR005
      - QR010
  - type: missing-source
    severity: material
    topic: run-rate-audit-and-unit-economics
    missingEvidence: >-
      Audited financial statements detailing customer contract lengths, churn rates, hardware depreciation schedules,
      and GAAP gross margins.
    whyItMatters: >-
      Verda's $1 billion valuation relies on self-reported run-rate metrics; lack of audited margin and utilization data
      creates risk of overestimating operating leverage.
    diligencePath: >-
      Request audited 2025 financial statements, Q2/Q3 2026 management accounts, cohort retention metrics, and power
      purchase contract terms.
    relatedQuestionRefs:
      - QV009
