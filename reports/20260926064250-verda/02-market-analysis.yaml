callouts:
  - calloutType: "insight"
    title: "The Sovereign Compute Imperative in European AI Infrastructure"
    body: "European dependence on US hyperscalers creates persistent exposure to extraterritorial jurisdiction such as the US CLOUD Act alongside escalating GPU procurement bottlenecks. By pairing Nordic renewable energy with NVIDIA Blackwell hardware-isolated confidential computing, specialized regional providers transform regulatory sovereignty from a compliance constraint into a decisive procurement differentiator."
    claimRefs:
      - "CM011"
      - "CM012"
      - "CM013"
  - calloutType: "risk"
    title: "Procurement Friction: Unlisted Egress Tariffs and Prepaid Suspension Mechanics"
    body: "While headline compute rates present up to 90 percent savings against hyperscaler list prices, enterprise buyers face structural opacity around egress tariffs, custom networking interconnections, and prepaid account mechanics that risk instance preemption during long distributed training runs. Formal SLA and volume credit terms remain essential diligence prerequisites."
    claimRefs:
      - "CM014"
