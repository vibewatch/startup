chapter:
  number: 6
  title: "Customers"
  summary: "Verda has scaled its AI cloud customer base across 50+ countries to reach a $165M annualized revenue run rate as of July 2026, serving frontier model labs, robotics builders, and enterprise AI teams. Key customer deployments include Aleph Alpha, Magnific, Epsilon Health, DeepInfra, 1X, Nokia, ExpressVPN, and Freepik, spanning foundational model training, native image radiology inference, and real-time world-model serving. However, public disclosures lack net revenue retention figures, renewal rates, and customer concentration metrics, exposing unit economics to execution and hardware-cycle volatility."
sections:
  - id: "customer-base-segmentation"
    title: "Customer Base Segmentation and Target Profiles"
    body: "Verda's customer base spans three core archetypes: frontier foundation model laboratories, specialized vertical AI innovators, and enterprise organizations seeking sovereign, compliant GPU compute. Foundation model laboratories, such as Germany's Aleph Alpha, require dedicated multi-node GPU clusters equipped with high-bandwidth NVIDIA Quantum-2 InfiniBand interconnects for large-scale mixture-of-experts pre-training and fine-tuning. Vertical AI innovators, including autonomous robotics company 1X and medical imaging developer Epsilon Health, demand specialized compute configurations ranging from low-latency video world model inference engines to high-resolution data streaming pipelines for radiology models. Concurrently, enterprise organizations like ExpressVPN leverage Verda's confidential computing architecture on NVIDIA Blackwell hardware to execute prompt inference within hardware-enforced Trusted Execution Environments. Verda reports powering workloads for organizations across more than 50 countries, with commercial traction expanding from its Nordic domestic base into broader European, North American, and Asian jurisdictions. While Verda articulates clear buyer personas—typically Chief Technology Officers, Heads of Machine Learning, and Enterprise CISOs—the company does not publicly disclose the numerical breakdown of customer accounts across these tiers or the average annual contract value per segment."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-growth"
    title: "Adoption Trajectory and Compute Utilization Growth"
    body: "Verda's commercial trajectory demonstrates rapid acceleration across 2026, driven by an acute global shortage of frontier GPU capacity and rising enterprise demand for purpose-built AI infrastructure. The company doubled its annualized revenue run rate in the first quarter of 2026 to exceed 51.3 million euros, up from estimated sub-20-million-euro levels during its Series A period in late 2025. By July 2026, Verda reported reaching a $165 million annualized revenue run rate, representing a three-fold expansion within six months and positioning it as one of Europe's fastest-growing infrastructure providers. Concurrently, leadership claims the business has achieved positive operating cash flow, suggesting favorable unit economics on its deployed fleet of NVIDIA Blackwell B200 and B300 systems co-engineered with Supermicro. Nevertheless, this headline run rate must be evaluated with analytical caution: Verda does not provide cohort-level retention metrics, net revenue retention (NRR), or the proportion of revenue derived from multi-year committed capacity versus volatile on-demand spot instances. Without disclosed customer retention rates or contract durations, investors cannot ascertain the underlying durability of this steep growth curve."
    claimRefs:
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU007"
    tableRefs:
      - "TU002"
  - id: "named-production-deployments"
    title: "Named Customer Proof and Production Workloads"
    body: "Verda has established a credible roster of verified production deployments across multiple mission-critical AI use cases, demonstrating that its infrastructure supports operational workloads beyond experimental pilots. In foundation AI research, Aleph Alpha utilizes Verda GPU clusters as core R&D infrastructure, embedding engineers-in-residence who collaborate directly on low-level cluster orchestration software. In high-volume media generation, Magnific serves over 300 million monthly inference requests on Verda's platform, utilizing an elastic managed fleet of more than 500 GPUs that scales dynamically to absorb diurnal traffic spikes while maintaining a two-second target inference latency. In healthcare, Epsilon Health trains radiology foundation models on dedicated clusters, benefiting from custom data streaming engineering developed in partnership with Verda's in-house AI Lab. Furthermore, independent inference provider DeepInfra has deployed Supermicro-powered Blackwell systems to scale high-performance serving, while humanoid robotics developer 1X runs video world models on its NEO robots with sub-12-second prompt-to-action cycles. These diverse reference deployments substantiate Verda's technical capability across full model lifecycles, though customer concentration among these flagship accounts remains undisclosed."
    claimRefs:
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU011"
    tableRefs:
      - "TU003"
  - id: "expansion-loops-concentration"
    title: "Expansion Dynamics, Procurement Friction, and Concentration Exposure"
    body: "Verda's land-and-expand motion relies on a two-tier adoption model: self-service on-demand instances for frictionless developer entry, followed by dedicated cluster reservations as customer compute needs scale. Development teams can provision Instant Clusters of 16 to 128 NVIDIA B200 GPUs within 20 to 30 minutes via automated web consoles, CLI tools, and Terraform providers, paying through standard credit card processing. As customer workloads mature into large-scale training runs or production serving pipelines, accounts migrate into multi-rack reserved capacity agreements supported by dedicated engineering. However, Verda faces structural procurement friction and customer concentration risks. Commercial terms dictate strict payment enforcement, authorizing access suspension and data deletion upon payment default, reflecting the capital-intensive nature of leasing and operating cutting-edge hardware. More fundamentally, while Verda has achieved a $165 million run rate, it remains a fractional player alongside hyperscalers AWS and Microsoft Azure, which command vast enterprise ecosystems. Verda must continually invest hundreds of millions in hardware refreshes to prevent customer migration to hyperscalers or lower-cost neo-cloud competitors."
    claimRefs:
      - "CU012"
      - "CU013"
      - "CU014"
    figureRefs:
      - "FU001"
