callouts:
  - calloutType: "insight"
    title: "Workload-Driven Customer Stickiness vs Commodity Compute Risk"
    body: "Verda differentiates from pure GPU rental brokers by embedding its in-house AI Lab directly into customer workflows—optimizing inference kernels for Magnific and co-engineering data pipelines for Epsilon Health. This engineering depth increases switching costs for complex frontier models, though standard on-demand GPU rentals remain vulnerable to spot pricing competition."
    claimRefs:
      - "CU008"
      - "CU012"
  - calloutType: "risk"
    title: "Hyperscaler Breadth and Capital Intensity Barriers"
    body: "While Verda has demonstrated impressive customer expansion to a $165M run rate, AWS and Azure maintain insurmountable ecosystem breadth and balance sheet scale. Continuous hardware refresh cycles and high capital intensity mean customer retention must deliver robust long-term cash flows to service expansion debt and equity requirements."
    claimRefs:
      - "CU006"
      - "CU014"
