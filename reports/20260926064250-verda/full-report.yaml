      - number: '5.2'
        title: Product Portfolio and Hardware Infrastructure
        blocks:
          - type: paragraph
            body: >-
              Verda's commercial product portfolio centers on high-density accelerated compute systems procured through
              a strategic partnership with Supermicro. The deployment roadmap features liquid-cooled NVIDIA Blackwell
              architecture platforms, incorporating NVIDIA GB300 NVL72 rack-scale systems, HGX B300 and HGX B200
              systems, and RTX PRO 6000 Blackwell Server Edition accelerators. These platforms support intensive
              frontier model training, multimodal generation, and low-latency production inference. Rather than offering
              commoditized server colocation, Verda packages this silicon into self-service multi-node clusters
              configured with high-bandwidth InfiniBand interconnects. Custom bare-metal cluster topologies remain
              available for specialized enterprise workloads requiring dedicated hardware allocations, while managed
              inference endpoints support optimized serving of open-source architectures such as the FLUX image
              generation model family.
            claimRefs:
              - CE002
              - CE003
              - CE013
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
      - number: '5.3'
        title: Full-Stack Technology Architecture and Storage Isolation
        blocks:
          - type: paragraph
            body: >-
              The Verda technology stack operates as a vertically integrated architecture spanning six distinct layers
              from Nordic data centers up to client-facing developer interfaces. At the network tier, Verda implements a
              proprietary fabric abstraction layer that utilizes BGP EVPN to support multi-tenant overlay networks,
              ensuring low-latency communication across distributed nodes while preparing for advanced RoCE fabrics.
              Storage architecture is specifically engineered to resolve the noisy-neighbor bottleneck by providing
              dedicated physical hardware isolation for tenant storage volumes rather than shared file systems.
              Infrastructure orchestration integrates standard ML schedulers such as SLURM and Kubernetes with native
              support for PyTorch, TorchTitan, SGLang, and OpenDiLoCo. Operations are hosted across leased and owned
              facilities in Finland and Iceland powered by 100% renewable energy, with excess heat repurposed into
              municipal residential heating.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
              - CE015
          - type: table
            tableRef: TE003
            claimRefs:
