  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Perspective
      - Core Argument
      - Supporting Evidence
      - Thesis-Break Trigger
    rows:
      - - 'Thesis: Sovereign Moat'
        - European enterprises and regulated entities require local data residency outside US Cloud Act jurisdiction
        - Customer traction across 50+ countries including Aleph Alpha, 1X, and Freepik on Nordic clean energy
        - Passage of EU-wide cloud sovereignty exemptions or hyperscalers establishing local audited isolation
      - - 'Thesis: Integrated Efficiency'
        - Owning data centers and platform software allows sub-90% cost advantages vs legacy hyperscalers
        - Deployment of Blackwell GB300 systems and rapid scaling from $51.3M Q1 run rate to $165M July run rate
        - Severe supply chain delays in Nvidia accelerator delivery or power infrastructure cost inflation
      - - 'Anti-Thesis: Utility Margins'
        - Full-stack ownership converts high software multiples into utility-grade equipment depreciation schedules
        - Seedtable and industry analysis highlighting margin compression once GPU scarcity subsides
        - GAAP gross margin dropping below 35% under competitive pricing pressure from CoreWeave and AWS
      - - 'Anti-Thesis: Vendor Financing'
        - Hardware vendor participation indicates binding capital constraints in acquiring expensive GPU clusters
        - Supermicro equity participation in Series B alongside state infrastructure funds (Tesi, Varma)
        - Supermicro or secondary hardware supply disruptions impacting scheduled 250 MW expansion in 2027
    notes: >-
      Contrasts structural European sovereign cloud drivers against capital expenditure requirements and utility
      valuation risks.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV008
      - CV009
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation & Multiple Logic
      - Downside Triggers & Risks
      - Probability Signal
    rows:
      - - Bull Case
        - Reaches $330M run rate by late 2027; secures 250 MW power; maintains 55%+ gross margins
        - $2.15B valuation based on 6.5x forward revenue multiple reflecting scarce sovereign capacity
        - Blackwell architecture delays or international expansion execution friction in US/Asia
        - 25% - High execution bar in commoditizing compute market
      - - Base Case
        - Grows to $230M run rate; steady European enterprise adoption; 45% blended gross margins
        - $1.04B valuation based on 4.5x forward revenue multiple aligned with specialty infrastructure comps
        - Gradual compression of spot GPU pricing and moderate customer concentration in early AI labs
        - 50% - Most probable path balancing demand with capital constraints
      - - Bear Case
        - Run rate stalls at $140M as GPU access normalizes; pricing war with US neoclouds; debt service strain
        - $350M valuation based on 2.5x multiple reflecting capital-intensive hosting profile
        - Hyperscalers slash European inference pricing; high fixed debt repayment obligations
        - 25% - Meaningful risk if proprietary models reduce total compute demand
    notes: >-
      Scenario analysis models 12-to-18-month valuation sensitivity against operating performance, GPU supply dynamics,
      and market multiples.
    claimRefs:
      - CV004
      - CV007
      - CV008
      - CV009
      - CV010
      - CV014
