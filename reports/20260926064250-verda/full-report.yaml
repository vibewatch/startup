      - number: '7.2'
        title: Regulatory, legal, and environmental exposure
        blocks:
          - type: paragraph
            body: >-
              Verda states that it is GDPR compliant and holds SOC 2 Type II plus ISO 27001, 27017, 27018, and 27701
              certifications. Those assertions indicate mitigation investment, not a complete legal conclusion: the
              assigned pool does not contain the reports, certificates, audit scope, exceptions, data-processing
              agreement, subprocessor map, or legal analysis of the claimed protection from the US Cloud Act. Planned
              expansion into the United States also makes corporate-control, data-transfer, and workload-location
              boundaries more important. Renewable-energy claims are repeated by the company, an investor, and a
              supplier, but the evidence does not establish power-purchase matching, grid constraints, or permits for
              the planned scale.
            claimRefs:
              - CR002
