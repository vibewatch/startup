      - number: '7.4'
        title: Partner, financial, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Verda has attracted repeated equity and debt financing, but the disclosed structures create both runway
              support and refinancing, covenant, dilution, and utilization risk. Tesi reports positive operating cash
              flow and a first-quarter revenue run rate above $60 million, while Channel Insider reports a $165 million
              annualized revenue run rate in July; these are issuer-reported run-rate snapshots, not audited annual
              revenue, ARR, cash burn, or cash on hand. Thesis-break triggers should therefore include failure to secure
              fully committed financing before major capacity commitments, sustained utilization below an underwritten
              break-even level, material capacity delays, loss of critical NVIDIA or Supermicro access, expired or
              scoped-down certifications, or reliability performance below contractual SLAs.
            claimRefs:
