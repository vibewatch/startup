            title: Evidence required before underwriting scale
            body: >-
              Require committed financing, contracted power and hardware schedules, customer-backed utilization, current
              audit reports, and a complete incident/SLA history before crediting the 2027 capacity target or treating
              company-reported controls as independently verified.
            calloutType: recommendation
