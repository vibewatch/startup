              - CE008
              - CE009
              - CE011
      - number: '5.4'
        title: Security, Compliance, Differentiation, and Technical Dependencies
        blocks:
          - type: paragraph
            body: >-
              Verda positions its technical differentiation around European data sovereignty, zero-trust infrastructure,
              and hardware-attested workload isolation. To serve privacy-conscious enterprises and regulated European
              sectors outside the extraterritorial scope of the US CLOUD Act, the company co-engineered multi-GPU
              confidential computing on NVIDIA Blackwell silicon, ensuring encrypted execution environments where host
              operators cannot access memory contents. Compliance is backed by SOC 2 Type II attestation and ISO 27001,
              27017, 27018, and 27701 certifications alongside full GDPR alignment. However, technical risks remain
              concentrated in single-supplier hardware dependence: Verda's rapid Blackwell cluster deployment relies
              entirely on Supermicro's Data Center Building Block Solutions (DCBBS) manufacturing and NVIDIA's delivery
              schedules, creating operational vulnerability to component shortages or vendor delivery delays.
            claimRefs:
              - CE005
              - CE012
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Hardware-Attested Isolation and Multi-GPU Confidential Computing
            body: >-
              Verda's co-engineering of multi-GPU confidential computing on NVIDIA's Blackwell architecture provides a
              structural technical advantage for sovereign and enterprise workloads. By extending hardware-level
              isolation across multi-GPU configurations, the platform satisfies strict data isolation standards required
              by regulated sectors and enterprise privacy applications, eliminating the need to rely exclusively on
              administrative or contractual security policies.
            calloutType: strength
            claimRefs:
              - CE005
              - CE012
          - type: callout
            title: Critical Upstream Dependency on Supermicro Rack Integration and NVIDIA Silicon
            body: >-
              While Verda markets its platform as a vertically integrated AI cloud, its physical execution remains
              critically dependent on Supermicro's Data Center Building Block Solutions (DCBBS) and NVIDIA's delivery
              allocations. Any upstream manufacturing delays, component shortages, or supply reallocation in Blackwell
              rack-scale systems directly cap Verda's capacity expansion and revenue velocity.
            calloutType: risk
            claimRefs:
              - CE002
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Target Profiles
        blocks:
          - type: paragraph
            body: >-
              Verda's customer base spans three core archetypes: frontier foundation model laboratories, specialized
              vertical AI innovators, and enterprise organizations seeking sovereign, compliant GPU compute. Foundation
              model laboratories, such as Germany's Aleph Alpha, require dedicated multi-node GPU clusters equipped with
              high-bandwidth NVIDIA Quantum-2 InfiniBand interconnects for large-scale mixture-of-experts pre-training
              and fine-tuning. Vertical AI innovators, including autonomous robotics company 1X and medical imaging
              developer Epsilon Health, demand specialized compute configurations ranging from low-latency video world
              model inference engines to high-resolution data streaming pipelines for radiology models. Concurrently,
              enterprise organizations like ExpressVPN leverage Verda's confidential computing architecture on NVIDIA
              Blackwell hardware to execute prompt inference within hardware-enforced Trusted Execution Environments.
              Verda reports powering workloads for organizations across more than 50 countries, with commercial traction
              expanding from its Nordic domestic base into broader European, North American, and Asian jurisdictions.
              While Verda articulates clear buyer personas—typically Chief Technology Officers, Heads of Machine
              Learning, and Enterprise CISOs—the company does not publicly disclose the numerical breakdown of customer
              accounts across these tiers or the average annual contract value per segment.
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU008
      - number: '6.2'
        title: Adoption Trajectory and Compute Utilization Growth
        blocks:
          - type: paragraph
            body: >-
              Verda's commercial trajectory demonstrates rapid acceleration across 2026, driven by an acute global
              shortage of frontier GPU capacity and rising enterprise demand for purpose-built AI infrastructure. The
              company doubled its annualized revenue run rate in the first quarter of 2026 to exceed 51.3 million euros,
              up from estimated sub-20-million-euro levels during its Series A period in late 2025. By July 2026, Verda
              reported reaching a $165 million annualized revenue run rate, representing a three-fold expansion within
              six months and positioning it as one of Europe's fastest-growing infrastructure providers. Concurrently,
              leadership claims the business has achieved positive operating cash flow, suggesting favorable unit
              economics on its deployed fleet of NVIDIA Blackwell B200 and B300 systems co-engineered with Supermicro.
              Nevertheless, this headline run rate must be evaluated with analytical caution: Verda does not provide
              cohort-level retention metrics, net revenue retention (NRR), or the proportion of revenue derived from
              multi-year committed capacity versus volatile on-demand spot instances. Without disclosed customer
              retention rates or contract durations, investors cannot ascertain the underlying durability of this steep
              growth curve.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
      - number: '6.3'
        title: Named Customer Proof and Production Workloads
        blocks:
          - type: paragraph
            body: >-
              Verda has established a credible roster of verified production deployments across multiple
              mission-critical AI use cases, demonstrating that its infrastructure supports operational workloads beyond
              experimental pilots. In foundation AI research, Aleph Alpha utilizes Verda GPU clusters as core R&D
              infrastructure, embedding engineers-in-residence who collaborate directly on low-level cluster
              orchestration software. In high-volume media generation, Magnific serves over 300 million monthly
              inference requests on Verda's platform, utilizing an elastic managed fleet of more than 500 GPUs that
              scales dynamically to absorb diurnal traffic spikes while maintaining a two-second target inference
              latency. In healthcare, Epsilon Health trains radiology foundation models on dedicated clusters,
              benefiting from custom data streaming engineering developed in partnership with Verda's in-house AI Lab.
              Furthermore, independent inference provider DeepInfra has deployed Supermicro-powered Blackwell systems to
              scale high-performance serving, while humanoid robotics developer 1X runs video world models on its NEO
              robots with sub-12-second prompt-to-action cycles. These diverse reference deployments substantiate
              Verda's technical capability across full model lifecycles, though customer concentration among these
              flagship accounts remains undisclosed.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
      - number: '6.4'
        title: Expansion Dynamics, Procurement Friction, and Concentration Exposure
        blocks:
          - type: paragraph
            body: >-
              Verda's land-and-expand motion relies on a two-tier adoption model: self-service on-demand instances for
              frictionless developer entry, followed by dedicated cluster reservations as customer compute needs scale.
              Development teams can provision Instant Clusters of 16 to 128 NVIDIA B200 GPUs within 20 to 30 minutes via
              automated web consoles, CLI tools, and Terraform providers, paying through standard credit card
              processing. As customer workloads mature into large-scale training runs or production serving pipelines,
              accounts migrate into multi-rack reserved capacity agreements supported by dedicated engineering. However,
              Verda faces structural procurement friction and customer concentration risks. Commercial terms dictate
              strict payment enforcement, authorizing access suspension and data deletion upon payment default,
              reflecting the capital-intensive nature of leasing and operating cutting-edge hardware. More
              fundamentally, while Verda has achieved a $165 million run rate, it remains a fractional player alongside
              hyperscalers AWS and Microsoft Azure, which command vast enterprise ecosystems. Verda must continually
              invest hundreds of millions in hardware refreshes to prevent customer migration to hyperscalers or
              lower-cost neo-cloud competitors.
            claimRefs:
              - CU012
              - CU013
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU012
              - CU013
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Workload-Driven Customer Stickiness vs Commodity Compute Risk
            body: >-
              Verda differentiates from pure GPU rental brokers by embedding its in-house AI Lab directly into customer
              workflows—optimizing inference kernels for Magnific and co-engineering data pipelines for Epsilon Health.
              This engineering depth increases switching costs for complex frontier models, though standard on-demand
              GPU rentals remain vulnerable to spot pricing competition.
            calloutType: insight
            claimRefs:
              - CU008
              - CU012
          - type: callout
            title: Hyperscaler Breadth and Capital Intensity Barriers
            body: >-
              While Verda has demonstrated impressive customer expansion to a $165M run rate, AWS and Azure maintain
              insurmountable ecosystem breadth and balance sheet scale. Continuous hardware refresh cycles and high
              capital intensity mean customer retention must deliver robust long-term cash flows to service expansion
              debt and equity requirements.
            calloutType: risk
            claimRefs:
              - CU006
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk view
        blocks:
          - type: paragraph
            body: >-
              The highest residual exposure is the interaction between capital intensity and delivery speed. Channel
              Insider reports that vertical integration requires massive front-loaded capital expenditure, while Verda
              is targeting more than 250 MW of operations in 2027 and may seek substantially more financing. Funding
              raised is not cash available, and neither the financing announcements nor revenue-run-rate reports
              disclose unrestricted liquidity, committed project finance, contracted utilization, or unit economics. The
              next tier is supplier and platform concentration: current delivery is visibly tied to NVIDIA accelerators
              and Supermicro systems. Regulatory, security, reliability, and environmental claims have stated
              mitigations, but their scope and independent verification remain open.
            claimRefs:
              - CR006
              - CR007
              - CR010
              - CR011
              - CR012
