        title: Exhibits
        blocks:
          - type: callout
            title: Vertically Integrated Green Infrastructure Advantage
            body: >-
              Verda differentiates itself from capacity brokers by owning its infrastructure stack from data center
              renewable power to orchestration tools. Operating in Nordic climates with 100% clean power delivers
              sustainable cost efficiencies while mitigating European data sovereignty concerns.
            calloutType: strength
