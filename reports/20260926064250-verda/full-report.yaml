  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Stance / Rating
      - Evidence & Basis
      - Decision Implication
    rows:
      - - Recommendation
        - Track
        - Valued at $1B+ on $165M run rate (6.1x implied multiple); hardware capital intensity requires caution
        - Maintain monitoring stance until audited utilization and margin cohorts are disclosed
      - - Confidence Level
        - Medium
        - Top-line run rate disclosed by company and investors, but lack audited customer contract durations
        - Require primary customer reference calls and debt covenant review before capital entry
      - - Risk Rating
        - High
        - Heavy debt reliance, vendor financing via Supermicro, and potential GPU supply normalization
        - Model downside protection and cap table liquidation preference overhang in term sheet
      - - Valuation Stance
        - Fair
        - Implied 6.1x run-rate multiple is balanced between public hosting (1.6x-5.9x) and US neoclouds
        - Refrain from paying growth premiums above 6.5x forward revenue without proven software margins
    notes: >-
      Synthesizes headline investment stance, confidence level, risk classification, and valuation judgment following
      Verda's September 2026 Series B financing.
