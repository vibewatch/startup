        title: Exhibits
        blocks:
          - type: callout
            title: Financing is not liquidity
            body: >-
              Disclosed funding totals mix equity and debt and do not establish unrestricted cash, remaining borrowing
              capacity, covenant headroom, or the funded share of planned expansion.
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR011
