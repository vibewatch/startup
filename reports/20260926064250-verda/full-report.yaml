      - number: '7.3'
        title: Operational, quality, and security exposure
        blocks:
          - type: paragraph
            body: >-
              The company claims historical uptime above 99.9%, sensible SLAs, and compensation for disruptions, but the
              assigned adverse searches produced no retained incident, breach, or status-history source. That absence
              cannot establish that no incident occurred. Expansion adds simultaneous capacity, hiring, and geographic
              execution demands: reported plans include more than 100 hires, UK and US entry, and a 250 MW operating
              target for 2027. Supermicro's success story provides concrete deployment evidence, including Blackwell
              systems and 20-30-minute cluster provisioning, yet it is partner-issued and does not independently test
              fleet-wide reliability, security controls, or delivery schedules.
            claimRefs:
              - CR001
