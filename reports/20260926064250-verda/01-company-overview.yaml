    body: "Verda differentiates itself from capacity brokers by owning its infrastructure stack from data center renewable power to orchestration tools. Operating in Nordic climates with 100% clean power delivers sustainable cost efficiencies while mitigating European data sovereignty concerns."
    claimRefs:
