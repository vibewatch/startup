  title: "Product & Technology"
  summary: "Verda delivers an AI-native cloud platform spanning physical infrastructure to managed inference, deploying Supermicro rack-scale liquid-cooled NVIDIA Blackwell systems across Nordic facilities. The company optimizes GPU utilization through a custom BGP EVPN network overlay, dedicated tenant storage isolation, and self-service Instant Clusters, while addressing critical hardware supply concentration and scaling dependencies."
sections:
  - id: "core-workflow-and-service-delivery"
    title: "Core Service Delivery and Workflow Architecture"
    body: "Verda structures its AI cloud platform to eliminate the manual enterprise sales friction and rigid procurement cycles that characterize traditional hyperscaler compute access. The platform delivers four distinct consumption modalities: on-demand virtual GPU instances for rapid experimentation, Instant Clusters connected via InfiniBand for multi-node distributed training without administrative quotas, pre-configured serverless containers for burst inference execution, and managed inference endpoints for turnkey model serving. By decoupling user interaction from bespoke capacity negotiation, developers interact directly via a unified web dashboard and programmatic REST APIs. Workload startup performance is substantially enhanced through persistent storage optimizations, allowing machine learning engineering teams to preload large datasets and model weights into dedicated disk objects that attach to compute nodes upon initialization, reducing overall startup overhead."
    claimRefs:
      - "CE001"
      - "CE004"
      - "CE006"
    tableRefs:
      - "TE002"
  - id: "hardware-systems-and-product-portfolio"
    title: "Product Portfolio and Hardware Infrastructure"
    body: "Verda's commercial product portfolio centers on high-density accelerated compute systems procured through a strategic partnership with Supermicro. The deployment roadmap features liquid-cooled NVIDIA Blackwell architecture platforms, incorporating NVIDIA GB300 NVL72 rack-scale systems, HGX B300 and HGX B200 systems, and RTX PRO 6000 Blackwell Server Edition accelerators. These platforms support intensive frontier model training, multimodal generation, and low-latency production inference. Rather than offering commoditized server colocation, Verda packages this silicon into self-service multi-node clusters configured with high-bandwidth InfiniBand interconnects. Custom bare-metal cluster topologies remain available for specialized enterprise workloads requiring dedicated hardware allocations, while managed inference endpoints support optimized serving of open-source architectures such as the FLUX image generation model family."
    claimRefs:
      - "CE002"
      - "CE003"
      - "CE013"
    tableRefs:
      - "TE001"
  - id: "technology-architecture-and-infrastructure-stack"
    title: "Full-Stack Technology Architecture and Storage Isolation"
    body: "The Verda technology stack operates as a vertically integrated architecture spanning six distinct layers from Nordic data centers up to client-facing developer interfaces. At the network tier, Verda implements a proprietary fabric abstraction layer that utilizes BGP EVPN to support multi-tenant overlay networks, ensuring low-latency communication across distributed nodes while preparing for advanced RoCE fabrics. Storage architecture is specifically engineered to resolve the noisy-neighbor bottleneck by providing dedicated physical hardware isolation for tenant storage volumes rather than shared file systems. Infrastructure orchestration integrates standard ML schedulers such as SLURM and Kubernetes with native support for PyTorch, TorchTitan, SGLang, and OpenDiLoCo. Operations are hosted across leased and owned facilities in Finland and Iceland powered by 100% renewable energy, with excess heat repurposed into municipal residential heating."
    claimRefs:
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE011"
      - "CE015"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "security-compliance-and-architectural-risks"
    title: "Security, Compliance, Differentiation, and Technical Dependencies"
    body: "Verda positions its technical differentiation around European data sovereignty, zero-trust infrastructure, and hardware-attested workload isolation. To serve privacy-conscious enterprises and regulated European sectors outside the extraterritorial scope of the US CLOUD Act, the company co-engineered multi-GPU confidential computing on NVIDIA Blackwell silicon, ensuring encrypted execution environments where host operators cannot access memory contents. Compliance is backed by SOC 2 Type II attestation and ISO 27001, 27017, 27018, and 27701 certifications alongside full GDPR alignment. However, technical risks remain concentrated in single-supplier hardware dependence: Verda's rapid Blackwell cluster deployment relies entirely on Supermicro's Data Center Building Block Solutions (DCBBS) manufacturing and NVIDIA's delivery schedules, creating operational vulnerability to component shortages or vendor delivery delays."
    claimRefs:
      - "CE005"
      - "CE012"
      - "CE013"
      - "CE014"
