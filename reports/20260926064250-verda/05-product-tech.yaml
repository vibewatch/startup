callouts:
  - calloutType: "strength"
    title: "Hardware-Attested Isolation and Multi-GPU Confidential Computing"
    body: "Verda's co-engineering of multi-GPU confidential computing on NVIDIA's Blackwell architecture provides a structural technical advantage for sovereign and enterprise workloads. By extending hardware-level isolation across multi-GPU configurations, the platform satisfies strict data isolation standards required by regulated sectors and enterprise privacy applications, eliminating the need to rely exclusively on administrative or contractual security policies."
    claimRefs:
      - "CE005"
      - "CE012"
  - calloutType: "risk"
    title: "Critical Upstream Dependency on Supermicro Rack Integration and NVIDIA Silicon"
    body: "While Verda markets its platform as a vertically integrated AI cloud, its physical execution remains critically dependent on Supermicro's Data Center Building Block Solutions (DCBBS) and NVIDIA's delivery allocations. Any upstream manufacturing delays, component shortages, or supply reallocation in Blackwell rack-scale systems directly cap Verda's capacity expansion and revenue velocity."
    claimRefs:
      - "CE002"
      - "CE013"
