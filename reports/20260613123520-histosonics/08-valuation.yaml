    - ~$504M market cap
    - Adjacent ablation benchmark with broader device portfolio
    - Useful ceiling check for organ-preserving ablation businesses
    - Not focused ultrasound and more diversified
  - - Insightec
    - Private focused-ultrasound pioneer; 400 employees disclosed
    - Strategic platform benchmark outside public markets
    - Shows focused ultrasound can support scaled private platforms
    - No public valuation and neurology-heavy mix
