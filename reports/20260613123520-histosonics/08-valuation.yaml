- id: TV003
  title: Bull / Base / Bear Scenario Table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Probability signal
  - Key risks
  rows:
  - - Bull
    - Liver adoption keeps compounding, payer coverage broadens, kidney and at least one more indication convert into monetizable demand, and international rollout works
    - Estimated value range of $3.5B-$5.0B; meaningful upside to the August 2025 mark
    - Possible but requires execution across reimbursement, regulatory, and commercial fronts
    - Economic disclosure could still disappoint even if procedure counts rise
  - - Base
    - Liver scales steadily, reimbursement improves, and kidney advances as the first meaningful second indication without full platform monetization
    - Estimated value range of $2.0B-$3.0B; current mark sits inside the supportable band
    - Most consistent with current evidence
    - Platform remains expensive if scale metrics stay private
  - - Bear
    - Adoption decelerates, reimbursement plateaus, new indications slip, or structure proves investor-unfriendly
    - Estimated value range of $0.8B-$1.4B; premium compresses toward high-end public ablation comps
    - Material downside remains credible because current economics are undisclosed
    - Control-transaction structure and follow-on preferences could worsen new-money returns
  notes: Scenario values are analyst estimates derived from the public comp set, clinical milestones, and transaction references; they are not company guidance.
