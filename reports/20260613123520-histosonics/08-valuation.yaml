- id: TV006
  title: Final Diligence Asks Table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Cap table and preferences
    - Post-acquisition and October 2025 share classes, liquidation stack, and investor protections
    - Headline valuation can overstate common-equity attractiveness
    - Request board-approved capitalization table and financing documents
  - - Commercial scale
    - Revenue, gross margin, utilization, and backlog conversion by installed system
    - Needed to compare HistoSonics to public comps on more than narrative
    - Request audited management reporting and cohort analysis
  - - Payer realization
    - Paid-procedure volume by payer and state after CMS and Elevance wins
    - Coverage announcements may not translate into realized reimbursement
    - Request claims data and reimbursement collections analysis
  - - Kidney economics
    - Expected timeline, pricing, and adoption assumptions for the kidney launch
    - Second-indication optionality is central to bull-case support
    - Review launch model, trial readouts, and regulatory interactions
  - - International monetization
    - Conversion of Taiwan and other non-U.S. traction into revenue
    - Global expansion is cited as a use of proceeds and a justification for premium
    - Request country-by-country rollout plan and distributor economics
  - - Exit path and timing
    - Whether ownership prefers a later strategic sale, private hold, or eventual IPO
    - Return underwriting depends on path and hold duration
    - Discuss exit framework directly with management and lead investors
  notes: These asks are the minimum package required before upgrading from Track / Research More to a positive recommendation.
