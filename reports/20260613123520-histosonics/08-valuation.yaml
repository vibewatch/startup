- id: TV002
  title: Thesis / Anti-Thesis Table
  columns:
  - Argument
  - Support level
  - Anti-thesis
  - What would change the view
  rows:
  - - A cleared, first-of-kind liver platform with published outcomes deserves a premium to concept-stage medtech
    - High
    - Clinical evidence is promising but still early and not yet matched by disclosed commercial economics
    - Disclose revenue, utilization, and margin by installed system
  - - The August 2025 control transaction plus October 2025 follow-on is stronger validation than a rumor or soft mark
    - High
    - The rumored strategic-sale range was only modestly above the closed price, implying limited immediate upside
    - Show new financing or secondary prints materially above $2.25B with stronger disclosure
  - - Reimbursement momentum and 45.4M-member policy expansion support broader adoption
    - Medium
    - Coverage breadth does not equal paid-procedure volume or repeat utilization
    - Publish payer-mix and paid-case trends by quarter
  - - Multi-indication optionality in kidney, pancreas, and prostate supports platform upside
    - Medium
    - Optionality remains mostly pre-commercial outside liver and could be slower than investors expect
    - Secure kidney authorization and disclose early economic contribution
  - - Public focused-ultrasound comps are far smaller, which leaves room for a category leader to outperform
    - Low
    - The public comp gap is so large that current scale alone does not justify the mark
    - Provide evidence that HistoSonics can scale materially faster than Profound, EDAP, and adjacent ablation peers
  notes: The anti-thesis focuses on valuation sensitivity, not just company-quality criticism.
