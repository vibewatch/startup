  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Post-acquisition capitalization table, liquidation preferences, anti-dilution terms, and investor control rights.
    whyItMatters: A fair headline valuation can still produce unattractive common-equity returns if the structure is senior-heavy.
    diligencePath: Request financing documents, board approvals, and a current capitalization schedule from management.
    relatedQuestionRefs:
    - QV028
  - type: private-evidence-only
    severity: material
    topic: commercial-economics
    missingEvidence: Audited revenue, gross margin, installed-base utilization, backlog conversion, and service economics.
    whyItMatters: Without commercial unit economics, public comp comparisons remain mostly narrative and can overstate valuation support.
    diligencePath: Review management accounts, cohort-level system productivity, and external audit materials.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: payer-realization
    missingEvidence: Actual paid-procedure volume and collections after CMS, CPT, and Elevance milestones.
    whyItMatters: Coverage breadth does not necessarily translate into reimbursed utilization or repeat procedure demand.
    diligencePath: Request claims data, collections trends, and payer-mix reporting by quarter.
    relatedQuestionRefs:
    - QV012
    - QV029
  - type: private-evidence-only
    severity: material
    topic: new-indication-economics
    missingEvidence: Launch assumptions, pricing, and contribution margins for kidney and other future indications.
    whyItMatters: Most of the valuation premium versus public comps depends on platform expansion rather than liver alone.
    diligencePath: Obtain indication-level launch plans, pricing assumptions, and market-access models.
    relatedQuestionRefs:
    - QV010
    - QV022
    - QV023
  - type: private-evidence-only
    severity: minor
    topic: exit-preferences
    missingEvidence: Ownership-level exit timing preferences and thresholds for a strategic sale versus IPO.
    whyItMatters: Return timing and path matter for underwriting IRR even if the enterprise-value mark is supportable.
    diligencePath: Discuss exit framework directly with management and lead investors.
    relatedQuestionRefs:
    - QV025
