- id: financing-adoption-context
  title: Financing, Regulatory, and Adoption Context
  body: 'The valuation debate is stronger than a pure concept-stage discussion because HistoSonics already has a cleared product, published clinical evidence, payer traction, and a visible provider footprint. Edison received FDA De Novo authorization in October 2023 for non-thermal mechanical destruction of liver tumors and the FDA publicly highlighted the system as a first-of-kind authorization. By late 2025 the company was describing Edison as the first and only histotripsy platform cleared for clinical use globally. Public company and independent coverage also converged on more than 2,000 patients treated at more than 50 U.S. centers with another 50 planned installations, while the June 2026 provider directory shows a much broader cross-border network of centers than a single-facility novelty device would have. The clinical base is not trivial either: the HOPE4LIVER pivotal trial reported 95% technical success with 7% major complications, and the one-year update reported favorable safety
    with local-control results comparable to established locoregional therapies. Reimbursement and market access are improving through the $17,500 CMS outpatient payment, CPT coding, and the October 2025 Elevance policy covering 45.4 million members. Those facts explain why investors could justify a unicorn-plus mark despite incomplete financial disclosure.'
