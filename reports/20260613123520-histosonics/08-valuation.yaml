- id: exit-readiness-diligence
  title: Exit Signals, Thesis-Break Triggers, and Final Diligence Asks
  body: 'The sale and IPO discussion is important because it sharpens what the $2.25 billion mark means. Independent reporting said HistoSonics explored both a strategic sale and a public listing, with rumored interest from Medtronic, GE HealthCare, and Johnson & Johnson at a valuation above $2.5 billion, but no deal was guaranteed and volatile public markets were cited as a reason to favor a private outcome. The closed price therefore looks less like a distressed compromise and more like a pragmatic private-market clearing level, yet it also does not show evidence of a dramatically higher strategic ceiling. For investors, the next diligence questions are therefore structural and economic rather than scientific alone: what share classes and liquidation preferences were created in the majority recap and October follow-on, what revenue and gross-margin profile exists per installed system, and how much of early coverage translates into paid procedure volume? Thesis-break triggers are also concrete:
    if liver adoption stalls, reimbursement broadening plateaus, or kidney progress lags, the platform premium should contract quickly. Until those gaps close, the right stance is to monitor rather than chase.'
