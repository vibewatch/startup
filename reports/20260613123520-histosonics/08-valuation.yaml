- id: scenario-framing
  title: Bull, Base, and Bear Scenario Framing
  body: 'The most defensible way to frame valuation is scenario-based rather than multiple-based. In the base case, HistoSonics continues to scale liver installations, payer coverage expands beyond early wins, and kidney becomes the first meaningful second indication without yet proving a full platform story. That supports a valuation range around $2.0 billion to $3.0 billion and puts the August 2025 clearing mark near the middle of a reasonable base-case band. In the bull case, reimbursement broadens, Taiwan and other international markets add real revenue, and kidney plus at least one additional indication move from promise to monetizable adoption, supporting a range around $3.5 billion to $5.0 billion. In the bear case, adoption growth slows, economic disclosure disappoints, or new-indication timelines slip, pulling value back toward $0.8 billion to $1.4 billion and exposing the downside of paying a platform premium too early. The asymmetry is meaningful: upside exists, but it is milestone
    dependent and not obviously cheap relative to the current public comp backdrop.'
