- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role in therapy
  - Key dependency
  - Primary risk
  rows:
  - - Focused-ultrasound source
    - Generates pulsed sound energy at the treatment focus
    - Reliable acoustic output and targeting calibration
    - Acoustic mis-targeting would create non-target tissue risk
  - - Bubble-cloud cavitation zone
    - Creates the mechanical tissue-destruction effect
    - Consistent bubble formation in the intended tissue
    - Too little cavitation reduces efficacy; too much raises off-target risk
  - - Integrated ultrasound imaging
    - Plans the approach and monitors treatment in real time
    - Clear visualization of tumor and surrounding structures
    - Image interpretation has a documented learning curve
  - - Robotic / mobile positioning assembly
    - Places therapeutic energy accurately over the patient abdomen
    - Stable positioning and workflow integration with imaging
    - Calibration and maintenance needs are not publicly quantified
  - - Anesthesia and motion management
    - Reduces patient movement during targeting and treatment
    - Hospital anesthesia coverage and procedural workflow
    - Operational complexity limits office-based deployment
  - - Training and labeling wrapper
    - Defines who can use the system and under what controls
    - HistoSonics-led training plus physician judgment
    - Scaling depends on training throughput and field support
  - - Site activation and service network
    - Installs, supports, and expands the provider base
    - Field teams, capital budgets, and procedure champions
    - Installed-base uptime, replacement cycles, and service economics are not public
  notes: Architecture is synthesized from science, labeling, and provider deployment sources rather than copied from an engineering schematic.
