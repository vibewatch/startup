- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Edison role
  - Evidence-backed benefit
  - Current limitation
  rows:
  - - Select an appropriate case
    - Tumor board reviews resectability, adjacent structures, and patient fitness
    - Acts as a liver-tumor option for unresectable, complex, palliative, or bridge cases
    - Adds a non-invasive option to the locoregional toolkit
    - Selection rules are center-specific and not yet standardized publicly
  - - Prepare patient and room
    - Hospital team coordinates imaging, anesthesia, and positioning
    - Requires a procedure-room workflow with motion control and trained staff
    - Supports outpatient or short-stay treatment at several sites
    - Public materials do not disclose average setup time or room-turn metrics
  - - Target lesion with imaging
    - Physician uses ultrasound imaging to define target and path
    - Real-time visualization supports targeting and monitoring during therapy
    - Continuous monitoring is a core differentiation claim
    - Exact planning software and image-registration detail are not public
  - - Ablate tissue mechanically
    - Focused ultrasound pulses are delivered to the target
    - Bubble-cloud cavitation mechanically liquefies tissue without heat
    - Avoids thermal injury and can matter near vessels or bile ducts
    - Public materials do not quantify every lesion type or size limit
  - - Recover and reassess
    - Patient is observed, discharged, and later imaged for follow-up
    - Early MRI / imaging assessment is part of the evidence base
    - Hospital press releases repeatedly frame the procedure as minimally invasive or outpatient
    - Long-term follow-up pathways differ by center and are not standardized publicly
  - - Treat today's commercial use case
    - Primary or metastatic liver tumor care pathway
    - Currently the only clearly commercialized indication
    - FDA clearance and payer coding already support liver programs
    - Kidney and other organs still depend on future label expansion
  - - Extend to next indications
    - Kidney, pancreas, and prostate / BPH are evaluated separately
    - Same platform is positioned for additional solid-organ uses
    - Platform optionality is visible before full commercialization
    - Public evidence for pancreas and BPH remains materially thinner than for liver
  notes: Workflow is reconstructed from company, FDA, and hospital sources and should be read as a validated operating sequence rather than as a full SOP.
