  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pancreas-pipeline
    missingEvidence: A direct 2026 protocol, trial registry, or company technical release describing pancreatic histotripsy enrollment, endpoints, and current status.
    whyItMatters: Pancreatic optionality is part of the platform narrative but cannot yet be underwritten as a near-term commercial indication from the visible record.
    diligencePath: Request the active pancreatic study protocol, registry identifier, or current investigator brochure and compare it with liver and kidney evidence maturity.
    relatedQuestionRefs:
    - QE015
  - type: missing-source
    severity: material
    topic: bph-pipeline
    missingEvidence: A current 2026 primary source for BPH or prostate histotripsy trial design, enrollment status, and near-term endpoints.
    whyItMatters: Historical BPH signals and inventor ambition show real interest, but they do not establish product timing or regulatory probability.
    diligencePath: Request the active BPH / prostate trial protocol, enrollment update, and any current regulatory correspondence or feasibility readout.
    relatedQuestionRefs:
    - QE016
  - type: private-evidence-only
    severity: material
    topic: manufacturing-opacity
    missingEvidence: Supplier map, contract-manufacturing arrangements, transducer life, failure modes, and service economics for the installed base.
    whyItMatters: These data are required to judge whether the moat is manufacturing/service execution or primarily early clinical lead and regulatory timing.
    diligencePath: Obtain quality-system documents, supplier concentration, field-failure logs, and replacement-cycle statistics under NDA.
    relatedQuestionRefs:
    - QE020
  - type: private-evidence-only
    severity: material
    topic: reliability-gap
    missingEvidence: Installed-base uptime, mean time to repair, training throughput, and case-throughput benchmarks across new sites.
    whyItMatters: Commercial scale depends on how quickly sites become productive and how reliably the capital base stays clinically available.
    diligencePath: Request site-activation dashboards, service KPIs, training completions, and first-90-day utilization data for recent launches.
    relatedQuestionRefs:
    - QE021
