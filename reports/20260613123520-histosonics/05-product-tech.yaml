chapter:
  number: 5
  title: Product & Technology
summary: HistoSonics' Edison system is an image-guided histotripsy platform that uses focused ultrasound to create a real-time monitored bubble cloud for non-thermal mechanical ablation of liver tumors, with FDA De Novo clearance, growing provider rollout, and peer-reviewed liver data from THERESA and HOPE4LIVER. Its strongest differentiation is vessel-sparing, non-invasive ablation with a training- and hospital-based operating model; its key diligence questions are manufacturing/supplier opacity, uptime and throughput transparency, and how quickly kidney and other pipeline indications can move beyond research-stage signals.
sections:
- id: product-definition-and-current-workflow
  title: Product definition and current workflow in customer terms
  body: 'The Edison system is sold into hospital and cancer-center workflows as a non-invasive liver-tumor ablation platform rather than as a general ultrasound capital good. Public product pages, FDA materials, and provider announcements all describe the same practical sequence: a multidisciplinary team selects an appropriate liver-tumor case, the patient is positioned and anesthetized, physicians use ultrasound imaging to target the lesion, the system generates a histotripsy bubble cloud to mechanically liquefy tissue, and the patient typically completes treatment on an outpatient or short-stay basis. This makes Edison a procedural service-line product that depends on radiology, oncology, surgery, anesthesia, and imaging coordination inside the hospital. The current commercial indication remains liver tumors, including unresectable tumors, so the product should be underwritten today as a liver-program platform with adjacent pipeline options rather than as a broad multi-organ oncology franchise
    already in market.'
