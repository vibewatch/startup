- id: deployment-training-and-scaling-dependencies
  title: Deployment, training, and scaling dependencies
  body: 'Edison''s operating model looks more like the rollout of a complex image-guided therapy program than the sale of a consumable-driven device. The provider locator and multiple hospital announcements show a growing base of academic and regional hospital adopters across the United States, plus early international sites in the UK, Hong Kong, and Taiwan. Public labeling is explicit that only people trained by HistoSonics should use the system, guided by the clinical judgment of an appropriately trained physician. That has two underwriting implications. First, scale depends on training throughput, site activation, and field support capacity, not just on how many systems can be shipped. Second, public materials do not expose the usual device-operations details a buyer would want for underwriting a manufacturing moat: no disclosed contract-manufacturing partners, installed-base uptime, transducer replacement cycles, or unit-economics data. Careers and financing signals support the view
    that HistoSonics is building a field-oriented expansion model, but they do not by themselves prove durable manufacturing leverage.'
