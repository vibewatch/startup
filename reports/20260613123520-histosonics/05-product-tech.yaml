- id: mechanism-imaging-and-system-architecture
  title: Mechanism, imaging guidance, and system architecture
  body: 'HistoSonics'' core architectural claim is not software-first automation; it is a tightly coupled therapeutic-ultrasound, imaging, and control loop. The company''s science pages say histotripsy uses pulsed sound waves to induce bubble clouds from gases naturally present in targeted tissue. Those bubbles form and collapse in microseconds, generating mechanical forces that destroy tissue at cellular and sub-cellular scales without relying on heat. Company materials and provider deployment announcements consistently emphasize continuous visualization and physician monitoring of the bubble cloud and treatment effect in real time. External provider sources add a practical systems view: the Edison installation includes an ultrasound machine and mobile robotic arm or positioning assembly above the abdomen, advanced imaging for targeting, and workflow constraints such as motion control and general anesthesia. In other words, the system architecture is best understood as planning plus imaging,
    robotic/focused-ultrasound delivery, bubble-cloud feedback, and post-treatment assessment, all wrapped by labeling and training requirements.'
