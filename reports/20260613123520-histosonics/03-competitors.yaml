- id: durability-and-underwriting-questions
  title: Durability depends on economics, channel ownership, and comparative evidence still not public
  body: The public evidence is strong enough to say HistoSonics has real commercial momentum, meaningful differentiation,
    and a better reimbursement story than many early device launches. It is not strong enough to say the company
    has already solved the hardest competitive questions. Public sources remain far richer on indication, workflow,
    and clinical positioning than on capital price, disposables, procedure contribution margin, repeat-center utilization,
    or win-loss rates against surgery, microwave ablation, or prostate-focused HIFU programs. That opacity matters
    because hospitals do not choose between histotripsy and HIFU in the abstract; they choose between budgeted service
    lines with entrenched owners. HistoSonics therefore looks strongest where it can widen the liver-use case and
    keep lowering adoption friction through payer coverage and provider training, while its weakest moat is the
    lack of public operating data showing that hospitals are switching durable volume away from existing IR, radiation,
    or surgical pathways. The chapter should preserve that uncertainty rather than smoothing it into a broad technology-win
    narrative.
