- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Platform
  - Public price disclosure
  - Packaging / commercial signal
  - Coverage or financing signal
  - What is still unknown
  - Implication
  rows:
  - - HistoSonics Edison
    - No public list price found in reviewed sources
    - System sale plus training and provider rollout implied; procedure reimbursement now clearer than capital cost
    - CMS payment increase and private-payer coverage expansion
    - System ASP, disposables, service attach, center payback
    - Commercial friction is falling, but capital-budget transparency remains low
  - - TULSA-PRO
    - No public list price found in reviewed sources
    - Procedure-centric prostate offering with outpatient positioning
    - Humana coverage and installed-base growth disclosed by company
    - MRI-suite economics, disposable burden, realized utilization per system
    - Coverage helps, but MRI dependence may constrain adoption economics
  - - Focal One
    - No public list price found in reviewed sources
    - Robotic HIFU platform integrated into urology programs
    - Strong revenue and placement growth disclosed by investor news page; EIB facility reported by FUS Foundation
    - Realized selling price, procedure revenue split, margin profile
    - Commercial momentum is visible even without list-price transparency
  - - Sonablate
    - No public list price found in reviewed sources
    - Customizable focal-therapy device narrative
    - No reviewed public financing or installed-base disclosure retained here
    - Utilization, pricing, and scale
    - Harder to benchmark as a scaled commercial threat than TULSA or Focal One
  - - Medtronic Emprint
    - No public list price found in reviewed sources
    - Generator plus antennas and clinical-summary ecosystem
    - Backed by large incumbent medtech distribution, though not quantified in retained source
    - Procedure contribution margin and exact hospital capital configuration
    - Distribution depth may matter more than transparent product pricing
  - - AngioDynamics Solero
    - No public list price found in reviewed sources
    - Generator plus single-applicator speed message
    - Competes inside existing ablation purchasing channels, though detailed economics not public here
    - Consumables, capital budget, and comparative margin
    - Throughput messaging can pressure hospitals that already own ablation lines
  notes: Public evidence supports a packaging and reimbursement lens far better than an apples-to-apples capital-price
