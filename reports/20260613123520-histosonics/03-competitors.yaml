- id: TP004
  title: Substitute modality comparison
  columns:
  - Modality
  - Typical owner
  - Strength
  - Key limitation highlighted in reviewed evidence
  - Why a buyer may still choose it
  - Implication for HistoSonics
  rows:
  - - Histotripsy
    - Surgery / IR / oncology liver programs
    - Incisionless, non-thermal, non-ionizing mechanical ablation with vessel-sparing rationale
    - Current marketed clearance is liver-first and long-term comparative economics are still sparse
    - Needle-free outpatient option for selected unresectable or difficult lesions
    - Differentiated but still early relative to incumbent treatment menus
  - - Microwave ablation
    - Interventional radiology
    - Established percutaneous workflow with predictable margin tools and speed claims
    - Thermal collateral injury and heat-sink limitations around vessels
    - Hospitals already own IR workflow and ablation experience
    - Most immediate substitute inside liver tumor programs
  - - Radiofrequency ablation
    - Interventional radiology
    - Longstanding local-control tool in tumor boards
    - Heat-sink and incomplete perivascular ablation limitations in comparative review
    - Familiarity and existing referral patterns
    - Incumbent default keeps share-switching burden high for HistoSonics
  - - SBRT / SABR
    - Radiation oncology
    - Non-surgical option embedded in radiation pathways
    - Radiation exposure and separate departmental ownership
    - Fits patients or centers already routed through radiation oncology
    - Competes for non-surgical cases without requiring new device capital
  - - Surgery / resection
    - Surgical oncology
    - Accepted often-curative route in selected kidney and liver candidates
    - Invasive and may require recovery time or interruption of systemic treatment
    - Clear standard-of-care status and deep clinician comfort
    - Status-quo option remains powerful whenever resection is feasible
  - - Embolization
    - Interventional oncology
    - Established locoregional option in treatment menus
    - Invasive catheter-based workflow and not equivalent to non-invasive ablation
    - Already budgeted and familiar
    - Adds another incumbent pathway HistoSonics must displace or complement
  notes: This extra table exists because the competitive question is modality substitution inside hospitals as much
    as product rivalry among focused-ultrasound vendors.
