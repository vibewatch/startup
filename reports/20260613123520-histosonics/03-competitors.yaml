  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capital-pricing
    missingEvidence: Current capital price, financing terms, and service-contract structure for HistoSonics and
      the main peer systems.
    whyItMatters: Hospitals buy capital equipment through budget committees, so price opacity blocks a clean substitution
      model.
    diligencePath: Request current quotes, financing options, and capital-committee materials from HistoSonics,
      Profound, EDAP, and selected IR ablation vendors.
    relatedQuestionRefs:
    - QP022
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: procedure-economics
    missingEvidence: Realized disposable burden, staffing mix, room time, and contribution margin by modality and
      center type.
    whyItMatters: Workflow fit alone does not show whether histotripsy creates a better economic profile than microwave
      ablation, SBRT, or surgery.
    diligencePath: Collect de-identified center P&Ls and compare procedure economics across live histotripsy, microwave,
      and surgical programs.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: win-loss
    missingEvidence: Current win-loss data versus surgery, microwave ablation, SBRT, and prostate-HIFU alternatives
      by referral pathway.
    whyItMatters: Without live conversion data, competitive durability remains a thesis rather than evidence-backed
      market share shift.
    diligencePath: Ask for center-level referral data, decline reasons, and competitive displacements from commercial
      leadership and key launch sites.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP005
  - type: conflicting-data
    severity: minor
    topic: long-term-comparative-outcomes
    missingEvidence: Longer-horizon comparative outcomes versus incumbent modalities in matched clinical populations.
    whyItMatters: Current literature is promising but still early, which can overstate durability if long-term local-control
      or recurrence profiles diverge.
    diligencePath: Track peer-reviewed comparative studies, registries, and post-market follow-up as they mature.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP004
