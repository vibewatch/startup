  rows:
  - - HistoSonics Edison
    - Direct liver histotripsy platform
    - FDA De Novo clearance, provider directory, reimbursement wins, >2,000 treated patients at >50 U.S. centers
      reported by late 2025
    - Surgical oncology, interventional oncology, liver tumor programs
    - Non-thermal mechanical focused ultrasound with no incisions, radiation, or heat
    - Public evidence on system price, disposables, and repeat-center economics is thin
  - - Profound TULSA-PRO
    - Focused-ultrasound adjacent peer
    - 80-system installed base at Q1 2026; 104% revenue growth; Humana coverage
    - Urology and MRI-based prostate programs
    - MRI-guided, robotically driven, transurethral prostate ablation with quality-of-life narrative
    - Organ focus is prostate rather than liver and workflow depends on MRI/urology ownership
  - - EDAP / Focal One
    - Focused-ultrasound adjacent peer
    - 78% Q1 2026 HIFU revenue growth; 39% full-year 2025 HIFU growth; 69% system placement growth
    - Urology prostate-cancer management programs
    - Robotic HIFU with fusion software and standard OR-bed integration
    - Thermal prostate HIFU is not a direct liver ablation workflow
  - - Sonablate
    - Focused-ultrasound adjacent peer
    - Regulatory-cleared prostate HIFU positioning on official site
    - Urology focal-therapy programs
    - Real-time tissue-change monitoring, power adjustment, repeatability, MRI/ultrasound fusion
    - No reviewed evidence of liver-tumor positioning or broad commercial scale
  - - Insightec Exablate Neuro
    - Adjacent focused-ultrasound incumbent
    - Global focused-ultrasound brand with current fetched neuro focus
    - MRI-guided neurosurgery programs
    - Incision-free MRI-guided focused ultrasound with same-day discharge narrative
    - Fetched source was neuro-focused, not liver or prostate oncology specific
  - - Medtronic Emprint
    - Thermal ablation substitute
    - Established liver-oriented microwave product line on official surface
    - Interventional radiology and hepatobiliary oncology
    - Percutaneous microwave ablation with predictable margins and combination-use positioning
    - Still thermal and invasive/percutaneous rather than incisionless
  - - AngioDynamics Solero
    - Thermal ablation substitute
    - Commercial soft-tissue ablation product with speed-focused messaging
    - Interventional radiology soft-tissue ablation
    - Single-applicator microwave ablation up to 5 cm in 6 minutes
    - Marketing evidence is product-centric and not a full clinical-outcomes comparison
  - - Surgery / SBRT / embolization
    - Status-quo substitute set
    - Embedded in guideline-like treatment menus and tumor-board workflows
    - Surgery, radiation oncology, interventional oncology
    - Already budgeted, understood, and credentialed pathways
    - More invasive or thermally or radiatively limited than histotripsy in selected use cases
  notes: Rows emphasize who already owns the referral path and procedure workflow rather than forcing a false one-for-one
    product comparison across liver, prostate, and neuro platforms.
