artifact: competitors
slug: histosonics
runDate: '2026-06-13'
company:
  name: HistoSonics
chapter:
  number: 3
  title: Competitors
  summary: HistoSonics is differentiated today less by being the only non-invasive energy company and more by being
    the only reviewed platform already cleared for liver histotripsy, while most focused-ultrasound peers remain
    concentrated in prostate or neuro workflows. The harder competitive pressure still comes from entrenched interventional-oncology
    substitutes such as microwave ablation, radiofrequency ablation, SBRT, and surgery, which already sit inside
    tumor-board pathways and have clearer workflow ownership than public HistoSonics pricing or utilization data.
sections:
- id: decision-set-and-current-position
  title: The real decision set is broader than focused-ultrasound branding
  body: 'The competitive frame should start with the job the hospital is buying, not the novelty of histotripsy
    itself. HistoSonics sells a liver-tumor workflow that it describes as non-invasive, non-thermal, ultrasound-guided,
    and deployable without special infrastructure, and hospital launch stories show that the platform is now being
    slotted into surgical oncology and interventional-oncology service lines rather than into a standalone new department.
    That matters because the buyer can solve the same clinical problem through several very different routes: incumbent
    percutaneous ablation, surgery, radiation, embolization, or non-invasive focused-ultrasound platforms aimed
    at other organs. Public evidence also shows that HistoSonics has moved beyond pilot-stage novelty: the company
    cites a multi-site FDA basis, a growing provider directory, reimbursement wins, and broader payer coverage,
    while independent coverage reported more than 2,000 treated patients across more than 50 U.S. centers by late
    2025. Those traction signals strengthen the case that HistoSonics is now a live commercial platform, but they
    do not eliminate substitute pressure from workflows that were already embedded before histotripsy arrived.'
