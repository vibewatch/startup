- id: TP005
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Evidence-backed rationale
  - Mitigation / diligence ask
  rows:
  - - Only cleared liver histotripsy platform in this pack
    - Peer organ expansion from prostate or broader focused-ultrasound vendors
    - Medium
    - HistoSonics is differentiated today, but peer balance sheets and adjacent platforms suggest expansion risk
      is real
    - Ask for timeline realism on kidney, pancreas, and prostate versus competitor indication roadmaps
  - - Lower-friction hospital adoption
    - Entrenched IR and surgical workflows still own liver volume
    - High
    - Substitute modalities already sit in tumor boards, capital budgets, and referral patterns
    - Request center-level conversion data from thermal ablation or surgery to histotripsy
  - - Reimbursement progress
    - Opaque capital and disposable economics
    - High
    - Coverage wins are public, but public ASP and contribution-margin evidence is not
    - Request ROI model, disposable mix, and payback by center archetype
  - - Novel non-thermal mechanism
    - Clinical evidence still reads as promising but early
    - Medium
    - Skeptical review and comparative papers frame histotripsy against incumbent standards rather than as settled
      displacement
    - Request longer-term comparative outcome datasets and case-selection guardrails
  - - Commercial momentum
    - Competitors remain financed enough to keep investing
    - Medium
    - Profound, EDAP or Focal One, and HistoSonics all disclosed strong capital or growth signals
    - Track capital raises, system placements, and indication-expansion milestones quarterly
  - - Cross-specialty workflow ownership
    - Diffuse ownership can slow adoption despite broader opportunity
    - Medium
    - HistoSonics spans surgery, IR, and oncology instead of a single department owner
    - Ask who owns budget, credentialing, and scheduling at each live center
  notes: Severity reflects underwriting risk to durable share gain, not a statement about clinical value to individual
    patients.
