- id: substitute-modalities-and-incumbent-workflows
  title: Thermal ablation, SBRT, and surgery remain the heavier practical competition
  body: 'The substitute side looks more dangerous than a simple logo list of focused-ultrasound companies. Histotripsy
    literature repeatedly defines itself against incumbent locoregional treatments rather than against prostate
    HIFU vendors. The 2025 comparison review explicitly says radiofrequency ablation, microwave ablation, and stereotactic
    body radiotherapy all pursue local control but suffer from heat-sink effects, incomplete treatment near vessels,
    or collateral injury, while histotripsy''s mechanical cavitation may preserve ducts and vessels and better fit
    lesions near critical structures. At the same time, those same sources remind investors why the incumbents endure:
    these modalities already have device platforms, workflow owners, and tumor-board familiarity. Medtronic and
    AngioDynamics both market established microwave systems into soft-tissue or liver ablation, while the NCI kidney
    PDQ still lists surgery, thermal ablation, SBRT, embolization, and related options as the accepted menu for
    many patients. Hospital articles also frame histotripsy as outpatient and combinable with other therapies, which
    helps HistoSonics fit existing oncology pathways, but it does not change the fact that incumbent modalities
    still define the default budget and referral path.'
