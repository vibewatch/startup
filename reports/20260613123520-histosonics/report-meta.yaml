companyProfile:
  summary: >-
    HistoSonics is a private unicorn-stage medtech company commercializing histotripsy,
    a non-invasive focused-ultrasound approach that mechanically destroys targeted tissue
    rather than burning it. The company traces its scientific roots to University of
    Michigan research, with the strongest public commercialization date anchored to 2009,
    and it now operates around the Edison platform for liver tumors while pushing kidney
    and other solid-tumor expansion. Public evidence supports real commercial traction,
    including a growing installed base, rising patient count, payer progress, a 2025
    majority acquisition at approximately $2.25B, and a subsequent $250M financing, but
    public-company-style economic disclosure remains thin.
  foundedDate: '2009-01-01'
  founders:
    - name: Zhen Xu
      role: Co-founder
      background: University of Michigan histotripsy co-inventor publicly identified as a co-founder of HistoSonics.
      claimRefs: [CO013]
    - name: Charles Cain
      role: Co-founder
      background: Public sources credit Cain with inventing histotripsy, coining the term, and co-founding HistoSonics.
      claimRefs: [CO014]
  foundingLocation: Ann Arbor, Michigan, USA
  headquarters: Ann Arbor, Michigan, USA (with Minneapolis operational presence)
  productSummary: >-
    HistoSonics sells the Edison histotripsy platform, a non-invasive, real-time-image-guided
    focused-ultrasound system for mechanical tissue destruction. The currently cleared
    commercial use is liver tumors, while kidney and additional organ programs remain part
    of the platform-expansion roadmap.
  customerFocus: >-
    Academic medical centers, leading hospital systems, liver-tumor treatment programs,
    and future kidney or broader solid-tumor centers seeking non-invasive ablation
    alternatives.
  businessModel: >-
    Capital-equipment-plus-procedure adoption model built around Edison system placements,
    site training and workflow implementation, and procedure growth supported by coding,
    CMS payment, and commercial payer coverage. Public evidence suggests current revenue is
    concentrated in U.S. liver workflows.
  stage: Private unicorn
  fundingStatus: >-
    Publicly disclosed capital markers include a $102M Series D in August 2024, an
    approximately $2.25B majority acquisition in August 2025, and an oversubscribed $250M
    growth financing in October 2025. Independent coverage indicates total capital raised
    is above $500M, but the current cap table, ownership percentages, and post-transaction
    preference terms are not publicly disclosed.
  disclosureProfile: private-undisclosed
  claimRefs: [CO002, CO005, CO006, CO007, CO008, CO013, CO014, CO017, CO024, CO025, CO027, CO028, CO032, CO035, CO038, CO040, CI047]
summary:
  headline: >-
    HistoSonics has rare private-medtech proof for a first-of-kind non-invasive tumor
    platform, but missing commercial economics and a full 2025 valuation anchor leave it
    in research-more territory rather than justify fresh capital at current terms.
