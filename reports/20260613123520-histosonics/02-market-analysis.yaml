callouts:
  - calloutType: insight
    title: The cleanest public TAM lens is constrained and procedural, not generic ultrasound
    body: >-
      The retained evidence never gets to a reliable Edison revenue TAM because pricing, installed
      utilization, and liver revenue are undisclosed. Public underwriting is therefore strongest
      when it starts from liver case pools, stage filters, provider-site counts, and reimbursement
      gates rather than from a broad focused-ultrasound market headline.
    claimRefs:
      - CM027
      - CM034
      - CM040
      - CM041

  - calloutType: recommendation
    title: Kidney is the most credible next expansion market
    body: >-
      Among named adjacencies, kidney has the best combination of explicit company disclosure, a
      public De Novo submission, 67 enrolled HOPE4KIDNEY patients, a sizable incident pool, and a
      standard of care still dominated by invasive or thermal options. Pancreas and prostate matter
      strategically, but kidney is the cleanest near-term commercial bridge beyond liver.
    claimRefs:
      - CM008
      - CM011
      - CM030
      - CM031
      - CM032
      - CM033

  - calloutType: risk
    title: Early rollout and missing economics still block precise SOM math
    body: >-
      Public evidence shows growing adoption, but many centers still market histotripsy as a
      first-in-state or first-in-region offering, and no retained source discloses system price,
      payback, current utilization, or liver revenue. That combination means market enthusiasm can
      outrun what outside investors can currently model with confidence.
    claimRefs:
      - CM029
      - CM039
      - CM040

