schemaVersion: "report-v2"
artifact: market-analysis
slug: histosonics
runDate: '2026-06-13'
company:
  name: HistoSonics
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    HistoSonics' current commercial market is not a broad focused-ultrasound TAM but a constrained
    liver-tumor ablation market defined by FDA labeling, trained-site deployment, reimbursement
    gates, and patient-selection filters. Public evidence supports a growing but still scarce
    installed base, improving procedure-level and payer-policy reimbursement, and a materially
    larger adjacent opportunity in kidney, pancreas, and prostate indications; however, public
    sources still do not disclose system pricing, liver revenue, or a clean dollar-denominated
    SAM/SOM, so the most defensible sizing lens is patient-pool and provider-capacity based rather
    than headline-market based.

sections:
  - id: market-boundary
    title: Market boundary and status-quo substitutes
    body: >-
      HistoSonics' present market boundary is narrower than a generic focused-ultrasound or
      oncology-robotics category. FDA and company labeling restrict Edison today to the non-invasive
      destruction of liver tumors, including unresectable liver tumors, using a non-thermal
      mechanical focused-ultrasound process; the same labeling also says the device is
      prescription-only, requires sufficient functional liver reserve, and has not been evaluated
      for disease-specific cancer outcomes. That means the included spend today is liver-tumor
      procedural revenue, hospital acquisition and deployment of the Edison system, physician
      training, imaging-guided procedure workflow, and payer reimbursement tied to CPT 0686T or
      inpatient DRGs. Excluded from the current cleared market are kidney, pancreas, prostate,
      thyroid, and other organ applications until separate authorization; general radiation-oncology
      spend; and consumer wellness ultrasound categories. The practical status-quo substitutes are
      surgery, thermal ablation, SBRT, transarterial liver-directed therapies, and watchful waiting
      or systemic therapy when local treatment is not appropriate. Histotripsy therefore sits in a
      highly specific liver-intervention wedge today, with future value tied to indication expansion
      rather than to immediate participation in all solid-tumor treatment spend.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM032
      - CM048
    tableRefs:
      - TM001

  - id: constrained-sizing
    title: "Constrained sizing: patient pools, stage filters, and site capacity"
    body: >-
      Public evidence does not support a clean, investment-grade dollar TAM/SAM/SOM for
      HistoSonics because no retained source discloses Edison ASP, capital cost, disposables
      economics, current liver revenue, or installed utilization rates. The most defensible sizing
      approach is therefore constrained rather than generic. On the demand side, SEER estimates
      42,340 new liver and intrahepatic bile duct cases in the U.S. in 2026, with 45% diagnosed
      localized and 23% regional, implying a stage-filtered annual pool of roughly 19,053 localized
      cases or 28,791 local-plus-regional cases before any additional filters for ultrasound
      visibility, lesion count, or liver reserve. Expansion indications are materially larger in raw
      incidence: kidney and renal pelvis cancer at 80,450 new cases, pancreatic cancer at 67,530,
      and prostate cancer at 333,830. On the supply side, HistoSonics' provider directory updated
      on the run date lists about 87 location lines and roughly 80-plus provider sites, which is
      large enough to show commercialization but still small relative to national hospital counts.
      The resulting picture is a capacity- and eligibility-constrained market, not a fully
      penetrated national device market.
    claimRefs:
      - CM006
      - CM007
      - CM008
      - CM009
      - CM010
      - CM027
      - CM033
      - CM034
      - CM040
      - CM041
    tableRefs:
      - TM002
    figureRefs:
      - FM001
      - FM002

  - id: buyer-user-payer-segmentation
    title: Buyer, user, payer, and capital-equipment workflow
    body: >-
      The buyer is institutional, not consumer. Public launch pages and the provider directory show
      Edison being adopted inside interventional-radiology, surgical-oncology, hepatobiliary,
      transplant, and cancer-center service lines. In practice, the economic buyer is likely a
      hospital capital committee or service-line sponsor that can justify equipment acquisition; the
      clinical users are trained physicians operating inside radiology or oncology workflows; and
      the payer stack begins with procedure coding/payment and then broadens to payer-policy
      coverage. Procedure reimbursement has improved with CPT 0686T and the CMS outpatient payment
      increase to $17,500, while admitted cases can still rely on DRG logic. Commercial coverage
      remains less mature but no longer hypothetical, as Elevance issued a positive 14-state medical
      policy in 2025. Adoption workflow also appears multidisciplinary: hospitals describe tumor-
      board review, department housing decisions, physician training, launch publicity, and then
      gradual expansion to same-day or short-stay treatment pathways. That combination makes
      HistoSonics more analogous to a capital medical-device sale into complex provider systems than
      to a simple per-procedure consumables business.
    claimRefs:
      - CM018
      - CM019
      - CM022
      - CM023
      - CM024
      - CM025
      - CM026
      - CM036
      - CM037
      - CM038
      - CM042
    tableRefs:
      - TM003
    figureRefs:
      - FM003
      - FM004

  - id: growth-drivers-and-indication-expansion
    title: Growth drivers and expansion indications
    body: >-
      The strongest growth drivers are workflow and indication expansion rather than explosive
      growth in liver incidence itself. Reviews and hospital case studies repeatedly position
      histotripsy as non-invasive, non-thermal, vessel-sparing, and compatible with other
      treatments, with same-day or short-stay recovery pathways that can broaden physician interest
      relative to surgery or heat-based ablation. Clinical proof has also moved beyond feasibility:
      THERESA established first-in-human technical success, HOPE4LIVER met co-primary safety and
      efficacy goals, and the one-year update reported 90% local control by post hoc assessment. Yet
      the bigger valuation lever is organ expansion. HistoSonics has publicly advanced kidney
      through a 2026 De Novo submission backed by 67 HOPE4KIDNEY patients, while company materials
      continue to name pancreas and prostate as future organs. Those adjacencies matter because the
      raw U.S. incident pools are larger than liver, especially kidney and prostate, and because
      kidney standard of care still centers on surgery or thermal approaches that histotripsy could
      challenge if authorization broadens. The market can therefore expand without pretending that
      current liver-only clearance already captures those future pools.
    claimRefs:
      - CM012
      - CM013
      - CM014
      - CM015
      - CM016
      - CM030
      - CM031
      - CM032
      - CM033
      - CM043
      - CM044
      - CM045
    tableRefs:
      - TM004

  - id: adoption-constraints-and-diligence-gaps
    title: Adoption constraints, competitive realities, and diligence gaps
    body: >-
      The main adoption constraints are not lack of clinical curiosity but filters that shrink
      practical demand. Current use still depends on trained physicians, tumor-board selection,
      functional liver reserve, ultrasound-visible lesions, and small-number or small-size candidate
      profiles at many centers. Public evidence also shows commercialization remains geographically
      sparse: multiple health systems promoted histotripsy as the first in a state or region during
      2024-2026, which implies that hospital deployment is still in the early rollout phase. Company
      messaging that the platform needs no special infrastructure is directionally helpful, but
      public site evidence still shows adoption overwhelmingly inside hospitals rather than ASCs or
      office-based settings. Competitive risk also rises in expansion indications: prostate
      ultrasound ablation already has marketed incumbents such as TULSA and Focal One, so
      HistoSonics would be entering adjacent categories that are promising but not empty. Most
      importantly, public evidence still cannot isolate Edison system pricing, capital budget
      payback, utilization per site, or a true current SOM. Those missing pieces do not negate the
      market; they simply mean investors should underwrite HistoSonics on constrained patient and
      provider adoption logic, not on a broad headline ultrasound TAM.
    claimRefs:
      - CM017
      - CM018
      - CM027
      - CM028
      - CM029
      - CM035
      - CM039
      - CM040
      - CM046

tables:
  - id: TM001
    title: Market definition table
    columns:
      - Segment / category
      - Included spend
      - Excluded spend
      - Buyer / payer
      - Why it matters
    rows:
      - - Current cleared liver-tumor histotripsy
        - Edison system capital deployment, physician training, ultrasound-guided procedure workflow,
          CPT 0686T outpatient claims, inpatient DRG-covered cases
        - Kidney, pancreas, prostate procedures, radiation oncology spend, unrelated ultrasound
          categories
        - Hospital cancer/radiology/hepatobiliary service lines; CMS and commercial payers
        - This is the only currently cleared commercial wedge in the U.S.
      - - Thermal and surgical liver-tumor alternatives
        - Microwave ablation, radiofrequency ablation, surgery, SBRT, transarterial therapies used
          in liver-directed care pathways
        - Non-oncology abdominal surgery and non-liver oncology
        - Existing liver-tumor treating specialists and hospital procedure programs
        - These are the incumbent substitutes Edison must displace or complement
      - - Kidney expansion indication
        - Future renal tumor procedures, nephron-sparing workflow, new payer policies if authorized
        - Current liver-only reimbursement until FDA expansion occurs
        - Urology, interventional oncology, hospital capital committees, Medicare/commercial payers
        - Kidney is the most concrete next organ because a De Novo submission is already public
      - - Pancreas and prostate expansion indications
        - Potential future histotripsy procedures if organ-specific authorization is achieved
        - Current commercial liver revenue and all non-authorized organ use today
        - Future oncology/urology service lines and payers
        - These adjacencies enlarge the long-term market but remain pre-authorization
      - - Bridge-to-transplant and multimodal liver workflow
        - Tumor-board selection, transplant oncology, combination use with systemic therapy, repeat
          procedures in selected patients
        - Standalone transplant surgery economics and non-candidate patients
        - Multidisciplinary tumor boards, transplant programs, payers that cover the underlying
          liver intervention
        - This adjacency strengthens fit inside advanced liver programs rather than broad screening
          markets
    notes: >-
      Boundary is defined by current FDA labeling first, then by real-world liver-program workflow
      and payer coverage. Future organs are tracked as adjacencies, not current revenue.
    enumerationScope:
      coverage: partial
      basis: >-
        Rows enumerate the commercially relevant current wedge and the closest source-backed
        adjacencies rather than every solid-tumor intervention category.
