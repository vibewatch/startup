  - id: TM004
    title: Growth drivers and constraints table
    columns:
      - Driver / constraint
      - Direction
      - Timing
      - Implication
      - Diligence ask
    rows:
      - - Liver clinical proof from THERESA and HOPE4LIVER
        - Positive
        - Now
        - Supports hospital adoption and payer discussions with more than feasibility-only evidence
        - Request full real-world post-launch utilization and outcomes by site
      - - Non-invasive, non-thermal workflow advantages
        - Positive
        - Now
        - Can attract patients and physicians seeking outpatient or lower-recovery options versus
          heat-based ablation or surgery
        - Verify which advantages persist in larger real-world lesions and repeat use
      - - CMS procedure payment pathway (0686T / APC 1576)
        - Positive
        - Now
        - Improves reimbursement mechanics for hospital outpatient liver cases
        - Pull actual claims mix and denial data by payer and site
      - - Commercial policy expansion such as Elevance
        - Positive
        - Near term
        - Suggests payer-policy adoption is moving beyond pure Medicare coding
        - Map every covered commercial plan and utilization-management requirement
      - - Kidney De Novo submission
        - Positive
        - Near term
        - Creates the clearest next-organ expansion path and materially larger incident pool than
          liver
        - Track FDA timing, labeling scope, and coding strategy for kidney
      - - Patient-selection filters (liver reserve, lesion size/number, ultrasound visibility)
        - Negative
        - Now
        - Shrink the practical treatable pool versus headline cancer incidence
        - Quantify actual eligible fraction from post-market case logs
      - - Geographic scarcity of installed systems
        - Negative
        - Now
        - Early rollout still limits throughput and awareness despite growing provider directory
        - Obtain installed-base count, active-site count, and per-site procedure cadence
      - - Missing pricing, ASP, and revenue disclosure
        - Negative
        - Now
        - Blocks clean dollar TAM, SAM, SOM, and capital payback modeling
        - Request system price, disposables economics, service contract, and current liver revenue
          contribution
      - - Competitive incumbents in future prostate ultrasound ablation
        - Negative
        - Future
        - Shows expansion adjacencies are promising but not empty
        - Compare Edison development path against TULSA and Focal One positioning
    notes: >-
      Constraints are included alongside drivers because HistoSonics is still in early
      commercialization and future-organ expansion remains the main upside variable.
