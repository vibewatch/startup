  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer / budget owner
      - Primary user
      - Payer
      - Workflow
      - Adoption trigger
    rows:
      - - Academic liver-tumor center
        - Cancer institute / radiology or surgery capital sponsor
        - Interventional radiology, surgical oncology, hepatobiliary teams
        - CMS plus commercial payers
        - Tumor board -> capital approval -> training -> launch -> procedure claims
        - Need for differentiated local therapy in complex liver cases
      - - Transplant / advanced organ therapy program
        - Hospital transplant or advanced-organ leadership
        - Transplant surgeons, IR, hepatology teams
        - CMS and commercial plans
        - Selection for bridge-to-transplant or multimodal care
        - Ability to keep more patients inside transplant-oncology pathways
      - - Community regional hospital
        - Hospital executive and oncology service line
        - IR or oncology champions with referral networks
        - Regional payer mix and Medicare
        - Acquire system -> market regional first-in-state offering -> treat selected cases
        - Competitive differentiation and keeping patients local
      - - Kidney expansion (future)
        - Urology / oncology service-line capital sponsor
        - Urologic oncology plus IR
        - Would require new payer coverage after authorization
        - Regulatory authorization -> training -> coding/payment -> policy coverage
        - Organ-preserving alternative to surgery or thermal ablation
      - - Pancreas expansion (future)
        - Complex GI / hepatopancreatobiliary oncology programs
        - Surgical oncology, GI oncology, IR
        - Future payer coverage only after authorization
        - Preclinical/clinical development -> authorization -> center rollout
        - High unmet need in difficult-to-treat tumors near critical structures
      - - Prostate expansion (future)
        - Urology capital or therapy committee
        - Urologists
        - Commercial and Medicare urology coverage pathways
        - Would enter an already competitive prostate-ablation workflow
        - Need to show differentiated outcomes versus existing ultrasound ablation systems
    notes: >-
      Current buyer evidence comes from provider-directory specialties and hospital launch
      announcements. Future-organ rows are source-backed directional maps, not current commercial
      channels.
