  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: site-of-service
      missingEvidence: A disclosed breakdown of active hospital versus ASC or office deployments and any out-of-hospital use cases.
      whyItMatters: This would determine whether the company's site-of-service-independent claim is commercially realized or still aspirational.
      diligencePath: Request installed-base segmentation and active-use data by site type from management or channel partners.
      relatedQuestionRefs:
        - QM020
    - type: private-evidence-only
      severity: blocking
      topic: sizing-gap
      missingEvidence: System ASP, capital budget, disposable cost, service contract terms, and payback assumptions for Edison.
      whyItMatters: Without pricing and economics, a true dollar TAM, SAM, SOM, and capital-efficiency model cannot be built from public evidence.
      diligencePath: Obtain customer quotes, management pricing decks, and hospital purchasing case studies under NDA.
      relatedQuestionRefs:
        - QM021
        - QM026
    - type: missing-source
      severity: material
      topic: payer-coverage
      missingEvidence: A complete payer-policy map beyond CMS coding and the disclosed Elevance decision, including utilization-management rules and denials.
      whyItMatters: Coverage breadth and friction directly affect procedure-volume ramp and hospital willingness to buy additional systems.
      diligencePath: Collect payer policy documents, provider billing data, and reimbursement support materials from HistoSonics and early sites.
      relatedQuestionRefs:
        - QM022
    - type: missing-source
      severity: material
      topic: installed-base
      missingEvidence: Installed-system count, active-site count, and per-site procedure throughput across the visible provider network.
      whyItMatters: Directory listings show commercialization breadth but do not reveal utilization density or whether the market is supply-constrained or demand-constrained.
      diligencePath: Request management KPI disclosure or run channel checks with early adopter hospitals.
      relatedQuestionRefs:
        - QM008
        - QM026
      relatedTableRefs:
        - TM002
