evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-board-rights
    missingEvidence: >-
      Current ownership percentages, liquidation preferences, board composition, and investor-rights documents after the
      2025 majority acquisition.
    whyItMatters: >-
      Control rights and economics determine who actually governs the company and how the $2.25B transaction changed
      incentives.
    diligencePath: >-
      Request the current cap table, voting agreements, board observer list, and post-close governance package directly
      from management.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue-and-utilization
    missingEvidence: Current revenue, per-system utilization, procedure volume by site, and customer concentration data.
    whyItMatters: >-
      Provider footprint and payer coverage only matter economically if systems are being used often enough to drive
      attractive unit economics.
    diligencePath: >-
      Ask for a cohort of installed systems with procedure volumes, consumables or service revenue, and
      trailing-twelve-month revenue by customer.
    relatedQuestionRefs:
      - QO015
      - QO016
      - QO017
      - QO025
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: minor
    topic: headcount
    missingEvidence: A canonical run-date employee count and a breakdown by commercial, clinical, manufacturing, and R&D roles.
    whyItMatters: >-
      The scale and cost structure implied by multi-site hiring and rapid installation growth cannot be assessed
      precisely without headcount visibility.
    diligencePath: >-
      Request a current org chart and headcount bridge from the 2024 Series D through the 2025 acquisition and 2026 run
      date.
    relatedQuestionRefs:
      - QO003
      - QO025
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: long-term-real-world-outcomes
    missingEvidence: >-
      Multi-year recurrence, retreatment, and survival data across a broad real-world liver cohort and new organ
      systems.
    whyItMatters: >-
      Early studies are promising, but long-term durability is essential if histotripsy is to justify platform-scale
      adoption and valuation.
    diligencePath: Track registry data, later HOPE4LIVER follow-up, and post-clearance site-level outcomes from high-volume centers.
    relatedQuestionRefs:
      - QO010
      - QO022
      - QO025
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: site-of-service
    missingEvidence: A disclosed breakdown of active hospital versus ASC or office deployments and any out-of-hospital use cases.
    whyItMatters: >-
      This would determine whether the company's site-of-service-independent claim is commercially realized or still
      aspirational.
    diligencePath: Request installed-base segmentation and active-use data by site type from management or channel partners.
    relatedQuestionRefs:
      - QM020
  - type: private-evidence-only
    severity: blocking
    topic: sizing-gap
    missingEvidence: System ASP, capital budget, disposable cost, service contract terms, and payback assumptions for Edison.
    whyItMatters: >-
      Without pricing and economics, a true dollar TAM, SAM, SOM, and capital-efficiency model cannot be built from
      public evidence.
    diligencePath: Obtain customer quotes, management pricing decks, and hospital purchasing case studies under NDA.
    relatedQuestionRefs:
      - QM021
      - QM026
  - type: missing-source
    severity: material
    topic: payer-coverage
    missingEvidence: >-
      A complete payer-policy map beyond CMS coding and the disclosed Elevance decision, including
      utilization-management rules and denials.
    whyItMatters: >-
      Coverage breadth and friction directly affect procedure-volume ramp and hospital willingness to buy additional
      systems.
    diligencePath: >-
      Collect payer policy documents, provider billing data, and reimbursement support materials from HistoSonics and
      early sites.
    relatedQuestionRefs:
      - QM022
  - type: missing-source
    severity: material
    topic: installed-base
    missingEvidence: Installed-system count, active-site count, and per-site procedure throughput across the visible provider network.
    whyItMatters: >-
      Directory listings show commercialization breadth but do not reveal utilization density or whether the market is
      supply-constrained or demand-constrained.
    diligencePath: Request management KPI disclosure or run channel checks with early adopter hospitals.
    relatedQuestionRefs:
      - QM008
      - QM026
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: capital-pricing
    missingEvidence: Current capital price, financing terms, and service-contract structure for HistoSonics and the main peer systems.
    whyItMatters: Hospitals buy capital equipment through budget committees, so price opacity blocks a clean substitution model.
    diligencePath: >-
      Request current quotes, financing options, and capital-committee materials from HistoSonics, Profound, EDAP, and
      selected IR ablation vendors.
    relatedQuestionRefs:
      - QP022
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: procedure-economics
    missingEvidence: Realized disposable burden, staffing mix, room time, and contribution margin by modality and center type.
    whyItMatters: >-
      Workflow fit alone does not show whether histotripsy creates a better economic profile than microwave ablation,
      SBRT, or surgery.
    diligencePath: >-
      Collect de-identified center P&Ls and compare procedure economics across live histotripsy, microwave, and surgical
      programs.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: win-loss
    missingEvidence: >-
      Current win-loss data versus surgery, microwave ablation, SBRT, and prostate-HIFU alternatives by referral
      pathway.
    whyItMatters: >-
      Without live conversion data, competitive durability remains a thesis rather than evidence-backed market share
      shift.
    diligencePath: >-
      Ask for center-level referral data, decline reasons, and competitive displacements from commercial leadership and
      key launch sites.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP005
  - type: conflicting-data
    severity: minor
    topic: long-term-comparative-outcomes
    missingEvidence: Longer-horizon comparative outcomes versus incumbent modalities in matched clinical populations.
    whyItMatters: >-
      Current literature is promising but still early, which can overstate durability if long-term local-control or
      recurrence profiles diverge.
    diligencePath: Track peer-reviewed comparative studies, registries, and post-market follow-up as they mature.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Cash on hand, monthly burn, and management runway after the 2025 growth financing.
    whyItMatters: Without cash and burn, the company’s capital adequacy and next-round timing cannot be underwritten.
    diligencePath: Request monthly cash balances, gross and net burn, covenant headroom, and board runway scenarios under NDA.
    relatedQuestionRefs:
      - QI014
      - QI015
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: blocking
    topic: revenue-disclosure
    missingEvidence: Revenue by stream, recurring revenue share, deferred revenue, and revenue-recognition policy.
    whyItMatters: The chapter cannot test revenue quality or growth efficiency without a real top-line bridge.
    diligencePath: Request quarterly financial statements with stream-level revenue split and supporting accounting policy notes.
    relatedQuestionRefs:
      - QI005
      - QI023
    relatedTableRefs:
      - TI005
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Edison system ASP, discounting, service-contract pricing, and any per-procedure monetization share.
    whyItMatters: >-
      Coverage wins can still produce weak economics if the company discounts heavily to win placements or bears large
      support costs.
    diligencePath: >-
      Request price realization by site cohort, warranty/support obligations, and any recurring revenue attachment by
      customer.
    relatedQuestionRefs:
      - QI003
      - QI004
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: site-utilization
    missingEvidence: Quarterly procedures per site, mature-site cohorts, and contribution margin by live center.
    whyItMatters: Install-base breadth alone does not show whether the platform is becoming a durable recurring-profit network.
    diligencePath: Request cohort utilization curves, quarterly procedures by site vintage, and revenue/margin by mature center.
    relatedQuestionRefs:
      - QI009
      - QI010
      - QI021
