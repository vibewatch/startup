      - number: '7.4'
        title: 运营扩张与竞争压力
        blocks:
          - type: paragraph
            body: >-
              公司在打开新监管前线的同时，运营模式还必须同步扩张制造、现场服务、培训和渠道管理。公开可见的领导层显示，公司在报销、监管事务、运营和临床职能上有关键执行者，但还没有给出投资人在承销激进铺开
              前想看的更深制造和服务指标。国际上，Taiwan 令人鼓舞，因为批准经过详细审查并配有既定早期使用中心；但同一公告也说清楚，扩张取决于当地医生培训和进一步适应证建设。联邦铺开 又增加了一层依赖，因为 VA
              合同在该渠道使用独家经销商。与此同时，竞争者没有停下。TULSA 和 HIFU 厂商已经在营销更长期或工作流导向证据、支付方胜利、装机基数增长和明确培训生态。这并不推翻 histotripsy 的临床前景，但说明
              HistoSonics 追赶的是其他非侵入性叙事，而不是一个静止赛道。
