      - number: '6.5'
        title: 集中度风险、地域扩展与承销含义
        blocks:
          - type: paragraph
            body: >-
              医疗服务提供方足迹的地域覆盖已足以证明全国性兴趣。截至运行日的目录覆盖至少 29 个美国州，也列出英国、香港和阿联酋的中心。ECU Health、Good Shepherd、Allina、UVA、UofL 和
              Vanderbilt 的区域公告显示，需求并未局限在少数沿海旗舰医院；东 North Carolina、Oregon、Minnesota、Virginia、Kentucky 和 Tennessee
              的医院都把产品用于让肝肿瘤患者更接近本地治疗，或扩展区域癌症项目。这支持一个判断：只要覆盖、培训和临床倡导者 对齐，HistoSonics 可以卖出精英大学医院之外。

              但公开证据面仍然集中。一个旗舰参考账户 U-M Health 明确披露机构和研究人员在 HistoSonics
              中有财务利益，削弱了它作为外部证据点的独立性。更广泛地说，最深的公开证据仍来自有限的首发账户和医院新闻室，而不是披露的经常性使用量
              数据或一份多元化、可背书且经济成熟的客户名单。覆盖在扩大，但仍被肝脏适应证和筛选标准紧紧框住；进入服务提供方目录
              本身也不能证明每个中心都有持久收入。对投资人而言，这意味着客户需求真实、地域扩展在改善、销售动能看起来可信，但集中度和留存仍是开放尽调项。
