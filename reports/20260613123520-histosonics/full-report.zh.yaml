  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 买方画像与客户分层
        blocks:
          - type: paragraph
            body: >-
              HistoSonics 公开可见的客户面非常明确：核心是医疗服务提供方。截至运行日的服务提供方目录
              几乎全由医院、医疗系统、癌症中心、移植项目和学术医学中心组成，而不是独立诊所。因此，买方通常是医院服务线或资本委员会，不是单个医生诊所。已点名的发布中，真正上手的团队多是介入放射、肿瘤外科、肝胆外科、移植肿瘤以及多学科肝病团队。支付方这一层更复杂，也在医疗服务提供方
              之外：医院客户必须先跑通门诊报销、支付方政策和患者筛选规则，临床流程才会转化为可重复的手术量。

              公开足迹也不是单一学术中心首发的故事。目录里有 Johns Hopkins、Columbia、UCSF、UChicago、University of Michigan 等顶级大学和四级转诊中心，也列出
              Allina、Hoag、Providence、Orlando Health、Sarasota Memorial 等社区和区域系统。这个组合重要，因为它说明 HistoSonics
              同时卖进了声望型标杆账户和务实的区域交付网络，后者希望让肝肿瘤患者留在本地治疗。即便如此，客户群看起来仍是医院渠道市场，不是广泛的门诊或诊所市场；预算、服务线背书和单台手术经济性，可能都是每笔销售的核心。
