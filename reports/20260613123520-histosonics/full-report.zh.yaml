      - number: '4.4'
        title: 债务、信贷与同行资本强度启示
        blocks:
          - type: paragraph
            body: >-
              已检索资料集中没有 HistoSonics 的公开债务或信贷披露，但同行披露有助于框定成熟非侵入式治疗平台需要什么。 Profound Medical 2026
              年一季度公告显示，一个相对较小的公开聚焦超声同行季度收入为 $5.3 million、 毛利率 72%、现金约 $50.3 million、长期债务约 $4.5 million；其安装基数为 80
              套系统，同店年化手术量达到 每活跃站点 45.2 例。Focused Ultrasound Foundation 另提到 EDAP 的 €36 million EIB 信贷额度，用于支持 Focal One
              增长。这些同行显示，一旦平台上市并扩张，即使尚未取得主导市场份额，债务和现金披露也会成为正常承销工具箱的一部分。


              HistoSonics 据报道私募估值为 $2.25 billion，远高于此处引用的 AngioDynamics、Profound 和 EDAP 公开市值。
              这份溢价可能反映品类领导力、先发监管状态，以及投资者对更大多器官机会的信念。但它也提高了举证负担。在这个估值下， 投资者需要看到安装基数增长、报销胜利和临床扩展会转化为可持续毛利润，而不是反复融资。在缺少
              HistoSonics 特定现金、 债务、收入或利润率披露的情况下，同行集合只能作为警示：商业化阶段设备平台仍取决于吞吐量、毛利率和资产负债表纪律。
