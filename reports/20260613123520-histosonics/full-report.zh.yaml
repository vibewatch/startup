        title: 商业化推进、报销与医疗机构覆盖
        blocks:
          - type: paragraph
            body: >-
              商业证据显示 HistoSonics 已不只是纯 R&D 故事，但最强牵引力仍集中在肝脏治疗和参考中心采用。 2025 年收购新闻稿称，超过 50 家领先美国医学中心已治疗逾 2,000 名患者，年底前还计划安装
              50 套系统。Michigan Engineering 随后把运营图景推进到全球 100 套已安装系统和近 3,000 名
              已治疗患者；运行日的医疗机构目录则列出大量美国站点，以及英国、香港和阿联酋。Michigan Medicine、 Allina 和 Johns Hopkins
              的医院公告显示，真实机构正在把平台接入临床工作流，而不只是参与试验。 报销动能也已改善：CMS 支付、CPT 编码、Blue Cross 决策，以及 Elevance 对 45.4 million
              会员的覆盖，都降低了一个主要采用障碍。剩余商业化警示在于，收入、客户集中度和单站点利用率仍未公开披露。
