      - number: '5.2'
        title: 机制、影像引导与系统架构
        blocks:
          - type: paragraph
            body: >-
              HistoSonics 的核心架构主张不是软件优先自动化，而是紧密耦合的治疗超声、影像和控制回路。公司的科学页面称， histotripsy
              使用脉冲声波，从目标组织中天然存在的气体诱发气泡云。这些气泡在微秒内形成并坍塌，产生机械力， 在细胞和亚细胞尺度摧毁组织，而不依赖热。公司材料和医疗机构部署公告持续强调，医生实时持续可视化并监测气泡云和治疗效果。
              外部医疗机构来源补充了实际系统视角：Edison 安装包括超声机、腹部上方的移动机械臂或定位组件、用于定位的高级影像， 以及运动控制和全麻等工作流约束。换句话说，系统架构最好被理解为规划加影像、机器人 /
              聚焦超声递送、气泡云反馈和治疗后评估， 外层再由标签和培训要求包住。
