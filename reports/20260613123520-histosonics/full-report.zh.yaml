      - number: '5.4'
        title: 部署、培训与规模化依赖
        blocks:
          - type: paragraph
            body: >-
              Edison 的运营模式更像复杂影像引导治疗项目的铺开，而不是耗材驱动设备销售。医疗机构定位器和多家医院公告显示， 美国各地学术和区域医院采用者基础在增长，英国、香港和 Taiwan
              也出现早期国际站点。公开标签明确指出，只有接受过 HistoSonics 培训的人才能使用该系统，并且要由受过适当培训的医生依据临床判断引导。这带来两个承销含义。第一，
              规模化取决于培训吞吐、站点激活和现场支持能力，而不只是能出货多少系统。第二，公开资料没有暴露买方在承销制造护城河时
              想看的常规设备运营细节：没有披露合同制造伙伴、安装基数正常运行时间、换能器更换周期或单位经济性数据。招聘和融资信号 支持 HistoSonics 正在搭建面向现场的扩张模式，但它们本身不能证明可持续制造杠杆。
