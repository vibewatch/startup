      - number: '5.3'
        title: 临床证据，以及非热差异化为何重要
        blocks:
          - type: paragraph
            body: >-
              最强公开证据基础仍集中在肝脏。THERESA 在一个小型多中心 I 期队列中建立了首次人体可行性和 MRI 确认的急性技术成功。 HOPE4LIVER 随后用 44 名参与者和 49
              个已治疗肿瘤扩展证据基础，达到技术成功和低重大并发症率的共同主要性能目标。 一年更新补充了有用的耐久性背景，包括报告的局部控制和生存结局；但它也公开指出，这种新模式存在影像解读学习曲线。 这个细节重要，因为
              Edison 的商业论证明确建立在非热差异化上：综述文献将 histotripsy 与射频消融、微波消融和
              立体定向体部放疗对比，指出热沉效应和附带损伤问题会让靠近血管的病灶难以用热方法处理。因此，histotripsy 的机械空化和
              缺少热损伤不只是营销形容词；它们是中心为何在选定肝脏病例中采用该平台的核心临床理由。公司和基金会后续发布还为学术论文 补充了市场采用背景：到 2026 年，HistoSonics 和 Focused
              Ultrasound Foundation 已公开描述 12 个月 HOPE4LIVER 结果，包括 90% 局部肿瘤控制，并报告批准后已有逾 1,000 名肝脏肿瘤患者接受治疗。这不能替代同行评议证据，
              但确实显示平台正在越过纯实验性安装基数阶段。
