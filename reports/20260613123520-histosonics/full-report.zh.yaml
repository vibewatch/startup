            body: >-
              竞争框架应从医院购买的任务开始，而不是 histotripsy 本身的新颖性。HistoSonics 销售的是一套肝脏肿瘤工作流：
              公司称其非侵入式、非热、超声引导，且无需特殊基础设施即可部署；医院发布故事显示，该平台现在被放入外科肿瘤和
              介入肿瘤服务线，而不是独立新科室。这一点重要，因为买方可以用几条非常不同的路径解决同一个临床问题：既有经皮消融、 手术、放疗、栓塞，或面向其他器官的非侵入式聚焦超声平台。公开证据也显示，HistoSonics
              已越过试点阶段新奇感： 公司引用多站点 FDA 依据、不断扩大的医疗机构目录、报销胜利和更广支付方覆盖；独立报道则称截至 2025 年底， 50 多家美国中心已治疗逾 2,000 名患者。这些牵引力信号强化了
