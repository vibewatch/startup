companyProfile:
  summary: >-
    HistoSonics 是一家处于独角兽阶段的私营医疗科技公司，正在商业化 histotripsy。这是一种非侵入式 聚焦超声方法，靠机械方式摧毁目标组织，而不是烧灼组织。公司的科学根基可追溯到 University of
    Michigan 研究；公开商业化时间最强锚点是 2009 年。公司目前围绕 Edison 平台治疗肝脏肿瘤，同时推进 肾脏和其他实体瘤扩展。公开证据支持其已有真实商业牵引力，包括安装基数扩大、患者数上升、支付方进展、 2025
    年约 $2.25B 的多数股权收购，以及随后 $250M 融资；但类似上市公司的经济披露仍然稀薄。
