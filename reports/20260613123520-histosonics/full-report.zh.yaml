      - number: '8.2'
        title: 融资、监管与采用背景
        blocks:
          - type: paragraph
            body: >-
              估值讨论并不是纯概念阶段，因为 HistoSonics 已有获批产品、已发表临床证据、支付方进展和可见医疗服务提供方 足迹。Edison 于 2023 年 10 月获得 FDA De Novo
              授权，用于肝肿瘤的非热机械破坏；FDA 公开强调该系统是同类首个授权。到 2025 年末，公司把 Edison 描述为全球首个且唯一获批用于临床的 histotripsy
              平台。公司公开材料与独立报道也共同指向：超过 2,000 名患者在 50 多个美国中心接受治疗，另有 50 个计划安装；而 2026 年 6
              月服务提供方目录显示的跨境中心网络，远宽于单设施新奇设备。临床基础也不轻：HOPE4LIVER 关键试验报告 95% 技术成功率和 7%
              重大并发症，一年期更新报告安全性良好，局部控制结果可与既有局部区域疗法相比。报销和市场准入正在通过 $17,500 CMS 门诊支付、CPT 编码，以及 2025 年 10 月覆盖 45.4 million
              名成员的 Elevance 政策改善。这些事实解释了为什么即便财务披露不完整，投资人仍可能为独角兽以上 估值找到理由。
