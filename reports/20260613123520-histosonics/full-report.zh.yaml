        - 单根施用器微波消融，6 分钟可达 5 cm
        - 营销证据以产品为中心，不是完整的临床结局对比
      - - 手术 / SBRT / 栓塞
        - 现状替代方案组
        - 嵌入指南式治疗菜单和肿瘤委员会工作流
        - 外科、放射肿瘤、介入肿瘤
        - 路径已纳入预算、被理解并完成资质认证
