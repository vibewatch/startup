        - 买方：癌症中心或服务线资本委员会；用户：介入放射、肿瘤外科、移植团队；支付方：医院加支付方授权
        - 引入非侵入式肝肿瘤消融，并把复杂患者桥接到更广的肿瘤护理路径
        - 包括 Johns Hopkins、U-M、UofL、ECU 和 JSUMC 在内的公开背书较强
        - 参考价值高，且很可能是最强的早期培训站点
        - 公开来源很少按站点披露手术量或合同经济性
      - - 社区 / 区域非营利医疗系统
        - 买方：医院管理层和肿瘤科领导；用户：IR 和肿瘤外科；支付方：医院门诊报销
        - 用当日肝肿瘤治疗把患者留在本地
        - 目录中可见 Allina、Hoag、Good Shepherd 及区域系统
        - 重要证据：采用可以越过大学旗舰医院
