        - 暂停承销，直到根因和纠正措施得到验证。
      - - 报销转化
        - 付费理赔落地
        - 如果尽管已有代码和已发布支付费率，站点层面报销仍不一致
        - 下调收入爬坡，重新评估医院 ROI 假设。
      - - 资本开支和培训摩擦
        - 安装到首例的滞后
