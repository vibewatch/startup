      - number: '2.4'
        title: 增长驱动因素与扩展适应证
        blocks:
          - type: paragraph
            body: >-
              最强增长驱动因素是工作流和适应证扩展，而不是肝脏发病率本身爆发式增长。综述和医院案例反复把 histotripsy 定位为非侵入式、非热、保血管，并可与其他治疗兼容；当日或短住恢复路径也能相较手术或热消融
              扩大医生兴趣。临床证明也已越过可行性阶段：THERESA 建立了首次人体技术成功，HOPE4LIVER 达到共同主要安全 和有效性目标，一年更新按事后评估报告了 90%
              局部控制。不过更大的估值杠杆是器官扩展。HistoSonics 已公开 将肾脏推进到 2026 年 De Novo 申报，并由 67 名 HOPE4KIDNEY 患者支撑；公司材料仍继续点名胰腺和前列腺
              作为未来器官。这些相邻市场重要，因为美国原始发病例池大于肝脏，尤其是肾脏和前列腺；也因为肾脏标准治疗 仍以手术或热方法为中心，一旦授权扩大，histotripsy 可能挑战它们。因此，市场可以扩张，而不必假装当前
              仅限肝脏的批准已经覆盖这些未来患者池。
