      - CV037
      - CV038
      - CV039
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: HistoSonics 在临床验证和增长动能上得分较高，但商业经济性仍不透明，估值支撑只能排在中游。
    data:
      items:
        - label: 临床验证
          value: 8/10
          note: FDA 批准产品，加上已发表的 HOPE4LIVER 数据
        - label: 采用牵引力
          value: 7/10
          note: 2,000+ 名患者、50+ 家中心，以及覆盖广的服务方目录
        - label: 报销动能
          value: 7/10
          note: CMS、CPT 和 Elevance 均改善了可及性
        - label: 新适应症期权价值
          value: 7/10
          note: 肾脏、胰腺和前列腺拓宽了叙事
        - label: 上市可比公司支撑
          value: 4/10
          note: 相对 Profound、EDAP 和 Angio 的表观溢价非常大
        - label: 经济性透明度
          value: 3/10
          note: 收入、利润率和利用率均未公开披露
        - label: 结构清晰度
          value: 3/10
          note: 资本重组和后续融资后的优先股堆叠未披露
        - label: 整体估值支撑
          value: 5/10
          note: 对内部人可支撑，对新钱已打满
