      - number: '4.2'
        title: 报销、安装基数牵引力和单位经济性代理指标
        blocks:
          - type: paragraph
            body: >-
              HistoSonics 周围最强的财务证据点不是披露的利润表，而是报销和采用代理指标。CMS 将 CPT 0686T 的门诊支付率从 $12,500 提高到 $17,500；HistoSonics 后来宣布
              Elevance 政策覆盖 14 个州的 45.4 million 会员。 这两点重要，因为它们降低了医院资本设备商业化中最大的摩擦之一：医生和机构能否拿到支付的不确定性。它们不能证明 HistoSonics
              自身实际收入，但让客户站点的手术吞吐更容易获得财务支持，也应提升中心承诺安装 Edison 和接受培训的意愿。


              采用证据同样广，但仍停留在代理指标层面。公司的医疗机构目录在运行日更新，显示其覆盖美国主要中心以及部分国际地点。 客户公告提供了本地证明：Twin Cities、Kentucky 和 eastern North
              Carolina 的首批手术；Oregon 首次安装； New Jersey 仅第三个站点。临床工作流描述也暗示成本结构。Hopkins 描述全麻和数小时门诊病例；Hoag 强调当日出院； Sutter
