      - number: '7.3'
        title: 报销、采用与医院瓶颈
        blocks:
          - type: paragraph
            body: >-
              报销进展真实存在，但抓取证据不支持把它视为已解决。HistoSonics 已有肝脏支付路径和编码基础设施，CMS 也为研究性使用 创建了肾脏 IDE 代码；但 CMS
              明确称，支付代码本身不保证覆盖。这个区分很重要，因为医院仍需要 MAC 层面或支付方 层面的医学必要性支持，商业覆盖也仍是选择性而非全面覆盖。公司自己的覆盖人群
              公告只点名一个大型商业里程碑，不是一张成熟的全国报销网络。医院采用记录也显示类似摩擦。Michigan Medicine
              采购需要拼合机构预算和慈善资金；同一来源还提到全身麻醉，以及部分更大或转移病例仍需要化疗或免疫治疗。HistoSonics
              自己的培训材料描述了一条很长的实施序列，不止单个操作者，还包括患者筛选、手术模拟、员工培训、初始病例支持和优化。这些都可管理，但不是即插即用。
