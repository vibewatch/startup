  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 以客户语言定义产品与当前工作流
        blocks:
          - type: paragraph
            body: >-
              Edison 系统作为非侵入式肝脏肿瘤消融平台，被销售进医院和癌症中心工作流，而不是作为一般超声资本设备销售。 公开产品页、FDA
              材料和医疗机构公告都描述同一套实际顺序：多学科团队选择合适的肝脏肿瘤病例，患者摆位并接受麻醉， 医生用超声影像定位病灶，系统生成 histotripsy
              气泡云以机械方式液化组织，患者通常以门诊或短住方式完成治疗。 这让 Edison 成为一个依赖医院内部放射、肿瘤、外科、麻醉和影像协调的手术服务线产品。当前商业适应证仍是肝脏肿瘤，
              包括不可切除肿瘤，因此今天应把产品承销为带有相邻管线选项的肝脏项目平台，而不是已经上市的宽泛多器官肿瘤专营权。
