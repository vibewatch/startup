        title: 采用约束、竞争现实与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              主要采用约束不是缺少临床好奇心，而是会压缩实际需求的筛选条件。当前使用仍依赖受训医生、肿瘤委员会选择、 功能性肝脏储备、超声可见病灶，以及很多中心偏好的少量或小尺寸候选人画像。公开证据还显示商业化在地理上
              仍然稀疏：2024-2026 年，多家医疗系统把 histotripsy 宣传为某州或某地区首例，这意味着医院部署仍处在
              早期铺开阶段。公司称平台不需要特殊基础设施，这在方向上有帮助；但公开站点证据仍显示采用压倒性集中在医院， 而非 ASC 或办公室场景。扩展适应证中的竞争风险也会上升：前列腺超声消融已有 TULSA 和 Focal
              One 等 上市在位者，因此 HistoSonics 将进入有前景但并非空白的相邻类别。最重要的是，公开证据仍无法拆出 Edison 系统定价、资本预算回本、单站点利用率或真实当前
              SOM。这些缺失项不否定市场，只说明投资者应按受约束的患者和 医疗机构采用逻辑承销 HistoSonics，而不是按宽泛的超声 TAM 标题承销。
