  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流
      - Edison 角色
      - 有证据支撑的收益
      - 当前限制
    rows:
      - - 选择合适病例
        - 肿瘤委员会评估可切除性、邻近结构和患者身体条件
        - 不可切除、复杂、姑息或桥接病例，可把它作为肝肿瘤治疗选项
        - 为局部区域治疗工具箱加入非侵入式选项
        - 筛选规则因中心而异，公开层面尚未标准化
      - - 准备患者和治疗室
        - 医院团队协调影像、麻醉和体位摆放
        - 需要带运动控制和受训人员的手术室工作流
        - 多个站点支持门诊或短住院治疗
        - 公开材料未披露平均准备时间或房间周转指标
      - - 借助影像定位病灶
        - 医生用超声影像界定靶点和路径
        - 实时可视化支持治疗中的定位和监测
        - 连续监测是核心差异化主张
        - 具体规划软件和图像配准细节未公开
      - - 机械消融组织
        - 系统向靶点发送聚焦超声脉冲
        - 泡云空化在无热条件下机械液化组织
        - 避开热损伤；病灶靠近血管或胆管时，这一点可能很关键
        - 公开材料未量化所有病灶类型或尺寸上限
      - - 恢复并复评
        - 患者接受观察、出院，之后用影像随访
        - 早期 MRI / 影像评估属于证据基础的一部分
        - 医院新闻稿反复把该手术描述为微创或门诊方案
        - 长期随访路径因中心而异，公开层面尚未标准化
      - - 治疗当前商业化用例
        - 原发或转移性肝肿瘤护理路径
        - 目前唯一明确商业化的适应证
        - FDA 批准和支付方编码已经支撑肝脏项目
        - 肾脏和其他器官仍要等待未来标签扩展
      - - 扩展到下一批适应证
        - 肾脏、胰腺和前列腺 / BPH 分别评估
        - 公司把同一平台定位为可用于更多实体器官
        - 完全商业化之前，平台可选性已经可见
        - 胰腺和 BPH 的公开证据仍明显薄于肝脏
    notes: 工作流根据公司、FDA 和医院来源重建；应将其视为经过验证的操作顺序，而不是完整 SOP。
