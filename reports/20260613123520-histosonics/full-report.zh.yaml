  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              公开证据中最干净的市场出清参照，是 2025 年 8 月管理层主导的多数股权收购，给 HistoSonics 估值约 $2.25 billion；仅两个月后，新所有权集团领投的 $250 million
              融资又获得超额认购。这个组合比泛泛的风投热情更重要，因为它同时显示了一个有定价的控制权交易，以及同一批支持者在交易后立即追加资本，而不是等待公开上市。与此同时，证据没有显示公开收入、毛利率、系统利用率、订单积压转化或清算优先权细节，因此投资人无法像看公开设备可比公司那样透明地承销这个估值。结论是：对现有战略和跨界投资人来说，若其看重品类领导力和多器官可选性，这个估值算合理；对只能看到披露事实的新外部资本来说，则是满价到略偏高。纪律性姿态应是观察
              / 继续研究，而不是买入，除非新披露显著缩小经济性和结构缺口。
