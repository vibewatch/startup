      - number: '7.5'
        title: 财务不透明、估值与否决标准
        blocks:
          - type: paragraph
            body: >-
              从财务上看，HistoSonics 像一个资本密集型设备平台，仍在证明商业化曲线的斜率。公司在 2024 年需要 $102 million Series D，第三方报道称到 2025 年累计融资超过 $300
              million，随后私有市场叙事跳到 $2.25 billion 交易价值。这个序列可以解读为强势，也可以解读为规模仍依赖持续资本，以及投资人承销未来适应证扩展而非当前披露收入。退出线索也不干净：围绕 2025
              年出售流程的反向报道凸显了无交易风险，IPO 背景又受到市场波动拖累。Profound、EDAP 和 AngioDynamics 等公开可比公司市值低得多，因此任何 HistoSonics
              承销案例都必须假设其增长或战略稀缺性显著强于公开组今天反映的水平。纪律性答案不是否定公司，而是把尽调绑定到明确 否决标准：长期结局、报销转化、安装速度，以及证明估值是挣出来的，不只是标出来的。
