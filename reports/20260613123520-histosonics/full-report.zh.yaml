  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览与优先级栈
        blocks:
          - type: paragraph
            body: >-
              HistoSonics 确有动能，但抓取到的证据仍指向典型医疗科技规模化风险栈，而不是已经充分去风险的平台故事。当前收入路径绑定一个已获批产品、一个已获批器官，以及医院资本开支
              安装模式；使用要变得持久，必须先完成多学科工作流改变、医生培训和报销支持。证据基础有前景，但不完整：已发表肝脏研究显示强技术成功率和可接受的早期安全性，但 1-year
              论文也显示初次评估与事后局部控制率之间存在有意义差距；官方标签仍称 FDA 尚未评估特定疾病或长期生存结局。与此同时，当前采用经济性仍要经过 CMS
              编码、支付方覆盖和逐点落地；最新估值标记来自私有交易，而不是公开市场收入规模。因此，合理排序应把临床持久性和比较证据放第一，报销和编码依赖第二，医院实施与培训第三，监管扩展和全球扩张第四，估值纪律加披露不透明第五。
