      - number: '2.2'
        title: 受约束测算：患者池、分期筛选和站点容量
        blocks:
          - type: paragraph
            body: >-
              公开证据不足以为 HistoSonics 支撑一套干净、投资级的美元 TAM/SAM/SOM，因为没有保留来源披露 Edison
              ASP、资本成本、耗材经济性、当前肝脏收入或已安装利用率。因此，最可辩护的测算方法是受约束的， 而不是泛化的。需求侧，SEER 估计美国 2026 年新增肝脏和肝内胆管病例 42,340 例，其中 45%
              为局限期、 23% 为区域期；这意味着在进一步用超声可见性、病灶数量或肝脏储备筛选前，按分期过滤后的年度池约为 19,053 例局限期病例，或 28,791
              例局限期加区域期病例。扩展适应证的原始发病规模明显更大：肾脏和肾盂癌 新增 80,450 例，胰腺癌 67,530 例，前列腺癌 333,830 例。供给侧，HistoSonics 在运行日更新的医疗机构目录
              列出约 87 条地点记录和大约 80 多个医疗机构站点；这足以显示商业化，但相对于全国医院数量仍然很小。 因此呈现的是一个受容量和资格约束的市场，而不是已经全面渗透的全国设备市场。
