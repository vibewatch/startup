        - 展示明显高于 $2.25B 的新融资或老股交易价格，并配套更强披露
      - - 报销动能和 45.4M 会员政策扩展支持更广采用
        - 中
        - 覆盖广度不等于付费手术量或重复使用
        - 按季度发布付款方组合和付费病例趋势
      - - 肾脏、胰腺和前列腺的多适应症可选性支撑平台上行
        - 中
        - 肝脏之外的可选性大多仍处商业化前，速度可能慢于投资人预期
        - 拿下肾脏授权，并披露早期经济贡献
      - - 公开市场上的聚焦超声可比公司规模小得多，给品类领导者留下跑赢空间
        - 低
        - 公开可比公司差距太大，仅凭当前规模不足以支撑该估值
        - 提供证据，证明 HistoSonics 能比 Profound、EDAP 和相邻消融同业快得多地规模化
    notes: 反向逻辑关注估值敏感性，而不只是批评公司质量。
    claimRefs:
      - CV014
      - CV015
      - CV020
      - CV031
      - CV032
      - CV033
      - CV035
      - CV043
      - CV044
      - CV045
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 关键风险
    rows:
      - - 乐观
        - 肝脏采用持续复利，付款方覆盖扩大，肾脏和至少另一个适应症转化为可变现需求，国际铺开也跑通
        - 估计价值区间为 $3.5B-$5.0B；相对 2025 年 8 月估值有明显上行
        - 可能实现，但需要在报销、监管和商业端同时执行到位
        - 即使手术量上升，经济性披露仍可能令人失望
      - - 基准
        - 肝脏稳步扩张，报销改善，肾脏作为第一个有意义的第二适应症推进，但整个平台尚未完全变现
        - 估计价值区间为 $2.0B-$3.0B；当前估值落在可支撑区间内
        - 与当前证据最一致
        - 如果规模指标继续不公开，平台仍显昂贵
      - - 悲观
        - 采用放缓，报销停滞，新适应症滑坡，或交易结构对投资人不友好
        - 估计价值区间为 $0.8B-$1.4B；溢价压缩至高端公开消融可比公司附近
        - 当前经济性未披露，实质下行仍可信
        - 控制权交易结构和跟投优先权可能恶化新资金回报
    notes: 情景价值是分析师根据公开可比公司组、临床里程碑和交易参考估算，不是公司指引。
    claimRefs:
      - CV036
      - CV037
      - CV038
      - CV039
      - CV041
      - CV050
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司 / 参考
      - 估值或指标
      - 说明什么
      - 相关性
      - 局限
    rows:
      - - HistoSonics 2025 年 8 月多数股权收购
        - $2.25B 估值
        - 已完成的私有化控制权交易
        - 最直接的估值锚
        - 不是完整的公开市场价格发现
      - - 传闻中的战略出售讨论
        - '> $2.5B 指示性水平'
        - 显示大型医疗科技买家的战略兴趣
        - 检验潜在 M&A 上限
        - 无法保证该水平的交易本会成交
      - - Profound Medical
        - 约 $241M 市值；2026 年收入指引约 $25M
        - 公开聚焦超声 / 前列腺消融可比公司，披露商业指标
        - 最接近的公开聚焦超声商业化映射
        - 器官焦点和 MRI 引导流程不同
      - - EDAP / Focal One
        - 约 $177M 市值
        - 公开 HIFU 前列腺局灶治疗可比公司
        - 显示公开市场目前如何定价聚焦超声治疗平台
        - 地域、适应证和产品成熟度不同
      - - AngioDynamics / NanoKnife
        - 约 $504M 市值
        - 相邻消融基准，设备组合更宽
        - 可用于校验保器官消融业务的估值上限
        - 不是聚焦超声，业务也更多元
      - - Insightec
        - 私有聚焦超声先行者；披露 400 名员工
        - 公开市场之外的战略平台基准
        - 显示聚焦超声可以支撑有规模的私有平台
        - 无公开估值，组合偏神经科
    notes: 可比集合混合了交易、公开市场和私有平台参照，因为不存在完全匹配的公开肝脏组织碎化术同行。
    enumerationScope:
      coverage: partial
      basis: >-
        Representative 2025-2026 valuation references spanning the closest public focused-ultrasound and adjacent
        ablation benchmarks plus the actual HistoSonics transaction.
