      - number: '5.5'
        title: 管线适应证、IP 姿态与产品风险
        blocks:
          - type: paragraph
            body: >-
              公开 2026 年管线证据中，肾脏最强，胰腺和前列腺 / BPH 较弱。HistoSonics 公开宣布，2026 年 5 月向 FDA 提交肾脏肿瘤 De Novo 申请，并由关键 HOPE4KIDNEY
              项目支撑，使肾脏成为肝脏之外最清晰的下一步监管路径。 相比之下，胰腺和前列腺 / BPH 扩展主要通过研究和创始人 / 社群信号可见：University of Michigan 发明人简介称， 当前工作旨在把
              histotripsy 扩展到肾脏、胰腺和前列腺癌；一份 ISTU 简介记录 2016 年首次人体 BPH 试验获批。 更新的 2026 年来源让图景更清晰：HistoSonics 和 EVToday 称
              WOLVERINE 可行性研究已在香港 Prince of Wales Hospital 治疗首批 BPH 患者，采用前瞻性多中心单臂设计，72 小时内影像检查，计划入组最多 20 名患者。
              这足以把多器官扩展视为真实，但还不足以把胰腺或 BPH 视为近期商业业务。专利页面支持其拥有有意义的 IP 资产， Taiwan
              批准和医疗机构铺开也支持全球产品动能。不过，主要产品风险仍在执行：把肝脏优先疗法转化为可重复的多器官协议， 在保持安全的同时扩大培训和服务，并把有前景但仍集中在精选中心的证据转化为更广泛的标准治疗采用。
