    type: range
    layout: standard
    summary: 情景区间显示，当前估值落在基准情景，而不是悲观或乐观两端。
    data:
      items:
        - label: 悲观情景
          low: 0.8
          mid: 1.1
          high: 1.4
          note: 采用放缓、支付报销停滞，或新适应症延后
        - label: 基准情景
          low: 2
          mid: 2.5
          high: 3
