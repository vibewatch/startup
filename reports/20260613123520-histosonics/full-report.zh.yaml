        blocks:
          - type: paragraph
            body: >-
              与 HistoSonics 品牌最接近的类比对象，未必是其当前最接近的肝脏竞争对手。Profound、EDAP/Focal One、 Sonablate 和 Insightec
              都证明，带有强影像叙事的非侵入式或微创能量平台能吸引医生和投资者投入资金。 但审阅页面也显示，这些公司集中在不同的工作流所有者和器官系统。Profound 的 TULSA 平台由 MRI 引导、
              机器人驱动、经尿道、以前列腺为中心，截至 2026 年 Q1 末报告安装基数为 80 套。Focal One 和 Sonablate 也是面向泌尿科医生的前列腺 HIFU
              平台，使用热消融及融合或反馈工具，在治疗腺体时尽量保留组织。Insightec 是本证据集中品牌认知最广的聚焦超声在位者，但抓取的首页聚焦 MRI 引导的神经手术，而不是腹部肿瘤。 结论是，HistoSonics
              并非唯一销售精准能量疗法的公司，但它在当前肝脏工作流所有权上有差异化。这个差异化应被视为 阶段性优势，而不是永久护城河，因为资本充足的前列腺或聚焦超声供应商可以继续扩展适应证。
