      - number: '8.4'
        title: 乐观、基准与悲观情景框架
        blocks:
          - type: paragraph
            body: >-
              最稳妥的估值框架应基于情景，而不是倍数。基准情景下，HistoSonics 继续扩大肝脏安装，支付方覆盖 从早期胜利进一步扩展，肾脏成为第一个有意义的第二适应证，但尚未证明完整平台故事。这支持约 $2.0
              billion 至 $3.0 billion 的估值区间，使 2025 年 8 月出清估值落在合理基准区间中部。乐观情景下，报销拓宽，Taiwan
              和其他国际市场贡献真实收入，肾脏加至少一个新增适应证从承诺走向可变现采用，支撑约 $3.5 billion 至 $5.0 billion
              区间。悲观情景下，采用增长放缓、经济性披露令人失望，或新适应证时间表滑坡，价值回落至 $0.8 billion 至 $1.4
              billion，并暴露过早支付平台溢价的下行风险。不对称性有意义：上行存在，但依赖里程碑；相对当前公开可比公司背景，也并不显得便宜。
