      - number: '4.3'
        title: 资本基础、估值台阶与充足性
        blocks:
          - type: paragraph
            body: >-
              HistoSonics 不是轻资本故事。仅自 2024 年 8 月以来，公司就公开披露了 $102 million Series D 和后续 $250 million
              成长融资。两者之间，公司在一笔管理层主导的多数股权交易中易手，估值约 $2.25 billion。 这些步骤合起来说明两点。第一，投资者愿意以越来越激进的规模支持公司，因为 histotripsy 现在已有
              FDA 批准、 早期客户采用，并具备进入更多器官的可见路径。第二，公司在获批后仍需要大规模资本池，因为商业化建设、国际扩张和 新适应证试验都仍在进行。


              资金充足性比融资时间线更难判断。已检索的 HistoSonics 材料均未披露账面现金、烧钱速度、现金跑道或债务，因此市场 能看到融资动能，却看不到资金是否足够。融资措辞本身很有信息量：2024 和 2025
              年两轮融资都强调商业扩张、全球铺开、 运营能力和更多临床适应证。这是增长语言，不是自我造血语言。独立出售流程报道是反向对应：在 $2.25 billion 交易前， 媒体报道曾提出 >$2.5 billion
              结果，并称 IPO 活动受市场波动限制。这个组合说明 HistoSonics 有融资选项， 但仍依赖外部资本市场和赞助方胃口，而不是已披露的现金生成能力。
