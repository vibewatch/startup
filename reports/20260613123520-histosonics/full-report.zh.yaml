      - number: '6.4'
        title: 持久性、重复使用代理指标与满意度证据缺口
        blocks:
          - type: paragraph
            body: >-
              公开记录对早期临床证据更强，对商业留存持久性更弱。临床论文为安全性和有效性提供了真实支撑：2024 年关键性 HOPE4LIVER 论文报告 14 个中心、44 名受试者接受治疗，技术成功率 95%，30
              天内重大并发症 7%；2025 年一年期更新报告 47 名患者和 52 个已治疗肿瘤，事后局部控制率 90%；THERESA 首次人体研究报告 8 名患者 8 周内无设备相关不良事件。Focused
              Ultrasound Foundation 的试验摘要补充称，HOPE4LIVER 中没有任何中心此前有 histotripsy
              经验，这可作为新中心学习曲线可达成的有用代理。客户侧发布也反复强调当日出院、停工时间短、保留血管以及与辅助疗法兼容。Vanderbilt 报告第 100 例 histotripsy
              手术，是少数公开重复使用里程碑之一；Good Shepherd 则提供了另一个有用代理：一次治疗可处理多个肿瘤，且手术可重复、不设终身上限。

              缺失的是经典商业持久性数据。已审阅公开来源没有披露
              NRR、GRR、流失率、续约率、合同期限，或多数具名账户的中心级使用量。多数发布只能证明一个中心购入系统或治疗首位患者，不能证明每月重复手术量、持久经济性或多年账户扩张。满意度证据同样间接：公开来源有大量临床恢复和工作流表述，但没有医疗服务提供方
              NPS、采购方续约背书或纵向账户留存统计。更稳妥的结论是，公开满意度和留存代理指标为正，但仍只是代理，还不是已闭合的商业事实。
