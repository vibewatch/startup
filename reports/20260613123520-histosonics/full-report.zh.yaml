      - number: '4.5'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              财务结论是：战略动能方向上正面，承销可见度方向上负面。HistoSonics 有真实融资支持、支付方进展和扩大的站点覆盖。
              这些正是早期医疗科技平台变成产收治疗网络所需的要素。公司也似乎占据品类领先位置：首个获批的 histotripsy 系统、 强医院品牌采用，以及愿意支持数十亿美元交易和后续成长轮的投资者。


              仍然缺失的是投资者判断利润率路径和稀释风险所需的核心财务底层。公开资料集不披露收入、现金、烧钱速度、债务、ASP
              或队列利用率。这意味着融资历史和报销胜利还不能转化为收入质量、回本或现金跑道信心。当前最好的解读是，HistoSonics
              正在从临床和融资强势位置扩张，但在管理层披露肝脏站点采用如何真正转化为经常性毛利润之前，公司仍依赖融资、 且资本密集。下一轮尽调因此应少看融资故事，多看每个已安装站点的现金转化机制。
