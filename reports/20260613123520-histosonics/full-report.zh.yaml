        title: 热消融、SBRT 和手术仍是更重的实际竞争
        blocks:
          - type: paragraph
            body: >-
              替代方案一侧比一张简单的聚焦超声公司标识清单更危险。Histotripsy 文献反复把自身放在既有局部区域治疗的对面， 而不是放在前列腺 HIFU 供应商的对面。2025
              年比较综述明确表示，射频消融、微波消融和立体定向体部放疗都追求局部控制， 但受热沉效应、血管附近治疗不彻底或附带损伤困扰；而 histotripsy 的机械空化可能保留导管和血管，更适合靠近关键结构的
              病灶。同时，同一批来源也提醒投资者为什么在位者能持续存在：这些模式已经有设备平台、工作流所有者和肿瘤委员会熟悉度。 Medtronic 和 AngioDynamics
              都把成熟微波系统销售到软组织或肝脏消融；NCI kidney PDQ 仍把手术、热消融、SBRT、 栓塞及相关选项列为许多患者的可接受菜单。医院文章还把 histotripsy
              描述为门诊且可与其他疗法组合，这有助于 HistoSonics 嵌入既有肿瘤路径，但不会改变一个事实：在位模式仍定义默认预算和转诊路径。
