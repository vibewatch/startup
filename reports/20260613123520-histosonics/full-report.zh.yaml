chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部与科学起源
        blocks:
          - type: paragraph
            body: >-
              HistoSonics 是一家私营医疗器械公司，核心是 histotripsy：一种非侵入式聚焦超声疗法， 通过机械方式液化目标组织，而不是烧灼组织。公司的 about、technology、science 和
              careers 页面 共同把 Edison 描述为首个商业平台，同时显示其在 Plymouth/Minneapolis、Ann Arbor 和 Madison
              形成多地运营足迹。最可复用的起源叙事是：histotripsy 自 2001 年起在 University of Michigan 开发，并在 2009 年前后通过 HistoSonics
              商业化；不过一份纪念来源称 Charles Cain 在 2010 年 共同创立公司。这个差异不大，但值得保留，因为它指向的是一个商业化窗口，而非一个被普遍引用的
              单一注册日期。公开层面看，公司在总部和商业化上更像 Minnesota 公司；但其科学身份离不开 University of Michigan 的发明人、实验室和临床合作者。
