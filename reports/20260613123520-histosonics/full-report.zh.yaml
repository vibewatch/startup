      - number: '1.2'
        title: 产品、适应证范围与技术定位
        blocks:
          - type: paragraph
            body: >-
              Edison 系统最好被理解为平台疗法，而不是一次性的肝脏设备。官方技术和科学资料强调脉冲声能、 实时可视化，以及可避开血管和周围组织的非热机制。FDA 和 PubMed 来源证实，目前获批用途是
              肝脏肿瘤，包括不可切除肿瘤；临床开发已经推进到肾脏、胰腺、前列腺和其他部位。临床记录有前景， 但尚未完全成熟。THERESA 在极小的首次人体队列中显示可行性，且无设备相关不良事件；HOPE4LIVER
              一年更新报告了有意义的局部控制，同时记录 30 天内 6 起严重设备相关影响，并明确给出有利但仍早期的 生存比较。这个组合对尽调很关键：HistoSonics 已有真实监管和临床牵引力，但后续章节仍应把长期结局
              耐久性和适应证扩展视为仍在发展的事项，而非已定事实。
