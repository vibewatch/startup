      - number: '6.2'
        title: 具名证据与学术中心 / 社区体系采用
        blocks:
          - type: paragraph
            body: >-
              具名证据显示产品已有真实采用，但深度不均。HistoSonics 自己在获批后的上市发布中，把 University of Rochester Medical Center 和 Cleveland Clinic
              列为 De Novo 获批后首批标准临床实践合作方；这比单纯 logo 更有力，因为它把账户与真实患者和具体病例描述绑定起来。此后，客户侧公告扩大了证据集：Hoag 在 2024 年公开门诊使用；Allina
              描述了 2025 年末 Twin Cities 首例手术，以及更完整的 2026 年铺开叙事；Hackensack、ECU Health、UofL Health、Johns Hopkins、Good
              Shepherd、Sutter CPMC 和 UVA Health 都在 2025-2026 年发布公告，描述州内首例、区域首例或系统首例里程碑。Vanderbilt 披露截至 2026 年 2 月已完成第
              100 例 histotripsy 手术，提供了更少见的成熟度信号。

              更重要的分析点是，采用并不限于学术医学中心。Johns Hopkins、U-M Health、UofL Health、Vanderbilt、UVA、ECU/Brody 和 Jersey Shore
              University Medical Center 构成学术和三级护理侧的故事；Hoag、Good Shepherd、Allina 和 Sutter CPMC
              则说明区域和社区导向系统也愿意投入。不过，公开证据仍集中在上市式新闻稿里：外部能验证的真实临床使用，大多来自少数明星账户。目录覆盖面很广，但最深的独立可见证据，仍来自更小一组首位患者、州内首例和少数重复使用里程碑。
