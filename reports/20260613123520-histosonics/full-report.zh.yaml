      - number: '8.5'
        title: 退出信号、投资逻辑破裂触发点与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              出售和 IPO 讨论很重要，因为它让 $2.25 billion 标记的含义更清楚。独立报道称，HistoSonics 同时探索过战略出售和公开上市，传闻 Medtronic、GE HealthCare 和
              Johnson & Johnson 对超过 $2.5 billion 的估值有兴趣；但交易并无保证，波动的公开市场也被列为偏向私有结果的原因。因此，已完成价格不像困境折中，
              更像务实的私有市场出清水平；但它也没有显示战略买方上限显著更高的证据。对投资人而言，下一步尽调问题因此更多是结构和经济性，而不只是科学：多数股权资本重组 和 10
              月跟投融资创设了哪些股份类别和清算优先权，每台已安装系统对应怎样的收入和毛利率画像，早期覆盖
              有多少转化为付费手术量？投资逻辑破裂触发点也很具体：如果肝脏采用停滞、报销拓宽平台化，或肾脏进展滞后，平台溢价应快速收缩。在这些缺口闭合前，正确立场是监控，而不是追高。
