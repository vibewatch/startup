      - number: '7.2'
        title: 临床、监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              监管基础比公司宽口径叙事更窄。FDA 仅批准 Edison 用于非侵入性破坏肝肿瘤，并附加了围绕临床测试、非临床验证、软件、人因和标签的明确特殊控制。FDA
              还要求标签声明该设备尚未针对任何特定疾病或病症接受评估；公司官方免责声明也重复指出，局部肿瘤进展、五年生存和总生存仍是未评估终点。这不否定肝脏获批，但意味着相对于商业野心，最强的公开数据集仍处早期。HOPE4LIVER
              论文支持技术成功和可管理的早期安全性，但 1-year
              更新带来持久性模糊，因为初次与事后局部控制率差异很大。因此，肾脏扩展不只是商业附加项；它是一场新的监管战役，带有研究性状态、试验入组风险和新的证据负担。法律层面，公开专利清单显示组合活动有一定规模，但它本身不能回答自由实施、授权或诉讼风险问题。
