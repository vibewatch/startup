      - number: '2.3'
        title: 买方、用户、支付方与资本设备工作流
        blocks:
          - type: paragraph
            body: >-
              买方是机构，不是消费者。公开发布页面和医疗机构目录显示，Edison 被介入放射、外科肿瘤、肝胆、移植和 癌症中心等服务线采用。实际中，经济买方很可能是能为设备采购给出理由的医院资本委员会或服务线赞助人；
              临床用户是在放射或肿瘤工作流中操作的受训医生；支付方栈从手术编码 / 支付开始，再扩展到支付方政策覆盖。 CPT 0686T 和 CMS 门诊支付提高至 $17,500 后，手术报销已改善；住院病例仍可依赖
              DRG 逻辑。商业覆盖 不再只是设想，但仍不成熟，因为 Elevance 在 2025 年发布了覆盖 14 个州的正向医疗政策。采用工作流也呈现
              多学科特征：医院描述了肿瘤委员会审查、科室归属决策、医生培训、发布宣传，然后逐步扩展到当日或短住治疗路径。 这种组合让 HistoSonics
              更像是向复杂医疗机构系统销售资本医疗设备，而不是简单的按手术耗材业务。
