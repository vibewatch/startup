  - id: TP004
    title: 替代模态对比
    columns:
      - 模态
      - 典型所有者
      - 强项
      - 已审阅证据凸显的主要局限
      - 买方为何仍可能选择
      - HistoSonics 含义
    rows:
      - - Histotripsy
        - 外科 / IR / 肝脏肿瘤项目
        - 无切口、非热、非电离的机械消融，并有保血管逻辑
        - 当前上市许可先聚焦肝脏，长期比较经济性证据仍少
        - 为部分不可切除或位置困难病灶提供无针门诊选项
        - 有差异化，但相对既有治疗菜单仍处早期
      - - Microwave ablation
        - 介入放射科
        - 成熟的经皮流程，边界工具和速度主张更可预期
        - 血管周围存在热性附带损伤和热沉限制
        - 医院已有 IR 流程和消融经验
        - 肝肿瘤项目内最直接的替代方案
      - - Radiofrequency ablation（射频消融）
        - 介入放射科
        - 肿瘤委员会长期使用的局部控制工具
        - 比较综述指出热沉和血管周围消融不完全的限制
        - 医生熟悉，转诊路径已形成
        - 既有默认方案让 HistoSonics 的份额切换负担仍高
      - - SBRT / SABR
        - 放射肿瘤科
        - 已嵌入放疗路径的非手术选项
        - 有辐射暴露，且归属另一个科室
        - 适合已进入放射肿瘤科路径的患者或中心
        - 争夺非手术病例，且不需要新增设备资本
      - - Surgery / resection
        - 外科肿瘤科
        - 在部分肾脏和肝脏适应患者中常被接受为可治愈路径
        - 侵入性强，可能需要恢复时间或中断全身治疗
        - 标准治疗地位明确，临床医生高度熟悉
        - 只要可切除，维持现状的选项仍很强
      - - Embolization
        - 介入肿瘤科
        - 治疗菜单中的成熟局部区域选项
        - 侵入性的导管流程，不能等同于无创消融
        - 已纳入预算，医生熟悉
        - HistoSonics 还必须替代或补充另一条既有路径
    notes: 增设这张表，是因为医院内的模态替代和聚焦超声厂商之间的产品竞争同样重要。
