            body: >-
              公开资料中，执行团队层面的领导层可见度较好，但董事会和所有权层面不完整。HistoSonics 清楚披露 Mike Blue 为总裁 / CEO，2025 年交易后为董事长 /
              CEO，并列出技术、财务、临床、监管、报销、 运营和 HR 等职能负责人。Zhen Xu 仍是公开记录中最明确的科学创始人；Charles Cain 则是 histotripsy
              的智识之父，也是创始叙事的一部分。再往后，治理可见度明显下降。2024 年 Series D 公告将 Alpha Wave 的 Chris Dimitropoulos
              加入董事会，但审阅资料包未披露完整现任董事名单、 委员会结构或持股比例。相比之下，资本历史清晰得多：HistoSonics 在 2024 年完成 $102 million Series D，随后在 2025 年
              8 月接受管理层主导、估值约 $2.25 billion 的多数股权收购，并在 2025 年 10 月完成 $250 million 成长融资。这些事件勾勒出一家成长阶段公司：私募市场支持异常强，
              但仍受私营公司披露边界限制。
