      - number: '6.3'
        title: 治疗流程、报销与销售周期含义
        blocks:
          - type: paragraph
            body: >-
              公开来源描绘出相当具体的客户工作流。设备卖进医院肝脏项目，患者先经过多学科评审，再评估超声可视性和肿瘤负荷，随后由受训操作者 安排手术；医院通常把它描述为门诊或当日护理。Johns Hopkins
              治疗页面称，候选患者通常肿瘤小于 4 cm、病灶不超过 3 个且解剖条件有利；麻醉后治疗本身约 10 至 90 分钟，通常总计约 1.5 至 2 小时并当日出院。Allina 给出类似的总时长估计，并称
              histotripsy 可与化疗或放疗并用；Cleveland Clinic 则把它描述为针对不可手术肝肿瘤的安全有效选择，但并不适合所有肝癌。Anthem 的政策
              更窄，只在其他疗法不可用或不适合、且治疗肿瘤不超过 3 个且每个不超过 3 cm 时，才把肝肿瘤使用限定为医学必要。Sutter、Hackensack 和 Cleveland Clinic
              作者都强化了某种肿瘤委员会或多学科筛选流程。

              这些事实很关键，因为客户旅程比简单的资本设备投放更长。医疗服务提供方需要服务线背书、医生培训、患者筛选路径、编码和报销信心，以及足够多的合格患者来支撑持续使用。积极面是，CMS 将肝肿瘤 histotripsy
              门诊支付提高到 $17,500，AAPC 列出专用 0686T 代码，BCBS Michigan 和 Elevance 都扩大了覆盖，多家医院公告强调当日出院和恢复负担低，Michigan Medicine
              还强调实时 bubble-cloud 可视化以及与系统治疗联用的潜力。Focused Ultrasound Foundation 对 HOPE4LIVER
              的报道也提供了一个有用的导入数据点：研究前没有任何试验中心具备 histotripsy 经验。负面是，支付方覆盖仍按适应证限定而非全面覆盖，培训仍受操作者
              门槛约束，更大或可视性差的肿瘤可能仍需要辅助化疗、免疫治疗或其他局部治疗。组合起来看，这是一个有意义但节奏审慎的医院销售周期。
