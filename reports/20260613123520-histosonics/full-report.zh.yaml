  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与披露缺口
        blocks:
          - type: paragraph
            body: >-
              HistoSonics 的公开收入模式只看得到轮廓，看不到审计数字。公司似乎先通过把 Edison 平台放入肝脏肿瘤中心变现， 站点上线后再通过可报销手术活动变现。证据集支持肝脏是商业滩头：公司和 FDA
              材料持续把肝脏描述为获批适应证， 而肾脏仍绑定在研究性或商业化前编码路径上。AAPC 的 0686T 描述和 CMS 支付更新显示，收入事件发生在手术层， 但已检索的公开材料都没有披露系统标价、实际
              ASP、服务合同经济性、耗材或收入确认政策。


              这让财务章节有清晰机制，却缺少扎实账本。机制是设备加手术采用，由报销和医疗机构铺开支撑。账本仍然不透明： 抓取集中没有公开收入、ARR、利润率或队列数据。因此，承销必须区分什么可知、什么只是看似合理。今天可知：
              公司有可报销的肝脏手术、扩大的支付方支持和扩张中的医疗机构基础。今天不可知：Edison 投放前期贡献多少、 经常性收入是否重要、经济性中医院和 HistoSonics
              各拿多少，或初始安装后经常性毛利润是否改善。
