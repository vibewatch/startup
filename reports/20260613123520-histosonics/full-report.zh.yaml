  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              HistoSonics 当前市场边界比泛化的聚焦超声或肿瘤机器人类别窄。FDA 和公司标签目前把 Edison 限定在
              通过非热机械聚焦超声流程非侵入式摧毁肝脏肿瘤，包括不可切除肝脏肿瘤；同一标签还说明该设备仅限处方使用， 要求患者有足够功能性肝脏储备，且尚未评估疾病特异性癌症结局。这意味着今天纳入的支出是肝脏肿瘤手术收入、
              医院采购和部署 Edison 系统、医生培训、影像引导手术工作流，以及绑定 CPT 0686T 或住院 DRG 的支付方报销。
              当前获批市场不包括肾脏、胰腺、前列腺、甲状腺和其他器官应用，除非另行获批；也不包括一般放射肿瘤学支出 或消费者健康超声类别。实际现状替代方案是手术、热消融、SBRT、经动脉肝脏定向疗法，以及局部治疗不合适时的
              观察等待或系统治疗。因此，histotripsy 今天位于一个高度具体的肝脏介入楔形市场，未来价值取决于适应证扩展， 而不是立即参与全部实体瘤治疗支出。
