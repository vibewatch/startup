        - id: n4
          label: 可及性：CMS、CPT 和 45.4M 会员 Elevance 覆盖扩张
        - id: n5
          label: 可比差距：远高于 Profound、EDAP 和 Angio 的公开估值
        - id: n6
          label: 盲点：收入、利润率、使用率和优先条款未披露
        - id: n7
