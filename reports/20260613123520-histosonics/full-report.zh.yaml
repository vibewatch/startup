      - number: '8.3'
        title: 可比公司组与公开市场映射
        blocks:
          - type: paragraph
            body: >-
              公开可比公司组没有完美匹配，但仍有助于检验 $2.25 billion 到底有锚还是偏想象。Profound Medical 是最接近的公开聚焦超声治疗可比公司，截至 Q1 2026 末装机基数为 80 台
              TULSA-PRO 系统，另有 6 台已发货但尚未安装，2026 全年收入指引约 $25 million；但 Profound 在 2026 年 6 月 12 日市值仅约 $241 million。EDAP 的
              Focal One robotic HIFU 系统针对前列腺组织破坏，市值约 $177 million。AngioDynamics 不是聚焦超声可比公司，但其 NanoKnife
              前列腺肿瘤平台和更广泛的肿瘤设备组合，提供了一个相邻消融基准，约 $504 million。Independent CompaniesMarketCap 在 2026 年 6 月 12 日的快照同样显示
              Profound 约 $0.24 billion、AngioDynamics 约 $0.49 billion，进一步说明公开基准组仍远低于 $1 billion。Insightec 提供另一个私有聚焦超声
              平台基准，尽管其核心在神经领域，而不是肝脏肿瘤。差距因此非常大：HistoSonics 的 $2.25 billion 标记约为 Angio 的 4.5 倍、Profound 的 9.3 倍、EDAP 的
              12.7 倍。这个溢价不能仅靠当前披露规模解释；只有当投资人承销 HistoSonics 成为定义品类的实体瘤 histotripsy 平台，并实现多适应证扩展和快于公开可比公司的商业化速度时，才说得通。
