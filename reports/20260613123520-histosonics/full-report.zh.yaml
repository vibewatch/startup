  - id: FU001
    title: 客户旅程地图
    type: journey-map
    layout: wide
    summary: 描绘 HistoSonics 典型医院旅程：从转诊和病例评审，到受训操作者使用，再到本地重复转诊。
    data:
      items:
        - label: 转诊与专科接诊
          detail: 肝肿瘤患者进入医院肿瘤科、肝胆胰外科、移植或介入放射工作流，而不是独立诊所渠道。
          claimRefs:
            - CU004
            - CU021
        - label: 多学科病例评审
          detail: 肿瘤委员会或同等评审会评估替代疗法、超声可见性，以及 histotripsy 是否匹配患者病情。
          claimRefs:
            - CU022
            - CU024
            - CU026
        - label: 支付方与编码准备
          detail: 医院在扩大转诊前，会验证门诊编码、CMS 经济性和具体医保计划的政策标准。
          claimRefs:
            - CU023
            - CU030
            - CU031
            - CU034
        - label: 培训与资质认证
          detail: HistoSonics 要求的医生培训和本地工作流搭建，在采购后、常规使用前形成一道闸门。
          claimRefs:
            - CU027
            - CU028
            - CU048
        - label: 首次门诊治疗
          detail: 多数客户侧新闻稿把该手术描述为当日或门诊护理，停工时间很短。
          claimRefs:
            - CU025
            - CU041
        - label: 重复使用与本地可及性循环
          detail: 社区和区域医疗系统借首例成功，把患者留在离家更近的地方；在部分站点，也可对新发或多发肿瘤重复治疗。
          claimRefs:
            - CU038
            - CU049
    approximationNotes: 该旅程地图综合了公开客户新闻稿和支付方政策中反复出现的工作流模式，并非描绘某个已披露的内部手册。
