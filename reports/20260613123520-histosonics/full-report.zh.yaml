  - id: TV005
    title: 打破论点与否决触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 肝脏采用停滞
        - 服务机构覆盖继续扩大，但公开证据不再显示患者量实质扩张
        - 削弱支撑平台溢价的品类领导者增长逻辑
        - 将立场转向估值偏高，并重新审视悲观情景
      - - 支付方扩张见顶
        - CMS、CPT 和 Elevance 进展之后没有有意义的跟进
        - 降低对已安装系统转化为经济产出的信心
        - 把报销视为瓶颈，而不是顺风
      - - 肾脏项目滑坡
        - HOPE4KIDNEY 的监管进展或临床映射明显放缓
        - 损害溢价估值中嵌入的第二适应证可选性
        - 将估值区间收窄至更接近肝脏单一业务的医疗科技可比公司
      - - 薄弱经济性显现
        - 披露的收入、利用率或毛利率明显低于隐含预期
        - 表明当前商业表现无法弥合公开可比公司的差距
        - 任何新资金投入前都要求折价
      - - 战略退出胃口减弱
        - 2025 年战略讨论后，出售 / IPO 动能没有恢复
        - 限制近期以溢价估值退出的可选性
        - 延长持有期假设并下调回报预期
      - - 投资者结构偏重
        - 优先权堆栈或控制条款明显压低新资金回报顺位
        - 结果层面可能让看似公允的表面估值变得没有吸引力
        - 除非清理股权结构或给出补偿性价格折扣，否则不投资
    notes: 触发因素聚焦可监测、会改变估值立场的事件，而不是泛泛的经营风险。
    claimRefs:
      - CV006
      - CV020
      - CV021
      - CV041
      - CV043
      - CV044
      - CV045
      - CV050
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 股权结构和优先权
        - 收购后和 2025 年 10 月的股份类别、清算堆栈和投资者保护
        - 表面估值可能高估普通股吸引力
        - 索取董事会批准的资本结构表和融资文件
      - - 商业规模
        - 按已安装系统拆分的收入、毛利率、利用率和积压订单转化
        - 需要用叙事之外的指标，把 HistoSonics 与公开可比公司比较
        - 索取经审计的管理报表和队列分析
      - - 支付方兑现
        - CMS 和 Elevance 进展后，按支付方和州拆分的已付费手术量
        - 覆盖公告未必转化为实际报销
        - 索取理赔数据和报销回款分析
      - - 肾脏经济性
        - 肾脏发布的预期时间线、定价和采用假设
        - 第二适应证可选性是乐观情景的核心支撑
        - 审阅发布模型、试验读数和监管互动
      - - 国际变现
        - 台湾和其他非美国进展如何转化为收入
        - 全球扩张被列为资金用途，也是溢价的理由
        - 索取逐国推出计划和分销商经济性
      - - 退出路径和时点
        - 所有权方偏好后续战略出售、私有持有还是最终 IPO
        - 回报承销取决于路径和持有期
        - 直接与管理层和领投投资者讨论退出框架
    notes: 这些问题是把评级从观察 / 继续研究上调至正面建议前所需的最低证据包。
    claimRefs:
      - CV007
      - CV017
      - CV019
      - CV034
      - CV042
