        title: 里程碑、扩展路径与主要尽调警示
        blocks:
          - type: paragraph
            body: >-
              对一家私营医疗科技公司而言，这条里程碑弧线异常连贯：学术发明、分拆成立、首次人体验证、FDA De Novo 批准、报销进展、地域扩张，以及相邻适应证逐步申报。到 2026 年中，HistoSonics 已取得
              Taiwan TFDA 批准，并正式向 FDA 提交肾脏肿瘤申请，进一步说明管理层正试图把一个已获批的肝脏应用变成更广泛的 实体瘤平台。尽管如此，承销判断并非毫无摩擦。Hopkins
              明确表示长期数据尚不可得，且当前患者选择仍然狭窄。 HOPE4LIVER 一年更新保留了有利标题，但也记录了 6 起严重设备相关影响。公司层面，公开资料仍缺少当前收入、
              客户数、运行日员工数、董事会构成和所有权结构；2025 年出售流程报道还显示，管理层在选择私下交易前 评估过多条融资路径。这些不会击穿投资逻辑，但正是后续尽调应直接追问的缺口。
