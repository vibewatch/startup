  - id: TU006
    title: Academic vs community adoption table
    columns:
      - Account type
      - Named examples
      - Public proof strength
      - Workflow / buying implication
      - Main limitation
    rows:
      - - Academic flagship
        - Johns Hopkins, U-M Health, UofL Health, Vanderbilt Health, Jersey Shore University Medical Center
        - Strong named proof with patient-selection detail and institutional commentary
        - Helpful for procurement at later sites because peer institutions can validate workflow
        - Some flagship proof is not fully independent or still early-stage
      - - Academic-affiliated regional center
        - ECU Health Medical Center, UVA Health
        - Strong regional first-procedure evidence
        - Shows adoption can move through teaching-affiliated systems outside top coastal hubs
        - No disclosed long-run utilization or renewal data
      - - Community / nonprofit cancer institute
        - Hoag, Allina Health Cancer Institute
        - Clear first-case proof and same-day workflow language
        - Suggests appeal to differentiated regional cancer programs
        - First-case PRs do not prove durable economics
      - - Rural community health system
        - Good Shepherd Health Care System
        - Strong access story plus repeat-use language
        - Indicates Edison can fit access-expansion and close-to-home narratives
        - Volume and payer mix remain undisclosed
      - - Urban tertiary organ-therapy program
        - Sutter CPMC
        - Strong multidisciplinary and transplant-oncology framing
        - Supports use in complex liver programs where bridge-to-transplant logic matters
        - Public evidence still lacks procedure run-rate
      - - Directory-only long tail
        - Dozens of additional listed hospitals on the provider page
        - Breadth is real but mostly logo-level
        - Helpful for geographic signaling and referral optics
        - Listing alone does not prove first case or retained account activity
    notes: This table sharpens the academic-versus-community split visible in the directory and customer releases; it is a categorization lens rather than a separate customer count.
    claimRefs: [CU002, CU003, CU019, CU020, CU042, CU043, CU044, CU049, CU050, CU051, CU052]
  - id: TU005
    title: Expansion and concentration risk table
    columns:
      - Expansion driver
      - Concentration risk
      - Impact
      - Diligence path
    rows:
      - - Positive payer-policy expansion
        - Coverage still limited to liver tumors and explicit clinical criteria
        - Can widen funnel in covered states but leaves many cases uncovered or delayed
        - Collect plan-by-plan policy map and authorization turnaround times
      - - Same-day outpatient workflow
        - Hospital adoption still depends on trained operators and anesthesia / imaging workflow
        - Supports community-hospital adoption but slows ramp after purchase
        - Request install-to-first-case timelines and training completion rates
      - - Academic flagship references
        - Proof surface can overstate maturity if investors overweight a few marquee centers
        - Reference value is high, but concentration risk remains if most visible use is clustered
        - Request installed-base revenue concentration and top-site procedure share
      - - Regional access narrative
        - First-in-state launches can be newsworthy without proving repeat economics
        - Helpful for pipeline generation, less helpful for retention underwriting
        - Separate first-case PRs from trailing-12-month active sites
      - - Clinical evidence accumulation
        - Stronger publications help procurement but do not eliminate payer or indication limits
        - Supports conversion, especially at evidence-focused systems
        - Track how many closed-won accounts cite HOPE4LIVER or registry data in approvals
      - - Directory breadth and global sites
        - Directory listing does not prove active volume, durable revenue, or international monetization
        - Geographic spread may be real while revenue remains concentrated
        - Request active-site definition, international revenue split, and inactive-site count
    notes: Expansion looks credible, but public data is not yet granular enough to separate broad interest from economically mature, recurring accounts.
    claimRefs: [CU032, CU033, CU034, CU042, CU043, CU044, CU046, CU048, CU049, CU050]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: Maps the typical HistoSonics hospital journey from referral and case review to trained-operator use and repeat local referrals.
    data:
      items:
        - label: Referral and specialist intake
          detail: Liver-tumor patient enters a hospital oncology, HPB surgery, transplant, or interventional-radiology workflow rather than a freestanding office channel.
          claimRefs: [CU004, CU021]
        - label: Multidisciplinary case review
          detail: Tumor board or equivalent review evaluates alternative therapies, ultrasound visibility, and whether histotripsy fits the patient's disease context.
          claimRefs: [CU022, CU024, CU026]
        - label: Payer and coding readiness
          detail: Hospital validates outpatient coding, CMS economics, and plan-specific policy criteria before scaling referrals.
          claimRefs: [CU023, CU030, CU031, CU034]
        - label: Training and credentialing
          detail: HistoSonics-required physician training and local workflow setup create a post-purchase gating step before routine use.
          claimRefs: [CU027, CU028, CU048]
        - label: First outpatient treatment
          detail: Most customer-side releases frame the procedure as same-day or outpatient care with minimal downtime.
          claimRefs: [CU025, CU041]
        - label: Repeat use and local access loop
          detail: Community and regional systems use first-case success to keep patients closer to home and, in some sites, to enable repeat treatment of new or multiple tumors.
          claimRefs: [CU038, CU049]
    approximationNotes: The journey map synthesizes repeated workflow patterns across public customer releases and payer policy rather than depicting a single disclosed internal playbook.
    claimRefs: [CU021, CU022, CU023, CU024, CU025, CU026, CU027, CU028, CU030, CU031, CU034, CU038, CU041, CU048, CU049]
