  evidenceGaps:
    - type: missing-source
      severity: material
      topic: utilization-gap
      missingEvidence: "Site-level procedure counts, ramp curves, and active-versus-idle installed-site disclosures are not public for most named providers."
      whyItMatters: "Without site-level utilization, the difference between a reference install and a productive recurring account remains unclear."
      diligencePath: "Request monthly procedures per site, installed-base utilization, and definitions for active versus inactive accounts in diligence."
      relatedQuestionRefs: [QU016, QU025]
      relatedTableRefs: [TU004]
    - type: private-evidence-only
      severity: material
      topic: retention-gap
      missingEvidence: "NRR, GRR, renewal rates, churn reasons, and contract duration are not disclosed in the reviewed public materials."
      whyItMatters: "Retention is central to underwriting the durability of a capital-plus-procedure platform and cannot be inferred cleanly from first-case press releases."
      diligencePath: "Ask management for renewal cohorts, de-install history, service-contract terms, and any internal customer-satisfaction tracking."
      relatedQuestionRefs: [QU017, QU025]
      relatedTableRefs: [TU004]
    - type: private-evidence-only
      severity: material
      topic: concentration-risk
      missingEvidence: "No public source breaks out revenue concentration by top hospital account, top state, or top payer policy footprint."
      whyItMatters: "A broad directory can coexist with concentrated revenue if only a few centers generate repeat procedures or if payer wins are clustered geographically."
      diligencePath: "Request top-10 account concentration, revenue by site vintage, and procedure mix by payer and geography."
      relatedQuestionRefs: [QU019, QU025]
      relatedTableRefs: [TU005]
    - type: enumeration-incomplete
      severity: minor
      topic: named-customer-proof-table
      missingEvidence: "The named customer proof table captures only accounts with fetched launch narratives and does not enumerate every directory-listed provider."
      whyItMatters: "Without a full site-by-site deployment audit, investors cannot separate publicly named first movers from the broader long tail of listed providers."
      diligencePath: "Request a complete installed-base roster with first-case dates, active status, and whether each listed provider has treated at least one patient."
      relatedQuestionRefs: [QU006, QU016, QU025]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: minor
      topic: international-mix
      missingEvidence: "The directory shows non-U.S. providers, but public sources do not disclose international revenue, procedure volume, or commercialization terms."
      whyItMatters: "International listings improve signaling, but investors cannot tell whether they are meaningful contributors to current customer economics."
      diligencePath: "Ask for international installed-base counts, revenue mix, and whether any non-U.S. sites are active revenue-producing accounts."
      relatedQuestionRefs: [QU004, QU025]
      relatedTableRefs: [TU001, TU005]
