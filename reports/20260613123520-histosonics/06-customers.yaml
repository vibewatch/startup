runDate: '2026-06-13'
company:
  name: HistoSonics
chapter:
  number: 6
  title: Customers
  summary: >-
    HistoSonics has credible but still concentrated customer proof: as of the run date its provider directory showed roughly 80 listed provider entries, and customer-side releases confirm both academic and community-system adoption through first-patient and first-in-state launches. The motion is still hospital-centric and bounded by liver-only indication, training, tumor-board selection, and restrictive payer criteria, while public sources still do not disclose renewal, utilization, or concentration metrics.
sections:
  - id: buyer-profile-and-segmentation
    title: Buyer profile and customer segmentation
    body: >-
      HistoSonics' public customer surface is unmistakably provider-centric. The run-date provider directory is composed almost entirely of hospitals, health systems, cancer institutes, transplant programs, and academic medical centers rather than freestanding office settings, which implies the buyer is usually a hospital service line or capital committee rather than an individual physician practice. Across named releases, the operational users are most often interventional radiology, surgical oncology, hepatobiliary surgery, transplant oncology, and multidisciplinary liver-care teams. The payer layer sits outside the provider in a more complicated way: hospital customers must navigate outpatient reimbursement, payer policy, and patient-selection rules before the clinical workflow converts into repeat procedural volume.

      The public footprint is also broader than a single academic-launch story. The directory contains leading university and quaternary centers such as Johns Hopkins, Columbia, UCSF, UChicago, and University of Michigan, but it also lists community and regional systems such as Allina, Hoag, Providence, Orlando Health, and Sarasota Memorial. That mix matters because it suggests HistoSonics is selling into both prestige reference accounts and practical regional delivery networks that want to keep liver-tumor patients close to home. Even so, the customer set still looks like a hospital-channel market, not a broad ambulatory or office-based one, so budgeting, service-line sponsorship, and procedural economics are likely central to every sale.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU019, CU020, CU044]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: named-proof-and-adoption
    title: Named proof and academic-versus-community adoption
    body: >-
      The named proof set shows real adoption, but it is uneven in depth. HistoSonics' own post-clearance launch release identified University of Rochester Medical Center and Cleveland Clinic as the first standard-clinical-practice partners after De Novo clearance, which is stronger evidence than a simple logo because it ties the account to real patients and specific case descriptions. Since then, customer-side announcements have widened the proof set: Hoag publicized outpatient use in 2024; Allina described the first Twin Cities procedure in late 2025 and a fuller 2026 rollout narrative; Hackensack, ECU Health, UofL Health, Johns Hopkins, Good Shepherd, Sutter CPMC, and UVA Health all published 2025-2026 releases describing first-state, first-region, or first-system milestones. Vanderbilt adds a rarer maturity marker by disclosing its 100th histotripsy procedure by February 2026.

      The more important analytical point is that adoption is not limited to academic medical centers. Johns Hopkins, U-M Health, UofL Health, Vanderbilt, UVA, ECU/Brody, and Jersey Shore University Medical Center provide the academic and tertiary-care side of the story, while Hoag, Good Shepherd, Allina, and Sutter CPMC show that regional and community-oriented systems are also willing to invest. Still, public proof remains concentrated in launch-style press coverage: a handful of marquee accounts explain most of what outsiders can verify about actual clinical use. The directory is broad, but the deepest independently visible evidence still comes from a smaller set of first-patient, first-in-state, and occasional repeat-use milestone references.
    claimRefs: [CU007, CU008, CU009, CU010, CU011, CU012, CU013, CU014, CU015, CU016, CU017, CU018, CU019, CU020, CU043, CU051, CU052]
    tableRefs: [TU003, TU006]
    figureRefs: [FU003]
  - id: workflow-reimbursement-and-sales-cycle
    title: Treatment workflow, reimbursement, and sales-cycle implications
    body: >-
      Public sources describe a fairly specific customer workflow. The device is sold into hospital liver programs where patients are screened through multidisciplinary review, assessed for ultrasound visibility and tumor burden, and then scheduled for a trained-operator procedure that is commonly framed as outpatient or same-day care. Johns Hopkins' treatment page says candidates typically have tumors under 4 cm, three or fewer lesions, and favorable anatomy; it also says treatment itself runs about 10 to 90 minutes after anesthesia and usually totals about 1.5 to 2 hours with same-day discharge. Allina gives a similar total-duration estimate and says histotripsy can be used alongside chemotherapy or radiation, while Cleveland Clinic frames it as safe and effective for inoperable liver tumors but not the best fit for all liver cancers. Anthem's policy is even narrower, limiting medically necessary use to liver tumors when other therapies are unavailable or unsuitable and when no more than three tumors of 3 cm or less are treated. Sutter, Hackensack, and Cleveland Clinic authors all reinforce some version of tumor-board or multidisciplinary selection.

      Those facts matter because they make the customer journey longer than a simple capital placement. A provider needs service-line sponsorship, physician training, patient-selection pathways, coding and reimbursement confidence, and enough eligible patients to justify ongoing use. On the positive side, CMS increased outpatient payment for liver-tumor histotripsy to $17,500, AAPC lists a dedicated 0686T code, BCBS Michigan and Elevance both expanded coverage, multiple hospital releases emphasize same-day discharge and low recovery burden, and Michigan Medicine highlights real-time bubble-cloud visualization plus potential combination with systemic therapy. Focused Ultrasound Foundation coverage of HOPE4LIVER adds a useful onboarding datapoint by noting that no trial site had prior histotripsy experience before the study. On the negative side, payer coverage is still condition-specific rather than universal, training remains operator-gated, and larger or poorly visualized tumors may still need adjunct chemotherapy, immunotherapy, or alternative local treatment. That combination points to a meaningful but deliberate hospital sales cycle.
    claimRefs: [CU021, CU022, CU023, CU024, CU025, CU026, CU027, CU028, CU029, CU030, CU031, CU032, CU033, CU034, CU048, CU053, CU054, CU055, CU056, CU057]
    tableRefs: [TU002]
    figureRefs: [FU002]
  - id: durability-and-satisfaction-proxies
    title: Durability, repeat-use proxies, and satisfaction evidence gaps
    body: >-
      The public record is stronger on early clinical proof than on durable commercial retention. Clinical publications provide real support for safety and efficacy: the 2024 pivotal HOPE4LIVER publication reported 44 treated participants across 14 sites with 95% technical success and 7% major complications within 30 days, the 2025 one-year update reported 47 patients and 52 treated tumors with 90% post-hoc local control, and the first-in-human THERESA study reported no device-related adverse events through eight weeks in eight patients. Focused Ultrasound Foundation's trial summary adds that no HOPE4LIVER site had prior histotripsy experience, which is a useful proxy for an achievable learning curve at new centers. Customer-side releases also repeatedly emphasize same-day discharge, minimal downtime, vessel sparing, and compatibility with adjunct therapies. Vanderbilt provides one of the few public repeat-use milestones by reporting its 100th histotripsy procedure, while Good Shepherd adds another useful repeat-use proxy by stating that one session can treat multiple tumors and that the procedure can be repeated without lifetime limits.

      What is missing is classic commercial durability data. No reviewed public source disclosed NRR, GRR, churn, renewal rates, contract length, or site-level utilization for most named accounts. Most releases prove that a site acquired the system or treated a first patient, but they do not prove repeat monthly procedure volume, durable economics, or multi-year account expansion. Satisfaction evidence is similarly indirect: public sources are rich in clinical-recovery and workflow language, but they do not provide provider NPS, purchaser references on renewals, or longitudinal account-retention statistics. The right conclusion is that public satisfaction and retention proxies are positive, but they are still proxies rather than resolved commercial facts.
    claimRefs: [CU035, CU036, CU037, CU038, CU039, CU040, CU041, CU047, CU050, CU051, CU057]
    tableRefs: [TU004]
  - id: concentration-and-geographic-implications
    title: Concentration risk, geographic spread, and underwriting implications
    body: >-
      The provider footprint is geographically broad enough to demonstrate national interest. The run-date directory spans at least 29 U.S. states and also lists sites in the United Kingdom, Hong Kong, and the United Arab Emirates. Regional announcements from ECU Health, Good Shepherd, Allina, UVA, UofL, and Vanderbilt show that demand is not confined to a few coastal flagships; hospitals in eastern North Carolina, Oregon, Minnesota, Virginia, Kentucky, and Tennessee all used the product as a way to keep liver-tumor patients closer to home or to expand a regional cancer program. That supports the idea that HistoSonics can sell beyond elite university hospitals if coverage, training, and clinical champions line up.

      But the public proof surface is still concentrated. One flagship reference account, U-M Health, explicitly discloses institutional and researcher financial interests in HistoSonics, which reduces its independence as an external proof point. More broadly, the deepest public evidence still comes from a limited set of launch accounts and hospital newsrooms rather than from disclosed recurring-utilization data or a diversified list of referenceable, economically mature customers. Coverage is widening, but still tightly bounded by liver indications and selection criteria, and provider-directory inclusion alone does not prove durable revenue at each site. For investors, that means customer demand is real, geographic spread is improving, and sales momentum appears credible, but concentration and retention remain open diligence items.
    claimRefs: [CU032, CU033, CU042, CU043, CU044, CU045, CU046, CU047, CU049, CU050, CU052]
    tableRefs: [TU005]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale
      - Revenue / strategic value
      - Gap
    rows:
      - - Academic medical center / quaternary liver program
        - "Buyer: cancer-center or service-line capital committee; User: interventional radiology, surgical oncology, transplant teams; Payer: hospital plus payer authorization"
        - Introduce non-invasive liver-tumor ablation and bridge complex patients to broader oncology pathways
        - Strong public references including Johns Hopkins, U-M, UofL, ECU, and JSUMC
        - High reference value and likely strongest early-training sites
        - Public sources rarely disclose procedure volume or contract economics by site
      - - Community / regional nonprofit health system
        - "Buyer: hospital administration and oncology leadership; User: IR and surgical oncology; Payer: hospital outpatient reimbursement"
        - Keep patients local with same-day liver-tumor treatment
        - Visible in Allina, Hoag, Good Shepherd, and regional systems on the directory
        - Important proof that adoption can move beyond university flagships
        - First-case announcements do not prove durable utilization
      - - Advanced organ / transplant oncology program
        - "Buyer: specialty program leadership; User: transplant surgery and liver teams; Payer: hospital with payer review"
        - Add bridge-to-transplant or vessel-sparing liver therapy inside complex programs
        - Explicit in Sutter CPMC and Rochester launch narratives
        - Strategic because it embeds Edison in high-acuity referral networks
        - Referral economics and repeat-case cadence are not public
      - - Interventional-radiology-led outpatient tumor program
        - "Buyer: procedural service line; User: IR physicians and anesthesia support; Payer: outpatient coding plus plan policy"
        - Same-day ablation for eligible liver tumors under ultrasound guidance
        - Recurrent theme across Hopkins, Allina, Hoag, ECU, and UofL releases
        - Aligns with CMS outpatient payment and minimally invasive positioning
        - Candidate eligibility is narrow and operator training is mandatory
      - - Rural or access-expansion site
        - "Buyer: regional hospital leadership; User: local oncology and IR teams; Payer: mixed commercial and Medicare population"
        - Offer advanced liver care closer to home in under-served regions
        - Good Shepherd and ECU explicitly use this narrative
        - Supports demand outside traditional academic hubs
        - Rural referral depth and payer mix are undisclosed
      - - International and cross-border reference sites
        - "Buyer: tertiary hospital leadership; User: specialist liver teams; Payer: local health system or mixed"
        - Extend histotripsy footprint beyond the initial U.S. launch
        - Directory lists Cambridge, Hong Kong, and UAE sites
        - Useful as global signaling for future commercialization
        - Public sources do not disclose international revenue or procedure mix
    notes: Public segmentation is derived from the provider directory and named hospital releases; rows describe visible account archetypes, not disclosed revenue cohorts.
    claimRefs: [CU001, CU002, CU003, CU004, CU019, CU020, CU021, CU044, CU049]
