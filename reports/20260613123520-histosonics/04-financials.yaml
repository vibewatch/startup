- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact on underwriting
  - Why public evidence is insufficient
  - Exact diligence path
  rows:
  - - Revenue by stream and recurring mix
    - Cannot judge revenue quality or mix shift from placements to repeat usage
    - No public revenue, ARR, or recurring-share disclosure in retrieved set
    - Request monthly revenue bridge by device, service, and any per-procedure or recurring stream
  - - Realized Edison ASP and discounting
    - Cannot estimate gross profit per placement or customer concentration risk
    - Public materials never disclose list or realized system pricing
    - Request price realization report by customer segment and geography
  - - Cash, burn, and runway
    - Cannot underwrite capital adequacy or next-round timing
    - Financing announcements omit post-close cash and burn figures
    - Request monthly cash waterfall, operating plan, and board runway deck
  - - Debt / credit schedule
    - Cannot assess covenant pressure or downside seniority
    - No HistoSonics debt disclosure appears in retrieved public set
    - Request debt agreements, equipment financing, lease obligations, and covenants
  - - Site-level throughput and utilization
    - Cannot convert adoption headlines into durable recurring economics
    - Directory and hospital PRs show breadth, not procedures per mature site
    - Request quarterly procedures, revenue, and margin by site cohort
  - - CAC / sales cycle / implementation cost
    - Cannot judge whether expansion is efficient or merely capital hungry
    - No public disclosure on selling cost, training burden, or conversion cycle
    - Request funnel metrics from lead to live site plus implementation labor cost
  notes: 'Each missing metric directly blocks a different part of underwriting: revenue quality, margin durability, runway, or dilution risk.'
