- id: debt-credit-and-peer-capital-intensity
  title: Debt, credit, and peer capital-intensity implications
  body: |-
    There is no public debt or credit disclosure for HistoSonics in the retrieved set, but peer disclosures help frame what a maturing non-invasive therapy platform can require. Profound Medical’s first-quarter 2026 release shows a comparatively small public focused-ultrasound peer with $5.3 million of quarterly revenue, 72% gross margin, roughly $50.3 million of cash, and about $4.5 million of long-term debt, while its installed base stood at 80 systems and same-store annualized procedures reached 45.2 per active site. The Focused Ultrasound Foundation separately noted EDAP’s €36 million EIB credit facility to support Focal One growth. Those peers show that debt and cash disclosure become part of the normal underwriting toolkit once a platform is public and scaling, even before dominant market share exists.

    HistoSonics sits at a reported $2.25 billion private valuation, far above the public market caps cited here for AngioDynamics, Profound, and EDAP. That premium may reflect category leadership, first-mover regulatory status, and investor belief in a larger multi-organ opportunity. But it also increases the burden of proof. At that valuation, investors need evidence that install-base growth, reimbursement wins, and clinical expansion will convert into durable gross profit rather than repeated capital raises. Without HistoSonics-specific cash, debt, revenue, or margin disclosure, the peer set is useful only as a caution: public-market comparables show that commercial-stage device platforms still live and die on throughput, gross margin, and balance-sheet discipline.
