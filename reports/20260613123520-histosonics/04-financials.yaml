- id: reimbursement-install-base-and-unit-economics-proxies
  title: Reimbursement, install-base traction, and unit-economics proxies
  body: |-
    The strongest financial proof points around HistoSonics are reimbursement and adoption proxies, not disclosed income statements. CMS raised the outpatient payment rate for CPT 0686T from $12,500 to $17,500, and HistoSonics later announced an Elevance policy covering 45.4 million members across 14 states. Those two facts matter because they reduce one of the biggest commercialization frictions for hospital capital equipment: uncertainty over whether physicians and facilities can get paid. They do not prove HistoSonics’ own realized revenue, but they make procedure throughput more financeable for customer sites and should improve the willingness of centers to commit to Edison installation and training.

    Adoption evidence is similarly broad but still proxy-level. The company’s provider directory was updated on the run date and shows a footprint across major U.S. centers plus selected international locations. Customer announcements add local proof: first procedures in the Twin Cities, Kentucky, and eastern North Carolina; first Oregon installation; only the third New Jersey site. Clinical workflow descriptions also hint at cost structure. Hopkins describes general anesthesia and several-hour outpatient cases, Hoag emphasizes same-day discharge, while Sutter describes an overnight stay. That mix implies HistoSonics sells into a capital-intensive, hospital-integrated workflow where reimbursement progress and site throughput matter more than simple device shipment counts.
