- id: FI004
  title: Capital intensity / cash-flow map
  type: matrix
  layout: wide
  summary: Cash-demand map showing which HistoSonics growth motions are visible publicly and why each still implies financing dependency absent disclosed cash generation.
  data:
    columns:
    - Public evidence
    - Near-term cash effect
    - Financing implication
    rows:
    - label: U.S. liver commercialization
      values:
      - Broad provider rollout plus reimbursement gains
      - High sales, training, and implementation spend before steady throughput
      - Needs proof that installed sites ramp fast enough to self-fund expansion
    - label: New-organ indications
      values:
      - Kidney, pancreas, and prostate repeatedly cited
      - Clinical, regulatory, and market-access spend arrives before revenue
      - Raises dependence on sponsor capital if timelines slip
    - label: International expansion
      values:
      - Directory includes UK, Hong Kong, UAE and company cites global markets
      - Launch, distributor, and support costs likely precede disclosure of revenue
      - Can lengthen payback if local reimbursement lags
    - label: Balance-sheet visibility
      values:
      - No public cash, burn, or debt schedule
      - Investors cannot measure runway or covenant pressure
      - Another raise could come before outsiders can model it
    - label: Peer benchmark
      values:
      - Profound and EDAP show cash/debt disclosure once public
      - Comparable platforms still require balance-sheet discipline
      - HistoSonics will need similar transparency to justify its premium valuation
  approximationNotes: Cells are qualitative because HistoSonics does not disclose budget allocation, cash balance, or site-level revenue conversion.
