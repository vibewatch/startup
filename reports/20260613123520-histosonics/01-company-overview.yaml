  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "HistoSonics is a privately held histotripsy company commercializing the FDA-cleared Edison system for liver tumors while trying to widen the platform into kidney and other indications. Public evidence supports a University of Michigan scientific origin, a 2009-2010 commercialization window, a $102 million Series D in 2024, a roughly $2.25 billion majority acquisition in 2025, and a further $250 million growth financing shortly afterward. The main underwriting gaps are still governance transparency, revenue and customer disclosure, exact run-date headcount, and the durability of outcomes outside early liver cohorts."
  },
  "sections": [
    {
      "id": "identity-and-origin",
      "title": "Identity, headquarters, and scientific origin",
      "body": "HistoSonics presents as a private medical-device company built around histotripsy, a non-invasive focused-ultrasound therapy that mechanically liquefies targeted tissue rather than burning it. The company’s own about, technology, science, and careers pages collectively frame Edison as the first commercial platform while showing a multi-site operating footprint in Plymouth/Minneapolis, Ann Arbor, and Madison. The most reusable origin story is that histotripsy was developed at the University of Michigan beginning in 2001 and commercialized through HistoSonics around 2009, though one memorial source describes Charles Cain as co-founding the company in 2010. That discrepancy is small but worth preserving because it suggests a commercialization window rather than a single universally cited incorporation date. Publicly, the company looks Minnesota-based for headquarters and commercialization purposes, yet its scientific identity is inseparable from University of Michigan inventors, labs, and clinical collaborators.",
