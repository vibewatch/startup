    {
      "id": "commercialization-and-adoption",
      "title": "Commercial rollout, reimbursement, and provider footprint",
      "body": "Commercial evidence shows that HistoSonics has moved beyond a pure R&D story, but the best traction remains concentrated in liver treatment and reference-center adoption. The 2025 acquisition press release said more than 2,000 patients had already been treated at over 50 leading U.S. medical centers, with another 50 system installations planned by year-end. Michigan Engineering later pushed the operating picture further to 100 installed systems globally and nearly 3,000 treated patients, while the provider directory on run date lists a broad spread of U.S. sites plus the U.K., Hong Kong, and the UAE. Hospital announcements from Michigan Medicine, Allina, and Johns Hopkins show that real institutions are integrating the platform into clinical workflow rather than merely participating in a trial. Reimbursement momentum has also improved: CMS payment, CPT coding, Blue Cross decisions, and Elevance coverage for 45.4 million members all reduce one major adoption barrier. The remaining commercialization caution is that revenue, customer concentration, and per-site utilization still are not publicly disclosed.",
