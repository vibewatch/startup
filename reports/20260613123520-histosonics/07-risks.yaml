      "id": "financial-opacity-valuation-and-kill-criteria",
      "title": "Financial Opacity, Valuation, and Kill Criteria",
      "body": "Financially, HistoSonics looks like a capital-intensive device platform still proving the slope of its commercialization curve. The company needed a $102 million Series D in 2024, third-party coverage says it raised more than $300 million by 2025, and the private-market narrative then jumped to a $2.25 billion transaction value. That sequence can be read as strength, but it can also be read as evidence that scale still depends on continuous capital and on investors underwriting future indication expansion rather than current disclosed revenue. The exit trail is not clean either: adverse reporting around the 2025 sale process highlights no-deal risk and an IPO backdrop softened by market volatility. Public comparables such as Profound, EDAP, and AngioDynamics trade at much lower market capitalizations, so any underwriting case for HistoSonics must assume materially better growth or strategic scarcity than the public set reflects today. The discipline answer is not to dismiss the company, but to bind diligence to explicit kill criteria around longer-term outcomes, reimbursement conversion, install velocity, and proof that valuation is being earned rather than merely marked.",
