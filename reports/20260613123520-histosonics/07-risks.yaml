      "id": "reimbursement-adoption-and-hospital-bottlenecks",
      "title": "Reimbursement, Adoption, and Hospital Bottlenecks",
      "body": "Reimbursement progress is real, but the fetched evidence does not support treating it as solved. HistoSonics has a liver payment pathway and coding infrastructure, while CMS also created a kidney IDE code for investigational use, yet CMS explicitly states that payment codes do not themselves guarantee coverage. That distinction matters because hospitals still need MAC-level or payer-level medical-necessity support and because commercial coverage remains selective rather than universal. The company\u2019s own covered-lives announcement names one large commercial milestone, not a mature national reimbursement fabric. The hospital-adoption record shows similar friction. Michigan Medicine\u2019s purchase required pooled institutional budgets and philanthropy, and the same source notes general anesthesia plus the continued need for chemo or immunotherapy in some larger or metastatic cases. HistoSonics\u2019 own training materials describe a long implementation sequence that extends beyond a single operator to patient selection, procedure simulations, staff training, initial case support, and optimization. That is manageable, but it is not plug-and-play.",
