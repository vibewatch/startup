      "id": "risk-overview-and-priority-stack",
      "title": "Risk Overview and Priority Stack",
      "body": "HistoSonics has real momentum, but the fetched evidence still points to a classic medtech scale-up risk stack rather than a fully de-risked platform story. The current revenue path is tied to one cleared product, one cleared organ, and a hospital-capex installation model that requires multidisciplinary workflow change, physician training, and reimbursement support before usage becomes durable. The evidence base is promising rather than complete: published liver studies show strong technical success and acceptable early safety, yet the 1-year paper also shows a meaningful spread between primary-assessment and post hoc local-control rates, while official labeling still says FDA has not evaluated disease-specific or long-term survival outcomes. On top of that, current adoption economics still run through CMS coding, payer coverage, and site-by-site implementation, while the newest valuation markers are coming from private transactions rather than from public-market revenue scale. The right ranking therefore puts clinical durability and comparative evidence first, reimbursement and coding dependence second, hospital implementation and training third, regulatory expansion and global scaling fourth, and valuation discipline plus disclosure opacity fifth.",
