  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              The cleanest market-clearing reference in public evidence is the August 2025 management-led majority
              acquisition that valued HistoSonics at approximately $2.25 billion, followed only two months later by an
              oversubscribed $250 million financing led by the new ownership group. That combination matters more than
              generic venture enthusiasm because it shows both a priced control transaction and immediate post-deal
              willingness by the same backers to add capital rather than wait for a public listing. At the same time,
              the evidence does not show public revenue, gross margin, system utilization, backlog conversion, or
              liquidation preference detail, so investors cannot underwrite the mark with the same transparency
              available for public device peers. The valuation therefore reads as fair for existing strategic and
              crossover owners who may value category leadership and optionality across multiple organs, but
              full-to-slightly-stretched for fresh outside capital that only sees the disclosed facts. The disciplined
              posture is Track / Research More, not Buy, unless new disclosure materially reduces the economics and
              structure gap.
