      - number: '1.2'
        title: Product, indication scope, and technical positioning
        blocks:
          - type: paragraph
            body: >-
              The Edison system is best understood as a platform therapy rather than a one-off liver device. Official
              technology and science materials emphasize pulsed sound energy, real-time visualization, and a non-thermal
              mechanism that can spare vessels and surrounding tissue. FDA and PubMed sources corroborate that the
              currently cleared use is liver tumors, including unresectable tumors, while clinical development is
              already pushing into kidney, pancreas, prostate, and other sites. The clinical record is promising but not
              fully mature. THERESA showed feasibility and no device-related adverse events in a very small
              first-in-human cohort, while the one-year HOPE4LIVER update reported meaningful local control alongside
              six serious device-related effects within 30 days and explicitly favorable but still early survival
              comparisons. That mix matters for diligence: HistoSonics has real regulatory and clinical traction, but
              later chapters should treat long-term outcome durability and indication expansion as still-developing
              rather than settled facts.
