  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Liver adoption stalls
        - Provider footprint grows but public evidence stops showing material patient-volume expansion
        - Undercuts the category-leader growth case supporting the platform premium
        - Shift stance toward stretched and revisit bear case
      - - Payer expansion plateaus
        - No meaningful follow-through after CMS, CPT, and Elevance wins
        - Reduces confidence that installed systems become economically productive
        - Treat reimbursement as a bottleneck, not a tailwind
      - - Kidney program slips
        - Regulatory progress or clinical read-through from HOPE4KIDNEY slows materially
        - Damages the second-indication optionality embedded in premium valuation
        - Narrow valuation band closer to liver-only medtech comps
      - - Weak economics become visible
        - Disclosed revenue, utilization, or gross margin materially undershoot implied expectations
        - Shows the public comp gap cannot be bridged by current commercial performance
        - Require discount before any new capital deployment
      - - Strategic-exit appetite fades
        - No renewed sale/IPO momentum after 2025 strategic discussion
        - Limits near-term exit optionality at premium valuations
        - Extend hold period assumptions and lower return expectations
      - - Investor structure proves heavy
        - Preference stack or control terms materially subordinate new-money returns
        - Can make an apparently fair headline valuation unattractive on an outcome basis
        - Do not invest without cap-table cleanup or compensating price discount
    notes: Triggers focus on monitorable events that would change valuation stance rather than generic operating risk.
