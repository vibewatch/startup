  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and current workflow in customer terms
        blocks:
          - type: paragraph
            body: >-
              The Edison system is sold into hospital and cancer-center workflows as a non-invasive liver-tumor ablation
              platform rather than as a general ultrasound capital good. Public product pages, FDA materials, and
              provider announcements all describe the same practical sequence: a multidisciplinary team selects an
              appropriate liver-tumor case, the patient is positioned and anesthetized, physicians use ultrasound
              imaging to target the lesion, the system generates a histotripsy bubble cloud to mechanically liquefy
              tissue, and the patient typically completes treatment on an outpatient or short-stay basis. This makes
              Edison a procedural service-line product that depends on radiology, oncology, surgery, anesthesia, and
              imaging coordination inside the hospital. The current commercial indication remains liver tumors,
              including unresectable tumors, so the product should be underwritten today as a liver-program platform
              with adjacent pipeline options rather than as a broad multi-organ oncology franchise already in market.
