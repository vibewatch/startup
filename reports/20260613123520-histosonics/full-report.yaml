      - number: '7.2'
        title: Clinical, Regulatory, and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              The regulatory base is narrower than the broad company narrative. FDA cleared Edison only for non-invasive
              destruction of liver tumors and attached explicit special controls around clinical testing, non-clinical
              validation, software, human factors, and labeling. FDA also requires the label to state that the device
              has not been evaluated for any specific disease or condition and official company disclaimers repeat that
              local tumor progression, five-year survival, and overall survival remain unevaluated endpoints. That does
              not invalidate the liver clearance, but it does mean the strongest public data set is still early-stage
              relative to the commercial ambition. The HOPE4LIVER publications support technical success and manageable
              early safety, yet the 1-year update introduces durability ambiguity because primary and post hoc
              local-control rates diverge materially. Kidney expansion is therefore not a mere commercial add-on; it is
              a fresh regulatory campaign with investigational status, trial enrollment risk, and a new evidence burden.
              Legally, the public patent list shows meaningful portfolio activity, but it does not answer
              freedom-to-operate, licensing, or litigation-risk questions on its own.
