            body: >-
              HistoSonics' public customer surface is unmistakably provider-centric. The run-date provider directory is
              composed almost entirely of hospitals, health systems, cancer institutes, transplant programs, and
              academic medical centers rather than freestanding office settings, which implies the buyer is usually a
              hospital service line or capital committee rather than an individual physician practice. Across named
              releases, the operational users are most often interventional radiology, surgical oncology, hepatobiliary
              surgery, transplant oncology, and multidisciplinary liver-care teams. The payer layer sits outside the
              provider in a more complicated way: hospital customers must navigate outpatient reimbursement, payer
              policy, and patient-selection rules before the clinical workflow converts into repeat procedural volume.

              The public footprint is also broader than a single academic-launch story. The directory contains leading
              university and quaternary centers such as Johns Hopkins, Columbia, UCSF, UChicago, and University of
              Michigan, but it also lists community and regional systems such as Allina, Hoag, Providence, Orlando
              Health, and Sarasota Memorial. That mix matters because it suggests HistoSonics is selling into both
              prestige reference accounts and practical regional delivery networks that want to keep liver-tumor
              patients close to home. Even so, the customer set still looks like a hospital-channel market, not a broad
              ambulatory or office-based one, so budgeting, service-line sponsorship, and procedural economics are
              likely central to every sale.
