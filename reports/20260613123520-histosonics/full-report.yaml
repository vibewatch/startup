  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and disclosure gaps
        blocks:
          - type: paragraph
            body: >-
              HistoSonics’ public revenue model is visible only in outline, not in audited numbers. The company appears
              to monetize the Edison platform first through system placement into liver-tumor centers and then through
              reimbursable procedure activity once a site is live. The evidence set supports that liver is the
              commercial beachhead: company and FDA materials keep describing liver as the cleared indication, while
              kidney remains tied to investigational or pre-commercial coding pathways. AAPC’s 0686T descriptor and the
              CMS payment update show the revenue event at the procedure layer, but none of the retrieved public
              materials disclose a list price for the system, realized ASPs, service-contract economics, consumables, or
              a revenue-recognition policy.


              That leaves Financials with a clear mechanism but a weak ledger. The mechanism is equipment-plus-procedure
              adoption, supported by reimbursement and provider rollout. The ledger is still opaque: no public revenue,
              ARR, margin, or cohort data appears in the fetched set. As a result, underwriting has to separate what is
              knowable from what is merely plausible. Knowable today: the company has a reimbursable liver procedure,
              broadening payer support, and an expanding provider base. Not knowable today: how much Edison placements
              contribute upfront, whether recurring revenue is material, what portion of economics belongs to the
              hospital versus HistoSonics, or whether recurring gross profit improves after the initial install.
            claimRefs:
