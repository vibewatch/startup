      - number: '2.3'
        title: Buyer, user, payer, and capital-equipment workflow
        blocks:
          - type: paragraph
            body: >-
              The buyer is institutional, not consumer. Public launch pages and the provider directory show Edison being
              adopted inside interventional-radiology, surgical-oncology, hepatobiliary, transplant, and cancer-center
              service lines. In practice, the economic buyer is likely a hospital capital committee or service-line
              sponsor that can justify equipment acquisition; the clinical users are trained physicians operating inside
              radiology or oncology workflows; and the payer stack begins with procedure coding/payment and then
              broadens to payer-policy coverage. Procedure reimbursement has improved with CPT 0686T and the CMS
              outpatient payment increase to $17,500, while admitted cases can still rely on DRG logic. Commercial
              coverage remains less mature but no longer hypothetical, as Elevance issued a positive 14-state medical
              policy in 2025. Adoption workflow also appears multidisciplinary: hospitals describe tumor- board review,
              department housing decisions, physician training, launch publicity, and then gradual expansion to same-day
              or short-stay treatment pathways. That combination makes HistoSonics more analogous to a capital
              medical-device sale into complex provider systems than to a simple per-procedure consumables business.
