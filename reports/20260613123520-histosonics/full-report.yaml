  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and scientific origin
        blocks:
          - type: paragraph
            body: >-
              HistoSonics presents as a private medical-device company built around histotripsy, a non-invasive
              focused-ultrasound therapy that mechanically liquefies targeted tissue rather than burning it. The
              company’s own about, technology, science, and careers pages collectively frame Edison as the first
              commercial platform while showing a multi-site operating footprint in Plymouth/Minneapolis, Ann Arbor, and
              Madison. The most reusable origin story is that histotripsy was developed at the University of Michigan
              beginning in 2001 and commercialized through HistoSonics around 2009, though one memorial source describes
              Charles Cain as co-founding the company in 2010. That discrepancy is small but worth preserving because it
              suggests a commercialization window rather than a single universally cited incorporation date. Publicly,
              the company looks Minnesota-based for headquarters and commercialization purposes, yet its scientific
              identity is inseparable from University of Michigan inventors, labs, and clinical collaborators.
