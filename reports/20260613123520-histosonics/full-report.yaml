  - id: FV001
    title: Recommendation Logic
    type: flow
    layout: standard
    summary: >-
      The recommendation stays cautious because a real transaction and strong clinical momentum are offset by a very
      large public-comp premium and limited economic disclosure.
    data:
      nodes:
        - id: n1
          label: 'Closed anchor: $2.25B August 2025 majority acquisition'
        - id: n2
          label: 'Follow-through: $250M October 2025 financing from the same ownership group'
        - id: n3
          label: 'Proof: FDA-cleared liver platform with published HOPE4LIVER outcomes'
        - id: n4
          label: 'Access: CMS, CPT, and 45.4M-member Elevance coverage expansion'
        - id: n5
          label: 'Comp gap: far above Profound, EDAP, and Angio public valuations'
        - id: n6
          label: 'Blind spots: revenue, margins, utilization, and preference terms undisclosed'
        - id: n7
          label: 'Call: TRACK / RESEARCH MORE; fair-to-slightly-stretched for new money'
      edges:
