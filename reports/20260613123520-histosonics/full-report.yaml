companyProfile:
  summary: >-
    HistoSonics is a private unicorn-stage medtech company commercializing histotripsy, a non-invasive
    focused-ultrasound approach that mechanically destroys targeted tissue rather than burning it. The company traces
    its scientific roots to University of Michigan research, with the strongest public commercialization date anchored
    to 2009, and it now operates around the Edison platform for liver tumors while pushing kidney and other solid-tumor
    expansion. Public evidence supports real commercial traction, including a growing installed base, rising patient
    count, payer progress, a 2025 majority acquisition at approximately $2.25B, and a subsequent $250M financing, but
    public-company-style economic disclosure remains thin.
