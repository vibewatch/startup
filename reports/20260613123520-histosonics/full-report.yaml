      - number: '3.2'
        title: Focused-ultrasound peers are credible, but mostly organ- and workflow-specific
        blocks:
          - type: paragraph
            body: >-
              The closest branding analogues to HistoSonics are not necessarily its closest present liver competitors.
              Profound, EDAP/Focal One, Sonablate, and Insightec all prove that physicians and investors will fund
              non-invasive or minimally invasive energy platforms with strong imaging narratives. But the reviewed pages
              also show that these companies are concentrated in different workflow owners and organ systems. Profound's
              TULSA platform is MRI-guided, robotically driven, transurethral, and prostate-centered, with an 80-system
              installed base reported at the end of Q1 2026. Focal One and Sonablate are also prostate HIFU platforms
              aimed at urologists, using thermal ablation and fusion or feedback tools to spare tissue while treating
              the gland. Insightec is the broadest focused-ultrasound incumbent by brand recognition in this evidence
              set, yet the fetched home page is centered on MRI-guided neuro procedures rather than abdominal oncology.
              The implication is that HistoSonics is not alone in selling precision-energy therapy, but it is
              differentiated in current liver workflow ownership. That differentiation should be treated as a temporal
              advantage, not a permanent moat, because well-capitalized prostate or focused-ultrasound vendors can keep
              expanding indications.
