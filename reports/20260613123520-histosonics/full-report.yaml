  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              HistoSonics' present market boundary is narrower than a generic focused-ultrasound or oncology-robotics
              category. FDA and company labeling restrict Edison today to the non-invasive destruction of liver tumors,
              including unresectable liver tumors, using a non-thermal mechanical focused-ultrasound process; the same
              labeling also says the device is prescription-only, requires sufficient functional liver reserve, and has
              not been evaluated for disease-specific cancer outcomes. That means the included spend today is
              liver-tumor procedural revenue, hospital acquisition and deployment of the Edison system, physician
              training, imaging-guided procedure workflow, and payer reimbursement tied to CPT 0686T or inpatient DRGs.
              Excluded from the current cleared market are kidney, pancreas, prostate, thyroid, and other organ
              applications until separate authorization; general radiation-oncology spend; and consumer wellness
              ultrasound categories. The practical status-quo substitutes are surgery, thermal ablation, SBRT,
              transarterial liver-directed therapies, and watchful waiting or systemic therapy when local treatment is
              not appropriate. Histotripsy therefore sits in a highly specific liver-intervention wedge today, with
              future value tied to indication expansion rather than to immediate participation in all solid-tumor
              treatment spend.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM032
              - CM048
