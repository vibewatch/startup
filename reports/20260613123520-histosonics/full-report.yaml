      - number: '1.5'
        title: Milestones, expansion path, and the main diligence caveats
        blocks:
          - type: paragraph
            body: >-
              The milestone arc is unusually coherent for a private medtech company: academic invention, spinout
              formation, first-in-human validation, FDA De Novo clearance, reimbursement progress, geographic expansion,
              and stepwise adjacent-indication filings. By mid-2026, HistoSonics had added TFDA approval in Taiwan and a
              formal FDA submission for kidney tumors, reinforcing that management is trying to turn one cleared liver
              application into a broader solid-tumor platform. Still, the underwriting case is not frictionless. Hopkins
              explicitly says long-term data are not yet available and that current patient selection remains narrow.
              The HOPE4LIVER one-year update preserved a favorable headline but also recorded six serious device-related
              effects. On the corporate side, public materials remain thin on current revenue, customer count, run-date
              headcount, board composition, and ownership structure, while 2025 sale-process reporting suggests
              management evaluated multiple financing paths before settling on a private transaction. Those are not
              thesis-breakers, but they are the exact gaps later diligence should pursue directly.
