            body: >-
              The public evidence is strong enough to say HistoSonics has real commercial momentum, meaningful
              differentiation, and a better reimbursement story than many early device launches. It is not strong enough
              to say the company has already solved the hardest competitive questions. Public sources remain far richer
              on indication, workflow, and clinical positioning than on capital price, disposables, procedure
              contribution margin, repeat-center utilization, or win-loss rates against surgery, microwave ablation, or
              prostate-focused HIFU programs. That opacity matters because hospitals do not choose between histotripsy
