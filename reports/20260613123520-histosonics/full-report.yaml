      - number: '5.3'
        title: Clinical evidence and why non-thermal differentiation matters
        blocks:
          - type: paragraph
            body: >-
              The strongest public evidence base is still concentrated in liver. THERESA established first-in-human
              feasibility and MRI-confirmed acute technical success in a small multicenter phase I cohort. HOPE4LIVER
              then expanded the evidence base with 44 participants and 49 treated tumors, hitting the co-primary
              performance goals for technical success and low major-complication rates. The one-year update adds useful
              durability context, including reported local-control and survival outcomes, but it also openly notes an
              imaging-interpretation learning curve for this novel modality. That nuance matters because Edison's
              commercial argument is explicitly non-thermal differentiation: review literature contrasts histotripsy
              with radiofrequency ablation, microwave ablation, and stereotactic body radiotherapy, noting the heat-sink
              effect and collateral-injury issues that make vessel-adjacent lesions difficult for thermal approaches.
              Histotripsy's mechanical cavitation and lack of thermal injury are therefore not just marketing
              adjectives; they are the core clinical rationale for why centers adopt the platform for selected liver
              cases. Company and foundation follow-up releases add market-adoption context to the academic publications:
              by 2026, HistoSonics and the Focused Ultrasound Foundation were publicly describing 12-month HOPE4LIVER
              results with 90% local tumor control and reporting that more than 1,000 liver-tumor patients had been
              treated post-clearance. That does not replace peer-reviewed evidence, but it does show the platform moving
              beyond a purely experimental installed base.
