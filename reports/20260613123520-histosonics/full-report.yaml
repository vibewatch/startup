      - - Commercial scale
        - Revenue, gross margin, utilization, and backlog conversion by installed system
        - Needed to compare HistoSonics to public comps on more than narrative
        - Request audited management reporting and cohort analysis
      - - Payer realization
        - Paid-procedure volume by payer and state after CMS and Elevance wins
        - Coverage announcements may not translate into realized reimbursement
        - Request claims data and reimbursement collections analysis
      - - Kidney economics
        - Expected timeline, pricing, and adoption assumptions for the kidney launch
        - Second-indication optionality is central to bull-case support
