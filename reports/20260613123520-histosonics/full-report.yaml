      - number: '6.5'
        title: Concentration risk, geographic spread, and underwriting implications
        blocks:
          - type: paragraph
            body: >-
              The provider footprint is geographically broad enough to demonstrate national interest. The run-date
              directory spans at least 29 U.S. states and also lists sites in the United Kingdom, Hong Kong, and the
              United Arab Emirates. Regional announcements from ECU Health, Good Shepherd, Allina, UVA, UofL, and
              Vanderbilt show that demand is not confined to a few coastal flagships; hospitals in eastern North
              Carolina, Oregon, Minnesota, Virginia, Kentucky, and Tennessee all used the product as a way to keep
              liver-tumor patients closer to home or to expand a regional cancer program. That supports the idea that
              HistoSonics can sell beyond elite university hospitals if coverage, training, and clinical champions line
              up.

              But the public proof surface is still concentrated. One flagship reference account, U-M Health, explicitly
              discloses institutional and researcher financial interests in HistoSonics, which reduces its independence
              as an external proof point. More broadly, the deepest public evidence still comes from a limited set of
              launch accounts and hospital newsrooms rather than from disclosed recurring-utilization data or a
              diversified list of referenceable, economically mature customers. Coverage is widening, but still tightly
              bounded by liver indications and selection criteria, and provider-directory inclusion alone does not prove
              durable revenue at each site. For investors, that means customer demand is real, geographic spread is
              improving, and sales momentum appears credible, but concentration and retention remain open diligence
              items.
