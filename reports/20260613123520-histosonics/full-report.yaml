      - number: '2.2'
        title: 'Constrained sizing: patient pools, stage filters, and site capacity'
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not support a clean, investment-grade dollar TAM/SAM/SOM for HistoSonics because no
              retained source discloses Edison ASP, capital cost, disposables economics, current liver revenue, or
              installed utilization rates. The most defensible sizing approach is therefore constrained rather than
              generic. On the demand side, SEER estimates 42,340 new liver and intrahepatic bile duct cases in the U.S.
              in 2026, with 45% diagnosed localized and 23% regional, implying a stage-filtered annual pool of roughly
              19,053 localized cases or 28,791 local-plus-regional cases before any additional filters for ultrasound
              visibility, lesion count, or liver reserve. Expansion indications are materially larger in raw incidence:
              kidney and renal pelvis cancer at 80,450 new cases, pancreatic cancer at 67,530, and prostate cancer at
              333,830. On the supply side, HistoSonics' provider directory updated on the run date lists about 87
              location lines and roughly 80-plus provider sites, which is large enough to show commercialization but
              still small relative to national hospital counts. The resulting picture is a capacity- and
              eligibility-constrained market, not a fully penetrated national device market.
