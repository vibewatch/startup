      - number: '6.2'
        title: Named proof and academic-versus-community adoption
        blocks:
          - type: paragraph
            body: >-
              The named proof set shows real adoption, but it is uneven in depth. HistoSonics' own post-clearance launch
              release identified University of Rochester Medical Center and Cleveland Clinic as the first
              standard-clinical-practice partners after De Novo clearance, which is stronger evidence than a simple logo
              because it ties the account to real patients and specific case descriptions. Since then, customer-side
              announcements have widened the proof set: Hoag publicized outpatient use in 2024; Allina described the
              first Twin Cities procedure in late 2025 and a fuller 2026 rollout narrative; Hackensack, ECU Health, UofL
              Health, Johns Hopkins, Good Shepherd, Sutter CPMC, and UVA Health all published 2025-2026 releases
              describing first-state, first-region, or first-system milestones. Vanderbilt adds a rarer maturity marker
              by disclosing its 100th histotripsy procedure by February 2026.

              The more important analytical point is that adoption is not limited to academic medical centers. Johns
              Hopkins, U-M Health, UofL Health, Vanderbilt, UVA, ECU/Brody, and Jersey Shore University Medical Center
              provide the academic and tertiary-care side of the story, while Hoag, Good Shepherd, Allina, and Sutter
              CPMC show that regional and community-oriented systems are also willing to invest. Still, public proof
              remains concentrated in launch-style press coverage: a handful of marquee accounts explain most of what
              outsiders can verify about actual clinical use. The directory is broad, but the deepest independently
              visible evidence still comes from a smaller set of first-patient, first-in-state, and occasional
              repeat-use milestone references.
