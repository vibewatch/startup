        title: Leadership, governance visibility, and funding history
        blocks:
          - type: paragraph
            body: >-
              Public leadership visibility is good at the executive-team level but incomplete at the board and ownership
              level. HistoSonics clearly discloses Mike Blue as president/CEO, then chairman/CEO after the 2025
              transaction, plus named functional leaders across technology, finance, clinical, regulatory,
              reimbursement, operations, and HR. Zhen Xu remains the clearest scientific founder in the public record,
              while Charles Cain is the intellectual father of histotripsy and part of the founding narrative.
              Governance visibility drops after that. The 2024 Series D announcement added Alpha Wave’s Chris
              Dimitropoulos to the board, but the reviewed pack does not disclose a full current board roster, committee
              structure, or ownership percentages. Capital history, by contrast, is much clearer: HistoSonics raised a
              $102 million Series D in 2024, then accepted a management-led majority acquisition at roughly $2.25
              billion in August 2025, followed by a $250 million growth financing in October 2025. Those events
              establish a growth-stage company with unusually strong private-market sponsorship but still
