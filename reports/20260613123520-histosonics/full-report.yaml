      - number: '2.5'
        title: Adoption constraints, competitive realities, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The main adoption constraints are not lack of clinical curiosity but filters that shrink practical demand.
              Current use still depends on trained physicians, tumor-board selection, functional liver reserve,
              ultrasound-visible lesions, and small-number or small-size candidate profiles at many centers. Public
              evidence also shows commercialization remains geographically sparse: multiple health systems promoted
              histotripsy as the first in a state or region during 2024-2026, which implies that hospital deployment is
              still in the early rollout phase. Company messaging that the platform needs no special infrastructure is
              directionally helpful, but public site evidence still shows adoption overwhelmingly inside hospitals
              rather than ASCs or office-based settings. Competitive risk also rises in expansion indications: prostate
              ultrasound ablation already has marketed incumbents such as TULSA and Focal One, so HistoSonics would be
              entering adjacent categories that are promising but not empty. Most importantly, public evidence still
              cannot isolate Edison system pricing, capital budget payback, utilization per site, or a true current SOM.
              Those missing pieces do not negate the market; they simply mean investors should underwrite HistoSonics on
              constrained patient and provider adoption logic, not on a broad headline ultrasound TAM.
            claimRefs:
              - CM017
              - CM018
              - CM027
              - CM028
              - CM029
              - CM035
              - CM039
              - CM040
              - CM046
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: The cleanest public TAM lens is constrained and procedural, not generic ultrasound
            body: >-
              The retained evidence never gets to a reliable Edison revenue TAM because pricing, installed utilization,
              and liver revenue are undisclosed. Public underwriting is therefore strongest when it starts from liver
              case pools, stage filters, provider-site counts, and reimbursement gates rather than from a broad
              focused-ultrasound market headline.
            calloutType: insight
            claimRefs:
              - CM027
              - CM034
              - CM040
              - CM041
          - type: callout
            title: Kidney is the most credible next expansion market
            body: >-
              Among named adjacencies, kidney has the best combination of explicit company disclosure, a public De Novo
              submission, 67 enrolled HOPE4KIDNEY patients, a sizable incident pool, and a standard of care still
              dominated by invasive or thermal options. Pancreas and prostate matter strategically, but kidney is the
              cleanest near-term commercial bridge beyond liver.
            calloutType: recommendation
            claimRefs:
              - CM008
              - CM011
              - CM030
              - CM031
              - CM032
              - CM033
          - type: callout
            title: Early rollout and missing economics still block precise SOM math
            body: >-
              Public evidence shows growing adoption, but many centers still market histotripsy as a first-in-state or
              first-in-region offering, and no retained source discloses system price, payback, current utilization, or
              liver revenue. That combination means market enthusiasm can outrun what outside investors can currently
              model with confidence.
