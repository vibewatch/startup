      - number: '2.4'
        title: Growth drivers and expansion indications
        blocks:
          - type: paragraph
            body: >-
              The strongest growth drivers are workflow and indication expansion rather than explosive growth in liver
              incidence itself. Reviews and hospital case studies repeatedly position histotripsy as non-invasive,
              non-thermal, vessel-sparing, and compatible with other treatments, with same-day or short-stay recovery
              pathways that can broaden physician interest relative to surgery or heat-based ablation. Clinical proof
              has also moved beyond feasibility: THERESA established first-in-human technical success, HOPE4LIVER met
              co-primary safety and efficacy goals, and the one-year update reported 90% local control by post hoc
              assessment. Yet the bigger valuation lever is organ expansion. HistoSonics has publicly advanced kidney
              through a 2026 De Novo submission backed by 67 HOPE4KIDNEY patients, while company materials continue to
              name pancreas and prostate as future organs. Those adjacencies matter because the raw U.S. incident pools
              are larger than liver, especially kidney and prostate, and because kidney standard of care still centers
              on surgery or thermal approaches that histotripsy could challenge if authorization broadens. The market
              can therefore expand without pretending that current liver-only clearance already captures those future
              pools.
