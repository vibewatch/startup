              - CV040
              - CV043
              - CV044
      - number: '8.3'
        title: Comparable Set and Public-Market Read-Through
        blocks:
          - type: paragraph
            body: >-
              The public comp set does not offer a perfect match, but it is still useful for testing whether $2.25
              billion looks anchored or aspirational. Profound Medical is the closest public focused-ultrasound
              treatment comp with an installed base of 80 TULSA-PRO systems at the end of Q1 2026, six more systems
              shipped but not yet installed, and full-year 2026 revenue guidance of about $25 million; yet Profound’s
              market cap was only about $241 million on June 12, 2026. EDAP, whose Focal One robotic HIFU system targets
              prostate tissue destruction, traded at roughly $177 million. AngioDynamics is not a focused-ultrasound
              peer, but its NanoKnife prostate tumor platform and broader oncology device portfolio support a useful
              adjacent ablation benchmark around $504 million. Independent CompaniesMarketCap snapshots on June 12, 2026
              similarly showed Profound at about $0.24 billion and AngioDynamics at about $0.49 billion, reinforcing
              that the public benchmark set remained well below $1 billion. Insightec provides a separate private
              focused-ultrasound platform benchmark, though it is neurology-centered rather than liver-oncology
              centered. The gap is therefore enormous: HistoSonics’ $2.25 billion mark is about 4.5 times Angio, 9.3
              times Profound, and 12.7 times EDAP. That premium cannot be justified by present disclosed scale alone; it
              only works if investors underwrite that HistoSonics becomes the category-defining solid-tumor histotripsy
              platform with multi-indication expansion and faster commercialization than the public comp set has
              demonstrated.
            claimRefs:
