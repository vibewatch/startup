      - number: '6.4'
        title: Durability, repeat-use proxies, and satisfaction evidence gaps
        blocks:
          - type: paragraph
            body: >-
              The public record is stronger on early clinical proof than on durable commercial retention. Clinical
              publications provide real support for safety and efficacy: the 2024 pivotal HOPE4LIVER publication
              reported 44 treated participants across 14 sites with 95% technical success and 7% major complications
              within 30 days, the 2025 one-year update reported 47 patients and 52 treated tumors with 90% post-hoc
              local control, and the first-in-human THERESA study reported no device-related adverse events through
              eight weeks in eight patients. Focused Ultrasound Foundation's trial summary adds that no HOPE4LIVER site
              had prior histotripsy experience, which is a useful proxy for an achievable learning curve at new centers.
              Customer-side releases also repeatedly emphasize same-day discharge, minimal downtime, vessel sparing, and
              compatibility with adjunct therapies. Vanderbilt provides one of the few public repeat-use milestones by
              reporting its 100th histotripsy procedure, while Good Shepherd adds another useful repeat-use proxy by
              stating that one session can treat multiple tumors and that the procedure can be repeated without lifetime
              limits.

              What is missing is classic commercial durability data. No reviewed public source disclosed NRR, GRR,
              churn, renewal rates, contract length, or site-level utilization for most named accounts. Most releases
              prove that a site acquired the system or treated a first patient, but they do not prove repeat monthly
              procedure volume, durable economics, or multi-year account expansion. Satisfaction evidence is similarly
              indirect: public sources are rich in clinical-recovery and workflow language, but they do not provide
              provider NPS, purchaser references on renewals, or longitudinal account-retention statistics. The right
              conclusion is that public satisfaction and retention proxies are positive, but they are still proxies
              rather than resolved commercial facts.
            claimRefs:
