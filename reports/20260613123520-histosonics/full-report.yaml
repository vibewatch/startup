      - number: '6.3'
        title: Treatment workflow, reimbursement, and sales-cycle implications
        blocks:
          - type: paragraph
            body: >-
              Public sources describe a fairly specific customer workflow. The device is sold into hospital liver
              programs where patients are screened through multidisciplinary review, assessed for ultrasound visibility
              and tumor burden, and then scheduled for a trained-operator procedure that is commonly framed as
              outpatient or same-day care. Johns Hopkins' treatment page says candidates typically have tumors under 4
              cm, three or fewer lesions, and favorable anatomy; it also says treatment itself runs about 10 to 90
              minutes after anesthesia and usually totals about 1.5 to 2 hours with same-day discharge. Allina gives a
              similar total-duration estimate and says histotripsy can be used alongside chemotherapy or radiation,
              while Cleveland Clinic frames it as safe and effective for inoperable liver tumors but not the best fit
              for all liver cancers. Anthem's policy is even narrower, limiting medically necessary use to liver tumors
              when other therapies are unavailable or unsuitable and when no more than three tumors of 3 cm or less are
              treated. Sutter, Hackensack, and Cleveland Clinic authors all reinforce some version of tumor-board or
              multidisciplinary selection.

              Those facts matter because they make the customer journey longer than a simple capital placement. A
              provider needs service-line sponsorship, physician training, patient-selection pathways, coding and
              reimbursement confidence, and enough eligible patients to justify ongoing use. On the positive side, CMS
              increased outpatient payment for liver-tumor histotripsy to $17,500, AAPC lists a dedicated 0686T code,
              BCBS Michigan and Elevance both expanded coverage, multiple hospital releases emphasize same-day discharge
              and low recovery burden, and Michigan Medicine highlights real-time bubble-cloud visualization plus
              potential combination with systemic therapy. Focused Ultrasound Foundation coverage of HOPE4LIVER adds a
              useful onboarding datapoint by noting that no trial site had prior histotripsy experience before the
              study. On the negative side, payer coverage is still condition-specific rather than universal, training
              remains operator-gated, and larger or poorly visualized tumors may still need adjunct chemotherapy,
              immunotherapy, or alternative local treatment. That combination points to a meaningful but deliberate
              hospital sales cycle.
