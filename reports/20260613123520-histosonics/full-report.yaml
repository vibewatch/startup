      - number: '5.5'
        title: Pipeline indications, IP posture, and product risk
        blocks:
          - type: paragraph
            body: >-
              Public 2026 pipeline evidence is strongest for kidney and weaker for pancreas and prostate/BPH.
              HistoSonics publicly announced a May 2026 FDA De Novo submission for kidney tumors backed by the pivotal
              HOPE4KIDNEY program, making kidney the clearest next regulatory step beyond liver. By contrast, pancreatic
              and prostate/BPH expansion is visible mainly through research and founder/community signals: the
              University of Michigan inventor profile says current work aims to expand histotripsy into renal,
              pancreatic, and prostate cancers, while an ISTU profile records first-in-human BPH trial approval in 2016.
              Newer 2026 sources sharpen that picture: HistoSonics and EVToday say the WOLVERINE feasibility study has
              already treated first BPH patients at Prince of Wales Hospital in Hong Kong, with a prospective
              multicenter single-arm design, imaging within 72 hours, and a planned enrollment of up to 20 patients.
              That is enough to treat multi-organ expansion as real, but not enough to treat pancreas or BPH as
              near-term commercial businesses yet. The patent page supports a meaningful IP estate, and Taiwan approval
              plus provider rollouts support global product momentum. Still, the major product risks remain executional:
              translating a liver-first therapy into repeatable multi-organ protocols, scaling training and service
              while preserving safety, and converting promising but still selected-center evidence into broader
              standard-of-care adoption.
