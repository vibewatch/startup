  - id: TR008
    title: Mitigation and thesis-break criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Clinical durability
        - Retreatment or local-control data
        - >-
          If >1-year real-world control trends materially below the stronger published benchmark without clear case-mix
          explanation
        - Downgrade adoption and valuation assumptions; require narrower indication focus.
      - - Safety / label overreach
        - Regulatory, recall, or adverse-event signal
        - Any FDA warning, MDR cluster, or promotional drift against label limitations
        - Pause underwriting until root cause and corrective actions are verified.
      - - Reimbursement conversion
        - Paid-claims realization
        - If site-level reimbursement proves inconsistent despite existing codes and published payment rates
        - Reduce revenue ramp and reassess hospital ROI assumptions.
      - - Capex and training friction
        - Install-to-first-case lag
        - If launch timelines stretch meaningfully or require recurring philanthropic support at flagship sites
        - Treat the model as more niche and slower-scaling than the growth narrative implies.
      - - Kidney expansion
        - Regulatory timing
        - If kidney authorization materially slips or lands with a narrow label
        - Cut TAM expansion assumptions and focus only on liver economics.
      - - Operational scale
        - Backlog or service slippage
        - If field service, installation, or training throughput cannot keep pace with orders
        - Lower adoption curve and margin expectations.
      - - Competitive modality pressure
        - Payer or physician preference drift
        - >-
          If TULSA, HIFU, surgery, or thermal ablation wins better reimbursement or more durable evidence in overlapping
          use cases
        - Assume slower share gains and higher selling costs.
      - - Valuation discipline
        - Private-mark support
        - >-
          If management cannot bridge the private valuation to evidence on revenue, margin, and installed-base
          productivity
        - Underwrite to public-comp ranges rather than to the latest private mark.
    notes: >-
      Kill criteria are designed to be observable in diligence or early post-investment monitoring rather than
      subjective impressions.
