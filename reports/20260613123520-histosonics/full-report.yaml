  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The real decision set is broader than focused-ultrasound branding
        blocks:
          - type: paragraph
            body: >-
              The competitive frame should start with the job the hospital is buying, not the novelty of histotripsy
              itself. HistoSonics sells a liver-tumor workflow that it describes as non-invasive, non-thermal,
              ultrasound-guided, and deployable without special infrastructure, and hospital launch stories show that
              the platform is now being slotted into surgical oncology and interventional-oncology service lines rather
              than into a standalone new department. That matters because the buyer can solve the same clinical problem
              through several very different routes: incumbent percutaneous ablation, surgery, radiation, embolization,
              or non-invasive focused-ultrasound platforms aimed at other organs. Public evidence also shows that
              HistoSonics has moved beyond pilot-stage novelty: the company cites a multi-site FDA basis, a growing
              provider directory, reimbursement wins, and broader payer coverage, while independent coverage reported
              more than 2,000 treated patients across more than 50 U.S. centers by late 2025. Those traction signals
              strengthen the case that HistoSonics is now a live commercial platform, but they do not eliminate
              substitute pressure from workflows that were already embedded before histotripsy arrived.
