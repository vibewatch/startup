  topStrengths:
    - >-
      First-of-kind FDA-cleared histotripsy platform for non-invasive liver-tumor destruction with differentiated
      non-thermal positioning.
    - >-
      Real commercial traction is visible through roughly 100 installed systems worldwide and nearly 3,000 patients
      treated.
    - >-
      Capital access is strong, with a $102M Series D, a $2.25B majority acquisition, and a $250M follow-on financing in
      a short window.
    - >-
      Reimbursement momentum is improving through CMS payment support and commercial coverage reaching about 45.4
      million members.
    - Kidney expansion is already advancing with a De Novo submission backed by a 67-patient pivotal dataset.
  topRisks:
    - >-
      Revenue, gross margin, cash runway, and installed-system monetization remain undisclosed, preventing clean
      underwriting.
    - >-
      Long-term outcome durability is still developing, and current public liver evidence remains early relative to
      platform ambition.
    - >-
      Commercial concentration is still centered on liver treatment while kidney and other organs remain regulatory and
      execution bets.
    - >-
      Adoption still requires hospital capex, multidisciplinary training, and reimbursement conversion rather than a
      lightweight rollout.
    - >-
      New-investor returns could be materially affected by undisclosed post-acquisition cap-table structure and
      preference terms.
  unresolvedGaps:
    - Audited revenue, gross margin, and per-system utilization by site cohort.
    - Cash balance, burn, debt, and runway after the 2025 acquisition and growth financing.
    - Post-acquisition cap table, liquidation preferences, and governance terms for new investors.
    - Realized paid-procedure volume and repeat utilization after payer-coverage wins.
    - Timing and economic contribution of kidney authorization and later-organ expansion.
