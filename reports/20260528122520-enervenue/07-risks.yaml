  evidenceGaps:
    - type: enumeration-incomplete
      severity: minor
      topic: regulatory-legal-risk-register
      missingEvidence: >-
        TR001 covers six key regulatory and legal risk categories visible from the public record. Private regulator
        correspondence, sealed court filings, undisclosed contractual disputes, jurisdiction-specific pressure vessel
        permitting requirements, and non-US regulatory compliance documentation for EU, Middle East, and China markets
        are not accessible from the public record and are excluded.
      whyItMatters: >-
        A more complete regulatory and legal risk register would inform investors about compliance cost, deployment
        timeline risk, and potential disqualification scenarios in specific target markets not visible in the
        public record.
      diligencePath: >-
        Request management's full compliance roadmap for each target market (US, EU, China, Middle East), outside
        counsel review of pending regulatory obligations, and a complete disclosure of any undisclosed litigation
        or regulatory correspondence.
      relatedQuestionRefs:
        - QR016
      relatedTableRefs:
        - TR001
    - type: private-evidence-only
      severity: material
      topic: burn-rate-runway
      missingEvidence: >-
        EnerVenue has not disclosed its monthly burn rate, projected revenue timeline, or implied cash runway from
        the $445M cumulative raise. As a private company, this information is available only to existing investors
        and management.
      whyItMatters: >-
        Without burn rate and runway data, it is not possible to assess whether the $300M Series B extension provides
        sufficient runway to reach commercial-scale delivery milestones before the next fundraising requirement.
      diligencePath: >-
        Request current-period financial model with monthly burn, projected revenue bridge, and next funding round
        assumptions directly from management or existing investor data room.
      relatedQuestionRefs:
        - QR011
      relatedTableRefs: []
    - type: private-evidence-only
      severity: minor
      topic: gen4-recertification-timeline
      missingEvidence: >-
        EnerVenue has not publicly disclosed the expected timeline or cost for Gen 4 UL 1973 and UL 9540A
        recertification. The test schedule and expected completion date are not visible in the public record.
      whyItMatters: >-
        The Gen 4 recertification timeline directly affects when EnerVenue can present a bankable product to
        project finance lenders and utility customers, which in turn affects the 2026-2027 commercial delivery
        outlook.
      diligencePath: >-
        Request Gen 4 certification schedule from management, including test laboratory contracts, projected
        completion dates for UL 1973 and UL 9540A, and any provisional certification pathways in progress.
      relatedQuestionRefs:
        - QR013
      relatedTableRefs: []
    - type: private-evidence-only
      severity: minor
      topic: gen4-target-cost-per-kwh
      missingEvidence: >-
        EnerVenue has not disclosed its target cost per kWh for Gen 4 production at the 250 MWh and 1 GWh
        scale milestones, nor has it published a comparison to projected LFP or iron-air prices in 2027-2028.
      whyItMatters: >-
        Without cost-per-kWh data, it is not possible to verify whether EnerVenue's TCO advantage over LFP
        will hold at commercial scale if LFP prices continue to decline toward $60/kWh.
      diligencePath: >-
        Request Gen 4 cost model from management, including bill of materials, manufacturing cost trajectory,
        and breakeven cost per kWh versus LFP and iron-air at representative project sizes.
