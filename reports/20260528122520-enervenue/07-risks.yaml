chapter:
  number: 7
  title: Risks
  summary: >-
    EnerVenue's highest residual risks are manufacturing scale-up failure, FEOC and tariff exposure from China-based
    production, investor-partner concentration (NEOM Investment Fund, Towngas, Aramco Ventures), and an unproven Gen 4
    commercial certification path. The $300M Series B extension provides runway, but competitor bankruptcies (Ambri,
    Nilar, AMTE) and ESS Inc.'s financial distress establish sector precedent for deep-tech BESS failures under LFP
    price compression. Residual risk remains elevated until Gen 4 obtains UL recertification, a binding commercial
    grid-scale deployment is contracted, and FEOC/tariff exposure is resolved through US domestic assembly or product
    reclassification.
