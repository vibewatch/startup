callouts:
  - calloutType: risk
    title: Manufacturing Pivot Creates Dual Concentration Risk
    body: >-
      EnerVenue's decision to abandon its Kentucky factory in November 2024 and concentrate
      all high-volume manufacturing in Changzhou, China creates simultaneous geopolitical
      and operational concentration risk. US-China trade tensions, potential tariff
      escalation on battery imports, and the complexity of managing a GWh-scale industrial
      ramp from a Silicon Valley R&D base are all material uncertainties that a $1B-plus
      valuation must price in. The appointment of Henning Rath with supply-chain experience
      at Enpal signals management awareness of this risk, but execution track record at
      GWh scale remains unproven and the Kentucky precedent cannot be dismissed.
    claimRefs:
      - CV023
      - CV024
      - CV025
      - CV031

  - calloutType: insight
    title: Strategic Investor Composition Is the Strongest Valuation Anchor
    body: >-
      The concentration of strategic investors -- Aramco Ventures, SLB, HKIC, NEOM, and Full
      Vision Capital -- is simultaneously EnerVenue's strongest valuation anchor and its most
      likely exit mechanism. If manufacturing scales and revenue materializes, one of these
      parties has both the capital and strategic incentive to acquire the company rather than
      compete with it in the public market. The Aramco-SLB combination is particularly
      compelling because both have oilfield grid-replacement and remote-site storage mandates
      that nickel-hydrogen ESVs serve directly. This strategic premium pathway has higher
      probability than an IPO given current capital-market appetite for pre-revenue LDES.
    claimRefs:
      - CV009
      - CV026
      - CV030
      - CV036

