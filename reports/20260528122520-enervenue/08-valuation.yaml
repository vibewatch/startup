tables:
  - id: TV001
    title: Recommendation Summary Table
    layout: standard
    notes: >-
      Recommendation based on publicly available evidence only as of May 2026. A confirmed
      revenue run-rate, audited preference stack, and Changzhou site visit would upgrade
      confidence materially. Valuation stance reflects third-party analyst estimates; no
      post-money valuation has been officially disclosed for any EnerVenue round.
    columns:
      - Dimension
      - Assessment
    rows:
      - - Investment Recommendation
        - RESEARCH-MORE. Technology moat and strategic investor quality are compelling; revenue opacity and manufacturing execution risk prevent a confident BUY signal at current valuation.
      - - Confidence Level
        - Low-to-Medium. Unicorn classification is analyst-inferred; no primary post-money valuation disclosure exists for any round.
      - - Risk Rating
        - High. Kentucky abandonment precedent, Changzhou ramp uncertainty, China manufacturing concentration, and zero disclosed revenue are simultaneous material risks.
      - - Valuation Stance
        - STRETCH at $1.1B-$1.6B. Elevated for a pre-revenue LDES company; defensible only by IP replacement-cost floor and strategic investor composition.
      - - Entry Discipline
        - Require audited ARR of at least $50M and independent Changzhou 250 MWh ramp confirmation before increasing position or upgrading recommendation.
