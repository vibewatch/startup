chapter:
  number: 8
  title: Valuation
  summary: >-
    EnerVenue has raised approximately $745M across four rounds through May 2026, most
    recently a $300M Series B extension in March 2026 led by Full Vision Capital. No
    post-money valuation has been publicly disclosed; third-party estimates place the
    implied valuation at $1.1B-$1.6B. With zero disclosed revenue, a manufacturing
    pivot from Kentucky to Changzhou following the November 2024 factory abandonment,
    and a new CEO as of March 31, 2026, the recommended posture is RESEARCH-MORE at
    the current level of evidence. Strategic investor quality (Aramco Ventures, SLB,
    HKIC) provides partial de-risking, but disciplined entry requires revenue evidence,
    Changzhou ramp confirmation, and a preference-stack audit before committing capital.

sections:
  - id: financing-history
    title: Financing History and Valuation Context
    body: >-
      EnerVenue has completed four funding rounds totaling approximately $745M since its
      founding in 2020. The Seed round (estimated at approximately $12M in 2020) was led
      by Peter Lee Ka-kit's Full Vision Capital and established the initial commercialization
      platform for the company's NASA-derived nickel-hydrogen battery technology. The Series A
      ($125M, September 2021) added IDG Capital and a consortium of Asian growth investors.
      The October 2023 Series B raised $308.15M of a planned $515.6M offering, as disclosed
      in a June 2024 SEC Form D filing, with Aramco Ventures, SLB Ventures, NEOM Investment
      Fund, Hong Kong Investment Corporation, and SAIC Capital as strategic anchors.

      The March 31, 2026 Series B extension closed at $300M led again by Full Vision Capital
      alongside HKIC and additional strategic co-investors, bringing cumulative capital to
      approximately $745M. The company simultaneously announced the appointment of Henning
      Rath as CEO, formerly Chief Supply Chain Officer at Enpal, a German greentech unicorn,
      framing the capital as funding for Changzhou manufacturing scale-up rather than a new
      technology milestone. No post-money valuation has been disclosed for any round. The CEO
      explicitly declined to provide post-money valuation figures after the March 2026 close.
      Third-party analyst platforms estimate a 2026 implied valuation of $1.1B-$1.6B, placing
      EnerVenue fifth in long-duration energy storage startup rankings. Media references to
      EnerVenue as a unicorn reflect analyst inference rather than primary company disclosure.
      CB Insights and Tracxn classify the company near the unicorn threshold based on capital
      raised and investor quality without confirming a primary valuation.
