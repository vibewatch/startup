      - number: '5.3'
        title: 技术架构与材料科学
        blocks:
          - type: paragraph
            body: >
              Aqueous Metal Cell
              是基于镍氢化学体系的电化学系统，采用氢氧化镍正极、镍合金负极，并在碱性（水基）电解液中运行。充电时，系统通过电化学反应产生氢气并储存在气密压力容器内；放电时，负极上的氢反应反向进行。系统完全密封——没有液体泄漏、没有排气路径，也没有热级联通道。系统稳定性来自电化学本身，而不是靠保护层、冷却系统或被动热管理子系统硬堆出来；这正是
              AMC 区别于锂离子技术的核心技术主张。

              从 NASA 原始镍氢电芯走向商业化，关键跃迁主要来自催化剂替换：Stanford University Yi Cui 教授团队开发的过渡金属催化剂，取代了航天电芯中标准的铂催化剂（约
              $30,000/kg）。新催化剂成本约 $22/kg，同时对析氢和氧化反应都有高催化活性，不需要双催化剂。与此同时，EnerVenue 用多孔聚烯烃材料替代 NASA
              的氧化锆隔膜，并把压力容器从不锈钢迁移到复合材料结构，降低成本并支持规模化制造。这些材料选择也形成了完全由地球丰度材料组成的供应链画像——钢、镍、玻璃纤维、树脂和水——不含锂、稀土，也不依赖单一国家供应链。

              EnerVenue 测试并发布的性能特征包括：峰值往返效率超过 90%（2 小时储能场景为 85%）、实验室测试温度范围 -20°C 至 +60°C，以及 Energy Rack 额定运行范围 -10°C 至
              +45°C，且只需强制风冷。最大充放电 C-rate 为 0.55C，支持 2–12 小时放电时长。海拔耐受可达海平面以上 2,000 m。EnerVenue 商业化前，NASA 和航天应用已积累超过 200
              million cell-hours 运行数据，构成多数电网电池制造商难以匹敌的深度可靠性数据集。
