      - number: '6.2'
        title: 具名客户证明、部署状态与管线
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 5 月，EnerVenue 的客户证明覆盖七个不同的具名供应协议或试点关系，成熟度从已宣布 MOU 到已投运产品不等。可信度最高的证据，是 2026 年 5 月在江苏常州金坛投运的
              Towngas Gen-4 Aqueous Metal Cell（AMC）试点——这是全球首个 EnerVenue 第四代技术真实场景部署。150 kWh 系统（一个 Energy Rack 内含 50 个
              AMC，配逆变器和 BMS）位于配套光伏的电动巴士充电站，每天连续运行 2–4 小时充放电循环，在真实运行条件下降低能源成本。Towngas Managing Director Peter Wong
              Wai-yee 公开背书该技术，称 EnerVenue 可在低成本可再生能源部署中发挥关键作用。VedantaESS（巴西）持有已宣布单笔最大合同：三年 525 MWh（2024/2025/2026 年分别
              75/150/300 MWh），VedantaESS 总裁 Richard Phillips 强调其寿命、可靠性、安全性、节省和灵活性。2026 年 300 MWh 批次将成为 EnerVenue
              单年最大实物交付里程碑；截至 runDate，是否已发货尚未公开确认。Pine Gate Renewables 2022 年签署的 2.4 GWh 多年供应协议，是已宣布最大单体容量，但结构上更像框架协议，为
              Pine Gate 的开发伙伴提供在项目管线中选择 EnerVenue 电池的选项，而不是确定采购订单，交付执行也未获独立确认。RWE 于 2024 年 12 月在 Milwaukee 设施启动
              EnerVenue ESVs 性能测试，SVP Andrea Hu-Bianco 确认其电网级储能试点意图与 RWE 到 2030 年扩张 6 GW
              储能的路线图一致——但试点完成和生产承诺时间表仍未明确。Dominion Energy 位于 Virginia State University 的 EnerVenue 试点（1.5 MW、10 小时时长）已向
              Virginia State Corporation Commission 提案并获批，但预计 2027 年投运，尚未建成。High Caliber Energy
              向佛罗里达一家未具名美国东南部大型公用事业公司交付 25 MWh 订单（2024 年 Q4 交付目标），High Caliber Managing Partner Matt Davis
              提到运营效率、可靠性、灵活性和成本效益。Avid Group（澳大利亚珀斯）于 2024 年 8 月签署主供应协议，将 EnerVenue 产品推向矿业、C&I
              和微电网客户，并计划以自有制造场地作为参考安装。CEO Rath 在 2026 年 3 月表示，试点项目很可能在未来几个月直接转化为销售订单；公司报告全球销售管线中共有 $2.3 billion 订单和 56
              GWh，代表同比增长 8x，但单项承诺的坚实程度（有约束力的 PO、MOU 还是 LOI）未公开披露。
