          description: 常州产线未达 250 MWh 目标；Kentucky 放弃后没有后备产能。
        - id: feoc
          label: FEOC 和关税敞口
          description: 中国制造电池面临 ITC 资格取消和约 82% 进口关税。
        - id: cert
          label: Gen 4 重新认证缺口
          description: Gen 4 的 UL 1973 和 UL 9540A 认证待定；项目融资需要它们。
        - id: partner
          label: 合作伙伴与投资人压力
          description: NEOM 缩减、Towngas 财务压力、Aramco 区域风险同时存在。
        - id: lfp
          label: LFP 和铁空气价格压力
          description: 竞争对手约 $80/kWh，挤压 EnerVenue 在中时长储能的 TCO 溢价。
        - id: adoption
          label: 客户采用延迟
          description: 截至 2026 年中，RWE、Towngas、Dominion 的试点仍未商业化。
        - id: revenue
          label: 收入和管线
          description: 商业承购合同和项目部署驱动收入确认。
        - id: financing
          label: 融资需求和现金跑道
          description: 公司尚未产生收入；已融资 $445M，但月度烧钱规模可观。
        - id: valuation
          label: 估值风险
          description: 采用率更低、执行风险更高，会压缩下行支撑。
