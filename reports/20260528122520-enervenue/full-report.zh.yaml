companyProfile:
  summary: >-
    EnerVenue 是一家位于 Fremont 的私营储能公司，成立于 2020 年，目标是把 NASA 衍生的镍氢电池化学体系商业化，用于固定式电网场景。公开证据支持其耐久性和安全性差异化：截至 2026 年 3 月 Series
    B 延展轮，累计融资约 $745M；公司称截至 2024 年中有 $2.3B、56 GWh 管线；并已通过 RWE、Towngas 等客户拿到早期试点验证。核心尽调张力在于：EnerVenue
    已拿到大量资本和战略投资人背书，但仍没有公开收入披露、广泛商业部署证明，也没有在中国 Changzhou 之外完成去风险的制造布局。
