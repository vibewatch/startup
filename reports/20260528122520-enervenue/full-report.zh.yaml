            title: 中国工厂集中与关税暴露
            body: >-
              EnerVenue 的全部生产爬坡依赖单一 Changzhou 设施，而该设施尚未达到 250 MWh/年的产出。制造产品同样暴露在出口管制和关税风险下；造成锂离子竞争者供应链风险的美中贸易紧张，也会影响
              EnerVenue。Powin 2025 年破产说明扰动可能来得很快，也并非线性。公司提到过美国生产备选方案，但尚未融资或选址；IRA 本土内容资格也需要单独制造投资。
