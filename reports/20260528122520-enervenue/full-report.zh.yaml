      - number: '5.5'
        title: 部署、集成、路线图与运维模型
        blocks:
          - type: paragraph
            body: >
              EnerVenue 的部署模型建立在工厂集成 DC block 上，目标是把现场劳动力压到最低。Energy Rack
              预集成后发货——AMC、BMS、线束和连接件已装好——把安装周期从数周缩短到数小时。Energy Prism 作为完全组装的集装箱发货，可在 DC
              母线处直接接入客户的功率转换系统（PCS），从交付到通电可在数天内完成。两款产品都使用 Modbus TCP/IP 作为 BMS 通信协议，兼容标准 SCADA 和能源管理系统（EMS）。包括 DEIF
              在内的第三方控制器厂商，已在公开应用说明中记录了 EnerVenue BMS 集成。

              运维模型有意保持极简：30 年设计寿命内无增容、无 HVAC 或冷水机合同、无辅助消防服务协议，也无需化学品补加。运维简单性是 EnerVenue TCO
              论证的财务发动机，但目前仍是公司主张，尚未在数十年商业规模运行中获得独立验证。公司通过直接客户支持职能提供技术支持和质保服务。

              截至 2026 年 5 月，活跃试点包括：RWE Clean Energy（Milwaukee 附近测试设施），对 ESVs 循环测试以评估不同充放电曲线和温度条件下的表现；中国常州金坛的
              Towngas（2026 年 5 月投运），部署 150 kWh 第四代 AMC 技术，并与可再生发电和 EV 充电集成；以及 Virginia State University 的 Ettrick 校区
              Dominion Energy Virginia 项目（计划 2027 年投运），部署 1.5 MW 金属氢储能，提供最长 10 小时备用时长。

              从 Generation 1 到 Generation 4 的产品路线图显示，EnerVenue 在 2024 年有意跳过 Generation 3 生产并加速 Generation 4。该决定让
              EnerVenue 失去 Kentucky gigafactory 时间表，但公司称其带来「显著性能和成本收益」。制造现在集中在中国常州，EnerVenue 正在那里扩建一条 250 MWh 生产线（2026
              年开工），中期目标为 1 GWh。R&D 仍留在加州 Silicon Valley。
