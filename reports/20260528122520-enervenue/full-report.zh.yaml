      - number: '4.5'
        title: 财务风险、反向证据与尽调结论
        blocks:
          - type: paragraph
            body: >
              几项重大财务风险直接影响现阶段对 EnerVenue 的承销判断：


              中国制造集中风险。EnerVenue 的主要制造资产——Changzhou 设施——位于中国，使公司暴露于美国出口管制变化、地缘政治供应链扰动，以及服务美国联邦基础设施买家时可能遇到的障碍。Foundation
              for Defense of Democracies（FDD，2026 年 4 月）明确警告，依赖中国制造的美国电池公司，会把战略依赖嵌入关键基础设施供应链。RAND（2026 年 1
              月）强调，中国国家安全法律要求国内企业配合情报和军事服务，这会给软件集成能源系统带来数据风险。这些风险与 EnerVenue 的目标市场（美国电网买家、美国数据中心）直接相关，也可能限制其美国总可用市场。


              Kentucky 工厂放弃是执行信号。EnerVenue 于 2023 年签署 $264M Kentucky 工厂协议，到 2024 年 11 月已撤出 Shelby County 站点，理由是产品战略转向
              Gen 4。Canadian Solar 随后接手该设施。公司跳过 Gen 3、转向 Gen 4 的决定，使美国制造时间线至少推迟两到三年。这个执行缺口是反向数据点：它说明 EnerVenue
              的商业扩产落后于最初公开时间表，而且资本已经花出，却没有让计划资产上线。


              ATS Ohio 诉讼。EnerVenue 曾是 ATS Ohio, Inc. v. EnerVenue, Inc.（SDOH 案号 2:2023cv04187）的被告。2025 年 9 月，法院命令对
              EnerVenue 若干积极抗辩作出强制性不利推定陪审团指示，并批准 ATS 关于律师费、成本和费用的请求，同时驳回 EnerVenue 的反诉。案件最终于 2025 年 11
              月按双方约定以不得重新起诉的方式驳回。该诉讼提示早期供应链或设备采购关系中存在合同争议；法院对 EnerVenue 证据开示行为的不利认定，也是尽调审查者必须注意的反向记录。


              收入和成本不透明。EnerVenue 是私营公司，没有披露收入、毛利率、运营亏损或资产负债表。全部财务信号来自融资轮披露、分析师推断，以及 CEO
              对订单储备的表述。没有经审计财务数据，就无法独立评估烧钱速度轨迹、营运资本充足性或制造爬坡成本。公司 $300M 延展轮带来的现金跑道估算（基于员工数代理约 24–36 个月）在没有 CFO
              级数据访问前必须视为推测。
