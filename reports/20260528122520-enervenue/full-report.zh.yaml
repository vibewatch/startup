      - number: '8.4'
        title: 情景分析
        blocks:
          - type: paragraph
            body: >-
              牛市情景（隐含估值 $1.8B-$2.5B）要求 EnerVenue 在 2026 年 Q3 前成功爬坡 Changzhou 250 MWh 产线，在 2027 年中前把 $2.3B 潜在管线中至少 10%
              转化为合同收入，并在 2027 年底前证明通向 1 GWh 年产能的清晰路径。在这些条件下，战略收购方或 2028-2029 年 IPO 很可能给已验证的制造速度套上溢价倍数。RWE 试点、Duke Energy
              供应关系，以及 SLB 和 Aramco 分销渠道，构成可信的先发基础。

              基准情景（$1.1B-$1.5B）假设 Changzhou 延误 6-12 个月，管线转化温和，收入继续不透明。估值标记维持在当前第三方 LDES
              排名估计附近，由锚定投资者持仓和技术差异化支撑；但没有商业里程碑，投资者无法继续上调估值。新 CEO 的供应链职责可能收窄执行风险，但制造导向的领导者无法单独创造收入需求。

              熊市情景（$600M-$900M）会在以下情况下出现：Changzhou 爬坡延误超过 12 个月，$2.3B 管线到 2026 年底仍未转化为有约束力订单，或锂电成本继续下降，抹掉镍氢在 8 小时应用中的
              TCO 优势。BNEF 报告称，2025 年末固定式储能锂离子电池包价格已降至 $108/kWh。若 8 小时等效应用继续通缩至 $80/kWh
              以下，将构成直接威胁。肯塔基工厂放弃的先例不能轻看：若再次执行失败，将触发接近或低于 2023 年 Series B 隐含标记的降价轮。
