      - number: '5.6'
        title: 安全性、认证与质量控制
        blocks:
          - type: paragraph
            body: >
              EnerVenue
              的安全价值主张围绕水系碱性电解液的本征不可燃展开。体系中没有可点燃的有机溶剂，没有会导致锂沉积的锂嵌入路径，测试中也未观察到热级联机制。这消除了锂离子装置中驱动辅助消防要求的火灾蔓延失效模式。对把储能部署在人口中心、石化设施、数据中心或关键基础设施附近的运营商来说，这是有意义的成本和许可优势。

              UL 9540A 评估是热失控火灾蔓延的行业标准，EnerVenue
              电芯接受了电芯级、模块级和单元级测试。电芯级诱发热失控时未观察到火焰。相比之下，多数锂离子技术在电芯级会产生可见火焰，需要大量模块级和系统级防护来控制事件。公司持有 UL 1973
              认证（固定式电池安全，覆盖耐火、机械设计、热管理和电气安全），以及 Energy Rack 的 IEC 62933-5-2 和 IEC 63115-2 认证。部分认证仍在进行中——公司提示「some
              certifications pending; consult EnerVenue technical authority for current certifications」。

              Energy Prism 计划取得的认证包括 UL 9540、UL 9540A 和 UL 1998。Energy Rack 抗震设计按 GB 50011 达到烈度 ≥ 8（等同于 ASCE 7 下 SDS ≥
              0.24 g、SD1 ≥ 0.16 g）。IP 等级为 IP20（Energy Rack 外壳）和 IP54（Remote System Interface and Integration
              Controller）。通信通过 Modbus TCP/IP 加密。供应商行为准则和法律免责声明已公开发布在公司网站。截至研究日期，公开来源未发现针对 EnerVenue
              产品的召回或监管执法行动。无需消防基础设施也意味着，部署 EnerVenue 系统的场站可追求更简化的许可流程，并可能降低保险开销。
