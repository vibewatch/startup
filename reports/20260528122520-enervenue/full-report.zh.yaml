  - id: TV006
    title: 最终尽调要求表
    layout: standard
    notes: 尽调要求按对估值判断的重要性排序。阻断项必须在任何重大资本承诺前解决。重大事项会提升或下调当前的继续研究建议。所有事项都需要数据室访问或专家参与；单靠公开来源无法解决。
    columns:
      - 优先级
      - 议题
      - 缺失证据
      - 重要性
      - 负责人或路径
    rows:
      - - 阻断
        - 收入和 ARR
        - 经审计的 2025-2026 YTD 收入、ARR 和积压订单转化率，并由 Big-4 认证。
        - 没有收入证据，估值区间会拉开 4 倍；无法确定任何仓位规模或承销。
        - CFO 和独立审计师；任何新投资都应以提供经审计认证的数字为条件。
      - - 阻断
        - 优先股堆叠和股权结构表
        - 完整清算优先权瀑布、参与权、反稀释条款，以及按类别列示的完全摊薄股份。
        - 决定真实普通股等价估值和下行保护；对任何 IRR 模型都关键。
        - 法律顾问；直接投资的必备项；对照 SEC EDGAR Form D 交叉核验结构条款。
      - - 重大
        - 常州制造审计
        - 针对 250 MWh 产线的独立第三方制造准备度报告，覆盖当前状态、产能和时间线。
        - Kentucky 放弃先例要求拿出爬坡能力硬证据；管理层说法不足以支撑。
        - 通过 EnerVenue 董事会数据室访问，委托独立工程审计机构。
      - - 重大
        - 客户管线核验
        - 前 10 大管线账户的有约束力采购订单或 LOI，列明价值、数量和交付时间线。
        - $2.3B 管线只是 June 2024 CEO 的单次表述；22 个月未更新，对估值很关键。
        - 要求数据室访问；对照已发布客户新闻稿交叉核验（RWE Dec 2024、Duke Energy 供应）。
      - - 次要
        - 员工数和烧钱速度
        - 按职能划分的大致员工数、月度现金消耗和当前现金跑道。
        - 判断 $745M 融资是否足以在无过桥融资风险下达到制造规模。
        - 从 LinkedIn 和 Tracxn 推断；正式向 CFO 提出请求。
    claimRefs:
      - CV040
      - CV042
      - CV023
      - CV024
