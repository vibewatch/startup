  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 制造与执行风险——一次既有失败和一条未经验证的爬坡线
        blocks:
          - type: paragraph
            body: >-
              EnerVenue 最具体的近期风险是制造执行。公司 2024 年 11 月撤出 Shelby County, Kentucky 设施，未能投产；这次失败可直接归因于转向 Gen 4 的产品战略。Canadian
              Solar 随后接手该场地。这不是前瞻性担忧，而是历史事实：EnerVenue 未能投运其第一座规划中的美国生产设施。公司现在推进第二次制造尝试，这次是在中国江苏省常州建设一条 250 MWh 产能线。

              常州爬坡面对多重叠加挑战。第一，EnerVenue 跳过 Gen 3 以加速 Gen 4 开发，制造端与设计端之间出现断层。截至 2026 年初，Gen 4 产品正与 Towngas
              在香港做联合试点，但从投运试点走到 2026 年 250 MWh 可融资交付，这条路径尚未获得独立验证。第二，公司在 2026 年 3 月任命新 CEO Henning Rath，同月完成 $300M
              Series B 延展轮。Rath 此前是德国太阳能设备公司 Enpal 的董事总经理，不是电池电芯制造商出身。他的任命代表公司有意转向供应链和商业执行，但也意味着领导层更替发生在 EnerVenue
              历史上最关键的运营拐点。

              EnerVenue 的 30,000 次循环和 30 年性能主张，来自 NASA 镍氢航天传承，而不是地面商业规模部署。美国 RWE 试点和香港 Towngas
              试点仍处早期测试阶段。尚无公开宣布的大规模商业承购合同。在 Gen 4 完成认证、按商业批量交付，并被确认能在电网条件下运行前，这些主张都带有外推风险，任何投资者都应把它视为实质不确定性。
