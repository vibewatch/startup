      - number: '1.3'
        title: 融资历程、投资人与估值
        blocks:
          - type: paragraph
            body: >-
              对一家成立时间不长的私营硬件公司而言，EnerVenue 的融资历史有异常充分的证据支撑。2020 年 $12M 种子轮来自 Peter Lee 的 Full Vision Capital；2021 年 8
              月宣布的 $100M Series A 由 SLB（当时名为 Schlumberger）领投，并包括 Aramco Ventures，使公司与全球最大油田服务和能源公司中的两家建立了战略产业关系。Series B
              有 2024 年 6 月 SEC Form D 记录，金额为 $308M，TechCrunch 和其他媒体也独立核验。$300M Series B 延展轮于 2026 年 3 月完成，ESS-news、The
              Next Web、MerCom Capital、RenewablesNow、South China Morning Post、Standard HK 等均有报道。

              公开记录中的累计融资额存在争议。把已确认轮次金额相加，约为 $720M；但 The Next Web 引用 Crunchbase 称，截至 2026 年 3 月为 $445M。差异可能来自可转债、SAFE
              工具的处理方式不同，或前几轮在 Crunchbase 上的录入方式与 SEC Form D 数值不同；开放来源无法完全调和两组数字。Forbes 2024 年 6 月的独角兽认定，说明当时隐含估值超过 $1B，但
              Series B 延展轮没有披露正式估值。

              投资人组合的战略逻辑有重要背景。SLB 参与，反映一家油田服务公司希望向能源转型多元化；Aramco Ventures 是 Saudi Aramco
              的风险投资部门，带有能源安全使命。两者都是长资本周期的产业伙伴，与 EnerVenue 的长时基础设施逻辑一致，但也可能在退出时点和商业化优先级上制造治理复杂性。Full Vision Capital 的
              Peter Lee 带来中国市场网络，与 EnerVenue 的 Changzhou 制造基地直接相关。
