  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与市场结构
        blocks:
          - type: paragraph
            body: >-
              2026 年电网级电池储能是一个双层市场。顶层由中国一体化制造商——BYD、CATL、Sungrow 及同类企业——再加上 Tesla 和 Fluence 主导，它们控制商品化短中时长（两到四小时）项目，合计占
              2025 年全球约 315 GWh 装机的 90% 以上。BYD 超过 Tesla 成为出货量第一，市场份额 13%，出货超过 60 GWh；Tesla 份额 10%，出货 46.7 GWh。除 Tesla
              外，Fluence 是全球前 10 中唯一的西方集成商；截至 2026 年 5 月，它报告了 $5.6B 订单积压。

              在这层在位者之下，一批替代化学体系玩家正在争夺锂离子无法经济服务的需求增量：八小时以上时长、对锂热管理要求不友好的环境，或需要无需补容、可运行数十年的资产寿命。Form Energy（铁空气，100
              小时时长）、Eos Energy（锌混合，4–12 小时）和 ESS Inc（铁液流，4–14 小时）已进入商业部署，但尚无一家达到 GWh
              规模。抽水蓄能仍是最便宜的多日选项，但受地理限制，且无法在现有站点上增量添加。

              EnerVenue 的位置跨越两个层级：它的 Aqueous Metal
              Cell（AMC）足够灵活，可支持两到十二小时放电；循环耐久性足以服务高循环工商业应用；安全性也足以进入排除锂离子的石化和数据中心选址。因此，竞争格局随客户细分变化：寻求最低资本开支的电网运营商会正面遇到
              Tesla 和 BYD；安全关键或极端环境买家面对的选择窄得多，主要由 EnerVenue 和在超长时场景中的 Form Energy 主导。
