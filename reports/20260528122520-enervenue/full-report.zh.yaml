      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              EnerVenue 的创始故事在官方和独立来源中都有较完整记录。Yi Cui 是 Stanford University 材料科学讲席教授，也是多种电池化学体系的发明人；他从 NASA 授权镍氢技术，并于
              2020 年创立 EnerVenue。公开来源一致显示 Cui 为非执行董事长；他的 Wikipedia 条目和 Stanford 个人资料都确认，Stanford 是其主要职位，EnerVenue 是从
              Stanford 孵化出来的公司。Cui 持有电池架构的关键早期专利，并在电池材料科学上有大量发表，这让 IP 叙事具备少见的可核验科学基础。

              本次抓取资料包中，CEO 交接是最重要的治理信号。Jörg Heinemann 自 2020 年起担任创始 CEO，并被公开归功于搭建公司商业战略，覆盖 2021 年 Series A 和 2024 年
              Series B。多家独立来源称 Heinemann 于 2024 年底离职；EnerVenue 约 16 个月没有公开宣布继任者。energy-storage.news 确认，Henning Rath 自
              2026 年 4 月 1 日起出任 CEO。这个空窗是实质性治理数据点：公司在没有确认首席执行官的情况下，用一年多时间推进 $300M
              延展轮融资，并管理活跃客户部署。任何后续尽调都应优先确认管理层厚度和持续任职承诺。

              除 Cui 和 Rath 外，公开记录对具名高管披露有限。Peter Lee 曾任 Andreessen Horowitz，现任 Full Vision
              Capital；他在种子轮支持公司，也是公开可见的支持者，但本次抓取资料包未确认其正式董事会头衔或当前席位。SLB 和 Aramco Ventures 牵头 2021 年 Series
              A，但其投资人治理安排也没有公开细节。因此，正式董事会构成、投资人权利条款和股权结构表经济条款，仍是任何严肃尽调流程中最重要的未披露事项。
