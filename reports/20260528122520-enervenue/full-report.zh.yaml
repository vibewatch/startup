  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >
              EnerVenue 运营的是以硬件为中心的收入模式：它把 Energy Storage
              Vessels（ESV）——镍氢电池单元——直接销售给公用事业、工商业运营商和电网开发商。收入在项目交付时确认，因此天然呈现波动性，并绑定大型资本采购周期。公司没有公开披露经常性服务或 SaaS
              层；不过，它已推出 20 年 / 20,000 次循环质保产品，这可能带有单独变现的服务组件。


              渠道伙伴强化了分销：Towngas 拥有 2021 年建立的中国大陆独家分销协议，Avid Group 于 2024 年 8 月签署主供货协议，在澳大利亚和西非供应 EnerVenue 第四代
              ESV-4。公司未公开披露价目表。独立 BESS 市场分析师估算，以当前产量看，公用事业级硬件的装机系统成本为 $350–$450/kWh，前期资本开支大致与磷酸铁锂（LFP）持平。EnerVenue
              的商业论证靠更低的 30 年平准化储能成本（LCOS）支撑；驱动因素是其宣称的零衰减、30,000 次循环设计寿命，可省掉 LFP 部署中常见的中期补容成本。


              主要收入验证来自具名客户交易：High Caliber Energy 为 Florida 公用事业合作社项目下达 25 MWh 订单（2023 年）；向 RWE Milwaukee 测试设施供应试点部署（2024
              年 12 月宣布）；以及与 Duke Energy、Towngas 和 Avid Group 的供货关系。CEO Jorg Heinemann（现已由 Henning Rath 接任）披露，截至 2024
              年中，订单储备为 $2.3B，管线为 56 GWh，同比增长 8 倍，但公司尚未公布收入确认排期。
