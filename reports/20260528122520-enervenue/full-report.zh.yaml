  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础分层与买方画像
        blocks:
          - type: paragraph
            body: >
              EnerVenue
              面向四类核心买方，每类买方的采购动态、合同结构和储能需求都不同。公用事业公司和独立电力生产商（IPP）构成基石客群，它们采购大规模储能，用于满足电网可靠性要求、可再生能源平滑义务和长时容量目标。面对公用事业客户，EnerVenue
              用 30 年期总拥有成本竞争，把 30,000 次循环设计寿命和零增容模型，对标锂离子每 5–7 年一次的替换周期。公用事业采购路径很长——监管申报、竞争性
              RFP、信用承销，有些美国司法辖区还需要州公用事业委员会批准（例如 Dominion Energy 向 Virginia State Corporation Commission
              提交的试点提案）。商业与工业（C&I）客户包括制造场站、矿业运营和海事 / 海上项目，它们寻求表后韧性、降低需量电费和离网能力。EnerVenue 最早的供应协议就面向这一客群：Sonnell Power
              Solutions（波多黎各工业部门）和 Green Energy Renewable Solutions/Nicon（丹麦海事 /
              重工业）。镍氢化学体系的防火和极端温度特征，是这些面对独特安全与环境法规的买方最看重的差异点。偏远微电网和矿业客户由澳大利亚区域伙伴 Avid Group
              服务，构成第三类客群；在技术人员到访成本高的地点，EnerVenue 的低维护、高耐久定位可降低总运营成本。最后，AI 数据中心是新兴买方画像；EnerVenue 可在 60°C
              环境温度下运行，且高密度紧凑布置（无需消防）契合超大规模数据中心经济性，但截至 2026 年 5 月尚无已确认数据中心客户。买方画像覆盖公用事业采购负责人、EPC 咨询公司（美国东南部的 High Caliber
              Energy、澳大利亚的 Avid）、项目开发商（Pine Gate Renewables），以及工业企业的可持续发展 / 能源负责人。
