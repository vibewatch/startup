      - number: '6.5'
        title: 反向信号、交付风险与证据质量
        blocks:
          - type: paragraph
            body: >
              多个反向指标削弱了正面客户叙事。最实质的是 Kentucky gigafactory 撤退：EnerVenue 2023 年 3 月宣布建设 1 GWh/year Kentucky
              工厂，在潜在美国客户中拉高预期，随后悄然撤出 Shelby County 场地（Canadian Solar 随后接手该地点）。EnerVenue 将决定归因于加速 Gen-4
              开发，但结果是公司近期没有美国规模化制造能力，这限制了 IRA 本土内容规则下的美国公用事业采购。ATS Ohio 生产自动化诉讼强化了这一叙事：争议集中在 EnerVenue 被指于 2023 年 3
              月停止支付一份 $5.7M+ 自动化生产系统合同（同一时期公司宣布 Kentucky 工厂），且法院于 2025 年 9 月对 EnerVenue 抗辩下达不利推定指令。Luminostics v.
              EnerVenue 违约案（Alameda County，2023 年）涉及场地改造，虽与客户部署无关，但暗示更广泛的供应商管理摩擦。记录中没有客户侧产品故障、热事件或现场性能投诉，也没有与客户项目中断相关的
              WARN Act 裁员通知。但缺少独立提交的投诉，也可能只是因为迄今生产部署数量很少——多数客户尚未收到并在现场运行大批量产品。几乎所有客户关系的证据质量都停留在新闻稿层级：客户高管在 EnerVenue
              发布的新闻稿或关联媒体报道中被引用，而不是出现在独立审计、认证或运营性能报告中。唯一部分例外是 Dominion Energy 向 Virginia State Corporation Commission
              提交的文件，它代表了经过第三方裁定的采购记录。
