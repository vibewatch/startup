  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界——从全部固定式储能到 EnerVenue 的相关切口
        blocks:
          - type: paragraph
            body: >-
              EnerVenue
              的相关市场不是全部固定式储能，而是一个特定切口：高循环次数、长日历寿命和不可燃化学体系能转化为买家价值。固定式储能涵盖电网级电池系统、表后分布式储能，以及关键基础设施备用电源。EnerVenue 的 Energy
              Rack 和 Energy Prism 产品瞄准电表前公用事业级和商业韧性场景，明确排除 EV
              和消费电池；后两者有独立供应链，也与循环寿命没有实质重叠。主导年度部署量的短时四小时锂离子套利系统处在边界线上：它们争夺同一批公用事业采购预算，但很少需要 EnerVenue 核心价值主张中的 30,000
              次循环耐久性。更可防守的边界，是需要六小时及以上放电时长、安全受限选址（数据中心、医院、学校），或 20
              年以上替换周期、使摊销电芯成本成为主导经济指标的应用。主要替代品包括磷酸铁锂（LFP）锂离子电池包（循环寿命更短、前期成本更低）、钒氧化还原液流电池（寿命长、不受地理位置限制，但系统成本更高）、铁空气电池（Form
              Energy，尚未在规模上验证），以及抽水蓄能（资本开支大、受地理限制）。EnerVenue 已完成 UL 1973 电芯认证和 UL 9540A
              滥用测试；在美国多数州，这些都是公用事业采购和保险批准的必要前提。
