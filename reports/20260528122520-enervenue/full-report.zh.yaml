  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: EnerVenue 最高的残余风险集中在制造爬坡可信度和 FEOC/关税敞口，其次是投资人-合作伙伴集中度和 Gen 4 重新认证。财务和竞争风险也不小，但近期 $300M 融资和差异化化学体系提供了部分缓冲。
    data:
      columns:
        - 发生概率
        - 影响
        - 缓释成熟度
        - 残余严重性
      rows:
        - label: FEOC 和关税敞口（中国制造）
          values:
            - label: 高
              tone: negative
              detail: 中国原产制造已确认；FEOC 规则 2026 年 1 月生效。
            - label: 严重
              tone: negative
              detail: 美国客户无法获得 ITC 资格；直接进口关税约 82%。
            - label: 极低
              tone: negative
              detail: 未宣布美国组装；未披露关税豁免路径。
            - label: 严重
              tone: negative
              detail: 美国市场准入风险和客户成本负担仍未缓释。
        - label: Gen 4 制造爬坡和重新认证
          values:
            - label: 中高
              tone: warning
              detail: 常州产线目标 2026 年达到 250 MWh，但没有第三方验证。
            - label: 高
              tone: negative
              detail: 延期会把商业交付和可被银行接受的 UL 认证推到 2027 年以后。
            - label: 低
              tone: negative
              detail: Kentucky 放弃建厂是此前爬坡失败；Gen 4 UL 测试仍在推进。
            - label: 高
              tone: negative
              detail: Gen 4 测试完成且承购合同落地前，残余风险仍高。
        - label: 投资人-合作伙伴集中度（NEOM、Towngas、Aramco）
          values:
            - label: 中
              tone: warning
              detail: NEOM 2026 年 3 月取消 $6.85B 合同；Towngas 承受地产行业压力。
            - label: 高
              tone: negative
              detail: 任一战略伙伴退出，都会削弱管线、品牌和区域市场准入。
            - label: 低
              tone: warning
              detail: 地理分散（香港枢纽）只覆盖一部分；中国没有已披露替代分销商。
            - label: 高
              tone: negative
              detail: 三大区域锚点同时承压，且未披露应急方案。
        - label: 行业财务风险（竞争对手破产、LFP 价格压力）
          values:
            - label: 中
              tone: warning
              detail: Ambri、Nilar、AMTE 于 2024 年破产；ESS Inc. 2026 年 4 月几乎无现金可用。
            - label: 高
              tone: negative
              detail: 形成行业先例；LFP 约 $80/kWh，挤压替代化学体系的溢价。
            - label: 中
              tone: warning
              detail: EnerVenue 已融资 $445M，且宣称 30,000 次循环，与 LFP 拉开差异。
            - label: 中高
              tone: warning
              detail: TCO 溢价叙事取决于循环寿命主张，但该主张尚未在规模化场景验证。
        - label: CEO 交接和领导层深度
          values:
            - label: 中低
              tone: neutral
              detail: Henning Rath 2026 年 3 月上任；交接期正撞上常州爬坡。
            - label: 中
              tone: warning
              detail: 爬坡期执行差，会直接拖慢首批商业交付。
            - label: 低
              tone: warning
              detail: Rath 有供应链背景，但缺少 LDES 电池制造经验。
            - label: 中
              tone: warning
              detail: 若工厂管理团队足够强，残余风险可控；目前尚未确认。
    approximationNotes: 热力图评级是有来源支撑的序数判断，不是量化结果。它们基于可获得公开证据衡量相对严重性，用来排序残余敞口，而非表达合成概率。
    claimRefs:
      - CR001
      - CR005
      - CR015
      - CR016
      - CR017
      - CR019
      - CR025
      - CR026
      - CR028
      - CR031
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: EnerVenue 风险沿两条主线传导：制造与商业执行，以及地缘政治和财务伙伴压力。两条线最终汇合到客户采用和收入，而后者决定估值支撑和融资需求。
    data:
      nodes:
        - id: mfg
