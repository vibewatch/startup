  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户价值主张
        blocks:
          - type: paragraph
            body: >
              EnerVenue 卖的是面向电网数十年经济性的储能基础设施，而不是服务消费电子短周期需求的电池。公司把自己定位成基础设施公司：储能系统必须连续运行 30 年，且不出现重大衰减、增容或人工干预。EnerVenue
              认为，这与锂离子电池系统内生的「替换并增容」周期，本质上是不同的买方契约。

              从客户工作流看，EnerVenue 切的是电网级和商业与工业（C&I）储能中的一个明确痛点：锂离子技术带来的高总拥有成本（TCO）。这些成本来自频繁增容、复杂热管理要求，以及强制消防基础设施。一个采用锂离子电池的
              100 MWh 项目，投运时必须超配（装机 127–219 MWh）以覆盖衰减，并通常在 20 年项目期的第 5、12、15 年再次投入增容资本，进而让债务偿付、长期收入建模和运维规划都变复杂。

              EnerVenue 直接拿掉增容周期。其 Aqueous Metal Cell（AMC）技术只需投运 112 MWh 容量，就能在 20 年内交付 100 MWh 合同输出，因为系统第 20 年仍保有 93.2%
              健康状态。经济性比较因此从名义容量资本开支，转向全生命周期吞吐量和平准化储能成本（LCOS），这正是 EnerVenue 声称拥有结构性优势的地方。试点客户覆盖公用事业级（RWE、Dominion
              Energy）、大型能源供应商（Towngas），以及未来规划中的 C&I 微电网和数据中心周边应用。产品以 DC block（Energy Rack 或 Energy
              Prism）形式销售，买方接入自选功率转换系统（PCS）；集成商获得灵活性，EnerVenue 则保留自研电芯和电池管理系统。
