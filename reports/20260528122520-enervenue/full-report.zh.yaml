      - number: '3.3'
        title: 长时替代方案——小众定位、进展与缺口
        blocks:
          - type: paragraph
            body: >-
              Form Energy 是知名度最高的长时替代方案；从结构上看，它更像 EnerVenue 的互补者，而不是直接竞争者。其铁空气电池瞄准 100 小时连续放电——这是 EnerVenue
              两到十二小时画像并不覆盖的市场。Form 于 2026 年 2 月宣布与 Google、Xcel Energy 达成 $1B 合作，用于 Minnesota 300 MW / 30 GWh
              系统，显示出真实商业牵引力；Form 至今已融资 $1.4B，并计划再融资 $500M。关键取舍在于往返效率只有 40–50%，约为 EnerVenue 宣称 90%+ 的一半；$20/kWh
              系统成本目标在商业规模上仍属愿景。Form 位于 West Virginia Weirton 的 Factory 1 约有 400 名员工——相对于项目管线仍是温和产能足迹。

              Eos Energy 的水系锌混合体系（DawnOS 平台）运行在四到十小时区间，并已实现规模商业部署：2026 年 Q1 收入 $57M，同比增长 445%；订单积压 $644.6M，代表 2.6 GWh；截至
              2026 年 5 月，仍确认 $300–400M 的 2026 年收入指引。Eos 与 Cerberus Capital 成立 Frontier Power USA，目标是加速项目融资。尽管指标改善，Eos
              仍处于毛亏状态，反映其自动化制造爬坡仍带有初创性质。

              ESS Inc 的铁液流电池已在 Turlock Irrigation District（California）完成公用事业级投运，并获得 U.S. Air Force Research Laboratory
              $9.9M 奖励，但公司处于“运营重置”阶段，停掉早期产品后转向 Energy Base 产品。钒氧化还原液流电池（Invinity、VRB Energy）瞄准高价值 4–14 小时电网项目；该市场预计到
              2026 年底达到 $1.1B。液流系统可实现 15,000–20,000 次循环，但往返效率中等（60–80%），且需要定期维护电解液。相对这一组玩家，EnerVenue
              的更高循环寿命和更简单维护画像是主要差异点。
