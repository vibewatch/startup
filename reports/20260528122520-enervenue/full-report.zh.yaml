      - number: '1.4'
        title: 商业里程碑、反向信号与证据缺口
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 5 月，EnerVenue 最重要的商业验证点是 2024 年 12 月的 RWE 试点，以及 2026 年 5 月 15 日在 Changzhou 的 Towngas 投运。独立行业报道把
              RWE 部署描述为 EnerVenue 首个欧洲公用事业合作；RWE 采购和独立确认均出现在多份来源中。Towngas 投运涉及 EnerVenue 的 Generation 4 AMC
              产品，也是在公司新中国制造基地公开确认的首个商业安装。Australia 的 Avid Group 以及 Duke Energy、Dominion Energy
              等具名美国公用事业客户，都在第三方报道中作为管线客户出现，但本次抓取资料包未确认这些客户已有签约并投运的合同。

              Kentucky 工厂撤出是本章最实质的反向运营事件。EnerVenue 曾公开计划在 Kentucky 建立美国制造基地；EnerVenue 于 2024 年 11 月撤出后，Canadian Solar
              随后收购该设施，用于自身 BESS 和电芯生产。多份来源把撤出归因于 Generation 2 生产延误，以及公司决定借助现有 Changzhou 供应链。公司新的制造目标是到 2026 年 Q3 达到 250
              MWh、到 2027 年达到 1 GWh，且目前所有生产都在中国。法律层面的反向信号是 ATS Ohio Inc. v. EnerVenue Inc.，Ohio 南区案号 2:2023-cv-04187；ATS
              称其为 EnerVenue 建造电池装配系统，索赔约 $5.7M。公开可得的起诉文件记录了争议，但没有记录结果或和解。

              下一阶段尽调最关键的证据缺口包括：当前收入和单位经济、正式董事会名单与投资人权利条款、当前 2026 年订单储备数字，以及 Ohio 诉讼的解决方案或当前状态。作为一家成立五年的硬件公司，EnerVenue
              拿到了异常强的第三方背书；但缺少收入数据、CEO 治理空窗和工厂转向三者叠加，意味着任何投资建议前都必须仔细审查执行风险。
