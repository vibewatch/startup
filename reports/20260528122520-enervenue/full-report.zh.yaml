      - number: '7.3'
        title: 地缘政治与供应链风险——FEOC 暴露、关税和镍集中度
        blocks:
          - type: paragraph
            body: >-
              EnerVenue 决定在中国常州制造，是投资案例中最关键的单一地缘政治风险因素。根据 2026 年 1 月生效的美国 FEOC 规则，在中国制造的 BESS 组件很可能让美国客户无法根据 Inflation
              Reduction Act 申请投资税收抵免（ITC）。对中国制造 BESS 约 82% 的综合有效关税——来自 Section 301 关税、对等关税和标准 MFN
              税率——进一步抬高任何直接进口场景的到岸成本。尽管 2026 年中曾讨论对商业和工业储能做部分关税缓和，但电网级产品仍完全暴露。

              IRS 本土内容奖励抵免增加了另一层约束：美国客户若想为符合本土内容资格的项目申请奖励抵免，就不能把中国制造组件计入门槛。EnerVenue
              尚未披露任何美国本土组装设施或制造伙伴关系。没有美国场站，公司在美国市场只能服务不依赖 ITC 或本土内容抵免的客户，这排除了很大一部分公用事业级项目开发商。

              供应链侧，EnerVenue 的镍氢化学体系绕开了锂和钴风险，却引入 I 类硫酸镍暴露。Indonesia 供应全球约 60-65% 镍，电池级硫酸镍的 HPAL 加工路线依赖经 Hormuz Strait
              运输的硫供应。2026 年中东战争已经提高了依赖这一路线的大宗商品风险溢价。EnerVenue 的 NEOM Investment Fund 也承压，因为 NEOM 在 2026 年 3 月取消了 $6.85B
              建设合同——这是沙特超级项目规模收缩的信号。EnerVenue 的中国独家分销商 Towngas，也面临 S&P Global 分析师评论所记录的中国地产下行带来的财务压力。
