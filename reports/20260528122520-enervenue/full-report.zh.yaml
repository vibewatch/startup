            body: >-
              BloombergNEF 数据显示，磷酸铁锂电池包价格在 2025 年下跌约 45%，固定式储能价格创下约 $70/kWh 的历史低点，跌幅约为前几年三倍。这直接挑战 EnerVenue
              的前期成本竞争力，也压缩了折现率高于约 8% 的买家的回本论证。在该价格下，只有需要全寿命 8,000 次以上循环的应用，才会明确支持 EnerVenue 的 LCOS 账。
