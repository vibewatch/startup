      - number: '5.2'
        title: 产品线与模块架构
        blocks:
          - type: paragraph
            body: >
              EnerVenue 的商业产品层级是模块化、分层式的：Aqueous Metal Cell（AMC）是不可拆分的基础单元；Energy Rack 是可部署单元；Energy Prism 是可直接进场的集装箱式
              DC block；Energy Venue 则是用于多兆瓦时室内建筑部署的设计概念。模块化架构让项目可从单个 150 kWh 机架扩展到数百 MWh 部署，而无需重做核心部件设计。

              AMC 电芯（截至 2026 年为第四代）在密封大尺寸 Ni-H2 电芯中提供 3.0 kWh 标称能量。每个电芯额定循环寿命超过 30,000 次，并允许 100% 放电深度。单个 Energy Rack 集成
              50 个 AMC 电芯、预接线电池管理系统（BMS）和全部互连件，形成 150 kWh、1,500 Vdc 标称单元，工厂组装后发货，现场安装从数周缩短到数小时。Energy Rack 兼容 1,000 Vdc
              和 1,500 Vdc 系统架构，可堆叠至三排高，并支持室内或室外部署。Energy Prism 将六个 Energy Rack 封装进户外等级集装箱（900 kWh），在 DC
              母线处直接连接逆变器——这是从交付到并网的最快路径。Energy Venue 概念支持在专门建筑内做多机架安装，并在分布式或集中式配置下共址 PCS 设备。所有产品层级在 30 年设计寿命内都不需要增容。
