      - number: '6.4'
        title: 留存、扩张信号与集中度风险
        blocks:
          - type: paragraph
            body: >
              EnerVenue 不公开披露净留存率（NRR）、总留存率（GRR）或客户队列数据；考虑到公司阶段和硬件为主的模型，续约动态不同于
              SaaS——每一次留存事件都是后续订单或部署阶段，而不是年度订阅续约。最强的扩张信号来自 Towngas 关系：从 2021 年分销协议，合作扩展到 2026
              年活跃试点和相关领投方角色，显示五年内多阶段加深。EnerVenue CEO Rath 称试点很可能在未来几个月直接转为销售订单，这意味着当前试点队列（RWE、Dominion、Towngas
              Gen-4）近期可能转化为生产订单，但截至 2026 年 5 月尚无独立确认的转化。集中度风险体现在两条轴线上。第一，Towngas（以及延伸的 Peter Lee/Full Vision Capital 和
              Henderson Land）同时承担分销商、首个客户和领投方角色；一旦 Towngas 关系恶化，EnerVenue 的亚太渠道、最大机构支持方和最醒目参考客户会同时受损。第二，EnerVenue
              制造完全基于中国常州（当前唯一在建的大批量产线），让美国公用事业客户面临 IRA 本土内容条款下的供应集中风险——寻求本土内容激励的公用事业采购可能被阻断。已放弃的 Kentucky
              工厂直接说明了这一风险：EnerVenue 目前没有美国制造能力，美国生产就绪时间表仍未解决。客户证明质量几乎全部来自新闻稿引用的背书，而非独立评价；未发现 G2、Gartner Peer Insights
              或同类平台评价。ATS Ohio 诉讼（2023 年 12 月提起，2025 年 11 月和解）中，EnerVenue 停止向生产自动化承包商付款，反诉也被驳回，这对其制造纪律和供应商关系管理提出了可信度问题。
