      - number: '8.5'
        title: 退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              EnerVenue 的退出可选项主要有三条。第一，由现有投资者之一（Aramco、SLB）或互补型工业买家进行战略收购；这类买家会把 NASA IP 视为抵御锂电商品化的防御性护城河。Aramco
              Ventures 确认 EnerVenue 技术可以在规模化条件下改造关键基础设施，这显示出通常会先于收购讨论出现的战略信念。第二，由主权财富基金共同投资或全资收购，尤其是来自亚洲或中东的基金；HKIC、NEOM
              和 Towngas 在这些地区提供战略立足点。第三，围绕 LDES 基础设施主题，在 2028-2030 年 IPO，前提是拿出收入证据和干净的制造审计。若没有 12-18 个月已报告商业收入，IPO
              路径最不可能。

              关键否决触发器包括：制造里程碑错失超过 12 个月，投后估值低于 $800M 的降价轮，战略投资者退出，8 小时应用锂电成本突破 $80/kWh 以下，或到 2026 年 Q4 之后仍不披露收入。制造集中在
              Changzhou，可能削弱受本土内容要求或 CFIUS
              国家安全审查约束的美国战略买家的并购兴趣，限制退出可选项，并可能要求相对于美国本土战略收购方可比私营公司价值打折。投入任何重要仓位前，最终尽调必须包括：经审计的收入运行率、清算优先权堆栈瀑布模型、Changzhou
              产线独立制造准备度审计，以及针对 Gen 4 锂电 BESS 和铁空气替代方案的竞争替代分析。
