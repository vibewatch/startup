      - number: '4.3'
        title: 单位经济、成本结构与毛利率
        blocks:
          - type: paragraph
            body: >
              EnerVenue 的单位经济没有任何粒度的公开披露——毛利率、贡献毛利、每 kWh
              制造成本或运营支出拆分都未发布。公司的经济逻辑建立在几项结构性主张上：（1）镍氢化学体系使用水基电解液，不需要热管理基础设施，相对 LFP 可降低系统配套成本；（2）Gen 4 ESV 消除了铂基催化剂（NASA
              原始技术中的关键成本驱动），创始人 Yi Cui 目标是在规模化后把制造成本降至 $80/kWh 以下；（3）100% 可用放电深度，相比 LFP 的 80%，意味着每个名义 kWh
              可交付更多有效能量，改善系统经济性；（4）没有衰减驱动的补容周期，避免了 LFP 在 20 年项目中典型的约 $30–50/kWh 替换成本负担。


              Storlytics（2023）的独立 TCO 分析比较了 EnerVenue ESV 与 LFP 在中等循环（1.75 次/日）和高循环（2.1 次/日）场景下的 20 年项目经济性。两个场景中，ESV
              都因项目寿命内容量保持不变，而产生更优的每 MWh 交付年化成本。EnerVenue 自身 LCOS 分析把优势框定在约 $35–60/MWh，而美国 / 欧洲可比公用事业级 LFP 部署为
              $65–85/MWh。


              但规模化后的成本竞争力尚未获得独立验证。Changzhou 工厂尚未建成；当前销售来自早期技术的小批量定制部署，商业规模下的制造良率、缺陷率和单件成本不在公开领域。LFP 电池包价格在 2025 年降至
              $108/kWh（BNEF），为有记录以来最低，压缩了 EnerVenue
              必须弥合的相对资本开支差距，才能在装机成本上竞争。营运资本强度很高：硬件项目需要库存积累、交付前制造，以及与项目建设排期绑定的较长应收账款周期。
