        - from: lfp
          to: adoption
        - from: lfp
          to: revenue
        - from: adoption
          to: revenue
        - from: revenue
          to: financing
        - from: financing
          to: valuation
        - from: revenue
          to: valuation
    approximationNotes: 图表为有来源支撑的定性图，展示风险传导的合理因果方向，而非量化概率权重。边代表可能路径，不代表必然结果。
