      - number: '2.3'
        title: 买家细分与早期采用证据
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 5 月，EnerVenue 已点名买家集中在三个可识别细分。第一类也是最大的一类，是在州监管批准下推进长时试点项目的投资人所有公用事业公司：RWE 正在 Milwaukee 测试设施测试
              Gen2 金属氢容器；Dominion Energy 获 Virginia State Corporation Commission 批准三个 LDES 试点项目，其中 EnerVenue 承接 Virginia
              State University 的 1.5 MW / 10 小时系统，目标 2027 年底前投运；Duke Energy 和 High Caliber Energy
              也被点名。第二类是国际公用事业和开发商：Avid Group 在 2024 年签署澳大利亚主供货协议；Towngas 在 Jiangsu 省投运 Gen4 试点（2026 年 Q1）；Vedanta ESS 为
              South America 签约 525 MWh。第三个新兴细分是数据中心运营商：IEA 数据显示，2025 年全球数据中心用电需求增长 17%；S&P Global 预计美国数据中心电力需求到 2026 年达到
              75.8 GW，较 2022 年水平翻倍以上。EnerVenue 明确把不可燃水系化学体系作为卖点，称其可用于那些因锂热失控风险而无法选址的司法辖区或建筑。采购路径不同：公用事业通过综合资源规划和州委员会批准处理
              BESS；数据中心运营商通过直接资本开支或购电协议采购。没有独立来源确认 EnerVenue 已在试点规模之外，以公用事业生产体量完成大型商业项目。
