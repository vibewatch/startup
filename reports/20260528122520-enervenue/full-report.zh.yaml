      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              美国储能整体需求的主导驱动，是 IRA 对独立储能提供 30% 投资税收抵免；DOE 预计这将帮助美国储能到 2040 年增长到 200 GW 以上，而非 IRA 前轨迹为 50 GW。AI
              驱动的数据中心电力需求、用电量结构性增长，以及可再生能源并网需求，也继续拉动市场。与这些顺风相对，EnerVenue 自身最尖锐的约束是 LFP 锂离子成本通缩：BloombergNEF 数据显示，固定式储能
              LFP 电池包价格从 2024 年底约 $108/kWh 跌至 2025 年底约 $70/kWh，约十二个月下跌 45%，为有记录以来最低。这让 EnerVenue
              较高前期成本的回本账更难打，即便在项目时长足够时，高循环次数可能让长期平准化储能成本（LCOS）占优。EnerVenue 已于 2025 年退出与 Canadian Solar 的 Kentucky
              制造安排，转而依赖 Changzhou 的 Gen4 中国电芯产线，目标 2026 年 Q3 年产 250 MWh——这同时带来关税风险和供应链集中风险。更广泛的非锂风险也很清楚：Ambri、Nilar、AMTE
              Power 在 2024–2026 年相继破产或陷入财务困境。部分抵消这些约束的是：专业贷款方和独立工程师越来越愿意承保非锂系统（2026 年可融资性改善）；美国对中国来源 BESS
              的进口关税，为一家计划在美国组装的公司带来一定本土偏好顺风；EnerVenue 的 $300M Series B（2026 年 3 月）也为 Gen4 扩产提供现金跑道。
