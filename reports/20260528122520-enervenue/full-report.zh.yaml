      - number: '4.4'
        title: 商业牵引与收入信号
        blocks:
          - type: paragraph
            body: >
              EnerVenue 最具体的收入信号，是 CEO 披露的截至 2024 年中的 $2.3B 订单储备和 56 GWh 管线，同比增长 8
              倍。公司没有拆分确定采购订单、意向书或附条件协议，因此难以从公开数据评估订单储备转化为收入的时间。具名交易证据包括：High Caliber Energy 为 Florida 公用事业合作社项目采购 25
              MWh（目标 2024 年 Q4 交付）；Avid Group 针对澳大利亚和西非 ESV-4 部署签署主供货协议（2024 年 8 月）；向 RWE Milwaukee 设施供应试点（2024 年 12
              月）；以及 Dominion Energy 计划中的 Virginia 试点（2027 年，涉及 Virginia State University）。Duke Energy 和 Towngas（HK）也被
              Forbes 引为商业客户。


              分析师推导估算认为，EnerVenue 当前年收入约 $33.8M（2026 年），按 92 名员工计算，人均收入约 $245K。这些是第三方推断数字，不是公司披露数据。Mercom Capital 将
              EnerVenue 的 $308M 2024 年 H1 融资列入同期全球清洁科技 VC 交易前五，反映投资人对商业机会的信心，而非已证明的收入规模。


              EnerVenue 在 Time / Statista 的 2025 年美国顶尖 GreenTech 公司榜单中排名第 2，这带来品牌认知，可能支撑企业销售周期。公司 CEO Henning Rath
