  - id: TM001
    title: 市场边界——纳入支出、排除支出与替代品
    slug: market-definition-table
    insight: >-
      EnerVenue's relevant market is the intersection of long-duration (≥6h), high-cycle, safety-critical stationary
      storage — a materially smaller wedge than total BESS spend.
    columns:
      - 支出类别
      - 边界判断
      - 理由
    rows:
      - - 电网级 BESS（≥1 MW，≥4 h 放电）
        - 纳入
        - 核心目标细分市场；EnerVenue Energy Rack 和 Prism 面向公用事业级 IRP 采购设计
      - - 表后工商业储能（安全受限场址）
        - 纳入
        - 不可燃化学体系支持在数据中心、医院和学校部署
      - - 短时长 <2 h 套利系统
        - 边界
        - LFP 占主导；低于每日 2 h 循环时，EnerVenue 循环寿命优势基本无关
      - - 电动汽车电池
        - 排除
        - 供应链、形态和监管路径不同；技术上没有重叠
      - - 消费级 / 户用储能
        - 排除
        - EnerVenue 产品的尺寸和认证并非面向住宅安装
      - - 抽水蓄能
        - 排除
        - 资产类别不同；它是受地理约束的资本基础设施，不是电池化学体系
      - - LFP 锂离子（在位方案）
        - 替代
        - 前期成本更低，循环寿命更短（2,000–3,000 次），可燃；主要竞争威胁
      - - 全钒液流电池
        - 替代
        - 循环寿命长，系统成本更高；面向 6–12 h 应用的非地理依赖替代方案
    notes: 边界判断反映截至 2026 年 5 月的公开证据。EnerVenue 的 Gen4 产品数据表将电网级和工商业韧性列为主要用例。
