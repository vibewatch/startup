          - type: callout
            title: 制造转向中国带来地缘政治与执行风险
            body: >
              EnerVenue 在 2024 年末放弃 Kentucky gigafactory，并将大批量制造转到中国常州，这一战略决定带来集中的地缘政治和供应链风险。此举让 EnerVenue
              暴露于中美贸易摩擦、电池进口潜在关税，以及一个越来越由本土内容和 IRA 合规决定采购的市场中的声誉逆风。放弃 Kentucky 也形成了一个由生产延误驱动战略转向的先例：公司跳过整整一代产品（Gen 3）以加速
              Gen 4，结果造成进度滑坡。250 MWh 制造爬坡刚获得资金支持，但尚未证明。
            calloutType: risk
            claimRefs:
              - CE028
              - CE041
              - CE043
          - type: callout
            title: 低能量密度是产品最主要且难以规避的约束
            body: >
              EnerVenue 镍氢电芯的质量能量密度约 20–30 Wh/kg，而 LFP 电芯为 150–205 Wh/kg。这不是公司能靠制造效率弥合的差距，而是电化学本身决定的。EnerVenue
              的商业逻辑要求电网级固定式储能买家不把能量密度视为门槛标准。若应用场景看重占地（海上、屋顶、受限城市场站），AMC 在结构上缺乏竞争力。尽调应确认目标客户是否存在足以压过耐久优势的占地约束。
