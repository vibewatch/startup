      - number: '6.3'
        title: 伙伴渠道与采购架构
        blocks:
          - type: paragraph
            body: >
              EnerVenue 采用混合销售模型，把直接大型公用事业关系、区域分销伙伴和 EPC 中介结合起来。区域分销渠道由大中华区 Towngas 锚定——这是首个分销协议，签于 2021 年春季，让 EnerVenue
              进入 Towngas 覆盖中国大陆的公用事业和商业网络。关键在于，Towngas 母公司（Henderson Land，由 Peter Lee 共同担任主席）通过 Full Vision Capital 领投
              EnerVenue 2026 年 $300M Series B 延展轮，形成深度战略绑定，也带来实质利益冲突：Towngas 同时是亚太主要分销渠道、客户（试点场站和历史部署）和领投方。SLB（原
              Schlumberger）自早期融资轮起就是战略投资者，已签署合作协议，利用其全球能源行业版图推动 EnerVenue 固定式储能——这对中东、北非和全球能源转型市场中油气周边的公用事业与工业客户尤其相关。但正如
              CEO Jorg Heinemann 在 2024 年 6 月所说，相比 EnerVenue 直接管线，SLB 对实际销量的贡献仍小。在澳大利亚，Avid Group（总部 Perth
              的电气工程公司）担任整个大陆商业、矿业和微电网客户的主供应与集成伙伴，并计划用自身制造场地作为参考安装。High Caliber Energy（佛罗里达的 EPC
              与咨询公司）服务美国东南部和加勒比的公用事业与工业客户，并促成了佛罗里达 25 MWh 订单。Dominion Energy、RWE 等大型公用事业订单走直接采购路径，由多年供应协议和监管审查流程约束。High
              Caliber、Avid 等 EPC 中介通常寻找 C&I 和较小公用事业项目，压缩 EnerVenue 在 100 MWh 以下部署的销售周期。Saudi Aramco Energy
              Ventures（早期投资者）为中东市场提供商业化路径，当地电网级储能采购由国家公用事业驱动，且高度依赖关系。
