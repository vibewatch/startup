      - number: '3.2'
        title: 锂离子在位者——规模、成本与替代风险
        blocks:
          - type: paragraph
            body: >-
              锂离子的主导地位建立在三十年的制造迭代之上。Tesla 于 2025 年 9 月发布的 Megapack 3 和 Megablock 系统，每台约 5 MWh（高于此前 3.9 MWh），中压下往返效率
              91%，设计寿命 25 年、额定循环超过 10,000 次；Houston Gigafactory 目标年产 50 GWh。2026 年大型公用事业项目的交钥匙装机成本为每 kWh $400–550。BYD 的
              HaoHan 平台推进得更远：每个 DC block 为 14.5 MWh，循环超过 10,000 次，且宣称全寿命能源成本低于每 kWh
              $0.014。中国制造商的垂直整合正在侵蚀西方挑战者仅剩的成本缓冲；全球前 10 大 BESS 集成商中已有 8 家是中国公司。

              Fluence（AES + Siemens）处在结构上不同的竞争位置——它是系统集成和软件业务，而不是电芯制造商。其 $5.6B 订单积压、$3.2–3.6B 的 2026 年收入指引，以及 41 GW /
              147 GWh 未签约管线，反映了它在复杂公用事业级项目和长期 O&M 上的优势。Fluence 的 Mosaic EMS 和服务合同通常持续 10–20 年，形成耐久客户锁定；EnerVenue
              当前分销模式无法匹配。

              对 EnerVenue 目标细分而言，所有锂离子系统的关键限制是热管理约束。锂离子电芯通常只有在约 5–30°C 范围内才能安全运行，并需要主动热管理和 HVAC。典型电网工况下，它们额定循环为
              6,000–8,000 次，需要每五到七年进行容量补容。BNEF 的 2024 年 Long-Duration Energy Storage Cost Survey 发现，在八小时以上时长，LDES
              技术已经能提供比锂离子更便宜的储能；BloombergNEF 电池价格指数记录，截至 2025 年 12 月 LFP 电池包价格为 $108/kWh，压低了在位者单位成本，但尚未抹平 EnerVenue
              无需补容画像下的全生命周期成本差距。
