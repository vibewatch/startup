    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、技术与商业模式
        blocks:
          - type: paragraph
            body: >-
              EnerVenue 自称是一家电网级储能公司，把 NASA 与 Ford Aerospace 最初为航天器供电开发的镍氢电池化学体系改造为商业产品。公司官网介绍与独立技术资料一致认为，第四代 Aqueous
              Metal Composite（AMC）化学体系宣称循环寿命 30,000 次，可在约 -40°C 至 +60°C 范围内运行且无需主动热管理，也不需要液态电解液。EnerVenue
              以此强调其相对锂离子替代方案的耐久性和安全性。Stanford University 讲席材料科学教授 Yi Cui 从 NASA 授权该技术，并于 2020 年在 California 州 Fremont
              共同创立公司。Generation 4 电芯使用 400 Wh 单元，面向公用事业级多小时储能，而不是短时调频。

              从公司公开材料和独立行业报道看，EnerVenue 的商业模式以硬件为核心：公司制造电池系统，并销售给公用事业和独立发电商，用于固定式电网储能；收入确认跟随实体项目交付，而不是订阅或软件模式。Forbes 于
              2024 年 6 月把 EnerVenue 列为最新 ClimateTech 独角兽；同月，公司 CEO 披露了 $2.3B 订单储备，约等于 56 GWh 管线。TIME 将 EnerVenue 列入 2025
              年美国十大 GreenTech 公司。这些认可信号旁边也有实质性警示：研究期内公司未披露任何收入数据，Kentucky 制造基地被放弃，转向中国 Changzhou
              生产，一起联邦合同纠纷仍未解决。就尽调而言，更应把 EnerVenue 视作一家后种子期硬件初创公司：它已拿到大量投资人资金和早期客户证明，但尚未证明大规模单位经济或经常性收入。
