  - id: TV005
    title: 投资逻辑击穿与否决触发表
    layout: standard
    notes: 触发项定义为客观阈值；一旦触发，不重新完整承销就无法维持投资逻辑。它们是早期预警信号，不是基准情景预测。Kentucky 放弃一事已经证明，运营风险真实且可能重演。
    columns:
      - 触发项
      - 阈值
      - 传导机制
      - 行动含义
    rows:
      - - 制造里程碑失手
        - 常州 250 MWh 产线较 2026 年投运目标延误至少 12 个月。
        - 释放规模化执行能力不足信号；第二次放弃工厂的模式风险上升。
        - 暂停后续出资；任何新资金进入前要求独立制造运营审计。
      - - 降估值融资
        - 下一轮股权融资投后估值低于 $800M。
        - 释放投资者信心崩塌信号；所有现有优先股头寸需要下调估值。
        - 立即重估；建模清算优先权瀑布对普通股等价价值的影响。
      - - 战略投资者退出
        - Aramco Ventures 或 SLB 减持或退出股权结构，且没有确认的战略收购理由。
        - 移除主要分销验证方；说明战略合作信心流失。
        - 下调至悲观情景；重新审视油田和公用事业细分的市场准入假设。
      - - 锂成本突破
        - LFP BESS 在 8 小时等效储能中达到 $80/kWh 或以下，并具备经认证 30 年循环寿命。
        - 消除基础设施级应用中镍氢的 TCO 优势；护城河坍塌。
        - 从头重新承销投资逻辑；EnerVenue 的循环寿命护城河依赖锂电无法补齐差距。
      - - 2026 年后仍不披露收入
        - 尽管常州达到投运里程碑，到 Q4 2026 仍未披露 ARR 或收入运行率。
