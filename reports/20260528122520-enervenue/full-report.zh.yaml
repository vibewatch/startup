      - number: '8.3'
        title: 可比公司与市场倍数
        blocks:
          - type: paragraph
            body: >-
              EnerVenue 没有直接的公开市场可比标的。最可操作的上市可比公司是 Fluence Energy（NASDAQ: FLNC）：截至 2026 年 5 月，该公司 TTM 收入 $2.58B，企业价值约
              $3.9B，交易倍数约为 1.5x EV/sales。Fluence 的倍数来自其在全球电网级锂电 BESS 项目中完全商业化且多元化的收入基础。EnerVenue
              的化学体系差异化溢价，必须足以抵消其收入前阶段折价。Fluence FY2026 指引为 $3.2B-$3.6B 收入，且 85% 由订单储备覆盖，说明要从“继续研究”阶段去风险化，需要达到怎样的商业规模。

              私营 LDES 公司中，Form Energy 是最清晰的可比对象：估值约 $3.5B-$4.2B，已融资超过 $1.2B，并拿到 Google 100 小时铁空气电池的标志性 $1B 合同。其相对
              EnerVenue 的估值溢价，来自已经展现的收入拐点。Highview Power 估值约 $1.6B-$2.0B。Eos Energy Enterprises
              则是警示性上市可比标的：商业化后的执行困难，使其在 2024 年接近破产。Energy Vault 显示了收入落地后倍数压缩的路径。

              套到 EnerVenue，如果 2027 年预计 ARR 为 $150M，5x 远期收入倍数给出约 $750M，9x 给出 $1.35B（基准情景），而对 $300M 收入使用 8x 倍数则给出
              $2.4B（牛市情景）。近期最有防守性的底线是重置成本：从零复制 EnerVenue 的 NASA IP 使用权、UL 认证和供应链，成本将显著高于当前隐含估值区间；即便缺少收入证据，这也提供了基本锚点。
