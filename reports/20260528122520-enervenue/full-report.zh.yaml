      - number: '7.4'
        title: 财务、竞争与市场风险——行业先例和 LFP 价格压力
        blocks:
          - type: paragraph
            body: >-
              EnerVenue 的财务风险画像起点相对较强：截至 2026 年 3 月，公司累计股权融资约 $445M，资本化程度好于近期破产的任何非锂 BESS
              同业。但行业先例令人警惕。Ambri（液态金属电池）尽管融资超过 $150M，仍在 2024 年 6 月申请破产。Nilar 和 AMTE 也在 2024 年宣告破产。钒液流和铁空气竞争者 ESS Inc.
              据报道截至 2026 年 4 月实际上已耗尽现金。这些公司都在达到商业规模前，被 LFP 价格下跌压力击穿。EnerVenue 面对同样的结构性挑战：必须在 $445M 融资耗尽前，证明 Gen 4
              性能并跑出可融资的商业部署。

              竞争定价环境是行业压力的底层催化剂。2026 年，全球四小时储能项目价格已压缩至约 $80/kWh，部分产品接近 $60/kWh。BNEF 分析指出，新型长时技术开始在 8 小时及更长应用上边际竞争，但 LFP
              在 4-10 小时区间仍凭成本占主导。EnerVenue 的 TCO 优势依赖需要数十年而非数月验证的循环寿命主张。短期内，公司必须靠承诺竞争，而不是靠已验证商业记录。

              竞争侧，Form Energy 的铁空气电池管线在 2025 年 10 月至 2026 年 4 月间增长约 375%，Google 通过 Xcel Energy 部署 300 MW/30 GWh
              系统。铁空气技术提供相近的长时叙事（100+ 小时、每 kWh 成本更低），且商业部署路径走得更远。截至 2026 年中，EnerVenue 的商业部署仍只包括 RWE、Towngas 和 Dominion
              Energy 的试点项目，尚未产生收入。Aramco Ventures 提供中东分销渠道，但 Aramco 投资也与影响 NEOM 的同一地缘政治环境相连。
