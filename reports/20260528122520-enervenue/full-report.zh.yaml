      - number: '7.2'
        title: 监管、法律与安全风险——认证缺口和一项已解决诉讼
        blocks:
          - type: paragraph
            body: >-
              EnerVenue 的监管风险有两层。第一层是认证连续性：公司在 2023 年完成 Gen 2 设计的 UL 1973 和 UL 9540A 安全测试，证明诱发热失控时没有火焰蔓延。但 Gen 4
              设计变更需要完整再认证周期。在 Gen 4 通过 UL 1973 和 UL 9540A 前，项目贷款方会谨慎对待其可融资性。NFPA 855:2026 又增加了一层合规要求，几乎所有 BESS
              项目都必须做危险缓解分析（Hazard Mitigation Analysis），包括使用新型化学体系的项目。EnerVenue 含氢气的压力容器设计，可能需要在标准锂离子 BESS
              审查路径之外提供额外合规文件。

              第二层是知识产权。EnerVenue 持有多项美国专利，包括 US Patent 12,107,249（2024 年 10 月授权），覆盖金属氢电池的电极堆叠配置。但核心镍氢化学体系源自 NASA
              专利，其中多数现在已进入公有领域。EnerVenue 的竞争护城河主要在应用工程和制造工艺，而不是基础化学。由于公司在中国制造，风险进一步上升：在中国对本地竞争者执行美国注册专利，实质上比在美国法院更难。

              诉讼方面，ATS Ohio, Inc. 于 2023 年在 Ohio Southern District Court 对 EnerVenue 提起商业诉讼（案号 2:23-cv-04187）。在法官已经针对
              EnerVenue 反诉下达强制不利推定指令后，双方约定于 2025 年 11 月以不得再诉方式驳回。案件已解决，但它说明 EnerVenue 曾卷入足以进入联邦法院的商业合同争议。截至 2026 年 5
              月，未披露其他未决诉讼。
