      - number: '4.2'
        title: 融资形成与资本充足性
        blocks:
          - type: paragraph
            body: >
              按 Tracxn 跟踪并与 SEC Form D 文件交叉核对，EnerVenue 已在四轮融资中筹集约 $745M。首次 SEC 注册发行（2021 年 12 月提交）覆盖 $12M 种子轮（首次出售日期为
              2020 年 7 月 30 日）和 $125M Series A（2021 年 9 月完成），由 Saudi Aramco Energy Ventures 和 Schlumberger New
              Energy（SLB）作为战略领投方。第二份 Form D 于 2024 年 6 月 5 日提交，披露计划 Series B 发行总额 $515.6M；截至提交时，已有 14 名投资人购买
              $308.1M，首次出售日期为 2023 年 10 月 10 日。2026 年 3 月 $300M Series B 延展轮由 Full Vision Capital（Peter Lee Ka-kit
              家族办公室）领投，并包括 Hong Kong Investment Corporation（HKIC），实际上完成了原计划发行，并增加了新的机构支持。


              拿到 $300M 延展轮后，CEO Henning Rath 表示，短期（250 MWh）和中期（1 GWh）制造产能目标“现在已完全获得资金支持”。公司将在中国 Jiangsu 省 Changzhou
              建设主要制造设施，250 MWh 产线计划 2026 年晚些时候动工。重要的是，EnerVenue 拒绝披露 2026 年 3 月融资后的投后估值。媒体和分析师来源（The Standard HK、PM
              Insights）基于轮次规模和投资人画像，把 EnerVenue 描述为独角兽；隐含估值远高于 CB Insights 报告的 2023 年 10 月轮次 $600M–$903.5M 区间。PM
              Insights 引用的二级市场数据显示，自 2024 年底以来，每股价格上涨 112%。Series B 延展轮发生在 $264M Kentucky 工厂计划被放弃之后（2024
              年撤回），因此提出了执行风险问题；转向中国只能部分——而非完全——化解这些问题。


              月度烧钱速度未公开披露。以 92 名员工（Tracxn，2026 年 2 月）且多数在 R&D 和商业岗位计，深科技商业化前公司典型 $2–5M/月烧钱是合理假设；这意味着仅凭 $300M 延展轮，现金跑道约
              24–36 个月——不计任何收入流入，也不计 Changzhou 设施制造资本开支消耗。
