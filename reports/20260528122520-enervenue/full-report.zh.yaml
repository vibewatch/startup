      - number: '2.2'
        title: 规模测算视角：TAM/SAM/SOM 与公开估算的分歧
        blocks:
          - type: paragraph
            body: >-
              公开市场规模证据很多，但分歧很大：2026 年全球固定式储能估算在约 $44B 到超过 $82B 之间，取决于口径是否包含分布式户用储能、表后商业储能和相邻领域。The Business Research
              Company 给出的 2025 年基数为 $44.2B，并以 21% CAGR 增长到 2026 年 $53.5B；Research and Markets 则引用 2026 年超过 $82B
              的更宽口径。差异来自定义选择，不是错误，也不应简单取平均。长时储能细分市场更接近 EnerVenue 的 SAM；MarketsandMarkets 估算其 2024 年价值为 $4.85B，到 2030 年增至
              $10.43B，CAGR 为 13.6%。dataintelo 估算镍氢固定式储能小众市场 2024 年为 $1.32B，到 2033 年 CAGR 为 12.4%。按 SEIA 数据，美国年度 BESS
              装机量在 2025 年创下 57.6 GWh 纪录，同比大约增长 30%；BloombergNEF 预测 2026 年全球储能部署为 158 GW。这些部署数据主要由短时 LFP 系统主导，不能直接归因于
              LDES 或非锂细分市场。公开证据没有给出 EnerVenue 的公司特定 SAM 或 SOM，因为没有独立来源量化其管线、转化率，或在更广泛 LDES 市场中的近期收入获取能力。
