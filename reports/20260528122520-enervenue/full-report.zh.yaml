              将主要制造基地放在中国常州，带来双重风险：（1）地缘政治供应链扰动可能拖慢常州爬坡，或在受关注外国实体（FEOC）规则收紧后切断对美国买家的出口；（2）美国买家若无法接受中国产内容，可能失去美国 IRA
