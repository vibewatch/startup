            body: >-
              Form Energy 的铁空气化学体系瞄准 100 小时储能，完全在 EnerVenue 两到十二小时运行范围之外。两家公司占据相邻但不重叠的小众市场：EnerVenue
              面向安全受限或极端环境应用中的高循环、灵活短中时长储能；Form Energy 面向锂离子经济性不成立的多日电网保供。大型“可再生能源+储能”组合可能同时需要两种技术，因此更像伙伴关系风险，而非替代风险。
