  - id: FI003
    title: EnerVenue 单位经济桥 — 从电池化学到项目经济性
    type: flow
    layout: wide
    summary: EnerVenue 核心技术优势理论上如何在项目层面转化为相对锂离子的更优单位经济。
    data:
      nodes:
        - id: aqueous-cell-chemistry
          label: 水系金属氢电芯化学体系（无铂、无易燃电解液）
        - id: no-thermal-mgmt
          label: 无需主动热管理 → BoS 成本更低
        - id: full-dod
          label: 100% 可用放电深度（对比 LFP 80%）→ 每标称 kWh 的有效 kWh 更多
        - id: zero-degradation
          label: 30,000 次循环内容量退化近零 → 寿命中期无需增容
        - id: lower-capex-per-kwh
          label: 有效安装 $/kWh 更低（前提是制造成本 ≤ LFP 平价）
        - id: lower-om
          label: O&M 更低 — 无需增容、无需消防抑制、监控更简单
        - id: lcos-advantage
          label: 30 年 LCOS 约 $35–60/MWh（公司模型）对比 LFP $65–85/MWh
        - id: margin-risk
          label: 风险：当前规模化前制造成本可能高于 LFP；小批量下利润率为负
        - id: lfp-price-pressure
          label: 风险：LFP 电池包降至 $108/kWh（2025 BNEF）→ capex 平价窗口收窄
      edges:
        - from: aqueous-cell-chemistry
          to: no-thermal-mgmt
        - from: aqueous-cell-chemistry
          to: full-dod
        - from: aqueous-cell-chemistry
          to: zero-degradation
        - from: no-thermal-mgmt
          to: lower-capex-per-kwh
        - from: full-dod
          to: lower-capex-per-kwh
        - from: zero-degradation
          to: lower-om
        - from: lower-capex-per-kwh
          to: lcos-advantage
        - from: lower-om
          to: lcos-advantage
        - from: lfp-price-pressure
          to: margin-risk
        - from: margin-risk
          to: lcos-advantage
    approximationNotes: LCOS 数字是公司模型，并非独立审计。Storlytics 2023 年研究支持 ESV 在中高循环场景下的 TCO 优势，但使用了 EnerVenue 提供的输入。LFP 价格来自 BNEF 2025 年 12 月。
    claimRefs:
      - CI020
      - CI021
      - CI022
      - CI023
