      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: 制造转向带来双重集中风险
            body: >-
              EnerVenue 于 2024 年 11 月放弃肯塔基工厂，并把所有大批量制造集中到中国 Changzhou，同时制造了地缘政治和运营集中风险。中美贸易紧张、对电池进口潜在加征关税，以及从 Silicon
              Valley 研发基地管理 GWh 级工业爬坡的复杂性，都是 $1B 以上估值必须计入的重大不确定性。任命具备 Enpal 供应链经验的 Henning Rath，说明管理层意识到该风险；但公司尚未证明 GWh
              级执行记录，肯塔基先例也不能忽略。
            calloutType: risk
            claimRefs:
              - CV023
              - CV024
              - CV025
              - CV031
          - type: callout
            title: 战略投资者结构是最强估值锚
            body: >-
              战略投资者高度集中在 Aramco Ventures、SLB、HKIC、NEOM 和 Full Vision Capital，既是 EnerVenue
              最强的估值锚，也是最可能的退出机制。如果制造规模跑起来、收入兑现，其中一方既有资本也有战略动机收购公司，而不是在公开市场与其竞争。Aramco-SLB
              组合尤其有吸引力，因为两者都有油田电网替代和远程场址储能任务，镍氢 ESV 可以直接服务这些需求。以当前资本市场对收入前 LDES 的胃口来看，这条战略溢价路径的概率高于 IPO。
            calloutType: insight
            claimRefs:
