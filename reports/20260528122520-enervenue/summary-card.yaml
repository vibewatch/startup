  topStrengths:
    - >-
      Nickel-hydrogen chemistry appears meaningfully differentiated on safety, temperature tolerance, and multi-decade
      cycle life versus lithium-ion peers.
    - >-
      Strategic investors and partners including Full Vision Capital, HKIC, SLB, Aramco Ventures, RWE, and Towngas
      provide stronger external validation than most early-stage battery startups achieve.
    - >-
      A reported $2.3B and 56 GWh pipeline plus named pilots across Europe, China, Australia, and the US indicate real
      buyer interest, not only lab-stage promise.
  topRisks:
    - >-
      EnerVenue still does not publicly disclose audited revenue, margins, or preference-stack detail despite roughly
      $745M raised, limiting conviction on capital efficiency and downside protection.
    - >-
      Manufacturing is now concentrated in Changzhou, China after the Kentucky factory reversal, exposing the company to
      tariff, FEOC, and geopolitical bankability risk.
    - >-
      Commercial proof remains pilot-heavy; the latest-generation product has only limited publicly confirmed field
      deployment, so backlog conversion and scale-up execution are still unproven.
  unresolvedGaps:
    - >-
      Need audited revenue, gross margin, burn, and cap-table or liquidation-preference materials before underwriting
      downside.
    - >-
      Need independent verification of Changzhou ramp timing, Gen 4 certification or recertification status, and
      manufacturing yield quality.
    - >-
      Need a customer-by-customer backlog quality review showing binding orders, concentration, cancellation rights, and
      pilot-to-production conversion rates.
