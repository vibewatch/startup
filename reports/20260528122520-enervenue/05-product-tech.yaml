  - id: safety-compliance
    title: "Safety, Certifications, and Quality Controls"
    body: >
      EnerVenue's safety value proposition centers on the inherent non-flammability of the aqueous alkaline
      electrolyte. There is no organic solvent that can ignite, no lithium intercalation pathway that leads
      to lithium plating, and no thermal cascade mechanism that has been observed in testing. This eliminates
      the fire propagation failure mode that drives auxiliary fire suppression requirements in lithium-ion
      installations — a meaningful cost and permitting advantage for operators siting storage near population
      centers, petrochemical facilities, data centers, or critical infrastructure.

      The UL 9540A evaluation — the industry standard for thermal runaway fire propagation — tested EnerVenue's
      cells at the cell level, module level, and unit level. No flames were observed during induced thermal
      runaway at the cell level. By contrast, most lithium-ion technologies generate visible flames at the cell
      level, requiring extensive module and system-level protection to contain the event. The company holds UL
      1973 certification (stationary battery safety, including fire resistance, mechanical design, thermal
      management, and electrical safety) and IEC 62933-5-2 and IEC 63115-2 certifications for the Energy Rack.
      Some certifications remain pending — the company notes "some certifications pending; consult EnerVenue
      technical authority for current certifications."

      For the Energy Prism, planned certifications include UL 9540, UL 9540A, and UL 1998. The seismic design
      of the Energy Rack is rated to intensity ≥ 8 per GB 50011 (equivalent to SDS ≥ 0.24 g, SD1 ≥ 0.16 g per
      ASCE 7). IP ratings are IP20 (Energy Rack enclosure) and IP54 (Remote System Interface and Integration
      Controller). Communication is encrypted over Modbus TCP/IP. The supplier code of conduct and legal
      disclaimer are publicly posted on the company website. No product recalls or regulatory enforcement
      actions against EnerVenue's products have been identified in publicly available sources as of the research
      date. The absence of fire suppression infrastructure also means sites deploying EnerVenue systems can
      pursue simplified permitting and potentially reduced insurance overhead.
    claimRefs:
      - CE019
      - CE022
      - CE023
      - CE048
