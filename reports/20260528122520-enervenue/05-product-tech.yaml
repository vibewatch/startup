chapter:
  number: 5
  title: "Product & Technology"
  summary: >
    EnerVenue delivers grid-scale energy storage built on NASA-derived nickel-hydrogen chemistry
    commercialized through Stanford research. Its Aqueous Metal Cell (AMC) platform — offered as the
    Energy Rack (150 kWh) and Energy Prism (900 kWh container) — achieves a 30,000-cycle design life,
    >90% round-trip efficiency, and zero thermal runaway risk verified by UL 9540A testing. Independent
    analysis by Ara Ake and Storlytics corroborates a total-cost-of-ownership advantage for high-cycle
    applications, though low gravimetric energy density (~20–30 Wh/kg vs. ~150–205 Wh/kg for LFP) and
    a nascent commercial deployment base remain material diligence gaps.

sections:
  - id: product-definition
    title: "Product Definition and Customer Value Proposition"
    body: >
      EnerVenue sells energy storage infrastructure designed for the multi-decade economics of the electricity
      grid rather than for the shorter-horizon demands of consumer electronics. The company positions itself as
      an infrastructure company whose storage systems must operate continuously for 30 years without significant
      degradation, augmentation, or intervention — a contract with buyers that it argues is fundamentally
      different from the "replace and augment" cycle inherent to lithium-ion battery systems.

      In customer workflow terms, EnerVenue addresses a specific pain point in grid-scale and commercial-industrial
      (C&I) energy storage: the high total cost of ownership (TCO) that accumulates from frequent augmentation
      events, complex thermal management requirements, and mandatory fire suppression infrastructure that
      lithium-ion technology demands. A utility or independent power producer deploying a 100 MWh project
      with lithium-ion batteries must over-size at commissioning (127–219 MWh of installed capacity) to
      account for degradation, then inject fresh capital at augmentation events typically at years 5, 12, and
      15 of a 20-year project — complicating debt service, long-term revenue modeling, and O&M planning.

      EnerVenue eliminates the augmentation cycle. Its Aqueous Metal Cell (AMC) technology requires 112 MWh
      of commissioned capacity to deliver 100 MWh contracted output over 20 years, because the system retains
      93.2% state of health at year 20. This shifts the economic comparison from nameplate-capacity capital to
      lifetime throughput and levelized cost of storage (LCOS), where EnerVenue claims a structural advantage.
      Pilot customers span utility-scale (RWE, Dominion Energy), large-energy-supplier (Towngas), and — in
      future plans — C&I microgrid and data-center adjacent applications. The product is sold as a DC block
      (Energy Rack or Energy Prism) that buyers integrate with their preferred power conversion systems (PCS),
      giving integrators flexibility while EnerVenue retains the proprietary cell and battery management system.
