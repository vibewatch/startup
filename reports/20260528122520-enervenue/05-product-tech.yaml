callouts:
  - calloutType: strength
    title: "Inherent Safety Is a Structural Cost Advantage"
    body: >
      EnerVenue's zero-thermal-runaway chemistry is not just a safety feature — it is a project economics feature.
      The absence of fire suppression infrastructure, HVAC systems, and mandatory rest cycles removes three recurring
      cost lines from 30-year project models. For sites in populated areas, petrochemical facilities, or data
      center campuses, it also unlocks siting options that are structurally blocked for lithium-ion. The UL 9540A
      no-flame result at the cell level is independently verified and materially differentiating in site permitting.
    claimRefs:
      - CE022
      - CE045
      - CE049

  - calloutType: risk
    title: "Manufacturing Pivot to China Carries Geopolitical and Execution Risk"
    body: >
      EnerVenue's strategic decision to abandon its Kentucky gigafactory in late 2024 and shift high-volume
      manufacturing to Changzhou, China introduces concentrated geopolitical and supply chain risk. The move
      subjects EnerVenue to U.S.-China trade friction, potential tariffs on battery imports, and reputational
      headwinds in a market where domestic content and IRA compliance are increasingly procurement-decisive.
      The Kentucky abandonment also established a pattern of production-delay-driven strategy pivots: the
      company skipped an entire product generation (Gen 3) to accelerate Gen 4, resulting in schedule slippage.
      The 250 MWh manufacturing ramp is freshly funded but unproven.
    claimRefs:
      - CE028
      - CE041
      - CE043

  - calloutType: insight
    title: "Low Energy Density Is the Product's Principal Non-Addressable Constraint"
    body: >
      EnerVenue's nickel-hydrogen cells achieve approximately 20–30 Wh/kg gravimetric energy density versus
      150–205 Wh/kg for LFP cells. This is not a gap the company can close through manufacturing efficiency —
      it is intrinsic to the electrochemistry. EnerVenue's commercial thesis requires that grid-scale stationary
      storage buyers do not weight energy density as a gating criterion. For applications where footprint matters
      (offshore, rooftop, constrained urban sites), the AMC is structurally uncompetitive. Diligence should
      confirm whether target customers have footprint constraints that would override the durability advantage.
    claimRefs:
      - CE044

