  - id: product-architecture
    title: "Product Line and Module Architecture"
    body: >
      EnerVenue's commercial product hierarchy is modular and hierarchical: the Aqueous Metal Cell (AMC) is the
      indivisible building block; Energy Racks are the deployable unit; the Energy Prism is the site-ready
      containerized DC block; and Energy Venue is the design concept for multi-megawatt-hour indoor building
      deployments. The modular architecture allows projects to scale from a single 150 kWh rack to multi-hundred
      MWh deployments without redesigning core components.

      The AMC cell (generation four, as of 2026) provides 3.0 kWh of nominal energy in a sealed, large-format
      Ni-H2 cell. Each cell is rated for 30,000+ cycles with 100% depth of discharge permitted. A single
      Energy Rack integrates 50 AMC cells, a pre-wired battery management system (BMS), and all interconnects
      into a 150 kWh unit at 1,500 Vdc nominal, shipping factory-assembled for on-site installation in hours
      rather than weeks. The Energy Rack is compatible with both 1,000 Vdc and 1,500 Vdc system architectures,
      stackable up to three rows high, and rated for indoor or outdoor deployment. The Energy Prism packages
      six Energy Racks into an outdoor-rated container (900 kWh) that connects directly to an inverter at the
      DC bus — the fastest path from delivery to grid connection. The Energy Venue concept supports multi-rack
      installations within purpose-built structures with co-located PCS equipment in distributed or centralized
      configurations. No augmentation events are required across any product tier during the 30-year design life.
