companyProfile:
  summary: "EnerVenue is a Fremont-based private energy-storage company founded in 2020 to commercialize NASA-derived nickel-hydrogen battery chemistry for stationary grid applications. Public evidence supports a differentiated durability and safety profile, approximately $745M of cumulative funding through the March 2026 Series B extension, a company-reported $2.3B and 56 GWh pipeline as of mid-2024, and early pilot proof with customers including RWE and Towngas. The core diligence tension is that EnerVenue has raised significant capital and attracted strategic investors, but it still lacks public revenue disclosure, broad commercial deployment proof, and a de-risked manufacturing footprint outside Changzhou, China."
  foundedDate: "2020-01-01"
  founders:
    - name: "Yi Cui"
      role: "Co-founder; Chairman"
      background: "Stanford materials-science professor who licensed NASA-derived nickel-hydrogen battery technology into a grid-storage startup."
      claimRefs: [CO002, CO003, CO014]
  foundingLocation: "Fremont, CA, USA"
  headquarters: "Fremont, CA, USA"
  productSummary: "EnerVenue sells nickel-hydrogen energy storage vessels and rack-level systems for utility, independent-power-producer, and industrial projects that value long cycle life, wide temperature tolerance, and no thermal runaway pathway."
  customerFocus: "Utilities, independent power producers, project developers, and commercial or industrial buyers with long-duration or harsh-environment storage needs."
  businessModel: "Sell hardware-centric battery systems and related long-duration storage solutions through direct utility sales, EPC intermediaries, and regional distribution partners such as Towngas and Avid Group."
  stage: "Series B"
  fundingStatus: "Private company with an SEC-documented 2024 Series B, a $300M Series B extension in March 2026, and no disclosed current post-money valuation or audited revenue figures."
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO003, CO005, CE003, CE006, CV001, CV002, CU025]
