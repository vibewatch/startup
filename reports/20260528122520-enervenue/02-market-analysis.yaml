callouts:
- id: KM001
  type: key-risk
  title: LFP at $70/kWh is the dominant near-term commercial threat
  body: BloombergNEF data show lithium iron phosphate pack prices fell approximately 45% in 2025 to a record low of ~$70/kWh
    for stationary storage — roughly triple the decline of prior years. This directly challenges EnerVenue's upfront cost
    competitiveness and compresses the payback argument for buyers with discount rates above ~8%. At that price, only applications
    requiring 8,000-plus lifetime cycles unambiguously favor EnerVenue's LCOS math.
  sourceRefs:
  - SM019
  - SM020
  claimRefs:
  - CM012
  - CM033
- id: KM002
  type: key-finding
  title: Non-lithium bankability is improving but project finance still defaults to LFP
  body: Independent engineers and specialist lenders are increasingly willing to assess non-lithium systems in 2026, according
    to energy-storage.news. This removes a binary financing barrier that previously blocked non-lithium projects regardless
    of technical merit. However, the majority of project finance still defaults to LFP — EnerVenue's Gen4 technology has not
    yet been independently validated at commercial scale — and several non-lithium competitors (Ambri, Nilar, AMTE) filed
    for bankruptcy or severe distress in 2024–2026, heightening funder scrutiny of alternative chemistries.
  sourceRefs:
  - SM028
  - SM039
  claimRefs:
  - CM036
  - CM039
