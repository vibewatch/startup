- id: drivers-constraints
  title: Growth drivers and adoption constraints
  body: 'The dominant demand driver for U.S. energy storage broadly is the IRA''s 30% standalone investment tax credit for
    storage, which DOE projects will help grow U.S. storage to 200-plus GW by 2040 compared to a 50 GW pre-IRA trajectory.
    AI-driven data center power demand, a structural increase in electricity consumption, and renewable integration requirements
    add further market pull. Against these tailwinds, the most acute constraint on EnerVenue specifically is LFP lithium-ion
    cost deflation: BloombergNEF data show LFP pack prices collapsed from approximately $108/kWh in late 2024 to roughly $70/kWh
    for stationary storage by year-end 2025, a 45% decline in roughly twelve months and the lowest level ever recorded. This
    intensifies the payback math for EnerVenue''s higher upfront cost, even if long-run LCOS favors high cycle count at sufficient
    project durations. EnerVenue exited its Kentucky manufacturing arrangement with Canadian Solar in 2025 and is relying
    on a Gen4 China cell line in Changzhou targeting 250 MWh annual output by Q3 2026 — creating both tariff risk and supply-chain
    concentration risk. Broader non-lithium risk is visible in the bankruptcy or financial distress of Ambri, Nilar, and AMTE
    Power in 2024–2026. Partially offsetting these constraints, specialist lenders and independent engineers are increasingly
    willing to underwrite non-lithium systems (bankability improving in 2026), U.S. import tariffs on China-sourced BESS create
    some domestic-preference tailwind for a company that intends U.S. assembly, and EnerVenue''s $300M Series B (March 2026)
    provides runway for its Gen4 scale-up.'
