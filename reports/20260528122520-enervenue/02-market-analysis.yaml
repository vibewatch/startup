  columns:
  - Spend category
  - Boundary decision
  - Rationale
  rows:
  - - Grid-scale BESS (≥1 MW, ≥4 h discharge)
    - Included
    - Core target segment; EnerVenue Energy Rack and Prism designed for utility-scale IRP procurement
  - - Behind-the-meter C&I storage (safety-restricted sites)
    - Included
    - Non-flammable chemistry enables deployment in data centers, hospitals, and schools
  - - Short-duration <2 h arbitrage systems
    - Borderline
    - LFP dominates; EnerVenue cycle-life advantage largely irrelevant below 2 h daily cycling
  - - Electric vehicle batteries
    - Excluded
    - Different supply chain, form factor, and regulatory pathway; no technical overlap
  - - Consumer / residential storage
    - Excluded
    - EnerVenue products not sized or certified for residential installation
  - - Pumped hydro storage
    - Excluded
    - Different asset class; geography-constrained capital infrastructure, not a battery chemistry
  - - LFP lithium-ion (incumbent)
    - Substitute
    - Lower upfront cost, shorter cycle life (2,000–3,000 cycles), flammable; primary competitive threat
  - - Vanadium redox flow batteries
    - Substitute
    - Long cycle life, higher system cost; geography-independent alternative for 6–12 h applications
  notes: Boundary decisions reflect public evidence as of May 2026. EnerVenue's Gen4 product datasheet cites grid-scale and
    commercial resilience as primary use cases.
