company:
  name: EnerVenue
chapter:
  number: 1
  title: Company Overview
  summary: >-
    EnerVenue is a 2020-founded Fremont California company commercialising NASA-derived nickel-hydrogen
    battery chemistry for long-duration grid-scale energy storage. The company has raised an estimated
    $720 million across a $12 million seed in 2020, a $100 million Series A led by SLB and Aramco
    Ventures in 2021, a $308 million Series B in June 2024, and a $300 million extension in March 2026,
    earning a Forbes unicorn designation in June 2024. Stanford professor and Chairman Yi Cui licensed
    the NASA spacecraft battery technology and co-founded the company; Henning Rath became CEO on
    April 1 2026 following a roughly 16-month vacancy after the departure of founding CEO Jörg
    Heinemann. Commercial deployments are underway with RWE and Towngas, manufacturing has moved to
    Changzhou China after an abandoned Kentucky factory plan, and a $5.7 million federal contract
    dispute in Ohio remains open. Revenue, current valuation, and enterprise headcount remain
    undisclosed in the public record.
sections:
- id: identity-and-model
  title: Identity, Technology, and Business Model
  body: >-
    EnerVenue describes itself as a grid-scale energy-storage company that adapts nickel-hydrogen
    battery chemistry originally developed by NASA and Ford Aerospace for spacecraft power. The
    official about page and independent technical sources agree that the fourth-generation Aqueous
    Metal Composite (AMC) chemistry carries a claimed 30,000-cycle life, operates across a
    temperature range of approximately minus 40 to plus 60 degrees Celsius without active thermal
    management, and requires no liquid electrolyte, which EnerVenue presents as a durability and
    safety advantage over lithium-ion alternatives. Yi Cui, an endowed-chair materials-science
    professor at Stanford University, licensed the technology from NASA and co-founded the company
    in 2020 in Fremont, California. Generation 4 cells use 400 Wh units designed for utility-scale
    multi-hour storage applications rather than short-duration frequency regulation.

    The business model as described across the company's public materials and independent trade
    coverage is hardware-focused: EnerVenue manufactures battery systems and sells them to utilities
    and independent power producers for stationary grid storage, with revenue recognition following
    physical project deliveries rather than a subscription or software model. Forbes designated
    EnerVenue the newest ClimateTech unicorn in June 2024, the same month the company's CEO
    disclosed a $2.3 billion order backlog representing approximately 56 GWh of pipeline. TIME
    named EnerVenue among America's Top 10 GreenTech Companies in 2025. Those recognition signals
    sit alongside material caution: the company disclosed no revenue figures in the research period,
    its Kentucky manufacturing site was abandoned in favour of Changzhou China production, and a
    federal contract dispute remains unresolved. For diligence purposes EnerVenue is best treated
    as a late-seed-stage hardware startup that has secured significant investor capital and early
    customer proof but has not yet demonstrated unit economics or recurring revenue at scale.
