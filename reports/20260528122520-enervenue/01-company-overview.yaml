- id: funding-and-capital
  title: Capital Formation, Investors, and Valuation
  body: >-
    EnerVenue's capital history is unusually well-evidenced for a private hardware company of its
    age. The $12 million seed in 2020 came from Full Vision Capital, Peter Lee's vehicle; the
    $100 million Series A announced in August 2021 was led by SLB (then Schlumberger) and included
    Aramco Ventures, giving the company strategic industry relationships with two of the world's
    largest oilfield-services and energy companies. The Series B is documented by a June 2024 SEC
    Form D for $308 million, which TechCrunch and other outlets independently verified. The Series
    B extension of $300 million closed in March 2026 and was reported by ESS-news, The Next Web,
    MerCom Capital, RenewablesNow, the South China Morning Post, and the Standard HK, among
    others.

    The total capital-raised figure is contested in the public record. Summing the confirmed round
    sizes gives approximately $720 million, but The Next Web, citing Crunchbase, reported a $445
    million figure as of March 2026. The discrepancy likely reflects differing treatment of
    convertible notes, SAFE instruments, or how prior rounds were posted to Crunchbase versus the
    SEC Form D values; neither figure can be fully reconciled from open sources. Forbes' June 2024
    unicorn designation establishes a greater-than-one-billion-dollar implied valuation at that
    point, but no formal valuation has been disclosed for the Series B extension.

    The strategic logic of the investor syndicate carries important context. SLB's participation
    reflects an oilfield-services company seeking to diversify into the energy transition; Aramco
    Ventures is the venture arm of Saudi Aramco, with an energy-security mandate. Both represent
    long-capital-cycle industrial partners aligned with EnerVenue's long-duration infrastructure
    thesis, but they may also create governance complexity around exit timing and
    commercialisation priorities. Full Vision Capital's Peter Lee brings a China-market network
    directly relevant to EnerVenue's Changzhou manufacturing base.
