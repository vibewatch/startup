callouts:
- calloutType: strength
  title: NASA technology pedigree and Yi Cui's scientific credibility are uncommon anchors for a battery startup
  body: >-
    Few energy-storage hardware companies can trace their core chemistry to a proven aerospace
    application with more than 30 years of orbital deployment history. Yi Cui's Stanford affiliation,
    publication record, and patent ownership provide credibility that reduces some of the scientific
    uncertainty investors typically face with novel-chemistry bets.
  claimRefs:
  - CO002
  - CO003
  - CO030
  - CO037
- calloutType: strength
  title: Investor base is strategic and deep relative to company stage
  body: >-
    SLB and Aramco Ventures represent long-capital-cycle energy incumbents who need grid storage to
    diversify their value chains, making them patient and strategically aligned investors. An
    estimated $720 million raised by 2026 in a company with only five years of commercial history
    represents significant external validation even without public revenue disclosure.
  claimRefs:
  - CO018
  - CO021
  - CO023
- calloutType: risk
  title: CEO vacancy and governance opacity are the most immediate due-diligence concerns
  body: >-
    A roughly 16-month gap between the departure of founding CEO Heinemann and the April 2026
    appointment of Henning Rath coincided with active fundraising and customer deployments. The
    formal board roster, investor-rights terms, and post-Series-B cap table are not public, which
    limits governance confidence for any investment decision.
  claimRefs:
  - CO011
  - CO012
  - CO013
  - CO016
- calloutType: risk
  title: Kentucky manufacturing pivot and unresolved federal lawsuit signal execution risk
  body: >-
    The abandonment of the Kentucky factory in November 2024 and the relocation of all
    manufacturing to Changzhou indicate that scaling US production was harder than planned. The
    unresolved $5.7 million ATS Ohio contract dispute adds a legal tail to the operational picture.
  claimRefs:
  - CO026
  - CO027
  - CO028
  - CO029
