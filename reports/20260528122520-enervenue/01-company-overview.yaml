- id: milestones-adverse-and-gaps
  title: Commercial Milestones, Adverse Signals, and Evidence Gaps
  body: >-
    EnerVenue's most significant commercial proof-points as of May 2026 are the RWE pilot in
    December 2024 and the Towngas commissioning in Changzhou on May 15 2026. The RWE deployment
    is described in independent trade coverage as EnerVenue's first European utility engagement;
    both RWE purchase and independent confirmation appear in multiple sources. The Towngas
    commissioning involves EnerVenue's Generation 4 AMC product and marks the first publicly
    confirmed commercial installation at the company's new Chinese manufacturing base. Avid Group
    in Australia and named US utilities including Duke Energy and Dominion Energy appear in
    third-party coverage as pipeline customers, but no executed-and-commissioned contracts for
    those parties are confirmed in the fetched pack.

    The Kentucky factory withdrawal is the most material adverse operational event in the chapter.
    EnerVenue had publicly planned US manufacturing at a Kentucky site; Canadian Solar
    subsequently acquired the facility for its own BESS and cell production after EnerVenue
    vacated in November 2024. Multiple sources characterised the withdrawal as driven by
    Generation 2 production delays and a decision to leverage the existing Changzhou supply chain.
    The company's new manufacturing target is 250 MWh by Q3 2026 and 1 GWh by 2027, with all
    production now in China. The legal adverse signal is ATS Ohio Inc. v. EnerVenue Inc., Case
    2:2023-cv-04187 in the Southern District of Ohio, involving ATS claiming roughly $5.7 million
    for a battery assembly system it built for EnerVenue. The publicly available complaint
    documents the dispute but not an outcome or settlement.

    The evidence gaps that matter most for the next diligence stage are current revenue and unit
    economics, the formal board roster and investor-rights terms, the current 2026 order backlog
    figure, and resolution or current status of the Ohio litigation. EnerVenue has generated
    unusually strong third-party validation for a five-year-old hardware company, but the absence
    of revenue data, the CEO governance gap, and the factory pivot together demand careful scrutiny
    of execution risk before any investment recommendation.
