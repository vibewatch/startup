  - id: unit-economics-cost-structure
    title: Unit Economics, Cost Structure, and Gross Margin
    body: >
      EnerVenue's unit economics are not publicly disclosed at any level of granularity—no gross
      margin, contribution margin, manufacturing cost per kWh, or operating expenditure breakdown
      has been released. The company's economic thesis rests on several structural claims: (1) the
      nickel-hydrogen chemistry uses a water-based electrolyte with no thermal management
      infrastructure, reducing balance-of-system costs relative to LFP; (2) the Gen 4 ESV eliminates
      platinum-based catalysts (a key cost driver in the NASA original), with founder Yi Cui targeting
      sub-$80/kWh manufacturing cost at scale; (3) 100% usable depth of discharge versus 80% for LFP
      means each nominal kWh delivers more effective energy, improving system economics; and
      (4) the absence of degradation-driven augmentation cycles avoids the ~$30–50/kWh replacement
      cost burden typical of LFP in 20-year projects.


      Independent TCO analysis by Storlytics (2023) compared 20-year project economics of EnerVenue
      ESVs versus LFP in medium-cycle (1.75 cycles/day) and high-cycle (2.1 cycles/day) scenarios.
      In both cases, ESVs produced superior annualized cost per MWh delivered due to their constant
      capacity over the project life. EnerVenue's own LCOS analysis frames the advantage at
      ~$35–60/MWh versus $65–85/MWh for utility-scale LFP in comparable US/EU deployments.


      However, cost competitiveness at scale has not been independently verified. The Changzhou
      factory has not yet been built; current sales involve small-volume custom deployments from
      early-generation technology, and manufacturing yields, defect rates, and per-unit cost
      at commercial scale are not in the public domain. LFP pack prices fell to $108/kWh in 2025
      (BNEF), the lowest recorded level, compressing the relative capex gap EnerVenue must close to
      compete on installed cost. Working capital intensity is high: hardware projects require inventory
      buildup, pre-delivery manufacturing, and extended accounts receivable tied to project construction
      schedules.
