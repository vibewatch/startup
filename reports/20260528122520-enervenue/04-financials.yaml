  - id: commercial-traction-revenue-signals
    title: Commercial Traction and Revenue Signals
    body: >
      EnerVenue's most concrete revenue signal is the CEO-disclosed $2.3B order backlog and 56 GWh
      pipeline as of mid-2024, representing an 8x YoY increase. The company does not disaggregate
      firm purchase orders from letters of intent or conditional agreements, making backlog-to-revenue
      conversion timing difficult to assess from public data. Named transaction evidence: the 25 MWh
      High Caliber Energy project for a Florida utility co-operative (delivery targeted Q4 2024); the
      Avid Group Master Supply Agreement for ESV-4 deployments in Australia and West Africa (Aug 2024);
      pilot supply to RWE's Milwaukee facility (Dec 2024); and Dominion Energy's planned Virginia
      pilot (2027, involving Virginia State University). Duke Energy and Towngas (HK) are also cited
      as commercial customers by Forbes.


      Analyst-derived estimates place EnerVenue's current annual revenue at approximately $33.8M (2026),
      with revenue per employee of ~$245K based on 92 headcount. These are third-party inferred figures,
      not company-disclosed numbers. Mercom Capital ranked EnerVenue's $308M H1 2024 raise among the
      top five global cleantech VC deals for that period, reflecting investor confidence in the
      commercial opportunity rather than demonstrated revenue scale.


      EnerVenue ranked #2 in Time/Statista's America's Top GreenTech Companies 2025 list, providing
      brand recognition that may support enterprise sales cycles. The company's CEO Henning Rath—
      formerly Managing Director and Chief Supply Chain Officer at German renewable energy platform
      Enpal—was appointed alongside the Series B close, signaling a deliberate transition from
      technology development to commercial-scale execution.
