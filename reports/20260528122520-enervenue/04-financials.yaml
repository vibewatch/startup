callouts:
  - calloutType: risk
    title: China Manufacturing Concentration Is a Material Financial and Geopolitical Risk
    body: >
      EnerVenue's decision to site its primary manufacturing in Changzhou, China introduces a dual
      risk: (1) geopolitical supply-chain disruption that could delay the Changzhou ramp or cut off
      exports to US buyers under tightened foreign-entity-of-concern rules, and (2) potential
      disqualification from US IRA incentive eligibility for US buyers who cannot accept Chinese
      content. The FDD (April 2026) and RAND (January 2026) analyses both identify Chinese battery
      manufacturers and facilities as strategic leverage points. Any EnerVenue customer subject to
      US government procurement rules may be unable to use Changzhou-manufactured ESVs.
    claimRefs:
      - CI035
      - CI036
      - CI037

  - calloutType: strength
    title: $2.3B Backlog Signals Strong Demand, But Conversion Remains Unverified
    body: >
      The mid-2024 CEO-disclosed $2.3B backlog (8x YoY increase) and 56 GWh pipeline are
      industry-scale demand signals that, if firm, could support multiple years of revenue at
      post-scale manufacturing volumes. However, EnerVenue has not published a backlog quality
      breakdown, and the company's track record of project execution (Kentucky factory abandonment,
      Gen 3 skip) leaves conversion timing uncertain. The combination of a large pipeline and an
      early-stage manufacturing ramp creates meaningful mismatch risk between demand recognition
      and supply delivery.
    claimRefs:
      - CI027
      - CI028
      - CI029
      - CI030

  - calloutType: insight
    title: Runway Is Adequate for Near-Term Milestones, But Capital Intensity Grows Sharply at Scale
    body: >
      At 92 employees and pre-commercial manufacturing, EnerVenue's $300M Series B extension likely
      provides 24–36 months of operating runway. However, as the Changzhou factory is built and
      staffed, and as large-scale orders begin to require production financing, working capital demands
      will grow sharply. Hardware battery companies of comparable scale (Fluence, ESS Inc.) have
      required repeated capital raises or project-finance structures before reaching cash-flow
      breakeven. EnerVenue should be modeled as requiring an additional capital raise or credit
      facility before reaching operating cash-flow self-sufficiency.
    claimRefs:
      - CI024
      - CI042
      - CI043

