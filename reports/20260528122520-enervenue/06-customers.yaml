callouts:
  - calloutType: risk
    title: Largest Commissioned Deployment is 150 kWh — All Multi-MWh Contracts Unverified
    body: >
      Despite $2.3 billion in reported order backlog and supply agreements totaling over 3.7 GWh,
      the only independently confirmed commissioned installation as of May 2026 is the 150 kWh
      Towngas pilot in Jintan, China. No multi-MWh production deployment has been independently
      verified in the field. This creates a significant proof gap between announced commercial
      traction and demonstrated delivery capability at scale.
    claimRefs:
      - CU005
      - CU006
      - CU025
      - CU037

  - calloutType: risk
    title: Towngas Conflict of Interest — Distributor, Customer, and Lead Investor Simultaneously
    body: >
      Towngas's parent company (Henderson Land / Peter Lee via Full Vision Capital) led EnerVenue's
      March 2026 $300M Series B extension while Towngas simultaneously serves as EnerVenue's primary
      Asia-Pacific distribution channel and first pilot customer. This three-way alignment concentrates
      commercial, financial, and governance influence in a single counterparty and compromises the
      independence of the Asia-Pacific channel.
    claimRefs:
      - CU004
      - CU036

  - calloutType: strength
    title: Diverse Geographic Named Customer Base Across 7 Countries
    body: >
      EnerVenue's announced customer base spans the US, Brazil, Puerto Rico, China/HK, Denmark,
      Australia, and Germany—demonstrating genuine multi-geography demand for nickel-hydrogen
      storage and reducing single-market concentration risk in the revenue pipeline (though the
      execution risk of serving such a broad geography from a single China manufacturing base
      is a counterbalancing concern).
    claimRefs:
      - CU001
      - CU008
      - CU010
      - CU012
      - CU014
      - CU019

  - calloutType: insight
    title: Kentucky Factory Retreat Signals Gen-4 Pivot — Not Demand Weakness
    body: >
      EnerVenue's vacating of the Shelby County, Kentucky factory (announced March 2023, confirmed
      abandoned in 2024) is attributed to the decision to accelerate Gen-4 (AMC) rather than scale
      the prior generation. This is consistent with the product strategy but signals a 2-plus-year
      delay in US manufacturing capacity and creates meaningful domestic-content procurement risk
      for US utilities operating under IRA incentive structures.
    claimRefs:
      - CU030
      - CU031

