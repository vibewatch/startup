chapter:
  number: 6
  title: Customers
  summary: >
    EnerVenue has assembled a geographically diverse set of named supply-agreement customers—
    including Towngas (HK/China), VedantaESS (Brazil), Pine Gate Renewables (US),
    Sonnell Power Solutions (Puerto Rico), Green Energy/Nicon (Denmark), RWE (Germany),
    Avid Group (Australia), Dominion Energy (US), and an unnamed Florida utility via High
    Caliber Energy—reaching a company-reported $2.3 billion order backlog and 56 GWh sales
    pipeline as of June 2024. Most commitments remain MOU- or supply-agreement-stage rather
    than verified delivered MWh, and the May 2026 Towngas Gen-4 AMC pilot in China marks the
    first confirmed real-world commissioning of the latest-generation product; the ATS Ohio
    production-automation lawsuit (settled Nov 2025) and abandoned Kentucky factory signal
    manufacturing execution risk that constrains buyer confidence in near-term large-scale delivery.

sections:
  - id: customer-base-segmentation
    title: Customer Base Segmentation and Buyer Personas
    body: >
      EnerVenue addresses four primary buyer segments, each with distinct procurement dynamics,
      contract structures, and energy storage requirements. Utilities and independent power producers
      (IPPs) form the cornerstone segment, procuring large-scale storage to meet grid reliability
      mandates, renewable-firming obligations, and long-duration capacity targets. For utilities,
      EnerVenue competes on total-cost-of-ownership over a 30-year horizon, positioning its 30,000-cycle
      design life and zero-augmentation model against lithium-ion replacement cycles every 5-7 years.
      The procurement path for utilities is lengthy—regulatory filings, competitive RFPs, credit
      underwriting, and in some US jurisdictions, state utility commission approval (as with Dominion
      Energy's pilot proposal submitted to the Virginia State Corporation Commission). Commercial and
      industrial (C&I) customers, including manufacturing sites, mining operations, and maritime/offshore
      projects, seek behind-the-meter resilience, demand charge reduction, and off-grid capability. This
      segment was the target of EnerVenue's earliest supply agreements: Sonnell Power Solutions (Puerto
      Rico industrial sector) and Green Energy Renewable Solutions/Nicon (Danish maritime/heavy industry).
      The fire-safe, extreme-temperature profile of nickel-hydrogen chemistry is the primary differentiator
      for these buyers, who face unique safety and environmental regulations. Remote microgrid and mining
      customers—served through regional partner Avid Group in Australia—represent a third segment where
      EnerVenue's low-maintenance, high-durability positioning reduces total operating cost in locations
      where technician visits are expensive. Finally, AI data centers represent an emerging buyer persona;
      EnerVenue's 60-degree-C ambient operating tolerance and tight-pack density (no fire suppression
      needed) align well with hyperscale data center economics, though no confirmed data center customer
      existed as of May 2026. Buyer personas span utility procurement officers, EPC consulting firms
      (High Caliber Energy in SE US, Avid in Australia), project developers (Pine Gate Renewables),
      and corporate sustainability/energy leaders at industrial firms.
