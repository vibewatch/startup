figures:
  - id: FU001
    title: EnerVenue Customer Segment Journey Map
    type: journey-map
    layout: wide
    summary: >
      Maps five buyer segments across five adoption phases from awareness to multi-site expansion,
      highlighting the funnel shape and conversion barriers at each stage for EnerVenue.
