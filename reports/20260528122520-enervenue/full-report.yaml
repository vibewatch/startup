      - number: '5.3'
        title: Technology Architecture and Materials Science
        blocks:
          - type: paragraph
            body: >
              The Aqueous Metal Cell is an electrochemical system built on nickel-hydrogen chemistry with a nickel
              hydroxide cathode and a nickel alloy anode operating in an alkaline (water-based) electrolyte. On charge,
              hydrogen gas is electrochemically produced and stored inside a hermetically sealed pressure vessel; on
              discharge, the hydrogen reaction is reversed at the anode. The system is fully sealed — no liquid
              spillage, no venting pathway, and no thermal cascade route. The stability of the system is inherent to the
              electrochemistry rather than engineered in through protective layers, cooling systems, or passive thermal
              management sub-systems; this is the core technical claim that differentiates the AMC from lithium-ion
              technologies.

              The commercialization leap from NASA's original nickel-hydrogen cells was accomplished principally by
              replacing the platinum catalyst (standard in aerospace cells at approximately $30,000 per kg) with a
              transition metal-based catalyst developed at Stanford University under Professor Yi Cui. The new catalyst
              costs approximately $22 per kilogram and provides high catalytic activity for both hydrogen evolution and
              oxidation reactions without requiring dual catalysts. Simultaneously, EnerVenue replaced the NASA
              zirconium-oxide separator with a porous polyolefin material and migrated the pressure vessel from
              stainless steel to a composite structure, reducing cost and enabling scalable manufacturing. These
              materials choices also yield a supply chain profile composed entirely of earth-abundant materials — steel,
              nickel, fiberglass, resin, and water — with no lithium, rare earths, or single-country supply chain
              dependencies.

              Performance characteristics tested and published by EnerVenue include a peak round-trip efficiency
              exceeding 90% (85% for 2-hour storage scenarios), a lab-tested temperature range of -20°C to +60°C, and a
              rated operating range for the Energy Rack of -10°C to +45°C with forced-air cooling only. The maximum
              charge/ discharge C-rate is 0.55C, supporting 2–12 hour discharge durations. Altitude tolerance extends to
              2,000 m above sea level. Over 200 million cell-hours of operational data accumulated in NASA and aerospace
              applications prior to EnerVenue's commercialization provide a deep reliability dataset that most grid
              battery manufacturers cannot match.
