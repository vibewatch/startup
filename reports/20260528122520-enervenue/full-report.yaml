      - number: '3.2'
        title: Lithium-Ion Incumbents — Scale, Cost, and Displacement Risk
        blocks:
          - type: paragraph
            body: >-
              Lithium-ion's dominance rests on three decades of manufacturing iteration. Tesla's Megapack 3 and
              Megablock system — unveiled in September 2025 — deliver approximately 5 MWh per unit (up from 3.9 MWh)
              with 91% round-trip efficiency at medium voltage, a 25-year design life rated for more than 10,000 cycles,
              and a Houston Gigafactory targeting 50 GWh of annual output. Turnkey installed cost in 2026 runs $400–550
              per kWh for large utility projects. BYD's HaoHan platform pushes further: 14.5 MWh per DC block, 10,000+
              cycles, and claimed lifetime energy costs under $0.014 per kWh. The Chinese manufacturers' vertical
              integration erodes any remaining cost cushion for Western challengers, and eight of the global top-10 BESS
              integrators are now Chinese companies.

              Fluence (AES + Siemens) holds a structurally different competitive position — a systems-integration and
              software business rather than a cell manufacturer. Its $5.6 billion backlog, $3.2–3.6 billion 2026 revenue
              guidance, and 41 GW/147 GWh uncontracted pipeline reflect its strength in complex utility-scale projects
              and long-term O&M. Fluence's Mosaic EMS and service contracts typically run 10–20 years, creating durable
              customer lock-in that EnerVenue's current distribution model does not match.

              The critical limitation of all lithium-ion systems for EnerVenue's target segments is the thermal regime.
              Li-ion cells operate safely only within approximately 5–30°C and require active thermal management and
              HVAC. They are rated for 6,000–8,000 cycles at typical grid duty, necessitating capacity augmentation
              every five to seven years. BNEF's 2024 Long-Duration Energy Storage Cost Survey found that LDES
              technologies were already providing cheaper storage than lithium-ion for durations above eight hours, and
              BloombergNEF's battery price index recorded LFP pack prices at $108/kWh as of December 2025, compressing
              incumbent unit economics but not yet closing the lifecycle-cost gap against EnerVenue's augmentation-free
              profile.
