      - number: '6.4'
        title: Retention, Expansion Signals, and Concentration Risk
        blocks:
          - type: paragraph
            body: >
              EnerVenue does not publicly disclose Net Revenue Retention, Gross Revenue Retention, or customer cohort
              data; given the company's stage and hardware-forward model, renewal dynamics differ from SaaS—each
              retention event is a follow-on order or deployment phase, not an annual subscription renewal. The
              strongest expansion signal is the Towngas relationship: from a 2021 distribution agreement, the
              partnership expanded to a 2026 active pilot and a related lead-investor role—demonstrating multi-phase
              deepening over five years. EnerVenue CEO Rath's statement that pilots are very likely to be directly
              converted into sales orders in the next few months implies near-term production order conversion from the
              current pilot cohort (RWE, Dominion, Towngas Gen-4), though no conversions have been independently
              confirmed as of May 2026. Concentration risk is significant on two axes. First, Towngas (and by extension
              Peter Lee/Full Vision Capital and Henderson Land) occupies the roles of distributor, first customer, and
              lead investor simultaneously, meaning a Towngas relationship deterioration would damage EnerVenue's
              Asia-Pacific channel, its largest institutional backer, and its highest-profile reference customer
              simultaneously. Second, EnerVenue's manufacturing is exclusively based in Changzhou, China (the only
              high-volume line currently under construction), creating a supply concentration risk for US-based utility
              customers under IRA domestic content provisions—potentially blocking procurement by utilities seeking
              domestic content incentives. The abandoned Kentucky factory directly illustrates this risk: EnerVenue
              currently has no US manufacturing capacity, and the timeline to US production readiness is unresolved.
              Customer proof quality is almost entirely drawn from press-release-quoted endorsements rather than
              independent reviews; no G2, Gartner Peer Insights, or equivalent platform reviews were found. The ATS Ohio
              lawsuit (filed December 2023, settled November 2025), in which EnerVenue stopped payments to a production
              automation contractor and had its counterclaim dismissed, introduces a credibility question around
              manufacturing discipline and vendor relationship management.
