  - id: FI003
    title: EnerVenue Unit Economics Bridge — From Battery Chemistry to Project Economics
    type: flow
    layout: wide
    summary: >-
      How EnerVenue's core technical advantages are theorized to translate into superior unit economics versus
      lithium-ion at the project level.
    data:
      nodes:
        - id: aqueous-cell-chemistry
          label: Aqueous metal-hydrogen cell chemistry (no platinum, no flammable electrolyte)
        - id: no-thermal-mgmt
          label: No active thermal management required → lower BoS cost
        - id: full-dod
          label: 100% usable depth of discharge (vs. 80% for LFP) → more effective kWh per nominal kWh
        - id: zero-degradation
          label: Near-zero capacity degradation over 30,000 cycles → no mid-life augmentation
        - id: lower-capex-per-kwh
          label: Lower effective installed $/kWh (if manufacturing cost ≤ LFP parity)
        - id: lower-om
          label: Lower O&M — no augmentation, no fire suppression, simplified monitoring
        - id: lcos-advantage
          label: 30-year LCOS ~$35–60/MWh (company model) vs. LFP $65–85/MWh
        - id: margin-risk
          label: 'Risk: current pre-scale manufacturing cost may exceed LFP; margin negative at small volumes'
        - id: lfp-price-pressure
          label: 'Risk: LFP pack fell to $108/kWh (2025 BNEF) → narrows capex-parity window'
      edges:
        - from: aqueous-cell-chemistry
          to: no-thermal-mgmt
        - from: aqueous-cell-chemistry
          to: full-dod
        - from: aqueous-cell-chemistry
          to: zero-degradation
        - from: no-thermal-mgmt
          to: lower-capex-per-kwh
        - from: full-dod
          to: lower-capex-per-kwh
        - from: zero-degradation
          to: lower-om
        - from: lower-capex-per-kwh
          to: lcos-advantage
        - from: lower-om
          to: lcos-advantage
        - from: lfp-price-pressure
          to: margin-risk
        - from: margin-risk
          to: lcos-advantage
    approximationNotes: >-
