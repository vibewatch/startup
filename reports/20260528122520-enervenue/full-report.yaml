companyProfile:
  summary: >-
    EnerVenue is a Fremont-based private energy-storage company founded in 2020 to commercialize NASA-derived
    nickel-hydrogen battery chemistry for stationary grid applications. Public evidence supports a differentiated
    durability and safety profile, approximately $745M of cumulative funding through the March 2026 Series B extension,
    a company-reported $2.3B and 56 GWh pipeline as of mid-2024, and early pilot proof with customers including RWE and
    Towngas. The core diligence tension is that EnerVenue has raised significant capital and attracted strategic
    investors, but it still lacks public revenue disclosure, broad commercial deployment proof, and a de-risked
    manufacturing footprint outside Changzhou, China.
