      - number: '2.3'
        title: Buyer segments and early adoption evidence
        blocks:
          - type: paragraph
            body: >-
              EnerVenue's named buyers cluster in three identifiable segments as of May 2026. The first and largest is
              investor-owned utilities executing long-duration pilot programs under state regulatory approval: RWE is
              testing Gen2 metal-hydrogen vessels at its Milwaukee test facility; Dominion Energy received Virginia
              State Corporation Commission approval for three LDES pilot projects, with EnerVenue contracted at Virginia
              State University for a 1.5 MW / 10-hour system targeted for commissioning by late 2027; Duke Energy and
              High Caliber Energy are also named. The second segment is international utilities and developers: Avid
              Group signed an Australian master supply agreement in 2024; Towngas commissioned a Gen4 pilot in Jiangsu
              province (Q1 2026); Vedanta ESS contracted 525 MWh for South America. The third emerging segment is data
              center operators: data center electricity demand rose 17% globally in 2025 per IEA, and U.S. data center
              power demand is projected to reach 75.8 GW by 2026 per S&P Global, more than doubling from 2022 levels.
              EnerVenue explicitly markets the non-flammable aqueous chemistry as enabling siting in jurisdictions or
              buildings where lithium thermal-runaway risk is a disqualifying factor. Procurement paths differ:
              utilities process BESS through integrated resource planning and state commission approval; data center
              operators procure via direct capital expenditure or power purchase agreements. No independent source
              confirms that EnerVenue has closed a large-scale commercial project at utility production volumes beyond
              pilot scale.
