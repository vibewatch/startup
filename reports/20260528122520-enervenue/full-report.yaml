  - id: TV005
    title: Thesis-Break and Kill-Triggers Table
    layout: standard
    notes: >-
      Triggers are defined at objective thresholds where the investment thesis can no longer be maintained without full
      re-underwriting. These are early-warning signals, not base-case forecasts. The Kentucky abandonment establishes
      that operational risk is real and repeatable.
    columns:
      - Trigger
      - Threshold
      - Transmission Mechanism
      - Action Implication
    rows:
      - - Manufacturing milestone miss
        - Changzhou 250 MWh line delayed at least 12 months beyond the 2026 operational target.
        - Signals execution incapacity at scale; raises risk of a second factory-abandonment pattern.
        - Halt follow-on commitment; demand independent manufacturing operations audit before any new capital.
      - - Down-round financing
        - Next equity round priced below $800M post-money valuation.
        - Signals investor confidence collapse; marks down all existing preferred-stock positions.
        - Immediate reassessment; model liquidation preference waterfall impact on common-equivalent value.
      - - Strategic investor exit
        - >-
          Aramco Ventures or SLB reduces or exits cap-table position without a confirmed strategic acquisition
          rationale.
        - Removes primary distribution validator; signals loss of strategic partnership confidence.
        - Downgrade to bear case; revisit market-access assumptions for oilfield and utility segments.
      - - Lithium cost breakthrough
        - LFP BESS achieves $80/kWh or below at 8-hour equivalent storage with certified 30-year cycle life.
        - Eliminates nickel-hydrogen TCO advantage for infrastructure-grade applications; moat collapses.
        - Re-underwrite thesis from scratch; EnerVenue's cycle-life moat depends on lithium not closing the gap.
      - - Revenue non-disclosure past 2026
        - No ARR or revenue run-rate disclosed by Q4 2026 despite Changzhou operational milestone.
        - Signals either zero commercial-scale revenue or deliberate opacity; both adverse for institutional pricing.
        - Withhold new capital commitment until audit-ready ARR of at least $50M is provided.
    claimRefs:
      - CV023
      - CV024
      - CV032
      - CV039
      - CV040
      - CV044
  - id: TV006
    title: Final Diligence Asks Table
    layout: standard
    notes: >-
      Asks prioritized by materiality to valuation judgment. Blocking items must be resolved before any significant
      capital commitment. Material items would upgrade or downgrade the current RESEARCH-MORE recommendation. All items
      require data-room access or expert engagement; none can be resolved from public sources alone.
    columns:
      - Priority
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner or Path
    rows:
      - - Blocking
        - Revenue and ARR
        - Audited 2025-2026 YTD revenue, ARR, and backlog-conversion rate with Big-4 attestation.
        - Without revenue evidence the valuation range spans 4x; cannot size or underwrite any position.
        - CFO and independent auditor; require audit-attested figures as a condition of any new investment.
      - - Blocking
        - Preference stack and cap table
        - >-
          Full liquidation preference waterfall, participation rights, anti-dilution provisions, and fully diluted
          shares by class.
        - Determines true common-equivalent valuation and downside protection; critical for any IRR model.
        - Legal counsel; mandatory for direct investment; cross-reference structural terms against SEC EDGAR Form D.
      - - Material
        - Changzhou manufacturing audit
        - >-
          Independent third-party manufacturing readiness report for the 250 MWh line covering current status, capacity,
          and timeline.
        - Kentucky abandonment precedent requires hard evidence of ramp capability; management claims insufficient.
        - Commission an independent engineering audit firm via EnerVenue board data-room access.
      - - Material
        - Customer pipeline verification
        - Binding purchase orders or LOIs with value, quantity, and delivery timeline for the top-10 pipeline accounts.
        - $2.3B pipeline is a single CEO statement from June 2024; 22 months of staleness is material for valuation.
        - >-
          Request data-room access; cross-check against published customer press releases (RWE Dec 2024, Duke Energy
          supply).
      - - Minor
        - Headcount and burn rate
        - Approximate headcount by function, monthly cash burn, and current cash runway.
        - Informs whether $745M raised is sufficient to reach manufacturing scale without bridge financing risk.
        - Infer from LinkedIn and Tracxn; formal request to CFO.
