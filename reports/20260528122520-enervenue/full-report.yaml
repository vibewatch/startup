      - number: '5.5'
        title: Deployment, Integration, Roadmap, and O&M Model
        blocks:
          - type: paragraph
            body: >
              EnerVenue's deployment model rests on factory-integrated DC blocks that minimize on-site labor. The Energy
              Rack ships pre-integrated — AMCs, BMS, wiring, and connections — reducing installation from weeks to
              hours. The Energy Prism ships as a fully assembled container that connects directly to the customer's
              power conversion system (PCS) at the DC bus, with delivery-to-energization achievable within days. Both
              products use Modbus TCP/IP as the BMS communication protocol, compatible with standard SCADA and energy
              management systems (EMS). Third-party controller manufacturers, including DEIF, have documented EnerVenue
              BMS integration in published application notes.

              The O&M model is deliberately minimal: no augmentation events over a 30-year design life, no HVAC or
              chiller contracts, no auxiliary fire suppression service agreements, and no chemical additions. This O&M
              simplicity is the financial engine of EnerVenue's TCO argument and is company-claimed rather than
              independently validated at commercial scale over decades. The company provides technical support and
              warranty service through a direct customer support function.

              Active pilot deployments as of May 2026 include: RWE Clean Energy (Milwaukee-area test facility), cycling
              ESVs to evaluate performance across charge/discharge profiles and temperature conditions; Towngas in
              Jintan, Changzhou, China (commissioned May 2026), deploying 150 kWh of 4th-generation AMC technology
              integrated with renewable generation and EV charging; and Dominion Energy Virginia at Virginia State
              University's Ettrick campus (planned commissioning 2027), deploying 1.5 MW of metal-hydrogen storage for
              up to 10 hours of backup duration.

              The product roadmap progression from Generation 1 through Generation 4 shows that EnerVenue made a
              deliberate decision in 2024 to skip Generation 3 production and accelerate Generation 4 — a decision that
              cost EnerVenue its Kentucky gigafactory timeline but was justified as yielding "significant performance
              and cost benefits" per the company. Manufacturing is now centered on Changzhou, China, where EnerVenue is
              scaling a 250 MWh production line (construction starting 2026) with a medium-term 1 GWh target. R&D
              remains in Silicon Valley, California.
