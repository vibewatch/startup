              At 92 employees and pre-commercial manufacturing, EnerVenue's $300M Series B extension likely provides
              24–36 months of operating runway. However, as the Changzhou factory is built and staffed, and as
              large-scale orders begin to require production financing, working capital demands will grow sharply.
              Hardware battery companies of comparable scale (Fluence, ESS Inc.) have required repeated capital raises
              or project-finance structures before reaching cash-flow breakeven. EnerVenue should be modeled as
              requiring an additional capital raise or credit facility before reaching operating cash-flow
              self-sufficiency.
