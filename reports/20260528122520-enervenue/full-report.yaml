            body: >-
              EnerVenue's exit optionality sits across three primary channels. First, a strategic acquisition by one of
              its existing investors (Aramco, SLB) or a complementary industrial buyer who values the NASA IP as a
              defensive moat against lithium commoditization. The Aramco Ventures confirmation that EnerVenue's
              technology can transform critical infrastructure at scale signals strategic conviction that typically
              precedes acquisition discussions. Second, co-investment or full acquisition by a sovereign wealth fund,
              particularly from Asia or the Middle East where HKIC, NEOM, and Towngas provide strategic footholds.
              Third, a 2028-2030 IPO targeting the LDES infrastructure theme, conditional on revenue evidence and a
              clean manufacturing audit. The IPO pathway is least likely without 12-18 months of reported commercial
              revenue.

              Critical kill triggers include a manufacturing milestone miss of more than 12 months, a down-round below
              $800M post-money, a strategic investor exit, a lithium cost breakthrough below $80/kWh for 8-hour
              applications, or continued revenue non-disclosure past Q4 2026. Manufacturing concentration in Changzhou
              may reduce M&A appeal to US strategic buyers subject to domestic content requirements or CFIUS national
              security review, limiting exit optionality and potentially requiring a discount to comparable private
              company values for US-based strategic acquirers. Final diligence before committing to any significant
              position must include an audited revenue run-rate, a preference-stack waterfall model, an independent
              manufacturing readiness audit of the Changzhou line, and a competitive-displacement analysis against Gen 4
              lithium BESS and iron-air alternatives.
