          - type: callout
            title: Strategic Investor Composition Is the Strongest Valuation Anchor
            body: >-
              The concentration of strategic investors -- Aramco Ventures, SLB, HKIC, NEOM, and Full Vision Capital --
              is simultaneously EnerVenue's strongest valuation anchor and its most likely exit mechanism. If
              manufacturing scales and revenue materializes, one of these parties has both the capital and strategic
              incentive to acquire the company rather than compete with it in the public market. The Aramco-SLB
