      - number: '6.2'
        title: Named Customer Proof, Deployment Status, and Pipeline
        blocks:
          - type: paragraph
            body: >
              As of May 2026, EnerVenue's customer proof spans seven distinct named supply agreements or pilot
              relationships, with varying stages of maturity from announced MOU to commissioned product. The
              highest-confidence evidence is the Towngas Gen-4 Aqueous Metal Cell (AMC) pilot in Jintan, Changzhou,
              Jiangsu, commissioned in May 2026—the world's first real-world deployment of EnerVenue's fourth-generation
              technology. The 150 kWh system (50 AMCs in an Energy Rack with inverter and BMS) operates continuous
              2-to-4-hour charge-discharge cycles daily at an electric bus charging station co-located with solar,
              reducing energy costs in real operating conditions. Towngas Managing Director Peter Wong Wai-yee endorsed
              the technology publicly, stating EnerVenue can play a key role in cost-effective renewables deployment.
              VedantaESS (Brazil) holds the largest announced single contract at 525 MWh over three years (75/150/300
              MWh in 2024/2025/2026), with VedantaESS president Richard Phillips noting enormous longevity, reliability,
              safety, savings, and flexibility. The 2026 tranche of 300 MWh would be EnerVenue's largest single-year
              physical delivery milestone; whether this has shipped is unconfirmed publicly as of the runDate. Pine Gate
              Renewables' 2.4 GWh multi-year supply agreement (2022) is the largest single announced volume, but it is
              structured as a framework agreement providing Pine Gate's development partners with the option to select
              EnerVenue batteries across the project pipeline rather than as a firm purchase order, and delivery
              execution has not been independently confirmed. RWE commenced performance testing of EnerVenue ESVs at its
              Milwaukee facility in December 2024, with SVP Andrea Hu-Bianco confirming grid-scale storage pilot intent
              aligned with RWE's 6 GW storage expansion roadmap to 2030—but pilot completion and production commitment
              timeline remain open. Dominion Energy's EnerVenue pilot at Virginia State University (1.5 MW, 10-hour
              duration) was proposed to the Virginia State Corporation Commission and received approval but
              commissioning is expected in 2027, not yet built. High Caliber Energy delivered a 25 MWh order to an
              unnamed major SE US utility in Florida (Q4 2024 delivery target), with High Caliber Managing Partner Matt
              Davis citing operational efficiency, reliability, flexibility, and cost-effectiveness. Avid Group
              (Australia, Perth) signed a master supply agreement in August 2024, positioning EnerVenue products for
              mining, C&I, and microgrid customers with Avid's manufacturing site as the reference installation. CEO
              Rath stated in March 2026 that pilot projects are very likely to be directly converted into sales orders
              in the next few months, and the company reports a total of $2.3 billion in orders and 56 GWh in its global
              sales pipeline—representing an 8x year-over-year increase, though the firmness of individual commitments
              (binding PO vs. MOU vs. LOI) is not publicly disclosed.
