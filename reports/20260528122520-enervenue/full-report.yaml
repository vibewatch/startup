            title: Manufacturing Pivot Creates Dual Concentration Risk
            body: >-
              EnerVenue's decision to abandon its Kentucky factory in November 2024 and concentrate all high-volume
              manufacturing in Changzhou, China creates simultaneous geopolitical and operational concentration risk.
              US-China trade tensions, potential tariff escalation on battery imports, and the complexity of managing a
              GWh-scale industrial ramp from a Silicon Valley R&D base are all material uncertainties that a $1B-plus
              valuation must price in. The appointment of Henning Rath with supply-chain experience at Enpal signals
              management awareness of this risk, but execution track record at GWh scale remains unproven and the
              Kentucky precedent cannot be dismissed.
            calloutType: risk
            claimRefs:
