            integration.
        - label: Technology Proof
          score: 8
          outOf: 10
          note: 30,000-cycle NASA heritage; UL1973/UL9540A certified; RWE and Duke Energy pilot validations completed.
        - label: Strategic Investor Quality
          score: 9
          outOf: 10
          note: Aramco Ventures, SLB, HKIC, NEOM, IDG Capital; syndicate provides distribution channels, not just capital.
        - label: Manufacturing Execution
          score: 4
