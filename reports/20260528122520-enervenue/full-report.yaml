      - number: '2.2'
        title: 'Sizing lenses: TAM/SAM/SOM and the divergence in public estimates'
        blocks:
          - type: paragraph
            body: >-
              Public market sizing evidence is plentiful but divergent: global stationary energy storage estimates for
              2026 range from roughly $44B to more than $82B depending on whether scope includes distributed residential
              storage, behind-the-meter commercial, and adjacencies. The Business Research Company pegs the 2025 base at
              $44.2B growing to $53.5B in 2026 at a 21% CAGR, while Research and Markets cites a broader $82B-plus scope
              for 2026. These differences reflect definitional choices, not errors, and should not be averaged. The
              long-duration energy storage segment — a more relevant proxy for EnerVenue's SAM — was valued at $4.85B in
              2024 by MarketsandMarkets, growing to $10.43B by 2030 at 13.6% CAGR. The nickel-hydrogen stationary
              storage niche specifically is estimated at $1.32B in 2024 by dataintelo with a 12.4% CAGR through 2033.
              U.S. annual BESS installations set a record of 57.6 GWh in 2025 per SEIA, a roughly 30% year-over-year
              gain, while BloombergNEF forecast 158 GW of global storage deployments in 2026. These deployment figures
              are dominated by short-duration LFP systems and cannot be straightforwardly attributed to the LDES or
              non-lithium sub-segments. Public evidence does not provide a company-specific SAM or SOM for EnerVenue, as
              no independent source quantifies its pipeline, conversion rate, or near-term revenue capture within the
              broader LDES market.
