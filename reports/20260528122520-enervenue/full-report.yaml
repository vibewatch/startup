      - number: '8.4'
        title: Scenario Analysis
        blocks:
          - type: paragraph
            body: >-
              The bull case ($1.8B-$2.5B implied valuation) requires EnerVenue to successfully ramp the Changzhou 250
              MWh production line by Q3 2026, convert at least 10% of the $2.3B prospective pipeline to contracted
              revenue by mid-2027, and demonstrate a clear path to 1 GWh annual capacity by end-2027. Under these
              conditions, a strategic acquirer or a 2028-2029 IPO would likely apply a premium multiple to proven
              manufacturing velocity. The RWE pilot, Duke Energy supply relationship, and SLB and Aramco distribution
              channels create a credible first-mover base.

              The base case ($1.1B-$1.5B) assumes a 6-12 month Changzhou delay, modest pipeline conversion, and
              continued revenue opacity. The valuation mark holds near current third-party LDES ranking estimates
              supported by anchor investor positions and technology differentiation, but investors cannot mark up
              further without commercial milestones. The new CEO's supply-chain mandate may narrow execution risk, but a
              manufacturing-focused leader cannot generate revenue demand independently.

              The bear case ($600M-$900M) materializes if the Changzhou ramp is delayed more than 12 months, the $2.3B
              pipeline fails to convert to binding orders by year-end 2026, or competitive lithium cost reductions
              eliminate nickel-hydrogen's TCO advantage for 8-hour applications. BNEF reported lithium-ion battery pack
              prices fell to $108/kWh for stationary storage in late 2025. Continued deflation below $80/kWh for 8-hour
              equivalent applications would be a direct threat. The Kentucky factory abandonment precedent is
              non-trivial: another execution failure would trigger a down-round near or below the 2023 Series B implied
              mark.
