      - number: '5.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Inherent Safety Is a Structural Cost Advantage
            body: >
              EnerVenue's zero-thermal-runaway chemistry is not just a safety feature — it is a project economics
              feature. The absence of fire suppression infrastructure, HVAC systems, and mandatory rest cycles removes
              three recurring cost lines from 30-year project models. For sites in populated areas, petrochemical
              facilities, or data center campuses, it also unlocks siting options that are structurally blocked for
              lithium-ion. The UL 9540A no-flame result at the cell level is independently verified and materially
              differentiating in site permitting.
            calloutType: strength
            claimRefs:
              - CE022
              - CE045
              - CE049
          - type: callout
            title: Manufacturing Pivot to China Carries Geopolitical and Execution Risk
            body: >
              EnerVenue's strategic decision to abandon its Kentucky gigafactory in late 2024 and shift high-volume
              manufacturing to Changzhou, China introduces concentrated geopolitical and supply chain risk. The move
              subjects EnerVenue to U.S.-China trade friction, potential tariffs on battery imports, and reputational
              headwinds in a market where domestic content and IRA compliance are increasingly procurement-decisive. The
              Kentucky abandonment also established a pattern of production-delay-driven strategy pivots: the company
              skipped an entire product generation (Gen 3) to accelerate Gen 4, resulting in schedule slippage. The 250
              MWh manufacturing ramp is freshly funded but unproven.
            calloutType: risk
            claimRefs:
              - CE028
              - CE041
              - CE043
          - type: callout
            title: Low Energy Density Is the Product's Principal Non-Addressable Constraint
            body: >
              EnerVenue's nickel-hydrogen cells achieve approximately 20–30 Wh/kg gravimetric energy density versus
              150–205 Wh/kg for LFP cells. This is not a gap the company can close through manufacturing efficiency — it
              is intrinsic to the electrochemistry. EnerVenue's commercial thesis requires that grid-scale stationary
              storage buyers do not weight energy density as a gating criterion. For applications where footprint
              matters (offshore, rooftop, constrained urban sites), the AMC is structurally uncompetitive. Diligence
              should confirm whether target customers have footprint constraints that would override the durability
              advantage.
            calloutType: insight
            claimRefs:
              - CE044
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer Personas
        blocks:
          - type: paragraph
            body: >
              EnerVenue addresses four primary buyer segments, each with distinct procurement dynamics, contract
              structures, and energy storage requirements. Utilities and independent power producers (IPPs) form the
              cornerstone segment, procuring large-scale storage to meet grid reliability mandates, renewable-firming
              obligations, and long-duration capacity targets. For utilities, EnerVenue competes on
              total-cost-of-ownership over a 30-year horizon, positioning its 30,000-cycle design life and
              zero-augmentation model against lithium-ion replacement cycles every 5-7 years. The procurement path for
              utilities is lengthy—regulatory filings, competitive RFPs, credit underwriting, and in some US
              jurisdictions, state utility commission approval (as with Dominion Energy's pilot proposal submitted to
              the Virginia State Corporation Commission). Commercial and industrial (C&I) customers, including
              manufacturing sites, mining operations, and maritime/offshore projects, seek behind-the-meter resilience,
              demand charge reduction, and off-grid capability. This segment was the target of EnerVenue's earliest
              supply agreements: Sonnell Power Solutions (Puerto Rico industrial sector) and Green Energy Renewable
              Solutions/Nicon (Danish maritime/heavy industry). The fire-safe, extreme-temperature profile of
              nickel-hydrogen chemistry is the primary differentiator for these buyers, who face unique safety and
              environmental regulations. Remote microgrid and mining customers—served through regional partner Avid
              Group in Australia—represent a third segment where EnerVenue's low-maintenance, high-durability
              positioning reduces total operating cost in locations where technician visits are expensive. Finally, AI
              data centers represent an emerging buyer persona; EnerVenue's 60-degree-C ambient operating tolerance and
              tight-pack density (no fire suppression needed) align well with hyperscale data center economics, though
              no confirmed data center customer existed as of May 2026. Buyer personas span utility procurement
              officers, EPC consulting firms (High Caliber Energy in SE US, Avid in Australia), project developers (Pine
              Gate Renewables), and corporate sustainability/energy leaders at industrial firms.
