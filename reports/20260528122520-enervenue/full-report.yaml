      - number: '6.3'
        title: Partner Channels and Procurement Architecture
        blocks:
          - type: paragraph
            body: >
              EnerVenue operates a hybrid go-to-market model combining direct large-utility relationships with regional
              distribution partnerships and EPC intermediaries. The regional distribution channel is anchored by Towngas
              in Greater China—the first distribution agreement, signed in spring 2021—which gives EnerVenue access to
              Towngas's utility and commercial network across mainland China. Critically, Towngas's parent company
              (Henderson Land, co-chaired by Peter Lee) led EnerVenue's 2026 $300M Series B extension through Full
              Vision Capital, creating a deep strategic alignment but also a material conflict of interest: Towngas is
              simultaneously the primary Asia-Pacific distribution channel, a customer (both of the pilot site and
              historic deployments), and a lead investor. SLB (formerly Schlumberger), a strategic investor since early
              funding rounds, signed a collaboration agreement to leverage its global energy-sector footprint for
              EnerVenue's stationary storage—particularly relevant for oil-and-gas adjacent utility and industrial
              customers in the Middle East, North Africa, and global energy-transition markets. However, SLB's
              contribution to actual sales volume remains small relative to EnerVenue's direct pipeline, as CEO Jorg
              Heinemann noted in June 2024. In Australia, Avid Group (Perth-based electrical engineering firm) acts as a
              master supply and integration partner for commercial, mining, and microgrid customers across the
              continent, planning to use its own manufacturing site as a reference installation. High Caliber Energy
              (Florida-based EPC and consulting firm) serves as an intermediary for utilities and industrial clients in
              the SE United States and Caribbean, having sourced the 25 MWh Florida order. The procurement path for
              large utility orders—Dominion Energy, RWE—is direct, governed by multi-year supply agreements and
              regulatory review processes. EPC intermediaries (High Caliber, Avid) typically source C&I and smaller
              utility projects, compressing EnerVenue's sales cycle for sub-100 MWh deployments. Saudi Aramco Energy
              Ventures (early investor) provides a commercialization pathway in Middle East markets where procurement of
              grid-scale storage is state-utility-driven and relationship-dependent.
