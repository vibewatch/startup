              The mid-2024 CEO-disclosed $2.3B backlog (8x YoY increase) and 56 GWh pipeline are industry-scale demand
              signals that, if firm, could support multiple years of revenue at post-scale manufacturing volumes.
              However, EnerVenue has not published a backlog quality breakdown, and the company's track record of
              project execution (Kentucky factory abandonment, Gen 3 skip) leaves conversion timing uncertain. The
              combination of a large pipeline and an early-stage manufacturing ramp creates meaningful mismatch risk
              between demand recognition and supply delivery.
            calloutType: strength
