chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Technology, and Business Model
        blocks:
          - type: paragraph
            body: >-
              EnerVenue describes itself as a grid-scale energy-storage company that adapts nickel-hydrogen battery
              chemistry originally developed by NASA and Ford Aerospace for spacecraft power. The official about page
              and independent technical sources agree that the fourth-generation Aqueous Metal Composite (AMC) chemistry
              carries a claimed 30,000-cycle life, operates across a temperature range of approximately minus 40 to plus
              60 degrees Celsius without active thermal management, and requires no liquid electrolyte, which EnerVenue
              presents as a durability and safety advantage over lithium-ion alternatives. Yi Cui, an endowed-chair
              materials-science professor at Stanford University, licensed the technology from NASA and co-founded the
              company in 2020 in Fremont, California. Generation 4 cells use 400 Wh units designed for utility-scale
              multi-hour storage applications rather than short-duration frequency regulation.

              The business model as described across the company's public materials and independent trade coverage is
              hardware-focused: EnerVenue manufactures battery systems and sells them to utilities and independent power
              producers for stationary grid storage, with revenue recognition following physical project deliveries
              rather than a subscription or software model. Forbes designated EnerVenue the newest ClimateTech unicorn
              in June 2024, the same month the company's CEO disclosed a $2.3 billion order backlog representing
              approximately 56 GWh of pipeline. TIME named EnerVenue among America's Top 10 GreenTech Companies in 2025.
              Those recognition signals sit alongside material caution: the company disclosed no revenue figures in the
              research period, its Kentucky manufacturing site was abandoned in favour of Changzhou China production,
              and a federal contract dispute remains unresolved. For diligence purposes EnerVenue is best treated as a
              late-seed-stage hardware startup that has secured significant investor capital and early customer proof
              but has not yet demonstrated unit economics or recurring revenue at scale.
