  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      EnerVenue's highest residual risks cluster around manufacturing scale-up credibility and FEOC/tariff exposure,
      followed by investor-partner concentration and Gen 4 recertification. Financial and competitive risks are
      meaningful but partially mitigated by the recent $300M raise and a differentiated chemistry.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: FEOC and tariff exposure (China manufacturing)
          values:
            - label: high
              tone: negative
              detail: China-origin manufacturing confirmed; FEOC rules effective January 2026.
            - label: critical
              tone: negative
              detail: Blocks ITC eligibility for US customers; ~82% tariff on direct imports.
            - label: very-low
              tone: negative
              detail: No US assembly announced; no tariff exemption pathway disclosed.
            - label: critical
              tone: negative
              detail: Unmitigated exposure to US market access risk and customer cost burden.
        - label: Gen 4 manufacturing scale-up and recertification
          values:
            - label: medium-high
              tone: warning
              detail: Changzhou line targets 250 MWh in 2026 but no third-party verification exists.
            - label: high
              tone: negative
              detail: Delay pushes commercial deliveries and bankable UL certifications into 2027+.
            - label: low
              tone: negative
              detail: Kentucky abandonment is a prior scale-up failure; Gen 4 UL testing in progress.
            - label: high
              tone: negative
              detail: Residual risk stays elevated until Gen 4 testing complete and offtake contracted.
        - label: Investor-partner concentration (NEOM, Towngas, Aramco)
          values:
            - label: medium
              tone: warning
              detail: NEOM canceled $6.85B in contracts in March 2026; Towngas under property-sector pressure.
            - label: high
              tone: negative
              detail: Any strategic-partner withdrawal reduces pipeline, brand, and regional market access.
            - label: low
              tone: warning
              detail: Geographic diversification (HK hub) is partial; no alternative distributor named for China.
            - label: high
              tone: negative
              detail: Three regional anchors all face concurrent stress with no disclosed contingency.
        - label: Sector financial risk (competitor bankruptcies, LFP price pressure)
          values:
            - label: medium
              tone: warning
              detail: Ambri, Nilar, AMTE bankrupt 2024; ESS Inc. functionally out of cash April 2026.
            - label: high
              tone: negative
              detail: Sets sector precedent; LFP at ~$80/kWh compresses alternative-chemistry premium.
            - label: medium
              tone: warning
              detail: EnerVenue's $445M raise and 30,000-cycle claim differentiate it from LFP.
            - label: medium-high
              tone: warning
              detail: Premium TCO story depends on cycle-life claims that are not yet validated at scale.
        - label: CEO transition and leadership depth
          values:
            - label: low-medium
              tone: neutral
              detail: Henning Rath appointed March 2026; transition coincides with Changzhou ramp.
            - label: medium
              tone: warning
              detail: Poor execution during ramp-up directly delays first commercial deliveries.
            - label: low
              tone: warning
              detail: Rath brings supply-chain background but lacks LDES battery manufacturing experience.
            - label: medium
              tone: warning
              detail: Residual risk is manageable if factory management team is strong; not yet confirmed.
    approximationNotes: >-
      Heatmap ratings are ordinal and source-backed rather than quantitative. They represent relative severity based on
      available public evidence and are intended for ranking residual exposure, not expressing synthetic probabilities.
    claimRefs:
      - CR001
      - CR005
      - CR015
