      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              EnerVenue's founder story is well-documented across official and independent sources. Yi Cui, an
              endowed-chair professor in materials science at Stanford University and inventor of several battery
              chemistries, licensed nickel-hydrogen technology from NASA and founded EnerVenue in 2020. Public sources
              consistently place Cui as non-executive Chairman; his Wikipedia article and Stanford profile both confirm
              that Stanford is his primary position and EnerVenue a spinout. Cui holds key early patents on the battery
              architecture and has published extensively on battery materials science, which provides an unusually
              verifiable scientific foundation for the IP story.

              The CEO succession is the most significant governance signal in the fetched pack. Jörg Heinemann was the
              founding CEO from 2020 and was publicly credited with building the company's commercial strategy through
              the 2021 Series A and the 2024 Series B. Multiple independent sources report that Heinemann departed in
              late 2024; EnerVenue did not publicly announce a successor for approximately 16 months. Henning Rath was
              named CEO effective April 1 2026, confirmed by energy-storage.news. That vacancy gap is a material
              governance datapoint: the company was raising a $300 million extension round and managing active customer
              deployments for over a year without a confirmed chief executive. Confirming management depth and
              continuity commitments should be a priority in any follow-on diligence.

              Beyond Cui and Rath, the public record contains limited named-executive disclosure. Peter Lee, formerly of
              Andreessen Horowitz and now of Full Vision Capital, backed the company at seed and is a visible public
              supporter, though his formal board title and current seat are not confirmed in the fetched pack. Investor
              governance from SLB and Aramco Ventures, who led the 2021 Series A, is also not publicly detailed. The
              formal board composition, investor-rights terms, and cap-table economics therefore remain among the most
              important undisclosed items for any serious diligence process.
