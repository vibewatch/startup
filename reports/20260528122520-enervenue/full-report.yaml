      - number: '4.2'
        title: Capital Formation and Capital Adequacy
        blocks:
          - type: paragraph
            body: >
              EnerVenue has raised approximately $745M across four funding rounds as tracked by Tracxn and
              cross-referenced with SEC Form D filings. The first SEC-registered offering (filed December 2021) covered
              the $12M seed round (first sale dated July 30, 2020) and the $125M Series A (closed September 2021), with
              Saudi Aramco Energy Ventures and Schlumberger New Energy (SLB) as lead strategic investors. A second Form
              D filed June 5, 2024 disclosed a planned Series B offering of $515.6M total, with $308.1M already sold
              from 14 investors as of filing, with the first sale dated October 10, 2023. The March 2026 $300M Series B
              extension, led by Full Vision Capital (Peter Lee Ka-kit's family office) and including the Hong Kong
              Investment Corporation (HKIC), effectively completed the planned offering and added new institutional
              backing.


              With the $300M extension, CEO Henning Rath stated that short-term (250 MWh) and mid-term (1 GWh)
              manufacturing capacity targets are "now fully funded." The company will build its primary manufacturing
              facility in Changzhou, China (Jiangsu province), with groundbreaking for the 250 MWh line scheduled for
              later in 2026. Importantly, EnerVenue declined to disclose a post-money valuation following the March 2026
              close. Media and analyst sources (The Standard HK, PM Insights) characterize EnerVenue as a unicorn given
              the round size and investor profile, with an implied valuation well above the $600M–$903.5M range reported
              by CB Insights for its October 2023 round. Secondary market data cited by PM Insights show a 112%
              price-per-share increase since late 2024. The Series B extension follows an abandoned $264M Kentucky
              factory plan (withdrawn 2024), raising execution-risk questions that the China pivot partially—but not
              fully— resolves.


              Monthly burn rate is not publicly disclosed. At 92 employees (Tracxn, February 2026), mostly in R&D and
              commercial roles, a typical deep-tech pre-commercial burn of $2–5M/month is plausible, implying 24–36
              months of runway on the $300M extension alone—excluding any revenue inflows or manufacturing capex
              drawdowns for the Changzhou facility.
