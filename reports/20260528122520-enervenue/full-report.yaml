  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / Component
      - Role
      - Key Dependency
      - Risk
    rows:
      - - Nickel hydroxide cathode
        - Positive electrode; stores charge as NiOOH ↔ Ni(OH)2 redox
        - Nickel supply (abundant, not single-country constrained)
        - Nickel commodity price fluctuation; no critical mineral risk identified
      - - Nickel alloy anode with Ni-Mo-Co catalyst
        - Negative electrode; catalyzes H2 evolution and oxidation
        - Catalyst formula IP held by EnerVenue/Stanford; ~$22/kg raw cost
        - IP could be designed around; catalyst long-term durability at scale unverified
      - - Alkaline (water-based) electrolyte
        - Ionic conductor; reservoir held in porous polyolefin separator
        - Deionized water and potassium hydroxide (no lithium, no organic solvent)
        - No thermal runaway pathway; electrolyte freeze risk below -20°C mitigated by operating range
      - - Composite pressure vessel
        - Hermetically sealed container for hydrogen gas pressure management
        - Composite materials sourced globally; transitioned from stainless steel (NASA heritage)
        - Mechanical integrity under repeated pressure cycling — long-term data from NASA heritage
      - - Battery Management System (BMS)
        - Cell-level monitoring, state of charge/health estimation, protection, Modbus TCP/IP comms
        - Proprietary EnerVenue firmware; compatible with 3rd-party controllers (DEIF documented)
        - BMS software/firmware versions and update mechanism not publicly documented
      - - Energy Rack enclosure (IP20) / RSIIC (IP54)
        - Structural housing, forced-air thermal management, seismic-rated frame
        - No HVAC, no chillers, no auxiliary fire suppression required
        - IP20 rack requires indoor or enclosure protection in harsh outdoor environments
    notes: >-
      Architecture data sourced from EnerVenue product pages, AMC datasheet, Technology Networks CTO presentation, and
      DEIF integration documentation. BMS firmware details are not publicly disclosed.
