      - number: '8.3'
        title: Comparable Set and Market Multiples
        blocks:
          - type: paragraph
            body: >-
              EnerVenue has no direct public-market equivalent. The most tractable public comparable is Fluence Energy
              (NASDAQ: FLNC), which trades at approximately 1.5x EV/sales on $2.58B TTM revenue with an enterprise value
              of approximately $3.9B as of May 2026. Fluence earns its multiple from a fully commercial, diversified
              revenue base across grid-scale lithium BESS projects globally. EnerVenue's chemistry differentiation
              premium would need to more than offset its pre-revenue stage discount. Fluence's FY2026 guidance of
              $3.2B-$3.6B revenue with 85% backlog coverage illustrates the commercial scale required to de-risk beyond
              the research-more stage.

              Among private LDES companies, Form Energy is the clearest comparable: estimated at $3.5B-$4.2B valuation
              with over $1.2B raised and a landmark $1B Google contract for 100-hour iron-air batteries. Its valuation
              premium over EnerVenue reflects demonstrated revenue inflection. Highview Power is estimated at
              $1.6B-$2.0B. Eos Energy Enterprises provides a cautionary public comp: post-commercialization execution
              difficulties led to near-bankruptcy in 2024. Energy Vault shows multiple compression post-revenue.

              Applied to EnerVenue, a 5x forward-revenue multiple on $150M projected 2027 ARR yields approximately
              $750M, a 9x multiple yields $1.35B (base case), and an 8x multiple on $300M revenue gives $2.4B (bull).
              The most defensible near-term floor is replacement cost: replicating EnerVenue's NASA IP access, UL
              certifications, and supply chain from scratch would cost substantially more than the current implied
              valuation range, providing a fundamental anchor even absent revenue evidence.
