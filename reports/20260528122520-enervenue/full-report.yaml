  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Market Structure
        blocks:
          - type: paragraph
            body: >-
              Grid-scale battery energy storage in 2026 is a two-tier market. At the top tier, Chinese integrated
              manufacturers — BYD, CATL, Sungrow, and their peers — plus Tesla and Fluence dominate commodity
              short-to-medium duration (two-to-four-hour) projects, collectively accounting for over 90% of the
              approximately 315 GWh installed globally in 2025. BYD overtook Tesla as the volume leader with 13% market
              share and over 60 GWh shipped; Tesla held 10% with 46.7 GWh. Fluence, the only Western integrator besides
              Tesla in the global top 10, reported a $5.6 billion order backlog as of May 2026.

              Below that incumbent layer, a cohort of alternative-chemistry players is competing for the growing slice
              of demand that lithium-ion cannot serve cost-effectively: durations above eight hours, environments
              hostile to lithium's thermal management requirements, or applications demanding a multi-decade asset life
              without augmentation. Form Energy (iron-air, 100-hour duration), Eos Energy (zinc hybrid, 4-12 hours), and
              ESS Inc (iron flow, 4-14 hours) have reached commercial deployment but none yet at the gigawatt-hour
              scale. Pumped hydro remains the cheapest multi-day option but is geography-constrained and cannot be added
              incrementally to existing sites.

              EnerVenue occupies a position that crosses both tiers: its Aqueous Metal Cell (AMC) is flexible enough for
              two-to-twelve-hour discharge, cycle-durable enough to serve high-cycle commercial and industrial
              applications, and safe enough for petrochemical and data-center siting that rules out lithium-ion. The
              competitive landscape therefore varies by customer segment: grid operators seeking lowest capex encounter
              Tesla and BYD head-on; safety-critical or extreme-environment buyers face a much narrower field dominated
              by EnerVenue and, at very long duration, Form Energy.
            claimRefs:
              - CP001
              - CP007
              - CP004
              - CP006
              - CP011
