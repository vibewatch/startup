  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Manufacturing and execution risk — a prior failure and an unproven ramp
        blocks:
          - type: paragraph
            body: >-
              EnerVenue's most concrete near-term risk is manufacturing execution. The company vacated its Shelby
              County, Kentucky facility in November 2024 without bringing it online, a failure directly attributable to
              a product strategy pivot to Gen 4. Canadian Solar subsequently took over the site. This is not a
              forward-looking concern — it is a historical fact that EnerVenue failed to commission its first planned US
              production facility. The company is now pursuing its second manufacturing attempt, this time at a 250 MWh
              capacity line in Changzhou, Jiangsu Province, China.

              The Changzhou ramp-up faces several compounding challenges. First, EnerVenue leapfrogged Gen 3 to
              accelerate Gen 4 development, creating a design-manufacturing gap. The Gen 4 product is in a joint pilot
              with Towngas in Hong Kong as of early 2026, but the path from a commissioning pilot to 250 MWh of bankable
              deliveries in 2026 has not been independently verified. Second, the company installed a new CEO, Henning
              Rath, in March 2026 — the same month it closed its $300M Series B extension. Rath previously served as
              managing director at Enpal, a German solar equipment company, not a battery cell manufacturer. His
              appointment represents a deliberate shift toward supply-chain and commercial execution, but it also means
              the leadership transition occurs during the most critical operational inflection point in EnerVenue's
              history.

              EnerVenue's 30,000-cycle and 30-year performance claims are derived from NASA nickel-hydrogen aerospace
              heritage, not from terrestrial commercial deployments at scale. The RWE pilot in the US and the Towngas
              pilot in Hong Kong are in early testing phases. No large-scale commercial offtake contract has been
              publicly announced. Until Gen 4 is certified, delivered at commercial volume, and confirmed to perform in
              grid conditions, these claims carry extrapolation risk that any investor should treat as a material
              uncertainty.
