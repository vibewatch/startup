  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Customer Value Proposition
        blocks:
          - type: paragraph
            body: >
              EnerVenue sells energy storage infrastructure designed for the multi-decade economics of the electricity
              grid rather than for the shorter-horizon demands of consumer electronics. The company positions itself as
              an infrastructure company whose storage systems must operate continuously for 30 years without significant
              degradation, augmentation, or intervention — a contract with buyers that it argues is fundamentally
              different from the "replace and augment" cycle inherent to lithium-ion battery systems.

              In customer workflow terms, EnerVenue addresses a specific pain point in grid-scale and
              commercial-industrial (C&I) energy storage: the high total cost of ownership (TCO) that accumulates from
              frequent augmentation events, complex thermal management requirements, and mandatory fire suppression
              infrastructure that lithium-ion technology demands. A utility or independent power producer deploying a
              100 MWh project with lithium-ion batteries must over-size at commissioning (127–219 MWh of installed
              capacity) to account for degradation, then inject fresh capital at augmentation events typically at years
              5, 12, and 15 of a 20-year project — complicating debt service, long-term revenue modeling, and O&M
              planning.

              EnerVenue eliminates the augmentation cycle. Its Aqueous Metal Cell (AMC) technology requires 112 MWh of
              commissioned capacity to deliver 100 MWh contracted output over 20 years, because the system retains 93.2%
              state of health at year 20. This shifts the economic comparison from nameplate-capacity capital to
              lifetime throughput and levelized cost of storage (LCOS), where EnerVenue claims a structural advantage.
              Pilot customers span utility-scale (RWE, Dominion Energy), large-energy-supplier (Towngas), and — in
              future plans — C&I microgrid and data-center adjacent applications. The product is sold as a DC block
              (Energy Rack or Energy Prism) that buyers integrate with their preferred power conversion systems (PCS),
              giving integrators flexibility while EnerVenue retains the proprietary cell and battery management system.
            claimRefs:
              - CE001
              - CE002
              - CE011
              - CE036
              - CE037
              - CE043
          - type: figure
            figureRef: FE002
            claimRefs:
              - CE016
              - CE038
              - CE045
      - number: '5.2'
        title: Product Line and Module Architecture
        blocks:
          - type: paragraph
            body: >
              EnerVenue's commercial product hierarchy is modular and hierarchical: the Aqueous Metal Cell (AMC) is the
              indivisible building block; Energy Racks are the deployable unit; the Energy Prism is the site-ready
              containerized DC block; and Energy Venue is the design concept for multi-megawatt-hour indoor building
              deployments. The modular architecture allows projects to scale from a single 150 kWh rack to multi-hundred
              MWh deployments without redesigning core components.

              The AMC cell (generation four, as of 2026) provides 3.0 kWh of nominal energy in a sealed, large-format
              Ni-H2 cell. Each cell is rated for 30,000+ cycles with 100% depth of discharge permitted. A single Energy
              Rack integrates 50 AMC cells, a pre-wired battery management system (BMS), and all interconnects into a
              150 kWh unit at 1,500 Vdc nominal, shipping factory-assembled for on-site installation in hours rather
              than weeks. The Energy Rack is compatible with both 1,000 Vdc and 1,500 Vdc system architectures,
              stackable up to three rows high, and rated for indoor or outdoor deployment. The Energy Prism packages six
              Energy Racks into an outdoor-rated container (900 kWh) that connects directly to an inverter at the DC bus
              — the fastest path from delivery to grid connection. The Energy Venue concept supports multi-rack
              installations within purpose-built structures with co-located PCS equipment in distributed or centralized
              configurations. No augmentation events are required across any product tier during the 30-year design
              life.
