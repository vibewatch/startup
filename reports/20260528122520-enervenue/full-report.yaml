  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing Architecture
        blocks:
          - type: paragraph
            body: >
              EnerVenue operates a hardware-centric revenue model: it sells Energy Storage Vessels (ESVs)—
              nickel-hydrogen battery units—directly to utilities, commercial and industrial operators, and grid
              developers. Revenue is recognized at project delivery, making it inherently lumpy and tied to large-scale
              capital procurement cycles. There is no publicly disclosed recurring service or software-as-a-service
              layer; the company has, however, launched a 20-year/20,000-cycle warranty product, which may carry a
              separately monetized service component.


              Distribution is augmented by channel partners: Towngas holds an exclusive distribution agreement in
              mainland China established in 2021, and Avid Group signed a Master Supply Agreement in August 2024 to
              supply EnerVenue's fourth-generation ESV-4 across Australia and West Africa. No list pricing has been
              publicly disclosed. Independent BESS market analysts estimate installed system costs at $350–$450/kWh for
              utility-scale hardware at current production volumes, roughly at parity with lithium iron phosphate (LFP)
              on upfront capex. EnerVenue's commercial case rests on a lower 30-year levelized cost of storage (LCOS)
              driven by its claimed zero-degradation, 30,000-cycle design life that eliminates mid-life augmentation
              costs common to LFP deployments.


              Primary revenue validation comes from named customer transactions: a 25 MWh order from High Caliber Energy
              for a Florida utility co-operative project (2023), pilot deployments to RWE at its Milwaukee testing
              facility (announced December 2024), and supply relationships with Duke Energy, Towngas, and Avid Group.
              CEO Jorg Heinemann (now succeeded by Henning Rath) disclosed a $2.3 billion order backlog and 56 GWh
              pipeline as of mid-2024, an 8x year-on-year increase, though no revenue recognition schedule has been
              published.
