      - number: '7.2'
        title: Regulatory, legal, and safety risk — certification gaps and a resolved litigation
        blocks:
          - type: paragraph
            body: >-
              EnerVenue's regulatory risk profile has two distinct layers. The first is certification continuity: the
              company completed UL 1973 and UL 9540A safety testing for its Gen 2 design in 2023, demonstrating no flame
              propagation during induced thermal runaway. But the Gen 4 design change requires a full recertification
              cycle. Until Gen 4 clears UL 1973 and UL 9540A, project lenders will be cautious about treating the
              product as bankable. NFPA 855:2026 adds a layer of compliance requirement by making Hazard Mitigation
              Analysis mandatory for nearly all BESS projects, including those using novel chemistries. EnerVenue's
              pressure-vessel design containing hydrogen gas may require additional compliance documentation beyond
              standard lithium-ion BESS review pathways.

              The second layer is intellectual property. EnerVenue holds multiple US patents, including US Patent
              12,107,249 (issued October 2024), covering electrode stack configurations for metal-hydrogen batteries.
              However, the core nickel-hydrogen chemistry originated from NASA patents, most of which are now in the
              public domain. EnerVenue's competitive moat is primarily in application engineering and manufacturing
              process — not foundational chemistry. The risk is further elevated because the company manufactures in
              China, where enforcement of US-registered patents against local competitors is materially harder than in
              US courts.

              On the litigation side, ATS Ohio, Inc. filed a commercial lawsuit against EnerVenue (case 2:23-cv-04187)
              in the Ohio Southern District Court in 2023. The case was dismissed with prejudice by stipulation in
              November 2025 after a judge had already ordered a mandatory adverse inference instruction against
              EnerVenue's counterclaim. The case is resolved, but it demonstrates that EnerVenue has faced commercial
              contract disputes significant enough to reach federal court. No other pending litigation has been
              disclosed as of May 2026.
