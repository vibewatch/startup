  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      EnerVenue's risks transmit through two main channels: manufacturing and commercial execution, and geopolitical and
      financial partner stress. Both channels converge on customer adoption and revenue, which ultimately determines
      valuation support and financing need.
    data:
      nodes:
        - id: mfg
          label: Manufacturing scale-up failure
          description: Changzhou line misses 250 MWh target; Kentucky abandonment left no fallback.
        - id: feoc
          label: FEOC and tariff exposure
          description: China-manufactured batteries face ITC disqualification and ~82% import tariffs.
        - id: cert
          label: Gen 4 recertification gap
          description: UL 1973 and UL 9540A certification for Gen 4 pending; required for project finance.
        - id: partner
          label: Partner and investor stress
          description: NEOM scale-back, Towngas financial pressure, and Aramco regional risk are concurrent.
        - id: lfp
          label: LFP and iron-air price pressure
          description: Competitors at ~$80/kWh compress EnerVenue's TCO premium for medium-duration storage.
        - id: adoption
          label: Customer adoption delay
          description: Pilots with RWE, Towngas, and Dominion remain pre-commercial as of mid-2026.
        - id: revenue
          label: Revenue and pipeline
          description: Commercial offtake contracts and project deployments drive revenue recognition.
        - id: financing
          label: Financing need and runway
          description: Pre-revenue company; $445M raised but monthly burn is significant.
        - id: valuation
          label: Valuation risk
          description: Lower adoption and higher execution risk compress downside support.
      edges:
        - from: mfg
          to: cert
        - from: mfg
          to: adoption
        - from: feoc
          to: adoption
        - from: feoc
          to: revenue
        - from: cert
          to: adoption
        - from: partner
          to: revenue
        - from: partner
          to: financing
        - from: lfp
          to: adoption
        - from: lfp
          to: revenue
        - from: adoption
          to: revenue
        - from: revenue
          to: financing
        - from: financing
          to: valuation
        - from: revenue
          to: valuation
    approximationNotes: >-
      The graph is qualitative and source-backed; it shows the plausible causal direction of risk transmission rather
      than quantified probability weights. Edges represent likely pathways, not guaranteed outcomes.
    claimRefs:
      - CR001
      - CR003
      - CR015
      - CR016
      - CR019
      - CR021
      - CR025
      - CR027
      - CR028
      - CR030
      - CR031
  - id: FR003
    title: Critical dependency map
    type: dag
    layout: wide
    summary: >-
      EnerVenue depends on a concentrated set of external nodes across manufacturing, distribution, standards
      certification, and investor anchors. Failure or stress in any one of these nodes can transmit directly to
      commercial execution and valuation.
    data:
      nodes:
        - id: changzhou
          label: Changzhou factory (China)
          description: Sole production asset; 250 MWh target in 2026; no disclosed backup facility.
        - id: towngas
          label: Towngas (China distributor)
          description: Exclusive China distribution partner and minority shareholder; under property-sector pressure.
        - id: neom
          label: NEOM Investment Fund
          description: Strategic Middle East investor; NEOM project cancellations create uncertainty.
        - id: aramco
          label: Aramco Ventures
          description: Gulf region access and minority investor; linked to Saudi energy policy.
        - id: ul
          label: UL / safety certification bodies
          description: UL 1973 and UL 9540A certification required for bankable project finance.
        - id: nfpa
          label: NFPA 855:2026 standard
          description: New mandatory HMA requirements effective 2026 apply to all BESS installations.
        - id: nickel
          label: Class I nickel sulfate supply
          description: Indonesia-concentrated; HPAL supply chain exposed to Strait of Hormuz disruption.
        - id: enervenue
          label: EnerVenue commercial operations
          description: Gen 4 product delivery, customer pilots, and US market strategy.
        - id: revenue
          label: Commercial revenue and pipeline
          description: First grid-scale commercial contracts and project deliveries.
      edges:
        - from: changzhou
          to: enervenue
        - from: towngas
          to: enervenue
        - from: neom
          to: enervenue
        - from: aramco
          to: enervenue
        - from: ul
          to: enervenue
        - from: nfpa
          to: enervenue
        - from: nickel
          to: changzhou
        - from: enervenue
          to: revenue
        - from: towngas
          to: revenue
        - from: aramco
          to: revenue
    approximationNotes: >-
      This dependency map is directional and qualitative; it highlights where partner or regulatory failure would
      transmit into operations or commercial revenue rather than quantifying probability of failure.
    claimRefs:
      - CR004
      - CR007
      - CR009
      - CR019
      - CR020
      - CR021
      - CR022
      - CR030
      - CR032
  - id: FV001
    title: Recommendation Logic Flow
    type: flow
    layout: standard
    summary: >-
      Decision flow from market opportunity and technology proof through execution and valuation risks to the
      RESEARCH-MORE recommendation.
    data:
      nodes:
        - id: market
          label: LDES Market Expansion
          note: Grid reliability, AI load growth, renewable intermittency create structural demand
          type: input
        - id: tech
          label: 30,000-Cycle NASA IP Moat
          note: No commercial lithium or iron-air competitor matches cycle life today
          type: input
        - id: investors
          label: Strategic Investor Quality
          note: Aramco Ventures, SLB, HKIC, NEOM, IDG provide distribution, not just capital
          type: input
        - id: pipeline
          label: $2.3B Order Pipeline
          note: 8x YoY growth as of June 2024; RWE, Duke Energy, VedantaESS pilots validated
          type: input
        - id: exec
          label: Execution Risks
          note: Kentucky abandoned Nov 2024; CEO transition; Changzhou ramp unconfirmed
          type: risk
        - id: revenue
          label: Revenue Opacity
          note: Zero disclosed ARR despite $745M raised; $2.3B pipeline 22 months stale
          type: risk
        - id: valuation
          label: Valuation Stretch
          note: $1.1B-$1.6B analyst-inferred range; no primary post-money disclosure
          type: risk
        - id: rec
          label: RESEARCH-MORE
          note: Require ARR at least $50M plus Changzhou ramp confirmation before upgrading to BUY
          type: output
      edges:
        - from: market
          to: rec
        - from: tech
          to: rec
        - from: investors
          to: rec
        - from: pipeline
          to: rec
        - from: exec
          to: rec
        - from: revenue
          to: rec
        - from: valuation
          to: rec
    claimRefs:
      - CV032
      - CV033
      - CV006
  - id: FV002
    title: Valuation Sensitivity Bar Chart
    type: bar
    layout: standard
    summary: >-
      Implied EnerVenue valuation under five revenue-multiple combinations illustrating the bear-to-bull range based on
      LDES market comparables. All values in millions USD.
    approximationNotes: >-
      Revenue estimates are illustrative; no public disclosure exists. Multiples based on Fluence public-comp floor
      (~1.5x) and private LDES premium range from New Market Pitch 2026. Values in millions USD.
    data:
      items:
        - label: 'Bear: 3x on $80M ARR'
          value: 240
        - label: 'Low-Base: 5x on $150M ARR'
          value: 750
        - label: 'Base: 9x on $130M ARR'
          value: 1170
        - label: 'High-Base: 8x on $200M ARR'
          value: 1600
        - label: 'Bull: 8x on $300M ARR'
          value: 2400
    claimRefs:
      - CV027
      - CV028
      - CV011
  - id: FV003
    title: Valuation Return Range Chart
    type: range
    layout: standard
    summary: >-
      Three-scenario valuation range for EnerVenue as of May 2026 based on manufacturing execution and pipeline
      conversion outcomes. Values in millions USD.
    data:
      items:
        - label: Bear
          low: 600
          high: 900
          note: >-
            Matches 2023 Series B implied mark; requires manufacturing delay of more than 12 months or competitive
            breakthrough
        - label: Base
          low: 1100
          high: 1500
          note: Consistent with New Market Pitch LDES ranking; 6-12 month ramp delay with modest pipeline conversion
        - label: Bull
          low: 1800
          high: 2500
          note: Requires on-schedule Changzhou ramp plus at least 10% pipeline conversion to contracted ARR by mid-2027
    claimRefs:
      - CV032
      - CV033
      - CV006
