  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary — from all stationary storage to EnerVenue's relevant wedge
        blocks:
          - type: paragraph
            body: >-
              EnerVenue's relevant market is not all stationary storage but a specific wedge where high cycle count,
              long calendar life, and non-flammable chemistry translate into buyer value. Stationary storage encompasses
              grid-scale battery systems, distributed behind-the-meter storage, and critical-infrastructure backup
              power. EnerVenue's Energy Rack and Energy Prism products target front-of-meter utility-scale and
              commercial resilience applications — explicitly excluding EV and consumer batteries, which have separate
              supply chains and no meaningful cycle-life overlap. Short-duration four-hour lithium-ion arbitrage
              systems, which dominate annual deployment volumes, are borderline included: they compete for the same
              utility procurement budgets but rarely require the 30,000-cycle durability that is EnerVenue's core value
              proposition. The more defensible boundary is applications requiring discharge durations of six hours or
              more, safety-restricted siting (data centers, hospitals, schools), or 20-plus-year replacement horizons
              that make amortized cell cost the dominant economic metric. Primary substitutes are LFP lithium-ion packs
              (shorter cycle life, lower upfront cost), vanadium redox flow batteries (long cycle life,
              geography-independent, but higher system cost), iron-air batteries (Form Energy, unproven at scale), and
              pumped hydro (large capital, geography constrained). EnerVenue completed UL 1973 cell certification and UL
              9540A abuse testing, which are necessary prerequisites for utility procurement and insurance approval in
              most U.S. states.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
