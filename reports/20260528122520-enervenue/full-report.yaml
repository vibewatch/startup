      - number: '6.5'
        title: Adverse Signals, Delivery Risk, and Evidence Quality
        blocks:
          - type: paragraph
            body: >
              Several adverse indicators temper the positive customer narrative. The most material is the Kentucky
              gigafactory withdrawal: EnerVenue announced a 1 GWh/year Kentucky factory in March 2023, raised
              significant expectations among prospective US-based customers, and then quietly vacated the Shelby County
              site (Canadian Solar subsequently took over the location). EnerVenue attributed the decision to
              accelerating Gen-4 development, but the effect is that the company has no near-term US manufacturing at
              scale, which constrains US utility procurement under IRA domestic content rules. The ATS Ohio
              production-automation lawsuit reinforces this narrative: the dispute centered on EnerVenue allegedly
              stopping payments on a $5.7M+ automated production system contract in March 2023 (the same period the
              Kentucky factory was being announced), with a court-ordered adverse inference instruction against
              EnerVenue's defenses issued in September 2025. The Luminostics v. EnerVenue breach-of-contract case
              (Alameda County, 2023) for premises modifications hints at broader vendor management friction, though
              unrelated to customer deployments. No customer-side product failures, thermal events, or field performance
              complaints are on record, and no WARN Act layoff notices related to customer-program disruptions exist.
              However, the absence of independently filed complaints may also reflect the small number of production
              deployments to date—most customers have not yet received and operated large volumes of product in the
              field. The evidence quality across almost all customer relationships is press-release-level: customer
              executives are quoted in EnerVenue-issued press releases or affiliated media coverage, not in independent
              audit, certification, or operational performance reports. The one partial exception is the Virginia State
              Corporation Commission filing by Dominion Energy, which represents a third-party-adjudicated procurement
              record.
            claimRefs:
