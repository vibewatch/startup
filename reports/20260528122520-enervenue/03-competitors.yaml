callouts:
  - calloutType: strength
    title: Inherent Safety as a Siting Moat
    body: >-
      EnerVenue's zero-thermal-runaway chemistry eliminates the fire-suppression infrastructure
      required by NFPA 855 for lithium-ion installations. In data centers, petrochemical facilities,
      and dense urban sites, this removes a material permitting cost and timeline hurdle that every
      Li-ion competitor faces. Ara Ake's independent multi-chemistry study found EnerVenue's cycle
      life highest of any technology evaluated — a finding that is not vendor-authored and gives the
      safety claim external validation beyond UL certifications.
    claimRefs:
      - CP024
      - CP025
      - CP026

  - calloutType: risk
    title: China Factory Concentration and Tariff Exposure
    body: >-
      EnerVenue's entire production ramp relies on a single Changzhou facility that has not yet
      reached 250 MWh/year of output. The same US-China trade tensions that create supply-chain
      risk for Li-ion competitors also expose EnerVenue to export-control and tariff risk on its
      manufactured product. Powin's 2025 bankruptcy illustrates that disruption can be fast and
      non-linear. A US production contingency has been mentioned but not funded or sited, and IRA
      domestic-content qualification would require a separate manufacturing investment.
    claimRefs:
      - CP034
      - CP035
      - CP036

  - calloutType: insight
    title: EnerVenue vs. Form Energy — Complement, Not Head-to-Head
    body: >-
      Form Energy's iron-air chemistry targets 100-hour storage — entirely outside EnerVenue's
      2-to-12-hour operational envelope. The two companies occupy adjacent but non-overlapping
      niches: EnerVenue for high-cycle, flexible short-to-medium duration storage in
      safety-constrained or extreme-environment applications; Form Energy for multi-day grid
      firming where lithium-ion is economically excluded. Large renewable-plus-storage portfolios
      may need both technologies, which creates partnership rather than substitution risk.
    claimRefs:
      - CP011
      - CP014
      - CP024

