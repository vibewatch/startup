evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-and-unit-economics
    missingEvidence: >-
      Current revenue, annual recurring revenue, gross margin, cash burn, and mix between hardware project sales and any
      service or lease revenue streams.
    whyItMatters: >-
      A company overview judgment is materially incomplete without knowing whether disclosed scale markers, capital
      raised, and customer deployments are translating into financial performance.
    diligencePath: >-
      Obtain CFO-prepared monthly or quarterly financials, audited statements if available, and a bridge from project
      deployments to revenue and margin.
    relatedQuestionRefs:
      - QO022
      - QO024
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: enterprise-headcount
    missingEvidence: Current enterprise-wide employee count and any recent hiring, attrition, or restructuring disclosures.
    whyItMatters: >-
      Headcount is a key maturity and burn-rate indicator for a capital-intensive hardware company; the absence of any
      public figure makes workforce health impossible to assess from open sources.
    diligencePath: Request current HR census by function and location plus a 12-month hiring and attrition summary.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: current-valuation-post-series-b-extension
    missingEvidence: >-
      Most recent priced equity valuation, security type, liquidation preferences, and any secondary activity around the
      2026 Series B extension.
    whyItMatters: >-
      Any investment recommendation framing and dilution-risk analysis require a current valuation anchor beyond the
      June 2024 Forbes unicorn designation.
    diligencePath: >-
      Request the latest financing documents, board materials approving the extension round, and any contemporaneous
      fairness or 409A valuation work.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: moderate
    topic: ATS-Ohio-lawsuit-outcome
    missingEvidence: >-
      Current status, settlement, judgment, or dismissal of ATS Ohio Inc. v. EnerVenue Inc., Case 2:2023-cv-04187 in the
      Southern District of Ohio.
    whyItMatters: >-
      An unresolved $5.7 million federal contract dispute is a real legal tail and may indicate vendor management or
      procurement integrity issues beyond the dollar amount.
    diligencePath: >-
      Request updated PACER docket records and any settlement communications; ask the company directly for current
      status and any reserve or accrual.
    relatedQuestionRefs:
      - QO018
      - QO012
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: moderate
    topic: 2026-order-backlog-update
    missingEvidence: >-
      Updated order backlog or contracted-revenue pipeline figure as of 2026, replacing the June 2024 $2.3B / 56 GWh CEO
      statement to Forbes.
    whyItMatters: >-
      A two-year-old backlog figure combined with a Kentucky factory abandonment and manufacturing pivot may mean the
      actual executable backlog is materially different from the cited number.
    diligencePath: >-
      Request a current signed-contract pipeline with execution timelines, customer names, and delivery schedules;
      cross-reference with Changzhou manufacturing capacity.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: board-composition-and-investor-rights-leadership-table
    missingEvidence: >-
      Full board roster, committee memberships, investor-designated director seats, consent rights, and any side letters
      or side agreements from the Series A through the 2026 extension.
    whyItMatters: >-
      Control economics and governance complexity are not assessable without knowing who holds board seats and what
      protections SLB, Aramco Ventures, and the undisclosed Series B investors received in exchange for their capital.
    diligencePath: >-
      Request current cap table, investor-rights agreement, voting agreement, and the most recent board resolution
      approving the Series B extension.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: series-b-investor-identity-stakeholder-map
    missingEvidence: >-
      Names of lead and co-investors in the $308M Series B and $300M extension; their economic terms, board rights, and
      any strategic supply or commercial agreements bundled with the investment.
    whyItMatters: >-
      The investor identity gap means the stakeholder map is fundamentally incomplete; undisclosed investors with board
      seats or consent rights pose unquantifiable governance risk.
    diligencePath: >-
