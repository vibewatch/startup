      - QO021
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: EnerVenue-specific SAM and SOM
    missingEvidence: >-
      No public source quantifies EnerVenue's contracted pipeline size, expected win share within the LDES market,
      near-term revenue potential, or backlog volume by geography or buyer segment.
    whyItMatters: >-
      Without a bottom-up pipeline view, broad LDES market narratives can overstate EnerVenue's near-term revenue
      opportunity; TAM/SAM/SOM cannot be triangulated to a company-specific number.
    diligencePath: >-
      Request segmented pipeline by stage (pilot, contracted, LOI), delivery schedules, pricing per MWh, and revenue
      forecast assumptions from the data room or management.
    relatedQuestionRefs:
      - QM013
      - QM027
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: Gen4 third-party cycle-life and calendar-life validation
    missingEvidence: >-
      EnerVenue's 30,000-cycle claim is based on cell-level UL testing and extrapolated from NASA heritage; no
      independent third party has published a full system-level test report validating cycle or calendar life for the
      Gen4 aqueous metal-hydrogen design at commercial scale.
    whyItMatters: >-
      The 30,000-cycle life is the central economic argument for EnerVenue's LCOS thesis; without independent
      validation, the LCOS advantage over deflating LFP cannot be verified.
    diligencePath: >-
      Request EPRI or NREL cycle-life test reports, independent engineer sign-off for the Towngas or Dominion pilot, and
      any warranty-backed performance guarantee language in commercial contracts.
    relatedQuestionRefs:
      - QM006
      - QM023
      - QM019
    relatedTableRefs:
      - TM001
  - type: conflicting-data
    severity: material
    topic: LFP cost crossover and tariff-adjusted landed cost
    missingEvidence: >-
      Public sources establish LFP at ~$70/kWh (2025) and EnerVenue's LCOS argument for long-duration use, but no
      independent analysis has modeled the crossover cycle count using current tariff-adjusted Gen4 production costs,
      real discount rates, and project-finance terms for U.S. deployments.
    whyItMatters: >-
      The economic case for EnerVenue depends critically on the LFP-vs-Ni-H₂ cost crossover being above a threshold that
      real utility projects will achieve; LFP deflation has moved this threshold adversely and may no longer support
      EnerVenue's LCOS claims for shorter-duration projects.
    diligencePath: >-
      Obtain EnerVenue's internal LCOS model with Gen4 cell cost, Gen4 yield assumptions, tariff pass-through, and
      benchmark against current BNEF-sourced LFP system pricing for 8-hour and 12-hour U.S. utility projects.
    relatedQuestionRefs:
      - QM022
      - QM013
    relatedTableRefs:
      - TM002
      - TM004
  - type: private-evidence-only
    severity: blocking
    topic: EnerVenue-pricing
    missingEvidence: EnerVenue's list price per kWh (hardware and installed) for the Gen-4 AMC at commercial scale.
    whyItMatters: >-
      Without list pricing, it is impossible to compute LCOS or compare total project cost against Tesla Megapack or BYD
      HaoHan on a consistent basis.
    diligencePath: >-
      Request commercial pricing schedule and a reference project proforma from EnerVenue's sales team or distribution
      partner (Towngas, VedantaESS).
    relatedQuestionRefs:
      - QP022
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: CATL-cycle-life-independent-validation
    missingEvidence: >-
      Independent verification of CATL Tener's claimed zero-degradation for the first five years of operation at grid
      duty.
    whyItMatters: >-
      If CATL's zero-degradation claim is validated, it narrows EnerVenue's cycle-life moat substantially for the first
      5-year augmentation window.
    diligencePath: Review CATL Tener third-party performance test reports or long-term utility references once available in H2 2026.
    relatedQuestionRefs:
      - QP018
