      - number: '2.3'
        title: 买家地图分裂在前沿构建者、企业平台所有者和预算敏感型开发者之间
        blocks:
          - type: paragraph
            body: >-
              这个市场的买家、用户和付款方并不相同。在前沿实验室和超大规模云厂商中，经济买家很可能是掌控算力、模型和工具预算的研究或平台高管； 用户是研究人员和工程师；付款方则是更大的基础设施或 AI
              组织。在企业里，检索和智能体系统常由 CIO、平台或知识管理预算购买， 但由产品团队、分析师和开发者使用。云和模型既有厂商进一步强化这种结构。OpenAI、Anthropic、AWS、Google Cloud 和
              Azure 都把模型访问、搜索、事实锚定和智能体控制的某种组合卖进集中预算，而不是纯个人刷卡工作流。这让采用路径分叉。一条路是与治理、
              隐私或集成要求相连的自上而下平台采购；另一条路是开发者自下而上试验，等工作流证明 ROI 后再把预算往上拉。Recursive 若要商业化，
              很可能两者都需要：在精英构建者那里有研究可信度，也要有一套包装叙事，让企业或平台所有者明白产品为何属于现有预算，而不是一个理想化 的科学项目。
