      - number: '3.2'
        title: 直接前沿与研究实验室同类
        blocks:
          - type: paragraph
            body: >-
              最接近的概念同类不是传统 SaaS 竞争对手，而是 AI 实验室和研究密集型平台。它们能可信地宣称比一家产品前初创公司更快提升模型能力、 开发者生产率或基础设施经济性。OpenAI Enterprise
              明确营销前沿模型和智能体，并把 Codex 加进去，帮助团队把目标变成完成的工作。 Anthropic 在 Team 和 Enterprise 计划中销售 Claude
              Code，并附带细粒度支出上限和分析。Ricursive Intelligence 尤其相关， 因为它采用了相似的递归框架：闭合 AI 与为其供能的芯片之间的反馈环，并在上线不到两个月后达到 $4 billion
              估值。Sakana AI 把自己定位为围绕自然启发智能构建的前沿实验室，并在日本拥有地域差异化。Together AI 并不被框定为纯实验室，但其面向研究优化的云、 99% 可用性 SLA、预训练和推理栈，会争夺
              Recursive 未来也需要的同一批技术买家注意力。直接同类给出的关键教训是，大多数相邻玩家 已经拿出了 API、平台、托管云或企业界面。Recursive
              还没有。在做到之前，它的竞争主要是人才、投资人注意力和未来买家心智， 而不是当前钱包份额。
