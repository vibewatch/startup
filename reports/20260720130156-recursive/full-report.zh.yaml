      - number: '3.3'
        title: 企业平台与替代品压力
        blocks:
          - type: paragraph
            body: >-
              如果 Recursive 最终把产品商业化到企业知识工作或研究自动化，最难的竞争可能来自那些从不自称递归自我改进公司的既有厂商。 Google Agent Search、AWS Bedrock 和 Azure
              AI Search 已经把事实锚定搜索、模型访问和智能体基础设施卖进现有采购通道。 Glean 销售的是建立在企业语境、连接器、权限和运行时控制之上的横向 AI 平台。Perplexity Enterprise
              则从以引用为中心的答案引擎 切入同一广义问题空间。这些产品重要，是因为它们把抽象研究命题转化成 CIO 今天就能购买的东西。价格纪律进一步强化替代压力。 CNBC 报道称，企业正从堆 token
              转向效率，并越来越多探索模型路由，而不是默认把每个任务交给最昂贵的前沿模型。 Anthropic 和 OpenAI 都已用支出上限、分析和业务控制来回应。这对 Recursive
              直接不利。一家年轻实验室没有分发界面、运营历史 或定价页，就必须证明的不只是技术有效，还要证明它胜过企业工作流里已经安装好的、捆绑式、有治理且懂预算的替代方案。
