      - number: '2.2'
        title: 自上而下的支出预测巨大，但自下而上的买家相关性紧得多
        blocks:
          - type: paragraph
            body: >-
              自上而下的数字无疑很大。Gartner 2026 年 5 月预测，全球 AI 支出当年约为 $2.596 trillion，其中 AI 基础设施单独超过 $1.43 trillion，AI 软件约 $453
              billion。Gartner 1 月发布的数字已经高达 $2.52 trillion，因此即便官方预测在同一年内也继续上修。 IDC 给出了更接近运营买家思维的用例视角。在 IDC 指南中，AI
              Infrastructure Provisioning 是最大单一用例，2024 年达到 $30.3 billion，预计 2028 年达到 $47
              billion；客服和欺诈分析工作流也已经各自占据数百亿美元中高段支出。这些数字重要， 因为它们同时说明两点。第一，AI 宏观市场真实存在且仍在扩张。第二，对 Recursive
              这样的产品前公司来说，立即相关的部分小得多： 由研究机构、超大规模云厂商平台团队，以及愿意为昂贵知识工作自动化付费的成熟企业掌控的预算。因此，Recursive 可信的可服务市场（SAM）
              足够大，值得关注，但仍远低于 AI 宏观总量头条。
