            - GPU 依赖
            - ''
        - label: 高可能性
          values:
            - ''
            - 发布工程不成熟
            - 产品化缺口
            - 客户证据缺口
    approximationNotes: 可能性和影响是基于公开证据做出的序数尽调判断，不是精算概率。
    claimRefs:
      - CR001
      - CR003
      - CR010
      - CR013
      - CR018
      - CR026
      - CR033
      - CR034
  - id: FR002
    title: 风险传导图
    type: dag
    layout: standard
    summary: 若干可见风险会相互传导，而不是彼此隔离。
    data:
      nodes:
        - id: compute
          label: 算力依赖
          detail: H100 / B200 / 前沿硬件
          claimRefs:
            - CR013
            - CR022
        - id: cost
          label: 成本与延误风险
          detail: 供给、费用和迭代变慢
          claimRefs:
            - CR014
            - CR023
        - id: product
          label: 产品化风险
          detail: 基准测试增益可能无法快速变成产品
          claimRefs:
            - CR010
            - CR032
        - id: customer
          label: 客户证据风险
          detail: 尚无可见采用或重复使用
          claimRefs:
            - CR028
            - CR033
        - id: valuation
          label: 估值压缩风险
          detail: 高估值更难守住
          claimRefs:
            - CR034
            - CR039
      edges:
        - from: compute
          to: cost
          label: 造成
        - from: cost
          to: product
          label: 拖慢
        - from: product
          to: customer
          label: 限制
        - from: customer
          to: valuation
          label: 抬高
    claimRefs:
      - CR010
      - CR013
      - CR014
      - CR022
      - CR023
      - CR028
      - CR032
      - CR033
      - CR034
      - CR039
  - id: FR003
    title: 依赖图
    type: dag
    layout: standard
    summary: Recursive 的公开风险面由上游代码、基准测试、硬件和既有厂商依赖共同塑形。
    data:
      nodes:
        - id: upstream
          label: 开源基线
          detail: nanochat、autoresearch、modded-nanogpt 开源基线
          claimRefs:
            - CR020
        - id: bench
          label: 基准测试生态
          detail: nanoGPT speedrun 和 SOL-ExecBench
          claimRefs:
            - CR021
        - id: gpu
          label: 前沿 GPU
          detail: H100 和 B200 级
          claimRefs:
            - CR022
        - id: market
          label: 既有市场层
          detail: OpenAI、Anthropic、Google、AWS、Azure、Glean、Perplexity 等既有玩家
          claimRefs:
            - CR024
            - CR025
            - CR026
        - id: buyers
          label: 集中的首批买家
          detail: 可能是小规模技术型人群
          claimRefs:
            - CR028
            - CR029
      edges:
        - from: upstream
          to: bench
          label: 支撑
        - from: bench
          to: gpu
          label: 运行于
        - from: gpu
          to: market
          label: 必须在其中竞争
        - from: market
          to: buyers
          label: 约束进入
    claimRefs:
      - CR020
      - CR021
      - CR022
      - CR024
      - CR025
      - CR026
      - CR028
      - CR029
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 从价格锚点、证据质量和商业化缺口，推导出继续研究的建议。
    data:
      nodes:
        - id: price
          label: 当前价格
          description: 2026 年 5 月 Series A 轮估值 $4.65B
        - id: proof
          label: 技术证据
          description: 2026 年 7 月文章和代码库提高了系统真实存在的置信度
        - id: market
          label: 市场顺风
          description: 2026 年 AI 支出和 AI-for-science 动能仍强
        - id: commercial
          label: 商业证据缺口
          description: 无公开收入、定价、客户或企业控制界面
        - id: competition
          label: 捆绑压力
          description: 既有厂商已经把治理和 AI 工作流打包
        - id: synthesis
          label: 综合判断
          description: 期权价值强，但公开证据难以支撑当前估值标记
        - id: call
          label: 建议：继续研究 / 跟踪
          description: 继续跟进，但不要无视价格买入
      edges:
        - from: price
          to: synthesis
          label: 设定入场门槛
        - from: proof
          to: synthesis
          label: 支撑上行
        - from: market
          to: synthesis
          label: 支撑 TAM 叙事
        - from: commercial
          to: synthesis
          label: 压低置信度
        - from: competition
          to: synthesis
          label: 抬高所需折价
        - from: synthesis
          to: call
          label: 净判断
    approximationNotes: 这是定性投委会逻辑链，不是数学模型。
    claimRefs:
      - CV001
      - CV004
      - CV011
      - CV026
      - CV039
      - CV040
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: Recursive 的估值最敏感于商业化证据，而不是只看 TAM 叙事。
    data:
      items:
        - label: 技术领先延续
          value: 4
          unit: ordinal
          detail: 有帮助，但单独不够
          claimRefs:
            - CV004
            - CV033
        - label: 产品封装出现
          value: 5
          unit: ordinal
          detail: 最大的正向重估变量
          claimRefs:
            - CV015
            - CV035
        - label: 具名客户证据出现
          value: 5
          unit: ordinal
          detail: 证明维持当前估值标记最直接
          claimRefs:
            - CV007
            - CV035
        - label: 融资条款转弱
          value: 5
          unit: ordinal
          detail: 最直接的下行重置变量
          claimRefs:
            - CV038
            - CV041
        - label: 既有厂商捆绑压力上升
          value: 4
          unit: ordinal
          detail: 压缩独立溢价空间
          claimRefs:
            - CV020
            - CV036
    approximationNotes: 1–5 序数条形反映基于公开证据集做出的估值敏感性判断。
    claimRefs:
      - CV007
      - CV015
      - CV020
      - CV033
      - CV035
      - CV036
      - CV038
      - CV041
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 围绕当前私人市场估值标记的示意性估值包络。
    data:
      items:
        - label: 悲观：商业化滞后 / 条款转弱
          low: 2
          high: 3.5
          unit: USD billions
          detail: 如果捆绑、融资或证据出问题，估值重置
          claimRefs:
            - CV036
            - CV037
            - CV038
        - label: 基准：部分产品化，早期证据
          low: 4
          high: 5.5
          unit: USD billions
          detail: 只有证据开始商业化，当前估值标记才守得住
          claimRefs:
            - CV001
            - CV035
        - label: 乐观：产品 + 买家 + 技术领先
          low: 6
          high: 8
          unit: USD billions
          detail: 需要多个私下尽调项解锁才过关
          claimRefs:
            - CV033
            - CV035
            - CV042
        - label: 否决：隐藏优先权悬顶
          low: 0.5
          high: 2
          unit: USD billions common-equity equivalent risk
          detail: 优先股堆叠不利时，名义估值可能夸大价值
          claimRefs:
            - CV038
            - CV041
    approximationNotes: 这些区间是随情景变化的估值边界，不是点估计；前提是假设没有未披露的灾难性法律或技术失败。
    claimRefs:
      - CV001
      - CV033
      - CV035
      - CV036
      - CV037
      - CV038
      - CV041
      - CV042
  - id: FV004
    title: 投资关键指标
    type: kpi
    layout: wide
    summary: 评分卡显示，叙事和技术上行空间异常强，但公开商业化证据薄弱。
    data:
      items:
        - label: 市场顺风
          value: 4
          detail: AI 投资与 AI 科学应用仍有强劲动能
          claimRefs:
            - CV011
            - CV012
        - label: 技术验证
          value: 4
          detail: 2026 年 7 月发布显著增强信心
          claimRefs:
            - CV004
        - label: 商业验证
          value: 1
          detail: 未公开披露定价、客户或收入
          claimRefs:
            - CV005
            - CV007
        - label: 护城河可见度
          value: 3
          detail: 研究优势具备可信度，但外部验证仍不完整
          claimRefs:
            - CV004
            - CV036
        - label: 治理清晰度
          value: 1
          detail: 董事会、优先权和权利安排在公开层面仍不透明
          claimRefs:
            - CV006
            - CV038
        - label: 估值支撑
          value: 2
          detail: 这个价格靠叙事更好讲，按常规框架更难支撑
          claimRefs:
            - CV001
            - CV028
            - CV039
        - label: 证据质量
          value: 2
          detail: 融资事实扎实；业务基本面仍未公开
          claimRefs:
            - CV001
            - CV007
            - CV043
    approximationNotes: 1-5 档评分综合各章证据，并有意对缺失的非公开披露扣分。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV006
      - CV007
      - CV011
      - CV012
      - CV028
      - CV038
      - CV039
      - CV043
