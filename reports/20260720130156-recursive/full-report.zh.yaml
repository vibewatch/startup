      - number: '7.3'
        title: 合作伙伴、依赖与市场结构风险
        blocks:
          - type: paragraph
            body: >-
              Recursive 的依赖栈集中在几处关键节点。公开发布显示，公司依赖 nanochat、autoresearch、 modded-nanogpt 等上游开源基线，依赖 SOL-ExecBench
              等基准生态，也依赖前沿 NVIDIA 级 GPU。 这些依赖对先进 AI 实验室都不罕见，但叠在一起意味着 Recursive 还没有公开证明自己拥有完全自给的技术栈。
              商业环境又加了一层依赖风险。买家越来越看重支出控制和路由效率，而 OpenAI、Anthropic、Google、 AWS、Azure、Glean、Perplexity 等在位厂商已经覆盖许多相邻工作流。因此
              Recursive 不只依赖供应商和硬件， 还依赖自己能否赶在在位厂商把相关功能打包进现有产品前进入市场。可能的首批客户也少且集中，
              合作伙伴集中和客户集中风险会同时出现。商业化如果依赖少数实验室、单一超大规模云厂商关系， 或一小群技术设计伙伴，谈判筹码可能在客户手里，而不是 Recursive 手里。
