            body: >-
              Recursive 最强的公开技术证据是技术产出；最弱的是信任和部署就绪度。公开来源显示出清晰依赖：已发布工作绑定 H100 和 B200 等前沿 GPU、 SOL-ExecBench 等基准生态，以及
