      - number: '2.4'
        title: 需求驱动真实存在，但市场也在惩罚浪费和无差异支出
        blocks:
          - type: paragraph
            body: >-
              最强的结构性驱动在于，企业和平台显然想要更多智能体自动化、事实锚定检索和 AI 驱动的工作流加速。Deloitte 称，员工 AI 访问率在 2025 年跃升 50%，且至少 40%
              项目已进生产的公司数量将在六个月内翻倍。与此同时，McKinsey 显示 AI 正挤入变革预算并增加运行成本， CNBC 则记录了明确的支出挤压：账单跑赢 ROI
              时，买家会削减或改道使用量。这些事实让市场有吸引力，但也不宽容。买家会为能减少人力 或释放差异化产出的 AI 买单；对无纪律的 token
              支出、简单任务过度使用前沿模型，以及治理薄弱的智能体部署，他们越来越怀疑。 这就是 Recursive 的核心市场判断。顺风异常强：基础设施投资、大型企业兴趣、快速演进的智能体平台。约束同样真实：算力强度、
              治理成熟度不足、模型路由压力，以及既有厂商捆绑相邻能力。Recursive 进入的是一个需求真实存在的市场，但清晰经济包装会比宏大 理论承诺更快拿到回报。
