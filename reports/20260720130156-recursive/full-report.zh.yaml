      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Recursive 的融资头条足够亮眼，容易遮住仍然缺失的大量承保输入。对一家成立于 2025 年、在公开报道中约 25 到 30 人、产品前的 AI 实验室来说，以 $4.65 billion 估值拿到超过
              $650 million Series A 轮资本，是很罕见的结果。这轮融资几乎肯定足以让公司积极招聘、
              购买算力，并在没有立即融资压力的情况下继续运营。但「现在大概率够用」不等于「足以支撑战略」。公开来源没有披露当前现金余额、
              月度烧钱速度、计划招聘节奏、预留算力承诺、债务义务或优先股堆叠细节。它们也没有说明公司预期 Series A 轮是支撑到商业发布、
              支撑到技术里程碑，还是仅仅支撑到更强的下一轮。公司自己的叙事暗示，这次融资是为一个雄心勃勃的研究步骤买单，而不是常规商业化扩张。
              这会增加融资依赖，因为研究里程碑可能在收入追上来之前很久就消耗资本。没有公开债务或老股交易披露，本身并不令人安心； 它只说明公开记录不完整。因此，尽调中的财务问题不是 Recursive
              今天有没有资本——它显然有——而是相对于命题背后的隐藏算力需求 和商业化路线图，它的资本是否足够。
