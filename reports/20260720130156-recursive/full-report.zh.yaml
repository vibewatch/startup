      - number: '4.4'
        title: 财务结论与关键尽调阻滞项
        blocks:
          - type: paragraph
            body: >-
              公开记录支持一个狭窄但重要的财务结论。Recursive 在其成熟度阶段展现出异常强的资本触达和高质量投资人财团。它也在 2026 年 7 月
              展示了足够的技术严肃性，走出了纯隐身叙事。它尚未公开证明的是收入质量、变现纪律或软件式经济性。没有公开年经常性收入（ARR）、没有公开合同证据、
              没有披露毛利率、没有发布定价，也没有销售效率代理指标。因此，本章不能支持经典的「强单位经济」或「高效增长」判断。最多只能支持 研究实验室资本形成判断。这对后续估值章节很重要：在 2026 年前沿 AI
              市场里，$4.65 billion 标记或许有战略可理解性，但没有收入 和成本披露，就无法用常规财务基础证明。决定性尽调阻滞项很直白：实际烧钱速度、算力承诺、股权结构表条款、招聘计划、首个产品路线图，
              以及证明未来任何产品都能在买家已经要求支出控制和路由效率的市场里捕获价值。在这些信息出现前，财务姿态应描述为资金充足， 但尚未获得财务承保。
