      - number: '8.4'
        title: 投资逻辑、反向逻辑与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              投资逻辑很直接：Recursive 是市场上资本最充足的早期 AI 实验室之一，投资人信号异常强， 所在品类如果自动化 AI 研究能够复利增长，确实有真实上行空间；现在公开技术证据也足够让故事不只是叙事。
              反向逻辑同样强：当前公开记录仍更像研究项目，而不是已验证业务；当商业化、治理和融资条款不透明时， 数十亿美元级私募估值会变得脆弱。决定性尽调问题不是公司是否有前景，而是新投资人要从这个价格赚钱，
              哪些条件必须成立。至少，管理层需要展示第一版商业包装、某些客户或试点证明、适合企业部署的产品控制表面、 从基准胜利到可重复购买行为的可信路径，以及不会用厚重优先权掩盖下行的股权结构条款。没有这些输入，
              买家实际上是在以溢价购买期权。因此，终止触发条件和最终尽调问题非常关键： 它们定义了哪些确切证据能把判断从值得关注推进到可投资。
