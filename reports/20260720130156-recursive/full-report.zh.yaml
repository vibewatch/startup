  - id: TV005
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 关键假设
      - 估值 / 回报逻辑
      - 概率信号
    rows:
      - - 乐观
        - Recursive 推出清晰产品界面，披露具名试点或客户，守住技术领先，且前沿 AI 融资环境仍开放
        - 私募估值可高于当前水平；约 $6B-$8B 的估值区间在叙事上站得住
        - 概率较低，因为多个目前缺失的证据点都必须很快出现
      - - 基准
        - 技术进展延续，产品化启动，但变现证据仍早，买方仍挑剔
        - 当前估值可以守住，或只小幅扩张；约 $4B-$5.5B 更像宽泛持有区间
        - 若公司能执行、但还没证明软件级经济性，这是最可能情景
      - - 悲观
        - 商业包装滞后，老牌厂商捆绑相邻功能，融资条款收紧，或技术领先收窄
        - 估值可能按降轮式重置到约 $2B-$3.5B；若优先权悬压明显，这一风险更高
        - 概率偏高，因为当前估值已经折现了很多未来成功
      - - 终止 / 逻辑破裂
        - 没有可见客户证明、没有可部署控制面，且下一轮融资条款转弱
        - 普通股结果可能显著差于名义私募估值所暗示的水平
        - 若隐藏优先权和商业化不透明同时出现，下行可能是二元的
    notes: 这些区间是美元十亿级的定性估值包络，来自里程碑逻辑，不是 DCF 或披露收入倍数。
    claimRefs:
      - CV011
      - CV026
      - CV033
      - CV034
      - CV035
