      - number: '1.3'
        title: 技术里程碑与运营就绪度
        blocks:
          - type: paragraph
            body: >-
              2026 年 7 月，Recursive 发布首篇技术文章和配套 GitHub 仓库，缩短了雄心与证据之间的距离。这些材料重要，是因为公司从纯承诺 迈向了至少一个可检查的研究里程碑。文章描述了一个自动化 AI
              研究循环：提出想法、实现想法、运行实验、验证结果，然后选择下一步尝试。 Recursive 随后声称在三个基准上取得 SOTA 结果，覆盖固定预算小模型训练、以速度为目标的小模型训练和 GPU kernel
              优化。 具体数字仍由公司发布，尚未独立复现，因此应视为有意义但尚未完全承保的证据。即便如此，公开工件集也强于普通隐身页：公司仓库中有 基准专属文件夹，与 Karpathy 的
              autoresearch、NanoGPT speedrun 等公开基准生态相连，并明确称融资会帮助扩展算力基础设施， 迈向首个 Level 1 自主训练系统。这个组合让命题更可读，但仍未证明商业产品或持久护城河。
