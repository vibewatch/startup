      - number: '5.2'
        title: 架构、基准与运营模型
        blocks:
          - type: paragraph
            body: >-
              从公开工件可以读出 Recursive 的运营模型。文章描述了一个循环：提出想法、实现想法、运行实验、验证结果，然后选择下一步尝试。 仓库把这个循环打包成面向具体基准的形态。在 nanoGPT speedrun
              中，系统把 GPT-2-small 训练优化到 8x H100 上平均 77.3 秒， 同时通过目标验证阈值并击败同硬件基线。在 nanochat autoresearch 中，Recursive
              发布多个解法，在单个 Modal B200 GPU 上跨 10 个 seeds 评估五分钟，其中包括从 Karpathy 基线优化出的最佳解法。在 SOL-ExecBench 中，Recursive 分享了
              235 个 kernel 实现中的 10 个在 B200 上的评分，同时将多数保留为私有，以避免影响排行榜。仓库也清楚显示，Recursive 的工作是组合式的， 不是从零开始：它建立在 KellerJordan
              的 modded-nanogpt、Karpathy 的 autoresearch 和 Karpathy 的 nanochat 之上，并在 Apache-2.0
              打包中保留上游声明。这个公开架构意味着一种实验室工作流，混合了自主实验、基准测试框架、人工选择的基线和高端硬件。 它更接近内部研究平台，而不是公共应用栈。
