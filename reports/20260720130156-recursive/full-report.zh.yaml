      - number: '8.2'
        title: 估值支撑与商业证明
        blocks:
          - type: paragraph
            body: >-
              Recursive 的公开估值支撑来自三处：资本进入能力、市场叙事和技术可信度。资本进入能力从 Series A 的规模和质量上很清楚。 市场叙事也看得见：Stanford、Gartner 和 McKinsey
              都在描述一个 2026 年环境， AI 投资、面向科学的 AI 和企业实验仍足够大，能够让前沿赢家获得不成比例的回报。 2026 年 7 月发布后，技术可信度明显提高。但这些都是上游估值支撑，不是变现的直接证据。
              缺失的商业证明格外重要，因为 2026 年的企业 AI 买家已经不再只为模型新颖性付费。CNBC 和 McKinsey 描述的是更重效率的预算环境， 而 Microsoft、Snowflake、OpenAI 和
              Anthropic 都公开宣传支出控制、治理功能、隐私边界或使用分析。 在已审阅的公开记录中，Recursive 还没有展示可比的产品包装层。这造成估值不对称：
              公司可能因为野心和人才而值得溢价，但公开证据尚未显示它能否把研究优势转成可控、可采购的工作流产品， 从而支撑数十亿美元级价格。
