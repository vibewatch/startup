      - number: '4.2'
        title: 成本结构与单位经济含义
        blocks:
          - type: paragraph
            body: >-
              虽然 Recursive 没有披露烧钱速度或毛利率，现有证据指向的是算力密集型成本结构，而不是轻 SaaS 画像。公司自己的技术材料突出三条 依赖昂贵前沿硬件和专业工程的基准轨道。nanoGPT speedrun
              结果在 8x H100 上测得。nanochat autoresearch 结果在单个 Modal B200 GPU 上跨 10 个随机种子运行。已发布的 SOL-ExecBench 样本显示，在 B200
              上测量了 235 个 GPU-kernel 实现中的 10 个。这些事实不能让外部人 算出烧钱速度，但确实说明公司工作在昂贵基础设施边缘，而不是做商品化 CPU 受限实验。Series A
              轮募资用途也指向同一方向：多个公开来源称， 融资将帮助锁定大规模算力基础设施，并支持首个 Level 1 自主训练系统。此外，市场环境并不宽容。McKinsey 称 AI 正消耗变革预算， CNBC
              报道称买家正从堆 token 转向效率、模型路由和支出控制。这意味着即便 Recursive 以后把软件卖进企业 AI 预算，
              也可能在尚未形成规模或采购杠杆前，就遇到成本敏感买家。因此，公开单位经济分析只能给出方向性结论：算力、研究人力和基础设施访问 很可能主导成本底座，而变现仍未定义。
