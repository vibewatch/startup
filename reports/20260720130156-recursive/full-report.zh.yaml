  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界窄于 AI 宏观叙事，但宽于单一研究工具
        blocks:
          - type: paragraph
            body: >-
              Recursive 并不争夺整个 AI 经济。它自己的材料把公司定位在自动化 AI 研究本身，这意味着相关市场边界位于前沿模型开发工具、 智能体研究自动化，以及帮助团队锚定事实、评估并运营 AI
              工作的企业或平台系统的交叉处。这个范围宽于小众基准工具，但窄于外界有时 贴在完整 AI 机会上的数万亿美元口径。因此，纳入的支出至少要覆盖三类：基础设施和模型开发平台、为 AI 工作流提供事实锚定的企业检索
              与知识系统，以及开发者、研究人员或受监管知识工作者使用的高价值智能体工具。排除的支出应包括通用消费者聊天订阅、非 AI SaaS、 以及与 AI 工作负载无关的广义云支出。替代品集合已经拥挤。买家可以转向模型
              API、RAG 栈、企业搜索产品，或更低成本的搜索和检索 API， 完全不必购买独立研究自动化平台。这就是为什么市场定义如此重要：Recursive 追的是一个有价值的问题，但今天还没有清晰预算线。
