      - number: '1.2'
        title: 创始人、融资信号与治理可见度
        blocks:
          - type: paragraph
            body: >-
              创始信号是公开市场和私募投资者这么早就关注 Recursive 的主要原因。官方文案称，联合创始人曾创建 Salesforce 和 Uber 的 AI 实验室，并领导过
              OpenAI、DeepMind、Google Brain 和 Meta 的团队；外部报道则稳定指向 Richard Socher 和 Tim Rocktäschel，范围更广的报道还加入 Yuandong
              Tian 以及 Josh Tobin、Jeff Clune、Tim Shi、Alexey Dosovitskiy、 Caiming Xiong
              等更大圈层。这样的广度对技术可信度是正向信号，但也带来真实的尽调褶皱：当前官网没有公布完整领导层或董事会名单， 公开来源无法完全校准确切的联合创始人名单或治理结构。不过，融资头条清晰得多。Wilson
              Sonsini、Tech.eu 和 TechCrunch 都支持同一核心事实：Recursive 于 2026 年 5 月 13 日走出隐身，完成超过 $650 million 的 Series A 轮，估值
              $4.65 billion， 由 GV 和 Greycroft 领投，Nvidia 与 AMD Ventures 参投。对一家成立于 2025 年的实验室来说，这是异常强的资本和信号结果，
              但不能把它误读为控制条款、董事席位或老股交易的披露深度。
