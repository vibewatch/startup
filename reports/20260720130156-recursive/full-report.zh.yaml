      - number: '7.2'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              Recursive 目前公开的产品形态仍是研究软件，因此运营风险画像很具体。公司已经证明自己能产出基准测试产物， 但公开资料看不到运行时间承诺、支持体系、部署流程或面向客户的控制。已发布仓库也只是部分开放： 10
              个内核实现公开，225 个仍为私有，外部无法完整判断最强内部能力能否泛化或规模化。技术栈依赖 H100、B200 等前沿 GPU，也依赖基准测试驱动的工作流；成本和供应敏感度因此都被抬高。运营上，
              Recursive 容易受硬件到位延迟、基础设施费用上升，或基准表现转化为可用产品质量的路径慢于预期影响。 安全和质量风险也受开源与社区动态牵动。GitHub
              页面显示有一定外部互动，但没有公开发布节奏、打包版本、 PR 历史，issue 线索也有限。年轻研究项目出现这种情况并不异常，但也凸显公开运营形态仍非常早期。 技术可能是真的；生产运营的公开证据仍很少。
