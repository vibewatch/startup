chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、版图与研究假设
        blocks:
          - type: paragraph
            body: >-
              今天的 Recursive 更应被理解为前沿 AI 研究实验室，而不是一家已有出货产品目录的商业软件供应商。它目前的官方线上入口是 recursive.com 域名，公司在这里把目标表述为构建能递归改进自身的
              AI，用以自动化知识发现，并首先自动化 AI 科学本身。 同一批官方材料强调安全，也把公司定位为追求开放式算法，而不只是扩展常规基础模型栈。公开足迹信号不大，但彼此一致： 首页和 X 资料都指向 San
              Francisco 与 London，Tech.eu 还补充了 London 注册说明。组合起来看，这像是一家拥有英国法律根基
              和美国运营存在的跨大西洋实验室。同样重要的是概览中明显缺席的内容：网站没有展示定价、客户标识或公开产品注册入口，
              独立发布报道也明确称，公司走出隐身时尚未发布产品。因此，本章层面的判断应是：研究优先的身份、异常充足的资本支持， 但商业化证据仍然有限。
