  - id: TV007
    title: 最终尽调事项表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 商业化
        - 产品路线图、包装计划和定价模型
        - 决定基准测试证明能否变成可变现的工作流软件
        - 管理层介绍和产品演示
      - - 客户 / 试点
        - 具名客户、试点或设计伙伴，以及用例
        - 把叙事需求和可观察的买方采用区分开
        - 客户访谈和管线复核
      - - 治理 / 控制
        - 管理控制、日志、安全态势和合规路线图
        - 严肃企业部署必须具备，也用于对比老牌替代方案
        - 安全与合规尽调
      - - 财务
        - 当前收入、烧钱速度、算力承诺和现金跑道
        - 把融资故事转成可承销的业务故事
        - 财务资料室审阅
      - - 股权结构表 / 优先权
        - 完整证券层级、优先权、按比例认购权和特殊权利
        - 理解名义估值对普通股结果意味着什么，这是必备项
        - 法律尽调和瀑布模型
      - - 里程碑计划
        - 未来 6-12 个月哪些具体成果应支撑下一次估值
        - 定义能推动建议变化的证据路径
        - 董事会材料和运营计划
    notes: 这些尽调要求有意收窄并直接服务决策；若回答充分，建议可以上调。若不能，当前价格仍难以辩护。
