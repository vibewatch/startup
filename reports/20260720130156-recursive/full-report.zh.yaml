      - number: '3.4'
        title: 切换成本、护城河耐久度与反向证据
        blocks:
          - type: paragraph
            body: >-
              Recursive 的竞争上行在于，少有竞争对手围绕公司精确命题组织起来：用自动化 AI 研究来改进 AI 本身，再把这套打法扩展到更广泛科学。
              下行在于，它可能变现进入的大多数相邻市场，在模型层技术锁定效应弱，在工作流层既有厂商力量强。CNBC 对模型路由的报道很直接： 即便更便宜的模型可以完成任务，约 95% 的企业 AI
              使用仍停留在昂贵前沿模型上，这意味着路由成熟后价格压缩应会加剧。DeepSeek 以及 Llama 4 等开放权重家族进一步压低通用访问价值。一旦新工作流证明有价值，OpenAI、Anthropic
              和云平台也能快速吸收功能。 关于 Recursive 自身，最不利的公开证据仍与公司概览一致：TNW 描述的是一家没有公开产品、披露很薄、却坐在 $4.65 billion 估值上的公司。 从竞争角度看，这意味着
              Recursive 当前叙事护城河强、商业护城河弱。要补上这个缺口，它需要明显更强的研究产出、专有数据和工作流嵌入， 或者能把研究引擎转成可重复购买动作的分发伙伴。
