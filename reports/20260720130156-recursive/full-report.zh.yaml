      - number: '8.3'
        title: 可比公司组与情景区间
        blocks:
          - type: paragraph
            body: >-
              Recursive 没有公开收入基数，传统收入倍数框架会制造伪精确。更好的方法，是把里程碑估值与公开可比公司边界结合起来。 可比表不能证明 Recursive 值 $4.65
              billion，但能显示市场已经给哪些公司远高于 Recursive 的估值： Palantir、Snowflake、ServiceNow、Microsoft 和 MongoDB 的公开市值都远高于
              Recursive 的标记， 同时也都通过可见的企业级包装和治理表面销售真实产品。在这个公开可比组里，Anthropic 是最相关的前沿实验室参照， 因为它 2026
              年的官方融资更新把巨大估值与明确的收入运行率和企业采用表述配在一起。Recursive 还没有做到。 这个缺口比绝对估值算术更重要。按情景看，乐观情景只有在 Recursive 推出真实产品形态、
              拿下具名买家并守住技术领先时，才可支撑更高估值。基准情景只有在产品化和客户证明迅速出现时， 才能支撑接近当前标记。悲观情景——商业延迟、平台打包、融资条件转弱或技术滑坡——
