              年中。到运行日为止，真正已经出货且最清晰可见的里程碑，是 2026 年 7 月文章和 GitHub 发布。
              这很重要，因为它把公司从无法证伪的隐身叙事，升级为可检查的技术叙事。但它仍未解决最大的成熟度问题：外部用户的产品边界是什么？
              当前公开材料至少支持五个成熟度结论。第一，公司有连贯命题。第二，它展示了多资产技术栈，而不是单一基准技巧。第三，它能以可复现仓库
              和许可合规打包研究结果。第四，公开产出仍像研究工件，不像部署级软件。第五，未来路线图很可能既依赖改进原始研究循环，也同样依赖将引擎
