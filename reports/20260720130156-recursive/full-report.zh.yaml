            body: >-
              Recursive 目前没有像一家软件公司通常那样披露公开收入模型。官网呈现的是研究使命，2026 年 7 月技术文章呈现的是基准证据， 但二者都没有发布定价表、API
              注册入口、客户分层结构或支持的购买动作列表。Tech.eu、TNW、OfficeChai、Tech Funding News 和 Foundra
              的发布报道都强化了同一种经济解读：市场投资这家公司，是看团队质量、命题和未来潜力，而不是看得到的当前现金生成。
              这个区别重要，因为它意味着公开财务分析必须把公司未来可能变现的东西，与公司今天正在变现的东西分开。最可能的未来收入流是
              与自动化研究工作流、模型开发工具或专业科学自动化绑定的企业软件或平台访问。但这些是推断出来的未来路径，不是已披露的当前业务线。 相比之下，OpenAI 和 Anthropic
              已经通过公开商业定价、企业控制、用量分析和支出控制，提供了达到变现级包装的具体参照。 Recursive 尚未公开展示同等内容。财务后果很简单：现在还没有公开方法检验价格实现、买家支付意愿或需求可重复性。
