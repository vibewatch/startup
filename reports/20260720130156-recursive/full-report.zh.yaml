  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与当前价格纪律
        blocks:
          - type: paragraph
            body: >-
              正确起点不是 Recursive 是否令人印象深刻，而是公开证据是否支持今天支付 $4.65 billion。质量上， 公司确实有真亮点。多项公开来源指向同一融资事实：超过 $650 million 的
              Series A 资本、 $4.65 billion 估值，以及包括 GV、Greycroft 和 NVIDIA 在内的投资财团。2026 年 7 月的文章和仓库发布，
              也让故事比单纯隐身融资更具体。但这些事实都没有补上核心估值缺口。公开来源仍未披露收入、定价、客户、 毛利率、留存或优先股堆叠。官方呈现仍是研究使命和技术证明集，而不是可进入采购的产品。 这意味着新投资人不是在
              $4.65 billion 买入一家已验证的软件公司；他们是在押注一家资金异常充足的研究实验室未来商业化的期权。 价格合适时，这仍可能有吸引力，但这不同于买入一家已经变现的 AI
              平台。因此，有纪律的建议是继续研究 / 观察， 而不是买入；纪律来自价格敏感性，不是因为不相信技术野心。
