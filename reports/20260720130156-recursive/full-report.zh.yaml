        - 2026 年 7 月市值约 $95.31B；Cortex AI 以及 RBAC / 隐私控制可见
        - 适合对标企业 AI 包装方式和治理预期
        - 数据云老牌厂商，已有装机基础，不是早期研究实验室
      - - ServiceNow / Microsoft 平台组合
        - 公开市值 + 广泛企业 AI 捆绑
        - ServiceNow 约 $102.30B；Microsoft 约 $2.899T；Copilot 把治理和分发打包进去
        - 说明老牌厂商已经嵌在企业工作流里，带来捆绑压力
        - 两者都不是一一对应的创业公司可比对象；它们更像竞争边界设定者，而不是估值镜像
      - - MongoDB / Databricks 技术栈类比
        - 公开市值 + 私有数据平台包装背景
        - MongoDB 市值约 $25.92B；Databricks 主打私有、受治理的 AI / 数据平台工作流
        - 有助于理解数据平台厂商如何把 AI 包进更大的企业技术栈
        - 但仍不是前沿 AI 实验室的直接可比对象；后者没有公开收入或产品界面
    notes: 这组可比公司主要用于设定边界，不是直接倍数可比：Recursive 没有公开收入基数，公开记录里也尚未进入产品阶段。
