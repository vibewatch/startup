        title: 法律、监管与披露风险
        blocks:
          - type: paragraph
            body: >-
              Recursive 的公开法律和披露姿态有序但很薄。网站有标准隐私和条款页面，7 月仓库发布也采用 Apache-2.0 打包，并为 MIT 许可组件
              保留上游声明。这是正面信号：公司似乎重视自己选择发布代码的基础法律卫生。更深的风险在于公开记录没有披露的内容。
              没有公开董事会名单、没有股权结构表摘要、没有融资条款细节、没有客户合同证据，也没有公开产品治理文档，让外部人能够在研究引擎变成可部署
              产品后评估责任边界。网站安全语言停留在高层，没有运营化。已发布仓库也把大部分技术资产底座留在私有状态，从基准角度可以理解，
              但限制了外部可审计性。简言之，所审查记录没有浮现明显进行中的诉讼或执法事件，但存在实质透明度风险：投资者和未来企业买家必须凭信任， 而不是凭披露证据，承保大量重要法律和治理变量。
