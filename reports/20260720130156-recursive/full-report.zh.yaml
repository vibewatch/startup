      - number: '6.3'
        title: 留存、重复使用与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Recursive 没有公开留存数据。所审查来源没有披露净留存率（NRR）、总留存率（GRR）、流失、续约、席位扩张或合同期限指标。这意味着常规客户质量测试
              无法执行。唯一可用的重复使用线索偏活动，而不是偏收入：有仓库互动、一些外部 issue 活动，以及可见的持续 commit 历史。这些显示
              持续技术维护或外部好奇心，但没有显示投资者通常想看到的重复价值捕获。如果第一批付费买家出现，集中度风险很可能很高。一个扎根于 自动化 AI
              研究的产品，逻辑上会从少数前沿实验室、超大规模云厂商或精英技术团队开始，而不是从广泛横向需求开始。这会让第一批客户群
              既有声望也脆弱。市场语境也不宽容。买家越来越想要支出控制、路由效率和采购就绪治理。Google、AWS、Azure、Glean、OpenAI、 Anthropic 和 Perplexity
              等平台供应商已经服务相邻工作流。因此，Recursive 面临双重门槛：先证明真实客户需求超出技术兴趣， 再证明这些客户会留下来并扩张，而不是把系统当作有趣的基准工件。
