  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 用工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              Recursive 目前应被理解为一家研究系统公司，而不是应用公司。公司的公开材料没有描述打磨成熟的终端用户应用、开发者 API 或商业工作流套件。相反，它们描述的是一个自动化 AI
              研究若干环节的系统。官方命题很明确：构建能递归改进 AI 的 AI， 先推进 AI 科学，再把这套打法用于更广泛的科学发现。2026 年 7 月文章和 GitHub 仓库让这个命题更具体，暴露了三组资产包：
              nanoGPT speedrun 解法、nanochat autoresearch 测试框架，以及 SOL-ExecBench 工作中的 GPU-kernel 样本输出。用客户工作流语言说，
              公开交付物不是「和模型聊天」，而是「用一个系统更快提出、实现、测试并优化研究想法，速度超过纯人工循环」。这个区别很重要，
