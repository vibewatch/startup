      - CV037
      - CV038
      - CV041
      - CV042
  - id: TV006
    title: 投资逻辑破裂与终止触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 产品化延迟
        - 到下一个重要里程碑窗口仍没有公开产品界面或部署控制
        - 故事从产品可选性转为长期研究烧钱
        - 从继续研究转向回避 / 等待重置
      - - 客户证明缺口
        - 尽管融资可见度持续，仍没有具名试点、客户或合作伙伴工作流证据
        - 削弱“技术证明正在转化为买方需求”的判断
        - 要求更深折价，或等证据出现
      - - 技术滑坡
        - 同行快速推进时，Recursive 没有新的重要基准或能力证明
        - 压缩支撑溢价定价的感知护城河
        - 下调估值区间和信心
      - - 融资条款转弱
        - 下一轮平轮或降轮，且保护条款很重
        - 说明私募市场支持没有头条动能暗示的那么稳
        - 按新条款重新承销，不再沿用旧估值
      - - 治理意外
        - 优先股堆叠、董事会控制或权利包对投资人不友好
        - 普通股价值可能远低于企业价值口径的头条数字
        - 暂停，直到完整建模股权结构表
    notes: 这些是可监控的投资逻辑破裂信号，不是泛泛风险；每一项都会实质改变当前估值对新资金的含义。
