  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：直接实验室、既有平台与替代品
        blocks:
          - type: paragraph
            body: >-
              Recursive 并不处在一个干净的单一品类市场。它的官方材料把公司定位在改进 AI 的 AI 和自动化知识发现上，听起来像前沿研究实验室命题；
              但它最终必须进入的实际预算池，已经由解决相邻问题的公司共同占据。直接前沿竞争来自那些用 AI 加速模型开发、推理和知识工作、 同时已经出货可变现产品的实验室和平台。OpenAI 与 Anthropic
              把前沿能力打包进企业计划，附带安全控制、编程智能体和用量分析。 Google、AWS 和 Microsoft 各自把 AI 搜索、智能体和模型平台推入既有云或生产力关系。Glean 与 Perplexity
              从检索和企业搜索侧 攻击知识工作问题，而不是从实验室侧切入。Together AI 和 DeepSeek 压低基础设施与模型成本；Llama 4 等开放权重替代方案降低了
              买家为无差异模型访问付费的意愿。与此同时，Ricursive Intelligence 和 Sakana AI 等其他前沿实验室说明，投资者也在资助围绕
              自我改进系统、芯片共同演化和研究自动化的平行命题。因此，Recursive 进入的是一个可信替代方案已经横跨研究、工具、企业工作流自动化 和内部自建的市场。
