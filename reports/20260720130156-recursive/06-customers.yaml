company:
  name: Recursive
chapter:
  number: 6
  title: Customers
  summary: 'Recursive does not yet present a conventional customer story in public. There are no customer logos on the official site, no named production deployments, no public pricing, no published case studies, and no retention metrics. Launch coverage in May 2026 explicitly said the company had not released a product, and by the run date the clearest public milestone is still a July 2026 technical article plus GitHub repository. That means the chapter cannot underwrite customer traction in the normal SaaS sense. What it can do is separate plausible future buyer segments from current external-interest signals. The most plausible early customers are frontier labs, platform teams, or technically advanced enterprise research groups that care about automation of AI research and knowledge discovery. The strongest observable public adoption signals are not revenue signals but community signals: a public repository with stars, forks, one open issue from an outside user, and a visible X presence.
    Those signals matter because they show attention and technical curiosity. They do not prove paying customers, production usage, retention, or repeat purchase. The chapter verdict is therefore that buyer logic is coherent, but customer proof is still mostly absent.'
sections:
- id: customer-segmentation-and-likely-buyers
  title: Customer segmentation and likely buyer archetypes
  body: 'Recursive’s public materials do not list customers, but they do imply a narrow first-buyer profile. A company building automated AI research and knowledge-discovery loops is unlikely to start with mainstream SMB users or casual consumers. The most plausible first buyers are advanced research organizations, frontier model-development teams, platform groups inside hyperscalers, and highly technical enterprise knowledge teams that already buy expensive AI tools. That segmentation is supported indirectly by the nature of the released artifacts: benchmark harnesses, GPU kernel work, and model-training optimization are relevant to technical organizations, not general office productivity buyers. In a later phase, the company’s broader scientific-discovery framing could widen the buyer set to research-intensive verticals, but the public record does not show that happening yet. The customer lens is therefore a future-facing one: who would logically pay if the current research system were
    wrapped into a real product? The answer is a small number of sophisticated buyers with deep budgets and technical tolerance for imperfect early products. That is consistent with a research-lab commercialization path, but it also implies early concentration risk and long proof cycles.'
