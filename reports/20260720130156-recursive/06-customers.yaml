- id: retention-repeat-usage-and-concentration
  title: Retention, repeat usage, and concentration risks
  body: 'There is no public retention dataset for Recursive. No NRR, GRR, churn, renewal, seat expansion, or contract-duration metric is disclosed in the reviewed sources. That means the usual customer-quality tests cannot be performed. The only repeat-usage hints available are activity-adjacent rather than revenue-adjacent: there is repository engagement, some outside issue activity, and visible ongoing commit history. Those show continuing technical maintenance or external curiosity, but they do not show the kind of repeat value capture that investors normally want to see. Concentration risk is likely to be high if the first paying buyers do emerge. A product grounded in automated AI research would logically start with a handful of frontier labs, hyperscalers, or elite technical teams rather than broad horizontal demand. That would make the first customer cohort both prestigious and fragile. The market context is also not forgiving. Buyers increasingly want spend controls, routing efficiency,
    and procurement-ready governance. Platform vendors such as Google, AWS, Azure, Glean, OpenAI, Anthropic, and Perplexity already serve adjacent workflows. Recursive therefore faces a dual hurdle: first prove any real customer need beyond technical interest, then prove that those customers will stay and expand rather than treat the system as an interesting benchmark artifact.'
