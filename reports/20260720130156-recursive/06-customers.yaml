- id: customer-verdict
  title: Customer verdict and what later diligence still needs
  body: 'The correct customer verdict is not “no market,” but “no public customer proof yet.” Recursive’s thesis lines up with real technical buyer problems, especially for organizations trying to accelerate model development, systems optimization, or research iteration. The company has also done enough publicly in July 2026 to attract attention from technically fluent observers. But attention is not adoption, and adoption is not monetization. The biggest missing pieces are straightforward: named customer references, pilot or production status, actual deployment workflows, evidence of repeat usage, and any sign of expansion economics. Even basic packaging signals—releases, versioning, customer docs, support promises—remain thin or absent in public. If the company’s first customers are indeed a small number of elite technical buyers, later diligence should expect a concentrated early customer base and long enterprise-style proving cycles. Until private evidence shows otherwise, Recursive
    should be treated as a company with plausible buyer logic and very limited public adoption proof.'
