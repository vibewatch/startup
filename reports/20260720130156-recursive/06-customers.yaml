- id: adoption-and-public-proof
  title: Adoption trajectory and public proof signals
  body: 'The best public adoption evidence for Recursive is not a customer case study; it is a collection of weak but real community signals around the July 2026 technical release. On GitHub, the public repository shows 174 stars and 15 forks on the network page, along with one open issue from an outside user on June 11, 2026 discussing prior work on autoresearch hyperparameter optimization. The pulls page shows no open or closed pull requests, and the releases and tags pages say there are no releases yet. Those details matter because they reveal how external users are encountering the company today: as a research artifact producer, not as a packaged software vendor. The absence of releases is especially important. It suggests the repository is still being consumed as code and documentation rather than as versioned software intended for easy deployment. The X profile creates another lightweight proof signal by providing a public company identity and distribution surface, but again not customer
    proof. The chapter view is that Recursive has some early technical attention from the research and developer community, but public evidence does not show production users, pilots, contracts, or referenceable paying accounts.'
