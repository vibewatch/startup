tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Why it matters for Recursive
  rows:
  - - Frontier AI research automation
    - Tooling that automates experiment design, evaluation, and model improvement
    - Generic enterprise chat and basic consumer usage
    - Research lead, CTO, AI platform budget
    - Closest conceptual home for Recursive's thesis
  - - AI infrastructure and model-development platforms
    - Compute, model-serving, orchestration, and evaluation stacks for AI systems
    - Non-AI cloud or commodity IT operations
    - Hyperscalers, platform teams, frontier labs
    - Sets the capital and integration environment Recursive must live inside
  - - Enterprise RAG and knowledge systems
    - Grounding, retrieval, enterprise search, and knowledge-base systems
    - General document storage without AI workflows
    - CIO, platform, knowledge-management budget
    - Current enterprise proxy for monetized high-value AI reasoning workflows
  - - Agentic developer and coding tools
    - Model APIs, coding agents, routing, spend-control, and workflow automation
    - Traditional devtools without AI execution or routing
    - Engineering leaders, product engineering budgets
    - Shows adjacent budget lines and buying criteria Recursive may need to fit
  - - Lower-cost retrieval substitutes
    - Search APIs and open-weight model routes
    - Custom research automation with no API layer
    - Developers, cost-conscious operators
    - Creates substitute pressure on any undifferentiated retrieval layer
  notes: Boundary intentionally separates research automation from the broader AI economy. Recursive is closest to the first row but must sell into adjacent budget buckets before a standalone category fully exists.
