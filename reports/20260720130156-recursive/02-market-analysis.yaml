- id: top-down-and-bottom-up-sizing-lenses
  title: Top-down spending forecasts are huge, but bottom-up buyer relevance is much tighter
  body: 'The top-down numbers are undeniably large. Gartner''s May 2026 forecast puts worldwide AI spending at roughly $2.596 trillion for the year, with AI infrastructure alone above $1.43 trillion and AI software around $453 billion. Gartner''s January release was already enormous at $2.52 trillion, so even the official forecast moved upward within the same year. IDC provides a more use-case-based view that is closer to how operating buyers think. In IDC''s guide, AI Infrastructure Provisioning is the single biggest use case, reaching $30.3 billion in 2024 and projected to hit $47 billion by 2028, while customer service and fraud-analysis workflows already each command mid-to-high tens of billions in spend. Those figures matter because they imply two things at once. First, the macro AI market is real and still expanding. Second, the portion immediately relevant to a pre-product company like Recursive is a much smaller slice: budgets controlled by research organizations, hyperscaler platform
    teams, and sophisticated enterprises willing to pay for automation of expensive knowledge work. Recursive''s credible SAM is therefore large enough to matter but still far below the headline AI macro total.'
