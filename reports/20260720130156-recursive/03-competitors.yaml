  - - OpenAI
    - Frontier model and enterprise platform
    - Business and Enterprise plans, frontier models, Codex agents
    - Enterprise workspace, coding workflows, broad partner presence
    - Sets the bar for enterprise-grade AI plus agents
    - General-purpose focus leaves room for specialized research automation if Recursive can prove it
  - - Anthropic
    - Frontier model and coding platform
    - Claude models, Claude Code, Team and Enterprise plans
    - Strong technical-user adoption and admin controls
    - Competes for safety-conscious technical buyers and coding-agent budgets
    - Less consumer distribution than OpenAI or Google
  - - Google Cloud / Gemini
    - Incumbent platform
    - Agent Search and Gemini enterprise tooling
    - Existing cloud and workspace procurement
    - Can bundle search, models, and enterprise context
    - Product surface is broad and sometimes diffuse
  - - AWS Bedrock
    - Incumbent model platform
    - Managed access to leading AI lab models and agents
    - AWS installed base
    - Lets buyers assemble model choice without committing to one lab
    - More platform layer than differentiated application experience
  - - Azure AI Search
    - Incumbent retrieval platform
    - Enterprise search and RAG infrastructure
    - Microsoft enterprise relationships
    - Competes for grounded-knowledge workflows Recursive may target
    - Search layer alone does not equal autonomous research
  - - Glean
    - Enterprise work AI platform
    - Enterprise context, agents, connectors, permissions
    - Single-tenant cloud, permissions-aware deployment
    - Already sells automation into knowledge-work budgets
    - Less frontier-research identity than Recursive
  - - Perplexity Enterprise
    - AI answer engine / search substitute
    - Enterprise search and answer workflows
    - Citation-first answer experience
    - Competes for research-style user behavior and knowledge discovery
    - Narrower platform and infrastructure depth
  - - Ricursive Intelligence
    - Adjacent frontier AI lab
    - AI-chip co-evolution platform thesis
    - High-profile Series A and founder pedigree
    - Shows investors are funding recursive-improvement variants already
    - 'Different immediate domain: chip design rather than automated AI research'
