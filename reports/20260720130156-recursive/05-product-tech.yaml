- id: roadmap-and-maturity-judgment
  title: Roadmap, release cadence, and maturity judgment
  body: 'The public roadmap is still milestone-based rather than product-based. Launch coverage says the Series A will fund larger compute infrastructure and a first Level 1 autonomous training system, with a public launch targeted for mid-2026. By the run date, the clearest visible milestone that actually shipped is the July 2026 article and GitHub release. That matters because it upgrades the company from an unfalsifiable stealth narrative to an inspectable technical one. But it does not yet resolve the biggest maturity question: what is the product boundary for an external user? The current public materials support at least five maturity conclusions. First, the company has a coherent thesis. Second, it has demonstrated a multi-asset technical stack rather than a single benchmark trick. Third, it can package research results in a reproducible repository with licensing hygiene. Fourth, its public outputs still look like research artifacts, not deployment-grade software. Fifth, its future
    roadmap likely depends as much on operationalizing the engine and wrapping it in trust, controls, and buyer workflows as on improving the raw research loop. The technology chapter view is therefore positive on technical credibility and cautious on product maturity.'
  claimRefs:
  - CE036
  - CE037
  - CE038
  - CE039
  - CE040
