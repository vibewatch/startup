- id: architecture-benchmarks-and-operating-model
  title: Architecture, benchmarks, and operating model
  body: 'Recursive’s operating model is legible from the public artifacts. The article describes a loop that proposes ideas, implements them, runs experiments, validates results, and then selects what to try next. The repository packages that loop in benchmark-specific forms. In nanoGPT speedrun, the system optimized GPT-2-small training to a 77.3 second mean time on 8x H100 while clearing the target validation threshold and beating the same-hardware baseline. In nanochat autoresearch, Recursive publishes multiple solutions evaluated for five minutes on a single Modal B200 GPU across 10 seeds, including a best solution optimized from Karpathy’s baseline. In SOL-ExecBench, Recursive shares 10 of 235 kernel implementations scored on B200 while keeping the majority private to avoid biasing the leaderboard. The repository also makes clear that Recursive’s work is compositional rather than from-scratch: it builds on KellerJordan’s modded-nanogpt, Karpathy’s autoresearch, and Karpathy’s nanochat,
    preserving their upstream notices in Apache-2.0 packaging. This public architecture implies a lab workflow that mixes autonomous experimentation, benchmark harnesses, human-selected baselines, and high-end hardware. It is closer to an internal research platform than to a public app stack.'
