- id: dependencies-trust-and-limitations
  title: Dependencies, trust controls, and known limitations
  body: 'The strongest public technology evidence for Recursive is technical output; the weakest is trust and deployment readiness. Public sources show clear dependencies: the released work is tied to frontier GPUs such as H100 and B200, benchmark ecosystems such as SOL-ExecBench, and upstream open-source baselines such as nanochat and modded-nanogpt. Those dependencies are not inherently negative—they are how modern research systems are built—but they do mean the company’s current moat is not based on a closed foundational stack end to end. Trust controls are where the public record is thin. The homepage emphasizes safety, and the company’s legal pages show standard website privacy and terms, but there is no public model card, enterprise security page, audit documentation, or deployment-control documentation comparable to what later-stage AI vendors publish. The public artifact bundle is also intentionally partial. Recursive explicitly withholds most kernel implementations to avoid contaminating
    the benchmark, which is understandable, but it means outsiders cannot fully inspect the technical asset base. Finally, none of the reviewed sources show a public customer deployment, uptime commitment, or support model. The company has demonstrated real engineering signal, but it has not yet demonstrated public production readiness.'
  claimRefs:
