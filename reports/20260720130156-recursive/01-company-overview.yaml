- id: technical-milestones-and-operating-readiness
  title: Technical milestones and operating readiness
  body: 'Recursive narrowed the gap between ambition and evidence in July 2026 by publishing its first technical article and a companion GitHub repository. Those materials are significant because they move the company beyond pure promise into at least one inspectable research milestone. The article describes an automated AI research loop that proposes ideas, implements them, runs experiments, validates the results, and then selects what to try next. Recursive then claims state-of-the-art outcomes on three benchmarks spanning fixed-budget small-model training, speed-focused small-model training, and GPU kernel optimization. The exact numbers are still company-issued rather than independently replicated, so they should be treated as meaningful but not fully underwritten. Even so, the public artifact set is stronger than a generic stealth page: there are benchmark-specific folders in the company repository, ties to public benchmark ecosystems such as Karpathy''s autoresearch and NanoGPT speedrun,
    and a concrete claim that funding will help scale compute infrastructure toward a first Level 1 autonomous training system. That combination makes the thesis more legible, but it still stops short of proving a commercial offering or durable moat.'
  claimRefs:
  - CO016
  - CO017
