      - number: '2.4'
        title: Demand drivers are real, but the market is also punishing waste and undifferentiated spend
        blocks:
          - type: paragraph
            body: >-
              The strongest structural driver is that enterprises and platforms clearly want more agentic automation,
              grounded retrieval, and AI-enabled workflow acceleration. Deloitte says worker access to AI jumped 50% in
              2025 and that the number of companies with at least 40% of projects in production is set to double within
              six months. At the same time, McKinsey shows AI crowding into change budgets while adding run costs, and
              CNBC documents an explicit spend crunch in which buyers are cutting or rerouting usage when bills outrun
              ROI. Those facts make the market attractive but unforgiving. Buyers will fund AI that reduces labor or
              unlocks differentiated output; they are increasingly skeptical of undisciplined token spending,
              frontier-model overuse for simple tasks, and governance-light agent deployments. That is the core market
              verdict for Recursive. The tailwinds are unusually strong: infrastructure investment, large enterprise
              interest, and fast-moving agent platforms. The constraints are equally real: compute intensity, weak
              governance maturity, model-routing pressure, and incumbents bundling adjacent capabilities. Recursive is
              entering a market with genuine demand, but one that will reward clear economic packaging faster than grand
              theoretical promise.
