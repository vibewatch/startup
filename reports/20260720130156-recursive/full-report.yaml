      - number: '4.2'
        title: Cost structure and unit-economics implications
        blocks:
          - type: paragraph
            body: >-
              Although Recursive does not disclose burn or gross margin, the available evidence points toward a
              compute-intensive cost structure rather than a light SaaS profile. The company’s own technical materials
              highlight three benchmark tracks that rely on expensive frontier hardware and specialized engineering. The
              nanoGPT speedrun result was measured on 8x H100. The nanochat autoresearch results were run on a single
              Modal B200 GPU across 10 seeds. The published SOL-ExecBench sample shows 10 of 235 GPU-kernel
              implementations measured on B200. Those facts do not let an outsider calculate burn, but they do indicate
              that the company is working at the edge of expensive infrastructure, not on commodity CPU-bound
              experimentation. The stated use of Series A proceeds also points in the same direction: multiple public
              sources say the funding will help secure large-scale compute infrastructure and support a first Level 1
              autonomous training system. In addition, the market context is not forgiving. McKinsey says AI is
              consuming change budgets, while CNBC reports that buyers are shifting from tokenmaxxing toward efficiency,
              model routing, and spend control. That means even if Recursive later sells software into enterprise AI
              budgets, it may face cost-sensitive buyers before it has scale or procurement leverage. Public
              unit-economics analysis is therefore limited to a directional conclusion: compute, research labor, and
              infrastructure access likely dominate the cost base, while monetization remains undefined.
