              foundational stack end to end. Trust controls are where the public record is thin. The homepage emphasizes
              safety, and the company’s legal pages show standard website privacy and terms, but there is no public
              model card, enterprise security page, audit documentation, or deployment-control documentation comparable
              to what later-stage AI vendors publish. The public artifact bundle is also intentionally partial.
              Recursive explicitly withholds most kernel implementations to avoid contaminating the benchmark, which is
              understandable, but it means outsiders cannot fully inspect the technical asset base. Finally, none of the
