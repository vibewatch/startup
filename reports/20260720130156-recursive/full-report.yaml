  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal, regulatory, and disclosure risk
        blocks:
          - type: paragraph
            body: >-
              Recursive’s public legal and disclosure posture is orderly but thin. The website has standard privacy and
              terms pages, and the July repository release includes Apache-2.0 packaging with preserved upstream notices
              for MIT-licensed components. That is a positive sign: the company appears attentive to basic legal hygiene
              around the code it has chosen to publish. The deeper risk is what the public record does not disclose.
              There is no public board list, no cap-table summary, no financing-term detail, no customer contract
              evidence, and no public product-governance documentation that would let an outsider assess responsibility
              boundaries once the research engine becomes a deployable product. The website’s safety language is
              high-level, not operational. The published repository also leaves most of the technical asset base
              private, which is understandable from a benchmarking perspective but limits external auditability. In
              short, there is no obvious active litigation or enforcement event surfaced in the reviewed record, but
              there is a material transparency risk: investors and future enterprise buyers must underwrite a lot of
              important legal and governance variables on trust rather than on disclosed evidence.
            claimRefs:
              - CR001
