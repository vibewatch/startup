      - number: '7.2'
        title: Operational, quality, and security risk
        blocks:
          - type: paragraph
            body: >-
              Recursive’s current public product surface is research software, and that creates a very specific
              operational risk profile. The company has shown that it can produce benchmark artifacts, but public
              sources do not show uptime commitments, support operations, deployment processes, or customer-facing
              controls. The released repository is also partial: 10 kernel implementations are public while 225 remain
              private, which means outsiders cannot fully assess whether the strongest internal capabilities generalize
              or scale. The technical stack depends on frontier GPUs such as H100 and B200 and on benchmark-driven
              workflows; this raises both cost and supply sensitivity. Operationally, that makes Recursive vulnerable to
              delayed hardware access, rising infrastructure expense, or slower-than-expected path from benchmark
              performance to usable product quality. Security and quality risk are also shaped by open-source and
              community dynamics. GitHub pages show some external engagement but no public release cadence, no packaged
              releases, no PR history, and only a limited issue trail. That is normal for a young research project, but
              it underscores how early the public operations surface still is. The technology may be real; the public
              evidence for production operations remains minimal.
