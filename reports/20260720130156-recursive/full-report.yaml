      - number: '1.4'
        title: Overview-level risks and what later chapters still need to prove
        blocks:
          - type: paragraph
            body: >-
              The chapter's main adverse conclusion is not that Recursive lacks talent or ambition; it is that price,
              maturity, and disclosure are badly out of sync. TNW and Foundra are explicit on this point, describing a
              company that was only a few months old, had fewer than 30 employees, no released product, no disclosed
              revenue, and yet commanded a $4.65 billion valuation. That does not make the round irrational—elite
              frontier-AI financing has repeatedly rewarded team quality and strategic positioning—but it does mean
              later diligence has to prove far more than this chapter can. The open questions are straightforward and
              material: exact headcount, board composition, cap-table terms, customer or partner concentration,
              commercialization roadmap, and whether the technical milestone converts into a real product or only
              stronger recruiting and fundraising. Even the company alias and founder count are not perfectly clean in
              the public record. The proper overview judgment is therefore strong founder-market fit and unusually
              strong capital access, offset by thin governance visibility and almost no audited operating proof.
