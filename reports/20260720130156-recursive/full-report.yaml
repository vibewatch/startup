    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and research thesis
        blocks:
          - type: paragraph
            body: >-
              Recursive is best understood today as a frontier AI research lab, not as a commercial software vendor with
              a shipping product catalog. Its live official web presence is the recursive.com domain, where the company
              describes its goal as building AI that recursively improves itself in order to automate knowledge
              discovery and, first, the science of AI itself. The same official materials emphasize safety and frame the
              company as pursuing open-ended algorithms rather than just scaling a conventional foundation-model stack.
              Public footprint signals are modest but consistent: the homepage and X profile both point to San Francisco
              and London, while Tech.eu adds a London incorporation note. That combination suggests a transatlantic lab
              with U.K. legal roots and U.S. operating presence. What is notably absent from the overview is equally
              important. The website does not surface pricing, customer logos, or a public product sign-up path, and
              independent launch coverage explicitly says the company had not yet released a product at stealth exit.
              The right chapter-level read is therefore a research-first identity with unusually large capital backing
              and still-limited commercialization evidence.
