  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and current price discipline
        blocks:
          - type: paragraph
            body: >-
              The right starting point is not whether Recursive is impressive; it is whether the public evidence
              supports paying $4.65 billion today. On quality, the company has genuine positives. Multiple public
              sources converge on the same financing fact pattern: over $650 million of Series A capital, a $4.65
              billion valuation, and a syndicate that includes GV, Greycroft, and NVIDIA. The July 2026 article and
              repository release also make the story more concrete than a pure stealth fundraise. But none of those
              facts closes the core valuation gap. Public sources still do not disclose revenue, pricing, customers,
              gross margin, retention, or the preference stack. The official surface remains a research mission and
              technical proof set, not a procurement-ready product. That means a new investor is not underwriting a
              proven software business at $4.65 billion; they are underwriting an option on future commercialization of
              an unusually well-funded research lab. That can still be attractive at the right price, but it is not the
              same as buying an already-monetizing AI platform. The disciplined recommendation is therefore
              research-more / track rather than buy, and the discipline comes from price sensitivity rather than from
              disbelief in the technical ambition.
            claimRefs:
