      - number: '3.3'
        title: Enterprise-platform and substitute pressure
        blocks:
          - type: paragraph
            body: >-
              If Recursive ultimately commercializes into enterprise knowledge work or research automation, the hardest
              competition may come from incumbents that never describe themselves as recursive self-improvement
              companies. Google Agent Search, AWS Bedrock, and Azure AI Search already sell grounded search, model
              access, and agent infrastructure into existing procurement lanes. Glean markets a horizontal AI platform
              built on enterprise context, connectors, permissions, and runtime control. Perplexity Enterprise attacks
              the same broad problem space from a citation-centric answer engine. These products matter because they
              convert an abstract research thesis into something a CIO can already buy today. The substitute pressure is
              reinforced by price discipline. CNBC reports that enterprises are moving from tokenmaxxing to efficiency
              and increasingly exploring model routing rather than defaulting every task to the most expensive frontier
              model. Anthropic and OpenAI have both responded with spend caps, analytics, and business controls. That is
              directly adverse to Recursive. A young lab without a distribution surface, operating history, or pricing
              page will have to prove not just that its technology works, but that it beats bundled, governed, and
              budget-aware alternatives already installed in enterprise workflows.
