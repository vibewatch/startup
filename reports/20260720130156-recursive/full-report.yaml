      - number: '3.2'
        title: Direct frontier and research-lab peers
        blocks:
          - type: paragraph
            body: >-
              The closest conceptual peers are not classical SaaS competitors. They are AI labs and research-heavy
              platforms that can plausibly claim to improve model capability, developer productivity, or infrastructure
              economics faster than a pre-product startup. OpenAI Enterprise explicitly markets frontier models and
              agents, plus Codex, to help teams turn goals into finished work. Anthropic markets Claude Code with
              granular spend caps and analytics inside Team and Enterprise plans. Ricursive Intelligence is especially
              relevant because it offers a similarly recursive framing: closing the feedback loop between AI and the
              chips that power it, and it reached a $4 billion valuation less than two months after launch. Sakana AI
              positions itself as a frontier lab built around nature-inspired intelligence and has geographic
              differentiation in Japan. Together AI is not framed as a pure lab, but its research-optimized cloud, 99%
              uptime SLA, and pre-training and inference stack compete for the same technical buyer attention that
              Recursive will eventually need. The key direct-peer lesson is that most adjacent players already expose an
              API, a platform, a managed cloud, or an enterprise surface. Recursive does not. Until it does, its rivalry
              is mainly for talent, investor attention, and future buyer mindshare rather than current share of wallet.
