      - number: '8.3'
        title: Comparable set and scenario envelope
        blocks:
          - type: paragraph
            body: >-
              Because Recursive has no public revenue base, a conventional revenue-multiple framework would create false
              precision. The better method is a hybrid of milestone valuation and public-comparable boundary setting.
              The comparable table does not prove that Recursive is worth $4.65 billion, but it does show what kinds of
              companies the market already values at far larger levels: Palantir, Snowflake, ServiceNow, Microsoft, and
              MongoDB all have public market capitalizations far above Recursive’s mark while also selling real products
              through visible enterprise packaging and governance surfaces. Anthropic is the most relevant frontier-lab
              comparator in this public set because its 2026 official financing update paired a huge valuation with
              explicit run-rate revenue and enterprise-adoption language. Recursive has not. That gap matters more than
              absolute valuation arithmetic. In scenario terms, a bull case can justify a higher mark if Recursive
              launches a real product surface, lands named buyers, and retains technical lead. A base case can only
              justify holding near the current mark if productization and customer proof begin appearing quickly. A bear
              case—commercial delay, platform bundling, weaker financing conditions, or technical slippage—would likely
              force a down-round style reset because the current price already assumes a lot of future proof.
