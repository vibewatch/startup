      - number: '8.2'
        title: Valuation support versus commercial proof
        blocks:
          - type: paragraph
            body: >-
              Recursive’s public valuation support comes from three places: capital access, market narrative, and
              technical credibility. Capital access is obvious in the size and quality of the Series A. Market narrative
              is also visible: Stanford, Gartner, and McKinsey all describe a 2026 environment in which AI investment,
              AI-for-science, and enterprise experimentation remain large enough to reward frontier winners
              disproportionately. Technical credibility improved meaningfully with the July 2026 release. Yet those are
              all upstream valuation supports, not direct evidence of monetization. The missing commercial proof is
              unusually important because enterprise AI buyers in 2026 are no longer paying simply for model novelty.
              CNBC and McKinsey describe a more efficiency-focused budget environment, while Microsoft, Snowflake,
              OpenAI, and Anthropic all publicly advertise spend controls, governance features, privacy boundaries, or
              usage analytics. Recursive has not yet shown the comparable packaging layer in the reviewed public record.
              That creates a valuation asymmetry: the company may deserve a premium for ambition and talent, but public
              evidence does not yet show whether it can convert research advantage into the kind of controlled,
              purchasable workflow product that defends a multibillion-dollar price.
