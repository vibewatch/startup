            body: >-
              The strongest public technology evidence for Recursive is technical output; the weakest is trust and
              deployment readiness. Public sources show clear dependencies: the released work is tied to frontier GPUs
              such as H100 and B200, benchmark ecosystems such as SOL-ExecBench, and upstream open-source baselines such
