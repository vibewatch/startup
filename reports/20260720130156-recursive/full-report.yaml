  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary is narrower than the AI macro story but broader than a single research tool
        blocks:
          - type: paragraph
            body: >-
              Recursive does not compete for the entirety of the AI economy. Its own materials position the company
              around automating AI research itself, which means the relevant market boundary sits at the intersection of
              frontier model-development tooling, agentic research automation, and the enterprise or platform systems
              that help teams ground, evaluate, and operationalize AI work. That is broader than a niche benchmarking
              tool but narrower than the trillions of dollars sometimes attached to the full AI opportunity. Included
              spend therefore has to capture at least three buckets: infrastructure and model-development platforms,
              enterprise retrieval and knowledge systems that ground AI workflows, and higher-value agentic tooling used
              by developers, researchers, or regulated knowledge workers. Excluded spend should include generic consumer
              chat subscriptions, non-AI SaaS, and broad cloud spend unrelated to AI workloads. The substitute set is
              already crowded. Buyers can route to model APIs, RAG stacks, enterprise search products, or lower-cost
              search and retrieval APIs without ever buying a stand-alone research-automation platform. That is why
              market definition matters so much: Recursive is pursuing a valuable problem, but not one with a clean
              budget line today.
