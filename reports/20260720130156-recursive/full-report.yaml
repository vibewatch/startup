      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Recursive’s financing headline is impressive enough to mask how many underwriting inputs remain missing.
              Over $650 million of Series A capital at a $4.65 billion valuation is a remarkable outcome for a
              2025-founded, pre-product AI lab with roughly 25 to 30 people in public reporting. That round almost
              certainly provides enough capital to recruit aggressively, buy compute, and continue operating without
              immediate financing stress. But “likely enough for now” is not the same as “adequately capitalized for the
              strategy.” Public sources do not disclose current cash balance, monthly burn, planned hiring pace,
              reserved compute commitments, debt obligations, or preference-stack details. Nor do they reveal whether
              the company expects the Series A to fund it to a commercial launch, to a technical milestone, or merely to
              a stronger next round. The company’s own narrative suggests the raise is designed to fund an ambitious
              research step rather than a conventional go-to-market scale-up. That increases financing dependency
              because research milestones can consume capital long before revenue catches up. The absence of public debt
              or secondary disclosure is not reassuring in itself; it simply means the public record is incomplete. The
              financial question for diligence is therefore not whether Recursive has capital today—it plainly does—but
              whether it has enough capital relative to the hidden compute and commercialization roadmap behind the
              thesis.
