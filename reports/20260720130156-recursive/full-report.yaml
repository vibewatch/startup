  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive landscape: direct labs, incumbent platforms, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              Recursive does not compete in a clean single-category market. Its official materials position the company
              around AI that improves AI and automated knowledge discovery, which sounds like a frontier research-lab
              thesis, but the practical budget pools it must eventually tap are shared with companies that already solve
              adjacent problems. Direct frontier competition comes from labs and platforms that use AI to accelerate
              model development, reasoning, and knowledge work while already shipping monetizable products. OpenAI and
              Anthropic package frontier capability into enterprise plans with security controls, coding agents, and
              usage analytics. Google, AWS, and Microsoft each push AI search, agent, and model platforms into existing
              cloud or productivity relationships. Glean and Perplexity attack the knowledge-work problem from the
              retrieval and enterprise-search side rather than the lab side. Together AI and DeepSeek compress
              infrastructure and model costs; open-weight alternatives like Llama 4 reduce willingness to pay for
              undifferentiated model access. Meanwhile, other frontier labs such as Ricursive Intelligence and Sakana AI
              reinforce that investors are also funding parallel theses around self-improving systems, chip
              co-evolution, and research automation. Recursive therefore enters a market where credible substitutes
              already exist across research, tooling, enterprise workflow automation, and internal build.
            claimRefs:
