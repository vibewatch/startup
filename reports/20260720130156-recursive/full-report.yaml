      - number: '1.2'
        title: Founders, financing signal, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              The founding signal is the main reason public markets and private investors pay attention to Recursive
              this early. Official copy says the co-founders created the AI labs at Salesforce and Uber and led teams at
              OpenAI, DeepMind, Google Brain, and Meta; external coverage then names Richard Socher and Tim Rocktäschel
              consistently, while broader coverage adds Yuandong Tian and a larger circle that includes Josh Tobin, Jeff
              Clune, Tim Shi, Alexey Dosovitskiy, and Caiming Xiong. That breadth is directionally positive for
              technical credibility, but it also introduces a real diligence wrinkle: the live official website does not
              publish a complete leadership or board roster, so public sources do not fully reconcile the exact
              co-founder slate or governance structure. The financing headline is, however, much clearer. Wilson
              Sonsini, Tech.eu, and TechCrunch all support the same core fact pattern: Recursive emerged from stealth on
              May 13, 2026 with a $650 million-plus Series A at a $4.65 billion valuation, led by GV and Greycroft with
              Nvidia and AMD Ventures participating. That is an unusually strong capital and signaling outcome for a
              2025-founded lab, but it should not be mistaken for disclosure depth on control terms, board seats, or
              secondary activity.
