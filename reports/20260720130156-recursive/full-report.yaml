      - number: '2.3'
        title: The buyer map is split between frontier builders, enterprise platform owners, and budget-sensitive developers
        blocks:
          - type: paragraph
            body: >-
              The market's buyer, user, and payer roles are not the same. In frontier labs and hyperscalers, the
              economic buyer is likely a research or platform executive who controls compute, model, and tooling
              budgets; the users are researchers and engineers; and the payer is the broader infrastructure or AI
              organization. In enterprises, retrieval and agent systems are often bought through CIO, platform, or
              knowledge-management budgets but used by product teams, analysts, and developers. Cloud and model
              incumbents reinforce that structure. OpenAI, Anthropic, AWS, Google Cloud, and Azure all sell some
              combination of model access, search, grounding, and agent controls into centralized budgets rather than
              purely individual card-swipe workflows. That makes adoption paths bifurcated. One path is top-down
              platform procurement tied to governance, privacy, or integration requirements. The other is bottom-up
              experimentation by developers who later pull budget upward once workflows prove ROI. Recursive, if it
              commercializes, will likely need both: research-credibility with elite builders and a packaging story that
              lets an enterprise or platform owner understand why the product belongs in an existing budget rather than
              as an aspirational science project.
