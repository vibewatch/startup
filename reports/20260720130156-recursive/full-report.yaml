      - number: '3.4'
        title: Switching costs, moat durability, and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              The competitive upside for Recursive is that few competitors are organized around the company’s precise
              thesis: use automated AI research to improve AI itself, then widen the playbook into broader science. The
              downside is that most of the adjacent markets it could monetize into have weak technical lock-in at the
              model layer and strong incumbent power at the workflow layer. CNBC’s reporting on model routing is blunt:
              roughly 95% of enterprise AI usage still sits on expensive frontier models even when cheaper ones could do
              the job, which implies price compression should intensify as routing matures. DeepSeek and open-weight
              families such as Llama 4 further reduce the value of generic access. OpenAI, Anthropic, and cloud
              platforms can also absorb features quickly once a new workflow proves valuable. The most adverse public
              evidence on Recursive itself remains the same as in the company overview: TNW describes a company with no
              public product and only thin disclosure sitting at a $4.65 billion valuation. In competitive terms, that
              means Recursive currently has a strong narrative moat and a weak commercial moat. To clear that gap, it
              will need either unmistakably superior research output, proprietary data and workflow embedding, or a
              distribution partner that turns a research engine into a repeatable buying motion.
