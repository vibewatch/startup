      - number: '7.3'
        title: Partner, dependency, and market-structure risk
        blocks:
          - type: paragraph
            body: >-
              Recursive’s dependency stack is concentrated in ways that matter. The public release shows dependency on
              upstream open-source baselines such as nanochat, autoresearch, and modded-nanogpt; on benchmark ecosystems
              such as SOL-ExecBench; and on frontier NVIDIA-class GPUs. None of those dependencies is unusual for an
              advanced AI lab, but together they mean Recursive does not yet publicly demonstrate a fully self-contained
              stack. The commercial environment adds another layer of dependency risk. Buyers increasingly want spend
              controls and routing efficiency, while incumbents such as OpenAI, Anthropic, Google, AWS, Azure, Glean,
              and Perplexity already serve many adjacent workflows. That means Recursive is dependent not only on
              suppliers and hardware, but also on its ability to reach the market before incumbents bundle the relevant
              feature set into existing products. The likely first-customer set is also small and concentrated, which
              creates partner and customer concentration risk at the same time. If commercialization depends on a few
              labs, a single hyperscaler relationship, or a narrow group of technical design partners, negotiating
              leverage may sit with the customer rather than with Recursive.
