        title: Revenue model and current monetization status
        blocks:
          - type: paragraph
            body: >-
              Recursive does not currently disclose a public revenue model in the way a software company normally would.
              The official site presents a research mission and the July 2026 technical article presents benchmark
              evidence, but neither publishes a pricing schedule, an API sign-up path, a customer tier structure, or a
              list of supported buying motions. Launch coverage from Tech.eu, TNW, OfficeChai, Tech Funding News, and
              Foundra all reinforce the same economic reading: the market funded the company on team quality, thesis,
              and future potential rather than on visible current cash generation. That distinction matters because it
              means public financial analysis must separate what the company may eventually monetize from what it
              monetizes today. The most plausible future revenue streams are enterprise software or platform access tied
              to automated research workflows, model-development tooling, or specialized scientific automation. But
              those are inferred future paths, not disclosed current lines of business. By contrast, OpenAI and
              Anthropic already provide concrete reference points for monetization-grade packaging through published
              business pricing, enterprise controls, usage analytics, and spend controls. Recursive has not publicly
              shown the equivalent. The financial consequence is simple: there is no public way to test price
              realization, buyer willingness to pay, or repeatability of demand yet.
