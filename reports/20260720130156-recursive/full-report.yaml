  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation and likely buyer archetypes
        blocks:
          - type: paragraph
            body: >-
              Recursive’s public materials do not list customers, but they do imply a narrow first-buyer profile. A
              company building automated AI research and knowledge-discovery loops is unlikely to start with mainstream
              SMB users or casual consumers. The most plausible first buyers are advanced research organizations,
              frontier model-development teams, platform groups inside hyperscalers, and highly technical enterprise
              knowledge teams that already buy expensive AI tools. That segmentation is supported indirectly by the
              nature of the released artifacts: benchmark harnesses, GPU kernel work, and model-training optimization
              are relevant to technical organizations, not general office productivity buyers. In a later phase, the
              company’s broader scientific-discovery framing could widen the buyer set to research-intensive verticals,
              but the public record does not show that happening yet. The customer lens is therefore a future-facing
              one: who would logically pay if the current research system were wrapped into a real product? The answer
              is a small number of sophisticated buyers with deep budgets and technical tolerance for imperfect early
              products. That is consistent with a research-lab commercialization path, but it also implies early
              concentration risk and long proof cycles.
