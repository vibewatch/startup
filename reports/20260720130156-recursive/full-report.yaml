      - number: '7.4'
        title: People, execution, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The final risk cluster is execution. Recursive’s public story is built on founder pedigree, investor
              signal, and a credible technical milestone—but the company is still small, young, and pre-product in
              public view. That combination creates key-person and sequencing risk even without a single
              celebrity-founder dependency like some peers have. Execution has to go right in multiple dimensions at
              once: the automated research loop must keep generating superior results; the company must operationalize
              those results into a usable product; and it must do so before buyers decide that existing platform vendors
              are good enough. The absence of public board and governance detail compounds this because outsiders cannot
              see how trade-offs are being made between research purity, productization, and commercialization. The
              correct kill criteria are therefore not abstract. If the company fails to show a public product surface,
              named buyers, deployment controls, or continued technical lead within a reasonable next milestone window,
              the valuation risk becomes much sharper. Conversely, if it can pair the July 2026 technical evidence with
              real packaging and customer proof, several of the current risks will compress quickly. For now, the risk
              stack should be treated as high but still actively reducible with private diligence.
