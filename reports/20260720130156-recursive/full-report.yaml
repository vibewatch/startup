  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition in workflow terms
        blocks:
          - type: paragraph
            body: >-
              Recursive should currently be understood as a research-system company rather than an application company.
              The company’s public materials do not describe a polished end-user application, a developer API, or a
              commercial workflow suite. Instead they describe a system that automates pieces of AI research itself. The
              official thesis is explicit: build AI that recursively improves AI, first by advancing the science of AI
              and then by applying the playbook to broader scientific discovery. The July 2026 article and GitHub
              repository make that thesis more concrete by exposing three asset bundles: nanoGPT speedrun solutions, a
              nanochat autoresearch harness, and sample GPU-kernel outputs from the SOL-ExecBench effort. In
              customer-workflow language, the public deliverable is therefore not “chat with a model” but “use a system
              to propose, implement, test, and refine research ideas faster than a purely human loop.” That is a
              meaningful distinction because it frames the core product as an engine for knowledge production and
              systems optimization. The weakness is equally clear: a workflow engine is not yet a commercial package.
              The company still lacks public onboarding, pricing, permissions, support commitments, or explicit product
              boundaries for an external buyer.
