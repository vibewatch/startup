  topStrengths:
  - Exceptional capital access and investor quality give Recursive unusual room to recruit, buy compute, and continue frontier research.
  - The July 2026 technical release materially improved confidence that there is a real automated-research system beneath the funding narrative.
  - Large 2026 AI spending and AI-for-science momentum leave room for a breakout winner if Recursive converts technical proof into productized workflows.
  topRisks:
  - No public revenue, pricing, or named-customer disclosure means the current valuation is not supported like a normal software investment.
  - Incumbent platforms already package governance, spend control, and workflow AI, raising bundling pressure before Recursive has shown a public control surface.
  - Unknown cap-table, preference, and governance terms can create materially worse downside than the headline private valuation suggests.
  unresolvedGaps:
