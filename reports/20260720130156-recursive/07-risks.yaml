chapter:
  number: 7
  title: Risks
  summary: 'Recursive’s risk profile is dominated less by headline scandal than by mismatch: extraordinary valuation and ambition paired with still-thin public operating proof. The strongest public risks are execution and commercialization risk, compute and infrastructure dependency, competitive bundling risk, trust-and-deployment readiness gaps, and governance/disclosure opacity. The company has improved its technical credibility with a July 2026 article and GitHub release, but those same materials expose how much of the story still depends on frontier GPUs, benchmark ecosystems, upstream open-source baselines, and private unreleased artifacts. Public legal pages and notices show reasonable open-source hygiene for the released repository, but they do not answer the harder diligence questions around product safety, customer controls, board oversight, or cap-table economics. External market evidence is also adverse: buyers are getting more cost disciplined, platform incumbents already own
    many adjacent workflows, and early customers—if they exist—are likely concentrated among a small number of elite technical organizations. The chapter verdict is that none of the visible risks is individually fatal today, but the combination of product immaturity, disclosure gaps, and capital-expectation pressure makes the overall risk stack high.'
sections:
- id: legal-regulatory-and-disclosure
  title: Legal, regulatory, and disclosure risk
  body: 'Recursive’s public legal and disclosure posture is orderly but thin. The website has standard privacy and terms pages, and the July repository release includes Apache-2.0 packaging with preserved upstream notices for MIT-licensed components. That is a positive sign: the company appears attentive to basic legal hygiene around the code it has chosen to publish. The deeper risk is what the public record does not disclose. There is no public board list, no cap-table summary, no financing-term detail, no customer contract evidence, and no public product-governance documentation that would let an outsider assess responsibility boundaries once the research engine becomes a deployable product. The website’s safety language is high-level, not operational. The published repository also leaves most of the technical asset base private, which is understandable from a benchmarking perspective but limits external auditability. In short, there is no obvious active litigation or enforcement event
    surfaced in the reviewed record, but there is a material transparency risk: investors and future enterprise buyers must underwrite a lot of important legal and governance variables on trust rather than on disclosed evidence.'
