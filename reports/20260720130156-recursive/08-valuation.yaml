- id: TV005
  title: Bull / base / bear scenario table
  columns:
  - scenario
  - key assumptions
  - valuation / return logic
  - probability signal
  rows:
  - - Bull
    - Recursive launches a clear product surface, shows named pilots or customers, preserves technical lead, and financing remains open to frontier AI
    - Private mark can rise above the current level; a roughly $6B-$8B valuation zone becomes narratively defensible
    - Lower-probability because it requires multiple currently missing proof points to arrive quickly
  - - Base
    - Technical progress continues and productization begins, but monetization proof is still early and buyers remain selective
    - Current valuation can be held or only modestly expanded; roughly $4B-$5.5B feels like the broad holding zone
    - Most plausible if the company executes but does not yet prove software-grade economics
  - - Bear
    - Commercial packaging lags, incumbents bundle adjacencies, financing terms tighten, or technical lead narrows
    - Down-round style reset toward roughly $2B-$3.5B becomes plausible, especially if preference overhang is meaningful
    - Elevated probability because the current mark already discounts a lot of future success
  - - Kill / thesis-break
    - No visible customer proof, no deployable control surface, and weaker next financing terms
    - Common-equity outcome could be materially worse than the headline private mark implies
    - Binary downside if hidden preferences and opaque commercialization coincide
  notes: Ranges are qualitative valuation envelopes in USD billions derived from milestone logic, not from a DCF or disclosed revenue multiple.
