- id: TV006
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold
  - transmission to thesis
  - action implication
  rows:
  - - Productization delay
    - No public product surface or deployment controls by the next major milestone window
    - Converts the story from product optionality to extended research burn
    - Move from research-more to avoid / wait for reset
  - - Customer-proof gap
    - No named pilot, customer, or partner workflow evidence despite continued fundraising visibility
    - Undercuts the claim that technical proof is translating into buyer demand
    - Require deeper discount or wait for proof
  - - Technical slippage
    - No new meaningful benchmark or capability proof while peers advance quickly
    - Shrinks the perceived moat that underpins premium pricing
    - Lower valuation range and confidence
  - - Weaker financing terms
    - Next round arrives flat or down with heavy protections
    - Reveals that private market support is less durable than headline momentum suggested
    - Re-underwrite from the new terms, not the old mark
  - - Governance surprise
    - Preference stack, board control, or rights package proves investor-unfriendly
    - Common-equity value may be far below enterprise-value headlines
    - Pause until the cap table is fully modeled
  notes: These are monitorable thesis-break signals rather than generic risks; each one would materially change what the current valuation means for new money.
  claimRefs:
