- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - argument
  - direction
  - what would change the view
  rows:
  - - Exceptional capital access and elite investors give Recursive time to recruit, buy compute, and continue pushing the frontier.
    - thesis
    - This support matters less if later rounds show weaker terms or if capital mainly finances unrewarded research burn.
  - - The July 2026 technical release provides real evidence that the lab can generate publishable benchmark progress.
    - thesis
    - The thesis strengthens materially if those assets are converted into a product buyers can deploy and govern.
  - - AI-for-science and enterprise-AI markets remain large enough in 2026 to reward a differentiated winner.
    - thesis
    - The view would improve if Recursive demonstrates a specific monetizable wedge instead of a broad mission narrative.
  - - No public revenue, pricing, or named customers means the current mark is not underwritten like software.
    - anti-thesis
    - A disclosed product surface, price model, and customer proof would reduce the valuation discount materially.
  - - Incumbents already bundle governance, spend control, and workflow AI into broader platforms.
    - anti-thesis
    - The risk falls if Recursive shows a workflow moat that those platforms are not replicating well.
  - - Unknown preference and governance terms can turn a flat headline valuation into weak common-equity value.
    - anti-thesis
    - A clean cap table and light preference stack would improve downside protection.
  notes: The table separates company quality from price quality, because the central diligence question is not whether Recursive is interesting but whether the current entry level is attractive.
