  - CV038
  - CV041
- id: TV007
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner / diligence path
  rows:
  - - Commercialization
    - Product roadmap, packaging plan, and pricing model
    - Determines whether benchmark proof can become monetizable workflow software
    - Management presentation and product demo
  - - Customers / pilots
    - Named customers, pilots, or design partners plus use cases
    - Separates narrative demand from observable buyer adoption
    - Customer reference calls and pipeline review
  - - Governance / controls
    - Admin controls, logging, security posture, and compliance roadmap
    - Required for serious enterprise deployment and for comparing against incumbent alternatives
    - Security and compliance diligence
  - - Financials
    - Current revenue, burn, compute commitments, and runway
    - Converts a capital-formation story into an underwritable business story
    - Finance room review
  - - Cap table / preferences
    - Full security stack, preferences, pro rata, and special rights
    - Essential for understanding what the headline valuation means for common-equity outcomes
    - Legal diligence and waterfall model
  - - Milestone plan
    - What specific 6-12 month achievements should justify the next mark
    - Defines the evidence path that would move the recommendation
    - Board materials and operating plan
  notes: These asks are intentionally narrow and decision-relevant; if they are answered well, the recommendation can move. If they are not, the current price remains hard to defend.
