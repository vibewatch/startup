  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-underwriting
    missingEvidence: Current revenue, burn, compute commitments, and runway bridge.
    whyItMatters: Without actual operating metrics the current private mark cannot be tied to conventional financial underwriting or downside planning.
    diligencePath: Request finance-room metrics and monthly operating model outputs.
    relatedQuestionRefs:
    - QV005
    - QV021
    - QV030
    relatedTableRefs:
    - TV001
    - TV007
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preferences
    missingEvidence: Full cap table, liquidation preferences, pro rata rights, protective provisions, and any unusual investor terms.
    whyItMatters: Headline enterprise value can materially overstate common-equity value when the stack is complex or downside-protective.
    diligencePath: Obtain legal docs and build a current waterfall model.
