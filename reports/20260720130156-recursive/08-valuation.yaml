- id: thesis-antithesis-and-final-diligence
  title: Thesis, anti-thesis, and final diligence asks
  body: 'The thesis is straightforward: Recursive is one of the best-capitalized early-stage AI labs in the market, has unusually strong investor signal, operates in a category with real upside if automated AI research compounds, and now has enough public technical evidence to make the story more than narrative. The anti-thesis is equally strong: the current public record still looks like a research program rather than a proved business, and multibillion-dollar private valuations become fragile when commercialization, governance, and financing terms are opaque. The decisive diligence question is not whether the company is promising. It is what has to be true for a new investor to make money from this price. At minimum, management would need to show first commercial packaging, some customer or pilot proof, product-control surfaces suitable for enterprise deployment, a credible path from benchmark wins to repeatable buying behavior, and cap-table terms that do not hide preference-heavy downside.
    Without those inputs, a buyer is effectively paying for optionality at a premium price. That is why the kill triggers and final diligence asks matter so much: they define the exact evidence that would move the call from interesting to investable.'
