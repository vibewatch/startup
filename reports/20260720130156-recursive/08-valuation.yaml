  - metric
  - multiple / valuation / status
  - relevance
  - limitation
  rows:
  - - Anthropic
    - Private valuation + revenue context
    - Official 2026 Series H at $965B post-money with $47B run-rate revenue
    - Most relevant frontier-lab comparator showing how large valuation can coexist with explicit commercial scale
    - Much later stage, radically larger revenue base, and much broader customer adoption than Recursive
  - - Palantir
    - Public market cap + enterprise AI platform
    - ~$317.35B market cap in July 2026; visible AIP platform
    - Shows what a scaled AI workflow vendor with government/enterprise distribution can be worth publicly
    - Mature public company with revenue, distribution, and government exposure unlike Recursive
  - - Snowflake
    - Public market cap + governed AI feature suite
    - ~$95.31B market cap in July 2026; Cortex AI and RBAC/privacy controls visible
    - Useful benchmark for enterprise AI packaging and governance expectations
    - Data-cloud incumbent with an established installed base, not an early research lab
  - - ServiceNow / Microsoft platform set
    - Public market cap + broad enterprise AI bundling
    - ServiceNow ~ $102.30B; Microsoft ~ $2.899T; Copilot bundles governance and distribution
    - Illustrates bundling pressure from incumbents already inside enterprise workflows
    - Neither is a like-for-like startup comp; they are competitive boundary setters more than price twins
  - - MongoDB / Databricks stack analogy
    - Public market cap + private data-platform packaging context
    - MongoDB ~ $25.92B market cap; Databricks markets private, governed AI/data platform workflows
    - Useful for understanding how data-platform vendors package AI inside broader enterprise stacks
    - Still not a direct comp for a frontier AI lab with no public revenue or product surface
  notes: The comparable set is a boundary-setting exercise rather than a direct multiple comp because Recursive has no public revenue base and remains pre-product in the public record.
