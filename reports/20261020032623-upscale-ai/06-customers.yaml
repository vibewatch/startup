    title: Customer proof remains the gating diligence issue
    body: >-
      Partner validation and broad early-traction language cannot substitute for a named
      end-user reference, production status, measured outcome, renewal history, or revenue
      concentration disclosure.
    claimRefs: [CU007, CU013, CU016]
