      - ["Commercial stage", "Moving into commercial deployment (company claim)", "2026-01-21", Upscale, Medium, "Commercialization was beginning", "No production-versus-pilot split or start date"]
      - ["Networking solution availability", "Solutions slated to ship in 2026 (company claim)", "2026-01-21", Upscale, Medium, "Availability milestone precedes measurable retention", "No shipped-unit, site, or active-user count"]
      - ["SkyHammer full-switch availability", "Expected sales start in Q4 2026", "2025-12-02", HPCwire, Medium, "Independent reporting indicated pre-sales product maturity", "No subsequent sales volume or deployment confirmation"]
      - ["Token Fabric announcement", "Official press index lists portfolio introduction", "2026-10-08", Upscale, Medium, "Portfolio launch expands the commercial surface", "No named adopter, order, or customer outcome"]
    notes: >-
      Dates and wording preserve the cited publication or announcement; these are product
      and commercialization milestones, not a comparable customer-count series or proof of
      recognized revenue.
    claimRefs: [CU004, CU005, CU006, CU012]
  - id: TU003
    title: Named customer proof table
    columns:
      - Public reference
      - Relationship
      - Deployment or use case
      - Production vs. pilot
      - Customer outcome
      - Diligence interpretation
    rows:
      - [NVIDIA, "Partner and investor; not disclosed as a customer", "Spectrum-X reference architectures and validated designs", Not disclosed, Not disclosed, "Do not count as a customer or end-user deployment"]
      - ["Unnamed hyperscalers", "Target segment with company-claimed early traction", "Open networking for AI infrastructure", Not disclosed, Not disclosed, "Require a named reference and production evidence"]
      - ["Unnamed AI infrastructure operators", "Target segment with company-claimed early traction", "Scalable open networking alternatives", Not disclosed, Not disclosed, "Require contract status, deployment scale, and measured outcome"]
    notes: >-
      This is an exhaustive audit of customer-like references in the ten retained sources,
      not an exhaustive customer list; the source set discloses no named end customer.
    enumerationScope:
      coverage: exhaustive
      basis: >-
        All customer-like references appearing in the ten retained sources reviewed through
        the 2026-10-20 run date.
    claimRefs: [CU001, CU002, CU004, CU007, CU013, CU015]
