chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, leadership, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Upscale AI positions itself as a pure-play networking infrastructure vendor for heterogeneous AI compute,
              combining silicon, systems, software, and lifecycle support around open standards. Public reporting says
              the business began in 2024 as a division within Auradine before its September 2025 public launch. Barun
              Kar serves as co-founder and chief executive, while Rajiv Khemani is co-founder and executive chairman;
              both bring company-building experience from Palo Alto Networks, Innovium, and Cavium. That pedigree is a
              credible founder-market-fit advantage, but the public leadership record is concentrated around the two
              founders and does not disclose a complete executive team, board, or independent directors. June 2026
              financing materials use Santa Clara, California as the location, although a legal principal-office record
              was not found in the assigned evidence. Scale indicators are also dated: the company claimed more than 100
              technologists at launch, and HPCwire reported 140 employees in December 2025. Neither figure should be
              treated as current headcount as of the run date.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
