  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The financing mark is observable, but operating proof and deal terms remain gating inputs before an invest
      recommendation.
    data:
      nodes:
        - id: financing-mark
          label: $2B financing mark
          detail: Reuters-reported June 2026 transaction reference.
        - id: capital-base
          label: $500M reported total funding
          detail: Capital supports execution but does not establish fair value.
        - id: delivery-plan
          label: 2026 delivery plans
          detail: Scale-up and NVIDIA-based scale-out offerings were framed as slated or planned.
        - id: proof-gap
          label: Commercial and benchmark gaps
          detail: Revenue quality, production deployment, and independent performance evidence are missing.
        - id: terms-gap
          label: Preference and control gaps
          detail: Cap-table economics and investor protections are undisclosed.
        - id: recommendation
          label: Track / research-more
          detail: No buy at the reported mark until operating proof and terms are verified.
      edges:
        - from: financing-mark
          to: capital-base
          label: transaction context
        - from: capital-base
          to: delivery-plan
          label: funds execution
        - from: delivery-plan
          to: proof-gap
          label: requires verification
        - from: proof-gap
          to: terms-gap
          label: complete underwriting
        - from: terms-gap
          to: recommendation
          label: price-sensitive decision
    approximationNotes: Qualitative decision chain only; node order does not encode probability, value, or conversion.
    claimRefs:
