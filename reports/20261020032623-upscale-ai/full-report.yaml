  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation / return logic
      - Probability signal and downside trigger
    rows:
      - - Bull
        - >-
          On-time product delivery, independently verified performance, multiple production deployments, repeatable
          revenue, and acceptable preference terms.
        - >-
          Only after those inputs are verified should value above the $2B financing mark be tested with revenue and
          margin multiples; no public numeric range is supportable today.
        - >-
          Signal: referenceable renewals and measured economics. Trigger against: delivery slippage or benchmark
          underperformance.
      - - Base
        - Capital supports execution, but public operating proof remains limited while buyers become more selective.
        - >-
          Treat $2B as a negotiated transaction reference and defer a return target until revenue, margins, retention,
          dilution, and exit assumptions are known.
        - >-
          Signal: pilots convert to paid production. Trigger against: continued disclosure limited to financing and
          planned launches.
      - - Bear
        - >-
          Commercialization is delayed, performance remains unsubstantiated, preference overhang is onerous, or
          capital-efficient buyers defer deployments.
        - >-
          Require a materially lower entry price or pass; the retained evidence cannot support a precise floor or
          probability.
        - >-
          Signal: missed ship dates or weak conversion. Trigger: down round, adverse terms, or inability to show
          production economics.
