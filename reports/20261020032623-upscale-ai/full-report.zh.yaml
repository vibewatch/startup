  - id: TV002
    title: 投资逻辑与反向逻辑
    columns:
      - 立场
      - 论点
      - 哪些事实会改变判断
    rows:
      - - 投资逻辑
        - 据报道，以 $2B 估值完成 $190M 的追加融资，说明投资者需求强劲。
        - 融资条款若给予过度的优先权或控制权，会削弱这一信号。
      - - 论点
        - 超过 $100M 的种子轮融资和 $200M 的 A 轮融资，为产品和市场拓展提供了资金。
        - 意外的高烧钱、过短的资金续航期，或近期需要再融资，都会降低这笔资金的价值。
      - - 论点
        - 开放标准的纵向扩展和基于 NVIDIA 的横向扩展计划，瞄准了一个网络约束至关重要的市场。
        - 如果无法交付可互操作的产品，或拿不出独立的生产环境基准测试，差异化优势将被削弱。
      - - 反论点
        - 指定的公开证据没有披露收入、利润率、留存率或具名的生产部署。
        - 经审计的财务报表，以及可供核实且有重复使用记录的生产客户，将显著提升信心。
      - - 反论点
        - 2025 年 9 月的一份独立报告指出，Upscale 没有提供任何性能数据。
        - 独立工作负载基准和可靠性数据能够弥补性能证明缺口。
    notes: 融资相关表述属于据报道的事实；由于引用的公开来源没有提供缺失的尽调材料，商业、技术和治理层面的影响仍属有条件判断。
    claimRefs:
      - CV001
      - CV006
      - CV008
      - CV009
      - CV011
      - CV013
      - CV015
  - id: TV003
    title: 看多、基准和看空情景
    columns:
      - 情景
      - 明确假设
      - 估值 / 回报逻辑
      - 概率信号与下行触发因素
    rows:
      - - 看多
        - 按时交付产品、性能经独立验证、实现多次生产部署、收入可重复，并且优先权条款可接受。
        - 只有在这些输入得到验证后，才应使用收入和利润率倍数检验高于 $2B 融资估值的价值；目前没有公开数字区间可以支撑这一检验。
        - 信号：可核实的续约和经测量的经济性。触发因素：交付延期或基准表现不佳。
      - - 基准
        - 资本支持执行，但公开运营证明仍然有限，买方同时变得更加挑剔。
        - 将 $2B 视为协商中的交易参照，待收入、利润率、留存、稀释和退出假设明确后再设定回报目标。
        - 信号：试点转化为付费生产部署。触发因素：披露仍局限于融资和计划中的发布。
      - - 看空
        - 商业化延期、性能仍缺乏证明、优先权负担过重，或重视资本效率的买方推迟部署。
        - 要求显著降低入场价格，或直接放弃；现有证据不足以支持精确的底价或概率判断。
        - 信号：错过交付日期或转化乏力。触发因素：下轮融资、逆风条款，或无法展示生产环境经济性。
    notes: 这些情景是有条件的证明门槛，不是按概率加权的预测；指定证据无法提供确切的估值区间、概率、目标回报、持有期或退出倍数。
    claimRefs:
      - CV001
      - CV007
      - CV008
      - CV010
      - CV011
      - CV012
      - CV013
      - CV015
