      - number: '1.2'
        title: 融资阶段、投资者与商业验证
        blocks:
          - type: paragraph
            body: >-
              资本历史是目前最清晰的公开规模信号。Upscale 于 2025 年 9 月宣布种子轮融资超过 $100M，随后在 2026 年 1 月完成 $200M Series A，使累计融资超过 $300M。2026 年
              6 月的 $190M Series A-1 扩展轮又将据报道的累计融资推至 $500M、估值推至 $2B；Reuters 独立报道了这些数字。Premji Invest
              领投本轮，NVIDIA、Salesforce Ventures、Seligman Ventures 和 Temasek
              跟投，早期投资者也再次参与。这一投资者组合带来资本、生态触达和潜在客户渠道，但已募集融资不等于可用现金，现有证据也未披露所有权、清算优先权、董事会权利、债务或二级交易。Upscale
              称正与多家超大规模云厂商和新云提供商推进评估与部署，但留存来源没有列出生产环境客户，也没有披露收入、ARR、利润率、客户数量或从评估转为持续部署的转化情况。
