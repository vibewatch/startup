      - number: '4.3'
        title: 硬件开发使成本与利润率证据不可或缺
        blocks:
          - type: paragraph
            body: >-
              Upscale 的模式包含芯片、系统、软件和支持服务，因此不能假定其经济性会像纯软件一样。独立报道称 SkyHammer 由 TSMC 制造，交换机仍以 2026
              年第四季度发布为目标；在规模得到证明前，公司要承担开发、晶圆制造、库存、验证和支持成本。公司称其 fabric 能减少瓶颈、提升效率，但留存证据没有提供经量化的客户节省，也没有披露毛利率。SiliconANGLE
              另指出，公司没有为突破性性能说法提供性能数字。毛利率、物料清单、营运资本、资本开支、质保风险敞口、CAC、回本期和支持负担目前都不可得。
