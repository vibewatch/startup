  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 决策与价格纪律
        blocks:
          - type: paragraph
            body: >-
              建议为跟踪 / 继续研究，置信度中低，投资判断风险高，并对报道的 $2B 融资估值持偏高看法。这轮融资验证了投资者兴趣，为 Upscale
              推进路线图提供了资本，但不能证明收入质量、持久的客户采用或独立推导出的公允价值。本章审阅的公开材料没有提供建立收入倍数、贴现现金流或里程碑调整估值所需的运营数据。因此，入场纪律必须是有条件的：在生产部署、持续的商业经济性和优先权条款得到验证前，不应按该报道估值买入。单纯降低价格并不能修复缺失的证明，但若补上更强的证据，配合更低的投资价格或更有利的条款，投资判断仍可能转为正面。
            claimRefs:
              - CV001
