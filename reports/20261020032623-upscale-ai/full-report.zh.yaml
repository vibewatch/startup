            title: 投资节奏应跟随证明，而不是公告广度
            body: 后续投资判断应以客户样品、独立的目标规模基准、晶圆厂和合作伙伴保护措施、合规材料，以及经董事会批准的现金跑道为门槛。若错过 2026 年底的采样且没有及时补救计划，就应暂停投资。
