chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、领导层与运营版图
        blocks:
          - type: paragraph
            body: >-
              Upscale AI 将自己定位为面向异构 AI 计算的专业网络基础设施供应商，围绕开放标准整合芯片、系统、软件和全生命周期支持。公开报道显示，这项业务于 2024 年起源于 Auradine
              内部的一个部门，并在 2025 年 9 月公开推出。Barun Kar 是联合创始人兼 CEO，Rajiv Khemani 是联合创始人兼执行董事长；两人都曾在 Palo Alto
              Networks、Innovium 和 Cavium 参与公司建设。这段履历构成可信的创始人与市场匹配优势，但公开领导层信息集中在两位创始人身上，未披露完整的高管团队、董事会或独立董事。2026 年 6
              月的融资材料将所在地写为 Santa Clara, California，但在指定证据中未找到法律上的主要办公地记录。人员规模数据也有明确时点：公司在发布时称有超过 100 名技术人员，HPCwire 则报道
              2025 年 12 月有 140 名员工。这两个数字都不应被视为报告日的当前员工数。
