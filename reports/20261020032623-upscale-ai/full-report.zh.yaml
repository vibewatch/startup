    summary: 已公布的技术栈把异构端点连接到独立的纵向扩展和横向扩展网络，再叠加软件与生命周期运营。
    data:
      layers:
        - label: 异构 AI 端点
          detail: 该网络计划连接的计算和数据资源。
          items:
            - name: GPUs and XPUs
            - name: Memory and storage
        - label: 纵向扩展网络
          detail: 以 SkyHammer 和 UALink 为核心的机架级互联。
          items:
            - name: SkyHammer ASIC
            - name: UALink switch system
        - label: 横向扩展网络
          detail: 跨机架和集群的以太网扩展。
          items:
            - name: NVIDIA Spectrum-X silicon
            - name: Ethernet switching systems
        - label: 网络软件
          detail: 开放接口、控制、遥测和编排。
          items:
            - name: AI-optimized SONiC
            - name: SAI, ESUN, and Ultra Ethernet
        - label: 集成与验证
          detail: 合作伙伴集成、参考架构和经验证的设计。
          items:
            - name: Validated design work
            - name: Reference architectures
        - label: 生命周期运营
          detail: 部署、编排、遥测和支持服务。
          items:
            - name: Deployment services
            - name: Operations and support
    approximationNotes: 层级顺序是分析框架；保留的来源没有提供完整的实施架构图，也没有证明每个组件都已普遍可用。
    claimRefs:
      - CE001
      - CE005
      - CE006
      - CE010
  - id: FU001
    title: 证据约束的客户旅程
    type: journey-map
    summary: 公开证据覆盖市场定位、架构选择和合作伙伴赋能，但生产验证、续约和扩张仍未验证。
    data:
      nodes:
        - id: target
          label: 目标工作负载
          detail: 超大规模云厂商、基础设施运营商或多供应商 AI 集群需求
          touchpoints:
            - Open-architecture positioning
            - Training and inference requirements
        - id: evaluate
          label: 架构评估
          detail: 客户在开放以太网和 UALink 路径与在位者专有网络之间进行比较
          touchpoints:
            - Interoperability assessment
            - Performance and economics proof
        - id: enable
          label: 合作伙伴赋能
          detail: NVIDIA 参考架构和经验证的设计可能支持采购
          touchpoints:
            - Spectrum-X ecosystem
            - SONiC operating model
        - id: deploy
          label: 商业部署
          detail: 公司报告已进入部署阶段，但未披露账户或站点名称
          touchpoints:
            - Pilot scope not disclosed
            - Production status not disclosed
        - id: validate
          label: 生产验证
          detail: 公开资料中没有客户归因的使用率、可靠性或结果指标
          touchpoints:
            - Active-use proof needed
            - Customer reference needed
        - id: expand
          label: 续约与扩张
          detail: 没有公开的留存、合同期限、客户群或集中度证据
          touchpoints:
            - NRR and GRR unavailable
            - Top-customer exposure unavailable
    approximationNotes: 这些阶段组成一条受证据约束的分析流程，不是披露的转化阶段；没有推断转化率、持续时间或阶段规模。
    claimRefs:
      - CU002
      - CU007
      - CU008
      - CU010
      - CU011
      - CU016
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 定性排序将芯片进度和生产性能置于最高剩余风险层级，同时明确将财务和合规缺口保留为未知。
    data:
      columns:
        - label: 可能性
        - label: 影响
        - label: 缓解措施成熟度
        - label: 剩余严重程度
      rows:
        - label: SkyHammer 进度
          values:
            - value: Medium-high
            - value: Critical
            - value: Early
            - value: Critical
        - label: 生产性能与可靠性
          values:
            - value: Medium
            - value: Critical
            - value: Unproven
            - value: Critical
        - label: 对 TSMC 制造的依赖
          values:
            - value: Medium
            - value: Critical
            - value: Undisclosed
            - value: High
        - label: 对 NVIDIA / Spectrum-X 的依赖
          values:
            - value: Medium
            - value: High
            - value: Partnership announced
            - value: High
        - label: 受功率约束的客户部署
          values:
            - value: Medium-high
            - value: High
            - value: Undisclosed
            - value: High
        - label: 合规与 IP 准备度
          values:
            - value: Unknown
            - value: High
            - value: Unverified
            - value: High
    approximationNotes: 这些类别是分析师的定性标签，不是数字概率；未知项仍保持未知，不会被打成低风险。
    claimRefs:
      - CR001
      - CR004
      - CR006
      - CR009
      - CR013
      - CR014
      - CR015
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 融资定价可见，但在提出投资建议前，运营证明和交易条款仍是必须验证的门槛条件。
    data:
      nodes:
        - id: financing-mark
          label: $2B 融资估值
          detail: Reuters 报道的 2026 年 6 月交易参照。
        - id: capital-base
          label: 据报道的 $500M 总融资
          detail: 资本支持执行，但不能证明公允价值。
        - id: delivery-plan
          label: 2026 年交付计划
          detail: 纵向扩展和基于 NVIDIA 的横向扩展方案，公开表述仍属计划交付或规划阶段。
        - id: proof-gap
          label: 商业和基准缺口
          detail: 收入质量、生产部署和独立性能证据均缺失。
        - id: terms-gap
          label: 优先权与控制权缺口
          detail: 股权结构经济条款和投资者保护措施均未披露。
        - id: recommendation
          label: 观望 / 继续研究
          detail: 在运营证明和条款得到验证前，不应按报道的估值买入。
      edges:
        - from: financing-mark
          to: capital-base
          label: 交易背景
        - from: capital-base
          to: delivery-plan
          label: 资金支持执行
        - from: delivery-plan
          to: proof-gap
          label: 需要验证
        - from: proof-gap
          to: terms-gap
          label: 完成投资判断
        - from: terms-gap
          to: recommendation
          label: 对价格敏感的决策
    approximationNotes: 仅为定性决策链；节点顺序不代表概率、价值或转化。
    claimRefs:
      - CV002
      - CV007
      - CV008
      - CV011
      - CV012
      - CV013
      - CV014
      - CV016
