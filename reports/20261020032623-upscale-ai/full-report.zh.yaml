              ESUN，但审阅过的段落没有确认合规证书、安全鉴证、出口管制流程、隐私控制、专利清理或重大诉讼。这是有边界的证据缺口，不代表不存在问题。当前的尽调路径是取得认证路线图、安全审计材料、出口分类分析、IP
              自由实施意见、诉讼时间表、事件日志和客户验证结果。触发逻辑失效的情形包括：错过客户采样里程碑且没有及时的补救计划；未能在目标基数上展示独立性能和可靠性；失去关键晶圆厂或 Spectrum-X
              供应；或者在获得可重复的生产收入前，现金跑道降至 18 个月以下。最后一个阈值是监控标准，不是对当前现金跑道的断言。
