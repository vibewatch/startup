            body: >-
              公开记录支持一套连贯的产品逻辑和明确的实现选择，但尚未证明生产成熟度。留存来源没有提供覆盖异构加速器的独立吞吐量、尾延迟、拥塞行为、故障恢复或互操作性基准测试。审阅材料也没有披露安全架构、安全开发控制、认证状态、漏洞处理、可用性目标或事件历史。最后，在指定证据池中没有找到相关公开代码库、软件包、论坛或从业者材料，因此不能从参与标准组织推断开发者采用。投资尽调需要在赋予生产级状态前，取得基准原始数据、芯片和系统验证证据、客户验收标准、依赖与支持矩阵，以及安全与可靠性控制文件。
