            body: >-
              这组里程碑显示融资速度异常快、产品野心不断扩大，但商业成熟度尚未得到独立验证。2025 年 12 月，HPCwire 报道核心 SkyHammer ASIC 仍在开发中，完整交换机的销售目标为 2026
              年第四季度。2026 年 3 月，公司公告了当年晚些时候推出基于 NVIDIA Spectrum-X 芯片和 AI 优化 SONiC 软件的 横向扩展 系统的计划。到 10 月，Upscale 的资源中心已将
              Token Fabric 列为覆盖 纵向扩展、横向扩展 和 AI
              原生软件的产品组合。这些公告扩大了可服务的产品范围，但出货时间、生产可靠性和客户验收仍是执行问题，而不是已经完成的里程碑。行业背景有利但并非没有风险：Futurum 预计 2026 年五家大型美国云和 AI
              基础设施提供商的资本支出合计为 $660B–$690B，同时警告基础设施投资可能跑在收入兑现之前。对 Upscale 而言，这既带来需求机会，也带来买方预算和部署时点风险。
