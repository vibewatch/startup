      - number: '3.3'
        title: 定价、封装、分销与切换
        blocks:
          - type: paragraph
            body: >-
              审阅过的官方和合作伙伴材料没有披露可比的目录价格、合同计量单位、折扣结构、支持费用或已实现的客户经济性。因此无法在
              Upscale、现有厂商捆绑方案、直接同行和内部集成之间做出有依据的总成本比较。分销方面的证据更强：Upscale 推进的是覆盖端到端的支持方案、参考架构、经过验证的设计和 Nvidia
              生态关系，而不是单独销售一块芯片。开放标准可能降低架构锁定、简化异构计算，但买方仍可能承担验证、运营、遥测、软件集成、支持和供应商承诺带来的切换成本。没有公开定价，不能据此推断方案免费、更便宜或能提升利润率。
            claimRefs:
              - CP003
              - CP004
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP015
      - number: '3.4'
        title: 护城河持续性与替代风险
        blocks:
          - type: paragraph
            body: >-
              乐观情景是不断扩大的 AI 基础设施预算为专业供应商留下空间：IDC 统计 2025 年第四季度全球 AI 基础设施支出为 $89.9B，并预计 2026 年达到 $487B。Upscale 据报道获得的
              $500M 融资和 $2B 估值，为芯片与系统执行提供了有意义的资源。悲观情景同样具体。Fortune 报道称，开放标准仍需证明其在真实训练中的性能能够匹敌 Nvidia
              的专有方案；电力可用性、组件短缺和出口管制也可能拖慢整体建设。开放标准可以扩大生态，但也可能让差异化商品化，使更大的供应商或新进入者采用类似接口。因此，持久优势取决于经验证的性能、运营可靠性、客户部署密度、支持质量和供应保障，而不只是加入某个标准组织。
            claimRefs:
              - CP008
              - CP011
              - CP012
              - CP013
              - CP014
              - CP016
      - number: '3.5'
        title: 证据展项
        blocks:
          - type: callout
            title: 开放标准尚未形成护城河
            body: 同一套支持异构选择的标准，也可能降低现有厂商和新供应商的进入门槛。Upscale 需要独立的生产证据和重复部署，才能把架构开放性转化为持久的切换成本。
            calloutType: risk
            claimRefs:
              - CP008
              - CP010
              - CP016
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入架构清晰，但变现不可见
        blocks:
          - type: paragraph
            body: >-
              Upscale 展示的是覆盖芯片、系统和软件的全栈产品组合，包括 纵向扩展 技术、基于 Spectrum-X 的 横向扩展 系统、AI 优化的 SONiC
              层和全生命周期支持。这种广度带来多个潜在收入来源：集成硬件系统、嵌入式或单独许可的软件，以及支持服务。但留存来源没有披露价格、计费单位、合同期限、软件与硬件的组合、支持附加率或收入确认政策。10 月的 Token
              Fabric 列表显示产品组合仍在扩展，而此前报道仍将 SkyHammer 描述为开发阶段产品。因此，投资者可以梳理其产品技术栈，但还不能据此建立有依据的收入模型。
