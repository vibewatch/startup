  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围与成熟度
        blocks:
          - type: paragraph
            body: >-
              Upscale 描述的是一套全栈产品组合，而不是单一芯片或网络运营系统。其 2026 年 10 月网站更新将 Token Fabric 列为覆盖 纵向扩展、横向扩展 和 AI 原生软件的总产品线；此前材料则把
              SkyHammer 定位为专门构建的 纵向扩展 组件，把 NVIDIA Spectrum-X 加 SONiC 方案定位为 横向扩展 组件。成熟度证据并不均衡：Token Fabric 公告是最新材料，但更详细的
              横向扩展 公告把交付安排在 2026 年晚些时候，独立的 HPCwire 采访也把 SkyHammer 交换机可用性放在 2026
              年第四季度。因此，投资者应把这套产品组合视为已宣布的架构集合、集成工作和走向商业部署的产品，而不是每一层都已普遍可用或已实现规模化运行的证明。
