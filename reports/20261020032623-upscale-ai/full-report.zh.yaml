        title: 融资扩大能力，但不能证明现金跑道
        blocks:
          - type: paragraph
            body: >-
              2026 年 6 月的 Series A-1 增加了 $190M，并使据报道的累计融资达到 $500M，对应估值 $2B。公司公告和 Reuters
              都称，这笔资本计划用于扩大业务、加快技术交付，延续此前扩张工程、销售和运营的计划。对一项资本密集型商业化项目而言，这是有意义的融资支持，但累计募集融资不是当前可用现金。留存来源没有报告现金余额、月度消耗率、已承诺采购义务、债务、库存需求、流片成本或现金跑道。因此财务判断是喜忧参半：获得资本是优势，但收入、利润率、消耗率和合同证据的缺失，阻碍了对自给能力或下一轮融资时点的判断。
