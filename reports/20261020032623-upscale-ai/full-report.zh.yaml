      - number: '4.2'
        title: 商业活动仍处于部署阶段，尚未量化财务表现
        blocks:
          - type: paragraph
            body: >-
              公司称，随着业务进入商业部署阶段，将扩大工程、销售和运营团队；随后又称正与多家超大规模云厂商和新云提供商推进评估与部署。这更像集中式的企业基础设施销售，需要技术评估和部署流程，而不是自助式交易。但这些说法不足以证明已签署生产合同、已确认收入、客户数量、积压订单、利用率、销售周期长度或续约行为。公司所说的“强劲早期牵引力”和客户拉动方向上偏正面，却不能替代订单、验收标准、点名的部署或现金回款。定价和渠道经济性仍是尽调问题，而不是可报告的运营指标。
