      - number: '8.4'
        title: 退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              留存的公开来源证明了融资事件和产品意图，但不能证明退出准备度。它们没有披露收入规模、毛利率、留存、消耗率、现金跑道、点名的生产环境客户、经审计的性能、所有权集中度、清算优先权、反稀释权利、董事会控制或二级流动性。因此，决定性尽调材料很明确：取得股权结构表和完整融资文件；核对累计融资；审阅经审计或董事会批准的财务数据；检查客户合同、部署状态、续约证据和管道转化；并在生产工作负载上验证产品基准测试。逻辑失效触发条件包括交付时间表落空、试点无法转化、披露后的单位经济性疲弱、优先权条款损害普通股回报，或无法在没有下行轮的情况下为这条资本路径融资。在这些问题解决前，不应把目标回报、持有期限或退出估值表述为有证据支持的结论。
            claimRefs:
              - CV003
              - CV007
              - CV008
              - CV011
