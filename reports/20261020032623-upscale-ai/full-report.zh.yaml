      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              最明确的早期买方是超大规模云厂商、新云基础设施提供商，以及组建大型异构 AI
              集群的运营方。网络架构师和平台工程团队是技术用户，基础设施负责人和资本委员会可能是预算负责人；这是根据资本支出主导的采购模式做出的推断，并非 Upscale 披露的销售流程。TechStartups
              报道称，Upscale 表示其正与客户推进覆盖 纵向扩展 和 横向扩展
              环境的评估与部署，但也指出客户未被点名。因此，采用路径大致是从架构验证和互操作性测试，经过工作负载认证，走向生产部署；而可供复用的客户参考仍是重要的缺失证据。
            claimRefs:
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: 驱动因素、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              需求驱动因素很强：超大规模云厂商的支出集中，提升昂贵加速器利用率的压力，以及对混合计算开放网络 的兴趣，都在推高需求。但约束同样重要。HPCwire 报道称 SkyHammer 的目标可用时间是 2026
              年第四季度，Upscale 3 月公告中的 Spectrum-X 横向扩展 系统则计划在 2026 年晚些时候推出；在大规模部署之前，这些时间表都让公司暴露于验证和执行风险。Futurum
              还指出电力、许可和实体建设约束，以及基础设施投资与相应回报之间 18–36 个月的滞后。估值因此应承认庞大的需求池，同时对从行业资本支出转化为 Upscale 收入的未经支持的推断、缺少有边界的
              SAM/SOM，以及没有点名的生产买方保持折价。
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 证据展项
        blocks:
          - type: callout
            title: 需求庞大，但可触达性尚未证明
            body: 最强的公开数字是广泛的基础设施支出范围。把它直接套到 Upscale 身上会夸大机会，因为留存来源没有披露网络支出分配、开放网络 的份额或供应商捕获率。
            calloutType: insight
            claimRefs:
              - CM005
              - CM011
              - CM013
          - type: callout
            title: 产品时点延迟证明采用仍未落地
            body: 公开发布的时间表将重要的 纵向扩展 和 横向扩展 产品可用性放在 2026 年，因此验证、转入生产和客户参考证据仍是近期市场获取的未决决定因素。
            calloutType: risk
            claimRefs:
              - CM012
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              买方至少有六条解决方案路径可选：Upscale 的开放式全栈网络、Nvidia 的专有加速器网络技术栈、直接竞争对手 Nexthop AI、由 Broadcom
              主导的商用或定制网络、内部集成建设，或继续使用现有以太网和 PCIe 架构。Nvidia 是最强的现有厂商，因为独立报道称其加速器和 纵向扩展 互联目前占据主导地位。指定证据中，Nexthop
              是最清晰的风险投资支持的直接同行，面向同一批超大规模云厂商和新云客户，并在完成 $500M Series B 后达到 $4.2B 估值。Broadcom 和 Nvidia
              还拥有初创公司难以匹敌的研发能力。现有方案和内部建设仍是可信的采购替代路径，但留存来源没有量化它们的经济性。
            claimRefs:
              - CP007
              - CP009
              - CP010
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP007
              - CP009
              - CP010
              - CP011
              - CP016
      - number: '3.2'
        title: 能力、路线图与战略定位
        blocks:
          - type: paragraph
            body: >-
              Upscale 的差异化来自开放标准，以及覆盖 纵向扩展、横向扩展、芯片、系统和软件的产品组合。纵向扩展 路线围绕基于 UALink 的 SkyHammer 交换机展开，HPCwire 报道其预计在 2026
              年第四季度上市。横向扩展 计划采用 Nvidia Spectrum-X 以太网芯片和 AI 优化的 SONiC 技术栈，公司还称已加入 Nvidia Partner
              Network。这形成了务实但重要的战略张力：Upscale 以开放性对抗专有锁定，却又依赖 Nvidia 芯片和验证来完成部分 横向扩展 产品组合。UALink
              宣称的设备规模很有吸引力，但技术规格和上市目标不能替代工作负载级生产证明。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP016
