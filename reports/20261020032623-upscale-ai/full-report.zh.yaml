              - CV015
      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              指定证据不足以支持一个数字化的公允价值区间，因此情景分析使用可观察的证明门槛，而不是臆造倍数。乐观情景需要生产部署、可重复的客户经济性，以及按时交付已宣布的 纵向扩展 和 横向扩展
              系统；只有这样，才能用真实收入和利润率数据检验是否有价值超过 $2B
              融资估值。基准情景把融资估值视为谈判形成的交易参考，而非公允价值，并在里程碑得到验证前继续观察。悲观情景包括商业化延迟、缺少性能佐证，以及更谨慎且受电力约束的数据中心支出环境。这些信号可以支持推迟投资或采用明显更低的入场价格，但证据不支持赋予精确概率或设定精确的下行底线。
            claimRefs:
