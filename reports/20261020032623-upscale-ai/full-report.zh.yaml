  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              这里要看的投资类别是专门为 AI 构建的网络，而不是整个 AI 数据中心技术栈。已有证据显示，Upscale
              的范围包括网络芯片、交换机和机架系统、网络操作软件、编排，以及连接加速器、内存和存储的全生命周期支持，覆盖 纵向扩展 与 横向扩展
              环境。范围不包括加速器、内存、存储、电力、建筑和模型软件本身的采购金额，尽管这些相邻预算会为网络连接创造需求。现有替代方案包括专有的 NVLink/NVSwitch
              环境、从通用数据中心演化而来的传统以太网，以及买方主导的内部集成。只有当异构计算和降低供应商锁定的价值超过现有厂商垂直整合技术栈所带来的集成确定性时，开放标准才真正重要。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM014
      - number: '2.2'
        title: 用需求范围测算，而不是臆造 TAM
        blocks:
          - type: paragraph
            body: >-
              公开证据提供了两种不可直接比较的市场规模视角。Futurum 预计 Microsoft、Alphabet、Amazon、Meta 和 Oracle 在 2026 年合计投入 $660–$690B
              资本支出，其中大部分流向 AI 计算、数据中心和网络。这只是需求范围，不是 Upscale 的可服务收入：其中包含大量网络之外的类别，最终能流向新供应商的只会是其中一部分。另一方面，Upscale 1 月公告引用
              650 Group 的预测，称到十年期末 AI 网络年市场规模将达到 $100B。后一个数字可以作为方向性证据，但它来自公司发布材料，缺少公开方法论、地域范围和类别边界。指定证据中没有来源能够单独拆出
              Upscale 的可服务份额或可信的可获得份额。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
