      - number: '5.2'
        title: 架构与关键依赖
        blocks:
          - type: paragraph
            body: >-
              这套架构把机架级一致性与横向集群扩展分开。SkyHammer 是计划放在核心位置的 UALink 交换机；横向扩展 设计则结合 NVIDIA Spectrum-X 以太网交换机芯片、Upscale 的 SONiC
              实现、系统集成和支持服务。这是一套开放接口策略，而不是纵向独立的供应链：SkyHammer 依赖 TSMC 制造，横向扩展 产品依赖 NVIDIA 芯片，有用的互操作性还依赖不断演进的 UALink、Ultra
              Ethernet、SAI、ESUN 和 SONiC 生态。公司还宣称具备 ASIC 原生遥测、确定性的无损以太网行为、工作负载隔离和编排能力，但留存证据没有在生产工作负载下独立验证这些运行特性。
