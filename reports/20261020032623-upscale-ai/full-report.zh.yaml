      - number: '8.2'
        title: 融资背景与逻辑平衡
        blocks:
          - type: paragraph
            body: >-
              Reuters 报道称，2026 年 6 月扩展轮以 $2B 估值融资 $190M，并将累计融资推至 $500M；Upscale 的新闻公告索引也独立将这轮融资描述为使累计融资达到五亿美元。Indexed.vc
              则记录三轮合计 $490M，因此留存来源之间存在 $10M 的累计融资差异，不应被抹平。此前公司发布材料报道种子轮融资超过 $100M、Series A 为 $200M，使融资超过
              $300M。支持估值的逻辑是：大额融资、经验丰富的投资者和开放标准产品策略，为不断扩大的 AI 基础设施市场提供了期权价值。反方逻辑是：融资势头跑在商业证据之前，而产品交付在 2026
              年仍被描述为计划或预定事项。
