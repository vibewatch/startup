        - Participation is described; certification evidence is not in the reviewed passages
        - Medium
        - High
        - Standards participation is an early mitigation; residual qualification risk remains high
        - Obtain conformance results, compatibility matrix, and named OEM acceptance records
      - - Export controls, sanctions, and technology-transfer compliance
        - United States and destination markets
        - Not established by the assigned successful sources
        - Unknown
        - High
        - No public mitigation can be credited from this pool; residual exposure is unquantified
        - Review ECCNs, restricted-party controls, customer geographies, and counsel memorandum
      - - Security, privacy, IP, and litigation posture
        - United States and customer jurisdictions
        - Certifications, incident history, patent clearance, and case schedule remain unverified
        - Unknown
        - High
        - Open standards do not substitute for controls or freedom to operate
        - Obtain SOC/ISO evidence, incident log, FTO opinion, insurance, and litigation schedule
    notes: >-
      Partial public-evidence register as of 2026-10-20; unknown means the assigned fetched
      sources do not establish the item, not that the exposure is absent.
    enumerationScope:
      coverage: partial
      basis: >-
        Categories identifiable from the assigned successful source pool; private contracts,
        legal databases, certifications, and regulator records were not available in that pool.
    claimRefs: [CR005, CR008, CR009, CR013]
  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - - SkyHammer sampling or volume schedule slips beyond the reported late-2026 / 2027 window
        - Medium-high
        - Critical
        - Development milestones are public; recovery capacity is not
        - High
        - Tape-out, yield, package, qualification, and customer-acceptance dates
      - - Production fabric misses target reliability, latency, radix, or economics
        - Medium
        - Critical
        - Architecture claims exist; independent production benchmark is absent
        - High
        - Third-party test at target scale and field-failure data
      - - Capital is consumed before repeatable commercial deployment
        - Unknown
        - High
        - $500 million total funding is reported; burn and cash are undisclosed
        - High
        - Cash, monthly burn, committed wafer spend, gross margin, and runway
      - - Customer deployments are delayed by power and interconnection constraints
        - Medium-high
        - High
        - Geographic diversification may help; company mitigation is undisclosed
        - Medium-high
        - Pipeline exposure by site, power-ready date, and cancellation right
    notes: >-
      Likelihood and residual-severity labels are qualitative analyst assessments anchored
      to cited milestones and industry constraints; they are not measured probabilities.
    claimRefs: [CR001, CR002, CR006, CR007, CR009, CR010, CR011, CR012]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration
      - Failure scenario
      - Severity
      - Mitigation and residual exposure
    rows:
      - - Advanced ASIC manufacturing
        - TSMC
        - SkyHammer manufacturing
        - Single named foundry in reviewed evidence
        - Yield, packaging, allocation, or schedule disruption
        - Critical
        - Financing supports commitments, but no second source or allocation terms are public
      - - Spectrum-X scale-out platform
        - NVIDIA
        - Switch silicon, partner network, reference architectures, and validated designs
        - Material named technology dependency
        - Roadmap, supply, pricing, or channel access changes
        - High
        - SONiC and full-stack support add control; underlying silicon dependency remains
      - - Open scale-up standards
        - UALink and adjacent consortia
        - Interoperability and multi-vendor ecosystem
        - Ecosystem-wide dependency
        - Fragmentation or weak adoption leaves proprietary alternatives dominant
        - High
        - Multi-standard support helps, but Broadcom's reported departure shows governance risk
    notes: >-
      Concentration reflects only counterparties explicitly named in the retained sources;
      commercial terms, minimum commitments, allocation rights, and termination protections
      are not public in this evidence set.
    claimRefs: [CR004, CR005, CR006, CR008, CR016]
