callouts:
  - calloutType: recommendation
    title: Investment pacing should follow proof, not announced breadth
    body: >-
      Gate further underwriting on customer samples, an independent target-scale benchmark,
      foundry and partner protections, a compliance package, and a board-approved cash runway.
      Missed late-2026 sampling without a dated recovery plan should pause investment.
    claimRefs: [CR001, CR004, CR006, CR011, CR013]
