company:
  name: Upscale AI
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Upscale AI is a founder-led AI networking infrastructure company that has
    raised $500 million and was valued at $2 billion in June 2026. The financing
    record is well supported, but public evidence remains thin on revenue,
    named production customers, current headcount, governance, and whether its
    planned products will meet announced delivery schedules.
sections:
  - id: identity-leadership-and-operating-footprint
    title: Identity, leadership, and operating footprint
    body: >-
      Upscale AI positions itself as a pure-play networking infrastructure
      vendor for heterogeneous AI compute, combining silicon, systems, software,
      and lifecycle support around open standards. Public reporting says the
      business began in 2024 as a division within Auradine before its September
      2025 public launch. Barun Kar serves as co-founder and chief executive,
      while Rajiv Khemani is co-founder and executive chairman; both bring
      company-building experience from Palo Alto Networks, Innovium, and Cavium.
      That pedigree is a credible founder-market-fit advantage, but the public
      leadership record is concentrated around the two founders and does not
      disclose a complete executive team, board, or independent directors.
      June 2026 financing materials use Santa Clara, California as the location,
      although a legal principal-office record was not found in the assigned
      evidence. Scale indicators are also dated: the company claimed more than
      100 technologists at launch, and HPCwire reported 140 employees in
      December 2025. Neither figure should be treated as current headcount as of
      the run date.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006]
    tableRefs: [TO001, TO002]
  - id: financing-stage-and-stakeholders
    title: Financing stage, investors, and commercial proof
    body: >-
      The capital history is the clearest public scale signal. Upscale announced
      more than $100 million of seed funding in September 2025, followed by a
      $200 million Series A in January 2026 that took cumulative funding above
      $300 million. A $190 million Series A-1 extension in June 2026 brought
      reported total funding to $500 million and valuation to $2 billion; Reuters
      independently reported those figures. Premji Invest led the extension,
      with NVIDIA, Salesforce Ventures, Seligman Ventures, and Temasek joining,
      while prior investors participated again. This syndicate provides capital,
      ecosystem reach, and potential customer access, but funding raised is not
      cash available and the evidence does not disclose ownership, liquidation
      preferences, board rights, debt, or secondary transactions. Upscale says
      evaluations and deployments are underway with multiple hyperscalers and
      neocloud providers, yet no retained source names a production customer or
      reports revenue, ARR, margins, customer count, or conversion from
      evaluation to recurring deployment.
    claimRefs: [CO007, CO008, CO009, CO010, CO011, CO012]
    tableRefs: [TO003]
  - id: milestones-and-execution-readiness
    title: Milestones and execution readiness
    body: >-
      The milestone sequence shows unusually rapid fundraising and widening
      product ambition, but not yet independently verified commercial maturity.
      In December 2025, HPCwire reported that the core SkyHammer ASIC was still
      in development and that the full switch was targeted for sale in the
      fourth quarter of 2026. In March 2026, a company-issued release announced
      planned scale-out systems using NVIDIA Spectrum-X silicon and
      AI-optimized SONiC software later in the year. By October, Upscale's
      resource center listed Token Fabric as a portfolio spanning scale-up,
      scale-out, and AI-native software. These announcements broaden the
      addressable product surface, but shipment timing, production reliability,
      and customer acceptance remain execution questions rather than completed
      milestones. The sector backdrop is supportive but not risk-free: Futurum
      estimated $660 billion to $690 billion of 2026 capital expenditure among
      five large US cloud and AI infrastructure providers while warning that
      infrastructure investment may run ahead of revenue realization. For
      Upscale, that creates demand opportunity alongside buyer-budget and
      deployment-timing risk.
    claimRefs: [CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
