    title: Financing is the strongest independently corroborated scale signal
    body: >-
      Reuters confirms the June 2026 extension, $500 million total funding, and
      $2 billion valuation, reducing reliance on company-only financing claims.
    claimRefs: [CO009, CO010]
  - calloutType: risk
    title: Product ambition is ahead of disclosed commercial proof
    body: >-
      Public materials describe evaluations and deployments, but retained
      evidence does not name production customers or disclose revenue, while
      independent reporting still described SkyHammer as under development.
    claimRefs: [CO011, CO012, CO013]
