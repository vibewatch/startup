  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing-gap
      missingEvidence: Comparable quotes, contract units, software and support fees, discounts, and realized customer pricing across the buyer options.
      whyItMatters: Without normalized pricing and lifecycle costs, openness cannot be translated into a defensible total-cost advantage.
      diligencePath: Request matched cluster configurations, vendor quotes, support SLAs, volume tiers, and at least two customer invoices or contracts.
      relatedQuestionRefs: [QP004]
      relatedTableRefs: [TP003]
    - type: missing-source
      severity: material
      topic: performance-proof
      missingEvidence: Independent production-scale workload benchmarks for SkyHammer and the Spectrum-X-based scale-out stack against incumbent alternatives.
      whyItMatters: Standards specifications and vendor launch targets do not establish delivered latency, utilization, reliability, or workload economics.
      diligencePath: Commission a matched-configuration benchmark and obtain telemetry from two production or late-stage pilot environments.
      relatedQuestionRefs: [QP003, QP008]
      relatedTableRefs: [TP002]
    - type: private-evidence-only
      severity: material
      topic: customer-deployments
      missingEvidence: Named production customers, deployment scale, renewal or expansion behavior, and pilot-to-production conversion by competitor.
      whyItMatters: Customer density and repeat deployments determine whether product differentiation becomes distribution power and switching cost.
      diligencePath: Review the customer pipeline and deployment roster under NDA, then conduct at least three independent customer reference calls.
      relatedQuestionRefs: [QP002, QP005, QP009]
      relatedTableRefs: [TP001]
    - type: missing-source
      severity: material
      topic: trust-posture
      missingEvidence: Comparable security certifications, compliance attestations, support performance, failure rates, and supply commitments.
      whyItMatters: Infrastructure buyers evaluate operational trust and supply assurance alongside protocol openness and headline performance.
      diligencePath: Obtain certification reports, reliability data, support SLAs, incident history, and binding supplier-capacity commitments.
      relatedQuestionRefs: [QP006, QP007]
      relatedTableRefs: [TP002]
