    columns:
      - Buying criterion
      - Upscale AI
      - Nvidia
      - Nexthop AI
      - Broadcom / internal build
    rows:
      - - Scale-up fabric
        - SkyHammer on UALink; Q4 2026 target reported
        - NVLink and NVSwitch incumbent
        - Custom AI networking focus; exact capability unknown
        - Competing technology or internal integration; exact package unknown
      - - Scale-out fabric
        - Planned Spectrum-X Ethernet systems with AI-optimized SONiC
        - Spectrum-X platform and ecosystem
        - Unknown in assigned evidence
        - Merchant or custom Ethernet path; exact offer unknown
      - - Heterogeneous compute posture
        - Explicit company objective using open standards
        - Limited room for alternative GPUs in proprietary stack, per HPCwire
        - Unknown in assigned evidence
        - Potentially configurable; unsupported by assigned product evidence
      - - Full-stack support
        - Company claims silicon, systems, software, lifecycle services
        - Integrated incumbent ecosystem
        - Unknown in assigned evidence
        - Depends on integrator and internal operating model
      - - Production proof
        - No independent workload benchmark or named production deployment retained
        - Current market dominance independently reported
        - Unknown in assigned evidence
        - Unknown on a like-for-like workload basis
    notes: >-
      Capability statements preserve whether evidence is company-issued or independently reported;
      unknown cells identify missing assigned evidence rather than negative capability.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP007, CP008]
  - id: TP003
    title: Pricing and packaging comparison
    columns:
      - Option
      - Public price or unit
      - Packaging evidence
      - Discount or contract evidence
      - Diligence implication
    rows:
      - - Upscale AI
        - Unknown
        - Full-stack systems, software, support, and lifecycle services claimed
        - Unknown
        - Obtain bill of materials, software fees, support SLA, volume tiers, and realized price
      - - Nvidia integrated stack
        - Not provided in assigned evidence
        - Proprietary accelerator and interconnect ecosystem
        - Not provided
        - Compare equivalent cluster configuration and support, not component list prices
      - - Nexthop AI
        - Unknown
        - Custom AI networking focus reported
        - Unknown
        - Request comparable quote, qualification scope, and deployment obligations
      - - Merchant/custom or internal build
        - Unknown
        - Components plus customer integration and operations
        - Unknown
        - Include engineering labor, validation, spares, software, and downtime risk
      - - Status quo extension
        - Existing spend not quantified
        - Continue current Ethernet or PCIe architecture
        - Unknown
        - Measure deferred capex against utilization loss and migration timing
    notes: >-
      No comparable list or realized prices were disclosed in the reviewed assigned sources; every
      unknown requires a vendor quote or customer contract and must not be interpreted as zero.
    claimRefs: [CP004, CP015]
figures:
  - id: FP001
    title: Evidence-constrained competitive positioning
    type: quadrant
    summary: >-
      Analyst ordinal positions compare openness/interoperability evidence (x, 1 low to 5 high) with
      commercial maturity evidence (y, 1 low to 5 high), not measured market benchmarks.
    data:
      points:
        - label: Upscale AI
          x: 5
          y: 2
          note: Open full-stack claims and 2026 launch targets, with production proof still missing.
        - label: Nvidia
          x: 2
          y: 5
          note: Proprietary integration with independently reported present market dominance.
        - label: Nexthop AI
          x: 3
          y: 2
          note: Direct, well-funded peer; product and deployment detail is sparse in assigned evidence.
        - label: Broadcom ecosystem
          x: 3
          y: 4
          note: Incumbent resources are strong, but a like-for-like package is not evidenced.
        - label: Internal build
          x: 4
          y: 3
          note: Potential vendor flexibility, offset by unquantified integration and operating burden.
        - label: Status quo
          x: 2
          y: 4
          note: Existing operational familiarity, with unquantified AI-workload performance tradeoffs.
    approximationNotes: >-
      Ordinal 1-5 scores are analyst synthesis from the assigned source set, not vendor benchmarks,
      market shares, or measured performance; sparse competitors are scored conservatively.
    claimRefs: [CP009, CP010, CP016]
callouts:
  - calloutType: risk
    title: Open standards are not yet a moat
    body: >-
      The same standards that support heterogeneous choice can lower entry barriers for incumbents
      and new vendors. Upscale needs independent production evidence and repeat deployments to turn
      architectural openness into durable switching costs.
    claimRefs: [CP008, CP010, CP016]
