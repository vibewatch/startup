company:
  name: Upscale AI
chapter:
  number: 4
  title: Financials
  summary: >-
    Upscale AI has substantial cumulative financing and a broad hardware-software-support
    portfolio, but the retained public evidence does not disclose pricing, revenue, ARR,
    gross margin, burn, runway, or customer-level economics. The financing can fund
    commercialization, yet revenue quality, margin potential, and capital adequacy remain
    un-underwritable without private financial and contract evidence.
sections:
  - id: revenue-architecture
    title: Revenue architecture is visible, but monetization is not
    body: >-
      Upscale presents a full-stack portfolio spanning silicon, systems, and software,
      including scale-up technology, Spectrum-X-based scale-out systems, an AI-optimized
      SONiC layer, and lifecycle support. That breadth creates several potential
      revenue-bearing surfaces: integrated hardware systems, embedded or separately
      licensed software, and support services. However, no retained source discloses a
      price, billing unit, contract term, software-versus-hardware mix, support attach rate,
      or revenue-recognition policy. The October Token Fabric listing shows the portfolio
      continuing to expand, while earlier reporting still described SkyHammer as a
      development-stage product. Investors therefore can map the offering stack, but
      cannot yet convert that map into a defensible revenue model.
    claimRefs: [CI001, CI002, CI003, CI004, CI011]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: commercial-traction
    title: Commercial activity remains deployment-stage rather than financially quantified
    body: >-
      The company said it would expand engineering, sales, and operations as it moved into
      commercial deployment, and later said evaluations and deployments were underway with
      multiple hyperscalers and neocloud providers. This points toward a concentrated,
      enterprise infrastructure sale with technical evaluation and deployment steps rather
      than a self-serve motion. It does not establish signed production contracts,
      recognized revenue, customer count, backlog, utilization, sales-cycle length, or
      renewal behavior. Company language such as strong early traction and customer pull is
      directionally positive, but it is not a substitute for bookings, acceptance criteria,
      named deployments, or cash collections. Pricing and channel economics therefore
      remain diligence items rather than reportable operating metrics.
    claimRefs: [CI005, CI009, CI010, CI011, CI012]
    tableRefs: [TI002]
  - id: cost-and-unit-economics
    title: Hardware development makes cost and margin evidence essential
    body: >-
      Upscale's model includes silicon, systems, software, and support, so its economics
      should not be assumed to resemble pure software. Independent reporting says
      SkyHammer is being manufactured by TSMC and was still targeted for a fourth-quarter
      2026 switch launch, introducing development, fabrication, inventory, qualification,
      and support costs before scale is demonstrated. The company claims its fabrics can
      reduce bottlenecks and improve efficiency, but the retained evidence supplies no
      measured customer savings or disclosed gross margin. SiliconANGLE separately noted
      that the company provided no performance numbers for its breakthrough-performance
      claims. Gross margin, bill of materials, working capital, capex, warranty exposure,
      CAC, payback, and support burden all remain unavailable.
    claimRefs: [CI004, CI012, CI014, CI015]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Financing extends capacity, not proof of runway
    body: >-
      The June 2026 Series A-1 added $190 million and brought reported cumulative funding to
      $500 million at a reported $2 billion valuation. Both the company release and Reuters
      say the capital is intended to scale the business and accelerate delivery, following
      earlier plans to expand engineering, sales, and operations. That is meaningful
      financing support for a capital-intensive commercialization program, but cumulative
      funding raised is not current cash available. No retained source reports cash on
      hand, monthly burn, committed purchase obligations, debt, inventory needs, tape-out
      costs, or runway. The financial verdict is therefore mixed: access to capital is a
      strength, while the absence of revenue, margin, burn, and contract evidence blocks a
      conclusion on self-sufficiency or the timing of another financing.
    claimRefs: [CI005, CI006, CI007, CI008, CI013, CI016]
tables:
  - id: TI001
    title: Revenue streams and commercialization status
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current public status
      - Revenue quality
      - Diligence ask
    rows:
      - [SkyHammer scale-up system, "Integrated ASIC and switch sale", "Per system or deployment; undisclosed", "Independent reporting targeted Q4 2026 availability", "Pre-revenue or revenue status not disclosed", "Provide orders, shipment acceptance terms, ASP, bill of materials, and gross margin"]
      - [Spectrum-X scale-out systems, "Integrated hardware and AI-optimized SONiC solution", "Per system, cluster, or contract; undisclosed", "March release planned market entry later in 2026", "No disclosed bookings or recognized revenue", "Provide signed contracts, list and realized pricing, backlog, and delivery schedule"]
      - [AI-native software, "Embedded or licensed network operating software", "License or bundled unit; undisclosed", "Software is described as part of the full-stack portfolio", "Standalone monetization and recurring mix unknown", "Separate software ARR, license terms, update obligations, and support attach"]
      - [Lifecycle services, "Deployment and ongoing support", "Service contract; undisclosed", "Announced as part of end-to-end solutions", "Attach rate, duration, and service margin unknown", "Provide service pricing, staffing model, SLA credits, renewals, and gross margin"]
    notes: "Public sources identify offerings and planned delivery, not actual prices, contract values, recognized revenue, or margin; mechanisms and units remain diligence hypotheses where marked undisclosed."
    claimRefs: [CI001, CI002, CI003, CI004, CI011]
  - id: TI002
    title: Pricing and monetization evidence
    columns:
      - Offering
      - Public price or contract model
      - List versus realized pricing
      - Evidence status
      - Required evidence
    rows:
      - [Scale-up systems, "Unavailable", "Unavailable", "Product timing reported; no commercial terms", "Price book, customer quote, discounts, acceptance milestones, and payment schedule"]
      - [Scale-out systems, "Unavailable", "Unavailable", "Portfolio and planned route to market described; no commercial terms", "System ASP, volume tiers, channel margin, implementation fees, and warranty terms"]
      - [Software and lifecycle support, "Unavailable", "Unavailable", "Capabilities described; bundling and recurring terms not disclosed", "License metric, subscription duration, support attach, renewal, and services utilization"]
    notes: "All pricing fields are unavailable in the retained public evidence; no row should be interpreted as a zero price or as proof that a component is bundled."
    claimRefs: [CI001, CI002, CI011]
  - id: TI003
    title: Unit economics and capital adequacy gaps
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - [Revenue and ARR, "Unavailable", High, "Establishes commercial scale and recurring mix", "Monthly revenue by product, ARR definition, deferred revenue, backlog, and revenue recognition policy"]
      - [Gross margin, "Unavailable", High, "Tests whether hardware, software, and support can produce an attractive blended margin", "Bill of materials, manufacturing yield, freight, warranty, cloud costs, support labor, and margin by stream"]
      - [CAC and payback, "Unavailable", High, "Enterprise evaluations may require long technical sales cycles", "Sales and marketing spend, fully loaded CAC, evaluation duration, win rate, implementation cost, and payback"]
      - [Cash burn and runway, "Unavailable", High, "Cumulative funding does not reveal current liquidity or financing timing", "Cash balance, monthly net burn, hiring plan, committed spend, minimum cash covenant, and base/downside runway"]
      - [Working capital and capex, "Unavailable", High, "Silicon and systems delivery can require inventory, deposits, tooling, and test equipment", "Supplier deposits, purchase commitments, inventory turns, capex plan, debt facilities, and customer payment terms"]
    notes: "High confidence refers to the observed absence of these values in the retained source set, not confidence in any economic outcome; unavailable values are null evidence, not zero."
    claimRefs: [CI004, CI012, CI013, CI014, CI015]
