        - id: contract
          label: Hardware, software, and support contract
          detail: "Pricing, unit, term, discount, acceptance, and support attach are undisclosed."
        - id: revenue
          label: Recognized revenue
          detail: "Revenue, ARR, backlog, and recognition policy are unavailable."
        - id: gross-profit
          label: Gross profit and cash conversion
          detail: "Gross margin, working capital, burn, and cash collections are unavailable."
    approximationNotes: "Conceptual sequence only; it contains no estimated conversion rates, values, or timing."
    claimRefs: [CI002, CI009, CI011, CI012, CI014]
callouts:
  - calloutType: risk
    title: Funding raised is not cash available
    body: >-
      Reported cumulative funding of $500 million does not disclose the October 2026 cash
      balance, burn rate, purchase commitments, debt, or runway; those inputs are required
      before treating the financing history as evidence of capital adequacy.
    claimRefs: [CI006, CI008, CI013]
