      - [Neocloud providers, "Cloud infrastructure leadership", "Network and reliability engineering", "Capacity expansion and infrastructure capex", "Pilot fabric to customer workload validation to production cluster", "Rapid capacity growth with need for supplier choice"]
      - [Large AI data-center operators, "Data-center systems leadership", "Network operations and cluster engineering", "Facility and cluster infrastructure program", "Validated design to multi-vendor integration to lifecycle support", "Heterogeneous compute and operational simplification"]
      - [Enterprise AI infrastructure programs, "Enterprise infrastructure leadership", "Platform and network teams", "Enterprise infrastructure transformation budget", "Reference architecture to constrained deployment to scale-out", "Need for supported open systems without internal integration burden"]
    notes: >-
      Buyer and user roles are evidence-based segment inferences rather than disclosed Upscale
      account data; named buyers, budget authority, cycle length, and production status remain private.
    claimRefs: [CM012, CM013, CM014, CM015]
