callouts:
  - calloutType: insight
    title: Demand is large but addressability is unproven
    body: >-
      The strongest public number is a broad infrastructure-spending envelope. Applying it
      directly to Upscale would overstate the opportunity because no retained source discloses
      the networking allocation, open-fabric share, or supplier capture rate.
    claimRefs: [CM005, CM011, CM013]
  - calloutType: risk
    title: Product timing delays proof of adoption
    body: >-
      Public launch schedules place important scale-up and scale-out availability in 2026,
      leaving qualification, production conversion, and reference-customer evidence as
      unresolved determinants of near-term market capture.
    claimRefs: [CM012, CM015]
