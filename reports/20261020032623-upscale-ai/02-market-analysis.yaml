      - ["Futurum, 2026", Alphabet, "Capital expenditure plan", "$175-$185B", "Company guidance summarized by Futurum", Medium, "No networking allocation disclosed"]
      - ["Futurum, 2026", Meta, "Capital expenditure plan", "$115-$135B", "Company guidance summarized by Futurum", Medium, "No Upscale-addressable share disclosed"]
      - ["Futurum, 2026", Microsoft, "Capital expenditure run-rate estimate", "$120B or more", "Quarterly run rate summarized by Futurum", Low, "Fiscal-year estimate, not calendar guidance"]
      - ["Futurum, 2026", Oracle, "Capital expenditure projection", "$50B", "Company projection summarized by Futurum", Medium, "No networking allocation disclosed"]
      - ["650 Group quote in Upscale announcement, decade-end", Global, "Annual AI-networking market forecast", "$100B", "Methodology not published in retained evidence", Low, "Company-hosted quote; boundary and base year unavailable"]
    notes: >-
      Values use each source's metric and period and are not additive beyond Futurum's stated
      five-provider aggregate; none establishes Upscale's TAM, SAM, SOM, or obtainable revenue.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM010, CM011]
  - id: TM003
