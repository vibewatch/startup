        - No regulator, court, patent-office or legal primary record is retained
        - Unknown
        - High
        - Unverified
        - High
        - Run counsel-led litigation, sanctions, export-control and freedom-to-operate searches
      - - 3
        - Public-sector procurement eligibility and contract compliance
        - Carahsoft channel cites SEWP V and OMNIA; agency-specific approvals and obligations are not supplied
        - Possible
        - High
        - Early and channel-led
        - Medium-high
        - Review reseller agreements, flow-down clauses, security requirements and awarded task orders
      - - 4
        - Product safety, environmental, warranty and recall exposure
        - Physical rack and custom power or cooling are documented; safety, recall and warranty data are not
        - Possible
        - Medium-high
        - Unverified
        - Medium-high
        - Obtain certifications, warranty reserves, field-return data, insurance coverage and recall procedures
    notes: >-
      Partial public-evidence enumeration as of 2026-10-20; unknown means the assigned corpus cannot establish
      status, not that the underlying risk or event is absent.
    enumerationScope:
      coverage: partial
      basis: Eight assigned public sources reviewed through 2026-10-20; primary legal and regulator records were not present.
    claimRefs: [CR005, CR008, CR012, CR016]
  - id: TR002
    title: Operational, quality and security risk register
    columns:
      - Rank
      - Failure mode
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved evidence
    rows:
      - - 1
        - Manufacturing ramp misses demand or delivery commitments
        - Medium-high
        - High
        - Series C funding earmarked for expansion
        - High
        - Capacity, backlog, lead time, acceptance and working-capital data
      - - 2
        - Full-stack defect propagates across compute, network, storage, firmware or power
        - Medium
        - High
        - Integrated ownership and open-source software
        - High
        - Field-failure, severity-one incident, patch and recovery metrics
      - - 3
        - Physical installation, service or facility-fit constraints
        - Medium
        - Medium-high
        - Rack-scale integration and partner colocation
        - Medium-high
        - Site requirements, install success, mean time to repair and logistics data
      - - 4
        - AI workload capability lags buyer requirements or incumbent bundles
        - Medium
        - Medium-high
        - Product roadmap investment is company-claimed
        - Medium-high
        - GPU roadmap, benchmark, compatibility and production-customer evidence
    notes: >-
      Likelihood and residual-exposure labels are analytical rankings based on cited public evidence; they are not
      observed incident frequencies, and no outage or quality-rate denominator was available.
    claimRefs: [CR001, CR002, CR006, CR007, CR008, CR009, CR011, CR013, CR016]
  - id: TR003
    title: Partner and dependency risk register
    columns:
      - Rank
      - Dependency
      - Counterparty or component
      - Role
      - Concentration evidence
      - Failure scenario
      - Severity
      - Mitigation and residual exposure
    rows:
      - - 1
        - Compute platform
        - AMD EPYC
        - Processor architecture and supply
        - No second-source or inventory data retained
        - Allocation, lifecycle or roadmap change delays production
        - High
        - Qualify alternates and buffers; residual high until documented
      - - 2
        - Network silicon
        - Intel Tofino 2 ASIC
        - Integrated switching
        - One named switching platform in retained evidence
        - End-of-life or supply disruption constrains new racks and spares
        - High
        - Obtain lifecycle and replacement plan; residual high
      - - 3
        - Specialist cooling supply
        - Sanyo Denki
        - Co-designed efficiency and reliability
        - Supplier named; share and alternatives undisclosed
        - Specialist part delay or quality issue affects throughput
        - Medium-high
        - Audit dual sourcing and tooling ownership; residual medium-high
      - - 4
        - Colocation and network environment
        - CoreSite SV2 and blended IP
        - Demo, evaluation and network-performance environment
        - Alternative facility coverage is undisclosed
        - Facility or connectivity issue disrupts evaluations or hosted workloads
        - Medium
        - Require portability and disaster-recovery evidence; residual medium
      - - 5
        - Public-sector route to market
        - Carahsoft and reseller partners
        - Aggregation and procurement vehicles
        - Channel economics and awarded volume are undisclosed
        - Contract, reseller or vehicle changes slow government adoption
        - Medium
        - Review termination, margin and pipeline terms; residual medium
    notes: >-
      Named dependencies come from the retained sources; concentration, contractual protections, inventory and
      substitution times are unavailable and must not be inferred from a supplier or partner mention.
    claimRefs: [CR004, CR005, CR009, CR010, CR012]
