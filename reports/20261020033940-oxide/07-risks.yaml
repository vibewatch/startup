artifact: risks
slug: oxide
runDate: 2026-10-20
company:
  name: Oxide
chapter:
  number: 7
  title: Risks
  summary: >-
    Oxide's principal public-evidence risks are manufacturing execution, a broad vertically integrated
    failure domain, specialist component and channel dependencies, and incomplete verification of legal,
    security, reliability, customer-concentration, and cash-availability exposures. The February 2026
    Series C provides financing support, but funding raised is not cash available and a low-reputation
    October report of a later Series D remains uncorroborated within the assigned evidence.
sections:
  - id: ranked-risk-posture
    title: Ranked risk posture
    body: >-
      The highest residual risk is execution across an unusually broad hardware-software boundary. Independent
      reporting describes a nine-foot, 3,000-pound rack and a design spanning compute, switching, firmware,
      control software, power and cooling; this breadth removes multi-vendor integration from the customer but
      concentrates design, qualification, manufacturing, field-service and support accountability inside Oxide.
      The February 2026 Series C was explicitly positioned to expand manufacturing and support, which mitigates
      supplier-longevity risk but does not disclose cash available, burn, working capital, warranty reserves or
      shipped-rack economics. Competitive risk is also material: Futuriom identified large incumbent alternatives
      and said Oxide's AI-processing approach was unclear. The heatmap therefore ranks manufacturing scale-up and
      reliability verification above demand narratives, with evidence maturity treated separately from claimed
      mitigation maturity.
    claimRefs: [CR001, CR002, CR006, CR007, CR008, CR009, CR013, CR016]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: regulatory-legal-and-security
    title: Regulatory, legal and security uncertainty
    body: >-
      Public-sector availability through Carahsoft, SEWP V and OMNIA establishes a route to procurement, not proof
      that Oxide holds every agency-specific authorization, security certification or contractual approval needed
      for a given deployment. Oxide's own announcement cites a hardware root of trust and an auditable open-source
      stack, but the retained corpus contains no regulator record, court record, certification audit, penetration
      test, incident report, recall notice or warranty dataset. That absence is an evidence limitation, not evidence
      that no incident, dispute or safety event exists. Legal, privacy, export-control, environmental and product-
      safety exposures should therefore remain unverified until counsel searches, certification evidence, insurance
      schedules and incident histories are reviewed. The risk register makes these unknowns explicit rather than
      assigning false probabilities.
    claimRefs: [CR005, CR012, CR016]
    tableRefs: [TR001]
  - id: dependency-concentration
    title: Supplier, facility and channel dependencies
    body: >-
      Oxide's integration strategy changes rather than eliminates third-party dependence. Independent reporting
      identifies AMD EPYC processors and Intel Tofino 2 switching silicon, while Tech Field Day's presentation
      summary identifies Sanyo Denki as a supplier involved in co-design. CoreSite's partner release says its SV2
      facility and blended IP service support Oxide's network performance and setup, and Oxide's public-sector
      route uses Carahsoft and its reseller ecosystem. None of the retained sources quantifies second-source
      coverage, inventory buffers, contractual service levels, counterparty concentration or alternative
      facilities. These dependencies are manageable only if procurement, support and disaster-recovery evidence
      shows substitution paths that match enterprise infrastructure lifetimes.
    claimRefs: [CR004, CR005, CR009, CR010, CR012]
    tableRefs: [TR003]
  - id: mitigations-monitors-and-kill-criteria
    title: Mitigations, monitors and thesis-break triggers
    body: >-
      Financing and integrated ownership are meaningful mitigants, but current public evidence is too issuer-led
      to establish residual exposure. Monitor quarterly rack orders, production capacity, shipped and accepted
      systems, backlog conversion, lead times, field-failure rates, severity-one incidents, warranty cost, gross
      margin and support response times. Require an audited bridge from funding raised to unrestricted cash and
      working-capital needs; do not treat financing headlines as runway. Thesis-break triggers are failure to
      provide independent production references, inability to qualify substitute suppliers for critical silicon
      or power components, material security or safety findings without timely remediation, or repeated missed
      delivery commitments. A low-reputation October 2026 article claims a $445 million Series D, profitability and
      a twentyfold capacity increase, but those claims should not alter the risk rating without primary,
      independently corroborated evidence.
    claimRefs: [CR002, CR003, CR013, CR014, CR015, CR016]
