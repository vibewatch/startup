    - type: missing-source
      severity: material
      topic: primary-evidence-gap
      missingEvidence: >-
        Primary regulator, court, patent, sanctions, export-control, privacy, environmental and product-safety
        records tied to Oxide and its products.
      whyItMatters: >-
        Without primary legal and regulatory evidence, current status, exposure magnitude and remediation maturity
        cannot be underwritten.
      diligencePath: >-
        Commission counsel-led federal and state searches, obtain management's litigation and regulatory schedule,
        and reconcile it to insurance, board and certification materials.
      relatedQuestionRefs: [QR001]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: reliability-and-security
      missingEvidence: >-
        Security audits, certifications, penetration tests, severity-one incident history, uptime, field-failure,
        warranty, return, repair and recall data.
      whyItMatters: >-
        A vertically integrated platform concentrates accountability, but public feature descriptions do not
        quantify reliability, security or product-quality outcomes.
      diligencePath: >-
        Review third-party audits and certifications, the complete incident register, release and patch records,
        fleet telemetry, warranty reserves and field-service cohorts.
      relatedQuestionRefs: [QR003, QR006]
      relatedTableRefs: [TR001, TR002]
    - type: private-evidence-only
      severity: material
      topic: manufacturing-and-liquidity
      missingEvidence: >-
        Audited unrestricted cash, burn, working capital, gross margin, backlog, production capacity, lead times,
        acceptance rates, supplier concentration and inventory buffers.
      whyItMatters: >-
        Funding raised is not cash available, and company or low-reputation scale claims cannot establish the
        capital needed to manufacture and support long-lived hardware.
      diligencePath: >-
        Obtain audited financial statements, bank and debt schedules, monthly manufacturing cohorts, backlog aging,
        supplier contracts and a board-approved cash and capacity plan.
      relatedQuestionRefs: [QR002, QR004, QR009]
      relatedTableRefs: [TR002, TR003]
