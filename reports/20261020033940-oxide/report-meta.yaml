companyProfile:
  summary: >-
    Oxide Computer Company builds an integrated rack-scale system that combines compute, storage, networking, and an
    open-source cloud control plane for organizations that want public-cloud operating patterns in infrastructure they
    own. The company targets compute-intensive enterprise and public-sector environments and sells systems through a
    capital purchase with an ongoing support subscription.
  founders:
    - name: Steve Tuck
      role: Co-founder and CEO
      background: Previously worked with Bryan Cantrill at Joyent on cloud infrastructure.
      claimRefs:
        - CO005
    - name: Bryan Cantrill
      role: Co-founder and CTO
      background: Previously worked with Steve Tuck at Joyent on cloud infrastructure.
      claimRefs:
        - CO006
  foundingLocation: null
  headquarters: Emeryville, California
  productSummary: >-
    A vertically integrated cloud computer delivered at rack scale, with purpose-built compute, storage, networking,
    firmware, and an open-source control plane exposed through APIs, a command-line interface, and a web console.
  customerFocus: >-
    Large enterprises, government agencies, national laboratories, financial-services firms, aerospace organizations,
    and cloud-software operators that need controlled on-premises infrastructure.
  businessModel: Upfront capital purchase of the rack-scale system plus a support subscription.
  stage: Series D
  fundingStatus: >-
