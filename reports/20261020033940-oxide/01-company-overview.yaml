company:
  name: Oxide
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Oxide is a 2019-founded Emeryville company selling an integrated rack-scale
    cloud computer for owned data centers. A $200 million Series C is confirmed
    by company-issued February 2026 releases; a later $445 million Series D and
    roughly $835 million total funding are reported only by a low-reputation
    secondary source in the assigned evidence and remain unverified.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      Oxide Computer Company was founded in 2019 and is based in Emeryville,
      California. Its product combines purpose-built compute, storage,
      networking, and open-source control software at rack scale, positioning
      the system as owned infrastructure with public-cloud-style APIs and
      self-service operation. The commercial model described at Cloud Field Day
      is a capital purchase with a support subscription, rather than a
      consumption-only public-cloud service. This narrows the practical buyer
      set: independent reporting describes the product as relevant to operators
      already running large on-premises estates, while smaller organizations
      needing only a few hundred cores are better served by public cloud or
      smaller bare-metal systems. The retained evidence verifies the product
      architecture and target use case, but does not disclose pricing, unit
      economics, revenue, or the installed-base denominator needed to measure
      commercial scale.
    claimRefs: [CO001, CO002, CO003, CO004, CO015]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      Public evidence consistently identifies Steve Tuck as co-founder and CEO
      and Bryan Cantrill as co-founder and CTO. Their prior work together at
      Joyent and direct experience operating cloud infrastructure create
      credible founder-market fit across commercial delivery and systems
      engineering. The same evidence also highlights concentration risk:
      company messaging, financing announcements, and technical presentations
      rely heavily on these two founders. The assigned source pool does not
      provide a current board roster, executive succession plan, ownership
      percentages, voting rights, or a complete leadership team. Accordingly,
      the table is a partial public enumeration rather than a claim that Oxide
      lacks other executives or directors. Investor diligence should obtain the
      board minutes, committee charters, key-person provisions, and management
      succession plan before treating governance depth as established.
    claimRefs: [CO005, CO006]
    tableRefs: [TO002]
  - id: financing-scale-and-milestones
    title: Financing, scale, and milestones
    body: >-
      The strongest financing evidence establishes a $100 million Series B in
      August 2025 and a company-announced $200 million Series C in February
      2026, led by USIT with participation from Eclipse, Riot Ventures, Jane
      Street, and others. Oxide said the Series C would support manufacturing,
      product development, and customer support. A low-reputation Dev.to post
      later reported a $445 million Series D led by Eclipse on October 9, 2026,
      roughly $835 million of total funding, profitability, and a manufacturing
      ramp; none of those later claims is corroborated by another retained
      source, so they are not used as verified cover metrics. Separately, the
      September 2026 Carahsoft partnership opened named public-sector
      procurement channels, while Tech Field Day and Futuriom describe federal,
      financial-services, cloud-SaaS, Lawrence Livermore, and CoreWeave use
      cases. These are useful demand signals, not a customer count, revenue
      measure, backlog figure, or proof of broad adoption.
    claimRefs: [CO007, CO008, CO009, CO010, CO011, CO012, CO013, CO014, CO016]
    tableRefs: [TO003]
    figureRefs: [FO001]
