schemaVersion: "report-v2"
artifact: financials
slug: oxide
runDate: 2026-10-20
company:
  name: Oxide
chapter:
  number: 4
  title: Financials
  summary: >-
    Oxide says it reached profitability in 2026 while independent reporting places
    revenue in the hundreds of millions, but exact revenue, gross margin, cash, burn,
    runway, pricing, backlog, and revenue mix remain undisclosed. The $445 million
    Series D appears designed primarily to fund components and manufacturing capacity,
    making working-capital conversion and delivery execution central to underwriting.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: >-
      Public evidence points to a hybrid hardware-and-support model rather than a
      conventional pure-software model. Tech Field Day describes a capital-expenditure
      purchase paired with a support subscription for updates and maintenance, while
      Oxide markets an integrated rack-scale system rather than separately priced
      compute, storage, networking, and control-plane components. That structure can
      create a large upfront system sale and a potentially recurring support stream,
      but no retained source discloses list price, realized average selling price,
      subscription rate, revenue recognition policy, or the mix between systems and
      support. Forbes reported revenue in the hundreds of millions, up from single-digit
      millions 12 months earlier, citing a person familiar with the company; Oxide
      declined to provide an exact figure. The growth signal is material, but it is
      neither audited revenue nor ARR and cannot establish revenue quality by itself.
    claimRefs: [CI006, CI010, CI014]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: go-to-market
    title: GTM motion and sales-efficiency proxies
    body: >-
      The visible motion is enterprise-led and channel-assisted. Oxide's Carahsoft
      partnership opens reseller access and named public-sector contract vehicles,
      while the product is positioned as deployable within hours rather than as a
      multi-vendor integration project. Those facts may reduce procurement and
      implementation friction, but they do not reveal sales-cycle length, quota
      productivity, channel discounts, reseller fees, customer-acquisition cost, or
      payback. Company-provided customer economics are directionally attractive:
      Forbes quotes a claimed greater-than-70% cost reduction for one defense-technology
      customer and a six-cent-per-hour Oxide workload comparison with 26 cents on AWS.
      These are individual company claims, not disclosed contract pricing or a
      representative cohort, so they should be tested against invoices and normalized
      total-cost-of-ownership models before being used as a sales-efficiency proxy.
    claimRefs: [CI008, CI009, CI011, CI012]
  - id: cost-and-capital
    title: Cost structure, capacity, and capital adequacy
    body: >-
      Oxide's financing disclosures identify the economic bottleneck more clearly than
      its accounting. The company says manufacturing capacity increased 20-fold in the
      preceding 12 months, yet demand still exceeded production; it also says the
      Series D will secure components, expand manufacturing, and serve new and existing
      customers. That is consistent with a working-capital-intensive model in which
      cash is committed to materials and production before systems are delivered.
      Oxide announced $445 million of Series D financing after a $200 million Series C,
      and said it reached profitability earlier in 2026. Neither claim establishes
      current cash available, operating cash flow, free-cash-flow burn, runway, debt,
      purchase commitments, inventory turns, backlog conversion, or gross margin.
      Funding raised therefore should not be treated as cash on hand, and accounting
      profitability should not be treated as proof of positive cash generation.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI013, CI015]
    tableRefs: [TI003]
  - id: financial-verdict
    title: Financial verdict and underwriting blockers
    body: >-
      The evidence supports a stronger operating position than in a typical
      pre-revenue hardware startup: Oxide and an independent report both describe
      profitability, Forbes reports substantial revenue scale, and the latest financing
      directly addresses constrained production. The quality of that position remains
      unquantifiable. Revenue concentration, system-versus-support mix, realized
      pricing, warranty and service burden, component exposure, inventory aging, and
      gross margin are all unavailable. Product scope also matters financially:
      Forbes reported that the current racks did not include GPUs, limiting fit for
      complex training workloads even as AI demand drives the investment narrative.
      The investable conclusion is therefore positive commercial momentum with a
      capital-intensive conversion risk. Underwriting should remain conditional on
      audited financials, backlog and shipment cohorts, customer-level gross profit,
      cash-flow reconciliation, and financing obligations.
    claimRefs: [CI002, CI004, CI006, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams and quality
    columns:
      - Stream
      - Mechanism
      - Unit / contract basis
      - Public status
      - Revenue quality
      - Diligence ask
    rows:
      - - Cloud Computer system sale
        - Customer purchases an integrated rack-scale hardware and software system
        - CapEx system purchase; specific price unavailable
        - Active, but exact systems revenue and mix are undisclosed
        - Upfront and dependent on manufacturing and delivery
        - Provide contract value, acceptance terms, revenue recognition, and shipment cohorts
      - - Support subscription
        - Updates and maintenance attached to the owned system
        - Subscription term and rate undisclosed
        - Existence reported; price and mix unavailable
        - Potentially recurring, but retention and margin are unknown
        - Provide attach rate, renewal rate, ARR, gross margin, and deferred revenue
      - - Expansion and follow-on capacity
        - Additional systems or capacity for new and existing customers
        - Order size and expansion cadence unavailable
        - Company says financing will serve new and existing customers
        - Backlog may add visibility, but neither backlog nor orders are disclosed
        - Provide backlog, cancellation terms, delivery schedule, and expansion cohorts
      - - Public-sector reseller channel
        - Carahsoft reseller network and named procurement vehicles
        - Contract-vehicle pricing and channel fees unavailable
        - Available through SEWP V and OMNIA Partners vehicles
        - Distribution access is visible; realized channel economics are not
        - Provide channel-sourced pipeline, reseller discount, fee, and sales-cycle data
    notes: >-
      Public-source snapshot as of 2026-10-20; no retained source discloses audited
      revenue mix, realized pricing, contract terms, or retention.
    claimRefs: [CI004, CI010, CI011, CI014]
  - id: TI002
    title: Pricing and monetization evidence
    columns:
      - Item
      - Public value
      - Evidence classification
      - Limitation
      - Underwriting use
    rows:
      - - Cloud Computer list price
        - Unavailable
        - Public evidence gap
        - No retained source publishes a rack price or configuration schedule
        - Do not estimate average selling price without contracts
      - - Support subscription price
        - Unavailable
        - Public evidence gap
        - Subscription existence is reported, but term, rate, and attach are not
        - Request subscription invoices and renewal cohorts
      - - Illustrative workload cost
        - "$0.06 per hour on Oxide versus $0.26 on AWS"
        - Company claim reported by Forbes
        - One workload; denominator, configuration, utilization, and full TCO are undisclosed
        - Treat only as a hypothesis for normalized workload testing
      - - Illustrative customer savings
        - Greater than 70%
        - Company claim reported by Forbes
        - One unnamed defense-technology customer; baseline and period are undisclosed
        - Require customer invoice and workload-level corroboration
    notes: >-
      Values are company claims or unavailable fields, not a public price list or
      evidence of realized revenue, margin, or representative customer savings.
    claimRefs: [CI008, CI009, CI010, CI014]
  - id: TI003
    title: Unit economics and capital-adequacy scorecard
    columns:
      - Metric
      - Public value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Revenue scale
        - Hundreds of millions; exact amount withheld
        - Medium; third-party report citing an unnamed source
        - Establishes possible scale but not revenue quality
        - Obtain audited revenue by system, support, customer, and geography
      - - Profitability
        - Company says reached earlier in 2026
        - Medium; company claim also reported by Forbes
        - Signals operating progress but not cash generation
        - Reconcile operating income, EBITDA, and free cash flow
      - - Gross margin
        - Unavailable
        - Low
        - Core test of hardware and support economics
        - Provide product, support, warranty, freight, and channel gross margin
      - - Manufacturing capacity
        - Company says 20x increase over the preceding 12 months
        - Medium; company-issued disclosure
        - Indicates rapid scaling and potential execution stress
        - Provide units, yield, supplier capacity, utilization, and on-time delivery
      - - Working-capital requirement
        - Series D intended to secure components and increase manufacturing
        - Medium; company-issued disclosure
        - Inventory and supplier commitments can consume financing before revenue
        - Provide inventory turns, deposits, purchase commitments, and cash conversion cycle
      - - Cash, burn, runway, and debt
        - Unavailable
        - Low
        - Determines financing dependency despite the large round
        - Provide current cash, monthly free-cash-flow burn, debt, covenants, and runway
    notes: >-
      Public values preserve their stated basis; funding raised is not treated as cash
      available, and reported profitability is not treated as cash-flow evidence.
    claimRefs: [CI001, CI002, CI003, CI005, CI006, CI015]
figures:
  - id: FI001
    title: Revenue and working-capital conversion chain
    type: flow
    summary: >-
      Public evidence shows the sequence from demand to component funding, production,
      delivery, system revenue, and support, while amounts and gross profit remain unknown.
    data:
      nodes:
        - label: Customer demand
          detail: Company says demand exceeds current production capacity.
        - label: Working capital
          detail: Series D is intended in part to secure components.
        - label: Components and assembly
          detail: Integrated rack hardware requires manufacturing before delivery.
        - label: Production capacity
          detail: Company says capacity increased 20x over the preceding 12 months.
        - label: Delivered system sale
          detail: CapEx purchase price and recognition terms are not public.
        - label: Support and gross profit
          detail: A support subscription is reported; attach, renewal, and margin are unavailable.
    approximationNotes: >-
      Ordered operating sequence only; node widths do not represent value, conversion,
      timing, margin, or cash-flow magnitude.
    claimRefs: [CI003, CI004, CI005, CI010, CI012]
callouts:
  - calloutType: recommendation
    title: Gate underwriting on cash conversion, not financing headlines
    body: >-
      Request audited financials, backlog and shipment cohorts, inventory and supplier
      commitments, customer-level gross profit, support renewal data, and a bridge from
      accounting profit to free cash flow before assigning a durable margin or runway.
    claimRefs: [CI001, CI002, CI004, CI005, CI015]
