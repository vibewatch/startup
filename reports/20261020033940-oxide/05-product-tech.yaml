company:
  name: Oxide
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Oxide delivers a vertically integrated, rack-scale private-cloud system whose
    hardware, open-source software, networking, storage, and control plane are
    designed as one product. Public evidence supports a differentiated operating
    model, but independent performance validation, security certifications, service
    levels, and consistent capacity specifications remain material diligence gaps.
sections:
  - id: product-and-workflow
    title: Product definition and customer workflow
    body: >-
      Oxide's product is not a server appliance or a separately licensed hypervisor;
      it is a rack-scale system sold as an owned private-cloud substrate. The company
      describes unified compute, storage, networking, and control software, while
      Arctiq describes a customer workflow in which operators provision virtual
      machines, elastic block storage, and VPC-style networking through an API, web
      console, or SDK. Oxide's launch material says the rack arrives with the software
      needed to operate cloud services and requires no assembly, with a claimed path
      from rack installation to developer availability in hours. Tech Field Day's
      demonstration adds practical evidence of projects, images, disks, snapshots,
      networks, and Terraform-based provisioning, although this remains a hosted
      vendor demonstration rather than a production benchmark.
    claimRefs: [CE001, CE002, CE003, CE004, CE009, CE011]
    tableRefs: [TE001, TE002]
  - id: architecture-and-operating-model
    title: Architecture and operating model
    body: >-
      The architecture spans physical rack design, compute sleds, embedded control,
      host virtualization, distributed storage, networking, and a multi-tenant control
      plane. Arctiq identifies public components including Hubris and Humility for
      embedded control, Helios and Propolis for the host and virtual-machine layer,
      Omicron for the control plane, and Crucible for distributed block storage.
      Tech Field Day reports that logical silos separate compute, memory, and storage
      resources and receive distinct API endpoints. Capacity descriptions require
      reconciliation: Arctiq describes 32 compute sleds in the current-generation
      rack, while TMC Insight reports capacity for as many as 64 servers. Until Oxide
      supplies a current bill of materials and definitions, those figures should not
      be treated as directly comparable.
    claimRefs: [CE005, CE006, CE007, CE009, CE010]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-and-maturity
    title: Differentiation, maturity, and roadmap
    body: >-
      The principal differentiation is full-stack ownership rather than any single
      component: custom rack engineering, an auditable open-source software stack,
      API-first operations, and freedom from third-party virtualization licensing.
      Arctiq relays Oxide's claims of a 55% power-efficiency improvement and roughly
      twelve-fold cooling-efficiency improvement, but provides no underlying
      independent benchmark dataset, workload definition, or test protocol. The same
      review identifies a fixed rack-scale capital commitment and a young ecosystem
      as fit constraints. A low-reputation DEV Community post reports GPU-capable
      sleds on the roadmap; without an assigned official technical source, timing and
      specifications remain unverified and should not be underwritten as a shipping
      capability.
    claimRefs: [CE005, CE008, CE012, CE013, CE015]
  - id: trust-reliability-and-diligence
    title: Trust, reliability, and technical diligence
    body: >-
      Oxide and Carahsoft claim a hardware root of trust, auditable open-source
      software, and removal of third-party virtualization-license dependency. Those
      design choices can improve inspectability, but the assigned evidence does not
      establish external security certifications, vulnerability-management response
      times, availability service levels, fleet failure rates, upgrade success rates,
      or independently measured power and cooling performance. TMC Insight also flags
      the operational questions created by rack density, including power, cooling,
      and cabling requirements, and says buyers will need concrete efficiency proof.
      Technical diligence should therefore move from architecture narratives to
      current configuration records, third-party test results, security-control
      evidence, support metrics, and reference-customer operating data.
    claimRefs: [CE008, CE010, CE012, CE013, CE014]
