  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: efficiency
      missingEvidence: >-
        Independent workload-normalized tests of compute performance, energy use,
        cooling demand, density, and total cost against stated comparison systems.
      whyItMatters: >-
        Public efficiency percentages cannot support underwriting without test
        conditions, denominators, comparable configurations, and reproducible results.
      diligencePath: >-
        Obtain benchmark protocols and raw results, then commission a third-party test
        against the buyer's incumbent rack under equivalent workloads and facility limits.
      relatedQuestionRefs: [QE009]
      relatedTableRefs: [TE002, TE003]
    - type: missing-source
      severity: material
      topic: security
      missingEvidence: >-
        Current third-party security certifications, penetration-test scope, incident
        response targets, availability SLA, fleet reliability, and upgrade-success records.
      whyItMatters: >-
        Architecture and open-source visibility do not by themselves establish control
        effectiveness, tenant isolation, operational reliability, or support quality.
      diligencePath: >-
        Request certification reports, recent penetration-test summaries, support and
        incident metrics, uptime records, and reference calls with production operators.
      relatedQuestionRefs: [QE010]
      relatedTableRefs: [TE001, TE003]
    - type: conflicting-data
      severity: material
      topic: rack-capacity
      missingEvidence: >-
        A current official configuration sheet that reconciles the 32-compute-sled and
        up-to-64-server descriptions and defines processor, memory, and power boundaries.
      whyItMatters: >-
        Unreconciled capacity terminology can distort density, pricing, power, and
        performance comparisons.
      diligencePath: >-
        Obtain the current product bill of materials and configuration guide directly
        from Oxide and reconcile each public capacity figure to a named generation.
      relatedQuestionRefs: [QE002]
      relatedTableRefs: [TE001, TE003]
