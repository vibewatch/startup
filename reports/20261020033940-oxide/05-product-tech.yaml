      - [Hubris and Humility, Embedded controller operating system and debugger, Components identified in the public open-source stack, Service processors and controller hardware, Public code does not establish fleet reliability]
      - [Helios and Propolis, Host operating system and VM lifecycle, Components identified by Arctiq, bhyve primitives and supported guest systems, Compatibility and upgrade evidence is incomplete]
      - [Crucible and integrated networking, Block storage and virtual networking services, Storage and VPC-style services described publicly, Media durability switching silicon and failure recovery, No assigned durability or failover benchmark]
      - [Omicron control plane and silos, API-driven resource and tenant management, Console and Terraform demonstration with distinct silo endpoints, Identity policy telemetry and control-plane availability, No assigned SLA or isolation-assurance report]
    notes: >-
      The component map uses public descriptions, not a complete current design
      specification; dependencies and risks identify diligence requirements rather
      than confirmed defects.
    claimRefs: [CE002, CE005, CE008, CE009, CE010, CE011, CE014]
figures:
  - id: FE001
    title: Oxide product architecture stack
    type: stack
    summary: >-
      The public architecture integrates six operating layers from the physical rack
      through self-service tenancy rather than assembling separately managed products.
    data:
      layers:
        - label: Physical rack
          detail: Integrated mechanics, power distribution, cooling, and blind-mate sled installation.
          items: [Rack enclosure, Power and cooling]
        - label: Compute
          detail: AMD-based compute sleds provide the physical resources exposed to workloads.
          items: [Compute sleds, Memory and local NVMe]
        - label: Embedded control
          detail: Hubris and Humility support low-level controller operation and debugging.
          items: [Hubris, Humility]
        - label: Host and virtualization
          detail: Helios and Propolis provide the host and virtual-machine lifecycle layer.
          items: [Helios, Propolis]
        - label: Data services
          detail: Crucible and integrated networking expose block storage and VPC-style connectivity.
          items: [Crucible storage, Virtual networking]
        - label: Cloud control and access
          detail: Omicron, silos, APIs, CLI, console, SDK, and Terraform expose self-service operations.
          items: [Omicron and silos, API and automation surfaces]
    approximationNotes: >-
      This is a functional synthesis of named public components, not a complete bill
      of materials, security boundary diagram, or assertion of implementation detail.
    claimRefs: [CE001, CE005, CE009, CE010, CE012]
callouts:
  - calloutType: risk
    title: Integration is both the moat and the diligence burden
    body: >-
      Full-stack ownership can reduce multi-vendor friction, but it concentrates
      hardware, software, support, upgrade, and supply-chain execution in one young
      vendor. Require benchmark protocols, reliability histories, security-control
      evidence, and current configuration documentation before treating architectural
      differentiation as proven operating advantage.
    claimRefs: [CE008, CE013, CE014]
