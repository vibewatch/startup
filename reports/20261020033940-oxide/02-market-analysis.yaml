    columns: ["Segment", "Likely buyer", "Evidenced user", "Payer or budget owner", "Workflow", "Adoption trigger"]
    rows:
      - ["Financial services", "Infrastructure leadership; exact role undisclosed", "Developers and cloud-infrastructure teams", "Enterprise infrastructure budget; not source-verified", "Owned private-cloud provisioning", "Control, latency, security, and predictable capacity"]
      - ["Government", "Agency infrastructure and acquisition teams", "Developers, cloud teams, and mission workloads", "Agency IT program via procurement vehicle", "Modernize owned infrastructure through Carahsoft resellers", "Data sovereignty, operational control, and established contract access"]
      - ["National laboratories", "Research-computing leadership; exact role undisclosed", "High-performance and data-intensive workload teams", "Research-computing budget; not source-verified", "Operate compute-heavy workloads in controlled facilities", "Dedicated access to compute, memory, storage, and networking"]
      - ["Aerospace", "Infrastructure and security leadership; exact role undisclosed", "Engineering and platform teams", "Enterprise infrastructure budget; not source-verified", "Run sensitive and compute-intensive applications", "Security, latency, sovereignty, and owned operations"]
      - ["Other compute-intensive enterprises", "CIO or infrastructure organization; hypothesis to validate", "Application developers and platform operators", "Infrastructure-capital budget; not source-verified", "Replace ticket-driven provisioning with APIs and self-service", "Cloud-like agility without transferring infrastructure ownership"]
    notes: "Named verticals and user workflows are source-backed; roles labeled likely and all private-sector payer or budget-owner entries are analyst hypotheses requiring customer validation."
    claimRefs: ["CM002", "CM003", "CM005", "CM006"]
