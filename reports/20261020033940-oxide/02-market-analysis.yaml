chapter:
  number: 2
  title: "Market Analysis"
  summary: "Oxide addresses a narrow enterprise-owned cloud-infrastructure market: organizations that want public-cloud operating patterns but require physical control of rack-scale compute. The assigned evidence supports demand drivers, target verticals, procurement paths, and production constraints, but it does not support a defensible dollar TAM, SAM, SOM, CAGR, customer count, or installed-base estimate."
sections:
  - id: "market-boundary"
    title: "Market boundary and substitutes"
    body: >-
      Oxide's relevant market is not all cloud spending or all data-center hardware. It is the
      intersection of on-premises infrastructure, private-cloud operations, and integrated
      rack-scale systems: a buyer acquires purpose-built compute, storage, networking, and a
      software control plane as one owned system. The boundary excludes ordinary public-cloud
      consumption, software-only private-cloud layers installed on separately sourced servers,
      and general server purchases without a cloud operating model. Adjacent solutions include
      hyperscaler extensions such as AWS Outposts and software-defined infrastructure such as
      Nutanix; the status quo is a multivendor stack assembled and operated by the enterprise.
      This narrow definition matters because a broad cloud-market estimate would include spend
      that Oxide cannot address with its current full-rack product and ownership model.
    claimRefs: ["CM001", "CM008", "CM009", "CM010"]
    tableRefs: ["TM001"]
    figureRefs: ["FM001"]
  - id: "buyers-and-demand"
    title: "Buyers, users, and demand formation"
    body: >-
      The evidenced buyer universe spans financial services, government, national laboratories,
      aerospace, and other compute-intensive organizations. Developers and cloud-infrastructure
      teams are the clearest users because the product exposes self-service compute, storage, and
      networking through APIs, a CLI, and a web console. Public-sector access is more concrete
      than the private-sector purchasing path: Oxide says Carahsoft is its government aggregator
      and identifies SEWP V and OMNIA Partners contract vehicles. Demand is driven by data
      residency, latency, regulatory obligations, capacity control, and the desire for
      cloud-style automation without surrendering infrastructure ownership. Agentic-AI and
      data-intensive workloads may amplify that demand, but the evidence does not quantify how
      much of the current order book is AI-related.
    claimRefs: ["CM002", "CM003", "CM004", "CM005", "CM006"]
    tableRefs: ["TM003"]
  - id: "sizing-and-adoption"
    title: "Evidence-constrained sizing and adoption"
    body: >-
      None of the assigned sources supplies a market value, CAGR, unit population, customer
      count, rack shipments, backlog value, or price that can anchor a bottom-up estimate. The
      defensible sizing output is therefore a hierarchy of progressively narrower addressable
      populations with every dollar value left unavailable. Demand exceeding production and a
      company-reported twentyfold increase in manufacturing capacity are useful adoption signals,
      not market size and not revenue growth. They also expose the central constraint: an
      integrated hardware vendor must finance components, supplier coordination, factory
      throughput, quality control, and inventory before delivery. Buyers must additionally
      compare electricity, cooling, staffing, support, financing, spare capacity, and refresh
      cycles against public-cloud elasticity. The investment case needs shipment, migration,
      utilization, renewal, and reference-customer evidence before translating this demand signal
      into a market-share or valuation assumption.
    claimRefs: ["CM007", "CM011", "CM012", "CM013", "CM014"]
    tableRefs: ["TM002"]
