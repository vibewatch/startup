      - ["Private-cloud modernization", "Replacement of fragmented on-premises infrastructure with API-driven operations", "Software-only virtualization layered on unrelated hardware", "CIO, infrastructure, and platform organizations", "Core workflow, but only where a full-rack replacement is feasible"]
      - ["Sovereign and regulated computing", "Infrastructure retained in an owned data center or colocation environment", "Unrestricted workloads adequately served by public cloud", "Government and regulated-enterprise procurement", "Control, data location, and procurement requirements are adoption triggers"]
      - ["Compute-intensive and AI-adjacent workloads", "CPU, memory, networking, storage, and data services surrounding compute-heavy applications", "A general claim to replace every GPU training platform", "Infrastructure and data-platform teams", "Adjacency supported by workload positioning, not a quantified AI TAM"]
      - ["Alternatives and status quo", "AWS Outposts, Nutanix-style software-defined infrastructure, and multivendor internal builds", "Unrelated SaaS and end-user computing", "Enterprise architecture and sourcing teams", "Sets the actual comparison set and constrains a broad cloud-market narrative"]
    notes: "Boundary is synthesized from the retained sources; excluded categories are analytical limits, not publisher market definitions, and no spend values are available."
    claimRefs: ["CM001", "CM003", "CM006", "CM008", "CM009", "CM010"]
