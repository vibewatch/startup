evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cover-metrics
    missingEvidence: >-
      Audited revenue, ARR, backlog, gross margin, cash flow, valuation, customer count, customer concentration,
      headcount, and operating locations.
    whyItMatters: >-
      These metrics determine commercial scale, capital efficiency, delivery capacity, and whether financing terms are
      justified.
    diligencePath: >-
      Obtain audited financials, monthly management accounts, the current cap table, customer cohort export, backlog
      schedule, and employee roster.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance-and-stakeholders
    missingEvidence: >-
      Complete executive and board rosters, committee membership, succession coverage, ownership percentages,
      preferences, voting rights, and investor information rights.
    whyItMatters: >-
      Public evidence is founder-heavy and cannot establish governance depth, control allocation, or the full key-person
      risk.
    diligencePath: >-
      Review the capitalization table, charter, voting agreements, board and committee materials, executive roster, and
      succession plan.
    relatedQuestionRefs:
      - QO002
      - QO005
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: funding
    missingEvidence: >-
      Primary confirmation and closing documents for the reported October 2026 Series D, its $445 million size,
      approximately $835 million cumulative funding, valuation, investor list, and preference stack.
    whyItMatters: >-
      The only retained Series D report is low reputation, so treating it as verified would overstate stage,
      capitalization, and available resources.
    diligencePath: >-
      Obtain Oxide's original financing announcement, signed stock-purchase agreement, wire schedule, updated charter,
      and fully diluted cap table.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      A publisher-defined market denominator or a bottom-up count of eligible sites, rack requirements, realized
      pricing, and replacement cycles.
    whyItMatters: >-
      Without a compatible denominator, a dollar TAM, SAM, SOM, growth rate, and market-share forecast would be invented
      rather than evidence-based.
    diligencePath: >-
      Obtain management's market model and pricing, then triangulate it against independent infrastructure-spend data
      and customer-site counts using the same category boundary.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-segments
    missingEvidence: >-
      Customer-level decision makers, users, contract signers, budget owners, deployment sizes, sales-cycle lengths, and
      referenceable adoption outcomes by segment.
    whyItMatters: >-
      Named verticals do not establish who controls budgets, how procurement converts, or whether usage expands after
      installation.
    diligencePath: >-
      Review CRM pipeline and executed contracts, and conduct reference calls with at least one buyer and one operating
      user in each priority segment.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: adoption-proof
    missingEvidence: >-
      Racks shipped, backlog units and value, delivery lead times, migrations completed, production utilization, renewal
      or expansion behavior, and customer concentration.
    whyItMatters: >-
      The manufacturing-capacity claim cannot distinguish durable adoption from a temporary supply bottleneck or a
      concentrated order book.
    diligencePath: Reconcile order, shipment, acceptance, support, and expansion cohorts to audited revenue and customer records.
    relatedQuestionRefs:
      - QM006
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Current Oxide and competitor quotes with hardware, software, support, deployment, discounts, and contract duration
      separated.
    whyItMatters: >-
      Without matched commercial terms, the report cannot compare total cost or determine whether architectural
      integration earns a pricing premium.
    diligencePath: >-
      Request three recent redacted Oxide contracts and matched five-year proposals from an OEM-HCI stack and a
      hyperscaler on-premises offering.
    relatedQuestionRefs:
      - QP003
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: moat-durability
    missingEvidence: >-
      Independent workload benchmarks, customer win-loss records, renewal behavior, multi-homing rates, and measured
      switching costs.
    whyItMatters: >-
      Product specifications and company positioning do not establish sustained performance, retention, or defensibility
      against incumbent response.
    diligencePath: >-
      Interview reference and lost customers, inspect benchmark methodology and raw results, and reconcile renewal
      cohorts by competitor displaced.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP002
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      The primary SEC filing and company announcement needed to reconcile the date, round label, investor set, and
      cumulative funding total for the $445 million financing.
    whyItMatters: >-
      Financing capacity informs execution risk, but inconsistent secondary accounts should not be converted into a
      definitive capital chronology.
    diligencePath: >-
      Review the original Form D and Oxide's original financing announcement, then reconcile them to the cap table and
      cash receipts.
    relatedQuestionRefs:
      - QP007
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Current system configuration prices, realized contract prices, support rates, discounts, channel fees, payment
      schedules, and acceptance terms.
    whyItMatters: >-
      Without contract pricing and terms, average selling price, revenue recognition, discounting, and payback cannot be
      underwritten.
    diligencePath: Review a representative contract and invoice sample by customer cohort, configuration, channel, and geography.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
