            - Carahsoft
            - Reseller partners
            - Contract vehicles
        - id: deployment
          label: 安装与配置
          detail: Oxide 声称一体化系统交付后数小时内即可投入运行，但公开资料没有客户层面的部署时间。
          touchpoints:
            - Rack installation
            - API, CLI, and console provisioning
        - id: realized-use
          label: 工作负载使用
          detail: 公司展示的案例称，联邦工作流程更快，云软件即服务部署也更靠近客户资产，但没有独立量化基线。
          touchpoints:
            - Federal infrastructure teams
            - Cloud-SaaS platform teams
        - id: expansion
          label: 重复下单与扩张
          detail: 积压订单和供应压力指向需求，但公开来源没有披露续订、留存、扩张批次或第二台机架的购买率。
          touchpoints:
            - Support experience
            - Additional rack orders
            - Renewal and expansion review
    approximationNotes: 该序列是根据公开触点拼出的分析性客户旅程，不是实测漏斗；转化率、时长和各阶段人群规模均未知。
