chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Oxide Computer Company 成立于 2019 年，总部位于加州 Emeryville。其产品在机架级整合定制计算、存储、网络和开源控制软件，把系统定位为由客户拥有、具备公有云式 API
              和自助运维能力的基础设施。Cloud Field Day 描述的商业模式是资本采购加支持订阅，而非按用量计费的公有云服务。实际买家因此更窄：独立报道认为该产品更适合已经运营大型本地基础设施的客户，而只需几百个
              CPU 核的小型组织更适合公有云或更小的裸金属系统。现有证据验证了产品架构和目标用例，但未披露定价、单位经济、收入或衡量商业规模所需的装机基数。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO015
