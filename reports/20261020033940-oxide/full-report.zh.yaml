        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              公开证据一致将 Steve Tuck 列为联合创始人兼 CEO，将 Bryan Cantrill 列为联合创始人兼 CTO。两人在 Joyent              
              的共同经历及直接运营云基础设施的经验，构成覆盖商业交付和系统工程的可信创始人—市场匹配。同一批证据也提示集中度风险：公司信息、融资公告和技术演示都高度依赖这两位创始人。指定来源未提供最新董事会名单、高管继任计划、持股比例、投票权或完整领导团队。因此，表格只是部分公开列举，并非声称
              Oxide 没有其他高管或董事。在把治理深度视为已确立之前，投资人应取得董事会会议纪要、委员会章程、关键人条款和管理层继任计划。
