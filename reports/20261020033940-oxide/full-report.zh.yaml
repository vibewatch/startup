              - CM010
              - CM013
      - number: '2.2'
        title: 买家、用户与需求形成
        blocks:
          - type: paragraph
            body: >-
              有证据支持的买家范围包括金融服务、政府、国家实验室、航空航天及其他计算密集型组织。开发者和云基础设施团队是最明确的用户，因为产品通过 API、CLI 和 Web
              控制台提供自助计算、存储和网络。公共部门的进入路径比私营部门更具体：Oxide 称 Carahsoft 是其政府聚合商，并列出 SEWP V 和 OMNIA Partners
              合同载体。需求来自数据驻留、延迟、监管义务、容量控制，以及不放弃基础设施所有权而获得云式自动化的诉求。Agentic-AI 和数据密集型负载可能放大需求，但证据没有量化当前订单中有多少与 AI 相关。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM006
      - number: '2.3'
        title: 受证据约束的市场规模与采用
        blocks:
          - type: paragraph
            body: >-
              指定来源没有提供可支撑自下而上估算的市场金额、CAGR、设备基数、客户数、机架出货量、积压订单金额或价格。因此，唯一可辩护的规模输出是逐层收窄的可服务人群，而所有美元金额均记为不可得。需求超过产能及公司报称制造能力增长
              二十倍，是采用信号，不是市场规模，也不是收入增长；它们同时暴露出核心约束：集成式硬件厂商必须在交付前为零部件、供应商协同、工厂吞吐、质量控制和库存提供资金。买家还要把电力、制冷、人力、支持、融资、备用容量和更新周期与公有云弹性比较。要把需求信号转成市场份额或估值假设，投资判断还需要出货、迁移、利用率、续约和参考客户证据。
