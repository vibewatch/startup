              二十倍，而需求继续超过供给。这些说法强化了扩张逻辑，但没有披露出货系统数量、确认收入、积压订单转化、营运资金强度，或新资本是增发、老股转让、类债务还是高优先级。审阅的当前融资来源披露了轮次规模和具名参与者，但没有披露投后估值、每股价格、稀释、清算优先权或治理权。因此，入场纪律应写成尽调条件：在取得所有权、优先权和运营证据前，不应对目标回报作投资判断。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV007
              - CV008
              - CV014
              - CV016
      - number: '8.3'
        title: 情景框架与可比限制
        blocks:
          - type: paragraph
            body: >-
              公开证据支持按里程碑设定情景，不支持可辩护的估值区间。乐观情景要求独立确认盈利、积压订单持续转化并在不侵蚀利润率的情况下扩大产量；基准情景假设新资本支持交付，但价格和单位经济仍未验证；悲观情景聚焦生产、竞争和
              AI 负载执行风险。Futuriom 将 HPE、Dell 和 Supermicro 列为相关私有云竞争者，并称在其 2025 年评测中 Oxide 的 AI
              处理路径不清晰。这些名称用于界定产品竞争，不是估值基准：没有保留来源提供可归一化到 Oxide 的可比交易倍数、私募轮条款或并购结果。因此，数值概率和估值区间记为不可得，而不是估算值。
            claimRefs:
              - CV005
              - CV009
              - CV010
              - CV011
              - CV013
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV008
              - CV011
              - CV014
              - CV015
      - number: '8.4'
        title: 退出准备、尽调要求与论点破裂
        blocks:
          - type: paragraph
            body: >-
              Carahsoft 关系扩大了 Oxide 的公共部门采购路径，Series D
              材料则点名金融服务、政府、国家实验室、航空航天及其他计算密集型行业。这些分销证据拓宽了商业化论点，但没有确立客户数、集中度、经常性支持收入或退出准备度。没有保留来源显示 IPO
              时间表、收购流程、目标退出倍数或投资人流动性路径。投资前，尽调应取得经审计财务、出货和积压订单队列、毛利和现金转化历史、完全稀释资本表、证券权利及客户参考。论点破裂包括无法证明盈利、融资后交付约束仍持续、重大优先权悬置，或无法证明相对
              incumbent 替代方案的可重复经济性。
            claimRefs:
              - CV003
