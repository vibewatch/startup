              - CI012
      - number: '4.2'
        title: GTM 动作与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              可见的市场动作以企业客户为主、渠道为辅。Oxide 与 Carahsoft
              的合作打开转售渠道和具名公共部门合同载体；产品则定位为数小时内可部署，而非多厂商集成项目。这些因素可能降低采购和实施摩擦，但没有披露销售周期、配额产出、渠道折扣、转售费用、获客成本或回收期。公司提供的客户经济性方向上不错：Forbes
              引述某国防科技客户称成本下降超过 70%，并称 Oxide 负载每小时 6 美分，而 AWS 为 26
              美分。这些是单个公司的说法，不是披露的合同定价或代表性客户队列，在用作销售效率代理指标前，应拿发票和标准化总拥有成本模型验证。
            claimRefs:
              - CI008
              - CI009
              - CI011
              - CI012
      - number: '4.3'
        title: 成本结构、产能与资本充足性
        blocks:
          - type: paragraph
            body: >-
              Oxide 的融资披露比会计数据更清楚地指出经济瓶颈。公司称过去 12 个月制造产能增长 20x，但需求仍超过产量；公司还称 Series D
              将用于锁定零部件、扩大制造并服务新老客户。这符合营运资金密集型模式：系统交付前，现金就要投入材料和生产。Oxide 在 $200 million Series C 后宣布 $445 million Series
              D，并称 2026
              年早些时候已实现盈利。但这些说法都不能证明当前可用现金、经营现金流、自由现金流消耗、现金跑道、债务、采购承诺、库存周转、积压订单转化或毛利率。因此，已募集资金不应视为手头现金，会计盈利也不应视为正向现金创造的证明。
