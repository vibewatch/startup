  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Oxide
              的相关市场不是全部云支出或全部数据中心硬件，而是本地基础设施、私有云运维和集成式机架级系统的交集：买家一次购买定制计算、存储、网络和软件控制平面组成的自有系统。边界不包括普通公有云消费、安装在另行采购服务器上的纯软件私有云层，以及没有云运维模式的一般服务器采购。相邻方案包括
              AWS Outposts 等超大规模云扩展和 Nutanix 等软件定义基础设施；现状则是企业自行组装和运营的多厂商堆栈。这个窄定义很重要，因为宽泛的云市场估算会纳入 Oxide
              当前全机架产品和所有权模式无法覆盖的支出。
            claimRefs:
              - CM001
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM006
              - CM008
              - CM009
              - CM010
          - type: figure
