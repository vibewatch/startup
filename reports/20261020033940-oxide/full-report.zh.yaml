      - number: '1.3'
        title: 融资、规模与里程碑
        blocks:
          - type: paragraph
            body: >-
              最强融资证据确认 2025 年 8 月完成 $100 million 的 Series B，以及 2026 年 2 月由 USIT 领投、Eclipse、Riot Ventures、Jane Street
              等参与的公司宣布的 $200 million Series C。Oxide 表示 Series C 将用于制造、产品开发和客户支持。随后，一篇信誉较低的 Dev.to 文章称 2026 年 10 月 9 日由
              Eclipse 领投 $445 million Series D、累计融资约 $835 million、公司已盈利并扩大制造；这些说法没有其他保留来源交叉验证，因此不作为已验证的封面指标。另据 2026 年 9
              月的 Carahsoft 合作公告，公司打开了具名公共部门采购渠道；Tech Field Day 和 Futuriom 则描述了联邦政府、金融服务、云 SaaS、Lawrence Livermore 和
