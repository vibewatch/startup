      - number: '3.2'
        title: 集成与运营者控制是最明确的已记录差异化
        blocks:
          - type: paragraph
            body: >-
              Oxide 一手规格显示，其集成计算层每个机架最多容纳 24 个第二代 sled，每个 sled 最多 192 个 CPU 核和 1.5 TiB 内存，并提供统一控制平面以及面向虚拟机和硬件指标的
              API。公司还声称具备硬件信任根、可审计的开源堆栈，并摆脱第三方虚拟化许可。合在一起，这些特性支持“减少集成工作、同时保留客户控制权”的可信差异化逻辑。但它们不能证明更低的总成本、更高的可靠性或更好的负载性能：证据池没有在相同负载和运营假设下，将
              Oxide 与 incumbent、HCI 产品或超大规模云扩展测试的独立基准。
            claimRefs:
              - CP002
