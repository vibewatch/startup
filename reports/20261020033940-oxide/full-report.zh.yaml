  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合不止机架级初创公司
        blocks:
          - type: paragraph
            body: >-
              买家面对的并不只是 Oxide 与另一家新机架厂商二选一。指定证据涵盖组装成企业堆栈的 Dell、HPE 和 Cisco 传统设备，Nutanix 与 VMware 超融合基础设施，AWS
              Outposts、Azure Stack 和 Google Anthos 等公有云扩展，Hetzner 或 OVH 等租用专用服务器，以及结合商品硬件、虚拟化和集成工作的内部自建方案。Oxide
              位于这组方案中垂直整合程度最高的一端：其材料称一个机架级系统同时整合硬件和开源软件。这个分类有助于识别替代方案，但不是市场份额排名，二手来源也没有提供可比的出货量、装机基数或收入数据。
            claimRefs:
              - CP001
              - CP007
              - CP008
              - CP009
              - CP010
