  - id: TV002
    title: 投资论点与反论点
    columns:
      - 视角
      - 基于证据的论点
      - 哪些变化会改变判断
    rows:
      - - 论点
        - $445 million 的 D 轮融资为制造和营运资金提供了充足空间。
        - 核实证券条款，并证明资金能高效转化为已交付系统。
      - - 论点
        - Oxide 报称已实现盈利、制造产能增长二十倍，且需求超过供给。
        - 独立审计财务报表和从积压订单到收入的客户批次数据将提升信心。
      - - 论点
        - Carahsoft 增加了成熟的公共部门采购渠道。
        - 通过这些合同赢得客户并实现重复部署，才能证明渠道生产力。
      - - 反论点
        - 现有估值、稀释和优先权条款在公开证据中没有披露。
        - 需要完全稀释后的股权结构表和融资文件，才能为入场价格定价。
      - - 反论点
        - 私有云领域的现有厂商竞争，以及 AI 处理定位不清，可能限制结果。
        - 竞争输赢数据和经过验证的工作负载路线图将降低这一风险。
    notes: 公司对经营情况的表述仍属于公司自述；第三方报道只能提供背景，不能独立审计盈利能力或需求。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV009
      - CV011
      - CV014
  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 明确假设
      - 估值与回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 经审计的盈利能力保持不变，积压订单转化，产量扩大，重复部署增多。
        - 估值区间无法取得；只有在经核实的盈利和条款足以支持所需回报时才投资。
        - 利润率承压、组件需求，以及规模化执行。
        - 经审计利润率、出货批次和有利且清晰的条款得到确认后，信号增强。
      - - 基准
        - D 轮资本支持交付，但单位经济性和客户集中度仍未公开。
        - 维持未定价状态，跟踪里程碑而不是赋予倍数。
        - 资本密集度、优先权不透明，以及经常性经济性不确定。
        - 在尽调填补缺口前，这一情景与混杂的公开证据最为一致。
      - - 悲观
        - 需求或盈利声明无法转化为持久的现金生成，现有厂商则缩小差异化空间。
        - 没有优先权和资本结构数据，无法界定下行幅度。
        - 下轮融资、优先权悬置、交付延误和竞争替代。
        - 如果经审计结果不及公司声明，或融资后产能约束仍持续，信号增强。
    notes: 由于留存证据没有当前估值、经审计预测、可比倍数或资本表条款，情景仅作定性分析；不代表任何数值概率或区间。
    claimRefs:
