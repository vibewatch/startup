        title: 展示项
        blocks:
          - type: callout
            title: 差异化来自架构，而非单一功能
            body: Oxide 最强的已记录定位是把机架级集成、API 优先运作、开源可审计性和自有基础设施部署模式合在一起。
            calloutType: strength
            claimRefs:
              - CP001
              - CP004
              - CP006
          - type: callout
            title: 竞争证明明显不完整
            body: 没有保留来源提供 Oxide 与主要替代方案之间当前可比定价、客户赢单/丢单数据、流失率、负载基准或已测量的切换成本。
            calloutType: risk
            claimRefs:
              - CP011
              - CP016
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现
        blocks:
          - type: paragraph
            body: >-
              公开证据指向硬件加支持的混合模式，而非传统纯软件模式。Tech Field Day 描述的是资本支出采购加支持订阅，用于更新和维护；Oxide
              销售的是集成式机架级系统，而不是分别定价的计算、存储、网络和控制平面组件。这种结构可以带来较大的前期系统销售和潜在经常性支持收入，但没有保留来源披露标价、实际平均售价、订阅费率、收入确认政策或系统与支持的收入构成。Forbes
              引用知情人士称收入达数亿美元，高于 12 个月前的个位数百万美元；Oxide 拒绝提供确切数字。这个增长信号很重要，但既不是经审计收入，也不是 ARR，单独不能证明收入质量。
            claimRefs:
              - CI006
              - CI010
              - CI014
          - type: table
            tableRef: TI001
            claimRefs:
