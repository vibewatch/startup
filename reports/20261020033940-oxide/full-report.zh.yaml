              - CP010
      - number: '3.3'
        title: 分销逐渐制度化，但定价仍不透明
        blocks:
          - type: paragraph
            body: >-
              Carahsoft 关系通过转售伙伴、NASA SEWP V 和 OMNIA Partners 合同，为 Oxide
              提供了具体的公共部门路径。在重视主权和运营控制的市场中，这会改善采购可达性，也是纯产品比较容易漏掉的分销资产。Oxide 还宣布 $200 million Series
              C，用于扩大制造、产品开发和支持；这缓解了近期供应商存续担忧，但不证明客户采用或供应执行。定价仍是最大的商业比较缺口。一篇独立博客转述约 $600,000 的半机架价格，但明确追溯到一条无来源的 2023
              年评论；指定证据没有当前 Oxide 价目表、实际合同金额、折扣表、支持费用或同口径竞品报价。
            claimRefs:
              - CP005
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP010
              - CP011
      - number: '3.4'
        title: 护城河逻辑可信，但尚未独立测量
        blocks:
          - type: paragraph
            body: >-
              Oxide 的资本基础显然不小，但当前二手记录彼此嘈杂。Bex 称 2026 年 8 月 Form D 显示已售出约 $445 million；一篇开发者文章称这笔融资是 2026 年 10 月的 Series
              D，并报称累计融资约 $835 million；另一篇低信誉文章则错误地把 $445 million Series C 放在 2024 年 6
              月。这些记录不应拼成一条确定时间线。更重要的是，融资只是执行能力，不是持久优势的证明。可防御性取决于把垂直整合、开源可审计性和采购渠道转化为重复赢单、低流失、可靠交付和有利的全生命周期经济性。这里没有一项结果得到独立量化，因此商品化、
              incumbent 反应、多云并用和客户切换行为仍是重要尽调问题。
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
