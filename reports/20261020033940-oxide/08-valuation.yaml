company:
  name: Oxide
chapter:
  number: 8
  title: Valuation
  summary: >-
    Oxide's disclosed $445 million Series D, company-reported profitability, and
    capacity expansion support the operating thesis, but the reviewed public
    evidence does not disclose a current valuation, security terms, audited
    economics, or comparable exit benchmarks. The resulting recommendation is
    research-more: price discipline cannot be assessed until those inputs are
    obtained.
sections:
  - id: recommendation-and-thesis
    title: Recommendation and thesis
    body: >-
      The investment stance is research-more, with medium confidence in the
      caution but low confidence in any price conclusion. Oxide announced a
      $445 million Series D in October 2026 after a $200 million Series C in
      February, and the Series D materials say the company reached
      profitability earlier in the year. Those are meaningful financing and
      operating signals, but profitability is company-reported and neither
      announcement supplies audited revenue, margin, cash-flow, backlog, or
      customer-concentration data. The thesis is that integrated on-premises
      cloud infrastructure has attracted substantial capital and reported
      demand; the anti-thesis is that public evidence cannot show whether the
      entry price already capitalizes that execution. A positive decision
      therefore requires private diligence rather than extrapolation from round
      size.
    claimRefs: [CV001, CV004, CV006, CV008, CV013, CV014]
    tableRefs: [TV001, TV002]
    figureRefs: [FV001]
  - id: financing-and-entry-discipline
    title: Financing context and entry discipline
    body: >-
      The Series D is described as working capital for components,
      manufacturing expansion, and customer delivery. Oxide also says
      manufacturing capacity increased twentyfold over the prior twelve months
      while demand continued to exceed supply. These statements strengthen the
      scale-up case, but they do not reveal shipped-system volume, recognized
      revenue, backlog conversion, working-capital intensity, or whether the
      new capital is primary, secondary, debt-like, or preference-heavy. The
      reviewed current financing sources disclose round size and named
      participants but not post-money valuation, price per share, dilution,
      liquidation preferences, or governance rights. Entry discipline should
      therefore be expressed as a diligence condition: do not underwrite a
      target return until ownership, preference, and operating evidence are
      available.
    claimRefs: [CV001, CV002, CV003, CV005, CV007, CV008, CV014, CV016]
  - id: scenarios-and-comparables
    title: Scenario framework and comparable limits
    body: >-
      Public evidence supports milestone-based scenarios, not defensible
      valuation ranges. The bull case requires independent confirmation of
      profitability, sustained backlog conversion, and production growth
      without margin erosion; the base case assumes the new capital funds
      delivery but leaves price and unit economics unverified; the bear case
      centers on production, competitive, and AI-workload execution risk.
      Futuriom identifies HPE, Dell, and Supermicro as relevant private-cloud
      competitors and says Oxide's AI-processing approach was unclear in its
      2025 review. Those names frame product competition, not valuation
      benchmarks: no retained source provides comparable trading multiples,
      private-round terms, or M&A outcomes that can be normalized to Oxide.
      Numerical probabilities and valuation ranges are therefore recorded as
      unavailable rather than estimated.
    claimRefs: [CV005, CV009, CV010, CV011, CV013, CV015]
    tableRefs: [TV003]
  - id: exit-readiness-and-diligence
    title: Exit readiness, diligence asks, and thesis breaks
    body: >-
      The Carahsoft relationship expands Oxide's public-sector procurement
      route, while the Series D materials name financial services, government,
      national laboratories, aerospace, and other compute-intensive sectors.
      That distribution evidence broadens the commercialization thesis, but it
      does not establish customer count, concentration, recurring support
      revenue, or exit readiness. No retained source signals an IPO timetable,
      acquisition process, target exit multiple, or investor liquidity path.
      Before investment, diligence should obtain audited financials, shipment
      and backlog cohorts, gross-margin and cash-conversion history, the fully
      diluted capitalization table, security rights, and customer references.
      Thesis breaks include failure to substantiate profitability, persistent
      delivery constraints despite the financing, material preference
      overhang, or inability to demonstrate repeatable economics against
      incumbent alternatives.
    claimRefs: [CV003, CV004, CV009, CV012, CV016]
tables:
  - id: TV001
    title: Recommendation summary
    columns:
      - Decision field
      - Current assessment
      - Decision implication
    rows:
      - [Recommendation, "Research more", "Do not make a price-based commitment before private financial and cap-table diligence."]
      - [Confidence, "Medium in the caution; low in price determination", "The financing is observable, but the valuation inputs are not."]
      - [Risk rating, "High", "Hardware scale-up, working-capital, competition, and opaque terms can produce material downside."]
      - [Valuation stance, "Indeterminate; price discipline required", "No public valuation range is defensible from the retained evidence."]
      - [Return and exit, "Not supportable publicly", "Require ownership, preference, dilution, and exit assumptions before underwriting."]
    notes: >-
      Assessments synthesize the retained October 2026 financing evidence;
      unavailable valuation, return, and risk inputs are not estimated.
    claimRefs: [CV001, CV008, CV013, CV014, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Lens
      - Evidence-based argument
      - What would change the view
    rows:
      - [Thesis, "A $445 million Series D supplies substantial manufacturing and working-capital capacity.", "Confirm the security terms and demonstrate capital-efficient conversion into shipped systems."]
      - [Thesis, "Oxide reports profitability, twentyfold manufacturing-capacity growth, and demand above supply.", "Independent audited financials and backlog-to-revenue cohorts would raise confidence."]
      - [Thesis, "Carahsoft adds established public-sector procurement channels.", "Customer wins and repeat deployments through those contracts would demonstrate channel productivity."]
      - [Anti-thesis, "Current valuation, dilution, and preference terms are absent from the retained public evidence.", "A fully diluted cap table and financing documents are required to price the entry."]
      - [Anti-thesis, "Incumbent private-cloud competition and unclear AI-processing positioning may constrain outcomes.", "Competitive win/loss data and a validated workload roadmap would reduce this risk."]
    notes: >-
      Company operating statements remain company claims; third-party coverage
      provides context but does not independently audit profitability or demand.
    claimRefs: [CV001, CV003, CV004, CV005, CV009, CV011, CV014]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation and return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "Audited profitability holds, backlog converts, production scales, and repeat deployments broaden.", "Valuation range unavailable; invest only if verified earnings and terms support the required return.", "Margin compression, component needs, and execution at scale.", "Strengthens with audited margins, shipment cohorts, and favorable clean terms."]
      - [Base, "Series D capital funds delivery, but unit economics and customer concentration remain private.", "Remain unpriced and track milestones rather than assign a multiple.", "Capital intensity, opaque preferences, and uncertain recurring economics.", "Most consistent with the mixed public evidence until diligence closes the gaps."]
      - [Bear, "Demand or profitability claims do not translate into durable cash generation and incumbents narrow differentiation.", "Downside cannot be bounded without preference and capitalization data.", "Down round, preference overhang, delivery slippage, and competitive displacement.", "Strengthens if audited results miss claims or capacity constraints persist after financing."]
    notes: >-
      Scenarios are qualitative because the retained evidence contains no
      current valuation, audited forecast, comparable multiple, or cap-table
      terms; no numerical probability or range is implied.
    claimRefs: [CV003, CV004, CV005, CV008, CV011, CV014, CV015]
figures:
