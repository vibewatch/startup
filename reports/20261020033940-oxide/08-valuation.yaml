    title: Recommendation logic
    type: flow
    summary: >-
      The disclosed financing and operating claims are offset by missing price
      and return inputs, leading to a research-more decision.
    data:
      nodes:
        - id: financing
          label: Financing capacity
          detail: "$445 million Series D disclosed in October 2026."
        - id: operating-proof
          label: Company-reported operating proof
          detail: "Profitability and twentyfold capacity growth are asserted, not independently audited."
        - id: market-access
          label: Commercial reach
          detail: "Sector breadth and a public-sector channel support the demand thesis."
        - id: price-gap
          label: Entry-price gap
          detail: "Valuation, dilution, and preference terms are undisclosed."
        - id: downside
          label: Downside uncertainty
          detail: "Competitive, production, and AI-workload execution risks remain."
        - id: decision
          label: Research more
          detail: "Obtain financial, cap-table, customer, and comparable evidence before pricing."
    approximationNotes: >-
      The sequence is analytical rather than a quantified conversion funnel and
      does not imply numerical weights or probabilities.
    claimRefs: [CV001, CV004, CV005, CV008, CV009, CV011, CV013]
callouts:
  - calloutType: recommendation
    title: Round size is visible; entry price is not
    body: >-
      Treat the $445 million raise as evidence of financing capacity, not as a
      substitute for valuation, ownership, liquidation-preference, or return
      analysis.
    claimRefs: [CV001, CV008, CV014]
