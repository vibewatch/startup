figures:
  - id: FP001
    title: Competitive positioning by integration and customer control
    type: quadrant
    summary: >-
      An evidence-constrained ordinal map places Oxide toward high integration and high customer
      control, while emphasizing that the coordinates are analytical scores rather than measured
      benchmarks.
    data:
      xAxis:
        label: Hardware-software integration
        min: 1
        max: 5
      yAxis:
        label: Customer infrastructure control
        min: 1
        max: 5
      points:
        - label: Oxide
          x: 5
          y: 5
          detail: "Integrated rack and open-source control plane operated in customer facilities."
        - label: Traditional OEM stack
          x: 2
          y: 5
          detail: "Customer-controlled components with substantial integration responsibility."
        - label: HCI
          x: 3
          y: 4
          detail: "Converged software layer, with deployment and licensing details varying by vendor."
        - label: Hyperscaler extension
          x: 4
          y: 2
          detail: "Integrated cloud experience with greater dependency on the public-cloud vendor."
        - label: Rented dedicated
          x: 1
          y: 3
          detail: "Dedicated capacity but provider-owned metal and customer-assembled platform."
        - label: Internal build
          x: 1
          y: 5
          detail: "Maximum operator control paired with the highest integration responsibility."
    approximationNotes: >-
      Scores are ordinal analyst judgments derived from the retained descriptions, not measured
      performance or market data; one-point differences are not statistically meaningful.
    claimRefs: [CP016]
callouts:
  - calloutType: strength
    title: Differentiation is architectural, not a single feature
    body: >-
      Oxide's strongest documented position combines rack-level integration, API-first operation,
      open-source inspectability, and an owned-infrastructure deployment model.
    claimRefs: [CP001, CP004, CP006]
  - calloutType: risk
    title: Competitive proof is materially incomplete
    body: >-
      No retained source provides current comparable pricing, customer win/loss data, churn,
      workload benchmarks, or measured switching costs across Oxide and the principal alternatives.
    claimRefs: [CP011, CP016]
