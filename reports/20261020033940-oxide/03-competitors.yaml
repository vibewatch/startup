      - ["Traditional OEM / HCI", "Unknown in assigned evidence", "Components or converged software and hardware, depending on vendor", "Licensing, integration labor, support, and renewal exposure", "Price a common bill of materials and five-year operating model"]
      - ["Hyperscaler on-premises extension", "Unknown in assigned evidence", "On-premises extension aligned to a public-cloud control model", "Minimum term, metering, data transfer, and management dependency", "Request matched workload proposals from AWS, Microsoft, and Google"]
      - ["Rented dedicated servers", "Bex cites EUR50-EUR120 per server-month examples", "Rented metal with provider power, network, and component replacement", "Not comparable with rack density, service, sovereignty, or workload scale", "Use only as a small-fleet substitute, not as an Oxide price benchmark"]
    notes: >-
      Pricing coverage is incomplete and mixes an unverified historical Oxide reference with
      illustrative dedicated-server prices; no value is a realized customer contract price.
