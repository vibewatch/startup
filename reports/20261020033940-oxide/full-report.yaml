              ramp; none of those later claims is corroborated by another retained source, so they are not used as
              verified cover metrics. Separately, the September 2026 Carahsoft partnership opened named public-sector
              procurement channels, while Tech Field Day and Futuriom describe federal, financial-services, cloud-SaaS,
              Lawrence Livermore, and CoreWeave use cases. These are useful demand signals, not a customer count,
              revenue measure, backlog figure, or proof of broad adoption.
