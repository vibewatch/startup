              - CE006
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              The architecture spans physical rack design, compute sleds, embedded control, host virtualization,
              distributed storage, networking, and a multi-tenant control plane. Arctiq identifies public components
              including Hubris and Humility for embedded control, Helios and Propolis for the host and virtual-machine
              layer, Omicron for the control plane, and Crucible for distributed block storage. Tech Field Day reports
              that logical silos separate compute, memory, and storage resources and receive distinct API endpoints.
              Capacity descriptions require reconciliation: Arctiq describes 32 compute sleds in the current-generation
              rack, while TMC Insight reports capacity for as many as 64 servers. Until Oxide supplies a current bill of
              materials and definitions, those figures should not be treated as directly comparable.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE009
              - CE010
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE005
              - CE008
              - CE009
              - CE010
              - CE011
              - CE014
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE005
              - CE009
              - CE010
              - CE012
      - number: '5.3'
        title: Differentiation, maturity, and roadmap
        blocks:
          - type: paragraph
            body: >-
              The principal differentiation is full-stack ownership rather than any single component: custom rack
              engineering, an auditable open-source software stack, API-first operations, and freedom from third-party
              virtualization licensing. Arctiq relays Oxide's claims of a 55% power-efficiency improvement and roughly
              twelve-fold cooling-efficiency improvement, but provides no underlying independent benchmark dataset,
              workload definition, or test protocol. The same review identifies a fixed rack-scale capital commitment
              and a young ecosystem as fit constraints. A low-reputation DEV Community post reports GPU-capable sleds on
              the roadmap; without an assigned official technical source, timing and specifications remain unverified
              and should not be underwritten as a shipping capability.
            claimRefs:
              - CE005
              - CE008
              - CE012
              - CE013
              - CE015
      - number: '5.4'
        title: Trust, reliability, and technical diligence
        blocks:
          - type: paragraph
            body: >-
              Oxide and Carahsoft claim a hardware root of trust, auditable open-source software, and removal of
              third-party virtualization-license dependency. Those design choices can improve inspectability, but the
              assigned evidence does not establish external security certifications, vulnerability-management response
              times, availability service levels, fleet failure rates, upgrade success rates, or independently measured
              power and cooling performance. TMC Insight also flags the operational questions created by rack density,
              including power, cooling, and cabling requirements, and says buyers will need concrete efficiency proof.
              Technical diligence should therefore move from architecture narratives to current configuration records,
              third-party test results, security-control evidence, support metrics, and reference-customer operating
              data.
            claimRefs:
              - CE008
              - CE010
              - CE012
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Integration is both the moat and the diligence burden
            body: >-
              Full-stack ownership can reduce multi-vendor friction, but it concentrates hardware, software, support,
              upgrade, and supply-chain execution in one young vendor. Require benchmark protocols, reliability
              histories, security-control evidence, and current configuration documentation before treating
              architectural differentiation as proven operating advantage.
            calloutType: risk
            claimRefs:
              - CE008
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and payer segments
        blocks:
          - type: paragraph
            body: >-
              Oxide's visible customer map is concentrated in organizations that operate consequential infrastructure
              rather than in general-purpose small-business IT. Tech Field Day's account of company presentations
              identifies large enterprises and cloud-SaaS providers, with particular interest from federal and financial
              services buyers. The payer is typically an infrastructure or procurement organization, while platform,
              security, networking, and developer teams are the users. The use cases differ: public-sector and financial
              buyers emphasize control, sovereignty, and operational simplification, while cloud-SaaS operators seek to
              extend services beyond hyperscalers and place compute nearer customer data. The evidence establishes
              segment fit, but it does not disclose segment revenue, customer counts, average rack deployments, or
              buying-cycle length.
            claimRefs:
              - CU001
              - CU002
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
              - CU006
              - CU007
      - number: '6.2'
        title: Adoption and route-to-market signals
        blocks:
          - type: paragraph
            body: >-
              The strongest current adoption signal is operational rather than financial: two October 2026 secondary
              accounts report that manufacturing capacity expanded twentyfold during the preceding twelve months while
              demand still exceeded supply. Those reports also describe a backlog and funding intended to secure
              components, increase production, and serve new and existing customers. These are directional indicators,
              not disclosed customer or shipment metrics, and the underlying company data are unaudited in the reviewed
              sources. Separately, Oxide's September 2026 Carahsoft arrangement makes the system available through named
              federal and cooperative procurement contracts. That lowers procurement friction but does not prove that
              any agency has placed an order through those vehicles.
            claimRefs:
              - CU007
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU007
              - CU009
              - CU010
              - CU012
      - number: '6.3'
        title: Named customer proof remains narrow
        blocks:
          - type: paragraph
            body: >-
              Independent coverage names Lawrence Livermore National Laboratory, CoreWeave, and Idaho National
              Laboratory as customers or commercial customers. This is stronger evidence than an unlabeled logo wall,
              yet the public record reviewed here does not state rack counts, contract value, deployment date,
              production-versus-pilot status, repeat orders, or measured outcomes for those organizations. Futuriom
              expressly characterizes deployment details as sparse. Tech Field Day adds company-presented anecdotes
              about a federal agency reducing work that previously took months to hours, but the agency is unnamed and
              no baseline, sample, or independent customer testimony is supplied. The evidence therefore supports
              referenceability, not a conclusion about broad production adoption.
            claimRefs:
              - CU003
              - CU005
              - CU006
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU006
              - CU014
      - number: '6.4'
        title: Durability, expansion, and concentration are still open
        blocks:
          - type: paragraph
            body: >-
              The reviewed material contains no disclosed NRR, GRR, renewal rate, churn, contract duration, satisfaction
              score, cohort behavior, or customer-concentration schedule. Oxide's syndicated Series C release says it is
              trusted by enterprise customers across industries, but provides neither names nor a denominator. Remio
              similarly notes that outsiders cannot determine whether demand is broad or concentrated among a small
              number of large customers. The described supply constraint could support future expansion, but backlog and
              capital raised are not repeat-purchase or retention metrics. Diligence should therefore anchor on
              customer-level rack shipments, acceptance dates, support history, renewal and expansion orders, and
              revenue concentration rather than treating financing or channel availability as proof of durable adoption.
            claimRefs:
              - CU010
              - CU011
              - CU013
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU007
              - CU008
              - CU010
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Demand evidence is not durability evidence
            body: >-
              Manufacturing growth, backlog, and financing indicate supply pressure but cannot substitute for customer
              count, retained revenue, renewal, repeat-rack orders, or concentration data.
            calloutType: risk
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              The highest residual risk is execution across an unusually broad hardware-software boundary. Independent
              reporting describes a nine-foot, 3,000-pound rack and a design spanning compute, switching, firmware,
              control software, power and cooling; this breadth removes multi-vendor integration from the customer but
              concentrates design, qualification, manufacturing, field-service and support accountability inside Oxide.
              The February 2026 Series C was explicitly positioned to expand manufacturing and support, which mitigates
              supplier-longevity risk but does not disclose cash available, burn, working capital, warranty reserves or
              shipped-rack economics. Competitive risk is also material: Futuriom identified large incumbent
              alternatives and said Oxide's AI-processing approach was unclear. The heatmap therefore ranks
              manufacturing scale-up and reliability verification above demand narratives, with evidence maturity
              treated separately from claimed mitigation maturity.
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR007
              - CR008
              - CR009
              - CR013
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR007
              - CR008
              - CR009
              - CR011
              - CR013
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR007
              - CR008
              - CR014
              - CR016
      - number: '7.2'
        title: Regulatory, legal and security uncertainty
        blocks:
          - type: paragraph
            body: >-
              Public-sector availability through Carahsoft, SEWP V and OMNIA establishes a route to procurement, not
              proof that Oxide holds every agency-specific authorization, security certification or contractual approval
              needed for a given deployment. Oxide's own announcement cites a hardware root of trust and an auditable
              open-source stack, but the retained corpus contains no regulator record, court record, certification
              audit, penetration test, incident report, recall notice or warranty dataset. That absence is an evidence
              limitation, not evidence that no incident, dispute or safety event exists. Legal, privacy, export-control,
              environmental and product- safety exposures should therefore remain unverified until counsel searches,
              certification evidence, insurance schedules and incident histories are reviewed. The risk register makes
              these unknowns explicit rather than assigning false probabilities.
            claimRefs:
              - CR005
              - CR012
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR008
              - CR012
              - CR016
      - number: '7.3'
        title: Supplier, facility and channel dependencies
        blocks:
          - type: paragraph
            body: >-
              Oxide's integration strategy changes rather than eliminates third-party dependence. Independent reporting
              identifies AMD EPYC processors and Intel Tofino 2 switching silicon, while Tech Field Day's presentation
              summary identifies Sanyo Denki as a supplier involved in co-design. CoreSite's partner release says its
              SV2 facility and blended IP service support Oxide's network performance and setup, and Oxide's
              public-sector route uses Carahsoft and its reseller ecosystem. None of the retained sources quantifies
              second-source coverage, inventory buffers, contractual service levels, counterparty concentration or
              alternative facilities. These dependencies are manageable only if procurement, support and
              disaster-recovery evidence shows substitution paths that match enterprise infrastructure lifetimes.
            claimRefs:
              - CR004
              - CR005
              - CR009
              - CR010
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR005
              - CR009
              - CR010
              - CR012
      - number: '7.4'
        title: Mitigations, monitors and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Financing and integrated ownership are meaningful mitigants, but current public evidence is too issuer-led
              to establish residual exposure. Monitor quarterly rack orders, production capacity, shipped and accepted
              systems, backlog conversion, lead times, field-failure rates, severity-one incidents, warranty cost, gross
              margin and support response times. Require an audited bridge from funding raised to unrestricted cash and
              working-capital needs; do not treat financing headlines as runway. Thesis-break triggers are failure to
              provide independent production references, inability to qualify substitute suppliers for critical silicon
              or power components, material security or safety findings without timely remediation, or repeated missed
              delivery commitments. A low-reputation October 2026 article claims a $445 million Series D, profitability
              and a twentyfold capacity increase, but those claims should not alter the risk rating without primary,
              independently corroborated evidence.
            claimRefs:
              - CR002
              - CR003
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Evidence required before underwriting the risk
            body: >-
              Condition investment on audited liquidity and working-capital data, supplier and warranty schedules,
              independent production references, security and incident materials, and backlog-to-acceptance cohorts.
              Funding announcements and partner claims are mitigants, not substitutes for these operating records.
            calloutType: recommendation
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR011
              - CR013
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and thesis
        blocks:
          - type: paragraph
            body: >-
              The investment stance is research-more, with medium confidence in the caution but low confidence in any
              price conclusion. Oxide announced a $445 million Series D in October 2026 after a $200 million Series C in
              February, and the Series D materials say the company reached profitability earlier in the year. Those are
              meaningful financing and operating signals, but profitability is company-reported and neither announcement
              supplies audited revenue, margin, cash-flow, backlog, or customer-concentration data. The thesis is that
              integrated on-premises cloud infrastructure has attracted substantial capital and reported demand; the
              anti-thesis is that public evidence cannot show whether the entry price already capitalizes that
              execution. A positive decision therefore requires private diligence rather than extrapolation from round
              size.
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV008
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV008
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV009
              - CV011
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV008
              - CV009
              - CV011
              - CV013
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The Series D is described as working capital for components, manufacturing expansion, and customer
              delivery. Oxide also says manufacturing capacity increased twentyfold over the prior twelve months while
              demand continued to exceed supply. These statements strengthen the scale-up case, but they do not reveal
              shipped-system volume, recognized revenue, backlog conversion, working-capital intensity, or whether the
              new capital is primary, secondary, debt-like, or preference-heavy. The reviewed current financing sources
              disclose round size and named participants but not post-money valuation, price per share, dilution,
              liquidation preferences, or governance rights. Entry discipline should therefore be expressed as a
              diligence condition: do not underwrite a target return until ownership, preference, and operating evidence
              are available.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV007
              - CV008
              - CV014
              - CV016
      - number: '8.3'
        title: Scenario framework and comparable limits
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports milestone-based scenarios, not defensible valuation ranges. The bull case
              requires independent confirmation of profitability, sustained backlog conversion, and production growth
              without margin erosion; the base case assumes the new capital funds delivery but leaves price and unit
              economics unverified; the bear case centers on production, competitive, and AI-workload execution risk.
              Futuriom identifies HPE, Dell, and Supermicro as relevant private-cloud competitors and says Oxide's
              AI-processing approach was unclear in its 2025 review. Those names frame product competition, not
              valuation benchmarks: no retained source provides comparable trading multiples, private-round terms, or
              M&A outcomes that can be normalized to Oxide. Numerical probabilities and valuation ranges are therefore
              recorded as unavailable rather than estimated.
            claimRefs:
              - CV005
              - CV009
              - CV010
              - CV011
              - CV013
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV008
              - CV011
              - CV014
              - CV015
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              The Carahsoft relationship expands Oxide's public-sector procurement route, while the Series D materials
              name financial services, government, national laboratories, aerospace, and other compute-intensive
              sectors. That distribution evidence broadens the commercialization thesis, but it does not establish
              customer count, concentration, recurring support revenue, or exit readiness. No retained source signals an
              IPO timetable, acquisition process, target exit multiple, or investor liquidity path. Before investment,
              diligence should obtain audited financials, shipment and backlog cohorts, gross-margin and cash-conversion
              history, the fully diluted capitalization table, security rights, and customer references. Thesis breaks
              include failure to substantiate profitability, persistent delivery constraints despite the financing,
              material preference overhang, or inability to demonstrate repeatable economics against incumbent
              alternatives.
            claimRefs:
              - CV003
              - CV004
              - CV009
              - CV012
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Round size is visible; entry price is not
            body: >-
              Treat the $445 million raise as evidence of financing capacity, not as a substitute for valuation,
              ownership, liquidation-preference, or return analysis.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV008
              - CV014
