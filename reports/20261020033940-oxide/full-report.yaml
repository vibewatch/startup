  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Oxide's relevant market is not all cloud spending or all data-center hardware. It is the intersection of
              on-premises infrastructure, private-cloud operations, and integrated rack-scale systems: a buyer acquires
              purpose-built compute, storage, networking, and a software control plane as one owned system. The boundary
              excludes ordinary public-cloud consumption, software-only private-cloud layers installed on separately
              sourced servers, and general server purchases without a cloud operating model. Adjacent solutions include
              hyperscaler extensions such as AWS Outposts and software-defined infrastructure such as Nutanix; the
              status quo is a multivendor stack assembled and operated by the enterprise. This narrow definition matters
              because a broad cloud-market estimate would include spend that Oxide cannot address with its current
              full-rack product and ownership model.
            claimRefs:
              - CM001
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM006
              - CM008
              - CM009
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM007
              - CM010
              - CM013
      - number: '2.2'
        title: Buyers, users, and demand formation
        blocks:
          - type: paragraph
            body: >-
              The evidenced buyer universe spans financial services, government, national laboratories, aerospace, and
              other compute-intensive organizations. Developers and cloud-infrastructure teams are the clearest users
              because the product exposes self-service compute, storage, and networking through APIs, a CLI, and a web
              console. Public-sector access is more concrete than the private-sector purchasing path: Oxide says
              Carahsoft is its government aggregator and identifies SEWP V and OMNIA Partners contract vehicles. Demand
              is driven by data residency, latency, regulatory obligations, capacity control, and the desire for
              cloud-style automation without surrendering infrastructure ownership. Agentic-AI and data-intensive
              workloads may amplify that demand, but the evidence does not quantify how much of the current order book
              is AI-related.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM006
      - number: '2.3'
        title: Evidence-constrained sizing and adoption
        blocks:
          - type: paragraph
            body: >-
              None of the assigned sources supplies a market value, CAGR, unit population, customer count, rack
              shipments, backlog value, or price that can anchor a bottom-up estimate. The defensible sizing output is
              therefore a hierarchy of progressively narrower addressable populations with every dollar value left
              unavailable. Demand exceeding production and a company-reported twentyfold increase in manufacturing
              capacity are useful adoption signals, not market size and not revenue growth. They also expose the central
              constraint: an integrated hardware vendor must finance components, supplier coordination, factory
              throughput, quality control, and inventory before delivery. Buyers must additionally compare electricity,
              cooling, staffing, support, financing, spare capacity, and refresh cycles against public-cloud elasticity.
              The investment case needs shipment, migration, utilization, renewal, and reference-customer evidence
              before translating this demand signal into a market-share or valuation assumption.
            claimRefs:
              - CM007
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM007
              - CM013
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Demand evidence is not a market denominator
            body: >-
              Production demand exceeding capacity can indicate product pull, but without price, backlog value,
              shipments, customer count, or renewal data it cannot support a dollar TAM, revenue forecast, or
              market-share estimate.
            calloutType: risk
            claimRefs:
              - CM007
              - CM013
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The competitive set is broader than rack-scale startups
        blocks:
          - type: paragraph
            body: >-
              The buyer's choice is not simply Oxide versus another new rack vendor. The assigned evidence describes
              traditional Dell, HPE, and Cisco equipment assembled into enterprise stacks; Nutanix and VMware
              hyperconverged infrastructure; AWS Outposts, Azure Stack, and Google Anthos as public-cloud extensions;
              rented dedicated servers such as Hetzner or OVH; and an internal build that combines commodity hardware,
              virtualization, and integration work. Oxide occupies the most vertically integrated end of this set: its
              own materials describe one rack-scale system that combines hardware and open-source software. This
              taxonomy is useful for identifying substitutes, but it is not a market-share ranking and the secondary
              sources do not provide comparable shipment, installed-base, or revenue data.
            claimRefs:
              - CP001
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP007
