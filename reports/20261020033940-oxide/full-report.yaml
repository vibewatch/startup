              - CO014
      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Public evidence consistently identifies Steve Tuck as co-founder and CEO and Bryan Cantrill as co-founder
              and CTO. Their prior work together at Joyent and direct experience operating cloud infrastructure create
              credible founder-market fit across commercial delivery and systems engineering. The same evidence also
              highlights concentration risk: company messaging, financing announcements, and technical presentations
              rely heavily on these two founders. The assigned source pool does not provide a current board roster,
              executive succession plan, ownership percentages, voting rights, or a complete leadership team.
              Accordingly, the table is a partial public enumeration rather than a claim that Oxide lacks other
              executives or directors. Investor diligence should obtain the board minutes, committee charters,
              key-person provisions, and management succession plan before treating governance depth as established.
            claimRefs:
              - CO005
              - CO006
