chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Oxide Computer Company was founded in 2019 and is based in Emeryville, California. Its product combines
              purpose-built compute, storage, networking, and open-source control software at rack scale, positioning
              the system as owned infrastructure with public-cloud-style APIs and self-service operation. The commercial
              model described at Cloud Field Day is a capital purchase with a support subscription, rather than a
              consumption-only public-cloud service. This narrows the practical buyer set: independent reporting
              describes the product as relevant to operators already running large on-premises estates, while smaller
              organizations needing only a few hundred cores are better served by public cloud or smaller bare-metal
              systems. The retained evidence verifies the product architecture and target use case, but does not
              disclose pricing, unit economics, revenue, or the installed-base denominator needed to measure commercial
              scale.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO015
