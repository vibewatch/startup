      - number: '1.3'
        title: Financing, scale, and milestones
        blocks:
          - type: paragraph
            body: >-
              The strongest financing evidence establishes a $100 million Series B in August 2025 and a
              company-announced $200 million Series C in February 2026, led by USIT with participation from Eclipse,
              Riot Ventures, Jane Street, and others. Oxide said the Series C would support manufacturing, product
              development, and customer support. A low-reputation Dev.to post later reported a $445 million Series D led
