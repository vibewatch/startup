      - number: '3.2'
        title: Integration and operator control are the clearest documented differentiators
        blocks:
          - type: paragraph
            body: >-
              Oxide's first-party specifications show an integrated compute layer with up to 24 second-generation sleds
              per rack, up to 192 CPU cores and 1.5 TiB of memory per sled, plus a unified control plane and APIs for
              virtual machines and hardware metrics. The company also claims a hardware root of trust, an auditable
              open-source stack, and freedom from third-party virtualization licensing. Together these features support
              a credible differentiation thesis around reducing integration work while preserving customer control. They
              do not establish superior total cost, reliability, or workload performance: the evidence pool contains no
              independent benchmark that tests Oxide against an incumbent, HCI product, or hyperscaler extension on the
              same workload and operating assumptions.
            claimRefs:
              - CP002
