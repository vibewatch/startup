  - id: FE001
    title: Oxide product architecture stack
    type: stack
    summary: >-
      The public architecture integrates six operating layers from the physical rack through self-service tenancy rather
      than assembling separately managed products.
    data:
      layers:
        - label: Physical rack
          detail: Integrated mechanics, power distribution, cooling, and blind-mate sled installation.
          items:
