      - number: '3.3'
        title: Distribution is becoming institutional, while pricing remains opaque
        blocks:
          - type: paragraph
            body: >-
              The Carahsoft relationship gives Oxide a concrete public-sector route through reseller partners, NASA SEWP
              V, and OMNIA Partners contracts. That improves procurement access in a segment where sovereignty and
              operational control matter, and it is a distribution asset that a pure product comparison can miss. Oxide
              also announced a $200 million Series C to expand manufacturing, product development, and support, reducing
              near-term vendor-longevity concerns without proving customer adoption or supply execution. Pricing remains
              the largest commercial comparison gap. One independent blog repeats an approximately $600,000 half-rack
              figure but explicitly traces it to an unsourced 2023 comment; no current Oxide price list, realized
              contract value, discount schedule, support fee, or like-for-like competitor quote appears in the assigned
              evidence.
            claimRefs:
              - CP005
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP010
              - CP011
      - number: '3.4'
        title: The moat thesis is plausible but not yet independently measured
        blocks:
          - type: paragraph
            body: >-
              Oxide's capital base is clearly substantial, yet the current secondary record is internally noisy. Bex
              describes an August 2026 Form D showing about $445 million sold; a developer post calls the financing an
              October 2026 Series D and reports roughly $835 million of total funding; another low-reputation article
              incorrectly places a $445 million Series C in June 2024. These accounts should not be blended into a
              single definitive chronology. More importantly for competition, funding is capacity to execute rather than
              proof of durable advantage. The defensibility case depends on converting vertical integration, open-source
              inspectability, and procurement access into repeat wins, low churn, reliable delivery, and favorable
              lifecycle economics. None of those outcomes is independently quantified here, leaving commoditization,
              incumbent response, multi-homing, and customer switching behavior as material diligence questions.
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiation is architectural, not a single feature
            body: >-
              Oxide's strongest documented position combines rack-level integration, API-first operation, open-source
              inspectability, and an owned-infrastructure deployment model.
            calloutType: strength
            claimRefs:
              - CP001
              - CP004
              - CP006
          - type: callout
            title: Competitive proof is materially incomplete
            body: >-
              No retained source provides current comparable pricing, customer win/loss data, churn, workload
              benchmarks, or measured switching costs across Oxide and the principal alternatives.
            calloutType: risk
            claimRefs:
              - CP011
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a hybrid hardware-and-support model rather than a conventional pure-software
              model. Tech Field Day describes a capital-expenditure purchase paired with a support subscription for
              updates and maintenance, while Oxide markets an integrated rack-scale system rather than separately priced
              compute, storage, networking, and control-plane components. That structure can create a large upfront
              system sale and a potentially recurring support stream, but no retained source discloses list price,
              realized average selling price, subscription rate, revenue recognition policy, or the mix between systems
              and support. Forbes reported revenue in the hundreds of millions, up from single-digit millions 12 months
              earlier, citing a person familiar with the company; Oxide declined to provide an exact figure. The growth
              signal is material, but it is neither audited revenue nor ARR and cannot establish revenue quality by
              itself.
            claimRefs:
              - CI006
              - CI010
              - CI014
          - type: table
            tableRef: TI001
            claimRefs:
              - CI004
              - CI010
              - CI011
              - CI014
          - type: table
            tableRef: TI002
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI014
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI010
              - CI012
      - number: '4.2'
        title: GTM motion and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              The visible motion is enterprise-led and channel-assisted. Oxide's Carahsoft partnership opens reseller
              access and named public-sector contract vehicles, while the product is positioned as deployable within
              hours rather than as a multi-vendor integration project. Those facts may reduce procurement and
              implementation friction, but they do not reveal sales-cycle length, quota productivity, channel discounts,
              reseller fees, customer-acquisition cost, or payback. Company-provided customer economics are
              directionally attractive: Forbes quotes a claimed greater-than-70% cost reduction for one
              defense-technology customer and a six-cent-per-hour Oxide workload comparison with 26 cents on AWS. These
              are individual company claims, not disclosed contract pricing or a representative cohort, so they should
              be tested against invoices and normalized total-cost-of-ownership models before being used as a
              sales-efficiency proxy.
            claimRefs:
              - CI008
              - CI009
              - CI011
              - CI012
      - number: '4.3'
        title: Cost structure, capacity, and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              Oxide's financing disclosures identify the economic bottleneck more clearly than its accounting. The
              company says manufacturing capacity increased 20-fold in the preceding 12 months, yet demand still
              exceeded production; it also says the Series D will secure components, expand manufacturing, and serve new
              and existing customers. That is consistent with a working-capital-intensive model in which cash is
              committed to materials and production before systems are delivered. Oxide announced $445 million of Series
              D financing after a $200 million Series C, and said it reached profitability earlier in 2026. Neither
              claim establishes current cash available, operating cash flow, free-cash-flow burn, runway, debt, purchase
              commitments, inventory turns, backlog conversion, or gross margin. Funding raised therefore should not be
              treated as cash on hand, and accounting profitability should not be treated as proof of positive cash
              generation.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI013
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI005
              - CI006
              - CI015
      - number: '4.4'
        title: Financial verdict and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a stronger operating position than in a typical pre-revenue hardware startup: Oxide
              and an independent report both describe profitability, Forbes reports substantial revenue scale, and the
              latest financing directly addresses constrained production. The quality of that position remains
              unquantifiable. Revenue concentration, system-versus-support mix, realized pricing, warranty and service
              burden, component exposure, inventory aging, and gross margin are all unavailable. Product scope also
              matters financially: Forbes reported that the current racks did not include GPUs, limiting fit for complex
              training workloads even as AI demand drives the investment narrative. The investable conclusion is
              therefore positive commercial momentum with a capital-intensive conversion risk. Underwriting should
              remain conditional on audited financials, backlog and shipment cohorts, customer-level gross profit,
              cash-flow reconciliation, and financing obligations.
            claimRefs:
              - CI002
              - CI004
              - CI006
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Gate underwriting on cash conversion, not financing headlines
            body: >-
              Request audited financials, backlog and shipment cohorts, inventory and supplier commitments,
              customer-level gross profit, support renewal data, and a bridge from accounting profit to free cash flow
              before assigning a durable margin or runway.
            calloutType: recommendation
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI005
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Oxide's product is not a server appliance or a separately licensed hypervisor; it is a rack-scale system
              sold as an owned private-cloud substrate. The company describes unified compute, storage, networking, and
              control software, while Arctiq describes a customer workflow in which operators provision virtual
              machines, elastic block storage, and VPC-style networking through an API, web console, or SDK. Oxide's
              launch material says the rack arrives with the software needed to operate cloud services and requires no
              assembly, with a claimed path from rack installation to developer availability in hours. Tech Field Day's
              demonstration adds practical evidence of projects, images, disks, snapshots, networks, and Terraform-based
              provisioning, although this remains a hosted vendor demonstration rather than a production benchmark.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE009
              - CE011
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
