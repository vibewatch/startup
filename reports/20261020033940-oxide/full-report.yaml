  - id: FM001
    title: Evidence-constrained market sizing lens
    type: pyramid
    summary: >-
      Six nested lenses show where the evidence narrows Oxide's addressable population; the sources do not support
      proportional widths or dollar values.
    data:
      nodes:
        - id: market-1
          label: Private and hybrid infrastructure alternatives
          detail: Broad comparison universe; no compatible market value in the assigned evidence.
        - id: market-2
          label: Enterprise-owned cloud operating model
          detail: Organizations seeking cloud automation while retaining infrastructure ownership.
        - id: market-3
          label: Control-constrained on-premises workloads
          detail: Data residency, latency, regulatory, security, or capacity-control requirements.
        - id: market-4
          label: Compute-intensive target verticals
          detail: Financial services, government, national laboratories, aerospace, and similar enterprises.
        - id: market-5
          label: Full-rack integrated-system prospects
          detail: Buyers willing and able to replace a fragmented stack with one hardware-software system.
        - id: market-6
          label: Procurement-ready and deliverable demand
