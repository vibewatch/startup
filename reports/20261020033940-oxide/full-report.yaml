      - CE005
      - CE009
      - CE010
      - CE012
  - id: FU001
    title: Evidence-backed customer journey and unresolved expansion loop
    type: journey-map
    summary: >-
      Public evidence supports need recognition, procurement access, deployment claims, and selected use anecdotes, but
      not the repeat-order and retention loop.
    data:
      nodes:
        - id: need
          label: Need recognition
          detail: >-
            Federal, financial, and cloud-SaaS buyers seek control, lower integration burden, or deployment nearer
            customer data.
          touchpoints:
            - Company presentations
            - Independent market coverage
        - id: evaluation
          label: Technical evaluation
          detail: >-
            Buyers evaluate an integrated rack against incumbent private-cloud stacks and hyperscaler options;
            AI-processing fit remains a reported question.
          touchpoints:
            - Cloud Field Day demonstration
            - Architecture and workload review
        - id: procurement
          label: Procurement
          detail: >-
            Direct enterprise buying is supplemented by Carahsoft reseller access and named SEWP V and OMNIA Partners
            contracts for public-sector buyers.
          touchpoints:
            - Carahsoft
            - Reseller partners
            - Contract vehicles
        - id: deployment
          label: Installation and provisioning
          detail: >-
            Oxide claims the integrated system can be operational within hours of delivery, but public customer-level
            deployment timing is unavailable.
          touchpoints:
            - Rack installation
            - API, CLI, and console provisioning
        - id: realized-use
          label: Workload use
          detail: >-
            Company-presented anecdotes describe faster federal workflows and cloud-SaaS placement nearer customer
            assets, without independent quantified baselines.
          touchpoints:
            - Federal infrastructure teams
            - Cloud-SaaS platform teams
        - id: expansion
          label: Repeat order and expansion
          detail: >-
            Backlog and supply pressure suggest demand, but public sources do not disclose renewal, retention, expansion
            cohorts, or second-rack purchase rates.
          touchpoints:
            - Support experience
            - Additional rack orders
            - Renewal and expansion review
    approximationNotes: >-
      The sequence is an analytical journey assembled from public touchpoints, not a measured funnel; no conversion
      rates, durations, or stage populations are known.
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU007
      - CU008
      - CU010
      - CU015
      - CU016
