schemaVersion: "report-v2"
artifact: customers
slug: oxide
runDate: 2026-10-20
company:
  name: Oxide
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence places Oxide with federal, financial-services, cloud-SaaS, and
    national-laboratory buyers, while the September 2026 Carahsoft partnership adds
    established public-sector procurement channels. Demand and manufacturing signals
    are improving, but customer count, production status, retention, expansion, and
    concentration remain undisclosed.
sections:
  - id: customer-segments
    title: Buyer, user, and payer segments
    body: >-
      Oxide's visible customer map is concentrated in organizations that operate
      consequential infrastructure rather than in general-purpose small-business IT.
      Tech Field Day's account of company presentations identifies large enterprises
      and cloud-SaaS providers, with particular interest from federal and financial
      services buyers. The payer is typically an infrastructure or procurement
      organization, while platform, security, networking, and developer teams are the
      users. The use cases differ: public-sector and financial buyers emphasize control,
      sovereignty, and operational simplification, while cloud-SaaS operators seek to
      extend services beyond hyperscalers and place compute nearer customer data. The
      evidence establishes segment fit, but it does not disclose segment revenue,
      customer counts, average rack deployments, or buying-cycle length.
    claimRefs: [CU001, CU002, CU004]
    tableRefs: [TU001]
  - id: adoption-signals
    title: Adoption and route-to-market signals
    body: >-
      The strongest current adoption signal is operational rather than financial:
      two October 2026 secondary accounts report that manufacturing capacity expanded
      twentyfold during the preceding twelve months while demand still exceeded supply.
      Those reports also describe a backlog and funding intended to secure components,
      increase production, and serve new and existing customers. These are directional
      indicators, not disclosed customer or shipment metrics, and the underlying
      company data are unaudited in the reviewed sources. Separately, Oxide's September
      2026 Carahsoft arrangement makes the system available through named federal and
      cooperative procurement contracts. That lowers procurement friction but does not
      prove that any agency has placed an order through those vehicles.
    claimRefs: [CU007, CU009, CU010, CU011, CU012]
    tableRefs: [TU002]
  - id: named-customer-proof
    title: Named customer proof remains narrow
    body: >-
      Independent coverage names Lawrence Livermore National Laboratory, CoreWeave, and
      Idaho National Laboratory as customers or commercial customers. This is stronger
      evidence than an unlabeled logo wall, yet the public record reviewed here does
      not state rack counts, contract value, deployment date, production-versus-pilot
      status, repeat orders, or measured outcomes for those organizations. Futuriom
      expressly characterizes deployment details as sparse. Tech Field Day adds
      company-presented anecdotes about a federal agency reducing work that previously
      took months to hours, but the agency is unnamed and no baseline, sample, or
      independent customer testimony is supplied. The evidence therefore supports
      referenceability, not a conclusion about broad production adoption.
    claimRefs: [CU003, CU005, CU006, CU014]
    tableRefs: [TU003]
  - id: durability-and-expansion
    title: Durability, expansion, and concentration are still open
    body: >-
      The reviewed material contains no disclosed NRR, GRR, renewal rate, churn,
      contract duration, satisfaction score, cohort behavior, or customer-concentration
      schedule. Oxide's syndicated Series C release says it is trusted by enterprise
      customers across industries, but provides neither names nor a denominator.
      Remio similarly notes that outsiders cannot determine whether demand is broad or
      concentrated among a small number of large customers. The described supply
      constraint could support future expansion, but backlog and capital raised are not
      repeat-purchase or retention metrics. Diligence should therefore anchor on
      customer-level rack shipments, acceptance dates, support history, renewal and
      expansion orders, and revenue concentration rather than treating financing or
      channel availability as proof of durable adoption.
    claimRefs: [CU010, CU011, CU013, CU015, CU016]
    figureRefs: [FU001]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / payer
      - Primary users
      - Supported use case
      - Visible proof
      - Diligence gap
    rows:
      - - Federal, state, and local government
        - Agency infrastructure and procurement organizations
        - Security, networking, platform, and developer teams
        - Owned cloud infrastructure, data control, HPC, classified processing, and general IT
        - Carahsoft channel plus company-presented federal use anecdotes
        - No named purchasing agency, order value, rack count, or contract award disclosed
      - - Financial services
        - Enterprise infrastructure and technology procurement
        - Platform engineering and application teams
        - Replace DIY infrastructure with API-driven on-premises operations
        - One unnamed large financial-services customer reported by Futuriom
        - Customer identity, workload, economics, and production status undisclosed
      - - Cloud SaaS and infrastructure providers
        - Cloud infrastructure leadership
        - Infrastructure, networking, and developer teams
        - Extend platforms beyond public cloud and place workloads nearer customer assets
        - CoreWeave named by Futuriom
        - Deployment scale, measured latency benefit, and repeat orders undisclosed
      - - National laboratories and compute-intensive institutions
        - Laboratory infrastructure and program organizations
        - HPC, research-computing, security, and platform teams
        - High-performance, AI-adjacent, and controlled on-premises computing
        - Lawrence Livermore and Idaho National Laboratories named in independent coverage
        - Rack counts, production status, outcomes, and procurement values undisclosed
    notes: >-
      Segment descriptions combine Tech Field Day's summaries of company presentations,
      Oxide's Carahsoft announcement, and independent named-customer coverage; all scale
      and revenue fields remain undisclosed.
    claimRefs: [CU001, CU002, CU004, CU005, CU006, CU007]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns:
      - Indicator
      - Value
      - Period / date
      - Source character
      - Confidence
      - Implication and missing denominator
    rows:
      - - First commercial product debut
        - Oxide Cloud Computer debuted
        - "2023"
        - Independent coverage citing the company launch
        - Medium
        - Establishes commercialization timing; no first-shipment or installed-base count
      - - Manufacturing capacity change
        - 20x increase
        - Twelve months preceding 2026-10-09
        - Two secondary accounts of company statements
        - Medium
        - Directional scaling signal; starting capacity, racks, and utilization are undisclosed
      - - Demand versus supply
        - Demand reported above current production capacity
        - 2026-10
        - Two secondary accounts of company statements
        - Medium
        - Suggests backlog pressure; order count, value, cancellations, and delivery dates are undisclosed
      - - Public-sector channel availability
        - SEWP V and OMNIA Partners contract access through Carahsoft
        - "2026-09-24"
        - Company and channel announcement
        - Medium
        - Reduces procurement friction; does not establish agency orders or deployments
      - - Federal workflow anecdote
        - Work described as moving from months to hours
        - 2024 presentation
        - Event summary of a company presentation
        - Low
        - Potential outcome signal; unnamed customer and no measured baseline or independent validation
    notes: >-
      Values are reported indicators rather than audited customer metrics. Funding,
      backlog, and capacity are not treated as customer count, recurring revenue, or
      retention, and undisclosed denominators are stated explicitly.
    claimRefs: [CU003, CU007, CU009, CU010, CU012]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs. pilot
      - Public outcome
      - Limitation
    rows:
      - - Lawrence Livermore National Laboratory
        - National laboratory
        - AI workloads reported by Futuriom
        - Not disclosed
        - No quantified outcome disclosed
        - Single independent article; rack count, date, and reference testimony absent
      - - CoreWeave
        - Cloud infrastructure provider
        - AI workloads reported by Futuriom
        - Not disclosed
        - No quantified outcome disclosed
        - Single independent article; deployment scope and repeat purchase absent
      - - Idaho National Laboratory
        - National laboratory
        - Commercial customer; workload not specified
        - Not disclosed
        - No quantified outcome disclosed
        - Single independent article; contract, scale, and deployment status absent
    notes: >-
      This is a partial enumeration limited to customers named in the assigned,
      successfully prefetched evidence; references do not establish production status,
      rack count, contract value, retention, or expansion.
    enumerationScope:
      coverage: partial
      basis: >-
        Customers explicitly named in assigned independent sources reviewed through
        2026-10-20; unnamed and NDA-bound deployments are excluded.
    claimRefs: [CU005, CU006, CU014]
figures:
  - id: FU001
    title: Evidence-backed customer journey and unresolved expansion loop
    type: journey-map
    summary: >-
      Public evidence supports need recognition, procurement access, deployment claims,
      and selected use anecdotes, but not the repeat-order and retention loop.
    data:
      nodes:
        - id: need
          label: Need recognition
          detail: >-
            Federal, financial, and cloud-SaaS buyers seek control, lower integration
            burden, or deployment nearer customer data.
          touchpoints:
            - Company presentations
            - Independent market coverage
        - id: evaluation
          label: Technical evaluation
          detail: >-
            Buyers evaluate an integrated rack against incumbent private-cloud stacks
            and hyperscaler options; AI-processing fit remains a reported question.
          touchpoints:
            - Cloud Field Day demonstration
            - Architecture and workload review
        - id: procurement
          label: Procurement
          detail: >-
            Direct enterprise buying is supplemented by Carahsoft reseller access and
            named SEWP V and OMNIA Partners contracts for public-sector buyers.
          touchpoints:
            - Carahsoft
            - Reseller partners
            - Contract vehicles
        - id: deployment
          label: Installation and provisioning
          detail: >-
            Oxide claims the integrated system can be operational within hours of
            delivery, but public customer-level deployment timing is unavailable.
          touchpoints:
            - Rack installation
            - API, CLI, and console provisioning
        - id: realized-use
          label: Workload use
          detail: >-
            Company-presented anecdotes describe faster federal workflows and cloud-SaaS
            placement nearer customer assets, without independent quantified baselines.
          touchpoints:
            - Federal infrastructure teams
            - Cloud-SaaS platform teams
        - id: expansion
          label: Repeat order and expansion
          detail: >-
            Backlog and supply pressure suggest demand, but public sources do not disclose
            renewal, retention, expansion cohorts, or second-rack purchase rates.
          touchpoints:
            - Support experience
            - Additional rack orders
            - Renewal and expansion review
    approximationNotes: >-
      The sequence is an analytical journey assembled from public touchpoints, not a
      measured funnel; no conversion rates, durations, or stage populations are known.
    claimRefs: [CU002, CU003, CU004, CU007, CU008, CU010, CU015, CU016]
callouts:
  - calloutType: risk
    title: Demand evidence is not durability evidence
    body: >-
      Manufacturing growth, backlog, and financing indicate supply pressure but cannot
      substitute for customer count, retained revenue, renewal, repeat-rack orders, or
      concentration data.
    claimRefs: [CU009, CU010, CU011, CU015]
