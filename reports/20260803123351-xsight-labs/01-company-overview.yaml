- id: milestones-customer-proof-and-public-scale
  title: Milestones, Customer Proof, and Public Scale Signals
  body: 'Public milestones show Xsight moving from a stealth-era merchant-silicon startup into a visible AI-networking infrastructure vendor. Portfolio material says the company emerged from stealth in December 2020 around the X1 25.6T switch generation. Since then, the external story shifted from conceptual Ethernet programmability toward concrete product availability: the X2 switch announcement in October 2024, E1 DPU technical exposure in early 2025, SONiC-DASH Hero 800G validation in mid-2025, and a Starlink V3 satellite selection publicized in 2026. Those events matter because they show Xsight crossing from roadmap talk into ecosystem proof points that third parties can react to.


    The Starlink design win is the highest-signal customer proof available publicly. Multiple sources state that SpaceX’s Starlink selected the X2 as core networking silicon for next-generation V3 satellites. That does not prove broad hyperscaler production revenue, but it does prove that at least one demanding customer environment was willing to trust Xsight’s power, programmability, and environmental qualifications. Partner materials add further evidence that the company’s silicon is being integrated into Edgecore add-in cards, Interface Masters smart-switch appliances, Hammerspace storage designs, and production-monitoring flows with proteanTecs and Veriest.


    Scale signals remain mixed rather than absent. Archived company pages advertise 250+ employees globally and $430M+ funding, a 2022 proteanTecs case study cites 190 employees, and engineering field-day material describes over 200 engineers. That is enough to conclude Xsight is a substantial late-stage engineering organization, but not enough to publish a single high-confidence headcount metric without a range and caveat. Revenue, ARR, customer count, and design-win conversion remain private.'
