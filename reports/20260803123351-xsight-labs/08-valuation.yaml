    topic: customer-concentration
    statement: Public evidence does not reveal top-customer or top-partner concentration.
    priority: high
    whyItMatters: Concentration can dominate both upside and downside at this stage.
    suggestedResearch: Request top-account revenue, backlog, and pipeline concentration.
    relatedQuestionRefs:
