  - id: GV001
    topic: revenue-and-margin
    statement: No retained source discloses revenue, gross margin, or contribution margin by product line.
    priority: high
    whyItMatters: These metrics determine whether the current price is attractive or already full.
    suggestedResearch: Request trailing revenue, margin waterfalls, and forecast by product.
