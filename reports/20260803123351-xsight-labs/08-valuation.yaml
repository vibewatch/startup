- id: recommendation-and-final-diligence-asks
  title: Recommendation, Confidence, and Final Diligence Asks
  body: 'The best recommendation from public evidence is a selective “research more / conditional engage” rather than a clean go or no-go. Confidence should be medium: enough evidence exists to justify deeper work, but not enough to declare the price attractive without seeing private metrics. Risk rating should be high because the company combines capital intensity, customer concentration, supply-chain exposure, and a narrow commercialization window.


    What would move the call most is not more category narrative. It is a short list of underwriting-quality disclosures: trailing revenue and run-rate, gross margin by product family, top-customer concentration, backlog and pipeline-stage detail, working-capital obligations, and evidence that named proof points are becoming repeat programs. If those data are strong, the public case could upgrade materially. If they disappoint, the current mark could already be rich.'
