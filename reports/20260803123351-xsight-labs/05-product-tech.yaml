- id: roadmap-maturity-and-main-technical-gaps
  title: Roadmap Maturity and the Main Remaining Technical Gaps
  body: 'The visible roadmap is enough to conclude that Xsight is beyond concept stage. X1-era material, the X2 launch, E1 technical exposure, SONiC-DASH validation, and multiple partner announcements all point to a company shipping and integrating real silicon generations. But the public roadmap is still incomplete for underwriting purposes. The sources do not provide a fully audited release cadence, long-term SKU map, manufacturing partner disclosures, or broad field reliability stats across many customers.


    The resulting maturity conclusion is positive but disciplined. Xsight appears technically credible, well aligned to open Ethernet and DPU demand, and capable of supporting real platforms. Yet important gaps remain around certification breadth, deployment scale, and exact next-generation roadmap commitments. Those are normal late-stage private-company gaps, but they matter because the valuation assumes this technical platform will compound into durable customer adoption. publicly.'
