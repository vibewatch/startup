  - id: GE001
    topic: reliability-metrics
    statement: No retained source provides broad field reliability or failure-rate data across many customer deployments.
    priority: high
    whyItMatters: Reliability is central to infrastructure underwriting.
    suggestedResearch: Request RMA data, uptime metrics, failure analysis, and major incident history.
