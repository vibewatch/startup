summary:
  headline: >-
    Xsight looks like a credible AI-networking semiconductor challenger with unusually strong public proof for a private
    chip company, but the July 2026 $2.8 billion valuation still appears stretched until private diligence fills in the
    revenue, margin, concentration, and working-capital denominators.
