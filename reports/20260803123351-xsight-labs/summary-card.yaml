  topStrengths:
    - >-
      Public evidence supports real product depth across X-Series switches and E-Series DPUs rather than a one-SKU
      story.
    - >-
      Xsight has unusually strong named proof for a private semiconductor startup, including Starlink, Hammerspace,
      Edgecore, and Interface Masters.
    - >-
      The company is well aligned to the AI-networking push toward Ethernet fabrics, programmability, and
      power-efficient infrastructure.
  topRisks:
    - Public evidence still does not disclose revenue, gross margin, backlog quality, or top-customer concentration.
    - >-
      The current $2.8B mark may already capitalize a large portion of the upside before diversified production
      economics are visible.
    - >-
      Packaging, supply-chain, regulatory, and commercialization risks can compound quickly in a capital-intensive
      hardware business.
    - A small number of customers and partners likely drive a disproportionate share of current proof and downside risk.
  unresolvedGaps:
    - Revenue by product, gross margin, and working-capital obligations remain undisclosed.
    - Top-customer concentration, renewal behavior, and repeat-program conversion are not public.
    - Lifetime capital raised and current preference stack are not fully reconciled in public sources.
    - Broad reliability, certification, and scaled deployment metrics remain thinner than the valuation headline.
