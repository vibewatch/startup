      - number: '8.4'
        title: 建议、信心和最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              仅凭公开证据，最佳建议是选择性“继续研究 /
              有条件接触”，而不是直接通过或否决。信心应为中等：现有证据足以支持深入工作，但若没有看到私有指标，还不足以断言价格有吸引力。风险评级应为高，因为公司同时具备资本强度、客户集中度、供应链暴露和狭窄商业化窗口。


              最能改变判断的，不是更多品类叙事，而是一小组能支撑投资判断的披露：过去收入和当前年化收入、按产品系列拆分的毛利率、头部客户集中度、未交付订单与销售管线阶段细节、营运资本义务，以及具名证明点正在变成重复项目的证据。如果这些数据强，公开案例可能显著上调。若数据令人失望，当前估值可能已经偏贵。
