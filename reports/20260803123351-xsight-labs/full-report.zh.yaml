      - number: '1.3'
        title: 融资历史、估值跃升和资本化信号
        blocks:
          - type: paragraph
            body: >-
              支撑最扎实的融资事实是最新一轮：Xsight 于 2026 年 7 月下旬完成超过 $300M 融资，投后估值 $2.8B，由 Fidelity Management & Research 领投，Intel
              Capital、Battery Ventures、Valor Equity Partners、T. Rowe Price、Maverick Capital
              等广泛财团参与。以色列独立报道补充了关键背景：该估值是公司 2021 年约 $500M 估值的五倍以上，意味着这是与 AI 网络资本周期一致的大幅重定价，而非平稳线性增长。


              更早的融资时间线方向清楚，但没有完全标准化。Starlink 相关报道称，当前热潮前 Xsight 已通过四轮融资超过 $150M，首轮由 Avigdor Willenz 领投，第二轮由 Intel 和
              Microsoft 领投，2020 年又完成 Intel 领投的超过 $50M 融资。公司资料库和存档公司页面给出的累计融资额更高，包括约 $380M 或 $430M，是否包含 2026
              年轮次取决于来源版本。稳妥解读是，公开来源都认可公司累计获得大量资本支持，并吸引了多个蓝筹战略投资者或跨界投资者；但中间轮次还没有干净对齐到足以做精确股权结构分析。


              资金用途比股权结构细节更容易理解。2026 年融资明确用于多代交换芯片和 DPU 路线图执行、制造和供应链扩张、工程与客户支持招聘，以及高产量 Tier-1
              客户交付。这说明该轮融资意在把技术设计导入转化为可靠履约，而不只是延长研发现金续航。因此，估值同时反映产品雄心和加速商业牵引的主张，尽管公开收入仍未披露。
