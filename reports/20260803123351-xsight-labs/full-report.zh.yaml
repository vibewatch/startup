      - number: '2.4'
        title: 这种市场结构对 Xsight 真实机会意味着什么
        blocks:
          - type: paragraph
            body: >-
              思考 Xsight 市场时，最好不要把它看成对「AI 基础设施」的泛化敞口，而要看作对少数决定性基础设施迁移的杠杆。第一，以太网正在更深进入 AI
              后端网络。第二，运营方在寻找能提升可编程性、避免硬锁定到单一芯片或互连技术栈的架构。第三，系统厂商需要差异化商用部件，把它们组合成参考平台、存储设计或专用设备 SKU。只要 Xsight 的交换芯片和 DPU
              路线图保持技术竞争力，每个变化都可能利好它。


              不过，市场不会只奖励愿景。Xsight 可达 SOM
              很可能不由广义品类规模决定，而由多少大客户愿意认证新的商用芯片供应商、以及这些胜利能向衍生平台带出多少份额决定。公开证据足以说明市场机会大、时点有利，但还不足以精确隔离 Xsight
              的近期份额。因此，尽调应聚焦具名管线、认证阶段和平台转化，而不是越来越大的 TAM 叙事。


              简言之，市场背景支持真实机会存在，也帮助解释投资者热情。但如果没有客户级证明，它本身不能支撑任何具体收入预期或估值倍数。
