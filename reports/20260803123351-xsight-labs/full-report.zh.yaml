  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群看起来是谁
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Xsight 的客户宇宙很窄、技术门槛高，且战略性显著。最可见的类别是类似超大规模云或任务级运营方、OEM 和 ODM
              平台厂商、专用设备制造商、存储网络创新者，以及验证先进芯片的工程组织。公开叙事并没有把 Xsight 描绘成向数百个普通 IT 部门销售的广义企业供应商。相反，它似乎卖入的是架构决策数量少但影响巨大的项目。


              这种细分意味着，客户群更多由平台角色定义，而不是由客户标识数量定义。单个超大规模、卫星或专用设备设计导入的价值，可能高于几十个较小普通账户；而一个大项目流失或延迟，也可能实质影响商业动能。因此，最重要买方角色似乎是基础设施架构师、产品线负责人，以及构建差异化网络或存储平台的工程团队，而不是泛化网络管理员。这一点非常清楚。
