    type: dag
    layout: wide
    summary: 产品依赖芯片执行力、软件开放性和伙伴平台。
    data:
      nodes:
        - id: d1
          label: 代工 / 封装
          detail: 核心半导体生产依赖
          type: dependency
        - id: d2
          label: 开放软件生态
          detail: Linux / SONiC 兼容性和社区势能
          type: dependency
        - id: d3
          label: 伙伴平台
          detail: Edgecore、设备与存储方案落地
          type: dependency
        - id: d4
          label: 验证 / 校验
          detail: 测试、遥测和工程质量证据
          type: dependency
        - id: d5
          label: Xsight 交换 / DPU 产品
