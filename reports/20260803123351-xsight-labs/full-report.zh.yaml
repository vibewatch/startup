  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 几类风险可能叠加，造成收入延迟和估值压力。
    data:
      nodes:
        - id: n1
          label: 出口管制摩擦
          note: 许可或客户地域限制出现
          type: risk
        - id: n2
          label: 封装 / 供应延迟
          note: 批量交付或成本底座滑坡
          type: risk
        - id: n3
          label: 认证放缓
          note: 较少评估转入生产
          type: risk
        - id: n4
          label: 客户集中度
          note: 过少账户承载过多经济权重
          type: risk
        - id: n5
          label: 收入延迟
          note: 收入确认和积压订单兑现滑坡
