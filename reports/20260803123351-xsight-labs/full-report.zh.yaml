      - number: '2.2'
        title: 买方细分、预算负责人和真实采用路径
        blocks:
          - type: paragraph
            body: >-
              买方地图异常集中。近期最有价值的账户是超大规模云厂商、AI 云服务商、大型 OEM 和 ODM
              系统厂商、卫星网络运营商，以及少数打造差异化专用设备的存储和基础设施专家。在这些环境里，经济买方很少只是泛化网络团队。采购通常横跨基础设施架构、芯片工程、系统设计、运营和财务，因为网络决策会影响 GPU
              利用率、机架功耗、散热密度、软件栈兼容性，以及长期平台路线图。


              采用路径也不同于普通企业网络。新的 AI
              网络组件不会从市场宣传直接进入广泛生产。它通常要经历架构评审、互操作测试、实验室验证、有限设计导入、平台认证，再逐步量产爬坡。SONiC、开放以太网、合作伙伴设备和参考平台周边来源暗示，开放性和可编程性有助于
              Xsight 进入讨论，但不会消除认证负担。买方既想避免专有锁定，也想避免运营倒退，因此在给出有意义份额前，会要求证明每瓦性能、软件兼容性和运营工具链。


              只有能跨过苛刻验证门槛，创业公司才会受益于这种采用模型。如果 Xsight
              的产品继续在合作伙伴平台和高强度用例中得到验证，买方集中反而可以是优点，因为少数胜利就能带来巨大收入爬坡。否则，同样的集中度会让实际可服务市场急剧缩小。
