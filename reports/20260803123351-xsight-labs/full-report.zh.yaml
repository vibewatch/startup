figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: standard
    summary: Xsight 2017 年创立后，凭产品发布、验证节点、合作伙伴嵌入和 2026 年融资跃升，进入公开 AI 网络叙事。
    data:
      items:
        - date: '2017'
          label: 创立
          detail: Guy Koren、Erez Shaizaf 和 Gal Malach 在以色列创办 Xsight Labs。
          tone: positive
        - date: 2020-12
          label: 走出隐身期
          detail: 围绕 X1 世代和早期投资人背书，公开记录开始成形。
          tone: positive
        - date: 2022-09
          label: 裁员事件
          detail: 一次公开追踪到的裁员显示早期运营曾有波动。
          tone: warning
        - date: 2024-10
          label: X2 发布
          detail: 公司推出 12.8Tbps 可编程以太网交换机。
          tone: positive
        - date: 2025-01
          label: E1 亮相
          detail: 技术报道详述一款配备 Arm N2 核心的 800G DPU。
          tone: positive
        - date: 2025-07
          label: DASH Hero 验证
          detail: E1 完成 SONiC-DASH Hero 800G 验证，达到 14.25M CPS 且零丢包。
          tone: positive
        - date: 2025-10
          label: 合作伙伴平台
          detail: Edgecore、Interface Masters 和 Hammerspace 发布基于 E1 / X2 的系统。
          tone: positive
        - date: 2026-07
          label: 赢得 Starlink V3
          detail: X2 被选入下一代 Starlink 卫星。
          tone: positive
        - date: 2026-07
          label: Series E / 交叉轮
          detail: $300M+ 融资将估值定在 $2.8B。
          tone: positive
    claimRefs:
      - CO001
      - CO017
      - CO022
      - CO025
      - CO026
      - CO028
      - CO033
  - id: FO002
    title: 公司快照逻辑
    type: flow
    layout: standard
    summary: Xsight 把以色列网络技术积累、开放架构、双产品芯片和 AI 网络需求串在一起，支撑当前估值叙事。
    data:
      nodes:
        - id: founders
          label: EZchip 血脉
          detail: 创始人来自以色列包处理生态。
          tone: positive
