  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反向论点
        blocks:
          - type: paragraph
            body: >-
              投资论点很直接。Xsight 处在一个具有战略重要性的 AI 网络层，以太网交换、DPU、功耗效率和开放网络 fabric 可编程性都在变得更重要。公司有真实产品、严肃资本背书，也有具名客户或伙伴证明，包括
              Starlink、Hammerspace、Edgecore 和 Interface Masters。如果公司能把这些证明转成超大规模云厂商、AI 云和 OEM
              平台上的重复订单，上行空间会很大，因为少数项目就可能承载超额经济价值。


              反向论点同样清楚。在价格纪律最看重的指标上，公开证据仍落后于头部估值。投资人能看到强品类、连贯的技术栈和令人鼓舞的客户证明，但看不到收入、利润率、集中度或未交付订单。同时，竞争窗口很窄，既有巨头有规模、供应和捆绑优势。因此，反向论点不是
              Xsight 没有前景，而是外部人还无法验证硬经济指标之前，价格可能已经把太多好故事资本化了。
            claimRefs:
