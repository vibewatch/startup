        - from: n4
          to: n5
          label: 单一账户权重过高
        - from: n5
          to: n6
          label: 现金转化变弱
        - from: n6
          to: n7
          label: 进一步稀释或扩张放慢
        - from: n3
          to: n7
          label: 差异化窗口收窄
