      - number: '7.4'
        title: 财务风险、缓释因素和打穿论点的触发点
        blocks:
          - type: paragraph
            body: >-
              Xsight
              的财务和战略风险，不只是烧钱。真正的问题是，高资本强度、集中的商业证明和快速移动的竞争窗口可能彼此强化。如果公司能按计划转化少数重大项目，融资和估值看起来会很有先见之明。若节奏落空，同样的资本需求和集中度结构，会放大稀释，并削弱它与客户、投资人或供应商谈判的筹码。


              正确的纪律，是先定义可监控的触发项。出口管制摩擦、封装延迟、伙伴集中、认证爬坡失败，或开放性优势下降，都应实质性改变投资判断。反过来，更多具名量产胜利、更多元的平台转化，以及披露出的营运资本纪律，会降低风险画像。核心结论是：Xsight
              的主要风险足够可测，可以监控；但今天的公开信息还不足以让投资人把它们排除。
