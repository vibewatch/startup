      - number: '8.3'
        title: 牛市 / 基准 / 熊市情景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              牛市情景是，买家越来越需要灵活性、功耗效率和封闭平台锁定之外的选择，Xsight
              因此成为可信的开放以太网赢家。在这种情景下，少数旗舰订单扩展成更广泛的项目，伙伴平台可以复制，公司估值看起来更像一轮更大商业爬坡的早期标记。熊市情景不只是产品失败，而是商业化继续集中且披露不足，同时既有巨头压缩差异化窗口。那样一来，公司可能技术上仍然相关，但经济上被高估。


              仅凭公开证据，基准情景介于两者之间。Xsight
              值得继续深入，而不是不计价格地确信。入场纪律因此应聚焦哪些信息会改变判断：收入披露、集中度清晰度、重复量产爬坡证据，以及资本强度正在转化为多元商业动能，而不只是战略可选性的证明。
