  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出，以及为什么单一大 TAM 数字会误导
        blocks:
          - type: paragraph
            body: >-
              第一步是界定 Xsight 实际卖入的市场。公司不是泛数据中心网络供应商，也不是全栈 AI 基础设施平台。它的产品范围位于更窄但战略重要的一层：用于 AI 后端、前端和存储网络的以太网交换
              ASIC、DPU，以及相关软件定义网络功能。这意味着相关市场包括面向 AI 集群的商用与半定制以太网交换芯片、主机侧卸载和可编程包处理，以及通过 OEM
              或合作伙伴设计捕获的部分相邻平台价值。它不包括大多数企业园区网络、广义电信路由，也不包括 GPU、服务器或存储系统的全部支出池，除非网络芯片价值嵌入其中。


              已发布市场来源方向一致，但数字不一致。IDC 显示，2026 年初数据中心以太网交换市场快速上行，AI 后端需求是主要贡献者。Dell’Oro 将 AI
              后端网络描述为一个特殊增长口袋，支出强度极高。NVIDIA、Cisco、DriveNets、Ultra Ethernet Consortium 和 Ethernet Alliance
              的官方表述也都强化了这一点：以太网现在不仅被定位为前端网络，也被定位为可信的 AI 互连介质。话虽如此，这些来源描述的市场定义彼此重叠但并不相同。最干净的尽调姿态，是使用分层测算：广义上限基于 AI
              网络基础设施，中间层基于以太网交换和 DPU 搭载，狭义可达层则基于能够认证新商用芯片的超大规模云和 OEM 项目子集。


              这个边界重要，因为它守住估值纪律。「AI 网络很大」这个说法方向正确，但对决策帮助有限。Xsight
              近期收入池取决于能否拿下一小批超大型网络、服务器或平台项目；这些项目认证周期长，输给现有玩家的代价高。市场扩张速度足以重要，但既不是无摩擦，也不是可以无限分食。
