chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、阶段，以及 Xsight 实际卖什么
        blocks:
          - type: paragraph
            body: >-
              Xsight Labs 是一家无晶圆厂半导体公司，卖的是面向 AI 和超大规模数据中心的智能互连芯片，而不是端到端系统全栈。最清晰的公开描述都指向两条主产品线：X-Series 可编程以太网交换芯片，以及
              E-Series 数据处理单元。这些部件被包装成开放、软件定义的基础设施积木，服务于超大规模云厂商、边缘运营商、OEM 和 AI
              云建设者；这些客户想要以太网网络架构，又不愿被封闭专有网络架构锁住。公司近期叙事强调可编程数据平面、标准 Linux 与 SONiC 兼容性，以及相对现有交换芯片或 DPU 产品的更低功耗。


              身份信息大体一致，但没有完全标准化。2026 年 7 月融资公告称 Xsight 总部在 Tel-Aviv，并在 Kiryat Gat 和 Haifa 设有办公室；其他公司相邻资料和投资组合来源则把 Kiryat
              Gat 描述为总部或管理基地。务实结论是，Xsight 是一家以色列半导体公司，在 Tel Aviv、Kiryat Gat、Haifa 均有运营存在，并在 Boston、Raleigh、San
              Jose、Yerevan 形成商业足迹。公司成立于 2017 年，已不再是早期隐身项目：它现在把自己定位为一家后期私有基础设施公司，正在把真实芯片交付到客户评估、合作伙伴平台，以及至少一个高可见度设计导入中。


              Xsight 的商业论点不是孤立地再做一颗「交换芯片」。它想同时提供主机侧和网络侧芯片，服务以以太网为中心的 AI
              与云网络架构，再让运营方或合作伙伴用开放软件模型编程这些设备，而不是等封闭供应商的路线图。这个定位很关键，因为它解释了为什么投资者似乎愿意在公开收入披露前承销数十亿美元估值：卖点是它在 AI
              网络技术栈中的架构相关性，而不是狭窄零部件销售。
