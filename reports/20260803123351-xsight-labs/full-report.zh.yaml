      - number: '7.3'
        title: 伙伴、客户和人员风险高度集中，而且彼此联动
        blocks:
          - type: paragraph
            body: >-
              Xsight 的几项公开优势，也带来了相应的集中度风险。客户故事依赖少数具名高价值项目和伙伴。上市路径在很大程度上依赖 Edgecore、Interface Masters、Hammerspace
              以及类似生态参与者。技术故事依赖开放软件和集成成熟度，商业故事则依赖有限数量的成熟买家把证明转成规模。这条路可行，但会产生传导风险：伙伴放慢、客户推迟，或认证失败，影响都可能被放大。


              人员和执行风险也重要。公司的公开叙事仍高度依赖少数可见创始人、技术声音和资本市场信号。裁员和员工压力来源不能证明当前存在危机，但它们提醒我们，半导体执行周期很长，中途可能经历重置。对一家公开运营披露有限的私有公司而言，工程领导力、支持能力和内部项目管理能否持续，仍是一个重要的未解变量。
