      - number: '7.2'
        title: 运营风险集中在供应链、封装、可靠性和 AI 功耗约束
        blocks:
          - type: paragraph
            body: >-
              从运营角度看，公司最大的风险在于先进硅片商业化容错率极低。封装约束、对晶圆厂的依赖、库存节奏和现场可靠性会同时起作用。AI
              数据中心需求把赌注抬得更高，因为客户关心的不只是芯片能不能跑，还关心它能否按量交付、符合功耗包络、接入自身运营栈，并在高强度负载下保持可靠。关于封装瓶颈、半导体供应韧性和 AI
              能源需求的公开报道，都支持一个判断：即便技术很强，公司也可能被设计实验室之外的因素卡住。


              可靠性和质量风险在公开层面同样披露不足。验证伙伴和客户证明让人相信公司重视工程严谨性，但留存来源没有展示广泛 RMA
              率、机群故障数据或大型公开事故记录。因此，运营风险不能被视为微不足道。它应被看作最关键的打穿投资论点区域之一：如果供给、良率、封装或可靠性在狭窄市场窗口里不及预期，估值重置会比技术路线图来得更快。
