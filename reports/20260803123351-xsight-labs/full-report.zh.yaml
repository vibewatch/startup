      - number: '1.5'
        title: 主要未解缺口与负面背景
        blocks:
          - type: paragraph
            body: >-
              最重要的缺失数据不是技术，而是财务和商业。本文审阅的公开来源没有披露收入、ARR、毛利率、客户数，或从评估实验室转为生产合同的转化率。对资本密集型半导体创业公司而言，这一缺失是实质性尽调缺口，因为估值建立在产品未来被采用之上，而这些产品现在才进入更广泛市场验证。


              公开负面背景有限，但不是零。裁员追踪证据指向 2022 年 Tel Aviv 有过一次据称的裁员，说明公司在当前 AI 网络动能前至少经历过一次调整期。这并不推翻 2026
              年叙事，但说明路径并非直线。更重要的是，几个公司相邻来源对总部定义和累计融资额使用了略有不同的口径。这类不一致对私有创业公司很常见，但仍重要，因为它说明管理层当前呈现比底层历史公开记录更光滑。


              因此，本章结论是建设性但克制。Xsight
              显然有真实产品、重要投资者和有意义的外部验证；但它仍是一家私有芯片公司，头部估值跑在外部可见透明度之前。后续章节需要检验市场规模、技术差异化、客户证据和风险画像是否支撑这一估值跃升。
