      - number: '1.4'
        title: 里程碑、客户验证和公开规模信号
        blocks:
          - type: paragraph
            body: >-
              公开里程碑显示，Xsight 正从隐身期商用芯片创业公司，转向可见的 AI 网络基础设施供应商。投资组合材料称，公司于 2020 年 12 月围绕 X1 25.6T
              交换芯片一代走出隐身。此后，外部叙事从概念性的以太网可编程性，转向具体产品可用性：2024 年 10 月发布 X2 交换芯片，2025 年初披露 E1 DPU 技术，2025 年中完成 SONiC-DASH
              Hero 800G 验证，2026 年公开 Starlink V3 卫星选用。这些事件重要，因为它们显示 Xsight 已从路线图叙事进入第三方可以回应的生态验证阶段。


              Starlink 设计导入是公开可见的最高信号客户验证。多个来源称，SpaceX 的 Starlink 选择 X2 作为下一代 V3
              卫星的核心网络芯片。这不能证明广泛超大规模云生产收入，但能证明至少一个要求严苛的客户环境愿意信任 Xsight 的功耗、可编程性和环境资质。合作伙伴材料进一步显示，公司芯片正在被集成进 Edgecore
              加速卡、Interface Masters 智能交换设备、Hammerspace 存储设计，以及与 proteanTecs 和 Veriest 的生产监测流程。


              规模信号不是缺席，而是混合。存档公司页面宣称全球 250+ 名员工和 $430M+ 融资，2022 年 proteanTecs 案例研究提到 190 名员工，工程技术展示日材料描述有 200 多名工程师。足以判断
              Xsight 是一家实质性的后期工程组织，但若没有区间和限定说明，还不足以发布单一高置信员工数指标。收入、ARR、客户数量和设计导入转化仍属私密。
