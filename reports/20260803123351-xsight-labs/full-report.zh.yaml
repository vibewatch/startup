      - number: '3.2'
        title: 能力、封装和平台比较
        blocks:
          - type: paragraph
            body: >-
              Xsight 最强的竞争信息，不是它在每个维度都超过所有现有玩家，而是它提供了一个可编程、以太网原生的替代方案，可以灵活嵌入白盒、专用设备或专业化设计。保留来源反复显示，竞争对手强调的优势各不相同。NVIDIA
              强调 BlueField DPU、以太网交换和 AI 网络软件的组合。Broadcom 强调商用交换芯片广度。Cisco 和 Arista 强调数据中心系统信誉和分布式支持。Marvell 和 AMD 将其
              DPU 与交换资产定位为高效基础设施积木。DriveNets 强调以太网 AI 网络作为全栈运营方案。


              这些路径带来不同采购取舍。现有玩家通常赢在生态深度、供应规模和买方熟悉度。Xsight
              试图在买方最看重可编程性、开放软件对齐和平台级灵活性，且不愿把路线图交给封闭单一供应商时胜出。这意味着公司不需要在每个属性上击败每个对手；它需要在少数决定性属性上，对重视开放性和差异化系统设计的客户明显更好。
