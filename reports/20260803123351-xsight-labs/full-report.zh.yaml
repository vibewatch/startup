      - number: '2.3'
        title: 市场为何快速扩张，以及为何仍有真实摩擦
        blocks:
          - type: paragraph
            body: >-
              最强增长驱动很简单：AI 集群正在把网络从支撑子系统，变成决定昂贵加速器利用率的直接因素。NVIDIA、DriveNets、Cisco
              和市场分析师都把网络描述为规模、调度效率或训练时间的限制项。随着集群扩大，以太网交换带宽、主机卸载、拥塞控制、遥测和可编程性都更值钱。电力叙事进一步强化了紧迫性。IEA 分析显示，数据中心电力需求会随 AI
              采用明显上升，这推动买方向更高效的网络设计迁移，也抬高了低功耗交换芯片和 DPU 架构的价值。


              同时，采用约束真实存在。半导体封装和供应链瓶颈仍然重要；即使芯片设计胜出，高产量交付仍取决于晶圆厂、封装和库存准备。出口管制政策依然相关，因为先进网络芯片与更广泛半导体贸易管制和地缘政治审查交叉。软件仍是决定性关口：一颗技术优雅但难以接入
              SONiC、OEM 参考平台或客户运营流程的芯片，即便硬件指标强，也会输。市场奖励的不只是带宽，还有集成成熟度。


              对 Xsight 来说，含义是开放性不是口号，而是 ROI 论证的一部分。买方想要基于以太网的 AI
              网络架构，既保留多供应商选择、降低功耗，又能让运营方用软件调校行为。但他们也希望拿到这些好处时，不承担过高执行风险。这种张力解释了品类热度，也解释了真实量产胜利为何如此挑剔。
