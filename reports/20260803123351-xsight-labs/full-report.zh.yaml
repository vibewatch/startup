  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: Xsight 卖什么，收入可能如何体现
        blocks:
          - type: paragraph
            body: >-
              公开证据最强的是产品形态，而不是已报告收入。Xsight 看起来主要通过 B2B
              销售交换芯片、DPU，以及由合作伙伴主导的平台或参考设计变现，而不是通过经常性软件订阅。收入可能来自设计导入、芯片出货、围绕集成的支持或使能，以及部署所需的软件或工具配套。公开记录没有显示的是定价、合同期限、出货节奏，或
              Xsight 与 OEM 或解决方案伙伴之间如何分配价值。


              这个区别重要，因为硬件基础设施收入质量与软件差异很大。销售周期更长，库存风险更关键，毛利率取决于制造和封装经济性，营运资金可能在收入确认跟上前先扩张。Edgecore、Hammerspace、Interface
              Masters 和 Starlink 相关证据说明，Xsight 正在推进平台和设计导入式商业化，但没有披露已实现
              ASP、续约动态或按产品系列划分的贡献利润率。正确的财务解读因此是零部件与平台收入，交易集中度高、可见度滞后，而不是简单 ARR 驱动模式。
