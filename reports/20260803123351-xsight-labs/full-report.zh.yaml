            body: >-
              投资质量结论是平衡的。Xsight
              显然有资本入口、真实产品项目和足够外部验证，支撑未来可观收入潜力这一判断。但公开证据还不足以对毛利率、回本、现金转化、订单积压质量、客户集中度或收入耐久性作出精确判断。对一家数十亿美元估值的半导体公司而言，这些不是可选细节。


              因此，正确结论不是「财务很弱」，而是「公开财务证明不完整」。如果 Xsight
