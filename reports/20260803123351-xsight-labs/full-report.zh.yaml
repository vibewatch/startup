              另一方面，一旦完成认证，切换成本可能变成 Xsight 的优势。如果它的交换芯片或 DPU 被设计进平台、通过开放软件验证，并绑定差异化专用设备或存储设计，移除并不简单。因此，今天的护城河不是纯 IP
