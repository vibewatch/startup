  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 该建议沿着市场、产品、验证、风险和价格纪律这条链条展开。
    data:
      nodes:
        - id: n1
          label: 大型战略市场
          detail: AI 网络和开放以太网确实重要
          type: step
        - id: n2
          label: 技术可信
          detail: 产品和生态证据撑得起可行性
          type: step
        - id: n3
          label: 客户验证有限
          detail: 已有具名赢单，但是否分散仍不清楚
          type: decision
        - id: n4
          label: 执行风险高
          detail: 集中度、供应和资本强度仍是实质风险
          type: decision
        - id: n5
          label: 当前 $2.8B 估值
          detail: 仅看公开指标，估值说得通，但谈不上明显便宜
          type: step
        - id: n6
          label: 继续研究 / 有条件接触
          detail: 需要非公开尽调，才能对价格形成正面判断
          type: outcome
      edges:
        - from: n1
          to: n2
          label: 品类值得继续深入
        - from: n2
          to: n3
          label: 需要验证持续性
        - from: n3
          to: n4
          label: 选择性赢单仍留下风险
        - from: n4
          to: n5
          label: 风险决定价格纪律
        - from: n5
          to: n6
          label: 仅靠公开证据，不足以得出明确买入结论
    claimRefs:
      - CV001
      - CV011
      - CV021
      - CV031
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 少数变量主导当前估值看起来是合理还是偏贵。
    data:
      items:
        - label: 收入质量可见度
          value: 95
          detail: 公开收入缺位，因此这是最大敏感项
        - label: 客户集中度
          value: 88
          detail: 少数项目可能主导下行或上行
        - label: 封装 / 供应执行
          value: 78
          detail: 即便需求强劲，也可能拖慢爬坡
        - label: 开放性带来的赢单持续性
          value: 74
          detail: 竞争切口必须能顶住在位厂商
        - label: 品类估值倍数支撑
          value: 62
          detail: 能解释估值标记，但替代不了公司层面的验证
    approximationNotes: 分数是序数型敏感性权重，不是模型测算的估值变动。
    claimRefs:
      - CV019
      - CV024
      - CV028
      - CV035
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 公开证据支持的结果区间很宽，因为关键公司变量仍未公开。
    data:
      items:
        - label: 公开证据支撑估值的可信度
          low: 2
          mid: 4
          high: 6
          displayValue: Low-to-medium confidence range
          detail: 0-10 序数指标，衡量仅靠公开证据能多大程度支撑当前估值。
          tone: warning
        - label: 验证拓宽后的上行潜力
          low: 5
          mid: 8
          high: 10
          displayValue: Meaningful upside if commercial proof compounds
          detail: 0-10 序数上行信号，假设出现分散的量产赢单。
          tone: positive
        - label: 集中度延续时的下行风险
          low: 4
          mid: 7
          high: 9
          displayValue: Material downside if current proof fails to diversify
          detail: 0-10 序数下行信号，挂钩集中度和执行风险。
          tone: warning
    approximationNotes: 采用序数区间，因为公开来源没有披露可直接做估值模型的硬性收入或利润率数据。
    claimRefs:
      - CV020
      - CV023
      - CV025
      - CV033
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: IC 式打分显示，品类和产品逻辑很强，但以当前价格看，证据质量只是中等。
    data:
      items:
        - label: 市场
          value: High
          detail: AI 网络和以太网主题很强。
          tone: positive
        - label: 产品验证
          value: High
          detail: 产品和具名验证点都真实存在。
          tone: positive
        - label: 护城河持续性
          value: Medium
          detail: 开放性切口有潜力，但尚未充分验证。
          tone: neutral
        - label: 经济性可见度
          value: Low
          detail: 收入和利润率仍未公开。
          tone: warning
        - label: 风险画像
          value: High
          detail: 执行、集中度和供应风险仍是实质风险。
          tone: warning
        - label: 价格吸引力
          value: Medium-Low
          detail: 当前估值说得通，但谈不上明显便宜。
          tone: warning
    claimRefs:
      - CV001
      - CV015
      - CV031
      - CV040
