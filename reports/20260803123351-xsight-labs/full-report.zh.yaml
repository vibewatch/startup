      - number: '1.2'
        title: 创始人、领导层和治理信号
        blocks:
          - type: paragraph
            body: >-
              创始故事格外重要，因为 Xsight 位于以色列网络芯片谱系之内，这条线索贯穿 EZchip 和 Mellanox。多个来源将 Guy Koren、Erez Shaizaf 和 Gal Malach
              识别为创始人，三人都有 EZchip 背景。面向创始人的公开材料和第三方简介尤其突出 Malach，将其作为技术联合创始人和 CTO 声音；公司当前的商业门面则是 CEO Yossi
              Meyouhas。这样的分工指向一种相当典型的后期半导体运营模型：技术上保持创始架构师连续性，对客户和投资者则有外部可识别的执行前端。


              治理可见度参差不齐。公开文章持续把 Avigdor Willenz
              描述为早期支持者和现任董事长；这在战略上有意义，因为他在以色列芯片创业公司中的历史角色代表资本入口和生态信誉。但公开材料没有披露完整的当代董事会名单、委员会结构，或 2026
              年融资后的治理权利。融资报道提到许多机构投资者，却没有重构当前控制版图。作为公开叙事可以接受，但距离完整投资尽调还不够。


              领导层深度更多由合作伙伴、播客和技术展示日材料间接支撑，而非完整透明的组织架构图。Xsight 显然有足够工程深度支撑 5nm 交换芯片和 DPU 项目、合作伙伴集成、生产遥测工作；但相对一家估值已达 $2.8B
              的公司，公开证据仍比预期更薄。治理层面的主要结论是：创始人-市场匹配和生态背书为正面，但正式监督和继任深度仍不完整。
