      - number: '8.2'
        title: 当前价格隐含了什么，哪些可比公司真正有用
        blocks:
          - type: paragraph
            body: >-
              评估 Xsight 估值，最稳妥的框架是把私募轮次背景、公开网络平台可比公司和价值链位置放在一起看。2026 年 $2.8B 的估值，在一个相邻 AI 基础设施公司如 DriveNets 和 Ayar Labs
              也能拿到数十亿美元私募估值、公开网络和半导体龙头也因 AI 相关性被重估的市场里，并不荒唐。但这只能证明资本市场奖励这个品类，不能证明 Xsight 这个具体价格有吸引力。


              可比组必须谨慎使用。NVIDIA、Broadcom、Cisco 和 Arista 等上市公司比 Xsight 大得多、更多元、流动性也强得多，因此它们是背景可比，而不是直接估值匹配。DriveNets 和
              Ayar 等私有同行在阶段和战略叙事上更接近，但仍不是完美类比，因为产品组合和商业化路径不同。结论是，$2.8B 估值在行业内可以解释，但相对于可获得的公开经济证明，要求仍然很高。
