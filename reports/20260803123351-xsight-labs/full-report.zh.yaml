  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: Xsight 实际在和谁竞争
        blocks:
          - type: paragraph
            body: >-
              竞争集合必须按买方要完成的任务来定义，而不是按狭窄产品标签。芯片层面，Xsight 与 Broadcom、NVIDIA、Marvell、AMD Pensando 等现有商用交换芯片和 DPU
              供应商竞争。系统层面，它也与 NVIDIA、Cisco、Arista、DriveNets
              的捆绑式或垂直整合架构竞争，因为许多买方可以通过完整网络平台解决同一个问题，而不是采用新的商用部件。第三类竞争者是现状：继续使用既有以太网或 InfiniBand
              设计、延长当前白盒关系，或推迟平台迁移，直到更大供应商给出更完整参考栈。


              这一点重要，因为 Xsight 很少只按原始端口速率被比较。买方比较的是方案完整度、软件成熟度、生态熟悉度、供应信心，以及把一家更新供应商纳入资本密集型 AI 网络路线图的集成风险。NVIDIA 靠平台广度和
              GPU 邻近性竞争；Broadcom 靠商用芯片现有地位；Marvell 和 AMD 靠 DPU 与交换相邻资产；Cisco 和 Arista 靠网络系统信誉；DriveNets
              靠网络软件和大规模以太网叙事。Xsight 因此在多数决策中是技术可信的挑战者，但不是默认选项。
