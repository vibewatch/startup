              Xsight 官方页面和支持材料一致描述两条主要产品线。X-Series 交换芯片定位为面向超大规模、边缘和 AI 数据中心网络的可编程以太网交换芯片。E-Series 产品线定位为 DPU
              基础设施，可以更靠近主机、存储或专用设备功能。从客户工作流看，公司卖的不是「AI 软件」，而是在高要求环境中移动流量、执行策略、卸载网络和基础设施任务的数据平面积木。


              这个产品定义重要，因为它说明 Xsight
              在架构中的位置。买方会在想构建以太网中心网络、打造差异化机架顶端或专用设备设计，或把更多包处理和存储网络逻辑迁移到专用基础设施芯片时使用这些部件。公开最强用例是合作伙伴平台、AI
              云或存储网络设计，以及重视功耗效率、可编程性或开放性的高度专业化环境。
