  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律风险更关乎制度暴露，而不是当前执法
        blocks:
          - type: paragraph
            body: >-
              Xsight 所处行业贴近先进计算、半导体和 AI
              基础设施管制体系。即便留存来源没有公开指控公司本身存在不当行为，更大的出口管制环境仍然重要：先进网络硅片、封装以及目的地国家限制，都会改变谁可以买、集成或支持某些产品。BIS
              指引、法律提醒、律所摘要和政策分析都指向同一件事：半导体和 AI 基础设施管制正变得更复杂、更具域外效力，也更看重供应链角色，例如晶圆代工、封装和高性能计算部署。


              因此，法律风险不是“今天有没有头条诉讼”，而是“明天制度会有多复杂”。一旦客户地理分布、封装路径或伙伴足迹碰上新收紧的规则，一家私有创业公司可能很快从常规商业化滑入许可证、尽调或交易对手摩擦。Xsight
              也没有公开大量合规细节，外部人看不到它的出口管制流程有多成熟。这并不证明它薄弱，只说明这项风险仍未解决，必须纳入投资判断。
            claimRefs:
              - CR001
