    - 封装、供应链、监管和商业化风险，在资本密集型硬件业务里会很快叠加。
    - 少数客户和合作伙伴很可能贡献了当前证明点的大头，也放大了下行风险。
  unresolvedGaps:
    - 按产品拆分的收入、毛利率和营运资本义务仍未披露。
    - 头部客户集中度、续约行为和重复项目转化不公开。
    - 累计融资额和当前优先股堆叠尚未能在公开来源中完整对齐。
    - 广泛可靠性、认证和规模化部署指标仍比估值标题薄。
