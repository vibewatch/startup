- id: financial-risk-mitigations-and-kill-criteria
  title: Financial Risk, Mitigations, and Thesis-Break Triggers
  body: 'The financial and strategic risk is not simply that Xsight burns cash. It is that high capital intensity, concentrated commercial proof, and a fast-moving competitive window can reinforce one another. If the company converts a few major programs on schedule, its fundraising and valuation can look prescient. If it misses, the same capital requirements and concentration profile can amplify dilution and reduce bargaining power with customers, investors, or suppliers.


    The right discipline is to define monitorable triggers. Evidence of export-control friction, packaging delays, partner concentration, failed qualification ramps, or declining openness advantage should change the underwriting view materially. Conversely, more named production wins, diversified platform conversions, and disclosed working-capital discipline would reduce the risk profile. The main lesson is that Xsight’s top risks are measurable enough to monitor, but not public enough today to dismiss.'
