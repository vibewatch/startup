evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-composition
    missingEvidence: A current board roster with investor seats, independent directors, and committee structure.
    whyItMatters: >-
      Governance rights and oversight matter at a $2.8B private valuation and are not reconstructible from public
      materials.
    diligencePath: Request the latest board deck, charter set, and post-financing cap-table governance summary.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: revenue-and-arr
    missingEvidence: Current revenue, ARR, gross margin, and customer count.
    whyItMatters: >-
      The company is valued on future commercial scale, but outsiders cannot quantify current traction quality without
      revenue metrics.
    diligencePath: Request monthly revenue bridge, ARR definition, customer concentration, and margin history from management.
    relatedQuestionRefs:
      - QO016
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: A dated official employee count tied to a specific month and geography.
    whyItMatters: Public sources provide only point-in-time proxies that conflict, which can distort operating-scale assessments.
    diligencePath: Ask for current headcount by function and site, plus historical hiring trend.
    relatedQuestionRefs:
      - QO023
  - type: conflicting-data
    severity: material
    topic: lifetime-funding
    missingEvidence: >-
      A round-by-round financing history that reconciles early seed/strategic rounds with the latest total capital
      figure.
    whyItMatters: Investor dilution, preference stack, and use-of-funds history cannot be underwritten from partial public totals.
    diligencePath: Request the capitalization table, financing timeline, and legal close memos for every round.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: customer-pipeline
    missingEvidence: >-
