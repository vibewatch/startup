- id: financial-verdict-and-underwriting-blockers
  title: 'Financial Verdict: Plausible Scale Story, Incomplete Revenue Underwrite'
  body: 'The investment-quality takeaway is balanced. Xsight clearly has access to capital, real product programs, and enough external validation to support the idea of substantial future revenue potential. But public evidence does not yet support precise judgments on gross margin, payback, cash conversion, backlog quality, customer concentration, or revenue durability. Those are not optional details for a semiconductor company at a multibillion-dollar valuation.


    The right verdict is therefore not “financials are weak,” but “public financial proof is incomplete.” If Xsight can show credible pipeline conversion, strong per-program economics, and disciplined working-capital management, the capital raised may prove well matched to the opportunity. If not, the same capital intensity that now looks strategic could become the main source of dilution or execution stress.'
