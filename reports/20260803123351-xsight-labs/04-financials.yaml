    - QI018
    - QI020
    relatedTableRefs:
    - TI003
    - TI005
  - id: GI002
    topic: gross-margin
    statement: No retained source provides switch-vs-DPU gross margin or blended contribution margin.
    priority: high
    whyItMatters: Margin quality determines whether growth creates durable enterprise value.
    suggestedResearch: Request product-level unit cost, ASP, and margin waterfall.
    relatedQuestionRefs:
    - QI007
    - QI021
    relatedTableRefs:
    - TI003
  - id: GI003
    topic: working-capital
    statement: Public evidence implies inventory and packaging demands, but does not quantify them.
    priority: high
