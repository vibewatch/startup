  - id: GI001
    topic: revenue-disclosure
    statement: No retained source discloses revenue, ARR, or recognized shipment value.
    priority: high
    whyItMatters: Revenue is the core scale metric needed for valuation and burn analysis.
    suggestedResearch: Request trailing 24-month revenue bridge by product and top account.
