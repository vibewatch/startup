- id: FU001
  title: Customer journey map
  type: journey-map
  layout: standard
  summary: Xsight customers likely move from architecture need through evaluation, platform integration, and deployment.
  data:
    items:
    - label: 1. Architecture need
      stage: Discovery
      actor: Platform architect / product lead
      action: Looks for open, efficient Ethernet switching or DPU capability
      pain: Incumbent lock-in, power, or customization limits
      outcome: Xsight enters evaluation set
    - label: 2. Evaluation
      stage: Evaluation
      actor: Engineering / validation teams
      action: Benchmarks hardware, software fit, and power behavior
      pain: Qualification burden and integration risk
      outcome: Promising parts move into platform design
    - label: 3. Integration
      stage: Pilot
      actor: OEM / appliance / customer engineering
      action: Integrates Xsight into switch, appliance, or storage architecture
      pain: Software and support complexity
      outcome: Reference platform or design win emerges
    - label: 4. Deployment
      stage: Production Deploy
      actor: Operations / program owner
      action: Deploys into live environment or shipping platform
      pain: Reliability and supply expectations rise
      outcome: Potential repeat shipments and switching cost
    - label: 5. Expansion
      stage: Expansion
      actor: Product line / architecture sponsor
      action: Considers follow-on SKUs, new programs, or derivative platforms
      pain: Need proof of support and volume supply
      outcome: Converts proof into durable account value
