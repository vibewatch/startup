- id: what-customer-evidence-means-for-underwriting
  title: What the Customer Evidence Actually Means for Underwriting
  body: 'The clean conclusion is that customer proof exists and matters, but it is lopsided toward signal quality rather than quantity. Public evidence supports the view that Xsight is not a science experiment: multiple external parties have integrated, validated, or publicly associated with the technology. That gives weight to the product thesis and helps explain investor confidence.


    However, the chapter does not support a claim of broad, diversified, durable customer revenue. The strongest public signs are a few high-value programs and ecosystem partners. That is enough to say the company has crossed the threshold of real adoption interest, but not enough to say concentration risk is low or that expansion dynamics are already proven. Customer diligence should therefore focus on deployment stage, top-account economics, expansion path, and the share of revenue that depends on partner channels. More contract-level disclosure would sharpen this view materially for investors.'
