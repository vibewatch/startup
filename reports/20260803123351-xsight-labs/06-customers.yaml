- id: retention-expansion-and-concentration
  title: 'Retention, Expansion, and Concentration: Mostly a Public Data Gap'
  body: 'No retained source discloses NRR, GRR, renewal rates, contract length, or cohort behavior. That is unsurprising for a private semiconductor company, but it creates a meaningful analytic constraint because large infrastructure programs often have long qualification cycles and concentrated economics. A company can have excellent product-market relevance and still have fragile commercial durability if too much revenue depends on a few accounts, delayed ramps, or partner-led channels.


    The best available retention proxies are integration depth and switching cost. If a customer or partner has built a platform around Xsight silicon, validated software paths, and engineered a data path or appliance around the component, that can create stickiness. But it is still only a proxy. Public evidence does not reveal whether those customers expanded orders, renewed commitments, or deployed second and third programs. The retention story is therefore plausible but not visible enough to underwrite directly.'
  claimRefs:
  - CU018
  - CU019
  - CU020
  - CU021
  - CU022
  - CU023
