chapter:
  number: 6
  title: Customers
  summary: Xsight’s public customer evidence is stronger on named partner and platform proof than on broad customer-count or retention disclosure. The highest-signal evidence comes from the Starlink design win, Hammerspace’s E1-based storage architecture, Edgecore platform integrations, Interface Masters’ EXA switch appliance, and engineering-validation references from proteanTecs and Veriest. Those signals are valuable because they point to serious technical buyers, but they do not yet disclose revenue concentration, renewal rates, or how many evaluations have converted into repeat production programs. The customer story is therefore real, but concentrated and still under-documented on durability.
sections:
- id: who-the-customer-base-appears-to-be
  title: Who the Customer Base Appears to Be
  body: 'Public evidence suggests that Xsight’s customer universe is narrow, technical, and disproportionately strategic. The most visible categories are hyperscaler-like or mission-grade operators, OEM and ODM platform builders, appliance makers, storage-network innovators, and engineering organizations validating advanced silicon. Xsight is not publicly framed as a broad enterprise vendor selling to hundreds of ordinary IT departments. Instead, it appears to be selling into programs where architecture decisions are few in number but large in impact.


    This segmentation implies a customer base defined more by platform role than by logo count. A single hyperscale, satellite, or appliance design win may be worth more than dozens of smaller ordinary accounts, while the loss or delay of one large program can materially affect commercial momentum. The most important buyer roles therefore seem to be infrastructure architects, product-line owners, and engineering teams building differentiated networking or storage platforms rather than generic networking administrators. very clearly.'
