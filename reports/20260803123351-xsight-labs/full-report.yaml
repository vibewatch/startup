chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Stage, and What Xsight Actually Sells
        blocks:
          - type: paragraph
            body: >-
              Xsight Labs is a fabless semiconductor company selling intelligent connectivity silicon for AI and
              hyperscale data centers rather than a full end-to-end systems stack. The clearest public descriptions
              converge on two primary product families: the X-series programmable Ethernet switches and the E-series
              data processing units. Those parts are pitched as open, software-defined infrastructure building blocks
              for hyperscalers, edge operators, OEMs, and AI-cloud builders that want Ethernet-based fabrics without
              being locked into closed proprietary networking architectures. The company’s recent messaging emphasizes
              programmable data planes, standard Linux and SONiC compatibility, and lower power versus incumbent switch
              or DPU offerings.


              Identity details are mostly consistent but not perfectly normalized. The July 2026 funding announcement
              describes Xsight as headquartered in Tel-Aviv with additional offices in Kiryat Gat and Haifa, while other
              company-adjacent and portfolio sources describe Kiryat Gat as headquarters or management base. The
              practical conclusion is that Xsight is an Israel-based semiconductor company with operational presence
              across Tel Aviv, Kiryat Gat, and Haifa plus commercial footprints in Boston, Raleigh, San Jose, and
              Yerevan. Founded in 2017, it is no longer an early-stage stealth project: it now presents itself as a
              late-stage private infrastructure company shipping real silicon into customer evaluations, partner
              platforms, and at least one high-visibility design win.


              Xsight’s commercial thesis is not “another switch chip” in isolation. It is to provide both host-side and
              network-side silicon for Ethernet-centric AI and cloud fabrics, then let operators or partners program
              those devices with open software models instead of waiting on a closed vendor roadmap. That positioning
              matters because it explains why investors appear comfortable underwriting a multibillion-dollar valuation
              before public revenue disclosure: the pitch is architectural relevance to the AI networking stack, not a
              narrow component sale.
