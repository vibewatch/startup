  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk Is More About Regime Exposure Than Current Enforcement
        blocks:
          - type: paragraph
            body: >-
              Xsight operates in a sector that sits near advanced-computing, semiconductor, and AI-infrastructure
              control regimes. Even if the company itself has not been publicly accused of misconduct in retained
              sources, the broader export-control landscape matters because advanced networking silicon, packaging, and
              destination-country restrictions can alter who may buy, integrate, or support certain products. BIS
              guidance, legal alerts, law-firm summaries, and policy analysis all indicate that semiconductor and AI
              infrastructure controls are becoming more intricate, more extraterritorial, and more sensitive to
              supply-chain roles such as foundry, packaging, and high-performance compute deployment.


              The legal risk is therefore less “headline lawsuit today” and more “regime complexity tomorrow.” A private
              startup can move from routine commercialization into licensing, diligence, or counterparty-friction
              problems very quickly if customer geography, packaging routes, or partner footprints intersect with newly
              tightened rules. Xsight also lacks a public trove of compliance detail, so outsiders cannot see how mature
              its export-control procedures are. That does not prove weakness; it simply means the risk must be
              underwritten as unresolved.
            claimRefs:
              - CR001
              - CR002
              - CR003
