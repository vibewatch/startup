  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is straightforward. Xsight is operating in a strategically important AI-networking layer where
              Ethernet switching, DPUs, power efficiency, and open fabric programmability are all gaining relevance. It
              has real products, serious capital backing, and named customer or partner proof that includes Starlink,
              Hammerspace, Edgecore, and Interface Masters. If the company converts that proof into repeat hyperscaler,
              AI-cloud, and OEM platform wins, the upside can be large because a small number of programs may carry
              outsized economic value.


              The anti-thesis is just as clear. Public evidence still lags the headline valuation on the metrics that
              matter most for price discipline. Investors can see a strong category, a coherent technology stack, and
              encouraging customer proof, but they cannot see revenue, margins, concentration, or backlog. Meanwhile,
              the competitive window is narrow and incumbents have scale, supply, and bundling advantages. The
              anti-thesis is therefore not that Xsight lacks promise; it is that the price may already capitalize too
              much of the good story before outsiders can verify the hard economics.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
