      - number: '1.2'
        title: Founders, Leadership, and Governance Signals
        blocks:
          - type: paragraph
            body: >-
              The founding story is unusually important because Xsight sits inside the Israeli networking-silicon
              lineage that runs through EZchip and Mellanox. Multiple sources identify Guy Koren, Erez Shaizaf, and Gal
              Malach as the founders, all with EZchip backgrounds. Public founder-facing material and third-party
              profiles center Malach especially heavily as technical co-founder and CTO voice, while the company’s
              current commercial face is CEO Yossi Meyouhas. That split implies a fairly classic late-stage
              semiconductor operating model: founder-architect continuity on technology, with an externally legible
              executive front-end for customers and investors.


              Governance visibility is mixed. Public articles consistently describe Avigdor Willenz as early backer and
              current chairman, which is strategically meaningful because his historical role in Israeli chip startups
              signals access to capital and ecosystem credibility. Yet public materials do not expose a complete
              contemporary board roster, committee structure, or governance rights after the 2026 financing. The funding
              stories mention many institutional investors but do not reconstruct the present control map. That is
              acceptable for public narrative but not for full underwriting diligence.


              Leadership depth is supported indirectly by partner, podcast, and field-day materials rather than a fully
              transparent org chart. Xsight clearly has enough engineering depth to support 5nm switch and DPU programs,
              partner integrations, and production telemetry work, but public evidence remains thinner than one would
              expect from a company now valued at $2.8B. The main governance takeaway is therefore positive on
              founder-market fit and ecosystem backing, but incomplete on formal oversight and succession depth.
