      - number: '2.3'
        title: Why the Market Is Expanding Fast — and Why It Still Has Real Friction
        blocks:
          - type: paragraph
            body: >-
              The strongest growth driver is simple: AI clusters are turning networking from a supporting subsystem into
              a direct determinant of expensive accelerator utilization. NVIDIA, DriveNets, Cisco, and market analysts
              all frame the network as a limiter on scale, scheduling efficiency, or time-to-train. As clusters grow,
              Ethernet switching bandwidth, host offload, congestion control, telemetry, and programmability become more
              valuable. The electricity story reinforces that urgency. IEA analysis shows data-center power demand
              rising materially with AI adoption, which pushes buyers toward more efficient fabric designs and raises
              the value of lower-power switching and DPU architectures.


              At the same time, adoption constraints are real. Semiconductor packaging and supply-chain bottlenecks
              still matter; even when a silicon design wins, high-volume delivery depends on foundry, packaging, and
              inventory readiness. Export-control policy remains relevant because advanced networking silicon intersects
              with broader semiconductor trade controls and geopolitical review. And software remains a decisive gate: a
              part that is technically elegant but hard to integrate into SONiC, OEM reference platforms, or customer
              operational workflows will lose despite raw hardware merit. The market therefore rewards not just
              bandwidth but integration maturity.


              For Xsight specifically, the implication is that openness is not a slogan; it is part of the ROI case.
              Buyers want Ethernet-based AI fabrics that preserve multi-vendor choice, reduce power, and let operators
              tune behavior in software. But they also want those benefits without taking on undue execution risk. That
              tension explains both the excitement around the category and the selectivity of real production wins.
            claimRefs:
              - CM018
              - CM019
              - CM020
              - CM021
              - CM022
              - CM023
              - CM024
              - CM025
              - CM026
