      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: This is a company that merits deeper work, not dismissal
            body: The market, product, and proof case are all strong enough to justify serious engagement.
            calloutType: strength
            claimRefs:
              - CV001
              - CV003
              - CV021
          - type: callout
            title: The key question is price versus proof, not promise versus no promise
            body: The public record supports real upside; it does not yet support price-insensitive conviction at $2.8B.
            calloutType: insight
            claimRefs:
