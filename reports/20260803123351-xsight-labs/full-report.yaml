      - number: '3.3'
        title: Switching Cost, Distribution Power, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              Distribution power remains the incumbents’ biggest edge. Cisco and Arista have long-lived enterprise and
              cloud relationships. NVIDIA can cross-sell networking into compute-heavy AI buildouts. Broadcom remains
              the default reference point for merchant switching. These positions matter because buyers of AI-networking
              infrastructure are trying to minimize execution risk on projects with enormous capex and time-to-market
              consequences. Even if Xsight has a technically attractive part, the burden of proof is higher because the
              buyer must believe not just in performance but in sustained supply, support, and roadmap continuity.


              On the other hand, switching cost can become a Xsight advantage once qualification occurs. If its switch
              or DPU is designed into a platform, validated with open software, and tied to differentiated appliance or
              storage designs, removing it is not trivial. The moat is therefore not a pure IP moat today; it is a
              combination of product fit, software openness, and design-win embedment. That is useful, but still less
              durable than the scaled distribution and bundling power of larger rivals.
