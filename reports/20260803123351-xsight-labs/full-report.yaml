  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Who Xsight Actually Competes Against
        blocks:
          - type: paragraph
            body: >-
              The competitive set has to be defined by buyer job rather than by narrow product labels. At the chip
              level, Xsight competes with incumbent merchant switch and DPU suppliers such as Broadcom, NVIDIA, Marvell,
              and AMD Pensando. At the system level, it also competes with bundled or vertically integrated
              architectures from NVIDIA, Cisco, Arista, and DriveNets, because many buyers can solve the same problem
              through a full-fabric platform rather than by adopting a new merchant component. A third class of
              competitor is the status quo: staying with incumbent Ethernet or InfiniBand designs, extending current
              white-box relationships, or delaying a platform transition until a larger vendor provides a more complete
              reference stack.


              This matters because Xsight is rarely compared only on raw port speeds. Buyers compare solution
              completeness, software maturity, ecosystem familiarity, supply confidence, and the risk of integrating a
              newer vendor into a capital-intensive AI-fabric roadmap. NVIDIA competes through platform breadth and GPU
              adjacency; Broadcom through merchant-silicon incumbency; Marvell and AMD through DPU and switching
              adjacencies; Cisco and Arista through network-system credibility; DriveNets through fabric software and
              large-scale Ethernet narrative. Xsight therefore enters most decisions as a technically credible
              challenger, but not as the default choice.
