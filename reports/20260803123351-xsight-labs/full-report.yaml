  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Why One Big TAM Number Would Mislead
        blocks:
          - type: paragraph
            body: >-
              The first analytical step is defining what Xsight actually sells into. The company is not a general
              data-center networking vendor, nor a full-stack AI-infrastructure platform. Its product scope sits inside
              a narrower but strategically important layer: Ethernet switch ASICs, DPUs, and related software-defined
              fabric functions used in AI back-end, front-end, and storage networks. That means the relevant market
              includes merchant and semi-custom Ethernet switching silicon for AI clusters, host-side offload and
              programmable packet processing, and select adjacent platform value captured through OEM or partner
              designs. It excludes most enterprise campus networking, broad telecom routing, and the entire spend pool
              for GPUs, servers, or storage systems except where networking silicon value is embedded.


              Published market sources converge directionally rather than numerically. IDC shows the data-center
              Ethernet switching market surging in early 2026, with AI back-end demand a major contributor. Dell’Oro
              describes AI back-end networks as a special growth pocket with exceptional spending intensity. Official
              messaging from NVIDIA, Cisco, DriveNets, the Ultra Ethernet Consortium, and Ethernet Alliance all
              reinforces that Ethernet is now being positioned not only as a front-end network but as a credible
              AI-fabric medium. That said, those sources describe overlapping but not identical market definitions. The
              cleanest diligence posture is therefore to use layered sizing: a broad ceiling based on AI-networking
              infrastructure, a middle layer based on Ethernet switching and DPU attach, and a narrow reachable layer
              based on the subset of hyperscaler and OEM programs that can qualify new merchant silicon.


              This boundary matters because it keeps valuation discipline intact. A claim that “AI networking is huge”
              is directionally true but not decision-useful. Xsight’s near-term revenue pool depends on winning a
              limited number of very large fabric, server, or platform programs where qualification cycles are long and
              losses to incumbents are expensive. The market is expanding quickly enough to matter, but it is not
              frictionless or infinitely shareable.
