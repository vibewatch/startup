        title: Exhibits
        blocks:
          - type: callout
            title: The biggest risk is cumulative, not singular
            body: >-
              No one retained source proves a fatal flaw, but export-control complexity, packaging exposure, customer
              concentration, and capital intensity can compound quickly.
            calloutType: risk
            claimRefs:
