      - number: '8.3'
        title: Bull / Base / Bear Cases and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              The bull case is that Xsight becomes a credible open-Ethernet winner in a market where buyers increasingly
              want flexibility, power efficiency, and alternatives to closed platform lock-in. In that scenario, a few
              flagship wins expand into broader programs, partner platforms replicate, and the company’s valuation looks
              more like an early marker on a larger commercial ramp. The bear case is not product failure alone; it is
              that commercialization stays concentrated and under-documented while incumbents compress the
              differentiation window. In that case, the company could remain technically relevant but economically
              overvalued.


              The base case from public evidence alone sits in between. Xsight looks worthy of further work, not of
              price-insensitive conviction. Entry discipline should therefore focus on what would change the view:
              revenue disclosure, concentration clarity, evidence of repeat production ramps, and proof that capital
              intensity is being converted into diversified commercial momentum rather than just strategic optionality.
            claimRefs:
              - CV021
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
