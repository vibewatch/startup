      - number: '1.5'
        title: Main Open Gaps and Adverse Context
        blocks:
          - type: paragraph
            body: >-
              The most important missing data are financial and commercial rather than technical. No public source
              reviewed here discloses revenue, ARR, gross margin, customer count, or the conversion rate from evaluation
              labs into production contracts. For a capital-intensive semiconductor startup, that absence is a material
              diligence gap because valuation rests on future adoption of products that are only now entering broader
              market proof.


              Public adverse context is limited but not zero. Layoff-tracker evidence points to a reported 2022
              workforce reduction in Tel Aviv, suggesting the company experienced at least one reset period before the
              current AI-fabric momentum. That does not undermine the 2026 narrative, but it does show that the path was
              not a straight line. More importantly, several company-adjacent sources use slightly different
              headquarters definitions and lifetime-funding totals. Those inconsistencies are normal for private
              startups, yet they matter because they signal that management’s current presentation is more polished than
              the historical public record beneath it.


              The chapter conclusion is therefore constructive but disciplined. Xsight clearly has real products, major
              investors, and meaningful external validation, but it is still a private chip company whose headline
              valuation outruns the public transparency available to outsiders. Subsequent chapters need to test whether
              the market size, technical differentiation, customer evidence, and risk profile justify that valuation
              step-up.
            claimRefs:
              - CO033
              - CO034
              - CO035
              - CO036
              - CO037
              - CO038
