      - number: '1.3'
        title: Funding History, Valuation Step-Up, and Capitalization Signals
        blocks:
          - type: paragraph
            body: >-
              The best-supported financing fact is the newest one: Xsight closed a $300M+ round in late July 2026 at a
              $2.8B post-money valuation, led by Fidelity Management & Research with participation from a broad
              syndicate including Intel Capital, Battery Ventures, Valor Equity Partners, T. Rowe Price, Maverick
              Capital, and others. Independent Israeli coverage adds the key context that this mark is more than five
              times the company’s 2021 valuation of roughly $500M, implying a dramatic repricing in line with the
              AI-networking capital cycle rather than a steady linear increase.


              Earlier funding chronology is directionally clear but not fully normalized. Starlink-related coverage says
              Xsight raised more than $150M across four rounds before the current boom, with an initial round led by
              Avigdor Willenz, a second round led by Intel and Microsoft, and a 2020 round of more than $50M led by
              Intel. Company-profile databases and archived company pages show higher lifetime-capital totals, including
              roughly $380M or $430M before or including the 2026 round depending on source vintage. The safe
              interpretation is that public sources agree on large cumulative backing and multiple blue-chip strategic
              or crossover investors, but do not reconcile all intermediate rounds cleanly enough for precision
              cap-table work.


              Capital use is easier to understand than cap-table detail. The 2026 raise is explicitly tied to
              multigenerational switch and DPU roadmap execution, manufacturing and supply-chain scale-up, engineering
              and customer-support hiring, and high-volume Tier-1 customer delivery. That suggests the round is designed
              to convert technical design wins into dependable fulfillment, not simply to extend research runway. The
              valuation therefore reflects both product ambition and a claim of accelerating commercial traction, even
              though public revenue remains undisclosed.
