        title: What Xsight Sells and How Revenue Probably Shows Up
        blocks:
          - type: paragraph
            body: >-
              Public evidence is strongest on product form, not reported revenue. Xsight appears to monetize primarily
              through B2B sales of switch silicon, DPUs, and partner-led platforms or reference designs rather than
              through recurring software subscriptions. Revenue likely arrives through design wins, silicon shipments,
              support or enablement around integrations, and possibly software or tooling attach where needed for
              deployment. What the public record does not show is pricing, contract length, shipment cadence, or how
              much value is captured directly by Xsight versus by OEM or solution partners.


              That distinction matters because hardware-infrastructure revenue quality differs sharply from software.
              Sales cycles are longer, inventory risk matters more, gross margins depend on manufacturing and packaging
              economics, and working capital can expand before revenue recognition catches up. The evidence around
              Edgecore, Hammerspace, Interface Masters, and Starlink suggests Xsight is working on platform and
              design-win style commercialization, but it does not reveal realized ASPs, renewal dynamics, or
              contribution margin by product family. The right financial interpretation is therefore
              component-and-platform revenue with high deal concentration and delayed visibility, not a simple
              ARR-driven model.
