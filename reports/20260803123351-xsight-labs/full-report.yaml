            body: >-
              The 2026 financing should be read as scale capital, not just confidence capital. Company and investor
              statements tie the round to multigenerational switch and DPU execution, manufacturing and supply-chain
              scale-up, engineering expansion, and Tier-1 delivery. That is consistent with the economics of late-stage
              semiconductor companies, where success creates working-capital and inventory needs almost as quickly as it
              creates revenue opportunity. A company shipping advanced networking silicon into demanding customers
              cannot rely on a “software startup” cash profile.


              Relative context matters. DriveNets’ $410M 2026 round and Ayar Labs’ $500M Series E show that adjacent
              AI-infrastructure companies are also raising very large sums to fund manufacturing readiness, platform
              scale, and go-to-market expansion. That does not prove Xsight’s exact burn, but it does imply that the
              category is structurally capital hungry. If Xsight’s commercialization cycle is slower than expected, even
              a very large round can disappear into inventory, packaging, and support obligations faster than public
