  rows:
  - - AI back-end Ethernet fabrics
    - Switching silicon, control software, NIC/DPU attach, reference-platform integration for GPU-cluster fabrics
    - InfiniBand-only systems, GPU spend, server CPU spend
    - Hyperscalers, AI clouds, OEM platforms
    - Closest match to X2 and E1 positioning
  - - Front-end and storage Ethernet fabrics
    - Storage connectivity, TOR switching, appliance networking, scale-out data paths
    - Storage media spend, general-purpose servers
    - Cloud operators, storage vendors, appliance builders
    - Supports DPU and switch attach beyond pure training fabrics
  - - Merchant switch silicon for cloud / edge
    - Programmable Ethernet ASIC value in white-box or semi-custom systems
    - Enterprise campus switching, telecom routing
    - ODMs, OEMs, cloud builders
    - Fits Xsight’s open-programmable switch thesis
  - - Host offload / DPU layer
    - Data-plane acceleration, telemetry, security, storage and virtualization offload
    - General CPU workloads, GPU accelerators
    - Server vendors, hyperscalers, storage platforms
    - Relevant to E1 attach and bundle economics
  - - Open Ethernet software ecosystem
    - SONiC, DASH, Linux integration, validation and tooling
    - Closed single-vendor NOS ecosystems
    - Platform engineering and operations teams
    - Can lower switching cost for adopting new silicon
  notes: The narrowest decision-useful boundary is open Ethernet switching and DPU value attached to AI-cluster, cloud, and storage networks rather than total data-center infrastructure spend.
