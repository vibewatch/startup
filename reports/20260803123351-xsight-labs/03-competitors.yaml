  evidenceGaps:
  - id: GP001
    topic: pricing-opacity
    statement: Retained sources do not disclose comparable realized pricing, discounting, or support-bundle economics across Xsight and incumbents.
    priority: medium
    whyItMatters: Without comparable economics, buyers’ willingness to trade openness for bundled support remains hard to quantify.
    suggestedResearch: Request anonymized deal comparisons and bill-of-materials deltas from management or channel partners.
    relatedQuestionRefs:
    - QP014
    - QP015
    relatedTableRefs:
    - TP003
  - id: GP002
    topic: volume-conversion
    statement: Public evidence does not show how many Xsight evaluations have converted into repeat production share across independent customers.
    priority: high
    whyItMatters: This is the cleanest test of moat durability versus one-off proof points.
    suggestedResearch: Request pipeline stage counts and shipment history by account.
    relatedQuestionRefs:
    - QP020
    - QP025
  - id: GP003
    topic: feature-parity
    statement: Retained sources do not support a cell-by-cell audited feature parity matrix across all rivals.
    priority: medium
    whyItMatters: Some apparent gaps may be missing evidence rather than true absence.
    suggestedResearch: Collect vendor docs, benchmark decks, and customer RFP scorecards.
    relatedQuestionRefs:
    - QP009
    - QP010
    relatedTableRefs:
    - TP002
  - id: GP004
    topic: support-footprint
    statement: Public sources do not provide a comparable measure of field-support depth, professional-services reach, or spare-capacity commitments across vendors.
    priority: medium
    whyItMatters: Support depth often decides large infrastructure awards.
    suggestedResearch: Obtain org charts, SLA commitments, and partner-service maps.
    relatedQuestionRefs:
    - QP010
    - QP017
  - id: GP005
    topic: status-quo-substitute
    statement: No retained source quantifies how often buyers prefer to delay change rather than select any challenger or incumbent alternative.
    priority: low
    whyItMatters: The status quo is a substitute but is hard to model precisely.
    suggestedResearch: Ask management for no-decision loss data and delay reasons.
    relatedQuestionRefs:
    - QP024
