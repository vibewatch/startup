companyProfile:
  summary: Xsight Labs is an Israeli fabless semiconductor company founded in 2017 and focused on programmable Ethernet switch and DPU silicon for AI, hyperscale, edge, and storage networks. Public evidence supports a coherent X-Series plus E-Series product strategy, a July 2026 financing round above $300 million at a $2.8 billion valuation, and multiple external proof points including Starlink, Hammerspace, Edgecore, and Interface Masters. The strategic story is compelling, but public evidence on revenue quality, concentration, and capital efficiency remains incomplete.
