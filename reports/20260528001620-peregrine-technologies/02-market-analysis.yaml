  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: SOM / Peregrine ARR
      missingEvidence: Peregrine's disclosed ARR or revenue run rate for 2026
      whyItMatters: Without disclosed ARR, SOM calculations rest on estimated contract values and customer counts; the estimate could be off by 2–5x in either direction, directly affecting valuation judgment.
      diligencePath: Request audited financials or management accounts from Peregrine in due diligence; cross-check with customer references on contract values.
      relatedQuestionRefs: [QM026]

    - type: missing-source
      severity: material
      topic: RTCC market revenue sizing
      missingEvidence: A standalone market-size estimate for the RTCC software platform segment (not law enforcement software broadly)
      whyItMatters: Peregrine's primary go-to-market is RTCC deployments; knowing the size of this specific sub-market would sharpen SAM estimates and win-rate analysis.
      diligencePath: Commission bottoms-up SAM estimate using NRTCCA member count, average contract values from comparable vendors, and known RTCC pipeline from public sources.
      relatedQuestionRefs: [QM026]

    - type: conflicting-data
      severity: material
      topic: analyst market sizing estimates
      missingEvidence: Reconciled market-boundary definition and methodology alignment across Fact.MR, Precedence Research, Mordor Intelligence, and Coherent Market Insights
      whyItMatters: 2–3x variation in stated market sizes creates uncertainty in TAM/SAM framing; using the wrong estimate could misrepresent the market opportunity by billions.
      diligencePath: Obtain analyst methodology notes or commission an independent sizing using bottoms-up US agency count × average contract value calculation.
      relatedQuestionRefs: [QM007, QM026]

    - type: private-evidence-only
      severity: material
      topic: federal grant dependency
      missingEvidence: Quantification of what share of Peregrine's closed deals were funded with Byrne JAG, COPS, or other federal grants
      whyItMatters: If a significant share of Peregrine's deal flow depends on federal grant cycles, reduction in grant appropriations would create material downside risk to near-term revenue.
      diligencePath: Request from Peregrine management the percentage of contracts that were grant-funded and the pipeline concentration in grant-dependent customers.
      relatedQuestionRefs: [QM019]

    - type: enumeration-incomplete
      severity: minor
      topic: buyer segmentation
      missingEvidence: Representative sample of Peregrine contract terms from mid-sized agencies (25,000–100,000 population) which are not covered in public case studies
      whyItMatters: Most US law enforcement agencies are small to mid-sized; understanding whether Peregrine can profitably serve these agencies is critical to addressable market sizing.
      diligencePath: Request deal-level CRM data from Peregrine showing distribution by agency size, contract value, and grant-funded share.
      relatedTableRefs: [TM003]
      relatedQuestionRefs: [QM023]
