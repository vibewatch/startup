    claimRefs: [CM016, CM003, CM017]

callouts:
  - calloutType: insight
    title: RTCC Adoption at Inflection — But Less Than 2% Penetration
    body: >
      The National Real Time Crime Center Association's membership surge—200 attendees in 2022 to 1,000 in 2025—signals that RTCC deployment has crossed the early-adopter threshold and entered early majority. Yet only ~300 of ~18,000 US law enforcement agencies have operational RTCCs, representing less than 2% penetration of all agencies and ~12% of the ~2,500 viable targets. This creates substantial white space for Peregrine, but achieving broad penetration will require overcoming structural barriers: procurement cycles, civil-liberties opposition, and budget constraints in smaller municipalities.
    claimRefs: [CM016, CM017, CM003]

  - calloutType: risk
    title: Civil-Liberties Opposition Is a Recurring, Not Isolated, Deal Risk
    body: >
      Durham, North Carolina's city council vote against the Peregrine contract and Charlottesville's pause on using the software are not outliers—they reflect a documented pattern of community opposition to predictive policing and AI surveillance platforms. The Brennan Center and ACLU have published research framing AI-powered public-safety analytics as civil-liberties risks. This opposition is asymmetric: a single vocal community meeting can derail a contract regardless of technical merit, and the elected-body approval requirement means public pressure has a formal veto point. Peregrine's community-engagement strategy and the percentage of contested deals it loses are key diligence questions.
    claimRefs: [CM006, CM008, CM029, CM030]

  - calloutType: strength
    title: FedRAMP High Certification Creates Structural Entry Barrier for Federal Market
    body: >
      Peregrine's FedRAMP High authorization is a significant competitive moat in the federal segment. Most law enforcement analytics platforms have not achieved FedRAMP High, which restricts them from contracts with agencies handling Controlled Unclassified Information (CUI) and Law Enforcement Sensitive (LES) data. Federal contracts (FBI, DHS, DEA) carry larger average contract values, multi-year terms, and lower churn risk than municipal deals, making the federal segment the highest-value expansion path if Peregrine can win initial RFPs.
    claimRefs: [CM009, CM040]

  - calloutType: assumption
    title: SAM Estimate Is Bounded by Undisclosed Revenue Data
    body: >
      The $1–3B SAM estimate for US public-safety analytics platforms is constructed bottom-up from the GovTech/Gartner $15B justice IT envelope and an assumed 10–25% analytics share. Peregrine has not disclosed ARR or revenue, making SOM verification impossible from public sources. The SAM estimate should be treated as order-of-magnitude guidance; primary research into Peregrine's pipeline and comparable vendor disclosures (Tyler Technologies, Axon analytics ARR) would materially sharpen this figure.
    claimRefs: [CM025, CM042, CM005]

