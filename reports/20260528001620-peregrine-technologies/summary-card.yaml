  topStrengths:
    - >-
      Three consecutive years of ~3x ARR growth with Sequoia Capital as Series C lead provides the strongest VC-quality
      signal in govtech at this stage
    - >-
      Deep data-integration architecture creates high switching costs once an agency's records are unified on the
      platform, underpinning durable recurring revenue
    - >-
      FedRAMP High authorization (April 2026) opens a higher-ACV and stickier federal procurement channel unavailable to
      non-certified competitors
    - >-
      Super Bowl LIX deployment for New Orleans multi-agency task force validates Tier-1 event-scale reliability and
      generates a credible reference customer signal
    - >-
      Law enforcement software market projected to grow from $20.25B (2025) to $32.96B by 2030 at 10.2% CAGR, with
      cloud-native platforms positioned to capture disproportionate share
    - >-
      Adam Klein (former PCLOB Chairman) as formal privacy advisor strengthens compliance credentialing and is a
      credible mitigation signal against civil-liberties challenges
  topRisks:
    - >-
      Valuation multiple of ~61x ARR at Series C is materially above Flock Safety (25x ARR, concurrent comp) and public
      comps (Axon 11x revenue, Tyler 5x revenue); base-case scenario implies 50–60% loss on the $2.5B entry
    - >-
      Civil-liberties and regulatory backlash is escalating — Durham NC City Council unanimously rejected a $517K
      contract in February 2026; EFF and Brennan Center actively characterize RTCC platforms as fundamentally
      privacy-damaging
    - >-
      Government budget dependency and slow procurement cycles create pipeline fragility; termination-for-convenience
      clauses common in government contracts undermine ARR durability
    - >-
      Dataminr analog: comparable public-safety AI unicorn collapsed from a $4.1B primary mark to ~$832M secondary
      implied value (−80%) through multiple compression and growth deceleration
    - >-
      All key financial metrics (NRR, gross margin, CAC, burn rate, customer concentration) are undisclosed; no audited
      accounts available to underwrite the $2.5B valuation
    - >-
      Key-person concentration in CEO Nick Noone with opaque board composition and undisclosed governance rights
      post-Series C
  unresolvedGaps:
    - >-
      ARR composition and revenue quality — GetLatka's $40.9M is unaudited; SaaS vs. professional services vs. one-time
      integration split is unknown
    - >-
      Net revenue retention and cohort analysis — without NRR >100%, the 3x growth story requires constant new-logo
      acquisition; no public churn evidence
    - >-
      Unit economics (CAC, payback, LTV:CAC, gross margin by segment) — at $253M cumulative funding, path to breakeven
      is critical but entirely undisclosed
    - >-
      Customer concentration — top-10 agency share of ARR unknown; LAPD Project Blue Light is a visible large contract
      but its ARR weight is unconfirmed
    - >-
      Government contract structure — multi-year committed ARR vs. annually renewable; prevalence of
      termination-for-convenience clauses across the contract base
    - >-
      Civil-liberties legislative exposure in top-revenue states — status of pending predictive-policing or data-fusion
      restriction legislation not fully mapped
    - Board composition, governance rights, and liquidation-preference stack post-Series C — not publicly disclosed
