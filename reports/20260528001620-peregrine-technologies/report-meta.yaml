summary:
  headline: >
    Peregrine has exceptional growth credentials and Tier-1 investor validation but is priced at ~61x
    ARR — more than twice the concurrent Flock Safety comp — in a market with escalating civil-liberties
    risk and entirely undisclosed unit economics; conditional track pending ARR audit, NRR confirmation,
    and valuation step-down.
