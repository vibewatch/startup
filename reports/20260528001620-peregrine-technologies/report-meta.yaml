companyProfile:
  summary: >
    Peregrine Technologies is a San Francisco-based GovTech unicorn founded in 2018 by CEO Nick Noone
    (ex-Palantir, led US Special Operations Command engagement) and co-founder Ben Rudolph (Stanford CS,
    former UN Refugee Agency technologist). The company operates a cloud-native data fusion platform that
    integrates fragmented agency data — court records, arrest reports, body camera transcripts, license
    plate reader logs, and dispatch feeds — into a unified real-time intelligence interface. Forbes
    described the product in August 2024 as "essentially a super-powered Google for police data." Peregrine
    raised a $190M Series C in March 2025 led by Sequoia Capital at a $2.5B post-money valuation, the
    largest law enforcement tech raise since Dataminr's 2021 Series F. The company has been deployed at
    Super Bowl LIX (February 2025) and achieved FedRAMP High authorization in April 2026. Its Palantir
    lineage and predictive-analytics tools have drawn civil liberties scrutiny, with the Durham NC City
    Council unanimously rejecting a $517K contract in February 2026 citing data privacy concerns.
  foundedDate: "2018-01-01"
  founders:
    - name: "Nick Noone"
      role: "Co-Founder & CEO"
      background: >
        Former Palantir Technologies executive who led the US Special Operations Command engagement
        and a 2014 military operation to identify ISIS members; embedded 18 months with the San Pablo
        Police Department before founding Peregrine.
      claimRefs: ["CO013", "CO015"]
    - name: "Ben Rudolph"
      role: "Co-Founder"
      background: >
        Stanford Computer Science; technologist for the UN Refugee Agency; earlier work at Dimagi;
        provides technical architecture and humanitarian data credentialing alongside Noone.
      claimRefs: ["CO014"]
  foundingLocation: "San Francisco, CA"
  headquarters: "San Francisco, CA"
  productSummary: >
    Peregrine sells an annual SaaS subscription (all-user-access flat fee per agency) to government and
    public safety agencies. The platform ingests, deduplicates, and indexes all connected agency data
    — CAD, RMS, body cameras, LPR logs, court records, suspicious activity reports — and exposes it
    through a web-based query interface. Officers enter a name, address, or case number to surface
    cross-system matches in real time. AI modules support safety flagging, predictive hotspot analysis,
    and case summarization. Average contract value is approximately $280,000/year (CEO-stated), ranging
    from $32,000/year for small rural departments to $2.8M for the LAPD. Multi-agency arrangements
    (e.g., San Mateo County: 18 agencies, ~$1.02M/year) drive higher TCV. FedRAMP High authorization
    (April 2026) opens federal agency procurement.
  customerFocus: >
    U.S. state and local law enforcement agencies, county sheriff departments, emergency management
    offices, and fire and rescue services; post-FedRAMP High, expanding into federal agencies; secondary
    expansion into parks, libraries, and criminal justice.
  businessModel: >
    Annual SaaS subscription with all-user-access flat fee per agency; implementation and integration
    bundled into contract; land-and-expand within jurisdictions through multi-agency aggregation deals;
    no disclosed per-seat pricing.
  stage: "Series C"
  fundingStatus: >
    $190M Series C (March 2025, Sequoia Capital lead, $2.5B post-money); prior rounds: ~$7M Series A
    (2020, Goldcrest Capital), $21.1M Series A-1 (2022), $30M Series B (May 2024, Friends & Family
    Capital and Fifth Down Capital co-lead, $360M post-money); ~$253M total disclosed. Notable early
    investors include Trae Stephens (Founders Fund) and Colin Anderson (former Palantir CFO).
