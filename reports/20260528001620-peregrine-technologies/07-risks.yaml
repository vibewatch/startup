  - id: financial-capital-risk
    title: Financial, Capital, and Model Risk
    body: >
      Peregrine raised $190 million in its Series C in March 2025, led by Sequoia Capital, at a $2.5 billion valuation, bringing
      total capital raised to over $252 million. The company has committed to using the proceeds for aggressive hiring of software
      engineers and implementation staff, product development, and market expansion. No public burn-rate figures exist, but a $190 million
      raise deployed over 18-24 months against a $10-30 million revenue base implies a high cash-consumption phase. The valuation implies
      a revenue multiple of approximately 80-250x current run rate, requiring years of triple-digit growth to justify — a threshold that
      is vulnerable to even modest procurement headwinds.

      Government contract revenue is lumpy and subject to annual budget cycles, continuing resolutions, and procurement timelines that
      extend 6-18 months. Local government IT budgets are exposed to economic downturns, state funding cuts, and changes in political
      priorities. Federal funding programs — such as Florida's State Board of Immigration Enforcement grants and Homeland Security
      technology grants that subsidize RTCC deployments — can be redirected or discontinued by a change in administration or
      legislative priorities, cutting off a meaningful acquisition channel. If civil-liberties opposition hardens across multiple
      jurisdictions simultaneously, win rates could fall faster than the team can compensate with new market entry.

      The financial model depends on annual SaaS-style contract renewals in a sector where Peregrine competes with Axon's expanding
      AI and evidence-management platform, Motorola Solutions' acquisitive build-out, and Flock Safety's rapid expansion. Incumbents
      with larger balance sheets, existing hardware relationships, and established government sales teams can undercut Peregrine on
      price or bundle equivalent functionality into existing contracts. Margin compression is a material risk as the competitive
      landscape consolidates.
