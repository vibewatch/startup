  - id: mitigations-kill-criteria
    title: Mitigations, Monitoring Indicators, and Thesis-Break Triggers
    body: >
      Peregrine's primary risk-mitigation architecture is a civil-liberties-first design: mandatory audit logs, no facial recognition,
      case-number-justified data access, and contractual privacy obligations. Adam Klein's PCLOB experience informs the privacy
      governance design, and the company has pursued FedRAMP authorization — a signal of security maturity relevant to federal
      and state agency procurement. Customer onboarding includes 24/7 monitoring and third-party audits, and Peregrine has publicly
      committed to CJIS compliance for all law enforcement deployments.

      However, these mitigations leave several thesis-break scenarios unresolved. The combination of a high-profile civil-liberties
      lawsuit, a discovery that agency data was mis-used for a politically sensitive purpose (e.g., immigration enforcement in a
      sanctuary city, or monitoring a protest), or a successful Fourth Amendment challenge to RTCC-sourced evidence in a major
      criminal trial could trigger a cascade of contract reviews and procurement pauses across the customer base. The thesis-break
      probability is low in any single quarter but accumulates over a multi-year holding period.

      Investors should monitor: (1) the number and geography of contract rejections at city council level per quarter; (2) any
      litigation naming Peregrine or a Peregrine customer as a defendant in a privacy or civil-rights case; (3) CJIS audit findings
      that cite a Peregrine customer for non-compliance attributable to the platform; (4) any security incident involving customer
      law-enforcement data; and (5) leadership departure of Nick Noone or Adam Klein. If multiple monitoring signals activate
      simultaneously, the investment case weakens materially.
    claimRefs:
      - CR036
      - CR037
      - CR038
      - CR039
      - CR040
