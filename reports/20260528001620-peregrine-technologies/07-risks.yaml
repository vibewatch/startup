callouts:
  - calloutType: risk
    title: Durham Contract Rejection — Procurement Contagion Risk Is Real
    body: >
      Durham NC's unanimous February 2026 vote to block Peregrine demonstrates that a well-organized, privacy-focused advocacy
      campaign can derail a procurement even when the police chief, mayor, and staff all support the contract. The rejection
      followed public hearings where residents cited Palantir connections, predictive policing bias, and open-ended data-use
      concerns. Peregrine's Palantir lineage is a structural liability in politically progressive jurisdictions — and most of
      its addressable market is in larger municipal departments in those same jurisdictions.
    claimRefs:
      - CR007
      - CR008
      - CR009

  - calloutType: risk
    title: High-Confidence Regulatory Gate — CJIS v6.0 Compliance Required by Oct 2027
    body: >
      The FBI's CJIS Security Policy v6.0, effective December 27, 2024, mandates 20 control families including mandatory MFA,
      encryption of all CJI in transit and at rest, comprehensive audit logging, and continuous monitoring. All law-enforcement
      software vendors serving U.S. agencies must meet or exceed these controls; customer agencies — not vendors — are audited,
      but non-compliance traceable to a vendor platform terminates contracts. Peregrine claims CJIS compliance but has not published
      independent audit evidence.
    claimRefs:
      - CR001
      - CR002
      - CR015

  - calloutType: insight
    title: Sarasota Procurement Via Immigration Fund Bypasses Local Oversight — Replication Risk
    body: >
      Florida's State Board of Immigration Enforcement provided nearly $1 million for Peregrine software to Sarasota County
      and three other Florida sheriff's offices in February 2026, bypassing local city council oversight. While this mechanism
      accelerates sales, it creates reputational and legal risk: civil-liberties advocates have targeted this procurement pathway
      as an accountability gap, and any court challenge to immigration-fund use for surveillance technology would implicate all
      agencies that used the same funding mechanism.
    claimRefs:
      - CR010
      - CR011
      - CR012

