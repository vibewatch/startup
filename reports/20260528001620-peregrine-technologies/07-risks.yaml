  - id: operational-security-risk
    title: Operational Risk and Platform Security
    body: >
      Peregrine's platform suffered a major outage on January 14, 2026, lasting 29 minutes and affecting web and mobile login, data
      ingestion, and vendor APIs. The incident was traced to a routine deployment gone wrong, indicating that the company's release
      management and rollback procedures were not sufficient to prevent customer-facing disruption. For law-enforcement customers
      operating real-time crime centers, even a 29-minute outage during an active incident can have operational and reputational
      consequences. While a single documented incident is not indicative of systemic fragility, the platform is still maturing and the
      company is in a high-growth hiring phase that often strains DevOps reliability practices.

      Data security is a material risk for any vendor aggregating criminal justice information, social media intelligence, and
      biometric-adjacent data. Peregrine claims CJIS and HIPAA compliance and operates an audit log for all data access, but it is a
      private, early-stage company with no publicly audited security posture. Adjacent vendors in the RTCC space have been exposed: EFF
      researchers documented that Flock Safety's ALPR camera networks were exploited by ICE for immigration enforcement even in sanctuary
      jurisdictions, and independent security researchers found credential vulnerabilities in Flock cameras that could have allowed
      large-scale location tracking. Although these are Flock-specific incidents, the shared surveillance-data ecosystem means any
      prominent Peregrine customer breach or exposed API would be amplified by civil-liberty critics and could accelerate procurement
      cancellations. Cybersecurity expert Joshua Michael warned that "when a platform links everything into one place, you start
      revealing relationships, routines" — describing Peregrine's data model precisely.

      Peregrine's go-to-market model requires deep integration with each agency's CAD system, RMS, digital evidence repository,
      jail management, and drone data — as evidenced by the San Mateo County agreement. Integration complexity increases implementation
      risk, lengthens sales cycles, and raises the probability of misconfiguration leading to data leakage or access-control gaps.
      Scaling from 57 contracts to hundreds while maintaining CJIS-compliant configuration management for each agency's data
      architecture is a non-trivial operational challenge.
    claimRefs:
