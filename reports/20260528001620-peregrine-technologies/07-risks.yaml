  - id: people-execution-risk
    title: People, Key-Person, and Execution Risk
    body: >
      CEO Nick Noone is the face of Peregrine and the architect of its relationships with law enforcement. His Palantir background
      shapes the company's technical philosophy, its government-sales playbook, and its civil-liberties credibility strategy — he
      has stated that Palantir's DNA is "strong in Peregrine" and that roughly a quarter of the team are Palantir alumni. His
      personal credibility is a selling point in agency boardrooms but simultaneously the most cited liability at public hearings.
      Noone's departure or reputational damage would remove the primary sales and mission asset simultaneously.

      Co-founder Ben Rudolph's role and succession plans are not publicly documented. Peregrine has brought in Adam Klein, former
      chairman of the Privacy and Civil Liberties Oversight Board (PCLOB), as a consultant to design its civil-liberties architecture,
      which mitigates some governance risk, but an advisory role is not equivalent to board-level accountability or a permanent CISO
      or privacy-officer function. The company's rapid hiring post-Series C introduces integration risk: onboarding large cohorts of
      engineers and implementation staff while maintaining CJIS-compliant security practices and consistent data governance is
      operationally demanding.

      Execution risk is heightened by the ambition to expand beyond law enforcement into healthcare, logistics, and financial services —
      verticals requiring different regulatory knowledge, sales cycles, and product adaptations. Spreading the platform roadmap across
      multiple regulatory regimes simultaneously while competing with purpose-built players in each vertical is a common cause of
      late-stage startup focus failures.
