  - id: partner-customer-concentration
    title: Partner, Customer, and Procurement Concentration Risk
    body: >
      Peregrine's customer base is almost entirely composed of U.S. state and local law enforcement agencies, creating severe
      concentration risk. Revenue is tied to annual government contracts averaging approximately $280,000 per agency. As of mid-2024,
      the company held 57 contracts; revenue tripled to $10 million in 2023 and was targeted to triple again to $30 million in 2024
      (Forbes). The company's $2.5 billion valuation at the March 2025 Series C implies a growth multiple that requires sustained
      contract wins against a small total addressable market of municipal and county law enforcement agencies.

      Government procurement is uniquely vulnerable to political disruption. The Durham NC contract rejection in February 2026 — a
      $517,000 deal declined after community activists raised privacy concerns at public City Council meetings — demonstrates that a
      single organized opposition campaign can block revenue. Peregrine's Palantir lineage (CEO Nick Noone was a senior leader at
      Palantir; ~25% of staff are Palantir alumni) is a recurring liability in public hearings, because Palantir is associated with
      U.S. Immigration and Customs Enforcement data work. In Sarasota County, procurement came through Florida's State Board of
      Immigration Enforcement — a state fund not subject to local oversight — partly sidestepping community input, but the mechanism
      itself risks triggering civil-liberties legal challenges to the purchase.

      San Mateo County's 40-month, $3.4 million agreement covering 18 agencies illustrates Peregrine's multi-agency consortia
      contracting strategy: one lead agency administers the platform for many smaller departments, creating account concentration
      where a single government decision could remove multiple revenue-generating deployments simultaneously. Technology partners
      include Axon (Evidence.com integration) and Skydio (drone-as-first-responder data feed), meaning Peregrine's product value
      proposition depends on the reliability of third-party hardware and software ecosystems it does not control. If Axon or Flock
      Safety — a key data source — alter API terms, pricing, or access policies in response to their own civil-liberties controversies,
      Peregrine's integrations could be disrupted. Flock Safety itself came under heavy scrutiny in 2025 after EFF exposed camera
      network abuses and independent researchers found security vulnerabilities.
