chapter:
  number: 7
  title: Risks
  summary: >
    Peregrine Technologies faces a layered risk profile dominated by regulatory/legal exposure from civil-liberties and privacy challenges,
    growing procurement resistance in politically sensitive jurisdictions, and capital-efficiency risk from a high-burn post-Series C phase.
    The Durham NC City Council's February 2026 contract rejection and Sarasota County's use of state immigration-enforcement funds to purchase
    Peregrine software illustrate both procurement fragility and reputational contagion from adjacent surveillance controversies. CJIS v6.0 and
    the EU AI Act (fully enforceable August 2026) tighten compliance obligations across core and expansion markets. Key-person dependence on
    CEO Nick Noone and near-total revenue concentration in U.S. government contracts amplify these structural risks.

sections:
  - id: regulatory-legal-risk
    title: Regulatory, Legal, and Civil-Liberties Risks
    body: >
      Peregrine operates at the intersection of law enforcement data aggregation, predictive analytics, and AI-generated operational insights —
      a domain subject to escalating federal, state, and local regulatory scrutiny. The FBI Criminal Justice Information Services (CJIS)
      Security Policy v6.0, effective December 27, 2024, introduces 20 control families mapped to NIST SP 800-53 Rev. 5 with over 1,300
      sub-controls; full implementation is required by October 1, 2027. Because CJIS audits are agency-based rather than vendor-certified,
      Peregrine is not directly audited, but any customer agency non-compliance exposes contracts to remediation demands or termination. The
      HIPAA Security Rule imposes a parallel data-protection regime wherever health information is co-mingled with law-enforcement data, a
      scenario that could arise in Peregrine's planned healthcare sector expansion.

      The EU AI Act becomes fully enforceable on August 2, 2026, prohibiting real-time remote biometric identification of individuals in
      publicly accessible spaces for law enforcement purposes except under narrow, court-authorized exceptions. Although Peregrine is primarily
      a U.S.-focused platform and explicitly bans facial recognition in its contracts, international market expansion into Canada and beyond
      raises the question of how the EU's high-risk AI classification — applicable even to data-aggregation systems that power biometric
      follow-on analysis — interacts with Peregrine's roadmap. Trump's December 2025 executive order directs the Department of Justice to
      challenge state-level AI laws that conflict with a national minimally-burdensome framework, but the order preserves state authority to
      regulate law enforcement's own AI use, leaving city- and state-level bans on predictive policing legally intact.

      The Fourth Amendment doctrine is shifting to address large-scale digital surveillance. Legal scholars and courts — building on
      Carpenter v. United States (2018) — increasingly treat AI-fused, real-time aggregation of license plate, dispatch, bodycam, and social
      media data as a "search" that may require a warrant. Multiple law review articles and pending cases argue that pattern-of-life
      inference from RTCC platforms triggers heightened constitutional scrutiny. A finding that Peregrine-enabled data aggregation
      constitutes a warrantless search in any major jurisdiction could require customer agencies to restructure operational use, creating
      contract risk and reputational damage. The Electronic Frontier Foundation has called RTCC operators like Peregrine "inherently going
      to have a hard time protecting privacy because everything they're built on is fundamentally privacy-damaging."

      Brennan Center researchers warn that unregulated AI in policing can reinforce racial bias and enable function creep beyond stated
      law-enforcement goals. Rachel Levinson-Waldman (Brennan Center) testified that Peregrine-class technology could be repurposed for
      monitoring abortion access, reproductive rights, immigration status, and gender identity documentation — all areas undergoing rapid
      criminalization. Durham community organizer Rayna Rusenko stated in January 2026 that "no one here today can promise that Durham's
      policing tools and infrastructure won't be used against us all in six months." The Durham City Council voted unanimously in February
      2026 to block the Peregrine contract, citing data privacy concerns and the platform's Palantir lineage.
