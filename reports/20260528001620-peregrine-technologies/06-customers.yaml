artifact: customers
slug: peregrine-technologies
runDate: "2026-05-28"
company:
  name: "Peregrine Technologies"
chapter:
  number: 6
  title: "Customers"
  summary: >-
    Peregrine Technologies' customer base is anchored by four production contracts verified in
    government filings — LAPD ($2.8M, 2023–2027), Richmond CA PD ($1.1M, 2021–2026), San Mateo
    County's 16-agency consortium ($3.4M, Jan 2026), and OC Sheriff — with Forbes confirming 57
    signed contracts as of August 2024 and the company claiming 400-plus agencies by mid-2025.
    Revenue grew from ~$3M (2022) to ~$10M (2023), averaging $280K/agency/year. Material risks
    include LAPD single-customer concentration (~28% of 2023 ARR), geographic concentration in
    California, adverse procurement outcomes in Durham NC (rejected Feb 2026) and Charlottesville
    VA (paused Jun 2025), and a complete absence of publicly disclosed NRR/GRR data.

sections:
  - id: customer-segmentation
    title: "Customer Segmentation"
    body: >-
      Peregrine Technologies serves a customer base concentrated in US law enforcement agencies,
      primarily municipal police departments and county sheriff's offices. The company's stated
      addressable market spans roughly 18,000 state, local, and tribal law enforcement agencies,
      with the most commercially active segment comprising mid-to-large departments that can
      support annual subscriptions of $180,000 or more. The firm has disclosed or been reported
      to have contracts spanning California (LAPD, OC Sheriff, Richmond PD, San Mateo multi-agency,
      Lathrop PD), Texas (Dallas PD), and Florida (Sarasota County Sheriff), with the California
      concentration reflecting both the founding geography and a receptive political environment
      in some counties. By March 2025, the company claimed coverage of 80 million Americans across
      40-plus agencies, a metric that blends contract counts with population data rather than
      enumerating paying customers. Beyond law enforcement, Peregrine has begun marketing to fire
      departments, emergency management agencies, and parks and libraries, though no production
      deployments outside law enforcement have been publicly named. The dominant buyer profile is
      the police chief or sheriff working with a city council or county board for budget approval,
      typically via general fund appropriations or federal grants. Contract sizes range from
      roughly $32,000 per year for small rural departments to $2.8 million for large metropolitan
      forces, with an average of approximately $280,000 per year per CEO Noone's public statements.
    claimRefs:
      - CU001
      - CU013
      - CU014
      - CU015
      - CU019
      - CU029
      - CU032
      - CU035
    tableRefs:
      - TU001
    figureRefs:
      - FU001

  - id: named-customer-proof
    title: "Named Customer Proof"
    body: >-
      The strongest evidence for Peregrine's customer traction comes from official government
      filings rather than company marketing materials. The Los Angeles Police Department awarded
      a $2,793,750 contract for Project Blue Light, covering roughly 9,500 officers from October
      2023 through May 2027 — a four-year commitment visible in the Los Angeles City Clerk's
      online contracts database. Orange County Sheriff's Office is a production customer whose
      Real-Time Operations Center unifies over 30 data systems through Peregrine, with an AWS
      case study providing third-party evidence of live deployment. Richmond, California's Police
      Department has maintained a $1.1 million five-year contract since November 2021, making it
      among Peregrine's earliest disclosed commercial deployments. San Mateo County's January 2026
      board-approved deal — $3.4 million over 40 months for a 16-agency consortium including the
      Sheriff and the DA's Office — represents the firmest recent evidence of scalable regional
      adoption. Adversely, Durham, NC rejected its $517,500 sole-source contract in February 2026
      after a 4-3 city council vote, and Charlottesville, VA paused use in June 2025 citing 287(g)
      immigration enforcement concerns. Dallas PD deployed Peregrine for 2026 FIFA World Cup
      security operations, and Sarasota County Sheriff signed approximately $1 million funded via
      Florida state immigration enforcement appropriations. Brennan Center researchers found that
      OC Sheriff acknowledged having no formal use-limitation policies for Peregrine data, adding
      an adverse governance dimension to an otherwise confirming deployment. Multiple civil liberties
      organizations including EFF, ACLU, and Campaign Zero have independently flagged specific
      deployments as surveillance risks.
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
