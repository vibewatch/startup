callouts:
  - calloutType: strength
    title: "LAPD Contract Anchors Enterprise Credibility"
    body: >-
      The $2,793,750 Project Blue Light contract with LAPD — verified in the Los Angeles City
      Clerk's database — is the strongest enterprise proof point in Peregrine's customer portfolio.
      It covers roughly 9,500 officers over four years and sets a price anchor justifying the
      $280K average ACV claim. As the nation's largest municipal police department, LAPD's
      production deployment materially reduces procurement friction for peer agencies and anchors
      Peregrine as an enterprise-grade public safety platform rather than a pilot-stage tool.
      At approximately 28% of estimated 2023 ARR, the contract also represents the most visible
      concentration risk in the portfolio.
    claimRefs:
      - CU002
      - CU034
      - CU021

  - calloutType: risk
    title: "Durham and Charlottesville Signal Political Procurement Risk"
    body: >-
      The February 2026 rejection by Durham's City Council (4–3) and the June 2025 pause by
      Charlottesville PD expose a pattern of civil-liberties and immigration-enforcement-related
      procurement risk. In Durham, community advocates and council members cited data privacy
      and equity concerns; in Charlottesville, the trigger was 287(g) immigration enforcement.
      Both situations arose from organized advocacy campaigns rather than product performance
      failures. This risk is concentrated in progressive municipalities and is difficult to
      mitigate through product improvement alone, representing a structural addressable-market
      constraint that investors should model into pipeline conversion assumptions.
    claimRefs:
      - CU008
      - CU009
      - CU040
      - CU047

  - calloutType: insight
    title: "Regional Consortium Model Creates Durable Network Effects"
    body: >-
      San Mateo County's 16-agency consortium model demonstrates that a single county-level sale
      can onboard an entire regional law enforcement ecosystem simultaneously, reducing per-unit
      customer acquisition cost while increasing platform switching costs through cross-agency
      data dependencies. When 16 departments share data on the same platform, NRR at renewal
      should structurally exceed 100%. Peregrine should be asked whether other regional consortium
      deals are in the pipeline, as this model is the company's most defensible and highest-
      leverage growth vector, capable of compressing the 18,000-agency TAM into a manageable
      number of county-level deals.
    claimRefs:
      - CU004
      - CU030
      - CU036
      - CU044

