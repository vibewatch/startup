  - id: adoption-trajectory
    title: "Adoption Trajectory"
    body: >-
      Peregrine's disclosed adoption trajectory shows strong but unevenly documented growth.
      Forbes confirmed 57 signed contracts as of August 2024, representing the most credible
      point-in-time count from an independent publication. The company subsequently claimed
      400-plus agencies by mid-2025 — a near seven-fold expansion in under a year that, if
      accurate, implies rapid pipeline conversion, though the definition likely conflates
      production contracts, pilots, and provisional agreements. Reported revenue grew from
      approximately $3 million in 2022 to $10 million in 2023, with CEO Noone citing a $30
      million ARR target for 2024; these figures remain unconfirmed by independent audit.
      The average contract value of $280,000 per year implies that even at 57 contracts
      annual revenue would approach $16 million, suggesting either contract underperformance
      or that the 57 count understates the active base. A conflicting-data gap exists between
      the Forbes-confirmed 57 contracts and the 400-plus agency claim. Richmond CA PD's November
      2021 contract establishes the longest running production engagement and suggests strong
      customer longevity. California, where at least five distinct agencies are documented,
      shows regional clustering consistent with referral-based enterprise sales.
    claimRefs:
      - CU001
      - CU007
      - CU012
      - CU013
      - CU015
      - CU023
      - CU030
      - CU033
    tableRefs:
      - TU002
    figureRefs:
      - FU002

  - id: retention-durability
    title: "Retention and Durability"
    body: >-
      Peregrine has not disclosed net revenue retention, gross retention, or churn data, leaving
      investor visibility into durability limited to the handful of named contracts with known
      durations. The available data points are structurally positive: LAPD signed a four-year
      deal, Richmond has maintained its five-year contract through 2026, and San Mateo committed
      to a 40-month term. No production customer has publicly announced a mid-contract cancellation;
      Durham was rejected before deployment and Charlottesville paused rather than terminated.
      However, the absence of cohort data, NRR disclosures, or renewal-rate statistics is a
      material due-diligence gap. Richmond CA PD's 2021 contract makes it among the earliest
      production customers and provides a data point on multi-year continuity. At average contract
      values of $280,000 over multi-year terms, even modest churn would have significant revenue
      impact. The sole public satisfaction evidence derives from a case study hosted by AWS for OC
      Sheriff and an eRepublic whitepaper; no independent G2 or Gartner Peer Insights ratings
      exist for Peregrine. Charlottesville's pause after adoption demonstrates that political
      risk can materialize even post-deployment, representing a new retention risk category
      distinct from product performance.
    claimRefs:
      - CU003
      - CU020
      - CU023
      - CU031
      - CU039
      - CU041
      - CU046
      - CU050
    tableRefs:
      - TU004
    figureRefs:
      - FU004

  - id: expansion-concentration
    title: "Expansion and Concentration Risks"
    body: >-
      Peregrine's expansion profile shows both a compelling land-and-expand model and meaningful
      concentration risks. The San Mateo multi-agency consortium is the clearest example of
      regional network effects: a single county-level sale brought 16 city police departments,
      the Sheriff, and the DA's Office onto the platform simultaneously, lowering per-unit sales
      cost and creating data-sharing incentives that deepen switching costs. LAPD's $2.8 million
      contract represents an estimated 28 percent of Peregrine's 2023 ARR, suggesting single-
      customer concentration risk that would be material if the contract were not renewed in 2027.
      Geographic concentration in California — with at least five disclosed customers — creates
      channel risk if regulatory or political headwinds emerge statewide. Florida's immigration-
      enforcement funding pathway, which routed at least four sheriff's contracts through Florida
      SB 1718 funds, illustrates a new channel that is both fast-growing and politically exposed.
      At least one Durham City Council member cited data privacy and equity concerns in the 2026
      rejection, and Charlottesville's pause signals that even adopted customers may suspend use
      when political risk escalates at the municipal level. ACLU and EFF each filed documented
      objections, and Campaign Zero mapped Peregrine as part of a broader surveillance ecosystem.
      Progressive municipalities that rejected or paused Peregrine signal a ceiling on total
      addressable market in politically sensitive cities. Peregrine has not publicly announced
      any revenue or procurement reseller channel partnerships, making the sales model largely
      direct. FedRAMP High authorization opens a pathway to federal contracts, which may reduce
      political risk concentration by diversifying the customer base beyond progressive cities.
    claimRefs:
