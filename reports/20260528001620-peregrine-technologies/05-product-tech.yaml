chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Peregrine Technologies delivers a cloud-native SaaS decision-support platform that unifies siloed
    public safety data—CAD, RMS, ALPR, bodycam, drone feeds, digital evidence—into a single auditable
    environment hosted on AWS GovCloud. The platform achieved FedRAMP High authorization in April 2026
    and is CJIS/HIPAA-compliant, serving 225+ agencies across 23 states. AI features (record
    deduplication, report summarization, safety flagging, Peregrine Vision video analytics) are
    additive and human-in-the-loop, with no facial recognition and no training on customer data.
    Civil liberties concerns over predictive policing and surveillance aggregation resulted in contract
    rejections in Durham, NC and a pause in Charlottesville, VA, posing a material adoption risk in
    politically sensitive jurisdictions.

sections:
  - id: product-definition
    title: Product Definition and Customer Workflow
    body: >-
      Peregrine Technologies offers a real-time intelligence center (RTIC) platform purpose-built for
      public safety agencies. In the customer workflow, officers and investigators previously toggled
      between siloed legacy systems—a Computer-Aided Dispatch (CAD) tool, a Record Management System
      (RMS), an ALPR database, separate bodycam footage portals, and paper records—spending hours or
      weeks correlating data across systems before acting on it. Peregrine replaces this fragmented
      landscape by pulling every authorised data source into a single, browser-based, searchable
      application hosted on AWS GovCloud. An investigator enters a name, address, or plate number and
      receives integrated results spanning court records, arrest reports, field interviews, license-plate
      sightings, bodycam transcript snippets, and any other connected dataset within seconds. The
      platform also supports grant-reporting workflows (as demonstrated by Newark PD's transition from
      hours to minutes on STEP grant filings), disaster-response coordination (New Orleans Super Bowl
      LIX deployment), and behavioral-health co-response (180% utilisation increase in one California
      city). Peregrine is fully interoperable and vendor-agnostic, requiring no data migration; a
      dedicated deployment engineer is embedded with every customer to configure integrations. The
      company serves 90+ million people through hundreds of agencies in 23 US states and two countries
      as of early 2026.
    claimRefs:
      - CE001
      - CE002
      - CE015
      - CE016
      - CE017
      - CE041
    tableRefs:
      - TE002
    figureRefs:
      - FE002

  - id: modules-architecture
    title: Module Map and Technical Architecture
    body: >-
      Peregrine's platform is composed of four primary layers. The Data Sources Layer ingests structured
      and unstructured feeds from CAD (Motorola, CentralSquare, Mark43, Tyler, Hexagon), RMS platforms,
      ALPR networks, body-worn camera systems, Axon Evidence.com digital-evidence vaults, Skydio
      drone-as-first-responder (DFR) feeds, jail management systems (JMS), and third-party sensors.
      The proprietary Data Integration Layer normalises these heterogeneous inputs using machine-learning
      identity resolution and vendor-agnostic adapters without requiring full data migration. This layer
      is claimed to support virtually any structured or unstructured source. The Analytics and AI Layer
      runs record deduplication, report summarisation, safety-flag generation, OCR, and audio
      transcription; the "Peregrine Vision" AI video analytics suite (launched 2024) is claimed to reduce
      evidence-review time by approximately 80%. An Emergency Operations Module targets disaster-response
      use cases (incident visualisation, resource allocation, interagency messaging), and a Resource
      Optimizer tool (beta) forecasts demand spikes with approximately 92% accuracy. The Presentation
      Layer delivers a unified operator dashboard with geospatial visualisation, cross-dataset search,
      and collaboration tools. All layers run on AWS GovCloud using Amazon Redshift, RDS, EC2, and S3.
      The architecture supports multi-tenant agency isolation with permission-based data segregation and
      a microservices design enabling elastic scaling without per-customer infrastructure provisioning.
    claimRefs:
      - CE003
      - CE007
      - CE008
      - CE034
