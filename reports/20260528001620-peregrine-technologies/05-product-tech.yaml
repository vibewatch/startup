  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: architecture internals
      missingEvidence: >-
        Internal microservices architecture diagrams, connector API specifications, data schema
        design, and containerisation/orchestration stack details (e.g., Kubernetes, ECS) are not
        publicly disclosed.
      whyItMatters: >-
        Without architecture internals, it is impossible to assess scalability ceilings, integration
        failure modes, or the technical defensibility of the proprietary Data Integration Layer moat
        claim.
      diligencePath: >-
        Request architecture documentation, SOC 2 Type II report, and a technical whitepaper under
        NDA during due diligence; review AWS architecture review board (ARB) findings if available.
      relatedQuestionRefs:
        - QE025
        - QE024

    - type: private-evidence-only
      severity: material
      topic: uptime and reliability
      missingEvidence: >-
        No public SLA, status page, uptime history, or incident response record is published; AWS
        GovCloud provides a base availability guarantee but customer-facing SLA details are not
        disclosed.
      whyItMatters: >-
        Public safety agencies require high-availability guarantees; an undisclosed SLA could create
        contractual risk and is a diligence gap for enterprise buyers.
      diligencePath: >-
        Obtain service agreement and SLA schedules; request historical incident log and AWS CloudTrail
        reports for uptime metrics.
      relatedQuestionRefs:
        - QE026

    - type: missing-source
      severity: material
      topic: AI accuracy benchmarks
      missingEvidence: >-
        No independent third-party benchmark for Peregrine Vision accuracy, false-positive rates, or
        safety-flag precision/recall exists in the public record. The 80% evidence-review time
        reduction claim is company-stated.
      whyItMatters: >-
        AI accuracy and bias metrics are central to civil liberties risk assessment and regulatory
        scrutiny; unverified accuracy claims are a diligence blocker in politically sensitive
        jurisdictions.
      diligencePath: >-
        Request internal model validation reports; seek NIST-conformant evaluation; ask for
        demographic breakdown of safety-flag precision/recall across agency jurisdictions.
      relatedQuestionRefs:
        - QE020

    - type: missing-source
      severity: material
      topic: Palantir architecture comparison
      missingEvidence: >-
        A head-to-head technical comparison of Peregrine vs. Palantir Gotham on deployment
        complexity, data schema flexibility, and integration breadth does not exist in the public
        record.
      whyItMatters: >-
        Peregrine's core positioning is Palantir-like power at local-government price and
        complexity; without a verified comparison, the competitive differentiation claim cannot be
        confirmed.
      diligencePath: >-
        Conduct reference interviews with agencies that evaluated both platforms; request Peregrine's
        competitive battle card and implementation time studies.
      relatedQuestionRefs:
        - QE025
        - QE010

    - type: private-evidence-only
      severity: minor
      topic: DOJ ID/IQ contract confirmation
      missingEvidence: >-
        The $700M DOJ Ceiling ID/IQ contract cited by one analyst source has not been confirmed by
        an official DOJ award announcement, SAM.gov contract notice, or press release from Peregrine.
      whyItMatters: >-
        If confirmed, this contract provides a significant federal procurement vehicle that
        accelerates agency customer acquisition and revenue growth; unverified, it should not be
        used as a hard fact in investment analysis.
      diligencePath: >-
        Search SAM.gov for Peregrine Technologies contract awards; request confirmation from
        Peregrine via a formal data room request during due diligence.
