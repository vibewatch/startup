  - id: trust-security-compliance
    title: Trust, Security, Privacy, and Compliance
    body: >-
      Security and privacy architecture sits at the centre of Peregrine's sales proposition into
      government. The platform operates in AWS GovCloud and achieved FedRAMP High authorisation in April
      2026—the same tier required by agencies handling the most sensitive unclassified federal data. It is
      CJIS-compliant (encryption in transit and at rest, role-based access controls, single sign-on,
      full audit logging including who accessed what, when, and why) and HIPAA-compliant for
      health-adjacent use cases. Customer agencies exclusively own and control their data; Peregrine does
      not collect, own, or train on customer data, and provides written confirmation of secure deletion on
      contract expiry. Four AI principles govern feature deployment: AI is used only where it has practical
      impact; a human must be in the loop; customers choose whether and when AI features activate; customer
      data is never used to train any model. The company reports no data breach in its operational history.
      A "Protection of Privacy and Civil Liberties" clause is included in contracts. Former US Privacy and
      Civil Liberties Oversight Board chairman Adam Klein serves as an advisor. Despite these safeguards,
      civil liberties advocates—EFF, ACLU Massachusetts, Brennan Center for Justice, and Durham community
      groups—argue that aggregating mobile pings, license plate data, and police records into a single
      searchable platform inherently enables mass surveillance and predictive policing, regardless of policy
      restrictions. Contract defeats in Durham, NC (February 2026) and a pause in Charlottesville, VA
      (June 2025) confirm that trust and privacy concerns are a real commercial drag in politically engaged
      municipalities.
