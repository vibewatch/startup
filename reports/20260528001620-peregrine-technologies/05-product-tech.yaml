    title: Peregrine Platform Architecture Stack
    type: stack
    layout: standard
    summary: >-
      Five-layer architecture from disparate agency data sources through the proprietary integration
      layer, AI analytics, operator applications, and AWS GovCloud security/compliance foundation.
    data:
      layers:
        - label: "Data Sources (Agency-Owned)"
          detail: "CAD (Motorola, CentralSquare, Mark43, Tyler, Hexagon); RMS platforms; ALPR networks; bodycam feeds; Axon Evidence.com; Skydio DFR; Jail Management System (JMS); third-party sensors; 911/dispatch records"
        - label: "Data Integration Layer (Proprietary)"
          detail: "Vendor-agnostic ETL connectors; ML identity resolution; record linkage; deduplication preprocessing; no data migration required; handles structured and unstructured inputs"
        - label: "Analytics and AI Layer"
          detail: "Record deduplication AI; report summariser; safety-flag engine; Peregrine Vision video analytics (edge + cloud); OCR; audio transcription; Resource Optimizer (predictive demand, beta); geospatial correlation"
