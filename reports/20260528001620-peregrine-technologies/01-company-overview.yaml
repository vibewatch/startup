  "callouts": [
    {
      "calloutType": "strength",
      "title": "Deep founder-market fit and embedded-first go-to-market",
      "body": "Nick Noone's Palantir operational background\u2014specifically leading U.S. SOCOM intelligence work\u2014and 18 months embedded with the San Pablo PD before writing a line of product code gives Peregrine a level of domain credibility and customer trust that is exceptionally hard to replicate. The approach produced a verifiable case outcome (murder conviction) and spread almost entirely through word of mouth within law enforcement. This embedded, mission-centric model is the company's core competitive moat and the primary reason it reached 57 contracts with little traditional marketing.",
      "claimRefs": [
        "CO004",
        "CO013",
        "CO015",
        "CO017",
        "CO037"
      ]
    },
    {
      "calloutType": "risk",
      "title": "Civil liberties and contract-rejection risk is real and growing",
      "body": "The Durham NC council rejection and EFF characterization of Peregrine's model as 'inherently going to have a hard time protecting privacy' represent the leading indicator of a category-level headwind. The Palantir DNA critique\u2014amplified by Noone's own public statements about team composition\u2014makes it easier for opponents to frame Peregrine as military surveillance brought to local police. As more city councils apply procurement scrutiny, each public rejection creates a reputational chilling effect. Peregrine's civil liberties advisory (Adam Klein) and contractual privacy clauses are credible mitigants but not complete shields.",
      "claimRefs": [
        "CO017",
        "CO038",
        "CO039",
        "CO040",
        "CO041",
        "CO042"
      ]
    },
    {
      "calloutType": "risk",
      "title": "Private company metrics opacity limits valuation anchoring",
      "body": "The $2.5 billion Series C valuation rests on revenue-tripling claims and a 7\u00d7 step-up from the Series B benchmark in under a year, but ARR, gross margin, net revenue retention, and contract churn are entirely unconfirmed by the company. Third-party estimates ($40.9M ARR) imply a roughly 61\u00d7 ARR multiple\u2014defensible in a high-growth enterprise SaaS market but sensitive to any deceleration. Investors and diligence teams should require audited financials, customer retention data, and full-contract-unit-economics before anchoring on the unicorn valuation.",
      "claimRefs": [
        "CO026",
        "CO027",
        "CO028",
        "CO031",
        "CO032",
        "CO046"
      ]
    }
