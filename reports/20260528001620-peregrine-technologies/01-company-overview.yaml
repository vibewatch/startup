      "id": "funding-history-and-capital-structure",
      "title": "Funding history, investor base, and capital structure",
      "body": "Peregrine's funding history progresses from sub-scale seed rounds to a high-conviction unicorn raise in under eight years. The first disclosed institutional capital was a Series A of approximately $7 million in 2020, followed by a Series A-1 extension of $21.1 million in 2022 as the product began gaining agency traction. The Series B came in May 2024: $30 million led by Friends & Family Capital and Fifth Down Capital, with existing backers Goldcrest Capital, Craft Ventures, and Godfrey Capital participating. At the time of the Series B, Crunchbase data showed total disclosed funding of $60 million. Forbes reported a post-Series B valuation of approximately $360 million, a figure Noone provided in a May 2024 interview.\n\nThe March 2025 Series C is the defining financing event. Sequoia Capital led the $190 million round, with Goldcrest Capital, Friends & Family Capital, Fifth Down Capital, OG Venture Partners, and Godfrey Capital returning. The $2.5 billion post-money valuation represents roughly a 7\u00d7 step up from the $360 million post-Series B figure reported just ten months earlier\u2014a steep multiple that reflects the company's stated revenue-tripling trajectory and Sequoia's conviction in the public safety tech market. Crunchbase noted it is the largest law enforcement/public safety startup raise since Dataminr's $475 million Series F in 2021.\n\nBeyond the headline raise, the capital structure has several open diligence dimensions. No public source discloses the liquidation stack, participation rights, anti-dilution provisions, or investor pro-rata allocations. The connection between investors and founders is notable: Colin Anderson, former Palantir CFO, and Trae Stephens of Founders Fund\u2014both Palantir alumni\u2014led separate earlier rounds, underscoring the Palantir network's role as a capital and credibility substrate for the company. Total capital raised through the Series C is approximately $248 million by summing disclosed rounds, though pre-Series A angel or family-and-friends money may not be fully captured in public databases.",
