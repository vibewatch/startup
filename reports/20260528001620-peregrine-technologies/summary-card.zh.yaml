summary:
  headline: >
    Peregrine 的增长资历和一线投资人背书都很强，但定价约为 ARR 的 61 倍，是同期 Flock Safety 可比交易的两倍以上；所在市场的公民自由风险还在升温，单位经济性也完全未披露。只有完成 ARR 审计、确认
    NRR，并看到估值下调后，才适合继续观察。
