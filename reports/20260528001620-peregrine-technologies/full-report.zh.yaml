  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Peregrine Technologies
              提供面向公共安全机构定制的实时情报中心（RTIC）平台。过去在客户工作流里，警员和调查人员要在彼此割裂的旧系统之间来回切换——计算机辅助调度（CAD）工具、记录管理系统（RMS）、ALPR
              数据库、独立执法记录仪影像门户和纸质记录——行动前往往要花数小时甚至数周跨系统关联数据。Peregrine 把所有获授权数据源拉进一个托管在 AWS GovCloud
              上、基于浏览器、可搜索的单一应用，从而替代这种碎片化格局。调查人员输入姓名、地址或车牌号，数秒内即可获得整合结果，覆盖法院记录、逮捕报告、现场盘查询问、车牌识别记录、执法记录仪转录片段以及任何其他已接入数据集。平台还支持拨款报告工作流（Newark
              PD 的 STEP 拨款申报从数小时缩短到数分钟）、灾害响应协同（New Orleans Super Bowl LIX 部署）以及行为健康协同响应（某 California 城市使用率提升
              180%）。Peregrine 完全互操作、厂商中立，不要求数据迁移；每个客户都会嵌入一名专职部署工程师来配置集成。截至 2026 年初，公司通过 23 个美国州和两个国家的数百个机构，服务 90+
              million 人。
            claimRefs:
              - CE001
              - CE002
              - CE015
              - CE016
              - CE017
              - CE041
