  - id: TM004
    title: 增长驱动因素和采用约束——公共安全分析
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 影响
      - 尽调问题
    rows:
      - - RTCC 潮流——300+ 家美国机构已设 RTCC，仍在增长
        - 驱动因素
        - 当前，正在加速
        - 为分析平台采用制造长期拉力；RTCC 需要 Peregrine 提供的数据集成层
        - 把 RTCC 部署管线映射到 Peregrine 胜率；Peregrine 是默认分析层，还是众多供应商之一？
      - - 联邦拨款资金（Byrne JAG、COPS、NG-911）
        - 驱动因素
        - 持续，受年度拨款影响
        - 降低小机构资本门槛；拨款获批后加快成交速度
        - 量化 Peregrine 已关闭交易中由拨款资助的比例；评估 FY2026 拨款预算不确定性
      - - FedRAMP High 授权
        - 驱动因素
        - 已取得；短期赋能因素
        - 打开联邦采购市场（FBI、DHS、DEA），合同金额更大、黏性更高
        - Peregrine 在 FedRAMP 后参与了多少联邦 RFP？联邦管线多大？
      - - 公共安全 AI/ML 采用要求
        - 驱动因素
        - 2025–2027 年窗口
        - 市、州技术现代化要求和警务改革中的数据问责要求推高分析需求
        - 需求来自合规要求（法院同意令、警务改革）还是自主支出？
      - - 公共安全现有 SaaS 厂商增长（Axon +33%、Motorola +8%）
        - 驱动因素（市场验证）
        - 当前
        - 证明政府买家愿意为公共安全支付经常性软件费，验证 SaaS 模型
        - 确认 Axon/Motorola 的分析扩张是给 Peregrine 增量，还是直接替代
      - - 公民自由 / 预测性警务反对
        - 约束
        - 当前，难以预测
        - 后期合同取消（Durham）和暂停（Charlottesville）带来无法量化的采购风险；市议会投票是硬门槛
        - 跟踪存在公众反对时合同的赢 / 输率；Peregrine 是否在打造社区沟通打法？
      - - 政府采购周期长（6–18 个月）
        - 约束
        - 结构性
        - 拉长 CAC 回本周期，并造成收入波动；管线转化慢且依赖政治
        - Peregrine 从首次接触到签约平均多久？什么因素能压缩周期？
      - - 遗留系统集成复杂度
        - 约束
        - 结构性，但随 API 普及而下降
        - 深度 CAD/RMS 集成（Motorola、Tyler）形成切换成本和实施负担；集成失败会拖延或杀死交易
        - Peregrine 目前对接了多少家不同 RMS/CAD 厂商？集成失败率是多少？
    notes: |
      方向和时间是基于已引用市场数据作出的定性判断。它们对 Peregrine 具体交易管线的定量影响仍未知， 需要一手研究。时间指驱动因素或约束最活跃的窗口，不代表结果必然发生。
