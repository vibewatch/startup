      - number: '2.2'
        title: 市场规模 — TAM、SAM、SOM 与多组分析师口径
        blocks:
          - type: paragraph
            body: >
              2026 年全球执法软件市场估算因纳入支出类别不同，相差 2–3x。Mordor Intelligence 对执法软件市场的测算区间，与 2026 年全球 $7–10B 一致，并预计到 2031 年保持强
              CAGR。Precedence Research 的 2026 年估计隐含完整执法软件品类全球约 $18–19B，到 2035 年增至 $50.32B，CAGR 约 11%。Technavio/Yahoo
              Finance 分析预计 2026–2030 年新增市场增长 $9.4B。Fact.MR 估计公共安全软件市场（窄于全部执法软件）2026 年为 $13.6B，CAGR 9.1%。Coherent Market
              Insights 和 Mordor Intelligence 对公共安全分析子市场的估计收敛在 2026 年 $14.6–16.9B，CAGR 13–20%。

              预测性警务子赛道有边界：Research and Markets 预测 2026 年全球 $2.82B，到 2032 年 CAGR 12.6%。Business Research Company 对预测性警务中的
              AI 估算为 2025 年 $5.77B，以 49.7% CAGR 增长，到 2030 年可能变成很大的数字——但该口径非常宽，把所有 AI 驱动公共安全决策支持都纳入其中。

              对 Peregrine 最有用的规模口径，是服务美国州和地方执法机构的数据分析与情报平台市场。GovTech 和 Gartner 数据显示，在 2026 年 $160.2B 美国州和地方政府 IT
              预算中，司法和公共安全约占 $15B。如果分析平台占这块公共安全 IT 支出的 10–25%——考虑完整技术栈，这是合理估计——美国公共安全分析 TAM 约为 $1.5–3.8B。Peregrine 的 SAM
              进一步收窄到有足够规模和任务授权、能够采用多源数据集成的机构（约 500–3,000 个，基数为约 18,000 个美国执法机构），折合每年 $1–3B 软件支出。

              Peregrine 当前 SOM 无法从公开披露精确推导。公司覆盖 40+ 机构，收入每年翻三倍，合同金额从 $517K（Durham）到 $3.4M（San Mateo）不等，隐含累计 ARR
              在数千万美元级别——与即便保守 SAM 下仍低于 5% 的 SOM 捕获率一致，说明跑道充足。分析师估算分歧很大，也构成尽调风险；如果不先做上述边界分析，不应直接使用一个笼统的 TAM（$13.6–19B）。
