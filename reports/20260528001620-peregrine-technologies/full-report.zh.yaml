          - type: callout
            title: 公民自由反对是反复出现的商业风险
            body: >-
              NC Durham 市议会在 2026 年 2 月取消了与 Peregrine 的 $517K 合同，VA Charlottesville 警察局在 2025 年 6 月暂停使用。EFF、ACLU 和
              Brennan Center 均提示了预测性警务和监控聚合风险。在政治参与度高的市镇，这一模式可能重演，带来收入拖累、声誉风险以及潜在采购条件（例如强制设立社区顾问委员会），从而推高单笔交易复杂度和成本。
