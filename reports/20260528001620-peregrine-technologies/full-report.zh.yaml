      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >
              公共安全分析采购涉及三类不同角色：买方（机构领导、市 / 县行政人员或 IT 采购办公室）、用户（巡警、侦探、犯罪分析师、应急协调员）和付款方（市 /
              县普通基金、州拨款或联邦补助）。这些角色很少重合：市议会或县委员会投票批准合同，警察局长或治安官为技术背书，分析师或警员日常使用，预算可能部分来自城市申请的 Byrne JAG 或 COPS 补助。

              按机构类型划分，主要细分包括：（1）人口 50,000+ 城市的市警察局，通常有专职犯罪分析师和 RTCC
              运营；（2）服务非建制地区的县治安官部门，跨机构情报共享需求复杂；（3）覆盖广阔地理区域的州执法机构（州警察、州调查局）；（4）联邦机构（FBI、DHS 组成部门、DEA），FedRAMP High
              授权是采购前提；（5）应急管理和 fusion center，负责协调执法、消防、EMS 和国土安全。

              预算归属在民选或任命官员手中（市长、城市经理、县行政长官），他们会接收警察局长或治安官的建议。实际采用触发点通常是高关注度犯罪事件、城市领导层对数据驱动警务的要求，或可抵消资本成本的联邦补助。合同金额从小中型机构的
              $200K–$500K，到大型多辖区部署的 $2M–$5M 不等。

              联邦补助项目——尤其是 Byrne Justice Assistance Grants（JAG）、Community Oriented Policing Services（COPS）技术补助和 NG-911
              实施资金——是重要需求加速器。相当一部分 RTCC 部署至少部分由联邦补助资助，降低了小型市政当局的前期资本门槛。这带来一种采购动态：联邦补助周期（年度拨款、申请窗口）可以在机构意愿之外，加速或拖延合同时间线。
