        - 覆盖 5M+ 起警方调查；以英国 / 欧洲为主
        - 聚焦调查和证据管理的大型机构
        - 调查工作流深；英国 / 欧洲存在感强；数字证据保管链
        - 美国 RTCC 实时告警能力有限；地域集中
    notes: 各行覆盖 Peregrine 买家在采购比较中最可能遇到的主要直接、相邻和现有竞争对手。 孤立视频墙、人工值班指挥工作流等维持现状的替代方案已在第 1 节正文提及，但未作为供应商行列举。
