      - number: '6.6'
        title: 附录
        blocks:
          - type: callout
            title: LAPD 合同锚定企业级可信度
            body: >-
              与 LAPD 签订的 $2,793,750 Project Blue Light 合同——已在 Los Angeles City Clerk 数据库验证——是 Peregrine
              客户组合中最强的企业级证明点。合同四年覆盖约 9,500 名警员，并设立了一个价格锚点，支撑 $280K 平均 ACV 的说法。作为全美最大的市级警察部门，LAPD 的生产部署实质性降低了同类机构的采购摩擦，也把
              Peregrine 锚定为企业级公共安全平台，而不是试点阶段工具。该合同约占估计 2023 年 ARR 的 28%，也是客户组合中最显眼的集中度风险。
