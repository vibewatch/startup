chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、平台与商业模式
        blocks:
          - type: paragraph
            body: >-
              Peregrine Technologies 总部在旧金山，核心产品是一套面向公共安全和政府机构的云原生数据融合平台。公司主站是 peregrine.io，peregrine.tech
              会跳转到同一个产品界面。公司由 Nick Noone 和 Ben Rudolph 在 2017 或 2018 年创立——不同来源说法不一；创立前，团队在湾区 San Pablo Police Department
              与侦探并肩驻场 18 个月。
              这种一线打法塑造出的产品，不像传统企业软件，更像一层运营情报系统：执法人员在网页界面输入姓名、地址或案件编号，平台就能快速检索法院记录、逮捕报告、执法记录仪转写文本、车牌识别日志，以及机构接入的任何警务数据集。Forbes
              在 2024 年 8 月把结果形容为「本质上是警务数据的超级 Google」。


              商业模式是按机构授权的订阅式 SaaS。CEO Noone 曾公开表示，公司平均合同金额约为每年 $280,000，但区间很宽： 小型乡村部门约每年 $32,000，大型都市项目则包括 LAPD
              为「Project Blue Light」承诺的 $2.8 million。Orange County Sheriff's Office 也通过 Peregrine 签下 $900,000
              合同。这种分层结构让小部门也用得起平台，而它们过去负担不起传统实时犯罪中心基础设施；这正是 Peregrine 相对存量厂商的关键切入口。截至 2024 年 8 月，Peregrine
              已在美国警务和公共安全机构签下 57 份合同；到 2025 年 3 月 Series C 时，公司称覆盖 40 多个机构、超过 8000 万美国人。执法之外，Peregrine
              已扩展到应急管理、消防救援、刑事司法，甚至公园和图书馆，把数据集成层定位成通用政府情报产品，而不是只服务警务。
