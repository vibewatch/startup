  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价
        blocks:
          - type: paragraph
            body: >-
              Peregrine 向政府和公共安全机构销售按年订阅的 SaaS。合同不是按席位计费，而是全员访问：机构支付固定年度许可费后，全机构可无限使用平台，并获得约定的集成和培训包。已备案合同印证了这一机制。加州
              Lathrop 签署了五年协议，每年 $110,000，包含无限用户和所有标准集成。LAPD 的 Project Blue Light 合同约 42 个月（2023 年 10 月至 2027 年 5 月）总额为
              $2,793,750，对一个大型部门来说年化约 $796,000。San Mateo County 的 40 个月协议覆盖 18 个机构，总额最高 $3.4M（约每年
              $1.02M），进一步说明多机构安排会显著抬高 TCV。CEO Nick Noone 于 2024 年 8 月对 Forbes 表示，平均合同价值约为每年 $280,000，最小合同约每年
              $32,000，最大合同（Orange County Sheriff）为
              $900,000。定价随辖区规模而非用户数扩大；机构上线后，续约结构更可预测。公司未披露标价：所有合同都通过政府采购工具谈判（常见为合作采购协议或直接招标），这符合公共安全软件的惯例。根据已审阅的备案合同措辞，实施费和集成成本通常包含在合同内，而不是单独计费。
