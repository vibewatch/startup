      - number: '5.5'
        title: 信任、安全、隐私与合规
        blocks:
          - type: paragraph
            body: >-
              安全和隐私架构是 Peregrine 向政府销售时的核心卖点。平台运行在 AWS GovCloud，并于 2026 年 4 月获得 FedRAMP High
              授权——这一等级同样是处理最敏感非机密联邦数据的机构所需等级。平台符合 CJIS 要求（传输和静态加密、基于角色的访问控制、单点登录、完整审计日志，记录谁在何时为何访问了什么），并在临近健康场景中符合
              HIPAA。客户机构独占拥有并控制自己的数据；Peregrine 不收集、不拥有、也不使用客户数据训练模型，并在合同到期时提供安全删除的书面确认。四项 AI 原则约束功能部署：AI
              只用于有实际影响的场景；必须有人在环；客户选择 AI 功能是否以及何时启用；客户数据永不用于训练任何模型。公司称运营史上没有数据泄露。合同中包含「隐私和公民自由保护」条款。前 US Privacy and
              Civil Liberties Oversight Board 主席 Adam Klein 担任顾问。尽管有这些防护，EFF、ACLU Massachusetts、Brennan Center for
              Justice 和 Durham 社区团体等公民自由倡导者仍认为，把手机定位、车牌数据和警方记录聚合进一个可搜索平台，本质上会启用大规模监控和预测性警务，与政策限制无关。NC Durham 合同失败（2026 年
              2 月）和 VA Charlottesville 暂停使用（2025 年 6 月）证明，在政治参与度高的市镇，信任和隐私顾虑是真实商业拖累。
