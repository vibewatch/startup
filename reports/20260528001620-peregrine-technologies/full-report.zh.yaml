      - number: '1.5'
        title: 图表与要点
        blocks:
          - type: callout
            title: 深度创始人-市场匹配和驻场优先 GTM
            body: >-
              Nick Noone 的 Palantir 运营背景——尤其是负责 U.S. SOCOM 情报工作——以及在写第一行产品代码前与 San Pablo PD 驻场 18 个月，让 Peregrine
              拥有极难复制的领域可信度和客户信任。该打法产出可验证的案件结果（谋杀案定罪），并几乎完全靠执法圈口碑扩散。这种驻场、任务中心模型，是公司的核心竞争护城河，也是它在几乎没有传统营销的情况下拿下 57
              份合同的主要原因。
