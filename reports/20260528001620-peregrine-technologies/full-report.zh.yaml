      - number: '5.2'
        title: 模块地图与技术架构
        blocks:
          - type: paragraph
            body: >-
              Peregrine 平台由四个主要层构成。数据源层摄取来自 CAD（Motorola、CentralSquare、Mark43、Tyler、Hexagon）、RMS 平台、ALPR 网络、执法记录仪系统、Axon
              Evidence.com 数字证据库、Skydio
              无人机先响应者（DFR）数据流、监狱管理系统（JMS）和第三方传感器的结构化与非结构化数据。自研数据集成层借助机器学习身份解析和厂商中立适配器，对这些异构输入做标准化，不要求完整数据迁移。公司称该层几乎可支持任何结构化或非结构化来源。分析与
              AI 层运行记录去重、报告摘要、安全标记生成、OCR 和音频转录；2024 年推出的「Peregrine Vision」AI 视频分析套件据称可将证据审阅时间减少约
              80%。应急行动模块面向灾害响应场景（事件可视化、资源分配、跨机构消息），Resource Optimizer 工具（beta）则以约 92%
              准确率预测需求峰值。展示层提供统一操作员仪表盘，包含地理空间可视化、跨数据集搜索和协作工具。所有层都运行在 AWS GovCloud 上，使用 Amazon Redshift、RDS、EC2 和
              S3。架构支持多租户机构隔离，通过权限式数据隔离和微服务设计实现弹性扩展，无需为每个客户单独配置基础设施。
