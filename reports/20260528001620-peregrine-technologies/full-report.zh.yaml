  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：直接 RTCC 对手、硬件邻近方、平台存量厂商与公民自由阻力
        blocks:
          - type: paragraph
            body: >-
              Peregrine 的竞争横跨五类重叠市场，并不是简单的双寡头。最接近的直接对手是 Axon 2024 年收购的 Fusus RTCC 平台，以及 Flock
              Safety，二者现在都服务数千个机构。SoundThinking/ShotSpotter 等硬件绑定邻近方，从单一传感器监控网络延伸，并越来越多打包分析能力。存量平台厂商——Motorola Solutions
              的 CommandCentral、Tyler Technologies 的传统 CAD/RMS 栈，以及 Mark43 的云原生记录系统——掌握 Peregrine RTCC
              必须集成的调度和记录底座，因此在合同续约时有交叉销售杠杆。Palantir Gotham 和 NICE Investigate
              等联邦情报平台，定义了大型机构和情报界买家对数据融合能力的上限预期。现状替代品从孤立视频墙到值班指挥官手工流程不等。每一类都施加不同压力：直接对手在功能宽度和机构规模上挑战 Peregrine；存量厂商可以把
              RTCC 作为低价附加项打包；公民信任问题——已经在 Durham 合同取消和 Charlottesville 暂停中浮现——无论技术价值如何，都可能叫停采购。Contrary Research 基于部署数量估计
              Peregrine 已拿下约 30% RTCC 市场，该赛道预计以超过 18% CAGR 增长至 2030 年 $4.9B。专为 RTCC 打造的架构和 FedRAMP High
              授权，在联邦和情报界采购中仍是真正差异点，因为多数竞争者没有同等授权。
