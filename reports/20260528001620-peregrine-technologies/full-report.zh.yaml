          detail: ML 身份解析把分散系统中的记录连接起来；生成自研规范化数据源
        - id: govcloud-store
          label: AWS GovCloud 安全存储
          detail: FedRAMP High、CJIS/HIPAA 加密存储；RBAC 控制机构数据隔离
        - id: ai-analytics
          label: AI 分析引擎
          detail: 去重、报告摘要、安全标记、Peregrine Vision 视频分析
        - id: dashboard
          label: 统一操作员仪表盘
          detail: 单一视图：跨数据集搜索、地理空间视图、警报、协作工具
        - id: investigator
          label: 调查员 / 分析师
          detail: 数秒内跨所有数据集查询；审计日志记录每次访问以满足合规
        - id: outcome
          label: 公共安全结果
          detail: 案件更快结案（Albuquerque 未结凶杀案减少 40%）；改善拨款报告；FEMA 报销；协同响应优化
