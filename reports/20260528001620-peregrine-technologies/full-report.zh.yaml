      - number: '3.4'
        title: 切换成本、集成锁定与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              Peregrine 最可防守的位置，是其 200+ 数据源集成库的复杂度：把这些连接迁到竞争对手，需要重建 API token、数据标准化逻辑和机构专属告警规则，通常意味着数月配置工作。FedRAMP High
              授权为联邦和情报界买家增加第二道结构性壁垒，因为竞争者必须独立获得同一认证，才能进入这些采购。但这些护城河有条件。Axon Fusus
              靠执法记录仪装机基础和硬件生态，而不是软件优先集成，接近同样的集成深度，也给机构另一条同样粘性的整合路径。Motorola 和 Tyler 都控制 Peregrine 读取的上游 CAD
              和调度系统，任何一方都可以在合同续约时嵌入轻量分析层，Peregrine 无法阻止集成。Contrary Research 提到的 30% RTCC 估计市场份额说明先发优势存在，但在 GovTech
              中，一旦资金充足的竞争者达到类似机构数量，先发优势会很快被侵蚀。Flock Safety 约五年从零跑到 $300M ARR，说明相邻赛道的新进入者积累机构关系可以多快；Flock 的摄像头足迹已经进入许多
              Peregrine 服务的同一批机构。Orange County 的 AWS 部署说明 Peregrine 能提供云原生集成深度，但也说明底层基础设施可被任何投入同等 API 的云原生竞争者复制。
