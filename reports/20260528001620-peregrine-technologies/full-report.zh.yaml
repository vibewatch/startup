          - type: paragraph
            body: >-
              Peregrine 未披露净收入留存、总留存或流失数据，投资者对持久性的可见度只能依赖少数期限已知的具名合同。现有数据点在结构上偏正面：LAPD 签署四年交易，Richmond 将五年合同维持至 2026
              年，San Mateo 承诺 40 个月期限。没有生产客户公开宣布中途取消合同；Durham 是部署前被否，Charlottesville 是暂停而非终止。不过，缺少队列数据、NRR
              披露或续约率统计，是重大尽调缺口。Richmond CA PD 的 2021 年合同使其成为最早生产客户之一，也提供了多年连续性的一个数据点。在平均合同价值
              $280,000、且期限为多年的情况下，即便温和流失也会显著影响收入。公开满意度证据只有 AWS 为 OC Sheriff 托管的案例研究和一份 eRepublic 白皮书；没有 Peregrine 的独立 G2
              或 Gartner Peer Insights 评分。Charlottesville 在采用后暂停使用，说明政治风险即使在部署后也可能落地，形成一个不同于产品表现的新留存风险类别。
