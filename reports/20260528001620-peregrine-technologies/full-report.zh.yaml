        - Q1 2026 收入 $24.2M，同比 -15%；ARR $95.4M；FY2026 指引 $109-111M
        - 有枪声检测需求的城市机构
        - 枪声检测传感器网络；PlateRanger LPR 扩张推进中
        - 合同取消导致 ARR 收缩；单传感器依赖暴露；政治脆弱性
