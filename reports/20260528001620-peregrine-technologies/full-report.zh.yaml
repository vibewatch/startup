          - type: callout
            title: 公民自由和合同被拒风险真实且在上升
            body: >-
              Durham NC 议会否决合同，以及 EFF 将 Peregrine 模式定性为「本质上很难保护隐私」，是品类级逆风的领先信号。Noone 自己公开谈到团队构成后，Palantir DNA
              质疑被进一步放大，反对者更容易把 Peregrine 描绘成军事监控下沉到地方警务。越来越多市议会审查采购时，每一次公开拒绝都会制造声誉降温效应。Peregrine 的公民自由顾问（Adam
              Klein）和合同隐私条款是可信缓释，但不是完整护盾。
