  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层
        blocks:
          - type: paragraph
            body: >-
              Peregrine Technologies 的客户群集中在美国执法机构，主要是市警察局和县警长办公室。公司称可服务市场覆盖约 18,000 个州、地方和部落执法机构，其中商业活跃度最高的是能支持每年
              $180,000 或更高订阅额的中大型部门。公司已披露或据报道拥有覆盖 California（LAPD、OC Sheriff、Richmond PD、San Mateo 多机构、Lathrop
              PD）、Texas（Dallas PD）和 Florida（Sarasota County Sheriff）的合同；California 集中度既反映创始地域，也反映部分县的政治环境更易接受。截至 2025 年
              3 月，公司声称通过 40 多个机构覆盖 80 million 名美国人，但该指标混合了合同数和人口数据，并非付费客户枚举。执法之外，Peregrine
              已开始向消防部门、应急管理机构、公园和图书馆营销，但公开资料尚未点名任何执法以外的生产部署。主导买方画像是警察局长或警长，配合市议会或县委员会完成预算审批，资金通常来自一般基金拨款或联邦补助。合同规模从小型农村部门每年约
              $32,000，到大型都市警力 $2.8 million 不等；CEO Noone 的公开说法显示平均约每年 $280,000。
