      - number: '3.5'
        title: 反向证据：公民信任失败与公共安全监控的政治经济学
        blocks:
          - type: paragraph
            body: >-
              Peregrine 的竞争风险不只是技术或财务风险，公民信任已经让真实合同终止或暂停。2026 年 2 月， Durham City Council 在社区组织和关于监控越界的公开证词后，投票取消
              $517,000 Peregrine 合同；Charlottesville 也在类似担忧出现后暂停使用该平台。上述两例不是孤立事件。Campaign Zero
              和其他公民自由研究者发布材料，认为实时监控平台会放大歧视性警务模式，并且这些报告已经直接成为市议会辩论材料。SoundThinking 收入下滑说明政治脆弱性并非假设：十几个城市的协同行动，可以在一个财年内让
              ARR 双位数收缩。Peregrine 的回应——FedRAMP High、正式数据治理政策、面向城市的社区沟通——比上一代监控工具更成熟，但能否顶住持续的多城市反对运动，还没有被验证。反向证据同样影响
              Flock Safety 和 Palantir，二者也面对有组织反对，说明风险是整个赛道共有，而非 Peregrine 独有。尽调应梳理所有已知活跃反对运动，并评估 Peregrine 现有 225+
              城市基础中的合同终止条款敞口。
