        - RTCC 平台（城市 / 机构许可）
        - 按合同定价的市政方案；未公开按席位或按机构的价目表；Durham 合同价值为 $517K，覆盖一座中型城市
        - 200+ 路数据源集成、实时告警、获 FedRAMP 授权的云
        - 企业定制定价；多年合同条款未公开
        - Durham $517K 是唯一具体的公开 Peregrine 定价锚；不足以外推
      - - Axon / Fusus
        - Axon 生态中的 Fusus RTCC 附加模块
        - 打包或单独模块定价嵌在 Axon 合同内；所审阅公开材料未披露 Fusus 模块准确价格
        - 摄像头汇聚、无人机集成、调度界面、社区摄像头接入
        - Axon 硬件生态带来打包杠杆；Fusus 独立价格未公开
        - 打包风险：拥有 Axon 摄像头的机构可能以近零增量成本获得 RTCC
      - - Flock Safety
        - LPR 硬件 + 分析平台
        - 硬件 + 订阅模式；按摄像头或按地点签约；完整平台定价未公开
        - 固定摄像头、LPR 数据、社区警报、分析仪表盘
        - 硬件补贴或租赁可能压低总拥有成本中的表观软件成本
        - 摄像头 + 分析打包后，按机构看的表观成本可能低于纯软件 RTCC
      - - Motorola Solutions
        - CommandCentral 平台套件
        - 企业软件定价嵌在既有无线电和调度合同中；分析模块采用定制定价
        - CAD / 调度集成、视频分析、无线电互操作
        - 常随续约合同一起纳入，不单独触发竞争性采购
        - 续约打包意味着 Peregrine 可能没进入竞争性投标就丢掉心智份额
