      - number: '7.4'
        title: 财务、资本与模式风险
        blocks:
          - type: paragraph
            body: >
              Peregrine 于 2025 年 3 月完成由 Sequoia Capital 领投的 $190 million Series C，估值 $2.5 billion，累计融资超过 $252
              million。公司承诺将资金用于激进招聘软件工程师和实施人员、产品开发与市场扩张。公开资料没有烧钱速度数字，但在 $10–30 million 收入基础上，于 18–24 个月内部署 $190 million
              融资，意味着公司处于高现金消耗阶段。估值隐含当前收入运行率约 80–250 倍的收入倍数，需要多年三位数增长来支撑；即便温和采购逆风，也会冲击这一门槛。

              政府合同收入不均匀，并受年度预算周期、持续决议以及长达 6–18 个月的采购时间线影响。地方政府 IT 预算暴露于经济下行、州资金削减和政治优先级变化。联邦资金项目——例如补贴 RTCC 部署的
              Florida's State Board of Immigration Enforcement 拨款和 Homeland Security
              技术拨款——可能因政府更迭或立法优先级改变而被重定向或中止，从而切断一个有意义的获客渠道。如果公民自由反对在多个辖区同时强化，赢单率下滑的速度可能超过团队靠进入新市场弥补的速度。

              财务模型依赖年度 SaaS 式合同续约，而 Peregrine 在该领域面对 Axon 不断扩展的 AI 和证据管理平台、Motorola Solutions 通过收购扩张的产品线，以及 Flock Safety
              的快速扩张。现有巨头资产负债表更厚、硬件关系既有、政府销售团队成熟，可以用低价压制 Peregrine，或把同等功能打包进既有合同。随着竞争格局整合，利润率压缩是重大风险。
            claimRefs:
              - CR026
              - CR027
              - CR028
              - CR029
              - CR030
      - number: '7.5'
        title: 人员、关键人物与执行风险
        blocks:
          - type: paragraph
            body: >
              CEO Nick Noone 是 Peregrine 的门面，也是公司与执法机构关系的设计者。他的 Palantir 背景塑造了公司的技术哲学、政府销售打法和公民自由可信度策略——他曾表示 Palantir 的
              DNA 在「Peregrine 里很强」，且团队约四分之一是 Palantir 校友。他的个人可信度是机构会议室里的卖点，但在公开听证中也同时是被引用最多的负担。Noone
              离职或声誉受损，会同时拿走公司最核心的销售资产和使命资产。

              联合创始人 Ben Rudolph 的角色和继任计划没有公开文档。Peregrine 引入前 Privacy and Civil Liberties Oversight Board（PCLOB）主席 Adam
              Klein 担任顾问，设计其公民自由架构，这缓释了一部分治理风险；但顾问角色不等同于董事会层面的问责，也不等同于常设 CISO 或隐私官职能。Series C
              后公司快速招聘带来整合风险：一边吸纳大批工程师和实施人员，一边维持符合 CJIS 的安全实践和一致数据治理，运营要求很高。

              公司计划从执法扩展到医疗、物流和金融服务，执行风险因此上升；这些垂直领域需要不同的监管知识、销售周期和产品适配。平台路线图同时铺向多个监管体系，还要与各垂直领域的专用玩家竞争，这是后期创业公司失焦的常见原因。
