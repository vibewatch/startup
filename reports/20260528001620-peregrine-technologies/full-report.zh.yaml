            title: 61 倍 ARR 估值不给执行或声誉失误留空间
            body: >-
              以 $2.5B 估值对应 $40.9M ARR，Peregrine 的交易倍数约为 ARR 的 61 倍，可比早期 Palantir 或峰值时期的高增长
              SaaS。只要一年增速放缓、一组合同被否，或隐私诉讼出现重大负面事件，倍数都可能大幅压缩。2026 年 2 月 Durham 否决合同以及 Florida
              移民资金争议，是商业模式中真实监管风险和社区反对风险的早期信号。
