      - number: '7.6'
        title: 缓释措施、监测指标与打破投资逻辑的触发点
        blocks:
          - type: paragraph
            body: >
              Peregrine 的核心风险缓释架构先把公民自由放在首位：强制留存审计日志、不做面部识别、数据访问必须以案件编号为依据，并把隐私义务写进合同。Adam Klein 在 PCLOB
              的经历影响了隐私治理设计；公司也在推进 FedRAMP 授权——这对联邦和州级机构采购是安全成熟度信号。客户上线流程包含 24/7 监控和第三方审计；Peregrine 也公开承诺，所有执法部署都遵守 CJIS。

              但这些缓释手段仍没有拆掉几类击穿投资逻辑的场景。一旦出现高关注度公民自由诉讼、发现机构数据被用于政治敏感目的（例如在庇护城市开展移民执法，或监控抗议活动），或重大刑事审判中 RTCC
              来源证据被第四修正案挑战打穿，就可能在客户群里引发连锁合同审查和采购暂停。任一季度内，投资逻辑被击穿的概率不高；但放到多年持有期，风险会累积。

              投资人应跟踪：(1) 每季度市议会层面拒绝合同的数量和地域；(2) 在隐私或民权案件中将 Peregrine 或 Peregrine 客户列为被告的任何诉讼；(3) CJIS 审计发现中，因平台导致
              Peregrine 客户不合规的事项；(4) 涉及客户执法数据的任何安全事件；以及 (5) Nick Noone 或 Adam Klein 离职。若多个监测信号同时亮起，投资理由会明显变弱。
