        - RMS、CAD、分析、集成 API
        - Series G 融资表明其可能采用增长优先定价，而非优化利润率
        - CAD/RMS 存量位置为未来追加 RTCC 功能提供自然增购界面
      - - SoundThinking
        - ShotSpotter + PlateRanger
        - ShotSpotter 按平方英里或城市区域定价；所审阅材料未披露 PlateRanger 定价
        - 枪声检测声学传感器、LPR 分析
        - 合同取消压低定价；PlateRanger 无公开价目表
        - ARR 下滑说明价格和量同时承压
      - - Palantir Gotham
        - 联邦情报平台
        - 通过联邦合同工具定价（IDIQ、GSA Schedule）；不是标价产品；典型部署成本达数千万美元
