            title: 真实合同基础支撑收入连续三年翻三倍
            body: >-
              备案政府合同印证了 Peregrine 在 2022 至 2024 年收入 3 倍复合增长，这在 GovTech 有记录的增长轨迹中属于最强一档。不同于部分依赖拨款试点的 GovTech 同行，Peregrine
              的备案合同是多年承诺订阅，ACV 具备商业意义。
