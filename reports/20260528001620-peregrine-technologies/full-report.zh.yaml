      - number: '5.3'
        title: 部署、集成、可靠性与路线图
        blocks:
          - type: paragraph
            body: >-
              Peregrine 以全托管 SaaS 服务部署；机构通过网页浏览器访问平台，本地侧除向 GovCloud
              传送数据的网络连接外，不需要本地基础设施。每个客户都会嵌入一名专职部署工程师，集成配置不需要新代码，也不需要大型迁移团队。San Mateo County 合同（2026 年 1 月，$3.4M，40
              个月期限）展示了标准范围：为 17 个参与机构集成 CAD、RMS、Axon Evidence.com、JMS 和 Skydio DFR。Los Angeles Police Department 在 2024
              年为 Project Blue Light（有组织零售犯罪）签署 $2.8M 交易，证明平台可兼容大型机构部署。AWS GovCloud
              提供底层正常运行时间保障；公司没有公开状态页，但也没有公开报道的宕机。2026 年产品路线图包括扩展应急行动模块、向 NGO 和关键基础设施运营商授权数据即服务（Data-as-a-Service）（目标是在
              24 个月内实现非警务板块 ARR 增长 300%）、进入 UK 和 Australia 国际市场（Five Eyes 市场，公司称合计可服务机会超过 $5B），以及与 Deloitte 和 Accenture
              建立战略合作，将政府销售周期缩短约 25%。一份 $700M 的 DOJ Ceiling ID/IQ 合同（2024
              年）提供了联邦采购工具。路线图节奏以猛禽名称包装（Falcon、Griffon、Osprey、Harrier、Kestrel），并与主要 AI 和互操作性功能发布对齐。
