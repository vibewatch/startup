            title: Durham 拒绝合同——采购传染风险真实存在
            body: >
              Durham, NC 在 February 2026 一致投票阻止
              Peregrine，说明即便警察局长、市长和市府工作人员都支持合同，组织有序、聚焦隐私的倡导活动也能让采购脱轨。否决发生在多场公开听证会之后，居民提到 Palantir
              关联、预测性警务偏见，以及开放式数据使用担忧。Peregrine 的 Palantir 血统在政治进步派辖区是结构性负担，而它的大部分可服务市场正是这些辖区里的大型市政警局。
