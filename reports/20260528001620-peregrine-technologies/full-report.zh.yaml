      - number: '8.2'
        title: 估值背景——March 2025 Series C 与入场纪律
        blocks:
          - type: paragraph
            body: >
              Peregrine 在 March 2025 完成 $190M Series C，由 Sequoia Capital 领投，投后估值 $2.5B。参投方包括 Goldcrest Capital、Friends &
              Family Capital、Fifth Down Capital、OG Venture Partners 和 Godfrey Capital。公司自创立以来披露的累计融资约为 $253M，意味着 Series
              C 前早期轮次合计约 $63M。CEO Nick Noone 称，资金将用于加速招聘软件工程师和实施人员，并拓展政府与商业部门。

              在 $40.9M ARR 和 $2.5B 估值下，隐含 ARR 倍数约为 61x。作为参照，同期领先的上市 govtech SaaS 供应商 Tyler Technologies 约以 10.7x 过去 12
              个月市销率交易（April 2025：市值 $23.2B，对应 2024 年收入约 $2.14B）。最接近的高增长公共安全 SaaS 上市可比公司 Axon Enterprise 约以 15-16x
              收入交易（early 2025），ARR 基数 $1.3B，年增长约 40%。Peregrine 相比两者的溢价，反映的是风险投资阶段的可选性定价：投资人在为继续 3x
              复合增长的概率付费，而不是为当年经济性付费。

              入场纪律要求明确承认：这个隐含倍数已经把 ARR 达到 $300-500M 前的约三年额外 >3x 增长计入价格；到了这一规模，10-15x 退出倍数才可能让 $2.5B 投后估值产生 2-3x
              回报。若没有持续超高速增长、单位经济改善和政府采购管线多元化证据，却以当前或更高估值入场，将承担很高的估值下调风险。累计融资 $253M 带来的优先股堆叠压力，意味着下行情景下普通股之上有明显优先权。
