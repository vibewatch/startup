  - id: TV005
    title: 投资逻辑破裂与止损触发因素
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 收入增长降速
        - 连续两个报告期年度 ARR 增长低于 1.5x（年化 50%）
        - 61x ARR 的增长溢价理由不再成立；指向基准 / 悲观估值情景；轨迹可比 Dataminr
        - 转为 SELL 或 EXIT；不再加仓；标记股权结构表复核
      - - 政府预算冻结或采购暂停
        - 联邦或州政府宣布 IT 支出冻结，且覆盖公共安全软件；机构未续约额超过 ARR 的 10%
        - 直接威胁经常性收入基础；降低管线可见度；压缩退出倍数
        - 下调投资逻辑；密切跟踪季度签约额；评估合同承诺结构
      - - 公民自由监管行动
        - 2 个以上主要州的州或联邦立法限制预测性警务、数据融合或跨机构共享工具，且限制对象与 Peregrine 核心产品相符
        - 直接压缩可服务市场；可能要求产品重构；抬高合规成本
        - 升级为阻断性尽调问题；要求法律意见和产品路线图回应
      - - 新一轮估值明显低于 $2.5B
        - Series D 或过桥轮投后定价低于 $2.0B
        - 确认市场共识认为 March 2025 估值是周期高点；为二级退出树立负面先例
        - 重新评估所有持仓；视为降估轮信号
      - - NRR 确认低于 100%
        - 独立数据或审计财务显示连续 2 期净留存率（NRR）低于 100%
        - 收入基础被侵蚀，复合增长逻辑失效；无论新客户速度如何，结构性增长受限
        - 阻止从 TRACK 上调；标记为基本面负面信号
    notes: 触发阈值为指示性，应与公司管理层确认；依据结构性尽调逻辑，不构成法律约束条款。
    claimRefs:
