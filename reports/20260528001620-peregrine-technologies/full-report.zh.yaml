              $2.5 billion Series C 估值建立在收入翻三倍说法，以及不到一年较 Series B 基准上调 7× 之上；但 ARR、毛利率、净留存率和合同流失率都没有得到公司确认。第三方估计（$40.9M
              ARR）折合约 61× ARR 倍数——在高增长企业 SaaS 市场可以辩护，但一旦减速就很敏感。投资人和尽调团队在锚定独角兽估值前，应要求审计财务、客户留存数据和完整合同单元经济。
