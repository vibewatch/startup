        - 300+ 家机构；2025 年 10 月 Series G；累计融资约 $219-269M
        - 聚焦现代化、替换遗留 CAD/RMS 系统的机构
        - 云原生架构；现代 UX；与 Peregrine 争夺同一笔数字化转型预算
        - 尚无专门 RTCC 产品；规模小于 Motorola/Tyler
      - - Palantir Gotham
        - 联邦 / 大型机构情报平台
        - FY2025 收入 >$2.8B；ATO 记录；联邦合同工具
