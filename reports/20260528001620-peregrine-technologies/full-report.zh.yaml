      - number: '5.4'
        title: 差异化、AI / 数据护城河与知识产权
        blocks:
          - type: paragraph
            body: >-
              Peregrine 的竞争差异化靠四根支柱。第一，自研数据集成层：团队在执法机构内共驻 18+ 个月打造该层，可标准化来自任何系统的输入，不需要定制数据管道；相比 Palantir
              等企业级竞争对手，部署成本和时间大幅下降。第二，监管护城河：FedRAMP High 授权（2026 年 4
              月）是联邦云安全最高等级，服务处理最敏感非机密数据的机构必须具备；拿到该资质耗费多年投入，形成硬合规进入壁垒。第三，深度客户集成带来的网络效应：机构接入 JMS、DFR
              数据流和数字证据库，切换成本上升，也扩大了跨机构协作可用的数据面。第四，在保护隐私的架构中应用 AI：Peregrine Vision 缩短证据审阅时间，安全标记加速调查，Resource Optimizer
              支持前置排班——且都不使用客户数据训练模型。公司声称拥有多项数据融合和地理空间可视化专利，但公开文件尚未独立验证。公司明确禁止面部识别，这一刻意定位使其区别于更激进的监控供应商，也帮助公司穿越政治敏感的采购场景；不过，安全标记工具依赖历史逮捕数据，仍在公民自由倡导者中引发争议。
