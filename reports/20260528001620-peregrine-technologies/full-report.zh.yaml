        - 对依赖运营预算的中型执法机构而言超出市场范围；与顶级联邦买家相关
    notes: 定价单元格只反映所审阅来源中的公开信息。空值或不透明单元格有意采用定性描述，而不是估算。 Durham $517K 合同价值（SP008）是目前可获得的最具体公开 Peregrine 定价锚，代表低端单城市数据点。
