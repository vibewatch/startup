      - number: '2.5'
        title: 规模测算缺口、相互矛盾的估计与未决问题
        blocks:
          - type: paragraph
            body: >
              多个重大尽调缺口限制了 Peregrine 具体赛道的市场规模精度。第一，没有分析师报告清晰拆出美国州和地方执法 SaaS 分析市场；更广义执法软件市场还包括 CAD、RMS、证据管理和执法记录仪软件。预测性警务
              $2–5B 口径是全球总量，市场边界定义各不相同；要套用美国占比，需要尚未被外部验证的假设。

              第二，即便名义上市场定义相近，分析师估计也相差 2–3x。Fact.MR 的 $13.6B、Precedence Research 隐含的 $18–19B，以及 Technavio 的 $9.4B
              增量增长口径，彼此不能直接比较——它们覆盖不同地理区域、产品类别和基准年份。估值校准时，应保留这种分散，而不是简单平均。

              第三，截至 2026 年 5 月，Peregrine 主要 GTM 渠道 RTCC 市场没有任何主流分析机构给出独立规模估计。NRTCCA 的 300
              个机构估计和会议增长数据能说明需求信号，但不能说明收入规模。要做详细自下而上估算（机构 × 平均合同金额 × 续约率），需要一手研究。

              第四，联邦预算不确定性的影响没有任何已审阅公开来源量化，尤其是当前 FY2026 预算讨论下 Byrne JAG 和 COPS 补助可能削减。这些补助是重要需求加速器；若大幅缩减，近期 SAM 会被压缩。

              最后，Peregrine 自身收入和 ARR 没有公开披露。公司称收入连续三年翻三倍，这很有吸引力，但未经验证。缺少披露财务后，SOM 和市场份额估计只能是粗略近似。上述缺口已在证据缺口部分标注。
            claimRefs:
              - CM025
              - CM042
              - CM027
              - CM005
      - number: '2.6'
        title: 图表与要点
        blocks:
          - type: callout
            title: RTCC 采用进入拐点 — 但渗透率低于 2%
            body: >
              National Real Time Crime Center Association 会员热度上升——参会人数从 2022 年的 200 人到 2025 年的 1,000 人——说明 RTCC
              部署已越过早期采用门槛，进入早期大众阶段。但在约 18,000 个美国执法机构中，只有约 300 个拥有运行中的 RTCC，占全部机构不到 2%，占约 2,500 个可行目标约 12%。Peregrine
              仍有大量空白可打，但要打进更广市场，仍需跨过采购周期、公民自由反对和小型市政预算约束。
            calloutType: insight
            claimRefs:
              - CM016
              - CM017
              - CM003
          - type: callout
            title: 公民自由反对是反复出现的交易风险，不是孤立事件
            body: >
              North Carolina Durham 市议会投票反对 Peregrine 合同，Charlottesville 暂停使用该软件，都不是离群点；它们反映出社区对预测性警务和 AI
              监控平台的反对已经形成可记录模式。Brennan Center 和 ACLU 发布研究，把 AI
              驱动公共安全分析框定为公民自由风险。这种反对具有不对称性：一次声音足够大的社区会议就可能推翻合同，不论技术价值如何；民选机构审批要求也让公共压力拥有正式否决点。Peregrine
              的社区沟通策略，以及争议交易中最终流失的比例，是关键尽调问题。
            calloutType: risk
            claimRefs:
              - CM006
              - CM008
              - CM029
              - CM030
          - type: callout
            title: FedRAMP High 认证为联邦市场建立结构性进入壁垒
            body: >
              Peregrine 的 FedRAMP High 授权是联邦市场的重要竞争护城河。多数执法分析平台尚未获得 FedRAMP High，因此无法承接处理 Controlled Unclassified
              Information（CUI）和 Law Enforcement Sensitive（LES）数据的机构合同。联邦合同（FBI、DHS、DEA）平均合同金额更大、期限更长、流失风险低于市政交易；若
              Peregrine 能赢下首批 RFP，联邦将是价值最高的扩张路径。
            calloutType: strength
            claimRefs:
              - CM009
              - CM040
          - type: callout
            title: SAM 估计受未披露收入数据限制
            body: >
              美国公共安全分析平台 $1–3B SAM 估计，是从 GovTech/Gartner 的 $15B 司法 IT 包络出发，并假设分析支出占 10–25% 自下而上构建。Peregrine 未披露 ARR
              或收入，公开资料无法验证 SOM。SAM 估计应视为量级指引；若能一手研究 Peregrine 管线和可比厂商披露（Tyler Technologies、Axon 分析 ARR），该数字会更清晰。
            calloutType: assumption
