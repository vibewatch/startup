            body: >-
              Axon Enterprise 是最重要的直接威胁。其 2026 年 Q1 结果显示，净收入 $807M，同比增长 34%，ARR 达到 $1.5 billion；Fusus 软件板块收入同比增长
              95%。Fusus 平台把社区摄像头、枪声检测、无人机数据流和 CAD 调度聚合进统一态势感知界面——与 Peregrine 的 RTCC 做同一件事——但 Axon 还拥有执法记录仪和 Taser
              装机基础，可强力推动采用。$14.3 billion 合同预订额说明采购管线稳固，Axon 能在不重新竞争招标的情况下，把 Fusus 交叉销售进既有账户。Flock Safety 的威胁不同但互补：2026 年
              4 月 $8.4 billion 估值、$300 million ARR 且同比增长 70%，背后是以自动车牌识别和固定摄像头网络为锚的模式，已有 4,800+ 个机构使用。Peregrine
              需要在既有硬件旁边被选中；Flock 的摄像头往往是第一步，随后把分析采购拉向 Flock 自己的平台。SoundThinking/ShotSpotter 展示下行情景：2026 年 Q1 收入同比下降 15%
              至 $24.2 million，多个大城市在社区压力下终止枪声检测合同；全年指引 $109–111 million，意味着收缩仍在继续。SoundThinking 的 ARR 为 $95.4
              million，并转向 PlateRanger LPR 分析产品，说明公司正试图摆脱对单一传感器的依赖；但这条轨迹也直接警示任何 RTCC
              厂商：如果价值主张依赖单一数据类型，或依赖要面对有组织公民自由反对的市议会，风险会快速显性化。
