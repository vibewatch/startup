    title: 估值区间 — 低 / 基准 / 高结果 vs. $2.5B 入场
    type: range
    layout: wide
    summary: |
      以 2025 年 3 月 $2.5B Series C 入场估值为锚，给出 FY2027E 隐含估值在悲观、基准和乐观情景下的时点区间。
    data:
      items:
        - label: 悲观情景（$B）
          low: 0.3
          mid: 0.45
          high: 0.5
        - label: 基准情景（$B）
          low: 1.1
          mid: 1.2
          high: 1.3
        - label: 乐观情景（$B）
          low: 4.4
          mid: 5
          high: 5.6
        - label: Series C 入场（$2.5B）
          low: 2.5
          mid: 2.5
          high: 2.5
    approximationNotes: 区间来自 TV003 中的情景增长假设。低 / 高端反映退出倍数敏感性。按当前证据权重，悲观 / 基准结果合计构成概率更高的结果。
    claimRefs:
      - CV029
      - CV030
      - CV031
      - CV032
      - CV033
      - CV034
  - id: FV004
    title: 投资 KPI — IC 就绪评分
    type: kpi
    layout: wide
    summary: |
      Peregrine Technologies 在七个投资维度上的 IC 就绪评分：市场、增长证据、竞争护城河、单位经济、风险、估值和证据质量。评分 1-5（1=很弱，5=很强）。
    data:
      items:
        - label: 市场机会
          value: 4
          note: $20B+ 市场；10% CAGR；云原生替代浪潮；政府数字化转型顺风
        - label: 增长证据
          value: 3
          note: 公司声称 ARR 连续 3 年增长 3x；独立估计（$40.9M ARR）一致；未经审计
        - label: 竞争护城河
          value: 3
          note: 数据集成带来切换成本；统一平台先发；但 Axon Fusus 和 Mark43 直接竞争
        - label: 单位经济
          value: 1
          note: 无公开毛利率、CAC、NRR 或回本周期数据；累计融资 $253M，盈利路径仍未确认
        - label: 风险画像
          value: 2
          note: 依赖政府预算；公民自由反弹；Dataminr 先例；高额优先股悬顶
        - label: 入场价格吸引力
          value: 1
          note: Series C 时 61x ARR，明显高于可比公司（Flock 25x、Axon 11-15x、Tyler 5-11x）；基准情景意味着亏损
        - label: 证据质量
          value: 2
          note: 所有财务数据均为公司声称或第三方估计；没有可用的审计账目或独立 NRR 数据
    claimRefs:
      - CV001
      - CV003
      - CV006
      - CV011
      - CV015
      - CV019
      - CV022
      - CV037
      - CV040
