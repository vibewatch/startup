      - number: '8.3'
        title: 可比分析——上市公司、私募轮次与 M&A
        blocks:
          - type: paragraph
            body: >
              主要上市可比公司是 Axon Enterprise (AXON) 和 Tyler Technologies (TYL)，也是最相关的 govtech / 公共安全 SaaS 上市锚点。截至 May
              2026，Axon 约以 11x 过去 12 个月收入交易，2025 年收入 $2.8B（YoY 增长 33%），ARR 为 $1.35B；公司市值已从 ~$62B（mid-2025）回落到
              ~$31.5B，较峰值压缩约 50%，说明即便品类龙头也有倍数压缩风险。Tyler Technologies 以 5.2x EV/Revenue 交易，2025 年收入 $2.33B（增长 9%），企业价值
              $13B。Axon 的 10-K（FY 2025）列出超过 50 家执法软件供应商，包括 Mark43、CentralSquare、Motorola Solutions 和
              Tyler，它们在记录管理和实时运营上都是直接竞争对手，正是 Peregrine 参与竞争的类别。

              私募轮次可比中，Flock Safety（LPR 摄像头 + 调查情报）在 March 2025 以 $7.5B 估值融资 $275M，与 Peregrine 的 Series C 同期；当时 Flock ARR
              为 $300M（YoY 增长约 70%），隐含 25x ARR。Flock 在 April 2026 后续估值达到 $8.4B，显示机构对高增长公共安全软件的胃口仍在，但也引发了全国性公民自由抗议。直接
              RMS/CAD 平台竞争对手 Mark43 据 PitchBook 称在 October 2025 完成 Series G；融资细节未完全公开。最有警示意义的反向可比是 Dataminr：它在 March
              2021 以 $4.1B 估值融资 $475M，但截至 September 2025，私人二级市场估值约为 $832M，跌幅 80%，背后是倍数压缩、裁员，以及用债务式融资替代新股融资。

              MarketsandMarkets 的执法软件市场报告（2025 版）将 IBM、Motorola Solutions、Oracle 和 Palantir 列为主要市场参与者，与 Axon 和 Tyler
              并列，确认 Peregrine 所在赛道既有资源充足的既有厂商，也有新兴 AI 原生进入者。Grand View Research 的市场规模估算显示，美国执法软件板块的 LTM 增长率与更广的
              $20.25B→$32.96B 轨迹一致，并利好 SaaS 云原生龙头。
