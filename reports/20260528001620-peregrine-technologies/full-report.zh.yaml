        - 反向逻辑（悲观）
        - 第三方二级市场数据来自 Premier Alternatives（Sept 2025）；Dataminr 也聚焦公共安全 AI
        - Peregrine 维持增长并跑出盈利路径，可部分抵消这一风险
      - - 政府采购节奏慢、政治化且受预算约束
        - 反向逻辑（悲观）
        - 美国政府 SaaS 的结构性特征；Axon 10-K 将预算周期列为关键风险因素
        - 向商业部门或国际市场分散，可降低依赖
      - - 公民自由与监控反弹正在升级（Flock Safety 抗议、Dataminr 争议）
        - 反向逻辑（悲观）
        - TechCrunch 报道 April 2026 的 Flock Safety 抗议；Dataminr 涉 BLM / 抗议监控指控（TechCrunch 2025）
        - 差异化隐私架构或监管安全港可降低风险
    notes: 投资逻辑与反向逻辑按证据质量打标签。公司自称的论点需要独立核验，之后才可将建议上调到 TRACK 以上。
