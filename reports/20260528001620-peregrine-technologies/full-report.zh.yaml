      - number: '4.5'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              Peregrine Technologies 的财务图景显示需求和收入动能方向向好，但单位经济仍不足以承销。积极面是，Peregrine 已经具备真实商业规模：备案合同确认了真实且增长中的 ARR
              基础，收入至少连续三年以三位数增长，由 Sequoia 领投、估值 $2.5B 的 Series C 说明机构投资者认可这一品类逻辑。FedRAMP High
              授权让公司具备进入联邦机构采购的资格，可能打开一个大型扩张方向。需要谨慎的是，$2.5B 估值约为 2025 年 9 月 ARR 的 61 倍，倍数极端，几乎不给执行失误留空间。NC Durham
              在持续社区反对和公民自由审查后，于 2026 年 2 月否决合同，凸显了真实的交易流风险，而该风险尚未反映在表面指标中。WUSF 的调查报道称，至少部分 Florida
              机构未获地方议会批准，就通过州移民执法资金采购
              Peregrine，这意味着采购渠道风险可能带来负面报道和未来合同取消。毛利率、NRR、CAC、烧钱速度或客户数均未公开，仅凭公开来源无法判断收入质量、利润率路径和资本强度。建议将当前财务证据视为支撑强需求叙事，但同时存在显著执行和声誉拖累；任何投资结论都应以管理层披露毛利率、净收入留存率、烧钱速度、客户集中度以及未来任何债务或信贷额度条款为前提。
