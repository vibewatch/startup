  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >
              Peregrine Technologies 所处赛道是公共安全数据分析和情报平台——更广义执法软件市场中的一个明确子集。纳入范围的支出包括数据集成中间件、AI
              驱动犯罪分析、实时运营仪表盘、跨机构情报共享平台，以及卖给或部署给市警察局、县治安官、州执法机构和应急管理机构的决策支持软件。Peregrine
              并不实质竞争的相邻支出，需要排除在外：计算机辅助调度（CAD）系统、记录管理系统（RMS）、执法记录仪硬件和云存储、枪声检测硬件、车牌识别网络，以及公共安全建设项目。

              市场边界很关键，因为许多分析师报告把所有「执法软件」或「公共安全软件」合成一个市场，估算从 $13.6B（Fact.MR，软件口径）到 $19B（Precedence
              Research，包含所有支撑警务的数字系统）不等。最接近 Peregrine 的子市场——预测性警务和分析平台——Research and Markets 估计 2026 年全球规模为
              $2.82B；Business Research Company 则估计，包含更广 AI/ML 工具的 AI 驱动预测性警务在 2025 年为 $5.77B，CAGR 49.7%。Peregrine
              的明确切口，是以 SaaS 或托管软件交付给美国公共安全机构的数据统一和 AI 分析层，而不是底层传感器或通信基础设施。

              没有专用分析平台时，机构使用的现状替代品包括：（1）Motorola Solutions CAD/RMS 套件内置分析模块（Integrated Intelligence Center），（2）Axon
              Fusus，用于聚合摄像头和传感器数据流，（3）Palantir Gotham，面向有联邦级数据需求的大型机构，（4）机构 IT 团队自建 SQL/GIS
              环境，（5）通过邮件和传真手工请求跨机构数据——这仍是小型部门的默认做法。这些替代品定义了切换成本基线，也是 Peregrine 在采购周期中必须跨过的主要竞争护城河。

              影响 Peregrine 但不直接构成其 SAM 的相邻支出包括：联邦情报和反恐分析（Palantir、IBM i2）、智慧城市视频分析平台、移民执法数据工具，以及州级 fusion center
              软件。国际上，加拿大、澳大利亚和英国也有类似平台，但 Peregrine 目前的商业焦点仍是美国州和地方市场。
