      - number: '8.4'
        title: 乐观、基准与悲观情景分析
        blocks:
          - type: paragraph
            body: >
              估值情景围绕三条增长轨迹搭建，锚点是 mid-2025 的 $40.9M ARR 基数和 March 2025 的 $2.5B 入场估值。乐观情景假设公司持续每年 3x 增长（与 Peregrine
              所称历史记录一致），到 2027 财年约达到 $370M ARR；若退出 ARR 倍数为 12-15x（与有利退出环境下的高增长 govtech SaaS 一致），隐含价值为 $4.4-5.6B，对 $2.5B
              入场价产生 1.8-2.2x 回报——相对风险投资阶段的风险画像不算高，但仍为正。

              基准情景假设年增长降至 1.8-2x（符合政府采购摩擦和销售团队扩张滞后的情况），到 2027 财年约达到 $133M ARR；若退出 ARR 倍数为 8-10x（中阶段 govtech SaaS），隐含价值
              $1.0-1.3B，较 $2.5B 入场价亏损 50-60%。在这个情景里，Peregrine 的增长率遵循 SaaS 常见路径：ARR 过 $100M 后放缓，当前估值溢价消失。

              悲观情景反映实质逆风：政府预算削减、公民自由反弹拖慢新机构采购，或 Axon / Motorola Solutions 平台把同等能力打包进既有合同。此时年增长降至 1.2-1.4x，到 2027 财年仅达到
              $60-70M ARR；若 ARR 倍数为 5-7x（困境 govtech），隐含价值 $300-490M，较 $2.5B 入场价亏损 80-88%——类似 Dataminr
              的二级市场结果。概率信号：基于当前有关盈利能力、客户集中度和政府预算约束的证据，基准和悲观情景合计占据大多数结果概率。
