  - id: FV001
    title: 推荐逻辑链
    type: flow
    layout: wide
    summary: |
      从市场规模、增长证据、可比估值和风险因素出发，到有条件观察建议的证据—推荐链。
    data:
      nodes:
        - id: n1
          label: |-
            市场规模
            $20.25B → $32.96B（到 2030 年）
            10.2% CAGR
        - id: n2
          label: |-
            增长证据
            ARR 连续 3 年以上 3x 增长
            $40.9M ARR（2025，估计）
        - id: n3
          label: |-
            投资人信号
            Sequoia 领投 C 轮
            $190M，估值 $2.5B
        - id: n4
          label: |-
            可比估值
            Flock Safety 25x ARR
            Axon 11x 收入
            Tyler 5x 收入
        - id: n5
          label: |-
            风险因素
            政府科技估值压缩（Dataminr −80%）
            政府预算风险
            公民自由反弹
            61x ARR = 高溢价
        - id: n6
          label: |-
            缺失证据
            ARR 审计；NRR；单位经济；
            客户集中度
        - id: n7
          label: |-
            建议
            有条件观察
            等待 ARR 确认
            入场需降至 15-20x 远期 ARR
      edges:
