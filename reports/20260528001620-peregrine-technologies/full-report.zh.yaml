      - number: '1.3'
        title: 融资历史、投资人基础与资本结构
        blocks:
          - type: paragraph
            body: >-
              Peregrine 的融资轨迹，从小规模种子轮一路走到高信念的独角兽融资，用了不到八年。第一笔披露的机构资本是 2020 年约 $7 million Series A；2022 年产品开始获得机构牵引后，又完成
              $21.1 million Series A-1 延伸轮。Series B 出现在 2024 年 5 月：Friends & Family Capital 和 Fifth Down Capital 领投 $30
              million，既有投资人 Goldcrest Capital、Craft Ventures 和 Godfrey Capital 参投。Series B 当时，Crunchbase 数据显示已披露融资总额为
              $60 million。Forbes 报道 Series B 后估值约 $360 million，这一数字来自 Noone 在 2024 年 5 月采访中的说法。


              2025 年 3 月的 Series C 是决定性融资事件。Sequoia Capital 领投 $190 million，Goldcrest Capital、Friends & Family
              Capital、Fifth Down Capital、OG Venture Partners 和 Godfrey Capital 跟投。$2.5 billion 投后估值较十个月前报道的 $360 million
              Series B 后估值约上升 7×；这是一轮陡峭提价，反映公司所称收入连续翻三倍的轨迹，也反映 Sequoia 对公共安全科技市场的判断。Crunchbase 指出，这是 Dataminr 2021 年
              $475 million Series F 之后，执法 / 公共安全创业公司最大一笔融资。


              头部融资之外，资本结构仍有多个尽调盲点。公开资料没有披露清算优先权堆叠、参与权、反稀释条款或投资人按比例认购分配。投资人与创始人的连接值得注意：前 Palantir CFO Colin Anderson，以及
              Founders Fund 的 Trae Stephens——二人均有 Palantir 背景——分别领投过更早轮次，凸显 Palantir 网络对公司资本和信誉的支撑作用。把已披露轮次相加，Series C
              后累计融资约 $248 million，但 Series A 之前的天使或亲友资金可能没有被公开数据库完整捕捉。
