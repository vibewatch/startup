      - number: '8.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 有条件观察——缺少单位经济证据时，61x ARR 定价过高
            body: >
              $2.5B 投后估值对应 $40.9M ARR，Peregrine Technologies 的定价要求公司到 2027 财年或更久仍能持续每年 3x 复合增长。同期 Flock Safety 融资轮（$7.5B
              估值、$300M ARR = 25x）为高增长公共安全 SaaS 的市场上限提供锚点，且不到 Peregrine 隐含倍数的一半。上市可比公司（Axon 11x 收入；Tyler 5-11x
              收入）进一步确认了溢价。Dataminr 二级市场崩塌（较 Series F 峰值 −80%）是最有警示意义的反向类比。建议有条件观察：不要按当前估值新建或加仓；等下一次融资事件时，拿到 ARR 审计和 NRR
              确认后再重新评估。
            calloutType: recommendation
            claimRefs:
              - CV011
              - CV015
              - CV023
              - CV026
              - CV035
          - type: callout
            title: Govtech 倍数压缩风险——Dataminr 是底部情景
            body: >
              Dataminr 的二级市场隐含估值从 $4.1B（March 2021 Series F）跌到约 $832M（September 2025），跌幅 79%，尽管公司报告约 $200M ARR，并有多年 DoD
              合同。结构性原因与 Peregrine 相通：依赖政府买方、公民自由争议，以及按超高速增长定价的新股轮估值没有在所需速度兑现。按 $2.5B 估值投资 Peregrine
              的投资人，必须把这个情景明确纳入基准模型。
            calloutType: risk
            claimRefs:
              - CV023
              - CV026
              - CV033
              - CV034
          - type: callout
            title: Flock Safety 25x ARR 是同期定价可比下限
            body: >
              Flock Safety 是直接公共安全软件同业，融资事件与 March 2025 同期；它以 $7.5B 估值、$300M ARR 融资，隐含 25x，显著低于 Peregrine 的 61x。Flock 的
              ARR 基数更大、更多元，顶级机构财团包括 a16z、Greenoaks、Founders Fund，且 YoY 增长率为 70%。这笔同期交易给出了与 Peregrine Series C 同月的高质量公共安全
              SaaS 可观察市场出清价；Peregrine 的 61x 看起来计入了比市场给予更成熟可比公司更多的可选性和早期风险溢价。
