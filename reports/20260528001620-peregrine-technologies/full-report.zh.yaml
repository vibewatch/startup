      - number: '8.5'
        title: 退出成熟度与最终尽调问题
        blocks:
          - type: paragraph
            body: >
              退出路径分析指向三条主要路线：(1) 被 Axon、Motorola Solutions 或大型国防 / 情报承包商战略收购（若增长放缓，可能在 $2-4B 区间）；(2) 在有利的 govtech 窗口
              IPO，需要 ARR 高于 ~$150-200M，并证明经营杠杆；(3) 像 Dataminr 和其他后期 govtech 独角兽一样，以低于新股估值的折价做老股交易。Peregrine
              平台的深度数据集成架构，对 Axon 有真实战略价值；Axon 在其 10-K（FY 2025）中明确将记录管理和实时运营空间列为竞争领域。但 Axon 对 Axon Records 和 Axon Fusus
              的自建投入，降低了收购紧迫性。

              最关键的未解尽调缺口包括：(1) ARR 构成和收入质量（SaaS vs. 专业服务 vs. 一次性集成费）；(2) 按机构队列划分的净留存率和流失；(3)
              按板块划分的毛利率和单位经济（CAC、回本周期、LTV）；(4) 客户集中度风险（top-10 机构占 ARR 比例）；(5) 政府合同结构（多年承诺 vs. 年度可取消）；(6) 在累计烧钱 $253M
              后走向现金流盈亏平衡的路径；以及 (7) 公民自由合规姿态，以及面对限制预测性警务或数据共享工具的州 / 地方法规时的暴露。

              在这些缺口补齐之前，合适姿态是有条件观察：跟踪后续融资事件和增长率确认，但不要在没有更充分证据的情况下追逐当前 $2.5B 估值。纪律化入场需要二选一：估值下调到下一年前瞻 ARR 的 15-20x（若 ARR
              到 mid-2026 达到 $40-50M，则约 $500-750M），或有第三方验证的明确证据，证明 Series C 后第二个连续年份仍保持 >2x 增长。
