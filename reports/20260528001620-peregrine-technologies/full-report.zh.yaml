  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >
              Peregrine Technologies 做的是数据融合和实时运营平台，让州和地方公共安全机构把割裂的记录系统接起来，接入视频和传感器数据流，并在单一界面上浮出可行动情报。公司年收入至少连续三年翻三倍，拿到了
              Tier-1 运营方信任（部署于 Super Bowl LIX），并在 March 2025 以 $2.5B 投后估值完成 Series C，由领先的 GovTech 专项 VC Sequoia Capital
              领投。核心投资逻辑有四根支柱：(1) 执法软件市场大且在增长，预计从 2025 年的 $20.25B 增至 2030 年的 $32.96B，CAGR 为 10.2%；(2)
              深度数据集成形成护城河，一旦机构记录在平台上统一，切换成本很高；(3) 产品已获得 Tier-1 事件验证（Super Bowl，以及服务 80M+ 美国人的公共安全官员）；(4) Sequoia
              领投的股权结构表释放机构确信度和治理质量信号。

              反向逻辑同样重要。$2.5B 估值约等于公司 $40.9M 年经常性收入（ARR）的 61x——这个倍数要求公司至少四年持续每年 3x 复合增长，才能到达即便温和退出倍数也能回本的规模。可比私募融资领头羊
              Flock Safety 在 March 2025 以 ~25x ARR 融资，且绝对收入基数大得多（$300M ARR），相比之下 Peregrine 的估值按增长调整后仍显得偏贵。公共安全 AI 公司
              Dataminr 在 2021 年以 $4.1B 融资，到 September 2025 私人二级市场隐含价值已跌至 ~$832M。政府采购慢、受预算约束且政治敏感：执法技术反复遭遇公民自由反弹（Flock
              Safety 在 2026 年以 $8.4B 估值引发全国性抗议），预算缺口也会冻结多年 IT 承诺。关键财务输入——单位经济、毛利率、NRR、流失、客户集中度——都没有公开确认，无法精确承销。
