      - number: '7.2'
        title: 运营风险与平台安全
        blocks:
          - type: paragraph
            body: >
              Peregrine 平台在 2026 年 1 月 14 日发生一次重大宕机，持续 29 分钟，影响网页和移动端登录、数据摄取以及供应商
              API。事后追溯显示，原因是一次常规部署出错，说明公司的发布管理和回滚流程不足以防止面向客户的中断。对运营实时犯罪中心的执法客户而言，在活跃事件期间即使 29
              分钟宕机，也可能带来运营和声誉后果。单一有记录事件并不说明系统性脆弱，但平台仍在成熟中，公司又处于高速招聘阶段，DevOps 可靠性实践经常会被拉紧。

              对任何聚合刑事司法信息、社交媒体情报和临近生物识别数据的供应商而言，数据安全都是重大风险。Peregrine 声称符合 CJIS 和
              HIPAA，并为所有数据访问运行审计日志，但它仍是一家早期私营公司，没有公开审计过的安全态势。RTCC 相邻供应商已经暴露问题：EFF 研究人员记录了 Flock Safety 的 ALPR
              摄像头网络即使在庇护辖区也被 ICE 用于移民执法；独立安全研究人员还发现 Flock 摄像头存在凭证漏洞，本可允许大规模位置跟踪。虽然这些事件特定于 Flock，但共享的监控数据生态意味着，任何知名
              Peregrine 客户遭遇泄露或 API 暴露，都会被公民自由批评者放大，并可能加速采购取消。网络安全专家 Joshua Michael
              警告说，「当一个平台把一切都连到一个地方，你就开始暴露关系和日常轨迹」——这正是在描述 Peregrine 的数据模型。

              Peregrine 的 GTM 模式要求与每个机构的 CAD 系统、RMS、数字证据库、监狱管理和无人机数据深度集成，San Mateo County
              协议正体现了这一点。集成复杂度会增加实施风险、拉长销售周期，并提高配置错误导致数据泄露或访问控制缺口的概率。公司要从 57 份合同扩展到数百份，同时为每个机构的数据架构维持符合 CJIS
              的配置管理，这是不小的运营挑战。
