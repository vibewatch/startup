  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与公民自由风险
        blocks:
          - type: paragraph
            body: >
              Peregrine 处在执法数据聚合、预测分析和 AI 生成作战洞察的交叉点，正面对联邦、州和地方层面不断升级的监管审查。FBI Criminal Justice Information
              Services（CJIS）Security Policy v6.0 于 2024 年 12 月 27 日生效，引入 20 个映射至 NIST SP 800-53 Rev. 5 的控制族，包含超过 1,300
              个子控制项；完整实施要求在 2027 年 10 月 1 日前完成。由于 CJIS 审计以机构为对象，而不是给供应商认证，Peregrine
              不会被直接审计，但任何客户机构不合规，都可能让合同面临整改要求或终止。只要健康信息与执法数据混合，HIPAA Security Rule 就会施加一套并行的数据保护制度；Peregrine
              计划扩展医疗板块时，这一场景可能出现。

              EU AI Act 将于 2026 年 8 月 2 日全面执行，禁止执法目的下在公共可进入空间对个人进行实时远程生物识别，除非符合狭窄且经法院授权的例外。虽然 Peregrine
              主要面向美国市场，并在合同中明确禁止面部识别，但向 Canada 及更广市场国际扩张，会带来一个问题：EU 的高风险 AI 分类——即便是为后续生物识别分析供能的数据聚合系统也适用——将如何与 Peregrine
              路线图互动。Trump 2025 年 12 月行政令指示 Department of Justice 挑战与全国低负担框架冲突的州级 AI 法律，但该命令保留了州对执法自身 AI
              使用的监管权限，因此市级和州级预测性警务禁令在法律上仍然有效。

              第四修正案法理正在转向应对大规模数字监控。法律学者和法院以 Carpenter v. United States（2018）为基础，越来越多地把 AI
              融合、实时聚合车牌、调度、执法记录仪和社交媒体数据视为可能需要令状的「搜查」。多篇法学评论文章和待审案件主张，RTCC 平台产生的生活模式推断会触发更高宪法审查。如果任何主要辖区认定 Peregrine
              支持的数据聚合构成无令状搜查，客户机构可能必须重构作战使用方式，从而带来合同风险和声誉损害。Electronic Frontier Foundation 曾称，像 Peregrine 这样的 RTCC
              运营方「本质上很难保护隐私，因为它们赖以构建的一切，从根本上就在损害隐私」。

              Brennan Center 研究人员警告，警务中的无监管 AI 会强化种族偏见，并让功能从既定执法目标外溢。Rachel Levinson-Waldman（Brennan
              Center）作证称，Peregrine 这一类技术可能被改用于监控堕胎可及性、生育权利、移民身份和性别身份文件——这些领域都在快速刑事化。Durham 社区组织者 Rayna Rusenko 于 2026 年
              1 月表示，「今天在这里，没有人能承诺 Durham 的警务工具和基础设施六个月后不会被用来对付我们所有人。」Durham City Council 在 2026 年 2 月一致投票阻止 Peregrine
              合同，理由是数据隐私担忧和该平台的 Palantir 血统。
