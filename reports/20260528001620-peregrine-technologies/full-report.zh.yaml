          to: integration-layer
          label: 规范化、关联、去重
        - from: integration-layer
          to: govcloud-store
          label: 加密摄取
        - from: govcloud-store
          to: ai-analytics
          label: 处理并增强
        - from: ai-analytics
          to: dashboard
          label: 呈现洞察和警报
        - from: dashboard
          to: investigator
          label: 权限门控访问
        - from: investigator
          to: outcome
          label: 基于数据的决策
