  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 缓释措施 / 尽调问题
    rows:
      - - 200+ 路数据源集成库制造迁移摩擦
        - Axon 和 Motorola 正靠硬件生态和 CAD 基座打造同等集成深度；只要竞争对手投入足够工程资源，数据源接入就可以复制
        - 高
        - 审计有多少集成是机构特有、多少是商品化；量化可比 RTCC 或调度系统切换中的平均迁移时间和成本
      - - FedRAMP High 授权在联邦 / IC 市场形成门槛
        - Axon 和 Motorola 已持有部分联邦授权；竞争对手只要有足够时间和投入，也能推进 FedRAMP High；该授权可复制，不是专有资产
        - 中
        - 确认哪些联邦机构有活跃的 Peregrine 试点或合同；评估即将到来的重新竞标风险，以及是否有竞争对手正在申请 FedRAMP High
      - - 225+ 城市部署基础形成案例销售和切换成本护城河
        - Flock Safety 约五年触达 4,800 家机构，证明快速积累可实现；Axon Fusus 95% 增长会迅速侵蚀先发案例优势
        - 高
        - 获取净收入留存和流失数据；验证 225 个城市中有多少签了多年锁定合同，多少是年度或可终止协议
      - - 专为 RTCC 打造的定位，相对于外挂式现有厂商
        - Axon 收购了一家专为 RTCC 打造的公司（Fusus）；随着 Fusus 持续成熟并接入 Axon 平台，差异化论点会逐步被抵消
        - 中
        - 识别截至 2026 年中 Fusus 与 Peregrine 的具体能力差距；评估 Axon 披露的 Fusus 集成路线图；跟踪 Fusus 功能追平时间表
      - - 公民信任反弹终止 Durham 合同，并暂停 Charlottesville 使用
        - 有组织公民自由运动可不顾技术质量取消合同；SoundThinking 收入同比下降 15%，说明该风险横跨整个行业且可量化
        - 高
        - 按城市梳理所有已知活跃反对运动；评估合同终止条款敞口；量化更多取消对收入和估值的财务影响
      - - RTCC 赛道先发优势
        - GovTech 先发优势会被采购周期、FOIA 驱动的政治压力和资金充足的后进入者侵蚀；Flock Safety 与 Axon 都较晚进入，却在缩小差距
        - 中
        - 复盘 2025–2026 年与 Axon Fusus、Flock Safety 竞争性采购的赢 / 输记录；评估胜率是稳定、改善还是下滑
    notes: 这张风险登记表聚焦 2026 年最可能改写投资判断假设的耐久性问题。产品层面的战术风险，比如功能缺口、API 版本迭代滞后、上手摩擦，已在文中点出，但不单列为护城河风险行。
