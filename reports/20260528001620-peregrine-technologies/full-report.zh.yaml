        - FY2026 收入约 $2.1B；深度嵌入市政 IT 预算
        - 拥有遗留 CAD、RMS 和法院管理系统的市 / 县政府
        - 切换成本高；覆盖完整刑事司法工作流；续约合同根深蒂固
        - 实时分析焦点有限；不是主要视觉 RTCC 竞争对手
