      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Peregrine 仍由创始人掌舵。Nick Noone 是联合创始人兼 CEO，也是公司最主要的公开面孔。创立 Peregrine 前， Noone 在 Palantir Technologies
              工作多年，负责公司与 U.S. Special Operations Command 的合作，并牵头 2014 年一项识别叙利亚 ISIS 成员的军事行动。这段 Palantir 背景既是 Peregrine
              最强的创始人-市场匹配凭证，也是最容易引发争议的公关资产：Noone 本人承认，Palantir 前员工约占 Peregrine 团队四分之一，且「Palantir 的 DNA 在 Peregrine
              很强」。Forbes 2024 年采访时，Noone 约 35 岁，意味着他在二十多岁后期创办公司，与 2017/2018 年创立时间一致。


              联合创始人 Ben Rudolph 的背景互补：Stanford 计算机科学、UN Refugee Agency 技术岗位，以及早期在 Dimagi
              的经历。两位创始人既有深技术，也有使命驱动资历，对公共部门买家有说服力。更广泛的高管梯队在公开资料中披露不足；第三方资料显示，Rob Wheeler 负责增长和客户倡导，Jeff Harper 担任 Chief
              People Officer，Ashley Chandler 担任 Chief Marketing Officer。Adam Klein 曾任 U.S. Privacy and Civil Liberties
              Oversight Board 主席，现在以正式顾问身份负责隐私架构——鉴于公司核心公民自由漏洞在于数据聚合能力可能被滥用，这一资历格外重要。


              一个关键治理缺口是，Peregrine 没有公开披露董事会构成。Sequoia 领投的 Series C 几乎肯定带来一个董事席位，Friends & Family Capital 和 Goldcrest
              Capital 等此前轮次大概率也有治理权，但没有任何备案或官网页面确认当前董事会结构。Series C 私营公司常见这种不透明，但投资人评估 Noone 和 Rudolph 周围的集中风险时，它仍然重要。
