              Durham 市议会 2026 年 2 月以 4–3 否决合同，以及 Charlottesville PD 2025 年 6 月暂停使用，暴露出与公民自由和移民执法相关的采购风险模式。在
              Durham，社区倡导者和市议会议员提到数据隐私和公平性担忧；在 Charlottesville，触发因素是 287(g)
              移民执法。两起事件都来自有组织的倡导活动，而非产品表现失败。该风险集中在进步派市镇，单靠产品改进很难缓释，构成一个结构性可服务市场约束，投资者应把它纳入管线转化假设。
