      - number: '6.2'
        title: 具名客户证据
        blocks:
          - type: paragraph
            body: >-
              Peregrine 客户牵引的最强证据来自官方政府备案，而不是公司营销材料。Los Angeles Police Department 向 Project Blue Light 授予 $2,793,750
              合同，覆盖约 9,500 名警员，期限从 2023 年 10 月至 2027 年 5 月——这是一项四年承诺，可在 Los Angeles City Clerk 在线合同数据库中看到。Orange County
              Sheriff's Office 是生产客户，其 Real-Time Operations Center 通过 Peregrine 统一了 30 多个数据系统；AWS
              案例研究提供了上线部署的第三方证据。California Richmond Police Department 自 2021 年 11 月以来维持一份 $1.1 million、五年期合同，是 Peregrine
              最早披露的商业部署之一。San Mateo County 2026 年 1 月获董事会批准的交易——40 个月 $3.4 million，面向包含 Sheriff 和 DA's Office 在内的 16
              机构联盟——是近期最扎实的可扩展区域采用证据。反向看，NC Durham 在 2026 年 2 月经市议会 4-3 投票后否决其 $517,500 单一来源合同；VA Charlottesville 于 2025
              年 6 月以 287(g) 移民执法担忧为由暂停使用。Dallas PD 为 2026 FIFA World Cup 安保行动部署 Peregrine，Sarasota County Sheriff 则签署约
              $1 million 合同，资金来自 Florida 州移民执法拨款。Brennan Center 研究人员发现，OC Sheriff 承认没有针对 Peregrine
              数据的正式使用限制政策，为原本正向的部署证据增加了反向治理维度。EFF、ACLU 和 Campaign Zero 等多个公民自由组织，也独立将具体部署标记为监控风险。
