      - number: '6.5'
        title: 扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Peregrine 的扩张画像同时呈现出有吸引力的「先落地、再扩张」模式和显著集中度风险。San Mateo 多机构联盟是区域网络效应最清晰的例子：一次县级销售把 16 个市警察局、Sheriff 和 DA's
              Office 同时带上平台，降低单位销售成本，并通过数据共享激励加深切换成本。LAPD 的 $2.8 million 合同估计相当于 Peregrine 2023 年 ARR 的 28%，如果 2027
              年未能续约，单一客户集中度风险会很重大。California 至少有五个披露客户，地理集中度意味着一旦全州出现监管或政治逆风，渠道会承压。Florida 的移民执法资金路径，把至少四份警长合同导入 Florida
              SB 1718 资金，展示了一个增长快、但政治暴露也高的新渠道。至少一名 Durham 市议会议员在 2026 年否决中提到数据隐私和公平性担忧；Charlottesville
              暂停使用则说明，即使客户已经采用，只要市政层面政治风险升级，也可能停用。ACLU 和 EFF 均提交过有记录的异议，Campaign Zero 也把 Peregrine 纳入更广泛的监控生态。拒绝或暂停
              Peregrine 的进步派市镇，提示了政治敏感城市中总可用市场的天花板。Peregrine 尚未公开宣布任何收入或采购转售渠道合作，销售模式基本仍是直销。FedRAMP High
              授权打开了联邦合同路径，可能通过把客户基础扩展到进步派城市之外，降低政治风险集中度。
