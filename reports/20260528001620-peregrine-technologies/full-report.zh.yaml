  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - ARR 质量与构成
        - 按 SaaS 订阅、专业服务、一次性集成拆分 ARR；收入确认政策；不可取消合同占比
        - GetLatka/Growjo 的 $40.9M ARR 为未经审计估计；构成决定收入质量和倍数适配度
        - 向 CFO 索取经审计或管理层复核的 ARR 明细；与客户合同披露交叉核对
      - - 净留存率与队列分析
        - 按机构队列和年份拆分 NRR；总流失率；按客户层级拆分扩张收入
        - 如果没有 NRR > 100%，3x 增长故事就需要持续获取新客户，CAC 会升高、利润率韧性会下降
        - 向财务团队索取队列瀑布图；至少覆盖 3 年队列
      - - 单位经济模型
        - 按渠道拆分 CAC、回本周期、LTV:CAC；按产品线拆分毛利率；当前规模下的 EBITDA 或贡献利润率
        - 累计融资 $253M，能否走向盈亏平衡决定退出准备度；公开证据缺失
        - 要求提供管理账目或资料室权限；对标 Axon（59.7% 毛利率）和 Tyler（46% 毛利率）
      - - 客户集中度
        - 前十大机构 ARR 占比；是否有单一机构超过 ARR 的 10%；按规模层级拆分合同期限
        - 政府客户集中会放大不续约风险；Axon 在 10-K 中明确披露没有客户超过收入的 10%，可作类比
        - 索取按机构划分的 ARR 热力图；对比 Axon 的合同分散姿态
      - - 政府合同结构
        - 多年期已承诺 ARR 与年度续约 ARR 的拆分；合同是否包含政府采购中常见的无因终止（T4C）条款
        - 政府合同常含 T4C 条款，削弱 ARR 耐久性；这决定收入基础的有效黏性
        - 法律审查代表性合同；重点看 T4C 语言和续约率
      - - 公民自由合规与立法暴露
        - 按 ARR 排名前 5 的州是否有待决或受威胁的公民自由立法；隐私审计结果；ACLU 或 EFF 沟通情况
        - Flock Safety 抗议升级和 Dataminr BLM 争议显示，政治反弹会实质伤害公共安全 SaaS 采用和估值
        - 委托独立公民自由法律审查；要求公司法律顾问提交逐州立法风险评估
    notes: 尽调问题按大致优先级排序。第 1-3 项是任何投资决策的最低要求；第 4-6 项也很重要，但可能部分通过管理层陈述解决。
    claimRefs:
      - CV036
      - CV037
      - CV038
      - CV039
      - CV040
