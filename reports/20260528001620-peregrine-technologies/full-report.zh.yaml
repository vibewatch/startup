      - number: '4.4'
        title: 资本充足性与融资
        blocks:
          - type: paragraph
            body: >-
              Peregrine 三轮风险股权融资合计约 $220–227 million。$7M 的 Series A（2020 年 2 月）确立了产品市场匹配；$30M 的 Series B（2024 年 5 月，由
              Friends & Family Capital 和 Fifth Down Capital 领投）验证了商业牵引；$190M 的 Series C（2025 年 3 月，由 Sequoia Capital
              领投）把投后估值推至 $2.5B，也是迄今最大一笔单轮资金注入。公司明确披露 Series C 资金用途是加速招聘软件工程师和实施人员，而不是新产品开发或 M&A。截至 2026 年 5
              月，公司未披露现金余额、月度烧钱速度或剩余现金跑道。公开资料也没有信贷额度、债务工具或非股权融资。没有任何公开已知债务值得注意；以 $2.5B 估值和 $40.9M ARR
              看，公司本可接触风险债或循环信贷额度，但尚未宣布。FedRAMP High 授权（2026 年 4 月）是有意义的资本放大器，因为它解锁联邦机构采购；该细分市场的 ACV
              历史上高于地方政府，粘性也更强。Series C 隐含现金头寸相当充足，但公司已有 428 多名员工，且模式重实施，烧钱速度很可能不低。
