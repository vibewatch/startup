            body: >-
              Peregrine 的 GitHub 组织（Peregrine-Tech）没有公开仓库，也没有列出的公开成员。公司没有公开文档化的 API、SDK 或开发者门户。这与其政府 SaaS
              模式一致——集成由自研连接器和嵌入式工程师处理，而不是自助式开发者工具。封闭界面降低了竞争暴露，但也限制生态网络效应，并让投资者更难对架构质量做技术尽调。
