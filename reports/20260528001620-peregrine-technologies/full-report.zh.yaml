      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >
              最强的需求加速器是 RTCC 浪潮：National Real Time Crime Center Association 年会参会人数从 2022 年的 200 人增至 2025 年的 1,000 人，反映到
              2025 年底约有 300 个活跃 RTCC。中大型执法机构越来越把 RTCC 视为标准基础设施层，从而长期拉动驱动 RTCC 的分析平台需求。Samsung 2026 年 1 月分析确认，移动集成——把
              RTCC 情报带到一线警员手中——是下一波采用方向。

              监管和政策顺风包括 Biden 时代 AI 行政令，以及为技术采用提供资金的 COPS 和 Byrne 补助项目。Peregrine 的 FedRAMP High
              授权——少数获得该认证的公共安全平台之一——直接打开联邦机构采购，并向处理联邦数据的州机构提供信任信号。

              公共安全存量厂商的增长率也印证市场机会。Axon Enterprise 2025 年收入增长 33% 至 $2.8B，2026 年指引为 $3.6B（增长 27–30%），ARR 超过
              $1.3B——说明政府买家在公共安全领域正积极扩大经常性软件支出。Motorola Solutions 2025 年增长 8% 至 $11.68B，积压订单 $15.7B。Palantir 美国政府收入仅
              2026 年 Q1 就达到 $687M，同比增长 84%。存量厂商同步增长验证结构性需求，但也意味着竞争升温。

              约束侧，公民自由反对是最直接的需求压制因素。2026 年初，North Carolina Durham 市议会在居民和倡议组织施压后，否决一份 $517K Peregrine
              合同，反对理由包括预测性警务和监控担忧。Virginia Charlottesville 警方在 2025 年暂停使用 Peregrine 软件。Brennan Center 和 ACLU 已发布报告，把 AI
              驱动公共安全平台描述为公民自由和种族公平风险。这些事件并非孤例，而是社区反对反复出现的模式；即便技术和预算已经获批，也可能在后期采购阶段被拖垮。

              政府采购周期长（从规格制定到授标 6–18 个月）、遗留系统集成复杂、小型机构 IT
              人手有限，都是结构性约束。合同需要市议会或县委员会批准，意味着技术评估完成后仍会受政治动态影响。最后，数据集成依赖其他厂商（RMS、CAD、传感器数据流），制造技术切换成本，也可能利好系统级集成更深的存量厂商。
