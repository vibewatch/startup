      - number: '4.2'
        title: GTM 路径与销售效率
        blocks:
          - type: paragraph
            body: >-
              Peregrine 在政府领域的获客几乎完全靠直销，且入站需求占很大比重。销售周期受公共采购规则约束：试点可能几个月，全量竞争性招标可能拉长到 12 个月以上。Sourcewell、NASPO
              等合作采购工具允许机构搭载预先谈好的合同，压缩正式采购时间，公司因此受益。San Mateo County 这类多机构安排（18 个机构共用一份合同）说明，一次销售可以撬动不成比例的 ARR。Revelio
              Labs 和 Unify GTM 的员工数数据表明，公司招聘重心明显偏向实施和客户成功岗位，符合「先落地、再扩张」模式：成功部署会在公共安全圈内带来口碑传播。公开资料没有
              CAC、销售周期长度、管线转化率或配额达成率数据。截至 2024 年 8 月，公司有 57 份合同，平均 ACV 为 $280K，推算当时 ARR 约 $15.9M；这与 Forbes 报道的 2024 全年约
              $30M 轨迹大体一致，因为部分合同可能在年内稍晚签署，且 ACV 更高。
            claimRefs:
              - CI008
              - CI009
              - CI013
              - CI021
              - CI023
              - CI028
      - number: '4.3'
        title: 公开牵引信号与披露缺口
        blocks:
          - type: paragraph
            body: >-
              以公司所处阶段看，Peregrine 的公开牵引信号很强。收入从 2022 年的 $3M 增至 2023 年的 $10M，再到 2024 年估计 $30M（CEO 截至 2024 年 8 月的预测），每年约增长
              3 倍；GetLatka 报告 2025 年 9 月 ARR 为 $40.9M，说明公司仍在快速增长，只是百分比增速低于此前几年。公司服务 225 多个拥有 Real-Time Crime Centers
              的城市，并声称保护超过 80 million 名美国人。员工数从 151 人（2023 年）增至 428 人（2025 年 12 月），招聘岗位从 2023 年的 9 个增至 2025 年的 85
              个，显示公司继续扩招以支撑实施和工程。按 2025 年 9 月数字计算，单员工隐含 ARR 约 $95,600，低于典型纯软件 SaaS 基准，但符合一个捆绑实施和专业服务的 GovTech 平台。Series
              C 募集资金被明确用于工程师和实施人员，而非新产品开发，印证了交付模式对实施的高依赖。2026 年 4 月取得 FedRAMP High 授权后，联邦市场被打开。GetLatka 数据库错误地将
              Peregrine 描述为「未融资的自举公司」，这与 $220M+ 风险融资直接矛盾，属于数据质量错误；承销方不应依赖 GetLatka 对 Peregrine 融资总额的统计。所有私有 SaaS
              指标——毛利率、NRR、流失率、CAC、客户数——仍未披露。
