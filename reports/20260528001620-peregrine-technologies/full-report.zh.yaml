  - id: FE001
    title: Peregrine 平台架构栈
    type: stack
    layout: standard
    summary: 五层架构从分散的机构数据源出发，穿过自研集成层、AI 分析、操作员应用，落到 AWS GovCloud 安全与合规基础。
    data:
      layers:
        - label: 数据源（机构自有）
          detail: >-
            CAD（Motorola、CentralSquare、Mark43、Tyler、Hexagon）；RMS 平台；ALPR 网络；执法记录仪数据流；Axon Evidence.com；Skydio
            DFR；监狱管理系统（JMS）；第三方传感器；911/调度记录
        - label: 数据集成层（自研）
          detail: 供应商无关的 ETL 连接器；ML 身份解析；记录关联；去重预处理；无需数据迁移；处理结构化和非结构化输入
        - label: 分析和 AI 层
          detail: 记录去重 AI；报告摘要器；安全标记引擎；Peregrine Vision 视频分析（边缘 + 云）；OCR；音频转写；Resource Optimizer（预测需求，beta）；地理空间关联
        - label: 操作员应用层
          detail: 统一搜索仪表盘（类似 Google 的查询 UX）；跨数据集时间线和关系图谱；地理空间可视化；Emergency Ops 模块（事件、资源、消息）；协作和共享工具
        - label: 安全与合规基础（AWS GovCloud）
          detail: Amazon Redshift / RDS / EC2 / S3；FedRAMP High（2026 年 4 月）；符合 CJIS；符合 HIPAA；传输中和静态加密；RBAC + SSO；完整审计日志；无人脸识别
    approximationNotes: 层级顺序反映逻辑数据流，不是物理部署顺序。边缘 AI 处理在传感器 / 摄像头层完成，先于数据进入 GovCloud 摄取管线。
    claimRefs:
      - CE003
      - CE007
      - CE008
  - id: FE002
    title: 客户工作流——从孤岛数据到知情行动
    type: flow
    layout: standard
    summary: 八步运营流程展示机构数据如何从割裂的遗留系统进入 Peregrine 的集成和分析管线，产出可供调查员直接使用的情报。
    data:
      nodes:
        - id: siloed-data
          label: 机构孤岛数据
          detail: CAD、RMS、ALPR、执法记录仪、JMS 彼此割裂；跨部门查询过去需要数周
        - id: connectors
          label: Peregrine 连接器
          detail: 供应商无关适配器在无需数据迁移的情况下规范化输入；嵌入式部署工程师负责配置
        - id: integration-layer
