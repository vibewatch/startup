      - number: '3.3'
        title: 存量平台厂商：Motorola Solutions、Tyler Technologies、Mark43、Palantir 与 NICE
        blocks:
          - type: paragraph
            body: >-
              Motorola Solutions 是公共安全基础设施领域的主导存量厂商。其 2026 年 Q1 收入 $2.717 billion，同比增长 7%；软件和服务同比增长 18%；CommandCentral
              平台在全球集成 CAD、记录和视频情报，覆盖超过 100,000 个机构。Motorola 相对 Peregrine 的杠杆在于底座控制：任何由 Motorola 运行 CAD 的机构，Motorola
              都可以提供一层集成分析，而不需要触发新的采购事件。Tyler Technologies 在记录管理侧采用同样打法，依靠深嵌市政 IT 预算的传统 CAD、RMS 和法院管理系统，年收入约 $2.1
              billion。Tyler 切换成本很高，因为其平台管理的是核心刑事司法工作流，不只是可视化。Mark43 的云原生 RMS/CAD 平台现在服务 300+ 个机构，并在 2025 年 10 月完成 Series
              G；它瞄准的是与 Peregrine 相同的现代化买家，平台成熟后，可能在合同续约时打包基础态势感知功能。Palantir Gotham 和 NICE Investigate
              定义市场高端——大型联邦机构和情报界期待的不只是公共安全数据流，而是全谱数据融合。NICE Investigate 覆盖全球 500 万起警方调查，并在英国 /
              欧洲占据主导地位，影响国际买家使用的比较基准。Palantir 也因大规模监控地图研究面临公民自由审查，但其联邦关系和 ATO 记录打开了采购通道；Peregrine 的 FedRAMP High
              授权正是为匹配这条通道而设计。Palantir FY2025 收入超过 $2.8 billion，财务资源足以投入公共安全能力，未来可能缩小差异化差距。
