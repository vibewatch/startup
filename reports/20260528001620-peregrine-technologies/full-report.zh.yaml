      - number: '7.3'
        title: 合作伙伴、客户与采购集中度风险
        blocks:
          - type: paragraph
            body: >
              Peregrine 的客户基础几乎完全由美国州和地方执法机构构成，形成严重集中度风险。收入绑定年度政府合同，单机构平均约 $280,000。截至 2024 年中，公司持有 57 份合同；2023 年收入翻三倍至
              $10 million，2024 年目标再次翻三倍至 $30 million（Forbes）。公司 2025 年 3 月 Series C 的 $2.5 billion
              估值隐含一个增长倍数，要求公司在市县执法机构这个较小 TAM 内持续赢单。

              政府采购特别容易受政治扰动影响。NC Durham 2026 年 2 月否决合同——一笔 $517,000
              交易，在社区活动人士于公开市议会会议提出隐私担忧后被拒——说明单一有组织反对运动就能挡住收入。Peregrine 的 Palantir 血统（CEO Nick Noone 曾是 Palantir 高级领导；约
              25% 员工是 Palantir 校友）在公开听证中反复成为负担，因为 Palantir 与 U.S. Immigration and Customs Enforcement 数据工作有关。在 Sarasota
              County，采购通过 Florida's State Board of Immigration Enforcement
              完成——这是一个不受地方监督的州基金——部分绕开了社区输入，但该机制本身也可能引发针对采购的公民自由法律挑战。

              San Mateo County 覆盖 18 个机构、40 个月、$3.4 million 的协议，展示了 Peregrine
              的多机构联盟签约策略：一个牵头机构为多个小部门管理平台，由此形成账户集中度，一个政府决策可能同时移除多个产生收入的部署。技术合作伙伴包括 Axon（Evidence.com 集成）和
              Skydio（无人机先响应者数据流），意味着 Peregrine 的产品价值主张依赖其无法控制的第三方硬件和软件生态可靠性。如果 Axon 或关键数据源 Flock Safety 因自身公民自由争议而调整 API
              条款、定价或访问政策，Peregrine 的集成可能受扰。Flock Safety 本身在 2025 年遭遇重度审查：EFF 曝光摄像头网络滥用，独立研究人员发现安全漏洞。
