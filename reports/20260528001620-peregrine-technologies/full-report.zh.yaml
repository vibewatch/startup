      - number: '6.3'
        title: 采用轨迹
        blocks:
          - type: paragraph
            body: >-
              Peregrine 披露的采用轨迹显示增长强劲，但文档化程度不均。Forbes 确认截至 2024 年 8 月已签 57 份合同，这是独立出版物给出的最可信时间点计数。公司随后声称到 2025 年中覆盖 400
              多个机构——不到一年扩张近 7 倍；若准确，意味着管线转化很快，但定义很可能混合了生产合同、试点和临时协议。据报道，收入从 2022 年约 $3 million 增至 2023 年 $10 million，CEO
              Noone 提到 2024 年 ARR 目标为 $30 million；这些数字尚未由独立审计确认。每年 $280,000 的平均合同价值意味着即使只有 57 份合同，年收入也会接近 $16
              million，说明要么合同执行低于预期，要么 57 这一计数低估了活跃基础。Forbes 确认的 57 份合同与公司声称的 400 多个机构之间存在数据冲突缺口。Richmond CA PD 2021 年 11
              月合同确立了最长运行的生产合作，并提示客户寿命较强。California 至少有五个不同机构被文档化，呈现区域集群，符合靠转介绍驱动的企业销售。
