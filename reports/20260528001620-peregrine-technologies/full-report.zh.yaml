      - number: '1.4'
        title: 规模、里程碑与反向信号
        blocks:
          - type: paragraph
            body: >-
              Peregrine 公开可追踪的里程碑，从湾区起步延伸到全国性独角兽叙事，中间第一次出现实质性公民自由争议。创立期（2017-2019）围绕在 San Pablo Police Department 驻场 18
              个月展开，这既产出产品洞察，也带来第一项真实效果证据：2021 年中一起谋杀案审判中，Peregrine 的数据拼接帮助取得陪审团接受的定罪结果。


              增长指标亮眼，但依赖小基数复合。Forbes 报道，收入在 2023 年从约 $3 million 翻三倍到 $10 million，Noone 预计 2024 年再翻三倍到 $30
              million。如果轨迹成立，公司进入 Series C 时 ARR 约 $30 million——与第三方估计的 2025 年 ARR 约 $40.9 million（公司未验证）一致。机构足迹从 2023
              年中「少数几个州」扩到 2024 年 5 月的 40 多个机构、10+ 个州，再到 Series C 时的 8000 万美国人 / 40 多个机构口径。员工数在 2025
              年快速上升，第三方劳动力分析显示，2025 年末约 428 人，2026 年 3 月约 443 人。


              2025 年 2 月在 New Orleans 的 Super Bowl LIX 部署，是最受关注的规模证明点。New Orleans Police Department 和市 Office of
              Homeland Security and Emergency Preparedness 使用
              Peregrine，把犯罪数据库、执法记录仪、警员位置数据和可疑活动报告接入同一系统，覆盖联邦、州和地方安全机构，为一场全国性大型活动服务。New Orleans Mayor's Office 材料明确把
              Peregrine 列为该活动的安保平台。


              第一个显著反向信号出现在 2026 年 1-2 月。Durham, NC City Council 在 1 月 22 日召开工作会议，讨论 Durham Police Department 拟签的
              $517,000 Peregrine 合同。多名议员表示将拒绝合同，理由包括大规模监控风险、算法偏见担忧，以及 Peregrine 的 Palantir 血统。Durham
              居民质疑公司的「安全标记」工具——Peregrine 自己 FAQ 中称，该工具使用犯罪率和逮捕记录预测犯罪热点——以及预测性警务延续种族偏见的可能性。Electronic Frontier Foundation
              更广泛地把 Peregrine 这类公司描述为「本质上很难保护隐私，因为它们建立的一切基本都在伤害隐私」。Peregrine 的应对包括任命 Adam Klein 为公民自由顾问，并在合同中加入隐私保护条款，但
              Durham 结果说明，制度性阻力是真实运营风险，不只是理论问题。
