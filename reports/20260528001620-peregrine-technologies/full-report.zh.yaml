  - id: FV002
    title: 估值敏感性 — ARR 倍数 vs. 增长率
    type: bar
    layout: standard
    summary: |
      展示 Peregrine 的隐含退出价值如何随 ARR 增长率和退出倍数变化，并以 $2.5B Series C 入场估值为基准。数值单位为 $B。
    data:
      items:
        - label: 3x 增长，15x 退出（乐观）
          value: 5.6
        - label: 3x 增长，12x 退出（乐观-基准）
          value: 4.4
        - label: 2x 增长，10x 退出（基准）
          value: 1.6
        - label: 2x 增长，8x 退出（基准-低）
          value: 1.3
        - label: 1.5x 增长，7x 退出（基准-悲观）
          value: 0.7
        - label: 1.2x 增长，5x 退出（悲观）
          value: 0.3
        - label: 入场估值（$2.5B 参照）
          value: 2.5
    approximationNotes: >-
      数值以 $40.9M 2025E ARR 为基准，复合 2 年至 FY2027E 计算。倍数参照 Axon（11x 收入）、Tyler（5.2x 收入）、Flock Safety（25x ARR）和 Dataminr
      老股交易（4x ARR）校准。图中数值是示意性情景输出，不是预测。
