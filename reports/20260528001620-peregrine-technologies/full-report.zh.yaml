companyProfile:
  summary: >
    Peregrine Technologies 是一家总部位于旧金山的 GovTech 独角兽，2018 年由 CEO Nick Noone（前 Palantir，曾负责 US Special Operations Command
    合作）和联合创始人 Ben Rudolph（Stanford CS，前 UN Refugee Agency 技术人员）创立。公司运行一套云原生数据融合平台，把分散的机构数据——
    法院记录、逮捕报告、执法记录仪转写文本、车牌识别日志和调度数据流——接入统一的实时情报界面。 Forbes 在 2024 年 8 月把该产品称为「本质上是警务数据的超级 Google」。Peregrine 在 2025 年 3
    月完成 Sequoia Capital 领投的 $190M Series C，投后估值 $2.5B，是 Dataminr 2021 年 Series F 之后执法科技领域最大一笔融资。公司参与了 Super Bowl
    LIX（2025 年 2 月）部署，并在 2026 年 4 月获得 FedRAMP High 授权。Palantir 血统和预测分析工具也引来公民自由审查；Durham NC City Council 在 2026 年 2
    月以数据隐私担忧为由，一致否决了一份 $517K 合同。
