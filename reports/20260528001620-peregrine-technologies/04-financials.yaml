- id: capital-adequacy-and-financing
  title: Capital adequacy and financing
  body: >-
    Peregrine has raised approximately $220–227 million in total venture equity across
    three rounds. The Series A of $7M (February 2020) established product-market fit;
    the Series B of $30M (May 2024, led by Friends & Family Capital and Fifth Down
    Capital) validated commercial traction; and the Series C of $190M (March 2025,
    led by Sequoia Capital) set a $2.5B post-money valuation and is the largest single
    capital infusion by far. The Series C use of proceeds was explicitly disclosed as
    accelerating hiring of software engineers and implementation staff, not new product
    development or M&A. There is no disclosed cash balance, monthly burn rate, or
    remaining runway as of May 2026. There is no publicly disclosed credit facility,
    debt instrument, or non-equity financing. The absence of any publicly known debt
    is notable; at a $2.5B valuation with $40.9M ARR, the company could potentially
    access venture debt or a revolving credit facility, but none has been announced.
    FedRAMP High authorization (April 2026) is a meaningful capital enabler because
    it unlocks federal agency procurement, historically a higher-ACV and stickier
    segment than local government. The implied cash position from the Series C is
    substantial, but with 428-plus employees and an implementation-heavy model,
    burn is likely meaningful.
  claimRefs:
  - CI001
  - CI002
