callouts:
- calloutType: strength
  title: Revenue tripling three years in a row from a real contract base
  body: >-
    Peregrine's 3x revenue compounding from 2022 through 2024, corroborated by
    filed government contracts, is among the strongest GovTech growth trajectories
    on record. Unlike some GovTech peers that rely on grant-funded pilots, Peregrine's
    filed contracts are multi-year committed subscriptions at commercially meaningful
    ACVs.
  claimRefs:
  - CI005
  - CI006
  - CI010
  - CI011
- calloutType: risk
  title: 61x ARR multiple leaves no room for execution or reputational slippage
  body: >-
    At $2.5B valuation against $40.9M ARR, Peregrine trades at roughly 61x ARR—
    comparable to early Palantir or high-growth SaaS at peak. A single year of
    deceleration, a cluster of contract rejections, or a material adverse event
    around privacy litigation could compress this multiple sharply. The Durham
    rejection in February 2026 and Florida immigration fund controversy are early
    signals of a real regulatory and community-opposition risk embedded in the
    business model.
  claimRefs:
  - CI012
  - CI032
  - CI033
  - CI034
  - CI042
- calloutType: risk
  title: Community opposition and civil liberties scrutiny are underwritten costs
  body: >-
    Multiple investigative journalists, civil liberties organizations (EFF, Brennan
    Center, ACLU), and at least two city councils have raised substantive objections
    to Peregrine's platform on privacy, surveillance, and algorithmic-bias grounds.
    Durham's February 2026 contract rejection is not an isolated event; Charlottesville
    also paused its deployment. Every future sales cycle now includes a community
    opposition dimension that adds cost, elongates the sales cycle, and can yield
    zero revenue even after significant pre-sales investment.
  claimRefs:
  - CI012
  - CI032
  - CI033
  - CI034
  - CI040
