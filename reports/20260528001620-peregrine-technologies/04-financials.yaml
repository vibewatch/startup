- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Public status
  - Why it matters for underwriting
  - Closest public proxy
  - Diligence path
  rows:
  - - Gross margin (blended and by segment)
    - Not disclosed
    - Core input to whether Peregrine is a software business or a services business
    - All-user subscription model implies high gross margin is possible; implementation bundling may compress it
    - Request management P&L with gross margin by subscription revenue, implementation, and professional services
  - - Monthly burn rate and cash runway
    - Not disclosed
    - Series C proceeds are large ($190M) but headcount growth is rapid (428+ employees); burn could be material
    - No proxy; last round date and use-of-proceeds language are the only reference points
    - Request current monthly cash consumption and 18-month forward runway model
  - - Net revenue retention (NRR) and gross retention
    - Not disclosed
    - Tells whether agencies expand usage and pay more at renewal, or whether churn exists
    - No known churn events, but Durham rejection (before contract start) is not a churn event per se
    - Request gross and net retention by cohort vintage, including any contract non-renewals
  - - Customer acquisition cost and payback period
    - Not disclosed
    - Government sales cycles are long; if CAC is high relative to ACV, payback may be 2-3 years
    - Headcount growth in implementation and CS roles implies significant delivery cost per new contract
    - Request loaded CAC by channel, sales cycle duration, and payback by agency tier
  - - Exact customer count and ACV distribution
    - 'Partially disclosed: 57 contracts as of Aug 2024; exact 2026 count unknown'
    - Needed to verify the $40.9M ARR figure and understand customer concentration
    - GetLatka ARR + CEO ACV statement imply ~55-65 customers at Aug 2024 reporting; current count unknown
    - Request total active contract count, ARR by contract, and top-10 customer concentration
  - - Debt, credit facility, or non-equity financing
    - None publicly disclosed
    - Large GovTech companies routinely use venture debt; absence of disclosure is not evidence of absence
    - No credit facility or debt instrument found in any public source
    - Request complete debt and credit facility schedule with terms, covenants, and maturity
  notes: >-
    These are the specific private-company metrics that prevent high-confidence
    underwriting of Peregrine's revenue quality and margin path. Every row
    represents a real diligence blocker.
