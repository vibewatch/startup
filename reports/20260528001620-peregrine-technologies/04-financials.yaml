- id: financial-verdict
  title: Financial verdict
  body: >-
    The financial picture for Peregrine Technologies is directionally positive on
    demand and top-line momentum, but not yet underwriteable on unit economics. On the
    positive side, Peregrine has achieved genuine commercial scale: filed contracts
    confirm a real and growing ARR base, revenue has grown at triple-digit rates for
    at least three consecutive years, and the Sequoia-led Series C at a $2.5B
    valuation signals institutional conviction in the category thesis. FedRAMP High
    authorization positions the company for federal agency procurement, a potentially
    large expansion vector. On the cautionary side, the $2.5B valuation at roughly
    61x September 2025 ARR is an extreme multiple that leaves no room for execution
    slippage. The contract rejection in Durham, NC (February 2026)—after sustained
    community opposition and civil liberties scrutiny—highlights real deal-flow risk
    that is not yet priced into headline metrics. WUSF's investigative reporting
    found that at least some Florida agencies procured Peregrine via state
    immigration enforcement funds without local council approval, suggesting
    procurement-channel risk that could generate adverse press and future contract
    cancellations. No gross margin, NRR, CAC, burn, or customer count is public,
    making revenue quality, margin path, and capital intensity impossible to judge
    from open sources alone. The recommendation is to treat the current financial
    evidence as supporting a strong demand narrative with a meaningful execution and
    reputational overhang, and to condition any investment conclusion on management
    disclosing gross margin, net revenue retention, burn rate, customer concentration,
    and the terms of any future debt or credit facility.
