- id: gtm-motion-and-sales-efficiency
  title: GTM motion and sales efficiency
  body: >-
    Peregrine's go-to-market motion is almost entirely direct and inbound-heavy within
    the government sector. Sales cycles are governed by public procurement rules, which
    can extend from a few months for a pilot to 12-plus months for a full competitive
    bid. The company benefits from cooperative purchasing vehicles (e.g., Sourcewell,
    NASPO) that allow agencies to piggyback on pre-negotiated contracts, reducing the
    formal procurement timeline. Multi-agency arrangements like San Mateo County (18
    agencies on a single contract) demonstrate that one sale can yield disproportionate
    ARR. Headcount data from Revelio Labs and Unify GTM shows hiring focused heavily on
    implementation and customer-success roles, consistent with a land-and-expand model
    in which successful deployments generate word-of-mouth within the public safety
    community. No public CAC, sales-cycle length, pipeline conversion rate, or quota
    attainment data exists. The company's 57 contracts as of August 2024 at an average
    $280K ACV implies total implied ARR of roughly $15.9M at that point, broadly
    consistent with the Forbes-reported ~$30M trajectory for full-year 2024 as some
    contracts would have been signed later in the year at larger ACVs.
  claimRefs:
  - CI008
  - CI009
  - CI013
  - CI021
  - CI023
  - CI028
- id: traction-signals-and-disclosure-gaps
  title: Public traction signals and disclosure gaps
  body: >-
    Public traction signals are strong for a company at this stage. Revenue grew
    approximately 3x in each year from 2022 ($3M) to 2023 ($10M) to an estimated
    $30M in 2024 (CEO projection as of August 2024), and GetLatka reported ARR of
    $40.9M as of September 2025, implying continued rapid growth though at a lower
    percentage rate than prior years. The company serves 225-plus cities with Real-Time
    Crime Centers and claims to protect more than 80 million Americans. Headcount
    grew from 151 (2023) to 428 (December 2025), and job postings expanded from
    9 in 2023 to 85 in 2025, signaling continued hiring to support implementation
    and engineering. Implied ARR per employee is approximately $95,600 based on
    the September 2025 figures—below typical software-only SaaS benchmarks but
    consistent with a GovTech platform that bundles implementation and professional
    services. Series C proceeds were earmarked specifically for engineers and
    implementation staff rather than new product development, confirming the
    implementation-intensive delivery model. FedRAMP High authorization in April
    2026 opens the federal market. GetLatka's database erroneously describes
    Peregrine as "bootstrapped with no outside investment," which is a data quality
    error directly contradicted by $220M+ in venture funding; underwriters should
    not rely on GetLatka's funding totals for Peregrine. All private SaaS metrics—
    gross margin, NRR, churn, CAC, customer count—remain undisclosed.
