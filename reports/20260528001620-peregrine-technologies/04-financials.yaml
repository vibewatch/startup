  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin
    missingEvidence: >-
      Segment and consolidated gross margin, plus the split between software
      subscription revenue and implementation/services revenue.
    whyItMatters: >-
      Without gross margin and services mix, investors cannot determine whether
      Peregrine is a high-margin software business or a labor-intensive services
      operation with software-like pricing. This is the single largest underwriting
      gap.
    diligencePath: >-
      Request audited management accounts with gross margin by segment: subscription,
      professional services, and blended. Ask for direct cost breakdown covering
      cloud infrastructure, implementation headcount, and customer success.
    relatedQuestionRefs:
    - QI015
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Exact current customer count, ARR by customer, and top-10 customer
      concentration as a share of total ARR.
    whyItMatters: >-
      With only ~57 confirmed contracts as of August 2024 at an average ACV of
      $280K, the top few contracts (e.g., LAPD, San Mateo, Orange County) could
      represent a material share of ARR. Concentration risk is unquantifiable
      from public sources alone.
    diligencePath: >-
      Request total active contract count, current ARR by contract, and the ARR
      share of the top-5 and top-10 customers. Confirm whether any single
      contract exceeds 10% of total ARR.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: burn-runway
    missingEvidence: >-
      Current monthly cash consumption, cash balance as of the most recent month-end,
      and forward-looking runway model.
    whyItMatters: >-
      With $190M raised in March 2025 and rapid hiring (428+ employees), burn is
      almost certainly material. Without this, capital adequacy is impossible to
      assess.
    diligencePath: >-
      Request current cash balance, trailing-12-month monthly cash consumption,
      and a base-case and downside runway model. Reconcile against Series C closing
      proceeds net of fees.
    relatedQuestionRefs:
    - QI016
    relatedTableRefs:
    - TI004
    - TI005
