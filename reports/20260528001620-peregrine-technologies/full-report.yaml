      - number: '1.4'
        title: Scale, milestones, and adverse signals
        blocks:
          - type: paragraph
            body: >-
              Peregrine's publicly traceable milestones span from its Bay Area roots to a national unicorn story
              punctuated by the first material civil liberties controversy. The founding period (2017-2019) centered on
              18 months of embedded work with the San Pablo Police Department, which produced both the product insights
              and the first real evidence of efficacy: a mid-2021 murder trial in which Peregrine's data synthesis
              helped secure a conviction accepted by a jury.


              Growth metrics are impressive but dependent on small-base compounding. Forbes reported that revenue
              tripled in 2023 from approximately $3 million to $10 million, and Noone projected another triple to $30
              million for 2024. If that trajectory held, the company would enter the Series C at roughly $30 million of
              ARR—consistent with third-party estimates placing 2025 ARR at approximately $40.9 million (unverified by
              the company). The agency footprint has grown from 'a handful of states' at mid-2023 to 40-plus agencies
              and 10+ states by May 2024, and then to the 80 million Americans / 40-plus agencies headline at the time
              of the Series C. Headcount grew sharply through 2025, reaching approximately 428 by late 2025 and 443 by
              March 2026 per third-party workforce analytics.


              The Super Bowl LIX deployment in New Orleans in February 2025 is the single highest-profile scale proof
              point. The New Orleans Police Department and the city's Office of Homeland Security and Emergency
              Preparedness used Peregrine to integrate crime databases, body-worn cameras, police location data, and
              suspicious activity reports across federal, state, and local safety agencies for a major national event.
              New Orleans Mayor's Office materials explicitly named Peregrine as a security platform for the event.


              The first significant adverse signal came in January-February 2026. The Durham, NC City Council held a
              work session on January 22 over a proposed $517,000 Peregrine contract for the Durham Police Department.
              Multiple council members announced intent to reject the contract, citing mass surveillance risks,
              algorithmic bias concerns, and Peregrine's Palantir lineage. Durham residents raised concerns about the
              company's 'safety flagging' tool—described in Peregrine's own FAQ as using crime rates and arrest records
              to predict crime hotspots—and about the potential for predictive policing to perpetuate racial bias. The
              Electronic Frontier Foundation has more broadly characterized companies like Peregrine as 'inherently
              going to have a hard time protecting privacy, because everything that they're built on is basically
              privacy damaging.' Peregrine has responded to these concerns by appointing Adam Klein as a civil liberties
              advisor and implementing contractual privacy protection clauses, but the Durham outcome illustrates that
              institutional pushback is a real operational risk, not merely theoretical.
