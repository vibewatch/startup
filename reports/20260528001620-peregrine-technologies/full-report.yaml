  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation
        blocks:
          - type: paragraph
            body: >-
              Peregrine Technologies serves a customer base concentrated in US law enforcement agencies, primarily
              municipal police departments and county sheriff's offices. The company's stated addressable market spans
              roughly 18,000 state, local, and tribal law enforcement agencies, with the most commercially active
              segment comprising mid-to-large departments that can support annual subscriptions of $180,000 or more. The
              firm has disclosed or been reported to have contracts spanning California (LAPD, OC Sheriff, Richmond PD,
              San Mateo multi-agency, Lathrop PD), Texas (Dallas PD), and Florida (Sarasota County Sheriff), with the
              California concentration reflecting both the founding geography and a receptive political environment in
              some counties. By March 2025, the company claimed coverage of 80 million Americans across 40-plus
              agencies, a metric that blends contract counts with population data rather than enumerating paying
              customers. Beyond law enforcement, Peregrine has begun marketing to fire departments, emergency management
              agencies, and parks and libraries, though no production deployments outside law enforcement have been
              publicly named. The dominant buyer profile is the police chief or sheriff working with a city council or
              county board for budget approval, typically via general fund appropriations or federal grants. Contract
              sizes range from roughly $32,000 per year for small rural departments to $2.8 million for large
              metropolitan forces, with an average of approximately $280,000 per year per CEO Noone's public statements.
