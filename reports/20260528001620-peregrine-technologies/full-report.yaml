      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Deep founder-market fit and embedded-first go-to-market
            body: >-
              Nick Noone's Palantir operational background—specifically leading U.S. SOCOM intelligence work—and 18
              months embedded with the San Pablo PD before writing a line of product code gives Peregrine a level of
              domain credibility and customer trust that is exceptionally hard to replicate. The approach produced a
              verifiable case outcome (murder conviction) and spread almost entirely through word of mouth within law
              enforcement. This embedded, mission-centric model is the company's core competitive moat and the primary
              reason it reached 57 contracts with little traditional marketing.
            calloutType: strength
            claimRefs:
              - CO004
              - CO013
              - CO015
              - CO017
              - CO037
          - type: callout
            title: Civil liberties and contract-rejection risk is real and growing
            body: >-
              The Durham NC council rejection and EFF characterization of Peregrine's model as 'inherently going to have
              a hard time protecting privacy' represent the leading indicator of a category-level headwind. The Palantir
              DNA critique—amplified by Noone's own public statements about team composition—makes it easier for
              opponents to frame Peregrine as military surveillance brought to local police. As more city councils apply
              procurement scrutiny, each public rejection creates a reputational chilling effect. Peregrine's civil
              liberties advisory (Adam Klein) and contractual privacy clauses are credible mitigants but not complete
              shields.
            calloutType: risk
            claimRefs:
