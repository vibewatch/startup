      - number: '5.3'
        title: Deployment, Integration, Reliability, and Roadmap
        blocks:
          - type: paragraph
            body: >-
              Peregrine deploys as a fully managed SaaS service; agencies access the platform via a web browser with no
              on-premises infrastructure requirement beyond the network connections feeding data to GovCloud. A
              dedicated deployment engineer is embedded with every customer, and integrations are configured without
              requiring new code or large migration teams. The San Mateo County contract (January 2026, $3.4M, 40-month
              term) illustrates standard scope: CAD, RMS, Axon Evidence.com, JMS, and Skydio DFR integration for 17
              participating agencies. The Los Angeles Police Department signed a $2.8M deal for Project Blue Light
              (organised retail crime) in 2024, demonstrating compatibility with large-agency deployments. AWS GovCloud
              provides the underlying uptime guarantee; no public status page exists but no outages have been publicly
              reported. The 2026 product roadmap includes expansion of the Emergency Operations module,
              Data-as-a-Service licensing for NGOs and critical infrastructure operators (targeting 300% ARR growth from
              non-police sectors in 24 months), international market entry into UK and Australia (Five Eyes markets with
              a claimed combined addressable opportunity exceeding $5B), and strategic partnerships with Deloitte and
              Accenture to shorten government sales cycles by approximately 25%. A $700M DOJ Ceiling ID/IQ contract
              (2024) provides a federal procurement vehicle. Roadmap cadence is branded by raptor names (Falcon,
              Griffon, Osprey, Harrier, Kestrel) and aligns with major AI and interoperability feature drops.
            claimRefs:
              - CE018
