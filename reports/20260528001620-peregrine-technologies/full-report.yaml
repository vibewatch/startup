              implementation and engineering. Implied ARR per employee is approximately $95,600 based on the September
              2025 figures—below typical software-only SaaS benchmarks but consistent with a GovTech platform that
              bundles implementation and professional services. Series C proceeds were earmarked specifically for
              engineers and implementation staff rather than new product development, confirming the
              implementation-intensive delivery model. FedRAMP High authorization in April 2026 opens the federal
              market. GetLatka's database erroneously describes Peregrine as "bootstrapped with no outside investment,"
              which is a data quality error directly contradicted by $220M+ in venture funding; underwriters should not
              rely on GetLatka's funding totals for Peregrine. All private SaaS metrics— gross margin, NRR, churn, CAC,
