              Progressive municipalities that rejected or paused Peregrine signal a ceiling on total addressable market
              in politically sensitive cities. Peregrine has not publicly announced any revenue or procurement reseller
              channel partnerships, making the sales model largely direct. FedRAMP High authorization opens a pathway to
