  - id: TR005
    title: Mitigation and Kill-Criteria Table
    columns:
      - Risk
      - Monitorable Trigger
      - Threshold / Event
      - Action Implication
    rows:
      - - Procurement rejection contagion
        - City / county council vote rejections per quarter
        - 3+ rejections in a single quarter, or rejection of a top-10 contract
        - Pause investment thesis; request win-rate data and pipeline by jurisdiction
      - - Regulatory / legal adverse precedent
        - Federal circuit or state supreme court ruling on RTCC warrantless searches
        - Any ruling requiring warrant for aggregated RTCC data access
        - Material contract restructuring required; model likely needs operational-use redesign
      - - Civil-rights litigation naming Peregrine
        - PACER filings; press coverage of lawsuits
        - Any federal or state lawsuit naming Peregrine as direct defendant
        - Thesis-break candidate; assess indemnification, insurance, and potential injunctive relief
      - - CJIS audit failure at major customer
        - CJIS audit findings published or disclosed by agency
        - Finding attributing non-compliance to Peregrine platform
        - Contract suspension risk across all CJIS-regulated deployments
      - - Key-person departure (Noone)
        - LinkedIn, press, SEC/EDGAR filings (if IPO-adjacent)
        - CEO or co-founder departure announcement
        - Pause new investment; reassess thesis based on replacement hire caliber
      - - Security incident / data breach
        - HaveIBeenPwned, breach disclosure databases, state AG breach notices
        - Any confirmed breach of CJI or personally identifiable law-enforcement data
        - Thesis-break; notify LP; assess civil and regulatory liability cascade
      - - Federal grant program defunding
        - DHS and SBOE budget announcements; continuing resolution coverage
        - 30%+ reduction in DHS/SBOE funding available for RTCC procurement
        - Downgrade growth forecast; increase win-rate required from organic municipal budgets
      - - AI regulation preemption of state bans
        - DOJ litigation against state AI laws; MIT Technology Review / Policing Project tracking
        - Federal court enjoining a state predictive-policing ban opens previously closed markets
        - Upside trigger — re-assess addressable market expansion opportunity
    notes: >
      Thresholds are illustrative investment-monitoring benchmarks, not contract terms. "Thesis-break" does not mean
      guaranteed loss; it means the original investment thesis requires material re-examination. Some triggers (CJIS
      failure, lawsuit) are also partial upside disqualifiers for IPO or M&A exit timelines.
