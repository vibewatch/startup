companyProfile:
  summary: >
    Peregrine Technologies is a San Francisco-based GovTech unicorn founded in 2018 by CEO Nick Noone (ex-Palantir, led
    US Special Operations Command engagement) and co-founder Ben Rudolph (Stanford CS, former UN Refugee Agency
    technologist). The company operates a cloud-native data fusion platform that integrates fragmented agency data —
    court records, arrest reports, body camera transcripts, license plate reader logs, and dispatch feeds — into a
    unified real-time intelligence interface. Forbes described the product in August 2024 as "essentially a
    super-powered Google for police data." Peregrine raised a $190M Series C in March 2025 led by Sequoia Capital at a
    $2.5B post-money valuation, the largest law enforcement tech raise since Dataminr's 2021 Series F. The company has
    been deployed at Super Bowl LIX (February 2025) and achieved FedRAMP High authorization in April 2026. Its Palantir
    lineage and predictive-analytics tools have drawn civil liberties scrutiny, with the Durham NC City Council
    unanimously rejecting a $517K contract in February 2026 citing data privacy concerns.
