  - id: FE001
    title: Peregrine Platform Architecture Stack
    type: stack
    layout: standard
    summary: >-
      Five-layer architecture from disparate agency data sources through the proprietary integration layer, AI
      analytics, operator applications, and AWS GovCloud security/compliance foundation.
    data:
      layers:
        - label: Data Sources (Agency-Owned)
          detail: >-
            CAD (Motorola, CentralSquare, Mark43, Tyler, Hexagon); RMS platforms; ALPR networks; bodycam feeds; Axon
            Evidence.com; Skydio DFR; Jail Management System (JMS); third-party sensors; 911/dispatch records
        - label: Data Integration Layer (Proprietary)
          detail: >-
            Vendor-agnostic ETL connectors; ML identity resolution; record linkage; deduplication preprocessing; no data
            migration required; handles structured and unstructured inputs
        - label: Analytics and AI Layer
          detail: >-
            Record deduplication AI; report summariser; safety-flag engine; Peregrine Vision video analytics (edge +
            cloud); OCR; audio transcription; Resource Optimizer (predictive demand, beta); geospatial correlation
        - label: Operator Application Layer
          detail: >-
            Unified search dashboard (Google-like query UX); cross-dataset timeline and relationship graph; geospatial
            visualisation; Emergency Ops module (incident, resource, messaging); collaboration and sharing tools
        - label: Security and Compliance Foundation (AWS GovCloud)
          detail: >-
            Amazon Redshift / RDS / EC2 / S3; FedRAMP High (April 2026); CJIS-compliant; HIPAA-compliant; encryption in
            transit and at rest; RBAC + SSO; comprehensive audit logging; no facial recognition
    approximationNotes: >-
