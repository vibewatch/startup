  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing
        blocks:
          - type: paragraph
            body: >-
              Peregrine sells an annual SaaS subscription to government and public safety agencies. The contract model
              is all-user-access rather than per-seat: a flat annual license fee gives the entire agency unlimited
              access to the platform plus a defined integration and training package. Filed contracts confirm the
              mechanism. Lathrop, CA signed a five-year agreement at $110,000 per year including unlimited users and all
              standard integrations. LAPD's Project Blue Light contract totals $2,793,750 over approximately 42 months
              (October 2023 through May 2027), implying a ~$796,000 annualized rate for a large department. San Mateo
              County's 40-month agreement covers 18 agencies at up to $3.4M total (~$1.02M per year), further confirming
              that multi-agency arrangements drive materially larger TCV. CEO Nick Noone told Forbes in August 2024 that
              the average contract value was approximately $280,000 per year, with the smallest contracts around $32,000
              per year and the largest (Orange County Sheriff) at $900,000. Pricing scales with jurisdiction size rather
              than user count, which creates a predictable renewal structure once an agency is live. There is no
              disclosed list price: all contracts are negotiated through a government procurement vehicle (often a
              cooperative purchasing agreement or direct bid), which is standard for public safety software.
              Implementation fees and integration costs are typically included in the contract rather than billed
              separately, based on the filed contract language reviewed.
            claimRefs:
