  productSummary: >
    Peregrine sells an annual SaaS subscription (all-user-access flat fee per agency) to government and public safety
    agencies. The platform ingests, deduplicates, and indexes all connected agency data — CAD, RMS, body cameras, LPR
    logs, court records, suspicious activity reports — and exposes it through a web-based query interface. Officers
    enter a name, address, or case number to surface cross-system matches in real time. AI modules support safety
    flagging, predictive hotspot analysis, and case summarization. Average contract value is approximately $280,000/year
    (CEO-stated), ranging from $32,000/year for small rural departments to $2.8M for the LAPD. Multi-agency arrangements
    (e.g., San Mateo County: 18 agencies, ~$1.02M/year) drive higher TCV. FedRAMP High authorization (April 2026) opens
    federal agency procurement.
  customerFocus: >
