      - number: '8.2'
        title: Valuation Context — March 2025 Series C and Entry Discipline
        blocks:
          - type: paragraph
            body: >
              Peregrine closed a $190M Series C in March 2025 led by Sequoia Capital at a $2.5B post-money valuation.
              Participating investors included Goldcrest Capital, Friends & Family Capital, Fifth Down Capital, OG
              Venture Partners, and Godfrey Capital. Total disclosed funding since founding is approximately $253M,
              suggesting earlier rounds totalled roughly $63M before the Series C. The company's CEO Nick Noone cited
              plans to use the proceeds to accelerate software-engineer and implementation-staff hiring, with expansion
              into government and commercial sectors.

              At $40.9M ARR and a $2.5B valuation, the implied ARR multiple is approximately 61x. For context, at the
              same time, Tyler Technologies — the leading public-company govtech SaaS provider — traded at approximately
              10.7x trailing price-to-sales (April 2025: $23.2B market cap on ~$2.14B 2024 revenue). Axon Enterprise,
              the closest high-growth public-safety SaaS analogue, traded at approximately 15-16x revenue (early 2025)
              and carried a $1.3B ARR base growing at ~40% annually. The Peregrine premium over both reflects
              venture-stage optionality pricing: investors are paying for the probability of continued 3x compounding,
              not for current-year economics.

              Entry discipline requires explicit acknowledgment that the implied multiple is pricing in approximately
              three additional years of >3x growth before the ARR reaches a level ($300-500M) at which a 10-15x exit
              multiple could return 2-3x on the $2.5B post-money. Any round entered at this or a higher valuation
              without evidence of sustained hyper-growth, improving unit economics, and government- procurement pipeline
              diversification carries substantial mark-down risk. Preference-stack overhang from $253M cumulative
              funding implies meaningful preference seniority over common equity in a downside scenario.
