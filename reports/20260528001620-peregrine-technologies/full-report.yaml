      - number: '5.2'
        title: Module Map and Technical Architecture
        blocks:
          - type: paragraph
            body: >-
              Peregrine's platform is composed of four primary layers. The Data Sources Layer ingests structured and
              unstructured feeds from CAD (Motorola, CentralSquare, Mark43, Tyler, Hexagon), RMS platforms, ALPR
              networks, body-worn camera systems, Axon Evidence.com digital-evidence vaults, Skydio
              drone-as-first-responder (DFR) feeds, jail management systems (JMS), and third-party sensors. The
              proprietary Data Integration Layer normalises these heterogeneous inputs using machine-learning identity
              resolution and vendor-agnostic adapters without requiring full data migration. This layer is claimed to
              support virtually any structured or unstructured source. The Analytics and AI Layer runs record
              deduplication, report summarisation, safety-flag generation, OCR, and audio transcription; the "Peregrine
              Vision" AI video analytics suite (launched 2024) is claimed to reduce evidence-review time by
              approximately 80%. An Emergency Operations Module targets disaster-response use cases (incident
              visualisation, resource allocation, interagency messaging), and a Resource Optimizer tool (beta) forecasts
              demand spikes with approximately 92% accuracy. The Presentation Layer delivers a unified operator
              dashboard with geospatial visualisation, cross-dataset search, and collaboration tools. All layers run on
              AWS GovCloud using Amazon Redshift, RDS, EC2, and S3. The architecture supports multi-tenant agency
              isolation with permission-based data segregation and a microservices design enabling elastic scaling
              without per-customer infrastructure provisioning.
            claimRefs:
