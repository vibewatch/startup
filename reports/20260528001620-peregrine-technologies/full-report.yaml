              Peregrine's go-to-market motion is almost entirely direct and inbound-heavy within the government sector.
              Sales cycles are governed by public procurement rules, which can extend from a few months for a pilot to
              12-plus months for a full competitive bid. The company benefits from cooperative purchasing vehicles
              (e.g., Sourcewell, NASPO) that allow agencies to piggyback on pre-negotiated contracts, reducing the
              formal procurement timeline. Multi-agency arrangements like San Mateo County (18 agencies on a single
              contract) demonstrate that one sale can yield disproportionate ARR. Headcount data from Revelio Labs and
              Unify GTM shows hiring focused heavily on implementation and customer-success roles, consistent with a
              land-and-expand model in which successful deployments generate word-of-mouth within the public safety
              community. No public CAC, sales-cycle length, pipeline conversion rate, or quota attainment data exists.
              The company's 57 contracts as of August 2024 at an average $280K ACV implies total implied ARR of roughly
              $15.9M at that point, broadly consistent with the Forbes-reported ~$30M trajectory for full-year 2024 as
              some contracts would have been signed later in the year at larger ACVs.
