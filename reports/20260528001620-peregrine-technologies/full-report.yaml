      - number: '7.4'
        title: Financial, Capital, and Model Risk
        blocks:
          - type: paragraph
            body: >
              Peregrine raised $190 million in its Series C in March 2025, led by Sequoia Capital, at a $2.5 billion
              valuation, bringing total capital raised to over $252 million. The company has committed to using the
              proceeds for aggressive hiring of software engineers and implementation staff, product development, and
              market expansion. No public burn-rate figures exist, but a $190 million raise deployed over 18-24 months
              against a $10-30 million revenue base implies a high cash-consumption phase. The valuation implies a
              revenue multiple of approximately 80-250x current run rate, requiring years of triple-digit growth to
              justify — a threshold that is vulnerable to even modest procurement headwinds.

              Government contract revenue is lumpy and subject to annual budget cycles, continuing resolutions, and
              procurement timelines that extend 6-18 months. Local government IT budgets are exposed to economic
              downturns, state funding cuts, and changes in political priorities. Federal funding programs — such as
              Florida's State Board of Immigration Enforcement grants and Homeland Security technology grants that
              subsidize RTCC deployments — can be redirected or discontinued by a change in administration or
              legislative priorities, cutting off a meaningful acquisition channel. If civil-liberties opposition
              hardens across multiple jurisdictions simultaneously, win rates could fall faster than the team can
              compensate with new market entry.

              The financial model depends on annual SaaS-style contract renewals in a sector where Peregrine competes
              with Axon's expanding AI and evidence-management platform, Motorola Solutions' acquisitive build-out, and
              Flock Safety's rapid expansion. Incumbents with larger balance sheets, existing hardware relationships,
              and established government sales teams can undercut Peregrine on price or bundle equivalent functionality
              into existing contracts. Margin compression is a material risk as the competitive landscape consolidates.
            claimRefs:
              - CR026
              - CR027
              - CR028
              - CR029
              - CR030
      - number: '7.5'
        title: People, Key-Person, and Execution Risk
        blocks:
          - type: paragraph
            body: >
              CEO Nick Noone is the face of Peregrine and the architect of its relationships with law enforcement. His
              Palantir background shapes the company's technical philosophy, its government-sales playbook, and its
              civil-liberties credibility strategy — he has stated that Palantir's DNA is "strong in Peregrine" and that
              roughly a quarter of the team are Palantir alumni. His personal credibility is a selling point in agency
              boardrooms but simultaneously the most cited liability at public hearings. Noone's departure or
              reputational damage would remove the primary sales and mission asset simultaneously.

              Co-founder Ben Rudolph's role and succession plans are not publicly documented. Peregrine has brought in
              Adam Klein, former chairman of the Privacy and Civil Liberties Oversight Board (PCLOB), as a consultant to
              design its civil-liberties architecture, which mitigates some governance risk, but an advisory role is not
              equivalent to board-level accountability or a permanent CISO or privacy-officer function. The company's
              rapid hiring post-Series C introduces integration risk: onboarding large cohorts of engineers and
              implementation staff while maintaining CJIS-compliant security practices and consistent data governance is
              operationally demanding.

              Execution risk is heightened by the ambition to expand beyond law enforcement into healthcare, logistics,
              and financial services — verticals requiring different regulatory knowledge, sales cycles, and product
              adaptations. Spreading the platform roadmap across multiple regulatory regimes simultaneously while
              competing with purpose-built players in each vertical is a common cause of late-stage startup focus
              failures.
