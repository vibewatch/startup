  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              Peregrine Technologies offers a real-time intelligence center (RTIC) platform purpose-built for public
              safety agencies. In the customer workflow, officers and investigators previously toggled between siloed
              legacy systems—a Computer-Aided Dispatch (CAD) tool, a Record Management System (RMS), an ALPR database,
              separate bodycam footage portals, and paper records—spending hours or weeks correlating data across
              systems before acting on it. Peregrine replaces this fragmented landscape by pulling every authorised data
              source into a single, browser-based, searchable application hosted on AWS GovCloud. An investigator enters
              a name, address, or plate number and receives integrated results spanning court records, arrest reports,
              field interviews, license-plate sightings, bodycam transcript snippets, and any other connected dataset
              within seconds. The platform also supports grant-reporting workflows (as demonstrated by Newark PD's
              transition from hours to minutes on STEP grant filings), disaster-response coordination (New Orleans Super
              Bowl LIX deployment), and behavioral-health co-response (180% utilisation increase in one California
              city). Peregrine is fully interoperable and vendor-agnostic, requiring no data migration; a dedicated
              deployment engineer is embedded with every customer to configure integrations. The company serves 90+
              million people through hundreds of agencies in 23 US states and two countries as of early 2026.
            claimRefs:
              - CE001
              - CE002
              - CE015
              - CE016
              - CE017
              - CE041
