      - number: '3.4'
        title: Switching costs, integration lock-in, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Peregrine's most defensible position is the complexity of its 200+ data-feed integration library:
              migrating those connections to a competitor requires rebuilding API tokens, data-normalization logic, and
              agency-specific alerting rules that represent months of configuration work. FedRAMP High authorization
              adds a second structural barrier for federal and intelligence-community buyers, because competitors must
              independently achieve the same certification to be considered for those procurements. However, these moats
              are conditional. Axon Fusus approaches the same integration depth via its body-camera installed base and
              hardware ecosystem rather than software-first integration, giving agencies a different but equally sticky
              path to consolidation. Motorola and Tyler both control the upstream CAD and dispatch systems that
              Peregrine reads from, meaning either vendor can embed a lightweight analytics layer at contract renewal
              without Peregrine having the ability to block the integration. The 30% estimated RTCC market share cited
              by Contrary Research suggests first-mover advantage, but first-mover advantages in GovTech erode quickly
              once a well-funded competitor reaches comparable agency counts. Flock Safety's trajectory from zero to
              $300M ARR in approximately five years demonstrates how fast a newer entrant can accumulate agency
              relationships in adjacent segments, and Flock's camera footprint is already inside many of the same
              agencies Peregrine serves. Orange County's AWS-based deployment illustrates the cloud-native integration
              depth Peregrine can offer, but also shows that the underlying infrastructure is replicable by any
              cloud-native competitor with equivalent API investment.
