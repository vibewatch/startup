      - number: '8.5'
        title: Exit Readiness and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >
              Exit pathway analysis suggests three primary routes: (1) strategic acquisition by Axon, Motorola
              Solutions, or a large defense/intelligence contractor (likely $2-4B range if growth decelerates); (2) IPO
              in a favorable govtech window, requiring ARR above ~$150-200M and demonstrated operating leverage; (3)
              secondary-market sale at a discount to primary marks, as observed with Dataminr and other late-stage
              govtech unicorns. The Peregrine platform's deep data-integration architecture creates genuine strategic
              value for Axon, which explicitly identifies the records management and real-time-operations space as
              competitive in its 10-K (FY 2025). However, Axon's organic investment in Axon Records and Axon Fusus
              reduces urgency for an acquisition.

              The most critical unresolved diligence gaps are: (1) ARR composition and revenue quality (SaaS vs.
              professional services vs. one-time integration fees); (2) net revenue retention and churn by agency
              cohort; (3) gross margin and unit economics (CAC, payback, LTV) by segment; (4) customer concentration
              risk (top-10 agencies as a share of ARR); (5) government contract structure (multi- year committed vs.
              annual at-risk); (6) path to cash-flow breakeven given $253M cumulative burn; and (7) civil-liberties
              compliance posture and exposure to state/local legislation restricting predictive-policing or data-sharing
              tools.

              Until these gaps are closed, the appropriate stance is conditional track: monitor subsequent financing
              events and growth-rate confirmation, but do not chase the current $2.5B mark without a materially
              better-evidenced thesis. A disciplined entry would require either a valuation step-down to 15-20x
              forward-year ARR (approximately $500-750M if ARR reaches $40-50M by mid-2026) or clear
              third-party-verified evidence of continued >2x growth for a second consecutive year post-Series C.
            claimRefs:
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
          - type: table
            tableRef: TV006
            claimRefs:
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Conditional Track — Overpriced at 61x ARR Without Unit-Economics Evidence
            body: >
              At $2.5B post-money on $40.9M ARR, Peregrine Technologies is priced for sustained 3x annual compounding
              through fiscal 2027 or beyond. The concurrent Flock Safety round ($7.5B at $300M ARR = 25x) anchors a
              market ceiling for high-growth public-safety SaaS at less than half Peregrine's implied multiple. Public
              comps (Axon at 11x revenue; Tyler at 5-11x revenue) further confirm the premium. The Dataminr secondary
              implosion (−80% from Series F peak) is the most instructive adverse analog. Recommend CONDITIONAL TRACK:
              do not initiate or increase at current mark; re-evaluate at the next financing event with ARR audit and
              NRR confirmation in hand.
            calloutType: recommendation
            claimRefs:
              - CV011
              - CV015
              - CV023
              - CV026
              - CV035
          - type: callout
            title: Govtech Multiple Compression Risk — Dataminr Is the Floor Case
            body: >
              Dataminr's secondary-market implied valuation fell from $4.1B (March 2021 Series F) to approximately $832M
              (September 2025) — a 79% decline — despite reporting ~$200M in ARR and a multi-year DoD contract. The
              structural causes are common to Peregrine: government-buyer dependency, civil-liberties controversy, and a
              primary-round valuation priced for hypergrowth that did not materialize at the pace required. Investors in
              Peregrine at the $2.5B mark must explicitly model this scenario in their base case.
            calloutType: risk
            claimRefs:
              - CV023
              - CV026
              - CV033
              - CV034
          - type: callout
            title: Flock Safety at 25x ARR Is the Comparable Floor for Concurrent Pricing
            body: >
              Flock Safety, a direct public-safety software peer with a concurrent March 2025 financing event, raised at
              $7.5B on $300M ARR = 25x — substantially below Peregrine's implied 61x. Flock carries a larger and more
              diversified ARR base, a top-tier institutional syndicate (a16z, Greenoaks, Founders Fund), and a 70% YoY
              growth rate. That concurrent deal sets the observable market clearing price for high-quality public-safety
              SaaS in the same month as Peregrine's Series C; Peregrine's 61x appears to price in materially more
              optionality and early-stage risk premium than the market was awarding to more-scaled comps.
            calloutType: insight
            claimRefs:
              - CV024
              - CV025
              - CV015
              - CV022
