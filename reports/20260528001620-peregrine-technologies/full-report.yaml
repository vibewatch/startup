          - type: callout
            title: Regional Consortium Model Creates Durable Network Effects
            body: >-
              San Mateo County's 16-agency consortium model demonstrates that a single county-level sale can onboard an
              entire regional law enforcement ecosystem simultaneously, reducing per-unit customer acquisition cost
              while increasing platform switching costs through cross-agency data dependencies. When 16 departments
              share data on the same platform, NRR at renewal should structurally exceed 100%. Peregrine should be asked
              whether other regional consortium deals are in the pipeline, as this model is the company's most
              defensible and highest- leverage growth vector, capable of compressing the 18,000-agency TAM into a
              manageable number of county-level deals.
