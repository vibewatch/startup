        - How many federal RFPs has Peregrine participated in post-FedRAMP? What is federal pipeline?
      - - AI/ML adoption mandate in public safety
        - Driver
        - 2025–2027 horizon
        - >-
          City and state technology modernization mandates and police reform data-accountability requirements increase
          demand for analytics
        - Is demand driven by compliance mandates (court consent decrees, police reform) or discretionary?
      - - Incumbent public-safety SaaS growth (Axon +33%, Motorola +8%)
        - Driver (market validation)
