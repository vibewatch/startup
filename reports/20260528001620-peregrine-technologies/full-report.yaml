      - number: '1.2'
        title: Founders, leadership, and governance
        blocks:
          - type: paragraph
            body: >-
              Peregrine is founder-led. Nick Noone serves as co-founder and CEO and is the company's primary public
              face. Before founding Peregrine, Noone spent years at Palantir Technologies, where he led the company's
              work with U.S. Special Operations Command and spearheaded a 2014 military operation to identify ISIS
              members in Syria. That Palantir background is simultaneously Peregrine's greatest founder-market fit
              credential and its most contentious public relations asset: Noone himself has acknowledged that Palantir
              alumni comprise approximately one quarter of the Peregrine team and that 'Palantir's DNA is strong in
              Peregrine.' Noone was approximately 35 years old at the time of the Forbes 2024 interview, suggesting he
              founded the company in his late twenties, consistent with the 2017/2018 founding year.


              Co-founder Ben Rudolph brings a complementary background: Stanford Computer Science, work as a
              technologist for the UN Refugee Agency, and earlier stints at Dimagi. Together, the two co-founders share
              deep technical and mission-driven credentials that resonate within public sector buyers. The broader
              executive bench is less fully disclosed in public sources; third-party profiles surface Rob Wheeler in a
              growth and customer advocacy role, Jeff Harper as Chief People Officer, and Ashley Chandler as Chief
              Marketing Officer. Adam Klein, former chairman of the U.S. Privacy and Civil Liberties Oversight Board,
              serves as a formal advisor specifically on privacy architecture—a notable credential given that the
              company's core civil liberties vulnerability is the potential for misuse of its data aggregation
              capabilities.


              One key governance gap is that Peregrine's board composition is not publicly disclosed. The Sequoia-led
              Series C almost certainly brought a board seat, and prior rounds from Friends & Family Capital and
              Goldcrest Capital likely carry governance rights, but no filing or official page confirms the current
              board structure. That opacity is common for Series C private companies but matters for investors
              evaluating concentration risk around Noone and Rudolph.
