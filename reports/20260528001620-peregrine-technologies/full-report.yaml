      - number: '2.2'
        title: Market Sizing — TAM, SAM, SOM and Multiple Analyst Lenses
        blocks:
          - type: paragraph
            body: >
              Global law enforcement software market estimates for 2026 vary by 2–3x depending on which spend categories
              analysts include. Mordor Intelligence sizes the law enforcement software market at a range consistent with
              $7–10B globally in 2026 and projects strong CAGR through 2031. Precedence Research's 2026 estimate implies
              approximately $18–19B globally for the full law enforcement software category, growing to $50.32B by 2035
              at roughly 11% CAGR. A Technavio/Yahoo Finance analysis projects $9.4B in incremental market growth
              2026–2030. Fact.MR estimates the public safety software market (narrower than all law enforcement) at
              $13.6B in 2026 with a 9.1% CAGR. Coherent Market Insights and Mordor Intelligence converge on a public
              safety analytics sub-market of $14.6–16.9B in 2026, growing at 13–20% CAGR.

              The predictive policing sub-segment is bounded: Research and Markets forecasts $2.82B globally in 2026,
              growing at 12.6% CAGR through 2032. Business Research Company's AI-in-predictive-policing estimate is
              $5.77B for 2025, growing at 49.7% CAGR to a potentially very large number by 2030—a figure that depends on
              a very broad definition capturing all AI-enabled public-safety decision support.

              The most relevant sizing lens for Peregrine is the US serviceable market for data analytics and
              intelligence platforms serving state and local law enforcement. GovTech and Gartner data indicate that
              justice and public safety accounts for approximately $15B of the $160.2B US state-and-local government IT
              budget in 2026. If analytics platforms represent 10–25% of that public-safety IT slice—a reasonable
              estimate given the broad technology stack—the US public-safety analytics TAM sits at $1.5–3.8B.
              Peregrine's SAM narrows this further to agencies that have sufficient scale and mandate to adopt
              multi-source data integration (roughly 500–3,000 of the ~18,000 US law enforcement agencies), yielding an
              estimated SAM of $1–3B in annualized software spend.

              Peregrine's current SOM cannot be precisely derived from public disclosures. With 40+ agencies covered,
              revenue tripling annually, and contracts ranging from $517K (Durham) to $3.4M (San Mateo), implied
              cumulative ARR is in the tens of millions of dollars—consistent with a SOM capture rate well below 5% of
              even conservative SAM estimates, indicating ample runway. Analyst estimates diverge substantially and
              present a diligence risk; a single broadly stated TAM ($13.6–19B) should not be used without the boundary
              analysis above.
