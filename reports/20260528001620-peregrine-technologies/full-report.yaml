            body: >-
              Motorola Solutions is the dominant public safety infrastructure incumbent. Its Q1 2026 revenue of $2.717
              billion grew 7% year-over-year, with software and services expanding 18% year-over-year, and its
              CommandCentral platform integrates CAD, records, and video intelligence across over 100,000 agencies
              globally. Motorola's leverage over Peregrine is substrate control: in any agency where Motorola runs CAD,
              Motorola can offer an integrated analytics layer without requiring a new procurement event. Tyler
              Technologies operates the same playbook on the records management side, generating approximately $2.1
              billion in annual revenue from legacy CAD, RMS, and court-management systems that are deeply embedded in
              municipal IT budgets. Tyler's switching costs are high because its platforms manage core criminal-justice
              workflows, not just visualization. Mark43's cloud-native RMS/CAD platform now serves 300+ agencies and
              raised a Series G in October 2025; it targets the same modernization buyers Peregrine courts, and could
              bundle basic situational-awareness features at contract renewal as its platform matures. Palantir Gotham
              and NICE Investigate define the high end of the market—large federal agencies and intelligence communities
              that expect full-spectrum data fusion beyond public-safety feeds alone. NICE Investigate covers 5 million
              police investigations globally and has a dominant UK/Europe presence that shapes the comparative baseline
              international buyers use. Palantir faces its own civil liberties scrutiny from mass-surveillance mapping
              research, but its federal relationships and ATO track record create procurement pathways that Peregrine's
              FedRAMP High authorization is specifically designed to match. With FY2025 revenue exceeding $2.8 billion,
