      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >
              Public-safety analytics procurement involves three distinct role types: the buyer (agency leadership,
              city/county administrator, or IT procurement office), the user (patrol officers, detectives, crime
              analysts, emergency coordinators), and the payer (city/county general fund, state appropriations, or
              federal grants). These roles rarely coincide: a city council or county board votes to approve the
              contract, the police chief or sheriff advocates for the technology, the analyst or officer uses it daily,
              and the budget may be partially funded by a Byrne JAG or COPS grant that the city applied for.

              The primary segments by agency type are: (1) municipal police departments in cities with 50,000+
              residents, where dedicated crime analysts and RTCC operations exist; (2) county sheriffs serving
              unincorporated jurisdictions with complex multi-agency intelligence sharing needs; (3) state law
              enforcement agencies (state police, state bureaus of investigation) with broad geographic coverage; (4)
              federal agencies (FBI, DHS components, DEA) where FedRAMP High authorization is a procurement
              prerequisite; and (5) emergency management and fusion centers that coordinate across law enforcement,
              fire, EMS, and homeland security.

              Budget ownership sits with elected or appointed officials (mayor, city manager, county executive) who
              receive recommendations from the police chief or sheriff. The practical adoption trigger is typically a
              high-profile crime event, a mandate from city leadership for data-driven policing, or availability of
              federal grant funding that offsets capital costs. Contract values range from $200K–$500K for small-to-mid
              agencies to $2M–$5M for large multi-jurisdictional deployments.

              Federal grant programs—particularly Byrne Justice Assistance Grants (JAG), Community Oriented Policing
              Services (COPS) technology grants, and NG-911 implementation funds—are a material demand accelerator. A
              significant share of RTCC deployments have been funded at least partly through federal grants, reducing
              the upfront capital barrier for smaller municipalities. This creates a procurement dynamic where federal
              grant cycles (annual appropriations, application periods) can accelerate or delay contract timelines
              independent of agency willingness.
