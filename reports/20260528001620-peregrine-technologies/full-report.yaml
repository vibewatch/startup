  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: >-
          Competitive landscape: direct RTCC peers, hardware adjacents, platform incumbents, and civil liberties
          headwinds
        blocks:
          - type: paragraph
            body: >-
              Peregrine competes across five overlapping categories rather than a simple two-vendor market. The closest
              direct peers are Axon's Fusus RTCC platform—acquired in 2024—and Flock Safety, both of which now serve
              thousands of agencies. Hardware-tethered adjacents including SoundThinking/ShotSpotter extend
              single-sensor surveillance networks and increasingly bundle analytics. Incumbent platform vendors—Motorola
              Solutions' CommandCentral, Tyler Technologies' legacy CAD/RMS stack, and Mark43's cloud-native records
              system—own the dispatch and records substrate that Peregrine's RTCC must integrate with, giving them
              cross-sell leverage at contract renewal. Federal intelligence platforms such as Palantir Gotham and NICE
              Investigate define the upper bound of what large-agency and intelligence-community buyers expect.
              Status-quo substitutes range from siloed video walls to manual watch-commander workflows. Each category
              creates distinct pressure: direct peers challenge Peregrine on feature breadth and agency scale;
              incumbents can bundle RTCC as a low-cost add-on; and civic-trust concerns—already surfacing as contract
              cancellations in Durham and as a pause in Charlottesville—can stop procurement regardless of technical
              merit. Contrary Research estimates Peregrine has captured approximately 30% of the RTCC market based on
              its deployment count, and the segment is projected to grow at over 18% CAGR to $4.9B by 2030.
              Purpose-built RTCC architecture and FedRAMP High authorization remain genuine differentiators in federal
              and intelligence-community procurement, where most competitors lack equivalent authorization.
