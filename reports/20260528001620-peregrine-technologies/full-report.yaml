        title: Exhibits
        blocks:
          - type: callout
            title: FedRAMP High Authorization Creates Hard Compliance Barrier
            body: >-
              Achieving FedRAMP High in April 2026 positions Peregrine to serve the most security-sensitive federal and
              state agency contracts. This certification took years of investment and ongoing continuous monitoring
              obligations that most smaller competitors cannot sustain, providing a durable regulatory moat that
              reinforces Peregrine's first-mover advantage in the RTIC market.
            calloutType: strength
            claimRefs:
              - CE004
              - CE020
          - type: callout
            title: Civil Liberties Opposition Is a Recurring Commercial Risk
            body: >-
              Durham, NC's city council scrapped a $517K contract with Peregrine in February 2026, and Charlottesville,
              VA's police department paused use in June 2025. The EFF, ACLU, and Brennan Center have all flagged
              predictive policing and surveillance-aggregation risks. In politically engaged municipalities this pattern
              could repeat, creating revenue drag, reputational risk, and potential procurement conditions (e.g.,
              mandatory community advisory boards) that raise per-deal complexity and cost.
            calloutType: risk
            claimRefs:
              - CE028
              - CE029
              - CE032
              - CE033
          - type: callout
            title: Developer Surface Is Intentionally Closed; No Public API or Open-Source Signal
            body: >-
              Peregrine's GitHub organisation (Peregrine-Tech) has no public repositories and no listed public members.
              There is no publicly documented API, SDK, or developer portal. This is consistent with its government SaaS
              model—integrations are handled through proprietary connectors and embedded engineers, not self-serve
              developer tooling. The closed surface reduces competitive exposure but also limits ecosystem network
              effects and makes technical due diligence on architecture quality harder for investors.
            calloutType: insight
            claimRefs:
