              The $2.5 billion Series C valuation rests on revenue-tripling claims and a 7× step-up from the Series B
              benchmark in under a year, but ARR, gross margin, net revenue retention, and contract churn are entirely
              unconfirmed by the company. Third-party estimates ($40.9M ARR) imply a roughly 61× ARR multiple—defensible
              in a high-growth enterprise SaaS market but sensitive to any deceleration. Investors and diligence teams
              should require audited financials, customer retention data, and full-contract-unit-economics before
              anchoring on the unicorn valuation.
