  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Revenue growth deceleration
        - Annual ARR growth falls below 1.5x (50% annualized) for two consecutive reporting periods
        - >-
          Eliminates the growth-premium justification for 61x ARR; implies base/bear valuation scenario; comparable
          Dataminr trajectory
        - Move to SELL or EXIT; do not add exposure; flag for cap-table review
      - - Government budget freeze or procurement hold
        - >-
          Federal or state government announces IT spending freeze that includes public-safety software; agency
          non-renewals exceed 10% of ARR
        - Directly threatens recurring revenue base; reduces pipeline visibility; compresses exit multiples
        - Downgrade thesis; monitor quarterly bookings closely; assess contract commitment structure
      - - Civil-liberties regulatory action
        - >-
          State or federal legislation restricts predictive-policing, data-fusion, or inter-agency sharing tools
          consistent with Peregrine's core product in 2+ major states
        - Directly constrains addressable market; may require product re-architecture; increases compliance cost
        - Escalate to blocking diligence issue; require legal opinion and product roadmap response
      - - New-round valuation materially below $2.5B
        - Series D or bridge round priced below $2.0B post-money
        - Confirms market consensus that the March 2025 mark was peak-cycle; sets adverse precedent for secondary exits
        - Reassess all positions; treat as down-round signal
      - - NRR confirmed below 100%
        - Independent data or audited financials show net revenue retention below 100% for 2 consecutive periods
        - Revenue-base erosion destroys compounding thesis; structural growth constraint regardless of new-logo velocity
        - Block upgrade from TRACK; mark as fundamental negative signal
    notes: >-
      Trigger thresholds are indicative and should be confirmed with company management; they are based on structural
      diligence logic, not legally binding covenants.
    claimRefs:
      - CV029
      - CV030
      - CV031
      - CV032
      - CV033
      - CV034
      - CV035
      - CV038
  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - ARR quality and composition
        - >-
          Breakdown of ARR by SaaS subscription vs. professional services vs. one-time integration; revenue recognition
          policy; non-cancelable contract share
        - >-
          GetLatka/Growjo ARR of $40.9M is unaudited estimate; composition determines revenue quality and multiple
          appropriateness
        - >-
          Request audited or management-reviewed ARR schedule from CFO; cross-reference with customer contract
          disclosures
      - - Net revenue retention and cohort analysis
        - NRR by agency cohort and vintage; gross churn rate; expansion revenue by customer tier
        - >-
          Without NRR >100%, the 3x growth story requires constant new-logo acquisition, increasing CAC and reducing
          margin durability
        - Request cohort waterfall from finance team; minimum 3 cohort years
      - - Unit economics
        - >-
          CAC by channel, payback period, LTV:CAC ratio; gross margin by product line; EBITDA or contribution margin at
          current scale
        - At $253M cumulative funding, path to breakeven is critical for exit readiness; no public evidence available
        - >-
          Require management accounts or data-room access; benchmark against Axon (59.7% gross margin) and Tyler (46%
          gross margin)
      - - Customer concentration
        - Top-10 agency ARR as % of total; any single agency >10% of ARR; contract term by size tier
        - >-
          Government customer concentration amplifies non-renewal risk; analogous to Axon's explicit 10-K disclosure
          that no customer exceeds 10% of revenue
        - Request ARR heatmap by agency; compare to Axon's contractual diversification posture
      - - Government contract structure
        - >-
          Multi-year committed ARR vs. annually renewable; whether contracts include termination-for-convenience clauses
          common in government procurement
        - >-
          Government contracts often include T4C clauses that undermine ARR durability; determines effective stickiness
          of revenue base
        - Legal review of representative contracts; specific focus on T4C language and renewal rate
      - - Civil-liberties compliance and legislative exposure
        - >-
          Status of any pending or threatened civil-liberties legislation in top-5 states by ARR; privacy audit results;
          ACLU or EFF engagement
        - >-
          Flock Safety protest escalation and Dataminr BLM controversy show that political backlash can materially harm
          public-safety SaaS adoption and valuation
        - >-
          Commission independent civil-liberties legal review; request state-by-state legislative risk assessment from
          company counsel
    notes: >-
      Diligence asks are ranked in approximate priority order. Items 1-3 are minimum for any investment decision; items
      4-6 are material but may be partially addressable through management representations.
    claimRefs:
      - CV036
      - CV037
      - CV038
      - CV039
      - CV040
