            title: Durham and Charlottesville Signal Political Procurement Risk
            body: >-
              The February 2026 rejection by Durham's City Council (4–3) and the June 2025 pause by Charlottesville PD
              expose a pattern of civil-liberties and immigration-enforcement-related procurement risk. In Durham,
              community advocates and council members cited data privacy and equity concerns; in Charlottesville, the
              trigger was 287(g) immigration enforcement. Both situations arose from organized advocacy campaigns rather
              than product performance failures. This risk is concentrated in progressive municipalities and is
              difficult to mitigate through product improvement alone, representing a structural addressable-market
              constraint that investors should model into pipeline conversion assumptions.
