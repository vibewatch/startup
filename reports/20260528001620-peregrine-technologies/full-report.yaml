  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: >
              Peregrine Technologies operates in the public-safety data analytics and intelligence platform segment—a
              defined sub-set of the broader law enforcement software market. The relevant included spend encompasses
              data integration middleware, AI-powered crime analytics, real-time operational dashboards, interagency
              intelligence sharing platforms, and decision-support software sold to or deployed by municipal police
              departments, county sheriffs, state law enforcement agencies, and emergency-management agencies. This
              category is distinct from adjacent spend that Peregrine does not meaningfully compete in: computer-aided
              dispatch (CAD) systems, records management systems (RMS), body-camera hardware and cloud storage,
              gunshot-detection hardware, license-plate reader networks, and public-safety construction.

              The market boundary matters because many analyst reports aggregate all "law enforcement software" or
              "public safety software" into a single market, producing estimates that range from $13.6B (Fact.MR,
              software-only) to $19B (Precedence Research, including all digital systems supporting policing). The most
              directly comparable sub-market—predictive policing and analytics platforms—is estimated at $2.82B globally
              in 2026 (Research and Markets), while AI-driven predictive policing including broader AI/ML tools is
              estimated at $5.77B in 2025 growing at 49.7% CAGR (Business Research Company). Peregrine's defined wedge
              is the data-unification and AI analytics layer delivered as SaaS or managed software to US public-safety
              agencies, not the underlying sensor or communications infrastructure.

              Status-quo substitutes that agencies use absent a dedicated analytics platform include: (1) native
              analytics modules within Motorola Solutions' CAD/RMS suite (Integrated Intelligence Center), (2) Axon
              Fusus, which aggregates camera and sensor feeds, (3) Palantir Gotham for large agencies with federal-grade
              data needs, (4) custom SQL/GIS environments built by agency IT teams, and (5) manual cross-agency data
              requests via email and fax—still the default for smaller departments. These substitutes define the
              switching-cost baseline and the primary competitive moat Peregrine must overcome in procurement cycles.

              Adjacent spend categories that influence but do not directly constitute Peregrine's SAM include: federal
              intelligence and counter-terrorism analytics (Palantir, IBM i2), smart-city video analytics platforms,
              immigration enforcement data tools, and state-level fusion center software. Internationally, similar
              platforms exist in Canada, Australia, and the UK, but Peregrine's current commercial focus remains the US
              state and local market.
