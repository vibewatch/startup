            61x ARR at Series C is materially premium to comps (Flock 25x, Axon 11-15x, Tyler 5-11x); base-case scenario
            implies loss
        - label: Evidence quality
          value: 2
          note: >-
            All financials are company-claimed or third-party estimated; no audited accounts or independent NRR data
            available
    claimRefs:
