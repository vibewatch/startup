        title: 'Adverse evidence: civic-trust failures and the political economy of public safety surveillance'
        blocks:
          - type: paragraph
            body: >-
              Peregrine's competitive risk is not purely technical or financial—it also includes the civic-trust
              dimension that has already ended or suspended real-money contracts. In February 2026, Durham City Council
              voted to cancel its $517,000 Peregrine contract following community organizing and public testimony about
              surveillance overreach; Charlottesville separately paused use of the platform after similar concerns were
              raised. These are not isolated events. Campaign Zero and related civil liberties researchers have
              published material arguing that real-time surveillance platforms amplify discriminatory policing patterns,
              and their reports have become direct exhibits in city-council debates. SoundThinking's declining revenue
              demonstrates that political fragility is not hypothetical: a coordinated campaign across a dozen cities
              can shrink ARR by double digits within a single fiscal year. Peregrine's response—FedRAMP High, formal
              data-governance policies, city-specific community engagement—is more sophisticated than earlier-generation
              surveillance tools, but the durability of that response is not yet tested across a sustained multi-city
              opposition campaign. The adverse evidence also affects Flock Safety and Palantir, both of which face
              organized opposition, suggesting the risk is sector-wide rather than Peregrine-specific. Diligence should
              map all known active opposition campaigns and assess the contract-termination clause exposure of
              Peregrine's existing 225+ city base.
