      - number: '5.4'
        title: Differentiation, AI/Data Moat, and IP
        blocks:
          - type: paragraph
            body: >-
              Peregrine's competitive differentiation rests on four pillars. First, its proprietary Data Integration
              Layer—built over 18+ months co-embedded inside law enforcement agencies—normalises inputs from any system
              without requiring custom data pipelines, dramatically lowering deployment cost and time relative to
              enterprise competitors like Palantir. Second, its regulatory moat: FedRAMP High authorisation (April 2026)
              is the highest federal cloud security tier and required for serving agencies with the most sensitive
              unclassified data; achieving this status took years of investment and creates a hard compliance barrier to
              entry. Third, network effects from deep customer integrations: agencies connect their JMS, DFR feeds, and
              digital-evidence vaults, raising switching costs and expanding the data surface available for cross-agency
              collaboration. Fourth, AI applied in a privacy-preserving architecture: Peregrine Vision cuts
              evidence-review time, safety flags accelerate investigations, and the Resource Optimizer supports
              proactive staffing—all without training on customer data. Multiple patents in data fusion and geospatial
              visualisation are claimed by the company but have not been independently verified in public filings. The
              company explicitly prohibits facial recognition, a deliberate positioning choice that differentiates it
              from more aggressive surveillance vendors and has helped it navigate politically sensitive procurement
              contexts—though the safety flagging tool's reliance on historical arrest data remains controversial with
              civil liberties advocates.
            claimRefs:
              - CE004
              - CE007
              - CE012
              - CE020
