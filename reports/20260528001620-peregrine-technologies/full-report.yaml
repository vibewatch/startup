            body: >-
              The $2,793,750 Project Blue Light contract with LAPD — verified in the Los Angeles City Clerk's database —
              is the strongest enterprise proof point in Peregrine's customer portfolio. It covers roughly 9,500
              officers over four years and sets a price anchor justifying the $280K average ACV claim. As the nation's
              largest municipal police department, LAPD's production deployment materially reduces procurement friction
              for peer agencies and anchors Peregrine as an enterprise-grade public safety platform rather than a
              pilot-stage tool. At approximately 28% of estimated 2023 ARR, the contract also represents the most
              visible concentration risk in the portfolio.
            calloutType: strength
