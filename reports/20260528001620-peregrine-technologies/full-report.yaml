chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, platform, and business model
        blocks:
          - type: paragraph
            body: >-
              Peregrine Technologies operates out of San Francisco and describes its core offering as a cloud-native
              data fusion platform for public safety and government agencies. The company's primary website is
              peregrine.io, with peregrine.tech redirecting to the same product surface. Founded in 2017 or 2018—sources
              differ—by Nick Noone and Ben Rudolph, the company was born from 18 months of direct field work embedded
              alongside detectives at the San Pablo Police Department in the Bay Area. That ground-level approach shaped
              a product that is less traditional enterprise software and more of an operational intelligence layer: law
              enforcement officers enter a name, address, or case number into a web-based interface, and the platform
              rapidly searches across court records, arrest reports, body cam footage transcripts, license plate reader
              logs, and any police dataset the agency has connected. Forbes described the result in August 2024 as
              "essentially a super-powered Google for police data."


              The business model is subscription-based SaaS with per-agency licensing. CEO Noone has stated publicly
              that the company's average contract value is approximately $280,000 per year, though the range spans from
              small rural departments at roughly $32,000 per year to major metro deals such as the LAPD's $2.8 million
              commitment for 'Project Blue Light.' Orange County Sheriff's Office similarly signed a $900,000 contract
              through Peregrine. This tiered structure makes the platform accessible to smaller departments that could
              never afford traditional Real-Time Crime Center infrastructure, which is a key competitive wedge against
              incumbents. As of August 2024, Peregrine had signed 57 contracts across U.S. police and public safety
              agencies; by the time of the March 2025 Series C, the company was claiming coverage of 80 million-plus
              Americans through 40-plus agencies. Beyond law enforcement, Peregrine has expanded into emergency
              management, fire and rescue, criminal justice, and even parks and libraries, positioning the data
              integration layer as a general government intelligence product rather than a police-only offering.
