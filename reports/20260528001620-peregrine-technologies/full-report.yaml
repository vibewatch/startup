      - number: '2.5'
        title: Sizing Gaps, Contradictory Estimates, and Open Questions
        blocks:
          - type: paragraph
            body: >
              Several material diligence gaps limit the precision of market sizing for Peregrine's specific segment.
              First, no analyst report cleanly isolates the US SaaS analytics segment for state and local law
              enforcement from the broader law enforcement software market, which includes CAD, RMS, evidence
              management, and body-camera software. The $2–5B figures cited for predictive policing reflect global
              totals with varying market-boundary definitions, and applying a US fraction requires assumptions that are
              not externally validated.

              Second, analyst estimates diverge by 2–3x even for nominally similar market definitions. Fact.MR's $13.6B,
              Precedence Research's implied $18–19B, and the Technavio $9.4B growth-increment-only figure are not
              directly comparable—they cover different geographies, product categories, and base years. Preserving this
              dispersion rather than averaging it is essential for calibrating valuation.

              Third, the RTCC market—which is Peregrine's primary go-to-market channel—does not have a standalone
              market-size estimate from any major analyst firm as of May 2026. The NRTCCA's 300-agency estimate and
              conference growth data provide demand signals but not revenue sizing. A detailed bottoms-up estimate
              (agencies × average contract value × renewal rate) would require primary research.

              Fourth, the impact of federal budget uncertainty—specifically the potential for Byrne JAG and COPS grant
              reductions under current FY2026 budget debates—is not quantified in any public source reviewed. These
              grants are meaningful demand accelerators; a material reduction would compress near-term SAM.

              Finally, Peregrine's own revenue and ARR are not publicly disclosed. The company's claim of tripling
              revenue three years running is compelling but unverified. Without disclosed financials, SOM and
              market-share estimates remain rough approximations. These gaps are noted where applicable in the evidence
              gaps section.
            claimRefs:
              - CM025
              - CM042
              - CM027
              - CM005
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: RTCC Adoption at Inflection — But Less Than 2% Penetration
            body: >
              The National Real Time Crime Center Association's membership surge—200 attendees in 2022 to 1,000 in
              2025—signals that RTCC deployment has crossed the early-adopter threshold and entered early majority. Yet
              only ~300 of ~18,000 US law enforcement agencies have operational RTCCs, representing less than 2%
              penetration of all agencies and ~12% of the ~2,500 viable targets. This creates substantial white space
              for Peregrine, but achieving broad penetration will require overcoming structural barriers: procurement
              cycles, civil-liberties opposition, and budget constraints in smaller municipalities.
            calloutType: insight
            claimRefs:
              - CM016
              - CM017
              - CM003
          - type: callout
            title: Civil-Liberties Opposition Is a Recurring, Not Isolated, Deal Risk
            body: >
              Durham, North Carolina's city council vote against the Peregrine contract and Charlottesville's pause on
              using the software are not outliers—they reflect a documented pattern of community opposition to
              predictive policing and AI surveillance platforms. The Brennan Center and ACLU have published research
              framing AI-powered public-safety analytics as civil-liberties risks. This opposition is asymmetric: a
              single vocal community meeting can derail a contract regardless of technical merit, and the elected-body
              approval requirement means public pressure has a formal veto point. Peregrine's community-engagement
              strategy and the percentage of contested deals it loses are key diligence questions.
            calloutType: risk
            claimRefs:
              - CM006
              - CM008
              - CM029
              - CM030
          - type: callout
            title: FedRAMP High Certification Creates Structural Entry Barrier for Federal Market
            body: >
              Peregrine's FedRAMP High authorization is a significant competitive moat in the federal segment. Most law
              enforcement analytics platforms have not achieved FedRAMP High, which restricts them from contracts with
              agencies handling Controlled Unclassified Information (CUI) and Law Enforcement Sensitive (LES) data.
              Federal contracts (FBI, DHS, DEA) carry larger average contract values, multi-year terms, and lower churn
              risk than municipal deals, making the federal segment the highest-value expansion path if Peregrine can
              win initial RFPs.
            calloutType: strength
            claimRefs:
              - CM009
              - CM040
          - type: callout
            title: SAM Estimate Is Bounded by Undisclosed Revenue Data
            body: >
              The $1–3B SAM estimate for US public-safety analytics platforms is constructed bottom-up from the
              GovTech/Gartner $15B justice IT envelope and an assumed 10–25% analytics share. Peregrine has not
              disclosed ARR or revenue, making SOM verification impossible from public sources. The SAM estimate should
              be treated as order-of-magnitude guidance; primary research into Peregrine's pipeline and comparable
              vendor disclosures (Tyler Technologies, Axon analytics ARR) would materially sharpen this figure.
            calloutType: assumption
            claimRefs:
