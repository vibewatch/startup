      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >
              The most powerful demand accelerant is the RTCC movement: the National Real Time Crime Center
              Association's annual conference grew from 200 attendees in 2022 to 1,000 in 2025, reflecting an estimated
              300 active RTCCs as of end-2025. RTCCs are increasingly viewed as a standard infrastructure layer for
              medium-to-large law enforcement agencies, creating a secular pull for the analytics platforms that power
              them. Samsung's January 2026 analysis confirms that mobile integration—bringing RTCC intelligence to
              officers in the field—is the next adoption wave.

              Regulatory and policy tailwinds include the Biden-era executive order on AI and the COPS and Byrne grant
              programs that fund technology adoption. Peregrine's FedRAMP High authorization—one of only a small number
              of public-safety platforms to achieve this certification—directly enables federal agency procurement and
              provides a trust signal to state agencies that handle federal data.

              Incumbent public-safety vendor growth rates corroborate the market opportunity. Axon Enterprise's 2025
              revenue grew 33% to $2.8B, with 2026 guidance of $3.6B (27–30% growth) and ARR above $1.3B—demonstrating
              that government buyers are aggressively expanding recurring software spend in public safety. Motorola
              Solutions grew 8% to $11.68B in 2025 with a $15.7B backlog. Palantir's US government revenue hit $687M in
              Q1 2026 alone, up 84% year-over-year. This growth across incumbents validates the structural demand,
              though it also signals intensifying competition.

              On the constraint side, civil-liberties opposition is the most immediate demand damper. Durham, North
              Carolina's city council voted against a $517K Peregrine contract in early 2026 following public pressure
              from residents and advocacy groups citing predictive policing and surveillance concerns. Charlottesville,
              Virginia's police paused use of Peregrine software in 2025. The Brennan Center and ACLU have published
              reports characterizing AI-powered public safety platforms as risks to civil liberties and racial equity.
              These incidents are not isolated—they represent a recurring pattern of community opposition that can
              derail late-stage procurement even after technical and budget approvals.

              Long government procurement cycles (6–18 months from specification to contract award), legacy system
              integration complexity, and limited IT staff capacity in smaller agencies are structural constraints. The
              requirement for city council or county board approval means that contracts are subject to political
              dynamics even after technical evaluation is complete. Finally, inter-vendor dependency on data
              integrations (RMS, CAD, sensor feeds) creates technical switching costs that can favor incumbents with
              deeper system-level integrations.
