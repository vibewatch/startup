  - id: scenario-analysis
    title: Bull, Base, and Bear Scenario Analysis
    body: >
      Valuation scenarios are built around three growth trajectories anchored on the $40.9M ARR base
      as of mid-2025 and the March 2025 $2.5B entry valuation. The bull case assumes sustained 3x annual
      growth (consistent with Peregrine's stated historical track record), reaching approximately $370M
      ARR by fiscal year 2027; at a 12-15x ARR exit multiple (consistent with high-growth govtech SaaS
      in a favorable exit environment), the implied value of $4.4-5.6B would deliver a 1.8-2.2x return
      on the $2.5B entry — modest for a venture-stage risk profile but positive.

      The base case models a deceleration to 1.8-2x annual growth (consistent with government-procurement
      friction and sales-force scaling lag), reaching approximately $133M ARR by fiscal year 2027; at
      an 8-10x ARR exit multiple (mid-stage govtech SaaS), the implied value of $1.0-1.3B would represent
      a 50-60% loss on the $2.5B entry. This is the scenario where Peregrine's growth rate follows the
      common SaaS pattern of slowing post-$100M ARR, and where the current valuation premium evaporates.

      The bear case reflects material headwinds: government budget cuts, civil-liberties backlash
      slowing new-agency procurement, or the emergence of an Axon or Motorola Solutions platform that
      bundles equivalent capability into existing contracts. In this scenario, growth slows to 1.2-1.4x
      annually, reaching $60-70M ARR by fiscal year 2027; at a 5-7x ARR multiple (distressed govtech),
      the implied value of $300-490M would represent a 80-88% loss on the $2.5B entry — analogous to
      the Dataminr secondary-market outcome. Probability signals: the base and bear cases together account
      for the majority of outcome probability given current evidence on profitability, customer
      concentration, and government budget constraints.
