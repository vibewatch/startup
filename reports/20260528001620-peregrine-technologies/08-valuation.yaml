  - id: comparable-analysis
    title: Comparable Analysis — Public Companies, Private Rounds, and M&A
    body: >
      The primary public-company comparables are Axon Enterprise (AXON) and Tyler Technologies (TYL),
      the two most relevant listed govtech/public-safety SaaS anchors. As of May 2026, Axon trades at
      approximately 11x trailing revenue with $2.8B in 2025 revenue (33% YoY growth) and $1.35B ARR;
      the company's market cap has retreated from ~$62B (mid-2025) to ~$31.5B — roughly 50% compression
      from peak — illustrating multiple-compression risk even for category leaders. Tyler Technologies
      trades at 5.2x EV/Revenue with $2.33B in 2025 revenue (9% growth) and a $13B enterprise value.
      Axon's 10-K (FY 2025) identifies more than 50 law-enforcement software providers — including Mark43,
      CentralSquare, Motorola Solutions, and Tyler — as direct competitors in records management and
      real-time operations, the same categories in which Peregrine competes.

      Among private round comparables, Flock Safety (LPR cameras + investigative intelligence) raised
      $275M at a $7.5B valuation in March 2025 — concurrent with Peregrine's Series C — on $300M ARR
      (approximately 70% YoY growth), implying a 25x ARR multiple. Flock's subsequent $8.4B mark in
      April 2026 demonstrates continued institutional appetite for high-growth public-safety software, but
      also surfaced nationwide civil-liberties protests. Mark43, a direct RMS/CAD platform competitor,
      completed a Series G in October 2025 according to PitchBook; funding details are not fully public.
      Dataminr, the most instructive adverse comparable, raised $475M at a $4.1B valuation in March 2021,
      but was valued in private secondary markets at approximately $832M as of September 2025 — an 80%
      decline reflecting multiple compression, layoffs, and debt-style financing in lieu of primary equity.

      The MarketsandMarkets law enforcement software market report (2025 edition) cites IBM, Motorola
      Solutions, Oracle, and Palantir as major market participants alongside Axon and Tyler, confirming
      that Peregrine competes in a segment with both well-resourced incumbents and emerging AI-native
      entrants. The Grand View Research market sizing estimates the US law enforcement software segment
      at an LTM growth rate consistent with the broader $20.25B→$32.96B trajectory, favoring SaaS
      cloud-native leaders.
