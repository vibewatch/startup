  - id: exit-readiness-diligence
    title: Exit Readiness and Final Diligence Asks
    body: >
      Exit pathway analysis suggests three primary routes: (1) strategic acquisition by Axon, Motorola
      Solutions, or a large defense/intelligence contractor (likely $2-4B range if growth decelerates);
      (2) IPO in a favorable govtech window, requiring ARR above ~$150-200M and demonstrated operating
      leverage; (3) secondary-market sale at a discount to primary marks, as observed with Dataminr and
      other late-stage govtech unicorns. The Peregrine platform's deep data-integration architecture
      creates genuine strategic value for Axon, which explicitly identifies the records management and
      real-time-operations space as competitive in its 10-K (FY 2025). However, Axon's organic investment
      in Axon Records and Axon Fusus reduces urgency for an acquisition.

      The most critical unresolved diligence gaps are: (1) ARR composition and revenue quality (SaaS vs.
      professional services vs. one-time integration fees); (2) net revenue retention and churn by agency
      cohort; (3) gross margin and unit economics (CAC, payback, LTV) by segment; (4) customer
      concentration risk (top-10 agencies as a share of ARR); (5) government contract structure (multi-
      year committed vs. annual at-risk); (6) path to cash-flow breakeven given $253M cumulative burn;
      and (7) civil-liberties compliance posture and exposure to state/local legislation restricting
      predictive-policing or data-sharing tools.

      Until these gaps are closed, the appropriate stance is conditional track: monitor subsequent
      financing events and growth-rate confirmation, but do not chase the current $2.5B mark without a
      materially better-evidenced thesis. A disciplined entry would require either a valuation step-down
      to 15-20x forward-year ARR (approximately $500-750M if ARR reaches $40-50M by mid-2026) or
      clear third-party-verified evidence of continued >2x growth for a second consecutive year post-Series C.
    claimRefs:
      - CV036
      - CV037
      - CV038
      - CV039
      - CV040
