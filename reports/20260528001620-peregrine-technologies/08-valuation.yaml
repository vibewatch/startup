callouts:
  - calloutType: recommendation
    title: Conditional Track — Overpriced at 61x ARR Without Unit-Economics Evidence
    body: >
      At $2.5B post-money on $40.9M ARR, Peregrine Technologies is priced for sustained 3x annual
      compounding through fiscal 2027 or beyond. The concurrent Flock Safety round ($7.5B at $300M ARR =
      25x) anchors a market ceiling for high-growth public-safety SaaS at less than half Peregrine's
      implied multiple. Public comps (Axon at 11x revenue; Tyler at 5-11x revenue) further confirm the
      premium. The Dataminr secondary implosion (−80% from Series F peak) is the most instructive
      adverse analog. Recommend CONDITIONAL TRACK: do not initiate or increase at current mark; re-evaluate
      at the next financing event with ARR audit and NRR confirmation in hand.
    claimRefs:
      - CV011
      - CV015
      - CV023
      - CV026
      - CV035

  - calloutType: risk
    title: Govtech Multiple Compression Risk — Dataminr Is the Floor Case
    body: >
      Dataminr's secondary-market implied valuation fell from $4.1B (March 2021 Series F) to approximately
      $832M (September 2025) — a 79% decline — despite reporting ~$200M in ARR and a multi-year DoD
      contract. The structural causes are common to Peregrine: government-buyer dependency, civil-liberties
      controversy, and a primary-round valuation priced for hypergrowth that did not materialize at the
      pace required. Investors in Peregrine at the $2.5B mark must explicitly model this scenario in their
      base case.
    claimRefs:
      - CV023
      - CV026
      - CV033
      - CV034

  - calloutType: insight
    title: Flock Safety at 25x ARR Is the Comparable Floor for Concurrent Pricing
    body: >
      Flock Safety, a direct public-safety software peer with a concurrent March 2025 financing event,
      raised at $7.5B on $300M ARR = 25x — substantially below Peregrine's implied 61x. Flock carries
      a larger and more diversified ARR base, a top-tier institutional syndicate (a16z, Greenoaks, Founders
      Fund), and a 70% YoY growth rate. That concurrent deal sets the observable market clearing price for
      high-quality public-safety SaaS in the same month as Peregrine's Series C; Peregrine's 61x appears
      to price in materially more optionality and early-stage risk premium than the market was awarding
      to more-scaled comps.
    claimRefs:
      - CV024
      - CV025
      - CV015
      - CV022

