chapter:
  number: 8
  title: Valuation
  summary: >
    Peregrine Technologies raised a $190M Series C at a $2.5B post-money valuation in March 2025,
    led by Sequoia Capital, implying approximately 61x its then-current $40.9M ARR. The company's
    three-consecutive-year revenue tripling, Sequoia imprimatur, and deep integration into public-safety
    workflows anchor a credible bull thesis, but the implied multiple stands materially above concurrent
    private-round comps (Flock Safety ~25x ARR) and public-company benchmarks (Axon ~11x revenue,
    Tyler Technologies ~5-11x revenue). The Dataminr secondary-market collapse from $4.1B to ~$832M
    illustrates the compression risk for govtech unicorns. A conditional "track" stance is warranted
    pending ARR audit, unit-economics confirmation, and customer-concentration disclosure; a disciplined
    new entry would require either a valuation step-down to 15-20x forward ARR or clear evidence of
    continued >2x annual growth and a credible path to profitability.

sections:
  - id: investment-thesis-antithesis
    title: Investment Thesis and Anti-Thesis
    body: >
      Peregrine Technologies builds a data-fusion and real-time-operations platform that allows state and
      local public-safety agencies to integrate siloed records, ingest video and sensor feeds, and surface
      actionable intelligence in a single pane of glass. The company has tripled annual revenues for at
      least three consecutive years, demonstrated Tier-1 operator trust (deployed at Super Bowl LIX),
      and converted Sequoia Capital — the leading GovTech-specialist VC — as its lead Series C investor at a
      $2.5B post-money mark in March 2025. The core thesis rests on four pillars: (1) a large and growing
      law-enforcement software market projected to expand from $20.25B in 2025 to $32.96B by 2030 at a 10.2%
      CAGR; (2) deep data-integration moats that create high switching costs once an agency's records
      are unified on the platform; (3) a product that has achieved Tier-1 event validation (Super Bowl,
      public safety officials serving 80M+ Americans); and (4) a Sequoia-led cap table signalling
      institutional conviction and governance quality.

      The anti-thesis is equally material. The $2.5B valuation implies approximately 61x the company's
      $40.9M ARR — a multiple that demands sustained 3x annual compounding for four or more years to reach
      a scale where even a modest exit multiple returns capital. Comparable private-round leader Flock
      Safety raised at ~25x ARR in March 2025 at a materially larger absolute-revenue base ($300M ARR),
      making Peregrine's mark appear premium on a growth-adjusted basis. Dataminr — a public-safety
      AI company — raised at $4.1B in 2021 and had fallen to a ~$832M secondary-market implied value by
      September 2025. Government procurement is slow, budget-dependent, and politically sensitive: law
      enforcement technology faces recurring civil-liberties backlash (Flock Safety triggered nationwide
      protests at its $8.4B mark in 2026), and budget shortfalls can freeze multi-year IT commitments.
      Key financial inputs — unit economics, gross margin, NRR, churn, customer concentration — are not
      publicly confirmed, making precise underwriting impossible.
