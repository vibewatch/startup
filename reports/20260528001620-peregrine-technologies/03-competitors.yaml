  - id: TP004
    title: Moat durability / competitive risk register
    columns:
      - moat claim
      - threat
      - severity
      - mitigation / diligence ask
    rows:
      - - 200+ data-feed integration library creates migration friction
        - >-
          Axon and Motorola are building equivalent integration depth via hardware ecosystem and CAD substrate;
          feeds can be replicated if a competitor commits sufficient engineering resources
        - high
        - >-
          Audit how many integrations are agency-unique vs. commodity; quantify average migration time and
          cost observed in comparable RTCC or dispatch-system switches
      - - FedRAMP High authorization creates a barrier in federal/IC market
        - >-
          Axon and Motorola already hold some federal authorizations; competitors can pursue FedRAMP High given
          sufficient time and investment; the authorization is reproducible, not proprietary
        - medium
        - >-
          Confirm which federal agencies have active Peregrine pilots or contracts; assess upcoming recompete
          exposure and whether any competitor has a FedRAMP High authorization in progress
      - - 225+ city deployment base creates reference-selling and switching-cost moat
        - >-
          Flock Safety reached 4,800 agencies in approximately five years, demonstrating rapid accumulation is
          achievable; Axon Fusus at 95% growth erodes first-mover reference advantages quickly
        - high
        - >-
          Obtain net revenue retention and churn data; validate how many of the 225 cities are in multi-year
          locked contracts vs. annual or terminable agreements
      - - Purpose-built RTCC positioning vs. bolted-on incumbents
        - >-
          Axon acquired a purpose-built RTCC company (Fusus), neutralizing the differentiation argument over
          time as Fusus continues to mature and integrate into the Axon platform
        - medium
        - >-
          Identify specific capability gaps between Fusus and Peregrine as of mid-2026; assess Axon's
          published integration roadmap for Fusus; track Fusus feature parity timeline
      - - Civic-trust backlash ended Durham contract and paused Charlottesville use
        - >-
          Organized civil-liberties campaigns can cancel contracts regardless of technical quality;
          SoundThinking's 15% YoY revenue decline shows this risk is sector-wide and quantifiable
        - high
        - >-
          Map all known active opposition campaigns by city; assess contract-termination clause exposure;
          quantify financial impact of additional cancellations on revenue and valuation
      - - First-mover advantage in RTCC segment
        - >-
          GovTech first-mover advantages erode via procurement cycles, FOIA-driven political pressure, and
          well-funded late entrants; both Flock Safety and Axon arrived later and are closing the gap
        - medium
        - >-
          Review win/loss record against Axon Fusus and Flock Safety in 2025-2026 competitive procurements;
          assess whether win rate is stable, improving, or declining
    notes: >-
      The register focuses on durability questions most likely to change underwriting assumptions in 2026.
      Tactical product-level risks such as feature gaps, API versioning latency, and onboarding friction are
      noted but not enumerated as separate moat rows.
