  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: 'Competitors: Peregrine vs. Axon Fusus precise pricing differential'
      missingEvidence: >-
        Public materials reviewed do not expose a comparable price-per-agency or per-seat rate card for either
        Peregrine or Axon Fusus. The Durham $517K anchor covers a single mid-size city but cannot support a
        systematic pricing comparison. Enterprise and federal contract terms are not public.
      whyItMatters: >-
        Without pricing comparability, diligence cannot assess whether Axon's bundling leverage is likely to
        displace Peregrine in competitive bids or whether Peregrine can hold premium pricing at scale.
      diligencePath: >-
        Request management or dataroom materials for a sample of recent competitive bid outcomes, including
        final contract values, competing bids, and discount levels for Peregrine and Axon Fusus.
      relatedQuestionRefs:
        - QP002
      relatedTableRefs:
        - TP003
    - type: private-evidence-only
      severity: material
      topic: 'Competitors: switching cost quantification for RTCC migration'
      missingEvidence: >-
        No public source provides a quantitative estimate of the time or cost for an agency to migrate from
        Peregrine to a competitor or vice versa. Integration complexity (200+ feeds) is described qualitatively
        but no migration case studies are available in public sources.
      whyItMatters: >-
        Switching cost quantification is the most material gap in assessing whether Peregrine's integration
        depth is a durable moat or a temporarily high but ultimately surmountable barrier to competitive entry.
      diligencePath: >-
        Request case studies or legal due diligence materials on agencies that switched from Peregrine or to
        Peregrine from a competitor, focusing on implementation timeline and total cost.
      relatedQuestionRefs:
        - QP019
      relatedTableRefs:
        - TP004
    - type: missing-source
      severity: minor
      topic: 'Competitors: NICE Investigate US market expansion plans'
      missingEvidence: >-
        Reviewed public sources do not confirm NICE Investigate's current US agency count or any disclosed US
        market expansion strategy for 2026. NICE's presence is well documented in UK and Europe but US coverage
        is sparse in available public materials.
      whyItMatters: >-
        If NICE Investigate expands its US footprint materially, it would represent an additional adjacent
        competitor in the digital evidence and investigation management segment where Peregrine operates.
      diligencePath: >-
        Search NICE Systems US investor materials, US government contract databases (SAM.gov, USASpending), and
        industry press for NICE Investigate US agency deployments in 2025-2026.
      relatedQuestionRefs:
        - QP018
      relatedTableRefs: []
    - type: missing-source
      severity: minor
      topic: 'Competitors: geographic distribution of Peregrine city deployments'
      missingEvidence: >-
        Reviewed public sources confirm 225+ city deployments but do not disclose the geographic distribution,
        state-by-state breakdown, or regional concentration of Peregrine's agency base. No public map or
        deployment registry was found in the reviewed source set.
      whyItMatters: >-
        Geographic concentration risk matters for competitive assessment: a highly regional footprint would be
        more vulnerable to a coordinated state-level opposition campaign than a nationally distributed one.
      diligencePath: >-
        Request a deployment map or state-level breakdown from Peregrine management; search government
        procurement databases (SAM.gov, state-level portals) for Peregrine contract records by geography.
      relatedQuestionRefs:
        - QP025
      relatedTableRefs: []
