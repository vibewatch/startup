    title: Competitive positioning map
    type: quadrant
    layout: wide
    summary: >-
      Peregrine sits at the intersection of purpose-built RTCC depth and mid-market agency reach. Axon and
      Motorola hold broader distribution at the cost of analytic focus. Flock Safety leads on agency count but
      remains hardware-anchored. Palantir occupies the high-end federal tier with limited addressability for
      typical Peregrine buyers.
