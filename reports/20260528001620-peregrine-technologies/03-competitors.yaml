      - - Palantir Gotham
        - Federal / large-agency intelligence platform
        - FY2025 revenue >$2.8B; ATO track record; federal contract vehicles
        - Federal agencies, DOD, large metro intelligence units
        - Full-spectrum data fusion; ATO/FedRAMP record; analytics depth
        - Civil liberties controversy; complex deployment; cost prohibitive for mid-market LE
      - - NICE Investigate
        - Adjacent digital evidence management
        - 5M+ police investigations covered; primarily UK/Europe
        - Large agencies focused on investigation and evidence management
        - Investigation workflow depth; strong UK/Europe presence; digital evidence chain of custody
