    title: Durham and Charlottesville demonstrate that civic-trust risk translates directly into lost ARR
    body: >-
      Peregrine has already experienced two named contract outcomes from civil-liberties organizing. SoundThinking's
      15% YoY revenue decline in Q1 2026 confirms this is a repeatable mechanism that can shrink sector ARR
      materially, not an isolated political event.
