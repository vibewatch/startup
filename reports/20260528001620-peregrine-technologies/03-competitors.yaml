  - id: section-2
    title: 'Direct competitors: Axon/Fusus, Flock Safety, and SoundThinking'
    body: >-
      Axon Enterprise is the most consequential direct threat. Its Q1 2026 results show net revenue of $807M
      growing at 34% year-over-year and ARR reaching $1.5 billion, with the Fusus software segment posting 95%
      revenue growth year-over-year. The Fusus platform aggregates community cameras, gunshot detection, drone
      feeds, and CAD dispatch into a unified situational-awareness interface—the same job description as
      Peregrine's RTCC—but with Axon's body-camera and Taser installed base as a forcing function for adoption.
      Contracted bookings of $14.3 billion signal durable procurement pipelines that can cross-sell Fusus into
      existing Axon accounts without competitive rebidding. Flock Safety presents a different but complementary
      threat: its $8.4 billion April 2026 valuation and $300 million ARR growing at 70% year-over-year reflect
      a model anchored in automated license-plate readers and fixed camera networks that 4,800+ agencies already
      use. Where Peregrine must be chosen alongside existing hardware, Flock's cameras are often the first step
      that then pulls analytics procurement toward Flock's own platform. SoundThinking/ShotSpotter illustrates
      the downside scenario: Q1 2026 revenue fell 15% year-over-year to $24.2 million as several major cities
      terminated gunshot-detection contracts under community pressure, and fiscal-year guidance of $109–111
      million implies continued contraction. SoundThinking's ARR of $95.4 million and its pivot toward the
      PlateRanger LPR analytics product shows the company trying to diversify away from single-sensor reliance,
      but its trajectory is a direct warning signal for any RTCC vendor whose value proposition depends on a
      single data type or on city councils facing organized civil liberties opposition.
