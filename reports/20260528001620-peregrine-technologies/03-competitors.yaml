    title: Axon's $14.3B contracted bookings backlog dwarfs Peregrine's entire capital raised
    body: >-
      The scale gap between Axon and Peregrine is not just a revenue comparison—it reflects the depth of
      multi-year procurement pipelines that Axon can cross-sell Fusus into at near-zero incremental cost.
      Peregrine's $190M Series C must compete with an incumbent that can bundle RTCC inside existing contracts
      without a competitive rebid.
    claimRefs:
