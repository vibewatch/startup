  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - vendor
      - public package
      - price / unit / contract model
      - included capabilities
      - discount or unknowns
      - implication
    rows:
      - - Peregrine Technologies
        - RTCC platform (city/agency license)
        - >-
          Contract-based municipal pricing; no public per-seat or per-agency rate card; Durham contract value
          was $517K for one mid-size city
        - 200+ feed integrations, real-time alerting, FedRAMP-authorized cloud
        - Enterprise custom pricing; multi-year contract terms not public
        - Durham $517K is the only specific public Peregrine price anchor; inadequate for extrapolation
      - - Axon / Fusus
        - Fusus RTCC add-on to Axon ecosystem
        - >-
          Bundled or à-la-carte pricing inside Axon contracts; exact Fusus module pricing not disclosed in
          reviewed public materials
        - Camera aggregation, drone integration, dispatch pane, community camera ingestion
        - Axon hardware ecosystem creates bundling leverage; Fusus stand-alone price not publicly available
        - 'Bundling risk: agencies with Axon cameras may obtain RTCC at near-zero incremental cost'
      - - Flock Safety
        - LPR hardware plus analytics platform
        - >-
          Hardware plus subscription model; per-camera or per-location contract; full platform pricing not
          publicly disclosed
        - Fixed cameras, LPR data, community alerts, analytics dashboard
        - Hardware subsidies or leases may suppress apparent software cost in total-cost-of-ownership
        - Camera-plus-analytics bundle can undercut pure-software RTCC on apparent per-agency cost
      - - Motorola Solutions
        - CommandCentral platform suite
        - >-
          Enterprise software pricing embedded in existing radio and dispatch contracts; analytics module
          pricing custom
        - CAD/dispatch integration, video analytics, radio interoperability
        - Often included in contract renewals without a separate competitive procurement event
        - Renewal-bundling means Peregrine can lose mindshare without appearing in a competitive bid
      - - Mark43
        - Cloud-native RMS/CAD
        - >-
          SaaS per-seat or agency subscription model; public pricing not fully disclosed in reviewed materials
        - RMS, CAD, analytics, integration APIs
        - Series G financing suggests growth-mode pricing rather than margin optimization
        - CAD/RMS incumbency creates natural upsell surface for future RTCC feature additions
      - - SoundThinking
        - ShotSpotter plus PlateRanger
        - >-
          Per-square-mile or city-zone pricing for ShotSpotter; PlateRanger pricing not publicly disclosed in
          reviewed materials
        - Gunshot detection acoustic sensors, LPR analytics
        - Pricing under pressure as contracts are cancelled; no public rate card for PlateRanger
        - Declining ARR suggests both pricing and volume are under simultaneous pressure
      - - Palantir Gotham
        - Federal intelligence platform
        - >-
          Federal contract vehicle pricing (IDIQ, GSA schedule); not a list-price product; typical deployment
          costs in the tens of millions
        - Full-spectrum data fusion, ATO-authorized deployment, multi-source analytics
        - Not a retail or SMB product; acquired through federal procurement vehicles only
        - Out-of-market for mid-size LE agencies on operating budgets; relevant for top-tier federal buyers
    notes: >-
      Pricing cells reflect only publicly available information in reviewed sources. Null or opaque cells are
      intentionally described qualitatively rather than estimated. The Durham $517K contract value (SP008) is
