callouts:
  - calloutType: recommendation
    title: Underwrite after technical proof, not narrative
    body: Morphi merits technical diligence because the founder background and stated full-stack direction are relevant, but investment or deployment confidence should wait for a named platform, reproducible benchmarks, production references, and safety/security documentation.
    claimRefs: [CE001, CE004, CE009, CE014]
