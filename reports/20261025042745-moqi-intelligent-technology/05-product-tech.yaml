      - ["World / language representation", "Use web-scale or language knowledge for semantic interpretation", "Pretrained VLM and curated data", "Hallucinated or unsafe semantic decisions", "RT-2 reference; Morphi implementation undisclosed"]
      - ["Action policy", "Map observations and instruction to robot actions", "Robot trajectories and action tokenization", "Control errors and compounding long-horizon mistakes", "RT-2 reference; Morphi implementation undisclosed"]
      - ["Hardware and actuation", "Move the body and manipulate objects", "Actuators, reducers, motors, hands, and suppliers", "Cost, supply, calibration, and maintenance", "Industry supply-chain evidence; Morphi stack undisclosed"]
      - ["Data lifecycle", "Train, deploy, monitor, and update models", "Data governance and compute", "Privacy, drift, and update rollback risk", "National standards address lifecycle; Morphi controls undisclosed"]
      - ["Safety and compliance", "Constrain operation and manage incidents", "Risk assessment, testing, and applicable standards", "Injury, cybersecurity, regulatory, and reputational exposure", "National standards framework; Morphi evidence absent"]
    notes: "This is an analytical architecture map, not an assertion that Morphi uses every listed component; company-specific implementation remains unverified."
    claimRefs: [CE005, CE006, CE008, CE010, CE011, CE012, CE014, CE015, CE016]
