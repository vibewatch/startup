chapter:
  number: 5
  title: Product & Technology
  summary: Morphi presents itself as a full-stack humanoid-robotics company combining hardware, data, and algorithms, but its public product surface does not yet substantiate a specific shipped platform, deployment record, or measurable reliability profile. The surrounding evidence shows both a credible technical direction—vision-language-action control—and rising Chinese standards and supply-chain maturity, while leaving company-specific architecture, safety, and commercial readiness as diligence blockers.
sections:
  - id: product-surface
    title: Product definition and maturity
    body: >-
      The only company-specific product description retained in this pool is a personal
      profile for co-founder and CTO Qingqiu Huang. It describes Morphi Robot as building
      humanoids intended to understand, adapt, and care for people, and says the team has
      in-house capabilities across hardware, data, and algorithms. The same profile identifies
      Huang's prior Huawei work across perception, prediction, end-to-end driving systems,
      VLM/VLA, and AI infrastructure. This is useful founder and direction evidence, but it
      is not a product specification: it does not name a model, SKU, customer workflow,
      deployment date, production volume, benchmark, or certification. The product should
      therefore be treated as an early-stage platform thesis rather than a verified commercial
      system.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: architecture-and-differentiation
    title: Architecture direction and technical differentiation
    body: >-
      A plausible architecture for Morphi's stated mission is a perception-to-action stack
      that combines visual and language representations with robot data and control outputs,
      but the company has not publicly disclosed enough detail to attribute such an
      implementation to Morphi. The RT-2 research provides a relevant technical benchmark:
      it co-fine-tunes a pretrained vision-language model on robotics and web data, represents
      actions as tokens, takes robot camera images, and directly predicts robot actions. In
      more than 6,000 trials, the reported system improved performance on previously unseen
      scenarios from 32% for RT-1 to 62%, and reached 90% in simulation on the Language Table
      suite. Those results demonstrate why VLA is a credible research direction, not that
      Morphi has reproduced them. Huawei's disclosed WEWA design offers a second comparator,
      pairing cloud generation of difficult scenarios with an on-vehicle multimodal action
      model. Huang's profile is consistent with relevant expertise, but no Morphi paper,
      benchmark, repository, or system diagram in the assigned pool closes the attribution
      gap.
    claimRefs: [CE005, CE006, CE007, CE008, CE009, CE015]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: operating-risk
    title: Deployment, controls, and diligence risks
    body: >-
      The operating environment is becoming more structured but also more demanding. China's
      March 2026 national standard system covers commonality, intelligent computing, limbs and
      components, complete machines and systems, applications, and safety and ethics; it also
      addresses data lifecycle and model training and deployment. Industry research describes
      2026 as a commercialization inflection point, with component capacity and cost decline
      becoming central to scale. These are ecosystem tailwinds, not evidence that Morphi has
      passed safety or deployment gates. The assigned evidence contains no Morphi test results
      for collision avoidance, uptime, battery endurance, remote support, privacy, cybersecurity,
      regulatory approvals, or production quality. U.S. semiconductor export controls also make
      compute availability and architecture choices a relevant dependency for a China-based AI
      developer, although the assigned evidence does not establish Morphi's own chip stack. A
      diligence process should request a named platform bill of materials, safety case, incident
      log, security threat model, deployment references, compute plan, and reproducible task-level
      benchmarks before underwriting technical maturity.
    claimRefs: [CE010, CE011, CE012, CE013, CE014, CE016]
