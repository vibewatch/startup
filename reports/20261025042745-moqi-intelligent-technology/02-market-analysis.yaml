callouts:
  - calloutType: insight
    title: Market is moving from demos toward deployment
    body: Production milestones, standards work, and commercial-service positioning indicate that adoption is being tested through repeatable environments before unconstrained household use.
    claimRefs: [CM005, CM006, CM011, CM015]
  - calloutType: assumption
    title: Underwriting assumption
    body: Any Moqi valuation case should remain contingent on disclosed task success, utilization, pricing, customer concentration, deployment cost, and payback evidence.
    claimRefs: [CM014, CM018]
