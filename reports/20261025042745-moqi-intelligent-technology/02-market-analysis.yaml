      - [Logistics and warehousing, "Warehouse or network operations", "Warehouse associates", "Distribution network", "Repetitive movement and handling", "Operations/automation", "24/7 utilization and labor pressure"]
      - [Household, "Consumer or household purchaser", "Residents", "Household budget", "Unstructured manipulation and assistance", "Consumer discretionary", "Convenience and broad task coverage"]
    notes: "The map is a market segmentation hypothesis grounded in the assigned deployment evidence; no row is evidence that Moqi has won a customer or selected a commercial segment."
    claimRefs: [CM011, CM012, CM013, CM014]
