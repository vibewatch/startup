company:
  name: Moqi Intelligent Technology
chapter:
  number: 2
  title: Market Analysis
  summary: The relevant market is embodied-intelligence robotics moving from demonstrations into repeatable commercial deployments, with China showing unusually strong policy and production momentum. Public evidence supports a growing opportunity and several adoption paths, but does not support a defensible company-specific SAM or SOM because Moqi has not disclosed customers, orders, revenue, product specifications, or deployment economics.
sections:
  - id: market-boundary
    title: Market boundary and adoption context
    body: >-
      This analysis defines the market as embodied-intelligence robots that combine
      perception, planning, manipulation, and physical execution in human or
      industrial environments. Included spend covers robot hardware, onboard or
      edge AI, sensors and actuators, deployment, maintenance, data operations,
      and recurring robot-as-a-service or software layers. Excluded spend includes
      conventional fixed automation that does not need general-purpose physical
      adaptability, pure software assistants, and broad semiconductor revenue
      unless it is directly purchased to operate the robot. The near-term
      substitute set is not only another humanoid: specialized industrial robots,
      logistics automation, human labor, and internal process redesign can all
      solve parts of the same job. The market boundary therefore supports a
      deployment-led analysis rather than a single broad “AI” estimate.
    claimRefs: [CM001, CM002]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Evidence-constrained sizing lenses
    body: >-
      Public evidence provides operating and policy proxies, not a company-specific
      revenue market size. China's Ministry of Industry and Information Technology
      committee described a national standard system spanning the humanoid lifecycle,
      while Xinhua reported more than 140 domestic manufacturers and more than 330
      models released in 2025. Independent industry coverage describes AGIBOT
      crossing 10,000 units and Unitree reporting more than 5,500 shipments in
      2025, indicating that production capacity and fleet deployment are becoming
      measurable market variables. These figures should not be added together or
      treated as market revenue: they measure different companies, periods, and
      operating concepts. Figure AI's reported $39 billion post-money valuation
      demonstrates investor willingness to fund the category, but valuation is
      not market size. Moqi's addressable opportunity remains an evidence gap
      until product price, utilization, customer segment, deployment geography,
      and repeatable unit economics are disclosed.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM010]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyers, users, and adoption path
    body: >-
      The most supportable initial buyer path is commercial or industrial deployment
      where layouts, tasks, and safety procedures can be bounded more tightly than
      in homes. The economic buyer may be an operations, manufacturing, logistics,
      facilities, or innovation leader; the user is the worker or supervisor who
      works alongside the robot; and the payer is the operating unit or central
      automation budget. A robot-as-a-service model can reduce upfront capital
      requirements, but the assigned evidence describes that model for AGIBOT and
      Figure AI rather than for Moqi, so it is a market mechanism, not a Moqi
      business-model fact. Adoption triggers are labor scarcity, repetitive or
      hazardous work, and the ability to reuse existing spaces. The adoption path
      still requires proof of task success, uptime, safety, maintenance cost, and
      payback against specialized automation or labor.
    claimRefs: [CM011, CM012, CM013, CM014]
    tableRefs: [TM003]
  - id: drivers-and-constraints
    title: Drivers, constraints, and valuation relevance
    body: >-
      Policy standardization is a demand-enabling driver because it can reduce
      uncertainty around safety, data, and lifecycle practices; China's 2026
      standard system explicitly covers application, safety, ethics, computing,
      components, and complete systems. Production acceleration and large funding
      rounds are additional ecosystem signals, but neither proves customer
      willingness to pay. Constraints are equally material: the market must close
      the gap between polished demonstrations and reliable long-duration operation,
      while hardware, supply chain, data acquisition, generalization, and
      geopolitical access all remain execution risks. Harvard's discussion of
      semiconductor export controls shows that Chinese AI infrastructure operates
      within an active technology-access constraint. The valuation implication is
      asymmetric: a large category can support strategic financing, but Moqi's
      valuation cannot be underwritten from category growth without deployment
      evidence and disclosed economics.
    claimRefs: [CM015, CM016, CM017, CM018]
