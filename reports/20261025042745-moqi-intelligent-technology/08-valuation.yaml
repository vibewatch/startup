      - [Downside diligence, "Convertible preferred stock, cap table, liquidation preference, and cash runway are unfavorable", "Return may be impaired even if headline valuation is unchanged", "Unknown", "Obtain term sheet, ownership, burn, and use-of-proceeds evidence"]
    notes: "Scenarios are qualitative because public sources do not disclose Moqi revenue, margins, cash, ownership, or a comparable denominator; no probability-weighted valuation is invented."
    claimRefs: [CV003, CV012, CV013, CV014, CV015, CV019]
