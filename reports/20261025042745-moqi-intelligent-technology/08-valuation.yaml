chapter:
  number: 8
  title: Valuation
  summary: Moqi's July 2026 financing and Dealroom's contemporaneous unicorn listing support a roughly $1 billion valuation reference, but public evidence does not disclose revenue, deployments, cash runway, or terms. The appropriate stance is track/research-more rather than a price-insensitive buy because comparable robotics rounds show a wide valuation range and the company's execution proof remains thin.
sections:
  - id: recommendation
    title: Recommendation and entry discipline
    body: >-
      The public record supports a valuation reference, not a fully underwritten price. S&P Capital IQ reports a CNY 1 billion angel round for Moqi Technology (Beijing) announced on July 6, 2026, with convertible preferred stock and more than ten participating venture institutions. Dealroom separately lists Moqi Intelligent Technology among July 2026 unicorns at $1 billion. Those are meaningful financing signals, but neither source supplies revenue, gross margin, customer count, cash balance, liquidation preferences, or a cap table. The recommendation is therefore track/research-more: the financing and investor participation are credible positive signals, while the absence of operating and preference data prevents a defensible intrinsic valuation or target return. Entry discipline should require verified commercial deployments, unit economics, runway, and security or governance terms before treating the round mark as investable value.
    claimRefs: [CV001, CV002, CV003, CV004]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-antithesis
    title: Thesis and anti-thesis
    body: >-
      The thesis is that Moqi is participating in a capital-rich humanoid-robotics market and reached unicorn status with a large syndicate, while China's standardization effort may reduce ambiguity around lifecycle, safety, and application requirements. The anti-thesis is that a financing mark can overstate realizable value when commercialization and terms are opaque. Independent comparables illustrate both sides: CNBC reports Physical Intelligence raised $400 million at a $2.4 billion post-money valuation, while TechNode reports Unitree exceeded RMB 12 billion post-money after Series C and had over RMB 1 billion of 2024 revenue. These benchmarks are not directly interchangeable with Moqi: they involve different stages, products, geographies, and disclosed operating evidence. Agility's own site makes the execution bar concrete by describing 65,000 hours of production experience and an on-site validation process, a level of deployment proof not publicly demonstrated for Moqi in the assigned evidence.
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV011]
    tableRefs: [TV002]
  - id: scenarios
    title: Scenarios, downside triggers, and diligence
    body: >-
      A scenario framework is more reliable than a point estimate because the available valuation anchor is a financing event rather than a disclosed operating multiple. The base case holds the reported $1 billion mark as a reference only and assumes no verified revenue or customer KPI uplift. The bull case requires evidence of repeatable paid deployments, production reliability, and a financing or strategic event that validates the mark without excessive dilution. The bear case assumes the mark compresses if commercialization slips, hardware and deployment costs remain high, or a down round exposes preference overhang. The most important diligence asks are the convertible preferred-stock terms, ownership and liquidation preferences, cash and burn, customer contracts, safety metrics, and production economics. A thesis-break trigger is a new financing below the July mark without offsetting operating proof; a positive trigger is independently verifiable recurring deployment revenue with retention and gross-margin evidence.
    claimRefs: [CV012, CV013, CV014, CV015]
    tableRefs: [TV003]
  - id: evidence-boundaries
    title: Evidence boundaries
    body: >-
      Public evidence is sufficient to establish a financing and a contemporaneous unicorn classification, but not sufficient to establish Moqi's current revenue, ARR, runway, customer concentration, ownership dilution, or exit readiness. Dealroom's list is a valuation-status reference rather than a statement of operating performance, and the S&P Capital IQ item is an announcement record rather than a cash-available calculation. The comparable-company sources provide context, not a mechanically transferable multiple. The recommendation should move only when the missing denominators and terms are obtained from the company, lead investors, filings, or customer references.
    claimRefs: [CV017, CV019]
