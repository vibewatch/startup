      - ["Product-liability exposure from unsafe operation", "Relevant deployment jurisdictions", "No Morphi case identified in retained evidence", medium, very high, "Use operating envelope, supervision, insurance, and customer contracts", high, "Obtain claims history, insurance certificates, and legal memo"]
    enumerationScope:
      coverage: partial
      basis: "Publicly described China standards and general deployment liabilities; not a complete legal inventory for all Morphi markets."
    notes: "The table distinguishes an announced national standard system from Morphi's unverified compliance status; no retained source establishes a Morphi enforcement action or lawsuit."
    claimRefs: [CR005, CR006, CR007]
  - id: TR003
    title: Partner / dependency and thesis-break register
    columns: [Dependency or trigger, Counterparty or surface, Failure scenario, Severity, Mitigation, Residual exposure, Monitoring or kill criterion]
    rows:
      - ["Actuators, batteries, chips, and contract manufacturing", "Component and manufacturing ecosystem", "shortages or yield failures delay deployments and compress margin", high, "Dual-source critical parts and track yield and supplier concentration", high, "Kill if critical dependency lacks qualified second source"]
      - ["Training data and compute", "Data providers, cloud or edge infrastructure", "insufficient real-world data or compute slows capability and raises cost", high, "Build governed data pipeline and measure task success per deployment", high, "Kill if capability gains require uneconomic data or compute spend"]
      - ["Customer integration and service", "Early industrial or logistics customers", "pilots do not convert or require excessive human intervention", high, "Paid pilots with uptime, intervention, and outcome KPIs", high, "Kill if repeatable paid deployment cannot be demonstrated"]
      - ["Liquidity and financing", "Investors and capital providers", "runway ends before safety and commercialization milestones", high, "Maintain cash plan tied to milestones and disclose terms", high, "Kill if runway falls below the next validated milestone"]
    notes: "These are diligence and monitoring controls, not disclosed Morphi contracts or customer failures; company-specific counterparty names and concentrations remain unavailable."
    claimRefs: [CR009, CR010, CR014, CR015]
