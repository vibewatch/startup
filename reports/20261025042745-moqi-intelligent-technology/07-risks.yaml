chapter:
  number: 7
  title: Risks
  summary: "Morphi's principal risks are not evidenced by a disclosed incident record; they arise from the still-unproven safety, compliance, deployment, data, capital, and ecosystem requirements of humanoid robotics. Public sector evidence shows that standards and competitive scale are advancing quickly, while company-specific disclosure on controls, customers, cash, and operating performance remains limited."
sections:
  - id: risk-ranking
    title: Ranked risk map
    body: "The highest-consequence risk is physical-world execution: a general-purpose humanoid must combine software, actuators, sensing, human interaction, and reliable maintenance in environments where failure can injure people or interrupt customer operations. China's 2026 national standard system spans the industrial chain and lifecycle and explicitly includes safety and ethics, while industry commentary describes production yield, site stability, and delivered cost as the next commercialization test. These sources establish the external bar, not Morphi's compliance status. Morphi's disclosed founder background is a capability positive, but it is not evidence of product safety, certification, field reliability, or commercial controls. The investment implication is that the risk premium should remain high until Morphi discloses test protocols, incident handling, deployment conditions, and measurable operating results."
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: regulatory-operational
    title: Regulatory, legal, and operating exposure
    body: "Regulatory exposure is moving from a future possibility toward an operating requirement. The State Council Information Office account says the national system covers commonality, computing, components, complete machines, applications, and safety and ethics, and was developed by more than 120 institutions and users. That breadth raises the likelihood that product design, model training, data handling, maintenance, and application-specific controls will be assessed together. Independent coverage of a whistleblower lawsuit against Figure AI also illustrates that humanoid-robot safety allegations can become litigation and reputational events even when the allegation concerns a competitor, not Morphi. No retained source establishes a Morphi lawsuit, recall, breach, or outage; that absence is a disclosure gap rather than evidence that none exists."
    claimRefs: [CR005, CR006, CR007, CR008]
    tableRefs: [TR002]
  - id: dependencies-and-kill
    title: Dependencies, financial resilience, and thesis-break triggers
    body: "Morphi is exposed to ecosystem and financing risks that are common to hardware-plus-AI businesses: component availability, compute and data access, manufacturing partners, customer integration, and enough cash to iterate through field failures. Public market intelligence describes a sector in which hardware scale is concentrating among a few leaders, while another industry account cites capital concentration, a large 2025 funding inflow, and the shutdown of some U.S. projects before mass production. Those figures are industry-level and should not be imputed to Morphi. A practical monitoring plan therefore needs cash runway, burn, unit cost, supplier concentration, deployment uptime, safety incidents, and paid pilot conversion. A thesis break would be a material safety event, an inability to meet applicable standards, repeated field failures, or financing that depends on an unverified valuation rather than operating proof."
    claimRefs: [CR009, CR010, CR011, CR012, CR013]
  - id: diligence-actions
    title: Diligence priorities
    body: "The public record supports a focused diligence agenda rather than a conclusion that Morphi has already failed any control. First, obtain the product safety case: hazard analysis, operating envelope, emergency stop design, human-robot interaction testing, incident log, and insurance. Second, test the commercialization model with named paid deployments, uptime, intervention rates, customer retention, gross margin by unit, warranty returns, and production yield. Third, map dependencies across chips, actuators, batteries, cloud or edge compute, training data, and contract manufacturers. Fourth, reconcile funding and valuation with cash on hand, monthly burn, runway, liquidation preferences, and milestone-linked financing. Until those records are supplied, residual exposure is high and the appropriate action is to track with explicit kill criteria rather than infer safety or traction from founder pedigree or sector momentum."
    claimRefs: [CR014, CR015, CR016]
    tableRefs: [TR003]
