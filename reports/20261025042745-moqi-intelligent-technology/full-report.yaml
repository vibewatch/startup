              - CU005
              - CU006
              - CU016
      - number: '6.3'
        title: Retention, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              There is no disclosed evidence in the assigned pool for Moqi's net revenue retention, gross retention,
              churn, renewal rate, contract length, cohort behavior, customer satisfaction, or concentration. The peer
              material illustrates why these metrics matter: industrial deployments require integration into production
              lines and continuing operational support, while a robot used for training or a public demonstration may
              create data and publicity without recurring revenue. UBTECH describes a closed loop from application to
              delivery and iterative improvement, but that is a company description of its own operating model, not
              evidence about Moqi. The same distinction applies to market forecasts and shipment claims: category growth
              can support demand plausibility, but it cannot establish customer durability. Until Moqi discloses
              signed-customer counts, active deployments, repeat orders, and revenue concentration, expansion and
              key-account risk remain open.
            claimRefs:
              - CU008
              - CU009
              - CU013
      - number: '6.4'
        title: Customer diligence conclusion
        blocks:
          - type: paragraph
            body: >-
              The strongest conclusion is asymmetric. External evidence supports a real and increasingly commercial
              customer problem in Chinese factories, logistics, service locations, and training environments; it does
              not provide a customer proof point for Moqi. The sector also has an adoption-quality risk: DirectIndustry
              records expert caution that many demonstrations remain technology demonstrators, and SCIO describes a
              national standard system that only began covering the industry's lifecycle, applications, safety, and
              ethics in 2026. For an investor, the next evidence threshold is a source-verifiable customer ledger: named
              buyer, site, task, production-versus-pilot status, units, paid terms, uptime or utilization, outcome,
              renewal or expansion, and the denominator behind every aggregate count. Harvard's review of semiconductor
              export controls also frames compute access as a policy dependency for Chinese AI developers, not as
              evidence of customer traction. Until the customer proof package is available, Moqi's customer thesis
              should be treated as unproven despite favorable category-level demand signals.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk map
        blocks:
          - type: paragraph
            body: >-
              The highest-consequence risk is physical-world execution: a general-purpose humanoid must combine
              software, actuators, sensing, human interaction, and reliable maintenance in environments where failure
              can injure people or interrupt customer operations. China's 2026 national standard system spans the
              industrial chain and lifecycle and explicitly includes safety and ethics, while industry commentary
              describes production yield, site stability, and delivered cost as the next commercialization test. These
              sources establish the external bar, not Morphi's compliance status. Morphi's disclosed founder background
              is a capability positive, but it is not evidence of product safety, certification, field reliability, or
              commercial controls. The investment implication is that the risk premium should remain high until Morphi
              discloses test protocols, incident handling, deployment conditions, and measurable operating results.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR003
              - CR009
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR009
              - CR014
      - number: '7.2'
        title: Regulatory, legal, and operating exposure
        blocks:
          - type: paragraph
            body: >-
              Regulatory exposure is moving from a future possibility toward an operating requirement. The State Council
              Information Office account says the national system covers commonality, computing, components, complete
              machines, applications, and safety and ethics, and was developed by more than 120 institutions and users.
              That breadth raises the likelihood that product design, model training, data handling, maintenance, and
              application-specific controls will be assessed together. Independent coverage of a whistleblower lawsuit
              against Figure AI also illustrates that humanoid-robot safety allegations can become litigation and
              reputational events even when the allegation concerns a competitor, not Morphi. No retained source
              establishes a Morphi lawsuit, recall, breach, or outage; that absence is a disclosure gap rather than
              evidence that none exists.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
      - number: '7.3'
        title: Dependencies, financial resilience, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Morphi is exposed to ecosystem and financing risks that are common to hardware-plus-AI businesses:
              component availability, compute and data access, manufacturing partners, customer integration, and enough
              cash to iterate through field failures. Public market intelligence describes a sector in which hardware
              scale is concentrating among a few leaders, while another industry account cites capital concentration, a
              large 2025 funding inflow, and the shutdown of some U.S. projects before mass production. Those figures
              are industry-level and should not be imputed to Morphi. A practical monitoring plan therefore needs cash
              runway, burn, unit cost, supplier concentration, deployment uptime, safety incidents, and paid pilot
              conversion. A thesis break would be a material safety event, an inability to meet applicable standards,
              repeated field failures, or financing that depends on an unverified valuation rather than operating proof.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
      - number: '7.4'
        title: Diligence priorities
        blocks:
          - type: paragraph
            body: >-
              The public record supports a focused diligence agenda rather than a conclusion that Morphi has already
              failed any control. First, obtain the product safety case: hazard analysis, operating envelope, emergency
              stop design, human-robot interaction testing, incident log, and insurance. Second, test the
              commercialization model with named paid deployments, uptime, intervention rates, customer retention, gross
              margin by unit, warranty returns, and production yield. Third, map dependencies across chips, actuators,
              batteries, cloud or edge compute, training data, and contract manufacturers. Fourth, reconcile funding and
              valuation with cash on hand, monthly burn, runway, liquidation preferences, and milestone-linked
              financing. Until those records are supplied, residual exposure is high and the appropriate action is to
              track with explicit kill criteria rather than infer safety or traction from founder pedigree or sector
              momentum.
            claimRefs:
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR014
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Safety evidence is the gating unknown
            body: >-
              The retained evidence describes sector standards and a competitor litigation example, but does not
              establish Morphi's safety testing, certification, incident history, or insurance. Treat this as a blocking
              diligence item for any deployment or valuation underwriting.
            calloutType: risk
            claimRefs:
              - CR005
              - CR007
              - CR014
          - type: callout
            title: Track until operating proof is available
            body: >-
              Do not infer low risk from founder credentials or sector growth. Require paid deployment KPIs, safety
              records, unit economics, cash runway, and dependency mapping before upgrading conviction.
            calloutType: recommendation
            claimRefs:
              - CR003
              - CR009
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The public record supports a valuation reference, not a fully underwritten price. S&P Capital IQ reports a
              CNY 1 billion angel round for Moqi Technology (Beijing) announced on July 6, 2026, with convertible
              preferred stock and more than ten participating venture institutions. Dealroom separately lists Moqi
              Intelligent Technology among July 2026 unicorns at $1 billion. Those are meaningful financing signals, but
              neither source supplies revenue, gross margin, customer count, cash balance, liquidation preferences, or a
              cap table. The recommendation is therefore track/research-more: the financing and investor participation
              are credible positive signals, while the absence of operating and preference data prevents a defensible
              intrinsic valuation or target return. Entry discipline should require verified commercial deployments,
              unit economics, runway, and security or governance terms before treating the round mark as investable
              value.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV017
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV012
              - CV017
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that Moqi is participating in a capital-rich humanoid-robotics market and reached unicorn
              status with a large syndicate, while China's standardization effort may reduce ambiguity around lifecycle,
              safety, and application requirements. The anti-thesis is that a financing mark can overstate realizable
              value when commercialization and terms are opaque. Independent comparables illustrate both sides: CNBC
              reports Physical Intelligence raised $400 million at a $2.4 billion post-money valuation, while TechNode
              reports Unitree exceeded RMB 12 billion post-money after Series C and had over RMB 1 billion of 2024
              revenue. These benchmarks are not directly interchangeable with Moqi: they involve different stages,
              products, geographies, and disclosed operating evidence. Agility's own site makes the execution bar
              concrete by describing 65,000 hours of production experience and an on-site validation process, a level of
              deployment proof not publicly demonstrated for Moqi in the assigned evidence.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: Scenarios, downside triggers, and diligence
        blocks:
          - type: paragraph
            body: >-
              A scenario framework is more reliable than a point estimate because the available valuation anchor is a
              financing event rather than a disclosed operating multiple. The base case holds the reported $1 billion
              mark as a reference only and assumes no verified revenue or customer KPI uplift. The bull case requires
              evidence of repeatable paid deployments, production reliability, and a financing or strategic event that
              validates the mark without excessive dilution. The bear case assumes the mark compresses if
              commercialization slips, hardware and deployment costs remain high, or a down round exposes preference
              overhang. The most important diligence asks are the convertible preferred-stock terms, ownership and
              liquidation preferences, cash and burn, customer contracts, safety metrics, and production economics. A
              thesis-break trigger is a new financing below the July mark without offsetting operating proof; a positive
              trigger is independently verifiable recurring deployment revenue with retention and gross-margin evidence.
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV012
              - CV013
              - CV014
              - CV015
              - CV019
      - number: '8.4'
        title: Evidence boundaries
        blocks:
          - type: paragraph
            body: >-
              Public evidence is sufficient to establish a financing and a contemporaneous unicorn classification, but
              not sufficient to establish Moqi's current revenue, ARR, runway, customer concentration, ownership
              dilution, or exit readiness. Dealroom's list is a valuation-status reference rather than a statement of
              operating performance, and the S&P Capital IQ item is an announcement record rather than a cash-available
              calculation. The comparable-company sources provide context, not a mechanically transferable multiple. The
              recommendation should move only when the missing denominators and terms are obtained from the company,
              lead investors, filings, or customer references.
            claimRefs:
              - CV017
              - CV019
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Decision
            body: >-
              Track / research-more: the $1B reference is credible enough to monitor, but public evidence does not
              support a buy without operating KPIs and financing terms.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV017
          - type: callout
            title: Thesis-break trigger
            body: >-
              A financing below the July 2026 reference without offsetting commercial proof would weaken the thesis;
              undisclosed preference and dilution terms could impair returns even if the headline mark holds.
            calloutType: risk
            claimRefs:
              - CV013
              - CV014
              - CV015
