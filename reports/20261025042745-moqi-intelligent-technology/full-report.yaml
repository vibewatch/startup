  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and adoption context
        blocks:
          - type: paragraph
            body: >-
              This analysis defines the market as embodied-intelligence robots that combine perception, planning,
              manipulation, and physical execution in human or industrial environments. Included spend covers robot
              hardware, onboard or edge AI, sensors and actuators, deployment, maintenance, data operations, and
              recurring robot-as-a-service or software layers. Excluded spend includes conventional fixed automation
              that does not need general-purpose physical adaptability, pure software assistants, and broad
              semiconductor revenue unless it is directly purchased to operate the robot. The near-term substitute set
              is not only another humanoid: specialized industrial robots, logistics automation, human labor, and
              internal process redesign can all solve parts of the same job. The market boundary therefore supports a
              deployment-led analysis rather than a single broad “AI” estimate.
            claimRefs:
              - CM001
              - CM002
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
      - number: '2.2'
        title: Evidence-constrained sizing lenses
        blocks:
          - type: paragraph
            body: >-
              Public evidence provides operating and policy proxies, not a company-specific revenue market size. China's
              Ministry of Industry and Information Technology committee described a national standard system spanning
              the humanoid lifecycle, while Xinhua reported more than 140 domestic manufacturers and more than 330
              models released in 2025. Independent industry coverage describes AGIBOT crossing 10,000 units and Unitree
              reporting more than 5,500 shipments in 2025, indicating that production capacity and fleet deployment are
              becoming measurable market variables. These figures should not be added together or treated as market
              revenue: they measure different companies, periods, and operating concepts. Figure AI's reported $39
              billion post-money valuation demonstrates investor willingness to fund the category, but valuation is not
              market size. Moqi's addressable opportunity remains an evidence gap until product price, utilization,
              customer segment, deployment geography, and repeatable unit economics are disclosed.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM018
      - number: '2.3'
        title: Buyers, users, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The most supportable initial buyer path is commercial or industrial deployment where layouts, tasks, and
              safety procedures can be bounded more tightly than in homes. The economic buyer may be an operations,
              manufacturing, logistics, facilities, or innovation leader; the user is the worker or supervisor who works
              alongside the robot; and the payer is the operating unit or central automation budget. A
              robot-as-a-service model can reduce upfront capital requirements, but the assigned evidence describes that
              model for AGIBOT and Figure AI rather than for Moqi, so it is a market mechanism, not a Moqi
              business-model fact. Adoption triggers are labor scarcity, repetitive or hazardous work, and the ability
              to reuse existing spaces. The adoption path still requires proof of task success, uptime, safety,
              maintenance cost, and payback against specialized automation or labor.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Policy standardization is a demand-enabling driver because it can reduce uncertainty around safety, data,
              and lifecycle practices; China's 2026 standard system explicitly covers application, safety, ethics,
              computing, components, and complete systems. Production acceleration and large funding rounds are
              additional ecosystem signals, but neither proves customer willingness to pay. Constraints are equally
              material: the market must close the gap between polished demonstrations and reliable long-duration
              operation, while hardware, supply chain, data acquisition, generalization, and geopolitical access all
              remain execution risks. Harvard's discussion of semiconductor export controls shows that Chinese AI
              infrastructure operates within an active technology-access constraint. The valuation implication is
              asymmetric: a large category can support strategic financing, but Moqi's valuation cannot be underwritten
              from category growth without deployment evidence and disclosed economics.
            claimRefs:
              - CM015
              - CM016
              - CM017
              - CM018
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Market is moving from demos toward deployment
            body: >-
              Production milestones, standards work, and commercial-service positioning indicate that adoption is being
              tested through repeatable environments before unconstrained household use.
            calloutType: insight
            claimRefs:
              - CM005
              - CM006
              - CM011
              - CM015
          - type: callout
            title: Underwriting assumption
            body: >-
              Any Moqi valuation case should remain contingent on disclosed task success, utilization, pricing, customer
              concentration, deployment cost, and payback evidence.
            calloutType: assumption
            claimRefs:
              - CM014
              - CM018
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and scale benchmarks
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set spans Chinese mass-production leaders, US full-stack humanoid platforms, and
              the status quo of specialized automation or internal robotics programs. Unitree and AGIBOT are the
              strongest public China scale comparators in this pool: Humanoid Index reports more than 5,500 Unitree
              units shipped in 2025, while Humanoids Daily reports AGIBOT's 10,000th unit and a fourfold acceleration
              from 5,000 to 10,000 units in three months. TrendForce independently frames both as the leading pair and
              projects them to represent nearly 80% of shipments. These are shipment or output indicators, not proof of
              profitable deployment, recurring revenue, or Morphi displacement.
            claimRefs:
