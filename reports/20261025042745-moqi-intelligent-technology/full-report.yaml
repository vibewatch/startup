        title: Capability, distribution, and buying trade-offs
        blocks:
          - type: paragraph
            body: >-
              Buyers appear to be choosing among scale, workflow integration, and the ability to support a robot after
              deployment. Unitree's reported volume and low-end G1 reference price create a hardware-cost benchmark;
              AGIBOT adds order-driven manufacturing, a rental model, and industrial partnerships; Figure provides a
              vertically integrated US alternative with Helix software, BotQ production, and BMW operating data.
              Morphi's reported thesis is different in emphasis rather than yet demonstrated outcome: coverage describes
              it as porting automotive production discipline, multi-sensor fusion, and a data loop into embodied AI.
              Public evidence in this pool does not establish realized Morphi pricing, customer retention, uptime, or
              deployment economics, so unknowns are retained rather than scored as advantages.
