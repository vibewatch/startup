        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              No assigned source reports Moqi cash on hand, monthly burn, runway, debt, project-finance obligations,
              planned use of proceeds, or the trigger for its next financing. The refresh context identifies those as
              unresolved diligence items, but it is background rather than current evidence. External industry evidence
              indicates why the missing data is material: Figure's profile says its large financing provides runway,
              while China has introduced a national humanoid-robot standard system spanning computing, components,
              complete machines, applications, safety, and ethics. Export-control research separately describes
              restrictions that can constrain access to advanced computing and create scarcity or higher prices; CSET
              separately frames semiconductors as a key input to economic and scientific progress. For Moqi, capital
              adequacy must therefore be tested against hardware scale-up, inventory and tooling needs, compute access,
              certification and safety work, and geopolitical contingencies. The financial verdict is research-more
              rather than a quantified valuation call: there is insufficient evidence to estimate revenue quality,
              margin path, or runway.
