            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP008
              - CP010
              - CP011
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP006
              - CP008
              - CP009
              - CP015
      - number: '3.3'
        title: Differentiation durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              A durable moat would require more than a capable demo: it would need reliable production, proprietary data
              from repeated real-world work, distribution or partner access, and safety and regulatory credibility.
              China's national standards system now covers commonality, computing, components, complete machines,
              applications, and safety and ethics, raising the importance of compliance execution. At the same time, the
              competitive evidence points to rapid commoditization pressure: AGIBOT is scaling, Unitree is pursuing a
              STAR Market listing, and US platforms such as Figure, Boston Dynamics, 1X, and Tesla are advancing
              commercialization. Geopolitical restrictions could also narrow the addressable customer set for Chinese
              vendors. Morphi's moat is therefore plausible but unproven until it discloses comparable production and
              field-performance evidence.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Morphi's current edge is a thesis, not a demonstrated moat
            body: >-
              Morphi's automotive-to-robotics systems thesis is strategically coherent, but the public competitor
              evidence is materially stronger on Unitree and AGIBOT production scale and on Figure's field-pilot
              disclosure.
            calloutType: insight
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP012
          - type: callout
            title: Scale can outrun differentiation
            body: >-
              If Chinese peers continue to compound production and channel access while US platforms deepen deployment
              evidence, Morphi may face price and data-network pressure before its own production proof is public.
            calloutType: risk
            claimRefs:
