  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and maturity
        blocks:
          - type: paragraph
            body: >-
              The only company-specific product description retained in this pool is a personal profile for co-founder
              and CTO Qingqiu Huang. It describes Morphi Robot as building humanoids intended to understand, adapt, and
              care for people, and says the team has in-house capabilities across hardware, data, and algorithms. The
              same profile identifies Huang's prior Huawei work across perception, prediction, end-to-end driving
              systems, VLM/VLA, and AI infrastructure. This is useful founder and direction evidence, but it is not a
              product specification: it does not name a model, SKU, customer workflow, deployment date, production
              volume, benchmark, or certification. The product should therefore be treated as an early-stage platform
              thesis rather than a verified commercial system.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE010
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE007
              - CE010
              - CE014
      - number: '5.2'
        title: Architecture direction and technical differentiation
        blocks:
          - type: paragraph
            body: >-
              A plausible architecture for Morphi's stated mission is a perception-to-action stack that combines visual
              and language representations with robot data and control outputs, but the company has not publicly
              disclosed enough detail to attribute such an implementation to Morphi. The RT-2 research provides a
              relevant technical benchmark: it co-fine-tunes a pretrained vision-language model on robotics and web
              data, represents actions as tokens, takes robot camera images, and directly predicts robot actions. In
              more than 6,000 trials, the reported system improved performance on previously unseen scenarios from 32%
              for RT-1 to 62%, and reached 90% in simulation on the Language Table suite. Those results demonstrate why
              VLA is a credible research direction, not that Morphi has reproduced them. Huawei's disclosed WEWA design
              offers a second comparator, pairing cloud generation of difficult scenarios with an on-vehicle multimodal
              action model. Huang's profile is consistent with relevant expertise, but no Morphi paper, benchmark,
              repository, or system diagram in the assigned pool closes the attribution gap.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE015
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE008
              - CE010
              - CE011
              - CE012
              - CE014
              - CE015
              - CE016
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE008
              - CE010
              - CE014
              - CE015
      - number: '5.3'
        title: Deployment, controls, and diligence risks
        blocks:
          - type: paragraph
            body: >-
              The operating environment is becoming more structured but also more demanding. China's March 2026 national
              standard system covers commonality, intelligent computing, limbs and components, complete machines and
              systems, applications, and safety and ethics; it also addresses data lifecycle and model training and
              deployment. Industry research describes 2026 as a commercialization inflection point, with component
              capacity and cost decline becoming central to scale. These are ecosystem tailwinds, not evidence that
              Morphi has passed safety or deployment gates. The assigned evidence contains no Morphi test results for
              collision avoidance, uptime, battery endurance, remote support, privacy, cybersecurity, regulatory
              approvals, or production quality. U.S. semiconductor export controls also make compute availability and
              architecture choices a relevant dependency for a China-based AI developer, although the assigned evidence
              does not establish Morphi's own chip stack. A diligence process should request a named platform bill of
              materials, safety case, incident log, security threat model, deployment references, compute plan, and
              reproducible task-level benchmarks before underwriting technical maturity.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
              - CE016
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Underwrite after technical proof, not narrative
            body: >-
              Morphi merits technical diligence because the founder background and stated full-stack direction are
              relevant, but investment or deployment confidence should wait for a named platform, reproducible
              benchmarks, production references, and safety/security documentation.
            calloutType: recommendation
            claimRefs:
              - CE001
              - CE004
              - CE009
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and use-case segmentation
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence points to industrial manufacturing and logistics as the first commercially legible
              customer segments for Chinese humanoid robots. MarketsNXT describes automotive assembly, electronics
              manufacturing, logistics, healthcare, government, and consumer use cases, while DirectIndustry
              characterizes logistics and manufacturing as the first key deployment areas. These are different buying
              motions: an automotive or factory buyer is purchasing throughput, safety, integration, and serviceability;
              a showroom or hospitality operator is purchasing visitor interaction and labor substitution; a research
              customer is purchasing a platform for experimentation. No assigned source establishes which of these
              segments Moqi serves, who signs the contract, or whether the payer is a facility, integrator, distributor,
              or end customer. That missing buyer-to-use-case mapping is material because a general-purpose humanoid
              demonstration does not establish a repeatable procurement path.
            claimRefs:
              - CU001
              - CU003
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU010
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU009
              - CU011
              - CU013
              - CU015
      - number: '6.2'
        title: Adoption trajectory and named proof
        blocks:
          - type: paragraph
            body: >-
              Peer evidence shows that the category is moving beyond demonstrations in some cases, but the quality of
              proof varies materially. UBTECH's company-issued release reports several hundred Walker S2 units entering
              mass production and delivery, orders exceeding 800 million yuan since early 2025, and collaborations with
              named automotive, logistics, and electronics companies. DirectIndustry gives a more cautious read on the
              sector: it reports customer deployments for AgiBot while also quoting an academic expert who says many
              public examples should not be interpreted as robots ready for large-scale industrial deployment. Humanoids
              Daily reports AgiBot's 10,000-unit milestone and lists logistics, hospitality, and industrial
              environments, but the article is not evidence that Moqi has matched those volumes. The assigned sources
              contain no named Moqi customer, production pilot, unit shipped, utilization statistic, or independently
              verified outcome.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU010
              - CU014
              - CU016
