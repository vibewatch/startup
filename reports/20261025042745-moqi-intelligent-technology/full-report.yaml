        title: Exhibits
        blocks:
          - type: callout
            title: The largest financial blocker is disclosure, not a missing decimal
            body: >-
              Without realized pricing, paid utilization, gross margin, cash, burn, and runway, an apparent production
              or funding milestone cannot be translated into investable cash generation.
            calloutType: risk
