  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and operating model
        blocks:
          - type: paragraph
            body: >-
              Shenzhen Moqi Intelligent Technology Co., Ltd. was registered in the Qianhai Shenzhen-Hong Kong
              Cooperation Zone in Shenzhen on August 27, 2025. The available company profile describes its business
              scope as intelligent-robot research and development, sales, and technical services, with a focus on
              general-purpose humanoid robots. Its stated technical approach combines a native visual-action model with
              a world model to support embodied perception, decision-making, and cross-scenario generalization. The same
              profile says the company had launched an initial embodied-intelligence prototype by April 2026 and
              intended to start in commercial settings such as hotel room service and last-mile logistics before
              pursuing household use. These are company-profile assertions rather than independently audited operating
              results; no source in the assigned pool establishes paid deployments, revenue, unit economics, or customer
              retention.
