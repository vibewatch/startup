              - CP003
              - CP011
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model remains unproven
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not provide a Moqi price sheet, customer contract, revenue disclosure, ARR,
              GMV, utilization rate, or revenue-recognition policy. That makes a conventional software-style ARR or
              revenue multiple inappropriate. The most decision-useful public comparator is Figure AI: Sacra describes a
              recurring deployment model in which customers avoid a large upfront purchase and expansion depends on
              fleet growth and geographic rollout, while a separate market profile still characterizes revenue as
              undisclosed or only estimated from early pilots. That distinction matters for Moqi: a prototype, shipment,
              pilot, or financing announcement is not revenue, and a list price is not realized revenue or gross margin.
              The current financial conclusion is therefore conditional: Moqi may ultimately monetize hardware sales,
              rental, service contracts, software, or a hybrid, but the public record supplied here cannot determine the
              mix or quality of those streams.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
      - number: '4.2'
        title: Cost and unit-economics drivers
        blocks:
          - type: paragraph
            body: >-
              Humanoid economics are dominated by the conversion of engineering capability into reliable, repeatable
              field work. Figure's comparator evidence gives useful boundaries but not a Moqi forecast: one profile
              cites a target price of $20,000-$30,000 and a $1,000 monthly service concept, while also warning that
              utilization, reliability, and maintenance determine whether the arithmetic works. A separate market
              profile reports Unitree at more than 5,500 units shipped in 2025, while Humanoids Daily reports an AGIBOT
              rental offer of EUR 899 per day. These figures illustrate scaled supply and a service-price signal, but
              they are competitor observations rather than Moqi costs or realized prices. Moqi's gross margin, bill of
              materials, warranty reserve, service labor, manufacturing yield, depreciation, working capital, and
              customer acquisition cost remain unverified. A credible model therefore needs per-unit contribution after
              service and replacement costs, not just a robot sticker price or production target.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI015
          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI015
