      - number: '1.3'
        title: Milestones, ecosystem constraints, and evidence gaps
        blocks:
          - type: paragraph
            body: >-
              The company has moved quickly from incorporation to financing, prototype development, subsidiary
              formation, and a stated commercial-entry plan. The timeline is notable for capital formation arriving
              before public evidence of scaled production or customer outcomes. Industry context raises both opportunity
              and execution requirements: China's 2026 national standard system spans computing, complete machines,
              applications, safety, and ethics, while public industry coverage highlights the difficulty of moving from
              controlled demonstrations to reliable real-world operation. Export controls and geopolitical restrictions
              can also affect advanced-computing access for Chinese embodied-AI companies, although the assigned
              evidence does not show a Moqi-specific restriction or incident. The central diligence question is
              therefore whether the financing and technical ambition convert into repeatable deployments, measurable
              safety, and disclosed commercial traction.
