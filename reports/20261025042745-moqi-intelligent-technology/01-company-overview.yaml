chapter:
  number: 1
  title: Company Overview
  summary: Moqi Intelligent Technology is a Shenzhen embodied-intelligence startup founded in August 2025 around general-purpose humanoid robots and a visual-action/world-model architecture. Public evidence supports a well-funded founding team and a commercial-first path, but does not establish revenue, customers, cash runway, or demonstrated deployment performance.
sections:
  - id: identity-and-product
    title: Identity, product, and operating model
    body: >-
      Shenzhen Moqi Intelligent Technology Co., Ltd. was registered in the Qianhai
      Shenzhen-Hong Kong Cooperation Zone in Shenzhen on August 27, 2025. The
      available company profile describes its business scope as intelligent-robot
      research and development, sales, and technical services, with a focus on
      general-purpose humanoid robots. Its stated technical approach combines a
      native visual-action model with a world model to support embodied
      perception, decision-making, and cross-scenario generalization. The same
      profile says the company had launched an initial embodied-intelligence
      prototype by April 2026 and intended to start in commercial settings such
      as hotel room service and last-mile logistics before pursuing household
      use. These are company-profile assertions rather than independently audited
      operating results; no source in the assigned pool establishes paid
      deployments, revenue, unit economics, or customer retention.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-capital
    title: Founders, governance, and financing
    body: >-
      The founding narrative centers on Gao Wenli, identified as founder,
      chairman, and manager, and Huang Qingqiu, described as co-founder and a
      former Huawei autonomous-driving AI leader. The public profile also names
      Fu Yue and Cao Wei as directors and describes an employee ownership
      platform alongside institutional investors. It reports a RMB900 million
      angel round in December 2025, a February 2026 pre-A round, and cumulative
      angel-series financing above RMB1 billion with a post-money valuation above
      RMB7 billion by July 2026. A separate article repeats the above-RMB1
      billion and above-RMB7 billion figures but uses promotional language and
      does not provide a term sheet, cap table, or audited financial statement.
      Accordingly, the financing scale is best treated as reported private-market
      information, while ownership economics, board rights, liquidation
      preferences, debt, cash balance, and runway remain open diligence items.
    claimRefs: [CO005, CO006, CO007, CO008, CO009]
    tableRefs: [TO002, TO003]
  - id: milestones-and-risk
    title: Milestones, ecosystem constraints, and evidence gaps
    body: >-
      The company has moved quickly from incorporation to financing, prototype
      development, subsidiary formation, and a stated commercial-entry plan. The
      timeline is notable for capital formation arriving before public evidence of
      scaled production or customer outcomes. Industry context raises both
      opportunity and execution requirements: China's 2026 national standard
      system spans computing, complete machines, applications, safety, and
      ethics, while public industry coverage highlights the difficulty of moving
      from controlled demonstrations to reliable real-world operation. Export
      controls and geopolitical restrictions can also affect advanced-computing
      access for Chinese embodied-AI companies, although the assigned evidence
      does not show a Moqi-specific restriction or incident. The central
      diligence question is therefore whether the financing and technical
      ambition convert into repeatable deployments, measurable safety, and
      disclosed commercial traction.
    claimRefs: [CO010, CO011, CO012, CO013, CO014]
    figureRefs: [FO001]
callouts:
  - calloutType: strength
    title: Founder and financing signal
    body: The available evidence points to a technically credible founding narrative and unusually large early private financing for a company incorporated in 2025, but the financing claims remain unaudited in the assigned sources.
    claimRefs: [CO005, CO007, CO008]
  - calloutType: risk
    title: Commercial proof is not yet established
    body: No assigned source establishes named paying customers, revenue, cash runway, production volume, safety performance, or a completed commercial deployment, so valuation and execution confidence should remain limited.
    claimRefs: [CO014]
