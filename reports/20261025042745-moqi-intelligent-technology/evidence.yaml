evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: commercial-traction
    missingEvidence: Audited or management-provided revenue, customer contracts, pilot results, production volume, and deployment KPIs.
    whyItMatters: >-
      The company is valued on reported financing momentum, but public evidence does not yet demonstrate repeatable
      commercial demand or operating scale.
    diligencePath: >-
      Request a customer and deployment schedule, signed pilot summaries, revenue recognition policy, unit shipments,
      uptime, task-success, and safety metrics under NDA.
    relatedQuestionRefs:
      - QO005
      - QO008
  - type: private-evidence-only
    severity: material
    topic: financing
    missingEvidence: Round documents, cap table, investor rights, debt, cash balance, burn, and runway.
    whyItMatters: >-
      Reported financing and valuation figures do not show how much capital is available for execution or what
      governance and liquidation terms apply.
    diligencePath: >-
      Obtain the latest capitalization table, subscription agreements, board materials, bank balance, monthly burn, and
      24-month operating plan.
    relatedQuestionRefs:
      - QO004
      - QO009
      - QO010
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: Complete executive, board, beneficial-owner, and key-person succession information.
    whyItMatters: >-
      The public narrative concentrates technical and operating credibility in two founders, making dependency and
      governance important underwriting variables.
    diligencePath: >-
      Request the current organization chart, board minutes, founder vesting and IP assignments, succession coverage,
      and key-person retention arrangements.
    relatedQuestionRefs:
      - QO003
      - QO010
  - type: stale
    severity: minor
    topic: geopolitical-risk
    missingEvidence: >-
      Current company-specific assessment of export-control exposure, component sourcing, and access to advanced
      computing.
    whyItMatters: >-
      General China AI export-control analysis does not prove a restriction on Moqi, but the issue could affect model
      training, inference hardware, or international expansion.
    diligencePath: >-
      Obtain legal and procurement review of applicable controls, suppliers, model-compute dependencies, and contingency
      plans.
    relatedQuestionRefs:
      - QO007
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-TO002
    missingEvidence: A complete public leadership and beneficial-ownership enumeration for TO002.
    whyItMatters: The table is explicitly partial and should not be read as a complete governance or ownership register.
    diligencePath: Request the latest corporate registry extract, board roster, executive roster, and beneficial-owner schedule.
    relatedQuestionRefs:
      - QO003
      - QO010
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-TO003
    missingEvidence: A complete public investor, commercial-counterparty, and standards-stakeholder map for TO003.
    whyItMatters: >-
      The table combines named parties with an ecosystem stakeholder and is intentionally partial; undisclosed terms
      could change control and diligence priorities.
    diligencePath: Request the cap table, investor rights, customer and partner list, and compliance ownership matrix.
    relatedQuestionRefs:
      - QO004
      - QO007
      - QO010
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: blocking
    topic: sizing-gap
    missingEvidence: >-
      Moqi-specific price, target segment, deployment geography, utilization, customer pipeline, and unit-economics
      data.
    whyItMatters: >-
      Without these denominators, category production counts and peer valuations cannot be converted into SAM, SOM,
      revenue potential, or payback.
    diligencePath: >-
      Obtain a management market model with explicit segment, geography, price, utilization, cost, and adoption
      assumptions, reconciled to signed pilots or orders.
    relatedQuestionRefs:
      - QM004
      - QM009
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyer-segments
    missingEvidence: Named Moqi customers, pilots, orders, delivery volumes, task KPIs, and budget owners.
    whyItMatters: >-
      The proposed commercial-service adoption path is plausible but cannot yet demonstrate demand, repeatability, or
      willingness to pay for Moqi.
    diligencePath: >-
      Request customer references, pilot statements of work, deployment logs, task-success and uptime data, pricing, and
      renewal or expansion evidence.
    relatedQuestionRefs:
      - QM005
      - QM006
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: Morphi-commercial-proof
    missingEvidence: >-
      Named Morphi customers, production volumes, realized pricing, uptime, safety metrics, and switching-cost evidence
      comparable to the peer disclosures.
    whyItMatters: >-
      Without comparable field and unit-economics evidence, the systems-engineering thesis cannot be separated from a
      well-funded but unvalidated entrant.
    diligencePath: >-
      Request customer references, pilot contracts, production and yield data, service-level metrics, realized pricing,
      and deployment-level ROI from Morphi and its investors.
    relatedQuestionRefs:
      - QP004
      - QP005
      - QP006
      - QP007
  - type: private-evidence-only
    severity: blocking
    topic: revenue-disclosure
    missingEvidence: Moqi realized revenue by product, customer, geography, and recognition policy.
    whyItMatters: >-
      Without revenue quality and mix, production, pilot, and financing signals cannot support a valuation or margin
      conclusion.
    diligencePath: >-
      Request monthly revenue bridge, signed order forms, customer concentration, contract terms, and
      revenue-recognition memo.
    relatedQuestionRefs:
      - QI001
      - QI003
    relatedTableRefs:
      - TI001
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Moqi cash balance, burn, runway, debt, and use of proceeds.
    whyItMatters: Humanoid hardware scale-up can consume cash before recurring revenue and may require additional financing.
    diligencePath: >-
      Request latest management accounts, 18-month cash forecast, debt schedule, capex plan, and board-approved
      financing plan.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Moqi list and realized pricing, service scope, utilization, warranty, and support economics.
    whyItMatters: Comparator pricing is not a Moqi price and cannot establish gross margin or payback.
    diligencePath: Obtain a redacted customer proposal, price book, deployment KPI pack, and unit contribution bridge.
    relatedQuestionRefs:
      - QI002
      - QI004
      - QI005
    relatedTableRefs:
      - TI002
  - type: missing-source
    severity: material
    topic: compute-risk
    missingEvidence: Moqi's chip sourcing, compute access, compliance controls, and contingency plan.
    whyItMatters: Export controls and standards can change cost, schedule, and addressable market.
    diligencePath: Map every critical compute component to supplier, jurisdiction, export classification, lead time, and substitute.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: blocking
    topic: product-maturity
    missingEvidence: >-
      A named Morphi platform specification, production status, customer deployment list, and task-level benchmark with
      denominators.
    whyItMatters: >-
      Without a verifiable platform and deployment baseline, product maturity and commercial readiness cannot be
      underwritten.
    diligencePath: >-
      Request a dated product brief, live deployment references, benchmark logs, and an evidence-backed roadmap from
      management.
    relatedQuestionRefs:
      - QE001
      - QE002
      - QE004
  - type: private-evidence-only
    severity: material
    topic: architecture
    missingEvidence: A Morphi architecture diagram, model card, training-data description, and hardware bill of materials.
    whyItMatters: >-
      The VLA research comparator demonstrates feasibility in general, but does not establish Morphi's implementation,
      costs, or performance.
    diligencePath: >-
      Obtain a technical diligence pack covering perception, policy, actuation, compute, data, update, and rollback
      paths.
    relatedQuestionRefs:
      - QE003
      - QE005
  - type: missing-source
    severity: material
    topic: trust-and-safety
    missingEvidence: >-
      Safety case, cybersecurity threat model, privacy controls, incident log, certification status, and
      reliability/uptime data.
    whyItMatters: >-
      Humanoid deployment exposes users and sites to physical, cyber, privacy, and compliance risks that marketing
      claims cannot resolve.
    diligencePath: >-
      Require independent safety and security testing, red-team results, incident response procedures, and applicable
      certification records.
    relatedQuestionRefs:
      - QE004
      - QE006
  - type: conflicting-data
    severity: material
    topic: adoption-risk
    missingEvidence: >-
      Independent evidence that claimed embodied-AI performance translates into sustained customer deployments and
      acceptable buyer satisfaction.
    whyItMatters: Sector-level production growth can coexist with weak demand, pilots, or low operational satisfaction.
    diligencePath: Interview named customers and obtain production-versus-pilot utilization, repeat-use, failure, and renewal data.
    relatedQuestionRefs:
      - QE004
      - QE006
  - type: missing-source
    severity: blocking
    topic: named-moqi-proof
    missingEvidence: >-
      A current Moqi customer or partner source naming the buyer, site, task, deployment status, units, and commercial
      terms.
    whyItMatters: >-
      Without a named deployment, category demand and peer evidence cannot establish that Moqi has paid adoption or
      production readiness.
    diligencePath: >-
      Obtain signed-customer references, deployment acceptance records, invoices or contracts, and permission to contact
      at least two current users.
    relatedQuestionRefs:
      - QU001
      - QU003
      - QU006
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: retention
    missingEvidence: >-
      Moqi cohort, renewal, churn, contract-duration, utilization, and repeat-order data with denominators and reporting
      periods.
    whyItMatters: Humanoid demonstrations and one-off pilots can create visibility without durable recurring revenue or expansion.
    diligencePath: >-
      Request a customer cohort schedule, logo and revenue retention bridge, contract terms, repeat-order history, and
      top-customer concentration.
    relatedQuestionRefs:
      - QU002
      - QU008
  - type: enumeration-incomplete
    severity: material
    topic: customer-segments
    missingEvidence: >-
      A complete or explicitly bounded Moqi customer segmentation by buyer, payer, geography, vertical, channel, and use
      case.
    whyItMatters: >-
      The correct sales motion, procurement friction, and concentration risk differ sharply between factory, service,
      research, and channel customers.
    diligencePath: >-
      Reconcile CRM and revenue records to a customer-segment table and disclose the population boundary, date, and
      denominator.
    relatedTableRefs:
      - TU001
  - type: missing-source
    severity: minor
    topic: customer-outcomes
    missingEvidence: Independent customer outcome evidence for uptime, throughput, quality, labor substitution, safety, or payback.
    whyItMatters: Peer shipment and order announcements do not prove that a humanoid deployment creates measurable customer value.
    diligencePath: >-
      Collect customer-authored case studies, acceptance tests, operating logs, and third-party validation for each
      named production site.
    relatedQuestionRefs:
      - QU003
      - QU007
  - type: private-evidence-only
    severity: blocking
    topic: safety
    missingEvidence: >-
      Morphi safety case, certification or conformity assessment, operating envelope, incident log, emergency-stop
      testing, and insurance.
    whyItMatters: >-
      Humanoid robots operate around people and the retained regulatory evidence makes safety and ethics lifecycle
      requirements explicit.
    diligencePath: >-
      Obtain the signed safety case, test reports, conformity mapping, claims history, and insurance certificates from
      management and counsel.
    relatedQuestionRefs:
      - QR001
      - QR007
    relatedTableRefs:
      - TR002
  - type: missing-source
    severity: material
    topic: commercialization
    missingEvidence: Named paid deployments with uptime, intervention, conversion, warranty, yield, and unit-economics denominators.
    whyItMatters: >-
      Sector scale and competitor shipment claims do not prove that Morphi's product is reliable or economically
      deployable.
    diligencePath: >-
      Request customer references, deployment logs, pilot contracts, production yield reports, and unit-level
      gross-margin bridge.
    relatedQuestionRefs:
      - QR005
      - QR009
  - type: private-evidence-only
    severity: material
    topic: financing
    missingEvidence: >-
      Cash on hand, monthly burn, runway, use of proceeds, cap table, liquidation preferences, and milestone financing
      conditions.
    whyItMatters: >-
      Hardware-plus-AI iteration can consume capital before commercial proof, and sector evidence describes financing
      concentration and bubble risk.
    diligencePath: >-
      Obtain the latest management accounts, 18-month cash plan, financing documents, and board-approved operating
      milestones.
    relatedQuestionRefs:
      - QR006
      - QR008
  - type: missing-source
    severity: material
    topic: dependencies
    missingEvidence: >-
      Named suppliers, second-source coverage, compute access, training-data rights, and contract-manufacturer
      concentration.
    whyItMatters: Component, compute, and data constraints can delay deployment or make capability gains uneconomic.
    diligencePath: >-
      Review the bill of materials, supplier contracts, qualification status, data licenses, and compute procurement
      plan.
    relatedQuestionRefs:
      - QR004
  - type: missing-source
    severity: material
    topic: operating-metrics
    missingEvidence: Verified revenue, paid deployments, gross margin, retention, uptime, and unit economics for Moqi.
    whyItMatters: >-
      Without operating denominators, the financing mark cannot be converted into an evidence-supported valuation
      multiple or return case.
    diligencePath: >-
      Obtain monthly management accounts, customer contracts, deployment logs, and unit-economic cohort data under
      diligence.
    relatedQuestionRefs:
      - QV003
      - QV006
    relatedTableRefs:
      - TV003
  - type: private-evidence-only
    severity: material
    topic: financing-terms
    missingEvidence: Cap table, conversion mechanics, liquidation preferences, board rights, cash balance, burn, and runway.
    whyItMatters: >-
      Headline funding and valuation can overstate common-equity value and do not show how much capital is available for
      execution.
    diligencePath: >-
      Request the signed term sheet, capitalization table, investor-rights schedule, bank statements, and a 24-month
      cash plan.
