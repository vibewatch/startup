chapter:
  number: 6
  title: Customers
  summary: Publicly available evidence in the assigned pool describes a rapidly forming Chinese humanoid-robot market and named deployments by peers, but it does not identify a verified Moqi customer, paid deployment, retention metric, or expansion motion. The investable customer question therefore remains proof of production use and repeatable economics, not evidence of category demand alone.
sections:
  - id: customer-segments
    title: Buyer, user, and use-case segmentation
    body: >-
      The assigned evidence points to industrial manufacturing and logistics as the first
      commercially legible customer segments for Chinese humanoid robots. MarketsNXT describes
      automotive assembly, electronics manufacturing, logistics, healthcare, government, and
      consumer use cases, while DirectIndustry characterizes logistics and manufacturing as the
      first key deployment areas. These are different buying motions: an automotive or factory
      buyer is purchasing throughput, safety, integration, and serviceability; a showroom or
      hospitality operator is purchasing visitor interaction and labor substitution; a research
      customer is purchasing a platform for experimentation. No assigned source establishes which
      of these segments Moqi serves, who signs the contract, or whether the payer is a facility,
      integrator, distributor, or end customer. That missing buyer-to-use-case mapping is material
      because a general-purpose humanoid demonstration does not establish a repeatable procurement
      path.
    claimRefs: [CU001, CU003]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-and-proof
    title: Adoption trajectory and named proof
    body: >-
      Peer evidence shows that the category is moving beyond demonstrations in some cases, but
      the quality of proof varies materially. UBTECH's company-issued release reports several
      hundred Walker S2 units entering mass production and delivery, orders exceeding 800 million
      yuan since early 2025, and collaborations with named automotive, logistics, and electronics
      companies. DirectIndustry gives a more cautious read on the sector: it reports customer
      deployments for AgiBot while also quoting an academic expert who says many public examples
      should not be interpreted as robots ready for large-scale industrial deployment. Humanoids
      Daily reports AgiBot's 10,000-unit milestone and lists logistics, hospitality, and
      industrial environments, but the article is not evidence that Moqi has matched those
      volumes. The assigned sources contain no named Moqi customer, production pilot, unit
      shipped, utilization statistic, or independently verified outcome.
    claimRefs: [CU004, CU005, CU006, CU007, CU010, CU014, CU016]
    tableRefs: [TU002, TU003]
  - id: durability-and-expansion
    title: Retention, expansion, and concentration
    body: >-
      There is no disclosed evidence in the assigned pool for Moqi's net revenue retention,
      gross retention, churn, renewal rate, contract length, cohort behavior, customer
      satisfaction, or concentration. The peer material illustrates why these metrics matter:
      industrial deployments require integration into production lines and continuing operational
      support, while a robot used for training or a public demonstration may create data and
      publicity without recurring revenue. UBTECH describes a closed loop from application to
      delivery and iterative improvement, but that is a company description of its own operating
      model, not evidence about Moqi. The same distinction applies to market forecasts and
      shipment claims: category growth can support demand plausibility, but it cannot establish
      customer durability. Until Moqi discloses signed-customer counts, active deployments,
      repeat orders, and revenue concentration, expansion and key-account risk remain open.
    claimRefs: [CU008, CU009, CU013]
  - id: diligence-implications
    title: Customer diligence conclusion
    body: >-
      The strongest conclusion is asymmetric. External evidence supports a real and increasingly
      commercial customer problem in Chinese factories, logistics, service locations, and
      training environments; it does not provide a customer proof point for Moqi. The sector also
      has an adoption-quality risk: DirectIndustry records expert caution that many demonstrations
      remain technology demonstrators, and SCIO describes a national standard system that only
      began covering the industry's lifecycle, applications, safety, and ethics in 2026. For an
      investor, the next evidence threshold is a source-verifiable customer ledger: named buyer,
      site, task, production-versus-pilot status, units, paid terms, uptime or utilization,
      outcome, renewal or expansion, and the denominator behind every aggregate count. Harvard's
      review of semiconductor export controls also frames compute access as a policy dependency
      for Chinese AI developers, not as evidence of customer traction. Until the customer proof
      package is available, Moqi's customer thesis should be treated as unproven despite favorable
      category-level demand signals.
    claimRefs: [CU010, CU011, CU012, CU013, CU015]
