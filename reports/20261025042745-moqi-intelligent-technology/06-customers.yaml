figures:
  - id: FU001
    title: Customer proof path from category demand to repeatable expansion
    type: journey-map
    summary: "The evidence supports a staged diligence path from segment fit through production deployment and repeat purchase, with Moqi-specific proof missing after category-level demand."
    data:
      nodes:
        - id: segment
          label: Segment fit
          description: "Factory, logistics, service, or research buyer and use case"
          touchpoints: ["Buyer identified", "Task and procurement owner specified"]
        - id: pilot
          label: Pilot or evaluation
          description: "Named site and defined task before production acceptance"
          touchpoints: ["Pilot status disclosed", "Baseline and success metric disclosed"]
        - id: production
          label: Production deployment
          description: "Robots operating in a customer workflow rather than a demonstration"
          touchpoints: ["Units and site disclosed", "Production versus pilot status verified"]
        - id: outcome
          label: Measured outcome
          description: "Operational result tied to a denominator and time period"
          touchpoints: ["Utilization or uptime", "Labor, throughput, quality, or safety outcome"]
        - id: renewal
          label: Renewal or repeat order
          description: "Evidence of durability and customer willingness to expand"
          touchpoints: ["Renewal or repeat purchase", "Contract duration and expansion disclosed"]
        - id: concentration
          label: Portfolio durability
          description: "Customer mix and concentration after multiple deployments"
          touchpoints: ["Top-customer share", "Revenue and deployment diversification"]
    approximationNotes: "This is an evidence-stage sequence, not a measured conversion funnel; no stage rate or elapsed time is inferred."
    claimRefs: [CU009, CU011, CU013, CU015]
