callouts:
  - calloutType: risk
    title: The largest financial blocker is disclosure, not a missing decimal
    body: Without realized pricing, paid utilization, gross margin, cash, burn, and runway, an apparent production or funding milestone cannot be translated into investable cash generation.
    claimRefs: [CI003, CI009, CI014]
  - calloutType: insight
    title: Scale can increase both operating leverage and exposure
    body: Comparator evidence shows that higher production may improve cost position, but standards, compute restrictions, safety work, and field service can increase the capital required to reach repeatable margins.
    claimRefs: [CI007, CI011, CI012, CI013, CI015, CI016]
