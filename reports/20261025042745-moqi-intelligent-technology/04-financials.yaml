chapter:
  number: 4
  title: Financials
  summary: Publicly available evidence does not disclose Moqi's realized revenue, pricing, cash balance, burn, runway, or unit economics. External humanoid benchmarks show why underwriting should focus on conversion from production scale to paid utilization, while standards and compute-supply constraints may raise costs or constrain addressable markets.
sections:
  - id: revenue-and-monetization
    title: Revenue model remains unproven
    body: >-
      The assigned evidence does not provide a Moqi price sheet, customer contract,
      revenue disclosure, ARR, GMV, utilization rate, or revenue-recognition policy.
      That makes a conventional software-style ARR or revenue multiple inappropriate.
      The most decision-useful public comparator is Figure AI: Sacra describes a
      recurring deployment model in which customers avoid a large upfront purchase
      and expansion depends on fleet growth and geographic rollout, while a separate
      market profile still characterizes revenue as undisclosed or only estimated
      from early pilots. That distinction matters for Moqi: a prototype, shipment,
      pilot, or financing announcement is not revenue, and a list price is not
      realized revenue or gross margin. The current financial conclusion is therefore
      conditional: Moqi may ultimately monetize hardware sales, rental, service
      contracts, software, or a hybrid, but the public record supplied here cannot
      determine the mix or quality of those streams.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
  - id: operating-economics
    title: Cost and unit-economics drivers
    body: >-
      Humanoid economics are dominated by the conversion of engineering capability
      into reliable, repeatable field work. Figure's comparator evidence gives useful
      boundaries but not a Moqi forecast: one profile cites a target price of
      $20,000-$30,000 and a $1,000 monthly service concept, while also warning that
      utilization, reliability, and maintenance determine whether the arithmetic
      works. A separate market profile reports Unitree at more than 5,500 units
      shipped in 2025, while Humanoids Daily reports an AGIBOT rental offer of
      EUR 899 per day. These figures illustrate scaled supply and a service-price
      signal, but they are competitor observations rather than Moqi costs or realized
      prices. Moqi's gross margin, bill of materials, warranty reserve, service
      labor, manufacturing yield, depreciation, working capital, and customer
      acquisition cost remain unverified. A credible model therefore needs per-unit
      contribution after service and replacement costs, not just a robot sticker
      price or production target.
    claimRefs: [CI005, CI006, CI007, CI008, CI015]
    tableRefs: [TI002]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and underwriting verdict
    body: >-
      No assigned source reports Moqi cash on hand, monthly burn, runway, debt,
      project-finance obligations, planned use of proceeds, or the trigger for its
      next financing. The refresh context identifies those as unresolved diligence
      items, but it is background rather than current evidence. External industry
      evidence indicates why the missing data is material: Figure's profile says
      its large financing provides runway, while China has introduced a national
      humanoid-robot standard system spanning computing, components, complete
      machines, applications, safety, and ethics. Export-control research separately
      describes restrictions that can constrain access to advanced computing and
      create scarcity or higher prices; CSET separately frames semiconductors as a
      key input to economic and scientific progress. For Moqi, capital adequacy must
      therefore be tested against hardware scale-up, inventory and tooling needs,
      compute access, certification and safety work, and geopolitical contingencies.
      The financial verdict is research-more rather than a quantified valuation
      call: there is insufficient evidence to estimate revenue quality, margin path,
      or runway.
    claimRefs: [CI009, CI010, CI011, CI012, CI013, CI014, CI016]
    tableRefs: [TI003]
    figureRefs: [FI001]
