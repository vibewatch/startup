    claimRefs: [CP012, CP013, CP014, CP015, CP016]

callouts:
  - calloutType: insight
    title: Morphi's current edge is a thesis, not a demonstrated moat
    body: "Morphi's automotive-to-robotics systems thesis is strategically coherent, but the public competitor evidence is materially stronger on Unitree and AGIBOT production scale and on Figure's field-pilot disclosure."
    claimRefs: [CP005, CP006, CP007, CP012]
  - calloutType: risk
    title: Scale can outrun differentiation
    body: "If Chinese peers continue to compound production and channel access while US platforms deepen deployment evidence, Morphi may face price and data-network pressure before its own production proof is public."
    claimRefs: [CP002, CP003, CP011, CP014]

