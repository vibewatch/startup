chapter:
  number: 3
  title: Competitors
  summary: Morphi enters a rapidly scaling humanoid field where Unitree and AGIBOT provide the clearest China-based scale benchmarks, while Figure illustrates a heavily funded US full-stack alternative. The evidence supports a systems-engineering differentiation hypothesis, but public proof of Morphi's deployments, pricing, and production scale remains limited.
sections:
  - id: landscape
    title: Competitive landscape and scale benchmarks
    body: >-
      The relevant competitive set spans Chinese mass-production leaders, US full-stack
      humanoid platforms, and the status quo of specialized automation or internal
      robotics programs. Unitree and AGIBOT are the strongest public China scale
      comparators in this pool: Humanoid Index reports more than 5,500 Unitree units
      shipped in 2025, while Humanoids Daily reports AGIBOT's 10,000th unit and a
      fourfold acceleration from 5,000 to 10,000 units in three months. TrendForce
      independently frames both as the leading pair and projects them to represent
      nearly 80% of shipments. These are shipment or output indicators, not proof of
      profitable deployment, recurring revenue, or Morphi displacement.
    claimRefs: [CP001, CP002, CP003, CP004]
    tableRefs: [TP001]
  - id: capability-and-buying
    title: Capability, distribution, and buying trade-offs
    body: >-
      Buyers appear to be choosing among scale, workflow integration, and the ability
      to support a robot after deployment. Unitree's reported volume and low-end G1
      reference price create a hardware-cost benchmark; AGIBOT adds order-driven
      manufacturing, a rental model, and industrial partnerships; Figure provides a
      vertically integrated US alternative with Helix software, BotQ production, and
      BMW operating data. Morphi's reported thesis is different in emphasis rather
      than yet demonstrated outcome: coverage describes it as porting automotive
      production discipline, multi-sensor fusion, and a data loop into embodied AI.
      Public evidence in this pool does not establish realized Morphi pricing,
      customer retention, uptime, or deployment economics, so unknowns are retained
      rather than scored as advantages.
    claimRefs: [CP005, CP006, CP007, CP008, CP009]
    tableRefs: [TP002, TP003]
  - id: moat-and-risk
    title: Differentiation durability and displacement risk
    body: >-
      A durable moat would require more than a capable demo: it would need reliable
      production, proprietary data from repeated real-world work, distribution or
      partner access, and safety and regulatory credibility. China's national
      standards system now covers commonality, computing, components, complete
      machines, applications, and safety and ethics, raising the importance of
      compliance execution. At the same time, the competitive evidence points to
      rapid commoditization pressure: AGIBOT is scaling, Unitree is pursuing a STAR
      Market listing, and US platforms such as Figure, Boston Dynamics, 1X, and
      Tesla are advancing commercialization. Geopolitical restrictions could also
      narrow the addressable customer set for Chinese vendors. Morphi's moat is
      therefore plausible but unproven until it discloses comparable production and
      field-performance evidence.
    claimRefs: [CP010, CP011, CP012, CP013, CP014, CP015]
    figureRefs: [FP001]

