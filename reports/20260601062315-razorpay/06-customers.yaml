- id: section-4
  title: 'Public durability evidence is mixed: useful G2 adoption proof exists, but support complaints are visible and cohort data is absent'
  body: |-
    Among public third-party customer signals, G2 is the most useful positive datapoint. The Razorpay profile shows a 4.2/5 rating across 106 reviews, a one-month implementation period, and ten-month ROI based on reviewer averages. Review text indicates merchants use payment links daily, appreciate broad payment options, and value recurring or international-payment support. That is not enough to prove retention in the venture-investing sense, but it does show real production use across small-business, mid-market, and enterprise reviewers.

    Trustpilot pulls in the opposite direction. The archived page rates Razorpay 1.4/5 and features repeated complaints about slow support, held funds, poor dispute handling, and delayed follow-up. G2 also includes negative commentary about support quality, analytics download delays, and hard approval flows for international payments. The synthesis is straightforward: there is real product adoption, but the main public durability risk is service quality rather than apparent lack of demand. What is still missing is hard cohort evidence—NRR, GRR, churn, or active-merchant retention by segment.
  claimRefs:
