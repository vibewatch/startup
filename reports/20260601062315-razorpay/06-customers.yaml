- calloutType: risk
  title: Support quality is the clearest public retention risk because cohort economics are not disclosed
  body: G2 proves real usage, but Trustpilot and parts of G2 also show held-fund complaints, dispute friction, and support dissatisfaction. Without NRR, churn, or active-merchant data, it is hard to tell whether these are edge cases or a structural SMB retention issue.
  claimRefs:
