- id: section-3
  title: Go-to-market is ecosystem-led through self-serve docs, platform integrations, and product-led expansion
  body: |-
    Razorpay's GTM appears highly ecosystem-led. The docs, SDKs, and dashboard-key setup support self-serve onboarding, while partner integrations on the app store show distribution through merchant software that already owns workflow context. Shopify and WooCommerce are direct commerce-entry points for online stores, while Shiprocket links Razorpay to logistics-heavy Indian ecommerce sellers shipping domestically and internationally. Payment Links and Subscriptions extend that reach beyond cart-led ecommerce into services, collections, and recurring billing models.

    This means Razorpay can win customers without a heavy field-sales motion for every merchant. The product can be discovered inside a commerce stack, a developer flow, or a finance workflow and then expand into payouts or banking later. The trade-off is that support quality and integration reliability become part of GTM efficiency. When a product is sold through self-serve and ecosystem channels, poor support resolution can quietly damage conversion and retention across the long tail of merchants.
