- id: TU006
  title: Competitive / channel benchmark table
  columns:
  - provider
  - merchant proof style
  - segment focus
  - channel strength
  - implication for Razorpay
  rows:
  - - Razorpay
    - Official POS testimonials plus Apple Pay/exporter launches
    - Broad SMB to mid-market, D2C, offline, exporters, finance ops
    - Docs, app-store integrations, product-led cross-sell
    - Breadth is strong, but retention and concentration disclosure is thin
  - - PhonePe
    - Named customer quotes from redBus, EaseMyTrip, and GIVA
    - Indian commerce and travel merchants
    - Large domestic payments network and consumer brand familiarity
    - Raises competition for Indian digital-commerce merchants and checkout share
  - - PayPal
    - International-payments business pitch for merchants
    - Exporters and globally oriented SMEs
    - Cross-border acceptance and fee-led international positioning
    - Keeps pressure on Razorpay's exporter segment economics
  - - Pine Labs
    - Omnichannel infrastructure positioning
    - Offline retail and omnichannel merchants
    - POS-led distribution into physical commerce
    - Direct competition against Razorpay POS expansion
  - - Adyen
    - Global enterprise stack narrative
    - Large international enterprises
    - Global scale and centralized control stack
    - Sets a higher benchmark if Razorpay wants larger enterprise accounts
  - - PayU
    - D2C and ecommerce-specific payment and RTO messaging
    - Indian D2C and ecommerce merchants
    - Category-specific positioning for checkout and conversion
    - Competes for the same D2C merchants targeted by Razorpay's conversion narrative
  - - CCAvenue
    - Multi-surface payment positioning
    - Indian ecommerce and app merchants
    - Website, in-app, TapPay, and invoice collection surfaces
    - Shows that Razorpay is not the only broad checkout workflow in India
  - - Paytm
    - UPI-heavy merchant payments positioning
    - India-first merchants and shopkeepers
    - Strong UPI familiarity and consumer brand spillover
    - Competes for domestic checkout mindshare, especially in UPI-centric flows
  - - Mastercard / Visa
    - Global network and ecosystem brands
    - Large merchants and payment ecosystems
    - Global payment network trust and reach
    - Shows merchant procurement often spans network, processor, and aggregator relationships
  notes: This benchmark focuses on customer-facing proof and distribution posture rather than pricing. It is intended to frame channel and segment risk visible from public sources.
