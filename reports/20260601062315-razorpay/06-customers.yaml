callouts:
- calloutType: strength
  title: Razorpay has credible land-and-expand merchant proof across online, offline, and exporter flows
  body: The customer evidence is not limited to logo walls. POS testimonials describe daily production usage, Apple Pay names live brands, and exporter / Curlec launches show adjacent cohorts that can be monetized from the same platform.
  claimRefs:
