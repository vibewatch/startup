- id: section-2
  title: Named customer proof is strongest in D2C brands, omnichannel retail, and exporter workflows
  body: |-
    Razorpay does publish real customer proof, but it is concentrated in a few visible segments. The POS page includes direct testimonials from Amazon Pay, Nestasia, Juicy Chemistry, and Lenskart. Those quotes are valuable because they describe production usage rather than generic logo walls: Amazon Pay references scaling to millions of daily transactions, Nestasia speaks to acceptance reliability, Juicy Chemistry cites rollout across stores, and Lenskart highlights secure verification plus EMI-driven flexibility. On the online and cross-border side, the Apple Pay launch identifies Mokobara, Akasa Air, Pernia’s Pop-Up Shop, Sabyasachi, Nish Hair, and House of Masaba as brands already using the capability.

    Exporter and regional proof is more cohort-shaped than logo-shaped. Razorpay's Amazon Global Selling release addresses 150,000-plus Indian exporters, and Curlec positions Malaysian merchants such as KUALESA to sell in India while settling locally. The pattern is clear: public proof is real, but it clusters in branded consumer merchants, exporters, and Malaysia-facing ecommerce rather than in fully disclosed large-enterprise rosters. Older case studies broaden that proof set: Furlenco says RazorpayX cut refund-related complaint volume by 70%, PaisaBazaar says eMandate lowered registration cost by 70% per customer, and FreshToHome says the team went live in two days with Razorpay's documentation and support.
