acknowledgedWarnings:
- dimension: figureType
  reason: The planned retention cohort figure requires time-bucketed percentage retention data that Razorpay does not publicly disclose. TU004 captures the strongest available public durability evidence and the exact diligence asks needed to replace it with a real cohort view.
