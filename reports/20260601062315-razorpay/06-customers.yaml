- id: section-5
  title: Expansion potential is real, but concentration and competitive risk remain under-disclosed
  body: |-
    The public customer story supports expansion in three directions: cross-sell from gateway into finance operations, sector expansion from D2C into offline retail and exporters, and geographic expansion from India into Malaysia and Singapore. FY25 coverage strengthens that interpretation because independent reporting cites POS, banking, and international operations as growth drivers alongside the gateway. That said, the company still discloses customer mix at a very high level. Investors do not get active-merchant counts, segment-level revenue, concentration by top customer, or geography-by-geography merchant contribution.

    Competition also varies by segment. PhonePe shows named Indian commerce customers, PayPal remains relevant for exporters and international acceptance, Pine Labs is strong in omnichannel point of sale, and Adyen is a more global enterprise benchmark. Against that backdrop, Razorpay's breadth is compelling—but the lack of hard concentration and retention data means the expansion story is still better evidenced in logos and product launches than in cohort economics.
