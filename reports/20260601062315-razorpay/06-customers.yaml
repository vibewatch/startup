company:
  name: Razorpay
chapter:
  number: 6
  title: Customers & Go-To-Market
  summary: 'Razorpay publicly frames its customer base as 8M+ businesses and shows meaningful proof across D2C ecommerce, offline merchants, exporters, and Southeast Asian merchants rather than a single narrow merchant vertical. The strongest named proof comes from official POS testimonials (Amazon Pay, Nestasia, Juicy Chemistry, Lenskart), Apple Pay launch customers (Mokobara, Akasa Air, Pernia’s Pop-Up Shop, Sabyasachi, Nish Hair, House of Masaba), and Curlec''s Malaysia positioning. Distribution is heavily ecosystem-led through docs, self-serve APIs, and app-store integrations such as Shopify, WooCommerce, and Shiprocket. Durability evidence is mixed: G2 shows usable product-market fit and implementation speed, but Trustpilot and parts of G2 also surface support quality, payment holds, and dispute friction, while public materials still omit active-merchant counts, cohort retention, NRR/GRR, and top-customer concentration.'
sections:
- id: section-1
  title: Merchant base spans D2C, offline retail, exporters, and finance workflows rather than one narrow niche
  body: |-
    Razorpay's public positioning suggests an unusually broad merchant mix for an India-first fintech stack. The docs and home page say the group serves more than 8 million businesses, while the product surface itself implies multiple customer archetypes: online checkout merchants, service and social-commerce sellers using payment links, recurring-revenue businesses on subscriptions, offline merchants on POS, exporters collecting international proceeds, and finance teams adopting RazorpayX for payouts or current-account-linked workflows. The public evidence is strongest for SMB and mid-market breadth rather than for a few disclosed giant enterprise accounts.

    This matters for GTM because it means Razorpay is not trying to win only one buyer persona. It can enter through payment acceptance, then expand into operations, payouts, or banking as merchants scale. The weakness is disclosure quality: the 8 million-plus figure is a top-line merchant headline, not an active-customer metric, and the fetched materials do not break that base by size, segment, geography, or product attachment.
  claimRefs:
  - CU001
  - CU002
  - CU003
