  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, logo churn, cohort retention, and merchant-vintage behavior by product line.
    whyItMatters: Public review data shows adoption and complaints, but it cannot substitute for cohort economics when evaluating customer durability.
    diligencePath: Request monthly active merchants, TPV retention by cohort, logo churn, NRR, and GRR segmented by product and merchant size.
    relatedQuestionRefs:
    - QU016
    - QU017
  - type: missing-source
    severity: material
    topic: active-merchants
    missingEvidence: Active merchant count, product attach rates, and share of the 8M-plus headline base that is currently processing volume.
    whyItMatters: A total business count is not enough to judge monetization quality or the size of Razorpay's paying customer base.
    diligencePath: Ask management for monthly active merchants, revenue-generating merchants, and attach by gateway, POS, payouts, and subscriptions.
    relatedQuestionRefs:
    - QU002
    - QU023
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer, top-segment, and top-geography concentration data for revenue or TPV.
    whyItMatters: The expansion story could be compelling or fragile depending on whether a few large cohorts or geographies dominate economics.
    diligencePath: Request top-10 customer contribution, segment revenue mix, India vs ex-India split, and concentration by payment vertical.
    relatedQuestionRefs:
    - QU018
    - QU025
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: A broader named-customer roster across enterprise, platform, and finance-op buyers beyond the current public testimonials and launch references.
    whyItMatters: Current named proof is strongest in visible consumer brands and POS case snippets, which may overrepresent certain merchant segments.
    diligencePath: Request customer references segmented by D2C, enterprise, platforms, exporters, offline retail, and Southeast Asia.
    relatedTableRefs:
    - TU003
    relatedQuestionRefs:
    - QU007
    - QU024
