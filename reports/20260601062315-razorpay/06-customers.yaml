tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - segment
  - buyer / user / payer
  - use case
  - adoption proof
  - strategic value
  - diligence gap
  rows:
  - - D2C ecommerce brands
    - Founder-led commerce teams and payment ops
    - Checkout, cross-border payments, Apple Pay, payment links
    - Named brands on Apple Pay launch plus homepage logos
    - High logo visibility and cross-sell into subscriptions, payouts, and banking
    - No segment TPV, retention, or ASP disclosed
  - - Service and link-based SMBs
    - Owners or finance admins
    - Collect ad hoc payments via links and reminders
    - Payment Links feature set plus G2 small-business usage comments
    - Large long-tail merchant pool and low-friction onboarding
    - No active-merchant or churn data for link-only merchants
  - - Recurring-revenue merchants
    - Ops, billing, or subscription managers
    - Cards, UPI, eMandate, and international-card recurring billing
    - Subscriptions page and UPI AutoPay history
    - Deepens retention if billing sticks inside the stack
    - No renewal-success or involuntary-churn metrics
  - - Offline / omnichannel merchants
    - Store ops, retail finance, or franchise teams
    - POS acceptance, billing, loyalty, EMI, omnichannel reconciliation
    - Amazon Pay, Nestasia, Juicy Chemistry, and Lenskart POS testimonials
    - Expands Razorpay beyond online checkout into daily in-store volume
    - No disclosed device base, merchant count, or same-store retention
  - - Exporters and cross-border sellers
    - Founder / finance teams on Amazon or brand exports
    - Apple Pay, international collections, Amazon exporter settlement
    - Apple Pay launch and Amazon exporter release
    - Higher-value segment with cross-border monetization potential
    - No public exporter GMV, approval rate, or repeat-rate disclosure
  - - Malaysia and Southeast Asia merchants
    - Local ecommerce merchants and finance teams
    - Accept India-origin payments and regional real-time payments
    - Curlec positioning and Singapore expansion
    - Creates regional beachhead beyond India
    - Merchant counts and local net retention are undisclosed
  notes: Segments are derived from public product pages, named-customer proof, and 2025 launches. Razorpay discloses segment breadth better than segment economics.
