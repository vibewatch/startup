  - - PhonePe Business
    - Domestic merchant-acquisition challenger
    - Gateway plus merchant dashboard and UPI AutoPay support; named merchants include redBus, EaseMyTrip and GIVA
    - UPI-heavy merchants, travel, commerce and fast-growing consumer brands
    - Strong domestic payment familiarity and merchant examples
    - Retained pages show less banking / treasury breadth than RazorpayX-style workflows
  - - Paytm Business
    - Consumer-brand-led merchant-acquisition incumbent
    - Digital onboarding, 100+ payment methods, intelligent routing, and flexible settlements on the gateway page
    - SMBs, ecommerce sellers, and merchants wanting a familiar Paytm checkout
    - Consumer brand familiarity plus merchant-acceptance tooling
    - Retained page exposes less treasury and operating-stack breadth than Razorpay
  - - PayU India
    - Checkout and ecommerce incumbent
    - All-in-one checkout, payments and RTO messaging for D2C / ecommerce
    - Ecommerce and D2C merchants
    - Easy integrations and flexibility in payment modes
    - Retained surface is lighter on adjacent operating-suite breadth
  - - CCAvenue
    - Legacy omnichannel processor
    - Website, in-app, invoice, social, QR and TapPay support with routing / retry tools
    - Enterprise, ecommerce and omnichannel merchants
    - Very broad acceptance-method coverage and routing depth
    - Brand feels more processor-centric than business-operating-stack centric
  - - Pine Labs
    - Offline and omnichannel incumbent
    - POS, payment gateway, prepaid, credit and fintech infrastructure
    - Offline-first chains and merchants needing device-led distribution
    - Strong offline footprint and merchant-acquiring relationships
    - Retained home page exposes less detail on online-banking-style adjacencies
  - - Adyen
    - Global enterprise processor
    - €1.4T processed annually, 150+ currencies / local methods, 99.999% uptime
    - Large domestic and cross-border enterprises
    - Global orchestration, treasury and reliability narrative
    - Likely heavier fit for large enterprise accounts than SME merchants
  - - Stripe
    - Global developer-led processor
    - 100+ payment methods, online plus in-person, 195+ countries
    - SaaS, digital exporters and API-led merchants
    - Developer ergonomics and international expansion tooling
    - Less localized India-first operating-suite positioning than Razorpay
  - - PayPal
    - Cross-border business-payments substitute
    - Online and in-person business payments plus international collections focus
    - SMB exporters and international sellers
    - Strong export and cross-border merchant recognition
    - Domestic full-stack banking / payout breadth is less visible on retained page
