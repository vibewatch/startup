- id: pricing-distribution-and-multi-homing
  title: Pricing, distribution, and multi-homing
  body: |-
    The public record is stronger on packaging than on realized economics, but pricing transparency is no longer uniformly absent. PhonePe's dedicated gateway pricing page now advertises a promotional 1.95% offer with zero setup, hidden, and annual charges, while Adyen and Stripe both maintain public pricing pages that describe fee structure and modular product coverage. That does not solve the real diligence gap—negotiated MDR, routing economics, and attach rates remain private—but it does mean Razorpay is more exposed than before when it keeps its own public rate card opaque. Paytm's gateway page also sharpens domestic competition by marketing digital onboarding, 100+ payment methods, intelligent routing, and flexible settlement choices even without disclosing a full numeric MDR table on the retained page.

    Distribution power is similarly uneven. PhonePe can point to named merchant examples and a more explicit price-led gateway pitch; Paytm leans on a familiar consumer payments brand; Pine Labs enters through devices and merchant relationships; Adyen, Stripe, and PayPal ride global merchant expectations and export workflows; and Razorpay tries to answer with a broader stack and expanding Southeast Asian footprint. Those conditions lower structural lock-in. Merchants can keep one gateway for domestic UPI-heavy collections, another for exporters or SaaS billing, and a different offline partner for in-store acceptance. Because most rivals now cover the same core modes—UPI, cards, wallets, net banking, recurring, and at least some payout or business-finance adjacency—the competitive fight shifts toward orchestration quality, settlement experience, support, transparent commercial framing, and the merchant's preferred channel rather than one irreplaceable product feature.
