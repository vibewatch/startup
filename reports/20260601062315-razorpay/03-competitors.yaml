chapter:
  number: 3
  title: Competitors
  summary: Razorpay competes from unusually broad product scope in India, but breadth alone is not a durable moat. Domestic peers such as PhonePe, PayU, CCAvenue, and Pine Labs attack checkout, offline acceptance, and merchant distribution, while Adyen, Stripe, and PayPal raise the ceiling on cross-border reach and enterprise-grade orchestration. The practical competitive risk is not one rival winning every deal; it is merchants multi-homing across similar rails while judging Razorpay on support quality, pricing opacity, and execution in adjacent products.
sections:
- id: landscape-and-market-structure
  title: Landscape and market structure
  body: |-
    Razorpay does not compete in a single neat payment-gateway category any more. Its own official surfaces now bundle payment gateway, POS, subscriptions, current accounts, payouts, escrow, capital, and cross-border flows, so the relevant rival set spans domestic online-payment aggregators, offline and omnichannel incumbents, and global processors that matter once a merchant begins exporting or selling beyond India. The RBI's 2025 payments report shows why that matters: UPI already accounts for 85.5% of transaction volume, UPI QR infrastructure is vastly larger than POS terminals, and the rails themselves are increasingly public and interoperable. In that environment, product breadth, orchestration, compliance posture, merchant workflow integration, and adjacent financial tooling matter more than access to one exclusive payment method.

    Regulation further fragments the market. RBI reporting separates payment aggregators by online, cross-border, and physical categories, which means the relevant alternative for a domestic D2C merchant is not identical to the alternative for a marketplace exporter or an offline-first chain. PayPal appears on the cross-border authorisation list while Stripe India appears on the returned-application list, underscoring that some rivals compete through cross-border or offshore setups rather than the same domestic PA stack. The result is a layered competitive field: PhonePe and Paytm pressure domestic merchant acquisition, PayU and CCAvenue remain ecommerce-oriented incumbents, Pine Labs matters for omnichannel distribution, and Adyen, Stripe, and PayPal become stronger substitutes when merchants need global reach or enterprise-grade treasury and payout workflows. The status quo option is also not just "build internally"; it includes merchants assembling shared rails, transparent processor pricing, and channel partners instead of betting on one full-stack suite.
