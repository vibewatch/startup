- id: product-breadth-and-peer-profiles
  title: Product breadth and peer profiles
  body: |-
    Razorpay's main strength is breadth. Its about page still frames the company as a full-stack money-movement platform for businesses, and the current product surfaces extend that claim into payment gateway, POS, subscriptions, RazorpayX business banking, current accounts, payouts, escrow, cross-border tools, and capital products. The dedicated /payments/ page widens that picture further by listing QR, instant settlement, invoices, smart collect, TokenHQ, Optimizer, Magic Checkout, UPI AutoPay, tax payments, digital lending, capital, and payroll alongside the core gateway stack. That breadth matters commercially because it lets Razorpay pitch a merchant on acceptance, disbursals, operations, and some financing adjacencies in one relationship rather than one checkout plugin.

    But the peer set shows that breadth is increasingly contested rather than unique. PhonePe now has a dedicated payment-gateway page and public pricing surface, Paytm markets onboarding, routing, and settlement flexibility for online sellers, PayU emphasizes checkout for D2C and ecommerce, CCAvenue competes on a wide bouquet of payment options and routing features, and Pine Labs still matters wherever offline distribution or device-led acquisition is the wedge. For larger or more international merchants, Adyen, Stripe, and PayPal raise the bar on global methods, enterprise reliability, omnichannel support, and international settlement. Razorpay's support disclosures also reveal an important caveat: some banking-like adjacencies still ride partner-bank licences rather than Razorpay's own charter, so the stack is broad but not fully vertically owned. That makes Razorpay strongest when a merchant values one India-centric operating relationship, but less differentiated when the buyer prioritizes transparent pricing, global reach, or specialist best-of-breed tools for one workflow.
