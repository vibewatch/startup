  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: Realized MDR, negotiated pricing bands, and attach rates for Razorpay gateway, POS, subscriptions, and exporter tools by merchant cohort.
    whyItMatters: Without realized economics, it is impossible to test whether breadth actually produces superior share-of-wallet or just a wider but low-yield SKU surface.
    diligencePath: Request cohort-level pricing schedules, blended take rates, and attach-rate data by merchant size and product line for FY25-FY26.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: win-loss-data
    missingEvidence: Merchant switching, churn, and win-loss evidence showing where Razorpay loses or gains share against PhonePe, PayU, CCAvenue, Pine Labs, Stripe, or PayPal.
    whyItMatters: Support complaints and product overlap are directionally useful, but they do not quantify whether the company is defending or losing merchant share in the most contested cohorts.
    diligencePath: Ask management for win-loss logs, pipeline stage data, churn reasons, and merchant-migration examples by segment and channel partner.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP004
