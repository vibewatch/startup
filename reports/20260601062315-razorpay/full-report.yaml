  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Dimension
      - Bull thesis
      - Anti-thesis
      - What would change the view
    rows:
      - - Revenue scale
        - FY25 revenue scale proves Razorpay is a serious late-stage fintech.
        - Revenue alone does not show normalized earnings quality or entry economics.
        - Audited segment bridge and cash-flow detail would strengthen the bull case.
      - - Platform breadth
        - Gateway, banking, POS, payroll, cards, lending, and escrow imply many monetisation levers.
        - Breadth can also hide weak subscale lines and create operational opacity.
        - Product-level margin disclosure would show whether breadth compounds value.
      - - IPO momentum
        - Named bankers and active IPO prep suggest a real listing path.
        - IPO readiness is not the same as IPO-grade disclosure.
        - A filed prospectus or equivalent audited pack would narrow the gap.
      - - Public comp support
        - Global payments platforms prove that large market values are possible in this category.
        - Those platforms are larger, more mature, and more disclosed than Razorpay.
        - Stronger disclosure would justify borrowing more from global comp logic.
      - - India comp support
        - Razorpay can plausibly deserve a premium to commodity gateway peers because it is broader.
        - Paytm already gives public investors a listed India payments benchmark below the private headline.
        - Clearer take-rate and margin evidence could justify a premium versus Paytm.
      - - Filing evidence
        - Entity snapshots at least show legal capital structure and some financials.
        - They are too incomplete and entity-specific to support direct valuation.
        - Entity-to-product mapping would make filings far more decision-useful.
    notes: >-
      The anti-thesis is driven primarily by disclosure quality and price discipline, not by disbelief that Razorpay has
      a real franchise.
