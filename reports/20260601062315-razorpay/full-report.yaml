        - id: n2
          label: Onboarding / payout friction rises
          detail: More KYC steps, slower approvals, or escrow delays.
        - id: n3
          label: Support burden increases
          detail: More tickets, escalations, manual reviews, and merchant dissatisfaction.
        - id: n4
          label: Merchant trust weakens
          detail: Complaints and slower resolution hurt retention and referrals.
        - id: n5
          label: Growth efficiency falls
          detail: Lower conversion and higher servicing cost compress operating leverage.
        - id: n6
          label: IPO / valuation pressure
          detail: Investors haircut growth durability and governance confidence.
