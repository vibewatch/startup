      - number: '7.4'
        title: Financial-model and IPO-execution risk remain material despite strong topline growth
        blocks:
          - type: paragraph
            body: >-
              Razorpay’s FY25 narrative is strong enough to prevent a simplistic “capital-starved fintech” bear case. ET
              and Moneycontrol both report 65% consolidated revenue growth to Rs 3,783 crore and higher gross profit,
              which is meaningful proof of scale. But the same reporting also shows a Rs 1,209 crore loss tied to ESOP,
              restructuring, and redomiciling costs, while Inc42 says India profitability is still expected only in FY26
              and consolidated profitability later. That leaves investors with a classic late-stage ambiguity: topline
              proof is strong, but sustainable earnings quality is still being normalised during a legal-entity and
              listing transition. The filing snapshots deepen that ambiguity because entity-level Tofler numbers look
              nothing like the consolidated media headline, which implies that investors will need a precise map from
              legal entity to operating segment before they can underwrite margins or liabilities cleanly. IPO
              preparation intensifies, rather than removes, this risk. Moneycontrol’s $700 million-plus syndicate story
              and PL Capital’s much lower valuation-scenario framing together show that price expectations are already
              wider than the public evidence base really supports.
