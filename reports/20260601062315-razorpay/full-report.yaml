companyProfile:
  summary: >-
    Razorpay is an Indian merchant-fintech company founded by Harshil Mathur and Shashank Kumar and headquartered in
    Bengaluru. What began as a developer-led online payment gateway has expanded into a wider business-finance stack
    that now includes payment links, subscriptions, POS, payouts, current-account and treasury-style workflows through
    RazorpayX, payroll, lending-adjacent infrastructure, escrow, and cross-border merchant products, with Curlec in
    Malaysia and a public push into Southeast Asia. Public evidence supports real scale—8M+ businesses served, FY25
    consolidated revenue of ₹3,783 crore, and a live IPO preparation process—but still leaves meaningful gaps on
    normalized profitability, legal-entity reconciliation, merchant quality, and current financing terms.
