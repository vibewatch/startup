      - number: '5.4'
        title: The 2025 roadmap concentrated on cross-border, AI-assisted integrations, and omnichannel uptime
        blocks:
          - type: paragraph
            body: >-
              Razorpay's 2025 launch cadence shows a clear theme: move up-market and cross-border while making
              integrations easier. In March the company announced Singapore expansion after Malaysia; later that month
              it launched zero-forex collections for 150,000-plus Amazon exporters. In April it unveiled MCP Server with
              a claim that AI-native products can connect to payments in 15 minutes rather than months. In June Razorpay
              POS launched self-healing software intended to resolve device issues proactively. In September Apple Pay
              went live for Indian businesses doing cross-border transactions, and in October Curlec and NPCI
              International moved UPI acceptance into Malaysia.


              The roadmap is coherent. Razorpay is trying to make its stack more global, more developer-accessible, and
              more reliable in-store. It is also trying to turn product breadth into segment-specific workflows for
