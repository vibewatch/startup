            title: Razorpay Has Become a Multi-Product Operating Layer, Not Just a Gateway
            body: >-
              The strongest strategic evidence is not one metric but the breadth of monetisable workflows now attached
              to the core gateway: payment links, subscriptions, POS, payouts, payroll, business banking, lending-tech,
              and cross-border corridors. That breadth raises switching costs and gives Razorpay multiple avenues to
