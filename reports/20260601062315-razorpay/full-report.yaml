  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and FY25 traction
        blocks:
          - type: paragraph
            body: >-
              Razorpay's official product surfaces make the revenue model look much broader than a pure payment-gateway
              company. The retained official pages span gateway acceptance, offline POS, subscriptions, RazorpayX
              business banking, current accounts, payouts, escrow, exporter flows, and international expansion through
              Curlec and Singapore. That matters because the company is no longer pitching only one monetization lever.
              The business can plausibly earn transaction revenue, subscription or platform fees, payout and
              banking-style workflow fees, escrow and compliance-related income, and cross-border or forex-linked
              charges. Management's FY25 commentary reinforces that reading by explicitly saying the growth mix came
              from payments gateway, POS, loyalty, RazorpayX, and international operations.


              Public FY25 reporting confirms real scale, not just product sprawl. Moneycontrol, The Economic Times,
              Business Standard, MediaNama, and Inc42 all converge on consolidated FY25 revenue of ₹3,783 crore versus
              ₹2,296 crore in FY24, with gross profit rising to ₹1,277 crore from ₹906 crore. Those are meaningful
              numbers for a still-private company. Just as important, management said the core online-payments business
              is now EBITDA-profitable and generating strong cash flows while newer businesses are scaling. That implies
              the underwriting question is no longer whether Razorpay has monetization avenues; it is whether those
              newer lines produce durable, high-quality revenue or merely add complexity and implementation cost around
              a still-opaque core.
