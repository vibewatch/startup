  - id: TV006
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Audited filing disappoints
        - Prospectus or diligenced filing shows lower take rates, weaker margins, or poor working-capital quality
        - Undercuts the premium implied by private valuation headlines
        - Move to avoid or require reprice toward bear range.
      - - IPO process slips materially
        - Listing is delayed without a compensating disclosure upgrade
        - Turns the momentum case into a waiting-cost problem
        - Reduce conviction and demand better entry price.
      - - Cap table / preferences are adverse
        - Late diligence reveals stack complexity, ratchets, or poor new-money economics
        - Headline valuation overstates true investor economics
        - Re-underwrite on fully diluted and preference-adjusted terms.
      - - Service or regulatory shock emerges
        - Support, trust, or compliance issue flares during IPO prep
        - Raises discount rate and weakens durability assumptions
        - Treat as thesis break until issue is quantified and remediated.
      - - Product breadth proves low-quality
        - Segment data shows breadth adds revenue but not durable profit
        - Destroys the “full-stack premium” argument
        - Value closer to narrow-payment peers, not broad-infra peers.
    notes: >-
      Triggers are phrased as monitorable events that would change the price one should be willing to pay, not as
      generic business risks.
    claimRefs:
      - CV037
      - CV039
      - CV040
      - CV045
      - CV046
      - CV047
  - id: TV007
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Diligence path
    rows:
      - - Audited filing package
        - Audited FY25 / FY26 financials, accounting policies, and legal-entity scope
        - Core requirement for moving from narrative range to underwritable valuation
        - Request draft prospectus, auditor package, or banker model workbook.
      - - Cap table and preferences
        - Current ownership, preference stack, conversion mechanics, and dilution overhang
        - Headline valuation can differ materially from real new-money economics
        - Review cap-table counsel memo and latest financing documents.
      - - Entity-to-product bridge
        - How gateway, banking, POS, payroll, cards, lending, and escrow map into reporting entities
        - Explains why public entity snapshots diverge from consolidated press numbers
        - Request legal-entity map and product revenue bridge used for IPO prep.
      - - Segment profitability
        - Take rates, gross margins, opex, and loss profile by product line
        - Determines whether breadth deserves a premium or a discount
        - Review segment P&L and monthly management dashboard.
      - - Governance and controls
        - Board composition, committees, risk ownership, and regulatory correspondence
        - Valuation needs governance confidence as much as growth confidence
        - Request governance pack, risk committee material, and outside counsel summaries.
      - - Public market readiness
        - Use-of-proceeds, listing timeline, disclosure cadence, and investor-education materials
        - Determines whether current valuation talk is actionable or just narrative
        - Ask bankers for IPO timetable, key diligence workstreams, and draft messaging.
    notes: These asks are the minimum evidence package required to upgrade from track to buy at a premium valuation.
    claimRefs:
      - CV013
      - CV037
      - CV041
