  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    summary: >-
      Representative merchant flow from integration to acceptance, settlement, and workflow expansion inside the
      Razorpay stack.
    data:
      nodes:
        - id: discover
          label: Merchant chooses entry surface
          description: Merchant starts with gateway, links, subscriptions, POS, or exporter flow
        - id: integrate
          label: Developer / ops integration
          description: Keys, docs, SDKs, or dashboard-based setup connect merchant workflows to Razorpay
        - id: accept
          label: Payments accepted
          description: Online checkout, links, recurring billing, in-store POS, or cross-border collections go live
        - id: settle
          label: Money movement and operations
          description: Payouts, current accounts, escrow, bank verification, and tax / payroll workflows attach
        - id: expand
          label: Cross-sell and regional expansion
          description: Merchant adds Apple Pay, exporter collections, Singapore or Malaysia flows, or lending modules
