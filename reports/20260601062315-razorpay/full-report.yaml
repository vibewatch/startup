      - number: '3.4'
        title: Moat durability and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              Razorpay's moat is therefore conditional rather than automatic. The company can credibly argue that it
              combines domestic payment acceptance, operating workflows, recurring payments, offline POS, exporter
              tooling, and some capital products in one India-native stack. That is valuable, especially for startups
              and SMEs that would rather not stitch together several vendors. But the public evidence still does not
              support a conclusion that breadth alone protects the company. Core rails are shared, rival products
              overlap materially, and some of Razorpay's banking-like adjacencies rely on partner-bank licences rather
              than proprietary regulated infrastructure. At the same time, public pricing cues from PhonePe, Adyen, and
              Stripe reduce the degree to which category opacity itself can function as a defensive screen.


              The most visible adverse signal is trust and support, not product coverage. The archived Trustpilot page
              rates Razorpay poorly and highlights support complaints, while the archived G2 profile suggests merchants
              can still realize relatively fast implementation and ROI. That combination is important: it points to a
              platform whose product value can be real, but whose merchant-experience reputation is not uniformly
              strong. Without public win-loss data or realized pricing by segment, the cleanest read is that Razorpay
              remains a credible full-stack leader in India, but one whose durability depends on execution quality,
              cross-sell success, and channel effectiveness more than on proprietary control of payments infrastructure.
