        title: Mitigations are visible, but the decisive diligence asks are still external to public evidence
        blocks:
          - type: paragraph
            body: >-
              Razorpay is not a case where mitigations are invisible. The company does have formal authorisation, a
              broader governance narrative, product-level engineering investment, and credible backers. But none of
              those facts close the most decision-relevant gaps. Public sources still do not reveal regulator
              correspondence, exam findings, remediation backlog, outage histories, support SLAs, false-positive freeze
              rates, product-level profitability, or the exact mapping from consolidated numbers to operating entities.
              That means the most important kill criteria must be event-driven rather than precision-modeled. A new RBI
              or bank-partner restriction, a pattern of merchant-support failures, or evidence that cross-border and
              banking-adjacent products are scaling faster than controls would all matter more than another generic
              growth headline. The investment implication is that Razorpay’s risks are manageable only if diligence
