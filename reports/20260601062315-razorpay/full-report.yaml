        - label: Core online payments
          values:
            - label: high
              tone: positive
              detail: Core business is clearly identified and management says it is EBITDA-profitable
            - label: medium
              tone: neutral
              detail: Gross profit is public, but product-level margins are not
            - label: low-medium
              tone: neutral
              detail: No consolidated working-capital or chargeback detail
            - label: low
              tone: positive
              detail: Management implies the core unit is self-funding
        - label: POS and omnichannel
          values:
            - label: medium
              tone: neutral
              detail: POS is named in FY25 growth drivers
            - label: low
              tone: warning
              detail: No device, servicing, or blended-margin disclosure
            - label: low
              tone: warning
              detail: No hardware-capital or settlement exposure published
            - label: medium
              tone: neutral
              detail: Could require more working capital than gateway software
        - label: RazorpayX, current accounts, payouts, escrow
          values:
            - label: medium
              tone: neutral
              detail: Product presence is clear and management says RazorpayX is scaling
            - label: low
              tone: warning
              detail: Revenue share, float, and compliance-cost economics are undisclosed
            - label: low-medium
              tone: warning
              detail: Public sources do not map partner-bank or contingent exposures
            - label: medium
              tone: neutral
              detail: Could be sticky if operationally embedded, but economics are not public
        - label: Cross-border and exporter products
          values:
            - label: medium
              tone: neutral
              detail: Official product momentum is visible through exporter and Singapore launches
            - label: low-medium
              tone: warning
              detail: Promotional savings do not reveal steady-state FX margin
            - label: low
              tone: warning
              detail: No country-level or settlement-balance disclosures
            - label: medium
              tone: neutral
              detail: Expansion can improve growth but may require added compliance investment
        - label: Group-level financial disclosure
          values:
            - label: medium
              tone: neutral
              detail: FY25 topline and gross profit are public through media summaries
            - label: low
              tone: negative
              detail: No product-level margin, ARR, CAC, or retention disclosure
            - label: medium
              tone: neutral
              detail: Entity-level filing data exists, but consolidated cash and runway do not
            - label: medium
              tone: warning
              detail: IPO may relieve optionality pressure, but valuation reset risk remains
    approximationNotes: >-
      The matrix rates disclosure and financing pressure qualitatively from retained public evidence; it is not a
      substitute for audited segment reporting.
