      - number: '4.2'
        title: Cost structure and unit economics
        blocks:
          - type: paragraph
            body: >-
              The public record is strongest on topline momentum and weakest on unit economics. The FY25 disclosures
              tell us revenue, gross profit, and reported loss, but they do not give ARR, GMV, take rate, net revenue
              retention, CAC, payback, or gross margin by product line. Even so, product mix lets us infer some
              cost-structure direction. A company selling gateway acceptance, offline POS, subscriptions, payouts,
              escrow, exporter services, and international expansion is carrying more operational complexity than a
              one-SKU processor. Compliance, dispute handling, settlement operations, merchant support, partner-bank
              coordination, and cross-border servicing are all likely to matter to cost of revenue and operating
              expense.


              The balance-sheet-style Tofler dashboard adds useful but imperfect color. It shows the main Indian entity
              with ₹1,763.1 crore of cash and cash equivalents, ₹4,906.9 crore of assets, ₹3,771.9 crore of net worth,
              and no borrowings as of March 2025. But the same dashboard also shows revenue figures that do not line up
              with the consolidated FY25 press reporting, which means the filing view is entity-level rather than a
              clean consolidated picture. That mismatch is analytically important. It tells us Razorpay probably has
              enough financial complexity across entities and product lines that an investor cannot safely extrapolate
              steady-state margins from one data point. Public evidence is therefore good enough to say the company is
              scaled and relatively liquid, but not good enough to quantify normalized unit economics.
