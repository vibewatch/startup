      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: UPI Makes the Market Huge by Usage, Not Automatically by Revenue Pool
            body: >-
              RBI’s data shows why simple “payments market size” narratives can mislead. UPI owns most transaction
              volume, but only a single-digit share of system value in H2 CY2025. That means gateways need software
              value, merchant workflow depth, and adjacent finance products to capture durable economics.
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM032
          - type: callout
            title: Regulated Crowding Will Keep Price Pressure High
            body: >-
              RBI’s current and historical PA lists show the field is licensed and crowded, not winner-take-all.
              Combined with 2025 master-direction requirements on KYC, escrow, and security, this creates a market where
              compliance cost rises even as take-rate pressure persists.
            calloutType: risk
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM035
              - CM039
          - type: callout
            title: The Key Missing Inputs Are TPV, Take Rate, and Segment Economics
            body: >-
              Public evidence is sufficient to size the ambient market, compare competitors, and map merchant workflows.
              It is not sufficient to determine Razorpay’s true share or profit capture. Diligence should ask for TPV by
              rail, active merchants by cohort, attach rates for RazorpayX and POS, and margin by segment before using
              headline market growth to underwrite value.
            calloutType: recommendation
            claimRefs:
              - CM011
              - CM031
              - CM043
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and market structure
        blocks:
          - type: paragraph
            body: >-
              Razorpay does not compete in a single neat payment-gateway category any more. Its own official surfaces
              now bundle payment gateway, POS, subscriptions, current accounts, payouts, escrow, capital, and
              cross-border flows, so the relevant rival set spans domestic online-payment aggregators, offline and
              omnichannel incumbents, and global processors that matter once a merchant begins exporting or selling
              beyond India. The RBI's 2025 payments report shows why that matters: UPI already accounts for 85.5% of
              transaction volume, UPI QR infrastructure is vastly larger than POS terminals, and the rails themselves
              are increasingly public and interoperable. In that environment, product breadth, orchestration, compliance
              posture, merchant workflow integration, and adjacent financial tooling matter more than access to one
              exclusive payment method.


              Regulation further fragments the market. RBI reporting separates payment aggregators by online,
              cross-border, and physical categories, which means the relevant alternative for a domestic D2C merchant is
              not identical to the alternative for a marketplace exporter or an offline-first chain. PayPal appears on
              the cross-border authorisation list while Stripe India appears on the returned-application list,
              underscoring that some rivals compete through cross-border or offshore setups rather than the same
              domestic PA stack. The result is a layered competitive field: PhonePe and Paytm pressure domestic merchant
              acquisition, PayU and CCAvenue remain ecommerce-oriented incumbents, Pine Labs matters for omnichannel
              distribution, and Adyen, Stripe, and PayPal become stronger substitutes when merchants need global reach
              or enterprise-grade treasury and payout workflows. The status quo option is also not just "build
              internally"; it includes merchants assembling shared rails, transparent processor pricing, and channel
              partners instead of betting on one full-stack suite.
