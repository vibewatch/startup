  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Razorpay layers merchant-facing payment surfaces on top of orchestration, banking, compliance, and cross-border
      modules.
    data:
      layers:
        - id: merchant-ui
          label: Merchant surfaces
          detail: Payment gateway, links, pages, QR, subscriptions, invoices, POS, dashboards
        - id: developer-layer
          label: Developer and API layer
          detail: Docs plus Node, Python, Go, and Java SDKs, dashboard keys, webhook-oriented integrations
        - id: payments-core
          label: Payments orchestration
          detail: Method routing across cards, UPI, wallets, bank transfers, international flows, and payout routing
        - id: banking-layer
          label: Banking and treasury workflows
          detail: Payouts, current accounts, escrow, tax payments, vendor payments, payroll
        - id: embedded-finance
          label: Embedded finance layer
          detail: Digital lending, line of credit, exporter collections, and compliance support
        - id: regional-compliance
          label: Regional and compliance layer
          detail: >-
            RBI-regulated Indian payments context plus Curlec / PayNet / Bank Negara Malaysia references and privacy
            governance
