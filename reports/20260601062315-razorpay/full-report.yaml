      - number: '2.4'
        title: Competitive Landscape and Public Benchmarks
        blocks:
          - type: paragraph
            body: >-
              Razorpay competes in a crowded field that spans local payment aggregators, POS-heavy players, global
              enterprise processors, and cross-border specialists. Moneycontrol’s IPO-prep reporting explicitly names
              PayU, Adyen, and Stripe among the comparison set, but current competitor homepages show a wider practical
              market. PhonePe Business focuses merchant acceptance and settlement management; CCAvenue and PayU
              emphasise broad checkout tooling; Pine Labs spans POS, gateway, and credit infrastructure; Adyen and
              Stripe position as enterprise-grade global stacks; PayPal continues to sell Indian merchants on
              international collections; and Paytm’s consumer scale remains an adjacent distribution threat.
              Public-market benchmarks suggest payments infrastructure can command meaningful equity value, but marks
              vary sharply by geography and model: as of June 2026 CompaniesMarketCap listed Paytm at $7.47 billion,
              Fiserv at $30.16 billion, Adyen at $34.53 billion, and PayPal at $39.47 billion. That spread matters
              because it shows market structure rewards diversified, profitable processors more richly than pure
              domestic volume narratives.
            claimRefs:
