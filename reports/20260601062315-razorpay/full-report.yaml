  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: compact
    summary: >-
      IC-style scorecard favours franchise breadth and scale but penalizes disclosure quality and current margin of
      safety.
    data:
      items:
        - label: Scale / revenue proof
          score: 8
          detail: FY25 results show real revenue and gross-profit scale.
        - label: Business-model breadth
          score: 8
          detail: Public product surfaces show full-stack positioning beyond gateway only.
        - label: Disclosure quality
          score: 3
          detail: No public audited filing or clean entity bridge in fetched evidence.
        - label: Public comp support
          score: 5
          detail: Comps provide discipline but not a clean premium justification.
        - label: Margin of safety at headline price
          score: 3
          detail: Reported $9.2B leaves limited upside against the chapter’s central view.
        - label: Governance / IPO readiness proof
          score: 4
          detail: IPO process is visible, but investable documentation is still missing.
        - label: Downside resilience
          score: 4
          detail: Real scale helps, but valuation can still reset on disclosure or service shocks.
        - label: Overall composite
          value: 5
          score: null
          detail: Interesting franchise, insufficient evidence for an aggressive price today.
    approximationNotes: >-
      Scores are analyst judgments on a 1-10 scale synthesising the chapter evidence rather than reported company
      metrics.
    claimRefs:
      - CV001
      - CV021
      - CV033
      - CV037
      - CV041
      - CV042
      - CV043
      - CV050
      - CV054
