        title: Full-stack product surface now spans acceptance, banking, disbursals, and embedded finance
        blocks:
          - type: paragraph
            body: >-
              Razorpay no longer presents itself as a single payment gateway. Across the homepage, payments pages, and
              RazorpayX suite, the company consistently packages online acceptance, business banking, payroll, capital,
              and cross-border workflows as one operating stack for merchants. The acceptance layer covers a standard
              gateway, payment links, payment pages, buttons, QR codes, invoices, smart collect, subscriptions,
              international payments, and POS. The banking layer extends into payouts, current accounts, escrow, forex
              handling, tax payments, and payroll; the lending layer adds line-of-credit and digital-lending workflows
              for NBFC and fintech use cases.


              This breadth matters because it changes the product from a checkout point solution into a workflow system
              that can sit across collections, settlements, treasury, and compliance. For merchants, the core product
              story is land-and-expand: start with payment acceptance, then attach payouts, current accounts, or
              cross-border collections as the business scales. The main diligence caveat is that Razorpay discloses the
              menu of modules far better than it discloses adoption by module. Public materials show breadth, but not
              the exact revenue or merchant-share contribution of each product line.
