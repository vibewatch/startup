      - number: '8.3'
        title: Scenario ranges are more defensible than single-point valuation claims
        blocks:
          - type: paragraph
            body: >-
              Given the public evidence base, the most credible method is a scenario range rather than a hard fair-value
              point. The base case should sit below the $9.2 billion headline because public comps already show
              investors can buy a listed India payments leader such as Paytm for less, while the global peers that
              command much larger market caps are more diversified and more disclosed. At the same time, the base case
              should sit above the lowest adverse scenario because Razorpay does show real scale and product breadth.
              That logic supports a base range around $6.0-7.5 billion, a bear range around $4.0-5.5 billion if IPO
              buyers reset hard on disclosure or monetisation quality, and a bull range around $8.0-9.5 billion only if
              audited filings validate both growth durability and normalized profitability. The thesis breaks if the IPO
              slips, if the filing reveals weaker economics than the public story implies, or if service and regulatory
              issues flare at the wrong moment.
            claimRefs:
              - CV033
