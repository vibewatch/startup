            body: >-
              A naive peer set would either overstate Razorpay by comparing it to giant global processors or understate
              it by treating it as only an India payment gateway. The official product surfaces show why. Razorpay
              markets gateway acceptance, business banking, POS, payroll, corporate cards, current accounts, digital
              lending, escrow, payment buttons, and broader accept-process-disburse workflows. That means the company
              has more monetisation optionality than a single-line checkout tool, but it also means no one public comp
              maps perfectly. The right comp set is therefore mixed. Paytm is the clearest listed India reference
              because it shares geography and merchant-payments context, and its gateway page advertises 100+ payment
              methods, T+1 or faster settlements, and 99.99% uptime. PayPal and Adyen matter because they frame
              merchant-payments and omnichannel platform valuation discipline globally, but PayPal’s India fees page
              also makes clear that its local relevance is mainly cross-border. Fiserv is a useful scale and
              infrastructure ceiling reference. Stripe, PayU, CCAvenue, Pine Labs, and PhonePe help on business-model
              shape even when they do not all provide a directly comparable public market cap; Stripe’s India pricing
              page is especially useful because it shows visible transaction pricing and dispute costs instead of a
              narrative-only pitch. This mixed set does not produce false precision, but it does provide guardrails.
