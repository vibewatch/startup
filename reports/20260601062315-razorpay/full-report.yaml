      - number: '1.2'
        title: Leadership and Governance
        blocks:
          - type: paragraph
            body: >-
              Governance is still heavily founder-shaped. Razorpay’s leadership page names Harshil Mathur as CEO and
              co-founder and Shashank Kumar as managing director and co-founder, with a broader operating bench that
              includes Rahul Kothari, Arif Khan, Arpit Chugh, Khilan Haria, Apuarv Sethi, and Ayush Bansal. The
              existence of this named operating bench reduces execution concentration relative to an earlier
              founder-only phase, but the public record is much weaker on statutory board composition, director
              committees, and control rights than it is on executive roles. Razorpay attempted to close part of that
              perception gap in April 2023 by creating an advisory board chaired by former RBI deputy governor G.
              Padmanabhan alongside Arijit Basu and K. P. Krishnan. That move matters because the company operates in a
              tightly regulated payments environment where customer protection, escrow controls, and compliance culture
              all have strategic consequences. The main diligence issue is that the public evidence establishes the
              executive roster and advisory signalling, but not the full board map or the exact division of authority
              between founder leadership and formal governance bodies.
