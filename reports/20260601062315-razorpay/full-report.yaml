  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      The call flows from real scale and product breadth into a disclosure bottleneck that keeps the stance at
      research-more / track.
    data:
      nodes:
        - id: n1
          label: Real revenue scale
          detail: FY25 revenue and gross profit show a meaningful late-stage business.
        - id: n2
          label: Full-stack product breadth
          detail: Gateway, banking, POS, payroll, cards, lending, and escrow widen optionality.
        - id: n3
          label: Disclosure gap remains large
          detail: No public audited filing, cap-table package, or clean entity bridge.
        - id: n4
          label: Private valuation headline looks rich
          detail: Reported $9.2B sits above the clearest listed India peer.
        - id: n5
          label: 'Recommendation: research-more / track'
          detail: Wait for better evidence or better price.
        - id: n6
          label: Upgrade trigger
          detail: Audited filing plus normalized profitability and governance proof.
      edges:
        - from: n1
          to: n5
          label: supports interest
        - from: n2
          to: n5
          label: supports strategic upside
        - from: n3
          to: n5
          label: blocks buy call
        - from: n4
          to: n5
          label: reduces margin of safety
        - from: n5
          to: n6
          label: conditions to improve
    claimRefs:
      - CV001
      - CV021
      - CV034
      - CV041
      - CV042
      - CV045
      - CV047
      - CV051
      - CV052
