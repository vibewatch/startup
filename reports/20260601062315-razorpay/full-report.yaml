chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Product Stack
        blocks:
          - type: paragraph
            body: >-
              Razorpay presents itself as a full-stack payments and banking platform for businesses, not a
              single-product gateway. The official homepage, payments page, and documentation collectively show an
              offering that spans online payment acceptance, payment links, subscriptions, offline POS, RazorpayX
              banking workflows, payouts, payroll, and selected credit and escrow products. The original company story
              is consistent across the About page and the Y Combinator profile: Harshil Mathur and Shashank Kumar
              started Razorpay after seeing how poor the Indian online-payments experience was for startups and SMEs.
              Corporate-registry evidence adds the legal frame: Razorpay Software Limited was incorporated on 24 May
              2013 as an unlisted public company in Karnataka. The most important present-tense scale signal is the
              developer documentation claim that the group serves more than 8 million businesses; Y Combinator
              reinforces that the company powers payments for 76 of 100 startup unicorns and millions of Indian
              businesses. That combination suggests Razorpay has moved beyond startup-brand status into infrastructure
              relevance across multiple merchant tiers, while still retaining a product-led, developer-first
              distribution posture.
            claimRefs:
              - CO001
              - CO002
              - CO003
