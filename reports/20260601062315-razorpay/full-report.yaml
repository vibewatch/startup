  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Razorpay’s addressable market is broader than “online payment gateway,” but narrower than the entire
              Indian payments system. The company competes across online acceptance, remote collections, recurring
              billing, offline POS, payouts, current accounts, escrow, and lending-tech workflows. Product pages make
              the intended buyer map clear: Payment Links addresses service businesses and long-tail merchants,
              Subscriptions addresses recurring digital businesses, POS targets offline merchants, and RazorpayX
              products target finance and treasury workflows. The app-store integrations with Shopify, WooCommerce, and
              Shiprocket make the D2C and SMB commerce stack especially visible. Status-quo substitutes differ by
              segment: banks and direct rails remain default options for treasury and settlement, single-function
              gateways cover checkout, POS specialists cover in-store acceptance, and merchant software platforms
              increasingly bundle payments inside the application layer. That means Razorpay wins when merchant pain
              spans more than one workflow and when software integration speed matters enough to justify a platform
              rather than a point product.
