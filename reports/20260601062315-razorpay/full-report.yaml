      - number: '2.2'
        title: Market Size and Infrastructure
        blocks:
          - type: paragraph
            body: >-
              India’s underlying digital-payments base is enormous, but the distribution of economic value across rails
              is uneven. RBI’s December 2025 Payment Systems Report says total payment transactions reached 26,819 crore
              in CY2025 with value of ₹3,215 lakh crore, while digital payments accounted for 99.8% of transaction
              volume and 97.8% of value. UPI is the dominant retail rail by usage: in H2 CY2025 it held 85.5% of
              payment-system volume but only 9.5% of value, underscoring that high-frequency consumer flows do not map
              one-for-one into gateway revenue pools. UPI transactions grew from 3,873 crore in CY2021 to 22,828 crore
              in CY2025, and value grew from ₹72 lakh crore to ₹300 lakh crore, but the average ticket size fell to
              ₹1,313. Acceptance infrastructure tells a similar story. By December 2025 RBI recorded 7,313.65 lakh UPI
              QR codes versus 114.75 lakh POS terminals, implying software-led and QR-led acceptance is scaling far
              faster than hardware-heavy card acceptance. For Razorpay, that means the most relevant market lens is not
              raw national payments volume; it is merchant-side workflow depth inside this rapidly digitising
              infrastructure base.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
