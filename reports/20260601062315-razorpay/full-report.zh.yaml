      - - PL Capital 下行情景
        - '2026'
        - $5.0B 情景
        - 反向锚防止对高位标记过度自信。
        - 分析师 / 媒体情景，不是有约束力的市场出清价格。
      - - 工作估值判断
        - 运行日期
        - $6.0B-$7.5B 基准；~$6.5B-$7.0B 中心
        - 平衡经营证明、披露和可比公司纪律。
        - 仍是判断区间，不是经审计的内在价值。
    notes: 本表有意混合经营指标、媒体估值锚和分析师下行情景；因为抓取证据中没有公开 IPO 申报文件。
