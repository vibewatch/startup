  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与市场结构
        blocks:
          - type: paragraph
            body: >-
              Razorpay
              已不再只竞争于一个整齐的支付网关品类。它自己的官方界面如今把支付网关、POS、订阅、往来账户、支付出款、托管、资本和跨境流打包在一起，因此相关对手集合横跨本土在线支付聚合商、线下和全渠道既有玩家，以及当商户开始出口或在印度以外销售时变得重要的全球处理商。RBI
              的 2025 年支付报告说明了原因：UPI 已占交易量 85.5%，UPI QR 基础设施远大于 POS
              终端，清算轨道本身也越来越公共、可互操作。在这种环境下，比起接入某一个独占支付方式，产品宽度、编排能力、合规姿态、商户工作流集成和相邻金融工具更重要。


              监管进一步切碎市场。RBI 报告按在线、跨境和实体场景区分支付聚合商，这意味着国内 D2C 商户的相关替代方案，和市场平台出口商或线下优先连锁的替代方案并不相同。PayPal 出现在跨境授权名单上，而
              Stripe India 出现在退回申请名单上，说明部分竞争者通过跨境或离岸设置竞争，并不走同一套国内 PA 栈。结果是一个分层竞争场：PhonePe 和 Paytm 压迫国内商户获取，PayU 和
              CCAvenue 仍是电商导向的既有玩家，Pine Labs 在全渠道分发中重要，Adyen、Stripe 和 PayPal
              在商户需要全球触达或企业级资金管理和支付出款工作流时成为更强替代。现状选项也不只是「自建」；商户还可以拼接共享清算轨道、透明处理商定价和渠道伙伴，而不是押注一套全栈套件。
