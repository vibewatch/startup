      - number: '5.2'
        title: 开发者界面在边缘已成熟，但内部架构披露很薄
        blocks:
          - type: paragraph
            body: >-
              Razorpay 的外部集成界面，比其公开基础设施披露成熟得多。文档把公司定位成一个综合平台，用于接收、处理和支付出款；官方 SDK 覆盖 Node、Python、Go 和
              Java。代码库显示，商户通过控制台生成密钥来完成标准入驻，并支持重试逻辑、webhook 处理模式和平台伙伴认证流等实用开发者功能。更新的产品页面又通过 Optimizer、UPI AutoPay、Magic
              Checkout 和 RazorpayX 公司卡，把边缘界面延伸到路由、周期性扣款、转化和支出控制层。


              这个组合说明，公司拥有真实的自助式商户和开发者分发：商户不需要定制企业集成即可启动，平台也可以基于同一套 API 构建。2025 年 MCP Server 发布进一步延展了这一模式，把支付变成 AI
              原生集成界面。风险在于，Razorpay 公开的是外部接口，对内部系统披露很少。路由逻辑、风控引擎、故障切换架构、可观测性、数据库设计和服务级目标方面，几乎没有硬公开细节。尽调问题不是 API
              是否存在，而是底层控制平面是否能在公司如今营销的规模上保持韧性。
