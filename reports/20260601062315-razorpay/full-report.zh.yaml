  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与 FY25 牵引力
        blocks:
          - type: paragraph
            body: >-
              Razorpay 的官方产品界面让收入模式看起来远比纯支付网关公司更宽。保留下来的官方页面覆盖网关收单、线下 POS、订阅、RazorpayX 企业银行、往来账户、支付出款、托管、出口商流，以及通过 Curlec
              和 Singapore 进行的国际扩张。这一点重要，因为公司不再只推介一个变现杠杆。业务可以合理地赚取交易收入、订阅或平台费、支付出款和银行式工作流费用、托管和合规相关收入，以及跨境或外汇挂钩收费。管理层
              FY25 评论进一步强化了这种读法，明确称增长组合来自支付网关、POS、忠诚度产品、RazorpayX 和国际业务。


              公开 FY25 报道确认了真实规模，而不只是产品铺陈。Moneycontrol、The Economic Times、Business Standard、MediaNama 和 Inc42
              都指向同一组数字：FY25 合并收入 ₹3,783 crore，FY24 为 ₹2,296 crore；毛利从 ₹906 crore 增至 ₹1,277
              crore。对仍为私营公司的企业来说，这些数字有意义。同样重要的是，管理层称核心在线支付业务如今 EBITDA 盈利并产生强劲现金流，而新业务正在放量。这意味着承销问题不再是 Razorpay
              有没有变现路径，而是这些新线条能否产生可持续、高质量收入，还是只是围绕仍不透明的核心增加复杂度和实施成本。
