  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Razorpay 的可服务市场比「在线支付网关」更宽，但比整个印度支付系统更窄。公司在在线收单、远程收款、周期性账单、线下
              POS、支付出款、往来账户、托管和借贷技术工作流中竞争。产品页面清楚展示了目标买方地图：Payment Links 面向服务型企业和长尾商户，Subscriptions 面向周期性收入的数字业务，POS
              面向线下商户，RazorpayX 产品面向财务和资金管理工作流。与 Shopify、WooCommerce 和 Shiprocket 的应用商店集成，让 D2C 和 SMB
              电商栈尤其可见。不同细分市场的现状替代方案并不一样：银行和直连清算轨道仍是资金管理和结算的默认选项；单功能网关覆盖结账；POS 专家覆盖店内收单；商户软件平台越来越多地把支付打包进应用层。因此，Razorpay
              的胜点出现在商户痛点跨越多个工作流，并且软件集成速度足够重要，能支撑平台而非单点产品的时候。
