        - 审计披露验证增长韧性、标准化盈利能力和多产品杠杆。
        - 平台广度没能转化为清晰、持久的变现。
      - - 概率加权中心判断
        - 100%
        - 约 US$6.5B-US$7.0B
        - 当前证据支撑有意义的企业价值，但不足以让人完全相信头条溢价。
        - 披露到位前按头条高端价格买入，缓冲太薄。
    notes: 这些区间是分析师估算，使用公开经营锚、反向情景报道和公开可比公司纪律，而不是完全可审计的 DCF 模型。
