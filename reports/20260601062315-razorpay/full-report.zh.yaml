chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与产品栈
        blocks:
          - type: paragraph
            body: >-
              Razorpay 把自己定位成面向企业的全栈支付和银行平台，而不是单一产品网关。官网首页、支付页面和文档合在一起显示，产品覆盖在线支付收单、支付链接、订阅、线下 POS、RazorpayX
              银行工作流、支付出款、薪资，以及部分信贷和托管产品。公司的起源故事在 About 页面和 Y Combinator 资料中一致：Harshil Mathur 和 Shashank Kumar 看到印度初创公司和
              SME 的在线支付体验很差，于是创立 Razorpay。公司注册资料补上法律框架：Razorpay Software Limited 于 2013 年 5 月 24 日在 Karnataka
              注册，为未上市公众公司。当前最重要的规模信号来自开发者文档，称集团服务超过 8 million 家企业；Y Combinator 进一步称，公司为印度 100 家初创独角兽中的 76
              家处理支付，并服务数百万印度企业。这组证据说明，Razorpay 已经越过初创品牌阶段，在多个商户层级具备基础设施相关性，同时仍保留产品驱动、开发者优先的分发姿态。
