      - number: '5.4'
        title: 2025 年路线图集中在跨境、AI 辅助集成和全渠道正常运行
        blocks:
          - type: paragraph
            body: >-
              Razorpay 的 2025 年发布节奏显示出清晰主题：上探市场、走向跨境，同时让集成更容易。3 月，公司继 Malaysia 之后宣布扩张 Singapore；当月稍晚，又为 150,000 多名
              Amazon 出口商推出零外汇加价收款。4 月，公司发布 MCP Server，声称 AI 原生产品可以在 15 分钟内接入支付，而不是花数月。6 月，Razorpay POS
              推出自修复软件，意在主动解决设备问题。9 月，Apple Pay 面向进行跨境交易的印度企业上线；10 月，Curlec 与 NPCI International 将 UPI 收单带入 Malaysia。


              路线图是连贯的。Razorpay 正试图让自己的栈更全球化、更容易被开发者接入，并在店内场景更可靠。公司也在尝试把产品宽度转化成面向出口商、线下商户和 Southeast Asia
              企业的分部专属工作流。开放的尽调问题是采用深度。公开页面说明了推出了什么；没有披露有多少商户实际激活了每项新能力，或这些发布今天代表多少使用份额。
