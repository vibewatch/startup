  - id: TR005
    title: 缓释措施和否决标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - RBI 或合作银行升级处置
        - 正式监管行动、入驻限制或合作银行暂停
        - 任何点名限制，只要实质改变入驻或结算条款
        - 在复核补救证据前，按投资逻辑破裂处理。
      - - 客户信任恶化
        - 投诉持续激增、负面评价趋势，或升级处理不力的证据
        - 未解决的商户或用户支持失败形成模式，而不是孤立轶事
        - 将信任风险从中高调至高，并重审留存假设。
      - - 跨境复杂度压过控制能力
        - 新市场上线却没有匹配的合规或法律披露
        - 两条或更多新通道上线，但缺少司法辖区级控制包
        - 下调扩张上行空间；投前要求明确本地控制负责人。
      - - IPO 披露缺口持续存在
        - 路演或申报流程仍缺少实体地图和标准化盈利桥
        - 上市准备阶段没有清晰的收入 / 利润率 / 负债桥接
        - 降低估值意愿，并将财务模型视为不透明。
      - - 产品扩张导致执行失灵
        - POS、薪资、卡或借贷出现重大事故，暴露平台协同薄弱
        - 公开事故叠加没有可信的复盘或 SLA 披露
        - 假设规模正在制造脆弱性，而不是经营杠杆。
      - - 支持职能投入不足
        - 商户支持指标仍拿不到，而投诉继续可见
        - 管理层无法在尽调中提供 SLA、申诉或积压数据
        - 假设信任痛点是结构性的，并提高折现率。
    notes: 否决标准按事件触发设定，因为公开来源没有提供足够干净的运营历史，无法支撑精确数字阈值。
