      - number: '8.3'
        title: 情景区间比单点估值主张更站得住
        blocks:
          - type: paragraph
            body: >-
              基于公开证据，最可信的方法是情景区间，而不是硬性的公允价值单点。基准情景应低于 $9.2B 头条，因为公开可比已经显示，投资人可以用更低价格买到 Paytm
              这样的印度上市支付龙头；而市值高得多的全球同行更多元、披露也更多。同时，基准情景也应高于最低反向情景，因为 Razorpay 确实显示出真实规模和产品宽度。这个逻辑支持约 $6.0-7.5B 的基准区间；如果
              IPO 买方因披露或变现质量而大幅重定价，熊市区间约 $4.0-5.5B；只有在经审计备案验证增长耐久性和正常化盈利能力时，牛市区间才约 $8.0-9.5B。如果 IPO
              推迟、备案显示经济性弱于公开故事暗示，或服务与监管问题在错误时点爆发，投资论点就会破裂。
