      - number: '2.4'
        title: 竞争格局与公开基准
        blocks:
          - type: paragraph
            body: >-
              Razorpay 身处拥挤赛道，竞争者横跨本地支付聚合商、重 POS 玩家、全球企业级处理商和跨境专家。Moneycontrol 的 IPO 准备报道明确点名 PayU、Adyen 和 Stripe
              属于对比组，但当前竞争者官网显示，实际市场更宽。PhonePe Business 聚焦商户收单和结算管理；CCAvenue 和 PayU 强调宽泛结账工具；Pine Labs 横跨
              POS、网关和信贷基础设施；Adyen 和 Stripe 定位为企业级全球栈；PayPal 继续向印度商户销售国际收款；Paytm
              的消费者规模仍构成相邻分发威胁。公开市场基准显示支付基础设施可以获得有意义的股权价值，但估值标记会随地域和模式大幅分化：截至 2026 年 6 月，CompaniesMarketCap 列示 Paytm 为
              $7.47 billion、Fiserv 为 $30.16 billion、Adyen 为 $34.53 billion、PayPal 为 $39.47
              billion。这个差距重要，因为它说明，相比单纯的本土交易量叙事，市场结构更丰厚地奖励多元化且盈利的处理商。
