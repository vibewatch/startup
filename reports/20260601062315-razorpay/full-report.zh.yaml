  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失的私有指标
      - 对承销判断的影响
      - 具体尽调路径
    rows:
      - - 按产品拆分 GMV 或 TPV 及抽成率
        - 无法检验收入增长来自交易量、定价还是组合变化
        - 要求提供 GMV 或 TPV 桥，以及网关、POS、订阅和跨境的实际抽成率
      - - ARR、留存和同期群行为
        - 无法评估经常性收入质量或商户粘性
        - 要求提供 ARR 桥、总留存、NRR 和同期群续约数据
      - - 合并现金、现金消耗和跑道
        - 无法建模融资依赖或最低现金风险
        - 要求提供董事会层面的现金跑道和月度现金消耗报告，并附情景案例
      - - 产品层面利润率和贡献利润
        - 无法判断新业务是增厚还是被交叉补贴
        - 要求按主要产品线提供毛利率和贡献利润率
      - - 客户集中度和支持负载
        - 无法为大商户或高触达工作流带来的执行风险定价
        - 要求提供头部客户集中度、支持负担，以及争议或拒付集中度
      - - 按产品拆分监管或合作银行敞口
        - 无法衡量营运资本、托管或或有负债风险
        - 要求提供实体图谱、合作银行协议，以及按产品列示的资本或担保要求
    notes: 这些缺口是把有希望的 FY25 快照转成完整承销模型所需的最低数据集。
