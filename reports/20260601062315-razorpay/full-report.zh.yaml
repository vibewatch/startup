      - number: '1.5'
        title: 里程碑、扩张与风险信号
        blocks:
          - type: paragraph
            body: >-
              近期里程碑显示，Razorpay 同时推进地域、产品深度和生态控制。仅在 2025 年，公司就宣布扩张 Singapore、为 Amazon 出口商提供零外汇加价收款、为印度企业接入 Apple Pay、推出面向
              AI 原生支付的 MCP Server、通过 Curlec / NPCI 合作在 Malaysia 启用 UPI，以及发布 AI 驱动的自修复 POS 设备。较早的里程碑同样重要：2020 年公司与 NPCI
              推出 UPI AutoPay，2023 年设立顾问委员会，Y Combinator 资料称 Razorpay 完成八起收购，包括 Curlec、Ezetap、PoshVine 和
              BillMe。这一模式支持一种判断：Razorpay
              正试图在结账、结算、线下收单、金融运营和跨境走廊中，掌握更多商户资金流转环节。短期最大的风险信号不是产品宽度，而是运营信任。归档客户评价呈现混合图景：Trustpilot 评分明显不利，并有入驻 /
              支持投诉；G2 则显著更正面，但仍提到支持质量问题。Razorpay 走向 IPO 审视后，支持一致性和治理透明度会与增长一样重要。
