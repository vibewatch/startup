      - number: '5.5'
        title: 宽度和叙事都强；性能与产品组合的独立验证仍是主要技术尽调缺口
        blocks:
          - type: paragraph
            body: >-
              围绕 Razorpay 的最强产品逻辑，不是某一个功能单独看有多独特，而是公司围绕印度清算轨道和商户工作流拼出了一套本地化全栈平台。Stripe 和 Adyen 也营销统一支付栈，但 Razorpay
              的差异化在于它以印度优先的方式组合支付收单、支付出款、往来账户、托管、借贷工作流，以及 UPI 和本地银行集成等国别清算轨道。FY25 报道显示，这不是表面文章：企业银行、POS
              和国际业务都与网关一起被列为增长驱动。


              主要谨慎点是证据质量。Razorpay 的许多最强技术主张，仍没有独立基础设施披露验证。营销界面声称转化率提升 40%、结账快 5x、出款成功率 99.9%、POS 设备正常运行时间
              100%，而独立报道仍把业务描述为在盈利前大举投入 AI 和全球运营。公开材料没有揭示模块级采用、架构深度，或可靠性指标的第三方验证。对产品尽调来说，这是管理层 Q&A 必须补上的核心缺口。
