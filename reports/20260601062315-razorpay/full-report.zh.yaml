  - id: TI004
    title: 资本充足性表
    columns:
      - 项目
      - 公开证据支持的数值 / 状态
      - 重要性
      - 融资含义
      - 尽调要求
    rows:
      - - 反向翻转税务或重组负担
        - 约 ₹1,245 crore，由内部现金储备支付
        - 与 IPO 准备相关、已明确报道的最大一次性现金负担
        - 表明公司无需应急融资也具备流动性
        - 确认确切支付金额、时间点和任何剩余税务风险
      - - 现金及现金等价物（实体层面）
        - Tofler 仪表板显示 2025 年 3 月为 ₹1,763.1 crore
        - 最好的公开流动性数据点
        - 信号为正，但不是合并口径跑道指标
        - 提供合并现金、受限余额和各实体现金
      - - 资产和净值（实体层面）
        - ₹4,906.9 crore 资产和 ₹3,771.9 crore 净值
        - 支持上市前资产负债表韧性
        - 若能代表主实体，说明股本基础扎实
        - 提供合并资产负债表和内部交易抵消
      - - 借款和登记押记
        - Tofler 仪表板显示无借款、无登记押记
        - 低杠杆降低即时再融资风险
        - 若集团层面也成立，可支撑更干净的 IPO 叙事
        - 确认所有实体的债务、担保和合作银行或有敞口
      - - IPO 准备
        - Moneycontrol 称已入围投行，发行规模超过 $700 million
        - 资本市场准备度影响流动性选项和市场信号
        - 即便运营不急需资金，IPO 也可提供选择权
        - 澄清申报时间表、一级 / 二级发行比例和募资用途
      - - 公开估值信号
        - 当前公开报道约为 $5 billion 至 $9.2 billion，另有较早 $7.5 billion 私募轮标记
        - 估值区间很宽，会改变稀释和市场胃口假设
        - 潜在重定价风险仍然重要
        - 提供管理层目标可比公司组、估值叙事，以及对披露缺口的敏感性
    notes: 公开资产负债表证据有用但口径混杂；最强的备案式事实来自实体层面，不能替代合并现金跑道模型。
