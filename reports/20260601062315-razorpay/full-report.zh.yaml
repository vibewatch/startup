      - number: '3.2'
        title: 产品宽度与同业画像
        blocks:
          - type: paragraph
            body: >-
              Razorpay 的主要强项是宽度。About 页面仍把公司表述为面向企业的全栈资金流转平台，当前产品界面则把这一说法延展到支付网关、POS、订阅、RazorpayX
              企业银行、往来账户、支付出款、托管、跨境工具和资本产品。专门的 /payments/ 页面进一步放大了这张图，除核心网关栈外，还列出 QR、即时结算、发票、smart
              collect、TokenHQ、Optimizer、Magic Checkout、UPI AutoPay、税款支付、数字借贷、资本和薪资。宽度在商业上重要，因为 Razorpay
              可以在一段关系里向商户销售收单、支付出款、运营和部分融资相邻能力，而不是只卖一个结账插件。


              但同业集合显示，宽度越来越受争夺，而不是独有。PhonePe 如今有专门的支付网关页面和公开定价界面；Paytm 面向线上卖家营销入驻、路由和结算灵活性；PayU 强调面向 D2C 和电商的结账；CCAvenue
              以宽支付选项组合和路由功能竞争；Pine Labs 在任何线下分发或设备驱动获客成为切入口的地方仍然重要。对更大或更国际化的商户来说，Adyen、Stripe 和 PayPal
              抬高了全球支付方式、企业可靠性、全渠道支持和国际结算的门槛。Razorpay 的支持披露也揭示了一个重要保留项：部分银行式相邻业务仍依托伙伴银行牌照，而非 Razorpay
              自有牌照，因此栈很宽，但并未完全垂直拥有。商户看重一段以印度为中心的运营关系时，Razorpay 最强；买方优先考虑透明定价、全球触达，或某一工作流上的专精同类最佳工具时，差异化就没那么强。
