      - number: '7.3'
        title: 产品铺开和可见支持痛点放大运营信任风险
        blocks:
          - type: paragraph
            body: >-
              运营故事有两个相互矛盾的公开信号。一方面，Razorpay 展示了一个越来越宽的平台，覆盖网关、银行、POS、薪资、公司卡、借贷和托管；其 POS
              业务现在还声称有自愈硬件，能主动解决大多数设备问题。另一方面，在抓取材料中唯一覆盖面较广的公开客户情绪面，是归档 Trustpilot 页面，而且明显偏弱：1.4/5
              评分，反复投诉响应延迟和升级无效。这组组合很重要，因为平台已经不再是窄收银插件。每个新工作流都会增加额外的对账、合规、商户支持和事故处理负担。Razorpay
              自己的拒付指南把隐性运营成本讲得很明白：争议裁定期间，商户资金可能被临时扣划、触发费用和罚金，并消耗人工审核带宽。如果服务质量跟不上产品宽度，支持问题就不再是轶事，而会变成压在留存和转介绍上的信任税。缓释因素是，管理层显然在投入可靠性和平台深度。残余暴露在于，关于
              SLA 表现、宕机频率、误报和争议解决质量的公开证据仍然缺失。
