      - number: '4.4'
        title: 财务结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              财务结论偏建设性，但仍需谨慎。已有足够证据说明 Razorpay 不是一家狭窄、脆弱的支付初创公司：它具备真实收入规模、改善中的毛利、超出网关收单的产品多元化、似乎自筹资金完成反向迁回，并有可信 IPO
              路径。这些都是优势。但公开证据还不足以证明 Razorpay
              已经获得软件式收入质量，或拥有干净的资本效率画像。公司仍是私营企业，通过媒体摘要选择性报告，而不是披露完整公开申报文件；最好的申报式资产负债表快照也无法与合并新闻披露顺畅勾稽。


              实际上，下一轮尽调应少问 Razorpay 有没有产品可卖，多问这些产品究竟赚到什么。投资者需要产品级抽佣率、GMV 或 TPV
              背景、贡献利润率、交叉销售挂接率、客户集中度、拒付或损失暴露、营运资本需求，以及合并现金跑道视图。在这些信息披露前，合理姿态是：Razorpay
              的收入动能和资产负债表状态令人鼓舞，但承销案例仍不完整。强劲收入增长加不透明单位经济，足以支撑 IPO 野心；但还不足以给出高置信度的内在价值判断。
