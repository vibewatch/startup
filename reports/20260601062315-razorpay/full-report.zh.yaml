      - number: '2.2'
        title: 市场规模与基础设施
        blocks:
          - type: paragraph
            body: >-
              印度底层数字支付基数巨大，但不同清算轨道上的经济价值分布并不均匀。RBI 的 2025 年 12 月 Payment Systems Report 称，CY2025 总支付交易达到 26,819 crore
              笔，金额 ₹3,215 lakh crore；数字支付占交易量 99.8%、交易金额 97.8%。UPI 是按使用量计算的主导零售轨道：H2 CY2025，它占支付系统交易量 85.5%，但只占金额
              9.5%，说明高频消费者流量并不会一比一转化成网关收入池。UPI 交易量从 CY2021 的 3,873 crore 笔增长到 CY2025 的 22,828 crore 笔，金额从 ₹72 lakh crore
              增至 ₹300 lakh crore，但平均客单价降至 ₹1,313。收单基础设施讲述了类似故事。截至 2025 年 12 月，RBI 记录 UPI QR 码为 7,313.65 lakh 个，POS 终端为
              114.75 lakh 台，意味着软件驱动、QR 驱动的收单扩张远快于重硬件的卡收单。对 Razorpay 来说，最相关的市场视角不是全国支付量原始规模，而是在这个快速数字化的基础设施底座中，商户侧工作流的深度。
