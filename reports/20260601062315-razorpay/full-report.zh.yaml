  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律风险位于风险栈顶端
        blocks:
          - type: paragraph
            body: >-
              Razorpay 已经不在可以把牌照状态当作二元问题的阶段。RBI 的证书名单显示，公司确实持有 PA-O 授权，这是重要的降风险里程碑；但同一份 RBI
              记录和支付系统报告也清楚说明，真正的尽调问题，是在高度监管的边界内持续合规。印度 2025 年支付聚合商框架已经把非银运营方的 KYC、托管、安全和治理义务标准化，同时 RBI
              行业状态页仍显示大量申请被退回、拒绝或不得运营。这个问题重要，因为 Razorpay 的产品叙事持续扩进银行相邻和跨境工作流。法律暴露面也写在公司自己的隐私政策里：KYC、监管共享、AI
              集成日志和印度司法管辖，都把公司更深地拉进受监管的数据与行为表面。因此，最高风险不是「Razorpay 会不会拿到牌照」，而是更宽的产品集能否继续满足一个正在主动压低弱控制容忍度的监管者。
