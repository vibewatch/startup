        - 指向线上网关之外的全渠道变现
      - - 订阅
        - 经常性计费平台
        - 实际定价未披露
        - 支持银行卡、UPI、eMandate 和国际卡
        - 单笔授权定价、重试和失败成本经济性
        - 有用的经常性收入方向，但经济性未公开
