      - number: '7.5'
        title: 缓释因素可见，但决定性尽调问题仍在公开证据之外
        blocks:
          - type: paragraph
            body: >-
              Razorpay 不是看不到缓释因素的案例。公司有正式授权、更宽的治理叙事、产品层面的工程投入和可信背书方。但这些事实都没有补上最影响决策的缺口。公开来源仍然没有披露监管往来、检查发现、整改积压、宕机历史、支持
              SLA、误报冻结率、产品级盈利能力，或从合并数字映射到经营实体的精确关系。因此，最重要的否决标准应由事件触发，而不是靠精密模型。一项新的 RBI
              或合作银行限制、一组商户支持失败模式，或跨境与银行相邻产品扩张快过控制能力的证据，都比又一条普通增长头条更重要。投资含义是，只有尽调拿到公开来源尚未提供的运营证据，Razorpay
              的风险才可管理。没有这些证据，正确姿态是把监管视为最高严重度风险，把合作银行和 NBFC 依赖视为关键传导放大器，把信任 / 服务质量视为公开叙事最可能意外恶化的路径。
