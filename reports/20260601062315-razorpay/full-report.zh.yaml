    rows:
      - - Razorpay
        - 印度优先的全栈平台
        - 支付网关、POS、订阅、RazorpayX、出款、托管和跨境工具
        - 初创公司、中小企业、数字优先企业、出口商和全渠道商户
        - 以印度为中心，覆盖支付受理和相邻资金流转的宽运营栈
        - 公开定价和实际抽佣率仍不透明
      - - PhonePe Business
        - 国内商户获取挑战者
        - 支付网关、商户仪表盘和 UPI AutoPay 支持；具名商户包括 redBus、EaseMyTrip 和 GIVA
        - UPI 占比高的商户、旅行、电商和快速增长的消费品牌
        - 国内支付认知强，也有商户案例
        - 留存页面显示的银行 / 资金管理广度不及 RazorpayX 式工作流
      - - Paytm Business
        - 消费品牌带动的商户获取既有玩家
        - 数字化入驻、100+ 种支付方式、智能路由和灵活结算
        - 中小企业、电商卖家，以及想要熟悉 Paytm 结账体验的商户
        - 消费者品牌认知加上商户收款工具
        - 留存页面呈现的资金管理和运营栈广度低于 Razorpay
      - - PayU India
        - 结账与电商既有玩家
        - 面向 D2C / 电商的一体化结账、支付和 RTO 消息
        - 电商和 D2C 商户
        - 集成简单，支付方式灵活
        - 留存页面在相邻运营套件广度上更轻
      - - CCAvenue
        - 传统全渠道支付处理商
        - 支持网站、App 内、发票、社交、QR 和 TapPay，并配套路由 / 重试工具
        - 企业、电商和全渠道商户
        - 受理方式覆盖很广，路由深度强
        - 品牌更像以支付处理为中心，而不是以企业运营栈为中心
      - - Pine Labs
        - 线下和全渠道既有玩家
        - POS、支付网关、预付费、信贷和金融科技基础设施
        - 线下优先的连锁，以及需要设备驱动分发的商户
        - 线下覆盖强，商户收单关系深
        - 留存首页对类网上银行相邻业务披露较少
      - - Adyen
        - 全球企业级支付处理商
        - 年处理 €1.4T，150+ 种货币 / 本地支付方式，99.999% 正常运行时间
        - 大型本土和跨境企业
        - 全球编排、资金管理和可靠性叙事
        - 对大型企业客户的适配可能比中小商户更重
      - - Stripe
        - 全球开发者驱动的支付处理商
        - 100+ 种支付方式，线上加线下，195+ 个国家
        - SaaS、数字出口商和 API 驱动商户
        - 开发者体验和国际扩张工具
        - 相比 Razorpay，本地化、印度优先的运营套件定位更弱
      - - PayPal
        - 跨境企业支付替代方案
        - 线上和线下企业支付，并聚焦国际收款
        - 中小企业出口商和国际卖家
        - 出口和跨境商户认知强
        - 留存页面中，本土全栈银行 / 出款广度不太可见
    notes: 各行汇总截至 runDate 留存公开证据中最相关的直接、既有、全渠道和跨境替代方案。
