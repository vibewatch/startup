      - number: '3.4'
        title: 护城河耐久性与反向证据
        blocks:
          - type: paragraph
            body: >-
              因此，Razorpay 的护城河是有条件的，而非自动成立。公司可以可信地说，它把国内支付收单、运营工作流、周期性支付、线下
              POS、出口商工具和部分资本产品组合进一个印度原生栈。这个价值真实存在，尤其对不想拼接多个供应商的初创公司和
              SME。但公开证据仍不足以支持「仅凭宽度就能保护公司」的结论。核心清算轨道是共享的，竞争产品重叠明显，Razorpay
              的部分银行式相邻业务依赖伙伴银行牌照，而不是自有受监管基础设施。同时，PhonePe、Adyen 和 Stripe 的公开定价信号降低了品类不透明本身作为防御屏障的程度。


              最可见的反向信号不是产品覆盖，而是信任和支持。归档 Trustpilot 页面给 Razorpay 的评价很差，并突出支持投诉；归档 G2 资料则显示，商户仍能获得相对快速的实施和
              ROI。这个组合重要：它指向一个产品价值可能真实存在的平台，但其商户体验声誉并不均匀强劲。没有公开赢单 / 输单数据或按分部划分的实际定价时，最干净的读法是：Razorpay
              仍是印度可信的全栈领导者，但其耐久性更多取决于执行质量、交叉销售成功和渠道效率，而不是对支付基础设施的专有控制。
