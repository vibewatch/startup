  - id: TP003
    title: 定价 / 包装对比
    columns:
      - 供应商
      - 公开包装信号
      - 留存页面可见标价
      - 包含能力
      - 未知 / 注意事项
      - 商业影响
    rows:
      - - Razorpay
        - 销售驱动的全栈平台
        - 未呈现完整费率表
        - 支付网关、POS、订阅、RazorpayX 和跨境工具
        - 实际 MDR、附加产品渗透率和折扣不公开
        - 宽产品捆绑可提升钱包份额，但外部基准比较更难
      - - PhonePe Business
        - 具备独立支付网关和定价页面的商户解决方案
        - 无设置费、隐藏费和年费的 1.95% 促销报价
        - 支付网关、多种支付方式、合规信息和商户仪表盘工具
        - 标称报价可能不能代表大商户合约经济性
        - 更公开的定价线索能帮助 PhonePe 在商户需要可见起始费率时赢得试点
      - - Paytm Business
        - 具备数字化入驻的可靠商户网关
        - 留存网关页面未呈现数字费率表
        - 100+ 种支付方式、智能路由、API/插件和灵活结算
        - MDR 费率表和折扣仍不清楚
        - 围绕熟悉的结账体验、入驻速度和结算选项争夺中小企业和电商卖家
      - - PayU
        - 一体化结账和支付套件
        - 未公开完整费率表
        - 结账、支付以及 D2C / 电商工具
        - 抽成率和非核心费用不清楚
        - 很贴合电商，但公开定价细节有限
      - - CCAvenue
        - 处理机构式多渠道套件
        - 未公开完整费率表
        - 网站、App、发票、二维码、TapPay、路由和重试
        - 企业合同条款不清楚
        - 在大客户里，路由能力和产品宽度可能比标价更关键
      - - Pine Labs
        - 全渠道基础设施和设备
        - 未公开完整费率表
        - POS、网关、预付、信贷和基础设施
        - 设备经济性和混合收单条款不清楚
        - 设备和商户网络带来的分销力，可能压过透明标价的重要性
      - - Adyen
        - 集中式企业支付栈
        - 公开定价页：固定处理费加支付方式费；无开通费或月费
        - 支付、金融产品和 150+ 本地支付方式
        - 企业最终经济性仍取决于支付方式组合和合同范围
        - 相比仍由销售主导的印度优先同行，企业买家更容易直接对标 Adyen
      - - Stripe
        - 开发者主导的全球处理机构
        - 有公开的印度定价页
        - 支付、结账、计费、开票、税务、付款和平台工具
        - 实际有效定价仍随产品组合和规模变化
        - 透明的模块化打包方式，让开发者主导的商户能更早比较功能和经济性
      - - PayPal
        - 商户收单与出口收款
        - 只有促销型定价信号
        - 线上和线下商业支付及国际收款
        - 促销价看不出稳态经济性
        - 在跨境结算比本土产品栈宽度更重要的场景，PayPal 竞争力最强
    notes: 表格跟踪打包方式和透明度，而非商户实际经济性；核心尽调缺口仍是协商 MDR 和附加率披露。
