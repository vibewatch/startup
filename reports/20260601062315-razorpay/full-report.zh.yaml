  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 维度
      - 看多逻辑
      - 反向逻辑
      - 哪些证据会改变判断
    rows:
      - - 收入规模
        - FY25 收入规模证明 Razorpay 是有分量的后期金融科技公司。
        - 单看收入，看不出标准化盈利质量或入场经济性。
        - 经审计的分部桥接和现金流细节会强化看多逻辑。
      - - 平台广度
        - 支付网关、银行服务、POS、薪资、卡、借贷和托管意味着多条变现杠杆。
        - 广度也可能掩盖弱小的未成规模业务线，并制造运营不透明。
        - 产品级利润率披露能说明广度是否复利放大价值。
      - - IPO 动能
        - 已点名投行和活跃 IPO 准备，指向真实上市路径。
        - 准备 IPO 不等于已有 IPO 级别披露。
        - 已提交的招股书或等效审计包会缩小缺口。
      - - 公开可比公司支撑
        - 全球支付平台证明该品类可以承载大市值。
        - 全球平台比 Razorpay 更大、更成熟，披露也更充分。
        - 披露更强之后，借用全球可比公司逻辑才更站得住。
      - - 印度可比公司支撑
        - Razorpay 业务版图更宽，估值相对基础网关同行有理由享受溢价。
        - Paytm 已给公开市场一个印度支付基准，低于私募头条估值。
        - 更清晰的抽佣率和利润率证据，可能支撑相对 Paytm 的溢价。
      - - 申报证据
        - 实体快照至少能看出法定资本结构和部分财务。
        - 材料太不完整，也太依赖单个实体，无法直接支撑估值。
        - 实体到产品映射会让申报文件对决策有用得多。
    notes: 反向逻辑主要来自披露质量和价格纪律，而不是不相信 Razorpay 拥有真实业务特许权。
