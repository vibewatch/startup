          high: 9.2
          displayValue: $5.0B → $7.5B → $9.2B
          detail: 低值 = PL Capital 谨慎情景，中值 = YC 资料页上一轮主要私募融资标记，高值 = Moneycontrol 或 Tracxn 的 IPO 期间数字。
