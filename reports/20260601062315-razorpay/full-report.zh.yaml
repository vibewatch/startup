        title: FY25 规模与财务画像
        blocks:
          - type: paragraph
            body: >-
              FY25 是最清楚的公开证据，证明 Razorpay 已达到有意义的经营规模。Moneycontrol、Economic Times、Inc42 和 Medianama 均报道合并收入 ₹3,783
              crore，同比增长 65%，高于上一年的 ₹2,296 crore；毛利 ₹1,277 crore，增长 41%。同一批报道也指向主要保留项：迁回印度注册地带来一次性重组和税务成本，Razorpay 因此录得
              ₹1,209 crore 的 ESOP 后亏损。管理层自己的说法经独立媒体反复引用：核心在线支付业务已经 EBITDA 盈利并产生现金，而
              POS、RazorpayX、忠诚度产品和国际业务等新产品在增加增量增长向量。两个商户质量信号支撑这一叙事：文档站称 Razorpay 服务超过 8 million 家企业，Y Combinator 资料称其为印度
              100 家初创独角兽中的 76 家处理支付。即便如此，公司没有以同等颗粒度公开 TPV、抽佣率或分部组合，因此外部更容易确认增长动能，却更难确认底层单位经济。
