  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值锚点存在，但桥接仍受披露限制
        blocks:
          - type: paragraph
            body: >-
              Razorpay 现在已有足够公开收入和 IPO 消息，让估值成为真实争论，而不是空泛的创业公司练习。最强运营证据是 FY25 数据：多家媒体报道合并收入 Rs 3,783 crore、毛利显著增长，以及迁册和
              ESOP 成本抬高的一年亏损。最强价格锚点弱得多。Moneycontrol 提到 $9.2B 投后估值，以及可能募资超过 $700M 的 IPO 承销团；PL Capital 则给出更接近 $5B
              的情景。这个差距太大，不能当作噪音，因为公开记录仍缺少能把它对齐的文件：经审计备案、清晰的实体到产品桥接，以及股权结构机制。Tofler
              的实体快照有用，正因为它显示公开备案式数据仍然多么不完整。本章第一结论不是一个数字，而是一条规则：估值不能长期跑在披露前面。
