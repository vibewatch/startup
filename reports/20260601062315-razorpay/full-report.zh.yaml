      - number: '8.2'
        title: 可比公司纪律既需要公开市场锚点，也需要业务模型匹配
        blocks:
          - type: paragraph
            body: >-
              天真的可比公司组要么拿全球巨型处理商来高估 Razorpay，要么把它只当作印度支付网关而低估。官方产品界面解释了原因。Razorpay
              销售网关收款、商业银行、POS、薪资、公司卡、经常账户、数字借贷、托管、支付按钮，以及更宽的收单—处理—分账工作流。这意味着公司比单线收银工具有更多变现可选项，但也意味着没有一家上市可比公司能完全对应。合适的可比公司组应当混合。Paytm
              是最清晰的印度上市参考，因为它共享地理和商户支付语境，其网关页面宣传 100+ 种支付方式、T+1 或更快结算，以及 99.99% 可用性。PayPal 和 Adyen
              重要，因为它们在全球框架里约束商户支付和全渠道平台估值纪律；但 PayPal 印度费率页也说明，其本地相关性主要在跨境。Fiserv
              是有用的规模和基础设施上限参考。Stripe、PayU、CCAvenue、Pine Labs 和 PhonePe 有助于判断业务模型形状，即便它们并非都提供可直接比较的公开市值；Stripe
              印度定价页尤其有用，因为它展示了可见交易定价和争议成本，而不是只有叙事式推介。这组混合可比不会给出虚假精度，但能提供护栏。
