      - number: '3.3'
        title: 定价、分发与多归属
        blocks:
          - type: paragraph
            body: >-
              公开记录对包装的披露强于对实际经济性的披露，但定价透明度已不再全面缺席。PhonePe 的专门网关定价页如今打出促销性 1.95% 报价，并称无设置费、隐藏费用和年费；Adyen 和 Stripe
              都维护公开定价页面，描述费用结构和模块化产品覆盖。这不能解决真正的尽调缺口——协商 MDR、路由经济性和挂接率仍属私密——但它确实意味着，当 Razorpay
              继续让自己的公开费率表保持不透明时，暴露度比以前更高。Paytm 的网关页面也通过营销数字入驻、100+ 支付方式、智能路由和灵活结算选择，强化了国内竞争，哪怕保留下来的页面没有披露完整数字 MDR 表。


              分发力量同样不均。PhonePe 可以指向具名商户案例和更明确的价格驱动网关推介；Paytm 倚靠熟悉的消费者支付品牌；Pine Labs 通过设备和商户关系进入；Adyen、Stripe 和 PayPal
              借力全球商户预期和出口工作流；Razorpay 则试图用更宽的栈和扩张中的 Southeast Asia 足迹应对。这些条件降低了结构性锁定。商户可以用一个网关处理国内 UPI
              权重很高的收款，用另一个处理出口商或 SaaS
              账单，再用不同线下伙伴处理店内收单。多数竞争者如今都覆盖相同核心模式——UPI、卡、钱包、网上银行、周期性扣款，以及至少部分支付出款或企业金融相邻能力——竞争焦点因此转向编排质量、结算体验、支持、透明商业表述和商户偏好的渠道，而不是某个不可替代的产品功能。
