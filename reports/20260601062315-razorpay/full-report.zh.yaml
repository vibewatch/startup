companyProfile:
  summary: >-
    Razorpay 是一家印度商户金融科技公司，由 Harshil Mathur 和 Shashank Kumar 创立，总部位于
    Bengaluru。公司起步于开发者驱动的在线支付网关，如今已扩展成更宽的企业金融栈：支付链接、订阅、POS、支付出款，通过 RazorpayX 提供往来账户和类资金管理工作流，另有薪资、类信贷基础设施、托管、跨境商户产品，并通过
    Malaysia 的 Curlec 和公开动作进入 Southeast Asia。公开证据支持其已具备真实规模——服务 8M+ 企业、FY25 合并收入 ₹3,783 crore、IPO
    准备进程已经启动——但在标准化盈利能力、法人实体勾稽、商户质量和当前融资条款上仍留下重要缺口。
  foundedDate: '2014-01-01'
  founders:
    - name: Harshil Mathur
      role: 联合创始人 / CEO
