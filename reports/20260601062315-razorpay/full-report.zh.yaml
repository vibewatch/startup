      - number: '6.3'
        title: GTM 靠生态驱动：自助文档、平台集成和产品驱动扩张
        blocks:
          - type: paragraph
            body: >-
              Razorpay 的 GTM 看起来高度依赖生态。文档、SDK 和仪表盘密钥设置支持自助入驻，应用商店里的伙伴集成则通过已经掌握工作流语境的商户软件做分发。Shopify 和 WooCommerce
              是线上商店的直接电商入口，Shiprocket 则把 Razorpay 接到物流密集型、面向国内和国际发货的印度电商卖家。Payment Links 和 Subscriptions
              把覆盖面从购物车驱动的电商，延伸到服务、收款和周期性计费模式。


              也就是说，Razorpay 不必为每个商户都配置重型外勤销售。商户可以在电商技术栈、开发者流程或财务工作流里发现产品，之后再扩张到付款或银行服务。代价是，支持质量和集成可靠性会成为 GTM
              效率的一部分。产品靠自助和生态渠道销售时，糟糕的支持解决会悄悄伤害长尾商户的转化和留存。
