        - 显示规模扩大后毛利改善。
        - 仍不能解释 opex、亏损或现金生成。
      - - FY25 净亏损
        - FY25 / 2025-2026 年披露
        - Rs 1,209 crore 亏损
        - 估值不能忽视正常化风险的主因。
        - 亏损包含一次性迁册和 ESOP 影响。
      - - Moneycontrol / Tracxn 估值头条
        - 2026 年文章引用 2025 年估值标记
        - $9.2B
        - 抓取资料中最显眼的当前后期价格锚。
