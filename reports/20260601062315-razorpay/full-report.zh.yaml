  - id: TV006
    title: 投资逻辑破裂与否决触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 审计文件不及预期
        - 招股书或尽调文件显示抽佣率更低、利润率更弱，或营运资本质量差
        - 削弱私募估值头条隐含的溢价
        - 转为回避，或要求价格重定至悲观区间。
      - - IPO 进程明显滑坡
        - 上市延期，且没有配套披露升级
        - 把动能逻辑变成等待成本问题
        - 降低确信度，并要求更好的入场价格。
      - - 股权结构表 / 优先权不利
        - 后期尽调暴露堆叠复杂、棘轮条款或新资金经济性差
        - 头条估值夸大真实投资者经济性
        - 按完全稀释并调整优先权后的条件重新承销。
      - - 服务或监管冲击出现
        - 支持、信任或合规问题在 IPO 准备期爆发
        - 推高折现率，并削弱持久性假设
        - 在问题被量化并补救前，按投资逻辑破裂处理。
      - - 产品广度质量低
        - 分部数据显示广度带来收入，却没有带来持久利润
        - 摧毁“全栈溢价”论点
        - 估值更接近窄支付同行，而不是宽基础设施同行。
    notes: 触发项写成可监测事件；它们会改变愿意支付的价格，而不是泛泛业务风险。
    claimRefs:
      - CV037
      - CV039
      - CV040
      - CV045
      - CV046
      - CV047
  - id: TV007
    title: 最终尽调清单表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 审计文件包
        - 经审计的 FY25 / FY26 财务、会计政策和法律实体范围
        - 从叙事区间走向可承销估值的核心要求
        - 索取招股书草案、审计师资料包或投行模型工作簿。
      - - 股权结构表和优先权
        - 当前所有权、优先股堆叠、转换机制和稀释压力
        - 头条估值可能与真实新资金经济性相差很大
        - 审阅股权结构表律师备忘录和最新融资文件。
      - - 实体到产品桥
        - 网关、银行服务、POS、薪资、卡、借贷和托管如何映射到报告实体
        - 解释为何公开实体快照与合并口径新闻数字不一致
        - 索取法律实体地图和 IPO 准备使用的产品收入桥。
      - - 分部盈利能力
        - 按产品线拆分的抽佣率、毛利率、opex 和亏损状况
        - 判断广度应得溢价还是折价
        - 审阅分部 P&L 和月度管理仪表盘。
      - - 治理与控制
        - 董事会构成、委员会、风险归属和监管往来
        - 估值需要治理信心，也需要增长信心
        - 索取治理包、风险委员会材料和外部律师摘要。
      - - 公开市场准备度
        - 募资用途、上市时间表、披露节奏和投资者教育材料
        - 判断当前估值讨论能否落地，还是只停留在叙事
        - 向投行索取 IPO 时间表、关键尽调工作流和信息草案。
    notes: 这些要求是把评级从观察升级到按溢价估值买入所需的最低证据包。
    claimRefs:
      - CV013
      - CV037
      - CV041
      - CV042
      - CV043
      - CV045
      - CV047
      - CV054
