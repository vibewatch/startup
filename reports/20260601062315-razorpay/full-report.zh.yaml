  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 全栈产品表面已横跨收单、银行、出款和嵌入式金融
        blocks:
          - type: paragraph
            body: >-
              Razorpay 不再把自己呈现为单一支付网关。官网首页、支付页面和 RazorpayX
              套件中，公司一贯把在线收单、企业银行、薪资、资本和跨境工作流打包为面向商户的一套运营栈。收单层覆盖标准网关、支付链接、支付页面、按钮、QR 码、发票、smart collect、订阅、国际支付和
              POS。银行层延伸到支付出款、往来账户、托管、外汇处理、税款支付和薪资；借贷层则为 NBFC 和金融科技使用场景增加信用额度与数字借贷工作流，配合符合 DLG 要求的出款和更快的伙伴入驻。


              这种宽度重要，因为它把产品从结账单点解决方案，变成一个可以横跨收款、结算、资金管理和合规的工作流系统。对商户来说，核心产品故事是先落地、后扩张：先从支付收单开始，业务扩张后再挂接支付出款、往来账户或跨境收款。主要尽调保留项是，Razorpay
              对模块菜单的披露远好于对模块采用情况的披露。公开材料显示了宽度，但没有显示各产品线的确切收入贡献或商户份额贡献。
