      - number: '4.2'
        title: 成本结构与单位经济
        blocks:
          - type: paragraph
            body: >-
              公开记录最强的是收入动能，最弱的是单位经济。FY25 披露给出了收入、毛利和报告亏损，但没有给出
              ARR、GMV、抽佣率、净收入留存、CAC、回本周期或按产品线划分的毛利率。即便如此，产品组合仍能让我们推断部分成本结构方向。一家公司同时销售网关收单、线下
              POS、订阅、支付出款、托管、出口商服务和国际扩张，比单 SKU 处理商承担更多运营复杂度。合规、争议处理、结算运营、商户支持、伙伴银行协调和跨境服务，都可能影响收入成本和运营费用。


              Tofler 的类资产负债表仪表盘提供了有用但不完美的补充信息。它显示截至 2025 年 3 月，主要印度实体拥有 ₹1,763.1 crore 现金及现金等价物、₹4,906.9 crore
              资产、₹3,771.9 crore 净资产，且无借款。但同一仪表盘也显示出与合并 FY25 新闻报道不一致的收入数字，这意味着该申报视角是实体层面，而非干净合并图景。这一错配在分析上很重要。它说明
              Razorpay 跨实体和产品线的财务复杂度可能足够高，投资者不能安全地从一个数据点外推稳态利润率。因此，公开证据足以说明公司已具规模且相对有流动性，但不足以量化标准化单位经济。
