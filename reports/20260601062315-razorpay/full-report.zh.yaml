      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Razorpay 的治理仍明显由创始人塑形。领导层页面列出 Harshil Mathur 为 CEO 兼联合创始人，Shashank Kumar 为董事总经理兼联合创始人；更宽的运营团队包括 Rahul
              Kothari、Arif Khan、Arpit Chugh、Khilan Haria、Apuarv Sethi 和 Ayush
              Bansal。这个具名运营班底降低了早期只有创始人时的执行集中度，但公开记录对法定董事会构成、董事委员会和控制权的披露，远弱于对高管角色的披露。2023 年 4 月，Razorpay 设立由前 RBI 副行长
              G. Padmanabhan 担任主席、Arijit Basu 和 K. P. Krishnan
              参与的顾问委员会，试图弥合部分感知缺口。该动作重要，因为公司运行在高度监管的支付环境中，客户保护、托管控制和合规文化都会产生战略后果。核心尽调问题在于，公开证据能确认高管名单和顾问信号，但不能画出完整董事会地图，也不能说明创始人领导层与正式治理机构之间的确切权限划分。
