      - number: '6.5'
        title: 扩张潜力真实存在，但集中度和竞争风险披露仍不足
        blocks:
          - type: paragraph
            body: >-
              公开客户叙事支持三个方向的扩张：从网关向财务运营交叉销售，从 D2C 扩到线下零售和出口商，以及从印度扩到马来西亚和新加坡。FY25 报道强化了这一判断，因为独立报道把
              POS、银行和国际业务与网关并列为增长驱动。不过，公司仍然只在很高层级披露客户组合。投资人拿不到活跃商户数、分部收入、头部客户集中度，也看不到逐地域的商户贡献。


              竞争也随细分市场变化。PhonePe 展示了有名的印度电商客户，PayPal 对出口商和国际收款仍有相关性，Pine Labs 在线下全渠道 POS 很强，Adyen
              则是更全球化的企业级标杆。在这个背景下，Razorpay 的宽度有吸引力；但缺少硬集中度和留存数据，意味着扩张故事仍更多由 logo 和产品发布支撑，而不是由队列经济性支撑。
