      - number: '2.5'
        title: 增长驱动与约束
        blocks:
          - type: paragraph
            body: >-
              从当前证据库看，最强的结构性驱动很清楚：UPI 按使用量把印度变成非常大的数字支付市场，QR 收单已经无处不在，RBI 也在主动推动跨境 UPI 连接和跨境 PA
              框架。这些条件制造出更多需要结账、结算和合规软件的商户，即便支付轨道层本身的变现正在商品化。Razorpay 的相邻产品——支付出款、往来账户、托管和借贷技术——契合这一方向。主要约束同样清楚。RBI 的
              2025 年 Master Direction 收紧了 KYC、托管和安全要求；获授权实体名单显示赛道竞争激烈且需要持牌；UPI QR 端点暴增与 POS
              终端下降之间的差距说明，并不是每一个收单表面都有同样经济性。实践中，市场奖励能围绕支付变现商户运营的平台，而不只是支付发起本身。因此，关键尽调问题不是「数字支付增长有多快？」，而是「Razorpay
              在这轮增长中，在哪里捕获可持续抽佣率或软件利润率？」
