        - label: 资本缓冲背景（INR crores）
          low: 1245
          mid: 1763.1
          high: 3771.9
          displayValue: ₹1,245 → ₹1,763.1 → ₹3,771.9
          detail: 低值 = 反向迁册税负，中值 = 实体层面现金等价物，高值 = 实体层面净资产。
          tone: neutral
        - label: FY25 规模背景（INR crores）
          low: 906
          mid: 1277
          high: 3783
          displayValue: ₹906 → ₹1,277 → ₹3,783
          detail: 低值 = FY24 毛利，中值 = FY25 毛利，高值 = FY25 合并收入。
          tone: positive
    approximationNotes: 这些公开区间是输入和锚点，不能替代带有烧钱速度和利润率披露的合并运营模型。
