      - number: '7.2'
        title: 合作银行、支付轨道和司法管辖依赖，可能快速传导为增长或服务摩擦
        blocks:
          - type: paragraph
            body: >-
              Razorpay 的公开材料反复显示，关键工作流依赖第三方，而不是内部拥有的金融基础设施。RazorpayX 称自己不是银行，经常账户页面点名合作银行，数字借贷页面围绕 NBFC
              和受托人关系搭建，托管页面则强调合作银行路由和获批资金流。对非银平台来说，这些设计合理，但也让交易对手成为真实故障点。RBI 报告又加了一层：UPI 现在主导印度支付量，这意味着支付公司即便在 UI
              层看似多元，也在一个极度集中的零售轨道环境里运营。新加坡和马来西亚跨境发布、面向 Amazon 卖家的出口商工具，以及 Apple Pay
              支持拓宽了可服务市场，但也引入更多伙伴、更多规则书和更多对外部就绪度的依赖。正确框架是：Razorpay
              的触达靠伙伴放大；如果任一银行、NBFC、受托人、卡组织或海外市场流程变化快过公司适配速度，同样的触达也会变成瓶颈。
