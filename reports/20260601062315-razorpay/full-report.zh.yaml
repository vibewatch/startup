      - CI024
      - CI031
      - CI033
      - CI034
      - CI035
      - CI036
      - CI037
      - CI041
  - id: TE001
    title: 产品模块 / 资产矩阵
    columns:
      - 模块 / 资产
      - 主要用户
      - 状态 / 成熟度
      - 差异化
      - 尽调缺口
    rows:
      - - 在线支付受理套件
        - 线上商户、市场平台、App
        - 已上线，覆盖面广
        - 网关，加上链接、页面、按钮、二维码、发票、订阅、国际支付、POS
        - 未公开按产品线拆分的收入或按模块拆分的活跃商户占比
      - - Payment Links 和 Payment Pages
        - SMB、服务型商户、收款团队
        - 已上线，自助式
        - 邮件 / 短信 / 社交分发、批量创建、webhook 跟踪、近 100 种货币
        - 未公开相对于完整网关安装的附加率
      - - 订阅 / UPI AutoPay
        - 经常性收入业务
        - 已上线，已成型
        - 覆盖银行卡、UPI、eMandate、国际卡的经常性扣款计划；UPI AutoPay 自 2020 年起已有历史
        - 未公开流失、续费失败或追回收入指标
      - - Razorpay POS
        - 线下商户、全渠道品牌
        - 已上线，仍在扩张
        - UPI 1.5s 内完成，银行卡 15s 内完成，忠诚度 / 优惠、数字账单，2025 年推出自修复 AI
        - 缺少对正常运行时间、问题解决和成功率主张的独立验证
      - - RazorpayX 银行套件
        - 财务和运营团队
        - 已上线，是战略核心
        - 在一个工作流里处理付款、活期账户、托管、外汇、税务、薪资和供应商付款
        - 各银行模块的实际采用深度未公开拆分
      - - Digital Lending 2.0
        - NBFC 和金融科技放款机构
        - 已上线但偏细分
        - 借助活期 / 托管账户设置，完成符合 DLG 的放款和 48 小时内伙伴入驻
        - 未披露客户数、放款量或违约表现指标
      - - Curlec 和跨境栈
        - 马来西亚商户和印度出口商
        - 已上线，仍在扩张
        - 印度销售 / 马来西亚结算、Apple Pay、Amazon 出口商流程、新加坡扩张
        - 区域商户数和交易量仍未披露
      - - 应用商店生态集成
        - Shopify / WooCommerce / 物流关联商户
        - 已上线
        - 借助合作伙伴软件完成产品化接入，而不是做定制开发
        - 未公开按合作伙伴渠道拆分的激活数量
      - - 资金 / 企业卡流程
        - 财务团队和创始人
        - 已上线
        - 把商户关系从收款延伸到支出管理和营运资本周边流程
        - 未公开用户数、支出规模或附加率
      - - 外汇 / 资金管理支持
        - 出口商和跨境财务团队
        - 已上线导航入口
        - 表明 Razorpay 想掌握跨境资金流转和资金管理流程
        - 未公开采用情况、定价或吞吐量数据
    notes: 模块状态基于公开产品页面和新闻稿。公开披露对模块宽度讲得多，对各模块采用占比或单位经济性讲得少。
