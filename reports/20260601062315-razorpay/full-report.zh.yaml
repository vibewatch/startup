      - number: '1.3'
        title: 资本结构与监管状态
        blocks:
          - type: paragraph
            body: >-
              公开资本市场证据碎片化，但方向清楚。Y Combinator 资料称，Razorpay 从 Series A 到 F 共融资 $741.5 million，上一轮融资估值 $7.5 billion。关于拟议
              IPO 的媒体报道提供了更新但不够确定的读数：公司在 2025 年完成反向迁回印度，正准备在印度上市，并据报道已委任 Axis Capital、Kotak Mahindra Capital、J.P. Morgan
              和 Citi 组成承销团，交易规模可能超过 $700 million。YC、Moneycontrol 和较早 Razorpay 新闻稿反复出现的投资者包括 GIC、Tiger Global、Peak XV /
              Sequoia India、Ribbit Capital、Matrix Partners、Mastercard 和 Y Combinator。Tofler 的注册数据列示授权资本 ₹1,500
              crore、实缴资本 ₹858.12 crore；RBI 记录则显示 Razorpay Payments Private Limited 已获在线支付聚合商授权，Razorpay Technologies
              Private Limited 另列于央行运营商名单。关键判断是：监管和上市准备都已推进，但当前私人市场标记仍是推断值，并非外部重新定价。
