      - number: '2.3'
        title: 买方细分与采用路径
        blocks:
          - type: paragraph
            body: >-
              Razorpay 市场中的买方并不统一。对长尾 SME 和 D2C 卖家来说，经济买方往往是创始人或财务负责人，他们选择快速入驻路径；用户则是整合结账、物流和收款的商户运营团队或开发者。对订阅或 SaaS
              企业来说，买方扩展到增长、财务和账单负责人，因为重试、授权和周期性扣款成功率很重要。在线下和全渠道零售中，运营和门店经理关心终端可靠性和排队速度，CFO 关心对账和结算。RazorpayX
              和托管产品把平台推向财务运营更重的买方，例如市场平台、企业、NBFC 和借贷平台，合规和资金管理工作流负责人会成为核心决策者。Python、Java、Go 上的公开 SDK
              足迹，加上主文档站，进一步说明即使开发者不是预算负责人，仍是关键用户。因此，采用路径通常从窄痛点出发——结账、支付出款或收款——当商户想减少供应商并加强资金流转自动化时，再进入更宽的运营套件。
