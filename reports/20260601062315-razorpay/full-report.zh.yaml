          - type: paragraph
            body: >-
              Razorpay 确实给出了真实客户证据，但这些证据集中在少数可见细分场景。POS 页面有 Amazon Pay、Nestasia、Juicy Chemistry 和 Lenskart
              的直接证言。这些引用有价值，因为它们讲的是生产环境用法，而不是泛泛的 logo 墙：Amazon Pay 提到扩展到每天数百万笔交易，Nestasia 强调收款可靠性，Juicy Chemistry
              提到门店铺开，Lenskart 则强调安全验证和 EMI 带来的灵活性。在线上和跨境侧，Apple Pay 发布稿点名 Mokobara、Akasa Air、Pernia’s Pop-Up
              Shop、Sabyasachi、Nish Hair 和 House of Masaba 已经在使用该能力。


              出口商和区域证据更像队列证据，而不是按 logo 呈现的证据。Razorpay 的 Amazon Global Selling 发布稿面向 150,000+ 家印度出口商，Curlec 则让 KUALESA
              等马来西亚商户可以面向印度销售，并在本地结算。模式很清楚：公开证据真实存在，但集中在有品牌的消费商户、出口商和面向马来西亚的电商，而不是完整披露的大企业名单。较早的案例研究扩大了这组证据：Furlenco 称
              RazorpayX 将退款相关投诉量降低 70%，PaisaBazaar 称 eMandate 将单客注册成本降低 70%，FreshToHome 称团队借助 Razorpay 的文档和支持两天上线。
