  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 控制或服务失灵不是靠抽象的金融科技风险影响估值，而是通过入驻摩擦、支持负担和信任走弱传导。
    data:
      nodes:
        - id: n1
          label: RBI / 银行要求收紧
