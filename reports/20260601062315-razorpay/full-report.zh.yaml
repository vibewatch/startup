      - number: '6.4'
        title: 公开耐久性证据喜忧参半：G2 采用证据有用，但支持投诉可见，队列数据缺席
        blocks:
          - type: paragraph
            body: >-
              在公开第三方客户信号里，G2 是最有用的正面数据点。Razorpay 画像显示，106 条评论给出 4.2/5 评分，平均实施周期 1 个月，平均 ROI 周期 10 个月。评论文本显示，商户每天使用
              Payment Links，看重广泛的支付选项，也认可周期性或国际支付支持。这还不足以按风险投资口径证明留存，但确实显示小企业、中端市场和企业级评论者都在真实生产环境使用。


              Trustpilot 指向相反方向。归档页面给 Razorpay 1.4/5 评分，并反复出现支持慢、资金被扣留、争议处理差、后续跟进延迟等投诉。G2
              也有关于支持质量、分析下载延迟，以及国际支付审批流程困难的负面评论。综合起来很直接：产品采用是真实的，但主要公开耐久性风险来自服务质量，而不是需求看不见。仍然缺失的是硬队列证据——NRR、GRR、流失率，或按细分市场拆分的活跃商户留存。
