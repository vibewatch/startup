      - number: '5.3'
        title: 银行、支付出款、托管和借贷工作流加深工作流捕获，但也增加监管和支持复杂度
        blocks:
          - type: paragraph
            body: >-
              RazorpayX 被定位为套件的运营中心，核心是支付出款，相邻模块包括往来账户、托管、供应商付款、薪资和税务工作流。产品页面显示，公司有意从支付收单进入寻源到付款编排。Payouts
              营销即时批量付款和多银行路由；往来账户被描述为运营银行账户；托管结合受托、银行和自动化；数字借贷面向 NBFC / 金融科技工作流，提供符合 DLG 要求的出款和更快的伙伴入驻。


              这让 Razorpay 比止步结账的支付网关更有资格主张工作流所有权，同时也抬高了执行门槛。每一次向收单以外延伸，都会把公司更深地拉入受监管工作流、运营支持、伙伴银行可靠性和合规控制。Curlec 的 Bank
              Negara Malaysia 和 PayNet 引用、RBI 授权实体名单，以及 2026 年 2 月围绕 AI 助手的隐私政策更新，都强化同一点：Razorpay
              的产品现在是带有合规后果的基础设施，而不只是商户 UI 层。
