      - number: '8.4'
        title: 建议：证据追上前保持价格敏感的谨慎
        blocks:
          - type: paragraph
            body: >-
              现有公开记录支持兴趣，不支持确信。Razorpay 显然比早期支付 API 故事更扎实：收入规模真实，平台宽于网关，IPO
              进程看起来正在推进。但同一份记录也说明，投资人被要求自己跨过太多缺失证据。没有公开招股书草案，没有把实体备案与合并经济性连起来的经审计材料，没有优先权结构可见性，也没有产品级盈利桥接。在更高的报道估值上给出买入判断还太早。更干净的答案是继续研究
              / 跟踪，中等信心，高风险，并在 $9.2B
              头条估值下认为价格偏紧。如果经审计披露验证正常化盈利能力，且法律实体地图证明产品宽度创造了变现杠杆而不是不透明度，判断可以改善。在此之前，入场纪律应优先选择更好价格或更好证据。
