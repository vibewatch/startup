      - number: '7.4'
        title: 尽管收入强劲增长，财务模型和 IPO 执行风险仍然重大
        blocks:
          - type: paragraph
            body: >-
              Razorpay 的 FY25 叙事足够强，可以挡住简单的「缺资本金融科技」熊案。ET 和 Moneycontrol 都报道合并收入增长 65% 至 Rs 3,783
              crore，毛利提高，这是有意义的规模证明。但同一批报道也显示，ESOP、重组和迁册成本带来 Rs 1,209 crore 亏损；Inc42 则称印度业务预计 FY26
              才能盈利，合并盈利还要更晚。这给投资人留下典型后期公司模糊性：收入端证明很强，但可持续盈利质量仍在法律实体和上市过渡中被正常化。备案快照进一步加深了这种模糊性，因为实体层面的 Tofler
              数字和媒体合并口径头条完全不像一套数，这意味着投资人需要一张从法律实体到经营分部的精确地图，才能干净承销利润率或负债。IPO 准备不是移除风险，而是加剧风险。Moneycontrol 的 $700M+
              承销团故事，和 PL Capital 低得多的估值情景框架放在一起，说明价格预期已经比公开证据基础宽很多。
