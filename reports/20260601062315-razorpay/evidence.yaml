evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: >-
      A full statutory board list, committee structure, and founder control-rights disclosure for Razorpay’s
      post-redomiciling entity.
    whyItMatters: >-
      Executive roles are visible, but public governance quality cannot be fully assessed without director-level
      oversight and control-rights detail.
    diligencePath: >-
      Request the latest board register, committee charters, shareholder agreement summary, and cap-table control
      schedule from the company.
    relatedQuestionRefs:
      - QO011
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: >-
      A current board-approved valuation memo, recent secondary-clearing price, or external financing term sheet after
      the $7.5 billion Series F anchor.
    whyItMatters: >-
      IPO readiness and redomiciling create valuation expectations, but no fresh external price discovery is publicly
      visible.
    diligencePath: >-
      Ask for the latest 409A or internal valuation pack, secondary transaction history, and banker valuation materials
      prepared for IPO planning.
    relatedQuestionRefs:
      - QO030
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: merchant-scale
    missingEvidence: >-
      A segmented merchant count by product line, geography, active status, and enterprise/SME split rather than a
      single aggregate business count.
    whyItMatters: >-
      The headline scale claim does not reveal retention quality, monetisation mix, or the relative weight of enterprise
      versus long-tail merchants.
    diligencePath: >-
      Request cohort-level merchant dashboards showing active merchants, churn, TPV contribution, and product
      penetration by merchant segment.
    relatedQuestionRefs:
      - QO031
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: market-share
    missingEvidence: >-
      Razorpay’s current TPV, take rate, active merchant count, and share of online merchant GMV by rail and product
      line.
    whyItMatters: >-
      Public market-sizing data is abundant, but company-specific market capture cannot be measured without internal
      operating metrics.
    diligencePath: >-
      Request monthly TPV by rail, active merchant cohorts, net take rates, and contribution margins for gateway, POS,
      and RazorpayX products.
    relatedQuestionRefs:
      - QM028
      - QM029
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: tam-sam-definition
    missingEvidence: >-
      A high-quality public source that defines India’s payment-aggregator TAM or SAM specifically rather than broader
      national payment-system activity.
    whyItMatters: >-
      RBI data sizes rails and infrastructure, but it does not isolate the monetisable aggregator layer that most
      investors care about.
    diligencePath: >-
      Source banker decks, industry reports, or primary filings from listed Indian payment processors that reconcile
      payment volume, merchant count, and revenue pools.
    relatedQuestionRefs:
      - QM004
      - QM028
      - QM029
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: segment-economics
    missingEvidence: >-
      Retention, churn, attach-rate, and gross-margin data by segment across gateway, POS, payouts, and RazorpayX
      products.
    whyItMatters: >-
      The market map is clear, but the economic quality of each segment is not. Without segment economics, workflow
      breadth may look stronger than actual monetisation.
    diligencePath: Request cohort retention, cross-sell attach rates, CAC payback, and margin by merchant segment and product family.
    relatedQuestionRefs:
      - QM030
    relatedTableRefs:
      - TM003
      - TM004
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Realized MDR, negotiated pricing bands, and attach rates for Razorpay gateway, POS, subscriptions, and exporter
      tools by merchant cohort.
    whyItMatters: >-
      Without realized economics, it is impossible to test whether breadth actually produces superior share-of-wallet or
      just a wider but low-yield SKU surface.
    diligencePath: >-
      Request cohort-level pricing schedules, blended take rates, and attach-rate data by merchant size and product line
      for FY25-FY26.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: win-loss-data
    missingEvidence: >-
      Merchant switching, churn, and win-loss evidence showing where Razorpay loses or gains share against PhonePe,
      PayU, CCAvenue, Pine Labs, Stripe, or PayPal.
    whyItMatters: >-
      Support complaints and product overlap are directionally useful, but they do not quantify whether the company is
      defending or losing merchant share in the most contested cohorts.
    diligencePath: >-
      Ask management for win-loss logs, pipeline stage data, churn reasons, and merchant-migration examples by segment
      and channel partner.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics-missing
    missingEvidence: GMV or TPV, realized take rates, ARR, retention, CAC, payback, and product-level contribution margins.
    whyItMatters: >-
      These are the minimum metrics needed to test revenue quality, margin durability, and whether the newer products
      are truly accretive to the core payments engine.
    diligencePath: >-
      Request management reporting with product-level revenue, gross margin, contribution margin, cohort retention, and
      acquisition-cost bridges for FY25-FY26.
    relatedQuestionRefs:
      - QI021
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: runway-missing
    missingEvidence: >-
      Consolidated cash, restricted balances, monthly burn, planned capex, and explicit runway assumptions after
      reverse-flip cash outflows.
    whyItMatters: >-
      Entity-level cash is directionally helpful, but without a consolidated runway view investors cannot judge
      financing dependency or downside protection if growth or IPO timing slips.
    diligencePath: >-
      Request board cash-runway reporting, scenario plans, and a consolidated balance sheet or cash-flow statement by
      legal entity and business line.
    relatedQuestionRefs:
      - QI023
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: performance-validation
    missingEvidence: >-
      Independent uptime, authorization-rate, and failover evidence for POS, Turbo UPI, checkout optimization, and
      payouts routing claims.
    whyItMatters: >-
      Razorpay's strongest technical differentiation claims are framed in performance terms, but public materials do not
      show audited reliability data.
    diligencePath: >-
      Request service-level dashboards, incident history, authorization-rate benchmarks, and customer retention by
      product line.
    relatedQuestionRefs:
      - QE023
  - type: missing-source
    severity: material
    topic: product-mix
    missingEvidence: >-
      Module-level merchant counts, TPV/GMV mix, or revenue contribution across gateway, POS, banking, and international
      products.
    whyItMatters: >-
      The public narrative emphasizes breadth, but investment judgment depends on whether non-core modules are
      meaningful businesses or only early add-ons.
    diligencePath: Ask management for FY25 product-mix disclosures, active-merchants-by-module, and cross-sell attachment rates.
    relatedQuestionRefs:
      - QE025
  - type: private-evidence-only
    severity: material
    topic: technical-disclosure
    missingEvidence: Internal architecture for fraud, observability, routing logic, databases, and disaster recovery.
    whyItMatters: >-
      External APIs can look mature even when the underlying control plane has hidden single points of failure or
      compliance weaknesses.
    diligencePath: Request architecture review materials, SRE dashboards, fraud-control design, and major-incident postmortems.
    relatedQuestionRefs:
      - QE024
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, logo churn, cohort retention, and merchant-vintage behavior by product line.
    whyItMatters: >-
      Public review data shows adoption and complaints, but it cannot substitute for cohort economics when evaluating
      customer durability.
    diligencePath: >-
      Request monthly active merchants, TPV retention by cohort, logo churn, NRR, and GRR segmented by product and
      merchant size.
    relatedQuestionRefs:
      - QU016
      - QU017
  - type: missing-source
    severity: material
    topic: active-merchants
    missingEvidence: >-
      Active merchant count, product attach rates, and share of the 8M-plus headline base that is currently processing
      volume.
    whyItMatters: A total business count is not enough to judge monetization quality or the size of Razorpay's paying customer base.
    diligencePath: >-
      Ask management for monthly active merchants, revenue-generating merchants, and attach by gateway, POS, payouts,
      and subscriptions.
    relatedQuestionRefs:
      - QU002
      - QU023
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer, top-segment, and top-geography concentration data for revenue or TPV.
    whyItMatters: >-
      The expansion story could be compelling or fragile depending on whether a few large cohorts or geographies
      dominate economics.
    diligencePath: >-
      Request top-10 customer contribution, segment revenue mix, India vs ex-India split, and concentration by payment
      vertical.
    relatedQuestionRefs:
      - QU018
      - QU025
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: >-
      A broader named-customer roster across enterprise, platform, and finance-op buyers beyond the current public
      testimonials and launch references.
    whyItMatters: >-
      Current named proof is strongest in visible consumer brands and POS case snippets, which may overrepresent certain
      merchant segments.
    diligencePath: >-
      Request customer references segmented by D2C, enterprise, platforms, exporters, offline retail, and Southeast
      Asia.
    relatedTableRefs:
      - TU003
    relatedQuestionRefs:
      - QU007
      - QU024
  - type: private-evidence-only
    severity: material
    topic: regulator-remediation
    missingEvidence: RBI exam findings, supervisory correspondence, remediation log, and any ongoing action plans.
    whyItMatters: Public sources prove the perimeter exists but do not show how much hidden remediation work remains.
    diligencePath: Request board risk-pack excerpts, outside counsel summaries, and regulator correspondence tied to PA compliance.
    relatedQuestionRefs:
      - QR025
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: support-sla
    missingEvidence: Ticket aging, first-response SLA, complaint backlog, dispute outcomes, and any public outage history.
    whyItMatters: Trust risk cannot be sized cleanly from anecdotal reviews alone.
    diligencePath: Ask management for support dashboards, merchant-NPS trend, and incident postmortems for the last four quarters.
    relatedQuestionRefs:
      - QR024
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: segment-economics
    missingEvidence: >-
      Product-level revenue, gross margin, loss, and working-capital bridge across gateway, POS, banking, and lending
      products.
    whyItMatters: Investors cannot tell whether product breadth is compounding profitability or hiding weaker subscale lines.
    diligencePath: Request segment P&L, cohort take-rate trend, and legal-entity-to-product mapping used for IPO planning.
    relatedQuestionRefs:
      - QR026
    relatedTableRefs:
      - TR004
  - type: access-blocked
    severity: minor
    topic: customer-escalation-surface
    missingEvidence: Reliable public grievance-escalation detail and complaint-resolution mechanics beyond marketing pages.
