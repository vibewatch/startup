    severity: material
    topic: cap-table-preferences
    missingEvidence: Current ownership, preference stack, anti-dilution terms, and IPO conversion mechanics.
    whyItMatters: Headline valuation can materially overstate the economics available to new investors.
    diligencePath: Review financing documents, counsel memo, and fully diluted cap-table model.
    relatedQuestionRefs:
      - QV026
    relatedTableRefs:
      - TV007
  - type: private-evidence-only
    severity: material
    topic: segment-unit-economics
    missingEvidence: >-
      Product-level take rates, gross margins, opex, and profit contribution across gateway, banking, POS, payroll,
      cards, lending, and escrow.
    whyItMatters: The premium case depends on breadth translating into durable monetisation, not just feature sprawl.
    diligencePath: Request segment P&L, cohort monetisation data, and product-level board dashboards.
    relatedQuestionRefs:
      - QV027
    relatedTableRefs:
      - TV007
  - type: missing-source
    severity: material
    topic: entity-map
    missingEvidence: >-
      Legal-entity-to-product mapping that explains why Tofler entity numbers diverge from press-reported consolidated
