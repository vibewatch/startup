  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: audited-filing-package
    missingEvidence: Audited filing package, including consolidated statements, accounting policies, and IPO-ready narrative.
    whyItMatters: Without an audited filing, valuation remains a bounded judgment call rather than an underwritable price.
    diligencePath: Request draft prospectus, audited annuals, and banker valuation bridge before committing capital.
    relatedQuestionRefs:
    - QV028
    relatedTableRefs:
    - TV007
  - type: private-evidence-only
    severity: material
    topic: cap-table-preferences
    missingEvidence: Current ownership, preference stack, anti-dilution terms, and IPO conversion mechanics.
    whyItMatters: Headline valuation can materially overstate the economics available to new investors.
    diligencePath: Review financing documents, counsel memo, and fully diluted cap-table model.
    relatedQuestionRefs:
    - QV026
    relatedTableRefs:
    - TV007
  - type: private-evidence-only
    severity: material
    topic: segment-unit-economics
    missingEvidence: Product-level take rates, gross margins, opex, and profit contribution across gateway, banking, POS, payroll, cards, lending, and escrow.
    whyItMatters: The premium case depends on breadth translating into durable monetisation, not just feature sprawl.
    diligencePath: Request segment P&L, cohort monetisation data, and product-level board dashboards.
    relatedQuestionRefs:
    - QV027
    relatedTableRefs:
    - TV007
  - type: missing-source
    severity: material
    topic: entity-map
    missingEvidence: Legal-entity-to-product mapping that explains why Tofler entity numbers diverge from press-reported consolidated results.
    whyItMatters: Investors cannot reconcile liabilities, licences, and profits without knowing which entity owns what.
    diligencePath: Obtain legal-entity chart, intercompany-flow summary, and product-level reporting perimeter.
    relatedQuestionRefs:
    - QV026
    - QV027
    relatedTableRefs:
    - TV005
    - TV004
