    - '2026'
    - $5.0B scenario
    - Adverse anchor that prevents overconfidence in the high mark.
    - Analyst/media scenario, not a binding market-clearing price.
  - - Working valuation view
    - Run date
    - $6.0B-$7.5B base; ~$6.5B-$7.0B central
    - Balances operating proof with disclosure and comp discipline.
    - Still a judgment range, not audited intrinsic value.
