    - Revenue does not equal normalized earnings quality.
  - - FY25 gross profit
    - FY25 / reported in 2025-2026
    - Rs 1,277 crore
    - Shows improving gross profit at scale.
    - Still does not resolve opex, losses, or cash generation.
  - - FY25 net loss
    - FY25 / reported in 2025-2026
    - Rs 1,209 crore loss
    - Main reason valuation cannot ignore normalization risk.
    - Loss includes one-off redomiciling and ESOP effects.
  - - Moneycontrol / Tracxn valuation headline
    - 2026 article citing 2025 mark
