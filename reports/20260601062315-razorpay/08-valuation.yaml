- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Probability signal
  - Valuation range
  - What must be true
  - Main failure mode
  rows:
  - - Bear
    - 25%
    - US$4.0B-US$5.5B
    - IPO buyers anchor near the PL downside scenario; public filing reveals weaker monetisation or quality than expected.
    - Disclosure and economics do not justify a premium narrative.
  - - Base
    - 50%
    - US$6.0B-US$7.5B
    - Scale is real, breadth matters, but disclosure still warrants a discount to the higher private headline.
    - Evidence improves only partially, leaving limited upside over current reporting.
  - - Bull
    - 25%
    - US$8.0B-US$9.5B
    - Audited disclosure validates growth durability, normalized profitability, and multi-product leverage.
    - Platform breadth fails to convert into clean, durable monetisation.
  - - Probability-weighted central view
    - 100%
    - approx. US$6.5B-US$7.0B
    - Current evidence supports meaningful enterprise value, but not full headline-premium confidence.
    - Paying the top-end headline before disclosure arrives leaves little buffer.
  notes: Ranges are analyst estimates using the public operating anchor, adverse scenario reporting, and public comp discipline rather than a fully auditable discounted-cash-flow model.
