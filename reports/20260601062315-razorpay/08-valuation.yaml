company:
  name: Razorpay
chapter:
  number: 8
  title: Valuation
  summary: 'Razorpay has enough public scale proof to deserve a serious valuation discussion, but not enough audited disclosure to justify paying the highest private-market headlines with confidence. The clean read is research-more / track: a base range around $6.0-7.5 billion and central view around $6.5-7.0 billion look more defensible than the reported $9.2 billion mark until audited filings, cap-table detail, and a legal-entity bridge close the evidence gap.'
sections:
- id: valuation-anchors-and-disclosure
  title: Valuation anchors exist, but the bridge is still disclosure-limited
  body: 'Razorpay now has enough public revenue and IPO chatter to make valuation a real debate, not an empty startup exercise. The strongest operating evidence is the FY25 print: multiple outlets report Rs 3,783 crore of consolidated revenue, meaningful gross profit growth, and a one-year loss inflated by redomiciling and ESOP costs. The strongest price anchor is much weaker. Moneycontrol cites a $9.2 billion post-money valuation and an IPO syndicate that could raise more than $700 million, while PL Capital frames a scenario closer to $5 billion. That spread is too wide to dismiss as noise because the public record still lacks the documents that would reconcile it: audited filings, a clean entity-to-product bridge, and cap-table mechanics. Tofler’s entity snapshot is useful precisely because it shows how incomplete public filing-style data remains. The result is a chapter whose first conclusion is not a number but a rule: valuation cannot outrun disclosure for long.'
