- id: recommendation-and-diligence
  title: 'Recommendation: price-sensitive caution until evidence catches up'
  body: 'The current public record supports interest, not conviction. Razorpay is clearly more substantial than an early-stage payment API story: revenue scale is real, the platform is broader than a gateway, and the IPO process appears active. But the same record also says investors are being asked to bridge too much missing evidence on their own. There is no public draft prospectus, no audited package that ties entity filings to consolidated economics, no preference-stack visibility, and no product-level profitability bridge. That makes a buy call at the higher reported valuation premature. The cleaner answer is research-more / track, medium confidence, high risk, and a stretched valuation stance at the $9.2 billion headline. The call can improve if audited disclosure validates normalized profitability and if the legal-entity map proves that breadth creates monetisation leverage rather than opacity. Until then, entry discipline should prefer either better price or better evidence.'
