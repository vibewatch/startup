tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Decision implication
  rows:
  - - Recommendation
    - research-more / track
    - Do not underwrite the $9.2B headline as a buyable price without IPO-grade disclosure.
  - - Valuation stance
    - stretched at $9.2B; fairer around mid-$6B to low-$7B
    - Current price headline leaves limited margin of safety.
  - - Confidence
    - medium
    - Enough evidence to bound the range, not enough to pinpoint entry economics.
  - - Risk rating
    - high
    - Missing audited filings, cap-table detail, and segment economics can reprice the case quickly.
  - - Best public operating anchor
    - FY25 revenue of Rs 3,783 crore
    - Scale is real and prevents a trivial bear case.
  - - Best public price anchor
    - Moneycontrol / Tracxn $9.2B valuation headline
    - Useful as a ceiling reference, not as clean fair value.
  - - Preferred entry discipline
    - wait for stronger evidence or a lower price
    - Either disclosure must improve or valuation must compress.
  - - Upgrade trigger
    - audited filing plus normalized profitability bridge
    - Would turn narrative into underwritable evidence.
  notes: Assessment is explicitly price-sensitive, not a generic company-quality score. “Fairer” means better supported by the current public evidence base.
