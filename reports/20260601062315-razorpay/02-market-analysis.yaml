  - type: missing-source
    severity: material
    topic: tam-sam-definition
    missingEvidence: A high-quality public source that defines India’s payment-aggregator TAM or SAM specifically rather than broader national payment-system activity.
    whyItMatters: RBI data sizes rails and infrastructure, but it does not isolate the monetisable aggregator layer that most investors care about.
    diligencePath: Source banker decks, industry reports, or primary filings from listed Indian payment processors that reconcile payment volume, merchant count, and revenue pools.
    relatedQuestionRefs:
