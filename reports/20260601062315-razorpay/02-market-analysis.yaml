- id: growth-drivers-and-constraints
  title: Growth Drivers and Constraints
  body: 'The strongest structural drivers are obvious from the current evidence base: UPI has turned India into a very large digital-payments market by usage, QR acceptance has become ubiquitous, and RBI is actively enabling cross-border UPI linkages and cross-border PA frameworks. Those conditions create more merchants who need checkout, settlement, and compliance software even when payment monetisation at the rail layer itself is commoditising. Razorpay’s adjacent products—payouts, current accounts, escrow, and lending-tech—fit that direction. The main constraints are equally clear. RBI’s 2025 master direction tightened KYC, escrow, and security expectations; the authorised-entity lists show a competitive, licensed field; and the gap between exploding UPI QR endpoints and declining POS terminals indicates that not every acceptance surface carries the same economics. In practice, the market rewards platforms that can monetise merchant operations around payments, not just payment initiation
    itself. That is why the key diligence question is less “how fast is digital payments growing?” and more “where does Razorpay capture durable take rate or software margin inside that growth?”'
