callouts:
- calloutType: insight
  title: UPI Makes the Market Huge by Usage, Not Automatically by Revenue Pool
  body: RBI’s data shows why simple “payments market size” narratives can mislead. UPI owns most transaction volume, but only a single-digit share of system value in H2 CY2025. That means gateways need software value, merchant workflow depth, and adjacent finance products to capture durable economics.
  claimRefs:
  - CM001
  - CM003
  - CM004
  - CM032
- calloutType: risk
  title: Regulated Crowding Will Keep Price Pressure High
  body: RBI’s current and historical PA lists show the field is licensed and crowded, not winner-take-all. Combined with 2025 master-direction requirements on KYC, escrow, and security, this creates a market where compliance cost rises even as take-rate pressure persists.
  claimRefs:
  - CM007
  - CM008
  - CM009
  - CM035
  - CM039
- calloutType: recommendation
  title: The Key Missing Inputs Are TPV, Take Rate, and Segment Economics
  body: Public evidence is sufficient to size the ambient market, compare competitors, and map merchant workflows. It is not sufficient to determine Razorpay’s true share or profit capture. Diligence should ask for TPV by rail, active merchants by cohort, attach rates for RazorpayX and POS, and margin by segment before using headline market growth to underwrite value.
  claimRefs:
  - CM011
  - CM031
  - CM043
