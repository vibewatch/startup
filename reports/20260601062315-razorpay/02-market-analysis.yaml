- id: TM004
  title: Growth Drivers and Constraints Table
  columns:
  - Driver / Constraint
  - Direction
  - Timing
  - Implication
  - Diligence Ask
  rows:
  - - UPI ubiquity in retail payments
    - driver
    - Current and compounding
    - Keeps expanding digital checkout behaviour and merchant need for orchestration
    - What portion of Razorpay volume is UPI versus card or other rails?
  - - QR-led acceptance sprawl
    - driver
    - Current
    - Favors software-led merchant onboarding over hardware-heavy rollout
    - How much monetisation comes from QR-linked merchants versus enterprise merchants?
  - - Embedded finance adjacency
    - driver
    - Current to medium term
    - Payouts, current accounts, escrow, and lending expand wallet share after checkout
    - What gross margin and retention uplift comes from attached products?
  - - Cross-border corridors and UPI linkages
    - driver
    - Current to medium term
    - Singapore and Malaysia openings create differentiated merchant corridors
    - How material is cross-border volume today and what take rates apply?
  - - Developer-led integration need
    - driver
    - Persistent
    - SDKs and plugins remain a moat for product-led adoption
    - What share of new merchants still integrate directly via API?
  - - RBI KYC / escrow / security rules
    - constraint
    - Current
    - Raises operating complexity and compliance cost for all aggregators
    - How much compliance spend is fixed versus variable as volume scales?
  - - Crowded licensed competitor set
    - constraint
    - Current
    - Compresses take rate and increases merchant switching risk
    - Where does Razorpay win on product depth rather than price?
  - - QR growth versus POS decline
    - constraint
    - Current
    - Makes hardware-led expansion less attractive than software-led monetisation
    - What is the payback period and failure rate on POS hardware deployments?
  - - Need for better private disclosure
    - constraint
    - Current
    - Public market and diligence teams still lack TPV, take-rate, and segment economics
    - Request TPV, active merchant, and cohort-level economics by product line
  notes: Pairs structural growth factors with the operating frictions most likely to shape long-run margins and market share.
