tables:
- id: TM001
  title: Market Definition Table
  columns:
  - Segment / Category
  - Included Spend or Workflow
  - Excluded Spend
  - Buyer / Payer
  - Relevance to Razorpay
  rows:
  - - Online payment gateway
    - Website and app checkout acceptance across cards, UPI, wallets, and netbanking
    - Pure bank transfer rails with no orchestration layer
    - CTO, product, payments lead
    - Core entry point into the market
  - - Payment links / remote collections
    - Ad hoc collections for services, offline pickup, and long-tail merchants
    - Pure invoice-only accounting tools
    - Founder, finance lead, ops manager
    - Expands addressability beyond fully integrated commerce stacks
  - - Subscriptions / recurring billing
    - Mandates, retries, recurring schedules, billing operations
    - Standalone accounting subscriptions with no payment execution
    - Growth, finance, billing owner
    - Important for SaaS, media, education, and insurance cohorts
  - - Offline / omnichannel POS
    - In-store cards, UPI acceptance, terminal uptime, checkout speed
    - Pure hardware leasing with no software or payment stack
    - Store ops, retail CFO, merchant owner
    - Key for omnichannel merchants after Ezetap and POS expansion
  - - Business banking / payouts
    - Vendor payments, treasury movement, current-account-linked operations
    - Traditional bank current accounts without automation layers
    - Finance, treasury, procurement
    - Raises wallet share after acceptance
  - - Escrow / lending-tech / compliance
    - Escrow accounts, trusteeship, disbursal controls, NBFC-fintech workflows
    - Unregulated consumer lending unrelated to merchant workflows
    - Risk, compliance, CFO, NBFC ops
    - High-compliance adjacency with stronger software defensibility
  - - Cross-border exporter collections
    - International checkout, settlement, and India-to-Southeast-Asia corridors
    - Pure remittance or wholesale FX products outside merchant commerce
    - Exporter finance lead, cross-border ops
    - Adds differentiated corridor opportunity through Curlec and exporter products
  notes: Defines the merchant-side workflow market around Razorpay, not the full Indian payment-system universe measured by RBI.
