  - type: private-evidence-only
    severity: material
    topic: market-share
    missingEvidence: Razorpay’s current TPV, take rate, active merchant count, and share of online merchant GMV by rail and product line.
    whyItMatters: Public market-sizing data is abundant, but company-specific market capture cannot be measured without internal operating metrics.
    diligencePath: Request monthly TPV by rail, active merchant cohorts, net take rates, and contribution margins for gateway, POS, and RazorpayX products.
    relatedQuestionRefs:
