chapter:
  number: 4
  title: Financials
  summary: 'Razorpay''s public financial picture improved materially in FY25, but it is still incomplete for underwriting. The strongest supported facts are the 65% rise in consolidated revenue to ₹3,783 crore, gross profit of ₹1,277 crore, management''s claim that the core online-payments business is already EBITDA-profitable, and filing-style balance-sheet signals that the main Indian entity held ₹1,763.1 crore of cash equivalents with no borrowings as of March 2025. The core blocker is disclosure quality: reported loss is distorted by reverse-flip tax and restructuring costs, while ARR, take rates, burn, runway, product-level margins, and customer concentration remain unavailable in public evidence.'
sections:
- id: revenue-model-and-fy25-traction
  title: Revenue model and FY25 traction
  body: 'Razorpay''s official product surfaces make the revenue model look much broader than a pure payment-gateway company. The retained official pages span gateway acceptance, offline POS, subscriptions, RazorpayX business banking, current accounts, payouts, escrow, exporter flows, and international expansion through Curlec and Singapore. That matters because the company is no longer pitching only one monetization lever. The business can plausibly earn transaction revenue, subscription or platform fees, payout and banking-style workflow fees, escrow and compliance-related income, and cross-border or forex-linked charges. Management''s FY25 commentary reinforces that reading by explicitly saying the growth mix came from payments gateway, POS, loyalty, RazorpayX, and international operations.


    Public FY25 reporting confirms real scale, not just product sprawl. Moneycontrol, The Economic Times, Business Standard, MediaNama, and Inc42 all converge on consolidated FY25 revenue of ₹3,783 crore versus ₹2,296 crore in FY24, with gross profit rising to ₹1,277 crore from ₹906 crore. Those are meaningful numbers for a still-private company. Just as important, management said the core online-payments business is now EBITDA-profitable and generating strong cash flows while newer businesses are scaling. That implies the underwriting question is no longer whether Razorpay has monetization avenues; it is whether those newer lines produce durable, high-quality revenue or merely add complexity and implementation cost around a still-opaque core.'
