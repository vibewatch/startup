- id: capital-adequacy-and-ipo-preparation
  title: Capital adequacy and IPO preparation
  body: 'Razorpay''s near-term capital story looks manageable, but not fully disclosed. The clearest positive signal is that Moneycontrol reported the reverse-flip tax liability—about ₹1,245 crore—would be paid from internal cash reserves and not with a fresh financing round. Combined with Tofler''s entity-level cash-equivalent figure and the absence of borrowings or registered charges, that points to a company that was not capital-starved going into IPO preparation. The weakness is that public sources still do not disclose consolidated cash on hand, monthly burn, runway, customer concentration, or off-balance-sheet obligations by product line. So the evidence supports adequate liquidity for current operations, not a precise runway model.


    IPO preparation is clearly underway. Moneycontrol reported that Razorpay had shortlisted four banks for an offering likely to exceed $700 million, while PL Capital''s headline framed the process as a confidential filing with a possible valuation reset toward $5 billion. Those signals sit alongside a more optimistic Moneycontrol or Tracxn market-data point of roughly $9.2 billion and Y Combinator''s older $7.5 billion Series F valuation marker. The implication is not that one number is right; it is that public valuation anchors are wide enough to matter. Razorpay appears financially disciplined enough to pursue listing, but public market discovery could still force a material repricing if investors discount disclosure gaps or treat reverse-flip-era profitability as non-recurring noise rather than proof of a durable margin profile.'
