  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics-missing
    missingEvidence: GMV or TPV, realized take rates, ARR, retention, CAC, payback, and product-level contribution margins.
    whyItMatters: These are the minimum metrics needed to test revenue quality, margin durability, and whether the newer products are truly accretive to the core payments engine.
    diligencePath: Request management reporting with product-level revenue, gross margin, contribution margin, cohort retention, and acquisition-cost bridges for FY25-FY26.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: blocking
    topic: runway-missing
    missingEvidence: Consolidated cash, restricted balances, monthly burn, planned capex, and explicit runway assumptions after reverse-flip cash outflows.
    whyItMatters: Entity-level cash is directionally helpful, but without a consolidated runway view investors cannot judge financing dependency or downside protection if growth or IPO timing slips.
    diligencePath: Request board cash-runway reporting, scenario plans, and a consolidated balance sheet or cash-flow statement by legal entity and business line.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI004
