- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - GMV or TPV and take rate by product
    - Cannot test whether topline growth comes from volume, pricing, or mix shift
    - Request GMV or TPV bridge and realized take rate by gateway, POS, subscriptions, and cross-border
  - - ARR, retention, and cohort behavior
    - Cannot assess recurring revenue quality or merchant stickiness
    - Request ARR bridge, gross retention, NRR, and cohort renewal data
  - - Consolidated cash, burn, and runway
    - Cannot model financing dependency or minimum-cash risk
    - Request board reporting on cash runway and monthly burn with scenario cases
  - - Product-level margins and contribution profit
    - Cannot identify whether newer businesses are accretive or cross-subsidized
    - Request gross margin and contribution margin by major product line
  - - Customer concentration and support load
    - Cannot price execution risk from large merchants or high-touch workflows
    - Request top-customer concentration, support burden, and dispute or chargeback concentration
  - - Regulatory or partner-bank exposure by product
    - Cannot measure working-capital, escrow, or contingent-liability risk
    - Request entity map, partner-bank agreements, and capital or guarantee requirements by product
  notes: These gaps are the minimum dataset needed to convert a promising FY25 snapshot into a full underwriting model.
