- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Publicly supported value / status
  - Why it matters
  - Financing implication
  - Diligence ask
  rows:
  - - Reverse-flip tax or restructuring burden
    - About ₹1,245 crore and funded from internal cash reserves
    - Largest clearly reported one-off cash burden tied to IPO preparation
    - Suggests liquidity existed without emergency financing
    - Confirm exact paid amount, timing, and any remaining tax exposure
  - - Cash and cash equivalents (entity-level)
    - ₹1,763.1 crore in March 2025 per Tofler dashboard
    - Best public liquidity datapoint
    - Positive signal, but not a consolidated runway measure
    - Provide consolidated cash, restricted balances, and cash by entity
  - - Assets and net worth (entity-level)
    - ₹4,906.9 crore assets and ₹3,771.9 crore net worth
    - Supports balance-sheet resilience ahead of listing
    - Suggests strong equity base if representative of the main entity
    - Show consolidated balance sheet and intercompany eliminations
  - - Borrowings and charges
    - No borrowings and no registered charges shown in Tofler dashboard
    - Low leverage reduces immediate refinancing risk
    - Supports a cleaner IPO story if true at group level
    - Confirm debt, guarantees, and partner-bank contingent exposure across all entities
  - - IPO preparation
    - Moneycontrol says shortlisted banks and issue size above $700 million
    - Capital-markets readiness affects liquidity options and market signaling
    - IPO could provide optionality even if not urgently needed for operations
    - Clarify filing timeline, primary vs secondary split, and use of proceeds
  - - Public valuation signals
    - Roughly $5 billion to $9.2 billion in current public reports, with older $7.5 billion private-round marker
    - Wide valuation band changes dilution and market appetite assumptions
    - Potential repricing risk remains material
    - Provide management's target peer set, valuation narrative, and sensitivity to disclosure gaps
  notes: Public balance-sheet evidence is useful but mixed; the strongest filing-style facts are entity-level and do not substitute for a consolidated cash-runway model.
