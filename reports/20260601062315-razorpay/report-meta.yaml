  productSummary: >-
    Razorpay sells merchant acceptance and money-movement infrastructure:
    online payment gateway, links, subscriptions, POS, payouts, current-account
    workflows, payroll, escrow, financing-adjacent products, international
    collections, and developer APIs/SDKs.
  customerFocus: >-
    Indian startups, SMBs, digital-first merchants, larger enterprises, exporters,
    and omnichannel businesses that need acceptance, settlement, disbursals, and
    operating-finance tooling from one platform.
  businessModel: >-
    Razorpay monetizes merchant payments and adjacent finance workflows through a
    mix of transaction-linked acceptance revenue, payout and banking workflow fees,
    subscriptions/platform tools, and value-added cross-border, software, and
    partner-led financial services.
  stage: "Late-stage private / IPO candidate"
