- id: partner-and-rail-dependencies
  title: Partner-bank, rail, and jurisdiction dependencies can transmit quickly into growth or service friction
  body: 'Razorpay’s public materials repeatedly show that key workflows rely on third parties rather than on internally owned financial infrastructure. RazorpayX says it is not a bank, the current-account page names partner banks, the digital-lending page is built around NBFC and trustee relationships, and the escrow page emphasises partner-bank routing and approved money flows. These are sensible design choices for a non-bank platform, but they turn counterparties into real points of failure. The RBI report adds another layer: UPI now dominates Indian payment volume, which means payment companies are operating on a retail rail environment that is extraordinarily concentrated even when they look diversified at the UI layer. Cross-border launches in Singapore and Malaysia, exporter tooling for Amazon sellers, and Apple Pay support widen the addressable market, but they also import more partners, more rulebooks, and more dependence on external readiness. The right framing is that Razorpay’s
    reach is partner-enabled; that same reach can become a chokepoint if any one bank, NBFC, trustee, scheme, or foreign market process changes faster than the company can adapt.'
