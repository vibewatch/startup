- id: operational-trust-and-product-sprawl
  title: Operational trust risk is amplified by product sprawl and visible support pain
  body: 'The operational story has two contradictory public signals. On one hand, Razorpay presents an increasingly broad platform spanning gateway, banking, POS, payroll, corporate cards, lending, and escrow, and its POS arm now claims self-healing hardware designed to resolve a majority of device issues proactively. On the other hand, the only broad public customer-sentiment surface available in the fetched set is the archived Trustpilot page, and it is conspicuously weak: a 1.4/5 rating with repeated complaints about delayed responses and ineffective escalation. That combination matters because the platform is no longer a narrow checkout widget. Every new workflow adds additional reconciliation, compliance, merchant-support, and incident-handling burden. Razorpay’s own chargeback guide makes the hidden operating cost explicit: disputes can temporarily debit merchant funds, trigger fees and penalties, and consume manual review bandwidth while a case is adjudicated. If service quality does not scale with product breadth, support issues stop being anecdotal and become a trust tax on retention and referrals. The mitigation is that management is clearly investing in reliability and platform depth. The
    residual exposure is that public evidence on SLA performance, outage frequency, false positives, and dispute-resolution quality is still missing.'
