- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - RBI or partner-bank escalation
    - Formal regulatory action, onboarding restriction, or partner-bank pause
    - Any named restriction that materially changes onboarding or settlement terms
    - Treat as thesis break until remediation evidence is reviewed.
  - - Customer-trust deterioration
    - Sustained complaint spike, adverse review trend, or evidence of poor escalation
    - Pattern of unresolved merchant or user support failures rather than isolated anecdotes
    - Move trust risk from medium-high to high and re-underwrite retention assumptions.
  - - Cross-border complexity outruns controls
    - New market launches arrive without matching compliance or legal disclosures
    - Two or more new corridors launched without jurisdiction-level control package
    - Discount expansion upside and demand local control owners before funding.
  - - IPO-disclosure gap persists
    - Roadshow or filing process still lacks entity map and normalized profitability bridge
    - No clear revenue / margin / liability bridge at listing prep stage
    - Reduce valuation appetite and treat financial model as opaque.
  - - Product-sprawl execution failure
    - Major incident in POS, payroll, cards, or lending reveals weak platform coordination
    - Public incident plus no convincing postmortem or SLA disclosure
    - Assume scale is creating fragility rather than leverage.
  - - Support-function underinvestment
    - Merchant-support metrics remain unavailable while complaints stay visible
    - Management cannot supply SLA, appeal, or backlog data in diligence
    - Assume trust pain is structural and increase discount rate.
  notes: Kill criteria are event-driven because public sources do not provide enough clean operating history to justify precise numeric thresholds.
