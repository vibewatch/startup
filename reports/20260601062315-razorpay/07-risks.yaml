company:
  name: Razorpay
chapter:
  number: 7
  title: Risks
  summary: 'Razorpay’s public risk picture is dominated by regulated-product complexity: it is authorised, but its current-account, lending, escrow, and cross-border workflows sit on partner banks, NBFCs, trustees, and RBI-controlled rails that can transmit quickly into onboarding friction or merchant pain. Strong FY25 growth and visible mitigation work help, yet customer-trust complaints, entity-structure opacity, and thin public operating disclosures keep regulatory, dependency, and service-quality risk elevated.'
sections:
- id: regulatory-and-legal-perimeter
  title: Regulatory and legal risk sits at the top of the stack
  body: 'Razorpay is no longer in the phase where licence status can be treated as a binary question. The RBI’s certificate list shows the company does hold PA-O authorisation, which is an important de-risking milestone, but the same RBI record and payment-systems report make clear that the real underwriting issue is ongoing compliance inside a tightly supervised perimeter. India’s 2025 payment-aggregator framework now standardises KYC, escrow, security, and governance obligations for non-bank operators, while the RBI’s sector status page still shows many applicants being returned, refused, or kept out of operation. That matters because Razorpay’s product story keeps expanding into banking-adjacent and cross-border workflows. Legal exposure is also visible in the company’s own privacy policy: KYC, regulator sharing, AI-integration logs, and India-based jurisdiction all pull the company deeper into a regulated data and conduct surface. The top risk is therefore not “will Razorpay get a licence,”
    but whether a broader product set can continue to satisfy a regulator that is actively narrowing tolerance for weak controls.'
