company:
  name: Razorpay
chapter:
  number: 5
  title: Product & Technology
  summary: 'Razorpay has expanded from a payment gateway into a broad India-first money-movement stack covering online checkout, payment links, recurring billing, POS, payouts, current accounts, escrow, lending workflows, payroll, and cross-border collections. The product surface is reinforced by official docs plus SDKs in Node, Python, Go, and Java, and 2025 launches such as MCP Server, Apple Pay for Indian exporters, Singapore expansion, Malaysia UPI acceptance, and AI-assisted POS self-healing. The strategic upside is clear platform breadth and cross-sell potential, but the technical disclosure is still shallow: key routing, observability, fraud, and uptime claims remain mostly marketing-led rather than independently validated, and public reporting does not break product revenue mix.'
sections:
- id: section-1
  title: Full-stack product surface now spans acceptance, banking, disbursals, and embedded finance
  body: |-
    Razorpay no longer presents itself as a single payment gateway. Across the homepage, payments pages, and RazorpayX suite, the company consistently packages online acceptance, business banking, payroll, capital, and cross-border workflows as one operating stack for merchants. The acceptance layer covers a standard gateway, payment links, payment pages, buttons, QR codes, invoices, smart collect, subscriptions, international payments, and POS. The banking layer extends into payouts, current accounts, escrow, forex handling, tax payments, and payroll; the lending layer adds line-of-credit and digital-lending workflows for NBFC and fintech use cases.

    This breadth matters because it changes the product from a checkout point solution into a workflow system that can sit across collections, settlements, treasury, and compliance. For merchants, the core product story is land-and-expand: start with payment acceptance, then attach payouts, current accounts, or cross-border collections as the business scales. The main diligence caveat is that Razorpay discloses the menu of modules far better than it discloses adoption by module. Public materials show breadth, but not the exact revenue or merchant-share contribution of each product line.
