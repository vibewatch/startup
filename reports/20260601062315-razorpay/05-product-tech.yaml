- id: TE003
  title: Technology / operating architecture table
  columns:
  - layer / component
  - role
  - dependency
  - risk
  rows:
  - - Merchant-facing acceptance surfaces
    - Hosted checkout, payment pages, links, QR, POS, subscriptions
    - Web/mobile apps and merchant frontend adoption
    - Feature sprawl can create inconsistent UX and support burden across modules
  - - Developer/API layer
    - Docs, SDKs, keys, webhook patterns, self-serve integrations
    - Dashboard credentialing and API governance
    - Public docs do not reveal deeper service reliability or observability architecture
  - - Routing and payments orchestration
    - Method selection, gateway management, multi-bank payout routing, Turbo UPI flows
    - Banks, PSPs, card networks, UPI rails
    - Success-rate and failover claims are marketed more clearly than they are independently evidenced
  - - Business banking control plane
    - Current accounts, payouts, escrow, tax payments, vendor workflows
    - Partner banks, trusteeship, compliance operations
    - Operational and regulatory failure risk increases as more treasury workflows move onto the stack
  - - Embedded finance / lending layer
    - NBFC-fintech disbursals and current-account / escrow workflow management
    - NBFC partners, current accounts, escrow accounts
    - No public disclosure of live customer counts or underwriting controls
  - - Cross-border layer
    - Curlec, Apple Pay, exporter settlement, Singapore and Malaysia expansion
    - Regional regulation, PayNet, Bank Negara, Apple Pay acceptance, exporter compliance documents
    - Regional go-to-market progress is visible; regional transaction depth is not
  notes: Architecture is reconstructed from public docs and launch pages. Internal service topology, databases, fraud models, and SLO instrumentation are not publicly documented.
