- id: section-3
  title: Banking, payouts, escrow, and lending workflows deepen workflow capture but add regulatory and support complexity
  body: |-
    RazorpayX is positioned as the operational center of the suite, with payouts at its core and adjacent modules for current accounts, escrow, vendor payments, payroll, and tax workflows. The product pages suggest a deliberate move from payment acceptance into source-to-pay orchestration. Payouts markets instant bulk payments and multi-bank routing; current accounts are framed as operational banking accounts; escrow combines trusteeship, banking, and automation; and digital lending is aimed at NBFC-fintech workflows with DLG-compliant disbursals and faster partner onboarding.

    This gives Razorpay a stronger claim to workflow ownership than payment gateways that stop at checkout. It also raises the bar on execution. Every extension beyond acceptance pulls the company deeper into regulated workflows, operational support, partner-bank reliability, and compliance controls. Curlec's Bank Negara Malaysia and PayNet references, RBI's authorized-entity list, and the February 2026 privacy-policy update around AI assistants all reinforce the same point: Razorpay's product is now infrastructure with compliance consequences, not just a merchant UI layer.
