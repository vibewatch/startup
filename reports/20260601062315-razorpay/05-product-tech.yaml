- id: section-5
  title: Breadth and narrative are strong; independent validation of performance and product mix remains the main technical diligence gap
  body: |-
    The strongest product thesis around Razorpay is not that any one feature is unique in isolation, but that the company has assembled a localized full-stack platform around Indian rails and merchant workflows. Stripe and Adyen also market unified payments stacks, but Razorpay's differentiation is its India-first combination of payment acceptance, payouts, current accounts, escrow, lending workflows, and country-specific rails such as UPI and local bank integrations. FY25 reporting suggests this is not cosmetic: business banking, POS, and international operations were all cited as growth drivers alongside the gateway.

    The main caution is evidence quality. Many of Razorpay's strongest technical claims remain unverified by independent infrastructure disclosures. Marketing surfaces claim 40% conversion uplift, 5x faster checkout, 99.9% payout success, and 100% POS device uptime, while independent reporting still frames the business as investing heavily in AI and global operations ahead of profitability. Public materials do not reveal module-level adoption, architecture depth, or third-party validation of reliability metrics. For product diligence, that is the core gap to close in management Q&A.
