  rows:
  - - Online payment acceptance suite
    - Online merchants, marketplaces, apps
    - Live and broad
    - Gateway plus links, pages, buttons, QR, invoices, subscriptions, international payments, POS
    - No public product-line revenue split or active-merchant share by module
  - - Payment Links and Payment Pages
    - SMBs, service merchants, collections teams
    - Live and self-serve
    - Email/text/social distribution, bulk creation, webhook tracking, nearly 100 currencies
    - No public disclosure on attach rate vs full gateway installs
  - - Subscriptions / UPI AutoPay
    - Recurring-revenue businesses
    - Live and established
    - Recurring schedules across cards, UPI, eMandate, international cards; UPI AutoPay history since 2020
    - No public churn, failed-renewal, or recovered-revenue metrics
  - - Razorpay POS
    - Offline merchants, omnichannel brands
    - Live and expanding
    - UPI in 1.5s, cards under 15s, loyalty/offers, digital billing, self-healing AI launch in 2025
    - Independent validation of uptime, issue-resolution, and success-rate claims is absent
  - - RazorpayX banking suite
    - Finance and ops teams
    - Live and strategically central
    - Payouts, current accounts, escrow, forex, tax, payroll, vendor payments in one workflow
    - Actual adoption depth of each banking module is not publicly broken out
  - - Digital Lending 2.0
    - NBFCs and fintech lenders
    - Live but niche
    - DLG-compliant disbursals and partner onboarding in 48 hours or less via current/escrow setup
    - No disclosed customer count, disbursal volume, or default-performance metrics
  - - Curlec and cross-border stack
    - Malaysia merchants and Indian exporters
    - Live and expanding
    - Sell in India / settle in Malaysia, Apple Pay, Amazon exporter flows, Singapore expansion
    - Regional merchant counts and transaction volumes remain undisclosed
  - - App-store ecosystem integrations
    - Shopify / WooCommerce / logistics-linked merchants
    - Live
    - Productized onboarding via partner software rather than bespoke custom builds
    - No public activation counts by partner channel
  - - Capital / corporate-card workflow
    - Finance teams and founders
    - Live
    - Extends merchant relationship into spend management and working-capital adjacent workflows
    - No public user count, spend volume, or attach rate
  - - Forex / treasury support
    - Exporters and cross-border finance teams
    - Live navigation surface
    - Signals ambition to own cross-border money movement and treasury workflows
    - No public adoption, pricing, or throughput data
  notes: Module statuses are based on public product pages and newsroom releases. Public disclosure is strong on module breadth and weak on adoption share or unit economics by module.
