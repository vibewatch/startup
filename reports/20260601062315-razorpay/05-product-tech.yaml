- id: TE004
  title: Trust / quality / compliance table
  columns:
  - control / requirement
  - status
  - scope
  - gap
  rows:
  - - RBI payment-aggregator authorization visibility
    - Visible in RBI authorized-entity list
    - Razorpay Payments Private Limited and Razorpay Technologies Private Limited entries
    - The list proves authorization status, not ongoing operational quality
  - - Curlec PCI DSS / PayNet / Bank Negara references
    - Company-claimed and publicly stated
    - Malaysia payments operations
    - Independent audit artifacts are not included in the fetched materials
  - - Privacy policy update for AI / MCP connector
    - Effective 23 Feb 2026
    - Website, services, apps, and external AI assistant interactions
    - The policy explains data handling changes but does not quantify usage or risk controls
  - - Unified support surface
    - Live
    - Gateway, banking, payroll, recurring, marketplace and loan support topics
    - One help surface can simplify onboarding but may conceal queueing and product-specific resolution variance
  - - Payment Systems Report backdrop
    - Regulatory environment tightening and expanding
    - India-wide payment-aggregator and acceptance-infrastructure context
    - Sector growth does not validate Razorpay-specific performance
  - - Payments grievance escalation path
    - Live
    - Merchant issue escalation beyond standard support intake
    - No public resolution-time or escalation-volume reporting
  - - Trusted-business onboarding surface
    - Live
    - Merchant trust and onboarding messaging tied to the payments stack
    - No public conversion or trust-score data attached to the surface
  notes: The trust picture is strongest where regulation or named compliance affiliations exist. It is weakest where Razorpay makes performance or safety claims without third-party infrastructure evidence.
