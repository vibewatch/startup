- id: section-2
  title: Developer surfaces are mature at the edge even though internal architecture disclosure is thin
  body: |-
    Razorpay's external integration surface is substantially more mature than its public infrastructure disclosure. The docs position the company as a comprehensive platform for accepting, processing, and disbursing payments, while official SDKs exist for Node, Python, Go, and Java. The repositories show standard merchant onboarding via dashboard-generated keys, and they support practical developer features such as retry logic, webhook handling patterns, and platform-partner authentication flows. Newer product pages extend that edge surface into routing, recurring, conversion, and spend-control layers via Optimizer, UPI AutoPay, Magic Checkout, and RazorpayX corporate cards.

    That combination indicates real self-serve merchant and developer distribution: merchants do not need a bespoke enterprise integration to get started, and platforms can build on top of the same APIs. The 2025 MCP Server launch further extends that pattern by turning payments into an AI-native integration surface. The risk is that Razorpay publishes the outward interface, but not much about the internals. There is little hard public detail on routing logic, fraud engines, failover architecture, observability, database design, or service-level objectives. For diligence, the question is not whether an API exists; it is whether the underlying control plane is resilient at the scale the company now markets.
