  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: performance-validation
    missingEvidence: Independent uptime, authorization-rate, and failover evidence for POS, Turbo UPI, checkout optimization, and payouts routing claims.
    whyItMatters: Razorpay's strongest technical differentiation claims are framed in performance terms, but public materials do not show audited reliability data.
    diligencePath: Request service-level dashboards, incident history, authorization-rate benchmarks, and customer retention by product line.
    relatedQuestionRefs:
    - QE023
  - type: missing-source
    severity: material
    topic: product-mix
    missingEvidence: Module-level merchant counts, TPV/GMV mix, or revenue contribution across gateway, POS, banking, and international products.
    whyItMatters: The public narrative emphasizes breadth, but investment judgment depends on whether non-core modules are meaningful businesses or only early add-ons.
    diligencePath: Ask management for FY25 product-mix disclosures, active-merchants-by-module, and cross-sell attachment rates.
    relatedQuestionRefs:
    - QE025
  - type: private-evidence-only
    severity: material
    topic: technical-disclosure
    missingEvidence: Internal architecture for fraud, observability, routing logic, databases, and disaster recovery.
    whyItMatters: External APIs can look mature even when the underlying control plane has hidden single points of failure or compliance weaknesses.
    diligencePath: Request architecture review materials, SRE dashboards, fraud-control design, and major-incident postmortems.
    relatedQuestionRefs:
    - QE024
