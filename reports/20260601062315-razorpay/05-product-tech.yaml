- id: TE002
  title: Workflow / use-case table
  columns:
  - user job
  - current workflow
  - Razorpay solution
  - measurable benefit
  - limitation
  rows:
  - - Launch an online checkout
    - Merchant integrates a single gateway or uses hosted checkout
    - Payment Gateway + buttons/pages + 100+ methods
    - Broader method coverage and one stack for cards, UPI, wallets, and more
    - Performance and conversion-lift claims are company-stated, not independently audited
  - - Collect ad hoc payments without a full cart flow
    - Merchant sends invoice or payment request manually
    - Payment Links with bulk creation and webhook tracking
    - Faster collections over email, text, and social channels
    - No public data on fraud rates, conversion, or repeat usage by cohort
  - - Bill a recurring customer
    - Merchant manages a manual schedule or card-on-file logic
    - Subscriptions + UPI AutoPay
    - Billing-cycle control and instant subscription alerts
    - Public materials do not quantify involuntary churn recovery or renewal success
  - - Run in-store payments
    - Merchant relies on standalone card machines or mixed devices
    - Razorpay POS with fast UPI/cards, loyalty and digital billing
    - Single in-store stack and AI-assisted issue handling
    - Uptime and success claims rely on company marketing
  - - Move money to vendors or beneficiaries
    - Finance team runs bank files or fragmented payout tools
    - RazorpayX Payouts + current accounts
    - Bulk payouts and multi-bank routing from one suite
    - No public SLA history for payouts failure or bank-downtime mitigation
  - - Operate an NBFC/fintech lending flow
    - Separate bank, escrow, and trusteeship processes
    - Digital Lending + Escrow + current accounts
    - Faster partner onboarding and compliant disbursals
    - No public lending customer count, GMV, or loss metrics
  - - Sell cross-border from India or Malaysia
    - Merchant uses fragmented export settlement providers
    - Apple Pay, Amazon exporters, Curlec, Singapore footprint
    - Lower-friction international collections and regional coverage
    - Public launch announcements do not show activation rates or regional retention
  - - Launch through existing commerce stack
    - Merchant wires a custom checkout from scratch
    - Shopify / WooCommerce / Shiprocket integrations reduce integration effort
    - Faster time-to-live through partner software and existing merchant tooling
    - No public activation, conversion, or retention by partner channel
  notes: Benefits and limitations are based on public product language plus 2025 launch disclosures; the table intentionally distinguishes marketed workflow value from independently verified outcomes.
