- id: fy25-scale-and-financial-profile
  title: FY25 Scale and Financial Profile
  body: 'FY25 is the clearest public proof point that Razorpay has reached meaningful operating scale. Moneycontrol, Economic Times, Inc42, and Medianama all report consolidated revenue of ₹3,783 crore, up 65% year on year from ₹2,296 crore, and gross profit of ₹1,277 crore, up 41%. The same coverage also converges on the major caveat: Razorpay posted a ₹1,209 crore post-ESOP loss because its India redomiciling created one-time restructuring and tax costs. Management’s own framing, repeated in independent media, is that the core online-payments business is already EBITDA-profitable and cash-generative, while newer products such as POS, RazorpayX, loyalty, and international operations are adding incremental growth vectors. Two merchant-quality signals support that narrative: the docs site says Razorpay serves over 8 million businesses, while the Y Combinator profile says it powers payments for 76 of 100 Indian startup unicorns. Even so, the company does not publicly disclose TPV, take rate,
    or segment mix with the same specificity, so outsiders can confirm growth momentum more easily than underlying unit economics.'
  claimRefs:
  - CO006
  - CO007
