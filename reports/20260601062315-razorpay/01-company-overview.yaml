  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: A full statutory board list, committee structure, and founder control-rights disclosure for Razorpay’s post-redomiciling entity.
    whyItMatters: Executive roles are visible, but public governance quality cannot be fully assessed without director-level oversight and control-rights detail.
    diligencePath: Request the latest board register, committee charters, shareholder agreement summary, and cap-table control schedule from the company.
    relatedQuestionRefs:
    - QO011
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: A current board-approved valuation memo, recent secondary-clearing price, or external financing term sheet after the $7.5 billion Series F anchor.
    whyItMatters: IPO readiness and redomiciling create valuation expectations, but no fresh external price discovery is publicly visible.
    diligencePath: Ask for the latest 409A or internal valuation pack, secondary transaction history, and banker valuation materials prepared for IPO planning.
    relatedQuestionRefs:
    - QO030
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: merchant-scale
    missingEvidence: A segmented merchant count by product line, geography, active status, and enterprise/SME split rather than a single aggregate business count.
    whyItMatters: The headline scale claim does not reveal retention quality, monetisation mix, or the relative weight of enterprise versus long-tail merchants.
    diligencePath: Request cohort-level merchant dashboards showing active merchants, churn, TPV contribution, and product penetration by merchant segment.
    relatedQuestionRefs:
    - QO031
    relatedTableRefs:
    - TO001
