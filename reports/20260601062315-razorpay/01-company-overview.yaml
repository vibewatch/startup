- id: capital-structure-and-regulatory-status
  title: Capital Structure and Regulatory Status
  body: 'Public capital-market evidence is fragmented but directionally clear. The Y Combinator profile says Razorpay raised $741.5 million across Series A through F and that its last financing round valued the company at $7.5 billion. Media coverage of the proposed IPO adds the more current but less definitive read: the company completed its reverse flip to India in 2025, is preparing for an Indian listing, and has reportedly appointed Axis Capital, Kotak Mahindra Capital, J.P. Morgan, and Citi to the syndicate for a deal that could exceed $700 million. Investor names repeated across YC, Moneycontrol, and older Razorpay releases include GIC, Tiger Global, Peak XV/Sequoia India, Ribbit Capital, Matrix Partners, Mastercard, and Y Combinator. Registry data from Tofler shows an authorised capital base of ₹1,500 crore and paid-up capital of ₹858.12 crore, while RBI records establish that Razorpay Payments Private Limited is authorised as a payment aggregator online and that Razorpay Technologies
    Private Limited appears separately in the central-bank operator list. The key judgment is that regulation and listing prep have both advanced, but the current private-market mark is still inferential rather than externally re-priced.'
  claimRefs:
