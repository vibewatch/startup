callouts:
- calloutType: strength
  title: Razorpay Has Become a Multi-Product Operating Layer, Not Just a Gateway
  body: 'The strongest strategic evidence is not one metric but the breadth of monetisable workflows now attached to the core gateway: payment links, subscriptions, POS, payouts, payroll, business banking, lending-tech, and cross-border corridors. That breadth raises switching costs and gives Razorpay multiple avenues to defend growth even if pure gateway pricing compresses.'
  claimRefs:
  - CO001
  - CO004
  - CO005
  - CO030
  - CO031
  - CO032
- calloutType: risk
  title: FY25 Growth Is Real, but the Latest Loss Makes Valuation Discovery More Important
  body: Razorpay’s FY25 revenue and gross-profit acceleration are well corroborated, but the ₹1,209 crore post-ESOP loss and reverse-flip costs mean public-market investors will likely focus on the distinction between one-time restructuring charges and normalized earnings power. Without a fresh external round, the current valuation remains an inference rather than a market-cleared price.
  claimRefs:
  - CO018
  - CO024
  - CO025
  - CO026
  - CO028
  - CO029
- calloutType: risk
  title: Trust and Support Quality Could Matter More as Merchant Mix Moves Upmarket
  body: Archived customer-review surfaces suggest support quality is uneven. Trustpilot is distinctly negative, while G2 is much more favourable but still references support friction. As Razorpay seeks larger exporters, enterprise merchants, and public-market scrutiny, support quality becomes a governance and retention issue rather than a mere service annoyance.
  claimRefs:
  - CO039
  - CO040
