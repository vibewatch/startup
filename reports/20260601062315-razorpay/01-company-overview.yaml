company:
  name: Razorpay
chapter:
  number: 1
  title: Company Overview
  summary: Razorpay is a Bengaluru-origin payments and business-banking platform that has expanded from an online gateway into POS, recurring billing, payouts, payroll, lending-tech, and cross-border products. Public evidence shows strong FY25 growth to ₹3,783 crore revenue, but also a ₹1,209 crore post-ESOP loss tied to redomiciling costs, leaving valuation and IPO timing still dependent on private-market evidence.
sections:
- id: identity-and-product-stack
  title: Identity and Product Stack
  body: 'Razorpay presents itself as a full-stack payments and banking platform for businesses, not a single-product gateway. The official homepage, payments page, and documentation collectively show an offering that spans online payment acceptance, payment links, subscriptions, offline POS, RazorpayX banking workflows, payouts, payroll, and selected credit and escrow products. The original company story is consistent across the About page and the Y Combinator profile: Harshil Mathur and Shashank Kumar started Razorpay after seeing how poor the Indian online-payments experience was for startups and SMEs. Corporate-registry evidence adds the legal frame: Razorpay Software Limited was incorporated on 24 May 2013 as an unlisted public company in Karnataka. The most important present-tense scale signal is the developer documentation claim that the group serves more than 8 million businesses; Y Combinator reinforces that the company powers payments for 76 of 100 startup unicorns and millions
    of Indian businesses. That combination suggests Razorpay has moved beyond startup-brand status into infrastructure relevance across multiple merchant tiers, while still retaining a product-led, developer-first distribution posture.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  - CO007
  - CO041
  tableRefs: []
  figureRefs:
  - FO002
- id: leadership-and-governance
  title: Leadership and Governance
  body: Governance is still heavily founder-shaped. Razorpay’s leadership page names Harshil Mathur as CEO and co-founder and Shashank Kumar as managing director and co-founder, with a broader operating bench that includes Rahul Kothari, Arif Khan, Arpit Chugh, Khilan Haria, Apuarv Sethi, and Ayush Bansal. The existence of this named operating bench reduces execution concentration relative to an earlier founder-only phase, but the public record is much weaker on statutory board composition, director committees, and control rights than it is on executive roles. Razorpay attempted to close part of that perception gap in April 2023 by creating an advisory board chaired by former RBI deputy governor G. Padmanabhan alongside Arijit Basu and K. P. Krishnan. That move matters because the company operates in a tightly regulated payments environment where customer protection, escrow controls, and compliance culture all have strategic consequences. The main diligence issue is that the public evidence
    establishes the executive roster and advisory signalling, but not the full board map or the exact division of authority between founder leadership and formal governance bodies.
  claimRefs:
  - CO008
  - CO009
