- id: milestones-expansion-and-risk-signals
  title: Milestones, Expansion, and Risk Signals
  body: 'Recent milestones show Razorpay pushing simultaneously into geography, product depth, and ecosystem control. In 2025 alone it announced Singapore expansion, Amazon-exporter collections with zero forex markup, an Apple Pay integration for Indian businesses, an MCP server for AI-native payments, a Curlec/NPCI partnership to enable UPI use in Malaysia, and AI-powered self-healing POS devices. The older milestone trail matters too: UPI AutoPay launched with NPCI in 2020, the company created an advisory board in 2023, and the Y Combinator profile attributes eight acquisitions to Razorpay, including Curlec, Ezetap, PoshVine, and BillMe. This pattern supports the view that Razorpay is trying to own more of merchant money movement across checkout, settlement, offline acceptance, financial operations, and cross-border corridors. The largest near-term risk signal is not product breadth but operational trust. Archived customer-review surfaces are mixed: Trustpilot shows a distinctly adverse
    rating and onboarding/support complaints, while G2 is materially more positive but still flags support quality issues. As Razorpay moves toward IPO scrutiny, support consistency and governance transparency become as important as growth.'
