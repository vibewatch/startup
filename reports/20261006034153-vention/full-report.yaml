              - CP002
              - CP003
              - CP004
              - CP005
              - CP008
      - number: '3.3'
        title: Pricing Economics, Lock-In, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              The economic justification for adopting Vention centers on mitigating the integration burden that delays
              60 percent of manufacturing automation initiatives [CP005, CP010]. By providing centralized scoping,
              simulation, and cloud procurement, Vention asserts it can cut capital expenditure by up to 30 percent and
              accelerate deployment timelines up to 5-8x compared to legacy custom engineering projects [CP004, CP005,
              CP010]. Despite these productivity advantages, customer lock-in operates as a double-edged sword:
              Vention's proprietary extrusion pitch, digital twin constraints, and MachineMotion controller lock buyers
              into Vention's component catalog, creating reluctance among enterprise buyers accustomed to open-standard
              DIN-rail components [CP001, CP004, CP009]. Furthermore, as robotics OEMs integrate native AI perception
              models and low-code programming environments into their own controller stacks, Vention faces the long-term
              risk of commoditization unless its GRIIP pipeline maintains superior multi-vendor interoperability and
              turnkey deployment speeds across factory lines [CP005, CP008, CP011, CP012].
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP004
              - CP005
              - CP007
              - CP010
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Moat Erosion via Robotics OEM Native Intelligence
            body: >-
              Vention's competitive differentiation is driven by simplifying programming and vision integration through
              its MachineMotion controller and GRIIP pipeline. However, major cobot manufacturers (Universal Robots,
              FANUC) and chip suppliers (NVIDIA) are progressively introducing low-code vision models and plug-and-play
              controllers natively, threatening to compress Vention's software value capture if OEMs internalize turnkey
              perception.
            calloutType: risk
            claimRefs:
              - CP005
              - CP008
              - CP011
              - CP012
          - type: callout
            title: Disentangling Industrial Automation from IT Services Conflation
            body: >-
              Market intelligence aggregators routinely conflate Montreal-based Vention (vention.io, industrial
              automation platform founded in 2016 by Etienne Lacroix) with New York-based Vention Solutions Inc.
              (ventionteams.com, custom software development founded in 2002). Rigorous diligence must isolate
              industrial metrics from IT consulting benchmarks to avoid erroneous valuation and competitive comps.
            calloutType: insight
            claimRefs:
              - CP001
              - CP002
              - CP007
