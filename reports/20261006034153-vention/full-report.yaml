  - id: TV003
    title: Scenario Valuation and Probability Assessment Matrix
    columns:
      - Scenario
      - Core Operating Assumptions
      - Implied Valuation Logic
      - Downside Triggers and Execution Risks
      - Probability Stance
    rows:
      - - Bull Case
        - >-
          Physical AI drives >50% YoY revenue expansion; software ARR surpasses 40% of blended mix; global enterprise
          rollouts accelerate.
        - >-
          Valued at top-tier software and robotics platform multiples (8x-12x EV/Revenue); attractive IPO or strategic
          acquisition candidate.
        - Inability to decouple software margins from hardware deployment costs.
        - 25%
      - - Base Case
        - >-
          Steady 20-30% growth in industrial SME and enterprise cells; blended gross margins stabilize around 45-50%;
          modular hardware leads sales.
        - Valued at hybrid hardware/automation multiples (3x-5x EV/Revenue); private equity or strategic merger pathway.
        - Lengthening enterprise procurement cycles during manufacturing downturns.
        - 50%
      - - Bear Case
        - >-
          Manufacturing capex retrenchment; AI features commoditize; high customer churn on non-standardized custom
          workcells.
        - >-
          Valuation compression toward contract manufacturing / hardware distributor multiples (1x-2x EV/Revenue);
          liquidation preference overhang bites.
        - Series D preference seniority forces severe common equity dilution in a down-round or distressed sale.
        - 25%
    notes: >-
      Scenario analysis constructed from operating disclosures, funding milestones, and typical industrial automation
      multiple ranges.
    claimRefs:
      - CV003
      - CV012
      - CV013
      - CV014
      - CV015
