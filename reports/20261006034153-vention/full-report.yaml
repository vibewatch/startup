  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform Overview and Architectural Layers
        blocks:
          - type: paragraph
            body: >-
              Vention defines its product offering as a unified hardware-software platform engineered to compress the
              industrial automation lifecycle from multi-month integration cycles down to days or weeks. Traditional
              industrial automation forces factory operators to coordinate fragmented component supply chains, bespoke
              mechanical design, bulky industrial control cabinets, manual wiring harnesses, and vendor-locked
              programmable logic controller (PLC) programming. Vention replaces this fractured model by coupling
              cloud-native browser CAD with plug-and-play modular hardware, pre-configured drive electronics, and
              developer-friendly software frameworks.


              The system operates across four primary architectural tiers: cloud modeling and collaborative design,
              simulation and digital-twin verification, edge motion control and messaging middleware, and field
              execution hardware. At the cloud design layer, MachineBuilder allows manufacturing engineers to configure
              custom automated equipment, linear gantries, and collaborative robot cells directly within a WebGL browser
              canvas. At the software middleware tier, the MachineLogic programming environment and Vention Developer
              Toolkit provide state machine orchestration, automatic data persistence in Python, and browser-accessible
              operator interfaces built with React. Field execution is managed by the MachineMotion controller family
              (including MachineMotion AI), which interfaces directly with actuators, safety devices, and collaborative
              robot arms via standardized pre-molded connectors, bypassing manual terminal blocks.


              While this integrated approach dramatically accelerates commissioning for standard packaging, palletizing,
              and machine tending cells, it introduces technical trade-offs. The proprietary nature of Vention's
              extrusion geometry and control bus limits direct integration with third-party industrial fieldbuses like
              EtherCAT or Profinet, creating vendor lock-in for enterprise factory lines.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE007
              - CE008
              - CE013
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
              - CE007
              - CE009
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
