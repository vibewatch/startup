chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and integrated automation platform
        blocks:
          - type: paragraph
            body: >-
              The target company is the industrial-automation Vention associated with vention.com and vention.io, not
              the software-development business using ventionteams.com. Independent profile data places the company in
              Montréal, founded in 2016 and at Series D stage. Its offer is vertically integrated: the platform combines
              cloud design and programming software, modular hardware, motion control, ordering, deployment, and
              operation of factory equipment. This creates a hybrid business whose economics cannot be reduced to a pure
              software multiple without revenue-mix and margin disclosure. Vention's own current homepage reports a
              broad installed footprint, but those scale metrics are company claims rather than independently audited
              counts.
