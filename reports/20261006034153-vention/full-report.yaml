            body: >-
              Vention operates a multi-stream hybrid revenue model spanning modular industrial hardware sales, cloud
              software subscriptions, and turnkey integration services. According to private market valuation comps,
              Vention's revenue run-rate reached $73M as of its January 2026 Series D financing, which valued the
