  - id: TV002
    title: Core Investment Thesis Versus Anti-Thesis Framework
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Counter-Risk
      - Thesis-Break or Reversal Trigger
    rows:
      - - Platform Architecture
        - >-
          Vertically integrated cloud CAD, modular plug-and-play hardware, and AI reduces integration time from months
          to days.
        - >-
          Hardware modularity creates working capital drag and supply chain bottlenecks relative to pure software SaaS
          models.
        - Severe supply chain disruption or margin compression below 30% on hardware fulfillment.
      - - Physical AI & Robotics
        - >-
          GRIIP and Rapid Operator AI deploy turnkey autonomous perception and motion planning on Nvidia Jetson edge
          compute.
        - Physical AI models face real-world generalization edge cases, low-light latency, and regulatory scrutiny.
        - Customer abandonment of AI pilots in favor of conventional PLC and specialized robotics integrators.
      - - Enterprise Standard Setter
        - 90 of Fortune 500 manufacturing leaders deploy Vention across centralized Advanced Manufacturing Teams.
        - High customer concentration and unverified multi-site renewal rates obscure enterprise account churn.
        - Disclosure of high customer churn or failure to expand beyond pilot workcells into plant-wide deployments.
      - - Valuation & Cap Table
        - Strong institutional syndicate (Nvidia NVentures, Fidelity) provides capital runway and strategic backing.
        - $263M in total raised capital creates substantial liquidation preference overhang ahead of common equity.
        - Down-round restructuring or secondary sales clearing at steep discounts to prior private marks.
    notes: Synthesizes company product filings, press releases, and diligence risk frameworks.
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV011
