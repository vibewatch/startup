              - CP002
              - CP003
              - CP004
              - CP005
      - number: '3.2'
        title: Capability Comparisons and Physical AI Defensibility
        blocks:
          - type: paragraph
            body: >-
              Vention differentiates itself against component suppliers like 80/20 and standard robotics OEMs by uniting
              modular extrusion framing with cloud CAD, digital twins, and edge execution engines [CP001, CP004]. The
              introduction of the Generalized Robotic Intelligence Pipeline (GRIIP) and Rapid Operator AI marks an
              architectural push to bypass custom trajectory programming and rigid fixturing, leveraging NVIDIA Jetson
              compute to achieve a 99 percent first-pick success rate in mixed-SKU handling [CP005, CP008]. This stands
              in contrast to legacy industrial automation setups where robot arms from Universal Robots or FANUC require
              dedicated system integrators to configure vision, gripper logic, and safety PLCs [CP003, CP005]. However,
              incumbent controller manufacturers (Siemens, Rockwell Automation, Beckhoff) maintain deeply entrenched
              distribution channels, field-proven safety certifications, and decades of plant-floor trust, creating
              structural switching costs that prevent rapid rip-and-replace deployments in heavy automotive or process
              manufacturing lines [CP003, CP009].
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
              - CP008
              - CP009
          - type: figure
            figureRef: FP001
