  - id: FE001
    title: Vention Integrated Industrial Automation Architecture
    type: stack
    summary: >-
      Six-tier architectural model illustrating progression from cloud design, simulation, and software SDKs down to
      edge motion controllers and physical factory hardware.
    data:
      layers:
        - label: 'Tier 1: Cloud CAD & Engineering'
          detail: >-
            MachineBuilder browser-based 3D modeling canvas, WebGL parametric assembly, real-time BOM generation, and
            collaborative design review.
        - label: 'Tier 2: Digital Twin & Simulation'
          detail: >-
            Interactive 3D simulation running in browser or CLI, offline trajectory verification, and virtual cell
            collision detection.
        - label: 'Tier 3: Software Framework & Developer Toolkit'
          detail: >-
            Vention Developer Toolkit, State Machine logic components, auto-generated REST APIs, and React-based
            MachineUI operator components.
        - label: 'Tier 4: Motion Middleware & Messaging'
          detail: >-
            machine-logic-sdk Python library, low-latency gRPC and Protocol Buffers serialization, and MQTT event
            telemetry.
        - label: 'Tier 5: Edge Automation Controller'
          detail: >-
            MachineMotion AI industrial controller, integrated servo drives, optical safety interlocks, and
            plug-and-play IO modules.
        - label: 'Tier 6: Modular Mechanical & Robotic Hardware'
          detail: >-
            Precision T-slot aluminum extrusions, modular conveyor beds, custom robot pedestals, and collaborative robot
            arms (FANUC, UR, ABB).
    approximationNotes: >-
