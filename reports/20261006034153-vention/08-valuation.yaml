callouts:
  - calloutType: "recommendation"
    title: "Diligence Call: Maintain Track Stance Pending Audited Unit Economics"
    body: "Vention has established undeniable commercial momentum, evidenced by its $110 million financing round in early 2026 and platform adoption across global manufacturing enterprises. However, without verified revenue by stream, gross margins, EBITDA, and full cap-table seniority waterfalls, committing growth capital remains unsupportable. Investors should track Vention's physical-AI enterprise traction while conditioning direct participation on comprehensive private financial disclosure."
    claimRefs:
      - "CV001"
      - "CV003"
      - "CV012"
      - "CV016"
  - calloutType: "risk"
    title: "Liquidation Preference Overhang Across $263 Million in Total Capital"
    body: "With $263 million raised across multiple preferred rounds including early 2026 Series D financing, common and early-stage equity holders face substantial liquidation preference stacks. In the event of an exit below unicorn valuation thresholds or down-round recapitalizations, senior institutional preferences from Series C and D investors could significantly impair junior returns."
    claimRefs:
      - "CV008"
      - "CV011"
      - "CV012"
