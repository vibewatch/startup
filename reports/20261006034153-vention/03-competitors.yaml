callouts:
  - calloutType: "risk"
    title: "Moat Erosion via Robotics OEM Native Intelligence"
    body: "Vention's competitive differentiation is driven by simplifying programming and vision integration through its MachineMotion controller and GRIIP pipeline. However, major cobot manufacturers (Universal Robots, FANUC) and chip suppliers (NVIDIA) are progressively introducing low-code vision models and plug-and-play controllers natively, threatening to compress Vention's software value capture if OEMs internalize turnkey perception."
    claimRefs:
      - "CP005"
      - "CP008"
      - "CP011"
      - "CP012"
  - calloutType: "insight"
    title: "Disentangling Industrial Automation from IT Services Conflation"
    body: "Market intelligence aggregators routinely conflate Montreal-based Vention (vention.io, industrial automation platform founded in 2016 by Etienne Lacroix) with New York-based Vention Solutions Inc. (ventionteams.com, custom software development founded in 2002). Rigorous diligence must isolate industrial metrics from IT consulting benchmarks to avoid erroneous valuation and competitive comps."
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP007"
