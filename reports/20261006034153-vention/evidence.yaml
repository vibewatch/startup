evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-and-financials
    missingEvidence: >-
      Current valuation, audited revenue by stream, ARR, gross margin, retention, EBITDA, cash balance, burn, and
      runway.
    whyItMatters: >-
      Funding raised cannot be converted into cash availability or enterprise value, and a mixed hardware-software
      business cannot be valued responsibly without revenue quality and margin data.
    diligencePath: >-
      Request audited FY2023-FY2025 statements, 2026 year-to-date management accounts, revenue cohorts, cash
      reconciliation, and the latest board-approved forecast.
    relatedQuestionRefs:
      - QO006
      - QO007
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: >-
      Fully diluted cap table, security terms, liquidation preferences, secondary proceeds, debt or credit facilities,
      and investor control rights.
    whyItMatters: >-
      The public round totals do not establish ownership, dilution, senior claims, governance control, or proceeds
      retained by the company.
    diligencePath: >-
      Obtain the capitalization table, certificates of incorporation, financing documents, debt schedule, side letters,
      and waterfall model.
    relatedQuestionRefs:
      - QO006
      - QO010
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-governance
    missingEvidence: >-
      Complete executive biographies, director classifications, committee assignments, appointment rights, succession
      plans, and material leadership changes.
    whyItMatters: >-
      Founder concentration and board composition cannot be translated into key-person or governance risk without role
      histories and control rights.
    diligencePath: >-
      Request the current organization chart, executive biographies, board roster and minutes, committee charters, and
      founder succession and retention plans.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: adverse-events
    missingEvidence: >-
      Independent legal, regulatory, safety, recall, outage, cybersecurity, labor, and customer-complaint coverage for
      the industrial-automation Vention.
    whyItMatters: >-
      The assigned adverse query returned no retained source, so the chapter cannot infer that no adverse incident
      exists.
    diligencePath: >-
      Search court, regulator, workplace-safety, recall, security-incident, and customer-reference records using the
      confirmed legal entity and operating domains.
    relatedQuestionRefs:
      - QO009
  - type: missing-source
    severity: material
    topic: sam-isolation-and-segment-financials
    missingEvidence: >-
      Audited financial disclosure breaking down Vention's revenue by product stream (cloud CAD/software licenses,
      modular hardware components, and turnkey robot cells) and independent third-party market share benchmarks
      isolating modular automation from the broader $40B+ industrial robotics market.
    whyItMatters: >-
      Without segmented revenue data or third-party market share audits, estimates of Vention's serviceable addressable
      market (SAM) and serviceable obtainable market (SOM) remain constrained to top-down industry proxies and
      company-claimed adoption metrics.
    diligencePath: >-
      Request management presentation with audited revenue breakdown by stream, unit economics per machine deployed, and
      customer expansion rates across SME vs. enterprise manufacturing accounts.
    relatedQuestionRefs:
      - QM009
  - type: missing-source
    severity: material
    topic: independent-market-share
    missingEvidence: >-
      Third-party market share analysis tracking Vention's installed base against legacy PLC and robotic cell
      integrators in North America.
    whyItMatters: >-
      Validating whether Vention is displacing traditional system integrators or primarily capturing greenfield SME
      automation demand.
    diligencePath: >-
      Acquire industrial automation market reports from Interact Analysis or Gartner tracking modular robotics platform
      adoption.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: >-
      Audited FY2023 through FY2025 financial statements with revenue segmented into software subscriptions, hardware
      modular extrusions, and engineering services, alongside GAAP/IFRS gross margins.
    whyItMatters: >-
      Without audited revenue segmentation, underwriters cannot establish whether Vention commands software-tier gross
      margins (>70%) or structural hardware margins (30-45%), which dictates the appropriateness of a 16.4x revenue
      multiple.
    diligencePath: >-
      Obtain management-prepared financial disclosures, confidential information memorandum (CIM), or audited balance
      sheets under non-disclosure agreement.
    relatedQuestionRefs:
      - QI008
  - type: missing-source
    severity: material
    topic: cohort-retention
    missingEvidence: >-
      Quarterly cohort retention tables displaying gross revenue retention (GRR), net revenue retention (NRR), and
      repeat machine re-order attach rates over a 36-month horizon.
    whyItMatters: >-
      Understanding whether enterprise plants consistently expand hardware installations or treat workcell purchases as
      one-off capital expenditures is fundamental to recurring revenue quality.
    diligencePath: >-
      Request customer cohort repeat purchase data and software module subscription renewal schedules during management
      diligence.
    relatedQuestionRefs:
      - QI008
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: >-
      GRR, NRR, logo and revenue churn, contract duration, renewal schedule, repeat-purchase cohorts, and top-10
      customer revenue concentration.
    whyItMatters: >-
      Installed machines and named logos cannot establish recurring durability, expansion economics, or exposure to a
      small number of customers.
    diligencePath: >-
      Request a customer-level cohort export for the last twelve quarters, reconciled to invoices, renewals,
      deployments, and recognized revenue.
    relatedQuestionRefs:
      - QU006
  - type: conflicting-data
    severity: material
    topic: customer-scale
    missingEvidence: >-
      A dated reconciliation of the 4,000- versus 6,000-factory claims and the definitions of factory, customer,
      machine, active deployment, and paid account.
    whyItMatters: >-
      Without consistent definitions and vintages, public counts cannot support a growth rate, utilization estimate, or
      customer-retention inference.
    diligencePath: >-
      Obtain quarterly installed-base bridges with additions, removals, inactive sites, repeat buyers, and machine
      counts by customer and plant.
    relatedQuestionRefs:
      - QU002
    relatedTableRefs:
      - TU002
  - type: enumeration-incomplete
    severity: material
    topic: named-customers
    missingEvidence: >-
      Customer-side confirmation of deployment scope, production status, measured outcomes, contract value, and
      referenceability for named logos.
    whyItMatters: >-
      Company and secondary-source name lists do not distinguish a pilot, one-time component purchase, production
      deployment, or multi-plant standard.
    diligencePath: >-
      Conduct reference calls with at least five customers across enterprise, SME, integrator, and repeat-purchase
      cohorts and inspect signed orders.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: adverse-customer-evidence
    missingEvidence: >-
      Target-specific records of customer complaints, failed deployments, cancelled pilots, outages affecting
      production, churn, or concentration.
    whyItMatters: >-
      An empty adverse search result is not evidence that deployments have no failures or that customer relationships
      are durable.
    diligencePath: >-
      Review support-ticket severity, failed commissioning records, refunds, warranty claims, churn interviews, and
      customer references under NDA.
    relatedQuestionRefs:
      - QU010
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      Comprehensive audit of state-level machinery safety inspection reports, OSHA incident logs, and EU Machinery
      Regulation compliance filings for deployed Vention workcells.
    whyItMatters: >-
      Unannounced regulatory safety audits or non-compliant collaborative robot installations could halt factory
      operations and create product liability exposure.
    diligencePath: >-
      Obtain plant-level safety sign-off records and third-party CE/UL machinery conformity certifications directly from
      Vention legal and compliance counsel.
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: financial-runway-and-burn
    missingEvidence: >-
      Audited multi-year financial statements detailing gross margins by hardware versus software, net cash burn, and
      exact debt or credit obligations.
    whyItMatters: >-
      Without audited financial statements, management's three-year profitability guidance cannot be independently
      verified, leaving cash runway uncertain.
    diligencePath: >-
      Review audited FY2023-FY2025 financial statements, bank covenant compliance certificates, and 2026 budget models
      under NDA.
    relatedQuestionRefs:
      - QR009
  - type: private-evidence-only
    severity: material
    topic: valuation-status
    missingEvidence: Post-money equity valuation marks and price-per-share metrics for Series C and Series D financing rounds.
    whyItMatters: >-
      Without valuation marks, investors cannot determine whether current pricing reflects disciplined SaaS revenue
      multiples or excessive physical-AI premiums.
    diligencePath: Request confidential cap table and latest round financing documents from company management or lead investors.
    relatedQuestionRefs:
      - QV004
    relatedTableRefs:
      - TV001
  - type: missing-source
    severity: material
    topic: financial-performance
    missingEvidence: >-
      Audited financial statements detailing revenue by stream, software ARR versus hardware fulfillment, gross margin
      percentages, and cash burn.
    whyItMatters: >-
      Valuation models cannot calculate EV/ARR, gross margin sustainability, or runway without audited segment
      economics.
    diligencePath: Obtain audited financial disclosures and trailing-twelve-month management accounts under non-disclosure agreement.
    relatedQuestionRefs:
      - QV008
    relatedTableRefs:
      - TV003
