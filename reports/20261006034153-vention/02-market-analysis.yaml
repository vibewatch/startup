callouts:
  - calloutType: "insight"
    title: "Market Delineation Between Industrial Robotics and Custom IT Services"
    body: "Diligence requires strictly separating Vention Inc. (Montreal-based industrial automation platform provider operating vention.io) from Vention Solutions Inc. (New York-based IT consulting and custom software development agency operating ventionteams.com). While both share common brand elements and publish enterprise technology reports, their underlying market economics, gross margin profiles, and capital intensity represent fundamentally distinct industrial versus professional services spend categories."
    claimRefs:
      - "CM001"
      - "CM006"
  - calloutType: "risk"
    title: "Adoption Headwinds from Legacy Controls and Industrial Switching Costs"
    body: "Despite rapid payback claims of 1.3 years, industrial automation deployments face substantial switching costs in brownfield facilities. Incumbent programmable logic controller (PLC) architectures, unionized maintenance practices, and custom machine builder relationships create high switching inertia, requiring modular platforms to demonstrate uncompromised safety reliability and plug-and-play interoperability before displacing legacy automation cabinets."
    claimRefs:
      - "CM012"
      - "CM014"
