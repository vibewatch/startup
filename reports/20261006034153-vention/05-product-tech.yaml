callouts:
  - calloutType: "insight"
    title: "Convergence of Web Development Paradigm and Industrial Automation"
    body: "Vention's central architectural thesis is replacing proprietary industrial automation tooling with mainstream software development practices. By offering Python state machines, auto-generated REST APIs, and React-based HMI components via the Vention Developer Toolkit, Vention lowers the barrier for software engineers to automate factory floors. However, this shifts plant maintenance from traditional ladder logic technicians to software-fluent engineers, representing both an operational efficiency gain and a cultural hiring challenge for conventional manufacturers."
    claimRefs:
      - "CE008"
      - "CE010"
      - "CE011"
  - calloutType: "risk"
    title: "Ecosystem Lock-in and Physical Extrusion Duty Limits"
    body: "While Vention's plug-and-play modular hardware eliminates custom electrical cabinets and wiring complexity, it binds customers to Vention's proprietary mechanical and electronic ecosystem. For heavy-duty manufacturing tasks involving continuous shock loading or high-speed kinematic reversals, modular aluminum extrusions require careful structural stability reviews and risk fastener fatigue compared to welded steel frames."
    claimRefs:
      - "CE003"
      - "CE004"
      - "CE013"
      - "CE015"
