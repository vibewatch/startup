      - number: '7.2'
        title: 监管、法律与品牌冲突风险
        blocks:
          - type: paragraph
            body: >-
              法律和品牌治理存在一个尖锐且少见的市场身份脆弱点：Vention 与 Vention Solutions Inc.（前身为
              iTechArt）发生严重商业名称冲突。后者是一家无关的、总部位于纽约的定制软件工程公司，在全球 20 个办公室雇用超过 3,000
              名开发者。外部市场情报聚合平台、高管数据库和自动化企业研究引擎经常混淆两家公司，把软件工程师人数、服务新闻稿和孵化器新闻并入总部位于 Montreal 的 Vention
              研究轨迹。这种混淆会持续稀释商标、增加客户 SEO
              发现难度；若同名软件服务公司出现交付或安全事故，还会带来声誉污染风险。除品牌身份外，实体自动化部署还要满足职业健康和机械安全框架的严格监管。在北美和欧洲，协作机器人和自动码垛单元必须遵循 ANSI/RIA
              R15.06、ISO 10218 和 ISO/TS 15066，涵盖协作机器人安全、操作员存在感知以及功率与力限制。此外，欧盟《AI 法案》即将分阶段执行，将对部署在制造车间的高风险物理 AI
              应用提出严格的合规评估要求。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR010
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR006
              - CR010
      - number: '7.3'
        title: 运营可靠性、硬件供应链与物理 AI 失效模式
        blocks:
          - type: paragraph
            body: >-
              在工厂自动化中，运营可靠性至关重要：非计划工作单元停机可能让整条产线停摆，并给制造运营方带来严重财务损失。Vention 与 Industry Week 的联合研究称，大约 60%
              的工业制造商会因集成负担、技术复杂度和对部署失败的强烈担忧而主动推迟自动化项目。Vention 推出的物理 AI 能力以 Rapid Operator AI 和 Generalized Robotic
              Intelligence Pipeline（GRIIP）为代表，试图通过自主感知、抓取选择和实时无碰撞运动规划克服这些障碍。但在工厂边缘运行物理 AI 会引入独特的运营失效模式。处理反光或可变形包装 SKU
              时，感知模型容易受光照变化、光学传感器积尘和抓取错误影响。此外，MachineMotion AI
              控制器的边缘执行依赖与工厂可编程逻辑控制器（PLC）保持稳定低延迟通信；意外的遥测丢包、固件回归或边缘热节流都可能触发紧急安全急停。要避免实体机器损坏或工人受伤，必须维持严格测试协议和故障安全机械边界。
            claimRefs:
              - CR007
              - CR008
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR007
              - CR008
              - CR013
      - number: '7.4'
        title: 合作伙伴依赖、平台集中度与现金跑道风险
        blocks:
          - type: paragraph
            body: >-
              Vention 的商业架构围绕战略合作伙伴集成搭建，但也因此形成明显的交易对手依赖。Vention 不自行制造机器人机械臂，其交钥匙码垛机、焊机和机器上下料单元必须与 ABB、Fanuc、Kinova
              等第三方机器人 OEM 无缝互操作。若任何主要协作机器人制造商调整分销商定价层级、限制 API 访问或推出竞争性云原生数字孪生配置工具，Vention 的单位经济性和竞争护城河都会立即承压。同样，Vention
              的物理 AI 路线高度锚定 Nvidia 的软硬件栈，具体是运行在 MachineMotion 控制器上的 Nvidia Jetson module-on-compute 平台。财务上，Vention
              已募集大量资本，最终在 2026 年初完成由 Investissement Québec、Desjardins Capital 和 Nvidia 的 NVentures 部门牵头的 US$110 million
              Series D 融资。管理层称过去三年毛利率提升、烧钱速度下降，但年收入仍略低于 US$100 million，达到经营盈利前预计还剩约三年烧钱期。3M、Hershey、L'Oreal 和 Pratt &
              Whitney 等企业客户贡献一半总收入，因此客户留存和多工厂扩张对维持现金跑道至关重要。
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR009
              - CR011
              - CR012
              - CR014
