      - number: '7.5'
        title: 展示材料
        blocks:
          - type: callout
            title: OEM 机械臂互操作性与供应商挤压
            body: >-
              Vention 依赖 ABB、Fanuc 和 Kinova 等第三方协作机器人及工业机器人机械臂制造商完成交钥匙工作单元。Vention 虽能从专有型材和支架获取硬件毛利，但协作机器人 OEM
              可能调整分销折扣或推出竞争性软件定义配置平台，挤压 Vention 的毛利率。
            calloutType: risk
            claimRefs:
              - CR009
              - CR014
          - type: callout
            title: 三年盈利路径的尽调重点
            body: 投资者应以核验经审计的毛利率提升轨迹、硬件与软件订阅的单位贡献毛利，以及财富 500 强账户的合同续约率为投资前提，从而验证管理层关于三年内实现盈亏平衡的指引。
            calloutType: recommendation
            claimRefs:
              - CR003
              - CR004
              - CR012
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Vention 的核心投资逻辑，是建立一个标准化数字平台，把模块化即插即用硬件、云原生机器设计和物理 AI
              系统结合起来，绕开传统数月周期的工业机器人系统集成。公司已在汽车、航空航天、物流和消费品制造领域展现企业进展，声称全球部署超过 28,000 台机器，并被财富 500 强中的 90 家企业采用。此外，运行在由
              NVIDIA Jetson 算力支持的 MachineMotion AI 控制器上的 Rapid Operator AI 和 Generalized Robotic Intelligence
              Pipeline（GRIIP）已商业化推出，使 Vention 站在自主零样本制造自动化的前沿。反向逻辑则集中于严重的估值和治理不透明。Vention
              一直未披露投后股权估值、软件与硬件收入拆分，以及历次融资中的毛利率结构。若没有经审计的清晰信息证明收入究竟来自经常性软件订阅，还是资本密集型硬件和加工履约，投资者就可能以过高的物理 AI
              软件倍数评估商品化制造服务。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
