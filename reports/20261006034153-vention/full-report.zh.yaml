  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 多维风险分类与暴露热力图
        blocks:
          - type: paragraph
            body: >-
              评估 Vention 的运营模式，需要把风险拆成四个相互关联的领域：核心供应商集中度、品牌与企业身份冲突、物理 AI 部署可靠性，以及宏观经济资本开支波动。Vention
              在专有模块化型材和数字孪生软件生态中取得较高软件与硬件毛利，但完整自动化工作单元高度依赖外部零部件供应商，尤其是 ABB、Fanuc、Kinova 的工业机器人机械臂，以及 Nvidia
              的边缘计算模块。同时，工业设备采购仍高度敏感于美国制造业情绪，而美国是 Vention
              最大的单一地理市场。高利率和未解决的跨境关税政策压低制造业活动，威胁客户资本部署进度，尤其是资产负债表缺乏弹性的中型制造商。此外，持续的私营公司烧钱让 Vention
              仍要熬过预计三年后才能实现会计盈利，并依赖有利的成长股权市场或公开上市接受度。风险热力图从运营和财务轴综合呈现这些暴露的可能性、影响严重程度、缓释成熟度和剩余风险。
            claimRefs:
