        title: 展示材料
        blocks:
          - type: callout
            title: Web 开发范式与工业自动化的融合
            body: >-
              Vention 的核心架构逻辑，是用主流软件开发实践替代专有工业自动化工具。Vention Developer Toolkit 提供 Python 状态机、自动生成的 REST API 和基于 React 的
              HMI 组件，降低了软件工程师自动化工厂现场的门槛。但这也会把工厂维护从传统梯形逻辑技术员转向熟悉软件的工程师，对传统制造商既是运营效率提升，也带来招聘文化挑战。
            calloutType: insight
