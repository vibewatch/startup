        - 供应链严重中断，或硬件履约毛利率跌破 30%。
      - - 实体 AI 与机器人
        - GRIIP 和 Rapid Operator AI 借助 Nvidia Jetson 边缘计算，部署开箱即用的自主感知与运动规划。
        - 实体 AI 模型面临真实世界泛化边界、低光照延迟和监管审查。
        - 客户放弃 AI 试点，转向传统 PLC 和专业机器人集成商。
      - - 企业级标准制定者
        - 财富 500 强制造业领导者中有 90 家通过集中式先进制造团队部署 Vention。
        - 客户集中度高，多地点续约率又未经验证，企业账户流失情况不明。
        - 披露客户高流失率，或无法从试点工作单元扩展到全厂部署。
      - - 估值与股权结构表
        - 强大的机构投资者联盟（Nvidia NVentures、Fidelity）提供资金续航和战略支持。
        - 累计融资 $263M，使普通股之前存在大额清算优先权悬置。
        - 低价轮重组，或二级出售价格相对之前的私募估值大幅折价。
    notes: 综合公司产品文件、新闻稿和尽调风险框架。
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV011
      - CV012
  - id: TV003
    title: 情景估值与概率评估矩阵
    columns:
      - 情景
      - 核心运营假设
      - 隐含估值逻辑
      - 下行情景触发因素与执行风险
      - 概率判断
    rows:
      - - 乐观情景
        - 实体 AI 推动收入同比增长超过 50%；软件 ARR 占综合收入的比例超过 40%；全球企业部署加速。
        - 按一线软件和机器人平台倍数估值（EV/Revenue 为 8x-12x）；具备吸引力的 IPO 或战略收购标的。
        - 软件利润率无法与硬件部署成本脱钩。
        - 25%
      - - 基准情景
        - 工业中小企业和企业工作单元稳定增长 20%–30%；综合毛利率稳定在约 45%–50%；模块化硬件带动销售。
        - 按硬件 / 自动化混合倍数估值（EV/Revenue 为 3x-5x）；走向私募股权投资或战略合并。
        - 制造业低迷期间，企业采购周期拉长。
        - 50%
      - - 悲观情景
        - 制造业资本支出收缩；AI 功能商品化；非标准化定制工作单元客户流失率高。
        - 估值向合同制造 / 硬件分销商倍数压缩（EV/Revenue 为 1x-2x）；清算优先权的悬压开始显现。
        - Series D 的优先级在低价轮或困境出售中造成普通股严重稀释。
        - 25%
    notes: 情景分析基于运营披露、融资里程碑和工业自动化常见倍数区间构建。
    claimRefs:
      - CV003
      - CV012
      - CV013
      - CV014
      - CV015
