  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范围与行业划分
        blocks:
          - type: paragraph
            body: >-
              Vention 处于快速变化的工业自动化和工厂设备市场，提供连接数字设计与实体部署的纵向一体化平台。公司的核心产品包括浏览器 CAD
              软件、模块化即插即用铝型材结构件、数字孪生物理仿真和紧凑型机器运动控制器。这种一体化方案直击工厂自动化的传统痛点：制造商过去依赖分散的多厂商工具链、高成本外部系统集成商和漫长的调试周期。但尽调必须先划清市场边界：总部位于
              Montreal 的制造自动化平台 Vention Inc.，必须与使用 ventionteams.com 域名、总部位于纽约的定制软件开发和 IT 工程机构 Vention Solutions Inc.
              严格区分。两家公司名称相同，也都发布企业技术报告，但底层商业模式对应完全不同的支出类别。Vention Inc. 获得的是制造业资本设备和工业自动化支出，而定制软件工程咨询公司争夺的是企业 IT 专业服务预算。
            claimRefs:
              - CM001
              - CM006
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM006
              - CM011
      - number: '2.2'
        title: 市场规模视角、可触达支出与采用指标
        blocks:
          - type: paragraph
            body: >-
              评估模块化工厂自动化的可触达市场，既要看自上而下的技术投资流，也要看自下而上的设备部署指标。宏观层面，全球企业人工智能支出正在快速增长，行业研究预计企业 AI 总支出将达到
              $1.5T，其中实体基础设施和专业硬件约占 59%（$885 billion）。这个宏观总量包含财富 500 强企业广泛的算力和数据中心投资，而 Vention
              的可服务市场（SAM）严格聚焦工厂机器人自动化、机器上下料和产线末端包装单元。自下而上看，Vention 报告称商业进展显著：25 个不同工业垂直领域的 6,000 多家制造设施部署了超过 28,000
              台活跃机器。此外，公司声称其客户覆盖财富 500 强中的 90 家企业，以及美国制造业前 500 家企业中的 99 家。然而，Vention 仍是私营公司，未公开经审计财务报表，因此模块化硬件与云 CAD
              许可证各自的确切市场份额和净经常性收入仍是未经验证的尽调缺口。
            claimRefs:
              - CM002
              - CM003
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM007
              - CM008
              - CM014
      - number: '2.3'
        title: 买方分层、采购流程与预算归属
        blocks:
          - type: paragraph
            body: >-
              工业制造采购涉及不同规模企业中的买方角色、授权层级和采用触发因素。Tier-1 企业制造商通常由先进制造总监和管理 CapEx 预算的 VP
              级运营负责人牵头，将标准化机器人工作单元部署到多个工厂，以缓解长期技能工人短缺并支持回流制造。相反，中小企业制造商依赖预算紧张的工厂经理和维护负责人；传统自动化集成商成本高、周期长，因此他们更容易被
              Vention 的自助 CAD 工具和预工程化工作单元吸引。为覆盖这些不同买方，Vention
              将商业进入分为三层：自助数字设计与快速硬件交付、支持式工程部署，以及全托管交钥匙机器人单元。企业技术买方调查显示，60% 的企业负责人认为定制方案不可或缺，94% 在评估技术合作伙伴时强调供应商的 AI 能力。
            claimRefs:
              - CM004
              - CM005
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM009
              - CM010
      - number: '2.4'
        title: 增长驱动、资本强度与技术约束
        blocks:
          - type: paragraph
            body: >-
              工业机器人长期扩张由结构性回流制造、制造业劳动力短缺，以及生成式人工智能与实体自动化的融合推动。2026 年，Vention 通过推出 Physical AI 和 Agentic AI 能力加快技术路线，包括
              MachineMotion AI 边缘控制器、在 NVIDIA GTC 2026 发布的 Rapid Operator AI 自主拣箱系统，以及 GRIIP
              基础管线。这些技术试图用软件定义的零样本自动化替代复杂的手动 PLC
              编程，从而降低采用门槛。但多项实质性约束会放慢全工厂改造。存量工厂环境受旧工业现场总线、僵化的可编程逻辑控制器和既有安全合规制度牵制，技术惯性很强。把旧产线切换到模块化云连接硬件，会带来运营切换成本、工厂维护人员再培训负担和网络安全担忧；企业调查显示，32%
              的安全负责人经常遇到 AI 相关威胁。因此，主流采用仍要经过严格的工厂级概念验证和安全签字。
            claimRefs:
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 工业机器人与定制 IT 服务的市场划分
            body: >-
              尽调必须严格区分运营 vention.io、总部位于 Montreal 的工业自动化平台 Vention Inc.，与运营 ventionteams.com、总部位于纽约的 IT 咨询和定制软件开发机构
              Vention Solutions Inc.。两者虽共享品牌元素并发布企业技术报告，但底层市场经济性、毛利率结构和资本强度分别对应截然不同的工业支出与专业服务支出类别。
            calloutType: insight
            claimRefs:
              - CM001
              - CM006
          - type: callout
            title: 旧控制系统与工业切换成本带来的采用阻力
            body: >-
              尽管公司声称回本周期仅 1.3
              年，工业自动化在存量工厂部署仍面临高昂切换成本。现有可编程逻辑控制器（PLC）架构、工会化维护惯例和定制机器制造商关系造成强烈切换惯性；模块化平台必须先证明安全可靠性不打折、即插即用且可互操作，才能替代旧自动化柜。
            calloutType: risk
            claimRefs:
              - CM012
              - CM014
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与实体边界尽调
        blocks:
          - type: paragraph
            body: >-
              评估 Vention 的竞争护城河，首先要把工业机器人平台（vention.io）与同名的定制软件工程公司（ventionteams.com）分开。第三方聚合平台经常混淆两者；Vention
              的工业核心是自动化设备平台，直接挑战传统系统集成商、模块化硬件供应商和基于 PLC 的传统自动化厂商 [CP001, CP002, CP003]。在传统制造环境中，自动化项目由定制工程公司和定制 PLC
              集成柜交付，带来高昂集成税和数月部署周期 [CP004, CP005]。Vention 的云到硬件架构和 MachineMotion AI 控制器，用模块化、网页配置的机器人单元替代分散硬件栈 [CP004,
              CP006]。与此同时，定制软件工程市场报价显示 IT 咨询领域竞争性定价激烈，这也说明要准确评估，必须厘清工业物理 AI 自动化与纯软件人力服务的边界 [CP002, CP007]。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
      - number: '3.2'
        title: 能力对比与物理 AI 防御力
        blocks:
          - type: paragraph
            body: >-
              Vention 相较 80/20 等零部件供应商和标准机器人 OEM 的差异，在于把模块化型材框架与云 CAD、数字孪生和边缘执行引擎结合起来 [CP001, CP004]。Generalized Robotic
              Intelligence Pipeline（GRIIP）和 Rapid Operator AI 的推出，代表其试图绕开定制轨迹编程和刚性夹具；借助 NVIDIA Jetson 算力，在混合 SKU 搬运中实现
              99% 的首次抓取成功率 [CP005, CP008]。这不同于传统工业自动化：Universal Robots 或 FANUC 的机械臂需要专门系统集成商配置视觉、夹爪逻辑和安全 PLC [CP003,
              CP005]。不过，现有控制器厂商 Siemens、Rockwell Automation 和 Beckhoff
              拥有根深蒂固的分销渠道、经过现场验证的安全认证以及数十年工厂信任，造成结构性切换成本，使重型汽车或流程制造产线难以快速替换原有系统 [CP003, CP009]。
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
              - CP008
              - CP009
          - type: figure
            figureRef: FP001
