  - id: FI001
    title: Vention 客户工作流与收入转化桥
    type: flow
    summary: 用顺序桥呈现客户工厂需求如何转化为持续的平台使用、硬件物料清单收入和持续运营价值。
    data:
      nodes:
        - id: scoping
          label: 1. 需求界定与云端 3D 设计
          detail: 客户工程师通过 MachineBuilder 3D 在浏览器中设计模块化机器单元
        - id: ordering
          label: 2. BOM 生成与电商下单
          detail: 系统自动生成物料清单，支持即时数字结账和组件销售
        - id: fulfillment
          label: 3. 硬件包装与运输
          detail: 组件和结构挤压件完成包装并发运，制造周转期为次日
        - id: assembly
          label: 4. 模块化硬件组装
          detail: 预组装工作单元或模块化套件通过即插即用连接在工厂现场组装
        - id: commissioning
          label: 5. 控制器部署与运动设置
          detail: MachineMotion AI 通过无代码、Python 或 AI Copilot 编程工作流部署
        - id: operation
          label: 6. 运营监控与实体 AI
          detail: 实时遥测、事件回放、远程专家诊断和自主 AI 升级
    approximationNotes: 图示基于 Vention 官方产品架构，呈现定性的运营流程和客户生命周期变现步骤。
    claimRefs:
      - CI003
      - CI004
      - CI005
