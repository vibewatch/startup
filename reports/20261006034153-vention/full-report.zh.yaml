            body: >-
              目标公司是与 vention.com 和 vention.io 关联的工业自动化企业 Vention，而不是使用 ventionteams.com 的软件开发企业。独立档案数据显示，该公司位于
              Montréal，成立于 2016 年，目前处于 Series D
