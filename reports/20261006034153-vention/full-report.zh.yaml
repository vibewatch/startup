      - number: '5.2'
        title: 软件工具、开发者工具包与控制界面
        blocks:
          - type: paragraph
            body: >-
              为适应工厂现场不同的技术能力，Vention 维护分层软件环境，覆盖可视化无代码工作流、程序化 Python 和机器人接口。为快速部署，工厂技术员可通过 MachineLogic
              这一直观的可视化编程、仿真和部署环境，编写线性运动、传感器触发器和机器人例程。MachineLogic 集成可在浏览器访问的 3D Digital Twin
              仿真，让工程师在将例程下载到实体硬件前验证运动学轨迹和互锁条件。


              对于需要定制逻辑、外部数据库同步或复杂操作员交互的先进制造应用，Vention 提供 Vention Developer Toolkit。该工程框架由多个专用组件组成：预配置 Starter
              Template；用于管理顺序自动化例程、内置恢复例程的 State Machine Component；在 Python 中定义数据模式并自动生成 REST API 的 Storage
              Component；以及用于快速创建操作员人机界面（HMI）的 UI 组件包（MachineUI 和 MachineApp）。硬件交互由基础 Python 库 machine-logic-sdk 处理，负责控制
              MachineMotion 控制器上的运动和数字 I/O。


              第三方工程分析显示，Vention 的现代软件栈在应用层使用 Python、FastAPI、Node.js、Next.js 和 React，并结合 gRPC、Protocol Buffers、MQTT
              等高频消息基础设施，支持分布式遥测和控制器实时通信。Vention 示教器上的预装应用为主要协作机器人供应商，尤其是 Universal Robots（UR）和
              FANUC，提供原生运动学与码垛逻辑，简化产线末端包装。
