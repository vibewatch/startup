      - number: '3.3'
        title: 定价经济性、锁定效应与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              采用 Vention 的经济理由，核心是减轻导致 60% 制造业自动化项目延期的集成负担 [CP005, CP010]。Vention
              提供集中式范围界定、仿真和云端采购，并声称相较传统定制工程项目，可将资本支出削减至多 30%，部署速度提升至多 5-8x [CP004, CP005,
              CP010]。但这些生产率优势伴随着双刃剑式的客户锁定：Vention 的专有型材间距、数字孪生约束和 MachineMotion 控制器把买方锁进其零部件目录，让习惯开放标准 DIN 导轨部件的企业客户产生顾虑
              [CP001, CP004, CP009]。此外，随着机器人 OEM 将原生 AI 感知模型和低代码编程环境整合进自己的控制器栈，除非 GRIIP 管线能在全工厂保持更强的多厂商互操作性和交钥匙部署速度，否则
              Vention 长期面临商品化风险 [CP005, CP008, CP011, CP012]。
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP004
              - CP005
              - CP007
              - CP010
      - number: '3.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 机器人 OEM 原生智能侵蚀护城河
            body: >-
              Vention 通过 MachineMotion 控制器和 GRIIP 管线简化编程与视觉集成，从而形成竞争差异。但主要协作机器人制造商（Universal
