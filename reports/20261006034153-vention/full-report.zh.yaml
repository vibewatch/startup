  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台概览与架构层
        blocks:
          - type: paragraph
            body: >-
              Vention
              将其产品定义为统一的软硬件平台，旨在把工业自动化从数月集成周期压缩到数天或数周。传统工业自动化要求工厂运营方协调分散的零部件供应链、定制机械设计、笨重的工业控制柜、手工线束和被供应商锁定的可编程逻辑控制器（PLC）编程。Vention
              则用云原生浏览器 CAD，配合即插即用模块化硬件、预配置驱动电子设备和开发者友好的软件框架，替代这种割裂模式。


              系统分为四个主要架构层：云端建模与协同设计、仿真与数字孪生验证、边缘运动控制与消息中间件，以及现场执行硬件。在云端设计层，MachineBuilder 让制造工程师直接在 WebGL
              浏览器画布中配置定制自动化设备、线性龙门架和协作机器人单元。在软件中间件层，MachineLogic 编程环境和 Vention Developer Toolkit 提供状态机编排、Python
              自动数据持久化，以及基于 React 构建的浏览器操作界面。现场执行由 MachineMotion 控制器系列（包括 MachineMotion
              AI）负责，它通过标准化预模制连接器直接连接执行器、安全设备和协作机器人机械臂，绕过手动端子排。


              这种一体化方案能显著加快标准包装、码垛和机器上下料单元的调试，但也带来技术取舍。Vention 的型材几何和控制总线具有专有性，限制了与 EtherCAT 或 Profinet
              等第三方工业现场总线的直接集成，使企业产线产生供应商锁定。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE007
              - CE008
              - CE013
