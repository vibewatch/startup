  - id: FE001
    title: Vention 集成式工业自动化架构
    type: stack
    summary: 六层架构模型，展示从云端设计、仿真和软件 SDK，到边缘运动控制器及工厂实体硬件的演进。
    data:
      layers:
        - label: 第 1 层：云端 CAD 与工程
          detail: MachineBuilder 浏览器 3D 建模画布、WebGL 参数化装配、实时 BOM 生成和协作设计评审。
        - label: 第 2 层：数字孪生与仿真
          detail: 在浏览器或 CLI 中运行的交互式 3D 仿真、离线轨迹验证和虚拟单元碰撞检测。
        - label: 第 3 层：软件框架与开发者工具包
          detail: Vention Developer Toolkit、State Machine 逻辑组件、自动生成的 REST API 和基于 React 的 MachineUI 操作员组件。
        - label: 第 4 层：运动中间件与消息传递
          detail: machine-logic-sdk Python 库、低延迟 gRPC 与 Protocol Buffers 序列化，以及 MQTT 事件遥测。
        - label: 第 5 层：边缘自动化控制器
          detail: MachineMotion AI 工业控制器、集成式伺服驱动器、光学安全联锁和即插即用 IO 模块。
        - label: 第 6 层：模块化机械与机器人硬件
          detail: 精密 T 型槽铝挤压件、模块化输送床、定制机器人底座和协作机器人臂（FANUC、UR、ABB）。
    approximationNotes: 基于已发布文档和开发者架构，对 Vention 软件与硬件执行层级的概念性呈现。
    claimRefs:
      - CE001
