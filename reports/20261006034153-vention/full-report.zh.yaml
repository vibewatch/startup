      - number: '8.3'
        title: 情景分析、退出路径与最终建议
        blocks:
          - type: paragraph
            body: >-
              把 Vention 放进乐观、基准和悲观三种情景后，可以看到其结果高度不对称，关键取决于财务披露和软件毛利能否兑现。乐观情景下，Rapid Operator AI 和 GRIIP
              在全球多站点部署中加速打入企业客户，推高软件收入运行率，支撑工业科技平台的高倍数估值，或促成大型机器人、自动化集团收购。基准情景下，Vention 在工业中小企业和 Tier-1
              制造客户中保持稳定扩张，但对硬件零部件的高度依赖，以及制造业资本开支的周期性，会压低综合利润率，估值仅温和上修。悲观情景下，宏观经济放缓压缩工厂自动化资本开支；未解决的股权结构清算优先权则在下轮融资压力下稀释后期股东。由于完全缺少经审计财务报表、单位经济模型和官方投后估值数据，我们给出继续跟踪建议：对运营和技术验证点的信心较高，风险评级高，估值判断暂列未知，等待私募财务披露。
            claimRefs:
              - CV003
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: 图表与附录
        blocks:
          - type: callout
            title: 尽调结论：待审计单位经济数据出炉前维持跟踪
            body: >-
              Vention 已展现出明确的商业势头：2026 年初完成 1.1 亿美元融资，平台也被全球制造企业采用。但在收入分项、毛利率、EBITDA
              以及完整股权结构的优先级瀑布均未获验证前，投入成长资本仍缺乏依据。投资者应继续跟踪 Vention 在企业物理 AI 领域的进展，同时把全面的私募财务披露作为直接参与的前提。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV012
              - CV016
          - type: callout
            title: 2.63 亿美元总资本上的清算优先权悬垂
            body: >-
              包括 2026 年初 Series D 融资在内，Vention 通过多轮优先股融资筹得 2.63
              亿美元，普通股和早期股东因此面临厚重的清算优先权层级。若退出估值低于独角兽门槛，或公司通过下轮融资重组资本结构，Series C 和 D 投资人的高优先级权利可能大幅侵蚀次级股东回报。
            calloutType: risk
            claimRefs:
              - CV008
              - CV011
              - CV012
