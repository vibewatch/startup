      - number: '8.2'
        title: 融资背景、资本结构与价格支撑
        blocks:
          - type: paragraph
            body: >-
              2026 年 1 月，Vention 宣布完成一轮 $110M USD（$150M CAD）融资，战略支持方 NVentures（Nvidia 的风险投资部门）、Investissement
              Québec、Desjardins Capital 以及 Fidelity Investments Canada ULC 管理的基金参与其中。独立追踪机构 Tracxn 确认，这笔融资使 Vention
              七轮累计融资达到 $263M；此前公司曾于 2022 年完成 Fidelity 领投的 Series C 轮融资，更早的轮次则有 Bain Capital Ventures 支持。FundedIQ
              等二级创投追踪服务会记录历史轮次基准，但私募市场平台明确不披露本次 Series D 融资的投后估值、股份类别权利和清算优先权悬垂。Investissement Québec 和 NVentures
              带来的主权资本与战略发展资本，说明市场对 Vention 物理 AI 机器人路线的认可。不过，公开证据无法验证当前定价究竟反映的是克制的 SaaS 倍数，还是激进的物理 AI
              溢价，因此对未经验证的二级交易必须严格把控入场纪律。
            claimRefs:
              - CV001
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
