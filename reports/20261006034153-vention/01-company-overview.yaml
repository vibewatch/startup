artifact: "company-overview"
slug: "vention"
runDate: "2026-10-06"
company:
  name: "Vention"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Vention is a Montréal-based, Series D industrial-automation company founded in
    2016 that combines cloud software, modular hardware, motion control, and
    physical-AI applications. Public evidence supports a $110 million financing
    announced in January 2026 and $263 million of cumulative funding, but current
    valuation, revenue quality, cash availability, ownership rights, and audited
    financials remain undisclosed.
sections:
  - id: "identity-and-platform"
    title: "Identity and integrated automation platform"
    body: >-
      The target company is the industrial-automation Vention associated with
      vention.com and vention.io, not the software-development business using
      ventionteams.com. Independent profile data places the company in Montréal,
      founded in 2016 and at Series D stage. Its offer is vertically integrated:
      the platform combines cloud design and programming software, modular
      hardware, motion control, ordering, deployment, and operation of factory
      equipment. This creates a hybrid business whose economics cannot be reduced
      to a pure software multiple without revenue-mix and margin disclosure.
      Vention's own current homepage reports a broad installed footprint, but those
      scale metrics are company claims rather than independently audited counts.
    claimRefs: ["CO001", "CO002", "CO003", "CO007", "CO009", "CO012"]
    tableRefs: ["TO001"]
  - id: "leadership-and-governance"
    title: "Founder leadership and governance visibility"
    body: >-
      Étienne Lacroix and Max Windisch are identified as co-founders. Available
      profile evidence lists Lacroix as chief executive and Windisch as chief
      technology and strategy officer, concentrating commercial direction and
      technical strategy in the founding team. Tracxn also lists five active board
      members, but the assigned evidence does not establish director biographies,
      appointment rights, committee structure, voting control, succession
      planning, or material leadership changes. Founder-market fit appears
      directionally aligned with the integrated mechanical-and-software product,
      yet this is not a substitute for references, tenure histories, or a current
      governance package. Key-person dependence therefore remains a diligence
      issue rather than a quantified conclusion.
    claimRefs: ["CO004", "CO005", "CO006"]
    tableRefs: ["TO002"]
  - id: "capital-and-scale"
    title: "Capital base, reported scale, and stakeholder exposure"
    body: >-
      Tracxn reports $263 million raised across seven rounds. The strongest current
      financing evidence is the January 27, 2026 announcement of $110 million in
      financing with participation from Investissement Québec, Desjardins Capital,
      Fidelity Investments Canada, NVentures, and other institutions. This is
      funding raised, not cash available, and the public materials do not disclose
      security type, post-money valuation, liquidation preferences, debt ranking,
      secondary proceeds, or current runway. Tracxn separately reports 360
      employees “as of May 26” without a year in the accessible text, so the figure
      is retained with unknown freshness. The company claims 28,000-plus machines
      across 6,000-plus factories and 25-plus industries; customer count, revenue,
      ARR, gross margin, and retention remain unsupported.
    claimRefs: ["CO010", "CO011", "CO012", "CO013", "CO016"]
    tableRefs: ["TO003"]
  - id: "milestones-and-diligence-boundaries"
    title: "Milestones and evidence boundaries"
    body: >-
      The public chronology shows a first funding round in 2017, a $95 million
      Series C recorded in 2022, and a shift toward AI-enabled controllers and
      autonomous robotic applications in 2025–2026. The January 2026 financing
      provides fresh capital for that strategy, while the official press archive
      records GRIIP and Rapid Operator AI launches during 2026. These are product
      and financing milestones, not evidence of profitable adoption. Independent
      coverage in the assigned pool is thin, and Tracxn places Vention among 1,016
      active competitors. No allocated source substantiates a current valuation,
      adverse legal or regulatory event, or audited operating performance; the
      absence of such a source must not be interpreted as proof that no incident
      exists.
    claimRefs: ["CO008", "CO011", "CO014", "CO015", "CO016"]
    figureRefs: ["FO001"]
