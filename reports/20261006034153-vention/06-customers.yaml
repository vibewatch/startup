    columns:
      - Metric
      - Reported value
      - Period / source
      - Confidence
      - Implication
      - Missing denominator or qualification
    rows:
      - ["Installed machines and factories", ">25,000 machines; 4,000 factories", "Undated item in fetched Vention press index", Medium, "Material installed base", "Item date and active-use definition are absent"]
      - ["Installed machines and factories", ">28,000 machines; >4,000 factories", "Wikipedia, stated as of 2026", Medium, "Third-party summary supports deployment scale", "Underlying customer and active-machine definitions are not reproduced"]
      - ["Installed machines and factories", "28K+ machines; 6K+ factories", "Vention homepage accessed 2026-10-06", Medium, "Company claims a larger current footprint", "Factory-count basis differs from other retained sources"]
      - ["Large-company penetration", "90 Fortune 500 companies", "Vention homepage accessed 2026-10-06", Low, "Signals enterprise reach", "No list, contract scope, or active-use denominator"]
      - ["US manufacturer penetration", "99 of top 500 US manufacturers", "Vention homepage accessed 2026-10-06", Low, "Signals manufacturing relevance", "Ranking definition and deployment depth are not disclosed"]
      - ["Portfolio outcomes", "1.3-year payback; 3–8× faster deployment; 4.7× ROI; 80-point NPS", "Vention homepage accessed 2026-10-06", Low, "Suggests economic value and satisfaction", "No sample, methodology, cohort, or measurement period"]
    notes: >-
      Values are reproduced with their original labels and vintages; they are
      not normalized into a growth rate because definitions and periods differ.
    claimRefs: [CU002, CU003, CU004, CU005, CU006]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use-case evidence
      - Production vs. pilot
      - Public outcome
      - Limitation
    rows:
      - [Hershey, "Enterprise consumer goods manufacturer", "Named as a Vention client in both retained source sets", "Not disclosed", null, "No customer-side confirmation or contract scope"]
      - [Tesla, "Enterprise automotive manufacturer", "Named as a Vention client in both retained source sets", "Not disclosed", null, "No project, plant, or outcome detail"]
      - ["GE / GE Aerospace", "Enterprise industrial and aerospace manufacturer", "Named by Wikipedia and the Vention press index", "Not disclosed", null, "Entity naming differs and deployment detail is absent"]
      - [3M, "Enterprise diversified manufacturer", "Named in Vention's press-index summary of Bloomberg", "Not disclosed", null, "Single company-controlled summary in the retained pool"]
      - [Apple, "Enterprise technology manufacturer", "Named in Vention's press-index summary of Bloomberg", "Not disclosed", null, "Single company-controlled summary in the retained pool"]
    notes: >-
      Representative sample from names appearing in the retained Wikipedia page
      and Vention press index; null means no customer-specific outcome was
      disclosed in those fetched sources.
    enumerationScope:
      coverage: sample
      basis: >-
        Five overlapping or prominent enterprise names from the two retained
        sources that enumerate industrial Vention customers.
    claimRefs: [CU007, CU008]
figures:
  - id: FU001
    title: Customer adoption and expansion journey
    type: journey-map
    summary: >-
      Public materials describe a design-to-operation path with a possible
      multi-plant expansion loop, while measured conversion and retention remain
      undisclosed.
    data:
      nodes:
        - id: scope
          label: Scope
          detail: "Select a factory-floor application or pre-engineered cell."
          touchpoints: ["Turnkey services", "Supported deployment", "Self-service"]
        - id: design
          label: Design
          detail: "Configure equipment in Vention's cloud software."
          touchpoints: ["MachineBuilder", "Digital twin"]
        - id: procure
          label: Procure
          detail: "Order integrated hardware and automation components."
          touchpoints: ["Online ordering", "Modular hardware ecosystem"]
        - id: deploy
          label: Deploy
          detail: "Commission equipment through cloud-to-floor tooling or expert support."
          touchpoints: ["Programming", "Assembly guidance", "Field services"]
        - id: operate
          label: Operate
          detail: "Monitor equipment and access remote support."
          touchpoints: ["Remote monitoring", "Customer success", "Machine health"]
        - id: expand
          label: Expand
          detail: "Replicate an automation standard across applications or plants."
          touchpoints: ["Enterprise standardization", "Additional cells", "Multi-plant rollout"]
    approximationNotes: >-
      This is a qualitative workflow synthesized from company materials; no
      stage conversion rates, time-to-stage measures, or cohort retention are
      publicly disclosed in the assigned pool.
    claimRefs: [CU009, CU010, CU016]
callouts:
  - calloutType: risk
    title: Installed-base scale is not retention evidence
    body: >-
      Public machine, factory, logo, ROI, and NPS claims lack the account-level
      cohorts needed to establish renewal, repeat purchase, expansion, or
      concentration. Request customer-level data before underwriting durability.
    claimRefs: [CU002, CU005, CU006, CU015]
