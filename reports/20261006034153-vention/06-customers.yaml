  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-and-concentration
      missingEvidence: >-
        GRR, NRR, logo and revenue churn, contract duration, renewal schedule,
        repeat-purchase cohorts, and top-10 customer revenue concentration.
      whyItMatters: >-
        Installed machines and named logos cannot establish recurring durability,
        expansion economics, or exposure to a small number of customers.
      diligencePath: >-
        Request a customer-level cohort export for the last twelve quarters,
        reconciled to invoices, renewals, deployments, and recognized revenue.
      relatedQuestionRefs: [QU006]
    - type: conflicting-data
      severity: material
      topic: customer-scale
      missingEvidence: >-
        A dated reconciliation of the 4,000- versus 6,000-factory claims and the
        definitions of factory, customer, machine, active deployment, and paid account.
      whyItMatters: >-
        Without consistent definitions and vintages, public counts cannot support
        a growth rate, utilization estimate, or customer-retention inference.
      diligencePath: >-
        Obtain quarterly installed-base bridges with additions, removals,
        inactive sites, repeat buyers, and machine counts by customer and plant.
      relatedQuestionRefs: [QU002]
      relatedTableRefs: [TU002]
    - type: enumeration-incomplete
      severity: material
      topic: named-customers
      missingEvidence: >-
        Customer-side confirmation of deployment scope, production status,
        measured outcomes, contract value, and referenceability for named logos.
      whyItMatters: >-
        Company and secondary-source name lists do not distinguish a pilot,
        one-time component purchase, production deployment, or multi-plant standard.
      diligencePath: >-
        Conduct reference calls with at least five customers across enterprise,
        SME, integrator, and repeat-purchase cohorts and inspect signed orders.
