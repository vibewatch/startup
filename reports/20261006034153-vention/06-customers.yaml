      - [Small and medium manufacturers, "Owners; operations and manufacturing teams", "Reduce integration complexity for targeted automation", "Pre-engineered cells and supported deployment", "Broadens addressable base below large enterprises", "No segment adoption, price, or retention data"]
      - [System integrators, "Automation integrators and engineers", "Configure and deploy modular hardware and software for end users", "Platform, marketplace, and programming tools", "Channel and implementation leverage", "No partner-sourced revenue or concentration data"]
      - [Research laboratories, "Researchers and robotics engineers", "Prototype, test, and operate robotics systems", "Configurable platform and research-oriented robotics", "Early technical adoption and ecosystem reach", "No paid-account or conversion disclosure"]
    notes: >-
      Segments and delivery modes come from Vention-controlled pages; revenue
      contribution, customer counts, and retention by segment are not disclosed.
    claimRefs: [CU001, CU009, CU016]
  - id: TU002
