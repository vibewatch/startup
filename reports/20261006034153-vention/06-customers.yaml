schemaVersion: "report-v2"
artifact: customers
slug: vention
runDate: 2026-10-06
company:
  name: Vention
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence supports broad industrial adoption across enterprise, SME,
    integrator, and research users, but the strongest scale, outcome, and
    expansion indicators remain company-claimed or indirectly reported.
    Retention, contract durability, and customer concentration remain material
    diligence gaps.
sections:
  - id: customer-base-and-buyers
    title: Customer base and buying surfaces
    body: >-
      Vention explicitly positions the platform for enterprises, small and
      medium-sized manufacturers, integrators, and research laboratories. The
      common user is an automation or manufacturing team that needs to design,
      procure, deploy, and operate factory-floor equipment; the commercial
      surface ranges from self-service ordering to supported deployment and
      turnkey services. This is broader than a single robot-cell SKU and creates
      multiple entry points by customer sophistication and project complexity.
      The breadth is directionally attractive, but the public material does not
      disclose revenue mix, customer counts, average order value, or gross
      margin by segment. It therefore supports segmentation of buyer and use
      case, not a conclusion about which cohort drives durable economics.
    claimRefs: [CU001, CU009, CU016]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption trajectory and scale
    body: >-
      The installed-base signal is meaningful but not yet reconciled. Vention's
      current homepage claims more than 28,000 machines across more than 6,000
      factories and more than 25 industries, while Wikipedia reports more than
      28,000 machines at over 4,000 factories as of 2026. A cached Vention press
      index separately describes more than 25,000 machines at 4,000 factories.
      These figures indicate substantial physical deployment, but the different
      factory counts and vintages prevent a clean growth calculation. The
      homepage also claims usage by 90 Fortune 500 companies and 99 of the top
      500 US manufacturers. None of these public counts provides a definition of
      active customer, paid account, installed machine, repeat purchaser, or
      production utilization, so scale should not be read as retention.
    claimRefs: [CU002, CU003, CU004, CU005]
    tableRefs: [TU002]
  - id: named-proof-and-outcomes
    title: Named proof and outcome quality
    body: >-
      Named-enterprise evidence is broad but mostly indirect. Wikipedia lists
      customers including Toyota, GE, Tesla, Siemens, Airbus, Google, Amazon,
      Boeing, Lockheed Martin, L'Oréal, and Hershey. Vention's own press index,
      summarizing a Bloomberg profile, names Hershey, 3M, Tesla, Apple, and GE
      Aerospace. The overlap improves confidence that several large
      manufacturers have a real commercial relationship, but neither retained
      source identifies contract scope, paid production status, plant count,
      renewal history, or customer-verified outcomes. Vention also publishes
      strong portfolio-level outcome claims—1.3-year average payback, 3–8 times
      faster deployment, 4.7 times average customer ROI, and an 80-point NPS—
      without methodology or denominators in the fetched page. These are useful
      diligence leads rather than independently verified cohort results.
    claimRefs: [CU006, CU007, CU008, CU014]
    tableRefs: [TU003]
  - id: durability-expansion-and-risk
    title: Durability, expansion, and concentration risk
    body: >-
      The clearest expansion claim is a January 2026 company release,
      syndicated by Yahoo Finance, stating that enterprise customers use
      Vention as a standard across multiple plants. That describes a plausible
      land-and-expand mechanism, reinforced by self-service, supported, and
      turnkey delivery paths, but it supplies no customer count, contract value,
      renewal rate, or expansion cohort. Current product and partner updates
      show active commercial investment, not customer durability. An unrelated
      software-services company also uses the Vention name and dominates several
      assigned search results; those records were retained only to document the
      entity-resolution risk and were excluded from industrial-customer metrics.
      The assigned evidence contains no target-specific churn, failed-pilot,
      complaint, top-customer concentration, GRR, or NRR disclosure. Broader AI
      adoption data shows that pilot-to-production conversion remains difficult,
      which is an industry caution rather than proof of Vention-specific churn.
    claimRefs: [CU010, CU011, CU012, CU013, CU015]
    figureRefs: [FU001]
tables:
