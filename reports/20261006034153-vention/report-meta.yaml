  topStrengths:
    - Meaningful installed base and enterprise adoption signal across machines, factories, and named customers.
    - Fresh January 2026 financing extends runway for physical-AI product and geographic expansion.
    - Integrated software-hardware stack lowers deployment friction versus legacy integrators.
  topRisks:
    - Audited financial statements and margin composition remain undisclosed.
    - Customer durability, retention, and concentration are not publicly verified.
    - Brand confusion and supplier dependencies can distort diligence and operating risk.
  unresolvedGaps:
    - Audited FY2023-FY2025 financial statements with revenue by stream, gross margin, EBITDA, cash, and burn.
