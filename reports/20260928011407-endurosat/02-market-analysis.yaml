callouts:
- calloutType: risk
  title: Dual-Use Regulatory and Export Licensing Bottlenecks
  body: Because satellite bus platforms incorporate dual-use avionics and sensitive communications subsystems, EnduroSat's market expansion depends strictly on compliance with EU Dual-Use Regulation 2021/821, U.S. EAR, and ITAR frameworks. Establishing dual-region manufacturing in Bulgaria and the U.S. is essential to satisfy domestic defense content mandates, but exposes operations to complex cross-border regulatory scrutiny and potential export denial risks.
  claimRefs:
  - CM014
  - CM015
- calloutType: insight
  title: Commercial Proliferation and Serial Manufacturing Economics
  body: The commercial satellite industry is shifting rapidly away from custom-engineered spacecraft toward high-cadence serial manufacturing. Winning the 24-bus Vantor contract demonstrates that commercial constellation builders are willing to outsource entire bus fleets to third-party manufacturers, provided suppliers can demonstrate flight-proven heritage, rapid delivery cadences, and modular payload interfaces.
  claimRefs:
  - CM005
  - CM006
  - CM010
