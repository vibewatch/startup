callouts:
  - calloutType: strength
    title: "Standardized Modular Bus Assembly and Rapid Integration"
    body: "EnduroSat's patented cableless FRAME bus architecture replaces bespoke wiring harnesses with modular mechanical and electrical interconnects, enabling a single technician to complete assembly and functional testing in eight hours. Combined with the SPS-1 interface protocol that auto-generates driver code, this architecture compresses integration timelines from months to days."
    claimRefs:
      - "CE006"
      - "CE007"
  - calloutType: risk
    title: "On-Orbit Processing Power Budgets and Downlink Bandwidth Limits"
    body: "While Kubernetes-clustered edge computing aboard the FRAME-15 platform provides up to 16,000 TFLOPS of compute capability, operations remain constrained by a 3.4 kW peak power envelope, space thermal dissipation limits, and ground station downlink scheduling availability. Deploying continuous real-time AI inference at scale requires verified duty-cycle margins."
    claimRefs:
      - "CE008"
      - "CE016"

