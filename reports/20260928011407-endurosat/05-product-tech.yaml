  title: "Product & Technology"
  summary: "EnduroSat combines standardized modular CubeSat components with its cableless ESPA-class FRAME bus line, enabling rapid 8-hour payload assembly, cloud-native constellation operations, and multi-node orbital edge compute capabilities."

sections:
  - id: "product-portfolio-and-modular-avionics"
    title: "Standardized Bus Architecture and Modular Subsystem Portfolio"
    body: "EnduroSat delivers commercial and defense satellite infrastructure through a two-tiered hardware portfolio: modular CubeSat sub-systems and larger ESPA-class satellite buses. The modular portfolio spans high-performance flight computers based on ARM Cortex microcontrollers, electrical power systems, communication modules, and precision CubeSat structures. Across its bus lineup, EnduroSat categorizes platforms into three primary tiers: FRAME S (200 kg wet mass, 3.4 kW peak power), FRAME L (500 kg, 7 kW peak power), and FRAME MAX (1 to 5 tons, 10 kW peak power). All bus structures are engineered for seven-year orbital operational lifespans, providing standardized physical mounting and electrical power distribution that eliminate bespoke engineering cycles for commercial and scientific constellation customers."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
    tableRefs:
      - "TE001"

  - id: "cableless-frame-architecture-and-orbital-compute"
    title: "Cableless FRAME Architecture and High-Performance In-Orbit Compute"
    body: "The core engineering innovation of EnduroSat's spacecraft platform is its patented modular cableless bus architecture. By removing traditional internal wiring harnesses in favor of direct blind-mate board-to-board connectors and standardized structural backplanes, EnduroSat enables a single technician to mechanically assemble, integrate, and functionally test an ESPA-class bus in approximately eight hours. This modularity extends into demanding on-orbit edge computing workflows through partnerships such as the Titan mission with Aethero, which deploys containerized Kubernetes compute clusters aboard the FRAME-15 platform. The system leverages NVIDIA Thor-based silicon delivering up to 16,000 TFLOPS of orbital compute, protected by radiation-hardening-by-system-design software scrubbing and error correction mechanisms to circumvent ground downlink bottlenecks."
    claimRefs:
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE010"
    tableRefs:
      - "TE002"
    figureRefs:
      - "FE001"

  - id: "mission-integration-and-cloud-ground-operations"
    title: "Automated Mission Integration, Flatsat Testing, and Ground Operations"
    body: "EnduroSat accelerates constellation deployment from concept to orbit within a six-month delivery cadence by standardizing hardware interfaces and software tooling. Through its proprietary SPS-1 interface protocol, payload developers define telemetry and command dictionaries using interface definition languages, automatically generating flight-ready platform drivers that integrate with EnduroSat's graphical mission control interface. Prior to launch, customers connect remotely to a ground-based FlatSat testbed running real-time hardware-in-the-loop simulations of orbital dynamics and sensor stimuli over attenuated radio frequency links. Once in orbit, constellation operations integrate with virtualized ground network providers, such as Swedish Space Corporation's SSC Space Go network, which demonstrated downlinking 40 distinct payload artifacts in X-band from the Balkan-1 satellite with sub-five-minute delivery to cloud storage."
    claimRefs:
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE013"
    tableRefs:
      - "TE003"

  - id: "quality-controls-cybersecurity-and-supply-chain-governance"
    title: "Quality Controls, RF Encryption, and Supply Chain Governance"
    body: "Operational integrity across EnduroSat's manufacturing operations and on-orbit assets relies on strict digital security protocols and formal supply chain governance. Spacecraft telemetry and command channels incorporate multi-layer encryption, including hardware-accelerated AES-128 cryptographic ciphers over radio frequency links and encrypted cloud object storage pipelines. To support defense and institutional satellite programs, EnduroSat enforces a comprehensive Supplier Code of Conduct mandating anti-counterfeit component verification, traceability of critical electronic parts, and adherence to EU dual-use export regulations and U.S. ITAR and EAR requirements. These controls mitigate critical operational vulnerabilities associated with commercial-off-the-shelf component degradation in harsh space environments."
    claimRefs:
      - "CE013"
      - "CE014"
      - "CE015"
      - "CE016"

