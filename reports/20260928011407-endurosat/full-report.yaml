      - number: '5.3'
        title: Automated Mission Integration, Flatsat Testing, and Ground Operations
        blocks:
          - type: paragraph
            body: >-
              EnduroSat accelerates constellation deployment from concept to orbit within a six-month delivery cadence
              by standardizing hardware interfaces and software tooling. Through its proprietary SPS-1 interface
              protocol, payload developers define telemetry and command dictionaries using interface definition
              languages, automatically generating flight-ready platform drivers that integrate with EnduroSat's
              graphical mission control interface. Prior to launch, customers connect remotely to a ground-based FlatSat
              testbed running real-time hardware-in-the-loop simulations of orbital dynamics and sensor stimuli over
              attenuated radio frequency links. Once in orbit, constellation operations integrate with virtualized
              ground network providers, such as Swedish Space Corporation's SSC Space Go network, which demonstrated
              downlinking 40 distinct payload artifacts in X-band from the Balkan-1 satellite with sub-five-minute
              delivery to cloud storage.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
