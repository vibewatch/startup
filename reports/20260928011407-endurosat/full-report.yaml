              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Regulatory Firewalls Between European Operations and U.S. Defense Expansion
            body: >-
              EnduroSat's core software licenses explicitly prohibit military and ITAR end-uses under Bulgarian entity
              EnduroSat Trading EOOD. Scaling a parallel U.S. manufacturing facility targeting Department of War and
              Space Force contracts requires strict operational and intellectual property firewalls to avoid
              cross-border export control violations under EU Dual-Use Regulation 2021/821 and U.S. ITAR.
            calloutType: risk
            claimRefs:
              - CR002
              - CR004
              - CR013
          - type: callout
            title: Execution Risk Concentration in the 24-Bus Vantor Constellation Award
            body: >-
              Winning the 24-bus contract for Vantor's Pulse constellation validates EnduroSat's standardized
              microsatellite architecture, but concentrates operational throughput on European assembly lines prior to
              late 2027 U.S. facility commissioning. Any production bottleneck or integration delay would directly
              impact commercial milestone payments and revenue momentum.
            calloutType: insight
            claimRefs:
              - CR010
