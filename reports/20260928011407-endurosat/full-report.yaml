  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory Licensing, Dual-Use Controls, and ITAR Restrictions
        blocks:
          - type: paragraph
            body: >-
              EnduroSat operates under a dual-jurisdiction compliance framework spanning its primary engineering and
              corporate hub in Sofia, Bulgaria and its newly capitalized expansion into the United States defense
              ecosystem. Under Bulgarian registration (UIC 205605489), the company is bound by EU Regulation 2021/821
              governing dual-use items and EU Common Military List controls. In commercial contracts, such as the
              SpaceComms software licensing agreement, EnduroSat strictly restricts software utilization to civil and
              educational applications, explicitly forbidding military end-uses and technologies governed by U.S.
              International Traffic in Arms Regulations (ITAR). Furthermore, license covenants enforce strict
              international trade sanctions prohibiting deployment across embargoed jurisdictions including Russia,
              Belarus, Cuba, Iran, and Syria. As EnduroSat establishes U.S. assembly facilities to capture Department of
              War and Space Force contracts, bridging civil European manufacturing lines with classified domestic
              content standards presents significant regulatory, legal classification, and export oversight exposure.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
