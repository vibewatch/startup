      - number: '1.2'
        title: Executive Leadership, Governance, and Supply Chain Compliance
        blocks:
          - type: paragraph
            body: >-
              Executive leadership is anchored by founder and Chief Executive Officer Raycho Raychev, who provides
              long-term strategic direction and represents the business across sovereign and international defense
              partnerships. Chief Technical Officer Viktor Danchev leads engineering architecture, satellite avionics
              design, and software-defined bus modularity, supported by Projects Director Vanya Buchova, who manages
              mission execution and customer delivery programs. The executive core is supplemented by an international
              advisory board featuring prominent space industry figures, including former European Space Agency Director
              General Prof. Dr. Johann-Dietrich Wörner and former NASA Ames Research Center Director Dr. S. Pete Worden.
              Because corporate strategy and high-level sovereign customer relationships remain closely associated with
              the founder, key-person dependency is evaluated as concentrated. To mitigate operational and regulatory
              vulnerabilities across international defense supply chains, EnduroSat enforces a formal legal Supplier
              Code of Conduct mandating anti-corruption standards, export compliance, and audit rights across its
              component vendors.
            claimRefs:
