          risks
        - Demands stringent downside protection, liquidation preference seniority, and milestone-gated tranches.
      - - Valuation Stance
        - Stretched
        - Post-money valuation >$1B implies aggressive premium over public space peers (3x–10x revenue)
        - >-
          Entry discipline requires seeking valuation discounts, convertible structures, or waiting for revenue
