              - CV011
      - number: '8.3'
        title: Bull, Base, and Bear Scenario Modeling
        blocks:
          - type: paragraph
            body: >-
              To evaluate risk-adjusted return profiles across potential operational trajectories, we construct Bull,
              Base, and Bear scenario models anchored on FY2025 preliminary revenue and projected scaling milestones. In
              the Bull case (25% assigned probability), EnduroSat successfully operationalizes its new United States
              facility and Sofia cleanrooms, scaling production of its heavier FRAME Max platforms (500 kilograms to 5
              tons) for sovereign and commercial constellations. Under this scenario, FY2026 revenue surpasses $80
              million and reaches $250 million by FY2028, supporting a $2.2 billion to $2.5 billion enterprise valuation
              at an 8.8x to 10.0x terminal multiple. In the Base case (50% assigned probability), EnduroSat experiences
              steady commercial adoption across CubeSat and ESPA lines, doubling FY2026 revenue to approximately $75
              million and expanding to $165 million by FY2028. As market multiples normalize toward aerospace sector
              standards of 7.0x to 7.5x revenue, the implied enterprise valuation reaches $1.15 billion to $1.25
              billion, yielding modest capital appreciation from current Series C levels. In the Bear case (25% assigned
              probability), dual-facility expansion strains technical management, transatlantic ITAR and export-control
              compliance delays delivery schedules, and commercial customer concentration results in order deferrals.
              Revenue growth decelerates to $50 million in FY2026 and $85 million in FY2028, triggering multiple
              compression to 3.5x to 4.5x revenue and an implied valuation contraction to $300 million to $380 million,
              necessitating structured recapitalization.
            claimRefs:
              - CV007
              - CV008
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV007
              - CV008
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Exit Readiness, Diligence Asks, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Evaluating long-term exit readiness reveals strategic trade-offs between public listing timelines and
              strategic trade sale opportunities. Secondary marketplace data from Forge Global confirms that EnduroSat
              remains in early pre-IPO stages with no confidential S-1 registration or established liquidity framework.
              Achieving public exit readiness will require at least two to four years of rigorous operational scaling,
              implementation of internal controls compliant with Sarbanes-Oxley standards, and sustained positive
              operating cash flows to weather public market aerospace volatility. Alternatively, strategic M&A
              represents a viable exit route, with potential interest from European defense primes seeking modular
              sovereign satellite constellations or United States aerospace defense consolidators aiming to accelerate
              time-to-orbit for responsive space architectures. Prior to making growth capital commitments, investors
              must pursue critical diligence asks focused on cap-table structure, including Series C liquidation
              preference seniority stacks and employee equity pool dilution. Measurable thesis-break triggers include
              construction delays exceeding six months at the United States or Sofia facilities, regulatory rejection of
              transatlantic aerospace technology transfers, gross margin erosion falling below 35% under serial
              production conditions, or the loss of key constellation launch contracts.
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV011
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Investment Verdict: Track at Current Unicorn Valuation'
            body: >-
              While EnduroSat's technological execution, modular manufacturing model, and rapid revenue expansion are
              exceptional for the European space sector, the $1B+ valuation mark achieved in the September 2026 Series C
              commands an aggressive 26x–27x trailing revenue multiple. We recommend an investment stance of Track,
              awaiting de-risking of US facility construction and validation of FRAME Max serial production margins.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV007
              - CV008
              - CV009
          - type: callout
            title: 'Downside Exposure: Dual-Continent Capital Intensity'
            body: >-
              Concurrent development of a US manufacturing plant and the €100M+ Dobroslavtsi space and defense hub
              introduces significant capital absorption risk. Delays in commercial constellation customer commitments or
              transatlantic export compliance could trigger elevated cash burn and down-round recapitalization risks.
            calloutType: risk
            claimRefs:
              - CV006
              - CV011
              - CV014
