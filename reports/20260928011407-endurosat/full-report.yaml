  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Standardized Bus Architecture and Modular Subsystem Portfolio
        blocks:
          - type: paragraph
            body: >-
              EnduroSat delivers commercial and defense satellite infrastructure through a two-tiered hardware
              portfolio: modular CubeSat sub-systems and larger ESPA-class satellite buses. The modular portfolio spans
              high-performance flight computers based on ARM Cortex microcontrollers, electrical power systems,
              communication modules, and precision CubeSat structures. Across its bus lineup, EnduroSat categorizes
              platforms into three primary tiers: FRAME S (200 kg wet mass, 3.4 kW peak power), FRAME L (500 kg, 7 kW
              peak power), and FRAME MAX (1 to 5 tons, 10 kW peak power). All bus structures are engineered for
              seven-year orbital operational lifespans, providing standardized physical mounting and electrical power
              distribution that eliminate bespoke engineering cycles for commercial and scientific constellation
              customers.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
