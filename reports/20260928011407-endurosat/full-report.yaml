      - number: '6.2'
        title: Verified Commercial Deployments, Contract Milestones, and Reference Quality
        blocks:
          - type: paragraph
            body: >-
              Publicly confirmed commercial deployments provide direct verification of EnduroSat's software-defined bus
              capabilities across diverse mission profiles. In commercial Earth observation, Vantor selected EnduroSat
              to manufacture and deliver 24 standardized software-defined microsatellite platforms for its planned Pulse
              constellation, incorporating synthetic aperture radar and optical imaging payloads. For in-orbit cloud
              edge computing, EnduroSat deployed IBM Space and Red Hat payloads on its CubeSat platform, achieving more
              than 23 months of continuous flight heritage in low Earth orbit. In commercial space weather analytics,
              Mission Space contracted with EnduroSat to launch its initial sensor constellation payload on a shared
              CubeSat platform in 2022, with EnduroSat serving as both launch service provider and downstream commercial
              data customer. Additionally, the company is collaborating with the Bulgarian government under an August
              2026 memorandum to establish a space and defense development center at the Dobroslavtsi airbase,
              highlighting sovereign defense interest in localized satellite manufacturing infrastructure.
            claimRefs:
