      - number: '6.3'
        title: Adoption Trajectory, Retention Durability, and Concentration Headwinds
        blocks:
          - type: paragraph
            body: >-
              EnduroSat's customer expansion trajectory relies on a land-and-expand mechanism, transitioning customers
              from purchasing discrete avionics modules or single-satellite shared service demonstrations into dedicated
              multi-satellite bus constellation contracts. The company has launched 100 or more satellites to orbit,
              delivered over 200 spacecraft, and deployed more than 5,000 subsystem modules, achieving reported 2025
              revenue of €34 million to €35 million. Despite this operational cadence, customer retention and account
              durability face structural headwinds. EnduroSat discloses no audited figures for Net Revenue Retention,
              Gross Revenue Retention, customer churn, or average contract value. The loss or deployment cancellation of
              a single anchor constellation client, such as Vantor, represents substantial top-line revenue risk.
              Furthermore, prime defense contractors impose stringent flow-down compliance obligations, audit rights,
              and anti-corruption requirements under supplier governance codes, increasing commercial overhead and
              creating delivery penalties if serialized platform milestones are delayed.
