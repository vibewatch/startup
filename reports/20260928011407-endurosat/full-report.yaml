      - number: '7.2'
        title: Operational Scaling, Supply Chain Due Diligence, and Spacecraft Reliability
        blocks:
          - type: paragraph
            body: >-
              Scaling satellite manufacturing from modular CubeSat architectures (1U to 6U) to heavy ESPA-class
              satellite buses weighing between 500 kg and 5,000 kg introduces severe manufacturing, tooling, and supply
              chain bottlenecks. Although EnduroSat has demonstrated flight heritage with over 100 satellites and 5,000
              component modules placed into orbit, serial bus production requires uncompromising component reliability
              across extended 7-year orbital design lifespans. To mitigate critical component failures in space
              environments, EnduroSat enforces a formal Supplier Code of Conduct mandating rigorous anti-counterfeit
              protocols, component traceability, conflict minerals screening, and internal compliance management
              systems. The company retains unilateral audit privileges and contractual rights to suspend or terminate
              non-compliant suppliers. Nevertheless, serialized mass production exposes the firm to semiconductor
              component lead-time volatility, cleanroom throughput constraints, and quality assurance risks that could
              jeopardize fixed-price constellation delivery schedules.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
