  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Counterargument
      - Catalyst / Dilemma
    rows:
      - - Manufacturing & Architecture
        - >-
          Software-defined cableless architecture enables satellite assembly in 8 hours and 2 ESPA-class satellites
          daily.
        - >-
          High-volume serial production of 500kg to 5-ton spacecraft is unproven; scaling beyond CubeSats introduces
          thermal and reliability risks.
        - Successful on-orbit qualification and customer acceptance of first serial FRAME Max units.
      - - Cost & Market Disruption
        - Targeting reduction of space data costs toward $1/GB commoditizes orbital access for commercial enterprises.
        - >-
          Space data pricing elasticity is unproven; commercial SME demand may fail to absorb massive constellation
          capacity.
        - Commercial contract wins with non-traditional aerospace buyers in agriculture, climate, and logistics.
      - - Capital & Infrastructure
        - >-
          Heavy syndicate of tier-one investors ($372M total raised) funds state-of-the-art Sofia Center and US
          facility.
        - >-
          Concurrently scaling multi-million capital projects in Sofia and the US drains cash reserves and strains
          engineering bandwidth.
        - Timely completion and commissioning of US manufacturing hub without capital calls or debt restructuring.
      - - Geopolitical Alignment
        - >-
          Positioned at the nexus of EU technological sovereignty and transatlantic defense supply chain
          re-industrialization.
        - >-
          Bifurcated regulatory regimes (ITAR / US export controls vs EU dual-use regulations) create operational and
          compliance friction.
        - Defense procurement contract awards from NATO / European Defense Agency / US DoD entities.
    notes: Contrasts structural investment drivers against key execution, market, and geopolitical counterarguments.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV010
      - CV011
      - CV014
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Probability
      - Core Operating Assumptions
      - Implied Valuation Range
      - Key Risks & Downside Triggers
    rows:
      - - Bull Case
        - 25%
        - >-
          2026 revenue reaches $80M+ and accelerates to $250M+ by 2028; FRAME Max commands market leadership in
          broadband and defense constellations; US plant ramps rapidly.
        - $2.2B–$2.5B (8.8x–10.0x 2028E revenue)
        - Supply chain bottlenecks for space-grade rad-hard semiconductors; launch manifest delays.
      - - Base Case
        - 50%
        - >-
          2026 revenue doubles to ~$75M; scales steadily to $165M by 2028; healthy CubeSat and smallsat demand; multiple
          compresses to 7.0x–7.5x revenue upon normalization.
        - $1.15B–$1.25B (7.0x–7.5x 2028E revenue)
        - Gross margin compression during US facility ramp; customer delay in satellite constellation deployment.
      - - Bear Case
        - 25%
        - >-
          Revenue growth decelerates to $50M in 2026 and $85M by 2028; US facility suffers cost overruns and regulatory
          delays; multiple de-rates to 3.5x–4.5x revenue.
        - $300M–$380M (3.5x–4.5x 2028E revenue)
        - Severe cash burn necessitating down-round recapitalization; loss of key constellation anchor customer.
    notes: >-
      Scenario modeling assumes 2025 revenue baseline of €34M–€35M (~$38M) and projected enterprise value multiples
      across distinct operating trajectories.
    claimRefs:
      - CV007
      - CV008
      - CV012
      - CV013
      - CV014
