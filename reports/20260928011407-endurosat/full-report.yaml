      - number: '5.2'
        title: Cableless FRAME Architecture and High-Performance In-Orbit Compute
        blocks:
          - type: paragraph
            body: >-
              The core engineering innovation of EnduroSat's spacecraft platform is its patented modular cableless bus
              architecture. By removing traditional internal wiring harnesses in favor of direct blind-mate
              board-to-board connectors and standardized structural backplanes, EnduroSat enables a single technician to
              mechanically assemble, integrate, and functionally test an ESPA-class bus in approximately eight hours.
              This modularity extends into demanding on-orbit edge computing workflows through partnerships such as the
              Titan mission with Aethero, which deploys containerized Kubernetes compute clusters aboard the FRAME-15
              platform. The system leverages NVIDIA Thor-based silicon delivering up to 16,000 TFLOPS of orbital
              compute, protected by radiation-hardening-by-system-design software scrubbing and error correction
              mechanisms to circumvent ground downlink bottlenecks.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
