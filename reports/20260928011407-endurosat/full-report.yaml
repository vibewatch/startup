chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Model, and Scale
        blocks:
          - type: paragraph
            body: >-
              EnduroSat was founded in 2015 in Sofia, Bulgaria, by space entrepreneur Raycho Raychev, operating under
              the primary corporate entity Endurosat EAD. The company has evolved from developing modular CubeSat
              avionics into manufacturing standardized microsatellite platforms and delivering end-to-end constellation
              missions. Under its fixed-cost space-as-a-service model, EnduroSat handles payload integration, launch
              coordination, and on-orbit operations, cutting typical constellation deployment cycles down to
              approximately six months. The business serves commercial and institutional customers across seven
              international locations, employing more than 350 space professionals. By late 2026, EnduroSat reported
              cumulative flight heritage exceeding 100 satellites launched to orbit and more than 200 spacecraft
              delivered globally. Financial disclosures indicate rapid top-line expansion, with preliminary 2025 revenue
              reaching €34 million to €35 million, representing greater than 55% annual growth, while independent
              intelligence analysts emphasize that private sector operational metrics require ongoing verification
              against audited statements.
            claimRefs:
              - CO001
              - CO002
              - CO008
              - CO009
              - CO010
              - CO014
          - type: table
