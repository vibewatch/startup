      - number: '5.4'
        title: Quality Controls, RF Encryption, and Supply Chain Governance
        blocks:
          - type: paragraph
            body: >-
              Operational integrity across EnduroSat's manufacturing operations and on-orbit assets relies on strict
              digital security protocols and formal supply chain governance. Spacecraft telemetry and command channels
              incorporate multi-layer encryption, including hardware-accelerated AES-128 cryptographic ciphers over
              radio frequency links and encrypted cloud object storage pipelines. To support defense and institutional
              satellite programs, EnduroSat enforces a comprehensive Supplier Code of Conduct mandating anti-counterfeit
              component verification, traceability of critical electronic parts, and adherence to EU dual-use export
              regulations and U.S. ITAR and EAR requirements. These controls mitigate critical operational
              vulnerabilities associated with commercial-off-the-shelf component degradation in harsh space
              environments.
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Standardized Modular Bus Assembly and Rapid Integration
            body: >-
              EnduroSat's patented cableless FRAME bus architecture replaces bespoke wiring harnesses with modular
              mechanical and electrical interconnects, enabling a single technician to complete assembly and functional
              testing in eight hours. Combined with the SPS-1 interface protocol that auto-generates driver code, this
              architecture compresses integration timelines from months to days.
            calloutType: strength
            claimRefs:
              - CE006
              - CE007
          - type: callout
            title: On-Orbit Processing Power Budgets and Downlink Bandwidth Limits
            body: >-
              While Kubernetes-clustered edge computing aboard the FRAME-15 platform provides up to 16,000 TFLOPS of
              compute capability, operations remain constrained by a 3.4 kW peak power envelope, space thermal
              dissipation limits, and ground station downlink scheduling availability. Deploying continuous real-time AI
              inference at scale requires verified duty-cycle margins.
            calloutType: risk
            claimRefs:
              - CE008
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation, Buyer Personas, and Commercial Channel Dynamics
        blocks:
          - type: paragraph
            body: >-
              EnduroSat's commercial customer base spans three core buyer categories: commercial Earth observation and
              telecommunication constellation operators, academic and scientific institutions, and sovereign or
              defense-related agencies. Commercial operators contract for serialized microsatellite buses—ranging from
              200 kg microsatellites to larger 5-ton ESPA-class platforms—and hosted payload capacity under a
              standardized constellation-as-a-service model. Scientific researchers and universities typically procure
              modular CubeSat buses and subsystem components including power modules, UHF/X-band communications
              hardware, and onboard computers. While EnduroSat publicizes relationships with more than 450 customers
              globally, commercial sales cycles for satellite platforms are direct, complex, and multi-month, requiring
              specialized technical business development personnel across key aerospace corridors such as Washington, DC
              and Denver, Colorado. In defense-adjacent and sovereign markets, procurement is characterized by rigid
              security standards, domestic content mandates, and extended RFP evaluation timelines, creating high
              switching costs once flight hardware is integrated but slowing initial customer acquisition.
            claimRefs:
              - CU001
              - CU002
