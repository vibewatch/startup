        title: 管理团队、公司治理与供应链合规
        blocks:
          - type: paragraph
            body: >-
              创始人兼首席执行官 Raycho Raychev把握长期战略，并代表公司拓展主权客户与国际防务合作。首席技术官 Viktor Danchev负责工程架构、卫星航电设计和软件定义总线的模块化；项目总监 Vanya
              Buchova统筹任务执行与客户交付。国际顾问委员会还包括航天界资深人士：European Space Agency 前总干事 Johann-Dietrich Wörner 教授，以及 NASA Ames
              Research Center 前主任 S. Pete Worden 博士。公司战略和高端主权客户关系都与创始人紧密相连，因此关键人依赖度较高。为管控跨国防务供应链的运营与合规风险，EnduroSat
              以具有法律效力的《供应商行为准则》要求元器件供应商遵守反腐败和出口合规标准，并接受审计。
