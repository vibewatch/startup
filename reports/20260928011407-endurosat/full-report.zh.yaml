      - number: '2.3'
        title: 客户分群、采购机制与预算归属
        blocks:
          - type: paragraph
            body: >-
              标准化微小卫星平台的客户分为三类：商业星座运营商、防务与国家安全机构，以及科研院校。以 Vantor
              等对地观测企业为代表，商业星座运营商批量、重复采购，关注单星经济性、载荷灵活度和更短的入轨周期。北约成员国国防部门和美国国家安全机构优先考虑本土产业韧性、供应链透明度和严格的安全合规。大学及民用科研机构则采购模块化
              CubeSat 组件或共享的空间即服务任务，资金通常来自民用科研拨款。商业运营商的预算多由 CTO
              或航天系统副总裁掌握，他们用固定成本采购替代内部制造，以减少资本投入。政府防务采购则由采购跟踪办公室和军民两用创新项目推进，并要求符合西方防务标准。             
              各类买家最终都看重三点：飞行履历经验证、成本可预测、定制集成风险更低。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
