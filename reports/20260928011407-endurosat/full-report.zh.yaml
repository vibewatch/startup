  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 核心支柱
      - 正面投资逻辑
      - 反向论点
      - 催化剂 / 核心抉择
    rows:
      - - 制造与架构
        - 软件定义无电缆架构实现 8 小时组装单星，日产 2 颗 ESPA 级卫星。
        - 500 kg 至 5 吨航天器的大批量量产尚未验证；脱离 CubeSat 构型向上扩展将带来散热与可靠性风险。
        - 首批量产型 FRAME Max 完成在轨认证并通过客户验收。
      - - 成本与市场颠覆
        - 将太空数据成本压降至 $1/GB 的目标，推动商业企业进入轨道的门槛走向平民化。
        - 太空数据价格弹性尚未验证；商业中小企业需求可能难以消化庞大的星座运力。
        - 斩获来自农业、气候和物流等非传统航天客户的商业合同。
      - - 资本与基础设施
        - 一线投资机构组成的财团（累计融资 $372M）为索非亚中心和美国基地提供资金。
        - 索非亚和美国同时推进数百万规模的重资产项目，消耗现金储备并挤占工程资源。
        - 美国制造基地如期竣工投产，未发生追加注资或债务重组。
      - - 地缘政治契合度
        - 立足于欧盟科技主权与跨大西洋国防供应链再工业化的交汇点。
        - 双轨制监管体系（ITAR / 美国出口管制与欧盟两用物项法规）带来运营与合规摩擦。
        - 获得来自 NATO、欧洲防务署（EDA）及美国国防部（DoD）机构的防务采购合同。
    notes: 对比结构性投资驱动力与核心执行、市场及地缘政治反向论点。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV010
      - CV011
      - CV014
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 概率
      - 核心经营假设
      - 隐含估值区间
      - 核心风险与下行触发条件
    rows:
      - - 乐观情景
        - 25%
        - 2026 年收入达到 $80M+，到 2028 年加速升至 $250M+；FRAME Max 在宽带与国防星座确立市场领先地位；美国工厂产能快速爬坡。
        - $2.2B–$2.5B（8.8x–10.0x 2028E 收入）
        - 宇航级抗辐射半导体供应链瓶颈；发射排期延误。
      - - 基准情景
        - 50%
        - 2026 年收入翻番至 ~$75M；到 2028 年稳步扩大至 $165M；CubeSat 与小卫星需求健康；估值常态化后市销率压缩至 7.0x–7.5x 收入。
        - $1.15B–$1.25B（7.0x–7.5x 2028E 收入）
        - 美国基地产能爬坡期间毛利率承压；客户推迟卫星星座部署排期。
      - - 悲观情景
        - 25%
        - 收入增速放缓，2026 年为 $50M，到 2028 年为 $85M；美国基地遭遇成本超支与监管延误；估值倍数下调至 3.5x–4.5x 收入。
        - $300M–$380M（3.5x–4.5x 2028E 收入）
        - 现金消耗剧烈迫使发生降轮重组；失去核心星座锚定客户。
    notes: 情景建模以 2025 年收入 €34M–€35M（约 $38M）为基准，并按不同经营路径估算企业价值倍数。
    claimRefs:
      - CV007
      - CV008
      - CV012
      - CV013
      - CV014
