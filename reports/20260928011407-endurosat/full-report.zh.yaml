            title: 双区域制造扩张中的资本密集度与隐性交付成本
            body: 保加利亚基地拟投入逾 €100M，美国总装业务也在同步筹建；持续的固定成本需要足够多的高毛利合同支撑，否则现金消耗会迅速加剧。
            calloutType: risk
