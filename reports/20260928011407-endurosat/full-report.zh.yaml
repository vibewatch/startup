      - number: '2.4'
        title: 监管壁垒、产能扩张制约与市场瓶颈
        blocks:
          - type: paragraph
            body: >-
              尽管量产微小卫星的市场需求快速增长，商业落地仍面临严峻的结构性壁垒，尤以严苛的出口管制法规和军民两用合规标准最为突出。卫星平台集成了高性能通信子系统、抗辐射航电及高精度姿态确定与控制系统（ADCS），促使制造企业及其供应链必须严格遵循欧盟《军民两用物项条例》（EU
              Dual-Use Regulation
              2021/821）、欧盟《共同军事管制清单》、美国《出口管理条例》（EAR）以及《国际武器贸易条例》（ITAR）。任何出口许可的拒批、中止或合规调查，都可能构成导致国际交付停滞的实质性运营风险。此外，微小卫星赛道资本密集度极高，严重受制于外部运载火箭发射档期，且面临
              AAC Clyde Space、Open Cosmos 和 Aerospacelab 等欧洲本土对手日益激烈的竞争。现有二级数据集只披露公司融资，未公布全球卫星平台各细分领域完整的可寻址支出，因此独立机构对
              TAM/SAM/SOM 市场预测的第三方验证依然匮乏。
            claimRefs:
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 支撑材料
        blocks:
          - type: callout
            title: 军民两用监管与出口许可瓶颈
            body: >-
              卫星平台集成了军民两用航电与敏感通信子系统，EnduroSat 的全球市场扩张严格取决于其对欧盟 Dual-Use Regulation 2021/821、美国 EAR 和 ITAR
              监管框架的合规性。在保加利亚与美国建立双区域制造基地虽是满足本土防务采购比例的必要举措，但也使运营面临繁杂的跨境监管审查与潜在的出口拒批风险。
            calloutType: risk
            claimRefs:
              - CM014
              - CM015
          - type: callout
            title: 商业星座扩张与规模化制造经济性
            body: 商业卫星产业正从定制工程航天器快速转向高频量产制造。斩获 24 颗卫星平台的 Vantor 合同表明，只要供应商具备经过飞行验证的可靠履历、敏捷交付节奏与模块化载荷接口，商业星座构建者愿将整套卫星平台完全外包。
            calloutType: insight
            claimRefs:
              - CM005
              - CM006
              - CM010
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与架构细分
        blocks:
          - type: paragraph
            body: >-
              微小卫星生态正经历结构性转变，由手工作坊式的单次航天器集成，走向针对分布式低轨（pLEO）星座设计的标准化、批量制造卫星平台。在这一市场中，EnduroSat
              面临三类迥异的竞争阵营：微小卫星平台与纳米卫星任务直接集成商、专业子系统与元器件目录供应商，以及传统大型航天总包商。NanoAvionics 和 AAC Clyde Space
              等直接竞对制造面向商业和科研星座的标准化 CubeSat 与微卫星平台。商业市场名录与情报平台同时追踪周边服务商，如开展大气研究的 ALE、提供在轨服务及轨道转移飞行器的 D-Orbit
              Portugal，以及运营专用成像与态势感知星座的 EarthDaily Federal 或 NorthStar Earth & Space Systems。EnduroSat 的差异化策略在于构建横跨
              CubeSat 到重型 ESPA 级平台的完整标准化产品矩阵（200 kg 级的 FRAME S、500 kg 级的 FRAME L，以及 1 至 5 吨级的 FRAME
              MAX），覆盖以往迫使客户在不同平台厂商间频繁更换的技术级别。
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP010
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP010
      - number: '3.2'
        title: 小型卫星直接竞对与子系统替代方案
        blocks:
          - type: paragraph
            body: >-
              与运营同业比较，可以看到各家的垂直整合路线并不相同。总部位于立陶宛的 NanoAvionics 等欧洲集成商专注于一站式纳米卫星和微卫星平台集成，在 100 kg 以下 CubeSat
              领域拥有深厚飞行履历。AAC Clyde Space（业务分布于瑞典、英国，并通过 AAC SpaceQuest
              布局美国）提供模块化子系统、微卫星平台以及一站式空间即服务数据解决方案。相反，ISISPACE、CubeSatShop 和 Pumpkin Space Systems
              等目录供应商提供现货元器件、太阳能电池帆板及结构套件，面向自主组装航天器的客户群。GetLatka 将 EnduroSat 归类为年收入 $93.8M、员工 209 人的航天科技企业，并指出纯 SaaS
              替代方案尚未见诸公开，原因在于小型卫星厂商主要依托捆绑任务运营的硬件制造合同运转。EnduroSat 自研星载飞行计算机、通信模块和电源单元，让 EnduroSat
              能留住按单装配型集成商通常交给第三方供应商的航电利润。
            claimRefs:
              - CP002
              - CP003
              - CP006
              - CP013
