    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业架构、运营模式与业务体量
        blocks:
          - type: paragraph
            body: >-
              航天创业者 Raycho Raychev 于 2015 年在保加利亚索非亚创立 EnduroSat，公司的主要运营实体是 Endurosat EAD。公司起步于模块化 CubeSat
              航电研发，如今已制造标准化微卫星平台，并承接端到端星座任务。固定成本的空间即服务模式涵盖载荷集成、发射协调和在轨运营，将典型星座部署周期压至约 6 个月。EnduroSat               在全球 7
              个地点为商业与机构客户提供服务，员工超过 350 人。截至 2026 年底，公司称累计已有 100 多颗卫星发射入轨，向全球交付 200 多个航天器。初步披露显示，2025 年收入为 €34M 至
              €35M，年增幅超过 55%；独立情报分析师则提醒，非上市公司的运营指标仍须对照经审计报表持续核实。
