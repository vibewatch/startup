  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类界定与覆盖开支
        blocks:
          - type: paragraph
            body: >-
              小型卫星市场正经历结构性范式演进，由定制化、手工作坊式实验卫星转向标准化、软件定义卫星平台以及一体化星座即服务（constellation-as-a-service）。EnduroSat 横跨两大业务层面：涵盖
              CubeSat 至数吨级平台的标准化模块化航天器硬件，以及交钥匙在轨部署服务。其目标市场覆盖商业卫星平台采购、航电子系统（电源管理、星载计算机、S 频段与 X
              频段通信模块及太阳能电池帆板）、有效载荷集成工程、发射中介代理以及日常地面站测控运营。相对地，地面用户终端、下游地理空间数据分析、造价数十亿美元的高轨国家安全定制侦察卫星以及深空科学探测平台均排除在开支边界之外。传统商业卫星项目中，客户面临零散采购各家元器件的痛点，导致工程集成周期漫长且资本开支难以把控。EnduroSat
              的标准化平台模式将硬件与飞行运营打包为固定总价合同，将任务周期从数年规划压缩至宣称的 6 个月内完成「从方案概念到入轨发射」。然而，这种定位迫使 EnduroSat
              既要直面传统一级航天总包商的竞争，又要迎战一众加速推进规模化量产的欧美风投支持微小卫星制造商。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 市场规模边界、增长驱动力与测算空白
        blocks:
          - type: paragraph
            body: >-
              经核实的资料中，没有一线机构针对 EnduroSat 可服务细分市场给出独立 TAM、SAM、SOM 测算；市场规模只能从已披露合同和工厂产能侧面判断。2026 年 9 月，EnduroSat 获得 Vantor
              的重要商业合同，将为其规划中的 Pulse 对地观测星座制造 24 颗标准化卫星平台，证明商业成像星座已有实际需求。为满足这类需求及预期的防务任务，EnduroSat 扩充制造能力，并启用保加利亚索非亚一座
              17,500 平方米的工厂；该厂设计稳态产能为每天两颗 ESPA 级卫星（发射质量 200 kg 至 500 kg）。公司还在 2026 年 9 月完成 $205M Series B
              融资，用于建设美国装配厂，并在索非亚附近的 Dobroslavtsi
              前军事机场建设航天与防务研发中心。增长动力包括欧盟和北约推动的欧洲战略自主、商业对地观测扩张，以及防务机构转向更具韧性的分布式近地轨道（pLEO）架构。尽管需求驱动明确，现有资料仍缺少独立航天分析报告，自上而下的整体市场规模测算尚无定论。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
