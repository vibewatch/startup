      - number: '4.2'
        title: 定价架构、商业变现动态与交付履约成本
        blocks:
          - type: paragraph
            body: >-
              EnduroSat 的定价分为两类：标准子系统公开目录价，和私下协商的星座合同。现货 CubeSat 硬件按目录价销售，购买时附带技术导入支持；根据模块复杂度，工程支持为 1 至 10 小时。企业级星座项目和
              ESPA 平台则采用按里程碑结算的非公开固定价合同。固定价服务让客户更容易控制采购预算，但项目交付、零部件涨价和第三方发射价格波动都会增加 EnduroSat 的成本和履约风险。
              发射费用和商业地面站网络费是大额转付成本（pass-through expenses）；若不把服务费与第三方物流成本拆开，合同总额会高估净收入留存。
