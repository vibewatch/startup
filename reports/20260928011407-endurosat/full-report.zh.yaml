            body: >-
              EnduroSat 采用「先切入、再扩张」（land-and-expand）的路径：客户先买单个航电模块或参加单星共享任务，之后可能转向专属多星合同。公司已发射 100 多颗卫星、交付 200
              多个航天器，并部署超过 5,000 个子系统模块；披露的 2025 年收入为 €34M 至 €35M。尽管交付规模扩大，客户留存仍有结构性风险。EnduroSat
              没有披露经审计的净收入留存率（NRR）、总收入留存率（GRR）、客户流失率或平均合同价值（ACV）。若失去 Vantor
              这类关键星座客户，或其项目取消，收入可能受到明显冲击。大型防务总包商还会通过供应商准则施加严格的合规、审计和反腐要求，增加履约成本；平台交付延误也可能招致罚款。
