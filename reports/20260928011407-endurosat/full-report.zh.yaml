            body: >-
              EnduroSat 2025 年初步收入达到 €34mn–€35mn，较 2024 年增长逾 55%；管理层预计 2026 年收入翻倍。收入增长背后是持续的机构融资：自 2015 年以来，公司完成 13
              轮融资，累计披露金额约 $372M。2025 年 10 月，公司完成 $104M Series B 融资；这轮资金用于启用 188,340 平方英尺的 Sofia Space Center。2026 年 9
              月，EnduroSat 又获得 Riot Ventures 与 Atreides Management 领投的 $205M。这笔最新股权注资直接用于推进庞大的资本开支承诺，包括拟投入逾 €100M
              在索非亚附近建设航天防务中心，以及启动计划于 2027 年底投产的美国制造基地的早期工程建设。早期员工期权流动性已定期通过 EquityZen 等老股转让平台兑现，一级市场投后估值仍未公开。
