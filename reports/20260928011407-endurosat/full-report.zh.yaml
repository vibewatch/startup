      - number: '3.4'
        title: 护城河持久度、防务准入与同质化风险
        blocks:
          - type: paragraph
            body: >-
              2026 年 9 月完成的 $205M Series B 轮融资，以及为 Vantor 规划的 Pulse 对地观测星座建造 24 颗标准化卫星平台的商业合同，大幅验证了 EnduroSat
              的竞争地位。然而，维系长期护城河仍须突破防务准入门槛并应对传统巨头的竞争。军方和情报机构日益青睐标准化商业平台，以缩短部署周期、降低成本；但美国 Department of War 和 Space Force
              的采购项目对本土制造比例和设施安全许可有严格要求。EnduroSat 承诺在 2027               年底前投产美国总装厂，正是满足上述准入条件的重资产投入。与此同时，向 500 kg 至 5
              吨级平台扩展使 EnduroSat 直接面对 Lockheed Martin、 Northrop Grumman
              等传统航天防务巨头；这些公司游说资源深厚，也能参与涉密项目。全球贸易管制和供应商合规要求还会持续增加管理负担。
            claimRefs:
