  - number: 4
    title: 财务表现
    sections:
      - number: '4.1'
        title: 商业营收模式、服务封装与市场拓展（GTM）机制
        blocks:
          - type: paragraph
            body: >-
              EnduroSat 的收入来自两类业务：标准化航天硬件制造，以及交钥匙空间即服务任务运营。硬件产品涵盖 1U 至 16U 模块化 CubeSat 子系统（如通信模块、天线和星载计算机），也包括 FRAME
              S（200 kg）、FRAME L（500 kg）和 FRAME MAX（最高 5,000 kg）等 ESPA 级卫星平台。端到端星座服务则按固定成本打包，涵盖任务设计、载荷集成、发射采购和在轨运营。两条业务线让
              EnduroSat 既能向高校和科研客户销售单个组件，也能争取商业与防务运营商的多星合同。为 Vantor 旗下 Pulse 对地观测星座制造 24 颗平台的合同，显示业务正从定制单星装配转向可重复的批量生产。
