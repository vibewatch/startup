      - number: '3.3'
        title: 能力矩阵、定价模式与客户切换阻力
        blocks:
          - type: paragraph
            body: >-
              小卫星客户采购时主要比较载荷空间、交付周期、飞行履历和任务总成本。EnduroSat 宣称，标准化卫星平台可在 6 个月内从概念走到入轨，设计寿命为 7 年。相比之下，传统主承包商的定制集成通常需要 18 至
              36 个月的非经常性工程（NRE）。元器件目录供应商公开标准化 CubeSat 结构件和无线电设备的单件价格；星座级平台则多通过非公开主服务协议谈判，并附带批量折扣。载荷与平台的电气接口、飞行软件 API
              和机械适配器认证都会抬高切换成本。星座运营商若在 EnduroSat、NanoAvionics 和 AAC Clyde Space
              的平台间迁移载荷，还要承担软件重构和重新认证费用；首个示范任务成功后，转换供应商并不容易。
            claimRefs:
              - CP005
              - CP006
              - CP013
              - CP014
