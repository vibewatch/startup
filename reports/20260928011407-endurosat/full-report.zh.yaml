      - number: '6.4'
        title: 支撑材料
        blocks:
          - type: callout
            title: 批量星座签约对平台能力的实战背书
            body: 赢得 Vantor 24 颗卫星平台的订单，标志着 EnduroSat 成功跨越从单体 CubeSat 模块销售向为商业星座运营商批量化供应完整星群的战略转型。
            calloutType: strength
            claimRefs:
              - CU002
              - CU012
