      - number: '4.4'
        title: 财务尽调结论、资本密集度与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              从投资判断看，EnduroSat 已有实际商业进展，也能获得跨大西洋风投支持；但关键运营指标仍不透明。独立航天分析师指出，公开资料很少能核实实际毛利率、现金转化效率和净运营现金消耗（burn
              rate）。保加利亚和美国两地扩产，既增加执行难度，也带来沉重固定成本；若星座部署遇到发射延期或客户流失，现金储备可能很快承压。公司未公开单机贡献利润或 GAAP
              利润表，外部投资者因此无法判断星座即服务能否带来类似软件的可持续现金流，还是仍属于营运资金占用高的硬件组装业务。评估机构估值前，必须先弄清这些单机经济性（unit economics）。
            claimRefs:
              - CI011
              - CI014
              - CI015
