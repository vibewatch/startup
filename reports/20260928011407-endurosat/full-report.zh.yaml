      - number: '1.3'
        title: 融资历史、财团构成与估值走势
        blocks:
          - type: paragraph
            body: >-
              EnduroSat 的融资从东欧本土种子资金，扩展到跨大西洋的头部风投和机构投资。早期投资方 Neo Ventures 于 2017 年投入 €1M；随着全球风投进入，公司股权结构逐渐国际化，Neo
              Ventures 于 2025 年退出，回报达到 7 倍。2026 年 9 月，EnduroSat 完成 $205M Series B 融资，由美国风投 Riot Ventures 和 Atreides
              Management 共同领投，Founders Fund、Google Ventures、Lux Capital、Omnes Capital 及 European Innovation Council Fund
              参投。公司发言人称，投后估值远超 $1B，使其成为保加利亚第二家科技独角兽；官方投前估值和条款细节仍未公开。二级数据平台估算，公司此前五轮融资累计约 $273.7M；近期财经媒体则称，过去 16 个月融资接近
              $350M。两组数据差距不小，仍需核对经审计的出资明细。
            claimRefs:
