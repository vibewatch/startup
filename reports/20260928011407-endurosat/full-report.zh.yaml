        title: 支撑材料
        blocks:
          - type: callout
            title: 标准化硬件与定制星座财务模型的本质差异
            body: 模块化 CubeSat 元器件有可预测的目录毛利和较快的库存周转；数百万美元级 ESPA 星座订单则需要大量定制载荷工程，并会因里程碑付款占用营运资金，收入质量因此不同。
