      - 评估结论 / 取值
      - 核心依据
      - 投资含义
    rows:
      - - 投资建议
        - 观察
        - 26x–27x 历史收入倍数已隐含索非亚和美国两地扩张顺利推进
        - 在批量生产单位经济模型与美国扩张完成去风险化之前，暂不做出成长期资本投资承诺。
      - - 置信度
        - 中
        - 已确认 Series C 轮融资（$205M）与独角兽地位；但缺少经审计的 EBITDA 与股权结构表细节
        - 公开信息足以支持机构投资者初步判断；仍需进入数据室核实。
      - - 风险评级
        - 高
        - 资本开支强度大、跨两大洲基地建厂投入高、客户集中度高，且面临航天硬件执行风险
        - 需争取严格的下行保护、清算优先权，以及与里程碑挂钩的分期出资。
      - - 估值态度
        - 偏高
        - 投后估值 >$1B，较公开市场航天可比公司（3x–10x 收入）存在激进溢价
        - 入场纪律要求争取估值折扣、采用可转债结构，或等待公司收入规模追赶上来。
