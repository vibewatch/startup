      - number: '1.4'
        title: 战略里程碑、防务融合与产能扩张
        blocks:
          - type: paragraph
            body: >-
              EnduroSat 正从 CubeSat 拓展到更大型航天器，并切入军民两用防务基础设施。公司 2016 年开始研发 CubeSat 模块，2018 年首次发射入轨，之后通过 FRAME 产品线进入 ESPA
              级卫星市场。2026 年 8 月，公司与保加利亚政府签署谅解备忘录，拟将 Dobroslavtsi 一处 300 万平方米的前军事机场改建为航天与防务产业中心。2026 年 9
              月融资的一项明确用途，是在美国建设高产能卫星装配厂，并配合欧洲设施扩产，以满足美国国家安全采购的本土制造要求。EnduroSat 同期还获得 Vantor 对地观测星座的合同，将制造 24
              颗标准化卫星平台；这显示商业和政府客户正在采用其批量化、软件定义的微卫星架构。
