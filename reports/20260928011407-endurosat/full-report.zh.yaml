            title: 客户集中度偏高与留存数据披露空白
            body: EnduroSat 未公开队列留存、NRR 或流失率数据。核心营收重度依赖 Vantor 等高价值锚定合同，一旦发生合同取消或发射拖延，将引发剧烈的收入波动。
            calloutType: risk
            claimRefs:
              - CU002
