evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: leadership-enumeration-boundary
    missingEvidence: >-
      Complete biographical registry and employment contract terms for non-executive directors and mid-level engineering
      functional leads.
    whyItMatters: Ensures full assessment of key-person dependencies beyond top three named corporate officers.
    diligencePath: >-
      Request comprehensive organizational chart and key-person life insurance documentation during formal management
      presentation.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-map-coverage
    missingEvidence: >-
      Exact cap table ownership percentages, liquidation preferences, and secondary transaction share transfers for all
      minority shareholders.
    whyItMatters: >-
      Clarifies voting control thresholds, drag-along rights, and dilution impact across Series A and B investor
      syndicates.
    diligencePath: Review certified cap table and voting agreement exhibits in company data room.
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: minor
    topic: funding-discrepancy
    missingEvidence: >-
      Certified bank statements or formal equity funding ledger reconciling the $273.7 million secondary aggregator
      figure with press reports of $350 million.
    whyItMatters: Accurate total capital raised is necessary to calculate true capital efficiency and cumulative dilution.
    diligencePath: Request audited schedule of capital contributions and share premium reserve from company auditors.
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Independent top-down analyst market sizing reports quantifying global smallsat bus TAM, SAM, and SOM figures with
      verified CAGR projections.
    whyItMatters: >-
      Without third-party TAM/SAM figures, market sizing relies primarily on supply-side factory throughput and single
      customer contract announcements.
    diligencePath: >-
      Procure specialized aerospace market research reports (e.g., Euroconsult / Novaspace, BryceTech) detailing
      smallsat manufacturing and constellation spend.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: switching-costs-and-multihoming
    missingEvidence: >-
      Proprietary telemetry bus interface documentation, mechanical bolt-hole payload adapter tolerances, and switching
      cost data when migrating payload sensors from EnduroSat to NanoAvionics or AAC Clyde Space.
    whyItMatters: >-
      Constellation developers face substantial re-engineering costs if payload mechanical and electrical interfaces are
      non-standardized, influencing multi-homing capability.
    diligencePath: >-
      Review Payload User Guides and interface control documents (ICDs) under NDA for FRAME S/L/MAX against standard
      CubeSat and ESPA adapter specifications.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP002
      - TP003
  - type: missing-source
    severity: minor
    topic: realized-contract-pricing
    missingEvidence: >-
      Firm-fixed-price versus cost-plus breakdown and realized volume discount schedules for 20+ bus constellation
      orders such as the Vantor Pulse contract.
    whyItMatters: >-
      Catalog prices for subsystems provide only an upper bound on unit economics; constellation profitability depends
      heavily on undisclosed volume-discounted bus airframe margins.
    diligencePath: >-
      Conduct customer reference interviews with commercial constellation operators and procurement officers regarding
      realized per-unit bus pricing.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: unit-economics-and-margins
    missingEvidence: >-
      Audited GAAP/IFRS financial statements detailing gross margins across hardware vs. service segments, customer
      acquisition costs, and net monthly operational cash burn.
    whyItMatters: >-
      Without segmented gross margins and operating cash flow disclosures, underwriters cannot verify whether
      constellation-as-a-service achieves software-like profitability or remains a capital-intensive hardware assembly
      model.
    diligencePath: >-
      Request historical audited income statements, segment-level contribution margin schedules, and current 24-month
      cash flow projections under NDA during management diligence.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public developer metrics such as open-source code repositories, SDK download statistics, or practitioner API
      community logs.
    whyItMatters: >-
      Assessing practitioner adoption and software customization friction outside formal proprietary enterprise
      channels.
    diligencePath: >-
      Request EnduroSat customer portal documentation, developer SDK access metrics, and API client activity reports
      during diligence.
    relatedQuestionRefs:
      - QE009
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: >-
      Audited customer cohort retention data, Gross Revenue Retention, and Net Revenue Retention percentages across
      satellite bus and service accounts.
    whyItMatters: >-
