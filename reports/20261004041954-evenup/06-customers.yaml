company:
  name: "EvenUp"
chapter:
  number: 6
  title: "Customers"
  summary: "EvenUp claims commercial adoption across more than 2,000 personal injury law firms—including roughly 20% of the top 100 U.S. plaintiff firms—anchored on high-volume demand letter generation and medical chronology preparation. However, the company publishes no audited net revenue retention (NRR), gross churn, cohort durability, or customer concentration metrics, while commercial exposure to contingency-fee volatility and contested human-in-the-loop review overhead create material diligence gaps."
sections:
  - id: "customer-segmentation-and-profile"
    title: "Customer Segmentation and Buyer-User Dynamics"
    body: "EvenUp's commercial customer base is strictly concentrated within plaintiff-side personal injury law firms, spanning solo practitioners, regional high-volume settlement mills, and national trial practices. Within these firms, purchasing decisions are driven by managing litigation partners seeking to eliminate pre-litigation drafting bottlenecks, while daily users comprise paralegals, legal assistants, and junior associates who upload raw case files and review generated demands. Case costs in contingency litigation are typically advanced by the law firm and deducted from final claimant settlements, meaning case-based software fees directly impact firm operating capital and claimant net recovery. Strategic alliances with enterprise legal tech vendors like LexisNexis and integration with case management software (CMS) platforms such as Litify, SmartAdvocate, and CASEpeer serve as critical procurement distribution channels across mid-market and enterprise law practices."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-usage-scale"
    title: "Adoption Trajectory and Production Casework Velocity"
    body: "EvenUp's reported platform throughput has expanded from early self-service demand drafting into a platform processing an estimated 10,000 cases weekly as of late 2025. Across its marketing surfaces, the company reports over 200,000 total cases resolved and more than $10 billion in claimed damages across its customer base. Platform engagement centers on pre-litigation settlement demand packages and medical summaries, where EvenUp claims its drafting tools reduce attorney desk time by up to 75% and increase settlement demand throughput without commensurate staff expansion. Nevertheless, published metrics reflect cumulative marketing milestones rather than standardized SaaS activity metrics, leaving active monthly user counts, utilization rates per firm, and exact case completion distributions undisclosed."
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "named-deployments-and-customer-proof"
    title: "Named Customer Deployments and Case Study Outcomes"
    body: "Public customer endorsements for EvenUp highlight substantial operational acceleration, though available proof remains dominated by vendor-curated summit presentations and marketing case studies. Prominent named firms including Omega Law Group, Batta Fulkerson, McCready Law Injury Attorneys, and John K. Zaid and Associates report measurable operational benefits, such as saving thousands of staff hours, cutting demand turnaround times, and accelerating pre-litigation negotiations. However, independent software evaluations indicate that reported outcome benchmarks—such as demands being 69% more likely to hit policy limits—originate from vendor marketing materials that lack published empirical baselines, comparison groups, or jurisdictional controls. Additionally, third-party reporting indicates that EvenUp's operational model relies heavily on human quality-assurance review teams, meaning software automation claims must be evaluated alongside labor-intensive workflow requirements."
    claimRefs:
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU012"
    tableRefs:
      - "TU003"
  - id: "durability-expansion-and-concentration-risks"
    title: "Retention Durability, Procurement Friction, and Concentration Exposure"
    body: "EvenUp's long-term customer economics face distinct structural headwinds related to pricing mechanics, switching costs, and regulatory scrutiny. The platform charges on a per-case consumption model rather than seat-based licensing, making firm-level spend highly sensitive to macroeconomic litigation volumes, intake swings, and settlement velocity. Because EvenUp does not act as a primary medical record retriever and requires complete case files to function, operational bottlenecks upstream—such as missing medical authorizations or slow healthcare provider responses—can stall demand generation and degrade perceived ROI. Crucially, EvenUp has not disclosed audited retention metrics, annual churn rates, or net revenue retention figures by cohort, leaving open questions regarding whether law firms retain the software across fluctuating litigation cycles or face customer concentration among a handful of advertising-heavy personal injury firms."
    claimRefs:
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"
callouts:
  - calloutType: "insight"
    title: "Case-Based Pricing and Contingency Practice Economics"
    body: "Unlike standard B2B enterprise SaaS that charges predictable per-seat monthly subscriptions, EvenUp's case-based pricing structure aligns vendor revenue with customer caseload velocity. For personal injury firms operating on contingency fees, software expenses associated with demand preparation are either absorbed as practice overhead or charged as client case costs. When case volume contracts or upstream medical record retrieval stalls, software spend fluctuates, creating revenue volatility that cannot be modeled as steady recurring subscription income."
    claimRefs:
      - "CU003"
      - "CU014"
  - calloutType: "risk"
    title: "Dependence on Manual Human-in-the-Loop Review Infrastructure"
    body: "Third-party reporting and comparative legal tech analyses highlight that EvenUp pairs its generative AI models with extensive internal human quality-assurance reviewers to maintain citation fidelity and prevent hallucinations. If labor-intensive manual review remains necessary to verify complex medical chronologies and policy-limit demands, customer unit economics and platform gross margins will fail to achieve pure software scalability as caseload expands."
    claimRefs:
      - "CU012"
      - "CU016"
