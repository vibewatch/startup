companyProfile:
  summary: >-
    EvenUp is a private, disclosed legal AI platform built for plaintiff-side personal injury law firms. It combines
    demand drafting, medical chronology, case analysis, and pre-litigation workflow tools, and its public traction story
    centers on 2,000+ customer firms, 20% penetration of the Top 100 U.S. personal injury firms, and a $150 million
    Series E that lifted valuation above $2 billion. The open diligence questions are whether that scale converts into
    audited software margins, durable retention, and transparent governance rights.
