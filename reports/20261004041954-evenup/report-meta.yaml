  topStrengths:
    - Category-leading adoption in plaintiff-side personal injury law firms, with 2,000+ firms and Top 100 penetration.
    - Clear workflow automation across demands, medical chronologies, and case intelligence.
    - Deep investor backing and a completed $150 million Series E.
  topRisks:
    - Audited ARR, gross margin, retention, and cash/runway disclosures are still missing.
    - Human-in-the-loop review and upstream record-retrieval dependency may cap software-like margins.
    - Governance rights, liquidation preferences, and regulatory/privacy exposure remain opaque.
  unresolvedGaps:
    - Audited ARR, revenue growth, gross margin, and retention metrics for software versus professional-review delivery.
    - Unit economics of professional-review and case-based pricing, including revenue per case and staffing ratios.
    - Customer retention, churn, and concentration by cohort.
    - Governance and investor-rights details, including liquidation preferences and strategic rights for RELX/REV.
    - Exact headcount, cash balance, burn, and runway after the October 2025 Series E.
disclaimer: This report uses public and prefetched evidence only; private operating metrics remain undisclosed.
