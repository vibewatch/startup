  - id: FU001
    title: EvenUp 人身伤害客户案件处理旅程图
    type: journey-map
    summary: 展示律所工作流阶段、用户触点及 EvenUp 平台各环节的摩擦点。
    data:
      items:
        - label: 案件接收与记录整理
          phase: 平台使用前
          touchpoints:
            - 原告客户接收与伤情问卷
            - 获取第三方医疗记录和警方报告
            - 将原始案件文件上传至案件管理系统
          friction: EvenUp does not retrieve records; missing medical records or authorizations delay workflow
        - label: 文档摄取与医疗时间线
          phase: 数据提取
          touchpoints:
            - AI 提取治疗日期、医疗服务提供者和 ICD 诊断代码
            - 自动生成互动式护理时间线
            - 识别治疗间断和既有病症
          friction: Complex medical files require internal human-in-the-loop QA review
        - label: 和解需求函起草
          phase: 核心自动化
          touchpoints:
            - AI Drafts Suite 生成符合司法辖区要求的需求函
            - Settlement Repository 将案件与历史判决可比案例匹配
            - Express Demands 或经法律审阅的草稿发送至律师收件箱
          friction: Attorneys carry mandatory ethical review duty before sending demands to insurers
        - label: 律师审阅与伦理签核
          phase: 质量保证
          touchpoints:
            - 负责律师对照来源记录核验医疗时间线
            - 诉讼律师根据当地司法辖区实践检查拟议估值
            - 律所用律所抬头信纸批准最终需求材料包
          friction: Attorneys carry non-delegable ethical duty for machine-generated legal advocacy
        - label: 谈判与管理层分析
          phase: 和解
          touchpoints:
            - Case Companion AI 在与理赔员谈判时协助律师
            - Executive Analytics 跟踪和解速度及办公时间节省
            - 律所将案件解决结果与历史保单限额比较
          friction: Case-based fees deducted from case proceeds; sensitive to litigation volume swings
        - label: 账户扩张与案件量扩容
          phase: 扩张
          touchpoints:
            - 律所在更多诉讼团队中推广平台
            - 管理层将分析结果纳入合伙人审阅
            - 律所在不增加律师助理编制的情况下扩大案件接收量
          friction: Absence of published volume tier discounts creates cost friction at higher scale
    approximationNotes: 各阶段反映产品说明和独立比较指数分析中记录的供应商工作流触点。
    claimRefs:
      - CU002
      - CU004
      - CU010
      - CU014
  - id: FR001
    title: 人身伤害法律科技风险矩阵
    type: matrix
    summary: 从影响程度和发生可能性两个维度评估 EvenUp 的主要风险向量。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 严重影响
          values:
            - label: 数据传票 / 隐私泄露
              detail: 原告健康数据发生灾难性泄露或引发监管行动
            - label: 法律 AI 输出幻觉
              detail: 不准确的需求材料包损害律师在谈判中的声誉
            - label: CMS 生态系统拒绝接入
              detail: 主要法律案件管理软件阻止集成
        - label: 高影响
          values:
            - label: 核心模型延迟飙升
              detail: 第三方 LLM 推理延迟拖慢文档起草交付
            - label: UPL 与州律师协会审查
              detail: 监管指导限制 AI 生成法律文书的范围
            - label: 人工审阅拖累毛利率
              detail: 持续依赖人工操作员压缩软件利润率
        - label: 中等影响
          values:
            - label: 次级 CMS 界面漂移
              detail: 旧式本地部署法律软件需要进行小幅格式调整
            - label: 附属功能流失
              detail: 律所对次级分析仪表盘的使用不足
            - label: 模型推理成本波动
              detail: 大量医疗记录导致 Token 处理成本波动
        - label: 低影响
          values:
            - label: 轻微营销表述偏差
              detail: 关于自动化范围与人工审阅之间差异的宣传表述
            - label: 常规员工流动
              detail: 符合科技市场常态的工程和运营人员离职
            - label: 局部训练数据噪声
              detail: 司法辖区特定的诉状差异需要调整提示词
        - label: 极小影响
          values:
            - label: 门户静态格式问题
              detail: 非标准浏览器视口偶尔出现 UI 渲染故障
            - label: 支持工单 SLA 延误
              detail: 非关键客户咨询偶尔出现轻微响应延迟
            - label: 非重大引用错字
              detail: 内部案件记录中的轻微格式错误在交付前被发现
        - label: 可忽略影响
          values:
            - label: 行政通知漂移
              detail: 非实质性法院表格页眉偶尔更新模板
            - label: 归档记录延迟
              detail: 深度归档中的非活跃历史案件检索延迟
            - label: 基准分析界面差异
              detail: 律所可选分析图表出现轻微视觉差异
    approximationNotes: 可能性和影响等级依据行业诉讼先例、产品架构披露及专家分析确定。
    claimRefs:
      - CR001
      - CR002
      - CR005
      - CR008
      - CR009
      - CR013
  - id: FV001
    title: EvenUp 建议与投资判断逻辑链
