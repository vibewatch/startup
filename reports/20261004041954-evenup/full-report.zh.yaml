      - number: '8.3'
        title: 情景分析与尽调要务
        blocks:
          - type: paragraph
            body: >-
              评估风险收益需要建立乐观、基准和悲观情景。乐观情景下，EvenUp 守住头部人身伤害律所 20% 渗透率，将客户从交易型索赔生成转为全周期案件管理订阅，并扩大 Piai 以压缩人工复核。假设通过 RELX
              等法律集团收购或高倍数上市退出，后期资本回报 2.5x 至 4.0x。

              基准情景假设收入稳步增长，但生成式 AI 估值重估带来倍数收缩、回报持平。悲观情景假设客户流失至 Filevine、Codes Health 等套件，人工核验成本高位导致毛利恶化。2026 年 1 月
              Health Gorilla 与 LlamaLab 健康信息交换争议，也凸显第三方记录摄取的法律审查。综合判断应继续研究；机构投资者入场必须以毛利率审计、经核验纯软件 ARR 和股权结构表 清算结构为前提。
