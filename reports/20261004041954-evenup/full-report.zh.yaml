      - number: '1.5'
        title: 展品
        blocks:
          - type: callout
            title: 融资规模不是运营能力的证明
            body: 已融资 $385 million、估值超过 $2 billion，只能说明投资人定价，不能证明当前现金、ARR、收入质量、毛利率或留存。投资判断仍需要经审计的财务数据，以及从软件自动化到任何人工交付成本的拆分。
            calloutType: risk
            claimRefs:
              - CO009
              - CO010
              - CO015
          - type: callout
            title: 不利信号来自二手且由竞争对手发布
            body: 不利来源是竞争对手对另一家出版物报道的复述，值得对人工复核强度开展尽调，但不是独立基准或运营实践的证明。
            calloutType: assumption
            claimRefs:
              - CO016
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、工作流与邻近领域
        blocks:
          - type: paragraph
            body: >-
              EvenUp
              的目标市场明确在人身伤害原告方律所，覆盖诉前案件处理、医疗记录管理、索赔主张函起草和和解分析。它不做一般诉讼或被告方企业法律顾问业务，而是自动化风险代理业务中的手工文档工作。聚焦原告方律所使其避开广义法律科技巨头，从客户接入到索赔主张交付获取专业工作流。Pre-Litigation
              as a Service 又把边界从软件文档生成扩展到运营型案件管理，使其可以争取原本给内部律师助理或离岸行政团队的运营人力预算。
            claimRefs:
              - CM001
              - CM005
              - CM007
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM005
              - CM007
      - number: '2.2'
        title: 可寻址市场测算与渗透率视角
        blocks:
          - type: paragraph
            body: >-
              个人伤害法律科技市场测算必须区分律所总数与可服务的软件或运营服务支出。第三方研究估计美国活跃人身伤害律所约 48,000 家，市场集中但高度分散。EvenUp 自称服务超过 2,000 家，初始全国渗透率约
              4%；并报告覆盖美国 Top 100 人身伤害律所的 20%。核心索赔起草软件的年可服务市场约 $500 million 至 $1.2 billion；Pre-Litigation as a Service
              打开约 $2.0 billion 至 $4.0 billion 的运营人力池。早期验证包括产品测试初期签下的超过 $10 million 诉前订阅。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM006
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM008
      - number: '2.3'
        title: 买方分层、预算归属与合同动态
        blocks:
          - type: paragraph
            body: >-
              原告方律所的采用取决于经济买方与日常用户分层。中大型律所中，创始合伙人和管理合伙人是经济买方，想降低管理费用、加快和解并扩大案件承载而不同比例增员。律师助理、诉讼案件经理和助理律师是日常用户，在既有案件管理系统中使用医疗时间线和索赔草稿。EvenUp
              按案件一体化计价而非按席位订阅，把软件支出与接入量挂钩。企业合同又包含年度承诺、不可退款预付费、月度超额计费和两倍于月度基准的数量上限，带来实质财务承诺。
            claimRefs:
              - CM004
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM007
              - CM008
              - CM010
      - number: '2.4'
        title: 采用催化剂、市场逆风与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              手工整理文件时从非结构化医疗记录提取逐行引文，过去会消耗大量律师助理工时，这推动了主动型人身伤害 AI 的采用。EvenUp 2026 年 9 月与 LexisNexis 集成，把权威判例法和智能体法律研究嵌入
              Companion，进一步放大商业势头。但 Verisk 数据显示汽车保险案件（索赔主张）量在 2025 年下降，给核心案件接入带来压力。语音和短信智能体也有合规障碍：自动联系当事人时，律所直接承担 TCPA
              同意要求的法律责任。EvenUp 尚未披露经审计 ARR、净收入留存率，或软件草稿与劳动密集型诉前服务的分部毛利率，长期单位经济仍未验证。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: 展品
        blocks:
          - type: callout
            title: TAM 从软件扩展到诉前人力预算
            body: 推出 Pre-Litigation as a Service（PLAAS）后，EvenUp 的可寻址市场从律所软件预算扩展到运营人力开支，单账户收入潜力变大，但引入了人工交付依赖。
            calloutType: insight
            claimRefs:
              - CM005
              - CM006
          - type: callout
            title: 理赔量宏观逆风与监管责任
            body: Verisk 数据显示 2025 年汽车保险案件（索赔主张）量收缩；EvenUp 面临按案件计价的接入费压力，也面临律所自动化客户沟通的 TCPA 合规风险。
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局：分层与替代方案
        blocks:
          - type: paragraph
            body: >-
              人身伤害（PI）法律科技正分化为横向法律平台和原告方 AI 引擎 [CP001]。EvenUp 是专门的案件智能平台，聚焦索赔主张材料、医疗时间线和案件和解智能 [CP002, CP005]。它不同于 DISCO
              等诉讼平台和 Centerbase、Clio 等业务管理系统，瞄准结构化案件事实决定和解价值的诉前文档瓶颈 [CP003, CP004]。Supio、Eve Legal 和 ProPlaintiff.ai
              已在索赔主张材料生成、医疗记录分析和案件全周期管理上提供重叠自动化 [CP001, CP007]。此外，横向业务管理 AI 插件、Codes Health 和 LlamaLab
              等调取商，以及内部律师助理工作流，都是结构性替代方案 [CP004, CP009]。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP007
              - CP009
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP007
              - CP008
              - CP009
              - CP010
      - number: '3.2'
        title: 竞争对手画像：规模、定位与产品范围
        blocks:
          - type: paragraph
            body: >-
              原告方法律科技竞争者主要在架构重点、定价，以及优先做上游医疗记录分析还是下游和解起草上形成差异 [CP001, CP008]。Supio 专注医疗记录摘要、案件智能和诉讼准备，声称覆盖 100,000+
              案件、$1 billion 和解，并集成 Thomson Reuters、Litify 和 SmartAdvocate [CP007, CP008]。Eve Legal 在 900+
              家律所部署覆盖接入、医疗概览、索赔起草和证据开示回复的 AI 智能体 [CP001, CP006]。ProPlaintiff.ai 提供轻量模块化替代方案。Codes Health 与 Filevine
              集成核验医疗记录；LlamaLab 因健康信息网络访问受法律审查 [CP009, CP010]。EvenUp 依靠 2,000+ 家律所客户和 250,000+ 判决数据集维护领先地位 [CP002,
              CP011]。
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP007
              - CP008
              - CP009
              - CP011
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP007
              - CP009
      - number: '3.3'
        title: 能力、包装与定价架构
        blocks:
          - type: paragraph
            body: >-
              定价与交付架构是主要分歧 [CP008, CP012]。Clio、Centerbase 按用户订阅，每月 $40 至 $110+；纵向人身伤害 AI 常用定制、演示驱动或按用量定价 [CP003,
              CP008]。EvenUp 过去每份索赔主张材料估计为 $200 至 $500，后扩展到平台和按案件计价，并设置 Express Demands（即时 AI 生成）和 Expert-Reviewed
              Demands（人工质检） [CP001, CP005, CP012]。Codes Health 按件收取固定调取费，Supio、ProPlaintiff 提供模块化或混合用量层级 [CP007, CP008,
              CP009]。纯 LLM 工具宣传即时输出，但原告律师需要诉讼级逐行引文，才能在保险方谈判和证词中辩护 [CP005, CP011]。
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP007
              - CP008
              - CP009
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP003
              - CP007
              - CP008
              - CP009
              - CP012
      - number: '3.4'
        title: 切换成本、分销能力与壁垒持久性
        blocks:
          - type: paragraph
            body: >-
              EvenUp 壁垒来自三项资产：与 Filevine、Litify、SmartAdvocate、CASEpeer 等系统的深度集成，数十万历史索赔主张的专有基准数据，以及律所计费工作流中的组织惯性 [CP002,
              CP005, CP013]。但单独索赔起草切换成本中低，律所可在个别文件上试用竞品，无需迁移记录系统 [CP001, CP007]。其 $2B+ 估值和快速扩张也面临把采用转成持久高毛利软件收入的压力，同时受到
              AI 自动化与人工依赖的审视 [CP012, CP014]。点解决方案和业务管理平台原生 AI 可能使独立起草商品化，迫使 EvenUp 向客户沟通和接入自动化上游推进 [CP004, CP013,
              CP014]。
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP007
              - CP012
              - CP013
              - CP014
      - number: '3.5'
        title: 展品
        blocks:
          - type: callout
            title: 上游与下游瓶颈动态
            body: >-
              原告方律所有两个瓶颈：上游医疗记录调取 / 核验，下游和解材料起草。EvenUp 主导下游索赔生成却明确不调取医疗记录，为 Codes Health 等上游供应商留下集成机会，也让 Supio
              可凭临床记录智能挑战 EvenUp。
            calloutType: insight
            claimRefs:
              - CP001
              - CP007
              - CP009
          - type: callout
            title: 横向 AI 套件带来的商品化压力
            body: >-
              Clio、Centerbase 等业务管理巨头把原生生成式 AI 加入核心计费和案件管理套件后，基础功能会商品化。EvenUp 必须证明 250,000+
              判决数据集和专家人工质检能带来明显更好的和解结果，才能支撑企业级平台定价。
            calloutType: risk
            claimRefs:
              - CP003
              - CP004
              - CP011
              - CP012
