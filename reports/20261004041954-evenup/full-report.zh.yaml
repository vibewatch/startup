chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、覆盖范围与商业模式
        blocks:
          - type: paragraph
            body: >-
              EvenUp 成立于 2019 年，自称是服务原告方人身伤害律所的 AI 平台，覆盖客户接入、治疗、索赔准备、谈判、证据开示和审判流程。它把文档起草与案件分析结合，而非通用法律研究产品。公司称 2025
              年在旧金山开设新实体总部；证据无法确认当前完整办公室数量。公司销售工作流软件和相关案件服务，但未披露可靠价目表或软件自动化与人工交付的比例。这一区分很重要：同样的表面增长可能对应截然不同的毛利率和估值。
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO008
              - CO009
              - CO010
              - CO012
              - CO013
              - CO015
      - number: '1.2'
        title: 领导层、创始人与市场匹配度及治理
        blocks:
          - type: paragraph
            body: >-
              EvenUp 将 Rami Karabibar 列为首席执行官、Raymond Mieszaniec 列为首席运营官、Saam Mashhad 列为产品与法律运营负责人。公司和领投方材料把三人分别与 Waymo
              的理赔低效、家庭严重事故影响和人身伤害法律实务联系起来。这套团队覆盖技术、运营和法律，但也让公司叙事与职能知识集中在创始团队。指定来源没有完整董事会名单、投票控制、继任计划或独立董事画像。因此创始人与市场的匹配度可见，而机构治理和关键人风险缓释仍是私下尽调事项。
            claimRefs:
              - CO004
              - CO005
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO005
      - number: '1.3'
        title: 融资历史与利益相关方图谱
        blocks:
          - type: paragraph
            body: >-
              公开融资从 2023 年 6 月据报道的 $50.5 million Series B，加速到 2024 年 10 月 $135 million Series D，再到 2025 年 10 月 $150
              million Series E。EvenUp 称 Series E 后累计融资 $385 million、估值超过 $2 billion。这些是融资和估值披露，不代表当前现金、收入或盈利。投资方包括
              Bessemer Venture Partners、Bain Capital Ventures、Lightspeed Venture Partners、SignalFire、Premji Invest、B
              Capital 和 REV；Bessemer 领投 Series E，多家老股东据称跟投。证据未披露清算优先权、董事席位、债务、授信、二级交易，或 REV 与 RELX、LexisNexis 关系附带的战略权利。
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
          - type: table
            tableRef: TO003
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
      - number: '1.4'
        title: 已报告规模、里程碑与证据局限
        blocks:
          - type: paragraph
            body: >-
              2025 年 10 月，公司和领投方材料称客户律所超过 2,000 家，其中包括美国 Top 100 人身伤害律所的 20%，已解决案件超过 200,000 起，涉及和解金或损害赔偿超过 $10
              billion，每周处理超过 10,000 起案件。这些指标分母不同，不能当作转化漏斗或收入。材料称 ARR 同比翻倍，但未披露绝对 ARR、计量期间、经审计收入、毛利率或留存率。一份竞争对手对比复述了
              Business Insider 2024 年 12
              月关于前员工称人工复核多于营销暗示的报道；原文不在指定资料池，因此只是低置信度不利信号，不是独立验证事实。里程碑在融资和自报采用度上强，在经审计经济数据和治理上弱。
            claimRefs:
              - CO012
