            body: >-
              EvenUp 的投资正论是其作为人身伤害法律业务领先 AI 平台的商业地位。公司声称全国服务 2,000+ 家律所，包括美国 Top 100 的 20%，并处理 200,000+ 起已解决案件、涉及 $10
              billion+ 损害赔偿。自动化索赔函、医疗时间线和和解智能为原告方律所带来生产率提升；案例和合作伙伴材料称索赔起草效率提高 34%。

              反论聚焦估值纪律、技术防御力和人工参与架构的单位经济。Codes Health 的报道与分析称 EvenUp
              不是端到端记录调取商，而是要求律所输入完整文档的下游起草分析引擎。调查报道还称生产流程严重依赖人工复核，使毛利率结构更像法律流程外包而非高毛利软件。经审计收入未披露而估值超过 $2.0
              billion，新股权投资者安全边际极度收窄。
