        - id: n3
          label: 估值溢价：累计融资 $385M 后的投后估值超过 $2B
        - id: n4
          label: 运营注意事项：人在回路审阅开销及对记录获取的依赖
        - id: n5
          label: 建议：高风险且估值昂贵，继续研究
        - id: n6
          label: 尽调关口：审计软件毛利率、群组留存和股权结构表悬置
      edges:
