  - id: FE001
    title: EvenUp 多层文档 AI 架构图
    type: stack
    summary: 展示 EvenUp 平台从数据摄取、持久化案件记忆、智能生成，到人工验证和 CMS 交付的结构层级。
    data:
      layers:
        - label: CMS 集成与体验层
          detail: 连接 Litify、SmartAdvocate、CASEpeer 及 Web 应用界面
          items:
            - 案件管理连接器
            - 互动式护理时间线
            - 证物与文档编辑器
        - label: 人在回路验证层
          detail: 法律专家和临床审计员验证 AI 提取结果及起草材料包
          items:
            - 引用验证审计
            - 医疗时间线审阅
            - 审计轨迹与来源记录
        - label: 智能与起草系统
          detail: 经过领域适配的法律 AI 模型执行结构化综合和损害赔偿估值
          items:
            - Piai 领域语言模型
            - 需求函叙事生成引擎
            - 和解分析与估值
        - label: 记录系统（SoR）记忆层
          detail: 规范化持久数据库，连接案件实体、医疗就诊记录和时间线
          items:
            - 案件实体知识图谱
            - 事故示意图场景摘要
            - 持久化医疗计费模式
        - label: 多模态文档摄取层
          detail: 预处理引擎负责规范化非结构化扫描件、PDF 和手写内容
          items:
            - 多模态 PDF 与 OCR 提取
            - PPO 示意图可回答性训练
            - 文档布局与表格结构恢复
        - label: 云基础设施与数据处理层
          detail: 基于 AWS 托管的后端分布式基础设施，由 Kubernetes 和 Docker 编排
          items:
            - 分布式后端微服务
            - Kubernetes 容器集群
            - Terraform 基础设施即代码
