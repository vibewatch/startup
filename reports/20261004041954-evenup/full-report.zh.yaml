            title: 投资立场：待财务审计后继续研究
            body: >-
              EvenUp 在法律科技领域实现了亮眼的运营成绩：已有超过 2,000 家人身伤害律师事务所真正采用其软件。不过，在看不到经审计的软件毛利率、群组留存率和真实的人在回路人工成本时，以超过 $2.0 billion
