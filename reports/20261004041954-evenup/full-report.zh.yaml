      - number: '8.2'
        title: 估值背景与资本化历史
        blocks:
          - type: paragraph
            body: >-
              EvenUp 自 2019 年成立以来累计获得 $385 million 股权融资。2023 至 2025 年快速扩张：2023 年 4 月 $50.5 million Series B，12 月 $35
              million Series C；2024 年 10 月 $135 million Series D，投前 $865 million、投后 $1.0 billion，由 Bain Capital Ventures
              领投；2025 年 10 月由 Bessemer Venture Partners 领投 $150 million Series E，Adams Street、Broadlight、HarbourVest 和
              REV（RELX / LexisNexis 风投部门）跟投，投后超过 $2.0 billion。

              二级跟踪估计 Series D 隐含稀释约 14%、Series E 约 8%，但股权结构表、清算优先权和 RELX 等企业参与者的治理权仍未公开。员工数从 2022 年末 84 人扩大到 2026 年初报告的
              500+、估计最多 853 人，显示工程、营销和人工复核扩张消耗大量现金。没有经审计 ARR 时，独立软件同业倍数显示 EvenUp 相对成熟软件倍数有显著溢价。
