evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-and-scale-metrics
    missingEvidence: >-
      Audited revenue, absolute ARR, gross margin, retention, current headcount, cash balance, debt or credit
      facilities, and runway.
    whyItMatters: >-
      Funding raised and valuation do not establish cash available, recurring revenue quality, operating leverage, or
      financing durability.
    diligencePath: >-
      Request audited financial statements, bank and debt schedules, ARR and retention cohort reconciliations, and a
      current employee roster from management.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance-and-control
    missingEvidence: >-
      Complete board and observer roster, voting agreements, protective provisions, liquidation preferences, strategic
      rights, secondary transactions, and founder succession arrangements.
    whyItMatters: >-
      Investor and founder control can affect financing flexibility, exit outcomes, related-party incentives, and
      continuity if a key executive departs.
    diligencePath: >-
      Review the charter, voting agreement, investor-rights agreement, capitalization table, board minutes, and
      executive succession plan.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: minor
    topic: human-review
    missingEvidence: >-
      The original Business Insider reporting and a direct EvenUp response addressing the scope and economics of human
      legal review.
    whyItMatters: >-
      The retained adverse source is competitor-issued and secondhand, so it cannot establish the prevalence or margin
      impact of manual review.
    diligencePath: >-
      Obtain the original report, interview former operations staff, and reconcile reviewer labor per case against
      product-level gross margin.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: material
    topic: disclosure-gaps
    missingEvidence: >-
      Audited breakdown of ARR, gross margins across software vs PLAAS managed services, and customer retention metrics
      (NRR/GRR).
    whyItMatters: >-
      Essential to determine whether EvenUp's revenue quality and unit economics warrant a multi-billion dollar
      valuation multiple given the higher delivery costs of pre-litigation managed services.
    diligencePath: >-
      Request formal GAAP financial statements, gross margin by product line, and cohort-level net retention schedules
      under non-disclosure agreement.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: market-sizing
    missingEvidence: >-
      Independent third-party survey of total annual software and paralegal spend across mid-market personal injury law
      firms.
    whyItMatters: >-
      Without firm-level budget disclosures, the Serviceable Obtainable Market (SOM) relies on inferred case volumes
      rather than audited procurement spend.
    diligencePath: Review anonymized legal tech benchmarking reports and law firm association operating cost surveys.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: blocking
    topic: revenue-pricing-and-recognition
    missingEvidence: >-
      Audited revenue and ARR, product-level revenue mix, current rate cards, realized prices, discounts, contract
      terms, and revenue-recognition policy.
    whyItMatters: These inputs are required to distinguish recurring software revenue from transactional and service revenue.
    diligencePath: >-
      Review audited statements, the ARR bridge, contract samples, invoice extracts, and the revenue-recognition
      memorandum under NDA.
    relatedQuestionRefs:
      - QI001
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: >-
      Gross margin by delivery tier, reviewer utilization and cost per case, inference and support costs, CAC, sales
      cycle, payback, GRR, and NRR.
    whyItMatters: Without these denominators, adoption cannot establish efficient growth or software-like contribution margins.
    diligencePath: >-
      Obtain monthly cohort economics, product P&Ls, reviewer-capacity data, sales-funnel reports, and retention
      schedules.
    relatedQuestionRefs:
      - QI003
      - QI004
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Current cash, monthly cash burn, accounting losses, working-capital needs, debt or other obligations, capex,
      runway, use of funds, and next-round trigger.
    whyItMatters: >-
      Funding raised and secondary-market access do not establish cash available to the company or its financing
      dependency.
    diligencePath: >-
      Request the current balance sheet, 24-month cash forecast, debt schedule, board budget, covenant package, and
      financing plan.
    relatedQuestionRefs:
      - QI006
  - type: private-evidence-only
    severity: material
    topic: human-review-ratio
    missingEvidence: >-
      Audited operational disclosure of the exact ratio of machine automation versus human-in-the-loop review hours
      across demand packages.
    whyItMatters: >-
      Heavy reliance on manual legal specialist review constrains software gross margins and creates scaling bottlenecks
      during volume surges.
    diligencePath: >-
      Request production metrics on average human touch time per demand letter and unit labor costs from EvenUp
      management.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE001
      - TE003
  - type: missing-source
    severity: minor
    topic: developer-api-availability
    missingEvidence: Public developer API documentation and external SDK access for third-party developers.
    whyItMatters: >-
      Without public APIs, developer signal is limited to practitioner recruiting discussions and partner CMS
      connectors.
    diligencePath: Verify whether EvenUp offers partner-specific private API gateways or webhooks beyond pre-built CMS integrations.
    relatedQuestionRefs:
      - QE004
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: retention-and-churn
    missingEvidence: >-
      Audited net revenue retention (NRR), gross revenue retention (GRR), and account churn rates segmented by law firm
      size.
    whyItMatters: >-
      Determines whether EvenUp's per-case consumption model generates durable lifetime value or suffers from post-pilot
      fatigue and seasonal caseload swings.
    diligencePath: >-
      Request audited financial disclosure, anonymized cohort retention schedules, and annual software renewal logs from
      company management.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Revenue contribution percentages for EvenUp's top 5, 10, and 20 law firm accounts.
    whyItMatters: >-
      High concentration among a few mega-volume personal injury settlement mills would create severe enterprise revenue
      risk if a key client defects or builds internal AI tooling.
    diligencePath: >-
      Obtain customer concentration breakdown and revenue distribution across firm tiers during confidential management
      diligence.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-validation
    missingEvidence: >-
      Comprehensive roster of verified production deployments with independent verification of reported operational time
      savings.
    whyItMatters: >-
      Public testimonials are selected by vendor marketing and may not reflect median customer outcomes across typical
      solo or mid-market practices.
    diligencePath: >-
      Conduct blind reference interviews with former or non-featured personal injury law firm clients regarding drafting
      accuracy and actual time savings.
    relatedTableRefs:
      - TU003
  - type: enumeration-incomplete
    severity: material
    topic: Regulatory / legal risk register
    missingEvidence: >-
      Comprehensive state-by-state bar ethics advisory opinions and public health information exchange subpoena records
      involving personal injury legaltech platforms.
    whyItMatters: >-
      A sample enumeration leaves unquantified the probability of targeted regulatory enforcement actions across
      specific US state jurisdictions.
    diligencePath: >-
      Subpoena docket monitoring across federal courts and formal inquiry with state bar standing committees on legal
      ethics and unauthorized practice of law.
    relatedQuestionRefs:
      - QR001
      - QR002
    relatedTableRefs:
      - TR001
