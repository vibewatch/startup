      - number: '6.2'
        title: Adoption Trajectory and Production Casework Velocity
        blocks:
          - type: paragraph
            body: >-
              EvenUp's reported platform throughput has expanded from early self-service demand drafting into a platform
              processing an estimated 10,000 cases weekly as of late 2025. Across its marketing surfaces, the company
              reports over 200,000 total cases resolved and more than $10 billion in claimed damages across its customer
              base. Platform engagement centers on pre-litigation settlement demand packages and medical summaries,
              where EvenUp claims its drafting tools reduce attorney desk time by up to 75% and increase settlement
              demand throughput without commensurate staff expansion. Nevertheless, published metrics reflect cumulative
              marketing milestones rather than standardized SaaS activity metrics, leaving active monthly user counts,
              utilization rates per firm, and exact case completion distributions undisclosed.
