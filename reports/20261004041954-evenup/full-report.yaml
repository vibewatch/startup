      - number: '6.3'
        title: Named Customer Deployments and Case Study Outcomes
        blocks:
          - type: paragraph
            body: >-
              Public customer endorsements for EvenUp highlight substantial operational acceleration, though available
              proof remains dominated by vendor-curated summit presentations and marketing case studies. Prominent named
              firms including Omega Law Group, Batta Fulkerson, McCready Law Injury Attorneys, and John K. Zaid and
              Associates report measurable operational benefits, such as saving thousands of staff hours, cutting demand
              turnaround times, and accelerating pre-litigation negotiations. However, independent software evaluations
              indicate that reported outcome benchmarks—such as demands being 69% more likely to hit policy
              limits—originate from vendor marketing materials that lack published empirical baselines, comparison
              groups, or jurisdictional controls. Additionally, third-party reporting indicates that EvenUp's
              operational model relies heavily on human quality-assurance review teams, meaning software automation
              claims must be evaluated alongside labor-intensive workflow requirements.
            claimRefs:
              - CU009
