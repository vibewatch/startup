      - number: '5.3'
        title: Deployment, Ecosystem Integrations, Security Controls, and Technical Risks
        blocks:
          - type: paragraph
            body: >-
              EvenUp integrates directly into law firm operations by interfacing with leading personal injury case
              management systems (CMS), including Litify, SmartAdvocate, and CASEpeer. Case Preparation capabilities
              proactively inspect CMS case files to detect missing treatment records, gaps in medical care, or prior
              medical conditions before settlement packages are drafted. Technical differentiation stems from EvenUp's
              proprietary Claims Intelligence Platform and its extensive historical dataset of injury settlements,
              verdict benchmarks, and codified clinical records, allowing the system to quantify pain and suffering and
              predict carrier counterarguments. Governance and data security are underpinned by SOC2 Type II compliance
              and HIPAA attestation, critical safeguards given the highly confidential personal health information (PHI)
              processed across the platform. Nonetheless, prominent technical risks persist: EvenUp's lack of upstream
              medical record retrieval capabilities leaves it vulnerable to incomplete documentation from third-party
              vendors, while substantial human review overhead poses scaling bottlenecks if full document automation
              cannot outpace case intake growth.
            claimRefs:
              - CE002
              - CE004
              - CE005
              - CE011
              - CE014
              - CE015
              - CE016
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The System of Record as an Architectural Moat Against Base Model Commoditization
            body: >-
              EvenUp avoids generic LLM wrapper pitfalls by establishing a persistent System of Record rather than
              executing ephemeral retrieval-augmented generation across raw pages. By compiling extracted case facts,
              clinical encounters, and spatial crash summaries into a normalized queryable schema, the platform ensures
              auditability, reduces repetitive multi-modal inference costs, and creates durable data lineage that
              generic models cannot easily replicate.
            calloutType: insight
            claimRefs:
              - CE006
              - CE007
              - CE009
          - type: callout
            title: Downstream Vulnerability to Upstream Medical Record Deficiencies
            body: >-
              Because EvenUp focuses on downstream demand drafting rather than medical record retrieval, its document
              quality remains fundamentally capped by the completeness of files provided by law firms. Incomplete
              hospital records or missing diagnostic scans directly limit the evidentiary strength of generated demands,
              underscoring an architectural dependence on law firm record-gathering practices.
            calloutType: risk
            claimRefs:
              - CE011
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Buyer-User Dynamics
        blocks:
          - type: paragraph
            body: >-
              EvenUp's commercial customer base is strictly concentrated within plaintiff-side personal injury law
              firms, spanning solo practitioners, regional high-volume settlement mills, and national trial practices.
              Within these firms, purchasing decisions are driven by managing litigation partners seeking to eliminate
              pre-litigation drafting bottlenecks, while daily users comprise paralegals, legal assistants, and junior
              associates who upload raw case files and review generated demands. Case costs in contingency litigation
              are typically advanced by the law firm and deducted from final claimant settlements, meaning case-based
              software fees directly impact firm operating capital and claimant net recovery. Strategic alliances with
              enterprise legal tech vendors like LexisNexis and integration with case management software (CMS)
              platforms such as Litify, SmartAdvocate, and CASEpeer serve as critical procurement distribution channels
              across mid-market and enterprise law practices.
            claimRefs:
