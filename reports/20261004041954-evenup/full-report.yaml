chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Footprint, and Business Model
        blocks:
          - type: paragraph
            body: >-
              EvenUp was founded in 2019 and describes itself as an AI platform for personal injury firms. Its product
              surface spans intake, treatment, demand preparation, negotiation, discovery, and trial workflows,
              combining document drafting and case analysis rather than operating as a general-purpose legal research
              product. The company reported opening a new brick-and-mortar headquarters in San Francisco in 2025; the
              reviewed evidence does not establish a complete current office count. The business is private and sells
              workflow software and related case services to personal injury law firms, but public materials do not
              disclose a reliable current pricing schedule or the split between software automation and human-supported
              delivery. This distinction matters because the same headline growth can produce materially different
              gross-margin and valuation outcomes.
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO008
              - CO009
              - CO010
              - CO012
              - CO013
              - CO015
      - number: '1.2'
        title: Leadership, Founder-Market Fit, and Governance
        blocks:
          - type: paragraph
            body: >-
              EvenUp identifies Rami Karabibar as chief executive officer, Raymond Mieszaniec as chief operating
              officer, and Saam Mashhad as chief of product and legal operations. Company and lead-investor accounts
              connect Karabibar to claims-handling inefficiencies observed at Waymo, Mieszaniec to the consequences of a
              serious accident in his family, and Mashhad to personal-injury legal practice. That mix supplies
              technology, operating, and legal-domain coverage, but it also concentrates the company narrative and
              functional knowledge in the founding team. None of the assigned sources provides a complete board roster,
              voting-control structure, succession plan, or independent-director profile. Founder-market fit is
              therefore visible, while institutional governance and key-person mitigation remain private diligence items
              rather than verified strengths.
            claimRefs:
              - CO004
              - CO005
