      - number: '7.2'
        title: 'Operational, Quality, and Technology Risks: Human-in-the-Loop Bottlenecks'
        blocks:
          - type: paragraph
            body: >-
              EvenUp's Claims Intelligence Platform relies on its proprietary Piai AI model trained on injury records,
              combined with structured case data. However, reporting indicates the company has historically utilized
              substantial human review and offshore operations to maintain drafting quality and verify medical records.
              This hybrid model introduces scaling bottlenecks, labor concentration risks, and gross margin pressure if
              automation rates fail to rise in step with surging document volume. In personal injury litigation, errors
              such as hallucinated treatment visits, miscalculated medical specials, or omitted prior medical conditions
              can irreparably damage an attorney's credibility in settlement negotiations or result in malpractice
              claims. Guaranteeing verified outputs across 10,000 weekly cases processed demands continuous quality
              control and data verification infrastructure.
            claimRefs:
