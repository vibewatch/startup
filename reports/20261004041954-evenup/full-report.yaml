              - CP002
              - CP004
              - CP005
              - CP007
              - CP008
              - CP009
              - CP011
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP007
              - CP009
      - number: '3.3'
        title: Capability, Packaging, and Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              Pricing and delivery architecture represent major points of divergence across the competitive landscape
              [CP008, CP012]. While horizontal platforms like Clio and Centerbase offer predictable per-user
              subscriptions ranging from $40 to $110+ per month, vertical personal injury AI tools frequently utilize
              custom, demo-led, or usage-based pricing models [CP003, CP008]. EvenUp historically utilized per-demand
              packaging—typically estimated between $200 and $500 per deliverable—before expanding into broader platform
              and per-case pricing models with tiers such as Express Demands (instant AI-generated) and Expert-Reviewed
              Demands (incorporating human QA) [CP001, CP005, CP012]. In contrast, alternative vendors like Codes Health
              offer flat-fee per-case record retrieval, while Supio and ProPlaintiff offer modular subscriptions or
              hybrid usage tiers [CP007, CP008, CP009]. The inclusion of human review remains a key quality vector;
              while pure LLM tools advertise instant outputs, plaintiff attorneys require verifiable, litigation-grade
              line-level citations to defend demands during carrier negotiations and depositions [CP005, CP011].
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP007
              - CP008
              - CP009
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP003
              - CP007
              - CP008
              - CP009
              - CP012
      - number: '3.4'
        title: Switching Costs, Distribution Power, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              EvenUp's competitive moat is anchored in three structural assets: deep integrations with plaintiff case
              management systems (such as Filevine, Litify, SmartAdvocate, and CASEpeer), proprietary benchmark data
              from hundreds of thousands of historical claims, and organizational inertia within law firm billing
              workflows [CP002, CP005, CP013]. However, switching costs for standalone demand drafting are moderate to
              low, as firms can pilot competing platforms on individual files without migrating their underlying system
              of record [CP001, CP007]. Furthermore, as candidates and third-party analyses observe, EvenUp's aggressive
              valuation ($2B+) and rapid product expansion have created pressure to convert broad adoption into durable,
              high-margin software revenues amid scrutiny over AI automation versus human labor dependency [CP012,
              CP014]. Rising competition from agile point solutions and native AI features embedded directly into core
              practice management platforms threaten to commoditize standalone drafting, forcing EvenUp to push upstream
              into client communication agents and intake automation to preserve its lock-in [CP004, CP013, CP014].
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP007
              - CP012
              - CP013
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Upstream vs. Downstream Bottleneck Dynamic
            body: >-
              Plaintiff personal injury firms face two distinct operational bottlenecks: upstream medical record
              retrieval/verification and downstream settlement package drafting. EvenUp dominates downstream demand
              generation but explicitly does not retrieve medical records, creating an opportunity for upstream
              providers like Codes Health to capture workflow integration or for litigation platforms like Supio to
              challenge EvenUp on clinical record intelligence.
            calloutType: insight
            claimRefs:
              - CP001
              - CP007
              - CP009
          - type: callout
            title: Commoditization Pressure from Horizontal AI Suites
            body: >-
              As practice management incumbents like Clio and Centerbase introduce native generative AI features into
              their core billing and matter management suites, basic document drafting and summarization risk
              commoditization. EvenUp must prove that its proprietary dataset of 250,000+ verdicts and expert human QA
              deliver materially superior settlement outcomes to justify enterprise platform pricing.
            calloutType: risk
            claimRefs:
              - CP003
              - CP004
              - CP011
              - CP012
              - CP014
