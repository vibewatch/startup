  - id: TE003
    title: Technology Stack and Operating Architecture Matrix
    columns:
      - Architecture Layer
      - Core Role & Technical Function
      - Underlying Technologies & Dependencies
      - Technical Risk / Scaling Vulnerability
    rows:
      - - Multi-Modal Ingestion & Normalization
        - Extracts unstructured data from PDFs, scanned bills, handwriting, and accident diagrams
        - Vision-language models, specialized OCR, layout analysis pipelines, AWS/cloud storage
        - High token and compute costs; latency spikes across multi-thousand page case files
      - - Accident Diagram Parsing
        - Converts collision sketches into structured textual summaries via PPO reinforcement learning
        - Multimodal LLMs, Proximal Policy Optimization, answerability evaluation harnesses
        - Complex multi-vehicle or ambiguous spatial diagrams may yield incomplete causal summaries
      - - Persistent System of Record (SoR)
        - Maintains persistent normalized entities (claimants, encounters, providers, line items)
        - Relational/graph case memory databases, entity-linking schemas, provenance mapping
        - Schema migration complexity across evolving legal jurisdictions and historical cases
      - - System of Intelligence & Drafting
        - Synthesizes medical chronologies, demand narratives, and economic damages summaries
        - Proprietary Piai model, structured prompt pipelines, citation-verification engines
        - Potential hallucination of medical billing totals or pre-existing clinical conditions
      - - Expert Verification & Review Layer
        - Human legal and clinical experts verify drafted documents before attorney delivery
        - Internal review tooling, workflow routing services, distributed legal specialist workforce
        - Labor-intensive scaling bottlenecks and gross margin compression as volume increases
      - - Integration & CMS Interface
        - Synchronizes case files, documents, and notifications with law firm case management software
        - RESTful APIs, webhooks, CMS partner connectors (Filevine, Litify, SmartAdvocate, CASEpeer)
        - API changes, partner rate limiting, or platform lockouts by incumbent CMS providers
    notes: >-
      Details the technical components powering EvenUp's platform, from multi-modal ingestion to human review and CMS
      integrations.
