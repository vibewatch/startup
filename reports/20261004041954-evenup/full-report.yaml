  - id: FU001
    title: EvenUp Personal Injury Customer Casework Journey Map
    type: journey-map
    summary: Visual map illustrating law firm workflow stages, user touchpoints, and friction points across EvenUp's platform.
    data:
      items:
        - label: Case Intake & Record Assembly
          phase: Pre-Platform
          touchpoints:
            - Plaintiff client intake and injury questionnaire
            - Third-party medical record and police report retrieval
            - Upload raw case documentation to case management system
          friction: EvenUp does not retrieve records; missing medical records or authorizations delay workflow
        - label: Document Ingestion & MedChrons
          phase: Data Extraction
          touchpoints:
            - AI extraction of treatment dates, providers, and ICD diagnostic codes
            - Automated generation of interactive care timeline
            - Identification of treatment gaps and pre-existing conditions
          friction: Complex medical files require internal human-in-the-loop QA review
        - label: Settlement Demand Drafting
          phase: Core Automation
          touchpoints:
            - AI Drafts Suite generates jurisdiction-specific demand letter
            - Settlement Repository matches case with historical verdict comparables
            - Express Demands or legal-reviewed draft delivered to attorney inbox
          friction: Attorneys carry mandatory ethical review duty before sending demands to insurers
        - label: Attorney Review & Ethical Sign-Off
          phase: Quality Assurance
          touchpoints:
            - Supervising attorney verifies medical chronology against source records
            - Litigator checks proposed valuation against local jurisdiction practice
            - Firm approves final demand package on firm letterhead
          friction: Attorneys carry non-delegable ethical duty for machine-generated legal advocacy
        - label: Negotiation & Executive Analytics
          phase: Settlement
          touchpoints:
            - Case Companion AI assists attorney during adjuster negotiations
            - Executive Analytics tracks settlement velocity and desk time savings
            - Firm compares case resolution against historical policy limits
          friction: Case-based fees deducted from case proceeds; sensitive to litigation volume swings
        - label: Account Expansion & Caseload Scaling
          phase: Expansion
          touchpoints:
            - Law firm rolls out platform across additional litigation teams
            - Executive management integrates analytics into partner review
            - Firm expands intake volume without adding paralegal headcount
          friction: Absence of published volume tier discounts creates cost friction at higher scale
    approximationNotes: >-
      Stages reflect vendor-documented workflow touchpoints from product explainers and independent comparative index
      analyses.
    claimRefs:
      - CU002
      - CU004
      - CU010
      - CU014
