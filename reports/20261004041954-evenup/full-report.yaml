      - number: '6.4'
        title: Retention Durability, Procurement Friction, and Concentration Exposure
        blocks:
          - type: paragraph
            body: >-
              EvenUp's long-term customer economics face distinct structural headwinds related to pricing mechanics,
              switching costs, and regulatory scrutiny. The platform charges on a per-case consumption model rather than
              seat-based licensing, making firm-level spend highly sensitive to macroeconomic litigation volumes, intake
              swings, and settlement velocity. Because EvenUp does not act as a primary medical record retriever and
              requires complete case files to function, operational bottlenecks upstream—such as missing medical
              authorizations or slow healthcare provider responses—can stall demand generation and degrade perceived
              ROI. Crucially, EvenUp has not disclosed audited retention metrics, annual churn rates, or net revenue
              retention figures by cohort, leaving open questions regarding whether law firms retain the software across
              fluctuating litigation cycles or face customer concentration among a handful of advertising-heavy personal
              injury firms.
            claimRefs:
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Case-Based Pricing and Contingency Practice Economics
            body: >-
              Unlike standard B2B enterprise SaaS that charges predictable per-seat monthly subscriptions, EvenUp's
              case-based pricing structure aligns vendor revenue with customer caseload velocity. For personal injury
              firms operating on contingency fees, software expenses associated with demand preparation are either
              absorbed as practice overhead or charged as client case costs. When case volume contracts or upstream
              medical record retrieval stalls, software spend fluctuates, creating revenue volatility that cannot be
              modeled as steady recurring subscription income.
            calloutType: insight
            claimRefs:
              - CU003
              - CU014
          - type: callout
            title: Dependence on Manual Human-in-the-Loop Review Infrastructure
            body: >-
              Third-party reporting and comparative legal tech analyses highlight that EvenUp pairs its generative AI
              models with extensive internal human quality-assurance reviewers to maintain citation fidelity and prevent
              hallucinations. If labor-intensive manual review remains necessary to verify complex medical chronologies
              and policy-limit demands, customer unit economics and platform gross margins will fail to achieve pure
              software scalability as caseload expands.
            calloutType: risk
            claimRefs:
              - CU012
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Regulatory and Legal Risk: Health Information Exchange Exposure and UPL Boundaries'
        blocks:
          - type: paragraph
            body: >-
              EvenUp operates at the intersection of protected health information and legal document generation,
              creating distinct regulatory and compliance vulnerabilities. Although EvenUp is not a medical record
              retrieval service like LlamaLab—which is named as a defendant in a 2026 lawsuit brought by Epic Systems
              alleging improper access across health information exchanges—EvenUp ingests massive volumes of medical
              chronologies, clinical treatment notes, and diagnostic billing records. The platform must maintain
              rigorous HIPAA compliance and SOC2 attestation across all automated workflows, particularly as state bar
              associations scrutinize legaltech vendors to enforce unauthorized practice of law rules. Any regulatory
              enforcement action targeting third-party legaltech access to medical networks or questioning the
              boundaries between attorney work product and AI-generated demand drafts represents a material operational
              and legal barrier.
            claimRefs:
              - CR001
              - CR002
