      - number: '1.3'
        title: Financing History and Stakeholder Map
        blocks:
          - type: paragraph
            body: >-
              The public financing trajectory accelerated from a reported $50.5 million Series B announcement in June
              2023 to a $135 million Series D in October 2024 and a $150 million Series E in October 2025. EvenUp said
              the Series E brought total capital raised to $385 million and valued the company above $2 billion. These
              are financing and valuation disclosures, not evidence of cash currently available, revenue, or
              profitability. The disclosed investor group includes Bessemer Venture Partners, Bain Capital Ventures,
              Lightspeed Venture Partners, SignalFire, Premji Invest, B Capital, and REV. Bessemer led the Series E,
              while investor and company sources describe repeated participation by several existing backers. The
              assigned evidence does not disclose liquidation preferences, board seats, debt or credit facilities,
              secondary transactions, or strategic rights attached to REV's relationship with RELX and LexisNexis.
