      - number: '5.2'
        title: Architecture, Operating Model, and the System of Record
        blocks:
          - type: paragraph
            body: >-
              EvenUp's technical foundation centers on a multi-tiered Document AI architecture that transitions raw
              documents through three operational layers: a persistent System of Record (SoR), a System of Intelligence
              (SoI), and a System of Action (SoA). Early legal AI systems often faltered by relying on naive chunk-based
              retrieval-augmented generation (RAG), which caused fragmented context, ephemeral memory, and escalating
              base model costs. To establish durable provenance, EvenUp normalizes multi-modal inputs—such as
              handwritten clinical notes, billing tables, and accident collision diagrams—into structured textual
              summaries linked to specific bounding coordinates and source spans. For visual accident diagrams, the team
              utilizes reinforcement learning with Proximal Policy Optimization (PPO) evaluated on downstream
              answerability, converting diagrams into schema-conformant spatial descriptions. Backend services
              implemented across Python, distributed cloud infrastructure, and data processing pipelines query this
              persistent record rather than repeatedly re-reading raw case files. Human-in-the-loop legal review remains
              deeply integrated to audit complex outputs, preserving output accuracy while maintaining an explicit
              lineage trail for every extracted fact.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE012
              - CE013
