              Nasdaq Private Market's assigned page likewise yielded generic marketplace disclosures rather than issuer
              financials. The financial verdict is therefore conditional: customer adoption and weekly case volume
              indicate demand, but revenue quality, software-versus-service mix, gross-margin expansion, retention, and
              capital adequacy remain private-evidence blockers. Underwriting should wait for audited statements, cohort
              economics, service-delivery cost data, and a current liquidity schedule.
