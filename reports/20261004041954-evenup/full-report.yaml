      - number: '7.3'
        title: 'Partner Dependencies and Financial Execution: CMS Integration and Market Durability'
        blocks:
          - type: paragraph
            body: >-
              EvenUp's software workflow is heavily dependent on ecosystem integrations with personal injury case
              management software platforms including Filevine, Litify, SmartAdvocate, and CASEpeer. Should core CMS
              providers restrict API access, impose punitive third-party integration tariffs, or introduce native AI
              demand-drafting modules, EvenUp's platform friction and customer acquisition costs would escalate.
              Furthermore, following its October 2025 Series E round pricing the firm at over $2 billion on $385 million
              in total capital raised, EvenUp faces heightened valuation execution risk. Without public audited
              financials, the business must sustain rapid ARR expansion while navigating law firm procurement caution,
              software subscription budget caps, and potential churn if case outcomes do not demonstrably hit promised
              policy limits.
