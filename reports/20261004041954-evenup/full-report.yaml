        title: Capital Adequacy and Financial Verdict
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not establish EvenUp's cash balance, accounting loss, cash burn, debt,
              working-capital needs, capital expenditures, runway, use of funds, or next-round trigger. EquityZen
              describes secondary access through funds that acquire shares from existing EvenUp shareholders; such
