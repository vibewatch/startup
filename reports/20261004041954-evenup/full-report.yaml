  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Workflows, and Adjacencies
        blocks:
          - type: paragraph
            body: >-
              The addressable market for EvenUp is bounded squarely within plaintiff-side personal injury law firms,
              specifically targeting pre-litigation claims processing, medical records management, demand letter
              drafting, and settlement analytics. Rather than addressing general litigation or defense-side corporate
              counsel, EvenUp automates the manual document burden inherent to contingency-fee personal injury
              practices, where a single case routinely produces hundreds of pages of medical bills, police records, and
              clinical chronologies. By focusing on plaintiff firms, EvenUp avoids direct competition with broad legal
              tech incumbents and instead captures specialized workflows from intake through demand delivery.
              Furthermore, the introduction of Pre-Litigation as a Service expands this boundary from pure software
              document generation into operational case management, positioning EvenUp to capture operational staffing
              budgets that traditionally went to in-house paralegals or offshore administrative teams.
            claimRefs:
              - CM001
              - CM005
              - CM007
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM005
              - CM007
      - number: '2.2'
        title: Addressable Market Sizing and Penetration Lenses
        blocks:
          - type: paragraph
            body: >-
              Market sizing for personal injury legal technology requires distinguishing between overall law firm counts
              and addressable software or operational services spend. Third-party research estimates the total
              population of active personal injury law firms in the United States at roughly 48,000 practices,
              representing a concentrated but highly fragmented market. EvenUp currently claims to serve over 2,000
              personal injury firms, implying an initial market penetration of approximately 4% nationwide. Within
              enterprise plaintiff practices, EvenUp reports penetration across 20% of the Top 100 U.S. personal injury
              law firms, demonstrating strong adoption among high-volume practices. While core demand drafting software
              represents a serviceable market of approximately $500 million to $1.2 billion annually under case-based
              pricing, EvenUp's newest Pre-Litigation as a Service offering unlocks an addressable operational staffing
              pool estimated between $2.0 billion and $4.0 billion. Early commercial validation includes more than $10
              million in pre-litigation subscriptions secured during early product testing.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM006
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM008
      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Contracting Dynamics
        blocks:
          - type: paragraph
            body: >-
              Adoption dynamics within plaintiff personal injury firms depend on clear segmentation between the economic
              buyer and daily operational users. In mid-market and enterprise firms, founding partners and managing
              partners act as economic buyers whose primary purchasing motivations center on reducing overhead,
              increasing settlement velocity, and scaling case capacity without proportional headcount expansion. In
              contrast, paralegals, litigation case managers, and associate attorneys represent daily users who interact
              directly with automated medical chronologies and demand drafts inside existing case management systems.
              EvenUp structures commercial pricing on an all-in-one case-based model rather than traditional per-seat
              subscriptions, tying software expenditure directly to intake volume. While this lowers the initial
              commitment threshold for smaller practices, enterprise contract terms enforce strict annual commitments,
              non-refundable advance fee schedules, monthly overage billings, and volume ceilings set at twice monthly
              baseline allocations, creating meaningful financial commitment for growing practices.
            claimRefs:
              - CM004
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM007
              - CM008
              - CM010
      - number: '2.4'
        title: Adoption Catalysts, Market Headwinds, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Adoption of proactive personal injury AI is accelerated by severe operational bottlenecks in manual file
              assembly, where extracting line-level citations from unstructured medical records historically consumed
              substantial paralegal hours. Commercial momentum is further amplified by strategic distribution alliances,
              such as EvenUp's September 2026 integration with LexisNexis to embed authoritative case law and agentic
              legal research into EvenUp's Companion assistant. However, significant adoption constraints and adverse
              market dynamics temper this growth trajectory. According to Verisk industry data, automobile claims volume
              declined in 2025, exerting downward pressure on core personal injury case intake. Furthermore, voice and
              SMS communication agents introduce regulatory and compliance hurdles, as law firms bear direct legal
              liability for Telephone Consumer Protection Act consent requirements when automated agents contact
              claimants. Finally, EvenUp has not disclosed audited ARR, net revenue retention, or segmented gross
              margins between high-margin software drafts and labor-intensive pre-litigation services, leaving long-term
              unit economics unverified.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: TAM Expansion from Software to Pre-Litigation Labor Budgets
            body: >-
              The introduction of Pre-Litigation as a Service (PLAAS) shifts EvenUp's addressable market from
              traditional law firm software budgets into direct operational staffing overhead, significantly enlarging
              revenue potential per account while introducing labor delivery dependencies.
            calloutType: insight
            claimRefs:
              - CM005
              - CM006
          - type: callout
            title: Macro Claim Volume Headwinds and Regulatory Liability
            body: >-
              With industry data from Verisk indicating contracting auto claim volumes in 2025, EvenUp faces macro
              pressure on case-based intake fees alongside law firm compliance exposure for automated client
              communications under the TCPA.
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Segmentation and Alternative Approaches'
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape in personal injury (PI) legal technology is rapidly bifurcating between
              horizontal legal platforms and specialized plaintiff-focused AI engines [CP001]. EvenUp operates as a
              dedicated claims intelligence platform focused on personal injury workflows, particularly demand package
              preparation, medical chronologies, and case settlement intelligence [CP002, CP005]. Unlike broad
              litigation platforms like DISCO or core practice management systems like Centerbase and Clio, EvenUp
              targets pre-litigation documentation bottlenecks where structured case facts dictate settlement value
              [CP003, CP004]. However, EvenUp is no longer uncontested in plaintiff-side AI; direct peers including
              Supio, Eve Legal, and ProPlaintiff.ai now provide overlapping automation across demand generation, medical
              record analysis, and case lifecycle management [CP001, CP007]. Beyond direct software rivals, EvenUp faces
              significant structural alternatives, including horizontal practice management AI add-ons, specialized
              medical record retrieval vendors such as Codes Health and LlamaLab, and entrenched internal paralegal
              workflows [CP004, CP009].
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP007
              - CP009
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP007
              - CP008
              - CP009
              - CP010
      - number: '3.2'
        title: 'Competitor Profiles: Scale, Positioning, and Product Scope'
        blocks:
          - type: paragraph
            body: >-
              Plaintiff-side legaltech competitors differentiate primarily through architectural focus, pricing models,
              and whether they prioritize upstream medical record analysis or downstream settlement drafting [CP001,
              CP008]. Supio focuses heavily on deep medical record summarization, case intelligence, and litigation
              prep, claiming coverage of over 100,000 cases and $1 billion in settlements with integrations into Thomson
              Reuters, Litify, and SmartAdvocate [CP007, CP008]. Eve Legal emphasizes end-to-end lifecycle automation,
              deploying specialized AI agents across intake, medical overview, demand drafting, and discovery responses
              across more than 900 law firms [CP001, CP006]. ProPlaintiff.ai positions itself as a lightweight, modular
              alternative designed for rapid deployment of cited medical chronologies and demand packages without
              enterprise overhead [CP001, CP007]. Meanwhile, specialized retrieval providers like Codes Health integrate
              with Filevine to verify medical records before analysis, contrasting with retrieval services like LlamaLab
              which face legal scrutiny over health information network access [CP009, CP010]. EvenUp relies on its
              scale of over 2,000 law firm clients and 250,000+ verdict dataset to defend its market leadership [CP002,
              CP011].
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
