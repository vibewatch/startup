      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Human-in-the-Loop Margin and Scalability Conundrum
            body: >-
              EvenUp's hybrid architecture pairs machine learning with human legal review to guarantee litigation-grade
              precision. While critical for maintaining accuracy in high-stakes personal injury demands, this
              operational model creates an inescapable trade-off between gross margins and document turnaround time as
              case intake scales.
            calloutType: risk
            claimRefs:
              - CR002
              - CR005
              - CR007
          - type: callout
            title: Ecosystem Defensibility Hinges on Proprietary Settlement Data
            body: >-
              As foundational language models commoditize basic document summarization, EvenUp's true defensibility
              against CMS incumbents and competing legaltech entrants resides in its private repository of 250K+ verdict
              and settlement benchmarks rather than drafting software alone.
            calloutType: insight
            claimRefs:
              - CR003
