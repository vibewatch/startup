company:
  name: "EvenUp"
chapter:
  number: 4
  title: "Financials"
  summary: "EvenUp shows meaningful company-reported adoption and case throughput, but the assigned public evidence does not disclose audited revenue, ARR, gross margin, retention, sales efficiency, cash, burn, or runway. The key underwriting issue is whether per-case monetization can produce software-like margins despite a professional-review tier that uses more than 150 legal professionals."
sections:
  - id: "revenue-model"
    title: "Revenue Model and Commercial Packaging"
    body: >-
      The available evidence supports a per-case monetization model, but not a complete revenue
      schedule. A competitor-authored comparison reports that EvenUp introduced all-in-one,
      per-case pricing in May 2025; because the issuer is a competitor, this is directional
      evidence rather than an independent benchmark. EvenUp's own Demands page distinguishes
      an AI-only workflow, in which the law firm reviews and finalizes the draft, from a
      professional-review workflow completed with EvenUp legal staff. Those tiers plausibly
      create different revenue quality and delivery costs, yet no retained source supplies list
      prices, realized prices, discounting, contract duration, revenue mix, or recognition terms.
      The resulting model should be underwritten as commercially active but financially opaque,
      not assumed to be subscription SaaS.
    claimRefs:
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI010"
      - "CI013"
    tableRefs:
      - "TI001"
    figureRefs:
      - "FI001"
  - id: "pricing-and-gtm"
    title: "Pricing Transparency and GTM Efficiency"
    body: >-
      EvenUp appears to use a sales-assisted go-to-market motion. Its contact page sends
      prospective buyers to a sales conversation, while the homepage advertises representatives
      in every U.S. territory. That distribution footprint is consistent with an enterprise or
      consultative sale to personal injury firms, but it does not establish sales productivity.
      The company reports more than 2,000 customer firms, thousands of firms including 20% of the
      Top 100 U.S. personal injury firms, and 10,000 cases processed weekly. These are useful
      adoption and utilization signals, not revenue, ARR, active-paid-account, CAC, payback, or
      retention metrics. Without cohort-level contracts and selling-cost data, customer scale
      cannot be translated into average contract value or efficient growth.
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI007"
      - "CI015"
    tableRefs:
      - "TI002"
  - id: "costs-and-unit-economics"
    title: "Cost Structure and Unit-Economics Constraints"
    body: >-
      The professional-review tier is the clearest public indicator of variable delivery cost.
      EvenUp says that more than 150 legal professionals participate in that offering and that
      finalized work is delivered in one to five days. This does not reveal utilization, reviewer
      compensation, automation rate, rework, or cost per completed case, so it cannot support a
      gross-margin estimate. The AI-only tier may carry a different cost profile because the
      customer reviews and finalizes the output, but cloud inference, onboarding, support, and
      sales costs are also undisclosed. A competitor additionally characterizes EvenUp as
      downstream of medical-record retrieval and dependent on complete records supplied by the
      firm. That positioning may add workflow dependency and rework risk, but it is not an
      independently measured margin benchmark.
    claimRefs:
      - "CI008"
      - "CI009"
      - "CI010"
      - "CI014"
      - "CI016"
    tableRefs:
      - "TI003"
  - id: "capital-adequacy-and-verdict"
    title: "Capital Adequacy and Financial Verdict"
    body: >-
      The assigned evidence does not establish EvenUp's cash balance, accounting loss, cash burn,
      debt, working-capital needs, capital expenditures, runway, use of funds, or next-round
      trigger. EquityZen describes secondary access through funds that acquire shares from
      existing EvenUp shareholders; such transactions provide shareholder liquidity and are not
      evidence of primary capital reaching the company. Nasdaq Private Market's assigned page
      likewise yielded generic marketplace disclosures rather than issuer financials. The
      financial verdict is therefore conditional: customer adoption and weekly case volume
      indicate demand, but revenue quality, software-versus-service mix, gross-margin expansion,
      retention, and capital adequacy remain private-evidence blockers. Underwriting should wait
      for audited statements, cohort economics, service-delivery cost data, and a current
      liquidity schedule.
    claimRefs:
      - "CI011"
      - "CI012"
      - "CI013"
      - "CI014"
      - "CI015"
