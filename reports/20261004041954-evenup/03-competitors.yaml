callouts:
  - calloutType: "insight"
    title: "The Upstream vs. Downstream Bottleneck Dynamic"
    body: "Plaintiff personal injury firms face two distinct operational bottlenecks: upstream medical record retrieval/verification and downstream settlement package drafting. EvenUp dominates downstream demand generation but explicitly does not retrieve medical records, creating an opportunity for upstream providers like Codes Health to capture workflow integration or for litigation platforms like Supio to challenge EvenUp on clinical record intelligence."
    claimRefs:
      - "CP001"
      - "CP007"
      - "CP009"
  - calloutType: "risk"
    title: "Commoditization Pressure from Horizontal AI Suites"
    body: "As practice management incumbents like Clio and Centerbase introduce native generative AI features into their core billing and matter management suites, basic document drafting and summarization risk commoditization. EvenUp must prove that its proprietary dataset of 250,000+ verdicts and expert human QA deliver materially superior settlement outcomes to justify enterprise platform pricing."
    claimRefs:
      - "CP003"
      - "CP004"
      - "CP011"
      - "CP012"
      - "CP014"
