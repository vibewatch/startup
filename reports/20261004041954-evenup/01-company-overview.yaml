company:
  name: "EvenUp"
chapter:
  number: 1
  title: "Company Overview"
  summary: "EvenUp is a San Francisco-based personal-injury legal technology company founded in 2019 and led by three co-founders with technology, operating, and legal-domain backgrounds. Its October 2025 Series E announcement reported $150 million raised at a valuation above $2 billion, but absolute ARR, audited revenue, current headcount, cash, runway, and governance rights remain unavailable in the assigned evidence."
sections:
  - id: "identity-and-business"
    title: "Identity, Footprint, and Business Model"
    body: "EvenUp was founded in 2019 and describes itself as an AI platform for personal injury firms. Its product surface spans intake, treatment, demand preparation, negotiation, discovery, and trial workflows, combining document drafting and case analysis rather than operating as a general-purpose legal research product. The company reported opening a new brick-and-mortar headquarters in San Francisco in 2025; the reviewed evidence does not establish a complete current office count. The business is private and sells workflow software and related case services to personal injury law firms, but public materials do not disclose a reliable current pricing schedule or the split between software automation and human-supported delivery. This distinction matters because the same headline growth can produce materially different gross-margin and valuation outcomes."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Leadership, Founder-Market Fit, and Governance"
    body: "EvenUp identifies Rami Karabibar as chief executive officer, Raymond Mieszaniec as chief operating officer, and Saam Mashhad as chief of product and legal operations. Company and lead-investor accounts connect Karabibar to claims-handling inefficiencies observed at Waymo, Mieszaniec to the consequences of a serious accident in his family, and Mashhad to personal-injury legal practice. That mix supplies technology, operating, and legal-domain coverage, but it also concentrates the company narrative and functional knowledge in the founding team. None of the assigned sources provides a complete board roster, voting-control structure, succession plan, or independent-director profile. Founder-market fit is therefore visible, while institutional governance and key-person mitigation remain private diligence items rather than verified strengths."
    claimRefs:
      - "CO004"
      - "CO005"
    tableRefs:
      - "TO002"
  - id: "financing-and-stakeholders"
    title: "Financing History and Stakeholder Map"
    body: "The public financing trajectory accelerated from a reported $50.5 million Series B announcement in June 2023 to a $135 million Series D in October 2024 and a $150 million Series E in October 2025. EvenUp said the Series E brought total capital raised to $385 million and valued the company above $2 billion. These are financing and valuation disclosures, not evidence of cash currently available, revenue, or profitability. The disclosed investor group includes Bessemer Venture Partners, Bain Capital Ventures, Lightspeed Venture Partners, SignalFire, Premji Invest, B Capital, and REV. Bessemer led the Series E, while investor and company sources describe repeated participation by several existing backers. The assigned evidence does not disclose liquidation preferences, board seats, debt or credit facilities, secondary transactions, or strategic rights attached to REV's relationship with RELX and LexisNexis."
    claimRefs:
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
    tableRefs:
      - "TO003"
  - id: "scale-milestones-and-evidence-limits"
    title: "Reported Scale, Milestones, and Evidence Limits"
    body: "October 2025 company and lead-investor materials reported more than 2,000 customer firms, including 20% of the Top 100 U.S. personal injury firms, more than 200,000 resolved cases, over $10 billion in settlements or damages, and more than 10,000 cases processed weekly. Those measures describe different denominators and should not be treated as a conversion funnel or as revenue. The same materials said ARR was doubling year over year but did not disclose absolute ARR, its measurement period, audited revenue, gross margin, or retention. An assigned competitor-authored comparison also repeated a December 2024 Business Insider report that former employees described more manual human review than marketing implied; because the original article is not in the assigned pool, this is a low-confidence adverse signal, not an independently verified operating fact. The milestone record is strong on fundraising and company-reported adoption but weak on audited economics and governance."
    claimRefs:
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
    figureRefs:
      - "FO001"
