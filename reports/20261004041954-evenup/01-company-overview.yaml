  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "financial-and-scale-metrics"
      missingEvidence: "Audited revenue, absolute ARR, gross margin, retention, current headcount, cash balance, debt or credit facilities, and runway."
      whyItMatters: "Funding raised and valuation do not establish cash available, recurring revenue quality, operating leverage, or financing durability."
      diligencePath: "Request audited financial statements, bank and debt schedules, ARR and retention cohort reconciliations, and a current employee roster from management."
      relatedQuestionRefs:
        - "QO005"
      relatedTableRefs:
        - "TO001"
    - type: "enumeration-incomplete"
      severity: "material"
      topic: "governance-and-control"
      missingEvidence: "Complete board and observer roster, voting agreements, protective provisions, liquidation preferences, strategic rights, secondary transactions, and founder succession arrangements."
      whyItMatters: "Investor and founder control can affect financing flexibility, exit outcomes, related-party incentives, and continuity if a key executive departs."
      diligencePath: "Review the charter, voting agreement, investor-rights agreement, capitalization table, board minutes, and executive succession plan."
      relatedQuestionRefs:
        - "QO008"
      relatedTableRefs:
        - "TO002"
        - "TO003"
    - type: "missing-source"
      severity: "minor"
      topic: "human-review"
      missingEvidence: "The original Business Insider reporting and a direct EvenUp response addressing the scope and economics of human legal review."
      whyItMatters: "The retained adverse source is competitor-issued and secondhand, so it cannot establish the prevalence or margin impact of manual review."
