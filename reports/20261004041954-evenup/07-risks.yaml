chapter:
  number: 7
  title: "Risks"
  summary: "EvenUp faces critical regulatory and operational risks centered on health information privacy and downstream document accuracy, alongside platform dependence on core personal injury case management systems. While the company has scaled its Piai-driven demand drafting and Claims Intelligence Platform across 2,000+ law firms, litigation in adjacent legaltech and reliance on human-in-the-loop review highlight acute governance and margin sensitivities."
sections:
  - id: "regulatory-and-legal-exposure"
    title: "Regulatory and Legal Risk: Health Information Exchange Exposure and UPL Boundaries"
    body: "EvenUp operates at the intersection of protected health information and legal document generation, creating distinct regulatory and compliance vulnerabilities. Although EvenUp is not a medical record retrieval service like LlamaLab—which is named as a defendant in a 2026 lawsuit brought by Epic Systems alleging improper access across health information exchanges—EvenUp ingests massive volumes of medical chronologies, clinical treatment notes, and diagnostic billing records. The platform must maintain rigorous HIPAA compliance and SOC2 attestation across all automated workflows, particularly as state bar associations scrutinize legaltech vendors to enforce unauthorized practice of law rules. Any regulatory enforcement action targeting third-party legaltech access to medical networks or questioning the boundaries between attorney work product and AI-generated demand drafts represents a material operational and legal barrier."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR012"
    tableRefs:
      - "TR001"
    figureRefs:
      - "FR001"
  - id: "operational-quality-and-human-review"
    title: "Operational, Quality, and Technology Risks: Human-in-the-Loop Bottlenecks"
    body: "EvenUp's Claims Intelligence Platform relies on its proprietary Piai AI model trained on injury records, combined with structured case data. However, reporting indicates the company has historically utilized substantial human review and offshore operations to maintain drafting quality and verify medical records. This hybrid model introduces scaling bottlenecks, labor concentration risks, and gross margin pressure if automation rates fail to rise in step with surging document volume. In personal injury litigation, errors such as hallucinated treatment visits, miscalculated medical specials, or omitted prior medical conditions can irreparably damage an attorney's credibility in settlement negotiations or result in malpractice claims. Guaranteeing verified outputs across 10,000 weekly cases processed demands continuous quality control and data verification infrastructure."
    claimRefs:
      - "CR005"
      - "CR006"
      - "CR007"
      - "CR008"
      - "CR013"
    tableRefs:
      - "TR002"
  - id: "partner-platform-and-financial-dependencies"
    title: "Partner Dependencies and Financial Execution: CMS Integration and Market Durability"
    body: "EvenUp's software workflow is heavily dependent on ecosystem integrations with personal injury case management software platforms including Filevine, Litify, SmartAdvocate, and CASEpeer. Should core CMS providers restrict API access, impose punitive third-party integration tariffs, or introduce native AI demand-drafting modules, EvenUp's platform friction and customer acquisition costs would escalate. Furthermore, following its October 2025 Series E round pricing the firm at over $2 billion on $385 million in total capital raised, EvenUp faces heightened valuation execution risk. Without public audited financials, the business must sustain rapid ARR expansion while navigating law firm procurement caution, software subscription budget caps, and potential churn if case outcomes do not demonstrably hit promised policy limits."
    claimRefs:
      - "CR009"
      - "CR010"
      - "CR011"
      - "CR014"
      - "CR015"
    tableRefs:
      - "TR003"
