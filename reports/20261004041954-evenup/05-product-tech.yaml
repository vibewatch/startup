callouts:
  - calloutType: "insight"
    title: "The System of Record as an Architectural Moat Against Base Model Commoditization"
    body: "EvenUp avoids generic LLM wrapper pitfalls by establishing a persistent System of Record rather than executing ephemeral retrieval-augmented generation across raw pages. By compiling extracted case facts, clinical encounters, and spatial crash summaries into a normalized queryable schema, the platform ensures auditability, reduces repetitive multi-modal inference costs, and creates durable data lineage that generic models cannot easily replicate."
    claimRefs:
      - "CE006"
      - "CE007"
      - "CE009"
  - calloutType: "risk"
    title: "Downstream Vulnerability to Upstream Medical Record Deficiencies"
    body: "Because EvenUp focuses on downstream demand drafting rather than medical record retrieval, its document quality remains fundamentally capped by the completeness of files provided by law firms. Incomplete hospital records or missing diagnostic scans directly limit the evidentiary strength of generated demands, underscoring an architectural dependence on law firm record-gathering practices."
    claimRefs:
      - "CE011"
      - "CE015"
