chapter:
  number: 5
  title: "Product & Technology"
  summary: "EvenUp operates an AI-driven litigation productivity platform for personal injury law practices, transforming messy case records into structured medical chronologies, demand packages, and settlement insights. Anchored by its Claims Intelligence Platform and document engine, the architecture relies on a persistent System of Record design that combines multi-modal extraction with human-in-the-loop legal review to guarantee litigation-grade precision."
sections:
  - id: "product-definition-and-case-lifecycle"
    title: "Product Definition and Case Lifecycle Workflow"
    body: "EvenUp delivers a specialized software platform tailored to the operational demands of plaintiff personal injury firms. The software addresses key phases across the personal injury lifecycle, including intake evaluation, care monitoring, demand package composition, and negotiation strategy. Rather than functioning as a raw medical records retrieval vendor, EvenUp ingests pre-assembled case files—encompassing police accident reports, provider bills, diagnostic imaging narratives, and clinical charts—and structures them into audit-ready legal deliverables. Core offerings include automated Medical Chronologies (MedChrons) that map treatment timelines and injury manifestations, alongside the flagship AI Demand Letters product that drafts defensible settlement claims with granular line-level citations back to the source records. Through structured data extraction and settlement intelligence, plaintiff attorneys eliminate manual compilation overhead and accelerate negotiation cycles."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
      - "CE011"
    tableRefs:
      - "TE001"
  - id: "architecture-and-document-ai-engine"
    title: "Architecture, Operating Model, and the System of Record"
    body: "EvenUp's technical foundation centers on a multi-tiered Document AI architecture that transitions raw documents through three operational layers: a persistent System of Record (SoR), a System of Intelligence (SoI), and a System of Action (SoA). Early legal AI systems often faltered by relying on naive chunk-based retrieval-augmented generation (RAG), which caused fragmented context, ephemeral memory, and escalating base model costs. To establish durable provenance, EvenUp normalizes multi-modal inputs—such as handwritten clinical notes, billing tables, and accident collision diagrams—into structured textual summaries linked to specific bounding coordinates and source spans. For visual accident diagrams, the team utilizes reinforcement learning with Proximal Policy Optimization (PPO) evaluated on downstream answerability, converting diagrams into schema-conformant spatial descriptions. Backend services implemented across Python, distributed cloud infrastructure, and data processing pipelines query this persistent record rather than repeatedly re-reading raw case files. Human-in-the-loop legal review remains deeply integrated to audit complex outputs, preserving output accuracy while maintaining an explicit lineage trail for every extracted fact."
    claimRefs:
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE012"
      - "CE013"
    tableRefs:
      - "TE002"
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "deployment-differentiation-and-security"
    title: "Deployment, Ecosystem Integrations, Security Controls, and Technical Risks"
    body: "EvenUp integrates directly into law firm operations by interfacing with leading personal injury case management systems (CMS), including Litify, SmartAdvocate, and CASEpeer. Case Preparation capabilities proactively inspect CMS case files to detect missing treatment records, gaps in medical care, or prior medical conditions before settlement packages are drafted. Technical differentiation stems from EvenUp's proprietary Claims Intelligence Platform and its extensive historical dataset of injury settlements, verdict benchmarks, and codified clinical records, allowing the system to quantify pain and suffering and predict carrier counterarguments. Governance and data security are underpinned by SOC2 Type II compliance and HIPAA attestation, critical safeguards given the highly confidential personal health information (PHI) processed across the platform. Nonetheless, prominent technical risks persist: EvenUp's lack of upstream medical record retrieval capabilities leaves it vulnerable to incomplete documentation from third-party vendors, while substantial human review overhead poses scaling bottlenecks if full document automation cannot outpace case intake growth."
    claimRefs:
      - "CE002"
      - "CE004"
      - "CE005"
      - "CE011"
      - "CE014"
      - "CE015"
      - "CE016"
