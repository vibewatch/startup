callouts:
  - calloutType: risk
    title: Highest-priority risk
    body: >-
      The core downside is policy-driven membership and payer-budget disruption rather than a sudden collapse in demand
      for high-touch care itself. If federal and state Medicaid changes increase churn faster than Cityblock can offset
      it with dual-eligible growth, reimbursement stability and margin credibility both weaken.
    claimRefs: [CR001, CR003, CR006, CR028, CR044]
  - calloutType: recommendation
    title: Key diligence ask before underwriting the valuation reset
    body: >-
      Require state-by-state exposure to expansion adults, renewal-support capability, contract-level risk-sharing
      protections, and market-level contribution margin before treating the 2026 down round as a clear opportunity.
    claimRefs: [CR009, CR015, CR018, CR045, CR046]
