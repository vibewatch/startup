- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Competitor
  - Buyer / contracting motion
  - Public packaging signal
  - Revenue logic
  - Procurement implication
  rows:
  - - Cityblock
    - Medicaid MCOs / MA / dual-focused plans and partners
    - Integrated care-delivery platform plus LTSS and community-based support
    - Value-based contracts with upside from lower total cost and better outcomes
    - Buyers must believe integrated model beats point-solution stack
  - - Oak Street Health
    - Health plans / MA economics / strategic parent synergies
    - Primary-care-center model for seniors
    - Full-risk clinic economics and center-level scaling
    - Strong comparator on clinic economics but less relevant for Medicaid-heavy tenders
  - - Aledade
    - Independent practices and health systems
    - Enablement plus network participation
    - Shared savings / VBC enablement economics
    - Lower-disruption alternative to outsourcing care delivery
  - - One Medical Seniors
    - Seniors and payer-aligned channels
    - Consumer-friendly senior primary care with hybrid brand
    - Membership/visit model plus payer contracts depending segment
    - Strong consumer experience but not tailored to Medicaid social complexity
  - - Landmark Health
    - Payers targeting highest-risk members
    - Home-based high-acuity management
    - Savings from avoided admissions and tighter chronic-care control
    - Specialist add-on can substitute for part of Cityblock’s home-based value
  - - ChenMed
    - Medicare Advantage payers and seniors
    - Preventive senior PCP model
    - Capitated/full-risk MA economics
    - Proven but largely senior/MA-specific package
  - - Devoted Health
    - Members inside owned/partnered MA economics
    - Insurance plus care coordination package
    - Payvider margin capture across premium and care
    - Integrated incentives can outperform vendor-only economics
  - - Guidehealth
    - Health systems / payers / provider groups
    - AI platform plus enablement services
    - Services plus platform value tied to gap closure and performance
    - Can win where buyers want technology and operations but not new frontline brand
  - - CareBridge
    - Medicaid HCBS programs and managed-care buyers
    - 24/7 support plus HCBS/community care workflows
    - PMPM or programmatic support economics tied to member outcomes and utilization
    - Can carve out LTSS/HCBS budget from broader Cityblock scope
  - - Wellvana
    - Practices, systems, and payors
    - Partnership-led VBC enablement programs
    - Shared savings / performance services
    - Attractive to incumbents resisting outside care-delivery vendors
  notes: Precise pricing is generally not public for this category; this table compares packaging and monetization posture rather than undisclosed list prices.
