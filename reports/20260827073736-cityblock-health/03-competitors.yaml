  title: Moat durability / competitive risk register
  columns:
  - Risk area
  - Cityblock strength today
  - Main rival(s)
  - Threat description
  - Durability view
  - Mitigation signal
  rows:
  - - Medicaid-first specialization
    - high
    - Oak Street / ChenMed / One Medical Seniors
    - Senior-focused rivals could expand downward into duals without adopting Medicaid-first model fully
    - medium-high
    - Cityblock already operates in complex Medicaid and dual populations
  - - Social-determinants integration
    - high
    - Oak Street / Aledade / Wellvana
    - Rivals can add referral layers but may struggle to embed social care deeply
    - high
    - Cityblock’s operating model already includes social care
  - - Behavioral-health integration
    - high
    - One Medical Seniors / Devoted
    - Competitors can broaden primary care but behavioral integration is uneven publicly
    - medium-high
    - Existing whole-person positioning
  - - AI care orchestration
    - medium-high
    - Guidehealth / Aledade
    - AI claims can commoditize quickly if buyers view them as table stakes
    - medium
    - CORE platform and 2026 productivity metrics
  - - Home-based complex-care workflow
    - medium-high
    - Landmark / CareBridge
    - Buyers can unbundle home-based support from broader care platform
    - medium
    - LTSS expansion and hospital-to-home services
  - - Rural expansion
    - medium
    - Main Street Health / local incumbents
    - Cityblock was historically urban and is newer in rural contexts
    - medium-low
    - Homeward acquisition broadens footprint
  - - Payer distribution and provider relationships
    - medium
    - Aledade / Wellvana / Devoted
    - Enablement and payvider models can be cheaper or easier for buyers to adopt
    - medium-low
    - Evidence of expanding government-program relevance
  - - Capital / strategic parent advantage
    - low-medium
    - CVS / Amazon / MA payviders
    - Larger parents can subsidize growth and tolerate longer payback
    - low
    - Different segment focus partly insulates Cityblock
