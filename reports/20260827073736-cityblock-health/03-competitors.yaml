tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Primary segment
  - Model
  - Public scale / ownership signal
  - Why it matters versus Cityblock
  - Main gap versus Cityblock
  rows:
  - - Oak Street Health
    - Medicare seniors
    - Clinic-based primary care with full-risk roots
    - Founded 2012; now part of CVS Health; acquired by CVS in 2023
    - Mature risk-clinic operator with national expansion and strategic parent backing
    - Primarily Medicare/older-adult focused rather than Medicaid-first
  - - Aledade
    - Independent PCPs and health systems
    - VBC enablement and ACO-style practice network
    - 3,000+ primary care organizations and 3M+ patients in 2026 official reporting
    - Massive distribution through independent and community providers
    - Does not own the same integrated community-based care model for Medicaid members
  - - One Medical Seniors / Iora
    - Medicare seniors
    - Team-based primary care with tech-enabled consumer layer
    - Amazon acquired One Medical in 2023; Iora model rebranded as One Medical Seniors
    - Combines senior-care model with Amazon scale and brand
    - More Medicare and consumer oriented than Medicaid-social-complexity focused
  - - Landmark Health
    - High-acuity complex patients
    - In-home medical care
    - Established national reputation in home-based complex-care management
    - Strong overlap on highest-risk members in the home
    - Narrower around in-home medical care than full social-and-primary-care integration
  - - ChenMed
    - Medicare Advantage seniors
    - Preventive full-risk primary care
    - Officially positions as primary care medical centers for seniors
    - Proven senior-focused full-risk operating playbook
    - Medicare Advantage concentration versus Cityblock’s Medicaid/dual emphasis
  - - Devoted Health
    - Medicare Advantage members
    - Payvider model integrating plan and care support
    - Officially markets Medicare Advantage plans plus broader member support
    - Strong payer-economic alignment and integrated incentives
    - More MA-centric and less community-social-care oriented
  - - Main Street Health
    - Rural providers and populations
    - Rural VBC enablement and partnership model
    - Known for rural-focused value-based care expansion
    - Strong rural credibility where Cityblock was historically weaker
    - Less vertically integrated direct-care model
  - - Guidehealth
    - Payers and provider groups
    - AI healthcare platform plus VBC enablement
    - 2026 KLAS-recognized enablement firm; AI healthcare platform
    - Compresses Cityblock’s AI differentiation in procurement
    - Enablement-first rather than Medicaid-first care delivery
  - - CareBridge
    - Medicaid HCBS and complex-needs members
    - Home/community-based support with 24/7 assistance
    - 100k+ members served; 24/7 member support on official site
    - Strong overlap in HCBS, caregiving, and home-based support
    - Narrower scope than Cityblock’s full-stack primary/behavioral/social model
  - - Wellvana
    - Practices, systems, and payors
    - VBC enablement and shared-performance partnership
    - VBC enablement and shared-performance partnership
    - Officially targets hospitals, systems, independent practices, and payors
    - Alternative for buyers who prefer enabling incumbents over outsourcing care
  notes: This table covers the decision-relevant competitors named in the brief and groups One Medical Seniors with the Iora model because the competitive issue is Amazon-owned senior primary care, not standalone legacy branding.
