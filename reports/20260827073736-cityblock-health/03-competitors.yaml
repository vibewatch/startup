- id: home-based-and-community-care-rivals
  title: Home-based and community-care rivals overlap most on complex-needs management
  body: 'Landmark, CareBridge, and parts of Devoted’s model create the strongest overlap with Cityblock’s management of medically and socially complex members outside the four walls of a clinic. Landmark is known for in-home medical care for people with multiple chronic conditions and high acuity, making it a strong comparator for the most expensive members in value-based contracts. CareBridge’s official materials are even closer to Cityblock’s nonclinic thesis: the company says it enables individuals in home and community-based settings to maximize health and independence, offers 24/7 member support, serves more than 100,000 members, and positions itself around interdisciplinary support for members, families, caregivers, payers, and providers. Cityblock’s February 2026 LTSS expansion likewise centers Medicaid and dually eligible populations with complex needs, using AI to streamline assessments and integrate long-term services and supports with broader care management.

    Devoted is less home-care-specific but remains competitively relevant because it shows the power of an integrated payer-and-care model. Devoted says it offers Medicare Advantage plans but aims to be more than a health plan by deeply supporting member well-being. That payvider structure can be powerful in contracting conversations because it internalizes more of the economics that Cityblock must often negotiate with external health plans. In other words, Devoted can compete not only on care experience but also on margin architecture.

    The common thread across these competitors is control of high-cost populations. Cityblock’s differentiation is that it combines home-based, community-based, behavioral, and social interventions for Medicaid and dual populations under one operating model. The risk is that payers may source these functions modularly: Landmark for in-home care, CareBridge for HCBS support, and other vendors for navigation or analytics. Cityblock wins when integrated execution creates better outcomes or lower total cost than that modular stack. It loses if buyers decide the stack can be assembled from specialists at lower cost.'
