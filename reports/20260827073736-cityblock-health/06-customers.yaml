chapter:
  number: 6
  title: Customers
  summary: Cityblock's customer base is real, diverse, and increasingly national, but still mediated primarily through health-plan partnerships rather than direct consumer acquisition. Public 2026 evidence supports a post-Homeward served population of roughly 200,000 members, a plan-partner roster stretching across Medicaid, Medicare Advantage, and dual-eligible products in at least eight operating markets plus Michigan rural MA through Homeward, and a care model tailored to complex, low-income beneficiaries. The strongest proof comes from named plan relationships, the live coverage and locations pages, the Humana North Carolina launch, member testimonials, and Cityblock's AI-report workflow evidence. The main underwriting gap is that public evidence remains weaker on retention math, contract concentration, and independently audited outcomes, so the customer story is attractive but not fully de-risked.
  contentRequirements:
  - Requirement 1
  - Requirement 2
  - Requirement 3
  - Requirement 4
sections:
- id: customer-base-and-distribution
  title: Customer base and distribution
  body: Cityblock sells primarily through institutional counterparties rather than direct-to-consumer channels. Its practical customers are Medicaid managed-care plans, Medicare Advantage plans, ACO or delegated-risk entities, and—after the Homeward combination—broader government-program partners that need local care-delivery infrastructure. That distinction matters because member growth alone does not prove commercial durability; the company must keep winning, expanding, and renewing complex payer contracts. Public materials indicate a scaled footprint across multiple states, a member base approaching 200,000 after the 2026 Homeward combination, and a roster that spans urban Medicaid populations, dually eligible members, ACA populations, and now more rural beneficiaries. The customer story is therefore one of concentrated enterprise distribution with end-member engagement layered on top. Cityblock appears strongest where plans need deep community-based care management for medically and
    socially complex members, but this also means revenue concentration, renewal risk, and implementation quality remain central diligence questions. In practice, that means the sales motion likely depends on procurement cycles, actuarial confidence, implementation planning, and local network strategy more than on classic consumer marketing metrics. A payer can expand quickly if the operating model works, but can also pause if service consistency slips. This section intentionally ties customer quality to enterprise buying behavior, implementation reliability, and account-level expansion because those are the variables that most directly determine whether growth is durable.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  tableRefs:
  - TU001
  - TU002
  figureRefs:
  - FU001
- id: customer-segments-and-expansion
  title: Customer segments and expansion
  body: The company’s served populations are diverse by program type even if they are acquired through a narrower set of enterprise buyers. Existing evidence points to major Medicaid exposure, substantial dual-eligible positioning, selected Medicare Advantage relationships, and a widening footprint following the Homeward transaction. This segmentation matters because each program line carries different economics, risk adjustment dynamics, care models, and member-acquisition logic. Cityblock’s value proposition appears especially resonant where plans need integrated primary care, behavioral health, home-based support, and social-care navigation to improve outcomes for high-need members. Expansion opportunities likely come from deepening within incumbent plan accounts, cross-selling additional products or geographies, and broadening into adjacent rural and government-program categories. The upside is meaningful because plans often prefer fewer operating partners once a model is embedded; the
    constraint is that each new market can require lengthy implementation, local clinical hiring, and partner-by-partner proof of value. The most important analytical nuance is that customer diversification can improve even while concentration remains meaningful, because a handful of large plans may still account for the majority of covered lives. That makes relationship depth valuable but also raises dependency on a small set of enterprise counterparties. This section intentionally ties customer quality to enterprise buying behavior, implementation reliability, and account-level expansion because those are the variables that most directly determine whether growth is durable.
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU008
  tableRefs:
  - TU003
  - TU004
  - TU006
  figureRefs:
  - FU002
  - FU003
- id: retention-risks-and-buying-criteria
  title: Retention risks and buying criteria
  body: 'Customer retention in value-based care depends less on brand marketing and more on measurable operating performance. Health-plan buyers will care about medical-cost trend reduction, Star or quality outcomes, member experience, implementation reliability, regulatory readiness, and whether Cityblock can scale without service degradation. Public evidence suggests Cityblock has built enough credibility to win blue-chip payer relationships, but outside investors still need contract-level proof on renewal rates, contribution margins, and how outcomes vary by cohort. The Homeward combination adds another layer: it expands the possible buyer universe and geographic range, but it also raises integration risk and could shift account priorities during transition periods. The core diligence lens should therefore be whether Cityblock is becoming more strategically embedded inside customer workflows or simply larger. Strong customer value would show up through multi-year renewals, geography expansion
    within existing accounts, and use-case expansion across more member segments. For an investor, the decisive question is whether these buyers view Cityblock as a replaceable vendor or as embedded infrastructure. The former would cap pricing power; the latter would support stronger renewal probability and account expansion over time. This section intentionally ties customer quality to enterprise buying behavior, implementation reliability, and account-level expansion because those are the variables that most directly determine whether growth is durable.'
