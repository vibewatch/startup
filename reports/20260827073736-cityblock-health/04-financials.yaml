callouts:
  - calloutType: insight
    title: Revenue grew while valuation fell
    body: >-
      Cityblock's 2026 financing is unusual because the company appears much larger operationally than in 2021, yet
      investors priced the business at only about one-fifth of its peak valuation.
    claimRefs: [CI009, CI010, CI033]
  - calloutType: risk
    title: Cheap can also mean disputed economics
    body: >-
      The roughly 0.5x valuation-to-revenue ratio looks attractive only if payer contracts and risk-bearing care
      delivery truly convert into durable cash flow rather than merely gross revenue volume.
    claimRefs: [CI021, CI022, CI034, CI036]
