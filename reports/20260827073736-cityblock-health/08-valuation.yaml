chapter:
  number: 8
  title: Valuation
  summary: Cityblock Health's August 2026 valuation of roughly $1.2 billion implies about 0.55x annualized revenue, a dramatic reset from the 2021 peak near $5.7 billion even though the company now reports $2.2 billion of annualized revenue, 77% year-over-year growth, broader customer diversification, and better margin direction. The chapter's core conclusion is that Cityblock looks optically inexpensive relative to scaled value-based care comparables and precedent transactions, but the right investment stance remains price-sensitive and diligence- sensitive because public evidence still does not resolve contract-level unit economics, durable profitability, or cap-table/preference overhang after the down round.
