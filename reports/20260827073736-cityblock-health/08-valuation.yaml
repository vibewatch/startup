  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: Market-level gross margin, contribution margin, and medical-cost trend by payer cohort.
    whyItMatters: Without these data, investors cannot tell whether the low revenue multiple is mispricing temporary sentiment or correctly discounting weak economics.
    diligencePath: Request cohort P&Ls, medical-loss and utilization bridges, and board-level operating review materials.
    relatedQuestionRefs:
    - QV019
    - QV021
    - QV022
    relatedTableRefs:
    - TV006
    - TV008
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Post-Series-E cap table, liquidation preferences, ratchets, and any special downside protections.
    whyItMatters: Headline valuation can overstate common-equity upside when late-stage down rounds include stacked preferences or structural protections.
    diligencePath: Request the financing documents, security terms summary, and post-money ownership waterfall.
    relatedQuestionRefs:
    - QV027
    relatedTableRefs:
    - TV008
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: Cash on hand, monthly burn, and forward financing plan after the August 2026 round.
    whyItMatters: Runway determines whether the current round is a stable reset or only a temporary bridge to another difficult financing.
    diligencePath: Request trailing twelve-month cash-flow statements, monthly burn history, and management's base/bear financing model.
    relatedQuestionRefs:
    - QV019
    - QV022
    - QV025
    relatedTableRefs:
    - TV006
    - TV008
  - type: access-blocked
    severity: minor
    topic: paywalled-market-data
    missingEvidence: Full text of some market-data and premium news sources cited for comparable valuations and down-round commentary.
    whyItMatters: Headline and metadata are enough for directional support, but full text would improve precision on comparator limitations and market framing.
    diligencePath: Re-pull these sources through licensed databases or investor access if a full investment memo is required.
    relatedQuestionRefs:
    - QV016
    - QV028
acknowledgedWarnings:
- dimension: paywallRisk
  reason: Valuation evidence for late-stage private companies and precedent transactions is partly available only through blocked or modeled sources, so some restricted citations are necessary for directional context in this chapter.
- dimension: unverifiedSource
  reason: Several cited URLs were fetched during the run but strict verification still points at path normalization or final-URL mismatches; the cited sources are retained only where directional support is still valuable.
