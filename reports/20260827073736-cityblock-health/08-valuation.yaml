- id: multiple-context-vs-comparables
  title: Revenue-multiple context versus strategic transactions and private comparables
  body: On a simple valuation-to-revenue basis, Cityblock screens cheaply. Using the disclosed August 2026 valuation of about $1.2 billion against annualized revenue of about $2.2 billion yields a current multiple near 0.55x. That is far below the implied multiples embedded in Cityblock's own 2021 funding, far below the strategic value paid by CVS for Oak Street Health, and below the level investors have historically tolerated for scaled value-based care platforms with credible growth. Oak Street's $10.6 billion sale to CVS and Amazon's $3.9 billion acquisition of One Medical are not perfect apples-to-apples references because both deals involved strategic buyers, consumer or senior-primary-care positioning, and different reimbursement mixes. Even so, they establish that scaled risk- bearing primary-care assets can command materially higher valuations when buyers believe they can create downstream medical-cost, distribution, or member-retention value. Private analogs point in the same direction.
    Aledade's 2021 financing at about a $3.1 billion valuation and Devoted Health's 2021 valuation above $12 billion show that the market historically paid richly for models combining payer leverage, provider infrastructure, or care-management scale. The correct takeaway is not that Cityblock deserves those historical marks today; it is that 0.55x revenue likely embeds a punitive discount for execution and sector sentiment rather than a neutral sector-clearing price.
