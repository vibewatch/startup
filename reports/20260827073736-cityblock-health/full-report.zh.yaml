  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: Medicaid 政策变化是本章最高严重度风险，因为它可能减少覆盖生命、提高流失，并动摇支付方经济性
        blocks:
          - type: paragraph
            body: >-
              Cityblock 的核心暴露在政府项目政策，而不只是普通创业公司波动。公司围绕
              Medicaid、双重资格和其他公共资助人群搭建，资格认定、续保节奏和州级融资规则一变，就会直接传导到入组、会员流失、支付方预算，以及资助高强度价值医疗模型的意愿。外界通常称作 H.R. 1 的 2025
              年联邦协调法，为许多 Medicaid 扩张成年人引入社区参与框架；2026 年 CMS 指引和 2026 年 6 月临时最终规则把这个框架转成运营要求，例如每月 80 小时，以及入组和续保时核验。同时，从
              2027 年开始，受影响成年人从原来每年重新认定一次改为每六个月一次，符合资格的会员也更可能因为材料摩擦掉出保障。KFF、CBPP、CMS、Georgetown CCF
              等政策来源认为这些变化行政负担重，并可能提高退保率；更广预测认为，到 2034 年，整部法律的各项条款会让超过 8 million 人失去 Medicaid 覆盖。对 Cityblock
              而言，直接问题不只是可报销会员减少，还包括用于照护管理、质量表现和精算预测的归因池更不稳定。州层差异进一步放大风险，因为不同 Medicaid 机构和 MCO
              在工作核验、豁免和提供方资金回应上会执行不一，跨市场复制运营模型也更难。
