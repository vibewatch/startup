      - number: '1.2'
        title: 护理模式、服务人群与当前运营规模
        blocks:
          - type: paragraph
            body: >-
              Cityblock 的服务模式在与健康计划和政府项目利益方的价值医疗安排下，把线下社区护理、虚拟护理、行为健康、药房支持、社会照护协调和数据驱动的会员触达组合起来。公司称服务 Medicaid、Medicare
              和双重资格会员；这些类别也吻合 2026 年 Humana 北卡罗来纳项目和 2026 年 Homeward 收购公告呈现的运营现实。Humana 项目起步覆盖近 20,000 名北卡罗来纳双重资格和
              Medicare Advantage 会员；Homeward 公告称，并入 Homeward 约 50,000 名乡村会员后，合并后公司将在全国服务接近 200,000 名会员。

              管理层还在 2026 年 8 月 Homeward 公告中披露了一组私人公司少见的具体运营指标：年化收入 $2.2 billion、同比增长 77%、收入超过上一次 2021 年融资时的四倍、健康计划客户从
              2021 年的 5 家增至 18 家，以及核心市场经营利润率为正。交易媒体摘要也印证了这些表述，把 Cityblock
              定位为已具规模的医疗运营商，而不是尚无收入的数字健康创业公司。限制在于，这些指标主要来自公司发布材料和后续报道，而非经审计合并财务报表。因此，这组数字最好视为信号很强、但尚未完全独立审计的运营 KPI。
