  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值重置、当前入场点，以及市场正在定价什么
        blocks:
          - type: paragraph
            body: >-
              Cityblock 当前估值争论始于一个不寻常组合：规模指标很强，同时又经历了后期照护交付平台中少见的私募市场大幅下调。围绕 2026 年 8 月 Series E 的公开和市场数据来源一致把当前估值放在约
              $1.2 billion，而 2021 年 3 月和 9 月融资对应的估值约为 $5.7 billion。这意味着它较私募峰值定价下降约 79%，尽管管理层现在称公司服务近 200,000 名会员，并产生约
              $2.2 billion 年化收入。最简单的解读是，市场不再把 Cityblock
              当作高倍数数字健康成长资产定价；相反，它更像一个承担风险的医疗运营商，价值取决于可证明的利润率、医疗成本表现和现金转化。反向解读很重要，不应淡化。Yahoo Finance /
              Forge、PitchBook、Rock Health 等来源和行业评论支持这样一种看法：市场重定价公司，不是因为收入消失，而是因为 2021
              年后期成长估值嵌入了价值医疗平台后来难以捍卫的预期。对新投资人而言，重置既是机会也是警告：入场价比过去低很多，但折扣之所以存在，正是因为市场要求证明，而不是叙事。
            claimRefs:
              - CV001
