      - number: '4.3'
        title: 运营杠杆、成本结构与利润率路径
        blocks:
          - type: paragraph
            body: >-
              Cityblock 最有投资价值的财务改善，不只是收入增长，而是管理费用强度下降与 EBITDA 利润率改善同时发生。公司称，在 2026 年融资前后引用的测量期内，企业运营费用占收入比例改善
              64%，EBITDA 利润率改善
              81%。即使未披露基础绝对金额，这些百分比也意味着有意义的运营杠杆。这个方向性故事符合价值医疗平台成熟的路径：市场启动、护理团队搭建、分析基础设施和健康计划实施的前期成本很重，但一旦利用率、工作流和签约模板到位，新增市场可以变得更高效。不过，公开记录仍留下重要盲点。公司没有经审计拆分毛利率、市场贡献利润率、医疗成本趋势暴露、准备金政策或按合约划分的营运资本波动。Cityblock
              负责的是更难服务、双重资格和 Medicaid
              占比较高的人群，某个队列的不利成本偏差会比软件式指标暗示的更快压缩盈利能力。因此，在拿到市场层面经济模型和理赔发展数据前，投资者应把利润率改善叙事视为有希望但不完整。
