      - number: '7.3'
        title: 运营复杂度、劳动力压力和整合负担可能削弱规模收益
        blocks:
          - type: paragraph
            body: >-
              即使报销和资本市场配合，Cityblock 仍必须跑通一个很难的照护交付模型。它的服务承诺横跨初级医疗、行为健康、社会照护、紧急支持、出院过渡；Homeward
              交易后，还延伸到更广的城市与农村覆盖。广度是差异化，但也制造人力、流程和整合风险。2023 年裁员 155 人、占员工总数
              12%，说明管理层已经不得不在运营压力下调整组织规模。裁员可以改善成本纪律，但也可能伤害士气、削弱实施能力，并拉伸本来就在高复杂度人群中工作的临床和运营团队。收购 Homeward
              扩大战略覆盖，却又增加一层整合暴露，涉及照护工作流、技术系统、市场合同，以及城市 Medicaid 运营和偏农村 Medicare
              运营之间的文化磨合。医疗劳动力短缺进一步推高扩张照护团队的成本和执行难度，尤其是在行为健康、社区健康工作、护理和照护管理岗位。对 Cityblock
              这样的整合模型而言，本地人员配置失败会变成系统性问题，因为人员不足可能同时拉低会员互动、质量指标、理赔结果和支付方信任。
