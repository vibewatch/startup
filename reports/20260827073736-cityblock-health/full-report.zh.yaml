      - number: '1.3'
        title: 创始人、管理团队与领导权交接
        blocks:
          - type: paragraph
            body: >-
              Cityblock 的创始团队以 Dr. Toyin Ajayi、Iyah Romm 和 Bay Gross 为核心，若干二级公开画像也把产品负责人 Mat Balez
              列入早期团队。用户提供的事实和多份公司公开资料一致将 Ajayi、Romm、Gross 识别为尽调意义上的关键创始人。Ajayi 是医生型高管，现在担任 CEO，也是最重要的战略发言人。Romm
              此前带领公司，2022 年卸任 CEO；领导权交接给 Ajayi 是 Cityblock 历史上的重要治理节点。该过渡似乎守住了使命连续性，同时把公司的公开叙事推向更强的临床主导。

              Cityblock 关于页面列出的现任高管包括 CEO 兼创始人 Dr. Toyin Ajayi、总裁 Mike Roaldi、首席财务官 Roseline Agboke，以及首席技术官 Alberto
              Lopez-Toledo。其他具名高管还包括首席健康官 Dr. Alex Billioux、首席行政官 Susan Brown 和首席人力官 Jordan Vroblesky。从尽调视角看，这支团队清晰对应
              Cityblock 当前的优先级：Ajayi 负责使命与临床可信度，Roaldi 负责运营规模和伙伴关系，Agboke 负责融资与单位经济模型纪律，Lopez-Toledo 负责平台杠杆。主要关键人风险仍集中在
              Ajayi 身上，因为她同时是创始人、临床声音、CEO，也是公司战略的核心叙事者。
