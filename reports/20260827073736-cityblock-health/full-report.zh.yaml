      - number: '3.5'
        title: Cityblock 的护城河及其断点
        blocks:
          - type: paragraph
            body: >-
              Cityblock 最有证据支撑的护城河不是原始诊所数量，也不是服务方网络广度，而是几项能力的组合：Medicaid 优先、整合社会决定因素、纳入行为健康、24/7 环绕式支持，以及为复杂政府项目人群调校的 AI
              原生运营层。Cityblock 围绕 Homeward 交易发布的官方和新闻材料称，其 CORE 平台使用纵向会员数据和 AI 来预测所需临床与社会干预；公司披露的预测准确率介于 62% 至 87%，2026
              年为临床人员和护理经理返还超过 44,000 小时行政时间，交易后全国覆盖接近 250,000 名会员。这些细节支持真实的技术与运营差异化，而不是单纯的 AI 叙事。

              护城河的耐久性仍然参差。竞争者可以逐层攻击。Oak Street、ChenMed 和 One Medical Seniors 可以在品牌化初级保健和诊所体验上比 Cityblock 投更多钱。Aledade 和
              Wellvana 可以凭既有服务方关系从侧翼切入。若买方把 AI 驱动的缺口关闭视为一项服务功能，而不是平台护城河，Guidehealth 可以压缩感知 AI 差距。CareBridge 和 Landmark
              可以拆出工作流中的居家和 LTSS 部分。Main Street Health 以及 Homeward 式乡村运营商，则可能在本地可信度强于 Cityblock 既有城市品牌的地方取胜。简言之，Cityblock
              的优势在广泛整合，但广泛整合也比简单点状方案更难在采购中解释和证明。

              尽调结论因此是平衡的。相较 Medicare 占比很高的竞品，Cityblock 看起来确实有差异化，因为很少有对手从 Medicaid 和双重资格人群出发，更少有对手把社会护理与 AI
              驱动的护理编排结合起来。但市场里充满高度可信的专门公司和资本更充足的战略方。因此，护城河真实但有条件：当支付方希望为高需求 Medicaid
              和双重资格人群找到一个负责到底的伙伴时，它最能守住；当买方偏好模块化供应商堆栈、既有服务方赋能或面向老年人的诊所经济模型时，它会变弱。
