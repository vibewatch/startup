  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围和照护体验
        blocks:
          - type: paragraph
            body: >-
              Cityblock 交付给会员的是一套全栈照护体验，面向 Medicaid、Medicare Advantage，以及同时具备 Medicaid 与 Medicare
              资格、临床和社会需求复杂的会员。面向会员的公开材料显示，服务模式覆盖初级医疗、心理健康、社会照护、出院到居家过渡、上门紧急护理、社区诊所以及 24/7 虚拟访问。这点重要：Cityblock
              卖的不是单一数字入口或点状应用，而是一个结果导向的照护平台，技术、人员配置和本地照护交付高度绑定。会员可以在家、诊所、电话或线上接受服务，同一支照护团队也能协调临床需求、用药、福利问题，以及食物、住房、儿童照护、交通等社会支持。这种多模态设计是公司在政府资助人群中的价值主张核心，因为可及性障碍和健康社会决定因素往往与临床结果分不开。紧急护理、行为健康和社会导航被放进同一个品牌化照护模型，说明产品更想降低碎片化，而不是拉高就诊量。
