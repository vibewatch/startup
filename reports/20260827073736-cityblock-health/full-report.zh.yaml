  - id: TV007
    title: 投资逻辑摘要
    columns:
      - 维度
      - 优势
      - 劣势
      - 综合判断
    rows:
      - - 增长
        - 收入同比增长 77%，较 2021 年增长 323%
        - 未来仍有减速风险
        - 正面
      - - 规模
        - $2.2B 年化收入，接近 200k 会员
        - 规模本身不能证明盈利能力
        - 有保留的正面
      - - 护城河
        - 聚焦 Medicaid / 双重资格人群，并用 AI 支撑照护编排
        - 竞争对手和支付方仍可能更偏好模块化方案
        - 中度正面
      - - 估值
        - 0.55x 收入倍数相较可比公司似乎有折价
        - 折价可能反映隐藏的经济性弱点或优先权包袱
        - 若尽调确认质量，则为正面
      - - 风险
        - 部分运营指标明显改善
        - 监管、报销和合同经济性风险仍高
        - 正负混合
    notes: 综合判断是投资委员会视角下的综合观点，不是公司事实披露。
    claimRefs:
      - CV026
      - CV027
      - CV028
      - CV029
  - id: TV008
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 按市场拆分的毛利率
        - 市场层面毛利率和医疗成本表现
        - 判断低倍数是便宜还是警讯的核心检验
        - 索取市场 P&L 和支付方队列利润率桥表
      - - 现金跑道
        - 账面现金、月度烧钱速度和融资计划
        - 决定 Series E 轮是过桥资金还是持久现金跑道
        - 索取最新董事会材料和现金流量表
      - - 续约质量
        - 按队列拆分的支付方留存和净扩张
        - 增长质量比表面总收入更重要
        - 索取续约队列表和流失分析
      - - 股权结构表条款
        - 清算优先权、反稀释棘轮或堆叠保护条款
        - 普通股上行空间可能与名义估值大幅脱节
        - 索取 Series E 轮后股权结构表和证券条款
      - - 贡献利润率
        - 按地域和人群拆分的单位经济性
        - 验证乐观 / 基准 / 悲观假设所需
        - 索取队列层面贡献利润率明细
      - - 政策敏感性
        - 按 Medicaid 和 MA 报销制度拆分的敞口
        - 估值应反映监管下行，而不只是增长上行
        - 按项目和州梳理收入与利润率敞口
    notes: 这些问题刻意收窄，并直接绑定估值变动，而不是泛泛的尽调愿望清单。
    claimRefs:
      - CV031
      - CV032
      - CV033
