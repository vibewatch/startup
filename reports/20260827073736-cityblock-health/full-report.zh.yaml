  - id: TV005
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 视角
      - 核心观点
      - 支持证据
      - 哪些情况会改变判断
    rows:
      - - 投资逻辑
        - 收入规模真实且庞大
        - 2026 年披露 $2.2B 年化收入和 77% 增长
        - 独立审计收入节奏弱于公司主张
      - - 投资逻辑
        - 当前倍数异常低
        - 0.55x 收入倍数远低于 2021 年内部倍数和战略先例
        - 若收入质量被证明较差，低倍数可能合理
      - - 投资逻辑
        - 客户多元化改善
        - 医保计划客户数从 5 家增至 18 家
        - 如果客户数看似分散，但经济性仍由大合同主导
      - - 投资逻辑
        - 运营轨迹改善
        - Cityblock 称 EBITDA 和公司运营费用指标改善
        - 如果改善排除了核心合同成本，或不可重复
      - - 反向逻辑
        - 盈利能力仍不透明
        - 毛利率、合同利润率和现金转化仍未披露
        - 公司提供队列层面的市场经济性
      - - 反向逻辑
        - 降价融资心理阴影可能延续
        - 79% 重置可能损害招聘和下一轮融资观感
        - 后续出现有力战略动作或公开市场路径，会重置叙事
      - - 反向逻辑
        - 监管和报销压力没有消失
        - 政府项目资金和 MA 费率承压
        - 政策稳定且医疗成本表现有韧性，可降低担忧
      - - 反向逻辑
        - 股权结构表里的优先权包袱可能扭曲普通股上行空间
        - 估值重置后，后期轮次有时会嵌入重保护条款
        - 披露干净的优先股堆叠，会明显改善判断
    notes: 本表把各章证据汇总成可投资论点，并明确列出哪些证据会证伪或强化两边观点。
    claimRefs:
