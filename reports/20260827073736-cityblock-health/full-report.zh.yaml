      - number: '8.4'
        title: 投资建议、入场纪律和投资逻辑破裂条件
        blocks:
          - type: paragraph
            body: >-
              证据支持建设性但不应过度激进的立场。按约 0.55x 年化收入看，Cityblock
              并不明显昂贵，可比交易也说明，一旦经济性可信，规模化照护交付资产可以值更多钱。不过，这里的投资建议质量必须对证据敏感。公司仍是私营公司，近期估值证据部分来自二级市场或定价模型来源，关键投资论证输入仍未披露。因此，盲目「逢低买入」的结论太松。更好的判断是继续研究、偏正面：如果尽调确认市场层面利润率耐久性、合同留存、现金跑道，以及不存在惩罚性优先权悬顶的股权结构表，Cityblock
              可能被低估。入场纪律应聚焦哪些证据会改变判断。若核心市场之外也能确认正经营利润率扩张，续约质量得到独立佐证，并能看清 Series E
              后资本结构，就可以支持更积极立场。反过来，如果续约队列偏弱、现金消耗与收入基数不匹配，或堆叠优先权存在隐藏悬顶，就说明当前估值是陷阱而不是机会。本章最终估值立场是在相对筛选指标上有吸引力，但信心只有中等，因为太多决定性证据仍留在私域。
