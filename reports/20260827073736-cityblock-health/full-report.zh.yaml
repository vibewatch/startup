      - number: '2.2'
        title: 市场规模、TAM/SAM/SOM 与扩张视角
        blocks:
          - type: paragraph
            body: >
              最宽的公开市场口径是全球价值医疗服务市场。Mordor Intelligence 估计该市场 2026 年为 $2.27 trillion，并预计到 2031 年达到 $5.17 trillion，CAGR 为
              17.86%。这个数字在方向上有用，因为它捕捉到报销机制正快速远离按服务收费，但它太宽，不能作为 Cityblock 的运营 TAM。Cityblock 并不试图拿下商业保险、Medicare
              和国际市场中的全部价值医疗支出；它是一个聚焦政府项目的运营商，对 Medicaid 和双重资格人群暴露集中。

              更相关的视角从政府资助覆盖人数开始。公开资料显示，合并 Medicare 和 Medicaid/CHIP 并扣除重叠后，仍有超过 120 million
              名美国人通过主要政府项目获得覆盖。在这个池子里，Medicaid 管理式医疗尤其重要，因为它把预算责任集中在健康计划层面的合约和委托 PMPM 关系上。Georgetown CCF 报告称，2026 年 4
              月全国 Medicaid 管理式医疗入组人数为 66.7 million，低于 2025 年 7 月的 70.4 million；重新认定和政策变化减少了覆盖人群。收缩很关键：即使财政压力让价值医疗交付对州政府和
              MCO 更具战略意义，Cityblock 这类服务方短期可归因的会员基数仍被压缩。

              再窄一层的市场口径，是最贴近外包护理交付基础设施的价值医疗服务细分。Mordor 单独测算 VBC 服务细分市场 2025 年为 $4.14 billion、2026 年为 $4.55 billion，到
              2031 年 CAGR 为 9.9%。该细分可作为直接变现层的有用代理：运营商交付临床和护理管理服务，而不只是提供软件。对 Cityblock 而言，一个务实的 SAM
              包括在健康计划愿意委托长期护理责任的地域内，通过按人头付费或 PMPM 安排归因的 Medicaid、双重资格和相邻政府项目会员。公开报道并不支持干净的独立 SOM，但 Cityblock 2026 年 8
              月交易披露显示，与 Homeward 合并后服务会员约 200,000 名，这提供了已实现规模锚点，而不是完整市场规模公式。
