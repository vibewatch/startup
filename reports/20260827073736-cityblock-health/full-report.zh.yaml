      - number: '6.3'
        title: 留存风险和购买标准
        blocks:
          - type: paragraph
            body: >-
              价值医疗里的客户留存，较少取决于品牌营销，更多取决于可衡量的运营表现。健康计划买家会关心医疗成本趋势下降、Star 或质量结果、会员体验、实施可靠性、监管准备度，以及 Cityblock
              能否在不降低服务质量的情况下扩张。公开证据显示 Cityblock 已积累足够可信度，拿下蓝筹支付方关系；但外部投资人仍需要合同层面的续约率、贡献利润率以及不同队列结果差异证明。Homeward
              合并又加一层：它扩大潜在买家范围和地域覆盖，但也提高整合风险，并可能在过渡期改变账户优先级。因此，核心尽调视角应是 Cityblock
              是否更深嵌入客户工作流，而不是单纯变大。强客户价值会体现在多年续约、现有账户内地域扩张，以及用例扩展到更多会员分层。对投资人而言，决定性问题是买家把 Cityblock
              看作可替代供应商，还是嵌入式基础设施。前者会封顶定价权；后者会支撑更高续约概率和长期账户扩张。本节有意把客户质量与企业购买行为、实施可靠性和账户级扩张绑定，因为这些变量最直接决定增长是否持久。
