      - number: '7.6'
        title: 正确的投资论证回应应是带明确终止条件的风险监控框架，而不是基于现有证据简单二选一
        blocks:
          - type: paragraph
            body: >-
              Cityblock
              的风险很严肃，但也可以监控。关键投资论证问题在于，公司能否在政策震荡和支付方节流期间维持合同表现和利润率轨迹。因此，投资人应把本章当作监控框架。监管风险的首要缓释措施，是逐州做扎实准备：豁免工作流、续保支持、资格导航，以及在可行时把重新认定或政策冲击风险与支付方伙伴共同承担的合同语言。财务上，公司必须证明的不只是增长，还包括现金转化、准备金纪律，以及市场和支付方队列层面的续约耐久性。运营上，应按月跟踪
              Homeward 整合里程碑、关键职能员工留存，以及按地域拆分的质量或互动结果。技术上，管理层应拿出具体的 AI
              治理、隐私和模型表现证据，而不是宽泛效率声明。如果政策驱动的会员流失实质性削弱可归因规模，如果收入变大但利润率停滞，如果 Homeward 整合扰乱表现，或如果主要支付方释放信号称低风险赋能替代方案优于
              Cityblock 的全栈模型，投资逻辑就会破裂。
