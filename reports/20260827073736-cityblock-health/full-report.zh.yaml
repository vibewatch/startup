      - number: '4.5'
        title: 财务结论与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              Cityblock 的投资论证，在规模上比在透明度上更扎实。正面看，公司收入看起来已经很大、增长很快，利润率轨迹在改善，客户名单也在扩大；这个领域的支付方关系很难拿下。2026 年约 0.5x
              年化收入的估值，相比历史私募预期异常低；如果收入质量和现金转化经得起审查，可以理解为有吸引力的入场点。负面看，同一个倍数也可能说明，公开市场和后期投资人怀疑价值医疗经济性是否持久、医疗成本表现是否可预测，或管理层所称百分比改善背后是否真能产生现金。公开证据仍缺少实际定价、单会员经济性、续约队列、地域盈利、账上现金，以及债务或风险分担义务。因此，正确结论不是
              Cityblock 显然便宜，而是在单位经济性和合同层面利润率得到证明前，它可能被错定价。严肃投资人应先索要队列、市场和现金流数据，再把这轮降价轮视为机会，而不是迟来的重新定价。
