  - id: TP003
    title: 定价 / 打包方式对比
    columns:
      - 竞争对手
      - 买方 / 签约路径
      - 公开打包信号
      - 收入逻辑
      - 采购含义
    rows:
      - - Cityblock
        - Medicaid MCO / MA / 双重资格导向计划及合作伙伴
        - 整合式照护交付平台，加上 LTSS 和社区支持
        - 价值导向合同，降低总成本、改善健康结局带来上行收益
        - 买方需要相信整合模式能胜过单点方案拼盘
      - - Oak Street Health
        - 健康计划 / MA 经济账 / 战略母公司协同
        - 面向老年人的初级保健中心模式
        - 全风险诊所经济模型与中心级扩张
        - 诊所经济模型上是强参照，但对 Medicaid 占比较高的招标相关性较弱
      - - Aledade
        - 独立诊所与医疗系统
        - 赋能服务加网络参与
        - 共享节余 / VBC 赋能经济模型
        - 比外包照护交付扰动更小的替代方案
      - - One Medical Seniors
        - 老年人和与支付方对齐的渠道
        - 消费者友好的老年初级保健，叠加混合品牌
        - 会员 / 就诊模式，加上按客群配置的支付方合同
        - 消费者体验强，但不是为 Medicaid 社会复杂性量身定制
      - - Landmark Health
        - 聚焦最高风险会员的支付方
        - 居家高急重度管理
        - 靠减少住院和更严密的慢病控制节省成本
        - 专科附加服务可替代 Cityblock 部分居家端价值
      - - ChenMed
        - Medicare Advantage 支付方和老年人
        - 预防导向的老年 PCP 模式
        - 按人头付费 / 全风险 MA 经济模型
        - 已验证，但套餐大体局限于老年 / MA 场景
      - - Devoted Health
        - 自有 / 合作 MA 经济模型内的会员
        - 保险加照护协调套餐
        - 支付方兼服务方跨保费和照护获取利润
        - 一体化激励可跑赢纯供应商经济模型
      - - Guidehealth
        - 医疗系统 / 支付方 / 服务提供者集团
        - AI 平台加赋能服务
        - 服务加平台价值，绑定缺口闭环和绩效
        - 买方想要技术和运营、不想新增一线品牌时，Guidehealth 有机会胜出
      - - CareBridge
        - Medicaid HCBS 项目和管理式护理买方
        - 24/7 支持加 HCBS / 社区照护工作流
        - PMPM 或项目化支持经济模型，与会员结局和使用率挂钩
        - 可从更大的 Cityblock 范围中切走 LTSS / HCBS 预算
      - - Wellvana
        - 诊所、医疗系统和支付方
        - 伙伴关系驱动的 VBC 赋能项目
        - 共享节余 / 绩效服务
        - 对抵触外部照护交付供应商的在位者有吸引力
    notes: 这一品类通常不公开精确定价；本表比较的是打包方式和变现姿态，而非未披露的标价。
