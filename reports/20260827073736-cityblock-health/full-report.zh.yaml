      - number: '2.5'
        title: 约束、风险与市场摩擦
        blocks:
          - type: paragraph
            body: >
              同一市场也有严肃约束。第一，H.R. 1 及联邦 Medicaid 政策变化预计会随着时间推高退保、减少覆盖人数。KFF 对 CBO 分析的摘要显示，该法案将在十年内削减联邦 Medicaid 支出 $911
              billion，并在 2034 年让无保险人口增加 10 million，其中 Medicaid 工作要求发挥重要作用。Cityblock
              面临的含义是：即使单个会员的病情严重度和护理需求仍高，入组人数减少也意味着可归因会员更少。

              第二，联邦和州资金压力既能帮这个模式，也能伤这个模式。预算压力可能加速对 VBC
              的兴趣，但也会提高费率敏感度、拉长采购周期并加强合约审查。承压的州或健康计划可能想要更好结果，却仍不愿把利润空间委托给外部运营商。第三，劳动力短缺仍是硬运营约束。2026
              年初级保健和行为健康资料描述了持续的临床人员稀缺、服务方分布不均，以及劳动力发展投入不足。Cityblock 模式依赖多学科团队，劳动力瓶颈会在需求强劲时仍限制扩张。

              第四，行政复杂度仍高。Medicaid 项目因州、MCO 合约、质量指标、数据共享成熟度和监管要求而异。双重资格护理又多一层碎片化，因为激励和福利横跨 Medicare 与
              Medicaid。第五，相邻市场中的报销和政策不确定性仍然重要，包括 Medicare Advantage
              费率收紧，以及围绕承担风险的服务方应获得多少报酬来管理公共受益人的更广泛争论。这些摩擦并不推翻市场；它们解释了规模为何难以建立，也解释了为什么只有少数运营商达到有意义的全国相关性。
