      - number: '3.3'
        title: 赋能型和网络型竞争者对分销的威胁大于对护理交付的威胁
        blocks:
          - type: paragraph
            body: >-
              Aledade、Main Street Health、Guidehealth 和 Wellvana 具有战略重要性，因为它们帮助支付方或服务方群体在价值医疗中成功，却不要求这些群体把完整会员关系交给
              Cityblock。Aledade 尤其重要。官方 2026 年报告称，它服务超过 3,000 家初级保健组织和超过 3 million
              名患者；公司更广义的定位则强调由医生主导的价值医疗，并支持独立诊所、社区健康中心和健康系统。这给了 Aledade Cityblock 所没有的分销足迹和本地服务方协同模式。Main Street Health
              同样重要，因为它围绕乡村服务方合作建立；Cityblock 正通过 Homeward 向城市以外扩张，这一点让 Main Street Health 更相关。

              Guidehealth 和 Wellvana 从 AI + 服务和赋能角度竞争。Guidehealth 网站称其 AI 医疗平台用临床智能和人的同理心关闭缺口、让医疗更可负担；第三方 2026 年 KLAS
              报道则把 Guidehealth 列为表现最好的价值医疗赋能公司之一。Wellvana 材料强调与医院、系统、独立诊所和支付方合作，释放价值医疗表现。这些公司都不是 Cityblock
              的直接复制品，但每一家都可能截流支付方预算：它们承诺风险管理、缺口关闭和结果改善，却不要求支付方采用 Cityblock 的社区交付模式。

              这是一个微妙但真实的威胁。Cityblock 的护城河部分建立在一个判断上：复杂 Medicaid
              和双重资格人群需要深度整合的护理平台。赋能型竞争者反驳说，许多结果可以靠升级既有服务方网络拿到，而不是替换网络。如果支付方认为，本地诊所加赋能软件更便宜，或在政治上更容易接受，而不是外包给 Cityblock
              式模式，即使 Cityblock 的临床模式更强，也可能失去扩张机会。Homeward 收购增加了乡村和本地市场可信度，借此回应这个问题，但争夺支付方预算份额的底层竞争仍然尖锐。
