companyProfile:
  summary: >-
    Cityblock Health 成立于 2017 年，总部在 Brooklyn，从 Alphabet 旗下 Sidewalk Labs 孵化器走出。公司提供价值医疗，专门面向 Medicaid、Medicare Advantage
    和双重资格人群——他们通常有复杂的医疗与社会需求。Cityblock 的模式把初级保健、行为健康、紧急护理和社会服务整合起来，既靠线下社区团队，也靠虚拟护理，并与健康计划签订按人头付费合约。截至 2026 年 8 月，公司宣布由
    General Catalyst 领投的 $116M Series E，并签署收购 Homeward Health 的最终协议；交易后服务人群接近 200,000 名会员，年化收入达到 $2.2
    billion。尽管运营增长强劲，公司估值已从 2021 年 $5.7B 的峰值回落到约 $1.2B，反映数字健康市场整体修正，以及投资者对单位经济模型的关注。
