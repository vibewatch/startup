      - number: '7.5'
        title: 技术、隐私和衡量风险很重要，因为 Cityblock 的 AI 故事已经成为运营逻辑的一部分
        blocks:
          - type: paragraph
            body: >-
              Cityblock 越来越把 CORE 平台和 AI 赋能工作流层放进叙事，用来说明它为什么能更高效地管理复杂人群。这里有机会，也新增了一类独立风险。医疗 AI
              产品在隐私、安全、可解释性、模型治理，以及不准确建议可能带来下游临床或行政伤害等问题上，正受到更多审视。即便系统只是用于分诊、照护导航或评估支持，而不是自主诊断，支付方、监管方和提供方伙伴仍会追问受保护健康信息是否处理得当，模型输出是否会在弱势人群中造成差异化影响或系统性错误。Medicaid
              和双重资格人群会放大这些担忧，因为文档质量、社会风险编码和跨场景数据完整性往往参差不齐。对 Cityblock 而言，实际风险今天不太像单一头条级 AI
              丑闻，更像沉默的低表现：如果模型输出噪声大、工作流集成脆弱，或隐私防线遭到质疑，技术层可能无法兑现管理层叙事中暗示的劳动生产率和质量提升。那会同时削弱利润率故事，以及市场给更广平台的战略溢价。
