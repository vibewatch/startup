      - number: '6.2'
        title: 客户分层和扩张
        blocks:
          - type: paragraph
            body: >-
              公司服务人群按项目类型看很多元，尽管获客来自更窄的一组企业买家。现有证据指向重度 Medicaid 暴露、显著的双重资格定位、部分 Medicare Advantage 关系，以及 Homeward
              交易后的覆盖扩大。这种分层很重要，因为每条项目线都有不同经济性、风险调整机制、照护模型和会员获取逻辑。Cityblock
              的价值主张在计划方需要整合初级医疗、行为健康、居家支持和社会照护导航，以改善高需求会员结果时尤其有共鸣。扩张机会可能来自现有计划账户内加深渗透、交叉销售更多产品或地域，以及拓展到相邻的农村和政府项目类别。上行空间可观，因为一旦模型嵌入，计划方往往更愿意减少运营伙伴数量；约束在于，每个新市场都可能需要漫长实施、本地临床招聘，以及逐个伙伴证明价值。最重要的分析细节是，客户多元化可以改善，但集中度仍然不低，因为少数大型计划仍可能贡献大多数覆盖生命。这让关系深度有价值，也提高了对少数企业交易对手的依赖。本节有意把客户质量与企业购买行为、实施可靠性和账户级扩张绑定，因为这些变量最直接决定增长是否持久。
