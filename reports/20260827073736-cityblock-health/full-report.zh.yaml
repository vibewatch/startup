          value: $2.27T (2026)
          note: 全球市场估算；预计到 2031 年达到 $5.17T，CAGR 为 17.86%
        - label: 美国政府资助保险覆盖池
          value: 120M+ Americans
          note: Medicare 和 Medicaid/CHIP 覆盖合计，并提示重叠口径
        - label: Medicaid 管理式医疗会员
          value: 66.7M members
          note: 2026 年 4 月参保人数；低于 2025 年 7 月的 70.4M
        - label: Cityblock 合计服务会员数
