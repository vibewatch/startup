      - number: '8.2'
        title: 收入倍数背景：战略交易和私募可比公司
        blocks:
          - type: paragraph
            body: >-
              按简单估值收入比看，Cityblock 筛出来很便宜。用已披露的 2026 年 8 月约 $1.2 billion 估值，对比约 $2.2 billion 年化收入，当前倍数接近 0.55x。这远低于
              Cityblock 自身 2021 年融资隐含的倍数，远低于 CVS 收购 Oak Street Health 支付的战略价值，也低于投资人过去能接受的、有可信增长的规模化价值医疗平台水平。Oak Street
              以 $10.6 billion 卖给 CVS，以及 Amazon 以 $3.9 billion 收购 One
              Medical，并不是完全可比参照，因为两笔交易都有战略买家、消费者或老年初级医疗定位，以及不同报销组合。即便如此，它们说明，一旦买家相信能够创造下游医疗成本、分销或会员留存价值，规模化且承担风险的初级医疗资产可以拿到高得多的估值。私募类比也指向同一方向。Aledade
              2021 年融资估值约 $3.1 billion，Devoted Health 2021 年估值超过 $12
              billion，显示市场过去愿意为结合支付方杠杆、提供方基础设施或照护管理规模的模型付出高价。正确结论不是 Cityblock 今天应当拿到那些历史估值，而是 0.55x
              收入很可能包含了对执行和行业情绪的惩罚性折价，而不是中性的行业出清价。
