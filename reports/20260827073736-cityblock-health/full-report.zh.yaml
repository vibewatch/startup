      - number: '5.4'
        title: 环境式文档和临床人员生产力
        blocks:
          - type: paragraph
            body: >-
              Cityblock 把 AI 用到照护团队工作流中，最清晰的例子之一是环境式临床文档。公司 2026 年 AI 报告描述的临床自然语言处理，不是下班后补记录，而是在照护过程中实时生成摘要和临床文档。一位
              Cityblock 精神科医生在引述中说，环境式记录助手可以在生成病历时把西班牙语就诊内容翻译成英语，并准确记录一次复诊，同时显著减轻下班后写病历的负担。这个产品细节有意义，因为 Cityblock 服务
              Medicaid 和双重资格人群，语言可及性、连续性和临床人员倦怠都是运营重点。公司看起来不把环境式记录定位为独立 SKU，而是把它作为支撑 Cityblock
              照护团队的内部生产力层。它减少图表录入时间，结构化就诊数据，让多语言照护更容易写入英语临床系统，从而补上更广泛的工作流自动化。再配合就诊前摘要和同步照护缺口提示，环境式记录助手就不再是孤立的生成式 AI
              功能，而成为更大闭环文档与行动系统的一部分。
