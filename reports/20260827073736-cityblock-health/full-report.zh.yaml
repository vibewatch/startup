      - number: '4.2'
        title: 收入规模、客户扩张与收入增长质量
        blocks:
          - type: paragraph
            body: >-
              Cityblock 财务画像中最强的正面信号，是收入增长的规模和持续性。管理层和独立报道一致指向 2026 年约 $2.2 billion 的年化收入，同比增长 77%，较 2021 年基线高出约
              323%。同样重要的是，客户集中度看起来已有改善，因为健康计划客户从 5 家扩展到 18 家，说明增长并非完全依赖一两个锚定合约。Cityblock
              的收入模型仍面向支付方、基于合约，通常比直面消费者的数字健康模式更有可见度；但收入质量仍取决于医疗成本节省交付、利用率管理和会员互动结果，而外部人无法完全从公开材料审计这些结果。因此，收入线看起来真实且可观，但在财务赞助方能够承销
              77% 增长率的可持续性之前，尽调仍需要队列层面的续约、总额到净额和合约利润率数据。实际看，收入规模已经支持一个判断：公司已经从风投实验跨入医疗运营商，哪怕公开证据在按市场和支付方队列拆分的贡献利润率上仍较弱。
