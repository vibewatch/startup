      - number: '7.4'
        title: 即使 Cityblock 仍有差异化，市场收缩和更强既有玩家也可能压窄扩张路径
        blocks:
          - type: paragraph
            body: >-
              Cityblock 面对的不是稳定或空白市场。它试图在政府资助医疗中扩张，但一些最大型管理式医疗组织正在更谨慎地看待 Medicaid 暴露。2026 年，关于 Elevance 和 Centene
              的报道指向更多 Medicaid 市场退出或收缩，原因是盈利能力和资金支持不足；按照 Georgetown CCF 对 CMS 数据的解读，全国 Medicaid 入组人数从 2025 年 7 月约 70.4
              million 降至 2026 年 4 月 66.7 million。这些趋势很重要，因为承压计划方可能优先选择成本更低的赋能工具、限制新试点，或降低价值医疗安排的慷慨度。与此同时，Cityblock 面临来自
              Oak Street、One Medical/Amazon 等规模化 Medicare 中心照护运营商的直接竞争，也面临 Aledade、Guidehealth、Wellvana
              等赋能和分析供应商；后者可以给支付方一条垂直整合程度较低的路径。也就是说，Cityblock 的护城河真实存在，但有条件。买家想要一个单一负责的运营商来服务高需求 Medicaid
              和双重资格人群时，护城河最强；MCO、州或提供方集团更愿意模块化服务、退出风险地域，或把社区化照护视为成本中心而不是战略差异点时，护城河最弱。
            claimRefs:
              - CR028
              - CR029
              - CR030
