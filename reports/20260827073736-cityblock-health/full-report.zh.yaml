  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 融资重置与当前资本结构背景
        blocks:
          - type: paragraph
            body: >-
              Cityblock 2026 年 8 月 Series E 是重塑当前投资者视角的关键财务事件。这轮 $116 million 融资由 General Catalyst 领投，估值约 $1.2
              billion，远低于 2021 年 3 月和 9 月融资对应的 $5.7 billion
              私募市场峰值。重置很重要，因为它不是收入崩塌造成的；相反，多方资料描述的业务仍在增长，年化收入运行率达到数十亿美元级，只是私人数字健康估值被压缩。因此，这轮融资似乎同时承担三件事：补充资产负债表灵活性，验证公司把规模转化为更好
              EBITDA 和运营费用效率的能力，并把所有权预期重设到更低但可能更站得住的入场点。反向解读同样重要：五年内估值下降
              79%，说明早期投资者为增长支付过高价格，未来估值上调取决于利润率耐久性的持续证据，而不只是会员扩张。Cityblock
              的融资故事，最好被理解为一场仍在进行的测试：价值医疗平台能否在支付方合约下证明运营杠杆，从而跑赢数字健康低迷周期。
