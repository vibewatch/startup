      - number: '3.2'
        title: Medicare 诊所对手主导规模，但不主导 Medicaid 专业化
        blocks:
          - type: paragraph
            body: >-
              Oak Street Health 和 ChenMed 最清楚地提醒市场：当经济模型锚定老年人和 Medicare Advantage，承担风险的初级保健可以规模化。Oak Street 称其成立于 2012
              年，现为 CVS Health 一部分，专门通过全面预防性初级保健帮助老年人。围绕 2023 年 CVS 收购的公开报道，把 Oak Street
              定位为全风险初级保健资产，拥有全国诊所密度和有纪律的中心扩张模式。ChenMed 自有材料同样强调面向老年人的预防性初级保健，以及围绕老年人设计的 VIP 式关系模式。One Medical Seniors
              建立在 Iora Health 模式之上，现在由 Amazon 通过 One Medical 持有，又增加了一个团队式、技术驱动的老年护理竞争者，并具备广泛消费品牌优势和大型母公司资本。

              这些企业很重要，因为它们已经证明，全风险、高接触的初级保健能在全国规模上跑通。它们也证明大型战略方愿意为这类资产支付高价：CVS 买下 Oak Street，Amazon 则在 One Medical 已吸收
              Iora 之后买下 One Medical。这种战略背书提高了 Cityblock 的门槛，因为它竞争的不只是创业公司，还有零售和科技巨头支持的平台。用投资人的话说，Cityblock
              不是在防守一块市场空白，而是在一个更大公司已视为战略重点的市场中，防守一个更难服务的细分。

              即便如此，这些以 Medicare 为中心的对手并不是完美替代。它们的公开定位仍面向老年人、Medicare 或 Medicare Advantage 经济模型，而不是社会需求负担很重、以 Medicaid
              优先的人群。Cityblock 的差异化恰恰在这些诊所模式最弱的地方最强：把社会护理、行为健康和非医疗支持整合进护理模式，而不是把它们当成相邻服务。由此形成的竞争关系真实存在，但只部分重叠。Oak
              Street、ChenMed 和 One Medical Seniors 在护理模式执行和资本可及性上是强劲对照，但它们没有抹掉 Cityblock 的核心判断：Medicaid
              优先的护理需要一套不同的操作系统。
