      - number: '4.4'
        title: 资本充足性、融资依赖与下一轮触发因素
        blocks:
          - type: paragraph
            body: >-
              即使累计融资超过 $1 billion，Cityblock 仍更像一家融资需求取决于执行质量、而不是单纯生存压力的公司。新的 Series E 让七轮披露融资的累计融资额达到约 $1.02
              billion，重磅支持方包括 General Catalyst、SoftBank、Tiger Global、Thrive Capital、Maverick Ventures、Redpoint
              Ventures、Kinnevik、Wellington、8VC、Echo Health Ventures、Goldman Sachs 和 Alphabet 旗下 Sidewalk
              Labs。投资者联盟深度降低了短期融资风险，但下调轮条款也说明，资本仍然可得，只是价格较 2021 年明显更低。因此，下一轮触发因素很可能不只是现金跑道，而是证明 EBITDA
              改善、客户多元化和收入增长足够持久，能支撑公开市场路径或高溢价战略结果。如果增长在利润率变硬前放缓，Cityblock
              可能还需要以只略好一点的条款融资，尤其在数字健康倍数仍被压缩时。反过来，如果公司能把年化收入规模转化为可信的自由现金流，当前轮次可能被证明是一座重置桥，而不是困境信号。
