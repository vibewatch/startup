      - number: '3.4'
        title: 居家与社区护理对手在复杂需求管理上重叠最多
        blocks:
          - type: paragraph
            body: >-
              Landmark、CareBridge 以及 Devoted 模式的一部分，与 Cityblock 在诊所四墙之外管理医疗和社会复杂会员方面重叠最强。Landmark
              以为多种慢病和高敏锐度人群提供居家医疗而闻名，是价值医疗合约中最昂贵会员的强对照。CareBridge 官方材料更接近 Cityblock 的非诊所逻辑：公司称它帮助居家和社区场景中的个人最大化健康与独立性，提供
              24/7 会员支持，服务超过 100,000 名会员，并围绕会员、家庭、照护者、支付方和服务方的跨学科支持定位。Cityblock 2026 年 2 月 LTSS 扩张同样把 Medicaid
              和有复杂需求的双重资格人群放在中心，用 AI 简化评估，并把长期服务与支持同更广义护理管理整合起来。

              Devoted 不那么专注居家护理，但仍与竞争有关，因为它展示了支付方与护理一体化模式的力量。Devoted 称自己提供 Medicare Advantage
              计划，但目标是通过深度支持会员健康，成为不止于健康计划的公司。Payvider 结构在签约谈判中可能很有力，因为它内化了更多经济模型；Cityblock 则常常必须与外部健康计划谈判。换句话说，Devoted
              不仅能在护理体验上竞争，也能在利润架构上竞争。

              这些竞争者的共同线索是控制高成本人群。Cityblock 的差异化在于，它把面向 Medicaid
              和双重资格人群的居家、社区、行为和社会干预组合在一套运营模式下。风险在于，支付方可能模块化采购这些功能：Landmark 做居家护理，CareBridge 做 HCBS
              支持，其他供应商做导航或分析。当整合执行带来比模块化堆栈更好的结果或更低总成本时，Cityblock 获胜；如果买方认为能以更低成本从专门供应商拼出这套堆栈，Cityblock 就会失利。
