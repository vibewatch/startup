      - number: '8.3'
        title: 投资逻辑、反向逻辑，以及乐观 / 基准 / 悲观情景逻辑
        blocks:
          - type: paragraph
            body: >-
              正向投资论证很直接。Cityblock 有真实规模、近期增长很快、客户名单比 2021 年更广，官方声称 EBITDA 和公司运营费用效率改善，并且聚焦差异化的 Medicaid
              与双重资格人群，面对很大的政府项目机会。如果尽调证明这些信号可持续，当前价格可能显得保守，因为即便倍数适度向其他价值医疗参照回归，也会在 $1.2 billion
              入场估值上创造可观上行。反向逻辑同样强。Cityblock
              作为私营公司，在毛利率、队列盈利能力、合同续约、现金转化、清算优先权，以及承担风险照护合同中的下行暴露上仍不透明。降价轮也可能自我强化：此前一轮严重重置后，员工士气、未来招聘和后续融资都可能变难。因此，情景分析比点估计精确度更重要。乐观情景下，投资人假设增长持续、利润率变硬、行业倍数反弹。基准情景下，Cityblock
              在增长中走向更好经济性，但在公开市场或战略买家相信其持久现金生成能力前，估值仍打折。悲观情景下，单位经济性尚未充分证明前增长放缓，公司还需要更多资本，而价格只小幅改善。
