    type: pyramid
    layout: standard
    summary: |
      Cityblock 的机会可以框定为一座逐层收窄的金字塔：从全球价值导向医疗市场，到美国政府项目覆盖人群，再到 Medicaid 管理式医疗，最后落到 Cityblock 当前已服务会员规模。
