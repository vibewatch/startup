      - number: '7.2'
        title: 降价轮解决了短期融资需求，但凸显盈利能力和报销风险仍未解决
        blocks:
          - type: paragraph
            body: >-
              Cityblock 2026 年 8 月 Series E 缓解了眼前流动性压力，但没有消除资本风险。此轮融资带来 $116 million，并证明 General Catalyst
              继续支持；但它也把私募估值重置到约 $1.2 billion，而公司此前估值接近 $5.7 billion。约 79%
              的跌幅太大，不能简单归为市场噪音；它说明投资人现在要的是持久利润率证明，而不只是规模证据。公开材料显示，公司约有 $2.2 billion 年化收入、77% 同比增长，公司运营费用强度和 EBITDA
              利润率也在改善，但这些数据都不能证明 GAAP 盈利或正自由现金流。公司仍在价值医疗模型中运营，不利的医疗成本表现、准备金需求或报销收紧，都可能抹掉已报告的效率提升。Medicare Advantage
              基准压力和州 Medicaid 资金约束推动计划方更强硬地与委托或承担风险的照护伙伴重新谈判，这让上述问题尤其重要。在这种环境下，Cityblock
              的财务风险不是明天就破产，而是一个资本消耗较重、临床复杂度高的模型继续增长，却产生不了足够利润率，无法赢得高得多的倍数，或在较慢增长情景下避免未来稀释。
