  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 市场框架与 Cityblock 的位置
        blocks:
          - type: paragraph
            body: >-
              Cityblock 的竞争集合横跨多个相邻类别，而不是一个干净的同类群组。Oak Street Health、ChenMed 和 One Medical Seniors 代表以诊所为中心、主要面向
              Medicare 老年人的全风险或风险导向初级保健模式。Landmark 和 CareBridge 代表面向高敏锐度或长期支持人群的居家与社区护理路径。Aledade、Main Street
              Health、Guidehealth 和 Wellvana 则通过服务方赋能、分析和价值医疗运营切入市场，而不是自己拥有大多数一线护理。Devoted Health 是最相关的整合式 payvider
              对照，因为它把保险经济模型与护理交付协调结合起来。这种组合很重要，因为 Cityblock 的业务触及所有这些层面：护理交付、居家支持、社会服务、风险管理和签约。

              Cityblock 官方材料显示，它与多数竞争对手的起点很不一样。公司围绕 Medicaid、低收入 Medicare
              和有复杂需求的双重资格会员定位，护理模式结合初级保健、心理健康、社会护理、紧急护理和出院到居家支持。Cityblock 2025 年双重资格报告称，双重资格会员数自 2020 年以来增长 8x；这些会员中 86%
              有两种以上慢性病，69% 有行为健康需求，超过 30% 已识别出急性社会需求。这个人群画像带来的运营环境，比典型以 Medicare 报销和诊所吞吐为主的老年初级保健模式更难。

              因此，竞争地图是不对称的。Cityblock 很少遇到在所有维度都更强的对手。相反，每个竞争者都在更窄轴线上更强：Oak Street 和 ChenMed 有成熟老年诊所打法，Aledade
              有分布式独立诊所触达，Landmark 和 CareBridge 擅长居家复杂需求，Main Street Health 更贴合乡村，Guidehealth 走 AI 前置赋能，Devoted 拥有
              payvider 激励。Cityblock 的逻辑是，除非这些较窄优势被整合进一个社区模式，否则加总起来并不会为 Medicaid 和双重资格人群提供更好方案。
