  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础和分销
        blocks:
          - type: paragraph
            body: >-
              Cityblock 主要通过机构交易对手销售，而不是直面消费者渠道。实际客户是 Medicaid 管理式医疗计划、Medicare Advantage 计划、ACO 或委托风险实体；与 Homeward
              合并后，还包括需要本地照护交付基础设施的更广泛政府项目伙伴。这一区分很重要，因为会员增长本身不能证明商业耐久性；公司还必须持续拿下、扩张并续签复杂的支付方合同。公开材料显示，2026 年与 Homeward
              合并后，公司已覆盖多个州，会员基数接近 200,000，客户名单横跨城市 Medicaid 人群、双重资格会员、ACA
              人群，以及更多农村受益人。因此，客户故事本质上是集中的企业级分销，上面再叠加终端会员互动。Cityblock
              在健康和社会需求复杂的会员场景里似乎最强，因为计划方需要深度社区化照护管理；但这也意味着收入集中、续约风险和实施质量仍是核心尽调问题。实际销售动作可能比经典消费者营销指标更依赖采购周期、精算信心、实施规划和本地网络策略。如果运营模型有效，一个支付方可以快速扩张；如果服务一致性下滑，也可以暂停。本节有意把客户质量与企业购买行为、实施可靠性和账户级扩张绑定，因为这些变量最直接决定增长是否持久。
