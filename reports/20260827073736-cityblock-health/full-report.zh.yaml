      - - 基准
        - 增长放缓但仍健康，利润率逐步改善，估值折价只部分收窄
        - 1800-3000
        - 按当前公开证据看最可能
        - 留存、烧钱速度和股权结构表更透明
      - - 悲观
        - 增长放慢，经济性仍不透明，重估前还需要更多资本
        - 800-1400
        - 若降价轮包袱持续，影响会较大
        - 续约疲弱、高烧钱，或不利政策冲击
      - - 失败情景
        - 医疗成本或监管压力打破合同经济性
        - 低于 800
        - 可见度低，但后果严重
        - 收入规模无法转化为现金流韧性的证据
    notes: 区间是分析性情景带，以已观察到的当前和历史估值、可比公司收入倍数为锚，并非管理层指引。
