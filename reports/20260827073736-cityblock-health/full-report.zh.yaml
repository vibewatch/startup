chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 起源、总部与使命
        blocks:
          - type: paragraph
            body: >-
              Cityblock Health 成立于 2017 年，脱胎于 Alphabet 旗下 Sidewalk Labs
              重新设计弱势社区基础城市服务的项目。公司长期把自己定位为服务医疗与社会复杂度最高人群的医疗组织，而不是面向商业保险、数字原生消费者的健康科技公司。公开画像和公司材料都把业务放在纽约
              Brooklyn，并把起源叙事连接到这样一些社区：碎片化医疗、住房不稳定、食物不安全和行为健康需求共同加重慢病负担。这个起点有战略意义，因为 Cityblock
              的运营假设不只是远程医疗更方便，也不是狭义就医导航；它是一套全栈、价值医疗交付与护理管理模式，面向政府付费人群。该人群的结果既取决于临床可及性，也取决于社会支持。

              到 2026 年 8 月，公司叙事已把使命直接锚定在 Medicaid、Medicare Advantage 和双重资格会员；Homeward 交易又把同一逻辑从高密度城市市场延伸到乡村县域。CNBC、Fast
              Company 和 Healthcare Brew 的独立报道同样把 Cityblock 描述为 Sidewalk Labs 分拆出来、聚焦低收入或 Medicaid
              人群的公司。公司与第三方资料长期保持同一定位，说明即使收入基数和地域范围已大幅扩张，核心使命仍然稳定。尽调时，应首先把 Cityblock 理解为政府项目结果公司，其次才是健康科技公司。
