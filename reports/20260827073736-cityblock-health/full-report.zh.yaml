      - number: '1.5'
        title: 里程碑、合作伙伴、收购活动与负面信号
        blocks:
          - type: paragraph
            body: >-
              Cityblock 的里程碑路径显示，公司不到十年就从孵化概念走到全国性政府项目护理平台。公开资料支持的时间线包括：2017 年成立，2018 年至 2021 年多轮融资，2020 年扩张到六个州，2022 年
              Ajayi 升任 CEO，2023 年 1 月裁员约 12% 或 155 人，以及 2026 年 8 月同时完成 Series E 融资、收购 Homeward，并与 Humana
              在北卡罗来纳启动项目。Homeward 交易具有战略意义，因为它把 Cityblock 从城市 Medicaid 和双重资格人群密度区，拓展到乡村 Medicare
              Advantage，有机会让公司的政府项目版图更多元。

              同一时间线也带着不应忽视的负面信号。2023 年 1 月裁员说明 Cityblock 并未躲开数字健康重置。2021 年私募估值峰值到 2026 年末约 $1.2 billion
              市场估计之间的五年落差，意味着即便收入强劲增长，投资者仍大幅下调标记。承销时最关键的若干指标——例如合并盈利能力、当前完整员工数和 Series E
              后精确持股结构——仍由私人持有，或只能从市场数据服务推断，而非由公司披露。大规模、强使命契合与有限公开财务透明度叠在一起，构成后续报告的核心尽调姿态。
