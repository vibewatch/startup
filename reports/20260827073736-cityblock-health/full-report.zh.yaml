      - number: '5.5'
        title: 整合照护模型和运营组件
        blocks:
          - type: paragraph
            body: >-
              Cityblock 的照护模型既是服务设计，也是产品架构。公开页面和 2026 年新闻材料显示，公司围绕医生或基层医疗提供者、注册护士、Community Health
              Partners、心理健康专家或倡导者、医疗助理、药剂师或药房照护人员，以及社会照护连接员搭建跨学科运营模型。服务可按需求和地域在线上、电话、居家或社区诊所交付。出院到居家项目增加了专业护理支持，包括每周随访、用药整理，以及连接儿童照护或食物配送等非医疗服务。LTSS
              扩张公告进一步显示，Cityblock 技术承担几件事：精简评估、交换照护计划、自动协调地方机构和 LTSS 提供方，并为高需求会员提供数据驱动的服务规划。这在战略上重要，因为它说明 Cityblock
              的护城河可能不在单一算法，而在初级医疗、行为健康、居家服务、社会支持和承担风险工作流的运营整合。竞争对手复制一个聊天机器人或病历生成器，比复制一个深度嵌入的多模态照护交付系统快得多。
