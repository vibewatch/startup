      - number: '1.4'
        title: 融资历史、投资者基础与估值重置
        blocks:
          - type: paragraph
            body: >-
              2017 年至 2026 年，Cityblock 通过七轮机构融资募集了接近 $1 billion 的新股资本，从 $20.8 million Series A 起步，到本章所述的 2026 年 8 月由
              General Catalyst 领投的 $116 million Series E 收束。公开市场数据画像和新闻摘要对轮次顺序大体一致：2017 年 12 月交割流程后的 2018 年初 Series
              A、2019 年 3 月 Series B、2020 年 6 月 Series B 扩展轮、2020 年 12 月 Series C、2021 年 3 月 Series C 扩展轮、2021 年 9 月
              SoftBank 领投的 Series D，以及 2026 年 8 月 Series E。投资者包括 Maverick Ventures、Thrive
              Capital、Redpoint、Kinnevik、General Catalyst、Tiger Global、Wellington、Goldman Sachs Asset
              Management、SoftBank、Alphabet/ Sidewalk Labs 等。

              最重要的融资信号不是绝对融资额，而是估值变化。2021 年 Series D 给 Cityblock 的估值约为 $5.7 billion；2026 年 8 月下旬 Yahoo Finance/Forge
              的私募市场定价则隐含约 $1.22 billion 的估计估值。该数字不是新轮融资的官方投后估值，但方向上与用户给出的当前估值约 $1.2 billion 相符，也符合媒体把 2026
              年描述为后期数字健康进入下调轮时期的叙事。结果是，公司运营规模看起来远大于 2021 年，但财务标记却低得多；这把尽调问题推向利润率、医疗损失表现，以及价值医疗经济模型能否持续。
