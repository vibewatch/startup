      - number: '5.6'
        title: 数据共享、合作伙伴和技术风险
        blocks:
          - type: paragraph
            body: >-
              公开证据支持 Cityblock 产品栈周围存在一个有意义但只部分透明的生态。社会照护层接入 Findhelp 的本地资源发现网络；LTSS
              扩张材料描述了与健康计划护理管理团队、利用管理团队、地方机构、社区组织和 LTSS 提供方的协调。面向会员的页面也强调，Cityblock
              团队会与外部提供方协作，并把会员转介给可信的行为健康和专科合作伙伴。这些信号说明，Cityblock 技术必须横跨支付方、提供方、社区组织和社会服务基础设施互通，尽管公司没有公开披露详细的外部 API 或
              FHIR 架构。公司自己的 AI
              原则直接承认主要信任风险：代表性数据、主动偏见测试、隐私、同意，以及模型代表会员或临床人员行动前保留人与人的关系。因此，最大的尽调缺口是技术透明度和治理深度。公开来源没有披露正常运行时间、事故历史、模型监控指标、CORE
              预测方法的外部验证，或详细互操作规范。Cityblock 扩张到农村和更广泛政府项目人群后，信任、治理和集成问题会更重要。
