      - number: '5.2'
        title: CORE 平台和 AI 架构
        blocks:
          - type: paragraph
            body: >-
              公开披露的最重要技术资产是 CORE，即 Cityblock 的 Care Orchestration and Resourcing Engine。在 2026 年 8 月 Homeward 交易公告中，管理层把
              CORE 称为支撑 Cityblock 结果导向照护平台的操作系统。CORE
              不只是给会员贴上「高风险」标签，而是用约十年的会员纵向数据，预测哪项具体行动最可能为哪位具体会员补上哪类照护缺口，再把这些干预按更广人群的优先级排成照护团队的工作清单。这说明它更像一个把预测、优先级排序和人力分配拼在一起的工作流引擎，而不只是仪表盘。管理层还称，CORE
              预测的准确率为 62% 到 87%，区间取决于干预类别。2026 年 AI 报告补充说，Cityblock 使用
              AI、机器学习和预测分析，在就诊前汇总多源数据，就诊中发现照护缺口，推送照护计划建议，并按会员最可能参与的程度确定外联优先级。合在一起，这些证据支持一个真实的内部编排层：核心目的就是在高复杂度 Medicaid
              工作流里，把稀缺临床人力匹配到高收益动作。
