  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入范围与替代方案
        blocks:
          - type: paragraph
            body: >
              分析 Cityblock Health，应把它放进政府资助的价值医疗交付市场，而不是整个医疗服务经济。它的核心市场是为 Medicaid、双重资格和相邻政府项目人群提供承担风险、按人头付费或基于 PMPM
              的护理；在这个市场里，服务方与管理式医疗组织或公共支付方签约，目标是改善结果、降低总医疗成本。因此，纳入的支出池包括委托护理管理、初级保健、行为健康、居家与社区支持、质量改进、会员互动，以及面向 Medicaid
              管理式医疗和双重资格项目销售的技术驱动护理协调。该范围比完整价值医疗服务市场窄得多，但又远大于单一诊所、远程医疗或就医导航类别。

              最重要的替代方案是按服务收费的医疗交付模式。在这种模式下，服务方按就诊或操作收费，管理长期成本和质量的直接激励很弱。第二类替代方案是传统 Medicaid
              管理式医疗，但没有深度委托的服务方风险；健康计划保留大部分运营和精算控制，只外包狭窄个案管理服务。第三类替代方案是碎片化安全网医疗，由
              FQHC、医院门诊、社区心理健康机构和社会服务转介构成，各自孤岛运作，而非处在一套整合的 PMPM 模式之下。因此，Cityblock
              的实际竞争不只是其他“数字健康”公司；还包括既有健康计划内部护理管理团队、服务方发起的责任护理实体，以及专门的 Medicaid VBC 运营商。

              市场边界也应把广义 Medicare Advantage 排除在外，除非双重资格或复杂政府项目人群与 Cityblock 的运营模式重叠。Cityblock 2026 年收购
              Homeward，把战略邻近性扩展到乡村 Medicare 人群，但历史核心仍是城市与弱势场景中的 Medicaid 和双重资格会员。因此，本章把 Medicaid
              VBC、双重资格护理和委托式政府项目护理交付作为相关市场中心，同时把更广义的 VBC 生态保留为外围 TAM 背景。
