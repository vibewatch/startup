      - number: '5.3'
        title: 智能体 AI 和会员互动工作流
        blocks:
          - type: paragraph
            body: >-
              Cityblock 2026 年 AI 材料描绘的会员互动架构，比传统聊天机器人更有野心。公司明确把智能体 AI 定位为让 Medicaid
              照护在正常办公时间外仍可用的方式：会员夜间可以发短信求助、预约就诊、咨询福利或用药问题，并在需要时接入人工支持。在 AI 赋能的会员旅程示例中，AI
              语音和消息智能体会在会员入组或出院时主动联系，会员用自然语言回应，系统识别食物获取、住房不稳定、用药疑问等需求，再把摘要后的对话转给外联专员。这点重要，因为 Cityblock 的产品主张不只是「自动化」，而是
              AI 可以成为关系引擎，减少错过外联窗口，同时保留人工跟进。同一份 2026 年材料称，AI 智能体处理了 42,148 通常规会员来电，并释放 44,599
              小时临床人员时间，说明这些工具已经嵌入运营工作流，而不是停在试点。面向会员的照护模型也通过 Community Health Partners、护士和专科人员保留人工升级路径，这与管理层的表述一致：常规工作交给
              AI，涉及判断和信任的工作仍留给照护团队。
            claimRefs:
              - CE017
              - CE018
              - CE019
              - CE020
