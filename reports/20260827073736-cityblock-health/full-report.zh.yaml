      - number: '2.3'
        title: 买方、用户、支付方与细分图谱
        blocks:
          - type: paragraph
            body: >
              Cityblock 的市场是多边结构。终端用户是会员，通常是临床和社会复杂度高的 Medicaid、双重资格或其他政府项目受益人。经济支付方通常是州 Medicaid 项目或
              CMS，但直接签约对手方往往是管理式医疗组织。后者先收取按人头付费，再决定是否把部分护理管理和临床风险职能委托给伙伴。也就是说，企业买方很少是患者，甚至也很少是服务方系统；通常是控制 PMPM
              预算流的健康计划、州挂钩管理式医疗载体或承担风险的网络。

              这种采购结构切出几个不同细分。第一类是纯 Medicaid 管理式医疗，MCO 为高敏锐度人群、质量改进、减少可避免急诊使用和降低医疗成本趋势寻找伙伴。第二类是双重资格护理，Medicare 和 Medicaid
              福利之间的协调提高复杂度，也让整合式行为、初级和社会护理更有价值。第三类是乡村或特殊人群政府项目护理；Homeward 之后，该方向更重要，因为可及性稀缺和居家护理物流会改变交付模式。第四类是相邻
              Medicare 风险项目，战略上有用，但不是历史核心。

              市场集中度并不对称。在支付方层面，五大 MCO——Centene、CVS/Aetna、Elevance、Molina 和 UnitedHealth——控制约 43% 的 Medicaid 管理式医疗，并在
              2026 年 Q2 产生 $68.8 billion Medicaid 收入。但在服务方伙伴层面，市场仍相对碎片化，参与者包括 Cityblock、CareBridge、Monogram、Equality
              Health、服务方发起实体、FQHC 网络和健康计划自有护理管理部门。这种结构让大型支付方在定价和签约中拥有强杠杆，同时也给能够在复杂人群中证明更好结果的差异化运营商留下空间。
