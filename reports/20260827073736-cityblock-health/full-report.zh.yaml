      - number: '2.4'
        title: 增长驱动因素与市场顺风
        blocks:
          - type: paragraph
            body: >
              最强的结构性市场驱动，是报销机制持续从按服务收费转向奖励可衡量结果的价值模式。在 Medicaid 中，这种转向已不再是实验，而是由财政必要性推动。KFF 的 FY2025–FY2026 Medicaid
              预算调查显示，各州面临收入增长放缓、服务方和药房成本上升，以及明显更脆弱的预算环境。预算收紧时，州政府和 MCO 会更关注能够减少可避免使用、提高质量分数，并交付可预测 PMPM
              支出的模式，而不是开放式按服务收费趋势。

              第二个驱动因素，是政府项目人群中的慢病和社会复杂性负担。Medicaid 和双重资格队列更容易受到行为健康状况、多种慢性病、住房不稳定和碎片化医疗可及性的影响，整合式护理管理模式因此具备经济意义。这正是
              Cityblock 解决的运营问题。第三个驱动因素是技术采用：2026 年来自价值医疗运营商和技术供应商的市场评论显示，AI 越来越多用于风险分层、护理缺口识别、质量管理和工作流优先级排序。对 Cityblock
              这样的运营商来说，AI 不是产品类别；它是扩张工具，可以在高需求人群中改善触达、人员杠杆和干预时点。

              政策仍是直接催化剂。2026 年公开评论持续把 Medicaid 描述为扩张最快的 VBC 场域之一，因为政府无法单靠增加无管理使用来解决预算压力。按人头付费和 PMPM
              结构仍是主导经济设计，因为它们把成本与质量责任一并转移出去。Cityblock
              的整合式初级保健、行为健康和社会支持模式，比只解决单一护理缺口的点状方案更贴合这个政策方向。因此，当州政府和健康计划把全人管理置于孤岛式供应商工具之上时，公司战略重要性会上升。
