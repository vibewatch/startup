chapter:
  number: 5
  title: Product & Technology
  summary: 'Cityblock Health’s product is best understood as an AI-native, whole-person care-delivery platform rather than a narrow telehealth app or utilization-management tool. The company combines community-based clinics, in-home urgent and longitudinal care, 24/7 virtual access, integrated behavioral health, pharmacy and social-care navigation, and a growing internal AI stack led by CORE—the Care Orchestration and Resourcing Engine. Public 2026 materials support a real operating platform with measurable workflow results: CORE predicts the most effective next intervention for a specific member with 62% to 87% precision across use cases, AI agents handled 42,148 routine member calls in 2026, and AI automation returned 44,599 clinician and care-manager hours. The main diligence question is not whether Cityblock has meaningful technology, but whether its proprietary operating stack and care model can remain differentiated as more Medicaid and value-based-care competitors adopt similar AI-enabled
    orchestration tools.'
