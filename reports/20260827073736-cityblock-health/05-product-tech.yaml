sections:
- id: product-scope-and-care-experience
  title: Product scope and care experience
  body: Cityblock’s product surface is a full-stack care experience designed for Medicaid, Medicare Advantage, and dually eligible members with complex clinical and social needs. Public member-facing materials describe a service model that spans primary care, mental health, social care, hospital-to-home transitions, in-home urgent care, community-based clinics, and 24/7 virtual access. That matters because Cityblock is not selling a single digital front door or point-solution app; it is operating an outcomes-based care platform in which technology, staffing, and local care delivery are tightly coupled. Members can be seen at home, in a clinic, by phone, or virtually, and the same care team can coordinate clinical needs, medications, benefits questions, and social-support issues such as food, housing, childcare, or transportation. This multimodal design is central to the company’s value proposition in government-sponsored populations, where access barriers and social determinants of health
    are often inseparable from clinical outcomes. The inclusion of urgent care, behavioral health, and social navigation inside one branded care model suggests the product is meant to reduce fragmentation more than to maximize visit volume.
