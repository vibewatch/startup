tables:
- id: TE001
  title: Technology capabilities table
  columns:
  - Capability / module
  - What it does
  - Public evidence / 2026 status
  - Operational value
  - Diligence gap
  rows:
  - - CORE platform
    - Predicts next-best intervention for a specific member and ranks worklists across the population
    - Publicly described as Cityblock’s Care Orchestration and Resourcing Engine in the 2026 Homeward announcement
    - Directs scarce care-team time toward the highest-yield clinical or social action
    - No public technical paper, architecture diagram, or external validation of model design
  - - AI-enabled population health analytics
    - Summarizes longitudinal and multisource member data, identifies care gaps, and prioritizes outreach
    - Described in the 2026 AI report as part of care-team support workflows
    - Improves targeting, pre-visit preparation, and loop closure in complex populations
    - No public sensitivity/specificity, drift, or subgroup-performance data
  - - AI voice and messaging agents
    - Conduct routine outreach, answer questions, and escalate contextualized summaries to specialists
    - 42,148 routine member calls handled by AI agents in 2026
    - Extends access beyond business hours and reduces manual outreach burden
    - Unknown containment rate by use case and unknown member satisfaction by channel
  - - Ambient AI scribe
    - Generates clinical summaries and draft notes during visits, including Spanish-to-English translation
    - Quoted clinician testimony in the 2026 AI report supports active use
    - Reduces after-hours charting and supports multilingual documentation
    - No public accuracy audit, vendor disclosure, or EHR integration detail
  - - LTSS workflow automation
    - Streamlines assessments, care-plan exchange, and coordination with agencies and LTSS providers
    - Enhanced in the February 2026 LTSS expansion release
    - Lowers coordination friction for high-cost, high-acuity members
    - No quantified productivity or savings metric disclosed for LTSS-specific workflows
  - - Social-care resource integration
    - Connects members to food, housing, legal, benefits, and other community supports
    - Cityblock publicly names Findhelp as a partner on the social-care page
    - Helps convert identified SDOH needs into actionable local referrals
    - No data on referral completion, partner coverage density, or closed-loop tracking rates
  notes: Capabilities reflect product surfaces and internally used workflow systems publicly described by Cityblock in 2026; they are not a complete internal engineering inventory.
