- id: TE003
  title: AI use cases table
  columns:
  - Use case
  - Data / trigger
  - Automation action
  - Human role
  - Evidence / result
  rows:
  - - Member enrollment or hospital discharge outreach
    - Enrollment event, discharge event, prior engagement history
    - AI voice or messaging agent initiates outreach and captures natural-language responses
    - Outreach specialist reviews summary and follows up
    - Described in the 2026 AI report’s member journey
  - - SDOH need detection
    - Member conversation content mentioning food, housing, or medication issues
    - AI identifies likely need category and routes it with context
    - CHP or care coordinator connects the member to resources
    - Explicit examples in the 2026 AI report include food access and housing instability
  - - Pre-visit chart preparation
    - Multisource clinical and social data
    - AI summarizes relevant history before encounter
    - Clinician reviews and uses summary during visit
    - 2026 AI report says multi-sourced member data is summarized before interaction
  - - Ambient documentation
    - Live patient-clinician conversation
    - AI drafts real-time summary and clinical note
    - Clinician edits and signs note
    - Clinician quote highlights accurate Spanish-to-English note generation
  - - Care-gap identification
    - Labs, follow-up history, specialist visits, care-plan data
    - AI flags needed actions or missing steps
    - Care team decides and executes intervention
    - Cityblock says AI medical data analysis and prompts identify gaps in care
  - - Outreach prioritization
    - Population health analytics and predicted engagement likelihood
    - AI ranks members for follow-up
    - Care teams work prioritized lists
    - Described as AI-enabled population health management analytics
  - - Routine member call handling
    - High-volume routine inquiries
    - AI agents resolve the interaction autonomously when appropriate
    - Humans receive escalations for complex cases
    - 42,148 calls handled by AI agents; 44,599 hours freed in 2026
  notes: Use cases reflect public workflow examples and operating metrics rather than a complete internal roadmap.
