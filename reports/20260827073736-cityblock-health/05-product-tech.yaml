- id: ambient-documentation-and-clinician-productivity
  title: Ambient documentation and clinician productivity
  body: One of the clearest examples of Cityblock applying AI to care-team workflow is ambient clinical documentation. The company’s 2026 AI report describes clinical natural language processing that generates real-time summaries and clinical documentation during care rather than after hours. A quoted Cityblock psychiatrist says the ambient scribe can translate Spanish encounters into English while generating the note, and that the tool accurately captured a follow-up visit while materially reducing after-hours note-writing burden. This is a meaningful product detail because Cityblock serves Medicaid and dual populations where language access, continuity, and clinician burnout are operationally important. Ambient scribing appears positioned less as a standalone SKU and more as part of the internal productivity layer supporting Cityblock’s care teams. It complements broader workflow automation by reducing charting time, structuring encounter data, and making multilingual care easier to document
    inside English- language clinical systems. When paired with pre-visit summarization and concurrent care-gap prompts, the ambient scribe becomes part of a broader closed-loop documentation and action system rather than an isolated generative-AI feature.
  claimRefs:
  - CE025
  - CE026
  - CE027
  - CE028
  - CE029
  - CE030
