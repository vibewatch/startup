- id: data-sharing-partnerships-and-technical-risks
  title: Data sharing, partnerships, and technical risks
  body: 'Public evidence supports a meaningful but only partially transparent ecosystem around Cityblock’s product stack. The social-care layer is integrated with Findhelp’s network for local resource discovery, and the LTSS expansion materials describe coordination with health-plan care-management teams, utilization-management teams, local agencies, community-based organizations, and LTSS providers. Member-facing pages also stress that Cityblock’s teams coordinate with outside providers and make referrals to trusted behavioral-health and specialty partners. These signals suggest Cityblock’s technology must interoperate across payers, providers, community organizations, and social-service infrastructure even though it does not publicly disclose a detailed external API or FHIR architecture. The company’s own AI principles acknowledge the main trust risks directly: representative data, proactive bias testing, privacy, consent, and preserving human relationships before models act on behalf
    of members or clinicians. The biggest remaining diligence gaps are therefore technical transparency and governance depth. Public sources do not disclose uptime, incident history, model-monitoring metrics, external validation of CORE’s prediction methodology, or detailed interoperability specifications. As Cityblock scales into rural and broader government-program populations, these trust, governance, and integration questions become more material.'
