- id: TE004
  title: Integration partners table
  columns:
  - Partner / integration surface
  - Type
  - Role in workflow
  - Evidence
  - Diligence question
  rows:
  - - Findhelp
    - Social-care network
    - Connects members and teams to local food, housing, legal, and financial resources
    - Named directly on Cityblock’s social-care page
    - How often do identified needs convert into fulfilled services?
  - - Health plans
    - Payer / operational partner
    - Support value-based contracts, care-management coordination, and UM/LTSS coordination
    - Partner page and LTSS release both emphasize trusted health-plan relationships
    - What structured data feeds and workflow integrations exist with each payer?
  - - External providers
    - Clinical referral / coordination partner
    - Receive referrals and share ongoing treatment responsibilities
    - Mental-health and approach pages describe referrals and coordination across providers
    - What interoperability standards and turnaround metrics govern these handoffs?
  - - Local agencies and community-based organizations
    - Community partner
    - Support benefits access, home modifications, social services, and service fulfillment
    - LTSS expansion release explicitly names local agencies and community-based organizations
    - How fragmented is the partner network across markets?
  - - LTSS providers
    - Service-delivery partner
    - Coordinate home- and community-based support plans and service execution
    - LTSS release cites automated coordination and care-plan exchange with LTSS providers
    - Is care-plan exchange digital, manual, or mixed by market?
  - - Internal medical practices
    - Clinical delivery entity
    - Employ licensed practitioners while Cityblock Health provides management and administrative services
    - Member-care and hospital-to-home pages include medical-practice disclosure
    - How tightly integrated are administrative and clinical systems at the entity level?
  notes: Public disclosures emphasize workflow partners more than named software vendors, so this table focuses on real operating integration surfaces rather than speculative infrastructure suppliers.
