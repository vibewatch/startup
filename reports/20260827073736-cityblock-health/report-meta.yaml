companyProfile:
  summary: >-
    Cityblock Health is a Brooklyn-based healthcare company founded in 2017 that emerged from Alphabet's Sidewalk Labs
    incubator. The company delivers value-based care specifically designed for Medicaid, Medicare Advantage, and dually
    eligible populations with complex medical and social needs. Cityblock's model integrates primary care, behavioral
    health, urgent care, and social services through both in-person community-based teams and virtual care, operating
    under capitated contracts with health plans. As of August 2026, the company announced a $116M Series E led by
    General Catalyst alongside a definitive agreement to acquire Homeward Health, bringing its served population to
    nearly 200,000 members and its annualized revenue to $2.2 billion. Despite strong operational growth, the company's
    valuation has reset from a $5.7B peak in 2021 to approximately $1.2B, reflecting broader digital health market
    correction and investor focus on unit economics.
