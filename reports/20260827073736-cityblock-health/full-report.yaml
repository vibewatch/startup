      - number: '6.3'
        title: Retention risks and buying criteria
        blocks:
          - type: paragraph
            body: >-
              Customer retention in value-based care depends less on brand marketing and more on measurable operating
              performance. Health-plan buyers will care about medical-cost trend reduction, Star or quality outcomes,
              member experience, implementation reliability, regulatory readiness, and whether Cityblock can scale
              without service degradation. Public evidence suggests Cityblock has built enough credibility to win
              blue-chip payer relationships, but outside investors still need contract-level proof on renewal rates,
              contribution margins, and how outcomes vary by cohort. The Homeward combination adds another layer: it
              expands the possible buyer universe and geographic range, but it also raises integration risk and could
              shift account priorities during transition periods. The core diligence lens should therefore be whether
              Cityblock is becoming more strategically embedded inside customer workflows or simply larger. Strong
              customer value would show up through multi-year renewals, geography expansion within existing accounts,
              and use-case expansion across more member segments. For an investor, the decisive question is whether
              these buyers view Cityblock as a replaceable vendor or as embedded infrastructure. The former would cap
              pricing power; the latter would support stronger renewal probability and account expansion over time. This
              section intentionally ties customer quality to enterprise buying behavior, implementation reliability, and
