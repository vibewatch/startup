      - number: '2.2'
        title: Market Size, TAM/SAM/SOM, and Scaling Lenses
        blocks:
          - type: paragraph
            body: >
              The widest published market lens is the global value-based healthcare services market, estimated by Mordor
              Intelligence at $2.27 trillion in 2026 and projected to reach $5.17 trillion by 2031 at a 17.86% CAGR.
              That number is directionally useful because it captures how rapidly reimbursement is shifting away from
              fee-for-service, but it is too broad to serve as Cityblock’s operating TAM. Cityblock is not trying to
              capture all value-based healthcare spend across commercial, Medicare, and international markets; it is a
              government-program-focused operator with concentrated exposure to Medicaid and dual-eligible populations.

              A more relevant lens starts with government-sponsored coverage volume. Public sources indicate that more
              than 120 million Americans receive coverage through major government programs when Medicare and
              Medicaid/CHIP are combined, even after accounting for overlap. Within that pool, Medicaid managed care is
              especially important because it concentrates budget accountability in plan-level contracts and delegated
              PMPM relationships. Georgetown CCF reported national Medicaid managed care enrollment at 66.7 million in
              April 2026, down from 70.4 million in July 2025 as redeterminations and policy changes reduced covered
              lives. This shrinkage matters: it compresses the near-term member base available to providers like
              Cityblock even while fiscal pressure makes value-based delivery more strategically important to states and
              MCOs.

              A still narrower market lens is the value-based care services segment most aligned with outsourced
              care-delivery infrastructure. Mordor separately sized the VBC services segment at $4.14 billion in 2025
              and $4.55 billion in 2026, with 9.9% CAGR through 2031. That segment is a useful proxy for the directly
              monetizable layer where operators deliver clinical and care-management services rather than merely
              providing software. For Cityblock, a practical SAM consists of Medicaid, dual-eligible, and adjacent
              government-program members attributed through capitated or PMPM arrangements in geographies where plans
              are willing to delegate longitudinal care responsibility. Public reporting does not support a clean
              standalone SOM, but Cityblock’s own August 2026 transaction disclosures indicate roughly 200,000 served
              members after combining with Homeward, providing a realized scale anchor rather than a full market-size
              formula.
