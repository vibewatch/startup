      - number: '1.5'
        title: Milestones, partnerships, acquisition activity, and adverse signals
        blocks:
          - type: paragraph
            body: >-
              Cityblock's milestone path shows a company that moved from incubated concept to national
              government-program care platform in under a decade. Public sources support a sequence that includes
              founding in 2017, multi-round capital formation from 2018 through 2021, expansion to six states by 2020,
              Ajayi's elevation to CEO by 2022, a workforce reduction of roughly 12% or 155 employees in January 2023,
              and the August 2026 combination of Series E financing, the Homeward acquisition, and a North Carolina
              launch with Humana. The Homeward transaction is strategically significant because it broadens Cityblock
              from urban Medicaid and duals density into rural Medicare Advantage, potentially giving the company a more
              diversified government-program footprint.

              At the same time, the chronology carries adverse signals that should not be ignored. The January 2023
              layoff is evidence that Cityblock was not insulated from the digital-health reset. The five-year gap
              between the 2021 peak private valuation and the roughly $1.2 billion late-2026 market estimate implies a
              substantial investor markdown, even after strong revenue growth. Several metrics central to
              underwriting—such as consolidated profitability, full current headcount, and precise post-Series-E
              ownership—remain privately held or inferred from market-data services rather than disclosed by the
              company. That combination of large scale, strong mission fit, and limited public financial transparency
              defines the core diligence posture for the rest of the report.
