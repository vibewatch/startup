      - number: '5.5'
        title: Integrated care model and operating components
        blocks:
          - type: paragraph
            body: >-
              Cityblock’s care model is product architecture as much as service design. Public pages and 2026 press
              materials show an interdisciplinary operating model built around doctors or primary providers, registered
              nurses, Community Health Partners, mental health specialists or advocates, medical assistants, pharmacists
              or pharmacy-care staff, and social-care connectors. Services can be delivered virtually, by phone, in the
              home, or at community-based clinics depending on need and geography. The hospital-to-home program adds
              specialized nursing support with weekly follow-ups, medication organization, and links to nonmedical
              services such as childcare or food delivery. The LTSS expansion announcement further indicates that
              Cityblock’s technology is being used to streamline assessments, exchange care plans, automate coordination
              with local agencies and LTSS providers, and support data-driven service planning for high-need members.
              This is strategically relevant because it suggests Cityblock’s moat may lie less in a single algorithm
              than in the operational integration of primary care, behavioral health, home-based services, social
              supports, and risk-bearing workflows. Competitors can replicate a chatbot or a note generator faster than
              they can replicate a deeply embedded multimodal care-delivery system.
