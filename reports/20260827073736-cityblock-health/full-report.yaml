      - number: '8.3'
        title: Investment thesis, anti-thesis, and bull/base/bear scenario logic
        blocks:
          - type: paragraph
            body: >-
              The positive underwriting case is straightforward. Cityblock has real scale, fast recent growth, broader
              customer count than in 2021, official claims of improved EBITDA and corporate-opex efficiency, a
              differentiated Medicaid and dual-eligible focus, and a very large addressable government-program
              opportunity. If those signals prove durable, the current price could look conservative because even modest
              multiple normalization toward other value-based care references would create meaningful upside from a $1.2
              billion entry valuation. The anti-thesis is equally strong. Cityblock remains privately opaque on gross
              margin, cohort profitability, contract renewals, cash conversion, liquidation preferences, and downside
              exposure inside risk-bearing care contracts. A down round can also become self-reinforcing: employee
              morale, future recruiting, and subsequent capital raising may all become harder when the prior round reset
              is severe. Scenario analysis therefore matters more than point-estimate precision. In a bull case,
              investors assume sustained growth, margin hardening, and a sector multiple rebound. In a base case,
              Cityblock grows into better economics but remains valued at a discount until public or strategic buyers
              gain confidence in durable cash generation. In a bear case, growth slows before unit economics are fully
              proven and the company needs further capital with only limited improvement in price.
            claimRefs:
