      - number: '6.2'
        title: Customer segments and expansion
        blocks:
          - type: paragraph
            body: >-
              The company’s served populations are diverse by program type even if they are acquired through a narrower
              set of enterprise buyers. Existing evidence points to major Medicaid exposure, substantial dual-eligible
              positioning, selected Medicare Advantage relationships, and a widening footprint following the Homeward
              transaction. This segmentation matters because each program line carries different economics, risk
              adjustment dynamics, care models, and member-acquisition logic. Cityblock’s value proposition appears
              especially resonant where plans need integrated primary care, behavioral health, home-based support, and
              social-care navigation to improve outcomes for high-need members. Expansion opportunities likely come from
              deepening within incumbent plan accounts, cross-selling additional products or geographies, and broadening
              into adjacent rural and government-program categories. The upside is meaningful because plans often prefer
              fewer operating partners once a model is embedded; the constraint is that each new market can require
              lengthy implementation, local clinical hiring, and partner-by-partner proof of value. The most important
              analytical nuance is that customer diversification can improve even while concentration remains
              meaningful, because a handful of large plans may still account for the majority of covered lives. That
              makes relationship depth valuable but also raises dependency on a small set of enterprise counterparties.
              This section intentionally ties customer quality to enterprise buying behavior, implementation
