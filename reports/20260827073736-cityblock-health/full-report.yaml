      - number: '3.2'
        title: Medicare-clinic rivals dominate scale but not Medicaid specialization
        blocks:
          - type: paragraph
            body: >-
              Oak Street Health and ChenMed are the clearest reminders that risk-bearing primary care can scale when
              economics are anchored in seniors and Medicare Advantage. Oak Street says it was founded in 2012, is now
              part of CVS Health, and specializes in helping older adults through comprehensive preventive primary care.
              Public reporting around the 2023 CVS acquisition framed Oak Street as a full-risk primary-care asset with
              national clinic density and a disciplined center-expansion model. ChenMed’s own materials similarly
              emphasize preventive primary care for seniors and a VIP-style relationship model oriented around older
              adults. One Medical Seniors, built on the Iora Health model and now owned by Amazon through One Medical,
              adds another team-based, tech-enabled senior-care competitor with broad consumer brand advantages and
              major parent-company capital.

              These businesses matter because they have already demonstrated that full-risk, high-touch primary care can
              work at national scale. They also prove that large strategics are willing to pay heavily for these assets:
              CVS bought Oak Street, while Amazon bought One Medical after One Medical had already absorbed Iora. That
              level of strategic sponsorship raises the bar for Cityblock, because it is competing not just with
              startups but with platforms backed by retail and technology giants. In investor terms, this means
              Cityblock is not defending a market white space; it is defending a harder-to-serve niche inside a market
              that bigger companies already regard as strategic.

              Even so, these Medicare-centric rivals are not perfect substitutes. Their public positioning remains
              oriented to older adults, Medicare, or Medicare Advantage economics, not a Medicaid-first population with
              heavy social-needs burden. Cityblock’s differentiation is strongest precisely where these clinic models
              are weakest: integrating social care, behavioral health, and nonmedical supports into the care model
              rather than treating them as adjacent services. The result is a competitive relationship that is real but
              only partially overlapping. Oak Street, ChenMed, and One Medical Seniors are formidable comparators on
              care-model execution and capital access, but they do not erase Cityblock’s thesis that Medicaid-first care
              requires a different operating system.
            claimRefs:
