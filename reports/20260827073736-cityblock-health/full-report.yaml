      - number: '4.3'
        title: Operating leverage, cost structure, and margin path
        blocks:
          - type: paragraph
            body: >-
              Cityblock's most investable financial improvement is not merely revenue growth but the simultaneous
              reduction in overhead intensity and the improvement in EBITDA margins. The company says corporate
              operating expense as a share of revenue improved 64% and EBITDA margins improved 81% over the measurement
              period cited around the 2026 financing. Those percentages imply meaningful operating leverage even if the
              underlying absolute dollar amounts are undisclosed. The directional story is consistent with how
              value-based care platforms mature: the up-front costs of market launch, care-team buildout, analytics
              infrastructure, and health-plan implementation are heavy, but incremental markets can become more
              efficient once utilization, workflows, and contracting templates are in place. That said, the public
              record still leaves important blind spots. There is no audited breakout of gross margin, market
              contribution margin, medical-cost trend exposure, reserve policy, or working-capital swings by contract.
              Because Cityblock takes responsibility for harder, dual-eligible and Medicaid-heavy populations, adverse
              cost variance in one cohort can compress profitability faster than software-style metrics would imply.
              Investors should therefore treat the margin-improvement narrative as promising but incomplete until they
              receive market-level economics and claims-development data.
