  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Inclusions, and Substitutes
        blocks:
          - type: paragraph
            body: >
              Cityblock Health should be analyzed inside the government-sponsored value-based care delivery market
              rather than the entire healthcare services economy. Its core market is risk-bearing, capitated or
              PMPM-based care for Medicaid, dual-eligible, and adjacent government-program populations, where provider
              organizations contract with managed care organizations or public payers to improve outcomes and reduce
              total cost of care. The included spend pool therefore consists of delegated care management, primary care,
              behavioral health, home- and community-based support, quality improvement, member engagement, and
              technology-enabled care coordination sold into Medicaid managed care and dual-eligible programs. That is
              narrower than the full value-based healthcare services market but much broader than a single clinic,
              telehealth, or care navigation category.

              The most important substitute is fee-for-service care delivery, where providers are paid per visit or
              procedure and have weak direct incentives to manage longitudinal cost and quality. A second substitute is
              traditional Medicaid managed care without deep delegated provider risk, where the health plan retains most
              operating and actuarial control and contracts only for narrow case-management services. A third substitute
              is fragmented safety-net care built around FQHCs, hospital outpatient clinics, community mental-health
              providers, and social-service referrals that operate in silos rather than under an integrated PMPM model.
              Cityblock’s practical competition is therefore not just other “digital health” companies; it includes
              incumbent health plans’ internal care-management operations, provider-sponsored accountable-care entities,
              and specialized Medicaid VBC operators.

              The boundary should also exclude Medicare Advantage broadly except where dual-eligible or complex
              government-program populations overlap Cityblock’s operating model. Cityblock’s 2026 acquisition of
              Homeward expands the strategic adjacency into rural Medicare populations, but the historical core remains
              Medicaid and dually eligible members in urban and underserved settings. This chapter therefore treats
              Medicaid VBC, dual-eligible care, and delegated government-program care delivery as the relevant market
              center, while keeping the broader VBC ecosystem as the outer TAM context.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
