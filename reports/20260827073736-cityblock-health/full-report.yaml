      - number: '7.4'
        title: Market contraction and stronger incumbents can narrow expansion paths even if Cityblock remains differentiated
        blocks:
          - type: paragraph
            body: >-
              Cityblock does not compete in a stable or empty market. It is trying to expand in government-funded care
              while some of the largest managed-care organizations are becoming more cautious about Medicaid exposure.
              In 2026, reporting on Elevance and Centene pointed to additional Medicaid-market exits or pullbacks where
              profitability and funding support look inadequate, and national Medicaid enrollment fell from roughly 70.4
              million in July 2025 to 66.7 million in April 2026 according to Georgetown CCF's reading of CMS data.
              Those trends matter because plans under pressure may prioritize lower-cost enablement tools, restrict new
              pilots, or reduce the generosity of value-based arrangements. At the same time, Cityblock faces direct
              competition from scaled Medicare-centered care operators such as Oak Street and One Medical/Amazon, as
              well as enablement and analytics vendors such as Aledade, Guidehealth, and Wellvana that can offer payers
              a less vertically integrated path. This means Cityblock's moat is real but conditional. It is strongest
              where buyers want a single accountable operator for high-need Medicaid and dual populations, and weakest
              where MCOs, states, or provider groups prefer to modularize services, retreat from risky geographies, or
              treat community-based care as a cost center rather than a strategic differentiator.
