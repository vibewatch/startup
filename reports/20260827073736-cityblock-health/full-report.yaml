  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: >-
          Medicaid policy changes are the chapter's highest-severity risk because they can reduce covered lives,
          increase churn, and destabilize payer economics
        blocks:
          - type: paragraph
            body: >-
              Cityblock's core exposure is to government-program policy, not simply to normal startup volatility. The
              company is built around Medicaid, dually eligible, and other publicly financed populations, so changes in
              eligibility, renewal cadence, and state financing rules transmit directly into enrollment, member churn,
              payer budgets, and willingness to fund intensive value-based models. The 2025 federal reconciliation law
              commonly referenced as H.R. 1 introduced a community-engagement framework for many Medicaid expansion
              adults, and 2026 CMS guidance and the June 2026 interim final rule translated that framework into
              operational requirements such as 80 hours per month and verification at enrollment and renewal. In
              parallel, six-month redeterminations replace the old annual cadence for affected adults beginning in 2027,
              increasing the probability that eligible members still fall out of coverage because of documentation
              friction. KFF, CBPP, CMS, Georgetown CCF, and other policy sources frame these changes as administratively
              heavy and likely to increase disenrollment, with broader projections of more than 8 million people losing
              Medicaid coverage by 2034 across the law's provisions. For Cityblock, the direct issue is not only fewer
              reimbursable members but a less stable attribution pool for care management, quality performance, and
              actuarial forecasting. State-level variation compounds the risk because different Medicaid agencies and
              MCOs will implement work verification, exemptions, and provider-funding responses unevenly, making it
              harder to scale a repeatable operating model across markets.
            claimRefs:
              - CR001
              - CR002
