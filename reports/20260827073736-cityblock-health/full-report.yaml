      - number: '5.2'
        title: CORE platform and AI architecture
        blocks:
          - type: paragraph
            body: >-
              The most important technology asset disclosed publicly is CORE, Cityblock’s Care Orchestration and
              Resourcing Engine. In the August 2026 Homeward transaction announcement, management describes CORE as the
              operating system underpinning Cityblock’s outcomes-based care platform. Rather than merely labeling a
              member “high risk,” CORE uses roughly a decade of longitudinal member data to predict which specific
              action is most likely to close which specific care gap for which specific member, and then ranks those
              interventions across the broader population into worklists for care teams. That description implies a
              workflow engine that combines prediction, prioritization, and labor allocation—not just a dashboard.
              Management further says CORE predictions are right 62% to 87% of the time, with the range depending on the
              intervention class. The 2026 AI report adds that Cityblock uses AI, machine learning, and predictive
              analytics to summarize multi-source data before encounters, detect care gaps during care, surface
              care-plan suggestions, and prioritize outreach based on which members are most likely to engage. Taken
              together, the evidence supports a real internal orchestration layer whose core purpose is matching scarce
              clinical labor to high-yield actions in a high-complexity Medicaid workflow.
