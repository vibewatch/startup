      - number: '7.6'
        title: >-
          The right underwriting response is a monitored-risk framework with explicit kill criteria rather than a binary
          yes/no on the current evidence
        blocks:
          - type: paragraph
            body: >-
              Cityblock's risks are serious, but they are also monitorable. The key underwriting question is whether the
              company can maintain contract performance and margin trajectory through a period of policy churn and payer
              austerity. Investors should therefore treat this chapter as a monitoring framework. The top mitigation for
              regulatory risk is concentrated state-by-state readiness: exemption workflows, renewal support,
              eligibility navigation, and contract language that shares redetermination or policy shock risk with payer
              partners where possible. Financially, the company must prove not just growth but cash conversion, reserve
              discipline, and renewal durability at the market and payer-cohort level. Operationally, integration
              milestones for Homeward, staff retention in critical functions, and quality or engagement outcomes by
              geography should be tracked monthly. On the technology side, management should be expected to produce
              concrete AI governance, privacy, and model-performance evidence rather than broad efficiency claims. The
              thesis breaks if policy-driven membership losses materially reduce attributable scale, if margins stall
              despite larger revenue, if Homeward integration disrupts performance, or if major payers signal that
              lower-risk enablement alternatives are preferable to Cityblock's full-stack model.
