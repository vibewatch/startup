  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Funding reset and current capitalization context
        blocks:
          - type: paragraph
            body: >-
              Cityblock's August 2026 Series E is the key financial event that reframes the company for current
              investors. The $116 million round, led by General Catalyst, came at an approximately $1.2 billion
              valuation, far below the $5.7 billion private-market peak attached to the March and September 2021
              financings. That reset matters because it was not caused by revenue collapse; instead, multiple sources
              describe a business that kept growing into a multi-billion-dollar annualized revenue run rate while
              private digital-health valuations compressed. The round therefore appears to serve three purposes at once:
              replenish balance-sheet flexibility, validate the company's ability to convert scale into better EBITDA
              and opex efficiency, and reset ownership expectations to a lower but potentially more defensible entry
              point. The adverse reading is equally important: a 79% valuation decline across five years signals that
              earlier investors overpaid for growth and that future markups depend on sustained evidence of margin
              durability rather than just membership expansion. Cityblock's financing story is best read as a live test
              of whether value-based care platforms can outgrow the digital-health downturn by proving operating
              leverage under payer contracts.
