      - number: '4.2'
        title: Revenue scale, customer expansion, and quality of topline growth
        blocks:
          - type: paragraph
            body: >-
              The strongest positive signal in Cityblock's financial profile is the scale and persistence of topline
              growth. Management and independent coverage consistently point to approximately $2.2 billion of annualized
              revenue in 2026, up 77% year over year and about 323% above the 2021 baseline. Just as important, customer
              concentration appears to have improved because the health-plan base expanded from five plans to eighteen,
              indicating that growth did not rely exclusively on one or two anchor contracts. Cityblock's revenue model
              remains payer-facing and contract based, which generally produces better visibility than
              direct-to-consumer digital-health models, but revenue quality still depends on medical-cost-savings
              delivery, utilization management, and member engagement outcomes that outsiders cannot fully audit from
              public materials. The topline therefore looks real and sizeable, yet diligence still needs cohort-level
              renewal, gross-to-net, and contract margin data before a sponsor can underwrite the sustainability of the
              77% growth rate. In practical terms, revenue scale now supports the argument that the company has crossed
              from venture experiment into healthcare operator, even if the public evidence remains weaker on
              contribution margins by market and payer cohort.
