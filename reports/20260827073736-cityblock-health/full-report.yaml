      - number: '7.3'
        title: Operating complexity, workforce strain, and integration burden could blunt the benefits of scale
        blocks:
          - type: paragraph
            body: >-
              Even if reimbursement and capital markets cooperate, Cityblock still has to execute a difficult
              care-delivery model. Its service promise spans primary care, behavioral health, social care, urgent
              support, transitions of care, and now broader urban-rural reach after the Homeward transaction. That
              breadth is a differentiator, but it also creates labor, process, and integration risk. The 2023 layoff of
              155 employees, or 12% of the workforce, signals that management has already had to right-size the
              organization in response to operating pressure. Layoffs can improve cost discipline, yet they also risk
              damaging morale, reducing implementation capacity, and stretching clinical and operational teams that
              already work in high-complexity populations. The Homeward acquisition expands strategic reach but adds
              another layer of integration exposure involving care workflows, technology systems, market-facing
              contracting, and cultural alignment across urban Medicaid and rural Medicare-leaning operations.
              Healthcare labor shortages further raise the cost and execution difficulty of scaling care teams,
              particularly in behavioral health, community health work, nursing, and care management. For an integrated
              model like Cityblock, localized staffing failure can become a system-level problem because poor staffing
              can degrade member engagement, quality metrics, claims outcomes, and payer trust simultaneously.
