      - number: '1.2'
        title: Care model, populations served, and current operating scale
        blocks:
          - type: paragraph
            body: >-
              Cityblock's service model combines in-person community care, virtual care, behavioral health, pharmacy
              support, social-care coordination, and data-driven member outreach under value-based arrangements with
              health plans and government-program stakeholders. The company states that it serves Medicaid, Medicare,
              and dual-eligible members; those categories fit the operational reality shown in the 2026 Humana North
              Carolina launch and the 2026 Homeward acquisition announcement. The Humana program starts with nearly
              20,000 North Carolina dual-eligible and Medicare Advantage members, while the Homeward announcement says
              the combined company will serve almost 200,000 members nationally after adding about 50,000 rural members
              from Homeward.

              Management also used the August 2026 Homeward announcement to disclose unusually specific operating
              metrics for a private company: annualized revenue of $2.2 billion, 77% year-over-year growth, revenue more
              than four times the level at the last 2021 fundraise, 18 health-plan customers versus five in 2021, and
              positive operating margins in its core markets. Those statements, corroborated by trade-press summaries,
              frame Cityblock as a scaled healthcare operator rather than a pre-revenue digital health startup. The
              caveat is that these metrics come primarily from company-issued materials and follow-on reporting rather
              than audited consolidated financial statements, so the numbers are best treated as high-signal but not
              fully independently audited operating KPIs.
