  - id: TV005
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Core point
      - Supporting evidence
      - What would change the view
    rows:
      - - Thesis
        - Revenue scale is real and large
        - $2.2B annualized revenue and 77% growth disclosed in 2026
        - Independent audited revenue cadence weaker than claimed
      - - Thesis
