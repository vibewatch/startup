  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation reset, current entry point, and what the market is pricing in
        blocks:
          - type: paragraph
            body: >-
              Cityblock's present valuation debate starts with an unusual combination: very strong scale indicators
              alongside one of the sharper private-market markdowns among late-stage care-delivery platforms. Public and
              market-data sources around the August 2026 Series E consistently place the current valuation near $1.2
              billion, versus the roughly $5.7 billion valuation attached to the March and September 2021 financings.
              That implies a decline of about 79% from peak private pricing, even though management now describes the
              business as serving nearly 200,000 members and generating approximately $2.2 billion of annualized
              revenue. The simplest reading is that the market no longer values Cityblock as a high-multiple
              digital-health growth asset; instead it is pricing the company more like a risk-bearing healthcare
              operator whose worth depends on provable margins, medical-cost performance, and cash conversion. The
              adverse interpretation matters and should not be minimized. Sources such as Yahoo Finance / Forge,
              PitchBook, Rock Health, and sector commentary support the view that the company was repriced not because
              revenue disappeared, but because 2021 late-stage growth valuations embedded expectations that value-based
              care platforms have since struggled to defend. For a new investor, the reset is both an opportunity and a
              warning: entry price is dramatically lower than before, but the discount exists precisely because the
              market is demanding proof rather than narrative.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
