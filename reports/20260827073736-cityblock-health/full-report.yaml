      - number: '7.5'
        title: >-
          Technology, privacy, and measurement risk matter because Cityblock's AI story is now part of the operating
          thesis
        blocks:
          - type: paragraph
            body: >-
              Cityblock increasingly presents its CORE platform and AI-enabled workflow layer as part of the reason it
              can manage complex populations more efficiently. That creates opportunity, but it also adds a distinct
              class of risk. Healthcare AI products face growing scrutiny around privacy, security, explainability,
              model governance, and the possibility that inaccurate recommendations create downstream clinical or
              administrative harm. Even when a system is used for triage, care navigation, or assessment support rather
              than autonomous diagnosis, payers, regulators, and provider partners can still question whether protected
              health information is handled appropriately and whether model outputs create disparate impact or
              systematic error in vulnerable populations. These concerns are magnified in Medicaid and dual populations
              because documentation quality, social-risk coding, and cross-setting data completeness are often uneven.
              The practical risk for Cityblock is less about a single headline AI scandal today and more about silent
              underperformance: if model outputs are noisy, workflow integration is brittle, or privacy safeguards are
              challenged, the technology layer may fail to deliver the labor-productivity and quality gains now implied
              in management's narrative. That would weaken both the margin story and the strategic premium attached to
              the broader platform.
