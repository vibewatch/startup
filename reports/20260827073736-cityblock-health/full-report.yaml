  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and distribution
        blocks:
          - type: paragraph
            body: >-
              Cityblock sells primarily through institutional counterparties rather than direct-to-consumer channels.
              Its practical customers are Medicaid managed-care plans, Medicare Advantage plans, ACO or delegated-risk
              entities, and—after the Homeward combination—broader government-program partners that need local
              care-delivery infrastructure. That distinction matters because member growth alone does not prove
              commercial durability; the company must keep winning, expanding, and renewing complex payer contracts.
              Public materials indicate a scaled footprint across multiple states, a member base approaching 200,000
              after the 2026 Homeward combination, and a roster that spans urban Medicaid populations, dually eligible
              members, ACA populations, and now more rural beneficiaries. The customer story is therefore one of
              concentrated enterprise distribution with end-member engagement layered on top. Cityblock appears
              strongest where plans need deep community-based care management for medically and socially complex
              members, but this also means revenue concentration, renewal risk, and implementation quality remain
              central diligence questions. In practice, that means the sales motion likely depends on procurement
              cycles, actuarial confidence, implementation planning, and local network strategy more than on classic
              consumer marketing metrics. A payer can expand quickly if the operating model works, but can also pause if
              service consistency slips. This section intentionally ties customer quality to enterprise buying behavior,
              implementation reliability, and account-level expansion because those are the variables that most directly
              determine whether growth is durable.
