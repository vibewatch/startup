      - number: '4.4'
        title: Capital adequacy, financing dependency, and next-round triggers
        blocks:
          - type: paragraph
            body: >-
              Even after surpassing one billion dollars of cumulative capital raised, Cityblock still screens as a
              company whose funding needs are tied to execution quality rather than sheer survival. The new Series E
              brings lifetime funding to roughly $1.02 billion across seven disclosed rounds, with heavyweight backers
              including General Catalyst, SoftBank, Tiger Global, Thrive Capital, Maverick Ventures, Redpoint Ventures,
              Kinnevik, Wellington, 8VC, Echo Health Ventures, Goldman Sachs, and Alphabet's Sidewalk Labs. That
              syndicate depth reduces immediate financing risk, but the down-round terms also show that capital remains
              available only at a materially lower price than 2021. The likely next-round trigger is therefore not just
              cash runway but proof that EBITDA gains, customer diversification, and revenue growth are durable enough
              to support either a public-market path or a premium strategic outcome. If growth slows before margins
              harden, Cityblock could need more capital on only modestly better terms, especially if digital-health
              multiples remain compressed. Conversely, if the company can translate annualized revenue scale into
              credible free-cash-flow conversion, the current round may prove to have been a resetting bridge rather
              than a distress signal.
