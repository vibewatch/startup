      - number: '5.3'
        title: Agentic AI and member engagement workflows
        blocks:
          - type: paragraph
            body: >-
              Cityblock’s 2026 AI materials describe a more ambitious member-engagement architecture than a conventional
              chatbot. The company explicitly frames agentic AI as a way to keep Medicaid care available beyond normal
              office hours, allowing a member to text for guidance at night, schedule visits, ask benefits or medication
              questions, and be connected to human support when needed. In the AI-enabled member-journey examples, AI
              voice and messaging agents reach out when a member is enrolled or discharged, members respond in natural
              language, and the system detects needs such as food access, housing instability, or medication questions
              before routing summarized conversations to outreach specialists. This is important because Cityblock’s
              product claim is not just “automation”; it is that AI can function as a relationship engine that reduces
              missed outreach windows while preserving human follow-through. The same 2026 materials say AI agents
              handled 42,148 routine member calls and freed 44,599 clinician hours, indicating that these tools are
              already embedded in operating workflows rather than left at pilot stage. The member-facing care model also
              preserves a human escalation path through Community Health Partners, nurses, and specialists, which is
              consistent with management’s framing that routine work should flow to AI while judgment- and
              trust-intensive work stays with care teams.
            claimRefs:
              - CE017
              - CE018
