chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Origin, headquarters, and mission
        blocks:
          - type: paragraph
            body: >-
              Cityblock Health was founded in 2017 and emerged from Alphabet's Sidewalk Labs effort to rethink essential
              urban services for underserved communities. The company has consistently presented itself as a healthcare
              organization built for populations with the highest medical and social complexity rather than for
              commercially insured, digitally native consumers. Public profiles and company materials place the business
              in Brooklyn, New York, and link its origin story to neighborhoods where fragmented care, housing
              instability, food insecurity, and behavioral health needs compound chronic disease burden. That origin
              matters strategically because Cityblock's operating thesis is not simply telehealth convenience or narrow
              care navigation; it is a full-stack, value-based delivery and care-management model designed for
              government-sponsored populations whose outcomes depend on social support as much as clinical access.

              By August 2026, the company's own framing ties that mission directly to Medicaid, Medicare Advantage, and
              dual-eligible members, while the Homeward transaction extends the same thesis from dense urban markets
              into rural counties. Independent coverage from CNBC, Fast Company, and Healthcare Brew likewise describes
              Cityblock as a Sidewalk Labs spinout focused on low-income or Medicaid populations. The persistence of
              that positioning across company and third-party sources suggests that the core mission has remained stable
              even as the revenue base and geographic scope have expanded materially. For diligence purposes, Cityblock
              should therefore be understood first as a government-program outcomes business and only secondarily as a
              health-tech company.
