  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Market frame and where Cityblock sits
        blocks:
          - type: paragraph
            body: >-
              Cityblock’s competitive set spans several adjacent categories rather than a single clean peer group. Oak
              Street Health, ChenMed, and One Medical Seniors represent clinic-centered full-risk or risk-oriented
              primary care models built mainly for Medicare seniors. Landmark and CareBridge represent home- and
              community-based care routes for high-acuity or long-term-support populations. Aledade, Main Street Health,
              Guidehealth, and Wellvana attack the market through provider enablement, analytics, and value-based care
              operations rather than owning most frontline care themselves. Devoted Health is the most relevant
              integrated payvider comparison because it combines insurance economics with care-delivery coordination.
              This mix matters because Cityblock’s business touches all of these layers: care delivery, home-based
              support, social services, risk management, and contracting.

              Official Cityblock materials point to a very different starting point from most of these rivals. The
              company positions itself around Medicaid, low-income Medicare, and dually eligible members with complex
              needs, and its care model combines primary care, mental health, social care, urgent care, and
              hospital-to-home support. Cityblock’s 2025 dual-eligible report says dually eligible membership has grown
              8x since 2020, 86% of those members have more than two chronic conditions, 69% have a behavioral health
              need, and more than 30% have identified acute social needs. That profile creates a harder operating
              environment than a typical senior-primary-care model focused primarily on Medicare reimbursement and
              clinic throughput.

              As a result, the competitive map is asymmetrical. Cityblock rarely meets a rival that is superior across
              every dimension. Instead, each competitor is stronger on a narrower axis: Oak Street and ChenMed on mature
              senior-clinic playbooks, Aledade on distributed independent-practice reach, Landmark and CareBridge on
              home-based complexity, Main Street Health on rural alignment, Guidehealth on AI-forward enablement, and
              Devoted on payvider incentives. Cityblock’s thesis is that these narrower strengths do not add up to a
              better solution for Medicaid and dual populations unless they are integrated into one community-based
              model.
