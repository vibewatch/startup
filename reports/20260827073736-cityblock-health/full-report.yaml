  - id: TV008
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Diligence path
    rows:
      - - Gross margin by market
        - Market-level gross margin and medical-cost performance
        - Core test of whether low multiple is a bargain or a warning
        - Request market P&Ls and payer-cohort margin bridges
      - - Cash runway
        - Cash on hand, monthly burn, and financing plan
        - Determines whether Series E is bridge capital or durable runway
        - Request latest board materials and cash-flow statements
      - - Renewal quality
        - Payer retention and net expansion by cohort
        - Growth quality matters more than gross headline revenue
        - Request renewal cohort table and churn analysis
      - - Cap-table terms
        - Liquidation preferences, ratchets, or stacked protections
        - Common-equity upside can differ sharply from headline valuation
        - Request post-Series-E cap table and security terms
      - - Contribution margins
        - Unit economics by geography and population segment
        - Needed to validate bull/base/bear assumptions
        - Request cohort-level contribution margin schedules
      - - Policy sensitivity
        - Exposure by Medicaid and MA reimbursement regime
        - Valuation should reflect regulatory downside, not just growth upside
        - Map revenue and margin exposure by program and state
    notes: >-
      These asks are intentionally narrow and directly tied to valuation movement rather than generic diligence wish
      lists.
    claimRefs:
      - CV031
      - CV032
      - CV033
