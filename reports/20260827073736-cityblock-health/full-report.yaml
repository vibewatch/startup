      - number: '8.4'
        title: Recommendation, entry discipline, and thesis-break conditions
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a constructive but not fully aggressive stance. Cityblock does not look obviously
              expensive at roughly 0.55x annualized revenue, and comparable transactions suggest that scaled
              care-delivery assets can be worth more when economics are trusted. However, recommendation quality here
              must remain evidence-sensitive. The company is still private, recent valuation evidence partly comes from
              secondary-market or pricing-model sources, and critical underwriting inputs remain undisclosed. That makes
              a blind "buy the dip" conclusion too loose. The better call is research-more leaning positive: Cityblock
              appears potentially undervalued if diligence confirms market-level margin durability, contract retention,
              cash runway, and a cap table without punitive preference overhang. Entry discipline should therefore focus
              on what would move the view. Confirmation of positive operating margins expanding beyond core markets,
              independently corroborated renewal quality, and visibility into post-Series-E capitalization would justify
              a more assertive stance. Conversely, evidence of weak renewal cohorts, cash burn inconsistent with the
              revenue base, or a hidden overhang from stacked preferences would argue that the current valuation is a
              trap rather than an opportunity. The chapter's final valuation stance is attractive on relative screens,
              but only with medium confidence because too much of the decisive evidence remains private.
