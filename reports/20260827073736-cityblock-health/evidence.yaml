    severity: material
    topic: profitability
    missingEvidence: Audited or management-certified consolidated profitability and margin data for 2025-2026.
    whyItMatters: Revenue scale alone cannot establish unit economics or sustainable value-based margins.
    diligencePath: >-
      Request investor materials or lender-quality financial statements covering consolidated P&L and medical margin by
      market.
    relatedQuestionRefs:
      - QO030
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: Official post-money valuation for the August 2026 Series E.
    whyItMatters: >-
      The market currently relies on unofficial estimates around $1.2 billion while older sources still reference the
      2021 $5.7 billion mark.
    diligencePath: Obtain executed financing documents, board consents, or cap-table software exports for the Series E close.
    relatedQuestionRefs:
      - QO015
      - QO030
    relatedTableRefs:
      - TO001
      - TO004
  - type: access-blocked
    severity: minor
    topic: layoff
    missingEvidence: A directly retrievable live copy of the original TechCrunch layoff story.
    whyItMatters: The 155-employee figure is widely cited and material to the milestone chronology.
    diligencePath: >-
      Retrieve an archived copy, alternate high-reputation coverage, or internal HR communication confirming the
      reduction.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO005
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: investors
    missingEvidence: A complete current cap table with post-Series-E ownership percentages and board seats.
    whyItMatters: Public investor lists identify named backers but not control rights or dilution from the 2024 and 2026 financings.
    diligencePath: Request the latest capitalization table, investor rights agreement summary, and board observer list.
    relatedQuestionRefs:
      - QO017
      - QO030
    relatedTableRefs:
      - TO003
      - TO004
  - type: stale
    severity: minor
    topic: expansion
    missingEvidence: A contemporaneous 2020 primary source explicitly documenting the six-state footprint.
    whyItMatters: The milestone is likely correct but currently rests on later retrospective coverage.
    diligencePath: Locate archived company press releases, investor updates, or Wayback copies from 2020.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO005
  - type: private-evidence-only
    severity: material
    topic: cash-balance
    missingEvidence: Exact cash on hand at Series E close and management's post-close liquidity plan.
    whyItMatters: Runway cannot be underwritten without knowing starting liquidity and liquidity covenants.
    diligencePath: Request the latest board reporting package, cash reconciliation, and treasury forecast.
    relatedQuestionRefs:
      - QI023
    relatedTableRefs:
      - TI007
      - TI008
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: Gross margin and contribution margin by payer cohort, market, and contract type.
    whyItMatters: Revenue scale alone does not prove durable profitability in value-based care.
    diligencePath: Request market-level P&Ls and actuarial cost-development schedules for major contracts.
    relatedQuestionRefs:
      - QI016
      - QI022
    relatedTableRefs:
      - TI006
      - TI008
  - type: private-evidence-only
    severity: material
    topic: renewal-cohorts
    missingEvidence: Historical contract renewals, gross retention, and net retention by health-plan cohort.
    whyItMatters: Revenue quality and customer concentration risk depend on renewal durability.
    diligencePath: Request cohort retention analysis and the top ten payer contract summaries.
    relatedQuestionRefs:
      - QI022
      - QI025
    relatedTableRefs:
      - TI005
      - TI008
  - type: private-evidence-only
    severity: material
    topic: obligation-schedule
    missingEvidence: Debt, leases, guarantees, risk reserves, and any contingent payment obligations.
    whyItMatters: Hidden fixed obligations can shorten effective runway and change downside outcomes.
    diligencePath: Request debt schedule, lease maturity table, reserve methodology, and legal contingency log.
    relatedQuestionRefs:
      - QI018
      - QI025
    relatedTableRefs:
      - TI007
      - TI008
  - type: missing-source
    severity: material
    topic: interoperability
    missingEvidence: Detailed public documentation on APIs, FHIR support, or structured data exchange architecture.
    whyItMatters: >-
      Integration depth is central to whether Cityblock can scale its operating model across payers, providers, and
      community partners.
    diligencePath: >-
      Request technical diligence materials covering interoperability architecture, standards support, and partner
      integration workflows.
    relatedQuestionRefs:
      - QE027
      - QE029
    relatedTableRefs:
      - TE004
  - id: GU001
    gap: Public materials do not disclose customer-level renewal rates or churn.
    priority: high
  - id: GU002
    gap: Contract-level gross margin and payback by account remain undisclosed.
    priority: high
  - id: GU003
    gap: >-
      Named customer proof table remains partial because public sources do not provide a comprehensive payer roster or
      contract-by-contract detail.
    priority: medium
    relatedTableRefs:
      - TU006
  - type: missing-source
    severity: material
    topic: provider-tax-detail
    missingEvidence: >-
      Detailed primary documentation quantifying exactly how provider tax restrictions will change state financing flows
      in Cityblock's current markets.
    whyItMatters: >-
      State financing pressure can feed directly into rate adequacy and the appetite for intensive Medicaid value-based
      programs.
    diligencePath: >-
      Map Cityblock's active states to state budget notices, MCO rate filings, and provider-tax exposure analyses for
      2026-2027.
    relatedQuestionRefs:
      - QR005
      - QR006
    relatedTableRefs:
      - TR001
      - TR002
  - type: private-evidence-only
    severity: material
    topic: profitability-visibility
    missingEvidence: Market-level contribution margin, reserve policy, cash burn, and post-Series-E runway.
    whyItMatters: >-
      Public revenue and EBITDA-improvement claims are insufficient to test whether the model is truly approaching
      self-funding.
    diligencePath: Request board materials, payer-cohort P&Ls, and trailing 12-month cash-flow statements during diligence.
    relatedQuestionRefs:
      - QR009
      - QR027
    relatedTableRefs:
      - TR003
      - TR005
  - type: private-evidence-only
    severity: material
    topic: contract-risk
    missingEvidence: >-
      Contract-level allocation of downside risk, stop-loss structures, and renewal protections with major payer
      partners.
    whyItMatters: Full-risk exposure is central to the downside case and cannot be fully inferred from public positioning alone.
    diligencePath: Review master service agreements, delegated-risk schedules, and any risk-corridor provisions by payer.
    relatedQuestionRefs:
      - QR011
      - QR046
    relatedTableRefs:
      - TR003
      - TR005
  - type: private-evidence-only
    severity: material
    topic: integration-risk
    missingEvidence: Detailed integration roadmap, technology milestones, and first-180-day post-close KPIs for Homeward.
    whyItMatters: The acquisition is both a growth catalyst and one of the main execution risks in the chapter.
    diligencePath: Request PMI plan, joint steering metrics, and customer-retention dashboards for acquired markets.
    relatedQuestionRefs:
      - QR013
      - QR023
    relatedTableRefs:
      - TR004
      - TR008
  - type: private-evidence-only
    severity: material
    topic: ai-governance
    missingEvidence: Internal AI governance controls, validation studies, subgroup performance, and escalation procedures.
    whyItMatters: >-
      Public AI claims support the growth story but do not yet validate the safety, fairness, or durability of the
      technology edge.
    diligencePath: Request model cards, audit trails, privacy impact assessments, and false-positive/false-negative reporting.
    relatedQuestionRefs:
      - QR021
      - QR022
      - QR023
    relatedTableRefs:
      - TR008
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: Market-level gross margin, contribution margin, and medical-cost trend by payer cohort.
    whyItMatters: >-
      Without these data, investors cannot tell whether the low revenue multiple is mispricing temporary sentiment or
      correctly discounting weak economics.
    diligencePath: Request cohort P&Ls, medical-loss and utilization bridges, and board-level operating review materials.
    relatedQuestionRefs:
      - QV019
      - QV021
      - QV022
    relatedTableRefs:
      - TV006
      - TV008
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Post-Series-E cap table, liquidation preferences, ratchets, and any special downside protections.
    whyItMatters: >-
      Headline valuation can overstate common-equity upside when late-stage down rounds include stacked preferences or
      structural protections.
    diligencePath: Request the financing documents, security terms summary, and post-money ownership waterfall.
    relatedQuestionRefs:
      - QV027
    relatedTableRefs:
      - TV008
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: Cash on hand, monthly burn, and forward financing plan after the August 2026 round.
    whyItMatters: >-
      Runway determines whether the current round is a stable reset or only a temporary bridge to another difficult
      financing.
    diligencePath: >-
      Request trailing twelve-month cash-flow statements, monthly burn history, and management's base/bear financing
      model.
    relatedQuestionRefs:
      - QV019
      - QV022
      - QV025
    relatedTableRefs:
      - TV006
      - TV008
  - type: access-blocked
    severity: minor
    topic: paywalled-market-data
    missingEvidence: Full text of some market-data and premium news sources cited for comparable valuations and down-round commentary.
    whyItMatters: >-
      Headline and metadata are enough for directional support, but full text would improve precision on comparator
      limitations and market framing.
    diligencePath: Re-pull these sources through licensed databases or investor access if a full investment memo is required.
    relatedQuestionRefs:
      - QV016
      - QV028
