  - id: founders-and-leadership
    title: Founders, management team, and leadership transition
    body: >-
      Cityblock's founding team is anchored by Dr. Toyin Ajayi, Iyah Romm, and Bay Gross, with several secondary public
      profiles also naming product leader Mat Balez among the early team. The user-provided facts and multiple public
      company profiles consistently identify Ajayi, Romm, and Gross as the key founders for diligence purposes.
      Ajayi, a physician executive, is now CEO and the most visible strategic spokesperson. Romm, who previously led
      the company, stepped down from the CEO role in 2022, making the leadership handoff to Ajayi one of the major
      governance milestones in Cityblock's history. That transition appears to have preserved mission continuity while
      shifting the company toward a more clinically led public narrative.

      The current executive roster on Cityblock's about page includes Dr. Toyin Ajayi as CEO & Founder, Mike Roaldi as
      President, Roseline Agboke as Chief Financial Officer, and Alberto Lopez-Toledo as Chief Technology Officer. Other
      named executives include Dr. Alex Billioux as Chief Health Officer, Susan Brown as Chief Administrative Officer,
      and Jordan Vroblesky as Chief People Officer. From a diligence perspective, this team maps cleanly onto Cityblock's
      current priorities: Ajayi on mission and clinical credibility, Roaldi on operating scale and partnerships,
      Agboke on financing and unit economics discipline, and Lopez-Toledo on platform leverage. The main key-person risk
      remains concentrated in Ajayi because she is simultaneously founder, clinical voice, CEO, and principal narrator
      of the company's strategy.
    claimRefs:
