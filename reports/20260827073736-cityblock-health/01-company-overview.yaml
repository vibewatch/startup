  - id: funding-and-valuation
    title: Funding history, investor base, and valuation reset
    body: >-
      Cityblock has raised close to $1 billion of primary capital across seven institutional rounds from 2017 through
      2026, beginning with a $20.8 million Series A and culminating, for this chapter, in a $116 million Series E led
      by General Catalyst in August 2026. Public market-data profiles and press summaries broadly align on the round
      sequence: Series A in early 2018 following the December 2017 close process, a March 2019 Series B, a June 2020
      Series B extension, a December 2020 Series C, a March 2021 Series C extension, a September 2021 Series D led by
      SoftBank, and the August 2026 Series E. The investor base spans Maverick Ventures, Thrive Capital, Redpoint,
      Kinnevik, General Catalyst, Tiger Global, Wellington, Goldman Sachs Asset Management, SoftBank, and Alphabet/
      Sidewalk Labs, among others.

      The most important financing signal is not the absolute amount raised but the change in valuation. The 2021
      Series D valued Cityblock at roughly $5.7 billion, while late-August 2026 private-market pricing on Yahoo
      Finance/Forge implies an estimated valuation of about $1.22 billion. That is not an official post-money number
      for the new round, but it is directionally consistent with the user's instruction that the current valuation is
      about $1.2 billion and with reporting that frames 2026 as a down-round era for late-stage digital health. The
      result is a company that appears operationally much larger than in 2021 yet financially marked far lower, which
      raises diligence questions about margins, medical-loss performance, and the durability of value-based economics.
    claimRefs:
