callouts:
  - calloutType: insight
    title: Scale now outruns the old digital-health narrative
    body: Cityblock's disclosed $2.2 billion annualized revenue and nearly 200,000 members imply an operating scale far beyond most venture-backed care startups, even though public transparency still lags that scale.
    claimRefs:
      - CO013
      - CO014
      - CO015
  - calloutType: risk
    title: Valuation reset is the central financing signal
    body: The gap between the 2021 $5.7 billion valuation and the late-August 2026 roughly $1.2 billion market estimate suggests investors materially reset expectations despite meaningful revenue growth.
    claimRefs:
      - CO038
      - CO043
      - CO044
  - calloutType: strength
    title: Homeward broadens the addressable government-program footprint
    body: The Homeward deal extends Cityblock from urban Medicaid and duals into rural Medicare Advantage, potentially improving geographic and payer diversification.
    claimRefs:
      - CO011
      - CO012
      - CO045
      - CO048

