chapter:
  number: 1
  title: Company Overview
  summary: >-
    Cityblock Health is a Brooklyn-founded, Sidewalk Labs-incubated provider platform launched in 2017 to deliver
    value-based care to Medicaid, Medicare Advantage, and dual-eligible populations with complex social and clinical
    needs. As of August 2026 the company says it serves almost 200,000 members, has reached $2.2 billion of
    annualized revenue growing 77% year over year, has signed a definitive agreement to acquire rural-Medicare-focused
    Homeward Health, and raised a $116 million Series E led by General Catalyst. Public and market-data sources show a
    sharp valuation reset from the $5.7 billion 2021 Series D to an independent late-August 2026 estimate of roughly
    $1.2 billion, making scale-up momentum and capital efficiency the defining context for diligence.

sections:
  - id: company-origin-and-mission
    title: Origin, headquarters, and mission
    body: >-
      Cityblock Health was founded in 2017 and emerged from Alphabet's Sidewalk Labs effort to rethink essential urban
      services for underserved communities. The company has consistently presented itself as a healthcare organization
      built for populations with the highest medical and social complexity rather than for commercially insured,
      digitally native consumers. Public profiles and company materials place the business in Brooklyn, New York, and
      link its origin story to neighborhoods where fragmented care, housing instability, food insecurity, and behavioral
      health needs compound chronic disease burden. That origin matters strategically because Cityblock's operating
      thesis is not simply telehealth convenience or narrow care navigation; it is a full-stack, value-based delivery
      and care-management model designed for government-sponsored populations whose outcomes depend on social support as
      much as clinical access.

      By August 2026, the company's own framing ties that mission directly to Medicaid, Medicare Advantage, and
      dual-eligible members, while the Homeward transaction extends the same thesis from dense urban markets into rural
      counties. Independent coverage from CNBC, Fast Company, and Healthcare Brew likewise describes Cityblock as a
      Sidewalk Labs spinout focused on low-income or Medicaid populations. The persistence of that positioning across
      company and third-party sources suggests that the core mission has remained stable even as the revenue base and
      geographic scope have expanded materially. For diligence purposes, Cityblock should therefore be understood first
      as a government-program outcomes business and only secondarily as a health-tech company.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
      - CO007
      - CO008
    tableRefs:
      - TO001
    figureRefs:
      - FO002
  - id: care-model-and-scale
    title: Care model, populations served, and current operating scale
    body: >-
      Cityblock's service model combines in-person community care, virtual care, behavioral health, pharmacy support,
      social-care coordination, and data-driven member outreach under value-based arrangements with health plans and
      government-program stakeholders. The company states that it serves Medicaid, Medicare, and dual-eligible members;
      those categories fit the operational reality shown in the 2026 Humana North Carolina launch and the 2026 Homeward
      acquisition announcement. The Humana program starts with nearly 20,000 North Carolina dual-eligible and Medicare
      Advantage members, while the Homeward announcement says the combined company will serve almost 200,000 members
      nationally after adding about 50,000 rural members from Homeward.

      Management also used the August 2026 Homeward announcement to disclose unusually specific operating metrics for a
      private company: annualized revenue of $2.2 billion, 77% year-over-year growth, revenue more than four times the
      level at the last 2021 fundraise, 18 health-plan customers versus five in 2021, and positive operating margins in
      its core markets. Those statements, corroborated by trade-press summaries, frame Cityblock as a scaled healthcare
      operator rather than a pre-revenue digital health startup. The caveat is that these metrics come primarily from
      company-issued materials and follow-on reporting rather than audited consolidated financial statements, so the
      numbers are best treated as high-signal but not fully independently audited operating KPIs.
    claimRefs:
