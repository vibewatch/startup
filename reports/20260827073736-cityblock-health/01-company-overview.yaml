  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: profitability
      missingEvidence: Audited or management-certified consolidated profitability and margin data for 2025-2026.
      whyItMatters: Revenue scale alone cannot establish unit economics or sustainable value-based margins.
      diligencePath: Request investor materials or lender-quality financial statements covering consolidated P&L and medical margin by market.
      relatedQuestionRefs: [QO030]
    - type: conflicting-data
      severity: material
      topic: valuation
      missingEvidence: Official post-money valuation for the August 2026 Series E.
      whyItMatters: The market currently relies on unofficial estimates around $1.2 billion while older sources still reference the 2021 $5.7 billion mark.
      diligencePath: Obtain executed financing documents, board consents, or cap-table software exports for the Series E close.
      relatedQuestionRefs: [QO015, QO030]
      relatedTableRefs: [TO001, TO004]
    - type: access-blocked
      severity: minor
      topic: layoff
      missingEvidence: A directly retrievable live copy of the original TechCrunch layoff story.
      whyItMatters: The 155-employee figure is widely cited and material to the milestone chronology.
      diligencePath: Retrieve an archived copy, alternate high-reputation coverage, or internal HR communication confirming the reduction.
      relatedQuestionRefs: [QO025]
      relatedTableRefs: [TO005, TO002]
    - type: enumeration-incomplete
      severity: minor
      topic: investors
      missingEvidence: A complete current cap table with post-Series-E ownership percentages and board seats.
      whyItMatters: Public investor lists identify named backers but not control rights or dilution from the 2024 and 2026 financings.
      diligencePath: Request the latest capitalization table, investor rights agreement summary, and board observer list.
      relatedQuestionRefs: [QO017, QO030]
      relatedTableRefs: [TO003, TO004]
    - type: stale
      severity: minor
      topic: expansion
      missingEvidence: A contemporaneous 2020 primary source explicitly documenting the six-state footprint.
      whyItMatters: The milestone is likely correct but currently rests on later retrospective coverage.
      diligencePath: Locate archived company press releases, investor updates, or Wayback copies from 2020.
      relatedQuestionRefs: [QO024]
      relatedTableRefs: [TO005]
