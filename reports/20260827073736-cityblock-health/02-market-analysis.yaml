chapter:
  number: 2
  title: Market Analysis
  summary: 'Cityblock Health sits inside the U.S. government-sponsored, risk-bearing value-based care market, with its most relevant wedge in Medicaid and dual-eligible managed care. Public market evidence supports a very large top-down opportunity: the broader value-based healthcare services market is projected at $2.27T in 2026 with 17.86% CAGR to 2031, while Medicaid managed care remains one of the largest and most pressured execution environments, covering 66.7M members in April 2026 after falling from 70.4M in July 2025. The market is concentrated at the payer layer, with the Big Five MCOs controlling ~43% of Medicaid managed care and reporting $68.8B of Q2 2026 Medicaid revenue, but fragmented at the provider-partner layer where risk-bearing primary care, behavioral health, care management, and social-support operators compete for delegated contracts. For Cityblock, demand is propelled by fiscal pressure, chronic disease burden, policy-driven VBC adoption, and AI-enabled risk stratification,
    while headwinds include H.R. 1-related disenrollment, federal Medicaid funding pressure, provider workforce shortages, administrative complexity, and reimbursement uncertainty.

    '
