- id: segment-buyer-payer-map
  title: Buyer, User, Payer, and Segment Map
  body: 'Cityblock’s market has a multi-sided structure. The end user is the member—typically a Medicaid, dual-eligible, or other government-program beneficiary with high clinical and social complexity. The economic payer is usually the state Medicaid program or CMS, but the immediate contracting counterparty is often a managed care organization that receives capitation and then decides whether to delegate part of the care-management and clinical-risk function to partners. That means the enterprise buyer is rarely the patient or even a provider system; it is usually the health plan, state-aligned managed care vehicle, or risk-bearing network that controls PMPM budget flow.

    This procurement structure creates several distinct segments. One is pure Medicaid managed care, where MCOs seek partners for high-acuity populations, quality improvement, reduced avoidable ED use, and lower medical cost trend. Another is dual-eligible care, where coordination across Medicare and Medicaid benefits raises complexity and makes integrated behavioral, primary, and social care more valuable. A third is rural or special-population government-program care, increasingly relevant after Homeward, where access scarcity and home-based care logistics change the delivery model. A fourth is adjacent Medicare risk programs, which are strategically useful but not the historical core.

    Market concentration is asymmetric. At the payer layer, the Big Five MCOs—Centene, CVS/Aetna, Elevance, Molina, and UnitedHealth—control roughly 43% of Medicaid managed care and generated $68.8 billion of Medicaid revenue in Q2 2026. At the provider-partner layer, however, the market is still comparatively fragmented, populated by companies such as Cityblock, CareBridge, Monogram, Equality Health, provider-sponsored entities, FQHC networks, and plan-owned care-management arms. This structure gives large payers substantial leverage in pricing and contracting, while creating room for differentiated operators that can show superior outcomes in complex populations.

    '
