  rows:
  - - Core market — Medicaid value-based care delivery
    - Delegated care management, primary care, behavioral health, social-support services, quality and utilization management under PMPM/capitated models
    - Fee-for-service outpatient care without delegated accountability
    - Medicaid MCOs, state Medicaid programs, risk-bearing provider networks
    - Closest fit to Cityblock’s historical operating model
  - - Core adjacency — dual-eligible integrated care
    - Coordination across Medicare and Medicaid benefits for high-acuity populations
    - Standalone Medicare Advantage without Medicaid overlap
    - D-SNP-aligned plans, integrated care entities, public payers
    - High complexity but strong value proposition for whole-person care
  - - Expansion adjacency — rural government-program care
    - Home-based and distributed care for underserved public-program members
    - Commercial employer populations
    - Government-program plans and delegated rural-risk entities
    - More relevant after Homeward acquisition
  - - Substitute — plan-owned internal care management
    - Health-plan-employed nurse care managers, utilization review, member engagement teams
    - External delegated operators
    - Large national and regional MCOs
    - Biggest incumbent substitute in procurement processes
  - - Substitute — fragmented safety-net delivery
    - FQHCs, hospital clinics, community behavioral health, social-service referrals operating separately
    - Integrated PMPM model with unified accountability
    - State/federal funding plus Medicaid claims
    - Status quo for many geographies Cityblock targets
  notes: 'Market boundary is intentionally narrower than the full value-based healthcare market and wider than any single digital-health category. It focuses on government-sponsored, delegated, longitudinal care models most relevant to Cityblock.

    '
