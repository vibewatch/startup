- id: constraints-risks-and-market-frictions
  title: Constraints, Risks, and Market Frictions
  body: 'The same market also carries serious constraints. First, H.R. 1 and related federal Medicaid policy changes are expected to increase disenrollment and reduce covered lives over time. KFF’s summary of CBO analysis indicates the law cuts federal Medicaid spending by $911 billion over a decade and increases the uninsured population by 10 million in 2034, with Medicaid work requirements playing a significant role. For Cityblock, fewer enrolled lives means fewer members available for attribution even if per-member acuity and care needs remain high.

    Second, federal and state funding pressure can both help and hurt the model. Budget stress may accelerate interest in VBC, but it also raises rate sensitivity, procurement delays, and contract scrutiny. A state or plan under financial pressure may want better outcomes yet still be reluctant to delegate margin to external operators. Third, workforce shortages remain a hard operating constraint. 2026 primary care and behavioral health sources describe persistent clinician scarcity, uneven provider distribution, and underinvestment in workforce development. Because Cityblock’s model depends on multidisciplinary teams, workforce bottlenecks can limit scaling even when demand is strong.

    Fourth, administrative complexity remains high. Medicaid programs vary by state, MCO contract, quality metrics, data-sharing maturity, and regulatory requirements. Dual-eligible care adds another layer of fragmentation because incentives and benefits cross Medicare and Medicaid. Fifth, reimbursement and policy uncertainty remain material in adjacent markets, including Medicare Advantage rate tightening and broader debate about how much risk-bearing providers should be paid to manage public beneficiaries. These frictions do not invalidate the market; they explain why scale has been hard to build and why only a limited number of operators have reached meaningful national relevance.

    '
