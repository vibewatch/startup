  title: Medicaid is strategically more important even as membership contracts
  body: 'Cityblock’s core market lost covered lives between July 2025 and April 2026, but that decline likely makes high-performance care partners more valuable, not less, because states and MCOs face more pressure to improve outcomes with tighter budgets.

    '
  claimRefs:
  - CM013
  - CM014
  - CM030
  - CM031
- calloutType: risk
  title: Coverage and funding pressure can shrink the addressable base
  body: 'H.R. 1-related work requirements and federal Medicaid spending cuts create a meaningful long-run risk that the attributable member base for Medicaid-focused operators shrinks even if acuity and care complexity remain high.

    '
  claimRefs:
  - CM038
  - CM039
  - CM040
- calloutType: strength
  title: Concentrated payers still need differentiated delegated operators
  body: 'The Big Five MCOs dominate Medicaid managed care economics, but provider-partner delivery remains fragmented. That creates an opening for operators such as Cityblock that can prove clinical and financial results in complex populations.

    '
  claimRefs:
  - CM025
  - CM026
  - CM027
  - CM028
- calloutType: assumption
  title: Multiple market lenses are necessary
  body: 'No single public source cleanly sizes Cityblock’s exact SAM. This chapter therefore uses layered lenses—broad VBC spend, public-program coverage, Medicaid managed care membership, and VBC services estimates—rather than forcing a false precision TAM.

    '
  claimRefs:
  - CM010
  - CM012
  - CM016
  - CM018
