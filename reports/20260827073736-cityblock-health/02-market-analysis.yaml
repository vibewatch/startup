- id: growth-drivers-and-policy-tailwinds
  title: Growth Drivers and Market Tailwinds
  body: 'The strongest structural market driver is the continued shift from fee-for-service reimbursement toward value-based models that reward measurable outcomes. In Medicaid this shift is no longer experimental; it is being pushed by fiscal necessity. KFF’s FY2025–FY2026 Medicaid budget survey shows states facing slower revenue growth, rising provider and pharmacy costs, and a materially more fragile budget environment. When budgets tighten, states and MCOs become more interested in models that can reduce avoidable utilization, improve quality scores, and deliver predictable PMPM spending rather than open-ended fee-for-service trend.

    A second driver is the burden of chronic disease and social complexity in government-program populations. Medicaid and dual-eligible cohorts are disproportionately affected by behavioral health conditions, multiple chronic diseases, housing instability, and fragmented care access, which makes integrated care-management models economically relevant. This is exactly the operating problem Cityblock addresses. A third driver is technology adoption: 2026 market commentary from value-based care operators and technology vendors shows AI increasingly being used for risk stratification, care-gap identification, quality management, and workflow prioritization. For an operator like Cityblock, AI is not the product category; it is a scaling tool that can improve targeting, staffing leverage, and intervention timing across a high-need population.

    Policy also remains a direct catalyst. Public 2026 commentary consistently describes Medicaid as one of the fastest-scaling VBC arenas because governments cannot solve budget pressure simply by adding more unmanaged utilization. Capitation and PMPM structures remain the dominant economic design because they transfer accountability for both cost and quality. Cityblock’s integrated primary care, behavioral health, and social-support model fits that policy direction better than point solutions that only address one care gap. The company’s strategic relevance therefore rises when states and plans prioritize whole-person management over siloed vendor tools.

    '
