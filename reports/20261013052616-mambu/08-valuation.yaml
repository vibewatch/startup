  - TV003
  figureRefs:
  - FV001
- id: exit-readiness-and-diligence-path
  title: Exit Readiness, Diligence Asks, and Thesis-Break Triggers
  body: 'Mambu''s potential path to an initial public offering or strategic acquisition is heavily constrained by financial
    opacity and structural capitalization hurdles. While strategic buyers in financial technology or enterprise software could
    value Mambu''s composable cloud engine, public market listing readiness demands audited historical GAAP/IFRS financials,
    predictable net revenue retention metrics, and proven operating cash flow generation. Prior to any investment decision,
    diligence must prioritize four critical items: audited 2024–2026 income statements and balance sheets, detailed software
    license versus professional services revenue mix, contract-level cohort churn rates, and full cap-table liquidation preference
    schedules. Clear thesis-break triggers include severe churn among anchor enterprise accounts like Western Union, regulatory
    sanctions across key operating jurisdictions, or insider secondary trades clearing below $1.0B, which would confirm severe
    equity impairment.'
  claimRefs:
  - CV002
  - CV003
  - CV005
