- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Category
  - Thesis (Bull View)
  - Anti-Thesis (Bear View)
  - What Would Change The View
  rows:
  - - Product & Architecture
    - Composable, API-first architecture allows rapid time-to-market (7-month Western Union launch) and unified core banking,
      payments, and AI.
    - Core banking migrations are high-friction, lengthy, and face entrenched legacy incumbents like Temenos and Finastra.
    - Evidence of accelerated Tier-1 bank core replacements or rising win rates against legacy providers.
  - - Commercial Traction
    - Scale across 260+ customers in 65+ countries, expanding into Islamic banking with Nyla and 7x payments processing volume
      growth.
    - Customer tier mix may lean heavily on early-stage fintechs with elevated mortality rates and lower contract values.
    - Audited disclosures showing high enterprise net revenue retention (>115%) and low logo churn.
  - - Valuation & Multiple
    - Market leader in cloud-native core banking with defensible position deserving premium platform multiples.
    - The $5.5B 2021 valuation benchmark represents peak-bubble pricing with heavy liquidation preference overhang.
    - A clean-term recapitalization or secondary transaction pricing Mambu at prevailing 6x–8x ARR multiples.
  - - Financial Transparency
    - Private ownership allows long-term R&D investment in agentic AI and unified payments without quarterly earnings scrutiny.
    - Zero published audited revenue or ARR creates severe information asymmetry and governance opacity.
    - Full audited financial statements showing positive operating cash flow and resilient gross margins.
  notes: Thesis and anti-thesis points balance verified platform capabilities against market risk, competition, and opacity.
