tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Stance / Rating
  - Key Evidence & Rationale
  - Decision Implication
  rows:
  - - Recommendation
    - Research More (Cautious Hold)
    - Strong technical platform with 260+ enterprise clients, but complete lack of public financial disclosure prevents underwriting.
    - Withhold capital deployment until management provides audited financials, retention data, and ARR breakdown.
  - - Confidence Score
    - Medium (6.4 / 10)
    - Operational adoption and partner momentum are verified, but revenue estimates ($220M) and unit economics remain unverified.
    - Require deeper private confirmatory diligence on unit economics and cohort churn.
  - - Risk Rating
    - High
    - Significant legacy competition from Temenos and Finastra, data security burdens, and unverified 2021 valuation overhang.
    - Model strict downside valuation haircuts and simulate preference stack liquidation return hurdles.
  - - Valuation Stance
    - Stretched
    - The $5.5B Series E valuation from late 2021 implies ~25x unverified 2025 estimated revenue of $220M, far above current
      public comps.
    - Target entry valuation below $1.5B–$2.2B (6x–10x revenue) to achieve market-clearing venture returns.
  notes: Assessment synthesizes verified customer and operational footprint against unverified revenue estimates and historical
    2021 valuation marks.
