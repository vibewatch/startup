- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Operating Assumptions
  - Valuation / Return Logic
  - Key Downside Risks
  - Probability Signal
  rows:
  - - Bull Case
    - Revenue accelerates to $280M+ with 80%+ gross margin; payments hub expands rapidly across EMEA, LATAM, and APAC; Tier-1
      migrations scale.
    - Valued at 10x–12x revenue ($2.8B–$3.4B); provides positive return from reset entry point but remains below $5.5B peak.
    - Execution stumbles in agentic AI; slow bank procurement cycles drag sales cycles.
    - 'Low (15%): Requires sustained enterprise contract expansion and public market tech multiple expansion.'
  - - Base Case
    - Revenue stabilizes near $200M–$220M estimate; moderate growth in regional banks and neobanks (e.g., Nyla); steady payments
      processing adoption.
    - Valued at 6x–8x revenue ($1.2B–$1.8B); reflects standard private SaaS multiples for growth-stage fintech infrastructure.
    - Neobank client churn; pricing pressure from modern competitors like Thought Machine.
    - 'Moderate (55%): Best matches observed headcount stabilization (767 staff) and steady partner wins.'
  - - Bear Case
    - Revenue stalls below $160M due to fintech client attrition; core modernization deals stall; intense competition from
      legacy incumbents.
    - Valued at 3x–4x revenue ($480M–$640M); senior liquidation preferences absorb all proceeds, wiping out common equity.
    - Severe down-round; governance friction; customer churn among capitalized neobanks.
    - 'Substantial (30%): Significant risk given 2021 valuation vintage and fintech sector multiple contraction.'
  - - Downside Trigger
    - Loss of anchor clients or regulatory compliance/security breach across banking scheme jurisdictions.
    - Distressed fire sale or asset liquidation below preference stack ($660M total raised).
    - Regulatory sanctions; critical core outage; customer deposit run.
    - 'Low (Event-driven): Tail risk monitored through security compliance and bank partner stability.'
  notes: Scenarios evaluate return potential from current unverified estimates ($220M revenue) and highlight severe overhang
    from the $5.5B Series E mark.
