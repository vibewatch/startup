evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: >-
      Current revenue or ARR, growth, software-versus-services mix, gross margin, retention, burn, runway, and
      headcount.
    whyItMatters: >-
      Without consistent periods and denominators, operating quality, capital efficiency, and valuation cannot be
      assessed.
    diligencePath: >-
      Request audited statements, monthly management accounts, revenue bridge, cohort retention, payroll roster, and
      cash forecast.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: ownership-and-financing
    missingEvidence: >-
      Verified round documents, current financing stage, total capital raised, cash available, fully diluted ownership,
      preference stack, debt, secondaries, and current valuation evidence.
    whyItMatters: One low-reputation round summary cannot establish ownership, liquidation economics, or a current equity mark.
    diligencePath: >-
      Obtain the cap table, financing and debt documents, bank statements, investor rights agreements, and recent 409A
      or secondary evidence.
    relatedQuestionRefs:
      - QO004
      - QO010
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: governance-and-leadership
    missingEvidence: >-
      Current executive roster, board members, committees, investor directors, founder roles, departures, succession
      coverage, and voting thresholds.
    whyItMatters: The public leadership sample cannot measure governance quality, control, or key-person dependence.
    diligencePath: >-
      Request the current organization chart, board materials, corporate register, committee charters, succession plan,
      and executive retention data.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: minor
    topic: headquarters
    missingEvidence: >-
      A current primary record identifying Mambu's legal headquarters, registered entities, and principal operating
      office.
    whyItMatters: Berlin-based and Amsterdam-based descriptions are not interchangeable with legal domicile or tax residence.
    diligencePath: >-
      Confirm the parent entity and registered office through current corporate registry extracts and management
      confirmation.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: adverse-events
    missingEvidence: >-
      Event-level evidence on outages, breaches, litigation, enforcement, sanctions, customer losses, layoffs, or other
      adverse developments.
    whyItMatters: A zero-result assigned adverse query does not establish that no incident occurred.
    diligencePath: >-
      Run jurisdiction-specific legal, regulatory, status-history, and customer-reference diligence outside this bounded
      source pool.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Audited segmentation of cloud-native core banking spend separating composable API-driven engines from monolithic
      hosted legacy cores.
    whyItMatters: >-
      Broad analyst core banking software market totals ($15B to $23B in 2026) combine legacy mainframe license renewals
      and custom systems integration with true cloud-native SaaS, obscuring the precise serviceable market available to
      modern composable vendors.
    diligencePath: >-
      Obtain vendor-tier contract benchmarks and customer procurement data to isolate pure software license and SaaS
      spend from systems integration services across composable implementations.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: Granular win-loss discounting data and private contract pricing schedules across tier-one bank implementations.
    whyItMatters: >-
      Without realized contract pricing schedules, diligence cannot determine whether Mambu discounts heavily against
      Temenos or Thought Machine to win enterprise tier-one accounts.
    diligencePath: >-
      Request customer procurement contracts, redline amendments, and sales win-loss teardowns from Mambu management
      under NDA.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: audited-arr-and-retention
    missingEvidence: >-
      Audited board-level ARR bridge for 2024-2026, including Gross Revenue Retention (GRR), Net Revenue Retention
      (NRR), and software subscription vs services revenue splits.
    whyItMatters: >-
      Essential to underwrite growth durability, customer expansion velocity, and true recurring software quality
      relative to private market SaaS valuation benchmarks.
    diligencePath: Request customer cohort ARR waterfall, retention schedules, and audited financial statements under NDA.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: post-2022-cash-burn-and-runway
    missingEvidence: >-
      Updated cash flow statements, monthly cash burn rate, cash on hand, and debt facility obligations following the
      2024 Numeral acquisition.
    whyItMatters: >-
      Determines forward capital adequacy, whether Mambu requires external dilutive financing, and the capital intensity
      of expanding international payment rails.
    diligencePath: >-
      Request trailing twelve-month cash flow bridge, balance sheet cash balances, and debt covenant terms in
      confirmatory diligence.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public developer community traction metrics, open-source SDK download volumes, and public API response latency
      telemetry from live enterprise deployments.
    whyItMatters: >-
      Mambu operates as a closed enterprise SaaS solution sold directly to regulated financial institutions; absence of
      public developer signals limits independent verification of API ergonomics, developer satisfaction, and throughput
      under peak load.
    diligencePath: >-
      Request customer-side developer documentation, client API performance SLAs, and developer satisfaction scores
      during confirmatory technical diligence.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: minor
    topic: pricing-and-evaluation
    missingEvidence: >-
      Detailed tiered pricing schedules, transaction-based volume fee curves, and contract terms for tier-1 bank
      implementations.
    whyItMatters: >-
      Independent reviews note transaction-based fee structures can introduce cost unpredictability at high volumes,
      impacting unit economics for rapid-scale digital banking rollouts.
    diligencePath: Review customer contract pricing annexes and historical overage fee distributions in data room.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE001
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: >-
      Audited net revenue retention (NRR), gross retention rate (GRR), logo churn, and cohort expansion rates across
      enterprise bank and neobank tiers.
    whyItMatters: >-
      Without public cohort retention disclosure, customer durability and the long-term revenue impact of neobank
      insolvency or vendor switching cannot be independently modeled.
    diligencePath: >-
      Request board-level retention cohorts, annual SaaS NRR metrics, and contract renewal rates through private
      diligence.
    relatedQuestionRefs:
      - QU004
  - type: enumeration-incomplete
    severity: minor
    topic: customer-enumeration
    missingEvidence: >-
      Comprehensive client registry detailing all 250+ active financial institutions, contract vintages, and live versus
      decommissioned tenant status.
    whyItMatters: >-
      Public case studies highlight successful production reference accounts, but a full enumeration is needed to
      evaluate account concentration and dormant contract risks.
    diligencePath: Examine complete customer master list and revenue contribution per top-10 accounts under NDA.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: financial-metrics
    missingEvidence: Audited financial statements confirming 2025-2026 ARR, software gross margins, and net revenue retention.
    whyItMatters: >-
      Without verified ARR and margin data, valuation multiples and cash burn sustainability cannot be definitively
      assessed.
    diligencePath: >-
      Review confidential financial disclosure packages, audited management accounts, or investor reporting decks under
      NDA.
    relatedQuestionRefs:
      - QR008
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited income statements, balance sheets, and ARR breakdown for 2024-2026 are not publicly disclosed by Mambu.
    whyItMatters: Prevents independent validation of valuation multiples, revenue quality, gross margin, and operating burn rate.
    diligencePath: >-
      Request audited 2024-2025 financial statements, software license versus professional services mix, and trailing
      12-month ARR from management.
    relatedQuestionRefs:
      - QV010
    relatedTableRefs:
      - TV003
  - type: stale
    severity: material
    topic: valuation-benchmarks
    missingEvidence: Absence of secondary share transactions, updated 409A valuations, or private round valuations post-2021 Series E.
    whyItMatters: >-
      The historical $5.5B Series E valuation from late 2021 reflects peak fintech market multiples and is highly
      unlikely to hold in current market conditions.
    diligencePath: >-
      Diligence cap-table liquidation preferences, recent secondary trading bids, and internal share valuation marks
      under NDA.
    relatedQuestionRefs:
      - QV005
    relatedTableRefs:
      - TV001
      - TV003
