callouts:
  - calloutType: insight
    title: The Composable Architecture Advantage
    body: Mambu's primary competitive edge over legacy providers like Temenos and Finastra lies in rapid time-to-market. By decoupling core lending and deposit engines into cloud-native APIs, digital banks can launch localized financial products in months rather than multi-year implementation cycles.
    claimRefs:
      - CP003
      - CP004
      - CP011
  - calloutType: risk
    title: Enterprise Displacement and Tier-1 Inertia
    body: While Mambu has successfully captured fintechs and digital subsidiaries, displacing legacy monoliths at large universal banks remains difficult. High switching costs, regulatory scrutiny, and complex core ledger migration risks create strong inertia favoring entrenched incumbent vendors.
    claimRefs:
      - CP005
      - CP007
      - CP010
      - CP012
