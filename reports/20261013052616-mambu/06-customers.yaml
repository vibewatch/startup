    columns:
      - Segment
      - Target Buyer & Payer
      - Primary Use Case
      - Reported Customer Scale
      - Strategic Value to Mambu
      - Key Diligence Gap
    rows:
      - - Tier-1 & Regional Banks
        - Chief Digital Officers, Head of Core Banking
        - Dual-core digital flanker brands, progressive core migration, deposits
        - Named accounts including BancoEstado (14M accounts), Bank Islam, ABN AMRO New10
        - High ACV and multi-year contract stability
        - Contract duration, software-vs-services mix, and SLA penalty terms undisclosed
      - - Neobanks & Digital Challengers
        - Founders, CTOs, Head of Product
        - Full greenfield cloud-native core, CASA accounts, rapid product iteration
        - 250+ historical clients including GoTyme Bank, Krom Bank, Uno Bank, Ualá
        - High initial velocity and transaction growth engine
        - Vulnerability to neobank funding cycles, consolidation, and churn
      - - Lenders & Specialized Credit
        - Head of Lending, Chief Risk Officer
        - Consumer lending, SME lending, mortgages, and split-and-pay structures
        - Raiffeisen Digital Bank, OYAK ANKER Bank, regional microfinance entities
        - Modular lending engine expansion and high margin licensing
        - Credit volume dependency and lack of native out-of-the-box BNPL modules
      - - Fintechs & Payment Hub Clients
        - VP Payments, Head of Operations
        - Global payments orchestration, scheme connectivity, real-time settlement
        - Western Union, BCB Group, Flowe, Spendesk (7x processing volume growth in 2025)
        - High net revenue expansion via payments volume monetization
        - Take-rate economics and payment partner margin capture opacity
    notes: Segmentation synthesized from Mambu public customer hub disclosures, Google Cloud case study, and press announcements as of 2026. ACV and contract terms represent diligence assessments as Mambu does not disclose segment-level ARR.
