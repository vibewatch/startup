callouts:
  - calloutType: insight
    title: Accelerated Time-to-Market vs Legacy Core Modernization
    body: Mambu consistently delivers digital banking go-to-market velocity within 3 to 9 months—as demonstrated at Bank Jago (5 months), Western Union (7 months), and Uno Bank (9 months)—substantially compressing the 4- to 5-year deployment cycles typical of legacy cores such as Temenos or Finacle.
    claimRefs:
      - CU005
      - CU007
      - CU008
      - CU010
  - calloutType: risk
    title: Tier-1 Legacy Migration Barriers and Out-of-the-Box Feature Limits
    body: While Mambu demonstrates national-scale capability through BancoEstado's 14-million account migration in Chile, legacy core replacement in established institutions remains multi-year and complex. Furthermore, system integrator feedback highlights gaps in out-of-the-box advanced credit features like BNPL and neutral customer support as adoption hurdles.
    claimRefs:
      - CU006
      - CU009
      - CU014
