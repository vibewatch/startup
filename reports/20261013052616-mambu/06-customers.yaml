company:
  name: Mambu
chapter:
  number: 6
  title: Customers
  summary: Mambu serves over 250 financial institutions across 65+ countries, powering services for more than 230 million end users and processing over 500 million daily API calls. Production deployments span national scale at BancoEstado (14 million accounts) and rapid go-to-market at Western Union, Bank Jago, and Uno Bank, though lack of public NRR and retention cohort disclosures leaves customer durability as a key diligence item.
sections:
  - id: customer-base-segmentation
    title: Customer Base Segmentation & Buyer Personas
    body: 'Mambu’s customer footprint spans more than 250 institutions globally across tier-one commercial banks, digital challenger neobanks, specialized credit providers, and non-financial innovators. Key buyer personas diverge sharply across these customer segments: tier-one and regional banks engage Chief Digital Officers seeking progressive core modernization or greenfield flanker brands, whereas venture-backed neobanks and fintech startups engage technical founders requiring agile API-first deployment. Across emerging and developed markets, Mambu provides an alternative to legacy monolithic core architectures, supporting institutions across Europe, Latin America, Asia Pacific, and Africa. However, customer revenue distribution remains undisclosed, creating ambiguity regarding the balance between high-ACV enterprise banking contracts and smaller fintech subscriptions.'
    claimRefs:
      - CU001
      - CU002
      - CU013
    tableRefs:
      - TU001
  - id: adoption-trajectory-scale
    title: Adoption Trajectory & Production Utilization
    body: Mambu’s operational utilization metrics demonstrate substantial scale, with the platform reporting over 230 million end users banking through its customer base and more than 500 million API calls processed daily. This operational velocity represents a significant expansion from late 2021, when Mambu reported 80 million end users across 250 customers upon reaching a 4.9 billion euro valuation. Customer organizations achieve go-to-market acceleration, reducing new product deployment timelines to three to six months compared to the multi-year cycles demanded by traditional core banking engines. Nevertheless, the lack of disclosed metrics regarding active transacting users versus dormant accounts prevents independent verification of per-account transaction density across the underlying customer estate.
    claimRefs:
      - CU003
      - CU004
      - CU010
    tableRefs:
      - TU002
  - id: named-customer-evidence-outcomes
    title: Named Customer Deployments & Time-to-Market Outcomes
    body: Publicly documented production deployments confirm Mambu’s versatility across major enterprise banking, digital banking, and regional challenger environments. In Latin America, BancoEstado completed a multi-year modernization migrating 14 million CuentaRUT accounts to Mambu with zero reported downtime, validating the core platform’s high-volume transaction reliability. In Europe, Western Union launched its European digital banking application in seven months across four markets, processing all SWIFT, SEPA, and Target2 payments. In the Asia-Pacific region, Bank Jago in Indonesia achieved a five-month launch for daily accounts, while Uno Bank in the Philippines deployed CASA accounts in nine months, cutting operating costs by 50% to 60%. However, practitioner reviews note neutral support experiences and a lack of native Buy Now Pay Later modules out of the box.
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU008
      - CU009
    tableRefs:
      - TU003
  - id: retention-durability-expansion-risks
    title: Retention Durability, Expansion Loops & Concentration Risks
    body: Mambu’s commercial durability increasingly relies on expansion loops beyond core deposits and lending into integrated payments orchestration and ecosystem connectivity. The company reported a sevenfold increase in payments volume processed during 2025 across key clients such as Western Union, Spendesk, Flowe, and BCB Group, establishing payments as a rapid cross-sell driver across EMEA, LATAM, and APAC. Similarly, fast-scaling neobanks like Ualá in Argentina demonstrate how expanding end-user bases create platform stickiness. However, Mambu does not disclose net retention rates, gross retention, or cohort churn, leaving open questions regarding enterprise renewal cycles and exposure to neobank failure rates during macroeconomic contractions.
    claimRefs:
      - CU011
      - CU012
      - CU014
    figureRefs:
      - FU001
