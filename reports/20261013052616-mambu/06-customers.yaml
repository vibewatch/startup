  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-metrics
      missingEvidence: Audited net revenue retention (NRR), gross retention rate (GRR), logo churn, and cohort expansion rates across enterprise bank and neobank tiers.
