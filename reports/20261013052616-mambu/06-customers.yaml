  - id: FU001
    title: Customer adoption and expansion journey map
    type: journey-map
    summary: Customer adoption trajectory across evaluation, greenfield launch, enterprise core migration, payments expansion, and intelligent automation.
    data:
      items:
        - label: Evaluation & Architecture Selection
          stage: Evaluation & Architecture Selection
          touchpoints:
            - Composable API evaluation
            - Multi-cloud Kubernetes benchmarking
            - Vendor comparison against Temenos and Thought Machine
          outcome: Selection of Mambu as flexible SaaS core
        - label: Greenfield Product Configuration
          stage: Greenfield Product Configuration
          touchpoints:
            - CASA deposit module setup
            - Integration with front-end (Backbase) and payment gateways
            - Regulatory sandbox testing and compliance verification
          outcome: Go-to-market achieved in 3 to 9 months
        - label: Initial Production Launch
          stage: Initial Production Launch
          touchpoints:
            - Live account onboarding
            - Real-time ledger processing
            - Targeted customer acquisition campaigns
          outcome: 50-60% IT operating cost savings vs legacy engines
        - label: Core Migration & Scale
          stage: Core Migration & Scale
          touchpoints:
            - Progressive modernization alongside legacy mainframe
            - Mass account migration (e.g. BancoEstado 14M accounts)
            - Zero-downtime ledger reconciliation
          outcome: Scale to millions of active accounts
        - label: Payments Hub Cross-Sell
          stage: Payments Hub Cross-Sell
          touchpoints:
            - Unified payments hub connection
            - SWIFT, SEPA, and local scheme integration
            - Cross-border payments expansion (e.g. Western Union, Flowe)
          outcome: 7x payments processing volume acceleration
        - label: Ecosystem & Intelligent Automation
          stage: Ecosystem & Intelligent Automation
          touchpoints:
            - Partner marketplace integrations (450+ partners)
            - Agentic AI workflow deployment for automated servicing
            - Continuous API-driven feature updates
          outcome: Durability and long-term expansion loop
    approximationNotes: Journey stages synthesized from documented client deployment patterns across BancoEstado, Uno Bank, Western Union, and Bank Jago.
