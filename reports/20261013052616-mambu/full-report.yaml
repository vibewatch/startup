          banking, payments, and AI.
        - >-
          Core banking migrations are high-friction, lengthy, and face entrenched legacy incumbents like Temenos and
          Finastra.
        - Evidence of accelerated Tier-1 bank core replacements or rising win rates against legacy providers.
      - - Commercial Traction
        - >-
          Scale across 260+ customers in 65+ countries, expanding into Islamic banking with Nyla and 7x payments
          processing volume growth.
        - >-
          Customer tier mix may lean heavily on early-stage fintechs with elevated mortality rates and lower contract
          values.
        - Audited disclosures showing high enterprise net revenue retention (>115%) and low logo churn.
      - - Valuation & Multiple
        - Market leader in cloud-native core banking with defensible position deserving premium platform multiples.
        - The $5.5B 2021 valuation benchmark represents peak-bubble pricing with heavy liquidation preference overhang.
        - A clean-term recapitalization or secondary transaction pricing Mambu at prevailing 6x–8x ARR multiples.
      - - Financial Transparency
        - >-
          Private ownership allows long-term R&D investment in agentic AI and unified payments without quarterly
          earnings scrutiny.
        - Zero published audited revenue or ARR creates severe information asymmetry and governance opacity.
        - Full audited financial statements showing positive operating cash flow and resilient gross margins.
    notes: >-
      Thesis and anti-thesis points balance verified platform capabilities against market risk, competition, and
      opacity.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV005
      - CV008
      - CV009
      - CV010
      - CV011
      - CV014
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Operating Assumptions
      - Valuation / Return Logic
      - Key Downside Risks
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          Revenue accelerates to $280M+ with 80%+ gross margin; payments hub expands rapidly across EMEA, LATAM, and
          APAC; Tier-1 migrations scale.
        - >-
          Valued at 10x–12x revenue ($2.8B–$3.4B); provides positive return from reset entry point but remains below
          $5.5B peak.
        - Execution stumbles in agentic AI; slow bank procurement cycles drag sales cycles.
        - 'Low (15%): Requires sustained enterprise contract expansion and public market tech multiple expansion.'
      - - Base Case
        - >-
          Revenue stabilizes near $200M–$220M estimate; moderate growth in regional banks and neobanks (e.g., Nyla);
          steady payments processing adoption.
        - >-
          Valued at 6x–8x revenue ($1.2B–$1.8B); reflects standard private SaaS multiples for growth-stage fintech
          infrastructure.
        - Neobank client churn; pricing pressure from modern competitors like Thought Machine.
        - 'Moderate (55%): Best matches observed headcount stabilization (767 staff) and steady partner wins.'
      - - Bear Case
        - >-
          Revenue stalls below $160M due to fintech client attrition; core modernization deals stall; intense
          competition from legacy incumbents.
        - >-
          Valued at 3x–4x revenue ($480M–$640M); senior liquidation preferences absorb all proceeds, wiping out common
          equity.
        - Severe down-round; governance friction; customer churn among capitalized neobanks.
        - 'Substantial (30%): Significant risk given 2021 valuation vintage and fintech sector multiple contraction.'
      - - Downside Trigger
        - Loss of anchor clients or regulatory compliance/security breach across banking scheme jurisdictions.
        - Distressed fire sale or asset liquidation below preference stack ($660M total raised).
        - Regulatory sanctions; critical core outage; customer deposit run.
        - 'Low (Event-driven): Tail risk monitored through security compliance and bank partner stability.'
    notes: >-
      Scenarios evaluate return potential from current unverified estimates ($220M revenue) and highlight severe
      overhang from the $5.5B Series E mark.
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
