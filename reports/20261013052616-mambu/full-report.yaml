      - number: '6.2'
        title: Adoption Trajectory & Production Utilization
        blocks:
          - type: paragraph
            body: >-
              Mambu’s operational utilization metrics demonstrate substantial scale, with the platform reporting over
              230 million end users banking through its customer base and more than 500 million API calls processed
              daily. This operational velocity represents a significant expansion from late 2021, when Mambu reported 80
              million end users across 250 customers upon reaching a 4.9 billion euro valuation. Customer organizations
              achieve go-to-market acceleration, reducing new product deployment timelines to three to six months
              compared to the multi-year cycles demanded by traditional core banking engines. Nevertheless, the lack of
              disclosed metrics regarding active transacting users versus dormant accounts prevents independent
              verification of per-account transaction density across the underlying customer estate.
            claimRefs:
              - CU003
              - CU004
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU011
      - number: '6.3'
        title: Named Customer Deployments & Time-to-Market Outcomes
        blocks:
          - type: paragraph
            body: >-
              Publicly documented production deployments confirm Mambu’s versatility across major enterprise banking,
              digital banking, and regional challenger environments. In Latin America, BancoEstado completed a
              multi-year modernization migrating 14 million CuentaRUT accounts to Mambu with zero reported downtime,
              validating the core platform’s high-volume transaction reliability. In Europe, Western Union launched its
              European digital banking application in seven months across four markets, processing all SWIFT, SEPA, and
              Target2 payments. In the Asia-Pacific region, Bank Jago in Indonesia achieved a five-month launch for
              daily accounts, while Uno Bank in the Philippines deployed CASA accounts in nine months, cutting operating
              costs by 50% to 60%. However, practitioner reviews note neutral support experiences and a lack of native
              Buy Now Pay Later modules out of the box.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
      - number: '6.4'
        title: Retention Durability, Expansion Loops & Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Mambu’s commercial durability increasingly relies on expansion loops beyond core deposits and lending into
              integrated payments orchestration and ecosystem connectivity. The company reported a sevenfold increase in
              payments volume processed during 2025 across key clients such as Western Union, Spendesk, Flowe, and BCB
              Group, establishing payments as a rapid cross-sell driver across EMEA, LATAM, and APAC. Similarly,
              fast-scaling neobanks like Ualá in Argentina demonstrate how expanding end-user bases create platform
              stickiness. However, Mambu does not disclose net retention rates, gross retention, or cohort churn,
              leaving open questions regarding enterprise renewal cycles and exposure to neobank failure rates during
              macroeconomic contractions.
            claimRefs:
              - CU011
              - CU012
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU010
              - CU011
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Accelerated Time-to-Market vs Legacy Core Modernization
            body: >-
              Mambu consistently delivers digital banking go-to-market velocity within 3 to 9 months—as demonstrated at
              Bank Jago (5 months), Western Union (7 months), and Uno Bank (9 months)—substantially compressing the 4-
              to 5-year deployment cycles typical of legacy cores such as Temenos or Finacle.
            calloutType: insight
            claimRefs:
              - CU005
              - CU007
              - CU008
              - CU010
          - type: callout
            title: Tier-1 Legacy Migration Barriers and Out-of-the-Box Feature Limits
            body: >-
              While Mambu demonstrates national-scale capability through BancoEstado's 14-million account migration in
              Chile, legacy core replacement in established institutions remains multi-year and complex. Furthermore,
              system integrator feedback highlights gaps in out-of-the-box advanced credit features like BNPL and
              neutral customer support as adoption hurdles.
            calloutType: risk
            claimRefs:
              - CU006
              - CU009
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory Compliance & Multi-Jurisdictional Exposure
        blocks:
          - type: paragraph
            body: >-
              Operating core banking systems across more than 65 countries exposes Mambu to intricate
              multi-jurisdictional compliance demands and stringent financial data security standards [CR001] [CR002].
              Because Mambu delivers core banking as a SaaS platform to banks, neobanks, and lenders, customer
              institutions must meet rigorous local banking supervisory mandates, data residency requirements, and
              continuous audit frameworks [CR003]. In particular, European and cross-border implementations require
              adherence to strict financial services regulations, including ISO/IEC standards and SOC-2 control regimes
              [CR004]. Any failure to satisfy evolving regulatory criteria across global payment schemes and domestic
              clearing systems creates severe operational friction, customer onboarding delays, and contractual
              liabilities for client financial institutions [CR005].
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: Operational Reliability, Security & Core Banking Resilience
        blocks:
          - type: paragraph
            body: >-
              Core banking and payment processing represent mission-critical infrastructure where system outages, data
              corruption, or latency spikes immediately disrupt financial transactions [CR005] [CR006]. Mambu's
              architecture relies on distributed cloud backend services, relational databases handling high-concurrency
              environments, and transaction isolation levels across AWS hosting components such as EKS and RDS [CR006]
              [CR007]. Integrating payment schemes such as SEPA, SWIFT, and EBICS introduces severe operational
              constraints and complex failure modes during high-throughput clearing windows [CR007]. Furthermore, as
              Mambu introduces agentic AI capabilities and natural language agent interfaces into core financial
              operations, model hallucination or unverified automated actions could introduce unprecedented operational
              and audit vulnerabilities [CR008].
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.3'
        title: Platform Dependencies, Partner Lock-In & Cloud Counterparties
        blocks:
          - type: paragraph
            body: >-
              Mambu's SaaS delivery model is deeply dependent on hyperscale cloud infrastructure providers, notably
              Amazon Web Services and containerized orchestration frameworks [CR007] [CR009]. While cloud-native
              multi-tenant architecture eliminates traditional on-premise hardware maintenance, it introduces structural
              third-party counterparty concentration where underlying cloud outages or localized infrastructure failures
              directly impair core banking availability [CR009]. In addition, client banks rely on composable partner
              ecosystems and third-party gateways for card issuing, verification of payee, and anti-fraud tooling
              [CR010]. In the competitive core banking market, traditional core giants like Temenos and Finastra
              alongside modern cloud alternatives such as Thought Machine aggressively compete for major banking
              migrations, creating pricing and partner displacement pressures [CR011].
            claimRefs:
              - CR007
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR007
              - CR009
              - CR010
              - CR011
      - number: '7.4'
        title: Financial Model Sustainability, Growth Trajectory & Diligence Triggers
        blocks:
          - type: paragraph
            body: >-
              From a financial model perspective, Mambu has achieved significant scale, with third-party market
              estimates pointing to approximately $220 million in 2025 revenue following its $5.5 billion Series E
              valuation in 2021 [CR012] [CR013]. However, because Mambu remains privately held and does not disclose
              audited financial statements, key unit economics—including software gross margins, net revenue retention
              (NRR), customer acquisition costs, and cash burn rates—remain unverified outside private diligence [CR013]
              [CR014]. Slower core replacement cycles by tier-1 banks or high customer churn among capital-constrained
              fintech clients could severely pressure valuation multiples and future capitalization options [CR011]
              [CR014]. Clear monitoring indicators, including customer expansion milestones and regulatory audit
              findings, represent critical diligence checkpoints for investors.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR007
              - CR011
              - CR012
              - CR013
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Multi-Jurisdictional Regulatory Overhead
            body: >-
              Supporting client deployments across 65+ countries creates heavy ongoing compliance overhead as national
              financial authorities update cloud banking, data sovereignty, and payment scheme regulations [CR001]
              [CR002].
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
          - type: callout
            title: Mission-Critical Core Banking Switching Costs
            body: >-
              While core banking migrations entail high implementation hurdles, once deployed, Mambu benefits from
              substantial operational lock-in and high switching costs across client financial institutions [CR003]
              [CR005].
            calloutType: insight
            claimRefs:
              - CR003
              - CR005
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Investment Thesis: Composable Architecture and Verified Enterprise Scale'
        blocks:
          - type: paragraph
            body: >-
              Mambu has established a differentiated position in global financial infrastructure by delivering a
              cloud-native software-as-a-service core banking platform. The core investment thesis rests on financial
              institutions decoupling customer-facing digital applications from monolithic legacy backends. Mambu powers
              over 260 customers across more than 65 countries, demonstrating commercial scale across Tier-1
              institutions, digital challengers, and regional specialists. Customer deployments such as Western Union's
              digital banking application, completed in a seven-month greenfield launch, highlight rapid time-to-market
              advantages. Furthermore, recent expansion into Islamic banking with Nyla in Ghana and a sevenfold
              year-on-year surge in international payments volume illustrate expanding addressable market opportunities
              across deposits, lending, and payments rails. However, the anti-thesis centers on intensifying competition
              from entrenched vendors like Temenos and Finastra alongside modern rivals like Thought Machine, which
              limits pricing power in Tier-1 bank replacements.
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
      - number: '8.2'
        title: 'Valuation Context: The $5.5B 2021 Series E Overhang and Multiples'
        blocks:
          - type: paragraph
            body: >-
              Evaluating Mambu's valuation requires untangling its historical capital structure from prevailing venture
              market multiples. In December 2021, Mambu raised $265.9M in a Series E round led by EQT Growth that
              established a post-money valuation between $5.3B and $5.5B, bringing cumulative capital raised to $660.1M.
              However, Mambu has not disclosed updated financing rounds, audited revenue, or public secondary pricing
              between 2022 and 2026. Third-party aggregators Compworth and Latka estimate Mambu's 2025 revenue at
              approximately $220M. At this unverified revenue level, the 2021 headline valuation implies an
              unsustainable multiple of roughly 25x revenue. In contrast, current public vertical SaaS and core banking
              peers trade between 5x and 8x recurring revenue. This historical mark creates a severe liquidation
              preference overhang, where existing preferred shareholders hold structural priority that could impair
              returns for new investors entering above fair market value.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
              - CV014
      - number: '8.3'
        title: 'Scenario Modeling: Bull, Base, and Bear Realities'
        blocks:
          - type: paragraph
            body: >-
              To establish entry discipline, we model bull, base, and bear operating scenarios against private peers
              such as Backbase ($200M revenue) and NYMBUS ($37.3M revenue). In the bull case (15% probability),
              accelerated enterprise core banking conversions and payments hub expansion drive revenue to $280M+,
              supporting a 10x–12x multiple and a valuation between $2.8B and $3.4B. In the base case (55% probability),
              revenue stabilizes near $200M–$220M, yielding an enterprise valuation of $1.2B–$1.8B under normalized
              6x–8x SaaS multiples, consistent with headcount stabilization around 767 employees. In the bear case (30%
              probability), customer churn among capitalized neobanks and legacy vendor lock-in suppress revenue below
              $160M, compressing multiples to 3x–4x ($480M–$640M) and triggering significant preference stack
              subordination. Consequently, the valuation stance is classified as stretched, as the historical $5.5B mark
              exceeds rational underwriting bounds.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
              - CV009
              - CV010
              - CV013
              - CV014
      - number: '8.4'
        title: Exit Readiness, Diligence Asks, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Mambu's potential path to an initial public offering or strategic acquisition is heavily constrained by
              financial opacity and structural capitalization hurdles. While strategic buyers in financial technology or
              enterprise software could value Mambu's composable cloud engine, public market listing readiness demands
              audited historical GAAP/IFRS financials, predictable net revenue retention metrics, and proven operating
              cash flow generation. Prior to any investment decision, diligence must prioritize four critical items:
              audited 2024–2026 income statements and balance sheets, detailed software license versus professional
              services revenue mix, contract-level cohort churn rates, and full cap-table liquidation preference
              schedules. Clear thesis-break triggers include severe churn among anchor enterprise accounts like Western
              Union, regulatory sanctions across key operating jurisdictions, or insider secondary trades clearing below
              $1.0B, which would confirm severe equity impairment.
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV008
              - CV009
              - CV013
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Maintain Cautious Stance Pending Audited Financials
            body: >-
              Mambu presents a compelling technological architecture with demonstrated enterprise wins like Western
              Union, but investing at or near historical headline marks without audited financial statements carries
              unacceptable downside risk.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV009
              - CV014
          - type: callout
            title: Liquidation Preference Overhang Threatens Junior Capital
            body: >-
              With over $660M in total capital raised through a peak-market 2021 Series E, common equity and junior
              stakeholders face massive structural subordination unless Mambu achieves an exit above the reset valuation
              floor.
            calloutType: risk
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV014
