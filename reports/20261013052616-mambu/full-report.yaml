          description: >-
            API-first foundation spanning core banking, payments, and agentic AI enables rapid launch without legacy
            rebuilds.
        - id: competitive-pressures
          label: Incumbent & Rival Competition
          role: risk
          description: >-
            Temenos, Finastra, and Thought Machine challenge Mambu across Tier-1 bank and neobank core banking
            selections.
        - id: financial-opacity
          label: Zero Public Financial Disclosure
          role: constraint
          description: >-
            No audited ARR, revenue, or margins published; reliance on third-party estimates ($220M) creates analytical
            blind spots.
        - id: valuation-overhang
          label: Stretched 2021 Valuation Mark
          role: constraint
          description: >-
            Historical $5.5B Series E valuation implies unsustainable ~25x multiple on estimated revenue with severe
            preference overhang.
