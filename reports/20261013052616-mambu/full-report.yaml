  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product, and Operating Scale
        blocks:
          - type: paragraph
            body: >-
              Mambu sells a cloud-native, composable core banking platform to banks, credit unions, lenders, fintechs,
              and other financial institutions. Its current website describes an "Intelligent Core" spanning core
              banking, payments, and agentic AI, while product pages frame delivery as configurable, API-first SaaS
              rather than a monolithic on-premise core. Independent reporting dated October 2025 put the installed base
              at 260+ customers in more than 65 countries; the current company website separately claims 230 million end
              users, 500 million-plus API calls per day, and 450+ partners. These populations and denominators are
              different and should not be combined. Public descriptions of the operating base also conflict: FinTech
              Futures called Mambu Amsterdam-based in 2025, while MarketSpy called it Berlin-based in 2026, so the legal
              headquarters is not treated as resolved.
