              - CE009
      - number: '5.4'
        title: Security Controls, Regulatory Compliance, and Architectural Scope Risks
        blocks:
          - type: paragraph
            body: >-
              Enterprise banking deployments require rigorous institutional trust, data protection controls, and
              continuous availability. Mambu maintains SOC 2 compliance across its cloud environments, validating tenant
              isolation, operational governance, and access controls under supervisory scrutiny. However, technical
              diligence identifies key architectural boundaries and operational risks. Because Mambu historically
              focused on lending and deposit accounting, institutions requiring a complete digital bank stack must
              assemble and maintain third-party partnerships for card management and anti-financial crime tooling.
              Furthermore, independent architectural evaluations highlight that transaction-based pricing models can
              lead to cost unpredictability at high enterprise transaction volumes, while lack of public
              developer-signal telemetry limits independent external verification of API throughput under peak
              concurrent write loads.
            claimRefs:
              - CE004
              - CE005
              - CE011
              - CE012
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Proven Composable Velocity
            body: >-
              Mambu cloud-native SaaS core enables fintechs and digital banks to launch production lending and deposit
              products in under 12 months, avoiding the multi-year replatforming cycles typical of legacy on-premise
              core banking systems.
            calloutType: strength
            claimRefs:
              - CE001
              - CE010
              - CE014
          - type: callout
            title: Scope Boundaries and Integration Complexity
            body: >-
              While the Numeral acquisition extends Mambu into native bank payments, the platform historically omitted
              native card issuance, KYC, and regulatory reporting, requiring customers to orchestrate best-of-breed
              third-party vendors whose transaction fees can scale unpredictably.
            calloutType: risk
            claimRefs:
              - CE007
              - CE011
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation & Buyer Personas
        blocks:
          - type: paragraph
            body: >-
              Mambu’s customer footprint spans more than 250 institutions globally across tier-one commercial banks,
              digital challenger neobanks, specialized credit providers, and non-financial innovators. Key buyer
              personas diverge sharply across these customer segments: tier-one and regional banks engage Chief Digital
              Officers seeking progressive core modernization or greenfield flanker brands, whereas venture-backed
              neobanks and fintech startups engage technical founders requiring agile API-first deployment. Across
              emerging and developed markets, Mambu provides an alternative to legacy monolithic core architectures,
              supporting institutions across Europe, Latin America, Asia Pacific, and Africa. However, customer revenue
              distribution remains undisclosed, creating ambiguity regarding the balance between high-ACV enterprise
              banking contracts and smaller fintech subscriptions.
            claimRefs:
              - CU001
              - CU002
              - CU013
          - type: table
            tableRef: TU001
