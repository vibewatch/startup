      - number: '5.3'
        title: Technical Architecture, Multi-Cloud Foundation, and Integration Model
        blocks:
          - type: paragraph
            body: >-
              Mambu technical architecture is organized as a four-tier Intelligent Core spanning application interfaces,
              API orchestration, core ledger processing, and multi-cloud hyperscale infrastructure. Built on a Java
              microservices stack and an event-driven messaging architecture, Mambu supports real-time ledger updates
              and asynchronous webhook notifications for external workflow triggers. The platform is designed to be
              multi-cloud by default, running across Amazon Web Services, Google Cloud, and Microsoft Azure to meet
              strict geographic data residency and supervisory hosting mandates. Mambu Process Orchestrator serves as
              the low-code integration fabric connecting core engine events to third-party fraud, credit scoring, and
              clearing systems, eliminating point-to-point integration fragility.
            claimRefs:
              - CE002
              - CE004
              - CE005
