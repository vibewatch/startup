  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Taxonomy, and Solution Scope
        blocks:
          - type: paragraph
            body: >-
              The core banking software market encompasses the mission-critical back-end transaction engines that record
              and settle deposit balances, service commercial and retail lending portfolios, and execute high-volume
              payments across financial institutions. Traditionally delivered as monolithic, highly customized
              on-premise deployments by established providers such as FIS, Fiserv, and Temenos, core banking systems are
              undergoing structural unbundling into modular, cloud-native components. Within this taxonomy, solution
              spend is partitioned between core ledger engines, payment orchestration gateways, compliance subsystems,
              and digital customer channels. Composable core banking platforms such as Mambu specifically isolate the
              deposit, lending, and transaction processing layers into pure SaaS delivery models accessible via open
              APIs. This operational boundary excludes front-end user experience applications, specialized underwriting
              risk algorithms, and hardware infrastructure, focusing addressable procurement specifically on scalable
              software services that replace or wrap legacy ledgers.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: TAM, SAM, and Multi-Lens Market Sizing
        blocks:
          - type: paragraph
            body: >-
              Evaluating the addressable market for modern core banking requires examining multiple analytical lenses
              due to varying market definitions between legacy software licenses, custom professional services, and pure
              SaaS subscription fees. Fortune Business Insights projects the total core banking software market at
              $23.16 billion globally in 2026, expanding to $83.78 billion by 2034 at a compound annual growth rate of
              17.40%, with North America representing 42.20% of baseline spend. In contrast, Precedence Research
              provides a more conservative baseline, valuing the 2026 global market at $15.20 billion and projecting
              growth to $35.98 billion by 2035 at a 10.07% CAGR. Despite differing aggregate boundaries, both market
              assessments identify cloud and SaaS delivery as the primary engine of industry expansion, with SaaS and
              hosted deployments projected to secure 67.54% of market share in 2026. The serviceable addressable market
              (SAM) for composable cloud-native engines is a targeted subset of this total, constrained by the reality
              that tier-1 multinational banks operate multi-decade legacy maintenance contracts, directing initial
              composable core spending toward new digital brand launches and tier-2 core modernization.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM012
      - number: '2.3'
        title: Buyer Personas, User Segmentation, and Procurement Dynamics
        blocks:
          - type: paragraph
            body: >-
              Procurement of core banking platforms is bifurcated across two distinct institutional customer archetypes:
              digital challenger neobanks and established traditional financial institutions. For neobanks, fintechs,
              and non-bank lenders, the primary economic buyer is typically the Chief Technology Officer or Head of
              Product, with budget allocated from capital expenditure dedicated to rapid commercial launch and feature
              iteration. These buyers prioritize speed to market, out-of-the-box regulatory support, and pay-as-you-grow
              SaaS economics, seeking to deploy deposit and lending capabilities in months rather than multi-year
              implementation cycles. Conversely, incumbent commercial banks, regional community banks, and credit unions
              engage enterprise procurement led by the Chief Information Officer and Chief Executive Officer. Their
              adoption path is governed by risk mitigation, data privacy compliance, and architectural composability,
              often utilizing modern cloud platforms to spin off ring-fenced digital subsidiaries or replace discrete
              lending lines without endangering core balance-sheet operations.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: Industry Growth Drivers and Structural Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The secular transition toward cloud core banking is propelled by consumer expectations for real-time 24/7
              digital transactions, hyper-personalized product offerings, and the integration of artificial intelligence
              and automated workflows into financial services. Traditional monolithic architectures suffer from
              technical rigidity and escalating maintenance costs, creating an imperative for banks to adopt modular
              platforms that support continuous deployment and third-party partner integration. However, structural
              constraints continue to temper the pace of core replacement across the industry. Financial institutions
              operate under stringent regulatory mandates concerning data sovereignty, operational resilience, and
              cybersecurity. According to industry breach reports, cyber threats and data breach liabilities impose
              severe financial and reputational penalties on financial services firms. Consequently, enterprise risk
              committees enforce rigorous procurement cycles and complex migration milestones, which prevent overnight
              displacement of legacy cores and favor progressive, component-based migration strategies.
            claimRefs:
              - CM003
              - CM013
              - CM014
      - number: '2.5'
        title: Sizing Discrepancies, Diligence Asks, and Boundary Ambiguities
        blocks:
          - type: paragraph
            body: >-
              A critical diligence challenge in assessing core banking market opportunity is reconciling substantial
              variance across published research benchmarks and isolating software subscription ARR from systems
              integration overhead. Discrepancies between top-down forecasts—ranging from $35.98 billion by 2035 at a
              10.07% CAGR to $83.78 billion by 2034 at a 17.40% CAGR—reflect inconsistent inclusion of on-premise
              perpetual license renewals, professional services, and bespoke middleware development. For an
              infrastructure vendor like Mambu, calculating pure software addressable opportunity requires separating
              core engine license fees from the substantial implementation budgets captured by systems integrators such
              as Accenture and Deloitte. Private diligence must evaluate contract-level software-versus-services ratios
              and verify whether prospective buyers are budgeting for full core migrations or narrowly defined satellite
              product engines, ensuring valuation models reflect sustainable SaaS economics rather than one-time project
              spend.
            claimRefs:
              - CM004
              - CM005
              - CM012
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Market Transition to Cloud-Native Architecture
            body: >-
              The core banking market is experiencing a structural bifurcation: while legacy on-premise platforms retain
              large transaction volumes, the fastest-growing spend is concentrated in SaaS and cloud-hosted deployments,
              which analyst forecasts indicate will account for over two-thirds of market value. For composable platform
              providers like Mambu, the primary growth vector is not wholesale rip-and-replace of tier-1 mainframe
              ledgers, but progressive modernization and powering agile challenger propositions.
            calloutType: insight
            claimRefs:
              - CM003
              - CM006
              - CM007
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Peer Classes
        blocks:
          - type: paragraph
            body: >-
              The market for core banking infrastructure spans multiple distinct vendor categories, each serving
              different buyer requirements and architectural priorities across global financial institutions.
              Traditional core banking incumbents such as Temenos and Finastra dominate universal and regional bank
              transaction processing, protected by decades of regulatory certifications, localized statutory reporting,
              and deep systems integrator relationships. Concurrently, modern cloud-native peers like Thought Machine
              compete directly with Mambu for greenfield digital bank deployments and agile modernization programs.
              Beyond commercial packaged software, financial institutions frequently evaluate point-solution software
              providers for discrete customer onboarding and loan origination workflows, or pursue internal software
              development using bespoke application frameworks. While commercial core platforms offer standardized
              multi-tenant efficiency, large bank IT organizations historically consider internal development as a
              viable status-quo substitute despite escalating long-term engineering maintenance costs.
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
              - CP007
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
      - number: '3.2'
        title: Architectural and Feature Differentiation
        blocks:
          - type: paragraph
            body: >-
              Mambu differentiates itself from traditional core systems through a composable software-as-a-service
              architecture that separates core transaction ledgers from external peripheral integrations. Rather than
              locking financial institutions into monolithic, proprietary database schemas, Mambu provides independently
              configurable modules for deposit accounts, commercial lending, and consumer credit. To insulate its core
              platform from commoditization by specialized fintech point solutions, Mambu has broadened its capabilities
              into payment orchestration hubs and agentic artificial intelligence workflows. Customer scale has grown to
              more than 260 financial institutions across 65 countries, illustrating verified production viability among
              digital challengers, tier-two lenders, and innovation units of major banks. However, rival cloud platforms
              like Thought Machine offer competing programmable smart-contract ledgers, creating rigorous architectural
              competition among digital-native institutions seeking tailored product logic.
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP008
              - CP013
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP006
              - CP007
              - CP008
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP004
              - CP006
              - CP014
      - number: '3.3'
        title: Pricing, Packaging, and Procurement Tradeoffs
        blocks:
          - type: paragraph
            body: >-
              Procurement models in core banking diverge sharply between traditional on-premise licensing agreements and
              modern software-as-a-service subscription agreements. Legacy incumbents typically demand
              multi-million-dollar upfront perpetual licenses accompanied by recurring annual maintenance fees and heavy
              professional services contracts managed by third-party integrators. In contrast, Mambu structures
              contracts around cloud subscription tiers and volume-based consumption metrics, reducing initial capital
              expenditures and delivering predictable operational budgets. Nevertheless, total cost of ownership
              evaluations remain complicated for enterprise bank procurement teams because cloud infrastructure costs
              and third-party marketplace connector subscriptions scale directly with transaction volume. Although Mambu
              offers faster initial deployment timelines, enterprise buyers weighing legacy replacements versus cloud
              migrations face substantial cost uncertainty when comparing long-term multi-tenant subscriptions against
              amortized legacy asset investments.
            claimRefs:
              - CP002
              - CP005
              - CP010
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP005
              - CP010
              - CP011
      - number: '3.4'
        title: Moat Durability and Displacement Risks
        blocks:
          - type: paragraph
            body: >-
              Core transaction ledgers represent mission-critical infrastructure characterized by extreme switching
              costs, regulatory examination barriers, and operational risk aversion. Once a financial institution
              migrates its general ledger and customer accounts to Mambu, displacement risk drops substantially due to
              the severe data migration risks and regulatory compliance audits required to switch core vendors. However,
              this same switching inertia operates as an adverse structural barrier that restricts Mambu from rapidly
              displacing entrenched legacy monoliths at large universal banks. Furthermore, rapid advancements in
              artificial intelligence point solutions enable agile competitors to peel away high-margin banking
              workflows such as credit decisioning and fraud detection. While Mambu retains a durable moat within
              cloud-first fintechs, expanding into core enterprise banking requires continuous investment to overcome
              incumbent switching inertia.
            claimRefs:
              - CP007
              - CP010
              - CP012
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Composable Architecture Advantage
            body: >-
              Mambu's primary competitive edge over legacy providers like Temenos and Finastra lies in rapid
              time-to-market. By decoupling core lending and deposit engines into cloud-native APIs, digital banks can
              launch localized financial products in months rather than multi-year implementation cycles.
            calloutType: insight
            claimRefs:
              - CP003
              - CP004
              - CP011
          - type: callout
            title: Enterprise Displacement and Tier-1 Inertia
            body: >-
              While Mambu has successfully captured fintechs and digital subsidiaries, displacing legacy monoliths at
              large universal banks remains difficult. High switching costs, regulatory scrutiny, and complex core
              ledger migration risks create strong inertia favoring entrenched incumbent vendors.
            calloutType: risk
            claimRefs:
              - CP005
              - CP007
              - CP010
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing Structure, and Monetization
        blocks:
          - type: paragraph
            body: >-
              Mambu commercializes a composable, cloud-native banking architecture through multi-tenant
              software-as-a-service subscriptions, tiered module licensing, and transaction-indexed processing fees. The
              platform spans core deposit engines, digital lending management, and an integrated payments hub.
              Institutional clients commit to multi-year enterprise contracts with base subscription fees determined by
              active account tiers and deployed functional components. Following the strategic acquisition of French
              payment technology firm Numeral, Mambu embedded universal gateway connectivity and automated clearing
              rails that process more than €10 billion annually. Payments processing volume accelerated sevenfold
              year-on-year in 2025, enabling the company to expand transaction-based monetization across EMEA, Latin
              America, and Asia-Pacific. However, because Mambu does not publish standard rate cards, list pricing
              remains entirely opaque, and realizing contractual revenue requires complex enterprise implementation
              cycles.
            claimRefs:
              - CI001
              - CI004
              - CI005
              - CI011
