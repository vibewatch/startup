  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 运营假设
      - 估值 / 回报逻辑
      - 关键下行风险
      - 概率信号
    rows:
      - - 乐观情景
        - 收入加速至 $280M 以上，毛利率超过 80%；支付中枢在 EMEA、LATAM 和 APAC 快速扩张；一级银行迁移规模化。
        - 按收入的 10–12 倍估值（$2.8B–$3.4B）；从重置后的入场点可获得正回报，但仍低于 $5.5B 峰值。
        - 代理式 AI 执行失误；银行采购周期缓慢，拖长销售周期。
        - 低（15%）：需要企业合同持续扩张，且公开市场科技倍数上升。
      - - 基准情景
        - 收入稳定在 $200M–$220M 的估算区间附近；区域银行和数字银行（如 Nyla）温和增长；支付处理采用稳步推进。
        - 按收入的 6–8 倍估值（$1.2B–$1.8B）；反映成长阶段金融科技基础设施的标准私有 SaaS 倍数。
        - 数字银行客户流失；Thought Machine 等现代竞争对手带来的定价压力。
        - 中等（55%）：最符合已观察到的员工人数稳定（767 人）和合作伙伴持续赢单。
      - - 悲观情景
        - 由于金融科技客户流失，收入停滞在 $160M 以下；核心现代化交易停摆；传统厂商竞争激烈。
        - 按收入的 3–4 倍估值（$480M–$640M）；高级清算优先权吞噬全部收益，普通股股权归零。
        - 严重下轮融资；治理摩擦；资本充足的数字银行客户流失。
        - 较高（30%）：鉴于 2021 年估值年代和金融科技行业倍数收缩，风险显著。
      - - 下行情景触发器
        - 锚定客户流失，或银行支付体系所在司法辖区发生监管合规 / 安全漏洞。
        - 困境甩卖或资产清算价格低于优先股堆叠（累计融资 $660M）。
        - 监管制裁；核心系统严重中断；客户挤兑存款。
        - 低（事件驱动）：通过安全合规和银行合作伙伴稳定性监测尾部风险。
    notes: 情景评估基于当前未验证的估算（收入 $220M）的回报潜力，并突出 $5.5B E 轮估值带来的严重悬置。
