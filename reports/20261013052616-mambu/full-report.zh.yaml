      - number: '7.4'
        title: 财务模型可持续性、增长轨迹与尽调触发点
        blocks:
          - type: paragraph
            body: >-
              从财务模型角度看，Mambu 已达到较大规模，第三方市场估计其 2021 年 $5.5 billion E 轮估值后，2025 年收入约为 $220 million [CR012]
              [CR013]。但公司仍为私有企业且不披露经审计财报，软件毛利率、净收入留存率（NRR）、获客成本和现金烧钱率等关键单位经济性，在私有尽调之外均未验证 [CR013]
              [CR014]。一级银行核心替换周期放缓，或资本紧张的金融科技客户高流失，都可能严重压低估值倍数和未来融资选择 [CR011] [CR014]。客户扩张里程碑和监管审计结果等明确监测指标，是投资人的关键尽调节点。
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR007
              - CR011
              - CR012
              - CR013
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 多司法辖区监管负担
            body: 支持 65 多个国家的客户部署，意味着持续承担沉重合规负担，因为各国金融主管部门不断更新云银行、数据主权和支付体系法规 [CR001] [CR002]。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
          - type: callout
            title: 关键核心银行系统的切换成本
            body: 核心银行迁移实施门槛很高；但部署后，Mambu 将从客户金融机构获得显著运营锁定和高切换成本 [CR003] [CR005]。
            calloutType: insight
            claimRefs:
              - CR003
              - CR005
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点：可组合架构与已验证的企业规模
        blocks:
          - type: paragraph
            body: >-
              Mambu 通过交付云原生 SaaS 核心银行平台，在全球金融基础设施中建立了差异化位置。核心投资论点是金融机构将面向客户的数字应用与单体传统后端解耦。Mambu 已覆盖 65 多个国家的 260
              多家客户，规模涉及一级机构、数字挑战者和区域专业机构。Western Union 的数字银行应用在七个月内以新建方式上线，凸显其上市速度优势。加纳 Nyla 的伊斯兰银行扩张，以及国际支付量同比增长七
              倍，说明存款、贷款和支付轨道的可服务市场仍在扩大。但反论点是 Temenos、Finastra 等传统厂商和 Thought Machine 等现代对手竞争加剧，限制了其替换一级银行时的定价能力。
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
      - number: '8.2'
        title: 估值背景：2021 年 $5.5B E 轮遗留压力与倍数
        blocks:
          - type: paragraph
            body: >-
              评估 Mambu 估值需要把历史资本结构与当前风险投资市场倍数拆开。2021 年 12 月，Mambu 完成 EQT Growth 领投的 $265.9M E 轮，投后估值为 $5.3B 至
              $5.5B，累计融资额达到 $660.1M。但 2022 至 2026 年间，公司没有披露最新融资轮次、经审计收入或公开二级市场定价。Compworth 和 Latka 等第三方聚合商估计 Mambu 2025
              年收入约 $220M。在这一未经验证的收入水平上，2021 年 headline 估值意味着约 25 倍收入，难以持续；当前公开市场垂直 SaaS 和核心银行同类公司的交易倍数为 5 倍至 8
              倍经常性收入。历史估值造成严重清算优先权压力，现有优先股股东拥有结构性优先级，可能损害以高于公允市场价值进入的新投资人回报。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
              - CV014
      - number: '8.3'
        title: 情景建模：乐观情景、基准与悲观情景现实
        blocks:
          - type: paragraph
            body: >-
              为建立入场纪律，我们以 Backbase（$200M 收入）和 NYMBUS（$37.3M 收入）等私有同业为参照，建模乐观、基准和悲观经营情景。乐观情景概率
              15%，企业核心银行转换加速、支付中枢扩张推动收入达到 $280M+，支持 10x–12x 倍数，对应 $2.8B 至 $3.4B 估值。基准情景概率 55%，收入稳定在 $200M–$220M，按正常化
              6x–8x SaaS 倍数得到 $1.2B–$1.8B 企业估值，与员工数稳定在约 767 人一致。悲观情景概率 30%，资本充足的数字银行客户流失和传统厂商锁定令收入低于 $160M，倍数压缩至
              3x–4x（$480M–$640M），并触发优先股堆叠显著后置。因此估值立场为偏高，历史 $5.5B 估值超过理性的投资评估边界。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV014
