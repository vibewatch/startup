  - id: FV001
    title: 建议逻辑流程
    type: flow
    summary: 将 Mambu 的运营规模和云平台优势，经由财务不透明与估值悬置，连接至最终建议的决策逻辑。
    data:
      nodes:
        - id: scale-proof
          label: 企业采用与平台进展
          role: evidence
          description: 覆盖 65 多个国家的 260 多家客户、Western Union 7 个月上线和支付增长 7 倍，验证了产品市场匹配。
        - id: tech-differentiation
          label: 可组合云架构
          role: evidence
          description: 覆盖核心银行、支付和代理式 AI 的 API 优先基础，无需重建传统系统即可快速上线。
        - id: competitive-pressures
          label: 传统厂商与竞争对手竞争
          role: risk
          description: Temenos、Finastra 和 Thought Machine 在一级银行和数字银行的核心银行系统选择中挑战 Mambu。
        - id: financial-opacity
          label: 完全没有公开财务披露
          role: constraint
          description: 没有公开经审计的 ARR、收入或利润率；依赖第三方估算（$220M）造成分析盲区。
        - id: valuation-overhang
          label: 偏高的 2021 年估值标记
          role: constraint
          description: 历史 $5.5B E 轮估值对应估算收入约 25 倍、不可持续的倍数，并背负沉重的清算优先权负担。
        - id: scenario-pricing
          label: 下行情景保护
          role: decision
          description: 基准情景的现实估值为 $1.2B–$1.8B（收入的 6–8 倍），需要大幅削减历史标志性价格。
        - id: final-recommendation
          label: 建议：继续研究
          role: outcome
          description: 任何资本承诺都应以对经审计 ARR、毛利率和清算优先权进行私下尽调为前提。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV008
      - CV009
      - CV010
      - CV013
      - CV014
