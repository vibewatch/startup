  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、分类与解决方案范围
        blocks:
          - type: paragraph
            body: >-
              核心银行软件市场涵盖关键后端交易引擎，负责记录和结算存款余额、服务商业及零售贷款组合，并在金融机构间执行大规模支付。核心银行系统过去由 FIS、Fiserv、Temenos
              等厂商以高度定制的本地单体系统交付，如今正拆分为模块化、云原生组件。按这一分类，解决方案支出分为核心账本引擎、支付编排网关、合规子系统和数字客户渠道。Mambu 等可组合平台将存款、贷款和交易处理层拆开，以开放
              API 提供纯 SaaS 交付。该边界不包括前端体验应用、专门的承保风险算法和硬件基础设施，重点是替换或包裹传统账本的可扩展软件服务。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: TAM、SAM 与多视角市场规模测算
        blocks:
          - type: paragraph
            body: >-
              现代核心银行的可服务市场需要从多个视角评估，因为传统软件许可、定制专业服务和纯 SaaS 订阅费的市场定义不同。Fortune Business Insights 预计全球核心银行软件市场 2026 年为
              $23.16 billion，2034 年增至 $83.78 billion，复合年增长率为 17.40%，北美占基准支出的 42.20%。Precedence Research 则给出更保守的基准：2026
              年全球市场 $15.20 billion，2035 年增至 $35.98 billion，CAGR 为 10.07%。尽管总边界不同，两份研究都认为云和 SaaS 是行业扩张主引擎，并预计 SaaS 与托管部署在
              2026 年占 67.54% 市场份额。可组合云原生引擎的 SAM 是其中受限的子集，因为一级跨国银行仍受数十年传统维护合同约束，初期支出将流向新数字品牌和二级核心现代化。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM012
      - number: '2.3'
        title: 买方画像、用户分层与采购动态
        blocks:
          - type: paragraph
            body: >-
              核心银行平台采购分为两类机构客户：数字挑战者银行和成熟传统金融机构。对数字银行、金融科技公司和非银行贷款机构，主要经济买方通常是 CTO
              或产品负责人，预算来自支持快速商业上线和功能迭代的资本支出；他们看重上市速度、开箱即用的监管支持和随业务增长付费的 SaaS
              经济性，希望用数月而不是多年实施周期上线存款和贷款能力。传统商业银行、区域社区银行和信用合作社则由 CIO 与 CEO
              主导企业采购，采用路径受风险缓释、数据隐私合规和架构可组合性约束，常借助现代云平台孵化隔离的数字子公司，或替换独立贷款业务而不危及核心资产负债表。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: 行业增长驱动因素与结构性采用约束
        blocks:
          - type: paragraph
            body: >-
              云核心银行的长期迁移由消费者对实时、全天候数字交易、高度个性化产品以及 AI
              和自动化工作流的期待推动。传统单体架构技术僵化、维护成本上升，迫使银行采用支持持续部署和第三方合作伙伴接入的模块化平台。但数据主权、运营韧性和网络安全等严格监管要求仍限制核心替换速度。行业违规报告显示，网络威胁和数据泄露责任会给金融服务企业带来严重财务及声誉处罚。因此企业风险委员会执行严格采购周期和复杂迁移里程碑，阻止传统核心一夜替换，偏好渐进式组件迁移。
            claimRefs:
              - CM003
              - CM013
              - CM014
      - number: '2.5'
        title: 规模差异、尽调要求与边界歧义
        blocks:
          - type: paragraph
            body: >-
              评估核心银行市场机会的关键难点，是协调公开研究基准的巨大差异，并将软件订阅 ARR 与系统集成开销分开。自上而下预测从 2035 年 $35.98 billion、10.07% CAGR 到 2034 年
              $83.78 billion、17.40% CAGR 不等，原因包括是否计入本地永久许可续费、专业服务和定制中间件开发。对 Mambu 这样的基础设施厂商，纯软件机会必须与 Accenture、Deloitte
              等系统集成商承接的大额实施预算分开。私有尽调应评估合同层面的软件与服务比例，确认买方是在预算完整核心迁移，还是仅采购有限的卫星产品引擎，确保估值模型反映可持续 SaaS 经济性，而非一次性项目支出。
            claimRefs:
              - CM004
              - CM005
              - CM012
      - number: '2.6'
        title: 展示项
        blocks:
          - type: callout
            title: 市场向云原生架构迁移
            body: >-
              核心银行市场正发生结构性分化：传统本地平台仍保有大量交易量，但增长最快的支出集中在 SaaS 和云托管部署，分析师预计其占市场价值超过三分之二。对 Mambu
              这类可组合平台厂商，主要增长路径不是彻底替换一级主机账本，而是渐进式现代化和支持敏捷挑战者产品。
            calloutType: insight
            claimRefs:
              - CM003
              - CM006
              - CM007
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与同类厂商
        blocks:
          - type: paragraph
            body: >-
              核心银行基础设施市场包含多个厂商类别，分别满足全球金融机构不同的买方需求和架构优先级。Temenos、Finastra
              等传统厂商凭借数十年的监管认证、本地法定报告和深厚的系统集成商关系，主导大型及区域银行交易处理。与此同时，Thought Machine 等现代云原生同类厂商直接与 Mambu
              争夺新建数字银行和敏捷现代化项目。金融机构还会为客户开户、贷款发放等单点流程评估软件厂商，或用定制应用框架自行开发。商业核心平台提供标准化多租户效率，但大型银行 IT
              部门仍把内部开发视为可行替代，尽管长期工程维护成本不断上升。
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
              - CP007
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
      - number: '3.2'
        title: 架构与功能差异化
        blocks:
          - type: paragraph
            body: >-
              Mambu 以可组合 SaaS
              架构区别于传统核心系统，将核心交易账本与外部外围集成分开。它不把金融机构锁在单体专有数据库模式中，而是提供可独立配置的存款账户、商业贷款和消费信贷模块。为避免被专门金融科技单点方案商品化，Mambu
              扩展到支付编排中枢和智能代理 AI 工作流。其规模已超过 260 家金融机构、覆盖 65 个国家，证明了数字挑战者、二级贷款机构和大型银行创新部门的生产可用性。但 Thought Machine
              等竞争平台提供可编程智能合约账本，数字原生机构之间的架构竞争仍很激烈。
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP008
              - CP013
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP006
              - CP007
              - CP008
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP004
              - CP006
              - CP014
      - number: '3.3'
        title: 定价、产品打包与采购权衡
        blocks:
          - type: paragraph
            body: >-
              核心银行采购在传统本地许可协议与现代 SaaS 订阅协议之间差异显著。传统厂商通常要求数百万美元前期永久许可费，并收取年度维护费及由第三方集成商管理的大额专业服务费。Mambu
              则按云订阅层级和按量消费指标设计合同，降低初始资本支出并提供更可预测的运营预算。不过，企业银行采购团队仍难以评估总拥有成本，因为云基础设施和第三方市场连接器订阅会随交易量直接增长。虽然 Mambu
              上线更快，企业买方比较长期多租户订阅与摊销后的传统资产投资时，仍面临显著成本不确定性。
            claimRefs:
              - CP002
              - CP005
              - CP010
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP005
              - CP010
              - CP011
      - number: '3.4'
        title: 护城河韧性与替代风险
        blocks:
          - type: paragraph
            body: >-
              核心交易账本是关键基础设施，具有极高切换成本、监管审查壁垒和运营风险厌恶。一旦金融机构将总账和客户账户迁移到 Mambu，切换核心供应商所需的数据迁移和合规审计风险会大幅降低替代概率。但同一切换惯性也限制
              Mambu 快速替换大型综合银行的传统单体系统。AI 单点方案快速进步，还让敏捷竞争者能够剥离信贷决策、欺诈检测等高毛利工作流。Mambu
              在云优先金融科技客户中护城河较稳，但进军企业核心银行仍需持续投入以克服传统厂商的切换惯性。
            claimRefs:
              - CP007
              - CP010
              - CP012
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 可组合架构优势
            body: Mambu 相比 Temenos、Finastra 等传统厂商的主要竞争优势是更快上市。将核心贷款和存款引擎拆成云原生 API 后，数字银行可在数月内推出本地化金融产品，而非经历多年实施周期。
            calloutType: insight
            claimRefs:
              - CP003
              - CP004
              - CP011
          - type: callout
