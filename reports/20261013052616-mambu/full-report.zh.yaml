              - CV009
              - CV014
          - type: callout
            title: 清算优先权压力威胁次级资本
            body: 截至高峰市场的 2021 年 E 轮，Mambu 累计融资超过 $660M；除非公司退出时的估值高于重置后的估值底线，否则普通股和次级利益相关方将面临巨大的结构性后置风险。
            calloutType: risk
            claimRefs:
