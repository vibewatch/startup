        - 核心银行迁移阻力大、周期长，还要面对 Temenos、Finastra 等根深蒂固的传统厂商。
        - 一级银行加速替换核心系统，或对传统供应商的胜率提升的证据。
      - - 商业进展
        - 已覆盖 65 多个国家的 260 多家客户，并借助 Nyla 进入伊斯兰银行业务，支付处理量增长 7 倍。
        - 客户层级结构可能高度偏向早期金融科技公司，这类客户倒闭率更高、合同金额更低。
        - 经审计披露显示企业净收入留存率高（>115%）且客户标识流失率低。
      - - 估值与倍数
        - 云原生核心银行领域的市场领导者，地位具备防御性，值得享有平台溢价倍数。
        - $5.5B 的 2021 年估值基准对应泡沫顶峰定价，并背负沉重的清算优先权负担。
        - 条款干净的资本重组或二级交易，以当前 6–8 倍 ARR 倍数为 Mambu 定价。
      - - 财务透明度
        - 私有所有权让公司无需接受季度业绩审视，就能长期投资代理式 AI 和统一支付。
        - 完全没有公开的经审计收入或 ARR，造成严重的信息不对称和治理不透明。
        - 完整经审计财务报表显示经营现金流为正且毛利率稳健。
    notes: 多空论点将已验证的平台能力，与市场风险、竞争和不透明度进行权衡。
