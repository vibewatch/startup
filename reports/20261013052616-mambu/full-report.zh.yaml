              - CV014
      - number: '8.4'
        title: 退出准备度、尽调要求与论点失效触发点
        blocks:
          - type: paragraph
            body: >-
              Mambu 走向 IPO 或战略收购的路径受到财务不透明和资本结构障碍严重限制。金融科技或企业软件战略买方可能看重其可组合云引擎，但公开上市需要经审计的历史 GAAP/IFRS
              财务报表、可预测的净收入留存和已证明的经营现金流。作出投资决定前，尽调必须优先确认四项：2024–2026 年经审计损益表和资产负债表、软件许可与专业服务收入的详细组合、合同层面的 cohort
              流失率，以及完整股权结构表的清算优先权安排。论点失效触发点包括 Western Union 等锚定企业账户严重流失、关键运营司法辖区遭监管制裁，或内部人二级交易低于 $1.0B，这将确认严重的股权减值。
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV008
              - CV009
              - CV013
              - CV014
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 审计财务报表出炉前保持谨慎
            body: Mambu 凭借 Western Union 等企业客户展现出有吸引力的技术架构和商业成果，但在没有经审计财报的情况下按历史 headline 估值或接近该估值投资，意味着不可接受的下行风险。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV003
