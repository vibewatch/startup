  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 展示从企业模块签约和账户量，到支付交易费、托管销货成本及实现毛利的变现链路。
    data:
      nodes:
        - label: 金融机构上线
          detail: 银行、数字银行或金融科技公司选择可组合核心模块（存款、贷款、支付）。
        - label: 软件许可签约
          detail: 通过多年期企业承诺确定基础年度经常性订阅。
        - label: 终端用户与交易增长
          detail: 终端用户和交易增长推动分层消费费与使用费。
        - label: 支付中枢与增值扩张
          detail: 由 Numeral 驱动的通用网关捕获实时交易处理量。
        - label: 托管与服务交付销货成本
          detail: 扣除云托管基础设施、合作伙伴支付通道和实施费用。
        - label: 实现毛利与毛利率
          detail: 产生平台毛利（FY2020 基准历史毛利率为 44.2%）。
    approximationNotes: 转化动态和单位成本扣除是基于 FY2020 历史申报文件及官方产品定价披露的定性呈现。
    claimRefs:
      - CI001
      - CI006
      - CI010
  - id: FE001
    title: Mambu Intelligent Core 产品架构图
    type: stack
    summary: 六层架构栈，展示 Mambu 可组合核心银行引擎、支付中枢、集成层和多云基础设施。
    data:
      layers:
        - label: 数字渠道与体验层
          detail: Web、移动银行应用、合作伙伴门户和代理式对话银行界面
        - label: 产品配置与 AI 层
          detail: 低代码产品定义控制台、业务规则参数和代理式工作流自动化
        - label: 集成与编排层
          detail: Mambu Process Orchestrator、REST APIs、事件驱动 Webhook 和生态连接器
        - label: 核心银行引擎层
          detail: 管理存款账户、贷款组合和伊斯兰银行业务的 Mambu Core 多租户引擎
        - label: 支付与清算中枢层
          detail: 路由 SEPA、Bacs 及国内 / 国际清算体系的 Numeral 支付平台
        - label: 多云基础设施层
          detail: 部署在 AWS、Google Cloud 和 Azure 上并符合 SOC 2 的超大规模云基础
    approximationNotes: 架构拆解反映 Mambu 宣布的 Intelligent Core 框架和已发布的技术平台规格。
    claimRefs:
      - CE002
      - CE004
      - CE006
      - CE007
      - CE009
  - id: FU001
    title: 客户采用与扩张旅程图
    type: journey-map
    summary: 展示客户从评估、绿地启动、企业核心迁移，到支付扩张和智能自动化的采用轨迹。
    data:
      items:
        - label: 评估与架构选择
          stage: 评估与架构选择
          touchpoints:
            - 可组合 API 评估
            - 多云 Kubernetes 基准测试
            - 与 Temenos 和 Thought Machine 对比供应商
          outcome: Selection of Mambu as flexible SaaS core
        - label: 绿地产品配置
          stage: 绿地产品配置
          touchpoints:
            - CASA 存款模块设置
            - 与前端（Backbase）和支付网关集成
            - 监管沙盒测试与合规验证
          outcome: Go-to-market achieved in 3 to 9 months
        - label: 初始生产上线
          stage: 初始生产上线
          touchpoints:
            - 实时账户开通
            - 实时账本处理
            - 定向获客活动
          outcome: 50-60% IT operating cost savings vs legacy engines
        - label: 核心迁移与规模化
          stage: 核心迁移与规模化
          touchpoints:
            - 与传统大型机并行渐进式现代化
            - 大规模账户迁移（如 BancoEstado 的 14M 个账户）
            - 零停机账本对账
          outcome: Scale to millions of active accounts
        - label: 支付中枢交叉销售
          stage: 支付中枢交叉销售
          touchpoints:
            - 连接统一支付中枢
            - SWIFT、SEPA 和本地支付体系集成
            - 跨境支付扩张（如 Western Union、Flowe）
          outcome: 7x payments processing volume acceleration
        - label: 生态与智能自动化
          stage: 生态与智能自动化
          touchpoints:
            - 合作伙伴市场集成（450 多家合作伙伴）
            - 部署代理式 AI 工作流，实现自动化服务
            - 持续通过 API 驱动功能更新
          outcome: Durability and long-term expansion loop
    approximationNotes: 旅程阶段综合自 BancoEstado、Uno Bank、Western Union 和 Bank Jago 已记录的客户部署模式。
    claimRefs:
      - CU006
      - CU007
      - CU008
      - CU010
      - CU011
