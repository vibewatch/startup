company:
  name: "Mambu"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Mambu is a 2011-founded, cloud-native core banking SaaS provider with independently reported reach of 260+ customers across 65+ countries and a current company-disclosed platform footprint of 230 million end users. The public record supports product scale and the Numeral acquisition, but current financing stage, valuation, revenue, headcount, legal headquarters, ownership, and board control remain material diligence gaps."
sections:
  - id: "identity-product-and-scale"
    title: "Identity, Product, and Operating Scale"
    body: >-
      Mambu sells a cloud-native, composable core banking platform to banks, credit unions,
      lenders, fintechs, and other financial institutions. Its current website describes an
      "Intelligent Core" spanning core banking, payments, and agentic AI, while product pages
      frame delivery as configurable, API-first SaaS rather than a monolithic on-premise core.
      Independent reporting dated October 2025 put the installed base at 260+ customers in
      more than 65 countries; the current company website separately claims 230 million end
      users, 500 million-plus API calls per day, and 450+ partners. These populations and
      denominators are different and should not be combined. Public descriptions of the
      operating base also conflict: FinTech Futures called Mambu Amsterdam-based in 2025,
      while MarketSpy called it Berlin-based in 2026, so the legal headquarters is not treated
      as resolved.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO013"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Leadership and Governance"
    body: >-
      A secondary profile identifies Eugene Danilkis and Frederik Pfisterer as Mambu's
      co-founders, but the assigned evidence does not establish their current operating,
      voting, or board roles. The Numeral acquisition materials identify Fernando Zandona as
      chief executive at the time of that transaction; a 2024 Mambu editorial identifies Mark
      Geneste as chief revenue officer; and independent 2025 reporting identifies Amber Harsin
      as vice president for credit unions. Those dated role observations should not be read as
      a complete October 2026 management roster. No assigned source provides the current board,
      committees, investor director seats, succession plan, executive ownership, or reserved
      matters. Accordingly, founder-market fit is visible at a historical level, but current
      key-person dependence and governance quality cannot be assessed from public evidence.
    claimRefs:
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
    tableRefs:
      - "TO002"
  - id: "capital-and-strategic-development"
    title: "Capital Record and Strategic Development"
    body: >-
      The only assigned source offering a round-by-round financing history is a low-reputation
      MarketSpy profile. It reports a $10 million Series A in 2015, $43 million Series B in
      2018, $110 million Series C in 2020, and $266 million Series D in 2021 at a valuation
      above $2 billion. Those figures are preserved as attributed secondary reporting rather
      than promoted to verified current facts; they do not establish total capital raised,
      cash available, the present financing stage, preference terms, or a current valuation.
      Stronger evidence exists for a later strategic event: Mambu and independent Finextra
      both report the acquisition of payments provider Numeral, and Finextra states that
      transaction terms were not disclosed. Numeral's reported annual payment volume exceeded
      EUR10 billion, but that is Numeral processing volume, not Mambu revenue.
    claimRefs:
      - "CO011"
      - "CO012"
      - "CO014"
    tableRefs:
      - "TO003"
  - id: "milestones-and-diligence-boundary"
    title: "Milestones and Diligence Boundary"
    body: >-
      The evidence traces a progression from a 2011 core-banking startup through reported
      venture rounds, a 2024 company claim of more than 200 institutions in 60 countries, a
      2025 push into US credit unions, and a current product narrative that adds payments and
      agentic AI to the core. The milestone sequence is directionally useful, but several
      entries rely on one secondary profile and therefore remain low confidence. MarketSpy
      also flags regulatory complexity, data security, and competition from Temenos, Thought
      Machine, and Finastra as challenges. The assigned adverse search returned no results;
      that is an evidence limitation, not proof that no outage, breach, enforcement action, or
      litigation occurred. Current ARR or revenue, margins, retention, burn, runway, headcount,
      investor ownership, and refreshed valuation all require private-company diligence.
    claimRefs:
      - "CO001"
      - "CO009"
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
    figureRefs:
      - "FO001"
