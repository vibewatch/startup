chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Whop 成立于 2021 年，总部位于纽约州布鲁克林。它如今的定位已不只是数字产品店面：Whop 将自己描述为运营线上业务的端到端 API，Tracxn
              则称其提供支付、结账、产品交付、会员、访问控制和业务运营的一体化基础设施。因此，Whop
              更像是面向互联网企业的市场与运营层，而不是单一用途的结账产品。其模式覆盖课程、软件、服务、社区、活动、实物产品和第三方平台。但这些描述部分来自公司自身，只能界定产品范围，不能证明经审计的收入结构、抽成率、盈利能力，也不能证明活动中有多少来自市场发现、多少来自嵌入式基础设施。
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO007
              - CO008
              - CO009
              - CO012
              - CO013
      - number: '1.2'
        title: 管理层与治理
        blocks:
          - type: paragraph
            body: >-
              公开创始人记录需要谨慎解读。Tracxn 列出五位创始人：Zar S、Steven Schwartz、Youssef M.、Cameron Zoub 和 Jack Sharkey。Everything PR 则把
              Cameron Zoub、Steven Schwartz 和 Jack Sharkey 定义为创始三人组，形成定义冲突，不能据此默默排除另外两人。2026 年 3 月的一份公司公告称 Steven
              Schwartz 为 CEO
              兼联合创始人，但现有证据没有说明其他被列名创始人的当前高管职责，也没有披露独立董事、董事会观察员、委员会、继任规划或投资人控制权。创始人熟悉市场可能有价值，但治理记录缺失，使关键人物集中度和机构监督成为必须核查的事项，而非可以直接下结论的事实。
            claimRefs:
              - CO004
              - CO005
              - CO006
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO005
              - CO006
      - number: '1.3'
        title: 资本结构与利益相关方
        blocks:
          - type: paragraph
            body: >-
              Tracxn 报告累计融资 $217M，并称公司于 2026 年 2 月 25 日完成 $200M C 轮融资，投后估值为 $1.6B。Silicon Valley Invest Club 则记录 2026 年
              2 月估值为 $1.7B。差异可能来自来源质量、四舍五入或不同估值口径；公开页面没有解决这一点，因此本文将 $1.6B 视为证据更充分的本轮数字，将 $1.7B 视为相冲突的登记值。Caplight 列出更早的
              A 轮、B 轮、战略融资和风险投资事件，但其公开页面隐去了大部分交易金额；它还列出 Andreessen Horowitz、Bain Capital Ventures、Soma Capital、Zinal
              Growth、Animal Capital、Tether Investments 和 SignalFire
              等投资人。上述来源均未披露当前股权结构表、持股比例、清算优先权、债务、二级交易、董事会权利或融资后可用现金。
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
          - type: table
            tableRef: TO003
            claimRefs:
