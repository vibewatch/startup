        - 下轮资本重组使估值收缩至 $800M-$1.0B
        - 清算优先权拖累抹去普通股价值
    notes: 反映当前 $1.6B 估值背景和数字市场同业基准的前瞻性情景假设。
    claimRefs:
      - CV001
      - CV004
      - CV010
      - CV013
      - CV014
