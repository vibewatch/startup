  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义、范围与纳入支出
        blocks:
          - type: paragraph
            body: >-
              创作者商业市场正在传统实物电商与基于访问权限的数字产品基础设施之间结构性分化。Whop 有意把平台定位在后者，覆盖数字订阅、可下载软件工具、封闭 Discord 和 Telegram 社区，以及按 cohort
              组织的教育项目。与需要库存管理、运输物流和实物退货流程的实物商品市场不同，Whop 的边界是纯电子、受访问控制的交易。它用一套整合运营栈替代分散的第三方 SaaS
              工具，例如独立付费墙、会员插件和外部社区软件。Whop 还是完整的记录商户，而非基础支付网关；因此平台代商家承担财务责任、全球销售税计算与汇缴，并自动处理争议。平台采用有竞争力的 3%
              佣金模式，把变现直接绑定交易量，同时摆脱传统创作者平台高昂的月度软件成本。
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM010
      - number: '2.2'
        title: 可服务市场规模与交易量口径
        blocks:
          - type: paragraph
            body: >-
              评估基于访问权限的创作者商业 TAM，必须把多个不同口径拼在一起，而不能只看一个宽泛预测。宏观上，全球创作者经济和数字产品行业构成数千亿美元规模的可服务空间，覆盖数字下载、教育课程和付费社区会员。更窄的 SAM
              则面向需要一体化访问管理和记录商户能力的专业数字创业者、独立软件开发者和社区运营者。近期公开披露和独立行业报告显示，Whop 交易量迅速增长，从 2023 年 $17M 的 A 轮融资发展到年化交易量超过
              $500M。到 2026 年底，公司声称已向 145 个国家的互联网创业者累计支付超过 $4.6B，显示出较高的交易密度。Tether 于 2026 年初进行的战略投资使 Whop 估值约为
              $1.6B，反映投资人预期一体化金融轨道和稳定币跨境结算会把访问变现带入新兴数字经济。但由于净收入和分部抽成率的完整经审计拆分仍属非公开，分析师必须谨慎看待累计总额。
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM011
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM011
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM006
      - number: '2.3'
        title: 买方细分、工作流与预算归属
        blocks:
          - type: paragraph
            body: >-
              Whop 的商业生态是连接专业卖家运营者、数字消费者和微型企业的双边市场。供给侧分为四类主要商家：体育博彩与金融交易运营者、个人课程创作者、小型软件开发者和数字营销机构。交易与体育竞猜领域的运营者通过封闭
              Discord、Telegram 渠道交付时效性信号和分析评论，买家使用个人可支配娱乐或投机交易资金。教育类个体创业者和课程创作者则依靠个人职业发展预算购买结构化视频课程和社区
              mastermind。独立软件开发者利用 Whop API 与 React 结账组件，把机器人、交易指标和消费型 SaaS
              工具变现，无需维护自建账单基础设施。四类客户的采用触发点都包括顺畅入驻、统一移动端管理和原生发现。卖家获准进入 Whop Discover 市场后，每周可获得超过 200
              万次访问，使平台从管理工具变成自然获客渠道。
            claimRefs:
              - CM006
              - CM008
              - CM009
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM006
              - CM008
              - CM012
      - number: '2.4'
        title: 增长驱动、结构性约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Whop 的市场扩张受多重宏观顺风推动：独立互联网企业增多、传统媒体就业被拆散，以及创作者更偏好按绩效计价的软件，而非固定月费 SaaS。Stripe
              等传统支付网关往往对高速增长的数字社区施加严格承保要求并冻结账户，为专业记录商户平台留下较大空间。Whop
              一体化处理销售税合规、自动会员访问控制和多币种支付，降低了启动变现数字社区的门槛。但长期防御力仍受运营与声誉约束。平台历史交易量相当一部分集中在体育竞猜、加密交易社区和财富增长策略，这些垂直领域争议率、消费者不满和潜在监管审查都较高。此外，cohort
              留存、净收入利润率和拒付准备金均未有经审计披露，构成机构评估必须细查的分析缺口。
            claimRefs:
              - CM002
              - CM005
              - CM007
              - CM011
              - CM014
      - number: '2.5'
        title: 展品
        blocks:
          - type: callout
            title: 记录商户能力构成防御性分发壁垒
            body: Whop 在访问型数字商业中的优势来自记录商户基础设施。它承担商户责任、全球税收和自动欺诈 / 争议缓解，因此能吸引 Stripe 等标准处理商会拒绝或严审的高交易速率、复杂垂直领域卖家。
            calloutType: insight
            claimRefs:
              - CM002
              - CM005
              - CM006
          - type: callout
            title: 高拒付率灰色细分领域的品类集中
            body: 平台历史交易量集中在交易指标、体育 picks 和转售社区，持续带来品牌与监管脆弱性。这些品类交易速度高、价格敏感度低，却更容易出现争议激增和支付处理商承保压力。
            calloutType: risk
            claimRefs:
              - CM006
              - CM007
              - CM014
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与同业分类
        blocks:
          - type: paragraph
            body: >-
              Whop 所处的创作者商业生态变化很快，覆盖多个软件品类。它面对的不是单一巨头，而是至少 81 个活跃软件平台的竞争，范围包括课程与会员 SaaS、社区优先平台、数字产品下载结账工具，以及直接构建在开发者 API
              上的自定义支付网关。传统课程软件重在结构化课程交付和邮件营销漏斗，社区优先方案则重在游戏化会员参与。Whop 的差异在于以支付优先的记录商户为核心，靠高额支付吞吐变现，而非昂贵的固定月度软件订阅。
            claimRefs:
              - CP001
              - CP002
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP005
      - number: '3.2'
        title: 能力对标与架构差异
        blocks:
          - type: paragraph
            body: >-
              Whop 的架构核心是原生记录商户（MoR）模式，代互联网创业者处理全球销售税计算、多币种兑换和支付网关合规。与要求创作者通过 Stripe 或 PayPal 接入并维护外部商户账户的老式软件不同，Whop
              原生处理完整结账流程。过去，社区运营者不得不把 Discord 或 Telegram 频道、独立结账链接和手工会员管理机器人拼在一起。如今 Whop
              已从访问控制中间件变成一体化店面生态，创作者可在同一个定制网页和移动界面中打包可下载文件、封闭讨论区、课程模块和软件许可。
            claimRefs:
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP008
      - number: '3.3'
        title: 商业模式、抽成率与迁移成本
        blocks:
          - type: paragraph
            body: >-
              平台定价是 Whop 对现有创作者软件最有力的切入口。Gumroad 等数字下载平台和 Substack 等媒体订阅平台通常收取 10% 的高额平台抽成，另加支付处理费；Whop 则收取标准国内交易费 2.7%
              加 $0.30。对每月创造数千美元收入的高交易量卖家，这一差异能节省大量资金。相反，Skool（每月 $99）和 Kajabi（每月 $149 至
              $399+）等固定费用订阅平台会制造持续固定成本，压制早期运营者。不过，一旦订阅账单建立，高交易量商家的迁移成本就很高。为化解这一障碍，Whop 提供自动化的 30 秒数据库迁移工具，让企业直接把现有
              Stripe 客户订阅转移到 Whop。
            claimRefs:
              - CP003
              - CP004
              - CP009
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP004
              - CP009
              - CP010
      - number: '3.4'
        title: 壁垒持久性、平台防御力与替代风险
        blocks:
          - type: paragraph
            body: >-
              Whop 商业增长快、标价有吸引力，但高风险数字记录商户业务固有的运营和监管逆风，削弱其长期防御力。作为法定销售方，支付争议责任和欺诈风险集中在 Whop 资产负债表上。Better Business
              Bureau 的公开记录显示，三年内有 157 起客户投诉，其中仅过去 12 个月就有 109 起，重点涉及争议性账户冻结、扣留商户余额和未经核实的未授权扣款。此外，封闭社区内容大多不被搜索爬虫和外部 AI
              索引，Whop 必须持续投入公开市场发现、开发者 API 和加密原生支付基础设施，才能对抗新竞争者、维持创作者留存。
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
