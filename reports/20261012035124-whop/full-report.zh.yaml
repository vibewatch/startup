  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 从发现到金融扩张，展示商户和买家生命周期的关键阶段。
    claimRefs:
      - CU002
      - CU010
      - CU013
    data:
      items:
        - stage: 发现与获客
          label: 市场与直接浏览
          description: 潜在买家通过 Discover 市场分类、创作者社交主页或推荐链接，探索细分数字产品。
          touchpoints:
            - Whop Discover 目录
            - 社交媒体主页
            - 联盟推荐链接
        - stage: 评估与免费试用
          label: 零风险买家入驻
          description: 买家查看店面落地页、浏览社群评分，并通过银行卡预授权发起 1 至 30 天免费试用。
          touchpoints:
            - 店面落地页
            - 试用结账弹窗
            - 反滥用试用检测
        - stage: 店面创建与应用打包
          label: 无代码商户配置
          description: 创作者推出可定制的 whop 中心，并拖放组合聊天、课程、论坛和数字下载等模块化应用。
          touchpoints:
            - Whop 应用商店
            - 拖放式仪表盘
            - Next.js 自定义应用 SDK
        - stage: 结账与变现
          label: 多轨商户记录
          description: 交易通过银行卡、PayPal、BNPL 或加密钱包完成，税务处理自动化，并即时开通访问权限。
          touchpoints:
            - 嵌入式结账组件
            - Discord 角色自动化
            - MoR 税务计算
        - stage: 互动与社群留存
          label: 生命周期状态跟踪
          description: 卖家通过分析组件跟踪会员参与度、续费状态和流失情况，并按活跃、试用和暂停状态划分用户。
          touchpoints:
            - 分析用户组件
            - 原生 iOS/Android 应用
            - 聊天与社区动态
        - stage: 金融基础设施与扩张
          label: Treasury 与余额收益
          description: 成熟企业将经营现金流转入 Whop Treasury，赚取收益并使用稳定币付款。
          touchpoints:
            - Whop Treasury 仪表板
            - Plasma 区块链上的 USDT0
            - 合作伙伴付款路由
    approximationNotes: 这些阶段模拟 Whop 文档和卖家案例研究所描述的标准商户—买家演进路径。
