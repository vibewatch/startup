    Whop 是一家总部位于布鲁克林、2021 年成立的创作者商业和记录商户平台。它把支付、结账、产品交付、发现、合规，以及日益扩展的资金管理 /
    稳定币相关基础设施整合给创作者和互联网企业。公开记录显示，公司已具备一定规模，并完成一笔近期战略融资；但公司仍属私营，公开资料中没有经审计财务、股权结构表相关权利和客户留存指标，这些信息仍不透明。
