  - id: FE001
    title: Whop 技术栈与模块化系统层
    type: stack
    summary: 架构图详细展示 Whop 从展示界面到底层去中心化金融基础设施的多层系统拓扑。
    data:
      layers:
        - label: 店面与分发层
          detail: 覆盖托管店面、移动应用和 Whop Discover 市场的客户与商户触点
        - label: 前端组件与 SDK 层
          detail: 可嵌入的 @whop/elements-react 和 @whop/elements 库，提供即插即用的无头结账
        - label: 开发者集成界面
          detail: 覆盖 TypeScript、Python、Go 和 Ruby 的 REST API 及 Fern 生成的客户端 SDK
        - label: 应用与社群运行时
          detail: 模块化仪表盘应用（课程、聊天、预订、帮助台）以及适用于 Discord、Telegram 和 Slack 的自动化机器人
        - label: 商业与权益核心
          detail: 统一的数字产品打包、软件许可证密钥验证和商户记录合规
        - label: 金融与结算基础设施
          detail: 全球支付处理、自动征收 VAT / 销售税以及多币种提款基础设施
    approximationNotes: 基于 Whop 开发者文档、GitHub SDK 代码库和官方新闻稿的概念性架构表示。
