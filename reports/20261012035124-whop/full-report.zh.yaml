  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 将平台 GMV 规模、毛利率不确定性、争议风险和估值倍数串联起来，形成受价格纪律约束的「继续跟踪」推荐决策流程。
    data:
      nodes:
        - id: scale
          label: 平台规模
          detail: 累计付款超过 $4.6B、销售额超过 $2B，说明商户采用度较高。
        - id: monetization
          label: 变现抽成率
          detail: 实际抽成率和毛利率仍未公开披露，也未经审计。
        - id: disputes
          label: 争议与合规摩擦
          detail: BBB 消费者投诉和拒付风险抬高了剩余运营风险敞口。
        - id: valuation-mark
          label: C 轮估值
          detail: 2026 年 2 月 $1.6B 的估值对应预估净收入的高倍数。
        - id: entry-discipline
          label: 估值纪律
          detail: 溢价倍数已计入完美执行预期，却没有下行缓冲。
        - id: recommendation
          label: 推荐：继续跟踪
          detail: 在经审计财务披露和争议整改完成前，维持「继续跟踪」判断。
