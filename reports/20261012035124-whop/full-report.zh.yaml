      - number: '1.4'
        title: 规模、里程碑与尽调边界
        blocks:
          - type: paragraph
            body: >-
              Whop 新闻中心称，平台用户在 145 个国家每年赚取约 $4B；其产品指南则称月度买家超过 22m。这是两个分母不同的指标，既不是收入、ARR、GMV、经审计支付额，也不是客户数。Financier
              Metrics 的实时页面有 11 条评价，能说明生态内存在第三方应用活动，但不能证明全公司的卖家结果。产品扩张更具体：Whop 于 2026 年 3 月 25 日宣布 Whop Finance 和 Whop
              Treasury，从支付延伸到余额、收益和稳定币相关基础设施。独立评论还指出，Whop
              封闭社区内的内容不会被搜索引擎索引，限制了外部可观察的参与度。此次指定的不利搜索没有返回可留存结果；这一缺失不代表没有发生诉讼、宕机、监管行动或管理层变动。
            claimRefs:
              - CO012
              - CO013
              - CO014
              - CO015
              - CO016
          - type: figure
