              - CO008
              - CO010
              - CO014
      - number: '1.5'
        title: 展品
        blocks:
          - type: callout
            title: 平台规模主张强，公开可观察性却较弱
            body: 公司发布的规模指标不是经审计的财务指标，独立评论也称封闭社区内容不会被搜索引擎索引。因此，尽调应依赖 cohort 数据、支付处理商报表和治理记录，而不能把公开触达主张当作已验证的经营表现。
            calloutType: risk
            claimRefs:
