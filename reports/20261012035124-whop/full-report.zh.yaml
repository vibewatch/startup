          - type: paragraph
            body: >-
              Whop 把自己定位为互联网商业的一体化基础设施平台，但其法律和监管姿态存在投资人必须仔细评估的结构性边界。根据服务条款，Whop 是支付结算记录商户，而非承担普遍供应商责任的传统全服务转售商
              [CR002]。间接税方面，只有卖家选择 0.5% 专项附加费时，Whop 才在美国、欧盟和英国负责计算、收取并按季度汇缴 [CR001]。在巴西、澳大利亚、日本和印度等拉美、亚太及加拿大数字经济中，Whop
              不代缴数字服务税或其他间接税，跨境税务合规责任全部留在个人创作者身上 [CR001]。Whop 还明确否认自己是银行或持牌金融机构，把支付路由、卡收单和托管交给第三方金融合作伙伴
              [CR003]。平台上的客户和商户余额在美国不享有 FDIC 保险，合作伙伴结算争议期间卖家会暴露于机构托管风险 [CR003]。为限制私人法律责任，Whop
              用户协议要求在私规则下进行具有约束力的个人仲裁，并包含全面集体诉讼弃权 [CR011]。这虽能挡住集体消费者诉讼，却会加剧与卖家的摩擦，也不能让平台免受州检察长调查或联邦监管执法。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR011
      - number: '7.2'
        title: 运营脆弱性、争议暴露与上游网关依赖
        blocks:
          - type: paragraph
            body: >-
              Whop 核心运营基础设施深度绑定第三方支付网关、卡组织和银行合作伙伴，平台能否运营受其可接受使用政策约束。由于 Whop 承载投机且波动较大的品类，交易组合存在结构性拒付和争议风险 [CR007]。Whop
              提供争议管理工具来反驳客户询问，但拒付损失和支付网络罚金的财务责任直接转给卖家 [CR012]。根据上游金融协议，合作机构可单方面在风险阈值被突破时暂停支付路由、冻结托管资金或终止商户账户
              [CR004]。消费者退款请求激增或卡组织审查，可能迅速触发整个卖家 cohort 的自动扣留 [CR004]。支付时间机制又放大运营摩擦：卖家收入要 1 至 4 个工作日才能提现，转入外部存款账户最多还需 10
              天 [CR010]。工作资本周期紧张的高交易量创作者会因此承受流动性压力。此外，Whop 不断扩大的 App Store 生态依赖外部开发者软件和
              webhook，后者不承担平台性能责任；关键应用在高流量产品发布期间故障，会造成次级运营脆弱性 [CR014]。
            claimRefs:
              - CR004
              - CR007
              - CR010
              - CR012
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR007
              - CR010
              - CR012
              - CR014
      - number: '7.3'
        title: 交易对手依赖、灰色市场摩擦与资本结构悬置
        blocks:
          - type: paragraph
            body: >-
              Whop 快速扩张的核心悖论，是依靠高速灰色市场数字品类推动交易吞吐。市场早期通过服务球鞋 bot 软件、体育博彩算法联盟、转售 alpha 群组和去中心化剪辑网络实现规模化
              [CR005]。这些社区带来可观总交易量，帮助 Whop 报告年创作者收入 $4B 以上、累计支付超过 $4.6B
              [CR013]，却也吸引传统支付收单机构和知识产权持有人的更高审查。为服务这批非传统商户，Whop 于 2026 年初获得稳定币发行方 Tether 的 $200M 投资，估值达到 $1.6B
              [CR006]。这笔融资提供了很长的资产负债表 runway，但与 Tether 合作也带来治理复杂性和声誉悬置，可能影响未来国内 IPO 路径或 Tier-1 机构银行关系 [CR006]。同时，Whop
              的经济抽成制造渠道摩擦：标准国内交易费为 2.7% + $0.30，另有 1.5% 国际卡附加费和 1.0% 外汇费 [CR008]。创作者使用 Discord、Telegram 或 TradingView
              的内置社区自动化时，Whop 还加收 3.0% 平台自动化费，使全包抽成超过 6%；规模做大后，大型创作者会更有动力绕开平台结账 [CR008, CR009]。
            claimRefs:
              - CR005
              - CR006
              - CR008
              - CR009
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR009
