callouts:
  - calloutType: insight
    title: Merchant-of-Record and Modular Apps as Core Defensibility
    body: >
      Whop's architectural differentiation does not stem from proprietary course-building software, but from combining an extensible in-dashboard application framework with full merchant-of-record financial rails. By assuming tax liability, fraud monitoring, and dispute handling while providing drop-in SDKs, Whop lowers the friction for launching complex digital businesses far below traditional disaggregated stacks.
    claimRefs:
      - CE004
      - CE005
      - CE008
      - CE010
  - calloutType: risk
    title: Upstream Ecosystem and Web3 Treasury Vulnerabilities
    body: >
      The platform's technical reliability remains tightly coupled to external ecosystems. Critical automation hooks rely on third-party APIs from Discord, Telegram, and Slack, while the new Whop Treasury suite introduces dependency on smart contract protocols (Aave), alternative Layer 1 infrastructure (Plasma), and Tether stablecoins, exposing traditional digital creators to decentralized finance risks.
    claimRefs:
      - CE007
      - CE011
      - CE013
      - CE014
