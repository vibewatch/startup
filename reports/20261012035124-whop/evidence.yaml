evidenceGaps:
  - type: missing-source
    severity: material
    topic: adverse-events
    missingEvidence: >-
      Independent legal, regulatory, outage, breach, and executive-departure records covering the current diligence
      period.
    whyItMatters: The assigned adverse query retained no result, which leaves event risk untested rather than affirmatively clean.
    diligencePath: >-
      Run regulator, court-docket, status-page, security-incident, and executive-history checks in a future authorized
      discovery pass.
    relatedQuestionRefs:
      - QO007
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: Primary financing documents reconciling the $1.6 billion and $1.7 billion February 2026 valuation records.
    whyItMatters: >-
      Entry price and ownership analysis depend on whether the figures use the same round, share class, and post-money
      convention.
    diligencePath: Obtain the Series C term sheet, amended charter, capitalization table, and closing funds-flow statement.
    relatedQuestionRefs:
      - QO008
  - type: private-evidence-only
    severity: material
    topic: financial-and-scale-metrics
    missingEvidence: >-
      Audited revenue, ARR, gross margin, take rate, net revenue retention, cash burn, current cash, customer count, and
      headcount.
    whyItMatters: >-
      Public earnings and buyer claims cannot substitute for financial performance, customer quality, or operating
      capacity.
    diligencePath: >-
      Request audited financials, processor statements, cohort exports, payroll records, and a reconciled KPI
      dictionary.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-governance
    missingEvidence: >-
      A complete current executive roster, founder-status reconciliation, board composition, committees, succession
      plan, and investor governance rights.
    whyItMatters: Public founder labels do not establish operating responsibility, oversight independence, or key-person resilience.
    diligencePath: >-
      Request the organization chart, board minutes, voting agreements, employment contracts, and director
      questionnaires.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: capitalization
    missingEvidence: >-
      A complete cap table with ownership, share classes, liquidation preferences, debt, secondaries, and control
      rights.
    whyItMatters: The public investor list establishes participation but not economic seniority, dilution, or control.
    diligencePath: >-
      Obtain the certified fully diluted cap table, financing documents, debt schedule, and secondary transaction
      ledger.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-reporting-and-gmv-breakdown
    missingEvidence: >-
      Audited merchant GMV and transaction volume breakdowns segmented by merchant category (e.g., sports betting,
      trading indicators, consumer software, and online courses).
    whyItMatters: >-
      Without category-level volume data, Whop's structural exposure to chargeback-prone niches and shifting payment
      processor underwriting policies cannot be independently assessed.
    diligencePath: >-
      Obtain seller cohort GMV tables, category concentration reports, and payment processor reserve requirements during
      confidential management diligence.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: competitor-unit-economics-and-churn
    missingEvidence: >-
      Audited merchant churn, dispute-loss rates, and net take-rate breakdowns comparing Whop against Gumroad, Skool,
      and Kajabi across identical creator gross merchandise value cohorts.
    whyItMatters: >-
      Without segmented churn and net take-rate disclosures, evaluating whether Whop's lower headline pricing yields
      superior lifetime customer value or higher net margin remains unconfirmed.
    diligencePath: >-
      Request confidential seller cohort retention tables, chargeback loss statements, and processor interchange
      pass-through schedules during private sponsor diligence.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: private-financial-metrics
    missingEvidence: >-
      Audited income statements detailing net revenue, cost of goods sold, payment interchange expenses, and operating
      margins.
    whyItMatters: >-
      Without audited gross margins and interchange expense breakdowns, underwriting cannot verify whether Whop achieves
      positive unit contribution margins on lower-tier merchants after third-party payment processing fees.
    diligencePath: >-
      Request audited FY2025 and trailing twelve-month management accounts, including net interchange margins and bad
      debt provisions.
    relatedQuestionRefs:
      - QI010
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: infrastructure-sla
    missingEvidence: >-
      Audited system availability, incident frequency history, and API latency SLA documentation for Whop's core
      developer endpoints.
    whyItMatters: >-
      Enterprise platforms and SaaS applications embedding Whop checkout require verified reliability data to underwrite
      operational dependency.
    diligencePath: >-
      Request historical status-page incident logs and production API uptime reports from Whop's technical leadership
      during management diligence.
    relatedQuestionRefs:
      - QE003
    relatedTableRefs:
      - TE001
  - type: missing-source
    severity: material
    topic: customer-retention-cohorts
    missingEvidence: >-
      Audited cohort-level net revenue retention (NRR), gross revenue retention (GRR), and annual merchant churn
      statistics broken down by seller GMV band.
    whyItMatters: >-
      Without audited cohort retention, it is impossible to verify whether platform volume growth is driven by durable
      recurring merchant businesses or by rapid churn compensated by top-of-funnel creator acquisition.
    diligencePath: >-
      Request confidential seller cohort retention tables (by 2024, 2025, and 2026 onboarding vintage) and dispute loss
      rates from Whop management during confirmatory diligence.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU002
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-deployments
    missingEvidence: >-
      Comprehensive registry of top 100 enterprise and high-volume merchant accounts by annualized gross merchandise
      value (GMV).
    whyItMatters: >-
      Public case studies highlight a selective sample of niche and creator deployments, obscuring whether revenue is
      concentrated in volatile trading/crypto communities or diversified across mainstream education and SaaS.
    diligencePath: >-
      Obtain an anonymized merchant concentration schedule showing percentage of GMV and net revenue derived from the
      top 10, 25, and 50 merchant accounts.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: international-indirect-tax-and-regulatory-filings
    missingEvidence: >-
      Country-by-country tax compliance, digital service tax registration assessments, and foreign regulatory inquiry
      records for operations outside the US, EU, and UK.
    whyItMatters: >-
      Uncertainty surrounding whether foreign tax authorities have asserted nexus or unpaid indirect tax obligations
      against Whop or its top non-US sellers.
    diligencePath: Review Whop's cross-border indirect tax legal opinions and audit historical foreign tax assessments under NDA.
    relatedQuestionRefs:
      - QR001
      - QR002
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: chargeback-and-dispute-loss-rates
    missingEvidence: >-
      Audited transaction loss, chargeback frequency, and dispute volume metrics broken down by high-risk creator
      categories.
    whyItMatters: High dispute rates in botting and sports betting can trigger card-brand fines or merchant account termination.
    diligencePath: >-
      Request merchant underwriting dispute ratios and VISA/Mastercard excessive chargeback program compliance records
      under NDA.
    relatedQuestionRefs:
      - QR004
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: tether-round-governance-terms
    missingEvidence: >-
      Liquidation preferences, board representation rights, and stablecoin payment exclusivity covenants from Tether's
      $200M round.
    whyItMatters: >-
      Senior liquidation preferences or aggressive control rights could subordinate common equity or constrain banking
      partnerships.
    diligencePath: >-
      Review the Series C amended Certificate of Incorporation and investor rights agreement during confirmatory
      diligence.
    relatedQuestionRefs:
      - QR006
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: audited-financials-and-margins
    missingEvidence: >-
      Audited financial statements confirming FY2025 and YTD FY2026 GAAP revenue, net take rate, gross margins, and
      chargeback reserves.
    whyItMatters: >-
      Evaluating whether the $1.6B valuation reflects sustainable software margins or lower-margin payment passthrough
      economics requires verified take rates.
    diligencePath: >-
      Request audited financial statements, payment processor fee schedules, and cohort-level take-rate disclosures
      under NDA.
  - type: missing-source
    severity: material
    topic: cap-table-liquidation-preferences
    missingEvidence: >-
      Detailed capitalization table showing liquidation preferences, participating rights, and anti-dilution provisions
      for the Series C round.
    whyItMatters: >-
      Senior liquidation preferences on the $200M February 2026 round could materially impair common shareholder returns
      in downside or moderate exit scenarios.
    diligencePath: Examine certificate of incorporation filings and venture investor rights agreements via direct data room access.
