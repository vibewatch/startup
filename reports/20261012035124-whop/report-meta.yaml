companyProfile:
  summary: >-
    Whop is a Brooklyn-based creator-commerce and merchant-of-record platform founded in 2021. It combines payments,
    checkout, product delivery, discovery, compliance, and increasingly treasury / stablecoin-linked infrastructure for
    creators and internet businesses. The public record shows meaningful scale and a recent strategic financing event,
    but the company remains private-disclosed with audited financials, cap-table rights, and customer-retention metrics
    still opaque.
