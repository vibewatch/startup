  topStrengths:
    - Large creator-commerce footprint with $4.6B+ paid to businesses and 27,000+ businesses on platform.
    - Broad merchant-of-record product surface spanning payments, discovery, compliance, and treasury tooling.
    - Fresh 2026 financing and stablecoin-linked infrastructure expansion support continued execution capacity.
  topRisks:
    - Audited income statement, gross-margin, and net take-rate disclosure remain unavailable.
    - A $1.6B valuation leaves limited room for execution misses or multiple compression.
    - Creator disputes, payout holds, and category-specific compliance risk can erode merchant trust.
  unresolvedGaps:
    - Audited FY2025 and YTD FY2026 revenue, gross margin, take rate, and cash-burn disclosure.
    - Full cap table, liquidation preferences, anti-dilution terms, and any special rights tied to the Tether round.
    - Category concentration, chargeback, refund, fraud-loss, and payout-delay metrics by seller cohort.
    - Reconciled KPI definitions for users, MAU, businesses, GMV, payouts, and creator earnings across public surfaces.
