callouts:
  - calloutType: strength
    title: Zero-Subscription Onboarding and High Conversion Payment Infrastructure
    body: >-
      Whop eliminates fixed SaaS barriers by offering zero upfront subscription costs and monetizing purely on
      transaction volume, while capturing high merchant retention through built-in licensing, Discord integration, and
      smart checkout routing.
    claimRefs:
      - CI002
      - CI003
  - calloutType: risk
    title: Fee Stacking Margin Drag and Unaudited Unit Contribution
    body: >-
      As merchant sales scale past $10,000 monthly, stacked add-on percentages (managed tax, billing, and affiliate
      cuts) cause severe margin leakage, while dependence on stablecoin partners introduces counterparty and regulatory
      underwriting risks.
    claimRefs:
      - CI004
      - CI006
      - CI010
