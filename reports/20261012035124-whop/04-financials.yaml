      - - Managed Tax & Billing Services
        - Optional percentage add-on
        - 2.0% tax remittance + 0.5% billing automation
        - Active opt-in layer across digital course and SaaS sellers
        - High margin software revenue; offsets baseline interchange drag
        - Verify attach rate and retention of merchant accounts using tax tools
      - - Checkout Financing Surcharges
        - Third-party BNPL integration
        - 15% per transaction via Klarna and Afterpay
        - Live option for high-ticket coaching and masterminds
        - High headline rate, but revenue is shared with BNPL providers
        - Disclose net margin split and default chargeback exposure on BNPL
      - - Disbursement & Withdrawal Rails
        - Fixed and variable payout fees
        - $2.50 ACH, $23 bank wire, 5% + $1.00 crypto/Venmo
        - Mandatory operational rail for merchant fund liquidation
        - High margin operational fee; liquidity driver
        - Audit payout volume distribution across ACH, wire, and crypto rails
    notes: >-
      Data reflects Whop official fee schedule and rate cards documented in August 2026; realized net margins after
      payment processor costs remain undisclosed.
