chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              Whop was founded in 2021 and is headquartered in Brooklyn, New York. Its current positioning is broader
              than a digital-product storefront: Whop describes an end-to-end API for running an online business, while
              Tracxn describes integrated infrastructure for payments, checkout, product delivery, memberships, access
              control, and business operations. This supports a company identity spanning a marketplace and an operating
              layer for internet businesses rather than a single-purpose checkout product. The model reaches courses,
              software, services, communities, events, physical products, and third-party platforms. Because those
              descriptions are partly company-issued, they establish product scope but not audited revenue mix, take
              rate, profitability, or the share of activity attributable to marketplace discovery versus embedded
              infrastructure.
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO007
              - CO008
              - CO009
              - CO012
              - CO013
      - number: '1.2'
        title: Leadership and Governance
        blocks:
          - type: paragraph
            body: >-
              Public founder records require caution. Tracxn names five founders: Zar S, Steven Schwartz, Youssef M.,
              Cameron Zoub, and Jack Sharkey. Everything PR instead frames Cameron Zoub, Steven Schwartz, and Jack
              Sharkey as the founding trio, creating a definitional conflict rather than a basis for silently excluding
              two people. A March 2026 company release identifies Steven Schwartz as CEO and co-founder, but the
              assigned evidence does not establish current executive responsibilities for the other named founders,
              independent directors, board observers, committees, succession planning, or investor control rights.
              Founder-market familiarity may be valuable, yet the absent governance record makes key-person
              concentration and institutional oversight material diligence items rather than supportable conclusions.
            claimRefs:
              - CO004
              - CO005
              - CO006
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO005
              - CO006
      - number: '1.3'
        title: Capitalization and Stakeholders
        blocks:
          - type: paragraph
            body: >-
              Tracxn reports $217 million of total funding and a $200 million Series C dated February 25, 2026 at a $1.6
              billion post-money valuation. Silicon Valley Invest Club instead records a $1.7 billion February 2026
              valuation. The difference could reflect source quality, rounding, or a different valuation convention; the
              public pages do not resolve it, so $1.6 billion is treated as the better-supported round figure and $1.7
              billion as a conflicting registry value. Caplight lists earlier Series A, Series B, strategic, and venture
              events but withholds most transaction amounts on its public page. It also names Andreessen Horowitz, Bain
              Capital Ventures, Soma Capital, Zinal Growth, Animal Capital, Tether Investments, and SignalFire as
              investors. None of these sources discloses the current cap table, ownership percentages, liquidation
              preferences, debt, secondaries, board rights, or cash available after the financing.
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
          - type: table
            tableRef: TO003
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
      - number: '1.4'
        title: Scale, Milestones, and Diligence Limits
        blocks:
          - type: paragraph
            body: >-
              Whop's newsroom claims that people on the platform earn about $4 billion annually across 145 countries,
              while its product guide claims more than 22 million monthly buyers. These are different metrics with
              different denominators, and neither is revenue, ARR, GMV, audited payout volume, or a customer count. A
              live Financier Metrics listing with eleven reviews illustrates third-party application activity inside the
              ecosystem but cannot establish company-wide seller outcomes. Product expansion is more concrete: Whop
              announced Whop Finance and Whop Treasury on March 25, 2026, extending from payments toward balances,
              yield, and stablecoin-linked infrastructure. Independent commentary also notes that content inside gated
              Whop communities is not indexed by search engines, which limits externally observable engagement. The
              assigned adverse search returned no retained result; that absence is not evidence that litigation,
              outages, regulatory action, or leadership churn did not occur.
            claimRefs:
              - CO012
              - CO013
              - CO014
              - CO015
              - CO016
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO008
              - CO010
              - CO014
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public observability is weaker than platform scale claims
            body: >-
              Company-issued scale metrics are not audited financial metrics, and independent commentary says gated
              community content is not indexed by search engines. Diligence should therefore rely on cohort data,
              processor statements, and governance records rather than treating public reach claims as verified
              operating performance.
            calloutType: risk
            claimRefs:
              - CO012
              - CO013
              - CO016
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition, Scope, and Included Spend
        blocks:
          - type: paragraph
            body: >-
              The market for creator commerce has undergone a structural bifurcation between traditional physical goods
              e-commerce and access-based digital product infrastructure. Whop deliberately positions its platform
              around the latter, defining its addressable scope as digital subscriptions, downloadable software tools,
              gated Discord and Telegram communities, and cohort-based educational programs. Unlike physical merchandise
              marketplaces that require inventory management, shipping logistics, and physical return pipelines, Whop's
              market boundary encompasses purely electronic, access-gated transactions. This focus enables the company
              to replace a fragmented patchwork of third-party SaaS tools—such as standalone paywalls, membership
              plug-ins, and external community software—with an integrated operational stack. Furthermore, Whop
              functions as a full Merchant of Record rather than a basic payment gateway. In this capacity, the platform
              assumes financial liability, sales tax calculation and remittance across global jurisdictions, and
              automated dispute resolution on behalf of its merchant operators. By operating on a competitive 3%
              platform commission model, Whop aligns its monetization directly with transaction volume while decoupling
              itself from the prohibitive monthly software overhead that characterizes legacy creator platforms.
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM010
      - number: '2.2'
        title: Addressable Market Sizing and Volume Lenses
        blocks:
          - type: paragraph
            body: >-
              Evaluating the total addressable market for access-based creator commerce requires triangulating multiple
              distinct sizing lenses rather than relying on a single broad projection. At the macro level, the global
              creator economy and digital products industry represents a multi-hundred-billion-dollar addressable space,
              spanning digital downloads, educational courses, and paid community memberships. Within this broader
              universe, Whop's serviceable addressable market targets specialized digital entrepreneurs, independent
              software developers, and community operators requiring integrated access management and merchant-of-record
              capabilities. Recent public disclosures and independent industry reports document Whop's rapid volume
              expansion, scaling from a $17 million Series A in 2023 to more than $500 million in annualized transaction
              volume. By late 2026, the company claimed cumulative payouts to internet entrepreneurs exceeding $4.6
              billion across 145 countries, underscoring significant transaction density. Furthermore, a strategic
              investment from Tether in early 2026 valued Whop at approximately $1.6 billion, reflecting investor
              expectations that integrated fintech rails and stablecoin cross-border settlements will expand access
              monetization into emerging digital economies. However, because comprehensive audited breakdowns of net
              revenue and segment-level take rates remain private, analysts must treat top-line cumulative figures with
              diligence caution.
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM011
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM011
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM006
      - number: '2.3'
        title: Buyer Segmentation, Workflows, and Budget Ownership
        blocks:
          - type: paragraph
            body: >-
              Whop's commercial ecosystem operates as a two-sided marketplace connecting specialized seller operators
              with digital consumers and micro-businesses. The supply side segments into four primary merchant classes:
              sports betting and financial trading operators, solo course creators, boutique software developers, and
              digital marketing agencies. In the trading and sports handicapping segment, operators monetize
              time-sensitive signals and analytical commentary delivered via gated Discord and Telegram channels; here,
              buyers allocate personal discretionary entertainment or speculative trading capital. For educational
              solopreneurs and course creators, buyers draw from personal professional development budgets to access
              structured video courses and community masterminds. Independent software developers leverage Whop's APIs
              and React checkout components to monetize boutique bots, trading indicators, and consumer SaaS tools
              without maintaining custom billing infrastructure. Adoption triggers across all four segments center on
              frictionless onboarding, unified mobile app management, and native discovery. Once approved for the Whop
              Discover marketplace, sellers gain exposure to over two million weekly visits, transforming the platform
              from a purely administrative utility into an organic customer acquisition channel.
            claimRefs:
              - CM006
              - CM008
              - CM009
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM006
              - CM008
              - CM012
      - number: '2.4'
        title: Growth Drivers, Structural Constraints, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The expansion of Whop's market footprint is propelled by powerful macro tailwinds, including the
              proliferation of independent internet businesses, the unbundling of traditional media employment, and
              increasing creator demand for performance-based software pricing over fixed monthly SaaS subscriptions.
              Traditional payment gateways like Stripe often impose strict underwriting requirements and punitive
              account freezes on high-velocity digital communities, creating a substantial opening for specialized
              merchant-of-record platforms. Whop's integrated handling of sales tax compliance, automated member access
              gating, and multi-currency payouts significantly lowers the barrier to launching a monetized digital
              community. Nonetheless, significant operational and reputational constraints govern long-term platform
              defensibility. A substantial share of platform volume historically concentrates in sports handicapping,
              crypto trading communities, and wealth-generation strategies—verticals characterized by elevated dispute
              rates, consumer dissatisfaction, and potential regulatory scrutiny. Additionally, the lack of audited
              disclosures regarding cohort retention, net revenue margins, and chargeback reserves leaves an analytical
              diligence gap that must be scrutinized in institutional evaluations.
            claimRefs:
              - CM002
              - CM005
              - CM007
              - CM011
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Merchant of Record as a Defensive Distribution Moat
            body: >-
              Whop's competitive advantage in access-based digital commerce stems from its merchant-of-record
              infrastructure. By assuming merchant liability, global tax collection, and automated fraud/dispute
              mitigation, Whop captures high-velocity sellers in complex verticals that standard processors like Stripe
              reject or heavily scrutinize.
            calloutType: insight
            claimRefs:
              - CM002
              - CM005
              - CM006
          - type: callout
            title: Category Concentration in High-Chargeback Shadow Niches
            body: >-
              The platform's historical volume concentration in trading indicators, sports picks, and resell communities
              presents ongoing brand and regulatory vulnerability. While these categories deliver high transaction
              velocity and lower price sensitivity, they carry heightened risk of dispute surges and processor
              underwriting pressure.
            calloutType: risk
            claimRefs:
              - CM006
              - CM007
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Peer Group Taxonomy
        blocks:
          - type: paragraph
            body: >-
              Whop operates in a highly dynamic creator-commerce ecosystem that spans multiple distinct software
              categories. Rather than confronting a single monolithic rival, Whop faces competition across at least 81
              active software platforms tracked across venture markets. These competitors divide functionally into
              course-and-membership SaaS platforms, community-first hubs, digital product download checkout tools, and
              custom payment gateways built directly on top of developer APIs. Traditional course software focuses
              heavily on structured curriculum delivery and email marketing funnels, whereas community-first solutions
              prioritize gamified member engagement. Whop distinguishes its offering by functioning primarily as a
              payments-first merchant of record that monetizes through high-volume payment throughput rather than
              expensive fixed monthly software subscription fees.
            claimRefs:
              - CP001
              - CP002
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP005
      - number: '3.2'
        title: Capability Benchmarking and Architectural Differentiation
        blocks:
          - type: paragraph
            body: >-
              Whop's architectural core centers on its native merchant-of-record (MoR) model, which absorbs global sales
              tax calculation, multi-currency conversion, and payment gateway compliance on behalf of internet
              entrepreneurs. In contrast to legacy software alternatives that require creators to connect and maintain
              external merchant accounts through Stripe or PayPal, Whop handles end-to-end checkout processing natively.
              Historically, online community operators were forced to stitch together Discord or Telegram channels with
              separate checkout links and manual member management bots. Whop has transitioned from being an
              access-control middleware layer into an all-in-one storefront ecosystem where creators can package
              downloadable files, gated discussion forums, course modules, and software licenses inside a single
              customized web and mobile interface.
            claimRefs:
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP008
      - number: '3.3'
        title: Commercial Models, Take Rates, and Switching Costs
        blocks:
          - type: paragraph
            body: >-
              Platform pricing represents Whop's most powerful wedge against incumbent creator software. While digital
              download platforms like Gumroad and media subscription platforms like Substack extract steep 10% platform
              take rates plus payment processing fees, Whop charges a standard domestic transaction fee of 2.7% plus
              $0.30. For high-volume sellers generating thousands of dollars per month, this difference saves
              significant capital. Conversely, flat-fee subscription platforms like Skool ($99 monthly) and Kajabi ($149
              to $399+ monthly) impose fixed recurring overhead that penalizes early-stage operators. However,
              high-volume merchants face significant switching costs once recurring subscriber billing is established.
              To neutralize this barrier, Whop provides automated 30-second database migration utilities that allow
              businesses to transfer existing Stripe customer subscriptions directly to Whop's infrastructure.
            claimRefs:
              - CP003
              - CP004
              - CP009
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP004
              - CP009
              - CP010
      - number: '3.4'
        title: Moat Durability, Platform Defensibility, and Displacement Risks
        blocks:
          - type: paragraph
            body: >-
              Despite Whop's rapid commercial growth and attractive headline pricing, its long-term defensibility faces
              operational and regulatory headwinds inherent to high-risk digital merchant-of-record operations.
              Operating as the legal seller of record concentrates payment dispute liability and fraud risk on Whop's
              balance sheet. Public records from the Better Business Bureau document 157 customer complaints over a
              three-year period, with 109 filed in the trailing 12 months alone. These complaints center heavily on
              disputed account freezes, withheld merchant balances, and unverified unauthorized charges. Furthermore,
              because gated community content is largely shielded from search engine crawlers and external AI indexing,
              Whop must continually invest in public marketplace discovery, developer APIs, and crypto-native payout
              infrastructure to maintain creator retention against emerging competitors.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP005
              - CP007
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Architectural MoR Advantage Over Pure SaaS Competitors
            body: >-
              Whop's merchant-of-record foundation and 2.7% + $0.30 transaction pricing offer superior unit economics
              for high-velocity digital product creators compared to 10% platform cuts on Gumroad and Substack, while
              avoiding the steep $149+ monthly SaaS overhead imposed by Kajabi.
            calloutType: strength
            claimRefs:
              - CP003
              - CP004
              - CP005
          - type: callout
            title: Payout Delay and Account Restriction Vulnerabilities
            body: >-
              Consumer dispute volumes and merchant complaints regarding held funds highlight that operating as a
              high-risk digital merchant of record exposes Whop to ongoing platform moderation disputes and regulatory
              friction that pure software platforms avoid.
            calloutType: risk
            claimRefs:
              - CP011
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              Whop monetizes internet commerce through a layered fintech model rather than a recurring software
              subscription. At its foundational payment processing layer, the platform publishes a baseline domestic
              card and wallet rate of 2.7% plus $0.30 per transaction, supplemented by a 10-cent fraud-screening fee.
              Unlike traditional SaaS competitors that charge fixed monthly dues, Whop positions itself as a
              merchant-of-record gateway with zero upfront costs, making onboarding seamless for emerging creators and
              digital operators. Beyond baseline payment processing, Whop captures incremental revenue through
              cross-border payment surcharges (1.5% for international cards and 1% for currency conversion), specialized
              checkout financing rails that charge up to 15%, automated tax collection at 2%, billing automation at
              0.5%, and withdrawal fees that scale up to $23 for bank wires or 5% plus $1.00 for cryptocurrency
              transfers. While this unbundled structure allows low-volume merchants to launch without fixed overhead,
              optional platform features rapidly compound the effective take rate toward 5.3% to 6.2% for high-volume
              course sellers, creating latent margin friction as digital merchants scale.
            claimRefs:
              - CI002
              - CI004
              - CI005
              - CI013
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI005
              - CI013
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI004
              - CI005
              - CI013
      - number: '4.2'
        title: Go-to-Market Motion, Payment Conversion, and Platform Economics
        blocks:
          - type: paragraph
            body: >-
              Whop's customer acquisition strategy blends self-serve viral onboarding with embedded commerce developer
              infrastructure. Rather than relying on a heavy outbound enterprise sales organization, Whop targets
              digital product sellers, software developers, and community managers who migrate from disjointed stacks of
              payment processors, membership plugins, and Discord bots. Whop claims that its network supports over
              27,000 active businesses, delivering an average year-over-year merchant revenue growth of 51%. A central
              driver of this sales efficiency is Whop's smart payment routing engine, which dynamically routes checkout
              transactions across multiple merchant providers to reduce authorization failures, claiming a measurable
              conversion revenue uplift of 6% to 11%. To deepen customer lock-in and expand its distribution footprint,
              Whop has launched integrated advertising and automation surfaces, including Whop Ads for unified Meta
              campaign attribution and Whop CLI for agentic terminal workflows. These software tools shift Whop from a
              passive checkout link provider into an active operational operating system for digital internet
              enterprises.
            claimRefs:
              - CI003
              - CI012
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI010
              - CI011
      - number: '4.3'
        title: Unit Economics, Fee Compounding, and Adverse Friction
        blocks:
          - type: paragraph
            body: >-
              The economic viability of building on Whop diverges sharply depending on merchant transaction velocity and
              product architecture. For sub-scale creators generating under $3,000 monthly, Whop's pay-as-you-sell
              structure is demonstrably cheaper than paying $99 to $299 monthly for fixed SaaS platforms like Kajabi or
              Ruzuku. However, once a creator's monthly digital sales exceed $10,000, Whop's variable fee stack—spanning
              the 2.7% base fee, fixed per-transaction cuts, affiliate network overrides, and marketplace discovery
              splits—compounds aggressively. Independent reviews and creator breakdowns emphasize that large community
              operators face significant margin leakage compared to running a custom Stripe integration on an owned web
              property. Furthermore, merchant sentiment reveals operational vulnerabilities regarding Whop's automated
              risk management. Practitioner feedback and Trustpilot reports highlight recurring complaints regarding
              sudden account freezes, rolling reserves, and delayed payout releases when digital stores experience rapid
              sales velocity spikes. Because Whop operates as the merchant of record, sellers carry counterparty
              dependency on its internal fraud and risk underwriting models.
            claimRefs:
              - CI006
              - CI007
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI014
      - number: '4.4'
        title: Capital Adequacy, Financing Structure, and Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              Whop's balance sheet underwent a major structural expansion in February 2026, when the company secured a
              $200 million strategic investment from stablecoin issuer Tether, establishing a headline post-money
              valuation of $1.6 billion and bringing total disclosed venture backing to $217 million. This strategic
              partnership anchors Whop's long-term push into global borderless liquidity, embedding USDT settlement
              rails to bypass legacy correspondent banking friction and enable 24/7 creator payouts in 145 countries.
              Platform scale disclosures reflect substantial gross throughput, with annualized payment volume reportedly
              exceeding $500 million and cumulative creator earnings claimed at $4.6 billion. However, from an
              institutional underwriting standpoint, Whop presents severe information asymmetry. As a private entity,
              the company has not published audited financial statements substantiating its claimed operational
              profitability, net take rate retention after interchange and network processing costs, or fraud loss
              reserves. Moreover, deep exposure to stablecoin settlement introduces regulatory scrutiny and counterparty
              concentration risks that require rigorous ongoing diligence.
            claimRefs:
              - CI001
              - CI008
              - CI009
              - CI010
              - CI011
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Zero-Subscription Onboarding and High Conversion Payment Infrastructure
            body: >-
              Whop eliminates fixed SaaS barriers by offering zero upfront subscription costs and monetizing purely on
              transaction volume, while capturing high merchant retention through built-in licensing, Discord
              integration, and smart checkout routing.
            calloutType: strength
            claimRefs:
              - CI002
              - CI003
          - type: callout
            title: Fee Stacking Margin Drag and Unaudited Unit Contribution
            body: >-
              As merchant sales scale past $10,000 monthly, stacked add-on percentages (managed tax, billing, and
              affiliate cuts) cause severe margin leakage, while dependence on stablecoin partners introduces
              counterparty and regulatory underwriting risks.
            calloutType: risk
            claimRefs:
              - CI004
              - CI006
              - CI010
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Architecture and Merchant Storefront Experience
        blocks:
          - type: paragraph
            body: >
              Whop operates as an integrated commercial platform and developer API designed to let digital
              entrepreneurs, software creators, and community leaders launch, operate, and monetize internet businesses
              without managing fragmented backend tooling. The core product combines an AI-assisted storefront builder
              with an embeddable application framework and a merchant-of-record payment rail. Merchants create branded
              digital hubs that bundle diverse digital SKUs into unified customer memberships or one-time purchases,
              eliminating the traditional need to stitch together separate point solutions for website hosting,
              paywalled community access, digital download delivery, and billing automation.


              At the storefront layer, Whop enables rapid setup using pre-configured conversion-optimized templates and
              generative setup tooling. Rather than forcing creators to operate separate funnels via third-party landing
              page builders, Whop hosts the entire customer journey from product discovery through checkout and ongoing
              entitlement delivery. The platform supports diverse digital product formats within a single catalog,
              including community access, digital downloads, software licenses, paid courses, masterminds, service
              consulting, and physical merchandise.
