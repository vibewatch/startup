callouts:
  - calloutType: "strength"
    title: "Architectural MoR Advantage Over Pure SaaS Competitors"
    body: "Whop's merchant-of-record foundation and 2.7% + $0.30 transaction pricing offer superior unit economics for high-velocity digital product creators compared to 10% platform cuts on Gumroad and Substack, while avoiding the steep $149+ monthly SaaS overhead imposed by Kajabi."
    claimRefs:
      - "CP003"
      - "CP004"
      - "CP005"
  - calloutType: "risk"
    title: "Payout Delay and Account Restriction Vulnerabilities"
    body: "Consumer dispute volumes and merchant complaints regarding held funds highlight that operating as a high-risk digital merchant of record exposes Whop to ongoing platform moderation disputes and regulatory friction that pure software platforms avoid."
    claimRefs:
      - "CP011"
      - "CP012"
