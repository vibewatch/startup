callouts:
  - calloutType: insight
    title: "Merchant of Record as a Defensive Distribution Moat"
    body: "Whop's competitive advantage in access-based digital commerce stems from its merchant-of-record infrastructure. By assuming merchant liability, global tax collection, and automated fraud/dispute mitigation, Whop captures high-velocity sellers in complex verticals that standard processors like Stripe reject or heavily scrutinize."
    claimRefs:
      - CM002
      - CM005
      - CM006
  - calloutType: risk
    title: "Category Concentration in High-Chargeback Shadow Niches"
    body: "The platform's historical volume concentration in trading indicators, sports picks, and resell communities presents ongoing brand and regulatory vulnerability. While these categories deliver high transaction velocity and lower price sensitivity, they carry heightened risk of dispute surges and processor underwriting pressure."
    claimRefs:
      - CM006
      - CM007
      - CM014
