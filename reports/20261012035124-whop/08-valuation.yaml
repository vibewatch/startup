callouts:
  - calloutType: recommendation
    title: 'Recommendation Stance: Track'
    body: Whop's $1.6B valuation requires sustained rapid net revenue growth and successful expansion into financial services, but unresolved dispute handling and unverified margins counsel holding off on a Buy until audited disclosures become available.
    claimRefs:
      - CV001
      - CV010
      - CV011
  - calloutType: risk
    title: Multiple Compression and Liquidity Overhang
    body: The $200M Series C round represents significant preference overhang, creating downside vulnerability if creator commerce spending decelerates or digital marketplace multiples contract toward public peer averages.
    claimRefs:
      - CV001
      - CV002
      - CV010
