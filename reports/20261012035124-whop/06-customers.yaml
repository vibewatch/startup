figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Key stages of the merchant and buyer lifecycle from discovery to financial expansion.
    claimRefs:
      - CU002
      - CU010
      - CU013
    data:
      items:
        - stage: Discovery & Acquisition
          label: Marketplace & Direct Browsing
          description: >-
            Prospective buyers explore niche digital offerings via Discover marketplace categories, creator social bios,
            or referral links.
          touchpoints:
            - Whop Discover directory
            - Social media bios
            - Affiliate referral links
        - stage: Evaluation & Free Trial
          label: Zero-Risk Buyer Onboarding
          description: >-
            Buyers inspect storefront landing pages, review community ratings, and initiate 1-to-30 day free trials with
            card pre-authorization.
          touchpoints:
            - Storefront landing page
            - Trial checkout popup
            - Anti-abuse trial detection
        - stage: Storefront Creation & App Bundling
          label: No-Code Merchant Configuration
          description: >-
            Creators launch customizable whop hubs and drag-and-drop modular apps such as Chat, Courses, Forums, and
            Digital Downloads.
          touchpoints:
            - Whop App Store
            - Drag-and-drop dashboard
            - Next.js custom app SDK
        - stage: Checkout & Monetization
          label: Multi-Rail Merchant of Record
          description: >-
            Transactions execute across cards, PayPal, BNPL, or crypto wallets with automated tax handling and instant
            access provisioning.
          touchpoints:
            - Embedded checkout element
            - Discord role automation
            - MoR tax calculation
        - stage: Engagement & Community Retention
          label: Lifecycle State Tracking
          description: >-
            Sellers monitor member engagement, renewal status, and churn via analytics widgets segmenting active,
            trialing, and paused users.
          touchpoints:
            - Analytics users widget
            - Native iOS/Android app
            - Chat & community feed
        - stage: Financial Infrastructure & Expansion
          label: Treasury & Balance Yield
          description: >-
            Established businesses transition operating cash flow into Whop Treasury, earning yield and utilizing
            stablecoin payouts.
          touchpoints:
            - Whop Treasury dashboard
            - USDT0 on Plasma blockchain
            - Partner payout routing
    approximationNotes: Stages model the standard merchant-buyer progression described across Whop documentation and seller case studies.
callouts:
  - calloutType: insight
    title: Long-Tail Creator Flywheel vs. Enterprise B2B SaaS
    body: >-
      Whop's zero-barrier monetization engine captures high-velocity, low-commitment solo creators and communities that
      traditional enterprise billing engines underserve, but this model inherits substantial fraud, dispute, and cohort
      volatility risks.
    claimRefs:
      - CU001
      - CU011
      - CU012
  - calloutType: risk
    title: Trust & Support Deficits Threaten High-LTV Merchant Retention
    body: >-
      Aggressive automated fraud flags, locked balances, and AI-only support tiers risk alienating scaling commercial
      merchants who require institutional banking stability and human escalation paths.
    claimRefs:
      - CU008
      - CU009
