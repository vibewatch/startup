company:
  name: "Whop"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Whop is a Brooklyn-based, 2021-founded internet-commerce platform whose public profile now combines marketplace distribution, payments, payouts, compliance, and financial products. A February 2026 Series C is reported at $200 million and a $1.6 billion post-money valuation, but an independent registry shows $1.7 billion and public evidence does not resolve the valuation convention, governance rights, audited financial scale, or current headcount."
sections:
  - id: "identity-and-business-model"
    title: "Identity and Business Model"
    body: >-
      Whop was founded in 2021 and is headquartered in Brooklyn, New York. Its current
      positioning is broader than a digital-product storefront: Whop describes an end-to-end
      API for running an online business, while Tracxn describes integrated infrastructure
      for payments, checkout, product delivery, memberships, access control, and business
      operations. This supports a company identity spanning a marketplace and an operating
      layer for internet businesses rather than a single-purpose checkout product. The model
      reaches courses, software, services, communities, events, physical products, and
      third-party platforms. Because those descriptions are partly company-issued, they
      establish product scope but not audited revenue mix, take rate, profitability, or the
      share of activity attributable to marketplace discovery versus embedded infrastructure.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Leadership and Governance"
    body: >-
      Public founder records require caution. Tracxn names five founders: Zar S, Steven
      Schwartz, Youssef M., Cameron Zoub, and Jack Sharkey. Everything PR instead frames
      Cameron Zoub, Steven Schwartz, and Jack Sharkey as the founding trio, creating a
      definitional conflict rather than a basis for silently excluding two people. A March
      2026 company release identifies Steven Schwartz as CEO and co-founder, but the assigned
      evidence does not establish current executive responsibilities for the other named
      founders, independent directors, board observers, committees, succession planning, or
      investor control rights. Founder-market familiarity may be valuable, yet the absent
      governance record makes key-person concentration and institutional oversight material
      diligence items rather than supportable conclusions.
    claimRefs:
      - "CO004"
      - "CO005"
      - "CO006"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-stakeholders"
    title: "Capitalization and Stakeholders"
    body: >-
      Tracxn reports $217 million of total funding and a $200 million Series C dated February
      25, 2026 at a $1.6 billion post-money valuation. Silicon Valley Invest Club instead
      records a $1.7 billion February 2026 valuation. The difference could reflect source
      quality, rounding, or a different valuation convention; the public pages do not resolve
      it, so $1.6 billion is treated as the better-supported round figure and $1.7 billion as a
      conflicting registry value. Caplight lists earlier Series A, Series B, strategic, and
      venture events but withholds most transaction amounts on its public page. It also names
      Andreessen Horowitz, Bain Capital Ventures, Soma Capital, Zinal Growth, Animal Capital,
      Tether Investments, and SignalFire as investors. None of these sources discloses the
      current cap table, ownership percentages, liquidation preferences, debt, secondaries,
      board rights, or cash available after the financing.
    claimRefs:
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
    tableRefs:
      - "TO003"
  - id: "scale-milestones-and-diligence"
    title: "Scale, Milestones, and Diligence Limits"
    body: >-
      Whop's newsroom claims that people on the platform earn about $4 billion annually across
      145 countries, while its product guide claims more than 22 million monthly buyers.
      These are different metrics with different denominators, and neither is revenue, ARR,
      GMV, audited payout volume, or a customer count. A live Financier Metrics listing with
      eleven reviews illustrates third-party application activity inside the ecosystem but
      cannot establish company-wide seller outcomes. Product expansion is more concrete:
      Whop announced Whop Finance and Whop Treasury on March 25, 2026, extending from payments
      toward balances, yield, and stablecoin-linked infrastructure. Independent commentary
      also notes that content inside gated Whop communities is not indexed by search engines,
      which limits externally observable engagement. The assigned adverse search returned no
      retained result; that absence is not evidence that litigation, outages, regulatory
      action, or leadership churn did not occur.
    claimRefs:
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
    figureRefs:
      - "FO001"
