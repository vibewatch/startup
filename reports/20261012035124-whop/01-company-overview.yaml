callouts:
  - calloutType: "risk"
    title: "Public observability is weaker than platform scale claims"
    body: "Company-issued scale metrics are not audited financial metrics, and independent commentary says gated community content is not indexed by search engines. Diligence should therefore rely on cohort data, processor statements, and governance records rather than treating public reach claims as verified operating performance."
