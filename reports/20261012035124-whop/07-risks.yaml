callouts:
  - calloutType: "risk"
    title: "Partial Merchant of Record Creates Hidden Global Tax Exposure"
    body: "While Whop handles sales tax in the US, EU, and UK for sellers opting into its 0.5% tax add-on, it explicitly disclaims tax collection and remittance in the rest of the world. High-growth creators selling into Latin America or Asia-Pacific retain full direct tax liability, creating unquantified compliance exposure."
    claimRefs:
      - "CR001"
  - calloutType: "risk"
    title: "Grey-Market Product Mix Threatens Upstream Acquiring Stability"
    body: "Whop's roots and continuing volume in sports betting algorithms, sneaker botting software, and content clipping present elevated chargeback and brand-reputation risks. If major card networks or payment processors tighten acceptable use enforcement, Whop faces sudden processor freeze or termination risk."
    claimRefs:
      - "CR005"
      - "CR007"
