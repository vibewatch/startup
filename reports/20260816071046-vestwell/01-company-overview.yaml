    "number": 1,
    "title": "Company Overview",
    "summary": "Vestwell is a New York-based savings-infrastructure fintech founded in 2016 and led by founder-CEO Aaron Schumm. The company now positions itself as the backbone of the modern savings economy, serving 2.55M+ active savers, enabling 750K+ businesses, and administering $56B+ in assets while expanding across retirement, education, emergency, disability, and government programs. Its February 2026 $385M Series E at a $2B valuation validates scale, but the business remains exposed to payroll-distribution concentration, state-program execution, and integration risk as it absorbs the Accrue 401k acquisition and broadens into new savings adjacencies."
  },
  "sections": [
    {
      "id": "identity-and-model",
      "title": "Identity, platform scope, and operating model",
      "body": "Vestwell is a financial technology company headquartered in New York City that provides the infrastructure layer behind workplace and government savings programs rather than acting as a consumer brand first or a chartered bank. The company says its platform powers retirement, education, healthcare, emergency, disability, and student-debt-related savings workflows for employers, advisers, financial institutions, payroll providers, and state agencies. Its product architecture is built around payroll-connected administration, recordkeeping, compliance, investment support, and multilingual participant experiences that can be white-labeled through partners.\n\nThat positioning matters because Vestwell competes less like a single-plan 401(k) startup and more like a horizontal savings middleware provider. Its official materials emphasize 190+ payroll integrations, in-platform plan administration, AI-assisted support, and multilingual service as the core operating rails that let partners distribute savings products without building their own recordkeeping stack. The current company page presents the broadest current operating scale on-record for this run\u20142.55M+ active savers, 750K+ enabled businesses, and $56B+ assets saved across all 50 states\u2014so those are the canonical current scale figures used elsewhere in this report.\n\nThe business model blends software-style administrative fees, participant fees, and asset-based investment-management economics depending on plan type and distribution channel. Official pricing pages show Vestwell monetizes through employer base fees, per-participant fees, and asset-based investment-management fees, while state and institutional programs create additional recordkeeping, custodial, and administrative revenue streams. That diversified model is strategically attractive because it ties revenue to both employer adoption and saver balances, but it also increases dependency on continued payroll connectivity, partner trust, and regulatory execution.",
