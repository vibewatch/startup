    {
      "id": "named-proof",
      "title": "Named customer proof and deployment quality",
      "body": "Vestwell\u2019s named customer proof is unusually specific for a late-stage private company. The strongest examples come from employer case studies. Agape In Home Care says Vestwell helped it reach a 99% participation rate among 71 eligible employees, supported by auto-enrollment, auto-escalation, safe harbor design, and payroll integration with Patriot. Senior Helpers Naperville says Vestwell\u2019s onboarding and payroll integration saved several hours of administrative work each week while improving service quality for nearly 150 caregivers. Solestiss says Vestwell launched its safe harbor 401(k) in 22 days, achieved a 100% participation rate, and made a 6% safe harbor match a key recruiting differentiator.\n\nPartner and channel case studies deepen the picture. Paris International says it launched 11 retirement plans through Vestwell. Smooth 401(k) says it had 19 active and onboarding plans with Vestwell one year into the relationship. Benetech describes Vestwell Flex as a way to streamline recordkeeper\u2013TPA coordination and support business scaling. These cases do not prove universal customer satisfaction, but they do show Vestwell working in production across different buyer types: employers, advisers, and TPAs.\n\nThe limitation is that most named evidence comes from company-hosted or company-aggregated surfaces. That makes the examples highly useful for workflow proof, but weaker for churn or broad satisfaction inference.",
