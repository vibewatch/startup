        "FU004"
      ]
    },
    {
      "id": "customer-verdict",
      "title": "Customer verdict",
      "body": "The overall customer verdict is positive. Vestwell has crossed the threshold where the business can point to real adoption, not just pipeline. Public evidence spans millions of savers, hundreds of thousands of enabled businesses, broad government-program reach, and detailed case studies with measurable outcomes. The case-study set also shows a repeat pattern in why customers choose Vestwell: reduced administrative burden, payroll connectivity, stronger support, faster onboarding, and improved employee participation or recruitment positioning.\n\nWhat public evidence does not yet prove is customer durability at institutional scale. Investors still need to know whether growth is driven by sticky cohorts, short-term migrations, or channel partners that can change terms. They also need to know whether customer satisfaction holds across segments not featured in marketing materials.\n\nIn other words, Vestwell looks like a company with credible production usage and strong customer proof, but not yet one with fully public retention and concentration transparency.",
