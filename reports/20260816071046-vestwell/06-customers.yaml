    {
      "id": "durability-and-concentration",
      "title": "Retention, repeat usage, and concentration blind spots",
      "body": "Vestwell\u2019s public evidence on durability is materially weaker than its evidence on acquisition and deployment. There is no public NRR, GRR, logo churn, renewal-rate, contract-length, or top-customer concentration disclosure in the sources reviewed for this run. Even the better case studies emphasize onboarding ease, service quality, or participation outcomes rather than long-term account retention or revenue expansion over time. FeaturedCustomers provides an encouraging breadth signal\u201424 testimonials, 19 case studies, 18 customer videos, and a 4.8/5 score based on 631 reference ratings\u2014but that still does not substitute for cohort metrics.\n\nThe same caution applies to concentration. State programs and large institutional channels can be strategically valuable, but a few wins can also create operational or political concentration. The advisor and payroll channel strategy likewise boosts scale while potentially increasing dependence on intermediaries. Public sources prove channel diversification exists; they do not prove that economic dependence is low.\n\nAccordingly, the customer story should be graded as strong on breadth and named deployment quality, moderate on satisfaction proxies, and weak on true retention disclosure.",
      "claimRefs": [
        "CU019",
        "CU020",
        "CU021",
        "CU022",
        "CU023",
        "CU024",
        "CU025",
        "CU026"
      ],
