  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "Vestwell\u2019s customer evidence is stronger than the average private fintech because it combines large aggregate scale claims with a meaningful body of named employer, adviser, TPA, and public-program proof. Public sources support a customer base spread across SMB employers, advisor-led plans, payroll-connected channels, government-sponsored programs, and millions of end savers. The strongest evidence comes from named case studies showing concrete administrative or participation outcomes. The weakest area remains retention and concentration: Vestwell does not publicly disclose NRR, GRR, churn, cohort durability, or top-customer exposure by program, payroll, or institutional channel."
  },
  "sections": [
    {
      "id": "customer-base",
      "title": "Customer base segmentation and adoption breadth",
      "body": "Vestwell\u2019s customer base is best segmented by channel rather than by a single buyer archetype. The company serves direct employers seeking retirement or adjacent savings benefits, advisers and TPAs using the platform to scale service delivery, financial institutions embedding or distributing savings products, state agencies administering public programs, and end savers who ultimately use the accounts. Public customer evidence reinforces this breadth: the company page says Vestwell now enables 750,000+ businesses and 2.55M+ active savers, while the 2026 financing announcement still anchors the more conservative historical milestone of 2M+ savers and $50B+ assets. The October 2025 New York Secure Choice launch says Vestwell powers 85% of government retirement programs and 37 government-led savings programs across payroll-deducted IRAs, 529s, and ABLE accounts.\n\nThis breadth is commercially valuable because it creates multiple customer-acquisition routes. Vestwell can win by selling directly to employers, by becoming the operating layer behind advisor and payroll channels, or by winning state-administered programs that onboard many employers and savers under a single mandate. The Amazon DSP pooled employer plan launch shows another variant: a networked segment solution designed for a specific ecosystem of small operators with common needs.\n\nThe main interpretive caution is that aggregate reach does not equal revenue concentration safety. Millions of savers and hundreds of thousands of enabled businesses sound diversified, but public sources do not disclose how much activity or revenue is concentrated in a handful of state programs, payroll connectors, or advisory distribution partners.",
