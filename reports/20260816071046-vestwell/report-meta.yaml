companyProfile:
  summary: >-
    Vestwell is a New York-based fintech founded in 2016 by Aaron Schumm that has evolved from
    retirement-plan administration into broader savings infrastructure spanning workplace plans,
    state-facilitated auto-IRA programs, 529 education savings, ABLE disability savings, and other
    adjacent benefits. Public evidence supports >$200M ARR, profitable growth, 2.55M+ active savers,
    750K+ enabled businesses, and a $2B post-money valuation following a $385M Series E in February
    2026. The company’s strategic edge appears to come from payroll-connected workflows, public-
    program leadership, and partner distribution, while the main unresolved diligence questions center
    on quality-of-revenue, support intensity, and concentration by channel.
  foundedDate: '2016-01-01'
  founders:
    - name: Aaron Schumm
      role: Founder & CEO
      background: >-
        Public face of the company and lead executive across financing, partner, and product-
        expansion announcements.
      claimRefs: [CO009]
  foundingLocation: New York, New York, USA
  headquarters: New York, New York
  productSummary: >-
    Vestwell provides employer retirement-plan administration, state-program infrastructure,
    saver portals, payroll integrations, compliance workflows, and adjacent savings products such as
    529 and ABLE accounts through a configurable, partner-friendly platform.
  customerFocus: >-
    SMB and enterprise employers, financial advisers, TPAs, payroll and benefit partners,
    financial institutions, state agencies, and end savers.
  businessModel: >-
    Recurring employer base fees, participant fees, asset-based investment-management economics,
    and public-sector / partner administration revenue across direct and embedded distribution.
  stage: Series E / unicorn
  fundingStatus: >-
