  disclosureProfile: private-undisclosed
  claimRefs: [CO004, CO009, CO022, CO023, CO024, CV001, CV002, CV006, CI018]
summary:
  headline: >-
    Vestwell is a scaled, category-relevant savings-infrastructure company with a defendable $2B
    public valuation anchor, but the absence of public margin, retention, and concentration detail
    keeps the investment call conditional.
  overallScore: 6.7
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: fair
