  topStrengths:
    - >-
      Public evidence supports rare late-stage fintech scale: >$200M ARR, profitable growth,
      2.55M+ savers, and 750K+ enabled businesses.
    - >-
      Government-program leadership and adjacent-savings breadth create a broader moat than a pure
      SMB 401(k) vendor.
    - >-
      Named customer and partner proofs show real production deployment across employers,
      advisors, TPAs, and public programs.
    - >-
      Blue Owl, Sixth Street, Silver Lake Waterman, and other institutional backers strengthen the
      credibility of the strategic platform narrative.
  topRisks:
    - >-
      Public evidence still does not disclose gross margin, NRR/GRR, or partner concentration, so
      quality-of-revenue remains underwritten by inference rather than proof.
    - >-
      Payroll, advisor, institutional, and public-program channels can create bargaining-power and
      concentration risk even when topline scale looks diversified.
    - >-
      The product promise appears partly service- and workflow-intensive, creating risk that margins
      depend on specialist support more than investors expect.
    - >-
      Regulatory, privacy, and fiduciary complexity can transmit quickly into brand damage if control
      discipline slips.
  unresolvedGaps:
    - Audited or board-level gross margin and contribution-margin disclosure by channel.
    - NRR, GRR, churn, and migration retention across direct, partner, and public-sector cohorts.
    - Top-partner, top-program, and top-customer concentration plus economic terms.
    - Cap-table mechanics, preferences, dilution, and secondary structure around the latest round.
