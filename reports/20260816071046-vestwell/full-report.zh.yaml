      - number: '7.3'
        title: 合作伙伴、人员与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              合作伙伴依赖既是核心战略优势，也是重大风险。Vestwell 通过薪资提供商、金融机构、顾问、TPA 和州机构增长。RIABiz 指出，薪资服务集中度较高，前 50 大公司约占行业总收入的
              70%；这意味着，成功的嵌入式分销策略可能逐步把议价权转移给数量相对较少的合作伙伴。公开来源还显示 Vestwell 与 TIAA、J.P. Morgan
              建立了机构合作，这有助于规模化，但也可能影响产品优先级和经济性。


              人员风险是同一问题更安静的版本。案例研究反复称赞入驻经理、实施专家和客户成功员工。招聘页面显示，公司仍在雇主服务、计划设计、实施、薪资运营、储户服务和工程岗位积极招聘。一方面这是健康信号，说明公司在投入；另一方面也暗示服务质量和专业经验
              对交付模型仍然重要。如果 Vestwell 的自动化没有营销所说的那么完整，人员执行就会变成利润率和扩张风险。


              财务模型风险与披露风险重叠。公司现在看起来资本充足，但公开来源仍没有披露按渠道划分的集中度、按服务层划分的毛利率，或维护广泛集成和支持体系的成本影响。这意味着合作伙伴和人员风险会直接传导到利润率、留存和未来融资风险。
