  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户群分层与采用广度
        blocks:
          - type: paragraph
            body: >-
              Vestwell 的客户群更适合按渠道拆分，而不是归入单一买方画像。公司服务直接寻找退休或相邻储蓄福利的雇主、用平台扩大服务交付的顾问和
              TPA、嵌入或分销储蓄产品的金融机构、管理公共项目的州机构，以及最终使用账户的储户。公开客户证据强化了这种广度：公司页面称 Vestwell 现在支持 750,000+ 家企业和 2.55M+
              名活跃储户，2026 年融资公告则仍锚定更保守的历史里程碑——2M+ 名储户和 $50B+ 资产。2025 年 10 月 New York Secure Choice 上线公告称，Vestwell 承载 85%
              的政府退休项目，并覆盖 37 个政府主导的储蓄项目，横跨薪资扣缴 IRA、529 和 ABLE 账户。


              这种广度有商业价值，因为它创造了多条获客路径。Vestwell 可以直接卖给雇主，也可以成为顾问和薪资渠道背后的运营层，或拿下州管理项目，在单一强制要求下导入大量雇主和储户。Amazon DSP
              集合雇主计划上线展示了另一种变体：面向一组小型运营商的网络化细分解决方案，这些运营商处在同一生态、需求相近。


              主要解读警惕是，汇总触达不等于收入集中度安全。数百万储户和数十万启用企业听起来很分散，但公开来源没有披露多少活动或收入集中在少数州项目、薪资连接器或顾问分销伙伴手中。
