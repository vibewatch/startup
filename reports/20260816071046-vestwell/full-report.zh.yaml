    rows:
      - - 规模、盈利性增长、公共项目领先地位和真实客户证据，支撑一条有力的基础设施投资逻辑。
        - 若证实毛利率高、NRR 强、集中度低，判断会更积极。
      - - 经济性不透明、合作伙伴依赖和服务强度，可能意味着该模型相对高端 SaaS 倍数应打折。
        - 若服务成本低、渠道多元得到证实，反向逻辑会削弱。
      - - $2B 估值有其合理性，因为公司已经跨过有意义的 ARR 和采用门槛。
        - 若发现隐藏流失或低利润渠道组合，最新一轮会显得估值过满。
