      - number: '3.3'
        title: 证明点、切换成本与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              Vestwell 自己的案例研究给出了最清晰的公开证明点，说明客户为什么切换。Senior Helpers Naperville 称，在此前服务商体验不佳后， 切换到 Vestwell
              每周节省了数小时管理时间。Solestiss 称 Vestwell 在 22 天内上线安全港 401(k)，并用 6% 雇主匹配缴款作为招聘差异化。Agape In Home Care 称 Vestwell
              的薪资集成和计划设计在 71 名合资格员工中推动 99% 参与率。这些来源由公司撰写，所以不是独立证明； 但它们有价值，因为暴露了管理层用来竞争的确切购买标准：速度、薪资连接、服务响应和计划设计弹性。


              切换成本有意义，但不是高到无法跨越。服务商一旦连接薪资、参与者数据、缴款工作流和员工沟通，运营惯性就会出现。不过，同一批案例研究也说明护城河并非绝对： 服务层差或实施体验痛，雇主就会切换。Human
              Interest 和 Gusto 都明确营销薪资连接和降低管理负担，说明品类锁定效应来自更顺滑的运营， 而不是不可替代的产品 IP。


              Vestwell 的护城河在竞品更难复制其特定组合时最耐久：公共部门项目、多产品储蓄广度、合作伙伴白标分销和薪资集成密度。在标准化 SMB 退休管理中，
              护城河最不耐久；薪资原生竞品和资金充足的同业可以缩小功能差距，并用定价或分销杠杆压低毛利。这意味着护城河质量因渠道而异， 公司的战略耐久性取决于它能否比竞品商品化底层功能更快地向上移动。
