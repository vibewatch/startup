  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观：毛利率强、集中度低，公共项目和薪资渠道护城河加深，相邻产品盈利扩张。
        - 支持约 $2.8B-$3.4B 股权价值，或相对上一轮有上行空间。
        - 风险在于公开证据高估了耐久性。
        - 需要私下尽调确认收入质量。
      - - 基准：公司很强，但留存、集中度和服务成本上的证据缺口仍有分量。
        - 支持约 $1.9B-$2.4B，接近当前轮次，略有上行。
        - 风险在于投资人为不完整证据付出过高价格。
