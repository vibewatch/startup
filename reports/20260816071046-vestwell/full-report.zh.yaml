chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、平台范围与运营模式
        blocks:
          - type: paragraph
            body: >-
              Vestwell 是一家总部位于纽约市的金融科技公司，提供职场和政府储蓄项目背后的基础设施层，而不是优先做消费者品牌或持牌银行。公司称，
              其平台为雇主、顾问、金融机构、薪资服务商和州级机构提供退休、教育、医疗、应急、残障和学生债务相关储蓄工作流。产品架构围绕接入薪资系统的管理、
              记录保存、合规、投资支持和多语言参与者体验展开，也能通过合作伙伴白标交付。


              这一定位重要，因为 Vestwell 更不像单一计划的 401(k) 初创公司，而更像横向储蓄中间件提供商。官方材料把 190+ 薪资集成、平台内计划管理、 AI
              辅助支持和多语言服务列为核心运营轨道，让合作伙伴不用自建记录保存技术栈也能分销储蓄产品。当前公司页面给出了本轮研究中最宽的已公开运营规模： 2.55M+ 活跃储户、750K+ 已启用企业、覆盖所有 50 个州的
              $56B+ 已储蓄资产；本报告其他部分也以这组数字作为当前规模口径。


              商业模式按计划类型和分销渠道混合了软件式管理费、参与者费用和基于资产的投资管理经济收益。官方定价页显示，Vestwell 通过雇主基础费、
              按参与者计费和基于资产的投资管理费变现；州级和机构项目还带来记录保存、托管和管理收入。多元化模式在战略上有吸引力，因为收入同时绑定雇主采用和储户余额； 但它也让公司更依赖持续的薪资连接、合作伙伴信任和监管执行。
