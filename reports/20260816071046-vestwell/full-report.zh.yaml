      - number: '8.4'
        title: 建议、信心与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              只基于公开信息，正确建议应当是价格自律且有条件。Vestwell
              从概念上可投，实际中也可能可投，但公开记录还不足以支持“任何价格都买”的结论。公司有足够规模、客户证明和融资可信度，值得认真追踪。不过，证据仍在收入质量、毛利率耐久性、合作伙伴集中度和服务强度上留下过多不确定性；没有更多数据，不能称最新估值明显有吸引力。


              因此，最佳立场是只有在完整非公开尽调和条款纪律下才推进。如果管理层能证明健康毛利率、强队列留存、有限集中度和高效支持经济性，围绕最新轮的估值可以被证明合理，甚至可能被超过。否则，投资者应降低入场价、要求更强保护，或把机会放入观察
              / 重新评估类别。


              一句话：公司强，价格有可能合理，但证据还不完整。
