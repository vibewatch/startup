  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              Vestwell 提供宽口径储蓄管理平台，横跨多种账户类型、分销模式和终端用户。在雇主侧，公司打包 401(k)、403(b)、SIMPLE IRA、SEP IRA 和个人计划等职场退休产品。
              在政府侧，它提供面向州支持退休、教育和残障储蓄项目的专用基础设施。在消费者侧，它提供储户门户、多语言支持、移动访问、自动化缴款控制和持续教育。 529 产品页把平台延伸到退休之外，也显示 Vestwell
              的设计逻辑是把开户、薪资缴款、受益人和数字自助服务基础模块复用到相邻储蓄类别。


              这种广度重要，因为 Vestwell 的技术风险不只是“能不能托管一个计划？”，而是“能不能协调多种计划类型、项目规则和用户界面，同时不制造服务摩擦？”
              公开页面反复描述可配置计划设计、合规自动化、自定义品牌和白标交付。这些说法意味着一套模块化配置系统，而不是一次性服务。它们也说明 Vestwell
              的差异化不是单一算法护城河，而是薪资连接、公共项目可配置性、嵌入式合规，以及面向雇主、顾问、机构和储户的用户体验设计组合。


              局限在于，公开材料仍以产品营销为主。证据足以映射模块和工作流角色，却不足以像深度技术尽调那样验证底层代码库边界、API 限流架构、 数据模型隔离或发布治理。
