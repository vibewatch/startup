      - number: '5.3'
        title: 信任、隐私、合规与平台控制
        blocks:
          - type: paragraph
            body: >-
              信任和合规是产品承诺的核心。Vestwell 安全页描述云原生架构、多租户设计、强权限、高可用基础设施、MFA、加密、安全集成和事件驱动数据同步。 隐私政策确认 GLBA 和 CCPA 相关性，并强调
              IRA、ESA 和招聘等特定场景有单独披露。关于服务、支持和安全的支持文章进一步声称定期 SOC 审计、监管银行监督和内部信托公司。结合 Vestwell Advisors 的 SEC
              注册，这些材料支持一个判断：合规不是贴上去的网页， 而是平台真实的市场进入要求。


              不过，公开信任证据仍不完整。Vestwell 没有发布 SOC 报告，本轮抓取材料中也没有公开状态页，且未披露事件历史或量化控制表现。
              “控制存在”和“控制运营成熟”之间的差异，对承保企业和政府部署很重要。公开页面足以认可其严肃性，但不足以清掉所有控制风险问题。


              承保结论是，Vestwell 的信任成熟度高于轻量金融科技外壳，但证据仍不对称：公开控制声明很多，可独立检查的技术材料有限。
