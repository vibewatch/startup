  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Vestwell 所处的是政策密集型金融科技领域。公司的雇主、顾问和公共项目产品都依赖退休计划规则，而这些规则仍在 SECURE 2.0、州强制要求落地、受托责任预期和隐私义务推动下演进。Vestwell
              自己的教育页面强调立法环境变化很快，也强调州强制要求和自动登记规则如何影响计划发起人。其网络安全和诉讼文章同样承认受托风险、费用过高诉讼和服务商审查义务。这说明管理层理解法律复杂性，但也确认公司处在一个规则解释和流程纪律会实质影响结果的品类。


              公开证据还显示，Vestwell 的监管足迹是多层的。Vestwell Advisors 是 SEC 注册投资顾问；安全 / 支持材料提到银行监管监督和一家信托公司；隐私政策援引 GLBA 和
              CCPA。这种广度可以成为护城河，但也意味着合规失败可能横跨多个实体和产品线扩散，而不是被隔离在单点。


              因此，法律风险并不只是“金融科技有监管”。真正的风险是，Vestwell 的增长逻辑依赖于帮助雇主和项目更轻松地合规；一旦控制、披露或流程失败，就会直接冲击价值主张。
