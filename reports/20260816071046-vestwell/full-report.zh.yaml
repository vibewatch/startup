      - number: '1.4'
        title: 反向信号、披露边界与尽调姿态
        blocks:
          - type: paragraph
            body: >-
              Vestwell 增长呈现出一些类似上市公司的信号，但必须与硬财务披露狭窄、分销模式运营复杂并读。Vestwell 在头部层面披露 ARR、储户数量和资产规模，
              却不公开毛利率、队列留存、烧钱速度、客户集中度、实际定价，或州级项目与雇主计划渠道的经济性。SEC IAPD 和 Form ADV 页面有助于确认 Vestwell Advisors 是注册投资顾问，并截至
              December 31, 2025 管理近 $975.6M 非全权委托资产；但这些文件只照亮了更大企业的一小块。


              另一条反向线索是服务与信任。Vestwell 的 BBB 投诉页面确认公开投诉渠道存在；客户评论和第三方合作伙伴页面则显示，公司越来越多地处在受监管、
              接入薪资系统的储蓄工作流中，管理摩擦很快就会变成声誉风险。公司自己的安全 FAQ 强调 SOC 审计、直接信托公司监督和隐私控制，这有帮助； 但也反过来说明，价值主张很大程度上取决于不中断的运营可靠性和数据治理。


              因此，尽调层面，公司概况足以支撑强规模、强动能叙事，却不足以完整承保治理质量、毛利耐久性或集成成功率。这些问题会进入后续章节。 现阶段阅读
              Vestwell，最好把它视为一家已规模化的基础设施提供商：分销触面异常宽，机构验证在改善，但信息不对称仍然明显， 不能在缺少三角验证时就把管理层增长故事视为完全去风险。
