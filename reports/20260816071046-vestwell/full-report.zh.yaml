      - number: '8.3'
        title: 乐观、基准与悲观情景逻辑
        blocks:
          - type: paragraph
            body: >-
              乐观情景假设 Vestwell
              的公开规模指标匹配强劲的隐藏基本面：健康毛利率、低集中度、粘性的公共项目和薪资渠道关系，以及服务和实施成本随平台扩张而递减的证据。在这组假设下，当前估值甚至可能显得保守，尤其当相邻储蓄产品和公共项目领导地位进一步加深护城河时。


              基准情景更克制，也更符合公开证据。它假设公司确实很强，但在把倍数显著推高到最新轮之上前，市场应等待更多关于利润率、留存和集中度的证据。在这种看法下，当前 $2B
              价格可以辩护，但只有当投资者获得信息权或下行保护时才算略有吸引力。


              悲观情景不是“需求消失”，而是隐藏经济摩擦浮出水面：毛利率低于预期、合作伙伴渠道拿走更多经济收益、公共项目或集成复杂性使服务成本居高不下，或迁移队列、合作伙伴主导队列中的留存更弱。在这种情况下，即便公司继续增长，相对上一轮折价也有理由。
