      - - 悲观：渠道依赖、较低利润率或迁移 / 服务复杂度压低盈利质量。
        - 支持约 $1.3B-$1.8B，意味着较最新一轮打折。
        - 风险在于规模掩盖了经济质量偏弱。
        - 如果私下尽调不及预期，会落入该情景。
