  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接、相邻与在位者替代方案
        blocks:
          - type: paragraph
            body: >-
              Vestwell 的竞争集合横跨多类解决方案，把它们当作同质同业组会遮住真实替代动态。最直接的竞争者是聚焦 SMB 的退休计划服务商，例如 Human Interest，以及如今延续 Guideline
              薪资原生定位的 Gusto 401(k) 产品。这些供应商面向首次建计划、小雇主和管理简化， 正是 Vestwell 的 Starter(k)、Workplace 和 Plus
              档位最直接竞争的走廊。Betterment at Work 是相关相邻竞争者，因为它把职场退休管理与数字投顾 DNA 结合在一起，尽管市场重点并不完全相同。


              第二类竞争来自 Fidelity、Vanguard、Empower 和 Voya 等在位职场退休平台。这些公司未必总是首次 SMB 计划最接近的价格点匹配，
              但它们重要，因为它们在更广市场里锚定信任、企业关系和顾问熟悉度。小雇主可以从 Vestwell 类服务商起步；但更大计划发起方、
              顾问或机构合作伙伴如果更看重服务深度、托管信心或品牌认知，仍可能默认选择在位者。因此，Vestwell 既要和争夺同一批新计划队列的同业竞争， 也要对抗能守住更大或更成熟细分市场的在位者。


              第三类是现状和内部自建。雇主可以选择不推出计划，也可以在服务糟糕时仍留在传统服务商，或让薪资和财务团队拼接手工流程。只有买方决定用现代集成产品替代管理痛点后，
              直接竞品竞争才真正开始。这也是为什么薪资原生话术在品类内如此普遍：服务商真正争的是成为“怎样在不增加工作量的情况下提供合规计划？”这个问题最简单的答案， 而不是抽象品牌认知。
