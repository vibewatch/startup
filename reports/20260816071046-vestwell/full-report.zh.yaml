  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现机制
        blocks:
          - type: paragraph
            body: >-
              Vestwell 的公开收入模式不是单一 SaaS 订阅，而是雇主费用、参与者费用和基于资产的经济收益分层混合。最清晰的标价证据来自 Vestwell 雇主对比页：
              Starter(k)、Workplace、Plus 和 Solo(k) 计划收取雇主基础费，雇主计划还收每名参与者每月 $8 的经常性费用，并根据计划类型收取 0.20% 或 0.30%
              的基于资产投资管理费。这个框架意味着至少三根变现杠杆：计划发起方获取、参与者参与和资产积累。产品组合也说明，即便面向零售端的费用不可见， 公共部门、机构和合作伙伴管理渠道也可能有自己的管理经济性。


              这一点重要，因为 Vestwell 显然不是纯粹的“ARR 等于软件席位”业务。February 2026 融资公告把 ARR 定义为年化合同经常性收入，
              并排除非经常性收入，说明管理层自己也把业务视为经常性，但不等同于标准按席位收费的 SaaS 公司。
              公开来源还反复描述，平台通过顾问、薪资服务商、金融机构和政府机构嵌入，意味着部分经济收益可能通过合作伙伴渠道捕获，而不是直接雇主销售。


              收入质量的上行在于费用类型和分销触面的多元化。下行在于不透明：公开材料没有披露收入有多少来自直接雇主、多少来自合作伙伴，参与者付费与雇主付费如何拆分，
              经济收益又有多少依赖资产水平而非固定管理费。这一缺失的结构是承保核心：它决定 >$200M ARR 口径代表的是耐久、低流失的平台收入， 还是更易波动的合同类别组合。
