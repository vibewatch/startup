      - number: '1.3'
        title: 资本形成、规模里程碑与扩张路径
        blocks:
          - type: paragraph
            body: >-
              随着定位扩宽，Vestwell 的资本形成显著提速。December 2023，公司宣布由 Lightspeed 领投的 $125M Series D，Fin Capital、Primary Venture
              Partners、FinTech Collective、Blue Owl 和 HarbourVest 参投。February 2026，公司又完成由 Blue Owl Capital 和 Sixth Street
              Growth 领投的 $385M Series E，累计融资达到 $660M，估值翻倍至 $2B。公司称年经常性收入（ARR）已超过 $200M，并继续盈利增长； 第三方报道还补充称，公司估值较 Series D
              前后报道的约 $1B 水平翻倍。


              规模也随资本同步上行。Vestwell 的 February 2026 官方融资公告称，平台支持 2M+ 活跃储户、管理 $50B+ 资产，并支撑 40+ 政府项目。 最新公司页面随后把这些头部指标提高到
              2.55M+ 活跃储户和 $56B+ 资产，显示 Series E 公告后仍在增长。公司的分销逻辑在 December 2025 Accrue 401k 交易中尤其清晰：该交易增加近 30,000 个退休计划和约
              350,000 名储户，同时保留与 QuickBooks、Rippling、Paylocity、 Deel、Square、OnPay、BambooHR 和由 Check 支撑的平台等服务商的薪资连接关系。


              里程碑时间线也显示出一条战略路径：先在职场退休场景启动并放大，拿下州推动储蓄授权，再把产品广度扩展到教育、应急、残障和学生债务项目，
              最后用收购拓宽接入薪资系统的分销。这个后期基础设施故事是连贯的；但也意味着投资人同时在承保集成、合规、合作伙伴管理和公共部门交付。
