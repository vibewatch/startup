      - number: '2.3'
        title: 增长驱动、约束与市场演进
        blocks:
          - type: paragraph
            body: >-
              三个结构性增长驱动支撑这个品类。第一，美国退休体系的可及性仍供给不足：Pew 报告称，截至 early 2026，15 个州已有活跃 auto-IRA 项目， 超过 1M 工人通过这些项目储蓄超过
              $2.5B；Delaware 相关材料仍把职场可及性描述为未覆盖工人的竞争力和财务安全缺口。第二， 集合雇主计划正从低基数扩张：DOL 的 2025 公告显示，2023 年底已有 142
              家集合计划提供商注册，2022 统计年度有 190 个 PEP 运作， 参与者总数 618,000，说明不想自行管理全部事务的雇主确实在转向共享计划结构。第三，计划发起方经济性正在改善，
              因为薪资原生管理和税收抵免叙事降低了小雇主启动计划的摩擦。


              约束同样真实。同一份 DOL 公告显示 PEP 生态内部高度集中，资产规模前 20% 分位的 PEP 持有全部 PEP 资产的 87%，说明规模经济可能偏向少数
              服务商，并强化赢者拿大部分的动态。雇主惯性仍然很强，因为 IRS 材料仍把 401(k) 设立和维护呈现为多步骤合规工程，竞品话术也持续围绕为
              计划发起方减少多少工作。品类内费用透明度还指向毛利压力：Vestwell、Human Interest 和 Gusto 401(k) 都主打简单定价和自动化管理，这有利于采用；
              但如果产品差异收窄，长期定价权会承压。


              对 Vestwell 而言，最有利的市场演进，是退休、应急储蓄、教育储蓄和州推动项目收敛到一套可复用运营栈。最不利情景则是，公司拿到分销广度，
              却没有足够经济深度，因为薪资和机构合作伙伴控制客户入口，可以强势议价或随着时间替换服务商。
