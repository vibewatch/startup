      - number: '2.4'
        title: 对规模测算、捕获能力与尽调的含义
        blocks:
          - type: paragraph
            body: >-
              实际含义是，Vestwell 的总可用市场（TAM）应该用受约束的规模测算视角建模，而不是套一个巨大市场数字。第一层是宽口径退休资产引力：$47.6T 退休生态证明品类战略重要性。第二层是雇主型 DC
              管理：$13.8T 雇主 DC 资产和 $9.9T 401(k) 资产，定义了软件、合规和记录保存预算附着的核心计划服务池。 第三层是可及性扩张：活跃 auto-IRA 项目、PEP 增长和首次 SMB
              建计划，扩大了可服务的记录和计划数量，即便平均账户余额较小。第四层是相邻品类： 一旦薪资和参与者身份建立，额外储蓄产品可以提升每雇主或每储户收入，而不需要完全另起一套分销引擎。


              即便如此，公司的现实可服务市场（SAM）远小于退休品类头条数字。Vestwell 不是覆盖所有计划规模、拥有企业信任的在位超大型记录保存机构，
              也不是能零成本获取终端储户的消费者目的地。它的经济切入点在复杂度痛、且薪资原生或合作伙伴主导分销能缩短销售摩擦的地方最强。 因此，更合理的范围是首次 SMB
              计划、合作伙伴白标分销、州推动项目和部分计划迁移，而不是整个记录保存版图。


              因此，在任何高信念承保前，尽调需要回答三个市场问题。第一，Vestwell 的增长有多少来自净新品类扩张，多少来自从竞品手中抢份额？第二，
              薪资与机构渠道保留了多少议价权？第三，相邻产品能否显著加深收入，同时不恶化服务复杂度？市场显然很大且仍在扩张，但可投资机会取决于 Vestwell 能以有吸引力的经济性捕获多少增长，而不是品类规模本身。
            claimRefs:
              - CM027
              - CM028
              - CM029
              - CM030
              - CM031
              - CM032
              - CM033
              - CM034
              - CM035
