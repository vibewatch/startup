    approximationNotes: 热力图数值是基于公开来源证据加权后的判断，不是管理层风险评分。
    claimRefs:
      - CR001
      - CR011
      - CR021
      - CR026
      - CR032
      - CR035
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 如果 Vestwell 的运营纪律松动，几项中等风险可能传导为客户、利润率和估值损伤。
    data:
      nodes:
        - id: r1
          label: 监管变化
        - id: r2
          label: 薪资 / 合作伙伴依赖
        - id: r3
          label: 服务与实施压力
        - id: r4
          label: 客户体验 / 留存
        - id: r5
          label: 利润率 / 融资质量
        - id: r6
          label: 估值 / 投资逻辑信心
      edges:
        - from: r1
          to: r3
          label: 增加复杂度
        - from: r2
          to: r4
          label: 渠道摩擦
        - from: r3
          to: r4
          label: 上线 / 支持问题
        - from: r3
          to: r5
          label: 成本压力
        - from: r4
          to: r5
          label: 留存影响
        - from: r5
          to: r6
          label: 重估
    approximationNotes: 展示执行滑坡可能如何沿商业模式传导。
    claimRefs:
      - CR012
      - CR021
      - CR027
      - CR028
      - CR033
      - CR038
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: 关键依赖横跨薪资服务商、监管机构、客户、服务团队和信任控制。
    data:
      nodes:
        - id: d1
          label: 薪资服务商
        - id: d2
          label: 州 / 联邦规则
        - id: d3
          label: 安全与隐私控制
        - id: d4
          label: 实施 / 支持团队
        - id: d5
          label: 合作伙伴与客户
        - id: d6
          label: 可靠合规结果
      edges:
        - from: d1
          to: d6
          label: 数据准确性
        - from: d2
          to: d6
          label: 合规准确性
        - from: d3
          to: d6
          label: 信任
        - from: d4
          to: d6
          label: 执行
        - from: d5
          to: d6
          label: 采用与反馈
        - from: d2
          to: d4
          label: 培训负荷
        - from: d1
          to: d4
          label: 异常处理
    approximationNotes: 依赖关系根据公开工作流和支持证据推断。
    claimRefs:
      - CR015
      - CR018
      - CR024
      - CR026
      - CR031
      - CR039
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 当前判断从规模与证据推到估值可成立性，但经济性披露仍不足，因此停在有条件结论。
    data:
      nodes:
        - id: v1
          label: 规模化 ARR 与盈利增长
        - id: v2
          label: 强客户与市场证据
        - id: v3
          label: $2B 轮融资看起来可成立
        - id: v4
          label: 未披露经济性仍关键
        - id: v5
          label: 只有完整尽调后才推进
      edges:
        - from: v1
          to: v3
          label: 支撑价格
        - from: v2
          to: v3
          label: 支撑价格
        - from: v3
          to: v4
          label: 需要证明
        - from: v4
          to: v5
          label: 有条件结论
    approximationNotes: 捕捉基于证据加权后的逻辑链，而不是统计模型。
    claimRefs:
      - CV001
      - CV002
      - CV011
      - CV031
      - CV032
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 按选定收入倍数支撑选定股权价值所需的隐含 ARR。
    data:
      items:
        - label: $1.5B，8x
          value: 187.5
        - label: $2.0B，8x
          value: 250
        - label: $2.0B，10x
          value: 200
        - label: $2.5B，10x
          value: 250
        - label: $3.0B，12x
          value: 250
    approximationNotes: 数值为用简单公开倍数计算的隐含 ARR，单位为百万美元。
    claimRefs:
      - CV012
      - CV021
      - CV022
      - CV023
      - CV024
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 公开证据支持围绕上一轮融资的合理区间，而不是单一精确点估计。
    data:
      items:
        - label: 悲观情景
          low: 1.3
          mid: 1.55
          high: 1.8
        - label: 基准情景
          low: 1.9
          mid: 2.15
          high: 2.4
        - label: 乐观情景
          low: 2.8
          mid: 3.1
          high: 3.4
        - label: 当前轮融资锚点
          low: 2
          mid: 2
          high: 2
    approximationNotes: 数值为估计股权价值，单位为十亿美元。
    claimRefs:
      - CV013
      - CV021
      - CV022
      - CV023
      - CV024
      - CV030
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 以委员会口径按 1-10 分评估当前机会。
    data:
      items:
        - label: 市场顺风
          value: 8
        - label: 客户证据
          value: 8
        - label: 渠道护城河
          value: 8
        - label: 经济性可见度
          value: 4
        - label: 监管 / 执行风险
          value: 5
        - label: $2B 估值支撑
          value: 7
        - label: 公开证据质量
          value: 5
    approximationNotes: 评分为证据加权判断；低分主要反映经济性缺失，而不是公司质量低。
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV009
      - CV032
