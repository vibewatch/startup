        - 合作伙伴重定价、放慢集成，或改道导流
        - 高
        - 190+ 项集成和多渠道 GTM
        - 经济集中度仍未披露
      - - 州机构 / 项目委员会
        - 公共部门合作伙伴
        - 项目上线和强制计划触达
        - 中等
        - 采购失利或政治风向变化压缩覆盖面
        - 中-高
        - 多州经验和 37 个项目覆盖
        - 政府渠道经济性仍不透明
      - - 机构合作伙伴
        - TIAA、J.P. Morgan 等
        - 分销和产品嵌入
        - 中等
        - 大型合作伙伴主导路线图或经济条款
        - 中
        - 合作伙伴名单多元
        - 各合作伙伴实际量级未知
      - - 顾问 / TPA
        - 分销和服务合作伙伴
        - 获客和服务交付
        - 中等
        - 合作伙伴流失或不满拖慢增长
        - 中
        - 多类合作伙伴和案例研究
        - 合作伙伴队列留存未知
      - - 托管 / 受监管服务商
        - 信托 / 顾问 / 托管服务栈
        - 支撑计划和账户运营
        - Unknown
        - 服务商问题打断合规账户服务
        - 中
        - 分层监督架构
        - 第三方依赖范围未公开
    notes: 合作伙伴风险偏高：渠道杠杆和议价权看得见，但集中度指标看不见。
