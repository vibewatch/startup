        - 外部或内部事件严重性
        - 重大泄露、监管通知或审计失败
        - 暂停判断；要求补救证据
      - - 监管 / 法律执行跑偏
        - 合规错误率或公开批评
        - 州项目反复上线出问题，或出现受托责任投诉
        - 下调承保信心，并复核控制
      - - 合作伙伴集中
