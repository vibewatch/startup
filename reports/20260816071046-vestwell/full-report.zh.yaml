      - number: '4.2'
        title: 公开进展、增长与定价背景
        blocks:
          - type: paragraph
            body: >-
              从收入端看，Vestwell 披露的动能很强。公司 February 2026 Series E 公告称，Vestwell 已超过 $200M ARR 并继续盈利增长。 同一公告和第三方报道把累计融资锚定在
              $660M，并指出 Accrue 401k 收购后规模上了台阶。最新公司页面随后把当前运营快照提高到 2.55M+ 活跃储户、750K+ 已启用企业和 $56B+ 已储蓄资产；收购材料称 Accrue 带来近
              30,000 个退休计划和约 350,000 名储户。


              公开定价背景支持一个判断：Vestwell 正在一个透明、效率导向的细分市场里竞争。Human Interest 和 Gusto 401(k) 都公开围绕降低计划发起方
              管理负担讲费用或工作流叙事，Betterment 也公开把 401(k) 管理放进 SEC 注册投顾框架。这不能证明 Vestwell 是最低成本运营方，
              但说明公司销售所在市场中，买方对价格和运营负担高度敏感。如果能被独立验证，在这种环境下持续盈利会是有意义的质量信号。


              但是，公开披露停在关键财务承保线之前。本轮抓取没有任何来源提供毛利率、EBITDA、自由现金流、按渠道划分的收入结构、净留存率（NRR）、
              每雇主平均收入或按队列划分的服务成本。因此，公开进展足以支撑“规模化平台”叙事，却不足以评估毛利耐久性或模型真实运营杠杆。
