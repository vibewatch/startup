  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入支出
        blocks:
          - type: paragraph
            body: >-
              不能把 Vestwell 按整个美国退休资产基数估值，仿佛所有支出都可转化为可寻址软件收入。相关市场边界从雇主发起的固定缴款管理开始， 尤其是 401(k)、403(b)、集合雇主计划和州级 auto-IRA
              工作流；但它会延伸到相邻储蓄项目，因为薪资、记录保存、合规和参与者服务可以复用在共同基础设施层上。 ICI 数据显示，整体退休体系庞大：截至 March 31, 2026，美国退休资产为
              $47.6T，雇主型固定缴款计划为 $13.8T， 其中仅 401(k) 计划就有 $9.9T。这些资金池重要，因为它们定义了品类的金融引力；但这不等于 Vestwell
              可以在没有计划发起方、合作伙伴或政府分销路径的情况下， 大规模直接变现资产。


              真正属于 Vestwell 功能市场边界的支出，是附着在计划创建与服务上的经常性管理、记录保存、薪资同步、合规、顾问支持和参与者互动层。Vestwell
              官方材料也强化了这一点：公司卖给雇主、顾问、金融机构、薪资服务商和政府机构的是平台基础设施，而不是单纯聚拢终端消费者余额。因此，它更接近嵌入式金融科技基础设施，
              而不是纯资产管理人。这个市场包括与新计划设立、转换、维护、参与者支持及相邻产品相关的软件和服务收入，产品包括应急储蓄、学生债务福利、529 项目、 ABLE 账户和州发起退休项目。


              Vestwell 核心市场边界应排除基金发起方的投资产品制造收入、与储蓄无关的通用 HR 软件预算，以及处在职场或州推动储蓄渠道之外的家庭金融资产。 这些排除很重要，因为它们防止“巨大
              TAM”的误导叙事，把尽调视角拉回 Vestwell 真正能捕获预算的地方：接入薪资系统的雇主采用、 合作伙伴白标分销和公共部门项目管理。
