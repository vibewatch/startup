      - number: '6.3'
        title: 留存、重复使用与集中度盲点
        blocks:
          - type: paragraph
            body: >-
              Vestwell 关于耐久性的公开证据明显弱于获客和部署证据。审阅来源中没有公开
              NRR、GRR、客户数流失率、续约率、合同期限或头部客户集中度披露。即便较好的案例研究，也强调入驻便利、服务质量或参与结果，而不是长期账户留存或收入随时间扩张。FeaturedCustomers
              提供了一个令人鼓舞的广度信号——24 条客户证言、19 个案例研究、18 个客户视频，以及基于 631 个参考评分的 4.8/5 评分——但这仍不能替代队列指标。


              同样警惕也适用于集中度。州项目和大型机构渠道有战略价值，但少数大单也可能带来运营或政治集中。顾问和薪资渠道策略同样能放大规模，却可能提高对中介的依赖。公开来源证明渠道多元化存在；它们没有证明经济依赖很低。


              因此，客户故事应在广度和具名部署质量上评为强，在满意度代理指标上评为中等，在真实留存披露上评为弱。
