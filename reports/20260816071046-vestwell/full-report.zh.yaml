      - number: '6.4'
        title: 客户结论
        blocks:
          - type: paragraph
            body: >-
              总体客户结论偏正面。Vestwell 已越过可以指向真实采用的门槛，而不只是销售管线。公开证据覆盖数百万储户、数十万启用企业、广泛政府项目触达，以及带有可量化结果的详细案例研究。案例集还反复显示客户选择
              Vestwell 的原因：降低行政负担、打通薪资、更强支持、更快入驻，以及改善员工参与率或招聘定位。


              公开证据尚未证明的是机构规模下的客户耐久性。投资者仍需知道，增长是由粘性队列、短期迁移，还是可能调整条款的渠道伙伴推动。他们还需要知道，未出现在营销材料中的细分客户是否同样满意。


              换句话说，Vestwell 像是一家已有可信生产使用和强客户证明的公司，但公开留存和集中度透明度还不完整。
