      - number: '2.2'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方地图异常多边。职场计划中，直接买方通常是雇主或计划发起方，运营用户是 HR / 薪资管理员，终端用户是员工储户，经济付款方则混合了雇主基础费、 参与者费用和基于资产的经济收益。州级 auto-IRA
              项目中，买方是州级委员会或财政职能，运营用户仍是雇主协办方，终端用户同样是员工储户。 顾问和金融机构渠道中，Vestwell 可以作为底层平台，买方是希望分销储蓄产品、但不愿自建现代记录保存基础设施的合作机构。


              公开来源说明了为什么 SMB 和首次建计划人群重要。Vestwell 官方定价和产品页明确围绕首次计划发起方、计划迁移和自雇用户设计；IRS 材料则强调， 即便是标准 401(k)
              结构，计划发起方也要处理大量合规决策和维护任务。Human Interest 与 Gusto 401(k) 的竞品定价页同样强调薪资同步、
              合规减负和简单上线引导，说明市场真实购买触发点不是抽象的“退休投资”，而是让本来会推迟或避免提供计划的雇主把管理复杂度降下来。


              因此，采用路径由工作流驱动。计划发起方必须决定提供或更换计划、接入薪资、选择合规设计、引导储户上线，并让计划月复一月低摩擦运转。嵌入式薪资分销显著降低了这段旅程的复杂度。 Vestwell 近 200
              个薪资集成、Gusto 对“内置于薪资的退休方案”的话术、Human Interest 强调 600+ 薪资集成，都指向同一条品类真相： 最重要的采用杠杆不是品牌广告，而是移除薪资与储蓄管理之间的运营步骤。
