      - number: '3.2'
        title: 能力与定价对比
        blocks:
          - type: paragraph
            body: >-
              按标价看，Vestwell 仍有竞争力，但并非显然不可触碰。Vestwell 官方对比页显示，价格阶梯从 Starter(k) 每月 $49 加每名活跃参与者 $8、 0.20% 基于资产费用，到
              Workplace $125、Plus $175，以及 Solo(k) $45 加 0.30% 基于资产费用。Human Interest 定价页显示三档服务， 每员工费用为 $5、$7 和
              $9，另加基于资产费用；Gusto 401(k) 则强调薪资原生自动化，以及一个已支撑 40,000+ 小企业计划的平台。
              品类结论是，没有服务商能只靠不透明度；计划发起方已被训练成同时比较费用、薪资连接和管理负担。


              能力广度是 Vestwell 最好的进攻话术。公司把标准职场退休计划与州级项目管理、教育储蓄、应急储蓄、残障储蓄和多语言支持放在同一平台上。
              这种广度重要，因为它让顾问、机构和薪资合作伙伴有更多方式复用同一套运营基础设施。Human Interest 用 600+ 薪资集成和重度合规外包回应。 Gusto 401(k)
              用一个原生体验把薪资到退休的工作流折叠起来。Betterment at Work 用注册投资顾问可信度和数字投顾传承回应，而在位者 则用信任、参与者规模和计划发起方熟悉度回应。


              因此，能力矩阵没有指向一个通用赢家。买方看重跨产品储蓄广度、州级项目可信度和现代化薪资连接管理时，Vestwell 最强；买方主要在意最低摩擦的薪资原生性或 在位者信任时，Vestwell
              更脆弱。换句话说，Vestwell 的差异化真实存在，但按细分市场生效，并非绝对。
