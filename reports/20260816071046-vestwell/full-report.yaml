      - number: '2.2'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is unusually multi-sided. For workplace plans, the immediate buyer is generally the employer
              or plan sponsor, the operational user is the HR/payroll administrator, the end user is the employee saver,
              and the economic payer is a blend of employer base fees, participant fees, and asset-based economics. For
              state auto-IRA programs, the buyer is a state board or treasury function, the operational user remains the
              employer facilitator, and the end user is again the employee saver. For adviser and financial-institution
              channels, Vestwell can function as an underlying platform whose buyer is a partner institution that wants
              to distribute savings products without building its own modern recordkeeping infrastructure.


              Public sources show why the SMB and first-time-plan segment matters. Vestwell’s official pricing and
              product pages are explicitly designed around first-time plan sponsors, plan transfers, and self-employed
              users, while IRS materials underscore how many compliance decisions and maintenance tasks plan sponsors
              must navigate even in standard 401(k) structures. Competitor pricing pages from Human Interest and Gusto
              401(k) similarly emphasize payroll sync, compliance relief, and simple onboarding, which indicates the
              market’s real purchase trigger is not “retirement investing” in the abstract but administrative
              simplification for employers that would otherwise delay or avoid offering a plan.


              The adoption path is therefore workflow-led. A sponsor must decide to offer or change a plan, connect
              payroll, choose a compliant design, onboard savers, and then keep the plan operating with low friction
              month after month. Embedded payroll distribution materially reduces the complexity of that journey. That
              is why Vestwell’s nearly 200 payroll integrations, Gusto’s pitch around retirement built into payroll, and
              Human Interest’s emphasis on 600+ payroll integrations all point to the same category truth: the most
              important adoption lever is not brand advertising but removing operational steps between payroll and
              savings administration.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
