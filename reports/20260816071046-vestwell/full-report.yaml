      - number: '4.2'
        title: Public traction, growth, and pricing context
        blocks:
          - type: paragraph
            body: >-
              At the top line, Vestwell’s disclosed momentum is strong. The company’s February 2026 Series E
              announcement says Vestwell has surpassed $200M in ARR and continues to grow profitably. The same
              announcement and third-party coverage anchor total capital raised at $660M and point to a step-up in scale
              after the Accrue 401k acquisition. The latest company page has since moved the current operating snapshot
              to 2.55M+ active savers, 750K+ enabled businesses, and $56B+ assets saved, while acquisition materials say
              nearly 30,000 retirement plans and roughly 350,000 savers were added through Accrue.


              Public pricing context supports the idea that Vestwell is competing in a transparent, efficiency-oriented
              segment. Human Interest and Gusto 401(k) both expose fee or workflow narratives centered on reducing
              sponsor admin burden, and Betterment publicly frames 401(k) administration within an SEC-registered advice
              wrapper. This does not prove Vestwell is the lowest-cost operator, but it does show the company is selling
              into a market where buyer scrutiny on price and operational lift is high. Sustained profitability in that
              environment would be a meaningful quality signal if independently verified.


              However, the public disclosures stop before the key financial-underwriting line. No fetched source
              provides gross margin, EBITDA, free cash flow, revenue mix by channel, net revenue retention, average
              revenue per employer, or cost-to-serve by cohort. As a result, public traction is strong enough to support
              a “scaled platform” narrative but not sufficient to assess margin durability or the true operating
              leverage of the model.
