      - number: '8.3'
        title: Bull, base, and bear scenario logic
        blocks:
          - type: paragraph
            body: >-
              The bull case assumes Vestwell’s public scale metrics are matched by strong hidden fundamentals: healthy
              gross margins, low concentration, sticky public-program and payroll-channel relationships, and evidence
              that service and implementation costs taper as the platform scales. Under that set of assumptions, the
              current valuation could even look conservative, particularly if adjacent-savings products and
              public-program leadership deepen the moat.


              The base case is more restrained and, on public evidence, more realistic. It assumes the company is
              genuinely strong but that the market should wait for better proof on margins, retention, and concentration
              before expanding the multiple materially above the latest round. In that view, the current $2B price is
              defendable but only modestly attractive unless investors gain information rights or downside protection.


              The bear case is not “demand disappears.” It is that hidden economic frictions surface: gross margins are
              lower than expected, partner channels take more economics, public-program or integration complexity keeps
              service costs elevated, or retention is weaker in migrated or partner-led cohorts. In that world, a
              discount to the last round becomes justified even if the company continues growing.
            claimRefs:
              - CV021
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
