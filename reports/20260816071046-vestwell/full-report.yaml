      - number: '3.3'
        title: Proof, switching costs, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Vestwell’s own case studies provide the clearest public proof points on why customers switch. Senior
              Helpers Naperville says switching to Vestwell saved hours per week on administration after a poor
              prior-provider service experience. Solestiss says Vestwell launched a safe harbor 401(k) in 22 days and
              used a 6% match as a recruiting differentiator. Agape In Home Care says Vestwell’s payroll integration and
              plan design drove a 99% participation rate among 71 eligible employees. These are company-authored
              sources, so they are not independent proof, but they are valuable because they expose the exact buying
              criteria management is using to compete: speed, payroll connectivity, service responsiveness, and plan
              design flexibility.


              Switching costs are meaningful but not prohibitive. Once a provider is connected to payroll, participant
              data, contribution workflows, and employee communications, there is operational inertia. However, the same
              case studies show why that moat is not absolute: employers do switch when the service layer is poor or
              implementation feels painful. Human Interest and Gusto both explicitly market payroll connectivity and
              reduced admin burden, which suggests that the category’s lock-in comes from smoother operations rather
              than from irreplaceable product IP.


              Vestwell’s moat is most durable where competitors have a harder time matching its specific combination of
              public-sector programs, multi-product savings breadth, partner-white-label distribution, and payroll
              integration density. The moat is least durable in vanilla SMB retirement administration, where
              payroll-native competitors and well-funded peers can narrow feature gaps and use pricing or distribution
              leverage to pressure margins. That means moat quality varies by channel, and the company’s strategic
              durability depends on moving up the stack faster than competitors can commoditize the bottom end.
            claimRefs:
              - CP018
