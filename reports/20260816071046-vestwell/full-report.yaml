      - number: '2.4'
        title: Implications for sizing, capture, and diligence
        blocks:
          - type: paragraph
            body: >-
              The practical implication is that Vestwell’s TAM should be modeled with constrained sizing lenses rather
              than a single giant market number. One lens is broad retirement-asset gravity: a $47.6T retirement
              ecosystem legitimizes the strategic importance of the category. A second lens is employer-based DC
              administration: $13.8T in employer DC assets and $9.9T in 401(k) assets define the core plan-servicing
              pool where software, compliance, and recordkeeping budgets attach. A third lens is access expansion:
              active auto-IRA programs, PEP growth, and first-time SMB plan formation expand the number of records and
              plans that can be served even when average account balances are small. A fourth lens is adjacency: once
              payroll and participant identity are established, additional savings products can improve revenue per
              employer or per saver without requiring a wholly separate distribution engine.


              That said, the company’s realistic SAM is much smaller than the retirement category headlines, because
              Vestwell is not an incumbent megarecordkeeper with enterprise trust at every plan size, nor is it a
              consumer destination with zero-cost acquisition of end savers. Its economic wedge is strongest where
              complexity is painful and payroll-native or partner-led distribution can shortcut sales friction. That
              points toward first-time SMB plans, partner-white-labeled distribution, state-facilitated programs, and
              selected plan transfers rather than the entire recordkeeping landscape.


              Diligence therefore needs to answer three market questions before any high-conviction underwriting. First,
              what percentage of Vestwell’s growth comes from net-new category expansion versus share gain from
              competitors? Second, how much bargaining power do payroll and institutional channels retain? Third, can
              adjacent products materially deepen revenue without degrading service complexity? The market is clearly
              large and still expanding, but the investable opportunity depends on how much of that growth Vestwell can
              capture at attractive economics rather than on category size alone.
            claimRefs:
              - CM027
              - CM028
              - CM029
              - CM030
              - CM031
              - CM032
              - CM033
              - CM034
              - CM035
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The best market lens is not retirement assets but friction removed
            body: >-
              Category winners are selling simplification to sponsors and partners; the asset pool matters, but adoption
              turns on who removes setup, payroll, and compliance work most effectively.
            calloutType: insight
            claimRefs:
              - CM010
              - CM013
              - CM021
          - type: callout
            title: Category breadth can hide weak economic capture
            body: >-
              A giant retirement TAM does not guarantee attractive software economics if payroll platforms, advisers, or
              state boards control distribution and negotiate down take rates.
            calloutType: risk
            claimRefs:
              - CM024
              - CM025
              - CM035
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct, adjacent, and incumbent alternatives'
        blocks:
          - type: paragraph
            body: >-
              Vestwell’s competitive set spans several different solution classes, and treating them as one homogeneous
              peer group would hide the actual substitution dynamics. The most direct competitors are SMB-focused
              retirement-plan providers such as Human Interest and the Gusto 401(k) product now carrying forward
              Guideline’s payroll-native positioning. These vendors target first-time plans, smaller employers, and
              administrative simplification, which is the same corridor where Vestwell’s Starter(k), Workplace, and Plus
              tiers compete most directly. Betterment at Work is a relevant adjacent competitor because it combines
              workplace retirement administration with digital-advice DNA, even if its market emphasis is not identical.


              The second competitive class is incumbent workplace-retirement platforms such as Fidelity, Vanguard,
              Empower, and Voya. These firms are not always the closest price-point match for a first-time SMB plan, but
              they matter because they anchor trust, enterprise relationships, and advisor familiarity across the
              broader market. A small employer may start with a Vestwell-like provider, yet a larger sponsor, advisor,
              or institutional partner can still default to an incumbent if service depth, custody confidence, or brand
              recognition outweigh software modernity. Vestwell therefore competes both against peers trying to win the
              same new-plan cohorts and against incumbents that can defend larger or more established segments.


              The third class is status quo and internal build. Employers can choose not to launch a plan, can keep a
              legacy provider despite bad service, or can rely on payroll and finance teams to stitch together manual
              processes. The direct-competitor fight only begins after the buyer has decided to replace administrative
              pain with a modern, integrated product. This is why payroll-native messaging is so pervasive across the
              category: providers are really competing to become the easiest answer to “how do we offer a compliant plan
              without creating more work?” rather than to win abstract brand awareness.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
