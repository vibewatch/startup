      - number: '8.2'
        title: Current pricing context and comparable anchors
        blocks:
          - type: paragraph
            body: >-
              Vestwell’s February 2026 Series E set the clearest public valuation anchor: $385M raised at a $2B
              post-money valuation, with the company saying it had surpassed $200M in ARR and was growing profitably. A
              simple implied revenue multiple on those public figures lands at approximately 10x ARR or less. That is
              not obviously aggressive for a scaled, category-leading fintech infrastructure company if margins and
              retention are strong. It is also not obviously conservative if service intensity, partner dependence, or
              concentration are high.


              Public comparables offer only directional help, but they matter. Human Interest reportedly reached a $3B
              valuation in late 2025 after raising $100M. Betterment’s 2024 financing valued it at $1.3B. Guideline’s
              2021 valuation was $1.15B, and Finovate estimated roughly $851M in 2025 after valuation compression,
              around the time Gusto agreed to acquire it. These are imperfect comps because business mix, distribution,
              balance-sheet structure, and profitability differ. Still, they bracket a useful point: Vestwell’s $2B
              valuation sits above older or more compressed SMB-retirement peers but below the most ambitious modern
              retirement-tech private marks.


              That comp picture is broadly supportive rather than decisive. It says Vestwell is priced like a strong
              scaled asset, not like a category outlier. But public comparables do not solve the key question of whether
              the company’s hidden economics deserve a premium or a discount to those marks.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
