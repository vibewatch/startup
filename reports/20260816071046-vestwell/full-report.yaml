      - number: '5.3'
        title: Trust, privacy, compliance, and platform controls
        blocks:
          - type: paragraph
            body: >-
              Trust and compliance are central to the product promise. Vestwell’s security page describes cloud-native
              architecture, multi-tenant design, robust permissions, high-availability infrastructure, MFA, encryption,
              secure integrations, and event-driven data syncing. The privacy policy confirms GLBA and CCPA relevance
              and highlights separate disclosures for certain IRA, ESA, and recruiting contexts. The support article on
              service, support, and security goes further by claiming regular SOC audits, regulatory bank oversight, and
              an in-house trust company. Combined with SEC registration of Vestwell Advisors, these materials support
              the view that compliance is not a bolt-on webpage but a real go-to-market requirement for the platform.


              That said, public trust evidence is still incomplete. Vestwell does not publish its SOC reports, does not
              provide a public status page in the fetched materials, and does not disclose incident history or
              quantified control performance. The difference between “control exists” and “control is operationally
              mature” matters for underwriting enterprise and government deployments. Public pages provide enough to
              credit seriousness, but not enough to clear every control-risk question.


              The underwriting takeaway is that Vestwell has higher trust maturity than a lightweight fintech wrapper,
              but the evidence remains asymmetrical: public control claims are abundant, independently inspectable
              technical artifacts are limited.
