  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization mechanics
        blocks:
          - type: paragraph
            body: >-
              Vestwell’s public revenue model is a layered blend of employer fees, participant fees, and asset-based
              economics rather than a single SaaS subscription. The clearest list-pricing evidence comes from Vestwell’s
              employer comparison page, which shows employer base fees for Starter(k), Workplace, Plus, and Solo(k)
              plans, a recurring $8 monthly participant fee for employer plans, and asset-based investment-management
              fees of 0.20% or 0.30% depending on plan type. That framing implies at least three monetization levers:
              sponsor acquisition, participant participation, and asset accumulation. The product mix also suggests that
              public-sector, institutional, and partner-admin channels may carry their own administrative economics even
              when retail-facing fees are not visible.


              This matters because Vestwell is not obviously a pure “ARR equals software seats” business. The February
              2026 financing announcement defines ARR as contracted recurring revenue annualized and excluding
              non-recurring revenue, which indicates management itself views the business as recurring but not identical
              to a standard seat-based SaaS company. Public sources also repeatedly describe the platform as embedded
              through advisers, payroll providers, financial institutions, and government agencies, which implies that
              some economics may be captured through partner channels rather than direct employer sales.


              The revenue-quality upside is diversification across fee types and distribution surfaces. The downside is
              opacity: public materials do not reveal how much revenue comes from direct employers versus partners, how
              participant-paid versus employer-paid fees split, or how much of the economics depend on asset levels
              versus fixed administrative fees. That missing mix is central to underwriting whether the >$200M ARR claim
              reflects durable, low-churn platform revenue or a more volatile blend of contract categories.
