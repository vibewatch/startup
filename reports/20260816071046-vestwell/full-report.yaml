      - number: '1.4'
        title: Adverse signals, disclosure limits, and diligence posture
        blocks:
          - type: paragraph
            body: >-
              The public-company style signals around Vestwell’s growth should be balanced against the narrowness of its
              hard financial disclosure and the operational complexity of its distribution model. Vestwell discloses
              ARR, saver counts, and assets at headline level, but it does not publicly disclose gross margin, cohort
              retention, burn, customer concentration, realized pricing, or the economics of state-program versus
              employer-plan channels. The SEC IAPD and Form ADV surfaces help confirm that Vestwell Advisors is a
              registered investment adviser with nearly $975.6M in non-discretionary assets under management as of
              December 31, 2025, but those filings illuminate only a slice of the broader enterprise.


              The other adverse lens is service and trust. Vestwell’s BBB complaints page confirms that a public
              complaint channel exists, while customer-review and third-party partner pages show a company that
              increasingly sits in the middle of regulated, payroll-connected savings workflows where administrative
              friction can quickly become reputational risk. The company’s own security FAQ highlights SOC audits,
              direct trust-company oversight, and privacy controls, which is helpful, but also underscores how much of
              the value proposition depends on uninterrupted operational reliability and data stewardship.


              For diligence, that means the company overview can support a strong scale-and-momentum narrative, but not
              a full underwrite on governance quality, margin durability, or integration success. Those issues move into
              later chapters. The right way to read Vestwell at this stage is as a scaled infrastructure provider with
              unusually broad distribution surfaces and improving institutional validation, but with material
              information asymmetry that still requires triangulation before treating management’s growth story as fully
              de-risked.
            claimRefs:
              - CO028
              - CO029
              - CO030
              - CO031
              - CO032
              - CO033
              - CO034
              - CO035
