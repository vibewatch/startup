      - number: '3.2'
        title: Capability and pricing comparison
        blocks:
          - type: paragraph
            body: >-
              On list pricing, Vestwell remains competitive but not obviously untouchable. Vestwell’s official
              comparison page shows a ladder from Starter(k) at $49 per month plus $8 per active participant and 0.20%
              asset-based fees, to Workplace at $125, Plus at $175, and Solo(k) at $45 plus 0.30% asset-based fees.
              Human Interest’s pricing page shows three service tiers with per-employee fees of $5, $7, and $9 plus
              asset-based fees, while Gusto 401(k) emphasizes payroll-native automation and a platform that already
              powers more than 40,000 small-business plans. The category takeaway is that no provider can rely on
              opacity alone; plan sponsors are being trained to compare fees, payroll connectivity, and administrative
              burden together.


              Capability breadth is where Vestwell makes its best offensive pitch. The company pairs standard workplace
              retirement plans with state-program administration, education savings, emergency savings, disability
              savings, and multilingual support across a single platform. That breadth matters because it gives
              advisers, institutions, and payroll partners more ways to reuse the same operating infrastructure. Human
              Interest counters with 600+ payroll integrations and heavy compliance outsourcing. Gusto 401(k) counters
              by collapsing the payroll-to-retirement workflow into one native experience. Betterment at Work counters
              with registered-investment-adviser credibility and a digital-advice heritage, while incumbents counter
              with trust, participant scale, and broad sponsor familiarity.


              The capability matrix therefore does not point to a single universal winner. Vestwell looks strongest when
              a buyer values cross-product savings breadth, state-program credibility, and modern payroll-connected
              administration; it looks more vulnerable when a buyer cares mostly about lowest-friction payroll nativity
              or incumbent trust. In other words, Vestwell’s differentiation is real, but it is segment-specific rather
              than absolute.
            claimRefs:
              - CP009
