      - number: '7.2'
        title: Operational, quality, and security risks
        blocks:
          - type: paragraph
            body: >-
              Operationally, the highest-risk surfaces are payroll connectivity, data protection, migration reliability,
              and service scalability. Vestwell repeatedly markets 190+ payroll integrations, multilingual support,
              secure data handling, and a service-heavy onboarding model. Those are selling points, but they also create
              complex failure modes: a payroll mapping error can affect contributions, a communication lapse can slow
              plan launches, a state-program issue can create public scrutiny, and a breach could expose sensitive
              personal and financial data across many savers.


              The company’s public security pages are reassuring in tone. They describe defense-in-depth controls,
              encryption, MFA, monitoring, logging, disaster recovery exercises, independent audits, and penetration
              testing. Still, the public evidence is mostly self-reported. There is no public incident ledger, public
              status page in the fetched materials, or published SOC package. That leaves a meaningful verification gap
              between “control posture sounds serious” and “control performance is proven over time.”


              The operational takeaway is that Vestwell’s execution risks are knowable and probably manageable, but only
              if the company has genuinely strong engineering, QA, change management, and incident response discipline
              beneath the marketing layer.
            claimRefs:
              - CR011
