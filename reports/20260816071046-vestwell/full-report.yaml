      - number: '7.4'
        title: Mitigations, residual exposure, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Vestwell does have visible mitigants. The company publishes detailed security language, highlights
              independent audits and penetration testing, supports regulatory and trust structures, and appears willing
              to invest in product, service, and partner-specific packaging. It also benefits from diversification
              across employer, public-sector, and institutional routes to market. None of that eliminates risk, but it
              lowers the probability that a single issue instantly destroys the business.


              Residual exposure remains material because several risks are correlated. Regulatory complexity raises
              service burden; service burden raises people dependency; people dependency can pressure margins; partner
              concentration can reduce pricing power; and any customer-visible control failure can damage the
              trust-based brand. The risk question is therefore whether Vestwell’s operating discipline has outpaced the
              complexity of the network it now manages.


              The thesis breaks only if the company cannot keep complexity under control. Warning signs would include
              major security incidents, regulatory criticism, visible migration failures, partner concentration
              surprises, or evidence that gross margins rely on unsustainably heavy service layers.
            claimRefs:
