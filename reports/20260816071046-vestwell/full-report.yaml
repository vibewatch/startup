  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and module map
        blocks:
          - type: paragraph
            body: >-
              Vestwell delivers a broad savings-administration platform that spans multiple account types, distribution
              models, and end users. On the employer side, the company packages workplace retirement products such as
              401(k), 403(b), SIMPLE IRA, SEP IRA, and solo plans. On the government side, it presents purpose-built
              infrastructure for state-backed retirement, education, and disability savings programs. On the consumer
              side, it offers saver-facing portals, multilingual support, mobile access, automated contribution
              controls, and ongoing education. The 529 product page extends the platform beyond retirement and shows
              that Vestwell’s design logic is to reuse account-opening, payroll contribution, beneficiary, and digital
              self-service primitives across adjacent savings categories.


              That breadth matters because Vestwell’s technology risk is not simply “can it host a plan?” but “can it
              coordinate many plan types, program rules, and user surfaces without creating service friction?” Public
              pages repeatedly describe configurable plan design, compliance automation, custom branding, and
              white-label delivery. Those claims imply a modular configuration system rather than one-off services. They
              also suggest Vestwell’s differentiation is not a single algorithmic moat, but a combination of payroll
              connectivity, public-program configurability, embedded compliance, and user-experience design for
              employers, advisers, agencies, and savers.


              The limitation is that public materials remain product-marketing heavy. There is enough evidence to map
              modules and workflow roles, but not enough to verify underlying codebase boundaries, API rate
              architecture, data-model isolation, or release governance in the way a deep technical diligence process
              would require.
