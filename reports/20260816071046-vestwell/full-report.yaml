      - number: '2.3'
        title: Growth drivers, constraints, and market evolution
        blocks:
          - type: paragraph
            body: >-
              Three structural growth drivers support the category. First, the U.S. retirement system remains
              undersupplied on access: Pew reports that by early 2026 fifteen states had active auto-IRA programs and
              more than one million workers had already saved over $2.5B through these programs, while Delaware-specific
              materials still frame workplace access as a competitive and financial-security gap for uncovered workers.
              Second, pooled employer plans are scaling from a low base: the DOL’s 2025 bulletin shows 142 pooled plan
              providers registered by the end of 2023, 190 PEPs in operation in statistical year 2022, and 618,000 total
              participants, illustrating a genuine institutional move toward shared-plan structures for employers that
              do not want to manage everything themselves. Third, sponsor economics are improving because payroll-native
              administration and tax-credit framing reduce the friction of launching plans for smaller employers.


              The constraints are just as real. The same DOL bulletin shows concentration inside the PEP ecosystem, with
              the top 20th percentile of PEPs holding 87% of all PEP assets, which suggests scale economics can favor a
              small set of providers and intensify winner-take-most dynamics. Employer inertia remains substantial
              because IRS materials still present 401(k) setup and maintenance as a multi-step compliance exercise, and
              competitor messaging continues to center on how much work they remove from sponsors. Fee transparency
              across the category also points to margin pressure: Vestwell, Human Interest, and Gusto 401(k) all market
              simple pricing and automated administration, which is positive for adoption but negative for long-run
              pricing power if product differences narrow.


              For Vestwell specifically, the most favorable market evolution is the convergence of retirement, emergency
              savings, education savings, and state-facilitated programs into a reusable operating stack. The most
              adverse scenario is that the company captures distribution breadth without enough economic depth because
              payroll and institutional partners control access to customers and can negotiate aggressively on price or
              replace providers over time.
            claimRefs:
              - CM018
              - CM019
              - CM020
