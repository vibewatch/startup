        title: Customer base segmentation and adoption breadth
        blocks:
          - type: paragraph
            body: >-
              Vestwell’s customer base is best segmented by channel rather than by a single buyer archetype. The company
              serves direct employers seeking retirement or adjacent savings benefits, advisers and TPAs using the
              platform to scale service delivery, financial institutions embedding or distributing savings products,
              state agencies administering public programs, and end savers who ultimately use the accounts. Public
              customer evidence reinforces this breadth: the company page says Vestwell now enables 750,000+ businesses
              and 2.55M+ active savers, while the 2026 financing announcement still anchors the more conservative
              historical milestone of 2M+ savers and $50B+ assets. The October 2025 New York Secure Choice launch says
              Vestwell powers 85% of government retirement programs and 37 government-led savings programs across
              payroll-deducted IRAs, 529s, and ABLE accounts.


              This breadth is commercially valuable because it creates multiple customer-acquisition routes. Vestwell
              can win by selling directly to employers, by becoming the operating layer behind advisor and payroll
              channels, or by winning state-administered programs that onboard many employers and savers under a single
              mandate. The Amazon DSP pooled employer plan launch shows another variant: a networked segment solution
              designed for a specific ecosystem of small operators with common needs.


              The main interpretive caution is that aggregate reach does not equal revenue concentration safety.
              Millions of savers and hundreds of thousands of enabled businesses sound diversified, but public sources
              do not disclose how much activity or revenue is concentrated in a handful of state programs, payroll
              connectors, or advisory distribution partners.
