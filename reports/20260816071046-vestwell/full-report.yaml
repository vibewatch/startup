      - number: '8.4'
        title: Recommendation, confidence, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The right public-only recommendation is price-disciplined and conditional. Vestwell is investable in
              concept and probably investable in practice, but the public record does not yet justify a blanket “buy at
              any price” conclusion. The company has enough scale, customer proof, and financing credibility to warrant
              serious pursuit. However, the evidence still leaves too much uncertainty around quality-of-revenue, gross
              margin durability, partner concentration, and service intensity to call the latest mark clearly attractive
              without more data.


              Accordingly, the best stance is to pursue only with full private diligence and terms discipline. If
              management can show healthy gross margins, strong cohort retention, limited concentration, and efficient
              support economics, a valuation around the latest round can be justified and perhaps exceeded. If not,
              investors should either lower the entry price, demand stronger protections, or move the opportunity into a
              track / revisit bucket.


              In short: strong company, plausible price, incomplete evidence.
            claimRefs:
