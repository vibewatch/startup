  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive thesis is straightforward. Vestwell has already crossed the scale threshold that many private
              fintech infrastructure companies never reach. Public evidence supports more than $200M in ARR, profitable
              growth, 2M+ to 2.55M+ savers depending on the disclosure snapshot, 750K+ businesses enabled on the latest
              company page, and leadership in state-facilitated savings programs. Customer proof extends beyond logos
              into real operating stories, and the company has continued to attract large investors and institutional
              partners. If the underlying gross margins are healthy and channel concentration is manageable, Vestwell
              could be one of the more durable assets in workplace savings infrastructure.


              The anti-thesis is equally important. Public evidence does not reveal gross margin, NRR, GRR, churn, or
              partner concentration. Much of the visible differentiation appears workflow- and service-based rather than
              rooted in a fully inspectable technical moat. That can still be valuable, but it also means the model may
              be more labor-intensive and channel-dependent than late-stage software multiples usually assume. If the
              business relies heavily on support teams, payroll connectors, or a few public and institutional
              relationships, then a seemingly reasonable 10x ARR entry can still be too full.


              So the valuation question is not whether Vestwell is a good company. It is whether the evidence gap
              between scale and quality-of-revenue is narrow enough to underwrite $2B with conviction. On public
              evidence alone, the answer is “not yet fully.”
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
