  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risks
        blocks:
          - type: paragraph
            body: >-
              Vestwell operates in a policy-dense part of fintech. The company’s employer, adviser, and public-program
              products all depend on retirement-plan rules that continue to evolve through SECURE 2.0, state mandate
              rollout, fiduciary expectations, and privacy obligations. Vestwell’s own educational pages emphasize how
              fast the legislative environment changes and how state mandates and auto-enrollment rules affect sponsors.
              Its cyber and litigation posts likewise acknowledge fiduciary exposure, excessive-fee lawsuits, and
              service-provider vetting duties. This suggests management understands the legal complexity, but it also
              confirms that the company lives in a category where rule interpretation and process discipline materially
              affect outcomes.


              Public evidence also suggests a layered regulatory footprint. Vestwell Advisors is an SEC-registered
              investment adviser, the security/support materials reference regulatory bank oversight and a trust
              company, and the privacy policies invoke GLBA and CCPA. That breadth can be a moat, but it also means
              compliance failure could spread across multiple entities and product lines rather than remaining isolated.


              The legal risk is therefore not merely “fintech regulation exists.” It is that Vestwell’s growth thesis
              depends on helping employers and programs comply more easily, which means any control, disclosure, or
              process failure can cut directly against the value proposition.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
