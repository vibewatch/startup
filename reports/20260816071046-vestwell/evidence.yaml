evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: Current employee headcount and department mix across engineering, operations, and service teams.
    whyItMatters: Headcount is a key proxy for operating leverage, support capacity, and post-acquisition integration burden.
    diligencePath: >-
      Request current org census, by-function headcount, and last twelve months hiring/attrition summary from
      management.
    relatedQuestionRefs:
      - QO023
  - type: private-evidence-only
    severity: blocking
    topic: capital-structure
    missingEvidence: Post-Series-E cap table, liquidation preferences, board rights, and founder ownership.
    whyItMatters: >-
      The valuation headline cannot be underwritten without understanding dilution, preference overhang, and governance
      control.
    diligencePath: Request full capitalization table, financing term sheet summary, and investor rights agreement excerpts.
    relatedQuestionRefs:
      - QO024
  - type: private-evidence-only
    severity: material
    topic: channel-economics
    missingEvidence: Gross margin, partner concentration, and revenue mix by employer, state, and institutional channels.
    whyItMatters: >-
      Overview strength can mask fragile economics if margins or partner concentration are weaker than implied by
      topline scale.
    diligencePath: >-
      Request trailing twelve month revenue mix, gross margin by product family, and top-partner concentration
      schedules.
    relatedQuestionRefs:
      - QO025
  - type: enumeration-incomplete
    severity: minor
    topic: TO002 leadership sample boundary
    missingEvidence: A full public roster of second-layer operating leaders and their exact remit boundaries.
    whyItMatters: >-
      The leadership table is intentionally representative and could miss functions that matter for succession and
      operating redundancy.
    diligencePath: Request a current org chart covering all executive and senior vice president roles.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: minor
    topic: TO003 stakeholder or investor map completeness
    missingEvidence: >-
      A complete cap table and commercial concentration schedule that identifies all material equity holders and channel
      counterparties.
    whyItMatters: >-
      The public stakeholder table can only infer influence from announcements and board seats, which may omit hidden
      concentration or rights.
    diligencePath: Request cap table, investor rights summary, and top-partner revenue concentration by channel.
    relatedQuestionRefs:
      - QO024
      - QO025
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: segment win rate
    missingEvidence: >-
      Segmented data on Vestwell win rates in first-time plans, conversions, public-sector programs, and partner
      channels.
    whyItMatters: Market sizing is incomplete without knowing where category growth is truly being captured by Vestwell.
    diligencePath: >-
      Request pipeline conversion by segment and annual booked-plan additions by direct, partner, and government
      channels.
    relatedQuestionRefs:
      - QM023
  - type: private-evidence-only
    severity: material
    topic: realized unit economics by channel
    missingEvidence: >-
      Average revenue per employer, average revenue per saver, and gross margin by SMB, partner, and public-sector
      channel.
    whyItMatters: A broad TAM is not useful if realized monetization differs sharply across channels or is structurally thin.
    diligencePath: Request channel-level ARPU/ARPS and gross-margin bridge for the last twelve months.
    relatedQuestionRefs:
      - QM024
  - type: private-evidence-only
    severity: minor
    topic: access expansion versus share capture
    missingEvidence: Management attribution of growth to new market formation versus competitor displacement.
    whyItMatters: Different sources of growth imply different durability and competitive responses.
    diligencePath: >-
      Ask management to decompose new plans and savers into category expansion, transfers, acquisitions, and
      public-program adds.
    relatedQuestionRefs:
      - QM025
  - type: private-evidence-only
    severity: material
    topic: win-rate by segment
    missingEvidence: Competitive win/loss rates versus Human Interest, Gusto, and incumbents segmented by plan size and channel.
    whyItMatters: >-
      The public narrative implies strength, but without win/loss data it is impossible to know whether Vestwell is
      really taking share in its priority lanes.
    diligencePath: Request annual win/loss analysis by competitor, plan size, and source channel.
    relatedQuestionRefs:
      - QP023
  - type: private-evidence-only
    severity: material
    topic: realized pricing burden
    missingEvidence: Realized fee burden split between employers and participants across direct, partner, and public-sector plans.
    whyItMatters: List pricing does not reveal the true competitive economics or take-rate durability.
    diligencePath: Request fee schedules and average realized revenue per plan by segment.
    relatedQuestionRefs:
      - QP024
  - type: private-evidence-only
    severity: material
    topic: partner steering risk
    missingEvidence: Concentration of new-plan flow and contribution volume by payroll and advisor partner.
    whyItMatters: Competitive moat weakens if a few external distributors can redirect demand to substitutes.
    diligencePath: Request top-partner contribution to bookings, active plans, and revenue.
    relatedQuestionRefs:
      - QP025
  - type: private-evidence-only
    severity: blocking
    topic: cash and burn
    missingEvidence: Current cash balance, monthly burn, runway, and board-approved financing plan.
    whyItMatters: Capital adequacy cannot be underwritten from public raise headlines alone.
    diligencePath: Request current balance sheet, trailing twelve month cash flow, and forward runway model.
    relatedQuestionRefs:
      - QI023
  - type: private-evidence-only
    severity: blocking
    topic: gross margin and retention by channel
    missingEvidence: Gross margin, contribution margin, NRR, and churn split by employer-direct, partner, and public-sector channels.
    whyItMatters: Without these metrics the quality of revenue remains unproven despite topline scale.
    diligencePath: Request cohort and margin package by channel for the last eight quarters.
    relatedQuestionRefs:
      - QI024
  - type: private-evidence-only
    severity: material
    topic: partner concentration
    missingEvidence: Top payroll, advisor, and institutional partner concentration by revenue, bookings, and active savers.
    whyItMatters: Channel concentration can compress economics and increase renegotiation risk.
