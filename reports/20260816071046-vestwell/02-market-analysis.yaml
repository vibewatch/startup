  "chapter": {
    "number": 2,
    "title": "Market Analysis",
    "summary": "Vestwell operates inside the broad U.S. retirement-savings market but its real investable market is narrower: payroll-connected plan administration and savings infrastructure for SMB employers, state auto-IRA programs, advisers, and institutional distributors. Public market data show enormous asset pools\u2014$47.6T total U.S. retirement assets and $13.8T in employer-based DC plans as of Q1 2026\u2014but adoption is constrained by compliance friction, sponsor inertia, and trust requirements. The market is structurally attractive because state auto-IRA expansion, PEP growth, and embedded payroll distribution lower acquisition friction for firms like Vestwell, yet competitive fee compression and channel concentration limit how much of the broad retirement TAM can be economically captured."
  },
  "sections": [
    {
      "id": "market-boundary",
      "title": "Market boundary and included spend",
      "body": "Vestwell should not be valued against the entire U.S. retirement-asset base as if all of that spend were addressable software revenue. The relevant market boundary starts with employer-sponsored defined contribution administration\u2014especially 401(k), 403(b), pooled employer plan, and state auto-IRA workflows\u2014but extends into adjacent savings programs where payroll, recordkeeping, compliance, and participant servicing can be reused across a common infrastructure layer. ICI data show the overall retirement system is huge, with $47.6T of U.S. retirement assets as of March 31, 2026 and $13.8T in employer-based defined contribution plans, including $9.9T in 401(k) plans alone. Those pools matter because they define the financial gravity of the category, but they do not mean Vestwell can monetize assets directly at scale without a plan-sponsor, partner, or government distribution path.\n\nThe spend that does belong inside Vestwell\u2019s functional market boundary is the recurring administration, recordkeeping, payroll-sync, compliance, advisory-support, and participant-engagement layer attached to plan creation and servicing. Official Vestwell materials reinforce that the company is selling platform infrastructure to employers, advisers, financial institutions, payroll providers, and government agencies rather than simply gathering end-consumer balances. This places it closer to embedded fintech infrastructure than to a pure asset manager. The market therefore includes software and services revenue attached to new-plan formation, conversion, maintenance, participant support, and adjacent products such as emergency savings, student-debt benefits, 529 programs, ABLE accounts, and state-sponsored retirement programs.\n\nWhat should be excluded from the core Vestwell market boundary are investment-manufacturing revenues that belong to fund sponsors, general-purpose HR software budgets unrelated to savings, and household financial assets that sit outside workplace or state-facilitated savings channels. Those exclusions matter because they prevent a misleading \u201chuge TAM\u201d narrative and force the diligence lens toward where Vestwell actually has a route to capture budget: payroll-connected employer adoption, partner white-label distribution, and public-sector program administration.",
