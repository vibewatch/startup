    {
      "id": "implications-for-vestwell",
      "title": "Implications for sizing, capture, and diligence",
      "body": "The practical implication is that Vestwell\u2019s TAM should be modeled with constrained sizing lenses rather than a single giant market number. One lens is broad retirement-asset gravity: a $47.6T retirement ecosystem legitimizes the strategic importance of the category. A second lens is employer-based DC administration: $13.8T in employer DC assets and $9.9T in 401(k) assets define the core plan-servicing pool where software, compliance, and recordkeeping budgets attach. A third lens is access expansion: active auto-IRA programs, PEP growth, and first-time SMB plan formation expand the number of records and plans that can be served even when average account balances are small. A fourth lens is adjacency: once payroll and participant identity are established, additional savings products can improve revenue per employer or per saver without requiring a wholly separate distribution engine.\n\nThat said, the company\u2019s realistic SAM is much smaller than the retirement category headlines, because Vestwell is not an incumbent megarecordkeeper with enterprise trust at every plan size, nor is it a consumer destination with zero-cost acquisition of end savers. Its economic wedge is strongest where complexity is painful and payroll-native or partner-led distribution can shortcut sales friction. That points toward first-time SMB plans, partner-white-labeled distribution, state-facilitated programs, and selected plan transfers rather than the entire recordkeeping landscape.\n\nDiligence therefore needs to answer three market questions before any high-conviction underwriting. First, what percentage of Vestwell\u2019s growth comes from net-new category expansion versus share gain from competitors? Second, how much bargaining power do payroll and institutional channels retain? Third, can adjacent products materially deepen revenue without degrading service complexity? The market is clearly large and still expanding, but the investable opportunity depends on how much of that growth Vestwell can capture at attractive economics rather than on category size alone.",
