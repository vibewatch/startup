  "chapter": {
    "number": 5,
    "title": "Product & Technology",
    "summary": "Vestwell\u2019s product is best understood as savings infrastructure rather than a single retirement-plan app. Public evidence supports a modular platform spanning employer-sponsored retirement plans, government-backed auto-IRA administration, 529 and disability-adjacent savings programs, saver and sponsor portals, payroll connectivity, compliance workflows, and white-label program delivery. The technical story is credible but still partially opaque: Vestwell provides clear workflow and integration evidence, but public sources stop short of exposing its actual system architecture, uptime history, SOC reports, incident record, or API surface in enough detail to fully underwrite technical differentiation."
  },
  "sections": [
    {
      "id": "product-scope",
      "title": "Product definition and module map",
      "body": "Vestwell delivers a broad savings-administration platform that spans multiple account types, distribution models, and end users. On the employer side, the company packages workplace retirement products such as 401(k), 403(b), SIMPLE IRA, SEP IRA, and solo plans. On the government side, it presents purpose-built infrastructure for state-backed retirement, education, and disability savings programs. On the consumer side, it offers saver-facing portals, multilingual support, mobile access, automated contribution controls, and ongoing education. The 529 product page extends the platform beyond retirement and shows that Vestwell\u2019s design logic is to reuse account-opening, payroll contribution, beneficiary, and digital self-service primitives across adjacent savings categories.\n\nThat breadth matters because Vestwell\u2019s technology risk is not simply \u201ccan it host a plan?\u201d but \u201ccan it coordinate many plan types, program rules, and user surfaces without creating service friction?\u201d Public pages repeatedly describe configurable plan design, compliance automation, custom branding, and white-label delivery. Those claims imply a modular configuration system rather than one-off services. They also suggest Vestwell\u2019s differentiation is not a single algorithmic moat, but a combination of payroll connectivity, public-program configurability, embedded compliance, and user-experience design for employers, advisers, agencies, and savers.\n\nThe limitation is that public materials remain product-marketing heavy. There is enough evidence to map modules and workflow roles, but not enough to verify underlying codebase boundaries, API rate architecture, data-model isolation, or release governance in the way a deep technical diligence process would require.",
