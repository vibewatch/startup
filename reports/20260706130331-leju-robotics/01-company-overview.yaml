callouts:
  - calloutType: strength
    title: "Explosive Revenue Growth with Global Market Position"
    body: "Leju achieved 118.68% three-year revenue CAGR and ranked 4th globally in humanoid robot shipments in 2025, demonstrating rapid commercial traction in a nascent market."
    claimRefs: [CO024, CO025, CO032]
  - calloutType: risk
    title: "Widening Losses Despite Revenue Growth"
    body: "Net losses expanded from RMB 41M to RMB 70M over 2023-2025 despite 4.8x revenue growth, with negative operating cash flows for three consecutive years. Profitability target of 2028 is company's own projection."
    claimRefs: [CO035, CO036, CO037]
  - calloutType: insight
    title: "Price-for-Volume Strategy Creates Margin Pressure"
    body: "KUAVO unit prices dropped 25.56% in 2025 as part of an aggressive market-oriented pricing strategy. While unit cost also fell 27.35%, the revenue mix shift toward lower-margin KUAVO pulled overall gross margin from 50.45% to 40.78%."
    claimRefs: [CO033, CO034]
  - calloutType: assumption
    title: "IPO Valuation Implies Significant Premium Over Last Round"
    body: "The targeted RMB 10B IPO valuation represents a ~2.3x step-up from the RMB 4.327B post-money pre-IPO valuation within approximately 7 months, implying aggressive market pricing expectations for humanoid robotics."
    claimRefs: [CO017, CO021]
