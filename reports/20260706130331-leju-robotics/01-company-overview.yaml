company:
  name: "Leju Robotics"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Leju Robotics (乐聚机器人), legally Leju Intelligence (Shenzhen) Co., Ltd., is a leading Chinese humanoid robotics company founded in 2016 by HIT alumni, now filing for a ChiNext IPO with RMB 258M in 2025 revenue and a post-money valuation of RMB 4.3 billion after raising ~$250M total."
sections:
  - id: "identity-and-business"
    title: "Identity, Business Model, and Corporate Structure"
    body: |
      Leju Robotics was founded in 2016 in Shenzhen by a team of Harbin Institute of Technology (HIT) graduates led by Leng Xiaokun (冷晓琨). The company legally restructured in 2025, rebranding from Leju Robot (Shenzhen) Co., Ltd. to Leju Intelligence (Shenzhen) Co., Ltd. ahead of its IPO filing. Headquarters remain in Shenzhen, Guangdong, China, with additional offices in Harbin and Hangzhou.

      The company operates as a pure-play humanoid robotics firm with three product lines: the KUAVO series of full-size humanoid robots targeting industrial and commercial applications; the Roban series of mid-to-small humanoid robots for AI research and education; and the Aelos series of small robots for primary STEM education. In 2025, KUAVO series revenue accounted for 69.5% of total operating revenue (RMB 178M of RMB 258M total), making it the dominant revenue contributor. The business model is B2B/B2G with a hybrid direct-sales and channel distribution approach developed through years in the education market.

      Leju initially entered the market through basic programming education with the Aelos robot in 2016-2017, then pivoted its strategic focus to general-purpose full-size humanoid robots in 2023. As of 2025, KUAVO's primary deployment scenarios include data collection (45% of KUAVO revenue), scientific research and education (32.5%), commercial services (18.7%), and early-stage industrial manufacturing (3.88%). The company filed for IPO on the Shenzhen ChiNext board under ChiNext's fourth listing standard, with its application accepted on May 19, 2026.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: "leadership-and-governance"
    title: "Founders, Leadership, and Governance"
    body: |
      Leju Robotics was co-founded by three HIT alumni who remain the controlling shareholders and executive team. Leng Xiaokun serves as founder, chairman, and chief technology officer, bringing a PhD in Computer Application Technology from HIT and over 130 invention patents. Chang Lin serves as CEO responsible for daily operations and commercialization strategy. An Ziwei serves as COO driving technology industrialization and partnerships. The three co-founders together directly or indirectly control approximately 33.7% of the company's equity.

      Leng Xiaokun, born in 1992, is one of China's youngest tech company founders to reach unicorn status. He was recognized with the 2025 China Youth May Fourth Medal and oversees 36 major R&D projects. The technical leadership core is heavily concentrated among HIT alumni with deep expertise in robotics, AI, and system integration. This creates both a strength in technical cohesion and a potential key-person risk concentrated in the founding team.

      The company's IPO counseling was registered on October 30, 2025 with the Shenzhen Securities Regulatory Bureau, with Oriental Securities serving as the sponsoring institution. The transition to joint-stock company structure in 2025 signaled formal corporate governance maturation ahead of the public listing.
    claimRefs: [CO008, CO009, CO010, CO011, CO012, CO013]
    tableRefs: [TO002]
  - id: "funding-and-valuation"
    title: "Funding History and Valuation"
    body: |
      Leju Robotics has raised approximately $250 million in total across multiple funding rounds since its 2016 founding. The funding trajectory demonstrates accelerating investor conviction, with the majority of capital raised in 2025 alone.

      The seed round in July 2016 was led by Green Pine Capital Partners (Songhe Capital). A Series A round in August 2017 raised approximately $7.4 million with Tencent as a key investor alongside Linzhi Lixin Information Technology. The Series B round in June 2019 raised approximately $36.4 million from Tencent Industry Win-Win Fund, Shenzhen Capital Group, Green Pine Capital Partners, and Aplus Capital.

      The landmark pre-IPO round closed in October 2025, raising nearly RMB 1.5 billion (approximately $207-210 million). This round involved more than ten institutional investors including Shenzhen Investment Holdings Capital, Shenzhen Longhua Capital, Qianhai Foundation Investment, Shijingshan Industrial Fund, Dongfang Precision (listed, holding 6.83%), Tuopu Group, CITIC Goldstone, CITIC Securities Investment, and Daohe Long-Term Investment. The post-money valuation after this round was RMB 4.327 billion.

      The IPO filing targets raising RMB 2.6 billion through issuance of no more than 20 million shares (minimum 25% of post-offering share capital), implying an IPO valuation of approximately RMB 10 billion (~$1.4 billion), which would place Leju in the top tier of China's embodied intelligence sector by market capitalization.
    claimRefs: [CO014, CO015, CO016, CO017, CO018, CO019, CO020, CO021]
    tableRefs: [TO003]
    figureRefs: [FO002]
  - id: "milestones-and-trajectory"
    title: "Milestones, Scale, and Trajectory"
    body: |
      Leju Robotics has progressed from an education-focused robotics startup to a top-four global humanoid robot shipper in under a decade. Key milestones span product launches, financing events, strategic partnerships, and regulatory filings.

      In product development, the company launched Aelos (2016), began Aelos mass deliveries (2017), entered full-size humanoid R&D (2018), launched KUAVO 3 (December 2023), iterated to KUAVO 4 and KUAVO 4 Pro (2024), and released KUAVO 5 and KUAVO 5-W (October 2025). The iteration pace of five major product updates in three years exceeds the industry average of approximately one per year.

      In terms of scale, KUAVO sales exploded from 32 units in 2024 to 577 units in 2025, a 17-fold increase. Revenue grew from RMB 54 million (2023) to RMB 56 million (2024) to RMB 258 million (2025), representing a three-year compound annual growth rate of 118.68%. The company was ranked fourth globally in humanoid robot shipments by Counterpoint Research (approximately 5% global market share) and third by IDC in 2025.

      Partnerships include integration of Huawei's OpenHarmony-based KaihongOS and Pangu AI models, collaboration with China Mobile on 5G-A remote robot operations, and Nvidia chip integration for industrial applications. In November 2025, KUAVO became the first humanoid robot to carry a torch at a major sports event (China's 15th National Games). In 2026, Leju inaugurated China's first specialized humanoid robot data training center in Jinan.
    claimRefs: [CO022, CO023, CO024, CO025, CO026, CO027, CO028, CO029, CO030, CO031]
    tableRefs: [TO004]
    figureRefs: [FO003]
  - id: "cover-metrics-and-gaps"
    title: "Cover Metrics and Evidence Gaps"
    body: |
      Based on disclosed prospectus data and verified third-party reporting, the key cover metrics for Leju Robotics as of mid-2026 are: post-money valuation of RMB 4.327 billion (~$600M at current exchange) from the pre-IPO round, with a targeted IPO valuation of ~RMB 10 billion (~$1.4B); total capital raised of approximately $250 million; 2025 operating revenue of RMB 258 million (~$36M); gross margin of 40.78% (2025); and net loss of RMB 69.78 million in 2025 with a company-projected profitability target of 2028.

      The company shipped 577 KUAVO units and 3,988 Aelos units in 2025. Headcount data is limited—Tracxn reports approximately 13 employees as of April 2026, but this likely reflects only executive/founding team tracked and not total workforce. The total employee count is not publicly confirmed. Revenue run-rate metrics beyond 2025 actuals, ARR breakdown, and detailed customer count by deployment scenario remain undisclosed pending IPO prospectus updates.

      Critical gaps include: exact current headcount, customer retention metrics, unit economics per deployment scenario, detailed cap table beyond major shareholders, and post-2025 revenue trajectory. These gaps are expected to narrow as IPO disclosure requirements take effect.
    claimRefs: [CO032, CO033, CO034, CO035, CO036, CO037]
