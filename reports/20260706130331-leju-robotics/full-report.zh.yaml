      - number: '5.3'
        title: 部署、可靠性、开发者生态与路线图
        blocks:
          - type: paragraph
            body: >
              Leju 自己的 2025 年收入结构显示 KUAVO 实际用在哪里：数据采集是最大场景，占 Kuavo 系列收入的 45%；研究 / 教育占 32.5%；商业服务占 18.7%；工业制造只有 3.88%。这与
              2025 年 KUAVO 4 Pro 在 FAW Hongqi 汽车产线做箱体搬运和拣选的概念验证部署一致——那不是规模化生产合同。可靠性方面，Leju 解决方案负责人在 AW 2026
              展会上称，最新平台基于工厂测试数据已展示超过 1,000 小时的平均无故障时间，以及最长 9.5 小时的连续运行；这是厂商自报数字，未经独立审计。公司的发布节奏很快：KUAVO（品牌写作
              Kuavo/Kuafu）于 2023 年 12 月发布并集成 OpenHarmony，2024 年迭代到 Kuavo 4 和 4 Pro，2025 年 6 月与 Huawei、China Mobile 联合展示
              5G-A 连接人形机器人，2025 年 10 月发布 Kuavo 5/5-W，随后在 2026 年 5 月递交 ChiNext IPO 申请。外部开发者可通过
              kuavo-ros-opensource（GitHub：49 stars / 16 forks / 482 commits；Gitee 镜像：44 stars / 7 issues，现标记为 archived
              并重定向到 GitCode）、kuavo_data_challenge，以及 PyPI 上的 kuavo-humanoid-sdk-ws 包接入平台——相较主流机器人
              SDK，这个外部开发者足迹真实但很小，而且权威托管位置已经在变化。
