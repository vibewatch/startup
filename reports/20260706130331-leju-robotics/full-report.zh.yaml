      - number: '6.4'
        title: 留存、重复使用与满意度证据
        blocks:
          - type: paragraph
            body: >-
              在本章审阅的 Leju 来源中，没有任何地方披露净收入留存、毛收入留存、客户流失率，或平均合同 / 续约时长。作为 IPO 前申请企业，Leju
              只披露合并收入、毛利率和净亏损，而不是客户群组指标。没有真实留存客群时，最好的代理指标是机构层面的 先落地再扩张行为：Shijingshan 关系从 Phase I 社区部署加深为专门的 Phase II
              合同，Dongfang Precision 关系从既有少数股权投资加深为 2025 年 OEM 制造和市场发展协议。直接消费者满意度证据很薄：Leju 官方 Taobao 旗舰店的 Aelos Pro3
              教育机器人页面，在商品描述、卖家服务和物流评分上的公开评价量接近零。这更可能由 Leju 的机构买方基础（学校、研究院所、政府项目）解释，而不是 B2C 零售模式；已审阅来源中也没有发现任何 Leju
              产品存在投诉、召回、合同取消或部署受阻的记录模式。2019 年一篇独立上手评测正面评价了 Aelos 教育版机器人的做工和安全细节，但该评测早于 Leju 转向 Kuavo
              时代工业化的拐点数年，无法说明当前一代产品或满意度。因此，本章的留存 / 重复客群图衡量的是证据深度——每一层来源能揭示多少初始参与、重复 / 扩张和续约可见度——而不是真正的收入留存，因为公司没有披露留存数据。
