  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议：增长证据真实，但估值尚未解决
        blocks:
          - type: paragraph
            body: >-
              Leju Robotics 带着真实商业动能进入 ChiNext IPO 流程。保荐人的上市推荐确认，2025 年收入为 RMB 258.19 million，三年收入 CAGR 为 118.68%，2025 年
              10 月 IPO 前轮融资后估值为 RMB 4.327 billion，该轮引入十多家机构投资者。公司计划通过发行不超过 20 million 股新股募资 RMB 2.6 billion；IPO 前股本为 60
              million 股，发行后公众持股比例保持在 25% 或以上。


              更难的问题是价格。Leju 自己的保荐人只把 ChiNext 第四套标准上市门槛表述为预计市值「不低于 RMB 3
              billion」，并称公司凭上一轮估值和未具名同行比较即可满足。另有围绕同一申报的市场和媒体评论估算，IPO 隐含估值接近 RMB 10 billion——约为上一轮私人估值的 2.3 倍、法定底线的 3.3
              倍——但这个数字来自分析师，不是公司披露。Leju 自己引用的底线与市场讨论的上限之间约 3
              倍跨度，对一家离定价如此接近的公司来说异常宽；在最终发行价公开之前，这也是偏向继续研究、给出中等置信度、高风险评级和偏高估值判断，而不是更明确结论的最强理由。
