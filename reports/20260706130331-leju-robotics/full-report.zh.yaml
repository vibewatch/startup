  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 方向
      - 什么会改变判断
    rows:
      - - 2025 年 Kuavo 销量从 32 台增至 577 台、增长 17x，收入增长 365%，证明商业牵引是真实的。
        - 投资逻辑
        - 未来 1-2 个报告期内销量或收入增长反转，会削弱核心增长逻辑。
      - - 行业跟踪机构将 Leju 列为全球人形机器人出货量第三；尽管融资远少于最接近的竞争对手，它仍领先当前活跃在该品类的 150 多家公司中的大多数。
        - 投资逻辑
        - 若显著份额流向 Unitree、AgiBot 或新入局者，会削弱相对定位论点。
      - - 中国人形机器人市场预计到 2030 年按 47.6% CAGR 增长；即便 Leju 当前全球份额仍是个位数，也有足够大跑道。
        - 投资逻辑
        - 行业增长预测下修，或出现需求提前透支证据，都会削弱这一支撑。
      - - 毛利率已连续三年下滑至 40.78%，公司仍亏损且经营现金流为负；因此，当前定价传闻已经预设了一条难以验证的 2028 年盈利路径。
        - 反向逻辑
        - 连续两个期间毛利率企稳或亏损收窄，会显著降低这一担忧。
      - - 市场流传的约 RMB10 billion IPO 数字并非公司自己披露；公司给出的上市门槛只是「不低于 RMB3 billion」 ——二者相差近 3.3x，说明定价确有不确定性。
        - 反向逻辑
        - 最终招股书给出明确发行价区间后，这一不确定性无论高低都会被解决。
      - - 独立分析师已经提示全行业估值偏高、买家满意度低（23%），以及中国 150 多家人形机器人创业公司可能洗牌。
        - 反向逻辑
        - 企业买家满意度经验证上升，或新入局者数量增长放缓，都会缓解这一担忧。
    notes: 这些论点刻意保持价格敏感：投资逻辑行描述真实运营证据，反向逻辑行描述当前定价传闻已经必须假设的前提。
