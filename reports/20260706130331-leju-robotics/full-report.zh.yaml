      - number: '2.2'
        title: TAM/SAM/SOM 规模测算与估计
        blocks:
          - type: paragraph
            body: >
              中国人形机器人市场规模因方法和定义边界不同而差异很大。MarketsandMarkets 较保守、偏硬件的估计认为，中国人形机器人市场 2025 年为 $0.40 billion，到 2030 年增至 $2.80
              billion，CAGR 为 47.6%。Morgan Stanley 更宽口径预测 2030 年人形机器人年收入为 $15 billion；CCID（China Center for Information
              Industry Development）预计 2026 年为 20 billion yuan（~$2.8B）。


              若按更宽定义纳入全部硬件、软件、服务和 AI 集成，总可寻址市场（TAM）据 Embodied Global 研究可在 2026 年达到 104.71 billion
              yuan（~$14.5B）；但这是最宽口径，包含与具身 AI 和广义机器人重叠的部分。TrendForce 预计 2026 年中国人形机器人产出将激增 94%，Unitree 和 AgiBot 合计接近 80%
              出货量。


              具体到 Leju Robotics，可服务市场（SAM）受限于全尺寸双足人形机器人已经落地的场景：主要是工业自动化、数据采集和科研/教育。按 Leju 2025 年 RMB 258M 收入和约 5%
              全球出货份额计算，当前可获取市场（SOM）约为 $36M；对应全球市场约 $400M–2B，取决于定义口径。


              核心规模测算矛盾在于，看多的 TAM 预测纳入未来服务/AI，而保守预测只看近端硬件收入。公司把数据采集转为收入驱动，说明 AI 训练数据市场是相邻 TAM 扩张方向。
