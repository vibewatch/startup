      - number: '1.3'
        title: 融资历史与估值
        blocks:
          - type: paragraph
            body: >
              Leju Robotics 自 2016 年创立以来多轮融资，累计融资约 $250 million。融资曲线显示投资人信心加速升温，多数资金仅在 2025 年筹得。


              2016 年 7 月种子轮由 Green Pine Capital Partners (Songhe Capital) 领投。2017 年 8 月 Series A 轮融资约 $7.4
              million，Tencent 是关键投资方，Linzhi Lixin Information Technology 也参与。2019 年 6 月 Series B 轮融资约 $36.4
              million，投资方包括 Tencent Industry Win-Win Fund、Shenzhen Capital Group、Green Pine Capital Partners 和 Aplus
              Capital。


              标志性的 IPO 前融资于 2025 年 10 月完成，募资近 RMB 1.5 billion（约 $207-210 million）。该轮引入十余家机构投资者，包括 Shenzhen Investment
              Holdings Capital、Shenzhen Longhua Capital、Qianhai Foundation Investment、Shijingshan Industrial
              Fund、Dongfang Precision（上市公司，持股 6.83%）、Tuopu Group、CITIC Goldstone、CITIC Securities Investment 和 Daohe
              Long-Term Investment。该轮后投后估值为 RMB 4.327 billion。


              IPO 申报拟发行不超过 20 million 股（不少于发行后股本 25%），募资 RMB 2.6 billion，隐含 IPO 估值约 RMB 10 billion（~$1.4
              billion）。按市值计，Leju 将进入中国具身智能板块第一梯队。
