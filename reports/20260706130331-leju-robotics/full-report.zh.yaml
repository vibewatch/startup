      - number: '7.5'
        title: 人员、执行风险与缓释
        blocks:
          - type: paragraph
            body: >
              Leju 的战略和运营方向仍集中在创始人 Leng Xiaokun 及一小圈与 Harbin Institute of Technology
              相关的高管手里。对一家创始人主导、接近上市的硬件创业公司，这是一种常见单点故障风险。公开登记来源对员工数存在分歧——一份记录显示截至 2024 年年报有 76 名参保员工，另一份列出 198
              名——这个未解决差异会影响对组织规模的判断。具身 AI 和机器人工程人才在中国的薪酬，也因全行业激烈抢人而大幅上升，在公司尚未盈利时压迫 opex。


              执行风险集中在两件事：把 FAW 部署等工业概念验证转化为可重复的批量订单；管理似乎跑在确认需求之前的产能扩建，避免触发现金消耗螺旋。


              可监控的缓释因素和否决条件包括：上市后 12 个月内确认执行器第二来源认证；若美国出口管制进一步收紧，披露国产 AI 计算替代进展；ChiNext 审核结果本身，撤回或被否将打破投资假设；三个财年内毛利率向
              Unitree / UBTech 基准收敛；以及任何会关闭 Leju 可触达出口市场一部分的美国立法行动（例如 GUARD Act
              生效）。尽调问题应直指执行器供应商路线图、核对后的员工数，以及工业销售管线转化数据。
