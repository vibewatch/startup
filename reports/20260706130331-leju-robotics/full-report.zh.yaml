      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >
              Leju Robotics 由三位 HIT 校友联合创立，三人仍是控股股东和执行团队核心。Leng Xiaokun 担任创始人、董事长兼 CTO，拥有 HIT 计算机应用技术博士学位和 130+
              项发明专利。Chang Lin 担任 CEO，负责日常运营与商业化战略。An Ziwei 担任 COO，推进技术产业化与合作伙伴关系。三位联合创始人合计直接或间接控制公司约 33.7% 股权。


              Leng Xiaokun 出生于 1992 年，是中国最年轻的独角兽科技公司创始人之一。他获得 2025 年中国青年五四奖章，并负责 36 个重大研发项目。技术领导层高度集中于 HIT 校友，机器人、AI
              和系统集成经验深。这带来技术协同优势，也把潜在关键人风险集中在创始团队。


              公司 IPO 辅导于 2025 年 10 月 30 日在深圳证监局备案，东方证券担任保荐机构。2025 年改制为股份有限公司，标志着上市前公司治理正式走向成熟。
