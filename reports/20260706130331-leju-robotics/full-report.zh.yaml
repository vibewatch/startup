      - number: '4.5'
        title: 财务结论、估计区间与尽调阻塞点
        blocks:
          - type: paragraph
            body: >
              Leju 的财务画像同时包含真正差异化的收入动能——三年收入 CAGR 118.68%、全球人形机器人出货量前四——以及落后最接近公开可比公司的收入质量和毛利率特征。收入质量好坏参半：KUAVO
              占比高且增长快，这是真实的；但增长中相当大一部分（KUAVO 收入 44.94%）来自数据采集合约，绑定政策驱动、可能不可持续的具身智能数据集需求。与此同时，工业部署——UBTECH
              等公开同业已把该分部做到超过人形机器人收入 80%——在 Leju 仍处概念验证阶段。毛利率路径是最突出的红旗：KUAVO 分部毛利率 42.39%，而 UBTECH 与 Unitree 为
              54.6%-60.27%，说明 Leju 尚未拿到同业级别的部件垂直整合或制造规模；对 Wuxi Quanzhibo
              的单一供应商依赖，也给任何毛利率修复论点增加执行风险。资本强度高且还在上升：连续三年经营现金流为负、年度研发支出超过 RMB 65 million、每年 30,000 台的新设施当前利用率远低于
              50%，都指向至少到公司 2028 年盈利目标前仍需外部融资。最清晰的尽调阻塞点是未披露现金余额、员工数、客户集中度和应收/库存数据——每一项都会实质改变承销判断，应在任何 IPO 前或基石投资承诺前补齐。
