            - label: 中
              tone: warning
              detail: 没有披露利用率目标，无法验证扩产节奏。
            - label: 高
              tone: negative
              detail: 缺少在手订单披露时，超建风险仍高。
        - label: ChiNext IPO 审核时间线
          values:
            - label: 中
              tone: warning
              detail: 审核于 2026-05-19 获受理，但完成时间线未确认。
            - label: 中
              tone: warning
              detail: 延期或被否会影响融资现金跑道和估值。
            - label: 中
              tone: warning
              detail: 已聘请上市法律顾问；鉴于公司亏损，采用了替代上市标准路径。
            - label: 中
              tone: warning
              detail: 在 SZSE 审核结果落地前，剩余风险处于中等水平。
        - label: 数据采集收入韧性
          values:
            - label: 中
              tone: warning
              detail: 基础模型的数据需求回归常态后，分析师提示收入存在不确定性。
            - label: 高
              tone: negative
              detail: 数据采集约占当前 KUAVO 收入的 45%。
            - label: 低
              tone: warning
              detail: 公司未披露降低数据采集依赖的多元化目标。
            - label: 高
              tone: negative
              detail: 工业和科研分部做大之前，收入结构仍受数据采集依赖牵制。
        - label: 美国立法 / 市场准入风险
          values:
            - label: 低-中
              tone: warning
              detail: GUARD Act 已提出，但尚未生效。
            - label: 中
              tone: warning
              detail: 若法案生效，部分潜在美国出口市场会被关上。
            - label: 低
              tone: warning
              detail: 公司未披露美国市场受限时的应急方案。
            - label: 中
              tone: warning
              detail: 若法案推进，剩余风险会明显上升。
    approximationNotes: 可能性、影响、缓释和剩余风险标签，是尽调团队基于已披露事实作出的定性判断，不是公司提供的风险登记表。
    claimRefs:
      - CR007
      - CR016
      - CR006
      - CR010
      - CR001
      - CR025
      - CR042
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: Leju 的风险沿少数通道传导：供应商和算力集中、利润率压力、产能超前建设，以及监管 / 法律负担，最终都会推高现金消耗、融资需求和估值压力。
    data:
      nodes:
        - id: supplier-concentration
          label: 执行器供应商集中
          detail: 执行器来源单一或集中，抬高生产连续性风险。
          tone: warning
        - id: export-controls
          label: Nvidia 出口管制暴露
          detail: 美国收紧许可，限制先进 AI 算力获取。
          tone: warning
        - id: margin-pressure
          label: 相对同业利润率承压
          detail: 成本结构和定价落后于规模化竞争对手。
          tone: negative
        - id: capacity-overbuild
          label: 产能先于需求投放
          detail: 产能利用不足会抬高固定成本负担。
          tone: warning
        - id: data-segment-risk
          label: 数据采集收入韧性风险
          detail: 最大收入分部未必能维持当前水平。
          tone: warning
        - id: regulatory-legal
          label: 监管 / 法律负担
          detail: HEIS 认证、GUARD Act 和诉讼环境都会增加合规开销。
          tone: warning
        - id: cash-burn
          label: 现金消耗 / 经营现金流为负
          detail: 经营现金流连续三年为负。
          tone: negative
        - id: financing-need
          label: 融资需求
          detail: 依赖 IPO 募资或持续外部融资。
          tone: negative
        - id: valuation
          label: 估值风险
          detail: 分析师质疑基本面能否支撑当前定价。
          tone: negative
        - id: execution
          label: 执行风险（人才、领导力、爬坡）
          detail: 创始人集中和人才竞争都会影响交付。
          tone: warning
      edges:
        - from: supplier-concentration
          to: margin-pressure
        - from: supplier-concentration
          to: cash-burn
        - from: export-controls
          to: margin-pressure
        - from: export-controls
          to: execution
        - from: margin-pressure
          to: cash-burn
        - from: capacity-overbuild
          to: cash-burn
        - from: data-segment-risk
          to: cash-burn
        - from: regulatory-legal
          to: financing-need
        - from: cash-burn
          to: financing-need
        - from: financing-need
          to: valuation
    approximationNotes: 该图为定性、且有来源支撑：它基于已披露事实展示因果方向，不是合成的概率权重。
    claimRefs:
      - CR007
      - CR016
      - CR006
      - CR010
      - CR025
      - CR018
      - CR003
      - CR032
      - CR033
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: Leju 的依赖网络覆盖一家零部件供应商、一家算力供应商、两家战略伙伴、一家制造伙伴、最大客户分部，以及上市监管方。
    data:
      nodes:
        - id: leju
          label: Leju Robotics（运营核心）
          detail: 产品、制造协同和上市流程的中心。
          tone: positive
        - id: wuxi-quanzhibo
          label: Wuxi Quanzhibo
          detail: 核心执行器零部件供应商。
          tone: warning
        - id: nvidia
          label: Nvidia
          detail: AI 算力硬件供应商，受美国出口许可约束。
          tone: warning
        - id: huawei
          label: Huawei
          detail: OpenHarmony OS 生态伙伴。
          tone: neutral
        - id: tencent
          label: Tencent
          detail: 少数股权投资方。
          tone: neutral
        - id: dongfang-precision
          label: Dongfang Precision
          detail: 合同制造伙伴，也是已披露股东。
          tone: neutral
        - id: faw
          label: FAW
          detail: 工业概念验证客户。
          tone: neutral
        - id: data-buyers
          label: AI / 基础模型数据买家
          detail: 当前最大收入分部（约占 KUAVO 收入 45%）。
          tone: warning
        - id: csrc-szse
          label: CSRC / SZSE
          detail: ChiNext 上市监管机构和交易所。
          tone: warning
      edges:
        - from: wuxi-quanzhibo
          to: leju
        - from: nvidia
          to: leju
        - from: huawei
          to: leju
        - from: tencent
          to: leju
        - from: dongfang-precision
          to: leju
        - from: faw
          to: leju
        - from: data-buyers
          to: leju
        - from: csrc-szse
          to: leju
        - from: leju
          to: csrc-szse
    approximationNotes: 边的方向表示主要依赖流；leju-to-csrc-szse 这条边反映 Leju 正在推进上市申请，因此形成双向监管依赖。
    claimRefs:
      - CR007
      - CR016
      - CR029
      - CR028
      - CR030
      - CR024
      - CR023
      - CR001
  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 「继续研究」的判断来自一个核心冲突：真实规模证明已经出现，但估值缺口未解，竞争激烈，行业泡沫警示也在升温。
    data:
      nodes:
        - id: scale-proof
          label: 规模证明
          detail: 2025 年 Kuavo 出货量增长 17 倍、收入增长 365%，全球出货排名也处于第一梯队。
          tone: positive
        - id: commercialization-quality
          label: 商业化质量
          detail: 数据采集贡献收入 44.94%，工业部署仅占 3.88%；利润率连续 3 年下滑。
          tone: warning
        - id: competitive-pressure
          label: 竞争压力
          detail: Unitree 和 AgiBot 预计合计拿下 2026 年中国出货量约 80%；Unitree 已经盈利。
          tone: warning
        - id: valuation-gap
          label: 估值缺口
          detail: 公司引用的 RMB3B 下限，与市场隐含的约 RMB10B 上限之间差距异常大，且尚未解决。
          tone: warning
        - id: sector-bubble-risk
          label: 行业泡沫风险
          detail: Morgan Stanley 以及 Bloomberg 报道的评论均提示过热风险，买方满意度也偏低（23%）。
          tone: negative
        - id: decision
          label: 继续研究
          detail: 跟踪上市进程，等最终定价、锁定期和股权细节公开后再复盘。
          tone: neutral
      edges:
        - from: scale-proof
          to: valuation-gap
        - from: commercialization-quality
          to: valuation-gap
        - from: competitive-pressure
          to: valuation-gap
        - from: valuation-gap
          to: decision
        - from: sector-bubble-risk
          to: decision
    approximationNotes: null
    claimRefs:
      - CV001
      - CV005
      - CV008
      - CV018
      - CV030
      - CV045
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 以 2025 年 RMB258.19 million 收入为基准，Leju 的隐含收入倍数从法定下限约 11.6x 到市场隐含上限近 38.7x 不等。
    data:
      items:
        - label: RMB3B 法定下限的隐含倍数
          value: 11.6
          detail: 若 IPO 定价落在公司引用的最低上市门槛，对应 2025 年收入倍数。
          tone: positive
        - label: RMB4.327B 最后一轮的隐含倍数
          value: 16.8
          detail: 2025 年 10 月投后估值对应的 2025 年收入倍数。
          tone: neutral
        - label: RMB6B 基准情形中点的隐含倍数
          value: 23.2
          detail: 基准情形定价对应的 2025 年收入倍数。
          tone: warning
        - label: RMB10B 市场隐含目标的隐含倍数
          value: 38.7
          detail: 市场评论中流传的分析师隐含上限，对应 2025 年收入倍数。
          tone: negative
    approximationNotes: 倍数只是用 RMB258.19 million 作分母，把估值除以 2025 年收入得到的简单结果；它们不是风险调整结果，也不是折现现金流输出。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV008
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 公开证据支持较宽的 IPO 定价区间，因为临近上市时，Leju 自身法定下限与市场隐含上限之间的差距仍异常大。
    data:
      items:
        - label: 悲观情形
          low: 3
          mid: 3.5
          high: 4.3
          displayValue: RMB3.0B-RMB4.3B
          detail: 若增长和情绪都不及预期，IPO 定价可能接近法定下限，或处于 / 低于 2025 年 10 月估值标记。
          tone: negative
        - label: 基准情形
          low: 5
          mid: 6.5
          high: 8
          displayValue: RMB5B-RMB8B
          detail: 符合高速增长 ChiNext 硬科技首发常见的温和上调，约为最后一轮私募估值的 1.2x-1.8x。
          tone: warning
        - label: 乐观情形
          low: 9
          mid: 10
          high: 12
          displayValue: RMB9B-RMB12B
          detail: 若行业情绪和出货排名保持强劲，定价可能接近或高于市场隐含的约 RMB10B 水平。
          tone: positive
    approximationNotes: 区间是以十亿元人民币计的情景估值输出，用于投委会讨论；它们不是管理层指引，也不是公司发布的价格区间。
    claimRefs:
      - CV005
      - CV017
      - CV028
      - CV029
      - CV030
      - CV035
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Leju 在市场增长和证据质量上得分较高；但定价缺口未解、行业泡沫警示仍在，单位经济和估值支撑偏弱。
    data:
      items:
        - label: 市场增长
          score: 8
          detail: 中国人形机器人市场到 2030 年预计 CAGR 为 47.6%，长期空间仍足。
          tone: positive
        - label: 商业化证明
          score: 5
          detail: 出货量和收入增长是真实的，但主要集中在数据采集和教育，而非工业部署。
          tone: warning
        - label: 竞争护城河
          score: 4
          detail: Unitree 和 AgiBot 预计占据 2026 年中国出货量约 80%，资本实力也更强。
          tone: warning
        - label: 单位经济
          score: 3
          detail: 毛利率连续三年降至 40.78%，经营现金流也连续三年为负。
          tone: negative
        - label: 估值支撑
          score: 3
          detail: 公司引用的下限与市场隐含上限之间约 3.3x 的差距，说明定价仍未解决。
          tone: negative
        - label: 治理 / 披露
          score: 5
          detail: 已有主保荐人申报文件，但股权集中度、稀释和锁定期细节仍不完整。
          tone: warning
        - label: 证据质量
          score: 6
          detail: 一手申报文件和独立可比公司数据之间有较好相互印证，尽管部分同业数据存在冲突。
          tone: neutral
    approximationNotes: 评分为 0-10 的序数判断，由已审阅公开证据综合而来，用于投委会讨论。
    claimRefs:
      - CV004
      - CV009
      - CV017
      - CV018
      - CV030
      - CV041
