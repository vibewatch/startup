      - number: '8.3'
        title: 牛 / 基准 / 熊：每个价格点需要成立什么
        blocks:
          - type: paragraph
            body: >-
              牛市情景要求当前行业叙事继续复利，而不是修正。如果中国市场 47.6% CAGR 成立，Leju 守住第一梯队出货排名，且工业部署显著超出当前 3.88% 收入占比，那么 IPO 定价接近或高于市场隐含的约
              RMB 10 billion 就有防守空间——这种重估路径有点像 Figure AI 从 2024 年初 $2.6 billion 估值，升至 2025 年 9 月 $39 billion 投后估值，18 个月约
              15 倍。


              基准情景更保守，也更符合当前证据：增速从 2023-2025 年 118.68% CAGR 回落到仍然很快但更可持续的节奏，毛利率稳定在 40% 附近，公司自己的 2028 年盈利目标不变，从而支持 IPO
              价格落在上一轮私人估值与分析师隐含上限之间。


              熊市情景仅凭公开证据最容易防守。Morgan Stanley 自己的 2026 年展望提醒，在技术和商业化障碍未解决时，「短期炒作」会持续；另一项 Morgan Stanley 引用的调查发现，在 2025
              年合计出货约 14,000 台的中国人形机器人行业里，只有 23% 的企业买方对当前可用人形机器人满意。如果估值与部署现实之间的缺口通过价格而非产品改善来收敛，Leju IPO 可能按 2025 年 10
              月估值或更低定价，对最新一轮 IPO 前投资者而言实质就是降估值轮。
