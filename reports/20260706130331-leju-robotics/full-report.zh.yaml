chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、商业模式与公司结构
        blocks:
          - type: paragraph
            body: >
              Leju Robotics 由 Leng Xiaokun（冷晓琨）牵头的一支 Harbin Institute of Technology（HIT）毕业生团队于 2016 年在深圳创立。2025
              年公司完成法律重组，IPO 申报前由 Leju Robot (Shenzhen) Co., Ltd. 更名为 Leju Intelligence (Shenzhen) Co.,
              Ltd.。总部仍在中国广东深圳，并在哈尔滨、杭州设办公室。


              公司定位为纯人形机器人企业，三条产品线分别是：面向工业和商业应用的 KUAVO 全尺寸人形机器人；面向 AI 科研与教育的 Roban 中小型人形机器人；面向小学 STEM 教育的 Aelos
              小型机器人。2025 年，KUAVO 系列收入占总营业收入 69.5%（RMB 258M 总收入中的 RMB 178M），是压倒性收入来源。商业模式面向
              B2B/B2G，采用直销与渠道分销混合打法，这套渠道能力来自多年教育市场积累。


              Leju 早期凭 Aelos 机器人切入基础编程教育市场（2016-2017 年），2023 年将战略重心转向通用全尺寸人形机器人。截至 2025 年，KUAVO 主要落地场景包括数据采集（KUAVO 收入
              45%）、科研与教育（32.5%）、商业服务（18.7%）和早期工业制造（3.88%）。公司按 ChiNext 第四套上市标准申报深圳 ChiNext IPO，申请于 2026 年 5 月 19 日获受理。
