        - 创始人主导，产品覆盖全尺寸 + 中小型（Kuavo/Roban/Aelos）；Huawei HarmonyOS 合作和 Tencent 股权纽带
        - 五家画像同业中收入基底最小；净亏损扩大；单一供应商集中风险
      - - Unitree Robotics
        - 直接同业 / 类别龙头
        - >-
          FY2025 收入 RMB 1.699-1.71B，同比增长约 335%，首次盈利；IPO 估值据报 $7B（2025 年 9 月），到 2026 年 6 月趋近约 $6.2B；投资方包括
          Geely、Alibaba、Tencent、Sequoia China
        - 消费者 / 准专业买方、研究实验室，以及越来越多的工业 / 数据采集客户
        - 垂直整合最深（核心部件 >90% 自研 / 自制），品类内 ASP 最低，开源开发者生态活跃
        - IP 组合仍相对小；销量增长高度依赖 ASP 持续下降
      - - AgiBot (Zhiyuan Robotics)
        - 直接同业 / 类别龙头
        - Tracxn 显示 3 轮共融资 $83.8M（Getlatka 则为 $520M，数据冲突未解决）；2026 年 3 月第 10,000 台下线，约 2026 年 6 月达第 15,000 台
        - 政府关联数据采集部署、科研伙伴、具身 AI 数据集客户
        - 品类内产能爬坡最快（3 个月从 5,000 台到 10,000 台）；上海政府支持的数据采集基地；Guinness World Record 耐力行走纪录
        - 没有独立、招股书级财务披露；商业部署与展示 / 试点机型之间的拆分不清晰
      - - UBTECH Robotics (09880.HK)
        - 在位者（上市）
        - FY2025 总收入 RMB 2.001B（同比 +53.3%）；全尺寸具身 AI 人形机器人板块收入从 RMB 35.6M 增至 RMB 820M（+2,203.7%）；按 FY2025 审计结果仍亏损
        - 工业 / 物流客户（如汽车概念测试）、教育和服务机器人买方
        - 唯一上市的人形机器人纯标的在位者，有公开审计财务数据；Walker S2 具备自主换电能力；单年交付量最大（1,079 台 Walker S）
        - 人形机器人板块在更宽的传统教育 / 服务机器人收入基底中仍占少数（41.1%）；公司继续录得净亏损
      - - Fourier Intelligence
        - 直接同业（规模较小）
        - 2025 年 1 月据报完成约 RMB 800M（约 $109M）Series E 轮；CBInsights 独立跟踪（2025 年 5 月快照）
