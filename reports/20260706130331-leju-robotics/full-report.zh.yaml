      - number: '5.4'
        title: 差异化、知识产权与信任 / 合规风险
        blocks:
          - type: paragraph
            body: >
              Leju 的差异化叙事靠三条腿：与 HarmonyOS / Huawei 的早期深度关系（KaihongOS、Pangu 集成、2025 年 5G-A 演示），核心部件和运动控制技术上累计近 100
              项发明专利，并与 Harbin Institute of Technology、Soochow University、Shandong University、BIGAI 保持研究合作，以及多数全尺寸人形 OEM
              不会公开的开源开发者界面。抵消它的是具体的合规和供应链缺口。认证方面，CAICT 的 CTTL-T 实验室在 2024 年让早期约 45 kg / 26-DoF 的 KUAVO 机型通过了 13
              维通用本体测试，但没有来源显示当前 Kuavo 5 一代重新测试过，也没有来源显示 Leju 持有 ISO 9001、ISO 13482 或同等国际认证；中国首个人形机器人 / 具身 AI 国家标准体系（2026
              年 3 月发布）是全行业标准，不是 Leju 专属合规标志。供应链方面，Leju 自己 IPO 申报披露（据财经媒体报道）显示，关节模块和控制器约占采购额 33%，单一供应商 Wuxi Quanzhibo 供应约
              82.8% 的关节模块和 17.2% 的总采购额——这是公司自己提示的集中度风险，且未披露第二来源计划。关于中国 2026 年人形机器人行业的独立评论也提醒，以模仿学习为中心的 R&D
              可能尚未达到精密工业制造要求的水平，因此不能把数据采集和研究场景的牵引过度解读为工业就绪度。
