  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入流、结构、定价与确认
        blocks:
          - type: paragraph
            body: >
              Leju 的 ChiNext 招股书于 2026 年 5 月 19 日获深圳证券交易所受理，披露营业收入为 RMB 54 million（2023）、RMB 56 million（2024）和 RMB 258
              million（2025），三年复合年增长率 118.68%。KUAVO 全尺寸人形机器人线拉动突破：2025 年售出 577 台（2024 年为 32 台），贡献 RMB 178 million，占 2025
              年收入 69.5%。Roban（中/小型科研教育人形机器人）和 Aelos（STEM 教育机器人）合计贡献 RMB 39.45 million，同比增长 47.35%，销量分别为 91 台和 3,988
              台；公司官方材料将这些收入归入科研、商业服务、工业和训练场解决方案等类别。KUAVO 内部，数据采集合约在 2025 年成为最大部署场景，占分部收入
              44.94%，高于科研/教育和商业服务；工业制造部署大多仍处概念验证阶段，仅占 KUAVO 收入 3.88%（约 RMB 6.9 million）。KUAVO 综合平均售价同比下降 25.56% 至约 RMB
              308,100/台，这是招股书所称有意为之的以价换量策略。由于场景级收入只披露为占比，而非独立利润表科目，Roban/Aelos
              收入也合并披露，仅靠二手报道无法确认精确收入确认时点（交付还是客户验收）和单独产品线盈利能力。
