      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >
              中国人形机器人市场有强结构性顺风。政府政策是首要催化剂：第十五个五年规划把具身智能列为核心战略支柱；2026 年 3 月，由 120+ 家机构起草的人形机器人国家标准体系带来监管清晰度。MIIT 和 SASAC
              启动 2026 专项行动，加速商业部署从实验室走向工厂车间。


              中国人口老龄化和劳动力下降带来持续需求。制造、物流和养老护理的结构性劳动力短缺尤其尖锐。中国庞大的机器人供应链和制造基础设施，也让成本下降曲线快于美国或欧洲竞争者。


              但采用约束仍然显著。技术门槛包括在非结构化环境中实现可靠自主、灵巧操作和对人安全运行。经济门槛包括较高单机成本（尽管在下降）、许多应用 ROI 不清晰，以及 Leju 当前 KUAVO 收入只有 3.88%
              来自工业制造——这说明最高价值用例仍处萌芽期。


              监管约束包括安全标准仍在演进、机器人事故责任框架尚未建立，以及公共空间中 AI 训练机器人带来的数据隐私担忧。Unitree、AgiBot、UBTECH 等资金充足的同业合计约 80%
              市场份额，竞争强度压低毛利率。500K-800K 专业人才缺口限制全行业扩张能力。
