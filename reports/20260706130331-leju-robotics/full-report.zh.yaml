      - number: '8.5'
        title: 退出就绪度与能改变判断的尽调问题
        blocks:
          - type: paragraph
            body: >-
              退出就绪度应被视为有条件，而不是已确认。Leju 没有控股股东；根据保荐人自己的上市推荐，三名具名实际控制人通过一致行动安排掌权，而不是单一多数股权。公开来源没有披露这些控制人在 IPO 后的持股比例、2025
              年 10 月轮十多家机构投资者的股权表位置，或上市后适用的任何锁定期和股份转让条款。这是一个真实缺口，因为在中国成长股上市中，锁定期到期常常驱动上市后股价波动。


              因此，最影响决策的否决触发器都很具体且可跟踪：IPO 价格落在或低于 RMB 3 billion 法定底线；毛利率在已经下滑到 40.78% 的基础上继续下降；对数据采集合约（2025 年收入的
              44.94%）依赖加深，而不是转向多元工业部署；以及任何迹象显示企业买方满意度维持在 Morgan Stanley 引用的更广行业 23%
              附近。最终尽调应优先确认发行价和配售、数据采集收入背后的具名客户集中度、RMB 2.6 billion 募资用途拆分，以及目前公开记录中最大的证据缺口——所有权 / 锁定期细节。
