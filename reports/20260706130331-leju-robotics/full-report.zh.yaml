      - number: '7.6'
        title: 图表与证据
        blocks:
          - type: callout
            title: 单一供应商执行器依赖是最高严重度运营风险
            body: Leju 被报道依赖集中的执行器供应商基础，包括 Wuxi Quanzhibo，且没有披露第二来源认证；这是识别出的单一最高严重度运营风险：供应中断会直接让 Kuavo 停产。
            calloutType: risk
            claimRefs:
              - CR007
              - CR008
          - type: callout
            title: 数据采集收入约占业务 45%，可能不具备持久性
            body: 独立评论提示，Leju 最大收入板块——AI 训练数据采集服务——可能在基础模型开发者积累足够训练数据后收缩；工业板块尚未规模化（仅占 FY2025 收入 3.88%），还不能抵消这一需求耐久性风险。
            calloutType: risk
            claimRefs:
              - CR023
              - CR025
          - type: callout
            title: 与 Unitree 和 UBTech 的毛利率差距显示规模劣势
            body: Leju FY2025 毛利率为 40.78%，低于 Unitree 约 62.9% 和 UBTech 约 54.6%；这表明即便享有相近行业顺风，Leju 仍未达到两家最大国内同行的制造规模或成本结构纪律。
            calloutType: insight
            claimRefs:
              - CR006
              - CR027
          - type: callout
            title: 把第二来源认证、HEIS 认证和 ChiNext 审核状态作为近期尽调触发器跟踪
            body: 未来 12 个月最影响决策的三项监控事项是：确认执行器第二来源认证、Leju 的具体 HEIS 认证等级，以及 SZSE ChiNext 审核结果——若上市撤回或被否，将打破投资假设。
            calloutType: recommendation
