      - number: '8.4'
        title: 竞争强度与全行业泡沫风险是最大摇摆因素
        blocks:
          - type: paragraph
            body: >-
              Leju 不是孤立竞争，可比公司组合提示两条线都要谨慎。第一，TrendForce 预计 Unitree 和 AgiBot 合计将在 2026 年拿下中国人形机器人出货近 80%，即便行业总产量激增，Leju
              和数十家小玩家也只能争夺收缩的剩余份额。Unitree 竞争性的 STAR Market 申报已经披露真实盈利能力（RMB 1.7 billion 收入对应 RMB 600 million
              调整后净利润），这会抬高投资者对其后所有中国人形机器人 IPO 的要求，包括 Leju。


              第二，更结构性地看，独立评论和分析师评论越来越多地把整个中国人形机器人品类描述为过热。援引 Bloomberg 的报道警告，Unitree、AgiBot
              等公司的估值「飙升」、有时数月内翻倍，泡沫风险正在积累；其他评论也单独把人形机器人称为「下一个 AI 泡沫」候选，因为资本流入快于已验证的变现能力。关于该行业 150
              多家活跃公司的报道还指出，中国政府自身已发出「清算」即将到来的信号。这些都不专指 Leju 产品质量，但直接关系到任何 IPO 买方愿意支付的价格，因为全行业情绪重置很可能压缩 Leju
              倍数，不管公司自身执行如何。
