  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 缓释 / 尽调问题
    rows:
      - - Leju 的数据采集商业化利基（占 Kuavo 收入 45%）在工业 ROI 成熟前，提供了早期且有防守性的收入流
        - Unitree 和 AgiBot 部署规模都更大；AgiBot 还有政府支持的数据采集基础设施，数据服务业务规模可能超过 Leju
        - 重大
        - 尽调问题：索取 Leju 数据采集客户集中度和合同续约率，并对比 Unitree/AgiBot 的竞争赢 / 输数据
      - - Leju 与 Huawei（HarmonyOS、5G-A）和 Tencent（7.32% 股权）生态绑定，可能带来分销和技术平台杠杆
        - 这些关系仍属早期（例如 Tencent 合作尚未开始运营）；生态伙伴也可能转而偏向 Unitree 或 UBTECH 这类更大出货量伙伴
        - 重大
        - 尽调问题：核验具体商业里程碑（联名产品、收入分成），不要只看新闻稿阶段的合作公告
      - - Unitree 的垂直整合（>90% 核心组件自研）和品类最低 ASP，形成更耐久的成本曲线护城河
        - 为守住份额而激进降价，可能加速全品类商品化，挤压包括 Leju 在内的小型同业毛利
        - 重大
        - 尽调问题：测算未来两年全品类 ASP 再降 20-30% 时 Leju 的利润率敏感性
      - - AgiBot 政府支持的上海数据采集基地和政治可见度（Xi Jinping 到访、Guinness World Record）支撑超额品牌与数据集规模优势
        - 公司披露的生产里程碑（第 10,000 / 15,000 台）未获独立验证，可能高估持续商业使用（相对展示用途）的台数
        - 较小
        - 尽调问题：做第三方渠道核查，对比 AgiBot 实际付费客户数与总产出台数
      - - 车企进入者（Xpeng、Li Auto）带来资本和制造规模，可能压缩包括 Leju、Unitree、Fourier 在内的整个独立供应商品类
        - 一旦车企实质投入该品类，可能用低价或更强渠道压制独立人形机器人厂商；但目前尚无车企规模化出货人形机器人
        - 重大
        - 尽调问题：未来 12-18 个月跟踪 Xpeng/Li Auto 的人形机器人出货公告和定价，把它作为领先指标
      - - 中国《国家情报法》第 7 条和已披露安全事件（Unitree 蓝牙漏洞、疑似远程访问隧道）给所有中国总部人形机器人供应商带来结构性信任 / 监管压力，Leju 也不例外
        - 国际买家（尤其美国 / 盟国政府或国防相邻客户）可能不看单家公司安全实践，直接排除中国来源人形机器人供应商
        - 重大
        - 尽调问题：评估 Leju 可服务客户中中国大陆以外占比，以及该部分对进口 / 安全限制的暴露度
      - - 更广泛的市场商品化风险：Counterpoint 称中国有 100+ 家人形机器人厂商，且全品类价格下行（Unitree R1 RMB 26,900、Noetix Bumi RMB 9,998），挤压中等规模玩家差异化
        - Leju RMB 258M 的收入基数相对 Unitree（RMB 1.7B+）和 UBTECH（RMB 2.0B）偏小，在利润率进一步转负前，吸收价格压缩的空间更窄
        - 重大
        - 尽调问题：按当前 40.78% 毛利率和 FY2025 RMB 69.78M 净亏损轨迹，量化 Leju 的最低可行 ASP
      - - Leju 供应链集中度（Wuxi Quanzhibo 占总采购 17.20%、关节模组采购 82.82%）是 Leju 自身披露的单一供应商依赖风险
        - 若该供应商供货中断或重新谈判，Kuavo 生产会直接受损；相比之下，Unitree 自研组件占比更高，更能隔离单一供应商冲击
        - 重大
        - 尽调问题：索取 Leju 供应商多元化路线图，以及关节模组组件双源供应计划
    notes: 严重性体现主张作者基于证据对 Leju 竞争耐久性影响的判断，不是公司披露的风险评级；所有威胁都绑定具体主张 / 来源组合，而非泛泛行业评论。
