      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >
              人形机器人市场在不同细分场景里，买方、用户和付款方并不相同。数据采集是 Leju 最大收入场景，占 KUAVO 收入 45%；买方是 AI 公司和科研机构，采购人形平台来为具身智能模型生成训练数据。付款方通常是
              AI 公司的研发预算，实际用户是机器人/AI 工程师。


              科研与教育占 KUAVO 收入 32.5%，买方为高校、科研院所和政府教育主管部门。采购遵循 B2G/B2B 模式，采用标准化招投标流程，预算归属于机构研发或教育技术预算。商业服务占
              18.7%，买方是寻求面向客户或活动场景机器人的企业，付款方通常是营销或运营预算。


              工业制造仅占 KUAVO 收入 3.88%，但长期增长机会最大，目标客户包括汽车 OEM、电子制造商和物流公司。买方通常是工厂/运营经理，掌握资本开支或自动化预算。采用触发因素包括劳动力短缺（中国结构性缺口为
              500,000–800,000 名机器人专业人才）、制造省份工资上涨，以及政府对智能制造升级的补贴。


              单位成本下降、可靠性提升后，买方画像正从早期采用者（科研机构、科技公司）转向主流工业用户；Leju 2025 年降价 25.56% 的策略就是证据。
