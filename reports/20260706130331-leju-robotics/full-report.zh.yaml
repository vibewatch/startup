      - number: '7.4'
        title: 财务与商业模式风险
        blocks:
          - type: paragraph
            body: >
              过去三个财年，Leju 每年都录得净亏损（2023 年 CNY 41.12 million，2025 年升至 CNY 71.25 million），经营现金流持续为负；尽管 FY2025 收入增长 365.2%
              至 CNY 258 million。管理层把 2028 年定为整体盈利最早年份，这一目标依赖毛利率继续改善和工业板块规模化，而后者尚未出现（工业收入仅为 FY2025 总收入的 3.88%）。


              ChiNext IPO 拟募资约 CNY 2.6 billion（~$382.7 million），超过 FY2025 收入十倍，资金投向 R&D、产能扩张和营运资金，而不是减债。在此之前，公司已有累计 IPO
              前融资历史，包括约 CNY 1.5 billion 的 IPO 前轮融资，以及更早来自 Tencent、Shenzhen Capital Group
              等战略投资者的轮次。独立评论质疑，考虑到全行业仍在亏损，当前人形机器人估值——包括 Leju 这类公司的 IPO 前定价预期——是否有近期基本面支撑。


              Leju 申报时，中国机器人 / AI IPO 档期拥挤（包括 Unitree 自身 STAR Market 上市委会议已通过），投资者资金和上市委注意力竞争加剧。考虑到三年亏损和经营现金流为负，Leju
              近期财务位置对成功上市或持续外部融资很敏感。
