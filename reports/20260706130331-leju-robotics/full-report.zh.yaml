  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >
              Leju Robotics 的 ChiNext IPO 申请于 2026-05-19 被 Shenzhen Stock Exchange
              正式受理，成为首家按交易所新引入的第四套上市标准申报的未盈利科技公司。该标准源自 CSRC 2026 年 4 月推出的 ChiNext 改革，要求估值达到 CNY 3 billion 且三年收入 CAGR 为
              30%，或估值达到 CNY 4 billion 且累计 R&D 支出超过 CNY 100 million 并占收入 15%。审核结果和时间仍未确认。


              中国于 2026 年 3 月发布首个人形机器人国家标准体系（HEIS），由 120 多家机构参与起草，覆盖基础共性、计算、零部件、整机、应用和安全 / 伦理。Leju
              在该标准下的具体认证等级尚未得到独立确认，上市前仍留下监管合规问题。


              国际方面，美国在 2026 年收紧对中国的 Nvidia AI 芯片出口许可，并对先进加速器引入逐案 BIS 审查，直接影响具身 AI 开发者依赖的计算硬件。美国国会提出两党 GUARD
              Act，目标是中国制造机器人；若立法通过，可能限制中国人形机器人厂商进入美国市场。中国法院也在积极审理机器人 IP 纠纷，中国不断扩展的 AI / 算法合规制度，则给 Leju
              的数据采集收入板块增加持续备案负担。
