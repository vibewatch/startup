      - number: '6.3'
        title: 政府锚定的数据渠道与工业垂直经济性
        blocks:
          - type: paragraph
            body: >-
              Shijingshan 关系说明，Leju 已披露的最大单一合同实际上如何发挥客户渠道作用：Phase I 于 2025 年 3 月开业，面积 3,000 平方米，在区政府支持下 22 天建成，包含 108
              台不同形态机器人和 10 个场景区；五个月后扩展为专门的 Phase II 仅 Kuavo 合同，覆盖 10,000+ 平方米，目标是每年生成超过 6 million 条真机数据记录，跨 100 个工位（约
              5,000 数据采集小时 / 月）和 16 个子场景，涵盖工业制造、智能家居、养老和 5G 集成。这个生态中提到的具名对手方包括 Dongfang Precision、Haosen
              Intelligent、Peking University's Wuhan AI Research Institute、Zhengzhou University、Haichen 和 Yuyi
              Technology；但除主要 Shijingshan 标书外，Leju 与每个具名方之间的具体商业条款在已审阅来源中没有逐项列出。相比之下，Leju 工业制造垂直场景——Kuavo 收入中最小的
              3.88%——仍锚定在一个已披露概念验证（FAW Hongqi 工厂箱体搬运试验），没有确认转化为规模化生产订单。这种不对称很重要：Leju 的全球出货排名（按台数第 3-4，Counterpoint 约 5%
              份额）压倒性地由数据采集和研究 / 教育场景驱动；二者合计占 2025 年 Kuavo 收入超过四分之三。同行 Unitree（RMB1.708 billion 收入、已盈利）和 UBTech（约 RMB2
              billion 收入）的收入规模是 Leju 2025 年总收入 RMB258 million 的四到七倍，客户结构也实质不同，更偏工业和消费。
            claimRefs:
