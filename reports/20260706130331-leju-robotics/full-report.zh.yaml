      - number: '3.3'
        title: 能力、定价、销售/分销与信任/监管对比
        blocks:
          - type: paragraph
            body: >-
              披露价格看，Unitree 锚定品类低端：CNBC 报道其 G1 起售价约 $16,000，2026 年发布的 R1 平台起售价仅 RMB 26,900（~$3,968），是 Unitree
              已出货人形机器人中最便宜的一款。Leju 的 Kuavo 系列位于中档，2025 年平均售价 RMB 308,100，同比下降近 26%——这是有意为之的竞争打法，也符合全行业降价趋势（Noetix 的 Bumi
              为 RMB 9,998，Booster 的 K1 为 RMB 29,900，甚至工业级 Astribot T1 也为 RMB 89,900）。相比之下，UBTECH 的 Walker S2 估计接近 RMB
              760,000，定位于连续运行的工业用例（自主换电、24/7 运行），而不是面向规模消费销售。AgiBot 和 Fourier
              均未公开披露旗舰平台标价，这是实质可比性缺口，本章将其保留在证据缺口中，而非自行估算。


              销售与分销看，Unitree 把最低价格点、最深垂直整合（90%+ 核心部件自制）和活跃开源开发者生态（unitree_sdk2、unitree_rl_gym
              及相关仓库）结合起来，降低第三方开发者基于其硬件开发的门槛。AgiBot 则依靠政府关联分销——上海官方支持的数据采集场地，以及包括 2025 年 4 月 Xi Jinping
              到访在内的高规格政治可见度；UBTECH 则利用上市公司身份和 Airbus 等具名工业试点客户，推进 Walker S2 概念测试。


              信任与监管姿态看，Unitree 和 AgiBot 作为中国总部公司，均受中国 2017 年《国家情报法》第 7 条约束，需要配合国家情报工作；Tech Times 还报道，Unitree 机器人在 2025 年
              9 月披露一项可蠕虫传播的 Bluetooth 安全漏洞，美国国会委员会也指控部署在美国政府设施的 Unitree 系统存在远程访问隧道。这些是 Leju 国际竞争中所有中国总部厂商都会面对的结构性风险，包括
              Leju 本身；无论单家公司实践如何，都会实质影响与安全敏感型西方买家的交易可行性。
