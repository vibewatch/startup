      - number: '3.4'
        title: 切换成本、锁定、多供应商、分销权力与供应/伙伴准入
        blocks:
          - type: paragraph
            body: >-
              当前大多数人形机器人部署——包括 Leju
              自有数据采集、科研/教育和商业服务项目——切换成本仍在低到中等，因为部署还处于试点规模，尚未嵌入任务关键型生产线。买方因此可以多供应商并行，或在合同周期之间切换，不需要大规模重做集成；这种动态让竞争强度保持高位，也给买方相对任何单一厂商（包括
              Leju）的议价权。例外是数据采集客户：某一机器人的具体形态和传感器套件会固化进训练数据集；若在数据集构建中途更换厂商，就需要高成本重新采集，形成真实但狭窄的锁定，结构上更有利于已部署规模最大的厂商——目前是
              Unitree 和 AgiBot，而不是 Leju。


              供应与伙伴准入看，Unitree 的垂直整合（90%+ 核心部件自制，单台生产成本从 RMB 73,200 降至 RMB 62,200）提供了较强的外部供应冲击缓冲，小型同业不具备这种保护。相比之下，Leju
              在自家招股书披露供应链集中：单一供应商 Wuxi Quanzhibo 占 Leju 2025 年总采购额 17.20%，在关节模组采购中占
              82.82%——这是已披露依赖风险；如果双方关系中断或重谈条件不利，Kuavo 生产会直接受损。


              分销权力看，Xpeng、Li Auto 等车企新进入者具备内在优势：它们已经拥有服务 EV
              制造规模的供应链和零售/服务网络，据称超过一半核心部件（电机、减速器）可在不新增产能投资的情况下转向人形机器人生产。未来数年只要车企真正投入人形机器人品类，它们会比本章四家直接同业创业公司（包括
              Leju）更快拿到分销规模。
            claimRefs:
              - CP013
              - CP032
              - CP033
              - CP045
              - CP047
              - CP055
      - number: '3.5'
        title: 护城河持久性、商品化风险与不利竞品证据
        blocks:
          - type: paragraph
            body: >-
              Leju 最清晰的近端护城河是数据采集商业化利基，管理层把它视为更广泛工业 ROI 成熟前可防守的收入流；2025 年数据采集占 Kuavo 收入 45%，科研/教育占 32.5%，商业服务占
              18.7%，工业制造仅占 3.88%（由早期 FAW 概念验证部署佐证）。但这条护城河正受到 AgiBot 政府支持的上海数据采集基础设施和 Unitree
              更大部署机群的直接挤压；二者都能在规模上生成可比甚至更多训练数据。


              商品化风险很高，而且是全行业问题。行业数据平台 GGII 报告，中国 2025 年人形机器人出货量达到 14,400 台，2026 年产量预测从 100,000 到 200,000
              台不等——区间异常宽，本身就显示预测不确定。Counterpoint Research 的 Ethan Qi 预计，当前 100+ 家中国人形机器人厂商将在 Unitree 等领导者 IPO
              后整合到数十家；这意味着 Leju 这类中等规模玩家面临真实出清风险，因为它们缺少 Unitree 或 AgiBot 的成本曲线和出货规模。不利第三方证据进一步强化这一点：Morgan Stanley 2025
              年 11 月研究报告指出，大脑/VLA 模型成熟度、部件质量一致性和成本压力仍有缺口；随后 Morgan Stanley 买方调查发现，仅 23% 潜在工业买方对当前可得人形机器人产品表示满意；Goldman
              Sachs 警告，在确定订单之前扩产会带来产能过剩风险；中国国家发展改革委也公开提示，150+ 家国内人形机器人企业存在生产“高度重复产品”的风险。Forbes 和 France24/AFP
              都用明确的泡沫风险框架描述更广泛建设潮；包括 GSR Ventures 的 Allen Zhu 以及 ZhenFund、Sinovation Ventures
              等机构在内的风险投资人，也表达了对短期商业可行性的怀疑。多数被引用的机构和学术声音预计，真正商业成熟还需要 5 到 10 年。


              综合来看，Leju
              护城河的持久性较少取决于近端工业部署（目前仍是收入少数），更多取决于能否守住数据采集利基和平台伙伴关系（Huawei、Tencent），抵御扩张更快、资本更厚的同业。同时，全行业不利信号——监管提示、买方不满和分析师怀疑——会同步压制所有中国人形机器人厂商的增长假设，而不是只针对
              Leju。
