      - number: '1.5'
        title: 封面指标与证据缺口
        blocks:
          - type: paragraph
            body: >
              基于已披露招股书数据和经核验的第三方报道，截至 2026 年中，Leju Robotics 的关键封面指标为：IPO 前轮投后估值 RMB 4.327 billion（按当前汇率约 $600M），目标 IPO
              估值约 RMB 10 billion（约 $1.4B）；累计融资约 $250 million；2025 年营业收入 RMB 258 million（约 $36M）；毛利率 40.78%（2025）；2025
              年净亏损 RMB 69.78 million，公司自行预计 2028 年盈利。


              公司 2025 年出货 577 台 KUAVO 和 3,988 台 Aelos。人员数据有限——Tracxn 报告截至 2026 年 4 月约 13
              名员工，但很可能只覆盖被追踪的高管/创始团队，而非全部员工。总员工数尚无公开确认。2025 年实际值之后的收入年化速度、ARR 拆分，以及按部署场景划分的详细客户数，在 IPO 招股书更新前仍未披露。


              关键缺口包括：当前准确员工数、客户留存指标、各部署场景单位经济、主要股东之外的详细股权结构表，以及 2025 年后的收入轨迹。IPO 披露要求生效后，上述缺口预计会收窄。
