  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局：同业、在位者、相邻玩家、替代方案与新进入者
        blocks:
          - type: paragraph
            body: >-
              Leju Robotics（乐聚机器人）由 Leng Xiaokun 与联合创始人 Chang Lin、An Ziwei 于 2016
              年在深圳创立，身处拥挤且快速整合的中国人形机器人赛道。其直接同业包括本章深入画像的四家公司：Unitree Robotics 和 AgiBot（Zhiyuan Robotics）——TrendForce
              预计二者合计将拿下中国人形机器人总出货量近 80%；UBTECH Robotics 是唯一已上市、拥有经审计公开财务数据的纯人形机器人在位者；Fourier Intelligence 则从医疗机器人传承延伸到
              GRx 系列通用人形机器人。


              除这四家公司外，市场还出现一类相邻新进入者：现金充裕的中国车企。XPeng CEO He Xiaopeng 于 2026 年 6 月 10 日发布全员战略转向信，释放车企将用既有 EV
              制造规模和资产负债表厚度参战的信号。单靠资本，Leju 这类独立厂商很难匹配这类结构性威胁。Counterpoint Research 称，中国还有 100+ 家人形机器人厂商长尾，包括
              Astribot、Noetix Robotics 等低成本进入者，进一步从下方推高商品化压力。


              最后，现状替代方案——传统工业机器人、AGV 和人工劳动力——仍是多数买家的理性默认选择。AFP/France24
              援引中国官员的报道确认，尽管行业资本快速形成，经过验证的大规模真实人形机器人用例仍难找到；这意味着自研或非人形自动化仍会在纯 ROI 基础上，与本章所有厂商（包括 Leju）直接竞争。
