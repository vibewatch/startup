      - number: '5.2'
        title: 架构、运营模式与制造
        blocks:
          - type: paragraph
            body: >
              KUAVO 的技术栈分三层：设备 / 连接中间件用 Huawei 基于 OpenHarmony 的 KaihongOS，本地多模态 AI 推理用机载 Nvidia Jetson Thor 计算模块，AI /
              模型层则在官方展商清单中被描述为集成 Huawei Pangu、ByteDance Doubao 和 Alibaba Cloud Qwen，用于感知和任务规划。运动和操作依靠自研高扭矩电动关节（KUAVO-MY
              版本最高 360 Nm）；本章审阅的来源都无法确认行业二级摘要里偶尔提到的线缆 / 腱驱执行器设计，因此该说法被视为未验证，而不是已采信。Leju
              将运动控制层开源：kuavo-ros-opensource（ROS1、nMPC / 全身控制、MuJoCo / Gazebo / Isaac Sim 仿真支持、MIT license）和 kuavo_data_
              challenge，后者是基于 LeRobot 的工具包，可把 rosbag 采集转换为训练数据。制造端，Leju 在 Shenzhen 运营研发和试产线（约 500-1,000 台 / 年），再供给与
              Dongfang Precision 于 2026 年 3 月开设的 Foshan 量产线；该线标称年产能超过 10,000 台，包含 24 道装配步骤、77 项检验、41 个自动测试站，并声称单台节拍为 30
              分钟。这个产能说法很新，满负荷运行仍未经验证。
