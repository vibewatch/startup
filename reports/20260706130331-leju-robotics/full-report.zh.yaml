  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础与分层
        blocks:
          - type: paragraph
            body: >-
              Leju 将三条产品线卖给结构不同的买方 / 用户 / 付款方组合。Kuavo 全尺寸人形机器人服务于 2025 年披露的四个收入场景：数据采集运营方（政府牵头的训练中心和数据集买家）、研究 /
              教育机构、商业服务场馆，以及工业制造工厂。Roban（中小型人形机器人）面向 AI 研究实验室和高等教育科学项目，Aelos（小型人形机器人）面向中小学 STEM 教育；销售依托 Leju 在 2016-2023
              年教育市场时期搭建的直销 + 渠道分销网络，2023 年之后商业重心转向 Kuavo
              时又复用这套网络。买方、用户、付款方经常分离：政府产业发展公司可以是付款方和签约方，而实际「用户」是机器人本身，为另一个数据消费市场生成训练数据；高校实验室可以是用户，省级科技基金则是付款方。Leju
              官网把商业产品组织为四类解决方案（研究场景、商业服务、工业场景、训练场），正好对应 IPO 相关财务中披露的四个 Kuavo 收入场景。地域上，已具名机构关系至少覆盖 Beijing（Shijingshan
              数据训练枢纽）、Heilongjiang（Harbin Institute of Technology）、Henan（Zhengzhou University）和 Guangdong（总部及 Dongfang
              Precision 制造），但这些锚点之外的工业和商业垂直客户没有按名称披露。独立聚合网站按买方类型给 Leju 当前两款 Kuavo 报出差异很大的价格：KUAVO 5 面向更广泛工业 / 研究 /
              服务市场，约 $38,000；KUAVO-MY 专门面向实验室、企业和创新中心，价格 $50,000-$150,000。这说明 Leju 的「客户」不是单一同质买方画像，而是同一产品家族内跨度很大的支出区间。
