      - number: '3.2'
        title: 竞争对手画像：规模、融资、客户、产品范围与战略
        blocks:
          - type: paragraph
            body: >-
              Unitree 是规模最清晰的品类领导者：FY2025 收入达到 RMB 1.699-1.71 billion（同比约增长 335%），并首次盈利；2026 年 6 月 1 日，其 STAR Market IPO
              获放行，估值从 2025 年 9 月报道的约 $7 billion 演变到 2026 年中约 $6.2 billion，投资方包括 Geely、Alibaba、Tencent、Sequoia China 和
              Ant Group。AgiBot 由前 Huawei 工程师 Deng Taihua 与 Peng Zhihui 于 2023 年 2 月创立，背后有 HongShan、Hillhouse 和 BYD
              支持，是同业中产能爬坡最快的公司——从 2024 年 12 月 962 台增至 2026 年 3 月 30 日第 10,000
              台下线；上海政府支持的数据采集场地提供助力。不过，不同追踪机构对其累计融资口径不一致（Tracxn 为 $83.8 million，Getlatka 为 $520 million）。


              UBTECH FY2025 业绩显示总收入 RMB 2.001 billion（+53.3%），全尺寸具身 AI 人形机器人分部收入从 RMB 35.6 million 增至 RMB 820
              million（+2,203.7%），Walker S 系列交付 1,079 台——这是直接同业中最高的单年人形机器人交付量——但按其经审计年报，公司整体仍为净亏损。Fourier Intelligence
              是四家直接同业中披露规模最小者，2025 年 1 月报道的 Series E 轮融资约 RMB 800 million（~$109 million），正把医疗外骨骼积累延伸到通用 GR-2 人形平台。


              Leju 自身披露 2025 年营业收入 RMB 258 million，其中 Kuavo 系列贡献 RMB 178 million（收入 69.5%），售出 577 台（2024 年仅 32 台）。Leju
              招股书明确把自己与上述同业对标：其收入约为 Unitree 的 15%、UBTECH 的 13%；战略重点放在数据采集商业化（Kuavo 收入 45%），并点名 Huawei（HarmonyOS 集成、联合发布
              5G-A 人形机器人）和 Tencent（持股 7.32%）等平台合作伙伴。
