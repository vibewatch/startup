      - number: '4.2'
        title: 销售打法与销售效率代理指标
        blocks:
          - type: paragraph
            body: >
              Leju 的销售打法直接来自教育市场起点。2016 年起，公司搭建直销 + 渠道分销混合网络，把 Aelos 和 Roban 卖给高校、科研院所和教育主管部门——这些客户的采购流程、集成需求和售后预期，与
              KUAVO 现在瞄准的数据采集中心和 B2B/B2G 工业买方高度相似。这种重叠让 Leju 在 2023
              年转向全尺寸人形机器人时，可以复用既有渠道系统，而不是从零搭建销售基础设施。不过，公开来源没有披露教育或工业渠道的销售周期长度、获客成本或回本周期指标；已审阅招股书报道也没有把销售和市场费用从研发或管理费用中单独拆出。最清晰的可用效率代理指标是产能利用率：Leju
              规划的新制造基地目标约为每年 30,000 台人形机器人，而 2025 年三条产品线总出货仅约 4,600 台（577 台 KUAVO、91 台 Roban、3,988 台
              Aelos）——按当前出货速度推算，利用率远低于 50%，新基地完全消化还需要多年。2025 年研发支出 RMB 65.09 million（占收入 25.21%），再加 RMB 8.41 million
              股权激励的股份支付，进一步说明公司仍在先于已验证商业规模投入，而不是已经收割销售效率。
            claimRefs:
              - CI018
              - CI024
              - CI030
              - CI031
              - CI038
      - number: '4.3'
        title: 成本结构、毛利率驱动与营运资本
        blocks:
          - type: paragraph
            body: >
              Leju 综合毛利率从 2023 年 50.45% 降至 2024 年 44.3%，再降至 2025 年 40.78%；但 KUAVO 自身单位成本在 2025 年同比下降 27.35%，快于 25.56%
              的降价幅度。表面矛盾来自产品结构变化：KUAVO 从少数产品成长为收入 69.5%，挤占了毛利率更高的 Roban 和 Aelos 量，拉低混合毛利率，即使 KUAVO
              自身分部经济大致持平。分部经济相对上市同业仍弱：KUAVO 2025 年毛利率 42.39%，低于 Unitree 披露的约 60.27% 核心/人形机器人毛利率，也低于 UBTECH 同期 54.6%
              人形机器人分部毛利率；公司将差距归因于复杂且成本波动大的核心部件。Leju 约 82.82% 的执行器/关节模组来自单一供应商 Wuxi
              Quanzhibo，这一集中风险若关系弱化，可能扰动生产或成本。营运资本压力直接体现在现金流：2023（-RMB 27.52M）、2024（-RMB 29.41M）和 2025（-RMB
              28.25M）经营现金流均为负，三年累计约 -RMB 85.2 million；长 B2B/B2G
              回款周期下，应收账款和库存占用快于回款。已审阅来源没有披露应收账款账龄、存货估值或部件级成本拆分，因此毛利率差距的精确机制只能部分验证。
