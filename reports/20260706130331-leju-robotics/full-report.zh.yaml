      - number: '8.2'
        title: 论点 vs. 反论点：强劲销量增长碰上未解决定价缺口
        blocks:
          - type: paragraph
            body: >-
              正面论点很具体。Kuavo 全尺寸人形机器人销量从 2024 年的 32 台升至 2025 年的 577 台，增长 17 倍；总收入增长 365%，达到 RMB 258.19 million。行业跟踪机构围绕
              IPO 申报的报道将 Leju 按人形机器人出货量排在全球第三，领先当前行业内 150 多家公司中的大多数，而且它的融资额远低于最接近的两家国内竞争对手。MarketsandMarkets
              预测，中国人形机器人市场将以 47.6% CAGR 从 $0.4 billion（2025 年）增长到 $2.8 billion（2030 年）；Leju 当前全球份额仍是个位数，因此这条增长牵引还有长跑道。


              反面论点同样具体。毛利率连续三年下滑，从 50.45%（2023 年）降至 44.30%（2024 年）和 40.78%（2025 年），保荐人自己的风险披露也把它列为持续威胁盈利能力的因素。归母净亏损从 RMB
              41.12 million（2023 年）扩大到 RMB 69.78 million（2025 年），同年相关总净利润口径显示亏损略高，为 RMB 71.25
              million；经营现金流已连续三年为负。与可比同行相比，Unitree 自身 STAR Market 申报已经显示 2025 年收入 RMB 1.7 billion、调整后净利润 RMB 600
              million——Leju 尚未达到这种盈利水平。AgiBot 披露的估值数字在不同跟踪机构间跨度很大（$2.1 billion 至 $6.4 billion），也削弱了跨公司基准比较的可信度。UBTECH
              是唯一已上市的中国纯人形机器人公司，市值约 $6.29 billion，但 52 周股价区间大幅波动，预示 Leju 上市后也可能面对类似波动。
