      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >
              Leju 于 2025 年 10 月完成约 RMB 1.5 billion（~$207-210 million）IPO 前融资——背景见公司概览——目前计划通过 ChiNext 发行再募资 RMB 2.6
              billion（~$360-380 million），隐含估值约 RMB 10 billion。合计来看，一二级和 IPO 阶段融资将超过 RMB 4 billion，而 2025 年收入仅 RMB 258
              million；聚焦 IPO 的不利报道认为，这一比例相对公司规模异常偏高。已披露募资用途显示，具身智能研发中心吸收 36.14%，营运资本/营销网络建设再占
              24.62%，其余投向新建人形机器人产业化基地（目标产能 30,000 台/年）和大规模数据集建设。这笔融资覆盖的是三年累计约 RMB 85.2 million
              的经营现金缺口，而非一次性资本开支事件；也就是说，Leju 在真正实现盈利前仍结构性依赖外部资本，公司目标是 2028 年盈利。作为治理信号，控股股东承诺，如果上市后净利润下滑超过
              50%，将延长锁定期，使内部人与近端盈利稳定性绑定。已审阅来源没有披露 Leju 精确现金余额、月度现金消耗速度，或任何债务/项目融资设施，因此无法脱离已披露经营现金流趋势独立计算资金续航期。
