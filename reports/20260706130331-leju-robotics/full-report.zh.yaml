      - number: '6.5'
        title: 扩张、集中度与采购风险
        blocks:
          - type: paragraph
            body: >-
              几个反向财务信号直接影响客户经济性。2025 年，Leju 为主动防守市场份额定价，Kuavo 平均单台售价同比下降 25.56%，同期单台成本下降 27.35%；合并层面，毛利率从 50.45%（2023
              年）降至 44.30%（2024 年）和 40.78%（2025 年），因为低毛利、高销量的 Kuavo 组合替代了更高毛利的 Roban/Aelos 教育收入；净亏损逐年扩大（RMB41.12
              million、RMB59.23 million、RMB69.78 million），三年经营现金流均为负。这种模式被一家财经媒体风控评论标记为对一家正在扩张的硬件 / AI
              公司而言结构上不典型，值得交易所审核关注。公开报道没有披露精确的前几大客户收入集中度百分比，也没有披露应收账款集中度，已审阅来源中真正的客户集中度风险无法量化。供应侧集中度又在履约端叠加采购摩擦：单一供应商
              Wuxi Quanzhibo 占 Leju 2025 年总采购额的 17.20%，在关节执行器模块品类中占 82.82%；这可能延误已承诺客户的交付，例如 Shijingshan Phase II
              建设。几项具名合作明确是无约束力框架协议——Dongfang Precision 协议除 IP、保密、宣传和反贿赂条款外没有强制义务——因此披露的「客户」关系可能夸大已锁定收入。Leju 拟将 IPO 募资投向
              R&D 中心（36.14%）、数据集建设（23.7%）和生产基地（8.22%），说明扩大数据采集客户和做好工业量产准备，而不是消费增长，才是公司 IPO 后扩张客户基础的主要杠杆。
