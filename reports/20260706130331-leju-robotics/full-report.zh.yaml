        - 说明在人形机器人领域，强投资需求可以把全球估值重估得非常激进。
        - 资本市场、币种和投资人基础不同；未披露收入，无法做同口径倍数。
    notes: 样本选取最影响决策的人形机器人估值标记，且都有可获取的 2025-2026 年证据（中国创业板 / 科创板 IPO 申报方，加上一家港股上市公司和一家美国私营纯标的）；并未穷尽中国人形机器人赛道 150 多家活跃公司。
