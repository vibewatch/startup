      - number: '7.2'
        title: 运营、供应链与安全风险
        blocks:
          - type: paragraph
            body: >
              Leju 的成本结构由零部件成本主导，执行器和传感器占营业成本最大份额；报道还指出，公司对包括 Wuxi Quanzhibo 在内的小型执行器供应商群依赖集中，披露的第二来源认证有限。毛利率从 FY2023 的
              50.45% 到 FY2025 的 40.78%，仍低于同行；Unitree 约 62.9%、UBTech 约 54.6%。这说明规模和成本结构存在缺口，压住了公司通往 2028 年盈利目标的路径。


              Kuavo 系列出货到 2025 年大幅增长（全年售出 577 台全尺寸机型），但平均售价从 CNY 413,900 降至 CNY 308,100，下降
              25.6%，符合竞争性价格压缩的特征。产能利用率数据和同行基准显示，Leju 与几家中国人形机器人厂商一样，在确认订单量之前就扩张了制造产能；如果工业需求未按计划落地，产能过建风险会抬升。


              中国也已记录人形机器人和服务机器人产品安全事件，包括成都伤人案例和广泛传播的餐厅故障，二者均被国际 AI 事件跟踪库收录。Leju 自己的工业部署仍是与国有车企 FAW
              的概念验证，尚未规模化，这意味着拥有最大长期 TAM 的细分市场还没有生产级可靠性数据。
            claimRefs:
