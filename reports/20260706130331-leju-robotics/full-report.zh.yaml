        - 2025 年收入 ~$10.8M
        - 一家跟踪机构引用 $6.4B B 轮估值（2025 年 10 月）；其他来源引用 $2.1B-RMB18B（~$2.5B）
        - 中国头部人形机器人可比公司，市场份额报道中常与 Leju 和 Unitree 并列。
        - 尚未提交 IPO，且估值数据互相冲突，单一基准估值可靠性较低。
      - - UBTECH Robotics (9880.HK)
        - 公开市场市值
        - ~$6.29B（2026 年 7 月）；股价在 52 周 HKD75.50-HKD161.00 区间内大幅波动
        - 唯一已上市的中国人形机器人纯标的；提供真实上市后重估信号。
        - 产品 / 服务组合比 Leju 更宽（工业、消费、教育），而 Leju 基础更窄；且 2023 年以来上市历史不同。
