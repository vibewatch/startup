      - number: '6.2'
        title: 采用轨迹与具名客户证据
        blocks:
          - type: paragraph
            body: >-
              Leju 披露的销量轨迹显示，2025 年出现陡峭拐点：Kuavo 销量从 2024 年 32 台增至 2025 年 577 台（约 17 倍），Aelos 和 Roban 合计销量达到 4,079
              台（3,988 台 Aelos 加 91 台 Roban），同比增长 47.35%，但随着 Kuavo 收入占比升至 69.5%，二者收入占公司总收入收缩到约 15.42%。Leju
              与招股书相关的披露称，累计拥有 500 多个「行业级应用客户」，出口覆盖 45+ 个国家，2025 年海外收入约 RMB61 million（约 18%）；但公开来源中能独立具名的关系很少：Beijing
              Shijingshan 政府产业园数据训练中心（Phase II 中标金额 RMB82.95 million，2025 年 8 月发布）、Harbin Institute of
              Technology（联合揭牌的产学研创新中心，外加有记录的 2025 年 7 月学生参观和 Aelos 演示）、Zhengzhou University（2025 年 9 月协议共建人形机器人 R&D
              中心）、Dongfang Precision（2025 年 7 月无约束力 OEM 制造和市场发展框架协议，同时已有少数股权投资）、Haichen（2025 年 9 月协议共同开发工业级物流人形机器人），以及
              FAW Hongqi 工厂部署 Kuavo 4 Pro 做箱体搬运和分拣；后者仍是边界清晰的概念验证，而不是规模化生产订单。China Mobile 与 Huawei 在 2025 年 6 月 MWC
              Shanghai 上和 Leju 联合发布了 5G-A 具身智能 Kuavo 演示，这是技术合作展示，不是商业部署。非官方规格聚合网站 ChipSilicon 还列出其他具名试点——NIO、Huawei
              Cloud、Haier、Hengtong、China Southern Power Grid——但本章审阅的任何 Leju 官方披露或独立新闻来源都无法佐证，应视为未验证。独立分析机构
              Counterpoint、Omdia、IDC 和 Beijing CCID 将 Leju 按 2025 年人形机器人出货量排在全球第 3-4 位（约 5% 份额），但一位被引用的分析师提醒，包括 Leju
              在内的大多数行业出货都集中在门槛较低的研究、教育和数据采集机型，而不是需要持续自主性和载荷可靠性的工业部署。
