      - number: '7.3'
        title: 伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >
              Leju 的运营模式把几项关键依赖集中在少数对手方。执行器供应集中在 Wuxi Quanzhibo 和有限的替代方，一旦中断，可能成为让 Kuavo 停产的单点故障。AI 计算硬件依赖 Nvidia
              GPU，直接暴露在上文所述 2026 年美国出口许可收紧之下；当前合格的国产芯片替代仍只是部分覆盖。


              战略合作同时带来能力和依赖：Huawei 提供 Kuavo 机型使用的 OpenHarmony 操作系统集成，Tencent 持有少数股权，Dongfang Precision——一家中国上市制造商，并在
              2026-07-06 前后披露持有 Leju 2.83% 股权——是根据合作协议扩大产能的合同制造伙伴。这些关系都不构成多数控制，但每一项都承载一个具体功能：软件生态、资本通道或制造吞吐。


              客户侧最大的集中度不是某个特定对手方，而是结构性问题：面向 AI / 基础模型开发者的数据采集服务约占 Kuavo 线收入的 45%，是 Leju
              最大单一板块。分析师提示，一旦买方积累足够训练数据，这类需求可能回归常态；如果 Leju 不能向工业或研究 / 教育需求多元化，最大现有收入流会被直接压缩。
