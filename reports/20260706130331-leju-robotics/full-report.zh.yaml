  summary: >-
    Leju Robotics（法定主体为 Leju Intelligence (Shenzhen) Co., Ltd.）是中国领先的人形机器人公司，由 Harbin Institute of Technology 校友 2016
    年创立。公司生产 KUAVO 系列全尺寸人形机器人，面向数据采集、科研/教育、商业服务和早期工业制造，同时保留 Roban 与 Aelos 教育机器人产品线。2025 年 KUAVO 出货 577 台（同比增长 17 倍），Leju
