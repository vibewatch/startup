  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 按客户工作流拆解产品组合
        blocks:
          - type: paragraph
            body: >
              Leju 的硬件按三条产品线组织，对应三类买方。KUAVO 是旗舰全尺寸人形机器人（KUAVO 4 Pro、KUAVO 5、轮式 KUAVO 5-W，以及商用服务版本 KUAVO-MY），卖给具身 AI
              数据采集中心、高校 / 科研实验室，也以概念验证形式卖给工业制造商。Roban 是面向高校和 STEM 项目的中型研究 / 教育人形机器人。Aelos 是面向 K-12 编程教育的小型人形机器人，也是 Leju
              按台数计算出货最多的产品。当前 KUAVO 一代的公开规格表大致收敛在 168 cm、55 kg、40 个自由度和高扭矩电动执行器；但另一个展商发布的 Kuavo 5 清单写成更高更重的 1.73 m /
              63.5 kg / 41-DoF，并以「全球首款 5G-A 人形机器人」营销——这个差异可能来自不同子型号或发布时间，但没有一份权威且注明日期的规格表能统一解释。2025 年，Leju 卖出 577 台
              KUAVO（2024 年为 32 台），另有 3,988 台 Aelos 和 91 台 Roban；独立出货跟踪机构 Omdia、Counterpoint Research 由此将 Leju
              按人形机器人销量排在全球第四。不同买方真正跑的任务差异很大：Aelos 客户做图形化 / Python 编程练习，Roban 客户跑运动控制和感知研究实验，KUAVO
              客户更常用机器人采集真实交互数据，用来训练具身 AI 模型，而不是执行生产任务。
