  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >
              Leju Robotics 的可服务市场覆盖更大机器人与具身智能行业中的全尺寸人形机器人细分市场。市场边界包括人形机器人硬件（双足与轮式人形平台）、配套软件/AI
              集成和部署服务收入。传统工业机械臂、AGV/AMR、协作机器人（cobots）以及非人形服务机器人不在此定义内。


              这一定义进一步收窄到中国；2025 年中国约占全球人形机器人装机量 85%。在中国，主要细分市场包括工业自动化（制造装配、物料搬运、机床上下料）、数据采集服务（为 AI
              模型生成训练数据）、科研与教育（高校/科研机构采购）和商业服务（酒店、零售、公共活动）。


              现状替代方案包括传统工业机器人、人工劳动力和定制自动化系统。人形形态的价值主张在于，在传统自动化难以落地的非结构化环境中具备通用性和适应性。相邻市场包括更广义的工业机器人市场（中国约 $20B）和 AI
              训练数据市场，二者都会推动人形机器人需求。
