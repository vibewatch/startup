    title: 投资逻辑破裂与否决触发表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - IPO 定价处于或低于法定底线
        - 最终发行价隐含市值约 RMB3-3.5B，处于或低于 2025 年 10 月私募估值
        - 表明市场不愿为 2025 年增长和出货排名证据支付溢价
        - 视为估值红旗；任何老股通道都避免支付高于已披露私募轮估值的价格
      - - 毛利率进一步跌破 40%
        - 全年毛利率连续两个期间低于 2025 年 40.78% 水平
        - 削弱 2028 年盈利时间表，并抬高融资风险
        - 将估值立场从偏高下调为昂贵；重新评估现金跑道假设
      - - 数据采集收入集中度进一步加深
        - 数据采集收入占比显著高于 44.94%，而工业收入仍接近 3.88%
        - 表明增长故事越来越由合同驱动，而不是由规模化硬件部署驱动
        - 在任何更新估值模型中，下调远期收入质量
      - - 竞争对手先完成更大且盈利的 IPO
        - Unitree 或 AgiBot 以溢价倍数上市，并披露盈利（Unitree 自身申报文件已经如此声称）
        - 给投资者风险偏好划出比 Leju 风险更低的参照标尺，压制 Leju 相对定价
        - 按同业结果下调 Leju 的 IPO 定价预期并重写模型
      - - 全行业买家满意度持续低迷
        - 2026-2027 年后续调查显示，相较 Morgan Stanley 引用的 23% 水平没有实质改善
        - 证实全行业泡沫警告所说的商业化缺口也落在 Leju 自身客户群
        - 视为悲观情景被证实；满意度数据改善前避免加仓敞口
    notes: 这些触发项入选，是因为每一项都会直接、可衡量地改变建议，而不是因为它们是泛化行业风险。
    claimRefs:
      - CV021
      - CV022
      - CV031
      - CV035
      - CV036
      - CV037
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 所有权与控制权
        - 2025 年 10 月轮次后三名实际控制人和头部机构投资者在 IPO 后的持股比例
        - 目前不存在控股股东；分散控制可能影响治理和上市后决策
        - 索取注册说明书中的股东表和任何一致行动协议
      - - 锁定期与流动性
        - IPO 前机构和创始人股份的锁定期长度及任何提前解除条件
        - 锁定期到期是中国成长股 IPO 常见估值和流动性催化剂
        - 最终 SZSE 上市公告和招股书发布后，核查锁定承诺
      - - 最终发行价与配售
        - 已确认的 IPO 发行价和机构簿记结果
        - 决定最终估值更接近 RMB3B 底线、RMB4.327B 上一轮，还是市场隐含的约 RMB10B 上限
        - 定价确定后跟踪 SZSE 和 CSRC 披露
      - - 客户集中度与合同质量
        - 44.94% 数据采集收入占比背后的最大客户或合同名称
        - 揭示增长是多元化，还是依赖少数关系驱动订单
        - 要求从招股书的关联方和前五大客户章节披露客户集中度
      - - IPO 后资本配置
        - RMB2.6 billion IPO 募资将在工业化产能、R&D 和营运资金之间如何分配
        - 决定新资本会缩短还是拉长公司所称 2028 年盈利目标的路径
        - 核查最终招股书的「募集资金用途」章节
    notes: 这些问题是最可能改变建议或可接受入场价的具体事项，不是泛化尽调清单。
    claimRefs:
      - CV002
      - CV012
      - CV015
      - CV041
      - CV042
