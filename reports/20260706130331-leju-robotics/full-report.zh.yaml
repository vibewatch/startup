      - number: '1.4'
        title: 里程碑、规模与轨迹
        blocks:
          - type: paragraph
            body: >
              Leju Robotics 不到十年，从教育机器人创业公司走到全球前四的人形机器人出货商。关键节点横跨产品发布、融资事件、战略合作和监管申报。


              产品研发上，公司发布 Aelos（2016），开始 Aelos 批量交付（2017），进入全尺寸人形机器人研发（2018），发布 KUAVO 3（2023 年 12 月），迭代至 KUAVO 4 与 KUAVO
              4 Pro（2024），并发布 KUAVO 5 和 KUAVO 5-W（2025 年 10 月）。三年五次重大产品更新，快于行业约每年一次的平均节奏。


              规模上，KUAVO 销量从 2024 年 32 台跃升至 2025 年 577 台，增长 17 倍。收入从 RMB 54 million（2023）到 RMB 56 million（2024）再到 RMB 258
              million（2025），三年 CAGR 为 118.68%。Counterpoint Research 按人形机器人出货量将公司列为全球第 4（全球份额约 5%），IDC 则列为 2025 年第 3。


              合作包括集成 Huawei 基于 OpenHarmony 的 KaihongOS 和 Pangu AI 模型，与 China Mobile 合作 5G-A 远程机器人操作，并为工业应用集成 Nvidia
              芯片。2025 年 11 月，KUAVO 成为首个在大型体育赛事（中国第十五届全国运动会）传递火炬的人形机器人。2026 年，Leju 在济南启用中国首个专业人形机器人数据训练中心。
