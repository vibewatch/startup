      - number: '2.2'
        title: TAM/SAM/SOM Sizing and Estimates
        blocks:
          - type: paragraph
            body: >
              Market sizing for the China humanoid robot segment varies significantly by methodology and definition
              scope. Conservative hardware-centric estimates from MarketsandMarkets place the China humanoid robot
              market at $0.40 billion in 2025, growing to $2.80 billion by 2030 at a 47.6% CAGR. Morgan Stanley's
              broader forecast estimates $15 billion in annual humanoid robot revenue by 2030, while CCID (China Center
              for Information Industry Development) projects 20 billion yuan (~$2.8B) for 2026.


              The Total Addressable Market (TAM) under broader definitions including all hardware, software, services,
              and AI integration could reach 104.71 billion yuan (~$14.5B) in 2026 per Embodied Global research, though
              this represents the widest definition including overlap with embodied AI and general robotics. TrendForce
              projects Chinese humanoid robot output to surge 94% in 2026 with Unitree and AgiBot commanding nearly 80%
              of shipments.


              For Leju Robotics specifically, the Serviceable Available Market (SAM) is constrained to segments where
              full-size bipedal humanoids are deployed: primarily industrial automation, data collection, and
              research/education. Based on Leju's RMB 258M 2025 revenue and ~5% global shipment share, its current
              Serviceable Obtainable Market (SOM) represents approximately $36M of a ~$400M–2B global market depending
              on definition.


              Key sizing tension exists between bullish TAM projections (which include future services/AI) and
              conservative near-term hardware revenue. The company's pivot toward data collection as a revenue driver
              suggests the AI training data market is an adjacent TAM expansion vector.
