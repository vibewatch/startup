      - number: '7.3'
        title: Partner and Dependency Risk
        blocks:
          - type: paragraph
            body: >
              Leju's operating model concentrates several critical dependencies in a small number of counterparties.
              Actuator supply is concentrated with Wuxi Quanzhibo and a limited set of alternates, a single point of
              failure that could halt Kuavo production if disrupted. AI compute hardware depends on Nvidia GPUs, which
              are directly exposed to the 2026 US export-licensing tightening described above, with only partial
              domestic-chip substitution currently qualified.


              Strategic partnerships add both capability and dependency: Huawei supplies the OpenHarmony operating
              system integration used in Kuavo units, Tencent holds a minority equity stake, and Dongfang Precision — a
              listed Chinese manufacturer that also disclosed a 2.83% equity stake in Leju around 2026-07-06 — is a
              contract-manufacturing partner under a cooperation agreement to scale production. None of these represents
              majority control, but each is load-bearing for a specific function (software ecosystem, capital access, or
              manufacturing throughput).


              The largest customer-side concentration is structural rather than counterparty-specific: data-collection
              services for AI/foundation-model developers account for roughly 45% of Kuavo-line revenue, Leju's single
              largest segment. Analysts have flagged that this demand could normalize once buyers accumulate sufficient
              training data, which would directly compress Leju's largest current revenue stream absent diversification
              into industrial or research/education demand.
