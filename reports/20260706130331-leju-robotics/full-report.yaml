      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Single-Supplier Actuator Dependency Is the Highest-Severity Operational Risk
            body: >-
              Leju's reported reliance on a concentrated actuator supplier base, including Wuxi Quanzhibo, with no
              disclosed second-source qualification, is the single highest-severity operational risk identified: a
              supply disruption would directly halt Kuavo production.
            calloutType: risk
