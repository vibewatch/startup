      - number: '1.4'
        title: Milestones, Scale, and Trajectory
        blocks:
          - type: paragraph
            body: >
              Leju Robotics has progressed from an education-focused robotics startup to a top-four global humanoid
              robot shipper in under a decade. Key milestones span product launches, financing events, strategic
              partnerships, and regulatory filings.


              In product development, the company launched Aelos (2016), began Aelos mass deliveries (2017), entered
              full-size humanoid R&D (2018), launched KUAVO 3 (December 2023), iterated to KUAVO 4 and KUAVO 4 Pro
              (2024), and released KUAVO 5 and KUAVO 5-W (October 2025). The iteration pace of five major product
              updates in three years exceeds the industry average of approximately one per year.


              In terms of scale, KUAVO sales exploded from 32 units in 2024 to 577 units in 2025, a 17-fold increase.
              Revenue grew from RMB 54 million (2023) to RMB 56 million (2024) to RMB 258 million (2025), representing a
              three-year compound annual growth rate of 118.68%. The company was ranked fourth globally in humanoid
              robot shipments by Counterpoint Research (approximately 5% global market share) and third by IDC in 2025.


              Partnerships include integration of Huawei's OpenHarmony-based KaihongOS and Pangu AI models,
              collaboration with China Mobile on 5G-A remote robot operations, and Nvidia chip integration for
              industrial applications. In November 2025, KUAVO became the first humanoid robot to carry a torch at a
              major sports event (China's 15th National Games). In 2026, Leju inaugurated China's first specialized
              humanoid robot data training center in Jinan.
