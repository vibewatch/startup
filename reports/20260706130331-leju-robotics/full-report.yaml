      - number: '7.4'
        title: Financial and Business Model Risk
        blocks:
          - type: paragraph
            body: >
              Leju has posted net losses in each of the past three fiscal years (CNY 41.12 million in 2023 rising to CNY
              71.25 million in 2025) alongside persistently negative operating cash flow, despite FY2025 revenue growth
              of 365.2% to CNY 258 million. Management has targeted 2028 as the earliest year for overall profitability,
              a target that depends on continued margin improvement and industrial-segment scale-up that has not yet
              materialized (industrial revenue was only 3.88% of the FY2025 total).


              The ChiNext IPO seeks to raise roughly CNY 2.6 billion (~$382.7 million), more than ten times FY2025
              revenue, with proceeds earmarked for R&D, capacity expansion, and working capital rather than debt
              reduction. This follows a cumulative pre-IPO financing history including a roughly CNY 1.5 billion pre-IPO
              round and earlier rounds from Tencent, Shenzhen Capital Group, and other strategic investors. Independent
              commentary has questioned whether current humanoid-robot valuations, including pre-IPO pricing
              expectations for companies like Leju, are supported by near-term fundamentals given continued losses
              industry-wide.


              Leju's application also arrives amid a crowded window of Chinese robotics/AI IPO filings (including
              Unitree's own STAR Market listing-committee approval), increasing competition for investor capital and
              listing-committee attention. Given three years of losses and negative operating cash flow, Leju's
              near-term financial position is sensitive to a successful listing or continued external financing.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR012
