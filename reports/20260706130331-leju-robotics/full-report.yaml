  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: >
              The addressable market for Leju Robotics spans the full-size humanoid robot segment within the broader
              robotics and embodied intelligence industry. The market boundary includes revenue from humanoid robot
              hardware (bipedal and wheeled humanoid platforms), associated software/AI integration, and deployment
              services. Excluded from this definition are traditional industrial robotic arms, AGVs/AMRs, collaborative
              robots (cobots), and non-humanoid service robots.


              The relevant market is further narrowed to China, which accounted for approximately 85% of global humanoid
              robot installations in 2025. Within China, the primary market segments include industrial automation
              (manufacturing assembly, material handling, machine tending), data collection services (training data
              generation for AI models), scientific research and education (university/research institute procurement),
              and commercial services (hospitality, retail, public events).


              Status-quo substitutes include traditional industrial robots, manual labor, and purpose-built automation
              systems. The humanoid form factor's value proposition centers on versatility and adaptability in
              unstructured environments where traditional automation is impractical. Adjacent markets include the
              broader industrial robotics market (~$20B in China) and the AI training data market, both of which feed
              into humanoid robot demand drivers.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
