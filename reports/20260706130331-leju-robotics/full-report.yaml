            title: Data-Collection Revenue, ~45% of the Business, May Not Be Durable
            body: >-
              Independent commentary flags that Leju's largest revenue segment -- AI training-data collection services
              -- could shrink once foundation-model developers accumulate sufficient training data, a demand-durability
              risk not yet offset by industrial-segment scale-up (only 3.88% of FY2025 revenue).
            calloutType: risk
            claimRefs:
              - CR023
