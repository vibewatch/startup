      - number: '7.5'
        title: People, Execution Risk, and Mitigation
        blocks:
          - type: paragraph
            body: >
              Leju's strategic and operational direction remains concentrated in founder Leng Xiaokun and a small circle
              of Harbin Institute of Technology-linked executives, a common single-point-of-failure risk for a
              founder-led hardware startup approaching a public listing. Public registry sources disagree on headcount —
              one filing records 76 insured employees as of the 2024 annual report while another lists 198 — an
              unresolved discrepancy relevant to any assessment of organizational scale. Compensation for embodied-AI
              and robotics engineering talent in China has also risen sharply amid intense industry-wide hiring
              competition, pressuring opex at a time the company is not yet profitable.


              Execution risk is concentrated in two areas: converting industrial proof-of-concepts such as the FAW
              deployment into repeatable volume orders, and managing a capacity build-out that appears to be running
              ahead of confirmed demand without triggering a cash-burn spiral.


              Monitorable mitigations and kill criteria include: confirmed second-source actuator qualification within
              12 months of listing; disclosed progress on domestic AI-compute substitution if US export controls tighten
              further; the ChiNext review outcome itself, where withdrawal or rejection would be a thesis-breaking
              event; gross-margin convergence toward Unitree/UBTech benchmarks within three fiscal years; and any US
              legislative action (e.g., GUARD Act enactment) that would foreclose a portion of Leju's addressable export
              market. Diligence asks should target the actuator-supplier roadmap, reconciled headcount, and industrial
              sales pipeline conversion data.
            claimRefs:
              - CR033
              - CR034
              - CR035
              - CR036
