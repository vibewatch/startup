  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product portfolio in customer workflow terms
        blocks:
          - type: paragraph
            body: >
              Leju organizes its hardware around three lines that map to three buyers. KUAVO is the flagship full-size
              humanoid (KUAVO 4 Pro, KUAVO 5, the wheeled KUAVO 5-W, and the commercial-service variant KUAVO-MY), sold
              to embodied-AI data-collection centers, university/research labs and, on a proof-of-concept basis,
              industrial manufacturers. Roban is a mid-size research/education humanoid aimed at universities and STEM
              programs. Aelos is a small humanoid built for K-12 programming education and is Leju's highest-volume
              product by unit count. Public specification sheets for the current KUAVO generation converge on roughly
              168 cm and 55 kg with 40 degrees of freedom and high-torque electric actuators, though a separate
              exhibitor-published Kuavo 5 listing describes a taller, heavier 1.73 m / 63.5 kg / 41-DoF configuration
              marketed as the world's first 5G-A humanoid robot -- a discrepancy that likely reflects different
              sub-models or timing but that no single authoritative, dated spec sheet resolves. In 2025 Leju sold 577
              KUAVO units (versus 32 in 2024) and 3,988 Aelos plus 91 Roban units, a mix that independent shipment
              trackers (Omdia, Counterpoint Research) used to rank Leju fourth globally by humanoid-robot volume. The
              workload each buyer actually runs differs sharply: Aelos customers run block/Python programming exercises,
              Roban customers run research locomotion and perception experiments, and KUAVO customers most often use the
              robot to capture real-world interaction data for training embodied-AI models rather than to run production
              tasks.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
