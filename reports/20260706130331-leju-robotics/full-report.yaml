      - number: '4.2'
        title: Go-to-Market Motion and Sales Efficiency Proxies
        blocks:
          - type: paragraph
            body: >
              Leju's go-to-market motion traces directly to its education-market origins. From 2016 the company built a
              hybrid direct-sales-plus-channel-distribution network to sell Aelos and Roban into universities, research
              institutes, and education authorities — customers whose procurement processes, integration needs, and
              after-sales expectations closely resemble the data-collection centers and B2B/B2G industrial buyers KUAVO
              now targets. That overlap let Leju reuse an existing channel system when it pivoted to full-size humanoids
              in 2023, rather than building go-to-market infrastructure from zero. However, no public source discloses a
              sales-cycle length, customer-acquisition cost, or payback metric for either the education or industrial
              channel, and the prospectus coverage reviewed does not break out sales and marketing expense separately
              from R&D or G&A. The clearest available efficiency proxy is capacity utilization: Leju's planned new
              manufacturing base targets roughly 30,000 humanoid robots per year, while 2025 total shipments across all
              three product lines were only about 4,600 units (577 KUAVO, 91 Roban, 3,988 Aelos) — implying utilization
              well under 50% at the current run-rate and a multi-year gap before the new base is fully absorbed. R&D
              spending of RMB 65.09 million (25.21% of 2025 revenue) plus RMB 8.41 million in equity-incentive
              share-based payment further signals a business still investing ahead of demonstrated commercial scale
              rather than harvesting go-to-market efficiency.
            claimRefs:
              - CI018
              - CI024
              - CI030
              - CI031
              - CI038
      - number: '4.3'
        title: Cost Structure, Gross Margin Drivers, and Working Capital
        blocks:
          - type: paragraph
            body: >
              Leju's consolidated gross margin fell from 50.45% in 2023 to 44.3% in 2024 to 40.78% in 2025, even though
              KUAVO's own unit cost dropped 27.35% year over year in 2025 — faster than its 25.56% price cut. The
              apparent contradiction is a mix-shift effect: as KUAVO grew from a minority product to 69.5% of revenue,
              it displaced higher-margin Roban and Aelos volume, pulling the blended margin down even as KUAVO's own
              segment economics held roughly flat. That segment-level economics remain weak versus listed peers: KUAVO's
              2025 gross margin of 42.39% trails Unitree's disclosed ~60.27% core/humanoid margin and UBTECH's 54.6%
              humanoid-segment margin for the same period, a gap the company attributes to complex, volatile-cost core
              components. Roughly 82.82% of Leju's actuator/joint modules are sourced from a single supplier, Wuxi
              Quanzhibo, a concentration risk that could disrupt production or costs if that relationship weakens.
              Working-capital strain shows up directly in cash flow: net operating cash flow was negative in each of
              2023 (-RMB 27.52M), 2024 (-RMB 29.41M), and 2025 (-RMB 28.25M), cumulating to roughly -RMB 85.2 million
              over three years, as receivables and inventory tied to long B2B/B2G payment cycles outpaced collections.
              No source reviewed discloses receivables aging, inventory valuation, or a component-level cost breakdown,
              leaving the precise mechanics of the margin gap only partially verifiable.
