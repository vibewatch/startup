              - CR027
          - type: callout
            title: >-
              Track Second-Source Qualification, HEIS Certification, and ChiNext Review Status as Near-Term Diligence
              Triggers
            body: >-
              The three most decision-relevant monitoring items over the next 12 months are: confirmed second-source
              actuator qualification, Leju's specific HEIS certification tier, and the SZSE ChiNext review outcome --
              withdrawal or rejection of the listing would be a thesis-breaking event.
            calloutType: recommendation
