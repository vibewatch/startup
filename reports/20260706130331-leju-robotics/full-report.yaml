      - number: '7.2'
        title: Operational, Supply Chain, and Safety Risk
        blocks:
          - type: paragraph
            body: >
              Leju's cost structure is dominated by component costs, with actuators and sensors representing the largest
              share of cost of goods sold; reporting also points to a concentrated reliance on a small actuator supplier
              base including Wuxi Quanzhibo, with limited disclosed second-source qualification. Gross margin improved
              from 50.45% in FY2023 to a still-below-peer 40.78% in FY2025, versus roughly 62.9% for Unitree and 54.6%
              for UBTech, indicating a scale and cost-structure gap that pressures the path to the company's 2028
              profitability target.


              Kuavo-series unit shipments grew sharply through 2025 (577 full-size units sold for the year) while
              average selling price fell 25.6% from CNY 413,900 to CNY 308,100, consistent with competitive price
              compression. Capacity utilization data and peer benchmarking suggest Leju, like several China humanoid
              makers, has expanded manufacturing capacity ahead of confirmed order volume, raising an overbuild risk if
              industrial demand does not materialize on schedule.


              Product safety incidents have also been logged for humanoid and service robots in China, including a
              Chengdu injury case and a widely circulated restaurant malfunction, both cataloged in international
              AI-incident trackers. Leju's own industrial deployment, a proof-of-concept with state automaker FAW,
              remains pre-scale, meaning production-grade reliability data for the segment with the largest long-term
              TAM is not yet available.
