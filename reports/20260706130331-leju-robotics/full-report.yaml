      - number: '6.4'
        title: Retention, Repeat Usage, and Satisfaction Evidence
        blocks:
          - type: paragraph
            body: >-
              No net revenue retention, gross revenue retention, logo-churn rate, or average contract/renewal length is
              disclosed anywhere in the sources reviewed for Leju, which as a pre-IPO applicant discloses only
              consolidated revenue, gross margin, and net-loss figures rather than customer-cohort metrics. In the
              absence of a real retention cohort, the best available proxy is land-and-expand behavior at the
              institutional level: the Shijingshan relationship deepened from a Phase I community deployment to a
              dedicated Phase II contract, and the Dongfang Precision relationship deepened from a pre-existing
              minority-equity stake into a 2025 OEM-manufacturing and market-development agreement. Direct
              consumer-satisfaction evidence is thin: Leju's official Taobao flagship store listing for the Aelos Pro3
              education robot shows a near-zero public review volume across product-description, seller-service, and
              logistics scores, which is best explained by Leju's institutional (schools, research institutes,
              government programs) buyer base rather than a B2C retail model, and no documented pattern of complaints,
              recalls, canceled contracts, or blocked deployments was found for any Leju product in the sources
              reviewed. An independent 2019 hands-on review of the Aelos education-edition robot rated its build quality
              and safety detailing positively, though that review predates Leju's Kuavo-era industrial pivot by several
              years and cannot speak to current-generation products or satisfaction. The retention/repeat-cohort figure
              in this chapter therefore scores evidence depth (how much each source layer reveals about initial
              engagement, repeat/expansion, and renewal visibility) rather than true revenue retention, since no
              company-disclosed retention data exists.
