            body: >-
              Leju's disclosed unit-sales trajectory shows a sharp 2025 inflection: Kuavo unit sales rose from 32 units
              in 2024 to 577 units in 2025 (about 17x), while combined Aelos and Roban unit sales reached 4,079 units
              (3,988 Aelos plus 91 Roban), up 47.35% year over year but shrinking to about 15.42% of total company
              revenue as Kuavo's share grew to 69.5%. Leju's prospectus-linked disclosures claim more than 500
              cumulative "industry-level application customers" and export reach to 45+ countries generating roughly
              RMB61 million (about 18%) of 2025 revenue overseas, but only a small number of these relationships are
              independently named in public sources: the Beijing Shijingshan government-industrial-park data- training
              center (RMB82.95 million Phase II tender award, published August 2025), Harbin Institute of Technology (a
              jointly inaugurated industry-university-research innovation center, plus a documented July 2025 student
              visit and Aelos demonstration), Zhengzhou University (a September 2025 agreement to build a joint humanoid
              R&D center), Dongfang Precision (a July 2025 non-binding OEM-manufacturing and market- development
              framework agreement, alongside its existing minority equity stake), Haichen (a September 2025 agreement to
              jointly develop an industrial-grade logistics humanoid), and a FAW Hongqi factory deployment of Kuavo 4
              Pro for box-handling and sorting that remains a bounded proof-of-concept rather than a scaled production
              order. China Mobile and Huawei jointly launched a 5G-A embodied-intelligence Kuavo demonstration with Leju
              at MWC Shanghai in June 2025, a technology-partnership showcase rather than a commercial deployment. An
              unofficial specifications aggregator (ChipSilicon) lists additional named pilots -- NIO, Huawei Cloud,
              Haier, Hengtong, and China Southern Power Grid -- that could not be corroborated in any official Leju
              disclosure or independent news source reviewed and should be treated as unverified. Independent analysts
              (Counterpoint, Omdia, IDC, and Beijing CCID) rank Leju 3rd-4th globally by 2025 humanoid shipment volume
              (roughly 5% share), but one cited analyst cautioned that most industry-wide shipment volume, including
              Leju's, is concentrated in lower-barrier research, education, and data-collection units rather than
