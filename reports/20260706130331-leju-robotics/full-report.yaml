      - number: '1.3'
        title: Funding History and Valuation
        blocks:
          - type: paragraph
            body: >
              Leju Robotics has raised approximately $250 million in total across multiple funding rounds since its 2016
              founding. The funding trajectory demonstrates accelerating investor conviction, with the majority of
              capital raised in 2025 alone.


              The seed round in July 2016 was led by Green Pine Capital Partners (Songhe Capital). A Series A round in
              August 2017 raised approximately $7.4 million with Tencent as a key investor alongside Linzhi Lixin
              Information Technology. The Series B round in June 2019 raised approximately $36.4 million from Tencent
              Industry Win-Win Fund, Shenzhen Capital Group, Green Pine Capital Partners, and Aplus Capital.


              The landmark pre-IPO round closed in October 2025, raising nearly RMB 1.5 billion (approximately $207-210
              million). This round involved more than ten institutional investors including Shenzhen Investment Holdings
              Capital, Shenzhen Longhua Capital, Qianhai Foundation Investment, Shijingshan Industrial Fund, Dongfang
              Precision (listed, holding 6.83%), Tuopu Group, CITIC Goldstone, CITIC Securities Investment, and Daohe
              Long-Term Investment. The post-money valuation after this round was RMB 4.327 billion.


              The IPO filing targets raising RMB 2.6 billion through issuance of no more than 20 million shares (minimum
              25% of post-offering share capital), implying an IPO valuation of approximately RMB 10 billion (~$1.4
              billion), which would place Leju in the top tier of China's embodied intelligence sector by market
              capitalization.
