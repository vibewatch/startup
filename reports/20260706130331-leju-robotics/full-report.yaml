      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >
              The China humanoid robot market benefits from powerful structural tailwinds. Government policy is the
              primary catalyst: the 15th Five-Year Plan frames embodied intelligence as a core strategic pillar, and a
              March 2026 national standard system for humanoid robots (drafted by 120+ institutions) provides regulatory
              clarity. MIIT and SASAC launched a 2026 Special Action to accelerate commercial deployment from labs to
              factory floors.


              Demographic pressure from China's aging population and declining workforce creates sustained demand. The
              country faces a structural labor shortage particularly acute in manufacturing, logistics, and elder care.
              China's massive robotics supply chain and manufacturing infrastructure enable faster cost reduction curves
              than competitors in the US or Europe.


              However, significant adoption constraints persist. Technical barriers include achieving reliable autonomy
              in unstructured environments, dexterous manipulation, and human-safe operation. Economic barriers include
              high unit costs (though declining), unclear ROI for many applications, and the fact that only 3.88% of
              Leju's current KUAVO revenue comes from industrial manufacturing—suggesting the highest-value use case
              remains nascent.


              Regulatory constraints include evolving safety standards, lack of established liability frameworks for
              robot-caused accidents, and data privacy concerns for AI-trained robots in public spaces. Competitive
              intensity from well-funded peers (Unitree, AgiBot, UBTECH) with 80% combined market share creates margin
              pressure. The talent shortage of 500K-800K specialists constrains industry-wide scaling capacity.
            claimRefs:
              - CM018
              - CM019
              - CM020
              - CM021
              - CM022
              - CM023
              - CM024
