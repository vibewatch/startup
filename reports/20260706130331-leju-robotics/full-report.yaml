  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Leju's public customer journey moves from trade-show/press awareness through non-binding framework agreements,
      bounded pilots, formal tenders, operational deployment, and finally land-and-expand renewal into a second
      agreement phase.
    data:
      nodes:
        - id: awareness
          label: Market awareness and demo exposure
          detail: >-
            Prospective institutional, government, and industrial buyers encounter Leju via trade events (MWC Shanghai),
            shipment-ranking press coverage, or the official product-line pages.
        - id: evaluation
          label: Evaluation and framework agreement
          detail: >-
            Buyer signs a non-binding MOU or strategic-cooperation framework (Dongfang Precision, Haichen) or holds a
            formal joint-center inauguration (HIT) before any contract value is fixed.
        - id: pilot-poc
          label: Pilot / proof-of-concept
          detail: >-
            Buyer runs a bounded technical validation, such as the FAW Hongqi Kuavo 4 Pro box-handling proof-of-concept,
            before committing to scaled procurement.
        - id: procurement
          label: Formal procurement or tender award
          detail: >-
            Buyer runs a public tender (Shijingshan Phase II, RMB82.95M) or signs a dated commercial agreement with
            disclosed scope.
        - id: deployment
          label: Operational deployment
          detail: >-
            Robots are installed and generating real-machine data or performing tasks at buyer premises (Shijingshan
            data-training center, HIT Aelos demonstrations).
        - id: expansion
          label: Expansion / land-and-expand
          detail: >-
            The relationship deepens into a second phase or new agreement type, such as Shijingshan Phase I into Phase
            II, or Dongfang Precision investor into OEM-manufacturing partner.
    approximationNotes: >-
      Stages are inferred from dated news, tender, and university announcements rather than from a published Leju
      sales-process diagram.
    claimRefs:
      - CU001
      - CU007
      - CU011
      - CU014
      - CU017
      - CU035
      - CU045
