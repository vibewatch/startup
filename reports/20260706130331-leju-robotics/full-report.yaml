        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >
              Leju Robotics was co-founded by three HIT alumni who remain the controlling shareholders and executive
              team. Leng Xiaokun serves as founder, chairman, and chief technology officer, bringing a PhD in Computer
              Application Technology from HIT and over 130 invention patents. Chang Lin serves as CEO responsible for
              daily operations and commercialization strategy. An Ziwei serves as COO driving technology
              industrialization and partnerships. The three co-founders together directly or indirectly control
              approximately 33.7% of the company's equity.


              Leng Xiaokun, born in 1992, is one of China's youngest tech company founders to reach unicorn status. He
              was recognized with the 2025 China Youth May Fourth Medal and oversees 36 major R&D projects. The
              technical leadership core is heavily concentrated among HIT alumni with deep expertise in robotics, AI,
              and system integration. This creates both a strength in technical cohesion and a potential key-person risk
              concentrated in the founding team.


              The company's IPO counseling was registered on October 30, 2025 with the Shenzhen Securities Regulatory
              Bureau, with Oriental Securities serving as the sponsoring institution. The transition to joint-stock
              company structure in 2025 signaled formal corporate governance maturation ahead of the public listing.
