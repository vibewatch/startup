      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >
              The humanoid robot market features distinct buyer/user/payer dynamics across segments. In data collection
              (Leju's largest revenue segment at 45% of KUAVO revenue), buyers are AI companies and research
              institutions purchasing humanoid platforms to generate training data for embodied intelligence models. The
              payer is typically the AI company's R&D budget, with the user being robotics/AI engineers.


              In scientific research and education (32.5% of KUAVO revenue), buyers are universities, research
              institutes, and government education authorities. Procurement follows B2G/B2B patterns with standardized
              tendering processes. Budget ownership sits with institutional R&D or education technology budgets. In
              commercial services (18.7%), buyers are enterprises seeking customer-facing or event-based robot
              applications, with marketing or operations budgets as the payer.


              Industrial manufacturing (3.88% of KUAVO revenue but the largest long-term growth opportunity) targets
              automotive OEMs, electronics manufacturers, and logistics companies. The buyer is typically a
              plant/operations manager with capex or automation budgets. Adoption triggers include labor shortages
              (China faces a structural talent deficit of 500,000–800,000 robotics specialists), rising wages in
              manufacturing provinces, and government subsidies for smart manufacturing upgrades.


              The buyer profile is shifting from early adopters (research institutions, tech companies) toward
              mainstream industrial users as unit costs decline and reliability improves—evidenced by Leju's 25.56%
              price reduction strategy in 2025.
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
              - CM017
          - type: table
            tableRef: TM003
            claimRefs:
