          - type: callout
            title: Margin Gap to Unitree and UBTech Signals a Scale Disadvantage
            body: >-
              Leju's FY2025 gross margin of 40.78% trails Unitree's roughly 62.9% and UBTech's roughly 54.6%, suggesting
              Leju has not yet reached the manufacturing scale or cost-structure discipline of its two largest domestic
              peers despite comparable industry tailwinds.
            calloutType: insight
            claimRefs:
