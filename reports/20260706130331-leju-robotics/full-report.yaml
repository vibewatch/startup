      - number: '6.3'
        title: Government-Anchored Data Channel and Industrial Vertical Economics
        blocks:
          - type: paragraph
            body: >-
              The Shijingshan relationship illustrates how Leju's largest disclosed single contract actually functions
              as a customer channel: Phase I opened in March 2025 at 3,000 square meters with 108 mixed-form robots
              across ten scenario zones, built in 22 days under district-government sponsorship, then expanded five
              months later into a dedicated Phase II Kuavo-only contract spanning 10,000+ square meters, targeting more
              than 6 million real-machine data records per year across 100 workstations (about 5,000 data-collection
              hours per month) and 16 sub-scenarios covering industrial manufacturing, smart home, elder care, and 5G
              integration. Named counterparties referenced within this ecosystem include Dongfang Precision, Haosen
              Intelligent, Peking University's Wuhan AI Research Institute, Zhengzhou University, Haichen, and Yuyi
              Technology, though the exact commercial terms between Leju and each of these named parties beyond the
              primary Shijingshan tender are not itemized in sources reviewed. By contrast, Leju's
              industrial-manufacturing vertical -- the smallest Kuavo revenue scenario at 3.88% -- remains anchored to a
              single disclosed proof-of-concept (the FAW Hongqi factory box-handling trial) with no confirmed conversion
              to a scaled production order. This asymmetry matters for comparison: Leju's global shipment ranking
              (3rd-4th by unit volume, about 5% share per Counterpoint) is driven overwhelmingly by the data-collection
              and research/education scenarios, which together account for over three-quarters of 2025 Kuavo revenue,
              while peer makers such as Unitree (RMB1.708 billion revenue, profitable) and UBTech (roughly RMB2 billion
              revenue) operate at four to seven times Leju's RMB258 million 2025 total revenue scale, with a materially
              different (more industrial and consumer) customer mix.
