  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The research-more call turns on real scale proof colliding with an unresolved valuation gap, intense competition,
      and sector-wide bubble warnings.
    data:
      nodes:
        - id: scale-proof
          label: Scale proof
          detail: 17x Kuavo unit growth and 365% revenue growth in 2025, plus a top-tier global shipment rank.
          tone: positive
        - id: commercialization-quality
          label: Commercialization quality
          detail: 44.94% of revenue from data collection versus 3.88% from industrial deployment; margin falling for 3 years.
          tone: warning
        - id: competitive-pressure
          label: Competitive pressure
          detail: >-
            Unitree and AgiBot combined are projected to take ~80% of 2026 China shipments; Unitree is already
            profitable.
          tone: warning
        - id: valuation-gap
          label: Valuation gap
          detail: RMB3B company-cited floor versus ~RMB10B market-implied ceiling is an unusually wide, unresolved spread.
          tone: warning
        - id: sector-bubble-risk
          label: Sector bubble risk
          detail: Morgan Stanley and Bloomberg-covered commentary warn of overheating and low (23%) buyer satisfaction.
          tone: negative
        - id: decision
          label: Research-more
          detail: Track the listing and revisit once final pricing, lockup, and ownership detail are public.
          tone: neutral
      edges:
        - from: scale-proof
          to: valuation-gap
        - from: commercialization-quality
          to: valuation-gap
        - from: competitive-pressure
          to: valuation-gap
        - from: valuation-gap
          to: decision
        - from: sector-bubble-risk
          to: decision
    approximationNotes: null
    claimRefs:
      - CV001
      - CV005
      - CV008
      - CV018
      - CV030
      - CV045
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      Leju's implied revenue multiple ranges from about 11.6x at the statutory floor to nearly 38.7x at the
      market-implied ceiling, using 2025 revenue of RMB258.19 million as the base.
    data:
      items:
        - label: Implied multiple at RMB3B statutory floor
          value: 11.6
          detail: Multiple of 2025 revenue if the IPO prices at the company-cited minimum listing threshold.
          tone: positive
        - label: Implied multiple at RMB4.327B last round
          value: 16.8
          detail: Multiple of 2025 revenue at the October 2025 post-money valuation.
          tone: neutral
        - label: Implied multiple at RMB6B base-case mid-point
          value: 23.2
          detail: Multiple of 2025 revenue under the base-case scenario pricing.
          tone: warning
        - label: Implied multiple at RMB10B market-implied target
          value: 38.7
          detail: Multiple of 2025 revenue at the analyst-implied ceiling circulating in market commentary.
          tone: negative
    approximationNotes: >-
      Multiples are simple valuation-to-2025-revenue bridges using RMB258.19 million as the denominator; they are not
      risk-adjusted or discounted-cash-flow outputs.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV008
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      Public evidence supports a wide IPO pricing range because the gap between Leju's own statutory floor and the
      market-implied ceiling is unusually large this close to listing.
    data:
      items:
        - label: Bear case
          low: 3
          mid: 3.5
          high: 4.3
          displayValue: RMB3.0B-RMB4.3B
          detail: >-
            IPO prices near the statutory floor or at/below the October 2025 mark if growth and sentiment both
            disappoint.
          tone: negative
        - label: Base case
          low: 5
          mid: 6.5
          high: 8
          displayValue: RMB5B-RMB8B
          detail: Moderate step-up typical of fast-growing ChiNext hard-tech debuts, roughly 1.2x-1.8x the last private round.
          tone: warning
        - label: Bull case
          low: 9
          mid: 10
          high: 12
          displayValue: RMB9B-RMB12B
          detail: Pricing near or above the market-implied ~RMB10B figure if sector sentiment and shipment rank stay strong.
          tone: positive
    approximationNotes: >-
      Ranges are scenario-based valuation outputs in RMB billions intended for investment-committee discussion, not
      management guidance or a company-issued price range.
    claimRefs:
      - CV005
      - CV017
      - CV028
      - CV029
      - CV030
      - CV035
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      Leju scores well on market growth and evidence quality but weakly on unit economics and valuation support given
      the unresolved pricing gap and sector bubble warnings.
    data:
      items:
        - label: Market growth
          score: 8
          detail: 47.6% China humanoid-robot market CAGR forecast through 2030 supports a long runway.
          tone: positive
        - label: Commercialization proof
          score: 5
          detail: >-
            Real unit and revenue growth, but concentrated in data collection and education rather than industrial
            deployment.
          tone: warning
        - label: Competitive moat
          score: 4
          detail: Unitree and AgiBot are projected to hold ~80% of 2026 China shipments and are better capitalized.
          tone: warning
        - label: Unit economics
          score: 3
          detail: >-
            Gross margin has fallen for three straight years to 40.78%, with three years of negative operating cash
            flow.
          tone: negative
        - label: Valuation support
          score: 3
          detail: >-
            A roughly 3.3x spread between the company-cited floor and the market-implied ceiling signals unresolved
            pricing.
          tone: negative
        - label: Governance / disclosure
          score: 5
          detail: >-
            A primary sponsor filing exists, but ownership concentration, dilution, and lockup detail are still
            incomplete.
          tone: warning
        - label: Evidence quality
          score: 6
          detail: Good corroboration across a primary filing and independent comparables, though some peer data conflicts.
          tone: neutral
    approximationNotes: >-
      Scores are 0-10 ordinal judgments synthesized from the reviewed public evidence for investment-committee
      discussion.
    claimRefs:
      - CV004
      - CV009
      - CV017
      - CV018
      - CV030
      - CV041
