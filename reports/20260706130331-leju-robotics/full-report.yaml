  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base and Segmentation
        blocks:
          - type: paragraph
            body: >-
              Leju sells three product lines to structurally different buyer/user/payer combinations. Kuavo full-size
              humanoids serve four disclosed 2025 revenue scenarios: data-collection operators (government-anchored
              training centers and dataset buyers), research/education institutions, commercial-service venues, and
              industrial manufacturing plants. Roban (mid/small humanoids) targets AI-research labs and higher-education
              science programs, while Aelos (small humanoids) targets primary/secondary STEM education, sold through a
              direct-plus-channel distribution network that Leju built during its 2016-2023 education-market years and
              then reused when it pivoted commercial focus toward Kuavo from 2023 onward. The buyer, user, and payer
              roles frequently diverge: a government industrial-development company can be the payer and contracting
              counterparty while the actual "user" is the robot itself generating training data for a separate
              data-consumption market, and a university lab can be the user while a provincial science-and-technology
              fund is the payer. Leju's own site organizes commercial offerings into four solution categories (Research
              Scenario, Business Service, Industrial Scenario, Training Ground) that map directly onto the four Kuavo
              revenue scenarios disclosed in its IPO-linked financials. Geographically, named institutional
              relationships span at least Beijing (Shijingshan data-training hub), Heilongjiang (Harbin Institute of
              Technology), Henan (Zhengzhou University), and Guangdong (headquarters and Dongfang Precision
              manufacturing), but industrial and commercial-vertical customers beyond these anchors remain undisclosed
              by name. Independent aggregators price Leju's two current Kuavo variants very differently by buyer type:
              KUAVO 5 at roughly $38,000 for a broader industrial/research/service market, and KUAVO-MY at
              $50,000-$150,000 specifically for laboratories, enterprises, and innovation centers, underscoring that
              Leju's "customer" spans a wide spend range within a single product family rather than one homogenous buyer
              profile.
