  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      Leju's highest residual risks cluster around actuator-supplier concentration, margin compression versus scaled
      peers, and capacity built ahead of confirmed demand, with export-control and revenue-durability risk close behind.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Single-supplier actuator concentration
          values:
            - label: high
              tone: negative
              detail: Reported reliance on a concentrated actuator supplier base with limited disclosed alternates.
            - label: critical
              tone: negative
              detail: A supply disruption would directly halt Kuavo production.
            - label: low-medium
              tone: warning
              detail: No confirmed second-source qualification underway.
            - label: high
              tone: negative
              detail: Exposure remains high until supplier diversification is confirmed.
        - label: Nvidia export-control exposure
          values:
            - label: medium
              tone: warning
              detail: US export licensing policy already tightened once in 2026.
            - label: high
              tone: negative
              detail: Restricts access to advanced AI compute needed for embodied-AI training.
            - label: medium
              tone: warning
              detail: Domestic chip alternatives exist but are not yet fully qualified.
            - label: high
              tone: negative
              detail: Escalation of controls could materially slow the AI development roadmap.
        - label: Margin compression vs. peers
          values:
            - label: high
              tone: negative
              detail: Margin gap versus Unitree/UBTech is already documented across fiscal periods.
            - label: high
              tone: negative
              detail: Persistently lower margin compresses the path to the 2028 profitability target.
            - label: medium
              tone: warning
              detail: Cost-reduction and pricing program underway but the gap remains wide.
            - label: high
              tone: negative
              detail: Residual exposure stays high until unit economics converge with peers.
        - label: Capacity overbuild
          values:
            - label: medium
              tone: warning
              detail: Capacity expansion appears to be running ahead of confirmed order volume.
            - label: high
              tone: negative
              detail: Underutilized capacity increases fixed-cost burden and cash burn.
            - label: medium
              tone: warning
              detail: No disclosed utilization target to validate pacing.
            - label: high
              tone: negative
              detail: Overbuild risk stays elevated absent backlog disclosure.
        - label: ChiNext IPO review timeline
          values:
            - label: medium
              tone: warning
              detail: Review accepted 2026-05-19 but completion timeline is unconfirmed.
            - label: medium
              tone: warning
              detail: Delay or rejection would affect financing runway and valuation.
            - label: medium
              tone: warning
              detail: Listing counsel engaged; alternative standard pathway used given losses.
            - label: medium
              tone: warning
              detail: Residual exposure is moderate pending SZSE review outcome.
        - label: Data-collection revenue durability
          values:
            - label: medium
              tone: warning
              detail: Analysts flag uncertainty once foundation-model data needs normalize.
            - label: high
              tone: negative
              detail: Data collection is roughly 45% of current KUAVO revenue.
            - label: low
              tone: warning
              detail: No disclosed diversification target away from data-collection reliance.
            - label: high
              tone: negative
              detail: Revenue mix stays exposed until industrial/research segments scale.
        - label: US legislative/market-access risk
          values:
            - label: low-medium
              tone: warning
              detail: GUARD Act is proposed but not yet enacted.
            - label: medium
              tone: warning
              detail: Enactment would foreclose a portion of potential US export market.
            - label: low
              tone: warning
              detail: No disclosed contingency plan for a US market restriction.
            - label: medium
              tone: warning
              detail: Residual exposure would rise materially if the bill advances.
    approximationNotes: >-
      Likelihood/impact/mitigation/residual labels are qualitative judgment calls by the diligence team based on
      disclosed facts, not a company-provided risk register.
    claimRefs:
      - CR007
      - CR016
      - CR006
      - CR010
      - CR001
      - CR025
      - CR042
  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      Leju's risks transmit through a small number of channels: supplier and compute concentration, margin pressure,
      capacity overbuild, and regulatory/legal burden all feed into cash burn, financing need, and valuation.
    data:
      nodes:
        - id: supplier-concentration
          label: Actuator supplier concentration
          detail: Single/concentrated actuator sourcing raises production continuity risk.
          tone: warning
        - id: export-controls
          label: Nvidia export-control exposure
          detail: US licensing tightening constrains advanced AI compute access.
          tone: warning
        - id: margin-pressure
          label: Margin compression vs. peers
          detail: Cost structure and pricing lag scaled competitors.
          tone: negative
        - id: capacity-overbuild
          label: Capacity built ahead of demand
          detail: Underutilized capacity raises fixed-cost burden.
          tone: warning
        - id: data-segment-risk
          label: Data-collection revenue durability risk
          detail: Largest revenue segment may not persist at current levels.
          tone: warning
        - id: regulatory-legal
          label: Regulatory/legal burden
          detail: HEIS certification, GUARD Act, and litigation environment add compliance overhead.
          tone: warning
        - id: cash-burn
          label: Cash burn / negative operating cash flow
          detail: Three consecutive years of negative operating cash flow.
          tone: negative
        - id: financing-need
          label: Financing need
          detail: Dependence on IPO proceeds or continued external financing.
          tone: negative
        - id: valuation
          label: Valuation risk
          detail: Analyst skepticism about fundamentals supporting current pricing.
          tone: negative
        - id: execution
          label: Execution risk (talent, leadership, ramp)
          detail: Founder concentration and talent competition affect delivery.
          tone: warning
      edges:
        - from: supplier-concentration
          to: margin-pressure
        - from: supplier-concentration
          to: cash-burn
        - from: export-controls
          to: margin-pressure
        - from: export-controls
          to: execution
        - from: margin-pressure
          to: cash-burn
        - from: capacity-overbuild
          to: cash-burn
        - from: data-segment-risk
          to: cash-burn
        - from: regulatory-legal
          to: financing-need
        - from: cash-burn
          to: financing-need
        - from: financing-need
          to: valuation
    approximationNotes: >-
      The graph is qualitative and source-backed: it shows causal direction based on disclosed facts, not synthetic
      probability weights.
    claimRefs:
      - CR007
      - CR016
      - CR006
      - CR010
      - CR025
      - CR018
      - CR003
      - CR032
      - CR033
