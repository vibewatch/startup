      - number: '4.5'
        title: Financial Verdict, Estimate Ranges, and Diligence Blockers
        blocks:
          - type: paragraph
            body: >
              Leju's financial profile combines genuinely differentiated top-line momentum — a 118.68% three-year
              revenue CAGR and a top-four global humanoid shipment ranking — with revenue quality and margin
              characteristics that lag its closest public comparables. Revenue quality is mixed: KUAVO's dominant,
              fast-growing share is real, but a large share of that growth (44.94% of KUAVO revenue) sits in
              data-collection contracts tied to policy-driven, possibly non-recurring embodied-intelligence dataset
              demand, while industrial deployment — the segment public peers like UBTECH have scaled past 80% of
              humanoid revenue — remains at proof-of-concept stage for Leju. The margin path is the sharpest red flag: a
              42.39% KUAVO segment margin versus 54.6%-60.27% for UBTECH and Unitree suggests Leju has not yet achieved
              the component vertical-integration or manufacturing scale its peers have, and single-supplier dependence
              on Wuxi Quanzhibo adds execution risk to any margin-recovery thesis. Capital intensity is high and rising:
              three consecutive years of negative operating cash flow, RMB 65 million-plus annual R&D spend, and a new
              30,000-unit-per-year facility running well under 50% utilization all point to continued reliance on
              external financing through at least the company's 2028 profitability target. The clearest diligence
              blockers are the absence of disclosed cash-on-hand, headcount, customer concentration, and
              receivables/inventory data — each of which materially changes the underwriting case and should be closed
              before any pre-IPO or anchor-investor commitment.
