chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Business Model, and Corporate Structure
        blocks:
          - type: paragraph
            body: >
              Leju Robotics was founded in 2016 in Shenzhen by a team of Harbin Institute of Technology (HIT) graduates
              led by Leng Xiaokun (冷晓琨). The company legally restructured in 2025, rebranding from Leju Robot (Shenzhen)
              Co., Ltd. to Leju Intelligence (Shenzhen) Co., Ltd. ahead of its IPO filing. Headquarters remain in
              Shenzhen, Guangdong, China, with additional offices in Harbin and Hangzhou.


              The company operates as a pure-play humanoid robotics firm with three product lines: the KUAVO series of
              full-size humanoid robots targeting industrial and commercial applications; the Roban series of
              mid-to-small humanoid robots for AI research and education; and the Aelos series of small robots for
              primary STEM education. In 2025, KUAVO series revenue accounted for 69.5% of total operating revenue (RMB
              178M of RMB 258M total), making it the dominant revenue contributor. The business model is B2B/B2G with a
              hybrid direct-sales and channel distribution approach developed through years in the education market.


              Leju initially entered the market through basic programming education with the Aelos robot in 2016-2017,
              then pivoted its strategic focus to general-purpose full-size humanoid robots in 2023. As of 2025, KUAVO's
              primary deployment scenarios include data collection (45% of KUAVO revenue), scientific research and
              education (32.5%), commercial services (18.7%), and early-stage industrial manufacturing (3.88%). The
              company filed for IPO on the Shenzhen ChiNext board under ChiNext's fourth listing standard, with its
              application accepted on May 19, 2026.
