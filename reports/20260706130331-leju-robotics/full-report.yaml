            body: >
              Leju's differentiation case rests on three legs: an early, deep HarmonyOS/Huawei relationship (KaihongOS,
              Pangu integration, the 2025 5G-A demo), nearly 100 accumulated invention patents in core-component and
              motion-control technology plus research ties to Harbin Institute of Technology, Soochow University,
              Shandong University and BIGAI, and an open-source developer surface most full-size humanoid OEMs do not
              publish. That case is offset by concrete compliance and supply-chain gaps. On certification, CAICT's
              CTTL-T lab passed an earlier ~45 kg/26-DoF KUAVO unit against a 13-dimension general-ontology test in
              2024, but no source shows the current Kuavo 5 generation was re-tested, and no source shows Leju holding
              ISO 9001, ISO 13482, or equivalent international certification; China's first national
              humanoid-robot/embodied-AI standard system (released March 2026) is industry-wide, not a Leju-specific
              conformance mark. On supply chain, Leju's own IPO-filing disclosure (as reported by financial press)
              states that joint modules and controllers are about 33% of procurement and that a single supplier, Wuxi
              Quanzhibo, supplies roughly 82.8% of joint modules and 17.2% of total procurement -- a concentration risk
              the company itself flagged, with no disclosed second-source plan. Independent commentary on China's 2026
              humanoid sector separately cautions that imitation-learning-centric R&D may not yet match the precision
