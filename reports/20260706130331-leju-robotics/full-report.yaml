      - number: '8.4'
        title: Competitive intensity and sector-wide bubble risk are the biggest swing factors
        blocks:
          - type: paragraph
            body: >-
              Leju does not compete in isolation, and the comparable set argues for caution on two fronts at once.
              First, TrendForce projects that Unitree and AgiBot together will capture nearly 80% of China's
              humanoid-robot shipments in 2026, leaving Leju and dozens of smaller players fighting over a shrinking
              residual share even as total industry output surges. Unitree's competing STAR Market filing already
              discloses real profitability (RMB 600 million adjusted net profit on RMB 1.7 billion revenue), which
              raises the bar for what investors may expect from any China humanoid-robot IPO priced after it, including
              Leju's.


              Second, and more structurally, independent and analyst commentary increasingly frames the entire China
              humanoid-robotics category as overheated. Coverage citing Bloomberg has warned of bubble risk as
              valuations for firms including Unitree and AgiBot have "soared," sometimes doubling within months, and
              other commentary separately labels humanoid robotics a candidate for the "next AI bubble" given capital
              inflows that outpace proven monetization. Reporting on the sector's 150-plus active companies notes that
              China's own government has already signaled a "reckoning" is coming. None of this is specific to Leju's
              product quality, but it is directly relevant to what any IPO buyer should be willing to pay, because a
              sector-wide sentiment reset would likely compress Leju's multiple regardless of its own execution.
            claimRefs:
              - CV018
              - CV021
              - CV022
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
              - CV038
              - CV040
      - number: '8.5'
        title: Exit readiness and the diligence asks that would move the call
        blocks:
          - type: paragraph
            body: >-
              Exit readiness should be treated as conditional, not confirmed. Leju has no controlling shareholder; its
              three named actual controllers hold power through a concerted-action arrangement rather than a single
              majority stake, per the sponsor's own listing recommendation. Public sources reviewed for this chapter do
              not disclose the post-IPO shareholding percentages of those controllers, the cap-table position of the
              more-than-ten institutional investors from the October 2025 round, or any lockup and share-transfer terms
              that would apply after listing -- a real gap given how often lockup expiry drives post-IPO share-price
              volatility in Chinese growth-stock listings.


              The most decision-relevant kill triggers are therefore concrete and trackable: an IPO price landing at or
              below the RMB 3 billion statutory floor, gross margin falling further below the already-declining 40.78%
              level, deepening reliance on data-collection contracts (44.94% of 2025 revenue) rather than diversified
              industrial deployment, and any sign that enterprise buyer satisfaction stays near the 23% level Morgan
              Stanley cited for the broader sector. Final diligence should prioritize the confirmed offer price and
              allocation, named customer concentration behind the data-collection revenue, the use-of-proceeds breakdown
              for the RMB 2.6 billion raise, and the ownership/lockup detail that remains the single largest evidence
              gap in the public record today.
            claimRefs:
              - CV002
              - CV012
              - CV015
              - CV035
              - CV036
              - CV037
              - CV041
              - CV042
              - CV046
