      - number: '3.4'
        title: Switching Costs, Lock-in, Multi-Homing, Distribution Power, and Supply/Partner Access
        blocks:
          - type: paragraph
            body: >-
              Switching costs across most current humanoid robot deployments -- including Leju's own data-collection,
              research/education, and commercial-service placements -- remain low to moderate because deployments are
              still pilot-scale rather than embedded into mission-critical production lines. This lets buyers multi-home
              across vendors or switch between contract cycles without major integration rework, a dynamic that keeps
              competitive intensity high and gives buyers leverage over any single vendor, Leju included. The exception
              is data-collection customers, where a given robot's specific morphology and sensor suite are baked into
              the resulting training dataset; switching vendors mid-dataset would require costly re-collection, creating
              a real, if narrow, form of lock-in that structurally favors vendors with the largest existing deployed
              base -- currently Unitree and AgiBot rather than Leju.


              On supply and partner access, Unitree's vertical integration (over 90% of core components in-house,
              production cost down from RMB 73,200 to RMB 62,200 per unit) provides meaningful insulation from external
              supplier shocks that smaller peers lack. Leju, by contrast, discloses a concentrated supply chain in its
              own prospectus: a single supplier, Wuxi Quanzhibo, accounted for 17.20% of Leju's total 2025 procurement
              spend and 82.82% of its joint-module procurement specifically -- a disclosed dependency risk that could
              directly impair Kuavo production if that relationship were disrupted or renegotiated unfavorably.


              On distribution power, automaker entrants such as Xpeng and Li Auto carry an inherent advantage: they
              already operate manufacturing-scale supply chains and retail/service networks built for electric vehicles,
              more than half of whose core components (motors, reducers) can reportedly be redirected to humanoid
              production without new capacity investment. This gives automakers a faster path to distribution scale than
              any of the four profiled direct-peer startups, including Leju, should they commit meaningfully to the
              humanoid category over the next several years.
            claimRefs:
              - CP013
              - CP032
              - CP033
              - CP045
              - CP047
              - CP055
      - number: '3.5'
        title: Moat Durability, Commoditization Risk, and Adverse Competitor Evidence
        blocks:
          - type: paragraph
            body: >-
              Leju's clearest near-term moat is its data-collection commercialization niche, which management frames as
              a defensible revenue stream while broader industrial ROI matures; data collection represented 45% of Kuavo
              revenue in 2025, versus 32.5% for research/education, 18.7% for commercial services, and only 3.88% for
              industrial manufacturing (evidenced by an early-stage FAW proof-of-concept deployment). However, this moat
              faces direct pressure from AgiBot's government-backed Shanghai data-collection infrastructure and
              Unitree's larger deployed fleet, both of which can generate comparable or greater training-data volume at
              scale.


              Commoditization risk is substantial and sector-wide. Industry data platform GGII reports China's 2025
              humanoid shipments reached 14,400 units, with 2026 output forecast to reach anywhere from 100,000 to
              200,000 units -- an unusually wide range that itself signals forecasting uncertainty. Counterpoint
              Research's Ethan Qi expects the current 100+ Chinese humanoid vendor field to consolidate to a few dozen
              following the IPOs of leaders like Unitree, implying real displacement risk for mid-scale players like
              Leju that lack Unitree's or AgiBot's cost curve or shipment scale. This is reinforced by adverse
              third-party evidence: Morgan Stanley's November 2025 research note flagged unresolved gaps in
              brain/VLA-model maturity, component-quality consistency, and cost pressure; a subsequent Morgan Stanley
              buyer survey found only 23% of prospective industrial buyers reported satisfaction with currently
              available humanoid products; Goldman Sachs warned of overcapacity risk as production scales ahead of firm
              orders; and China's own National Development and Reform Commission publicly cautioned that 150+ domestic
              humanoid firms risk producing "highly repetitive products." Forbes and France24/AFP both framed the
              broader buildout in explicit bubble-risk terms, and VC investors including GSR Ventures' Allen Zhu and
              firms such as ZhenFund and Sinovation Ventures have stated skepticism about near-term commercial
              viability, with most institutional and academic voices cited expecting genuine commercial maturity only
              five to ten years out.


              Taken together, this evidence suggests Leju's moat durability depends less on near-term industrial
              deployment (still a minority of its revenue) and more on defending its data-collection niche and platform
              partnerships (Huawei, Tencent) against faster-scaling, better-capitalized peers, while the broader
              sector-wide adverse signals -- regulatory caution, buyer dissatisfaction, and analyst skepticism -- apply
              pressure on all Chinese humanoid vendors' growth assumptions simultaneously, not on Leju uniquely.
