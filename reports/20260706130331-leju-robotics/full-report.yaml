  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams, Mix, Pricing, and Recognition
        blocks:
          - type: paragraph
            body: >
              Leju's ChiNext prospectus, accepted by the Shenzhen Stock Exchange on May 19, 2026, discloses operating
              revenue of RMB 54 million (2023), RMB 56 million (2024), and RMB 258 million (2025), a three-year compound
              annual growth rate of 118.68%. The KUAVO full-size humanoid line drove the breakout: it generated RMB 178
              million, or 69.5% of 2025 revenue, on 577 units sold versus 32 units in 2024. Roban (mid/small
              research-and-education humanoids) and Aelos (STEM-education robots) contributed a combined RMB 39.45
              million, up 47.35% year over year, across 91 and 3,988 units respectively — revenue the company's own
              official materials frame across research, business-service, industrial, and training-ground solution
              categories. Within KUAVO, data-collection contracts became the single largest deployment scenario at
              44.94% of segment revenue in 2025, ahead of research/education and commercial-service use, while
              industrial-manufacturing deployments remained mostly at proof-of-concept stage at just 3.88% of KUAVO
              revenue (roughly RMB 6.9 million). KUAVO's blended average selling price fell 25.56% year over year to
              roughly RMB 308,100 per unit, a deliberate price-for-volume strategy described in the prospectus. Because
              scenario-level revenue is disclosed only as a percentage mix rather than a discrete income-statement line,
              and Roban/Aelos revenue is reported jointly, precise recognition timing (delivery versus customer
              acceptance) and standalone product-line profitability cannot be confirmed from secondary reporting alone.
