  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Peers, Incumbents, Adjacents, Substitutes, and Entrants'
        blocks:
          - type: paragraph
            body: >-
              Leju Robotics (乐聚机器人), founded in 2016 in Shenzhen by Leng Xiaokun alongside co-founders Chang Lin and An
              Ziwei, competes in a crowded and rapidly consolidating Chinese humanoid robot landscape. Its direct peer
              set spans four companies profiled in depth in this chapter: Unitree Robotics and AgiBot (Zhiyuan
              Robotics), which together are projected to capture nearly 80% of total Chinese humanoid shipments per
              TrendForce; UBTECH Robotics, the only listed pure-play humanoid incumbent with audited public financials;
              and Fourier Intelligence, a medical-robotics-heritage vendor extending into general-purpose humanoids via
              its GRx series.


              Beyond these four, the landscape includes an emerging adjacent-entrant category: cash-rich Chinese
              automakers. XPeng CEO He Xiaopeng issued a company-wide strategic pivot letter on June 10, 2026 signaling
              automakers' intent to compete using existing EV manufacturing scale and balance-sheet depth, a structural
              threat independent vendors like Leju cannot easily match on capital alone. A long tail of over 100
              additional Chinese humanoid vendors (per Counterpoint Research), including lower-cost entrants such as
              Astribot and Noetix Robotics, further intensifies commoditization pressure from below.


              Finally, the status-quo substitute -- traditional industrial robots, AGVs, and manual labor -- remains the
              rational default for most buyers. AFP/France24 reporting citing Chinese officials confirms that
              large-scale, proven real-life humanoid use cases remain elusive despite the sector's rapid capital
              formation, meaning internal build or non-humanoid automation continues to compete directly with every
              vendor profiled here, including Leju, on a pure ROI basis.
            claimRefs:
