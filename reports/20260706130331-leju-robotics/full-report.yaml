      - number: '6.5'
        title: Expansion, Concentration, and Procurement Risk
        blocks:
          - type: paragraph
            body: >-
              Several adverse financial signals bear directly on customer economics. Kuavo's average unit selling price
              fell 25.56% year over year in 2025 as Leju pursued active market-share-defense pricing, while unit cost
              fell 27.35% over the same period; at the consolidated level, gross margin declined from 50.45% (2023) to
              44.30% (2024) to 40.78% (2025) as the lower-margin, higher-volume Kuavo mix displaced higher-margin
              Roban/Aelos education revenue, and net losses widened each year (RMB41.12 million, RMB59.23 million,
              RMB69.78 million) alongside negative operating cash flow in all three years -- a pattern one
              financial-media risk review flagged as structurally atypical for a scaling hardware/AI company and worth
              exchange-review scrutiny. Public reporting does not disclose an exact top-customer revenue-concentration
              percentage or accounts-receivable concentration figure, leaving genuine customer-concentration risk
              unquantified in sources reviewed. Supply-side concentration compounds procurement friction on the
              fulfillment side: a single supplier, Wuxi Quanzhibo, accounted for 17.20% of Leju's total 2025 procurement
              and 82.82% of its joint-actuator-module category specifically, a risk that could delay delivery to
              committed customers such as the Shijingshan Phase II buildout. Several named partnerships are explicitly
              non-binding framework agreements -- the Dongfang Precision agreement carries no mandatory obligation
              beyond IP, confidentiality, publicity, and anti-bribery clauses -- meaning disclosed "customer"
              relationships can overstate committed revenue. Leju's planned IPO-proceeds allocation (36.14% to an R&D
              center, 23.7% to dataset construction, 8.22% to a production base) signals that data-collection-customer
              scaling and industrial mass-production readiness, not consumer growth, are the company's primary post-IPO
              levers for expanding its customer base.
