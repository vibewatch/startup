      - number: '5.3'
        title: Deployment, reliability, developer ecosystem and roadmap
        blocks:
          - type: paragraph
            body: >
              Leju's own 2025 revenue mix shows where KUAVO actually gets used: data collection is the largest
              application at 45% of Kuavo-series revenue, research/education is 32.5%, commercial service is 18.7%, and
              industrial manufacturing is just 3.88% -- consistent with a 2025 proof-of-concept deployment (not a scaled
              production contract) of KUAVO 4 Pro units at a FAW Hongqi automotive line for box transport and picking.
              On reliability, Leju's head of solutions told the AW 2026 trade show that the latest platform has
              demonstrated mean time between failures above 1,000 hours and continuous operation up to 9.5 hours using
              factory test data -- a vendor-reported figure, not an independently audited one. The company's release
              cadence has been fast: KUAVO (branded Kuavo/Kuafu) launched in December 2023 with OpenHarmony integration,
              iterated to Kuavo 4 and 4 Pro in 2024, jointly demonstrated a 5G-A-connected humanoid with Huawei and
              China Mobile in June 2025, and launched Kuavo 5/5-W in October 2025, ahead of a May 2026 ChiNext IPO
              filing. External developers can reach the platform through kuavo-ros-opensource (GitHub: 49 stars/16
              forks/482 commits; Gitee mirror: 44 stars/7 issues, now marked archived and redirected to GitCode),
              kuavo_data_challenge, and a kuavo-humanoid-sdk-ws package on PyPI -- a real but small external developer
              footprint compared with mainstream robotics SDKs, and one whose canonical hosting location is already
