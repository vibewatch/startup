      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Current call: research-more, not a price-insensitive buy'
            body: >-
              Leju's growth proof is real, but the roughly 3.3x spread between its own RMB3B statutory floor and the
              RMB10B figure circulating in market commentary is too wide to underwrite before final pricing is public.
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV006
              - CV045
          - type: callout
            title: The valuation gap is the central risk, not just competition
            body: >-
              Even setting aside Unitree and AgiBot, the unresolved spread between Leju's company-cited listing floor
              and the market-implied ceiling is itself a valuation risk that final IPO pricing alone will resolve.
            calloutType: risk
            claimRefs:
              - CV004
              - CV005
              - CV035
          - type: callout
            title: Growth proof is real, even if margins are not yet mature
            body: >-
              17x Kuavo unit growth, 365% revenue growth, and a top-tier global shipment rank are genuine commercial
              signals that a large, fast-growing market can still support even amid near-term margin pressure.
            calloutType: strength
            claimRefs:
              - CV008
              - CV009
              - CV017
              - CV047
          - type: callout
            title: Base case assumes 2028 profitability stays on schedule
            body: >-
              The base-case valuation range assumes gross margin stabilizes near 40% and the company's own 2028
              profitability target is not pushed back by further price competition.
            calloutType: assumption
            claimRefs:
              - CV009
              - CV010
              - CV013
