      - number: '5.2'
        title: Architecture, operating model and manufacturing
        blocks:
          - type: paragraph
            body: >
              KUAVO's technology stack layers Huawei's OpenHarmony-based KaihongOS as the device/connectivity
              middleware, an on-device Nvidia Jetson Thor compute module for local multimodal AI inference, and an
              AI/model layer that an official exhibitor listing describes as integrating Huawei's Pangu model alongside
              ByteDance's Doubao and Alibaba Cloud's Qwen models for perception and task planning. Locomotion and
              manipulation run on self-developed high-torque electric joints (up to 360 Nm on the KUAVO-MY variant); no
              source reviewed for this chapter could confirm the cable/tendon-driven actuator design sometimes cited in
              secondary industry summaries, so that claim is treated as unverified rather than accepted. Leju publishes
              the motion-control layer as open-source software: kuavo-ros-opensource (ROS1, nMPC/whole-body control,
              MuJoCo/ Gazebo/Isaac Sim simulation support, MIT license) and kuavo_data_ challenge, a LeRobot-based
              toolkit for converting rosbag captures into training data. On the manufacturing side, Leju runs a Shenzhen
