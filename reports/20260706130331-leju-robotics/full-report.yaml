  - id: FP001
    title: Competitive positioning map
    type: quadrant
    layout: wide
    summary: >-
      Leju occupies a low-price, lower-momentum position versus Unitree and AgiBot, who combine aggressive pricing with
      the largest shipment scale; automakers and status-quo substitutes anchor the map's extremes.
    data:
      xAxis:
        label: Pricing accessibility (0=premium/undisclosed, 10=most affordable disclosed price)
      yAxis:
        label: Commercial momentum / shipment scale (0-10 ordinal)
      points:
        - label: Leju Robotics
          x: 5
          'y': 3
          detail: RMB 308,100 Kuavo ASP, 577 units sold 2025; smallest disclosed shipment base of the five peers.
          tone: neutral
        - label: Unitree
          x: 9
          'y': 10
          detail: >-
            Lowest disclosed ASP in category (G1 ~$16,000, R1 RMB 26,900) plus largest 2025 shipment volume (5,500+
            units).
          tone: positive
        - label: AgiBot
          x: 3
          'y': 9
          detail: >-
            No public pricing, but fastest production scale-up (10,000th unit by Mar 2026); high momentum, low price
            transparency.
          tone: positive
        - label: UBTECH
          x: 2
          'y': 6
          detail: >-
            Premium ~RMB 760,000 Walker S2 pricing; large 1,079-unit 2025 deliveries but lower momentum growth rate than
            Unitree/AgiBot.
          tone: positive
        - label: Fourier Intelligence
          x: 1
          'y': 3
          detail: No public GR-2 pricing; medical-robotics niche scale, modest disclosed momentum versus the two leaders.
          tone: neutral
        - label: Automaker entrants (Xpeng, Li Auto)
          x: 4
          'y': 1
          detail: Deep capital reserves but no disclosed humanoid shipments yet as of mid-2026; momentum still theoretical.
          tone: neutral
        - label: Status quo / internal build
          x: 8
          'y': 2
          detail: >-
            No incremental price and proven ROI, but momentum is structurally flat since it is the default rather than a
            growing alternative.
          tone: warning
    approximationNotes: >-
      Axis placements are evidence-backed ordinal judgments derived from the disclosed pricing and shipment-volume
      figures in this chapter's sources, not a single vendor-reported composite score; AgiBot, Fourier, and
      automaker-entrant placements rely partly on qualitative momentum signals given incomplete pricing disclosure.
