  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >
              Leju Robotics' ChiNext IPO application was formally accepted by the Shenzhen Stock Exchange on 2026-05-19,
              making it the first company to apply under the exchange's newly introduced fourth listing standard for
              technology companies that are not yet profitable. That standard, unveiled by the CSRC's April 2026 ChiNext
              reform, requires either a CNY 3 billion valuation with 30% three-year revenue CAGR, or a CNY 4 billion
              valuation with cumulative R&D spend above CNY 100 million and 15% of revenue. Review outcome and timing
              remain unconfirmed.


              China published its first national humanoid robot standard system (HEIS) in March 2026, drafted with input
              from more than 120 institutions and covering basic commonality, computing, components, complete machines,
              applications, and safety/ethics. Leju's specific certification tier under this standard has not been
              independently confirmed, leaving a regulatory-compliance question open ahead of listing.


              On the international side, the US tightened Nvidia AI-chip export licensing to China in 2026 and
              introduced case-by-case BIS review for advanced accelerators, directly relevant to the compute hardware
              embodied-AI developers depend on. A bipartisan GUARD Act was introduced in the US Congress targeting
              Chinese-made robots, which if enacted could restrict US market access for Chinese humanoid makers. Chinese
              courts have also actively adjudicated robotics IP disputes, and China's expanding AI/algorithm compliance
              regime adds an ongoing filing burden relevant to Leju's data-collection revenue segment.
            claimRefs:
              - CR001
