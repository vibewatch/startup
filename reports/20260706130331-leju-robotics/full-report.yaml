      - number: '4.4'
        title: Capital Adequacy and Financing Dependency
        blocks:
          - type: paragraph
            body: >
              Leju closed roughly RMB 1.5 billion (~$207-210 million) in pre-IPO financing in October 2025 — background
              covered in Company Overview — and is now targeting a further RMB 2.6 billion (~$360-380 million) through
              its ChiNext offering, implying an approximately RMB 10 billion valuation. Combined, primary and IPO-stage
              financing would exceed RMB 4 billion against 2025 revenue of only RMB 258 million, a ratio flagged by
              adverse IPO-focused coverage as unusually large relative to company scale. Disclosed use-of-proceeds
              allocations show the embodied-intelligence R&D center absorbing 36.14% of the raise and
              working-capital/marketing-network buildout another 24.62%, with the remainder split across a new
              humanoid-robot industrialization base (targeting 30,000 units/year capacity) and large-scale dataset
              construction. That financing is funding a cumulative three-year operating cash shortfall of roughly RMB
              85.2 million rather than a one-time capex event, meaning Leju remains structurally dependent on external
              capital until profitability — targeted by the company for 2028 — actually arrives. As a governance signal,
              controlling shareholders have committed to an extended lock-up if post-listing net profit falls more than
              50%, aligning insiders with near-term earnings stability. No source reviewed discloses Leju's exact
              cash-on-hand balance, monthly burn rate, or any debt or project-finance facilities, so runway cannot be
              computed independently of the disclosed operating cash-flow trend.
