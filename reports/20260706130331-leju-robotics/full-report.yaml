  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Recommendation: real growth proof, but the valuation is not yet resolved'
        blocks:
          - type: paragraph
            body: >-
              Leju Robotics enters its ChiNext IPO process with genuine commercial momentum. Its sponsor's listing
              recommendation confirms 2025 revenue of RMB 258.19 million, a three-year revenue CAGR of 118.68%, and a
              post-money valuation of RMB 4.327 billion from the October 2025 pre-IPO round that brought in over ten
              institutional investors. The company plans to raise RMB 2.6 billion by issuing no more than 20 million new
              shares against a pre-IPO base of 60 million shares, keeping the post-offering public float at or above
              25%.


              The harder question is price. Leju's own sponsor frames the ChiNext fourth-standard listing threshold only
              as an expected market capitalization of "not less than RMB 3 billion," a figure it says it clears using
              the last round's valuation and unnamed peer comparisons. Separately, market and media commentary around
              the same filing estimates an IPO-implied valuation near RMB 10 billion -- nearly 2.3x the last private
              mark and about 3.3x the statutory floor -- but that number is analyst-derived, not company-disclosed. That
              roughly 3x span between the floor Leju itself cites and the ceiling the market is discussing is unusually
              wide for a company this close to pricing, and it is the single best reason to prefer a research-more
              stance, medium confidence, high risk rating, and a stretched valuation stance over a firmer call before
              the final offer price is public.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV045
