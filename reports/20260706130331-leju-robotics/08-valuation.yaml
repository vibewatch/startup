  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - argument
      - direction
      - what would change the view
    rows:
      - - Kuavo unit sales grew 17x (32 to 577 units) and revenue grew 365% in 2025, evidencing real commercial traction.
        - thesis
        - A reversal in unit or revenue growth over the next 1-2 reporting periods would undercut the core growth thesis.
      - - Industry trackers rank Leju third globally in humanoid-robot shipments, ahead of most of the 150-plus companies now active in the category despite far less capital raised than its closest rivals.
        - thesis
        - Losing meaningful share to Unitree, AgiBot, or a new entrant would weaken this relative-positioning argument.
      - - The China humanoid-robot market is forecast to grow at a 47.6% CAGR through 2030, giving Leju a large runway even from its current single-digit global share.
        - thesis
        - A downgrade in sector growth forecasts or evidence of demand pull-forward would weaken this support.
      - - Gross margin has fallen for three straight years to 40.78%, and the company remains loss-making with negative operating cash flow, so current pricing chatter already assumes a hard-to-verify path to 2028 profitability.
        - anti-thesis
        - Two consecutive periods of margin stabilization or narrowing losses would meaningfully de-risk this concern.
      - - The roughly RMB10 billion IPO figure circulating in the market is not disclosed by the company itself, which frames its own listing threshold only as "not less than RMB3 billion" -- a nearly 3.3x spread that signals genuine pricing uncertainty.
        - anti-thesis
        - Publication of a firm offering price range in the final prospectus would resolve this uncertainty either way.
      - - Independent analysts have flagged sector-wide overvaluation, low buyer satisfaction (23%), and a probable startup shakeout among China's 150-plus humanoid-robot entrants.
        - anti-thesis
        - A verified rise in enterprise buyer satisfaction or a slowdown in new-entrant formation would ease this concern.
    notes: >-
      Arguments are intentionally price-sensitive: the thesis rows describe real operating proof, while the
      anti-thesis rows describe what current pricing chatter already has to assume.
