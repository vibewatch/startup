  - id: exit-readiness-and-diligence
    title: Exit readiness and the diligence asks that would move the call
    body: >-
      Exit readiness should be treated as conditional, not confirmed. Leju has no controlling shareholder; its three
      named actual controllers hold power through a concerted-action arrangement rather than a single majority stake,
      per the sponsor's own listing recommendation. Public sources reviewed for this chapter do not disclose the
      post-IPO shareholding percentages of those controllers, the cap-table position of the more-than-ten
      institutional investors from the October 2025 round, or any lockup and share-transfer terms that would apply
      after listing -- a real gap given how often lockup expiry drives post-IPO share-price volatility in Chinese
      growth-stock listings.


      The most decision-relevant kill triggers are therefore concrete and trackable: an IPO price landing at or below
      the RMB 3 billion statutory floor, gross margin falling further below the already-declining 40.78% level,
      deepening reliance on data-collection contracts (44.94% of 2025 revenue) rather than diversified industrial
      deployment, and any sign that enterprise buyer satisfaction stays near the 23% level Morgan Stanley cited for
      the broader sector. Final diligence should prioritize the confirmed offer price and allocation, named customer
      concentration behind the data-collection revenue, the use-of-proceeds breakdown for the RMB 2.6 billion raise,
      and the ownership/lockup detail that remains the single largest evidence gap in the public record today.
