  - id: TV006
    title: Final diligence asks table
    columns:
      - topic
      - missing evidence
      - why it matters
      - owner or diligence path
    rows:
      - - Ownership and control
        - Post-IPO shareholding percentages for the three actual controllers and the top institutional investors from the October 2025 round
        - No controlling shareholder currently exists; diffuse control could affect governance and post-listing decision-making
        - Request the registration statement's shareholder schedule and any concerted-action agreements
      - - Lockup and liquidity
        - Lockup period length and any early-release conditions for pre-IPO institutional and founder shares
        - Lockup expiry is a common valuation and liquidity catalyst for Chinese growth-stock IPOs
        - Review the final SZSE listing announcement and prospectus for lockup commitments once published
      - - Final offer price and allocation
        - The confirmed IPO offer price and institutional book-build results
        - Determines whether the ultimate valuation lands near the RMB3B floor, the RMB4.327B last round, or the market-implied ~RMB10B ceiling
        - Track SZSE and CSRC disclosure once pricing is set
      - - Customer concentration and contract quality
        - Named largest customers or contracts behind the 44.94% data-collection revenue share
        - Reveals whether growth is diversified or dependent on a small number of relationship-driven orders
        - Request customer-concentration disclosure from the prospectus's related-party and top-customer sections
      - - Post-IPO capital allocation
        - How the RMB2.6 billion in IPO proceeds will be split between industrialization capacity, R&D, and working capital
        - Determines whether new capital shortens or lengthens the path to the company's stated 2028 profitability target
        - Review the "use of proceeds" section of the final prospectus
    notes: >-
      These asks are the specific items most likely to change the recommendation or the acceptable entry price, not
      a generic due-diligence checklist.
