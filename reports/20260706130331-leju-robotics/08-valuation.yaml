  - id: scenario-logic
    title: 'Bull/base/bear: what has to be true at each price point'
    body: >-
      The bull case requires the current sector narrative to keep compounding rather than correct. If the 47.6%
      China market CAGR holds, Leju defends its top-tier shipment rank, and industrial deployment scales meaningfully
      beyond the current 3.88% revenue share, an IPO pricing near or above the market-implied ~RMB 10 billion figure
      becomes defensible -- a re-rating pattern not unlike Figure AI's move from a $2.6 billion valuation in early
      2024 to a $39 billion post-money mark by September 2025, roughly 15x in eighteen months.


      The base case is more conservative and, on current evidence, more likely: growth decelerates from the
      2023-2025 118.68% CAGR toward a still-fast but more sustainable pace, gross margin stabilizes near 40%, and the
      company's own 2028 profitability target stays intact, supporting an IPO price somewhere between the last
      private round and the analyst-implied ceiling.


      The bear case is the easiest to defend from public evidence alone. Morgan Stanley's own 2026 outlook warns of
      continued "short-term hype" against unresolved technical and commercialization hurdles, and a separate Morgan
      Stanley-cited survey found only 23% of enterprise buyers satisfied with currently available humanoid robots
      across a China sector that shipped roughly 14,000 units combined in 2025. If that gap between valuation and
      deployment reality resolves through price rather than product improvement, Leju's IPO could price at or below
      its October 2025 mark, effectively a down-round outcome for the newest pre-IPO investors.
