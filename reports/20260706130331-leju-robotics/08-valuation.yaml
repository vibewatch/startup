  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - trigger
      - threshold
      - transmission to thesis
      - action implication
    rows:
      - - IPO prices at or below the statutory floor
        - Final offer price implies a market cap of roughly RMB3-3.5B, at or below the October 2025 private mark
        - Signals the market rejects any premium for 2025's growth and shipment-rank proof
        - Treat as a valuation red flag; avoid paying above the disclosed private-round mark for any secondary access
      - - Gross margin falls further below 40%
        - Full-year gross margin drops below the 2025 level of 40.78% for two consecutive periods
        - Undermines the 2028 profitability timetable and increases financing risk
        - Downgrade valuation stance from stretched to expensive; reassess cash runway assumptions
      - - Data-collection revenue concentration deepens further
        - Data-collection share of revenue rises materially above 44.94% while industrial stays near 3.88%
        - Signals the growth story is increasingly contract-driven rather than scaled hardware deployment
        - Discount forward revenue quality in any updated valuation model
      - - A rival completes a larger, profitable IPO first
        - Unitree or AgiBot lists at a premium multiple with disclosed profitability (as Unitree's own filing already claims)
        - Sets a below-Leju bar for investor risk appetite in the category, pressuring Leju's relative pricing
        - Re-underwrite Leju's IPO pricing expectations downward relative to the peer outcome
      - - Buyer satisfaction stays depressed sector-wide
        - Follow-up 2026-2027 surveys show no material improvement from the 23% level Morgan Stanley cited
        - Confirms the commercialization gap the sector-wide bubble warnings describe applies to Leju's own customer base
        - Treat as confirmation of the bear case; avoid adding exposure until satisfaction data improves
    notes: >-
      Triggers are chosen because each would directly and measurably move the recommendation, not because they are
      generic sector risks.
