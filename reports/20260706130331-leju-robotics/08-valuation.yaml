      - - Unitree Robotics
        - 2025 revenue RMB1.7B, adjusted net profit RMB600M
        - March 2026 STAR Market filing implies a minimum market cap of ~RMB42B (~24.7x revenue); prior chatter ranged from RMB12.7B (Jun 2025 round) to RMB50B (Sept 2025 IPO target)
        - Closest domestic peer and concurrent 2026 China humanoid IPO filer; already profitable, unlike Leju.
        - Different product mix (quadrupeds plus humanoids) and disclosed profitability make it an optimistic comparison for Leju.
      - - AgiBot (Zhiyuan / 智元机器人)
        - 2025 revenue ~$10.8M
        - One tracker cites a $6.4B Series B valuation (Oct 2025); others cite $2.1B-RMB18B (~$2.5B)
        - Top China humanoid comp frequently cited alongside Leju and Unitree in market-share coverage.
        - No IPO filed and conflicting valuation figures reduce reliability of any single benchmark mark.
      - - UBTECH Robotics (9880.HK)
        - Public market capitalization
        - ~$6.29B (July 2026); shares traded across a wide 52-week HKD75.50-HKD161.00 range
        - Only Chinese humanoid-robot pure play already public; provides a real post-listing re-rating signal.
        - Broader product/service mix (industrial, consumer, education) than Leju's narrower base; distinct listing history since 2023.
      - - Figure AI (US)
        - Series C valuation progression
        - $39B post-money (Sept 2025), up from $2.6B in early 2024 -- about 15x in 18 months
        - Shows how aggressively humanoid-robot valuations can re-rate globally under strong investor demand.
        - Different capital market, currency, and investor base; no disclosed revenue for a like-for-like multiple.
