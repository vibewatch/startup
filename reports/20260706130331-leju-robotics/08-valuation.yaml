  - id: competitive-and-bubble-risk
    title: Competitive intensity and sector-wide bubble risk are the biggest swing factors
    body: >-
      Leju does not compete in isolation, and the comparable set argues for caution on two fronts at once. First,
      TrendForce projects that Unitree and AgiBot together will capture nearly 80% of China's humanoid-robot
      shipments in 2026, leaving Leju and dozens of smaller players fighting over a shrinking residual share even as
      total industry output surges. Unitree's competing STAR Market filing already discloses real profitability
      (RMB 600 million adjusted net profit on RMB 1.7 billion revenue), which raises the bar for what investors may
      expect from any China humanoid-robot IPO priced after it, including Leju's.


      Second, and more structurally, independent and analyst commentary increasingly frames the entire China
      humanoid-robotics category as overheated. Coverage citing Bloomberg has warned of bubble risk as valuations for
      firms including Unitree and AgiBot have "soared," sometimes doubling within months, and other commentary
      separately labels humanoid robotics a candidate for the "next AI bubble" given capital inflows that outpace
      proven monetization. Reporting on the sector's 150-plus active companies notes that China's own government has
      already signaled a "reckoning" is coming. None of this is specific to Leju's product quality, but it is
      directly relevant to what any IPO buyer should be willing to pay, because a sector-wide sentiment reset would
      likely compress Leju's multiple regardless of its own execution.
