  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - scenario
      - assumptions
      - valuation / return logic
      - key risks
      - probability signal
    rows:
      - - Bull
        - Sector CAGR holds near 47.6% through 2030, Leju defends its top-tier shipment rank, and industrial revenue scales meaningfully beyond the current 3.88% share.
        - IPO prices near or above the market-implied ~RMB10B mark (~38.7x 2025 revenue), a re-rating pattern comparable to Figure AI's 15x jump in about 18 months.
        - Requires the China humanoid-robot bubble narrative to keep inflating rather than correct, per Morgan Stanley- and Bloomberg-covered warnings.
        - low-medium
      - - Base
        - Revenue growth decelerates from the 2023-2025 118.68% CAGR toward a still-fast 50-80% pace; gross margin stabilizes near 40%; the 2028 profitability target stays on schedule.
        - IPO prices in a roughly RMB5B-RMB8B range, about 1.2x-1.8x the October 2025 post-money mark and below the analyst-implied ceiling.
        - Competitive pricing pressure from Unitree and AgiBot could compress margins faster than volume growth offsets.
        - medium
      - - Bear
        - Growth slows sharply, margin keeps falling below 40.78%, and sector sentiment cools amid bubble warnings and the 23% buyer-satisfaction figure Morgan Stanley cited.
        - IPO prices near the statutory RMB3B floor or below the October 2025 mark, a down-round-like outcome for the newest pre-IPO investors.
        - Persistent negative operating cash flow could force additional dilutive financing before 2028 profitability is reached.
        - medium
    notes: >-
      Scenarios are revenue-multiple and sentiment frameworks; Leju does not yet disclose forward guidance precise
      enough to support a discounted-cash-flow model.
