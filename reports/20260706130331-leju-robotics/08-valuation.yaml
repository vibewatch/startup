      - FV004
  - id: thesis-and-price-context
    title: 'Thesis vs. anti-thesis: strong unit growth meets an unresolved pricing gap'
    body: >-
      The thesis case is concrete. Kuavo full-size humanoid unit sales rose from 32 in 2024 to 577 in 2025 -- a 17x
      increase -- while total revenue grew 365% to RMB 258.19 million. Industry-tracker coverage of the IPO filing
      ranked Leju third globally in humanoid-robot shipments, ahead of most of the 150-plus companies now active in
      the sector, despite raising far less capital than its two closest domestic rivals. That traction sits inside a
      China humanoid-robot market MarketsandMarkets forecasts to grow at a 47.6% CAGR from $0.4 billion (2025) to
      $2.8 billion (2030), giving Leju a long runway even from its current single-digit global share.


      The anti-thesis is just as concrete. Gross margin has fallen for three straight years, from 50.45% (2023) to
      44.30% (2024) to 40.78% (2025), and the sponsor's own risk disclosure flags this as an ongoing threat to
      profitability. Net losses attributable to parent shareholders widened from RMB 41.12 million (2023) to RMB
      69.78 million (2025), with a related total-net-profit line showing a slightly larger RMB 71.25 million loss for
      the same year, and operating cash flow has been negative for three consecutive years. Against comparable peers,
      Unitree's own STAR Market filing already shows 2025 revenue of RMB 1.7 billion and an adjusted net profit of
      RMB 600 million -- a profitability level Leju has not reached -- while AgiBot's disclosed valuation figures
      range so widely ($2.1 billion to $6.4 billion across trackers) that they undermine confidence in cross-company
      benchmarking generally. UBTECH, the only Chinese humanoid-robot pure play already public, trades at roughly
      $6.29 billion in market cap but has swung across a wide 52-week share-price range, a preview of the volatility
      Leju itself may face after listing.
