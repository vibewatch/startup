  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: ownership and control
      missingEvidence: A full post-IPO cap table showing shareholding percentages for the three actual controllers and the top-ten institutional investors from the October 2025 round.
      whyItMatters: Leju has no controlling shareholder, and concentrated founder control via a concerted-action arrangement raises governance and post-listing alignment questions that are directly relevant to valuation durability.
      diligencePath: Request the registration statement's shareholder schedule and any concerted-action agreements directly from the company or its sponsor once the final prospectus is registered.
      relatedQuestionRefs:
        - QV019
    - type: missing-source
      severity: material
      topic: lockup and liquidity
      missingEvidence: Lockup period length and any early-release conditions applicable to pre-IPO institutional and founder shareholders after listing.
      whyItMatters: Lockup expiry is a common valuation and liquidity-risk catalyst for newly listed Chinese growth-stock IPOs and would materially affect exit timing and post-listing share-price behavior.
      diligencePath: Review the final SZSE listing announcement and registered prospectus for lockup commitments once they are published ahead of trading.
      relatedQuestionRefs:
        - QV020
    - type: conflicting-data
      severity: minor
      topic: AgiBot valuation reliability
      missingEvidence: A single authoritative, dated valuation mark for AgiBot corroborated by a primary or regulatory-grade source.
      whyItMatters: Conflicting AgiBot valuation figures, ranging from about $2.1 billion to $6.4 billion, reduce confidence in the cross-company benchmarking used in the comparable valuation table.
      diligencePath: Track AgiBot's own funding announcements or a future IPO filing for an audited or company-confirmed valuation mark.
      relatedQuestionRefs:
        - QV009
      relatedTableRefs:
        - TV004
