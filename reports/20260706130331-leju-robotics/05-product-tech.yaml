company:
  name: "Leju Robotics"
chapter:
  number: 5
  title: "Product & Technology"
  summary: "Leju sells three hardware lines built on one HarmonyOS/Nvidia/Huawei-Pangu stack -- KUAVO full-size humanoids for data collection, research and early industrial pilots; Roban for research/education; and Aelos for K-12 programming -- with a mid-2026 Foshan line targeting 10,000 units/year, but public evidence still leaves ISO-grade certification, cable-driven actuator claims, and after-sales SLAs unverified."
sections:
  - id: product-portfolio
    title: "Product portfolio in customer workflow terms"
    body: >
      Leju organizes its hardware around three lines that map to three buyers.
      KUAVO is the flagship full-size humanoid (KUAVO 4 Pro, KUAVO 5, the
      wheeled KUAVO 5-W, and the commercial-service variant KUAVO-MY), sold to
      embodied-AI data-collection centers, university/research labs and, on a
      proof-of-concept basis, industrial manufacturers. Roban is a mid-size
      research/education humanoid aimed at universities and STEM programs.
      Aelos is a small humanoid built for K-12 programming education and is
      Leju's highest-volume product by unit count. Public specification
      sheets for the current KUAVO generation converge on roughly 168 cm and
      55 kg with 40 degrees of freedom and high-torque electric actuators,
      though a separate exhibitor-published Kuavo 5 listing describes a
      taller, heavier 1.73 m / 63.5 kg / 41-DoF configuration marketed as the
      world's first 5G-A humanoid robot -- a discrepancy that likely reflects
      different sub-models or timing but that no single authoritative,
      dated spec sheet resolves. In 2025 Leju sold 577 KUAVO units (versus 32
      in 2024) and 3,988 Aelos plus 91 Roban units, a mix that independent
      shipment trackers (Omdia, Counterpoint Research) used to rank Leju
      fourth globally by humanoid-robot volume. The workload each buyer
      actually runs differs sharply: Aelos customers run block/Python
      programming exercises, Roban customers run research locomotion and
      perception experiments, and KUAVO customers most often use the robot to
      capture real-world interaction data for training embodied-AI models
      rather than to run production tasks.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE006, CE007]
    tableRefs: [TE001]
    figureRefs: [FE004]
  - id: architecture-manufacturing
    title: "Architecture, operating model and manufacturing"
    body: >
      KUAVO's technology stack layers Huawei's OpenHarmony-based KaihongOS as
      the device/connectivity middleware, an on-device Nvidia Jetson Thor
      compute module for local multimodal AI inference, and an AI/model layer
      that an official exhibitor listing describes as integrating Huawei's
      Pangu model alongside ByteDance's Doubao and Alibaba Cloud's Qwen
      models for perception and task planning. Locomotion and manipulation
      run on self-developed high-torque electric joints (up to 360 Nm on the
      KUAVO-MY variant); no source reviewed for this chapter could confirm
      the cable/tendon-driven actuator design sometimes cited in secondary
      industry summaries, so that claim is treated as unverified rather than
      accepted. Leju publishes the motion-control layer as open-source
      software: kuavo-ros-opensource (ROS1, nMPC/whole-body control, MuJoCo/
      Gazebo/Isaac Sim simulation support, MIT license) and kuavo_data_
      challenge, a LeRobot-based toolkit for converting rosbag captures into
      training data. On the manufacturing side, Leju runs a Shenzhen
      R&D-and-pilot line (roughly 500-1,000 units/year) feeding a Foshan mass
      line opened in March 2026 with Dongfang Precision, rated above 10,000
      units per year, 24 assembly steps, 77 inspection checks and 41
      automated test stations, and a claimed 30-minute per-unit cycle time.
      That capacity claim is fresh and unproven at full run rate.
    claimRefs: [CE008, CE009, CE010, CE011, CE012, CE015, CE022, CE023, CE024, CE048]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: deployment-reliability-roadmap
    title: "Deployment, reliability, developer ecosystem and roadmap"
    body: >
      Leju's own 2025 revenue mix shows where KUAVO actually gets used: data
      collection is the largest application at 45% of Kuavo-series revenue,
      research/education is 32.5%, commercial service is 18.7%, and
      industrial manufacturing is just 3.88% -- consistent with a 2025
      proof-of-concept deployment (not a scaled production contract) of
      KUAVO 4 Pro units at a FAW Hongqi automotive line for box transport and
      picking. On reliability, Leju's head of solutions told the AW 2026
      trade show that the latest platform has demonstrated mean time between
      failures above 1,000 hours and continuous operation up to 9.5 hours
      using factory test data -- a vendor-reported figure, not an
      independently audited one. The company's release cadence has been
      fast: KUAVO (branded Kuavo/Kuafu) launched in December 2023 with
      OpenHarmony integration, iterated to Kuavo 4 and 4 Pro in 2024, jointly
      demonstrated a 5G-A-connected humanoid with Huawei and China Mobile in
      June 2025, and launched Kuavo 5/5-W in October 2025, ahead of a May
      2026 ChiNext IPO filing. External developers can reach the platform
      through kuavo-ros-opensource (GitHub: 49 stars/16 forks/482 commits;
      Gitee mirror: 44 stars/7 issues, now marked archived and redirected to
      GitCode), kuavo_data_challenge, and a kuavo-humanoid-sdk-ws package on
      PyPI -- a real but small external developer footprint compared with
      mainstream robotics SDKs, and one whose canonical hosting location is
      already shifting.
    claimRefs: [CE013, CE014, CE016, CE020, CE021, CE025, CE026, CE027, CE028, CE029, CE030, CE031, CE032]
    tableRefs: [TE002, TE005]
    figureRefs: [FE002]
  - id: differentiation-trust-compliance
    title: "Differentiation, IP and trust/compliance risk"
    body: >
      Leju's differentiation case rests on three legs: an early, deep
      HarmonyOS/Huawei relationship (KaihongOS, Pangu integration, the
      2025 5G-A demo), nearly 100 accumulated invention patents in
      core-component and motion-control technology plus research ties to
      Harbin Institute of Technology, Soochow University, Shandong University
      and BIGAI, and an open-source developer surface most full-size
      humanoid OEMs do not publish. That case is offset by concrete
      compliance and supply-chain gaps. On certification, CAICT's CTTL-T lab
      passed an earlier ~45 kg/26-DoF KUAVO unit against a 13-dimension
      general-ontology test in 2024, but no source shows the current Kuavo 5
      generation was re-tested, and no source shows Leju holding ISO 9001,
      ISO 13482, or equivalent international certification; China's first
      national humanoid-robot/embodied-AI standard system (released March
      2026) is industry-wide, not a Leju-specific conformance mark. On
      supply chain, Leju's own IPO-filing disclosure (as reported by
      financial press) states that joint modules and controllers are about
      33% of procurement and that a single supplier, Wuxi Quanzhibo, supplies
      roughly 82.8% of joint modules and 17.2% of total procurement -- a
      concentration risk the company itself flagged, with no disclosed
      second-source plan. Independent commentary on China's 2026 humanoid
      sector separately cautions that imitation-learning-centric R&D may not
      yet match the precision industrial manufacturing requires, tempering
      how far the data-collection and research traction should be read as
      industrial-readiness.
    claimRefs: [CE017, CE018, CE019, CE033, CE034, CE035, CE036, CE037, CE038, CE039, CE040, CE041, CE042, CE043, CE044, CE045, CE046, CE047]
    tableRefs: [TE004]
    figureRefs: [FE003]
callouts:
  - calloutType: risk
    title: "Single-supplier joint-module dependency"
    body: "Roughly 82.8% of Leju's purchased joint modules and 17.2% of total 2025 procurement came from one supplier, Wuxi Quanzhibo -- a concentration the company's own IPO-filing disclosure flags as a production and cost risk with no disclosed alternative source."
    claimRefs: [CE036, CE037, CE038]
  - calloutType: assumption
    title: "Cable-driven actuator claim is unverified"
    body: "Secondary industry summaries describe KUAVO's actuators as cable-driven, but every directly reviewed technical source instead documents self-developed high-torque electric joints; this chapter treats the cable-driven claim as an open evidence gap rather than a confirmed architecture detail."
    claimRefs: [CE048]
  - calloutType: strength
    title: "Deep, multi-layer Huawei relationship"
    body: "KaihongOS (OpenHarmony), Pangu model integration, and a joint 2025 5G-A humanoid demo with Huawei and China Mobile give Leju an ecosystem tie that most rival humanoid OEMs have not replicated at the same depth."
    claimRefs: [CE009, CE010, CE028]
