callouts:
  - calloutType: strength
    title: "China Commands 85% of Global Humanoid Robot Installations"
    body: "China's dominance in humanoid robot installations creates a powerful ecosystem advantage for domestic players like Leju, including supply chain density, policy support, and deployment data availability."
    claimRefs: [CM002, CM018]
  - calloutType: risk
    title: "Market Sizing Uncertainty Spans 10x Range"
    body: "Credible 2030 market forecasts range from $2.8B (hardware-only) to $77B (embodied AI), making valuation benchmarking extremely uncertain. Leju's current $36M revenue represents a tiny fraction even of conservative estimates."
    claimRefs: [CM005, CM006, CM009]
  - calloutType: insight
    title: "Data Collection, Not Manufacturing, Drives Current Demand"
    body: "Despite the narrative of industrial humanoid robots, 45% of Leju's KUAVO revenue comes from AI data collection—suggesting the immediate market is training-data-as-a-service rather than factory automation."
    claimRefs: [CM004, CM012]
  - calloutType: recommendation
    title: "Track Industrial Manufacturing Adoption as Key Valuation Catalyst"
    body: "Industrial manufacturing represents only 3.88% of KUAVO revenue today but is the segment where humanoid robots have the largest long-term TAM. Acceleration in this segment would validate the bullish market projections underlying Leju's IPO valuation."
    claimRefs: [CM015, CM022]
