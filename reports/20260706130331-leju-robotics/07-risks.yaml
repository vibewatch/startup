    title: "Single-Supplier Actuator Dependency Is the Highest-Severity Operational Risk"
    body: "Leju's reported reliance on a concentrated actuator supplier base, including Wuxi Quanzhibo, with no disclosed second-source qualification, is the single highest-severity operational risk identified: a supply disruption would directly halt Kuavo production."
    claimRefs: [CR007, CR008]
  - calloutType: risk
    title: "Data-Collection Revenue, ~45% of the Business, May Not Be Durable"
    body: "Independent commentary flags that Leju's largest revenue segment -- AI training-data collection services -- could shrink once foundation-model developers accumulate sufficient training data, a demand-durability risk not yet offset by industrial-segment scale-up (only 3.88% of FY2025 revenue)."
    claimRefs: [CR023, CR025]
  - calloutType: insight
    title: "Margin Gap to Unitree and UBTech Signals a Scale Disadvantage"
    body: "Leju's FY2025 gross margin of 40.78% trails Unitree's roughly 62.9% and UBTech's roughly 54.6%, suggesting Leju has not yet reached the manufacturing scale or cost-structure discipline of its two largest domestic peers despite comparable industry tailwinds."
    claimRefs: [CR006, CR027]
  - calloutType: recommendation
    title: "Track Second-Source Qualification, HEIS Certification, and ChiNext Review Status as Near-Term Diligence Triggers"
    body: "The three most decision-relevant monitoring items over the next 12 months are: confirmed second-source actuator qualification, Leju's specific HEIS certification tier, and the SZSE ChiNext review outcome -- withdrawal or rejection of the listing would be a thesis-breaking event."
    claimRefs: [CR015, CR001]
