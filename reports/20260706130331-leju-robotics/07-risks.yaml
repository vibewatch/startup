    - type: missing-source
      severity: material
      topic: "HEIS certification tier for Leju"
      missingEvidence: "No source confirms which specific HEIS certification tier or compliance status applies to Leju Robotics; the standard's existence is confirmed but company-level certification is not."
      whyItMatters: "Without confirmed certification status, it is unclear whether Leju faces near-term compliance costs or sales restrictions tied to the new national standard."
      diligencePath: "Request Leju's HEIS certification documentation directly from the company or from the standard-setting body (China Electronics Standardization Institute)."
      relatedQuestionRefs: [QR016]
    - type: conflicting-data
      severity: material
      topic: "Headcount discrepancy across registries"
      missingEvidence: "Two public Chinese business registries (QCC showing 76 insured employees for 2024, and Baidu AIQICHA showing 198) present conflicting headcount figures with no reconciling source."
      whyItMatters: "Headcount is a basic indicator of organizational scale relevant to assessing execution capacity ahead of a public listing; an unreconciled 2.6x discrepancy raises questions about registry currency or reporting scope."
      diligencePath: "Request Leju's prospectus-disclosed headcount and organizational chart directly, and confirm which registry reflects the current filing period."
      relatedQuestionRefs: [QR035]
    - type: conflicting-data
      severity: minor
      topic: "Shipment ranking methodology discrepancy"
      missingEvidence: "Sources differ on how Leju ranks among Chinese humanoid makers by shipment volume, with some framing the market as a Unitree/AgiBot duopoly that leaves limited room for other shippers including Leju."
      whyItMatters: "Leju's competitive shipment ranking affects how much weight to place on capacity and demand risk relative to the two largest players."
      diligencePath: "Request unit-shipment disclosure directly from Leju's prospectus and compare against independent market-research shipment trackers."
      relatedQuestionRefs: [QR012]
    - type: enumeration-incomplete
      severity: minor
      topic: "Regulatory / legal risk register coverage is partial"
      missingEvidence: "The regulatory/legal risk register prioritizes the highest-severity disclosed and sector-wide risks identified through public sources; non-public litigation records, internal compliance filings, and any confidential regulatory correspondence are excluded."
      whyItMatters: "A partial enumeration could understate risks not yet publicly disclosed, such as pending but unfiled litigation or private regulator inquiries."
      diligencePath: "Request Leju's full legal proceedings disclosure and regulatory correspondence log as part of standard IPO due diligence."
      relatedTableRefs: [TR001]
    - type: missing-source
      severity: material
      topic: "Entity-list or export-control designation risk specific to Leju"
      missingEvidence: "No source confirms or denies whether Leju Robotics or its named suppliers/partners are subject to, or at elevated risk of, US Entity List or similar export-control designation specific to the company (as opposed to sector-wide export policy)."
      whyItMatters: "A company-specific designation would be a more severe and immediate risk than the general sector-wide export-control tightening already documented, potentially cutting off compute or component access entirely."
      diligencePath: "Monitor US BIS Entity List updates and request Leju's own disclosure of any export-control-related compliance reviews or notices received."
