  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-disclosure-gap
      missingEvidence: Net revenue retention, gross revenue retention, logo-churn rate, and average renewal/contract length by customer segment.
      whyItMatters: Without cohort-level retention data, it is impossible to distinguish durable institutional demand from one-off tender wins or framework agreements, which materially affects any revenue-durability judgment.
      diligencePath: Request cohort-level renewal/usage data and contract-term schedules directly from Leju management or IPO underwriters during diligence.
      relatedQuestionRefs: [QU014]
      relatedTableRefs: [TU004]
    - type: missing-source
      severity: material
      topic: customer-concentration-disclosure
      missingEvidence: Exact top-customer revenue-concentration percentage and accounts-receivable-by-customer concentration figure.
      whyItMatters: Concentration risk directly affects revenue-quality and downside-scenario judgments, especially given the single large Shijingshan contract identified in this chapter.
      diligencePath: Request the itemized customer-concentration and receivables-aging tables from the CSRC/exchange prospectus filing once publicly posted, or directly from company investor relations.
      relatedQuestionRefs: [QU015, QU010]
      relatedTableRefs: [TU005]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof-table-coverage
      missingEvidence: A complete roster of Leju's claimed 500+ industry-level application customers; only seven are independently named in public sources reviewed for this chapter.
      whyItMatters: The chapter's named-customer-proof table cannot represent overall customer breadth without a fuller roster, and reliance on seven named relationships risks overstating how representative the sample is.
      diligencePath: Request the full customer list, or a representative anonymized sample with segment/region breakdown, from company management.
      relatedQuestionRefs: [QU004, QU023]
      relatedTableRefs: [TU003]
    - type: access-blocked
      severity: minor
      topic: third-party-pilot-claims
      missingEvidence: Official confirmation or independent corroboration of ChipSilicon-listed pilot engagements (NIO, Haier, Hengtong, China Southern Power Grid).
      whyItMatters: Presenting these pilots as verified would overstate Leju's industrial customer traction beyond what official disclosures and independent news support.
      diligencePath: Contact Leju investor relations or the named counterparties directly to confirm pilot status; treat aggregator-only claims as unverified until corroborated.
      relatedQuestionRefs: [QU023]
    - type: stale
      severity: minor
      topic: retail-reviews-historical
      missingEvidence: A current (2025/2026) independent review of Aelos-series education robots; the only independent in-depth review found dates to 2019, predating Leju's Kuavo-era industrial pivot.
      whyItMatters: A 2019 review of an earlier product generation cannot speak to current-generation product quality or customer satisfaction.
      diligencePath: Search for or commission a current hands-on review of the latest Aelos Pro3 or successor variant.
      relatedQuestionRefs: [QU018]
