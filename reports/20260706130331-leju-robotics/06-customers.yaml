runDate: "2026-07-06"
company:
  name: Leju Robotics
chapter:
  number: 6
  title: Customers
  summary: >-
    Leju's customer base splits across four Kuavo-revenue scenarios (data
    collection 44.94%, research/education 32.5%, commercial services 18.68%,
    industrial manufacturing 3.88%) plus a separate education-hardware channel
    (Aelos/Roban), but fewer than ten counterparties are independently named in
    public sources against a claimed 500+ industry-level customer base, and no
    retention, renewal, or customer-concentration percentage is disclosed.
sections:
  - id: segmentation
    title: Customer Base and Segmentation
    body: >-
      Leju sells three product lines to structurally different buyer/user/payer
      combinations. Kuavo full-size humanoids serve four disclosed 2025 revenue
      scenarios: data-collection operators (government-anchored training centers
      and dataset buyers), research/education institutions, commercial-service
      venues, and industrial manufacturing plants. Roban (mid/small humanoids)
      targets AI-research labs and higher-education science programs, while
      Aelos (small humanoids) targets primary/secondary STEM education, sold
      through a direct-plus-channel distribution network that Leju built during
      its 2016-2023 education-market years and then reused when it pivoted
      commercial focus toward Kuavo from 2023 onward. The buyer, user, and payer
      roles frequently diverge: a government industrial-development company can
      be the payer and contracting counterparty while the actual "user" is the
      robot itself generating training data for a separate data-consumption
      market, and a university lab can be the user while a provincial
      science-and-technology fund is the payer. Leju's own site organizes
      commercial offerings into four solution categories (Research Scenario,
      Business Service, Industrial Scenario, Training Ground) that map directly
      onto the four Kuavo revenue scenarios disclosed in its IPO-linked
      financials. Geographically, named institutional relationships span at
      least Beijing (Shijingshan data-training hub), Heilongjiang (Harbin
      Institute of Technology), Henan (Zhengzhou University), and Guangdong
      (headquarters and Dongfang Precision manufacturing), but industrial and
      commercial-vertical customers beyond these anchors remain undisclosed by
      name. Independent aggregators price Leju's two current Kuavo variants very
      differently by buyer type: KUAVO 5 at roughly $38,000 for a broader
      industrial/research/service market, and KUAVO-MY at $50,000-$150,000
      specifically for laboratories, enterprises, and innovation centers,
      underscoring that Leju's "customer" spans a wide spend range within a
      single product family rather than one homogenous buyer profile.
    claimRefs: [CU001, CU002, CU005, CU035, CU036, CU040, CU041, CU043]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-and-proof
    title: Adoption Trajectory and Named Customer Proof
    body: >-
      Leju's disclosed unit-sales trajectory shows a sharp 2025 inflection:
      Kuavo unit sales rose from 32 units in 2024 to 577 units in 2025 (about
      17x), while combined Aelos and Roban unit sales reached 4,079 units
      (3,988 Aelos plus 91 Roban), up 47.35% year over year but shrinking to
      about 15.42% of total company revenue as Kuavo's share grew to 69.5%.
      Leju's prospectus-linked disclosures claim more than 500 cumulative
      "industry-level application customers" and export reach to 45+ countries
      generating roughly RMB61 million (about 18%) of 2025 revenue overseas, but
      only a small number of these relationships are independently named in
      public sources: the Beijing Shijingshan government-industrial-park data-
      training center (RMB82.95 million Phase II tender award, published August
      2025), Harbin Institute of Technology (a jointly inaugurated
      industry-university-research innovation center, plus a documented July
      2025 student visit and Aelos demonstration), Zhengzhou University (a
      September 2025 agreement to build a joint humanoid R&D center), Dongfang
      Precision (a July 2025 non-binding OEM-manufacturing and market-
      development framework agreement, alongside its existing minority equity
      stake), Haichen (a September 2025 agreement to jointly develop an
      industrial-grade logistics humanoid), and a FAW Hongqi factory deployment
      of Kuavo 4 Pro for box-handling and sorting that remains a bounded
      proof-of-concept rather than a scaled production order. China Mobile and
      Huawei jointly launched a 5G-A embodied-intelligence Kuavo demonstration
      with Leju at MWC Shanghai in June 2025, a technology-partnership showcase
      rather than a commercial deployment. An unofficial specifications
      aggregator (ChipSilicon) lists additional named pilots -- NIO, Huawei
      Cloud, Haier, Hengtong, and China Southern Power Grid -- that could not be
      corroborated in any official Leju disclosure or independent news source
      reviewed and should be treated as unverified. Independent analysts
      (Counterpoint, Omdia, IDC, and Beijing CCID) rank Leju 3rd-4th globally by
      2025 humanoid shipment volume (roughly 5% share), but one cited analyst
      cautioned that most industry-wide shipment volume, including Leju's, is
      concentrated in lower-barrier research, education, and data-collection
      units rather than industrial deployments requiring sustained autonomy and
      payload reliability.
    claimRefs: [CU003, CU004, CU006, CU007, CU010, CU011, CU012, CU013, CU014, CU015, CU016, CU017, CU018, CU019, CU020, CU021, CU022, CU039, CU044]
    tableRefs: [TU002, TU003]
    figureRefs: [FU002, FU003]
  - id: data-channel-and-industrial
    title: Government-Anchored Data Channel and Industrial Vertical Economics
    body: >-
      The Shijingshan relationship illustrates how Leju's largest disclosed
      single contract actually functions as a customer channel: Phase I opened
      in March 2025 at 3,000 square meters with 108 mixed-form robots across ten
      scenario zones, built in 22 days under district-government sponsorship,
      then expanded five months later into a dedicated Phase II Kuavo-only
      contract spanning 10,000+ square meters, targeting more than 6 million
      real-machine data records per year across 100 workstations (about 5,000
      data-collection hours per month) and 16 sub-scenarios covering industrial
      manufacturing, smart home, elder care, and 5G integration. Named
      counterparties referenced within this ecosystem include Dongfang
      Precision, Haosen Intelligent, Peking University's Wuhan AI Research
      Institute, Zhengzhou University, Haichen, and Yuyi Technology, though the
      exact commercial terms between Leju and each of these named parties beyond
      the primary Shijingshan tender are not itemized in sources reviewed. By
      contrast, Leju's industrial-manufacturing vertical -- the smallest Kuavo
      revenue scenario at 3.88% -- remains anchored to a single disclosed
      proof-of-concept (the FAW Hongqi factory box-handling trial) with no
      confirmed conversion to a scaled production order. This asymmetry matters
      for comparison: Leju's global shipment ranking (3rd-4th by unit volume,
      about 5% share per Counterpoint) is driven overwhelmingly by the
      data-collection and research/education scenarios, which together account
      for over three-quarters of 2025 Kuavo revenue, while peer makers such as
      Unitree (RMB1.708 billion revenue, profitable) and UBTech (roughly RMB2
      billion revenue) operate at four to seven times Leju's RMB258 million
      2025 total revenue scale, with a materially different (more industrial and
      consumer) customer mix.
    claimRefs: [CU008, CU009, CU023, CU024, CU025, CU026, CU045]
    tableRefs: []
    figureRefs: []
  - id: retention-and-satisfaction
    title: Retention, Repeat Usage, and Satisfaction Evidence
    body: >-
      No net revenue retention, gross revenue retention, logo-churn rate, or
      average contract/renewal length is disclosed anywhere in the sources
      reviewed for Leju, which as a pre-IPO applicant discloses only
      consolidated revenue, gross margin, and net-loss figures rather than
      customer-cohort metrics. In the absence of a real retention cohort, the
      best available proxy is land-and-expand behavior at the institutional
      level: the Shijingshan relationship deepened from a Phase I community
      deployment to a dedicated Phase II contract, and the Dongfang Precision
      relationship deepened from a pre-existing minority-equity stake into a
      2025 OEM-manufacturing and market-development agreement. Direct
      consumer-satisfaction evidence is thin: Leju's official Taobao flagship
      store listing for the Aelos Pro3 education robot shows a near-zero public
      review volume across product-description, seller-service, and logistics
      scores, which is best explained by Leju's institutional (schools,
      research institutes, government programs) buyer base rather than a
      B2C retail model, and no documented pattern of complaints, recalls,
      canceled contracts, or blocked deployments was found for any Leju product
      in the sources reviewed. An independent 2019 hands-on review of the Aelos
      education-edition robot rated its build quality and safety detailing
      positively, though that review predates Leju's Kuavo-era industrial pivot
      by several years and cannot speak to current-generation products or
      satisfaction. The retention/repeat-cohort figure in this chapter therefore
      scores evidence depth (how much each source layer reveals about initial
      engagement, repeat/expansion, and renewal visibility) rather than true
      revenue retention, since no company-disclosed retention data exists.
    claimRefs: [CU032, CU033, CU034, CU042, CU046, CU047]
    tableRefs: [TU004]
    figureRefs: [FU004]
  - id: expansion-and-risk
    title: Expansion, Concentration, and Procurement Risk
    body: >-
      Several adverse financial signals bear directly on customer economics.
      Kuavo's average unit selling price fell 25.56% year over year in 2025 as
      Leju pursued active market-share-defense pricing, while unit cost fell
      27.35% over the same period; at the consolidated level, gross margin
      declined from 50.45% (2023) to 44.30% (2024) to 40.78% (2025) as the
      lower-margin, higher-volume Kuavo mix displaced higher-margin Roban/Aelos
      education revenue, and net losses widened each year (RMB41.12 million,
      RMB59.23 million, RMB69.78 million) alongside negative operating cash flow
      in all three years -- a pattern one financial-media risk review flagged as
      structurally atypical for a scaling hardware/AI company and worth
      exchange-review scrutiny. Public reporting does not disclose an exact
      top-customer revenue-concentration percentage or accounts-receivable
      concentration figure, leaving genuine customer-concentration risk
      unquantified in sources reviewed. Supply-side concentration compounds
      procurement friction on the fulfillment side: a single supplier, Wuxi
      Quanzhibo, accounted for 17.20% of Leju's total 2025 procurement and
      82.82% of its joint-actuator-module category specifically, a risk that
      could delay delivery to committed customers such as the Shijingshan
      Phase II buildout. Several named partnerships are explicitly non-binding
      framework agreements -- the Dongfang Precision agreement carries no
      mandatory obligation beyond IP, confidentiality, publicity, and
      anti-bribery clauses -- meaning disclosed "customer" relationships can
      overstate committed revenue. Leju's planned IPO-proceeds allocation
      (36.14% to an R&D center, 23.7% to dataset construction, 8.22% to a
      production base) signals that data-collection-customer scaling and
      industrial mass-production readiness, not consumer growth, are the
      company's primary post-IPO levers for expanding its customer base.
    claimRefs: [CU027, CU028, CU029, CU030, CU031, CU037, CU038]
    tableRefs: [TU005]
    figureRefs: []
