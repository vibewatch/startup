          values: [90, 40, 10]
        - label: OEM / industrial-partner relationships (Dongfang Precision, Haichen, FAW POC)
          values: [80, 50, 10]
        - label: Consumer / retail relationships (Aelos via Taobao/JD)
          values: [60, 20, 5]
    approximationNotes: This is an evidence-depth cohort, not a revenue-retention cohort; scores are percentage-style heuristics reflecting how much each counterparty layer's public evidence reveals about the named stage, since Leju discloses no cohort-level retention data.
    claimRefs: [CU007, CU011, CU012, CU013, CU014, CU016, CU017, CU032, CU033, CU042, CU046]
callouts:
  - calloutType: risk
    title: Named, verifiable customer proof is thin relative to the claimed base
    body: Leju's IPO-linked disclosures claim 500+ cumulative industry-level customers, but only seven counterparties are independently named across the sources reviewed, and only two of those (Shijingshan and Harbin Institute of Technology) show confirmed production-stage, multi-touchpoint evidence rather than a single framework agreement or proof-of-concept.
    claimRefs: [CU006, CU044, CU007, CU011]
  - calloutType: strength
    title: Government-anchored data-collection demand is the clearest, best-evidenced growth channel
    body: The Shijingshan relationship shows genuine land-and-expand behavior with a public tender record establishing exact contract value, and it anchors Leju's largest disclosed 2025 revenue scenario (44.94% of Kuavo revenue), making it the strongest available customer-durability signal in the absence of any disclosed retention metric.
    claimRefs: [CU002, CU007, CU045]
  - calloutType: assumption
    title: Customer concentration and receivables risk are real but unquantified
    body: Financial-media risk reviews of Leju's IPO filing flag customer-concentration and revenue-quality concerns in general risk-factor language, but no source reviewed discloses an exact top-customer revenue-concentration percentage or accounts-receivable-by-customer figure; this chapter treats that gap as unresolved rather than estimating a number.
    claimRefs: [CU030, CU031]
