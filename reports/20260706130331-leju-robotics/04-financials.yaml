      nodes:
        - id: "asp-2024"
          label: "KUAVO ASP, FY2024 baseline"
          type: "input"
        - id: "asp-2025"
          label: "KUAVO ASP, FY2025 (-25.56%)"
          type: "process"
        - id: "cost-2024"
          label: "KUAVO unit cost, FY2024 baseline"
          type: "input"
        - id: "cost-2025"
          label: "KUAVO unit cost, FY2025 (-27.35%)"
          type: "process"
        - id: "kuavo-margin"
          label: "KUAVO segment gross margin (42.39%)"
          type: "output"
        - id: "peer-margin"
          label: "Peer humanoid margin (Unitree ~60.3%; UBTECH 54.6%)"
          type: "output"
      edges:
        - from: "asp-2024"
