callouts:
  - calloutType: strength
    title: "Breakout KUAVO-Led Growth Outpaces Prior-Year Scale"
    body: "Leju's 2025 revenue of RMB 258 million represents a 118.68% three-year CAGR and a 17-fold jump in KUAVO unit sales (32 to 577 units), evidence of genuine commercial traction ahead of its ChiNext listing."
    claimRefs: [CI001, CI003, CI005]
  - calloutType: risk
    title: "KUAVO Gross Margin Trails Public Peers by 12-20 Points"
    body: "KUAVO's 42.39% 2025 segment gross margin sits well below UBTECH's 54.6% humanoid-segment margin and Unitree's disclosed ~60.27% core/humanoid margin, suggesting Leju has not yet matched peer-level vertical integration or manufacturing scale."
    claimRefs: [CI009, CI010, CI011]
  - calloutType: risk
    title: "New 30,000-Unit Capacity Far Exceeds Current 4,600-Unit Run-Rate"
    body: "Leju's planned industrialization base targets 30,000 humanoid robots per year, while 2025 total shipments across all product lines were only about 4,600 units, implying utilization well under 50% and a multi-year absorption gap."
    claimRefs: [CI018]
  - calloutType: assumption
    title: "2028 Profitability Assumes a Margin and Cash-Flow Inflection Not Yet Evident"
    body: "Leju's own 2028 profitability target requires reversing three straight years of gross-margin decline and negative operating cash flow (cumulative -RMB 85.2M); neither trend has inflected in the disclosed 2023-2025 data."
    claimRefs: [CI032, CI015]
