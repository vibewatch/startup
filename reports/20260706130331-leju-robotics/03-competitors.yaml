- id: profiles
  title: 'Competitor Profiles: Scale, Funding, Customers, Product Scope, and Strategy'
  body: 'Unitree is the clearest category leader by scale: FY2025 revenue reached RMB 1.699-1.71 billion
    (up roughly 335% year-on-year), its first profitable year, en route to a STAR Market IPO cleared on
    June 1, 2026 with a valuation that evolved from a reported ~$7 billion (September 2025) toward ~$6.2
    billion by mid-2026, backed by Geely, Alibaba, Tencent, Sequoia China, and Ant Group. AgiBot, founded
    in February 2023 by ex-Huawei engineers Deng Taihua and Peng Zhihui with HongShan, Hillhouse, and
    BYD backing, has scaled production fastest of any peer -- from 962 units in December 2024 to its 10,000th
    unit by March 30, 2026 -- aided by a Shanghai government-backed data-collection site, though its cumulative
    funding is reported inconsistently across trackers (Tracxn''s $83.8 million versus Getlatka''s $520
    million).


    UBTECH''s FY2025 results show total revenue of RMB 2.001 billion (+53.3%), with its Full-Size Embodied
    AI Humanoid segment growing from RMB 35.6 million to RMB 820 million (+2,203.7%) on 1,079 Walker S-series
    unit deliveries -- the largest single-year humanoid delivery count among direct peers -- though the
    company remained net loss-making overall per its audited annual results. Fourier Intelligence, the
    smallest of the four direct peers by disclosed scale, raised approximately RMB 800 million (~$109
    million) in a Series E round reported in January 2025, leveraging its medical-exoskeleton heritage
    into the general-purpose GR-2 humanoid platform.


    Leju itself reported 2025 operating revenue of RMB 258 million, with the Kuavo series contributing
    RMB 178 million (69.5% of revenue) across 577 units sold (up from just 32 in 2024). Leju''s own prospectus
    explicitly benchmarks itself against this peer set, placing its revenue at roughly 15% of Unitree''s
    and 13% of UBTECH''s, with a strategic emphasis on data-collection commercialization (45% of Kuavo
    revenue) and named platform partnerships with Huawei (HarmonyOS integration, joint 5G-A humanoid launch)
    and Tencent (7.32% equity stake).'
