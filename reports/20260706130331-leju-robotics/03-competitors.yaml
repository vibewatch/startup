- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - threat
  - severity
  - mitigation / diligence ask
  rows:
  - - Leju's data-collection commercialization niche (45% of Kuavo revenue) provides an early, defensible
      revenue stream while industrial ROI matures
    - Unitree and AgiBot both have larger deployed fleets and, in AgiBot's case, government-backed data-collection
      infrastructure, which could out-scale Leju's data-service business
    - material
    - 'Diligence ask: request Leju''s data-collection customer concentration and contract renewal rates
      versus Unitree/AgiBot competitive win-loss data'
  - - Leju's Huawei (HarmonyOS, 5G-A) and Tencent (7.32% equity stake) ecosystem ties could provide distribution
      and technical-platform leverage
    - Ties are described as early-stage (e.g., Tencent cooperation has not yet begun operationally); ecosystem
      partners could favor larger-volume partners like Unitree or UBTECH instead
    - material
    - 'Diligence ask: verify concrete commercial milestones (co-branded products, revenue share) rather
      than press-release-stage partnership announcements'
  - - Unitree's vertical integration (>90% in-house core components) and lowest-in-category ASP create
      a durable cost-curve moat
    - Aggressive price cuts to defend share could accelerate category-wide commoditization, squeezing
      all smaller peers including Leju on gross margin
    - material
    - 'Diligence ask: model Leju''s margin sensitivity to a further 20-30% category-wide ASP decline over
      the next two years'
  - - AgiBot's government-backed Shanghai data-collection site and political visibility (Xi Jinping visit,
      Guinness World Record) support outsized brand and dataset-scale advantages
    - Company-reported production milestones (10,000th/15,000th unit) are not independently verified and
      may overstate units in sustained commercial (vs. showcase) use
    - minor
    - 'Diligence ask: seek third-party channel checks on AgiBot''s actual paying-customer count versus
      total units produced'
  - - Automaker entrants (Xpeng, Li Auto) bring capital and manufacturing scale that could compress the
      whole independent-vendor category, including Leju, Unitree, and Fourier
    - Automakers could underprice or out-distribute standalone humanoid vendors once they commit meaningfully
      to the category, though no automaker has yet shipped a humanoid at volume
    - material
    - 'Diligence ask: track Xpeng/Li Auto humanoid shipment announcements and pricing over the next 12-18
      months as a leading indicator'
  - - China's National Intelligence Law (Article 7) and disclosed security incidents (Unitree Bluetooth
      flaw, alleged remote-access tunnel) create a structural trust/regulatory overhang for all China-headquartered
      humanoid vendors, Leju included
    - International (especially US/allied government or defense-adjacent) buyers may exclude Chinese-origin
      humanoid vendors entirely regardless of individual company security practices
    - material
    - 'Diligence ask: assess what share of Leju''s addressable customer base is outside mainland China
      and how exposed that share is to import/security restrictions'
  - - 'Broader market commoditization risk: 100+ Chinese humanoid vendors (per Counterpoint) and falling
      category-wide prices (Unitree R1 RMB 26,900, Noetix Bumi RMB 9,998) squeeze differentiation for
      mid-scale players'
    - Leju's RMB 258M revenue base is small relative to Unitree (RMB 1.7B+) and UBTECH (RMB 2.0B), leaving
      less room to absorb further price compression before margin turns further negative
    - material
    - 'Diligence ask: quantify Leju''s minimum viable ASP given its current 40.78% gross margin and RMB
      69.78M FY2025 net loss trajectory'
  - - Leju's supply-chain concentration (Wuxi Quanzhibo at 17.20% of total procurement, 82.82% of joint-module
      procurement) is a single-supplier dependency Leju itself discloses as a risk
    - A supply disruption or renegotiation with this one supplier could directly impair Kuavo production,
      versus Unitree's higher in-house component share, which better insulates it from single-supplier
      shocks
    - material
    - 'Diligence ask: request Leju''s supplier-diversification roadmap and any dual-sourcing plans for
      joint-module components'
  notes: Severity reflects the claim author's evidence-backed judgment of impact on Leju's competitive
    durability, not a company-disclosed risk rating; all threats are sourced to a specific claim/source
    pair rather than generic industry commentary.
