- id: capability-pricing-gtm
  title: Capability, Pricing, GTM/Distribution, and Trust/Regulatory Comparison
  body: 'On disclosed pricing, Unitree anchors the low end of the category: its G1 starts around $16,000
    per CNBC reporting, and its 2026-launched R1 platform starts at just RMB 26,900 (~$3,968), the most
    affordable humanoid Unitree has shipped. Leju''s Kuavo series sits mid-pack at an average selling
    price of RMB 308,100 in 2025, down nearly 26% year-on-year -- a deliberate competitiveness play that
    tracks the category-wide price-down trend documented across the sector (Noetix''s Bumi at RMB 9,998,
    Booster''s K1 at RMB 29,900, even industrial-grade Astribot T1 at RMB 89,900). UBTECH''s Walker S2,
    by contrast, is estimated near RMB 760,000, reflecting its positioning toward continuous-operation
    industrial use cases (autonomous battery-swapping for 24/7 operation) rather than volume consumer
    sale. Neither AgiBot nor Fourier discloses public list pricing for their flagship platforms, a genuine
    comparability gap preserved in this chapter''s evidence gaps rather than estimated.


    On go-to-market and distribution, Unitree combines the lowest price point with the deepest vertical
    integration (over 90% of core components manufactured in-house) and an active open-source developer
    ecosystem (unitree_sdk2, unitree_rl_gym, and related repositories), lowering the barrier for third-party
    developers to build on its hardware. AgiBot instead leans on government-linked distribution -- a Shanghai-authority-supported
    data-collection site and high-profile political visibility including an April 2025 visit from Xi Jinping
    -- while UBTECH leverages its public listing and named industrial pilot customers such as Airbus for
    Walker S2 concept testing.


    On trust and regulatory posture, both Unitree and AgiBot, as Chinese-headquartered companies, are
    subject to Article 7 of China''s 2017 National Intelligence Law requiring cooperation with state intelligence
    work; Tech Times additionally reports a September 2025 wormable Bluetooth security flaw disclosed
    in Unitree robots and a US congressional committee allegation of a remote-access tunnel in Unitree
    systems deployed at US government facilities. These are structural risks that apply to any China-headquartered
    vendor Leju competes against internationally, including Leju itself, and materially affect deal viability
    with security-sensitive Western buyers regardless of individual company practices.'
