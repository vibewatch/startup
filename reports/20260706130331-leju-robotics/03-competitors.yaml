- id: TP003
  title: Pricing / packaging comparison
  columns:
  - competitor / product
  - price per unit / contract model
  - included capabilities
  - discount or unknowns
  - implication
  rows:
  - - Leju Kuavo series
    - RMB 308,100 average selling price (2025), direct enterprise/institutional sale
    - Full-size modular bipedal+wheeled platform, data-collection tooling, research SDK
    - ASP fell ~26% YoY as a deliberate competitiveness play; unit cost fell 27.35% over the same period
    - Leju is following the sector-wide price-down trend but from a smaller volume base, compressing margin
      more than volume-leading peers
  - - Unitree G1
    - ~$16,000 starting price (per CNBC reporting), direct + distributor sale
    - Full bipedal humanoid platform with open SDK/RL-gym support
    - No official all-in enterprise contract pricing disclosed; consumer/prosumer list price only
    - Aggressive low-end pricing anchors buyer expectations across the whole category, pressuring peer
      ASPs
  - - Unitree R1
    - RMB 26,900 (~$3,968) starting price, launched 2026
    - Wheeled/dual-arm humanoid, Unitree's most affordable platform to date
    - Positioned explicitly as a mass-market/consumer entry point; enterprise contract terms not disclosed
    - Signals Unitree is willing to sacrifice per-unit margin to maximize install base and data-generation
      reach
  - - UBTECH Walker S2
    - ~RMB 760,000 estimated per unit, enterprise direct sale
    - Autonomous hot-swappable dual-battery system for 24/7 operation; industrial concept-testing support
      (e.g., Airbus)
    - No public volume-discount schedule; pricing sourced from secondary reporting, not UBTECH's own price
      card
    - Premium pricing reflects targeting of continuous-operation industrial use cases rather than volume
      consumer sale
  - - AgiBot A2 / G1
    - unknown (no public list price)
    - Full-size humanoid plus AGIBOT World dataset/ecosystem access
    - Pricing entirely undisclosed; likely negotiated per government/enterprise deployment
    - Opacity limits buyers' ability to benchmark AgiBot against Unitree/UBTECH on a pure cost basis
  - - Fourier GR-2
    - unknown (no public list price)
    - GRx-series humanoid with integrated cabling and compact joint design
    - Pricing entirely undisclosed; Fourier's disclosed revenue is from exoskeleton/medical-robotics lines,
      not GR-2 volume
    - Fourier's medical-robotics niche may justify premium contract pricing not exposed to public benchmarking
  notes: AgiBot and Fourier rows are marked unknown for pricing per this chapter's confirmed evidence
    gap (no fetched source discloses list pricing for either); all other price figures are sourced to
    the company's own disclosure or a named third-party report cited in localEvidence.sources.
