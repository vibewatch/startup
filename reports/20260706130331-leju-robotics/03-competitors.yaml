  - limitation
  rows:
  - - Leju Robotics
    - Direct peer (self)
    - RMB 258M FY2025 revenue; RMB 4.327B post-money valuation in latest private round; ~5% global shipment
      share (rank 4th Counterpoint/Omdia, 3rd IDC)
    - Data-collection customers, research/education institutions, early industrial pilots
    - Founder-led full-size + mid/small product spread (Kuavo/Roban/Aelos); Huawei HarmonyOS and Tencent
      equity ties
    - Smallest revenue base of the five profiled peers; net losses widening; single-supplier concentration
      risk
  - - Unitree Robotics
    - Direct peer / category leader
    - RMB 1.699-1.71B FY2025 revenue, ~335% YoY growth, first profitable year; IPO valuation reported
      $7B (Sep 2025) trending to ~$6.2B (Jun 2026); investors include Geely, Alibaba, Tencent, Sequoia
      China
    - Consumer/prosumer buyers, research labs, and increasingly industrial/data-collection customers
    - Deepest vertical integration (>90% in-house core components), lowest ASP in category, active open-source
      developer ecosystem
    - IP portfolio still comparatively small; heavy reliance on continued ASP declines to sustain volume
      growth
  - - AgiBot (Zhiyuan Robotics)
    - Direct peer / category leader
    - $83.8M raised across 3 rounds per Tracxn (vs. $520M per Getlatka, an unresolved data conflict);
      10,000th unit produced Mar 2026, 15,000th by ~Jun 2026
    - Government-linked data-collection deployments, research partners, and embodied-AI dataset customers
    - Fastest production scale-up in the category (3 months from 5,000 to 10,000 units); Shanghai government-backed
      data-collection site; Guinness World Record endurance walk
    - No independent prospectus-grade financial disclosure; unclear split between commercial deployments
      and showcase/pilot units
  - - UBTECH Robotics (09880.HK)
    - Incumbent (listed)
    - RMB 2.001B FY2025 total revenue (+53.3% YoY); Full-Size Embodied AI Humanoid segment revenue grew
      from RMB 35.6M to RMB 820M (+2,203.7%); still net loss-making per FY2025 audited results
    - Industrial/logistics customers (e.g., automotive concept testing), education, and service robotics
      buyers
    - Only listed pure-play humanoid incumbent with audited public financials; Walker S2 autonomous battery-swap
      capability; largest single-year unit delivery count (1,079 Walker S units)
    - Humanoid segment still a minority (41.1%) of a broader legacy education/service-robot revenue base;
      continues to report a net loss
  - - Fourier Intelligence
    - Direct peer (smaller scale)
    - ~RMB 800M (~$109M) Series E reported Jan 2025; independently tracked by CBInsights (May 2025 snapshot)
    - Rehabilitation/medical exoskeleton customers extending into general-purpose humanoid (GRx series)
      research and industrial buyers
    - Strong medical-robotics heritage and exoskeleton IP; GR-2 emphasizes integrated cabling and compact
      packaging from direct customer feedback
    - No public unit-shipment disclosure; no public list pricing for GR-2/GR-3, limiting comparability
      with Unitree/UBTECH
  - - Automaker entrants (Xpeng, Li Auto)
    - Adjacent / emerging entrant
    - Multi-billion-dollar automotive balance sheets and existing EV manufacturing scale; XPeng CEO issued
      a company-wide pivot letter June 10, 2026
    - Automotive-adjacent manufacturing and eventually consumer/prosumer buyers via existing EV distribution
      channels
    - Deepest capital reserves of any entrant type; existing supply chain, manufacturing, and retail/service
      network reusable for humanoids
    - No humanoid shipment or revenue track record yet disclosed; unproven in the humanoid form factor
      specifically
  - - Status quo / internal build (traditional automation, manual labor)
    - Substitute
    - No incremental capex beyond existing industrial robot/AGV and labor budgets
    - Cost-sensitive manufacturers and any buyer without a validated humanoid ROI case
    - Mature, proven ROI, no integration or trust risk; remains the rational default per AFP/France24
      reporting that large-scale humanoid use cases remain elusive
    - Cannot match humanoid form-factor versatility in unstructured environments; forgoes future data/AI-training
      upside
  notes: Rows span Leju's four disclosed direct peers, one adjacent entrant category (automakers), and
    the status-quo substitute; scale/funding figures are as disclosed in each company's most recent public
    filing, prospectus, or analyst-tracker snapshot cited in localEvidence.sources.
