- id: switching-lockin-supply
  title: Switching Costs, Lock-in, Multi-Homing, Distribution Power, and Supply/Partner Access
  body: 'Switching costs across most current humanoid robot deployments -- including Leju''s own data-collection,
    research/education, and commercial-service placements -- remain low to moderate because deployments
    are still pilot-scale rather than embedded into mission-critical production lines. This lets buyers
    multi-home across vendors or switch between contract cycles without major integration rework, a dynamic
    that keeps competitive intensity high and gives buyers leverage over any single vendor, Leju included.
    The exception is data-collection customers, where a given robot''s specific morphology and sensor
    suite are baked into the resulting training dataset; switching vendors mid-dataset would require costly
    re-collection, creating a real, if narrow, form of lock-in that structurally favors vendors with the
    largest existing deployed base -- currently Unitree and AgiBot rather than Leju.


    On supply and partner access, Unitree''s vertical integration (over 90% of core components in-house,
    production cost down from RMB 73,200 to RMB 62,200 per unit) provides meaningful insulation from external
    supplier shocks that smaller peers lack. Leju, by contrast, discloses a concentrated supply chain
    in its own prospectus: a single supplier, Wuxi Quanzhibo, accounted for 17.20% of Leju''s total 2025
    procurement spend and 82.82% of its joint-module procurement specifically -- a disclosed dependency
    risk that could directly impair Kuavo production if that relationship were disrupted or renegotiated
    unfavorably.


    On distribution power, automaker entrants such as Xpeng and Li Auto carry an inherent advantage: they
    already operate manufacturing-scale supply chains and retail/service networks built for electric vehicles,
    more than half of whose core components (motors, reducers) can reportedly be redirected to humanoid
    production without new capacity investment. This gives automakers a faster path to distribution scale
    than any of the four profiled direct-peer startups, including Leju, should they commit meaningfully
    to the humanoid category over the next several years.'
