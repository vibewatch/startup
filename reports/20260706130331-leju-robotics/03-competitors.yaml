  title: Competitive positioning map
  type: quadrant
  layout: wide
  summary: Leju occupies a low-price, lower-momentum position versus Unitree and AgiBot, who combine aggressive
    pricing with the largest shipment scale; automakers and status-quo substitutes anchor the map's extremes.
  data:
    xAxis:
      label: Pricing accessibility (0=premium/undisclosed, 10=most affordable disclosed price)
    yAxis:
      label: Commercial momentum / shipment scale (0-10 ordinal)
    points:
    - label: Leju Robotics
      x: 5
      y: 3
      detail: RMB 308,100 Kuavo ASP, 577 units sold 2025; smallest disclosed shipment base of the five
        peers.
      tone: neutral
    - label: Unitree
      x: 9
      y: 10
      detail: Lowest disclosed ASP in category (G1 ~$16,000, R1 RMB 26,900) plus largest 2025 shipment
        volume (5,500+ units).
      tone: positive
    - label: AgiBot
      x: 3
      y: 9
      detail: No public pricing, but fastest production scale-up (10,000th unit by Mar 2026); high momentum,
        low price transparency.
      tone: positive
    - label: UBTECH
