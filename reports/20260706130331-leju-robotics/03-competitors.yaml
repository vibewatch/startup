callouts:
- calloutType: risk
  title: Unitree + AgiBot Duopoly Controls ~80% of Chinese Humanoid Shipments
  body: TrendForce data shows Unitree and AgiBot together capturing nearly 80% of China's humanoid robot
    shipments, leaving Leju, UBTECH, and Fourier to compete for a shrinking residual share. Leju's 577
    Kuavo units sold in 2025 are a rounding error next to Unitree's 5,500+.
  claimRefs:
  - CP006
  - CP012
  - CP019
- calloutType: strength
  title: Leju's Data-Collection Niche Is a Real, If Narrow, Moat
  body: 45% of Leju's Kuavo revenue already comes from data-collection customers, where switching vendors
    mid-dataset is costly -- a genuine lock-in mechanism distinct from Leju's still-nascent industrial
    deployment (3.88% of revenue).
  claimRefs:
  - CP043
  - CP055
- calloutType: risk
  title: Single-Supplier Concentration at Wuxi Quanzhibo Is a Disclosed Vulnerability
  body: Leju's own prospectus discloses that one supplier, Wuxi Quanzhibo, represents 17.20% of total
    procurement and 82.82% of joint-module procurement -- a concentration risk Unitree's >90% in-house
    component strategy is specifically designed to avoid.
  claimRefs:
  - CP013
  - CP047
- calloutType: insight
  title: Adverse Evidence Suggests Sector-Wide, Not Leju-Specific, Commercialization Risk
  body: Morgan Stanley's 23%-buyer-satisfaction finding, Goldman Sachs' overcapacity warning, and China's
    own NDRC caution about 150+ 'highly repetitive' humanoid vendors all apply across the entire Chinese
    humanoid category -- meaning near-term demand risk is a category-level headwind rather than a Leju-specific
    weakness.
  claimRefs:
  - CP036
  - CP038
  - CP039
- calloutType: recommendation
  title: Track Automaker Entrants and National Intelligence Law Exposure as Emerging Risk Vectors
  body: Xpeng's and Li Auto's capital-backed pivot into humanoids, and the shared National Intelligence
    Law/security-incident overhang facing Unitree and AgiBot (and by extension any China-headquartered
    vendor), are two under-monitored risk vectors that could reshape Leju's competitive position within
    12-24 months.
  claimRefs:
  - CP032
  - CP033
  - CP040
