  productSummary: "Full-size KUAVO humanoid robots (bipedal and wheeled variants) for industrial/commercial use, Roban mid-size research robots, and Aelos small educational robots. KUAVO features cable-driven actuators, Huawei OpenHarmony OS, Pangu AI, and Nvidia chips."
  customerFocus: "B2B/B2G: AI companies (data collection), universities/research institutes (education), enterprises (commercial services), and factories (industrial automation)"
  businessModel: "Hardware sales (robots) with hybrid direct-sales and channel distribution. Revenue driven primarily by KUAVO full-size humanoid units (69.5% of revenue) plus educational robot product lines."
