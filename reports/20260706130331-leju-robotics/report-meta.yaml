companyProfile:
  summary: "Leju Robotics (legally Leju Intelligence (Shenzhen) Co., Ltd.) is a leading Chinese humanoid robotics company founded in 2016 by Harbin Institute of Technology alumni. The company produces the KUAVO series of full-size humanoid robots for data collection, research/education, commercial services, and early-stage industrial manufacturing, alongside the Roban and Aelos educational robot lines. With 577 KUAVO units shipped in 2025 (17x YoY growth), Leju ranked 4th globally in humanoid robot shipments. The company filed for a ChiNext IPO in May 2026 targeting a RMB 10 billion valuation, though it remains pre-profit with net losses widening to RMB 70M in 2025."
  foundedDate: "2016-07-01"
