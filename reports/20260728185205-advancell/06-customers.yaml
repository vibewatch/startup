- id: bottlenecks-and-gaps
  title: Access bottlenecks, payer gaps, and the narrowness of the usable delivery network
  body: AdvanCell’s customer path narrows because radioligand therapy is still infrastructure-heavy. External readiness sources and specialist workflow papers repeatedly emphasize that treatment requires imaging, specialist referral, trained staff, radiation-handling capabilities, scheduling discipline, and payer support. Avalere’s access-focused framing is especially important because it argues that patients may be clinically ready while the healthcare system is not. In that sense, the most important customer constraint is not simple demand generation; it is center readiness. Novartis’s cited network of nearly 600 U.S. treatment sites shows that site depth can become a competitive variable in its own right, but AdvanCell has not yet disclosed an equivalent center map. That creates concentration and expansion uncertainty. If only a modest number of sites can actually run an alpha-radioligand workflow at launch, a small set of accounts may determine a large share of early volume. The public
    record does not yet resolve that risk.
  claimRefs:
  - CU008
  - CU009
  - CU013
  - CU015
  - CU018
  - CU021
  - CU024
  - CU029
  - CU030
  - CU031
