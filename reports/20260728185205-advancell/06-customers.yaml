- id: precommercial-adoption-proof
  title: Current adoption proof is real, but it is still precommercial and specialist-led
  body: 'The strongest public evidence that AdvanCell has meaningful customer relevance today is the live TheraPb program. Company materials, UroToday coverage, and ClinicalTrials.gov all support the existence of active metastatic prostate-cancer cohorts spanning multiple clinical segments. That matters because it shows real treated-user and clinician engagement, not just pipeline slides. Additional proof comes from the visibility of the product in specialist channels: Grand Rounds in Urology, Frontiers, and MDPI reviews all show that the therapy sits inside a serious clinical conversation. But this proof has limits. Trial cohorts and conference discussion are not the same as commercial deployment, active site counts, or durable recurring utilization. They show relevance, attention, and workflow participation rather than a mature customer franchise. Public evidence is therefore strongest on “serious operating proof inside specialist networks” and weakest on “observable commercial adoption
    and retention.” Investors should treat that distinction as central, not semantic.'
