- id: TU003
  title: Named customer proof table
  columns:
  - Named stakeholder / cohort
  - Segment
  - Deployment / use case
  - Production vs pilot
  - Observable outcome
  - Limitation
  rows:
  - - TheraPb expansion cohorts
    - Live treated-user / investigator cohorts
    - Clinical use across three metastatic prostate-cancer populations
    - Live precommercial use, not commercial launch
    - Shows real clinical and workflow engagement around ADVC001
    - No public enrollment totals, center list, or repeat-use metrics
  - - Specialist GU oncology / theranostic discourse
    - Clinician influence channel
    - Conference and review discussion of ADVC001 and RLT sequencing
    - Reference-quality specialist attention, not revenue proof
    - Shows that the product sits inside active specialist decision frameworks
    - Does not prove center conversion or treatment continuity
  - - U.S. radioligand treatment-site network benchmark
    - Addressable operating-customer proxy
    - Scaled incumbent site footprint in same broad care pathway
    - Category benchmark, not AdvanCell deployment
    - Shows that center networks can become durable operating customers
    - Not specific evidence that AdvanCell has accessed those centers
  - - AdvanCell operating footprint in Brisbane and Boston
    - Support / access infrastructure proof
    - Locations and support surfaces for current and future users
    - Operating-readiness proof, not customer revenue
    - Shows intention to support users across key geographies
    - Physical footprint does not prove customer adoption
  notes: Publicly named proof is mostly cohort- and workflow-based because AdvanCell has not yet published a classical customer reference roster.
