  rows:
  - - Metastatic prostate-cancer patients
    - Users / treated population
    - Receive PSMA-targeted alpha therapy if eligible
    - Ultimate demand pool but reached only through specialists
    - No public treated-patient totals beyond clinical-stage framing
  - - Specialist investigators and GU oncologists
    - Clinical adopters / referral shapers
    - Enroll, evaluate, and manage therapy pathway
    - Highest-quality current proof surface
    - No public named center roster or prescriber counts
  - - Theranostic centers and hospitals
    - Operational customers
    - Image, schedule, dose, and monitor therapy
    - Critical bottleneck and likely early revenue concentration
    - No public AdvanCell center map or activation count
  - - Payers and health systems
    - Economic gatekeepers
    - Authorize and reimburse specialized care pathway
    - Essential to expansion beyond top centers
    - No named payer wins or policy visibility
  - - Strategic partners / ecosystem nodes
    - Support and scale enablers
    - Manufacturing, logistics, discovery, or referral ecosystem support
    - Improve readiness but are not end customers
    - Should not be counted as customer traction
  notes: 'This segmentation treats customers appropriately for a precommercial radiopharmaceutical company: the care and reimbursement network matters as much as the treated patient.'
