chapter:
  number: 6
  title: Customers
  summary: 'For AdvanCell, the relevant customer base is a precommercial care network rather than a visible revenue roster: specialist clinicians, theranostic centers, metastatic prostate-cancer users, and payers all matter before a durable account base exists. Public proof is strongest that the company already matters to live clinical cohorts and specialist discourse, but weakest on center activation, payer traction, repeat use, and concentration risk.'
sections:
- id: stakeholder-map
  title: The relevant customers are patients, specialist clinicians, centers, and payers
  body: AdvanCell is still precommercial, so its customer map has to be framed around the people and institutions that determine whether a metastatic prostate-cancer patient can actually receive a targeted alpha therapy. The public evidence points to a multi-sided structure. Patients and caregivers are the eventual treated users, but they only enter the pathway through specialist clinicians, theranostic centers, imaging workflows, and payer clearance. Clinical investigators and high-capability centers are therefore current operating customers in a practical sense, because they are the ones enrolling, dosing, monitoring, and learning. Referring oncologists and urologists shape the top of the funnel, while payers and health systems ultimately govern coverage and scale. Strategic partners and investors matter around the edges, but they should not be mistaken for customer proof. This is why the chapter treats customer traction as a care-network question rather than as a traditional account-count
    question. The relevant customer base is real, but it is structured around specialist workflows instead of a visible commercial roster.
  claimRefs:
  - CU001
  - CU002
  - CU005
  - CU006
