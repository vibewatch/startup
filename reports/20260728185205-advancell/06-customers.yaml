- id: durability-expansion-and-underwriting-view
  title: Durability, expansion, and the underwriting view should remain cautious
  body: 'The bullish customer case is plausible. If clinical data continue to mature and infrastructure expands, AdvanCell could grow by activating more theranostic centers, winning payer comfort, and moving alpha-radioligand use into earlier or broader prostate-cancer settings. Its hiring and operating buildout suggest management understands that launch support matters. But the adverse realities are equally visible. No public source discloses named commercial accounts, retention metrics, payer wins, or center-by-center deployment. There is no public evidence that concentration risk has been solved, and the community-center readiness gap remains real. That means the chapter cannot support a “durable customer franchise” conclusion yet. Instead, it supports a narrower and more defensible view: AdvanCell already matters to a serious specialist network, but the commercial customer engine remains largely unproven in public. Until site counts, repeat-use metrics, and payer traction emerge, customer
    underwriting should remain disciplined even if scientific enthusiasm remains high.'
