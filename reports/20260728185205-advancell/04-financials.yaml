  - - Use of proceeds
    - Phase 3 advancement plus clinical and commercial manufacturing expansion
    - High
    - Capital is being deployed into both development and operating footprint
    - Request budget split across trials, CMC, and facilities
  - - Cash on hand
    - Not publicly disclosed
    - Low
    - Needed to convert fundraising into runway
    - Request pro forma cash balance post-close
