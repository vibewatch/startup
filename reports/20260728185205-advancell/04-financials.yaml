- id: financial-verdict-and-diligence-blockers
  title: Financial verdict and diligence blockers
  body: 'The correct public verdict is that AdvanCell now looks well financed for the next leg of clinical and manufacturing scale-up, but still opaque as an operating business. The positives are meaningful: capital has been raised at unusual scale, the company is investing in manufacturing rather than relying only on narrative, and comparable radioligand businesses show that real commercial value is possible if ADVC001 works. The blockers are equally clear. Public sources do not disclose pricing, realized economics, burn, customer concentration, working capital, or contribution margins. Site economics, isotope logistics, and manufacturing utilization could all change the financial picture materially, and none are disclosed with enough precision to model. That means investors can support a thesis of strategic readiness and category relevance, but not a thesis of proven revenue quality or visible margin path. Until private diligence closes those gaps, AdvanCell should be framed financially
    as a well-capitalized but still economically unproven radiopharma scale-up.'
  claimRefs:
  - CI017
  - CI020
