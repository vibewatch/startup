    - Request historical and forward burn by function
  - - Runway months
    - Not publicly disclosed
    - Low
    - The key adequacy metric remains hidden
    - Request management runway case at base and downside assumptions
  - - Debt / royalty overhang
    - No clear retained public disclosure
    - Low-Medium
    - Financing structure can shape future dilution and flexibility
    - Request full cap table and any side letters, venture debt, or revenue interests
  notes: Headline funding size is visible; adequacy conversion math is not.
