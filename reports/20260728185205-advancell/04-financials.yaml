- id: TI002
  title: Pricing / monetization table
  columns:
  - Product / construct
  - Public price disclosure
  - Price / unit / contract signal
  - List vs. realized pricing
  - Discounts / unknowns
  - Source implication
  rows:
  - - ADVC001
    - No retained public list price
    - Investigational PSMA alpha therapy only
    - Entirely undisclosed
    - No public payer or gross-to-net detail
    - Do not model realized price from public sources
  - - Pluvicto comparator
    - No clean retained list price in this pack
    - Commercial radioligand benchmark
    - Sales proof visible but net price opaque
    - Center economics and rebates not disclosed here
    - Useful market-validation proxy, not a direct price benchmark
  - - Pylarify comparator
    - No simple apples-to-apples center price retained
    - Diagnostic ecosystem benchmark
    - Revenue and guidance visible, net pricing limited
    - Competitive concessions implied but not quantified fully here
    - Signals competitive pressure in adjacent PSMA economics
  - - Radioligand site economics
    - Institutional buy-and-bill context rather than consumer pricing
    - Imaging, dose prep, staffing, and scheduling matter
    - Realized economics vary by site readiness
    - No retained public center-margin dataset
    - Adoption economics are operational as much as pharmaceutical
  - - Future partner economics
    - Possible milestones or royalties from platform breadth
    - Contract-driven rather than list pricing
    - Not visible publicly
    - All economics unknown
    - Need partner contracts or management guidance
  notes: Pricing visibility is one of the weakest parts of the public corpus. The chapter preserves that opacity instead of inventing precision.
