- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Realized pricing and reimbursement assumptions
    - Without price and gross-to-net, no revenue model is trustworthy
    - Obtain payer strategy, expected ASP/WAC corridor, and provider economics
  - - Gross margin and cost-per-dose
    - Without COGS, the value of vertical integration cannot be judged
    - Request manufacturing model with isotope, fill-finish, QA, and logistics detail
  - - Cash balance and burn
    - Without burn and cash, runway cannot be converted from the headline round
    - Request historical burn and current cash bridge
  - - Center concentration and launch cadence
    - Without account concentration, early revenue volatility cannot be judged
    - Request target-account map and expected activation sequence
  - - Working-capital and payment timing
    - Without cash-conversion timing, operational scale risk is understated
    - Request payment terms, inventory assumptions, and schedule sensitivity
  - - Partner-economics detail
    - Without deal terms, platform optionality cannot be valued
    - Request current and expected economics of licensing or collaboration deals
  notes: These gaps are the boundary between an investable narrative and an underwritable model.
