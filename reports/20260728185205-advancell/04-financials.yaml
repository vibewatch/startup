- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / null
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Gross margin
    - 'null'
    - Low
    - Core test of whether vertical integration creates economic leverage
    - Request COGS bridge and expected gross margin by phase of scale-up
  - - Cost per dose
    - 'null'
    - Low
    - Determines whether isotope and manufacturing strategy is truly differentiated
    - Request isotope sourcing, yields, wastage, and packaging cost assumptions
  - - Center onboarding cost
    - 'null'
    - Low
    - May shape how quickly adoption can turn into booked revenue
    - Request field-force, medical-affairs, and site activation budget per account
  - - CAC / payback
    - 'null'
    - Low
    - Shows whether high-touch specialist sales can scale efficiently
    - Request account development cycle and expected treated-patient ramp
  - - Working capital need
    - 'null'
    - Low
    - Radiopharma supply timing can be cash-intensive
    - Request inventory, receivables, and payment-term assumptions
  - - Utilization sensitivity
    - 'null'
    - Medium-Low
    - Manufacturing economics likely depend on throughput and schedule density
    - Request base/target utilization assumptions for Andover and outsourced nodes
  notes: 'Nulls here are intentional: the public pack reveals the cost drivers but not the numeric bridges needed for underwriting.'
