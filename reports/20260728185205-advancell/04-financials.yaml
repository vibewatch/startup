  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - ADVC001 product revenue
    - Specialist-center radioligand therapy sales if approved
    - Treated patients / net sales
    - Pre-revenue; no public sales disclosed
    - Prospective core stream
    - Request launch assumptions, treated-patient cadence, and geography sequence
  - - Platform or licensing revenue
    - Partnered alpha-radioligand or discovery economics
    - Upfronts / milestones / royalties
    - Possible in principle but not quantified publicly
    - Optionality, not underwritten core revenue
    - Request economics of current and planned platform deals
  - - Manufacturing-linked value capture
    - Internalized supply and production economics
    - Gross margin / dose economics
    - No public realization data
    - Strategic but unquantified
    - Request cost-per-dose, yields, and outsourcing mix
  - - Clinical-stage collaboration value
    - Potential sponsored or co-development arrangements
    - Program payments
    - No retained public evidence of current contribution
    - Speculative
    - Ask whether any non-equity partner funding exists
  - - Future broader pipeline monetization
    - Longer-dated non-prostate programs
    - Future asset revenue
    - Too early for public modeling
    - Long-dated upside
    - Request resource allocation and expected time to clinic for follow-ons
  notes: The retained public pack supports a future revenue architecture but not current commercial revenue recognition.
