evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: TO003 capital-structure-opacity
    missingEvidence: >-
      Priced-round valuation, preference stack, any royalty or debt features, and investor rights attached to the July
      2026 financing.
    whyItMatters: >-
      Those terms determine whether the headline round implies attractive common-equity economics or merely
      balance-sheet scale.
    diligencePath: Request the Series D term sheet, cap table, and board-rights summary from management or lead investors.
    relatedQuestionRefs:
      - QO016
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: operating-metrics-disclosure
    missingEvidence: Reliable current headcount, revenue, customer, or pricing metrics for AdvanCell’s pre-commercial operating scale.
    whyItMatters: >-
      Without those metrics, investors can judge financing momentum and infrastructure buildout but not operating
      efficiency or commercialization readiness.
    diligencePath: >-
      Obtain management KPI dashboards or investor materials that disclose team size, burn, and launch-preparation
      metrics.
    relatedQuestionRefs:
      - QO024
  - type: private-evidence-only
    severity: material
    topic: TO002 governance-rights
    missingEvidence: >-
      Board committee structure, ownership concentration, and any control rights or observer arrangements beyond the
      public board roster.
    whyItMatters: >-
      Formal governance and investor-rights detail affects future financing flexibility, strategic optionality, and
      founder-control assessment.
    diligencePath: Request the board charter package, committee rosters, shareholder agreement, and current cap table.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: minor
    topic: exact-founding-date
    missingEvidence: >-
      An official company or registry source that states the exact founding or incorporation date rather than only the
      year.
    whyItMatters: >-
      The difference is not thesis-changing, but it would tighten historical chronology and remove reliance on secondary
      databases.
    diligencePath: Check corporate registry filings or request a current corporate profile extract from management.
    relatedQuestionRefs:
      - QO003
  - type: private-evidence-only
    severity: minor
    topic: TO004 milestone-table coverage
    missingEvidence: >-
      Program-by-program target timelines and investment requirements for ADVC002, ADVC003, and other earlier-stage
      assets.
    whyItMatters: >-
      The public website proves portfolio breadth, but not whether those programs are credible medium-term value
      drivers.
    diligencePath: Request pipeline review materials, development timelines, and capital-allocation plans beyond ADVC001.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: advc001-public-som
    missingEvidence: >-
      A public serviceable-patient count, pricing assumption, and expected treatment-share model specific to ADVC001 in
      each target line of therapy.
    whyItMatters: >-
      Without a defendable patient-count and pricing bridge, the market chapter can frame opportunity but cannot produce
      a credible AdvanCell revenue SOM.
    diligencePath: >-
      Request management market models, payer assumptions, and expected treated-patient cadence for Phase 3 and launch
      planning.
    relatedQuestionRefs:
      - QM022
  - type: conflicting-data
    severity: material
    topic: nested-market-definitions
    missingEvidence: >-
      A standardized public taxonomy reconciling mCRPC therapeutics, PSMA inhibitor, and targeted alpha therapy market
      definitions.
    whyItMatters: >-
      Different analyst publishers define the market boundary differently, so the numbers should inform judgment but not
      be merged into one synthetic TAM.
    diligencePath: >-
      Benchmark multiple market reports against product-level sales and clinical-segment definitions before using any
      one figure in an investment model.
    relatedQuestionRefs:
      - QM024
  - type: private-evidence-only
    severity: material
    topic: center-readiness-scan
    missingEvidence: >-
      A current center-by-center map of sites that could practically add a new alpha-radioligand program in the U.S. and
      Australia.
    whyItMatters: Adoption speed depends on real site capacity, not only theoretical disease incidence or broad market forecasts.
    diligencePath: Build a target-account list of theranostic centers, AUs, and radiopharmacy partners and assess readiness directly.
    relatedQuestionRefs:
      - QM010
      - QM015
  - type: missing-source
    severity: minor
    topic: reimbursement-rate-detail
    missingEvidence: >-
      Specific current reimbursement rates or margin dynamics for the ADVC001-like treatment pathway by payer and site
      of care.
    whyItMatters: >-
      The payer structure is clear, but exact economics at the site level remain opaque and can materially influence
      center adoption enthusiasm.
    diligencePath: Obtain coding, payment, and buy-and-bill analyses from reimbursement consultants or provider partners.
    relatedQuestionRefs:
      - QM014
  - type: private-evidence-only
    severity: minor
    topic: post-lu177-subset-size
    missingEvidence: >-
      A public estimate of the post-Lu-177 metastatic prostate-cancer subset that may be most relevant to differentiated
      alpha-therapy positioning.
    whyItMatters: >-
      That subset may be strategically important for ADVC001 differentiation, but public sources here do not quantify it
      cleanly.
    diligencePath: >-
      Use claims datasets or academic chart reviews to size post-radioligand progression cohorts by geography and center
      type.
    relatedQuestionRefs:
      - QM006
      - QM022
  - type: missing-source
    severity: material
    topic: head-to-head-comparative-data
    missingEvidence: Head-to-head clinical or operational comparisons between ADVC001 and incumbent or peer PSMA radioligands.
    whyItMatters: >-
      Without comparative efficacy, safety, and workflow data, the moat thesis rests on theory plus early proof rather
      than demonstrated superiority.
    diligencePath: >-
      Request investigator-level competitive read-throughs, cross-trial caveats, and any internal positioning analyses
      used for Phase 3 planning.
    relatedQuestionRefs:
      - QP020
      - QP024
      - QP025
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: Realized net pricing, center margin economics, and reimbursement details across leading radioligand products.
    whyItMatters: >-
      Packaging and pricing power are core competitive variables, but the retained public evidence is too thin for
      reliable comparison.
    diligencePath: >-
      Obtain reimbursement consultant analyses, provider buy-and-bill economics, and competitor net-pricing
      intelligence.
    relatedQuestionRefs:
      - QP011
      - QP019
  - type: private-evidence-only
    severity: material
    topic: supply-cost-advantage
    missingEvidence: >-
      Proof that AdvanCell’s claimed vertical integration creates a real cost, throughput, or reliability advantage over
      peers.
    whyItMatters: >-
