- id: operating-architecture-and-critical-dependencies
  title: Operating architecture and critical dependencies
  body: 'The most important product-tech insight in this chapter is that AdvanCell’s architecture is operational as much as scientific. A usable radiopharmaceutical product requires inputs, radioisotope handling, GMP production, quality assurance, regulatory controls, clinical delivery workflow, and logistics that respect the decay profile and safety requirements of radioactive materials. The Andover site announcements matter because they are architecture disclosures as much as they are corporate announcements: they tell us the company intends to internalize more of the manufacturing stack. The hiring evidence matters for the same reason. Supply-chain and QA recruiting show an organization building process and compliance depth around the product, not just more bench science. External workflow sources reinforce that this architecture still depends on imaging, site readiness, authorized users, and multidisciplinary clinical delivery. In other words, the technology stack is a dependency graph
    that spans factories, regulators, trial sites, and hospitals. That is exactly why scaling the product is hard and why product diligence must look beyond efficacy slides.'
