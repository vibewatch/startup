- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Isotope / input supply
    - Provides radioactive payload and critical inputs
    - Specialized supply chain and timing windows
    - Scarcity or delivery slippage can break the product system
  - - Ligand and radiolabel design
    - Confers tumor targeting and therapeutic logic
    - Clinical data and chemistry reproducibility
    - Insufficient differentiation or instability weakens moat
  - - GMP manufacturing and QA
    - Converts concept into usable dose product
    - Facilities, quality systems, and trained staff
    - Scale-up failure or low yields compress readiness
  - - Clinical-delivery workflow
    - Moves product through imaging, dosing, and monitoring
    - Authorized users, specialist centers, scheduling
    - Site readiness can bottleneck adoption
  - - Regulatory / reimbursement control layer
    - Governs what can be trialed, billed, and delivered
    - Regulators, trial protocols, payer pathway
    - Delays or gaps can stall otherwise promising assets
  notes: The architecture is operationally coupled; failure in any one layer can impair delivery.
