  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: manufacturing-reliability
    missingEvidence: Validated throughput, yield, batch-success, redundancy, and on-time delivery metrics for internal Lead-212 manufacturing.
    whyItMatters: These metrics determine whether the technology can become a reliable commercial product rather than a promising clinical concept.
    diligencePath: Request CMC package, validation timelines, redundancy plans, and manufacturing KPI dashboards.
    relatedQuestionRefs:
    - QE011
    - QE019
    - QE025
  - type: missing-source
    severity: material
    topic: head-to-head-product-positioning
    missingEvidence: Comparative data versus incumbent beta-emitter and peer alpha programs on efficacy, safety, and workflow burden.
    whyItMatters: Without comparative context, the moat rests on theory and early proof rather than demonstrated superiority.
    diligencePath: Request cross-trial positioning work and investigator feedback on use-case fit.
    relatedQuestionRefs:
    - QE015
    - QE023
