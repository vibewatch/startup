- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Company solution
  - Measurable benefit
  - Limitation
  rows:
  - - Select eligible metastatic patient
    - PSMA imaging and clinical screening at specialist center
    - ADVC001 targets PSMA-positive metastatic cohorts
    - Potentially expands alpha-radioligand options
    - Eligibility still depends on center workflow
  - - Dose and treat with alpha therapy
    - Site must schedule, handle, dose, and monitor radioactive therapy
    - Integrated Lead-212 therapy plus manufacturing push
    - Could improve control over supply and timing
    - No public proof yet of commercial reliability
  - - Optimize regimen over time
    - Standard fixed-course paradigms may not fit every patient
    - Response-guided induction and maintenance logic
    - Potentially more individualized treatment path
    - Needs validation in larger datasets
  - - Extend platform beyond one asset
    - Single-asset biotech risk can narrow long-term value
    - Platform / licensing collaborations may seed new programs
    - Could create broader franchise optionality
    - Economics and timing largely undisclosed
  notes: The product’s workflow is embedded in specialist clinical operations rather than ordinary outpatient prescribing.
