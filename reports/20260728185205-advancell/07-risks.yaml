- id: regulatory-legal-and-environmental
  title: Regulatory, legal, and environmental obligations are meaningful but partly mitigated by category precedent
  body: 'Radioligand therapy is not an unregulated frontier, which is important context in AdvanCell''s favor. FDA precedent exists in prostate radioligands, and NRC, payer, and hospital-readiness materials all show that regulators and operators now have working frameworks for medical use, radiation safety, reimbursement, and site activation. That moderates pure novelty risk. The same corpus, however, shows why regulatory risk remains persistent. Site licensing can still slow rollout. Reimbursement and prior-authorization pathways can lag clinical enthusiasm. Radioactive-waste handling and environmental compliance add obligations beyond standard biotech manufacturing. Publicly, the retained pack does not show a disclosed enforcement action, safety recall, or litigation case against AdvanCell, which is directionally reassuring. But that comfort is stage-limited because the company has not yet faced commercial-scale operations, the setting where many quality, labeling, and site-compliance
    failures surface. The right reading is therefore not “regulatory risk solved,” but “regulatory risk partly de-risked by precedent and still operationally material.”

    '
  claimRefs:
  - CR007
  - CR008
  - CR009
  - CR016
  - CR017
  - CR018
  - CR034
  - CR036
  tableRefs:
  - TR001
