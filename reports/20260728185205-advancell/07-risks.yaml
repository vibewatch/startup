chapter:
  number: 7
  title: Risks
  summary: 'AdvanCell''s current risk profile is dominated by execution rather than by one thesis-killing scientific flaw: the company must move a Lead-212 alpha-radioligand through clinical proof, isotope supply, manufacturing scale-up, site licensing, reimbursement, and specialist-center adoption almost simultaneously. The large 2026 Series D and growing category precedent are real mitigants, but public evidence still leaves industrial reliability, launch-center readiness, and financing durability materially unresolved.'
sections:
- id: risk-stack-and-severity-order
  title: The highest-severity risks are linked execution risks across trial, supply, and site readiness
  body: 'AdvanCell''s risk stack is better understood as a chain than as a list of isolated red flags. Clinical risk remains foundational because ADVC001 is still a development-stage program without registrational proof. But even positive pivotal data would not fully clear the path, because the company must also secure reliable Lead-212 supply, qualify and scale manufacturing, activate licensed specialist centers, and navigate reimbursement in a care pathway that remains operationally demanding. The consequence is a system-level risk profile: a disruption in isotope supply can delay trial dosing; dosing delays can slow clinical evidence; slower evidence can weaken payer or center confidence; and each delay can push financing needs further out. Public sources support a view that the most dangerous risks are not abstract market doubts but execution-heavy bottlenecks across industrial, clinical, and delivery layers. That matters for underwriting because several of these risks can cluster rather
    than arriving one at a time.

    '
  claimRefs:
