  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: advc001-public-som
    missingEvidence: A public serviceable-patient count, pricing assumption, and expected treatment-share model specific to ADVC001 in each target line of therapy.
    whyItMatters: Without a defendable patient-count and pricing bridge, the market chapter can frame opportunity but cannot produce a credible AdvanCell revenue SOM.
    diligencePath: Request management market models, payer assumptions, and expected treated-patient cadence for Phase 3 and launch planning.
    relatedQuestionRefs:
    - QM022
  - type: conflicting-data
    severity: material
    topic: nested-market-definitions
    missingEvidence: A standardized public taxonomy reconciling mCRPC therapeutics, PSMA inhibitor, and targeted alpha therapy market definitions.
    whyItMatters: Different analyst publishers define the market boundary differently, so the numbers should inform judgment but not be merged into one synthetic TAM.
    diligencePath: Benchmark multiple market reports against product-level sales and clinical-segment definitions before using any one figure in an investment model.
    relatedQuestionRefs:
    - QM024
  - type: private-evidence-only
    severity: material
    topic: center-readiness-scan
    missingEvidence: A current center-by-center map of sites that could practically add a new alpha-radioligand program in the U.S. and Australia.
    whyItMatters: Adoption speed depends on real site capacity, not only theoretical disease incidence or broad market forecasts.
    diligencePath: Build a target-account list of theranostic centers, AUs, and radiopharmacy partners and assess readiness directly.
    relatedQuestionRefs:
    - QM010
    - QM015
  - type: missing-source
    severity: minor
    topic: reimbursement-rate-detail
    missingEvidence: Specific current reimbursement rates or margin dynamics for the ADVC001-like treatment pathway by payer and site of care.
    whyItMatters: The payer structure is clear, but exact economics at the site level remain opaque and can materially influence center adoption enthusiasm.
    diligencePath: Obtain coding, payment, and buy-and-bill analyses from reimbursement consultants or provider partners.
    relatedQuestionRefs:
    - QM014
  - type: private-evidence-only
    severity: minor
    topic: post-lu177-subset-size
    missingEvidence: A public estimate of the post-Lu-177 metastatic prostate-cancer subset that may be most relevant to differentiated alpha-therapy positioning.
    whyItMatters: That subset may be strategically important for ADVC001 differentiation, but public sources here do not quantify it cleanly.
    diligencePath: Use claims datasets or academic chart reviews to size post-radioligand progression cohorts by geography and center type.
