tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to AdvanCell
  rows:
  - - Total prostate-cancer burden
    - Diagnosis, imaging, systemic therapy, supportive care across disease stages
    - Localized surgery and radiation episodes with no metastatic-theranostic pathway
    - Patients, providers, payers, health systems
    - Context only; far broader than AdvanCell’s near-term market
  - - mCRPC therapeutics market
    - Late-stage systemic therapy budgets after hormonal resistance
    - Earlier-stage disease management without metastatic progression
    - Oncologists, urologists, hospital pharmacies, payers
    - Important upper-bound reference because PSMA radioligands currently monetize mostly here
  - - PSMA theranostic pathway
    - PSMA PET selection, radioligand dosing, specialist administration, follow-up
    - Non-PSMA-targeted metastatic therapies and general oncology overhead
    - Referring physicians, AUs, hospitals, Medicare/commercial plans
    - This is the most relevant current commercial pathway for ADVC001
  - - Targeted alpha therapy niche
    - Alpha-emitter drug development, isotope supply, licensed administration sites
    - All beta-emitter or non-radioligand modalities that do not translate to alpha-specific readiness
    - Specialty centers, radiopharma sponsors, investors
    - Closest modality lens for AdvanCell’s differentiation but still broader than ADVC001 alone
  notes: Rows describe nested market scopes rather than additive TAM buckets. The chapter keeps broad disease burden separate from PSMA-pathway and alpha-therapy execution realities.
