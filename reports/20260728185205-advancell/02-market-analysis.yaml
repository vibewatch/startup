- id: growth-drivers-constraints-and-adoption-gaps
  title: Growth drivers, adoption constraints, and preserved contradictions
  body: The growth case for AdvanCell’s market is real. Pluvicto’s earlier-line expansion roughly tripled eligible patients, Phase III data showed meaningful clinical benefit, and independent deal and sales data now validate radioligand therapy as a serious commercial oncology modality. Analyst models also point to fast growth in both PSMA-targeted therapy and targeted alpha therapy. But the bullish case is inseparable from infrastructure and supply constraints. Avalere highlights limited dedicated suites, uneven PET access, training gaps, and complicated reimbursement; Science & Medicine Group stresses how short half-lives make the last mile operationally fragile; BioSpace and Vision both preserve hard evidence that supply shortages have already interrupted adoption. The result is a market with strong clinical pull but non-trivial friction. AdvanCell’s vertical-integration story is strategically aligned with those bottlenecks, yet public materials still do not support a bottom-up serviceable-market
    or revenue forecast. The correct read is that the market is growing fast, but access, logistics, and reimbursement still govern how much of that headline opportunity is actually reachable.
