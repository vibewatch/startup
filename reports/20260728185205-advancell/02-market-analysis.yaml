- id: sizing-lenses-and-market-nesting
  title: Sizing lenses, nested market definitions, and why TAM is not one number
  body: The public numbers support growth, but they do not describe one single universally agreed market. At the outer edge, SEER estimates 333,830 new U.S. prostate-cancer cases and 36,320 deaths in 2026, which establishes the clinical burden feeding later-line treatment demand. A narrower analyst lens sizes global mCRPC therapeutics at USD 29.08 billion in 2026, with North America dominating because it combines incidence, research intensity, and reimbursement support. Narrower still, the PMarketResearch PSMA inhibitor model puts the 2026 market at roughly USD 3.45 billion and shows that most of that value still sits in mCRPC and radioligand therapy rather than in earlier-stage applications. Narrower again, targeted alpha therapy is a roughly USD 1.2 billion market in 2026. Those figures are not contradictory if treated as nested scopes rather than additive layers. For AdvanCell, the practical lesson is that broad mCRPC or prostate-cancer totals overstate near-term opportunity unless they
    are filtered through PSMA selection, late-stage eligibility, treatment-center capacity, and alpha-therapy readiness.
