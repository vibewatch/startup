- id: buyer-user-payer-and-site-of-care-pathway
  title: Buyer, user, payer, and site-of-care adoption pathway
  body: 'Radioligand therapy is not purchased the way an oral oncology drug is. The clinical buyer coalition usually starts with the referring oncologist or urologist, but adoption only proceeds if an Authorized User, nuclear-medicine team, radiopharmacist, radiation-safety staff, and payer clearance all line up in sequence. The Health Policy Partnership framework is useful because it treats radioligand therapy as a six-step service pathway rather than a simple prescribing decision: eligibility must be confirmed, referral executed, reimbursement checked, the therapy planned, the radioactive dose administered safely, and follow-up coordinated between teams. That complexity is why hospitals and specialist centers dominate the channel and why community penetration remains uneven. Fred Hutch’s early Lu-177 PSMA implementation illustrates the work involved: beyond clinicians, the rollout required IT, patient educators, care coordinators, and financial-clearance teams. For AdvanCell, this means
    the effective customer is not only the physician. The real adoption engine is a center-level workflow and reimbursement machine capable of absorbing a new alpha-radioligand program.'
