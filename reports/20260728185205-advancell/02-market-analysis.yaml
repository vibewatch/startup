- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Buyer / prescriber
  - User
  - Payer / coverage gate
  - Workflow / adoption trigger
  - Budget owner / friction
  - Implication
  rows:
  - - PSMA-positive mCRPC before chemotherapy
    - Medical oncologist or urologist plus AU confirmation
    - Patient and caregiver
    - Commercial plan, Medicare, prior-authorization teams
    - PSMA PET positivity after ARPI and decision to delay chemo
    - Hospital suite capacity and reimbursement clarity
    - Current incumbent path most visibly validated by Pluvicto
  - - Post-Lu-177 or later-line metastatic disease
    - Specialist GU oncologist and nuclear-medicine team
    - Heavily pretreated patient
    - Payer scrutiny likely higher because evidence is newer
    - Need for new option after prior radioligand or systemic lines
    - Evidence gaps, performance status, site readiness
    - Represents a strategically important niche where differentiation could matter
  - - Metastatic hormone-sensitive expansion
    - Oncology leaders and trial investigators
    - Earlier metastatic patient
    - Payers usually wait for labels and guidelines
    - Requires strong evidence before routine use
    - Guideline timing and budget impact
    - Future upside pool rather than present revenue
  - - Hospital radioligand centers
    - Authorized User, radiopharmacy, nursing, finance, IT
    - Operating team and patient flow
    - Institutional contracting and payer ops
    - Ability to schedule, dose, bill, and dispose safely
    - Capex, training, staffing, waste handling
    - Center readiness is a market bottleneck in its own right
  - - Community or rural referral pathway
    - Community oncologist with specialist handoff
    - Patient often travels to tertiary center
    - Mixed commercial/Medicare/Medicaid rules
    - Referral success and imaging access
    - Travel burden, scan availability, and coding expertise
    - Access friction can suppress adoption even when clinical interest exists
  notes: The relevant buyer is a workflow coalition rather than a single prescriber. Each row shows how the market narrows when imaging, referral, suite capacity, and reimbursement must all line up.
