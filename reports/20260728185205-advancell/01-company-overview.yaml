- id: milestones-platform-and-adverse-signals
  title: Milestones, platform logic, and the adverse signals that still matter
  body: The visible milestone cadence accelerated sharply between late 2025 and mid-2026. In October 2025 AdvanCell named Andrew Kay as chair; in November it appointed Philina Lee as CEO effective January 2026; in December it moved ADVC001 into Phase 2 expansion; in February it unveiled both a new 48Hour Discovery collaboration and the ASCO GU design for TheraPb; in June it added Kelly and Gaudet while locking in the Andover manufacturing site; in July it raised the Series D and advanced the clinical narrative again ahead of ESMO 2026. Taken together, those milestones show a company moving from scientific proof-of-concept toward registrational and manufacturing readiness. The adverse context, however, should stay attached to the bullish story. Independent sector reporting says isotope generation, logistics, site readiness, and manufacturing orchestration remain the hard bottlenecks in radiopharmaceuticals, and recent competitors have already been slowed by supply issues. AdvanCell’s vertical
    integration thesis directly addresses those bottlenecks, but it does not eliminate them. For diligence purposes, the right reading is not problem solved, but important risk recognized and better funded than most peers.
