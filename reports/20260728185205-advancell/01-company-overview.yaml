- id: leadership-governance-and-key-person-dependence
  title: Leadership bench, governance, and key-person dependence
  body: 'Leadership quality is one of AdvanCell’s clearest strengths. Founder Andrew Adamovich remains involved as Managing Director, Australia, while Philina Lee took over as chief executive at the start of 2026 and brought direct commercialization and alpha-therapy experience from Blueprint Medicines, Algeta, Sanofi, and Fusion Pharmaceuticals. June 2026 appointments then deepened the U.S. operating bench further: Justyna Kelly added radiopharmaceutical manufacturing scale-up experience from Lilly and POINT Biopharma, François Gaudet added oncology discovery experience from Novartis and Johnson & Johnson, and Simon Puttick shifted into a role dedicated to isotope innovation from Brisbane. Governance also looks more substantive than a simple founder-led startup. Andrew Kay chairs the board after leading Algeta and helping commercialize Xofigo, while the current public roster includes investor and industry directors from Ally Bridge, Alpha Wave, Sanofi Ventures, Abingworth, and other healthcare
    investors. The residual risk is concentration, not absence: AdvanCell now has a credible bench, but it is still a private company whose public story remains heavily narrated through a small number of senior leaders and one lead program.'
