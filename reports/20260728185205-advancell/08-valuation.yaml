- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Frame
  - Support
  - What would strengthen it
  - What would break it
  rows:
  - - Scarce radiopharma platform
    - Large 2026 round and strategic investors suggest scarce-asset appeal
    - Pivotal-quality efficacy plus supply redundancy
    - Weak differentiation versus incumbent PSMA options
  - - Alpha-emitter differentiation
    - Pb-212 positioning could matter if more potent or operationally attractive
    - Clear comparative evidence and tolerability consistency
    - Equivalent efficacy with higher complexity
  - - Manufacturing as moat
    - Andover/Boston expansion can add strategic leverage
    - Published or diligenced yield, uptime, and release metrics
    - Repeated delays or unresolved isotope bottlenecks
  - - Category tailwind
    - Sector deal activity shows strategic appetite
    - Continued big-pharma bidding and commercial adoption
    - Cooling deal environment or poor late-stage data in peers
  - - Public valuation opacity
    - Headline raise does not disclose terms
    - Access to term sheet and cap table
    - Any evidence of punitive preferences or compressed step-up
  notes: The thesis is real, but every positive row still depends on execution evidence that is mostly private today.
