- id: comparable-context-and-what-the-market-is-paying-for
  title: Comparable context says the market pays for scarce radiopharma platforms, not just current revenue
  body: Comparable evidence is helpful for framing AdvanCell, but only if used with caution. The strongest read-through from the sector is that buyers and private investors are paying up for radiopharmaceutical platforms that combine clinically relevant assets with manufacturing or supply-chain leverage. BMS bought RayzeBio, Lilly bought POINT Biopharma, and AstraZeneca bought Fusion not because those targets were mature, cash-generating franchises, but because they offered strategic positioning in a radioligand arms race shaped by Novartis's Pluvicto and Lutathera success. That pattern is directly relevant to AdvanCell, whose story blends a PSMA-targeted prostate program with a Pb-212 alpha-emitter thesis and growing U.S. manufacturing ambition. Still, the analogies have limits. Many precedents involve public targets with market-discovered prices, broader pipelines, different isotopes, or assets at other stages of maturity. The comparable set therefore supports direction and range, not
    precision. It says the market is willing to pay for scarcity, but it does not prove the exact scarcity value of AdvanCell today.
