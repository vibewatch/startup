- id: exit-readiness-and-final-diligence
  title: Final judgment still depends on private diligence around terms, reliability, and launch proof
  body: 'The remaining diligence burden is not cosmetic; it directly determines whether AdvanCell is merely exciting or actually investable at a given price. Three issues stand above the rest. First, the cap table and Series D terms must be understood, because a company can be strategically attractive while still being unattractive for a new investor if the preferred stack, ratchets, or pricing already discount much of the upside. Second, the company needs to show that Lead-212 supply, manufacturing, and release processes can work reliably enough to support both pivotal trials and future commercial operations. Third, the launch pathway needs concrete evidence from treatment-center activation and payer preparation rather than category-level optimism. Until those questions are answered, exit readiness should be treated as incomplete. A credible thesis-break checklist therefore matters: if clinical differentiation fades, if supply proves brittle, or if follow-on financing arrives on weaker
    terms before key milestones, the valuation story can compress much faster than the round headline suggests.'
