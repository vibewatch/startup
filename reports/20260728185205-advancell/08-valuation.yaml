- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Immediate implication
  - Monitoring cadence
  rows:
  - - Clinical differentiation fades
    - Data no longer suggest a compelling advantage versus incumbent PSMA radioligands
    - Undermines premium platform narrative
    - Re-rate toward lower-end scenario
    - At every major data update
  - - Supply redundancy not demonstrated
    - No credible evidence of reliable isotope sourcing and release performance
    - Breaks manufacturing/moat logic
    - Increase discount and wait for proof
    - Quarterly / diligence
  - - Site activation lags
    - Named launch or trial centers remain sparse or slow
    - Pushes revenue timing and credibility outward
    - Reduce probability on base and bull cases
    - Quarterly
  - - Follow-on financing weakens
    - Capital raised again before key proof on visibly harsher terms
    - Signals 2026 round was not enough to bridge milestones
    - Treat as negative valuation signal
    - At any financing event
  - - Reimbursement friction persists
    - No concrete payer pathway despite data progress
    - Limits commercial conversion of efficacy
    - Trim launch assumptions
    - Before and after pivotal milestones
  notes: A trigger is not merely a risk factor; it is a monitorable event that would force an explicit change in valuation posture.
