- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Series D cap table and terms
    - Price per share, preferences, ownership, option pool, investor rights
    - Determines whether the current headline valuation is investable
    - Management room / legal data room
  - - Supply redundancy
    - Isotope sourcing counterparties, backup arrangements, and continuity plan
    - Radiopharma value is fragile without dose reliability
    - Operations and CMC diligence
  - - Manufacturing proof
    - Yields, batch-release rates, uptime, QA deviations, and validation status
    - Separates narrative from industrial readiness
    - Andover facility diligence
  - - Center readiness
    - Named sites, activation timing, authorized-user status, workflow readiness
    - Critical to converting approval into revenue
    - Commercial and medical affairs diligence
  - - Payer access plan
    - Coding, prior authorization, and reimbursement assumptions
    - Needed to defend commercialization model
    - Market-access diligence
  - - Program differentiation
    - Evidence package relative to Lu-177 and other alpha competitors
    - Core to sustaining strategic premium
    - Clinical diligence
  notes: These are the minimum private-diligence requests needed to turn the public narrative into an investable valuation file.
