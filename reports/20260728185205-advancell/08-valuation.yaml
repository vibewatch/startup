  - - Base
    - Continued trial progress, credible Andover execution, no near-term financing stress
    - Company broadly defends near-unicorn implied zone
    - Most plausible public read today
    - Still exposed to milestone and launch uncertainty
  - - Bull
    - Strong differentiated data plus credible supply control and sustained deal appetite
    - Strategic scarcity premium expands above the current implied range
    - Possible but requires several wins together
    - Needs proof, not just sector excitement
  - - Public-data blind spot
    - Preferences, ownership, margin, and utilization are private
    - Point estimates remain inherently unstable
    - Always present
    - Cap-table opacity can overwhelm scenario math
  notes: These scenarios are public-evidence framing tools, not management guidance or a substitute for private diligence.
