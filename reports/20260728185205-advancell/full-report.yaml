        title: Clinical maturity, asset map, and what is actually proven so far
        blocks:
          - type: paragraph
            body: >-
              The public evidence on maturity is encouraging but still clearly pre-approval. ClinicalTrials.gov, ASCO GU
              coverage, and company materials all align on the fact that ADVC001 is in a Phase 2 expansion configuration
              using two recommended dose levels, multiple metastatic prostate-cancer cohorts, and response-guided logic
              designed to refine regimen and sequencing. The ESMO materials and later result announcements strengthen
              the product case by preserving early safety and activity signals, including the absence of dose-limiting
              toxicities in Phase 1b and early evidence of biological effect. But the maturity boundary remains
              important. These are not commercial reliability data, registrational outcomes, or long-run product-support
              metrics. They are still expansion-stage clinical proof points. Publicly, AdvanCell’s near-term product map
              remains concentrated around ADVC001 with a small set of platform-extending collaborations rather than a
              broad menu of late-stage assets. The maturity picture is therefore strong enough to justify scale-up
