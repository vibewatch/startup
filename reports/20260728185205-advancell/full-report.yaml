  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization boundary
        blocks:
          - type: paragraph
            body: >-
              AdvanCell’s financial story is still mostly prospective. Public sources consistently frame the company as
              a clinical-stage radiopharmaceutical developer funding a transition from proof-of-concept into pivotal
              trials and manufacturing readiness, not as a disclosed revenue-generating operating business. ADVC001 is
              the obvious centerpiece of that future revenue model, because it is the flagship PSMA-targeted Lead-212
              asset and the use-of-proceeds language for the Series D centers on advancing targeted alpha therapies and
              expanding manufacturing. The public record also hints at longer-dated platform optionality through broader
              alpha-radioligand programs and licensing relationships, but none of the retained sources provide enough
              detail to model those opportunities as near-term revenue. Just as important, no source in the pack
              discloses current revenue, collaboration income, recognized product sales, or realized pricing. The result
              is a classic late-private-biotech framing: investors can see what may eventually monetize, but not yet the
              commercial engine itself.
