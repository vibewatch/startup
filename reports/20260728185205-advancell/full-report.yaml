  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition in workflow terms
        blocks:
          - type: paragraph
            body: >-
              AdvanCell’s product should not be framed as a single vial or a generic biotech pipeline slide. In workflow
              terms, the company is trying to deliver a PSMA-targeted alpha-radioligand therapy system: identify
              eligible metastatic prostate-cancer patients, manufacture a Lead-212-based therapeutic product, route it
              through specialist theranostic infrastructure, and ultimately support repeatable delivery at clinical and
              commercial scale. ADVC001 is the flagship expression of that system, but the public record also emphasizes
              the enabling layers around it—Lead-212 supply, radiolabeling, manufacturing, trial operations, and future
              delivery infrastructure. That framing matters because success depends on more than molecular potency. It
              depends on whether the entire product system can move from expansion-stage clinical proof into
              reproducible manufacturing and licensed-site delivery. Public sources support that integrated
              interpretation far more strongly than they support a broad multi-product revenue platform today. The
              relevant “product” is therefore the asset plus the operating machinery needed to deliver it.
