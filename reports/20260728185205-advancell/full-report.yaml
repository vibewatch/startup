  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and the real substitute set
        blocks:
          - type: paragraph
            body: >-
              AdvanCell’s relevant market is far narrower than all prostate-cancer spending and even narrower than the
              full metastatic-prostate-cancer market. The commercially relevant boundary begins where PSMA-positive
              metastatic disease enters a radioligand-capable care pathway: molecular imaging, eligibility assessment,
              specialist referral, radiopharmacy preparation, therapy administration, and follow-up. This framing
              matters because it excludes large swaths of prostate-cancer care that do not translate into addressable
              demand for ADVC001, including localized surgery or radiation, standard chronic surveillance, and
              non-PSMA-directed pathways. The substitute set is also broader than one drug-to-drug comparison. Patients
              and providers can still use androgen receptor pathway inhibitors, taxanes, PARP combinations, or incumbent
              beta-emitter radioligands such as Pluvicto depending on line of therapy and site capability. In other
              words, AdvanCell is entering a specialized treatment workflow, not a generic oncology budget bucket. That
              is why market sizing must distinguish broad disease burden from the much smaller subset of patients who
              can actually move through a licensed theranostic pathway.
