      - number: '1.3'
        title: Capital base, strategic stakeholders, and scale signals
        blocks:
          - type: paragraph
            body: >-
              The July 2026 Series D is the company’s defining scale signal. AdvanCell closed an oversubscribed and
              upsized US$315 million round led by Ally Bridge and co-led by Alpha Wave, with new participation from Bain
              Capital Life Sciences, Fidelity, T. Rowe Price, a sovereign wealth fund, Eventide, and Velosity, while
              strategic backers including Eli Lilly and Sanofi Ventures also returned. That syndicate does two things at
              once: it validates demand for the story, and it embeds potential strategic options into the cap table.
              Management says the proceeds will move ADVC001 toward Phase 3, expand Lead-212 manufacturing and isotope
              supply, and accelerate the broader pipeline. Independent coverage reinforces that narrative and adds one
              crucial valuation clue: Forbes says the company declined to disclose valuation but that a round of this
              size would usually imply a mark approaching US$1 billion. Even so, public disclosure remains selective.
              InforCapital compiles roughly US$427 million of total funding across three rounds, but there is still no
              public view into preference stack, debt terms, headcount, revenue, or customer metrics. The public record
              proves access to capital more convincingly than it proves operating maturity.
