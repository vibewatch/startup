      - number: '8.3'
        title: A wide scenario range is more honest than a single point estimate
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis is the right public framework because AdvanCell's value is still transmitted through
              future milestones rather than current financial statements. In the bear case, value compresses quickly if
              pivotal evidence slips, isotope redundancy remains unproven, or site activation proves slower than
              investors expect. In the base case, the current financing carries the company through major clinical and
              manufacturing milestones, letting it defend the broad near-unicorn narrative implied by secondary
              coverage. In the bull case, differentiated alpha-emitter data plus supply credibility could move AdvanCell
              into the subset of radiopharma companies that attract premium strategic attention. The challenge is that
              every one of those cases depends on hidden variables: preference stack, dilution, manufacturing yields,
              treatment-center cadence, reimbursement assumptions, and launch timing. That is why a risk-adjusted NPV
              mind-set is better than a simple revenue multiple. Public evidence supports a range and a hierarchy of
              sensitivities, but not a precise fair value. Investors should therefore focus less on a single mark and
              more on whether the company is moving toward the assumptions embedded in the higher scenarios.
