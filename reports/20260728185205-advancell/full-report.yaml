  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive boundary: incumbents, direct alpha peers, and ecosystem gatekeepers'
        blocks:
          - type: paragraph
            body: >-
              AdvanCell does not compete against a single neatly defined rival. The relevant field starts with Novartis,
              because Pluvicto already defines the commercial benchmark in PSMA-targeted radioligand therapy and is
              moving earlier in metastatic castration-resistant prostate cancer. It extends to large-pharma entrants
              that bought their way into radiopharma—Lilly via POINT Biopharma, Bristol Myers Squibb via RayzeBio, and
              AstraZeneca via Fusion—because those companies combine capital, trial infrastructure, and
              business-development reach. It also includes specialist developers such as RadioMedix that look
              technically closer to AdvanCell because they publicly disclose Pb-212 or PSMA alpha programs. Lantheus
              belongs in the chapter even though it is not a therapeutic substitute, because diagnostic control is
              strategically upstream of therapy adoption. Finally, status-quo systemic regimens and incumbent
              beta-emitter workflows remain real substitutes in the customer decision tree. The correct market map is
              therefore layered: direct modality peers, giant portfolio competitors, upstream imaging gatekeepers, and
              existing treatment standards all matter at once.
