      - number: '4.2'
        title: Comparator proxies, site economics, and cost-driver reality
        blocks:
          - type: paragraph
            body: >-
              The best public financial evidence for AdvanCell comes indirectly through comparable radioligand
              businesses and care-delivery constraints. Novartis’s Pluvicto sales prove that radioligand therapy can
              become a meaningful commercial franchise, and Lantheus’s public disclosures show that the upstream PSMA
              imaging ecosystem already experiences pricing and competition pressure. But these comparators also
              highlight why direct extrapolation would be hazardous. AdvanCell is earlier stage, has no approved
              product, and is still proving an alpha-emitter workflow rather than leveraging an established Lu-177
              installed base. Meanwhile, public reimbursement and implementation sources make clear that therapy
              economics are inseparable from site operations: imaging, staffing, radiation safety, scheduling, and
              multidisciplinary coordination all sit inside the economic footprint. Those realities suggest a cost
              structure much heavier than a typical biotech selling pills or antibodies. They also explain why public
              price opacity matters so much: even if drug pricing were known, contribution margins could still vary
