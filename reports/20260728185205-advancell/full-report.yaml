            body: >
              The public record is strongest that operational risk is where the AdvanCell thesis could break first.
              Independent industry sources repeatedly highlight isotope scarcity, last-mile logistics, workforce
              shortages, site-readiness bottlenecks, imaging coordination, waste handling, and the difficulty of
              synchronizing all those tasks around a decaying therapeutic product. AdvanCell is trying to mitigate those
              category risks through vertical integration rhetoric, a flagship Andover facility, and visible hiring into
              logistics and quality. Yet those are preparations rather than proof. Public materials still do not
              disclose validated throughput, yield, redundancy, uptime, or on-time delivery metrics. Partner and
              dependency risk also remains high. Even with more internal manufacturing ambition, AdvanCell still depends
              on regulators, supply inputs, trial sites, specialist centers, and a competitive ecosystem shaped by
              Novartis and large-cap acquirers. People risk sits inside that same cluster because specialized
