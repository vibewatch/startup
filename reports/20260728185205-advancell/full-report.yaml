chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and operating model
        blocks:
          - type: paragraph
            body: >-
              AdvanCell’s public identity is unusually consistent for a fast-scaling private biotech. The homepage and
              company page both describe the business as a vertically integrated, clinical-stage radiopharmaceutical
              company building targeted alpha therapies around a proprietary Lead-212 platform. That wording matters
              because it frames AdvanCell as more than a single-asset sponsor: management is explicitly selling an
              end-to-end model that combines isotope sourcing, manufacturing, and drug development under one roof. The
              geography matches that story. Public contact and company pages show a multi-site Australian footprint
              across Brisbane, Richlands, the Translational Research Institute in Woolloongabba, and Adelaide, alongside
              a Massachusetts presence that is already live in Cambridge and expanding toward a larger Andover base. The
              portfolio is broader than one line item on a slide: ADVC001 is the lead asset, but the website also lists
              ADVC002, ADVC003, and earlier programs. The missing piece is commercial scale. Public materials still do
              not disclose revenue, headcount, or customer counts, so the visible identity is stronger than the visible
              operating metrics.
