  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation should stay at watch because strategic strength and evidence gaps coexist
        blocks:
          - type: paragraph
            body: >-
              The most supportable public-market style judgment on AdvanCell today is not a decisive invest or pass
              call, but a watch recommendation with medium confidence. That framing is not timid; it is a consequence of
              the evidence structure. On the positive side, the company has raised an unusually large July 2026 Series
              D, attracted blue-chip crossover and strategic investors, advanced ADVC001 into a later-stage clinical
              posture, and aligned itself with one of oncology's hottest strategic categories. Those signals matter
              because radiopharmaceutical acquisitions and financings have shown that scarce isotopes, manufacturing
              capability, and differentiated targeting can command exceptional strategic value. The limiting factor is
              that almost all of the hard underwriting variables remain private. Public sources do not disclose the
              round price per share, liquidation preferences, ownership dilution, post-money capitalization table, dose
              economics, or launch-center readiness metrics. That leaves outside investors able to see the outline of a
              valuable company, but not yet able to prove the price of that value. Entry discipline therefore matters
              more than excitement.
