- id: profile-comparison
  title: 'Who leads today: commercial maturity, installed-base power, and strategic direction'
  body: 'By public proof, Novartis is ahead because it already has approval, meaningful sales, and a site footprint. Pluvicto’s earlier-line approval and roughly USD 2 billion of 2025 sales show that the company is monetizing real demand rather than simply financing a hypothesis. Lantheus has different but still material leverage because PSMA imaging, radiopharmacy relationships, and referral patterns influence which therapeutic vendors eventually gain traction at centers. Lilly, BMS, and AstraZeneca matter because each has recently used M&A to assemble credible radiopharma positions, making the competitive field less about small biotech peers and more about which sponsors can accelerate development while solving supply and manufacturing. RadioMedix is strategically narrower but important because it makes the Pb-212 story less proprietary than generic investor narratives imply. Bayer’s Xofigo, while not a clean PSMA comparator, still reminds investors that alpha therapy can reach the prostate-cancer
    market without owning the same target or line of therapy. The resulting hierarchy is clear: Novartis leads, diagnostic and big-pharma challengers shape the battlefield, and AdvanCell is trying to leapfrog on modality and supply rather than on current installed base.'
