- id: pricing-distribution-and-lockin
  title: Pricing opacity, distribution power, and the real sources of switching cost
  body: 'Public competitor materials say surprisingly little about realized therapeutic pricing, but they say a great deal about how power is actually exercised. This market runs through institutional buy-and-bill economics, payer familiarity, imaging eligibility, radiopharmacy operations, and treatment-center workflow capacity. That structure favors incumbents with existing center relationships even when list prices are opaque. It also explains why Lantheus matters as a diagnostic power center and why Novartis’s site footprint matters beyond headline efficacy. The most relevant switching costs are therefore operational, not digital: centers need imaging, dosing, safety, reimbursement, and scheduling processes that work. Multi-homing is possible because the same specialist institutions can support multiple radioligand modalities, but familiarity with one workflow can slow the adoption of another. For AdvanCell, the commercial question is less “Can centers theoretically use alpha therapy?”
    and more “Can ADVC001 earn a place in already crowded specialist pathways quickly enough to matter?” That is a harder problem than a simple feature comparison suggests.'
