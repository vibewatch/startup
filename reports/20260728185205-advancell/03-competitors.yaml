- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Current mitigation or proof
  - Residual exposure / diligence ask
  rows:
  - - Lead-212 alpha differentiation
    - Competing alpha programs narrow the uniqueness claim
    - High
    - AdvanCell has a clear Pb-212 identity and direct PSMA lead asset
    - Need comparative clinical proof against incumbent and peer alpha programs
  - - Vertical supply integration
    - Large pharma can invest, acquire, or partner around isotope bottlenecks
    - High
    - Andover buildout plus supply narrative reinforce intent
    - Need evidence of redundancy, throughput, and cost advantage at scale
  - - Fresh capital from Series D
    - Incumbents already possess greater commercial maturity
    - Medium-High
    - USD 315M round materially extends runway and scale-up capacity
    - Need to know how much capital is still required before launch
  - - Platform breadth beyond ADVC001
    - Single-asset concentration if expansion programs stall
    - Medium
    - 48Hour collaboration suggests broader pipeline ambition
    - Need a clearer multi-asset roadmap and timing
  - - PSMA market tailwinds
    - Incumbent referral patterns and payer familiarity entrench Novartis
    - High
    - Market growth supports multiple entrants in theory
    - Need segment-specific evidence that centers will adopt a new alpha entrant
  - - Specialist-center multi-homing
    - Workflow inertia can still delay switching
    - Medium
    - Centers can theoretically support multiple vendors
    - Need reference accounts and activation data showing practical onboarding speed
  notes: The biggest competitive risk is not that alpha therapy lacks appeal; it is that differentiation proves real later than rival platforms scale their site and payer advantage.
