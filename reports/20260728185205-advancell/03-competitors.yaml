  - - Eli Lilly / POINT Biopharma
    - Big-pharma radioligand challenger
    - Large-cap acquirer with prostate-cancer asset base
    - Lu-177 radioligand therapy and broader oncology portfolio
    - Capital, execution resources, and strategic staying power
    - Not visibly differentiated on Pb-212 specifically
  - - BMS / RayzeBio
    - Big-pharma alpha challenger
    - USD 4.1B acquisition signaled willingness to pay for radiopharma scale
    - Actinium-focused radiopharmaceutical pipeline
    - Deep capital plus manufacturing and BD optionality
    - Current flagship is not the same prostate program as AdvanCell lead
  - - AstraZeneca / Fusion
    - Big-pharma radioconjugate challenger
    - Large-cap acquirer with radioconjugate platform
    - Prostate-cancer radioconjugates and actinium expertise
    - Portfolio breadth and development muscle
    - Commercial proof still earlier than Novartis
  - - RadioMedix
    - Specialist alpha/PSMA peer
    - Clinical-stage specialist rather than giant rollup
    - Pb-212 and PSMA-linked programs
    - Closer modality overlap with AdvanCell
    - Smaller scale and less public commercial footprint than large pharma
