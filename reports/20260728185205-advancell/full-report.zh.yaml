            body: >-
              从 2025 年末到 2026 年中，可见里程碑节奏明显加快。2025 年 10 月，AdvanCell 任命 Andrew Kay 为董事长；11 月，公司任命 Philina Lee 为 CEO，2026 年
              1 月生效；12 月，ADVC001 进入 Phase 2 扩展；2 月，公司公布新的 48Hour Discovery 合作和 TheraPb 的 ASCO GU 设计；6 月，公司任命 Kelly 和
              Gaudet，并锁定 Andover 制造基地；7 月，公司完成 Series D，并在 ESMO 2026
              前再次推进临床叙事。合在一起，这些里程碑显示公司正从科学概念验证走向注册性和制造准备。不过，不利背景必须和乐观故事一起看。独立行业报道指出，同位素生成、物流、中心准备度和制造编排仍是放射性药物的硬瓶颈，近期竞争对手已被供应问题拖慢。AdvanCell
              的垂直整合论点正面回应这些瓶颈，但没有消除它们。尽调中，正确解读不是「问题已解决」，而是「重要风险已被识别，且融资力度强于多数同行」。
