      - number: '1.3'
        title: 资本基础、战略股东与规模信号
        blocks:
          - type: paragraph
            body: >-
              2026 年 7 月的 Series D 轮是公司最重要的规模信号。AdvanCell 完成超额认购并上调规模的 US$315 million 融资，由 Ally Bridge 领投、Alpha Wave
              联合领投，新进投资方包括 Bain Capital Life Sciences、Fidelity、T. Rowe Price、一家主权财富基金、Eventide 和 Velosity，Eli
              Lilly、Sanofi Ventures 等战略支持者也继续跟投。这一投资团同时做了两件事：验证市场对故事的需求，也把潜在战略选项嵌入股权结构。管理层称，资金将推动 ADVC001 迈向 Phase 3，扩张
              Lead-212 制造和同位素供应，并加速更广管线。独立报道强化了这一叙事，并补上一条关键估值线索：Forbes 称公司拒绝披露估值，但这个规模的融资通常意味着估值接近 US$1
              billion。即便如此，公开披露仍有选择性。InforCapital 汇总三轮融资约 US$427
              million，但优先权结构、债务条款、员工数、收入或客户指标仍没有公开视图。公开记录更有力地证明了融资能力，而不是运营成熟度。
