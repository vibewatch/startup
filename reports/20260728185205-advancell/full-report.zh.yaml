  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 相关客户是患者、专科临床医生、中心和付款方
        blocks:
          - type: paragraph
            body: >-
              AdvanCell 仍处于商业化前，因此客户地图必须围绕决定转移性前列腺癌患者能否真正接受靶向 α
              疗法的人和机构来构建。公开证据指向一个多边结构。患者和照护者是最终接受治疗的用户，但他们只有通过专科临床医生、诊疗一体化中心、影像流程和付款方审批，才会进入路径。临床研究者和高能力中心在实践意义上就是当前运营客户，因为它们负责入组、给药、监测和学习。转诊肿瘤科医生和泌尿科医生塑造漏斗顶部，付款方和医疗系统最终决定覆盖和规模。战略合作伙伴和投资人在边缘有影响，但不应被误认为客户证明。因此，本章把客户牵引视为护理网络问题，而不是传统账户数量问题。相关客户基础真实存在，但围绕专科工作流组织，而非一个可见的商业客户名单。
