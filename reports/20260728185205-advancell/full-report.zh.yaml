  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 最高严重度风险是贯穿试验、供应和站点准备度的联动执行风险
        blocks:
          - type: paragraph
            body: >
              AdvanCell 的风险栈更像一条链，而不是一串孤立红旗。ADVC001 仍是没有注册性证明的开发阶段项目，临床风险仍是基础。但即使关键数据积极，也不能完全扫清道路，因为公司还必须获得可靠 Lead-212
              供应、认证并放大制造、激活持证专科中心，并在运营要求很高的护理路径中处理报销。结果是一种系统级风险画像：同位素供应中断会延迟试验给药；给药延迟会拖慢临床证据；证据变慢会削弱付款方或中心信心；每一次延迟都会把融资需求继续往后推。公开来源支持一个判断：最危险的风险不是抽象市场怀疑，而是横跨工业、临床和交付层的重执行瓶颈。这对承销很关键，因为其中多个风险可能成簇出现，而不是一次只来一个。
