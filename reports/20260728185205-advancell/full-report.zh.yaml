      - number: '8.2'
        title: 可比背景显示，市场愿为稀缺放射性药物平台付费，而不只是为当前收入付费
        blocks:
          - type: paragraph
            body: >-
              可比证据有助于给 AdvanCell 定框架，但必须谨慎使用。行业最强的映射是，买方和私人投资者愿意为同时具备临床相关资产和制造或供应链杠杆的放射性药物平台支付溢价。BMS 收购 RayzeBio、Lilly
              收购 POINT Biopharma、AstraZeneca 收购 Fusion，并不是因为这些标的是成熟的现金流业务，而是因为它们在一场由 Novartis 的 Pluvicto 和 Lutathera
              成功塑造的放射性配体军备竞赛中占据战略位置。这一模式与 AdvanCell 直接相关，因为它的故事把 PSMA 靶向前列腺项目、Pb-212 α
              发射体论点和不断增强的美国制造雄心混在一起。不过，类比有边界。许多先例涉及有市场发现价格的上市标的、更宽管线、不同同位素，或成熟度处于其他阶段的资产。因此，可比集合支持方向和区间，而不支持精确度。它说明市场愿意为稀缺性付费，但不能证明
