  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现边界
        blocks:
          - type: paragraph
            body: >-
              AdvanCell 的财务故事目前仍以未来预期为主。公开来源一致把公司描述为处于临床阶段的放射性药物开发商，正在资助从概念验证走向关键试验和制造准备的过渡，而不是一家已披露收入的运营企业。ADVC001
              显然是未来收入模式的中心，因为它是旗舰 PSMA 靶向 Lead-212 资产，Series D 的募资用途也围绕推进靶向 α 疗法和扩大制造。公开记录还通过更广的 α
              放射性配体项目和许可关系暗示更长期的平台可选性，但保留来源没有给出足够细节，无法把这些机会建模为近期收入。同样重要的是，资料包没有任何来源披露当前收入、合作收入、已确认产品销售或实际定价。结果是一种典型的后期私人生物科技框架：投资者能看见未来可能变现的东西，但还看不见商业引擎本身。
