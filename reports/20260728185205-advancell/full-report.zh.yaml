  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 用工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              AdvanCell 的产品不应被理解为单支药瓶，也不是通用生物科技管线幻灯片。从工作流看，公司试图交付一套 PSMA 靶向 α 放射性配体疗法系统：识别适格的转移性前列腺癌患者，制造基于 Lead-212
              的治疗产品，通过专业诊疗一体化基础设施交付，并最终支撑临床和商业规模下的可重复给药。ADVC001 是这套系统的旗舰表达，但公开记录同样强调其周围的赋能层——Lead-212
              供应、放射性标记、制造、试验运营和未来交付基础设施。这个框架很重要，因为成功不只取决于分子效力，还取决于整个产品系统能否从扩展阶段的临床证明，走向可复现制造和持证站点交付。公开来源更强地支持这种整合解读，而不是支持今天已有一个宽泛多产品收入平台。因此，真正的「产品」是资产加上交付资产所需的运营机器。
