            body: >-
              场景分析是正确的公开框架，因为 AdvanCell
              的价值仍通过未来里程碑传导，而不是通过当前财务报表传导。熊市情形下，如果关键证据滑坡、同位素冗余仍未证明，或站点激活慢于投资者预期，价值会迅速收缩。基准情形下，当前融资支撑公司穿越主要临床和制造里程碑，让它守住二级报道暗示的近独角兽叙事。牛市情形下，差异化
              α 发射体数据加上供应可信度，可能把 AdvanCell
              推入能吸引溢价战略关注的放射性药物公司子集。难点在于，每一种情形都依赖隐藏变量：优先权结构、稀释、制造良率、治疗中心节奏、报销假设和上市时间。因此，风险调整 NPV
              思维优于简单收入倍数。公开证据支持一个区间和一组敏感性层级，但不支持精确公允价值。投资者因此应少盯单一估值标记，多看公司是否正在走向更高情形中内嵌的假设。
