      - number: '7.2'
        title: 监管、法律与环境义务重要，但类别先例部分缓释了风险
        blocks:
          - type: paragraph
            body: >
              放射性配体疗法不是无监管的前沿，这一点对 AdvanCell 有利。FDA
              在前列腺放射性配体上已有先例，NRC、付款方和医院准备度材料也显示，监管者和运营方现在已有围绕医疗使用、辐射安全、报销和站点激活的工作框架。这降低了纯新颖性风险。但同一批材料也说明，监管风险为什么仍会持续。站点许可仍可能拖慢推出。报销和预授权路径可能落后于临床热情。放射性废物处理和环境合规还会叠加标准生物科技制造之外的义务。公开来看，保留资料包没有显示针对
              AdvanCell
              的已披露执法行动、安全召回或诉讼案件，这在方向上令人安心。但这种安心受阶段限制，因为公司尚未面对商业规模运营，而许多质量、标签和站点合规失败正是在这一场景中暴露。正确解读因此不是「监管风险已解决」，而是「先例部分去风险，但运营上仍然重要」。
