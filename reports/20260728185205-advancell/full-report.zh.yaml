            body: >-
              乐观的客户论点有其合理性。如果临床数据继续成熟、基础设施扩张，AdvanCell 可以通过激活更多诊疗一体化中心、赢得付款方安心，并把 α
              放射性配体使用推进到更早或更广的前列腺癌场景来增长。公司的招聘和运营建设显示，管理层理解上市支持的重要性。但不利现实同样可见。没有公开来源披露具名商业账户、留存指标、付款方胜利或逐中心部署。也没有公开证据表明集中度风险已经解决，社区中心准备度缺口仍然真实存在。因此，本章还不能支撑「持久客户业务」结论。更窄也更可辩护的观点是：AdvanCell
              已经对严肃专科网络有意义，但商业客户引擎在公开层面仍大多未被证明。在站点数量、复用指标和付款方牵引出现前，即便科学热情很高，客户承销也应保持纪律。
