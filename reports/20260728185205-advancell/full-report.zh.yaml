      - number: '3.3'
        title: 定价不透明、分销力量与真实转换成本来源
        blocks:
          - type: paragraph
            body: >-
              公开竞争者材料对实际治疗定价说得出奇少，却充分揭示了权力如何被行使。这个市场运转在机构先购后报销经济性、付款方熟悉度、影像适格性、放射性药房运营和治疗中心流程容量之上。即便目录价不透明，这种结构也偏向已有中心关系的现有玩家。它也解释了为什么
              Lantheus 作为诊断权力中心重要，以及为什么 Novartis
              的站点布局价值超过头条疗效。最相关的转换成本因而是运营性的，不是数字化的：中心需要能跑通的影像、给药、安全、报销和排班流程。多归属可以存在，因为同一批专科机构能支持多种放射性配体模态，但对一个流程的熟悉会拖慢另一个流程的采用。对
              AdvanCell 来说，商业问题与其问「中心理论上能否使用 α 疗法？」，不如问「ADVC001 能否足够快地在已经拥挤的专科路径中占到一个有意义的位置？」这比简单功能比较难得多。
