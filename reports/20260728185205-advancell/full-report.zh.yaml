      - number: '7.3'
        title: 运营、合作伙伴与人员风险最可能把问题传导进投资论点
        blocks:
          - type: paragraph
            body: >
              公开记录最有力地表明，运营风险可能最先打破 AdvanCell
              论点。独立行业来源反复强调同位素稀缺、最后一公里物流、劳动力短缺、站点准备度瓶颈、影像协调、废物处理，以及围绕一个会衰变的治疗产品同步所有任务的难度。AdvanCell 正试图通过垂直整合叙事、旗舰
              Andover
              设施，以及物流和质量岗位的可见招聘来缓释这些类别风险。但这些是准备，不是证明。公开材料仍未披露经过验证的吞吐量、良率、冗余、正常运行时间或按时交付指标。合作伙伴和依赖风险同样仍高。即便内部制造野心增强，AdvanCell
              仍依赖监管者、供应投入、试验站点、专科中心，以及由 Novartis
              和大市值收购方塑造的竞争生态。人员风险也在同一簇风险里，因为专业放射性药物人才稀缺，放大速度慢会拖住一个本来有前景的资产。因此，运营可靠性仍是最可能的第一失效路径。
