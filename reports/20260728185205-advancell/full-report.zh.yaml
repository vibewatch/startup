  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争边界：现有龙头、直接 α 同行与生态守门人
        blocks:
          - type: paragraph
            body: >-
              AdvanCell 面对的不是一个边界清晰的单一对手。相关战场从 Novartis 开始，因为 Pluvicto 已在 PSMA
              靶向放射性配体疗法中定义商业标杆，并正向更早线的转移性去势抵抗性前列腺癌推进。战场还延伸到通过收购进入放射性药物的大药企——Lilly 借 POINT Biopharma、Bristol Myers Squibb
              借 RayzeBio、AstraZeneca 借 Fusion——因为这些公司同时拥有资本、试验基础设施和 BD 触达能力。它也包括 RadioMedix 等专业开发商；这些公司公开披露 Pb-212 或
              PSMA α 项目，技术上更接近 AdvanCell。Lantheus 即便不是治疗替代品，也应放入本章，因为诊断控制位于治疗采用的战略上游。最后，现有全身治疗方案和既有 β
              发射体流程仍是客户决策树中的真实替代。正确的市场地图因而是分层的：直接疗法模态同行、大型组合竞争者、上游影像守门人和现有治疗标准同时重要。
