      - number: '6.3'
        title: 准入瓶颈、付款方缺口与可用交付网络的狭窄性
        blocks:
          - type: paragraph
            body: >-
              AdvanCell 的客户路径会变窄，因为放射性配体疗法仍然重基础设施。外部准备度来源和专科工作流论文反复强调，治疗需要影像、专科转诊、受训人员、辐射处理能力、排班纪律和付款方支持。Avalere
              聚焦准入的框架尤其重要，因为它指出患者可能已经在临床上准备好，但医疗系统还没有。由此看，最重要的客户约束不是简单的需求生成，而是中心准备度。Novartis 被引用的近 600
              个美国治疗站点网络显示，站点深度本身可以成为竞争变量，但 AdvanCell 尚未披露等价的中心地图。这带来集中度和扩张不确定性。如果上市时只有数量不大的站点能实际运行 α
              放射性配体工作流，少数账户可能决定早期销量的大部分。公开记录尚未化解这一风险。
