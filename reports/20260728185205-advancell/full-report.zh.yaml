      - number: '3.2'
        title: 谁领先：商业成熟度、既有基础力量与战略方向
        blocks:
          - type: paragraph
            body: >-
              按公开证据看，Novartis 领先，因为它已经有获批产品、可观销售和治疗中心布局。Pluvicto 更早线获批以及 2025 年约 USD 2 billion
              销售额表明，公司是在把真实需求变现，而不只是为一个假设融资。Lantheus 的杠杆不同但同样重要，因为 PSMA 影像、放射性药房关系和转诊模式会影响哪些治疗供应商最终在中心获得牵引。Lilly、BMS 和
              AstraZeneca 重要，是因为它们近期都用 M&A 拼出可信的放射性药物布局，让竞争不再只是小型生物科技同行之间的较量，而是谁能在解决供应和制造的同时加速开发。RadioMedix
              战略上更窄，但重要性在于，它让 Pb-212 故事不像通用投资叙事暗示的那样专有。Bayer 的 Xofigo 虽然不是干净的 PSMA 对照，仍提醒投资者：α
              疗法可以在不拥有同一靶点或同一治疗线的情况下进入前列腺癌市场。由此形成的层级很清楚：Novartis 领先，诊断方和大药企挑战者塑造战场，AdvanCell 则试图靠疗法模态和供应实现跃迁，而不是靠当前既有基础。
