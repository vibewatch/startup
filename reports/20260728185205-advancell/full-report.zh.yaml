  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与真实替代集合
        blocks:
          - type: paragraph
            body: >-
              AdvanCell 的相关市场远窄于全部前列腺癌支出，也窄于完整的转移性前列腺癌市场。商业上真正相关的边界，始于 PSMA
              阳性转移性疾病进入可承接放射性配体的诊疗路径：分子影像、资格评估、专科转诊、放射性药房制备、治疗给药和随访。这一框架很重要，因为它排除了大量不能转化为 ADVC001
              可触达需求的前列腺癌护理，包括局部手术或放疗、标准慢性随访，以及非 PSMA 导向路径。替代集合也不只是药物对药物的比较。患者和医生仍可根据治疗线数和机构能力使用雄激素受体通路抑制剂、紫杉烷、PARP
              联合方案，或 Pluvicto 等既有 β 发射体放射性配体。换句话说，AdvanCell
              进入的是专科治疗流程，不是通用肿瘤预算池。因此，市场测算必须区分广义疾病负担和小得多的、真正能够走完获准诊疗一体化路径的患者子集。
