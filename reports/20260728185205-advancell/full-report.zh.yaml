        title: 资本有帮助，但里程碑滑坡、竞争和可靠性仍决定下行
        blocks:
          - type: paragraph
            body: >
              AdvanCell 2026 年 7
              月融资显著提升了公司的持续建设能力，但没有消除下行情形。这个规模的融资降低了即时偿付焦虑，并为临床和制造工作提供资金，但也抬高了市场对关键执行和工业化准备度的期待。公开证据仍未披露现金余额、烧钱、可支撑月数或下行融资计划，投资者无法把头条融资转换成干净的充足性模型。来自
              Novartis 和其他资金充足的放射性药物开发方的竞争压力仍然真实，而更广 PSMA 生态中的定价压力意味着，随着领域成熟，未来毛利率或准入摩擦可能加剧。另一个复杂性是跨境：AdvanCell
              起源于澳大利亚，正在美国扩张，同时拥有全球多元投资人基础，其中包括 Qatar Investment
              Authority；这未必构成当前问题，但在未来某些融资或退出场景中会增加尽调和叙事敏感性。正确的投资反应是密切观察会打破论点的指标，而不是假设融资轮本身已经解决了难题。
