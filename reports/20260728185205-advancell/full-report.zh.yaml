      - number: '2.4'
        title: 增长驱动、采用约束与保留下来的矛盾
        blocks:
          - type: paragraph
            body: >-
              AdvanCell 所在市场的增长逻辑真实存在。Pluvicto 向更早线治疗扩张后，适格患者约增至三倍；Phase III
              数据显示有意义的临床获益；独立交易和销售数据也已验证，放射性配体疗法是严肃的商业化肿瘤治疗模式。分析师模型同样指向 PSMA 靶向疗法和靶向 α 疗法的快速增长。但乐观逻辑离不开基础设施和供应约束。Avalere
              强调专用套间有限、PET 可及性不均、培训缺口和报销复杂；Science & Medicine Group 强调短半衰期让最后一公里在运营上很脆弱；BioSpace 和 Vision
              都保留了供应短缺已打断采用的硬证据。结果是一个临床拉力很强、摩擦也不小的市场。AdvanCell
              的垂直整合故事与这些瓶颈在战略上对齐，但公开材料仍不足以支撑自下而上的可服务市场或收入预测。正确解读是：市场在快速增长，但可及性、物流和报销仍决定头部机会里有多少真正可触达。
