            body: >-
              正确的公开结论是：AdvanCell 现在看起来足以支撑下一阶段临床和制造放大，但作为运营企业仍不透明。积极面有分量：公司以罕见规模融资，正在投资制造而非只讲叙事，可比放射性配体企业也表明，如果 ADVC001
              有效，真实商业价值可以出现。阻塞项同样清楚。公开来源没有披露定价、实际经济性、烧钱、客户集中度、营运资本或贡献利润率。站点经济性、同位素物流和制造利用率都可能显著改变财务图景，而这些变量都没有以足够精度披露，无法建模。这意味着投资者可以支持战略准备度和品类相关性的论点，但不能支持已验证收入质量或清晰利润率路径的论点。在私人尽调补齐这些缺口前，财务上应把
