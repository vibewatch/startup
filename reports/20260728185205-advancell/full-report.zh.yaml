      - number: '1.2'
        title: 领导层厚度、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              领导层质量是 AdvanCell 最清晰的优势之一。创始人 Andrew Adamovich 仍以澳大利亚董事总经理身份参与，公司在 2026 年初由 Philina Lee 接任 CEO，她曾在
              Blueprint Medicines、Algeta、Sanofi 和 Fusion Pharmaceuticals 负责商业化和 α 疗法相关工作。2026 年 6
              月的任命进一步加厚了美国运营班底：Justyna Kelly 带来 Lilly 和 POINT Biopharma 的放射性药物制造放大经验，François Gaudet 带来 Novartis 和
              Johnson & Johnson 的肿瘤发现经验，Simon Puttick 则从 Brisbane 转入专注同位素创新的角色。治理也比一个单纯创始人主导的创业公司更实。Andrew Kay 曾领导
              Algeta 并帮助 Xofigo 商业化，现任董事长；当前公开名单还包括来自 Ally Bridge、Alpha Wave、Sanofi Ventures、Abingworth
              等医疗投资机构的投资人和产业董事。剩余风险不是缺人，而是集中度：AdvanCell 现在有可信班底，但它仍是私人公司，公开叙事高度依赖少数高管和一个核心项目。
