  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、布局与运营模式
        blocks:
          - type: paragraph
            body: >-
              在快速扩张的私人生物科技公司里，AdvanCell 的公开身份表述少见地一致。官网首页和公司页都把它描述为一家垂直整合、处于临床阶段的放射性药物公司，围绕自有 Lead-212 平台开发靶向 α
              疗法。这套措辞很关键，因为它把 AdvanCell
              定位成不只是单一资产赞助方：管理层明确在出售一个端到端模式，把同位素来源、制造和药物开发放在同一屋檐下。地理布局也呼应这个故事。公开联系信息和公司页面显示，AdvanCell 在澳大利亚有多点布局，覆盖
              Brisbane、Richlands、Woolloongabba 的 Translational Research Institute 和 Adelaide；美国侧已在 Cambridge 落地，并正向更大的
              Andover 基地扩张。组合也不只是幻灯片上的一个项目：ADVC001 是核心资产，但官网还列出 ADVC002、ADVC003
              和更早期项目。缺口在商业规模。公开材料仍未披露收入、员工数或客户数，所以可见身份强于可见运营指标。
