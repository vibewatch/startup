      - number: '3.4'
        title: 护城河耐久性：AdvanCell 拥有什么、缺什么，以及什么会打破突破口
        blocks:
          - type: paragraph
            body: >-
              AdvanCell 公开可见的最佳护城河论点逻辑连贯，但仍取决于执行。公司有清晰的 Lead-212 身份、正在 Phase 2 推进且瞄准 Phase 3
              的前列腺癌核心资产、美国制造扩建，以及一套把全行业供应痛点转化为竞争优势的垂直整合叙事。这些在放射性药物领域都是有意义的强项。但今天护城河还没有被深度证明。RadioMedix
              和其他专业公司表明，AdvanCell 并不独占 Pb-212 或 α 叙事。大药企可以收购竞争资产、放大试验运营，并跨相邻模态投资。Novartis
              的既有基础也意味着，现有龙头不必赢下每一场科学争论也能保住商业杠杆。因此，AdvanCell
              的防线很窄：它必须拿出更好的数据、可靠的同位素和制造执行，以及比更有钱或更成熟竞争者更快的运营准备。如果这些支柱任何一个滑坡，当前公开护城河论点会很快收缩。
