            body: >-
              AdvanCell 最好的公开财务证据，来自可比放射性配体企业和护理交付约束的间接参照。Novartis 的 Pluvicto 销售证明，放射性配体疗法可以成为有分量的商业业务；Lantheus
              的公开披露显示，上游 PSMA 影像生态已经承受定价和竞争压力。但这些可比对象也说明，直接外推很危险。AdvanCell 阶段更早，没有获批产品，仍在验证 α 发射体流程，而不是利用成熟的 Lu-177
              既有基础。与此同时，公开报销和落地资料清楚表明，治疗经济性离不开站点运营：影像、人员配置、辐射安全、排班和多学科协调都在经济足迹内。这些现实意味着，成本结构会比典型卖药片或抗体的生物科技公司重得多。它们也解释了为什么公开价格不透明如此重要：即便药价已知，贡献利润率仍可能随站点准备度和供应执行显著变化。
