      - number: '2.3'
        title: 买方、用户、付款方与护理站点采用路径
        blocks:
          - type: paragraph
            body: >-
              放射性配体疗法的采购方式不同于口服肿瘤药。临床买方联盟通常从转诊肿瘤科医生或泌尿科医生开始，但只有授权使用者、核医学团队、放射性药师、辐射安全人员和付款方审批按顺序对齐，采用才会推进。Health Policy
              Partnership
              框架有用，是因为它把放射性配体疗法视为六步服务路径，而不是简单处方决定：先确认适格性，再执行转诊、核验报销、规划治疗、安全给药放射性剂量，并协调团队间随访。这种复杂性解释了为什么医院和专科中心主导渠道，也解释了社区渗透为什么不均。Fred
              Hutch 早期落地 Lu-177 PSMA 的经验显示，除临床医生外，推出还需要 IT、患者教育人员、护理协调员和财务审批团队。对 AdvanCell 来说，有效客户不只是医生。真正的采用引擎，是能够吸收新的
              α 放射性配体项目的中心级流程和报销机器。
