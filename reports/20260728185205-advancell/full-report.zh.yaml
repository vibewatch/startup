companyProfile:
  summary: >-
    AdvanCell 是一家创立于 Brisbane、横跨澳大利亚和美国的放射性药物公司，围绕 ADVC001 建立垂直整合的靶向 α 疗法平台；ADVC001 是面向转移性前列腺癌的 PSMA 靶向 Lead-212
    项目。公司把后期临床资产与 Greater Boston 的供应链和制造扩建结合起来。在放射性药物市场里，平台稀缺性和工业化准备度越来越值钱，这让 AdvanCell 具备战略相关性。
