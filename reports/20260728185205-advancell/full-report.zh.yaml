      - number: '6.2'
        title: 当前采用证明真实存在，但仍处于商业化前且由专科主导
        blocks:
          - type: paragraph
            body: >-
              AdvanCell 今天具备有意义客户相关性的最强公开证据，是正在运行的 TheraPb 项目。公司材料、UroToday 报道和 ClinicalTrials.gov
              都支持多个临床分段的转移性前列腺癌队列处于活跃状态。重要之处在于，它显示的是真实受治用户和临床医生参与，而不只是管线幻灯片。更多证明来自产品在专科渠道中的可见度：Grand Rounds in
              Urology、Frontiers 和 MDPI
              综述都显示，该疗法处在严肃临床讨论之中。但这些证明有边界。试验队列和会议讨论不等同于商业部署、活跃站点数量或持久复用。它们证明的是相关性、关注度和工作流参与，而不是成熟客户业务。公开证据最强的是「专科网络内的严肃运营证明」，最弱的是「可观察的商业采用和留存」。投资者应把这个区别视为核心，而不是语义差异。
