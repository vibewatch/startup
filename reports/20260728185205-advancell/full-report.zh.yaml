      - number: '2.2'
        title: 测算口径、嵌套市场定义，以及为什么 TAM 不是一个数字
        blocks:
          - type: paragraph
            body: >-
              公开数字支持增长，但它们描述的不是一个全行业一致认可的单一市场。最外层，SEER 估计 2026 年美国新增前列腺癌病例 333,830 例、死亡 36,320
              例，这奠定了后线治疗需求的临床负担。窄一层，分析师口径将 2026 年全球 mCRPC 治疗市场测算为 USD 29.08
              billion；北美占主导，因为它同时具备发病率、研究强度和报销支持。再窄一层，PMarketResearch 的 PSMA 抑制剂模型把 2026 年市场估为约 USD 3.45
              billion，并显示多数价值仍在 mCRPC 和放射性配体疗法，而不是更早期应用。再往内，靶向 α 疗法在 2026 年约为 USD 1.2 billion
              市场。只要把这些数字当作嵌套范围而非可相加层级，它们并不矛盾。对 AdvanCell 而言，实际启示是：广义 mCRPC 或前列腺癌总额会夸大短期机会，除非先经过 PSMA 筛选、晚期适用性、治疗中心容量和 α
              疗法准备度过滤。
