        title: 最终判断仍取决于围绕条款、可靠性和上市证明的私人尽调
        blocks:
          - type: paragraph
            body: >-
              剩余尽调负担不是装饰性问题；它直接决定 AdvanCell 在某个价格上只是令人兴奋，还是确实可投。三件事最重要。第一，必须弄清股权结构和 Series D
              条款，因为一家公司可以具备战略吸引力，但如果优先股堆栈、反稀释或定价已经折现大量上行，对新投资者仍可能没有吸引力。第二，公司需要证明 Lead-212
              供应、制造和放行流程足够可靠，能够同时支撑关键试验和未来商业运营。第三，上市路径需要来自治疗中心激活和付款方准备的具体证据，而不是类别层面的乐观。在这些问题回答之前，退出准备度应被视为不完整。因此，一个可信的论点破裂清单很重要：如果临床差异化变弱、供应被证明脆弱，或关键里程碑前的后续融资条款走弱，估值故事可能比头条融资暗示的速度更快收缩。
            claimRefs:
              - CV037
              - CV038
              - CV039
              - CV040
