company:
  name: "Drools"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Drools is a late-stage Indian dog-and-cat nutrition manufacturer whose scale is
    supported by a 40,000-plus-outlet network, exports to 22 countries, and a reported
    4,195 employees as of April 2026. Nestlé's 2025 minority investment validated the
    platform but did not disclose transaction terms, leaving the exact valuation,
    ownership mechanics, and governance rights as material diligence gaps.
sections:
  - id: "identity-and-operating-footprint"
    title: "Identity and operating footprint"
    body: >-
      Drools operates as an Indian manufacturer of food and nutrition products for
      dogs and cats, with the company positioning its formulas around animal protein,
      veterinary input, and controlled manufacturing. Public sources do not agree on
      the starting date: Tracxn dates the company to 2009, while Financial Express,
      NewsBytes, SoJapan, and an independently uploaded business-model deck use 2010.
      The legal entity now associated with the brand, Drools Pet Food Private Limited,
      was incorporated in Chhattisgarh on September 10, 2018 and is shown as active.
      This distinction between brand origin and legal-entity incorporation should be
      retained rather than collapsed into one founding date. Operating scale is
      substantial for a private Indian pet-food business: 2025 reporting cited more
      than 40,000 retail outlets, exports to 22 countries, six manufacturing units, and
      1.6 million square feet of warehousing. These figures establish reach, but they
      remain reported snapshots rather than audited measures of utilization or sell-through.
    claimRefs: ["CO001", "CO002", "CO003", "CO004", "CO011", "CO012"]
    tableRefs: ["TO001"]
    figureRefs: ["FO001"]
  - id: "capitalization-and-scale"
    title: "Capitalization and scale"
    body: >-
      The disclosed financing history has two pivotal events. Tracxn records a
      $60 million L Catterton private-equity round on June 20, 2023, but its stated
      $474 million post-money valuation conflicts with Financial Express's report
      that the same investment valued Drools at $600 million. In May 2025, Nestlé
      acquired a minority stake and said Drools would remain strategically and
      operationally independent. Nestlé also said no other terms would be disclosed,
      while Financial Express separately noted that the price and valuation at which
      Nestlé invested were unknown. Accordingly, the widely reported $1 billion
      valuation should be treated as a third-party valuation marker, not a disclosed
      transaction price. More recent operating indicators include SoJapan's report of
      ₹932.3 crore FY2025 revenue, up 28.7% year over year, and Tracxn's report of
      4,195 employees as of April 30, 2026. Neither metric establishes current cash
      availability, profitability, or customer economics.
    claimRefs: ["CO005", "CO006", "CO007", "CO008", "CO009", "CO010", "CO013", "CO015"]
    tableRefs: ["TO003"]
  - id: "leadership-governance-and-diligence"
    title: "Leadership, governance, and diligence posture"
    body: >-
      Fahim Sultan is consistently identified as the founder, while Tracxn also names
      Bahadur Ali as a co-founder and links the business to IB Group. The current
      legal-entity board is reported as Fahim Sultan Ali, Sultan Ali, and Danish Ali;
      the concentration of named directors around the founding group suggests
      meaningful key-person and family-control exposure, although the available
      evidence does not establish voting rights or committee independence. Danish
      Ali is described on the company profile as an independent board member, but no
      public board charter, committee structure, or Nestlé governance right was found
      in the assigned evidence. Investors therefore need the current cap table,
      shareholder agreement, reserved-matters schedule, board minutes, and succession
      plan before relying on the label of operational independence. The absence of
      disclosed Nestlé terms is itself the principal adverse finding in this chapter:
      it prevents confirmation of dilution, liquidation preferences, strategic rights,
      or whether the $1 billion headline is directly tied to the transaction.
    claimRefs: ["CO002", "CO003", "CO008", "CO009", "CO014"]
    tableRefs: ["TO002"]
