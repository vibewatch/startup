callouts:
  - calloutType: "risk"
    title: "Headline valuation is not a disclosed transaction price"
    body: >-
      Nestlé disclosed a minority investment but no terms; Financial Express explicitly
      reported that the transaction valuation was unknown. Treat the $1 billion figure
      as a reported valuation marker pending the signed transaction documents.
    claimRefs: ["CO009", "CO010"]
