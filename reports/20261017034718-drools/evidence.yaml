evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: transaction-terms
    missingEvidence: >-
      Nestlé stake size, transaction price, post-money capitalization, shareholder rights, liquidation preferences, and
      reserved matters.
    whyItMatters: >-
      Without the signed terms, the $1 billion headline cannot be reconciled to dilution, governance influence, or the
      economic value of each security.
    diligencePath: >-
      Obtain the 2025 subscription or share-purchase agreement, current cap table, amended articles, and board approvals
      directly from the company.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: minor
    topic: identity
    missingEvidence: Primary incorporation and brand-launch records that reconcile the 2009 and 2010 founding dates.
    whyItMatters: The distinction affects company age, milestone chronology, and founder narrative.
    diligencePath: Request the original business registration history and first commercial invoice or launch record.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited revenue, gross margin, EBITDA, cash, debt, working capital, customer concentration, channel sell-through,
      and current employee reconciliation.
    whyItMatters: >-
      Public scale indicators do not establish profitability, cash runway, quality of growth, or whether reported
      headcount covers the same entity and population.
    diligencePath: >-
      Request audited FY2025 and FY2026 financial statements, debt schedules, channel-level sales data, payroll reports,
      and a current organization chart.
    relatedQuestionRefs:
      - QO005
      - QO008
    relatedTableRefs:
      - TO001
      - TO002
  - type: missing-source
    severity: material
    topic: sam-som-gap
    missingEvidence: A pet-food-only SAM/SOM split by channel, price tier, and dog-versus-cat mix for India.
    whyItMatters: >-
      Public numbers are top-down and differently scoped, which weakens valuation work tied to reachable segments
      instead of headline category growth.
    diligencePath: >-
      Request management's internal segment split, retailer sell-through by channel, and any third-party category
      dataset with disclosed methodology.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-budget-ownership
    missingEvidence: Revenue mix by general trade, vet channel, ecommerce, quick-commerce, exports, and repeat-purchase cohorts.
    whyItMatters: >-
      Without channel mix and reorder behavior, public buyer mapping cannot show which budgets or cohorts actually drive
      Drools' reachable market.
    diligencePath: >-
      Ask management for channel revenue mix, cohort reorder data, and SKU contribution by dog, cat, and
      veterinary-influenced lines.
    relatedQuestionRefs:
      - QM003
      - QM009
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: minor
    topic: market-share-methodology
    missingEvidence: The underlying methodology behind the reported 38% volume share and any matching value-share dataset.
    whyItMatters: >-
      Category leadership claims affect pricing power and competitive assumptions, but the current citations are
      tertiary and do not show the source dataset.
    diligencePath: Obtain the cited industry report or management deck that discloses share methodology and measurement period.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Current SKU-level public price cards or retailer shelf snapshots for Drools, Pedigree, Purina, and local
      specialist alternatives.
    whyItMatters: >-
      Without matched public prices, the analysis can support an affordable-premium positioning claim but cannot prove a
      durable realized price moat or discount intensity.
    diligencePath: >-
      Collect current retailer PDPs, Amazon/Flipkart listings, and distributor price sheets for comparable dog and cat
      food SKUs.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: post-deal-channel-conflict
    missingEvidence: >-
      The post-investment governance terms, channel-conflict safeguards, and any exclusivity or data-sharing
      arrangements between Drools and Nestlé.
    whyItMatters: >-
      Those terms would determine whether Purina remains a straightforward competitor, a constrained coopetitor, or a
      channel partner in premium segments.
    diligencePath: >-
      Request the shareholder agreement, board-rights summary, and management commentary on channel and product-line
      governance after the Nestlé investment.
    relatedQuestionRefs:
      - QP006
  - type: private-evidence-only
    severity: material
    topic: pricing-disclosure
    missingEvidence: Realized ASPs, trade discounts, distributor terms, and channel revenue mix by FY2025.
    whyItMatters: Without gross-to-net pricing detail, public channel scale cannot be translated into revenue quality.
    diligencePath: Request FY2025 channel P&Ls with list-to-net bridges for retail, export, and e-commerce.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
