    title: Market definition table
    columns:
      - Segment/category
      - Included spend
      - Excluded spend
      - Buyer / payer
      - Relevance
    rows:
      - ["Core packaged pet food", "Dry and wet dog/cat food sold through retail, ecommerce, quick-commerce, and D2C", "Grooming, boarding, accessories, and pet healthcare services", "Pet parent household", "Best fit with Drools' disclosed operating footprint and category claims"]
      - ["Veterinary and prescription nutrition", "Specialized diets and clinically influenced feeding decisions", "Clinical service fees themselves", "Pet parent influenced by veterinarian", "Supports premiumization and trust-driven conversion"]
      - ["Treats and supplements", "Functional snacks, supplements, and adjacent nutrition basket expansion", "Non-nutrition pet lifestyle spend", "Pet parent household", "Relevant adjacency but not a reason to count the full pet-care market as core TAM"]
      - ["Broader pet-care adjacency", "Household pet spending narratives used by media for context", "Any assumption that all pet-care spend converts into food demand", "Pet household across services", "Useful context only; must stay separate from packaged food market sizing"]
    notes: "Boundary logic separates packaged nutrition from the broader pet-care economy so mixed market estimates are not treated as one TAM."
    claimRefs: [CM006, CM007, CM013, CM015, CM016]
  - id: TM002
    title: TAM/SAM/SOM or sizing lens table
    columns:
      - Publisher
      - Year
      - Geography
      - Value
      - CAGR
      - Methodology
      - Confidence
      - Limitation
    rows:
      - ["BusinessOutreach", "2025", "India pet food", "USD 0.87 bn", null, "Top-down category estimate summarized in article", "Medium", "No disclosed source methodology in fetched text"]
      - ["BusinessOutreach", "2026 est.", "India pet food", "USD 0.98 bn", "11.32% (2026-2031)", "Top-down category estimate summarized in article", "Medium", "Forecast basis is not fully unpacked"]
      - ["BusinessOutreach", "2031", "India pet food", "USD 1.68 bn", "11.32% (2026-2031)", "Long-range category projection summarized in article", "Medium", "Forward projection, not observed demand"]
      - ["StartupIndiaX", "2027-28", "India pet care", "USD 7.0 bn", "18-20%", "Narrative media estimate for broader pet-care market", "Low", "Broader market boundary than pet food"]
      - ["IndianStartupNews", "2028", "India pet care sector", "> USD 1.2 bn", "~20% over next five years", "Company estimate repeated in media coverage", "Low", "Publisher attributes estimate to company, not an independent dataset"]
      - ["Startuppedia", "FY25", "Drools revenue", "INR 932.0 cr", "29% YoY", "Registrar-of-Companies-sourced company revenue used as realized demand lens", "Medium", "Company revenue is not the same thing as SAM or category TAM"]
    notes: "Rows intentionally mix category, adjacent-sector, and realized-revenue lenses to show what public evidence does and does not isolate."
    claimRefs: [CM001, CM002, CM003, CM006, CM007, CM011, CM016]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - ["Mass dog food households", "Pet parent", "Dog", "Household", "General trade, pet shop, or ecommerce replenishment", "Household discretionary budget", "Value-for-money packaged nutrition versus home feed or low-quality local options"]
      - ["Premium dog food households", "Pet parent", "Dog", "Household", "Specialty retail, ecommerce, and repeat branded feeding", "Household discretionary budget", "Science-based positioning, ingredient trust, and trading up"]
      - ["Cat food households", "Pet parent", "Cat", "Household", "Online-led or specialty retail purchase", "Household discretionary budget", "Category availability, convenience, and specialized nutrition"]
      - ["Vet-influenced nutrition", "Pet parent with veterinary input", "Pet with dietary need", "Household", "Clinic recommendation followed by retail or online fulfillment", "Household health budget", "Veterinary trust, prescription-adjacent credibility, and condition-specific need"]
    notes: "Public sources support buyer and workflow directionally, but they do not disclose channel revenue mix or repeat-purchase cohorts by segment."
    claimRefs: [CM009, CM010, CM013, CM014, CM015]
figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      The public market story combines category size, penetration, and adjacency lenses rather
      than a clean public TAM-to-SAM-to-SOM bridge.
    data:
      items:
        - label: Pet-owning households in India
          value: 10
          unit: "%"
          detail: Only about 10% of Indian households own a pet in the cited startup coverage.
          claimRefs: [CM008]
        - label: Owned dogs fed commercial pet food daily
          value: 29
          unit: "%"
          detail: BusinessOutreach frames commercial-feeding penetration as the main whitespace.
          claimRefs: [CM004]
        - label: Quick-commerce pet-food coverage
          value: 42
          unit: cities
          detail: BusinessOutreach uses 42 Indian cities as a distribution-expansion signal.
          claimRefs: [CM005]
        - label: India pet food market (2025)
          value: 0.87
          unit: USD bn
          detail: BusinessOutreach category estimate.
          claimRefs: [CM001]
        - label: India pet food market (2026 est.)
          value: 0.98
          unit: USD bn
          detail: BusinessOutreach near-term category estimate.
          claimRefs: [CM002]
        - label: Broader pet-care market (2027-28)
          value: 7
          unit: USD bn
          detail: StartupIndiaX uses a broader pet-care definition rather than pet food only.
          claimRefs: [CM006]
    approximationNotes: >-
      Ordered as analytic lenses, not as a computed cumulative bridge. The 2027-28 figure is for
      broader pet care, while the 2025-2026 values are pet-food category estimates.
    claimRefs: [CM001, CM002, CM004, CM005, CM006, CM008]
callouts:
  - calloutType: insight
    title: Conversion matters more than household count alone
    body: >-
      Public evidence suggests Drools benefits more from converting existing pet households into
      regular commercial feeding than from assuming rapid pet-ownership penetration by itself.
    claimRefs: [CM004, CM005, CM008]
  - calloutType: risk
    title: Public TAM math stays noisy
    body: >-
      The available numbers mix pet food, broader pet care, and company-estimate narratives, so
      valuation work should treat public market sizing as directional until segment and channel
      evidence is disclosed.
    claimRefs: [CM006, CM007, CM016]
