company:
  name: Drools
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Public evidence supports a clear boundary around packaged pet nutrition rather than the
    whole pet-care economy, and that distinction materially changes how large Drools' reachable
    market looks. Third-party sources point to a still-underpenetrated Indian category with room
    to grow, but the available data stays top-down and does not isolate a clean segment-by-segment
    SAM/SOM for Drools.
sections:
  - id: market-boundary-and-adjacencies
    title: Market boundary and what counts
    body: >-
      The strongest public boundary for Drools is packaged pet nutrition sold through retail,
      veterinary, ecommerce, quick-commerce, and export channels, not the entire Indian pet-care
      economy. BusinessOutreach frames Drools as winning between low-quality local feed and
      imported premium brands, which makes status-quo substitutes visible and keeps the chapter
      from treating grooming, healthcare, accessories, or services as interchangeable spend.
      That matters because the published market numbers do not all describe the same pool:
      BusinessOutreach reports a pet-food lens, StartupIndiaX uses a broader pet-care lens, and
      IndianStartupNews repeats a company estimate for the sector. The chapter therefore keeps
      category size, adjacency, and Drools' own revenue as separate lenses instead of collapsing
      them into one inflated TAM headline.
    claimRefs: [CM006, CM007, CM008, CM015, CM016]
    tableRefs: [TM001]
  - id: sizing-lenses-and-growth-constraints
    title: Sizing lenses, growth drivers, and constraints
    body: >-
      The public category case is directionally attractive but still evidence-constrained.
      BusinessOutreach sizes Indian pet food at $0.87 billion in 2025, $0.98 billion in 2026,
      and $1.68 billion by 2031, while also noting that only 29% of owned dogs are fed
      commercial pet food daily and that quick-commerce pet-food coverage spans 42 cities.
      Those figures point to premiumization and distribution expansion as real growth drivers,
      but they also show that adoption is still conversion-led rather than saturated.
      StartupIndiaX and IndianStartupNews add broader sector growth narratives, yet those
      estimates are either based on wider pet-care definitions or on company estimates rather
      than disclosed methodology. Because public evidence does not isolate Drools' true
      pet-food-only SAM/SOM by channel and segment, this chapter treats the market as a set of
      bounded lenses rather than a precise bottom-up model.
    claimRefs: [CM001, CM002, CM003, CM004, CM005, CM006, CM007, CM011, CM016]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyer-segments-and-adoption-path
    title: Buyer segmentation, budget ownership, and adoption path
    body: >-
      The evidence points to a household-discretionary purchase with a trust overlay rather than
      an enterprise procurement sale. BusinessOutreach, Scribd, and startup coverage together
      show Drools spanning economy, core, premium, treat, supplement, and prescription-adjacent
      lines across dogs and cats, which implies multiple entry points into the same nutrition
      workflow. Adoption appears to move through omnichannel availability plus veterinary or
      science-based trust cues: broad general trade and ecommerce extend reach, while vet-backed
      formulations and premium sub-brands support trading up. Drools' own operating scale matters
      here because over 40,000 retail outlets, six manufacturing units, exports to 22 countries,
      and a large sales force make route-to-market a meaningful part of its market access thesis,
      not just a post-market-share detail.
    claimRefs: [CM009, CM010, CM013, CM014, CM015]
    tableRefs: [TM003]
tables:
