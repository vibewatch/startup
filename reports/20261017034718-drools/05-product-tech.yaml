  evidenceGaps:
    - type: missing-source
      severity: material
      topic: quality-controls
      missingEvidence: External food-safety certifications, plant audit results, recall history, and formal QA process documentation.
      whyItMatters: Without independently described controls, it is hard to underwrite whether scale is being maintained with durable quality assurance rather than marketing-level quality claims.
      diligencePath: Request HACCP or equivalent certifications, third-party plant audits, recall logs, and batch-failure or customer-return summaries by facility.
      relatedQuestionRefs: [QE007]
      relatedTableRefs: [TE003]
    - type: private-evidence-only
      severity: material
      topic: product-performance
      missingEvidence: SKU-level sales mix, repeat-purchase rates, channel sell-through, and outcome data for specialty or veterinary-led diets.
      whyItMatters: Portfolio breadth alone does not show which product lines are durable, profitable, or differentiated enough to support long-term brand strength.
      diligencePath: Request SKU and channel contribution, reorder behavior, launch scorecards, and vet-clinic performance by specialty line.
      relatedQuestionRefs: [QE002, QE004]
      relatedTableRefs: [TE001, TE002]
    - type: missing-source
      severity: minor
      topic: practitioner-signal
      missingEvidence: Independent practitioner-community or customer-review evidence on formulation acceptance, vet recommendations, or complaint frequency.
      whyItMatters: This chapter's assigned pool validates distribution scale but offers limited outside proof of product performance beyond company-adjacent or startup press coverage.
      diligencePath: Collect vet-clinic references, practitioner testimonials, review distributions, or category-specific marketplace feedback for the cited brands.
      relatedQuestionRefs: [QE007, QE008]
