      - ["Trade up from imported pet food", "Choose between imported premium products and domestic packaged food", "Domestic manufacturing plus price/distribution positioning", "Independent coverage says local production helped Drools compete on price and distribution", "Assigned pool has no like-for-like pricing table"]
      - ["Vet-influenced special feeding", "Seek breed-specific, high-protein, or veterinary-led food recommendations", "High-protein and veterinary-prescribed offerings through clinics and pet channels", "Coverage cites vet-linked channels and specialty offerings", "No prescription uptake, outcomes, or repeat-use data"]
      - ["Omnichannel restocking", "Replenish through pet stores, clinics, retailers, or e-commerce", "General trade plus Amazon and other e-commerce presence", "Independent reports cite Amazon, pet stores, and vet clinics as distribution surfaces", "No channel mix, service levels, or online conversion data"]
    notes: >-
      Benefits are availability and channel-scale proxies taken from public coverage; no row
      should be read as a quantified customer-outcome study.
    claimRefs: [CE001, CE004, CE005, CE006, CE013, CE014]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process
      - Role
      - Dependency
      - Risk
    rows:
      - ["Portfolio and formulation layer", "Organizes dog/cat diets, treats, and specialty lines across brands", "Relies on sustained product development and nutritional credibility", "Assigned pool does not disclose formulation IP, clinical substantiation, or launch hit rate"]
      - ["Manufacturing base", "Converts formulations into packaged pet food at scale", "Six manufacturing units underpin throughput", "No public plant capacity, utilization, or external QA audit detail"]
      - ["Warehousing and logistics", "Buffers inventory and supports domestic and export dispatch", "1.6 million sq. ft. warehousing network", "No public fill-rate, spoilage, or inventory-turn metrics"]
      - ["Field distribution and channel coverage", "Pushes placement across retail, clinics, pet stores, and e-commerce", "40,000+ outlets plus a large sales organization", "Execution quality depends on channel coordination and in-market discipline"]
    notes: >-
      This architecture is an operating-model reconstruction from assigned public sources, not
      an official process map; null quantitative controls remain open diligence asks.
    claimRefs: [CE005, CE006, CE007, CE008, CE009, CE012, CE015]
