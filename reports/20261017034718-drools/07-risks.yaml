    claimRefs: [CR002, CR003, CR007, CR009, CR011, CR013, CR015, CR016]
callouts:
  - calloutType: risk
    title: Highest-severity public risk
    body: >-
      The underwriting blocker is documentation opacity, not lack of demand proof:
      the Nestlé deal is confirmed, but stake size, governance rights, and broader
      economics remain undisclosed in the assigned public pack.
    claimRefs: [CR001, CR002, CR003, CR016]
  - calloutType: insight
    title: Kill criteria before new capital
    body: >-
      Treat any control-heavy shareholder rights package, restrictive debt covenants,
      or unreported quality/compliance exception as a thesis break until diligence
      proves otherwise.
    claimRefs: [CR011, CR012, CR015, CR016]
