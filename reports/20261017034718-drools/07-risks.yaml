      - Public evidence
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - - Multi-site manufacturing and warehousing complexity outruns visible process evidence
        - Six manufacturing units, 1.6M sq ft warehousing, and ~3,400 employees are cited publicly
        - Medium
        - High
        - Medium
        - Medium-High
        - No retained QA audit, recall, or certification source in the assigned pool
      - - Channel and export execution could amplify inventory, forecasting, and compliance mistakes
        - Public reports cite 40,000+ Indian outlets and exports to 22 countries
        - Medium
        - Medium-High
        - Medium
        - Medium
        - No public split by channel, geography, or distributor performance
      - - Product breadth can increase SKU, sourcing, and demand-planning burden
        - Public coverage describes 650+ SKUs and multiple brands across price points
        - Medium
        - Medium
        - Medium
        - Medium
        - No public SKU profitability, write-off, or service-level data
    notes: These are scale-derived operating risks; the public pack proves footprint, not whether plant, supplier, and quality controls are independently audited.
    claimRefs: [CR007, CR008, CR009, CR014]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty / surface
      - Role
      - Concentration signal
      - Failure scenario
      - Severity
      - Visible mitigation
      - Residual exposure
    rows:
      - - Strategic investor alignment
        - Nestlé
        - Minority investor and valuation catalyst
        - High narrative importance; economics not public
        - Rights package or strategic expectations reduce founder flexibility
        - High
        - Nestlé says the investment is financial and Drools remains independent
        - Medium-High
      - - Financial-institution dependence
        - DBS, HDFC, Axis, Kotak, Bank of Baroda, Federal Bank
        - Working-capital / secured-lending stack
        - Multiple recent charges visible in Tracxn
        - Covenant tightening or refinancing stress restricts operations
        - High
        - Diversified lender set, not a single financier
        - Medium
      - - Channel and platform concentration opacity
        - Modern trade, vet clinics, e-commerce, export distributors
        - Demand distribution and customer access
        - 40,000 outlets and Amazon leadership claims are public; no split is disclosed
        - One route-to-market weakens or becomes margin-dilutive
        - Medium-High
        - Broad outlet count and export presence imply diversified reach
        - Medium
    notes: Public evidence shows which dependencies exist, but not the commercial concentration, covenants, or partner-specific economics that determine downside severity.
    claimRefs: [CR002, CR007, CR008, CR011, CR012, CR016]
