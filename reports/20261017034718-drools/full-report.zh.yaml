              - CV006
              - CV011
              - CV015
              - CV016
      - number: '8.2'
        title: 估值锚点明显改善，但证明材料仍不完整
        blocks:
          - type: paragraph
            body: >-
              最清晰的正面锚点，是从 L Catterton 2023 年 6 月以 $600 million 估值进行 $60 million 少数股权融资，到 Nestlé 入股后 2025
              年独角兽说法的公开演进。这一跃升并非纯粹的故事膨胀：独立来源还描述收入从 FY2024 的 ₹714.90 crore 增至 FY2025 的 ₹932.3
              crore，并拥有广泛分销版图。即便如此，现有证明仍不足以支持完整的投资判断。Financial Express 明确称 Nestlé 买入时的估值未知，Entrackr 和 GlobalPETS
              也都指出交易细节未披露。公开证据还提出而非解决财务质量问题：Entrackr 称 FY2024 以净亏损收官，Startup Indiax 也在竞争加剧的背景下强调同一净亏损压力。             
              结果是，业务规模看起来可信，但价格支撑仍弱于头条独角兽标签所暗示的程度。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.3'
        title: 情景框架应继续锚定已披露的独角兽门槛
        blocks:
          - type: paragraph
            body: >-
              由于公开记录没有披露确切交易条款，情景框架必须保持定性并严格遵守价格纪律。若 FY2025 收入基数被证明具有持久性，Nestlé
              的参与提升商业化却不取得控制权，且利润率或现金转化明显强于公开记录所示，则存在乐观情景。基准情景以当前公开锚点为基础：公司规模足以值得认真关注，但透明度还不足以支持支付明显高于独角兽门槛的价格。悲观情景也可从同一证据推导：若投资者权利优先级高于预期、亏损或营运资金压力持续，或竞争挤压利润率，2023
              年融资以来的表面跃升可能比头条显示的更脆弱。因此，建议对价格保持敏感，而不是只看公司质量。
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV008
              - CV011
              - CV012
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV011
              - CV012
              - CV015
              - CV016
      - number: '8.4'
        title: 最终尽调要求主要围绕估值机制和下行保护
        blocks:
          - type: paragraph
            body: >-
              价值最高的下一步不是泛泛的客户或市场核查，而是估值机制。管理层应披露 Nestlé 的确切持股比例、交易是否包含新股发行或老股流动性、任何清算优先权或棘轮条款，以及交易后的董事会和否决权结构。经审计的
              FY2025 EBITDA、毛利率、营运资金强度和现金生成细节同样必要，因为公开来源目前更清楚地证明了规模，而非质量。公开股权结构也不完整：Tracxn
              指向复杂的所有权和借款结构，但细节不足以清晰判断稀释风险或融资优先级。在这些问题得到回答前，论点可以支持继续跟踪和建立关系，却不足以支持完整的买入判断。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV015
              - CV016
      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 价格纪律比品牌质量更重要
            body: Drools 看起来足够可信，值得继续尽调；但在不知道 Nestlé 持股经济性和下行保护前，公开文件仍不足以支持支付高于独角兽头条的价格。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV011
              - CV015
              - CV016
          - type: callout
            title: 主要估值阻碍是不透明，而不是需求
            body: 最大阻碍不是 Drools 是否有商业动能，而是公开投资者能否把这种动能映射成清晰的股权结构表、利润率画像和下行情景。
            calloutType: risk
            claimRefs:
              - CV004
              - CV006
              - CV008
              - CV015
