chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份与运营版图
        blocks:
          - type: paragraph
            body: >-
              Drools 是一家印度犬猫食品和营养产品制造商，配方强调动物蛋白、兽医参与和受控生产。公开来源对成立时间说法不一：Tracxn 记为 2009 年，而 Financial
              Express、NewsBytes、SoJapan 及一份独立上传的商业模式材料采用 2010 年。如今与该品牌关联的法律实体 Drools Pet Food Private Limited 于 2018 年 9
              月 10 日在恰蒂斯加尔邦注册，目前显示为存续。品牌起源与法律实体注册应分开保留，不能合并成一个成立日期。对一家印度私营宠物食品企业而言，其运营规模已相当可观：2025 年报道提到其拥有 40,000
              多个零售网点、出口至 22 个国家、六个生产基地和 1.6M 平方英尺仓储面积。这些数字只是覆盖范围的快照，仍非经过审计的产能利用率或终端动销数据。
