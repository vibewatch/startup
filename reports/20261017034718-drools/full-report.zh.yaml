  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与统计口径
        blocks:
          - type: paragraph
            body: >-
              对 Drools 而言，最有力的公开市场边界是通过零售、兽医、电商、即时零售和出口渠道销售的包装宠物营养食品，而不是整个印度宠物护理经济。BusinessOutreach 将 Drools
              定位为介于低质量本地饲料和进口高端品牌之间的选择，因此既能看见现有替代品，也不会把美容、医疗、用品或服务当成可互换支出。公开市场数字并非都描述同一口径：BusinessOutreach
              采用宠物食品口径，StartupIndiaX 使用更宽的宠物护理口径，IndianStartupNews 则重复公司对该行业的估算。因此，本章把品类规模、相邻市场和 Drools
              自身收入分开观察，而不是压成一个被夸大的 TAM 数字。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM015
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM006
              - CM007
              - CM013
              - CM015
              - CM016
      - number: '2.2'
        title: 规模口径、增长驱动与约束
        blocks:
          - type: paragraph
            body: >-
              公开品类逻辑方向上有吸引力，但证据仍有限。BusinessOutreach 估算印度宠物食品市场规模为 2025 年 $0.87 billion、2026 年 $0.98 billion、2031 年 $1.68
              billion；同时指出，只有 29% 的宠物犬每天食用商业宠物食品，即时零售宠物食品覆盖 42
              座城市。这些数字说明消费升级和渠道扩张是真实的增长驱动，也说明市场尚未饱和，增长仍主要靠转化。StartupIndiaX 和 IndianStartupNews
              补充了更宽泛的行业增长叙事，但其估算要么基于更宽的宠物护理定义，要么来自公司估算而非披露的方法论。由于公开证据没有按渠道和细分市场拆出 Drools 真正的纯宠物食品
              SAM/SOM，本章把市场视为一组有边界的观察口径，而不是精确的自下而上模型。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM011
              - CM016
