      - number: '3.2'
        title: Drools 最强的护城河是运营广度与补货覆盖
        blocks:
          - type: paragraph
            body: >-
              保留证据中最站得住脚的差异化不是奢侈品牌定位，而是覆盖广度。BusinessLine 和 NewsBytes 都称 Drools 覆盖 40,000 多个零售网点并出口至 22 个国家；BusinessLine
              和 Financial Express 则称其运营六个生产基地、拥有 650+ 个 SKU。StartupIndiaX 和 StartupWired
              描述的上市组合覆盖线上、线下甚至兽医诊所渠道。宠物食品属于补货型品类，货架覆盖、品类广度和持续可得性可能比一次性功能优势更重要。面对创业公司挑战者，这种覆盖抬高了替代门槛，也使多品牌共存比完全切换更可能。
            claimRefs:
