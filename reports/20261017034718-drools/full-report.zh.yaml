      - - 投资逻辑：战略验证
        - Nestlé 取得少数股权；多个来源称 Drools 在战略和运营上仍保持独立。
        - 披露 Nestlé 的权利干预较轻，且不存在实质性压低新资金地位的隐藏优先股堆叠。
      - - 反向逻辑：价格不透明
        - 多个来源称 Nestlé 交易条款未披露，Financial Express 称 Nestlé 入股时的估值未知。
        - 一份完整的股权结构表桥接，列明持股比例、每股价格、新股与老股交易拆分以及治理权利。
      - - 反向逻辑：下行信号
        - Entrackr 报道 FY2024 净亏损，Startup Indiax 称近期净亏损和竞争加剧仍带来挑战。
        - 通过 FY2025 经审计结果证明利润率恢复、营运资金需求稳定且具备竞争韧性。
    notes: 各行将估值支撑与估值阻力分开；若干事实具有特定期间，因此不应合并 FY2024 和 FY2025 指标。
