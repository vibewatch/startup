            body: >-
              指定证据支持的是消费品收入模式，而非经常性软件收入模式。多个独立来源称 Drools 在印度拥有 40,000 多个零售网点，并出口至 22 个国家；PetfoodIndustry 还指出约 25%
              的收入来自线上平台。这种组合说明收入由零售、出口和电商渠道的实物产品销量驱动。最有力的公开收入数据来自 SoJapan 2026 年 9 月的资料：FY2025 收入为 ₹932.3 crore，同比增长
              28.7%；Tracxn 独立估算 FY2025 收入在 ₹500 crore 至 ₹1,000 crore 之间，并报告一年 CAGR 为
              29%。增长方向清晰，但确切收入基数仍来自二手汇总，而不是公开的经审计损益表。
