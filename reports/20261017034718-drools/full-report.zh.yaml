        - label: 产品组合与品牌
          detail: 覆盖多个价格点和饮食需求的 650+ 个 SKU
          modules:
            - label: Drools 核心系列
            - label: Pure Pet / Meat Up
            - label: Canine Creek / Kitty Yum
        - label: 制造基础
          detail: 分布在印度各地的六个单元，将配方转化为包装产品
          outputs:
            - label: Domestic production scale
        - label: 仓储与出口物流
          detail: 1.6 million sq. ft. 的网络为库存和出货流提供缓冲
          outputs:
            - label: Inventory staging
            - label: Export dispatch
        - label: 渠道交付
          detail: 40,000+ 个直营网点，以及电商、兽医和宠物店渠道
          outputs:
            - label: Retail distribution
            - label: Amazon and other e-commerce
            - label: Vet / pet-store reach
        - label: 所有权与赋能
          detail: Nestle 提供资金支持，同时 Drools 保持独立
          outputs:
            - label: Capital support
            - label: Distribution and R&D know-how
    approximationNotes: 这是根据公开来源文字拼出的定性运营栈，不是工程蓝图，也不是逐厂流程图。
    claimRefs:
      - CE002
      - CE005
      - CE006
      - CE007
      - CE008
      - CE010
      - CE011
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据表明，Drools 通过线下、兽医和线上渠道降低试用门槛，再按客群和地域扩张，而不是依赖明确列出的企业客户。
    data:
      items:
        - label: 认知与信任建立
          actor: 印度宠物家长
          channel: 品牌、零售曝光与宠物护理教育
          touchpoints:
            - 面向印度宠物家长的科学营养信息
            - 广泛的实体可得性提高了首次发现机会
        - label: 宠物零售线下试用
          actor: 宠物家长与零售商
          channel: 零售网点
          touchpoints:
            - 公开来源称 Drools 覆盖 30,000+ 至 40,000+ 个印度零售网点
            - 二线和三线城市的可得性是反复出现的证明点
        - label: 兽医或繁育者推荐
          actor: 兽医、繁育者与宠物家长
          channel: 兽医诊所与专业建议
          touchpoints:
            - Ascendants 引用了与兽医和繁育者的合作
            - 处方和专业饮食扩大了推荐场景
        - label: 电商带来的复购便利
          actor: 宠物家长
          channel: Amazon 及其他数字市场
          touchpoints:
            - 来源称 Drools 是 Amazon 上的领先卖家或主要参与者
            - 公开证据仍缺乏已披露的复购率或队列数据
        - label: 通过产品组合广度拓展客群
          actor: 不同价格带的宠物家长
          channel: 平价、高端和处方系列
          touchpoints:
            - 650+ 个 SKU 覆盖高性价比、高端和处方饮食
            - PetPitch 将 Drools 定位为 Purina 高端细分市场的平价市场补充
        - label: 地域扩张与战略支持
          actor: 出口分销商与未来渠道合作伙伴
          channel: 覆盖 22 个国家的出口足迹与投资者支持
          touchpoints:
            - 多个来源称产品出口至 22 个国家
            - Nestlé 表示，投资后 Drools 仍保持运营独立
    claimRefs:
      - CU001
      - CU005
      - CU006
      - CU008
      - CU009
      - CU011
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 公开记录显示，Drools 的主要风险集中在披露不透明和规模化执行，而不是某个已获证实的监管执法事件。
    data:
      columns:
        - label: 可能性
          detail: 12-18 个月投资判断周期
        - label: 影响
          detail: 风险实现后对估值、控制权或持续经营的下行影响
        - label: 缓释成熟度
          detail: 指定公开证据中仅可见的控制措施
        - label: 剩余风险敞口
          detail: 可见缓释措施实施后的剩余敞口
      rows:
        - label: 未披露的投资条款
          note: 少数股权是公开信息；治理安排并未公开。
          values:
            - label: 中
            - label: 高
            - label: 低
            - label: 高
        - label: 制造和质量控制规模
          note: 足迹是公开信息，但第三方流程验证不是。
          values:
            - label: 中
            - label: 高
            - label: 中
            - label: 中高
        - label: 多贷款机构资本依赖
          note: 抵押登记可见；契约和到期结构不可见。
          values:
            - label: 中
            - label: 高
            - label: 中
            - label: 中
        - label: 渠道集中度不透明
          note: 触达范围是公开信息，但进入市场的渠道拆分不是。
          values:
            - label: 中
            - label: 中高
            - label: 中
            - label: 中
        - label: 所有权与董事会权利不透明
          note: 有可见的股权结构表片段，但确定性的权利安排并未公开。
          values:
            - label: 中
            - label: 中
            - label: 低
            - label: 中
        - label: 盈利能力与现金用途透明度
          note: 增长是公开信息；经审计利润率、现金跑道和资金用途不是。
          values:
            - label: 中
            - label: 中高
            - label: 低
            - label: 中
    approximationNotes: 矩阵单元格是锚定引用事实和明确证据缺口的分析师分类，不是来源作者给出的风险评分。
    claimRefs:
      - CR002
      - CR003
      - CR007
      - CR009
      - CR011
      - CR013
      - CR015
      - CR016
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 规模和战略验证确实存在，但交易机制未披露、盈利能力披露有限，因此推荐仍为继续研究。
    data:
      nodes:
        - id: n1
          label: 2023 年估值锚点
          summary: $60 million at a $600 million valuation set the last clearly disclosed benchmark.
          claimRefs:
            - CV002
        - id: n2
          label: 2025 年战略验证
          summary: Nestlé's minority investment supports relevance, but not a clean public price bridge.
          claimRefs:
            - CV001
            - CV003
            - CV013
        - id: n3
          label: 运营规模
          summary: FY2025 revenue, retail reach, exports, and manufacturing footprint indicate real commercial scale.
          claimRefs:
            - CV004
            - CV010
            - CV014
        - id: n4
          label: 盈利能力与竞争风险
          summary: FY2024 net loss and competitive pressure limit confidence in premium underwriting.
          claimRefs:
            - CV006
            - CV012
        - id: n5
          label: 披露缺口
          summary: Stake size, price mechanics, preferences, and governance rights remain undisclosed.
          claimRefs:
            - CV001
            - CV008
            - CV009
            - CV011
        - id: n6
          label: 推荐
          summary: research-more / stretched / high risk until terms and audited economics are disclosed.
          claimRefs:
            - CV015
            - CV016
      edges:
        - from: n1
          to: n2
          label: 估值跃升
          claimRefs:
            - CV002
            - CV003
        - from: n2
          to: n3
          label: 需要规模支撑
          claimRefs:
            - CV003
            - CV004
        - from: n3
          to: n4
          label: 被……抵消
          claimRefs:
            - CV004
            - CV006
        - from: n4
          to: n5
          label: 因……而恶化
          claimRefs:
            - CV006
            - CV011
        - from: n5
          to: n6
          label: 推动
          claimRefs:
            - CV015
            - CV016
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV006
      - CV011
      - CV015
      - CV016
