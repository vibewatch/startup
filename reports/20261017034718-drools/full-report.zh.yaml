      - number: '3.3'
        title: Nestlé 验证了品类，但 Purina 仍在竞争框架内
        blocks:
          - type: paragraph
            body: >-
              少数股权投资并没有消除与既有巨头的重叠。Financial Express 和 BusinessLine 都指出，Nestlé 入股前已通过 Purina 在印度开展宠物食品业务；Just-food
              则提供了全球规模背景，报道 Nestlé 2024 年宠物护理销售额为 SFr18.88bn，且 Purina 仍在扩充产能。同时，Financial Express、NewsBytes 和 Just-food
              都报道 Drools 将保持战略和运营独立。这种组合指向竞合关系：Nestlé 验证了 Drools，也可能推动该品类专业化，但公开证据没有显示 Purina 已放弃高端市场目标，或渠道冲突已通过合同消除。
            claimRefs:
              - CP008
              - CP009
              - CP012
      - number: '3.4'
        title: 持久性目前体现在覆盖和广度，而非透明定价
        blocks:
          - type: paragraph
            body: >-
              实际推论是：当买家看重可得性、品类选择和本土供应链控制时，Drools 最难被替代。StartupWired 提到 Dogsee Chew 和
              Supertails，说明新资本仍在流入相邻宠物护理模式；同一来源称，本土挑战者靠服务型或美食型定位吸引注意，而非复制类似的制造规模。保留的公开证据没有提供 Drools 相对于 Pedigree、Purina
              或本土专业品牌的 SKU 标准化挂牌价、零售商条款或促销力度。因此，护城河在覆盖和广度上的逻辑可信，但单位经济性、价格弹性和消费升级韧性仅有部分证据支持。
            claimRefs:
              - CP013
              - CP014
              - CP015
      - number: '3.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 最清晰的护城河是广度，而不是夸耀的定价
            body: 保留证据对分销、制造和品类广度的支持最强，但不足以证明 Drools 相对于 Pedigree、Purina 或专业品牌在匹配 SKU 定价上具有结构性优势。因此，持久优势首先应按覆盖和补货便利性来评估。
            calloutType: insight
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP014
          - type: callout
            title: Purina 带来竞合，而不是清晰的空白市场
            body: >-
              Nestlé 的投资验证了该品类和 Drools，但公开证据仍显示 Purina 是印度市场的活跃基准品牌，而全球宠物护理对 Nestlé
              而言是规模庞大的业务。由于缺乏公开治理或渠道披露，投资者还无法判断这段关系主要是降低竞争，还是会在高端细分市场加剧竞争。
            calloutType: risk
            claimRefs:
              - CP008
              - CP009
              - CP012
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与公开增长迹象
        blocks:
