        title: 成本结构与单位经济性可见度
        blocks:
          - type: paragraph
            body: >-
              公开运营规模指标显示，这是一项制造、仓储和渠道服务成本都很高的业务。2025 年 5 月报道提到六个生产基地、约 160 万平方英尺仓储面积、650+ 个 SKU，以及约 3,400 名员工，其中包括 1,800
