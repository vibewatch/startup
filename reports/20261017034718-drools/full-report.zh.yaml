  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 指示性估值区间
      - 估值 / 回报逻辑
      - 概率信号
    rows:
      - - 乐观情景
        - FY2025 的收入规模保持不变，审计后的经济状况好于预期，Nestlé 的权利在商业上有帮助，但对财务的干预较轻。
        - 高于已披露的独角兽门槛
        - 只有当规模、质量和治理相对于公开记录同步改善时，公司才可能获得溢价。
        - 需要有经审计的 FY2025 盈利能力，以及比目前可获得信息更清晰的条款披露。
      - - 基准情景
        - 增长保持稳健，独立性得到保留，但交易条款和经济条件仍只披露了一部分。
        - 接近已披露的独角兽门槛
        - 这是与当前公开证据最接近的情景：具备真实规模和战略验证，但透明度不足以支撑溢价。
        - 与当前披露的证据集最匹配。
      - - 悲观情景
        - 投资者权利比预期更优先，利润率压力持续，或竞争削弱了从收入增长走向现金创造的路径。
        - 低于已披露的独角兽门槛
        - 如果独角兽标签最终建立在薄弱的经济基础或偏向投资者的结构上，2023 至 2025 年的跃升可能会回吐。
        - 如果尽调无法厘清股权结构表、盈利能力或下行保护问题，就会触发。
    notes: 这些区间有意保持定性，因为公开来源没有披露 Nestlé 的持股规模、每股价格或优先股堆叠。
    claimRefs:
      - CV003
      - CV004
      - CV006
      - CV011
      - CV012
      - CV015
      - CV016
