      - number: '1.2'
        title: 资本结构与规模
        blocks:
          - type: paragraph
            body: >-
              已披露的融资历史有两个关键节点。Tracxn 记录了 2023 年 6 月 20 日 L Catterton 的 $60 million 私募股权融资，但其给出的投后估值为 $474 million，与
              Financial Express 报道的同一笔投资对应 $600 million 估值相冲突。2025 年 5 月，Nestlé 收购少数股权，并表示 Drools 将保持战略和运营独立。Nestlé
              还表示不会披露其他条款；Financial Express 则另行指出，Nestlé 投资时的价格和估值未知。因此，广泛报道的 $1 billion
              估值应视为第三方估值标记，而非已披露的交易价格。较新的运营指标包括 SoJapan 报道的 FY2025 收入 ₹932.3 crore，同比上升 28.7%，以及 Tracxn 报道的截至 2026 年 4 月
              30 日员工数 4,195 人。两项指标都不能证明当前现金可用性、盈利能力或客户经济性。
