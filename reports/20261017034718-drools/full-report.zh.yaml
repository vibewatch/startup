      - number: '2.3'
        title: 买家分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              证据显示，这是一笔带有信任背书的家庭可选消费，而非企业采购。BusinessOutreach、Scribd 和创业媒体报道共同表明，Drools
              面向犬猫提供经济型、核心型、高端型、零食、补充剂和处方相关产品，意味着同一营养流程存在多个切入点。采用路径似乎是全渠道可得性叠加兽医或科学依据带来的信任：广泛的传统零售和电商扩大覆盖，兽医支持的配方及高端子品牌则推动消费升级。Drools
              自身的运营规模也很关键：40,000 多个零售网点、六个生产基地、出口至 22 个国家以及庞大的销售队伍，使上市路径成为市场进入逻辑的核心，而不只是获得市场份额后的结果。
            claimRefs:
              - CM009
              - CM010
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 转化比家庭数量本身更重要
            body: 公开证据表明，Drools 更可能受益于把现有宠物家庭转化为稳定的商业宠物食品用户，而不是单纯押注宠物拥有率快速提升。
            calloutType: insight
            claimRefs:
              - CM004
              - CM005
              - CM008
          - type: callout
            title: 公开 TAM 测算仍然混杂
            body: 现有数字混合了宠物食品、更广义的宠物护理以及公司估算叙事；在细分市场和渠道证据披露前，估值工作只能把公开市场规模当作方向性参考。
            calloutType: risk
            claimRefs:
              - CM006
              - CM007
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图不止一组本土同业
        blocks:
          - type: paragraph
            body: >-
              指定证据池不支持把竞争简化为“Drools 对一家竞争对手”。StartupIndiaX 称 Drools 进入的是由 Pedigree 和 Mars PetCare 主导的市场；India-Marketing
              则称印度宠物食品长期由进口品牌引领，Drools 凭借价格和分销赢得份额。StartupWired 又补充了本土专业品牌阵营，包括 Wiggles、Heads Up For Tails 和 Benny's
              Bowl；它们强调健康或美食体验，而不是复制 Drools 的工厂规模。Tracxn 的可比公司名单仍把 Mars 列为 Drools
              的基准同业，说明相关竞争版图横跨全球既有巨头、本土专业品牌和相邻宠物护理进入者，而不是单一本土品牌食品队列。
            claimRefs:
