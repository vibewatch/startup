      - number: '1.3'
        title: 管理层、治理与尽调状态
        blocks:
          - type: paragraph
            body: >-
              Fahim Sultan 一贯被列为创始人，Tracxn 还将 Bahadur Ali 列为联合创始人，并将该业务与 IB Group 联系起来。目前法律实体的董事会据报由 Fahim Sultan
              Ali、Sultan Ali 和 Danish Ali 组成；具名董事集中于创始团队，说明关键人物和家族控制风险可能较高，但现有证据无法确认投票权或委员会独立性。公司资料将 Danish Ali
              描述为独立董事，但在指定证据中没有找到公开董事会章程、委员会结构或 Nestlé
              治理权利。投资者在采信运营独立这一说法前，需要查看当前股权结构表、股东协议、保留事项清单、董事会会议记录和继任计划。本章最主要的反向发现正是 Nestlé
              条款未披露：这使投资者无法确认稀释、清算优先权、战略权利，或 $1 billion 的头条估值是否直接对应该交易。
