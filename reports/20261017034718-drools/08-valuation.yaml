callouts:
  - calloutType: "recommendation"
    title: "Price discipline matters more than brand quality"
    body: "Drools looks credible enough to keep in diligence, but the public file still cannot justify paying above the unicorn headline without knowing the Nestlé stake economics and downside protections."
    claimRefs: ["CV003", "CV011", "CV015", "CV016"]
  - calloutType: "risk"
    title: "Opacity, not demand, is the main valuation blocker"
    body: "The biggest blocker is not whether Drools has commercial momentum; it is whether public investors can map that momentum into a clean cap table, margin profile, and downside case."
    claimRefs: ["CV004", "CV006", "CV008", "CV015"]
