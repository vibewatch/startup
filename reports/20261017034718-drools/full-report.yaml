              - CI012
              - CI015
              - CI016
      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              The funding story is easier to describe than to underwrite. Nestlé S.A. took a minority stake in Drools
              and both Nestlé and independent reporting say the company will remain strategically and operationally
              independent, but the cheque size and exact stake percentage were not disclosed. That means the jump from
              the prior June 2023 L Catterton round to unicorn status is visible as an outcome, not as a transparent
              transaction multiple. Tracxn also lists paid-up capital of ₹310 crore, authorized capital of ₹311 crore,
              and 36 loans or charges, including large 2025 facilities from banks such as HDFC, DBS, and Axis. The
              implication is not distress by itself, but a financing structure where working capital and formal credit
              lines likely matter materially.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI011
              - CI012
              - CI014
              - CI016
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Financially, Drools looks like a scaled branded-pet-food company with credible channel breadth and
              continued investor support, not a business whose public materials yet reveal clean software-style unit
              economics. The valuation signal from the Nestlé deal is directionally positive, but the missing stake
              size, missing cheque size, and absence of published margin or runway detail keep the capital-adequacy
              conclusion provisional. The most important next-step requests are audited FY2025 statements, channel and
              SKU gross-margin splits, inventory and receivables turns, debt schedule and covenants, and evidence that
              the manufacturing-footprint discrepancy is simply a definitional issue rather than a reporting
              inconsistency. Until those are disclosed, revenue quality is more visible than margin quality.
            claimRefs:
              - CI009
              - CI010
              - CI012
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale is corroborated; economics are not
            body: >-
              Retail reach, export breadth, and top-line growth are supported by multiple sources, but public evidence
              still stops short of realized pricing, gross margin, or CAC/payback detail.
            calloutType: insight
            claimRefs:
              - CI004
              - CI005
              - CI009
              - CI010
              - CI015
          - type: callout
            title: Unicorn status does not equal capital clarity
            body: >-
              The Nestle round confirms external validation, but missing cheque size, missing stake percentage, and 36
              registered charges leave capital adequacy and ownership economics under-documented.
            calloutType: risk
            claimRefs:
              - CI001
              - CI011
              - CI012
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and customer workflow
        blocks:
          - type: paragraph
            body: >-
              The product is packaged pet nutrition rather than a digital tool: independent coverage says Drools sells
              food for dogs and cats across dry food, wet food, and treats, while also extending into
              higher-consideration diets such as high-protein and veterinary-led offerings. The practical customer
              workflow is repeat household feeding plus omnichannel replenishment, not technical integration. Sources
              describe availability through 40,000+ retail outlets, exports to 22 countries, Amazon and other e-commerce
              channels, and pet-store or clinic-linked distribution, which together make the product easier to access
              than many import-led alternatives. The evidence supports breadth and physical reach; it does not yet
              support SKU-level sell-through, repeat-purchase behavior, or outcome data by diet line.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
