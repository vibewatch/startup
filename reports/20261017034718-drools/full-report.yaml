      - number: '5.2'
        title: Operating architecture and maturity
        blocks:
          - type: paragraph
            body: >-
              Publicly visible operating maturity comes from physical infrastructure. Multiple independent reports say
              Drools runs six manufacturing units across India and backs them with a 1.6 million square foot warehousing
              network; Tracxn separately says the legal entity's turnover is majority manufacturing. News coverage also
              cites about 3,400 employees, including roughly 1,800 or nearly half in sales roles, which indicates that
              execution depends on field distribution, merchandising, and channel coverage as much as formulation.
              Nestle's own announcement matters because it explicitly frames the investment as financial and says Drools
              remains strategically and operationally independent, so the current architecture should be read as
              continuity plus added capacity support rather than post-acquisition integration.
            claimRefs:
