  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments are broad, but the public proof is channel-first
        blocks:
          - type: paragraph
            body: >-
              The retained evidence describes Drools as a consumer pet-nutrition business whose buyers and payers are
              primarily Indian pet parents, while user influence also runs through veterinarians, breeders, and physical
              retail intermediaries. Multiple sources converge on a large offline footprint, but the disclosed customer
              proof is much stronger on access surfaces than on named production deployments or contract evidence. That
              matters because Drools appears to win through availability, affordability, and science-led positioning
              across a wide portfolio rather than a small number of identifiable anchor accounts. Public materials also
              suggest the company uses the same portfolio breadth to span value-conscious mass-market demand, premium
              urban demand, and veterinary-adjacent use cases, which supports reach but still leaves revenue mix by
              segment opaque.
            claimRefs:
              - CU001
              - CU003
              - CU005
              - CU006
              - CU008
              - CU009
