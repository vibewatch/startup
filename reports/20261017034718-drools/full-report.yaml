  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal scoring from retained evidence shows Drools strongest on distribution breadth among local players, while
      global incumbents still anchor the trust-and-scale ceiling.
    data:
      xAxis:
        label: Distribution breadth and replenishment reach
        min: 1
        max: 5
        low: Niche or emerging reach
        high: National or global shelf reach
        description: Ordinal 1-5 scoring from retained public evidence only
        scale: ordinal
      yAxis:
        label: Breadth of platform, science, and trust assets
        min: 1
        max: 5
        low: Narrow or emerging proposition
        high: Broad or deeply trusted platform
        description: Ordinal 1-5 scoring from retained public evidence only
        scale: ordinal
      points:
        - label: Drools
          x: 4
          'y': 4
          detail: 40,000+ outlets, 22-country exports, six plants, 650+ SKUs, and science-backed positioning.
        - label: Mars / Pedigree
          x: 5
          'y': 4
          detail: Legacy incumbent benchmark in India and still part of Tracxn's external competitor set.
        - label: Purina
          x: 4
          'y': 5
          detail: Already active in India and backed by Nestlé's SFr18.88bn global petcare business.
        - label: Local specialists
          x: 2
          'y': 2
          detail: >-
            Heads Up For Tails, Wiggles, and Benny's Bowl are differentiated, but comparable scale is not evidenced
            here.
        - label: Adjacent entrants
          x: 2
          'y': 2
          detail: Dogsee Chew and Supertails broaden rivalry through treats, services, and clinic adjacency.
        - label: Imported status quo
          x: 3
          'y': 3
          detail: Imported brands remained the old category default before Drools scaled local manufacturing and distribution.
    approximationNotes: >-
      The coordinates are evidence-backed ordinal judgments from the assigned public pool, not market-share measurements
      or inferred conversion rates.
    claimRefs:
      - CP001
      - CP003
      - CP004
      - CP005
      - CP008
      - CP009
      - CP011
      - CP013
      - CP015
  - id: FI001
    title: Revenue model flow from manufacturing footprint to visible revenue
    type: flow
    summary: >-
      Public sources show a physical-goods model moving through manufacturing, broad distribution, export, and
      e-commerce, but the bridge to gross profit remains undisclosed.
    data:
      nodes:
        - id: manufacturing
          label: Manufacturing footprint
          displayValue: 3 facilities / 6 units
          detail: >-
            PetfoodIndustry described three facilities and ~89,400 metric tons annual capacity; May 2025 reporting
            described six manufacturing units.
        - id: portfolio
          label: Portfolio breadth
          displayValue: 650+ SKUs
          detail: May 2025 reporting also described a broad portfolio spanning premium, value, and prescription diets.
        - id: retail
          label: Physical distribution
          displayValue: 40,000+ retail outlets
        - id: exports
          label: Export reach
          displayValue: 22 countries
        - id: ecommerce
          label: Online contribution
          displayValue: ~25% of revenue
          detail: PetfoodIndustry said about 25% of revenue comes from online platforms.
        - id: revenue
          label: FY2025 public revenue signal
          displayValue: ₹932.3 crore summary / ₹500 Cr to ₹1,000 Cr band
        - id: margin
          label: Gross profit visibility
          displayValue: Undisclosed
          detail: Assigned public evidence does not disclose audited gross margin or contribution margin.
      edges:
        - from: manufacturing
          to: portfolio
          label: Produces product breadth
        - from: portfolio
          to: retail
          label: Distributed through offline channels
        - from: retail
          to: exports
          label: Scales beyond domestic shelf space
        - from: exports
          to: ecommerce
          label: Mix includes online channels
        - from: ecommerce
          to: revenue
          label: Converts sell-through into public revenue signals
        - from: revenue
          to: margin
          label: Margin bridge remains private
